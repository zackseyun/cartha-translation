id: MAT.1.24
reference: Matthew 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: de
  text: Als Josef aus dem Schlaf erwacht war, tat er, was der Engel des Herrn ihm befohlen hatte, und nahm seine Frau zu sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm seine Frau bei sich auf“ beziehungsweise „nahm seine Frau in sein Haus“. Das griechische Verb kann ausdrücken, dass jemand zu sich oder in den eigenen Haushalt genommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς … ἀπὸ τοῦ ὕπνου
  choice: Als … aus dem Schlaf erwacht war
  rationale: Die temporale Konstruktion gibt das vorzeitige Partizip idiomatisch und zugleich eng am griechischen Ablauf wieder.
- source_word: δὲ
  choice: unübersetzt; temporaler Anschluss durch „Als“
  rationale: δέ führt die Erzählung weiter und bezeichnet hier keinen starken Gegensatz. Im Deutschen stellt bereits der einleitende Temporalsatz den natürlichen narrativen Anschluss her.
- source_word: ἐποίησεν ὡς
  choice: tat …, was
  rationale: Die deutsche Formulierung drückt klar aus, dass Josefs Handeln dem erteilten Befehl entsprach; ein wörtliches „tat, wie“ wäre hier weniger natürlich.
- source_word: προσέταξεν
  choice: befohlen hatte
  rationale: προστάσσω bezeichnet eine verbindliche, autoritative Anweisung. Das Plusquamperfekt wahrt die zeitliche Abfolge im deutschen Satz.
- source_word: ὁ ἄγγελος κυρίου
  choice: der Engel des Herrn
  rationale: Dies ist die transparente und im biblischen Deutsch etablierte Wiedergabe der Genitivverbindung.
- source_word: παρέλαβεν
  choice: nahm … zu sich
  rationale: παραλαμβάνω kann bedeuten, jemanden anzunehmen beziehungsweise zu sich oder in den eigenen Haushalt zu nehmen. „Zu sich nehmen“ bewahrt diesen relational-räumlichen Sinn besser als das im Deutschen missverständliche bloße „nehmen“.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: seine Frau
  rationale: γυνή bezeichnet im gegebenen rechtlich-ehelichen Zusammenhang Josefs Frau, ohne damit über den Vollzug der Ehe hinauszugehen.
theological_decisions:
- issue: Wiedergabe von γυνή vor dem in Vers 25 erwähnten ehelichen Verkehr
  choice: seine Frau
  alternative: die Frau
  rationale: Matthäus beschreibt Maria bereits innerhalb des rechtlich-ehelichen Rahmens. „Seine Frau“ gibt diesen Status wieder, ohne eine Aussage über den Vollzug der Ehe hinzuzufügen.
- issue: Wiedergabe von κύριος in ἄγγελος κυρίου
  choice: der Engel des Herrn
  alternative: der Engel Jahwes / der Engel des Herrn als possessive Umschreibung
  rationale: „Der Engel des Herrn“ wahrt die griechische Formulierung und den vertrauten biblischen Ausdruck, ohne die im griechischen Text stehende Bezeichnung durch den Gottesnamen zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur ist natürlich deutsch, bewahrt aber die zeitliche Abfolge und den autoritativen Charakter des Befehls. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung.
