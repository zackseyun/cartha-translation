id: MAT.1.19
reference: Matthew 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: de
  text: Josef aber, ihr Mann[a], war gerecht und wollte sie nicht öffentlich bloßstellen[b]. Deshalb beschloss er, sich in aller Stille von ihr zu scheiden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Verlobter“. Wörtlich steht im Griechischen „ihr Mann“; die jüdische Verlobung war bereits rechtlich bindend.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie an den Pranger stellen“ beziehungsweise „öffentlich der Schande preisgeben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „sie im Verborgenen entlassen“. Gemeint ist hier die formelle Auflösung der rechtlich bindenden Verlobung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: ihr Mann
  rationale: ἀνήρ bezeichnet hier aufgrund der rechtlich bindenden Verlobung und des folgenden ἀπολῦσαι den Ehemann beziehungsweise rechtlich verbundenen Mann. „Ihr Mann“ ist im Deutschen natürlich; die besondere Phase der Beziehung wird in der Fußnote erläutert.
- source_word: δίκαιος
  choice: gerecht
  rationale: „Gerecht“ bewahrt die ethische und biblisch-theologische Weite von δίκαιος, ohne festzulegen, ob vor allem Gesetzestreue, Lauterkeit oder erbarmungsvolle Rücksicht gemeint ist.
- source_word: δειγματίσαι
  choice: öffentlich bloßstellen
  rationale: Das Verb bezeichnet ein zur Schau Stellen, das Schande nach sich zieht. „Öffentlich bloßstellen“ gibt diesen Zusammenhang im heutigen Deutsch klar wieder.
- source_word: ἐβουλήθη
  choice: beschloss
  rationale: βούλομαι bezeichnet hier einen erwogenen Willensentschluss. „Beschloss“ bringt die überlegte Absicht prägnant zum Ausdruck.
- source_word: λάθρᾳ
  choice: in aller Stille
  rationale: λάθρᾳ bezeichnet ein verborgenes oder nicht öffentliches Vorgehen. „In aller Stille“ ist idiomatisch und vermeidet den möglicherweise anrüchigen Beiklang von „heimlich“.
- source_word: ἀπολῦσαι αὐτήν
  choice: sich von ihr zu scheiden
  rationale: Im Kontext einer rechtlich bindenden jüdischen Verlobung meint ἀπολύω die formelle Auflösung der Verbindung. Die reflexive deutsche Wendung ist natürlich und macht die rechtliche Tragweite verständlich.
- source_word: δὲ
  choice: aber
  rationale: δέ führt Josef in einem leichten Gegensatz zur zuvor geschilderten Lage ein. „Aber“ gibt diese diskrete adversative Funktion wieder.
- source_word: ὢν καὶ μὴ θέλων
  choice: war gerecht und wollte nicht
  rationale: Die beiden Partizipien liefern den Hintergrund für Josefs Entschluss. Eine finite deutsche Formulierung ist flüssiger und bewahrt ihre sachliche Verknüpfung.
theological_decisions:
- issue: Charakterisierung Josefs als δίκαιος
  choice: „gerecht“, ohne den Begriff auf Gesetzestreue oder Barmherzigkeit einzuengen
  alternative: „rechtschaffen“ oder eine deutende Umschreibung, die ausschließlich seine Milde betont
  rationale: Der griechische Text verbindet Josefs Gerechtigkeit mit seinem Unwillen, Maria bloßzustellen, erklärt das Verhältnis aber nicht näher. Die Übersetzung erhält diese theologische und ethische Spannung.
- issue: Rechtlicher Status von Josef und Maria
  choice: „ihr Mann“ und „sich von ihr scheiden“
  alternative: „ihr Verlobter“ und „die Verlobung lösen“ oder wörtlicher „sie entlassen“
  rationale: Die jüdische Verlobung war rechtlich bindend und musste formell aufgelöst werden. Die gewählten Begriffe vermitteln diese Tragweite, während die Fußnoten die historische Besonderheit und die wörtlichere Alternative festhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung und „Deshalb“ machen den begründenden Zusammenhang der Partizipialkonstruktion natürlich verständlich, ohne die Spannung zwischen Josefs Gerechtigkeit und seiner Rücksichtnahme auszudeuten.
