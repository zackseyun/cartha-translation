source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: de
  text: Josia zeugte Jojachin und seine Brüder zur Zeit der Wegführung nach Babylon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während der Verbannung nach Babylon“. Das griechische Wort kann die erzwungene Umsiedlung beziehungsweise das Exil bezeichnen; „Wegführung“ hebt den Vorgang hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der matthäischen Genealogie bezeichnet γεννάω die männliche Abstammung. „zeugte“ ist im Deutschen die knappe, etablierte Wiedergabe der wiederkehrenden genealogischen Formel und lässt eine mögliche genealogische Verkürzung unaufgelöst.
- source_word: Ἰεχονίαν
  choice: Jojachin
  rationale: „Jojachin“ ist die im Deutschen gebräuchliche biblische Namensform für den hier genannten judäischen König; sie stellt zugleich den Bezug zur alttestamentlichen Gestalt her.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: seine Brüder
  rationale: Der griechische Ausdruck steht ausdrücklich im maskulinen Plural und bezeichnet hier männliche Verwandte derselben Generation.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: zur Zeit der Wegführung nach Babylon
  rationale: μετοικεσία bezeichnet eine erzwungene Umsiedlung beziehungsweise Deportation. „Wegführung“ ist verständlich, würdig und im biblisch-historischen Zusammenhang geläufig; „zur Zeit“ gibt die temporale Funktion von ἐπί mit Genitiv wieder, und „nach Babylon“ bezeichnet das Ziel.
- source_word: δὲ
  choice: nicht gesondert wiedergegeben
  rationale: δέ ist hier ein schwaches Bindeglied innerhalb der Genealogie. Eine ausdrückliche Wiedergabe ist für natürliches modernes Deutsch nicht erforderlich.
theological_decisions:
- issue: Genealogische Verkürzung in der Abstammungslinie bei Matthäus
  choice: Die im Griechischen formulierte genealogische Aussage wird direkt wiedergegeben, ohne historische Fragen im Haupttext aufzulösen.
  alternative: γεννάω ausdrücklich im weiteren Sinn als „war ein Vorfahr von“ wiederzugeben.
  rationale: Genealogien können Generationen überspringen. Die Übersetzung soll diese Möglichkeit weder ausschließen noch durch eine harmonisierende Paraphrase festlegen; „zeugte“ bewahrt die Formel und die Spannung des Ausgangstextes.
- issue: Zeitliche Zuordnung von Jojachins Zeugung zur babylonischen Wegführung
  choice: Die zeitliche Formulierung des griechischen Textes bleibt unverändert stehen.
  alternative: Die Formulierung historisch erklärend umzugestalten oder auf Josias unmittelbare Nachkommenschaft zu beziehen.
  rationale: Der Wortlaut verbindet den genealogischen Eintrag mit der Zeit der Wegführung. Eine Übersetzung darf die daraus entstehenden chronologischen Fragen nicht stillschweigend lösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem genealogischem Ton. Die traditionelle Formel „zeugte“ und der historisch-biblische Ausdruck „Wegführung“ sind knapp und im Zusammenhang klar; die Fußnote erläutert die mögliche Nuance „Verbannung/Exil“.
