id: MAT.1.9
reference: Matthew 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: de
  text: Usija zeugte[a] Jotam, und Jotam zeugte Ahas, und Ahas zeugte Hiskia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische ἐγέννησεν bedeutet in dieser väterlichen Abstammungsliste »zeugte«; sinngemäß auch: »wurde der Vater von«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Usija
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform stellt den Bezug zu dem gleichnamigen König im Alten Testament her.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die einzelnen Glieder der Abstammungsliste als milde Verknüpfung weiter. »Und« gibt diesen fortlaufenden Zusammenhang natürlich wieder, ohne einen unnötigen Gegensatz anzudeuten.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der väterlich formulierten Abstammungsliste bezeichnet γεννάω das Hervorbringen eines Nachkommen. »Zeugte« ist knapp, präzise und bewahrt die wiederholte Struktur des griechischen Textes.
- source_word: Ἰωαθάμ
  choice: Jotam
  rationale: Die übliche deutsche biblische Namensform für den judäischen König.
- source_word: Ἀχάζ
  choice: Ahas
  rationale: Die übliche deutsche biblische Namensform wahrt die Verbindung zum Alten Testament.
- source_word: Ἑζεκίαν
  choice: Hiskia
  rationale: Die übliche deutsche biblische Namensform für den judäischen König.
theological_decisions:
- issue: Genealogische Bedeutung von γεννάω
  choice: Als unmittelbare genealogische Aussage mit »zeugte« wiedergegeben.
  alternative: »war ein Vorfahr von« oder »wurde der Vater von«
  rationale: Die wiederkehrende Formel stellt hier eine väterliche Abfolge dar. »Zeugte« bewahrt sowohl die Aussagekraft als auch den literarischen Rhythmus, ohne den Text zur allgemeineren Vorfahrenschaft auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertrauten deutschen Namensformen stellen die Verbindung zu den Königen des Alten Testaments her; die wiederholte Satzform bildet den Rhythmus der griechischen Genealogie ab.
