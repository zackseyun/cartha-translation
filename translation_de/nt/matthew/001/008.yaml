id: MAT.1.8
reference: Matthew 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: de
  text: Asaf zeugte Joschafat[a], Joschafat zeugte Joram, und Joram zeugte Usija.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Asa“ statt „Asaf“; „Asa“ entspricht auch dem Namen des judäischen Königs in der alttestamentlichen Genealogie.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Der griechische Text des SBLGNT bietet Ἀσάφ; entsprechend wird der Name im Haupttext als „Asaf“ wiedergegeben, ohne ihn stillschweigend an die alttestamentliche Genealogie anzugleichen.
- source_word: δὲ
  choice: unmarkierte Verknüpfung; im letzten Glied „und“
  rationale: δέ ist hier ein schwaches, nicht adversatives Bindewort. Natürliches Deutsch braucht keine dreimalige ausdrückliche Wiedergabe; die abschließende Konjunktion bewahrt die Reihung.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: „Zeugte“ ist im Deutschen die knappe und etablierte genealogische Entsprechung und bezeichnet die väterliche Abstammung, ohne die altertümliche Form „begat“ nachzuahmen.
- source_word: Ἰωσαφάτ
  choice: Joschafat
  rationale: Gebräuchliche deutsche Namensform des judäischen Königs.
- source_word: Ἰωράμ
  choice: Joram
  rationale: Die Form entspricht dem griechischen Ἰωράμ und der üblichen deutschen Wiedergabe.
- source_word: Ὀζίαν
  choice: Usija
  rationale: „Usija“ ist die gebräuchliche deutsche Form des Königsnamens und für Leser vertrauter als eine unmittelbare Umschrift wie „Ozias“.
theological_decisions:
- issue: Wiedergabe der genealogischen Folge mit wiederholtem δὲ und ἐγέννησεν
  choice: Die drei Vater-Sohn-Glieder werden jeweils mit „zeugte“ wiedergegeben und durch Kommas sowie ein abschließendes „und“ verbunden.
  alternative: Jedes δέ ausdrücklich mit „und“ oder „dann“ wiedergeben.
  rationale: Die gewählte Form ist natürliches modernes Deutsch und erhält zugleich jedes einzelne genealogische Glied und die genaue Reihenfolge.
- issue: Ob Ἀσὰφ im Haupttext an den historisch erwarteten Namen Asa angeglichen werden soll
  choice: „Asaf“ bleibt im Haupttext; „Asa“ wird in einer Fußnote als Lesart und genealogisch erwarteter Name genannt.
  alternative: Im Haupttext „Asa“ setzen, um mit der alttestamentlichen Königsgenealogie zu harmonisieren.
  rationale: Die Übersetzung folgt der vorgelegten griechischen Textausgabe und macht die textkritische sowie genealogische Spannung transparent, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Form „zeugte“ wahrt den genealogischen Stil; die Namensformen folgen dem üblichen deutschen Bibelgebrauch, während die Variante Asaf/Asa offengelegt wird.
