id: MAT.1.7
reference: Matthew 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: de
  text: Salomo zeugte Rehabeam, Rehabeam zeugte Abija, und Abija zeugte Asaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Asa“, entsprechend dem König von Juda in 1. Könige 15 und 2. Chronik 14–16; der hier zugrunde gelegte griechische Text liest „Asaf“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: In der väterlichen Abstammungslinie bezeichnet γεννάω das Hervorbringen eines Nachkommen. „Zeugte“ ist im Deutschen knapp, verständlich und für ein Geschlechtsregister sachgerecht.
- source_word: δὲ
  choice: 'unterschiedlich wiedergegeben: zunächst ohne eigenes Wort, zuletzt „und“'
  rationale: δέ führt hier jeweils die genealogische Reihe weiter und ist nicht gegensätzlich. Im Deutschen wirkt eine Wiederholung von „und“ in jedem Glied schwerfällig; die abschließende Wiedergabe mit „und“ macht die Verknüpfung natürlich kenntlich.
- source_word: Σολομών
  choice: Salomo
  rationale: Gebräuchliche deutsche Namensform.
- source_word: Ῥοβοάμ
  choice: Rehabeam
  rationale: Gebräuchliche deutsche Namensform, die den Bezug zur alttestamentlichen Gestalt wahrt.
- source_word: Ἀβιά
  choice: Abija
  rationale: Gebräuchliche deutsche Form des alttestamentlichen Königsnamens; sie wahrt die Verbindung zum Alten Testament besser als eine unmittelbar griechisch geprägte Form.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Der vorgelegte griechische Text lautet Ἀσάφ. Daher steht „Asaf“ im Haupttext; die abweichende Lesart „Asa“ wird transparent in der Fußnote genannt.
theological_decisions:
- issue: Soll Matthäus’ Geschlechtsregister durch die Wiedergabe „Asa“ an die Königslisten des Alten Testaments angeglichen werden?
  choice: „Asaf“ im Haupttext beibehalten
  alternative: „Asa“ lesen und übersetzen
  rationale: Die Vorlage SBLGNT bietet Ἀσάφ. Der Haupttext folgt dieser Lesart, ohne sie stillschweigend mit 1. Könige 15 und 2. Chronik 14–16 zu harmonisieren. Die textkritische Alternative wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur bewahrt den formelhaften Charakter des Geschlechtsregisters. Der Fußnotenzeiger steht unmittelbar nach „Asaf“, da er diese Lesart betrifft.
