  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: de
  text: 'Seht, die Jungfrau[a] wird schwanger werden und einen Sohn gebären, und sie werden ihm den Namen Immanuel[c] geben[b] – was übersetzt heißt: »Gott mit uns.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »junge Frau«. Im Zusammenhang des Matthäusevangeliums sprechen jedoch das griechische Wort παρθένος und die Geburtsgeschichte für »Jungfrau«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen ein unbestimmter Plural: »sie werden … geben/nennen«; wer damit gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: c
    text: Auch als »Emmanuel« transkribiert.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden, prophetisch-feierlichen Charakter wieder, ohne das im heutigen Deutsch altertümlich wirkende „Siehe“ zu erzwingen.
- source_word: ἡ παρθένος
  choice: die Jungfrau
  rationale: παρθένος bezeichnet im matthäischen Kontext eine Jungfrau; auch die unmittelbar vorausgehende Erzählung stellt die Empfängnis als außergewöhnlich dar. Die bekannte Übersetzungsalternative aus der Diskussion um Jesaja 7,14 wird in einer Fußnote genannt.
- source_word: ἐν γαστρὶ ἕξει
  choice: wird schwanger werden
  rationale: Natürliche deutsche Wiedergabe der griechischen Wendung „im Mutterleib haben“; der Zukunftsbezug bleibt erhalten.
- source_word: τέξεται υἱόν
  choice: einen Sohn gebären
  rationale: Direkte, würdige und im Deutschen natürliche Wiedergabe des Geburtsvorgangs und seines Objekts.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: sie werden ihm den Namen … geben
  rationale: Bewahrt den aktiven unbestimmten Plural des Griechischen und gibt die semitisch geprägte Namensformel idiomatisch deutsch wieder.
- source_word: Ἐμμανουήλ
  choice: Immanuel
  rationale: Im Deutschen gebräuchliche Transliteration, die zur unmittelbar folgenden Namensdeutung passt.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: das heißt übersetzt
  rationale: Klare moderne Wiedergabe des erklärenden Partizips, ohne den Sinn über die im Vers gegebene Übersetzung hinaus auszubauen.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Gott mit uns
  rationale: Bewahrt die knappe Form und das theologische Gewicht der im Text selbst gegebenen Namensdeutung.
theological_decisions:
- issue: Wiedergabe von παρθένος im Zusammenhang mit der jungfräulichen Empfängnis
  choice: Jungfrau
  alternative: junge Frau
  rationale: Im unmittelbaren Kontext von Matthäus 1 und nach dem gewöhnlichen Sinn des griechischen παρθένος ist „Jungfrau“ die sachgerechte Haupttextlesart. Die bekannte alternative Formulierung wird wegen der Auslegungsgeschichte von Jesaja 7,14 in der Fußnote sichtbar gehalten.
- issue: Aussagekraft der Deutung des Namens Immanuel
  choice: Die knappe Deutung „Gott mit uns“ unverändert wiedergeben
  alternative: Die Formulierung durch eine ausdrückliche Aussage über die Menschwerdung erweitern
  rationale: Matthäus deutet den Namen selbst. Die Übersetzung bewahrt diese gewichtige Aussage, ohne eine weiterführende dogmatische Erklärung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ erhält den prophetischen Aufmerksamkeitsruf in verständlicher Form. Die Satzstruktur bleibt eng am griechischen Zitat, während „ihm den Namen … geben“ im Deutschen natürlicher klingt als eine wörtliche Nachbildung von „seinen Namen nennen“.
