id: MAT.1.4
reference: Matthew 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: de
  text: Aram zeugte Amminadab, Amminadab zeugte Nachschon, und Nachschon zeugte Salmon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Der Name wird entsprechend der griechischen Form Ἀράμ wiedergegeben; anders als im Englischen ist auch die aus dem Hebräischen vertraute deutsche Form üblicherweise „Aram“, sodass keine Fußnote nötig ist.
- source_word: δὲ
  choice: ohne eigene Wiedergabe; beim letzten Glied „und“
  rationale: δέ führt hier jeweils die genealogische Reihe weiter und bezeichnet keinen Gegensatz. Im Deutschen wirkt die asyndetische Reihung natürlich; vor dem letzten Glied macht „und“ die Verbindung ausdrücklich.
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet γεννάω die männliche Zeugung beziehungsweise Abstammung. „Zeugte“ ist prägnant, verständlich und für eine würdige biblische Genealogie angemessen.
- source_word: Ἀμιναδάβ
  choice: Amminadab
  rationale: Die Form folgt dem griechischen Namen und der im Deutschen etablierten biblischen Schreibweise.
- source_word: Ναασσών
  choice: Nachschon
  rationale: Die etablierte deutsche biblische Namensform wahrt die Wiedererkennbarkeit im Zusammenhang mit dem Alten Testament besser als eine strikte griechische Transliteration wie „Naasson“.
- source_word: Σαλμών
  choice: Salmon
  rationale: Die Wiedergabe folgt der griechischen Form und der etablierten deutschen biblischen Namensform.
theological_decisions: []
