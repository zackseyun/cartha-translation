  register: Modernes, gut verständliches Standarddeutsch mit der für eine biblische Ahnenreihe angemessenen knappen und würdigen Ausdrucksweise. Die Wiederholung von „zeugte“ bewahrt Struktur und Rhythmus des griechischen Textes.
