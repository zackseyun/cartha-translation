id: MAT.1.1
reference: Matthew 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: de
  text: Das Buch der Abstammung[a] Jesu, des Messias[b], des Sohnes Davids, des Sohnes Abrahams.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Buch vom Ursprung“ beziehungsweise „Das Buch von der Geburt“. Das griechische Wort kann umfassender den Ursprung oder die Entstehung bezeichnen; wegen des folgenden Geschlechtsregisters steht im Text „Abstammung“.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „Jesu Christi“. Das griechische Χριστός ist hier als Titel zu verstehen und bedeutet „der Gesalbte“, also „der Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Das Buch
  rationale: βίβλος bezeichnet ein Buch, eine Schriftrolle oder eine schriftliche Aufzeichnung. Als überschriftartiger Beginn bewahrt „Das Buch“ die feierliche, schriftbezogene Ausdrucksweise des griechischen Textes.
- source_word: γενέσεως
  choice: der Abstammung
  rationale: γένεσις kann Abstammung, Ursprung oder Geburt bedeuten. Da unmittelbar ein Geschlechtsregister folgt, trifft „Abstammung“ den Zusammenhang am besten; die weiter reichenden Bedeutungen werden in einer Fußnote bewahrt.
- source_word: Ἰησοῦ
  choice: Jesu
  rationale: Der Genitiv „Jesu“ entspricht der syntaktischen Einbindung des Eigennamens und ist im modernen Standarddeutsch weiterhin verständlich und in würdigem biblischem Register gebräuchlich.
- source_word: χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet hier den Titel des Gesalbten und nicht einen Familiennamen. „Messias“ macht diese titularische Bedeutung im Deutschen deutlich.
- source_word: υἱοῦ Δαυὶδ
  choice: des Sohnes Davids
  rationale: Die wörtliche Wiedergabe bewahrt sowohl die genealogische Bedeutung „Nachkomme Davids“ als auch die messianisch-königliche Tragweite der festen Bezeichnung „Sohn Davids“.
- source_word: υἱοῦ Ἀβραάμ
  choice: des Sohnes Abrahams
  rationale: „Sohn“ gibt den genealogischen Ausdruck transparent wieder und erhält zugleich die heilsgeschichtliche Verbindung zu Abraham; gemeint ist in diesem Zusammenhang auch ein Nachkomme.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: des Messias
  alternative: Jesu Christi
  rationale: Χριστός wird hier als Titel gebraucht. „Messias“ bewahrt den jüdischen Erwartungshorizont des königlichen Gesalbten; die traditionelle Form „Christus“ bleibt als Alternative in der Fußnote sichtbar.
- issue: Bedeutungsumfang von γενέσεως in der Überschrift
  choice: Abstammung
  alternative: Ursprung oder Geburt
  rationale: Das folgende Geschlechtsregister legt „Abstammung“ nahe. Da γένεσις zugleich „Ursprung“ oder „Geburt“ bedeuten und einen bewussten Genesis-Anklang tragen kann, wird diese Mehrdeutigkeit nicht beseitigt, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Überschriftartiger, feierlicher Satz ohne finites Verb, entsprechend dem griechischen Ausgangstext. Die Genitivreihe ist bewusst beibehalten; sie klingt würdig, bleibt aber für heutige Leser verständlich. „Sohn Davids“ und „Sohn Abrahams“ werden nicht zu „Nachkomme“ verflacht, damit die genealogische und theologische Aussagekraft erhalten bleibt.
