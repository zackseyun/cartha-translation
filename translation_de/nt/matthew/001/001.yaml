  source_fidelity: Die Übersetzung gibt die Genitivkette von Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ präzise wieder. „Abstammung“ passt angesichts des unmittelbar folgenden Geschlechtsregisters; die in γένεσις mögliche weitere Bedeutung wird angemessen in der Fußnote offen gehalten. „des Messias“ gibt den hier titularen Gebrauch von χριστοῦ idiomatisch und sachgerecht wieder.
