  terminology: „Messias“, „Sohn Davids“ und „Sohn Abrahams“ sind terminologisch treffend. Die Fußnote zu χριστός benennt die traditionelle Form „Jesu Christi“ korrekt im Genitiv und erklärt den Titel ohne konfessionelle Überdeutung. Die Fußnotenanker stehen an den jeweils passenden Wörtern.
