  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: de
  text: Abraham zeugte Isaak[a], Isaak zeugte Jakob, Jakob zeugte Juda und seine Brüder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war der Vater von«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: zeugte
  rationale: Im Stammbaum bezeichnet γεννάω die männliche Zeugung beziehungsweise genealogische Abstammung. »Zeugte« ist im Deutschen knapp, verständlich und für diese Gattung weiterhin gebräuchlich; es lässt zugleich offen, ob unmittelbare Vaterschaft oder eine weiter gefasste Abstammungsbeziehung gemeint ist.
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. Das wiederholte »aber« bewahrt die griechische Satzgliederung und klingt in der würdevollen Sprache eines Stammbaums natürlich, ohne einen starken Gegensatz auszudrücken.
- source_word: Ἰούδαν
  choice: Juda
  rationale: Gemeint ist der Stammvater Juda, Jakobs Sohn. »Juda« ist die etablierte deutsche Namensform und vermeidet eine Verwechslung mit Judas.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: seine Brüder
  rationale: Der griechische Ausdruck ist maskulin und bezeichnet hier die übrigen Söhne Jakobs; »seine Brüder« ist daher sachlich und sprachlich präzise.
- source_word: Ἀβραὰμ / Ἰσαὰκ / Ἰακώβ
  choice: Abraham / Isaak / Jakob
  rationale: Verwendet werden die im modernen Standarddeutsch etablierten biblischen Namensformen.
theological_decisions:
- issue: Wiedergabe des genealogischen Verbs
  choice: Durchgehend »zeugte«
  alternative: »wurde der Vater von« / »war der Vater von«
  rationale: »Zeugte« erhält die väterliche Linie und die knappe, formelhafte Struktur des griechischen Stammbaums, ohne festzulegen, dass jede genannte Beziehung zwingend eine unmittelbare Generation bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formelhafter Wiederholung. »Aber« ist hier fortführend und nicht als starker Gegensatz zu verstehen.
