source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: de
  text: 'Der Engel aber antwortete den Frauen: »Ihr[a] braucht euch nicht zu fürchten; denn ich weiß, dass ihr Jesus, den Gekreuzigten,[b] sucht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht das Pronomen »ihr« ausdrücklich und betont; die beruhigenden Worte gelten besonders den Frauen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Jesus, der gekreuzigt worden ist« oder »Jesus, der gekreuzigt wurde«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: aber wandte sich ... und sagte
  rationale: Die griechische Antwortformel wird im Deutschen natürlich wiedergegeben. »Wandte sich an« passt auch dann, wenn keine ausdrücklich vorausgehende Frage vorliegt; δέ markiert den Übergang zur beruhigenden Rede.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Im Auferstehungsbericht bezeichnet ἄγγελος eindeutig ein himmlisches Wesen; »Engel« ist die klare und übliche Wiedergabe.
- source_word: ταῖς γυναιξίν
  choice: an die Frauen
  rationale: Der Dativ bezeichnet die Adressatinnen der Rede; γυνή meint hier Frauen, nicht Ehefrauen.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Fürchtet ihr euch nicht!
  rationale: Die vorangestellte Verbform mit ausdrücklich genanntem ὑμεῖς wird durch die deutsche Wortstellung hervorgehoben. So bleibt die besondere Zuwendung zu den Frauen erkennbar, ohne ein unnatürliches »ihr« anzuhängen.
- source_word: οἶδα γὰρ ὅτι
  choice: Denn ich weiß, dass
  rationale: γάρ begründet die Aufforderung, und ὅτι leitet den Inhalt des Wissens ein.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: Jesus, den Gekreuzigten
  rationale: Das substantivierte Perfektpartizip bezeichnet Jesus als den, der gekreuzigt worden ist und weiterhin als der Gekreuzigte identifiziert wird. Die knappe deutsche Form bewahrt den attributiven Nachdruck.
- source_word: ζητεῖτε
  choice: sucht
  rationale: Das Präsens bezeichnet ihre gegenwärtige Suche; das schlichte deutsche Präsens ist hier idiomatisch und präzise.
theological_decisions:
- issue: Nachdruck des ausdrücklichen Pronomens ὑμεῖς
  choice: »Fürchtet ihr euch nicht!« mit hervorgehobenem »ihr« und Fußnote
  alternative: »Fürchtet euch nicht!« / »Ihr braucht euch nicht zu fürchten!«
  rationale: Das ausdrückliche Pronomen richtet die Beruhigung besonders an die Frauen und kann einen unausgesprochenen Kontrast tragen. Die Übersetzung bewahrt den Nachdruck, ohne festzulegen, mit wem sie kontrastiert werden.
- issue: Bedeutung des Perfektpartizips ἐσταυρωμένον
  choice: »den Gekreuzigten«
  alternative: »der gekreuzigt worden ist« / »der gekreuzigt wurde«
  rationale: »Den Gekreuzigten« erhält die prägnante Identifizierung und lässt die fortbestehende Bedeutung des vollzogenen Geschehens anklingen, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeformel ist gegenüber einer wörtlichen Doppelung wie »antwortete und sagte« idiomatisch geglättet. Das betonte Pronomen und die prägnante Bezeichnung »den Gekreuzigten« bleiben sichtbar.
