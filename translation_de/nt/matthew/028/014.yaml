id: MAT.28.14
reference: Matthew 28:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: de
  text: Und wenn dies dem Statthalter zu Ohren kommt,[a] werden wir ihn überzeugen und dafür sorgen, dass ihr keine Schwierigkeiten bekommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn dies vor dem Statthalter zur Sprache kommt“; auch: „wenn der Statthalter davon erfährt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und euch sorgenfrei machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ … ἐπὶ τοῦ ἡγεμόνος
  choice: dem Statthalter zu Ohren kommt
  rationale: Die deutsche Wendung gibt das passive Bekanntwerden der Sache im Wahrnehmungsbereich des Statthalters natürlich wieder, ohne ausdrücklich festzulegen, ob sie ihm förmlich gemeldet wird.
- source_word: ἡγεμόνος
  choice: Statthalter
  rationale: Im römischen Verwaltungskontext bezeichnet ἡγεμών den Provinzstatthalter, hier Pilatus. „Statthalter“ ist im Deutschen präzise und etabliert.
- source_word: πείσομεν αὐτόν
  choice: werden wir ihn überzeugen
  rationale: Dies bildet den gewöhnlichen Sinn von πείθω transparent ab. Ob Überreden oder Beschwichtigen gemeint ist, wird nicht stärker festgelegt als im Griechischen.
- source_word: ἀμερίμνους
  choice: keine Schwierigkeiten bekommt
  rationale: Wörtlich bezeichnet das Wort einen Zustand ohne Sorge. Im Kontext drohen den Wachen jedoch dienstliche oder rechtliche Folgen; die idiomatische Wiedergabe erfasst daher die situationsbezogene Bedeutung.
- source_word: ποιήσομεν
  choice: dafür sorgen, dass
  rationale: ποιέω mit prädikativem Adjektiv bedeutet hier, jemanden in einen bestimmten Zustand zu versetzen beziehungsweise diesen Zustand sicherzustellen. Die gewählte Formulierung ist natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Zu Ohren kommen“ bewahrt den Gedanken des Bekanntwerdens idiomatisch; „Schwierigkeiten bekommen“ verdeutlicht die im Kontext drohenden Folgen, während die wörtlichere Bedeutung in der Fußnote erhalten bleibt.
