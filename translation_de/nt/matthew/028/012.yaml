  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: de
  text: Sie kamen mit den Ältesten zusammen, berieten sich und gaben den Soldaten eine beträchtliche Summe Silbergeld[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine beträchtliche Summe Silber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: kamen sie … zusammen
  rationale: Das aoristische Partizip bezeichnet ihr Zusammenkommen vor der Beratung. Die finite Formulierung ist im Deutschen natürlich und bewahrt die Handlungsfolge.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: mit den Ältesten
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft; „Älteste“ ist in diesem Leitungskontext die übliche und sachgerechte Wiedergabe.
- source_word: συμβούλιόν τε λαβόντες
  choice: berieten sich
  rationale: Die Wendung συμβούλιον λαμβάνω bezeichnet gemeinsames Beraten beziehungsweise das Fassen eines Plans. „Berieten sich“ gibt den Vorgang wieder, ohne das Ergebnis der Beratung stärker festzulegen, als es der griechische Text tut.
- source_word: ἀργύρια ἱκανὰ
  choice: eine beträchtliche Menge Silbergeld
  rationale: ἀργύρια bezeichnet hier Silber als Zahlungsmittel, während ἱκανὰ eine erhebliche Menge ausdrückt. Die Formulierung ist verständlich und bewahrt den ausdrücklichen Bezug auf Silber.
- source_word: ἔδωκαν
  choice: gaben
  rationale: Direkte Wiedergabe des Aorists von δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: den Soldaten
  rationale: στρατιώταις bedeutet wörtlich „Soldaten“. Ihre Funktion als Wachen im Kontext rechtfertigt nicht, die lexikalische Bezeichnung im Vers zu ersetzen.
- source_word: καί
  choice: Daraufhin
  rationale: Das einleitende καί verbindet das Geschehen mit dem vorherigen Vers. „Daraufhin“ macht diesen erzählerischen Anschluss im modernen Deutschen natürlich deutlich.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: „sie“ bezieht sich auf die Hohen Priester aus Matthäus 28,11
  alternative: eine nicht näher bestimmte Gruppe
  rationale: Die maskulischen Pluralformen der Partizipien und des Hauptverbs führen das handelnde Subjekt des vorherigen Verses fort. Da der griechische Text die Hohen Priester nicht erneut nennt, bleibt auch die Übersetzung beim Pronomen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden Partizipien werden als aufeinanderfolgende finite Verben wiedergegeben; dadurch bleibt die zeitliche und sachliche Abfolge erhalten, ohne eine schwerfällige Partizipialkonstruktion zu erzeugen.
