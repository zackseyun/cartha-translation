id: MAT.28.18
reference: Matthew 28:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: de
  text: 'Und Jesus trat zu ihnen und sagte: »Mir ist alle Vollmacht[b] im Himmel und auf der Erde gegeben worden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mir wurde alle Vollmacht … gegeben.“ Der griechische Aorist kann im Deutschen auch mit dem Präteritum wiedergegeben werden; das Perfekt im Haupttext hebt die fortdauernde Geltung der vollzogenen Verleihung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Macht“. Das griechische Wort ἐξουσία bezeichnet hier vor allem rechtmäßige Autorität, Befugnis oder Herrschaftsgewalt, nicht nur Stärke oder Fähigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: trat zu ihnen
  rationale: Das Partizip bezeichnet Jesu Bewegung auf die Jünger zu. „Trat zu ihnen“ bewahrt den räumlichen Sinn und klingt in modernem Deutsch natürlich und würdevoll.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: sagte
  rationale: Die griechische Redeeinleitung lautet wörtlicher „sprach zu ihnen und sagte“. Im Deutschen wäre diese Verdoppelung schwerfällig; „sagte“ gibt die gesamte Formel natürlich wieder, während der Bezug auf die Jünger bereits in „zu ihnen“ beim Herantreten deutlich ist.
- source_word: Ἐδόθη μοι
  choice: Mir ist … gegeben worden
  rationale: 'Das Aoristpassiv wird beibehalten. Das deutsche Perfekt bezeichnet eine vollzogene Verleihung mit gegenwärtiger Geltung: Jesus besitzt nun die ihm gegebene Vollmacht.'
- source_word: πᾶσα ἐξουσία
  choice: alle Vollmacht
  rationale: Bei dem abstrakten Substantiv drückt πᾶσα die Gesamtheit aus. „Vollmacht“ bezeichnet rechtmäßige Autorität und Verfügungsgewalt treffender als bloße Kraft oder Fähigkeit.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: im Himmel und auf der Erde
  rationale: Die geläufige deutsche Wendung wahrt den umfassenden Gegensatz der himmlischen und irdischen Bereiche.
theological_decisions:
- issue: Art und Ursprung der universalen Vollmacht Jesu
  choice: Mir ist alle Vollmacht … gegeben worden
  alternative: Ich habe alle Macht … / Mir wurde alle Vollmacht … gegeben
  rationale: Die passive Form des griechischen Textes bleibt erhalten und wird nicht in eine bloße Aussage über eigenen Besitz umgewandelt. So wahrt die Übersetzung die Spannung zwischen Jesu universaler Herrschaft und der Aussage, dass ihm diese Vollmacht gegeben wurde, ohne den unausgesprochenen Handelnden ausdrücklich zu benennen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die im Deutschen unnötig schwerfällige doppelte Redeeinleitung wurde idiomatisch zu „sagte“ zusammengezogen; die passive Aussage und ihre theologische Spannung bleiben gewahrt.
