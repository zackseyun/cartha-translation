  variant: modern standard German
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: de
  text: Während sie unterwegs waren[a], da[b] kamen einige von der Wache in die Stadt und berichteten den Hohenpriestern alles, was geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Frauen, die vom Grab zu den Jüngern unterwegs waren (Vers 8).
    reason: referent_clarification
  - marker: b
    text: Das griechische Aufmerksamkeitssignal wird hier mit „da“ wiedergegeben. Es hebt die überraschende neue Entwicklung hervor.
    reason: discourse_marker
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Während sie unterwegs waren
  rationale: Der Genitivus absolutus setzt den zeitlichen Hintergrund. „Unterwegs waren“ klingt im Deutschen natürlich, ohne ein im griechischen Satz nicht genanntes Ziel festzulegen.
- source_word: ἰδού
  choice: da
  rationale: Das präsentative „da“ bildet den erzählerischen Aufmerksamkeitsmarker in natürlichem modernem Deutsch ab und signalisiert die nun eintretende, bemerkenswerte Entwicklung.
- source_word: τινες τῆς κουστωδίας
  choice: einige von der Wache
  rationale: κουστωδία bezeichnet hier die am Grab eingesetzte Wachmannschaft; „einige von der Wache“ ist knapp und idiomatisch.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: kamen ... in die Stadt
  rationale: Das vorzeitige Aoristpartizip wird als natürliche deutsche Ereignisfolge wiedergegeben. „Kamen“ entspricht der erzählerischen Perspektive des griechischen ἐλθόντες.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet das Überbringen einer Meldung; „berichteten“ passt sowohl semantisch als auch zum Empfängerkreis.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: den führenden Priestern
  rationale: ἀρχιερεῖς bezeichnet im Plural die priesterliche Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ ist für heutige Leser verständlich und historisch angemessen.
- source_word: ἅπαντα τὰ γενόμενα
  choice: alles, was geschehen war
  rationale: „Alles“ bewahrt die umfassende Aussage von ἅπαντα; das Plusquamperfekt ordnet die berichteten Ereignisse natürlich vor dem Bericht ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den zeitlichen Hintergrund und den anschließenden Szenenwechsel klar auseinander; „da“ bewahrt die Funktion von ἰδού ohne das heute altertümlich klingende „siehe“.
