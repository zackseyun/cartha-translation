review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die narrative Abfolge (τότε), die Anrede der Frauen im Kontext, das Verbot zu fürchten, die zwei Imperative, die Bezeichnung „meinen Brüdern“, die indirekt übermittelte Aufforderung zur Reise nach Galiläa sowie die Zusage, Jesus dort zu sehen. „Sie sollen“ bildet den auffordernden Inhalt von ἵνα mit Konjunktiv idiomatisch ab. Das feminine Geschlecht von αὐταῖς muss im Deutschen bei „ihnen“ nicht eigens markiert werden und wird durch den Kontext hinreichend bestimmt.'
  naturalness: „Da sagte Jesus zu ihnen“ und die direkte Rede sind modernes, flüssiges Standarddeutsch. „Habt keine Angst“ ist eine natürliche, nicht unangemessen umgangssprachliche Wiedergabe. Die Abfolge „Geht und sagt meinen Brüdern, sie sollen nach Galiläa gehen“ ist klar und idiomatisch.
  terminology: „Meinen Brüdern“ bewahrt die maskuline familiäre Bezeichnung τοῖς ἀδελφοῖς μου, ohne sie auslegend durch „Jüngern“ zu ersetzen. „Galiläa“ und „sehen“ sind korrekt und terminologisch unauffällig. Es sind keine Fußnoten erforderlich; insbesondere besteht keine textkritisch relevante Mehrdeutigkeit, die eine Anmerkung nötig machte.
