id: MAT.28.10
reference: Matthew 28:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: »Habt keine Angst! Geht und sagt meinen Brüdern, sie sollen nach Galiläa gehen. Dort werden sie mich sehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε λέγει αὐταῖς
  choice: Da sagte Jesus zu ihnen
  rationale: »Da« markiert natürlich die narrative Abfolge. Das historische Präsens λέγει wird im deutschen Erzählstil als Präteritum wiedergegeben; »ihnen« wahrt den femininen Bezug aus dem Kontext, ohne ihn auslegend zu ergänzen.
- source_word: Μὴ φοβεῖσθε
  choice: Habt keine Angst
  rationale: Eine natürliche, moderne Wiedergabe des Verbots, die den Sinn von »Fürchtet euch nicht« ohne altertümliche Färbung ausdrückt.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Geht und sagt
  rationale: Die beiden Imperative werden knapp und idiomatisch wiedergegeben. »Sagt« erfasst hier das Übermitteln einer Botschaft natürlicher als das förmlichere »berichtet«.
- source_word: τοῖς ἀδελφοῖς μου
  choice: meinen Brüdern
  rationale: Die ausdrücklich maskuline Pluralform und die familiäre Bezeichnung werden bewahrt, statt sie im Haupttext durch die kontextuelle Deutung »Jünger« zu ersetzen.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: sie sollen nach Galiläa gehen
  rationale: ἵνα mit dem Konjunktiv gibt hier den Inhalt der übermittelten Aufforderung wieder. Die deutsche Konstruktion mit »sollen« ist klar und idiomatisch.
- source_word: κἀκεῖ με ὄψονται
  choice: Dort werden sie mich sehen
  rationale: »Dort« gibt καὶ ἐκεῖ im Deutschen flüssig wieder; »sehen« bewahrt die breite Bedeutung von ὄψονται und vermeidet die engere Deutung »begegnen«.
theological_decisions:
- issue: Bezugsgruppe von »meinen Brüdern«
  choice: Die familiäre Bezeichnung »meine Brüder« bleibt im Haupttext stehen.
  alternative: Die Wendung unmittelbar als »meine Jünger« wiederzugeben.
  rationale: Der unmittelbare Kontext weist auf Jesu Jünger, doch der griechische Text verwendet bewusst die Verwandtschaftsbezeichnung. Ihre Beibehaltung wahrt sowohl den Wortlaut als auch dessen theologische Wärme, ohne den Ausdruck im Haupttext auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich und gut verständlich; das Präteritum entspricht dem üblichen deutschen Erzählstil. Keine Fußnote ist nötig, da die relevante Mehrdeutigkeit durch die wörtliche Beibehaltung von »meinen Brüdern« gewahrt bleibt.
