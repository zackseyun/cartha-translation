  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: de
  text: Schnell verließen sie das Grab und liefen mit Furcht[a] und großer Freude, um seinen Jüngern zu berichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Ehrfurcht und großer Freude“. Das griechische Wort für „Furcht“ kann in diesem Zusammenhang auch den Sinn von Ehrfurcht haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: Schnell verließen sie das Grab
  rationale: Das vorzeitige Aoristpartizip bezeichnet das Weggehen der Frauen vom Grab; die finite Formulierung ist im modernen Deutschen natürlich. „Schnell“ gibt ταχύ unmittelbar wieder, und „Grab“ ist in diesem Auferstehungskontext die geläufige Entsprechung für μνημεῖον.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: mit Furcht und großer Freude
  rationale: Die Formulierung bewahrt das Nebeneinander beider Empfindungen. „Furcht“ lässt sowohl tatsächliche Angst als auch ehrfürchtiges Erschrecken zu, ohne den Sinn vorschnell festzulegen.
- source_word: ἔδραμον
  choice: liefen
  rationale: Das Verb bezeichnet ausdrücklich das Laufen und vermittelt die Dringlichkeit anschaulicher als das schwächere „eilten“.
- source_word: ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ
  choice: um seinen Jüngern die Nachricht zu überbringen
  rationale: Der Infinitiv bezeichnet den Zweck ihres Laufens. Im Deutschen braucht „überbringen“ ein aus dem Kontext erschließbares Objekt; „die Nachricht“ hält deren Inhalt unbestimmt und gibt ἀπαγγέλλω als gezieltes Weitersagen wieder. μαθηταί wird mit dem im Evangelienkontext etablierten „Jünger“ übersetzt.
theological_decisions:
- issue: Spannung zwischen Furcht und Freude in der Reaktion der Frauen
  choice: mit Furcht und großer Freude
  alternative: mit Ehrfurcht und großer Freude
  rationale: φόβος kann hier auch ehrfürchtiges Erschrecken bezeichnen. Der Haupttext bewahrt jedoch die bewusste Spannung zwischen Furcht und Freude, statt sie auf reine Ehrfurcht oder bloße Angst festzulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem griechischen Partizip geglättet, während Abfolge, Dringlichkeit und emotionale Spannung erhalten bleiben.
