source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: de
  text: Nach dem Sabbat[a], bei Tagesanbruch am ersten Tag der Woche, kamen Maria Magdalena und die andere Maria, um das Grab anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Spät am Sabbat, als es auf den ersten Tag der Woche zu dämmern begann.“ Die griechische Anfangsformulierung kann sowohl im Sinn von „nach dem Sabbat“ als auch von „spät am Sabbat“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Nach dem Sabbat
  rationale: ὀψέ mit dem Genitiv kann eine Zeit nach einem Ereignis bezeichnen. Im Zusammenhang der Auferstehungserzählung ist „nach dem Sabbat“ die wahrscheinlichste Deutung. Das formal pluralische σαββάτων bezeichnet im jüdisch-griechischen Sprachgebrauch idiomatisch den Sabbat. Die leichte Anschlussfunktion von δέ wird im Deutschen nicht eigens wiedergegeben.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: als es … zu dämmern begann
  rationale: Das Partizip von ἐπιφώσκω bezeichnet hier am natürlichsten den Anbruch des Tages. Die Formulierung gibt den beginnenden Übergang zum Tageslicht in idiomatischem Deutsch wieder.
- source_word: εἰς μίαν σαββάτων
  choice: auf den ersten Tag der Woche
  rationale: μίαν σαββάτων ist eine semitisch geprägte Wendung für den ersten Wochentag. „Auf“ bewahrt in Verbindung mit „dämmern“ die durch εἰς ausgedrückte zeitliche Hinbewegung.
- source_word: ἦλθεν
  choice: kamen
  rationale: ἔρχομαι bedeutet hier „kommen“. Obwohl das griechische Verb bei dem zusammengesetzten Subjekt im Singular steht, verlangt natürliches modernes Deutsch den Plural.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: ἡ ἄλλη Μαρία
  choice: die andere Maria
  rationale: ἄλλη bedeutet „andere“ und unterscheidet diese Maria ohne weitergehende Identifizierung von Maria Magdalena.
- source_word: θεωρῆσαι
  choice: um … anzusehen
  rationale: θεωρέω bezeichnet ein bewusstes Hinschauen oder Betrachten. „Ansehen“ bewahrt diese Absicht, ohne eine förmliche Untersuchung anzudeuten.
- source_word: τὸν τάφον
  choice: das Grab
  rationale: τάφος bezeichnet hier Jesu Begräbnisstätte. „Grab“ ist die klare und übliche moderne deutsche Entsprechung.
theological_decisions:
- issue: Zeitangabe zu Beginn der Auferstehungserzählung
  choice: Das Geschehen wird nach dem Ende des Sabbats und beim Anbruch des ersten Wochentags angesetzt.
  alternative: Die Anfangswendung kann auch als „Spät am Sabbat“ verstanden werden.
  rationale: Die Bedeutung von ὀψὲ σαββάτων ist umstritten. Zusammen mit der folgenden Angabe zum Dämmern ist „nach dem Sabbat“ im Kontext wahrscheinlich, doch die sprachlich mögliche Alternative wird in einer Fußnote offengehalten, statt die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Zeitablauf, ohne unnatürlich zu wirken; die echte zeitliche Mehrdeutigkeit wird durch die Fußnote bewahrt.
