reference: Matthew 28:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: de
  text: 'Und siehe, Jesus kam ihnen entgegen und sagte: »Seid gegrüßt!«[a] Da traten sie zu ihm, umfassten seine Füße und beteten ihn an.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Freut euch!« Das griechische χαίρετε ist der Form nach ein Imperativ im Plural, dient hier aber als Gruß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »warfen sich vor ihm nieder« beziehungsweise »erwiesen ihm Ehrerbietung«. Das griechische προσκυνέω kann Niederwerfung oder Huldigung bezeichnen; im Zusammenhang der Auferstehung liegt hier wahrscheinlich die stärkere Bedeutung »anbeten« vor.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Bewahrt die aufmerksamkeitslenkende und erzählerisch belebende Funktion des griechischen Diskursmarkers, ohne ihn auszulassen.
- source_word: ὑπήντησεν
  choice: kam ihnen entgegen
  rationale: Gibt die Begegnung auf dem Weg natürlich wieder und lässt erkennen, dass Jesus auf die Frauen traf.
- source_word: Χαίρετε
  choice: Seid gegrüßt!
  rationale: Die formal als pluralischer Imperativ gebildete Wendung dient hier als Gruß. Diese Wiedergabe wahrt sowohl die Form als auch die kommunikative Funktion besser als ein modernes, stilistisch zu lockeres »Hallo«.
- source_word: προσελθοῦσαι
  choice: Da traten sie zu ihm
  rationale: 'Macht die zeitliche Abfolge deutlich: Die Frauen näherten sich Jesus, bevor sie seine Füße umfassten und ihm Verehrung erwiesen.'
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: umfassten seine Füße
  rationale: Drückt den festen, konkreten körperlichen Griff aus, ohne die unnötig gewaltsame Nebenbedeutung von »packten« oder »ergriffen«.
- source_word: προσεκύνησαν αὐτῷ
  choice: beteten ihn an
  rationale: Im Auferstehungskontext trägt προσκυνέω wahrscheinlich religiöse Bedeutung. Die Übersetzung bewahrt dieses Gewicht; eine Fußnote macht zugleich den weiteren Bedeutungsumfang des Verbs sichtbar.
theological_decisions:
- issue: Wiedergabe von προσκυνέω gegenüber dem auferstandenen Jesus
  choice: beteten ihn an
  alternative: warfen sich vor ihm nieder / erwiesen ihm Ehrerbietung
  rationale: Matthäus’ Auferstehungsbericht legt hier eine über bloßen gesellschaftlichen Respekt hinausgehende Verehrung nahe. Da προσκυνέω jedoch auch die körperliche Niederwerfung oder Huldigung bezeichnen kann, wird diese echte lexikalische Mehrdeutigkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Und siehe« erhält bewusst den markierten, leicht gehobenen Aufmerksamkeitssignalton des Ausgangstextes; Satzbau und Verben bleiben ansonsten natürlich und gegenwärtig.
