  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: de
  text: Als sie ihn sahen, beteten sie ihn an; einige aber zweifelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zögerten oder schwankten. Das griechische Wort kann Unsicherheit bezeichnen und muss keinen gefestigten Unglauben meinen.'
    reason: Lexikalische Alternative zu ἐδίστασαν; bewahrt die mögliche Nuance von Zögern oder innerem Schwanken.
lexical_decisions:
- source_word: ἰδόντες
  choice: Als sie ihn sahen
  rationale: Das substantivisch eingebundene Aoristpartizip wird als temporaler Nebensatz wiedergegeben. So klingt der Satz im Deutschen natürlich und bewahrt den zeitlichen Bezug zu den folgenden Verben.
- source_word: προσεκύνησαν
  choice: beteten sie ihn an
  rationale: προσκυνέω kann Niederwerfung, Huldigung oder Anbetung bezeichnen. Im Kontext der Erscheinung des auferstandenen Jesus gibt „anbeten“ die wahrscheinlich beabsichtigte religiöse Tragweite wieder, ohne den Ausdruck auf eine bloße Körperhaltung zu reduzieren.
- source_word: οἱ δὲ
  choice: einige aber
  rationale: Der Artikel mit δέ bezeichnet hier kontrastierend einen Teil der zuvor genannten Gruppe. „Einige aber“ macht diesen elliptischen Gegensatz im Deutschen verständlich.
- source_word: ἐδίστασαν
  choice: zweifelten
  rationale: διστάζω kann zweifeln, schwanken oder zögern bedeuten. „Zweifelten“ ist eine klare und sachlich vertretbare Wiedergabe; die mögliche Nuance von Unsicherheit oder Zögern wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber dem auferstandenen Jesus
  choice: „beteten sie ihn an“
  alternative: „warfen sie sich vor ihm nieder“ / „huldigten ihm“
  rationale: Der Auferstehungskontext und die Ausrichtung der Handlung auf Jesus sprechen für „anbeten“. Zugleich bleibt die Übersetzung im Bedeutungsrahmen des griechischen Verbs und führt keine über den Text hinausgehende dogmatische Erklärung ein.
- issue: Bedeutungsnuance von διστάζω
  choice: „zweifelten“ im Haupttext
  alternative: „zögerten“ / „schwankten“ / „waren unsicher“
  rationale: Das Verb muss keinen gefestigten Unglauben bezeichnen, sondern kann ein inneres Schwanken ausdrücken. Der Haupttext wahrt die zugespitzte Aussage; die Fußnote hält die lexikalische Offenheit fest.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Stellung „einige aber“ erhält den knappen Kontrast des griechischen Satzes; das Semikolon trennt Anbetung und Zweifel klar, ohne ihren spannungsvollen Zusammenhang aufzulösen.
