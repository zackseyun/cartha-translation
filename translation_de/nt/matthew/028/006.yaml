  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: de
  text: Er ist nicht hier; denn er ist auferweckt worden[a], wie er gesagt hat. Kommt, seht den Ort, wo er lag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er ist auferstanden“. Das griechische Verb ist der Form nach passiv („ist auferweckt worden“); traditionell wird es häufig aktiv wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wo er gelegen hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Er ist nicht hier
  rationale: Die griechische Ortsaussage wird im Deutschen natürlich mit dem aus dem Zusammenhang eindeutigen Subjekt „er“ wiedergegeben.
- source_word: ἠγέρθη
  choice: ist auferweckt worden
  rationale: Die Form ist ein Aorist Passiv von ἐγείρω. Die gewählte Formulierung bewahrt den passiven Wortlaut und gibt das vollendete Geschehen in natürlichem Deutsch wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ nennt den Grund für die vorausgehende Aussage; „denn“ bildet diesen erklärenden Zusammenhang knapp und idiomatisch ab.
- source_word: καθὼς εἶπεν
  choice: wie er gesagt hat
  rationale: Die Wendung bezeichnet die Übereinstimmung mit Jesu vorheriger Ankündigung. „Wie er gesagt hat“ ist klar und bewahrt den zeitlichen Bezug, ohne ihn unnötig auszudeuten.
- source_word: δεῦτε
  choice: Kommt
  rationale: δεῦτε ist hier eine Aufforderung beziehungsweise Einladung, sich zu nähern.
- source_word: ἴδετε
  choice: seht
  rationale: Der Imperativ fordert zur unmittelbaren Wahrnehmung und Prüfung des Ortes auf; „seht“ ist würdig und gegenwärtig, ohne altertümlich zu wirken.
- source_word: τὸν τόπον
  choice: den Ort
  rationale: τόπος bezeichnet die konkrete Stelle im Grab; „Ort“ ist die naheliegende und ausreichend konkrete deutsche Entsprechung.
- source_word: ὅπου ἔκειτο
  choice: wo er lag
  rationale: κεῖμαι bezeichnet hier den Zustand des Liegens. Das Präteritum „lag“ gibt den imperfektiven, statischen Sinn knapp und natürlich wieder, ohne ein ausdrückliches Niederlegen in den Text einzutragen.
theological_decisions:
- issue: Genus Verbi und Handlungsträger bei der Auferweckung
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Das griechische ἠγέρθη ist formal passiv. Die Übersetzung wahrt diese Form und lässt die im Text angelegte Aussage bestehen, dass die Auferweckung an Jesus geschah, ohne damit Aussagen anderer neutestamentlicher Stellen über Jesu eigene Vollmacht auszuschließen.
- issue: Zustand oder vorausgehendes Niederlegen im Grab
  choice: wo er lag
  alternative: wohin man ihn gelegt hatte
  rationale: ὅπου ἔκειτο beschreibt unmittelbar den Zustand beziehungsweise die Lage. Eine ausdrücklich handelnde ungenannte Person oder das vorausgehende Niederlegen sollte im Haupttext nicht ergänzt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das Semikolon verdeutlicht den engen Begründungszusammenhang; die kurzen Imperative bewahren die Unmittelbarkeit der Aufforderung.
