  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: de
  text: 'Geht nun schnell und sagt seinen Jüngern: »Er ist von den Toten auferweckt worden, und seht: Er geht euch voraus nach Galiläa. Dort werdet ihr ihn sehen.« Seht, ich habe es euch gesagt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: Geht nun schnell
  rationale: Der griechische Aoristpartizip-Ausdruck wird als natürlicher deutscher Imperativ wiedergegeben; »schnell« bewahrt die Dringlichkeit, »nun« stellt den folgerichtigen Übergang her.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Er ist von den Toten auferweckt worden
  rationale: Die Passivform wird bewahrt, statt sie zu »Er ist auferstanden« zu glätten; so bleibt der mögliche göttliche Handlungsträger unausgesprochen, wie im Griechischen.
- source_word: προάγει ὑμᾶς
  choice: Er geht euch voraus
  rationale: Gibt die räumliche Bedeutung von προάγω im Zusammenhang natürlich und präzise wieder.
- source_word: ἰδού
  choice: seht / Seht
  rationale: Der wiederholte Aufmerksamkeitsruf bleibt an beiden Stellen sichtbar; die flektierte deutsche Form passt zur Anrede mehrerer Personen.
theological_decisions:
- issue: Passiv bei der Auferweckung
  choice: Er ist von den Toten auferweckt worden
  alternative: Er ist von den Toten auferstanden
  rationale: Das grammatische Passiv des Ausgangstextes und die damit verbundene theologische Offenheit werden erhalten.
- issue: Aussage über das Vorausgehen nach Galiläa
  choice: Er geht euch voraus nach Galiläa
  alternative: Er wird vor euch nach Galiläa gehen
  rationale: Das griechische Präsens wird bewahrt; eine unnötige Umformung ins Futur wird vermieden.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem biblischem Ton. Die direkte Rede ist klar gegliedert; die Wiederholung von ἰδού wird bewusst erhalten.
