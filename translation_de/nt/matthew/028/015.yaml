source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: de
  text: Sie nahmen das Silber und taten, wie man sie angewiesen hatte. Und diese Geschichte[a] hat sich unter den Juden bis auf den heutigen Tag verbreitet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Bericht“. Das griechische Wort λόγος kann je nach Zusammenhang „Wort“, „Bericht“, „Darstellung“ oder „Geschichte“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: sie nahmen
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Handlung in der Erzählfolge; „nahmen“ ist hier natürlich und knüpft an die Übergabe des Geldes im vorherigen Vers an.
- source_word: τὰ ἀργύρια
  choice: das Silber
  rationale: Die Wiedergabe bewahrt die konkrete Bezeichnung des griechischen Ausdrucks, ohne ihn unnötig auf Münzen festzulegen; „das Geld“ wäre ebenfalls möglich, aber weniger formnah.
- source_word: ἐποίησαν
  choice: taten
  rationale: Das gebräuchliche Verb ποιέω bedeutet hier „tun“ beziehungsweise „ausführen“ und verbindet sich eng mit der folgenden Anweisung.
- source_word: ὡς ἐδιδάχθησαν
  choice: wie man sie angewiesen hatte
  rationale: Das Passiv von διδάσκω bedeutet in diesem Zusammenhang, dass ihnen vorgegeben worden war, was sie tun beziehungsweise sagen sollten. Die unpersönliche Form gibt das griechische Passiv natürlich wieder.
- source_word: διεφημίσθη
  choice: hat sich … verbreitet
  rationale: Das Verb bezeichnet die weite Verbreitung einer Nachricht. Das deutsche Perfekt mit reflexiver Form drückt idiomatisch aus, dass die Verbreitung in der Vergangenheit begann und bis zur Gegenwart des Erzählers fortwirkt.
- source_word: ὁ λόγος οὗτος
  choice: diese Geschichte
  rationale: λόγος bezeichnet hier die von den Wächtern verbreitete Darstellung. „Geschichte“ ist im Deutschen verständlich, lässt aber wie das Griechische offen, wie die Darstellung bewertet wird; „Bericht“ bleibt als Alternative in der Fußnote erhalten.
- source_word: παρὰ Ἰουδαίοις
  choice: unter den Juden
  rationale: παρά mit Dativ bezeichnet hier den Kreis, innerhalb dessen die Darstellung verbreitet wurde. Die Formulierung gibt die gemeinschaftliche Reichweite wieder, ohne über den Erzählzusammenhang hinauszugehen.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: bis auf den heutigen Tag
  rationale: Dies ist eine natürliche, würdige deutsche Entsprechung der festen Wendung und bezieht sich auf die Gegenwart des Verfassers.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίοις in einem Kontext, der pauschalisierend verstanden werden könnte
  choice: unter den Juden
  alternative: unter jüdischen Menschen; unter den Judäern
  rationale: Die unmittelbare Aussage betrifft die Verbreitung einer Darstellung innerhalb der damaligen jüdischen Gemeinschaft. „Unter den Juden“ ist die direkte lexikalische Wiedergabe; der Vers fällt damit kein allgemeines Urteil über Juden, und „Judäer“ würde den regionalen Aspekt stärker betonen, als es der Zusammenhang nahelegt.
- issue: Bewertung der mit λόγος bezeichneten Darstellung
  choice: Geschichte
  alternative: Bericht; Darstellung
  rationale: Der griechische Ausdruck legt nicht allein fest, ob die verbreitete Aussage als neutraler Bericht oder als erfundene Geschichte bezeichnet wird. Die Hauptübersetzung bleibt idiomatisch, während die Fußnote die echte lexikalische Alternative sichtbar macht.
translation_notes:
  register: Modernes Standarddeutsch in einem natürlichen, würdigen Erzählstil. Die Satzstruktur bleibt nah am griechischen Ablauf; die traditionelle Wendung „bis auf den heutigen Tag“ ist allgemein verständlich. Der Fußnotenmarker [a] steht unmittelbar bei dem mehrdeutigen Ausdruck.
