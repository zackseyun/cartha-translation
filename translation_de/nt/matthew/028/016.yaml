  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: de
  text: Die elf Jünger gingen nach Galiläa, auf den Berg, wohin Jesus sie bestellt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wo Jesus ihnen den Ort bestimmt hatte«; das griechische Verb kann »bestimmen«, »anweisen« oder »festlegen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches Bindewort für den Fortgang der Erzählung. Im Deutschen ist kein ausdrückliches »nun« oder »aber« nötig; ein solches Wort würde zeitliche oder gegensätzliche Nuancen stärker markieren als der griechische Text.
- source_word: οἱ ἕνδεκα μαθηταί
  choice: die elf Jünger
  rationale: »Jünger« ist die etablierte und kontextgemäße Wiedergabe von μαθηταί; »elf« bewahrt den ausdrücklichen Hinweis auf die nach Judas verbleibende Gruppe.
- source_word: ἐπορεύθησαν
  choice: gingen
  rationale: Das schlichte »gingen« gibt die gewöhnliche Bewegungsbedeutung natürlich wieder; »reisten« oder »zogen« wären stilistisch stärker.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei einer Bewegung zu einer geografischen Region entspricht »nach Galiläa« natürlichem Standarddeutsch.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: ὄρος bezeichnet hier einen bestimmten Berg. Bei einem Berg ist »auf den Berg« im Deutschen idiomatischer als das formal nähere »zu dem Berg«.
- source_word: οὗ
  choice: den
  rationale: 'Das griechische Ortsrelativ »wo« wird zusammen mit ἐτάξατο im Deutschen natürlich als Relativsatz mit Akkusativ wiedergegeben: »den … genannt hatte«.'
- source_word: ἐτάξατο αὐτοῖς
  choice: ihnen genannt hatte
  rationale: Im Kontext bezeichnet τάσσω wahrscheinlich Jesu vorherige Festlegung beziehungsweise Mitteilung des Treffpunkts. »Genannt hatte« ist natürlich und bewahrt den Ortsbezug, ohne eine formelle Ernennung anzudeuten; die breitere Bedeutung wird in der Fußnote ausgewiesen.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Übliche deutsche Form des Personennamens.
theological_decisions:
- issue: Art der vorherigen Festlegung durch Jesus
  choice: »den Jesus ihnen genannt hatte«
  alternative: »den Jesus ihnen bestimmt hatte« / »wohin Jesus sie beordert hatte«
  rationale: Der griechische Ausdruck kann Bestimmen, Anordnen oder Zuweisen bezeichnen. Im Zusammenhang geht es um den zuvor festgelegten Treffpunkt. Die Hauptfassung vermeidet sowohl eine kirchenamtliche Bedeutung von »bestimmen« als auch den stärkeren Befehlscharakter von »beordern«; die lexikalische Spannweite bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Terminologie. Die Satzstellung folgt natürlichem deutschem Erzählstil; das schwache griechische Bindewort δέ bleibt ohne eigene Wiedergabe. Der Fußnotenmarker steht unmittelbar nach der davon betroffenen Formulierung.
