  naturalness: »Die elf Jünger gingen nach Galiläa auf den Berg« ist verständlich, benötigt im modernen Standarddeutsch jedoch ein Komma bzw. eine klarere Fügung. »auf den Berg, wohin Jesus sie bestellt hatte« ist idiomatisch und präzise.
  terminology: »Jünger«, »Galiläa« und »Jesus« sind angemessen. »Bestellt hatte« ist hier eine natürliche, nicht konfessionell geprägte Wiedergabe für die vorherige Anweisung bzw. Festlegung eines Zusammenkunftsortes.
