source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: de
  text: 'und sagten: „Sagt: ‚Seine Jünger sind in der Nacht gekommen und haben ihn[a] gestohlen, während wir schliefen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihn“, nicht „seinen Leichnam“ oder „seinen Körper“.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet den Inhalt der Anweisung ein. Im fortlaufenden deutschen Erzählstil wird es natürlich durch einen beigeordneten finiten Satz wiedergegeben.
- source_word: Εἴπατε
  choice: Sagt
  rationale: Der Aoristimperativ in der zweiten Person Plural wird als unmittelbare Aufforderung wiedergegeben, ohne zusätzliche Verstärkung.
- source_word: ὅτι
  choice: durch die direkte Rede ausgedrückt
  rationale: Die Konjunktion leitet den Inhalt der Aussage ein; im Deutschen übernimmt die verschachtelte direkte Rede diese Funktion idiomatisch.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Seine Jünger
  rationale: Die possessive Fügung wird im Deutschen natürlich wiedergegeben. Die Großschreibung folgt allein dem Satzanfang und deutet keine besondere Ehrenschreibung an.
- source_word: νυκτὸς
  choice: in der Nacht
  rationale: Der adverbiale Genitiv bezeichnet die Zeit ihres Kommens; „in der Nacht“ ist die natürliche moderne deutsche Entsprechung.
- source_word: ἐλθόντες
  choice: sind ... gekommen
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende beziehungsweise mit ihr verbundene Handlung. Die finite Koordination ist im Deutschen klar und natürlich.
- source_word: ἔκλεψαν
  choice: haben ... gestohlen
  rationale: Das Verb bezeichnet schlicht einen Diebstahl; die Perfektform passt zur gesprochenen deutschen Behauptung.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Personalpronomen bezieht sich auf Jesus. Eine Erweiterung zu „seinen Leichnam“ oder „seinen Körper“ stünde nicht im griechischen Text.
- source_word: ἡμῶν κοιμωμένων
  choice: während wir schliefen
  rationale: Der Genitivus absolutus gibt den begleitenden zeitlichen Umstand an; der Nebensatz bewahrt diesen Sinn in klarem modernem Deutsch.
theological_decisions:
- issue: Bezug von αὐτόν in dem erfundenen Bericht
  choice: Das Personalpronomen „ihn“ bleibt erhalten.
  alternative: „seinen Leichnam“ oder „seinen Körper“
  rationale: Der griechische Text spricht persönlich von „ihm“. Eine sachliche Umschreibung würde eine Deutung ergänzen, die zwar aus dem Erzählzusammenhang naheliegt, aber nicht ausdrücklich im Wortlaut steht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte direkte Rede macht Befehl und vorgegebene Lüge transparent; die Perfektformen klingen in der zitierten mündlichen Behauptung natürlich.
