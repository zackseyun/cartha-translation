id: MAT.28.20
reference: Matthew 28:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: de
  text: 'und lehrt sie, alles zu befolgen, was ich euch geboten habe. Und seht: Ich bin alle Tage bei euch bis zur Vollendung des Zeitalters.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Ende des Zeitalters“; traditionell: „bis zum Ende der Welt“. Das Griechische spricht von der Vollendung des Zeitalters (αἰών), nicht ausdrücklich von der physischen Welt.'
    reason: Alternative Wiedergabe und Erklärung der sachlichen Abgrenzung von αἰών gegenüber der physischen Welt.
lexical_decisions:
- source_word: διδάσκοντες
  choice: und lehrt sie
  rationale: Das Präsenspartizip beschreibt, auf welche fortdauernde Weise Menschen zu Jüngern gemacht werden. Im Deutschen führt die koordinierte Verbform den Satz aus dem vorhergehenden Vers natürlich weiter.
- source_word: τηρεῖν
  choice: zu befolgen
  rationale: τηρέω bezeichnet hier das bewahrende Einhalten von Geboten. „Befolgen“ gibt den Gehorsamsaspekt im modernen Deutsch klar wieder, ohne ihn auf äußerliche Regelbefolgung zu beschränken.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die umfassende griechische Wendung wird so vollständig und idiomatisch wiedergegeben.
- source_word: ἐνετειλάμην
  choice: ich euch geboten habe
  rationale: „Gebieten“ bewahrt die autoritative Kraft von ἐντέλλομαι und klingt in dieser feierlichen Rede würdig, ohne so schroff wie „anordnen“ zu wirken.
- source_word: ἰδοὺ
  choice: seht
  rationale: Der Aufmerksamkeitsmarker hebt die folgende Zusage nachdrücklich hervor. „Seht“ ist verständlich und feierlich, während „siehe“ im heutigen Standarddeutsch stärker altertümlich wirkt.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ich bin bei euch
  rationale: „Bei euch“ gibt die zugesagte Gegenwart Jesu im Deutschen unmittelbar und natürlich wieder.
- source_word: πάσας τὰς ἡμέρας
  choice: alle Tage
  rationale: Die wörtliche Tagesformulierung bewahrt den fortdauernden, Tag für Tag geltenden Sinn und ist im Deutschen weiterhin verständlich und würdevoll.
- source_word: συντελείας
  choice: Vollendung
  rationale: συντέλεια bezeichnet das zu seinem Abschluss Kommen. „Vollendung“ bewahrt diesen eschatologischen Gehalt genauer als das allgemeinere „Ende“.
- source_word: αἰῶνος
  choice: des Zeitalters
  rationale: αἰών bezeichnet hier ein Zeitalter beziehungsweise eine Weltzeit, nicht ausdrücklich die physische Welt. „Zeitalter“ macht diese Unterscheidung im Deutschen klar.
theological_decisions:
- issue: Zeitangabe ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: bis zur Vollendung des Zeitalters
  alternative: 'bis zum Ende des Zeitalters; traditionell: bis zum Ende der Welt'
  rationale: 'Die Übersetzung hält die eschatologische Spannung von συντέλεια und αἰών fest: Gemeint ist das zum Abschluss Kommen des Zeitalters, ohne damit ausdrücklich eine Vernichtung der physischen Welt zu behaupten.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Seht“ vermeidet das altertümlichere „siehe“; „alle Tage“ erhält bewusst den feierlichen und tageweisen Klang der griechischen Wendung. Der Versanfang ist als Fortsetzung von Matthäus 28,19 formuliert.
