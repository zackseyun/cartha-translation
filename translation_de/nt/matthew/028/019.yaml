id: MAT.28.19
reference: Matthew 28:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: de
  text: Darum geht und macht alle Völker zu Jüngern, indem ihr sie auf den Namen[a] des Vaters und des Sohnes und des Heiligen Geistes tauft,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „in den Namen hinein“. Das kann die Aufnahme in eine Beziehung beziehungsweise die Zuordnung zu dem einen Namen betonen. Auch die Wiedergabe „im Namen“ ist möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: geht
  rationale: Das vorangestellte Aoristpartizip steht in enger Verbindung mit dem Imperativ μαθητεύσατε und trägt hier den Aufforderungscharakter mit. „Geht“ gibt das im heutigen Deutsch natürlicher wieder als das schwerfällige „nachdem ihr gegangen seid“; „während ihr geht“ würde den Sendungscharakter unnötig abschwächen.
- source_word: οὖν
  choice: Darum
  rationale: Die Konjunktion zieht die Folgerung aus Jesu unmittelbar zuvor erklärter Vollmacht. „Darum“ stellt diesen Zusammenhang im Deutschen klar und idiomatisch her.
- source_word: μαθητεύσατε
  choice: macht … zu Jüngern
  rationale: Das Verb bezeichnet, Menschen zu Jüngern zu machen. Die Umschreibung bewahrt den kausativen Sinn und ist im modernen Deutsch verständlicher als das seltene Verb „jüngern“.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη bezeichnet hier umfassend die Völker beziehungsweise Volksgruppen. „Alle Völker“ bewahrt die universale Reichweite; „alle Heiden“ wäre zu eng und könnte die jüdische Bevölkerung ausschließen.
- source_word: βαπτίζοντες
  choice: indem ihr sie … tauft
  rationale: Das Partizip erläutert, wie der Auftrag zum Jüngermachen ausgeführt wird. „Taufen“ bezeichnet den christlichen Ritus, ohne eine konfessionell umstrittene Taufweise festzulegen.
- source_word: εἰς τὸ ὄνομα
  choice: auf den Namen
  rationale: Das im Deutschen etablierte „auf den Namen taufen“ bezeichnet Zuordnung und Bindung und bewahrt damit mehr von der Zielrichtung des griechischen εἰς als das bloß instrumentale „im Namen“. Die wörtlichere räumliche Form wird in der Fußnote genannt.
- source_word: τοῦ πατρὸς
  choice: des Vaters
  rationale: In der dreigliedrigen Formel ist „Vater“ eine personale Gottesbezeichnung; die Großschreibung entspricht dem deutschen Gebrauch.
- source_word: τοῦ υἱοῦ
  choice: des Sohnes
  rationale: In der Zuordnung zu Vater und Heiligem Geist ist „Sohn“ ein göttlicher Titel und wird entsprechend großgeschrieben.
- source_word: τοῦ ἁγίου πνεύματος
  choice: des Heiligen Geistes
  rationale: Dies ist die geläufige moderne deutsche Wiedergabe der personalen Gottesbezeichnung; sie entspricht der koordinierten Stellung in der Taufformel.
theological_decisions:
- issue: Wiedergabe der Präposition εἰς in der Taufformel
  choice: auf den Namen
  alternative: in den Namen hinein; im Namen
  rationale: εἰς hat eine auf ein Ziel gerichtete Bedeutung und kann hier Aufnahme in eine Beziehung beziehungsweise Zuordnung ausdrücken. „Auf den Namen“ ist im Deutschen idiomatisch und bewahrt diese Bindungsdimension, ohne eine bestimmte Sakramentslehre festzuschreiben. Die Fußnote macht den ungewöhnlicheren griechischen Ausdruck transparent.
- issue: Singular „Name“ bei Vater, Sohn und Heiligem Geist
  choice: den Singular unverändert bewahren und die drei Bezeichnungen als personale göttliche Titel großschreiben
  alternative: die Titel kleinschreiben oder den Singular durch mehrere Namen ersetzen
  rationale: Der griechische Text verbindet einen einzigen „Namen“ mit drei koordinierten Genitiven. Die Übersetzung erhält diese sprachlich und theologisch bedeutsame Spannung, ohne sie erklärend auszubauen.
- issue: Verhältnis der Partizipien zum Auftrag, Jünger zu machen
  choice: βαπτίζοντες mit „indem“ als Ausführung des Hauptauftrags wiedergeben
  alternative: als selbstständigen zweiten Imperativ wiedergeben
  rationale: Das Partizip ist syntaktisch dem Hauptimperativ untergeordnet und beschreibt die Ausführung des Jüngermachens. „Indem“ macht diese Beziehung deutlich, ohne Taufe und Jüngerschaft gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Geht“ ist natürlicher als das heute markierte „geht hin“; „auf den Namen taufen“ ist kirchlich vertraut, aber weiterhin verständlich. Die Satzstruktur wahrt den Hauptauftrag und die untergeordnete Partizipialkonstruktion.
