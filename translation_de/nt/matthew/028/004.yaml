  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: de
  text: Aus Furcht vor ihm erbebten die Wachen und wurden wie Tote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ δὲ τοῦ φόβου αὐτοῦ
  choice: Aus Furcht vor ihm
  rationale: ἀπό mit dem Genitiv bezeichnet hier Ursache oder Ausgangspunkt der Reaktion. „Aus Furcht“ gibt den kausalen Sinn natürlich wieder; „vor ihm“ bezeichnet den Engel als Gegenstand der Furcht. Das milde δέ wird im Deutschen nicht eigens wiedergegeben, da der narrative Anschluss auch ohne Konjunktion klar und flüssig ist.
- source_word: ἐσείσθησαν
  choice: erbebten
  rationale: Das Verb σείω bezeichnet ein Erschüttertwerden oder Beben. „Erbebten“ ist anschaulich, idiomatisch und bewahrt den sprachlichen Anklang an das Erdbeben im vorhergehenden Zusammenhang, ohne diesen ausdrücklich auszudeuten.
- source_word: οἱ τηροῦντες
  choice: die Wachen
  rationale: Das substantivierte Partizip bedeutet wörtlich „die Bewachenden“. Im Zusammenhang sind die zur Bewachung des Grabes eingesetzten Männer gemeint; „die Wachen“ ist knapp und natürlich.
- source_word: ἐγενήθησαν ὡς νεκροί
  choice: wurden wie Tote
  rationale: 'ἐγενήθησαν bezeichnet einen Zustandswechsel, daher „wurden“. ὡς führt einen Vergleich ein: Sie starben nicht notwendigerweise tatsächlich, sondern wurden beziehungsweise wirkten „wie Tote“.'
theological_decisions:
- issue: Bezug von αὐτοῦ („ihm“)
  choice: Das Pronomen bezieht sich auf den im vorherigen Vers beschriebenen Engel.
  alternative: Bezug auf das himmlische Geschehen insgesamt
  rationale: Der Engel ist der nächste grammatisch und sachlich passende Bezugspunkt; seine furchterregende Erscheinung wird unmittelbar zuvor beschrieben. Die Übersetzung lässt den pronominalen Bezug dennoch in derselben knappen Form wie der griechische Text stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbebten“ erhält die eindringliche Bildsprache des griechischen Verbs; „wie Tote“ wahrt ausdrücklich den Vergleich und vermeidet die Aussage, die Wachen seien tatsächlich gestorben.
