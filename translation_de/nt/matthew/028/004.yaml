review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die kausale Wendung ἀπὸ ... φόβου mit „Aus Furcht“ zutreffend wieder und bewahrt den personalen Bezug von αὐτοῦ durch „vor ihm“. „Die Wachen“ trifft οἱ τηροῦντες im Kontext präzise. „Erbebten“ vermittelt die durch ἐσείσθησαν bezeichnete körperliche Erschütterung bzw. das Zittern angemessen. „wurden wie Tote“ bewahrt sowohl den durch ἐγενήθησαν ausgedrückten Zustandswechsel als auch den Vergleichscharakter von ὡς; es behauptet nicht ihren tatsächlichen Tod.
  naturalness: „Aus Furcht vor ihm erbebten die Wachen und wurden wie Tote“ ist idiomatisches, würdiges modernes Standarddeutsch. Die leicht gehobene Form „erbebten“ ist für den erzählenden Bibelregister passend und verständlich.
  terminology: „Wachen“ ist im Grabwachen-Kontext klar; „Tote“ ist eine natürliche deutsche Entsprechung für νεκροί. Der Bezug von „ihm“ bleibt, wie im griechischen Text, knapp und kontextabhängig auf den zuvor genannten Engel bezogen. Das unbetonte δέ muss im Deutschen nicht zwingend ausdrücklich abgebildet werden.
