id: MAT.28.3
reference: Matthew 28:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: de
  text: Sein Aussehen war wie ein Blitz[a], und sein Gewand war weiß wie Schnee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Gestalt war wie ein Blitz.“'
    reason: Lexikalische Alternative für εἰδέα; „Gestalt“ hebt stärker die sichtbare äußere Erscheinungsform hervor.
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort. Der deutsche Satzanschluss ist auch ohne ein ausdrückliches „und“, „aber“ oder „nun“ natürlich und genau.
- source_word: εἰδέα
  choice: Aussehen
  rationale: Das Wort bezeichnet die sichtbare äußere Erscheinung oder Gestalt. „Aussehen“ ist im heutigen Deutsch natürlich und bewahrt den Bezug auf das Wahrnehmbare.
- source_word: ὡς ἀστραπή
  choice: wie ein Blitz
  rationale: ὡς kennzeichnet einen Vergleich; „wie ein Blitz“ gibt das Bild idiomatisch wieder, ohne zusätzliche Deutung.
- source_word: ἔνδυμα
  choice: Gewand
  rationale: ἔνδυμα bezeichnet ein Kleidungsstück beziehungsweise die Kleidung. „Gewand“ passt zum würdigen biblischen Erzählregister, ohne eine besondere Gewandart wie eine Robe festzulegen.
- source_word: λευκόν
  choice: weiß
  rationale: Die einfache Farbangabe wird ohne eine im Griechischen nicht ausdrücklich genannte Verstärkung wiedergegeben.
- source_word: ὡς χιών
  choice: wie Schnee
  rationale: Der zweite Vergleich beschreibt die Weiße des Gewandes; „wie Schnee“ ist klares, natürliches Deutsch.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: Die Pronomen beziehen sich auf den in Vers 2 genannten Engel des Herrn; die Übersetzung behält dennoch das Pronomen „sein“ bei.
  alternative: Im weiteren Auferstehungskontext könnte das Pronomen irrtümlich auf Jesus bezogen werden.
  rationale: Der nächstliegende Bezug im griechischen Kontext ist der Engel des Herrn. Eine ausdrückliche Einfügung von „des Engels“ würde zwar klären, aber über den Wortlaut dieses Verses hinausgehen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die parallelen Vergleiche des griechischen Satzes bleiben erhalten; die Ellipse im zweiten Satzglied wird für natürliches Deutsch durch ein zweites „war“ aufgelöst.
