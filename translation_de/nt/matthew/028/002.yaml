  source_fidelity: 'Die Wiedergabe trifft den Sinn der meisten Satzglieder: μεγάς als „stark“, ἄγγελος κυρίου als „ein Engel des Herrn“, das Herabkommen vom Himmel, die Annäherung und das Wegwälzen des Steins sind sachgerecht. Bei ἐκάθητο steht jedoch Imperfekt und bezeichnet den Zustand des Sitzens, nicht den punktuellen Beginn des Sich-Setzens.'
  naturalness: Der Text ist insgesamt klares, modernes Standarddeutsch mit angemessen würdigem Erzählton. „Saß darauf“ ist hier ebenso natürlich wie genauer als „setzte sich darauf“.
  terminology: „Engel des Herrn“ ist die etablierte und neutrale Wiedergabe; der unbestimmte Artikel entspricht dem anarthrischen griechischen Ausdruck. Es sind keine Fußnoten erforderlich.
  issues:
  - severity: medium
    issue: „setzte sich darauf“ gibt ἐκάθητο nicht aspektgerecht wieder.
    rationale: ἐκάθητο ist Imperfekt („saß“, „saß da“) und beschreibt das andauernde Ergebnis bzw. den Zustand. „Setzte sich“ wäre im Deutschen ein punktuelles, inchoatives Ereignis und entspricht eher einem Aorist wie ἐκάθισεν.
