  rationale: Die einzige sichere Korrektur ist die aspektgerechte Wiedergabe von ἐκάθητο mit „saß darauf“. Die übrigen Entscheidungen bleiben erhalten, da sie den griechischen Text idiomatisch und ohne zusätzliche theologische Festlegung wiedergeben.
