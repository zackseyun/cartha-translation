id: MAT.28.2
reference: Matthew 28:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: de
  text: Und siehe, es geschah ein starkes Erdbeben; denn ein Engel des Herrn war vom Himmel herabgestiegen, trat hinzu, wälzte den Stein weg und saß darauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδού
  choice: Und siehe
  rationale: Bewahrt den erzählerischen Aufmerksamkeitsruf in knapper, würdevoller und im biblischen Deutsch verständlicher Form.
- source_word: σεισμὸς ... μέγας
  choice: ein starkes Erdbeben
  rationale: μέγας bezeichnet hier die große Stärke beziehungsweise Heftigkeit des Erdbebens; „stark“ klingt im heutigen Deutsch natürlich.
- source_word: ἄγγελος ... κυρίου
  choice: ein Engel des Herrn
  rationale: Gibt die unbestimmte Nominalphrase und den Genitiv idiomatisch wieder, ohne die Identität weiter festzulegen.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: war vom Himmel herabgestiegen
  rationale: Das Plusquamperfekt macht im Deutschen die durch γάρ erklärte, dem folgenden Handeln vorausgehende Bewegung deutlich, ohne eine zusätzliche zeitliche Behauptung einzuführen.
- source_word: προσελθών
  choice: trat hinzu
  rationale: Entspricht der räumlichen Annäherung und bleibt bewusst ohne ein im Griechischen nicht ausdrücklich genanntes Zielobjekt.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: wälzte den Stein weg
  rationale: Gibt die konkrete Rollbewegung und das Entfernen des Steins prägnant wieder.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: setzte sich darauf
  rationale: Im Erzählzusammenhang ist dies die natürliche deutsche Wiedergabe der imperfektiven Form; das Pronomen bezieht sich am naheliegendsten auf den Stein.
theological_decisions:
- issue: Bezeichnung des Engels
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Der griechische Ausdruck steht ohne Artikel. Die unbestimmte Wiedergabe vermeidet es, aus der festen deutschen Wendung eine besondere, eindeutig identifizierte Gestalt abzuleiten.
- issue: Zeitliche Beziehung zwischen Erdbeben und Herabkommen des Engels
  choice: „denn ... war ... herabgestiegen“
  alternative: „denn ... stieg ... herab“
  rationale: γάρ erklärt das Erdbeben durch das Herabkommen beziehungsweise Handeln des Engels. Die deutsche Vorvergangenheit bildet die partizipiale Vorzeitigkeit natürlich ab, ohne zu entscheiden, wie lange zuvor dies geschah.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die markante Formel „Und siehe“ bleibt erhalten; unnötige Archaismen werden vermieden.
