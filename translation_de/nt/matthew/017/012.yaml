  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: de
  text: 'Doch ich sage euch: Elia ist schon gekommen, und sie haben ihn nicht erkannt[a], sondern sie taten ihm an, was sie wollten[b]. Ebenso steht dem Menschensohn bevor, durch sie zu leiden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie haben ihn nicht als solchen erkannt“ beziehungsweise „sie haben ihn nicht anerkannt“. Das griechische Verb kann hier das fehlende Erkennen seiner Identität oder Rolle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie behandelten ihn, wie sie wollten“. Die griechische Wendung bezeichnet ein uneingeschränktes Handeln an ihm beziehungsweise gegen ihn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ebenso wird der Menschensohn durch sie leiden.“ Das griechische μέλλει hebt hervor, dass dieses Leiden bevorsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Doch ich sage euch
  rationale: Die direkte Redeform bleibt erhalten; δέ markiert hier den Gegensatz zur zuvor genannten Erwartung und wird daher mit „Doch“ wiedergegeben.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Elia ist schon gekommen
  rationale: Die deutsche Perfektform gibt das abgeschlossene Kommen mit seiner gegenwärtigen Bedeutung natürlich wieder; ἤδη entspricht „schon“.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: sie haben ihn nicht erkannt
  rationale: ἐπιγινώσκω bezeichnet im Zusammenhang das fehlende Erkennen seiner Identität beziehungsweise seiner Rolle, nicht bloß mangelnde Bekanntschaft.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: mit ihm gemacht, was sie wollten
  rationale: Die idiomatische Verbindung wird in natürlichem Deutsch wiedergegeben und bewahrt den Sinn uneingeschränkten, im Kontext feindseligen Handelns, ohne die Art der Handlungen näher festzulegen.
- source_word: οὕτως καὶ
  choice: So ... auch
  rationale: Die Formulierung kennzeichnet knapp die Entsprechung zwischen Elias Schicksal und dem bevorstehenden Leiden des Menschensohnes.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe bewahrt den Titel und seine biblischen Bezüge.
- source_word: μέλλει πάσχειν
  choice: steht ... bevor, ... zu leiden
  rationale: Die Formulierung bringt den bevorstehenden Charakter des Leidens zum Ausdruck, ohne eine über den griechischen Wortlaut hinausgehende Aussage über göttliche Notwendigkeit einzutragen.
- source_word: ὑπ’ αὐτῶν
  choice: durch sie
  rationale: ὑπό mit Genitiv bezeichnet die handelnden Verursacher; „durch sie“ gibt diese Urheberschaft klar und ohne zusätzliche Bildsprache wieder.
theological_decisions:
- issue: Identität des gekommenen Elia
  choice: Der Text nennt weiterhin Elia und überlässt seine Identifizierung mit Johannes dem Täufer dem unmittelbaren Zusammenhang.
  alternative: Elia im Haupttext ausdrücklich als Johannes den Täufer zu bezeichnen.
  rationale: Dieser Vers selbst nennt Elia; eine ausdrückliche Identifizierung würde die kontextuelle Auslegung in den Wortlaut hineintragen.
- issue: Aussagekraft von μέλλει hinsichtlich des Leidens des Menschensohnes
  choice: Das Leiden wird als bevorstehend dargestellt.
  alternative: „muss leiden“ oder „ist dazu bestimmt zu leiden“
  rationale: μέλλει πάσχειν bezeichnet hier bevorstehendes Leiden, formuliert in diesem Satz aber nicht ausdrücklich eine göttliche Notwendigkeit oder Bestimmung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am griechischen Gedankengang, während idiomatische Wendungen natürlich deutsch formuliert sind. Mehrdeutigkeiten bei „erkennen“, dem Handeln an Elia und der Nuance des bevorstehenden Leidens werden in Fußnoten offengehalten.
