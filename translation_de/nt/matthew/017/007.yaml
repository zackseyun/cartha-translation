  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: de
  text: 'Und Jesus trat zu ihnen, berührte sie und sagte: „Steht auf und habt keine Angst!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: trat zu ihnen
  rationale: προσέρχομαι bezeichnet die Bewegung auf Personen zu. „Trat zu ihnen“ ist im Deutschen natürlich und würdevoll und gibt den Bezug auf die Jünger klar wieder.
- source_word: ἁψάμενος αὐτῶν
  choice: berührte sie
  rationale: Das Partizip von ἅπτω mit Genitiv bedeutet hier „berühren“. Die Beiordnung als finites Verb entspricht natürlichem deutschen Erzählstil, ohne eine Handauflegung in den Text hineinzulesen.
- source_word: εἶπεν
  choice: sagte
  rationale: Die schlichte Wiedergabe entspricht dem gewöhnlichen Sinn von λέγω und vermeidet eine interpretierende Erweiterung.
- source_word: Ἐγέρθητε
  choice: Steht auf
  rationale: Im Kontext liegen die Jünger mit dem Gesicht zu Boden (V. 6); der Imperativ fordert sie auf, sich zu erheben. „Steht auf“ ist klares, modernes Deutsch und passt zur konkreten Situation.
- source_word: μὴ φοβεῖσθε
  choice: habt keine Angst
  rationale: Die Formulierung gibt φοβέομαι idiomatisch und unmittelbar wieder. Der präsentische Imperativ muss hier nicht ausdrücklich als „Hört auf, euch zu fürchten“ entfaltet werden.
- source_word: καὶ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet Annäherung, Berührung und Rede als schlichte Handlungsfolge, ohne zusätzliche zeitliche Nuancen einzutragen.
theological_decisions:
- issue: Jesu beruhigenden Imperativ ohne zusätzliche seelsorgerliche oder lehrmäßige Deutung wiedergeben
  choice: Steht auf und habt keine Angst!
  alternative: Erhebt euch und fürchtet euch nicht!
  rationale: Die Übersetzung bewahrt sowohl die Aufforderung zum körperlichen Aufstehen als auch die Zusage gegen die Angst in direkter, natürlicher Sprache, ohne den Text auszuschmücken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Trat zu ihnen“ vermeidet das etwas distanzierte „näherte sich ihnen“; „habt keine Angst“ klingt gegenwärtig und bleibt dem griechischen Wortlaut treu.
