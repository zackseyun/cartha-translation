id: MAT.17.1
reference: Matthew 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: de
  text: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und dessen Bruder Johannes mit[b] und führt sie für sich allein[c] auf einen hohen Berg hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sechs Tage später“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nimmt … zu sich“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „abseits“ oder „privat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: nach sechs Tagen
  rationale: Die Wendung μετά mit Akkusativ bezeichnet zeitliche Folge. „Nach sechs Tagen“ bildet die griechische Formulierung genau und im Deutschen natürlich ab.
- source_word: παραλαμβάνει
  choice: nimmt … mit
  rationale: παραλαμβάνω bedeutet hier, Personen zu sich beziehungsweise mit sich zu nehmen. „nimmt … mit“ gibt diesen Begleitaspekt im Deutschen klar wieder.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petrus, Jakobus und … Johannes
  rationale: Verwendet werden die im Deutschen etablierten biblischen Namensformen.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: dessen Bruder
  rationale: Die appositionelle Wendung bezeichnet Johannes im Kontext als Bruder des Jakobus. „dessen Bruder Johannes“ ist im Deutschen eindeutig und vermeidet den möglichen falschen Bezug von „seinen Bruder“ auf Jesus.
- source_word: ἀναφέρει
  choice: führt … auf
  rationale: ἀναφέρω bezeichnet hier eine aufwärts gerichtete Bewegung. „führt sie auf einen hohen Berg“ ist natürlich und bewahrt sowohl Führung als auch Aufstieg.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: auf einen hohen Berg
  rationale: εἰς bezeichnet bei einem Bewegungsverb das Ziel; im Deutschen ist „auf einen hohen Berg“ die idiomatische Entsprechung.
- source_word: κατ’ ἰδίαν
  choice: wo sie für sich allein sind
  rationale: Die Wendung bezeichnet Absonderung von anderen. Die Satzform macht natürlich verständlich, dass Jesus und die drei Jünger dort ohne die übrigen sind.
theological_decisions:
- issue: Historisches Präsens in der Evangelienerzählung
  choice: 'Die Präsensformen werden beibehalten: „nimmt … mit“ und „führt“'
  alternative: 'Vergangenheitsformen: „nahm … mit“ und „führte“'
  rationale: Die griechischen Präsensformen παραλαμβάνει und ἀναφέρει beleben die Erzählung. Das historische Präsens ist auch im modernen Deutschen verständlich und natürlich.
- issue: Bezug von αὐτοῦ in „τὸν ἀδελφὸν αὐτοῦ“
  choice: Johannes wird als Bruder des Jakobus bezeichnet
  alternative: Die pronominale Form formal mehrdeutig wiedergeben
  rationale: Syntax und Kontext lassen die Apposition Johannes als Bruder des unmittelbar zuvor genannten Jakobus kennzeichnen. Eine künstliche Mehrdeutigkeit im Deutschen würde eher einen falschen Bezug auf Jesus nahelegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und die wiederholte Satzverbindung mit „und“ bewahren den lebendigen Duktus des griechischen Textes.
