revisions:
- from: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und dessen Bruder Johannes mit[b] und führt sie auf einen hohen Berg, wo sie für sich allein sind[c].
  to: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und dessen Bruder Johannes mit[b] und führt sie für sich allein[c] auf einen hohen Berg hinauf.
  rationale: Die Revision beschränkt sich auf die Stellung und Funktion von „für sich allein“, damit κατ’ ἰδίαν die Art des Hinaufführens bezeichnet, wie im griechischen Satz. Das historische Präsens, die eindeutige Zuordnung von Johannes als Bruder des Jakobus sowie die übrigen Formulierungen bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:45:33Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Zeitangabe, Auswahl der drei Jünger, den Aufstieg auf einen hohen Berg und das historische Präsens insgesamt zutreffend wieder. „Dessen Bruder Johannes“ klärt den im Kontext auf Jakobus bezogenen Ausdruck τὸν ἀδελφὸν αὐτοῦ angemessen. Die Wiedergabe von κατ’ ἰδίαν als Relativsatz („wo sie für sich allein sind“) verschiebt jedoch die adverbiale Bestimmung der Handlung zu einer bloßen Orts- bzw. Zustandsaussage und lässt zudem Jesus aus der bezeichneten abgesonderten Gruppe hervortreten.
  naturalness: Der Satz ist im modernen Standarddeutsch gut lesbar. Mit der Stellung „für sich allein“ bei „führt“ wird die Bedeutung von κατ’ ἰδίαν direkter und idiomatischer wiedergegeben als mit „wo sie ... sind“.
  terminology: Die etablierten deutschen Namensformen Jesus, Petrus, Jakobus und Johannes sind korrekt. „Hoher Berg“ und „führt ... hinauf“ entsprechen dem erzählerischen und semantischen Gehalt ohne unnötige Auslegung.
  issues:
  - severity: medium
    issue: κατ’ ἰδίαν ist als Orts-/Zustandsrelativsatz wiedergegeben.
    rationale: „wo sie für sich allein sind“ macht aus der adverbialen Absonderung bei Jesu Hinaufführen eine Aussage über den Aufenthalt auf dem Berg. „führt sie für sich allein ... hinauf“ erhält die syntaktische Funktion und schließt Jesus selbstverständlich in die abgesonderte Szene ein.
  revised_text: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und dessen Bruder Johannes mit[b] und führt sie für sich allein[c] auf einen hohen Berg hinauf.
