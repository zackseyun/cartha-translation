  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: de
  text: Doch[a] diese Art fährt nur durch Gebet und Fasten aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen syrischen und koptischen Übersetzungen. Er steht jedoch in der byzantinischen Mehrheitstradition, in der lateinischen Überlieferung und in den meisten syrischen Handschriften. Wahrscheinlich wurde er von späteren Schreibern zur Angleichung an Markus 9,29 eingefügt.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: Art
  rationale: Bezeichnet hier eine Kategorie oder Klasse von Dämonen; „Art“ ist im Deutschen die natürliche und sachlich passende Entsprechung.
- source_word: ἐκπορεύεται
  choice: fährt … aus
  rationale: Bezieht sich auf das Verlassen des besessenen Menschen durch den Dämon. „Ausfahren“ ist in diesem Zusammenhang präzise, verständlich und bewahrt den Bezug zur Dämonenaustreibung.
- source_word: εἰ μὴ
  choice: nur durch
  rationale: Die exklusive Bedeutung wird im Deutschen idiomatisch durch „nur durch“ wiedergegeben; damit bleibt ausgesagt, dass Gebet und Fasten die einzige genannte Voraussetzung sind.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: Gebet und Fasten
  rationale: Die beiden Dative mit ἐν bezeichnen hier das Mittel beziehungsweise den geistlichen Vollzug; die knappe deutsche Formulierung gibt beide Begriffe unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ gibt den einleitenden Gegensatz von δέ wieder. Die im Ausgangstext vorliegende Lesart wird übersetzt, während die erhebliche textkritische Unsicherheit in der Fußnote offengelegt wird.
