  source_fidelity: 'Die Übersetzung gibt den griechischen Text vollständig und sachgerecht wieder: δέ („Doch“), τὸ γένος („diese Art“), die Exklusivität von εἰ μὴ („nur durch“) sowie ἐν προσευχῇ καὶ νηστείᾳ („durch Gebet und Fasten“). „fährt … aus“ ist im Kontext einer Dämonenaustreibung eine etablierte und treffende Wiedergabe von ἐκπορεύεται.'
