id: MAT.17.24
reference: Matthew 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: de
  text: 'Als sie nach Kafarnaum gekommen waren, traten die Einnehmer der Zweidrachmensteuer[a] an Petrus heran und fragten: „Zahlt euer Lehrer die Zweidrachmensteuer nicht?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Doppeldrachmen“; gemeint ist die Tempelsteuer von zwei Drachmen.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Als sie … gekommen waren
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. Das deutsche Plusquamperfekt gibt wieder, dass ihre Ankunft dem Herantreten der Einnehmer vorausging; δέ bleibt als leichter Übergang unübersetzt.
- source_word: Καφαρναοὺμ
  choice: Kafarnaum
  rationale: Verwendet die im modernen Deutschen übliche biblische Schreibweise des Ortsnamens.
- source_word: προσῆλθον … τῷ Πέτρῳ
  choice: traten … an Petrus heran
  rationale: Gibt die gerichtete Annäherung natürlich und präzise wieder.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: die Einnehmer der Zweidrachmensteuer
  rationale: Die substantivierte Partizipialgruppe bezeichnet diejenigen, die die Doppeldrachmen einziehen. „Einnehmer“ drückt ihre Funktion aus; „Steuer“ erschließt den im Zusammenhang vorausgesetzten Zahlungscharakter.
- source_word: δίδραχμα
  choice: Zweidrachmensteuer
  rationale: Das Wort bezeichnet wörtlich Doppeldrachmen beziehungsweise Zahlungen im Wert von je zwei Drachmen. Die kontextuelle Wiedergabe als Steuer ist verständlich; eine Fußnote bewahrt die wörtliche Geldbezeichnung und nennt den kulturellen Bezug.
- source_word: εἶπαν
  choice: fragten
  rationale: Obwohl das Verb allgemein „sagten“ bedeutet, folgt direkte Fragerede. „Fragten“ ist im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: euer Lehrer
  rationale: διδάσκαλος bezeichnet hier Jesus in seiner Rolle als Lehrer. Das pluralische ὑμῶν wird mit „euer“ bewahrt.
- source_word: οὐ τελεῖ
  choice: Zahlt … nicht?
  rationale: τελέω bedeutet in diesem Zusammenhang, eine geschuldete Zahlung zu leisten. Die verneinte Frageform bleibt erhalten und legt daher weiterhin eine bejahende Antwort nahe, ohne sie ausdrücklich vorzugeben.
theological_decisions:
- issue: Bestimmung der Doppeldrachmen als Tempelsteuer
  choice: Im Haupttext „Zweidrachmensteuer“, mit kultureller Einordnung in der Fußnote
  alternative: Wörtlich „die Doppeldrachmen“ beziehungsweise „Doppeldrachmen“ ohne nähere Bestimmung
  rationale: Der unmittelbare Zusammenhang handelt vom Entrichten einer festgesetzten Abgabe. Dass es sich um die Tempelsteuer handelt, ist historisch und im Fortgang der Erzählung begründet, steht jedoch nicht ausdrücklich im griechischen Wortlaut dieses Verses; deshalb erscheint diese nähere Bestimmung nur in der Fußnote.
- issue: Pragmatische Wirkung der verneinten Frage
  choice: Die negative Frage „Zahlt … nicht?“ unverändert bewahren
  alternative: Die erwartete Zustimmung explizit machen, etwa „Euer Lehrer zahlt doch die Steuer, oder?“
  rationale: Die griechische Form dürfte eine bejahende Antwort erwarten, legt den genauen Ton aber nicht vollständig fest. Die formnahe deutsche Frage erhält diese Spannung, ohne Vorwurf oder Erwartung stärker auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zweidrachmensteuer“ ist bewusst verständlicher als das fachsprachliche „Didrachmensteuer“, während die Fußnote die wörtliche Form und den kulturellen Hintergrund sichert.
