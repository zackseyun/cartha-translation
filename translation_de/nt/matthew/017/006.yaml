  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: de
  text: Als die Jünger das hörten,[a] fielen sie auf ihr Angesicht[b] und fürchteten sich sehr.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Aoristpartizip kann zeitlich mit „als sie das hörten“ oder formaler mit „nachdem sie gehört hatten“ wiedergegeben werden. Das Objekt ist im Griechischen nicht ausdrücklich genannt, ergibt sich aber aus dem Zusammenhang.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf ihr Angesicht“. Gemeint ist, dass sie mit dem Gesicht zum Boden niederfielen.'
    reason: lexical_alternative
  - marker: c
    text: 'Das griechische Adverb σφόδρα verstärkt die Furcht: Sie fürchteten sich sehr beziehungsweise außerordentlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Als ... das hörten
  rationale: Das adverbiale Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. „Das“ nimmt sinngemäß die zuvor erwähnte Stimme auf, ohne sie ausdrücklich in den Vers einzutragen.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Im Evangelienkontext ist „Jünger“ die etablierte und sachlich passende Wiedergabe.
- source_word: ἔπεσαν
  choice: fielen
  rationale: Die schlichte Erzählform bewahrt den Aussagegehalt von πίπτω, ohne eine absichtliche Niederwerfung in das Verb hineinzulesen.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: auf ihr Angesicht
  rationale: Die singularische Form des griechischen Ausdrucks wird formal bewahrt. „Angesicht“ ist im Deutschen eine verständliche, würdige Wendung für die körperliche Haltung des Niederfallens.
- source_word: ἐφοβήθησαν
  choice: fürchteten sich
  rationale: Natürliche deutsche Wiedergabe des deponentisch gebrauchten Verbs, ohne zwischen Schrecken und ehrfürchtiger Furcht zu entscheiden.
- source_word: σφόδρα
  choice: sehr
  rationale: „Sehr“ gibt die starke Intensivierung klar und idiomatisch wieder; stärker deutende Wörter wie „zutiefst“ würden den Ausdruck unnötig auslegen.
theological_decisions:
- issue: Art der Reaktion der Jünger auf die göttliche Stimme
  choice: Körperliches Niederfallen und intensive Furcht werden genannt, ohne die Reaktion als Anbetung, Schrecken oder Ehrfurcht festzulegen.
  alternative: Die Haltung könnte ausdrücklich als ehrfürchtige Anbetung oder als überwältigender Schrecken gedeutet werden.
  rationale: Der griechische Text beschreibt Haltung und Furcht, nimmt aber selbst keine weitergehende theologische Einordnung vor. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Angesicht“ ist bewusst leicht gehoben; es bewahrt die feste Wendung und die singularische Form des Ausgangstextes. Die Satzstellung folgt natürlichem Deutsch.
