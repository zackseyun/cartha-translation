id: MAT.17.26
reference: Matthew 17:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: de
  text: 'Als Petrus antwortete: »Von den Fremden[a]«, sagte Jesus zu ihm: »Dann sind die Söhne[b] frei[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von den anderen«. Gemeint sind diejenigen, die nicht zum eigenen Haus des Herrschers gehören, im Gegensatz zu seinen Söhnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Kinder«; im Griechischen steht ausdrücklich »die Söhne«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt im Zusammenhang: von der Abgabe befreit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Als Petrus antwortete
  rationale: Der Genitivus absolutus bezeichnet hier die Reaktion des Petrus auf Jesu vorausgehende Frage. Die ausdrückliche Nennung des Petrus verhindert im Deutschen, dass das Pronomen fälschlich auf Jesus bezogen wird; »antwortete« gibt die Gesprächssituation natürlicher wieder als das formal mögliche »sagte«.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Von den Fremden
  rationale: ἀλλότριοι bezeichnet hier die nicht zur königlichen Familie bzw. zum eigenen Haus Gehörenden und steht im Gegensatz zu den Söhnen. »Fremde« bewahrt diesen relationalen Gegensatz, ohne vorrangig eine andere Nationalität zu behaupten.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: sagte Jesus zu ihm
  rationale: Schlichte und quellennah formulierte Wiedergabe der narrativen Redeeinleitung.
- source_word: Ἄρα γε
  choice: Dann
  rationale: Die Partikelverbindung leitet die Folgerung aus der Antwort des Petrus ein. »Dann« ist im Deutschen knapp, natürlich und klar inferentiell.
- source_word: ἐλεύθεροί
  choice: frei
  rationale: »Frei« erhält die Grundbedeutung des Adjektivs und lässt zugleich die im Zusammenhang naheliegende Bedeutung »von der Abgabe befreit« erkennen, ohne sie in den Haupttext einzuschränken.
- source_word: οἱ υἱοί
  choice: die Söhne
  rationale: Die griechische Form bezeichnet ausdrücklich Söhne und trägt den familiären sowie rechtlichen Gegensatz zu den Außenstehenden. »Söhne« wahrt zudem die mögliche theologische Resonanz der Sohnschaft.
theological_decisions:
- issue: Reichweite der Aussage über οἱ υἱοί
  choice: die Söhne
  alternative: die Kinder
  rationale: Das Bild spricht konkret von den Söhnen eines Herrschers im Verhältnis zur Abgabenpflicht. Die quellengenaue maskuline Bezeichnung wird beibehalten, ohne die Aussage im Haupttext auf eine allgemeinere Gruppe auszuweiten.
- issue: Bedeutung von ἐλεύθεροί im Zusammenhang der Tempelabgabe
  choice: frei
  alternative: von der Abgabe befreit
  rationale: Der Zusammenhang legt Abgabenfreiheit nahe, doch das griechische Wort ist weiter gefasst. »Frei« bewahrt diese Spannung und vermeidet, die Aussage ausschließlich auf eine steuerrechtliche Ausnahme zu reduzieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die ausdrückliche Nennung des Petrus dient nur der eindeutigen deutschen Referenz; die Bildsprache von Fremden, Söhnen und Freiheit bleibt erhalten.
