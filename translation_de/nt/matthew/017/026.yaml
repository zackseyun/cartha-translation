  source_fidelity: Der Text gibt den Genitivus absolutus im gegebenen Gesprächskontext zutreffend wieder; die explizite Nennung des Petrus klärt den im Griechischen nur kontextuell erschließbaren Sprecher. »Von den Fremden« bewahrt den Gegensatz von ἀλλότριοι zu den Söhnen, und »Dann sind die Söhne frei« gibt die inferentielle Folgerung Ἄρα γε sowie ἐλεύθεροι und οἱ υἱοί angemessen wieder.
  naturalness: Die Formulierung ist modernes, gut lesbares Standarddeutsch und behält einen knappen erzählerischen Ton. »Als Petrus antwortete« ist gegenüber einer rein formalen Wiedergabe idiomatisch und im Kontext eindeutig.
