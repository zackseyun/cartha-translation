  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: de
  text: Und sie werden ihn töten, und am dritten Tag wird er auferweckt werden.[a] Und sie wurden tief traurig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er auferstehen“. Das griechische Verb steht im Passiv: „wird er auferweckt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν
  choice: sie werden töten
  rationale: Das Futur Aktiv wird direkt und natürlich wiedergegeben. „Töten“ fügt anders als „ermorden“ keine im Verb selbst nicht ausdrücklich enthaltene rechtlich-moralische Wertung hinzu.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen verweist auf den im vorherigen Vers genannten Menschensohn.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Der Dativ bezeichnet den Zeitpunkt; die geläufige deutsche Wendung bewahrt den griechischen Ausdruck ohne erklärenden Zusatz.
- source_word: ἐγερθήσεται
  choice: wird er auferweckt werden
  rationale: Das Futur Passiv von ἐγείρω wird formal bewahrt. „Auferweckt“ bezeichnet im Kontext eindeutig die Auferstehung und lässt die im Passiv angedeutete Handlung Gottes stehen.
- source_word: ἐλυπήθησαν σφόδρα
  choice: wurden sie tief traurig
  rationale: Die Verbindung gibt sowohl die Trauer von λυπέω als auch die starke Intensivierung durch σφόδρα in natürlichem modernem Deutsch wieder.
- source_word: καὶ ... καὶ ... καὶ
  choice: und ... und ... Da
  rationale: Die ersten beiden Konjunktionen bewahren die schlichte Reihung. Beim letzten καί macht „Da“ den anschließenden Reaktionssatz im Deutschen natürlich, ohne eine über den Kontext hinausgehende zeitliche Präzisierung einzuführen.
theological_decisions:
- issue: Passivische oder aktive Wiedergabe der Auferstehungsvoraussage
  choice: wird er auferweckt werden
  alternative: wird er auferstehen
  rationale: Die passivische Form des Griechischen bleibt erhalten und wahrt die mögliche theologische Nuance göttlichen Handelns, ohne die aktive Formulierung „auferstehen“ sachlich auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der schlichten griechischen Reihung; die emotionale Reaktion wird verständlich und ohne altertümliche Verstärkung formuliert.
