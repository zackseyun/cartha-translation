id: MAT.17.27
reference: Matthew 17:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: de
  text: Damit wir ihnen aber keinen Anstoß geben[a], geh an den See, wirf einen Angelhaken aus und nimm den ersten Fisch, der heraufkommt. Wenn du sein Maul öffnest, wirst du einen Stater[b] finden. Nimm ihn und gib ihn ihnen für mich und für dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit wir sie nicht zu Fall bringen; hier im Sinn von: ihnen keinen Anlass zum Anstoß geben.'
    reason: lexical_alternative
  - marker: b
    text: Ein Stater war eine Münze im Wert von ungefähr vier Drachmen und reichte damit für die Tempelsteuer zweier Personen.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: keinen Anstoß geben
  rationale: Die Wendung bezeichnet hier, den Tempelsteuereinnehmern keinen unnötigen Anlass zum Ärger oder Anstoß zu geben; sie vermeidet die im Deutschen mögliche moralische Engführung von „zu Fall bringen“.
- source_word: θάλασσαν
  choice: See
  rationale: Im Kontext ist der See Gennesaret gemeint. Modernes Deutsch bezeichnet dieses Binnengewässer natürlich als „See“, auch wenn das griechische θάλασσα wörtlich auch „Meer“ heißen kann.
- source_word: ἄγκιστρον
  choice: Angel
  rationale: „Eine Angel auswerfen“ ist im Deutschen die natürliche Wendung für das Fischen mit einem Haken und gibt den gemeinten Vorgang klar wieder.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: den ersten Fisch, der heraufkommt
  rationale: Die Formulierung bewahrt sowohl die Reihenfolge als auch die Bewegung des aus dem Wasser heraufkommenden Fisches.
- source_word: ἆρον
  choice: nimm
  rationale: In der Abfolge der Anweisungen bedeutet das Verb, den gefangenen Fisch an sich zu nehmen; „nimm“ ist knapp und natürlich.
- source_word: στατῆρα
  choice: einen Stater
  rationale: Die konkrete antike Münzbezeichnung wird bewahrt; ihr ungefährer Wert und ihre Bedeutung für die Zahlung werden in einer Fußnote erklärt.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: für mich und für dich
  rationale: ἀντί bezeichnet hier die Zahlung für beide Personen. Die deutsche Formulierung ist idiomatisch und lässt den Bezug auf die zuvor behandelte Steuer erkennen.
- source_word: πορευθεὶς
  choice: geh
  rationale: Das vorangestellte Partizip bezeichnet eine der folgenden Handlung vorausgehende Begleitaktion und wird im Deutschen natürlich als Imperativ wiedergegeben.
- source_word: δὸς αὐτοῖς
  choice: gib ihn ihnen
  rationale: Das maskuline Pronomen bezieht sich im Deutschen eindeutig auf den Stater; „geben“ entspricht dem griechischen Verb, während der Zahlungssinn aus dem Kontext hervorgeht.
theological_decisions:
- issue: Bedeutung von σκανδαλίζω im Zusammenhang mit der Tempelsteuer
  choice: Jesus lässt zahlen, damit die Einnehmer keinen Anstoß nehmen, ohne damit die zuvor ausgesprochene Freiheit der Söhne zurückzunehmen.
  alternative: Jesus erkennt eine uneingeschränkte Steuerpflicht an; oder die Zahlung dient ausschließlich als Wunderzeichen.
  rationale: Der einleitende Zwecksatz begründet die Zahlung mit der Vermeidung von Anstoß. Die Übersetzung bewahrt damit die Spannung zur Aussage in Matthäus 17,26, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer imperativischer Handlungsfolge. „See“ und „Angel auswerfen“ sind im Deutschen kontextgerecht und natürlich; die antike Münzbezeichnung bleibt erhalten und wird erläutert.
