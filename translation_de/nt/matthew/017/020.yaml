    rationale: Die Hauptfassung lautet bereits „Glauben habt wie ein Senfkorn“. Eine Fußnote sollte die griechische Vergleichsform bzw. die beabsichtigte Kleinheit erläutern, statt die Hauptfassung als wörtliches Zitat zu wiederholen.
