  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: de
  text: 'Er aber sagt zu ihnen: „Wegen eures Kleinglaubens.[a] Denn amen, ich sage euch: Wenn ihr Glauben habt wie ein Senfkorn,[b] werdet ihr zu diesem Berg sagen: ‚Rücke von hier dorthin!‘, und er wird dorthin rücken; und nichts wird euch unmöglich sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wegen eures zu geringen Glaubens.“ Das griechische Wort bezeichnet eher unzureichenden oder kleinen Glauben als völligen Unglauben.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „wenn ihr Glauben wie ein Senfkorn habt“. Der Vergleich verweist auf etwas sehr Kleines.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ὁ δὲ λέγει αὐτοῖς
  choice: Er aber sagt zu ihnen
  rationale: Das historische Präsens λέγει bleibt zur Wahrung des lebendigen Erzählstils im Präsens. δέ wird mit dem zurückhaltenden „aber“ wiedergegeben, das hier den Antwortanschluss markiert, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Wegen eures Kleinglaubens
  rationale: ὀλιγοπιστία bezeichnet zu kleinen oder unzureichenden Glauben, nicht eindeutig völligen Unglauben. „Kleinglaube“ bewahrt diese in Matthäus wiederkehrende Nuance.
- source_word: ἀμὴν
  choice: amen
  rationale: Das einleitende ἀμήν wird als feierliche Bekräftigungsformel Jesu transliteriert. „Amen, ich sage euch“ ist verständlich und bewahrt die markante Ausgangsform.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Zusammenhang bezeichnet πίστις vertrauenden Glauben an Gottes Macht; „Glauben“ lässt diese Bedeutung stehen, ohne sie konfessionell einzuengen.
- source_word: ὡς κόκκον σινάπεως
  choice: wie ein Senfkorn
  rationale: Die natürliche deutsche Vergleichsform bewahrt das Bild eines sehr kleinen Samenkorns.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Rücke von hier dorthin!
  rationale: Die Aufforderung zur Ortsveränderung wird bei der Anrede an einen Berg idiomatisch mit „rücke“ ausgedrückt.
- source_word: μεταβήσεται
  choice: er wird hinüberrücken
  rationale: 'Das Verb ist hier intransitiv: Der Berg wechselt den Ort. „Hinüberrücken“ nimmt die Richtung des vorausgehenden Befehls auf.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: nichts wird euch unmöglich sein
  rationale: Diese natürliche deutsche Wendung gibt das griechische Beziehungsverhältnis mit dem Dativ ὑμῖν präzise wieder.
theological_decisions:
- issue: Bedeutung von πίστις im Zusammenhang eines Wunders
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Kontext betrifft den unzureichenden vertrauenden Glauben der Jünger. „Glauben“ bewahrt den theologischen Begriff, ohne daraus eine Aussage über rettenden Glauben oder über Treue zu machen.
- issue: Reichweite der Verheißung „nichts wird euch unmöglich sein“
  choice: Die uneingeschränkte Formulierung des Verses bleibt erhalten
  alternative: Eine ausdrückliche Einschränkung auf Gottes Willen oder den Wunderauftrag
  rationale: Der griechische Text formuliert zugespitzt und ohne ausdrückliche Einschränkung. Eine systematisch-theologische Begrenzung soll nicht in die Übersetzung eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die feierliche Amen-Formel bleiben erhalten. „Kleinglaube“ ist ein geläufiger biblischer Ausdruck und bildet die besondere Wortwahl des griechischen Textes knapper und genauer ab als „Unglaube“.
