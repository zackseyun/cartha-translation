  naturalness: Der Text ist überwiegend gutes, würdiges modernes Standarddeutsch. „Rücke von hier dorthin!“ ist natürlich. Die Anschlussformulierung „und er wird hinüberrücken“ wirkt dagegen etwas unnötig gehoben und ist weniger präzise als eine Formulierung mit „dorthin“.
  terminology: „Kleinglaube“, „Glauben“, „Senfkorn“ und „Amen“ sind sachgerecht. Die Fußnote zu b bezeichnet die Hauptübersetzung allerdings als „wörtlich“, obwohl sie diese lediglich wiederholt; sie sollte stattdessen die im Griechischen vorhandene Vergleichsform und die Kleinheit des Senfkorns erläutern.
