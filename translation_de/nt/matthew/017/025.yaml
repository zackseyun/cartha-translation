id: MAT.17.25
reference: Matthew 17:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: de
  text: 'Er sagte: »Ja.« Als er ins Haus kam, kam Jesus ihm zuvor und fragte: »Was meinst du, Simon? Von wem erheben die Könige der Erde Zölle oder Kopfsteuer[a]: von ihren eigenen Söhnen oder von den anderen[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abgaben oder Tributsteuer«. Das Griechische unterscheidet τέλη (Abgaben, Zölle) von κῆνσος (Kopf- oder Tributsteuer).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von den Fremden«. Das griechische Wort bezeichnet diejenigen, die nicht zur eigenen Familie gehören, also Außenstehende.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Ja
  rationale: Die schlichte bejahende Antwort wird im modernen Deutschen am natürlichsten mit »Ja« wiedergegeben.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Als er ins Haus kam
  rationale: Das Akkusativpartizip bezieht sich auf Petrus als das mitgedachte Objekt von προέφθασεν; ein temporaler Nebensatz gibt die Konstruktion klar und idiomatisch wieder.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: kam Jesus ihm zuvor und fragte
  rationale: προφθάνω bezeichnet hier, dass Jesus die Initiative ergriff, bevor Petrus sprechen konnte. »Kam ihm zuvor« bewahrt das Bild des griechischen Ausdrucks; wegen der unmittelbar folgenden Frage ist »fragte« im Deutschen natürlicher als ein zusätzliches »sagte«.
- source_word: Τί σοι δοκεῖ
  choice: Was meinst du
  rationale: Die geläufige deutsche Wendung fordert Simons Einschätzung und entspricht dem idiomatischen Sinn des griechischen Ausdrucks.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: Die Formulierung folgt dem griechischen Ausdruck, ohne γῆ unnötig auf ein bestimmtes Land einzugrenzen.
- source_word: τέλη
  choice: Zölle
  rationale: τέλη bezeichnet Abgaben, besonders indirekte Abgaben oder Zölle. »Zölle« unterscheidet diese klar von der folgenden Kopfsteuer.
- source_word: κῆνσον
  choice: Kopfsteuer
  rationale: κῆνσος bezeichnet eine von Einzelpersonen erhobene Tribut- beziehungsweise Kopfsteuer; »Kopfsteuer« wahrt den Unterschied zu τέλη.
- source_word: υἱῶν αὐτῶν
  choice: ihren eigenen Söhnen
  rationale: υἱοί bedeutet ausdrücklich »Söhne«. »Eigenen« verdeutlicht den im Griechischen angelegten Gegensatz zu den Außenstehenden.
- source_word: ἀλλοτρίων
  choice: den anderen
  rationale: Das Wort bezeichnet hier diejenigen, die nicht zur eigenen Familie gehören. »Die anderen« ist natürlich und knapp; die genauere Bedeutung wird in der Fußnote genannt.
theological_decisions:
- issue: Mögliche theologische Folgerung aus den »Söhnen« im Vergleich Jesu
  choice: Die konkrete Familienbezeichnung »ihren eigenen Söhnen« bleibt im Haupttext erhalten, ohne ihre christologische Bedeutung an dieser Stelle auszudeuten.
  alternative: »ihren Kindern« oder »ihren Untertanen«
  rationale: Unmittelbar geht es darum, dass die eigene Familie eines Königs nicht wie Außenstehende besteuert wird. Die Bezeichnung »Söhne« bereitet zugleich die theologische Aussage des folgenden Verses vor und bewahrt diese Spannung, ohne sie vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist idiomatisch formuliert; »kam ihm zuvor« erhält zugleich das anschauliche Moment des griechischen Verbs. Die beiden Steuerbegriffe bleiben voneinander unterschieden, und die familiäre Gegenüberstellung wird nicht theologisch geglättet.
