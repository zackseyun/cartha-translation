review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt die syntaktische Beziehung des Akkusativpartizips zutreffend wieder: Petrus kommt ins Haus, und Jesus kommt ihm mit einer Frage zuvor. »Zölle oder Kopfsteuer« bewahrt die im Griechischen vorhandene Unterscheidung von τέλη und κῆνσος. »Ihre eigenen Söhne« und »die anderen« geben den familiären Gegensatz von υἱῶν αὐτῶν und ἀλλοτρίων angemessen wieder.'
  naturalness: Modernes, idiomatisches Standarddeutsch. »Kam Jesus ihm zuvor« ist eine natürliche und zugleich präzise Wiedergabe des hier initiativen Sinns von προέφθασεν. Die Frage ist klar und hat einen passenden erzählerisch-würdigen Registerton.
  terminology: Die Steuerterminologie ist sinnvoll differenziert. »Kopfsteuer« trifft κῆνσος genauer als ein bloßes »Tribut«; die Fußnote nennt die möglichen weiteren Nuancen. Die Fußnotenanker stehen im deutschen Text an den jeweiligen Begriffen. Die englische Auditvorlage hat offenbar vertauschte Anker, doch der deutsche Entwurf übernimmt diesen strukturellen Fehler nicht.
