id: MAT.17.16
reference: Matthew 17:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: de
  text: Und ich brachte ihn zu deinen Jüngern, und sie konnten ihn nicht heilen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: brachte
  rationale: Der Aorist von προσφέρω bezeichnet hier, dass der Vater seinen Sohn zu den Jüngern brachte; „brachte“ ist natürlich und gibt die Konstruktion mit direktem Objekt und Dativ treffend wieder.
- source_word: μαθηταῖς σου
  choice: deinen Jüngern
  rationale: μαθητής bezeichnet im Evangelienkontext die Schüler und engeren Anhänger eines Lehrers; „Jünger“ ist dafür die klare, etablierte deutsche Wiedergabe.
- source_word: οὐκ ἠδυνήθησαν
  choice: sie konnten nicht
  rationale: δύναμαι drückt Fähigkeit oder Vermögen aus. „Sie konnten nicht“ ist im modernen Deutsch unmittelbar und bedeutungstreu.
- source_word: θεραπεῦσαι
  choice: heilen
  rationale: θεραπεύω bezeichnet hier die Heilung des leidenden Jungen; „heilen“ ist im Kontext der Heilungsberichte die natürliche Wiedergabe.
- source_word: καὶ ... καὶ
  choice: Und ... doch
  rationale: Das erste καί setzt den Bericht fort. Das zweite verbindet die erfolglose Reaktion der Jünger; „doch“ macht den im Zusammenhang deutlich vorhandenen Gegensatz im Deutschen natürlich kenntlich, ohne eine Ursache hinzuzufügen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist auf den zuvor genannten Sohn beziehungsweise Jungen und wird direkt mit „ihn“ wiedergegeben.
theological_decisions:
- issue: Art des Versagens der Jünger
  choice: Die Aussage wird allein als Unfähigkeit zu heilen wiedergegeben.
  alternative: Das Versagen ausdrücklich als misslungene Dämonenaustreibung oder als Folge mangelnden Glaubens erklären.
  rationale: Der Vers selbst sagt nur, dass die Jünger ihn nicht heilen konnten. Nähere Erklärungen aus dem Kontext werden nicht in diesen Satz hineingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Keine Fußnote nötig, da „sie konnten ihn nicht heilen“ die griechische Aussage direkt und natürlich wiedergibt.
