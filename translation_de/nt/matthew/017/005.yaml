  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: de
  text: 'Während er noch redete, siehe: Eine leuchtende Wolke überschattete sie[a], und siehe, eine Stimme aus der Wolke sprach: „Dieser ist mein geliebter Sohn, an dem ich Gefallen gefunden habe. Hört auf ihn!“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Überschattete“ kann an biblische Sprache für Gottes Gegenwart anknüpfen.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich auch: „Hört ihn!“ Der griechische Imperativ kann ein Hören meinen, das zugleich auf ihn achtet und ihm folgt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Während er noch redete
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitige Handlung; „noch“ bewahrt den Eindruck, dass die Rede unterbrochen wird.
- source_word: ἰδοὺ
  choice: siehe, da / und siehe
  rationale: Die zweimalige Aufmerksamkeitsformel bleibt erhalten. Beim ersten Vorkommen ergibt „siehe, da“ einen natürlichen deutschen Erzählfluss, beim zweiten „und siehe“ die erneute dramatische Hervorhebung.
- source_word: νεφέλη φωτεινὴ
  choice: eine leuchtende Wolke
  rationale: „Leuchtend“ gibt φωτεινή unmittelbar wieder und bewahrt das auffällige Bild, ohne seine Bedeutung auszudeuten.
- source_word: ἐπεσκίασεν
  choice: überschattete
  rationale: Die formnahe Wiedergabe bewahrt sowohl das räumliche Bild als auch einen möglichen Anklang an biblische Erscheinungen der Gegenwart Gottes.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: eine Stimme aus der Wolke sprach
  rationale: Die finite deutsche Form ist idiomatisch und gibt Herkunft sowie Inhalt der Stimme klar wieder.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mein geliebter Sohn
  rationale: Die Wendung bewahrt sowohl die Sohnschaft als auch die Bezeichnung ἀγαπητός in natürlichem, würdigem Deutsch.
- source_word: ἐν ᾧ εὐδόκησα
  choice: an dem ich Wohlgefallen habe
  rationale: Diese etablierte, aber verständliche Formulierung erhält den relationalen und feierlichen Charakter der göttlichen Erklärung, ohne den Aorist spekulativ zeitlich festzulegen.
- source_word: ἀκούετε αὐτοῦ
  choice: Hört auf ihn!
  rationale: „Auf jemanden hören“ bezeichnet im Deutschen nicht nur akustisches Hören, sondern aufmerksames und folgebereites Beachten; dies entspricht der Kraft des Imperativs, ohne ausdrücklich „gehorchen“ einzutragen.
theological_decisions:
- issue: Die göttliche Erklärung über Jesu Identität
  choice: Dieser ist mein geliebter Sohn, an dem ich Wohlgefallen habe.
  alternative: Dieser ist mein Sohn, der Geliebte, an dem ich Gefallen gefunden habe.
  rationale: Die Übersetzung lässt die unmittelbare Identifikation Jesu als Sohn und die Sprache von Liebe beziehungsweise Erwählung stehen, ohne spätere dogmatische Fachbegriffe einzuführen.
- issue: Die Kraft von ἀκούετε αὐτοῦ
  choice: Hört auf ihn!
  alternative: Hört ihn!
  rationale: Der Imperativ fordert wahrscheinlich ein Hören im Sinn des Beachtens. Die gewählte deutsche Wendung bewahrt diese Spannung zwischen Hören und Befolgen, ohne zu „Gehorcht ihm“ zu verdeutlichen.
- issue: Mögliche Theophanie-Sprache bei ἐπεσκίασεν
  choice: überschattete
  alternative: bedeckte
  rationale: „Überschattete“ lässt einen möglichen biblischen Anklang an Gottes offenbarte Gegenwart hörbar, macht ihn jedoch nicht zum ausdrücklich behaupteten Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das zweimalige ἰδού wird bewusst sichtbar erhalten; „siehe“ ist hier leicht gehoben, dient aber der dramatischen Aufmerksamkeitslenkung. Die Zeichensetzung setzt Fußnote [a] unmittelbar nach der einschlägigen Wendung und [b] nach dem Imperativ.
