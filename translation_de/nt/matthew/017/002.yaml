  source_fidelity: Die Übersetzung trifft μετεμορφώθη, ἔλαμψεν, die beiden Vergleiche und den Zustandswechsel der Kleider insgesamt gut. „Vor ihren Augen“ ist idiomatisch, fügt gegenüber ἔμπροσθεν αὐτῶν jedoch die ausdrücklich visuelle Nuance „Augen“ hinzu; „vor ihnen“ ist genauer. Der Doppelpunkt gestaltet die folgenden δύο καί-Sätze als erläuternde Folge und ist deshalb weniger quellentreu als eine einfache Satzverbindung.
  naturalness: „Und er wurde vor ihnen verwandelt, und sein Gesicht leuchtete wie die Sonne, und seine Kleider wurden weiß wie das Licht“ ist verständliches, modernes Standarddeutsch und bewahrt den feierlich-erzählenden Registerton. Die wiederholte Verbindung mit „und“ bildet die griechische Reihung angemessen nach.
  terminology: „wurde verwandelt“ ist eine sachlich treffende, nicht konfessionell festgelegte Wiedergabe von μετεμορφώθη. Die Fußnote mit „wurde verklärt“ dokumentiert die etablierte traditionssprachliche Alternative, ohne sie dem Haupttext aufzuzwingen. „Kleider“, „Gesicht“ und „Licht“ sind passend und präzise.
