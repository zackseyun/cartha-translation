  - severity: low
    issue: Doppelpunkt nach „verwandelt“
    rationale: Der griechische Text reiht die Aussagen mit καί aneinander. Ein Doppelpunkt kann die anschließenden Beobachtungen als Erklärung oder Folge der Verwandlung profilieren; Kommata bewahren die Parataxe besser.
