id: MAT.17.2
reference: Matthew 17:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: de
  text: Und er wurde vor ihnen verwandelt[a], und sein Gesicht leuchtete wie die Sonne, und seine Kleider wurden weiß wie das Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wurde verklärt.'
    reason: Lexikalische und traditionssprachliche Alternative für μετεμορφώθη.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: wurde verwandelt
  rationale: Der passive Aorist bezeichnet eine an Jesus geschehende, sichtbar werdende Verwandlung. „Wurde verwandelt“ ist im modernen Deutsch klar und wahrt die Passivform, ohne über den Text hinaus zu erklären.
- source_word: ἔμπροσθεν αὐτῶν
  choice: vor ihren Augen
  rationale: Die Wendung gibt idiomatisch wieder, dass die Verwandlung in ihrer unmittelbaren Gegenwart und sichtbar für sie geschah.
- source_word: ἔλαμψεν
  choice: leuchtete
  rationale: λάμπω bezeichnet das Ausstrahlen von Licht; „leuchtete“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: sein Gesicht
  rationale: πρόσωπον meint hier konkret das Gesicht Jesu; die Wiedergabe ist schlicht und gegenwärtig.
- source_word: ὡς ὁ ἥλιος
  choice: wie die Sonne
  rationale: ὡς führt einen Vergleich ein, der im Deutschen natürlich mit „wie“ wiedergegeben wird.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: seine Kleider
  rationale: ἱμάτια bezeichnet allgemein Kleidungsstücke; „Kleider“ ist würdig und im biblischen Erzählstil natürlich.
- source_word: ἐγένετο λευκὰ
  choice: wurden weiß
  rationale: Die Formulierung bezeichnet einen Zustandswechsel. Der Singular des griechischen Verbs bei einem neutralen Pluralsubjekt wird im Deutschen regulär als Plural wiedergegeben.
- source_word: ὡς τὸ φῶς
  choice: wie das Licht
  rationale: Die Wiedergabe bewahrt sowohl den ausdrücklichen Vergleich als auch den Artikel bei φῶς, ohne die Aussage zu „hell“ abzuflachen.
theological_decisions:
- issue: Bezeichnung des Verwandlungsgeschehens
  choice: wurde verwandelt
  alternative: wurde verklärt
  rationale: „Verwandelt“ bildet μεταμορφόω semantisch unmittelbar und verständlich ab. Das kirchlich vertraute „verklärt“ benennt das Ereignis traditionsgemäß, kann im heutigen Deutsch jedoch zusätzliche Bedeutungen wie Idealisierung oder Beschönigung wecken. Die Fußnote erhält diese etablierte Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert die sichtbaren Folgen der Verwandlung, ohne eine im Griechischen nicht ausdrücklich markierte Kausalität hinzuzufügen.
