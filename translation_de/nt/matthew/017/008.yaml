  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: de
  text: Als sie aber ihre Augen erhoben, sahen sie niemanden außer Jesus allein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάραντες
  choice: als sie ... erhoben
  rationale: Das aoristische Partizip bezeichnet die der Haupthandlung vorausgehende Handlung; ein temporaler Nebensatz gibt die Abfolge im Deutschen natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein leichter erzählerischer Übergang. „Aber“ markiert zugleich den Kontrast zwischen der vorherigen Erscheinung und dem nun Sichtbaren, ohne einen starken Gegensatz zu behaupten.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ihre Augen
  rationale: Die konkrete körperliche Ausdrucksweise des Griechischen bleibt erhalten.
- source_word: οὐδένα εἶδον
  choice: sahen sie niemanden
  rationale: Die schlichte Wahrnehmungsaussage und das negative Objekt werden idiomatisch und eng am Griechischen wiedergegeben.
- source_word: εἰ μὴ
  choice: außer
  rationale: Nach der Verneinung bezeichnet εἰ μή eine Ausnahme.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: Jesus allein
  rationale: Im Deutschen bringt die Endstellung von „allein“ die starke Ausschließlichkeit natürlich zum Ausdruck. Eine zusätzliche Wiedergabe von αὐτόν als „ihn selbst“ wäre hier missverständlich, da sie eher persönliche Eigenhändigkeit als Identifikation beziehungsweise Hervorhebung signalisieren könnte.
theological_decisions:
- issue: Jesus ist nach der Erscheinung als Einziger zu sehen
  choice: „niemanden außer Jesus allein“ bewahrt die ausdrückliche Ausschließlichkeit
  alternative: „niemanden außer Jesus“ oder „niemanden außer ihm, Jesus allein“
  rationale: εἰ μή und μόνον unterstreichen gemeinsam, dass Mose und Elija nicht mehr zu sehen sind. Die Übersetzung hält diese Betonung fest, ohne daraus eine über die Szene hinausgehende Lehrfolgerung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „die Augen erheben“ erhält das konkrete Bild des Ausgangstextes; der Satzbau bleibt gut verständlich und erzählerisch flüssig.
