source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: de
  text: 'und sagte: „Herr, hab Erbarmen mit meinem Sohn! Er hat Anfälle[a] und leidet schwer; denn oft fällt er ins Feuer und oft ins Wasser.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ist mondsüchtig“. Der griechische Ausdruck bezeichnet nach antiker Redeweise ein anfallsartiges Leiden.
    reason: Die Fußnote bewahrt das konkrete Bild des griechischen Ausdrucks und erklärt zugleich, warum im Haupttext keine moderne Diagnose verwendet wird.
lexical_decisions:
- source_word: καὶ λέγων
  choice: und sagte
  rationale: Das griechische Präsenspartizip knüpft an die vorausgehende Handlung an. Im natürlichen deutschen Erzählstil wird diese Verbindung am klarsten mit einem finiten Verb wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: Die Vokativform ist eine ehrerbietige Anrede an Jesus; „Herr“ bewahrt sowohl den üblichen Sprachgebrauch als auch die mögliche tiefere Bedeutung, ohne sie eigens festzulegen.
- source_word: ἐλέησόν
  choice: hab Erbarmen mit
  rationale: Der Aoristimperativ formuliert eine eindringliche Bitte um barmherzige Hilfe. „Hab Erbarmen mit“ ist würdevoll und im modernen Deutsch verständlich.
- source_word: μου τὸν υἱόν
  choice: meinem Sohn
  rationale: υἱός bezeichnet hier ausdrücklich den Sohn; der deutsche Dativ wird von „Erbarmen mit“ verlangt.
- source_word: σεληνιάζεται
  choice: hat Anfälle
  rationale: Der Ausdruck ist wörtlich mit dem Mond verbunden, bezeichnet im antiken Sprachgebrauch jedoch ein anfallsartiges Leiden. „Hat Anfälle“ beschreibt das berichtete Erscheinungsbild, ohne eine moderne medizinische Diagnose oder einen Mondeinfluss zu behaupten.
- source_word: κακῶς πάσχει
  choice: leidet schwer
  rationale: κακῶς verstärkt πάσχει. „Leidet schwer“ gibt die Intensität knapp, natürlich und würdevoll wieder.
- source_word: πολλάκις
  choice: oft
  rationale: Die wiederholte Häufigkeit wird mit dem geläufigen deutschen Adverb präzise und knapp ausgedrückt.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: fällt er ins Feuer
  rationale: Die Wendung gibt Bewegung in das Feuer wieder; „ins Feuer“ ist die natürliche deutsche Entsprechung.
- source_word: εἰς τὸ ὕδωρ
  choice: ins Wasser
  rationale: Die parallele Formulierung zu „ins Feuer“ bewahrt Struktur und Anschaulichkeit des griechischen Satzes.
theological_decisions:
- issue: Deutung von σεληνιάζεται im Zusammenhang von Heilung und Dämonenaustreibung
  choice: Phänomenologisch mit „hat Anfälle“ wiedergeben
  alternative: „ist epileptisch“ oder wörtlich „ist mondsüchtig“
  rationale: Die Aussage gibt zunächst die Beschreibung des Vaters wieder. Eine moderne Diagnose wäre präziser, als der griechische Ausdruck erlaubt; eine unkommentierte wörtliche Wiedergabe könnte dagegen eine Verursachung durch den Mond nahelegen. Die Übersetzung lässt die weitere narrative und theologische Einordnung des Leidens offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller direkter Rede. Der Ausruf nach „Sohn“ bildet die Eindringlichkeit der Bitte natürlich ab; das anschließende „denn“ erhält die begründende Funktion von γάρ.
