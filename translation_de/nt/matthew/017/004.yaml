  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: de
  text: 'Da antwortete Petrus Jesus: „Herr, es ist gut, dass wir hier sind. Wenn du willst, werde ich hier drei Hütten[a] errichten: eine für dich, eine für Mose und eine für Elija.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Zelte“ oder „Laubhütten“; das griechische Wort bezeichnet vorübergehende Behausungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: Da ergriff … das Wort und sagte
  rationale: Die griechische Antwortformel leitet hier den Redebeitrag des Petrus ein, ohne dass unmittelbar zuvor eine Frage gestellt wurde. Die deutsche Wendung gibt ihre Diskursfunktion natürlich wieder und berücksichtigt zugleich δέ als Fortgang der Erzählung.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt sowohl die respektvolle Anrede als auch das mögliche theologische Gewicht des Titels κύριος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: es ist gut, dass wir hier sind
  rationale: Diese Formulierung gibt die griechische Infinitivkonstruktion in natürlichem modernem Deutsch wieder, ohne ihren Sinn zu erweitern.
- source_word: εἰ θέλεις
  choice: Wenn du willst
  rationale: Die geläufige deutsche Wendung deckt den Bedeutungsbereich von θέλω als Wollen oder Wünschen ab und passt zur direkten Anrede.
- source_word: ποιήσω
  choice: werde ich … errichten
  rationale: „Errichten“ bezeichnet idiomatisch das Aufstellen oder Herstellen temporärer Bauten und entspricht hier dem offenen ποιέω besser als das auf dauerhafte Bauwerke festgelegte „bauen“.
- source_word: σκηνάς
  choice: Hütten
  rationale: „Hütten“ ist verständlich und lässt wie σκηναί verschiedene Arten einfacher oder vorübergehender Behausungen zu. Die möglichen Übersetzungen „Zelte“ und „Laubhütten“ werden in der Fußnote bewahrt.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: eine für dich, eine für Mose und eine für Elija
  rationale: Die dreimalige Zuordnung von μίαν wird durch die Wiederholung von „eine“ erhalten.
- source_word: ὧδε
  choice: hier
  rationale: Beide Vorkommen von ὧδε werden als „hier“ wiedergegeben, sodass die Wiederholung des griechischen Textes erhalten bleibt.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: „Herr“ wahrt den Bedeutungsumfang der respektvollen Anrede und lässt ihr mögliches christologisches Gewicht bestehen, während „Meister“ sie stärker auf eine Lehrerrolle festlegen würde.
- issue: Wiedergabe von σκηνάς im Zusammenhang der Verklärung
  choice: Hütten
  alternative: Zelte oder Laubhütten
  rationale: Der Vers selbst bezeichnet keinen ausdrücklichen Zusammenhang mit dem Laubhüttenfest. Daher nennt der Haupttext einfache „Hütten“, während die Fußnote sowohl die gewöhnliche Zeltbedeutung als auch die möglicherweise bedeutsame Wiedergabe „Laubhütten“ offenhält.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Redeformel wurde idiomatisch wiedergegeben; Wiederholungen und mögliche theologische Mehrdeutigkeiten bleiben erhalten.
