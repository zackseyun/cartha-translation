id: MAT.17.18
reference: Matthew 17:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: de
  text: Und Jesus wies ihn scharf zurecht[a], und der Dämon fuhr aus ihm aus. Von diesem Augenblick an war der Junge geheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Pronomen kann sich grammatisch auf den Jungen oder den Dämon beziehen; der folgende Satz legt den Dämon nahe.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: wies … scharf zurecht
  rationale: Gibt die nachdrückliche, autoritative Zurechtweisung von ἐπιτιμάω wieder und klingt im modernen Deutschen natürlich.
- source_word: αὐτῷ
  choice: ihn
  rationale: Das Pronomen bleibt entsprechend dem Griechischen pronominal; im unmittelbaren Zusammenhang ist der Dämon der wahrscheinlichste Bezug, doch die grammatische Mehrdeutigkeit wird nicht im Haupttext beseitigt.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: Direkte und allgemein verständliche Wiedergabe; »unreiner Geist« stünde hier nicht im Ausgangstext.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: fuhr aus ihm aus
  rationale: Bewahrt das anschauliche Motiv des Herauskommens und entspricht dem etablierten deutschen Sprachgebrauch bei einer Dämonenaustreibung.
- source_word: ἐθεραπεύθη
  choice: war … geheilt
  rationale: Das Passiv bezeichnet die eingetretene Heilung; die resultative Formulierung passt natürlich zur anschließenden Zeitangabe.
- source_word: ὁ παῖς
  choice: der Junge
  rationale: Im Kontext handelt es sich um den Sohn des Vaters; »Junge« ist deshalb genauer als das weitere »Kind«, während »Diener« hier unpassend wäre.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: von diesem Augenblick an
  rationale: Die Wendung bezeichnet den Beginn eines fortdauernden Zustands. Idiomatisches Deutsch gibt ὥρα hier treffend als »Augenblick« wieder, nicht zwingend als eine volle Stunde.
theological_decisions:
- issue: Bezugswort von αὐτῷ bei Jesu Zurechtweisung
  choice: Im Kontext bezieht sich »ihn« wahrscheinlich auf den Dämon.
  alternative: Jesus wies den Jungen zurecht.
  rationale: Der unmittelbar folgende Satz, dass der Dämon aus dem Jungen ausfuhr, spricht deutlich für den Dämon als Adressaten. Da die griechische Pronomenform selbst den Bezug nicht ausdrücklich benennt, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Griechischen; ein Punkt statt des zweiten griechischen καί verbessert die deutsche Lesbarkeit. »Von diesem Augenblick an« ist natürlicher als das missverständliche »von jener Stunde an«.
