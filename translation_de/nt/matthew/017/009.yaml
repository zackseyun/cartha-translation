id: MAT.17.9
reference: Matthew 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: de
  text: 'Als sie vom Berg hinabstiegen, befahl Jesus ihnen: »Berichtet niemandem von der Vision[a], bis der Menschensohn von den Toten[b] auferweckt ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von dem, was ihr gesehen habt«. Das griechische Wort bedeutet »Vision« oder »Erscheinung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »aus den Toten«, das heißt aus der Gemeinschaft der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Als sie vom Berg hinabstiegen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. Die Formulierung ist im Deutschen natürlich und gibt sowohl das Hinabsteigen als auch den Ausgangspunkt vom Berg wieder.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: befahl Jesus ihnen
  rationale: ἐνετείλατο bezeichnet einen verbindlichen Auftrag. Der griechische Redeeinleiter λέγων muss im Deutschen nicht zusätzlich mit „und sagte“ wiederholt werden, da der Doppelpunkt seine Funktion idiomatisch übernimmt.
- source_word: Μηδενὶ εἴπητε
  choice: Berichtet niemandem
  rationale: Die Verneinung mit μηδενί untersagt, irgendeiner Person davon zu erzählen. „Berichtet niemandem“ nimmt das folgende Objekt natürlich auf und bewahrt den verbindlichen Ton.
- source_word: τὸ ὅραμα
  choice: die Vision
  rationale: „Vision“ gibt ὅραμα direkt wieder und bewahrt dessen möglichen Offenbarungscharakter, ohne den Ausdruck auf eine bloß äußerliche Beobachtung zu reduzieren.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die Wendung bezeichnet die zeitliche Grenze des Verbots und wird idiomatisch mit „bis“ wiedergegeben.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die feste Wiedergabe bewahrt Jesu Selbstbezeichnung und ihre biblisch-theologische Resonanz.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die geläufige und klare deutsche Wiedergabe der Auferstehungsformel; die stärker formale Alternative wird in einer Fußnote genannt.
- source_word: ἐγερθῇ
  choice: auferweckt ist
  rationale: Die passive Form des griechischen Verbs bleibt erhalten. Der Konjunktiv wird nach dem deutschen „bis“ idiomatisch nicht eigens markiert.
theological_decisions:
- issue: Formulierung und Diathese der Auferstehung
  choice: von den Toten auferweckt ist
  alternative: von den Toten aufersteht
  rationale: Das griechische ἐγερθῇ ist passiv. „Auferweckt ist“ bewahrt diese Form und lässt die im Passiv anklingende göttliche Wirksamkeit stehen, ohne den Handelnden ausdrücklich zu benennen.
- issue: Charakter des geschauten Geschehens
  choice: Vision
  alternative: das, was ihr gesehen habt
  rationale: Die direkte Wiedergabe von ὅραμα bewahrt den möglichen Offenbarungscharakter und legt nicht weiter fest, wie das Geschehen wahrgenommen wurde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau ist gestrafft, ohne Aussagebestandteile auszulassen; die passive Auferstehungsformulierung und die Offenheit von ὅραμα bleiben erhalten.
