  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: de
  text: 'Er antwortete: »Elia kommt tatsächlich und wird alles wiederherstellen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Elia kommt zwar und wird alles wiederherstellen.« Das griechische μέν kann einen Gegensatz vorbereiten, der im folgenden Vers entfaltet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine semitisch geprägte griechische Ausdrucksweise. Im natürlichen Deutschen gibt »Er antwortete« den erwidernden Sinn ohne unnötige Doppelung wieder.
- source_word: Ἠλίας
  choice: Elia
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: μέν
  choice: tatsächlich
  rationale: μέν hebt die Aussage hervor und bereitet zugleich den Gegensatz im folgenden Vers vor. »Tatsächlich« bewahrt diese bestätigende, vorausweisende Funktion in natürlichem Deutsch.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens hat im Kontext Zukunftsbezug. Das deutsche Präsens »kommt« kann ebenso eine erwartete zukünftige Handlung ausdrücken und bewahrt dabei die Formnähe.
- source_word: ἀποκαταστήσει
  choice: wird wiederherstellen
  rationale: Das Futur bezeichnet eine künftige Wiederherstellung. »Wird wiederherstellen« gibt den Begriff direkt wieder, ohne die Art der Wiederherstellung näher festzulegen.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural ist umfassend, ohne die betroffenen Dinge oder Personen näher zu bestimmen. »Alles« bewahrt diese offene Reichweite idiomatisch.
theological_decisions:
- issue: Art und Umfang von Elias Wiederherstellungswerk
  choice: »wird alles wiederherstellen«
  alternative: »wird alles in Ordnung bringen« oder eine Eingrenzung auf geistliche, gesellschaftliche beziehungsweise endzeitliche Erneuerung
  rationale: Der griechische Text formuliert umfassend, bestimmt den genauen Umfang der Wiederherstellung in diesem Vers aber nicht. Die offene Formulierung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das schlichte Präsens »kommt« bewahrt sowohl die griechische Verbform als auch ihren zukunftsbezogenen Sinn. Die Satzstellung bleibt klar und mündlich gut verständlich.
