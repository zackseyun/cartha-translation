source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: de
  text: 'Da traten die Jünger mit Jesus beiseite und fragten: »Warum konnten wir ihn[a] nicht austreiben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der Dämon; das Pronomen kann sich jedoch auch auf den Jungen beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet in natürlichem erzählendem Deutsch den nächsten Vorgang in der zeitlichen Abfolge ein.
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: kamen die Jünger zu Jesus
  rationale: Das vorangestellte Aoristpartizip wird idiomatisch als finites Verb wiedergegeben; »zu Jesus kommen« entspricht der Konstruktion mit dem Dativ und klingt natürlich.
- source_word: κατ’ ἰδίαν
  choice: als sie unter sich waren
  rationale: Gibt die private, von anderen abgesonderte Situation verständlich wieder, ohne zwingend zu behaupten, dass Jesus nicht mitgemeint war.
- source_word: εἶπον
  choice: sagten
  rationale: Entspricht dem allgemeinen Verb λέγω; der folgende Fragesatz macht die Sprechhandlung als Frage erkennbar.
- source_word: Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν
  choice: Warum konnten wir nicht
  rationale: Natürliche deutsche Wiedergabe der Frage nach dem Grund ihres Unvermögens. Das ausdrücklich gesetzte ἡμεῖς bleibt durch »wir« präsent, ohne künstliche Verstärkung.
- source_word: ἐκβαλεῖν
  choice: austreiben
  rationale: Im Evangelienkontext die übliche und präzise Bezeichnung für das Vertreiben eines Dämons.
- source_word: αὐτό
  choice: ihn
  rationale: Das griechische Neutrum bezieht sich wahrscheinlich auf δαιμόνιον, doch im Deutschen ist »Dämon« maskulin und verlangt »ihn«. Zugleich kann das deutsche Pronomen auch auf den Jungen bezogen werden und bewahrt damit die im Zusammenhang mögliche Mehrdeutigkeit.
theological_decisions:
- issue: Bezugswort von αὐτό im Zusammenhang der Dämonenaustreibung
  choice: »ihn« im Haupttext, mit Hinweis auf den Dämon als wahrscheinlich gemeintes Bezugswort
  alternative: Das Pronomen kann auf den betroffenen Jungen bezogen werden.
  rationale: Das unmittelbar vorausgesetzte δαιμόνιον ist im Griechischen sächlich und passt formal zu αὐτό; außerdem bezeichnet ἐκβάλλω in diesem Zusammenhang gewöhnlich das Austreiben des Dämons. Da das deutsche »ihn« grammatisch sowohl zu »Dämon« als auch zu »Junge« passt, wird die mögliche Spannung nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da kamen« wahrt den erzählerischen Anschluss; »als sie unter sich waren« gibt κατ’ ἰδίαν natürlich wieder. Die direkte Rede verwendet deutsche Anführungszeichen.
