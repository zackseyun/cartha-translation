  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: de
  text: 'Und siehe[a]: Mose und Elia erschienen ihnen und redeten mit ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden von ihnen gesehen«; das griechische Verb ist der Form nach passiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird ausdrücklich wiedergegeben und vermittelt die plötzliche, anschauliche Wendung der Erzählung in verständlichem modernem Deutsch.
- source_word: ὤφθη
  choice: erschienen
  rationale: Der formal passive Aorist von ὁράω bezeichnet hier idiomatisch ein Sichtbarwerden. „Erschienen“ klingt im Deutschen natürlicher als „wurden gesehen“, ohne die sichtbare Wahrnehmung aufzugeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet diejenigen, denen die Erscheinung sichtbar wurde.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
- source_word: Ἠλίας
  choice: Elija
  rationale: Gebräuchliche moderne deutsche Namensform.
- source_word: συλλαλοῦντες
  choice: redeten
  rationale: Das Partizip bezeichnet ein gemeinsames Sprechen beziehungsweise ein Gespräch; „redeten mit ihm“ ist natürlich und wahrt den wechselseitigen Sinn.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft beziehungsweise Begleitung; das Pronomen bleibt entsprechend dem Griechischen erhalten.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: „ihm“ bleibt als Pronomen stehen und bezieht sich im Kontext auf Jesus
  alternative: Den Namen „Jesus“ ausdrücklich einsetzen
  rationale: Der Erzählzusammenhang macht den Bezug klar; die Beibehaltung des Pronomens folgt dem griechischen Wortlaut und vermeidet eine unnötige Explizierung.
- issue: Art der Erscheinung von Mose und Elija
  choice: „erschienen ihnen“
  alternative: „wurden von ihnen gesehen“
  rationale: Die Übersetzung gibt das sichtbare Auftreten wieder, ohne näher zu bestimmen, auf welche Weise Mose und Elija gegenwärtig waren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Sieh“ bewahrt den markierenden Impuls von ἰδού, während „erschienen“ und „redeten“ natürliche deutsche Formulierungen bieten.
