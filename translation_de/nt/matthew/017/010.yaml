id: MAT.17.10
reference: Matthew 17:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: de
  text: 'Da fragten ihn die Jünger: »Warum sagen dann die Schriftgelehrten, Elija müsse zuerst kommen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: fragten
  rationale: Der Aorist bezeichnet hier das einmalige Stellen einer direkten Frage; »fragten« ist im modernen Deutsch natürlich und genau.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel bezeichnet die aus dem Zusammenhang bekannte Gruppe. Ein ergänztes »seine« ist nicht erforderlich.
- source_word: λέγοντες
  choice: direkte Rede ohne »und sagten«
  rationale: Das Partizip führt den Inhalt der Frage ein. Im Deutschen gibt der Doppelpunkt diese Funktion natürlich wieder; eine wörtliche Wiedergabe mit »und sagten« wäre unnötig schwerfällig.
- source_word: Τί οὖν
  choice: Warum … dann
  rationale: τί fragt in Verbindung mit λέγουσιν ὅτι idiomatisch nach dem Grund. οὖν knüpft folgernd an den vorausgehenden Zusammenhang an und wird mit »dann« wiedergegeben.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: »Schriftgelehrte« ist die etablierte und sachlich passende deutsche Bezeichnung für die mit Auslegung und Vermittlung der heiligen Schriften befasste Gruppe.
- source_word: λέγουσιν ὅτι
  choice: sagen, …
  rationale: Das Präsens bezeichnet die geltende Aussage oder Lehre; im Deutschen kann der Inhalt nach »sagen« idiomatisch als uneingeleiteter Objektsatz mit Konjunktiv stehen.
- source_word: Ἠλίαν
  choice: Elija
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch verbreiteten Form wiedergegeben.
- source_word: δεῖ ἐλθεῖν
  choice: müsse … kommen
  rationale: Der Konjunktiv I kennzeichnet die wiedergegebene Aussage der Schriftgelehrten, während »müsse« die von δεῖ ausgedrückte Notwendigkeit bewahrt.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das Adverb bezeichnet die zeitliche beziehungsweise heilsgeschichtliche Reihenfolge, ohne diese näher auszudeuten.
theological_decisions:
- issue: Bedeutung der Frage nach dem Kommen Elijas
  choice: Die Frage wird ohne Vorwegnahme der Antwort in den folgenden Versen wiedergegeben.
  alternative: Die Formulierung könnte Skepsis gegenüber den Schriftgelehrten andeuten oder den Hintergrund aus Maleachi ausdrücklich eintragen.
  rationale: Der griechische Text lässt an dieser Stelle offen, ob die Lehre der Schriftgelehrten bestätigt, bestritten oder näher bestimmt werden soll. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Der Doppelpunkt ersetzt die im Deutschen schwerfällige wörtliche Wiedergabe von λέγοντες; der Konjunktiv I markiert sachgerecht die berichtete Lehrmeinung.
