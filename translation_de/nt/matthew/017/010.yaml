review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt sämtliche Elemente des griechischen Textes zuverlässig wieder: καί ist als erzählendes »Da« idiomatisch eingebunden, ἐπηρώτησαν als »fragten«, die bestimmte Gruppe οἱ μαθηταί als »die Jünger«, und der Inhalt der Frage bleibt vollständig erhalten. »Warum ... dann« trifft Τί οὖν in dieser idiomatischen Frage. »Elija müsse zuerst kommen« gibt die notwendige zeitliche Vorordnung von Ἠλίαν δεῖ ἐλθεῖν πρῶτον präzise wieder.'
  naturalness: Sehr natürliches modernes Standarddeutsch. Der Doppelpunkt ist eine gelungene deutsche Entsprechung für das Partizip λέγοντες, ohne einen unnötig hölzernen Begleitsatz einzuführen. Der Konjunktiv I in »müsse« kennzeichnet die referierte Aussage der Schriftgelehrten klar und idiomatisch.
  terminology: »Jünger«, »Schriftgelehrte« und »Elija« sind im deutschen Bibelregister etablierte, verständliche und sachgerechte Bezeichnungen. »Schriftgelehrte« wahrt gegenüber einer erklärenden Umschreibung die Nähe zu γραμματεῖς. Die Modalität von δεῖ bleibt mit »müsse« erhalten, ohne die folgende Auslegung vorwegzunehmen.
