id: MAT.17.22
reference: Matthew 17:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: de
  text: 'Während sie sich in Galiläa versammelten[a], sagte Jesus zu ihnen: „Der Menschensohn wird bald in die Hände von Menschen ausgeliefert werden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Während sie in Galiläa zusammen waren.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übergeben werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: während sie sich … versammelten
  rationale: Das Genitivus-absolute-Gefüge bezeichnet das Zusammenkommen beziehungsweise Zusammensein der Gruppe. „Sich versammeln“ bewahrt den gemeinschaftlichen Sinn, ohne eine bestimmte Bewegung vorauszusetzen.
- source_word: δὲ
  choice: während
  rationale: Die Partikel verbindet hier den Begleitumstand mit Jesu Aussage. Zusammen mit dem Genitivus absolutus ergibt „während“ einen natürlichen deutschen Satzanschluss.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: in Galiläa
  rationale: Schlichte lokale Wiedergabe ohne die nicht ausdrücklich bezeichnete Bedeutung „in ganz Galiläa“ einzutragen.
- source_word: εἶπεν αὐτοῖς
  choice: sagte Jesus zu ihnen
  rationale: Direkte und idiomatische Wiedergabe von λέγω mit dem indirekten Objekt.
- source_word: Μέλλει
  choice: wird bald
  rationale: „Bald“ bringt das bevorstehende Geschehen zum Ausdruck, ohne eine göttliche oder schicksalhafte Vorherbestimmung ausdrücklich in den Wortlaut einzutragen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die eingebürgerte, formal nahe Wiedergabe erhält Jesu Selbstbezeichnung und ihre biblisch-theologische Resonanz.
- source_word: παραδίδοσθαι
  choice: ausgeliefert werden
  rationale: Die passive Form bleibt erhalten. „Ausgeliefert werden“ bezeichnet die Übergabe in fremde Gewalt, ohne die Handlung bereits ausschließlich als Verrat oder als förmlichen Rechtsakt zu bestimmen.
- source_word: εἰς χεῖρας
  choice: in die Hände von
  rationale: Die im Griechischen vorhandene Metapher bleibt erhalten und ist auch im modernen Deutschen verständlich.
- source_word: ἀνθρώπων
  choice: Menschen
  rationale: „Menschen“ gibt den Plural geschlechtsübergreifend wieder und erhält zugleich das Wortspiel beziehungsweise den Kontrast zwischen „Menschensohn“ und menschlichen Akteuren.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Menschensohn“ bewahrt die feste Evangelienbezeichnung und ihre intertextuelle Tragweite; interpretierende Umschreibungen würden diese Bezüge abschwächen.
- issue: Bedeutungsumfang von παραδίδοσθαι in der Leidensankündigung
  choice: ausgeliefert werden
  alternative: übergeben werden / verraten werden
  rationale: Die gewählte Formulierung lässt offen, welche menschlichen Akteure die Übergabe vollziehen und ob darüber hinaus eine theologische Passivbedeutung mitschwingt. „Verraten“ würde die Aussage vorschnell auf Judas verengen.
- issue: Zeitliche Nuance von μέλλει
  choice: wird bald
  alternative: steht im Begriff / wird
  rationale: Die Übersetzung macht das Bevorstehen sichtbar, ohne mit „steht im Begriff“ eine im Deutschen schwerfällige Konstruktion zu erzeugen oder mit einem bloßen Futur die Nuance ganz entfallen zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig, während die Metapher „in die Hände von Menschen“ und die traditionelle Bezeichnung „Menschensohn“ bewusst erhalten bleiben.
