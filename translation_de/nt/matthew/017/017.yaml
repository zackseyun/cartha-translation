  source_fidelity: Die Übersetzung gibt die Anrede, die Charakterisierung der γενεά, die zwei rhetorischen Fragen und den abschließenden Imperativ insgesamt treffend wieder. „Ungläubig“ und „verkehrte Generation“ sind sachgerecht; „Bringt ihn her zu mir“ gibt φέρετέ μοι αὐτὸν ὧδε vollständig und idiomatisch wieder. Die futurischen Indikative ἔσομαι und ἀνέξομαι sollten jedoch nicht mit dem deutschen Modalverb „soll“ wiedergegeben werden, da dieses eine im griechischen Text nicht ausgedrückte Sollens- bzw. Verpflichtungsnuance nahelegen kann.
