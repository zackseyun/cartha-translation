  terminology: „O“, „ungläubig“, „verkehrte Generation“ und „ertragen“ halten einen würdigen, verständlichen biblischen Registerton. Die Fußnoten bieten echte lexikalische Alternativen, ohne den Text dogmatisch festzulegen.
