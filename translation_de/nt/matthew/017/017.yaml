  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: de
  text: 'Jesus aber erwiderte: „O ungläubige[a] und verkehrte[b] Generation! Wie lange werde ich noch bei euch sein? Wie lange werde ich euch noch ertragen? Bringt ihn her zu mir!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treulose“. Das griechische Adjektiv kann sowohl „ungläubig“ als auch „treulos“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verdrehte“ oder „verdorbene“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jesus aber erwiderte
  rationale: Die Verbindung aus ἀποκριθείς und εἶπεν ist eine feste, semitisch geprägte Redeformel. „Erwiderte“ gibt sie im Deutschen knapp und natürlich wieder; „aber“ bewahrt den leicht gegensätzlichen Übergang von δέ.
- source_word: Ὦ
  choice: O
  rationale: Die Anredepartikel drückt hier feierlichen Tadel und Klage aus. Das deutsche „O“ erhält diesen gehobenen Ton.
- source_word: γενεὰ
  choice: Generation
  rationale: γενεά bezeichnet hier die gegenwärtige Menschengruppe beziehungsweise Generation. „Generation“ ist im modernen Deutsch verständlich und erhält den prophetischen Anklang.
- source_word: ἄπιστος
  choice: ungläubig
  rationale: Das Adjektiv kann mangelnden Glauben oder mangelnde Treue bezeichnen. Im unmittelbaren Zusammenhang steht fehlender Glaube im Vordergrund; die andere Möglichkeit bleibt in Fußnote [a] sichtbar.
- source_word: διεστραμμένη
  choice: verkehrt
  rationale: Das Partizip bezeichnet einen verdrehten oder moralisch entstellten Zustand. „Verkehrt“ ist würdig und verständlich, ohne die Aussage auf eine bestimmte Art der Verderbnis einzuengen.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Wie lange soll ich noch bei euch sein?
  rationale: „Wie lange“ entspricht der idiomatischen Frage ἕως πότε. Das deutsche „soll ... noch“ bringt den vorwurfsvollen Sinn der griechischen Zukunftsfrage natürlich zum Ausdruck, ohne eine genaue Zeitangabe einzuführen.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Wie lange soll ich euch noch ertragen?
  rationale: ἀνέχομαι bedeutet hier „ertragen“ oder „aushalten“. „Ertragen“ wahrt sowohl die Schärfe des Tadels als auch den würdigen Sprachton.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Bringt ihn her zu mir!
  rationale: Der Imperativ fordert dazu auf, den betroffenen Jungen an den Ort zu Jesus zu bringen. „Her zu mir“ gibt sowohl ὧδε als auch μοι natürlich wieder.
theological_decisions:
- issue: Bedeutung von ἄπιστος im Tadel Jesu
  choice: ungläubig
  alternative: treulos
  rationale: Der Zusammenhang handelt vom Mangel an Glauben bei der gescheiterten Heilung beziehungsweise Dämonenaustreibung. „Ungläubig“ lässt diesen Bezug erkennen; „treulos“ bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
- issue: Adressatenumfang von γενεά
  choice: Generation
  alternative: Geschlecht / Leute
  rationale: Der griechische Ausdruck kann die Zeitgenossen als Gruppe bezeichnen und muss nicht auf die unmittelbar angesprochenen Jünger beschränkt werden. „Generation“ bewahrt diesen offenen Umfang und die prophetische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht gehobenem Ton. Die zweifache rhetorische Frage und die Schärfe des Tadels bleiben erhalten; „noch“ macht deren idiomatische Kraft im Deutschen deutlich.
