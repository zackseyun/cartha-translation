  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: de
  text: Da verstanden die Jünger, dass er zu ihnen über Johannes den Täufer[a] gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Johannes den Taufenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet in der Erzählung den Zeitpunkt ihrer Einsicht; „Da“ ist im Deutschen ein natürlicher und knapper Anschluss.
- source_word: συνῆκαν
  choice: verstanden
  rationale: Der Aorist von συνίημι bezeichnet hier das Erfassen des zuvor Gesagten; „verstanden“ gibt dies klar und ohne Überdeutung wieder.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Die übliche und im Evangelienkontext eindeutige deutsche Bezeichnung für die Schüler und Nachfolger Jesu.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was die Jünger verstanden, und ist daher nicht kausal wiederzugeben.
- source_word: περὶ
  choice: von
  rationale: περί mit Genitiv bezeichnet hier das Thema der Aussage; in der Verbindung „von jemandem sprechen“ ist „von“ natürliches modernes Deutsch.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Johannes dem Täufer
  rationale: „Johannes der Täufer“ ist die etablierte deutsche Bezeichnung; „der Taufende“ bildet die Tätigkeit unmittelbarer ab, ist jedoch weniger gebräuchlich.
- source_word: εἶπεν αὐτοῖς
  choice: er zu ihnen … gesprochen hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Jesu Reden der späteren Einsicht vorausging; „zu ihnen gesprochen“ bewahrt den verbalen Vorgang ohne unnötige Präzisierung.
theological_decisions:
- issue: Identität der Elia-Gestalt im unmittelbaren Zusammenhang
  choice: Der Vers sagt ausdrücklich, dass die Jünger Jesu Worte auf Johannes den Täufer bezogen.
  alternative: Die Identifizierung nur indirekt anzudeuten oder theologisch weiter auszulegen.
  rationale: Die Erzählerstimme nennt Johannes ausdrücklich als den gemeinten Referenten. Die Übersetzung gibt diese Identifizierung wieder, ohne sie über den Wortlaut hinaus zu entfalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da verstanden“ erhält den knappen erzählerischen Übergang; die Satzstellung bleibt natürlich und nahe an der griechischen Struktur.
