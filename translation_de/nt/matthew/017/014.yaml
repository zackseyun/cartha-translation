  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: de
  text: Und als sie zu der Menschenmenge kamen, trat ein Mann zu ihm und kniete vor ihm nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fiel vor ihm auf die Knie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der gewöhnliche Erzählanschluss bleibt erhalten, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: ἐλθόντων πρὸς τὸν ὄχλον
  choice: als sie zu der Menschenmenge kamen
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Rahmen; das im Zusammenhang vorausgesetzte Subjekt ist eine Mehrzahl. „Menschenmenge“ gibt ὄχλος in natürlichem, modernem Deutsch wieder.
- source_word: προσῆλθεν αὐτῷ
  choice: trat … zu ihm
  rationale: Die Wendung drückt aus, dass der Mann sich Jesus näherte. „Zu ihm treten“ bewahrt die Bewegungsrichtung und passt zum würdevollen Erzählstil.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Hier bezeichnet das maskuline Substantiv einen bestimmten erwachsenen Mann, nicht den Menschen im allgemeinen Sinn.
- source_word: γονυπετῶν αὐτόν
  choice: kniete vor ihm nieder
  rationale: Das Partizip schildert die kniende Haltung beziehungsweise Bewegung des Mannes gegenüber Jesus. Die deutsche Wendung ist natürlich und gibt die ehrerbietige körperliche Handlung wieder.
theological_decisions:
- issue: Bedeutung der knienden Haltung gegenüber Jesus
  choice: 'Die Handlung wird körperlich beschrieben: „kniete vor ihm nieder“.'
  alternative: Die Haltung ausdrücklich als Anbetung oder Huldigung deuten.
  rationale: γονυπετέω bezeichnet hier unmittelbar das Niederknien. Der Text lässt die ehrerbietige Bedeutung erkennen, benennt aber nicht ausdrücklich eine bestimmte theologische Kategorie; diese wird daher nicht ergänzt.
- issue: Wiedergabe von ἄνθρωπος für eine einzelne Person
  choice: ein Mann
  alternative: ein Mensch / jemand
  rationale: Im konkreten Erzählzusammenhang ist ein männlicher Einzelner gemeint. „Ein Mann“ ist präzise, ohne weitergehende anthropologische Aussagen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung macht die beiden eng verbundenen Handlungen – das Herantreten und Niederknien – klar, ohne die kniende Haltung über den griechischen Wortlaut hinaus theologisch auszudeuten.
