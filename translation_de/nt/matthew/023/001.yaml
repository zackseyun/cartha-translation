  text: Τότε ὁ Ἰησοῦς ἐλάλησεν τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: de
  text: 'Dann sprach Jesus zu den Menschenmengen und zu seinen Jüngern:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die Abfolge im Erzählgang; „Dann“ ist im Deutschen knapp und natürlich.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der Artikel vor dem Eigennamen entspricht üblichem griechischem Erzählstil und wird im Deutschen nicht wiedergegeben.
- source_word: ἐλάλησεν
  choice: sprach
  rationale: Der Aorist von λαλέω bezeichnet hier schlicht den Sprechakt. „Sprach“ bewahrt die Nähe zum Ausgangstext, ohne die stärkere Nuance von „wandte sich an“ einzutragen.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Der artikulierte Dativ Plural bezeichnet mehrere versammelte Gruppen. „Menschenmengen“ bildet den Plural ab und ist verständlicher als das gehobene „Volksscharen“.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden angesprochenen Gruppen.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Der Dativ Plural mit possessivem Genitiv wird im Deutschen natürlich mit dem Possessivartikel wiedergegeben; „Jünger“ ist die etablierte Entsprechung für μαθηταί im Evangelienkontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt signalisiert, dass in den folgenden Versen die direkte Rede einsetzt. Die Wiederholung von „zu“ verdeutlicht entsprechend dem griechischen Text die beiden Adressatengruppen.
