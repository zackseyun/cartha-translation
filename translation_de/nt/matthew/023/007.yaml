  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: de
  text: und die Begrüßungen auf den Marktplätzen und von den Menschen »Rabbi« genannt zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: Begrüßungen
  rationale: Gibt die öffentlich ehrerbietigen Grüße im Zusammenhang direkt und verständlich wieder.
- source_word: ἀγοραῖς
  choice: Marktplätzen
  rationale: Bezeichnet die öffentlichen Markt- und Versammlungsplätze der Städte.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: die Menschen
  rationale: Im deutschen Passivsatz natürlich als handelndes Subjekt wiedergegeben; ἄνθρωποι bezeichnet hier Menschen allgemein, nicht spezifisch Männer.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Bewahrt den im Griechischen transliterierten jüdischen Ehrentitel.
theological_decisions:
- issue: Reichweite von ἄνθρωποι
  choice: Menschen allgemein
  alternative: Männer
  rationale: Das Substantiv ist in diesem Kontext generisch; eine geschlechtsspezifische Wiedergabe wäre sachlich enger als der griechische Text.
translation_notes:
  register: Als fortlaufendes Satzglied knapp und parallel zum vorausgehenden Kontext formuliert. Die aktive deutsche Konstruktion vermeidet das schwerfällige »von den Menschen Rabbi genannt zu werden«, ohne den Sinn zu verändern.
