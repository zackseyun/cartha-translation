    issue: Die Konstruktion „und dass die Menschen sie »Rabbi« nennen“ gibt καλεῖσθαι ὑπὸ τῶν ἀνθρώπων nicht in der parallelen Infinitivform wieder.
    rationale: Das griechische καλεῖσθαι („genannt zu werden“) ist neben dem vorherigen Satzglied als Objekt zu „lieben“ im Kontext gereiht. „Von den Menschen … genannt zu werden“ bewahrt Syntax, Fokus und Parallelismus klarer.
  revised_text: und die Begrüßungen auf den Marktplätzen und von den Menschen »Rabbi« genannt zu werden.
