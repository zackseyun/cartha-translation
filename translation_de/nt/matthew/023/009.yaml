source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: de
  text: 'Und nennt auf Erden niemanden euren Vater[a]; denn einer ist euer Vater: der Himmlische[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und nennt auf Erden niemanden Vater.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der himmlische Vater“; auch möglich: „der im Himmel ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: nennt niemanden … euren Vater
  rationale: μή mit Aorist Konjunktiv formuliert ein Verbot. „Niemanden euren Vater nennen“ gibt die Bezeichnung als „Vater“ direkt wieder, ohne durch „anreden“ den Sinn unnötig einzuengen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die übliche deutsche Wendung bezeichnet den irdischen Bereich und hält den Gegensatz zum himmlischen Vater fest.
- source_word: εἷς
  choice: einer
  rationale: Das griechische Zahlwort wird ausdrücklich wiedergegeben, ohne im Haupttext das verstärkende „nur“ hinzuzufügen.
- source_word: ὑμῶν ὁ πατήρ
  choice: euer Vater
  rationale: Das Genitivpronomen bezeichnet die persönliche Beziehung; im Deutschen ist die possessive Form natürlich.
- source_word: ὁ οὐράνιος
  choice: der himmlische
  rationale: Das substantivierte Adjektiv nimmt „Vater“ wieder auf. Die bewusst knappe, etwas markierte Form bewahrt die griechische Ausdrucksweise besser als eine örtliche Umschreibung.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Das Verbot bleibt in seiner uneingeschränkten sprachlichen Schärfe stehen.
  alternative: Die Aussage ausdrücklich auf geistliche Ehrentitel beschränken oder als Verbot jeder biologischen und gesellschaftlichen Verwendung von „Vater“ auslegen.
  rationale: Der griechische Wortlaut ist pointiert, erklärt aber in diesem Vers nicht ausdrücklich, wie das Verbot zu gewöhnlichen familiären Verwendungen von „Vater“ steht. Die Übersetzung soll diese Spannung nicht vorentscheiden.
- issue: Einzigkeit des himmlischen Vaters
  choice: „einer ist euer Vater“
  alternative: „nur einer ist euer Vater“
  rationale: „Nur“ würde die im Zusammenhang erkennbare Ausschließlichkeit verdeutlichen, ist aber im griechischen Wortlaut nicht eigens ausgedrückt; „einer“ bewahrt dessen Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede steht entsprechend dem griechischen Plural in der Form „euren/euer“. Das substantivierte „der himmlische“ ist bewusst knapp und leicht markiert; der Doppelpunkt macht seine rückbezügliche Apposition verständlich.
