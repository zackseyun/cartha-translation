id: MAT.23.8
reference: Matthew 23:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: de
  text: Ihr aber sollt euch nicht »Rabbi« nennen lassen[a]; denn einer ist euer Lehrer, ihr alle aber seid Brüder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lehrer«. Der Titel »Rabbi« bezeichnet einen jüdischen Lehrer; die Beibehaltung des Titels wahrt den jüdischen Kontext und unterscheidet ihn von »Lehrer« im folgenden Satzteil.'
    reason: lexical_alternative
  - marker: b
    text: »Brüder« gibt die maskuline Pluralform ἀδελφοί wieder. Im Zusammenhang kann sie die Gemeinschaft der Jünger insgesamt bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: sollt euch nicht … nennen lassen
  rationale: Die passive Verbform mit μή drückt hier ein Verbot aus. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt sowohl den passiven Sinn als auch den Weisungscharakter.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Der griechische Text übernimmt den jüdischen Titel als Lehnwort. Seine Beibehaltung wahrt den historischen Kontext und unterscheidet ihn vom folgenden διδάσκαλος.
- source_word: εἷς
  choice: einer
  rationale: Die direkte Wiedergabe erhält die betonte Einzahl, ohne durch »nur einer« die Aussage unnötig zu verstärken.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: euer Lehrer
  rationale: Der Genitiv ὑμῶν bezeichnet die Beziehung des Lehrers zu den Angesprochenen; »euer Lehrer« ist die natürliche deutsche Entsprechung.
- source_word: πάντες δὲ ὑμεῖς
  choice: ihr alle aber
  rationale: Diese Wortstellung gibt die ausdrückliche Gesamtheit der Angesprochenen wieder und bewahrt zugleich den Gegensatz durch δέ.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die maskuline Pluralform und das familiäre Bild werden formal bewahrt. Dass die Bezeichnung im Zusammenhang die Gemeinschaft der Jünger insgesamt meinen kann, wird in einer Fußnote erläutert.
theological_decisions:
- issue: Ob Jesus sämtliche menschlichen Ehrentitel ausnahmslos verbietet oder vor allem Rangstreben in der Jüngergemeinschaft anspricht
  choice: Die unmittelbare Verbotsform bleibt ohne Ausweitung oder Einschränkung stehen.
  alternative: Eine ausdrückliche absolute Untersagung jedes vergleichbaren Titels oder eine Begrenzung allein auf heuchlerisches Rangstreben.
  rationale: Der griechische Wortlaut enthält ein direktes Verbot mit Begründung, legt aber dessen sämtliche späteren Anwendungsbereiche nicht fest. Die Übersetzung soll diese Spannung nicht dogmatisch auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sollt euch nicht … nennen lassen« vermeidet eine hölzerne Nachbildung des griechischen Passivs; »Rabbi« bewahrt das historische Kolorit. Die Satzstellung erhält den Kontrast zwischen dem einen Lehrer und der gleichrangigen Gemeinschaft aller Jünger.
