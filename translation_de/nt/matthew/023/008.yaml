  source_fidelity: Der deutsche Text gibt die prohibitive passive Konstruktion μὴ κληθῆτε treffend mit „sollt euch nicht … nennen lassen“ wieder. „Rabbi“ bewahrt den im griechischen Text stehenden jüdischen Titel, „einer ist euer Lehrer“ bildet εἷς … ὁ διδάσκαλος ohne unzulässige Verstärkung ab, und „ihr alle aber seid Brüder“ erhält sowohl πάντες als auch den familiären Ausdruck ἀδελφοί.
  naturalness: Modernes, idiomatisches und würdiges Standarddeutsch. Die Satzfolge ist klar und trägt den Kontrast des griechischen δέ natürlich mit.
  terminology: „Rabbi“ und „Lehrer“ sind sinnvoll unterschieden. „Brüder“ entspricht der maskulinen Pluralform; die Fußnote erläutert zurückhaltend, dass im Kontext die gesamte Jüngergemeinschaft gemeint sein kann. Die Fußnotenanker sind korrekt platziert und stimmen mit den vorhandenen Fußnoten überein.
