id: MAT.23.18
reference: Matthew 23:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: de
  text: 'Und: »Wer beim Altar schwört, das bedeutet nichts[a]; wer aber bei der Gabe schwört, die darauf liegt[b], ist verpflichtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt nach der Lehre, die Jesus hier verurteilt: Ein Schwur beim Altar zählt nicht und gilt als unverbindlich.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »bei der Opfergabe, die darauf liegt«. Das griechische Wort kann eine Gott im Tempel dargebrachte Gabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Und
  rationale: Ein schlichter Anschluss führt die Reihe der von Jesus verurteilten Lehrsätze fort.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Wer ... schwört / wer aber ... schwört
  rationale: Die Verbindung aus Relativpronomen, ἄν und Aorist Konjunktiv bezeichnet einen unbestimmten allgemeinen Fall; die deutsche Formulierung gibt dies natürlich wieder.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: beim Altar
  rationale: Bei Schwurformeln bezeichnet ἐν hier den Gegenstand, bei dem geschworen wird; »beim Altar schwören« ist die entsprechende deutsche Wendung.
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Dies ist die übliche und präzise Bezeichnung für den Opferaltar im Tempelzusammenhang.
- source_word: οὐδέν ἐστιν
  choice: das bedeutet nichts
  rationale: Die Wendung besagt in der hier zitierten Lehre, dass ein solcher Schwur nicht zählt. Die idiomatische Wiedergabe ist im modernen Deutsch verständlicher als das wörtliche »es ist nichts«.
- source_word: ἐν τῷ δώρῳ
  choice: bei der Gabe
  rationale: δῶρον bezeichnet unmittelbar eine Gabe und im Tempelzusammenhang eine Gott dargebrachte Opfergabe; »Gabe« bewahrt die lexikalische Breite.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: die darauf liegt
  rationale: Die attributive Wendung bestimmt die Gabe näher und bezeichnet ihre Lage auf dem Altar. Das Verb »liegt« ist im Deutschen zur natürlichen Satzbildung ergänzt.
- source_word: ὀφείλει
  choice: ist verpflichtet
  rationale: Im Zusammenhang mit einem Schwur bezeichnet das Verb eine bestehende rechtlich-moralische Verpflichtung, ohne deren Gegenstand ausdrücklich zu nennen.
theological_decisions:
- issue: Unausgesprochener Gegenstand der Verpflichtung in der Schwurformel
  choice: »ist verpflichtet« ohne ergänztes Objekt
  alternative: »ist an seinen Schwur gebunden« oder »muss ihn erfüllen«
  rationale: Der griechische Text lässt den Gegenstand der Verpflichtung unausgesprochen. Der Zusammenhang macht den Bezug auf den Schwur deutlich, doch der Haupttext bewahrt die knappe Form des Originals.
- issue: Status des Schwurs beim Altar
  choice: »das bedeutet nichts« als Wiedergabe der zitierten und anschließend verurteilten Lehre
  alternative: »ist zu nichts verpflichtet«
  rationale: Jesus gibt hier die kasuistische Auffassung seiner Gegner wieder; die Übersetzung darf sie nicht als seine eigene normative Lehre erscheinen lassen. Der Kontext und die Fußnote verdeutlichen ihren zitierten Charakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel »bei etwas schwören« ist idiomatisch; »ist verpflichtet« bewahrt die knappe, objektlose Aussage des griechischen Textes. Beide Fußnotenmarker stehen unmittelbar an den jeweils erklärten Aussagen.
