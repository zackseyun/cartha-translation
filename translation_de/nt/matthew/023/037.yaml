id: MAT.23.37
reference: Matthew 23:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: de
  text: Jerusalem, Jerusalem, du tötest die Propheten und steinigst die, die zu dir gesandt sind! Wie oft wollte ich deine Kinder sammeln, wie eine Henne ihre Küken unter ihre Flügel sammelt, doch ihr habt nicht gewollt!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: Bewahrt die eindringliche Wiederholung und die direkte, klagende Anrede.
- source_word: ἡ ἀποκτείνουσα … καὶ λιθοβολοῦσα
  choice: du tötest … und steinigst
  rationale: Die substantivierten Präsenspartizipien kennzeichnen Jerusalem durch wiederholtes bzw. charakteristisches Handeln; die direkte Anrede ist im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: die, die zu dir gesandt sind
  rationale: Gibt das passive Partizip und das Ziel der Sendung wieder; die zweite Person entspricht der personifizierenden direkten Anrede.
- source_word: ποσάκις ἠθέλησα
  choice: Wie oft wollte ich
  rationale: Gibt Häufigkeit und echtes Wollen wieder, ohne das Verb dogmatisch zu verstärken.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: deine Kinder um mich sammeln
  rationale: Bewahrt das Bild der Kinder Jerusalems; „um mich sammeln“ macht das auf eine Mitte gerichtete Zusammenbringen im Deutschen anschaulich, ohne die Personengruppe näher festzulegen.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: wie eine Henne ihre Küken … sammelt
  rationale: ὄρνις kann allgemeiner einen Vogel bezeichnen, doch die mütterliche Szene mit Küken unter den Flügeln legt hier eine Henne nahe; die Wiederholung von „sammeln“ wahrt die lexikalische Verbindung.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: unter ihre Flügel
  rationale: Direkte und natürliche Wiedergabe des Schutzbildes.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: doch ihr habt nicht gewollt
  rationale: Das adversative „doch“ bringt den scharfen Gegensatz der beiden Willensäußerungen idiomatisch zum Ausdruck; der Pluralwechsel vom angesprochenen Jerusalem zu seinen Menschen bleibt sichtbar.
theological_decisions:
- issue: Willenskontrast zwischen Jesus und Jerusalem
  choice: „wollte ich … ihr habt nicht gewollt“
  alternative: „ich war willens … ihr wart nicht willens“ oder eine deterministische bzw. rein emotionale Paraphrase
  rationale: Die Wiederholung desselben Verbs θέλω wird bewahrt und damit die Spannung zwischen Jesu Wollen und der Weigerung der Angesprochenen offengehalten, ohne sie lehrmäßig aufzulösen.
- issue: Bezug von „deine Kinder“
  choice: deine Kinder
  alternative: deine Einwohner / dein Volk
  rationale: Die Metapher der personifizierten Stadt und ihrer Kinder bleibt erhalten; eine engere Identifizierung wird nicht in den Text eingetragen.
- issue: Numeruswechsel in der Anrede
  choice: „du tötest … zu dir“ und anschließend „ihr habt nicht gewollt“
  alternative: den gesamten Vers auf einen einheitlichen Singular oder Plural angleichen
  rationale: Der griechische Text spricht die Stadt zunächst im Singular an, verwendet am Ende aber den Plural für die angesprochenen Menschen. Diese bedeutungsvolle Spannung wird erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Klage- und Anredestruktur. Die idiomatische direkte Anrede vermeidet eine schwerfällige deutsche Partizipialform. Das abschließende Ausrufezeichen gibt den emotionalen Charakter des Ausrufs wieder.
