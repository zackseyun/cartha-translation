id: MAT.23.12
reference: Matthew 23:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: de
  text: Wer sich aber erhöht, wird erniedrigt werden, und wer sich erniedrigt, wird erhöht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: wer
  rationale: Das indefinite Relativpronomen leitet jeweils eine allgemeingültige, sprichwortartige Aussage ein; deutsches „wer“ gibt dies knapp und natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier einen milden Gegensatz zum vorausgehenden Zusammenhang.
- source_word: ὑψώσει ἑαυτόν
  choice: sich selbst erhöht
  rationale: Die reflexive Wendung bezeichnet Selbsterhöhung. „Erhöht“ bewahrt zugleich die Wortentsprechung zum passiven ὑψωθήσεται.
- source_word: ταπεινωθήσεται
  choice: wird erniedrigt werden
  rationale: Das Futur Passiv wird ausdrücklich beibehalten, ohne den Handelnden zu benennen.
- source_word: ταπεινώσει ἑαυτόν
  choice: sich selbst erniedrigt
  rationale: Die reflexive Wendung beschreibt das bewusste Sich-Erniedrigen; „selbst“ hebt den Rückbezug hervor und erhält die Parallelität.
- source_word: ὑψωθήσεται
  choice: wird erhöht werden
  rationale: Das Futur Passiv und die lexikalische Spiegelung von „sich erhöht“ bleiben erhalten.
theological_decisions:
- issue: Handelnder bei den Passivformen
  choice: Die Passivformen bleiben ohne ausdrücklich genannten Handelnden stehen.
  alternative: „Gott wird ihn erniedrigen/erhöhen.“
  rationale: Der griechische Text nennt den Handelnden nicht. Die Formulierung lässt eine implizite göttliche Urheberschaft zu, legt sie aber nicht ausdrücklich in den Wortlaut hinein.
- issue: Allgemeiner Personenbezug
  choice: Die deutsche Konstruktion „wer sich“ wird verwendet.
  alternative: Eine ausdrücklich maskuline Formulierung wie „jeder, der sich selbst …“
  rationale: „Wer sich“ entspricht dem allgemeinen Aussagecharakter des griechischen maskulinen Singulars, ohne den Personenbezug unnötig auf Männer einzugrenzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer sprichwortartiger Parallelstruktur. Die wiederholten Futur-Passivformen werden trotz einer gewissen Schwere beibehalten, weil sie Form, Spannung und ungenannte Urheberschaft des griechischen Textes präzise wiedergeben.
