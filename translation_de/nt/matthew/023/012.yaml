  verdict: revise
  source_fidelity: 'Die Grundstruktur ist zutreffend: Die beiden antithetisch-parallelen Aussagen, die ungenannten Passivhandlungen und die allgemeine Aussagekraft von ὅστις sind erhalten. Die futurischen Aktivformen stehen im Deutschen idiomatisch als Präsens in einer allgemeinen Wer-dann-Aussage; das ist vertretbar. Das zusätzliche „selbst“ ist jedoch keine notwendige Wiedergabe des griechischen Reflexivpronomens und kann im Deutschen eine nicht im Ausgangstext markierte Betonung der Eigenperson nahelegen.'
  naturalness: Die Formulierung ist grundsätzlich natürlich und würdevoll. Ohne „selbst“ klingt die sprichwortartige Parallele knapper und im modernen Standarddeutsch noch flüssiger.
  terminology: „erniedrigt werden“ und „erhöht werden“ geben ταπεινωθήσεται und ὑψωθήσεται präzise wieder und bewahren die lexikalische Gegenüberstellung. Die Fußnotenalternative „herabgesetzt“ ist im Deutschen stärker administrativ bzw. statusbezogen und daher keine gleichwertig klare allgemeine Alternative; sie sollte entfallen.
  issues:
