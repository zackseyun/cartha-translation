  - severity: low
    issue: Lexikalische Alternativfußnote ist stilistisch weniger passend
    rationale: „Herabsetzen“ hat im heutigen Deutsch leicht einen administrativen oder sozialen Statusbeiklang. Da der Haupttext die Begriffe bereits angemessen wiedergibt, ist keine Fußnote erforderlich.
  revised_text: Wer sich aber erhöht, wird erniedrigt werden, und wer sich erniedrigt, wird erhöht werden.
