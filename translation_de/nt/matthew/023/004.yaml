id: MAT.23.4
reference: Matthew 23:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: de
  text: Sie binden schwere Lasten zusammen und legen sie den Menschen auf die Schultern; sie selbst aber wollen sie nicht mit ihrem Finger bewegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: binden … zusammen
  rationale: Das Verb bezeichnet das Binden oder Zusammenschnüren. Die Formulierung bewahrt das konkrete Bild, dass Lasten zum Auflegen gebündelt werden.
- source_word: φορτία βαρέα
  choice: schwere Lasten
  rationale: Die Wendung bewahrt sowohl das wörtliche Bild gewichtiger Lasten als auch die mögliche metaphorische Bedeutung drückender Verpflichtungen.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: legen sie … auf die Schultern
  rationale: Dies gibt die räumliche Konstruktion direkt und in natürlichem Deutsch wieder und erhält das körperliche Bild.
- source_word: τῶν ἀνθρώπων
  choice: den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein. „Den Menschen“ ist im modernen Deutschen präzise, inklusiv und stilistisch würdig, ohne eine geschlechtliche Einschränkung einzutragen.
- source_word: αὐτοὶ δὲ
  choice: sie selbst aber
  rationale: Die Wortstellung bringt den emphatischen Gegensatz zwischen den anderen auferlegten Lasten und der eigenen Weigerung zum Ausdruck.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: mit ihrem Finger
  rationale: Der Singular entspricht dem Griechischen und bezeichnet bildhaft selbst den geringsten möglichen Einsatz.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: wollen sie nicht … bewegen
  rationale: Die Übersetzung erhält sowohl den Willensaspekt von θέλω als auch die allgemeine Bedeutung „bewegen“ von κινέω, ohne deutender „heben“ oder „anrühren“ zu wählen.
theological_decisions:
- issue: Wörtliche oder metaphorische Deutung der Lasten
  choice: Das konkrete Bild „schwere Lasten“ bleibt ohne ausdrückliche Bestimmung seines Bezugs stehen.
  alternative: Die Lasten ausdrücklich als religiöse Vorschriften oder gesetzliche Forderungen erklären.
  rationale: Der Kontext legt drückende Verpflichtungen nahe, doch der griechische Wortlaut benennt sie hier nicht näher. Die offene Metapher bewahrt die Aussage und vermeidet eine unnötige dogmatische Verengung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satzbau wahrt die pointierte Gegenüberstellung des Handelns gegenüber anderen und der eigenen Weigerung. Ein Semikolon macht den Kontrast gut lesbar.
