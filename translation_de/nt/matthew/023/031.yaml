  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: de
  text: So bezeugt ihr gegen euch selbst, dass ihr Söhne derer seid, die die Propheten ermordet haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „So bezeugt ihr euch selbst.“ Im Zusammenhang belastet dieses Zeugnis die Angesprochenen selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Damit
  rationale: Leitet hier die Folgerung beziehungsweise das Ergebnis aus der vorherigen Aussage ein und klingt im modernen Deutschen natürlich.
- source_word: μαρτυρεῖτε
  choice: bezeugt ihr
  rationale: Gibt den Zeugnischarakter des Verbs wieder und bewahrt seinen leicht forensischen Klang.
- source_word: ἑαυτοῖς
  choice: gegen euch selbst
  rationale: Der Dativ bedeutet formal „euch selbst“, doch im Zusammenhang belastet ihr Zeugnis sie; „gegen euch selbst“ macht diese kontextuelle Wirkung deutlich.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was ihr Zeugnis erweist.
- source_word: υἱοί
  choice: Söhne
  rationale: Bewahrt die ausdrücklich männliche Familienmetapher sowie die rhetorische Verbindung von Abstammung und moralischer Entsprechung.
- source_word: τῶν φονευσάντων
  choice: derer, die … ermordet haben
  rationale: Bezeichnet die betreffenden Vorfahren durch ihre vollendete, schuldhafte Tötung; „ermordet“ wahrt die negative Wertung.
- source_word: τοὺς προφήτας
  choice: die Propheten
  rationale: Direkte und sachgerechte Wiedergabe der bekannten Gruppe göttlicher Boten.
theological_decisions:
- issue: Ob υἱοί wörtlich als „Söhne“ oder deutend als „Kinder“ beziehungsweise „Nachkommen“ wiederzugeben ist.
  choice: Söhne
  alternative: Kinder; Nachkommen
  rationale: „Söhne“ erhält die Familienmetapher und ihre rhetorische Schärfe. Im Kontext umfasst sie sowohl die genealogische Abstammung als auch die moralische Verbundenheit, ohne diese Spannung auf eine einzige Deutung zu reduzieren.
- issue: Ob ἑαυτοῖς neutral als „euch selbst“ oder kontextuell als „gegen euch selbst“ wiederzugeben ist.
  choice: gegen euch selbst
  alternative: euch selbst
  rationale: Die Aussage hat im Zusammenhang selbstbelastende Funktion. Die Hauptübersetzung macht diese Funktion verständlich; die formal nähere Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist natürlich, während „bezeugt“ und „Söhne“ den forensischen beziehungsweise familiären Ton des griechischen Textes bewahren.
