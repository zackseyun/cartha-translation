source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: de
  text: 'Darum: Seht, ich sende Propheten, Weise und Schriftgelehrte zu euch. Einige von ihnen werdet ihr töten und kreuzigen, und einige von ihnen werdet ihr in euren Synagogen auspeitschen und von Stadt zu Stadt verfolgen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Imperativ, ohne das im heutigen Deutsch altertümlich wirkende „siehe“ zu verwenden.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Der etablierte deutsche Ausdruck bezeichnet hier jüdische Kenner und Lehrer der heiligen Schriften.
- source_word: μαστιγώσετε
  choice: auspeitschen
  rationale: Gibt die konkrete körperliche Strafe kräftig und verständlich wieder.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: von Stadt zu Stadt verfolgen
  rationale: Entspricht der räumlichen Wendung des Griechischen und wahrt den fortgesetzten Charakter der Verfolgung.
theological_decisions:
- issue: Wer die Gesandten sendet
  choice: „Ich sende“
  alternative: Eine unpersönliche oder ausschließlich göttliche Sendungsformel
  rationale: Das ausdrückliche ἐγώ lässt Jesus selbst als den Sendenden sprechen; diese christologische Spannung wird nicht abgeschwächt.
- issue: Verteilung der Gewalttaten auf die Gesandten
  choice: „Einige … andere“
  alternative: „Von ihnen … und von ihnen“
  rationale: Die idiomatische Wiedergabe bezeichnet Teilgruppen, ohne festzulegen, ob Töten und Kreuzigen dieselben oder verschiedene Personen betreffen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die scharfe prophetische Aussage bleiben erhalten; unnötige Archaismen werden vermieden.
