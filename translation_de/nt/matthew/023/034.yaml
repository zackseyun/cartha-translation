revisions:
- from: 'Darum seht: Ich sende Propheten, Weise und Schriftgelehrte zu euch. Einige von ihnen werdet ihr töten und kreuzigen, andere werdet ihr in euren Synagogen auspeitschen und von Stadt zu Stadt verfolgen.'
  to: 'Darum: Seht, ich sende Propheten, Weise und Schriftgelehrte zu euch. Einige von ihnen werdet ihr töten und kreuzigen, und einige von ihnen werdet ihr in euren Synagogen auspeitschen und von Stadt zu Stadt verfolgen.'
  rationale: Die Revision glättet die moderne deutsche Syntax bei der Wiedergabe von ἰδού und vermeidet mit der wiederholten Formulierung „einige von ihnen“ eine nicht vom griechischen Text verlangte Trennung der betroffenen Teilgruppen. Die Aussage, der historische und religiöse Wortschatz sowie die Schärfe der angekündigten Gewalt bleiben unverändert.
  reviewer_model: gpt-5.6-terra
