review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft Satzbau und Inhalt des Griechischen insgesamt gut: Jesus sendet ausdrücklich selbst, und die Abfolge von Töten, Kreuzigen, Auspeitschen und Verfolgen bleibt erhalten. „Andere“ legt jedoch stärker als das zweimalige ἐξ αὐτῶν nahe, dass es sich zwingend um eine von der ersten Gruppe getrennte Gruppe handelt. Die Wiederholung „einige“ bewahrt die offenere Verteilung.'
  naturalness: '„Darum seht:“ ist im modernen Standarddeutsch weniger idiomatisch, weil „seht“ hier als aufmerksamkeitslenkende Partikel fungiert. „Darum: Seht, ich sende …“ bildet den Einschnitt und die emphatische Aufforderung klar und natürlich ab.'
  terminology: „Propheten“, „Weise“, „Schriftgelehrte“, „kreuzigen“, „auspeitschen“, „Synagogen“ und „verfolgen“ sind treffend und registergerecht. „Auspeitschen“ gibt μαστιγώσετε angemessen konkret wieder.
  issues:
  - severity: medium
    issue: „andere“ statt einer erneuten Teilmengenbezeichnung
    rationale: Das griechische ἐξ αὐτῶν … καὶ ἐξ αὐτῶν bezeichnet jeweils Personen aus derselben Gesamtgruppe, ohne ausdrücklich festzulegen, dass die zweite Teilgruppe von der ersten verschieden sein muss. „Einige … und einige …“ wahrt diese Offenheit.
  - severity: low
    issue: Interpunktion und Stellung von „seht“
    rationale: 'Als Wiedergabe von ἰδού ist „Seht, ich sende …“ idiomatischer als „seht: Ich sende …“. Ein Doppelpunkt nach „Darum“ markiert die folgernde Einleitung und die anschließende Ankündigung klar.'
  revised_text: 'Darum: Seht, ich sende Propheten, Weise und Schriftgelehrte zu euch. Einige von ihnen werdet ihr töten und kreuzigen, und einige von ihnen werdet ihr in euren Synagogen auspeitschen und von Stadt zu Stadt verfolgen.'
