  source_fidelity: 'Der Text gibt alle Elemente des Griechischen angemessen wieder: die doppelte scharfe Anrede (ὄφεις, γεννήματα ἐχιδνῶν), die rhetorisch-zukunftsbezogene Frage πῶς φύγητε, das forensisch breite κρίσεως und die spezifische Bezeichnung γεέννης. „Wie wollt ihr … entkommen?“ ist im Deutschen eine etablierte rhetorische Zukunftsfrage und legt keine stärkere theologische Aussage fest.'
