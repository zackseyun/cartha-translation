  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: de
  text: Ihr Schlangen, ihr Otternbrut! Wie wollt ihr dem Gericht der Gehenna[a] entkommen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Gericht der Hölle“. Griechisch: „Gehenna“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: Schlangen
  rationale: Die direkte Anrede bewahrt das scharfe Tierbild in natürlichem, modernem Deutsch.
- source_word: γεννήματα ἐχιδνῶν
  choice: Otternbrut
  rationale: Die idiomatische deutsche Verbindung gibt sowohl das Hervorgebrachtsein als auch die spezifische, bedrohliche Schlangenmetaphorik prägnant wieder.
- source_word: πῶς φύγητε
  choice: Wie wollt ihr … entkommen?
  rationale: Die rhetorische Frage ist zukunftsbezogen und stellt die Aussicht auf ein Entrinnen infrage, ohne sie auf bloße Fähigkeit zu verengen.
- source_word: κρίσεως
  choice: Gericht
  rationale: „Gericht“ bewahrt den breiten forensischen Sinn; „Verdammnis“ oder „Verurteilung“ wäre stärker auslegend.
- source_word: γεέννης
  choice: Gehenna
  rationale: Die Transliteration erhält den besonderen jüdischen und eschatologischen Begriff des griechischen Textes, statt ihn vollständig mit späteren Vorstellungen von „Hölle“ gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von γέεννα
  choice: Gehenna
  alternative: Hölle
  rationale: „Gehenna“ wahrt die quellensprachliche Besonderheit und den historischen Hintergrund. Die geläufige Wiedergabe „Hölle“ wird als verständliche Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges und zugleich scharfes Deutsch. „Otternbrut“ ist eine etablierte, allgemein verständliche Schmähmetapher; die Wiederholung von „ihr“ verstärkt die direkte Anrede und entspricht natürlichem deutschem Sprachrhythmus.
