id: MAT.23.29
reference: Matthew 23:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: de
  text: Wehe euch, ihr Schriftgelehrten und Pharisäer, ihr Heuchler! Denn ihr baut die Gräber der Propheten und schmückt die Grabmäler[a] der Gerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denkmäler. Das griechische Wort kann ein Grabmal oder ein Denkmal bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Wehe euch
  rationale: Bewahrt die prophetische Anklage und Gerichtswarnung in einer geläufigen, würdevollen deutschen Wendung.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Etablierte und sachlich genaue Bezeichnung für die angesprochenen jüdischen Schriftausleger und Gesetzeskundigen.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Im Deutschen etablierte Form des Gruppennamens.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt den Vorwurf religiös-moralischer Verstellung im matthäischen Zusammenhang natürlich und deutlich wieder.
- source_word: ὅτι
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung des Weherufs; nach dem Ausruf klingt „Denn“ im Deutschen natürlicher als ein mit „weil“ angeschlossener Nebensatz.
- source_word: οἰκοδομεῖτε
  choice: ihr baut
  rationale: Gibt das Präsens direkt wieder, ohne die vom Verb nicht geforderte Bedeutung „wieder aufbauen“ einzutragen.
- source_word: τάφους
  choice: Gräber
  rationale: Passt zu errichteten Begräbnisstätten und wahrt die Unterscheidung zum folgenden μνημεῖα.
- source_word: κοσμεῖτε
  choice: schmückt
  rationale: Natürliche moderne Wiedergabe für das ansehnliche Gestalten oder Verzieren.
- source_word: μνημεῖα
  choice: Grabmäler
  rationale: Der Begriff kann Grabstätten oder Gedächtnismale bezeichnen; „Grabmäler“ erhält hier sowohl den sepulkralen als auch den erinnernden Aspekt und unterscheidet sich von τάφους.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Gibt das substantivierte Adjektiv knapp wieder und bewahrt die moralisch-theologische Kategorie des Ausgangstextes.
theological_decisions:
- issue: Bedeutung von δικαίων
  choice: der Gerechten
  alternative: der rechtschaffenen Menschen
  rationale: „Der Gerechten“ wahrt die traditionelle biblische Begrifflichkeit, ohne eine spätere Lehrsystematik in den Vers hineinzulesen.
- issue: Rhetorischer Anschluss von ὅτι
  choice: Neuer Begründungssatz mit „Denn“
  alternative: Komma und „weil“
  rationale: Beides kann die kausale Beziehung ausdrücken. Die gewählte Interpunktion bewahrt die Wucht der direkten Anrede und ergibt zugleich einen vollständigen, natürlichen deutschen Satz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte direkte Anrede mit „ihr“ trägt die Schärfe der prophetischen Anklage. „Grabmäler“ vermeidet eine Einebnung der beiden griechischen Begriffe τάφους und μνημεῖα.
