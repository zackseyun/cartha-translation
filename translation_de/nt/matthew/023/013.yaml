id: MAT.23.13
reference: Matthew 23:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: de
  text: Doch wehe euch, Schriftgelehrte und Pharisäer, ihr Heuchler! Denn ihr verschließt das Himmelreich vor den Menschen[a]. Ihr selbst geht nämlich nicht hinein, und diejenigen, die hineingehen, lasst ihr nicht hinein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Königsherrschaft der Himmel“. Matthäus verwendet diese Wendung regelmäßig.'
    reason: lexical_alternative
  - marker: b
    text: „Diejenigen, die hineingehen“ kann hier auch diejenigen bezeichnen, die hineinzugehen versuchen oder im Begriff sind hineinzugehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: Doch wehe euch
  rationale: „Wehe euch“ bewahrt den Ton prophetischer Gerichtsankündigung; „doch“ gibt die fortführend-kontrastive Funktion von δέ natürlich wieder.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die etablierte und im Evangelienkontext verständliche Bezeichnung für kundige Ausleger und Lehrer der heiligen Schriften.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Die übliche deutsche Wiedergabe des Gruppennamens.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt den Vorwurf religiöser Verstellung im Deutschen klar und traditionsgemäß wieder.
- source_word: κλείετε ... ἔμπροσθεν τῶν ἀνθρώπων
  choice: ihr verschließt den Menschen
  rationale: Diese natürliche deutsche Konstruktion bewahrt das Bild eines versperrten Zugangs und gibt wieder, dass Menschen am Eintreten gehindert werden.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: das Himmelreich
  rationale: „Himmelreich“ ist die geläufige, knappe deutsche Wiedergabe der für Matthäus charakteristischen Wendung; die wörtlichere Form wird in der Fußnote genannt.
- source_word: εἰσέρχεσθε
  choice: geht ... hinein
  rationale: Passt im Deutschen natürlich zum Bild eines versperrten Zugangs, ohne das Reich räumlich oder institutionell näher festzulegen.
- source_word: τοὺς εἰσερχομένους
  choice: diejenigen, die hineingehen
  rationale: Bewahrt möglichst direkt den präsentischen Partizipialausdruck und lässt offen, ob ein bereits begonnener oder ein beabsichtigter Eintritt gemeint ist.
- source_word: ἀφίετε εἰσελθεῖν
  choice: lasst ihr nicht hinein
  rationale: Gibt die Bedeutung „nicht erlauben einzutreten“ idiomatisch wieder; der Zusammenhang macht das Ziel des Hineingehens eindeutig.
theological_decisions:
- issue: Bedeutung von βασιλεία τῶν οὐρανῶν
  choice: Himmelreich
  alternative: Königsherrschaft der Himmel
  rationale: Die geläufige Wendung wird verwendet, ohne daraus einen sachlichen Gegensatz zum „Reich Gottes“ oder eine besondere konfessionelle Reichslehre abzuleiten; die formnähere Alternative bleibt in der Fußnote sichtbar.
- issue: Aspekt und mögliche Zielgerichtetheit von τοὺς εἰσερχομένους
  choice: diejenigen, die hineingehen
  alternative: diejenigen, die hineinzugehen versuchen / hineingehen wollen
  rationale: Der Haupttext hält sich eng an das Präsenspartizip und bewahrt die Spannung, dass gerade Eintretende am Eintreten gehindert werden; die mögliche konative Bedeutung wird nicht stillschweigend festgelegt, sondern in der Fußnote ausgewiesen.
- issue: Generische Bedeutung von τῶν ἀνθρώπων
  choice: den Menschen
  alternative: den Leuten
  rationale: „Menschen“ gibt den generischen, nicht auf Männer beschränkten Bezug sachlich und würdig wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der scharfe prophetische Ton bleiben erhalten. „Ihr selbst“ verdeutlicht den im Griechischen ausdrücklich gesetzten Gegensatz, ohne einen neuen theologischen Gedanken einzuführen.
