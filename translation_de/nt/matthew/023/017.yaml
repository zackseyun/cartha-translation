  - severity: low
    issue: Die Fußnote b führt die quellentreuere Form „geheiligt hat“ nur als Alternative, obwohl der Haupttext das Präsens verwendet.
    rationale: Nach der Korrektur im Haupttext sollte die Fußnote eine tatsächliche lexikalische Alternative bieten und nicht die nunmehrige Haupttextform wiederholen.
