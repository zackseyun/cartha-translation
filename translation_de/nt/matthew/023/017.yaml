source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: de
  text: 'Ihr Narren und Blinden! Was ist denn größer: das Gold oder der Tempel[a], der das Gold geheiligt hat[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann genauer das Tempelheiligtum, also das eigentliche Tempelgebäude, bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „der das Gold heilig gemacht hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ καὶ τυφλοί
  choice: Ihr Narren und Blinden!
  rationale: Die beiden substantivierten Adjektive stehen im Vokativ Plural und bilden eine scharfe direkte Anrede. Die knappe deutsche Form bewahrt Kraft und Parallelität.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Was ist denn größer
  rationale: Bei zwei ausdrücklich genannten Größen ist im Deutschen sowohl „was“ als auch „welches“ möglich; „Was ist denn größer?“ klingt hier natürlich. „denn“ gibt die begründende und argumentativ anschließende Funktion von γάρ idiomatisch wieder.
- source_word: ὁ χρυσὸς
  choice: das Gold
  rationale: Der Artikel bezeichnet das im Zusammenhang gemeinte Gold; die bestimmte Form wird beibehalten.
- source_word: ὁ ναὸς
  choice: der Tempel
  rationale: „Tempel“ ist allgemein verständlich. ναός kann genauer das Tempelheiligtum beziehungsweise das eigentliche Tempelgebäude bezeichnen; dies wird in einer Fußnote vermerkt.
- source_word: ὁ ἁγιάσας
  choice: der … heiligt
  rationale: Das attributive Aoristpartizip beschreibt, wodurch das Gold seinen heiligen Status erhält. Das deutsche Präsens formuliert die im Argument geltende Beziehung natürlich; „heiligt“ bewahrt den kultischen Gehalt.
- source_word: τὸν χρυσόν
  choice: das Gold
  rationale: Die Wiederholung folgt dem griechischen Wortlaut und erhält die rhetorische Gegenüberstellung.
theological_decisions:
- issue: Wiedergabe von ἁγιάζω im kultischen Tempelzusammenhang
  choice: heiligt
  alternative: heilig gemacht hat / geheiligt hat
  rationale: „heiligt“ wahrt den sakralen Sinn und gibt die Beziehung als allgemeingültige Begründung wieder. Die alternative resultative beziehungsweise vergangenheitsbezogene Wiedergabe des griechischen Aoristpartizips bleibt als Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der Schärfe der direkten Zurechtweisung. „Narren“ ist kräftig, aber nicht umgangssprachlich; die kultische Aussage bleibt ohne konfessionelle Zusätze erhalten.
