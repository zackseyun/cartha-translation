  naturalness: „Doppelt so sehr wie ihr selbst“ bleibt ohne ausdrücklichen Bezugsmaßstab und wirkt nach „zu einem Sohn der Gehenna“ syntaktisch unvollständig. Eine leichte Umstellung macht den Vergleich im modernen Standarddeutsch klar, ohne seine bildhafte und offene Aussage aufzulösen.
