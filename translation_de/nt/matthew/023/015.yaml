id: MAT.23.15
reference: Matthew 23:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: de
  text: Wehe euch, Schriftgelehrte und Pharisäer, ihr Heuchler! Denn ihr zieht über Meer und Land, um einen einzigen Proselyten[a] zu gewinnen; und wenn er einer geworden ist, macht ihr ihn zu einem Sohn der Gehenna[b], der doppelt so schlimm ist wie ihr selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Proselyt ist hier ein Mensch, der zum Judentum übergetreten ist.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hölle“. Gehenna bezeichnet ursprünglich das Hinnomtal bei Jerusalem und wurde zur Bezeichnung des endzeitlichen Strafortes.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Wehe
  rationale: Bewahrt den Ton prophetischer Gerichtsankündigung und scharfer Anklage.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die geläufige und sachlich passende deutsche Bezeichnung für die angesprochene jüdische Gelehrtengruppe.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Etablierte deutsche Bezeichnung der jüdischen Gruppierung.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt den Vorwurf religiös-moralischer Verstellung im heutigen Deutsch klar wieder.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: ihr zieht über Meer und Land
  rationale: Gibt die weite, mühevolle Bewegung idiomatisch wieder und erhält die umfassende Paarformel.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: um einen einzigen Proselyten zu gewinnen
  rationale: „Proselyt“ bewahrt die konkrete Bedeutung eines zum Judentum Übergetretenen; „gewinnen“ formuliert das griechische „machen“ in diesem Zusammenhang natürlich, ohne das Ziel des Handelns zu verändern.
- source_word: ὅταν γένηται
  choice: wenn er einer geworden ist
  rationale: Nimmt das zuvor genannte maskuline Singularwort auf und drückt das Zustandekommen des Übertritts aus.
- source_word: υἱὸν γεέννης
  choice: zu einem Sohn der Gehenna
  rationale: Erhält sowohl den semitischen Zugehörigkeitsausdruck „Sohn von“ als auch den im griechischen Text stehenden Begriff Gehenna.
- source_word: διπλότερον ὑμῶν
  choice: doppelt so sehr wie ihr selbst
  rationale: Bewahrt die vergleichende Aussage, ohne näher festzulegen, in welchem messbaren Sinn die Verdoppelung zu verstehen ist.
theological_decisions:
- issue: Wiedergabe von γεέννα
  choice: Gehenna
  alternative: Hölle
  rationale: „Gehenna“ wahrt den jüdischen geschichtlichen und endzeitlichen Hintergrund des griechischen Begriffs; die geläufige, aber stärker verallgemeinernde Wiedergabe „Hölle“ steht in der Fußnote.
- issue: Semitische Wendung υἱὸν γεέννης
  choice: Sohn der Gehenna
  alternative: der Gehenna verfallen / für die Hölle bestimmt
  rationale: Die bildhafte Zugehörigkeitsformel bleibt erhalten, statt ihre genaue theologische Tragweite durch eine erklärende Umschreibung festzulegen.
- issue: Maskuliner Singularbezug nach προσήλυτον
  choice: wenn er einer geworden ist, macht ihr ihn
  alternative: wenn jemand übergetreten ist, macht ihr diesen Menschen
  rationale: Die grammatische Einzelperson des Ausgangstextes wird in natürlichem Deutsch unmittelbar wieder aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anklage bleibt scharf; „Proselyt“, „Sohn der Gehenna“ und „doppelt so sehr“ erhalten bewusst die geschichtliche und bildhafte Eigenart des Ausgangstextes. Beide Fußnotenzeichen stehen an den jeweils erläuterten Ausdrücken.
