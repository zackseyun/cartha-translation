id: MAT.23.23
reference: Matthew 23:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: de
  text: 'Wehe euch, ihr Schriftgelehrten und Pharisäer, ihr Heuchler! Ihr gebt den Zehnten von Minze, Dill und Kümmel, vernachlässigt aber die wichtigeren Dinge des Gesetzes: das Recht, die Barmherzigkeit und die Treue.[a] Dies hättet ihr tun und jenes nicht vernachlässigen sollen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Glauben“. Das griechische Wort kann Glaube, Vertrauen oder Treue bezeichnen; in diesem ethischen Zusammenhang wird es auch als „Treue“ oder „Glaubenstreue“ verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Wehe
  rationale: Bewahrt den prophetischen Klage- und Gerichtsruf; „Ach“ wäre hier zu schwach.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Etablierte und sachlich passende Bezeichnung im Evangelienkontext.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt den hier gemeinten ethischen Vorwurf natürlich und prägnant wieder.
- source_word: ἀποδεκατοῦτε
  choice: gebt den Zehnten von
  rationale: Macht die kultisch-rechtliche Praxis für heutige Leser unmittelbar verständlich.
- source_word: ἡδύοσμον … ἄνηθον … κύμινον
  choice: Minze, Dill und Kümmel
  rationale: Die üblichen modernen deutschen Pflanzennamen.
- source_word: ἀφήκατε
  choice: vernachlässigt
  rationale: Im Kontext bedeutet das Verb, etwas beiseitezulassen beziehungsweise nicht zu erfüllen.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: das Gewichtigere im Gesetz
  rationale: Bewahrt die Metapher des griechischen Komparativs und bezeichnet zugleich die wichtigeren Forderungen.
- source_word: κρίσιν
  choice: das Recht
  rationale: Im ethischen Dreiklang geht es um gerechtes Handeln; „Recht“ ist idiomatisch und weniger missverständlich als „Gericht“.
- source_word: ἔλεος
  choice: die Barmherzigkeit
  rationale: Etablierte biblische Wiedergabe mit dem passenden ethischen und bundestheologischen Bedeutungsfeld.
- source_word: πίστιν
  choice: die Treue
  rationale: Im ethischen Dreiklang und als geforderte Praxis bezeichnet πίστις hier am wahrscheinlichsten Zuverlässigkeit beziehungsweise Treue; die mögliche Wiedergabe „Glaube“ bleibt in der Fußnote sichtbar.
- source_word: ταῦτα … κἀκεῖνα
  choice: Das eine … das andere
  rationale: 'Bewahrt die Verweisstruktur: Die gewichtigeren Forderungen sind zu tun, ohne die Zehntpraxis zu unterlassen.'
theological_decisions:
- issue: Bedeutung von πίστις im ethischen Dreiklang
  choice: Treue
  alternative: Glaube
  rationale: Der unmittelbare Zusammenhang nennt praktische Forderungen des Gesetzes. Daher ist „Treue“ wahrscheinlich gemeint; da πίστις auch „Glaube“ oder „Vertrauen“ bedeuten kann, wird diese echte lexikalische Offenheit nicht verschwiegen.
- issue: Verhältnis der gewichtigeren Gesetzesforderungen zur Zehntpraxis
  choice: Beides bleibt gefordert, jedoch mit erkennbarer Gewichtung
  alternative: Die Zehntpraxis werde verworfen
  rationale: Der abschließende Satz fordert ausdrücklich, das eine zu tun und das andere nicht zu vernachlässigen; die Kritik richtet sich gegen falsche Prioritäten, nicht gegen die erwähnte Zehntpraxis an sich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede mit wiederholtem „ihr“ trägt die Schärfe des Weherufs. „Das Gewichtigere“ erhält das Bild des griechischen Textes, ohne unnötig altertümlich zu klingen.
