  naturalness: Modernes, idiomatisches Standarddeutsch mit angemessen scharfem, prophetischem Register. Die Aufteilung in Anrede und anschließenden Hauptsatz ist natürlich. »Beim Tempel schwören« ist in diesem Kontext die idiomatische deutsche Entsprechung der griechischen Schwurformel.
  terminology: »Tempel«, »Gold des Tempels«, »Eid« und »gebunden« sind konsistent und verständlich. »Blinde Führer« bewahrt die Leitmetapher des griechischen ὁδηγοὶ τυφλοί besser als eine stärker interpretierende Wiedergabe mit »Leiter«. Die Fußnote kennzeichnet sowohl die wörtliche Präposition als auch die Ellipse sachgerecht.
