id: MAT.23.16
reference: Matthew 23:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: de
  text: 'Wehe euch, ihr blinden Führer! Ihr sagt: »Wer beim Tempel schwört, dessen Eid bedeutet nichts; wer aber beim Gold des Tempels schwört, ist daran gebunden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet die Schwurformel »im Tempel« beziehungsweise »im Gold des Tempels«. Gemeint ist hier dem Zusammenhang nach: beim Tempel beziehungsweise bei seinem Gold schwören. Das griechische »es ist nichts« besagt, dass ein solcher Eid als unverbindlich behandelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Wehe euch
  rationale: Bewahrt den prophetischen Gerichts- und Warnruf in einer im Deutschen vertrauten, würdigen Form.
- source_word: ὁδηγοὶ τυφλοί
  choice: ihr blinden Führer
  rationale: 'Gibt die Metapher unmittelbar wieder: Menschen beanspruchen, andere zu führen, sind aber selbst blind.'
- source_word: οἱ λέγοντες
  choice: Ihr sagt
  rationale: Die substantivierte Partizipialkonstruktion wird als natürlicher deutscher Hauptsatz wiedergegeben.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Wer ... schwört
  rationale: Die unbestimmte allgemeine Bedingung wird idiomatisch und präzise ausgedrückt.
- source_word: ἐν τῷ ναῷ / ἐν τῷ χρυσῷ τοῦ ναοῦ
  choice: beim Tempel / beim Gold des Tempels
  rationale: Das deutsche »bei etwas schwören« entspricht hier der Schwurformel; das formal mögliche »im Tempel« würde im Kontext fälschlich vor allem den Ort des Schwörens bezeichnen.
- source_word: οὐδέν ἐστιν
  choice: dessen Eid bedeutet nichts
  rationale: Die knappe Ellipse »es ist nichts« wird für heutige Leser verständlich auf den Eid bezogen, ohne bereits mit »ist nicht bindend« die folgende Gegenüberstellung einzuebnen.
- source_word: ὀφείλει
  choice: ist daran gebunden
  rationale: Das Verb bezeichnet eine bestehende Verpflichtung. »Daran« macht den Bezug auf den Schwur verständlich, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt übermäßig auszubauen.
theological_decisions:
- issue: Kasuische Unterscheidung zwischen angeblich unverbindlichen und bindenden Eiden
  choice: Die erste Aussage wird als »dessen Eid bedeutet nichts«, die zweite als »ist daran gebunden« wiedergegeben.
  alternative: 'Wörtlicher: »es ist nichts ... er schuldet«; stärker deutend: »ist nicht gebunden ... ist an seinen Eid gebunden«.'
  rationale: Die Übersetzung macht die praktische Rechts- und Verpflichtungslogik der Aussage verständlich, bewahrt aber die knappe, leicht elliptische Spannung des griechischen Textes und fügt keine konfessionelle Eidlehre hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Anrede wird für natürliche deutsche Syntax in zwei Sätze gegliedert; die Tempel-Gold-Gegenüberstellung und die Schärfe des Vorwurfs bleiben erhalten.
