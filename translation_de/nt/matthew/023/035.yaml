  naturalness: Der Satz ist insgesamt verständlich und würdig. Nach „damit“ ist jedoch „komme“ als Konjunktiv die klare moderne deutsche Entsprechung des griechischen Konjunktivs ἔλθῃ. Außerdem ist „Sacharja“ die im heutigen deutschen Bibelgebrauch geläufige Namensform; „Secharja“ wirkt ungebräuchlich.
  terminology: „Blut der Gerechten“, „Heiligtum“ und „Altar“ sind präzise und registergerecht. Die Fußnote zur Namensidentität wahrt die offene historische Frage. Die lexikalische Alternative zu γῆ wird idiomatischer als „im Land“ formuliert.
