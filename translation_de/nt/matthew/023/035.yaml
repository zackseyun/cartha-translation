id: MAT.23.35
reference: Matthew 23:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: de
  text: damit über euch all das Blut der Gerechten komme, das auf der Erde vergossen wird[a], vom Blut Abels, des Gerechten, bis zum Blut Sacharjas, des Sohnes Berechjas[b], den ihr zwischen dem Heiligtum und dem Altar ermordet habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Land“. Das griechische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die Identität „Sacharjas, des Sohnes Berechjas“ ist umstritten. Manche bringen ihn mit dem Propheten Sacharja in Verbindung, andere mit Sacharja, dem Sohn Jojadas (2. Chronik 24,20–22). Die Übersetzung folgt dem griechischen Text in seiner vorliegenden Form.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die Folge der vorangehenden Anklage ein und bewahrt die finale beziehungsweise konsekutive Offenheit.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: über euch … kommt
  rationale: Gibt ἐπί mit Akkusativ und den gerichtlichen Gedanken wieder, dass Blutschuld über die Angesprochenen kommt; die deutsche Wortstellung bleibt natürlich.
- source_word: πᾶν αἷμα δίκαιον
  choice: all das Blut der Gerechten
  rationale: Das Adjektiv bezeichnet metonymisch das Blut gerechter Menschen. Der Genitiv ist im Deutschen verständlicher und natürlicher als eine wörtliche Formulierung wie „alles gerechte Blut“.
- source_word: ἐκχυννόμενον
  choice: das … vergossen wird
  rationale: Bewahrt das Präsens Passiv des Partizips durch einen Relativsatz und verwendet die im Deutschen übliche Wendung für gewaltsames Blutvergießen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Der umfassende Rückblick von Abel an spricht hier eher für „Erde“; die engere Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: vom Blut Abels, des Gerechten
  rationale: Bewahrt die Genitivkonstruktion und gibt δίκαιος als hervorgehobene Bezeichnung Abels wieder.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: bis zum Blut Secharjas, des Sohnes Berechjas
  rationale: Gibt die Spannweite ἀπό … ἕως direkt wieder und verwendet die geläufigen deutschen Namensformen.
- source_word: ὃν ἐφονεύσατε
  choice: den ihr … ermordet habt
  rationale: φονεύω bezeichnet schuldhaftes Töten und trägt hier eine deutliche moralische Anklage; „ermordet“ bewahrt diese Schärfe.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: zwischen dem Heiligtum und dem Altar
  rationale: ναός meint genauer das Heiligtum beziehungsweise Tempelgebäude und nicht den gesamten Tempelbezirk; θυσιαστήριον bedeutet „Altar“.
theological_decisions:
- issue: Identität Secharjas, des Sohnes Berechjas
  choice: Die Namensangabe des griechischen Textes wird unverändert übersetzt.
  alternative: Identifikation mit dem Propheten Secharja, dem Sohn Berechjas, oder mit Secharja, dem Sohn Jojadas, aus 2. Chronik 24,20–22.
  rationale: Die Übersetzung soll die historische Schwierigkeit nicht durch Harmonisierung oder Textänderung beseitigen. Die umstrittene Identität wird deshalb in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtum“ unterscheidet den ναός vom gesamten Tempelbezirk. Die Formulierung „das … vergossen wird“ erhält den fortlaufenden beziehungsweise allgemein charakterisierenden Aspekt des griechischen Präsenspartizips, ohne unnatürlich zu klingen.
