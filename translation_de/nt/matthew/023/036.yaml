  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: de
  text: 'Amen, ich sage euch: Dies alles wird über diese Generation[a] kommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Diese Generation“ wird teils auch im Sinn von „diese Menschen“ oder einer umfassender verstandenen ungläubigen Generation verstanden; am unmittelbarsten lautet der griechische Ausdruck jedoch „diese Generation“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige „Amen“ bewahrt die feierliche Bekräftigungsformel Jesu und gibt das einzelne ἀμήν unmittelbar wieder.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung entspricht dem griechischen Präsens mit Dativpronomen und erhält den feierlichen Klang der Aussageformel.
- source_word: ἥξει
  choice: wird … kommen
  rationale: Das Futur von ἥκω bezeichnet hier das Eintreffen der zuvor angekündigten Folgen; zusammen mit „über“ ist „kommen“ im Deutschen idiomatisch.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: Die natürliche deutsche Sammelformulierung gibt den gesamten Rückbezug des griechischen Neutrum Plural wieder, ohne ihn auf einen einzelnen Vorgang einzuengen.
- source_word: ἐπὶ
  choice: über
  rationale: Mit dem Bewegungsverb und Akkusativ bezeichnet ἐπί hier, dass die angekündigten Folgen die genannte Generation treffen. „Über … kommen“ wahrt den ernsten, gerichtlichen Ton.
- source_word: γενεὰν ταύτην
  choice: diese Generation
  rationale: „Generation“ ist die unmittelbarste Wiedergabe von γενεά und lässt die umstrittene Reichweite des Ausdrucks bewusst offen.
theological_decisions:
- issue: Bezug von „diese Generation“ (γενεὰν ταύτην)
  choice: „diese Generation“ ohne interpretierende Erweiterung
  alternative: „diese Menschen“, das jüdische Volk über die Zeiten hinweg oder das gegenwärtige Zeitalter
  rationale: Der griechische Wortlaut bezeichnet am unmittelbarsten eine Generation. Die Übersetzung entscheidet nicht zwischen weiter gefassten eschatologischen Deutungen, sondern bewahrt die zeitliche Aussage und ihre Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Einleitungsformel „Amen, ich sage euch“ ist verständlich und bewahrt die feierliche Autorität des Ausspruchs. Der Fußnotenmarker steht unmittelbar nach dem auslegungsbedürftigen Satzteil beziehungsweise Satz.
