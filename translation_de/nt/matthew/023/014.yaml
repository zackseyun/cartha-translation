base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: de
  text: Wehe[a] euch, Schriftgelehrte und Pharisäer, ihr Heuchler! Denn ihr verschlingt die Häuser der Witwen und sprecht zum Schein lange Gebete. Darum werdet ihr umso strenger verurteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er ist jedoch in der byzantinischen Mehrheitstradition, in der altlateinischen Überlieferung, der Vulgata und der syrischen Überlieferung bezeugt. Vermutlich wurde er später zur Angleichung an Markus 12,40 und Lukas 20,47 eingefügt. Handschriften, die ihn enthalten, ordnen ihn teils vor, teils nach Vers 13 ein.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: ihr bringt Witwen um Haus und Hof
  rationale: Die bildhafte Wendung bedeutet, dass die Betroffenen rücksichtslos ausgebeutet und ihres Besitzes beraubt werden. Die deutsche Redewendung gibt diesen Sinn natürlich und eindringlich wieder, ohne ein buchstäbliches Essen von Häusern nahezulegen.
- source_word: προφάσει
  choice: zum Schein
  rationale: Bezeichnet einen vorgeschobenen religiösen Anschein, der die eigentlichen unlauteren Absichten verdeckt.
- source_word: μακρὰ προσευχόμενοι
  choice: sprecht ... lange Gebete
  rationale: Gibt das Partizip natürlich wieder und bewahrt die Betonung der auffälligen Länge der Gebete.
- source_word: περισσότερον κρίμα
  choice: umso strenger verurteilt
  rationale: Im Zusammenhang bezeichnet κρίμα ein negatives Gerichtsurteil; περισσότερον zeigt dessen gesteigerte Schwere an. Die Formulierung ist im modernen Deutsch klarer als das wörtliche »ein größeres Urteil empfangen«.
theological_decisions:
- issue: Art und Ausmaß des angekündigten Gerichts
  choice: umso strenger verurteilt werden
  alternative: ein härteres Gericht empfangen
  rationale: Die Übersetzung hält fest, dass eine gesteigerte Verurteilung angekündigt wird, legt aber weder deren genaue Gestalt noch ein ausgearbeitetes Modell abgestufter Strafen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wehe euch« bewahrt den feierlich-prophetischen Gerichtsruf. »Ihr Heuchler« ist als direkte Apposition idiomatisch ergänzt. Die Redewendung »um Haus und Hof bringen« vermittelt die wirtschaftliche Ausbeutung verständlich und kraftvoll.
