  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch mit bewusst biblisch-prophetischem Klang. »Die Häuser der Witwen verschlingen« ist als Bild für rücksichtslose Ausbeutung verständlich und näher am Ausgangstext als die idiomatische, aber erweiternde Redewendung der Vorlage.
  terminology: »Schriftgelehrte«, »Pharisäer«, »Heuchler«, »Wehe« und »verurteilt werden« sind angemessen. Der textkritische Hinweis bleibt inhaltlich dem englischen Audit Trail entsprechend; der Anker wird an den Beginn des gesamten textkritisch unsicheren Verses gesetzt.
