source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: de
  text: 'Und ihr sagt: »Hätten wir in den Tagen unserer Väter gelebt, hätten wir nicht mit ihnen Anteil[a] am Blut der Propheten gehabt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann gemeinsame Teilhabe oder Beteiligung bis hin zu Mitschuld bezeichnen. Gemeint ist die Beteiligung an der Tötung der Propheten und damit an ihrer Blutschuld.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: ihr sagt
  rationale: Das Präsens in der zweiten Person Plural wird als unmittelbare Anrede wiedergegeben; das einfache deutsche Präsens entspricht dem Zusammenhang.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Hätten wir in den Tagen … gelebt
  rationale: Die irreale Bedingung der Vergangenheit wird im Deutschen idiomatisch mit Konjunktiv II der Vorvergangenheit ausgedrückt. »gelebt« verdeutlicht den zeitlichen Aufenthalt, ohne den Sinn zu erweitern.
- source_word: τῶν πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Die konkrete Bezeichnung πατέρων bleibt erhalten; sie bezeichnet hier die Vorväter der Angeredeten. »Väter« wahrt zugleich den biblischen Sprachklang und ist verständlich.
- source_word: οὐκ ἂν ἤμεθα
  choice: wären wir nicht … gewesen
  rationale: οὐκ ἄν mit dem Imperfekt bildet den irrealen Folgesatz; der deutsche Konjunktiv II der Vorvergangenheit gibt den vergangenen, nicht eingetretenen Fall angemessen wieder.
- source_word: αὐτῶν κοινωνοὶ
  choice: mit ihnen … beteiligt
  rationale: κοινωνοί bezeichnet gemeinschaftliche Beteiligung und kann im Kontext Mitschuld einschließen. Die Formulierung ist im Deutschen natürlich und bewahrt die mögliche Spannweite, ohne ausdrücklich »Komplizen« zu sagen.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: am Blut der Propheten
  rationale: Die konkrete Metapher des Blutes bleibt erhalten. Im Kontext geht es um Beteiligung an der Tötung beziehungsweise an der daraus entstehenden Blutschuld; dies wird nicht paraphrasierend in den Haupttext eingetragen.
theological_decisions:
- issue: Grad der durch κοινωνοὶ ἐν τῷ αἵματι bezeichneten Mitschuld
  choice: »mit ihnen am Blut der Propheten beteiligt«
  alternative: »ihre Komplizen bei der Ermordung der Propheten« oder »mit ihnen an der Blutschuld gegenüber den Propheten beteiligt«
  rationale: Die gewählte Fassung bewahrt sowohl den Gedanken gemeinsamer Beteiligung als auch das konkrete Bild des Blutes. Sie lässt offen, ob der Akzent stärker auf der Tatbeteiligung oder auf der geteilten Blutschuld liegt, statt die Aussage auf eine einzige Deutung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht biblischem Klang. Die irreale Vergangenheit wird idiomatisch wiedergegeben; die Blutmetapher des griechischen Textes bleibt bewusst erhalten.
