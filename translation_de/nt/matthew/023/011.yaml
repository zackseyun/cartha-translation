review_pass:
  verdict: revise
  source_fidelity: Der Größte unter euch gibt den idiomatisch superlativischen Sinn von μείζων im Kontext treffend wieder; Diener ist für διάκονος ohne Amtsassoziation passend. Das griechische Futur ἔσται ist jedoch indikativisch und wird am unmittelbarsten mit „wird ... sein“ wiedergegeben. „Soll ... sein“ verstärkt den normativen Unterton zu einer im griechischen Wortlaut nicht ausgedrückten Sollensform.
  naturalness: „Der Größte unter euch aber wird euer Diener sein“ ist modernes, prägnantes und würdiges Standarddeutsch. Die Stellung von „aber“ ist natürlich.
  terminology: „Diener“ bewahrt die nichttechnische Bedeutung von διάκονος und vermeidet die hier unpassende kirchenamtliche Lesart von „Diakon“. „Der Größte“ ist im gegebenen Rangkontext eine idiomatische Wiedergabe des griechischen Komparativs.
  issues:
  - severity: medium
    issue: Futur mit „soll ... sein“ wiedergegeben
    rationale: ἔσται ist ein Futur Indikativ („wird sein“). Zwar hat der Lehrspruch einen ethischen Anspruch, doch „soll“ formuliert im Deutschen ausdrücklich eine Verpflichtung und verschiebt damit die grammatische Aussage. Die Zukunftsform lässt den kontextuellen Aufforderungscharakter bestehen, ohne ihn zu kodieren.
  - severity: low
    issue: Fußnote folgt bei ἔσται der Hauptübersetzung nicht
    rationale: Die alternative, vergleichende Wiedergabe sollte ebenfalls „wird“ statt „wird“? Die vorliegende Fußnote hat bereits „wird“, während der Haupttext „soll“ hat. Nach der Korrektur ist die Fußnote konsistent; außerdem ist „wörtlicher“ besser als „wörtlich“ zu formulieren.
  revised_text: Der Größte unter euch aber wird euer Diener sein.[a]
