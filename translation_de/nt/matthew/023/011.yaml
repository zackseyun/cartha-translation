  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: de
  text: Der Größte unter euch aber wird euer Diener sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: »Der Größere von euch wird euer Diener sein.« Der griechische Komparativ kann hier sinngemäß den Größten innerhalb der Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: der Größte
  rationale: Der Komparativ kann hier idiomatisch den Höchstrangigen innerhalb der angesprochenen Gruppe bezeichnen. „Der Größte“ ist im Deutschen natürlich und bewahrt den Bezug auf Rang und Ansehen.
- source_word: ὑμῶν (erstes Vorkommen)
  choice: unter euch
  rationale: 'Der Genitiv ist partitiv: Gemeint ist derjenige, der innerhalb der angesprochenen Gruppe als der Größte gilt.'
- source_word: ἔσται
  choice: soll … sein
  rationale: Das griechische Futur formuliert in diesem lehrhaften Zusammenhang nicht nur eine Vorhersage, sondern eine maßgebliche Umkehrung menschlicher Rangvorstellungen. „Soll … sein“ gibt diesen normativen Klang im Deutschen natürlich wieder, ohne einen ausdrücklichen Imperativ einzuführen.
- source_word: ὑμῶν (zweites Vorkommen)
  choice: euer
  rationale: Mit διάκονος ist der Genitiv relational beziehungsweise possessiv und wird idiomatisch mit „euer Diener“ wiedergegeben.
- source_word: διάκονος
  choice: Diener
  rationale: Das Wort bezeichnet hier jemanden, der anderen dient, nicht ein später ausgestaltetes kirchliches Amt. „Diener“ wahrt die soziale Umkehrung und vermeidet die amtssprachlichen Assoziationen von „Diakon“.
- source_word: δὲ
  choice: aber
  rationale: δέ setzt die Aussage in einen Kontrast zum Streben nach Rang und Titeln im vorausgehenden Zusammenhang. Die Nachstellung von „aber“ ist idiomatisches Deutsch.
theological_decisions:
- issue: Rang und Dienen in Jesu Lehre
  choice: „Der Größte unter euch aber soll euer Diener sein.“
  alternative: „Der Größere von euch wird euer Diener sein.“
  rationale: 'Die Übersetzung gibt die Umkehrung von Rangvorstellungen wieder: Größe zeigt sich im Dienst. Sie vermeidet zugleich, διάκονος als technisches Kirchenamt zu verstehen.'
translation_notes:
  register: Modernes, allgemein verständliches und würdevolles Standarddeutsch. „Diener“ ist bewusst nicht kirchenamtlich; die prägnante Satzform bewahrt den Charakter eines Lehrspruchs.
