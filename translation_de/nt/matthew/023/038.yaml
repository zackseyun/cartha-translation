  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: de
  text: Seht, euer Haus[a] wird euch verödet überlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euer Tempel«; mit »euer Haus« kann besonders der Tempel gemeint sein, doch der griechische Ausdruck ist weiter gefasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Seht
  rationale: Das gegenwärtige deutsche Aufmerksamkeitssignal bewahrt den feierlichen Ankündigungscharakter, ohne auf das altertümlicher wirkende »Siehe« zurückzugreifen.
- source_word: ἀφίεται
  choice: wird … überlassen
  rationale: Die passive Form bleibt erhalten. »Überlassen« gibt zusammen mit dem Dativ ὑμῖν wieder, dass das Haus ihnen in seinem Zustand verbleibt, ohne die handelnde Person ausdrücklich zu benennen.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ wird unmittelbar wiedergegeben und bewahrt die Spannung, dass ihnen ihr Haus im angekündigten Zustand überlassen wird.
- source_word: ὁ οἶκος ὑμῶν
  choice: euer Haus
  rationale: Die wörtliche und bewusst weite Bildsprache bleibt bestehen; der mögliche Bezug auf Tempel, Jerusalem oder das Gemeinwesen wird im Haupttext nicht eingeengt.
- source_word: ἔρημος
  choice: verödet
  rationale: »Verödet« vermittelt Verlassenheit und Verwüstung im prophetischen Gerichtskontext, ohne ausschließlich räumliche Leere auszudrücken.
theological_decisions:
- issue: Bezugsgröße von »euer Haus«
  choice: Die offene Formulierung »euer Haus« bleibt im Haupttext erhalten.
  alternative: »euer Tempel«, »Jerusalem« oder »das Haus Israel«
  rationale: Der Zusammenhang weist besonders auf Jerusalem und den Tempel, doch der griechische Ausdruck ist weiter. Die Übersetzung bewahrt daher die metaphorische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Seht« ist unmittelbar verständlich; »verödet überlassen« bewahrt den prophetischen Ton sowie Passiv, Dativ und Zustandsangabe des griechischen Satzes.
