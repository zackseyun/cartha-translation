  source_fidelity: Die Übersetzung gibt ἰδοὺ als feierlichen, zugleich modernen Aufmerksamkeitsruf wieder. Das Präsenspassiv ἀφίεται sowie der Dativ ὑμῖν sind in „wird euch … überlassen“ sachgerecht abgebildet. „verödet“ trifft ἔρημος im prophetischen Gerichtskontext, ohne den offenen Ausdruck weitergehend zu deuten.
  naturalness: „Seht, euer Haus wird euch verödet überlassen“ ist verständliches modernes Standarddeutsch und wahrt einen würdevoll-prophetischen Ton. Die Stellung von „euch“ und „verödet“ ist leicht gehoben, aber für die Rede Jesu angemessen und gut lesbar.
  terminology: „Haus“ bewahrt die bewusst nicht näher bestimmte Bildsprache von ὁ οἶκος ὑμῶν. Die Fußnote nennt den naheliegenden Tempelbezug ausdrücklich nur als Möglichkeit und engt den Haupttext daher nicht auslegungsgebunden ein.
