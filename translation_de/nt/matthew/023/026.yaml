  variant: modern standard German
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: de
  text: Du blinder Pharisäer, reinige zuerst das Innere des Bechers und der Schüssel[a][b], damit auch das Äußere des Bechers rein wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Form des Serviergefäßes auch mit „Teller“, „Schale“ oder „Platte“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Die Worte „und der Schüssel“ sind im griechischen Text textkritisch unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Du blinder Pharisäer
  rationale: Die beiden Vokative bilden eine direkte, scharfe Anrede. Das ergänzte „Du“ macht den Vokativ im modernen Deutschen natürlich, ohne den Inhalt auszuweiten.
- source_word: καθάρισον
  choice: reinige
  rationale: Der Aoristimperativ fordert zu einer entschiedenen Handlung auf. „Reinige“ wahrt sowohl das konkrete Gefäßbild als auch dessen moralische Tragweite.
- source_word: πρῶτον
  choice: zuerst
  rationale: Bezeichnet die sachliche und zeitliche Priorität der inneren Reinigung.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: das Innere des Bechers
  rationale: Gibt das substantivierte ἐντός und das konkrete Trinkgefäß präzise und idiomatisch wieder.
- source_word: καὶ τῆς παροψίδος
  choice: und der Schüssel
  rationale: παροψίς bezeichnet ein Gefäß zum Auftragen oder Servieren von Speisen; „Schüssel“ ist im Deutschen breit verständlich, ohne die genaue Form des Gefäßes festzulegen.
- source_word: ἵνα γένηται
  choice: damit … rein wird
  rationale: Die Konstruktion bewahrt Ziel beziehungsweise Folge; „wird“ gibt den resultativen Sinn von γίνομαι natürlicher wieder als ein bloßes „ist“.
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ
  choice: auch das Äußere davon
  rationale: „Auch“ bildet das adverbiale καί ab. „Das Äußere davon“ erhält die Parallelität zu „das Innere“ und lässt die ungewöhnliche singularische Rückverweisung des griechischen αὐτοῦ bestehen, ohne sie künstlich aufzulösen.
- source_word: καθαρόν
  choice: rein
  rationale: „Rein“ passt zur konkreten Reinigung der Gefäße und lässt zugleich die moralische Bedeutung des Bildes offen.
theological_decisions:
- issue: Konkretes Gefäßbild oder ausdrückliche moralische Deutung
  choice: Das Bild von der Reinigung der Innen- und Außenseite bleibt im Haupttext konkret stehen.
  alternative: Eine ausdeutende Wiedergabe wie „Reinige zuerst dein Inneres, damit auch dein äußeres Leben rein wird“.
  rationale: Der griechische Text nennt die moralische Entsprechung nicht ausdrücklich. Eine Auflösung der Metapher würde ihre rhetorische Spannung mindern und mehr sagen als die Vorlage.
- issue: Bezug des singularischen αὐτοῦ nach zwei Gefäßbezeichnungen
  choice: Mit „davon“ wird die Rückverweisung bewahrt, ohne sie eindeutig nur dem Becher oder nur der Schüssel zuzuordnen.
  alternative: „seine Außenseite“ oder die ausdrückliche Wiederholung „die Außenseite des Bechers“.
  rationale: Die griechische Form ist singularisch und kann grammatisch besonders auf ποτήριον zurückweisen, steht aber nach der koordinierten Nennung von Becher und Schüssel. Die Übersetzung soll diese Spannung nicht stillschweigend beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt scharf, die konkrete Bildsprache verständlich und die syntaktische Spannung der Vorlage so weit wie im Deutschen möglich erhalten.
