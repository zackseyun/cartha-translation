  terminology: „Pharisäer“, „reinige“, „Becher“, „Schüssel“ und „rein“ sind sachgerecht. Die lexikalische Anmerkung zu παροψίς ist sinnvoll; „Schüssel“ bleibt als nicht überpräzisierende Hauptwiedergabe angemessen.
