  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: de
  text: 'Lasst euch auch nicht Lehrer nennen; denn nur einer ist euer Lehrer: der Messias[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Christus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: auch nicht
  rationale: Das anschließende Verbot wird mit dem vorausgehenden Zusammenhang verbunden, ohne den Einzelvers unnatürlich mit „Und“ beginnen zu lassen.
- source_word: κληθῆτε
  choice: lasst euch … nennen
  rationale: Die idiomatische deutsche Passivumschreibung bezeichnet das Tragen beziehungsweise Empfangen eines Titels.
- source_word: καθηγηταί / καθηγητής
  choice: Wegweiser
  rationale: Das Wort bezeichnet hier eine leitende und unterweisende Autorität. „Wegweiser“ wahrt die Abgrenzung zu διδάσκαλος („Lehrer“) im nahen Kontext und funktioniert sowohl im Plural als auch im Singular.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein.
- source_word: ὑμῶν ἐστιν εἷς
  choice: nur einer ist euer
  rationale: Diese Wortstellung gibt die Ausschließlichkeit von εἷς in natürlichem Deutsch wieder und bewahrt zugleich die possessive Konstruktion.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Der Artikel kennzeichnet Χριστός hier deutlich als Titel; „Messias“ vermittelt dessen jüdisch-messianischen Gehalt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Χριστός steht mit Artikel und fungiert als Titel. „Messias“ übersetzt diesen Titel, während „Christus“ als traditionelle Wiedergabe in der Fußnote erhalten bleibt.
- issue: Ausschließlichkeit des einen καθηγητής
  choice: nur einer ist euer Wegweiser
  alternative: euer Wegweiser ist einer
  rationale: „Nur einer“ macht die im Kontext gemeinte Einzigkeit idiomatisch sichtbar, ohne die Aussage über die Art dieser Autorität weiter auszudeuten.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Doppelpunkt stellt die Apposition „der Messias“ klar heraus; „Wegweiser“ vermeidet eine Vermischung mit „Lehrer“ im unmittelbaren Kontext.
