    issue: „Wegweiser“ für καθηγητής
    rationale: καθηγητής kann einen Führenden, Leiter oder Unterweisenden bezeichnen. „Wegweiser“ verschiebt dies im heutigen Deutsch zu einer bloß orientierenden bzw. metaphorischen Funktion und klingt nicht wie eine beanspruchte Anrede oder Amtsbezeichnung. „Lehrer“ trifft die lehrende Autorität und ist im Satz idiomatisch.
  revised_text: 'Lasst euch auch nicht Lehrer nennen; denn nur einer ist euer Lehrer: der Messias[a].'
