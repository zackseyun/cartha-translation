id: MAT.23.3
reference: Matthew 23:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: de
  text: Darum tut und befolgt alles, was sie euch sagen. Handelt aber nicht nach ihren Taten[a]; denn sie sagen es zwar, tun es aber nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Tut aber nicht, was sie tun.'
    reason: Natürlichere Wiedergabe des mit κατά ausgedrückten Handelns nach dem Vorbild ihrer Taten.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Darum … alles, was
  rationale: οὖν wird als Folgerung mit „Darum“ wiedergegeben. πάντα in Verbindung mit ὅσα ἐὰν hat umfassenden Sinn; „alles, was“ ist dafür die natürliche deutsche Form.
- source_word: εἴπωσιν ὑμῖν
  choice: sie euch sagen
  rationale: Die schlichte Bedeutung von λέγω bleibt erhalten; „sagen“ vermeidet die stärkere Deutung „lehren“ oder „anweisen“.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: tut und befolgt
  rationale: „Tut“ gibt ποιέω direkt wieder. „Befolgt“ bringt bei τηρέω den Sinn von beachten und einhalten idiomatisch zum Ausdruck und hält beide Aufforderungen unterscheidbar.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: Handelt aber nicht nach ihren Taten
  rationale: κατά bezeichnet hier den Maßstab, an dem sich das Handeln ausrichtet. „Taten“ gibt ἔργα in diesem ethischen Zusammenhang natürlich wieder; „handelt“ bewahrt den Bezug zu ποιέω, ohne im Deutschen die schwer verständliche Formulierung „tut nicht nach ihren Taten“ zu erzeugen.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: denn sie sagen es zwar, tun es aber nicht
  rationale: Die zugespitzte Gegenüberstellung von Reden und Tun sowie die Wiederaufnahme von ποιέω durch „tun“ bleiben erhalten. Das im Deutschen nötige „es“ bezeichnet keinen neu eingeführten Inhalt, sondern nimmt das Gesagte auf.
theological_decisions:
- issue: Ob die im Zusammenhang vorausgesetzte Lehrautorität der Schriftgelehrten und Pharisäer ausdrücklich genannt werden soll
  choice: 'Der Gegenstand bleibt wie im Vers selbst unausgeführt: „alles, was sie euch sagen“.'
  alternative: „alles, was sie euch lehren“ oder „alles, was sie euch vom Stuhl des Mose aus sagen“
  rationale: Der vorherige Vers klärt den Bezug, doch Vers 3 wiederholt ihn nicht. Eine Erweiterung würde Erklärung in den übersetzten Text eintragen.
- issue: Ob die wiederholten Verben des Tuns stilistisch geglättet werden sollen
  choice: 'Die Wiederholung wird soweit idiomatisch möglich bewahrt: „tut … Handelt … tun“.'
  alternative: Stärker variieren, etwa „befolgt … ahmt sie nicht nach … setzen es nicht in die Tat um“
  rationale: Die Wiederholung von ποιέω trägt die Kritik an der Diskrepanz zwischen Wort und Tat. Vollständige formale Gleichheit wäre im Deutschen unnatürlich, doch die rhetorische Verbindung soll erkennbar bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die kurzen Hauptsätze bewahren die zugespitzte Gegenüberstellung. „Befolgt“ ist bewusst idiomatischer als das hier missverständliche „haltet“; „Taten“ klingt im heutigen Deutsch natürlicher als „Werke“.
