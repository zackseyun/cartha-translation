id: MAT.23.27
reference: Matthew 23:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: de
  text: 'Wehe euch, ihr Schriftgelehrten und Pharisäer, ihr Heuchler! Denn ihr gleicht weiß getünchten Gräbern[a]: Von außen sehen sie schön aus, innen aber sind sie voll von Knochen von Toten und aller Unreinheit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Kalk übertünchten Grabstätten“.'
    reason: lexical_alternative
  - marker: b
    text: „Unreinheit“ kann hier sowohl kultische Verunreinigung als auch moralische Verdorbenheit umfassen.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Wehe
  rationale: Bewahrt den prophetischen Klage- und Gerichtsruf sowie die Schärfe der Anklage.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die geläufige und sachlich genaue deutsche Bezeichnung für diese jüdischen Gesetzes- und Schriftausleger.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Etablierte deutsche Form des Gruppennamens.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt hier die angeprangerte religiös-moralische Verstellung klar und idiomatisch wieder.
- source_word: παρομοιάζετε
  choice: ihr gleicht
  rationale: Drückt den direkten Vergleich natürlich aus, ohne die Aussage unnötig passiv zu formulieren.
- source_word: τάφοις κεκονιαμένοις
  choice: weiß getünchten Gräbern
  rationale: κονιάω bezeichnet das Bestreichen mit Kalk; „weiß getüncht“ bewahrt das konkrete Bild. „Gräber“ ist im Deutschen die natürliche Bezeichnung und kann hier auch angelegte Grabstätten umfassen.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: Von außen ... innen aber
  rationale: Bewahrt den pointierten Gegensatz zwischen äußerem Anschein und innerer Wirklichkeit in natürlichem Deutsch.
- source_word: φαίνονται ὡραῖοι
  choice: sehen sie schön aus
  rationale: Gibt sowohl die sichtbare Erscheinung als auch den bloßen Anschein idiomatisch wieder.
- source_word: γέμουσιν
  choice: sind sie voll von
  rationale: Natürliche deutsche Wiedergabe des Zustands des Vollseins.
- source_word: ὀστέων νεκρῶν
  choice: Totengebeinen
  rationale: Eine prägnante, würdige und etablierte deutsche Wiedergabe für die Gebeine Verstorbener.
- source_word: πάσης ἀκαθαρσίας
  choice: aller Unreinheit
  rationale: Lässt den umfassenden Charakter von πάσης und die semantische Breite von ἀκαθαρσία bestehen.
theological_decisions:
- issue: Bedeutungsumfang von ἀκαθαρσία im Grabvergleich
  choice: „Unreinheit“ als weiter Begriff
  alternative: ausschließlich „rituelle Unreinheit“ oder ausschließlich „moralische Verderbtheit“
  rationale: Gräber rufen im jüdischen Kontext kultische Verunreinigung hervor, während die Anklage zugleich auf innere moralische Verdorbenheit zielt. Die breite Wiedergabe wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Anrede mit „ihr“ macht die scharfe direkte Anklage natürlich hörbar. „Totengebeine“ bewahrt einen gehobenen, aber allgemein verständlichen biblischen Ton.
