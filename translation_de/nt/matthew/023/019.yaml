id: MAT.23.19
reference: Matthew 23:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: de
  text: 'Ihr Blinden! Was ist denn größer: die Opfergabe oder der Altar, der die Opfergabe heiligt?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: Ihr Blinden!
  rationale: Das substantivierte Adjektiv im Vokativ Plural wird als unmittelbare, scharfe Anrede wiedergegeben. „Ihr Blinden“ ist im Deutschen natürlich und fügt nicht das in Vers 17 ausdrücklich vorhandene „Narren“ hinzu.
- source_word: τί γὰρ μεῖζον
  choice: Was ist denn größer
  rationale: τί leitet die vergleichende Frage ein; γάρ knüpft begründend an den vorausgehenden Gedankengang an und wird idiomatisch mit „denn“ wiedergegeben. „Größer“ bewahrt den Vergleich von μεῖζον, ohne ihn als bloß „wichtiger“ auszulegen.
- source_word: τὸ δῶρον
  choice: die Opfergabe
  rationale: δῶρον bedeutet grundsätzlich „Gabe“, bezeichnet hier im Tempelzusammenhang jedoch eine auf dem Altar dargebrachte Gabe. „Opfergabe“ macht diesen kultischen Bezug im modernen Deutschen klar, ohne eine bestimmte Opferart festzulegen.
- source_word: θυσιαστήριον
  choice: der Altar
  rationale: „Altar“ ist die etablierte und genaue deutsche Entsprechung für θυσιαστήριον im kultischen Kontext.
- source_word: τὸ ἁγιάζον
  choice: der … heiligt
  rationale: Das substantivbezogene Präsenspartizip wird als Relativsatz wiedergegeben. „Heiligt“ bewahrt die kultische und theologische Aussage, dass der Altar der Gabe Heiligkeit verleiht.
theological_decisions:
- issue: Kultische Bedeutung von ἁγιάζω im Verhältnis von Altar und Gabe
  choice: der die Opfergabe heiligt
  alternative: der die Opfergabe heilig macht / weiht
  rationale: 'Die Formulierung erhält die Tempel- und Heiligkeitslogik des Arguments: Nicht die Gabe verleiht dem Altar Bedeutung, sondern der Altar heiligt die Gabe. „Heiligt“ gibt diese Aussage knapp wieder, ohne sie rein zeremoniell abzuschwächen.'
translation_notes:
  register: Moderne, würdige Standardsprache. Die scharfe direkte Anrede bleibt erhalten; die rhetorische Frage klingt natürlich und bewahrt zugleich die Vergleichsstruktur des Griechischen. Es sind keine Fußnoten nötig.
