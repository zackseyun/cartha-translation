id: MAT.23.25
reference: Matthew 23:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: de
  text: Wehe euch, Schriftgelehrte und Pharisäer, ihr Heuchler! Denn ihr reinigt das Äußere des Bechers und der Schüssel; innen aber sind sie voller Gier und Maßlosigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „voller Raub oder Erpressung und Unbeherrschtheit“. Die griechischen Wörter können ausbeuterisches An-sich-Reißen und fehlende Selbstkontrolle stärker hervorheben.'
    reason: Lexikalische Bedeutungsbreite von ἁρπαγή und ἀκρασία.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Wehe
  rationale: Bewahrt den Charakter eines prophetischen Wehrufs und einer scharfen Anklage.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die etablierte und im Evangelienkontext verständliche Bezeichnung für fachkundige Ausleger der heiligen Schriften und des Gesetzes.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Übliche deutsche Wiedergabe des Gruppennamens.
- source_word: ὑποκριταί
  choice: Heuchler
  rationale: Gibt den Vorwurf religiös-moralischer Verstellung prägnant und idiomatisch wieder.
- source_word: καθαρίζετε
  choice: reinigt
  rationale: Entspricht dem aktiven Präsens und passt sowohl zum tatsächlichen Reinigen von Gefäßen als auch zur Reinheitsmetaphorik.
- source_word: τὸ ἔξωθεν
  choice: das Äußere
  rationale: Erhält den ausdrücklichen Gegensatz zwischen außen und innen.
- source_word: ποτηρίου
  choice: Becher
  rationale: Direkte und natürliche Entsprechung für ein Trinkgefäß.
- source_word: παροψίδος
  choice: Schüssel
  rationale: Bezeichnet ein Speisegefäß hinreichend allgemein, ohne es unnötig auf einen flachen Teller festzulegen.
- source_word: ἔσωθεν
  choice: innen
  rationale: Bewahrt die räumliche Bildsprache knapp und natürlich.
- source_word: γέμουσιν
  choice: sind sie voller
  rationale: Der griechische Plural bezieht sich grammatisch auf Becher und Schüssel; die deutsche Fassung erhält diesen Bildbezug, statt ihn ausdrücklich auf die Menschen umzudeuten.
- source_word: ἁρπαγῆς
  choice: Gier
  rationale: Gibt im moralischen Bild den Drang nach an sich gerissenem Gewinn verständlich wieder; die stärkeren Bedeutungen Raub und Erpressung bleiben in der Fußnote sichtbar.
- source_word: ἀκρασίας
  choice: Maßlosigkeit
  rationale: Bezeichnet fehlende Selbstbeherrschung und zügellose Befriedigung eigener Wünsche in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Bezug der inneren Unreinheit
  choice: 'Die Gefäßmetapher bleibt grammatisch erhalten: „innen aber sind sie voller …“'
  alternative: „Inwendig aber seid ihr voller …“
  rationale: Das griechische Verb steht im Plural und kann sich unmittelbar auf Becher und Schüssel beziehen. Die gewählte Form wahrt das Bild, ohne die offenkundige Anwendung auf die Angeredeten ausdrücklich in den Satz hineinzuschreiben.
- issue: Stärke der bezeichneten inneren Laster
  choice: „Gier und Maßlosigkeit“ im Haupttext
  alternative: „Raub/Erpressung und Unbeherrschtheit“
  rationale: Die Hauptfassung ist verständlich und idiomatisch, während die Fußnote das mögliche Moment ausbeuterischer Aneignung und mangelnder Selbstkontrolle offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wehruf und die scharfe Anrede bleiben erhalten; die Innen-außen-Metapher wird nicht erklärend aufgelöst.
