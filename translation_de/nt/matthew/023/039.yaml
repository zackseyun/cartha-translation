id: MAT.23.39
reference: Matthew 23:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: de
  text: 'Denn ich sage euch: Von jetzt an werdet ihr mich ganz gewiss nicht sehen, bis ihr sagt: »Gesegnet ist, wer im Namen des Herrn kommt!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat bzw. Anspielung auf Psalm 118,26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die direkte Anrede wird formal und zugleich natürlich wiedergegeben; »denn« bewahrt die begründende Verbindung zum vorausgehenden Weheruf.
- source_word: οὐ μή
  choice: ganz gewiss nicht
  rationale: Die verstärkte griechische Verneinung mit Aorist Konjunktiv wird deutlich hervorgehoben, ohne das zeitlich absoluter klingende »niemals« zu verwenden.
- source_word: ἴδητε
  choice: sehen
  rationale: »Sehen« ist die direkte, gegenwärtige und im Kontext angemessene Wiedergabe von ὁράω.
- source_word: ἀπ’ ἄρτι
  choice: von jetzt an
  rationale: Die Wendung bezeichnet einen Zeitraum, der mit dem gegenwärtigen Augenblick beginnt.
- source_word: ἕως ἂν εἴπητε
  choice: bis ihr sagt
  rationale: Die Formulierung wahrt den zukünftigen, noch ausstehenden Endpunkt, ohne die Art oder den Zeitpunkt seiner Erfüllung näher festzulegen.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Gesegnet ist, wer kommt
  rationale: »Gesegnet« erhält den Schriftklang des Psalmzitats; »wer kommt« gibt das substantivierte Partizip natürlich wieder, ohne einen über den Wortlaut hinausgehenden Titel festzuschreiben.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die Präpositionalphrase und der vertraute biblische Ausdruck werden eng am griechischen Wortlaut bewahrt; κύριος wird als »Herr« wiedergegeben.
theological_decisions:
- issue: Zeitpunkt und Bedeutung des künftigen Sehens und Bekennens
  choice: Der Wortlaut bezeichnet Jesu Abwesenheit bis zu einer künftigen Äußerung des Psalmwortes, ohne das betreffende Ereignis näher zu bestimmen.
  alternative: Spezifische Deutung auf den Einzug in Jerusalem, die Wiederkunft oder eine künftige Umkehr Israels.
  rationale: Der griechische Text nennt weder einen genauen Zeitpunkt noch einen ausdrücklichen heilsgeschichtlichen Ablauf. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die verstärkte Verneinung wird im Haupttext sichtbar gemacht; Satzbau und Zitatklang bleiben nahe am griechischen Ausgangstext.
