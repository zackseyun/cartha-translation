  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Ausgangstextes angemessen wieder: γάρ als „Denn“, die direkte Anrede, die nachdrückliche Verneinung οὐ μή durch „ganz gewiss nicht“, den Beginn „von jetzt an“ und den zukünftigen Endpunkt „bis ihr sagt“. Die Übersetzung legt keinen bestimmten historischen oder eschatologischen Zeitpunkt des künftigen Sagens fest.'
  naturalness: '„Denn ich sage euch: Von jetzt an werdet ihr mich ganz gewiss nicht sehen, bis ihr sagt …“ ist idiomatisches modernes Standarddeutsch und bewahrt zugleich den feierlichen Ton der Rede. „Gesegnet ist, wer … kommt“ ist eine natürliche deutsche Wiedergabe des Psalmzitats.'
  terminology: „Gesegnet“, „im Namen des Herrn“ und die Bezeichnung „Herr“ für κύριος sind sachgerecht und behalten den biblischen Anklang. Die Formulierung „wer … kommt“ gibt den artikulierten Partizipialausdruck verständlich wieder, ohne eine weitergehende Titelauslegung festzulegen.
