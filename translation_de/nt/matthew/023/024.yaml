  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: de
  text: Ihr blinden Führer! Ihr siebt die Mücke aus, verschluckt aber das Kamel!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: blinden Führer
  rationale: Die direkte Anrede und die Metapher geistlicher Orientierungslosigkeit werden knapp und eindringlich bewahrt.
- source_word: διϋλίζοντες
  choice: siebt … aus
  rationale: Das Verb bezeichnet das Filtern einer Flüssigkeit, um einen Fremdkörper daraus zu entfernen. „Aussieben“ gibt diesen Vorgang im Deutschen natürlich wieder.
- source_word: τὸν κώνωπα
  choice: die Mücke
  rationale: κώνωψ bezeichnet ein kleines, mückenartiges Insekt. „Mücke“ ist im Deutschen verständlich und erhält den sprichwörtlichen Größenkontrast.
- source_word: τὴν δὲ κάμηλον
  choice: aber das Kamel
  rationale: δέ markiert den scharfen Gegensatz zwischen dem winzigen Insekt und dem riesigen Tier.
- source_word: καταπίνοντες
  choice: verschluckt
  rationale: Das Verb bedeutet hinunterschlucken. In Verbindung mit dem Kamel bewahrt „verschluckt“ die drastische Übertreibung und klingt im Deutschen idiomatisch.
theological_decisions:
- issue: Bildhafte Aussage über Reinheit und moralische Maßstäbe
  choice: Das konkrete Bild vom Aussieben einer Mücke und Verschlucken eines Kamels bleibt erhalten.
  alternative: Deutende Wiedergabe als übertriebene Beachtung kleiner Verfehlungen bei gleichzeitiger Missachtung großer Verfehlungen.
  rationale: Die Aussage gewinnt ihre Kraft aus dem absurden Gegensatz zweier konkreter, nach den Reinheitsvorschriften unreiner Tiere. Eine erklärende Paraphrase würde die Bildsprache und ihre theologische Spannung abschwächen.
translation_notes:
  register: Moderne, würdige und unmittelbar verständliche Sprache. Der Ausruf und die parallelen Handlungen bewahren die Schärfe der prophetischen Anklage.
