  source_fidelity: Die Übersetzung gibt die Anrede „blinde Führer“ sowie den scharf kontrastierenden Parallelismus der griechischen Partizipien treffend wieder. „die Mücke aussieben“ bildet διϋλίζειν als das Ausfiltern eines kleinen Insekts angemessen ab; „das Kamel verschlucken“ bewahrt die absurde Hyperbel. Die finite Anredeform „Ihr …“ ist eine idiomatische deutsche Entsprechung.
  naturalness: „Ihr blinden Führer! Ihr siebt die Mücke aus, verschluckt aber das Kamel!“ ist modernes, verständliches Standarddeutsch mit der erforderlichen rhetorischen Schärfe. Die Wortstellung mit „aber“ ist natürlich.
  terminology: „Führer“ entspricht hier dem metaphorischen ὁδηγοί im Sinn von Personen, die andere leiten; es ist im Kontext eindeutig. „Mücke“ und „Kamel“ erhalten den beabsichtigten Größenkontrast. Es werden keine theologischen Deutungen hinzugefügt.
