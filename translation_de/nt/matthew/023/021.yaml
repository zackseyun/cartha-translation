  source_fidelity: Der Entwurf gibt die generische substantivierte Partizipialkonstruktion ὁ ὀμόσας angemessen mit „wer … schwört“ wieder. Die zweimalige Schwurformel mit ἐν ist im Kontext zutreffend als „bei“ verstanden; die Bezüge von „ihm“ und „in ihm“ auf den Tempel sind klar. „dem, der in ihm wohnt“ erhält die substantivierte Partizipialform sowie die im griechischen Wortlaut implizit bleibende Identität des Bewohners.
  naturalness: „Und wer beim Tempel schwört, schwört bei ihm und bei dem, der in ihm wohnt“ ist klares, modernes Standarddeutsch mit einem dem Mahn- und Lehrstil des Kontextes angemessenen würdigen Register. Die Wiederholung von „schwört“ bildet die griechische Parallelstruktur natürlich ab.
  terminology: „Tempel“ ist für ναός in diesem Kontext verständlich und sachgerecht. Die zurückhaltende Formulierung „dem, der in ihm wohnt“ vermeidet es, die im griechischen Text nicht ausdrücklich genannte Gottesbezeichnung in den Haupttext einzutragen. Die Fußnote erklärt die mögliche wörtliche Präpositionswiedergabe und die kontextuelle Bedeutung der Schwurformel korrekt.
