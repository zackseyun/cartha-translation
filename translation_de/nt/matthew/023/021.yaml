id: MAT.23.21
reference: Matthew 23:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: de
  text: Und wer beim Tempel schwört, schwört bei ihm und bei dem, der in ihm wohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die griechische Präposition auch mit „im Tempel … in ihm“ wiedergegeben werden; in dieser Schwurformel hat sie jedoch den Sinn „beim Tempel … bei ihm“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: wer … schwört
  rationale: Das substantivierte Aoristpartizip bezeichnet allgemein jeden, der einen solchen Schwur leistet. Die deutsche Konstruktion „wer … schwört“ gibt diesen generischen Sinn natürlich wieder.
- source_word: ἐν τῷ ναῷ
  choice: beim Tempel
  rationale: Obwohl ἐν gewöhnlich „in“ bedeutet, bezeichnet es hier innerhalb einer Schwurformel das, wobei geschworen wird. „Beim Tempel schwören“ ist die entsprechende idiomatische deutsche Wendung.
- source_word: ναῷ
  choice: Tempel
  rationale: ναός bezeichnet hier den Tempel beziehungsweise das Heiligtum. „Tempel“ ist im Zusammenhang klar und für heutige Leser geläufig.
- source_word: ὀμνύει
  choice: schwört
  rationale: Das Präsens formuliert die allgemein geltende Konsequenz eines solchen Schwurs; das schlichte „schwört“ bewahrt die knappe Aussageform.
- source_word: ἐν αὐτῷ
  choice: bei ihm
  rationale: Wie beim ersten ἐν handelt es sich um die Schwurformel „bei“. Das Pronomen bezieht sich auf den im Deutschen maskulinen „Tempel“, daher „ihm“.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: dem, der in ihm wohnt
  rationale: Das substantivierte Präsenspartizip bezeichnet den im Tempel Wohnenden und bewahrt mit „wohnt“ das Bild der göttlichen Gegenwart. Die Formulierung lässt die Identität im Satz selbst so implizit wie im Griechischen.
- source_word: αὐτόν
  choice: in ihm
  rationale: Das Pronomen nimmt ναός („Tempel“) wieder auf. Deutsch verlangt wegen des grammatischen Geschlechts von „Tempel“ die Form „ihm“.
theological_decisions:
- issue: Identität dessen, der im Tempel wohnt
  choice: „dem, der in ihm wohnt“ ohne typografische Hervorhebung
  alternative: „Gott, der in ihm wohnt“ oder „dem Einen, der in ihm wohnt“
  rationale: Im Kontext ist Gott gemeint, doch der griechische Text nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese implizite Bezugnahme und vermeidet eine erklärende Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „schwört … schwört“ und die parallelen Präpositionalgruppen bilden die knappe, eindringliche Struktur des griechischen Satzes nach.
