id: MAT.23.22
reference: Matthew 23:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: de
  text: Und wer beim Himmel schwört, schwört beim Thron Gottes und bei dem, der darauf sitzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei dem darauf Sitzenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: wer … schwört
  rationale: Das substantivierte Aoristpartizip bezeichnet hier allgemein jeden, der so schwört. Die präsentische deutsche Formulierung gibt diesen allgemeinen Grundsatz natürlich wieder.
- source_word: ἐν
  choice: bei
  rationale: In Schwurformeln entspricht ἐν mit Dativ dem idiomatischen deutschen „bei etwas schwören“. Diese Bedeutung gilt für alle drei Vorkommen im Vers.
- source_word: οὐρανῷ
  choice: Himmel
  rationale: Der religiöse Zusammenhang und die unmittelbare Verbindung mit Gottes Thron sprechen für „Himmel“, nicht lediglich „Himmelsgewölbe“ oder „Luftraum“.
- source_word: ὀμνύει
  choice: schwört
  rationale: Das Präsens formuliert eine allgemeine Wahrheit; das deutsche Präsens entspricht dem unmittelbar.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: Thron Gottes
  rationale: Die Genitivverbindung wird knapp und würdevoll bewahrt.
- source_word: τῷ καθημένῳ
  choice: dem, der … sitzt
  rationale: Die substantivierte Partizipialform bezeichnet den auf dem Thron Sitzenden. „Der darauf sitzt“ ist im modernen Deutsch natürlicher als „der darauf Sitzende“ und bewahrt zugleich die Umschreibung.
- source_word: ἐπάνω αὐτοῦ
  choice: darauf
  rationale: Das Pronomen bezieht sich auf den Thron; im Deutschen bringt „darauf“ die Vorstellung des Thronens ohne den möglichen Eindruck räumlicher Distanz zum Ausdruck.
theological_decisions:
- issue: Bezug von „dem, der darauf sitzt“
  choice: Ehrfürchtige Umschreibung für Gott, der auf seinem Thron sitzt
  alternative: Eine formal unbestimmte Person, die dort sitzt
  rationale: „Thron Gottes“ und die Logik des Ausspruchs machen Gott zum klaren Bezug. Die Übersetzung ersetzt die Umschreibung dennoch nicht ausdrücklich durch „Gott“ und bewahrt so die Form und Spannung des griechischen Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „schwört“ und „bei“ bildet die argumentative Struktur des griechischen Satzes ab; „der darauf sitzt“ ist natürlich und bewahrt das Thronmotiv.
