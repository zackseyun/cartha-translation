  source_fidelity: Die Übersetzung gibt λέγων idiomatisch als „Er sagte“ wieder. „haben sich auf den Lehrstuhl des Mose gesetzt“ bildet den aoristischen Ausdruck ἐκάθισαν als Einnahme einer Sitz- bzw. Autoritätsposition angemessen ab. Die Präposition „auf“ entspricht ἐπί mit Genitiv; die Metapher der Mose zugeordneten Lehrvollmacht bleibt erhalten.
  naturalness: Das Deutsch ist modernes, würdevolles Standarddeutsch. „Schriftgelehrten“ und „Pharisäer“ sind geläufige, sachliche Bezeichnungen. „Lehrstuhl des Mose“ ist verständlich und vermittelt sowohl das konkrete Sitzbild als auch die institutionelle Lehrfunktion.
  terminology: Die zentralen Gruppenbezeichnungen sind korrekt. „Lehrstuhl des Mose“ ist eine vertretbare deutsche Wiedergabe von Μωϋσέως καθέδρας und vermeidet eine unnötig interpretierende Umschreibung. Die Fußnote wahrt die mögliche resultative bzw. neutrale Lesart von ἐκάθισαν, ohne eine unrechtmäßige Selbstermächtigung zu behaupten.
