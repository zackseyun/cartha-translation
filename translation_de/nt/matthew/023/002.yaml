  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: de
  text: 'Er sagte: »Die Schriftgelehrten und die Pharisäer haben sich auf den Lehrstuhl des Mose gesetzt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »sitzen auf dem Lehrstuhl des Mose«. Das griechische Verb kann neutral den bestehenden Sitz bezeichnen oder das Einnehmen dieser autoritativen Stellung hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: Er sagte
  rationale: Das Präsenspartizip führt Jesu Rede ein und knüpft an den vorangehenden Vers an. Im natürlichen modernen Deutsch wird diese Verbindung am klarsten durch einen finiten Einleitungssatz wiedergegeben.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: auf den Lehrstuhl des Mose
  rationale: Die Präposition ἐπί mit Genitiv bezeichnet hier die eingenommene Stellung. καθέδρα ist zugleich ein konkreter Sitz und ein Bild für anerkannte Lehrvollmacht; „Lehrstuhl“ macht diese Verbindung im Deutschen verständlich, ohne die Metapher aufzugeben.
- source_word: ἐκάθισαν
  choice: haben sich … gesetzt
  rationale: Der Aorist von καθίζω bezeichnet hier das Einnehmen eines Sitzes beziehungsweise einer Stellung. Die deutsche Wendung lässt offen, ob lediglich die bestehende Stellung festgestellt oder ein Anspruch auf Autorität angedeutet wird.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Dies ist die geläufige und sachlich passende deutsche Bezeichnung für die mit den heiligen Schriften und dem Gesetz befassten Fachgelehrten.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche deutsche Wiedergabe des Gruppennamens.
theological_decisions:
- issue: Ob ἐκάθισαν neutral als gegenwärtiges „sitzen“ oder als Einnehmen einer Autoritätsstellung wiederzugeben ist
  choice: haben sich auf den Lehrstuhl des Mose gesetzt
  alternative: sitzen auf dem Lehrstuhl des Mose
  rationale: Der griechische Aorist spricht zunächst vom Sichsetzen beziehungsweise vom Einnehmen des Sitzes. Die gewählte Form bewahrt diese Aktionsart und die mögliche kritische Nuance, behauptet aber nicht ausdrücklich, die Stellung sei widerrechtlich oder ohne göttliche Anerkennung beansprucht worden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lehrstuhl des Mose“ bewahrt das Sitzbild und verdeutlicht zugleich den Bezug zur Lehrvollmacht. Die finite Redeeinleitung ist im Deutschen natürlicher als eine wörtliche partizipiale Konstruktion.
