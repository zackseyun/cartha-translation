id: MAT.23.5
reference: Matthew 23:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: de
  text: Alle ihre Taten aber tun sie, um von den Menschen gesehen zu werden. Denn sie machen ihre Gebetsriemen[a] breit und vergrößern die Quasten[b] an ihren Gewändern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gebetsriemen sind kleine lederne Kapseln mit Abschnitten aus der Schrift, die mit Riemen befestigt werden. Manche Juden tragen sie in Befolgung von Stellen wie 5. Mose 6,8.
    reason: cultural_note
  - marker: b
    text: Gemeint sind die Quasten an den Gewändern; siehe 4. Mose 15,38–39.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: alle ihre Taten
  rationale: Gibt die Gesamtheit ihrer Handlungen natürlich und präzise wieder; „Taten“ ist im heutigen Deutsch idiomatischer als „Werke“.
- source_word: δὲ
  choice: aber
  rationale: Markiert den Kontrast zum vorangehenden Zusammenhang.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: tun sie, um von den Menschen gesehen zu werden
  rationale: Bewahrt die ausdrücklich finale Konstruktion und gibt ἄνθρωποι geschlechtsübergreifend wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die erläuternden Beispiele für die zuvor erhobene Kritik ein.
- source_word: πλατύνουσι
  choice: machen … breit
  rationale: Entspricht dem konkreten Bild des Verbreiterns und klingt mit dem gewählten Gegenstand natürlich.
- source_word: φυλακτήρια
  choice: Gebetsriemen
  rationale: Etablierte, verständliche deutsche Bezeichnung für die beim Gebet getragenen Lederriemen samt Schriftkapseln; eine Fußnote erläutert den Gegenstand genauer.
- source_word: μεγαλύνουσι
  choice: machen … groß
  rationale: Bewahrt die allgemeine Bedeutung „vergrößern“, ohne die im Griechischen nicht ausdrücklich genannte Dimension auf „verlängern“ festzulegen.
- source_word: κράσπεδα
  choice: Quasten an ihren Gewändern
  rationale: Bezeichnet hier die aufgrund der Tora getragenen Gewandquasten; die Ergänzung „an ihren Gewändern“ macht den kulturellen Bezug für heutige Leser klar.
theological_decisions:
- issue: Darstellung jüdischer religiöser Gegenstände ohne sachfremde Polemik
  choice: Die konkreten Gegenstände werden neutral als „Gebetsriemen“ und „Quasten“ bezeichnet und sachlich erläutert.
  alternative: „Amulette“ beziehungsweise eine Formulierung, die die Gegenstände selbst als verwerflich erscheinen lässt
  rationale: Die Kritik des Verses richtet sich gegen demonstrative Selbstdarstellung, nicht gegen die jüdischen Praktiken oder die Gegenstände als solche.
- issue: Reichweite von τοῖς ἀνθρώποις
  choice: „von den Menschen“
  alternative: „von den Männern“ oder interpretierend „von anderen“
  rationale: Der Ausdruck meint Menschen allgemein; die formnahe Wiedergabe wahrt diesen Umfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Kontrast und Zweckgedanken, während die jüdischen Kultgegenstände verständlich und neutral benannt werden.
