source:
  edition: SBLGNT
  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: de
  text: Sie lieben den Ehrenplatz bei Festmählern[a][c] und die vornehmsten Sitze in den Synagogen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den obersten Platz bei Tisch“. Gemeint ist der besonders geehrte Liegeplatz bei förmlichen Mahlzeiten in der Antike.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die obersten Sitze“. Das griechische Wort bezeichnet Sitze mit dem höchsten Rang oder Vorrang.'
    reason: lexical_alternative
  - marker: c
    text: Bei Festmählern im antiken Mittelmeerraum wurde der gesellschaftliche Rang durch die Platzordnung sichtbar. Es geht daher um öffentliches Ansehen, nicht nur um einen angenehmen Platz.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: Sie lieben
  rationale: Das Präsens von φιλέω bezeichnet hier eine starke Vorliebe. „Sie lieben“ ist unmittelbar, natürlich und bewahrt die kritische Schärfe.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ verbindet den Satz nur leicht mit dem vorangehenden Zusammenhang. Im Deutschen ist diese Verbindung ohne ein ausdrückliches „und“ natürlicher; ein „aber“ würde einen zu starken Gegensatz anzeigen.
- source_word: τὴν πρωτοκλισίαν
  choice: den Ehrenplatz
  rationale: Der griechische Singular bezeichnet den ranghöchsten Liegeplatz bei einem Mahl. „Ehrenplatz“ gibt die soziale Vorrangstellung verständlich wieder; die antike Tischsitte wird in einer Fußnote erläutert.
- source_word: ἐν τοῖς δείπνοις
  choice: bei Festmählern
  rationale: δεῖπνον bezeichnet ein Mahl beziehungsweise Abendessen. Im vorliegenden Zusammenhang gesellschaftlich geordneter Mahlzeiten gibt „Festmähler“ den feierlichen, öffentlichen Rahmen angemessen wieder.
- source_word: τὰς πρωτοκαθεδρίας
  choice: die vornehmsten Sitze
  rationale: Das Wort bezeichnet Sitze mit höchstem Rang oder Vorrang. „Vornehmsten“ betont den gesellschaftlichen Status, nicht bloß Bequemlichkeit oder Sichtnähe.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: in den Synagogen
  rationale: Die locative Wendung wird direkt und natürlich wiedergegeben.
theological_decisions: []
