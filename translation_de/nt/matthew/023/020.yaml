id: MAT.23.20
reference: Matthew 23:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: de
  text: Wer also bei dem Altar schwört, schwört bei ihm und bei allem, was auf ihm ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Wer also … schwört
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden, der so schwört; οὖν wird als folgerndes „also“ wiedergegeben.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: beim Altar
  rationale: In Verbindung mit ὀμνύω bezeichnet ἐν idiomatisch das, wobei geschworen wird. „Beim Altar schwören“ ist die natürliche deutsche Eidesformel.
- source_word: ὀμνύει ἐν αὐτῷ
  choice: schwört bei ihm
  rationale: Das Präsens formuliert eine allgemeine Aussage; das Pronomen verweist auf den Altar zurück.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: und bei allem, was auf ihm liegt
  rationale: Die substantivische Wendung ist weiter als eine einzelne Opfergabe. „Auf ihm liegt“ gibt die räumliche Beziehung zum Altar natürlich wieder, ohne den Bezug unnötig auf Opfergaben einzuengen.
theological_decisions:
- issue: Bezug von πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: alles, was auf dem Altar liegt
  alternative: alle Opfergaben auf ihm; alles über ihm
  rationale: Der unmittelbare Zusammenhang erwähnt die Gabe auf dem Altar, doch die griechische Formulierung ist allgemein. Die Übersetzung bewahrt diese Breite und legt nicht fest, dass ausschließlich Opfergaben gemeint sind.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem Ton. Die Wiederholung von „schwört“ und „bei“ erhält die argumentative Struktur des griechischen Satzes.
