  text: And you[a], fill up the measure of your fathers.
translation:
  language: de
  text: 'Und ihr: Macht das Maß eurer Väter voll.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Vervollständigt das Maß der Sünden eurer Väter.“ Wörtlich heißt es im Griechischen: „Macht das Maß eurer Väter voll.“ Das Bild beschreibt angesammelte Schuld, die ihre Grenze erreicht; „Väter“ kann hier „Vorfahren“ meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte griechische Verknüpfung und führt die vorherige Anklage rhetorisch fort.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck; die Wortstellung „Und ihr“ gibt diesen Akzent natürlich wieder.
- source_word: πληρώσατε
  choice: macht … voll
  rationale: Der Aorist-Imperativ der zweiten Person Plural wird als Aufforderung wiedergegeben. Die idiomatische deutsche Wendung bewahrt zugleich das Bild eines Maßes, das bis zur Grenze gefüllt wird.
- source_word: τὸ μέτρον
  choice: das Maß
  rationale: Die wörtliche Bildsprache eines bestimmten, sich füllenden Maßes bleibt erhalten, ohne die gemeinte Schuld bereits in den Haupttext einzutragen.
- source_word: τῶν πατέρων ὑμῶν
  choice: eurer Väter
  rationale: Die Wiedergabe bleibt nahe am Wortlaut und bewahrt die rhetorische Verbindung zu den zuvor genannten Vätern; gemeint sind die Vorfahren.
theological_decisions:
- issue: Aufforderung oder Vorhersage
  choice: 'Imperativische Aufforderung mit ironisch-gerichtlichem Klang: „macht … voll“'
  alternative: 'Vorhersage: „Ihr macht … voll“ oder „Ihr werdet … vollmachen“'
  rationale: πληρώσατε ist morphologisch ein Aorist-Imperativ. Die Übersetzung wahrt diese grammatische Form und lässt zugleich die Spannung bestehen, dass Jesus seine Gegner in anklagender Ironie dazu auffordert, das schuldhafte Handeln ihrer Väter zu Ende zu führen.
- issue: Inhalt des Maßes
  choice: 'Das Bild bleibt im Haupttext unausgedeutet: „das Maß eurer Väter“'
  alternative: „das volle Maß der Sünden eurer Väter“
  rationale: Der griechische Wortlaut nennt weder „Sünden“ noch „Schuld“ ausdrücklich. Der Kontext legt angesammelte Schuld nahe, doch diese Deutung wird in die Fußnote gestellt, damit die metaphorische Offenheit des Haupttextes erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Macht das Maß … voll“ ist verständlich und erhält sowohl den Imperativ als auch die zugespitzte Metapher. „Väter“ wahrt die rhetorische Linie des Zusammenhangs; die Bedeutung „Vorfahren“ wird durch die Fußnote und den Kontext erschließbar.
