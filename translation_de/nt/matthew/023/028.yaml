id: MAT.23.28
reference: Matthew 23:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: de
  text: So erscheint auch ihr nach außen den Menschen als gerecht, innerlich aber seid ihr voller Heuchelei und Gesetzlosigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καί
  choice: So … auch
  rationale: Knüpft knapp und natürlich an den Vergleich mit den weiß getünchten Gräbern im vorherigen Vers an.
- source_word: ἔξωθεν … ἔσωθεν
  choice: nach außen … innen
  rationale: Bewahrt den betonten Gegensatz zwischen äußerem Eindruck und innerer Wirklichkeit in idiomatischem Deutsch.
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: erscheint … vor den Menschen als gerecht
  rationale: Gibt sowohl die Wahrnehmung durch andere als auch den bloßen Anschein von Gerechtigkeit wieder; die generische Bedeutung von ἀνθρώποις wird durch „Menschen“ natürlich ausgedrückt.
- source_word: μεστοί
  choice: voller
  rationale: Direkte und idiomatische Wiedergabe des prädikativen Adjektivs.
- source_word: ὑποκρίσεως
  choice: Heuchelei
  rationale: Bezeichnet hier religiös-moralische Verstellung und entspricht dem scharfen Ton der Anklage.
- source_word: ἀνομίας
  choice: Gesetzlosigkeit
  rationale: Bewahrt den Bezug auf die Missachtung des Gesetzes und verallgemeinert den Ausdruck nicht zu bloßer Bosheit.
theological_decisions:
- issue: Ob δίκαιοι einen wirklichen moralischen Status oder nur den äußeren Eindruck bezeichnet
  choice: Gerechtigkeit als äußerer Eindruck vor Menschen
  alternative: tatsächliche Gerechtigkeit
  rationale: φαίνεσθε sowie der Gegensatz zu „innen aber seid ihr“ kennzeichnen die Gerechtigkeit als Erscheinungsbild, nicht als bestätigte innere Wirklichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der scharfe Gegensatz von äußerem Anschein und innerem Zustand bleiben erhalten. Eine Fußnote zu ἀνθρώποις ist im Deutschen unnötig, da „Menschen“ bereits eindeutig generisch ist.
