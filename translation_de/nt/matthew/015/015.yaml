  source_fidelity: Die Übersetzung gibt den Antwortcharakter von Ἀποκριθεὶς … εἶπεν idiomatisch mit „erwiderte“ wieder. Φράσον wird treffend als „Erkläre“ wiedergegeben; „uns“ entspricht ἡμῖν, und „dieses Gleichnis“ gibt τὴν παραβολὴν ταύτην vollständig wieder. Das leichte δέ muss im Deutschen nicht mit „aber“ markiert werden.
  naturalness: '„Petrus erwiderte ihm: ‚Erkläre uns dieses Gleichnis.‘“ ist natürliches, modernes Standarddeutsch und hat einen angemessen würdigen biblisch-narrativen Registerton. Die Vermeidung von „antwortete und sagte“ ist stilistisch sinnvoll.'
  terminology: „Petrus“ und „Gleichnis“ sind etablierte und sachgerechte deutsche Formen. „Gleichnis“ erhält die evangelische Terminologie für παραβολή, ohne die konkret vorausgehende bildhafte Aussage unzulässig einzuengen.
