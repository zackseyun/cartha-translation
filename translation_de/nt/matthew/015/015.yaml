  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: de
  text: 'Petrus erwiderte ihm: „Erkläre uns dieses Gleichnis.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Petrus erwiderte ihm
  rationale: Die griechische Verbindung aus Partizip und finitem Verb ist eine geläufige Redeformel. Das natürliche deutsche „erwiderte“ gibt sowohl den Antwortcharakter als auch den Sprechakt wieder, ohne die im Deutschen schwerfällige Doppelung „antwortete und sagte“.
- source_word: δὲ
  choice: im Verb „erwiderte“ mitgedacht
  rationale: δέ markiert hier eine leichte Weiterführung beziehungsweise Reaktion. Ein eigenes „aber“ würde im Deutschen einen stärkeren Gegensatz nahelegen, als der Zusammenhang verlangt.
- source_word: Φράσον
  choice: Erkläre
  rationale: φράζω bedeutet in diesem Zusammenhang, etwas verständlich zu machen oder auszulegen. „Erkläre“ passt zu der Bitte um Verständnis der bildhaften Aussage; möglich wäre auch „Mach uns … klar“.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Erklärung und wird mit dem deutschen Verb „erklären“ idiomatisch als Dativobjekt wiedergegeben.
- source_word: τὴν παραβολὴν ταύτην
  choice: dieses Gleichnis
  rationale: „Gleichnis“ bewahrt die übliche Evangelienterminologie für παραβολή, auch wenn das Wort hier eine bildhafte Aussage bezeichnen kann. ταύτην verweist auf das unmittelbar zuvor Gesagte.
