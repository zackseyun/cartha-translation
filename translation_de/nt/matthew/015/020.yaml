id: MAT.15.20
reference: Matthew 15:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: de
  text: Diese Dinge sind es, die den Menschen unrein machen[a]; aber mit ungewaschenen Händen zu essen macht den Menschen nicht unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verunreinigen“. Das griechische Verb kann bezeichnen, dass jemand rituell unrein wird; hier umfasst es im Zusammenhang zugleich die weiter reichende moralische Verunreinigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: Diese Dinge sind es, die
  rationale: Die Formulierung bewahrt den demonstrativen Nachdruck und den Plural des griechischen Ausdrucks, bleibt dabei aber in modernem Deutsch natürlich.
- source_word: κοινοῦντα / κοινοῖ
  choice: unrein machen / macht … nicht unrein
  rationale: Im Zusammenhang bezeichnet κοινόω das Unreinmachen eines Menschen. „Unrein machen“ wahrt sowohl den Hintergrund ritueller Reinheit als auch die weiter reichende moralische Aussage Jesu.
- source_word: τὸν ἄνθρωπον
  choice: den Menschen
  rationale: 'Der bestimmte Singular wird beibehalten und im Deutschen allgemeinvertretend verstanden: Gemeint ist der Mensch als solcher.'
- source_word: ἀνίπτοις χερσὶν
  choice: mit ungewaschenen Händen
  rationale: Dies ist eine klare und idiomatische Wiedergabe des Dativausdrucks und verweist unmittelbar auf die im Kontext behandelte Handwaschung.
- source_word: τὸ … φαγεῖν
  choice: zu essen
  rationale: Der substantivierte Infinitiv wird durch die im Deutschen natürliche Infinitivkonstruktion wiedergegeben.
- source_word: δέ
  choice: aber
  rationale: „Aber“ gibt den deutlichen Gegensatz zwischen dem, was tatsächlich unrein macht, und dem Essen mit ungewaschenen Händen wieder.
theological_decisions:
- issue: Bedeutungsumfang von κοινόω im Streit um Reinheit
  choice: „unrein machen“
  alternative: „verunreinigen“
  rationale: Die gewählte Wendung hält den Bezug auf rituelle Unreinheit offen, ohne die Aussage darauf zu beschränken; im Zusammenhang umfasst Jesu Lehre auch moralische Verunreinigung.
- issue: Allgemeinvertretender Singular ἄνθρωπον
  choice: „den Menschen“
  alternative: „einen Menschen“ oder „die Menschen“
  rationale: „Den Menschen“ bewahrt den bestimmten Singular der Vorlage und drückt im Deutschen zugleich eine allgemeine Wahrheit über jeden Menschen aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederholte Wendung „den Menschen … unrein“ bildet den pointierten Gegensatz der griechischen Vorlage ab.
