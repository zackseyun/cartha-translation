  source_fidelity: Die Übersetzung gibt die demonstrativ hervorgehobene Aussage (ταῦτά ἐστιν τὰ), den Kontrast durch δέ und die Wiederholung von κοινόω präzise wieder. „Unrein machen“ wahrt den im Kontext wesentlichen Reinheitsbezug und lässt zugleich die weitergehende Bedeutung offen. „Mit ungewaschenen Händen zu essen“ entspricht dem griechischen Infinitivsatz mit dem Dativ ἀνίπτοις χερσίν.
  naturalness: „Diese Dinge sind es, die den Menschen unrein machen; aber mit ungewaschenen Händen zu essen macht den Menschen nicht unrein“ ist klares, modernes Standarddeutsch. Die bewusste Wiederholung von „unrein machen“ bildet die pointierte Wiederholung des griechischen Verbs angemessen ab.
  terminology: „Den Menschen“ ist ein im Deutschen natürlicher allgemeinvertretender Singular für τὸν ἄνθρωπον. Die Terminologie „unrein machen“ ist im Reinheitskontext treffend und weder konfessionell verengt noch überinterpretiert. Die Fußnote bietet mit „verunreinigen“ eine sachgerechte Alternative und erklärt den rituellen sowie moralischen Bedeutungshorizont.
