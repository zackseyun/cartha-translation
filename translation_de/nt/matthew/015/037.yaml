  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: de
  text: Und sie aßen alle und wurden satt, und sie hoben sieben volle Körbe[a] mit übrig gebliebenen Stücken auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben große Körbe voll“. Das hier verwendete griechische Wort (spyrides) kann eine größere Korbart bezeichnen als die in einigen anderen Speisungsberichten erwähnten Körbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist von ἐσθίω bedeutet hier schlicht „aßen“; auch im Deutschen ist kein ausdrücklich genanntes Objekt nötig.
- source_word: πάντες
  choice: sie … alle
  rationale: Die Form bezeichnet die gesamte anwesende Menge; „sie … alle“ gibt den umfassenden Sinn natürlich wieder.
- source_word: ἐχορτάσθησαν
  choice: wurden satt
  rationale: χορτάζω bezeichnet hier das Essen bis zur Sättigung. „Wurden satt“ ist idiomatisch, prägnant und bewahrt das Passiv des griechischen Textes.
- source_word: τὸ περισσεῦον
  choice: den übrig gebliebenen
  rationale: Das substantivierte Partizip bezeichnet das, was übrig war. Zusammen mit κλασμάτων lässt es sich im Deutschen natürlich als „die übrig gebliebenen Stücke“ wiedergeben.
- source_word: κλασμάτων
  choice: Stücken
  rationale: κλάσματα sind abgebrochene beziehungsweise übrig gebliebene Stücke der Speise. „Stücke“ ist allgemein verständlich, ohne unnötig zu präzisieren, dass ausschließlich Brot gemeint sei.
- source_word: ἦραν
  choice: hoben … auf
  rationale: αἴρω bedeutet in diesem Sammelzusammenhang „aufheben“ beziehungsweise „aufnehmen“; „hoben … auf“ ist eine direkte und natürliche deutsche Wiedergabe.
- source_word: ἑπτὰ
  choice: sieben
  rationale: Die Kardinalzahl wird direkt wiedergegeben.
- source_word: σπυρίδας
  choice: Körbe
  rationale: σπυρίς bezeichnet einen Korb und kann auf eine größere Korbart hinweisen. Der Haupttext bleibt mit „Körbe“ flüssig; die mögliche Größenangabe wird in der Fußnote bewahrt.
- source_word: πλήρεις
  choice: volle
  rationale: Das Adjektiv beschreibt die sieben Körbe als voll; attributives „volle Körbe“ ist im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste griechische Satzteil bleibt eng nachgebildet; „Dann“ gliedert die anschließende Handlung im Deutschen natürlich. Der Fußnotenmarker steht bei „Körbe“, da sich die lexikalische Erläuterung auf σπυρίδας bezieht.
