  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: de
  text: 'Jesus fragte sie: „Wie viele Brote habt ihr?“ Sie antworteten: „Sieben und ein paar kleine Fische.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: fragte
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; da eine Frage folgt, bezeichnet „fragte“ den Sprechakt präzise.
- source_word: Πόσους ἄρτους
  choice: Wie viele Brote
  rationale: Der Plural ἄρτους bezeichnet hier zählbare Brotlaibe; im heutigen Deutsch ist „Brote“ die natürliche Form.
- source_word: ἔχετε
  choice: habt ihr
  rationale: Idiomatiche Wiedergabe der präsentischen Frage in der Anrede an mehrere Personen.
- source_word: οἱ δὲ εἶπαν
  choice: Sie antworteten
  rationale: δέ führt hier die Reaktion der Jünger weiter, ohne einen deutlichen Gegensatz auszudrücken. „antworteten“ gibt den Gesprächszusammenhang natürlich wieder.
- source_word: Ἑπτά
  choice: Sieben
  rationale: Direkte Wiedergabe der Zahl.
- source_word: ὀλίγα
  choice: ein paar
  rationale: Natürliche moderne Wiedergabe einer unbestimmten kleinen Anzahl.
- source_word: ἰχθύδια
  choice: kleine Fische
  rationale: Die Diminutivform legt kleine Fische nahe; diese Nuance lässt sich im Deutschen unmittelbar und natürlich ausdrücken.
