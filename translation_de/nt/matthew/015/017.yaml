id: MAT.15.17
reference: Matthew 15:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: de
  text: Begreift ihr nicht, dass alles, was in den Mund hineinkommt, in den Magen gelangt und in die Latrine ausgeschieden wird?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… in den Abort ausgeschieden wird“; ἀφεδρών kann den Abort beziehungsweise die Latrine bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: νοεῖτε
  choice: begreift
  rationale: Das Verb bezeichnet hier das geistige Erfassen von Jesu Aussage. „Begreift“ gibt den leicht tadelnden Ton der Frage natürlich wieder.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: alles, was … hineinkommt
  rationale: Die substantivierte Partizipialkonstruktion ist generisch und sächlich; die Wiedergabe umfasst allgemein alles Aufgenommene und klingt im Deutschen idiomatisch.
- source_word: εἰς τὸ στόμα
  choice: in den Mund
  rationale: εἰς bezeichnet die Bewegung hinein; „in den Mund“ bewahrt das konkrete körperliche Bild.
- source_word: κοιλίαν
  choice: Magen
  rationale: Im Zusammenhang ist eindeutig der Verdauungsbereich gemeint. „Magen“ ist im modernen Deutsch präzise und geläufig.
- source_word: χωρεῖ
  choice: gelangt
  rationale: Das Verb beschreibt hier den weiteren Weg der Nahrung. „Gelangt“ ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: ἀφεδρῶνα
  choice: Latrine
  rationale: Das Wort bezeichnet den Ort der Ausscheidung, eine Latrine beziehungsweise einen Abort. „Latrine“ ist sachlich, verständlich und historisch angemessen.
- source_word: ἐκβάλλεται
  choice: ausgeschieden wird
  rationale: Die Passivform beschreibt den körperlichen Ausscheidungsvorgang. „Ausgeschieden wird“ ist im Deutschen idiomatischer als eine mechanisch wörtliche Wiedergabe mit „hinausgeworfen“.
theological_decisions:
- issue: Verhältnis von Jesu Aussage zu den Reinheitsgeboten
  choice: Die physiologische Aussage wird ohne interpretierenden Zusatz wiedergegeben.
  alternative: Einen Zusatz einfügen, wonach damit alle Speisen für rein erklärt würden.
  rationale: Der Vers beschreibt ausdrücklich den Verdauungsvorgang, fügt aber nicht den interpretierenden Kommentar aus Markus 7,19 hinzu. Die Übersetzung bewahrt daher Wortlaut und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt direkt; die körperliche Aussage wird klar, jedoch nicht derb formuliert.
