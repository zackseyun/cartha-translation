  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: de
  text: Nachdem er die Menschenmengen weggeschickt hatte, stieg er ins Boot und kam in das Gebiet von Magadan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Magdala“ statt „Magadan“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Nachdem er … weggeschickt hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Einsteigen vorausgeht. Die Formulierung gibt diese zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Der Plural wird beibehalten; „Menschenmengen“ ist gegenwärtiges, allgemein verständliches Deutsch und gibt die versammelten Gruppen treffend wieder.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: stieg er ins Boot
  rationale: Die Wendung bezeichnet das Besteigen beziehungsweise Betreten eines Bootes. „Ins Boot steigen“ ist im Deutschen die natürliche idiomatische Entsprechung.
- source_word: ἦλθεν
  choice: kam
  rationale: Die Grundbedeutung von ἔρχομαι wird gewahrt. Im erzählerischen Zusammenhang ist „kam“ verständlich, ohne ein zusätzliches Ziel oder eine Ankunftsnuance einzutragen.
- source_word: τὰ ὅρια
  choice: das Gebiet
  rationale: Der griechische Plural „Grenzen/Grenzgebiete“ bezeichnet idiomatisch eine geografische Gegend. „Gebiet“ vermittelt diesen Sinn, ohne lediglich Grenzlinien nahezulegen.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: Der Ortsname der vorgegebenen griechischen Textausgabe wird transliteriert und nicht durch die bekannte Variante „Magdala“ ersetzt.
theological_decisions:
- issue: Textform des Ortsnamens am Versende
  choice: Magadan
  alternative: Magdala
  rationale: Die vorgegebene Ausgabe SBLGNT liest Μαγαδάν. Daher steht „Magadan“ im Haupttext; die abweichende Lesart „Magdala“ wird aus textkritischer Transparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung bildet die zeitliche Abfolge klar ab; Ortsnamen werden transliteriert. Der Fußnotenmarker steht sachgerecht beim betroffenen Ortsnamen.
