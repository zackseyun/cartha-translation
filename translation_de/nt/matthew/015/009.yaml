  terminology: »Verehren«, »Menschengebote« und »Lehren« sind passend. »Menschengebote« gibt den generischen, gegenüber dem Göttlichen kontrastierenden Bezug von ἀνθρώπων natürlich wieder. Die Fußnote sollte die appositionellere Alternative ohne die leicht erklärende Formulierung »von Menschen« bieten.
