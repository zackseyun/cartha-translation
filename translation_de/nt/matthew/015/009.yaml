  - severity: low
    issue: Formulierung der Alternativfußnote
    rationale: »Gebote von Menschen« ist verständlich, aber »Menschengebote« ist prägnanter und entspricht der im Haupttext gewählten, quellennahen Terminologie. Die Alternativform sollte lediglich die syntaktische Lesart markieren.
