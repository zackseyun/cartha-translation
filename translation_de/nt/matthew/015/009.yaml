  source_fidelity: 'Der Hauptsinn wird zutreffend wiedergegeben: μάτην als »vergeblich«, σέβονταί με als Gottesverehrung, und die menschliche Herkunft der ἐντάλματα bleiben klar. Die Wiedergabe »als Lehren« gibt die komprimierte Beziehung von διδασκαλίας und ἐντάλματα angemessen wieder. Das Partizip διδάσκοντες wird durch »indem« als begleitende Weise plausibel angeschlossen.'
