  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: de
  text: Doch vergeblich verehren sie mich, indem sie Menschengebote als Lehren vermitteln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »indem sie Lehren vermitteln, die Menschengebote sind.«'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: vergeblich
  rationale: Das Adverb bezeichnet etwas Zweckloses oder Wirkungsloses. »Vergeblich« ist im Deutschen natürlich und bewahrt den tadelnden Ton des prophetischen Zitats.
- source_word: δὲ
  choice: doch
  rationale: δέ führt den Gedanken mit einem leichten Gegensatz fort. »Doch« gibt im Kontext den vorwurfsvollen Kontrast angemessen wieder.
- source_word: σέβονταί με
  choice: verehren sie mich
  rationale: σέβομαι bezeichnet hier die auf Gott gerichtete ehrfürchtige Verehrung. »Verehren« ist verständlich und lässt offen, ob kultisches Handeln oder umfassendere Gottesverehrung gemeint ist.
- source_word: διδάσκοντες
  choice: indem sie … verkünden
  rationale: Das Partizip beschreibt die Art und Weise beziehungsweise den begleitenden Umstand ihrer vergeblichen Verehrung. »Indem« wahrt diese Verbindung; »verkünden« vermeidet im Deutschen die schwerfällige Wiederholung »Lehren lehren«, ohne den Sinn des Unterrichtens aufzugeben.
- source_word: διδασκαλίας
  choice: als Lehren
  rationale: Der Plural bezeichnet religiöse Lehrinhalte. Die Fügung »als Lehren« macht deutlich, dass menschliche Gebote mit dem Rang maßgeblicher Lehre vermittelt werden.
- source_word: ἐντάλματα ἀνθρώπων
  choice: Menschengebote
  rationale: Das Kompositum ist eine geläufige, prägnante Wiedergabe für Gebote menschlichen Ursprungs und bewahrt den Gegensatz zwischen menschlicher und göttlicher Autorität. ἀνθρώπων ist generisch und wird durch »Menschen-« geschlechtsgenau wiedergegeben.
theological_decisions:
- issue: Verhältnis von διδασκαλίας zu ἐντάλματα ἀνθρώπων
  choice: Menschengebote als Lehren verkünden
  alternative: Lehren verkünden, die Gebote von Menschen sind
  rationale: Die griechische Formulierung ist knapp und kann appositionell oder prädikativ verstanden werden. Der Haupttext gibt den naheliegenden Sinn wieder, dass menschliche Gebote als maßgebliche Lehren vermittelt werden; die Fußnote bewahrt die syntaktische Alternative.
- issue: Bedeutung von σέβομαι im Gottesbezug
  choice: verehren
  alternative: anbeten
  rationale: »Verehren« entspricht dem weiteren Bedeutungsumfang des griechischen Verbs und verhindert, dass der Vers unnötig allein auf einen bestimmten liturgischen Akt eingeengt wird. »Anbeten« wäre im Kontext ebenfalls möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Menschengebote« ist kompakt und im religiösen Zusammenhang verständlich. Die Konstruktion mit »indem« erhält den engen Zusammenhang zwischen der Verehrung und dem Lehren, ohne die Partizipialform vorschnell ausschließlich kausal zu deuten.
