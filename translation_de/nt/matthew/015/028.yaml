id: MAT.15.28
reference: Matthew 15:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: de
  text: 'Da antwortete Jesus ihr: »O Frau, dein Glaube[a] ist groß! Dir geschehe, wie du willst.« Und von jener Stunde[b] an wurde ihre Tochter geheilt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Vertrauen«. Das griechische Wort πίστις kann je nach Zusammenhang auch Vertrauen oder Treue bezeichnen; hier ist »Glaube« die naheliegende Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von jenem Augenblick an«. Wörtlich steht im Griechischen: »von jener Stunde an«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Kennzeichnet in der Erzählung den unmittelbaren zeitlichen Anschluss an den vorausgehenden Wortwechsel; »Da« ist im Deutschen natürlich und prägnant.
- source_word: ἀποκριθεὶς … εἶπεν αὐτῇ
  choice: antwortete Jesus ihr
  rationale: Die griechische Verbindung aus Partizip und Redeverb wird idiomatisch als eine einzige Redeeinleitung wiedergegeben; »ihr« bewahrt αὐτῇ.
- source_word: Ὦ γύναι
  choice: O Frau
  rationale: Gibt die betonte direkte Anrede möglichst eng wieder. »Frau« ist hier nicht abwertend; das vorangestellte »O« bewahrt den feierlichen Nachdruck.
- source_word: μεγάλη σου ἡ πίστις
  choice: dein Glaube ist groß
  rationale: Natürliches modernes Deutsch, das die Hervorhebung der Größe ihres Glaubens klar ausdrückt.
- source_word: πίστις
  choice: Glaube
  rationale: Im Kontext wird das vertrauende Sich-Verlassen der Frau auf Jesus gewürdigt. »Glaube« ist die übliche, theologisch offene Wiedergabe; die Nuance »Vertrauen« wird in einer Fußnote genannt.
- source_word: γενηθήτω σοι
  choice: Dir geschehe
  rationale: Bewahrt den passiven Imperativ und den wirksamen, zusprechenden Charakter von Jesu Ausspruch. Die Formulierung ist würdevoll und im Deutschen verständlich.
- source_word: ὡς θέλεις
  choice: wie du willst
  rationale: Gibt θέλω direkt und natürlich wieder, ohne den Wunsch der Frau näher auszudeuten.
- source_word: ἰάθη
  choice: war … geheilt
  rationale: 'Gibt den Aorist Passiv im Ergebniszustand idiomatisch wieder: Die Tochter war von diesem Zeitpunkt an geheilt.'
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: von jener Stunde an
  rationale: Bewahrt die wörtliche Zeitangabe des Griechischen; die im Deutschen ebenfalls mögliche Bedeutung »von jenem Augenblick an« wird in einer Fußnote angegeben.
theological_decisions:
- issue: Bedeutung von πίστις in Jesu Würdigung
  choice: Glaube
  alternative: Vertrauen
  rationale: Der Kontext betont das glaubende Vertrauen der Frau auf Jesu Macht und Bereitschaft zu helfen. »Glaube« wahrt die geläufige theologische Ausdrucksweise, ohne die vertrauensbezogene Nuance auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzgestalt. »O Frau« und »Dir geschehe« sind bewusst feierlicher als heutige Alltagssprache, bewahren aber Nachdruck und performativen Charakter der direkten Rede. Sämtliche Fußnotenmarker stehen an den sachlich zugehörigen Stellen im Haupttext.
