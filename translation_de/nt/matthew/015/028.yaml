  naturalness: Der Registermix ist würdig und in modernem Standarddeutsch verständlich. »O Frau« und »Dir geschehe« sind bewusst gehoben, aber für direkte Jesusrede vertretbar. »wurde geheilt« ist im deutschen Erzählstil zudem unmittelbarer und idiomatischer als »war geheilt«.
  terminology: »Glaube« ist für πίστις sachgerecht; die Fußnote wahrt die mögliche Nuance »Vertrauen«, ohne den Kontext dogmatisch festzulegen. »Stunde« entspricht ὥρα, und die Alternativangabe »Augenblick« ist sinnvoll. Namen und theologischen Schlüsselbegriffe sind korrekt.
