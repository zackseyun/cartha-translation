  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zuverlässig wieder: Das aus dem Mund Hervorkommende hat seinen Ursprung im Herzen und macht den Menschen unrein. Die kollektive Auffassung des substantivierten Neutrums Plural durch „was“ und die zusammenfassende Rückverweisung durch „das“ sind im Deutschen sachgerecht.'
  naturalness: „Was aber aus dem Mund herauskommt, kommt aus dem Herzen“ ist modernes, verständliches Standarddeutsch. Die Wiederholung von „kommt“ bildet die im Griechischen vorhandene doppelte Bewegungsbildlichkeit angemessen ab, ohne unnötig schwerfällig zu wirken.
  terminology: „Herzen“ bewahrt die biblisch-anthropologische Metapher. „Macht den Menschen unrein“ trifft κοινόω im Reinheitskontext präzise und verständlich; die Fußnote bietet mit „verunreinigt“ eine passende lexikalische Alternative. „Den Menschen“ gibt den generischen repräsentativen Singular ἄνθρωπον natürlich wieder.
