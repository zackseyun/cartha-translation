id: MAT.15.18
reference: Matthew 15:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: de
  text: Was aber aus dem Mund herauskommt, kommt aus dem Herzen, und das macht den Menschen unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verunreinigt den Menschen.'
    reason: Lexikalische Alternative für κοινοῖ; die Alternative bewahrt den traditionellen Ausdruck des Reinheitskontexts.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: was ... herauskommt
  rationale: Das substantivierte Neutrum Plural bezeichnet allgemein das, was aus dem Mund hervorgeht. Die deutsche Konstruktion mit „was“ bewahrt den umfassenden Sinn und klingt natürlicher als „die Dinge, die“.
- source_word: στόματος
  choice: Mund
  rationale: Die direkte Wiedergabe erhält das körperliche Bild und den Bezug auf das Sprechen.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herz“ bezeichnet hier den inneren Menschen als Ursprung von Gedanken, Absichten und Worten und bewahrt die biblische Bildsprache.
- source_word: ἐξέρχεται
  choice: kommt aus
  rationale: Die Form bezeichnet die Herkunft. „Kommt aus dem Herzen“ ist im Deutschen idiomatisch und erhält zugleich die Wiederholung des Herauskommens.
- source_word: κἀκεῖνα
  choice: und das
  rationale: Das Demonstrativpronomen verweist zusammenfassend auf das zuvor genannte, aus dem Mund Hervorkommende. Das deutsche „das“ passt zur vorausgehenden „was“-Konstruktion.
- source_word: κοινοῖ
  choice: macht ... unrein
  rationale: Im Reinheitskontext bedeutet das Verb, jemanden zu verunreinigen beziehungsweise unrein zu machen. Die Formulierung macht diese Bedeutung für heutige Leser unmittelbar verständlich.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: Der griechische Singular ist repräsentativ und meint den Menschen allgemein. Das deutsche „den Menschen“ bewahrt Singular und Artikel, ohne den Sinn unnötig auf Männer zu beschränken.
theological_decisions:
- issue: Ursprung der Verunreinigung
  choice: Die Verunreinigung geht vom Herzen aus und tritt durch das aus dem Mund Hervorkommende zutage.
  alternative: Eine ausschließlich rituelle Verunreinigung durch gesprochene Worte.
  rationale: Der Zusammenhang stellt äußere Aufnahme und das aus dem Inneren Hervorgehende gegenüber. „Herz“ und „unrein machen“ bewahren sowohl die anthropologische als auch die reinheitsbezogene Spannung des Textes.
- issue: Repräsentativer Singular ἄνθρωπον
  choice: den Menschen
  alternative: einen Menschen
  rationale: Der bestimmte Singular des Ausgangstextes wird beibehalten und im Deutschen natürlich als allgemeine Aussage über den Menschen verstanden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Bewegung „aus dem Mund ... aus dem Herzen“ bleibt erhalten; „was ... das“ gibt die zusammenfassende griechische Aussage natürlich wieder.
