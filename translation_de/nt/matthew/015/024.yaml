  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: de
  text: 'Er aber antwortete: „Ich bin nur zu den verlorenen Schafen des Hauses Israel gesandt worden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich bin zu niemandem gesandt worden außer zu den verlorenen Schafen des Hauses Israel.“'
    reason: Die Fußnote macht die griechische Negations- und Ausnahmekonstruktion Οὐκ … εἰ μή sichtbar, die im Haupttext idiomatisch mit „nur“ wiedergegeben wird.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Er aber antwortete
  rationale: Die im Griechischen wörtlich partizipiale Wendung („antwortend sagte er“) wird idiomatisch und ohne Bedeutungsverlust mit „antwortete“ wiedergegeben; δέ markiert hier den leichten Gegensatz.
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: Ich bin nur … gesandt worden
  rationale: Die Negation mit εἰ μή drückt eine ausdrückliche Einschränkung aus. „Nur“ ist im Deutschen natürlich; das Perfektpassiv passt zum gegenwärtig relevanten Auftrag Jesu.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: die verlorenen Schafe
  rationale: Die Schafmetapher bleibt erhalten. Das substantivierte Perfektpartizip bezeichnet Schafe, die verloren sind; „verloren“ ist hier treffender als „umgekommen“.
- source_word: οἴκου Ἰσραήλ
  choice: des Hauses Israel
  rationale: Die traditionelle biblische Wendung bewahrt den nationalen und heilsgeschichtlichen Klang des griechischen Genitivs.
theological_decisions:
- issue: Reichweite des hier genannten Auftrags Jesu
  choice: Die ausdrückliche Beschränkung auf Israel wird mit „nur“ unverändert wiedergegeben.
  alternative: Eine Deutung als bloße Priorität Israels oder eine Erweiterung um den späteren Auftrag an die Völker.
  rationale: Οὐκ … εἰ μή ist ausdrücklich restriktiv. Die Übersetzung bewahrt die Spannung der Aussage in ihrem Erzählzusammenhang und trägt keine spätere kanonische Entwicklung in den Vers ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblisch geprägte Formulierung „Haus Israel“ und die Schafmetapher werden bewahrt. Der Fußnotenmarker steht unmittelbar nach dem Zitat.
