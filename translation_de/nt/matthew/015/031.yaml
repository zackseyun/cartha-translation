source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: de
  text: Sodass die Menge staunte, als sie sah, dass Stumme[a] redeten, Menschen mit verstümmelten Gliedmaßen[b] gesund waren, Menschen mit Gehbehinderung gingen und Blinde sahen. Und sie verherrlichten den Gott Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Taube«. Das griechische Wort kann taub oder stumm bedeuten; hier spricht der unmittelbare Zusammenhang mit dem Reden für »Stumme«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Wort bezeichnet Menschen mit verkrümmten, beeinträchtigten oder verstümmelten Gliedmaßen; auch möglich: »Menschen mit beeinträchtigten Gliedmaßen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Da
  rationale: Leitet idiomatisch die Folge der zuvor berichteten Heilungen ein.
- source_word: τὸν ὄχλον
  choice: die Menge
  rationale: Natürliche moderne Wiedergabe der versammelten Menschenmenge.
- source_word: θαυμάσαι
  choice: staunte
  rationale: Gibt die erstaunte Reaktion auf die Heilungen klar und würdig wieder.
- source_word: βλέποντας
  choice: als sie sah
  rationale: Macht deutlich, dass die beobachteten Heilungen der Anlass des Staunens waren.
- source_word: κωφοὺς
  choice: Stumme
  rationale: κωφός kann taub oder stumm bedeuten; λαλοῦντας legt hier wegen des Gegensatzes zum Reden »stumm« nahe.
- source_word: λαλοῦντας
  choice: redeten
  rationale: Direkte und natürliche Wiedergabe der wiedergewonnenen Sprechfähigkeit.
- source_word: κυλλοὺς
  choice: Menschen mit verstümmelten Gliedmaßen
  rationale: Gibt die körperliche Beeinträchtigung präziser und respektvoller wieder als eine substantivierte pauschale Bezeichnung.
- source_word: ὑγιεῖς
  choice: gesund waren
  rationale: Entspricht unmittelbar dem prädikativen Adjektiv und vermeidet eine im Griechischen nicht ausdrücklich vorhandene Passivkonstruktion.
- source_word: χωλοὺς
  choice: Gelähmte
  rationale: Bezeichnet hier Menschen, deren Gehfähigkeit eingeschränkt war; im Deutschen bildet »Gelähmte gingen umher« den beabsichtigten Kontrast natürlich ab.
- source_word: περιπατοῦντας
  choice: umhergingen
  rationale: Bewahrt den konkreten Sinn des Gehens und gibt περιπατέω etwas voller wieder als nur »gingen«.
- source_word: τυφλοὺς βλέποντας
  choice: Blinde sahen
  rationale: Spiegelt knapp und direkt den griechischen Kontrast zwischen Blindheit und Sehen.
- source_word: ἐδόξασαν
  choice: priesen
  rationale: Natürliches gegenwärtiges Deutsch für das ehrende Verherrlichen Gottes, ohne den theologischen Gehalt abzuschwächen.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: den Gott Israels
  rationale: Formale und etablierte Wiedergabe der griechischen Genitivverbindung.
theological_decisions:
- issue: Bedeutung von κωφούς in κωφοὺς λαλοῦντας
  choice: Stumme redeten
  alternative: Taube redeten
  rationale: Das Wort kann Taubheit oder Stummheit bezeichnen. Der unmittelbare Gegensatz zum Reden spricht hier für Stummheit; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
- issue: Bedeutung von δοξάζω in Bezug auf Gott
  choice: sie priesen den Gott Israels
  alternative: sie verherrlichten den Gott Israels / sie gaben dem Gott Israels die Ehre
  rationale: »Priesen« bezeichnet im Deutschen eine ehrende, anbetende Reaktion auf Gottes Taten und klingt in diesem Erzählzusammenhang natürlicher als »verherrlichten«.
- issue: Textform κυλλοὺς ὑγιεῖς
  choice: Menschen mit verstümmelten Gliedmaßen gesund waren
  alternative: Verkrüppelte heil waren / Menschen mit verstümmelten Gliedmaßen wiederhergestellt waren
  rationale: Die Formulierung bewahrt die Aussage des überlieferten SBLGNT-Textes, ohne über Art und Umfang der Behinderung oder Heilung mehr festzulegen, als der griechische Ausdruck erkennen lässt.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Aufzählung behält die knappen Kontraste des Griechischen bei. Personenbezogene Formulierungen werden dort verwendet, wo sie Genauigkeit und respektvolle Sprache fördern.
