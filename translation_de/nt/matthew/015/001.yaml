  language: de
  text: 'Dann kommen Pharisäer und Schriftgelehrte aus Jerusalem zu Jesus und sagen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Als knapper zeitlicher Erzählmarker führt das Wort natürlich in die nächste Szene ein.
- source_word: προσέρχονται
  choice: kommen ... zu
  rationale: Die idiomatische deutsche Wendung gibt die Bewegung auf Jesus zu wieder und bewahrt das historische Präsens des griechischen Textes.
- source_word: τῷ Ἰησοῦ
  choice: zu Jesus
  rationale: Der Dativ bezeichnet bei προσέρχομαι die Person, der man sich nähert.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: aus Jerusalem
  rationale: ἀπό bezeichnet hier die Herkunft; bei Städten ist „aus Jerusalem“ im Deutschen natürlich.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Die etablierte deutsche Bezeichnung für diese jüdische Gruppierung.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die etablierte und kontextuell treffende deutsche Bezeichnung für schrift- und gesetzeskundige Fachleute.
- source_word: καὶ
  choice: und
  rationale: Gibt die einfache Verbindung der beiden Gruppen wieder.
- source_word: λέγοντες
  choice: und sagen
  rationale: Das präsentische Partizip leitet die folgende direkte Rede ein; die finite Koordination klingt im modernen Deutschen natürlich und erhält das Präsens.
theological_decisions:
- issue: Historisches Präsens
  choice: Präsens beibehalten („kommen“, „sagen“)
  alternative: Vergangenheit verwenden („kamen“, „sagten“)
  rationale: Das griechische Präsens vergegenwärtigt das Geschehen; im Deutschen ist es an dieser Stelle verständlich und bewahrt diese Erzählwirkung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. „Schriftgelehrte“ ist im Deutschen geläufig und macht eine zusätzliche lexikalische Fußnote nicht erforderlich.
