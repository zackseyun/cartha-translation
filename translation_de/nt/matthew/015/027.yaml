id: MAT.15.27
reference: Matthew 15:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: de
  text: 'Sie aber sagte: »Ja, Herr,[a] denn auch die kleinen Hunde fressen von den Krümeln, die vom Tisch ihrer Herren fallen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Herr« kann hier auch als ehrerbietige Anrede im Sinn von »mein Herr« verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Ja
  rationale: Die schlichte Zustimmung gibt die bejahende Antwort natürlich wieder und bewahrt, dass die Frau an Jesu Bild anknüpft.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« ist die übliche Evangelienwiedergabe und lässt sowohl eine ehrerbietige Anrede als auch eine weitergehende Anerkennung der Autorität Jesu zu.
- source_word: καὶ γὰρ
  choice: denn auch
  rationale: '»Denn« bewahrt die begründende Funktion, »auch« die additive Pointe: Die Frau widerspricht dem Bild nicht, sondern führt es zu ihren Gunsten weiter.'
- source_word: κυνάρια
  choice: die kleinen Hunde
  rationale: Die Verkleinerungsform wird hörbar gemacht, ohne sie enger als »Welpen« oder ausdrücklich als »Haushunde« festzulegen.
- source_word: ἐσθίει
  choice: fressen
  rationale: Im Deutschen bezeichnet »fressen« idiomatisch das Essen von Tieren; der Singular des griechischen Verbs bei einem sächlichen Pluralsubjekt wird regelgerecht im deutschen Plural wiedergegeben.
- source_word: ψιχίων
  choice: Krümeln
  rationale: »Krümel« bezeichnet treffend die kleinen Speisereste im Tischbild.
- source_word: τῶν πιπτόντων
  choice: die … fallen
  rationale: Ein Relativsatz ist im Deutschen natürlich und bewahrt den allgemeinen beziehungsweise fortlaufenden Sinn des Präsenspartizips.
- source_word: τραπέζης
  choice: Tisch
  rationale: Die gewöhnliche Bedeutung passt unmittelbar zum häuslichen Bild.
- source_word: τῶν κυρίων αὐτῶν
  choice: ihrer Herren
  rationale: Das wiederholte Wort κύριος wird formal sichtbar gehalten. Hier bezeichnet es im Bild die Herren beziehungsweise Besitzer der Hunde; der Plural des griechischen Textes bleibt erhalten.
theological_decisions:
- issue: Anrede κύριε an Jesus
  choice: Herr
  alternative: Herr im Sinn einer höflichen Anrede wie »mein Herr«
  rationale: Die Übersetzung bewahrt die im Matthäusevangelium übliche und theologisch offene Anrede, ohne zu entscheiden, ob sie hier ausschließlich höflich oder zugleich als Bekenntnis gemeint ist.
- issue: Verkleinerungsform κυνάρια
  choice: kleine Hunde
  alternative: Hunde; Haushunde; Hündchen
  rationale: »Kleine Hunde« bildet die Verkleinerungsform ab, ohne das harte Bild zu beseitigen oder durch »Hündchen« verniedlichend zu färben.
- issue: Wiederholung von κύριος in Anrede und Gleichnisbild
  choice: Herr / Herren
  alternative: Herr / Besitzer
  rationale: Die lexikalische Wiederholung des Griechischen bleibt erkennbar, während der Kontext den unterschiedlichen Bezug klar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung »Sie aber sagte« erhält den kontrastiven Anschluss von ἡ δέ. »Fressen« ist bei Tieren idiomatisch und nicht abwertend gemeint. Der Gedankenstrich beziehungsweise die deutsche Zeichensetzung wurde zugunsten eines flüssigen Zitats schlicht gehalten.
