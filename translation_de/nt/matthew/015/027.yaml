  terminology: »Herr« bewahrt bei der Anrede Jesu die angemessene Offenheit zwischen respektvoller Anrede und möglicher weitergehender Bedeutung. »Herren« ist im Gleichnisbild idiomatisch für die menschlichen Besitzer der Hunde und erhält zugleich die griechische Wortwiederholung. »Kleine Hunde« bildet die Diminutivform ohne unzulässige Verniedlichung ab.
