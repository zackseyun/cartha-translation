  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes zuverlässig wieder: die kontrastive Einleitung, die Zustimmung, die Anrede κύριε, die begründend-additive Verbindung καὶ γάρ, die Verkleinerungsnuance von κυνάρια, das Essen der Tiere, die Krümel, ihr Fallen vom Tisch und den Plural τῶν κυρίων αὐτῶν. »Von den Krümeln« ist für ἀπό idiomatisch und sachgerecht.'
