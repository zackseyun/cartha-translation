id: MAT.15.29
reference: Matthew 15:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: de
  text: Jesus zog von dort weiter und kam am See von Galiläa entlang.[a] Nachdem er auf den Berg hinaufgestiegen war, saß er dort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kam an den See von Galiläa“. Die griechische Präposition kann sowohl eine Bewegung am Ufer entlang als auch das Gelangen in die Nähe des Sees bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „setzte er sich dort hin“. Der griechische Imperfekt stellt jedoch eher den andauernden Zustand dar: Er saß dort.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: zog von dort weiter
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Bewegung vom bisherigen Ort weg. „Zog von dort weiter“ gibt dies in natürlichem deutschem Erzählstil wieder.
- source_word: ἦλθεν
  choice: kam
  rationale: Der narrative Aorist von ἔρχομαι wird direkt mit „kam“ wiedergegeben.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: am See von Galiläa entlang
  rationale: παρά mit Akkusativ kann bei einem Bewegungsverb eine Bewegung entlang des Ufers bezeichnen. Die Formulierung wahrt zugleich die Nähe zum See.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: Nachdem er auf den Berg hinaufgestiegen war
  rationale: Das Aoristpartizip drückt eine vorausgehende Handlung aus; „nachdem“ macht die zeitliche Abfolge im Deutschen klar. εἰς mit ἀναβαίνω bezeichnet hier die Bewegung auf den Berg hinauf.
- source_word: ἐκάθητο ἐκεῖ
  choice: saß er dort
  rationale: Der Imperfekt von κάθημαι beschreibt den andauernden Zustand des Sitzens. „Saß er dort“ bewahrt diesen Aspekt besser als das punktuelle „setzte er sich dort hin“.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. „See von Galiläa“ ist verständliches Standarddeutsch; die participialen Abfolgen werden ohne unnötige Schachtelung wiedergegeben.
