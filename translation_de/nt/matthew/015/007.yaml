id: MAT.15.7
reference: Matthew 15:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: de
  text: 'Ihr Heuchler! Jesaja hat treffend[a] über euch prophezeit, als er sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gut; auch: zu Recht.'
    reason: καλῶς kann hier die Prophetie als gut, richtig oder passend charakterisieren; „treffend“ ist kontextuell natürlich, schöpft die Bedeutungsbreite aber nicht vollständig aus.
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ihr Heuchler!
  rationale: Der Vokativ Plural ist eine direkte, scharfe Anrede. Das ergänzte „Ihr“ macht die Anredefunktion im heutigen Deutsch deutlich; „Heuchler“ bewahrt das moralisch-religiöse Gewicht.
- source_word: καλῶς
  choice: treffend
  rationale: Das Adverb bewertet Jesajas Prophetie als passend und zutreffend auf die Angeredeten bezogen. „Treffend“ ist in diesem Zusammenhang natürlicher und präziser als das formal nähere „gut“.
- source_word: ἐπροφήτευσεν
  choice: hat … prophezeit
  rationale: Das Perfekt gibt den griechischen Aorist in natürlichem modernem Deutsch wieder und erhält den ausdrücklichen prophetischen Bezug.
- source_word: περὶ ὑμῶν
  choice: über euch
  rationale: Gibt περί mit Genitiv idiomatisch und sachlich genau als Bezug der Prophetie auf die Angeredeten wieder.
- source_word: Ἠσαΐας
  choice: Jesaja
  rationale: Verwendet die etablierte deutsche Namensform des Propheten.
- source_word: λέγων
  choice: 'als er sagte:'
  rationale: Der Partizipialausdruck leitet das folgende Zitat ein. Die finite deutsche Form klingt natürlich und macht den zeitlich-begleitenden Zusammenhang deutlich.
theological_decisions:
- issue: Stärke der direkten Anklage Jesu
  choice: „Ihr Heuchler!“ als unverhüllte verurteilende Anrede
  alternative: Eine abgeschwächte Wiedergabe wie „Ihr Schauspieler“ oder „Ihr Heuchler,“ ohne eigenständigen Ausruf
  rationale: ὑποκριταί trägt im Kontext eine starke moralisch-religiöse Anklage. Eine Abschwächung würde Jesu Urteil und die Verbindung zum folgenden Jesajazitat mindern.
- issue: Aussage von καλῶς über Jesajas Prophetie
  choice: „treffend“ im Sinn von passend beziehungsweise zutreffend
  alternative: „gut“ oder „zu Recht“
  rationale: Der griechische Ausdruck kann die Güte, Richtigkeit oder besondere Angemessenheit der Prophetie bezeichnen. „Treffend“ wahrt den Kontextbezug, ohne eine unnötig enge dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze Ausruf erhält die Schärfe der Anrede; der anschließende Satz bleibt gut vorlesbar und führt unmittelbar in das folgende Zitat.
