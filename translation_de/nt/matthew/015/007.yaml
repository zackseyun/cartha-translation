  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die scharfe Anrede im Vokativ („Ihr Heuchler!“), die positive Bewertung durch καλῶς („treffend“), Jesaja als Subjekt, den Bezug „über euch“ sowie die Einführung des folgenden Zitats. Das deutsche Perfekt ist eine natürliche Wiedergabe des griechischen Aorists; „als er sagte“ erfüllt idiomatisch die zitateinleitende Funktion von λέγων.'
  naturalness: „Ihr Heuchler! Jesaja hat treffend über euch prophezeit, als er sagte:“ ist klares, modernes und zugleich würdiges Standarddeutsch. Die Ausrufsform transportiert die rhetorische Schärfe der Anrede angemessen.
  terminology: „Heuchler“ ist für ὑποκριταί die etablierte und im Kontext treffende Wiedergabe. „Jesaja“ entspricht der deutschen Standardnamensform. „Treffend“ gibt die kontextuelle Bedeutung von καλῶς gut wieder, ohne die Aussage zu überdehnen. Die Fußnote dokumentiert die mögliche Nähe zu „gut“ bzw. „zu Recht“ ausreichend.
