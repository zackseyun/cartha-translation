- from: Er nahm die sieben Brote und die Fische, dankte, brach sie auseinander und gab sie immer wieder den Jüngern; die Jünger gaben sie an die vielen Menschen weiter.
  to: Er nahm die sieben Brote und die Fische. Nachdem er gedankt hatte, brach er sie und gab sie immer wieder den Jüngern; die Jünger gaben sie den Menschenmengen weiter.
  rationale: Die Überarbeitung stellt die dem Brechen vorausgehende Danksagung ausdrücklich dar, ersetzt die unidiomatische Verstärkung „auseinander“ und gibt ὄχλοι als „Menschenmengen“ genauer wieder. „Immer wieder“ erhält die iterative bzw. fortlaufende Nuance des Imperfekts ἐδίδου. Die im griechischen Schlussteil vorhandene Ellipse wird, wie im Deutschen nötig, knapp ergänzt.
