  - severity: low
    issue: „die vielen Menschen“ ist für οἱ ὄχλοι weniger präzise als eine Bezeichnung für Gruppen bzw. Mengen.
    rationale: ὄχλοι meint hier die versammelten Menschenmengen bzw. Volksmengen. „Menschenmengen“ bewahrt diesen kollektiven Charakter ohne zusätzliche Interpretation.
