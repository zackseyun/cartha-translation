    rationale: Die bloße Reihung „dankte, brach“ ist verständlich, gibt aber die durch das aoristische Partizip markierte vorausgehende Danksagung weniger deutlich wieder. „Nachdem er gedankt hatte“ bildet die Abfolge präzise und natürlich ab.
  - severity: low
