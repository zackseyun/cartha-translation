  naturalness: „Brach sie auseinander“ wirkt unnötig umschreibend; „brach sie“ ist die idiomatische Erzählform. „Menschenmengen“ ist als Wiedergabe von ὄχλοι genauer als „viele Menschen“, da Letzteres den Begriff zu einer bloßen Personenanzahl abschwächt.
  terminology: „Brote“, „Fische“, „Jünger“ und „dankte“ sind sachgemäß und registergerecht. Keine sakramentale oder sonstige theologische Ausdeutung wird in den Text eingetragen.
