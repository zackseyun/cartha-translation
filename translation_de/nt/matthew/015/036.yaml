  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: de
  text: Er nahm die sieben Brote und die Fische. Nachdem er gedankt hatte, brach er sie und gab sie immer wieder den Jüngern; die Jünger gaben sie den Menschenmengen weiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Das Verb eröffnet die Abfolge der Handlungen Jesu; „nahm“ ist hier die natürliche und sachlich genaue deutsche Entsprechung.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: die sieben Brote
  rationale: ἄρτοι bezeichnet in diesem Speisungsbericht konkrete Brote; „Brote“ ist im Deutschen anschaulich und idiomatisch.
- source_word: τοὺς ἰχθύας
  choice: die Fische
  rationale: Der bestimmte Artikel und der Plural des griechischen Ausdrucks werden direkt wiedergegeben.
- source_word: εὐχαριστήσας
  choice: dankte
  rationale: Das Partizip bezeichnet eine der folgenden Handlung vorausgehende Danksagung. Die koordinierte deutsche Form gibt die zeitliche Abfolge natürlich wieder, ohne ein im Griechischen nicht genanntes Objekt wie „Gott“ hinzuzufügen.
- source_word: ἔκλασεν
  choice: brach sie auseinander
  rationale: κλάω bezeichnet hier das Brechen der Speise zur Verteilung. Das Pronomen wird aus dem Zusammenhang ergänzt, wie es natürliches Deutsch erfordert.
- source_word: ἐδίδου
  choice: gab sie immer wieder
  rationale: Der Imperfekt stellt die fortlaufende beziehungsweise wiederholte Ausgabe während der Verteilung dar; „immer wieder“ macht diesen Aspekt verständlich.
- source_word: τοῖς μαθηταῖς
  choice: den Jüngern
  rationale: Der Dativ bezeichnet die Empfänger. Ein Possessivpronomen wird nicht ergänzt, da es im griechischen Text nicht ausdrücklich steht.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: die Jünger gaben sie an die vielen Menschen weiter
  rationale: Die im Griechischen elliptisch ausgelassene Verbalhandlung wird im Deutschen ergänzt. „Die vielen Menschen“ gibt die gemeinten Volksmengen natürlicher wieder als das schwerfällige „Menschenmengen“; „weiter“ verdeutlicht die Vermittlung durch die Jünger.
theological_decisions:
- issue: Möglicher eucharistischer Anklang von εὐχαριστήσας
  choice: Die gewöhnliche erzählerische Handlung wird mit „dankte“ wiedergegeben.
  alternative: Eine stärker liturgisch geprägte Formulierung wie „sprach das Dankgebet“ verwenden.
  rationale: Die Wortwahl kann an spätere Abendmahlstexte erinnern, doch an dieser Stelle wird zunächst Jesu Danksagung über der Speise erzählt. Die Übersetzung soll keine sakramentale Deutung in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufende Verteilung wird durch „immer wieder“ ausgedrückt; die griechische Ellipse im letzten Satzteil wird für ein klares deutsches Verständnis aufgelöst.
