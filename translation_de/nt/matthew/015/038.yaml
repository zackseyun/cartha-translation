  source_fidelity: 'Der Text gibt die griechische Zählaussage zuverlässig wieder: Die Zahl bezieht sich ausdrücklich auf viertausend Männer; Frauen und Kinder sind von dieser Zahl ausgeschlossen. Der vollendete deutsche Relativsatz („die gegessen hatten“) gibt die kontextuell abgeschlossene Handlung des präsentischen Partizips ἐσθίοντες idiomatisch wieder. Das schwache Anschlusswort δέ muss im Deutschen nicht eigens abgebildet werden.'
  naturalness: „Die Zahl der Männer, die gegessen hatten, betrug viertausend, Frauen und Kinder nicht mitgerechnet“ ist klares, modernes Standarddeutsch und für einen sachlichen Erzählzusammenhang angemessen. Die Umformung mit „Die Zahl ... betrug“ ist idiomatisch und verändert die Aussage nicht.
  terminology: „Männer“ bewahrt die spezifische Bedeutung von ἄνδρες und die anschließende Unterscheidung von „Frauen und Kinder“. „Nicht mitgerechnet“ gibt χωρίς in diesem Zählkontext präzise und natürlich wieder. Keine Fußnote ist erforderlich, da die Ausschlussrelation im Haupttext eindeutig ausgedrückt ist.
