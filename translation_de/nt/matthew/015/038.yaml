  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: de
  text: Die Zahl der Männer, die gegessen hatten, betrug viertausend, Frauen und Kinder nicht mitgerechnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: die Männer, die gegessen hatten
  rationale: Der substantivierte Partizipialausdruck bezeichnet diejenigen, die an der soeben beendeten Mahlzeit teilgenommen hatten. Im Deutschen gibt der vollendete Nebensatz den Zusammenhang natürlich wieder; δέ ist hier nur ein schwaches Anschlusswort und muss nicht eigens markiert werden.
- source_word: ἦσαν τετρακισχίλιοι
  choice: Die Zahl … betrug viertausend
  rationale: Die deutsche Zählformulierung gibt die Kopula mit dem Zahlprädikat klar und idiomatisch wieder.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich Männer, nicht Menschen allgemein; Frauen und Kinder werden anschließend gesondert genannt.
- source_word: χωρὶς
  choice: nicht mitgerechnet
  rationale: χωρίς zeigt hier, dass Frauen und Kinder in der genannten Zahl nicht enthalten sind. Diese Wiedergabe macht die rechnerische Beziehung eindeutig und natürlich verständlich.
- source_word: γυναικῶν καὶ παιδίων
  choice: Frauen und Kinder
  rationale: Die allgemeinen Bezeichnungen entsprechen dem Kontext; γυνή wird nicht unnötig auf Ehefrauen und παιδίον nicht auf eine engere Altersgruppe beschränkt.
theological_decisions:
- issue: Geschlechtsspezifische Zählformel
  choice: Die viertausend werden ausdrücklich als Männer bezeichnet; Frauen und Kinder sind nicht mitgerechnet.
  alternative: „viertausend Menschen“
  rationale: Die inklusive Alternative würde die im griechischen Text ausdrücklich vorgenommene Unterscheidung zwischen Männern einerseits sowie Frauen und Kindern andererseits verwischen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur vermeidet ein schwerfälliges wörtliches „Die Essenden waren viertausend Männer“, bewahrt aber die genaue Zählaussage des griechischen Textes.
