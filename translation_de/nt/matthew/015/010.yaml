  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: de
  text: 'Und er rief die Menschenmenge zu sich und sagte zu ihnen: »Hört zu und versteht!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der Anschluss führt die Erzählung schlicht weiter; »Und« bewahrt die griechische Koordination, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: προσκαλεσάμενος
  choice: er rief … zu sich
  rationale: Das Partizip Aorist bezeichnet eine dem Sprechen vorausgehende bzw. damit eng verbundene Handlung. Die finite deutsche Form mit »und« klingt natürlich und wahrt die gerichtete Bedeutung von προσκαλέομαι.
- source_word: τὸν ὄχλον
  choice: die Menschenmenge
  rationale: ὄχλος bezeichnet hier die versammelte Menge. »Menschenmenge« ist gegenwärtiges Standarddeutsch und genauer als das allgemeinere »Leute«.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Die Formulierung gibt λέγω mit dem Dativobjekt αὐτοῖς direkt und idiomatisch wieder.
- source_word: Ἀκούετε
  choice: Hört zu
  rationale: Der Imperativ fordert nicht nur akustisches Hören, sondern aufmerksames Zuhören. »Hört zu« ist im modernen Deutsch natürlicher als das isolierte »Hört«.
- source_word: συνίετε
  choice: versteht
  rationale: συνίημι fordert dazu auf, den Sinn des Gehörten zu erfassen. »Versteht« bewahrt die knappe, parallele Imperativform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Satzstruktur bildet den knappen griechischen Erzählstil natürlich ab; die beiden Imperative bleiben unmittelbar und nachdrücklich.
