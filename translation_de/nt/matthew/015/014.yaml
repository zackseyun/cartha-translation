id: MAT.15.14
reference: Matthew 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: de
  text: Lasst sie; sie sind blinde Führer von Blinden. Wenn aber ein Blinder einen Blinden führt, werden beide in eine Grube fallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einen Graben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Lasst sie
  rationale: Der Aoristimperativ von ἀφίημι bedeutet hier, die betreffenden Personen gewähren zu lassen beziehungsweise sich nicht weiter um sie zu kümmern. „Lasst sie“ ist knapp, natürlich und wahrt die offene Nuance des griechischen Ausdrucks.
- source_word: τυφλοί
  choice: blinde
  rationale: Das Adjektiv bezeichnet hier metaphorisch fehlende Einsicht. Die Bildsprache bleibt ohne erklärenden Zusatz erhalten.
- source_word: ὁδηγοὶ τυφλῶν
  choice: Führer von Blinden
  rationale: ὁδηγός bezeichnet einen Führer oder Wegweiser. „Führer von Blinden“ bildet die Genitivkonstruktion kompakt ab und bereitet die folgende sprichwörtliche Aussage vor.
- source_word: τυφλὸς ... τυφλὸν
  choice: ein Blinder ... einen Blinden
  rationale: Die substantivierten maskulinen Singularformen werden formgetreu wiedergegeben. Im Deutschen ist diese Form in einem allgemeinen Sprichwort idiomatisch und repräsentativ.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert eine leichte Gegenüberstellung beziehungsweise Weiterführung; „aber“ passt zum warnenden Übergang.
- source_word: ἐὰν ὁδηγῇ
  choice: wenn ... führt
  rationale: ἐάν mit dem Präsens Konjunktiv formuliert eine allgemeine Bedingung. Das deutsche Präsens mit „wenn“ gibt sie natürlich wieder.
- source_word: ἀμφότεροι
  choice: beide
  rationale: Die inklusive Zweizahl wird knapp und eindeutig wiedergegeben.
- source_word: εἰς βόθυνον
  choice: in eine Grube
  rationale: βόθυνος kann eine Grube, einen Graben oder ein Loch bezeichnen. „Grube“ bewahrt das anschauliche Bild und ist im Deutschen breit verständlich.
- source_word: πεσοῦνται
  choice: werden ... fallen
  rationale: Die Futurform bezeichnet die eintretende Folge der Bedingung und wird mit dem deutschen Futur wiedergegeben.
theological_decisions:
- issue: Metaphorische Bedeutung der Blindheit
  choice: Die Bildrede „blind“ bleibt im Haupttext unerklärt stehen.
  alternative: „geistlich blind“ oder „ohne Einsicht“
  rationale: Eine ausdrückliche Deutung würde die Metapher über den Wortlaut hinaus festlegen und ihre rhetorische Spannung abschwächen.
- issue: Geschlechtliche Form des Sprichworts
  choice: „ein Blinder ... einen Blinden“
  alternative: „ein blinder Mensch ... einen blinden Menschen“
  rationale: Der griechische Text verwendet den grammatisch maskulinen Singular als repräsentative Sprichwortform. Die deutsche substantivierte Form wahrt sowohl Gestalt als auch allgemeinen Geltungsanspruch.
- issue: Art der Führungsrolle
  choice: „Führer“ als Bestandteil der Wegmetapher
  alternative: „Leiter“
  rationale: „Leiter“ könnte stärker eine institutionelle Stellung nahelegen. „Führer“ hält die konkrete Vorstellung des Wegführens fest, die im nächsten Satz aufgenommen wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Bildkraft. „Lasst sie“ vermeidet eine unnötige Ausdeutung; „Führer“ wird hier klar innerhalb der Wegmetapher gebraucht. Der Fußnotenmarker steht unmittelbar nach der davon betroffenen Satzaussage.
