  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: de
  text: 'Und da kam eine kanaanäische Frau aus jener Gegend heraus und rief immer wieder: „Hab Erbarmen mit mir, Herr, Sohn Davids! Meine Tochter ist schwer von einem Dämon besessen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Tochter wird von einem Dämon schwer gequält.“'
    reason: 'Lexikalische Alternative: δαιμονίζεται bezeichnet dämonische Einwirkung; die genaue Art dieser Einwirkung wird durch das Verb nicht näher bestimmt.'
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und vergegenwärtigenden Charakter des Erzählmarkers, ohne ihn auszulassen.
- source_word: Χαναναία
  choice: kanaanäische Frau
  rationale: Gibt Matthäus’ ausdrückliche ethnische Bezeichnung wieder und ersetzt sie nicht durch die Bezeichnung aus der markinischen Parallele.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: aus jener Gegend
  rationale: ὅρια bezeichnet hier Gebiet oder Region; der deutsche Singular ist idiomatisch und gibt den räumlichen Sinn zuverlässig wieder.
- source_word: ἐξελθοῦσα
  choice: die … herauskam
  rationale: Das Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben; „herauskam“ wahrt die Bewegung aus dem genannten Gebiet.
- source_word: ἔκραζεν
  choice: rief immer wieder
  rationale: Die imperfektive Form legt einen andauernden oder wiederholten Ruf nahe; „immer wieder“ macht diesen Aspekt in natürlichem Deutsch sichtbar.
- source_word: Ἐλέησόν με
  choice: Hab Erbarmen mit mir
  rationale: Gängige, dringliche Wiedergabe des Imperativs, die den biblischen Begriff des Erbarmens bewahrt.
- source_word: κύριε
  choice: Herr
  rationale: Im Zusammenhang mit „Sohn Davids“ bewahrt „Herr“ die ehrerbietige und möglicherweise messianische Tragweite, ohne sie abschließend festzulegen.
- source_word: υἱὸς Δαυίδ
  choice: Sohn Davids
  rationale: Die wörtliche Wiedergabe erhält den davidisch-königlichen und messianischen Titel.
- source_word: κακῶς
  choice: schwer
  rationale: Drückt die Intensität des leidvollen Zustands idiomatisch aus und verbindet sich im Deutschen natürlich mit „gequält“.
- source_word: δαιμονίζεται
  choice: wird von einem Dämon … gequält
  rationale: Gibt die klare dämonische Verursachung wieder, ohne mit „besessen“ eine präzisere Art der Einwirkung festzulegen, als das griechische Verb zwingend erkennen lässt.
theological_decisions:
- issue: Bedeutung von κύριε in der messianisch gefärbten Anrede
  choice: Herr
  alternative: mein Herr / Herr Jesus / Meister
  rationale: „Herr“ wahrt sowohl eine ehrerbietige Anrede als auch eine mögliche tiefere christologische Bedeutung. Der Text selbst sollte nicht zu einer ausdrücklich voll entwickelten Bekenntnisformel erweitert werden.
- issue: Art der mit δαιμονίζεται bezeichneten dämonischen Einwirkung
  choice: wird von einem Dämon schwer gequält
  alternative: ist schwer von einem Dämon besessen
  rationale: Das Verb bezeichnet einen Zustand unter dämonischer Einwirkung, legt aber dessen genaue Phänomenologie nicht zweifelsfrei fest. Die Hauptfassung bewahrt diese Offenheit; die traditionelle Wiedergabe mit „besessen“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ erhält den markierten Erzählauftakt; „rief immer wieder“ bildet den imperfektiven Aspekt ab. Die direkte Rede ist eindringlich, aber nicht archaisierend.
