source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: de
  text: Denn aus dem Herzen kommen böse Gedanken, Mordtaten, Ehebrüche, sexuelle Unmoral, Diebstähle, falsche Zeugenaussagen und Verleumdungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Lästerungen. Das griechische Wort kann je nach Zusammenhang sowohl verleumderische Rede gegen Menschen als auch Lästerung gegen Gott bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Denn aus dem Herzen
  rationale: γάρ leitet die Begründung ein, ἐκ bezeichnet den Ursprung. „Aus dem Herzen“ bewahrt das biblische Bild vom inneren Menschen als Quelle des Handelns.
- source_word: ἐξέρχονται
  choice: kommen
  rationale: In Verbindung mit „aus dem Herzen“ gibt „kommen“ die Bewegung aus einem Ursprung natürlich und treffend wieder.
- source_word: διαλογισμοὶ πονηροί
  choice: böse Gedanken
  rationale: διαλογισμοί kann Gedanken, Überlegungen oder Erwägungen bezeichnen. „Böse Gedanken“ ist verständlich und legt den Ausdruck nicht unnötig auf ausgearbeitete Pläne fest.
- source_word: φόνοι
  choice: Mordtaten
  rationale: Der Ausdruck bezeichnet Morde beziehungsweise vorsätzliche Tötungsverbrechen. „Mordtaten“ erhält den moralischen Ernst und fügt sich im Deutschen natürlich in die Aufzählung ein.
- source_word: μοιχεῖαι
  choice: Ehebrüche
  rationale: Die Wiedergabe erhält den griechischen Plural und bezeichnet konkrete Fälle von Ehebruch.
- source_word: πορνεῖαι
  choice: sexuelle Unmoral
  rationale: πορνεῖαι umfasst unerlaubtes sexuelles Verhalten in einem breiten Sinn. Der deutsche Sammelbegriff ist gegenwärtig und vermeidet die zu enge oder altertümliche Wiedergabe „Unzucht“.
- source_word: κλοπαί
  choice: Diebstähle
  rationale: Die direkte deutsche Entsprechung bewahrt den Plural und die knappe Form der Lasteraufzählung.
- source_word: ψευδομαρτυρίαι
  choice: falsche Zeugenaussagen
  rationale: Die Formulierung wahrt den Bezug auf unwahre Zeugenaussagen und gibt den griechischen Plural natürlich wieder.
- source_word: βλασφημίαι
  choice: Verleumdungen
  rationale: βλασφημία kann ehrverletzende Rede gegen Menschen oder Lästerung gegen Gott bezeichnen. In dieser allgemeinen Lasterliste ist „Verleumdungen“ eine natürliche Wiedergabe; die andere mögliche Bedeutung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezugsbereich von βλασφημίαι
  choice: Verleumdungen
  alternative: Lästerungen
  rationale: Der Zusammenhang nennt allgemein aus dem Herzen hervorgehende Verfehlungen und bestimmt kein ausdrückliches göttliches Gegenüber. Daher steht die gegen Menschen gerichtete Bedeutung im Haupttext, während die mögliche religiöse Bedeutung nicht ausgeschlossen, sondern in der Fußnote genannt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die nominale Lasteraufzählung des griechischen Textes bleibt erhalten; bei πορνεῖαι wird zugunsten natürlicher deutscher Ausdrucksweise ein Sammelbegriff verwendet.
