id: MAT.15.12
reference: Matthew 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: de
  text: 'Da kamen die Jünger zu ihm und sagten: „Weißt du, dass die Pharisäer Anstoß genommen haben, als sie dieses Wort[b] hörten?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anstoß nahmen“; wörtlicher: „zum Straucheln gebracht wurden“.'
    reason: lexical_alternative
  - marker: b
    text: „Dieses Wort“ bezieht sich auf die unmittelbar vorausgehende Aussage Jesu.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet in natürlichem deutschem Erzählstil das unmittelbar folgende Geschehen ein.
- source_word: προσελθόντες
  choice: kamen ... zu ihm
  rationale: Gibt das vorzeitige Partizip zusammen mit dem folgenden Redeverb idiomatisch als koordinierte Handlung wieder.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Entspricht dem bestimmten griechischen Ausdruck, ohne das im Ausgangstext nicht ausdrücklich vorhandene Possessivpronomen „seine“ einzufügen.
- source_word: λέγουσιν αὐτῷ
  choice: sagten
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil im Präteritum wiedergegeben; der Adressat ist bereits durch „zu ihm“ genannt.
- source_word: Οἶδας
  choice: Weißt du
  rationale: Direkte und ungekünstelte Wiedergabe der Frage, ohne sie durch „Ist dir klar“ stärker auszudeuten.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Etablierte deutsche Bezeichnung der religiösen Gruppe.
- source_word: ἀκούσαντες τὸν λόγον
  choice: an diesem Wort
  rationale: Der kausale beziehungsweise zeitliche Bezug auf das Hören wird im Deutschen idiomatisch in die feste Verbindung „an etwas Anstoß nehmen“ eingebunden; „diesem Wort“ verweist auf Jesu unmittelbar vorausgehende Aussage.
- source_word: ἐσκανδαλίσθησαν
  choice: Anstoß genommen haben
  rationale: Gibt die negative Reaktion der Pharisäer idiomatisch wieder und bewahrt zugleich mehr vom Bildfeld des griechischen Verbs als das allgemeinere „waren beleidigt“.
theological_decisions:
- issue: Bedeutung von σκανδαλίζω in der Reaktion der Pharisäer
  choice: Anstoß genommen haben
  alternative: sind zu Fall gebracht worden; waren empört
  rationale: Im Zusammenhang bezeichnet das Verb die ablehnende Reaktion auf Jesu Aussage. „Anstoß nehmen“ lässt die bildhafte Bedeutung des Verbs anklingen, ohne hier einen moralischen oder heilsgeschichtlichen Fall festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da kamen ... und sagten“ bildet die griechische Partizipialkonstruktion natürlich ab. Die Stellung der Fußnotenmarker ordnet [a] der Wendung über das Anstoßnehmen und [b] dem Bezug von „diesem Wort“ zu.
