id: MAT.15.4
reference: Matthew 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: de
  text: 'Denn Gott hat gesagt: »Ehre deinen Vater und deine Mutter«, und: »Wer Vater oder Mutter beschimpft, muss sterben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer Vater oder Mutter verflucht, muss getötet werden.«'
    reason: Lexikalische Alternative für κακολογέω und explizitere Wiedergabe der rechtlichen Todesstrafformel θανάτῳ τελευτάτω.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Denn Gott
  rationale: γάρ begründet Jesu vorausgehende Aussage. »Denn Gott« gibt den argumentativen Zusammenhang natürlich wieder, ohne durch »Gott selbst« eine zusätzliche Betonung einzutragen.
- source_word: εἶπεν
  choice: hat gesagt
  rationale: λέγω leitet hier Schriftzitate ein. »Hat gesagt« bewahrt den schlichten Wortsinn; »hat geboten« wäre trotz des imperativischen Inhalts stärker als das griechische Verb.
- source_word: Τίμα
  choice: Ehre
  rationale: τιμάω bezeichnet die gebührende Ehrung. »Ehre« erhält das ethische Gewicht des Gebots deutlicher als das schwächere »Respektiere«.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: deinen Vater und deine Mutter
  rationale: Die Possessivpronomen entsprechen der im Zitat aufgenommenen Gebotsform und ergeben im Deutschen eine natürliche, vertraute Formulierung.
- source_word: Ὁ κακολογῶν
  choice: Wer … beschimpft
  rationale: Das substantivierte Partizip wird idiomatisch mit »Wer« wiedergegeben. κακολογέω umfasst übles Reden, Schmähung und Verfluchung; »beschimpft« ist gegenwärtig und verständlich, ohne die Bedeutung auf eine ausdrückliche Fluchformel zu verengen.
- source_word: πατέρα ἢ μητέρα
  choice: Vater oder Mutter
  rationale: Die artikellosen Objekte sind allgemein formuliert. Im Deutschen ist die knappe Wiedergabe ohne ergänzendes Possessivpronomen klar und wahrt diese Allgemeinheit.
- source_word: θανάτῳ τελευτάτω
  choice: muss sterben
  rationale: Die Verbindung aus Dativ und Imperativ ist eine feierliche Todesstrafformel. »Muss sterben« bewahrt deren Unbedingtheit, ohne eine im griechischen Ausdruck nicht ausdrücklich genannte menschliche Vollstreckungsinstanz einzuführen.
theological_decisions:
- issue: Wiedergabe der Todesstrafformel im Schriftzitat
  choice: muss sterben
  alternative: muss getötet werden
  rationale: Das Zitat soll die Härte der gesetzlichen Sanktion unverändert erkennen lassen. Zugleich ist θανάτῳ τελευτάτω hinsichtlich der handelnden Instanz weniger ausdrücklich als ein Verb für »hinrichten«; deshalb steht die stärker vollstreckungsbezogene Fassung in der Fußnote.
- issue: Bedeutungsumfang von κακολογέω
  choice: beschimpft
  alternative: verflucht
  rationale: »Beschimpft« bildet den breiteren Sinn des griechischen Verbs als übles oder schmähendes Reden ab. »Verflucht« ist im alttestamentlichen Rechtskontext ebenfalls möglich, würde im Haupttext jedoch eine enger bestimmte Handlung nahelegen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die vertraute Gebotsform bleibt erhalten; bei der zweiten Zitathälfte werden altertümliche Wendungen wie »des Todes sterben« vermieden. Die Zeichensetzung macht die zwei getrennt eingeführten Schriftzitate sichtbar.
