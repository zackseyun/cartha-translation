  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: de
  text: 'Doch er antwortete ihr kein Wort. Da traten seine Jünger zu ihm und baten ihn immer wieder: »Schick sie weg[a], denn sie schreit hinter uns[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte der Jünger lassen offen, ob Jesus ihre Bitte erfüllen und sie dadurch wegschicken oder sie einfach fortschicken soll.
    reason: alternative_reading
  - marker: b
    text: 'Oder: hinter uns her. Das Griechische kann sowohl die Position hinter ihnen als auch ein Hinterhergehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: antwortete ihr kein Wort
  rationale: Die idiomatische Wendung bewahrt die nachdrückliche Aussage, dass Jesus ihr überhaupt keine Antwort gab.
- source_word: προσελθόντες
  choice: traten … zu ihm
  rationale: Die Form bezeichnet die Bewegung der Jünger auf Jesus zu; „zu ihm treten“ ist im Deutschen natürlich und präzise.
- source_word: ἠρώτουν
  choice: baten ihn immer wieder
  rationale: Der Imperfekt kann eine fortgesetzte oder wiederholte Bitte ausdrücken. „Baten“ gibt ἐρωτάω im Kontext angemessen wieder, ohne die stärkere Bedeutung „anflehen“ einzutragen.
- source_word: Ἀπόλυσον αὐτήν
  choice: Schick sie weg
  rationale: ἀπολύω bedeutet hier, jemanden wegzuschicken oder zu entlassen. Die Formulierung lässt offen, ob Jesus zuvor ihre Bitte erfüllen soll.
- source_word: κράζει
  choice: sie schreit
  rationale: κράζω bezeichnet lautes Rufen oder Schreien. Das Präsens stellt die anhaltende Handlung unmittelbar dar.
- source_word: ὄπισθεν ἡμῶν
  choice: hinter uns
  rationale: Die räumliche Grundbedeutung wird bewahrt; die mögliche Nuance des Hinterhergehens wird in einer Fußnote genannt.
theological_decisions:
- issue: Absicht der Jünger bei Ἀπόλυσον αὐτήν
  choice: Neutral mit „Schick sie weg“ wiedergeben
  alternative: „Erfüll ihre Bitte und schick sie weg“ oder „Schick sie einfach fort“
  rationale: Der griechische Imperativ sagt nicht ausdrücklich, ob die Jünger möchten, dass Jesus die Bitte der Frau erfüllt, bevor sie geht, oder ob er sie lediglich fortschicken soll. Die Übersetzung bewahrt diese erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die fortgesetzte Bitte der Jünger wird idiomatisch wiedergegeben; echte Mehrdeutigkeiten des Ausgangstextes bleiben erhalten.
