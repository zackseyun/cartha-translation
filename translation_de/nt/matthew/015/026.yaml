  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: de
  text: 'Er aber antwortete: „Es ist nicht recht, den Kindern das Brot wegzunehmen und es den kleinen Hunden[a] hinzuwerfen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haushunden“ oder „jungen Hunden“. Im Griechischen steht eine Verkleinerungsform; sie kann kleine Hunde bezeichnen und möglicherweise auch auf Haushunde anspielen. Die genaue Nuance ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: antwortete
  rationale: Die im Griechischen ausführlichere Wendung „antwortend sagte er“ wird im natürlichen modernen Deutsch mit „antwortete“ wiedergegeben; der Bezug auf das Vorangehende bleibt erhalten.
- source_word: καλὸν
  choice: recht
  rationale: Im Zusammenhang bezeichnet καλόν das Angemessene oder Gehörige, nicht lediglich das moralisch Gute. „Recht“ bewahrt die knappe, wertende Aussage.
- source_word: λαβεῖν
  choice: wegzunehmen
  rationale: Das bloße „nehmen“ erhält durch die anschließende Weitergabe an die Hunde im Deutschen natürlich den Sinn des Wegnehmens. Die Wahl macht die Bewegung im Bild deutlich, ohne dessen Referenten auszudeuten.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: den Kindern das Brot
  rationale: Diese idiomatische deutsche Konstruktion gibt die Zugehörigkeitsbeziehung des Genitivs natürlich wieder und erhält „Brot“ als konkretes Bild; τέκνα ist geschlechtsübergreifend „Kinder“.
- source_word: βαλεῖν
  choice: hinzuwerfen
  rationale: Das Verb bewahrt gegenüber einem abgeschwächten „geben“ die anschauliche Wurfbewegung; „hinzuwerfen“ klingt im Deutschen mit dem Dativziel natürlich.
- source_word: τοῖς κυναρίοις
  choice: den kleinen Hunden
  rationale: Die Diminutivform κυνάρια wird formal als „kleine Hunde“ wiedergegeben. Ob speziell Haushunde oder junge Hunde gemeint sind, bleibt in einer Fußnote als lexikalische Möglichkeit offen.
theological_decisions:
- issue: Die Metapher von Kindern, Brot und Hunden kann auf die Rollen der Beteiligten im weiteren Kontext bezogen werden, nennt ihre Referenten in diesem Vers aber nicht ausdrücklich.
  choice: Das Bild wird ohne interpretierende Ergänzung unmittelbar beibehalten.
  alternative: Die Kinder und Hunde im Haupttext ausdrücklich ethnisch oder heilsgeschichtlich zu identifizieren.
  rationale: So bleiben die Schärfe, Mehrdeutigkeit und theologische Spannung der Aussage erhalten, statt durch eine konfessionelle oder auslegende Deutung im Übersetzungstext aufgelöst zu werden.
- issue: Die Diminutivform κυναρίοις kann den Ton des Hundebildes beeinflussen.
  choice: „kleine Hunde“ mit einer sachlichen Fußnote zu möglichen Nuancen.
  alternative: „Hunde“, „Haushunde“ oder „junge Hunde“ ohne Hinweis.
  rationale: „Kleine Hunde“ bildet die Wortform sichtbar ab, ohne aus dem Diminutiv sicher auf Zuneigung, Haustierstatus oder Alter zu schließen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstellung „Er aber antwortete“ bewahrt den kontrastiven Anschluss von ὁ δέ. Das direkte Bild bleibt knapp und pointiert; die Fußnote erklärt nur die lexikalische Spannweite der Diminutivform.
