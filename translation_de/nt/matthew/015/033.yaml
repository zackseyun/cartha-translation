  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: de
  text: 'Da sagten die Jünger zu ihm: „Woher sollen wir an diesem abgelegenen Ort so viele Brote nehmen, dass eine so große Menschenmenge satt wird?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: sagten
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: Der Artikel bezeichnet die aus dem Zusammenhang bekannte Gruppe; ein zusätzliches „seine“ steht nicht ausdrücklich im Griechischen.
- source_word: Πόθεν ἡμῖν
  choice: Woher sollen wir … nehmen
  rationale: Die idiomatische deutsche Frage gibt sowohl die Herkunftsfrage als auch den Dativ des Besitzes bzw. Verfügens wieder, ohne eine Bezugsquelle hinzuzufügen.
- source_word: ἐν ἐρημίᾳ
  choice: an diesem abgelegenen Ort
  rationale: ἐρημία bezeichnet hier eine unbewohnte bzw. einsame Gegend; die Formulierung bleibt räumlich offen und klingt im modernen Deutsch natürlich.
- source_word: ἄρτοι τοσοῦτοι
  choice: so viele Brote
  rationale: Die zählbare Pluralform ἄρτοι und das korrelative τοσοῦτοι werden formal deutlich bewahrt.
- source_word: ὥστε χορτάσαι
  choice: dass … satt wird
  rationale: Die Konstruktion mit ὥστε und Infinitiv bezeichnet das ausreichende Ergebnis; χορτάζω meint, mit Nahrung satt zu machen.
- source_word: ὄχλον τοσοῦτον
  choice: eine so große Menschenmenge
  rationale: „Menschenmenge“ macht den kollektiven Bezug von ὄχλος klar; „so groß“ bewahrt die korrelative Mengenangabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Ratlosigkeit der Jünger bleibt erhalten. „Brote“ wahrt die konkrete Pluralform des Ausgangstextes; „abgelegener Ort“ vermeidet die mögliche Fehlvorstellung einer Sandwüste.
