id: MAT.15.3
reference: Matthew 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: de
  text: 'Er aber antwortete ihnen: „Warum übertretet auch ihr Gottes Gebot wegen eurer Überlieferung?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Er aber antwortete ihnen
  rationale: Die im Griechischen semitisch geprägte Verbindung aus Partizip und finitem Verb wird im natürlichen modernen Deutsch mit „antwortete“ wiedergegeben; „aber“ bewahrt den Übergang zur Gegenrede.
- source_word: Διὰ τί
  choice: Warum
  rationale: Die idiomatische deutsche Frageform gibt die Frage nach dem Grund unmittelbar wieder.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: 'Bewahrt den betonten Rückbezug auf den zuvor erhobenen Vorwurf: Nun werden auch die Fragesteller selbst zur Rechenschaft gezogen.'
- source_word: παραβαίνετε
  choice: übertretet
  rationale: „Übertreten“ entspricht dem Verletzen einer verbindlichen Anordnung und bewahrt den gehobenen biblischen Ton, ohne unverständlich zu sein.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: Gottes Gebot
  rationale: Die natürliche deutsche Genitivfügung wahrt den direkten Gegensatz zwischen dem göttlichen Gebot und der Überlieferung der Angesprochenen.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: um eurer Überlieferung willen
  rationale: διά mit Akkusativ kann hier Grund beziehungsweise Beweggrund ausdrücken. Die Formulierung lässt die Nuance offen, ob die Überlieferung bloß Anlass oder bewusst bevorzugtes Ziel ihres Handelns ist.
theological_decisions:
- issue: Gegensatz zwischen Gottes Gebot und menschlicher Überlieferung
  choice: „Gottes Gebot“ und „eure Überlieferung“ werden ausdrücklich einander gegenübergestellt.
  alternative: παράδοσις als „Lehre“ oder „Brauch“ wiederzugeben.
  rationale: „Überlieferung“ bezeichnet sachgerecht das Weitergegebene und hält die Kritik auf die hier angesprochene Überlieferung begrenzt, ohne jede Tradition pauschal abzuwerten.
- issue: Bedeutungsnuance von διὰ τὴν παράδοσιν ὑμῶν
  choice: „um eurer Überlieferung willen“
  alternative: „wegen eurer Überlieferung“
  rationale: Die gewählte Wendung bewahrt sowohl kausale als auch zweck- beziehungsweise prioritätsbezogene Anklänge und damit die Spannung der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form „antwortete ihnen“ vermeidet die im Deutschen schwerfällige Nachbildung „antwortete und sagte“. „Überlieferung“ und „übertreten“ erhalten den sachlich-biblischen Ton.
