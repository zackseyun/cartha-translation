translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der kollektive Singular „Menschenmenge“ entspricht dem griechischen Singular; der anschließende Rückbezug „die Menschen“ vermeidet ein unnatürliches deutsches Pronomen. Die Satzfolge und Jesu mitfühlende Begründung bleiben eng am griechischen Text.
