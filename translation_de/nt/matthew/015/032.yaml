source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: de
  text: 'Da rief Jesus seine Jünger zu sich und sagte: „Ich habe Erbarmen[a] mit der Menschenmenge, denn sie sind nun schon seit drei Tagen bei mir und haben nichts zu essen. Ich will sie nicht hungrig[b] wegschicken, damit sie nicht etwa unterwegs zusammenbrechen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich empfinde tiefes Mitgefühl mit der Menschenmenge.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ohne Nahrung“ oder „fastend“. Gemeint ist hier nicht ein religiöses Fasten, sondern dass die Menschen nichts gegessen haben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unterwegs vor Erschöpfung schlappmachen“ beziehungsweise „ohnmächtig werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Das mediale Partizip bezeichnet, dass Jesus die Jünger zu sich ruft. Die deutsche Wendung bewahrt diese Richtung und klingt im Erzählzusammenhang natürlich.
- source_word: Σπλαγχνίζομαι
  choice: Ich habe Erbarmen
  rationale: Das Verb bezeichnet tiefes, innerlich bewegtes Mitgefühl. „Erbarmen haben“ wahrt die emotionale Stärke und ist in modernem, würdigem Deutsch verständlich.
- source_word: ὄχλον
  choice: Menschenmenge
  rationale: „Menschenmenge“ gibt ὄχλος im Erzählzusammenhang klar wieder und erlaubt im folgenden Satz den natürlichen Rückbezug „die Menschen“.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: sie ist nun schon seit drei Tagen bei mir geblieben
  rationale: προσμένω bezeichnet anhaltendes Bleiben bei jemandem. „Nun schon seit drei Tagen“ gibt die fortdauernde Zeitspanne im Deutschen idiomatisch wieder.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: hat nichts zu essen
  rationale: Die griechische Wendung besagt schlicht, dass keine Nahrung vorhanden ist; dies ist die natürliche deutsche Entsprechung.
- source_word: ἀπολῦσαι
  choice: wegschicken
  rationale: Im Zusammenhang der versammelten Menschen bezeichnet das Verb ihre Entlassung beziehungsweise das Fortschicken.
- source_word: νήστεις
  choice: hungrig
  rationale: Wörtlich bezeichnet das Wort Menschen, die ohne Nahrung beziehungsweise nüchtern sind. Hier geht es nicht um ein religiöses Fasten; „hungrig“ vermittelt den kontextuellen Sinn natürlich.
- source_word: μήποτε
  choice: damit … nicht etwa
  rationale: Die Formulierung bewahrt den Gedanken eines befürchteten möglichen Ergebnisses, ohne den Ausgang als gewiss darzustellen.
- source_word: ἐκλυθῶσιν
  choice: zusammenbrechen
  rationale: Das Verb kann hier das Erschlaffen oder Zusammenbrechen infolge von Entkräftung bezeichnen. „Zusammenbrechen“ gibt die Ernsthaftigkeit von Jesu Sorge klar wieder.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: „Unterwegs“ ist die natürliche deutsche Wiedergabe für das Geschehen auf dem Heimweg.
