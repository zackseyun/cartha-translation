  terminology: '„Erbarmen“ ist für σπλαγχνίζομαι angemessen und im würdigen Erzählregister verständlich. Die Fußnote zu νήστεις sollte jedoch „nüchtern“ nicht als wörtliche Möglichkeit nennen: Im heutigen Deutsch ist dies missverständlich und trifft hier nicht den maßgeblichen Sinn. „ohne Nahrung“ bzw. „fastend“ und die kontextuelle Erklärung sind genauer. Die Alternativfußnote zu σπλαγχνίζομαι wird sinnvollerweise an „Erbarmen“ verankert, nicht an „Menschenmenge“.'
