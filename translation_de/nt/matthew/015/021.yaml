  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: de
  text: Und Jesus ging von dort weg und zog sich in das Gebiet von Tyrus und Sidon zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging in das Gebiet von Tyrus und Sidon fort“. Das griechische Verb kann neutraler wiedergegeben werden; „zog sich … zurück“ berücksichtigt jedoch seinen wiederkehrenden Gebrauch bei Matthäus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung ohne zusätzliche Gewichtung fort.
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: ging von dort weg
  rationale: Die Wendung gibt die dem Hauptverb vorausgehende Bewegung natürlich wieder, ohne ein Motiv hinzuzufügen.
- source_word: ἀνεχώρησεν
  choice: zog sich … zurück
  rationale: Die Formulierung bewahrt den bei Matthäus wiederkehrenden Beiklang eines Rückzugs, ohne das stärkere und möglicherweise missverständliche „floh“ zu verwenden.
- source_word: εἰς τὰ μέρη
  choice: in das Gebiet
  rationale: Gemeint ist das weitere, mit den Städten verbundene Gebiet; die Formulierung behauptet nicht ausdrücklich, dass Jesus die Städte selbst betrat.
- source_word: Τύρου καὶ Σιδῶνος
  choice: von Tyrus und Sidon
  rationale: Die etablierten deutschen Ortsnamen entsprechen den Genitiven, die das betreffende Gebiet näher bestimmen.
theological_decisions:
- issue: Erzählerische Bedeutung von Jesu Bewegung in ein mit Nichtjuden verbundenes Gebiet
  choice: „zog sich … zurück“ ohne Angabe eines Beweggrundes
  alternative: „ging … fort“ oder stärker „floh“
  rationale: Das Verb kann bei Matthäus einen gezielten Rückzug andeuten, doch der Vers nennt keinen Grund. Die Übersetzung erhält diese Nuance, ohne ein theologisches oder psychologisches Motiv festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Gebiet“ ist idiomatischer als das wörtliche „Gegenden“; die Verbwahl bewahrt die mögliche Nuance des Rückzugs.
