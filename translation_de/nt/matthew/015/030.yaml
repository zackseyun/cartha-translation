id: MAT.15.30
reference: Matthew 15:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: de
  text: Da kamen große Menschenmengen zu ihm. Sie brachten Menschen mit, die nicht sprechen konnten[a], Blinde, Gehbehinderte, Menschen mit beeinträchtigten Gliedmaßen[b] und viele andere. Sie legten sie ihm zu Füßen, und er heilte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nicht hören konnten“; das griechische Wort κωφούς kann je nach Zusammenhang Menschen bezeichnen, die nicht hören, nicht sprechen oder beides nicht können.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort κυλλούς bezeichnet Menschen, deren Gliedmaßen beeinträchtigt, verformt oder verstümmelt sind.
    reason: lexical_scope
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: kamen zu ihm
  rationale: Gibt die erzählerische Bewegung natürlich und genau wieder; „traten an ihn heran“ wäre im heutigen Deutsch unnötig förmlich.
- source_word: ὄχλοι πολλοί
  choice: große Menschenmengen
  rationale: Idiomatic German rendering that conveys the size and plurality of the crowds without the awkward phrase „viele Menschenmengen“.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: Sie brachten Menschen mit
  rationale: 'Makes the contextual force of the participial phrase explicit in natural German: the crowds had these people with them because they brought them to Jesus.'
- source_word: κωφούς
  choice: Menschen, die nicht sprechen konnten
  rationale: κωφός can refer to inability to hear, inability to speak, or both. The chosen wording is clear and respectful, while the genuine lexical ambiguity is retained in a footnote.
- source_word: τυφλούς
  choice: Blinde
  rationale: Direct, established German equivalent in the compact list.
- source_word: χωλούς
  choice: Gehbehinderte
  rationale: Conveys impaired walking in concise modern German and avoids the potentially derogatory effect of the traditional substantivized adjective „Lahme“.
- source_word: κυλλούς
  choice: Menschen mit beeinträchtigten Gliedmaßen
  rationale: Conveys the broad reference to disabled, deformed, or damaged limbs without implying a particular cause and without using unnecessarily harsh language.
- source_word: ἑτέρους πολλούς
  choice: viele andere
  rationale: Natural rendering referring to further people in need beyond the listed groups.
- source_word: ἔρριψαν αὐτούς
  choice: legten sie
  rationale: Although ῥίπτω may literally mean „werfen“, here „legen“ fits the act of bringing people to Jesus and does not add an unwarranted suggestion of rough treatment.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: ihm zu Füßen
  rationale: Natural German idiom preserving the concrete image of placing the people immediately before Jesus.
- source_word: ἐθεράπευσεν αὐτούς
  choice: er heilte sie
  rationale: Standard and contextually precise German wording for Jesus’ healing activity.
theological_decisions: []
