source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: de
  text: der braucht seinen Vater gewiss nicht zu ehren.[a] Und so habt ihr das Wort Gottes[b] wegen eurer Überlieferung außer Kraft gesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ehren“ schließt hier wahrscheinlich auch die praktische Pflicht ein, für die Eltern zu sorgen, nicht nur, ihnen Achtung zu erweisen.
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften haben „das Gebot Gottes“ statt „das Wort Gottes“.
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: der braucht … gewiss nicht zu ehren
  rationale: Die emphatische Verneinung οὐ μή wird durch „gewiss nicht“ bewahrt. Im Zusammenhang gibt die überlieferte Regel vor, die Verpflichtung zur Ehrung des Vaters entfalle; deshalb gibt „braucht … nicht“ den Sinn natürlicher wieder als eine rein zukünftige Aussage.
- source_word: τὸν πατέρα αὐτοῦ
  choice: seinen Vater
  rationale: Die Übersetzung folgt dem ausdrücklich singularischen Wortlaut und erweitert ihn nicht aufgrund des weiteren Zusammenhangs um die Mutter.
- source_word: ἠκυρώσατε
  choice: habt … außer Kraft gesetzt
  rationale: ἀκυρόω bezeichnet das Ungültigmachen beziehungsweise Außerkraftsetzen. Die Formulierung ist im modernen Deutschen klar und gibt den starken Vorwurf wieder.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Dies folgt unmittelbar der SBLGNT-Lesart λόγον. Die Variante „Gebot Gottes“ wird in einer Fußnote dokumentiert.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: durch eure Überlieferung
  rationale: διά mit Akkusativ kann hier den verursachenden Grund beziehungsweise das Mittel bezeichnen. „Durch“ wahrt diese leichte Bedeutungsbreite, ohne das Motiv „um … willen“ hineinzulesen; „Überlieferung“ bezeichnet hier die weitergegebene Lehre oder Regel.
theological_decisions:
- issue: Ob „ehren“ ausdrücklich als materielle Versorgung der Eltern wiederzugeben ist
  choice: Im Haupttext bleibt „ehren“ stehen; eine Fußnote erläutert die praktische Dimension.
  alternative: „unterstützen“ oder „versorgen“
  rationale: τιμάω bedeutet grundsätzlich „ehren“ und nimmt die Sprache des Elterngebots auf. Der Kontext schließt praktische und materielle Fürsorge ein, doch eine engere Wiedergabe im Haupttext würde die Bedeutung stärker festlegen als der griechische Ausdruck.
- issue: Ob der Text an den weiteren Zusammenhang oder an abweichende Handschriften angeglichen werden soll
  choice: Übersetzt werden „seinen Vater“ und „das Wort Gottes“ entsprechend dem vorgelegten SBLGNT-Text.
  alternative: „Vater oder Mutter“ beziehungsweise „das Gebot Gottes“
  rationale: Die Übersetzung folgt der angegebenen griechischen Textgestalt. Die wichtige Variante wird in einer Fußnote genannt, statt in den Haupttext aufgenommen zu werden.
- issue: Funktion des einleitenden καὶ im zweiten Satz
  choice: „Und so“
  alternative: bloßes „Und“
  rationale: καί verbindet die Folgerung mit der vorausgehenden Regel. „Und so“ macht diesen argumentativen Zusammenhang im Deutschen erkennbar, ohne ihn theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Braucht … gewiss nicht“ gibt die emphatische Verneinung in ihrem kontextuell permissiven Sinn wieder. „Überlieferung“ ist präziser und in diesem biblischen Diskussionszusammenhang angemessener als das breitere „Tradition“.
