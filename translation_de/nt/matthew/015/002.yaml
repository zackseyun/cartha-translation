id: MAT.15.2
reference: Matthew 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: de
  text: „Warum übertreten deine Jünger die Überlieferung der Ältesten? Denn sie waschen sich nicht die Hände, wenn sie Brot essen[a][b].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die in der Überlieferung der Ältesten verlangte Praxis des Händewaschens, nicht lediglich gewöhnliche Hygiene.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wenn sie eine Mahlzeit essen“. Das griechische Wort für „Brot“ kann bisweilen allgemeiner für Speise oder eine Mahlzeit stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Warum
  rationale: Die Wendung fragt nach dem Grund; „Warum“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: παραβαίνουσιν
  choice: übertreten
  rationale: Das Verb bezeichnet das Überschreiten oder Verletzen einer verbindlichen Vorgabe. „Übertreten“ bewahrt hier den gewichtigen, normativen Klang.
- source_word: τὴν παράδοσιν
  choice: die Überlieferung
  rationale: Gemeint ist eine von früheren Autoritäten weitergegebene Tradition. „Überlieferung“ betont diesen Vorgang des Weitergebens und vermeidet, sie als bloßen Brauch abzuschwächen.
- source_word: τῶν πρεσβυτέρων
  choice: der Ältesten
  rationale: Im Zusammenhang sind anerkannte frühere jüdische Autoritäten gemeint, nicht lediglich ältere Männer.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: Denn sie waschen sich nicht die Hände
  rationale: Die reflexive deutsche Form gibt das Waschen der eigenen Hände natürlich wieder; „denn“ erhält die begründende Verknüpfung.
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Präsens Konjunktiv bezeichnet die Konjunktion einen wiederkehrenden Fall; „wenn“ drückt dies im Deutschen idiomatisch aus.
- source_word: ἄρτον
  choice: Brot
  rationale: ἄρτος bedeutet wörtlich „Brot“, kann aber auch metonymisch für eine Mahlzeit stehen. Der Haupttext behält die konkrete Ausgangsbedeutung bei, die weitere Möglichkeit steht in einer Fußnote.
- source_word: ἐσθίωσιν
  choice: sie essen
  rationale: Das Präsens in der allgemeinen temporalen Aussage wird im Deutschen passend mit dem einfachen Präsens wiedergegeben.
theological_decisions:
- issue: Art des Händewaschens
  choice: Im Haupttext als Verstoß gegen die Überlieferung der Ältesten darstellen, ohne das Waschen ausdrücklich als rituell oder hygienisch zu bestimmen.
  alternative: Das Händewaschen ausdrücklich als rituelle Reinigung oder als gewöhnliche Hygiene bezeichnen.
  rationale: Der Vers selbst ordnet die Praxis der Überlieferung der Ältesten zu, bestimmt ihren genauen Charakter aber nicht ausdrücklich. Die kulturelle Einordnung gehört daher in eine Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Überlieferung“ und „übertreten“ bewahren das normative Gewicht der Aussage; die direkte Rede bleibt knapp und natürlich. Sämtliche Fußnotenmarker stehen unmittelbar im Haupttext.
