  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Das aoristische Partizip ἐλθοῦσα ist natürlich als „sie kam“ entfaltet, und die Bitte „Herr, hilf mir!“ entspricht Κύριε, βοήθει μοι unmittelbar und treffend. „Doch“ gibt δέ als kontrastierende Weiterführung angemessen wieder.'
  naturalness: '„Doch sie kam, warf sich vor ihm nieder und sagte: »Herr, hilf mir!«“ ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. Die direkte Rede ist knapp und dringlich wie im Ausgangstext.'
