  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: de
  text: 'Doch sie kam, warf sich vor ihm nieder[a] und sagte: »Herr, hilf mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »betete ihn an«. Das griechische Verb kann je nach Zusammenhang bedeuten, sich ehrfürchtig niederzuwerfen, jemandem zu huldigen oder ihn anzubeten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier den Gegensatz zu Jesu vorausgehender Antwort und hebt das beharrliche Handeln der Frau hervor.
- source_word: ἐλθοῦσα
  choice: sie kam
  rationale: Das Aoristpartizip wird im Deutschen natürlich als finites Verb wiedergegeben und bewahrt die Bewegung auf Jesus zu.
- source_word: προσεκύνει
  choice: warf sich vor ihm nieder
  rationale: Das Verb bezeichnet eine körperliche Geste tiefer Ehrerbietung und kann je nach Kontext auch Anbetung ausdrücken. Die Formulierung bildet zunächst die sichtbare Handlung ab, ohne ihre theologische Bedeutung vorschnell festzulegen.
- source_word: αὐτῷ
  choice: vor ihm
  rationale: Beim gewählten deutschen Ausdruck bezeichnet die Präpositionalfügung idiomatisch die Person, der die Ehrerbietung gilt.
- source_word: λέγουσα
  choice: und sagte
  rationale: Das Partizip leitet die direkte Rede ein und wird in flüssigem modernem Deutsch als koordinierter Hauptsatz wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede ist ehrerbietig und gewichtig; »Herr« bewahrt zudem die im Matthäusevangelium mögliche weitergehende Bedeutung, ohne sie zu erzwingen.
- source_word: βοήθει μοι
  choice: hilf mir
  rationale: Der Imperativ ist eine kurze, unmittelbare und dringliche Bitte. »Hilf mir« entspricht dieser Prägnanz im Deutschen.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber Jesus
  choice: warf sich vor ihm nieder
  alternative: betete ihn an
  rationale: προσκυνέω kann Niederwerfung als Ehrerbietung, Huldigung oder Anbetung bezeichnen. Der Haupttext benennt die erkennbare körperliche Handlung; die Fußnote bewahrt »betete ihn an« als mögliche theologisch stärkere Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bitte bleibt unverändert direkt; die Übersetzung von προσκυνέω wahrt die lexikalische und theologische Mehrdeutigkeit.
