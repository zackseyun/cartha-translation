  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: de
  text: 'Er aber sagte: »Seid auch ihr noch immer ohne Einsicht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Da sagte er
  rationale: Der substantivisch gebrauchte Artikel ὁ verweist auf Jesus; δέ leitet seine Reaktion ein. »Da sagte er« gibt den erzählerischen Übergang im Deutschen natürlich wieder, ohne einen stärkeren Gegensatz zu behaupten.
- source_word: Ἀκμὴν
  choice: noch immer
  rationale: Das Adverb bezeichnet hier das Fortbestehen eines Zustands bis zu diesem Zeitpunkt. »Noch immer« bringt in der Frage sowohl die zeitliche Bedeutung als auch den vorwurfsvollen Unterton zum Ausdruck.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Das ausdrücklich gesetzte ὑμεῖς ist betont; zusammen mit καί schließt Jesus die Jünger überraschend in den Kreis derer ein, denen Verständnis fehlt.
- source_word: ἀσύνετοί ἐστε
  choice: seid … ohne Verständnis
  rationale: ἀσύνετος bezeichnet hier fehlendes Begreifen oder Einsichtsvermögen. »Ohne Verständnis« wahrt die prädikative Form und vermeidet sowohl das missverständliche »verständnislos« als auch die stärkere moralische Wertung »töricht«.
theological_decisions:
- issue: Ton von Jesu Zurechtweisung der Jünger
  choice: Als zugespitzte Frage nach ihrem weiterhin fehlenden Verständnis wiedergeben
  alternative: »Habt auch ihr es immer noch nicht begriffen?«
  rationale: Die Formulierung bewahrt Jesu deutlichen Vorwurf, steigert ἀσύνετος aber nicht zu einer pauschalen moralischen Verurteilung. Zugleich bleibt offen, ob vor allem mangelndes Begreifen oder umfassendere geistliche Einsicht gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung »auch ihr noch immer« erhält die Betonung des griechischen καὶ ὑμεῖς und die zeitliche Nuance von Ἀκμήν; auf eine Fußnote wurde verzichtet, da keine für den Sinn wesentliche Text- oder Übersetzungsalternative vorliegt.
