source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: de
  text: 'Doch er antwortete: „Jede Pflanze[a], die mein himmlischer Vater nicht gepflanzt hat, wird entwurzelt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jede Pflanzung, die mein himmlischer Vater nicht gepflanzt hat, wird entwurzelt werden.“'
    reason: 'Lexikalische Alternative: φυτεία kann eine Pflanze bzw. etwas Gepflanztes oder eine Pflanzung bezeichnen.'
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: antwortete und sagte
  rationale: Die beiden Verben der semitisch geprägten griechischen Erzählformel bleiben erhalten; die Formulierung ist im Deutschen verständlich und würdevoll.
- source_word: Πᾶσα
  choice: Jede
  rationale: Das distributive Singularwort entspricht dem folgenden Substantiv und wird natürlich mit „Jede“ wiedergegeben.
- source_word: φυτεία
  choice: Pflanze
  rationale: Das Wort kann sowohl eine Pflanzung als auch etwas Gepflanztes bezeichnen. „Pflanze“ ergibt zusammen mit dem späteren Ausreißen ein klares Bild, ohne den metaphorischen Bezug festzulegen.
- source_word: ἐφύτευσεν
  choice: gepflanzt hat
  rationale: Die unmittelbare landwirtschaftliche Bildsprache und die Wortverwandtschaft mit φυτεία werden bewahrt.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mein himmlischer Vater
  rationale: Diese idiomatische deutsche Wendung erhält sowohl das Possessivpronomen als auch die nähere Bestimmung οὐράνιος.
- source_word: ἐκριζωθήσεται
  choice: wird mit der Wurzel ausgerissen werden
  rationale: Die Formulierung gibt den zukünftigen Passiv und das ausdrücklich auf die Wurzel bezogene Bild des Verbs anschaulich wieder.
theological_decisions:
- issue: Metaphorischer Bezug von „jede Pflanze“
  choice: Das offene Bild „jede Pflanze“ bleibt stehen.
  alternative: Die Metapher als Lehre, Überlieferung oder Menschengruppe ausdeuten.
  rationale: Der griechische Text bestimmt den Bezug nicht ausdrücklich. Die Übersetzung wahrt diese Offenheit und vermeidet eine konfessionelle oder anderweitig vorentscheidende Auslegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die etwas feierliche Doppelwendung „antwortete und sagte“ bildet die griechische Erzählformel bewusst ab; die landwirtschaftliche Metaphorik bleibt vollständig erhalten.
