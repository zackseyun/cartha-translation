  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: de
  text: Dieses Volk ehrt mich mit ihren Lippen, doch ihr Herz[a] ist weit von mir entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Herzen“. Im Griechischen steht „Herz“ im Singular, wahrscheinlich kollektiv für die innere Haltung des ganzen Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Dieses Volk
  rationale: Bewahrt sowohl die kollektive Bedeutung von λαός als auch die hinweisende Kraft von οὗτος und entspricht dem prophetischen Zitatton.
- source_word: τοῖς χείλεσίν
  choice: mit den Lippen
  rationale: Gibt den instrumentalen Dativ natürlich wieder und erhält das konkrete Bild der Lippen, ohne es zu „Worten“ oder „Reden“ zu verallgemeinern.
- source_word: με τιμᾷ
  choice: ehrt mich
  rationale: τιμάω bezeichnet hier das Erweisen von Ehre; die deutsche Wortstellung ist natürlich und inhaltlich genau.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: doch ihr Herz
  rationale: „Doch“ bringt den adversativen Gegensatz zum äußeren Ehren zum Ausdruck. Der Singular „Herz“ bleibt erhalten und bezeichnet kollektiv die innere Haltung des Volkes.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: ist weit von mir entfernt
  rationale: Gibt die räumliche Metapher für relationale Distanz idiomatisch und ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Kollektiver Singular „Herz“ oder distributiver Plural
  choice: 'Singular: „ihr Herz“'
  alternative: „ihre Herzen“
  rationale: Das griechische καρδία steht im Singular und fasst die innere Haltung des Volkes als Einheit zusammen. Der Singular bewahrt die rhetorische Spannung zwischen äußerer Verehrung und gemeinsamer innerer Entfernung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache und der Gegensatz des griechischen Textes bleiben erhalten; „ihr Herz“ folgt bewusst dem kollektiven Singular.
