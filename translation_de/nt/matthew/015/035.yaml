lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion führt die nächste Handlung im Erzählfluss fort.
- source_word: παραγγείλας
  choice: er wies … an
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung des folgenden Verses vorausgehende Anweisung. Die finite Wiedergabe ist im modernen Deutschen natürlich und bewahrt den verbindlichen, aber nicht unnötig schroffen Ton.
- source_word: τῷ ὄχλῳ
  choice: die Menge
  rationale: Der Dativ bezeichnet den Empfänger der Anweisung; „die Menge“ ist eine geläufige und kontextgerechte Wiedergabe.
- source_word: ἀναπεσεῖν
  choice: sich … zum Essen niederzulassen
  rationale: Das Verb bezeichnet hier das Einnehmen der bei einer Mahlzeit üblichen liegenden oder sitzenden Haltung. Die Formulierung macht den Mahlzeitkontext verständlich, ohne eine im Deutschen unnatürliche Körperhaltung festzulegen.
- source_word: ἐπὶ τὴν γῆν
  choice: auf dem Boden
  rationale: γῆ meint in diesem Zusammenhang die Bodenfläche, auf der sich die Menschen niederlassen, nicht die Erde als Welt oder ein Landgebiet.
