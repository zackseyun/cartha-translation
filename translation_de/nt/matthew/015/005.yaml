  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: de
  text: 'Ihr aber sagt: »Wer zu seinem Vater oder seiner Mutter sagt: ›Was immer dir von mir zugutekommen könnte, ist eine Gabe[a]‹,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfergabe“. Gemeint ist, dass jemand das, womit er seine Eltern hätte unterstützen können, zur Gabe für Gott erklärt; vergleiche Markus 7,11, wo dafür der Ausdruck „Korban“ steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ihr aber sagt
  rationale: Das betonte ὑμεῖς und das kontrastierende δὲ werden durch „Ihr aber“ wiedergegeben; das Präsens λέγετε bezeichnet die von Jesus kritisierte allgemeine Lehraussage.
- source_word: Ὃς ἂν εἴπῃ
  choice: Wer … sagt
  rationale: Relativpronomen, ἄν und Aorist Konjunktiv bilden eine unbestimmte allgemeine Aussage. „Wer … sagt“ ist im Deutschen natürlich und bewahrt diesen verallgemeinernden Sinn.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: zu seinem Vater oder seiner Mutter
  rationale: Der Dativ bezeichnet die angesprochenen Personen. Das Possessivpronomen entspricht dem Bezug auf die jeweilige Person und ist im Deutschen idiomatisch.
- source_word: Δῶρον
  choice: eine Gabe
  rationale: δῶρον kann allgemein „Gabe“ und im kultischen Zusammenhang „Opfergabe“ bedeuten. „Gabe“ wahrt im Haupttext die lexikalische Breite; die hier naheliegende Weihung an Gott wird in der Fußnote erläutert.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Was immer dir von mir zugutekäme
  rationale: „Was immer“ gibt die unbestimmte Konstruktion ὃ ἐὰν wieder. „Dir … zugutekäme“ bildet die passive Bedeutung von ὠφεληθῇς und den potenziellen, nun vorenthaltenen Nutzen ab; „von mir“ wahrt ἐξ ἐμοῦ.
theological_decisions:
- issue: Ob der technische Ausdruck „Korban“ in den Matthäustext aufgenommen werden soll
  choice: Matthäus’ eigenes Wort δῶρον mit „Gabe“ wiedergeben
  alternative: „Korban“ oder „eine Gott geweihte Opfergabe“ im Haupttext
  rationale: Matthäus verwendet δῶρον, nicht das in Markus 7,11 belegte κορβᾶν. Daher wird der technische Ausdruck nicht aus der Parallelstelle eingeführt; der kultische Zusammenhang wird lediglich in der Fußnote erklärt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede und der am Versende offene Satzbau bleiben erhalten, da der griechische Satz in Vers 6 fortgesetzt wird.
