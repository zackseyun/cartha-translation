  naturalness: Der Satzbau ist idiomatisches modernes Standarddeutsch und lässt die in Vers 6 fortlaufende Konstruktion offen. „Was immer dir von mir zugutekommen könnte“ ist klarer als der bloße Konjunktiv II „zukäme“ und bewahrt den würdigen, verständlichen Registerton.
  terminology: „Gabe“ ist für δῶρον eine angemessene, nicht überinterpretierende Wiedergabe. Die Fußnote nennt „Opfergabe“ als Alternative und erläutert den Kontext anhand von Markus 7,11, ohne „Korban“ unberechtigt in den Matthäustext einzutragen.
