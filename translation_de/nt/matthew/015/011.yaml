id: MAT.15.11
reference: Matthew 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: de
  text: Nicht das, was in den Mund hineinkommt, macht den Menschen unrein,[a] sondern das, was aus dem Mund herauskommt – das macht den Menschen unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verunreinigt den Menschen“. Das griechische Verb kann ausdrücken, dass jemand im religiösen Sinn unrein oder entweiht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: macht … unrein
  rationale: Im Reinheitskontext bezeichnet κοινόω, dass jemand unrein beziehungsweise entweiht wird. „Unrein machen“ bewahrt im Deutschen den kultisch-religiösen Sinn deutlicher als „beschmutzen“ oder „verunreinigen“ und lässt zugleich die moralische Tragweite offen.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: das, was in den Mund hineinkommt
  rationale: Das substantivierte Partizip wird natürlich mit „das, was“ wiedergegeben. „In den Mund hineinkommt“ erhält die konkrete Bewegungsrichtung von εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: das, was aus dem Mund herauskommt
  rationale: Die Formulierung gibt das substantivierte Partizip idiomatisch wieder und bildet durch „aus … herauskommt“ die mit ἐκ betonte Herkunft ab.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: ἄνθρωπος bezeichnet hier im repräsentativen Singular einen Menschen allgemein. Das deutsche „den Menschen“ bewahrt Singular und Allgemeingültigkeit, ohne die Aussage unnötig auf Männer zu beschränken.
- source_word: τοῦτο
  choice: das
  rationale: 'Das ausdrücklich gesetzte Demonstrativpronomen wird im zweiten Satzteil wiedergegeben und betont: Gerade das aus dem Mund Kommende macht unrein.'
- source_word: οὐ … ἀλλὰ
  choice: Nicht … sondern …
  rationale: Die deutsche Gegenüberstellung bildet die scharfe griechische Antithese klar und natürlich ab.
theological_decisions:
- issue: Reinheitssprache bei κοινόω
  choice: „macht … unrein“ bewahrt die kultisch-religiöse Bedeutung und lässt ihre moralische Tragweite bestehen.
  alternative: „verunreinigt“ oder „entweiht“
  rationale: Der Kontext betrifft Reinheit vor Gott. „Unrein machen“ ist verständlich und legt die Aussage weder ausschließlich auf rituellen Status noch ausschließlich auf moralische Verderbnis fest.
- issue: Generischer Singular ἄνθρωπον
  choice: „den Menschen“ als generischer Singular
  alternative: „einen Menschen“ oder „den Mann“
  rationale: Im Deutschen bezeichnet „Mensch“ die menschliche Person unabhängig vom Geschlecht und entspricht hier der allgemeinen Referenz von ἄνθρωπος, während Zahl und repräsentative Aussageform erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „macht den Menschen unrein“ erhalten den Nachdruck des griechischen Originals; der Gedankenstrich markiert die durch τοῦτο hervorgehobene Schlussaussage.
