  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: de
  text: der keine Sünde beging,[a] und in dessen Mund kein Betrug[b] gefunden wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Formulierung erinnert an Jesaja 53,9.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Falschheit“ oder „Arglist“; das griechische Wort bezeichnet Täuschung, Hinterlist oder Betrug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf Christus im vorherigen Zusammenhang. Da der Vers einzeln wiedergegeben wird, stellt „Er“ den Bezug im Deutschen natürlich und ohne zusätzliche Betonung her.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: beging keine Sünde
  rationale: ποιέω bedeutet wörtlich „tun/machen“, bildet mit ἁμαρτία aber idiomatisch „Sünde begehen“. Der Singular bleibt als Gattungsbegriff erhalten.
- source_word: οὐδὲ
  choice: und … kein
  rationale: Die koordinierte Verneinung wird in natürlichem Deutsch durch „und“ mit erneuter Verneinung wiedergegeben; ein formelleres „noch“ wäre ebenfalls möglich.
- source_word: εὑρέθη
  choice: wurde … gefunden
  rationale: Die Passivform wird bewahrt und nicht durch eine aktive oder deutende Formulierung ersetzt.
- source_word: δόλος
  choice: Betrug
  rationale: „Betrug“ bezeichnet hier täuschende, arglistige Rede und ist im modernen Deutsch verständlich; „Falschheit“ oder „Arglist“ sind mögliche Alternativen.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: in seinem Mund
  rationale: Die körperliche Metapher des griechischen Textes bleibt erhalten und stützt zugleich den Anklang an Jesaja 53,9.
theological_decisions:
- issue: Anklang an Jesaja 53,9 und Aussage über Christi Sündlosigkeit und Wahrhaftigkeit
  choice: Die sprachlich nahe Formulierung „beging keine Sünde“ und „in seinem Mund wurde kein Betrug gefunden“ wird beibehalten.
  alternative: 'Deutender: „Er sündigte nie und sagte nie etwas Unwahres.“'
  rationale: Die nahe Wiedergabe wahrt die Aussagekraft und den alttestamentlichen Anklang, ohne die Formulierung paraphrasierend auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passive Form und die Metapher „in seinem Mund“ wurden trotz einer möglichen idiomatischeren Umschreibung bewahrt, um den griechischen Wortlaut und den Jesaja-Anklang erkennbar zu halten.
