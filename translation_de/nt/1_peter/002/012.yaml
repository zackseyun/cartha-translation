id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: de
  text: Führt unter den Völkern ein vorbildliches Leben, damit sie in dem, worin sie euch als Übeltäter verleumden, eure guten Taten sehen und Gott am Tag seines Eingreifens verherrlichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag der Heimsuchung“ oder „am Tag des Aufsuchens“. Gemeint ist der Tag, an dem Gott eingreift; der Ausdruck kann je nach Zusammenhang rettendes oder richtendes Eingreifen bezeichnen.'
    reason: Die griechische Wendung ἐν ἡμέρᾳ ἐπισκοπῆς ist theologisch bedeutsam und im Deutschen nicht mit derselben Bedeutungsbreite knapp wiederzugeben.
lexical_decisions:
- source_word: ἀναστροφή
  choice: Leben
  rationale: Bezeichnet hier die gesamte Lebensführung bzw. das Verhalten; „ein … Leben führen“ ist im modernen Deutsch natürlich und bewahrt den umfassenden Sinn.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Bewahrt die sachliche, ethnisch-religiöse Bezeichnung des griechischen Plurals, ohne die mögliche kirchensprachliche Engführung von „Heiden“ aufzuzwingen.
- source_word: καλήν
  choice: vorbildlich
  rationale: Gibt die moralisch gute und für Außenstehende sichtbar achtbare Qualität der Lebensführung idiomatisch wieder.
- source_word: καταλαλοῦσιν
  choice: verleumden
  rationale: Drückt das abwertende Reden gegen die Adressaten aus; der Kontext zeigt eine falsche Beschuldigung als Übeltäter.
- source_word: ἐποπτεύοντες
  choice: sehen
  rationale: Meint aufmerksames Beobachten aus eigener Anschauung; im Zusammenhang ist „sehen“ knapp und natürlich.
- source_word: ἐν ἡμέρᾳ ἐπισκοπῆς
  choice: am Tag seines Eingreifens
  rationale: ἐπισκοπή bezeichnet Gottes Aufsuchen bzw. Heimsuchung, das je nach Kontext rettend oder richtend sein kann; „Eingreifen“ hält diese Spannung eher offen als eindeutig positive oder negative Formulierungen.
theological_decisions:
- issue: Bezug und Charakter des „Tages der ἐπισκοπή“
  choice: am Tag seines Eingreifens
  alternative: am Tag der Heimsuchung / an dem Tag, an dem Gott sie aufsucht
  rationale: Die Formulierung lässt offen, ob Gottes Aufsuchen hier vor allem rettende Zuwendung, Gericht oder beides bezeichnet, und vermeidet eine konfessionelle Festlegung.
- issue: Logische Beziehung von ἐν ᾧ
  choice: gerade in dem, worin
  alternative: obwohl / wenn
  rationale: Die ungewöhnliche griechische Wendung wird nicht stillschweigend zu einem bloßen Gegensatz geglättet. Sie kann den Bereich oder die Sache bezeichnen, in der die Verleumdung erfolgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unter den Völkern“ ist verständlich, aber bewusst näher am griechischen Ausdruck als das traditionellere „unter den Heiden“. Die Satzstruktur wahrt die Spannung von ἐν ᾧ, bleibt jedoch lesbar.
