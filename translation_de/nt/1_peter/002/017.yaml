id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: de
  text: Ehrt alle Menschen, liebt die Gemeinschaft der Brüder und Schwestern[a], fürchtet Gott, ehrt den König[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Gemeinschaft der Glaubenden; das griechische Wort bezeichnet wörtlich eine „Bruderschaft“ beziehungsweise geschwisterlich verbundene Gemeinschaft.
    reason: lexical_alternative
  - marker: b
    text: Oder „den Kaiser“. Das griechische Wort bedeutet „König“, bezeichnet in diesem römischen Zusammenhang aber wahrscheinlich den Kaiser.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: alle Menschen
  rationale: Das substantivisch gebrauchte πάντας bezeichnet ausnahmslos alle Personen. „Alle Menschen“ gibt den universalen Umfang im Deutschen klar und natürlich wieder.
- source_word: τιμήσατε / τιμᾶτε
  choice: ehrt / ehrt
  rationale: Die gleiche Wiedergabe bewahrt die auffällige Wiederholung von τιμάω am Anfang und Ende des Satzes. Der Unterschied zwischen Aorist- und Präsensimperativ lässt sich in dieser knappen Imperativreihe im Deutschen nicht natürlich abbilden.
- source_word: τὴν ἀδελφότητα
  choice: die Gemeinschaft der Brüder und Schwestern
  rationale: ἀδελφότης bezeichnet hier die geschwisterlich verbundene Gemeinschaft der Glaubenden. Die Formulierung bewahrt sowohl den familiären als auch den gemeinschaftlichen Sinn und vermeidet die im heutigen Deutschen missverständliche Bezeichnung „Bruderschaft“.
- source_word: ἀγαπᾶτε
  choice: liebt
  rationale: „Liebt“ ist die direkte, geläufige Wiedergabe des Präsensimperativs von ἀγαπάω. Ein fortdauerndes Handeln kann im Kontext mitgehört werden, ohne durch „liebt weiterhin“ eigens hervorgehoben zu werden.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Direkte Wiedergabe des Objekts von φοβεῖσθε.
- source_word: φοβεῖσθε
  choice: fürchtet
  rationale: „Fürchtet“ bewahrt die Stärke und theologische Spannung von φοβέομαι. Schwächere Wiedergaben wie „verehrt“ würden zudem den bewussten Unterschied zwischen der Haltung gegenüber Gott und der gegenüber dem Herrscher verwischen.
- source_word: τὸν βασιλέα
  choice: den König
  rationale: βασιλεύς bedeutet wörtlich „König“, kann im römischen Kontext jedoch den Kaiser bezeichnen. Die Hauptübersetzung folgt der griechischen Bezeichnung; der wahrscheinliche historische Bezug wird in einer Fußnote genannt.
theological_decisions:
- issue: Unterschied zwischen der Gott geschuldeten Haltung und der dem staatlichen Herrscher geschuldeten Haltung
  choice: „Gott fürchten“, aber „den König ehren“
  alternative: „Gott verehren“ und „den König respektieren“
  rationale: 'Die unterschiedlichen Verben des griechischen Textes werden beibehalten. So bleibt die abgestufte Aussage erhalten: Allen gilt Ehre, der Glaubensgemeinschaft Liebe, Gott Furcht und dem Herrscher Ehre, ohne daraus eine weitergehende politische Lehre abzuleiten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier knappen Imperative und die Wiederholung von „ehrt“ bilden die prägnante Struktur des griechischen Satzes nach. Die Anredeform des Pluralimperativs passt zum gemeindlichen Kontext.
