reference: 1 Peter 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: de
  text: 'Euch nun, die ihr glaubt, gilt die Ehre[a]; für die aber, die nicht glauben[b], heißt es: »Der Stein, den die Bauleute verworfen haben – gerade dieser ist zum Eckhaupt geworden.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für euch, die ihr glaubt, ist er kostbar«; dann bezieht sich die Aussage auf den Stein.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »die nicht gehorchen«; das Verb kann auch die Nuance des Ungehorsams bzw. der Verweigerung des Glaubens haben.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: »zum Eckstein« oder »zum obersten Eckstein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: Ehre
  rationale: τιμή kann Ehre, Wert oder Kostbarkeit bezeichnen. Die knappe Formulierung wahrt am besten die Aussage, dass den Glaubenden Ehre gilt, ohne die mögliche Beziehung auf die Kostbarkeit des Steins auszuschließen.
- source_word: τοῖς πιστεύουσιν
  choice: die ihr glaubt
  rationale: Die persönliche Anrede ὑμῖν wird aufgenommen und mit dem substantivierten Partizip natürlich verbunden.
- source_word: ἀπιστοῦσιν
  choice: die nicht glauben
  rationale: Im unmittelbaren Gegensatz zu πιστεύουσιν ist der fehlende Glaube der vorrangige Sinn. Die mögliche Nuance des Ungehorsams wird in einer Fußnote bewahrt.
- source_word: λίθος
  choice: Stein
  rationale: Dies ist die übliche und im Bild des Bauens passende Entsprechung.
- source_word: ἀπεδοκίμασαν
  choice: verworfen haben
  rationale: Das Verb bezeichnet eine Zurückweisung nach Prüfung oder Beurteilung; »verwerfen« gibt dies knapp und würdig wieder.
- source_word: οἰκοδομοῦντες
  choice: Bauleute
  rationale: Das substantivierte Partizip bezeichnet die am Bau Tätigen; »Bauleute« ist natürliches heutiges Deutsch und erhält das Bild.
- source_word: κεφαλὴν γωνίας
  choice: Haupt der Ecke
  rationale: Die transparente, annähernd wörtliche Wiedergabe bewahrt die Offenheit des architektonischen Bildes. Die geläufige Deutung »Eckstein« steht in der Fußnote.
theological_decisions:
- issue: Bezug und Bedeutung von ἡ τιμή
  choice: Den Glaubenden gilt die Ehre.
  alternative: Für die Glaubenden ist der Stein kostbar.
  rationale: Die Satzfügung ὑμῖν ... ἡ τιμή spricht am unmittelbarsten von Ehre, die den Glaubenden zukommt. Wegen des vorangehenden »kostbar« bleibt die andere Deutung möglich und wird nicht verschwiegen.
- issue: Deutung von κεφαλὴ γωνίας
  choice: Das Bild wird als »Haupt der Ecke« transparent erhalten.
  alternative: Eckstein oder oberster Eckstein
  rationale: Die griechische Wendung ist bildhaft und lässt sich architektonisch unterschiedlich präzisieren. Die Hauptfassung vermeidet eine vorschnelle Festlegung; die traditionelle Wiedergabe wird erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewohnte Wendung »Haupt der Ecke« ist bewusst bildnah; Fußnoten erschließen die geläufigen Alternativen. Das einleitende οὖν wird mit »also« wiedergegeben, und der betonte Rückverweis οὗτος mit »gerade der«.
