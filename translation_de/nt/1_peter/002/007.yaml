review_pass:
  verdict: revise
  source_fidelity: Die Grundübersetzung trifft den Kontrast zwischen Glaubenden und Nichtglaubenden sowie das Zitat aus Ps 118,22 gut. Bei der zweiten Gruppe ist jedoch im Deutschen eine idiomatischere Einführung des elliptisch angeschlossenen Zitats nötig. Die markierte Fußnote zur alternativen Deutung von τιμή ist sachgerecht.
  naturalness: „Haupt der Ecke“ ist zwar nah am griechischen Wortlaut, im modernen Standarddeutsch aber kaum verständlich. „Eckhaupt“ erhält die bildhafte Offenheit eher als „Eckstein“, bleibt dabei jedoch als architektonischer Ausdruck erkennbar. „Für die aber, die nicht glauben, heißt es“ führt das Zitat natürlich ein, ohne dessen Aussage inhaltlich zu präzisieren.
  terminology: „Ehre“ kann τιμή hier angemessen wiedergeben; die mögliche Deutung „kostbar“ bleibt korrekt in der Fußnote. „Bauleute“ und „verworfen“ sind treffend. Die Alternative „nicht gehorchen“ für ἀπιστοῦσιν ist möglich, sollte aber als kontextuelle Bedeutungsnuance, nicht als notwendige Folge des Unglaubens, erklärt werden.
  issues:
  - severity: medium
    issue: Die Formulierung „für die aber, die nicht glauben, gilt:“ ist vor einem vollständigen Zitat syntaktisch und stilistisch schwerfällig.
    rationale: Das griechische δέ leitet elliptisch die gegensätzliche Aussage samt Schriftzitat ein. „heißt es“ ist im Deutschen eine natürliche, bedeutungsneutrale Einführung des Zitats.
  - severity: medium
    issue: „Haupt der Ecke“ ist im heutigen Deutsch kaum idiomatisch oder unmittelbar verständlich.
    rationale: Die wörtliche Reihung klingt ohne erkennbaren architektonischen Bezug. „Eckhaupt“ bewahrt die Nichtfestlegung auf „Eckstein“, ist aber als Fach- bzw. Bildausdruck verständlicher; die traditionelle Deutung bleibt in der Fußnote.
  - severity: low
    issue: Die Fußnote zu „nicht gehorchen“ verbindet Ungehorsam zu stark als Folge mit dem Verweigern des Glaubens.
    rationale: ἀπιστέω kann in bestimmten Zusammenhängen die Nuance des Ungehorsams tragen; diese Nuance sollte als mögliche Bedeutung beschrieben werden, ohne eine kausale Auslegung festzulegen.
