  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: de
  text: oder den Statthaltern, als solchen, die durch ihn[a] gesandt sind zur Bestrafung derer, die Böses tun, und zum Lob derer, die Gutes tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ihn“ ist wahrscheinlich der in Vers 13 genannte König beziehungsweise Kaiser gemeint; manche beziehen es auf Gott als den, der staatliche Autorität ordnet.
    reason: Bewahrt die mögliche Mehrdeutigkeit des Bezugs von αὐτοῦ.
lexical_decisions:
- source_word: εἴτε
  choice: oder
  rationale: Setzt die in Vers 13 begonnene Entweder-oder-Struktur fort und ist für den Satzanschluss im Deutschen natürlich.
- source_word: ἡγεμόσιν
  choice: den Statthaltern
  rationale: Bezeichnet hier staatliche Amtsträger unter dem König beziehungsweise Kaiser; „Statthalter“ ist präzise, ohne eine bestimmte römische Amtsbezeichnung vorauszusetzen.
- source_word: ὡς
  choice: die
  rationale: Das Relativpronomen gibt die charakterisierende Funktion von ὡς mit dem Partizip in natürlichem Deutsch wieder; der Sinn „als solche, die“ bleibt erhalten.
- source_word: δι’ αὐτοῦ
  choice: von ihm
  rationale: διά mit Genitiv bezeichnet hier beim Verb des Sendens am natürlichsten die vermittelnde beziehungsweise handelnde Instanz. „Von ihm“ ist im Deutschen idiomatischer als „durch ihn“, ohne den Bezug des Pronomens festzuschreiben.
- source_word: πεμπομένοις
  choice: gesandt sind
  rationale: Gibt das passive Partizip knapp und sachlich wieder, ohne die stärkere Deutung „beauftragt“ einzutragen.
- source_word: εἰς ἐκδίκησιν
  choice: zur Bestrafung
  rationale: Im Zusammenhang staatlicher Gewalt bezeichnet ἐκδίκησις die Ahndung beziehungsweise Bestrafung von Unrecht; die Wiedergabe vermeidet den emotionaleren Klang von „Rache“.
- source_word: κακοποιῶν
  choice: derer, die Böses tun
  rationale: Bewahrt den verbalen Gedanken und ist in modernem Deutsch verständlicher und weniger etikettierend als „Übeltäter“.
- source_word: ἔπαινον
  choice: zum Lob
  rationale: Entspricht dem Grundsinn von ἔπαινος und erhält die formale Gegenüberstellung mit „zur Bestrafung“.
- source_word: ἀγαθοποιῶν
  choice: derer, die Gutes tun
  rationale: Gibt die Personenbezeichnung verbal und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in δι’ αὐτοῦ
  choice: Das Pronomen bleibt im Haupttext offen; im unmittelbaren Zusammenhang liegt der König beziehungsweise Kaiser aus Vers 13 als Bezug nahe.
  alternative: Das Pronomen kann auf Gott bezogen und die Sendung als Ausdruck seiner Ordnung staatlicher Autorität verstanden werden.
  rationale: Der nächstliegende grammatische Bezug ist der zuvor genannte König beziehungsweise Kaiser. Da ein Gottesbezug jedoch vertreten wird und der isolierte Vers das Bezugswort nicht ausdrücklich nennt, wird die Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Fortsetzung von Vers 13 syntaktisch offen. Die parallelen Wendungen „zur Bestrafung … und zum Lob …“ spiegeln die griechische Zweckkonstruktion.
