id: 1PE.2.13
reference: 1 Peter 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: de
  text: Ordnet euch um des Herrn willen jeder menschlichen Einrichtung unter[a], sei es dem König als dem Höherstehenden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „jeder menschlichen Schöpfung“; traditionell: „jeder menschlichen Ordnung“. Gemeint sind hier menschliche gesellschaftlich-staatliche Einrichtungen oder Autoritäten, wie die anschließende Nennung von König und Statthaltern zeigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als dem Obersten“; gemeint ist seine übergeordnete Stellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Ordnet euch … unter
  rationale: Der Aorist-Passivimperativ hat hier auffordernden, medial verstandenen Sinn. Die reflexive Formulierung ist im modernen Deutschen natürlich und bewahrt den Gedanken freiwilliger Unterordnung.
- source_word: πάσῃ
  choice: jeder
  rationale: Beim singularischen Dativ κτίσει ist πᾶς distributiv zu verstehen.
- source_word: ἀνθρωπίνῃ κτίσει
  choice: jeder menschlichen Einrichtung
  rationale: κτίσις bedeutet grundsätzlich „Schöpfung“ beziehungsweise „Geschaffenes“. Zusammen mit ἀνθρωπίνῃ und den anschließenden Beispielen König und Statthalter bezeichnet die Wendung hier am ehesten eine menschliche gesellschaftlich-staatliche Einrichtung. Eine Fußnote bewahrt die ungewöhnliche wörtliche Ausdrucksweise.
- source_word: διὰ τὸν κύριον
  choice: um des Herrn willen
  rationale: διά mit Akkusativ bezeichnet hier Grund oder Beweggrund. Die traditionelle, weiterhin verständliche Wendung gibt dies knapp und würdig wieder.
- source_word: κύριον
  choice: Herrn
  rationale: Der griechische Text nennt nur den Titel κύριος. Die Übersetzung legt nicht zusätzlich fest, ob der unmittelbare Bezug auf Jesus oder Gott zielt.
- source_word: εἴτε
  choice: sei es
  rationale: Die Formulierung eröffnet die in Vers 14 fortgesetzte Alternative und ist im Deutschen idiomatisch.
- source_word: βασιλεῖ
  choice: dem König
  rationale: βασιλεύς bedeutet lexikalisch „König“. Der bestimmte Artikel ist im Deutschen bei der beispielhaft genannten Amtsgestalt natürlich; „Kaiser“ wäre historisch möglich, aber enger als der griechische Ausdruck.
- source_word: ὡς ὑπερέχοντι
  choice: als dem Höherstehenden
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der über anderen steht beziehungsweise höhere Autorität besitzt. Die Wiedergabe wahrt den Vergleichscharakter von ὡς und vermeidet den möglicherweise absoluten Klang von „als dem Höchsten“.
theological_decisions:
- issue: Bedeutung von ἀνθρωπίνῃ κτίσει im Blick auf staatliche Ordnung
  choice: menschliche Einrichtung
  alternative: menschliche Schöpfung; menschliches Geschöpf; menschliche Ordnung
  rationale: Die folgenden Beispiele, König und Statthalter, weisen auf gesellschaftlich-staatliche Einrichtungen beziehungsweise Autoritäten. „Einrichtung“ vermeidet die missverständliche Aussage, Christen müssten sich jedem einzelnen Menschen unterwerfen, ohne die menschliche Gestalt dieser Ordnung als ausdrücklich göttliche Einsetzung umzudeuten.
- issue: Bezugswort von κύριον
  choice: Herrn
  alternative: Jesus; Gott
  rationale: Da der Ausgangstext den Bezug nicht näher bestimmt, bleibt die titulare und theologisch offene Form erhalten.
- issue: Reichweite von ὑπερέχοντι
  choice: dem Höherstehenden
  alternative: dem Obersten; dem Machthaber
  rationale: Die Übersetzung beschreibt eine übergeordnete Stellung, ohne dem König grenzenlose oder über Gott stehende Autorität zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ordnet euch … unter“ ist klar und idiomatisch; „um des Herrn willen“ bewahrt den gehobenen biblischen Ton, ohne veraltet zu wirken. Der Satz endet mit Komma, weil die mit εἴτε eröffnete Konstruktion in Vers 14 fortgesetzt wird.
