  verdict: approve
  source_fidelity: Die Übersetzung gibt den Imperativ Ὑποτάγητε idiomatisch und mit angemessener Aufforderungskraft wieder. „jeder menschlichen Einrichtung“ ist im unmittelbaren Kontext eine gut begründete Wiedergabe von πάσῃ ἀνθρωπίνῃ κτίσει; die Fußnote hält die wörtlichere lexikalische Möglichkeit transparent. „um des Herrn willen“ trifft die motivierende Bedeutung von διὰ τὸν κύριον, ohne den Referenten über den griechischen Titel hinaus festzulegen. „sei es dem König als dem Höherstehenden“ bildet die in V. 14 fortgesetzte εἴτε-Konstruktion sowie ὡς ὑπερέχοντι sachgerecht ab.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Stellung der Ergänzungen und die offene Satzführung mit abschließendem Komma sind natürlich, da die Alternative im folgenden Vers fortgesetzt wird. „dem Höherstehenden“ ist leicht gehoben, aber verständlich und passend zum Register.
  terminology: „Herrn“ bewahrt die gebotene Offenheit von κύριον. „König“ ist gegenüber der historisch möglichen, aber engeren Wiedergabe „Kaiser“ lexikalisch richtig. Die Fußnoten erläutern sowohl κτίσις als auch ὑπερέχοντι, ohne eine konfessionelle oder absolute Deutung staatlicher Autorität einzutragen.
