source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: de
  text: 'und: »ein Stein, an dem man sich stößt, und ein Fels, an dem man zu Fall kommt«.[a] Sie stoßen sich am Wort, weil sie ihm nicht gehorchen; dazu sind sie auch bestimmt worden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesaja 8,14.
    reason: Kennzeichnet das alttestamentliche Zitat.
  - marker: b
    text: 'Wörtlich auch: »wozu sie auch gesetzt wurden«. Das »dazu« kann sich auf ihr Sich-Stoßen oder auf den ganzen zuvor beschriebenen Zusammenhang beziehen.'
    reason: Bewahrt die Bedeutungsbreite von εἰς ὃ und ἐτέθησαν sowie die damit verbundene theologische Spannung.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: ein Stein, an dem man sich stößt
  rationale: Die idiomatische Wendung gibt das Bild des Anstoßens verständlich wieder und wahrt den Bezug auf Jesaja 8,14.
- source_word: πέτρα σκανδάλου
  choice: ein Fels, an dem man zu Fall kommt
  rationale: σκάvδαλον bezeichnet hier nicht bloß Ärgernis, sondern eine Ursache des Strauchelns bzw. Fallens; die Übersetzung unterscheidet die Formulierung zugleich von προσκόμματος.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: weil sie dem Wort nicht gehorchen
  rationale: Das Partizip ἀπειθοῦντες kann Ungehorsam beziehungsweise Weigerung zu glauben ausdrücken. „Nicht gehorchen“ bewahrt die ethische und glaubensbezogene Spannung; der Dativ τῷ λόγῳ wird als Ergänzung zu ἀπειθοῦντες verstanden.
- source_word: εἰς ὃ
  choice: dazu
  rationale: Das neutrale Relativpronomen verweist am natürlichsten auf den zuvor beschriebenen Sachverhalt des Sich-Stoßens im Ungehorsam, ohne den Bezug unnötig enger festzulegen.
- source_word: ἐτέθησαν
  choice: sind sie bestimmt worden
  rationale: Der passive Aorist von τίθημι bezeichnet ein Setzen bzw. Bestimmen. Die Passivform und ihre theologische Spannung bleiben erhalten, ohne den Handelnden ausdrücklich zu benennen.
theological_decisions:
- issue: Worauf bezieht sich die Bestimmung in εἰς ὃ καὶ ἐτέθησαν?
  choice: „dazu sind sie auch bestimmt worden“ lässt den Umfang des Rückbezugs offen
  alternative: „zum Ungehorsam sind sie bestimmt worden“ oder „zum Straucheln sind sie bestimmt worden“
  rationale: Das griechische εἰς ὃ kann auf den gesamten vorausgehenden Sachverhalt oder besonders auf das Sich-Stoßen zurückweisen. Eine ausdrückliche Festlegung auf göttliche Bestimmung zum Unglauben würde die genuine syntaktische und theologische Mehrdeutigkeit auflösen.
- issue: Ungenannter Handelnder im theologischen Passiv ἐτέθησαν
  choice: Passiv ohne ausdrückliches Subjekt beibehalten
  alternative: „Gott hat sie dazu bestimmt“
  rationale: Obwohl ein göttliches Passiv wahrscheinlich ist, nennt der Ausgangstext Gott an dieser Stelle nicht ausdrücklich. Die Übersetzung fügt ihn daher nicht ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Stein- und Felsbilder bleiben erhalten; „sich stoßen“ und „zu Fall kommen“ machen die unterschiedlichen griechischen Ausdrücke verständlich. Die Schlussaussage bleibt bewusst knapp und theologisch nicht übererklärt.
