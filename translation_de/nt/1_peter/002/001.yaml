  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: de
  text: Legt daher alle Bosheit, allen Betrug, alle Heuchelei, allen Neid und alles abfällige Reden[a] ab,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede üble Nachrede“ beziehungsweise „alles Reden gegen andere“. Das griechische Wort bezeichnet allgemein Äußerungen, durch die andere herabgesetzt oder schlechtgemacht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: Legt … ab
  rationale: Das Aoristpartizip ist dem Imperativ in Vers 2 untergeordnet. Im Deutschen gibt die koordinierte Aufforderung den Zusammenhang natürlicher wieder als eine schwerfällige partizipiale Konstruktion; das Bild des Ablegens bleibt erhalten.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang, besonders 1,22–25, in würdigem und geläufigem Deutsch.
- source_word: πᾶσαν κακίαν
  choice: alle Bosheit
  rationale: κακία bezeichnet hier im Rahmen der Lasterliste moralische Schlechtigkeit beziehungsweise eine böse Haltung gegenüber anderen. „Bosheit“ bewahrt sowohl den ethischen Ernst als auch die zwischenmenschliche Färbung.
- source_word: πάντα δόλον
  choice: allen Betrug
  rationale: δόλος meint Täuschung oder arglistiges Vorgehen. „Betrug“ ist knapp, verständlich und passt zur konkreten Lasterliste.
- source_word: ὑποκρίσεις
  choice: alle Heuchelei
  rationale: Der griechische Plural kann verschiedene Erscheinungsformen oder Handlungen bezeichnen. Der deutsche Kollektivsingular ist idiomatischer, ohne den Umfang einzuschränken, da „alle“ ihn ausdrücklich markiert.
- source_word: φθόνους
  choice: allen Neid
  rationale: φθόνος bezeichnet Missgunst oder Neid. Im modernen Deutschen wird „Neid“ gewöhnlich als nicht zählbares Sammelwort gebraucht; „allen“ erhält die umfassende Aussage.
- source_word: πάσας καταλαλιάς
  choice: alles abfällige Reden
  rationale: καταλαλιά bezeichnet allgemein ein Reden gegen andere, das sie herabsetzt oder schlechtmacht. „Abfälliges Reden“ wahrt diese Breite besser als das rechtlich enger verständliche „Verleumdungen“.
theological_decisions:
- issue: Wiedergabe der Lasterliste und ihres moralischen Umfangs
  choice: Die einzelnen Laster werden konkret und ohne lehrmäßige Erweiterung wiedergegeben.
  alternative: κακία allgemeiner mit „Schlechtigkeit“ und καταλαλιάς enger mit „Verleumdungen“ wiederzugeben.
  rationale: Der Text enthält eine ethische Ermahnung. Die gewählte Fassung bewahrt den konkreten zwischenmenschlichen Bezug und lässt die semantische Breite des Redens gegen andere bestehen.
- issue: Syntaktisches Verhältnis zu Vers 2
  choice: Das Partizip wird als koordinierte Aufforderung „Legt … ab“ wiedergegeben.
  alternative: Formal als „Nachdem ihr … abgelegt habt“ oder „indem ihr … ablegt“, abhängig vom folgenden Hauptsatz.
  rationale: Im Griechischen hängt Ἀποθέμενοι vom Imperativ in Vers 2 ab und kann vorbereitende beziehungsweise begleitende Bedeutung haben. Die deutsche Aufforderung wahrt den exhortativen Zusammenhang, ohne die zeitliche Beziehung unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit der trennbaren Verbklammer ist natürlich und erhält das Bild des Ablegens. Deutsche Kollektivsingulare vermeiden unübliche Formen wie „Heucheleien“ oder „Neide“, während die wiederholten Formen von „all-“ die umfassende Aussage des griechischen Textes bewahren.
