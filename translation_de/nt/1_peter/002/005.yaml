  terminology: „Priesterschaft“ gibt ἱεράτευμα treffend als kollektive Größe wieder. „Geistlich“ bewahrt die Offenheit von πνευματικός. „Messias“ macht den Titelgehalt von Χριστός sichtbar; die Apposition „Jesus, den Messias“ ist im Deutschen idiomatisch und wahrt die Kasusbeziehung nach „durch“.
