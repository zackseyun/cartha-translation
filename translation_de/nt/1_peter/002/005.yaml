source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: de
  text: Auch ihr selbst werdet als lebendige Steine zu einem geistlichen Haus aufgebaut, zu einer heiligen Priesterschaft[a], um geistliche Opfer darzubringen, die Gott durch Jesus, den Messias, wohlgefällig sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, sofern die griechische Verbform als Aufforderung verstanden wird: „Lasst euch als lebendige Steine zu einem geistlichen Haus aufbauen, zu einer heiligen Priesterschaft.“ Die Präposition vor „heilige Priesterschaft“ kann Ziel oder Ergebnis bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: auch ihr
  rationale: Bewahrt die additive Kraft von καί und die durch αὐτοί hervorgehobene direkte Anrede; die deutsche Wortstellung setzt den natürlichen Nachdruck auf „ihr“.
- source_word: ὡς λίθοι ζῶντες
  choice: als lebendige Steine
  rationale: Gibt den Vergleich knapp und natürlich wieder und erhält das Bild aus dem unmittelbaren Kontext.
- source_word: οἰκοδομεῖσθε
  choice: lasst euch … aufbauen
  rationale: Bewahrt die passive Bedeutung, ohne den im Vers ungenannten Handelnden ausdrücklich einzufügen. Die deutsche Aufforderungsform gibt die mögliche imperativische Lesart des formal indikativisch/imperativisch mehrdeutigen οἰκοδομεῖσθε wieder.
- source_word: οἶκος πνευματικὸς
  choice: zu einem geistlichen Haus
  rationale: Drückt das Ergebnis des Aufbauens idiomatisch aus; „geistlich“ lässt die genaue Bedeutung von πνευματικός offen.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: zu einer heiligen Priesterschaft
  rationale: εἰς bezeichnet Ziel oder Ergebnis; ἱεράτευμα meint eine priesterliche Gemeinschaft und nicht nur einzelne Priester.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: um geistliche Opfer darzubringen
  rationale: Der Infinitiv bezeichnet hier den Zweck; „darbringen“ entspricht dem kultischen Gebrauch von ἀναφέρω, ohne die Art der Opfer näher festzulegen.
- source_word: εὐπροσδέκτους θεῷ
  choice: die Gott … willkommen sind
  rationale: Gibt die Annahme der Opfer durch Gott in verständlichem, gegenwärtigem Deutsch wieder.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet Vermittlung; Χριστός wird als Titel verstanden und daher mit „der Messias“ wiedergegeben.
theological_decisions:
- issue: Modus und Stimme von οἰκοδομεῖσθε
  choice: 'passive Aufforderung: „Lasst … euch aufbauen“'
  alternative: 'Aussage: „Ihr werdet aufgebaut“'
  rationale: Die Form kann im Präsens sowohl Indikativ als auch Imperativ sein. Der Kontext erlaubt beides; die gewählte Fassung folgt der imperativischen Lesart, während die Fußnote die Aussageform sichtbar hält. Die passive Stimme bleibt erhalten und der Handelnde wird nicht ergänzt.
- issue: Verhältnis von οἶκος πνευματικός und εἰς ἱεράτευμα ἅγιον
  choice: „zu einem geistlichen Haus … zu einer heiligen Priesterschaft“
  alternative: „als geistliches Haus für eine heilige Priesterschaft“ beziehungsweise „um eine heilige Priesterschaft zu sein“
  rationale: Die Konstruktion ist syntaktisch verdichtet, und εἰς kann Ziel oder Ergebnis ausdrücken. Die Übersetzung wahrt die parallelen Gemeinschaftsbilder, ohne sie dogmatisch ineinander aufzulösen.
- issue: Bedeutung von Χριστοῦ
  choice: „des Messias“ im Ausdruck „durch Jesus, den Messias“
  alternative: „Christus“
  rationale: Χριστός fungiert hier als Titel Jesu. Die Übersetzung macht den Titelgehalt transparent, ohne eine christologische Zusatzdeutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Haus, Steinen, Priesterschaft und Opfern bleibt erhalten. „Priesterschaft“ bezeichnet die Gemeinschaft als Ganzes; „geistlich“ wird nicht erläuternd verengt. Der einzige Fußnotenmarker [a] steht unmittelbar bei der syntaktisch und modal mehrdeutigen Konstruktion.
