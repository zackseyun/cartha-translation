  to: Auch ihr selbst werdet als lebendige Steine zu einem geistlichen Haus aufgebaut, zu einer heiligen Priesterschaft[a], um geistliche Opfer darzubringen, die Gott durch Jesus, den Messias, wohlgefällig sind.
  rationale: Die Revision stellt die präsentisch-passive Aussage in den Haupttext, die dem unmittelbaren Kontext und dem englischen Audit Trail entspricht, und hält die formal mögliche imperativische Lesart in der Fußnote fest. „Wohlgefällig“ ersetzt das für Opfer unübliche „willkommen“. Im Übrigen bleiben Bildsprache, kollektives Verständnis von „Priesterschaft“, die Offenheit von „geistlich“ und die messianische Titelfunktion erhalten.
