id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: de
  text: als freie Menschen und nicht als solche, die die Freiheit als Deckmantel für das Böse gebrauchen, sondern als Sklaven Gottes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener Gottes«.'
    reason: 'Lexikalische Alternative: δοῦλοι kann je nach Zusammenhang auch mit »Diener« wiedergegeben werden; hier wahrt »Sklaven« den stärkeren Gegensatz zu »freie Menschen».'
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: freie Menschen
  rationale: Das substantivierte Adjektiv bezeichnet die angesprochene Gemeinschaft als Freie. »Freie Menschen« bewahrt den sozialen und rechtlichen Sinn, ohne die gemischte Adressatengruppe unnötig männlich einzugrenzen.
- source_word: ἐπικάλυμμα
  choice: Deckmantel
  rationale: Das Wort bezeichnet eine Bedeckung oder Verhüllung. »Deckmantel« gibt das Bild einer Freiheit wieder, hinter der böses Handeln verborgen wird, und ist im heutigen Deutsch idiomatisch.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: ihre Freiheit ... gebrauchen
  rationale: Wörtlich steht »die Freiheit als Deckmantel habend«. Die verbale Wiedergabe mit »gebrauchen« bringt die instrumentale Funktion der Freiheit natürlich zum Ausdruck, ohne den Sinn auszuweiten.
- source_word: κακίας
  choice: das Böse
  rationale: κακία kann Bosheit, Schlechtigkeit oder böses Verhalten bezeichnen. Hier ist die Warnung allgemein gehalten; »das Böse« wahrt diese Breite besser als das engere »Bosheit«.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: δοῦλοι bezeichnet Menschen, die einem Herrn gehören und ihm unterstehen. »Sklaven« erhält den absichtlichen, starken Gegensatz zwischen Freiheit und vollständiger Zugehörigkeit zu Gott.
- source_word: θεοῦ δοῦλοι
  choice: Sklaven Gottes
  rationale: Der Genitiv drückt Zugehörigkeit beziehungsweise Beziehung aus. Die Formulierung ist klar und bewahrt die rhetorische Spannung zu »freie Menschen«.
theological_decisions:
- issue: Wiedergabe von δοῦλοι als Bezeichnung christlicher Identität
  choice: Sklaven Gottes
  alternative: Diener Gottes
  rationale: Der Satz stellt Freiheit und völlige Zugehörigkeit zu Gott bewusst nebeneinander. »Sklaven« bewahrt dieses theologische Paradox und die soziale Schärfe des griechischen Ausdrucks; »Diener« ist möglich, schwächt den Gegensatz jedoch ab.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. »Deckmantel« erhält die konkrete Verhüllungsmetapher; die Satzstellung macht den griechischen Gegensatz zwischen Freiheit, ihrem möglichen Missbrauch und der Zugehörigkeit zu Gott deutlich.
