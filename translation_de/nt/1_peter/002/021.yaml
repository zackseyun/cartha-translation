  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: de
  text: Denn dazu seid ihr berufen worden, weil auch der Messias für euch gelitten und euch ein Vorbild[a] hinterlassen hat, damit ihr seinen Spuren folgt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Vorlage“, „ein Muster“. Das griechische Wort bezeichnete auch eine Schreibvorlage, die Lernende nachzeichnen sollten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dazu
  rationale: Die idiomatische deutsche Wendung verweist auf das zuvor genannte geduldige Ertragen ungerechten Leidens und bewahrt zugleich die Zielrichtung der griechischen Präposition.
- source_word: ἐκλήθητε
  choice: seid ihr berufen worden
  rationale: Das Passiv bewahrt den Gedanken eines göttlichen Rufes, ohne eine bestimmte dogmatische Auslegung der Berufung festzulegen.
- source_word: ὅτι
  choice: Denn … Auch
  rationale: Im Deutschen gibt „denn“ die begründende beziehungsweise erläuternde Beziehung natürlich wieder; „auch“ nimmt καί unmittelbar bei Χριστός auf.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als Titel verstanden; „der Messias“ macht die Bedeutung „der Gesalbte“ für heutige Leser transparent.
- source_word: ἔπαθεν
  choice: hat … gelitten
  rationale: Die schlichte Wiedergabe vermeidet es, Art oder Umfang des Leidens über den Wortlaut hinaus zu bestimmen.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: Die Formulierung bewahrt die weite Bedeutung zugunsten beziehungsweise um der Leser willen und lässt eine stellvertretende Dimension offen, ohne sie enger festzuschreiben.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: euch … hinterlassen
  rationale: Die Formulierung bildet das Partizip und den Dativ natürlich ab und vermittelt den Gedanken eines zurückgelassenen Modells.
- source_word: ὑπογραμμὸν
  choice: ein Vorbild
  rationale: „Vorbild“ ist im modernen Deutsch klar und würdig; die konkrete Bedeutung einer Schreibvorlage für Lernende wird in der Fußnote erklärt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck der Handlung knapp und idiomatisch wieder.
- source_word: ἐπακολουθήσητε
  choice: ihr … folgt
  rationale: Nach „damit“ ist im Deutschen der Indikativ die natürliche Wiedergabe des griechischen Konjunktivs in einem Zwecksatz; das Verb bezeichnet ein Nachfolgen.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: seinen Spuren
  rationale: Die bildhafte Rede von Fußspuren bleibt erhalten und klingt im Deutschen natürlicher als eine abstrakte Umschreibung.
theological_decisions:
- issue: Bedeutung von ὑπὲρ ὑμῶν beim Leiden des Messias
  choice: für euch
  alternative: euretwegen; zu euren Gunsten; an eurer Stelle
  rationale: „Für euch“ bewahrt die repräsentative und wohltätige Bedeutungsbreite und lässt eine stellvertretende Dimension anklingen, ohne den unmittelbaren Kontext, der das vorbildhafte Leiden betont, auf eine einzelne Sühnetheorie festzulegen.
- issue: Funktion des Leidens des Messias in diesem Vers
  choice: Sowohl das Leiden für die Leser als auch seine Vorbildfunktion werden nebeneinandergestellt.
  alternative: Das Leiden ausschließlich als moralisches Beispiel oder ausschließlich als stellvertretendes Leiden auszulegen.
  rationale: 'Der Wortlaut nennt ausdrücklich beides: Der Messias litt „für euch“ und hinterließ ihnen dabei ein Vorbild zur Nachfolge. Die Übersetzung bewahrt diese Spannung.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt verdeutlicht die folgende Begründung, ohne die Satzbeziehung umzudeuten; die Bildsprache der Vorlage und der Spuren bleibt erhalten.
