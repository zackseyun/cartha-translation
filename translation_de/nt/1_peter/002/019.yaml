  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: de
  text: 'Denn das ist Gnade[a]: wenn jemand Kummer erträgt und dabei zu Unrecht leidet, weil er sich Gottes bewusst ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gnade“ kann hier auch etwas bezeichnen, das Anerkennung findet oder Gunst erfährt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus Gewissen vor Gott“; auch möglich: „weil er auf Gott bedacht ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γὰρ
  choice: Denn das
  rationale: „Denn“ gibt den erklärenden Anschluss von γάρ wieder; „das“ verweist auf den folgenden Bedingungssatz.
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ bewahrt die zentrale neutestamentliche Wortverbindung von χάρις und lässt die hier evaluative Bedeutung offen, statt sie vorschnell auf „anerkennenswert“ oder „verdienstvoll“ festzulegen.
- source_word: διὰ συνείδησιν θεοῦ
  choice: weil er sich Gottes bewusst ist
  rationale: Die natürliche deutsche Formulierung wahrt sowohl den Gottesbezug als auch den Sinn bewusster innerer Ausrichtung. Sie vermeidet das missverständliche „Bewusstsein Gottes“, das im Deutschen Gottes eigenes Bewusstsein bezeichnen könnte.
- source_word: ὑποφέρει
  choice: erträgt
  rationale: Das Verb bezeichnet standhaftes Aushalten unter einer Belastung; „erträgt“ ist knapp, geläufig und kontextgemäß.
- source_word: λύπας
  choice: Kummer
  rationale: „Kummer“ gibt den emotionalen und leidvollen Bedeutungsumfang des griechischen Plurals idiomatisch als deutsches Kollektivum wieder.
- source_word: πάσχων ἀδίκως
  choice: dabei zu Unrecht leidet
  rationale: Die Wendung gibt das gleichzeitige Begleitumstandspartizip und das ungerechte Erleiden klar wieder.
- source_word: τις
  choice: jemand
  rationale: „Jemand“ entspricht dem unbestimmten Singular und bleibt wie das Griechische geschlechtsübergreifend.
theological_decisions:
- issue: Bedeutung von χάρις in diesem Zusammenhang
  choice: „Gnade“ im Haupttext
  alternative: „etwas Gnadenvolles“, „anerkennenswert“ oder „findet Anerkennung“
  rationale: Der griechische Ausdruck ist evaluativ, nennt aber in diesem Vers nicht ausdrücklich denjenigen, bei dem etwas Anerkennung findet. „Gnade“ erhält die theologische und lexikalische Spannung, während die Fußnote die kontextuelle Bedeutung erläutert.
- issue: Bedeutung von συνείδησις θεοῦ
  choice: „weil er sich Gottes bewusst ist“
  alternative: „im Hinblick auf Gott seinem Gewissen folgend“ oder „aus Gewissen vor Gott“
  rationale: Die Übersetzung bewahrt die mögliche Bedeutung bewusster Ausrichtung auf Gott, ohne den Ausdruck ausschließlich auf das moralische Gewissen einzuengen. Die Gewissensnuance bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die erläuternde Struktur ab. Die Stellung des Kausalsatzes am Ende ist im Deutschen natürlich; sein Bezug auf das Ertragen bleibt durch „weil er sich Gottes bewusst ist“ inhaltlich klar. Die Fußnoten erhalten die Mehrdeutigkeit von χάρις und συνείδησις θεοῦ.
