  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: de
  text: Verlangt wie neugeborene Säuglinge nach der unverfälschten, vernunftgemäßen Milch[a], damit ihr durch sie zur Rettung heranwachst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der unverfälschten geistlichen Milch“. Das griechische Adjektiv kann „vernünftig“ oder „vernunftgemäß“ bedeuten und im übertragenen Zusammenhang auch auf geistliche Nahrung weisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: wie neugeborene Kinder
  rationale: Die Wendung führt einen Vergleich ein und bewahrt das Bild gerade erst geborener Säuglinge; „neugeborene Kinder“ ist natürlich und würdig.
- source_word: τὸ λογικὸν
  choice: vernünftigen
  rationale: „Vernünftig“ bildet die Grundbedeutung von λογικός enger ab als das deutende „geistlich“ und lässt offen, ob vernunftgemäße oder das innere Leben betreffende Nahrung gemeint ist.
- source_word: ἄδολον
  choice: unverfälschten
  rationale: Das Wort bezeichnet etwas Unvermischtes und Unverfälschtes; bei Milch gibt „unverfälscht“ das Bild genauer wieder als das allgemeinere „rein“.
- source_word: γάλα
  choice: Milch
  rationale: Bewahrt das zentrale Bild der Nahrung für Neugeborene.
- source_word: ἐπιποθήσατε
  choice: Verlangt ... nach
  rationale: Der Imperativ fordert ein starkes, anhaltendes Begehren; die deutsche Wendung ist klar und natürlich.
- source_word: ἐν αὐτῷ
  choice: durch sie
  rationale: Das Pronomen verweist auf die Milch; „durch sie“ bringt deren Funktion als Mittel des Wachstums idiomatisch zum Ausdruck.
- source_word: αὐξηθῆτε εἰς σωτηρίαν
  choice: zur Rettung heranwachst
  rationale: Die Formulierung bewahrt die Zielrichtung von εἰς und gibt den passivischen Wachstumsprozess im Deutschen natürlich wieder, ohne sein theologisches Verhältnis zur Rettung näher festzulegen.
theological_decisions:
- issue: Bedeutung von λογικός in der Milchmetapher
  choice: vernünftig
  alternative: geistlich; das innere Leben betreffend
  rationale: Die engere Wiedergabe bewahrt die ungewöhnliche Ausdrucksweise und echte Mehrdeutigkeit des griechischen Wortes. Die wahrscheinliche metaphorische Bedeutung wird in der Fußnote erläutert, nicht im Haupttext festgeschrieben.
- issue: Zielrichtung von εἰς σωτηρίαν
  choice: zur Rettung heranwachst
  alternative: zum Heil hin wachst; in der Rettung wachst
  rationale: Die Übersetzung erhält die Bewegung auf die Rettung hin, ohne daraus eine bestimmte konfessionelle Lehre über Rechtfertigung, Heiligung oder Heilsgewissheit abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Register. Die markante Metapher und die theologisch bedeutsame Zielangabe bleiben erhalten; die Fußnote sichert die Mehrdeutigkeit von λογικός.
