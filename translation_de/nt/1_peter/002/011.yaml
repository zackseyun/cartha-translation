reference: 1 Peter 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: de
  text: Geliebte, ich bitte euch als Fremde und Gäste[a], euch von den Begierden des Fleisches[b] fernzuhalten, die gegen die Seele[c] Krieg führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ansässige Fremde und zeitweilige Bewohner“. Die beiden Begriffe betonen, dass die Angesprochenen an ihrem jeweiligen Ort nicht vollständig beheimatet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „fleischliche Begierden“; sinngemäß auch: „sündige Begierden“.'
    reason: lexical_alternative
  - marker: c
    text: „Seele“ kann hier auch das Leben oder den ganzen Menschen als Person bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ihr Geliebten
  rationale: Die substantivierte Anrede bewahrt den warmen, von Liebe geprägten Ton und den sprachlichen Bezug zu ἀγαπάω/ἀγάπη. Durch „Ihr“ klingt sie im heutigen Deutsch natürlich als direkte Anrede.
- source_word: παρακαλῶ
  choice: ich ermahne euch
  rationale: Hier bezeichnet παρακαλέω eine eindringliche ethische Aufforderung. „Ermahnen“ wahrt deren Gewicht, ohne unnötig technisch zu wirken; das im Deutschen erforderliche Objekt „euch“ ergibt sich aus der Anrede.
- source_word: ὡς
  choice: als
  rationale: „Als“ gibt die Rolle beziehungsweise Stellung wieder, in der Petrus die Leser anspricht, ohne den nicht ausdrücklich formulierten Kausalsinn „weil ihr ... seid“ einzutragen.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: Fremde und Gäste
  rationale: Die Wortverbindung beschreibt Menschen, die nicht in ihrer eigentlichen Heimat leben und nur vorläufig anwesend sind. „Fremde und Gäste“ ist verständlich, würdevoll und lässt sowohl die gesellschaftliche als auch die theologische Außenseiterstellung anklingen.
- source_word: ἀπέχεσθαι
  choice: Haltet euch ... fern
  rationale: Der Infinitiv hängt von „ich ermahne euch“ ab und fordert zu fortgesetzter Distanz auf. Ein Doppelpunkt mit Imperativ ergibt im Deutschen einen natürlichen, klaren Satz und bewahrt die Aufforderungskraft.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: Begierden des Fleisches
  rationale: „Begierden“ trägt hier die negative moralische Färbung von ἐπιθυμίαι, ohne sie auf Sexualität zu beschränken. Der Genitiv „des Fleisches“ erhält die σάρξ-Metaphorik und vermeidet die auslegende Verengung auf „sündige Begierden“.
- source_word: αἵτινες
  choice: die
  rationale: Das Relativpronomen leitet eine charakterisierende Erklärung zu den Begierden ein; „die“ ist im Deutschen die natürliche Entsprechung.
- source_word: στρατεύονται
  choice: Krieg führen
  rationale: Die Wendung bewahrt das starke militärische Bild eines aktiven, andauernden Angriffs.
- source_word: κατὰ τῆς ψυχῆς
  choice: gegen die Seele
  rationale: „Seele“ erhält die anthropologische Weite und traditionelle Begrifflichkeit von ψυχή, ohne ein im Griechischen nicht vorhandenes Possessivpronomen einzufügen oder den Begriff auf bloß biologisches Leben zu reduzieren.
theological_decisions:
- issue: Bedeutung von σαρκικῶν im moralischen Zusammenhang
  choice: des Fleisches
  alternative: sündigen; fleischlichen
  rationale: Die Übersetzung bewahrt das biblische Bild und die Spannung des σάρξ-Begriffs. „Sündig“ würde die Aussage bereits interpretierend festlegen, während „fleischlich“ im heutigen Deutsch missverständlich oder rein körperlich klingen kann.
- issue: Bedeutung von ψυχή
  choice: die Seele
  alternative: das Leben; das Selbst; den Menschen
  rationale: „Seele“ wahrt die begriffliche und theologische Offenheit des Ausgangstextes. Es ist hier nicht nötig, ψυχή ausschließlich als biologisches Leben oder als technische Bezeichnung eines vom Körper getrennten Bestandteils zu bestimmen.
- issue: Status der Adressaten als πάροικοι und παρεπίδημοι
  choice: Fremde und Gäste
  alternative: Beisassen und vorübergehend Ansässige; Heimatlose und Verbannte
  rationale: Die gewählte Paarung lässt die soziale wie theologische Fremdheit erkennen, ohne ausdrücklich Exil, Verbannung oder eine ausschließlich geistliche Deutung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Ihr Geliebten“ bewahrt die Herzlichkeit; der Imperativ nach dem Doppelpunkt macht die griechische Infinitivkonstruktion natürlich verständlich. Das militärische Bild und die offenen theologischen Begriffe „Fleisch“ und „Seele“ bleiben erhalten.
