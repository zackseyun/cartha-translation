id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: de
  text: Wenn ihr zu ihm kommt[a], zu einem lebendigen Stein, der von den Menschen verworfen, bei Gott aber auserwählt und kostbar ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Indem ihr zu ihm kommt“ oder „während ihr zu ihm kommt“.'
    reason: Das griechische Präsenspartizip lässt die genaue zeitliche bzw. modale Beziehung offen.
lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: Wenn ihr zu ihm kommt
  rationale: Die finite deutsche Konstruktion gibt das auf die Adressaten bezogene Präsenspartizip natürlich wieder und bewahrt den gerichteten Sinn von πρός. „Wenn“ lässt den fortlaufenden bzw. wiederholten Vollzug offen, ohne ihn als bloße Bedingung festzulegen.
- source_word: λίθον ζῶντα
  choice: zu einem lebendigen Stein
  rationale: „Stein“ entspricht λίθος und erhält das im Kontext entfaltete Bild eines Bausteins; „lebendig“ bewahrt die paradoxe Metapher.
- source_word: ὑπὸ ἀνθρώπων
  choice: von den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen im Gegensatz zu Gott. Der bestimmte Plural ist im modernen Deutschen natürlich und schließt nicht nur Männer ein.
- source_word: ἀποδεδοκιμασμένον
  choice: verworfen
  rationale: Das Perfektpartizip bezeichnet einen nach Prüfung abgelehnten Stein. „Verworfen“ ist prägnant, würdig und passt zur biblischen Steinmetaphorik.
- source_word: παρὰ δὲ θεῷ
  choice: bei Gott aber
  rationale: παρά mit Dativ bezeichnet hier die Stellung bzw. Bewertung bei Gott. Die knappe Wiedergabe bewahrt den Gegensatz zur menschlichen Verwerfung, ohne die evaluative Perspektive übermäßig auszudeuten.
- source_word: ἐκλεκτὸν
  choice: auserwählt
  rationale: „Auserwählt“ gibt die göttliche Auswahl klar wieder und passt idiomatisch zum Messias, ohne das substantivische Fachwort „der Erwählte“ einzusetzen.
- source_word: ἔντιμον
  choice: kostbar
  rationale: Das Wort kann „hochgeehrt“ oder „wertvoll“ bedeuten. „Kostbar“ erhält sowohl den hohen Wert als auch den Bezug zum Steinbild.
theological_decisions:
- issue: Bezug von „ihm“ und Bild des lebendigen Steins
  choice: Das Pronomen bleibt stehen; der Kontext identifiziert den Herrn bzw. Christus als den lebendigen Stein.
  alternative: Den Namen „Jesus Christus“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Zusammenhang und die Steintexte in 2,6–8 machen den Bezug deutlich, doch der griechische Wortlaut nennt hier keinen Namen. Die Übersetzung sollte ihn daher nicht ergänzen.
- issue: Bedeutung von ἔντιμον
  choice: kostbar
  alternative: geehrt / hoch angesehen
  rationale: Beide Bedeutungsrichtungen sind möglich. „Kostbar“ passt besonders gut zur Steinmetaphorik, während die Fußnote die Ehrenkomponente sichtbar hält.
- issue: Zeitlich-aspektuale Beziehung des Partizips προσερχόμενοι
  choice: Wenn ihr zu ihm kommt
  alternative: Indem ihr zu ihm kommt / während ihr zu ihm kommt
  rationale: Das Partizip beschreibt das Hinzutreten der Adressaten, ohne die genaue adverbiale Beziehung ausdrücklich festzulegen. Die Hauptfassung ist idiomatisch; die Fußnote bewahrt naheliegende Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nah am griechischen Satzbau, wird aber durch die Wiederholung von „zu“ verständlich gegliedert. Marker [a] steht im Haupttext; Fußnote [b] ist nicht verwendet, weil die Haupttextfassung keinen Marker [b] enthält.
