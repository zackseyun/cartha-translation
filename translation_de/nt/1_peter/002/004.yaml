  source_fidelity: 'Der griechische Satzbau und die zentralen Bedeutungen werden zuverlässig wiedergegeben: das fortdauernde Hinzutreten zu Christus, das Bild des lebendigen Steins, die menschliche Verwerfung sowie Gottes Erwählung und hohe Wertschätzung. „Von den Menschen“ entspricht ὑπὸ ἀνθρώπων idiomatisch und sachgerecht. Die Wiedergabe von παρά mit Dativ als „bei Gott“ bewahrt die knappe relationale bzw. bewertende Aussage ohne unzulässige Ausdeutung.'
