  terminology: „Lebendiger Stein“, „verworfen“, „auserwählt“ und „kostbar“ sind treffende, kontextgerechte Wiedergaben. Sie erhalten sowohl die Steinmetaphorik als auch die theologisch gewichtete Terminologie, ohne den im griechischen Text pronominal belassenen Christusbezug auszuschreiben.
