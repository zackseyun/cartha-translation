  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: de
  text: Ihr Haussklaven[a], ordnet euch euren Herren in aller Ehrfurcht[b] unter – nicht nur den guten und nachsichtigen, sondern auch den verkehrten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hausbedienstete“. Das griechische Wort bezeichnet unfreie Bedienstete innerhalb eines Haushalts.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in aller Furcht“; gemeint sein können auch ehrfürchtige Scheu und respektvolle Achtung.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Wörtlich: „krummen“; gemeint sind verkehrte, ungerechte oder harte Herren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: Haussklaven
  rationale: Der Ausdruck bezeichnet abhängige Menschen, die als Sklaven beziehungsweise Bedienstete in einem Haushalt lebten und arbeiteten. „Haussklaven“ macht sowohl den häuslichen Bereich als auch den unfreien sozialen Status deutlich.
- source_word: ὑποτασσόμενοι
  choice: ordnet euch … unter
  rationale: Das Partizip hat im Zusammenhang auffordernde Kraft. Die reflexive Form gibt die verlangte Haltung natürlich und verständlich wieder.
- source_word: ἐν παντὶ φόβῳ
  choice: in aller Ehrfurcht
  rationale: φόβος umfasst Furcht, Scheu und respektvolle Ehrfurcht. „Ehrfurcht“ wahrt den ernsten Ton, ohne den Ausdruck vorschnell als bloße Angst vor den Herren festzulegen.
- source_word: δεσπόταις
  choice: Herren
  rationale: δεσπότης bezeichnet hier diejenigen, die im antiken Haushalt Verfügungsgewalt über Sklaven hatten. „Herren“ ist im Deutschen die sachlich passende historische Bezeichnung.
- source_word: ἀγαθοῖς
  choice: guten
  rationale: Die direkte Wiedergabe bewahrt die allgemeine moralische Bewertung des griechischen Adjektivs.
- source_word: ἐπιεικέσιν
  choice: nachsichtigen
  rationale: ἐπιεικής bezeichnet ein mildes, rücksichtsvolles und nicht auf dem eigenen Recht bestehendes Verhalten. „Nachsichtig“ passt natürlich zum Gegensatz mit den verkehrten Herren.
- source_word: σκολιοῖς
  choice: verkehrten
  rationale: Das Wort bedeutet wörtlich „krumm“ und bezeichnet übertragen Menschen, die moralisch verdreht, unfair oder schwierig sind. „Verkehrt“ bewahrt diese bildhafte moralische Weite besser als das engere „hart“.
theological_decisions:
- issue: Wiedergabe des antiken Abhängigkeitsverhältnisses
  choice: Haussklaven … Herren
  alternative: Hausbedienstete … Herren
  rationale: Die Übersetzung soll den häuslichen Bezug von οἰκέται erkennen lassen, darf aber den unfreien Status der Angesprochenen nicht beschönigen. Die Fußnote nennt eine geläufigere, jedoch potenziell abschwächende Alternative.
- issue: Bezug und Bedeutung von φόβος
  choice: in aller Ehrfurcht
  alternative: in aller Furcht / mit allem Respekt
  rationale: Der griechische Ausdruck lässt die Nuancen Furcht, Scheu und respektvolle Ehrfurcht anklingen; zudem wird nicht ausdrücklich gesagt, ob die Haltung primär auf Gott oder auf die Herren bezogen ist. „Ehrfurcht“ erhält diese theologische und semantische Spannung besser als eine eindeutige Festlegung auf Angst oder bloße Höflichkeit.
- issue: Charakterisierung der unguten Herren
  choice: die verkehrten
  alternative: die harten / ungerechten
  rationale: σκολιός ist bildhaft „krumm, verdreht“. Die Hauptfassung bewahrt das Bild in verständlichem Deutsch; die Fußnote erschließt mögliche kontextuelle Bedeutungen, ohne den Ausdruck auf Härte allein zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haussklaven“ benennt die historische Realität ohne Beschönigung; „ordnet euch … unter“ ist gegenwärtig verständlich und gibt die auffordernde Funktion des griechischen Partizips wieder. Der Gedankenstrich macht den Gegensatz übersichtlich, ohne die Satzstruktur wesentlich zu verändern.
