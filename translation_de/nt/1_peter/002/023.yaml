    rationale: Die Formulierung ist zwar verständlich, klingt aber weniger idiomatisch und kann ein passives Sich-Ausgeliefertsein nahelegen. „Vertraute sich dem ... an“ trifft die kontextuelle Bedeutung des fortgesetzten Anvertrauens besser.
  - severity: low
    issue: Fußnote erklärt die durch die Übersetzung ergänzte Reflexivbeziehung nicht ganz klar
    rationale: Wenn der Haupttext „sich“ ergänzt, sollte die Anmerkung knapp und transparent sagen, dass das Objekt im Griechischen nicht ausdrücklich genannt wird und eine auf die Sache bezogene Auffassung ebenfalls möglich ist.
