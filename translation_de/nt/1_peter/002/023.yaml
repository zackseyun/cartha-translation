  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: de
  text: Als er beschimpft wurde, beschimpfte er nicht zurück; als er litt, drohte er nicht, sondern vertraute sich dem an, der gerecht richtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιδορούμενος / ἀντελοιδόρει
  choice: als er beschimpft wurde, schimpfte er nicht zurück
  rationale: „Beschimpfen“ gibt den verbalen Missbrauch und in der zweiten Formulierung durch „zurück“ auch die Gegenreaktion natürlich und präzise wieder. Die Vergangenheitsform beschreibt sein durchgängiges Verhalten.
- source_word: πάσχων οὐκ ἠπείλει
  choice: als er litt, drohte er nicht
  rationale: Die zeitliche Wiedergabe des Partizips wahrt die Parallelität zum ersten Satzteil; „drohte nicht“ bezeichnet klar den Verzicht auf Drohungen.
- source_word: παρεδίδου
  choice: überließ sich
  rationale: παραδίδωμι bezeichnet hier das Übergeben beziehungsweise Anvertrauen. „Überließ sich“ ist im Deutschen natürlich, wahrt aber durch eine Fußnote, dass im Griechischen kein ausdrückliches Objekt steht. Der durative Aspekt ergibt sich im Kontext als anhaltende Haltung und wird nicht durch ein schwerfälliges Zusatzwort erzwungen.
- source_word: τῷ κρίνοντι δικαίως
  choice: dem, der gerecht richtet
  rationale: Die substantivierte Partizipialform bleibt als beschreibende Wendung erhalten; δικαίως wird adverbial mit „gerecht“ wiedergegeben, ohne daraus einen Titel zu machen.
- source_word: δὲ
  choice: sondern
  rationale: Nach der Verneinung bringt „sondern“ den griechischen Kontrast idiomatisch und deutlich zum Ausdruck.
- source_word: ὃς
  choice: als er
  rationale: Das Relativpronomen führt die Beschreibung Christi aus dem vorhergehenden Kontext fort. Im Deutschen ergibt die temporale Fortführung mit dem wiederaufgenommenen Pronomen einen natürlichen Versanschluss.
theological_decisions:
- issue: Bezug von „dem, der gerecht richtet“
  choice: Der Bezug auf Gott bleibt wie im Griechischen beschreibend und ohne ausdrückliche Personenbezeichnung.
  alternative: „Gott, dem gerechten Richter“ oder ausdrücklich „dem Vater“
  rationale: Der Kontext legt Gott als den Richtenden nahe, doch der griechische Wortlaut nennt weder den Titel „Gott“ noch ausdrücklich den Vater. Die Übersetzung konkretisiert daher nicht über den Text hinaus.
- issue: Unausgesprochenes Objekt von παρεδίδου
  choice: Im Haupttext steht idiomatisch „überließ sich“, während die Auslassung des Objekts im Griechischen in der Fußnote offengelegt wird.
  alternative: „überließ ihm seine Sache“ oder eine objektlose, im Deutschen ungrammatische Wiedergabe
  rationale: Das Griechische lässt offen, was genau übergeben wird. Im Zusammenhang ist die Selbstübergabe wahrscheinlich; „seine Sache“ bleibt ebenfalls möglich. Die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallelen Satzglieder bilden die Struktur des griechischen Textes ab; unnötig kirchensprachliche Wörter wie „schmähen“ oder „anheimstellen“ werden vermieden.
