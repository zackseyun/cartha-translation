id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: de
  text: Denn ihr wart wie Schafe, die umherirrten[a]. Doch jetzt seid ihr zum Hirten und Hüter[b] eurer Seelen[c] zurückgekehrt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich verirrten“; möglich ist auch: „die irregeführt wurden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Aufseher“; traditionell: „Bischof“.'
    reason: lexical_alternative
  - marker: c
    text: „Seelen“ kann hier auch das Leben oder die ganze Person bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „seid ihr … zurückgebracht worden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Denn ihr wart
  rationale: γάρ begründet die vorherige Aussage; der Imperfekt ἦτε beschreibt den früheren Zustand der Angesprochenen.
- source_word: ὡς πρόβατα
  choice: wie Schafe
  rationale: ὡς kennzeichnet einen Vergleich; die schlichte Wiedergabe erhält das Hirtenbild.
- source_word: πλανώμενοι
  choice: die umherirrten
  rationale: Das Partizip kann intransitiv das Umherirren oder Verirren und passivisch ein Irregeführtwerden ausdrücken. „umherirrten“ wahrt das Bild, ohne eine verursachende Instanz festzulegen.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: Doch jetzt seid ihr … zurückgekehrt
  rationale: ἀλλά setzt einen deutlichen Gegensatz. Die deutsche Perfektform gibt die vollzogene Wendung mit gegenwärtiger Bedeutung idiomatisch wieder; die mögliche passive Nuance wird in einer Fußnote erhalten.
- source_word: ἐπὶ τὸν ποιμένα
  choice: zum Hirten
  rationale: ποιμήν bezeichnet einen Hirten. Im Kontext ist Christus gemeint; die Bezeichnung bleibt dennoch sprachlich natürlich.
- source_word: καὶ ἐπίσκοπον
  choice: und Hüter
  rationale: ἐπίσκοπος bezeichnet hier denjenigen, der über andere wacht und für sie sorgt. „Hüter“ ist im heutigen Deutsch verständlich und vermeidet die spätere kirchenamtliche Einengung von „Bischof“; „Aufseher“ wird als lexikalisch nähere Alternative dokumentiert.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: eurer Seelen
  rationale: ψυχή kann Seele, Leben oder die ganze Person bezeichnen. „Seelen“ bewahrt die traditionelle und lexikalisch mögliche Formulierung, während eine Fußnote die größere Bedeutungsbreite sichtbar macht.
theological_decisions:
- issue: ἐπίσκοπος als christologische Bezeichnung
  choice: Hüter
  alternative: 'Aufseher; traditionell: Bischof'
  rationale: Der Vers bezeichnet Christus sowohl als ποιμήν als auch als ἐπίσκοπος. „Hüter“ bringt sein wachsames Sorgen zum Ausdruck, ohne eine bestimmte spätere Kirchenordnung in den Text einzutragen.
- issue: Diathese von ἐπεστράφητε
  choice: seid … zurückgekehrt
  alternative: seid … zurückgebracht worden
  rationale: Obwohl die Form grammatisch passiv ist, kann das Verb hier intransitiv beziehungsweise mit medialem Sinn verstanden werden. Die Hauptfassung lässt das Verhältnis von göttlichem Handeln und menschlicher Umkehr offen; die passive Möglichkeit steht in der Fußnote.
- issue: Bedeutungsumfang von ψυχή
  choice: Seelen
  alternative: Leben; euch selbst
  rationale: Die traditionelle Wiedergabe wird beibehalten, darf aber nicht auf einen körperlosen Teil des Menschen verengt werden. Die Fußnote weist auf den möglichen Bezug auf das ganze Leben beziehungsweise die ganze Person hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das Hirtenbild bleibt anschaulich; konfessionell geprägte Amtsbegriffe werden in der Hauptfassung vermieden. Sämtliche echten lexikalischen und grammatischen Mehrdeutigkeiten werden knapp in Fußnoten ausgewiesen.
