  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: de
  text: 'Denn das ist Gottes Wille: dass ihr durch gutes Tun die Unwissenheit unvernünftiger Menschen zum Schweigen bringt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Unwissenheit unvernünftiger Menschen einen Maulkorb anlegen“. Das Verb wird hier bildlich dafür gebraucht, feindselige Rede zum Verstummen zu bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorausgehende Aufforderung; „Denn“ gibt diesen kausalen Zusammenhang natürlich wieder.
- source_word: οὕτως
  choice: so
  rationale: οὕτως bezeichnet die Weise, in der Gottes Wille verwirklicht wird, und bleibt mit „so“ knapp und nah am griechischen Ausdruck.
- source_word: θέλημα
  choice: Wille
  rationale: „Wille“ ist die direkte und geläufige Wiedergabe für Gottes Absicht oder Wollen.
- source_word: ἀγαθοποιοῦντας
  choice: Indem ihr Gutes tut
  rationale: Das Partizip bezeichnet hier das Mittel beziehungsweise die Weise, durch die das folgende Zum-Schweigen-Bringen geschieht.
- source_word: φιμοῦν
  choice: zum Schweigen bringen
  rationale: Das Verb bedeutet wörtlich „einen Maulkorb anlegen“, wird hier aber bildlich für das Unterbinden feindseliger Rede gebraucht.
- source_word: ἀγνωσίαν
  choice: Unwissenheit
  rationale: „Unwissenheit“ gibt den Mangel an Einsicht direkt wieder, ohne die im Kontext mitschwingende Vorwerfbarkeit zusätzlich auszudeuten.
- source_word: ἀφρόνων ἀνθρώπων
  choice: unverständiger Menschen
  rationale: ἄφρων bezeichnet Menschen ohne vernünftige Einsicht; „unverständig“ ist würdig und weniger missverständlich als das im heutigen Deutsch oft beleidigend klingende „töricht“. ἄνθρωποι ist generisch und wird daher mit „Menschen“ wiedergegeben.
theological_decisions:
- issue: Generische Wiedergabe von ἀνθρώπων
  choice: Menschen
  alternative: Männer
  rationale: Der griechische Ausdruck bezeichnet hier menschliche Gegner allgemein und ist nicht auf männliche Personen beschränkt.
- issue: Verhältnis von Gottes Willen und menschlichem Handeln
  choice: „sollt ihr“ als natürliche Entfaltung des Infinitivs
  alternative: „Gutes tuend die Unwissenheit … zum Schweigen zu bringen“
  rationale: Die deutsche Formulierung macht die im griechischen Infinitiv ausgedrückte Zielsetzung verständlich, ohne eine Aussage darüber hinzuzufügen, wie Gottes Wille notwendigerweise verwirklicht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den begründenden Anschluss mit „Denn“ und die Mittelangabe mit „Indem“. Der Fußnotenmarker [a] steht im Haupttext.
