  - severity: low
    issue: Wortwahl für ἀφρόνων
    rationale: „unverständig“ ist nicht falsch, doch „unvernünftig“ ist im modernen Standarddeutsch geläufiger und trifft hier die Bedeutung von ἄφρων klarer.
