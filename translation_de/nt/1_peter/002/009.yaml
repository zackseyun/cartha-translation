  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: de
  text: Ihr aber seid ein auserwähltes Volk[a], eine königliche Priesterschaft, eine heilige Nation, ein Volk, das ihm gehört, damit ihr die Vortrefflichkeiten[b] dessen verkündet, der euch aus der Finsternis in sein wunderbares Licht gerufen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein auserwähltes Geschlecht“. Das griechische Wort kann eine Abstammungsgemeinschaft, ein Geschlecht oder ein Volk bezeichnen. „Volk“ vermeidet hier missverständliche moderne Vorstellungen von biologischer oder ethnischer „Rasse“ und erhält den kollektiven Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Lobpreis“ oder „die mächtigen Taten“. Das griechische Wort kann Gottes Vortrefflichkeiten sowie seine preiswürdigen oder machtvollen Taten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Ihr aber
  rationale: δὲ stellt die Angeredeten den zuvor beschriebenen Ungläubigen gegenüber; das ausdrücklich gesetzte Ὑμεῖς trägt Nachdruck. „Ihr aber“ bewahrt Kontrast und direkte Anrede knapp und natürlich.
- source_word: γένος ἐκλεκτόν
  choice: ein auserwähltes Volk
  rationale: γένος kann Geschlecht, Abstammungsgemeinschaft oder Volk bezeichnen. „Volk“ gibt hier die kollektive Bundesidentität verständlich wieder, ohne moderne biologische oder ethnische Vorstellungen nahezulegen; die wörtlichere Alternative steht in der Fußnote.
- source_word: βασίλειον ἱεράτευμα
  choice: eine königliche Priesterschaft
  rationale: Die kompakte Nominalfügung nimmt 2. Mose 19,6 in der griechischen Fassung auf. „Königliche Priesterschaft“ wahrt sowohl die königliche als auch die priesterliche Dimension, ohne die Wendung vorschnell als „Königreich von Priestern“ auszulegen.
- source_word: ἔθνος ἅγιον
  choice: eine heilige Nation
  rationale: Die direkte Wiedergabe erhält den kollektiven, bundesbezogenen Sinn und die Bedeutung des Abgesondertseins von ἅγιον. „Nation“ wahrt zudem die Unterscheidung zwischen ἔθνος und λαός.
- source_word: λαὸς εἰς περιποίησιν
  choice: ein Volk, das ihm gehört
  rationale: περιποίησις bezeichnet hier besonderen Besitz beziehungsweise Zugehörigkeit. Die Formulierung ist natürliches modernes Deutsch; „ihm“ macht den im Zusammenhang eindeutig auf Gott bezogenen Besitzer ausdrücklich, ohne eine zusätzliche Lehraussage einzuführen.
- source_word: ὅπως
  choice: damit
  rationale: ὅπως leitet den Zweck ein; „damit“ gibt diese Funktion idiomatisch wieder.
- source_word: τὰς ἀρετὰς
  choice: die Ruhmestaten
  rationale: ἀρετή kann Vortrefflichkeit, preiswürdige Eigenschaft oder eine des Lobes würdige Tat bezeichnen. „Ruhmestaten“ passt zum öffentlichen Verkündigen und zu Gottes rettendem Handeln im folgenden Relativsatz, verengt den möglichen Sinn jedoch stärker auf Taten; die breitere Alternative wird deshalb in der Fußnote genannt.
- source_word: ἐξαγγείλητε
  choice: ihr … verkündet
  rationale: Der Aorist Konjunktiv nach ὅπως bezeichnet die beabsichtigte Handlung. „Verkündet“ bewahrt den öffentlichen, proklamierenden Charakter von ἐξαγγέλλω.
- source_word: τοῦ … καλέσαντος
  choice: dessen, der … gerufen hat
  rationale: Die Genitivkonstruktion verbindet das Verkündete mit dem durch sein Rufen bezeichneten Gott. Die deutsche Relativfügung erhält diesen Bezug, ohne den im Griechischen nicht ausdrücklich genannten Gottesnamen einzusetzen.
- source_word: ἐκ σκότους
  choice: aus der Finsternis
  rationale: ἐκ bezeichnet die Bewegung aus einem Bereich heraus. „Aus der Finsternis“ erhält das räumlich geprägte Bild der Befreiung.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: in sein wunderbares Licht
  rationale: θαυμαστός bezeichnet etwas Wunderbares, Staunenswertes. „Wunderbar“ ist verständlich und würdevoll und erhält den erhöhten Ton.
theological_decisions:
- issue: Kollektive Identitätsbezeichnungen aus der Bundesterminologie Israels
  choice: 'Die alttestamentlich geprägten Kollektivbezeichnungen bleiben direkt stehen: „auserwähltes Volk“, „königliche Priesterschaft“, „heilige Nation“.'
  alternative: Die Ausdrücke abschwächen oder ausdrücklich nur metaphorisch wiedergeben.
  rationale: Der Vers überträgt diese Bundesbezeichnungen bewusst auf die angesprochene Gemeinschaft. Die Übersetzung wahrt diese Spannung, ohne daraus ein weitergehendes theologisches System oder eine Aussage über die Verwerfung Israels abzuleiten.
- issue: Nicht ausdrücklich genannter Besitzer in λαὸς εἰς περιποίησιν
  choice: Der im Zusammenhang vorausgesetzte göttliche Besitzer wird mit „ihm“ ausgedrückt.
  alternative: Formal „ein Volk zum Besitz“ oder „ein Volk zur Aneignung“ stehen lassen.
  rationale: Der Bezug auf Gott ist kontextuell klar, während eine besitzerlose Formulierung im Deutschen unnatürlich und missverständlich wäre. Die Verdeutlichung dient der Sprachklarheit und fügt keine konfessionelle Sonderlehre hinzu.
- issue: Bedeutungsumfang von τὰς ἀρετὰς
  choice: Im Haupttext steht „Ruhmestaten“, während die Fußnote den weiteren Sinn „preiswürdige Eigenschaften/Vorzüge“ offenhält.
  alternative: Nur „Vorzüge“, „Lobpreis“ oder „Tugenden“ setzen.
  rationale: Der Zusammenhang mit Gottes Ruf aus der Finsternis legt seine preiswürdigen Taten nahe, doch das griechische Wort kann auch seine Vortrefflichkeiten bezeichnen. Haupttext und Fußnote bewahren gemeinsam diese echte Bedeutungsbreite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht erhöhtem Ton. Die parallele Reihung der vier Identitätsaussagen und die Bewegung „aus … in …“ bleiben erhalten. „Nation“ wird trotz möglicher moderner Staatsassoziationen verwendet, weil es ἔθνος von γένος und λαός unterscheidet; der Zusammenhang macht den religiös-korporativen Sinn deutlich.
