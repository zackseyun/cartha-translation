  source_fidelity: Die Übersetzung bildet εἰ ἐγεύσασθε als konditionale Aussage („wenn ihr … geschmeckt habt“) ab und bewahrt sowohl das konkrete Geschmacksbild als auch den durch ὅτι eingeleiteten Inhalt. „Der Herr“ gibt κύριος angemessen wieder, ohne den im Kontext naheliegenden, aber intertextuell vielschichtigen Referenten festzulegen.
  naturalness: „Wenn ihr wirklich geschmeckt habt, dass der Herr gut ist“ ist verständliches modernes Standarddeutsch. Die Verbindung „geschmeckt haben, dass“ ist leicht bibelnah, aber hier wegen des Bildfelds aus 2,2–3 und des Psalmanklangs stilistisch gerechtfertigt. „Wirklich“ kann die rhetorisch erwartete Erfüllung der Bedingung ausdrücken, ohne die Konditionalform aufzugeben.
  terminology: „Gut“ ist für χρηστός breit genug und wahrt den Psalmanklang; die Fußnote nennt „gütig“ und „gnädig“ sachgerecht als mögliche Nuancierungen. „Herr“ ist als Wiedergabe von κύριος konsistent. Der Verweis auf Psalm 34,9 entspricht der im Deutschen üblichen Psalmzählung und ist korrekt verankert.
