  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: de
  text: wenn ihr wirklich geschmeckt habt, dass der Herr gut ist[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da ihr geschmeckt habt“. Die griechische Bedingungsform kann hier voraussetzen, dass die Bedingung tatsächlich erfüllt ist.'
    reason: alternative_reading
  - marker: b
    text: „Gut“ kann auch mit „gütig“ oder „gnädig“ wiedergegeben werden. Die Formulierung erinnert an Psalm 34,9.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: wenn … wirklich
  rationale: Bewahrt die griechische Bedingungsform, während „wirklich“ erkennen lässt, dass die Bedingung rhetorisch als erfüllt vorausgesetzt sein kann.
- source_word: ἐγεύσασθε
  choice: ihr … geschmeckt habt
  rationale: Erhält das konkrete Bild des Schmeckens, das sowohl zur Nahrungssprache in 1 Petrus 2,2–3 als auch zum Anklang an Psalm 34,9 passt.
- source_word: ὅτι
  choice: dass
  rationale: Gibt den Inhalt dessen an, was die Leser geschmeckt beziehungsweise erfahren haben, und bildet die griechische Syntax unmittelbar ab.
- source_word: χρηστὸς
  choice: gut
  rationale: „Gut“ wahrt die Bedeutungsbreite des Adjektivs und den Anklang an Psalm 34; je nach Akzent sind auch „gütig“ oder „gnädig“ möglich.
- source_word: κύριος
  choice: der Herr
  rationale: Bewahrt den theologischen Titel und lässt sowohl den Bezug auf Christus im Kontext als auch den Psalmanklang stehen, ohne den Referenten im Text ausdrücklich festzulegen.
theological_decisions:
- issue: Aussagekraft des mit εἰ eingeleiteten Satzes
  choice: Die Bedingungsform bleibt als „wenn ihr wirklich“ erhalten.
  alternative: „da ihr geschmeckt habt“
  rationale: Das Griechische verwendet eine echte Bedingungsform, kann dabei aber voraussetzen, dass die Bedingung erfüllt ist. Die Übersetzung erhält diese rhetorische Spannung.
- issue: Bezug von „der Herr“
  choice: Der Titel bleibt ohne erläuternden Zusatz stehen.
  alternative: „der Herr, Christus“
  rationale: Der Zusammenhang legt einen Bezug auf Christus nahe, während die Formulierung zugleich Psalm 34 aufgreift. Eine ausdrückliche Festlegung im Haupttext würde diese Mehrschichtigkeit einengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „geschmeckt habt, dass“ wird beibehalten, um das biblische Geschmacksbild und den Psalmanklang nicht durch das abstraktere „erfahren“ abzuschwächen.
