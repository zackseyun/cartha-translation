  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: de
  text: Er selbst hat unsere Sünden in seinem Leib auf das Holz hinaufgetragen[a], damit wir, den Sünden abgestorben, für die Gerechtigkeit leben. Durch seine Wunde[b] wurdet ihr geheilt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Kreuz“. Wörtlich steht im Griechischen „auf das Holz“; die Formulierung klingt wahrscheinlich an 5. Mose 21,23 an.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch seine Strieme“ beziehungsweise „durch seinen Bluterguss“. Der Singular erinnert an Jesaja 53,5.'
    reason: lexical_alternative
  - marker: c
    text: Die Heilung wird hier umfassend ausgedrückt. Im Zusammenhang steht sie mit Sünden und Gerechtigkeit, ohne ausdrücklich auf ausschließlich körperliche oder ausschließlich geistliche Heilung begrenzt zu werden.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: hat … hinaufgetragen
  rationale: ἀναφέρω kann „hinauftragen“, „darbringen“ oder „tragen“ bedeuten. „Hinaufgetragen“ bewahrt die Bewegungsrichtung der Verbindung ἐπὶ τὸ ξύλον und lässt zugleich den Opfer- und Jesaja-Anklang bestehen, ohne ihn technisch festzulegen.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: an seinem Leib
  rationale: Im Deutschen bezeichnet „an seinem Leib“ natürlich den Ort, an dem Christus die Sünden beim Tod am Holz trug. „Leib“ wahrt den konkreten körperlichen Bezug und den würdigen biblischen Ton.
- source_word: ἐπὶ τὸ ξύλον
  choice: auf das Holz
  rationale: ξύλον bedeutet „Holz“ oder „Baum“. Mit „auf das Holz“ bleibt die ungewöhnliche Ausdrucksweise der griechischen Vorlage sowie der mögliche Anklang an Deuteronomium 21,23 sichtbar; „Kreuz“ wäre bereits deutender.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: den Sünden abgestorben
  rationale: ἀπογίνομαι bezeichnet hier eine entschiedene Loslösung. „Den Sünden abgestorben“ gibt diese Todesmetaphorik knapp und idiomatisch wieder und erhält den Plural der Vorlage.
- source_word: τῇ δικαιοσύνῃ
  choice: für die Gerechtigkeit
  rationale: Der Dativ bezeichnet die neue Ausrichtung des Lebens. „Für die Gerechtigkeit leben“ ist im modernen Deutschen natürlicher als „der Gerechtigkeit leben“, ohne den ethischen und theologischen Gehalt von δικαιοσύνη einzuengen.
- source_word: μώλωπι
  choice: Wunde
  rationale: μώλωψ bezeichnet eine durch Schläge verursachte Verletzung, Strieme oder Prellung. „Wunde“ ist verständlich und bewahrt den auffälligen Singular sowie den Anklang an Jesaja 53,5.
- source_word: ἰάθητε
  choice: seid ihr geheilt worden
  rationale: Die Aorist-Passivform wird als vollzogene Heilung wiedergegeben. „Geheilt“ lässt die im Zusammenhang mit Sünde und Gerechtigkeit stehende, zugleich nicht ausdrücklich weiter eingegrenzte Bildsprache offen.
- source_word: αὐτὸς
  choice: Er selbst
  rationale: Die vorangestellte intensive Form hebt Christus als den Handelnden hervor; „Er selbst“ bildet diesen Nachdruck natürlich ab.
theological_decisions:
- issue: Reichweite der Heilungsaussage
  choice: „seid ihr geheilt worden“ ohne Zusatz oder Eingrenzung
  alternative: ausschließlich körperliche Heilung; ausschließlich geistliche Heilung von Sünde; umfassende Heilung mit primär heilsgeschichtlichem Schwerpunkt
  rationale: Der unmittelbare Zusammenhang verbindet die Heilung deutlich mit Sünden und Gerechtigkeit. Dennoch legt der Wortlaut die Reichweite nicht durch einen erklärenden Zusatz fest. Die offene Formulierung bewahrt sowohl den Kontext als auch den Anklang an Jesaja 53.
- issue: Wiedergabe von ξύλον
  choice: „Holz“ im Haupttext
  alternative: „Kreuz“ oder „Baum“
  rationale: Gemeint ist Jesu Kreuzigung, doch die Vorlage verwendet ξύλον, nicht σταυρός. „Holz“ wahrt die konkrete Wortwahl und ihren möglichen Schriftanklang; eine Fußnote nennt die verständliche Deutung „Kreuz“.
- issue: Art des Sündentragens
  choice: „hat unsere Sünden an seinem Leib auf das Holz hinaufgetragen“
  alternative: „hat unsere Sünden geopfert“ oder „trug unsere Sünden an seinem Leib am Holz“
  rationale: Die Formulierung erhält sowohl das Tragen der Sünden als auch die mögliche Bewegung zum Hinrichtungsort und vermeidet, das Verb ausschließlich als technischen Opferterminus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Argumentationsfolge, wird aber durch natürliche deutsche Fügungen lesbar gehalten. „Holz“ und „Wunde“ bewahren zentrale Schriftanklänge; erläuternde Alternativen stehen in den Fußnoten.
