id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: de
  text: Einst wart ihr kein Volk[a], jetzt aber seid ihr Gottes Volk; ihr hattet kein Erbarmen erfahren[b], jetzt aber habt ihr Erbarmen erfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petrus greift Hos 1,9–10; 2,23 auf und bezieht die dortige Sprache von Israels Wiederherstellung auf die gegenwärtige Zugehörigkeit seiner Leser zu Gottes Volk. In vielen deutschen Bibelausgaben stehen die entsprechenden Stellen unter Hos 1,9; 2,1.25.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Euch war kein Erbarmen erwiesen worden, jetzt aber ist euch Erbarmen erwiesen worden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: ihr
  rationale: Das Relativpronomen nimmt die in Vers 9 angesprochenen Leser auf. Im Deutschen führt die direkte Anrede mit »ihr« den Satz natürlich fort, ohne den Bezug zu verändern.
- source_word: ποτε
  choice: einst
  rationale: »Einst« bezeichnet den früheren Zustand und bildet einen klaren, würdevollen Gegensatz zu »jetzt«.
- source_word: λαός
  choice: Volk / Gottes Volk
  rationale: λαός bezeichnet hier eine gemeinschaftliche Identität und steht im Hintergrund der Bundes- und Wiederherstellungssprache Hoseas. »Kein Volk« bewahrt die Formulierung des ersten Satzglieds; »Gottes Volk« gibt λαὸς θεοῦ idiomatisch wieder.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv bezeichnet die Zugehörigkeit; »Gottes Volk« ist die natürliche deutsche Wiedergabe.
- source_word: οὐκ ἠλεημένοι
  choice: hattet kein Erbarmen erfahren
  rationale: Das Perfekt Passiv beschreibt den früheren Zustand von Menschen, denen kein Erbarmen zuteilgeworden war. Die Formulierung ist im Deutschen verständlich und wahrt sowohl den Empfang als auch die vorausgesetzte göttliche Zuwendung.
- source_word: ἐλεηθέντες
  choice: habt Erbarmen erfahren
  rationale: Der Aorist Passiv bezeichnet die erfolgte Zuwendung des Erbarmens. Das deutsche Perfekt bringt die daraus hervorgegangene gegenwärtige Lage natürlich zum Ausdruck und hält die Wortwahl parallel zum vorigen Satzglied.
- source_word: δέ
  choice: aber
  rationale: δέ kennzeichnet in beiden Gegenüberstellungen die Umkehr vom früheren zum jetzigen Zustand.
- source_word: νῦν
  choice: jetzt
  rationale: νῦν hebt die gegenwärtige Identität und Lage der Leser gegenüber ihrem früheren Zustand hervor.
theological_decisions:
- issue: Anspielung auf Hosea und Zugehörigkeit zu Gottes Volk
  choice: Die gemeinschaftliche Umkehrung wird als »kein Volk … Gottes Volk« wiedergegeben.
  alternative: Bereits im ersten Satzglied deutend »nicht Gottes Volk« zu schreiben.
  rationale: Im Griechischen lautet das erste Satzglied ausdrücklich »kein Volk«, das zweite dagegen »Gottes Volk«. Diese Unterscheidung bewahrt die Hosea-Anspielung und die Spannung des Wortlauts, ohne eine engere ethnische, konfessionelle oder heilsgeschichtliche Deutung in den Text einzutragen.
- issue: Passivformen von ἐλεέω
  choice: »Erbarmen erfahren«
  alternative: »Erbarmen wurde euch erwiesen«
  rationale: Beide Möglichkeiten lassen Gott als Handelnden aus dem Zusammenhang erkennen, ohne ihn entgegen der grammatischen Form ausdrücklich einzusetzen. Die Hauptfassung ist natürlicher und erhält die Parallelität der beiden Zustände; die stärker formale Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die zweimalige Gegenüberstellung »einst/jetzt« beziehungsweise des früheren und gegenwärtigen Zustands bleibt deutlich; unnötige kirchliche Fachsprache wird vermieden.
