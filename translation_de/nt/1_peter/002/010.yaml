  source_fidelity: 'Die Übersetzung bildet die beiden antithetischen Aussagen des Griechischen zuverlässig ab: den früheren Status »kein Volk«, die gegenwärtige Zugehörigkeit als »Gottes Volk« sowie den Kontrast zwischen nicht erfahrenem und erfahrenem Erbarmen. Die unterschiedliche Explizitheit von »kein Volk« und »Gottes Volk« bleibt erhalten. Die passivische Zuwendung von ἐλεέω wird mit »Erbarmen erfahren« angemessen wiedergegeben, ohne einen im griechischen Wortlaut nicht ausdrücklich genannten Handelnden einzusetzen.'
  naturalness: »Einst wart ihr kein Volk, jetzt aber seid ihr Gottes Volk« ist klares, modernes Standarddeutsch mit angemessen würdigem Register. Auch »Erbarmen erfahren« ist verständlich und idiomatisch; die gewählte Zeitfolge macht den Kontrast zwischen früherem Mangel und gegenwärtig empfangenem Erbarmen gut hörbar.
  terminology: »Volk« und »Gottes Volk« geben λαός bzw. λαὸς θεοῦ präzise und in der biblischen Sprache etabliert wieder. »Erbarmen« ist eine treffende, nicht konfessionell verengte Wiedergabe von ἐλεέω. Die Fußnote bewahrt die Hosea-Anspielung und weist sinnvoll auf die abweichende deutsche Verszählung hin.
