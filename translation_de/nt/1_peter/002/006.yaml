id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: de
  text: 'Denn in der Schrift steht: »Siehe, ich lege in Zion einen auserwählten, kostbaren Eckstein[a]; und wer an ihn[b] glaubt, wird ganz gewiss nicht beschämt werden[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen auserwählten, hoch angesehenen Eckstein«. Das griechische Wort kann sowohl hohes Ansehen als auch hohen Wert bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann sich das Pronomen auf den Stein beziehen. Im Zusammenhang wendet Petrus das Bild des Steins auf Christus an.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »wird niemals beschämt werden«. Die griechische Verneinung ist besonders nachdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Schriftstelle als Begründung für die vorausgehende Aussage ein.
- source_word: περιέχει ἐν γραφῇ
  choice: in der Schrift steht
  rationale: Gibt die ungewöhnliche unpersönliche griechische Wendung idiomatisch und dennoch formnah wieder.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, Aufmerksamkeit weckenden Ton des prophetischen Zitats.
- source_word: τίθημι ἐν Σιὼν
  choice: ich lege in Zion
  rationale: „Legen“ passt zum Bild des Bauens; „in Zion“ erhält den örtlichen Sinn von ἐν.
- source_word: λίθον ἀκρογωνιαῖον
  choice: Eckstein
  rationale: Die Verbindung bezeichnet den maßgeblichen Stein an der Ecke eines Bauwerks; „Eckstein“ ist die geläufige und klare deutsche Entsprechung.
- source_word: ἐκλεκτὸν ἔντιμον
  choice: auserwählten, hoch geehrten
  rationale: „Auserwählt“ wahrt den Gedanken göttlicher Auswahl. „Hoch geehrt“ gibt den Ehraspekt von ἔντιμος wieder, ohne dessen mögliche Wertbedeutung auszuschließen.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: wer an ihn glaubt
  rationale: Die deutsche Form ist natürlich und gibt den substantivierten Partizipialausdruck sowie die christologische Anwendung im Kontext wieder.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: wird ganz gewiss nicht beschämt werden
  rationale: „Ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή deutlich zum Ausdruck; „beschämt werden“ bleibt nahe am Verb.
theological_decisions:
- issue: Bezug von αὐτῷ im verwendeten Jesajazitat
  choice: 'persönlich: „an ihn“'
  alternative: 'sachlich: „auf ihn“ beziehungsweise „an ihn [den Stein]“'
  rationale: Das unmittelbare Bild ist ein Stein, doch Petrus bezieht den Stein im Zusammenhang auf Christus. Das persönliche Pronomen wahrt diese Anwendung, ohne das Steinbild aufzulösen.
- issue: Bedeutung von ἔντιμον
  choice: „hoch geehrt“
  alternative: „kostbar“ oder „wertvoll“
  rationale: Das Wort kann sowohl Ehre als auch hohen Wert bezeichnen. „Hoch geehrt“ bewahrt das Ehrenthema des unmittelbaren Zusammenhangs; die Wertbedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ ist bewusst leicht gehoben, weil es den prophetischen Zitatcharakter trägt. Die übrige Syntax bleibt klar und für heutige Leser gut verständlich.
