revisions:
- from: Denn was ist daran lobenswert, wenn ihr sündigt, geschlagen werdet und es aushaltet? Wenn ihr aber Gutes tut, dabei leiden müsst und es aushaltet, dann ist das Gnade bei Gott.[a]
  to: Denn was ist schon daran rühmlich, wenn ihr sündigt, geschlagen werdet und es aushaltet? Wenn ihr aber Gutes tut, leidet und es aushaltet, findet das bei Gott Anerkennung.[a]
  rationale: Die Revision entfernt die unbelegte Modalität in „leiden müsst“, glättet die rhetorische Frage und gibt die Schlusswendung in kontextgerecht verständlichem modernen Deutsch wieder. Die Fußnote erhält die lexikalische Ambiguität von χάρις und die nahe Formulierung „bei Gott“.
