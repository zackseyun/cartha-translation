review_pass:
  verdict: revise
  source_fidelity: Die parallele Struktur, die Wiederholung von ὑπομενεῖτε und die konkrete Bedeutung von κολαφιζόμενοι sind im Wesentlichen gut getroffen. „Dabei leiden müsst“ fügt jedoch mit „müsst“ eine modale Notwendigkeit hinzu, die πάσχοντες („leidend/leidend betroffen“) nicht ausdrückt. In τοῦτο χάρις παρὰ θεῷ bezeichnet χάρις im unmittelbaren Kontext am ehesten göttliches Wohlgefallen bzw. Anerkennung; eine deutsche Haupttextformulierung mit „Gnade bei Gott“ ist zwar lexikalisch transparent, aber ohne Erklärung semantisch unklar und weniger idiomatisch.
  naturalness: „Was ist daran lobenswert?“ ist verständlich, aber „Was ist schon daran rühmlich?“ gibt die rhetorische Frage und κλέος als erlangtes Lob bzw. Anerkennung natürlicher wieder. „Wenn ihr aber Gutes tut, leidet und es aushaltet“ bewahrt die knappe, parallele Reihung des Griechischen und vermeidet die unbelegte Modalität von „leiden müsst“.
  terminology: „Sündigt“, „geschlagen werdet“, „Gutes tut“ und die wiederholte Wendung „es aushaltet“ sind sachgerecht. Für χάρις παρὰ θεῷ ist „findet bei Gott Anerkennung“ im Deutschen die kontextgerechte Haupttextwiedergabe. Die Fußnote hält die lexikalisch wörtlichere, theologisch resonanzfähige Alternative „Gnade bei Gott“ offen, ohne die kontextuelle Bedeutung zu überdecken.
  issues:
  - severity: medium
    issue: Die Formulierung „dabei leiden müsst“ enthält ein nicht im Ausgangstext liegendes Modalverb.
    rationale: πάσχοντες beschreibt, dass die Adressaten leiden; es behauptet nicht, dass sie leiden müssen. „Leidet“ ist genauer und erhält die parallele Partizipialstruktur.
  - severity: low
    issue: „Das ist Gnade bei Gott“ ist im modernen Deutschen missverständlich und gibt die kontextuelle Funktion von χάρις hier nicht hinreichend klar wieder.
    rationale: In dieser Wendung ist das von Gott gewährte bzw. bei ihm geltende Wohlgefallen/Anerkennung gemeint. Eine Fußnote kann die wörtlichere Wiedergabe mit „Gnade“ transparent machen.
