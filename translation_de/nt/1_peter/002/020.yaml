source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: de
  text: Denn was ist schon daran rühmlich, wenn ihr sündigt, geschlagen werdet und es aushaltet? Wenn ihr aber Gutes tut, leidet und es aushaltet, findet das bei Gott Anerkennung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das ist Gnade bei Gott.“ Oder: „Das findet bei Gott Wohlgefallen“ bzw. „Das gefällt Gott.“'
    reason: Lexikalische und kontextuelle Alternative für χάρις παρὰ θεῷ. Die Haupttextfassung gibt die im Zusammenhang naheliegende Bedeutung göttlicher Anerkennung wieder; die Fußnote bewahrt die wörtlichere Wiedergabe von χάρις mit „Gnade“.
lexical_decisions:
- source_word: κλέος
  choice: lobenswert
  rationale: Im rhetorischen Zusammenhang bezeichnet das Wort nicht allgemeinen Ruhm, sondern etwas, das Lob oder Anerkennung verdient. Die adjektivische Wendung ist im heutigen Deutschen natürlicher als „was für ein Lob“.
- source_word: ἁμαρτάνοντες
  choice: wenn ihr sündigt
  rationale: „Sündigt“ bewahrt die ausdrücklich moralisch-theologische Aussage des Partizips; die konditionale Form gibt die griechische Konstruktion idiomatisch wieder.
- source_word: κολαφιζόμενοι
  choice: geschlagen werdet
  rationale: Das Verb bezeichnet körperliche Schläge, ursprünglich auch Faustschläge. „Geschlagen werdet“ ist klar und gegenwärtig, ohne die Art der Misshandlung stärker festzulegen als nötig.
- source_word: ὑπομενεῖτε
  choice: es aushaltet
  rationale: „Aushalten“ gibt das standhafte Bleiben unter Belastung natürlich wieder. Die identische Wiedergabe in beiden Satzhälften bewahrt die Wiederholung des griechischen Verbs.
- source_word: ἀγαθοποιοῦντες
  choice: Gutes tut
  rationale: Die direkte und idiomatische Formulierung umfasst sowohl rechtes Handeln als auch tätiges Wohltun.
- source_word: πάσχοντες
  choice: dabei leiden müsst
  rationale: „Leiden“ wahrt die Bedeutungsbreite des Verbs. „Dabei“ macht den Bezug zum Gutestun deutlich, während „müsst“ die tatsächlich erlittene Lage in natürlichem Deutsch ausdrückt, ohne die Ursache dogmatisch festzulegen.
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ erhält die lexikalische und theologische Resonanz von χάρις. Da das Wort hier zugleich Gottes Wohlgefallen oder Anerkennung bezeichnen kann, wird diese kontextuelle Bedeutung in der Fußnote genannt.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: παρά mit dem Dativ bezeichnet hier die Beziehung zu Gott beziehungsweise seine Einschätzung. „Bei Gott“ bleibt nahe an der griechischen Form und lässt sowohl Gegenwart als auch Beurteilung anklingen.
theological_decisions:
- issue: Bedeutung von χάρις in τοῦτο χάρις παρὰ θεῷ
  choice: „das ist Gnade bei Gott“ im Haupttext
  alternative: „das findet bei Gott Anerkennung/Wohlgefallen“
  rationale: Der Haupttext bewahrt „Gnade“ als theologisch gewichtige und lexikalisch transparente Wiedergabe, ohne die Wendung ausschließlich als Verdienst oder göttliche Belohnung zu deuten. Die Fußnote erschließt die im Zusammenhang wahrscheinliche Bedeutung der göttlichen Anerkennung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wurde idiomatisch formuliert; die parallele Wiederholung von „es aushaltet“ bleibt erhalten. Der Haupttext lässt die Spannung zwischen „Gnade“ und „Anerkennung/Wohlgefallen“ bewusst bestehen.
