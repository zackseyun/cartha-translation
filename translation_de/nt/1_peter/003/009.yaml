source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: de
  text: Vergeltet nicht Böses mit Bösem oder Beschimpfung mit Beschimpfung[a], sondern segnet vielmehr[b], denn dazu seid ihr berufen[c], damit ihr Segen erbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmähung mit Schmähung“. Das griechische Wort bezeichnet beleidigende, herabsetzende Rede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sondern segnet stattdessen“. Der griechische Ausdruck kennzeichnet eine nachdrückliche Umkehr des erwarteten Verhaltens.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt zunächst: dazu, auf Misshandlung mit Segen statt mit Vergeltung zu antworten. Die Formulierung kann zugleich das umfassendere christliche Leben unter Leiden einschließen.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: Vergeltet
  rationale: Der deutsche Imperativ gibt den verneinten Partizipialsatz im ermahnenden Zusammenhang natürlich wieder und bewahrt den Gedanken einer erwidernden Handlung.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: Böses mit Bösem
  rationale: Die geläufige ethische Wendung erhält das moralische Gewicht von κακόν; „mit“ bezeichnet im Deutschen idiomatisch die entsprechende Vergeltung.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: Beschimpfung mit Beschimpfung
  rationale: „Beschimpfung“ bezeichnet verletzende und herabsetzende Rede und bewahrt zugleich die parallele Formulierung.
- source_word: τοὐναντίον δὲ
  choice: sondern … im Gegenteil
  rationale: Die Formulierung bringt den nachdrücklichen Gegensatz zum vergeltenden Verhalten zum Ausdruck.
- source_word: εὐλογοῦντες
  choice: segnet
  rationale: „Segnen“ kann sowohl gutes Reden über jemanden als auch das Erbitten göttlichen Wohls umfassen; ein im Griechischen nicht genanntes Objekt wird nicht ergänzt.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ leitet hier in natürlichem, würdigem Deutsch den Grund für die Aufforderung ein.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: dazu seid ihr berufen
  rationale: Die Formulierung lässt „dazu“ auf das unmittelbar beschriebene Verhalten weisen, ohne den Bezug enger festzulegen, als es der Kontext erlaubt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck beziehungsweise das beabsichtigte Ergebnis knapp und natürlich wieder.
- source_word: εὐλογίαν
  choice: Segen
  rationale: Der artikellose deutsche Ausdruck ist nach „erben“ idiomatisch und erhält die mögliche Beziehung zwischen dem erteilten und dem empfangenen Segen.
- source_word: κληρονομήσητε
  choice: ihr … erbt
  rationale: „Erben“ bewahrt die familiäre und heilsgeschichtliche Bildwelt des Empfangens als Erbe; im damit-Satz ist der deutsche Indikativ die natürliche Wiedergabe des griechischen Konjunktivs.
theological_decisions:
- issue: Bezug von εἰς τοῦτο ἐκλήθητε
  choice: „Dazu“ bezieht sich zunächst auf das Segnen statt des Vergeltens.
  alternative: Die Berufung kann umfassender auf ein christliches Leben unter Leiden und ohne Vergeltung bezogen werden.
  rationale: Der unmittelbare Satzbau legt das zuvor genannte Verhalten nahe. Das Pronomen „dazu“ bleibt jedoch offen genug, um den weiteren Zusammenhang einzuschließen.
- issue: Verhältnis von Berufung und ererbtem Segen
  choice: 'Der Satz bewahrt die Zweckbeziehung: berufen, damit die Angesprochenen Segen erben.'
  alternative: Der Segen könnte stärker als begründende Zusage oder als Folge des segensreichen Handelns erläutert werden.
  rationale: Die Übersetzung gibt ἵνα mit „damit“ wieder und erklärt nicht näher, auf welche Weise Berufung, Verhalten und Erbe zusammenhängen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Die paarige Wiederholung „Böses mit Bösem“ und „Beschimpfung mit Beschimpfung“ erhält die rhetorische Struktur; „segnet“ bleibt wie im Griechischen ohne ausdrücklich genanntes Objekt.
