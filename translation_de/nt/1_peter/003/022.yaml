  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Grundstruktur und die Ausdrücke „zur Rechten Gottes“ sowie „in den Himmel“ zutreffend wieder. Die abschließende finite Aussage „sind ihm unterworfen“ gibt jedoch den aoristischen Passivpartizip ὑποταγέντων nicht hinreichend wieder: Das Griechische bezeichnet die erfolgte Unterwerfung, nicht lediglich den gegenwärtigen Zustand des Unterworfenseins.'
  naturalness: Der Satz ist grundsätzlich modernes, würdiges Standarddeutsch. Die Verbindung lässt sich mit einem einheitlichen temporalen Nebensatz natürlicher und zugleich näher an den beiden griechischen Partizipien gestalten.
  terminology: „Engel“ ist korrekt. Für ἐξουσίαι und δυνάμεις ist die Reihenfolge „Gewalten und Mächte“ im Deutschen semantisch näher am griechischen Wortlaut und bewahrt die Unterscheidung der beiden Begriffe. Die Liste bleibt ohne weitergehende Einordnung der genannten Wesen oder Mächte.
  issues:
  - severity: medium
    issue: Die Passiv- und Vorzeitigkeitsnuance von ὑποταγέντων fehlt.
    rationale: „Sind ihm unterworfen“ beschreibt einen Zustand. „Ihm ... unterworfen worden sind“ bildet dagegen das passive, als erfolgt dargestellte Unterwerfen ab und schließt sich angemessen an das vorausgehende Partizip an.
  - severity: low
    issue: Die deutschen Entsprechungen für ἐξουσιῶν und δυνάμεων stehen semantisch weniger passend.
    rationale: „Gewalten und Mächte“ entspricht der üblichen und näherliegenden Zuordnung von ἐξουσίαι und δυνάμεις; die dreigliedrige Aufzählung bleibt erhalten.
  revised_text: der zur Rechten Gottes ist, nachdem er in den Himmel gegangen ist und ihm Engel, Gewalten und Mächte unterworfen worden sind.
