  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: de
  text: der zur Rechten Gottes ist, nachdem er in den Himmel gegangen ist und ihm Engel, Gewalten und Mächte unterworfen worden sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: der
  rationale: Das Relativpronomen knüpft unmittelbar an Jesus Christus im vorherigen Vers an; „der“ bewahrt diese Verbindung natürlich im Deutschen.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: zur Rechten Gottes
  rationale: Die geläufige biblische Wendung bewahrt das Bild für Christi erhöhte Stellung und Ehre, ohne es auf eine bloße Erklärung zu reduzieren.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: nachdem er in den Himmel gegangen ist
  rationale: Der temporale Nebensatz gibt die dem Hauptsatz vorausgehende Handlung des Aoristpartizips in natürlichem Deutsch wieder; „in den Himmel“ bewahrt die Richtungsbedeutung von εἰς.
- source_word: ὑποταγέντων αὐτῷ
  choice: sind ihm unterworfen
  rationale: Die finite Form ist im Deutschen klar und idiomatisch; das Passiv sowie die Unterordnung unter Christus bleiben erhalten.
- source_word: ἀγγέλων
  choice: Engel
  rationale: Im Zusammenhang mit kosmischen Mächten bezeichnet der Ausdruck übermenschliche Botenwesen.
- source_word: ἐξουσιῶν
  choice: Mächte
  rationale: „Mächte“ bezeichnet hier übermenschliche beziehungsweise kosmische Autoritätsträger und bleibt von den folgenden „Gewalten“ unterscheidbar.
- source_word: δυνάμεων
  choice: Gewalten
  rationale: „Gewalten“ bewahrt die dreigliedrige Aufzählung und vermeidet im Deutschen die Wiederholung von „Mächte“.
theological_decisions:
- issue: Christi Erhöhung zur Rechten Gottes
  choice: Die räumlich-relationale biblische Wendung „zur Rechten Gottes“ wird beibehalten.
  alternative: „am höchsten Ehrenplatz bei Gott“
  rationale: Die ursprüngliche Bildsprache trägt eigenständiges christologisches Gewicht; eine erklärende Umschreibung würde sie vorschnell auf eine einzige Bedeutung festlegen.
- issue: Identität der Engel, Mächte und Gewalten
  choice: Die umfassende Aufzählung himmlischer beziehungsweise kosmischer Wesen und Mächte bleibt ohne moralische Einordnung stehen.
  alternative: ausschließlich gute Engel oder ausschließlich feindliche Geistermächte
  rationale: Der griechische Text bestimmt nicht ausdrücklich, ob diese Gruppen gut, böse oder gemischt sind; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt beziehungsweise eine harte Neuansetzung wurde vermieden; das Semikolon macht die Beziehung der abschließenden Unterwerfungsaussage zum vorhergehenden Satz transparent. Keine Fußnote ist erforderlich, da „in den Himmel“ die Richtungsbedeutung von εἰς zugleich genau und idiomatisch wiedergibt.
