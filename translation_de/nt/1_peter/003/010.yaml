source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: de
  text: Denn wer das Leben lieben und gute Tage sehen will, soll seine Zunge vom Bösen fernhalten und seine Lippen davon abhalten, Trug zu reden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Täuschung“ beziehungsweise „Arglist“. Das griechische Wort kann betrügerische Rede, List oder Hinterlist bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: wer ... will
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Menschen; „wer ... will“ ist im Deutschen natürlich, geschlechtsübergreifend und bewahrt den generischen Sinn.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die begründende Schriftanführung für die vorherige Ermahnung ein.
- source_word: ζωὴν ἀγαπᾶν
  choice: das Leben lieben
  rationale: Die Wendung bildet den griechischen Ausdruck eng und zugleich idiomatisch ab, ohne einen im Ausgangstext fehlenden Possessivbezug hinzuzufügen.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: gute Tage sehen
  rationale: Das konkrete Verb „sehen“ und das breite Bedeutungsfeld von ἀγαθός bleiben erhalten; die Wendung kann das Erleben guter Tage einschließen.
- source_word: παυσάτω
  choice: soll ... fernhalten
  rationale: Der Aoristimperativ fordert zum Aufhören beziehungsweise Abhalten auf. In Verbindung mit ἀπό gibt „soll ... fernhalten“ die verpflichtende Mahnung in natürlichem Deutsch wieder.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: seine Zunge vom Bösen fernhalten
  rationale: Bei Körperteilen ist das Possessivpronomen im Deutschen idiomatisch. „das Böse“ lässt den Bezug bewusst weit und kann insbesondere böses Reden bezeichnen.
- source_word: χείλη
  choice: seine Lippen
  rationale: Das konkrete Bild und der Plural des griechischen Textes werden bewahrt; das Possessivpronomen sorgt für natürliches Deutsch.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: seine Lippen davon, Trug zu reden
  rationale: Die Konstruktion mit articular infinitive und μή bezeichnet das Unterlassen beziehungsweise Verhindern. „Trug“ ist würdig und verständlich und bewahrt die Bandbreite absichtsvoller Täuschung.
theological_decisions:
- issue: Generischer Singular und Geschlechtsbezug
  choice: Die generische Person wird mit „wer“ bezeichnet; die Körperteile erhalten singularische Possessivpronomen.
  alternative: „Derjenige, der ... seine Zunge ... seine Lippen“ oder eine pluralische Formulierung.
  rationale: „Wer“ gibt den allgemein-repräsentativen Sinn ohne männliche Einengung wieder; „seine“ bezieht sich grammatisch auf den generischen Singular und behauptet kein ausschließlich männliches Gegenüber.
- issue: Bedeutungsumfang von κακόν
  choice: „vom Bösen“
  alternative: „von bösen Worten“ oder „vom bösen Reden“
  rationale: Der griechische Ausdruck nennt das Böse ohne ausdrückliche Ergänzung. Die engere Deutung auf Rede liegt wegen „Zunge“ nahe, soll aber nicht in den Text hineingeschrieben werden.
- issue: Bedeutungsumfang von δόλος
  choice: „Trug“ mit erläuternder Fußnote
  alternative: „Täuschung“, „Arglist“ oder „Falschheit“
  rationale: δόλος kann Täuschung, List oder Arglist bezeichnen. „Trug“ hält diese moralische und relationale Spannung offen, während die Fußnote zugänglichere Alternativen nennt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit nachvollziehbarem Anklang an die poetische Sprache des Psalmzitats. Die parallelen Bilder „Zunge“ und „Lippen“ sowie „gute Tage sehen“ bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
