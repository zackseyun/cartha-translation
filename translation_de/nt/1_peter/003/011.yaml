  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: de
  text: Er soll sich aber vom Bösen abwenden und Gutes tun; er soll Frieden suchen und ihm nachjagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Man soll sich vom Bösen abwenden und Gutes tun; man soll Frieden suchen und ihm nachjagen.“ Die griechischen Imperative stehen in der dritten Person Singular; im Zusammenhang beziehen sie sich allgemein auf den zuvor genannten Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: er soll sich abwenden
  rationale: Der Aoristimperativ in der dritten Person Singular fordert zu entschlossenem Handeln auf. „Sich abwenden“ bewahrt die Richtungsbedeutung von ἐκκλίνω.
- source_word: δὲ
  choice: vielmehr
  rationale: δέ führt den Gedankengang mit einem leichten Gegensatz fort. Im Zusammenhang der ethischen Gegenüberstellung von Bösem und Gutem gibt „vielmehr“ diesen Übergang natürlich wieder.
- source_word: ἀπὸ κακοῦ
  choice: vom Bösen
  rationale: κακόν bezeichnet hier angesichts des Gegensatzes zu ἀγαθόν das sittlich Böse, nicht Unglück oder Schaden.
- source_word: ποιησάτω ἀγαθόν
  choice: Gutes tun
  rationale: Die geläufige deutsche Wendung gibt die aktive ethische Bedeutung knapp und natürlich wieder.
- source_word: ζητησάτω
  choice: suchen
  rationale: „Suchen“ wahrt die Abstufung zum nachfolgenden stärkeren διώκω, statt beide Verben gleich wiederzugeben.
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ ist die übliche und zugleich genügend weite Wiedergabe des biblischen Begriffs εἰρήνη.
- source_word: διωξάτω αὐτήν
  choice: ihm nachjagen
  rationale: διώκω bezeichnet ein nachdrückliches Verfolgen. „Ihm nachjagen“ bewahrt die Stärke und Bildhaftigkeit des Verbs; das Pronomen bezieht sich eindeutig auf den Frieden.
- source_word: Imperative der dritten Person Singular
  choice: er soll …
  rationale: Die Konstruktion bewahrt Person und Numerus der griechischen Imperative und klingt im modernen Deutschen natürlicher als eine wörtliche Konstruktion mit „möge“.
theological_decisions:
- issue: Generische maskuline Form in der Imperativreihe
  choice: „Er soll“ im Haupttext
  alternative: „Man soll“ oder direkte Anrede mit „du“
  rationale: Das Griechische verwendet in der Psalmzitierung grammatisch maskuline Singularformen mit repräsentativer Geltung. „Er soll“ bewahrt diese Form, ohne die allgemeine Anwendung des Satzes einzuschränken; die Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer exhortativer Satzfolge. „Nachjagen“ ist bewusst kräftiger und bildhafter als „suchen“ und bildet so die rhetorische Steigerung des Griechischen ab.
