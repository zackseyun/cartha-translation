id: 1PE.3.4
reference: 1 Peter 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: de
  text: sondern der verborgene Mensch des Herzens[a] in der unvergänglichen Schönheit[b] eines sanften und ruhigen Geistes[c]. Das ist vor Gott sehr kostbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „der verborgene Mensch des Herzens“. Gemeint ist der innere, vor anderen verborgene Mensch; ἄνθρωπος bezeichnet hier nicht speziell einen Mann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier: „in dem Unvergänglichen eines sanften und ruhigen Geistes“. Das Wort „Schönheit“ ist aus dem Gegensatz zum äußeren Schmuck in Vers 3 ergänzt.'
    reason: lexical_alternative
  - marker: c
    text: „Ruhig“ bezeichnet eine gelassene, friedliche Haltung, nicht notwendigerweise Schweigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: der verborgene Mensch des Herzens
  rationale: „Mensch“ gibt ἄνθρωπος ohne männliche Einschränkung wieder und bewahrt zugleich das anschauliche anthropologische Bild des griechischen Ausdrucks. Die Genitivverbindung „des Herzens“ bleibt erhalten, statt sie eindeutig als bloßes „Inneres“ auszulegen.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: in der unvergänglichen Schönheit
  rationale: Der substantivierte Ausdruck ist im Griechischen elliptisch. „Schönheit“ wird aus dem Gegensatz zum äußeren Schmuck in Vers 3 ergänzt und ergibt im Deutschen eine verständliche, würdige Formulierung; die Ergänzung wird in einer Fußnote offengelegt.
- source_word: πραέως
  choice: sanften
  rationale: „Sanft“ vermittelt die Bedeutung von πραΰς in heutigem Deutsch, ohne die möglichen Nebenbedeutungen von Schwäche oder Unterwürfigkeit, die andere Wiedergaben hervorrufen könnten.
- source_word: ἡσυχίου
  choice: ruhigen
  rationale: „Ruhig“ bezeichnet hier eine friedliche, nicht auf Unruhe ausgerichtete Haltung und vermeidet eher als „still“ das Missverständnis, es gehe zwingend um Schweigen.
- source_word: πνεύματος
  choice: Geistes
  rationale: „Geist“ bewahrt die anthropologische Ausdrucksweise des Ausgangstextes. „Haltung“ oder „Wesen“ wären verständlich, aber stärker deutend.
- source_word: ὅ ἐστιν
  choice: Das ist
  rationale: Das neutrale „Das“ kann sich auf die zuvor beschriebene innere Schönheit beziehungsweise den gesamten Ausdruck beziehen, ohne den Bezug im Deutschen unnötig auf nur ein einzelnes Substantiv festzulegen.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Formulierung entspricht der griechischen Wendung und drückt Gottes Beurteilung aus.
- source_word: πολυτελές
  choice: sehr kostbar
  rationale: „Sehr kostbar“ gibt den hohen Wert wieder, den πολυτελές bezeichnet, und passt zum unmittelbaren Gegensatz zwischen äußerem Schmuck und innerer Schönheit.
theological_decisions:
- issue: Anthropologische Formulierung in einem an Frauen gerichteten Zusammenhang
  choice: ἄνθρωπος wird mit „Mensch“ wiedergegeben.
  alternative: „Person“, „innerer Mensch“ oder eine rein abstrakte Wiedergabe wie „inneres Wesen“
  rationale: Das Wort bezeichnet hier nicht einen männlichen Menschen, sondern das verborgene Selbst. „Mensch“ ist im Deutschen generisch und bewahrt das konkrete Bild, ohne einen männlichen Referenten einzuführen.
- issue: Ergänzung eines Substantivs bei ἐν τῷ ἀφθάρτῳ
  choice: „Schönheit“ wird im Haupttext ergänzt und die Ellipse in einer Fußnote kenntlich gemacht.
  alternative: „in dem Unvergänglichen“ oder „in der unvergänglichen Beschaffenheit“
  rationale: Der Kontext stellt äußeren Schmuck der inneren, unvergänglichen Wirklichkeit gegenüber. „Schönheit“ macht diesen Zusammenhang natürlich verständlich, ohne die Ergänzung als ausdrücklich vorhandenes griechisches Substantiv auszugeben.
- issue: Bezug des neutralen Relativpronomens ὅ
  choice: Mit „Das ist“ bleibt der Bezug auf die zuvor beschriebene Schönheit beziehungsweise den ganzen Ausdruck offen.
  alternative: „Diese Schönheit ist“ oder „Dieser Geist ist“
  rationale: Eine Festlegung allein auf „Schönheit“ oder allein auf „Geist“ würde die grammatische und sachliche Bezugsmöglichkeit des griechischen Satzes stärker einschränken als nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Genitivformel „Mensch des Herzens“ bleibt bewusst erhalten, weil sie das Bild des Ausgangstextes und dessen anthropologische Spannung bewahrt. Die ergänzte „Schönheit“ sorgt für Verständlichkeit und wird transparent ausgewiesen.
