  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Ausdrücke des griechischen Textes zuverlässig wieder: κρυπτὸς τῆς καρδίας ἄνθρωπος als „der verborgene Mensch des Herzens“, die elliptische Wendung ἐν τῷ ἀφθάρτῳ mit transparent ergänztem „Schönheit“, πραέως καὶ ἡσυχίου πνεύματος als „eines sanften und ruhigen Geistes“ sowie πολυτελές als „sehr kostbar“. „Das ist“ bewahrt sinnvoll die im griechischen Neutrum bestehende Offenheit des Bezugs.'
  naturalness: Modernes, würdiges Standarddeutsch. Die nominale Fortsetzung mit „sondern“ entspricht der vom vorigen Vers abhängigen griechischen Konstruktion und ist in einer Bibelübersetzung gut verständlich. „Mensch des Herzens“ ist bewusst bildhaft und durch die Anmerkung ausreichend erläutert.
  terminology: „Mensch“ ist hier für ἄνθρωπος geschlechtsübergreifend angemessen. „Sanft“, „ruhig“, „Geist“, „unvergänglich“ und „kostbar“ sind sachgerecht und registergerecht. Die Anmerkung zu „ruhig“ verhindert zutreffend eine Verengung auf bloßes Schweigen.
