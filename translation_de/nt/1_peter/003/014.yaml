source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: de
  text: Doch selbst wenn ihr um der Gerechtigkeit willen leiden solltet, seid ihr gesegnet. Fürchtet aber ihre Furcht nicht[a] und lasst euch nicht beunruhigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürchtet euch nicht vor ihnen“; oder: „Fürchtet nicht, was sie fürchten.“ Der griechische Ausdruck „ihre Furcht“ ist mehrdeutig und klingt eng an Jesaja 8,12 in der griechischen Übersetzung an.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Doch selbst wenn ihr … leiden solltet
  rationale: Die konzessive Bedingung und der Optativ werden durch „selbst wenn“ und „solltet“ als reale, aber nur mögliche Situation wiedergegeben.
- source_word: διὰ δικαιοσύνην
  choice: um der Gerechtigkeit willen
  rationale: Die Wendung gibt den kausalen Gebrauch von διά mit Akkusativ wieder und bewahrt den moralisch-theologischen Leitbegriff δικαιοσύνη, ohne ihn auf bloßes Rechttun oder gesellschaftliche Gerechtigkeit zu verengen.
- source_word: μακάριοι
  choice: seid ihr gesegnet
  rationale: Die ergänzte Kopula ergibt einen vollständigen deutschen Satz. „Gesegnet“ bewahrt den biblischen Klang und bezeichnet mehr als ein subjektives Glücksgefühl.
- source_word: τὸν … φόβον αὐτῶν μὴ φοβηθῆτε
  choice: Ihre Furcht aber fürchtet nicht
  rationale: Die bewusst markierte Formulierung erhält die Wortwiederholung φόβον/φοβηθῆτε, die Mehrdeutigkeit des Genitivs αὐτῶν und den engen Anklang an Jesaja 8,12 LXX. Natürlichere, aber jeweils festlegendere Deutungen stehen in der Fußnote.
- source_word: μηδὲ ταραχθῆτε
  choice: und lasst euch nicht beunruhigen
  rationale: Die Formulierung gibt die koordinierte Verneinung und die innere Erschütterung von ταράσσω in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: das, was recht ist; Rechtschaffenheit
  rationale: „Gerechtigkeit“ bewahrt die Breite des griechischen Begriffs und seinen moralisch-theologischen Gehalt. Die Alternativen würden die Aussage stärker auf richtiges Verhalten oder persönliche Rechtschaffenheit festlegen.
- issue: Mehrdeutigkeit von τὸν φόβον αὐτῶν
  choice: Ihre Furcht … fürchtet nicht
  alternative: Fürchtet euch nicht vor ihnen; Fürchtet nicht, was sie fürchten
  rationale: Der griechische Ausdruck kann sowohl die von ihnen ausgehende Furcht als auch das von ihnen Gefürchtete bezeichnen. Die Hauptfassung lässt diese Spannung bestehen und wahrt zugleich den Jesaja-Anklang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wortfolge „Ihre Furcht aber fürchtet nicht“ ist absichtlich etwas markiert, um Wortspiel, Mehrdeutigkeit und Schriftanklang des griechischen Textes zu bewahren; die übrige Syntax bleibt gut verständlich.
