  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: de
  text: 'Euer Schmuck soll nicht äußerlich sein: im Flechten der Haare[a], im Anlegen von Goldschmuck oder im Anziehen von Kleidung,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Euer Schmuck soll nicht nur äußerlich sein: im Flechten der Haare, im Anlegen von Goldschmuck oder im Anziehen von Kleidung.“ Im Zusammenhang liegt der Nachdruck auf dem Vorrang des inneren Wesens vor äußerer Zurschaustellung, nicht auf einem pauschalen Verbot von Haarpflege, Schmuck oder Kleidung.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: euer
  rationale: Das Genitiv-Relativpronomen bezieht sich auf die zuvor angesprochenen Frauen und wird im Deutschen natürlich possessiv wiedergegeben.
- source_word: ἔστω οὐχ
  choice: soll nicht ... sein
  rationale: Gibt den verneinten Imperativ der dritten Person idiomatisch und mit seinem ermahnenden Nachdruck wieder.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: der äußerliche ... Schmuck
  rationale: κόσμος bezeichnet hier Schmuck bzw. Zierde, nicht die Welt; ἔξωθεν kennzeichnet ihn als äußerlich.
- source_word: ἐμπλοκῆς τριχῶν
  choice: kunstvoll geflochtenes Haar
  rationale: Bezeichnet das Flechten bzw. kunstvolle Arrangieren der Haare; die Formulierung ist im modernen Deutschen natürlich und passt zur Aufzählung äußerer Zierde.
- source_word: περιθέσεως χρυσίων
  choice: goldener Schmuck
  rationale: Die Wendung bezeichnet das Anlegen von Gegenständen aus Gold, im Kontext also Goldschmuck.
- source_word: ἢ
  choice: oder
  rationale: Bewahrt die einfache Disjunktion der Aufzählung.
- source_word: ἐνδύσεως ἱματίων
  choice: das Anziehen von Kleidern
  rationale: Gibt die Handlung des Anziehens formal wieder und bewahrt die auffällige Breite der griechischen Aufzählung.
theological_decisions:
- issue: Ob Petrus äußere Pflege, Schmuck und Kleidung absolut verbietet oder sie dem inneren Wesen unterordnet
  choice: Die verneinte Aufforderung bleibt im Haupttext stehen; eine Fußnote weist auf den aus Vers 4 hervorgehenden vergleichenden Schwerpunkt hin.
  alternative: „Euer Schmuck soll nicht nur äußerlich sein“ oder ein absolutes Verbot jeder Haartracht, jedes Schmucks und sogar aller Kleidung.
  rationale: Der griechische Wortlaut enthält kein ausdrückliches „nur“, doch der Gegensatz zum verborgenen Menschen des Herzens in Vers 4 legt eine Rangordnung nahe. Da auch das Anziehen von Kleidung genannt wird, wäre ein unterschiedslos absolutes Verbot kaum sinnvoll. Die Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wegen der Fortsetzung in Vers 4 offen. „Kunstvoll“ verdeutlicht, dass ἐμπλοκή eine schmückende Haartracht bezeichnet; die Fußnote bewahrt die mögliche vergleichende Lesart, ohne „nur“ unmarkiert in den Haupttext einzutragen.
