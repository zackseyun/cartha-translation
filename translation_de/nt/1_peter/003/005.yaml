  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: de
  text: Denn so schmückten sich einst auch die heiligen Frauen, die ihre Hoffnung auf Gott setzten, indem sie sich ihren eigenen Ehemännern unterordneten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: so
  rationale: Das Adverb weist auf die zuvor beschriebene Art des Schmucks zurück; „so“ bewahrt diesen Rückbezug knapp und natürlich.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage.
- source_word: ποτε
  choice: einst
  rationale: Bezeichnet frühere Zeiten und passt zum historischen Vorbildcharakter der genannten Frauen.
- source_word: ἅγιαι γυναῖκες
  choice: die heiligen Frauen
  rationale: Bewahrt das attributive ἅγιαι und gibt den theologischen Grundbegriff ἅγιος mit „heilig“ wieder.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: die ihre Hoffnung auf Gott setzten
  rationale: Gibt die auf Gott gerichtete Hoffnung idiomatisch wieder und charakterisiert die Frauen, ohne über den griechischen Ausdruck hinauszugehen.
- source_word: ἐκόσμουν ἑαυτάς
  choice: schmückten sich
  rationale: Bewahrt den lexikalischen Anschluss an das Thema Schmuck in den vorhergehenden Versen.
- source_word: ὑποτασσόμεναι
  choice: Sie ordneten sich … unter
  rationale: Das Partizip beschreibt, wie sie sich schmückten. Ein Doppelpunkt mit finitem Satz macht diesen Bezug im Deutschen klar und natürlich.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ihren eigenen Männern
  rationale: Im ehelichen Zusammenhang bedeutet ἀνήρ „Ehemann“; „ihren eigenen Männern“ ist idiomatisch und bewahrt ἰδίοις als ausdrückliche Begrenzung auf die jeweilige Ehebeziehung.
theological_decisions:
- issue: Unterordnung in der Ehe
  choice: Sie ordneten sich ihren eigenen Männern unter
  alternative: indem sie sich ihren eigenen Männern unterordneten
  rationale: Die Wiedergabe wahrt die freiwillig-reflexive Formulierung und die Beschränkung auf die eigenen Ehemänner. Sie erweitert die Aussage nicht zu einer allgemeinen Unterordnung aller Frauen unter alle Männer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die modale Beziehung des griechischen Partizips verständlich wieder, ohne dessen Aussage zu verselbstständigen.
