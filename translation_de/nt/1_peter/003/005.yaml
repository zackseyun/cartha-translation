review_pass:
  verdict: revise
  source_fidelity: 'Der griechische Text ist im Wesentlichen getroffen: „denn“, „so“, „einst“, die heiligen Frauen, ihre auf Gott gerichtete Hoffnung, ihr Sich-Schmücken und die Beschränkung auf die eigenen Ehemänner sind erhalten. Das modale Partizip ὑποτασσόμεναι sollte jedoch auch im Deutschen als dem Sich-Schmücken zugeordnete partizipiale bzw. modale Wendung stehen, nicht als durch Doppelpunkt abgetrennter selbstständiger Hauptsatz.'
  naturalness: „Ihren eigenen Männern“ ist im heutigen Standarddeutsch in diesem ehelichen Kontext weniger eindeutig und weniger natürlich als „ihren eigenen Ehemännern“. Die Konstruktion „indem sie sich ... unterordneten“ ist klar, idiomatisch und zeigt die im Griechischen bestehende Verknüpfung mit „schmückten sich“.
  terminology: „heiligen Frauen“, „Hoffnung auf Gott setzen“ und „sich schmücken“ sind angemessene, konsistente Wiedergaben. „Ehemännern“ gibt ἀνδράσιν im ehelichen Kontext präziser wieder; „eigenen“ bewahrt ἰδίοις.
  issues:
