    issue: Das Partizip ὑποτασσόμεναι wird als separater Hauptsatz nach Doppelpunkt wiedergegeben.
    rationale: Der Doppelpunkt und „Sie ordneten sich ... unter“ lockern die modale syntaktische Zuordnung zu ἐκόσμουν ἑαυτάς. Eine „indem“-Wendung bewahrt die Beziehung ohne unnatürliches Partizipialdeutsch.
  - severity: medium
    issue: „Männern“ statt „Ehemännern“.
    rationale: ἀνήρ kann zwar „Mann“ bedeuten, meint hier wegen des häuslich-ehelichen Zusammenhangs und ἰδίοις eindeutig die jeweiligen Ehemänner. „Ehemännern“ verhindert eine unnötige Mehrdeutigkeit.
