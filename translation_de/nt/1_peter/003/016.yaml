  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: de
  text: sondern mit Sanftmut und Furcht, und habt ein gutes Gewissen, damit diejenigen, die euren guten Lebenswandel im Messias[b] verunglimpfen, in dem beschämt werden, worin ihr verleumdet werdet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Griechisch „im Messias“; traditionell: „in Christus“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „in der Sache, in der gegen euch geredet wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτητος
  choice: Sanftmut
  rationale: „Sanftmut“ bezeichnet eine demütige, nicht aggressive Haltung und entspricht dem würdevollen Mahnton des Zusammenhangs.
- source_word: φόβου
  choice: Furcht
  rationale: Das unbestimmte „Furcht“ bewahrt die Offenheit des griechischen Ausdrucks hinsichtlich seines Bezugs; „Ehrfurcht“ oder „Respekt“ wären mögliche, aber engere Deutungen.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: Habt dabei ein gutes Gewissen
  rationale: Die deutsche Aufforderungsform gibt das begleitende Partizip im Zusammenhang natürlich wieder und bewahrt „gut“ als schlichte moralische Bezeichnung.
- source_word: ἐν ᾧ
  choice: gerade in dem …, worin
  rationale: Die Formulierung erhält den offenen Bezug auf den Punkt oder Sachverhalt, in dem gegen die Angesprochenen geredet wird, ohne ihn genauer festzulegen.
- source_word: καταλαλεῖσθε
  choice: ihr verleumdet werdet
  rationale: Das Verb bezeichnet feindseliges Reden gegen jemanden; „verleumden“ bringt diesen Sinn im modernen Deutsch prägnant zum Ausdruck.
- source_word: καταισχυνθῶσιν
  choice: beschämt werden
  rationale: Die passive Form und der mit ἵνα ausgedrückte Zweck beziehungsweise die Folge bleiben erhalten.
- source_word: ἐπηρεάζοντες
  choice: die … verunglimpfen
  rationale: „Verunglimpfen“ erfasst die feindselige Herabsetzung, ohne den Ausdruck ausschließlich auf körperliche Misshandlung oder bloße Beleidigung einzuengen.
- source_word: ἀναστροφήν
  choice: Lebenswandel
  rationale: „Lebenswandel“ bezeichnet die ethisch geprägte Lebensführung und ist im Deutschen verständlich sowie dem biblischen Register angemessen.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός wird hier als Titel verstanden; „Messias“ gibt dessen Bedeutung wieder, während „Christus“ als traditionelle Alternative in der Fußnote erscheint.
- source_word: ἀγαθὴν
  choice: guten
  rationale: „Gut“ bewahrt die einfache moralische Wertung des griechischen Wortes und dessen Wiederaufnahme vom guten Gewissen zum guten Lebenswandel.
theological_decisions:
- issue: Bezug und Bedeutung von φόβου
  choice: Furcht ohne ausdrücklich genanntes Objekt
  alternative: Ehrfurcht; Respekt; Furcht vor Gott
  rationale: Der unmittelbare Wortlaut nennt kein Objekt. Die Hauptfassung wahrt daher die theologische und zwischenmenschliche Deutungsspannung.
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Der Titelgehalt ist in der Wendung weiterhin erkennbar; „Messias“ übersetzt diesen Gehalt, ohne die traditionelle Form „Christus“ auszuschließen.
- issue: Offener Bezug von ἐν ᾧ
  choice: gerade in dem …, worin
  alternative: wenn sie euch verleumden; in der Sache, in der gegen euch geredet wird
  rationale: Die Hauptfassung lässt offen, auf welchen konkreten Vorwurf oder Bereich sich der Relativausdruck bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang „sondern“ wahrt den Anschluss an den vorhergehenden Satz. Die Auflösung des griechischen Partizips als Aufforderung („Habt dabei“) sorgt für natürliche Lesbarkeit; „Lebenswandel“ hält den ethischen und umfassenden Sinn von ἀναστροφή fest.
