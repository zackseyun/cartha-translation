  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: de
  text: 'Schließlich: Seid alle eines Sinnes, mitfühlend, einander in geschwisterlicher Liebe zugetan[a], barmherzig und demütig gesinnt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich näher am griechischen Familienbild: „brüderlich“; gemeint ist die geschwisterliche Liebe innerhalb der gesamten Glaubensgemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften haben statt „demütig gesinnt“ die Lesart „freundlich“ oder „zuvorkommend“.
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Schließlich
  rationale: Die Wendung dient als Gliederungssignal und leitet eine abschließende Zusammenfassung der Ermahnungen ein; „Schließlich“ ist im modernen Deutschen natürlich.
- source_word: πάντες
  choice: alle
  rationale: Der prädikative Nominativ richtet die Aufforderung ausdrücklich an die gesamte angesprochene Gemeinschaft.
- source_word: ὁμόφρονες
  choice: eines Sinnes
  rationale: Die Formulierung bewahrt den Gedanken einer gemeinsamen inneren Ausrichtung, ohne völlige Gleichförmigkeit in jeder Ansicht zu behaupten.
- source_word: συμπαθεῖς
  choice: mitfühlend
  rationale: Das Wort bezeichnet die Bereitschaft, am Erleben und Empfinden anderer Anteil zu nehmen.
- source_word: φιλάδελφοι
  choice: einander in geschwisterlicher Liebe zugetan
  rationale: Die Übersetzung erhält das Familienbild des griechischen Wortes und macht zugleich deutlich, dass die ganze Glaubensgemeinschaft gemeint ist.
- source_word: εὔσπλαγχνοι
  choice: barmherzig
  rationale: Das Adjektiv bezeichnet inniges Erbarmen und warmherzige Anteilnahme; „barmherzig“ gibt diese sittliche und emotionale Haltung würdig und verständlich wieder.
- source_word: ταπεινόφρονες
  choice: demütig gesinnt
  rationale: Die Wendung bewahrt gegenüber dem bloßen „demütig“ ausdrücklich die im zusammengesetzten Wort enthaltene Nuance der inneren Gesinnung.
theological_decisions:
- issue: Geschlechtlich geprägte Geschwistersprache in φιλάδελφοι
  choice: einander in geschwisterlicher Liebe zugetan
  alternative: brüderlich / einander wie Brüder liebend
  rationale: Das griechische Wort verwendet familiäre Geschwistersprache für die gesamte, gemischte Glaubensgemeinschaft. „Geschwisterlich“ bewahrt das Bild und gibt seinen inklusiven Bezug im heutigen Deutsch zutreffend wieder.
- issue: Textform des letzten Adjektivs
  choice: ταπεινόφρονες = demütig gesinnt
  alternative: φιλόφρονες = freundlich oder zuvorkommend
  rationale: Der SBLGNT-Text liest ταπεινόφρονες. Die abweichende Lesart ist textgeschichtlich beachtenswert, gehört aber nicht in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihe der griechischen Adjektive wird als natürliche deutsche Aufforderung mit „Seid“ wiedergegeben. „Geschwisterliche Liebe“ bewahrt die familiäre Metaphorik in einer heute klar inklusiven Form; „demütig gesinnt“ hält die mentale Nuance des Schlusswortes fest.
