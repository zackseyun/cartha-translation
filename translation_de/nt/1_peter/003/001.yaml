  to: Ebenso ordnet auch ihr Ehefrauen euch euren eigenen Ehemännern unter, damit, selbst wenn einige dem Wort nicht gehorchen[a], diese durch den Lebenswandel ihrer Frauen ohne ein Wort gewonnen werden.
  rationale: Die Revision beschränkt sich auf die Satzstellung. „Diese“ bezieht sich eindeutig auf „einige“ und macht sichtbar, dass gerade die dem Wort nicht Gehorchenden gewonnen werden sollen. Die Stellung von „ohne ein Wort“ beim Vorgang des Gewonnenwerdens entspricht dem griechischen Kontrast und ist im Deutschen flüssiger. Es werden keine zusätzlichen Aussagen über Art, Grenzen oder Begründung der Unterordnung eingeführt.
