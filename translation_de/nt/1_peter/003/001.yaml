source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: de
  text: Ebenso ordnet auch ihr Ehefrauen euch euren eigenen Ehemännern unter, damit, selbst wenn einige dem Wort nicht gehorchen[a], diese durch den Lebenswandel ihrer Frauen ohne ein Wort gewonnen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Botschaft nicht glauben“ beziehungsweise „sich der Botschaft verweigern“; mit „dem Wort“ ist hier die Botschaft des Evangeliums gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: Ebenso
  rationale: Bewahrt den rückverweisenden Zusammenhang mit den vorausgehenden Anweisungen und entspricht einem natürlichen deutschen Diskursanschluss.
- source_word: γυναῖκες
  choice: ihr Ehefrauen
  rationale: Durch die Verbindung mit den jeweils eigenen Männern ist hier nicht allgemein von Frauen, sondern von Ehefrauen die Rede.
- source_word: ὑποτασσόμεναι
  choice: ordnet euch … unter
  rationale: Gibt die relationale Unterordnung wieder, ohne den stärkeren Gedanken uneingeschränkten Gehorsams oder eine Aussage über geringeren Wert einzutragen. Die deutsche Aufforderungsform macht die im griechischen Partizip liegende Ermahnung verständlich.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: euren eigenen Ehemännern
  rationale: Der eheliche Kontext verlangt die Bedeutung „Ehemänner“; „eigenen“ erhält die Hervorhebung durch ἰδίοις.
- source_word: ἵνα καὶ εἴ τινες
  choice: damit selbst dann, wenn einige
  rationale: „Damit“ bewahrt die Ziel- beziehungsweise Wirkungsrichtung; „selbst dann, wenn“ gibt die konzessive Kraft von καὶ εἴ natürlich wieder.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: dem Wort nicht gehorchen
  rationale: Bewahrt sowohl den moralisch-volitionalen Aspekt von ἀπειθέω als auch die mögliche Nähe zum Unglauben. Die Fußnote erläutert die evangeliumsbezogene Bedeutung.
- source_word: λόγῳ
  choice: dem Wort
  rationale: Erhält die prägnante biblische Bezeichnung für die verkündigte Botschaft und zugleich die rhetorische Verbindung zu ἄνευ λόγου.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: durch den Lebenswandel ihrer Frauen
  rationale: ἀναστροφή bezeichnet in 1 Petrus die Lebensführung beziehungsweise das Verhalten. „Lebenswandel“ ist knapp, würdig und weiter als bloß einzelne Handlungen.
- source_word: ἄνευ λόγου
  choice: ohne ein Wort
  rationale: Bewahrt den Singular und das Wortspiel mit „dem Wort“; gemeint ist, dass die Gewinnung nicht durch ein gesprochenes Wort der Ehefrauen geschieht.
- source_word: κερδηθήσονται
  choice: gewonnen werden
  rationale: Erhält die Metapher des Gewinnens und lässt offen, wie genau die erwartete Hinwendung zu verstehen ist.
theological_decisions:
- issue: Art der mit ὑποτασσόμεναι bezeichneten Unterordnung
  choice: „ordnet euch … unter“, ohne daraus absoluten Gehorsam oder Minderwertigkeit abzuleiten
  alternative: „gehorcht euren Ehemännern“
  rationale: Der Text verwendet ὑποτάσσω und nicht das stärkere Verb für Gehorsam. Die Übersetzung wahrt die ausgesagte relationale Ordnung, ohne zusätzliche anthropologische oder kirchliche Lehrsätze einzutragen.
- issue: Bedeutung von ἀπειθοῦσιν τῷ λόγῳ
  choice: „dem Wort nicht gehorchen“ mit erläuternder Fußnote
  alternative: „der Botschaft nicht glauben“
  rationale: Das Verb kann hier Unglauben und Ungehorsam miteinander verbinden. Der Haupttext bewahrt diese Spannung, während die Fußnote den Bezug auf die Evangeliumsbotschaft verdeutlicht.
- issue: Bedeutung von κερδηθήσονται
  choice: die offene Metapher „gewonnen werden“ beibehalten
  alternative: „zum Glauben gewonnen werden“
  rationale: Der Zusammenhang legt eine Hinwendung zum Evangelium nahe, doch der griechische Text nennt das Ziel nicht ausdrücklich mit „zum Glauben“. Die knappere Wiedergabe vermeidet eine erklärende Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die Aufforderungsform geben die ermahnende Funktion des griechischen Partizips idiomatisch wieder. „Lebenswandel“ wahrt den für 1 Petrus wichtigen Gedanken der gesamten Lebensführung. Der Gegensatz zwischen „dem Wort“ und „ohne ein Wort“ bleibt sichtbar.
