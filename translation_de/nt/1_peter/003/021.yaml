id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: de
  text: Dem entspricht die Taufe, die jetzt auch euch rettet – nicht als Beseitigung von Schmutz am Körper, sondern als Bitte an Gott um ein gutes Gewissen[a] – durch die Auferstehung Jesu, des Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern als Zusage eines guten Gewissens gegenüber Gott“. Das griechische Wort kann eine Bitte, aber auch eine Zusage, Verpflichtung oder Antwort bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: Dem entspricht
  rationale: Das Neutrum nimmt das zuvor erwähnte Wasser der Flut typologisch auf. „Dem entspricht“ stellt den Bezug verständlich her, ohne den schwer zugänglichen Fachausdruck „Gegenbild“ zu verwenden.
- source_word: σῴζει
  choice: rettet
  rationale: Der direkte Gegenwartsindikativ bleibt ungeschwächt erhalten; die anschließende Erklärung grenzt selbst ab, wie die Aussage zu verstehen ist.
- source_word: βάπτισμα
  choice: die Taufe
  rationale: Dies ist die etablierte und kontextgerechte Wiedergabe; der folgende Gegensatz schließt ein bloß äußerliches Waschen aus.
- source_word: σαρκὸς
  choice: am Körper
  rationale: Im Zusammenhang mit körperlichem Schmutz bezeichnet σάρξ hier die äußere Leiblichkeit. „Am Körper“ klingt im Deutschen natürlich und vermeidet die missverständliche Wendung „Schmutz des Fleisches“.
- source_word: ἀπόθεσις ῥύπου
  choice: Beseitigung von Schmutz
  rationale: Die Formulierung gibt die äußere Reinigung sachlich und in modernem Deutsch wieder.
- source_word: συνειδήσεως ἀγαθῆς
  choice: um ein gutes Gewissen
  rationale: Der gedrängte Genitiv wird als Inhalt beziehungsweise Ziel der an Gott gerichteten Bitte verstanden. Da die syntaktisch-semantische Zuordnung umstritten ist, bleibt die alternative Deutung in der Fußnote sichtbar.
- source_word: ἐπερώτημα
  choice: Bitte
  rationale: „Bitte“ passt zur Ausrichtung εἰς θεόν und ist im Deutschen natürlicher als „Appell“. Der ebenfalls mögliche Sinn „Zusage/Verpflichtung“ wird in der Fußnote bewahrt.
- source_word: εἰς θεόν
  choice: an Gott
  rationale: Die Präposition bezeichnet hier am natürlichsten die Richtung beziehungsweise den Adressaten der Bitte.
- source_word: δι’ ἀναστάσεως
  choice: durch die Auferstehung
  rationale: διά mit Genitiv bezeichnet das Mittel; „durch“ gibt dies knapp und idiomatisch wieder.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird hier als Titel verstanden. Die Apposition „Jesu, des Messias“ ist idiomatisches, würdiges Deutsch und bewahrt den Titelcharakter.
theological_decisions:
- issue: Verhältnis von Taufe und Rettung
  choice: Die direkte Aussage „die jetzt auch euch rettet“ bleibt stehen und wird nur durch die im Vers selbst folgende Abgrenzung erläutert.
  alternative: Die Taufe lediglich als Symbol der Rettung zu paraphrasieren oder die Aussage im Sinn einer bestimmten Sakramentenlehre auszubauen.
  rationale: Der griechische Text spricht der Taufe ausdrücklich eine rettende Funktion zu, unterscheidet sie aber zugleich von bloßer äußerer Reinigung und bindet sie an das Verhältnis zu Gott sowie an Jesu Auferstehung. Diese Spannung darf nicht konfessionell aufgelöst werden.
- issue: Bedeutung von ἐπερώτημα
  choice: Im Haupttext „Bitte“, mit „Zusage/Verpflichtung“ als alternativer Deutung in der Fußnote.
  alternative: Zusage, Verpflichtung oder Antwort
  rationale: Das Wort ist an dieser Stelle ernsthaft umstritten. Die Bedeutung „Bitte“ fügt sich gut zur Wendung „an Gott“; die andere gewichtige Deutung wird transparent dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Griechischen, wird jedoch durch Gedankenstriche übersichtlich gegliedert. Die theologisch pointierte Aussage „die Taufe … rettet“ bleibt bewusst direkt; die genuine Mehrdeutigkeit von ἐπερώτημα wird durch eine Fußnote erhalten.
