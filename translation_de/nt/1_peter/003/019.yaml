lexical_decisions:
- source_word: ἐν ᾧ
  choice: in diesem
  rationale: Die Form ist Dativ Singular Neutrum und nimmt am ehesten das unmittelbar vorausgehende πνεύματι auf. „In diesem“ bewahrt die grammatische Anknüpfung, ohne die genaue Beziehung abschließend festzulegen.
- source_word: καὶ
  choice: auch
  rationale: καί fügt eine weitere, mit der vorherigen Aussage verbundene Handlung hinzu.
- source_word: τοῖς ... πνεύμασιν
  choice: den Geistern
  rationale: „Geister“ gibt πνεύμασιν unmittelbar wieder und lässt deren Identität offen; „Seelen“ oder „Geistwesen“ wären stärker deutend.
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: φυλακή bezeichnet hier einen Ort der Verwahrung oder Gefangenschaft; „im Gefängnis“ ist eine natürliche und klare Wiedergabe.
- source_word: πορευθεὶς
  choice: ging er ... hin
  rationale: Das Aoristpartizip wird im Deutschen natürlich als mit dem Hauptverb verbundene finite Handlung wiedergegeben; die Bewegungsbedeutung bleibt erhalten.
- source_word: ἐκήρυξεν
  choice: verkündete
  rationale: κηρύσσω bezeichnet das öffentliche Ausrufen einer Botschaft. „Verkündete“ lässt deren hier nicht genannten Inhalt offen und legt nicht ausdrücklich eine Evangeliumspredigt fest.
theological_decisions:
- issue: Bezug von ἐν ᾧ
  choice: „in diesem“, mit wahrscheinlicher Rückbeziehung auf „Geist“ im vorhergehenden Vers, ohne die Art dieser Beziehung festzulegen
  alternative: „in welchem“ beziehungsweise personal verstanden „in wem“; oder instrumental „durch diesen/dadurch“
  rationale: Syntax und theologischer Sinn sind umstritten. Die neutrale Wiedergabe wahrt Genus und Dativ des griechischen Ausdrucks und entscheidet nicht über die Weise der Verkündigung.
- issue: Identität der „Geister im Gefängnis“
  choice: Im Haupttext nicht näher bestimmt
  alternative: verstorbene Menschen, besonders aus Noahs Generation; gefallene Engelwesen; eine umfassendere Gruppe gefangener Geister
  rationale: Der griechische Ausdruck selbst bestimmt die Identität nicht eindeutig; eine Präzisierung im Haupttext würde eine umstrittene Auslegung festschreiben.
- issue: Art und Inhalt der Verkündigung
  choice: „verkündete“ ohne Ergänzung des Inhalts
  alternative: predigte das Evangelium; kündigte Gericht an; verkündete den Sieg
  rationale: Das Verb bezeichnet eine Proklamation, nennt aber an dieser Stelle weder Inhalt noch Zweck der Botschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und bildet zugleich die enge Verbindung zum vorhergehenden Vers ab. Die Fußnotenmarker stehen unmittelbar nach der umstrittenen Wendung; jeder Marker erscheint im Haupttext.
