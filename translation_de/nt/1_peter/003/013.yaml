lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der neutrale Anschluss bewahrt den Gedankengang aus dem vorhergehenden Vers.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: wer wird euch etwas Böses antun
  rationale: Die substantivierte Futurpartizip-Konstruktion wird als natürliche deutsche Zukunftsfrage wiedergegeben. „Etwas Böses antun“ erfasst sowohl Schädigung als auch Misshandlung.
- source_word: ἐὰν
  choice: wenn
  rationale: Die Bedingung mit Konjunktiv lässt sich hier idiomatisch mit „wenn“ ausdrücken.
- source_word: τοῦ ἀγαθοῦ
  choice: für das Gute
  rationale: Das substantivierte Neutrum bezeichnet das Gute als Gegenstand des Eifers.
- source_word: ζηλωταὶ γένησθε
  choice: ihr euch mit Eifer … einsetzt
  rationale: Die Wendung gibt die intensive Ausrichtung von ζηλωτής natürlich wieder und lässt γένησθε in der konditionalen Form anklingen, ohne das Deutsche unnötig zu belasten.
theological_decisions:
- issue: Aussagekraft der rhetorischen Frage angesichts möglichen Leidens um der Gerechtigkeit willen
  choice: Die rhetorische Zusicherung bleibt als Frage stehen, ohne als absolutes Versprechen der Unversehrtheit formuliert zu werden.
  alternative: Niemand kann euch in irgendeinem Sinn schaden, wenn ihr Gutes tut.
  rationale: Der unmittelbare Kontext rechnet ausdrücklich damit, dass Menschen trotz guten Handelns leiden können. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung ist idiomatisch, bewahrt aber die rhetorische Frage und die Intensität von ζηλωτής.
