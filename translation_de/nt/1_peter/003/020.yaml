id: 1PE.3.20
reference: 1 Peter 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: de
  text: die einst ungehorsam waren, als Gottes Geduld in den Tagen Noahs wartete, während die Arche gebaut wurde. In diese hinein wurden nur wenige – nämlich acht Menschen[a] – durch Wasser hindurchgerettet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: acht Seelen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: durch Wasser gerettet.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: ungehorsam waren
  rationale: Das Partizip bezeichnet verweigerten Gehorsam; »ungehorsam« bewahrt diese Bedeutung, ohne den Ausdruck auf bloßen Unglauben zu verengen.
- source_word: ποτε
  choice: einst
  rationale: Das Wort verweist auf eine frühere Zeit und wird im Deutschen knapp und natürlich mit »einst« wiedergegeben.
- source_word: ἀπεξεδέχετο
  choice: wartete
  rationale: Der Imperfekt bezeichnet ein andauerndes Warten. Die Vorstellung von Langmut steht bereits im Subjekt »Gottes Geduld« und muss nicht im Verb wiederholt werden.
- source_word: μακροθυμία
  choice: Geduld
  rationale: »Geduld« ist eine verständliche, gegenwärtige Wiedergabe für Gottes langes Zurückhalten des Gerichts.
- source_word: κατασκευαζομένης
  choice: gebaut wurde
  rationale: Im Zusammenhang mit der Arche bezeichnet das Verb deren Herstellung beziehungsweise Vorbereitung; »gebaut wurde« ist hier konkret und natürlich.
- source_word: κιβωτοῦ
  choice: Arche
  rationale: Im Noah-Kontext ist »Arche« die etablierte und sachlich passende Bezeichnung.
- source_word: εἰς ἣν
  choice: in diese hinein
  rationale: Die Formulierung bewahrt die durch εἰς ausgedrückte Bewegung in die Arche hinein und nicht nur einen Ort innerhalb der Arche.
- source_word: ὀλίγοι
  choice: nur wenige
  rationale: Die Wiedergabe hebt wie der griechische Ausdruck die geringe Zahl der Geretteten hervor.
- source_word: ψυχαί
  choice: Menschen
  rationale: ψυχή bezeichnet hier gezählte Personen. »Menschen« ist im heutigen Deutsch klar und vermeidet eine unbeabsichtigte anthropologische Festlegung.
- source_word: διεσώθησαν
  choice: wurden hindurchgerettet
  rationale: Das Verb bezeichnet die sichere Bewahrung beziehungsweise Rettung durch eine Gefahr hindurch. »Hindurchgerettet« erhält sowohl den konkreten Vorgang als auch den Rettungsbegriff.
- source_word: δι’ ὕδατος
  choice: durch Wasser
  rationale: διά mit dem Genitiv kann hier das Hindurchgehen durch das Wasser oder dessen vermittelnde Rolle bezeichnen. Die knappe Formulierung bewahrt diese Spannung.
theological_decisions:
- issue: Rettungssprache bei διεσώθησαν
  choice: wurden durch Wasser hindurchgerettet
  alternative: wurden durch Wasser gerettet
  rationale: »Hindurchgerettet« bezeichnet Noahs konkrete Bewahrung in der Flut und lässt zugleich die Verbindung zur Taufe im folgenden Vers offen hervortreten, ohne sie abzuschwächen oder dogmatisch festzulegen.
- issue: Bedeutung von ψυχαί
  choice: Menschen
  alternative: Seelen
  rationale: Der Ausdruck zählt hier die Menschen in der Arche und formuliert keine technische Lehre über Leib und Seele. Die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Bedeutung von διά in δι’ ὕδατος
  choice: durch Wasser
  alternative: mittels Wasser
  rationale: Die deutsche Präposition »durch« kann sowohl den Weg durch die Flut als auch eine vermittelnde Funktion des Wassers ausdrücken und bewahrt so die genuine Deutungsspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt eng am griechischen Gedankengang, wird aber durch einen Satzpunkt vor dem Hinweis auf die acht Menschen lesbarer. »In diese hinein« bewahrt die Bewegungsrichtung von εἰς, und »hindurchgerettet« hält den konkreten Flutkontext sowie die theologische Spannung zum folgenden Vers zusammen.
