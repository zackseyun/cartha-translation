reference: 1 Peter 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: de
  text: wie Sara Abraham gehorchte und ihn »Herr« nannte. Ihr seid ihre Kinder geworden, wenn ihr Gutes tut und euch vor keinem Schrecken fürchtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch vor nichts Furchterregendem fürchtet“.'
    reason: πτόησις kann „Schrecken/Entsetzen“ oder das Furchterregende bezeichnen.
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet Sara als entsprechendes Vorbild ein; im Deutschen gibt „wie“ die vergleichende Funktion natürlich wieder.
- source_word: ὑπήκουσεν
  choice: gehorchte
  rationale: Gibt die gewöhnliche Bedeutung von ὑπακούω und die Verbindung mit dem Dativobjekt Abraham direkt wieder, ohne den Aussageumfang über den Vers hinaus zu erweitern.
- source_word: κύριον αὐτὸν καλοῦσα
  choice: und ihn »Herr« nannte
  rationale: Gibt das begleitende Partizip idiomatisch wieder. Die Anführungszeichen und das Pronomen „ihn“ machen deutlich, dass „Herr“ hier eine respektvolle Anrede bzw. Bezeichnung für Abraham und kein Gottestitel ist.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: Ihr seid ihre Kinder geworden
  rationale: Bewahrt sowohl das familiäre Bild als auch den durch γίνομαι bezeichneten Eintritt in einen nun bestehenden Zustand.
- source_word: ἀγαθοποιοῦσαι
  choice: wenn ihr Gutes tut
  rationale: Die feminine Pluralform bezieht sich auf die angesprochenen Frauen. „Wenn“ macht die im Zusammenhang naheliegende bedingende bzw. kennzeichnende Beziehung zum Hauptsatz in natürlichem Deutsch deutlich.
- source_word: μὴ φοβούμεναι μηδεμίαν πτόησιν
  choice: und euch durch nichts einschüchtern lasst
  rationale: Gibt die Haltung des Nichtfürchtens samt möglichem äußerem Anlass idiomatisch wieder. Da πτόησις auch „Schrecken“ oder etwas Furchterregendes bedeuten kann, wird diese Spannweite in der Fußnote offengehalten.
theological_decisions:
- issue: Saras Gehorsam als Vorbild für christliche Ehefrauen
  choice: Das deutliche „gehorchte“ wird beibehalten, ohne daraus im Wortlaut eine umfassendere Ehelehre abzuleiten.
  alternative: Das Verb abschwächend mit „ordnete sich unter“ oder „hörte auf“ wiedergeben.
  rationale: ὑπήκουσεν bezeichnet hier ausdrücklich Gehorsam. Eine kulturell oder konfessionell motivierte Abschwächung wäre nicht quellentreu; zugleich wird die Aussage nicht über ihren unmittelbaren Zusammenhang hinaus ausgeweitet.
- issue: Beziehung der Partizipien ἀγαθοποιοῦσαι und μὴ φοβούμεναι zum Hauptsatz
  choice: Die Partizipien werden mit „wenn“ bedingend wiedergegeben.
  alternative: 'Deskriptiv: „indem ihr Gutes tut und euch … nicht fürchtet“ oder „während ihr …“.'
  rationale: Der griechische Wortlaut lässt die syntaktische Beziehung knapper und etwas offener als idiomatisches Deutsch. Die bedingende Wiedergabe bringt den ermahnenden Zusammenhang verständlich zum Ausdruck, ohne die Aussage dogmatisch zu systematisieren.
- issue: Bedeutung von πτόησις
  choice: Im Haupttext als äußere Einschüchterung bzw. furchtauslösender Druck wiedergegeben.
  alternative: „Schrecken“, „etwas Furchterregendes“ oder „Angst“.
  rationale: Der seltene Ausdruck kann sowohl Schrecken/Entsetzen als auch das Furchterregende bezeichnen. Die Haupttextfassung passt natürlich in den Ermahnungszusammenhang; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt im Plural und bezieht sich aufgrund der femininen Partizipien auf die im Kontext angesprochenen Frauen. „Herr“ wird als deutsches Substantiv großgeschrieben; die Anführungszeichen verhindern, dass es hier als unmarkierter göttlicher Titel gelesen wird.
