review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die SBLGNT-Lesart ἔπαθεν zutreffend mit „hat ... gelitten“ wieder, bewahrt den Titelcharakter von Χριστός durch „der Messias“ und gibt den Gegensatz δίκαιος ὑπὲρ ἀδίκων angemessen wieder. Bei ἅπαξ ist „ein für alle Mal“ jedoch stärker als der bloße Wortlaut „einmal“ und sollte nicht im Haupttext stehen. Die parallelen Dative σαρκί / πνεύματι werden mit „dem Fleisch nach / dem Geist nach“ ohne unzulässige dogmatische Festlegung erhalten.
  naturalness: „Dem Fleisch nach“ und „dem Geist nach“ sind in diesem bewusst kompakten, würdevollen Register verständlich und passend. Eine finite deutsche Konstruktion mit „zwar ... aber“ macht den griechischen Kontrast μὲν ... δὲ idiomatischer sichtbar. Der Marker zur Deutungsfrage von πνεύματι muss unmittelbar bei „Geist“ stehen, nicht bei „führen“.
  terminology: „Messias“, „Sünden“, „der Gerechte“, „die Ungerechten“, „Fleisch“ und „Geist“ sind konsistent, modern verständlich und quellennah. „Einmal“ wahrt die lexikalische Begrenztheit von ἅπαξ; weitergehende Finalitätsnuancen werden nicht hinzugefügt.
  issues:
