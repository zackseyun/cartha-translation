reference: 1 Peter 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: de
  text: 'Denn auch der Messias hat einmal für Sünden gelitten[a], der Gerechte für die Ungerechten, damit er euch zu Gott führe: Er wurde zwar dem Fleisch nach getötet, aber dem Geist nach lebendig gemacht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „starb“ statt „litt“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „durch den Geist lebendig gemacht“. Das Griechische kann bei „Geist“ eine Daseinssphäre beziehungsweise Hinsicht oder den Heiligen Geist als Handelnden bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: der Messias
  rationale: Gibt den Titel Χριστός mit seinem messianischen Gehalt wieder, statt ihn wie einen Eigennamen zu behandeln.
- source_word: ἅπαξ
  choice: ein für alle Mal
  rationale: Im Zusammenhang des einmaligen Leidens für Sünden vermittelt die deutsche feste Wendung die Einmaligkeit idiomatisch; sie bezeichnet keine Wiederholung.
- source_word: περὶ ἁμαρτιῶν
  choice: für Sünden
  rationale: περί mit Genitiv bezeichnet hier im sühnebezogenen Kontext den Bezug und Zweck des Leidens hinsichtlich der Sünden.
- source_word: ἔπαθεν
  choice: hat ... gelitten
  rationale: Folgt der SBLGNT-Lesart ἔπαθεν; die Variante „starb“ wird in der Fußnote dokumentiert.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: der Gerechte für die Ungerechten
  rationale: Bewahrt den prägnanten Gegensatz und den stellvertretenden beziehungsweise zugunsten anderer liegenden Sinn von ὑπέρ, ohne eine bestimmte Sühnetheorie auszubauen.
- source_word: προσαγάγῃ
  choice: zu Gott zu führen
  rationale: Das Verb bezeichnet das Hinführen in Gottes Nähe beziehungsweise Gegenwart; „führen“ ist hier natürlich und wahrt den Zugangsgedanken.
- source_word: θανατωθεὶς μὲν σαρκὶ
  choice: dem Fleisch nach wurde er getötet
  rationale: Bewahrt Passiv und Bezugssphäre des Dativs; „Fleisch“ bezeichnet hier die leiblich-sterbliche Daseinsweise, nicht eine sündige Natur.
- source_word: ζῳοποιηθεὶς δὲ πνεύματι
  choice: dem Geist nach aber lebendig gemacht
  rationale: Spiegelt die parallelen Dative und wahrt zunächst die Deutung als Hinsicht oder Sphäre; eine mögliche instrumentale Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Deutung des Gegensatzes von σαρκί und πνεύματι
  choice: „dem Fleisch nach ... dem Geist nach“ als parallele Angaben der Hinsicht beziehungsweise Daseinssphäre
  alternative: „im Fleisch ... durch den Geist“, wobei der Heilige Geist ausdrücklich als Handelnder verstanden wird
  rationale: Die knappe griechische Dativkonstruktion lässt sowohl eine Hinsicht-/Sphärendeutung als auch beim zweiten Dativ eine instrumentale Deutung zu. Der Haupttext hält die Parallelität fest und die Fußnote bewahrt die Alternative.
- issue: Stellvertretender Sinn von δίκαιος ὑπὲρ ἀδίκων
  choice: „der Gerechte für die Ungerechten“
  alternative: „der Unschuldige anstelle der Schuldigen“
  rationale: Die Formulierung wahrt das Leiden zugunsten der Ungerechten, ohne ὑπέρ über den Wortlaut hinaus auf ein einzelnes dogmatisches Modell festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am kompakten griechischen Gedankengang, wird aber durch einen Doppelpunkt gegliedert. „Messias“ wahrt den Titelcharakter von Χριστός. Die Fußnotenmarker [a] und [b] stehen an den jeweils einschlägigen Stellen im Haupttext.
