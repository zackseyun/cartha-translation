    rationale: Ἅπαξ bedeutet hier unmittelbar „einmal“. Die feste deutsche Wendung kann zwar idiomatisch sein, legt aber die theologisch naheliegende, im einzelnen Adverb jedoch nicht eigens ausgedrückte Endgültigkeitsnuance stärker fest.
  - severity: medium
    issue: Der Fußnotenmarker [b] ist an „führen“ statt an der Formulierung zu πνεύματι angebracht.
    rationale: Die Fußnote erläutert ausschließlich die mögliche Deutung von πνεύματι („Geist“). Der Anker muss daher bei „Geist“ stehen.
  - severity: low
