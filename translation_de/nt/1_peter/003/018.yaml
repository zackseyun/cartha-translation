  to: 'Denn auch der Messias hat einmal für Sünden gelitten[a], der Gerechte für die Ungerechten, damit er euch zu Gott führe: Er wurde zwar dem Fleisch nach getötet, aber dem Geist nach lebendig gemacht[b].'
  rationale: 'Die Revision beschränkt sich auf sichere Korrekturen: „einmal“ bildet ἅπαξ ohne Zusatzakzent ab; [b] wird an den tatsächlich erläuterten Ausdruck gesetzt; und die textkritische Fußnote wird näher an der griechischen Variantenformulierung gefasst. Die Übersetzung von Fleisch und Geist bleibt absichtlich offen für die im Griechischen bestehende Deutungsambiguität.'
