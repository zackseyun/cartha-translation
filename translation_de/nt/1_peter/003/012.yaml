source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: de
  text: Denn die Augen des Herrn sind auf die Gerechten gerichtet, und seine Ohren sind ihrem Flehen zugewandt[a]; das Angesicht des Herrn aber ist gegen die gerichtet, die Böses tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und seine Ohren zu/auf ihr Flehen hin“; die griechische Wendung ist elliptisch. Die Übersetzung ergänzt den Sinn der aufmerksamen Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet im Zusammenhang die vorausgehende Aussage. „Denn“ gibt diese begründende Funktion im Deutschen natürlich wieder.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: die Augen des Herrn sind auf die Gerechten gerichtet
  rationale: Die Formulierung bewahrt das anthropomorphe Bild und gibt die aufmerksame Hinwendung von ἐπί mit Akkusativ idiomatisch wieder. Das substantivierte Adjektiv δικαίους erscheint als „die Gerechten“.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: seine Ohren hören auf ihr Flehen
  rationale: 'Der griechische Ausdruck ist elliptisch: wörtlich stehen die Ohren „zu/auf ihr Flehen hin“. Die deutsche Fassung ergänzt den sinngemäßen Vorgang des Hörens, bewahrt aber das Bild der Ohren. δέησις bezeichnet hier ein dringliches Gebet oder Flehen.'
- source_word: πρόσωπον δὲ κυρίου
  choice: das Angesicht des Herrn aber
  rationale: „Angesicht“ bewahrt das feierliche, anthropomorphe Bild der Psalmvorlage. Das nachgestellte „aber“ gibt den Gegensatz von δέ angemessen wieder.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: ist gegen die gerichtet, die Böses tun
  rationale: Im negativen Gegenstück bezeichnet ἐπί die feindliche Ausrichtung. Die partizipiale Wendung ποιοῦντας κακά wird verbal und natürlich als „die Böses tun“ wiedergegeben.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Augen, Ohren und Angesicht
  choice: Die drei Körperbilder werden in der Übersetzung beibehalten.
  alternative: Deutende Wiedergabe wie „Der Herr wacht über …, hört … und stellt sich gegen …“.
  rationale: 'Die Bilder tragen die literarische und theologische Aussage des Psalmzitats: Gottes aufmerksame Zuwendung zu den Gerechten steht seiner persönlichen Gegnerschaft gegenüber denen gegenüber, die Böses tun. Eine Paraphrase würde diese Bildstruktur abschwächen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist bewusst gehoben, um das wiederholte anthropomorphe Bild und den Klang des Psalmzitats zu bewahren; die übrige Syntax bleibt allgemein verständlich.
