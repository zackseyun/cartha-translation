    rationale: εἰς τὸ μή mit Infinitiv beschreibt hier den angestrebten Zweck bzw. die Vermeidung eines Hindernisses. „Damit eure Gebete nicht behindert werden“ gibt dies unmittelbarer wieder als die bloße zeitlich-konsekutive Einleitung „Dann“.
