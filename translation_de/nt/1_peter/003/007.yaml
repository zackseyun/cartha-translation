source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: de
  text: Ihr Männer, lebt ebenso mit euren Frauen verständnisvoll zusammen und erweist ihnen als den schwächeren, weiblichen Gefäßen[a] und auch als Miterbinnen der Gnade des Lebens[b] Ehre, damit eure Gebete nicht behindert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht der Singular: „dem schwächeren, weiblichen Gefäß“. Der deutsche Plural ist an die mehreren angesprochenen Frauen angepasst. Das Bild bezeichnet eine relative Schwäche oder Verletzlichkeit, ohne Frauen einen geringeren Wert oder geistlichen Rang zuzuschreiben; der folgende Ausdruck nennt sie auch Miterbinnen der Gnade des Lebens.'
    reason: Kulturelle und metaphorische Erläuterung sowie Hinweis auf die für idiomatisches Deutsch angepasste Zahl.
  - marker: b
    text: 'Wörtlich auch: „als solche, die auch Miterbinnen der Gnade des Lebens sind“.'
    reason: Die Fußnote bewahrt die Form und mögliche Nuance von ὡς καί.
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: ihr Männer
  rationale: Im Zusammenhang der Haustafel sind Ehemänner gemeint. „Ihr Männer“ ist im Deutschen die natürliche Anrede an Ehemänner; „mit euren Frauen“ macht den ehelichen Bezug eindeutig.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Bewahrt den Rückbezug auf die vorangehende Ermahnung, ohne eine vollständige Gleichsetzung der jeweiligen Anweisungen zu behaupten.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: lebt mit euren Frauen verständnisvoll zusammen
  rationale: Gibt das gemeinsame Eheleben idiomatisch wieder. „Verständnisvoll“ drückt ein von Erkenntnis und Einsicht bestimmtes Verhalten aus, ohne die Wendung auf bloßes Gefühl zu verengen.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: als dem schwächeren Gefäß, dem weiblichen
  rationale: Erhält sowohl den Komparativ als auch die Gefäßmetapher. Die nachgestellte Apposition wahrt den ungewöhnlichen griechischen Ausdruck, ohne „Frau“ und „Gefäß“ schlicht gleichzusetzen.
- source_word: ἀπονέμοντες τιμήν
  choice: erweist ihnen Ehre
  rationale: Natürliches modernes Deutsch für die Zuerkennung und praktische Erweisung der gebührenden Ehre.
- source_word: συγκληρονόμοις
  choice: Miterbinnen
  rationale: Die feminine Form macht deutlich, dass die Ehefrauen mit den Männern am Erbe teilhaben. Der Numerus folgt der adressierten Mehrzahl von Ehemännern und Ehefrauen.
- source_word: χάριτος ζωῆς
  choice: der Gnade des Lebens
  rationale: 'Bewahrt die offene Genitivverbindung: Gemeint sein kann Gnade, die im Leben besteht, oder Gnade, die Leben schenkt.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: Dann werden eure Gebete nicht behindert
  rationale: Gibt Ziel beziehungsweise Folge klar und natürlich wieder und erhält das Passiv sowie den Plural „Gebete“.
theological_decisions:
- issue: Bedeutung des „schwächeren Gefäßes“
  choice: Die vergleichende Aussage und die Metapher bleiben im Haupttext erhalten; eine Fußnote grenzt sie gegen geringeren Wert oder geistlichen Rang ab.
  alternative: Die Wendung ausdrücklich als körperlich schwächer oder gesellschaftlich verletzlicher aufzulösen.
  rationale: Der Text legt die Art der Schwäche nicht ausdrücklich fest. Der unmittelbare Zusammenhang fordert Ehre und bekräftigt die gemeinsame Erbenstellung der Frauen.
- issue: Bezug und Funktion von ὡς καὶ συγκληρονόμοις
  choice: Die Frauen werden als ebenfalls am Erbe beteiligte Miterbinnen bezeichnet; „da“ gibt den begründenden Sinn im deutschen Satz wieder.
  alternative: „als auch Miterbinnen“ oder eine rein vergleichende Wiedergabe ohne explizite Begründung.
  rationale: ὡς bei Partizipialkonstruktionen kann den vom Handelnden berücksichtigten Grund beziehungsweise Status markieren. „Da sie … sind“ ist natürliches Deutsch, ohne die gemeinsame Erbenstellung abzuschwächen.
- issue: Inhalt von „Gnade des Lebens“
  choice: Die Genitivfügung wird wörtlich offen gehalten.
  alternative: „die Gnade, die Leben schenkt“, „das ewige Leben“ oder „das Geschenk des Lebens“.
  rationale: Der griechische Ausdruck bestimmt weder die genaue Genitivbeziehung noch ausdrücklich „ewig“; eine engere Deutung würde die vorhandene Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem langen griechischen Partizipialsatz behutsam gegliedert. „Gefäß“ bleibt als biblische Metapher stehen und wird in der Fußnote erklärt; inklusive Sonderzeichen oder konfessionell geprägte Fachsprache werden vermieden.
