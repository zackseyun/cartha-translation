  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: de
  text: Doch haltet den Messias als Herrn in euren Herzen heilig[a] und seid jederzeit bereit, jedem Rede und Antwort zu stehen, der euch nach dem Grund für die Hoffnung fragt, die in euch ist[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Heiligt den Messias als Herrn in euren Herzen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „die ihr in euch tragt“ beziehungsweise „die ihr habt“. Das griechische „in euch“ kann sich auf die Einzelnen oder auf die Gemeinschaft beziehen.'
    reason: ambiguity
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: den Messias als Herrn
  rationale: Die Wortgruppe bezeichnet den Messias in seiner Stellung als Herr. „Messias“ gibt Χριστός als Titel wieder; die prädikative Fügung mit κύριον bleibt durch „als Herrn“ erhalten.
- source_word: ἁγιάσατε
  choice: haltet ... heilig
  rationale: Das Verb bedeutet wörtlich „heiligt“. Bei einer bereits heiligen Person fordert es hier dazu auf, sie innerlich als heilig anzuerkennen und entsprechend zu ehren, nicht sie erst heilig zu machen.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Die geläufige deutsche Wendung bewahrt sowohl den inneren Bezug als auch den Plural der Anrede.
- source_word: ἕτοιμοι ἀεὶ
  choice: seid jederzeit bereit
  rationale: Die im Griechischen elliptische prädikative Wendung wird im Deutschen mit „seid“ vollständig und natürlich wiedergegeben.
- source_word: πρὸς ἀπολογίαν
  choice: euch ... zu verteidigen
  rationale: ἀπολογία bezeichnet eine Verteidigung oder begründete Antwort. Die reflexive Verbform ist im heutigen Deutsch natürlicher als „zu einer Verteidigung“, ohne den forensischen Beiklang aufzugeben.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: vor jedem, der von euch ... verlangt
  rationale: παντί bleibt distributiv und umfassend; αἰτέω bezeichnet hier das Einfordern einer Auskunft oder Begründung.
- source_word: λόγον
  choice: Rechenschaft
  rationale: λόγος meint im Zusammenhang eine begründete Darlegung oder Auskunft. „Rechenschaft“ passt idiomatisch zum Verb „verlangen“ und ergänzt die Bedeutung von ἀπολογία.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: über die Hoffnung ..., die in euch ist
  rationale: Die Formulierung bleibt eng am griechischen Ausdruck und lässt offen, ob ἐν ὑμῖν stärker individuell-innerlich oder gemeinschaftlich zu verstehen ist.
theological_decisions:
- issue: Bedeutung von ἁγιάσατε bei dem Messias als Objekt
  choice: haltet den Messias als Herrn ... heilig
  alternative: heiligt den Messias als Herrn
  rationale: Die Wiedergabe bewahrt den Heiligkeitsbegriff, vermeidet aber den möglichen Fehlschluss, die Angesprochenen machten den Messias erst heilig.
- issue: Syntaktische Beziehung von κύριον und Χριστόν
  choice: den Messias als Herrn
  alternative: den Herrn, den Messias
  rationale: „Als Herrn“ gibt die wahrscheinliche prädikative Funktion von κύριον wieder und lässt zugleich den christologischen Nachklang von Jesaja 8,13 erkennen, ohne ihn erklärend in den Text einzutragen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Hier fungiert Χριστός als Würde- und Bekenntnistitel; „Messias“ macht diesen Titelcharakter im modernen Deutsch deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechenschaft“ und „heilig“ bewahren den feierlichen und argumentativen Ton, während „haltet ... heilig“ und „euch ... zu verteidigen“ für heutige Leser verständlich bleiben. Die abschließende Interpunktion folgt dem vorgelegten Verssegment, das syntaktisch in den nächsten Vers weiterführt.
