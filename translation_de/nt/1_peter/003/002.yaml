  text: when they observe your pure conduct in fear.
translation:
  language: de
  text: wenn sie euren reinen Lebenswandel in Ehrfurcht beobachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: wenn sie … beobachten
  rationale: Das Partizip nimmt sinngemäß den zeitlich-bedingenden Anschluss des vorangehenden Satzes auf; „beobachten“ gibt das aufmerksame Wahrnehmen wieder.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: reinen Lebenswandel
  rationale: ἁγνός bezeichnet sittliche Reinheit; ἀναστροφή meint Lebensführung bzw. Verhalten. „Lebenswandel“ ist prägnant und würdevoll.
- source_word: ἐν φόβῳ
  choice: in Ehrfurcht
  rationale: Die Präpositionalform wird als nähere Bestimmung der Lebensführung bewahrt. „Ehrfurcht“ hält den religiös-ethischen Gehalt von φόβος fest, ohne bloße Ängstlichkeit nahezulegen.
theological_decisions:
- issue: Bezug und Bedeutung von ἐν φόβῳ
  choice: in Ehrfurcht
  alternative: mit Furcht / in Gottesfurcht
  rationale: Der griechische Text nennt das Objekt der Furcht nicht ausdrücklich. Daher wird „Gottes-“ nicht ergänzt; „Ehrfurcht“ lässt den wahrscheinlich religiösen Sinn offen, ohne ihn konfessionell zu präzisieren.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Als Versfragment bleibt der syntaktische Anschluss an 1 Petrus 3,1 erhalten.
