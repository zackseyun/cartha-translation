id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: de
  text: Denn es ist besser, Gutes zu tun und dabei zu leiden[a] – wenn Gottes Wille es so will[b] –, als Böses zu tun und dabei zu leiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dafür zu leiden, dass man Gutes tut … als dafür, dass man Böses tut«. Die Partizipien können den Grund des Leidens oder allgemeiner die begleitenden Umstände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wenn der Wille Gottes es wollen sollte«. Die griechische Wiederholung unterstreicht den Gedanken; im Haupttext wird sie sinngemäß wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: es ist besser
  rationale: 'Die prädikativ gebrauchte Komparativform ergibt idiomatisch und sachlich: »es ist besser«.'
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage und wird im Deutschen natürlich mit »Denn« wiedergegeben.
- source_word: ἀγαθοποιοῦντας
  choice: Gutes zu tun und dabei
  rationale: Das präsentische Partizip beschreibt die Betroffenen während ihres guten Handelns. Diese Wiedergabe bewahrt den Umstandsbezug, ohne eine kausale Bedeutung zwingend festzulegen.
- source_word: εἰ θέλοι
  choice: wenn ... es so will
  rationale: Der Optativ nach εἰ bezeichnet eine mögliche, vorsichtig formulierte Bedingung. Das deutsche Präsens im Konditionalsatz klingt natürlich; »so« nimmt die emphatische Verbindung von θέλοι und θέλημα auf.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: Gottes Wille
  rationale: Die Genitivverbindung wird knapp und würdig wiedergegeben.
- source_word: πάσχειν
  choice: zu leiden
  rationale: Der von κρεῖττον abhängige Infinitiv wird direkt und idiomatisch übersetzt.
- source_word: ἢ
  choice: als
  rationale: Nach dem Komparativ ist »als« die normale deutsche Vergleichspartikel.
- source_word: κακοποιοῦντας
  choice: Böses zu tun und dabei
  rationale: Die parallele Wiedergabe erhält den Gegensatz zu ἀγαθοποιοῦντας und lässt offen, ob das Partizip nur die Umstände oder ausdrücklich den Grund des Leidens bezeichnet.
theological_decisions:
- issue: Verhältnis des Leidens zum Willen Gottes
  choice: Die Formulierung lässt Leiden als mögliche Gegebenheit innerhalb des Willens Gottes stehen, ohne die Art göttlicher Verursachung näher zu bestimmen.
  alternative: Die Aussage entweder als strikten göttlichen Beschluss jedes Leidens oder ausschließlich als passive Zulassung auszulegen.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ stellt einen bedingten Bezug zu Gottes Willen her, entscheidet aber keine umfassende Lehre über Beschluss, Verursachung oder Zulassung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gedankenstrich hebt den konditionalen Einschub hervor; die parallele Satzstruktur bewahrt den Gegensatz zwischen Gutestun und Bösestun.
