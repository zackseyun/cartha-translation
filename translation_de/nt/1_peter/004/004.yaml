  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: de
  text: Darüber wundern sie sich[a], dass ihr nicht mit ihnen in dieselbe Flut[b] der Ausschweifung hineinrennt, wobei sie euch beschimpfen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »finden sie es befremdlich«; »sind sie erstaunt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »in dasselbe Überströmen der Ausschweifung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »verleumden sie euch«; »reden sie abfällig über euch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Darüber
  rationale: Die Wendung greift den zuvor beschriebenen Wandel im Lebenswandel auf. »Darüber« stellt diesen Rückbezug im Deutschen klar und natürlich her, ohne die stärker kausale Deutung »deswegen« festzuschreiben.
- source_word: ξενίζονται
  choice: wundern sie sich
  rationale: Das Verb bezeichnet, dass etwas fremd oder befremdlich erscheint und deshalb Verwunderung auslöst. Die gewählte Formulierung ist gegenwärtiges, verständliches Deutsch.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: dass ihr nicht mit ihnen ... hineinrennt
  rationale: Die griechische Genitivkonstruktion wird als deutscher dass-Satz wiedergegeben. »Mit ihnen ... hineinrennt« bewahrt das Bewegungsbild von συντρέχω und bezeichnet zugleich die verweigerte Teilnahme.
- source_word: εἰς τὴν αὐτὴν
  choice: in dieselbe
  rationale: Die Formulierung wahrt sowohl die Richtung beziehungsweise das Hineingeraten als auch den Bezug auf dasselbe frühere Verhaltensmuster.
- source_word: τῆς ἀσωτίας
  choice: der Ausschweifung
  rationale: ἀσωτία bezeichnet zügelloses, verschwenderisches und moralisch ungehemmtes Verhalten. »Ausschweifung« ist prägnant, würdig und im modernen Deutschen verständlich.
- source_word: ἀνάχυσιν
  choice: Flut
  rationale: Das seltene Substantiv bezeichnet ein Ausgießen oder Überströmen. »Flut« erhält das anschauliche Bild maßloser Fülle und verbindet sich natürlich mit dem Hineinrennen.
- source_word: βλασφημοῦντες
  choice: Deshalb beschimpfen sie euch
  rationale: Im Kontext bezeichnet das Partizip feindseliges, verächtliches Reden gegen die Gläubigen. Das im Griechischen nicht ausdrücklich genannte Objekt wird aus dem Zusammenhang ergänzt. »Deshalb« macht den begleitenden beziehungsweise folgernden Zusammenhang idiomatisch deutlich.
theological_decisions:
- issue: Zielrichtung von βλασφημοῦντες
  choice: gegen Menschen gerichtetes Beschimpfen
  alternative: lästern beziehungsweise Gotteslästerung
  rationale: Der unmittelbare Zusammenhang beschreibt die Reaktion Außenstehender auf die veränderte Lebensweise der Adressaten. Eine Wiedergabe mit »Gotteslästerung« würde im Deutschen ein nicht ausdrücklich genanntes göttliches Objekt nahelegen.
- issue: Verhältnis des abschließenden Partizips zum Hauptsatz
  choice: 'als eigener deutscher Folgesatz: »Deshalb beschimpfen sie euch«'
  alternative: 'modal oder gleichzeitig: »wobei sie euch beschimpfen«'
  rationale: Das griechische Partizip lässt den genauen logischen Zusammenhang offen. Der eigene Satz ist natürlich und stellt die feindselige Reaktion klar dar; eine Fußnote weist auf die engere participiale Alternative hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bewegungs- und Flutbild des griechischen Textes bleibt erhalten. Die Satzteilung dient der Klarheit; die Fußnoten bewahren die lexikalischen und syntaktischen Alternativen.
