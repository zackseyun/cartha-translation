lexical_decisions:
- source_word: φιλόξενοι
  choice: Seid gastfreundlich
  rationale: Das Adjektiv wird im Zusammenhang als Aufforderung gebraucht. Die Ergänzung von „Seid“ gibt diese imperativische Funktion im Deutschen natürlich wieder und bewahrt zugleich die adjektivische Ausdrucksweise.
- source_word: εἰς ἀλλήλους
  choice: zueinander
  rationale: Die Wendung bezeichnet die wechselseitige Ausrichtung innerhalb der Gemeinschaft. „Zueinander“ ist knapp, idiomatisch und erhält den gegenseitigen Sinn.
- source_word: ἄνευ
  choice: ohne
  rationale: Die Präposition bezeichnet das Fehlen beziehungsweise den Ausschluss von etwas und wird direkt mit „ohne“ wiedergegeben.
- source_word: γογγυσμοῦ
  choice: zu murren
  rationale: „Murren“ gibt den Sinn einer missmutigen, widerwilligen Beschwerde in einem gemeinschaftlichen Zusammenhang treffend wieder. Die Infinitivkonstruktion ist nach „ohne“ im modernen Deutschen natürlich.
