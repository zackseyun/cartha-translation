  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: »das Ende aller Dinge« entspricht Πάντων τὸ τέλος, »ist nahe gekommen« bildet den resultativen Charakter von ἤγγικεν angemessen ab, und »daher« gibt die Folgerung οὖν klar wieder. »Besonnen und nüchtern« wahrt die zwei Imperative σωφρονήσατε und νήψατε. Die finale Wiedergabe von εἰς προσευχάς durch »damit ihr beten könnt« ist idiomatisch und gibt die Ausrichtung auf das Gebet wieder, auch wenn der griechische Plural dabei nicht formgleich sichtbar bleibt.'
