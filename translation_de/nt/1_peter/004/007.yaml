  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: de
  text: Doch das Ende aller Dinge ist nahe gekommen.[a] Seid daher besonnen und nüchtern[b], damit ihr beten könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist nahe«. Die griechische Perfektform kann formnäher mit »ist nahe gekommen« oder idiomatischer mit »ist nahe« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Seid vernünftig und geistig wach.« Die beiden Aufforderungen betonen klares Urteilsvermögen, Selbstbeherrschung und geistige Wachsamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: aller Dinge
  rationale: Der substantivisch gebrauchte Genitiv Plural bezeichnet in Verbindung mit τέλος umfassend »alle Dinge«; die Ergänzung »Dinge« ist im Deutschen natürlich.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen leichten Übergang mit kontrastierendem Akzent. »Doch« bewahrt diesen Diskursanschluss, ohne einen starken Gegensatz zu behaupten.
- source_word: τὸ τέλος
  choice: das Ende
  rationale: Im eschatologischen Zusammenhang ist »das Ende« die unmittelbarste Wiedergabe; Deutungen wie »Ziel« oder »Vollendung« würden den Sinn stärker festlegen.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Die Perfektform bezeichnet eine Annäherung mit gegenwärtigem Ergebnis. »Ist nahe gekommen« bildet diesen Aspekt ab; das idiomatischere »ist nahe« bleibt als Fußnotenalternative erhalten.
- source_word: σωφρονήσατε
  choice: seid besonnen
  rationale: Das Verb fordert vernünftiges, beherrschtes und klares Denken. »Besonnen« gibt diese mentale und praktische Selbstbeherrschung in natürlichem Deutsch wieder.
- source_word: οὖν
  choice: daher
  rationale: οὖν zieht eine ausdrückliche Folgerung aus der Nähe des Endes; »daher« macht diesen Zusammenhang klar.
- source_word: νήψατε
  choice: seid nüchtern
  rationale: νήφω ist im Neuen Testament bildlich gebraucht und bezeichnet geistige Wachheit und Klarheit. »Nüchtern« bewahrt das griechische Bild und bildet zusammen mit »besonnen« die zwei Imperative ab.
- source_word: εἰς προσευχάς
  choice: damit ihr beten könnt
  rationale: εἰς drückt hier Ziel oder Zweck aus. Die finale Formulierung ist im heutigen Deutsch natürlicher als »für Gebete« und stellt klar, dass Besonnenheit und Nüchternheit dem Gebet dienen.
theological_decisions:
- issue: Eschatologische Bedeutung von »das Ende aller Dinge«
  choice: Als unmittelbare eschatologische Aussage beibehalten, ohne einen genauen Zeitplan oder ein Endzeitsystem festzulegen.
  alternative: »Das Ziel aller Dinge« oder eine rein gegenwärtig-verwirklichte Deutung.
  rationale: Der Vers begründet seine ethische Mahnung mit der Nähe des Endes. Die Übersetzung bewahrt diese Dringlichkeit, ohne eine konfessionelle Endzeitlehre einzutragen.
- issue: Verhältnis von geistiger Haltung und Gebet
  choice: Besonnenheit und Nüchternheit werden als Voraussetzungen genannt, die auf das Beten ausgerichtet sind.
  alternative: Die Präpositionalphrase als bloße Begleitumstandsangabe oder als Hinweis auf bestimmte liturgische Gebete zu verstehen.
  rationale: εἰς trägt am ehesten Ziel- oder Zweckbedeutung; der Plural kann wiederholtes Beten bezeichnen, legt aber keine bestimmte Gebetsform fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ist nahe gekommen« wahrt bewusst den Aspekt der griechischen Perfektform; »besonnen und nüchtern« ist knapp und einprägsam. Die finale Formulierung »damit ihr beten könnt« vermeidet das unnatürliche »für Gebete«, ohne die Ausrichtung auf wiederholtes Gebet konfessionell einzuengen.
