id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: de
  text: Denn deshalb wurde auch den Toten das Evangelium verkündet, damit sie zwar nach Menschen[a] im Fleisch gerichtet werden, aber nach Gott im Geist[b] leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Nach Menschen“ kann auch „nach menschlichem Maßstab“ oder „aus menschlicher Sicht“ bedeuten. Die wörtliche Form bewahrt den Gegensatz zu „nach Gott“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im geistlichen Bereich“; manche verstehen die Wendung als „durch den Geist“. Der griechische Text nennt den Heiligen Geist hier nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dazu
  rationale: Gibt die zielgerichtete Wendung knapp und natürlich wieder; γάρ wird mit „denn“ als Rückbezug auf den vorherigen Zusammenhang erhalten.
- source_word: νεκροῖς
  choice: den Toten
  rationale: Substantiviertes Dativ Plural; die neutrale Wiedergabe legt nicht fest, in welchem Sinn oder zu welchem Zeitpunkt sie tot sind.
- source_word: εὐηγγελίσθη
  choice: wurde … die gute Botschaft verkündet
  rationale: Bewahrt das Passiv und den Inhalt des Verbs εὐαγγελίζω in verständlichem, würdigem Deutsch.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den finalen beziehungsweise ergebnisbezogenen Sinn der Konjunktion wieder.
- source_word: κριθῶσι
  choice: sie … gerichtet werden
  rationale: Bewahrt gegenüber einer konzessiven Umformung ausdrücklich den Aorist Passiv Konjunktiv unter ἵνα und lässt die umstrittene Art des Gerichts offen.
- source_word: μὲν … δὲ
  choice: zwar … aber
  rationale: Bildet die deutliche antithetische Parallelstruktur des Griechischen ab.
- source_word: κατὰ ἀνθρώπους
  choice: nach Menschen
  rationale: Erhält die wörtliche und theologisch spannungsvolle Parallele zu „nach Gott“; eine idiomatischere Deutung wird in der Fußnote genannt.
- source_word: σαρκί
  choice: im Fleisch
  rationale: Bewahrt den Gegensatz zu πνεύματι, ohne σάρξ als „sündige Natur“ auszulegen.
- source_word: ζῶσι
  choice: leben
  rationale: Der deutsche Konjunktionssatz mit „damit“ gibt den griechischen Konjunktiv idiomatisch durch den Indikativ wieder.
- source_word: κατὰ θεόν
  choice: nach Gott
  rationale: Erhält die genaue formale Parallele und den Gegensatz zu κατὰ ἀνθρώπους, ohne ihn auf Gottes Urteil, Willen oder Lebensweise festzulegen.
- source_word: πνεύματι
  choice: im Geist
  rationale: Bewahrt den Dativ und die Parallele zu „im Fleisch“; die Großschreibung ist im Deutschen orthografisch erforderlich, entscheidet aber nicht eindeutig zwischen menschlichem Geist und Heiligem Geist.
theological_decisions:
- issue: Identität der „Toten“
  choice: Neutral als „den Toten“ wiedergegeben.
  alternative: Menschen, die inzwischen gestorben sind; geistlich Tote; Tote im Zusammenhang mit 1 Petrus 3,19.
  rationale: Der griechische Text bestimmt nicht ausdrücklich, wann oder in welchem Sinn die Empfänger der Verkündigung tot waren.
- issue: Art des Gerichts und Lebens
  choice: Die Gegenüberstellung „nach Menschen im Fleisch … nach Gott im Geist“ bleibt formal erhalten.
  alternative: Von Menschen während des leiblichen Lebens verurteilt; dem allen Menschen bestimmten leiblichen Tod unterworfen; von Gott im Bereich des Fleisches gerichtet und geistlich lebend.
  rationale: Die knappe griechische Formulierung lässt mehrere eng verwandte Deutungen zu; die Übersetzung soll keine davon stillschweigend festlegen.
- issue: Referenz von πνεύματι
  choice: „im Geist“, ohne ausdrückliche Identifikation mit dem Heiligen Geist.
  alternative: „durch den Geist“ als ausdrücklicher Bezug auf den Heiligen Geist.
  rationale: Der Dativ kann einen Lebensbereich bezeichnen, und der Parallelismus mit σαρκί spricht für eine offene Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst knappe Formulierung und der Parallelismus des Ausgangstextes bleiben erhalten. Beide Fußnotenmarker stehen im Haupttext; sie beziehen sich der Reihe nach auf „nach Menschen“ und „im Geist“.
