  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: de
  text: Denn es ist Zeit, dass das Gericht beim Haus Gottes[a] beginnt; wenn es aber zuerst bei uns beginnt, was wird dann das Ende[b] derer sein, die dem Evangelium Gottes nicht gehorchen[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes Hausgemeinschaft“. Das griechische Wort οἶκος kann „Haus“ oder „Hausgemeinschaft“ bedeuten; hier bezeichnet es wahrscheinlich Gottes Volk als seine Hausgemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ausgang“ oder „Ergebnis“. Das griechische τέλος kann „Ende“, „Ausgang“ oder „Ergebnis“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „die sich weigern, dem Evangelium Gottes zu glauben“. Das griechische Verb kann sowohl Ungehorsam als auch Unglauben gegenüber dem Evangelium bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die vorherige Ermahnung. „Denn“ gibt diese kausale Verknüpfung knapp und natürlich wieder.
- source_word: ὁ καιρός
  choice: die Zeit ist gekommen
  rationale: καιρός bezeichnet hier den eingetretenen beziehungsweise bestimmten Zeitpunkt, nicht bloß chronologische Zeit. Die deutsche Wendung macht dieses Moment idiomatisch deutlich.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: dass das Gericht … beginnt
  rationale: Der substantivierte Infinitiv bezeichnet den Inhalt dessen, wofür die Zeit gekommen ist. Der deutsche dass-Satz ist natürlich und wahrt den Sinn.
- source_word: κρίμα
  choice: Gericht
  rationale: „Gericht“ bewahrt die richterliche Ernsthaftigkeit, ohne das Handeln Gottes an seinem eigenen Volk vorschnell als Verdammnis oder lediglich als Erziehung festzulegen.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: beim Haus Gottes
  rationale: „Beim“ ist im Deutschen die natürliche Wiedergabe für den Ausgangspunkt des Gerichts. „Haus Gottes“ bewahrt die Bildsprache von οἶκος; der Kontext und die Fußnote weisen auf Gottes Hausgemeinschaft hin.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: Wenn es aber zuerst bei uns beginnt
  rationale: Das Verb „beginnt“ wird aus dem vorherigen Satz ergänzt. „Bei uns“ nimmt den Ausgangspunkt erneut auf und verbindet die Glaubenden mit dem Haus Gottes.
- source_word: τέλος
  choice: Ende
  rationale: „Ende“ ist die unmittelbare Wiedergabe von τέλος und lässt sowohl den Ausgang als auch das endgültige Geschick anklingen, ohne die Mehrdeutigkeit einzuengen.
- source_word: ἀπειθούντων
  choice: die … nicht gehorchen
  rationale: Die Form bezeichnet Menschen, die dem Evangelium nicht Folge leisten; im Kontext kann dies zugleich Unglauben beziehungsweise Glaubensverweigerung einschließen.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: dem Evangelium Gottes
  rationale: Der Dativ wird als Gegenstand des Nichtgehorchens wiedergegeben. „Evangelium Gottes“ wahrt die gewichtige Genitivverbindung und kann Zugehörigkeit wie Ursprung bezeichnen.
theological_decisions:
- issue: Art des κρίμα im Blick auf Gottes Volk
  choice: „Gericht“, ohne es als Verdammnis oder Züchtigung näher festzulegen
  alternative: „Verdammnis“ oder „Erziehung/Züchtigung“
  rationale: Der weitere Zusammenhang unterscheidet Gottes an seinem Haus beginnendes Gericht vom Ende derer, die dem Evangelium nicht gehorchen. Der allgemeinere Ausdruck wahrt diese theologische Spannung.
- issue: Bedeutung des Hauses Gottes
  choice: Die Bildformulierung „Haus Gottes“ bleibt im Text erhalten und wird in der Fußnote als Gottes Hausgemeinschaft beziehungsweise Volk erläutert.
  alternative: Ein Tempelgebäude oder ausdrücklich „Gottes Familie“
  rationale: Das anschließende „bei uns“ zeigt, dass Personen beziehungsweise die Gemeinschaft der Glaubenden gemeint sind. Die Bildsprache sollte dennoch nicht unnötig aufgelöst werden.
- issue: Verhältnis von Ungehorsam und Unglauben in ἀπειθέω
  choice: „nicht gehorchen“, mit Hinweis auf die mögliche Bedeutung „sich weigern zu glauben“
  alternative: Nur „nicht glauben“
  rationale: Das griechische Wort verbindet im Evangeliumskontext Glaubensverweigerung und Ungehorsam. Haupttext und Fußnote bewahren beide Aspekte, ohne sie gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der rhetorischen Bewegung des griechischen Textes, wird aber durch die Wiederaufnahme von „beginnt“ im Bedingungssatz idiomatisch verdeutlicht. „Haus Gottes“, „Gericht“ und „Evangelium“ erhalten die biblische Bild- und Begriffssprache, während die Fußnoten echte lexikalische Mehrdeutigkeiten offenlegen.
