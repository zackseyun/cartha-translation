id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: de
  text: Dient einander, jeder mit der Gabe, die er empfangen hat,[a] als gute Verwalter der vielfältigen Gnade Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Dient damit einander, jeder entsprechend der Gabe, die er empfangen hat.'
    reason: Die alternative Satzfügung bildet καθὼς („entsprechend dem, wie“) und den pronominalen Rückbezug αὐτό ausdrücklicher ab, klingt im Haupttext jedoch weniger flüssig.
lexical_decisions:
- source_word: ἕκαστος καθὼς ἔλαβεν χάρισμα
  choice: jeder mit der Gabe, die er empfangen hat
  rationale: Die distributive Aussage und der Zusammenhang zwischen empfangener Gabe und Dienst werden in natürlichem Deutsch bewahrt. „Gabe“ bleibt weiter als der interpretativ engere Ausdruck „Geistesgabe“.
- source_word: εἰς ἑαυτοὺς
  choice: einander
  rationale: Der reflexive Plural bezeichnet die Gemeinschaft als Empfängerin des Dienstes. Im Deutschen gibt „einander“ den wechselseitigen gemeinschaftlichen Bezug knapp und idiomatisch wieder.
- source_word: αὐτὸ διακονοῦντες
  choice: Dient … mit der Gabe
  rationale: Das Partizip trägt im Kontext auffordernde Kraft. Die Gabe ist das anvertraute Mittel des Dienstes; diese Formulierung vermeidet das unnatürliche „dient sie einander“.
- source_word: καλοὶ οἰκονόμοι
  choice: gute Verwalter
  rationale: „Verwalter“ bezeichnet Personen, die verantwortlich mit anvertrautem Gut umgehen, und erhält damit den Gedanken der Rechenschaftspflicht.
- source_word: ποικίλης χάριτος θεοῦ
  choice: der vielfältigen Gnade Gottes
  rationale: „Vielfältig“ gibt die vielen Formen und Ausprägungen der göttlichen Gnade klar und würdig wieder.
theological_decisions:
- issue: Bedeutungsumfang von χάρισμα
  choice: Gabe
  alternative: Geistesgabe; Gnadengabe
  rationale: Der Kontext beschreibt eine durch Gottes Gnade verliehene Befähigung zum Dienst, doch das griechische Wort verlangt hier nicht die engere technische Wiedergabe „Geistesgabe“.
- issue: Gemeinschaftlicher Bezug von εἰς ἑαυτούς
  choice: einander
  alternative: untereinander; füreinander
  rationale: „Einander“ drückt die Gemeinde als Ziel des Dienstes natürlich aus. Die mögliche Nuance „füreinander“ wird in der Fußnote offengehalten.
- issue: Imperativische Wiedergabe des Partizips διακονοῦντες
  choice: Dient
  alternative: indem ihr dient
  rationale: Das Partizip hat im Zusammenhang einer Ermahnung auffordernde Funktion. Der deutsche Imperativ macht diese Funktion verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wird für natürliche deutsche Syntax mit dem Imperativ eröffnet. „Gabe“ und „vielfältige Gnade“ vermeiden sowohl unnötige Fachsprache als auch konfessionelle Verengung.
