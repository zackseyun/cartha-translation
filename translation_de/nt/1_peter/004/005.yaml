base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: de
  text: Sie werden dem, der bereit ist, Lebende und Tote zu richten, Rechenschaft geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich zum Richten bereithält“. Wörtlich beschreibt die griechische Wendung jemanden, der bereit ist zu richten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Sie
  rationale: Das Relativpronomen bezieht sich auf die zuvor genannten Menschen. Der selbstständige Satzanfang mit „Sie“ ist im Deutschen natürlich und hält den Bezug klar.
- source_word: ἀποδώσουσιν λόγον
  choice: werden Rechenschaft geben
  rationale: Die Wendung bezeichnet das Ablegen von Rechenschaft beziehungsweise das Sich-Verantworten und bewahrt hier den gerichtlichen Klang.
- source_word: τῷ
  choice: dem
  rationale: Der Artikel substantiviert die folgende Partizipialkonstruktion. „Dem, der …“ bildet dies knapp und ohne eine im Griechischen nicht ausdrücklich genannte Identität ab.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: der bereitsteht, … zu richten
  rationale: Die griechische Konstruktion beschreibt den Richter als gegenwärtig zum Richten bereit. „bereitsteht“ gibt diese gespannte Bereitschaft natürlich und anschaulich wieder.
- source_word: ζῶντας καὶ νεκρούς
  choice: Lebende und Tote
  rationale: Die substantivierten Adjektive werden in ihrer umfassenden, knappen und im Deutschen vertrauten Form wiedergegeben.
theological_decisions:
- issue: Identität dessen, der Lebende und Tote richten wird
  choice: Im Haupttext bleibt die Person mit „dem, der“ unbenannt.
  alternative: Gott oder Christus ausdrücklich als Richter benennen
  rationale: Der griechische Vers nennt den Richter nicht ausdrücklich. Die offene Formulierung bewahrt die Spannung des Wortlauts und vermeidet eine über den Vers hinausgehende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechenschaft geben“ wahrt den gerichtlichen Zusammenhang; „bereitsteht“ vermittelt die unmittelbare Bereitschaft des Richters, ohne dessen Identität ausdrücklich festzulegen.
