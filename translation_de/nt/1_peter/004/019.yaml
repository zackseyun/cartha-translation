  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: de
  text: Daher sollen auch die, die gemäß Gottes Willen leiden, ihre Seelen[a] dem treuen Schöpfer anvertrauen, indem sie Gutes tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihr Leben“ oder „sich selbst“; das griechische Wort kann die Seele, das Leben oder die ganze Person bezeichnen.
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ὥστε
  choice: Daher
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang und klingt im modernen Deutsch natürlich.
- source_word: οἱ πάσχοντες
  choice: die, die … leiden
  rationale: Gibt das substantivierte Präsenspartizip allgemein und idiomatisch wieder.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: nach Gottes Willen
  rationale: Bewahrt die Aussage der Übereinstimmung mit Gottes Willen, ohne näher festzulegen, auf welche Weise das Leiden dazu in Beziehung steht.
- source_word: πιστῷ κτίστῃ
  choice: dem treuen Schöpfer
  rationale: „Treu“ bewahrt den Gedanken der Verlässlichkeit von πιστός. Der bestimmte Artikel ist im Deutschen bei der einzigartigen Gottesbezeichnung „Schöpfer“ natürlich, ohne dem griechischen artikellosen Ausdruck eine zusätzliche dogmatische Aussage aufzuerlegen.
- source_word: παρατιθέσθωσαν
  choice: sollen … anvertrauen
  rationale: Gibt den Imperativ in der dritten Person und den Gedanken wieder, etwas in die verlässliche Obhut eines anderen zu geben.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ihre Seelen
  rationale: Bewahrt die herkömmliche und theologisch gewichtige Wiedergabe von ψυχή; die im Zusammenhang ebenfalls möglichen Bedeutungen „Leben“ und „sich selbst“ werden in einer Fußnote genannt.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: während sie Gutes tun
  rationale: Gibt das Tun des Guten als begleitenden Vollzug des Sich-Anvertrauens verständlich wieder, ohne es ausschließlich als Mittel oder Ursache zu deuten.
theological_decisions:
- issue: Verhältnis des Leidens zu Gottes Willen
  choice: nach Gottes Willen
  alternative: im Einklang mit Gottes Willen; durch Gottes Willen
  rationale: Die Formulierung wahrt die Beziehung des Leidens zu Gottes Willen, entscheidet aber nicht zwischen Zulassung, Bestimmung oder einer anderen näheren theologischen Erklärung.
- issue: Bedeutung von ψυχή im Zusammenhang
  choice: Seelen
  alternative: Leben; sich selbst
  rationale: „Seelen“ erhält die lexikalische und theologische Spannung des Ausdrucks; die breiteren möglichen Bezüge auf das Leben oder die ganze Person werden nicht ausgeschlossen, sondern in der Fußnote offengelegt.
- issue: Bestimmtheit von πιστῷ κτίστῃ
  choice: dem treuen Schöpfer
  alternative: einem treuen Schöpfer
  rationale: Obwohl der griechische Ausdruck keinen Artikel hat, bezeichnet er hier Gott als Schöpfer. Im Deutschen ist der bestimmte Artikel bei dieser einzigartigen Bezeichnung natürlicher; die Eigenschaft der Treue bleibt hervorgehoben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, wird aber durch „die, die“ und den mit „während“ eingeleiteten Begleitsatz für heutige Leser natürlich formuliert.
