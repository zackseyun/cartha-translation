id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: de
  text: Doch in dem Maß, in dem ihr an den Leiden des Messias[a] Anteil habt, freut euch, damit ihr euch auch bei der Offenbarung[b] seiner Herrlichkeit voll Jubel freut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an den Leiden des Christus.'
    reason: Alternative Wiedergabe des griechischen Titels Χριστός.
  - marker: b
    text: 'Oder: Enthüllung.'
    reason: Lexikalische Alternative, die das Sichtbarwerden dessen betont, was zuvor verborgen war.
lexical_decisions:
- source_word: καθὸ
  choice: in dem Maß, in dem
  rationale: 'Die Formulierung gibt die proportionale Bedeutung wieder: Die Aufforderung zur Freude entspricht dem Maß ihrer Teilhabe an den Leiden.'
- source_word: κοινωνεῖτε
  choice: Anteil habt
  rationale: Diese geläufige deutsche Wendung bewahrt den Gedanken wirklicher Teilhabe, ohne bloße Anteilnahme oder Mitgefühl anzudeuten.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: an den Leiden des Messias
  rationale: Der Genitiv wird natürlich wiedergegeben, ohne näher zu bestimmen, auf welche Weise die Glaubenden an diesen Leiden teilhaben.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός bezeichnet hier den messianischen Titel; „Messias“ macht dessen Bedeutung im Deutschen sichtbar.
- source_word: χαίρετε
  choice: freut euch
  rationale: Der Imperativ fordert zu gegenwärtiger Freude auf und wahrt zugleich die Wortverbindung zum späteren χαρῆτε.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Zielbeziehung der griechischen Konstruktion klar und idiomatisch wieder.
- source_word: ἀποκαλύψει
  choice: Offenbarung
  rationale: Das Substantiv entspricht der Form des griechischen Ausdrucks und bezeichnet hier das künftige Sichtbarwerden seiner Herrlichkeit.
- source_word: δόξης αὐτοῦ
  choice: seiner Herrlichkeit
  rationale: Die knappe Genitivverbindung wird als natürliche deutsche Possessivkonstruktion wiedergegeben.
- source_word: χαρῆτε
  choice: ihr euch auch … freut
  rationale: Die Wiedergabe erhält die lexikalische Verbindung zu χαίρετε und bringt καί mit „auch“ zum Ausdruck.
- source_word: ἀγαλλιώμενοι
  choice: voll Jubel
  rationale: Die adverbiale Wendung gibt die gesteigerte, jubelnde Freude des Partizips in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der griechische Ausdruck trägt hier erkennbar Titelfunktion. „Messias“ bewahrt den jüdisch-messianischen Gehalt, während die Fußnote die traditionelle Wiedergabe nennt.
- issue: Art der Teilhabe an den Leiden des Messias
  choice: an den Leiden des Messias Anteil habt
  alternative: für den Messias leidet
  rationale: Der griechische Text spricht von Teilhabe, legt aber nicht ausdrücklich fest, ob damit Leiden um seinetwillen, Verbundenheit mit ihm oder ein weiterer Aspekt gemeint ist. Die Übersetzung wahrt diese theologische Offenheit.
- issue: Beziehung zwischen gegenwärtiger und künftiger Freude
  choice: freut euch, damit ihr euch auch … freut
  alternative: freut euch, weil ihr euch künftig freuen werdet
  rationale: Die ἵνα-Konstruktion wird als Zielbeziehung bewahrt, ohne sie in eine reine Begründung umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Anteil haben“ und „voll Jubel“ sind allgemein verständlich; die doppelte Formulierung „in dem Maß, in dem“ bewahrt bewusst die proportionale Aussage des Ausgangstextes.
