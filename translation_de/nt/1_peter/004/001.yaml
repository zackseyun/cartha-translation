id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: de
  text: Da nun Christus im Fleisch gelitten hat, wappnet auch ihr euch mit derselben Gesinnung; denn wer im Fleisch gelitten hat, hat mit der Sünde aufgehört.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Im Fleisch“ meint hier das leibliche menschliche Dasein; damit ist nicht ohne Weiteres eine „sündige Natur“ gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „wer im Fleisch gelitten hat, hat mit der Sünde aufgehört“ ist umstritten. Sie kann auf Christus, auf Gläubige in der Nachfolge seines Leidens oder auf einen grundsätzlichen Bruch mit einem sündigen Leben bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Christus
  rationale: Im modernen deutschen Bibelregister ist „Christus“ die natürliche und zugleich titelhaltige Wiedergabe von Χριστός; eine Auflösung zu „Messias“ ist hier nicht nötig.
- source_word: οὖν
  choice: Da nun
  rationale: Bewahrt sowohl den Rückbezug auf den vorherigen Gedankengang als auch die kausale Verbindung mit dem Genitivus absolutus.
- source_word: παθόντος σαρκὶ
  choice: im Fleisch gelitten hat
  rationale: Gibt den Aoristpartizipialausdruck natürlich wieder und bewahrt σάρξ wörtlich als „Fleisch“, hier im Sinn leiblich-menschlicher Existenz.
- source_word: τὴν αὐτὴν ἔννοιαν
  choice: dieselbe Gesinnung
  rationale: „Gesinnung“ bezeichnet eine innere Haltung beziehungsweise entschlossene Denkweise und passt zum würdigen Ermahnungsstil.
- source_word: ὁπλίσασθε
  choice: wappnet euch
  rationale: Bewahrt die militärische Metapher und den reflexiven Sinn des medialen Imperativs in idiomatischem Deutsch.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung der Aufforderung ein, ohne die mögliche argumentative Nuance unnötig zu verengen.
- source_word: ὁ παθὼν σαρκὶ
  choice: wer im Fleisch gelitten hat
  rationale: Das substantivierte Partizip wird als allgemeine Formulierung wiedergegeben; der mögliche Bezug bleibt offen.
- source_word: πέπαυται ἁμαρτίας
  choice: hat mit der Sünde aufgehört
  rationale: Bewahrt den resultativen Sinn des Perfekts und gibt den Genitiv der Trennung idiomatisch wieder; der Singular „Sünde“ bleibt erhalten.
theological_decisions:
- issue: Bezugsgröße und Aussage von ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας
  choice: Die allgemeine, knappe Formulierung „wer im Fleisch gelitten hat, hat mit der Sünde aufgehört“ bleibt stehen.
  alternative: Die Aussage könnte ausschließlich auf Christus, auf leidende Gläubige oder als allgemeiner Grundsatz eines entschiedenen Bruchs mit der Sünde bezogen werden.
  rationale: Der griechische Text legt den Bezug nicht eindeutig fest. Die Übersetzung erklärt daher weder ausdrücklich Christus noch die Gläubigen zum alleinigen Subjekt und löst die theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Metapher „wappnet euch“ sowie die Wiederholung „im Fleisch“ bleiben erhalten. Die Fußnotenmarker stehen unmittelbar nach der umstrittenen Schlussaussage.
