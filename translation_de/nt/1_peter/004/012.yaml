id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: de
  text: Ihr Lieben, wundert euch nicht über die Feuerprobe, die unter euch geschieht, um euch zu prüfen, als widerführe euch etwas Fremdes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „über das Brennen unter euch, das geschieht, um euch zu prüfen“. Das griechische Wort bezeichnet ein Brennen oder eine feurige Glut; das Wort für „Prüfung“ kann je nach Zusammenhang auch „Versuchung“ bedeuten.'
    reason: Lexikalische Alternative; bewahrt das Feuerbild von πυρώσει und die mögliche Bedeutungsbreite von πειρασμός.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ihr Lieben
  rationale: Die substantivierte Anrede gibt den warmen, pastoralen Ton des griechischen Plurals in natürlichem modernem Deutsch wieder und bewahrt den Bezug zum Geliebtsein.
- source_word: μὴ ξενίζεσθε
  choice: wundert euch nicht
  rationale: Die Wendung bezeichnet die Reaktion auf etwas, das fremd oder unerwartet erscheint. Die deutsche Formulierung ist idiomatisch; der Zusammenhang mit ξένου wird durch „etwas Fremdes“ aufgenommen.
- source_word: τῇ ... πυρώσει
  choice: über die Feuerprobe
  rationale: πύρωσις bezeichnet wörtlich ein Brennen beziehungsweise eine feurige Glut und hier bildlich eine schwere Prüfung. „Feuerprobe“ bewahrt sowohl das Feuerbild als auch den Prüfungscharakter.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung hat hier wahrscheinlich gemeinschaftlichen Sinn und bezeichnet das Geschehen inmitten der Adressaten, ohne die persönliche Betroffenheit auszuschließen.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: um euch zu prüfen
  rationale: Im Kontext des Leidens bezeichnet πειρασμός eine Erprobung, nicht primär eine Verführung zur Sünde. Die finale Formulierung gibt πρὸς natürlich wieder.
- source_word: γινομένῃ
  choice: die ... geschieht
  rationale: Das Präsenspartizip bezeichnet die gegenwärtig stattfindende Feuerprobe; „geschieht“ wahrt den laufenden Charakter knapp und würdig.
- source_word: ὡς ξένου ... συμβαίνοντος
  choice: als widerführe euch etwas Fremdes
  rationale: Die Formulierung bewahrt das Wortspiel mit ξενίζεσθε und gibt συμβαίνω als ein den Adressaten widerfahrendes Geschehen präzise wieder.
theological_decisions:
- issue: Bedeutung von πειρασμός im Leidenskontext
  choice: Prüfung beziehungsweise Erprobung
  alternative: Versuchung zur Sünde
  rationale: Der unmittelbare Zusammenhang handelt von einer leidvollen Feuerprobe. Daher steht die Erprobung der Glaubenden im Vordergrund, auch wenn das griechische Wort in anderen Zusammenhängen „Versuchung“ bedeuten kann.
- issue: Deutung des Feuerbildes
  choice: Das Bild als „Feuerprobe“ stehen lassen
  alternative: Ausdrücklich als Läuterung oder göttliches Gericht deuten
  rationale: Der Vers nennt den Prüfungszweck, legt aber nicht ausdrücklich fest, ob das Feuerbild primär Läuterung, Verfolgung oder Gericht bezeichnet. Die Übersetzung vermeidet eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache. „Ihr Lieben“ ist eine natürliche pastorale Anrede; „widerführe“ hebt den gehobenen biblischen Ton leicht an, bleibt aber allgemein verständlich. Die Wiederaufnahme des Fremdheitsmotivs bewahrt das griechische Wortspiel.
