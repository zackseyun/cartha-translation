id: 1PE.4.16
reference: 1 Peter 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: de
  text: Wenn aber jemand als Christ leidet, soll er sich nicht schämen, sondern Gott in diesem Namen verherrlichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dieser Sache“ oder „wegen dieses Namens“. Wörtlicher heißt es im Griechischen „in diesem Namen“; wahrscheinlich ist die Bezeichnung „Christ“ gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn aber
  rationale: Gibt die Bedingung und den milden Gegensatz von δέ natürlich wieder.
- source_word: ὡς Χριστιανός
  choice: als Christ
  rationale: Χριστιανός ist eine feste Bezeichnung. Das geläufige deutsche Wort „Christ“ wahrt diese Benennung klar und verständlich.
- source_word: μὴ αἰσχυνέσθω
  choice: soll er sich nicht schämen
  rationale: Gibt den Imperativ der dritten Person als natürliche deutsche Aufforderung wieder.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: sondern Gott … verherrlichen
  rationale: Der Gegensatz zwischen Scham und der Verherrlichung Gottes wird mit „sondern“ idiomatisch und deutlich ausgedrückt.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: in diesem Namen
  rationale: Bewahrt die konkrete Rede vom „Namen“ und damit den unmittelbaren Bezug zur Bezeichnung „Christ“, ohne mögliche instrumentale oder kausale Nuancen festzulegen.
- source_word: '[im Kontext ergänztes πάσχει]'
  choice: leidet
  rationale: Das Verb ist im griechischen Satz aus dem unmittelbar vorausgehenden Vers sinngemäß zu ergänzen. Im Deutschen ist es nötig, um die Bedingung vollständig und verständlich auszudrücken.
theological_decisions:
- issue: Bezug und Bedeutung von ἐν τῷ ὀνόματι τούτῳ
  choice: „in diesem Namen“, mit wahrscheinlichem Bezug auf die Bezeichnung „Christ“
  alternative: „in dieser Sache“ oder „wegen dieses Namens“
  rationale: ὄνομα bezeichnet gewöhnlich einen Namen oder eine Benennung, und Χριστιανός ist der nächste Bezugspunkt. Die wörtlichere Formulierung bewahrt zugleich die mögliche Bedeutungsbreite der Präposition ἐν.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jemand“ macht das unbestimmte Subjekt natürlich; „soll er“ wahrt den Aufforderungscharakter. Das im Kontext vorausgesetzte „leidet“ wurde für einen vollständigen deutschen Satz ergänzt.
