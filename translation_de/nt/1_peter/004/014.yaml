id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: de
  text: Wenn ihr wegen des Namens des Messias[a] beschimpft werdet, seid ihr selig, denn der Geist der Herrlichkeit und Gottes[b] ruht auf euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch »Christus«; hier als Titel mit »Messias« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »der herrliche Geist Gottes«; oder: »der Geist der Herrlichkeit, das heißt der Geist Gottes«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: beschimpft werdet
  rationale: Das präsentische Passiv bezeichnet fortgesetzte oder wiederholte verbale Schmähung und soziale Herabsetzung. »Beschimpft werden« ist gegenwärtiges, allgemein verständliches Deutsch.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: wegen des Namens des Messias
  rationale: ἐν ὀνόματι bezeichnet hier die Verbindung mit dem Namen beziehungsweise den Anlass der Schmähung. »Wegen des Namens« gibt den gemeinten Grund im Deutschen klarer wieder als das potenziell missverständliche »im Namen«.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat hier erkennbare Titelfunktion. »Messias« bewahrt diese Bedeutung, statt den Titel wie einen bloßen Eigennamen erscheinen zu lassen.
- source_word: μακάριοι
  choice: glücklich zu preisen
  rationale: Die Wendung bewahrt den Charakter einer Seligpreisung und bezeichnet mehr als ein subjektives Glücksgefühl, bleibt aber für heutige Leser verständlich.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: der Geist der Herrlichkeit und Gottes
  rationale: Die bewusst knappe Formulierung erhält die beiden Genitivbestimmungen, ohne festzulegen, ob sie gleichgeordnet sind oder die zweite die erste erläutert.
- source_word: ἀναπαύεται
  choice: ruht auf euch
  rationale: »Ruht auf« gibt sowohl die Grundbedeutung des Verbs als auch den möglichen Anklang an alttestamentliche Aussagen vom Ruhen des Geistes auf einem Menschen wieder.
theological_decisions:
- issue: Deutung von τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: der Geist der Herrlichkeit und Gottes
  alternative: der herrliche Geist Gottes; der Geist der Herrlichkeit, das heißt der Geist Gottes
  rationale: Die griechische Konstruktion lässt offen, ob »der Herrlichkeit« und »Gottes« gleichgeordnete Bestimmungen sind oder ob die zweite die erste näher bestimmt. Der Haupttext löst diese Spannung nicht stillschweigend auf.
- issue: Titelfunktion von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An dieser Stelle bezeichnet Χριστός die messianische Identität, um derentwillen die Angesprochenen beschimpft werden. »Messias« macht die Titelfunktion im Deutschen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Glücklich zu preisen« nimmt den Ton einer Seligpreisung auf, ohne das heute missverständliche alleinstehende »selig« zu verwenden. Die ungewöhnlich knappe Geist-Formulierung bleibt bewusst erhalten und wird durch die Fußnote erläutert.
