  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: de
  text: Vor allem haltet an der tiefen Liebe zueinander fest,[a] denn Liebe deckt eine Menge Sünden zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habt eine anhaltende Liebe zueinander“.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung klingt an Sprüche 10,12 an. „Zudecken“ kann hier auch im Sinn von „über Verfehlungen hinwegsehen“ oder „sie nicht weiter aufrühren“ verstanden werden.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Vor allem
  rationale: Die idiomatische Wendung bezeichnet Vorrang oder höchste Wichtigkeit, nicht in erster Linie eine zeitliche Reihenfolge.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: der Liebe zueinander
  rationale: Das reflexive εἰς ἑαυτούς hat im Gemeinschaftskontext wechselseitigen Sinn; „zueinander“ gibt diese Gegenseitigkeit natürlich wieder.
- source_word: ἐκτενῆ
  choice: innig
  rationale: Das Adjektiv bezeichnet eine intensive, ernsthafte und ausdauernde Haltung. „Innig“ vermittelt die Intensität in natürlichem modernem Deutsch; die mögliche Betonung der Ausdauer wird in der Fußnote genannt.
- source_word: ἔχοντες
  choice: haltet … fest
  rationale: Das Präsenspartizip setzt die vorausgehende Ermahnung fort. Als selbstständiger Vers wird sein auffordernder Sinn durch die finite Form natürlich wiedergegeben; „festhalten“ lässt zudem die fortdauernde Haltung erkennen.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ führt im Deutschen flüssig die Begründung der Ermahnung ein und bewahrt die kausale Funktion.
- source_word: καλύπτει
  choice: deckt … zu
  rationale: Die bildhafte Aussage und der Anklang an Sprüche 10,12 bleiben erhalten, ohne das Zudecken vorschnell als bloßes Übersehen, Verbergen oder als eine bestimmte Lehre über Vergebung auszulegen.
- source_word: πλῆθος ἁμαρτιῶν
  choice: eine Menge Sünden
  rationale: Die Formulierung bewahrt den kollektiven und rhetorisch gewichtigen Sinn von πλῆθος in verständlichem Deutsch.
theological_decisions:
- issue: Bedeutung von „Liebe deckt eine Menge Sünden zu“
  choice: Die Metapher „deckt … zu“ bleibt ohne nähere Festlegung erhalten.
  alternative: „Liebe sieht über viele Verfehlungen hinweg“ oder „Liebe bewirkt die Vergebung vieler Sünden“
  rationale: Die sprichwortartige, auf Sprüche 10,12 anspielende Formulierung legt nicht eindeutig fest, wessen Sünden gemeint sind oder auf welche Weise die Liebe sie „zudeckt“. Die bildhafte Wiedergabe bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderung ist als vollständiger deutscher Satz formuliert, obwohl der griechische Wortlaut mit einem Partizip an den vorherigen Zusammenhang anschließt. Die Metapher des Zudeckens bleibt bewusst stehen.
