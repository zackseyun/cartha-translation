id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: de
  text: Wenn jemand redet, soll er als einer reden, der Gottes Aussprüche weitergibt[a]; wenn jemand dient, soll er es aus der Kraft tun, die Gott schenkt[b], damit in allem Gott durch Jesus, den Messias, verherrlicht wird. Ihm gehören die Herrlichkeit und die Macht für immer und ewig[c][d]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie Aussprüche Gottes“. Die griechische Wendung ist elliptisch; die deutsche Formulierung macht die beim Reden vorausgesetzte Beziehung zu Gottes Aussprüchen verständlich. Gemeint sind göttliche Kundgaben; ob besonders ihr Inhalt, ihre Würde oder ihre maßgebende Funktion im Vordergrund steht, wird nicht ausdrücklich festgelegt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie aus der Kraft, die Gott schenkt“. Das griechische „wie“ steht auch in diesem Satzglied und lässt die Formulierung knapp und vergleichend erscheinen.'
    reason: alternative_reading
  - marker: c
    text: „Ihm“ bezieht sich grammatisch am ehesten auf Jesus, den Messias. Wegen des unmittelbar vorausgehenden Satzes verstehen manche den Lobpreis jedoch als auf Gott den Vater bezogen.
    reason: alternative_reading
  - marker: d
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: redet
  rationale: Das allgemein gehaltene „redet“ entspricht der präsentischen Bedingung und beschränkt die Aussage nicht auf Predigt oder ein kirchliches Amt.
- source_word: λόγια θεοῦ
  choice: Aussprüche Gottes
  rationale: „Aussprüche“ bewahrt den besonderen Sinn göttlicher Kundgaben besser als das allgemeinere „Worte“, ohne das schwerer verständliche Fremdwort „Orakel“ zu verwenden.
- source_word: διακονεῖ
  choice: dient
  rationale: Das Verb bezeichnet hier umfassend einen Dienst und wird nicht auf ein förmliches kirchliches Amt eingeengt.
- source_word: ἐξ ἰσχύος
  choice: aus der Kraft
  rationale: 'Die Präposition ἐξ bezeichnet die Quelle: Die Kraft geht von Gott aus und begleitet den Dienst nicht bloß.'
- source_word: χορηγεῖ
  choice: schenkt
  rationale: „Schenkt“ gibt Gottes freigebiges Bereitstellen der Kraft natürlich wieder; „bereitstellt“ wäre genauer technisch, aber im Deutschen weniger würdig.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die knappe Formulierung bewahrt den umfassenden Geltungsbereich des griechischen Ausdrucks.
- source_word: δοξάζηται
  choice: verherrlicht wird
  rationale: Die passive Form und der Zwecksinn nach ἵνα bleiben erhalten.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά wird instrumental mit „durch“ wiedergegeben; Χριστός bleibt als Titel erkennbar und wird in natürlichem Deutsch appositionell angeschlossen.
- source_word: κράτος
  choice: Macht
  rationale: Im Lobpreis bezeichnet κράτος wirksame, herrscherliche Macht. „Macht“ ist verständlich und lässt diese königliche Nuance im Zusammenhang bestehen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die geläufige deutsche Wendung gibt die unendliche Dauer des griechischen Idioms natürlich wieder.
theological_decisions:
- issue: Bezugswort von ᾧ („ihm“) im abschließenden Lobpreis
  choice: „Ihm“ wird im Haupttext auf das nächststehende Bezugswort Jesus, den Messias, bezogen.
  alternative: Der Lobpreis kann auf Gott den Vater bezogen werden, da unmittelbar zuvor von seiner Verherrlichung die Rede ist.
  rationale: Die grammatische Nähe spricht für Jesus, den Messias; der Satzfluss lässt jedoch auch den Bezug auf Gott zu. Diese echte Auslegungsfrage wird in einer Fußnote offengehalten.
- issue: Funktion von ὡς in den beiden Bedingungssätzen
  choice: Die elliptische griechische Form wird mit „soll er es … tun“ exhortativ entfaltet.
  alternative: 'Wörtlicher, aber im Deutschen abgebrochen: „Wenn jemand redet, wie Aussprüche Gottes; wenn jemand dient, wie aus der Kraft …“'
  rationale: Das Deutsche benötigt für einen vollständigen, natürlichen Satz eine verbale Ergänzung. Die gewählte Form macht den impliziten Aufforderungscharakter sichtbar, ohne die Art des Redens oder Dienens weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Wortschatz. Die parallele Satzstruktur bildet die beiden Bedingungen des griechischen Textes nach. „Aussprüche Gottes“ ist bewusst gehobener als „Worte Gottes“, während „dient“, „Kraft“ und „Macht“ allgemein verständlich bleiben. Die Zeichensetzung trennt den abschließenden Lobpreis, ohne ihn syntaktisch vom vorausgehenden Satz zu lösen.
