review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die finale Zweckkonstruktion εἰς τὸ … βιῶσαι angemessen als „um … zu leben“ wieder. μηκέτι, der Kontrast der parallelen Dative („nach menschlichen Begierden / nach Gottes Willen“), τὸν ἐπίλοιπον … χρόνον und ἐν σαρκί sind in ihrer Funktion und Reichweite zuverlässig erfasst. Die abhängige Satzform ist aufgrund des Anschlusses an Vers 1 sachgerecht.
  naturalness: „Um die noch verbleibende Zeit im Fleisch nicht mehr nach menschlichen Begierden, sondern nach Gottes Willen zu leben“ ist modernes, würdiges Standarddeutsch und als vom vorherigen Vers abhängige Konstruktion gut verständlich. Die Wortstellung bildet die griechische Verbindung von verbleibender Zeit und leiblicher Existenz natürlich ab.
  terminology: „Begierden“ trifft ἐπιθυμίαι im negativen Kontext, ohne es auf sexuelle Wünsche einzuengen. „Gottes Willen“ ist idiomatisch und semantisch präzise. „Im Fleisch“ bewahrt die maßgebliche Formulierung; die Fußnote erläutert zutreffend, dass hier die irdisch-leibliche Existenz und nicht zwingend eine ethisch verstandene „sündige Natur“ gemeint ist. Der Anker steht an einer passenden Stelle.
