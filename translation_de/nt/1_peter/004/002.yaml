id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: de
  text: um die noch verbleibende Zeit im Fleisch nicht mehr nach menschlichen Begierden, sondern nach Gottes Willen zu leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die noch verbleibende Zeit im Leib“. „Im Fleisch“ meint hier das irdische Leben als leiblicher Mensch, nicht notwendigerweise die „sündige Natur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: um … zu
  rationale: Die Präposition mit substantiviertem Infinitiv drückt hier in natürlichem Deutsch Zweck beziehungsweise Folge im Anschluss an den vorigen Vers aus.
- source_word: μηκέτι
  choice: nicht mehr
  rationale: Gibt die Beendigung der früheren Lebensausrichtung präzise und idiomatisch wieder.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: nach menschlichen Begierden
  rationale: Der Genitiv ἀνθρώπων ist allgemein-menschlich, nicht auf Männer beschränkt. ἐπιθυμίαις bezeichnet hier verwerfliche Wünsche beziehungsweise Begierden; „nach“ stellt idiomatisch den Maßstab der Lebensführung dar.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: sondern nach Gottes Willen
  rationale: ἀλλά markiert den scharfen Gegensatz; die parallelen Dative bezeichnen die gegensätzliche Ausrichtung beziehungsweise Norm des Lebens.
- source_word: τὸν ἐπίλοιπον … χρόνον
  choice: die noch verbleibende Zeit
  rationale: Bewahrt die Bedeutung der restlichen Lebenszeit, ohne im Deutschen ein im griechischen Satz nicht ausdrücklich genanntes Possessivpronomen einzufügen.
- source_word: ἐν σαρκὶ
  choice: im Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes; hier ist das leibliche irdische Leben gemeint, nicht ausdrücklich eine „sündige Natur“.
- source_word: βιῶσαι
  choice: zu leben
  rationale: Der Infinitiv bezeichnet das Führen beziehungsweise Verbringen des weiteren Lebens; „zu leben“ ist klar und entspricht der griechischen Konstruktion.
theological_decisions:
- issue: Bedeutung von σάρξ in ἐν σαρκὶ
  choice: leibliches irdisches Leben („im Fleisch“)
  alternative: sündige Natur
  rationale: Im Zusammenhang bezeichnet die Wendung die verbleibende sterbliche Existenz. Die ethische Gegenüberstellung betrifft Begierden und Gottes Willen, macht σάρξ selbst hier aber nicht zu einem Ausdruck für eine innere sündige Natur.
- issue: Verhältnis der Dative ἐπιθυμίαις und θελήματι zum Lebensvollzug
  choice: Norm beziehungsweise Ausrichtung („nach …“)
  alternative: Zweckorientierung („für …“)
  rationale: Beide Dative stehen parallel und kontrastieren die Maßstäbe, an denen das verbleibende Leben ausgerichtet wird. „Nach“ ist dafür im Deutschen natürlicher und lässt die semantische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des Anschlusses von εἰς τὸ an den vorhergehenden Vers bewusst als abhängige Zweckkonstruktion erhalten. „Begierden“ trägt den im Kontext negativen Sinn, ohne ihn auf sexuelle Lust einzuengen.
