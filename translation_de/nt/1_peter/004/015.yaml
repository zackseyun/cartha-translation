id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: de
  text: Denn niemand von euch soll als Mörder oder Dieb oder Übeltäter leiden oder als jemand, der sich in fremde Angelegenheiten einmischt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann wörtlicher mit „jemand, der über fremde Angelegenheiten Aufsicht führt“ wiedergegeben werden. Gemeint ist wahrscheinlich jemand, der sich unbefugt in Dinge einmischt, die ihn nichts angehen.
    reason: lexikalische Alternative und Bedeutungsunsicherheit
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν
  choice: Denn niemand von euch soll
  rationale: „Denn“ wahrt den erklärenden Anschluss von γάρ. Die Verneinung mit dem Imperativ und τις ὑμῶν wird im Deutschen natürlich mit „niemand von euch soll“ wiedergegeben.
- source_word: πασχέτω
  choice: leiden
  rationale: Das Verb bezeichnet allgemein das Erleiden von Leid. Eine Ergänzung wie „bestraft werden“ würde den griechischen Wortlaut unnötig festlegen.
- source_word: φονεὺς ἢ κλέπτης ἢ κακοποιός
  choice: Mörder oder Dieb oder Übeltäter
  rationale: Die drei Bezeichnungen werden direkt und mit ihrer jeweiligen moralischen Tragweite wiedergegeben; „Übeltäter“ bewahrt die Allgemeinheit von κακοποιός besser als das engere „Verbrecher“.
- source_word: ἀλλοτριεπίσκοπος
  choice: jemand, der sich in fremde Angelegenheiten einmischt
  rationale: Das seltene Kompositum bezeichnet im Kontext am ehesten eine Person, die sich unbefugt in Angelegenheiten anderer einmischt. Die Umschreibung ist im modernen Deutsch klar, ohne aus dem Bestandteil -ἐπίσκοπος ein kirchliches Amt abzuleiten.
theological_decisions:
- issue: Bedeutung von ἀλλοτριεπίσκοπος
  choice: jemand, der sich in fremde Angelegenheiten einmischt
  alternative: jemand, der über fremde Angelegenheiten Aufsicht führt
  rationale: Das Wort ist selten und lexikalisch schwierig. Im Zusammenhang einer Aufzählung schuldhaften Verhaltens liegt die negative Bedeutung „sich einmischen“ nahe; die Fußnote hält zugleich die wörtlichere Bildkomponente und die verbleibende Unsicherheit sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am griechischen Verbot, während das seltene Schlusswort zur Verständlichkeit behutsam umschrieben wird.
