id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: de
  text: Und wenn der Gerechte nur mit Mühe gerettet wird,[a] wo wird dann der Gottlose und Sünder erscheinen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nur knapp gerettet wird“ beziehungsweise „nur mit großer Mühe gerettet wird“. Gemeint ist im Zusammenhang die Rettung durch schwere Prüfungen hindurch, nicht notwendigerweise eine an sich ungewisse Rettung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo wird dann der Gottlose und Sünder zu finden sein?“'
    reason: translation_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: der Gerechte
  rationale: Der substantivierte, artikulierte Singular wird als repräsentativer Singular wiedergegeben und bewahrt den knappen, sprichwortartigen Stil.
- source_word: μόλις
  choice: nur mit Mühe
  rationale: Die Wendung gibt die Schwierigkeit beziehungsweise Bedrängnis wieder, die μόλις hier bezeichnet, ohne die Rettung selbst als ungewiss darzustellen.
- source_word: σῴζεται
  choice: gerettet wird
  rationale: Die präsentische Passivform wird in der allgemeinen, sprichwortartigen Aussage idiomatisch wiedergegeben; der Zusammenhang lässt an Rettung durch schwere Prüfung hindurch denken.
- source_word: ἀσεβής
  choice: der Gottlose
  rationale: Die Bezeichnung wahrt die religiös-moralische Bedeutung eines Menschen, der ohne Ehrfurcht vor Gott lebt.
- source_word: ἁμαρτωλός
  choice: Sünder
  rationale: Die geläufige Wiedergabe bleibt von ἀσεβής unterschieden; der gemeinsame deutsche Artikel verbindet beide Bezeichnungen entsprechend der griechischen Konstruktion eng mit derselben Person.
- source_word: ποῦ
  choice: wo
  rationale: Die direkte Wiedergabe erhält die rhetorische Frage.
- source_word: φανεῖται
  choice: wird erscheinen
  rationale: Die formnahe Übersetzung bewahrt die offene und feierliche Ausdrucksweise sowie den Anklang an Sprüche 11,31 in der Septuaginta.
theological_decisions:
- issue: Bedeutung von μόλις σῴζεται
  choice: Die Rettung des Gerechten geschieht nur mit Mühe, im Zusammenhang durch Leiden und Gericht hindurch.
  alternative: Die endgültige Rettung des Gerechten ist knapp oder ungewiss.
  rationale: Der unmittelbare Zusammenhang handelt von Leiden und vom Gericht, das beim Haus Gottes beginnt. Die Übersetzung wahrt die Spannung des Wortlauts, ohne eine Lehre von ungewisser endgültiger Rettung einzutragen.
- issue: Verhältnis von ἀσεβής und ἁμαρτωλός
  choice: „der Gottlose und Sünder“ bezeichnet aufgrund des einmaligen Artikels wahrscheinlich eine Person mit zwei Kennzeichnungen.
  alternative: „der Gottlose und der Sünder“ als zwei getrennt hervorgehobene Gruppen.
  rationale: Im Griechischen steht nur vor ἀσεβής ein Artikel; beide singularischen Bezeichnungen sind durch καί verbunden. Die deutsche Form ohne wiederholten Artikel bildet diese enge Verbindung ab, ohne die alternative Auffassung auszuschließen.
- issue: Repräsentativer maskuliner Singular
  choice: der Gerechte
  alternative: der gerechte Mensch; die Gerechten
  rationale: Der griechische Text verwendet den artikulierten maskulinen Singular mit allgemeiner, repräsentativer Bedeutung. Die Übersetzung erhält Form und sprichwortartige Prägnanz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Satzform. „Nur mit Mühe“ ist heute natürlicher als „kaum“, während die Fußnote die semantische Spannweite offenhält. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
