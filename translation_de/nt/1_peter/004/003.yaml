  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: de
  text: Denn ihr habt in der vergangenen Zeit den Willen der Heiden lange genug erfüllt, indem ihr in Ausschweifungen[a], Begierden, Trunkenheit[b], wilden Gelagen, Trinkgelagen und unerlaubten Formen des Götzendienstes[c] gelebt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zügellosigkeiten«; das griechische Wort bezeichnet schamlose, häufig auch sexuelle Ausschweifung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Trinkexzesse«; gemeint ist übermäßiger Alkoholkonsum bis zur Trunkenheit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »verbotenen Formen des Götzendienstes«; das griechische Adjektiv bezeichnet, was nicht erlaubt ist oder gegen die geltende göttliche Ordnung verstößt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Denn die vergangene Zeit reicht aus
  rationale: Die Formulierung gibt ἀρκετός als »ausreichend/genug« und den bereits verstrichenen Zeitraum als Subjekt wieder; γάρ wird erklärend mit »denn« übersetzt.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: den Willen der Heiden
  rationale: βούλημα bezeichnet Willen, Absicht oder Vorhaben. Im Kontext meint ἔθνη die nichtjüdische, von Götzendienst geprägte Umwelt; »Heiden« ist hier im Deutschen präziser und natürlicher als das geopolitisch missverständliche »Völker«.
- source_word: κατειργάσθαι
  choice: getan habt
  rationale: Das Perfekt des Infinitivs bezeichnet die bereits vollzogene Praxis. »Getan habt« ist natürliches Deutsch und bewahrt den Abschlussbezug, ohne die Bedeutung durch ein zu starkes »vollbracht« zu überhöhen.
- source_word: πεπορευμένους
  choice: Ihr habt … gelebt
  rationale: πορεύομαι wird im ethischen Zusammenhang idiomatisch für Lebensführung gebraucht. Die Auflösung in einen selbstständigen Satz macht den Bezug auf die Leser im Deutschen klar.
- source_word: ἐν ἀσελγείαις
  choice: in Ausschweifungen
  rationale: ἀσέλγεια bezeichnet schamlose Zügellosigkeit, häufig mit sexuellem Einschlag. »Ausschweifungen« wahrt die Breite des Ausdrucks und den griechischen Plural.
- source_word: ἐπιθυμίαις
  choice: Begierden
  rationale: Im Lasterkatalog sind negative, ungeordnete Wünsche gemeint. »Begierden« bewahrt diese Wertung, ohne sie ausschließlich auf Sexualität einzuengen.
- source_word: οἰνοφλυγίαις
  choice: Trunkenheit
  rationale: Das seltene Wort bezeichnet übermäßigen Weingenuss beziehungsweise wiederholte Trunkenheit. Der deutsche Sammelbegriff ist natürlicher als ein künstlicher Plural.
- source_word: κώμοις
  choice: wilden Gelagen
  rationale: κῶμος meint ausgelassenes, oft von Alkohol und sittlicher Enthemmung geprägtes Feiern. »Wilde Gelage« vermittelt diesen Charakter verständlich.
- source_word: πότοις
  choice: Trinkgelagen
  rationale: πότος bezeichnet gesellige Trinkveranstaltungen oder Trinkrunden. »Trinkgelage« unterscheidet diese Anlässe von der Trunkenheit selbst.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: unerlaubten Formen des Götzendienstes
  rationale: ἀθέμιτος bedeutet nicht erlaubt beziehungsweise gegen göttliche und anerkannte Ordnung verstoßend. Die Umschreibung mit »Formen« gibt den griechischen Plural εἰδωλολατρίαις in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν
  choice: Heiden
  alternative: Völker; Nichtjuden
  rationale: Der Zusammenhang beschreibt die frühere, götzendienerische Lebensweise der Adressaten. »Heiden« bringt diesen religiös-kulturellen Kontrast zum Ausdruck; »Völker« wäre im Deutschen zu allgemein, während »Nichtjuden« zwar sachlich möglich, hier aber weniger idiomatisch ist.
- issue: Moralische Aussage von ἀθεμίτοις εἰδωλολατρίαις
  choice: unerlaubte Formen des Götzendienstes
  alternative: frevelhafte oder abscheuliche Formen des Götzendienstes
  rationale: Die Übersetzung bewahrt den objektiven Sinn des Verbotenen beziehungsweise Ordnungswidrigen, ohne die Formulierung zu einer bloßen Gefühlswertung zu steigern.
- issue: Verhältnis von vergangener Zeit und vollzogener Handlung
  choice: Die vergangene Zeit reicht aus, in der ihr … getan habt
  alternative: Lange genug habt ihr … getan
  rationale: Die gewählte Fassung lässt wie im Griechischen die vergangene Zeit grammatisch im Vordergrund und gibt zugleich die durch den Perfektinfinitiv bezeichnete bereits vollzogene Lebensführung wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird nach dem Doppelpunkt in einen klaren Hauptsatz aufgelöst. Die Lasterreihe bleibt vollständig und in ihrer Reihenfolge erhalten; unnatürliche deutsche Plurale werden nur dort geglättet, wo ihr Sinn durch Sammelbegriffe oder eine Umschreibung gewahrt bleibt.
