  source_fidelity: 'Die Lasterliste, ihre Reihenfolge und die wesentlichen Bedeutungen werden zuverlässig wiedergegeben. »Heiden« trifft ἐθνῶν im Kontext, »Begierden«, »wilde Gelage«, »Trinkgelage« und »unerlaubte Formen des Götzendienstes« sind angemessen. Die Konstruktion »die vergangene Zeit reicht aus, in der ihr … getan habt« bildet den griechischen Infinitiv κατειργάσθαι jedoch nicht idiomatisch ab: Der Relativsatz macht die Ausführung des Willens lediglich zu einem Geschehen innerhalb der Zeit, statt die vergangene Zeit als für diese frühere Praxis hinreichend zu bezeichnen.'
