  terminology: »Willen der Heiden« ist kontextgerecht und nicht abwertender als der religionsgeschichtlich etablierte Gebrauch von »Heiden«. »Ausschweifungen« bewahrt die breite, auch sexuell konnotierte Bedeutung von ἀσελγείαις. Die Sammelform »Trunkenheit« ist im Deutschen natürlich, obwohl der griechische Plural wiederholte Exzesse einschließen kann; die Fußnote hält dies sachgerecht fest.
