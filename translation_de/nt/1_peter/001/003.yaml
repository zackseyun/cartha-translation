id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: de
  text: Gepriesen sei der Gott und Vater unseres Herrn Jesus, des Messias[a], der uns nach seinem großen Erbarmen zu einer lebendigen Hoffnung wiedergeboren hat durch die Auferstehung Jesu, des Messias, von den Toten[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus Christus«. Das griechische Χριστός ist hier als Titel »Messias« wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »hat uns neu geboren« oder »hat uns eine neue Geburt geschenkt«. Das griechische Verb bewahrt das Bild des Wiedergeborenwerdens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen sei
  rationale: Die doxologische Wendung wird als natürlicher deutscher Lobpreis wiedergegeben; sie bezeichnet hier nicht lediglich einen Zustand.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: der Gott und Vater
  rationale: Bewahrt beide Bezeichnungen und ihre durch den gemeinsamen Artikel verbundene relationale Aussage.
- source_word: κυρίου
  choice: Herrn
  rationale: Gibt κύριος als Hoheitstitel wieder.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, der Messias
  rationale: Χριστός wird als bedeutungsvoller Titel übersetzt; die deutsche Apposition macht die Verbindung von Name und Titel natürlich verständlich.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: in seinem großen Erbarmen
  rationale: Gibt den Maßstab beziehungsweise Beweggrund des Handelns Gottes idiomatisch wieder, ohne die Aussage auszudehnen.
- source_word: ἀναγεννήσας
  choice: hat er uns … neu geboren
  rationale: Bewahrt Gott als handelndes Subjekt und das Bild einer neuen Geburt. Die Perfektform bezeichnet ein vollzogenes Geschehen mit gegenwärtiger Bedeutung.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: zu einer lebendigen Hoffnung
  rationale: εἰς bezeichnet Ziel oder Ergebnis; „zu“ ist in Verbindung mit „neu geboren“ natürliches Deutsch und erhält die Metapher der lebendigen Hoffnung.
- source_word: δι’ ἀναστάσεως
  choice: durch die Auferstehung
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das die neue Geburt zur Hoffnung geschieht.
- source_word: ἐκ νεκρῶν
  choice: aus den Toten
  rationale: Die relativ formale Wiedergabe bewahrt die plurale griechische Wendung und den Gedanken des Hervorkommens aus dem Bereich der Toten.
theological_decisions:
- issue: Wiedergabe von Χριστός als christologischer Titel
  choice: Messias
  alternative: Christus
  rationale: „Messias“ macht den Titelgehalt von Χριστός sichtbar, statt das Wort nur als namenähnlichen Bestandteil zu behandeln. Die geläufige Form „Christus“ wird in der Fußnote genannt.
- issue: Göttliches Handeln bei ἀναγεννήσας
  choice: hat er uns neu geboren
  alternative: hat er uns eine neue Geburt geschenkt
  rationale: Die gewählte Form lässt Gott ausdrücklich als Handelnden erkennen und erhält zugleich das Geburtsbild, ohne daraus ein weitergehendes konfessionelles Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz ist als eigenständiger Lobpreis gestaltet; der folgende Satz entfaltet dessen Grund. „Erbarmen“ klingt in diesem doxologischen Zusammenhang natürlicher und persönlicher als „Barmherzigkeit“. Die Wiederholung von „Jesus, dem Messias“ bewahrt die vollständige griechische Benennung.
