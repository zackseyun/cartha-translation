revisions:
- from: Gepriesen sei der Gott und Vater unseres Herrn Jesus, des Messias[a]! In seinem großen Erbarmen hat er uns durch die Auferstehung von Jesus, dem Messias, aus den Toten neu geboren[b] zu einer lebendigen Hoffnung.
  to: Gepriesen sei der Gott und Vater unseres Herrn Jesus, des Messias[a], der uns nach seinem großen Erbarmen zu einer lebendigen Hoffnung wiedergeboren hat durch die Auferstehung Jesu, des Messias, von den Toten[b]!
  rationale: Die Revision stellt die doxologische Ein-Satz-Struktur wieder her, ersetzt die im modernen Deutsch schwerfällige Form „hat er uns neu geboren“ durch das etablierte „hat uns wiedergeboren“ und gibt κατά mit „nach“ präziser wieder. Die Reihenfolge der Zielangabe und der durch διά bezeichneten Mittelangabe folgt dem Griechischen. Die Fußnotenanker stehen weiterhin unmittelbar bei den jeweils erläuterten Ausdrücken.
