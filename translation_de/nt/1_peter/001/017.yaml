id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: de
  text: Und wenn ihr den als Vater anruft, der jeden ohne Ansehen der Person nach seinem Werk richtet, dann führt euer Leben während der Zeit, in der ihr als Fremde lebt,[a] in Furcht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während der Zeit eures Aufenthalts in der Fremde“; das griechische Wort bezeichnet das Leben als Fremder oder zeitweiliger Bewohner.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Ehrfurcht“ beziehungsweise „in ehrfürchtiger Scheu“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: als Vater anruft
  rationale: Das Medium bezeichnet hier das Anrufen bzw. Anreden Gottes; zusammen mit dem prädikativen πατέρα gibt „als Vater anruft“ die Konstruktion natürlich wieder.
- source_word: πατέρα
  choice: Vater
  rationale: 'Der artikellose Akkusativ ist prädikativ zu verstehen: Die Glaubenden rufen Gott als Vater an.'
- source_word: ἀπροσωπολήμπτως
  choice: ohne Ansehen der Person
  rationale: Die geläufige deutsche Wendung bezeichnet ein Urteil ohne Bevorzugung aufgrund von Stellung oder äußerem Ansehen.
- source_word: κρίνοντα
  choice: der … richtet
  rationale: Das substantivisch gebrauchte Präsenspartizip beschreibt Gott als den fortwährend bzw. grundsätzlich Richtenden; ein deutscher Relativsatz ist idiomatisch.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: jeden … nach seinem Werk
  rationale: κατά mit Akkusativ bezeichnet den Maßstab. Die Formulierung bewahrt den Singular ἔργον und die persönliche Verantwortlichkeit.
- source_word: ἐν φόβῳ
  choice: in Furcht
  rationale: „Furcht“ bewahrt sowohl den ernsten Klang als auch die mögliche religiöse Nuance von Ehrfurcht, ohne die Spannung vorschnell aufzulösen.
- source_word: παροικίας
  choice: Zeit, in der ihr als Fremde lebt
  rationale: Die Umschreibung gibt das Leben als Fremde bzw. zeitweilige Bewohner in gegenwärtigem, verständlichem Deutsch wieder, ohne einen politischen Exilbegriff festzulegen.
- source_word: ἀναστράφητε
  choice: führt euer Leben
  rationale: Das deponentisch gebrauchte Verb fordert zu einer bestimmten Lebensführung auf; „führt euer Leben“ ist natürlich und behält die ethische Kraft.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: während der Zeit, in der ihr als Fremde lebt
  rationale: Der Akkusativ bezeichnet die Zeitdauer. Die Wiedergabe erhält sowohl den zeitlichen Rahmen als auch das Motiv des Fremdseins.
theological_decisions:
- issue: Bedeutung von φόβος angesichts Gottes als Vater und Richter
  choice: „Furcht“ im Haupttext
  alternative: „Ehrfurcht“ oder „ehrfürchtige Scheu“
  rationale: Die Verbindung von Gottes Vaterschaft mit seinem unparteiischen Richten erzeugt eine echte Spannung. „Furcht“ bewahrt den moralischen Ernst und schließt Ehrfurcht nicht aus.
- issue: Richten nach dem Werk jedes Einzelnen
  choice: Schlichte Wiedergabe „jeden … nach seinem Werk“
  alternative: Ausdrückliche Deutung als Endgericht über die Werke der Gläubigen oder als allgemeiner Grundsatz göttlicher Beurteilung
  rationale: Der griechische Text nennt den Maßstab des Richtens, legt hier aber kein bestimmtes konfessionelles System zu Verdienst, Heilsgewissheit oder Endgericht aus.
- issue: Konditionales εἰ
  choice: „wenn“
  alternative: „da“ oder „wenn denn“
  rationale: „Wenn“ erhält die grammatische Bedingungsform, ohne zu bestreiten, dass der Verfasser das Anrufen Gottes als Vater bei seinen Adressaten voraussetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ohne Ansehen der Person“ ist eine etablierte, weiterhin verständliche Wendung. Das seltenere „Fremdlingschaft“ wurde zugunsten einer natürlichen Umschreibung vermieden; die Fußnote erhält die nominale Alternative. Die Satzstellung setzt „in Furcht“ ans Ende und bewahrt so die Betonung des griechischen Versschlusses.
