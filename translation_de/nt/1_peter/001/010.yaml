source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: de
  text: Was diese Rettung betrifft, so suchten und forschten die Propheten, die über die Gnade für euch weissagten, sorgfältig danach[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Gnade, die zu euch kommen sollte“. Eine zukünftige Ausrichtung wird häufig aus dem Zusammenhang erschlossen, ist in diesem Vers jedoch nicht ausdrücklich gesagt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Was diese Rettung betrifft
  rationale: περί mit Genitiv bezeichnet das Thema; das relative ἧς verweist auf die zuvor genannte Rettung. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Rückbezug.
- source_word: σωτηρίας
  choice: Rettung
  rationale: σωτηρία kann Rettung oder Heil bezeichnen. „Rettung“ ist allgemein verständlich, bewahrt den Vorgangs- und Befreiungsaspekt und passt zum unmittelbaren Kontext.
- source_word: ἐξεζήτησαν καὶ ἐξηραύνησαν
  choice: suchten und forschten sorgfältig danach
  rationale: Die beiden Verben bezeichnen ein ernsthaftes Suchen und gründliches Erforschen. Beide werden wiedergegeben; „sorgfältig“ bringt die verstärkende Bedeutung besonders des zweiten Verbs zum Ausdruck.
- source_word: προφῆται
  choice: die Propheten
  rationale: Die attributive Partizipialgruppe bestimmt die gemeinte Gruppe näher; im Deutschen ist daher der bestimmte Artikel angemessen.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: sie, die von der Gnade weissagten, die euch gilt
  rationale: Die attributive Partizipialgruppe wird als erläuternder Relativsatz wiedergegeben. „Die euch gilt“ drückt die auf die Leser gerichtete beziehungsweise ihnen zugutekommende Bedeutung von εἰς ὑμᾶς aus, ohne eine im Vers nicht ausdrücklich markierte Zukunft hinzuzufügen.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ bewahrt in diesem heilsgeschichtlichen Zusammenhang sowohl Gottes unverdiente Zuwendung als auch den Anschluss an die übliche neutestamentliche Begrifflichkeit.
theological_decisions:
- issue: Ob bei „der Gnade, die euch gilt“ ausdrücklich ein zukünftiges Kommen genannt werden soll
  choice: Keine ausdrückliche Zukunftsangabe im Haupttext
  alternative: der Gnade, die zu euch kommen sollte
  rationale: Der prophetische Zusammenhang legt eine zukünftige Erfüllung nahe, doch der griechische Wortlaut dieses Verses enthält keine ausdrückliche Zukunftsform. Die zeitliche Deutung wird daher nicht in den Haupttext eingefügt, sondern als mögliche Wiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die thematische Voranstellung des griechischen Satzes bleibt erhalten. Der Gedankenstrich macht die nachgestellte nähere Bestimmung der Propheten lesbar, ohne sie von der Aussage zu lösen.
