  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: de
  text: Darum setzt, mit gegürteten Hüften eures Denkens[a] und klaren Sinnes, eure Hoffnung ganz[b] auf die Gnade, die euch bei der Offenbarung von Jesus, dem Messias, gebracht wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier das Bild vom Umgürten der Hüften des Denkens. Gemeint ist: Bereitet euch innerlich auf entschlossenes Handeln vor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vollkommen klaren Sinnes und setzt eure Hoffnung auf die Gnade“. Das griechische Adverb kann entweder zu „klaren Sinnes“ oder zu „setzt eure Hoffnung“ gezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem vorausgehenden Gedankengang.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: gürtet die Hüften eures Denkens
  rationale: Bewahrt das anschauliche Bild vom Hochgürten des Gewandes zur Vorbereitung auf entschlossenes Handeln. Die koordinierte Aufforderung gibt die vorbereitende Funktion des griechischen Partizips in natürlichem Deutsch wieder.
- source_word: νήφοντες
  choice: bleibt klaren Sinnes
  rationale: Das Verb ist hier bildlich gebraucht und bezeichnet geistige Wachheit und Selbstbeherrschung; „klaren Sinnes“ vermeidet eine unnötige Verengung auf Alkoholnüchternheit.
- source_word: τελείως
  choice: ganz
  rationale: Das Adverb bezeichnet Vollständigkeit. Im Haupttext wird es idiomatisch auf das Setzen der Hoffnung bezogen; die mögliche Beziehung zum Klarsein des Sinnes bleibt in einer Fußnote erhalten.
- source_word: ἐλπίσατε ἐπὶ
  choice: setzt eure Hoffnung … auf
  rationale: Gibt den entschiedenen, zielgerichteten Sinn des Aoristimperativs im Deutschen natürlich wieder.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: die Gnade, die euch … gebracht wird
  rationale: Bewahrt sowohl χάρις als „Gnade“ als auch das Bild und die Verlaufsform des präsentischen Passivpartizips φερομένην, obwohl die Gabe auf ihre eschatologische Vollendung zuläuft.
- source_word: ἐν ἀποκαλύψει
  choice: bei der Offenbarung
  rationale: Gibt die hier naheliegende zeitliche Verknüpfung wieder, ohne den Zusammenhang auf einen bloßen Zeitpunkt zu reduzieren.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός bleibt als Titel hörbar; die deutsche Apposition ist idiomatischer als „Jesus Messias“ und bewahrt den Genitivanschluss an „Offenbarung“.
theological_decisions:
- issue: Erhalt des Bildes vom Umgürten der Hüften des Denkens
  choice: Das Bild bleibt im Haupttext erhalten.
  alternative: „Macht euch innerlich zum Handeln bereit“
  rationale: Die ungewöhnliche, körperlich geprägte Metapher gehört zur Ausdruckskraft des griechischen Textes. Eine Fußnote erschließt ihre Bedeutung, ohne sie durch eine bloße Deutung zu ersetzen.
- issue: Syntaktische Zuordnung von τελείως
  choice: „ganz“ wird im Haupttext mit „setzt eure Hoffnung“ verbunden.
  alternative: „seid vollkommen klaren Sinnes“
  rationale: Beides ist grammatisch möglich. Die Stellung beim Imperativ ergibt flüssiges Deutsch und entspricht einer verbreiteten Deutung; die andere Zuordnung wird ausdrücklich in der Fußnote bewahrt.
- issue: Wiedergabe von Χριστοῦ
  choice: „des Messias“
  alternative: „Christi“
  rationale: In diesem eschatologischen Zusammenhang ist der Titelcharakter von Χριστός weiterhin vernehmbar. „Messias“ macht ihn transparent, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das auffällige Ausgangsbild wird bewusst beibehalten und erläutert. „Klaren Sinnes“ ist allgemein verständlich und gibt den bildlichen Sinn von νήφω wieder, ohne eine konkrete Alkoholthematik einzuführen.
