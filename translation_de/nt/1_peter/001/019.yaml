    rationale: Χριστοῦ gehört inhaltlich zu αἵματι. Die deutsche Fassung sollte deutlich machen, dass das kostbare Blut dasjenige des Messias ist und dass dieses Blut mit dem eines Lammes verglichen wird.
  - severity: low
    issue: Die Fußnote nennt „Christus“, obwohl im vorliegenden Genitivzusammenhang die traditionelle Satzform „Christi“ lautet.
    rationale: Die alternative Lesart soll in der konkreten grammatischen Form des Verses angegeben werden.
