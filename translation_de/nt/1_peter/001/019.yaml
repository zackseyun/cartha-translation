  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: de
  text: sondern mit dem kostbaren Blut des Messias[a], das dem Blut eines Lammes ohne Fehler und Makel gleicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christi“. Der griechische Titel Χριστός bedeutet „Messias“; traditionell wird er mit „Christus“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Setzt nach der Verneinung des vorigen Verses den starken deutschen Gegensatz „nicht … sondern …“ natürlich fort.
- source_word: τιμίῳ
  choice: kostbar
  rationale: Bezeichnet hohen Wert und hohe Achtung, ohne den Ausdruck auf einen bloßen Geldwert zu verengen.
- source_word: αἵματι
  choice: Blut
  rationale: Bewahrt das konkrete Bild; die darin liegende Bedeutung des Opfertodes wird nicht erklärend in den Haupttext eingesetzt.
- source_word: ὡς
  choice: wie von
  rationale: Kennzeichnet ausdrücklich den Vergleich und verbindet das Blut idiomatisch mit dem Bild des Lammes.
- source_word: ἀμνοῦ
  choice: Lamm
  rationale: Direkte, geläufige Wiedergabe mit erhaltener Opferbildlichkeit.
- source_word: ἀμώμου
  choice: ohne Fehler
  rationale: Entspricht der Sprache von Opfertieren ohne körperlichen oder kultischen Fehler und vermeidet eine ausschließlich moralische Deutung.
- source_word: καὶ
  choice: und
  rationale: Verbindet die beiden parallelen Beschreibungen schlicht und genau.
- source_word: ἀσπίλου
  choice: ohne Makel
  rationale: Hält die zweite Beschreibung von der ersten unterscheidbar und bewahrt den feierlichen Opferwortschatz.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt den Titel Χριστός in seiner inhaltlichen Bedeutung wieder; die nachgestellte Präzisierung mit Gedankenstrich bewahrt etwas von der griechischen Wortstellung und macht den Bezug eindeutig.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Χριστός bezeichnet hier den messianischen Titel. „Messias“ macht dessen Bedeutung transparent; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
- issue: Bezug des Lammvergleichs
  choice: Das kostbare Blut wird als Blut wie von einem fehler- und makellosen Lamm beschrieben und anschließend als Blut des Messias bestimmt.
  alternative: Der Messias wird unmittelbar mit einem Lamm gleichgesetzt.
  rationale: Das vergleichende ὡς soll nicht in eine uneingeschränkte Gleichsetzung umgewandelt werden. Zugleich bleibt die enge Verbindung zwischen Messias und Opferlamm sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „ohne Fehler und Makel“ ist verständlich und erhält die doppelte kultische Beschreibung. Der Gedankenstrich bildet die nachgestellte Nennung des Messias lesbar nach; der Vers bleibt als Satzteil an den vorausgehenden Kontext anschließbar.
