  verdict: revise
  source_fidelity: Die Vorlage gibt die starke Gegenüberstellung zu V. 18 mit „sondern“ korrekt wieder. Das kostbare Blut ist das Blut des Messias und wird mit dem Blut eines fehler- und makellosen Lammes verglichen. Die vorliegende Umstellung („wie von einem Lamm ... – dem Blut des Messias“) löst jedoch die griechische Zuordnung unnötig auf und lässt den Nachtrag semantisch wie eine nachträgliche Korrektur erscheinen.
  naturalness: Die vorgeschlagene Satzstellung mit Gedankenstrich ist im Deutschen holprig und der Anschluss „– dem Blut des Messias“ ist keine natürliche appositionelle Präzisierung zu „mit kostbarem Blut“. Eine Relativkonstruktion stellt den Vergleich klar und bleibt modernes, würdiges Standarddeutsch.
  terminology: „Messias“ ist für Χριστοῦ als Titel angemessen; die Fußnote kann die traditionelle Wiedergabe mit der im Satz erforderlichen Genitivform „Christi“ nennen. „kostbar“, „Blut“, „Lamm“, „Fehler“ und „Makel“ bewahren sowohl die konkrete als auch die kultische Bildsprache.
  issues:
