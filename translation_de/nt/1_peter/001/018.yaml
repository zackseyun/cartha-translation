id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: de
  text: Denn ihr wisst, dass ihr nicht mit vergänglichen Dingen wie Silber oder Gold aus eurem sinnlosen, von den Vätern überlieferten Lebenswandel losgekauft wurdet[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erlöst wurdet“. Das griechische Verb bezeichnet die Befreiung durch Zahlung eines Lösepreises.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Denn ihr wisst
  rationale: Das Partizip ist adverbial mit dem umgebenden Gedankengang verbunden. Die kausale Wiedergabe ist im modernen Deutsch natürlich und bewahrt die begründende Funktion.
- source_word: ἐλυτρώθητε
  choice: losgekauft wurdet
  rationale: Das Verb bezeichnet Befreiung durch Zahlung eines Lösepreises. „Losgekauft“ lässt dieses Bild im Deutschen klar hervortreten, ohne den Mechanismus näher zu bestimmen.
- source_word: φθαρτοῖς
  choice: mit vergänglichen Dingen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet Dinge, die dem Verfall unterliegen, und bildet den Gegensatz zum folgenden Vers.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: wie Silber oder Gold
  rationale: Silber und Gold erläutern beispielhaft die vergänglichen Dinge; „wie“ gibt diese Beziehung idiomatisch wieder.
- source_word: ἐκ
  choice: aus
  rationale: Bewahrt den Sinn der Trennung beziehungsweise Befreiung aus einem früheren Lebensbereich.
- source_word: ματαίας
  choice: sinnlosen
  rationale: Das Adjektiv bezeichnet Leere, Vergeblichkeit oder Nutzlosigkeit. „Sinnlos“ ist gegenwärtig, verständlich und erfasst die existentielle und moralische Vergeblichkeit.
- source_word: ἀναστροφῆς
  choice: Lebenswandel
  rationale: Der Ausdruck umfasst Verhalten und Lebensführung. „Lebenswandel“ ist prägnant, würdig und im biblischen Kontext gut verständlich.
- source_word: πατροπαραδότου
  choice: von den Vätern überlieferten
  rationale: Die Formulierung bewahrt sowohl den ausdrücklichen Bezug auf die Väter als auch den Gedanken einer tradierten Lebensweise.
theological_decisions:
- issue: Terminologie der Erlösung beziehungsweise des Lösegeldes
  choice: losgekauft
  alternative: erlöst
  rationale: „Losgekauft“ gibt die im Verb enthaltene Lösepreisvorstellung unmittelbar wieder und passt zum Kontrast mit Silber und Gold, ohne eine weitergehende Sühnetheorie in diesen Satzteil einzutragen.
- issue: Wiedergabe der ererbten Überlieferung
  choice: von den Vätern überliefert
  alternative: von den Vorfahren überliefert
  rationale: Die gewählte Fassung erhält die ausdrücklich väterliche Formulierung des Griechischen. Der Kontext kann dabei frühere Generationen insgesamt einschließen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Syntax bleibt eng mit dem griechischen Satz verbunden; „Denn ihr wisst“ macht die adverbiale, begründende Funktion des Partizips natürlich deutlich. Der Vers endet entsprechend der Vorlage mit einem Komma, da der Gedanke in Vers 19 fortgesetzt wird.
