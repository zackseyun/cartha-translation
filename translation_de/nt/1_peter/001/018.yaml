review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: das begründende Partizip εἰδότες, die Verneinung mit dem Mittel der Erlösung, die beispielhaft genannten vergänglichen Werte Silber und Gold, die Befreiung aus der früheren Lebensweise sowie deren Überlieferung von den Vätern. Die fortführende Schlussinterpunktion mit Komma entspricht dem Anschluss an Vers 19.'
  naturalness: „Denn ihr wisst, dass …“ ist modernes, verständliches Standarddeutsch und bildet die begründende Funktion des Partizips idiomatisch ab. Die Verbindung „aus eurem sinnlosen, von den Vätern überlieferten Lebenswandel losgekauft“ ist syntaktisch klar und in einem würdigen biblischen Register natürlich.
  terminology: „Losgekauft“ gibt die Lösegeld-/Freikaufkonnotation von ἐλυτρώθητε angemessen wieder, ohne den Mechanismus dogmatisch auszuarbeiten. „Vergängliche Dinge“, „sinnloser Lebenswandel“ und „von den Vätern überliefert“ sind semantisch tragfähig und bewahren insbesondere die ausdrücklich väterliche Formulierung von πατροπαραδότου. Die Fußnote ist richtig am Ausdruck „losgekauft“ verankert und erläutert die mögliche Wiedergabe „erlöst“ sachgerecht.
