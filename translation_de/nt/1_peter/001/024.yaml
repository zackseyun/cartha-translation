id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: de
  text: Denn alles Fleisch[a] ist wie Gras und all seine Herrlichkeit[b] wie eine Blüte des Grases; das Gras verdorrte, und die Blüte fiel ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Menschheit«. Wörtlich steht im Griechischen »alles Fleisch«; die Wendung greift Jesaja 40,6 auf und betont die Sterblichkeit des Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Pracht« beziehungsweise »Glanz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und wahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: πᾶσα σὰρξ
  choice: alles Fleisch
  rationale: Bewahrt das konkrete Bild und den Anklang an Jesaja 40,6. Gemeint ist hier die vergängliche Menschheit, nicht eine sündige Natur.
- source_word: ὡς χόρτος
  choice: ist wie Gras
  rationale: Gibt den Vergleich klar und idiomatisch wieder.
- source_word: πᾶσα δόξα αὐτῆς
  choice: all seine Herrlichkeit
  rationale: Das Pronomen bezieht sich auf das kollektiv gebrauchte »Fleisch«; »Herrlichkeit« bewahrt die Bedeutungsbreite von δόξα und den biblischen Sprachklang.
- source_word: ὡς ἄνθος χόρτου
  choice: wie eine Blüte des Grases
  rationale: Bewahrt das Genitivbild des griechischen Textes, ohne es zu »Feldblume« umzudeuten.
- source_word: ἐξηράνθη
  choice: verdorrte
  rationale: Bezeichnet idiomatisch das Austrocknen und Verwelken von Gras.
- source_word: ἐξέπεσεν
  choice: fiel ab
  rationale: Gibt anschaulich wieder, dass sich die Blüte löst und herabfällt.
theological_decisions:
- issue: Bedeutung von σάρξ im Zitat über menschliche Vergänglichkeit
  choice: alles Fleisch
  alternative: die ganze Menschheit
  rationale: Der Zusammenhang handelt von Sterblichkeit und Vergänglichkeit, nicht von moralischer Verderbtheit. Die wörtliche Wendung erhält außerdem den Bezug zu Jesaja 40,6.
- issue: Bedeutungsumfang von δόξα
  choice: Herrlichkeit
  alternative: Pracht
  rationale: »Herrlichkeit« lässt sowohl Glanz als auch Ansehen mitschwingen und schränkt den Ausdruck nicht unnötig ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem Schriftzitat-Klang. Das Semikolon erhält den fließenden Zusammenhang des poetischen Zitats.
