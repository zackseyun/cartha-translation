  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: de
  text: sondern wie der, der euch berufen hat, heilig ist, werdet auch ihr in eurem ganzen Lebenswandel heilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seid auch ihr in eurer ganzen Lebensführung heilig“. Das griechische Verb kann das Eintreten in diesen Zustand betonen; das Wort für „Lebenswandel“ bezeichnet die gesamte Art zu leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Markiert den Gegensatz zu den früheren Begierden im vorausgehenden Kontext; nach der verneinten Aufforderung in Vers 14 ist „sondern“ im Deutschen idiomatisch.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: wie der, der euch berufen hat, heilig ist
  rationale: κατά bezeichnet hier Entsprechung. Die Formulierung bewahrt den Berufenden als Bezugspunkt und gibt ἅγιον prädikativ wieder, ohne daraus gegen die griechische Formulierung einen festen Gottesnamen zu machen.
- source_word: καὶ αὐτοὶ
  choice: auch ihr
  rationale: „auch“ gibt καί wieder; das betonte Personalpronomen „ihr“ trägt in der deutschen Wortstellung die Hervorhebung von αὐτοί natürlich mit.
- source_word: ἅγιοι
  choice: heilig
  rationale: Bewahrt die beabsichtigte Wiederholung von ἅγιον und damit die Entsprechung zwischen Gottes Heiligkeit und dem geforderten Leben der Berufenen.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: in eurem ganzen Lebenswandel
  rationale: ἀναστροφή bezeichnet die gesamte Lebensführung. „Lebenswandel“ ist würdig und verständlich und erfasst mehr als einzelne Handlungen; „eurem“ wird sinngemäß aus dem Kontext ergänzt.
- source_word: γενήθητε
  choice: sollt ... sein
  rationale: Der Aoristimperativ von γίνομαι fordert dazu auf, heilig zu werden beziehungsweise sich als heilig zu erweisen. „sollt ... sein“ ist eine natürliche deutsche Aufforderung und vermeidet eine übermäßige Festlegung auf einen Prozess.
theological_decisions:
- issue: Gottes Heiligkeit als Maßstab für die Berufenen
  choice: wie der, der euch berufen hat, heilig ist ... auch ihr ... heilig
  alternative: wie der Heilige, der euch berufen hat ...
  rationale: Die gewählte Fassung macht die Vergleichsbeziehung vollständig und bewahrt die Wiederholung „heilig“, ohne ἅγιον unnötig zu einem substantivischen Titel zu machen.
- issue: Bedeutungsnuance von γενήθητε
  choice: sollt ... heilig sein
  alternative: werdet heilig
  rationale: Die Hauptfassung gibt die Aufforderung in natürlichem Deutsch wieder und bleibt theologisch offen; die Fußnote bewahrt die mögliche ingressive Nuance des griechischen Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lebenswandel“ ist etwas gehobener als „Lebensführung“, bleibt aber allgemein verständlich und entspricht dem umfassenden Sinn von ἀναστροφή. Der Fußnotenmarker steht am Versende, da die Anmerkung zwei eng verbundene lexikalische Alternativen erläutert.
