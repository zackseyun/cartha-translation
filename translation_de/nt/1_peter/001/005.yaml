  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: de
  text: die durch Gottes Macht durch Glauben bewahrt werden für eine Rettung, die bereit ist, in der letzten Zeit offenbart zu werden[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Vertrauen“; hier weniger wahrscheinlich: „durch Treue“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur letzten Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: bewahrt werden
  rationale: Das Präsenspassiv bezeichnet ein fortdauerndes Bewahrtwerden. „Bewahrt“ gibt den schützenden Sinn von φρουρέω natürlich wieder; „unter Bewachung gehalten“ würde den militärischen Beiklang stärker, aber im Deutschen schwerfälliger ausdrücken.
- source_word: ἐν δυνάμει θεοῦ
  choice: durch Gottes Macht
  rationale: ἐν bezeichnet hier beim Passiv das Mittel bzw. die wirksame Kraft. „Durch Gottes Macht“ ist idiomatisch und hält fest, dass das Bewahren von Gott ausgeht.
- source_word: διὰ πίστεως
  choice: mittels des Glaubens
  rationale: διά mit Genitiv bezeichnet das vermittelnde Mittel. „Glaube“ ist hier die naheliegende Wiedergabe von πίστις; „Vertrauen“ ist möglich, „Treue“ im Kontext weniger wahrscheinlich.
- source_word: εἰς σωτηρίαν
  choice: für eine Rettung
  rationale: εἰς bezeichnet Ziel oder Ergebnis. „Für eine Rettung“ bewahrt die Vorwärtsrichtung auf die noch zu offenbarende Rettung; „Rettung“ ist für heutige Leser konkreter und natürlicher als das teils kirchensprachliche „Heil“.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: die bereitliegt, … offenbart zu werden
  rationale: Die Konstruktion aus ἕτοιμος und passivem Infinitiv bezeichnet etwas, das zur Offenbarung bereit ist. „Bereitliegt“ ist im Deutschen natürlich und macht deutlich, dass sich die Bereitschaft auf die Rettung bezieht.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: in der letzten Zeit
  rationale: καιρός bezeichnet eine bestimmte oder entscheidende Zeit. Die Wiedergabe wahrt den endzeitlichen Bezug, ohne ein weitergehendes Endzeitschema einzutragen.
- source_word: τοὺς
  choice: die
  rationale: Der substantivierte Artikel nimmt die Adressaten aus dem vorangehenden Zusammenhang wieder auf. Im fortlaufenden deutschen Satz ist der Relativanschluss „die“ angemessen.
theological_decisions:
- issue: Verhältnis von Gottes Bewahren und menschlichem Glauben in διὰ πίστεως
  choice: Gott bewahrt durch seine Macht, wobei der Glaube als vermittelndes Mittel genannt wird.
  alternative: Gottes Bewahren geschieht unabhängig vom Glauben; oder πίστις bezeichnet hier vorrangig Treue.
  rationale: Die Syntax nennt Gottes Macht im Zusammenhang mit dem passiven Bewahrtwerden und den Glauben als Mittel. Die Übersetzung erhält beide Aussagen, ohne eine konfessionelle Lehre über Beharren oder Abfall einzutragen.
- issue: Zeitliche Ausrichtung der Rettung
  choice: Die Rettung ist hier auf ihre zukünftige Offenbarung in der letzten Zeit ausgerichtet.
  alternative: Die Rettung bezeichnet ausschließlich die gegenwärtige Bekehrung; oder sie hat ausschließlich eine zukünftige Dimension.
  rationale: „Bereit … offenbart zu werden“ weist klar nach vorn, ohne gegenwärtige Aspekte der Rettung, die andernorts genannt werden, zu bestreiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Relativsatz an 1 Petrus 1,4 angeschlossen. „Rettung“ vermeidet unnötige Kirchensprache; „mittels“ unterscheidet den Glauben als vermittelndes Mittel sprachlich von Gottes Macht als wirksamer Kraft.
