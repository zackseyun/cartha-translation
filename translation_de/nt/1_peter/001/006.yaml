id: 1PE.1.6
reference: 1 Peter 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: de
  text: Darüber freut ihr euch, auch wenn ihr jetzt für kurze Zeit – wenn es nötig ist – durch verschiedenartige Prüfungen[a] betrübt worden seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Erprobungen“; das griechische Wort kann in anderen Zusammenhängen auch „Versuchungen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Darüber
  rationale: Das Pronomen weist wahrscheinlich auf den zuvor beschriebenen Gesamtzusammenhang von Heil, Hoffnung und Erbe zurück. „Darüber“ ist im Deutschen natürlich und lässt den genauen Umfang des Rückbezugs offen.
- source_word: ἀγαλλιᾶσθε
  choice: freut ihr euch
  rationale: Das Verb bezeichnet ausgeprägte, jubelnde Freude. „Freut ihr euch“ ist verständlich und würdevoll; die stärkere Alternative „jubelt ihr“ wäre möglich, wirkt hier aber im Deutschen markierter.
- source_word: ὀλίγον ἄρτι
  choice: jetzt für kurze Zeit
  rationale: Die Wiedergabe bewahrt sowohl den Gegenwartsbezug von ἄρτι als auch die zeitliche Begrenzung durch ὀλίγον.
- source_word: εἰ δέον
  choice: wenn es nötig ist
  rationale: Die Formulierung erhält sowohl die Bedingtheit durch εἰ als auch den Gedanken der Notwendigkeit, ohne deren theologischen Grund näher festzulegen.
- source_word: λυπηθέντες
  choice: betrübt worden seid
  rationale: Die Wendung bewahrt die passive Form und das emotionale Gewicht des Partizips. Das Perfekt fügt sich natürlich in die deutsche Satzstruktur ein.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: durch verschiedenartige Prüfungen
  rationale: Im Zusammenhang von Leiden und der Bewährung des Glaubens bezeichnet πειρασμοί vor allem belastende Prüfungen. „Durch“ gibt die Umstände beziehungsweise Ursache der Betrübnis idiomatisch wieder; „verschiedenartig“ bewahrt die Vielfalt von ποικίλοις.
theological_decisions:
- issue: Bedeutung von πειρασμοῖς im Zusammenhang des Leidens
  choice: Prüfungen
  alternative: Erprobungen; Versuchungen
  rationale: Der unmittelbare Kontext spricht von Betrübnis und anschließend von der Bewährung des Glaubens. „Prüfungen“ erfasst äußere Bedrängnisse, ohne den Ausdruck auf die Verlockung zur Sünde zu verengen; die mögliche Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- issue: Notwendigkeit des Leidens in εἰ δέον
  choice: wenn es nötig ist
  alternative: falls es sein muss
  rationale: Die Übersetzung wahrt die konditionale Nuance und bejaht keine weitergehende Aussage darüber, von wem oder aus welchem Grund die Notwendigkeit bestimmt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Gedankenstrich hebt die eingeschobene Bedingung hervor, ohne den Satzfluss zu überladen. Die Spannung zwischen gegenwärtiger Freude und zeitweiliger Betrübnis bleibt erhalten.
