  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: de
  text: 'Denn es steht geschrieben: „Ihr sollt heilig sein[a], denn ich bin heilig.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder unmittelbarer als Aufforderung: „Seid heilig.“ Das Griechische folgt im Schriftzitat der Zukunftsform: „Ihr sollt heilig sein.“'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die schriftgemäße Begründung für die vorausgehende Aufforderung ein und bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die geläufige deutsche Formel zur Einführung eines Schriftzitats gibt den perfektischen Zustand und die fortdauernde Geltung angemessen wieder.
- source_word: ὅτι (erstes Vorkommen)
  choice: durch den Doppelpunkt und die Anführungszeichen wiedergegeben
  rationale: Das erste ὅτι führt das direkte Zitat ein; im Deutschen übernehmen Doppelpunkt und Anführungszeichen diese Funktion natürlicher als ein ausdrückliches „dass“.
- source_word: Ἅγιοι
  choice: heilig
  rationale: Bewahrt den ethischen und auf Gottes Wesen bezogenen Sinn; „abgesondert“ wäre hier zu eng.
- source_word: ἔσεσθε
  choice: sollt sein
  rationale: Gibt die Futurform des Schriftzitats wieder und lässt zugleich ihre gebotsartige Kraft erkennen, ohne sie in einen bloßen Imperativ umzuschreiben.
- source_word: ὅτι (zweites Vorkommen)
  choice: denn
  rationale: Kennzeichnet Gottes eigene Heiligkeit als Grund für die geforderte Heiligkeit und klingt innerhalb des Zitats würdig und natürlich.
- source_word: ἐγὼ
  choice: ich
  rationale: Bewahrt das ausdrücklich gesetzte Pronomen und damit den Nachdruck der göttlichen Selbstaussage.
- source_word: ἅγιος
  choice: heilig
  rationale: Die gleiche Wiedergabe wie im ersten Satzteil macht den begründenden Zusammenhang zwischen Gottes Heiligkeit und der Heiligkeit der Angesprochenen deutlich.
theological_decisions:
- issue: Aussagekraft des Futurs ἔσεσθε im Heiligkeitszitat
  choice: „Ihr sollt heilig sein“
  alternative: „Ihr werdet heilig sein“ oder unmittelbar imperativisch „Seid heilig“
  rationale: Die Formulierung bewahrt sowohl die formale Zukunftsform des griechischen Schriftzitats als auch dessen in biblischer Gesetzes- und Mahnsprache gebotsartige Kraft. So wird die Spannung zwischen Futur und Aufforderung nicht einseitig aufgelöst.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die traditionelle Schriftformel „es steht geschrieben“ bleibt erhalten; „ihr sollt“ vermittelt die zitathafte, gebotsartige Zukunftsform ohne konfessionelle Zusätze.
