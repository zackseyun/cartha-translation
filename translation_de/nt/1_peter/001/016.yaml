  source_fidelity: Der Entwurf gibt διότι zutreffend kausal mit „Denn“ wieder und verwendet für γέγραπται die idiomatische Schriftformel „es steht geschrieben“. Das Zitat bewahrt mit „Ihr sollt heilig sein“ die futurische Form ἔσεσθε und deren gebotsartigen Charakter. Die zweite Begründung mit „denn ich bin heilig“ entspricht dem kausalen ὅτι. Die ausdrückliche erste Person ἐγώ ist angemessen erhalten.
  naturalness: Modernes, klares und zugleich bibelsprachlich angemessenes Standarddeutsch. Satzzeichen und direkte Rede sind natürlich; die Wiederholung von „denn“ ist stilistisch unauffällig und bildet die zweifache Begründungsstruktur verständlich ab.
  terminology: „Heilig“ ist für beide Vorkommen von ἅγιος konsistent und im ethisch-theologischen Kontext treffend. „Es steht geschrieben“ und „Ihr sollt“ wahren einen würdevollen, nicht künstlich altertümlichen Registerton.
