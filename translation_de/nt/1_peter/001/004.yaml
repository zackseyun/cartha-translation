  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: de
  text: zu einem unvergänglichen, unbefleckten und unverwelklichen Erbe, das im Himmel für euch aufbewahrt ist,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: hin zu einem … Erbe
  rationale: εἰς bezeichnet hier das Ziel, auf das die vorausgehende Wiedergeburt ausgerichtet ist; „hin zu“ bewahrt diese Bewegungs- und Zielrichtung. κληρονομία wird sachgemäß mit „Erbe“ wiedergegeben.
- source_word: ἄφθαρτον
  choice: unvergänglich
  rationale: Bezeichnet etwas, das weder Verfall noch Verderben unterliegt.
- source_word: ἀμίαντον
  choice: unbefleckt
  rationale: Bewahrt die kultisch-moralische Bildsprache eines Erbes, das frei von Verunreinigung ist.
- source_word: ἀμάραντον
  choice: unverwelklich
  rationale: Gibt das Bild von etwas wieder, dessen Schönheit oder Herrlichkeit nicht wie eine Blüte verwelkt.
- source_word: τετηρημένην
  choice: das … aufbewahrt ist
  rationale: 'Das Perfektpartizip bezeichnet einen bewirkten und fortbestehenden Zustand: Das Erbe wurde bewahrt und bleibt aufbewahrt.'
- source_word: ἐν οὐρανοῖς
  choice: im Himmel
  rationale: Der griechische Plural kann im Deutschen idiomatisch als kollektiver Singular „im Himmel“ erscheinen, ohne eine kosmologische Präzisierung aufzuzwingen.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: In Verbindung mit τηρέω bezeichnet εἰς die Empfänger beziehungsweise Begünstigten, für die das Erbe bereitgehalten wird.
theological_decisions:
- issue: Verhältnis von Wiedergeburt und Erbe
  choice: Die Zielrichtung mit „hin zu“ ausdrücklich bewahren
  alternative: „zu einem Erbe“
  rationale: Die Formulierung erhält die genuine Kraft von εἰς und legt nicht näher fest, wie die im Kontext genannte Wiedergeburt und der künftige Empfang des Erbes systematisch zueinander stehen.
- issue: Ort der Aufbewahrung
  choice: „im Himmel“
  alternative: „in den Himmeln“
  rationale: Der idiomatische deutsche Singular gibt den Sinn natürlich wieder und vermeidet, aus dem grammatischen Plural eine bestimmte Lehre über mehrere Himmel abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache, klanglich und semantisch gesteigerte Beschreibung des Erbes bleibt parallel erhalten; das Relativpronomen verdeutlicht im Deutschen den Bezug des Partizips auf „Erbe“.
