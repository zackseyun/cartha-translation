  terminology: „Geist des Messias“ entspricht der projektspezifischen Wiedergabe von Χριστός als Titel. Der Plural „Herrlichkeiten“ bewahrt δόξας. „Leiden für den Messias“ hält die Beziehung von εἰς offen; die kontextuell starke Lesart „Leiden des Messias“ bleibt als Fußnote erhalten.
