id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: de
  text: Sie forschten danach, auf wen[a] oder auf welche Zeit der Geist des Messias in ihnen hinwies, indem er die Leiden für den Messias[b] und die danach folgenden Herrlichkeiten im Voraus bezeugte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu welcher oder was für einer Zeit“; dann beziehen sich beide Fragewörter auf „Zeit“.'
    reason: Die syntaktische Zuordnung von τίνα ist umstritten. Der Haupttext gibt die naheliegende personale Lesart wieder, während die rein zeitliche Lesart als echte Alternative erhalten bleibt.
  - marker: b
    text: 'Oder: „die Leiden des Messias“.'
    reason: Die genaue Bedeutung der Verbindung τὰ εἰς Χριστὸν παθήματα ist umstritten; die possessive Wiedergabe ist verbreitet und im Kontext plausibel.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: Sie forschten danach
  rationale: Das Partizip führt die Tätigkeit der Propheten aus dem vorherigen Vers fort. „Forschten“ bewahrt den Sinn sorgfältigen Suchens und klingt im modernen Deutsch natürlich.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: auf welche oder was für eine Zeit
  rationale: 'Beide Fragewörter können sich auf καιρόν beziehen: Gefragt wird nach der bestimmten Zeit oder nach ihrer Art beziehungsweise Beschaffenheit. Die syntaktisch mögliche personale Deutung wird nicht in den Haupttext eingetragen, da sie das im Griechischen nicht ausdrücklich wiederholte Bezugswort stärker ergänzt.'
- source_word: ἐδήλου
  choice: hinwies
  rationale: Das Imperfekt bezeichnet das fortdauernde Anzeigen durch den Geist. „Hinwies“ ist idiomatisch und wahrt den Sinn des Kenntlichmachens.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: der Geist des Messias in ihnen
  rationale: Die Zuordnung des Geistes zum Messias und sein Wirken in den Propheten bleiben unmittelbar erhalten. Χριστός wird hier als Titel mit „Messias“ wiedergegeben.
- source_word: προμαρτυρόμενον
  choice: im Voraus bezeugte
  rationale: Die Wiedergabe erhält sowohl den Zeugnischarakter des Verbs als auch die zeitliche Bedeutung des Präfixes προ-.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: die auf den Messias zukommenden Leiden
  rationale: Die Formulierung bildet die auf den Messias gerichtete beziehungsweise ihn betreffende Bedeutung von εἰς ab, ohne das im Griechischen nicht ausdrücklich stehende „bestimmt“ einzufügen. Die geläufige possessive Deutung steht in der Fußnote.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: die darauf folgenden Herrlichkeiten
  rationale: „Darauf folgend“ gibt die zeitliche Abfolge natürlich wieder; der Plural „Herrlichkeiten“ bleibt als theologisch gewichtige und bewusst offene Form erhalten.
theological_decisions:
- issue: Verhältnis des „Geistes des Messias“ zu den Propheten
  choice: „der Geist des Messias in ihnen“ unverändert direkt wiedergeben
  alternative: „der prophetische Geist, der vom Messias sprach“ oder „der vom Messias gegebene Geist“
  rationale: Der griechische Text bezeichnet den dem Messias zugeordneten Geist als in den Propheten wirkend. Eine erklärende Umschreibung würde diese christologische Aussage abschwächen oder einseitig festlegen.
- issue: Bedeutung von εἰς in τὰ εἰς Χριστὸν παθήματα
  choice: „die auf den Messias zukommenden Leiden“
  alternative: „die Leiden des Messias“ oder „die Leiden in Bezug auf den Messias“
  rationale: Die Hauptfassung wahrt die Richtungs- und Bezugsnuance der Präposition und bezeichnet die Leiden als den Messias treffend. Da die possessive Deutung kontextuell stark und traditionell verbreitet ist, wird sie als echte Alternative in der Fußnote bewahrt.
- issue: Bezug von τίνα in εἰς τίνα ἢ ποῖον καιρόν
  choice: Beide Fragewörter auf καιρόν beziehen
  alternative: „auf wen oder auf welche Zeit“
  rationale: 'Kasus und Wortstellung erlauben, τίνα und ποῖον gemeinsam auf καιρόν zu beziehen: welche Zeit beziehungsweise was für eine Zeit. Eine personale Deutung ist möglich, erfordert aber eine Ergänzung und wird daher nicht bevorzugt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng am griechischen Aufbau, wird aber durch „Sie forschten danach“ als deutscher Satz lesbar. „Herrlichkeiten“ bewahrt bewusst den ungewöhnlichen Plural und vermeidet eine vorschnelle Festlegung auf nur einen Aspekt der späteren Verherrlichung.
