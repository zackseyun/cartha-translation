  to: Sie forschten danach, auf wen[a] oder auf welche Zeit der Geist des Messias in ihnen hinwies, indem er die Leiden für den Messias[b] und die danach folgenden Herrlichkeiten im Voraus bezeugte.
  rationale: Die Revision stellt die personale Lesart von τίνα im Haupttext wieder her und bewahrt die alternative, auf καιρόν bezogene Lesart in einer Fußnote. Sie ersetzt die zu konkretisierende Wendung „auf den Messias zukommenden“ durch die offenere Beziehungsaussage „für den Messias“ und erhält die traditionelle possessive Lesart als Fußnote. Außerdem wird die Funktion des vorausbezeugenden Partizips mit „indem“ präziser angeschlossen.
