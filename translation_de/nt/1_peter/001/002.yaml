id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: de
  text: 'gemäß dem Vorherwissen[a] Gottes, des Vaters, in der Heiligung des Geistes[b], zum Gehorsam und zur Besprengung mit dem Blut[c] Jesu, des Messias[d]: Gnade und Frieden mögen euch in reichem Maß zuteilwerden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vorherwissen“ gibt das griechische πρόγνωσις wieder. Umstritten ist, ob hier Gottes vorausgehendes Wissen, seine vorausgehende Erwählung oder beides im Vordergrund steht.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann die Heiligung durch den Heiligen Geist, sein heiligendes Wirken oder den Bereich der Heiligung bezeichnen; die genaue Funktion des Genitivs bleibt offen.
    reason: grammatical_ambiguity
  - marker: c
    text: Die „Besprengung mit dem Blut“ erinnert wahrscheinlich an alttestamentliche Bilder von Bund und Reinigung, besonders an 2. Mose 24,8.
    reason: cross_reference
  - marker: d
    text: Für „Messias“ ist auch die traditionelle Wiedergabe „Christus“ möglich.
    reason: alternative_rendering
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: gemäß dem Vorherwissen
  rationale: κατά mit Akkusativ bezeichnet hier den Maßstab oder die Übereinstimmung. „Vorherwissen“ gibt πρόγνωσις wieder, ohne die umstrittene Beziehung zwischen vorausgehendem Wissen und Erwählung festzulegen.
- source_word: θεοῦ πατρός
  choice: Gottes, des Vaters
  rationale: Die Apposition wird im Deutschen durch Kommas kenntlich gemacht und identifiziert Gott als den Vater.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: im Heiligungswirken des Geistes
  rationale: Die Formulierung gibt ἁγιασμός als wirksames Heiligen wieder und bewahrt den Bezug auf den Geist. „Im“ lässt die mögliche Bedeutungsspan­ne von Bereich und Mittel erkennen, während „Heiligungswirken“ natürliches Deutsch ermöglicht.
- source_word: εἰς ὑπακοὴν
  choice: zum Gehorsam
  rationale: εἰς bezeichnet Ziel oder Ergebnis; „zum Gehorsam“ bildet diese Zielrichtung knapp und idiomatisch ab.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: und zur Besprengung mit dem Blut
  rationale: ῥαντισμός bedeutet „Besprengung“. Die deutsche Konstruktion mit „mit“ ist natürlich und erhält die kultisch-bundestheologische Bildsprache.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird hier als bedeutungsvoller Titel verstanden. Die Apposition „des Messias“ ist im Deutschen idiomatisch und vermeidet die unnatürliche Verbindung „Jesus Messias“.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Gnade und Frieden mögen euch in reichem Maß zuteilwerden
  rationale: Der griechische Optativ drückt einen Segenswunsch aus. „In reichem Maß zuteilwerden“ gibt πληθυνθείη in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von πρόγνωσις im Verhältnis zur Erwählung
  choice: neutral als „Vorherwissen“ wiedergegeben
  alternative: Vorherbestimmung; vorausgehende Erwählung; bloße Voraussicht
  rationale: Der griechische Ausdruck selbst entscheidet nicht ausdrücklich zwischen diesen theologischen Deutungen; die Übersetzung soll diese Spannung nicht auflösen.
- issue: Referent und Funktion von πνεύματος
  choice: als Heiliger Geist verstanden und „Geist“ großgeschrieben
  alternative: menschlicher Geist oder unpersönliche geistliche Sphäre
  rationale: Die dreigliedrige Struktur mit Gott, dem Vater, dem Geist und Jesus, dem Messias, spricht deutlich für den Heiligen Geist. Die genaue grammatische Funktion des Genitivs bleibt jedoch diskutierbar.
- issue: Funktion von Χριστοῦ
  choice: als Titel „Messias“ wiedergegeben
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin erkennbar titularen Gehalt; „Messias“ macht diesen für heutige Leser transparent.
- issue: Bezug von „Gehorsam“
  choice: im Haupttext nicht durch ein ergänztes Objekt festgelegt
  alternative: Gehorsam gegenüber Jesus dem Messias; Gehorsam gegenüber Gott; Glaubensgehorsam
  rationale: Der griechische Text nennt nach ὑπακοή kein ausdrückliches Objekt. Eine Ergänzung würde eine mögliche Deutung zur Textaussage erheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng an der griechischen Segensformel, wird aber durch idiomatische Wendungen wie „im Heiligungswirken“ und „in reichem Maß zuteilwerden“ lesbar gehalten. Theologisch umstrittene Fragen werden in den Anmerkungen benannt statt im Haupttext entschieden.
