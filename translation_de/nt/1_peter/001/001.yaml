id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: de
  text: Petrus, ein Apostel von Jesus, dem Messias,[a] an die Erwählten, die als Fremde[b] in der Zerstreuung[c] in Pontus, Galatien, Kappadozien, Asia[d] und Bithynien leben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Jesus Christus“. Das griechische Wort Christos bedeutet „Messias“, also „Gesalbter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fremde“ oder „ansässige Fremde“; gemeint sind Menschen, die fern ihrer eigentlichen Heimat leben.'
    reason: lexical_alternative
  - marker: c
    text: „Zerstreuung“ kann sowohl an die jüdische Diaspora als auch allgemeiner an Gottes Volk fern seiner wahren Heimat erinnern.
    reason: cultural_note
  - marker: d
    text: Asia bezeichnet hier die römische Provinz im Westen Kleinasiens, nicht den heutigen Kontinent Asien.
    reason: geographical_note
lexical_decisions:
- source_word: Πέτρος
  choice: Petrus
  rationale: Die im Deutschen eingebürgerte Form des griechischen Personennamens.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Bewahrt die im neutestamentlichen Briefanfang erkennbare Bezeichnung eines bevollmächtigten Gesandten.
- source_word: Ἰησοῦ Χριστοῦ
  choice: von Jesus, dem Messias
  rationale: Gibt den Genitiv natürlich wieder und lässt Χριστός als messianischen Titel erkennen; die Apposition ist im Deutschen idiomatisch.
- source_word: ἐκλεκτοῖς
  choice: an die Erwählten
  rationale: Gibt die göttliche Erwählung knapp wieder, ohne sie im Haupttext durch eine bestimmte konfessionelle Deutung näher festzulegen.
- source_word: παρεπιδήμοις
  choice: die als Fremde ... leben
  rationale: Bezeichnet Menschen, die sich fern ihrer eigentlichen Heimat aufhalten. Die Formulierung ist gegenwärtiges Deutsch und vermeidet das verwaltungssprachliche „ansässige Ausländer“.
- source_word: διασπορᾶς
  choice: in der Zerstreuung
  rationale: Bewahrt den möglichen Anklang an die jüdische Diaspora und zugleich die weiter gefasste Vorstellung eines verstreut lebenden Gottesvolkes.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: in Pontus, Galatien, Kappadozien, Asia und Bithynien
  rationale: Verwendet die im Deutschen üblichen antiken Gebietsnamen; das ergänzte „in“ macht ihre lokale Beziehung verständlich.
theological_decisions:
- issue: Bedeutung von ἐκλεκτοῖς
  choice: Erwählten
  alternative: Auserwählten
  rationale: „Erwählten“ entspricht dem griechischen Adjektiv unmittelbar und bekräftigt die Erwählung, ohne ein ausgearbeitetes Lehrsystem in den Wortlaut einzutragen.
- issue: Verhältnis von παρεπιδήμοις und διασπορᾶς
  choice: Fremde in der Zerstreuung
  alternative: Verbannte der Diaspora
  rationale: Die gewählte Fassung hält offen, ob vor allem die konkrete gesellschaftliche Lage, die jüdische Diaspora oder die geistliche Fremdlingschaft des Gottesvolkes gemeint ist.
- issue: Titelfunktion von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: Die Wiedergabe als Titel macht den messianischen Gehalt von Χριστός sichtbar; eine Fußnote nennt die im Deutschen traditionelle Form.
translation_notes:
  register: Moderner, würdevoller Briefstil. Der eröffnende Satz bleibt wie im Griechischen bis zum folgenden Vers syntaktisch offen. „Als Fremde ... leben“ macht die dichte griechische Anrede im Deutschen verständlich, ohne die Spannung zwischen tatsächlicher und geistlicher Fremdlingschaft aufzulösen.
