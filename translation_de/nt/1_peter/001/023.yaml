  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: de
  text: Denn ihr seid neu geboren, nicht aus vergänglichem Samen, sondern aus unvergänglichem, durch das lebendige und bleibende Wort Gottes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Wort des lebendigen und bleibenden Gottes“. Die griechischen Partizipien „lebendig“ und „bleibend“ können sich entweder auf „Wort“ oder auf „Gott“ beziehen; der Zusammenhang spricht eher für den Bezug auf „Wort“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: ihr seid neu geboren
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Handlung mit fortdauernder Wirkung. Die finite deutsche Form gibt den auf die Adressaten bezogenen Partizipialsatz natürlich wieder; „neu geboren“ bewahrt Bild und Passiv.
- source_word: σπορᾶς
  choice: Samen
  rationale: „Samen“ ist im Zusammenhang von Geburt sowie im Gegensatz von vergänglich und unvergänglich die natürliche metaphorische Entsprechung.
- source_word: φθαρτῆς
  choice: vergänglichem
  rationale: Die moderne, klare Entsprechung bildet zusammen mit „unvergänglich“ den griechischen Gegensatz genau ab.
- source_word: ἀφθάρτου
  choice: unvergänglichem
  rationale: Bewahrt den direkten lexikalischen Gegensatz zu φθαρτῆς und klingt im Deutschen natürlich.
- source_word: διὰ
  choice: durch
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „durch“ ist knapp und idiomatisch.
- source_word: λόγου
  choice: Wort
  rationale: „Wort“ ist eine direkte und kontextuell passende Wiedergabe; „Botschaft“ wäre möglich, aber stärker deutend.
- source_word: ζῶντος
  choice: lebendige
  rationale: Das adjektivisch gebrauchte Partizip wird direkt wiedergegeben und bezieht sich in der Hauptlesart auf „Wort“.
- source_word: θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird am natürlichsten als Zugehörigkeits- beziehungsweise Herkunftsangabe zu „Wort“ verstanden.
- source_word: μένοντος
  choice: bleibende
  rationale: „Bleibend“ wahrt den durativen Sinn und passt zum unmittelbaren Kontext, der die dauerhafte Geltung des Wortes betont.
theological_decisions:
- issue: Bezug von ζῶντος und μένοντος auf „Wort“ oder „Gott“
  choice: 'Beide Partizipien beziehen sich auf „Wort“: „durch das lebendige und bleibende Wort Gottes“.'
  alternative: „durch das Wort des lebendigen und bleibenden Gottes“
  rationale: Kasus und Wortstellung lassen beide Bezüge grammatisch zu. Der Zusammenhang, besonders Vers 25, begünstigt den Bezug auf „Wort“; die echte syntaktische Mehrdeutigkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ macht den begründenden Anschluss des griechischen Partizips an den vorausgehenden Satz verständlich. Die Wiederholung von „Samen“ wird im zweiten Glied idiomatisch ausgespart, ohne den Gegensatz abzuschwächen.
