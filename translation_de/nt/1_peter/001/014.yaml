id: 1PE.1.14
reference: 1 Peter 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: de
  text: Passt euch als Kinder des Gehorsams[a] nicht den Begierden an, die ihr früher in eurer Unwissenheit hattet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorsame Kinder“. Wörtlich steht im Griechischen: „Kinder des Gehorsams“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: Kennzeichnet die Identität beziehungsweise Haltung, in der die Ermahnung befolgt werden soll; „als“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τέκνα ὑπακοῆς
  choice: Kinder des Gehorsams
  rationale: Bewahrt die prägnante Genitivverbindung und ihre identitätsstiftende ethische Aussage. Die geläufigere Formulierung „gehorsame Kinder“ wird in der Fußnote genannt.
- source_word: μὴ συσχηματιζόμενοι
  choice: passt euch nicht … an
  rationale: Gibt das Partizip im ermahnenden Zusammenhang als fortdauerndes Verbot wieder und wahrt die im Kontext vorausgesetzte persönliche Verantwortung.
- source_word: ταῖς … ἐπιθυμίαις
  choice: den Begierden
  rationale: „Begierden“ bezeichnet hier starke, sittlich fehlgeleitete Wünsche, ohne die Bedeutung auf sexuelles Begehren zu verengen.
- source_word: πρότερον
  choice: früher … hattet
  rationale: Gibt den adverbialen Rückblick auf das frühere Leben in natürlichem Deutsch wieder.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: in eurer Unwissenheit
  rationale: Bewahrt die offene theologisch-ethische Aussage über den früheren Zustand, ohne genauer festzulegen, worauf sich die Unwissenheit bezog.
theological_decisions:
- issue: Soll die Genitivverbindung τέκνα ὑπακοῆς geglättet werden?
  choice: Kinder des Gehorsams
  alternative: gehorsame Kinder
  rationale: Die wörtlichere Fassung erhält die Aussage, dass Gehorsam die angesprochenen Menschen kennzeichnet, statt sie lediglich mit einem Adjektiv zu beschreiben. Die idiomatische Alternative bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „Kinder des Gehorsams“ ist bewusst beibehalten; die Satzstellung setzt die Ermahnung an den Anfang und bleibt zugleich natürlich.
