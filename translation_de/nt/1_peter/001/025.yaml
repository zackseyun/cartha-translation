id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: de
  text: „Doch das Wort des Herrn bleibt in Ewigkeit.“ Und das ist das Wort, das euch als gute Nachricht verkündet wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das euch als Evangelium verkündet wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: Wort
  rationale: „Wort“ bewahrt in beiden Satzteilen den unmittelbaren Anklang an Jesaja 40,8 und kann hier sowohl das ausgesprochene Wort als auch die Botschaft bezeichnen.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird natürlich mit „des Herrn“ wiedergegeben; dies wahrt die neutestamentliche Formulierung und den Bezug des Zitats.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ drückt die fortdauernde, unveränderte Geltung klar und in modernem Deutsch aus.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste deutsche Wendung gibt die zeitlich unbegrenzte Dauer würdig und idiomatisch wieder.
- source_word: τοῦτο δέ ἐστιν
  choice: Und das ist
  rationale: δέ kennzeichnet hier einen leichten Übergang von dem Zitat zu seiner Anwendung; „Und“ stellt den Zusammenhang natürlich her.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: das Wort, das als gute Nachricht verkündet wurde
  rationale: Die Formulierung bewahrt den verbalen Sinn von εὐαγγελίζω und macht den Inhalt als gute Nachricht verständlich, ohne ihn auf kirchliche Fachsprache zu reduzieren.
- source_word: εἰς ὑμᾶς
  choice: euch
  rationale: Beim Verb des Verkündigens bezeichnet εἰς mit Akkusativ die Ausrichtung auf die Empfänger; im Deutschen ist „euch verkündet“ die natürliche Form.
theological_decisions:
- issue: Bezug des „Wortes des Herrn“ zwischen dem Jesaja-Zitat und der Anwendung auf die Verkündigung
  choice: Im Zitat bleibt „das Wort des Herrn“ stehen; anschließend wird dieses bleibende Wort mit der den Lesern verkündeten guten Nachricht verbunden.
  alternative: Durchgehend deutender mit „die Botschaft des Herrn“ übersetzen.
  rationale: Die gewählte Fassung erhält sowohl den Schriftklang des Zitats als auch die anschließende evangelistische Anwendung, ohne beides durch eine Paraphrase vorschnell gleichzusetzen.
- issue: Wiedergabe von εὐαγγελισθέν
  choice: „als gute Nachricht verkündet wurde“
  alternative: „als Evangelium gepredigt wurde“
  rationale: Die gewählte Form bringt die verbale Bedeutung und den Charakter der Botschaft transparent zum Ausdruck und vermeidet zugleich unnötige kirchliche Fachsprache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortwiederholung „Wort“ wurde zur Wahrung des Zusammenhangs mit dem vorausgehenden Jesaja-Zitat beibehalten; „gute Nachricht“ erschließt den Sinn von εὐαγγελίζω allgemeinverständlich.
