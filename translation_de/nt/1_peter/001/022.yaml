id: 1PE.1.22
reference: 1 Peter 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: de
  text: Nachdem ihr eure Seelen im Gehorsam gegenüber der Wahrheit zu ungeheuchelter Geschwisterliebe[a] gereinigt habt, liebt einander von Herzen[b] und mit ganzer Hingabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geschwisterliebe“ bezeichnet hier die familiäre Zuneigung unter den Glaubenden, Schwestern wie Brüdern.
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen: „aus reinem Herzen“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: Nachdem ihr … gereinigt habt
  rationale: Das Perfektpartizip bezeichnet eine vollzogene Reinigung mit fortdauernder Bedeutung. Die temporale Nebensatzform gibt die Beziehung zum Hauptimperativ in natürlichem Deutsch wieder, ohne sie ausschließlich als Ursache festzulegen.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: eure Seelen
  rationale: Die direkte Entsprechung bewahrt die Rede von der ganzen Person in ihrem inneren Leben und engt ψυχή nicht vorschnell auf „Leben“ oder „euch selbst“ ein.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: im Gehorsam gegenüber der Wahrheit
  rationale: „Im Gehorsam“ lässt die mögliche Bedeutung von ἐν als Bereich oder Mittel offen; „gegenüber“ bezeichnet idiomatisch, worauf sich der Gehorsam richtet.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: zu ungeheuchelter Geschwisterliebe
  rationale: „Zu“ wahrt die Ziel- oder Ergebnisrichtung von εἰς. „Ungeheuchelt“ bildet ἀνυπόκριτος präzise ab, während „Geschwisterliebe“ die familiäre Bedeutung von φιλαδελφία in heutigem Deutsch ausdrückt.
- source_word: ἐκ καρδίας
  choice: von Herzen
  rationale: Dies entspricht dem SBLGNT-Text ohne das nur in einer Variante bezeugte Adjektiv „rein“.
- source_word: ἀλλήλους ἀγαπήσατε
  choice: liebt einander
  rationale: Der schlichte Imperativ gibt die nachdrückliche Aufforderung natürlich wieder und unterscheidet das Verb ἀγαπάω sprachlich von der vorausgehenden φιλαδελφία.
- source_word: ἐκτενῶς
  choice: mit ganzer Hingabe
  rationale: Die Wendung vermittelt die intensive, ernsthafte und ausdauernde Kraft des Adverbs in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Verhältnis von φιλαδελφία und ἀγαπάω
  choice: φιλαδελφία mit „Geschwisterliebe“, ἀγαπήσατε mit „liebt“ wiedergeben
  alternative: Beide Ausdrücke unterschiedslos mit „Liebe/lieben“ wiedergeben
  rationale: So bleibt die sprachliche Bewegung von familiärer Zuneigung zum umfassenden Liebesgebot erkennbar, ohne daraus einen scharfen theologischen Gegensatz abzuleiten.
- issue: Geschlechtlicher Umfang von φιλαδελφία
  choice: „Geschwisterliebe“ verwenden
  alternative: „Bruderliebe“ oder „Liebe zu den Glaubensgeschwistern“
  rationale: „Geschwisterliebe“ bewahrt das Familienbild und schließt im modernen Deutsch Schwestern wie Brüder eindeutig ein.
- issue: Textvariante bei ἐκ καρδίας
  choice: „von Herzen“ ohne Zusatz übersetzen
  alternative: „aus reinem Herzen“
  rationale: Der vorgegebene SBLGNT-Text enthält kein καθαρᾶς; die abweichende Lesart wird deshalb nur in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den vorausgehenden Reinigungsvorgang und den anschließenden Imperativ; „mit ganzer Hingabe“ vermeidet sowohl das altertümliche „inbrünstig“ als auch das sachlich-technische „intensiv“.
