  source_fidelity: 'Die Übersetzung folgt dem SBLGNT-Text zuverlässig: Das vorzeitige Perfektpartizip ἡγνικότες ist mit „Nachdem ihr … gereinigt habt“ angemessen wiedergegeben; „eure Seelen“, „im Gehorsam gegenüber der Wahrheit“, die Zielrichtung „zu ungeheuchelter Geschwisterliebe“, „von Herzen“ und der Imperativ „liebt einander“ entsprechen dem griechischen Satzbau und Sinn. „Mit ganzer Hingabe“ gibt ἐκτενῶς idiomatisch als intensive, engagierte Liebe wieder, ohne eine fremde theologische Deutung einzutragen.'
