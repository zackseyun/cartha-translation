  text: κομιζόμενοι τὸ τέλος τῆς πίστεως ⸀ὑμῶν σωτηρίαν ψυχῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: de
  text: 'während ihr das Ergebnis eures Glaubens[a] empfangt: die Rettung eurer Seelen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ziel“, „das Ende“ oder „das Resultat eures Glaubens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Rettung eures Lebens“ beziehungsweise „eurer ganzen Person“. Das griechische Wort kann je nach Zusammenhang „Seele“, „Leben“ oder „Person“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: während ihr … empfangt
  rationale: Das präsentische Partizip bezieht sich auf die Angesprochenen im vorausgehenden Zusammenhang. Die Wiedergabe bewahrt den begleitenden, fortdauernden Sinn und bezeichnet das Erlangen dessen, worauf der Glaube hinausläuft.
- source_word: τέλος
  choice: Ergebnis
  rationale: Hier bezeichnet τέλος am ehesten das erreichte Resultat beziehungsweise den Ausgang des Glaubens. „Ende“ könnte rein zeitlich verstanden werden, „Ziel“ stärker die Absicht als das Erlangte betonen.
- source_word: πίστεως
  choice: Glaubens
  rationale: Der Genitiv bezieht sich am natürlichsten auf den Glauben der Angesprochenen. „Glaube“ wahrt zudem die übliche neutestamentliche Begrifflichkeit, ohne die Bedeutung auf Treue oder bloß subjektives Vertrauen einzuengen.
- source_word: ὑμῶν
  choice: eures
  rationale: Das Pronomen bestimmt „Glauben“ und wird unmittelbar als Possessivform der zweiten Person Plural wiedergegeben.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: „Rettung“ gibt σωτηρία verständlich und unmittelbar wieder und lässt sowohl gegenwärtige Erfahrung als auch zukünftige Vollendung offen.
- source_word: ψυχῶν
  choice: Seelen
  rationale: „Seelen“ ist hier die direkte Wiedergabe. Der Ausdruck legt für sich genommen keine ausgearbeitete Trennung von Leib und Seele fest; ψυχή kann je nach Zusammenhang auch Leben oder Person bezeichnen.
theological_decisions:
- issue: Bedeutung von πίστις in „eures Glaubens“
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Im Zusammenhang bezeichnet der Ausdruck am ehesten die glaubende Haltung der Adressaten. Die Übersetzung vermeidet es, den Begriff einseitig als menschliche Treue oder lediglich als inneres Vertrauen auszulegen.
- issue: Bedeutung von ψυχαί in „Rettung eurer Seelen“
  choice: Seelen
  alternative: Leben; Personen
  rationale: Die direkte Formulierung bewahrt die theologische Spannung des griechischen Textes. Sie soll weder eine Rettung des Leibes ausschließen noch eine bestimmte anthropologische Zweiteilung lehren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzanfang bleibt als untergeordnete Fortführung des vorausgehenden Zusammenhangs formuliert; der Doppelpunkt macht deutlich, dass „die Rettung eurer Seelen“ das zuvor genannte Ergebnis näher bestimmt.
