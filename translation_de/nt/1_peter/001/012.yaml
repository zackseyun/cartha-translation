reference: 1 Peter 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: de
  text: Ihnen wurde offenbart, dass sie damit nicht sich selbst, sondern euch dienten[a]. Diese Dinge sind euch jetzt durch diejenigen verkündet worden, die euch durch den Heiligen Geist, der vom Himmel gesandt wurde, die gute Nachricht verkündeten[b] – Dinge, in die Engel sehnsüchtig hineinzublicken wünschen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „dass sie damit nicht für sich selbst, sondern für euch Dienst taten“. Die griechischen Dative bezeichnen, wem ihr Dienst zugutekam.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die euch das Evangelium verkündeten“. Im Griechischen steht das Verb für das Verkünden einer guten Nachricht.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann auch „sich vorbeugen und hineinschauen“ oder „aufmerksam hineinblicken“ bedeuten und beschreibt ein begieriges, genaues Hinschauen.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: Ihnen wurde offenbart
  rationale: Das Dativpronomen bezieht sich auf die zuvor genannten Propheten. Die passive Form bewahrt den Offenbarungscharakter, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά
  choice: dass sie mit diesen Dingen nicht sich selbst, sondern euch dienten
  rationale: Die kontrastierenden Dative bezeichnen die Nutznießer des prophetischen Dienstes. „Dienten“ gibt das imperfektive διηκόνουν schlicht und verständlich wieder.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Diese Dinge sind euch jetzt … verkündet worden
  rationale: Das Passiv bleibt erhalten; „jetzt“ verbindet die damalige prophetische Aussage mit ihrer gegenwärtigen Verkündigung an die Adressaten.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: durch jene … die euch … die gute Nachricht verkündeten
  rationale: Die verbale Bedeutung von εὐαγγελίζω wird in allgemein verständlichem Deutsch wiedergegeben, ohne unnötig einen kirchlichen Fachausdruck einzusetzen.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: im Heiligen Geist, der vom Himmel gesandt wurde
  rationale: „Im Heiligen Geist“ lässt die mögliche instrumentale beziehungsweise sphärische Nuance des Dativs offen. Der Relativsatz ordnet die Partizipialfügung eindeutig dem Heiligen Geist zu.
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: Dinge, in die selbst Engel sehnsüchtig hineinzuschauen wünschen
  rationale: „Hineinzuschauen“ bewahrt sowohl die Präposition εἰς als auch das Bild aufmerksamen, eindringlichen Schauens; „sehnsüchtig … wünschen“ gibt das fortdauernde Verlangen von ἐπιθυμοῦσιν wieder.
theological_decisions:
- issue: Bezug von πνεύματι ἁγίῳ
  choice: Der vom Himmel gesandte Heilige Geist
  alternative: eine heilige geistliche Kraft oder Haltung
  rationale: Der heilsgeschichtliche Zusammenhang und die nähere Bestimmung „vom Himmel gesandt“ sprechen für den persönlichen göttlichen Geist. Die Übersetzung fügt darüber hinaus keine trinitarische Erklärung ein.
- issue: Verhältnis von prophetischem Dienst und gegenwärtiger Verkündigung
  choice: Die Propheten dienten mit ihrer Botschaft den späteren Empfängern der guten Nachricht
  alternative: Die Propheten dienten ausschließlich ihren eigenen Zeitgenossen
  rationale: Der ausdrückliche Gegensatz „nicht sich selbst, sondern euch“ und der anschließende Bezug auf das nun Verkündete werden beibehalten, ohne Prophetie und Evangeliumsverkündigung gleichzusetzen.
- issue: Funktion des Dativs πνεύματι ἁγίῳ
  choice: „im Heiligen Geist“ bewahrt eine instrumentale und eine sphärische Lesart
  alternative: „durch den Heiligen Geist“ legt ausschließlich das Mittel beziehungsweise den Handelnden fest
  rationale: Der griechische Dativ kann hier Mittel oder Wirkungsbereich bezeichnen. Die gewählte Formulierung erhält diese echte syntaktische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Gute Nachricht“ macht die verbale Form von εὐαγγελίζω transparent; „Evangelium“ wird als geläufige Alternative in der Fußnote genannt. Der längere Mittelsatz folgt der Gedankenführung des Griechischen, wird aber durch Relativsatz und Gedankenstrich lesbar gegliedert.
