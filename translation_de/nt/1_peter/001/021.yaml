id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: de
  text: die durch ihn an Gott glauben[a], der ihn von den Toten auferweckt und ihm Herrlichkeit gegeben hat, sodass euer Glaube und eure Hoffnung auf Gott gerichtet sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die durch ihn Gott treu sind“; im Zusammenhang ist wahrscheinlich gemeint, dass sie durch Christus an Gott glauben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „mit dem Ergebnis, dass euer Glaube und eure Hoffnung auf Gott gerichtet sind“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: 'διά mit Genitiv bezeichnet hier die Vermittlung: Durch Christus kommen die Angesprochenen zum Glauben an Gott.'
- source_word: πιστοὺς εἰς θεόν
  choice: an Gott glauben
  rationale: πιστός kann zwar „treu“ bedeuten, doch mit εἰς θεόν liegt hier am ehesten der Sinn „glauben/vertrauen auf Gott“ vor. Die verbale Wiedergabe ist im Deutschen natürlicher als „Gläubige an Gott“.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: der ihn von den Toten auferweckt hat
  rationale: Dies gibt die geläufige neutestamentliche Auferstehungsformel genau und verständlich wieder.
- source_word: δόξαν αὐτῷ δόντα
  choice: und ihm Herrlichkeit gegeben hat
  rationale: Die Formulierung bewahrt das parallele Partizip und die Aussage, dass Gott Christus Herrlichkeit verliehen hat.
- source_word: ὥστε
  choice: sodass
  rationale: „Sodass“ lässt die Ergebnis- beziehungsweise Zwecknuance offen und verbindet Gottes Handeln an Christus mit der Ausrichtung von Glaube und Hoffnung.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν
  choice: euer Glaube und eure Hoffnung auf Gott gerichtet sind
  rationale: Die Wendung macht die Richtung von Glaube und Hoffnung idiomatisch deutlich und bewahrt die erneute Verwendung von εἰς θεόν.
theological_decisions:
- issue: Bedeutung von πιστούς
  choice: Menschen, die durch Christus an Gott glauben
  alternative: „die Treuen“ beziehungsweise „die durch ihn Gott treu sind“
  rationale: Die Verbindung mit εἰς θεόν spricht deutlich für Glauben oder Vertrauen als Bedeutung, ohne die lexikalisch mögliche Bedeutung „treu“ zu verschweigen.
- issue: Christus als Vermittler
  choice: „durch ihn“ bezeichnet Christus als den Vermittler des Glaubens an Gott
  alternative: „seinetwegen“ als lockere kausale Wiedergabe
  rationale: διά mit Genitiv wird am unmittelbarsten als vermittelndes Mittel verstanden; weitergehende dogmatische Formulierungen werden nicht hinzugefügt.
- issue: Kraft des ὥστε-Satzes
  choice: „sodass“
  alternative: „mit dem Ergebnis, dass“
  rationale: Die Übersetzung bewahrt die mögliche Spannung zwischen Folge und Zweck, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verbale Fassung „an Gott glauben“ ist natürlicher als das substantivische „Gläubige an Gott“. „Auf Gott gerichtet“ vermeidet die im Deutschen weniger idiomatische Verbindung „Glaube und Hoffnung sind in Gott“ und erhält zugleich die Richtungsbedeutung von εἰς.
