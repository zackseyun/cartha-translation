source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: de
  text: Obwohl ihr ihn nicht gesehen habt, liebt ihr ihn. Obwohl ihr ihn jetzt nicht seht, glaubt ihr doch an ihn und jubelt mit unaussprechlicher, von Herrlichkeit erfüllter Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „mit unaussprechlicher und verherrlichter Freude“; möglich ist ebenfalls: „mit unaussprechlicher, herrlicher Freude“.'
    reason: Das perfekte passive Partizip δεδοξασμένῃ lässt sich formnah als „verherrlicht“, sinngemäß als „von Herrlichkeit erfüllt“ oder geglättet als „herrlich“ wiedergeben.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: obwohl ihr ihn nicht gesehen habt
  rationale: Der Relativsatz bezieht sich auf Jesus Christus im vorausgehenden Kontext. Das Perfekt gibt die frühere Nichtbegegnung mit gegenwärtiger Bedeutung natürlich wieder.
- source_word: ἀγαπᾶτε
  choice: liebt ihr
  rationale: Das Präsens bezeichnet ihre gegenwärtige Liebe; die Voranstellung von „Ihn“ bewahrt die Verknüpfung mit dem griechischen Relativpronomen.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: glaubt ihr an ihn
  rationale: πιστεύειν εἰς bezeichnet hier den persönlichen Gegenstand des Glaubens. „An ihn glauben“ ist im Deutschen idiomatisch und lexikalisch transparent.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: obwohl ihr ihn jetzt nicht seht
  rationale: „Jetzt“ hält den zeitlichen Gegensatz zwischen gegenwärtigem Nichtsehen und der vorausgesetzten künftigen Schau fest.
- source_word: δὲ
  choice: und
  rationale: Die Partikel verbindet im Kontext das gegenwärtige Glauben mit dem Jubeln; die konzessive Spannung ist bereits durch „obwohl“ ausgedrückt, sodass ein zusätzliches „doch“ nicht nötig ist.
- source_word: ἀγαλλιᾶσθε
  choice: jubelt
  rationale: Das Verb bezeichnet starke, überschwängliche Freude. „Jubeln“ bringt diese Intensität deutlicher zum Ausdruck als das allgemeinere „sich freuen“.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: mit unaussprechlicher ... Freude
  rationale: Der Dativ bezeichnet die Art und Weise; ἀνεκλάλητος meint eine Freude, die sich nicht in Worte fassen lässt.
- source_word: δεδοξασμένῃ
  choice: von Herrlichkeit erfüllter
  rationale: Das perfekte passive Partizip verbindet die Freude mit verliehener beziehungsweise empfangener Herrlichkeit. Die Formulierung bleibt verständlich, ohne die Wendung auf das bloße Adjektiv „herrlich“ zu verengen.
theological_decisions:
- issue: Bedeutung von πιστεύειν εἰς
  choice: an ihn glauben
  alternative: ihm vertrauen
  rationale: Beides ist sachlich möglich. „An ihn glauben“ wahrt die feste Konstruktion mit εἰς und vermeidet, den Glaubensbegriff allein auf Vertrauen einzuengen.
- issue: Wiedergabe von χαρᾷ ... δεδοξασμένῃ
  choice: von Herrlichkeit erfüllter Freude
  alternative: verherrlichter Freude; herrlicher Freude
  rationale: Das griechische perfekte Passiv kann eine mit Herrlichkeit ausgestattete beziehungsweise bereits verherrlichte Freude bezeichnen. Die Hauptfassung erhält den Bezug zur Herrlichkeit und klingt im modernen Deutschen natürlicher als „verherrlichte Freude“, ohne die Formulierung zu einem bloßen Qualitätsadjektiv abzuflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit in zwei konzessive Sätze gegliedert; „jubeln“ wahrt die Intensität von ἀγαλλιᾶσθε. Der Fußnotenmarker steht unmittelbar nach der erklärungsbedürftigen Wendung.
