id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: de
  text: damit sich die Bewährung eures Glaubens[a] — kostbarer als Gold, das vergeht und doch durch Feuer geprüft wird — bei der Offenbarung Jesu, des Messias,[b] zu Lob, Herrlichkeit und Ehre erweist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Prüfung eures Glaubens“. Das griechische Wort kann sowohl den Prüfungsvorgang als auch die dadurch erwiesene Echtheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jesus Christus“. „Messias“ gibt hier die Bedeutung des Titels Χριστός wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „zu Lob, Herrlichkeit und Ehre befunden wird“.'
    reason: literal_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: Bewährung
  rationale: Das Wort bezeichnet hier am ehesten die durch Prüfung erwiesene Echtheit beziehungsweise bewährte Beschaffenheit des Glaubens. „Bewährung“ ist im Deutschen natürlich und hält zugleich die mögliche Betonung des Prüfungsvorgangs offen.
- source_word: πίστεως
  choice: Glaubens
  rationale: Im Kontext geht es um den Glauben der Angesprochenen, der in Anfechtungen geprüft und als echt erwiesen wird.
- source_word: πολυτιμότερον
  choice: kostbarer
  rationale: Die Komparativform bezeichnet einen höheren Wert und passt idiomatisch zum Vergleich mit Gold.
- source_word: χρυσίου
  choice: Gold
  rationale: Direkte Wiedergabe des Vergleichsgegenstands.
- source_word: ἀπολλυμένου
  choice: das vergeht
  rationale: Die verbale Form hebt hervor, dass selbst Gold nicht von Dauer ist.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: obwohl es durch Feuer geprüft wird
  rationale: '„Durch Feuer“ gibt das Mittel der Prüfung wieder; „obwohl“ bringt den konzessiven Zusammenhang natürlich zum Ausdruck: Gold vergeht trotz seiner Feuerprüfung.'
- source_word: εὑρεθῇ εἰς
  choice: sich ... zu ... erweist
  rationale: Diese deutsche Wendung wahrt den Gedanken eines bei der Offenbarung festgestellten Ergebnisses, ohne die passive griechische Konstruktion unnatürlich nachzubilden.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: Lob, Herrlichkeit und Ehre
  rationale: Die dreigliedrige, feierliche Reihung wird vollständig bewahrt; der Text legt nicht ausdrücklich fest, wem diese Größen zukommen.
- source_word: ἐν ἀποκαλύψει
  choice: bei der Offenbarung
  rationale: 'Die Präposition ist hier am natürlichsten temporal zu verstehen: Das Ergebnis tritt bei der Offenbarung Jesu hervor.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Χριστός wird als Titel in seiner Bedeutung „Messias“ wiedergegeben; die Apposition ist im Deutschen idiomatisch und eindeutig.
theological_decisions:
- issue: Bedeutung von τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: „die Bewährung eures Glaubens“ bezeichnet vornehmlich die durch Prüfung erwiesene Echtheit
  alternative: „die Prüfung eures Glaubens“ mit Betonung des Prüfungsvorgangs
  rationale: δοκίμιον kann den Prüfvorgang oder dessen erwiesenes Ergebnis bezeichnen. Der Vergleich mit geprüftem Gold spricht eher für die bewährte Echtheit, doch die Fußnote bewahrt die andere Möglichkeit.
- issue: Bezug von „Lob, Herrlichkeit und Ehre“
  choice: Der Empfänger beziehungsweise Träger bleibt unbestimmt
  alternative: Ehre für die Glaubenden; Lob für Gott oder Christus; umfassende endzeitliche Anerkennung
  rationale: Der griechische Text nennt weder Quelle noch Empfänger ausdrücklich. Die Übersetzung vermeidet daher eine theologische Festlegung.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Die bedeutungstragende Wiedergabe macht den Titel kenntlich; die traditionelle Form „Christus“ wird als mögliche Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die eingeschobene Goldvergleichung übersichtlich ab. „Bewährung“ ist verständlich, theologisch neutral und bewahrt die Spannung zwischen Prüfung und erwiesener Echtheit.
