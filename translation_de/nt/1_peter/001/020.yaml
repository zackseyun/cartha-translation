  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: de
  text: Er war zwar vor Grundlegung der Welt zuvor erkannt[a], wurde aber am Ende der Zeiten um euretwillen offenbart[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zuvor ausersehen“. Im Griechischen steht „zuvor erkannt“; das kann Gottes Vorsatz einschließen, verlangt diese weitergehende Deutung aber nicht im Haupttext.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in diesen letzten Zeiten“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: προεγνωσμένου
  choice: im Voraus erkannt
  rationale: Die Wiedergabe bewahrt den Grundsinn von προγινώσκω und lässt offen, inwiefern Gottes Vorherwissen zugleich seinen Vorsatz einschließt. Das Partizip bezieht sich auf Christus aus Vers 19.
- source_word: πρὸ καταβολῆς κόσμου
  choice: vor Grundlegung der Welt
  rationale: Die traditionelle biblische Wendung gibt die griechische Zeitangabe knapp und präzise wieder und bezeichnet eine Wirklichkeit vor der Schöpfung.
- source_word: φανερωθέντος
  choice: wurde offenbart
  rationale: Das Passiv bezeichnet, dass Christus sichtbar gemacht beziehungsweise öffentlich bekannt wurde. „Offenbart“ ist im Deutschen verständlich und bewahrt den theologischen Gehalt.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: am Ende der Zeiten
  rationale: Diese Formulierung hält sich eng an die eschatologische Zeitangabe, ohne das im Griechischen nicht ausdrücklich vorhandene Demonstrativ „diesen“ einzufügen.
- source_word: δι’ ὑμᾶς
  choice: um euretwillen
  rationale: διά mit Akkusativ bezeichnet hier den Bezug auf den Nutzen beziehungsweise das Heil der Angesprochenen; „um euretwillen“ bringt dies prägnant zum Ausdruck.
theological_decisions:
- issue: Bedeutung von προεγνωσμένου in Bezug auf Christus vor der Schöpfung
  choice: Die Hauptübersetzung lautet „im Voraus erkannt“.
  alternative: „im Voraus ausersehen“ oder „vorherbestimmt“
  rationale: Der griechische Ausdruck kann im biblischen Zusammenhang Gottes Vorsatz einschließen, zwingt aber nicht dazu, Vorherwissen ausdrücklich als Erwählung oder Vorherbestimmung auszulegen. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Zeitliche Bedeutung von ἐπ’ ἐσχάτου τῶν χρόνων
  choice: Die Hauptübersetzung lautet „am Ende der Zeiten“.
  alternative: „in der letzten Zeit“ oder „in diesen letzten Zeiten“
  rationale: Die gewählte Fassung folgt der griechischen Formulierung eng und bewahrt ihren endzeitlichen Charakter. Die Alternative mit „diesen“ ist idiomatisch, enthält jedoch einen im griechischen Text nicht ausdrücklich gesetzten Zeigewortbezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Grundlegung der Welt“ und „offenbart“ bewahren vertraute biblische Ausdrucksweise, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Das korrelative μὲν … δὲ wird mit „zwar … aber“ sichtbar gemacht.
