  source_fidelity: Der Satz gibt die beiden auf Christus (V. 19) bezogenen Partizipien und den Kontrast μὲν … δὲ zutreffend wieder. „im Voraus erkannt“ ist jedoch im Deutschen semantisch weniger präzise und stilistisch schwerer als „zuvor erkannt“; letzteres gibt προεγνωσμένου transparent wieder, ohne die Deutung „ausersehen“ in den Haupttext einzutragen. Die Fußnotenalternative „in der letzten Zeit“ verengt den Plural τῶν χρόνων unnötig.
  naturalness: „zuvor erkannt“ ist modernes, verständliches Standarddeutsch und klingt in diesem biblisch-würdigen Register natürlicher als „schon … im Voraus erkannt“. Der korrelative Satzbau mit „zwar … aber“ ist gelungen.
  terminology: „vor Grundlegung der Welt“, „offenbart“ und „um euretwillen“ sind passende, etablierte und verständliche Wiedergaben. „zuvor erkannt“ wahrt bei προεγνωσμένου die Offenheit gegenüber stärker zweck- oder erwählungsbezogenen Deutungen. Die Alternative zu ἐπ’ ἐσχάτου τῶν χρόνων sollte den Plural der Zeiten beibehalten.
