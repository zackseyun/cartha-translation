translation:
  language: de
  text: indem ihr eure ganze Sorge[a] auf ihn[b][c] werft, denn er sorgt für euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all eure Sorgen“ beziehungsweise „eure ganze Besorgnis“; gemeint ist belastende, ängstliche Sorge.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch steht hier ein Aoristpartizip, wörtlich etwa: „auf ihn geworfen habend“. Es ist an die Aufforderung in Vers 6 angeschlossen.'
    reason: lexical_alternative
  - marker: c
    text: Mit „ihn“ ist nach dem unmittelbaren Zusammenhang Gott gemeint; siehe Vers 6.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: eure ganze Sorge
  rationale: Der Singular mit πᾶσαν bezeichnet die Gesamtheit dessen, was die Angesprochenen bedrückt. „Eure ganze Sorge“ ist im Deutschen natürlich, bewahrt die umfassende Aussage und lässt sowohl innere Besorgnis als auch konkrete Sorgen anklingen.
- source_word: ἐπιρίψαντες
  choice: indem ihr … werft
  rationale: Das Aoristpartizip ist syntaktisch an die Aufforderung des vorigen Verses gebunden. „Indem ihr“ macht diese Verbindung sichtbar; „auf ihn werft“ bewahrt das kräftige Bild der Übertragung einer Last.
- source_word: ἐπ’ αὐτόν
  choice: auf ihn
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung auf jemanden hin. Die pronominale Form bleibt erhalten, ohne den im Kontext eindeutigen Bezug im Haupttext auszuschreiben.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund für das vorausgehende Handeln an. „Denn“ klingt in diesem kurzen Zuspruch natürlich und würdig.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: er sorgt für euch
  rationale: Die Wendung bezeichnet persönliche Anteilnahme und fürsorgliches Interesse. „Er sorgt für euch“ ist idiomatisches modernes Deutsch und erhält die pastorale Kraft der Aussage.
theological_decisions:
- issue: Bezugswort von αὐτόν und αὐτῷ
  choice: „ihn/er“ bezieht sich auf Gott
  alternative: allgemeiner Bezug auf den Herrn
  rationale: Der unmittelbare Kontext nennt in Vers 6 die mächtige Hand Gottes. Die Pronomen im Haupttext bewahren dennoch die Ausdrucksweise des Griechischen.
- issue: Verhältnis des Partizips zur Aufforderung in Vers 6
  choice: 'instrumental beziehungsweise begleitend: Demütigung zeigt sich darin, die Sorge auf Gott zu werfen'
  alternative: 'selbstständige imperative Aufforderung: „Werft …“'
  rationale: ἐπιρίψαντες ist formal ein Partizip und hängt von der vorausgehenden Aufforderung ab. „Indem ihr“ erhält diese syntaktische und theologische Verbindung, ohne sie enger festzulegen als nötig.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das vertraute biblische Bild „Sorge auf ihn werfen“ bleibt erhalten. Die partizipiale Anbindung an Vers 6 wird ausdrücklich wiedergegeben; der Vers beginnt deshalb kleingeschrieben als Fortsetzung des Satzes.
