id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: de
  text: 'Die Ältesten unter euch ermahne ich nun als Mitältester und Zeuge der Leiden des Messias[a] und als einer, der auch Anteil hat[b] an der Herrlichkeit, die künftig offenbart werden wird:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »Christus« beziehungsweise »der Leiden Christi«. Das griechische Χριστός bedeutet »Messias« oder »Gesalbter«.'
    reason: Alternative Wiedergabe des christologischen Titels.
  - marker: b
    text: 'Oder: »und auch als Teilhaber an der Herrlichkeit«.'
    reason: Lexikalische Alternative für κοινωνός.
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: die Ältesten
  rationale: Im gemeindlichen Zusammenhang bezeichnet das Wort verantwortliche Leiter, nicht lediglich ältere Männer. »Älteste« ist im Deutschen verständlich und vermeidet spätere konfessionelle Amtsbezeichnungen.
- source_word: οὖν
  choice: nun
  rationale: Das Wort kennzeichnet den Übergang von den vorausgehenden Ausführungen zur anschließenden Ermahnung. »Nun« gibt diesen folgernden und weiterführenden Zusammenhang natürlich wieder.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Dies ist die natürliche deutsche Wiedergabe für die Zugehörigkeit der Ältesten zur angesprochenen Gemeinschaft.
- source_word: παρακαλῶ
  choice: ermahne ich
  rationale: Hier geht es um einen eindringlichen seelsorgerlichen Aufruf. »Ermahnen« bewahrt dessen Ernst, ohne daraus einen Befehl zu machen.
- source_word: συμπρεσβύτερος
  choice: Mitältester
  rationale: Die Zusammensetzung bezeichnet jemanden, der denselben Ältestendienst teilt. »Mitältester« erhält diese kollegiale Selbsteinordnung knapp und genau.
- source_word: μάρτυς
  choice: Zeuge
  rationale: Gemeint ist jemand, der von den Leiden des Messias Zeugnis gibt; die spätere Bedeutung »Märtyrer« sollte hier nicht eingetragen werden.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: der Leiden des Messias
  rationale: Der Genitiv bezeichnet am natürlichsten die Leiden, die der Messias erlitt. Die knappe deutsche Fügung bewahrt zugleich die Struktur des Griechischen.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist hier als Titel des Gesalbten verständlich. »Messias« macht die Titelbedeutung sichtbar; die traditionelle Wiedergabe »Christus« bleibt in einer Fußnote erhalten.
- source_word: κοινωνός
  choice: einer, der auch Anteil hat
  rationale: κοινωνός bezeichnet jemanden, der an etwas teilhat. Die verbale Formulierung klingt im heutigen Deutsch natürlicher als »Teilhaber« und bewahrt den Gedanken wirklicher Beteiligung.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: an der Herrlichkeit, die bald offenbart werden wird
  rationale: Die Formulierung erhält das passive »offenbart werden« und gibt die auf eine bevorstehende Offenbarung gerichtete Erwartung von μέλλω verständlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als christologischer Titel
  choice: des Messias
  alternative: des Christus / von Christus
  rationale: Der Titelcharakter ist in diesem Zusammenhang noch erkennbar. »Messias« gibt den Sinn von Χριστός wieder, ohne den Ausdruck bloß wie einen Eigennamen zu behandeln; die traditionelle Form wird als Alternative genannt.
- issue: Zeitliche Aussage von μελλούσης ἀποκαλύπτεσθαι
  choice: die bald offenbart werden wird
  alternative: die künftig offenbart werden wird / die offenbart werden soll
  rationale: »Bald« bewahrt die Erwartungsnähe der griechischen Konstruktion, ohne einen genauen Zeitpunkt festzulegen. Das Passiv bleibt erhalten, sodass nicht ausdrücklich bestimmt wird, wer die Herrlichkeit offenbart.
- issue: Art der Teilhabe an der kommenden Herrlichkeit
  choice: einer, der auch Anteil hat
  alternative: auch Teilhaber
  rationale: Die Aussage beansprucht wirkliche Teilhabe, erläutert aber weder deren genaue Art noch ihren zeitlichen Vollzug. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorangestellte Gegenstand »Die Ältesten unter euch« bewahrt die Hervorhebung des griechischen Satzes; der Doppelpunkt hält den Satz für die folgende Aufforderung in Vers 2 offen. Fachsprachliche oder konfessionell geprägte Amtsbezeichnungen werden vermieden.
