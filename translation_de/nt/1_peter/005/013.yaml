id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: de
  text: Die mit euch Erwählte[a] in Babylon[b] grüßt euch, ebenso Markus, mein Sohn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker deutend: „Die Gemeinde in Babylon, die mit euch erwählt ist“. Im Griechischen steht ein femininer Ausdruck im Singular; das dazugehörige Substantiv bleibt unausgesprochen.'
    reason: alternative_reading
  - marker: b
    text: „Babylon“ kann im frühchristlichen Sprachgebrauch symbolisch für Rom stehen; im Text selbst steht „Babylon“.
    reason: cultural_note
  - marker: c
    text: „Mein Sohn“ bezeichnet hier wahrscheinlich eine geistliche und keine leibliche Beziehung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: grüßt
  rationale: Das Verb bezeichnet hier den brieflichen Gruß. „Grüßt“ ist knapp, natürlich und gibt die Aussage ohne unnötige Erweiterung wieder.
- source_word: ἡ ... συνεκλεκτὴ
  choice: die mit euch Erwählte
  rationale: Der griechische Ausdruck ist feminin singular und lässt das Bezugswort unausgesprochen. Die substantivierte deutsche Form bewahrt sowohl das Femininum als auch die Ellipse; die mögliche Ergänzung „Gemeinde“ wird nicht in den Haupttext eingefügt.
- source_word: ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Der Ortsname wird so wiedergegeben, wie er im griechischen Text steht. Eine mögliche symbolische Deutung als Rom gehört in die Fußnote.
- source_word: συνεκλεκτὴ
  choice: mit euch Erwählte
  rationale: Die Form bezeichnet jemanden, der zusammen mit anderen erwählt ist. „Mit euch Erwählte“ gibt diesen gemeinschaftlichen Bezug in natürlichem Deutsch wieder.
- source_word: Μᾶρκος
  choice: Markus
  rationale: „Markus“ ist die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: ὁ υἱός μου
  choice: mein Sohn
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten. Ob eine geistliche statt einer leiblichen Beziehung gemeint ist, wird nicht in den Haupttext hineingedeutet.
theological_decisions:
- issue: Identität der mit erwählten femininen Person oder Größe
  choice: 'Der feminine Bezug bleibt im Haupttext unausgesprochen: „die mit euch Erwählte“.'
  alternative: „Die Gemeinde in Babylon, die mit euch erwählt ist“ oder eine bestimmte christliche Frau.
  rationale: Der griechische Text enthält einen femininen Artikel und ein feminines Adjektiv im Singular, aber kein ausdrückliches Substantiv. Die Übersetzung bewahrt diese echte Mehrdeutigkeit; die verbreitete Ergänzung „Gemeinde“ erscheint nur als mögliche Deutung in der Fußnote.
- issue: Bedeutung von Babylon
  choice: „Babylon“ bleibt im Haupttext stehen.
  alternative: Eine symbolische Bezeichnung für Rom oder das tatsächliche mesopotamische Babylon.
  rationale: Der Ausgangstext nennt ausdrücklich Babylon. Da die historische beziehungsweise symbolische Zuordnung umstritten ist, wird sie nicht im Haupttext entschieden.
- issue: Bedeutung von „mein Sohn“ für Markus
  choice: Die familiäre Wendung wird wörtlich als „mein Sohn“ wiedergegeben.
  alternative: „mein geistlicher Sohn“ oder „mein lieber Sohn“.
  rationale: Wahrscheinlich ist eine geistliche Beziehung gemeint, doch der griechische Wortlaut kennzeichnet sie nicht ausdrücklich als solche. Daher bleibt die nähere Deutung der Fußnote beziehungsweise der Auslegung vorbehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die substantivierte feminine Form „die ... Erwählte“ bildet die ungewöhnliche griechische Ellipse bewusst ab, ohne vorschnell „Gemeinde“ einzusetzen. Die Satzstellung bleibt gut verständlich und bewahrt den knappen brieflichen Grußstil.
