source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: de
  text: 'Durch Silvanus, den treuen Bruder, wie ich meine, habe ich euch mit wenigen Worten geschrieben[a], indem ich euch ermahnte und nachdrücklich bezeugte: Dies ist die wahre Gnade Gottes. Steht fest in ihr![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch Silvanus … habe ich euch kurz geschrieben.“'
    reason: Die Präpositionalfügung „durch Silvanus“ kann unmittelbar mit „habe ich geschrieben“ verbunden werden; „mit wenigen Worten“ bedeutet idiomatisch „kurz“.
  - marker: b
    text: 'Einige Handschriften lesen: „in der ihr steht“ statt: „Steht fest in ihr!“'
    reason: Textvariante zwischen einer indikativischen Aussage und dem Imperativ des zugrunde gelegten kritischen Textes.
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Durch Silvanus
  rationale: διά mit Genitiv bezeichnet hier am wahrscheinlichsten Vermittlung oder Mitwirkung. „Durch Silvanus“ wahrt offen, ob er Überbringer, Schreiber oder anderweitiger Mittler des Briefes war.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: den treuen Bruder
  rationale: πιστός kann „treu“ oder „zuverlässig“ bedeuten. „Treuer Bruder“ ist eine natürliche persönliche Empfehlung und bezeichnet hier einen bestimmten männlichen Mitarbeiter.
- source_word: ὡς λογίζομαι
  choice: wie ich meine
  rationale: Die Wendung gibt die persönliche Einschätzung des Verfassers wieder, ohne Zweifel an Silvanus’ Treue zu unterstellen.
- source_word: δι’ ὀλίγων ἔγραψα
  choice: habe ich euch mit wenigen Worten geschrieben
  rationale: Die idiomatische Wendung bezeichnet ein kurzes Schreiben. Die relativ formnahe Wiedergabe erhält zugleich die mögliche syntaktische Verbindung mit διά und begründet die Fußnote zur alternativen Zuordnung.
- source_word: παρακαλῶν
  choice: Dabei habe ich euch ermahnt
  rationale: παρακαλέω umfasst ermahnen, ermutigen und auffordern. „Ermahnt“ bewahrt hier den nachdrücklichen, paränetischen Charakter.
- source_word: ἐπιμαρτυρῶν
  choice: eindringlich bezeugt
  rationale: Das Verb bezeichnet ein nachdrückliches bestätigendes Zeugnis; „eindringlich“ gibt die verstärkende Vorsilbe ἐπι- wieder.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: Dies ist die wahre Gnade Gottes
  rationale: Die Formulierung lässt den Bezugsumfang von „dies“ offen und bewahrt die direkte Aussage über die Echtheit der Gnade Gottes.
- source_word: εἰς ἣν στῆτε
  choice: Steht fest in ihr!
  rationale: Der Imperativ στῆτε fordert zu entschlossener Standhaftigkeit auf. Das feminine Pronomen bezieht sich natürlich auf „Gnade“ zurück; „in ihr“ gibt den gemeinten Bereich idiomatisch wieder.
theological_decisions:
- issue: Bezug von ταύτην („dies“)
  choice: „Dies“ bleibt in seinem Bezugsumfang offen und kann den Inhalt des Briefes beziehungsweise die darin bezeugte Botschaft und Erfahrung der Gnade umfassen.
  alternative: Enger Bezug ausschließlich auf die gegenwärtige Gnadenerfahrung der Empfänger oder ausschließlich auf die durch Silvanus vermittelte Botschaft.
  rationale: Der Kontext des Schreibens, Ermahnens und Bezeugens legt einen Bezug auf den mitgeteilten Inhalt nahe, bestimmt ihn aber nicht so eng, dass die Übersetzung ihn dogmatisch festlegen sollte.
- issue: Textform und Aussageweise von στῆτε
  choice: 'Imperativ: „Steht fest in ihr!“'
  alternative: 'Indikativ: „in der ihr steht“ beziehungsweise „in ihr steht ihr“'
  rationale: Der vorgegebene SBLGNT-Text bietet στῆτε als Imperativ. Die abweichende Lesart wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden zur besseren Verständlichkeit in zwei Sätze gegliedert. „Wie ich meine“ bleibt als persönliche Einschätzung eingeschoben; „eindringlich bezeugt“ wahrt das feierliche Gewicht des griechischen Verbs. Alle Fußnotenmarker stehen im Haupttext.
