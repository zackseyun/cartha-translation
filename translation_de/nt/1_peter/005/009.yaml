  timestamp: '2026-07-15T03:48:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Anrede an den Teufel, der Imperativ, die Standhaftigkeit im Glauben und die weltweite Gemeinschaft der Mitglaubenden sind zutreffend erfasst. Die Formulierung „an eurer Geschwisterschaft ... vollzogen werden“ gibt jedoch die syntaktische Beziehung und besonders die Bedeutung im Deutschen nicht angemessen wieder: Leiden werden nicht idiomatisch „an einer Geschwisterschaft vollzogen“. Im Kontext bezeichnet ἐπιτελεῖσθαι, bei verbleibender Nuance, die an den Glaubensgeschwistern sich vollziehenden bzw. von ihnen durchgemachten Leiden.'
  naturalness: „Dem widersteht“ ist als vorangestelltes Dativobjekt zwar verständlich, wirkt aber unnötig bibelsprachlich. „Widersteht ihm“ ist modernes Standarddeutsch. „Eure Glaubensgeschwister in der Welt ... durchmachen“ ist klar, idiomatisch und bewahrt den kollektiven Bezug von ἀδελφότης.
  terminology: „Glauben“ ist für πίστις geeignet und lässt die objektive wie persönliche Dimension offen. „Glaubensgeschwister“ gibt ἀδελφότης als gesamte Gemeinschaft von Mitglaubenden geschlechtergerecht und ohne den im Deutschen missverständlichen Abstraktbegriff „Geschwisterschaft“ wieder. Die Fußnote hält die weitergehende, umstrittene Nuance von ἐπιτελεῖσθαι fest.
  issues:
  - severity: medium
    issue: „an eurer Geschwisterschaft in der Welt vollzogen werden“ ist semantisch und idiomatisch problematisch.
    rationale: Die deutsche Wendung legt nahe, Leiden würden an einer abstrakten Beziehung oder Gemeinschaft verübt. Das griechische Dativobjekt bezieht sich auf die weltweite Gemeinschaft der Glaubenden, bei der diese Leiden stattfinden bzw. von der sie betroffen ist.
  - severity: low
    issue: „Dem widersteht“ klingt im modernen Standarddeutsch markiert.
    rationale: Die griechische Relativanbindung muss nicht durch ein vorangestelltes deutsches Dativpronomen nachgebildet werden. „Widersteht ihm“ ist die natürliche imperativische Form.
