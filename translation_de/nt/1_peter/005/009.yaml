source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: de
  text: Widersteht ihm, fest im Glauben, in dem Wissen, dass eure Glaubensgeschwister in der Welt dieselben Leiden durchmachen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann neben dem Gedanken des Durchmachens auch den des Vollendetwerdens oder Sich-Erfüllens einschließen; die genaue Nuance ist umstritten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: Dem
  rationale: Das Dativpronomen verweist auf den Teufel in Vers 8 zurück. „Dem“ bewahrt die relative Anknüpfung des Griechischen und ist im Deutschen natürlich.
- source_word: ἀντίστητε
  choice: widersteht
  rationale: Der Aoristimperativ fordert zu entschlossenem Widerstand auf; „widerstehen“ ist präzise und idiomatisch.
- source_word: στερεοὶ τῇ πίστει
  choice: fest im Glauben
  rationale: „Fest“ gibt στερεοὶ klar wieder. „Im Glauben“ lässt eher als „im christlichen Glauben“ offen, ob πίστις vorwiegend das persönliche Vertrauen oder den geteilten Glauben bezeichnet.
- source_word: εἰδότες
  choice: Ihr wisst ja
  rationale: Die finite Wiedergabe macht den begründenden bzw. begleitenden Sinn des Partizips in natürlichem Deutsch deutlich, ohne einen streng kausalen Zusammenhang festzulegen.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: dieselben Leiden
  rationale: Die Formulierung folgt dem griechischen Ausdruck eng; gemeint sind gleiche beziehungsweise gleichartige Leiden, nicht notwendig identische Ereignisse.
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: an eurer Geschwisterschaft in der Welt
  rationale: „Geschwisterschaft“ bewahrt das kollektive Verwandtschaftsbild und bezeichnet im heutigen Deutsch die gesamte Gemeinschaft der Glaubensgeschwister. „In der Welt“ gibt die Ortsangabe direkt wieder.
- source_word: ἐπιτελεῖσθαι
  choice: vollzogen werden
  rationale: Das Passiv und der mögliche Sinn von Ausführung beziehungsweise Vollendung bleiben erhalten. Die ungebräuchlichere Wendung ist bewusst gewählt, um die Deutung nicht stillschweigend auf bloßes Erleben zu verengen; eine natürlichere Alternative steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von τῇ πίστει
  choice: im Glauben
  alternative: im christlichen Glauben; durch den Glauben
  rationale: Artikel und Kontext erlauben einen Bezug auf den gemeinsamen christlichen Glauben, doch auch standhaftes persönliches Vertrauen klingt mit. Die deutsche Wendung bewahrt diese Spannung.
- issue: Bedeutung des passiven ἐπιτελεῖσθαι
  choice: vollzogen werden
  alternative: durchgemacht werden; sich erfüllen
  rationale: Das Verb kann mehr als das Erleben von Leid ausdrücken und einen Vorgang des Vollziehens oder Zu-Ende-Bringens bezeichnen. Die Hauptfassung hält diesen schwer eindeutig festzulegenden Zug offen.
- issue: Umfang von ἀδελφότητι
  choice: Geschwisterschaft
  alternative: Gemeinschaft der Glaubenden; Brüder und Schwestern
  rationale: Der Singular bezeichnet kollektiv die Glaubensgemeinschaft, nicht ausschließlich Männer. „Geschwisterschaft“ erhält zugleich das familiäre Bild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz ist knapp und eindringlich. „Geschwisterschaft“ ist ein verständlicher kollektiver Ausdruck, während die Fußnote eine idiomatischere Alternative bietet. Die schwierige Aussage über das Leiden wird nicht vorschnell auf eine einzige Deutung festgelegt.
