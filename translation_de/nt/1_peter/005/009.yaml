revisions:
- from: Dem widersteht, fest im Glauben. Ihr wisst ja, dass dieselben Leiden an eurer Geschwisterschaft in der Welt vollzogen werden.[a]
  to: Widersteht ihm, fest im Glauben, in dem Wissen, dass eure Glaubensgeschwister in der Welt dieselben Leiden durchmachen.[a]
  rationale: Die Revision beseitigt die unidiomatische und missverständliche Aussage, Leiden würden „an“ einer Geschwisterschaft „vollzogen“. Sie gibt die unmittelbare Aussage als tatsächliches Durchmachen gleicher Leiden wieder und dokumentiert die offenere Nuance des schwierigen Passivverbs in einer passend verankerten Fußnote. Zugleich wird die Imperativform modern und natürlich formuliert.
