source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: de
  text: 'Ebenso, ihr jüngeren Männer[a]: Ordnet euch den Ältesten unter. Ihr alle aber, bekleidet euch einander gegenüber mit Demut[b], denn: »Gott widersetzt sich den Hochmütigen, den Demütigen aber schenkt er Gnade.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Jüngeren«. Die griechische Form ist maskulin plural (»jüngere Männer«), kann aber auch allgemeiner auf die jüngeren Mitglieder der Gemeinde bezogen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Bildhaft auch etwa: »bindet euch Demut um«. Das griechische Verb ruft das Bild hervor, ein Kleidungsstück oder eine Schürze anzulegen und festzubinden, und betont so das bewusste Anlegen der Demut.'
    reason: lexical_alternative
  - marker: c
    text: Zitat beziehungsweise Anspielung auf Sprüche 3,34 nach der Septuaginta.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Der knappe Anschlussmarker verbindet die Aufforderung mit den vorangehenden Weisungen und klingt im modernen Deutsch natürlich.
- source_word: νεώτεροι
  choice: ihr jüngeren Männer
  rationale: Die maskuline Pluralform wird formal sichtbar wiedergegeben; zugleich weist eine Fußnote auf die mögliche allgemeinere Deutung als jüngere Gemeindeglieder hin.
- source_word: ὑποτάγητε
  choice: Ordnet euch … unter
  rationale: Die reflexive deutsche Form gibt den auffordernden Sinn von ὑποτάσσω klar und idiomatisch wieder.
- source_word: πρεσβυτέροις
  choice: den Ältesten
  rationale: Der unmittelbare Zusammenhang in 5,1–4 spricht für die Ältesten der Gemeinde und nicht bloß für ältere Männer.
- source_word: πάντες δὲ
  choice: Ihr alle aber
  rationale: Die Formulierung weitet die folgende Aufforderung ausdrücklich auf die gesamte Gemeinschaft aus.
- source_word: ἀλλήλοις
  choice: einander gegenüber
  rationale: Die Wendung bewahrt die gegenseitige, relationale Ausrichtung der Demut.
- source_word: ταπεινοφροσύνην
  choice: Demut
  rationale: „Demut“ ist die klare, geläufige Entsprechung und bewahrt den ethischen Gehalt des Begriffs.
- source_word: ἐγκομβώσασθε
  choice: bekleidet euch mit
  rationale: Die Wiedergabe erhält das Bild des bewussten Anlegens beziehungsweise Festbindens eines Kleidungsstücks, ohne im Deutschen unnatürlich zu wirken.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ leitet im Deutschen natürlich die begründende Schriftanführung ein.
- source_word: ὑπερηφάνοις
  choice: den Hochmütigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die sich hoch über andere stellen; „Hochmütige“ ist präzise und würdig.
- source_word: ἀντιτάσσεται
  choice: widersetzt sich
  rationale: Die reflexive Form bringt die starke Bedeutung des Sich-entgegenstellens deutlicher zum Ausdruck als ein möglicherweise schwächer verstandenes „widersteht“.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: den Demütigen aber schenkt er Gnade
  rationale: Die Gegenüberstellung bleibt erhalten; „schenkt“ gibt das unverdiente Geben der χάρις natürlich wieder.
theological_decisions:
- issue: Bezugsgruppe von πρεσβυτέροις
  choice: die Ältesten der Gemeinde
  alternative: ältere Männer im Allgemeinen
  rationale: Da 1 Petrus 5,1–4 unmittelbar die Ältesten und ihren Hirtendienst anspricht, liegt hier dieselbe anerkannte Gruppe am nächsten.
- issue: Geschlecht und Reichweite von νεώτεροι
  choice: ihr jüngeren Männer
  alternative: ihr Jüngeren beziehungsweise die jüngeren Gemeindeglieder
  rationale: Die griechische Form ist maskulin plural und wird im Haupttext entsprechend transparent wiedergegeben. Die mögliche allgemeinere Reichweite wird nicht ausgeschlossen, sondern in der Fußnote genannt; πάντες erweitert die anschließende Demutsaufforderung ausdrücklich auf alle.
- issue: Charakter der Begründung
  choice: als Schriftzitat beziehungsweise deutliche Anspielung markiert
  alternative: als nicht gekennzeichnete allgemeine Aussage
  rationale: Die Formulierung entspricht Sprüche 3,34 in der Septuaginta so eng, dass die typografische Kennzeichnung und der Querverweis sachgerecht sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Imperativ erhält den eindringlichen Charakter der Ermahnung. Das Kleidungsbild wird im Haupttext verständlich bewahrt und in der Fußnote genauer erläutert; die geschlechtliche Form und ihre mögliche weitere Reichweite bleiben transparent.
