  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: de
  text: Seid besonnen[a] und wachsam. Euer Widersacher, der Teufel, geht umher wie ein brüllender Löwe und sucht jemanden zu verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid nüchtern.“ Das griechische Verb bedeutet ursprünglich, vom Wein nüchtern zu sein, wird im Neuen Testament jedoch bildlich für geistige Klarheit und Selbstbeherrschung gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Seid besonnen
  rationale: Das Verb bezeichnet hier bildlich geistige Klarheit und Selbstbeherrschung, nicht wörtliche Nüchternheit vom Wein. „Besonnen“ gibt diese Haltung in natürlichem Deutsch wieder und bleibt von γρηγορήσατε unterschieden.
- source_word: γρηγορήσατε
  choice: und wachsam
  rationale: Der Imperativ fordert wache Aufmerksamkeit. „Wachsam“ ergänzt „besonnen“, ohne dessen Bedeutung zu wiederholen.
- source_word: ἀντίδικος
  choice: Widersacher
  rationale: Das Wort kann einen Prozessgegner bezeichnen, benennt hier aber allgemein einen feindlichen Gegner. „Widersacher“ bewahrt die mögliche forensische Färbung, ohne sie festzuschreiben.
- source_word: διάβολος
  choice: der Teufel
  rationale: Hier dient das Wort als geläufige Bezeichnung des persönlichen bösen Gegners, nicht bloß eines beliebigen Verleumders.
- source_word: ὡς λέων ὠρυόμενος
  choice: wie ein brüllender Löwe
  rationale: Die ausdrückliche Vergleichsform und das bedrohliche Bild werden unmittelbar und idiomatisch wiedergegeben.
- source_word: περιπατεῖ
  choice: geht umher
  rationale: Dies entspricht dem Grundsinn des Verbs und lässt die Bedrohlichkeit vor allem durch das Löwenbild entstehen, statt sie durch „schleicht“ oder „streift auf Beutezug“ zu verstärken.
- source_word: ζητῶν τινα καταπιεῖν
  choice: und sucht jemanden, den er verschlingen kann
  rationale: Die deutsche Relativkonstruktion gibt die Suche nach einem unbestimmten Opfer und das Ziel des Verschlingens natürlich wieder.
theological_decisions:
- issue: διάβολος als Gattungsbezeichnung oder als Bezeichnung des persönlichen bösen Gegners
  choice: der Teufel
  alternative: der Verleumder
  rationale: Der Zusammenhang identifiziert den Widersacher als die im Neuen Testament so bezeichnete persönliche Gestalt. „Der Teufel“ gibt diesen Sprachgebrauch wieder, ohne zusätzliche Lehraussagen einzutragen.
- issue: Stärke der Wiedergabe von περιπατεῖ im Löwenbild
  choice: geht umher
  alternative: streift umher / schleicht umher
  rationale: Die zurückhaltende Wiedergabe folgt dem gewöhnlichen Sinn des griechischen Verbs und überlässt die räuberische Bedrohung dem ausdrücklichen Löwenvergleich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Aufforderungen bleiben erhalten; „besonnen“ und „wachsam“ bilden ein verständliches, nicht redundantes Begriffspaar. „Widersacher“ bewahrt den ernsten und möglicherweise forensischen Klang des Ausgangstextes.
