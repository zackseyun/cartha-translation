  - severity: medium
    issue: Fußnote b behauptet eine Quellmehrdeutigkeit, die der griechische Text an dieser Stelle nicht hergibt.
    rationale: τινα ist ein indefiniter Akkusativ Singular („jemanden“); die deutsche Alternative „wen“ ist eine stilistische Umformung, keine relevante textliche oder semantische Ambiguität. Mit der direkten Zielinfinitiv-Wiedergabe entfällt der Anker.
