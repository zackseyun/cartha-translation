  source_fidelity: „Seid besonnen und wachsam. Euer Widersacher, der Teufel, geht umher wie ein brüllender Löwe und sucht jemanden zu verschlingen.“ gibt die beiden Imperative, den Widersacher/Teufel, den Löwenvergleich und die zielgerichtete Partizip-Infinitiv-Konstruktion des Griechischen zuverlässig wieder. Die vorliegende Formulierung „den er verschlingen kann“ fügt gegenüber ζητῶν τινα καταπιεῖν unnötig eine Modalnuance („kann“) hinzu.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Besonnen“ und „wachsam“ sind ein klares Begriffspaar; „jemanden zu verschlingen suchen“ bzw. hier „sucht jemanden zu verschlingen“ ist idiomatisch und präzise.
  terminology: „Widersacher“ bewahrt die feindliche, möglicherweise forensische Färbung von ἀντίδικος. „Der Teufel“ ist im Kontext die angemessene etablierte Bezeichnung für διάβολος. „Brüllender Löwe“ und „geht umher“ sind treffend und ohne interpretierende Verstärkung.
