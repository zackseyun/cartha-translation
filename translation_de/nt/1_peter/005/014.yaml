source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: de
  text: Grüßt einander mit einem Kuss der Liebe. Friede sei euch allen, die im Messias sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „die in Christus sind“.'
    reason: Alternative, traditionell vertraute Wiedergabe von Χριστῷ.
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Grüßt einander
  rationale: Der Aoristimperativ im Medium fordert die Gemeindeglieder zu einem gegenseitigen Gruß auf. „Grüßt einander“ ist im modernen Deutschen klar und entspricht dem brieflichen Schlusskontext.
- source_word: ἐν φιλήματι ἀγάπης
  choice: mit einem Kuss der Liebe
  rationale: ἐν bezeichnet hier die Art und Weise des Grußes und wird idiomatisch mit „mit“ wiedergegeben. „Kuss der Liebe“ bewahrt die genitivische Fügung und den ausdrücklichen Bezug zu ἀγάπη.
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: Friede sei euch allen
  rationale: Die knappe nominale Segensformel wird im Deutschen durch „sei“ natürlich und eindeutig als Segenswunsch ausgedrückt; „allen“ bewahrt den umfassenden Adressatenkreis.
- source_word: τοῖς ἐν Χριστῷ
  choice: die im Messias sind
  rationale: Artikel und Präpositionalgruppe bezeichnen substantivisch diejenigen, die „im“ Gesalbten sind. „Messias“ gibt Χριστός als Titel wieder; der Relativsatz ist im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in der Formel ἐν Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Χριστός bezeichnet den Gesalbten und wird daher als Titel mit „Messias“ wiedergegeben. Die vertraute traditionelle Wiedergabe „Christus“ bleibt in einer Fußnote erhalten, ohne die Aussage über das Sein „im Messias“ näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Schlussmahnung und der Segenswunsch bleiben erhalten; „Kuss der Liebe“ wahrt bewusst die konkrete und leicht ungewohnte Bildlichkeit des griechischen Ausdrucks.
