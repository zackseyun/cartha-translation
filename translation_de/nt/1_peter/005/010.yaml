id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: de
  text: Der Gott aller Gnade aber, der euch in Christus zu seiner ewigen Herrlichkeit berufen hat, wird euch, nachdem ihr eine kurze Zeit gelitten habt, selbst wiederherstellen[a], festigen, stärken und auf festen Grund stellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollenden“ oder „zurechtbringen“. Das griechische Verb kann bezeichnen, dass etwas wieder in den rechten oder vollständigen Zustand versetzt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „gründen“. Das griechische Wort verwendet das Bild eines festen Fundaments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: aller Gnade
  rationale: Der umfassende Sinn der Genitivverbindung wird knapp und im Deutschen idiomatisch wiedergegeben.
- source_word: καλέσας
  choice: der ... berufen hat
  rationale: Das substantivierte Partizip wird als natürlicher deutscher Relativsatz wiedergegeben; „berufen“ entspricht im christlichen Kontext dem Sinn von καλέω.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: zu seiner ewigen Herrlichkeit
  rationale: „Zu“ gibt die Zielrichtung von εἰς im Deutschen natürlich wieder, ohne eine bereits vollzogene Aufnahme in die Herrlichkeit zu behaupten.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: „In Christus“ ist die natürliche und theologisch offene deutsche Wiedergabe der festen paulinisch-frühchristlichen Wendung; „Christus“ ist im Deutschen zugleich die etablierte Wiedergabe des Titels Χριστός.
- source_word: ὀλίγον παθόντας
  choice: nachdem ihr eine kurze Zeit gelitten habt
  rationale: ὀλίγον wird zeitlich verstanden; die Formulierung bewahrt die Abfolge von begrenztem Leiden und Gottes anschließendem Handeln.
- source_word: αὐτὸς
  choice: selbst
  rationale: 'Die betonte Stellung des Pronomens wird bewahrt: Gott selbst wird handeln.'
- source_word: καταρτίσει
  choice: wiederherstellen
  rationale: Das Verb bezeichnet hier das Versetzen in einen rechten beziehungsweise vollständigen Zustand und kann sowohl Wiederherstellung als auch Vollendung einschließen.
- source_word: στηρίξει
  choice: festigen
  rationale: Die Wiedergabe vermittelt Stabilität und unterscheidet sich zugleich von dem folgenden „stärken“.
- source_word: σθενώσει
  choice: stärken
  rationale: Dies ist die direkte und idiomatische Wiedergabe des Verbs.
- source_word: θεμελιώσει
  choice: auf festen Grund stellen
  rationale: Die Formulierung erhält das im griechischen Verb enthaltene Bild eines Fundaments und vermeidet eine bloße Wiederholung von „festigen“.
theological_decisions:
- issue: Bedeutung von Χριστῷ
  choice: Christus
  alternative: Messias
  rationale: Χριστός ist seinem Ursprung nach ein Titel („Gesalbter/Messias“), doch „Christus“ ist im modernen deutschen Bibel- und Allgemeingebrauch die verständliche, etablierte Titelform. Die Wendung „in Christus“ sollte nicht kausal zu „durch Christus“ vereindeutigt werden.
- issue: Verhältnis von Leiden und Gottes Handeln
  choice: nachdem ihr eine kurze Zeit gelitten habt
  alternative: wenn ihr eine kurze Zeit gelitten habt
  rationale: Die gewählte Fassung macht die naheliegende zeitliche Abfolge deutlich, ohne den Zweck des Leidens oder ein bestimmtes Lehrsystem darüber festzulegen.
- issue: Zielrichtung der Berufung
  choice: zu seiner ewigen Herrlichkeit
  alternative: in seine ewige Herrlichkeit hinein
  rationale: εἰς bezeichnet das Ziel der Berufung. „Zu“ ist im Deutschen natürlich und lässt offen, in welchem Sinn und zu welchem Zeitpunkt die Teilhabe an der Herrlichkeit verwirklicht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier abschließenden Verben bleiben als eigenständige, rhythmische Reihe erhalten. Das adversative δέ wird mit nachgestelltem „aber“ wiedergegeben; die Satzstruktur bleibt trotz der langen Periode gut verständlich.
