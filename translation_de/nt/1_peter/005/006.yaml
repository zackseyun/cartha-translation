  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: de
  text: Demütigt euch[a] daher unter die mächtige Hand Gottes, damit er euch zur rechten Zeit erhöht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst euch demütigen …, damit er euch zur rechten Zeit erhöht.“ Der griechische Imperativ hat die Form des Passivs, wird hier jedoch häufig reflexiv verstanden: „Demütigt euch.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: Demütigt euch
  rationale: Der Aorist-Passiv-Imperativ kann in diesem Mahnkontext reflexiv bzw. medial verstanden werden. „Demütigt euch“ ist im Deutschen natürlich und bewahrt den Aufforderungscharakter; die formale Passivmöglichkeit wird in der Fußnote genannt.
- source_word: οὖν
  choice: daher
  rationale: Kennzeichnet die Folgerung aus der vorherigen Aussage, dass Gott den Hochmütigen widersteht, den Demütigen aber Gnade gibt.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: unter die mächtige Hand Gottes
  rationale: Bewahrt das biblisch geprägte Bild für Gottes machtvolles und souveränes Handeln. Der Akkusativ nach ὑπό entspricht hier einer Bewegung beziehungsweise Unterordnung unter Gottes Hand.
- source_word: ἵνα ὑμᾶς ὑψώσῃ
  choice: damit er euch … erhöht
  rationale: „Damit“ gibt den Ziel- oder Folgesinn von ἵνα wieder. Das aus dem vorigen Satzteil erschlossene Subjekt ist Gott; „erhöht“ wahrt den Sinn von Erhebung zu Ehre oder Rechtfertigung.
- source_word: ἐν καιρῷ
  choice: zur rechten Zeit
  rationale: καιρός bezeichnet hier den passenden oder bestimmten Zeitpunkt, nicht lediglich Zeit im chronologischen Sinn. „Zur rechten Zeit“ ist natürlich und lässt offen, ob besonders die Angemessenheit oder göttliche Bestimmung betont wird.
theological_decisions:
- issue: Diathese und Handlungsträgerschaft bei Ταπεινώθητε
  choice: Die Aufforderung wird reflexiv mit „Demütigt euch“ wiedergegeben.
  alternative: „Lasst euch demütigen“ beziehungsweise „Werdet gedemütigt“
  rationale: Die reflexive Wiedergabe ist im Deutschen idiomatisch und entspricht dem verbreiteten medialen Verständnis des formal passiven Imperativs. „Unter die mächtige Hand Gottes“ macht zugleich deutlich, dass es um willige Unterordnung unter Gottes Macht geht; die formale Passivlesart bleibt durch die Fußnote sichtbar.
- issue: Bedeutung der Erhöhung
  choice: Das offene „erhöht“ bleibt stehen.
  alternative: „zu Ehren bringt“, „aufrichtet“ oder „rechtfertigt“
  rationale: ὑψόω kann Erhebung, Ehre oder Rechtfertigung umfassen. Eine konkretisierende Umschreibung würde die theologische Bedeutungsbreite unnötig einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Metapher „die mächtige Hand Gottes“ und das theologisch offene Verb „erhöhen“ bleiben erhalten; Satzbau und Konnektoren sind zugleich allgemein verständlich.
