  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: de
  text: Und wenn der oberste Hirte offenbar wird[a], werdet ihr den unverwelklichen Kranz[b] der Herrlichkeit empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erscheint“.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort bezeichnet einen Kranz, der als Siegespreis oder Ehrung verliehen wurde, nicht speziell eine Königskrone.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: wenn ... offenbar wird
  rationale: Das aoristische Passivpartizip im Genitivus absolutus wird zeitlich wiedergegeben. „Offenbar wird“ bewahrt sowohl den passiven Sinn als auch das Motiv der Manifestation; „erscheint“ bleibt als mögliche idiomatische Alternative in der Fußnote erhalten.
- source_word: ἀρχιποίμενος
  choice: der oberste Hirte
  rationale: Das Kompositum bezeichnet den höchsten beziehungsweise leitenden Hirten. „Oberster Hirte“ ist im modernen Deutsch klar, würdig und als Titel im Kontext eindeutig auf Christus bezogen, ohne eine ungewöhnliche Neubildung wie „Erzhirte“ zu verwenden.
- source_word: κομιεῖσθε
  choice: werdet ihr ... empfangen
  rationale: Das Futur Medium bezeichnet hier den Empfang eines zuerkannten Ehrenpreises. „Empfangen“ ist natürlich und wahrt den Belohnungskontext.
- source_word: ἀμαράντινον
  choice: unverwelklichen
  rationale: Das Adjektiv bezeichnet etwas, das nicht verwelkt oder seine Frische verliert. „Unverwelklich“ bildet das Bild eines Pflanzenkranzes genauer ab als das weiter gefasste „unvergänglich“.
- source_word: τῆς δόξης
  choice: der Herrlichkeit
  rationale: 'Der Genitiv bleibt formal erhalten und bewahrt die knappe, mehrdeutige Verbindung: Der Kranz kann durch Herrlichkeit gekennzeichnet sein oder in Herrlichkeit bestehen.'
- source_word: στέφανον
  choice: Siegeskranz
  rationale: στέφανος bezeichnet typischerweise einen als Siegespreis oder Ehrung verliehenen Kranz, nicht speziell eine Königskrone. „Siegeskranz“ macht dieses für heutige Leser sonst leicht verlorene Bild im Haupttext verständlich.
theological_decisions:
- issue: Identität des „obersten Hirten“
  choice: Als christologischer Titel ohne erklärenden Zusatz wiedergegeben
  alternative: „Erzhirte“ oder ausdrückliche Ergänzung „Christus“
  rationale: Der unmittelbare Zusammenhang identifiziert den Titel mit Jesus. Eine Ergänzung seines Namens wäre jedoch expliziter als der griechische Text; „oberster Hirte“ bewahrt Titel und Hirtenbild.
- issue: Eschatologische Manifestationssprache
  choice: „offenbar wird“
  alternative: „erscheint“
  rationale: Die passive Form erhält das Motiv des Offenbarwerdens und legt die Art des endzeitlichen Geschehens nicht enger fest. Die idiomatische Alternative wird in der Fußnote genannt.
- issue: Genitivverhältnis in „Kranz der Herrlichkeit“
  choice: Der Genitiv bleibt unaufgelöst
  alternative: „herrlicher Kranz“ oder „Kranz, der in der Herrlichkeit besteht“
  rationale: Das Griechische lässt die genaue semantische Beziehung offen. Die formnahe Wiedergabe vermeidet eine unnötige theologische oder metaphorische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Genitivus absolutus, klingt aber idiomatisch. „Siegeskranz“ verdeutlicht das antike Ehrenpreisbild; „unverwelklich“ führt dessen Pflanzenmetaphorik fort. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
