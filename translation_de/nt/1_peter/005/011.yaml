lexical_decisions:
- source_word: αὐτῷ
  choice: Ihm
  rationale: Der Dativ Singular verweist im Zusammenhang auf Gott. „Ihm“ bewahrt die knappe doxologische Form des Griechischen.
- source_word: κράτος
  choice: die Herrschaft
  rationale: κράτος bezeichnet hier in einer Doxologie machtvolle, souveräne Herrschaft und nicht nur abstrakte Stärke.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die gesteigerte feste Wendung drückt unbegrenzte Dauer aus. „Für immer und ewig“ gibt Sinn und Nachdruck in natürlichem modernem Deutsch wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Die herkömmliche Transliteration bewahrt den liturgischen Charakter der abschließenden Bekräftigung.
theological_decisions:
- issue: Nicht ausgesprochenes Prädikat in der Doxologie
  choice: Ihm gehört die Herrschaft
  alternative: Ihm sei die Herrschaft
  rationale: Der griechische Satz ist ohne ausdrückliches Verb. „Gehört“ macht die im Deutschen notwendige Zuordnung deutlich, ohne die Aussage unnötig auszudeuten; die alternative Wunsch- oder Akklamationsform bleibt sprachlich möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper doxologischer Satzform. Die Fußnote bewahrt die bildhafte Struktur der griechischen Zeitformel.
