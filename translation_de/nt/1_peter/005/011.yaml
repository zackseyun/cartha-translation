base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: de
  text: Ihm gehört die Herrschaft für immer und ewig.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis in die Zeitalter der Zeitalter“.'
