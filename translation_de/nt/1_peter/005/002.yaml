revisions:
- from: Hütet die Herde Gottes, die euch anvertraut ist, und übt die Aufsicht aus – nicht unter Zwang, sondern freiwillig, wie es Gott entspricht[a]; auch nicht aus schändlicher Gewinnsucht, sondern mit Hingabe.
  to: Hütet die Herde Gottes, die bei euch ist, und übt Aufsicht über sie aus – nicht unter Zwang, sondern freiwillig, Gott gemäß[a]; auch nicht aus schändlicher Gewinnsucht, sondern bereitwillig.
  rationale: Die Überarbeitung vermeidet eine nicht ausdrücklich im griechischen Text enthaltene Aussage über Anvertrautheit, stellt den Bezug von ἐν ὑμῖν transparent dar und gibt die beiden positiven Adverbien mit unterscheidbaren deutschen Ausdrücken wieder. „Gott gemäß“ erhält die semantische Offenheit von κατὰ θεόν; die Fußnote bietet die geläufigere, stärker auslegende Wiedergabe an.
  reviewer_model: gpt-5.6-terra
