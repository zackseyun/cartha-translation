review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Kontraste des griechischen Textes sind überwiegend richtig wiedergegeben. Doch „die euch anvertraut ist“ interpretiert ἐν ὑμῖν („bei/euch unter euch“) weitergehend als eine ausdrückliche Anvertrauung. „Mit Hingabe“ trifft προθύμως nur teilweise und verdeckt dessen Sinn von bereitwilligem, eifrigem Einsatz. „Wie es Gott entspricht“ ist zudem im Deutschen semantisch weniger klar und kann missverständlich wirken.
  naturalness: Der Satz ist insgesamt würdig und gut verständlich. „Gott gemäß“ ist hier eine knappe, idiomatische und zugleich theologisch offene Wiedergabe. „Übt Aufsicht über sie aus“ ist im Deutschen vollständiger als „übt die Aufsicht aus“.
  terminology: „Hütet“ bewahrt zutreffend das Hirtenbild; „Aufsicht“ gibt ἐπισκοποῦντες ohne nachträglichen Amtstitel wieder. „Freiwillig“ und „bereitwillig“ unterscheiden angemessen zwischen ἑκουσίως und προθύμως. „Schändliche Gewinnsucht“ gibt die negative Wertung von αἰσχροκερδῶς wieder.
  issues:
  - severity: medium
    issue: „die euch anvertraut ist“ für ἐν ὑμῖν
    rationale: Die griechische Wendung bezeichnet die Herde als bei bzw. unter den Angeredeten befindlich. Eine explizite Anvertrauung ist zwar kontextuell naheliegend, wird aber nicht ausgedrückt und sollte daher nicht in den Haupttext aufgenommen werden.
  - severity: medium
    issue: „wie es Gott entspricht“ für κατὰ θεόν
    rationale: Die Formulierung ist im Deutschen ungewöhnlich und kann nahelegen, dass etwas Gott ‚angemessen‘ sei, statt die knappe Orientierung an Gott bzw. Gottes Willen/maßgebender Norm offen wiederzugeben. „Gott gemäß“ ist präziser und wahrt die Mehrdeutigkeit.
  - severity: medium
    issue: „mit Hingabe“ für προθύμως
    rationale: „Mit Hingabe“ kann engagierte, selbstaufopfernde Zuwendung meinen; προθύμως bezeichnet hier Bereitschaft bzw. Eifer als Gegenpol zu gewinnsüchtigem Handeln. „Bereitwillig“ gibt dies unmittelbarer wieder.
  revised_text: Hütet die Herde Gottes, die bei euch ist, und übt Aufsicht über sie aus – nicht unter Zwang, sondern freiwillig, Gott gemäß[a]; auch nicht aus schändlicher Gewinnsucht, sondern bereitwillig.
  revised_footnotes:
  - marker: a
    text: 'Oder: „wie Gott es will“ bzw. „im Einklang mit Gottes Willen“.'
    reason: Alternative Wiedergabe der knappen Wendung κατὰ θεόν.
  revision_rationale: Die Überarbeitung vermeidet eine nicht ausdrücklich im griechischen Text enthaltene Aussage über Anvertrautheit, stellt den Bezug von ἐν ὑμῖν transparent dar und gibt die beiden positiven Adverbien mit unterscheidbaren deutschen Ausdrücken wieder. „Gott gemäß“ erhält die semantische Offenheit von κατὰ θεόν; die Fußnote bietet die geläufigere, stärker auslegende Wiedergabe an.
