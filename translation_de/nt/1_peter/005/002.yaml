  variant: modern standard German
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: de
  text: Hütet die Herde Gottes, die bei euch ist, und übt Aufsicht über sie aus – nicht unter Zwang, sondern freiwillig, Gott gemäß[a]; auch nicht aus schändlicher Gewinnsucht, sondern bereitwillig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Gott es will“ bzw. „im Einklang mit Gottes Willen“.'
    reason: Alternative Wiedergabe der knappen Wendung κατὰ θεόν.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Hütet
  rationale: Der Imperativ bewahrt das Hirtenbild und bezeichnet fürsorgliche Leitung, ohne das spätere Amtswort „Pastor“ in das Verb einzutragen.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: die Herde Gottes, die euch anvertraut ist
  rationale: „Herde Gottes“ hält Gottes Eigentumsanspruch fest. Die relationale Wendung „euch anvertraut“ gibt ἐν ὑμῖν natürlich wieder, ohne die Herde als Eigentum der Ältesten darzustellen.
- source_word: ἐπισκοποῦντες
  choice: und übt die Aufsicht aus
  rationale: Das Partizip erläutert die Ausübung des Hirtendienstes. Die beschreibende Formulierung vermeidet einen konfessionell geprägten Amtstitel.
- source_word: μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως
  choice: nicht unter Zwang, sondern freiwillig
  rationale: Die klare Gegenüberstellung von äußerem Druck und eigenem Willen bleibt erhalten.
- source_word: κατὰ θεόν
  choice: wie es Gott entspricht
  rationale: Die knappe griechische Wendung kann Gottes Willen, Maßstab oder gottgemäße Weise bezeichnen. Diese Formulierung bleibt relativ offen und ist im Deutschen natürlicher als „gemäß Gott“.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: auch nicht aus schändlicher Gewinnsucht
  rationale: Die Wiedergabe erfasst nicht Gewinn an sich, sondern das moralisch verwerfliche Streben danach.
- source_word: ἀλλὰ προθύμως
  choice: sondern mit Hingabe
  rationale: προθύμως bezeichnet bereitwilligen Eifer. „Mit Hingabe“ unterscheidet diese Aussage von dem bereits mit „freiwillig“ wiedergegebenen ἑκουσίως.
theological_decisions:
- issue: Ob ἐπισκοποῦντες als technischer Amtstitel wiederzugeben ist
  choice: Beschreibend als „übt die Aufsicht aus“
  alternative: „dient als Aufseher“ oder „übt das Bischofsamt aus“
  rationale: Das Partizip bezeichnet hier die Tätigkeit der im Kontext angesprochenen Ältesten; ein später festgelegter kirchlicher Amtstitel würde eine bestimmte Kirchenordnung in den Text hineintragen.
- issue: Wie ausdrücklich κατὰ θεόν auszulegen ist
  choice: „wie es Gott entspricht“ im Haupttext, mit alternativer Auslegung in der Fußnote
  alternative: „nach Gottes Willen“ oder „wie Gott es will“
  rationale: Die griechische Formulierung ist semantisch gedrängt. Die gewählte Wiedergabe wahrt ihre Offenheit, während die Fußnote die naheliegende Deutung als Bezug auf Gottes Willen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Hirtenbild bleibt erhalten; kirchliche Fach- und Amtsbegriffe werden vermieden. Die Gedankenstriche verdeutlichen die beiden Kontraste, ohne die Satzstruktur inhaltlich zu verändern.
