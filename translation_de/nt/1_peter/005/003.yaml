  source_fidelity: Die Übersetzung gibt die fortgeführte Verneinung, den missbräuchlich-herrischen Sinn von κατακυριεύοντες, den Kontrast durch ἀλλά sowie den prozesshaften Charakter von γινόμενοι zuverlässig wieder. „Die euch anvertrauten Teile der Herde“ ist eine kontextuell vertretbare Auslegung von τῶν κλήρων; die Fußnote legt die wörtlichere Bedeutung offen und markiert die Einordnung zutreffend als wahrscheinlich.
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. „Sich als Herren über … aufspielen“ ist leicht bildhaft, aber nicht unangemessen umgangssprachlich und trifft den vorwurfsvollen Charakter des Verbs. Der einleitende Anschluss mit „und“ ist bei fortlaufender Versdarstellung natürlich.
  terminology: „Vorbilder“ für τύποι und „Herde“ für ποίμνιον sind treffend und im kirchlich-biblischen Register etabliert. Die Formulierung zu κλήρων vermeidet unzutreffenden Besitzanspruch; die Fußnote bewahrt „Lose/Anteile“ als relevante lexikalische Alternative. Es werden keine konfessionell einengenden Leitungsmodelle eingeführt.
