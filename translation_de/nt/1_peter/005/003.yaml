id: 1PE.5.3
reference: 1 Peter 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: de
  text: und spielt euch nicht als Herren über die euch anvertrauten Teile der Herde auf[a], sondern werdet Vorbilder für die Herde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »über die Lose/Anteile«. Gemeint sind wahrscheinlich die Teile von Gottes Herde, die jeweils der Fürsorge eines Ältesten zugeteilt sind.'
    reason: Bewahrt die konkrete Bedeutung von κλήρων und kennzeichnet die kontextuelle Deutung.
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: und … nicht
  rationale: Führt die negative Reihung aus dem vorherigen Vers fort. „Und … nicht“ gibt den Anschluss im Deutschen knapp und natürlich wieder.
- source_word: κατακυριεύοντες
  choice: spielt euch nicht als Herren … auf
  rationale: Das Verb bezeichnet eine anmaßende, beherrschende Ausübung von Macht. Die Formulierung unterscheidet diesen Machtmissbrauch von verantwortlicher Leitung.
- source_word: τῶν κλήρων
  choice: die euch anvertrauten Teile der Herde
  rationale: κλῆροι bedeutet wörtlich „Lose“, „Anteile“ oder „zugeteilte Bereiche“. Im Zusammenhang sind die Teile von Gottes Herde gemeint, die der Fürsorge der einzelnen Ältesten anvertraut sind; die Fußnote bewahrt den wörtlicheren Ausdruck.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Kennzeichnet den deutlichen Gegensatz zwischen anmaßender Herrschaft und vorbildlichem Verhalten.
- source_word: τύποι
  choice: Vorbilder
  rationale: τύπος bezeichnet hier ein Muster beziehungsweise Beispiel, das andere nachahmen können. „Vorbilder“ ist idiomatisch und prägnant.
- source_word: γινόμενοι
  choice: werdet
  rationale: 'Bewahrt gegenüber einem statischen „seid“ den verbalen Gedanken des γίνομαι: Die Ältesten sollen sich in ihrem Verhalten als Vorbilder erweisen beziehungsweise dazu werden.'
- source_word: τοῦ ποιμνίου
  choice: für die Herde
  rationale: Gibt das geläufige pastorale Bild für die Gemeinschaft der Glaubenden klar und natürlich wieder.
theological_decisions:
- issue: Bedeutung von κλήρων im Verhältnis zur Gemeindeleitung
  choice: die der Fürsorge der Ältesten anvertrauten Teile von Gottes Herde
  alternative: wörtlich „die Lose/Anteile“ oder die Zuständigkeitsbereiche der Ältesten
  rationale: Der unmittelbare Zusammenhang handelt vom Hüten der Herde Gottes. Die Übersetzung betont Verantwortung statt Besitz, während die Fußnote die konkrete Bildsprache und ihre mögliche Weite offenlegt.
- issue: Aussagekraft von κατακυριεύοντες
  choice: Verbot anmaßender und beherrschender Machtausübung
  alternative: Verbot jeder leitenden Autorität
  rationale: Das Verb bezeichnet nicht bloß Leitung, sondern ein herrisches Ausüben von Macht. Der Gegensatz gilt missbräuchlicher Herrschaft und vorbildlicher Leitung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich als Herren aufspielen“ vermittelt den negativen Sinn von κατακυριεύω verständlich, ohne jede Form von Leitung auszuschließen. Der Satzanfang mit „und“ wahrt den syntaktischen Anschluss an den vorherigen Vers.
