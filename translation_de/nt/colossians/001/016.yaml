id: COL.1.16
reference: Colossians 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: de
  text: Denn[a] in ihm wurde alles geschaffen, in den Himmeln und auf der Erde, das Sichtbare und das Unsichtbare, seien es Throne oder Herrschaften oder Mächte oder Gewalten[b]; alles ist durch ihn und auf ihn hin geschaffen worden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weil« statt »Denn«.'
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnungen »Throne«, »Herrschaften«, »Mächte« und »Gewalten« meinen wahrscheinlich verschiedene Ränge oder Arten geschaffener Autoritäten, ohne sie hier näher zu bestimmen.
    reason: ambiguity
  - marker: c
    text: 'Wörtlich: »zu ihm hin«; die Formulierung bezeichnet ihn als Ziel der Schöpfung. Möglich ist auch: »für ihn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorherige Aussage über den Vorrang des Sohnes ein und bewahrt die kausale Verknüpfung.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Bewahrt ἐν als »in« und unterscheidet die Wendung vom späteren δι’ αὐτοῦ (»durch ihn«), ohne sie vorschnell instrumental zu deuten.
- source_word: ἐκτίσθη / ἔκτισται
  choice: wurde geschaffen / ist geschaffen worden
  rationale: Die erste Form wird als Aorist, die zweite als Perfekt wiedergegeben; so bleibt der aspektuelle Unterschied erkennbar.
- source_word: τὰ πάντα
  choice: alles
  rationale: Gibt den umfassenden Sinn idiomatisch und ohne einschränkende Auslegung wieder.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Bewahrt den griechischen Plural und vermeidet die interpretierende Paraphrase »in den himmlischen Bereichen«.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Natürliche deutsche Entsprechung, die mit »in den Himmeln« den gesamten kosmischen Bereich bezeichnet.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: das Sichtbare und das Unsichtbare
  rationale: Die substantivierten Adjektive werden knapp und formal entsprechend wiedergegeben.
- source_word: εἴτε … εἴτε … εἴτε … εἴτε
  choice: seien es … oder … oder … oder
  rationale: Natürliches Deutsch, das die aufzählende und umfassende Struktur erhält.
- source_word: θρόνοι
  choice: Throne
  rationale: Direkte Wiedergabe; eine Festlegung auf eine bestimmte Art himmlischer oder irdischer Wesen wird vermieden.
- source_word: κυριότητες
  choice: Herrschaften
  rationale: Entspricht dem Bedeutungsfeld von κυριότης und bleibt als Bezeichnung einer Autoritätsordnung verständlich.
- source_word: ἀρχαί
  choice: Mächte
  rationale: Gängige, verständliche Bezeichnung für herrschende Gewalten; die mögliche Wiedergabe »Herrschaftsbereiche« bleibt eine Alternative.
- source_word: ἐξουσίαι
  choice: Gewalten
  rationale: Bewahrt den Sinn verliehener oder ausgeübter Autorität und unterscheidet den Ausdruck im Deutschen von ἀρχαί.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: Gibt die vermittelnde bzw. instrumentale Beziehung der Schöpfung zum Sohn wieder.
- source_word: εἰς αὐτόν
  choice: auf ihn hin
  rationale: Bewahrt deutlicher als das bloße »für ihn« die Zielrichtung von εἰς, ohne sie auf Nutzen oder Besitz zu verengen.
theological_decisions:
- issue: Verhältnis des Sohnes zur Schöpfung in ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: »in ihm … durch ihn … auf ihn hin«
  alternative: »durch ihn … durch ihn … für ihn«
  rationale: Die drei verschiedenen Präpositionen werden unterschieden, damit die mehrschichtige Aussage über Bezug, Vermittlung und Ziel der Schöpfung nicht eingeebnet wird.
- issue: Art der »Throne, Herrschaften, Mächte und Gewalten«
  choice: Die Rang- oder Machtbezeichnungen werden ohne ontologische Präzisierung übersetzt.
  alternative: Ausdrückliche Bestimmung als ausschließlich engelhafte Ordnungen oder als menschliche politische Mächte
  rationale: Der Vers ordnet sie der geschaffenen Wirklichkeit zu, legt hier aber nicht eindeutig fest, ob nur geistliche, nur irdische oder beide Arten von Autorität gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überschaubarer Satzstruktur. Die traditionelle kosmische Begrifflichkeit bleibt erhalten, wird aber nicht konfessionell oder spekulativ ausgedeutet. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
