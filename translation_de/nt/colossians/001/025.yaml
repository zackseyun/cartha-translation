review_pass:
  verdict: revise
  source_fidelity: Die Fassung trifft den Satzbau und die Grundbezüge weitgehend, doch „Verantwortung“ gibt οἰκονομία zu allgemein wieder und „ganz zur Geltung zu bringen“ ist für πληρῶσαι stärker umschreibend als nötig. Der Genitiv τοῦ θεοῦ sollte als Herkunft bzw. göttliche Beauftragung erkennbar bleiben, ohne seine genaue Nuance weiter festzulegen.
  naturalness: „Ihr Diener“ ist als Rückverweis zwar möglich, kann im Deutschen wegen der Großschreibung jedoch wie eine Anrede wirken. „Deren Diener“ stellt den Bezug auf die in V. 24 genannte Gemeinde klar her. Die revidierte Formulierung bleibt modernes, würdevolles Standarddeutsch.
  terminology: „Anvertraute Aufgabe“ vermittelt den Charakter von οἰκονομία als übertragener Verwaltung bzw. Beauftragung besser als das abstraktere „Verantwortung“. „Das Wort Gottes zu erfüllen“ hält die umstrittene Reichweite von πληρῶσαι offen; die Fußnote dokumentiert die möglichen engeren Deutungen.
  issues:
  - severity: medium
    issue: „Verantwortung“ für οἰκονομία
    rationale: Das Wort kann zwar eine Folge des Auftrags bezeichnen, gibt aber die zentrale Vorstellung einer anvertrauten Verwaltung/Beauftragung nur abgeschwächt wieder.
  - severity: medium
    issue: „ganz zur Geltung zu bringen“ für πληρῶσαι
    rationale: Die Wendung ist natürlich, legt aber eine bestimmte idiomatische Deutung nahe und entfernt sich stärker als erforderlich von der bewusst mehrdeutigen Vollendungs-/Erfüllungsmetaphorik des griechischen Verbs.
  - severity: low
    issue: „Ihr Diener“ als Rückverweis
    rationale: Die Großschreibung kann als förmliche Anrede gelesen werden. Ein Relativanschluss ist eindeutiger.
  revised_text: Deren Diener bin ich geworden gemäß der mir von Gott für euch anvertrauten Aufgabe, um das Wort Gottes zu erfüllen.[a]
