revisions:
- from: Ihr Diener bin ich geworden gemäß der Verantwortung, die Gott mir für euch übertragen hat, um das Wort Gottes ganz zur Geltung zu bringen.[a]
  to: Deren Diener bin ich geworden gemäß der mir von Gott für euch anvertrauten Aufgabe, um das Wort Gottes zu erfüllen.[a]
  rationale: Die Revision verdeutlicht den Bezug des Relativpronomens auf die Gemeinde, bewahrt bei οἰκονομία den Gedanken einer von Gott anvertrauten Aufgabe und verwendet für πληρῶσαι die weniger interpretierende Grundwiedergabe „erfüllen“. Die Fußnote hält die wesentlichen alternativen Verständnisse fest, ohne sie im Haupttext zu entscheiden.
  reviewer_model: gpt-5.6-terra
