source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: de
  text: Deren Diener bin ich geworden gemäß der mir von Gott für euch anvertrauten Aufgabe, um das Wort Gottes zu erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das Wort Gottes vollständig bekannt zu machen“ oder „das Wort Gottes zu vollenden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: Ihr
  rationale: Das feminine Relativpronomen bezieht sich auf ἐκκλησία („Gemeinde“) in Vers 24. Das possessive „Ihr“ stellt diesen Rückbezug im Deutschen natürlich her.
- source_word: ἐγενόμην
  choice: bin ich geworden
  rationale: 'Gibt den ingressiven Sinn des Aorists von γίνομαι wieder: Paulus trat in diesen Dienst ein.'
- source_word: διάκονος
  choice: Diener
  rationale: Bezeichnet hier jemanden, der der Gemeinde dient, ohne zwingend ein später fest umrissenes kirchliches Amt zu meinen.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: gemäß der Verantwortung, die Gott mir … übertragen hat
  rationale: οἰκονομία bezeichnet eine anvertraute Verwaltung, Aufgabe oder Beauftragung. „Verantwortung … übertragen“ bewahrt den Gedanken des Anvertrautseins und ist in modernem Deutsch verständlich.
- source_word: εἰς ὑμᾶς
  choice: für euch
  rationale: Drückt die auf die Adressaten gerichtete und ihnen zugutekommende Ausrichtung des Auftrags aus.
- source_word: πληρῶσαι
  choice: ganz zur Geltung zu bringen
  rationale: Die Formulierung wahrt die Vorstellung des Vollmachens, ohne vorschnell nur Verkündigung, Erfüllung oder Vollendung festzulegen.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Bewahrt die geläufige biblische Ausdrucksweise und lässt offen, ob besonders Gottes Botschaft, Offenbarung oder Verkündigungswort im Blick steht.
theological_decisions:
- issue: Bedeutung von πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes ganz zur Geltung zu bringen
  alternative: das Wort Gottes zu erfüllen; vollständig bekannt zu machen; zu vollenden
  rationale: Die Wendung kann das volle Ausrichten beziehungsweise Bekanntmachen der Botschaft, ihre Erfüllung oder ihre Vollendung bezeichnen. Die Hauptfassung hält diese Bedeutungsbreite möglichst offen; die Fußnote nennt die engeren Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Ihr Diener“ erhält den Anschluss an die in Vers 24 genannte Gemeinde. „Verantwortung“ vermeidet sowohl das altertümliche „Haushalterschaft“ als auch eine unnötige Festlegung auf ein kirchliches Amt.
