source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: de
  text: Dafür[a] mühe ich mich auch ab und ringe, seinem[b] Wirken entsprechend, das in mir mit Kraft wirkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Zu diesem Zweck“ oder „wofür“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text sagt „seinem“, ohne hier ausdrücklich zu benennen, ob Gott oder Christus gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dafür
  rationale: Die Wendung verweist auf das zuvor genannte Ziel von Paulus’ Dienst. „Dafür“ ist im Deutschen knapp und natürlich, ohne den Bezug enger festzulegen.
- source_word: καὶ
  choice: auch
  rationale: καί verbindet Paulus’ eigenen Einsatz additiv mit dem vorher Gesagten.
- source_word: κοπιῶ
  choice: mühe ich mich ab
  rationale: κοπιάω bezeichnet anstrengende, ermüdende Arbeit. „Sich abmühen“ gibt diese Intensität in gegenwärtigem Deutsch treffend wieder.
- source_word: ἀγωνιζόμενος
  choice: und ringe
  rationale: Das Partizip beschreibt intensiven Einsatz wie in einem Wettkampf oder Kampf. Die koordinierte Formulierung ist im Deutschen natürlicher als eine enge Partizipialkonstruktion.
- source_word: κατὰ τὴν ἐνέργειαν αὐτοῦ
  choice: seinem Wirken entsprechend
  rationale: 'κατά bezeichnet hier Maßstab oder Entsprechung: Paulus’ Ringen entspricht dem in ihm tätigen Wirken. Die Formulierung vermeidet, dieses Wirken lediglich als Mittel wiederzugeben.'
- source_word: ἐνέργειαν … ἐνεργουμένην
  choice: Wirken … wirkt
  rationale: Die verwandten deutschen Wörter spiegeln die griechische Wortverbindung und bezeichnen wirksame, fortdauernde Tätigkeit.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: „In mir“ entspricht der örtlichen Grundbedeutung von ἐν und bewahrt die Spannung zwischen innerer Befähigung und äußerem Dienst.
- source_word: ἐν δυνάμει
  choice: mit Kraft
  rationale: Die Formulierung ist natürliches Deutsch, bewahrt aber die substantivische Aussage von δύναμις.
theological_decisions:
- issue: Bezugswort von αὐτοῦ („seinem“)
  choice: Das Pronomen „seinem“ bleibt ohne ausdrückliche Benennung des Bezugswortes stehen.
  alternative: „Gottes Wirken“ oder „Christi Wirken“
  rationale: Der Vers selbst nennt das Bezugswort nicht ausdrücklich. Eine Festlegung auf Gott oder Christus würde eine kontextuelle Deutung in den Haupttext aufnehmen und die im Griechischen vorhandene Offenheit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mühe ich mich ab“ und „ringe“ vermitteln den starken persönlichen Einsatz; „Wirken … wirkt“ erhält bewusst die Wortverwandtschaft des griechischen Ausdrucks.
