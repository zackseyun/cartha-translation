  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: de
  text: Auch euch, die ihr einst entfremdet und in eurem Denken feindselig wart und böse Taten begingt[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Wortlaut: „… die ihr einst entfremdet und Feinde im Denken, in bösen Taten wart“. Das Griechische lässt offen, wie genau die Feindseligkeit im Denken und die bösen Taten miteinander verbunden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Auch euch
  rationale: Der Akkusativ setzt den Satz aus dem folgenden Vers fort und bezieht die Adressaten ausdrücklich in das Versöhnungshandeln ein. „Auch euch“ gibt Anschluss und Hervorhebung natürlich wieder.
- source_word: ποτε
  choice: einst
  rationale: Kennzeichnet knapp den früheren Zustand der Adressaten im Gegensatz zu ihrer gegenwärtigen Versöhnung.
- source_word: ὄντας
  choice: die ihr … wart
  rationale: Der griechische Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben, ohne seine beschreibende Funktion zu verlieren.
- source_word: ἀπηλλοτριωμένους
  choice: entfremdet
  rationale: Das Perfektpartizip bezeichnet einen bestehenden Zustand der Trennung oder Entfremdung; „entfremdet“ bewahrt den relationalen Sinn.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: in eurem Denken feindselig
  rationale: ἐχθρούς kann substantivisch „Feinde“ oder prädikativ im Sinn von „feindlich/feindselig“ verstanden werden. Die Wiedergabe ist im Deutschen natürlich und lässt den inneren Bereich der Feindschaft erkennen.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: wie sich in euren bösen Taten zeigte
  rationale: Die Präpositionalphrase bezeichnet wahrscheinlich den Bereich oder die sichtbare Ausprägung der feindseligen Haltung. Die Formulierung macht diese Beziehung verständlich, ohne einen ausdrücklichen Kausalzusammenhang zu behaupten.
- source_word: ἔργοις
  choice: Taten
  rationale: „Taten“ ist im heutigen Deutsch hier natürlicher als „Werke“ und vermeidet sachfremde Anklänge an andere paulinische Diskussionen über Werke.
- source_word: πονηροῖς
  choice: bösen
  rationale: Gibt die moralische Wertung direkt, klar und ohne altertümlichen Klang wieder.
theological_decisions:
- issue: Verhältnis der inneren Feindseligkeit zu den bösen Taten
  choice: Die bösen Taten werden als sichtbare Ausprägung der inneren Feindseligkeit wiedergegeben.
  alternative: „in eurem Denken Feinde in den bösen Taten“ oder kausal „wegen eurer bösen Taten“
  rationale: Das griechische ἐν kann Bereich, Erscheinungsform oder mittelbar auch eine engere Beziehung ausdrücken. Die Hauptfassung vermeidet eine nicht ausdrücklich markierte Kausalbehauptung; die Fußnote bewahrt die kompakte und mehrdeutige Struktur.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bewahrt den offenen Satzbau des griechischen Versfragments, das im folgenden Vers fortgeführt wird.
