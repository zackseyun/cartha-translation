id: COL.1.23
reference: Colossians 1:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: de
  text: wenn ihr wirklich im Glauben bleibt, fest gegründet und standhaft, und euch nicht von der Hoffnung des Evangeliums abbringen lasst, das ihr gehört habt und das in der ganzen Schöpfung unter dem Himmel[a] verkündet worden ist. Dessen Diener bin ich, Paulus, geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedem Geschöpf unter dem Himmel“. Das griechische Wort kann sowohl „Schöpfung“ als auch „Geschöpf“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: wenn ihr nur
  rationale: Bewahrt die echte Bedingung und gibt die hervorhebende Partikel γε idiomatisch wieder, ohne sie zu einer Feststellung („da ihr ja“) umzudeuten.
- source_word: ἐπιμένετε τῇ πίστει
  choice: im Glauben bleibt
  rationale: Drückt das fortdauernde Verharren aus; der Artikel und der Kontext erlauben die etablierte Wendung „im Glauben“.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: auf ein festes Fundament gegründet und standhaft
  rationale: Das Perfekt Passiv bezeichnet einen durch vorausgegangenes Handeln bestehenden Zustand. Die Formulierung erhält das Fundamentbild und verbindet es natürlich mit ἑδραῖοι.
- source_word: μὴ μετακινούμενοι
  choice: euch nicht … abbringen lasst
  rationale: Gibt den passiven Sinn des Verrückt- oder Wegbewegtwerdens in natürlichem Deutsch wieder und bewahrt den Gedanken äußeren Einflusses.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: von der Hoffnung des Evangeliums
  rationale: 'Bewahrt die offene Genitivbeziehung: die mit dem Evangelium verbundene beziehungsweise durch es vermittelte Hoffnung.'
- source_word: τοῦ κηρυχθέντος
  choice: das … verkündet worden ist
  rationale: Der Aorist Passiv wird als erfolgte öffentliche Verkündigung wiedergegeben, ohne kirchenspezifische Verengung.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: in der ganzen Schöpfung unter dem Himmel
  rationale: κτίσις wird hier primär kollektiv-kosmisch als „Schöpfung“ verstanden; die Fußnote wahrt die mögliche personale Lesart „jedem Geschöpf“.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: Sein Diener bin ich, Paulus, geworden
  rationale: Das Relativpronomen bezieht sich am natürlichsten auf das Evangelium. „Diener“ vermeidet einen unnötig institutionalisierten Amtsbegriff und ἐγώ wird durch die markierte Wortstellung hervorgehoben.
theological_decisions:
- issue: Bedingungscharakter von εἴ γε und Beharren im Glauben
  choice: „wenn ihr nur im Glauben bleibt“ als echte, nachdrückliche Bedingung
  alternative: „da ihr ja im Glauben bleibt“ oder eine Formulierung, die ausdrücklich einen möglichen Heilsverlust behauptet
  rationale: Der griechische Text stellt das Bleiben im Glauben als Bedingung dar, entscheidet aber für sich genommen weder die umfassende Lehre garantierter Beharrlichkeit noch die Frage eines möglichen Heilsverlusts.
- issue: Bedeutung von πίστις in τῇ πίστει
  choice: Glauben
  alternative: Treue oder Vertrauen
  rationale: In dieser Konstruktion bezeichnet πίστις am wahrscheinlichsten den Glauben als Lebensbereich beziehungsweise den angenommenen Glauben; „Treue“ ist hier weniger naheliegend.
- issue: Universalität der Evangeliumsverkündigung
  choice: nahezu wörtliche kosmisch-universale Aussage beibehalten
  alternative: als bloß regional weite Verbreitung erklären oder abschwächen
  rationale: Die Übersetzung bewahrt die rhetorische Weite des Textes und legt nicht fest, wie sie historisch oder hyperbolisch einzuordnen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang eng verbunden, wird aber durch einen neuen Hauptsatz am Ende lesbarer. „Auf ein festes Fundament gegründet“ macht das im Partizip enthaltene Fundamentbild deutlich; „euch nicht … abbringen lasst“ ist natürliches Deutsch und erhält den passiven Sinn.
