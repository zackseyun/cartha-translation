revisions:
- from: wenn ihr nur im Glauben bleibt, auf ein festes Fundament gegründet und standhaft, und euch nicht von der Hoffnung des Evangeliums abbringen lasst, das ihr gehört habt und das in der ganzen Schöpfung unter dem Himmel[a] verkündet worden ist. Sein Diener[b] bin ich, Paulus, geworden.
  to: wenn ihr wirklich im Glauben bleibt, fest gegründet und standhaft, und euch nicht von der Hoffnung des Evangeliums abbringen lasst, das ihr gehört habt und das in der ganzen Schöpfung unter dem Himmel[a] verkündet worden ist. Dessen Diener bin ich, Paulus, geworden.
  rationale: Die Revision ersetzt die im Deutschen potenziell missverständliche Wendung „wenn ihr nur“ durch eine klare emphatische Bedingung, strafft die Wiedergabe der beiden Stabilitätsbegriffe und glättet die Schlusskonstruktion. Die Ambiguität von κτίσις bleibt durch die Fußnote gewahrt. Da im revidierten Text keine Fußnotenmarkierung bei „Diener“ steht, wird die nicht verankerte Fußnote b nicht in die vollständige Fußnotensetzung übernommen.
