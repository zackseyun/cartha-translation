source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: de
  text: 'An die heiligen und treuen[a] Brüder[b] im Messias[c] in Kolossä: Gnade sei mit euch und Friede von Gott, unserem Vater.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gläubigen“. Das griechische Wort πιστοῖς kann Menschen bezeichnen, die glauben, oder solche, die treu sind.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „Brüder“; im Zusammenhang ist wahrscheinlich die ganze Gemeinde einschließlich der Frauen angesprochen.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „in Christus“. Der griechische Titel Χριστός bedeutet „Messias“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: an die … in Kolossä
  rationale: Die Dativkonstruktion bezeichnet die Empfänger nach ihrem Aufenthaltsort. Die deutsche Briefformel „an die … in Kolossä“ gibt dies natürlich und genau wieder.
- source_word: ἁγίοις
  choice: heiligen
  rationale: Das Adjektiv bezieht sich auf ἀδελφοῖς und bezeichnet die Empfänger als Gott zugehörig; „heilig“ bewahrt den Grundsinn, ohne die spätere Sonderbedeutung von „Heilige“ als einer bestimmten Personengruppe aufzudrängen.
- source_word: πιστοῖς
  choice: treuen
  rationale: πιστός kann sowohl „treu“ als auch „gläubig“ bedeuten. „Treu“ eignet sich als natürliche Charakterisierung, während die mögliche Bedeutung „gläubig“ in einer Fußnote erhalten bleibt.
- source_word: ἀδελφοῖς
  choice: Brüder
  rationale: „Brüder“ entspricht der grammatisch maskulinen Pluralform. Da Paulus damit im Zusammenhang wahrscheinlich die gesamte Gemeinde einschließlich der Frauen anspricht, wird dies in einer Fußnote erläutert.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός ist dem Ursprung nach ein Titel und bedeutet „Messias“ beziehungsweise „Gesalbter“. „Im Messias“ bewahrt sowohl den Titel als auch die paulinische Wendung des Seins in ihm.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Gnade sei mit euch und Friede
  rationale: Die ergänzte Kopula macht die knappe griechische Grußformel in würdevollem, verständlichem Deutsch idiomatisch, ohne ihren Inhalt oder ihre Reihenfolge wesentlich zu verändern.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: von Gott, unserem Vater
  rationale: Die Apposition „unserem Vater“ gibt die Genitivkonstruktion natürlich wieder und fügt keine im Griechischen fehlende Konjunktion ein.
theological_decisions:
- issue: Bedeutung von πιστοῖς
  choice: treuen
  alternative: gläubigen
  rationale: Der griechische Ausdruck kann Treue oder Glauben bezeichnen; der Haupttext entscheidet sich für „treu“, während die Fußnote die echte Bedeutungsbreite offenhält.
- issue: Geschlecht und Referenz von ἀδελφοῖς
  choice: Brüder
  alternative: Brüder und Schwestern; Geschwister
  rationale: Der Haupttext bildet die maskuline Form des griechischen Wortlauts ab. Die wahrscheinliche Einbeziehung der Frauen in der Gemeinde wird erklärt, statt die Form des Ausgangstextes stillschweigend zu neutralisieren.
- issue: Wiedergabe von Χριστῷ
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin seinen titularen Sinn. „Messias“ macht diesen Sinn sichtbar; die traditionelle Wiedergabe „Christus“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede folgt der deutschen Briefform, während „im Messias“ bewusst die prägnante paulinische Formel und den Titelcharakter von Χριστός erhält. Die knappe Grußformel wird durch „sei mit“ idiomatisch ergänzt.
