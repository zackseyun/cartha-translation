  source_fidelity: Der Text gibt ἀκούσαντες idiomatisch und im Anschluss an den Dank aus V. 3 als „Denn wir haben … gehört“ wieder. „eurem Glauben an Jesus, den Messias“ ist eine natürliche deutsche Auslegung der hier auf den Glauben bezogenen Wendung ἐν Χριστῷ Ἰησοῦ; der Titelcharakter von Χριστός bleibt gewahrt. Der Relativsatz ἣν ἔχετε und die umfassende Ausrichtung εἰς πάντας τοὺς ἁγίους sind vollständig abgebildet.
  naturalness: Modernes, verständliches und angemessen würdiges Standarddeutsch. „Liebe … zu allen Heiligen“ ist im kirchlich-biblischen Register idiomatisch, ohne unverständlich zu wirken. Die Apposition „Jesus, den Messias“ ist deutlich natürlicher als ein unübliches „Messias Jesus“.
  terminology: „Glaube“, „Liebe“, „Heilige“ und „Messias“ sind konsequent und sachgerecht. Die Fußnote markiert die verwandten möglichen Nuancen von πίστις, ohne die Kontextentscheidung des Haupttextes zu überladen.
