id: COL.1.4
reference: Colossians 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: de
  text: Denn wir haben von eurem Glauben an Jesus, den Messias, und von der Liebe gehört, die ihr zu allen Heiligen habt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von eurem Vertrauen auf Jesus, den Messias“; möglicherweise auch: „von eurer Treue in Jesus, dem Messias“. Das griechische Wort pistis kann je nach Zusammenhang Glaube, Vertrauen oder Treue bezeichnen.'
    reason: Bewahrt das Bedeutungsspektrum von πίστις, ohne die im Kontext wahrscheinlichste Lesart im Haupttext aufzugeben.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Denn wir haben … gehört
  rationale: Das Aoristpartizip nennt den Anlass des Dankes aus dem vorherigen Vers. Da ein entsprechendes deutsches Partizip schwerfällig wäre, wird der Zusammenhang idiomatisch als begründender Hauptsatz wiedergegeben.
- source_word: τὴν πίστιν ὑμῶν
  choice: eurem Glauben
  rationale: „Glaube“ ist in diesem Zusammenhang die naheliegende Wiedergabe von πίστις; die ebenfalls möglichen Nuancen „Vertrauen“ und „Treue“ bleiben in einer Fußnote erhalten.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: an Jesus, den Messias
  rationale: Bei πίστις bezeichnet ἐν hier die Beziehung beziehungsweise Ausrichtung des Glaubens. „An“ ist dafür im heutigen Deutsch natürlich. Χριστός wird als Titel übersetzt und durch die Apposition „Jesus, den Messias“ verständlich und idiomatisch ausgedrückt.
- source_word: τὴν ἀγάπην ἣν ἔχετε
  choice: von der Liebe …, die ihr … habt
  rationale: Die Wiedergabe bewahrt den im SBLGNT enthaltenen Relativsatz und bezeichnet die Liebe als gegenwärtige Haltung und Praxis der Adressaten.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: zu allen Heiligen
  rationale: „Zu“ gibt die Ausrichtung der Liebe idiomatisch wieder. „Heilige“ bewahrt Paulus’ übliche Bezeichnung für die zu Gott gehörenden Menschen.
theological_decisions:
- issue: Χριστός als Titel oder namensähnliche Form
  choice: Jesus, den Messias
  alternative: Christus Jesus
  rationale: Χριστός wird seinem Titelcharakter entsprechend übersetzt. Die deutsche Apposition vermeidet die unnatürliche Verbindung „Messias Jesus“, ohne den Titel zu einem bloßen Namen zu machen.
- issue: Bedeutungsspektrum von πίστις
  choice: Glaube
  alternative: Vertrauen oder Treue
  rationale: Im Zusammenhang mit Jesus als Bezugspunkt passt „Glaube“ am besten. Da πίστις auch Vertrauen oder Treue bezeichnen kann, werden diese Möglichkeiten nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Auflösung des griechischen Partizips als begründender Hauptsatz stellt den Anschluss an den vorherigen Vers natürlich her. Der Titel „Messias“ wird verständlich als Apposition zu „Jesus“ formuliert.
