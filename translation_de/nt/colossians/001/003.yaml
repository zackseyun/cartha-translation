  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: de
  text: Wir danken Gott, dem Vater unseres Herrn Jesus, des Messias, allezeit, wenn wir für euch beten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Jesus Christus“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: danken wir
  rationale: Εὐχαριστέω bezeichnet hier den Ausdruck des Dankes. Das natürliche deutsche Verb „danken“ gibt den Sinn im Zusammenhang eines brieflichen Dankgebets präzise wieder.
- source_word: θεῷ πατρὶ
  choice: Gott, dem Vater
  rationale: Die beiden Dative stehen am natürlichsten in Apposition. Das Komma macht deutlich, dass Gott als der Vater des Herrn Jesus bezeichnet wird.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ ist die übliche und sachlich angemessene Wiedergabe des christologischen Titels κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός hat weiterhin den Sinn des Titels „Messias“. Die appositionelle Formulierung ist im Deutschen grammatisch eindeutig; die traditionelle Wiedergabe „Jesus Christus“ wird in der Fußnote genannt.
- source_word: πάντοτε
  choice: Immer wenn
  rationale: πάντοτε bezeichnet die beständige Regelmäßigkeit des Dankens im Zusammenhang mit dem Gebet. Die vorangestellte Konstruktion ergibt natürliches modernes Deutsch, ohne den Dank als ununterbrochene Tätigkeit misszuverstehen.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: Bei einem Gebetsverb bezeichnet περί mit Genitiv die Personen, für die gebetet wird; „für euch“ ist die idiomatische deutsche Wiedergabe.
- source_word: προσευχόμενοι
  choice: wenn wir … beten
  rationale: Das präsentische Partizip beschreibt den zeitlichen beziehungsweise begleitenden Umstand des Dankens. Ein deutscher Nebensatz gibt diese Beziehung flüssig wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός im Namen-Titel-Gefüge Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: „Messias“ macht die Bedeutung des griechischen Titels sichtbar und behandelt Χριστός nicht stillschweigend wie einen bloßen Familiennamen. Da „Jesus Christus“ die fest eingebürgerte traditionelle Form ist, bleibt sie als Alternative in der Fußnote erhalten.
- issue: Bezug von πάντοτε
  choice: Der Dank erfolgt regelmäßig beim Gebet für die Adressaten
  alternative: „Allezeit danken wir …, während wir für euch beten“
  rationale: Die Wortstellung lässt eine gewisse Nähe sowohl zum Hauptverb als auch zum Partizip zu. Die gewählte Form verbindet die Beständigkeit mit dem wiederkehrenden Gebetsgeschehen, ohne eine ununterbrochene Handlung zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Briefstil. Die Voranstellung des Gebetssatzes vermeidet eine schwerfällige Häufung von Genitiven und Satzgliedern; die Apposition „des Messias“ bewahrt zugleich den Titelcharakter von Χριστός.
