translation:
  language: de
  text: In ihm haben wir die Erlösung[a], die Vergebung der Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für „Erlösung“: „Befreiung“. Beide zugrunde liegenden griechischen Begriffe können auch Freilassung oder Befreiung bezeichnen; mit „Vergebung der Sünden“ gibt Paulus hier wahrscheinlich näher an, worin diese Erlösung besteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: in dem
  rationale: Das maskuline Relativpronomen bezieht sich auf den geliebten Sohn im vorhergehenden Vers. „In dem“ bewahrt den personalen und relationalen Sinn, ohne die Wendung instrumental als „durch den“ festzulegen.
- source_word: ἔχομεν
  choice: wir haben
  rationale: Die schlichte Wiedergabe des Präsens drückt den gegenwärtigen Besitz der genannten Heilsgabe aus, ohne zusätzliche Deutung.
- source_word: ἀπολύτρωσιν
  choice: die Erlösung
  rationale: „Erlösung“ ist im Deutschen die natürliche, theologisch gewichtige Entsprechung und bewahrt den Gedanken einer befreienden Loslösung. „Freilassung“ oder „Befreiung“ bleiben mögliche lexikalische Annäherungen.
- source_word: ἄφεσιν
  choice: die Vergebung
  rationale: Im Zusammenhang mit Sünden ist „Vergebung“ die klarste moderne Entsprechung. Der Ausdruck steht als Apposition zu „Erlösung“ und erläutert, worin diese hier besteht.
- source_word: τῶν ἁμαρτιῶν
  choice: der Sünden
  rationale: Der Genitiv bezeichnet den Gegenstand der Vergebung; „der Sünden“ entspricht dem griechischen Ausdruck präzise und idiomatisch.
theological_decisions:
- issue: Verhältnis zwischen „Erlösung“ und „Vergebung der Sünden“
  choice: 'Die zweite Nominalgruppe wird appositionell wiedergegeben: „die Erlösung, die Vergebung der Sünden“'
  alternative: 'Deutender: „die Erlösung, das heißt die Vergebung der Sünden“'
  rationale: Das Griechische stellt beide Ausdrücke appositionell nebeneinander. Die Übersetzung bewahrt diese enge Zuordnung, ohne eine nicht ausdrücklich vorhandene Erklärung einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Wortstellung hält den Bezug zu Christus („in dem“) und die appositionelle Struktur des griechischen Satzes sichtbar.
