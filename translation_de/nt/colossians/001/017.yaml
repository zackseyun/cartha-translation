translation:
  language: de
  text: Und er ist vor allem[a], und alles hat in ihm Bestand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Vor allem“ bezeichnet hier in erster Linie zeitliche Priorität: Er ist vor allem anderen. Im Zusammenhang kann die Formulierung auch seinen Vorrang über alles anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „alles besteht in ihm“ oder „alles wird in ihm zusammengehalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen hebt Christus hervor. Im Deutschen gibt „er“ diese Hervorhebung im Zusammenhang natürlich wieder; „er selbst“ wäre möglich, könnte die Betonung aber unnötig verstärken.
- source_word: πρὸ πάντων
  choice: vor allen Dingen
  rationale: πρό mit dem Genitiv bezeichnet hier in erster Linie zeitliche Priorität. „Vor allen Dingen“ bewahrt den umfassenden Bezug und vermeidet die rein rangmäßige Deutung „über allem“.
- source_word: τὰ πάντα
  choice: alles
  rationale: Der substantivierte Plural ist umfassend. „Alles“ ist im heutigen Deutsch natürlich und engt den Bezug nicht ausdrücklich auf „die ganze Schöpfung“ ein.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: „In ihm“ gibt ἐν αὐτῷ unmittelbar wieder und bewahrt die mögliche Vorstellung von Sphäre beziehungsweise erhaltender Beziehung, ohne sie einseitig instrumental als „durch ihn“ aufzulösen.
- source_word: συνέστηκεν
  choice: hat Bestand
  rationale: Das Perfekt bezeichnet einen aus vorausgegangenem Geschehen hervorgegangenen, fortdauernden Zustand. „Hat Bestand“ drückt verständlich aus, dass alles in ihm geordnet fortbesteht, und bewahrt zugleich mehr Offenheit als eine ausführliche Deutung wie „wird zusammengehalten“.
theological_decisions:
- issue: Das Verhältnis Christi zu allem in πρὸ πάντων
  choice: 'Zeitliche Priorität: „vor allen Dingen“'
  alternative: 'Vorrang oder Hoheit: „über allen Dingen“'
  rationale: Die griechische Präposition bezeichnet am natürlichsten Priorität. Der Zusammenhang trägt zugleich eine Aussage über Christi Vorrang, doch diese wird nicht anstelle des primären Wortlauts in den Haupttext eingesetzt.
- issue: Die Aussagekraft von συνέστηκεν
  choice: 'Fortdauernder Bestand und Zusammenhalt: „hat in ihm Bestand“'
  alternative: „wird durch ihn zusammengehalten“ oder „besteht in ihm“
  rationale: Die Form kann sowohl geordnetes Fortbestehen als auch Kohärenz ausdrücken. „Hat Bestand“ gibt den resultativen Zustand des Perfekts wieder, ohne den Satz ausschließlich kausal oder instrumental auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „und“ bildet die griechische Satzverknüpfung nach. „Dinge“ ist hier umfassend und nicht auf unbelebte Gegenstände beschränkt.
