  text: damit ihr so lebt, wie es des Herrn würdig ist, und ihm in jeder Hinsicht gefällt[a], indem ihr in jedem guten Werk Frucht bringt und in der Erkenntnis Gottes wachst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zu allem Wohlgefallen“. Derjenige, dem sie gefallen sollen, wird im Griechischen nicht ausdrücklich genannt; aus dem Zusammenhang ist der Herr gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der vollen (oder vertieften) Erkenntnis Gottes“. Das griechische Wort kann eine umfassendere oder tiefere Erkenntnis bezeichnen. Möglich ist auch: „durch die Erkenntnis Gottes“.'
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: so lebt
  rationale: Das griechische Verb bedeutet wörtlich „gehen“ oder „wandeln“, bezeichnet hier aber wie häufig bei Paulus die Lebensführung. „So lebt“ gibt die Metapher verständlich und natürlich wieder.
- source_word: ἀξίως τοῦ κυρίου
  choice: wie es des Herrn würdig ist
  rationale: Die Formulierung bewahrt den Bezug auf den Herrn und bezeichnet ein Leben, das seiner würdig beziehungsweise ihm angemessen ist.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: und ihm in jeder Hinsicht gefallt
  rationale: Das Substantiv ἀρεσκεία bezeichnet das Gefallen oder Wohlgefallen. Im Deutschen verlangt eine natürliche Wiedergabe eine Ergänzung; „ihm“ nimmt den im Kontext naheliegenden Bezug auf den Herrn ausdrücklich auf, ohne die Aussage inhaltlich einzuengen.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: Ihr bringt in jedem guten Werk Frucht
  rationale: „Frucht bringen“ erhält das organische Bild und den möglichen Rückbezug auf 1,6; „in jedem guten Werk“ bewahrt die umfassende Aussage von παντί.
- source_word: αὐξανόμενοι
  choice: und wachst
  rationale: Das Präsenspartizip bezeichnet einen fortdauernden Wachstumsprozess und steht parallel zu „Frucht bringen“.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: in der Erkenntnis Gottes
  rationale: Der Dativ wird als Bereich oder Hinsicht des Wachstums verstanden. „Erkenntnis“ kann im Deutschen sowohl Wissen als auch vertieftes Erkennen bezeichnen, ohne die mögliche Nuance von ἐπίγνωσις zu überpräzisieren.
theological_decisions:
- issue: Unausgesprochener Bezug von ἀρεσκεία
  choice: „ihm in jeder Hinsicht gefallt“, mit dem Herrn als kontextuellem Bezug
  alternative: „zu allem Wohlgefallen“, ohne ausdrückliches Bezugswort
  rationale: Obwohl im Griechischen kein Objekt ausdrücklich genannt wird, weist der unmittelbar vorausgehende „Herr“ deutlich auf denjenigen, dem das Leben gefallen soll. Die explizite Wiedergabe ist im modernen Deutschen wesentlich natürlicher; eine Fußnote bewahrt die formale Eigenart.
- issue: Bedeutungsnuance von ἐπίγνωσις
  choice: „Erkenntnis“ im Haupttext
  alternative: „volle Erkenntnis“ oder „vertiefte Erkenntnis“
  rationale: ἐπίγνωσις kann umfassende oder vertiefte Erkenntnis andeuten, doch ist diese Verstärkung nicht in jedem Kontext zwingend. Die weniger festlegende Haupttextfassung bewahrt die Spannung; die mögliche Nuance wird in der Fußnote genannt.
- issue: Funktion des Dativs τῇ ἐπιγνώσει
  choice: Wachstum „in der Erkenntnis Gottes“
  alternative: Wachstum „durch die Erkenntnis Gottes“
  rationale: Der Dativ kann als Bereich/Hinsicht oder instrumental verstanden werden. Die Fassung „in der Erkenntnis“ passt unmittelbar zur Vorstellung zunehmender Erkenntnis, ohne die mögliche instrumentale Lesart dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „würdig wandeln“ wird zugunsten des allgemein verständlichen „so lebt, wie es … würdig ist“ vermieden. Der Doppelpunkt macht die beiden Partizipien als Entfaltung der würdigen Lebensführung lesbar, ohne ihren fortdauernden Charakter aufzugeben.
