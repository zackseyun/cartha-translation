  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: de
  text: indem ihr mit aller Kraft gestärkt werdet, nach der Macht seiner Herrlichkeit[a], zu aller Standhaftigkeit und Geduld mit Freude,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach seiner herrlichen Macht“. Wörtlicher lautet das Griechische: „nach der Macht seiner Herrlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: indem ihr mit aller Kraft gestärkt werdet
  rationale: Das Partizip Präsens Passiv bezeichnet ein fortdauerndes Gestärktwerden; Gott ist im Gebetszusammenhang der unausgesprochene Handelnde. „Mit aller Kraft“ gibt ἐν instrumental und idiomatisch wieder und bewahrt den umfassenden Sinn von πάσῃ.
- source_word: κατὰ τὸ κράτος
  choice: nach der Macht
  rationale: κατά mit Akkusativ bezeichnet hier Maßstab oder Entsprechung. „Nach“ wahrt diese Beziehung; „Macht“ gibt κράτος als wirksame Stärke wieder und lässt die Häufung der Kraftbegriffe erkennen.
- source_word: τῆς δόξης αὐτοῦ
  choice: seiner Herrlichkeit
  rationale: Die Genitivverbindung wird formal bewahrt, statt sie zur adjektivischen Wendung „seiner herrlichen Macht“ aufzulösen.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: zu aller Standhaftigkeit
  rationale: εἰς kann Ziel oder Ergebnis anzeigen; „zu“ lässt beides offen. ὑπομονή bezeichnet standhaftes Ausharren unter Belastungen, wofür „Standhaftigkeit“ im Deutschen prägnant ist.
- source_word: μακροθυμίαν
  choice: Geduld
  rationale: „Geduld“ ist eine natürliche, heutige Wiedergabe und unterscheidet sich sinnvoll von der auf Belastungen bezogenen „Standhaftigkeit“.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Die Präpositionalphrase wird direkt wiedergegeben. Ihre genaue syntaktische Zuordnung bleibt offen, wie im Griechischen.
theological_decisions:
- issue: Beziehung der göttlichen Stärkung zu Gottes Herrlichkeit
  choice: „nach der Macht seiner Herrlichkeit“
  alternative: „nach seiner herrlichen Macht“
  rationale: Die gewählte Fassung erhält die dichte Genitivkonstruktion des Griechischen und vermeidet eine erklärende Glättung, ohne die mögliche Bedeutung der Alternative auszuschließen.
- issue: Syntaktische Zuordnung von μετὰ χαρᾶς
  choice: „mit Freude“ bleibt durch die Kommasetzung anschlussfähig an Standhaftigkeit und Geduld
  alternative: Anschluss an das folgende Dankmotiv in Vers 12
  rationale: Die Interpunktion ist nicht Teil des ursprünglichen griechischen Textes. Die Fassung wahrt die naheliegende Verbindung mit dem Ausharren, legt die syntaktische Grenze aber nicht stärker als nötig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kraftvolle Wiederholung der griechischen Wortfamilie δύναμις/δυναμόω wird durch „Kraft/gestärkt“ teilweise erhalten; zugleich bleibt die Genitivfügung „Macht seiner Herrlichkeit“ bewusst stehen. Der Versausschnitt endet mit Komma, da der Satz im Kontext weiterläuft.
