id: COL.1.22
reference: Colossians 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: de
  text: Jetzt aber seid ihr in seinem menschlichen Leib durch den Tod versöhnt worden[a], um euch heilig, makellos[b] und frei von jeder Anklage vor ihm hinzustellen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder aktiv: »Jetzt aber hat er euch in seinem menschlichen Leib durch den Tod versöhnt.« Das griechische Verb steht im Passiv; der Handelnde wird nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: b
    text: »Makellos« kann auch mit »ohne Makel« wiedergegeben werden; damit tritt der mögliche Anklang an ein fehlerloses Opfer deutlicher hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Jetzt aber
  rationale: Bewahrt sowohl den zeitlichen Übergang als auch den Gegensatz zum früheren Zustand in Vers 21.
- source_word: ἀποκατηλλάγητε
  choice: hat er euch … versöhnt
  rationale: Gibt die vollendete Versöhnung in natürlichem Deutsch wieder. Das griechische Verb steht formal im Passiv; diese Mehrdeutigkeit wird in Fußnote [a] offengelegt.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: in seinem menschlichen Leib
  rationale: Drückt die konkrete, leibliche Menschlichkeit aus, ohne σάρξ hier fälschlich als moralisch belastete »sündige Natur« zu verstehen. Die wörtlichere Form »im Leib seines Fleisches« wäre im heutigen Deutsch unnötig sperrig.
- source_word: διὰ τοῦ θανάτου
  choice: durch den Tod
  rationale: Bewahrt die instrumentale Bedeutung von διά mit Genitiv und lässt wie der griechische Wortlaut offen, ob »seinen Tod« ausdrücklich ergänzt werden soll.
- source_word: παραστῆσαι
  choice: um … hinzustellen
  rationale: Gibt den Zweckbezug des Infinitivs wieder und erhält das Bild, jemanden vor eine Person zu stellen beziehungsweise vorzuführen.
- source_word: ἁγίους
  choice: heilig
  rationale: Die übliche und sachgerechte Wiedergabe, die Zugehörigkeit zu Gott und Reinheit umfasst.
- source_word: ἀμώμους
  choice: makellos
  rationale: Bewahrt neben moralischer Untadeligkeit auch den möglichen kultisch-opferbezogenen Anklang an etwas Fehlerloses beziehungsweise ohne Makel.
- source_word: ἀνεγκλήτους
  choice: frei von jeder Anklage
  rationale: Bringt den forensischen Sinn klarer zum Ausdruck als das allgemeinere »untadelig« und unterscheidet das Wort von ἀμώμους.
- source_word: κατενώπιον αὐτοῦ
  choice: vor ihm
  rationale: Bewahrt den relationalen und prüfenden Rahmen und legt den Bezug des Pronomens nicht unnötig auf Gott oder Christus fest.
theological_decisions:
- issue: Handelnde Person beim Passiv ἀποκατηλλάγητε
  choice: 'Im Haupttext aktiv: »hat er euch versöhnt«'
  alternative: 'Formal passiv: »seid ihr versöhnt worden«'
  rationale: Der Kontext legt göttliches Handeln nahe, doch die griechische Verbform ist passiv. Die Fußnote bewahrt diese grammatische Spannung, statt die aktive Wiedergabe als einzig mögliche Lesart erscheinen zu lassen.
- issue: Bedeutung von σάρξ in der Wendung »Leib des Fleisches«
  choice: 'physisch-menschlicher Sinn: »menschlicher Leib«'
  alternative: 'Wörtlicher: »Leib aus Fleisch«; unzutreffend wäre hier »sündige Natur«'
  rationale: Die Wendung betont den wirklichen, sterblichen Leib Christi. Eine moralische Deutung von σάρξ ist in diesem Zusammenhang nicht begründet.
- issue: Unterscheidung von ἀμώμους und ἀνεγκλήτους
  choice: »makellos und frei von jeder Anklage«
  alternative: »untadelig und unbescholten«
  rationale: Die gewählte Fassung hält den möglichen kultischen Klang von ἀμωμός und den forensischen Klang von ἀνέγκλητος auseinander.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Menschlicher Leib« vermeidet die altertümlich-sperrige Form »Leib seines Fleisches«, bewahrt aber die Betonung wirklicher Leiblichkeit. »Frei von jeder Anklage« ist bewusst etwas ausführlicher, um den rechtlichen Klang des griechischen Ausdrucks verständlich zu erhalten.
