reference: Colossians 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: de
  text: Deshalb hören auch wir seit dem Tag, an dem wir davon gehört haben, nicht auf, für euch zu beten und darum zu bitten, dass ihr mit der Erkenntnis[a] seines Willens erfüllt werdet, in aller geistlichen[b] Weisheit und Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „volle Erkenntnis“ oder „vertiefte Erkenntnis“. Das griechische Wort kann eine umfassendere oder tiefere Erkenntnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Geistlich“ kann die Art dieser Weisheit und Einsicht bezeichnen oder bedeuten, dass sie vom Geist gegeben sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Deshalb
  rationale: Die Wendung ist kausal-folgernd und verweist auf den vorausgehenden Bericht über den Glauben und die Liebe der Kolosser. „Deshalb“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: καὶ ἡμεῖς
  choice: auch wir
  rationale: Das καί und das ausdrücklich gesetzte Pronomen beziehen Paulus und seine Mitarbeiter nachdrücklich in die geschilderte Reaktion ein.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: seit dem Tag, an dem wir davon gehört haben
  rationale: Die Formulierung bezeichnet den Ausgangspunkt des bis in die Gegenwart fortdauernden Gebets. „Davon“ nimmt im Deutschen natürlich den vorausgehenden Bericht auf.
- source_word: οὐ παυόμεθα
  choice: hören … nicht auf
  rationale: Die Präsensform bezeichnet ein anhaltendes Handeln. Die deutsche Konstruktion ist gegenwärtig und idiomatisch.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: ὑπέρ bezeichnet hier das Eintreten zugunsten der Adressaten im Gebet.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: für euch zu beten und darum zu bitten
  rationale: 'Beide Partizipien bleiben erkennbar: προσεύχομαι bezeichnet das Beten allgemein, αἰτέω die konkrete Bitte. „Darum“ leitet natürlich den folgenden Inhaltssatz ein.'
- source_word: ἵνα πληρωθῆτε
  choice: dass ihr … erfüllt werdet
  rationale: Der ἵνα-Satz gibt den Inhalt der Bitte an. Das Passiv bleibt erhalten und lässt den Handelnden, dem griechischen Text entsprechend, unausgesprochen.
- source_word: τὴν ἐπίγνωσιν
  choice: mit der Erkenntnis
  rationale: ἐπίγνωσις kann eine volle oder vertiefte Erkenntnis bezeichnen. „Erkenntnis“ wahrt die Bedeutung, ohne den möglichen Intensivton im Haupttext festzuschreiben; die Inhaltsangabe beim Verb wird im Deutschen idiomatisch mit „mit“ ausgedrückt.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: seines Willens
  rationale: Die Genitivverbindung wird direkt und idiomatisch wiedergegeben.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: in aller geistlichen Weisheit und Einsicht
  rationale: „In“ bewahrt die mögliche Bedeutung als Bereich oder begleitende Weise. Das nachgestellte Adjektiv πνευματικῇ kann sich sinngemäß auf Weisheit und Einsicht gemeinsam beziehen; die deutsche Stellung lässt diese Verbindung zu.
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: „Weisheit“ ist die übliche und sachlich passende Entsprechung und umfasst hier lebenspraktische wie geistliche Urteilsfähigkeit.
- source_word: συνέσει
  choice: Einsicht
  rationale: σύνεσις bezeichnet verstehendes Erfassen und Unterscheidungsvermögen. „Einsicht“ ergänzt „Weisheit“ prägnant, ohne beide Begriffe gleichzusetzen.
theological_decisions:
- issue: Bedeutungsstärke von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis; vertiefte Erkenntnis
  rationale: Das Wort kann bei Paulus einen intensivierten Sinn tragen, doch die Intensivierung ist nicht in jedem Zusammenhang zwingend lexikalisch festgelegt. Der Haupttext bleibt zurückhaltend; die mögliche Nuance wird in einer Fußnote erhalten.
- issue: Bezug und Bedeutung von πνευματικῇ
  choice: geistlich, auf Weisheit und Einsicht bezogen
  alternative: vom Geist gegebene Weisheit und Einsicht
  rationale: πνευματικός kann eine geistliche Beschaffenheit oder einen Bezug zum Heiligen Geist ausdrücken. Der griechische Ausdruck nennt den Geist nicht ausdrücklich; deshalb bleibt der Haupttext offen und die mögliche Geber-Beziehung wird in der Fußnote genannt.
- issue: Anschluss von ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: in aller geistlichen Weisheit und Einsicht
  alternative: mit aller geistlichen Weisheit und Einsicht
  rationale: Die Präpositionalgruppe kann den Bereich oder die Weise des Erfülltwerdens beziehungsweise der Erkenntnis beschreiben. Die Beibehaltung von „in“ vermeidet eine unnötige syntaktische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber durch „darum“ und die idiomatische Konstruktion „nicht aufhören“ gut verständlich. Die mehrdeutigen Nuancen von ἐπίγνωσις und πνευματικῇ werden nicht dogmatisch vereindeutigt.
