id: COL.1.20
reference: Colossians 1:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: de
  text: und durch ihn alles mit sich zu versöhnen[a][b], indem er Frieden schuf durch das Blut seines Kreuzes – durch ihn[c] –, sei es das auf der Erde oder das in den Himmeln[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Alles“ bleibt hier entsprechend dem Griechischen und der folgenden Wendung „sei es das auf der Erde oder das in den Himmeln“ umfassend. Der Vers selbst legt nicht fest, wie sich diese Versöhnung zur endgültigen Rettung verhält.
    reason: alternative_reading
  - marker: b
    text: 'Oder bei beiden Vorkommen von „durch ihn“: „durch seine Vermittlung“.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften lassen das zweite „durch ihn“ aus.
    reason: textual_variant
  - marker: d
    text: Im Griechischen steht „Himmel“ im Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit dem Genitiv bezeichnet hier Vermittlung oder Mittel. „Durch ihn“ ist natürlich und bewahrt die wiederholte Aussage, dass der Sohn der Mittler der Versöhnung ist.
- source_word: ἀποκαταλλάξαι
  choice: zu versöhnen
  rationale: Das Verb bezeichnet die Wiederherstellung einer gestörten Beziehung. Eine Wiedergabe wie „vollständig zu versöhnen“ würde die mögliche verstärkende Wirkung der Vorsilbe überdeutlich auslegen.
- source_word: τὰ πάντα
  choice: alles
  rationale: Der substantivierte sächliche Plural hat umfassende kosmische Weite. „Alles“ ist im modernen Deutschen natürlich und wird durch die anschließende Gegenüberstellung von Erde und Himmeln entfaltet.
- source_word: εἰς αὐτόν
  choice: mit sich
  rationale: Bei „versöhnen“ gibt die deutsche Verbindung „mit sich versöhnen“ die Zielrichtung auf Gott idiomatisch und reflexiv wieder.
- source_word: εἰρηνοποιήσας
  choice: indem er Frieden schuf
  rationale: Das Partizip beschreibt, wodurch beziehungsweise in welcher begleitenden Handlung die Versöhnung geschieht. „Frieden schuf“ wahrt den aktiven, vollzogenen Charakter.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: durch das Blut seines Kreuzes
  rationale: Die konkrete Rede von Blut und Kreuz bleibt erhalten; sie wird nicht zur bloßen Aussage „durch seinen Tod“ abgeschwächt oder dogmatisch weiterbestimmt.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: durch ihn
  rationale: Die im SBLGNT gekennzeichnete, textkritisch unsichere Wiederholung wird im Haupttext beibehalten und durch Gedankenstriche als nachdrückliche Wiederaufnahme kenntlich gemacht.
- source_word: εἴτε ... εἴτε
  choice: sei es ... oder
  rationale: Diese deutsche Korrelativform gibt die umfassende griechische Paarung natürlich wieder.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: das auf der Erde
  rationale: Die substantivische Form wahrt den Bezug auf alles Irdische und bildet ein ausgewogenes Gegenstück zur folgenden Wendung.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: das in den Himmeln
  rationale: Der Plural οὐρανοῖς wird bewusst als „Himmeln“ erhalten und nicht zum Singular vereinheitlicht.
theological_decisions:
- issue: Reichweite der Versöhnung in τὰ πάντα
  choice: Die umfassende Formulierung „alles“ bleibt ohne Einschränkung stehen.
  alternative: „alle Menschen“ oder eine ausdrückliche Aussage, dass jedes Wesen endgültig gerettet wird
  rationale: Der Vers beschreibt kosmische Versöhnung und erläutert sie mit Erde und Himmeln. Er legt hier jedoch nicht ausdrücklich fest, in welchem Verhältnis diese Versöhnung zur endgültigen Rettung jedes einzelnen personalen Wesens steht.
- issue: Bezug von εἰς αὐτόν
  choice: „mit sich“ versteht Gott als denjenigen, zu dem hin alles versöhnt wird.
  alternative: Der Messias versöhnt alles mit sich selbst.
  rationale: Der Satzbau setzt den Gedankengang aus Vers 19 fort und spricht am wahrscheinlichsten von Gottes Handeln durch den Sohn. Die Übersetzung folgt diesem syntaktischen Bezug, ohne ihn zusätzlich auszuformulieren.
- issue: Bedeutung von „Blut seines Kreuzes“
  choice: Die konkrete Opfer- und Kreuzigungssprache wird wörtlich bewahrt.
  alternative: „durch seinen Tod am Kreuz“
  rationale: Der griechische Text nennt ausdrücklich sowohl Blut als auch Kreuz. Diese Bild- und Sachebene soll nicht paraphrasierend verengt oder einer bestimmten Sühnetheorie zugeordnet werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt als Fortsetzung des vorangehenden Zusammenhangs mit „und“ eröffnet. Die kosmische Weite, die konkrete Kreuzessprache und die textkritisch unsichere Wiederholung werden bewahrt; unnötige kirchliche Fachsprache wird vermieden.
