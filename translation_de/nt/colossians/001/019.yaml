translation:
  language: de
  text: Denn die ganze Fülle fand Gefallen daran, in ihm zu wohnen.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weil die ganze Fülle Gefallen daran fand, in ihm zu wohnen.“ Die Konjunktion kann im Zusammenhang unterschiedlich begründend wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Andere verstehen Gott oder den Vater als nicht ausdrücklich genanntes Subjekt: „Denn Gott war damit einverstanden, dass die ganze Fülle in ihm wohne.“ Die Form „die ganze Fülle“ kann im Griechischen sowohl als Subjekt von „fand Gefallen“ als auch als Akkusativsubjekt zu „wohnen“ verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: Mit „der ganzen Fülle“ ist im Zusammenhang wahrscheinlich die Fülle Gottes gemeint; vergleiche Kolosser 2,9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die vorausgehenden Aussagen über den Sohn. „Denn“ gibt diese erklärend-begründende Funktion natürlich wieder; je nach syntaktischem Anschluss ist auch „weil“ möglich.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang auf den Sohn. Die Wiedergabe bewahrt den Wortlaut, ohne in diesem Vers einen Titel wie „Christus“ hinzuzufügen.
- source_word: εὐδόκησεν
  choice: fand Gefallen daran
  rationale: Die Form von εὐδοκέω bezeichnet Wohlgefallen beziehungsweise eine wohlwollende Absicht. „Fand Gefallen daran“ erhält diesen Bedeutungsanteil und lässt sich im Deutschen mit dem folgenden Infinitiv natürlich verbinden.
- source_word: πᾶν τὸ πλήρωμα
  choice: die ganze Fülle
  rationale: Die Formulierung gibt die umfassende Kraft von πᾶν und den bestimmten Ausdruck τὸ πλήρωμα wieder, ohne den im Griechischen nicht ausdrücklich genannten Zusatz „Gottes“ einzufügen.
- source_word: κατοικῆσαι
  choice: zu wohnen
  rationale: Das Verb bezeichnet ein Wohnen oder dauerndes Ansässigsein. „Zu wohnen“ ist knapp, verständlich und dem gehobenen Ton der Aussage angemessen.
theological_decisions:
- issue: Syntaktische Funktion von πᾶν τὸ πλήρωμα und Subjekt von εὐδόκησεν
  choice: „Die ganze Fülle“ wird als Subjekt von „fand Gefallen“ wiedergegeben.
  alternative: „Gott gefiel es, die ganze Fülle in ihm wohnen zu lassen“ beziehungsweise „Der Vater wollte, dass seine ganze Fülle in ihm wohnte“.
  rationale: 'Da die neutrale Form πᾶν τὸ πλήρωμα sowohl Nominativ als auch Akkusativ sein kann, lässt die griechische Formulierung zwei Analysen zu: Die Fülle kann das ausgedrückte Subjekt von εὐδόκησεν sein, oder Gott kann als unausgesprochenes Subjekt verstanden werden, während die Fülle zum Infinitiv gehört. Der Haupttext folgt der formal unmittelbar möglichen Lesart, ohne die verbreitete Alternative zu verschweigen.'
- issue: Bezug der „Fülle“
  choice: Der Ausdruck bleibt als „die ganze Fülle“ ohne ergänzenden Genitiv stehen.
  alternative: „die ganze Fülle Gottes“ beziehungsweise „seine ganze Fülle“.
  rationale: Der Zusammenhang, besonders Kolosser 2,9, legt die Fülle Gottes nahe. In diesem Vers selbst steht jedoch kein entsprechender Genitiv. Die offene Formulierung bewahrt daher den Wortlaut und seine theologische Dichte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fand Gefallen daran“ bewahrt den Gedanken des Wohlgefallens, ohne das altertümlich wirkende „hatte Wohlgefallen“ zu verwenden. Die leichte Personifikation der „Fülle“ entspricht der im Haupttext gewählten syntaktischen Lesart; die alternative Analyse wird in einer Fußnote offengehalten.
