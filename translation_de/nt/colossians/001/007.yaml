source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: de
  text: wie ihr von Epaphras gelernt habt, unserem geliebten Mitsklaven[a], der für uns[b] ein treuer Diener des Messias[c] ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „Mitsklave“: jemand, der zusammen mit anderen demselben Herrn gehört. Möglich ist auch die weichere Wiedergabe „Mitdiener“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu unseren Gunsten“; die Wendung kann auch einen vertretenden Sinn haben.'
    reason: alternative_reading
  - marker: c
    text: 'Griechisch „Χριστοῦ“; „Messias“ gibt hier die Bedeutung des Titels wieder. Traditionell: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Knüpft den Satz als Entsprechung an die vorherige Aussage an; im Deutschen gibt „wie“ die verbindende Vergleichsfunktion natürlich wieder.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: ihr es von Epaphras gelernt habt
  rationale: Der Aorist bezeichnet die zurückliegende Aufnahme der Botschaft. Das ergänzte Pronomen „es“ ist im Deutschen für einen natürlichen Rückbezug auf den vorherigen Inhalt hilfreich, ohne einen neuen Sachgehalt einzuführen.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: unserem geliebten Mitsklaven
  rationale: „Mitsklave“ bewahrt die gemeinsame Zugehörigkeit zu demselben Herrn, die σύνδουλος ausdrückt. Die Dativform folgt der Apposition zu „von Epaphras“.
- source_word: πιστὸς
  choice: treuer
  rationale: Bezeichnet Epaphras als zuverlässig und beständig in seinem Dienst; „treu“ ist hier die geläufige und inhaltlich passende Wiedergabe.
- source_word: ὑπὲρ ἡμῶν
  choice: in unserem Auftrag
  rationale: Gibt die wahrscheinliche stellvertretende beziehungsweise beauftragte Tätigkeit für Paulus und seine Mitarbeiter prägnant wieder.
- source_word: διάκονος
  choice: Diener
  rationale: Bezeichnet hier den Dienst für den Messias, ohne zwingend ein später formalisiertes kirchliches Amt zu meinen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός trägt hier den Sinn eines Titels; „Messias“ macht dessen Bedeutung im Deutschen sichtbar.
theological_decisions:
- issue: Wiedergabe von σύνδουλος
  choice: Mitsklave
  alternative: Mitdiener; Mitknecht
  rationale: Die Formulierung soll das im griechischen Wort enthaltene Verhältnis gemeinsamer Zugehörigkeit zu einem Herrn nicht abschwächen. Eine Fußnote erklärt die im heutigen Deutschen auffällige Wortwahl.
- issue: Bedeutung von ὑπὲρ ἡμῶν
  choice: in unserem Auftrag
  alternative: für uns; an unserer Stelle
  rationale: „In unserem Auftrag“ bringt die wahrscheinlich gemeinte Vertretung zur Geltung. Da ὑπέρ auch allgemeiner den Nutzen für jemanden bezeichnen kann, wird „für uns“ als Alternative vermerkt.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Die Übersetzung als „Messias“ erhält den Titelcharakter und vermeidet, dass Χριστός lediglich wie ein Eigenname verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Relativsatz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. „Mitsklave“ ist bewusst markant, weil es die soziale Metapher des Ausgangstextes bewahrt; die Fußnote verhindert ein Missverständnis. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
