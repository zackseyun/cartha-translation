  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: de
  text: das Geheimnis, das von den Zeitaltern und von den Generationen her verborgen war, jetzt aber seinen Heiligen[a] offenbart wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen heiligen Menschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: Geheimnis
  rationale: „Geheimnis“ ist im Deutschen der etablierte paulinische Ausdruck für einen göttlichen Plan, der zuvor verborgen war und nun offenbart wurde; es bezeichnet hier kein bloß rätselhaftes oder esoterisches Wissen.
- source_word: ἀποκεκρυμμένον
  choice: das … verborgen war
  rationale: 'Die Umschreibung gibt den resultativen Zustand des griechischen Perfektpartizips natürlich wieder: Das Geheimnis war in der Vergangenheit verborgen und blieb es bis zu seiner Offenbarung.'
- source_word: ἀπὸ τῶν αἰώνων
  choice: seit den Zeitaltern
  rationale: „Seit“ gibt in Verbindung mit dem fortdauernden Verborgensein den zeitlichen Ausgangspunkt von ἀπό idiomatisch wieder; „Zeitalter“ bewahrt den Epochenbezug von αἰῶνες.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: und seit den Generationen
  rationale: Die parallele Formulierung wahrt die Wiederholung von ἀπό und unterscheidet γενεαί von den zuvor genannten Zeitaltern.
- source_word: νῦν δὲ
  choice: jetzt aber
  rationale: Die Wortfolge ist natürliches Deutsch und bewahrt den deutlichen Gegensatz zwischen früherer Verborgenheit und gegenwärtiger Offenbarung.
- source_word: ἐφανερώθη
  choice: offenbart wurde
  rationale: Die passive Form bleibt erhalten; „offenbart“ ist im Kontext eines zuvor verborgenen göttlichen Geheimnisses präzise und verständlich.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: seinen Heiligen
  rationale: „Heilige“ bewahrt den paulinischen Ausdruck für die Gott zugehörigen und von ihm ausgesonderten Menschen, ohne ihn mit „Volk“ zu verallgemeinern.
theological_decisions:
- issue: Bedeutung von „seinen Heiligen“
  choice: Die Formulierung bezeichnet Gottes heiliges Volk beziehungsweise die Gemeinschaft der Glaubenden.
  alternative: „seinen heiligen Menschen“ oder „seinem Volk“
  rationale: Paulus gebraucht ἅγιοι gewöhnlich für die zu Gott gehörenden Glaubenden, nicht nur für eine herausgehobene oder später kirchlich anerkannte Gruppe. Die wörtlich geprägte Formulierung lässt den theologischen Begriff bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als grammatisch abhängige Satzfortsetzung formuliert. Die doppelte Wendung „seit den Zeitaltern und seit den Generationen“ erhält den auffälligen griechischen Parallelismus, auch wenn sie im Deutschen feierlicher als Alltagssprache klingt.
