  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: de
  text: der uns auch von eurer Liebe im Geist[a] berichtet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure geistliche Liebe“, das heißt eine vom Geist geprägte Liebe.'
    reason: Die Wendung ἐν πνεύματι kann ausdrücklich auf den Heiligen Geist oder allgemeiner auf die geistliche Sphäre beziehungsweise Prägung der Liebe bezogen werden.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: der ... berichtet hat
  rationale: Der substantivierte Aoristpartizip bezieht sich auf Epaphras im vorherigen Vers. Ein deutscher Relativsatz gibt die Konstruktion natürlich wieder; δηλόω bezeichnet hier das Bekanntmachen beziehungsweise Berichten.
- source_word: καὶ
  choice: auch
  rationale: καί fügt eine weitere Handlung des Epaphras hinzu und wird im Relativsatz idiomatisch mit „auch“ wiedergegeben.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Mitteilung, Paulus und seine Mitarbeiter.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: eure Liebe
  rationale: Die Genitivverbindung wird im Deutschen natürlich durch das Possessiv „eure“ ausgedrückt; ἀγάπη entspricht „Liebe“.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die Formulierung wahrt die knappe griechische Wendung und lässt im Haupttext den wahrscheinlich paulinischen Bezug auf den Heiligen Geist erkennen, ohne ihn durch den Zusatz „Heiligen“ ausdrücklich festzulegen.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: „im Geist“ als wahrscheinlicher Bezug auf den Heiligen Geist
  alternative: '„im Geist“, das heißt: eine vom Geist geprägte beziehungsweise geistliche Liebe'
  rationale: Das artikellose πνεύματι kann bei Paulus dennoch den Heiligen Geist bezeichnen, lässt aber sprachlich auch eine allgemeinere Deutung der geistlichen Sphäre oder Prägung zu. Der Haupttext bewahrt die wörtliche Mehrdeutigkeit; die Fußnote nennt die alternative Nuance.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Register. Der Relativsatz setzt unmittelbar Vers 7 fort; „berichtet hat“ ist in diesem Zusammenhang natürlicher als „bekannt gemacht hat“.
