  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: de
  text: Paulus, ein Apostel des Messias Jesus[a] durch den Willen Gottes, und Timotheus, unser Bruder[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Bruder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Bewahrt die anerkannte Amts- und Sendungsbezeichnung im paulinischen Briefanfang.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός ist hier als Titel gebraucht; „Messias“ gibt dessen Bedeutung wieder, während „Jesus“ als Name erscheint. Der Genitiv bezeichnet Paulus als Apostel des Messias Jesus.
- source_word: διὰ θελήματος θεοῦ
  choice: durch den Willen Gottes
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde beziehungsweise bestimmende Grundlage von Paulus’ Apostelamt; „durch“ bildet die griechische Konstruktion klar ab.
- source_word: Τιμόθεος
  choice: Timotheus
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: ὁ ἀδελφὸς
  choice: unser Bruder
  rationale: Das griechische „der Bruder“ bezeichnet Timotheus als Angehörigen der Glaubensgemeinschaft; „unser Bruder“ drückt diese Beziehung in einem natürlichen deutschen Briefanfang aus.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck hat in Χριστοῦ Ἰησοῦ noch erkennbaren Titelcharakter. „Messias“ bewahrt diesen Sinn, ohne die im Deutschen ebenfalls mögliche traditionelle Wiedergabe „Christus“ auszuschließen.
- issue: Beziehungsgehalt von ὁ ἀδελφός
  choice: unser Bruder
  alternative: der Bruder
  rationale: Das Possessivpronomen ist im Griechischen nicht ausdrücklich vorhanden, macht im Deutschen jedoch die im Kontext vorausgesetzte gemeinschaftliche Beziehung natürlich verständlich.
translation_notes:
  register: Moderner, würdevoller deutscher Briefstil. Die Satzstruktur des noch weiterlaufenden Briefeingangs bleibt durch das abschließende Komma offen; traditionelle kirchliche Begriffe werden dort beibehalten, wo sie die Bedeutung präzise tragen.
