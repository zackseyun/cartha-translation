revisions:
- from: Jetzt freue ich mich in den Leiden, die ich für euch ertrage, und ergänze in meinem Fleisch, was an den Bedrängnissen des Messias noch fehlt[a] – für seinen Leib, das heißt die Gemeinde[b].
  to: Jetzt freue ich mich über die Leiden, die ich für euch ertrage, und fülle in meinem Fleisch auf, was an den Bedrängnissen des Messias noch fehlt, zugunsten seines Leibes, der die Gemeinde ist.[a]
  rationale: Die Revision verbessert die Idiomatik und stellt die Auffüllmetapher sowie den zweiten Zweckbezug klarer heraus. Sie bewahrt dabei die syntaktische und theologische Spannung des griechischen Wortlauts. Die zwei bisherigen Fußnoten werden zu einer Anmerkung am vollständigen, erklärenden Satzteil zusammengeführt; die frühere Fußnote b erläuterte lediglich ἐκκλησία, während die textlich wichtigere Auslegungsfrage nun an der einschlägigen Stelle verankert ist.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:36:28Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die wesentlichen Bezüge und die Spannung von ἀνταναπληρῶ ... τὰ ὑστερήματα angemessen wieder. Die Stellung von „in meinem Fleisch“ ist quellentreu. „in den Leiden“ ist im heutigen Deutsch jedoch keine natürliche Ergänzung zu „sich freuen“; außerdem ist „ergänze ... was fehlt“ weniger präzise als die Auffüllmetapher des griechischen Verbs.
  naturalness: Die revidierte Fassung verwendet mit „über die Leiden“ idiomatisches modernes Standarddeutsch, ohne den Sinn von ἐν inhaltlich zu überdehnen. „zugunsten“ macht den benefaktiven Bezug von ὑπέρ klar. Die Identifikation von Leib und Gemeinde wird als Relativsatz flüssig und eindeutig formuliert.
  terminology: „Leiden“ für παθήματα und „Bedrängnissen“ für θλίψεις bewahrt die im Ausgangstext vorhandene Unterscheidung. „Messias“, „Fleisch“, „Leib“ und „Gemeinde“ sind sachgerecht. Die Fußnote behält die starke Formulierung bei und erläutert sie, ohne eine konfessionelle Deutung als Übersetzung auszugeben.
  issues:
  - severity: medium
    issue: Unnatürliche Verbindung „freue ich mich in den Leiden“
    rationale: Das deutsche Verb „sich freuen“ wird hier gewöhnlich mit „über“ verbunden. „Über die Leiden“ gibt den von Paulus ausgedrückten Anlass bzw. Gegenstand seiner Freude natürlich wieder.
  - severity: low
    issue: „ergänze ... was ... fehlt“ schwächt die Auffüllmetapher leicht ab
    rationale: ἀνταναπληρῶ bezeichnet ein Auffüllen bzw. Ausfüllen dessen, was noch fehlt. „fülle ... auf“ ist im Deutschen näher am Bild und bewahrt die Spannung des Satzes.
  - severity: low
    issue: Der Zweckbezug zu Christi Leib ist durch Gedankenstrich potenziell locker angebunden
    rationale: „Zugunsten seines Leibes“ schließt den zweiten ὑπέρ-Bezug klar an das Auffüllen der Bedrängnisse an.
