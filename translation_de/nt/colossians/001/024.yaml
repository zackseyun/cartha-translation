id: COL.1.24
reference: Colossians 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: de
  text: Jetzt freue ich mich über die Leiden, die ich für euch ertrage, und fülle in meinem Fleisch auf, was an den Bedrängnissen des Messias noch fehlt, zugunsten seines Leibes, der die Gemeinde ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „was an den Bedrängnissen des Messias noch fehlt“ wird unterschiedlich ausgelegt. Sie besagt nicht, dass das sühnende Werk des Messias unzureichend gewesen wäre; Paulus spricht von seinen eigenen Leiden im Zusammenhang mit dem Messias und seinem Leib, der Gemeinde.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν χαίρω
  choice: Jetzt freue ich mich
  rationale: Gibt den zeitlichen Auftakt und die gegenwärtige Haltung des Paulus knapp und natürlich wieder.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: in den Leiden, die ich für euch ertrage
  rationale: Das im Kontext erkennbare persönliche Leiden wird im Deutschen ausdrücklich gemacht; ὑπέρ bleibt benefaktiv als „für euch“ erhalten.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: ich ergänze …, was … noch fehlt
  rationale: Bewahrt die starke Metapher des Auffüllens beziehungsweise Ergänzens, ohne sie im Haupttext deutend abzuschwächen.
- source_word: τῶν θλίψεων
  choice: der Bedrängnisse
  rationale: Unterscheidet θλίψεις von den zuvor genannten παθήματα („Leiden“) und bezeichnet belastende, bedrängende Erfahrungen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat hier titularen Sinn; „Messias“ macht diesen für heutige Leser sichtbar.
- source_word: ἐν τῇ σαρκί μου
  choice: in meinem Fleisch
  rationale: Gibt σάρξ transparent wieder und bezeichnet hier die leibliche, leidensfähige Existenz des Paulus, nicht eine sündige Natur.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: für seinen Leib
  rationale: Bewahrt sowohl den benefaktiven Sinn von ὑπέρ als auch das paulinische Bild des Leibes.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: das heißt die Gemeinde
  rationale: Die erläuternde Identifikation des Leibes mit der ἐκκλησία wird in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Was an den Bedrängnissen des Messias noch fehlt
  choice: Die spannungsreiche Aussage bleibt im Haupttext wörtlich erkennbar; eine Fußnote ordnet sie als Teilnahme des Paulus an den mit dem Messias und seiner Gemeinde verbundenen Leiden ein.
  alternative: Die Aussage als Ergänzung eines Mangels am Sühnleiden des Messias verstehen oder ausschließlich auf ein festes Maß endzeitlicher Wehen beziehen.
  rationale: Der Text formuliert bewusst stark. θλίψεις und der Bezug auf den Leib, die Gemeinde, sprechen für die fortdauernden Leiden im messianischen Dienst; die Übersetzung darf dennoch die echte sprachliche Spannung nicht beseitigen.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Der Titelcharakter wird hier durch „Messias“ deutlicher bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bedrängnisse“ hält die lexikalische Unterscheidung zu „Leiden“ aufrecht. Die etwas ungewohnte Wendung „in meinem Fleisch“ ist wegen ihrer theologischen und bildhaften Bedeutung bewusst beibehalten.
