  source_fidelity: „Er hat uns … gerettet“ gibt ὃς ἐρρύσατο ἡμᾶς angemessen wieder; das selbstständige „Er“ ist im Deutschen für den isolierten Vers vertretbar. „aus der Macht der Finsternis“ entspricht ἐκ τῆς ἐξουσίας τοῦ σκότους, und „in das Reich … versetzt“ bildet die Richtungsbewegung von μετέστησεν εἰς τὴν βασιλείαν zuverlässig ab.
  naturalness: „Sohn seiner Liebe“ ist zwar eine formnahe Nachbildung, im heutigen Standarddeutsch aber deutlich unidiomatisch und kann missverständlich wirken, als sei der Sohn ein Erzeugnis oder Gegenstand der Liebe. „Sein geliebter Sohn“ ist die natürliche deutsche Wiedergabe der genitivischen Wendung; die formnähere Lesart kann in der Fußnote dokumentiert werden.
  terminology: „Macht der Finsternis“, „Reich“ und „geliebter Sohn“ sind modernes, würdiges Standarddeutsch und geben die zentralen Begriffe ohne zusätzliche dogmatische Auslegung wieder. Die Fußnote wahrt die formale Struktur sowie die alternative explizierende Wiedergabe.
