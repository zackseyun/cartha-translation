  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: de
  text: Er hat uns aus der Macht der Finsternis gerettet und in das Reich seines geliebten Sohnes versetzt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in das Reich des Sohnes seiner Liebe“; oder: „des Sohnes, den er liebt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: gerettet
  rationale: ῥύομαι bezeichnet die Rettung oder Befreiung aus Gefahr beziehungsweise feindlicher Gewalt. „Gerettet“ ist im modernen Deutsch klar und bewahrt den Gedanken des entschiedenen Eingreifens.
- source_word: ἐξουσίας
  choice: Macht
  rationale: ἐξουσία kann Autorität, Verfügungsgewalt oder Herrschaftsmacht bezeichnen. In der Wendung „Macht der Finsternis“ klingt im Deutschen die beherrschende Gewalt natürlich an, ohne den Ausdruck räumlich als „Bereich“ festzulegen.
- source_word: σκότους
  choice: Finsternis
  rationale: σκότος bedeutet Dunkelheit oder Finsternis. „Finsternis“ bewahrt im würdigen biblischen Register die moralischen und geistlichen Anklänge, ohne sie ausdrücklich auszudeuten.
- source_word: μετέστησεν
  choice: versetzt
  rationale: μεθίστημι bezeichnet das Überführen aus einem Bereich oder Zustand in einen anderen. „Versetzt“ bildet die Bewegung von einer Herrschaftssphäre in die andere knapp und formal nah ab.
- source_word: βασιλείαν
  choice: Reich
  rationale: βασιλεία kann Königsherrschaft oder Reich bedeuten. Mit εἰς und dem Motiv des Versetzens bezeichnet „Reich“ natürlich den Herrschaftsbereich des Sohnes und lässt zugleich dessen Königsherrschaft anklingen.
- source_word: υἱοῦ
  choice: Sohn
  rationale: υἱός bedeutet „Sohn“. Die Großschreibung entspricht dem christologischen Referenten im Kontext.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: des Sohnes seiner Liebe
  rationale: Die genitivische Struktur des Griechischen wird bewusst bewahrt. Die ungewöhnliche, aber verständliche Formulierung erhält die sprachliche Textur und lässt offen, ob der Genitiv vor allem die Liebe des Vaters zum Sohn oder die Kennzeichnung als geliebter Sohn ausdrückt.
theological_decisions:
- issue: Wiedergabe von τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: des Sohnes seiner Liebe
  alternative: seines geliebten Sohnes; des Sohnes, den er liebt
  rationale: Die Hauptfassung folgt der griechischen Genitivkonstruktion und bewahrt deren theologische und sprachliche Spannung. Die idiomatischeren Deutungen werden in der Fußnote genannt, ohne eine davon im Haupttext verbindlich festzulegen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Macht der Finsternis“ und „Reich“ sind natürlich und prägnant; die bewusst markierte Wendung „Sohn seiner Liebe“ wahrt die griechische Ausdrucksform. Das Relativpronomen ὅς wird im Deutschen als selbstständiges „Er“ wiedergegeben, damit der Einzelvers grammatisch vollständig und natürlich lesbar ist.
