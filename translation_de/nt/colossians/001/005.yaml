  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: de
  text: wegen der Hoffnung, die für euch im Himmel[a] bereitliegt. Von ihr habt ihr schon früher in der Botschaft der Wahrheit, dem Evangelium, gehört.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: in den Himmeln; im Griechischen steht die Mehrzahl.'
    reason: lexical_alternative
  - marker: b
    text: „Botschaft der Wahrheit“ kann auch „Wort der Wahrheit“ heißen. „Das Evangelium“ bezeichnet näher, welche Botschaft gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: wegen der Hoffnung
  rationale: διά mit Akkusativ bezeichnet hier am natürlichsten den Grund. „Hoffnung“ bewahrt den üblichen paulinischen Begriff und den Anschluss an den vorausgehenden Satz.
- source_word: ἀποκειμένην ὑμῖν
  choice: die für euch … bereitliegt
  rationale: ἀπόκειμαι bezeichnet etwas, das aufbewahrt oder vorbehalten ist. „Bereitliegt“ ist im heutigen Deutsch natürlich und bewahrt den Gedanken, dass die Hoffnung für die Adressaten aufbewahrt ist.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: im Himmel
  rationale: Obwohl der griechische Ausdruck formal im Plural steht, ist „im Himmel“ die natürliche deutsche Entsprechung; eine Fußnote dokumentiert die Form des Ausgangstextes.
- source_word: ἣν προηκούσατε
  choice: Von ihr habt ihr schon früher … gehört
  rationale: Das feminine Relativpronomen bezieht sich unmittelbar auf ἐλπίδα. Die Umformung mit „Von ihr“ macht diesen Bezug im Deutschen klar; „schon früher“ gibt die Vorsilbe προ- wieder.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: in der Botschaft der Wahrheit
  rationale: λόγος bezeichnet hier im Zusammenhang die verkündigte Botschaft. „Botschaft der Wahrheit“ klingt gegenwärtig und verständlich, ohne die Genitivverbindung auf eine einzige Deutung festzulegen.
- source_word: τοῦ εὐαγγελίου
  choice: nämlich im Evangelium
  rationale: Der Genitiv steht am plausibelsten appositionell und identifiziert die Botschaft der Wahrheit als das Evangelium. „Nämlich“ macht diese Beziehung im Deutschen deutlich.
theological_decisions:
- issue: Bezugswort des Relativsatzes
  choice: Der Satz bezieht sich ausdrücklich auf die Hoffnung.
  alternative: Ein weiter gefasster Bezug auf die gesamte Evangeliumsbotschaft.
  rationale: ἣν ist feminin Singular und stimmt unmittelbar mit ἐλπίδα überein. Die Übersetzung wahrt diesen grammatischen Bezug.
- issue: Verhältnis von „Botschaft der Wahrheit“ und „Evangelium“
  choice: „Evangelium“ wird als Apposition beziehungsweise Identifikation verstanden.
  alternative: Der Genitiv könnte als nähere Bestimmung im Sinn von „die Wahrheit des Evangeliums“ aufgefasst werden.
  rationale: Die Wortfolge λόγος τῆς ἀληθείας τοῦ εὐαγγελίου lässt die appositionelle Deutung gut zu; sie entspricht dem Sinn, dass die wahre Botschaft das Evangelium ist, ohne eine zusätzliche Lehrbestimmung einzutragen.
- issue: Singular oder Plural bei οὐρανοῖς
  choice: Idiomatiche deutsche Wiedergabe „im Himmel“ im Haupttext.
  alternative: Formnahe Wiedergabe „in den Himmeln“.
  rationale: Der Plural ist im Griechischen geläufig, während „in den Himmeln“ im modernen Deutsch ungewöhnlich und potenziell irreführend klingt. Die Fußnote bewahrt die formale Information.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde für natürliche deutsche Syntax in zwei Sätze gegliedert. „Von ihr“ hält den Bezug der Relativkonstruktion auf die Hoffnung sichtbar; „nämlich“ verdeutlicht die appositionelle Funktion von „Evangelium“.
