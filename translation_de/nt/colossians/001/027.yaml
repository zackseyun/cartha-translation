id: COL.1.27
reference: Colossians 1:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: de
  text: 'Ihnen wollte Gott bekannt machen, wie groß der Reichtum der Herrlichkeit dieses Geheimnisses unter den Völkern ist: Christus in euch[a], die Hoffnung auf Herrlichkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus unter euch“. Das Griechische kann sowohl Christi Gegenwart in den Glaubenden als auch seine Gegenwart unter ihnen als Gemeinschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Ihnen
  rationale: Das Dativpronomen bezieht sich auf die Heiligen im vorangehenden Vers und bezeichnet die Empfänger dessen, was Gott bekannt macht.
- source_word: ἠθέλησεν
  choice: wollte
  rationale: Die Wiedergabe bewahrt den Gedanken des bewussten göttlichen Willens, ohne ihn stärker als ausdrückliche Erwählung zu deuten.
- source_word: γνωρίσαι
  choice: bekannt machen
  rationale: Dies entspricht der Grundbedeutung von γνωρίζω und passt natürlich zur Offenlegung des zuvor verborgenen Geheimnisses.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: wie reich an Herrlichkeit
  rationale: Die Formulierung gibt die verdichtete griechische Wendung in natürlichem modernem Deutsch wieder und bewahrt sowohl den Reichtum als auch die Herrlichkeit als eigenständige Sinnmomente.
- source_word: μυστηρίου
  choice: Geheimnis
  rationale: Im paulinischen Zusammenhang bezeichnet das Wort einen zuvor verborgenen, nun bekannt gemachten göttlichen Plan, nicht ein unlösbares Rätsel.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Die Wendung wahrt den kollektiven Bezug auf die nichtjüdischen Völker, ohne im Haupttext eine erklärende Umschreibung einzufügen.
- source_word: Χριστὸς
  choice: Christus
  rationale: Im Deutschen ist „Christus“ die natürliche, würdige Wiedergabe des griechischen Titels und kennzeichnet hier den Inhalt des Geheimnisses.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Die direkte Wiedergabe lässt sowohl einen inneren Bezug auf die Glaubenden als auch die korporative Dimension des Plurals stehen; die mögliche Bedeutung „unter euch“ wird in der Fußnote genannt.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: die Hoffnung auf Herrlichkeit
  rationale: „Auf Herrlichkeit“ drückt im Deutschen natürlich aus, dass die erwartete Herrlichkeit Gegenstand und Ziel der Hoffnung ist.
theological_decisions:
- issue: Bezug von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: Die griechische Präposition kann hier Christi Gegenwart in den Glaubenden oder unter ihnen als Gemeinschaft bezeichnen. Der Haupttext folgt der direkten Wiedergabe, während die Fußnote die korporative Lesart offenhält.
- issue: Identifikation des Geheimnisses
  choice: Christus in euch
  alternative: Christus unter euch
  rationale: Das Relativpronomen erläutert den Inhalt des Geheimnisses. Die knappe Gleichsetzung wird bewahrt, ohne ihre christologische Aussage durch zusätzliche Erklärungen einzuengen.
- issue: Genitiv in ἡ ἐλπὶς τῆς δόξης
  choice: Hoffnung auf Herrlichkeit
  alternative: Hoffnung der Herrlichkeit
  rationale: Die gewählte Fassung ist im modernen Deutsch verständlich und lässt Christus als Grund der erwarteten Herrlichkeit erkennen, ohne deren genaue Ausgestaltung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verdichtete griechische Konstruktion wird maßvoll geglättet; der Doppelpunkt bewahrt die erläuternde Identifikation des Geheimnisses. Die Mehrdeutigkeit von ἐν ὑμῖν wird nicht stillschweigend aufgelöst.
