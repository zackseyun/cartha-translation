id: COL.1.15
reference: Colossians 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: de
  text: Er ist das Bild des unsichtbaren Gottes, der Erstgeborene der ganzen Schöpfung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung kann auch im Sinn von „der Erstgeborene über die ganze Schöpfung“ verstanden werden. „Erstgeborener“ kann in der Bibel Rang, Vorrang und Erbrecht bezeichnen, nicht nur zeitliche Herkunft; dazu sind besonders die folgenden Verse zu beachten.
    reason: Bewahrt die alternative Deutung des Genitivs und erläutert die mögliche Rangbedeutung von „Erstgeborener“, ohne die Spannung im Haupttext aufzulösen.
lexical_decisions:
- source_word: ὅς
  choice: Er
  rationale: Das Relativpronomen bezieht sich auf den Sohn im vorhergehenden Vers. Als eigenständig wiedergegebener Vers ist „Er“ im Deutschen natürlich und führt die Beschreibung klar fort.
- source_word: ἐστιν
  choice: ist
  rationale: Die einfache Präsensform der Kopula wird ohne Erweiterung wiedergegeben.
- source_word: εἰκὼν
  choice: Bild
  rationale: „Bild“ ist die direkte und etablierte Entsprechung und bewahrt sowohl den Gedanken der Darstellung als auch den der Offenbarung, ohne ihn auszudeuten.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: des unsichtbaren Gottes
  rationale: Die attributive Wiedergabe entspricht natürlichem Deutsch und erhält die Aussage, dass Gott unsichtbar ist.
- source_word: πρωτότοκος
  choice: der Erstgeborene
  rationale: „Erstgeborener“ bewahrt die biblische Metapher mit ihren möglichen Bezügen auf Vorrang, Rang und Erbrecht, statt sie durch eine eindeutige Deutung zu ersetzen.
- source_word: πάσης κτίσεως
  choice: der ganzen Schöpfung
  rationale: Der Genitiv wird formal als „der ganzen Schöpfung“ wiedergegeben. So bleibt die echte grammatische und theologische Spannung erhalten; eine Deutung als Herrschaft oder Vorrang wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Bedeutung von πρωτότοκος πάσης κτίσεως im Verhältnis Christi zur Schöpfung
  choice: der Erstgeborene der ganzen Schöpfung
  alternative: der Erstgeborene über die ganze Schöpfung
  rationale: Die gewählte Fassung bildet den griechischen Genitiv unmittelbar ab und bewahrt seine Mehrdeutigkeit. „Über die ganze Schöpfung“ kann den im Zusammenhang naheliegenden Vorrang ausdrücken, fügt diese Deutung aber expliziter in den Text ein, als es die griechische Formulierung selbst tut. Die folgenden Verse sind für das Verständnis der Aussage maßgeblich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist knapp und dem griechischen Bekenntnisstil nah; „Schöpfung“ ist gegenüber „Geschöpf“ gewählt, weil κτίσις hier die Gesamtheit des Geschaffenen bezeichnen kann.
