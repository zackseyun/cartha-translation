review_pass:
  verdict: revise
  source_fidelity: Die dreifache Wiederholung von „jeden Menschen“, die Abfolge Verkündigen–Ermahnen–Lehren und die Wendung „in Christus“ sind zutreffend wiedergegeben. „vor Gott“ steht jedoch nicht im griechischen Text und sollte nicht ergänzt werden. Für παραστήσωμεν ist eine deutsche Formulierung nötig, die das Präsentieren/Vorstellen ausdrückt, ohne einen nicht genannten Adressaten einzutragen.
  naturalness: Die Satzführung ist verständlich und der wiederholte Ausdruck „jeden Menschen“ bewahrt die beabsichtigte Betonung. „Präsentieren“ ist hier modernes, würdiges Standarddeutsch und vermeidet die im Deutschen unnatürliche Ergänzung eines expliziten Gegenübers bei „vorstellen“.
  terminology: „Ermahnen“ gibt νουθετοῦντες als mahnend-korrigierende Unterweisung idiomatisch wieder und ist weniger eng als „zurechtweisen“. „Vollkommen“ lässt den Bedeutungsraum von τέλειον offen; „in Christus“ folgt dem griechischen Wortlaut. Die englische Audit-Fassung mit „warning“ stützt „ermahnen“, verlangt aber keine dogmatische Einengung von τέλειον auf „reif“.
  issues:
  - severity: high
    issue: Die Ergänzung „vor Gott“ ist nicht im Ausgangstext enthalten.
    rationale: παραστήσωμεν nennt in diesem Vers kein ausdrückliches Gegenüber. Auch wenn ein eschatologischer Bezug im weiteren Kontext möglich sein mag, darf die deutsche Übersetzung ihn nicht als Satzinhalt ergänzen.
  - severity: medium
    issue: „zurechtweisen“ ist für νουθετοῦντες zu eng und stärker strafend als nötig.
    rationale: Das Verb bezeichnet warnendes bzw. ermahnendes Unterweisen. „Ermahnen“ bewahrt den korrigierenden Anstoß, ohne zwingend einen Tadel oder Verweis zu behaupten.
  revised_text: Ihn verkünden wir, indem wir jeden Menschen ermahnen und jeden Menschen in aller Weisheit lehren, damit wir jeden Menschen vollkommen in Christus präsentieren.
