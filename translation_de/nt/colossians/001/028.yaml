- from: Ihn verkünden wir, indem wir jeden Menschen zurechtweisen und jeden Menschen in aller Weisheit lehren, damit wir jeden Menschen als vollkommen in Christus vor Gott stellen.
  to: Ihn verkünden wir, indem wir jeden Menschen ermahnen und jeden Menschen in aller Weisheit lehren, damit wir jeden Menschen vollkommen in Christus präsentieren.
  rationale: Die Revision entfernt allein die unbelegte Ergänzung „vor Gott“ und ersetzt die unnötig scharfe Wiedergabe von νουθετοῦντες. Die Wiederholungen, die Weisheitswendung, „vollkommen“ und die paulinische Formulierung „in Christus“ bleiben erhalten.
