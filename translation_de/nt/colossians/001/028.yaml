id: COL.1.28
reference: Colossians 1:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: de
  text: Ihn verkünden wir, indem wir jeden Menschen ermahnen und jeden Menschen in aller Weisheit lehren, damit wir jeden Menschen vollkommen in Christus präsentieren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: verkünden wir
  rationale: Gibt die öffentliche, nachdrückliche Bekanntmachung natürlich und sachgerecht wieder.
- source_word: νουθετοῦντες
  choice: indem wir … zurechtweisen
  rationale: νουθετέω bezeichnet eine mahnende, korrigierende Unterweisung; „zurechtweisen“ bewahrt diesen ernsten Gehalt besser als das schwächere „ermahnen“.
- source_word: πάντα ἄνθρωπον
  choice: jeden Menschen
  rationale: Die dreifache Wiederholung wird wie im Griechischen beibehalten und betont den umfassenden persönlichen Anspruch des Dienstes.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: in aller Weisheit
  rationale: Formnah und zugleich idiomatisch; die Wendung kann sowohl die Art als auch den Rahmen des Lehrens kennzeichnen.
- source_word: τέλειον
  choice: vollkommen
  rationale: Bewahrt die mögliche Bedeutung von Reife, Ganzheit und Vollendung, ohne den Sinn auf bloße geistliche Reife einzuengen.
- source_word: παραστήσωμεν
  choice: vor Gott stellen
  rationale: „Stellen“ beziehungsweise „darstellen/präsentieren“ meint hier wahrscheinlich die eschatologische Vorstellung vor Gott; die Ergänzung macht den deutschen Zielbezug verständlich, ohne eine andere menschliche Instanz einzuführen.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: Bewahrt die paulinische In-Christus-Formulierung und folgt dem griechischen Χριστός, ohne sie durch „Messias“ interpretierend umzubenennen.
theological_decisions:
- issue: Bedeutungsumfang von τέλειον
  choice: vollkommen
  alternative: reif
  rationale: „Vollkommen“ wahrt die Spannung zwischen gegenwärtiger geistlicher Reife und endgültiger Vollendung; „reif“ wäre verständlich, aber enger.
- issue: Implizite Instanz bei παραστήσωμεν
  choice: vor Gott stellen
  alternative: hinstellen / präsentieren
  rationale: Der Kontext legt eine Vorstellung vor Gott nahe. Die Ergänzung dient der natürlichen deutschen Verständlichkeit, sollte aber nicht als ausdrücklich im griechischen Satz vorhanden missverstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige dreifache Wiederholung von „jeden Menschen“ bleibt erhalten. Die Partizipien werden mit „indem“ angeschlossen, um ihre Beziehung zum Verkündigen klar auszudrücken.
