source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: de
  text: und dankt dem Vater, der euch[a] dazu befähigt hat, Anteil am Erbe der Heiligen im Licht[b] zu haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben „uns“ statt „euch“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „an dem den Heiligen im Licht zugelosten Anteil“; das Griechische lässt das Bild eines durch das Los zugeteilten Erbes anklingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: und dankt
  rationale: Das präsentische Partizip führt den Gedankengang des vorangehenden Satzes fort. Die finite, koordinierte Form ist im Deutschen natürlich und bewahrt den fortlaufenden Aufforderungscharakter des Zusammenhangs.
- source_word: τῷ πατρὶ
  choice: dem Vater
  rationale: Gibt den bestimmten griechischen Beziehungstitel ohne den nicht ausdrücklich vorhandenen Zusatz „Gott“ wieder.
- source_word: τῷ ἱκανώσαντι
  choice: der … dazu befähigt hat
  rationale: ἱκανόω bedeutet, jemanden geeignet, fähig oder ausreichend zu machen. „Befähigt hat“ ist gegenwärtiges, verständliches Deutsch und bezeichnet mehr als bloße Erlaubnis.
- source_word: ὑμᾶς
  choice: euch
  rationale: Folgt dem vorgegebenen SBLGNT-Text; die bedeutsame Variante ἡμᾶς („uns“) wird in einer Fußnote genannt.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: Anteil am Erbe … zu haben
  rationale: Die idiomatische deutsche Konstruktion gibt μερίς als „Anteil“ und κλῆρος im heilsgeschichtlichen Zusammenhang als „Erbe“ wieder; die in κλῆρος anklingende Zuteilung wird in der Fußnote bewahrt.
- source_word: τῶν ἁγίων
  choice: der Heiligen
  rationale: Bewahrt die knappe paulinische Bezeichnung für das Gott geweihte Volk und ihre traditionelle, im Kontext verständliche deutsche Entsprechung.
- source_word: ἐν τῷ φωτί
  choice: im Licht
  rationale: Bewahrt die metaphorische und theologische Offenheit der Wendung und lässt sie auf das Erbe beziehungsweise den Anteil der Heiligen bezogen sein.
theological_decisions:
- issue: Textvariante beim Objektpronomen
  choice: euch
  alternative: uns
  rationale: Der vorgegebene griechische Text liest ὑμᾶς („euch“). Die bezeugte Variante ἡμᾶς („uns“) wird nicht in den Haupttext übernommen, aber transparent in einer Fußnote dokumentiert.
- issue: Bildfeld von Erbe und Zuteilung
  choice: Anteil am Erbe
  alternative: der den Heiligen im Licht zugeloste Anteil
  rationale: Der Haupttext bleibt verständlich und bewahrt beide Kernelemente, ohne das Verhältnis von μερίς und κλῆρος übermäßig festzulegen; die Los- beziehungsweise Zuteilungsbildlichkeit wird als mögliche Wiedergabe in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt bewusst an den vorausgehenden Zusammenhang angeschlossen; „Anteil am Erbe … haben“ vermeidet eine schwerfällige wörtliche Genitivkette, ohne die Erb- und Zuteilungsmetaphorik aufzugeben.
