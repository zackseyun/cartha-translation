  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: de
  text: das zu euch gekommen ist[a] und das in der ganzen Welt[b] ebenso wie bei euch[c] Frucht bringt und wächst – seit dem Tag, an dem ihr davon gehört und die Gnade Gottes in Wahrheit[d] erkannt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das bei euch gegenwärtig ist“ beziehungsweise „das zu euch gelangt ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „überall in der ganzen Welt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „in euch“; das Griechische kann sich auf die Gemeinschaft als Ganze oder auf das Wirken des Evangeliums in den Angesprochenen beziehen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „wahrhaftig“ beziehungsweise „in der Wahrheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: das zu euch gekommen ist
  rationale: Das substantivierte Partizip führt die Beschreibung des Evangeliums aus Vers 5 fort. „Zu euch gekommen“ gibt sowohl seine Ankunft als auch seine nun bestehende Gegenwart natürlich wieder.
- source_word: καθὼς καὶ … καθὼς καὶ
  choice: Ebenso wie … so auch
  rationale: Die korrelative deutsche Form bildet die wiederholte Vergleichsstruktur verständlich und würdig ab, ohne das zweimalige καί auszulassen.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: in der ganzen Welt
  rationale: Die Formulierung wahrt die umfassende, rhetorische Reichweite der griechischen Aussage, ohne sie geografisch näher festzulegen.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: Frucht bringt und wächst
  rationale: Die beiden gegenwärtigen Partizipien bezeichnen fortdauerndes Geschehen. Die deutsche Präsensform bewahrt sowohl den Wachstumsprozess als auch das landwirtschaftliche Bild.
- source_word: ἐν ὑμῖν
  choice: bei euch
  rationale: „Bei euch“ ist im Deutschen eine natürliche gemeinschaftliche Lesart und lässt die Wirksamkeit des Evangeliums unter den Kolossern erkennen; die wörtlichere Möglichkeit „in euch“ wird in der Fußnote erhalten.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: seit dem Tag
  rationale: „Seit“ bezeichnet idiomatisch den damals einsetzenden und bis zur Gegenwart fortdauernden Zeitraum.
- source_word: ἠκούσατε
  choice: ihr davon gehört
  rationale: Das Pronomen „davon“ stellt im Deutschen den notwendigen Bezug zum Evangelium beziehungsweise zur Gnade Gottes her, ohne ein im Griechischen nicht ausdrücklich vorhandenes „zum ersten Mal“ einzufügen.
- source_word: ἐπέγνωτε
  choice: erkannt habt
  rationale: „Erkennen“ gibt die über bloßes Hören hinausgehende wirkliche Kenntnis wieder, ohne den möglichen Intensivgehalt mit „vollständig verstanden“ zu überzeichnen.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: die Gnade Gottes
  rationale: Die geläufige genitivische Wendung ist klar, würdig und bewahrt das theologische Gewicht des paulinischen Ausdrucks.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die nahe Wiedergabe lässt den Zusammenhang mit Wahrheit stehen und kann zugleich modal verstanden werden. Engere Deutungsmöglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Reichweite von „in der ganzen Welt“
  choice: Die universale Formulierung des griechischen Textes bleibt unverändert erhalten.
  alternative: Explizite Deutung als jede einzelne Region beziehungsweise jeden einzelnen Menschen umfassende Aussage oder Abschwächung zu „in vielen Teilen der Welt“.
  rationale: Der Text betont rhetorisch die weitreichende Ausbreitung des Evangeliums. Die Übersetzung soll weder eine geografisch-technische Behauptung hinzufügen noch die universale Sprache abschwächen.
- issue: Bezug von ἐν ὑμῖν
  choice: „bei euch“ als gemeinschaftlicher Bezug
  alternative: „in euch“ als mögliche Betonung des Wirkens im Inneren der Angesprochenen
  rationale: Der Plural kann die Gemeinde als Gemeinschaft oder das Wirken in ihren Gliedern bezeichnen. Der Haupttext wählt die im Zusammenhang natürliche gemeinschaftliche Form, während die Fußnote die andere Möglichkeit bewahrt.
- issue: Bedeutung von ἐν ἀληθείᾳ
  choice: „in Wahrheit“ unter Wahrung der semantischen Offenheit
  alternative: Eindeutig modal „wahrhaftig“ oder stärker als Sphäre beziehungsweise Inhalt „in der Wahrheit“
  rationale: Die griechische Wendung kann die Art und Weise des Erkennens oder dessen Beziehung zur Wahrheit bezeichnen. Eine eindeutige dogmatische Festlegung wäre nicht durch den Wortlaut erzwungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satz bleibt als Relativsatz erkennbar mit Vers 5 verbunden. Die Bildsprache von Frucht und Wachstum sowie die offenen Bedeutungsnuancen des griechischen Textes werden bewahrt.
