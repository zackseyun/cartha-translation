id: COL.1.18
reference: Colossians 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: de
  text: Und er ist das Haupt des Leibes, der Gemeinde. Er ist der Anfang[a], der Erstgeborene aus den Toten, damit er selbst in allem den ersten Platz einnehme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ursprung“ oder „der Herrscher“. Das griechische Wort ἀρχή kann diese Bedeutungen haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit er selbst in allem Vorrang habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: er / er selbst
  rationale: Das Pronomen ist betont. Zu Beginn genügt im Deutschen „er“; im Zielsatz gibt „er selbst“ die ausdrückliche Hervorhebung natürlich wieder.
- source_word: κεφαλή
  choice: Haupt
  rationale: „Haupt“ bewahrt die Körpermetapher und lässt offen, ob besonders Leitung, Vorrang oder Ursprung mitschwingt. Zusammen mit „Leib“ ergibt es ein würdiges, im biblischen Sprachgebrauch verständliches Bild.
- source_word: σῶμα
  choice: Leib
  rationale: „Leib“ bewahrt die etablierte korporative Metapher und bildet mit „Haupt“ ein natürliches Wortpaar.
- source_word: ἐκκλησία
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die Gemeinschaft der Glaubenden und ist im modernen deutschen Bibelregister geläufig; es vermeidet die mögliche Verengung von „Kirche“ auf eine Institution oder ein Gebäude.
- source_word: ἀρχή
  choice: Anfang
  rationale: „Anfang“ ist die direkte Entsprechung und passt zur folgenden Bezeichnung als Erstgeborener aus den Toten. Andere lexikalisch mögliche Bedeutungen werden in der Fußnote bewahrt.
- source_word: πρωτότοκος
  choice: Erstgeborene
  rationale: Die Wiedergabe erhält die biblische Bildsprache sowie die möglichen Nuancen von zeitlichem Vorrang und Rang, ohne den Ausdruck auf eine erklärende Paraphrase zu reduzieren.
- source_word: ἐκ τῶν νεκρῶν
  choice: aus den Toten
  rationale: Die knappe Form entspricht der griechischen Auferstehungssprache und ist im Deutschen verständlich, ohne „Toten“ zu einem abstrakten „Tod“ umzudeuten.
- source_word: ἵνα γένηται
  choice: damit … einnimmt
  rationale: „Damit“ gibt den Zweck- beziehungsweise Ergebnissinn wieder. Mit „den ersten Platz einnimmt“ wird das dynamische γένηται zusammen mit dem Partizip idiomatisch ausgedrückt.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Das substantivierte Neutrum wird natürlich und umfassend wiedergegeben; der kosmische Kontext bleibt offen.
- source_word: πρωτεύων
  choice: den ersten Platz einnimmt
  rationale: Diese Wendung gibt den konkreten Sinn des Verbs verständlich wieder und vermeidet das im heutigen Alltagsdeutsch weniger geläufige „Vorrang haben“ beziehungsweise das abstraktere „überragend sein“.
theological_decisions:
- issue: Bedeutung von κεφαλή in der Christus-Leib-Metapher
  choice: Die Metapher wird als „Haupt“ beibehalten.
  alternative: „Leiter“, „Herrscher“ oder „Ursprung“
  rationale: Der griechische Ausdruck legt das Bild fest, erläutert hier aber nicht abschließend, welche seiner Bedeutungsdimensionen im Vordergrund steht. Die Übersetzung löst diese Spannung nicht einseitig auf.
- issue: Bedeutung von ἀρχή im Zusammenhang von Auferstehung und neuer Schöpfung
  choice: „Anfang“
  alternative: „Ursprung“ oder „Herrscher“
  rationale: „Anfang“ passt am unmittelbarsten zur parallelen Aussage „der Erstgeborene aus den Toten“, während die verbleibende lexikalische Mehrdeutigkeit in einer Fußnote genannt wird.
- issue: Aussage von πρωτότοκος ἐκ τῶν νεκρῶν
  choice: „der Erstgeborene aus den Toten“ als Sprache des Auferstehungsvorrangs
  alternative: „der Erste, der von den Toten auferstand“
  rationale: Die wörtliche Bildsprache bewahrt sowohl die zeitliche als auch die rangbezogene Dimension und vermeidet, den Ausdruck auf bloße Reihenfolge zu beschränken.
- issue: Kraft von ἵνα γένηται mit πρωτεύων
  choice: „damit er selbst in allem den ersten Platz einnimmt“
  alternative: „damit er in allem der Erste sei“ oder „damit er in allem Vorrang habe“
  rationale: Die gewählte Form bewahrt Ziel beziehungsweise Ergebnis, die Betonung von αὐτός und die dynamische Nuance von γένηται, ohne eine weitergehende dogmatische Folgerung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ und „Leib“ erhalten die zusammengehörige Metapher; „Gemeinde“ ist gemeinverständlich und vermeidet institutionelle Verengung. Die Satzstruktur bleibt nah am Griechischen, wird aber durch die Wiederaufnahme „Er ist“ natürlich gegliedert.
