  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: de
  text: Verhaltet euch gegenüber Außenstehenden weise und nutzt die Gelegenheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »die günstige Zeit auskaufend«; gemeint ist, die sich bietende Gelegenheit bestmöglich zu nutzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: weise
  rationale: Die adverbiale Wiedergabe ist im modernen Deutschen natürlich und bewahrt den ethischen Sinn von σοφία als bestimmende Art des Verhaltens.
- source_word: περιπατεῖτε
  choice: Verhaltet euch
  rationale: Das griechische Verb bezeichnet hier bildlich die Lebensführung. »Verhaltet euch« gibt in Verbindung mit πρός die auf Außenstehende bezogene Handlungsweise idiomatisch wieder.
- source_word: πρὸς τοὺς ἔξω
  choice: gegenüber Außenstehenden
  rationale: πρός bezeichnet hier die Ausrichtung des Verhaltens auf Menschen außerhalb der glaubenden Gemeinschaft. »Außenstehende« ist knapp und im Deutschen verständlich.
- source_word: τὸν καιρόν
  choice: jede Gelegenheit
  rationale: καιρός meint hier nicht abstrakte Zeit, sondern den geeigneten Zeitpunkt beziehungsweise die sich bietende Gelegenheit. Das distributive »jede« entspricht der deutschen Wendung in diesem Zusammenhang.
- source_word: ἐξαγοραζόμενοι
  choice: nutzt
  rationale: Das Partizip fordert idiomatisch dazu auf, vorhandene Gelegenheiten vollständig wahrzunehmen. »Nutzt« vermittelt diesen Sinn klar, ohne einen sachfremden Erlösungsbezug nahezulegen.
theological_decisions:
- issue: Mögliche heilsgeschichtliche Überdeutung von ἐξαγοραζόμενοι
  choice: Aufforderung, im Umgang mit Nichtchristen jede Gelegenheit weise zu nutzen
  alternative: »die Zeit freikaufen/auskaufen« mit möglichem Anklang an Erlösungssprache
  rationale: Im Kontext bezeichnet das Verb die entschlossene Nutzung einer Gelegenheit, nicht eine Erlösungshandlung. Die Bildsprache wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Metapher »wandeln« wurde zugunsten des unmittelbar verständlichen »sich verhalten« nicht in den Haupttext übernommen. »Außenstehende« bleibt bewusst knapp; gemeint sind Menschen außerhalb der glaubenden Gemeinschaft.
