  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: de
  text: Eure Rede soll immer von Gnade bestimmt und mit Salz gewürzt sein[a][b], damit ihr wisst, wie ihr jedem Einzelnen antworten sollt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freundlich und gütig“. Die Wendung kann eine Rede bezeichnen, die von Freundlichkeit oder Güte geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: „Mit Salz gewürzt“ ist ein Bild für eine angemessene, ansprechende und weise Rede.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: Eure Worte
  rationale: λόγος bezeichnet hier im Zusammenhang die Redeweise der Glaubenden. Der idiomatische deutsche Plural „Worte“ erfasst das allgemeine Reden natürlicher als das wörtliche „euer Wort“.
- source_word: πάντοτε ἐν χάριτι
  choice: immer von Gnade geprägt
  rationale: Die Formulierung bewahrt χάρις ausdrücklich als „Gnade“ und macht zugleich verständlich, dass diese die Rede kennzeichnen soll, ohne die mögliche Bedeutung „freundlich/gütig“ auszuschließen.
- source_word: ἅλατι ἠρτυμένος
  choice: mit Salz gewürzt
  rationale: Die geläufige Metapher und der durch das Perfektpartizip bezeichnete bleibende Charakter der Rede werden bewahrt.
- source_word: εἰδέναι
  choice: damit ihr wisst
  rationale: Der syntaktisch schwierige Infinitiv wird als Zweck- beziehungsweise Folgeangabe wiedergegeben; diese Deutung schafft im Deutschen einen klaren Anschluss, ohne den Gedanken inhaltlich zu erweitern.
- source_word: πῶς δεῖ
  choice: wie ... sollt
  rationale: δεῖ bezeichnet das Erforderliche oder Angemessene. „sollt“ vermittelt hier eine verbindliche, aber nicht unnötig verschärfte Verpflichtung.
- source_word: ἑνὶ ἑκάστῳ
  choice: jedem Einzelnen
  rationale: Die distributive Wendung hebt hervor, dass die Antwort der jeweiligen Person angemessen sein soll.
- source_word: ἀποκρίνεσθαι
  choice: antworten
  rationale: „antworten“ ist die direkte und im Gesprächszusammenhang natürliche Entsprechung.
theological_decisions:
- issue: Bedeutungsumfang von ἐν χάριτι
  choice: von Gnade geprägt
  alternative: freundlich / gütig
  rationale: Die Übersetzung erhält den paulinisch bedeutsamen Begriff „Gnade“, während die Fußnote die zwischenmenschliche Bedeutung einer freundlichen und gütigen Rede offenhält.
- issue: Funktion des Infinitivs εἰδέναι
  choice: 'Zweck oder Folge: „damit ihr wisst“'
  alternative: 'appositionell: „zu wissen, wie ...“'
  rationale: Der griechische Anschluss ist knapp und syntaktisch nicht völlig eindeutig. Die gewählte Fassung ist im Deutschen klar, legt aber keine weitergehende theologische Kausalität fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Salzmetapher und der Begriff „Gnade“ bleiben erhalten; die Satzstruktur ist für natürliches Deutsch behutsam umgestellt.
