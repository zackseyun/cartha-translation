base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: de
  text: Betet dabei auch für uns, dass Gott uns eine Tür für das Wort öffnet, damit wir das Geheimnis des Messias verkünden können, wegen dessen ich auch in Fesseln bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weswegen ich auch in Ketten bin“. Das griechische Perfekt bezeichnet einen fortdauernden Zustand des Gebundenseins beziehungsweise der Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: Betet dabei zugleich auch für uns
  rationale: Das Partizip setzt die Aufforderung aus dem vorherigen Vers fort. „Dabei zugleich auch“ bewahrt sowohl den begleitenden Charakter als auch die Hinzufügung, ohne im Deutschen unverständlich zu wirken.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: dass Gott uns eine Tür für das Wort öffnet
  rationale: Die Formulierung erhält das Bild der geöffneten Tür und gibt ἵνα als Inhalt beziehungsweise Ziel des Gebets wieder. λόγος bezeichnet hier die zu verkündende Botschaft, bleibt aber als „Wort“ stehen.
- source_word: λαλῆσαι
  choice: damit wir … verkünden können
  rationale: Der Infinitiv bezeichnet den Zweck der geöffneten Tür. „Verkünden“ macht im Zusammenhang der Botschaft die gemeinte öffentliche Mitteilung natürlich verständlich, ohne den Inhalt auszuweiten.
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: das Geheimnis des Messias
  rationale: „Geheimnis“ wahrt den paulinischen Ausdruck für Gottes vormals verborgenen und nun offenbarten Plan. Χριστός hat hier titelhaften Gehalt und wird daher mit „Messias“ wiedergegeben.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: um dessentwillen ich auch gefesselt bin
  rationale: διά mit Akkusativ bezeichnet den Grund. Das Perfekt Passiv beschreibt den gegenwärtigen Zustand als Folge der Gefangennahme; „gefesselt bin“ erhält sowohl das Zustandsmoment als auch das Bild des Gebundenseins.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / von Christus
  rationale: Χριστός ist hier als bedeutungsvoller Titel zu verstehen. „Messias“ macht diesen Titel im modernen Deutsch sichtbar, statt ihn lediglich wie einen Eigennamen zu behandeln.
- issue: Metapher θύραν τοῦ λόγου
  choice: eine Tür für das Wort
  alternative: eine Gelegenheit zur Verkündigung
  rationale: Die Übersetzung bewahrt bewusst Paulus’ Türmetapher und löst sie nicht vollständig in eine Deutung als Gelegenheit auf.
- issue: Bezugswort von δι’ ὃ
  choice: um dessentwillen
  alternative: weswegen / für das ich
  rationale: Das relative Pronomen kann grammatisch an „Geheimnis“ anknüpfen, wobei inhaltlich dessen Verkündigung beziehungsweise die damit verbundene Botschaft als Grund der Gefangenschaft mitschwingt. Die Formulierung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt eng mit dem vorhergehenden Gebetsaufruf verbunden. Die Türmetapher und der Ausdruck „Geheimnis“ werden erhalten; „verkünden können“ sorgt innerhalb des langen griechischen Satzgefüges für natürliche deutsche Verständlichkeit.
