  naturalness: '„Damit ich es so offenbar mache“ ist im modernen Standarddeutsch unnatürlich: Das unbegründete „so“ kann eine im griechischen Text nicht vorhandene Vergleichs- oder Modalnuance nahelegen, und „etwas offenbar machen“ wirkt in dieser Verbindung weniger geläufig. „Damit ich es deutlich mache“ ist klar, würdevoll und natürlich.'
