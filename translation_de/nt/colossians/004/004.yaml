lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck des erbetenen Gebets ein und bewahrt die finale Bedeutung knapp und natürlich.
- source_word: φανερώσω
  choice: ich ... offenbar mache
  rationale: Gibt das Sichtbar- bzw. Bekanntmachen wieder und lässt sowohl verständliche Darlegung als auch Offenbarung anklingen.
- source_word: αὐτὸ
  choice: es
  rationale: Bewahrt das griechische Pronomen; es verweist im Zusammenhang auf das in Vers 3 genannte Geheimnis.
- source_word: ὡς
  choice: wie
  rationale: Bezeichnet hier die Art beziehungsweise den Maßstab des Redens.
- source_word: δεῖ
  choice: ich ... soll
  rationale: Drückt die im unpersönlichen δεῖ liegende Notwendigkeit oder Verpflichtung in natürlichem Deutsch aus, ohne sie unnötig zu verschärfen.
- source_word: με
  choice: ich
  rationale: Das griechische Akkusativsubjekt des Infinitivs wird im idiomatischen deutschen Nebensatz als Nominativ wiedergegeben.
- source_word: λαλῆσαι
  choice: reden
  rationale: Ist eine direkte, kontextgerechte Wiedergabe des allgemeinen Verbs für das Sprechen; „verkündigen“ wäre enger als der griechische Ausdruck.
theological_decisions:
- issue: Stärke der durch δεῖ bezeichneten Verpflichtung
  choice: wie ich reden soll
  alternative: wie ich reden muss
  rationale: „Soll“ wahrt den Gedanken einer gebotenen oder angemessenen Weise des Redens; „muss“ ist ebenfalls möglich und betont die Notwendigkeit stärker.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Gedankengang; „offenbar machen“ bewahrt die Bedeutungsbreite von φανερόω, während die Fußnote geläufigere Alternativen nennt.
