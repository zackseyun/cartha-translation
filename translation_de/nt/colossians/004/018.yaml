  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: de
  text: Diesen Gruß schreibe ich, Paulus, eigenhändig.[a] Denkt an meine Fesseln.[b] Die Gnade sei mit euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der Gruß mit meiner, des Paulus, eigenen Hand.« Gemeint ist ein von Paulus persönlich geschriebener abschließender Gruß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Denkt an meine Gefangenschaft.« Wörtlich: »meine Fesseln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: Gruß
  rationale: Bezeichnet hier den abschließenden, von Paulus persönlich geschriebenen Gruß. »Gruß« ist im modernen Deutschen natürlich und bewahrt den brieflichen Zusammenhang.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: ist von meiner eigenen Hand – von Paulus
  rationale: Die Dativwendung kennzeichnet den eigenhändig geschriebenen Schluss. Die Ergänzung »ist« macht die elliptische griechische Formulierung im Deutschen verständlich; die Nachstellung »von Paulus« bewahrt die emphatische Selbstbezeichnung.
- source_word: μνημονεύετέ
  choice: Denkt an
  rationale: Der Präsensimperativ fordert dazu auf, Paulus und seine Lage weiterhin im Bewusstsein zu behalten. »Denkt an« ist idiomatisch und überzeichnet den Aspekt nicht.
- source_word: μου τῶν δεσμῶν
  choice: meine Fesseln
  rationale: δεσμοί bezeichnet wörtlich Fesseln und steht zugleich für die Gefangenschaft. Die konkrete Bildsprache bleibt erhalten.
- source_word: ἡ χάρις
  choice: Die Gnade
  rationale: Die bestimmte Artikelform des Griechischen wird bewahrt. Es handelt sich um den üblichen paulinischen Segensschluss, ohne dass ein im Text nicht genannter Urheber ergänzt wird.
- source_word: μεθ’ ὑμῶν
  choice: sei mit euch
  rationale: Für den verblosen griechischen Segenswunsch wird im Deutschen idiomatisch »sei« ergänzt. »Mit euch« gibt μετά mit Genitiv direkt wieder.
theological_decisions:
- issue: Verbloser paulinischer Segensschluss
  choice: Die Gnade sei mit euch
  alternative: Die Gnade mit euch
  rationale: Das Griechische enthält kein ausdrückliches Verb. Das ergänzte »sei« formuliert im Deutschen einen natürlichen Segenswunsch, ohne zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form des Briefschlusses und das konkrete Bild der Fesseln bleiben erhalten; die Gedankenstrichkonstruktion bildet die betonte persönliche Kennzeichnung des Paulus idiomatisch ab.
