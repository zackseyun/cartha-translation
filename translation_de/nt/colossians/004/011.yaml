id: COL.4.11
reference: Colossians 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: de
  text: und Jesus, der Justus genannt wird. Von den Beschnittenen sind nur diese meine Mitarbeiter für das Reich Gottes,[a] und sie sind mir ein Trost geworden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese sind die einzigen Mitarbeiter für das Reich Gottes, die zu den Beschnittenen gehören.“'
    reason: Die griechische Wortstellung lässt im Deutschen auch diese syntaktische Zuordnung zu; die Hauptfassung versteht „nur“ als Einschränkung innerhalb der Gruppe der Beschnittenen.
  - marker: b
    text: 'Oder: „und sie sind mir eine Ermutigung geworden.“'
    reason: παρηγορία kann sowohl Trost als auch Ermutigung beziehungsweise Zuspruch bezeichnen.
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: Jesus, der Justus genannt wird
  rationale: Die übliche neutestamentliche Namensform „Jesus“ bleibt erhalten; die partizipiale Wendung bezeichnet seinen weiteren Namen Justus.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: von den Beschnittenen
  rationale: Die Formulierung bewahrt das Bild der Beschneidung als jüdisches Identitätsmerkmal und klingt im Deutschen natürlicher als „aus der Beschneidung“.
- source_word: οὗτοι μόνοι συνεργοί
  choice: nur diese meine Mitarbeiter
  rationale: „Nur diese“ erhält die hervorgehobene Ausschließlichkeit. Das im Zusammenhang erschlossene „meine“ macht die Beziehung zu Paulus idiomatisch deutlich, ohne den Kreis aller Mitarbeiter am Reich Gottes einzuschränken.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: für das Reich Gottes
  rationale: „Für“ gibt die Ziel- beziehungsweise Dienstbeziehung von εἰς bei συνεργοί natürlich wieder; „Reich Gottes“ ist die etablierte und sachlich offene Wendung.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: sie sind mir ein Trost geworden
  rationale: Die Formulierung bildet γίνομαι als „geworden“ ab und gibt παρηγορία mit dem hier passenden „Trost“ wieder.
theological_decisions:
- issue: Bezug von „von den Beschnittenen“
  choice: Bezeichnung von Mitarbeitern jüdischer Herkunft
  alternative: Bezeichnung einer engeren Beschneidungspartei
  rationale: Im Kontext zählt Paulus Mitarbeiter auf. Die Übersetzung belässt das Beschneidungsbild und legt nicht ausdrücklich fest, ob zusätzlich eine bestimmte Gruppenzugehörigkeit gemeint ist.
- issue: Reichweite von „nur diese“
  choice: Nur diese aus der genannten Gruppe sind Paulus’ Mitarbeiter für das Reich Gottes
  alternative: Diese sind überhaupt die einzigen Mitarbeiter für das Reich Gottes
  rationale: Die Voranstellung der Gruppe οἱ ὄντες ἐκ περιτομῆς legt nahe, die Ausschließlichkeit auf die Personen aus diesem Kreis zu beziehen. „Meine Mitarbeiter“ verhindert ein theologisch zu weitreichendes Verständnis.
- issue: Syntaktische Zuordnung der Gruppenangabe
  choice: „Von den Beschnittenen sind nur diese meine Mitarbeiter …“
  alternative: „Diese sind die einzigen Mitarbeiter …, die zu den Beschnittenen gehören“
  rationale: Die Hauptfassung folgt der griechischen Informationsfolge und betont die Ausschließlichkeit innerhalb der zuvor bezeichneten Gruppe; die alternative Zuordnung bleibt als Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers setzt eine Namensliste aus dem vorherigen Zusammenhang fort und beginnt deshalb mit „und“. Das traditionelle Bild „Beschneidung“ wird nicht durch die auslegende Bezeichnung „Juden“ ersetzt. Alle Fußnotenmarker stehen unmittelbar an den betroffenen Aussagen.
