id: COL.4.1
reference: Colossians 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: de
  text: Ihr Herren, gewährt euren Sklaven, was recht und fair[a] ist. Ihr wisst ja, dass auch ihr einen Herrn im Himmel habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Rechte und die Gleichheit“. Das griechische Wort kann auch „Gleichheit“, „Fairness“ oder „Billigkeit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: ihr Herren
  rationale: Im antiken Hausstand bezeichnet κύριοι die Herren der Sklaven. „Herren“ bewahrt zugleich die bewusste sprachliche Verbindung zum himmlischen κύριος, ohne den Begriff interpretierend auf „Sklavenhalter“ zu verengen.
- source_word: τὸ δίκαιον
  choice: was recht ist
  rationale: Das substantivierte Adjektiv bezeichnet das Rechte beziehungsweise Gerechte. „Was recht ist“ ist verständlich, würdevoll und bewahrt den ethischen Gehalt.
- source_word: τὴν ἰσότητα
  choice: fair
  rationale: ἰσότης kann Gleichheit, Fairness oder Billigkeit bezeichnen. „Fair“ ergibt im Zusammenhang eine natürliche Aufforderung zu gerechter Behandlung; die bedeutende Alternative „Gleichheit“ wird in der Fußnote erhalten.
- source_word: τοῖς δούλοις
  choice: euren Sklaven
  rationale: Da ausdrücklich Herren und δοῦλοι einander gegenübergestellt werden, ist der unfreie soziale Status deutlich. „Sklaven“ vermeidet die verharmlosende Wiedergabe „Diener“.
- source_word: παρέχεσθε
  choice: gewährt
  rationale: Das Imperativverb fordert dazu auf, den Sklaven das Genannte zukommen zu lassen. „Gewährt“ passt natürlich zum Objekt „was recht und fair ist“.
- source_word: εἰδότες
  choice: ihr wisst ja
  rationale: Die partizipiale Wendung nennt die begründende Kenntnis hinter dem Gebot. Ein eigener deutscher Satz ist idiomatisch; „ja“ macht den begründenden Anschluss sichtbar, ohne ihn übermäßig festzulegen.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die Formulierung betont, dass selbst die angesprochenen Herren unter der Autorität eines anderen Herrn stehen.
- source_word: κύριον
  choice: einen Herrn
  rationale: „Herr“ bewahrt das theologische Gewicht von κύριος und zugleich das im Griechischen beabsichtigte Wortspiel mit den menschlichen Herren.
- source_word: ἐν οὐρανῷ
  choice: im Himmel
  rationale: Dies ist die natürliche standarddeutsche Wiedergabe der singularischen Ortsangabe.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Kontext der Haustafel
  choice: Sklaven
  alternative: Diener; Unfreie
  rationale: Die ausdrückliche Beziehung zu menschlichen Herren macht den rechtlich und sozial unfreien Status relevant. „Diener“ würde diese Realität abschwächen.
- issue: Bedeutung von ἰσότητα
  choice: fair im Haupttext, Gleichheit als Fußnotenalternative
  alternative: Gleichheit; Gerechtigkeit; Billigkeit
  rationale: Der Kontext lässt gerechte beziehungsweise angemessene Behandlung erkennen, doch ἰσότης kann ausdrücklich „Gleichheit“ bedeuten. Die Fußnote bewahrt diese exegetisch und theologisch bedeutsame Spannung.
- issue: Wortbeziehung zwischen κύριοι und κύριον
  choice: beide Male Herr/Herren
  alternative: Gebieter für die Menschen und Herr für Christus
  rationale: 'Die gleiche Wortwurzel im Deutschen lässt die Pointe erkennen: Die irdischen Herren haben selbst einen Herrn im Himmel. Die Aussage identifiziert diesen Herrn hier nicht ausdrücklich, auch wenn der Kontext Christus nahelegt.'
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Anrede „Ihr Herren“ markiert den Vokativ natürlich. Die Teilung in zwei Sätze verbessert die Verständlichkeit, während „auch ihr“ und die Wiederholung von „Herr“ die rhetorische Gegenüberstellung des griechischen Textes erhalten.
