  naturalness: „Ihr Herren, gewährt euren Sklaven, was recht und fair ist“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Auch die anschließende Satzbildung ist idiomatisch. Die Fußnotenalternative sollte jedoch die zwei griechischen Substantivgruppen nicht in einer grammatisch uneinheitlichen deutschen Form wiedergeben.
