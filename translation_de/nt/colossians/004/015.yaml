  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: de
  text: Grüßt die Brüder und Schwestern in Laodizea sowie Nympha und die Gemeinde in ihrem Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Handschriften beziehungsweise Lesarten haben „Nymphas und die Gemeinde in seinem Haus“; andere haben ein Pluralpronomen: „Nympha und die Gemeinde in einem Haus, das ihnen gehört.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Imperativ in der zweiten Person Plural fordert unmittelbar dazu auf, Grüße auszurichten. „Grüßt“ ist knapp, natürlich und wahrt die Befehlsform.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: die Brüder und Schwestern in Laodizea
  rationale: Das grammatisch maskuline Pluralwort ἀδελφοί bezeichnet im paulinischen Gemeindekontext häufig Glaubensgeschwister beiderlei Geschlechts. „Brüder und Schwestern“ gibt den gemeinten Personenkreis im heutigen Deutsch klar wieder, ohne ihn zum abstrakten „Gläubige“ zu verflachen.
- source_word: Νύμφαν
  choice: Nympha
  rationale: Die gedruckte SBLGNT-Lesart Νύμφαν wird am unmittelbarsten als Akkusativ des weiblichen Namens „Nympha“ verstanden. Abweichende Lesarten werden in der Fußnote dokumentiert.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: die Gemeinde in ihrem Haus
  rationale: κατ’ οἶκον bezeichnet hier eine Gemeinde, die in einem Privathaus zusammenkommt. Die knappe Wiedergabe „in ihrem Haus“ bewahrt die Ausdrucksweise des Ausgangstextes, ohne das sinngemäße „die sich versammelt“ ausdrücklich hinzuzufügen.
- source_word: ἐκκλησίαν
  choice: Gemeinde
  rationale: ἐκκλησία bezeichnet hier die örtlich versammelte christliche Gemeinschaft. „Gemeinde“ ist dafür im modernen deutschen Bibelstil natürlicher und genauer als „Kirche“, das auch ein Gebäude oder eine Institution bezeichnen kann.
theological_decisions:
- issue: Identität beziehungsweise Geschlecht von Νύμφαν und zugehöriges Pronomen
  choice: Nympha … die Gemeinde in ihrem Haus
  alternative: Nymphas … die Gemeinde in seinem Haus; außerdem ist die Lesart „in ihrem gemeinsamen Haus“ bezeugt.
  rationale: Der gedruckte SBLGNT-Text hat Νύμφαν und αὐτῆς, also einen weiblichen Namen mit femininem Singularpronomen. Da die handschriftliche Überlieferung auch eine männliche sowie eine plurale Zuordnung stützt, werden diese Möglichkeiten nicht stillschweigend ausgeschlossen, sondern in einer textkritischen Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Brüder und Schwestern“ macht den im Gemeindekontext inklusiven Gebrauch von ἀδελφοί verständlich. „Gemeinde“ vermeidet die im Deutschen mögliche Verwechslung von Gemeinschaft und Kirchengebäude. Der textkritische Haupttext wird beibehalten; echte Varianten werden in der Fußnote offengelegt.
