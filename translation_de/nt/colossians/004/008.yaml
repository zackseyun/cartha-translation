id: COL.4.8
reference: Colossians 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: de
  text: 'Ich habe ihn zu genau diesem Zweck zu euch gesandt: damit ihr erfahrt, wie es uns geht,[a] und damit er eure Herzen ermutigt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „damit wir erfahren, wie es euch geht“.'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: Ihn
  rationale: Das Akkusativpronomen bezieht sich auf Tychikus im vorhergehenden Vers; am Satzanfang ist „Ihn“ im Deutschen klar und natürlich.
- source_word: ἔπεμψα
  choice: habe ich ... gesandt
  rationale: Das Perfekt entspricht in einem modernen deutschen Briefkontext natürlich dem griechischen Aorist und bezeichnet die bereits veranlasste Sendung.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Bei einem Verb des Sendens bezeichnet πρός mit Akkusativ die Richtung zu Personen.
- source_word: εἰς αὐτὸ τοῦτο
  choice: gerade deshalb
  rationale: Die Formulierung gibt Zweck und Nachdruck des griechischen Ausdrucks knapp und idiomatisch wieder.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ kennzeichnet die beiden beabsichtigten Zwecke im Deutschen eindeutig.
- source_word: γνῶτε
  choice: ihr erfahrt
  rationale: Im Zusammenhang mit Tychikus als Überbringer von Nachrichten bezeichnet γινώσκω das Bekanntwerden der Lage; „erfahrt“ ist hier natürlicher als das statische „wisst“.
- source_word: τὰ περὶ ἡμῶν
  choice: wie es uns geht
  rationale: Die Wendung meint die Nachrichten über Paulus und seine Begleiter und wird persönlich und idiomatisch wiedergegeben.
- source_word: παρακαλέσῃ
  choice: ermutigt
  rationale: παρακαλέω kann ermutigen, trösten oder zureden bedeuten. Im Zusammenhang der überbrachten Nachricht bewahrt „ermutigt“ die stärkende Bedeutung, ohne sie unnötig einzuengen.
- source_word: τὰς καρδίας ὑμῶν
  choice: eure Herzen
  rationale: Die direkte Wiedergabe erhält die biblische Rede vom Herzen als innerem Zentrum des Menschen.
theological_decisions:
- issue: Textvariante zur Richtung des Kennenlernens im ersten Zwecksatz
  choice: 'Dem SBLGNT folgend: „damit ihr erfahrt, wie es uns geht“ (γνῶτε τὰ περὶ ἡμῶν).'
  alternative: 'Einige Handschriften bieten sinngemäß: „damit wir erfahren, wie es euch geht“ (γνῶμεν τὰ περὶ ὑμῶν beziehungsweise verwandte Lesarten).'
  rationale: Der Haupttext folgt der vorgegebenen griechischen Ausgabe. Da die Variante die Richtung der Nachricht grundlegend umkehrt und textgeschichtlich bedeutsam ist, wird sie in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt und die wiederholte Konstruktion „damit ... und damit ...“ machen die beiden Zweckangaben transparent; „eure Herzen“ bewahrt die Bildsprache des Ausgangstextes.
