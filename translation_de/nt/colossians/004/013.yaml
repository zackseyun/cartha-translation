revisions:
- from: Denn ich bezeuge ihm, dass er sich sehr für euch abmüht, ebenso für die Menschen in Laodizea und in Hierapolis.[a]
  to: Denn ich bezeuge von ihm, dass er sich sehr für euch und für die in Laodizea und die in Hierapolis abmüht.[a]
  rationale: Die Revision ersetzt das im Deutschen sachlich falsche „ich bezeuge ihm“ durch „ich bezeuge von ihm“. Sie lässt πόνος als anstrengende Mühe stehen, erhält die parallele Nennung aller drei Bezugsgruppen und bereinigt die Fußnote hinsichtlich Bezug und Stärke der Alternativen.
