base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: de
  text: Denn ich bezeuge von ihm, dass er sich sehr für euch und für die in Laodizea und die in Hierapolis abmüht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er sich große Mühe gibt“, „dass er große Sorge hat“ oder „dass er große Bedrängnis hat“. Das griechische Wort kann anstrengende Mühe und in diesem Zusammenhang auch intensive Sorge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: Denn ich bezeuge ihm
  rationale: Die direkte Wiedergabe bewahrt den erklärenden Anschluss von γάρ und lässt beim Dativ αὐτῷ offen, ob das Zeugnis ihm gilt beziehungsweise zu seinen Gunsten abgelegt wird.
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: dass er sich sehr abmüht
  rationale: Die idiomatische deutsche Wendung gibt die starke Anstrengung von πολὺν πόνον wieder, ohne sie ausschließlich auf Sorge, seelischen Schmerz oder Gebet einzuengen.
- source_word: ὑπὲρ ὑμῶν
  choice: für euch
  rationale: ὑπέρ bezeichnet hier Einsatz zugunsten der Adressaten; „für“ ist natürlich und präzise.
- source_word: τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει
  choice: für die Menschen in Laodizea und in Hierapolis
  rationale: Die substantivierten Ortsangaben bezeichnen die dortigen Personen. „Menschen“ vermeidet eine unnötig konfessionelle Präzisierung, die im griechischen Wortlaut nur aus dem Kontext folgt.
theological_decisions:
- issue: Bedeutung von πόνος für den Dienst des Epaphras
  choice: sich sehr abmühen
  alternative: große Mühe haben; große Sorge empfinden; tiefe Qual leiden
  rationale: Der Zusammenhang mit dem Gebetskampf in 4,12 erlaubt sowohl tatkräftige Mühe als auch intensive Sorge. Die gewählte Formulierung hält den Grundsinn anstrengender Mühe fest, ohne die emotionale Dimension auszuschließen.
- issue: Funktion des Dativs αὐτῷ bei μαρτυρῶ
  choice: ich bezeuge ihm
  alternative: ich bezeuge für ihn; ich bezeuge über ihn
  rationale: Der Dativ kann die Person bezeichnen, der das Zeugnis gilt oder zu deren Gunsten es abgelegt wird. Die formnahe Übersetzung wahrt diese Mehrdeutigkeit, klingt im Deutschen jedoch bewusst etwas feierlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ stellt den erklärenden Bezug zum vorherigen Vers her. Die Parallelität der drei Personengruppen bleibt gewahrt; das wiederholte „für“ wird vor der letzten Doppelformulierung aus natürlichem deutschem Stil nicht nochmals gesetzt.
