lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: am Gebet
  rationale: Der Dativ mit Artikel bezeichnet hier das Gebet als fortdauernde Praxis, nicht ein bestimmtes einzelnes Gebet. Die Verbindung „am Gebet festhalten“ ist im Deutschen natürlich und bewahrt den Bezug.
- source_word: προσκαρτερεῖτε
  choice: Haltet beharrlich … fest
  rationale: Der Präsensimperativ fordert zu anhaltender Ausdauer und Hingabe auf. „Beharrlich … festhalten“ gibt sowohl die fortdauernde als auch die verpflichtende Nuance wieder.
- source_word: γρηγοροῦντες
  choice: bleibt dabei wachsam
  rationale: 'Das Partizip beschreibt, wie die Aufforderung zum Gebet ausgeführt werden soll: mit wacher, aufmerksamer Haltung. „Wachsam“ vermeidet die zu wörtliche mögliche Deutung, man solle körperlich wach bleiben.'
- source_word: ἐν αὐτῇ
  choice: dabei
  rationale: Das Pronomen verweist am natürlichsten auf das Gebet zurück. „Dabei“ stellt diesen Rückbezug im Deutschen flüssig her, ohne ihn unnötig auszudeuten.
- source_word: ἐν εὐχαριστίᾳ
  choice: dankbar
  rationale: Die Präpositionalphrase bezeichnet die begleitende Haltung des Betens und Wachens. Das Adverbial „dankbar“ gibt diesen Sinn knapp und idiomatisch wieder.
