  text: Haltet beharrlich am Gebet fest und bleibt dabei wachsam und voller Dankbarkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Widmet euch beständig dem Gebet; seid darin wachsam und voller Dankbarkeit.“'
