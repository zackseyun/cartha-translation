id: COL.4.10
reference: Colossians 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: de
  text: 'Aristarch, mein Mitgefangener, grüßt euch, ebenso Markus, der Cousin des Barnabas[a]. Über ihn habt ihr Anweisungen erhalten: Wenn er zu euch kommt, heißt ihn willkommen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Neffe des Barnabas«. Ältere Übersetzungen geben ἀνεψιός teilweise so wieder; im Koine-Griechischen ist »Cousin« jedoch die genauere Bedeutung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nehmt ihn auf«. Das griechische Verb kann die gastfreundliche Aufnahme eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: grüßt
  rationale: Die Verbform leitet einen brieflichen Gruß ein. »Grüßt« gibt sie knapp, direkt und im Deutschen natürlich wieder.
- source_word: συναιχμάλωτός
  choice: Mitgefangener
  rationale: Das Kompositum bezeichnet jemanden, der zusammen mit einem anderen gefangen ist. »Mitgefangener« bewahrt den konkreten Wortsinn, ohne die Gefangenschaft näher zu deuten.
- source_word: ἀνεψιὸς
  choice: Cousin
  rationale: ἀνεψιός bezeichnet im Koine-Griechischen genauer einen Cousin. »Neffe« ist eine überlieferte, aber lexikalisch weniger wahrscheinliche Wiedergabe.
- source_word: ἐλάβετε ἐντολάς
  choice: habt ihr Anweisungen erhalten
  rationale: ἐντολή kann einen Befehl oder eine Anweisung bezeichnen. Im Zusammenhang mit Markus’ möglichem Besuch ist »Anweisungen« natürlich, ohne den verbindlichen Charakter zu beseitigen.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: Wenn er zu euch kommt
  rationale: Die Verbindung aus ἐάν und Aorist Konjunktiv bezeichnet hier eine offene, auf die Zukunft gerichtete Bedingung. Die gewählte Formulierung ist im Deutschen idiomatisch.
- source_word: δέξασθε αὐτόν
  choice: heißt ihn willkommen
  rationale: δέχομαι kann im Zusammenhang mit Besuch und Gastfreundschaft bedeuten, jemanden aufzunehmen oder willkommen zu heißen. Die Formulierung macht diesen zwischenmenschlichen Sinn in heutigem Deutsch deutlich.
theological_decisions:
- issue: Art der mit συναιχμάλωτός μου bezeichneten Beziehung zwischen Paulus und Aristarch
  choice: »mein Mitgefangener« ohne nähere Bestimmung
  alternative: »mein Mitgefangener im Herrn« oder eine bildliche Deutung als Leidensgefährte
  rationale: Der Vers selbst erklärt nicht, ob die Gefangenschaft ausschließlich wörtlich oder zugleich bildlich-theologisch zu verstehen ist. Die Übersetzung bewahrt diese Offenheit und fügt »im Herrn« nicht hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Briefstil. »Ebenso« macht deutlich, dass sich der Gruß auch auf Markus bezieht, ohne das griechische Satzgefüge unnötig schwerfällig nachzubilden. Die Klammer des Ausgangstextes wird als eigener Satz wiedergegeben, damit die Anweisung klar und natürlich lesbar bleibt.
