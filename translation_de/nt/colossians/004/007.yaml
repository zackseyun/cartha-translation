source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: de
  text: Alles, was mich betrifft,[a] wird euch Tychikus mitteilen, der geliebte Bruder und treue Diener und Mitsklave im Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles über meine Lage“ oder „Alle meine Umstände“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: Alles, was mich betrifft
  rationale: Die Wendung bezeichnet umfassend die Angelegenheiten, Lage oder Umstände des Paulus. Die gewählte Formulierung ist natürlich und lässt den genauen Umfang offen.
- source_word: γνωρίσει ὑμῖν
  choice: wird euch … mitteilen
  rationale: γνωρίζω bedeutet hier, jemanden etwas wissen zu lassen oder zu informieren. „Mitteilen“ gibt dies in natürlichem, würdigem Deutsch wieder.
- source_word: Τυχικὸς
  choice: Tychikus
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: der geliebte Bruder
  rationale: Die Formulierung bewahrt die herzliche und ehrende Bezeichnung des Tychikus; der maskuline Singular bezieht sich konkret auf ihn.
- source_word: πιστὸς διάκονος
  choice: treue Diener
  rationale: διάκονος kann einen Diener, Mitarbeiter oder Amtsträger bezeichnen. Da ein kirchliches Amt hier nicht eindeutig gemeint ist, bleibt „Diener“ bewusst allgemein.
- source_word: σύνδουλος
  choice: Mitknecht
  rationale: Das Kompositum bezeichnet jemanden, der denselben gebundenen Dienst teilt. „Mitknecht“ bewahrt diese Beziehung in knapper, bibelsprachlich verständlicher Form, ohne sie als kirchliches Amt zu deuten.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die geläufige paulinische Wendung bezeichnet die durch den Herrn bestimmte Beziehung und Lebenssphäre, ohne diese näher aufzulösen.
theological_decisions:
- issue: Bedeutungsumfang von διάκονος
  choice: Diener
  alternative: Diakon; Mitarbeiter
  rationale: Der Kontext würdigt den zuverlässigen Dienst des Tychikus, weist aber nicht eindeutig auf das später klar umrissene Gemeindeamt eines Diakons hin.
- issue: Wiedergabe der gebundenen Dienststellung in σύνδουλος
  choice: Mitknecht
  alternative: Mitdiener; Mitsklave
  rationale: „Mitknecht“ hält fest, dass Tychikus gemeinsam mit Paulus unter der Herrschaft eines Herrn dient. „Mitdiener“ schwächt die Gebundenheit ab, während „Mitsklave“ sie deutlicher ausdrückt, im heutigen Deutsch jedoch leicht ausschließlich neuzeitliche Formen gewaltsamer Versklavung aufruft.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung hebt zunächst den umfassenden Inhalt der Mitteilung hervor und folgt damit dem griechischen Fokus. „Mitknecht“ ist leicht bibelsprachlich, bewahrt aber prägnant die gemeinsame Unterordnung unter den Herrn.
