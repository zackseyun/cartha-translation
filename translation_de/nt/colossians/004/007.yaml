    rationale: Das Wort ist stark traditionssprachlich und im aktuellen allgemeinen Sprachgebrauch kaum produktiv. „Mitsklave“ gibt die Bildung σύν-δουλος und die zugrunde liegende Statusmetapher direkter wieder; die Fußnote wahrt die alternativen, weniger markierten Formulierungen.
  revised_text: Alles, was mich betrifft,[a] wird euch Tychikus mitteilen, der geliebte Bruder und treue Diener und Mitsklave im Herrn.
