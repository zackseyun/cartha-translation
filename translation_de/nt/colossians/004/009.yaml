source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: de
  text: zusammen mit Onesimus, dem treuen und geliebten Bruder, der einer von euch ist. Sie werden euch alles mitteilen, was hier vor sich geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alles hier“ oder „alle Dinge hier“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: zusammen mit Onesimus
  rationale: σύν bezeichnet Begleitung und knüpft an Tychikus im vorherigen Vers an. „Zusammen mit“ macht diese Verbindung im Deutschen klar und natürlich.
- source_word: πιστῷ
  choice: treuen
  rationale: πιστός beschreibt Onesimus hier als treu beziehungsweise zuverlässig. „Treu“ bewahrt sowohl den ethischen als auch den gemeindlichen Klang.
- source_word: ἀγαπητῷ
  choice: geliebten
  rationale: ἀγαπητός drückt herzliche Wertschätzung innerhalb der christlichen Gemeinschaft aus. „Geliebt“ wäre möglich, doch attributiv ist „geliebten“ idiomatischer und würdevoll.
- source_word: ἀδελφῷ
  choice: Bruder
  rationale: Das maskuline Substantiv bezeichnet hier einen männlichen Glaubensbruder. „Bruder“ bewahrt die familiäre Sprache des griechischen Textes ohne erklärenden Zusatz.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: der einer von euch ist
  rationale: ἐξ ὑμῶν kann Herkunft oder Zugehörigkeit ausdrücken. „Einer von euch“ ist im Deutschen idiomatisch und lässt die gemeinschaftliche Zugehörigkeit hervortreten, ohne weitere biografische Aussagen einzutragen.
- source_word: γνωρίσουσιν
  choice: werden ... berichten
  rationale: γνωρίζω bedeutet bekannt machen oder mitteilen. In Verbindung mit den örtlichen Angelegenheiten gibt „berichten“ den Sinn natürlich wieder, ohne einen besonderen Offenbarungsgehalt anzudeuten.
- source_word: πάντα ... τὰ ὧδε
  choice: alles ..., was hier geschieht
  rationale: Die Wendung bezeichnet umfassend die Angelegenheiten am Aufenthaltsort des Paulus. „Was hier geschieht“ ist natürliches modernes Deutsch; dass das Griechische wörtlicher von „den Dingen hier“ spricht, wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Gemeindliche Bedeutung von ἀδελφῷ
  choice: Bruder
  alternative: Bruder im Glauben
  rationale: Der Kontext bezeichnet einen Mitchristen, doch der griechische Text sagt schlicht „Bruder“. Die Übersetzung bewahrt dieses Bild, ohne es erläuternd zu erweitern.
- issue: Bedeutung von ἐξ ὑμῶν
  choice: der einer von euch ist
  alternative: der aus eurer Mitte stammt
  rationale: Die Formulierung hält Onesimus’ Zugehörigkeit zur angesprochenen Gemeinschaft fest, ohne aus dem Philemonbrief zusätzliche soziale oder biografische Folgerungen in diesen Vers einzutragen.
- issue: Sachlicher Umfang von τὰ ὧδε
  choice: was hier geschieht
  alternative: die Dinge hier
  rationale: Die idiomatische Wiedergabe versteht die Wendung als Hinweis auf die Lage und Ereignisse bei Paulus. Die offenere, formnähere Möglichkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. „Geliebter Bruder“ bewahrt die Wärme der frühchristlichen Gemeinschaftssprache; „berichten“ vermeidet die im Deutschen schwerfällige Formulierung „bekannt machen“.
