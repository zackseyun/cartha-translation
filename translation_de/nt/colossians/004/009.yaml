revisions:
- from: zusammen mit Onesimus, dem treuen und geliebten Bruder, der einer von euch ist. Sie werden euch alles berichten, was hier geschieht.[a]
  to: zusammen mit Onesimus, dem treuen und geliebten Bruder, der einer von euch ist. Sie werden euch alles mitteilen, was hier vor sich geht.[a]
  rationale: Die Revision vermeidet die sachliche Verengung auf bloße Ereignisse, ohne den Satz im Deutschen unnatürlich zu machen. „Mitteilen“ gibt γνωρίσουσιν präzise und idiomatisch wieder; die Fußnote bewahrt die formnähere, offenere Ausdrucksweise von τὰ ὧδε.
