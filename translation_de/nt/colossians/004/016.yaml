  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: de
  text: Und wenn dieser Brief bei euch vorgelesen worden ist, sorgt dafür, dass er auch in der Gemeinde der Laodizener vorgelesen wird und dass auch ihr den aus Laodizea[a] lest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den aus Laodizea“; das Wort „Brief“ ist im Griechischen nur mitgemeint. Welcher Brief gemeint ist und ob er ursprünglich an Laodizea gerichtet war, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: vorgelesen worden ist / lest
  rationale: ἀναγινώσκω bedeutet „lesen“ und bezeichnet in diesem gemeindlichen Zusammenhang wahrscheinlich öffentliches Vorlesen. Beim ersten und zweiten Vorkommen macht „vorgelesen“ den gemeinschaftlichen Rahmen natürlich deutlich; beim letzten genügt „lest“, da der Briefwechsel zwischen Gemeinden bereits klar ist.
- source_word: παρ’ ὑμῖν
  choice: bei euch
  rationale: παρά mit Dativ bezeichnet hier den Ort beziehungsweise den sozialen Bereich der kolossischen Gemeinde. „Bei euch“ ist idiomatisch und lässt sowohl die Anwesenheit als auch den Gemeindekontext erkennen.
- source_word: ἡ ἐπιστολή
  choice: dieser Brief
  rationale: Der Artikel verweist auf den vorliegenden Kolosserbrief. Das deutsche Demonstrativpronomen verdeutlicht diesen Bezug auf natürliche Weise.
- source_word: ποιήσατε ἵνα
  choice: sorgt dafür, dass
  rationale: Die Verbindung aus Imperativ und ἵνα-Satz fordert dazu auf, das genannte Ergebnis sicherzustellen. „Sorgt dafür, dass“ ist gegenwärtiges, klares Deutsch und bewahrt die Aufforderungskraft.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: in der Gemeinde der Laodizener
  rationale: ἐκκλησία bezeichnet hier die örtliche christliche Gemeinde. „Gemeinde“ ist im modernen Deutschen natürlicher und weniger institutionell als „Kirche“; der Genitiv „der Laodizener“ bildet die griechische Struktur ab.
- source_word: τὴν ἐκ Λαοδικείας
  choice: den Brief aus Laodizea
  rationale: Das feminine Akkusativpronomen setzt ἐπιστολή voraus. Im Deutschen muss „Brief“ zur Klarheit ergänzt werden. ἐκ wird mit „aus“ wiedergegeben und nicht als „an Laodizea“ umgedeutet.
theological_decisions:
- issue: Identität des Briefes aus Laodizea
  choice: Neutral als „den Brief aus Laodizea“ wiedergeben.
  alternative: Paulus’ Brief an die Laodizener; ein von Laodizea weitergeleiteter Brief; ein Rundbrief, möglicherweise der Epheserbrief.
  rationale: Der griechische Text benennt weder Adressaten noch Identität des Briefes, sondern nur seine Herkunft beziehungsweise seinen Weg „aus Laodizea“. Die Übersetzung bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorgelesen“ macht den wahrscheinlichen gemeindlichen Rahmen deutlich; die abschließende Formulierung bleibt hinsichtlich der Identität und ursprünglichen Bestimmung des Briefes bewusst offen.
