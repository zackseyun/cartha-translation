id: COL.4.17
reference: Colossians 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: de
  text: 'Und sagt Archippus: »Achte darauf, dass du den Dienst, den du im Herrn[a] empfangen hast, ganz erfüllst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: »den Dienst, den du vom Herrn empfangen hast«.'
    reason: Die Wendung ἐν κυρίῳ kann neben dem Bereich beziehungsweise der Beziehung, in der Archippus den Dienst empfing, sinngemäß auch auf dessen Herkunft vom Herrn bezogen werden.
lexical_decisions:
- source_word: εἴπατε
  choice: sagt
  rationale: Der Aoristimperativ Plural richtet sich an die Gemeinde. „Sagt“ gibt die Aufforderung schlicht und unmittelbar wieder.
- source_word: Ἀρχίππῳ
  choice: Archippus
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: Βλέπε
  choice: Achte darauf
  rationale: Der Präsensimperativ Singular fordert Archippus zu anhaltender Aufmerksamkeit und Sorgfalt auf; „Achte darauf“ ist natürliches modernes Deutsch.
- source_word: διακονίαν
  choice: Dienst
  rationale: „Dienst“ bewahrt die Breite von διακονία als anvertraute Aufgabe beziehungsweise christlichen Dienst, ohne ein bestimmtes kirchliches Amt vorauszusetzen.
- source_word: παρέλαβες
  choice: empfangen hast
  rationale: Die Form bezeichnet das Empfangen beziehungsweise Übernehmen eines anvertrauten Dienstes; „empfangen hast“ wahrt, dass dieser nicht eigenmächtig angenommen wurde.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die Wiedergabe folgt der Präposition ἐν und lässt offen, ob die Wendung vor allem den Bereich, die Beziehung zum Herrn oder mittelbar die Herkunft des Dienstes bezeichnet.
- source_word: ἵνα
  choice: dass
  rationale: Nach „Achte darauf“ bringt der dass-Satz die Zielrichtung der Aufforderung im Deutschen idiomatisch zum Ausdruck.
- source_word: πληροῖς
  choice: ganz erfüllst
  rationale: πληρόω bezeichnet hier die vollständige Ausführung des Dienstes. „Ganz erfüllst“ macht diesen Vollzug deutlich, ohne den Dienst auf den bloßen Abschluss einer Einzelaufgabe zu verengen.
theological_decisions:
- issue: Bedeutungsnuance von ἐν κυρίῳ
  choice: im Herrn
  alternative: vom Herrn
  rationale: Im Griechischen steht ἐν, nicht eine eindeutige Herkunftspräposition wie ἀπό oder παρά. Der Haupttext bewahrt deshalb die relationale und theologische Offenheit; die mögliche Deutung als Herkunft wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. „Dienst“ vermeidet sowohl eine unnötige Veramtlichung als auch eine Abschwächung zur bloßen Aufgabe.
