  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: de
  text: Lukas, der geliebte Arzt, und Demas grüßen euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: grüßen
  rationale: Die briefliche Grußformel wird im Deutschen mit »grüßen« natürlich wiedergegeben. Obwohl das griechische Verb formal im Singular steht, verlangt das nachgestellte zusammengesetzte Subjekt »Lukas … und Demas« im Deutschen den Plural.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen bezeichnet die mehreren Empfänger in Kolossä; »euch« macht den Plural im Deutschen ausdrücklich.
- source_word: Λουκᾶς
  choice: Lukas
  rationale: Die im Deutschen etablierte Form des griechischen Personennamens.
- source_word: ἰατρὸς
  choice: Arzt
  rationale: »Arzt« ist die natürliche moderne deutsche Entsprechung für ἰατρός und bewahrt die Berufsbezeichnung ohne unnötig altertümlichen Ton.
- source_word: ἀγαπητὸς
  choice: geliebte
  rationale: »Geliebte« bewahrt die ausdrückliche Zuneigung und Wertschätzung des griechischen Adjektivs stärker als das schwächere »liebe«.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet Demas mit Lukas als weiteren Übermittler des Grußes.
- source_word: Δημᾶς
  choice: Demas
  rationale: Die im Deutschen etablierte Transkription des Personennamens.
theological_decisions:
- issue: Bezug von ὁ ἀγαπητός (»der geliebte«)
  choice: »der geliebte Arzt« beschreibt allein Lukas.
  alternative: Eine Formulierung, bei der »geliebt« möglicherweise auch auf Demas bezogen werden könnte.
  rationale: Die griechische Apposition ὁ ἰατρὸς ὁ ἀγαπητός steht unmittelbar bei Λουκᾶς und charakterisiert Lukas; die deutsche Wortstellung bildet diesen Bezug klar ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe briefliche Grußformel und die warme Charakterisierung des Lukas bleiben erhalten; der griechische Singular des vorangestellten Verbs wird entsprechend der deutschen Kongruenz mit dem zusammengesetzten Subjekt als Plural wiedergegeben.
