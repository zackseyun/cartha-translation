id: COL.4.12
reference: Colossians 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: de
  text: Epaphras, einer von euch und ein Sklave des Messias, grüßt euch. Er ringt stets in seinen Gebeten für euch, damit ihr reif und in allem, was Gott will, völlig überzeugt[a] dasteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „völlig gefestigt“. Das griechische Wort kann volle Gewissheit oder einen Zustand völliger Festigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: Es grüßt euch
  rationale: Gibt den üblichen brieflichen Sinn knapp und natürlich wieder.
- source_word: ὁ ἐξ ὑμῶν
  choice: einer von euch
  rationale: Bezeichnet idiomatisch die Zugehörigkeit des Epaphras zur kolossischen Gemeinschaft.
- source_word: δοῦλος
  choice: Sklave
  rationale: Bewahrt die starke Aussage völliger Zugehörigkeit und Verpflichtung, die δοῦλος hier vermittelt.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt Χριστός als Titel wieder, ohne den im griechischen Text nicht vorhandenen Namen Jesus hinzuzufügen.
- source_word: ἀγωνιζόμενος
  choice: ringt
  rationale: Bewahrt die Vorstellung intensiven, mühevollen Einsatzes und klingt im Zusammenhang des Gebets natürlich.
- source_word: ἐν ταῖς προσευχαῖς
  choice: in seinen Gebeten
  rationale: Verdeutlicht idiomatisch, dass Epaphras betet, und wahrt den Plural als Hinweis auf wiederholtes Gebet.
- source_word: ἵνα σταθῆτε
  choice: damit ihr … dasteht
  rationale: Erhält das Bild des Stehens, ohne das nicht ausdrücklich vorhandene Adverb ‚fest‘ einzufügen.
- source_word: τέλειοι
  choice: als reife Menschen
  rationale: τέλειοι bezeichnet hier am ehesten geistliche Reife beziehungsweise Ganzheit, nicht sündlose Vollkommenheit.
- source_word: πεπληροφορημένοι
  choice: völlig überzeugt
  rationale: Gibt den wahrscheinlich epistemischen Sinn des Partizips als Zustand voller Gewissheit in verständlichem Deutsch wieder; die mögliche stative Deutung wird in der Fußnote bewahrt.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: in allem, was Gott will
  rationale: Natürliches Deutsch, das den umfassenden Bezug auf Gottes Willen ausdrückt, ohne einzelne Aspekte näher festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Χριστός ist hier ein Titel. ‚Messias‘ macht dessen Bedeutung im Deutschen unmittelbar sichtbar; der Personenname Jesus steht im Ausgangstext dieses Verses nicht.
- issue: Wiedergabe von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Die stärkere Bezeichnung wahrt die im Wort liegende Vorstellung vollständiger Zugehörigkeit zum Messias, statt sie auf freiwilligen Dienst zu verengen.
- issue: Bedeutung von πεπληροφορημένοι
  choice: völlig überzeugt
  alternative: völlig gefestigt
  rationale: Der Haupttext folgt dem geläufigen Sinn voller Überzeugung beziehungsweise Gewissheit. Da auch ein Zustand vollständiger Festigung möglich ist, wird diese Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der zweite Satz löst das lange griechische Partizipialgefüge zugunsten guter Verständlichkeit auf, ohne seine Beziehungen zu verändern. Das Bild des Ringens und Stehens sowie die Spannung bei πεπληροφορημένοι bleiben erhalten.
