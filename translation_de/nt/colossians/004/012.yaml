  to: Epaphras, einer von euch und ein Sklave des Messias, grüßt euch. Er ringt stets in seinen Gebeten für euch, damit ihr reif und in allem, was Gott will, völlig überzeugt[a] dasteht.
  rationale: Die Revision glättet lediglich die deutsche Satzstellung und setzt den Fußnotenanker unmittelbar an die Übersetzung von πεπληροφορημένοι. Sinn, Register, Bildsprache und die im Ausgangstext vorhandene Ambiguität bleiben erhalten.
