review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Abfolge von Entwaffnung/Entmachtung, öffentlicher Bloßstellung und Triumph über die „Mächte und Gewalten“ im Wesentlichen. „In ihm“ bewahrt die grammatisch mögliche, im Kontext diskutierte Bezugnahme von ἐν αὐτῷ auf Christus oder auf das Kreuz aus Vers 14.
  naturalness: „Sie in ihm im Triumphzug mitführen“ ist im heutigen Standarddeutsch syntaktisch schwerfällig und klingt, als sei „in ihm“ eine Ortsangabe zum Mitführen. „In ihm über sie triumphieren“ gibt θριαμβεύσας αὐτούς idiomatisch und ohne Bedeutungsverlust wieder.
  terminology: „Mächte und Gewalten“ ist eine angemessene, etablierte und nicht überinterpretierende Wiedergabe von τὰς ἀρχὰς καὶ τὰς ἐξουσίας. „Entwaffnet“ ist im Text vertretbar; die Fußnote hält die alternative Bildlichkeit des Entkleidens bereit.
  issues:
  - severity: medium
    issue: Schwerfällige und potenziell missverständliche Stellung von „in ihm“ in der Schlusswendung
    rationale: Die Formulierung „führte sie in ihm im Triumphzug mit“ ist zwar als Triumphzugbild motiviert, aber im Deutschen unnatürlich. Die Präpositionalphrase kann dabei fälschlich als räumliche Bestimmung des Mitführens verstanden werden. Die explizite Triumphformulierung entspricht der üblichen Bedeutung von θριαμβεύω mit Akkusativ und platziert „in ihm“ klarer.
  revised_text: Nachdem er die Mächte und Gewalten entwaffnet hatte,[a] stellte er sie öffentlich zur Schau und triumphierte in ihm über sie.[b]
