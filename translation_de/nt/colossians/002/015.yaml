source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: de
  text: Nachdem er die Mächte und Gewalten entwaffnet hatte,[a] stellte er sie öffentlich zur Schau und triumphierte in ihm über sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihrer Macht entkleidet hatte.'
    reason: Bewahrt die konkrete Grundbedeutung von ἀπεκδύομαι und die daraus entstehende alternative Bildgebung.
  - marker: b
    text: 'Wörtlich: in ihm. Das griechische Pronomen kann auf Christus oder auf das Kreuz aus Vers 14 bezogen werden; „Kreuz“ ist im Griechischen männlich.'
    reason: Macht die im Ausgangstext vorhandene Bezugsmehrdeutigkeit sichtbar, die wegen des unterschiedlichen grammatischen Geschlechts im Deutschen sonst leicht verloren geht.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: Nachdem er … entwaffnet hatte
  rationale: Das Partizip bezeichnet hier die Entmachtung der feindlichen Mächte. „Entwaffnen“ ist idiomatisch und passt zum Bild des Triumphzugs, während die Grundbedeutung des Entkleidens in einer Fußnote erhalten bleibt.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: die Mächte und Gewalten
  rationale: Die etablierte deutsche Wiedergabe lässt den Bezug auf übermenschliche beziehungsweise geistliche Herrschaftsmächte erkennen, ohne ihn im Haupttext weiter auszudeuten.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: stellte er sie öffentlich zur Schau
  rationale: Gibt sowohl das demonstrative Bloßstellen als auch den öffentlichen, unverhüllten Charakter der Handlung natürlich wieder.
- source_word: θριαμβεύσας αὐτούς
  choice: führte sie … im Triumphzug mit
  rationale: Bewahrt das konkrete antike Bild eines Triumphzugs, in dem besiegte Gegner öffentlich mitgeführt werden, genauer als das allgemeinere „triumphierte über sie“.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die formal nahe Wiedergabe wahrt die Mehrdeutigkeit des griechischen Pronomens eher als eine Festlegung auf „durch Christus“ oder „am Kreuz“.
theological_decisions:
- issue: Bezug von ἐν αὐτῷ
  choice: in ihm
  alternative: an ihm / durch ihn / an diesem (dem Kreuz)
  rationale: Der griechische Ausdruck kann auf Christus bezogen werden; aufgrund des vorausgehenden σταυρός in Vers 14 ist auch ein Bezug auf das Kreuz möglich. Der Haupttext legt sich nicht stillschweigend fest, und die Fußnote nennt beide Deutungsmöglichkeiten.
- issue: Identität der Mächte und Gewalten
  choice: keine ausdrückliche Ergänzung wie „geistlichen“ oder „dämonischen“
  alternative: die geistlichen Mächte und Gewalten
  rationale: Der Kontext legt feindliche übermenschliche Mächte nahe, doch diese nähere Bestimmung steht nicht ausdrücklich im Vers und wird daher nicht in den Text eingefügt.
- issue: Unausgesprochenes Subjekt
  choice: er
  alternative: Gott / Christus
  rationale: Das griechische Verb enthält nur ein implizites Subjekt. Das deutsche Pronomen führt die Satzstruktur fort, ohne an dieser Stelle ausdrücklich zu entscheiden, ob Gott oder Christus als handelndes Subjekt zu benennen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform mit „Nachdem“ macht das Verhältnis des griechischen Partizips zum Hauptverb klar, ohne eine zusätzliche theologische Aussage einzuführen. Das Bild des öffentlichen römischen Triumphzugs bleibt anschaulich erhalten.
