lexical_decisions:
- source_word: Ὡς οὖν
  choice: Wie ihr nun … so
  rationale: Die deutsche Korrelativkonstruktion „wie … so“ gibt den Vergleich wieder; „nun“ markiert zugleich die Folgerung aus dem Vorhergehenden.
- source_word: παρελάβετε
  choice: angenommen habt
  rationale: Das Verb bezeichnet hier den früheren Empfang des Messias und der überlieferten Botschaft. „Angenommen“ ist im Deutschen natürlicher als „empfangen“, ohne den persönlichen oder lehrmäßigen Aspekt einseitig festzulegen.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: den Messias Jesus
  rationale: Χριστός wird als Titel verstanden und daher mit „Messias“ wiedergegeben; Ἰησοῦς bleibt der Name. Die ungewöhnliche, aber verständliche Verbindung bewahrt die titelartige Aussage des Griechischen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Die Apposition und der christologische Titel werden unmittelbar beibehalten.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die knappe paulinische Wendung bleibt erhalten, ohne sie erklärend auf „in Gemeinschaft mit ihm“ oder „mit ihm verbunden“ festzulegen.
- source_word: περιπατεῖτε
  choice: führt euer Leben
  rationale: Der präsentische Imperativ fordert zu einer fortdauernden Lebensführung auf. Die Formulierung bewahrt den Gedanken des Lebenswandels und klingt im heutigen Deutsch natürlicher als das wörtliche „wandelt“.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Titelfolge
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Der Artikel und die Verbindung mit „Jesus“ und „den Herrn“ lassen die titelartige Bedeutung von Χριστός hervortreten. „Messias“ übersetzt diesen Titel; die traditionelle Form steht in der Fußnote.
- issue: Paulinische Wendung ἐν αὐτῷ
  choice: in ihm
  alternative: in Verbundenheit mit ihm
  rationale: „In ihm“ bewahrt die räumlich und relational offene Bildsprache sowie ihre theologische Dichte, statt die Beziehung erklärend einzuengen.
- issue: Metaphorik von περιπατεῖτε
  choice: führt euer Leben
  alternative: geht euren Weg
  rationale: Die gewählte Form bezeichnet den gesamten Lebenswandel und vermeidet zugleich das im modernen Deutsch veraltete imperative „wandelt“. Die Wendung bleibt nah an der paulinischen Aufforderung, ohne eine konkrete Wegmetapher stärker auszuformen als nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur „wie … so“ wahrt die argumentative Form des griechischen Satzes; „führt euer Leben“ ist gegenwärtig verständlich und vermeidet das altertümliche „wandelt“.
