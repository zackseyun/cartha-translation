base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: de
  text: Wie ihr nun den Messias Jesus[a], den Herrn, angenommen habt, so lebt in ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
