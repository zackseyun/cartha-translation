source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: de
  text: in ihm verwurzelt und weiter aufgebaut, im Glauben[a] gefestigt, so wie ihr unterwiesen worden seid, und überströmend vor Dankbarkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Vertrauen“; möglicherweise auch: „in der Treue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bedeuten. Hier ist wahrscheinlich der Glaube gemeint, in dem sie unterwiesen wurden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: verwurzelt
  rationale: Das Perfektpartizip bezeichnet ein erfolgtes Verwurzeln mit fortdauerndem Ergebnis. Die landwirtschaftliche Metapher bleibt erhalten; im Deutschen bringt „verwurzelt“ den resultativen Zustand natürlich zum Ausdruck.
- source_word: ἐποικοδομούμενοι
  choice: aufgebaut
  rationale: Das Präsenspartizip bezeichnet einen fortlaufenden Vorgang. „Aufgebaut“ bewahrt die unmittelbar neben das Bild des Verwurzelns gestellte Baumetapher und ist im Zusammenhang mit „in ihm“ idiomatisch.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Das Pronomen verweist im unmittelbaren Kontext auf Christus. Da der griechische Text hier das Pronomen und nicht erneut den Titel nennt, wird „in ihm“ beibehalten.
- source_word: βεβαιούμενοι
  choice: gefestigt
  rationale: Das Wort bezeichnet das Fest- oder Sicherwerden. „Gefestigt“ ist im modernen Deutschen natürlich und lässt offen, ob dabei Bestätigung, Stärkung oder feste Gründung im Vordergrund steht.
- source_word: τῇ πίστει
  choice: im Glauben
  rationale: Der Ausdruck kann den gelehrten Glaubensinhalt oder den persönlichen Glauben beziehungsweise das Vertrauen bezeichnen. Der folgende Hinweis auf die empfangene Unterweisung spricht eher für den gelehrten Glauben, ohne die Mehrdeutigkeit völlig aufzuheben.
- source_word: καθὼς ἐδιδάχθητε
  choice: so wie ihr unterwiesen worden seid
  rationale: „So wie“ gibt die vergleichende Kraft von καθώς wieder. „Unterwiesen“ bezeichnet hier natürlich die bereits empfangene Lehre.
- source_word: περισσεύοντες
  choice: überströmend
  rationale: Das Präsenspartizip drückt fortdauernde Fülle aus. „Überströmend“ erhält das anschauliche Bild, statt es zu „sehr dankbar“ abzuschwächen.
- source_word: ἐν εὐχαριστίᾳ
  choice: von Dankbarkeit
  rationale: In Verbindung mit „überströmend“ ist „von Dankbarkeit“ idiomatisches Deutsch. „Dankbarkeit“ gibt εὐχαριστία in diesem Zusammenhang natürlicher wieder als das stärker handlungsbezogene „Danksagung“.
theological_decisions:
- issue: Bedeutung von τῇ πίστει
  choice: „im Glauben“, wahrscheinlich mit Bezug auf den gelehrten christlichen Glauben
  alternative: „im Vertrauen“ oder „in der Treue“
  rationale: Der bestimmte Artikel und besonders „so wie ihr unterwiesen worden seid“ legen den Inhalt beziehungsweise den Bereich der empfangenen Lehre nahe. Da πίστις jedoch auch persönliches Vertrauen und in manchen Zusammenhängen Treue bezeichnen kann, wird diese Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Folge der Partizipien sowie die bewusst gemischten Bilder von Verwurzelung, Aufbau und Überströmen bleiben erhalten. Der Satzanfang ist kleingeschrieben, weil Vers 7 syntaktisch an die Aufforderung des vorherigen Verses anschließt.
