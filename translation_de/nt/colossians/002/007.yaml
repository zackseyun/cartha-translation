  naturalness: Der Satz ist als bewusst an den vorigen Vers angeschlossene Partizipialfolge natürlich genug. „Überströmend vor Dankbarkeit“ ist im heutigen Standarddeutsch etwas idiomatischer als „von Dankbarkeit überströmend“ und bewahrt das Bild der Überfülle.
  terminology: „Verwurzelt“, „weiter aufgebaut“, „gefestigt“, „Glauben“ und „Dankbarkeit“ sind registergerecht und bilden die Metaphern und Schlüsselbegriffe des griechischen Textes angemessen ab. Die Fußnote erhält die lexikalischen Alternativen zu πίστις, ohne die im Kontext wahrscheinlichere Lesart dogmatisch festzulegen.
