id: COL.2.12
reference: Colossians 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: de
  text: Mit ihm wurdet ihr in der Taufe begraben[a]; in ihr wurdet ihr auch mit ihm auferweckt durch den Glauben an das Wirken Gottes[b], der ihn von den Toten auferweckt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „in ihm“, wenn sich das Relativpronomen auf Christus statt auf die Taufe bezieht.'
    reason: alternative_reading
  - marker: b
    text: „Glaube“ kann hier auch im Sinn von „Vertrauen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: Mit ihm wurdet ihr … begraben
  rationale: Die finite deutsche Form gibt das aoristische Passivpartizip im Zusammenhang natürlich wieder; „mit ihm“ bewahrt die Bedeutung des συν-Präfixes und des Dativpronomens.
- source_word: ἐν τῷ βαπτισμῷ
  choice: in der Taufe
  rationale: „In der Taufe“ ist idiomatisches Standarddeutsch und lässt die lokative beziehungsweise instrumentale Bedeutungsweite von ἐν bestehen.
- source_word: ἐν ᾧ
  choice: in ihr
  rationale: Das Relativpronomen bezieht sich syntaktisch am naheliegendsten auf βαπτισμῷ; im Deutschen wird wegen des femininen „Taufe“ folgerichtig „in ihr“ verwendet.
- source_word: συνηγέρθητε
  choice: wurdet ihr auch mit ihm auferweckt
  rationale: Das Passiv und die Mitbeteiligung des συν-Präfixes werden ausdrücklich wiedergegeben; „auferweckt“ entspricht dem neutestamentlichen Auferstehungsvokabular.
- source_word: διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ
  choice: durch den Glauben an das Wirken Gottes
  rationale: 'Der Genitiv nach πίστις wird als objektiver Bezug verstanden: Glaube beziehungsweise Vertrauen richtet sich auf Gottes wirksames Handeln. „Wirken“ bewahrt den Tätigkeitsaspekt von ἐνέργεια besser als das abstraktere „Kraft“.'
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: der ihn von den Toten auferweckt hat
  rationale: Der artikulierte Aoristpartizipialsatz wird natürlich als Relativsatz wiedergegeben; „von den Toten“ ist die übliche deutsche Wendung für ἐκ νεκρῶν.
theological_decisions:
- issue: Bezugswort von ἐν ᾧ
  choice: 'Bezug auf die Taufe: „in ihr“'
  alternative: 'Bezug auf Christus: „in ihm“'
  rationale: Das unmittelbar vorausgehende βαπτισμῷ ist das syntaktisch naheliegendste Bezugswort. Da die griechische Form einen Bezug auf Christus jedoch grammatisch nicht ausschließt, wird diese Möglichkeit in einer Fußnote erhalten.
- issue: Verhältnis von Taufe, Glaube und Mitauferweckung
  choice: Die enge Verbindung bleibt ohne konfessionelle Erklärung stehen
  alternative: Eine ausdrücklich sakramentale oder ausschließlich symbolische Deutung
  rationale: Der griechische Text verbindet Begräbnis und Auferweckung mit Christus eng mit Taufe und Glauben, legt aber keine spätere konfessionelle Wirkungslehre ausdrücklich fest.
- issue: Genitivverbindung τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ
  choice: „Glauben an das Wirken Gottes“
  alternative: „Glauben, den Gott wirkt“ beziehungsweise „Glauben an die wirksame Kraft Gottes“
  rationale: 'Die objektive Deutung ergibt im Kontext einen klaren Sinn: Die Mitauferweckung geschieht durch den auf Gottes Auferweckungshandeln gerichteten Glauben. Andere Genitivnuancen werden nicht dogmatisch ausgeschlossen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch die finite Wiedergabe des einleitenden Partizips flüssig und allgemein verständlich. Die Taufsprache wird weder abgeschwächt noch konfessionell ausgedeutet.
