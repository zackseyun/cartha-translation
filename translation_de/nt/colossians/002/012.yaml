  source_fidelity: 'Der Text gibt die Abfolge und Syntax des Griechischen sachgerecht wieder: Mitbegrabenwerden mit Christus in der Taufe, Mitauferwecktwerden in ihr, und dies durch den Glauben im Blick auf Gottes wirksames Handeln, der Christus von den Toten auferweckt hat. Das mitbedeutete Zusammen-Sein der Komposita συνταφέντες und συνηγέρθητε ist jeweils mit „mit ihm“ klar erfasst.'
  naturalness: „Mit ihm wurdet ihr in der Taufe begraben; in ihr wurdet ihr auch mit ihm auferweckt“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die finite Wiedergabe des einleitenden Partizips ist idiomatisch und wahrt den engen Zusammenhang.
  terminology: „Taufe“, „Glauben“, „Wirken Gottes“ und „von den Toten auferweckt“ sind etablierte, theologisch angemessene und nicht konfessionell einengende Wiedergaben. „Glauben an das Wirken Gottes“ ist eine vertretbare, kontextuell naheliegende Auslegung der Genitivverbindung und entspricht dem englischen Audit trail.
