id: COL.2.23
reference: Colossians 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: de
  text: Diese Vorschriften haben zwar den Anschein von Weisheit[a] – in selbst gewählter Frömmigkeit[b], Demut und schonungsloser Behandlung des Körpers –, doch gegen die Befriedigung des Fleisches[d] sind sie ohne jeden Wert.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gelten zwar als weise« beziehungsweise »haben den Ruf der Weisheit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eigenmächtiger Gottesverehrung«; auch: »selbst auferlegter Religionsausübung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Schlusssatz ist schwer zu deuten. Möglich ist auch: »doch sie erweisen dem Körper keine Ehre und dienen der Befriedigung des Fleisches« oder: »doch sie stehen in keinem Ansehen hinsichtlich der Befriedigung des Fleisches«.'
    reason: alternative_reading
  - marker: d
    text: »Fleisch« kann hier die fehlgeleiteten menschlichen Begierden bezeichnen; der Ausdruck ist nicht einfach mit dem Körper gleichzusetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Diese Vorschriften
  rationale: Das Relativpronomen verweist auf die in V. 21–22 genannten Vorschriften. Die ausdrückliche Wiederaufnahme macht den Bezug im Deutschen klar.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: haben zwar den Anschein von Weisheit
  rationale: Die idiomatische Wendung bezeichnet einen Anschein, Ruf oder Anspruch auf Weisheit; »zwar« gibt die mit μέν eröffnete Einräumung wieder.
- source_word: ἐθελοθρησκίᾳ
  choice: selbst gewählter Frömmigkeit
  rationale: Das seltene Wort bezeichnet eine religiöse Praxis aus eigenem Willen. Diese Formulierung ist verständlich und lässt offen, ob vor allem eigenmächtiger Gottesdienst oder selbst auferlegte Religionsausübung gemeint ist.
- source_word: ταπεινοφροσύνῃ
  choice: Demut
  rationale: Dies ist die reguläre Bedeutung; der Kontext lässt erkennen, dass die hier gemeinte Demut kritisch beziehungsweise ironisch beurteilt wird.
- source_word: ἀφειδίᾳ σώματος
  choice: schonungsloser Behandlung des Körpers
  rationale: ἀφειδία bezeichnet ein Nichtschonen beziehungsweise asketische Härte. Die Wiedergabe ist natürlich und präzise.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: sind sie ohne jeden Wert
  rationale: τιμή wird im schwierigen Schlussglied als Wert oder Nutzen verstanden. Die Ergänzung des Subjekts ist im Deutschen zur Klarheit erforderlich.
- source_word: πρὸς πλησμονὴν
  choice: gegen die Befriedigung
  rationale: πρός wird relational im Sinn von »gegenüber/gegen« und πλησμονή als Sättigung beziehungsweise Befriedigung verstanden.
- source_word: τῆς σαρκός
  choice: des Fleisches
  rationale: Die formale Wiedergabe bewahrt die paulinische Mehrdeutigkeit zwischen leiblicher Sphäre und fehlgeleiteten menschlichen Begierden.
theological_decisions:
- issue: Bedeutung des schwierigen Schlussglieds οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Die asketischen Vorschriften sind gegen die Befriedigung des Fleisches ohne Wert.
  alternative: 'Sie erweisen dem Körper keine Ehre und dienen der Befriedigung des Fleisches; oder: Sie stehen in keinem Ansehen hinsichtlich der Befriedigung des Fleisches.'
  rationale: Die gewählte Lesart passt zum argumentativen Gegensatz zwischen dem Anschein von Weisheit und der tatsächlichen Wirkungslosigkeit. Da Syntax und Sinn des griechischen Schlussglieds stark umstritten sind, werden andere mögliche Deutungen in einer Fußnote bewahrt.
- issue: Bedeutung von σάρξ
  choice: Fleisch
  alternative: fehlgeleitete menschliche Begierden
  rationale: »Fleisch« erhält die theologische Spannung und vermeidet eine vorschnelle Gleichsetzung mit dem Körper oder einer systematisch definierten »sündigen Natur«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die drei Erscheinungsformen der vermeintlichen Weisheit, ohne die syntaktische Spannung des griechischen Satzes aufzulösen. Alle Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
