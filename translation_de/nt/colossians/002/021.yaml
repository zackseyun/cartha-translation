  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Berühre nicht, koste nicht, fasse nicht an.“ Das erste Verb (ἅψῃ) kann ebenfalls „berühren“ oder „ergreifen“ bedeuten; hier steht „anfassen“, um es vom späteren θίγῃς („berühren“) zu unterscheiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: nicht
  rationale: Μή leitet zusammen mit dem Aorist Konjunktiv ein Verbot ein; im Deutschen wird die dreigliedrige Verbotsreihe natürlich mit nachgestelltem „nicht“ wiedergegeben.
- source_word: ἅψῃ
  choice: fass … an
  rationale: Ἅπτω im Medium kann „berühren“ oder „anfassen/ergreifen“ bedeuten. „Anfassen“ unterscheidet dieses erste Verb von θίγῃς und bewahrt die rhetorische Folge.
- source_word: μηδὲ
  choice: asyndetische Reihung mit wiederholtem „nicht“
  rationale: Das wiederholte μηδέ verbindet die Verbote kumulativ. Im modernen Deutschen klingt die parallele Folge „… nicht, … nicht, … nicht“ natürlicher und ebenso eindringlich als ein wiederholtes „noch“.
- source_word: γεύσῃ
  choice: koste
  rationale: Γεύομαι bedeutet wörtlich „kosten/probieren“. „Koste“ erhält den direkten Sinn und passt zur knappen Verbotsform.
- source_word: θίγῃς
  choice: berühre
  rationale: Θιγγάνω bedeutet gewöhnlich „berühren“. Diese Wiedergabe hält den Unterschied zum vorangehenden ἅψῃ („anfassen“) erkennbar.
theological_decisions:
- issue: Art der Verbote im Kontext
  choice: Die knappe, zitathaft wirkende Reihe asketischer Vorschriften wird ohne erklärende Zusätze wiedergegeben.
  alternative: „Fass dies nicht an, koste jenes nicht, berühre nichts“ oder eine ausdrückliche Einordnung als menschliche Vorschriften.
  rationale: Der griechische Vers enthält ausschließlich die drei abrupten Verbote. Eine nähere Bestimmung ihrer Gegenstände oder Urheber würde Kontextdeutung in den Vers eintragen.
translation_notes:
  register: Knapp, eindringlich und zitathaft. Der Imperativ wahrt die abrupte Dreierfolge des griechischen Textes; „anfassen“ und „berühren“ unterscheiden die beiden nah verwandten Verben in natürlichem modernem Standarddeutsch.
