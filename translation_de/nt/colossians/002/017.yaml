  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: de
  text: Diese Dinge sind ein Schatten der kommenden Dinge; der Körper aber ist der des Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Wirklichkeit aber ist die des Messias.« Wörtlich: »der Körper aber [ist] der des Messias.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Diese Dinge
  rationale: Das sächliche Relativpronomen im Plural verweist auf die Speise-, Fest-, Neumond- und Sabbatfragen des vorhergehenden Verses; die demonstrative Wiedergabe stellt diesen Rückbezug im Deutschen natürlich her.
- source_word: σκιὰ
  choice: ein Schatten
  rationale: Die wörtliche Wiedergabe bewahrt das Bild und den Gegensatz zu σῶμα.
- source_word: τῶν μελλόντων
  choice: dessen, was kommen soll
  rationale: Das substantivierte Partizip bezeichnet Kommendes. Die Formulierung bewahrt die Zukunftsorientierung, ohne deren zeitliche oder heilsgeschichtliche Einordnung festzulegen.
- source_word: δὲ
  choice: aber
  rationale: Die Konjunktion kennzeichnet hier den Gegensatz zwischen Schatten und Körper.
- source_word: σῶμα
  choice: der Körper
  rationale: Die Grundbedeutung wird beibehalten, sodass das auffällige Bild vom Schatten und dem zugehörigen Körper nicht vorschnell als »Wirklichkeit« oder »Substanz« ausgelegt wird.
- source_word: τοῦ Χριστοῦ
  choice: gehört dem Messias
  rationale: Der Genitiv bezeichnet am natürlichsten die Zugehörigkeit. »Messias« gibt Χριστός hier als Titel wieder.
theological_decisions:
- issue: Bedeutung von σῶμα im Gegensatz zu σκιά
  choice: »Körper« als formale, deutungsoffene Wiedergabe
  alternative: »Wirklichkeit« oder »Substanz« als ausdrückliche Deutung des Schattenbildes
  rationale: Der griechische Text verwendet das gewöhnliche Wort für »Körper«. Die direkte Wiedergabe erhält die Metapher und lässt offen, ob besonders die greifbare Wirklichkeit, Erfüllung oder Zugehörigkeit zur messianischen Gemeinschaft anklingt.
- issue: Bezug des Genitivs τοῦ Χριστοῦ
  choice: »gehört dem Messias«
  alternative: »ist des Messias« oder elliptisch »der Körper aber des Messias«
  rationale: Die Zugehörigkeitskonstruktion macht die im Griechischen elliptische Aussage in gegenwärtigem Deutsch verständlich, ohne »Messias« selbst mit dem Körper gleichzusetzen.
- issue: Wiedergabe von Χριστός
  choice: »Messias«
  alternative: »Christus«
  rationale: Hier lässt sich Χριστός sinnvoll als Titel verstehen; »Messias« macht dessen Bedeutung transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon verdeutlicht den knappen Gegensatz. Die ungewöhnliche Körper-Schatten-Metapher bleibt im Haupttext erhalten und wird nur in der Fußnote erläutert.
