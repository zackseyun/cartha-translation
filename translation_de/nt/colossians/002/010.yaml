id: COL.2.10
reference: Colossians 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: de
  text: und ihr seid in ihm zur Fülle gebracht[a]. Er ist das Haupt jeder Herrschaft und Macht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „erfüllt“ oder „zur Vollendung gebracht“.'
    reason: lexical_alternative
  - marker: b
    text: „Haupt“ gibt die griechische Metapher wieder; hier bezeichnet sie Christi Vorrang über jede Herrschaft und Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Der Anschluss an den vorherigen Gedankengang bleibt ausdrücklich erhalten.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: ihr seid … zur Fülle gebracht
  rationale: Die Formulierung gibt den gegenwärtigen, aus einer vollzogenen Handlung hervorgegangenen Zustand wieder, bewahrt das Passiv und nimmt das Motiv der Fülle aus dem unmittelbaren Kontext auf.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die knappe paulinische Wendung für die Verbindung mit Christus bleibt erhalten, ohne sie erklärend auszuweiten.
- source_word: ὅς ἐστιν
  choice: Er ist
  rationale: Ein neuer deutscher Hauptsatz ist natürlicher und macht den Rückbezug auf Christus eindeutig, ohne den Sinn zu verändern.
- source_word: ἡ κεφαλή
  choice: das Haupt
  rationale: Bewahrt die griechische Metapher in würdigem, verständlichem Deutsch; eine Wiedergabe mit „Herrscher“ würde die Metapher bereits auslegen.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: jeder Herrschaft und Macht
  rationale: Die umfassende Aussage wird bewahrt. Die abstrakt-personale Mehrdeutigkeit der Begriffe bleibt eher erhalten als bei einer eindeutigen Festlegung auf menschliche oder geistliche „Herrscher“.
theological_decisions:
- issue: Die Fülle der Glaubenden in Christus
  choice: „in ihm zur Fülle gebracht“
  alternative: „in ihm erfüllt“ oder „in ihm zur Vollendung gebracht“
  rationale: Die Übersetzung hält die Teilhabe an der in Christus gegebenen Fülle fest, ohne daraus eine technische Lehre über Sündlosigkeit, Heilsvollständigkeit oder Vergöttlichung abzuleiten.
- issue: Die Bedeutung von κεφαλή gegenüber den Mächten
  choice: Die Metapher „Haupt“ bleibt im Text; der Kontext weist auf Christi Vorrang über alle Herrschaft und Macht.
  alternative: „Herrscher über“ oder „Ursprung von“
  rationale: „Haupt“ bewahrt die Bildsprache und ihre theologische Spannung. Die Fußnote erläutert den hier naheliegenden Vorrang, ohne die Metapher im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zur Fülle gebracht“ ist bewusst etwas gehobener, um das Füllemotiv und das Passiv des griechischen Ausdrucks zu bewahren. Die Aufteilung in zwei Sätze vermeidet einen schwerfälligen Relativsatz.
