  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: de
  text: Darum soll niemand über euch urteilen wegen Speise oder Trank[a] oder im Hinblick auf ein Fest, einen Neumond oder Sabbate[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: im Blick auf Vorschriften über Essen und Trinken.'
    reason: cultural_note
  - marker: b
    text: 'Oder: euch richten.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Abfolge „Fest, Neumond oder Sabbate“ erinnert an den jüdischen Festkalender: jährliche, monatliche und wöchentliche heilige Zeiten.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Darum soll ... niemand
  rationale: οὖν stellt den Folgerungszusammenhang her; μή mit dem Imperativ der dritten Person und τις wird im Deutschen natürlich als „soll niemand“ wiedergegeben.
- source_word: ὑμᾶς κρινέτω
  choice: soll euch niemand ... verurteilen
  rationale: κρίνω bezeichnet hier ein wertendes beziehungsweise verurteilendes Urteil über die Adressaten. „Verurteilen“ macht den negativen Sinn der untersagten Beurteilung deutlich; die allgemeinere Wiedergabe „richten“ bleibt in der Fußnote erhalten.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: wegen Speise oder Trank
  rationale: βρῶσις und πόσις können den Vollzug des Essens und Trinkens oder Speise und Trank bezeichnen. Im Zusammenhang der aufgezählten religiösen Praktiken ist die sachliche Kategorie wahrscheinlich; „wegen“ gibt die Beziehung idiomatisch wieder.
- source_word: ἐν μέρει ἑορτῆς
  choice: im Hinblick auf ein Fest
  rationale: ἐν μέρει bedeutet in diesem idiomatischen Gebrauch „hinsichtlich“ oder „in Bezug auf“, nicht „in einem Teil“. ἑορτή bezeichnet einen religiösen Festtag.
- source_word: νουμηνίας
  choice: einen Neumond
  rationale: Gemeint ist die monatliche Neumondfeier. „Neumond“ bewahrt die knappe Bezeichnung des griechischen Textes.
- source_word: σαββάτων
  choice: Sabbate
  rationale: Die Wiedergabe wahrt den griechischen Plural und die traditionelle kalendarische Folge von jährlichen Festen, monatlichem Neumond und wöchentlichen Sabbaten.
theological_decisions:
- issue: Bedeutung der genannten Speise- und Kalenderpraktiken
  choice: Der Vers untersagt, die Glaubenden im Blick auf diese Praktiken zu verurteilen, ohne hier abschließend über ihre grundsätzliche Gültigkeit oder Ungültigkeit zu entscheiden.
  alternative: Der Vers schafft sämtliche genannten Bräuche ausnahmslos ab; oder er betrifft ausschließlich menschliche beziehungsweise asketische Vorschriften.
  rationale: Der griechische Wortlaut richtet sich unmittelbar gegen das Urteilen in diesen Fragen. Weitergehende dogmatische Folgerungen werden in diesem einzelnen Vers nicht ausdrücklich entfaltet und daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Speise oder Trank“ und „Sabbate“ bewahren den biblisch-religiösen Ton, bleiben aber allgemein verständlich. Die deutsche Satzstellung ordnet die Fußnoten den jeweils erläuterten Ausdrücken zu.
