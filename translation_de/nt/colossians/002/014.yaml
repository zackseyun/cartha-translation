  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: de
  text: Er hat den gegen uns gerichteten Schuldschein in Satzungen[a] ausgelöscht, der uns entgegenstand, und ihn aus dem Weg geräumt, indem er ihn ans Kreuz nagelte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die gegen uns gerichtete handschriftliche Schuldurkunde in Satzungen«. Das griechische Wort kann eine eigenhändig geschriebene Schuld- oder Verpflichtungserklärung bezeichnen. Die Verbindung mit »Satzungen« kann auch bedeuten: »mit den Satzungen« oder »aus Satzungen bestehend«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »und er hat ihn aus der Mitte entfernt, indem/nachdem er ihn ans Kreuz genagelt hat«. Das Partizip kann das Mittel der Beseitigung oder eine begleitende beziehungsweise vorausgehende Handlung bezeichnen.'
    reason: aspect_and_participle
lexical_decisions:
- source_word: ἐξαλείψας
  choice: ausgelöscht
  rationale: Gibt das Tilgen bzw. Auswischen einer Schrift wieder und passt zugleich natürlich zum Bild eines Schuldscheins.
- source_word: τὸ καθ’ ἡμῶν χειρόγραφον
  choice: den gegen uns gerichteten Schuldschein
  rationale: χειρόγραφον bezeichnet hier wahrscheinlich eine eigenhändige Schuldurkunde oder schriftliche Verpflichtung; die Formulierung bewahrt sowohl den Dokument- als auch den Verpflichtungscharakter.
- source_word: τοῖς δόγμασιν
  choice: mit seinen Satzungen
  rationale: 'Der schwierige Dativ wird als nähere Bestimmung des Schuldscheins verstanden: Seine verbindlichen Bestimmungen machten die gegen uns stehende Verpflichtung aus. Die Wiedergabe legt die Satzungen nicht ausdrücklich auf das mosaische Gesetz fest.'
- source_word: ὃ ἦν ὑπεναντίον ἡμῖν
  choice: der uns entgegenstand
  rationale: Bewahrt die adversative Aussage ohne die stärkere Deutung, das Dokument sei persönlich feindselig.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: aus dem Weg geräumt
  rationale: Gibt die griechische Wendung idiomatisch wieder und lässt den bleibenden Erfolg der perfektischen Verbform erkennen.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: indem er ihn ans Kreuz nagelte
  rationale: Das Partizip wird als Mittel der Beseitigung verstanden; das Pronomen bezieht sich auf den Schuldschein.
theological_decisions:
- issue: Bedeutung von χειρόγραφον τοῖς δόγμασιν
  choice: ein gegen uns stehender Schuldschein mit seinen verbindlichen Satzungen
  alternative: das mosaische Gesetz selbst; ein Sündenregister; eine juristische Anklageschrift
  rationale: Die Übersetzung erhält das Bild einer schriftlichen Schuldverpflichtung, ohne es mit einer bestimmten Gesetzes-, Sünden- oder Bundestheologie gleichzusetzen. Eine Fußnote weist auf die lexikalische und syntaktische Offenheit hin.
- issue: Subjekt der Verben
  choice: Er, im weiteren Zusammenhang Gott
  alternative: eine im Deutschen unpersönlich oder passiv formulierte Beseitigung
  rationale: Der Satzkontext nennt Gott als Handelnden. Das deutsche Pronomen stellt den grammatischen Zusammenhang her, ohne den Gottesnamen erneut einzufügen.
- issue: Bezug von αὐτό
  choice: der Schuldschein wird ans Kreuz genagelt
  alternative: die Schuld oder die Satzungen werden ans Kreuz genagelt
  rationale: Das grammatische Neutrum Singular verweist am unmittelbarsten auf χειρόγραφον, den Schuldschein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Schuldschein« hält das anschauliche Rechts- und Schuldbild fest; »aus dem Weg geräumt« gibt die griechische Redewendung natürlich wieder. Die schwierige Verbindung τοῖς δόγμασιν wird im Haupttext lesbar wiedergegeben und in der Fußnote offengehalten.
