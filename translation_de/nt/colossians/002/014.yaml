revisions:
- from: Er hat den gegen uns gerichteten Schuldschein mit seinen Satzungen[a] ausgelöscht, der uns entgegenstand, und ihn aus dem Weg geräumt, indem er ihn ans Kreuz nagelte.[b]
  to: Er hat den gegen uns gerichteten Schuldschein in Satzungen[a] ausgelöscht, der uns entgegenstand, und ihn aus dem Weg geräumt, indem er ihn ans Kreuz nagelte.[b]
  rationale: Die Revision entfernt ausschließlich die nicht ausdrücklich im Griechischen angelegte possessive Nuance in „seinen Satzungen“ und präzisiert die Fußnote zum Partizip. Der übrige Wortlaut bleibt erhalten, da er die Bildsprache, den Satzfluss und die theologische Zurückhaltung der Vorlage zuverlässig wahrt.
