review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft die Metapher des χειρόγραφον als Schuldschein, die gegnerische Ausrichtung, die Entfernung „aus der Mitte/aus dem Weg“ und das Annageln an das Kreuz grundsätzlich gut. „Mit seinen Satzungen“ fügt jedoch ein im Griechischen nicht ausgedrücktes Besitzverhältnis hinzu. Der schwierige Dativ τοῖς δόγμασιν sollte im Haupttext nicht stärker festgelegt werden als die Vorlage.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und wahrt einen angemessen würdigen Registerton. „Schuldschein“, „ausgelöscht“ und „aus dem Weg geräumt“ sind idiomatisch. Die Formulierung „in Satzungen“ ist im Deutschen zwar dichter und etwas ungewohnt, bildet aber gerade die syntaktisch umstrittene Verbindung quellennäher ab; die Fußnote erläutert sie.
  terminology: „Schuldschein“ bewahrt den Dokument- und Verpflichtungscharakter von χειρόγραφον, ohne es auf das mosaische Gesetz, ein Sündenregister oder eine bestimmte dogmatische Deutung festzulegen. „Satzungen“ ist für δόγματα vertretbar. „Kreuz“ ist im Kontext die etablierte und sachgerechte Wiedergabe von σταυρός.
  issues:
  - severity: medium
    issue: „mit seinen Satzungen“
    rationale: Das Possessivpronomen „seinen“ ist im griechischen Text nicht vorhanden und legt eine Besitz- bzw. Zuordnungsbeziehung nahe. Der Dativ τοῖς δόγμασιν ist umstritten und kann unter anderem „in Satzungen“ bzw. „aus Satzungen bestehend“ bedeuten. Eine weniger festlegende Haupttextwiedergabe mit erklärender Fußnote ist vorzuziehen.
  - severity: low
    issue: Fußnote b als „Wörtlich“
    rationale: Die bisherige Formulierung „nachdem er ihn ... genagelt hatte“ ist keine strikte wörtliche Wiedergabe des aoristischen Partizips, dessen Verhältnis zur Haupthandlung offenbleibt. „Wörtlich etwa“ mit Hinweis auf die mögliche modale bzw. temporale Auffassung erhält die griechische Offenheit besser.
