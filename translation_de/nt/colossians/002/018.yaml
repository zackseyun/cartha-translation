  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: de
  text: Niemand soll euch um den Siegespreis bringen, der Gefallen findet an Demut und an der Verehrung der Engel[a], sich auf das einlässt, was er gesehen hat[b][c], und von seinem fleischlichen Denken grundlos aufgebläht wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann auch „Religion der Engel“ oder „Verehrung zusammen mit Engeln“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sich mit dem befasst, was er gesehen hat“ beziehungsweise „das betritt, was er gesehen hat“. Das griechische Verb ist selten und schwer zu deuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Einige Handschriften haben „was er nicht gesehen hat“; dann wäre sinngemäß zu übersetzen: „sich auf das einlässt, was er nicht gesehen hat“.'
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: um den Siegespreis bringen
  rationale: Das seltene Verb bezeichnet wohl ein gegen jemanden gerichtetes Schiedsrichterurteil und damit den Verlust des Preises. Die Formulierung bewahrt das Wettkampf- beziehungsweise Preisbild deutlicher als „disqualifizieren“.
- source_word: θέλων ἐν
  choice: Gefallen hat an
  rationale: Die Wendung drückt hier wahrscheinlich eine selbstgewählte Vorliebe für die genannten religiösen Praktiken aus; „Gefallen haben an“ ist natürlich und lässt die genaue Nuance offen.
- source_word: ταπεινοφροσύνῃ
  choice: Demut
  rationale: Dies ist die reguläre Entsprechung. Der polemische Zusammenhang kann eine zur Schau gestellte oder asketische Demut andeuten, ohne dass diese Deutung in den Haupttext eingetragen wird.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: Verehrung der Engel
  rationale: Der Genitiv wird im Haupttext als objektiv verstanden, also als an Engel gerichtete religiöse Verehrung. Da auch andere syntaktische Deutungen möglich sind, werden sie in einer Fußnote genannt.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: sich auf das einlässt, was er gesehen hat
  rationale: Das seltene ἐμβατεύω kann ein Betreten, Sich-Einlassen oder ausführliches Befassen bezeichnen. Die gewählte Wendung bleibt bewusst etwas offen und vermeidet eine unbelegte Festlegung auf visionäres Prahlen.
- source_word: εἰκῇ
  choice: ohne Grund
  rationale: Das Adverb bezeichnet hier ein grundloses beziehungsweise unberechtigtes Aufgeblähtsein; „ohne Grund“ ist im Deutschen klar und nah am möglichen Sinn.
- source_word: φυσιούμενος
  choice: sich aufbläht
  rationale: Die Übersetzung bewahrt Paulus’ anschauliche Metapher für Überheblichkeit.
- source_word: ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ
  choice: durch sein fleischliches Denken
  rationale: Die Formulierung gibt die anthropologische Spannung von σάρξ wieder, bleibt aber im Deutschen verständlicher als das wörtliche „durch den Sinn seines Fleisches“.
theological_decisions:
- issue: Bedeutung von θρησκείᾳ τῶν ἀγγέλων
  choice: Verehrung, die den Engeln gilt
  alternative: Religion der Engel beziehungsweise Verehrung zusammen mit Engeln
  rationale: Der objektive Genitiv ist verbreitet und im Warnkontext plausibel, doch die griechische Genitivverbindung legt die Richtung der Verehrung nicht zweifelsfrei fest. Die Alternativen bleiben deshalb sichtbar.
- issue: Bedeutung von σάρξ in νοὸς τῆς σαρκὸς αὐτοῦ
  choice: fleischliches Denken
  alternative: Denken seines Fleisches
  rationale: „Fleischlich“ hält den Bezug zu σάρξ ausdrücklich fest, ohne ihn mit einer systematischen Deutung wie „sündige Natur“ gleichzusetzen.
- issue: Textvariante bei ἃ ἑόρακεν
  choice: was er gesehen hat
  alternative: was er nicht gesehen hat
  rationale: Der SBLGNT-Haupttext wird übersetzt. Die Variante mit Verneinung verändert den Sinn erheblich und wird daher transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Preisbild des seltenen Verbs καταβραβεύω bleibt erhalten. Die umstrittene Engel-Formulierung, das schwierige ἐμβατεύω und die bedeutende Textvariante werden nicht stillschweigend vereindeutigt. Alle Fußnotenmarker erscheinen im Haupttext.
