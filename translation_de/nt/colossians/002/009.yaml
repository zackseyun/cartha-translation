  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: de
  text: Denn in ihm wohnt die ganze Fülle der Gottheit leibhaftig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn in ihm wohnt die gesamte Fülle der Gottheit in leiblicher Gestalt.«'
    reason: Lexikalisch-stilistische Alternative für πᾶν τὸ πλήρωμα und σωματικῶς.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung bzw. Ermahnung ein und bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Gibt die auf Christus bezogene Ortsangabe ohne einen im Griechischen nicht vorhandenen ausschließenden Zusatz wieder.
- source_word: κατοικεῖ
  choice: wohnt
  rationale: Bewahrt den Sinn eines dauerhaften, festen Innewohnens und klingt zugleich natürlich und würdevoll.
- source_word: πᾶν τὸ πλήρωμα
  choice: die ganze Fülle
  rationale: Bringt die Totalität der im Griechischen bestimmten Fülle idiomatisch und prägnant zum Ausdruck.
- source_word: τῆς θεότητος
  choice: der Gottheit
  rationale: θεότης bezeichnet das Gottsein bzw. die volle Wirklichkeit der Gottheit, nicht bloß einzelne göttliche Eigenschaften.
- source_word: σωματικῶς
  choice: leibhaftig
  rationale: Gibt das Adverb knapp wieder und bewahrt seine körperliche beziehungsweise leibliche Aussagekraft, ohne sie weitergehend auszudeuten.
theological_decisions:
- issue: Christologische Aussagekraft von θεότης und σωματικῶς
  choice: Die ganze Fülle der Gottheit wohnt in Christus leibhaftig.
  alternative: In Christus seien lediglich göttliche Eigenschaften oder allgemein Gottes Gegenwart wirksam.
  rationale: θεότης ist eine starke Bezeichnung für Gottheit bzw. Gottsein, während σωματικῶς das Wohnen als leibhaftig kennzeichnet. Die Übersetzung wahrt diese hohe christologische Aussage, ohne ihre genaue Reichweite über den griechischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. »Leibhaftig« bewahrt die Prägnanz des griechischen Adverbs; die Fußnote bietet die explizitere moderne Formulierung »in leiblicher Gestalt«.
