revisions:
- from: Auch euch, die ihr in euren Verfehlungen[a] und in der Unbeschnittenheit eures Fleisches[b] tot wart, hat er zusammen mit ihm lebendig gemacht und uns alle Verfehlungen vergeben.[c]
  to: Auch euch, die ihr in euren Übertretungen[a] und in der Unbeschnittenheit eures Fleisches[b] tot wart, hat er zusammen mit ihm lebendig gemacht, indem er uns alle unsere Übertretungen vergab.[c]
  rationale: Die Revision stärkt die lexikalische Genauigkeit bei παράπτωμα, macht die syntaktische Abhängigkeit des griechischen Partizips im Deutschen sichtbar und formuliert die Kontextnotiz zur Unbeschnittenheit zurückhaltender. Der Wechsel der Personen, das Pronomen „ihm“ und die konkrete Wendung „Fleisch“ bleiben erhalten.
