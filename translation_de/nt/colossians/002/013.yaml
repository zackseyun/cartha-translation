  source_fidelity: 'Die Grundstruktur ist gut getroffen: Der Wechsel von „euch“ zu „uns“, die bildhafte Wendung „in ... Übertretungen“ und die Beziehung „mit ihm“ bleiben erhalten. „Verfehlungen“ ist für παράπτωμα jedoch vergleichsweise abgeschwächt; „Übertretungen“ gibt den schuldhaften Charakter und die wiederholte Terminologie genauer wieder. Die Partizipialbeziehung von χαρισάμενος wird mit „indem“ klarer als im bloß nebengeordneten „und“ abgebildet, ohne eine zeitliche Abfolge festzulegen.'
  naturalness: Der Relativsatz und die Wortstellung sind modernes, würdiges Standarddeutsch. „Indem er uns alle unsere Übertretungen vergab“ ist idiomatisch und macht zugleich eindeutig, dass „uns“ das indirekte Objekt zu „vergeben“ ist.
  terminology: „Übertretungen“ ist hier die angemessenere Wiedergabe von παραπτώματα. „Unbeschnittenheit eures Fleisches“ und „lebendig gemacht“ sind terminologisch tragfähig. Die Fußnote zur geistlichen Dimension sollte diese nicht stärker behaupten, als die Formulierung selbst es tut.
