source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: de
  text: Auch euch, die ihr in euren Übertretungen[a] und in der Unbeschnittenheit eures Fleisches[b] tot wart, hat er zusammen mit ihm lebendig gemacht, indem er uns alle unsere Übertretungen vergab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verfehlungen“.'
    reason: lexical_alternative
  - marker: b
    text: „Unbeschnittenheit eures Fleisches“ bezeichnet zunächst ihren körperlich unbeschnittenen Zustand; im Zusammenhang kann die Wendung zugleich geistliche Bedeutung haben.
    reason: cultural_note
  - marker: c
    text: 'Im Griechischen wechselt die Anrede hier von „euch/eure“ zu „uns“: „indem er uns alle unsere Übertretungen vergab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: die ihr … tot wart
  rationale: Die partizipiale Zustandsbeschreibung wird als natürlicher deutscher Relativsatz wiedergegeben; der Zustand des Totseins bleibt erhalten.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: in euren Verfehlungen
  rationale: „In“ bewahrt die räumlich-sphärische Bildsprache von ἐν. „Verfehlungen“ ist verständlich und gibt παράπτωμα als schuldhaftes Abweichen wieder, ohne die Wendung auf eine reine Ursache zu verengen.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: in der Unbeschnittenheit eures Fleisches
  rationale: Die Formulierung bewahrt den konkreten Bezug auf den unbeschnittenen körperlichen Zustand und lässt zugleich die geistliche Bedeutung im Zusammenhang offen.
- source_word: συνεζωοποίησεν … σὺν αὐτῷ
  choice: hat er zusammen mit ihm lebendig gemacht
  rationale: Die Wiedergabe erhält sowohl den Gedanken des Lebendigmachens als auch die ausdrücklich bezeichnete Gemeinschaft mit dem im Kontext gemeinten Christus; das Pronomen wird nicht durch einen erklärenden Namen ersetzt.
- source_word: χαρισάμενος
  choice: und … vergeben
  rationale: Die Beiordnung ist im Deutschen natürlicher als eine schwerfällige Partizipialkonstruktion. Der enge sachliche Zusammenhang von Lebendigmachen und Vergebung bleibt erhalten.
- source_word: ἡμῖν
  choice: uns
  rationale: Der auffällige Wechsel von der zweiten Person („euch/eure“) zur ersten Person Plural („uns“) wird nicht harmonisiert.
- source_word: πάντα τὰ παραπτώματα
  choice: alle Verfehlungen
  rationale: „Alle“ bewahrt die umfassende Aussage; die Wiederholung von „Verfehlungen“ entspricht der Wiederholung desselben griechischen Substantivs.
theological_decisions:
- issue: Bedeutung von σάρξ in τῆς σαρκὸς ὑμῶν
  choice: wörtlich „Fleisch“, mit möglicher geistlicher Resonanz
  alternative: „sündige Natur“ oder „Körper“
  rationale: Im unmittelbaren Zusammenhang der Beschneidung bezeichnet die Wendung zunächst den körperlich unbeschnittenen Zustand. „Fleisch“ bewahrt jedoch die mögliche weitergehende Bedeutung, ohne sie dogmatisch festzulegen.
- issue: Bezug von αὐτῷ in σὺν αὐτῷ
  choice: Pronomen „ihm“ beibehalten; kontextuell auf Christus bezogen
  alternative: im Haupttext ausdrücklich „mit Christus“
  rationale: Kolosser 2,12 spricht unmittelbar zuvor von Auferweckung mit Christus. Dennoch steht im griechischen Text ein Pronomen, dessen Form in der Übersetzung bewahrt wird.
- issue: Verhältnis von χαρισάμενος zum Hauptverb
  choice: als eng verbundene beigeordnete Handlung wiedergeben
  alternative: „indem er uns … vergab“ oder „nachdem er uns … vergeben hatte“
  rationale: Das griechische Partizip verbindet Vergebung und Lebendigmachen eng, legt aber die genaue logische oder zeitliche Beziehung nicht ausdrücklich fest. „Und“ vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Relativsatz sorgt für gute Verständlichkeit; die Satzstellung hält die beiden Zustandsangaben zusammen. „Fleisch“ und der Wechsel von „euch“ zu „uns“ bleiben bewusst erhalten, um die Spannung und Form des Ausgangstextes nicht einzuebnen.
