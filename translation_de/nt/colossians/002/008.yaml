id: COL.2.8
reference: Colossians 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: de
  text: Achtet darauf, dass euch niemand durch Philosophie und leeren Trug als Beute fortschleppt – nach menschlicher Überlieferung, nach den Elementen der Welt[a] und nicht nach dem Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Elementarmächten der Welt“. Der griechische Ausdruck kann sich sowohl auf grundlegende Elemente oder Ordnungen als auch auf kosmische geistliche Mächte beziehen.'
    reason: alternative_reading
  - marker: b
    text: Griechisch Christos; das Wort bedeutet „Gesalbter“ und wird traditionell auch mit „Christus“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Achtet darauf, dass … niemand
  rationale: Der Imperativ warnt vor einer möglichen Gefahr. Die deutsche Formulierung gibt diesen auffordernden Warncharakter natürlich wieder.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: als Beute fortschleppt
  rationale: Das seltene Verb συλαγωγέω bezeichnet das Wegführen als Beute. Die Formulierung bewahrt dieses anschauliche Bild und gibt die prospektive Warnung idiomatisch im Präsens wieder.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: durch Philosophie und leeren Trug
  rationale: διά bezeichnet hier das Mittel. Die beiden verbundenen Substantive bleiben nebeneinander stehen, ohne Philosophie eindeutig mit dem leeren Trug gleichzusetzen.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: nach menschlicher Überlieferung
  rationale: κατά bezeichnet den Maßstab oder die Ausrichtung. „Menschlich“ gibt den generischen Plural ἀνθρώπων geschlechtsübergreifend wieder.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: nach den Elementen der Welt
  rationale: '„Elemente“ hält die umstrittene Bedeutung von στοιχεῖα möglichst offen: Gemeint sein können grundlegende Bestandteile oder Ordnungen, aber auch kosmische Mächte.'
- source_word: οὐ κατὰ Χριστόν
  choice: nicht nach dem Messias
  rationale: Χριστός ist ursprünglich ein Titel („Gesalbter“, „Messias“). In der Gegenüberstellung als maßgebender Bezugspunkt tritt dieser Titelsinn hervor.
theological_decisions:
- issue: Bedeutung von στοιχεῖα τοῦ κόσμου
  choice: Elemente der Welt
  alternative: Elementarmächte der Welt
  rationale: Der griechische Ausdruck kann Grundelemente beziehungsweise grundlegende Ordnungen oder kosmische geistliche Mächte bezeichnen. Der Haupttext entscheidet die Frage nicht; die Fußnote nennt die wichtige personale Deutung.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Die Wiedergabe als „Messias“ macht den Titelsinn sichtbar, ohne die im Deutschen geläufige Form „Christus“ auszuschließen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als Beute fortschleppen“ bewahrt das kräftige Bild des griechischen Verbs; der Gedankenstrich gliedert die nachgestellten Maßstabsangaben. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
