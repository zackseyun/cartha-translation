  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: de
  text: Denn ich möchte, dass ihr wisst, wie groß der Kampf ist, den ich für euch, für die in Laodizea und für alle führe, die mich nicht persönlich gesehen haben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mein Gesicht im Fleisch nicht gesehen haben“; „im Fleisch“ bezeichnet hier die leibhaftige, körperliche Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Denn ich möchte, dass ihr wisst
  rationale: γάρ knüpft begründend an den vorherigen Gedankengang an; die Konstruktion θέλω mit Akkusativ und Infinitiv wird im Deutschen natürlich als „ich möchte, dass ihr wisst“ wiedergegeben.
- source_word: ἡλίκον ἀγῶνα ἔχω ὑπὲρ ὑμῶν
  choice: wie sehr ich für euch kämpfe
  rationale: ἡλίκον hebt das Ausmaß hervor, während ἀγών einen angestrengten Kampf bezeichnet. Die verbale Formulierung ist im modernen Deutschen natürlicher als „wie großen Kampf ich habe“ und bewahrt den Ernst des Bildes.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: die Menschen in Laodizea
  rationale: Der substantivierte präpositionale Ausdruck bezeichnet die dort befindlichen Personen. „Die Menschen“ ist inklusiv, verständlich und vermeidet das schwerfällige „diejenigen“.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: alle, die … noch nie … gesehen haben
  rationale: ὅσοι hat umfassende Kraft. Das Perfekt bezeichnet ihren bis dahin fortbestehenden fehlenden persönlichen Kontakt; „noch nie“ bringt dies idiomatisch zum Ausdruck.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: mich … persönlich gesehen haben
  rationale: Wörtlich steht „mein Gesicht im Fleisch“. Die Gesamtwendung meint eine leibhaftige Begegnung; „mich persönlich gesehen“ vermittelt diesen Sinn in natürlichem Deutsch, während die Fußnote die Form des griechischen Ausdrucks transparent macht.
theological_decisions:
- issue: Bedeutung von ἐν σαρκί in Verbindung mit dem Sehen von Paulus’ Gesicht
  choice: persönlich
  alternative: mein Gesicht im Fleisch
  rationale: σάρξ bezeichnet hier weder sündige Natur noch eine theologische Gegenüberstellung, sondern körperliche Anwesenheit. Die idiomatische Wiedergabe „persönlich“ lässt diesen konkreten Sinn klar erkennen; die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist für eine fortlaufende Brieflektüre natürlich; „kämpfe“ bewahrt die kraftvolle Metaphorik von ἀγών, und die Fußnote dokumentiert die auffällige wörtliche Wendung am Versende.
