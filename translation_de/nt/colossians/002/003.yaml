id: COL.2.3
reference: Colossians 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: de
  text: In ihm sind alle Schätze der Weisheit und Erkenntnis verborgen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In diesem“, falls sich das Relativpronomen allgemeiner auf Gottes Geheimnis statt auf Christus als Person bezieht.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aufbewahrt“; das griechische Adjektiv kann sowohl etwas Verborgenes als auch etwas sicher Verwahrtes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: in ihm
  rationale: Das Relativpronomen im Dativ Singular bezieht sich am natürlichsten auf den unmittelbar vorausgehenden persönlichen Bezug, Christus (2,2). Die Formulierung bewahrt zugleich die räumlich gedachte Bedeutung von ἐν.
- source_word: πάντες οἱ θησαυροὶ
  choice: alle Schätze
  rationale: 'Artikel und Plural ergeben einen bestimmten, umfassenden Sinn: die Gesamtheit der Schätze.'
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: der Weisheit und Erkenntnis
  rationale: Die beiden verwandten, aber unterschiedlichen Begriffe bleiben als Genitivpaar erhalten und werden nicht zu einem Begriff verschmolzen.
- source_word: ἀπόκρυφοι
  choice: verborgen
  rationale: „Verborgen“ gibt den Grundsinn des Adjektivs klar wieder, ohne festzulegen, ob vor allem Unzugänglichkeit oder sicheres Aufbewahren gemeint ist.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: sind ... verborgen
  rationale: Die Kopula mit dem prädikativen Adjektiv wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Ob ἀπόκρυφοι esoterische Geheimhaltung oder die sichere Verwahrung in Christus bezeichnet
  choice: Neutral mit „verborgen“ wiedergegeben
  alternative: „aufbewahrt“ zur Betonung der sicheren Verfügbarkeit oder „geheim“ zur Betonung der Verborgenheit vor Außenstehenden
  rationale: Der mögliche Bezug auf Ansprüche besonderer Erkenntnis wird nicht über den griechischen Wortlaut hinaus festgelegt; die theologische Spannung bleibt erhalten.
- issue: Bezugswort von ἐν ᾧ
  choice: 'Persönlicher Bezug auf Christus: „in ihm“'
  alternative: 'Weiterer Bezug auf Gottes Geheimnis: „in diesem“'
  rationale: Der persönliche Bezug auf Christus ist im unmittelbaren Kontext am wahrscheinlichsten, doch die grammatisch mögliche weitere Beziehung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle Metapher „Schätze“ und das Begriffspaar „Weisheit und Erkenntnis“ bleiben erhalten.
