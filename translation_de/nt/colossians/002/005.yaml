id: COL.2.5
reference: Colossians 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: de
  text: Denn auch wenn ich körperlich abwesend bin, bin ich doch im Geist[a] bei euch. Ich freue mich und sehe eure gute Ordnung und die Festigkeit[b] eures Glaubens an den Messias[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Im Geist“ meint wahrscheinlich den eigenen Geist des Paulus; möglich ist auch ein Bezug auf den Heiligen Geist.
    reason: theological_ambiguity
  - marker: b
    text: 'Oder: „Beständigkeit“ beziehungsweise „Standhaftigkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder möglicherweise: „die Festigkeit eurer Treue gegenüber dem Messias“.'
    reason: alternative_reading
  - marker: d
    text: 'Griechisch: „Christus“; das griechische Wort Χριστός bedeutet „Messias“, also „Gesalbter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ σαρκί
  choice: körperlich
  rationale: Im Gegensatz zu τῷ πνεύματι bezeichnet σάρξ hier die leibliche beziehungsweise physische Abwesenheit des Paulus, nicht eine sündige Natur. „Körperlich“ gibt diesen Sinn in heutigem Deutsch klar wieder.
- source_word: τῷ πνεύματι
  choice: im Geist
  rationale: Die Formulierung steht im Gegensatz zur körperlichen Abwesenheit und meint am ehesten die nichtkörperliche persönliche Gegenwart des Paulus. „Im Geist“ bewahrt zugleich die mögliche Anspielung auf den Heiligen Geist.
- source_word: χαίρων καὶ βλέπων
  choice: Ich freue mich und sehe
  rationale: Die beiden gleichgeordneten Präsenspartizipien bezeichnen begleitende Handlungen. Die finite Wiedergabe ist im Deutschen natürlicher und erhält ihre Koordination.
- source_word: τάξιν
  choice: gute Ordnung
  rationale: τάξις bezeichnet eine geordnete, angemessene Aufstellung oder Lebensordnung. „Gute Ordnung“ bringt den anerkennenden Zusammenhang zum Ausdruck, ohne das mögliche Ordnungsbild auf militärische Disziplin einzuengen.
- source_word: στερέωμα
  choice: Festigkeit
  rationale: στερέωμα bezeichnet Festigkeit, Stabilität oder einen festen Bestand. „Festigkeit“ bewahrt das Bild von etwas Solidem und Beständigem.
- source_word: πίστεως
  choice: Glaubens
  rationale: πίστις wird hier am natürlichsten als der auf den Messias gerichtete Glaube verstanden. Die ebenfalls mögliche Nuance „Treue“ wird in einer Fußnote erhalten.
- source_word: εἰς Χριστόν
  choice: an den Messias
  rationale: εἰς bezeichnet hier die Ausrichtung beziehungsweise das Objekt des Glaubens und wird im Deutschen idiomatisch mit „an“ wiedergegeben. Χριστός fungiert als Titel und wird daher mit „Messias“ übersetzt.
theological_decisions:
- issue: Bezug von πνεῦμα im Gegensatz zwischen körperlicher Abwesenheit und Gegenwart im Geist
  choice: Paulus ist nicht körperlich, aber in seinem Geist bei ihnen.
  alternative: Paulus ist durch den Heiligen Geist bei ihnen.
  rationale: Der unmittelbare Gegensatz zu τῇ σαρκί spricht vorrangig für Paulus’ eigenen Geist. Die Formulierung „im Geist“ legt den Bezug jedoch nicht völlig fest und bewahrt so die theologische Spannung.
- issue: Bedeutung von πίστις in εἰς Χριστὸν πίστεως
  choice: Glaube an den Messias
  alternative: Treue gegenüber dem Messias
  rationale: In dieser Konstruktion bezeichnet πίστις am ehesten den Glauben, dessen Gegenstand der Messias ist. Da „Treue“ lexikalisch möglich bleibt, wird diese Lesart in einer Fußnote genannt.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Χριστός trägt hier weiterhin den Sinn eines Titels. „Messias“ macht diesen Titelgehalt im modernen Deutschen deutlich; die traditionelle Wiedergabe „Christus“ bleibt als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Körperlich“ vermeidet die heute leicht missverständliche Wendung „im Fleisch“, während „im Geist“ den sprachlichen Gegensatz und dessen Mehrdeutigkeit bewahrt. Die zwei Partizipien werden zur besseren deutschen Lesbarkeit als eigenständiger Satz wiedergegeben.
