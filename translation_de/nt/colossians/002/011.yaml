source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: de
  text: 'In ihm wurdet auch ihr beschnitten – mit einer Beschneidung, die nicht von Menschenhand stammt[a]: im Ablegen des Leibes des Fleisches[b], in der Beschneidung des Messias[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit einer nicht von Händen gemachten Beschneidung“; auch: „mit einer Beschneidung, die nicht von Menschenhand vollzogen wurde“.'
    reason: Die griechische Wendung ἀχειροποίητος bezeichnet etwas, das nicht von Menschenhand gemacht ist.
  - marker: b
    text: 'Auch: „im Abstreifen des Leibes des Fleisches“. „Fleisch“ kann hier den vom sündigen Menschsein bestimmten Zustand bezeichnen; der griechische Ausdruck bleibt jedoch bewusst wörtlich wiedergegeben.'
    reason: Die Bildsprache von ἀπέκδυσις und die schwierige Genitivverbindung sollen sichtbar bleiben, ohne sie auf eine einzige Deutung festzulegen.
  - marker: c
    text: 'Auch: „in der vom Messias vollzogenen Beschneidung“, „in der Beschneidung des Messias selbst“ oder „in der Beschneidung, die zum Messias gehört“. Der griechische Genitiv kann verschiedene Beziehungen ausdrücken.'
    reason: Die Formulierung τοῦ Χριστοῦ ist grammatisch und theologisch mehrdeutig.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: In ihm
  rationale: Das Relativpronomen bezieht sich im Kontext auf den Messias. „In ihm“ ist im Deutschen natürlich und bewahrt den Gedanken der Verbundenheit mit ihm.
- source_word: περιετμήθητε
  choice: wurdet ... beschnitten
  rationale: Der Aorist Passiv bezeichnet eine vollzogene Handlung; die Beschneidungsmetapher wird nicht paraphrasiert.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: mit einer Beschneidung, die nicht von Menschenhand vollzogen wurde
  rationale: Die instrumentale beziehungsweise modale Beziehung bleibt erhalten. „Nicht von Menschenhand“ gibt den Gegensatz zwischen menschlichem Vollzug und göttlichem Handeln idiomatisch wieder.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: durch das Ablegen
  rationale: ἀπέκδυσις bezeichnet das Ausziehen, Abstreifen oder Ablegen. „Ablegen“ bewahrt das Bild und ist im Deutschen verständlich; das wiederholte ἐν kann hier natürlich instrumental mit „durch“ wiedergegeben werden.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: des Leibes des Fleisches
  rationale: Die ungewöhnliche Genitivverbindung wird bewusst eng am Griechischen belassen, damit sie nicht vorschnell als bloß physischer Körper oder als „sündige Natur“ festgelegt wird.
- source_word: σαρκός
  choice: Fleisches
  rationale: Die wörtliche paulinische Ausdrucksweise bleibt erhalten; eine interpretierende Wiedergabe wie „sündige Natur“ wäre hier zu eng.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: durch die Beschneidung des Messias
  rationale: '„Des Messias“ bewahrt die Mehrdeutigkeit des Genitivs: eine vom Messias bewirkte, ihm zugehörige oder auf ihn bezogene Beschneidung. Das instrumentale „durch“ ergibt im deutschen Satz einen natürlichen Zusammenhang.'
theological_decisions:
- issue: Bedeutung von „Beschneidung des Messias“
  choice: 'Offener Genitiv: „die Beschneidung des Messias“'
  alternative: „die vom Messias vollzogene Beschneidung“; „die eigene Beschneidung des Messias“; „die zum Messias gehörende Beschneidung“
  rationale: τοῦ Χριστοῦ legt die genaue Beziehung nicht eindeutig fest. Die Übersetzung bewahrt diese theologisch bedeutsame Offenheit.
- issue: Bedeutung von „Leib des Fleisches“
  choice: Die schwierige Formulierung wird als „Leib des Fleisches“ beibehalten.
  alternative: „fleischlicher Leib“; „vom Fleisch bestimmter Leib“; „sündige Natur“
  rationale: Die SBLGNT-Lesart soll ohne spätere Erweiterung oder anthropologische Festlegung wiedergegeben werden. Eine glättende Deutung würde die Spannung des Ausgangstextes auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich und der Doppelpunkt gliedern den langen griechischen Satz, ohne seine logischen Bezüge aufzulösen. „Messias“ gibt Χριστός als Titel wieder; „Leib des Fleisches“ bleibt absichtlich fremdartig, weil die Ausgangsformulierung selbst schwierig und deutungsoffen ist.
