  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: de
  text: Sie alle sind dazu bestimmt, durch den Gebrauch zu vergehen[a] – nach den Geboten und Lehren von Menschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die alle beim Gebrauch vergehen“; auch: „die alle durch das Aufbrauchen zugrunde gehen“.'
    reason: lexical_alternative
  - marker: b
    text: „Gebote und Lehren von Menschen“ spielt wahrscheinlich auf Jesaja 29,13 an und betont den menschlichen Ursprung dieser Vorschriften.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Sie alle
  rationale: Das neutrale Relativpronomen im Plural verweist auf die in Vers 21 genannten Dinge. „Sie alle“ stellt diesen Rückbezug im Deutschen natürlich und ausdrücklich her.
- source_word: εἰς φθοράν
  choice: sind dazu bestimmt, … zu vergehen
  rationale: 'Die Wendung bewahrt sowohl die Zielrichtung von εἰς als auch den kontextuellen Sinn von φθορά: Die betreffenden Dinge gehen beim Gebrauch zugrunde bzw. werden aufgebraucht.'
- source_word: τῇ ἀποχρήσει
  choice: durch den Gebrauch
  rationale: Der Dativ bezeichnet hier Mittel oder Begleitumstand. Die seltene Wortbildung ἀπόχρησις legt das Verbrauchen beziehungsweise Aufbrauchen nahe; „durch den Gebrauch“ bleibt verständlich und lässt diese Nuance offen.
- source_word: κατὰ
  choice: nach
  rationale: „Nach“ gibt den Maßstab beziehungsweise Ursprung der Vorschriften knapp und idiomatisch wieder.
- source_word: ἐντάλματα
  choice: Geboten
  rationale: „Gebote“ wahrt den regelnden Charakter und den wahrscheinlichen Anklang an Jesaja 29,13.
- source_word: διδασκαλίας
  choice: Lehren
  rationale: „Lehren“ ist eine natürliche, nicht unnötig technisch-dogmatische Entsprechung.
- source_word: τῶν ἀνθρώπων
  choice: von Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein. Die Formulierung hebt den menschlichen Ursprung im Gegensatz zu göttlicher Autorität hervor, ohne das Maskulinum unnötig auf Männer einzuengen.
theological_decisions:
- issue: Bezug und Funktion der erklärenden Aussage über Vergänglichkeit
  choice: Die genannten Dinge sind dazu bestimmt, durch Gebrauch zu vergehen; die Vorschriften darüber beruhen auf menschlichen Geboten und Lehren.
  alternative: Die Aussage kann knapper als „die alle beim Gebrauch vergehen“ verstanden werden, wobei die Vergänglichkeit der geregelten Dinge besonders hervortritt.
  rationale: Der griechische Relativsatz bezieht sich am natürlichsten auf die Gegenstände der Verbote. Die Übersetzung kennzeichnet zugleich die Vorschriften als menschlich, ohne genauer festzulegen, ob die Kritik primär ihren Gegenständen oder den Vorschriften selbst gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den erklärenden Einschub lesbar. „Von Menschen“ ist inklusiv und entspricht dem allgemeinen Sinn von ἀνθρώπων.
