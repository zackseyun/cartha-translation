  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: de
  text: und hält sich nicht am Haupt[a] fest, von dem her der ganze Leib durch die Gelenke und Bänder versorgt und zusammengehalten wird und mit dem Wachstum wächst, das Gott schenkt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klammert sich nicht an das Haupt“; auch: „hält sich nicht an das Haupt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wächst das Wachstum Gottes“. Gemeint sein kann ein Wachstum, das von Gott kommt oder das Gott bewirkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: hält sich … an
  rationale: Die Wendung bezeichnet hier ein beständiges Festhalten beziehungsweise Verbundensein; „sich an das Haupt halten“ gibt dies in natürlichem Deutsch wieder.
- source_word: κεφαλήν
  choice: das Haupt
  rationale: „Haupt“ bewahrt die Körpermetapher und ist im würdigen biblischen Register als Bezeichnung für Christus verständlich.
- source_word: ἐξ οὗ
  choice: Von ihm aus
  rationale: Das maskuline Relativpronomen verweist auf das personhaft verstandene Haupt; die Formulierung drückt zugleich Ursprung und Abhängigkeit aus.
- source_word: πᾶν τὸ σῶμα
  choice: der ganze Leib
  rationale: Dies gibt die Gesamtheit des einen Leibes idiomatisch wieder und führt die anatomische Metapher fort.
- source_word: ἁφῶν
  choice: Gelenke
  rationale: Im anatomischen Bild bezeichnet der Ausdruck am ehesten Verbindungs- oder Berührungspunkte; „Gelenke“ ist die geläufigste deutsche Entsprechung.
- source_word: συνδέσμων
  choice: Bänder
  rationale: Das Wort bezeichnet verbindende Strukturen; „Bänder“ ist anatomisch präzise und passt zur Verbindung mit „Gelenke“.
- source_word: ἐπιχορηγούμενον
  choice: wird … versorgt
  rationale: Das Passiv bezeichnet die dem Leib zukommende Versorgung oder Unterstützung, ohne sie ausschließlich auf Ernährung einzuengen.
- source_word: συμβιβαζόμενον
  choice: zusammengehalten
  rationale: Die Wiedergabe bewahrt den Gedanken, dass der Leib zu einer verbundenen Einheit gefügt und in ihr erhalten wird.
- source_word: αὔξει
  choice: wächst
  rationale: „Wächst“ ist im Bild eines lebendigen Leibes natürlicher als das abstraktere „nimmt zu“.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: mit dem Wachstum, das Gott schenkt
  rationale: Die Formulierung versteht den Genitiv plausibel als Herkunft beziehungsweise Urheberschaft und vermeidet das Missverständnis, Gott selbst wachse; eine Fußnote bewahrt die formale Offenheit des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung des Genitivs in τὴν αὔξησιν τοῦ θεοῦ
  choice: Wachstum, das Gott schenkt
  alternative: Wachstum Gottes / von Gott kommendes Wachstum
  rationale: Im Zusammenhang empfängt der Leib sein Wachstum vom Haupt und letztlich von Gott. Der Haupttext formuliert diesen wahrscheinlichen Sinn verständlich, während die Fußnote die ungewöhnliche und mehrdeutige Form des Griechischen sichtbar hält.
- issue: Referent von κεφαλήν
  choice: „Haupt“ als Bezeichnung für Christus
  alternative: bloß anatomisch „Kopf“
  rationale: Im Kontext des Briefes ist Christus das Haupt des Leibes. Die Übersetzung wahrt die Metapher, ohne über die Aussage des Verses hinaus eine bestimmte konfessionelle Deutung von Autorität oder Ursprung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ hält die paulinische Körpermetapher erkennbar; die Passivkonstruktion und die koordinierte Satzführung folgen dem griechischen Aufbau, ohne im Deutschen schwerfällig zu wirken.
