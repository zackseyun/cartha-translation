  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. Der Wechsel von „ihre Herzen“ zu „sie“ nach „während“ sowie die Abfolge „und sie zum … gelangen, zur Erkenntnis“ wirken jedoch syntaktisch holprig. Eine eingeschobene Partizipialgruppe und die Koordination der beiden Zielangaben sind klarer.
