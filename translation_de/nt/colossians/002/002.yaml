  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: de
  text: damit ihre Herzen ermutigt werden und sie, in Liebe zusammengeschlossen, zu allem Reichtum der vollen Gewissheit des Verstehens und zur Erkenntnis des Geheimnisses Gottes, des Messias, gelangen.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Liebe eng zusammengefügt“. Das Verb kann ein Zusammenbringen oder enges Verbinden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur vollen Erkenntnis“. Das griechische Wort kann gegenüber dem allgemeinen Wort für Wissen oder Erkenntnis einen verstärkten Sinn haben.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Wortlaut ist hier knapp und nicht leicht zu deuten: „das Geheimnis Gottes, des Messias“. Wahrscheinlich steht „des Messias“ als nähere Bestimmung zu „Geheimnis“: Gottes Geheimnis ist der Messias.'
    reason: alternative_reading
  - marker: d
    text: Einige Handschriften bieten am Versende eine längere Fassung, etwa „das Geheimnis Gottes, des Vaters und des Messias“. Die Übersetzung folgt dem kürzeren hier zugrunde gelegten griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: ermutigt werden
  rationale: Das Verb umfasst hier Zuspruch, Stärkung und Ermutigung. „Ermutigt werden“ gibt diese Breite wieder, ohne den Sinn auf Trost einzuengen.
- source_word: καρδίαι
  choice: Herzen
  rationale: „Herzen“ bewahrt die biblische Rede vom inneren Menschen und vermeidet eine einengende Deutung als bloßes Denken oder Fühlen.
- source_word: συμβιβασθέντες
  choice: miteinander verbunden sind
  rationale: Im Zusammenhang mit „in Liebe“ bezeichnet das Partizip am ehesten ein enges Zusammenfügen oder Verbinden. Die maskuline Pluralform bezieht sich sinngemäß auf die Menschen, deren Herzen genannt werden, nicht grammatisch auf „Herzen“.
- source_word: ἐν ἀγάπῃ
  choice: in Liebe
  rationale: Die Wendung bezeichnet den Bereich oder das verbindende Band, in dem das Miteinander besteht.
- source_word: εἰς πᾶν πλοῦτος
  choice: zum ganzen Reichtum
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. „Zum ganzen Reichtum“ erhält das Bild des Reichtums und lässt sich im Deutschen natürlich mit „gelangen“ verbinden.
- source_word: πληροφορίας τῆς συνέσεως
  choice: der vollen Gewissheit des Verstehens
  rationale: πληροφορία bezeichnet eine volle, gefestigte Gewissheit; σύνεσις das Verstehen beziehungsweise die Einsicht. Die Genitivverbindung bleibt bewusst eng am griechischen Ausdruck.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist im Deutschen ein natürlicher Ausdruck für vertieftes, bewusstes Erkennen und passt zum theologischen Zusammenhang, ohne die Intensivierung ausdrücklich festzulegen.
- source_word: μυστηρίου
  choice: Geheimnis
  rationale: „Geheimnis“ bezeichnet hier Gottes zuvor verborgenen und nun offenbarten Heilsplan; es ist der etablierte und verständliche deutsche Ausdruck.
- source_word: θεοῦ, Χριστοῦ
  choice: Gottes, des Messias
  rationale: Die knappe Genitivfolge des Ausgangstextes wird nicht durch ein erklärendes „nämlich“ vereindeutigt. „Messias“ gibt Χριστός als Titel wieder.
theological_decisions:
- issue: Verhältnis von Χριστοῦ zu „Geheimnis Gottes“
  choice: „des Geheimnisses Gottes, des Messias“
  alternative: „des Geheimnisses Gottes, nämlich des Messias“ oder „des Geheimnisses Gottes und des Messias“
  rationale: Der bereitgestellte kurze griechische Text ist knapp und syntaktisch schwierig. Die gewählte Form wahrt die naheliegende appositionelle Lesart, ohne sie durch einen erklärenden Zusatz vollständig festzulegen oder eine nicht vorhandene Konjunktion einzufügen.
- issue: Textvariante am Versende
  choice: Folge dem kurzen Text τοῦ θεοῦ, Χριστοῦ
  alternative: Längere Lesarten wie „Gottes, des Vaters, und des Christus“
  rationale: Die Übersetzung folgt der ausdrücklich vorgegebenen SBLGNT-Lesart; abweichende längere Überlieferungen werden in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ergänzten Verben „sind“ und „gelangen“ machen die griechische Partizipial- und Zielkonstruktion verständlich, ohne ihre gedankliche Bewegung aufzulösen. „Volle Gewissheit des Verstehens“ bleibt bewusst etwas gehoben, um die dichte Genitivverbindung und den theologischen Ernst des Ausgangstextes zu bewahren.
