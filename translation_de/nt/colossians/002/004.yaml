  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: de
  text: Das sage ich, damit euch niemand durch überzeugend klingende Argumente täuscht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch einleuchtend klingende Rede“.'
    reason: Lexikalische Alternative für ἐν πιθανολογίᾳ, das sowohl plausible Rede als auch überzeugende Argumentation bezeichnen kann.
lexical_decisions:
- source_word: τοῦτο
  choice: Das
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist am natürlichsten auf die unmittelbar vorausgehende Aussage oder Gedankenführung, ohne ihren Umfang genauer festzulegen.
- source_word: λέγω
  choice: sage ich
  rationale: Das Präsens wird direkt und idiomatisch wiedergegeben; die deutsche Wortstellung verbindet das Verb natürlich mit dem vorangestellten Demonstrativpronomen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ drückt den Zweck der Aussage im modernen Standarddeutsch klar aus.
- source_word: μηδεὶς
  choice: niemand
  rationale: Die unbestimmte Verneinung wird präzise und natürlich wiedergegeben.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen gibt die zweite Person Plural eindeutig wieder.
- source_word: παραλογίζηται
  choice: täuscht
  rationale: Das Verb bezeichnet hier ein Irreführen oder Täuschen durch trügerische Schlussfolgerung; „täuscht“ ist verständlich und lässt das folgende Mittel der Täuschung hervortreten.
- source_word: ἐν πιθανολογίᾳ
  choice: durch überzeugend klingende Argumente
  rationale: ἐν bezeichnet hier Mittel oder Art und Weise. πιθανολογία kann überzeugende beziehungsweise plausibel erscheinende Rede oder Argumentation meinen. „Überzeugend klingende Argumente“ wahrt, dass die Argumente rhetorisch einleuchten können, ohne tatsächlich wahr oder stichhaltig zu sein.
theological_decisions:
- issue: Art der Warnung in παραλογίζηται ἐν πιθανολογίᾳ
  choice: Allgemeine Warnung vor Täuschung durch überzeugend oder plausibel klingende Argumentation
  alternative: Spezifische Warnung vor einer bestimmten falschen Philosophie oder lediglich vor rhetorischer Beredsamkeit
  rationale: Der Vers selbst benennt kein bestimmtes Lehrsystem. Die Übersetzung bewahrt deshalb die allgemeine Warnung und engt ihren Gegenstand nicht über den griechischen Wortlaut hinaus ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Überzeugend klingend“ macht die rhetorische Plausibilität deutlich, ohne die Argumente als tatsächlich stichhaltig zu bestätigen.
