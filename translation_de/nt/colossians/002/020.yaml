  verdict: approve
  source_fidelity: Der Entwurf gibt die Kondition Εἰ, das Mitsterben mit Christus, die Trennung von den στοιχεῖα τοῦ κόσμου, die rhetorische Frage und die mediale/passive Nuance von δογματίζεσθε sachgerecht wieder. „Den Grundprinzipien der Welt gestorben“ ist im Deutschen eine idiomatische Wiedergabe der mit ἀπό ausgedrückten Abgrenzung, ohne das Bild des Sterbens aufzulösen.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Der lange Fragesatz ist gut lesbar; „als würdet ihr in der Welt leben“ gibt den suppositiven Vergleich natürlich wieder. Der abschließende Doppelpunkt ist wegen des Anschlusses an V. 21 richtig.
  terminology: „Christus“ ist die im deutschen Bibeldeutsch etablierte Wiedergabe. „Grundprinzipien der Welt“ wahrt die im Kontext umstrittene Bedeutung von στοιχεῖα, während die Fußnote die personal-kosmische und die stoffliche Alternative transparent erhält. „Vorschriften“ und „euch ... auferlegen lassen“ treffen den Sinn von δογματίζεσθε angemessen.
