id: COL.2.20
reference: Colossians 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: de
  text: 'Wenn ihr mit Christus den Grundprinzipien der Welt gestorben seid[a], warum lasst ihr euch dann, als würdet ihr in der Welt leben, Vorschriften auferlegen[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Elementarmächte der Welt“ oder „Grundelemente der Welt“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „warum unterwerft ihr euch Vorschriften?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Wenn
  rationale: Bewahrt die formale Bedingung des griechischen Satzes, ohne die im Zusammenhang wahrscheinlich vorausgesetzte Wirklichkeit ausdrücklich als „da“ oder „weil“ festzulegen.
- source_word: ἀπεθάνετε
  choice: ihr ... gestorben seid
  rationale: Das deutsche Perfekt gibt das entscheidende vergangene Geschehen natürlich wieder; zusammen mit dem Dativ bezeichnet es die Trennung vom bisherigen Macht- oder Ordnungsbereich.
- source_word: σὺν Χριστῷ
  choice: mit Christus
  rationale: „Christus“ ist im modernen Standarddeutsch die geläufige und zugleich titelhaltige Wiedergabe von Χριστός.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: den Grundprinzipien der Welt gestorben
  rationale: Die deutsche Wendung „einer Sache gestorben sein“ drückt die durch ἀπό bezeichnete Trennung idiomatisch aus. „Grundprinzipien“ hält den Gedanken einer grundlegenden Weltordnung offen; die ebenfalls möglichen kosmisch-personalen und stofflichen Bedeutungen stehen in der Fußnote.
- source_word: τί
  choice: warum
  rationale: Gibt die rhetorische Frage im Deutschen idiomatisch wieder.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: als würdet ihr in der Welt leben
  rationale: Bewahrt den vergleichenden beziehungsweise hypothetischen Sinn von ὡς mit dem Partizip, ohne ein im Griechischen nicht ausdrücklich vorhandenes „noch“ einzufügen.
- source_word: δογματίζεσθε
  choice: lasst ihr euch ... Vorschriften auferlegen
  rationale: Gibt die mediale oder passive Form natürlich wieder und lässt sowohl das Unterworfenwerden als auch die Beteiligung der Adressaten erkennen.
theological_decisions:
- issue: Bedeutung von στοιχεῖα im paulinischen Sprachgebrauch
  choice: Grundprinzipien
  alternative: Elementarmächte; Grundelemente
  rationale: Der Ausdruck kann grundlegende Ordnungsprinzipien, kosmische Mächte oder elementare Bestandteile bezeichnen. Der Haupttext legt ihn nicht eindeutig personal oder rein stofflich aus; die Alternativen werden in der Fußnote offengelegt.
- issue: Verhältnis der Glaubenden zur Weltordnung
  choice: „den Grundprinzipien der Welt gestorben“
  alternative: „von den Grundprinzipien der Welt befreit“
  rationale: Die Übersetzung bewahrt ausdrücklich das Sterben mit Christus und ersetzt dieses theologisch dichte Bild nicht durch eine erklärende Folgerung wie „befreit“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt trotz des längeren rhetorischen Fragesatzes gut verständlich. Der Doppelpunkt wahrt den Übergang zu den im folgenden Vers genannten Vorschriften.
