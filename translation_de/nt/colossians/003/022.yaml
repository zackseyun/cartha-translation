source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: de
  text: Ihr Sklaven, gehorcht euren Herren nach dem Fleisch in allem – nicht nur, wenn sie euch beobachten, um Menschen zu gefallen,[a] sondern mit aufrichtigem Herzen und in Ehrfurcht vor dem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht mit Augendiensten wie Menschengefällige“. Gemeint ist ein Dienst, der nur geleistet wird, solange jemand zusieht.'
    reason: Die seltenen Ausdrücke ὀφθαλμοδουλίαις und ἀνθρωπάρεσκοι werden im Haupttext idiomatisch wiedergegeben; die Fußnote bewahrt ihre Bildsprache und erklärt ihren Sinn.
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Ihr Sklaven
  rationale: δοῦλοι bezeichnet in diesem antiken Haushaltskontext versklavte Menschen; „Sklaven“ macht die soziale Realität deutlich und vermeidet die Verharmlosung durch „Diener“.
- source_word: ὑπακούετε κατὰ πάντα
  choice: gehorcht … in allem
  rationale: Gibt den Imperativ und den umfassenden Geltungsbereich der Wendung unmittelbar und natürlich wieder.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: euren Herren nach dem Fleisch
  rationale: Bewahrt die paulinische Formulierung κατὰ σάρκα und begrenzt damit die Herrschaft auf das menschlich-leibliche Verhältnis; „Herren“ hält zugleich den Kontrast zum göttlichen „Herrn“ sichtbar.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: nicht nur, wenn sie euch beobachten
  rationale: Das seltene Kompositum bezeichnet einen Dienst, der nur unter den Augen des Herrn geleistet wird. Die sinngemäße Formulierung ist im heutigen Deutsch klarer als ein Kunstwort wie „Augendienst“.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: um Menschen zu gefallen
  rationale: 'Vermittelt idiomatisch die missbilligende Bedeutung: Das Verhalten ist auf menschlichen Beifall ausgerichtet.'
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: sondern mit aufrichtigem Herzen
  rationale: ἁπλότης meint hier ungeteilte Lauterkeit und Aufrichtigkeit, nicht intellektuelle Einfachheit.
- source_word: φοβούμενοι τὸν κύριον
  choice: und in Ehrfurcht vor dem Herrn
  rationale: „Ehrfurcht“ drückt in diesem Zusammenhang die religiös-ethische Bedeutung der Gottesfurcht natürlich aus; „Herr“ gibt den göttlichen Titel wieder und steht im Kontrast zu den menschlichen Herren.
theological_decisions:
- issue: Ethische Weisung im Kontext antiker Sklaverei
  choice: Die Beteiligten werden klar als „Sklaven“ und „Herren“ bezeichnet, ohne die Institution in moderne Arbeitsverhältnisse umzudeuten.
  alternative: „Diener“ und „Arbeitgeber“ verwenden.
  rationale: Der griechische Text setzt das antike Sklavereiverhältnis voraus. Eine arbeitsrechtliche Modernisierung würde die historische und ethische Spannung des Textes verdecken.
- issue: Bedeutung von κατὰ σάρκα
  choice: Die Wendung wird formal als „nach dem Fleisch“ bewahrt.
  alternative: „irdischen Herren“ oder „menschlichen Herren“.
  rationale: Die formale Wiedergabe erhält den paulinischen Ausdruck und den begrenzenden Kontrast zwischen menschlichen Herren und dem Herrn, ohne die Mehrdeutigkeit von σάρξ vorschnell aufzulösen.
- issue: φοβούμενοι als Haltung gegenüber dem Herrn
  choice: „in Ehrfurcht vor dem Herrn“
  alternative: „den Herrn fürchtend“.
  rationale: „Ehrfurcht“ gibt den religiösen Gehalt im modernen Deutsch verständlich wieder, ohne die motivierende Autorität des Herrn auf bloßen Respekt zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historische Härte von δοῦλοι bleibt mit „Sklaven“ sichtbar. „Nach dem Fleisch“ bewahrt bewusst die paulinische Ausdrucksweise; der seltene „Augendienst“ wird dagegen zugunsten unmittelbarer Verständlichkeit entfaltet.
