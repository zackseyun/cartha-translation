  source_fidelity: Der Imperativ („gehorcht“), der umfassende Geltungsbereich („in allem“), die menschlich-begrenzte Bezeichnung der Herren („nach dem Fleisch“), der Kontrast zu beobachtungsabhängigem Dienst und Menschengefälligkeit sowie die Aufrichtigkeit des Herzens und die Gottesfurcht sind sachgerecht wiedergegeben. „Nicht nur, wenn sie euch beobachten“ entfaltet ὀφθαλμοδουλίαις idiomatisch; die damit verbundene Ausrichtung auf menschlichen Beifall wird zutreffend durch „um Menschen zu gefallen“ ausgedrückt.
  naturalness: Der Satz ist flüssiges, würdiges modernes Standarddeutsch. „Herren nach dem Fleisch“ ist bewusst formnah und im biblischen Register verständlich; der nachfolgende Kontrast zum „Herrn“ bleibt deutlich.
  terminology: „Sklaven“ gibt δοῦλοι im antiken Haushaltskontext klar wieder, ohne es zu modernen Arbeitsverhältnissen abzuschwächen. „Herren“ ist für die menschlichen κύριοι passend, „Herr“ für den göttlichen Titel. „Aufrichtigem Herzen“ und „in Ehrfurcht vor dem Herrn“ treffen den ethisch-religiösen Sinn von ἁπλότης καρδίας bzw. φοβούμενοι τὸν κύριον angemessen.
