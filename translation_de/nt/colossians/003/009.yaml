lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Belügt … nicht
  rationale: Die Verneinung mit dem Präsensimperativ wird als unmittelbares, idiomatisches Verbot wiedergegeben. Der Zusammenhang verlangt nicht zwingend die stärker aspektuelle Übersetzung „Hört auf zu lügen“.
- source_word: εἰς ἀλλήλους
  choice: einander
  rationale: Das reziproke „einander“ gibt die Beziehung innerhalb der angesprochenen Gemeinschaft knapp und natürlich wieder.
- source_word: ἀπεκδυσάμενοι
  choice: denn ihr habt … ausgezogen
  rationale: Das kausal verstandene Partizip begründet die Aufforderung mit einer bereits vollzogenen Veränderung. „Ausgezogen“ bewahrt das Kleidungsbild des griechischen Verbs.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: den alten Menschen
  rationale: Die wörtlich-nahe Formulierung bewahrt die Verbindung zum „neuen Menschen“ im folgenden Vers und lässt den anthropologischen Kontrast des Paulus bestehen.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: samt seinen Taten
  rationale: „Samt“ drückt die enge Begleitung aus; „Taten“ ist eine klare und natürliche Wiedergabe der konkreten Handlungen beziehungsweise Verhaltensweisen. Das Possessivpronomen entspricht dem maskulinen Bezugswort „Mensch“.
theological_decisions:
- issue: Bedeutung von τὸν παλαιὸν ἄνθρωπον
  choice: den alten Menschen
  alternative: das alte Ich / den früheren Menschen
  rationale: „Den alten Menschen“ erhält den ausdrücklichen Gegensatz zum „neuen Menschen“ und legt nicht vorschnell fest, ob ausschließlich das individuelle Selbst oder auch eine umfassendere, repräsentative Menschheit gemeint ist.
- issue: Syntaktische Beziehung von ἀπεκδυσάμενοι
  choice: 'kausal: „denn ihr habt … ausgezogen“'
  alternative: 'modal oder temporal: „nachdem ihr … ausgezogen habt“ / „wobei ihr … ausgezogen habt“'
  rationale: Im unmittelbaren Zusammenhang begründet das Partizip wahrscheinlich das Verbot. Da seine genaue adverbiale Beziehung grammatisch nicht ausdrücklich markiert ist, wird die formalere Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Belügt einander nicht“ ist unmittelbar verständlich; „den alten Menschen … ausgezogen“ bewahrt bewusst das paulinische Kleidungsbild. Das Schlusskomma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
