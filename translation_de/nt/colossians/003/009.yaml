  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: de
  text: Belügt einander nicht, denn ihr habt den alten Menschen[b] samt seinen Taten ausgezogen[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nachdem ihr den alten Menschen samt seinen Taten ausgezogen habt“ oder, weniger ausdrücklich, „wobei ihr den alten Menschen samt seinen Taten ausgezogen habt“. Das griechische Partizip kann auch einen begleitenden Umstand ausdrücken; hier begründet es wahrscheinlich die Aufforderung.'
    reason: grammatical_alternative
