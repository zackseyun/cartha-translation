reference: Colossians 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: de
  text: Wegen dieser Dinge kommt der Zorn Gottes über die Menschen, die vom Ungehorsam geprägt sind.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „über die Söhne des Ungehorsams“, eine Wendung für Menschen, die durch Ungehorsam gekennzeichnet sind.
    reason: lexical_alternative
  - marker: b
    text: In einigen griechischen Handschriften fehlen die Worte „über die Menschen, die vom Ungehorsam geprägt sind“.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: Wegen dieser Dinge
  rationale: διά mit dem Akkusativ bezeichnet hier den Grund. Die Formulierung bewahrt den pluralischen Rückbezug auf die zuvor genannten Verfehlungen.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens von ἔρχομαι wird als gegenwärtig bevorstehendes Kommen wiedergegeben und behält so den eschatologischen Ernst der Aussage.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: der Zorn Gottes
  rationale: Die feste und gewichtige Wendung gibt sowohl ὀργή als auch die Genitivverbindung unmittelbar wieder, ohne den gerichtlichen Sinn abzuschwächen.
- source_word: ἐπὶ
  choice: über
  rationale: ἐπί mit dem Akkusativ bezeichnet hier das Ziel, über das Gottes Zorn kommt; „über“ ist im Deutschen in diesem Gerichtszusammenhang natürlich.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: die Menschen, die vom Ungehorsam geprägt sind
  rationale: Die semitisch geprägte Genitivwendung bezeichnet nicht ausschließlich männliche Nachkommen, sondern Menschen, deren kennzeichnendes Merkmal Ungehorsam ist. Die Fußnote bewahrt die wörtliche Bildsprache.
theological_decisions:
- issue: Wiedergabe der idiomatischen Wendung „Söhne des Ungehorsams“
  choice: Im Haupttext sinngemäß als „Menschen, die vom Ungehorsam geprägt sind“, mit wörtlicher Wiedergabe in der Fußnote
  alternative: „die Söhne des Ungehorsams“
  rationale: Die idiomatische Bedeutung umfasst Menschen allgemein und bezeichnet ihren prägenden Ungehorsam. Die gewählte Fassung vermeidet ein modernes Missverständnis als ausschließlich männliche Gruppe, während die Fußnote die Ausdrucksform des griechischen Textes sichtbar hält.
- issue: Zeitlicher Sinn von ἔρχεται
  choice: „kommt“ als bevorstehendes göttliches Gericht
  alternative: „kommt immer wieder“ oder „ist bereits vollständig gekommen“
  rationale: Das griechische Präsens lässt das Gericht als gewiss und im Kommen erscheinen, ohne seinen Zeitpunkt genauer festzulegen. Die Übersetzung wahrt diese eschatologische Spannung.
- issue: Textkritische Unsicherheit bei ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας
  choice: Die im SBLGNT eingeklammerten Worte stehen im Haupttext und werden textkritisch angemerkt
  alternative: Die umstrittenen Worte aus dem Haupttext auslassen
  rationale: Das SBLGNT druckt die Wendung, kennzeichnet sie jedoch als textlich unsicher. Haupttext und Fußnote bilden sowohl die Edition als auch die Überlieferungsunsicherheit transparent ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wegen dieser Dinge“ hält den Rückbezug ausdrücklich pluralisch; die ungewöhnliche griechische Abstammungsmetapher wird im Haupttext verständlich erschlossen und in der Fußnote bewahrt.
