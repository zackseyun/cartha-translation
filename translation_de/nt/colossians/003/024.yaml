review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den partizipialen, im Kontext begründenden Anschluss von εἰδότες mit „Denn ihr wisst“ angemessen wieder. „vom Herrn ... empfangen werdet“ entspricht ἀπὸ κυρίου ἀπολήμψεσθε. „das Erbe als Lohn“ trifft den wahrscheinlich epexegetischen Genitiv in ἀνταπόδοσιν τῆς κληρονομίας und die Fußnote bewahrt die engere griechische Form. „Ihr dient“ ist für δουλεύετε grammatisch möglich; die Fußnote hält die ebenso mögliche imperativische Lesart offen.
  naturalness: Der Text ist modernes, würdiges und gut verständliches Standarddeutsch. Die Apposition „dem Herrn, dem Messias“ ist klar und natürlich genug; sie macht die gemeinsame Referenz der beiden Titel sichtbar.
  terminology: „Herr“ für κύριος und „Messias“ für den titelhaft gebrauchten Χριστός sind konsequent. „Dienen“ ist in diesem Kontext eine sachgerechte, idiomatische Wiedergabe von δουλεύειν, ohne die soziale Metapher unnötig auszubauen.
