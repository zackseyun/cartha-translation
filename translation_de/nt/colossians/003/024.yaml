id: COL.3.24
reference: Colossians 3:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: de
  text: Denn ihr wisst, dass ihr vom Herrn das Erbe als Lohn empfangen werdet.[a] Ihr dient dem Herrn, dem Messias.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Lohn des Erbes“. Gemeint sein kann, dass das Erbe selbst der Lohn ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder traditionell: „dem Herrn Christus“.'
    reason: alternative_reading
  - marker: c
    text: 'Die griechische Form kann auch als Aufforderung verstanden werden: „Dient dem Herrn, dem Messias.“'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: εἰδότες
  choice: Denn ihr wisst
  rationale: Das Partizip führt die Ermahnung aus dem vorangehenden Satz begründend weiter. Die finite deutsche Form ist natürlicher als „wissend“, ohne den Zusammenhang zu lösen.
- source_word: ἀπὸ κυρίου
  choice: vom Herrn
  rationale: ἀπό mit Genitiv bezeichnet die Quelle; „Herr“ bewahrt zugleich den christologischen Titel im Umfeld des Herren-Sklaven-Verhältnisses.
- source_word: ἀπολήμψεσθε
  choice: empfangen werdet
  rationale: Das Futur bezeichnet das künftige Empfangen; der Gedanke einer Vergeltung wird durch „als Lohn“ ausgedrückt.
- source_word: τὴν ἀνταπόδοσιν τῆς κληρονομίας
  choice: das Erbe als Lohn
  rationale: 'Diese natürliche deutsche Fassung versteht den Genitiv als Erläuterung: Der Lohn besteht im Erbe. Die kompaktere, aber im Deutschen mehrdeutige Form „den Lohn des Erbes“ wird in der Fußnote bewahrt.'
- source_word: τῷ κυρίῳ Χριστῷ
  choice: dem Herrn, dem Messias
  rationale: Χριστός wird titelhaft als „Messias“ wiedergegeben; die Apposition macht im Deutschen deutlich, dass „Herr“ und „Messias“ dieselbe Person bezeichnen.
- source_word: δουλεύετε
  choice: Ihr dient
  rationale: Die Form kann grammatisch Indikativ oder Imperativ sein. Im Zusammenhang ist die Aussage als begründende Erinnerung gut möglich; die imperativische Lesart wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bedeutung des Genitivs in ἀνταπόδοσιν τῆς κληρονομίας
  choice: Das Erbe ist der Lohn.
  alternative: „den Lohn des Erbes“
  rationale: Die gewählte Fassung ist im modernen Deutsch verständlich, während die Fußnote die knappe Struktur und verbleibende Deutungsmöglichkeit des Griechischen sichtbar hält.
- issue: Titel Χριστός
  choice: Messias
  alternative: Christus
  rationale: Hier ist Χριστός als Titel in der Verbindung mit κύριος erkennbar; „Messias“ lässt diese Titelfunktion deutlicher hervortreten.
- issue: Satzmodus von δουλεύετε
  choice: 'Indikativ: „Ihr dient“'
  alternative: 'Imperativ: „Dient“'
  rationale: δουλεύετε ist formal sowohl Präsens Indikativ als auch Präsens Imperativ, jeweils zweite Person Plural. Die indikativische Lesart erinnert die Angesprochenen daran, wem ihr Dienst tatsächlich gilt; die andere grammatisch mögliche Lesart wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Denn ihr wisst“ bindet den Vers natürlich an die vorherige Ermahnung an. Die Sklavereimetapher von δουλεύω wird mit „dienen“ wiedergegeben; der Haushaltskontext bleibt durch „Herr“ erkennbar, ohne im Deutschen unnötig eine zusätzliche Härte einzutragen.
