  source_fidelity: Der Entwurf gibt die konditionale Einleitung (Εἰ οὖν), das passive Mit-auferwecktwerden, den Imperativ und die bildhafte Orts- und Erhöhungsformel insgesamt treffend wieder. „Das, was oben ist“ ist trotz der griechischen Pluralform idiomatisch und inhaltlich ausreichend weit. Die konditionale Form sollte erhalten bleiben; eine kausale Hauptübersetzung wäre weniger quellennah.
  naturalness: „… wo der Messias ist, sitzend zur Rechten Gottes“ ist im modernen Standarddeutsch stilistisch schwerfällig und wirkt wie ein nachgestelltes, nicht sauber eingebundenes Partizipialattribut. Eine finite Umformung ist natürlich und gibt das präsentische Partizip καθήμενος angemessen wieder.
  terminology: „Messias“, „auferweckt“ und „zur Rechten Gottes“ sind sachgerecht, registerangemessen und bewahren die Titel- und Bildsprache. Die Fußnote erläutert die pragmatische Annahme der Bedingung, ohne die Übersetzung selbst in einen Kausalsatz umzudeuten.
  issues:
