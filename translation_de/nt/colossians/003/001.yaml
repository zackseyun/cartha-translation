id: COL.3.1
reference: Colossians 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: de
  text: Wenn[a] ihr nun mit dem Messias auferweckt worden seid, dann sucht das, was oben ist, wo der Messias zur Rechten Gottes sitzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Da ihr nun mit dem Messias auferweckt worden seid, sucht das, was oben ist …“ Die griechische Form ist ein Konditionalsatz („wenn“), behandelt die Bedingung im Zusammenhang jedoch wahrscheinlich als erfüllt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Wenn … nun, dann
  rationale: Bewahrt sowohl die Bedingungsform εἰ als auch den folgernden Charakter von οὖν. Im Zusammenhang wird die Bedingung wahrscheinlich als erfüllt vorausgesetzt, ohne dass die Übersetzung sie ausdrücklich in einen Kausalsatz umformt.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: ihr … mit dem Messias auferweckt worden seid
  rationale: Das Passiv von συνεγείρω wird beibehalten; σύν- und der assoziative Dativ drücken das gemeinsame Auferwecktwerden beziehungsweise die Verbundenheit mit dem Messias aus.
- source_word: τὰ ἄνω
  choice: das, was oben ist
  rationale: Die substantivierte Wendung bezeichnet umfassend die Dinge beziehungsweise Wirklichkeit oben. Die deutsche Singularform ist idiomatisch und lässt den Umfang offen.
- source_word: ζητεῖτε
  choice: sucht
  rationale: Gibt den Präsensimperativ direkt wieder. Die fortdauernde Ausrichtung ergibt sich aus der Verbform und dem Zusammenhang, ohne durch einen Zusatz überverdeutlicht zu werden.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Χριστός trägt hier erkennbar Titelfunktion und wird daher bedeutungsorientiert als „Messias“ wiedergegeben.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Natürliche, würdevolle deutsche Wiedergabe der vertrauten königlichen Erhöhungsformel.
- source_word: καθήμενος
  choice: sitzend
  rationale: Bewahrt den modalen beziehungsweise beschreibenden Partizipialausdruck enger als eine finite Umformung und vermeidet die stärkere Deutung „thronend“.
theological_decisions:
- issue: Aussagekraft der Bedingung Εἰ
  choice: Bedingungsform „Wenn … dann“ beibehalten
  alternative: „Da ihr nun …“ beziehungsweise „Wenn ihr also …“ ohne ausdrückliches „dann“
  rationale: Die Bedingung wird im Kontext wohl als wahr vorausgesetzt, doch die griechische Form bleibt konditional. Die Übersetzung erhält diese Spannung, ohne Zweifel am Auferwecktsein der Adressaten einzutragen.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: An beiden Stellen bleibt die Titelbedeutung des Gesalbten relevant; „Messias“ macht sie für heutige Leser transparent, ohne zusätzliche konfessionelle Deutung.
- issue: Vorstellung des Ortes „oben“ und der Rechten Gottes
  choice: Räumlich-bildhafte Sprache bewahren
  alternative: Deutend als „himmlische Dinge“ und „in göttlicher Machtstellung“ wiedergeben
  rationale: Paulus verbindet räumliche und königliche Bildsprache. Eine erklärende Auflösung würde die Bildwelt und ihre theologische Mehrschichtigkeit verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auferweckt“ und „zur Rechten Gottes“ bewahren zentrale biblische Bildsprache; die Satzführung bleibt trotz Nähe zur griechischen Struktur gut verständlich.
