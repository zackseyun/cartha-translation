id: COL.3.4
reference: Colossians 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: de
  text: Wenn der Messias[a], euer Leben[b], offenbar wird, dann werdet auch ihr zusammen mit ihm in Herrlichkeit offenbar werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“. Der griechische Titel Χριστός bedeutet „Gesalbter“ und entspricht „Messias“.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen: „unser Leben“.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet mit dem Konjunktiv ein erwartetes zukünftiges Ereignis ein; „wenn“ ist im Deutschen dafür natürlich und präzise.
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Χριστός ist hier mit Artikel als Titel gebraucht. „Messias“ gibt den Titelgehalt wieder; „Christus“ bleibt als geläufige Alternative in der Fußnote genannt.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: offenbar wird / offenbar werden
  rationale: 'Die gleiche deutsche Wortverbindung bewahrt die auffällige Wiederholung desselben griechischen Verbs und dessen passiven Sinn: Sowohl der Messias als auch die Glaubenden werden öffentlich sichtbar beziehungsweise erkennbar.'
- source_word: ἡ ζωὴ ὑμῶν
  choice: euer Leben
  rationale: Die knappe Apposition des Griechischen wird im Deutschen beibehalten. Sie identifiziert den Messias unmittelbar mit dem Leben der Angesprochenen, ohne die Aussage erklärend auszuweiten.
- source_word: τότε καὶ ὑμεῖς
  choice: dann werdet auch ihr
  rationale: „Dann“ wahrt die zeitliche Folge, während „auch ihr“ sowohl καί als auch die Betonung des ausdrücklich gesetzten Pronomens wiedergibt.
- source_word: σὺν αὐτῷ
  choice: zusammen mit ihm
  rationale: „Zusammen mit“ bringt die enge Gemeinschaft und Teilhabe deutlicher zum Ausdruck als ein bloßes „mit“, ohne zusätzliche Inhalte einzutragen.
- source_word: ἐν δόξῃ
  choice: in Herrlichkeit
  rationale: Die traditionelle und zugleich verständliche Formulierung bewahrt die Präpositionalfügung sowie ihre mögliche Bedeutung als Sphäre oder Weise des Offenbarwerdens.
theological_decisions:
- issue: Χριστός als Titel oder als eingebürgerte Namensform
  choice: der Messias
  alternative: Christus
  rationale: Der Artikel und die christologische Aussage stützen den Titelcharakter. „Messias“ übersetzt diesen, während die Fußnote die kirchlich geläufige Form „Christus“ zugänglich hält.
- issue: Identifikation des Messias mit dem Leben der Glaubenden
  choice: knappe Apposition „euer Leben“
  alternative: Relativsatz „der euer Leben ist“
  rationale: Die Apposition folgt der griechischen Form und bewahrt die verdichtete theologische Aussage. Der Relativsatz wäre eindeutiger, würde die Syntax jedoch stärker auslegen.
- issue: Verhältnis zwischen dem Offenbarwerden des Messias und dem der Glaubenden
  choice: dasselbe Verb an beiden Stellen
  alternative: „erscheint … werdet sichtbar werden“
  rationale: Die Wiederholung macht die im Text angelegte Entsprechung und gemeinsame Herrlichkeit sichtbar, ohne Art oder Ursache dieser Teilhabe näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Apposition „euer Leben“ erhält die Dichte des Ausgangstextes; die Wiederholung von „offenbar werden“ wahrt bewusst dessen sprachliche und theologische Parallelität.
