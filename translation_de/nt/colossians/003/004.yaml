  source_fidelity: Der Text gibt die Zukunftsbedingung von ὅταν, den Titel ὁ Χριστός, die verdichtete Apposition ἡ ζωὴ ὑμῶν, die hervorgehobene Einbeziehung „auch ihr“, σύν αὐτῷ sowie die zweimalige Verwendung von φανερόω zuverlässig wieder. „Offenbar wird … offenbar werden“ wahrt die im Griechischen bestehende Verbparallele und den passiven Ausdruck.
