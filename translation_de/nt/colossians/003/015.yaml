  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: de
  text: Und der Frieden des Messias[a] soll in euren Herzen regieren[b]. Zu diesem Frieden seid ihr auch in einem einzigen Leib berufen worden[c]. Und seid dankbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christi«. Das griechische Χριστός bezeichnet den »Gesalbten« und kann als Titel mit »Messias« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb kann auch bedeuten: »als Schiedsrichter entscheiden«; der Frieden des Messias soll also bestimmend sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Möglicherweise auch: »in einen einzigen Leib hinein«. Diese Wiedergabe hebt die Eingliederung in einen einzigen gemeinschaftlichen Leib stärker hervor; der griechische Wortlaut lautet unmittelbar »in einem einzigen Leib«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: Frieden
  rationale: Die übliche und im paulinischen Zusammenhang natürliche Wiedergabe; sie umfasst hier besonders den gemeinschaftlichen Frieden unter Gottes Heilshandeln.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat hier den Sinn eines Titels („der Gesalbte“). „Messias“ bewahrt diesen Titelcharakter im modernen Deutschen; die traditionelle Wiedergabe „Christus“ wird in einer Fußnote genannt.
- source_word: βραβευέτω
  choice: soll ... regieren
  rationale: Die Form ist ein Imperativ und bezeichnet ein bestimmendes, entscheidendes Wirken. „Regieren“ ist im Deutschen klar und würdig; das Bild des Schiedsrichters wird als lexikalische Alternative erläutert.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Die geläufige biblische Wendung bezeichnet das innere Leben, Denken, Wollen und Empfinden. Der Plural des griechischen Textes bleibt erhalten.
- source_word: εἰς ἣν
  choice: zu diesem Frieden
  rationale: Das Relativpronomen verweist auf den Frieden zurück und bezeichnet ihn als Ziel der Berufung. Die Wiederaufnahme mit dem Substantiv ist im Deutschen eindeutiger und natürlicher als „zu dem“.
- source_word: καὶ ἐκλήθητε
  choice: seid ihr ja ... berufen worden
  rationale: Das adverbiale καί verstärkt hier die Aussage; „ja“ gibt diese bestätigende Betonung idiomatisch wieder. Das Passiv der Berufung bleibt erhalten.
- source_word: ἐν ἑνὶ σώματι
  choice: in einem einzigen Leib
  rationale: Die direkte Wiedergabe bewahrt das paulinische Leibbild und macht mit „einzigen“ die betonte Einheit deutlich, ohne den Leib ausdrücklich als Gemeinde auszulegen.
- source_word: εὐχάριστοι γίνεσθε
  choice: seid dankbar
  rationale: Die knappe Aufforderung gibt den resultativen Sinn von γίνεσθε in natürlichem Deutsch wieder; „dankbar“ entspricht εὐχάριστοι.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi / des Christus
  rationale: Die Hauptfassung macht den Titelcharakter von Χριστός sichtbar, ohne zusätzliche christologische Aussagen einzutragen. Die im deutschen kirchlichen Sprachgebrauch traditionelle Form bleibt als Alternative dokumentiert.
- issue: Bedeutung des einen Leibes
  choice: Das Bild bleibt als „in einem einzigen Leib“ unaufgelöst stehen.
  alternative: Explizite Deutung als Gemeinde oder Wiedergabe „in einen einzigen Leib hinein“
  rationale: Der Zusammenhang legt die gemeinschaftliche Einheit nahe, doch der Text nennt die Gemeinde hier nicht ausdrücklich. Daher wird die Metapher nicht erläuternd erweitert; auch die mögliche Zielrichtung der Präposition wird in der Fußnote bewahrt.
- issue: Funktion des Friedens
  choice: Der Frieden soll „regieren“.
  alternative: Der Frieden soll als Schiedsrichter entscheiden.
  rationale: Das Verb trägt ein Bild des Entscheidens oder schiedsrichterlichen Bestimmens. „Regieren“ vermittelt die leitende Funktion natürlich, ohne das im Deutschen leicht missverständliche Bild im Haupttext zu erzwingen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die kurzen Aufforderungen und das paulinische Bild vom Leib bleiben erhalten. „Messias“ macht den Titelcharakter sichtbar; traditionelle und lexikalisch mögliche Alternativen werden knapp in Fußnoten dokumentiert.
