id: COL.3.2
reference: Colossians 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: de
  text: Richtet euren Sinn auf das, was oben ist,[a] nicht auf das, was auf der Erde ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denkt an das, was oben ist.« Das griechische Verb umfasst nicht nur das Denken, sondern auch die Ausrichtung der Gesinnung und des inneren Strebens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf die irdischen Dinge«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: das, was oben ist
  rationale: Der substantivierte Ausdruck bezeichnet die Wirklichkeiten oder Dinge oben. Die Formulierung bewahrt den räumlichen Gegensatz zu dem, was auf der Erde ist, und klingt zugleich natürlich auf Deutsch.
- source_word: φρονεῖτε
  choice: Richtet euren Sinn auf
  rationale: 'Das Verb bezeichnet mehr als bloßes Nachdenken: Es umfasst die Ausrichtung von Denken, Haltung und innerem Streben. Der Präsensimperativ legt eine fortdauernde Orientierung nahe.'
- source_word: μὴ
  choice: nicht
  rationale: Die Negation stellt die beiden Bezugsbereiche des gebotenen Denkens unmittelbar einander gegenüber.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: das, was auf der Erde ist
  rationale: Die substantivische Formulierung bildet das Gegenstück zu »das, was oben ist« und erhält den konkreten räumlichen Kontrast des griechischen Textes.
- source_word: γῆς
  choice: Erde
  rationale: Im kosmischen Gegensatz zu »oben« ist die Erde gemeint, nicht ein bestimmtes Land oder Gebiet.
theological_decisions:
- issue: Tragweite der Aufforderung φρονεῖτε
  choice: Eine Aufforderung, Denken, Haltung und innere Ausrichtung auf die Wirklichkeiten oben zu richten
  alternative: Eine engere Aufforderung, lediglich gedanklich über den Himmel nachzudenken
  rationale: Das Bedeutungsspektrum von φρονέω umfasst Denkweise, Gesinnung und Ausrichtung. »Richtet euren Sinn auf« bewahrt diese ethische und geistliche Weite, ohne zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sinn« wird hier im Sinn von Denkweise und innerer Ausrichtung gebraucht. Die parallele Form »das, was … ist« erhält den Gegensatz zwischen oben und Erde.
