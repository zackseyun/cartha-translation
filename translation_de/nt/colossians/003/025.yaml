  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: de
  text: Denn wer Unrecht tut, wird zurückbekommen, was er an Unrecht getan hat; und es gibt keine Parteilichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Bevorzugung“; wörtlich: „kein Ansehen der Person“. Gemeint ist, dass äußere Stellung oder Status nicht berücksichtigt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Denn wer Unrecht tut
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden Menschen, der Unrecht tut. Die Formulierung ist natürlich, geschlechtsübergreifend und bewahrt mit „Denn“ die begründende Funktion von γάρ.
- source_word: κομίσεται
  choice: wird zurückbekommen
  rationale: Das Futur von κομίζω bezeichnet hier den Empfang dessen, was einem aufgrund des eigenen Handelns zukommt. „Zurückbekommen“ bewahrt den Vergeltungsbezug, ohne ausdrücklich eine im Griechischen nicht genannte handelnde Instanz einzuführen.
- source_word: ὃ ἠδίκησεν
  choice: was er an Unrecht getan hat
  rationale: Die Wendung nimmt die begangene unrechte Tat beziehungsweise die begangenen unrechten Taten auf und hält die Wiederholung des Wortfeldes ἀδικέω/Unrecht fest.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: es gibt kein Ansehen der Person
  rationale: Die feste deutsche Wendung gibt προσωπολημψία als Bevorzugung oder Benachteiligung aufgrund der äußeren Stellung wieder und passt zum würdevollen biblischen Register.
theological_decisions:
- issue: Art und Zeitpunkt der Vergeltung
  choice: 'Die Aussage bleibt ein allgemeiner Grundsatz: Wer Unrecht tut, empfängt das begangene Unrecht zurück.'
  alternative: Die Aussage ausdrücklich allein auf das Endgericht oder allein auf das Verhältnis zwischen Herren und Sklaven beziehen.
  rationale: Der griechische Wortlaut nennt weder Mechanismus noch Zeitpunkt ausdrücklich. Die Übersetzung bewahrt daher die offene Reichweite der Warnung.
- issue: Unparteilichkeit
  choice: „kein Ansehen der Person“ bezeichnet ein Urteil ohne Rücksicht auf Rang oder äußere Stellung.
  alternative: Die Aussage ausdrücklich auf Gottes Unparteilichkeit festlegen.
  rationale: Im Zusammenhang ist Gottes Gericht naheliegend, doch im Satz wird Gott nicht ausdrücklich genannt. Die Übersetzung ergänzt kein Subjekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ansehen der Person“ ist eine etablierte, noch verständliche Wendung; die Fußnote erklärt ihre Bedeutung. Das generische griechische Maskulinum wird im Hauptsatz natürlich mit „wer“ wiedergegeben; das anschließende „er“ entspricht dem singularischen Bezug.
