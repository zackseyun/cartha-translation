id: COL.3.10
reference: Colossians 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: de
  text: und den neuen Menschen[a] angezogen habt, der zur Erkenntnis[b] erneuert wird, nach dem Bild dessen, der ihn erschaffen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »das neue Selbst«.
    reason: lexical_alternative
  - marker: b
    text: Oder »zur vollen Erkenntnis«. Das griechische Wort kann eine vollere oder vertiefte Erkenntnis bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: angezogen habt
  rationale: Das Partizip Aorist führt die Metapher des An- und Ausziehens aus dem Zusammenhang fort. Die finite Form schließt sich im Deutschen natürlich an den vorausgehenden Satzbau an und bezeichnet das vollzogene Anziehen.
- source_word: τὸν νέον
  choice: den neuen Menschen
  rationale: Das substantivierte Adjektiv nimmt im Kontext den Gegensatz zum »alten Menschen« auf. »Mensch« bewahrt diesen anthropologischen und möglicherweise gemeinschaftlichen Bezug und ist im Deutschen nicht auf Männer beschränkt.
- source_word: ἀνακαινούμενον
  choice: der … erneuert wird
  rationale: Das Präsenspartizip Passiv bezeichnet einen fortdauernden Erneuerungsvorgang; die deutsche Relativsatzkonstruktion erhält das Passiv und klingt natürlich.
- source_word: εἰς ἐπίγνωσιν
  choice: zur Erkenntnis
  rationale: »Zur« gibt die durch εἰς bezeichnete Zielrichtung der Erneuerung wieder. ἐπίγνωσις kann Erkenntnis beziehungsweise volle oder vertiefte Erkenntnis meinen; die stärkere Nuance bleibt in der Fußnote sichtbar.
- source_word: κατ’ εἰκόνα
  choice: nach dem Bild
  rationale: Die Formulierung drückt Übereinstimmung mit einem Vorbild aus und bewahrt zugleich den möglichen Anklang an die Schöpfung des Menschen nach Gottes Bild.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: dessen, der ihn erschaffen hat
  rationale: Die substantivierte Partizipialform bezeichnet den Schöpfer. Das maskuline »ihn« nimmt »den neuen Menschen« auf und entspricht dem grammatischen Bezug von αὐτόν.
theological_decisions:
- issue: Wiedergabe von τὸν νέον im anthropologischen Zusammenhang
  choice: den neuen Menschen
  alternative: das neue Selbst
  rationale: Im Deutschen ist »der Mensch« generisch und bewahrt den biblischen Gegensatz zwischen altem und neuem Menschen deutlicher als »Selbst«. Ob der Ausdruck vorwiegend individuell oder auch gemeinschaftlich zu verstehen ist, wird nicht festgelegt.
- issue: Bedeutungsstärke von ἐπίγνωσις
  choice: Erkenntnis
  alternative: volle Erkenntnis
  rationale: Die Wortbildung und der paulinische Gebrauch können eine volle oder vertiefte Erkenntnis nahelegen, doch wäre »volle« im Haupttext eine interpretierende Verstärkung. Die mögliche Nuance wird daher in einer Fußnote genannt.
- issue: Zielrichtung der Erneuerung in εἰς ἐπίγνωσιν
  choice: zur Erkenntnis
  alternative: in der Erkenntnis
  rationale: εἰς bezeichnet hier am ehesten Ziel oder Ergebnis des Erneuerungsvorgangs. »In der Erkenntnis« wäre idiomatisch, könnte die dynamische Zielrichtung jedoch abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Kleidungsmetapher sowie der fortdauernde passive Erneuerungsvorgang bleiben erhalten. »Neuer Mensch« ist im Deutschen geschlechtsübergreifend verständlich und wahrt den unmittelbaren Gegensatz zum alten Menschen.
