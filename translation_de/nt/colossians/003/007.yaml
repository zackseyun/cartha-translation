translation:
  language: de
  text: In diesen Dingen seid auch ihr einst euren Weg gegangen[a], als ihr darin lebtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „In welchen Dingen auch ihr einst euren Weg gegangen seid.“ Das griechische Relativpronomen nimmt die zuvor genannten Verhaltensweisen wieder auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Darin
  rationale: Das Relativpronomen im Dativ Plural verweist auf die zuvor genannten Verhaltensweisen. „Darin“ gibt den Rückbezug knapp und natürlich wieder, ohne den Bezug über das Griechische hinaus festzulegen.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Das καί zusammen mit dem ausdrücklich gesetzten Pronomen ὑμεῖς betont, dass auch die Kolosser früher an dieser Lebensweise teilhatten.
- source_word: περιεπατήσατε
  choice: seid … euren Weg gegangen
  rationale: Die Formulierung bewahrt das paulinische Bild des Gehens als Bezeichnung für die Lebensführung und unterscheidet es zugleich von ἐζῆτε.
- source_word: ποτε
  choice: einst
  rationale: „Einst“ bezeichnet knapp und in würdigem Gegenwartsdeutsch eine frühere, nun vergangene Zeit.
- source_word: ὅτε
  choice: als
  rationale: „Als“ leitet im Deutschen natürlich den einmaligen früheren zeitlichen Rahmen ein.
- source_word: ἐζῆτε
  choice: lebtet
  rationale: Das Imperfekt bezeichnet einen andauernden Zustand in der Vergangenheit. „Lebtet“ erhält den Unterschied zum bildhaften περιπατέω.
- source_word: ἐν τούτοις
  choice: darin
  rationale: Das Demonstrativpronomen verweist erneut auf die zuvor genannten Dinge beziehungsweise Verhaltensweisen; „darin“ ist idiomatisch und bewahrt die Vorstellung einer Lebenssphäre.
theological_decisions:
- issue: Verhältnis von „den Weg gehen“ und „leben“ in der ethischen Beschreibung
  choice: 'Die beiden griechischen Verben werden unterschieden: frühere Lebensführung („euren Weg gegangen“) und frühere Lebenssphäre („darin lebtet“).'
  alternative: Beide Verben annähernd synonym mit „leben“ wiedergeben.
  rationale: Die Unterscheidung folgt περιπατέω und ζάω und bewahrt die mehrschichtige Aussage des Verses, ohne eine zusätzliche Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bewahrt die Weg-Metapher von περιπατέω, vermeidet aber das im Deutschen missverständliche bloße „wandeln“. Die Fußnote erhält die echte Bezugsambiguität des maskulinischen beziehungsweise neutralen Dativs Plural ἐν οἷς im Kontext.
