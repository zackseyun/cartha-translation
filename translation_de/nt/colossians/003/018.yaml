source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: de
  text: Ihr Frauen, ordnet euch euren Männern unter, wie es sich im Herrn gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es sich im Herrn gehörte“. Die griechische Verbform steht im Imperfekt, hat hier aber wahrscheinlich einen allgemeinen präsentischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: ihr Frauen
  rationale: Im Zusammenhang der Haustafel und in Verbindung mit ἀνδράσιν bezeichnet γυνή Ehefrauen. Die deutsche Anrede „ihr Frauen“ ist idiomatisch und wird durch „euren Männern“ eindeutig ehelich bestimmt.
- source_word: ὑποτάσσεσθε
  choice: ordnet euch … unter
  rationale: Die mediale Form des Präsensimperativs wird natürlich und mit erkennbarer Eigenbeteiligung wiedergegeben; „unterwerfen“ wäre im heutigen Deutsch unnötig hart und könnte Fremdzwang nahelegen.
- source_word: ἀνδράσιν
  choice: euren Männern
  rationale: In diesem häuslichen Kontext bedeutet ἀνήρ „Ehemann“. Das Possessivpronomen gibt die relationale Bedeutung im Deutschen natürlich wieder.
- source_word: ὡς
  choice: wie
  rationale: ὡς führt hier den Maßstab beziehungsweise die Angemessenheit ein, nicht eindeutig einen Grund.
- source_word: ἀνῆκεν
  choice: es sich gehört
  rationale: Obwohl die Form morphologisch Imperfekt ist, hat sie in dieser allgemeinen paränetischen Aussage wahrscheinlich präsentischen Sinn. Die Wendung ist natürlich und bewahrt die Bedeutung „angemessen/gehörig sein“.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die feste paulinische Wendung wird knapp und formal nah wiedergegeben. Sie verankert die Angemessenheit der Aufforderung in der Beziehung zum Herrn.
theological_decisions:
- issue: Reichweite und Begründung der Aufforderung
  choice: „wie es sich im Herrn gehört“ lässt die Aufforderung durch die Zugehörigkeit zum Herrn qualifiziert.
  alternative: Die Aufforderung als uneingeschränkte gesellschaftliche Regel wiederzugeben oder „im Herrn“ ausschließlich auf die Frauen zu beziehen.
  rationale: Die Stellung von ἐν κυρίῳ bei ἀνῆκεν spricht dafür, dass die Angemessenheit im Herrn bestimmt wird. Die Übersetzung bewahrt diese theologische Begrenzung, ohne sie kommentierend auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ordnet euch … unter“ ist verständlich und formal näher am Griechischen als stärkere Ausdrücke wie „unterwerft euch“. Die traditionelle, aber weiterhin geläufige Wendung „im Herrn“ bleibt erhalten.
