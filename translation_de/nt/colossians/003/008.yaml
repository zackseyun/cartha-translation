id: COL.3.8
reference: Colossians 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: de
  text: 'Doch jetzt legt auch ihr das alles ab: Zorn, Wut, Bosheit, Lästerung und schändliches Reden aus eurem Mund.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: legt … ab
  rationale: Das Bild vom Ablegen wird bewahrt und knüpft an den unmittelbaren Kontext an; die Aufforderung bleibt deutlich.
- source_word: ὀργήν
  choice: Zorn
  rationale: Bezeichnet Zorn als Haltung oder anhaltenden Gemütszustand und lässt sich vom folgenden θυμός unterscheiden.
- source_word: θυμόν
  choice: Wut
  rationale: Gibt die stärker aufwallende, leidenschaftliche Seite des Zorns natürlich wieder, ohne eine zu präzise psychologische Unterscheidung zu behaupten.
- source_word: κακίαν
  choice: Bosheit
  rationale: Erfasst die moralisch böse Gesinnung beziehungsweise Schlechtigkeit in knapper, verständlicher Form.
- source_word: βλασφημίαν
  choice: Lästerung
  rationale: Der Kontext betrifft schädliches Reden; „Lästerung“ bewahrt die Breite des griechischen Wortes zwischen Schmähung, Verleumdung und gotteslästerlicher Rede.
- source_word: αἰσχρολογίαν
  choice: schändliches Reden
  rationale: Gibt anstößige, beschämende oder unanständige Rede breiter wieder als nur „Schimpfwörter“ oder „Obszönitäten“.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: aus eurem Mund
  rationale: Bewahrt die konkrete Ausdrucksweise des Ausgangstextes und bezieht sich natürlich auf die beiden zuletzt genannten Redeweisen.
theological_decisions:
- issue: Bedeutungsumfang von βλασφημία
  choice: Lästerung
  alternative: Verleumdung / Schmähung
  rationale: Das griechische Wort kann ehrverletzende Rede gegen Menschen wie auch Lästerung gegen Gott bezeichnen. Die Übersetzung hält diese Offenheit fest, statt den Bezug einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp und rhythmisch; das Bild des Ablegens sowie die körpernahe Wendung „aus eurem Mund“ werden erhalten.
