  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: de
  text: Ertragt einander und vergebt euch gegenseitig, wenn jemand einem anderen etwas vorzuwerfen hat[a]. Wie der Herr euch vergeben hat, so vergebt auch ihr[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn jemand gegen einen anderen eine Klage hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen am Schluss nur: „so auch ihr“; das Verb „vergebt“ wird aus dem Zusammenhang ergänzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: Ertragt
  rationale: Das Verb bezeichnet hier das fortdauernde geduldige Tragen und Aushalten anderer innerhalb der Gemeinschaft. „Ertragt“ ist knapp, würdig und weniger umgangssprachlich als „Haltet einander aus“.
- source_word: ἀλλήλων
  choice: einander
  rationale: Die übliche reziproke Wiedergabe passt natürlich zum gemeinschaftsbezogenen Sinn.
- source_word: χαριζόμενοι
  choice: vergebt
  rationale: Im Zusammenhang mit zwischenmenschlichen Vorwürfen bedeutet χαρίζομαι, eine Verfehlung aus Gnade zu erlassen. „Vergebt“ gibt dies klar wieder und bewahrt die semantische Verbindung zum späteren ἐχαρίσατο.
- source_word: ἑαυτοῖς
  choice: euch gegenseitig
  rationale: 'Obwohl die Form reflexiv ist, hat sie hier reziproke Bedeutung: Die Mitglieder der Gemeinschaft sollen einander vergeben.'
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: wenn jemand einem anderen etwas vorzuwerfen hat
  rationale: Diese idiomatische deutsche Formulierung wahrt die allgemeine, unbestimmte Bedingung und den Gedanken eines bestehenden Anlasses zur Beanstandung, ohne daraus eine förmliche Anklage zu machen.
- source_word: καθὼς καὶ
  choice: Wie auch
  rationale: Die Formulierung erhält den Vergleich zwischen der vorausgehenden Vergebung des Herrn und dem Verhalten der Angesprochenen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: „Herr“ ist die angemessene Wiedergabe des christologischen Titels κύριος, ohne den im griechischen Text nicht ausdrücklich genannten Referenten im Haupttext weiter festzulegen.
- source_word: ἐχαρίσατο
  choice: vergeben hat
  rationale: Das Perfekt im Deutschen gibt die vorausliegende, für die Ermahnung maßgebliche Vergebung idiomatisch wieder und hält die Wortverbindung zu „vergebt“ sichtbar.
- source_word: οὕτως καὶ ὑμεῖς
  choice: so auch ihr
  rationale: Die knappe deutsche Ellipse entspricht der griechischen Formulierung; die Handlung „vergeben“ ist aus dem unmittelbaren Zusammenhang eindeutig zu ergänzen.
theological_decisions:
- issue: Bezug von ὁ κύριος
  choice: Die Übersetzung bleibt bei „der Herr“; im Kontext ist Christus am wahrscheinlichsten gemeint.
  alternative: Der Titel kann allgemeiner auf Gott bezogen verstanden werden.
  rationale: Der paulinische Sprachgebrauch in Kolosser und das Vorbildschema des Satzes sprechen für Christus. Die titulare Übersetzung wahrt jedoch die Offenheit des griechischen Wortlauts.
- issue: Ellipse im Schlusssatz
  choice: Die Ellipse wird mit „so auch ihr“ bewahrt.
  alternative: 'Das fehlende Verb kann ausdrücklich ergänzt werden: „so sollt auch ihr vergeben“.'
  rationale: Im Griechischen fehlt am Ende ein ausgesprochenes Verb. Die knappe deutsche Fassung bleibt verständlich und vermeidet, einen nicht ausdrücklich vorhandenen Modalbegriff in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aufforderungen sind direkt und gemeinschaftsbezogen formuliert; die markante Ellipse des griechischen Schlusses bleibt erhalten und wird in einer Fußnote erläutert.
