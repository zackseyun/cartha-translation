id: COL.3.12
reference: Colossians 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: de
  text: Zieht nun als Gottes Erwählte, Heilige und Geliebte, herzliches Erbarmen[a], Güte, Demut, Sanftmut[b] und Geduld[c] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das Innerste des Erbarmens“; gemeint ist tief empfundenes Mitgefühl.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Milde“.'
    reason: lexical_alternative
  - marker: c
    text: Auch im Sinn von Langmut gegenüber anderen.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: Zieht … an
  rationale: Der Aorist-Medium-Imperativ wird bildlich gebraucht. „Zieht … an“ bewahrt die Kleidungsmetapher und ist im Deutschen natürlich verständlich.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ markiert den folgernden Anschluss an die vorherige Ermahnung, ohne unnötig schwer zu klingen.
- source_word: ὡς
  choice: als
  rationale: '„Als“ bewahrt den Bezug auf die Identität der Angesprochenen: Ihr Verhalten soll dem entsprechen, was sie als Gottes Erwählte sind.'
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: Gottes Erwählte
  rationale: Die Wendung wahrt sowohl das Erwähltsein als auch Gottes Initiative, ohne eine bestimmte systematische Lehre über die Erwählung einzutragen.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: Heilige und Geliebte
  rationale: Die substantivierten Adjektive entsprechen der griechischen Apposition und bewahren die Identitätsaussagen. „Geliebte“ gibt den bleibenden Status des Perfektpartizips wieder.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: herzliches Erbarmen
  rationale: Wörtlich ist von den inneren Organen beziehungsweise dem Innersten des Erbarmens die Rede. „Herzliches Erbarmen“ vermittelt idiomatisch tief empfundenes Mitgefühl und wahrt stärker als bloßes „Erbarmen“ die Intensität des Ausdrucks.
- source_word: χρηστότητα
  choice: Güte
  rationale: „Güte“ bezeichnet hier die wohlwollende, anderen zugewandte Haltung und passt natürlich in die Reihe der Tugenden.
- source_word: ταπεινοφροσύνην
  choice: Demut
  rationale: „Demut“ ist die geläufige und präzise moderne Wiedergabe der demütigen Gesinnung.
- source_word: πραΰτητα
  choice: Sanftmut
  rationale: „Sanftmut“ bewahrt den ethischen Gehalt von πραΰτης und bezeichnet keine Schwäche, sondern eine milde, beherrschte Haltung.
- source_word: μακροθυμίαν
  choice: Geduld
  rationale: Im Zusammenhang zwischenmenschlicher Tugenden bezeichnet das Wort lang anhaltende Geduld gegenüber anderen; „Geduld“ ist die klare, natürliche Wiedergabe.
theological_decisions:
- issue: Erwählungssprache in ἐκλεκτοὶ τοῦ θεοῦ
  choice: Gottes Erwählte
  alternative: die von Gott Erwählten / Gottes auserwähltes Volk
  rationale: Der Vers benennt die Adressaten als von Gott erwählt, erklärt aber weder Art noch Ablauf der Erwählung. Die gewählte Form wahrt diese Aussage, ohne sie konfessionell auszudeuten.
- issue: Identitätsaussagen ἅγιοι καὶ ἠγαπημένοι
  choice: Heilige und Geliebte
  alternative: heilig und geliebt
  rationale: Die appositionelle Form lässt offen, ob die Ausdrücke stärker als Bezeichnungen oder Eigenschaften gehört werden, und bewahrt zugleich die theologische Würde der Aussage.
- issue: Bedeutungsumfang von πραΰτης
  choice: Sanftmut
  alternative: Milde / Freundlichkeit
  rationale: „Sanftmut“ hält die Spannung zwischen Milde und beherrschter Stärke fest, ohne die Tugend auf bloße Freundlichkeit zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung „Zieht … an“ umfasst die gesamte Tugendreihe und erhält die griechische Kleidungsmetapher. Die appositionelle Folge „Gottes Erwählte, Heilige und Geliebte“ bleibt bewusst knapp und feierlich.
