source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: de
  text: 'Das Wort des Messias wohne reichlich in euch[a]: Lehrt und ermahnt einander in aller Weisheit mit Psalmen, Hymnen und geistlichen Liedern. Singt in euren Herzen in Gnade[b] zu Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Euch“ steht im Griechischen im Plural. Gemeint sein kann, dass das Wort in der Gemeinschaft als Ganzer oder in den einzelnen Glaubenden wohnt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Dankbarkeit“. Der griechische Ausdruck kann Gnade, eine von Gnade geprägte Haltung oder Dankbarkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: das Wort des Messias
  rationale: „Wort“ bewahrt die Breite von λόγος; „des Messias“ gibt den Titel Χριστός wieder und lässt offen, ob Herkunft oder Inhalt im Vordergrund steht.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: wohne reichlich in euch
  rationale: Die Wohnmetapher und der fortdauernde Aufforderungscharakter bleiben erhalten. „In euch“ entspricht der griechischen Präposition direkt; der Plural kann gemeinschaftlich oder individuell verstanden werden.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: in aller Weisheit
  rationale: Die formnahe Wiedergabe bewahrt die syntaktische Offenheit, ob die Wendung stärker zum Wohnen oder zum Lehren und Ermahnen gehört.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: Lehrt und ermahnt einander
  rationale: Die Partizipien werden als natürliche deutsche Aufforderungen wiedergegeben; das pluralische Reflexivpronomen bezeichnet hier wechselseitiges Handeln.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: mit Psalmen, Hymnen und geistlichen Liedern
  rationale: Die drei musikalischen Bezeichnungen bleiben unterschieden; der Dativ wird instrumental mit „mit“ wiedergegeben.
- source_word: ἐν χάριτι
  choice: mit Gnade
  rationale: Die formnahe Übersetzung bewahrt die mögliche Bedeutung von Gnade beziehungsweise gnädiger Haltung; die ebenfalls gut mögliche Bedeutung „mit Dankbarkeit“ steht in der Fußnote.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: Singt in euren Herzen … für Gott
  rationale: „In euren Herzen“ folgt dem griechischen Ausdruck; „für Gott“ gibt den Empfänger des Singens in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Χριστός fungiert hier als messianischer Titel. „Messias“ macht dessen Bedeutung sichtbar, ohne den Genitiv in „von“ oder „über“ aufzulösen.
- issue: Gemeinschaftliche oder individuelle Bedeutung von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: „In euch“ entspricht dem griechischen Ausdruck unmittelbar und bewahrt im Deutschen sowohl die gemeinschaftliche als auch die persönliche Lesart; eine Fußnote benennt diese Spannung.
- issue: Bezug von ἐν πάσῃ σοφίᾳ
  choice: durch die Satzstellung beim Lehren und Ermahnen belassen
  alternative: eindeutig auf das Wohnen des Wortes beziehen
  rationale: Der griechische Satz lässt den syntaktischen Bezug offen. Die Übersetzung vermeidet eine dogmatische Festlegung.
- issue: Bedeutung von ἐν χάριτι
  choice: mit Gnade
  alternative: mit Dankbarkeit
  rationale: χάρις kann hier Gnade, eine von Gnade geprägte Haltung oder Dankbarkeit bezeichnen. Haupttext und Fußnote erhalten diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Imperative ergeben einen klaren und natürlichen deutschen Satz, während die griechische Gedankenführung erhalten bleibt. „Hymnen“ ist geläufiger als das altertümlichere „Lobgesänge“ und wahrt die Unterscheidung der drei Liedbegriffe.
