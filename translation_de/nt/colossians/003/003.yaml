  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: de
  text: Denn ihr seid gestorben, und euer Leben ist mit dem Messias[a] in Gott verborgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Christus“. Der griechische Titel Χριστός kann mit „Messias“ oder „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Das griechische Perfekt kann einen gegenwärtigen Zustand als Ergebnis eines abgeschlossenen Geschehens ausdrücken; wörtlicher auch: „ist verborgen worden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: ihr seid gestorben
  rationale: Der Aorist bezeichnet hier den entscheidenden Tod der Glaubenden in der Vergangenheit. Das deutsche Perfekt gibt dies in natürlichem modernem Deutsch wieder, ohne die Aussage auszudeuten.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung und wird knapp und idiomatisch mit „denn“ wiedergegeben.
- source_word: ἡ ζωὴ ὑμῶν
  choice: euer Leben
  rationale: Die schlichte Wiedergabe bewahrt die Bildsprache und vermeidet eine erklärende Erweiterung.
- source_word: κέκρυπται
  choice: ist verborgen
  rationale: Das griechische Perfekt Passiv bezeichnet einen gegenwärtigen Zustand als Ergebnis eines vorausgegangenen Geschehens. „Ist verborgen“ ist dafür im Deutschen natürlich und präzise.
- source_word: σὺν τῷ Χριστῷ
  choice: mit dem Messias
  rationale: σύν bezeichnet Gemeinschaft beziehungsweise Verbundenheit. Χριστός wird als Titel verstanden und daher bedeutungstragend mit „Messias“ wiedergegeben.
- source_word: ἐν τῷ θεῷ
  choice: in Gott
  rationale: Die Formulierung erhält die lokale beziehungsweise sphärische Aussage von ἐν und bewahrt die theologische Spannung des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von Χριστῷ als Titel oder als namensähnliche Form
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός bezeichnet den Gesalbten und ist hier als Titel sinnvoll erkennbar zu machen. Die geläufige kirchliche Form „Christus“ bleibt als mögliche Wiedergabe in der Fußnote genannt.
- issue: Zeitliche und aspektuelle Kraft von κέκρυπται
  choice: ist verborgen
  alternative: ist verborgen worden
  rationale: Das griechische Perfekt verbindet ein vorausgegangenes Geschehen mit einem fortbestehenden Zustand. Der Haupttext betont idiomatisch den gegenwärtigen Zustand; die Fußnote weist auf die resultative Nuance hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, während „ihr seid gestorben“ und „ist verborgen“ idiomatisches Deutsch bieten. Die ungewöhnliche, theologisch dichte Wendung „mit dem Messias in Gott“ wird bewusst nicht paraphrasiert.
