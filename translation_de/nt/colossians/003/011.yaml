source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: de
  text: Wo es weder Griechen noch Juden, weder Beschnittene noch Unbeschnittene, weder Barbaren noch Skythen, weder Sklaven noch Freie gibt, sondern der Messias alles und in allen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische „in allen“ kann sich auf alle Mitglieder der erneuerten Gemeinschaft beziehen; die Formulierung kann aber auch umfassender verstanden werden, etwa: „in allem“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: Da gibt es weder … noch
  rationale: Bezieht sich auf den in Vers 10 beschriebenen erneuerten Menschen beziehungsweise Lebensbereich. Die deutsche Korrelativform gibt die kategorische Aufhebung der genannten Unterschiede natürlich wieder.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: Griechen noch Juden
  rationale: Bewahrt die konkrete ethnisch-kulturelle Gegenüberstellung des griechischen Textes, statt Ἕλλην zu dem allgemeineren „Nichtjuden“ auszuweiten.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: Beschnittene noch Unbeschnittene
  rationale: Die abstrakten griechischen Substantive bezeichnen hier Personengruppen nach ihrem religiös-sozialen Merkmal. Die personale Wiedergabe ist im Deutschen klar und fügt sich in die Reihe ein.
- source_word: βάρβαρος
  choice: Barbaren
  rationale: Bewahrt die rhetorische Schärfe und die antike kulturelle Fremdbezeichnung; „Fremde“ wäre zu allgemein und milder.
- source_word: Σκύθης
  choice: Skythen
  rationale: Gibt die konkrete Volksbezeichnung in ihrer üblichen deutschen Form wieder.
- source_word: δοῦλος
  choice: Sklaven
  rationale: Im ausdrücklichen Gegensatz zu ἐλεύθερος ist der unfreie soziale und rechtliche Status entscheidend; „Diener“ wäre zu schwach.
- source_word: ἐλεύθερος
  choice: Freie
  rationale: Ist das natürliche deutsche Gegenstück zu „Sklaven“ und bewahrt den sozialen Gegensatz.
- source_word: ἀλλὰ τὰ πάντα
  choice: sondern der Messias ist alles
  rationale: „Sondern“ markiert nach der Verneinungsreihe den starken Gegensatz. „Alles“ bewahrt die knappe und umfassende Aussage τὰ πάντα, ohne sie näher auszudeuten.
- source_word: ἐν πᾶσιν
  choice: in allen
  rationale: Bewahrt die knappe Formulierung und die im Kontext naheliegende personale Bedeutung, ohne sie durch „in allen Menschen“ ausdrücklich einzuengen.
- source_word: Χριστός
  choice: der Messias
  rationale: Gibt den Bedeutungsgehalt des griechischen Titels wieder. Der bestimmte Artikel ist im Deutschen für die titelartige Bezeichnung natürlich, auch wenn Χριστός hier ohne griechischen Artikel steht.
theological_decisions:
- issue: Reichweite von ἐν πᾶσιν
  choice: in allen
  alternative: in allem; in allen Menschen
  rationale: Der unmittelbare Zusammenhang handelt von den Mitgliedern der erneuerten Gemeinschaft, sodass ein personaler Bezug wahrscheinlich ist. Die knappe deutsche Form lässt jedoch die grammatische und theologische Weite des Griechischen bestehen.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Χριστός trägt hier titelartigen theologischen Gehalt. „Der Messias“ übersetzt diesen Titel, während „Christus“ die traditionelle Transliteration wäre.
- issue: Statusbezeichnung δοῦλος
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Die Gegenüberstellung mit „Freie“ macht den sozialen Unfreiheitsstatus ausdrücklich; daher ist „Sklaven“ sachlich am genauesten.
- issue: Bedeutung von τὰ πάντα
  choice: ist alles
  alternative: ist alles in allem; bedeutet alles
  rationale: Die wörtlich knappe Prädikation lässt offen, wie die umfassende Bedeutung des Messias näher zu bestimmen ist. Erläuternde Zusätze würden diese Spannung unzulässig festlegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Form „weder … noch“ macht die Aufzählung für heutige Leser klar, ohne ihre rhetorische Wucht abzuschwächen. Historische Gruppenbezeichnungen bleiben erhalten; potenziell erklärungsbedürftige Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
