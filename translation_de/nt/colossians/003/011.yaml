  naturalness: Die wiederholte Korrelativform „weder … noch“ ist in modernem Standarddeutsch klar und würdevoll. Mit „Wo es … gibt“ ist der Satzanschluss an den vorangehenden Kontext idiomatischer und präziser.
  terminology: „Griechen“, „Juden“, „Barbaren“, „Skythen“, „Sklaven“ und „Freie“ sind treffend. „Der Messias“ gibt Χριστός gemäß der vorgegebenen Titelentscheidung wieder. Die personale Wiedergabe „Beschnittene/Unbeschnittene“ ist im Deutschen natürlich und kontextuell vertretbar.
