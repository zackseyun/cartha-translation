id: COL.3.17
reference: Colossians 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: de
  text: Und was immer ihr tut, sei es in Wort oder Tat, tut alles im Namen des Herrn Jesus[a] und dankt dabei Gott, dem Vater, durch ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Im Namen“ kann hier auch bedeuten: „unter seiner Vollmacht“ oder „als seine Vertreter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: alles, was ihr tut
  rationale: Die Verbindung bezeichnet umfassend und unbestimmt alles Handeln. „Alles, was ihr tut“ ist im Deutschen natürlich und bewahrt die uneingeschränkte Weite.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: in Wort oder Tat
  rationale: Die knappe, ausgewogene Wortverbindung umfasst sprachliches und praktisches Handeln. „Wort oder Tat“ ist verständlich und würdevoll.
- source_word: πάντα
  choice: alles
  rationale: Das Wort greift die vorausgehende umfassende Formulierung zusammenfassend auf und verstärkt ihren Totalitätsanspruch.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: im Namen des Herrn Jesus
  rationale: Die unmittelbare Wiedergabe bewahrt die Bedeutungsweite des biblischen Ausdrucks, einschließlich Vollmacht, Repräsentation und Zugehörigkeit.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος ist hier ein christologischer Titel; „Herr“ entspricht dem neutestamentlichen Sprachgebrauch und bewahrt dessen theologisches Gewicht.
- source_word: εὐχαριστοῦντες
  choice: und dankt
  rationale: Das präsentische Partizip bezeichnet ein mit dem gesamten Handeln einhergehendes Danken. Eine koordinierte deutsche Aufforderung gibt diese Beziehung natürlich und klar wieder.
- source_word: τῷ θεῷ πατρὶ
  choice: Gott, dem Vater
  rationale: πατρί steht als Apposition zu θεῷ. „Gott, dem Vater“ bildet diese grammatische Beziehung transparent ab, ohne eine zusätzliche Konjunktion einzutragen.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: Das Pronomen verweist am natürlichsten auf den unmittelbar zuvor genannten Herrn Jesus. „Durch ihn“ bewahrt die Vermittlungsaussage und die pronominale Form.
theological_decisions:
- issue: Bedeutungsumfang von „im Namen des Herrn Jesus“
  choice: Die biblische Wendung bleibt im Haupttext erhalten.
  alternative: „unter der Vollmacht des Herrn Jesus“ oder „als seine Vertreter“
  rationale: Die Wendung kann Vollmacht, Repräsentation, Zugehörigkeit und Ausrichtung einschließen. Eine ausdeutende Haupttextfassung würde diese theologische Bedeutungsweite unnötig verengen.
- issue: Bezugswort von „durch ihn“
  choice: Das Pronomen bezieht sich auf den Herrn Jesus als den, durch den der Dank an Gott, den Vater, gerichtet wird.
  alternative: Ein nur allgemein auf den vorausgehenden Satz bezogener Verweis ohne besondere christologische Aussage
  rationale: Der Herr Jesus ist das nächste und syntaktisch naheliegende Bezugswort. Die Übersetzung lässt die knappe Vermittlungsaussage des griechischen Textes unverändert stehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der Doppelpunkt macht die zusammenfassende Aufforderung deutlich; die Wiederholung von „alles“ bewahrt den rhetorischen Nachdruck des griechischen Textes. Die traditionelle Wendung „in Wort oder Tat“ bleibt wegen ihrer Klarheit und Prägnanz erhalten.
