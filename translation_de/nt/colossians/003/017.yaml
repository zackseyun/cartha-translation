revisions:
- from: 'Und alles, was ihr tut, in Wort oder Tat: Tut alles im Namen des Herrn Jesus[a] und dankt Gott, dem Vater, durch ihn.'
  to: Und was immer ihr tut, sei es in Wort oder Tat, tut alles im Namen des Herrn Jesus[a] und dankt dabei Gott, dem Vater, durch ihn.
  rationale: Die Revision glättet den Satzbau, bewahrt die doppelte Totalität von πᾶν ὅ τι ἐὰν ποιῆτε und πάντα und kennzeichnet das Danken als begleitend zum Tun. Die traditionelle und semantisch offene Wendung „im Namen des Herrn Jesus“ bleibt unverändert. Die Fußnote wird lediglich im Deutschen eindeutiger formuliert.
