source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: de
  text: 'Tötet daher die Glieder, die auf der Erde sind[a]: sexuelle Unmoral, Unreinheit, Leidenschaft, böses Verlangen und Gier[b], die Götzendienst ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „was an euch irdisch ist“. Wörtlicher spricht das Griechische von „den Gliedern, die auf der Erde sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Habsucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: Tötet
  rationale: Der Aorist-Imperativ fordert zu entschiedenem Handeln auf. „Tötet“ bewahrt die starke Todesmetapher und ist im modernen Deutsch unmittelbar verständlich.
- source_word: οὖν
  choice: daher
  rationale: Das Wort kennzeichnet die Folgerung aus dem vorangehenden Gedankengang; „daher“ stellt diese logische Verbindung knapp und natürlich her.
- source_word: μέλη
  choice: die Glieder
  rationale: „Glieder“ gibt die körperbezogene Metapher des griechischen Ausdrucks wieder, ohne sie vorschnell als „irdische Natur“ auszulegen.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: die auf der Erde sind
  rationale: Die räumliche Bildsprache des Ausgangstextes bleibt erhalten. Eine abstraktere Deutung wird in der Fußnote als Alternative genannt.
- source_word: πορνείαν
  choice: sexuelle Unmoral
  rationale: Der Ausdruck bezeichnet sexuelles Fehlverhalten in einem breiten Sinn. „Sexuelle Unmoral“ ist heute verständlicher und weniger eng als das traditionelle „Unzucht“.
- source_word: ἀκαθαρσίαν
  choice: Unreinheit
  rationale: „Unreinheit“ ist eine natürliche Wiedergabe des paulinischen Begriffs für moralische Verunreinigung und bewahrt dessen Bedeutungsbreite.
- source_word: πάθος
  choice: Leidenschaft
  rationale: „Leidenschaft“ entspricht dem Begriff unmittelbar; der negative Sinn ergibt sich hier aus der Aufzählung von Lastern, ohne dass eine erklärende Erweiterung nötig ist.
- source_word: ἐπιθυμίαν κακήν
  choice: böses Verlangen
  rationale: Die Wiedergabe bringt sowohl das Verlangen als auch dessen ausdrückliche moralische Qualifizierung durch κακήν klar zum Ausdruck.
- source_word: πλεονεξίαν
  choice: Gier
  rationale: Der Begriff bezeichnet das habgierige Streben nach immer mehr. „Gier“ ist knapp, gegenwärtig und gut verständlich; „Habsucht“ bleibt als mögliche Alternative vermerkt.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: die Götzendienst ist
  rationale: Die Formulierung bewahrt die nachdrückliche Gleichsetzung. Das feminine Singularpronomen bezieht sich grammatisch am natürlichsten auf die unmittelbar vorausgehende „Gier“.
theological_decisions:
- issue: Bezugswort von „die Götzendienst ist“
  choice: Der Relativsatz bezieht sich speziell auf die Gier.
  alternative: Der Relativsatz fasst die gesamte vorangehende Lasterliste als Götzendienst zusammen.
  rationale: Das feminine Singularpronomen ἥτις stimmt am natürlichsten mit dem unmittelbar vorausgehenden femininen Singular πλεονεξίαν überein. Die deutsche Formulierung bewahrt diesen grammatisch naheliegenden Bezug.
- issue: Deutung der „Glieder, die auf der Erde sind“
  choice: Die Metapher der Glieder bleibt im Haupttext erhalten.
  alternative: „Was an euch irdisch ist“ beziehungsweise „eure irdische Natur“.
  rationale: Der griechische Text spricht ausdrücklich von „Gliedern“. Die folgenden Akkusative können appositionell erläutern, was damit gemeint ist. Eine abstrakte Umschreibung im Haupttext würde diese Bildsprache auflösen und die Auslegung stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Gliedermetapher wurde wegen ihrer Bedeutung im griechischen Text bewusst beibehalten und durch eine Fußnote erschlossen. Die Lasterbegriffe sind verständlich formuliert, ohne ihre moralische Schärfe abzuschwächen.
