  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: de
  text: Ihr Väter, reizt eure Kinder nicht, damit sie nicht den Mut verlieren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie nicht mutlos werden“.'
    reason: Lexikalische Alternative zu ἀθυμῶσιν; sie macht den entstehenden Zustand der Entmutigung ausdrücklich.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Ihr Väter
  rationale: πατέρες bezeichnet hier ausdrücklich die Väter. Die Anrede mit „ihr“ ist im Deutschen natürlich und bewahrt den spezifischen Adressaten des griechischen Textes.
- source_word: μὴ ἐρεθίζετε
  choice: reizt ... nicht
  rationale: ἐρεθίζω bezeichnet hier ein negatives Reizen oder Provozieren. „Reizt ... nicht“ ist knapp, verständlich und lässt offen, auf welche konkrete Weise die Kinder zu einer schädlichen Reaktion gebracht werden.
- source_word: τὰ τέκνα ὑμῶν
  choice: eure Kinder
  rationale: τέκνα ist die inklusive Bezeichnung für die eigenen Kinder beziehungsweise Nachkommen; „eure Kinder“ ist die natürliche deutsche Entsprechung.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: ἵνα mit μή drückt hier Zweck beziehungsweise beabsichtigte Vermeidung einer Folge aus; „damit ... nicht“ erhält diese Beziehung klar.
- source_word: ἀθυμῶσιν
  choice: den Mut verlieren
  rationale: ἀθυμέω bezeichnet Entmutigung und das Verlieren innerer Zuversicht. Die idiomatische Wendung „den Mut verlieren“ bildet diesen Zustand prägnant ab.
theological_decisions:
- issue: Adressatenkreis von πατέρες in der Haustafel
  choice: Die Anweisung richtet sich im Wortlaut ausdrücklich an Väter.
  alternative: Die Anrede verallgemeinernd mit „Eltern“ wiederzugeben.
  rationale: Das griechische πατέρες bedeutet hier „Väter“. Eine mögliche weitergehende Anwendung soll nicht durch eine geschlechtsneutrale Übersetzung in den Text selbst eingetragen werden.
- issue: Verhältnis zwischen väterlichem Verhalten und der Entmutigung der Kinder
  choice: „damit sie nicht“ bewahrt die Zweck- beziehungsweise Folgenorientierung der Warnung.
  alternative: Eine zwingende mechanische Kausalität ausdrücklich zu formulieren.
  rationale: ἵνα μή verbindet das Verbot mit der zu vermeidenden Entmutigung, ohne alle Fragen zur genauen Art der Kausalität aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Ihr Väter“ entspricht dem Charakter der Haustafel; Satzbau und Wortwahl bleiben knapp und allgemein verständlich.
