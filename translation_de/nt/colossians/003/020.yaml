  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: de
  text: Ihr Kinder, gehorcht euren Eltern in allem, denn das ist im Herrn wohlgefällig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Herrn annehmbar“. „Im Herrn“ kann auch im Sinn von „dem Herrn“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Ihr Kinder
  rationale: τέκνα bezeichnet Kinder bzw. Nachkommen ohne Beschränkung auf Söhne. „Ihr Kinder“ gibt die direkte Anrede im modernen Deutschen natürlich wieder.
- source_word: ὑπακούετε
  choice: gehorcht
  rationale: Der Imperativ von ὑπακούω fordert in diesem Verhältnis Gehorsam bzw. Befolgung; „gehorcht“ trifft die Aussage klarer als das schwächere „hört auf“.
- source_word: τοῖς γονεῦσιν
  choice: euren Eltern
  rationale: γονεῦσιν bedeutet „Eltern“. Das im Griechischen unausgesprochene Besitzverhältnis wird im Deutschen idiomatisch durch „euren“ ausgedrückt.
- source_word: κατὰ πάντα
  choice: in allem
  rationale: 'Die Wendung bezeichnet den Umfang: „in allem“ bzw. „in jeder Hinsicht“. „In allem“ ist prägnant und vermeidet die zeitliche Bedeutung von „immer“.'
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen verweist auf den soeben gebotenen Gehorsam; im Deutschen ist „das“ hier natürlicher als „dies“.
- source_word: γὰρ
  choice: denn
  rationale: γάρ leitet die Begründung der Aufforderung ein; „denn“ bewahrt diesen Zusammenhang knapp und natürlich.
- source_word: εὐάρεστόν ἐστιν
  choice: ist wohlgefällig
  rationale: εὐάρεστος bezeichnet etwas, das Wohlgefallen findet bzw. annehmbar ist. „Wohlgefällig“ bewahrt den wertenden, auf Gott bezogenen Klang; die mögliche Wiedergabe „angemessen“ wird in der Fußnote genannt.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die wörtliche und paulinisch geläufige Wendung wahrt die mögliche Bedeutung als Beziehung oder Sphäre und verengt sie nicht zu „dem Herrn“.
theological_decisions:
- issue: Umfang von „in allem“ im Verhältnis zu „im Herrn“
  choice: Beide Wendungen werden ohne ergänzende Einschränkung wiedergegeben; „im Herrn“ steht bei der Aussage dessen, was wohlgefällig ist.
  alternative: „Im Herrn“ könnte als ausdrückliche Begrenzung des Gehorsams auf das verstanden werden, was dem Willen des Herrn entspricht, oder als „dem Herrn wohlgefällig“.
  rationale: Der griechische Satz enthält keine ausdrückliche Ausnahmeklausel und verbindet ἐν κυρίῳ grammatisch am ehesten mit εὐάρεστόν ἐστιν. Die Übersetzung erhält zugleich die weitere paulinische Bedeutung der Wendung und löst die theologische Spannung nicht durch einen Zusatz auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Ihr Kinder“ ist natürlich; „wohlgefällig“ ist leicht gehoben, aber verständlich und bewahrt die Mehrdeutigkeit von εὐάρεστος ἐν κυρίῳ.
