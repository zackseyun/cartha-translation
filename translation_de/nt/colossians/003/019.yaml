source:
  edition: SBLGNT
  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: de
  text: Ihr Männer, liebt eure Frauen und seid nicht bitter gegen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werdet nicht bitter gegen sie«; sinngemäß auch: »behandelt sie nicht hart«.'
    reason: Das griechische Verb kann ein Bitterwerden oder Verbittertsein bezeichnen und im Zusammenhang eine daraus entstehende harte, gereizte Behandlung einschließen.
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Ihr Männer
  rationale: Ἀνήρ kann »Mann« oder »Ehemann« bedeuten. Der Zusammenhang der Haustafel und »eure Frauen« zeigen, dass verheiratete Männer angesprochen sind; die natürliche deutsche Anrede lautet »Ihr Männer«.
- source_word: ἀγαπᾶτε
  choice: liebt
  rationale: Die direkte Imperativform gibt ἀγαπάω präzise und natürlich wieder.
- source_word: τὰς γυναῖκας
  choice: eure Frauen
  rationale: Γυνή kann »Frau« oder »Ehefrau« heißen. Im ehelichen Zusammenhang ist »Frauen« eindeutig relational; das Possessivpronomen wird im Deutschen idiomatisch ergänzt.
- source_word: μὴ πικραίνεσθε
  choice: seid nicht bitter
  rationale: Die mediale/passive Form kann das Bitterwerden oder Verbittertsein bezeichnen. Die relativ formnahe Wiedergabe bewahrt das Bild und die mögliche Spannung zwischen innerer Haltung und daraus folgendem Verhalten.
- source_word: πρὸς αὐτάς
  choice: gegen sie
  rationale: Πρός mit Akkusativ bezeichnet hier die Ausrichtung der Haltung; »gegen sie« ist im Deutschen zusammen mit »bitter sein« natürlich.
theological_decisions:
- issue: Geschlechtsspezifische eheliche Anrede
  choice: Die Anrede an verheiratete Männer und der Bezug auf ihre Frauen bleiben ausdrücklich erhalten.
  alternative: Allgemeiner von Männern und Frauen sprechen.
  rationale: Der Haustafelkontext macht die eheliche Beziehung deutlich; eine Verallgemeinerung würde den konkreten Adressatenbezug abschwächen.
- issue: Innere Verbitterung oder hartes Verhalten
  choice: Die Bitterkeitsmetapher wird im Haupttext bewahrt.
  alternative: »Behandelt sie nicht hart« oder »seid nicht grob zu ihnen«.
  rationale: πικραίνεσθε kann sowohl das Bitterwerden beziehungsweise Verbittertsein als auch die daraus hervorgehende schroffe Haltung nahelegen. Die Übersetzung soll diese Spannung nicht vorschnell auf äußeres Verhalten verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ihr Männer« entspricht natürlicher biblischer Anrede; »eure Frauen« ist im Kontext eindeutig als »eure Ehefrauen« zu verstehen. Die Fußnote hält die lexikalische Alternative offen.
