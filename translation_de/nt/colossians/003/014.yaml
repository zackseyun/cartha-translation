  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: de
  text: Über dies alles aber zieht die Liebe an; sie ist das Band der Vollkommenheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Band der Vollständigkeit“ oder „das Band der Reife“.'
    reason: Lexikalische Alternativen für τελειότης; zugleich bleibt die genaue Beziehung des Genitivs offen.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Über dies alles aber
  rationale: 'Die Wendung nimmt das Bild des Anziehens aus Vers 12 auf: Die Liebe wird über die zuvor genannten Tugenden angezogen. Zugleich bleibt ihre hervorgehobene Stellung erkennbar.'
- source_word: τὴν ἀγάπην
  choice: die Liebe
  rationale: „Liebe“ ist die natürliche und sachlich angemessene Wiedergabe von ἀγάπη.
- source_word: '[implizites Verb aus dem Kontext: ἐνδύσασθε in Vers 12]'
  choice: zieht … an
  rationale: Das im Griechischen hier ausgelassene Verb wird aus Vers 12 ergänzt, damit der deutsche Satz vollständig ist und das Kleidungsbild erhalten bleibt.
- source_word: ὅ ἐστιν
  choice: sie ist
  rationale: Das sächliche Relativpronomen ὅ fasst wahrscheinlich die Liebe beziehungsweise den Gedanken als Ganzes auf. Ein neuer Hauptsatz mit „sie“ klingt im Deutschen natürlich, ohne die Aussage weiter auszudeuten.
- source_word: σύνδεσμος
  choice: Band
  rationale: „Band“ bezeichnet knapp das, was verbindet oder zusammenhält, und bewahrt die Bildhaftigkeit des griechischen Ausdrucks.
- source_word: τῆς τελειότητος
  choice: der Vollkommenheit
  rationale: Die kompakte Genitivverbindung bleibt erhalten. „Vollkommenheit“ gibt τελειότης formal wieder, während eine Fußnote die ebenfalls möglichen Nuancen Vollständigkeit und Reife nennt.
theological_decisions:
- issue: Bedeutung von σύνδεσμος τῆς τελειότητος
  choice: „Band der Vollkommenheit“; die genaue Beziehung des Genitivs bleibt offen.
  alternative: '„Band der Vollständigkeit“, „Band der Reife“ oder deutender: „das Band, das alles vollkommen zusammenhält“'
  rationale: Der griechische Genitiv kann Zugehörigkeit, Ergebnis oder eine enger beschreibende Beziehung ausdrücken. Die Hauptfassung wahrt diese Spannung, statt festzulegen, ob Liebe Vollkommenheit kennzeichnet, bewirkt oder die Tugenden zu einer vollkommenen Einheit verbindet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Voranstellung „Über dies alles aber“ bewahrt sowohl den Anschluss als auch das Kleidungsbild. Das Semikolon macht den ergänzten Imperativ und die erklärende Aussage klar lesbar.
