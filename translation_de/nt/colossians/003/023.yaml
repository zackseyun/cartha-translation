translation:
  language: de
  text: Was immer ihr tut, arbeitet von Herzen[a], als würdet ihr für den Herrn[b] und nicht für Menschen arbeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Seele“; gemeint ist: aus dem Innersten und mit ganzer Hingabe.'
    reason: lexical_alternative
  - marker: b
    text: „Herr“ kann in diesem Haushaltskontext zugleich die Nuance „Gebieter“ tragen.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Was immer ihr tut
  rationale: Das Relativpronomen mit ἐάν bezeichnet unbestimmt und allgemein alles, was getan wird. „Was immer ihr tut“ gibt diese offene Bedingung natürlich und präzise wieder.
- source_word: ἐκ ψυχῆς
  choice: von Herzen
  rationale: Wörtlich bedeutet die Wendung „aus der Seele“. Gemeint ist ein Handeln aus dem Innersten, mit aufrichtiger und ganzer Hingabe. „Von Herzen“ ist dafür im modernen Deutschen die natürliche Entsprechung; das griechische Bild wird in der Fußnote bewahrt.
- source_word: ἐργάζεσθε
  choice: arbeitet
  rationale: Der Präsensimperativ fordert zu beständigem, engagiertem Arbeiten auf. „Arbeitet“ wahrt sowohl die Aufforderungsform als auch den Arbeitskontext.
- source_word: ὡς τῷ κυρίῳ
  choice: als für den Herrn
  rationale: ὡς beschreibt die Ausrichtung beziehungsweise die Perspektive des Arbeitens; der Dativ bezeichnet, wem die Arbeit gilt. „Als für den Herrn“ erhält diese vergleichende Nuance, ohne daraus das hypothetischere „als ob“ zu machen.
- source_word: καὶ οὐκ ἀνθρώποις
  choice: und nicht für Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und steht im Gegensatz zum Herrn. Das heutige deutsche „Menschen“ gibt den generischen Bezug ohne unnötige geschlechtliche Einschränkung wieder.
theological_decisions:
- issue: Bedeutung von κύριος innerhalb der Haustafel
  choice: Herr
  alternative: Gebieter beziehungsweise Herr im Sinn eines menschlichen Dienstherrn
  rationale: Im unmittelbaren Kontext sind zwar Sklaven und Herren angesprochen, doch κύριος bezeichnet hier im Kontrast zu Menschen am ehesten Christus als den „Herrn“. Zugleich kann der Haushaltskontext die Bedeutung „Gebieter“ mitschwingen lassen; diese Nuance wird in der Fußnote kenntlich gemacht, ohne den christologischen Bezug aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Anrede mit „ihr“. Die Formulierung bleibt nah an der griechischen Satzstruktur, verwendet aber für ἐκ ψυχῆς die idiomatische deutsche Wendung „von Herzen“. Die Gegenüberstellung „Herr – Menschen“ und die leichte Mehrdeutigkeit von κύριος bleiben erhalten.
