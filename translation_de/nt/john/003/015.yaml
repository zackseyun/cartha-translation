  source_fidelity: 'Der Entwurf gibt alle Elemente des SBLGNT zuverlässig wieder: ἵνα als „damit“, πᾶς ὁ πιστεύων als generisches „jeder, der ... glaubt“, ἔχῃ in einem natürlichen deutschen damit-Satz und ζωὴν αἰώνιον als „ewiges Leben“. Die von der üblichen johanneischen Formel abweichende Präposition ἐν wird nicht unbemerkt angeglichen, sondern in Fußnote b korrekt dokumentiert.'
  naturalness: „damit jeder, der an ihn glaubt, ewiges Leben hat“ ist modernes, idiomatisches Standarddeutsch. Die Rektion „an ihn glauben“ ist gegenüber einem wörtlichen „in ihm glauben“ klar vorzuziehen. Der Indikativ „hat“ ist in diesem deutschen Zwecksatz natürlich; der griechische Konjunktiv ist durch ἵνα syntaktisch bedingt und verlangt keine deutsche Konjunktivform.
  terminology: „glaubt“ und „ewiges Leben“ sind im johanneischen Kontext etablierte, verständliche und theologisch nicht überdeutende Wiedergaben. „Jeder“ wahrt den generischen und umfassenden Bezug ohne unnötige stilistische Markierung. Die Fußnote zu ἐν αὐτῷ wahrt die relevante griechische Besonderheit, ohne die deutsche Hauptsatzformulierung zu verfremden.
