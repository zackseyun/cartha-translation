  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: de
  text: damit jeder, der an ihn glaubt, ewiges Leben hat[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer glaubt“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen „in ihm“ (ἐν αὐτῷ); im Deutschen heißt es idiomatisch „an ihn glauben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet einen Zweck- beziehungsweise Folgesatz ein. „Damit“ gibt diese Funktion im modernen Deutschen knapp und natürlich wieder.
- source_word: πᾶς ὁ πιστεύων
  choice: jeder, der glaubt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden glaubenden Menschen. „Jeder, der glaubt“ bewahrt den umfassenden, generischen Sinn und ist im Deutschen idiomatisch.
- source_word: πιστεύων
  choice: glaubt
  rationale: „Glaubt“ ist die klare und übliche Wiedergabe von πιστεύω im johanneischen Sprachgebrauch, ohne den Ausdruck deutend zu „vertraut“ oder „hat Glauben“ auszuweiten.
- source_word: ἐν αὐτῷ
  choice: an ihn
  rationale: Obwohl die griechische Präposition wörtlich „in ihm“ lautet, verlangt die natürliche deutsche Verbindung mit „glauben“ in diesem Sinn „an ihn glauben“. Eine Fußnote hält die auffällige griechische Formulierung ἐν αὐτῷ gegenüber dem häufigeren εἰς αὐτόν sichtbar.
- source_word: ἔχῃ
  choice: hat
  rationale: Der griechische Konjunktiv steht aufgrund von ἵνα. Im deutschen damit-Satz ist der Indikativ „hat“ die natürliche Entsprechung und führt keine zusätzliche Unsicherheit ein.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: „Ewiges Leben“ ist eine genaue, verständliche und im johanneischen Zusammenhang etablierte Wiedergabe, die sowohl die unbegrenzte Dauer als auch die besondere Qualität dieses Lebens offenhält.
theological_decisions:
- issue: Wiedergabe der Glaubensformel mit ἐν αὐτῷ
  choice: an ihn glaubt, mit Hinweis auf das wörtliche „in ihm“
  alternative: in ihm glaubt
  rationale: Die wörtliche Nachbildung wäre im heutigen Deutsch unnatürlich und potenziell missverständlich. „An ihn glauben“ entspricht der deutschen Rektion, während die Fußnote die griechische Präposition ausdrücklich dokumentiert und sie nicht stillschweigend mit εἰς gleichsetzt.
- issue: Umfang von πᾶς ὁ πιστεύων
  choice: jeder, der glaubt
  alternative: wer glaubt
  rationale: Die gewählte Form gibt den umfassenden und generischen Bezug deutlich wieder. Die Alternative ist ebenfalls möglich, hebt das ausdrückliche πᾶς jedoch weniger sichtbar hervor.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Formulierung vermeidet einen unnatürlichen griechischen Präpositionsanschluss im Haupttext, macht ihn aber in der Fußnote transparent.
