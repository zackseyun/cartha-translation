id: JHN.3.23
reference: John 3:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: de
  text: Auch Johannes taufte in Änon nahe bei Salim, weil es dort reichlich Wasser gab.[a] Und die Menschen kamen und ließen sich taufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil dort viele Wasser waren“; auch möglich: „weil dort viel Wasser war“.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „taufen“ wiedergegebene Verb kann auch „untertauchen“ bedeuten. Der etablierte Ausdruck „taufen“ entscheidet für sich allein nicht über die Art der Durchführung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Auch Johannes taufte
  rationale: ἦν mit dem Präsenspartizip βαπτίζων bildet eine periphrastische Imperfektform und bezeichnet eine fortdauernde Tätigkeit in der Vergangenheit. καί wird mit „auch“ wiedergegeben; δέ markiert nur einen leichten Übergang und braucht im Deutschen kein eigenes Wort.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: in Änon nahe bei Salim
  rationale: ἐν bezeichnet hier den Ort; ἐγγύς mit Genitiv die räumliche Nähe. Die Ortsnamen werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: weil es dort reichlich Wasser gab
  rationale: ὅτι ist kausal. Der griechische Plural „viele Wasser“ bezeichnet idiomatisch eine große oder ausreichende Wassermenge; „reichlich Wasser“ ist natürliches modernes Deutsch und bewahrt den praktischen Sinn.
- source_word: παρεγίνοντο
  choice: die Menschen kamen
  rationale: Das Imperfekt bezeichnet ein fortgesetztes oder wiederholtes Kommen. Das im Griechischen unausgesprochene Subjekt wird im Deutschen allgemein mit „die Menschen“ ausgedrückt.
- source_word: ἐβαπτίζοντο
  choice: ließen sich taufen
  rationale: Die passive Imperfektform bezeichnet, dass die Kommenden fortgesetzt die Taufe empfingen. Die deutsche Konstruktion „ließen sich taufen“ gibt diesen Sinn idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von βαπτίζω
  choice: taufen / sich taufen lassen
  alternative: untertauchen / sich untertauchen lassen
  rationale: „Taufen“ ist der etablierte deutsche Ausdruck für die neutestamentliche Handlung und bewahrt die begriffliche Kontinuität. Eine Festlegung auf eine bestimmte Taufweise wird im Haupttext vermieden; die mögliche konkretere Wiedergabe wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der eröffnende leichte griechische Übergang wird nicht durch ein unnötiges „Nun“ überzeichnet. Zwei kurze deutsche Hauptsätze vermeiden eine schwerfällige Satzkette, ohne den gedanklichen Zusammenhang aufzulösen.
