id: JHN.3.3
reference: John 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: de
  text: 'Jesus antwortete ihm: »Amen, amen, ich sage dir: Wenn jemand nicht von oben geboren wird,[a] kann er das Reich Gottes nicht sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Neuem« beziehungsweise »wieder«. Das griechische Wort kann beides bedeuten: »von oben« und »von Neuem«. Das Gespräch im folgenden Vers beruht auf dieser Doppeldeutigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Natürliches modernes Deutsch gibt die formelhafte griechische Doppelung »antwortete und sagte ihm« ohne Bedeutungsverlust kompakt wieder.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt Jesu charakteristische doppelte Bekräftigungsformel und ihren feierlichen Klang; »Amen« ist im Deutschen geläufig und quellennah.
- source_word: ἐὰν μή τις
  choice: Wenn jemand nicht
  rationale: Gibt die allgemeine Bedingung idiomatisch und geschlechtsneutral wieder; in Verbindung mit dem folgenden »kann ... nicht« entspricht dies dem Sinn von »es sei denn«.
- source_word: γεννηθῇ
  choice: geboren wird
  rationale: Gibt den passiven Aorist von γεννάω direkt wieder, ohne die Bedeutung von ἄνωθεν in das Verb hineinzutragen.
- source_word: ἄνωθεν
  choice: von oben
  rationale: Der johanneische Zusammenhang begünstigt die Herkunft »von oben«; die ebenfalls mögliche zeitliche Bedeutung »von Neuem/wieder« bleibt in der Fußnote sichtbar.
- source_word: οὐ δύναται ἰδεῖν
  choice: kann ... nicht sehen
  rationale: Natürliches Deutsch, das sowohl die ausgesagte Unfähigkeit als auch die Mehrdeutigkeit von »sehen« zwischen Wahrnehmen und Anteilhaben bewahrt.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Etablierte, verständliche Wiedergabe, die den Bedeutungsraum von Gottes Herrschaft und Herrschaftsbereich offenhält.
theological_decisions:
- issue: Bedeutung von ἄνωθεν
  choice: von oben
  alternative: von Neuem; wieder
  rationale: ἄνωθεν kann sowohl eine Herkunft von oben als auch eine erneute Geburt bezeichnen. Der Haupttext folgt dem im Johannesevangelium wichtigen Motiv himmlischer Herkunft; die Fußnote bewahrt das Wortspiel, auf dem das Missverständnis des Nikodemus im folgenden Vers beruht.
- issue: Bedeutung von ἰδεῖν im Blick auf das Reich Gottes
  choice: sehen
  alternative: wahrnehmen; erfahren; daran teilhaben
  rationale: Die direkte Wiedergabe »sehen« erhält die johanneische Spannung zwischen Erkenntnis, Erfahrung und eschatologischer Teilhabe, statt sie vorzeitig auf eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die charakteristische doppelte Amen-Formel bleibt erhalten; die unnötig schwerfällige narrative Doppelung »antwortete und sagte« wird idiomatisch verdichtet. Die Mehrdeutigkeit des Schlüsselworts ἄνωθεν wird im Haupttext und in der Fußnote transparent bewahrt.
