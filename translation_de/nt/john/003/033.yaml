id: JHN.3.33
reference: John 3:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: de
  text: Wer sein Zeugnis angenommen hat, hat damit besiegelt, dass Gott wahrhaftig ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hat bestätigt, dass Gott wahrhaftig ist.'
    reason: Die Alternative erläutert die übertragene Bedeutung des wörtlichen Bildes vom Besiegeln.
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Wer … angenommen hat
  rationale: Der substantivierte Aoristpartizip bezeichnet allgemein jeden, der das Zeugnis angenommen hat; die deutsche Perfektform gibt den abgeschlossenen Aspekt natürlich wieder.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Pronomen verweist im Kontext am natürlichsten auf den zuvor genannten, der vom Himmel kommt, beziehungsweise auf den Sohn.
- source_word: τὴν μαρτυρίαν
  choice: sein Zeugnis
  rationale: „Zeugnis“ bewahrt das johanneische Motiv des Bezeugens und ist im Deutschen idiomatisch.
- source_word: ἐσφράγισεν
  choice: hat damit besiegelt
  rationale: Die Wiedergabe erhält das Bild des Siegelns und lässt zugleich durch „damit“ erkennen, dass die Annahme des Zeugnisses als verbindliche Bestätigung fungiert.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt dessen ein, was besiegelt beziehungsweise bestätigt wird.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Das bestimmte Subjekt wird ohne unbegründete Erweiterung direkt wiedergegeben.
- source_word: ἀληθής
  choice: wahrhaftig
  rationale: „Wahrhaftig“ bezeichnet hier Gottes Wahrhaftigkeit und Verlässlichkeit und bewahrt zugleich den Bezug zum johanneischen Wahrheitsmotiv.
theological_decisions:
- issue: Bildhafte Bedeutung der Siegelsprache
  choice: Das Bild mit „hat damit besiegelt“ im Haupttext bewahren
  alternative: „hat bestätigt“ oder „hat beglaubigt“
  rationale: Das griechische Verb bezeichnet wörtlich ein Versiegeln und metaphorisch eine verbindliche Bestätigung. Das im Deutschen verständliche Bild sollte nicht unnötig aufgelöst werden.
- issue: Bedeutung von ἀληθής in Bezug auf Gott
  choice: „dass Gott wahrhaftig ist“
  alternative: „dass Gott die Wahrheit sagt“ oder „dass Gott zuverlässig ist“
  rationale: „Wahrhaftig“ lässt die Aussage sowohl Gottes Wahrheitsliebe als auch seine Verlässlichkeit umfassen, ohne sie auf einen engeren Sinn festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und nah am Griechischen; „damit“ verdeutlicht den logischen Bezug zwischen der Annahme des Zeugnisses und der Besiegelung.
