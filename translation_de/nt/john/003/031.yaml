  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: de
  text: Der, der von oben kommt, steht über allen.[a] Wer von der Erde ist, ist von der Erde und spricht von der Erde her.[b] Der, der vom Himmel kommt, steht über allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der, der vom Himmel kommt“. Das griechische Wort bezeichnet hier Herkunft von oben; die spätere Wendung „vom Himmel“ verdeutlicht dies.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „spricht von der Erde“. Im Griechischen steht erneut „von der Erde“; die Wendung kann Herkunft, Bereich oder Gegenstand des Sprechens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: von oben
  rationale: Bezeichnet hier bei ἐρχόμενος die Herkunft, nicht eine Wiederholung. „Von oben“ bewahrt den Gegensatz zur Erde und wird später durch „vom Himmel“ näher bestimmt.
- source_word: ἐρχόμενος
  choice: der ... Kommende
  rationale: Das substantivierte Präsenspartizip wird würdig und knapp wiedergegeben; die beschreibende, fortdauernde Aussage bleibt erhalten.
- source_word: ἐπάνω πάντων
  choice: steht über allen
  rationale: Drückt Vorrang und Hoheit aus und bewahrt zugleich das räumliche Bild. Das maskuline „allen“ lässt offen, ob alle Menschen oder umfassender alle Wesen gemeint sind.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: wer von der Erde ist
  rationale: Bewahrt den Herkunftsaspekt und leitet die dreifache Wiederholung von ἐκ τῆς γῆς natürlich ein.
- source_word: γῆ
  choice: Erde
  rationale: Im Gegensatz zum Himmel ist die kosmische und theologische Bedeutung „Erde“ gemeint, nicht „Land“ oder „Boden“.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: ist von der Erde
  rationale: Die im Griechischen betonte Wiederholung wird nicht geglättet.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: redet aus der Erde heraus
  rationale: Die Formulierung hält die Herkunfts- oder Sphärenbedeutung von ἐκ offen und vermeidet die vorschnelle Festlegung auf den Gesprächsgegenstand.
- source_word: οὐρανός
  choice: Himmel
  rationale: Bezeichnet hier den himmlischen beziehungsweise göttlichen Bereich und nicht bloß den sichtbaren Himmel.
theological_decisions:
- issue: Verhältnis von ἄνωθεν und ἐκ τοῦ οὐρανοῦ
  choice: Zuerst „von oben“, später „vom Himmel“
  alternative: Beide Wendungen mit „vom Himmel“ wiedergeben
  rationale: Die unterschiedlichen griechischen Ausdrücke bleiben erkennbar; zugleich verdeutlicht die zweite Wendung die himmlische Herkunft des von oben Kommenden.
- issue: Bedeutung der dreifachen Wendung ἐκ τῆς γῆς
  choice: Die Wiederholung „von der Erde ... von der Erde ... aus der Erde“ bewahren
  alternative: Zu „ist irdisch und redet auf irdische Weise“ zusammenziehen
  rationale: Die Wiederholung trägt den scharfen Gegensatz zwischen irdischer und himmlischer Herkunft. Eine Glättung würde eine bestimmte Deutung stärker eintragen als der Ausgangstext.
- issue: Bezugsumfang von πάντων
  choice: „über allen“
  alternative: „über allem“
  rationale: Der maskuline Genitiv Plural legt einen personalen Bezug nahe, ohne den Kreis ausdrücklich auf bestimmte Personen einzugrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung des griechischen Textes bleibt erhalten. „Aus der Erde heraus“ ist bewusst leicht markiert, um die Mehrdeutigkeit von Herkunft, Sphäre und Gegenstand nicht aufzulösen.
