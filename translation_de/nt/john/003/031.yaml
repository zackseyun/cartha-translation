revisions:
- from: Der von oben Kommende steht über allen.[a] Wer von der Erde ist, ist von der Erde und redet aus der Erde heraus.[b] Der vom Himmel Kommende steht über allen.
  to: Der, der von oben kommt, steht über allen.[a] Wer von der Erde ist, ist von der Erde und spricht von der Erde her.[b] Der, der vom Himmel kommt, steht über allen.
  rationale: Die Revision beschränkt sich auf eine sichere idiomatische Korrektur der dritten Wiederholung von „von der Erde“. „von der Erde her“ gibt die Quell- bzw. Sphärenrichtung von ἐκ natürlich wieder, ohne die im griechischen Ausdruck vorhandene Deutungsoffenheit zu beseitigen. Die Wiederholung, die kontrastive Satzfolge und die Terminologie des Entwurfs bleiben erhalten.
