review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Johannes antwortet; die generische Aussage über menschliches Empfangen wird durch die emphatische Verneinung („nicht einmal eine einzige Sache“) verstärkt; die Bedingung und das Perfektpassiv („gegeben worden ist“) sind sachgerecht abgebildet. „Vom Himmel“ bewahrt die im Text verwendete Umschreibung der göttlichen Herkunft, ohne sie auslegend zu ersetzen.'
  naturalness: „Johannes antwortete“ ist im modernen Standarddeutsch eine natürliche und angemessene Wiedergabe der griechischen Antwortformel. Der übrige Satz ist klar, würdig und idiomatisch. Die Formulierung „wenn sie ihm nicht … gegeben worden ist“ ist grammatisch eindeutig; „sie“ bezieht sich korrekt auf „eine einzige Sache“.
  terminology: „Ein Mensch“ trifft den generischen Gebrauch von ἄνθρωπος ohne unnötige geschlechtliche Einschränkung. „Empfangen“ passt zum Kontext des Gewährtwerdens, und „vom Himmel“ erhält den theologischen Sprachgebrauch des Ausgangstextes. Es werden keine konfessionellen Folgerungen über Determinismus oder die genaue Reichweite der Aussage in die Übersetzung eingetragen.
