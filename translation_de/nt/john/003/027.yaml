id: JHN.3.27
reference: John 3:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: de
  text: 'Johannes antwortete: „Ein Mensch kann nicht einmal eine einzige Sache empfangen, wenn sie ihm nicht vom Himmel gegeben worden ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Johannes antwortete
  rationale: Die griechische Antwortformel wird in natürlichem modernem Deutsch knapp wiedergegeben; „antwortete und sagte“ wäre zwar formal näher, wirkt hier aber unnötig schwerfällig.
- source_word: Οὐ δύναται
  choice: kann nicht
  rationale: Gibt die ausdrücklich bezeichnete Unfähigkeit idiomatisch und genau wieder.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Bewahrt Singular und allgemein-menschlichen Sinn ohne eine Beschränkung auf männliche Personen.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: nicht einmal eine einzige Sache empfangen
  rationale: „Empfangen“ entspricht dem Geschenkcharakter des folgenden Passivs; „nicht einmal eine einzige Sache“ erhält die emphatische Minimalität von οὐδὲ ἓν.
- source_word: ἐὰν μὴ
  choice: wenn … nicht
  rationale: Die natürliche deutsche Konstruktion gibt die griechische Ausnahmebedingung zuverlässig wieder; „es sei denn“ wäre ebenfalls möglich, aber syntaktisch schwerer.
- source_word: ᾖ δεδομένον αὐτῷ
  choice: sie ihm … gegeben worden ist
  rationale: Das Perfektpassiv bezeichnet ein erfolgtes Geben mit fortbestehendem Ergebnis. Das feminine Pronomen nimmt im Deutschen „Sache“ auf.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Bewahrt die bildhafte Angabe der göttlichen Herkunft, ohne sie interpretierend durch „von Gott“ zu ersetzen.
theological_decisions:
- issue: Reichweite der himmlischen Gabe
  choice: Die allgemein formulierte Aussage bleibt breit und wird nicht ausdrücklich auf Amt, Erfolg oder geistliche Vollmacht eingeengt.
  alternative: Die Aussage ausschließlich auf die Dienstrollen Johannes des Täufers und Jesu im unmittelbaren Zusammenhang beziehen.
  rationale: Der Kontext betrifft zwar Rang und Dienst, doch der Wortlaut formuliert ein allgemeines Prinzip. Die Übersetzung wahrt diese Spannung, ohne daraus ein umfassendes deterministisches Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitisch-griechische Doppelwendung „antwortete und sagte“ wird zugunsten natürlicher deutscher Erzählweise zu „antwortete“ verdichtet. Keine Fußnote ist erforderlich, da „ein Mensch“ den generischen Sinn von ἄνθρωπος unmittelbar ausdrückt.
