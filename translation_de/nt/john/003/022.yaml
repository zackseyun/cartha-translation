  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: de
  text: Danach ging Jesus mit seinen Jüngern in das Gebiet Judäas, und dort hielt er sich mit ihnen auf und taufte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Johannes 4,2 stellt später klar, dass Jesus nicht persönlich taufte, sondern seine Jünger.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Eine natürliche deutsche Zeitangabe, die den erzählerischen Übergang und die zeitliche Abfolge wiedergibt; der griechische Plural muss im Deutschen nicht wörtlich als „nach diesen Dingen“ abgebildet werden.
- source_word: ἦλθεν
  choice: ging
  rationale: Mit dem ausdrücklich genannten Ziel ist „ging“ im Deutschen die natürliche Bewegungsangabe und passt zum Ortswechsel aus dem vorherigen Zusammenhang.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Die übliche und natürliche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: in das judäische Land
  rationale: Bewahrt γῆ ausdrücklich als „Land“ und gibt das adjektivische Ἰουδαίαν formal wieder; gemeint ist das Gebiet Judäas außerhalb des zuvor genannten Jerusalems.
- source_word: διέτριβεν
  choice: hielt er sich … auf
  rationale: Gibt sowohl die Bedeutung des Verweilens als auch den durativen Aspekt des Imperfekts idiomatisch wieder.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: Direkte Wiedergabe der Präpositionalphrase mit Rückbezug auf die Jünger.
- source_word: ἐβάπτιζεν
  choice: taufte
  rationale: „Taufen“ ist die etablierte, konfessionell nicht auf einen bestimmten Taufmodus festgelegte Wiedergabe von βαπτίζω. Im Zusammenhang mit „hielt sich … auf“ ist der fortlaufende Charakter des Imperfekts hinreichend erkennbar.
theological_decisions:
- issue: Subjekt von „taufte“ im Verhältnis zu Johannes 4,2
  choice: Jesus bleibt entsprechend der Grammatik dieses Verses das Subjekt von „taufte“; eine Fußnote weist auf die spätere Präzisierung hin.
  alternative: Im Haupttext die Jünger als die tatsächlich Taufenden einsetzen oder unpersönlich formulieren.
  rationale: Das singularische Verb schließt grammatisch an Jesus an. Johannes 4,2 präzisiert später, dass Jesus nicht persönlich taufte, sondern seine Jünger. Diese Spannung wird nicht durch eine Umformulierung des Verses beseitigt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Judäisches Land“ wahrt die konkrete Formulierung des griechischen Textes; „hielt sich … auf“ klingt natürlicher als das wörtlichere „verbrachte Zeit“.
