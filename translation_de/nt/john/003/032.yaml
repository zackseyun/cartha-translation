  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: de
  text: Was er gesehen und gehört hat, das bezeugt er[a]; und niemand nimmt sein Zeugnis an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „davon legt er Zeugnis ab“.'
    reason: lexical_alternative
  - marker: b
    text: „Niemand nimmt sein Zeugnis an“ ist eine zugespitzte Verallgemeinerung; der folgende Vers spricht von demjenigen, der es annimmt.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Was
  rationale: Das substantivisch gebrauchte neutrale Relativpronomen bezeichnet den Inhalt dessen, was gesehen und gehört wurde. „Was“ ist im modernen Deutschen natürlich und inhaltlich präzise.
- source_word: ἑώρακεν
  choice: gesehen hat
  rationale: Das Perfekt bezeichnet ein erfolgtes Sehen mit fortdauernder Bedeutung. Im deutschen Satz wird es idiomatisch im gemeinsamen Perfektrahmen „gesehen und gehört hat“ wiedergegeben.
- source_word: ἤκουσεν
  choice: gehört hat
  rationale: Der griechische Aorist steht neben dem Perfekt ἑώρακεν. Eine formale Nachbildung des Aspektunterschieds wäre im Deutschen („gesehen hat und hörte“) unnatürlich; die gemeinsame Perfektform bewahrt den Sinn klar.
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen greift den zuvor genannten Inhalt ausdrücklich wieder auf. Die Struktur „Was …, das …“ bildet diese Wiederaufnahme im Deutschen natürlich ab.
- source_word: μαρτυρεῖ
  choice: bezeugt er
  rationale: „Bezeugen“ bewahrt den für Johannes wichtigen Wortstamm und den Aussage- beziehungsweise Zeugencharakter des Verbs, ohne unnötig juristisch zu klingen.
- source_word: μαρτυρίαν
  choice: Zeugnis
  rationale: „Zeugnis“ entspricht dem Zeugenwortfeld und hält die lexikalische Verbindung zu „bezeugt“ sichtbar.
- source_word: οὐδεὶς
  choice: niemand
  rationale: Die uneingeschränkte Verneinung wird direkt und ohne Abschwächung wiedergegeben.
- source_word: λαμβάνει
  choice: nimmt … an
  rationale: Im Zusammenhang mit einem Zeugnis bedeutet λαμβάνει nicht bloß ein äußerliches Empfangen, sondern dessen Aufnahme beziehungsweise Annahme. „Nimmt … an“ ist natürliches modernes Deutsch und lässt den rezeptiven Sinn erkennen.
theological_decisions:
- issue: Reichweite der Aussage „niemand nimmt sein Zeugnis an“
  choice: Die schroffe Verallgemeinerung „niemand“ bleibt ungemildert stehen.
  alternative: „Nur wenige nehmen sein Zeugnis an“ oder eine strikt mathematisch-absolute Auslegung.
  rationale: Der griechische Text verwendet eine universale Verneinung. Der folgende Vers spricht zugleich von demjenigen, der das Zeugnis angenommen hat. Die Übersetzung bewahrt diese johanneische Spannung, statt sie durch eine erklärende Abschwächung oder dogmatische Festlegung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederaufnahmekonstruktion „Was …, das …“ bildet die griechische Satzgestalt ab, ohne steif zu wirken. Das adversative „doch“ macht den im Kontext liegenden Gegensatz natürlich hörbar; das griechische καί kann hier kontextuell adversativ verstanden werden.
