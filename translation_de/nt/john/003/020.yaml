  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: de
  text: Denn jeder, der Böses tut, hasst das Licht und kommt nicht zum Licht, damit seine Taten nicht aufgedeckt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bloßgestellt werden«. Das griechische Verb kann auch das Überführen oder Zurechtweisen einer Person bezeichnen; hier legt das Bild des Lichts das Aufdecken der Taten nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ φαῦλα πράσσων
  choice: Denn jeder, der Böses tut
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Menschen, dessen Handeln vom Bösen geprägt ist. »Denn« gibt den begründenden Anschluss durch γάρ wieder; »Böses tut« ist im heutigen Deutsch natürlicher als das altertümlich wirkende »Böses treibt«.
- source_word: μισεῖ τὸ φῶς
  choice: hasst das Licht
  rationale: Die starke Aussage von μισέω und das johanneische Bild des Lichts werden ohne Abschwächung bewahrt.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: kommt nicht zum Licht
  rationale: Die schlichte Bewegungsmetapher des griechischen Textes bleibt erhalten; »zum Licht kommen« ist verständlich und hält die Verbindung zum wiederholten τὸ φῶς fest.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Formulierung gibt den negativen Zweck beziehungsweise die beabsichtigte Vermeidung in natürlichem modernem Deutsch wieder.
- source_word: ἐλεγχθῇ
  choice: aufgedeckt werden
  rationale: Im Zusammenhang mit dem Licht steht das Offenbarwerden moralisch verwerflicher Taten im Vordergrund. Zugleich kann das Verb auch Überführung oder Zurechtweisung bezeichnen; diese Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: τὰ ἔργα αὐτοῦ
  choice: seine Taten
  rationale: »Taten« gibt ἔργα in diesem ethischen Zusammenhang natürlicher wieder als »Werke«. Das singularische »seine« entspricht der generischen Einzahl des griechischen Satzes.
theological_decisions:
- issue: Bedeutung von ἐλεγχθῇ im Wirken des Lichts
  choice: aufgedeckt werden
  alternative: überführt oder zurechtgewiesen werden
  rationale: Die Lichtmetaphorik legt das Enthüllen der Taten nahe, doch das griechische Verb kann über bloßes Sichtbarwerden hinaus auch das Erweisen von Schuld und die Zurechtweisung ausdrücken. Die Übersetzung entscheidet sich kontextgemäß für »aufgedeckt«, ohne die weitere Bedeutung in der Fußnote zu verschweigen.
- issue: Generisches Maskulinum in πᾶς ὁ … αὐτοῦ
  choice: jeder … seine Taten
  alternative: alle … ihre Taten
  rationale: Die Einzahl und die individuelle Zuspitzung des Ausgangstextes bleiben erhalten. Im Deutschen ist »jeder, der« eine natürliche generische Konstruktion und schließt hier dem Sinn nach Menschen jeden Geschlechts ein.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die johanneische Wiederholung von »Licht« sowie die knappe Gegenüberstellung von bösem Handeln und dem Kommen zum Licht bleiben erhalten.
