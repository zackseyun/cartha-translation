id: JHN.3.10
reference: John 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: de
  text: 'Jesus antwortete ihm: »Du bist der Lehrer Israels[a] und weißt das nicht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Lehrer Israels«. Im Griechischen steht »der Lehrer«, was der Anrede wahrscheinlich eine pointierte rhetorische Schärfe verleiht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die griechische Dialogformel mit zwei Verben wird im heutigen Deutsch idiomatisch durch »antwortete ihm« wiedergegeben; ein wörtliches »antwortete und sagte zu ihm« wäre unnötig schwerfällig.
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte Pronomen steht am Satzanfang und bewahrt so die Hervorhebung des Gegenübers.
- source_word: ὁ διδάσκαλος
  choice: der Lehrer
  rationale: Der bestimmte Artikel wird bewahrt und erhält die pointierte, möglicherweise leicht ironische Kraft der Anrede.
- source_word: τοῦ Ἰσραὴλ
  choice: Israels
  rationale: Der Genitiv gibt die Zugehörigkeit beziehungsweise repräsentative Stellung innerhalb Israels präzise und natürlich wieder.
- source_word: ταῦτα
  choice: das
  rationale: Das deutsche Singularpronomen fasst idiomatisch den zuvor behandelten Sachverhalt zusammen; »diese Dinge« wäre zwar formnäher, klingt hier aber weniger natürlich.
- source_word: οὐ γινώσκεις
  choice: weißt das nicht
  rationale: »Wissen« bewahrt den üblichen lexikalischen Sinn von γινώσκω; im Zusammenhang schwingt mangelndes Verstehen mit.
theological_decisions:
- issue: Kraft der Anrede ὁ διδάσκαλος τοῦ Ἰσραήλ
  choice: »der Lehrer Israels« mit bestimmtem Artikel
  alternative: »ein Lehrer Israels«
  rationale: 'Die bestimmte Form wahrt die rhetorische Schärfe: Nikodemus wird als anerkannter Lehrer angesprochen, ohne daraus einen exklusiven Amtstitel oder eine weitergehende Lehrbehauptung abzuleiten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige griechische Erzählformel wird idiomatisch verdichtet; die betonte Anrede und die rhetorische Frage bleiben erhalten.
