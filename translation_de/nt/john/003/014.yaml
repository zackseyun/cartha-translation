id: JHN.3.14
reference: John 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: de
  text: Und wie Mose die Schlange in der Wüste[a] erhöhte, so muss der Menschensohn erhöht werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Siehe 4. Mose 21,8–9: Dort wird berichtet, wie Mose die Schlange in der Wüste erhöhte.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „emporgehoben“. Das griechische Verb kann sowohl ein körperliches Hochheben als auch eine Erhöhung im Sinn von Verherrlichung bezeichnen; im Johannesevangelium klingen wahrscheinlich beide Bedeutungen an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς … οὕτως
  choice: wie … so
  rationale: Die deutsche Vergleichsformel gibt die enge Entsprechung zwischen Moses Handeln und dem Geschehen am Menschensohn natürlich und präzise wieder.
- source_word: ὕψωσεν / ὑψωθῆναι
  choice: erhöhte / erhöht werden
  rationale: Die Wiederholung desselben deutschen Wortstamms bildet die Wiederholung im Griechischen ab. „Erhöhen“ kann sowohl das konkrete Hochheben als auch die Erhöhung im Sinn von Verherrlichung bezeichnen und bewahrt so das johanneische Wortspiel.
- source_word: ὄφιν
  choice: Schlange
  rationale: „Schlange“ ist die klare, im Deutschen übliche Bezeichnung und entspricht dem Bericht in 4. Mose 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: Die feste biblische Wendung bezeichnet den Schauplatz der Wüstenwanderung Israels natürlich und verständlich.
- source_word: δεῖ
  choice: muss
  rationale: „Muss“ bringt die im griechischen δεῖ ausgedrückte Notwendigkeit knapp und nachdrücklich zum Ausdruck.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Titel und seine biblisch-theologische Resonanz, ohne ihn auslegend aufzulösen.
theological_decisions:
- issue: Doppelsinn von ὑψόω im Johannesevangelium
  choice: Beide Vorkommen mit demselben Wortstamm „erhöhen“ wiedergeben.
  alternative: Beim ersten Vorkommen „hochheben“ und beim zweiten „erhöhen“ oder „emporheben“ verwenden.
  rationale: Die einheitliche Wiedergabe erhält die ausdrückliche Verbindung zwischen der konkret hochgehobenen Schlange und der Erhöhung des Menschensohns. Zugleich bleibt offen, dass die Erhöhung des Menschensohns sowohl seine physische Erhebung am Kreuz als auch seine Verherrlichung meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform „wie … so“ wahrt die rhetorische Parallelität des griechischen Textes. „Erhöhen“ ist leicht gehoben, aber allgemein verständlich und für den beabsichtigten Doppelsinn besonders geeignet.
