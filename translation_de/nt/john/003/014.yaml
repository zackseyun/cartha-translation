  source_fidelity: Der griechische Vergleich καθὼς … οὕτως ist treffend mit „wie … so“ wiedergegeben. „Mose“, „die Schlange“, „in der Wüste“, die Notwendigkeit von δεῖ („muss“) und der etablierte Titel „der Menschensohn“ entsprechen dem Ausgangstext. Die Wiederaufnahme von „erhöhte/erhöht werden“ bildet die Wiederholung von ὑψόω angemessen ab und bewahrt dessen johanneischen Doppelsinn.
  naturalness: Der Satz ist knapp, würdevoll und im modernen Standarddeutsch gut verständlich. „Erhöhte“ ist im Bezug auf die Schlange leicht gehoben und biblisch geprägt, aber gerade dadurch idiomatisch und geeignet, die beabsichtigte Verbindung zum zweiten Vorkommen hörbar zu machen.
  terminology: „Menschensohn“ ist die eingeführte deutsche Wiedergabe des Titels. „Wüste“ und „Schlange“ sind kontextgerecht. Die Fußnote zu „erhöht werden“ erläutert den möglichen Sinn von Verherrlichung, ohne ihn in den Haupttext hineinzulesen; der Verweis auf 4. Mose 21,8–9 ist korrekt verankert.
