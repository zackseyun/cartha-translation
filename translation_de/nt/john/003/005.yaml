  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: de
  text: 'Jesus antwortete: „Amen, amen, ich sage dir: Wenn jemand nicht aus Wasser und Geist[a] geboren wird, kann er nicht in das Reich Gottes hineinkommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Aus Wasser und Geist“ wird unterschiedlich verstanden: als Bild für Reinigung und Erneuerung, als Hinweis auf natürliche und geistliche Geburt oder als Bezug auf die Taufe. Das griechische Wort für „Geist“ kann je nach Zusammenhang auch anders verstanden werden; hier ist jedoch wahrscheinlich Gottes Geist gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche deutsche Wiedergabe der narrativen Dialogformel.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die feierliche, für Jesus im Johannesevangelium charakteristische Doppelformel; „Amen“ ist im Deutschen verständlich und würdevoll.
- source_word: λέγω σοι
  choice: ich sage dir
  rationale: Gibt Wortlaut, direkte Anrede und feierlichen Ton der griechischen Formel präzise wieder.
- source_word: ἐὰν μή τις
  choice: wenn jemand nicht
  rationale: Natürliches Deutsch für die verneinte Bedingung mit generischem, geschlechtsneutralem Bezug.
- source_word: γεννηθῇ
  choice: geboren wird
  rationale: Bewahrt das Passiv. Da ἄνωθεν aus Vers 3 hier nicht wiederholt wird, werden weder „von Neuem“ noch „von oben“ ergänzt.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: aus Wasser und Geist
  rationale: „Aus“ bildet ἐκ sachgerecht ab und klingt mit „geboren“ im Deutschen natürlich. Die artikellose, eng verbundene griechische Wendung bleibt erhalten.
- source_word: οὐ δύναται
  choice: kann er nicht
  rationale: Idiomatiche und genaue Wiedergabe der ausdrücklich bezeichneten Unfähigkeit.
- source_word: εἰσελθεῖν
  choice: hineinkommen
  rationale: Natürliches modernes Deutsch für das Eintreten in einen Bereich; der Kontext des Reiches Gottes bleibt klar.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Etablierte, genaue Wendung, die weder ausschließlich einen räumlichen Bereich noch ausschließlich Gottes Herrschaftsakt festlegt.
theological_decisions:
- issue: Bezug von πνεύματος
  choice: „Geist“ mit Großschreibung als wahrscheinlicher Hinweis auf Gottes Heiligen Geist
  alternative: „geist“ beziehungsweise menschlicher oder geistiger Lebensgrundsatz
  rationale: Der johanneische Zusammenhang legt Gottes Geist nahe. Da die griechische Schrift keine entsprechende Groß-/Kleinschreibung festlegt und πνεύματος ohne Artikel steht, wird die alternative Lesart in der Fußnote offengehalten.
- issue: Deutung von „aus Wasser und Geist“
  choice: Die griechische Bildsprache bleibt im Haupttext unaufgelöst
  alternative: Reinigung und Erneuerung; natürliche und geistliche Geburt; spezifischer Bezug auf die Taufe
  rationale: Der Wortlaut erlaubt unterschiedliche kontextuelle Deutungen. Die Übersetzung schreibt daher keine konfessionell bestimmte Erklärung in den Vers hinein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem biblischem Ton. Die markante Doppelformel „Amen, amen“ bleibt erhalten. Die Fußnotenmarke steht am Ende des Satzes, weil sie die gesamte Wendung „aus Wasser und Geist“ einschließlich ihrer möglichen Deutungen erläutert.
