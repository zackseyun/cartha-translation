- from: 'Dieser kam bei Nacht zu ihm und sagte: „Rabbi, wir wissen, dass du als Lehrer von Gott gekommen bist; denn niemand kann diese Zeichen[a] tun, die du tust, wenn Gott nicht mit ihm ist.“'
  to: 'Dieser Mann kam bei Nacht zu ihm und sagte zu ihm: „Rabbi, wir wissen, dass du als Lehrer von Gott gekommen bist; denn niemand kann diese Zeichen[a] tun, die du tust, wenn Gott nicht mit ihm ist.“'
  rationale: 'Die Revision beschränkt sich auf zwei stilistisch und textlich sichere Anpassungen: Das demonstrative οὗτος wird mit dem im Deutschen idiomatischen „Dieser Mann“ wiedergegeben, und das ausdrücklich vorhandene αὐτῷ wird als „zu ihm“ aufgenommen. Die Satzstruktur, die begriffliche Terminologie und die auffällige dritte Person am Satzende bleiben erhalten.'
