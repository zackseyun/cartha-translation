  timestamp: '2026-07-14T23:49:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Merkmale des griechischen Textes zuverlässig wieder: die Pluralform „wir wissen“, „von Gott gekommen“ ohne die zusätzliche Aussage einer Sendung, „Zeichen“ für σημεῖα, die Wiederholung von „tun“ sowie den Wechsel zur dritten Person in „mit ihm“. Die Ergänzung „zu ihm“ nach „sagte“ stellt auch αὐτῷ ausdrücklich dar.'
  naturalness: „Dieser kam“ wirkt im modernen Standarddeutsch ohne Bezugsnomen unnötig steif und ist weniger idiomatisch als „Dieser Mann kam“. „sagte zu ihm“ ist trotz der Wiederholung mit „zu ihm“ im ersten Satzteil klar und entspricht der expliziten Adressatenangabe des Ausgangstextes.
  terminology: „Rabbi“, „Lehrer“, „Gott“ und insbesondere „Zeichen“ sind angemessen. Die Fußnote zu „Wunderzeichen“ wahrt die johanneische Signalfunktion von σημεῖα, ohne den Text auf „Wunder“ zu reduzieren.
