  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: de
  text: 'Dieser Mann kam bei Nacht zu ihm und sagte zu ihm: „Rabbi, wir wissen, dass du als Lehrer von Gott gekommen bist; denn niemand kann diese Zeichen[a] tun, die du tust, wenn Gott nicht mit ihm ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunderzeichen“. Das griechische Wort bezeichnet im Johannesevangelium machtvolle Taten, die über sich hinausweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist auf den unmittelbar zuvor genannten Nikodemus und bewahrt den demonstrativen Charakter, ohne den Namen erklärend einzufügen.
- source_word: νυκτός
  choice: bei Nacht
  rationale: Die Wendung gibt den Genitiv der Zeit natürlich und zugleich würdevoll wieder; sie lässt eine mögliche johanneische symbolische Resonanz bestehen, ohne sie in den Text hineinzudeuten.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die im Griechischen übernommene jüdische Anrede bleibt erhalten und wahrt den historischen Kontext.
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Der Plural des Ausgangstextes wird beibehalten, ohne festzulegen, für welche Gruppe Nikodemus spricht.
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: du als Lehrer von Gott gekommen bist
  rationale: Die Formulierung bewahrt sowohl die Herkunft von Gott als auch die Rolle als Lehrer; sie vermeidet die stärkere, hier nicht ausdrücklich verwendete Aussage „von Gott gesandt“.
- source_word: ταῦτα τὰ σημεῖα
  choice: diese Zeichen
  rationale: „Zeichen“ erhält den johanneischen Sinn von Taten, die über sich hinausweisen, statt sie lediglich als Wunder zu bezeichnen.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: tun, die du tust
  rationale: Die Wiederholung von ποιέω im Griechischen wird bewusst durch die Wiederholung von „tun“ abgebildet.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: wenn Gott nicht mit ihm ist
  rationale: Die dritte Person „ihm“ wird trotz der vorherigen direkten Anrede bewahrt und damit die auffällige Perspektivverschiebung des griechischen Textes nicht geglättet.
theological_decisions:
- issue: Bedeutung von σημεῖα im Johannesevangelium
  choice: Zeichen
  alternative: Wunderzeichen; Wunder
  rationale: „Zeichen“ bewahrt die theologische Funktion der Taten als Hinweise auf Jesu Identität und Auftrag, ohne ihren wunderhaften Charakter zu leugnen.
- issue: Wechsel von der zweiten zur dritten Person in der Rede des Nikodemus
  choice: „wenn Gott nicht mit ihm ist“
  alternative: „wenn Gott nicht mit dir ist“
  rationale: Der griechische Text wechselt von der direkten Anrede zur dritten Person. Diese möglicherweise rhetorisch bedeutsame Distanz oder allgemeine Formulierung bleibt erhalten.
- issue: Ob ἀπὸ θεοῦ ἐλήλυθας eine ausdrückliche Sendung bezeichnet
  choice: „von Gott gekommen“
  alternative: „von Gott gesandt“
  rationale: Der Ausgangstext bezeichnet hier die Herkunft, verwendet aber kein Verb des Sendens. Die Übersetzung vermeidet daher eine sachlich mögliche, jedoch stärkere Präzisierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Bei Nacht“ ist leicht literarisch, aber geläufig. Die Wiederholung „tun … tust“ und die dritte Person „ihm“ bewahren auffällige Merkmale des griechischen Wortlauts.
