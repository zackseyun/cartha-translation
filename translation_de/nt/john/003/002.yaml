  - severity: low
    issue: αὐτῷ nach εἶπεν ist nicht ausgedrückt
    rationale: Das indirekte Objekt ist aus dem Kontext erschließbar, wird im Griechischen aber ausdrücklich wiederholt. „sagte zu ihm“ bildet dies ohne Bedeutungszuwachs ab.
