  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: de
  text: 'Wundere dich nicht darüber, dass ich dir[b] gesagt habe: Ihr müsst von oben[a] geboren werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von neuem geboren werden“ beziehungsweise „wiedergeboren werden“. Das griechische Wort ἄνωθεν kann „von oben“ oder „von neuem/wieder“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: „Dir“ steht im Griechischen in der Einzahl, „ihr müsst“ dagegen in der Mehrzahl.
    reason: grammatical_clarification
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Wundere dich nicht
  rationale: μή mit dem Aorist Konjunktiv formuliert hier ein Verbot. Die Wendung ist natürliches modernes Deutsch und gibt θαυμάζω treffend wieder.
- source_word: ὅτι
  choice: darüber, dass
  rationale: ὅτι leitet hier den Inhalt beziehungsweise Anlass des Sich-Wunderns ein; die deutsche Konstruktion „darüber, dass“ ist syntaktisch klar und idiomatisch.
- source_word: εἶπόν σοι
  choice: ich dir gesagt habe
  rationale: Die Form wahrt die persönliche Anrede; σοι ist Singular und wird als „dir“ sichtbar erhalten.
- source_word: Δεῖ
  choice: müsst
  rationale: δεῖ drückt Notwendigkeit aus. „Müsst“ bewahrt die Stärke der Aussage und stimmt mit dem pluralischen ὑμᾶς überein.
- source_word: ὑμᾶς
  choice: ihr
  rationale: Das ausdrückliche „ihr“ macht im Deutschen den Wechsel vom singularischen σοι zur pluralischen Anrede unmittelbar sichtbar.
- source_word: γεννηθῆναι
  choice: geboren werden
  rationale: Im Kontext von Johannes 3 bezeichnet γεννάω Geburt beziehungsweise Hervorbringung; „geboren werden“ ist natürlich und kontextgerecht.
- source_word: ἄνωθεν
  choice: von oben
  rationale: ἄνωθεν kann „von oben“ und „von Neuem/wieder“ bedeuten. „Von oben“ passt zum johanneischen Motiv des himmlischen Ursprungs; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ἄνωθεν in der Aussage über die Geburt
  choice: von oben
  alternative: von Neuem; wieder
  rationale: Der weitere johanneische Sprachgebrauch und der Gedanke eines Ursprungs bei Gott sprechen für „von oben“. Da Nikodemus das Wort im Sinn einer erneuten Geburt versteht, darf die beabsichtigte Spannung nicht verschwinden; die alternative Bedeutung steht daher in der Fußnote.
- issue: Wechsel von singularischer zu pluralischer Anrede
  choice: „dir“ und danach „ihr“ im Haupttext
  alternative: Beide Formen mit dem mehrdeutigen deutschen „Sie“ oder einer Umschreibung wiedergeben
  rationale: Das Griechische wechselt von σοι (Singular) zu ὑμᾶς (Plural). Die deutsche Du-Anrede kann diesen Wechsel deutlich und ohne konfessionelle Deutung abbilden.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Anredeformen machen den Numeruswechsel des griechischen Textes sichtbar. Die Stellung der Fußnoten folgt den jeweils erläuterten Ausdrücken.
