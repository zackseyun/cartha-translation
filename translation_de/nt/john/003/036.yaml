id: JHN.3.36
reference: John 3:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: de
  text: Wer an den Sohn glaubt, hat ewiges Leben. Wer aber dem Sohn nicht gehorcht,[a] wird das Leben nicht sehen, sondern der Zorn Gottes bleibt auf ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer sich weigert, an den Sohn zu glauben“. Das griechische Verb kann sowohl die Weigerung zu glauben als auch Ungehorsam ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Wer an den Sohn glaubt
  rationale: Das substantivierte Präsenspartizip wird als allgemeiner Relativsatz wiedergegeben. πιστεύω mit εἰς bezeichnet hier auf den Sohn gerichteten Glauben bzw. Vertrauen; im Deutschen ist „an den Sohn glauben“ idiomatisch.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: hat ewiges Leben
  rationale: „Hat“ bewahrt den präsentischen Besitz; „ewiges Leben“ ist eine natürliche und sachgerechte Wiedergabe des johanneischen Ausdrucks.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: Wer aber dem Sohn nicht gehorcht
  rationale: ἀπειθέω kann Ungehorsam sowie die Weigerung zu glauben bezeichnen. „Nicht gehorcht“ erhält den weiteren Bedeutungsumfang und passt zur Dativkonstruktion; die glaubensbezogene Lesart wird in der Fußnote bewahrt.
- source_word: οὐκ ὄψεται ζωήν
  choice: wird das Leben nicht sehen
  rationale: Die bildhafte johanneische Formulierung mit dem Futur von ὁράω bleibt erhalten, statt sie zu „wird das Leben nicht haben“ zu verflachen.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: der Zorn Gottes
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „Zorn“ bewahrt die deutliche Aussage über Gottes Gericht.
- source_word: μένει ἐπ’ αὐτόν
  choice: bleibt auf ihm
  rationale: „Bleibt“ erhält den präsentischen und fortdauernden Sinn von μένω. „Auf ihm“ bildet die Präpositionalfügung knapp und textnah ab.
theological_decisions:
- issue: Bedeutung von ἀπειθῶν im Gegensatz zu πιστεύων
  choice: Im Haupttext „dem Sohn nicht gehorcht“, mit einer glaubensbezogenen Alternative in der Fußnote.
  alternative: „sich weigert, an den Sohn zu glauben“
  rationale: Der Gegensatz zu „glaubt“ legt Glaubensverweigerung nahe, doch das Verb umfasst auch Ungehorsam. Haupttext und Fußnote bewahren diese Spannung, ohne sie einseitig aufzulösen.
- issue: Zeitliche Aussage über ewiges Leben und Gottes Zorn
  choice: Gegenwärtiger Besitz des ewigen Lebens und gegenwärtiges Fortbestehen des Zorns werden bewahrt.
  alternative: Beide Aussagen ausschließlich auf die Zukunft beziehen.
  rationale: ἔχει und μένει stehen im Präsens, während οὐκ ὄψεται in die Zukunft weist. Die Übersetzung erhält dieses Nebeneinander.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der generische Relativsatz „Wer …“ vermeidet eine unnötig männlich markierte Form. Die zweimalige adversative Verbindung des Griechischen wird im Deutschen natürlich mit „aber … sondern“ wiedergegeben.
