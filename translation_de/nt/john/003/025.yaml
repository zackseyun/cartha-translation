  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: de
  text: Da kam es zwischen den Jüngern des Johannes und einem Juden zu einem Streit über die Reinigung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Säuberung“ beziehungsweise „über die rituelle Reinigung“. Das griechische Wort kann allgemein Reinigung bezeichnen, hat hier aber wahrscheinlich einen rituellen Bezug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο οὖν
  choice: Da kam es … zu
  rationale: Die Wendung gibt das Eintreten des Geschehens idiomatisch wieder; „da“ führt die Erzählung fort, ohne οὖν zu stark folgernd als „deshalb“ auszulegen.
- source_word: ζήτησις
  choice: Streit
  rationale: Das Wort kann eine Erörterung oder Auseinandersetzung bezeichnen. Der Zusammenhang legt eine kontroverse Debatte nahe; „Streit“ ist natürlich und wahrt diese Spannung.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: zwischen den Jüngern des Johannes und einem Juden
  rationale: Wörtlich steht eine Auseinandersetzung „vonseiten der Jünger des Johannes mit einem Juden“. Die deutsche Zwischen-Konstruktion gibt die beteiligten Seiten idiomatisch wieder und bewahrt den Singular Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: über die Reinigung
  rationale: καθαρισμός bezeichnet Reinigung beziehungsweise Reinheit und hat hier wahrscheinlich einen religiös-rituellen Bezug. „Reinigung“ lässt den genauen Gegenstand dennoch offen.
theological_decisions:
- issue: Ob καθαρισμός ausdrücklich als rituelle Reinigung bezeichnet werden soll
  choice: Reinigung
  alternative: rituelle Reinigung; Reinheit
  rationale: Der johanneische Zusammenhang deutet auf religiös-rituelle Reinigung, doch der Vers bestimmt die genaue Art nicht ausdrücklich. Die allgemeinere Wiedergabe vermeidet eine unnötige Festlegung; die Fußnote nennt die wahrscheinliche Konnotation.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Da kam es … zu“ bildet den narrativen Übergang natürlich ab; „Jünger des Johannes“ vermeidet die mögliche Missdeutung des Kompositums „Johannesjünger“.
