id: JHN.3.30
reference: John 3:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: de
  text: Er muss größer werden, ich aber muss geringer werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jener muss zunehmen, ich aber muss abnehmen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Er
  rationale: Das Akkusativpronomen ist das logische Subjekt des Infinitivs. Im Deutschen ist „er“ idiomatisch; der Bezug auf Jesus ergibt sich aus dem Kontext.
- source_word: δεῖ
  choice: muss
  rationale: „Muss“ bewahrt die Aussage von Notwendigkeit, ohne näher festzulegen, ob sie als göttliche Fügung, heilsgeschichtliche Notwendigkeit oder anders zu verstehen ist.
- source_word: αὐξάνειν
  choice: größer werden
  rationale: Die Wendung gibt das fortschreitende Zunehmen an Bedeutung und Wirksamkeit natürlich wieder und vermeidet eine rein zahlenmäßige Lesart von „zunehmen“.
- source_word: ἐμὲ
  choice: ich
  rationale: Das Akkusativpronomen ist das logische Subjekt des Infinitivs und wird im idiomatischen deutschen Satz als „ich“ wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ bildet den deutlichen Gegensatz zwischen Jesu Größerwerden und dem Geringerwerden des Johannes ab.
- source_word: ἐλαττοῦσθαι
  choice: geringer werden
  rationale: Die Form bezeichnet ein Geringerwerden oder Abnehmen. „Geringer werden“ bewahrt die persönliche und relationale Weite des Ausdrucks sowie den prägnanten Parallelismus.
theological_decisions:
- issue: Art der durch δεῖ ausgedrückten Notwendigkeit
  choice: Die Notwendigkeit wird schlicht mit „muss“ wiedergegeben.
  alternative: Die Aussage ausdrücklich als göttlichen Beschluss oder nur als praktische Notwendigkeit deuten.
  rationale: δεῖ kann im johanneischen Zusammenhang göttliche beziehungsweise heilsgeschichtliche Notwendigkeit andeuten, doch der Vers bestimmt deren Art nicht ausdrücklich. „Muss“ erhält dieses Gewicht, ohne die Spannung aufzulösen.
translation_notes:
  register: Knapp, würdevoll und sprichwortartig. „Größer werden“ und „geringer werden“ sind in modernem Standarddeutsch natürlich und erhalten die ausgewogene Gegenüberstellung des griechischen Satzes.
