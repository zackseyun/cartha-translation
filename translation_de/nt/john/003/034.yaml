id: JHN.3.34
reference: John 3:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: de
  text: Denn der, den Gott gesandt hat, spricht die Worte Gottes; denn er[a] gibt den Geist ohne Maß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn der von Gott Gesandte gibt den Geist ohne Maß.“ Das griechische Verb nennt das Subjekt nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: der, den
  rationale: Die substantivierte Wiedergabe bezeichnet die von Gott gesandte Person und klingt im modernen Deutschen natürlich.
- source_word: ἀπέστειλεν
  choice: gesandt hat
  rationale: Das Perfekt ist in modernem Standarddeutsch eine natürliche Wiedergabe des griechischen Aorists und bewahrt zugleich das johanneische Sendungsmotiv.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: die Worte Gottes
  rationale: Die Formulierung wahrt den Plural und den Genitiv und bezeichnet Gottes gesprochene Worte.
- source_word: λαλεῖ
  choice: spricht
  rationale: „Spricht“ gibt das Präsens direkt und idiomatisch wieder.
- source_word: οὐ … ἐκ μέτρου
  choice: ohne Maß
  rationale: Die Wendung drückt aus, dass der Geist nicht abgemessen oder begrenzt gegeben wird, und erhält das Bild des griechischen Ausdrucks.
- source_word: δίδωσιν
  choice: gibt
  rationale: Das schlichte Präsens entspricht der allgemeinen Aussage des griechischen Textes.
- source_word: τὸ πνεῦμα
  choice: den Geist
  rationale: Der johanneische Zusammenhang legt Gottes Geist nahe; die Großschreibung macht diesen Bezug nach deutscher Konvention sichtbar, ohne den griechischen Wortlaut auszubauen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von δίδωσιν („gibt“)
  choice: 'Im Haupttext bezieht sich „er“ vorrangig auf Gott: Gott gibt den Geist ohne Maß.'
  alternative: '„Er“ kann sich auf den von Gott Gesandten beziehen: Der Gesandte gibt den Geist ohne Maß.'
  rationale: 'Der vorher ausdrücklich genannte Gott und der Gedankengang sprechen dafür, Gott als Geber zu verstehen: Der Gesandte spricht Gottes Worte, weil Gott den Geist ohne Maß gibt. Da das griechische Verb jedoch kein ausdrückliches Subjekt nennt und auch der Gesandte als Subjekt verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon verdeutlicht die Begründungsstruktur der beiden γάρ-Sätze. Der Fußnotenmarker steht unmittelbar beim mehrdeutigen Pronomen.
