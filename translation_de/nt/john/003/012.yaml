source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: de
  text: Wenn ich euch die irdischen Dinge gesagt habe und ihr nicht glaubt, wie werdet ihr glauben, wenn ich euch die himmlischen Dinge sage?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: die irdischen Dinge
  rationale: Das substantivierte Neutrum Plural wird natürlich wiedergegeben und der direkte Gegensatz zu »den himmlischen Dingen« bleibt erhalten. Die Formulierung lässt offen, ob Dinge auf der Erde oder irdische Sachverhalte gemeint sind.
- source_word: εἶπον
  choice: ich ... erzählt habe
  rationale: Der Aorist verweist auf Jesu vorausgehendes Reden. »Erzählt habe« passt im Deutschen natürlich zur Angabe der angesprochenen Personen mit »euch« und zum Reden über bestimmte Dinge.
- source_word: οὐ πιστεύετε
  choice: ihr nicht glaubt
  rationale: Der verneinte Präsensindikativ bezeichnet die gegenwärtige Reaktion der Angesprochenen. »Glauben« bewahrt den üblichen johanneischen Ausdruck, ohne ihn enger als bloßes Fürwahrhalten oder ausdrücklich als Vertrauen festzulegen.
- source_word: πῶς ... πιστεύσετε
  choice: wie werdet ihr glauben
  rationale: Die rhetorische Frage und das Futur des griechischen Textes werden formal und idiomatisch bewahrt; »wie könnt ihr glauben« wäre stärker deutend.
- source_word: ἐὰν εἴπω
  choice: wenn ich ... erzähle
  rationale: Die Verbindung von ἐάν mit dem Aoristkonjunktiv bezeichnet eine mögliche zukünftige Bedingung, die im modernen Deutschen natürlich mit Präsens nach »wenn« ausgedrückt wird.
- source_word: τὰ ἐπουράνια
  choice: die himmlischen Dinge
  rationale: Das substantivierte Neutrum Plural und sein paralleler Gegensatz zu τὰ ἐπίγεια bleiben sichtbar. Die Formulierung definiert die gemeinten himmlischen Wirklichkeiten nicht näher.
theological_decisions:
- issue: Bedeutung des Gegensatzes zwischen »irdischen Dingen« und »himmlischen Dingen«
  choice: Der Gegensatz wird unmittelbar als »irdische Dinge« und »himmlische Dinge« wiedergegeben, ohne die Kategorien näher auszulegen.
  alternative: »Irdische Dinge« könnte Bilder aus der irdischen Erfahrungswelt oder Geschehnisse auf der Erde bezeichnen; »himmlische Dinge« könnte auf tiefere göttliche Geheimnisse zielen.
  rationale: Der griechische Text bestimmt die beiden Kategorien nicht genauer. Die offene Formulierung wahrt die echte Mehrdeutigkeit und die theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die parallele Satzstruktur und die rhetorische Frage des griechischen Textes bleiben erhalten.
