source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: de
  text: Wer aber die Wahrheit tut[a], kommt zum Licht, damit seine Werke offenbar werden, weil sie in Gott vollbracht worden sind.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „die Wahrheit tut“; auch möglich: „die Wahrheit praktiziert“ oder „tut, was wahr ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Bindewort kann statt einer Begründung auch den Inhalt dessen einleiten, was offenbar wird: „damit offenbar wird, dass seine Werke in Gott vollbracht worden sind“.'
    reason: alternative_reading
  - marker: c
    text: „In Gott“ kann je nach Verständnis auch den Gedanken „von Gott“ oder „durch Gott“ einschließen; der griechische Wortlaut bleibt offener.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Wer aber die Wahrheit tut
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, dessen Handeln von dieser Praxis geprägt ist. „Aber“ gibt den milden Gegensatz von δέ zum vorhergehenden Vers wieder. Die bewusst ungewöhnliche Wendung „die Wahrheit tun“ bewahrt das johanneische Zusammenspiel von Wahrheit und gelebtem Handeln.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: kommt zum Licht
  rationale: πρός bezeichnet bei einem Bewegungsverb die Hinwendung zum Licht. „Zum Licht kommen“ ist im Deutschen natürlich und bewahrt das Bild, ohne die Bewegung mit „ins Licht“ stärker auszudeuten.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: damit seine Werke offenbar werden
  rationale: ἵνα gibt hier den Zweck an; die passive Form φανερωθῇ wird durch „offenbar werden“ wiedergegeben. „Werke“ erhält die johanneische Wortwahl und legt deren sittliche Bewertung nicht zusätzlich fest.
- source_word: ὅτι
  choice: weil
  rationale: 'ὅτι wird im Haupttext kausal verstanden: Die Werke können ans Licht treten, weil sie in Gott vollbracht worden sind. Die ebenfalls mögliche inhaltliche Deutung wird in einer Fußnote offengehalten.'
- source_word: ἐν θεῷ
  choice: in Gott
  rationale: Die wörtliche Fassung hält offen, ob besonders Gottes Wirkungsbereich, seine Mitwirkung oder die Beziehung zu ihm gemeint ist, und vermeidet eine verengende Auslegung.
- source_word: ἐστιν εἰργασμένα
  choice: vollbracht worden sind
  rationale: Die periphrastische Perfekt-Passiv-Konstruktion bezeichnet vollendetes Tun mit fortbestehendem Ergebnis. „Vollbracht worden sind“ gibt Passiv und Resultatsaspekt in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von ποιῶν τὴν ἀλήθειαν
  choice: die Wahrheit tut
  alternative: die Wahrheit praktiziert; tut, was wahr ist; nach der Wahrheit handelt
  rationale: 'Die wörtlich wirkende Formulierung bewahrt die theologische Spannung der johanneischen Rede: Wahrheit wird nicht nur erkannt oder ausgesprochen, sondern getan.'
- issue: Funktion von ὅτι
  choice: 'kausale Deutung: „weil“'
  alternative: 'inhaltliche Deutung: „damit offenbar wird, dass seine Werke in Gott vollbracht worden sind“'
  rationale: Beide syntaktischen Beziehungen sind möglich. Der Haupttext wählt die gut anschließende kausale Lesart; die Fußnote bewahrt die andere Möglichkeit.
- issue: Bedeutung von ἐν θεῷ
  choice: in Gott
  alternative: von Gott; durch Gott; in Gemeinschaft mit Gott
  rationale: Die griechische Wendung lässt das genaue Verhältnis von göttlichem Wirkungsbereich, göttlicher Urheberschaft und Gemeinschaft mit Gott offen. Der Haupttext löst diese Mehrdeutigkeit nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „die Wahrheit tun“ ist absichtlich beibehalten, weil sie verständlich bleibt und die Ausdrucksweise des Johannesevangeliums sichtbar macht. Satzbau und Wortwahl sind ansonsten flüssig und für eine allgemeine Leserschaft zugänglich.
