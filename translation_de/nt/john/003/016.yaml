id: JHN.3.16
reference: John 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: de
  text: 'Denn so[a] hat Gott die Welt geliebt: Er gab seinen einzigen Sohn[b], damit jeder, der an ihn glaubt, nicht verloren geht, sondern ewiges Leben hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „Denn so sehr hat Gott die Welt geliebt.“ Das griechische Wort kann hier besonders die Art und Weise hervorheben: „So hat Gott die Welt geliebt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „seinen einzigartigen Sohn“; traditionell: „seinen eingeborenen Sohn“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: 'so …:'
  rationale: '„So“ bewahrt die natürliche deutsche Wendung und wird durch den folgenden Doppelpunkt als Angabe der Art und Weise verdeutlicht: Gottes Liebe zeigt sich in der Gabe des Sohnes.'
- source_word: γὰρ
  choice: Denn
  rationale: Gibt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Zusammenhang wieder.
- source_word: ἠγάπησεν
  choice: hat … geliebt
  rationale: Das Perfekt ist im modernen Deutsch für die hier bezeichnete konkrete Liebestat natürlich und gibt den griechischen Aorist angemessen wieder.
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: Bewahrt die umfassende johanneische Ausdrucksweise, ohne sie auf „die Menschheit“ oder die Schöpfung einzuengen.
- source_word: ὥστε … ἔδωκεν
  choice: ': Er gab'
  rationale: Der Doppelpunkt stellt die Gabe des Sohnes idiomatisch als konkrete Weise und Folge von Gottes Liebe heraus.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: seinen einzigen Sohn
  rationale: „Einziger Sohn“ ist eine knappe, natürliche Wiedergabe, die die einzigartige Sohnschaft bezeichnet. Die traditionsreiche Alternative „eingeborenen Sohn“ sowie die Bedeutung „einzigartigen Sohn“ werden in einer Fußnote offengehalten.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck- beziehungsweise Zielcharakter des griechischen Satzes in natürlichem Deutsch wieder.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτόν
  choice: jeder, der an ihn glaubt
  rationale: Gibt die inklusive, substantivische Formulierung und die feste deutsche Verbindung „an jemanden glauben“ klar wieder.
- source_word: μὴ ἀπόληται
  choice: nicht verloren geht
  rationale: Die geläufige biblische Wendung wahrt die ernste Bedeutung von ἀπόλλυμι, ohne die Art des Verderbens näher festzulegen.
- source_word: ἀλλὰ ἔχῃ ζωὴν αἰώνιον
  choice: sondern ewiges Leben hat
  rationale: Entspricht der griechischen Gegenüberstellung und bewahrt den zentralen johanneischen Ausdruck „ewiges Leben“.
theological_decisions:
- issue: Bedeutung von Οὕτως
  choice: 'Art und Weise: „so …: Er gab“'
  alternative: 'Grad oder Intensität: „so sehr“'
  rationale: Der Zusammenhang mit ὥστε und der anschließenden Gabe des Sohnes erklärt vor allem, wie Gott die Welt geliebt hat. Eine Fußnote bewahrt die verbreitete Lesart „so sehr“.
- issue: Wiedergabe von μονογενής
  choice: „einziger Sohn“ im Haupttext
  alternative: „eingeborener Sohn“ oder „einzigartiger Sohn“
  rationale: Die gewählte Fassung wahrt die einzigartige Beziehung des Sohnes zum Vater, ohne aus dem einzelnen Wort eine bestimmte Aussage über Zeugung abzuleiten. Historisch und lexikalisch bedeutsame Alternativen bleiben in der Fußnote sichtbar.
- issue: Reichweite von πᾶς ὁ πιστεύων
  choice: „jeder, der an ihn glaubt“
  alternative: „wer an ihn glaubt“
  rationale: Die inklusive, allgemeine Aussage bleibt erhalten, ohne spätere Lehrdebatten über Erwählung, Sühneumfang oder menschliche Antwort zu entscheiden.
- issue: Bedeutungsumfang von ἔδωκεν
  choice: „gab“
  alternative: „gab hin“
  rationale: „Gab“ lässt offen, ob der Akzent auf Sendung, Menschwerdung, Kreuzestod oder der gesamten Hingabe des Sohnes liegt, und bewahrt damit die Weite des griechischen Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Satzgestalt bleibt erkennbar, während der Doppelpunkt die wahrscheinlich gemeinte Art und Weise von Gottes Liebe deutlich macht. Die Fußnotenmarker stehen unmittelbar nach der betreffenden Wendung und folgen in alphabetischer Reihenfolge.
