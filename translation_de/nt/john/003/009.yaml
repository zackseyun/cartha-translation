  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: de
  text: 'Nikodemus antwortete ihm: „Wie kann das geschehen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ
  choice: Nikodemus antwortete ihm
  rationale: Die griechische Dialogformel lautet wörtlich „Nikodemus antwortete und sagte zu ihm“. Im natürlichen modernen Deutsch gibt „antwortete ihm“ sowohl ἀπεκρίθη als auch den Adressaten αὐτῷ wieder, ohne die schwerfällige Doppelung „antwortete und sagte“ nachzubilden.
- source_word: Πῶς
  choice: Wie
  rationale: Das Frageadverb fragt nach der Möglichkeit beziehungsweise dem Zustandekommen des zuvor Gesagten.
- source_word: δύναται
  choice: kann
  rationale: Die natürliche deutsche Modalform bewahrt die Aussage über Möglichkeit oder Vermögen.
- source_word: ταῦτα
  choice: das
  rationale: Obwohl ταῦτα formal ein Neutrum Plural ist, verweist das idiomatische deutsche „das“ als Sammelpronomen natürlich auf die zuvor genannten Sachverhalte. „Diese Dinge“ wäre formaler, klingt hier jedoch unnatürlich.
- source_word: γενέσθαι
  choice: geschehen
  rationale: Der Aoristinfinitiv von γίνομαι bezeichnet hier das Eintreten oder Zustandekommen dessen, wovon Jesus gesprochen hat. „Geschehen“ ist zugleich natürlich und offen genug, um die theologische Spannung nicht aufzulösen.
theological_decisions:
- issue: Sinn von Nicodemus’ Frage angesichts der zuvor beschriebenen neuen Geburt
  choice: Wie kann das geschehen?
  alternative: Wie kann das sein? / Wie kann dies zustande kommen?
  rationale: „Geschehen“ gibt den ereignishaften beziehungsweise resultativen Sinn von γενέσθαι wieder, ohne festzulegen, ob Nikodemus vor allem nach dem Vorgang, der Möglichkeit oder dem Wesen des Gesagten fragt. „Sein“ ist ebenfalls möglich, schwächt aber den Gedanken des Zustandekommens ab.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die griechische Doppelverbalformel wird idiomatisch verdichtet; die knappe, staunende Frage bleibt erhalten.
