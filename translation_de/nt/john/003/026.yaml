  - severity: low
    issue: „der Mann, der“
    rationale: Das griechische ὃς bedeutet hier schlicht „derjenige, der“; „Mann“ ist nicht notwendig und kann ohne Gewinn eine zusätzliche lexikalische Festlegung einführen.
