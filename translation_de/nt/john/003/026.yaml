  to: 'Und sie kamen zu Johannes und sagten zu ihm: „Rabbi, derjenige, der jenseits des Jordans bei dir war und über den du Zeugnis abgelegt hast[a] – sieh, er tauft[b], und alle gehen zu ihm.“'
