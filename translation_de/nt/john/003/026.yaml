source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: de
  text: 'Und sie kamen zu Johannes und sagten zu ihm: „Rabbi, derjenige, der jenseits des Jordans bei dir war und über den du Zeugnis abgelegt hast[a] – sieh, er tauft[b], und alle gehen zu ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem du Zeugnis abgelegt hast“. Die griechische Dativkonstruktion lässt beide Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher und möglicherweise betonter: „dieser da tauft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: sie kamen zu Johannes
  rationale: ἔρχομαι bezeichnet hier die Bewegung auf Johannes zu; „kamen zu“ ist im deutschen Erzählzusammenhang natürlich.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die vertraute Transkription bewahrt den jüdischen Kontext und die johanneische Anredeform.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: der Mann, der jenseits des Jordans bei dir war
  rationale: „Der Mann, der“ gibt das substantivisch gebrauchte Relativpronomen im Deutschen klar und natürlich wieder; „jenseits des Jordans“ wahrt die geografische Ausdrucksweise.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: für den du Zeugnis abgelegt hast
  rationale: Die Formulierung erhält das johanneische Motiv des Zeugnisses und gibt das Perfekt als zurückliegendes, weiterhin relevantes Zeugnis wieder. Der Dativ lässt daneben eine Wiedergabe mit „über den“ zu.
- source_word: ἴδε
  choice: sieh
  rationale: „Sieh“ ist eine knappe, gegenwärtig verständliche Aufforderung zur Aufmerksamkeit und weniger altertümlich als „siehe“.
- source_word: οὗτος βαπτίζει
  choice: er tauft
  rationale: Im natürlichen Deutschen genügt das Pronomen; die im griechischen Demonstrativpronomen mögliche pointierte Betonung wird in einer Fußnote festgehalten.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: alle gehen zu ihm
  rationale: „Alle“ bewahrt die rhetorische Verallgemeinerung der Sprecher; „gehen zu ihm“ entspricht ihrer Perspektive auf die Bewegung zu Jesus hin.
theological_decisions:
- issue: Johanneische Zeugnissprache
  choice: Zeugnis abgelegt
  alternative: über ihn ausgesagt
  rationale: „Zeugnis ablegen“ bewahrt das wiederkehrende Motiv von μαρτυρέω im Johannesevangelium, ohne seinen Sinn konfessionell zu verengen.
- issue: Bezug des Dativs ᾧ
  choice: für den du Zeugnis abgelegt hast
  alternative: über den du Zeugnis abgelegt hast
  rationale: Der griechische Dativ lässt den genauen Bezug offen. Der Haupttext folgt einer idiomatischen deutschen Wiedergabe, während die sachbezogene Alternative ausdrücklich dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt erregt und leicht zugespitzt, ohne den im griechischen Text nur möglichen Unterton übermäßig auszubauen.
