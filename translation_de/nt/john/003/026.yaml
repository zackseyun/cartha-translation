  source_fidelity: Der Dativ ᾧ bei μεμαρτύρηκας bezeichnet am wahrscheinlichsten die Person, über die Johannes Zeugnis abgelegt hat; „für den“ kann im Deutschen stärker ein Eintreten zugunsten der Person ausdrücken und ist daher als Hauptwiedergabe weniger genau. Das Perfekt ist mit „hast ... abgelegt“ angemessen wiedergegeben. Die übrigen Elemente, einschließlich der rhetorischen Verallgemeinerung „alle“ und des präsentischen „tauft“, entsprechen dem griechischen Text.
  naturalness: Der Vers ist insgesamt natürliches, würdevolles modernes Standarddeutsch. „Derjenige, der ...“ gibt die substantivische relative Bezugnahme präziser wieder als „der Mann, der“, ohne den Sinn zu verändern.
  terminology: „Rabbi“ und „Zeugnis abgelegt“ sind für den johanneischen Kontext passend. Die demonstrative Nuance von οὗτος wird sachgerecht in der Fußnote dokumentiert.
  issues:
