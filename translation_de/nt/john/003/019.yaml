id: JHN.3.19
reference: John 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: de
  text: 'Und darin besteht das Gericht: Das Licht ist in die Welt gekommen, und die Menschen liebten die Finsternis mehr als das Licht, denn ihre Taten waren böse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: Gericht
  rationale: „Gericht“ bewahrt den weiten Sinn von κρίσις als richtende Entscheidung beziehungsweise Beurteilung, ohne das Wort vorschnell auf „Verdammnis“ oder „Urteilsspruch“ zu verengen.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Die johanneische Metapher bleibt erhalten; ihr christologischer Bezug wird nicht erklärend in den Text eingesetzt.
- source_word: ἐλήλυθεν
  choice: ist … gekommen
  rationale: Das deutsche Perfekt gibt das griechische Perfekt natürlich wieder und lässt die fortdauernde Bedeutung des Kommens anklingen.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Dies ist die natürliche deutsche Wiedergabe und bewahrt die für Johannes charakteristische Mehrdeutigkeit von κόσμος.
- source_word: ἠγάπησαν
  choice: liebten
  rationale: „Liebten“ erhält die moralische Stärke von ἀγαπάω; die Vergleichskonstruktion wird durch „mehr als“ wiedergegeben.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: Der Ausdruck bezeichnet hier Menschen allgemein, nicht ausschließlich Männer; „die Menschen“ ist im modernen Deutschen präzise und natürlich.
- source_word: μᾶλλον … ἢ
  choice: mehr als
  rationale: Die Formulierung bildet den Vergleich eng ab und klingt im Zusammenhang mit „liebten“ idiomatisch.
- source_word: τὸ σκότος
  choice: die Finsternis
  rationale: „Finsternis“ bewahrt den gehobenen, symbolischen Gegensatz zu „Licht“ und ist in modernem Standarddeutsch verständlich.
- source_word: πονηρὰ τὰ ἔργα
  choice: ihre Taten waren böse
  rationale: „Taten“ ist hier natürlicher als „Werke“ und bezeichnet klar das moralisch bewertete Handeln; „böse“ gibt πονηρά angemessen wieder.
theological_decisions:
- issue: Bezug des Lichts
  choice: Die Metapher „das Licht“ bleibt ohne ausdrückliche Identifikation stehen.
  alternative: „Jesus“ oder „der Sohn“ erklärend einzusetzen beziehungsweise „Licht“ als Titel typografisch hervorzuheben.
  rationale: Der Kontext verbindet das Licht mit dem gekommenen Sohn, doch der griechische Text wahrt die Metapher. Die Übersetzung erhält diese johanneische Bildsprache und ihre theologische Dichte.
- issue: Bedeutungsumfang von κρίσις
  choice: „Gericht“
  alternative: „Verdammnis“ oder „Urteil“
  rationale: Der Vers beschreibt, worin das Gericht besteht beziehungsweise woran es sich erweist. „Gericht“ lässt offen, ob der Schwerpunkt auf Vorgang, Entscheidung oder verurteilendem Ergebnis liegt.
- issue: Generische Bedeutung von οἱ ἄνθρωποι
  choice: „die Menschen“
  alternative: „die Männer“ oder „die Menschheit“
  rationale: Gemeint sind Menschen im Allgemeinen. „Die Menschen“ gibt diese Reichweite ohne eine sachlich unbegründete Beschränkung auf Männer wieder.
translation_notes:
  register: Moderner, würdiger Standardstil. „Und darin besteht das Gericht“ ist natürlicher als eine starre Nachbildung von αὕτη δέ ἐστιν ἡ κρίσις. Das adversative „doch“ macht den im griechischen καί kontextuell liegenden scharfen Gegensatz verständlich, ohne den Gedankengang auszubauen. Keine Fußnote ist erforderlich.
