  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: de
  text: Und niemand ist in den Himmel hinaufgestiegen außer dem, der aus dem Himmel herabgestiegen ist – dem Menschensohn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: „der im Himmel ist“. „Menschensohn“ ist Jesu charakteristische Selbstbezeichnung und erinnert an Daniel 7,13–14.'
    reason: textual_variant_and_cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: niemand
  rationale: Das indefinite Negativpronomen wird im modernen Standarddeutsch natürlich und ohne unnötige Einschränkung mit „niemand“ wiedergegeben.
- source_word: ἀναβέβηκεν
  choice: ist … hinaufgestiegen
  rationale: Das Perfekt bezeichnet eine vollzogene, gegenwärtig relevante Bewegung; das deutsche Perfekt klingt natürlich und wahrt zugleich den Gegensatz zu „herabgestiegen“.
- source_word: εἰς τὸν οὐρανόν
  choice: in den Himmel
  rationale: „In den Himmel“ bildet die durch εἰς bezeichnete gerichtete Bewegung präzise und idiomatisch ab.
- source_word: εἰ μὴ
  choice: außer
  rationale: In Verbindung mit der vorausgehenden Verneinung kennzeichnet „außer“ klar die einzige Ausnahme.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: dem, der aus dem Himmel herabgestiegen ist
  rationale: Die substantivierte Partizipialwendung wird als Relativsatz wiedergegeben. „Aus dem Himmel“ bewahrt ἐκ, während „herabgestiegen“ die formale Gegenüberstellung zu „hinaufgestiegen“ erhält.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: dem Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe der charakteristischen Selbstbezeichnung Jesu und bewahrt den Anklang an Daniel 7,13–14.
theological_decisions:
- issue: Christologische Bedeutung von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Wiedergabe mit der etablierten Bezeichnung „Menschensohn“
  alternative: „der Menschliche“ oder rein generisch „ein Menschensohn“
  rationale: Die traditionelle Bezeichnung wahrt sowohl die idiomatische als auch die apokalyptisch-titelhafte Dimension, ohne die Spannung interpretierend aufzulösen.
- issue: Zeitliche und aspektuelle Aussage von Aufstieg und Abstieg
  choice: „ist … hinaufgestiegen“ und „herabgestiegen ist“
  alternative: „stieg hinauf … kam herab“
  rationale: Die deutschen Perfektformen spiegeln die vollzogenen Handlungen mit fortdauernder Relevanz wider und bewahren die starke Aussage über himmlische Herkunft und einzigartigen Zugang, ohne sie dogmatisch auszubauen.
- issue: Textvariante am Versende
  choice: Der kürzere SBLGNT-Text endet mit „dem Menschensohn“
  alternative: Einige Handschriften ergänzen sinngemäß „der im Himmel ist“
  rationale: Die Übersetzung folgt der angegebenen SBLGNT-Ausgabe; die bedeutsame, aber sekundäre Variante wird transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Richtungspräfixe „hinauf-“ und „herab-“ machen den griechischen Gegensatz deutlich. Der Doppelpunkt stellt „dem Menschensohn“ als Apposition zur alleinigen Ausnahme heraus; der Dativ entspricht dabei dem von „außer“ regierten Ausdruck.
