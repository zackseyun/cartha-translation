id: JHN.3.4
reference: John 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: de
  text: 'Nikodemus sagte zu ihm: „Wie kann ein Mensch geboren werden, wenn er alt ist? Er kann doch nicht ein zweites Mal in den Mutterleib hineingehen und geboren werden, oder?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: sagte zu ihm
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: „Mensch“ gibt den generischen Singular natürlich und geschlechtsübergreifend wieder, ohne den repräsentativen Charakter des griechischen Ausdrucks einzuschränken.
- source_word: γεννηθῆναι
  choice: geboren werden
  rationale: Der passive Infinitiv bezeichnet hier die Geburt; die Übersetzung fügt nicht von sich aus „wieder“ hinzu.
- source_word: γέρων ὤν
  choice: wenn er alt ist
  rationale: Die partizipiale Wendung wird als natürliche temporale Aussage wiedergegeben.
- source_word: μὴ δύναται
  choice: Er kann doch nicht …, oder?
  rationale: Die mit μή eingeleitete Frage erwartet eine verneinende Antwort; „doch nicht …, oder?“ bewahrt diesen fragenden und ungläubigen Ton.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: in den Mutterleib
  rationale: Im Zusammenhang bezeichnet κοιλία eindeutig den Leib der Mutter als Ort der Schwangerschaft; „Mutterleib“ ist präzise und idiomatisch.
- source_word: δεύτερον
  choice: ein zweites Mal
  rationale: Die ausdrückliche Ordnungsangabe wird beibehalten und macht Nikodemus’ wörtliches Verständnis sichtbar.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: hineingehen und geboren werden
  rationale: Beide Infinitive bleiben ausdrücklich erhalten, um Bildhaftigkeit und Gedankengang der Frage zu bewahren.
theological_decisions:
- issue: Wiedergabe des generischen ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann
  rationale: Im Deutschen bezeichnet „ein Mensch“ die generische Referenz klar und natürlich. „Ein Mann“ könnte hier unnötig als ausschließlich männlich verstanden werden.
- issue: Ob aus Johannes 3,3 die Bedeutung „wieder“ in γεννηθῆναι einzutragen ist
  choice: geboren werden … ein zweites Mal
  alternative: wiedergeboren werden
  rationale: Der Vers selbst enthält δεύτερον („ein zweites Mal“) und formuliert damit Nikodemus’ wörtliches Verständnis. Die Übersetzung bewahrt die Spannung zum mehrdeutigen ἄνωθεν im vorherigen Vers, statt sie vorzeitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „doch nicht …, oder?“ gibt die von μή erwartete negative Antwort idiomatisch wieder; „Mutterleib“ bewahrt den anschaulichen Charakter der Aussage.
