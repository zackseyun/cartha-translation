id: JHN.3.17
reference: John 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: de
  text: Denn Gott hat den Sohn nicht in die Welt gesandt, damit er die Welt richtet[a], sondern damit die Welt durch ihn gerettet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verurteilt“. Das griechische Verb kann im Zusammenhang enger so verstanden werden; seine Grundbedeutung ist jedoch „richten“ beziehungsweise „urteilen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn ... nicht
  rationale: γάρ knüpft den Vers begründend an die vorherige Aussage an; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder, während „nicht“ das Verb verneint.
- source_word: ἀπέστειλεν
  choice: hat ... gesandt
  rationale: „Senden“ ist die direkte und im johanneischen Zusammenhang angemessene Entsprechung, ohne den Auftrag näher auszudeuten.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Der bestimmte Artikel wird bei θεός im Deutschen idiomatisch nicht eigens wiedergegeben.
- source_word: τὸν υἱὸν
  choice: den Sohn
  rationale: Der griechische Text hat den bestimmten Artikel, aber kein ausdrückliches Possessivpronomen; „den Sohn“ bewahrt die titulare Formulierung.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: εἰς mit Akkusativ bezeichnet hier die Bewegung in den Bereich der Welt hinein; „in die Welt“ ist die natürliche deutsche Wendung.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: damit er die Welt richtet
  rationale: κρίνω bedeutet grundlegend „richten“ beziehungsweise „urteilen“ und ist weiter als „verurteilen“. „Damit“ gibt den Zwecksatz mit ἵνα samt Konjunktiv im Deutschen idiomatisch wieder.
- source_word: ἀλλ’ ἵνα
  choice: sondern damit
  rationale: Nach der Verneinung drückt ἀλλά einen scharfen Gegensatz zwischen den beiden Zweckangaben aus; „sondern damit“ erhält zugleich die parallele Satzstruktur.
- source_word: σωθῇ
  choice: gerettet wird
  rationale: Der passive Aorist Konjunktiv von σῴζω bezeichnet Rettung beziehungsweise Heil. Die deutsche Präsensform nach „damit“ gibt den griechischen Zweck angemessen wieder, ohne eine bloße Möglichkeit zu unterstellen.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Die wiederholte Wiedergabe mit „die Welt“ bewahrt das Schlüsselwort und vermeidet eine interpretierende Verengung auf eine bestimmte Menschengruppe.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet Mittel oder Vermittlung; „durch ihn“ ist knapp, natürlich und wahrt diesen Sinn.
theological_decisions:
- issue: Bedeutung von κρίνῃ im Gegensatz zu σωθῇ
  choice: richtet
  alternative: verurteilt
  rationale: κρίνω hat den weiteren Grundsinn „richten/urteilen“. Der Kontext kann die engere Bedeutung „verurteilen“ nahelegen, doch die Hauptübersetzung bewahrt die lexikalische Breite und damit die Spannung zwischen Gericht und Rettung; die verbreitete engere Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die zweimalige Konstruktion „damit ...“ bildet die parallelen griechischen Zwecksätze ab; „richtet“ wahrt die sachliche und theologische Mehrdeutigkeit des Ausgangstextes.
