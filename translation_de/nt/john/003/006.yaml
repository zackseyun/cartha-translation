  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: de
  text: Was aus dem Fleisch geboren ist, ist Fleisch[a], und was aus dem Geist geboren ist, ist Geist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was aus dem Fleisch geboren ist, hat menschliche Natur.“ Das griechische Wort für „Fleisch“ kann je nach Zusammenhang auch die gefallene oder sündige menschliche Natur bezeichnen; hier steht jedoch vor allem die natürliche Geburt der Geburt aus dem Geist gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Was aus dem Geist geboren ist, ist geistlich.“ Im Griechischen steht beim Ursprung „dem Geist“, beim Ergebnis dagegen artikellos „Geist“. So bleibt der qualitative Gegensatz zu „Fleisch“ erhalten; im Deutschen werden beide Vorkommen als Substantive großgeschrieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: was … geboren ist
  rationale: Der substantivierte, perfektische Passivpartizip ist allgemein und kategorisch gebraucht. „Was … geboren ist“ gibt diese Aussage im Deutschen natürlich und mit ihrem bleibenden Ergebnis wieder.
- source_word: ἐκ
  choice: aus
  rationale: Im Zusammenhang von Geburt bezeichnet ἐκ den Ursprung. „Aus … geboren“ ist idiomatisches Deutsch und bewahrt diese Herkunftsbeziehung.
- source_word: σάρξ / σαρκὸς
  choice: Fleisch
  rationale: Hier steht die natürliche menschliche Herkunft der Geburt aus dem Geist gegenüber. „Fleisch“ bewahrt die johanneische Begrifflichkeit und legt den Ausdruck nicht vorschnell auf „sündige Natur“ fest.
- source_word: πνεύματος / πνεῦμά
  choice: Geist / Geist
  rationale: Das erste πνεῦμα bezeichnet im Kontext den Geist als Ursprung; das zweite ist artikellos und kann qualitativ das Wesen oder Ergebnis dieser Geburt bezeichnen. Da deutsche Substantive immer großgeschrieben werden, lässt sich diese Unterscheidung typografisch nicht ausdrücken; eine Fußnote hält sie offen.
- source_word: ἐστιν
  choice: ist
  rationale: Die einfache Kopula erhält den knappen, sentenzartigen Parallelismus des griechischen Textes.
theological_decisions:
- issue: Bedeutung von σάρξ im ersten Satzteil
  choice: „Fleisch“ als Bereich der natürlichen menschlichen Geburt
  alternative: „menschliche Natur“ oder „sündige Natur“
  rationale: σάρξ kann andernorts eine ethisch negative Bedeutung haben, doch hier liegt der Schwerpunkt auf dem Gegensatz zwischen natürlicher Geburt und Geburt aus dem Geist. Die wörtliche Wiedergabe bewahrt die theologische Spannung, ohne eine engere Deutung einzutragen.
- issue: Bedeutung von πνεῦμα im zweiten Prädikat
  choice: „ist Geist“ mit offengehaltener qualitativer Bedeutung
  alternative: „ist geistlich“ oder ausdrückliche Gleichsetzung mit dem Heiligen Geist
  rationale: 'Das artikellose Prädikatsnomen kann qualitativ verstanden werden: Was aus dem Geist geboren ist, gehört zum Bereich des Geistes bzw. ist geistlicher Art. „Geist“ bleibt formal eng am griechischen Nomen und vermeidet eine vorschnelle Auflösung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus und die wiederholten Leitwörter „Fleisch“ und „Geist“ bleiben erhalten; die ungewöhnliche Formulierung „ist Geist“ ist bewusst gewählt, um die prägnante und theologisch offene Struktur des Ausgangstextes nicht zu glätten.
