id: JHN.3.28
reference: John 3:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: de
  text: 'Ihr selbst seid meine Zeugen dafür, dass ich gesagt habe: »Ich bin nicht der Messias[a], sondern ich bin vor ihm her gesandt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Christus.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »sondern ich bin ihm vorausgesandt worden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Ihr selbst
  rationale: Die doppelte Nennung des Pronomens ist betont; »Ihr selbst« gibt diesen Nachdruck im Deutschen natürlich wieder.
- source_word: μοι μαρτυρεῖτε
  choice: seid meine Zeugen dafür
  rationale: Die Formulierung bewahrt den johanneischen Zeugnisgedanken und gibt den Dativ μοι idiomatisch als persönliche Zuordnung wieder.
- source_word: ὅτι εἶπον
  choice: dass ich gesagt habe
  rationale: Der Aorist verweist auf eine frühere Aussage des Johannes; im heutigen Deutschen ist das Perfekt in diesem Zusammenhang natürlicher als das Präteritum.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός bezeichnet hier den erwarteten Gesalbten als Titel. »Messias« macht diese Funktion für heutige Leser deutlich.
- source_word: ἀλλ’ ὅτι
  choice: sondern
  rationale: Die Konjunktion stellt der verneinten ersten Aussage eine positive, kontrastierende Aussage gegenüber; im Deutschen genügt dafür »sondern«.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: ich bin … gesandt
  rationale: Die Umschreibung aus Partizip Perfekt Passiv und εἰμί beschreibt Johannes als den, der gesandt worden ist und weiterhin in diesem Auftrag steht. Die knappe deutsche Form wahrt diese Zustandsbedeutung.
- source_word: ἔμπροσθεν ἐκείνου
  choice: vor ihm her
  rationale: Die Wendung bezeichnet Johannes’ vorausgehenden, vorbereitenden Auftrag, ohne eine Rangordnung über den Wortlaut hinaus ausdrücklich auszudeuten.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Johannes verneint, der erwartete Gesalbte zu sein; daher ist die Titelbedeutung »Messias« im Kontext vorrangig. Die traditionelle Wiedergabe »Christus« bleibt als Alternative in der Fußnote erhalten.
- issue: Zeitliche und aspektuelle Kraft von Ἀπεσταλμένος εἰμὶ
  choice: ich bin vor ihm her gesandt
  alternative: ich bin ihm vorausgesandt worden
  rationale: Der Haupttext lässt sowohl den vollzogenen Sendeakt als auch den daraus bestehenden Auftrag anklingen. Er beschreibt Johannes’ vorbereitende Stellung, ohne zusätzliche Aussagen über den Sendenden oder die genaue Art des Auftrags einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Seid meine Zeugen dafür« ist idiomatischer als das wörtlichere »bezeugt mir« und erhält zugleich das für das Johannesevangelium wichtige Zeugnis-Motiv. Die Satzstellung bleibt klar und betont Johannes’ zweifache Selbstaussage.
