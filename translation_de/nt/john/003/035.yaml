id: JHN.3.35
reference: John 3:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: de
  text: Der Vater liebt den Sohn und hat alles in seine Hand gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seiner Hand“. Die griechische Wendung ist ein Bild für anvertrauten Besitz oder anvertraute Verfügungsgewalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Im johanneischen Zusammenhang ist dies eine persönliche Bezeichnung für Gott in seiner Beziehung zum Sohn; die Großschreibung kennzeichnet den Titel im Deutschen.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Das Präsens bezeichnet eine gegenwärtige, fortdauernde Wirklichkeit; das deutsche einfache Präsens gibt dies natürlich wieder.
- source_word: τὸν υἱόν
  choice: den Sohn
  rationale: Der Ausdruck bezeichnet hier Jesus in seiner einzigartigen Beziehung zum Vater und wird deshalb als christologischer Titel großgeschrieben.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend alles; „alles“ ist im Deutschen natürlicher als „alle Dinge“, ohne den Umfang einzuschränken.
- source_word: δέδωκεν
  choice: hat … gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Übergabe mit fortbestehendem Ergebnis; das deutsche Perfekt bringt dies angemessen zum Ausdruck.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: in seine Hand
  rationale: Mit dem Verb „geben“ gibt die deutsche Richtungsangabe „in seine Hand“ die Übergabe natürlich wieder und bewahrt zugleich das griechische Handbild für anvertraute Verfügungsgewalt oder Besitz.
theological_decisions:
- issue: Beziehung zwischen Vater und Sohn
  choice: Die persönlichen Beziehungstitel „Vater“ und „Sohn“ werden beibehalten und großgeschrieben.
  alternative: Kleinschreibung als allgemeine familiäre Bezeichnungen
  rationale: Der unmittelbare johanneische Kontext verwendet die Wörter als Bezeichnungen für Gott und Jesus; die Wiedergabe wahrt diese Beziehung, ohne sie dogmatisch auszuweiten.
- issue: Umfang und fortdauerndes Ergebnis der Gabe
  choice: „hat alles … gegeben“
  alternative: „gab alles“
  rationale: „Alles“ wahrt den umfassenden Bezug von πάντα, während das deutsche Perfekt den vollzogenen Akt und seinen fortbestehenden Zustand besser erkennen lässt.
- issue: Bedeutung des Handbildes
  choice: Das Bild „in seine Hand“ bleibt im Haupttext erhalten.
  alternative: Paraphrase als „seiner Vollmacht anvertraut“
  rationale: Das Bild kann Besitz, Verfügungsgewalt und anvertraute Autorität umfassen. Die wörtlich-nahe Form bewahrt diese Bedeutungsbreite, während die Fußnote das Idiom erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau des griechischen Textes bleibt erhalten; „alles“ ist idiomatischer als „alle Dinge“. Das Handbild wird nicht vorschnell auf nur eine theologische Kategorie festgelegt.
