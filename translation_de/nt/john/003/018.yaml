  source_fidelity: 'Der Text gibt die syntaktische und semantische Struktur des Griechischen zuverlässig wieder: die beiden substantivierten Partizipien werden natürlich mit „Wer ...“ formuliert, δέ durch „aber“ markiert, und das Perfekt κέκριται / πεπίστευκεν durch „ist schon gerichtet“ bzw. „geglaubt hat“ angemessen abgebildet. Die konsistente Wiedergabe von κρίνω als „richten“ wahrt die im Verb liegende Bedeutungsweite; die im Kontext naheliegende Nuance „verurteilen“ wird zutreffend als Alternative vermerkt, ohne den Haupttext unnötig festzulegen.'
  naturalness: Modernes Standarddeutsch, klar und würdevoll. „Wer an ihn glaubt, wird nicht gerichtet“ und der parallele Kontrastsatz sind idiomatisch und gut lesbar. „An den Namen ... geglaubt hat“ bewahrt bewusst die konkrete johanneische Ausdrucksweise und ist im biblisch-theologischen Register verständlich.
  terminology: „Einziger Sohn Gottes“ ist eine sachgerechte moderne Wiedergabe von μονογενής, die Einzigkeit hervorhebt. Die Fußnote dokumentiert sowohl „einzigartig“ als auch die traditionsgeschichtlich wichtige Wiedergabe „eingeboren“, ohne deren mögliche Missverständnisse in den Haupttext zu übernehmen. Die Fußnotenanker sind vorhanden und sinnvoll zugeordnet.
