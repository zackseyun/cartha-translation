id: JHN.3.18
reference: John 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: de
  text: Wer an ihn glaubt, wird nicht gerichtet[a]. Wer aber nicht glaubt, ist schon gerichtet, weil er nicht an den Namen des einzigen Sohnes Gottes[b] geglaubt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht verurteilt“; entsprechend im folgenden Satz: „ist schon verurteilt“. Das griechische Verb kann sowohl „richten“ als auch, je nach Zusammenhang, „verurteilen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „des einzigartigen Sohnes Gottes“; traditionell: „des eingeborenen Sohnes Gottes“. Das griechische Wort betont hier seine Einzigartigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Wer an ihn glaubt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, der glaubt; „an ihn glaubt“ ist die natürliche deutsche Wiedergabe der auf eine Person gerichteten Wendung πιστεύω εἰς.
- source_word: οὐ κρίνεται
  choice: wird nicht gerichtet
  rationale: „Gerichtet“ gibt κρίνω unmittelbar wieder und bewahrt die im Kontext mögliche, aber nicht zwingend ausdrücklich festgelegte Bedeutung „verurteilt“.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: Wer aber nicht glaubt
  rationale: „Aber“ bildet den durch δέ markierten Gegensatz ab; die deutsche Wer-Konstruktion gibt das substantivierte Partizip natürlich wieder.
- source_word: ἤδη κέκριται
  choice: ist schon gerichtet
  rationale: Das Perfekt bezeichnet einen bereits eingetretenen Zustand mit gegenwärtiger Geltung. „Ist schon gerichtet“ bewahrt diese Zustandsbedeutung und die lexikalische Verbindung zur ersten Verwendung von κρίνω.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: weil er nicht … geglaubt hat
  rationale: ὅτι nennt den Grund; das deutsche Perfekt gibt den griechischen Perfektgedanken hier verständlich wieder.
- source_word: εἰς τὸ ὄνομα
  choice: an den Namen
  rationale: Die konkrete johanneische Rede vom „Namen“ bleibt erhalten; sie verweist auf die offenbarte Person und Identität, ohne dies ausdeutend in den Haupttext einzutragen.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: des einzigen Sohnes Gottes
  rationale: „Einzig“ beziehungsweise „einziger“ bringt die Einmaligkeit des Sohnes in natürlichem Deutsch zum Ausdruck. Die traditionelle Wiedergabe „eingeboren“ wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von κρίνω in Johannes 3,18
  choice: In beiden Sätzen „gerichtet“
  alternative: „verurteilt“
  rationale: Der Zusammenhang von Johannes 3,17–19 kann ein negatives, verurteilendes Gericht nahelegen. Das allgemeinere „gerichtet“ bewahrt jedoch die genuine Bedeutungsweite desselben griechischen Verbs und legt die spezifischere Deutung nicht stillschweigend fest.
- issue: Wiedergabe von μονογενής
  choice: „einziger Sohn“
  alternative: „einzigartiger Sohn“; traditionell „eingeborener Sohn“
  rationale: Die Formulierung betont die einzigartige, unvergleichliche Sohnschaft, ohne eine biologische Vorstellung einzutragen oder spätere Bekenntnissprache an die Stelle des griechischen Wortlauts zu setzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wer-Konstruktion ist klar und mündlich gut verständlich; die Wiederholung von „gerichtet“ bildet die Wiederholung desselben griechischen Verbs ab.
