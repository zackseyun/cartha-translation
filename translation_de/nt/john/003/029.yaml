id: JHN.3.29
reference: John 3:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: de
  text: Wer die Braut hat, ist der Bräutigam. Der Freund des Bräutigams[a] aber, der dabeisteht und ihn hört, freut sich sehr[b] über die Stimme des Bräutigams. So ist diese meine Freude vollkommen geworden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Freund des Bräutigams“. Gemeint sein kann eine besondere Rolle bei der Hochzeit, die teilweise der eines Trauzeugen ähnelt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „freut sich mit Freude“; die griechische Ausdrucksweise verstärkt die Freude.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ist zur Fülle gelangt“ beziehungsweise „hat sich erfüllt“. Das griechische Wort kann ausdrücken, dass etwas zu seiner Fülle oder Vollendung gekommen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Wer die Braut hat
  rationale: Das substantivierte Partizip wird als allgemeine Einzelaussage wiedergegeben. „Braut“ bewahrt das Hochzeitsbild; „hat“ entspricht schlicht dem griechischen ἔχων, ohne die Braut im Text näher zu deuten.
- source_word: νυμφίος
  choice: Bräutigam
  rationale: Die übliche deutsche Bezeichnung bewahrt das ausdrückliche Hochzeitsmotiv und lässt sich bei der Wiederholung konsequent verwenden.
- source_word: φίλος τοῦ νυμφίου
  choice: Freund des Bräutigams
  rationale: Die Wiedergabe bleibt nah am griechischen Ausdruck und legt die konkrete kulturelle Funktion nicht vorschnell auf „Trauzeuge“ fest.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: der dabeisteht und ihn hört
  rationale: „Dabeisteht“ gibt den fortdauernden gegenwärtigen Zustand des Perfektpartizips natürlich wieder. „Ihn hört“ wahrt den Bezug des Genitivpronomens, ohne das später ausdrücklich genannte Wort „Stimme“ vorwegzunehmen.
- source_word: χαρᾷ χαίρει
  choice: freut sich sehr
  rationale: Die Verbindung des verwandten Substantivs und Verbs verstärkt die Aussage. „Freut sich sehr“ überträgt diese Emphase in natürliches modernes Deutsch.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: über die Stimme des Bräutigams
  rationale: διά mit Akkusativ bezeichnet hier den Grund beziehungsweise Anlass der Freude. Die deutsche Wendung „sich über … freuen“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: So ist diese meine Freude
  rationale: „So“ markiert die folgernde Verbindung; „diese meine Freude“ bewahrt sowohl das Demonstrativpronomen als auch die hervorgehobene persönliche Zuordnung.
- source_word: πεπλήρωται
  choice: ist vollkommen geworden
  rationale: Das Perfekt bezeichnet einen eingetretenen und nun bestehenden Zustand der Fülle oder Vollendung. Die Formulierung hält den resultativen Sinn fest, ohne ihn unnötig als Erfüllung einer Vorhersage zu deuten.
theological_decisions:
- issue: Das Hochzeitsbild und die Stellung Johannes des Täufers
  choice: Jesus bleibt im Bild der Bräutigam, Johannes der Freund des Bräutigams; die Braut wird nicht ausdrücklich identifiziert.
  alternative: Die Braut als Kirche oder Gottes Volk benennen und den Freund als „Trauzeugen“ wiedergeben.
  rationale: Der Vers selbst entfaltet diese Identifizierungen nicht. Die Übersetzung wahrt daher das Bild und seine theologische Offenheit, statt spätere Schlussfolgerungen in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Das wiederholte Hochzeitsvokabular und die leicht nachdrückliche Formulierung „diese meine Freude“ bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
