id: JHN.3.8
reference: John 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: de
  text: Der Wind weht, wo er will,[a] und du hörst sein Rauschen,[b] aber du weißt nicht, woher er kommt und wohin er geht. So ist es mit jedem, der aus dem Geist geboren ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort pneuma kann sowohl „Wind“ als auch „Geist“ bedeuten. Jesus verwendet in beiden Vershälften dasselbe Wort und schafft damit ein Wortspiel, das sich im Deutschen nicht vollständig wiedergeben lässt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seinen Laut; das griechische Wort kann auch „Stimme“ bedeuten. Hier ist der hörbare Laut des Windes gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (erste Stelle)
  choice: Wind
  rationale: In Verbindung mit πνεῖ („weht“) und dem hörbaren φωνή bezeichnet πνεῦμα hier am natürlichsten den Wind. Die Wiedergabe unterscheidet diesen konkreten Sinn vom „Geist“ am Versende; das griechische Wortspiel wird in einer Fußnote erläutert.
- source_word: ὅπου θέλει
  choice: wo er will
  rationale: Die Formulierung gibt die Willensbedeutung von θέλει und die Personifizierung des Windes knapp und idiomatisch wieder.
- source_word: πνεῖ
  choice: weht
  rationale: Beim meteorologischen Sinn von πνεῦμα ist „weht“ die natürliche deutsche Entsprechung.
- source_word: φωνήν
  choice: Rauschen
  rationale: φωνή kann „Stimme“ oder allgemein „Laut/Klang“ bedeuten. Beim Wind bezeichnet „Rauschen“ seinen hörbaren Laut natürlich und anschaulich, ohne eine wirkliche Stimme vorauszusetzen.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: du weißt nicht, woher er kommt und wohin er geht
  rationale: Dies bildet die parallelen Richtungsangaben πόθεν und ποῦ sowie ἔρχεται und ὑπάγει klar und idiomatisch ab.
- source_word: οὕτως ἐστίν
  choice: So ist es mit
  rationale: Die deutsche Wendung drückt den vergleichenden Übergang von der Windbeobachtung zur geistlichen Aussage natürlich aus.
- source_word: πᾶς ὁ γεγεννημένος
  choice: jedem, der … geboren ist
  rationale: Die substantivierte, generische Konstruktion wird inklusiv wiedergegeben. „Geboren ist“ wahrt den resultativen Zustand des griechischen Perfektpartizips.
- source_word: ἐκ τοῦ πνεύματος (zweite Stelle)
  choice: aus dem Geist
  rationale: Im Zusammenhang der Geburt in Johannes 3 bezeichnet πνεῦμα hier den Geist Gottes. „Aus“ gibt ἐκ als Ursprung der Geburt direkt wieder.
theological_decisions:
- issue: Doppelsinn des wiederholten πνεῦμα
  choice: Die erste Stelle wird mit „Wind“, die letzte mit „Geist“ übersetzt.
  alternative: Beide Stellen einheitlich mit „Geist“ oder „Wind“ wiedergeben.
  rationale: Das Griechische nutzt dasselbe Wort mit den Bedeutungen „Wind“ und „Geist“. Die erste Satzhälfte beschreibt aufgrund von πνεῖ und φωνή konkret den Wind, während die Schlussaussage im Kontext von der Geburt aus dem Geist handelt. Da Deutsch den Doppelsinn nicht mit einem einzigen natürlichen Wort bewahren kann, werden die kontextuellen Bedeutungen unterschieden und das Wortspiel in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Rauschen“ ist beim Wind idiomatischer als „Stimme“ und anschaulicher als das allgemeinere „Geräusch“. Die Wiederholung von „woher … wohin“ bewahrt die Richtungspaarung des Ausgangstextes.
