  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: de
  text: Denn Johannes war noch nicht ins Gefängnis geworfen worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Johannes der Täufer.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: noch nicht
  rationale: Das Adverb bezeichnet, dass die Handlung bis zu diesem Zeitpunkt noch nicht eingetreten war; „noch nicht“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: γὰρ
  choice: denn
  rationale: γάρ führt hier eine erklärende Hintergrundangabe ein. „Denn“ bewahrt diesen Zusammenhang, ohne ihn stärker kausal auszudeuten.
- source_word: ἦν βεβλημένος
  choice: war … geworfen worden
  rationale: Die periphrastische Plusquamperfekt-Passivform bezeichnet eine bereits vor dem erzählten Zeitpunkt vollzogene Handlung. Das deutsche Plusquamperfekt Passiv gibt diesen Zeitbezug wieder.
- source_word: εἰς τὴν φυλακήν
  choice: ins Gefängnis
  rationale: φυλακή bezeichnet hier das Gefängnis beziehungsweise die Inhaftierung; „ins Gefängnis“ wahrt die durch εἰς ausgedrückte Richtung und entspricht natürlichem Deutsch.
- source_word: ὁ Ἰωάννης
  choice: Johannes
  rationale: Der griechische Text nennt lediglich Johannes. Seine Identität als Johannes der Täufer ergibt sich aus dem Kontext und wird daher in einer Fußnote erläutert.
theological_decisions:
- issue: Identität von ὁ Ἰωάννης
  choice: Johannes
  alternative: Johannes der Täufer
  rationale: Im Haupttext wird nur wiedergegeben, was der griechische Vers ausdrücklich sagt. Die kontextuell eindeutige Identifizierung wird nicht in den Text hineingetragen, sondern in der Fußnote angegeben.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Satzstellung setzt die erklärende Angabe mit „Denn“ natürlich fort; das Passiv im Plusquamperfekt bewahrt den zeitlichen Rückblick des griechischen Textes.
