  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: de
  text: 'Wahrlich, wahrlich,[a] ich sage dir: Wir[b] reden von dem, was wir wissen, und bezeugen, was wir gesehen haben; und ihr[c] nehmt unser[b] Zeugnis nicht an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Amen, amen“.'
    reason: lexical_alternative
  - marker: b
    text: Wer mit „wir“ und „unser“ gemeint ist, wird nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: c
    text: Im Griechischen steht zunächst „dir“ im Singular, hier aber „ihr“ im Plural.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Wahrlich, wahrlich
  rationale: Die verdoppelte feierliche Bekräftigungsformel bleibt erhalten. „Wahrlich“ gibt ihre Bedeutung im Deutschen verständlich und würdevoll wieder; das unübersetzte „Amen“ wird als Alternative genannt.
- source_word: λέγω σοι
  choice: ich sage dir
  rationale: Bewahrt die direkte Anrede im Singular und den feierlichen Aussagecharakter der Formel.
- source_word: ὅτι
  choice: Doppelpunkt nach „ich sage dir“
  rationale: Das griechische ὅτι leitet hier den Inhalt der Aussage ein. Ein Doppelpunkt ist im Deutschen natürlicher als ein ausdrücklich gesetztes „dass“, ohne den Sinn zu verändern.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: Wir reden von dem, was wir wissen
  rationale: Gibt das relative Objekt verständlich wieder und erhält den ersten Plural. „Von dem reden“ ist im Deutschen idiomatischer als das mögliche, aber härtere „reden, was wir wissen“.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: bezeugen, was wir gesehen haben
  rationale: Das deutsche Perfekt entspricht der bleibenden Relevanz des griechischen Perfekts. „Bezeugen“ erhält den Zusammenhang mit „Zeugnis“.
- source_word: καὶ ... καὶ
  choice: und ... doch
  rationale: Das erste καί wird mit „und“ wiedergegeben; beim letzten καί macht „doch“ den im Zusammenhang liegenden Gegensatz in natürlichem Deutsch kenntlich, ohne einen stärkeren kausalen oder logischen Gegensatz einzuführen.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: unser Zeugnis
  rationale: Bewahrt sowohl den ersten Plural als auch die Wortverbindung zwischen μαρτυροῦμεν und μαρτυρία.
- source_word: οὐ λαμβάνετε
  choice: nehmt ... nicht an
  rationale: „Ein Zeugnis annehmen“ ist natürliches Deutsch und erfasst hier sowohl das Empfangen als auch das Akzeptieren, das λαμβάνω im Kontext bezeichnet.
theological_decisions:
- issue: Die ersten Personen im Plural („wir“, „unser“)
  choice: Der Plural wird ohne nähere Bestimmung beibehalten.
  alternative: Als Hinweis auf Jesus und seine Jünger, als rhetorischer Plural oder als umfassenderes himmlisches beziehungsweise göttliches Zeugnis auslegen.
  rationale: Der griechische Text nennt die eingeschlossene Gruppe nicht eindeutig. Die Übersetzung bewahrt diese Offenheit und legt keine bestimmte theologische Deutung fest.
- issue: Wechsel von singularischer zu pluralischer Anrede
  choice: „dir“ für σοι und „ihr“ für λαμβάνετε
  alternative: Die Anrede zur sprachlichen Vereinheitlichung durchgehend singularisch oder pluralisch wiedergeben.
  rationale: Der griechische Text wechselt ausdrücklich vom Singular zum Plural. Dies kann Nikodemus zunächst persönlich und anschließend eine größere Gruppe betreffen; die Übersetzung erhält den Wechsel, ohne seine Tragweite festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem Ton. Die traditionellen, aber noch gut verständlichen Wörter „wahrlich“, „bezeugen“ und „Zeugnis“ tragen die johanneische Aussageform und den Wortzusammenhang. Die Anredepronomen sind kleingeschrieben nach heutiger Standardschreibung.
