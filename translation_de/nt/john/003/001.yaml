  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: de
  text: Es war aber ein Mann aus dem Kreis der Pharisäer namens Nikodemus, ein führender Vertreter der Juden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein führender Vertreter der Judäer“. Das griechische Wort kann Juden allgemein oder, je nach Zusammenhang, besonders Judäer beziehungsweise jüdische Autoritäten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: war
  rationale: Die Konstruktion führt eine neue Person in die Erzählung ein. Im Deutschen ergibt die Voranstellung der Gruppenzugehörigkeit mit „war“ einen natürlichen Übergang, ohne ein nicht ausdrücklich vorhandenes zeitliches „Nun“ einzufügen.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Das Substantiv bezeichnet hier eine bestimmte männliche Person.
- source_word: ἐκ τῶν Φαρισαίων
  choice: unter den Pharisäern
  rationale: ἐκ bezeichnet die Zugehörigkeit zu dieser Gruppe. „Unter den Pharisäern“ ist idiomatisches Deutsch und gibt wieder, dass Nikodemus aus ihrem Kreis stammte.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: namens Nikodemus
  rationale: Die griechische Namensformel wird knapp und natürlich wiedergegeben.
- source_word: ἄρχων
  choice: ein führender Mann
  rationale: ἄρχων bezeichnet eine Person in einer Autoritätsstellung. „Ein führender Mann“ ist im modernen Deutschen natürlicher als „ein Herrscher“ und legt das genaue Amt nicht stärker fest als der Ausgangstext.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Der Ausdruck kann in Johannes ethnisch, regional oder auf jüdische Autoritäten bezogen sein. In Verbindung mit ἄρχων liegt hier eine Leitungsfunktion innerhalb des jüdischen Volkes beziehungsweise seiner Institutionen nahe; die breitere Formulierung bleibt im Haupttext erhalten.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαίων im Johannesevangelium
  choice: der Juden
  alternative: der Judäer / der jüdischen Obrigkeit
  rationale: Der Kontext stellt Nikodemus als Pharisäer und Autorität vor. „Der Juden“ bewahrt den breiten ethnisch-religiösen Bezug, während die Fußnote die mögliche regionale oder institutionelle Zuspitzung offenhält.
- issue: Amtliche Stellung des Nikodemus
  choice: ein führender Mann
  alternative: ein Ratsherr / ein Mitglied des Hohen Rates
  rationale: Der Ausdruck ἄρχων weist auf Autorität hin, nennt aber in diesem Vers nicht ausdrücklich ein bestimmtes Gremium. Daher wird eine mögliche Zugehörigkeit zum Hohen Rat nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung vermeidet ein zusätzliches „Nun“ und klingt dennoch erzählerisch natürlich. „Führender Mann“ bezeichnet Autorität, ohne ein nicht ausdrücklich genanntes Amt vorauszusetzen.
