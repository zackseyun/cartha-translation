  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: de
  text: Und jetzt habe ich es euch gesagt, bevor es geschieht, damit ihr glaubt, wenn es geschieht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bevor es eintritt … wenn es eintritt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und jetzt
  rationale: Bewahrt sowohl den Anschluss durch καί als auch die Zeitangabe νῦν in natürlichem modernem Deutsch.
- source_word: εἴρηκα ὑμῖν
  choice: habe ich es euch gesagt
  rationale: Das Perfekt εἴρηκα bezeichnet eine bereits erfolgte Aussage mit gegenwärtiger Bedeutung. Das ergänzte „es“ verweist natürlich auf das angekündigte Geschehen, das im Griechischen unausgesprochen bleibt.
- source_word: πρὶν γενέσθαι
  choice: bevor es geschieht
  rationale: πρίν mit dem Aoristinfinitiv bedeutet „bevor es geschieht/eintritt“. Das Präsens ist nach „bevor“ im Deutschen die natürliche Form für ein zukünftiges Ereignis.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Zweckbedeutung der Konjunktion knapp und idiomatisch wieder.
- source_word: ὅταν γένηται
  choice: wenn es geschieht
  rationale: ὅταν mit Konjunktiv bezeichnet hier ein künftig erwartetes Eintreten. Die Wiederholung von „geschieht“ bewahrt die Wiederholung von γίνομαι.
- source_word: πιστεύσητε
  choice: ihr glaubt
  rationale: „Glauben“ ist im johanneischen Sprachgebrauch die natürliche Standardwiedergabe von πιστεύω. Im deutschen Finalsatz nach „damit“ ist kein zusätzliches Modalverb nötig.
theological_decisions:
- issue: Bedeutung von πιστεύσητε im Zusammenhang
  choice: damit ihr glaubt
  alternative: damit ihr weiter glaubt / damit ihr vertraut
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob neuer Glaube entstehen oder bestehender Glaube gestärkt werden soll. Die allgemeine Formulierung „ihr glaubt“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung desselben Verbs spiegelt die Wiederholung von γίνομαι im Ausgangstext; die Wortstellung bleibt natürlich und gut verständlich.
