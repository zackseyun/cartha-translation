id: JHN.14.17
reference: John 14:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: de
  text: den Geist der Wahrheit[a], den die Welt nicht empfangen kann, weil sie ihn weder sieht noch kennt. Ihr kennt ihn, denn er bleibt bei euch und wird in euch sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Geist der Wahrheit“. Gemeint ist im Zusammenhang der Heilige Geist.'
    reason: lexical_clarification
  - marker: b
    text: 'Oder: „wird unter euch sein“. Das griechische „euch“ steht im Plural; „in euch“ bewahrt jedoch am deutlichsten den Gegensatz zu „bei euch“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: den Geist der Wahrheit
  rationale: Die Genitivverbindung bleibt erhalten; die Großschreibung kennzeichnet im johanneischen Zusammenhang den Heiligen Geist, ohne den Ausdruck auszuweiten.
- source_word: ὃ
  choice: den
  rationale: Obwohl πνεῦμα im Griechischen grammatisch sächlich ist, ist „Geist“ im Deutschen maskulin. Das Relativpronomen folgt natürlicherweise dem deutschen Genus und passt zugleich zum persönlichen Bezug im Kontext.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Bewahrt den für Johannes charakteristischen, bewusst weit gefassten Ausdruck, ohne ihn auf Menschheit oder ein bestimmtes Weltsystem einzuengen.
- source_word: οὐ δύναται λαβεῖν
  choice: nicht empfangen kann
  rationale: Gibt sowohl die Unfähigkeit als auch den Grundsinn von λαμβάνω wieder und klingt in modernem Deutsch natürlich.
- source_word: οὐ θεωρεῖ αὐτὸ οὐδὲ γινώσκει
  choice: sie ihn weder sieht noch kennt
  rationale: „sieht“ bewahrt die anschauliche Wahrnehmungskomponente von θεωρεῖ; „kennt“ hält die Wortverbindung zu γινώσκετε im folgenden Satz aufrecht.
- source_word: ὑμεῖς γινώσκετε αὐτό
  choice: Ihr kennt ihn
  rationale: Die ausdrückliche Nennung von „ihr“ trägt den Kontrast zur Welt. Ein zusätzliches „aber“ ist nicht nötig.
- source_word: παρ’ ὑμῖν μένει
  choice: er bleibt bei euch
  rationale: „bleibt“ wahrt das johanneische Schlüsselverb μένω; „bei euch“ gibt παρά mit Dativ idiomatisch wieder.
- source_word: ἐν ὑμῖν ἔσται
  choice: wird in euch sein
  rationale: Bewahrt die Zukunftsform des SBLGNT und den Unterschied zwischen παρά („bei“) und ἐν („in“). Da ὑμῖν Plural ist, bleibt „unter euch“ als mögliche korporative Lesart in der Fußnote sichtbar.
theological_decisions:
- issue: Persönlicher Bezug auf den Geist trotz des grammatisch sächlichen πνεῦμα
  choice: 'Im Deutschen maskuline Personal- und Relativpronomen verwenden: „den“, „ihn“, „er“'
  alternative: Grammatisch am griechischen Neutrum orientierte Formen wie „das“ oder „es“
  rationale: Das deutsche Substantiv „Geist“ ist maskulin, sodass diese Pronomen grammatisch erforderlich und natürlich sind. Zugleich lässt der Kontext den Geist als persönlichen Handelnden erscheinen; die Übersetzung macht daraus jedoch keine weitergehende dogmatische Aussage.
- issue: Verhältnis von „bei euch“ und „in euch“
  choice: 'Beide Präpositionalwendungen unterscheidbar wiedergeben: „bei euch“ und „in euch“'
  alternative: Die zweite Wendung korporativ mit „unter euch“ übersetzen
  rationale: Die Übersetzung bewahrt den Wechsel von παρά zu ἐν sowie die Zukunftsform. Die mögliche korporative Bedeutung des pluralischen „euch“ wird nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Bleibt“ erhält die johanneische Leitwortverbindung; weder „verweilt“ noch das traditionellere „wohnt“ wurde gewählt. Die Fußnotenmarker [a] und [b] stehen vollständig im Haupttext.
