  source_fidelity: 'Der deutsche Text gibt die griechische Satzstruktur und die zentralen Bedeutungen zuverlässig wieder: „Geist der Wahrheit“, die Unfähigkeit der Welt zu empfangen, „weder sieht noch kennt“, der hervorgehobene Kontrast „Ihr kennt ihn“ sowie die Unterscheidung von παρ’ ὑμῖν („bei euch“) und ἐν ὑμῖν („in euch“). Die Zukunftsform „wird ... sein“ entspricht dem SBLGNT-Text ἔσται.'
