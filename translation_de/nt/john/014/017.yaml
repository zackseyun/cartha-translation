  terminology: „Geist der Wahrheit“, „Welt“, „empfangen“, „kennen“ und „bei/in euch“ sind terminologisch präzise und konsistent. Die Fußnote zu „unter euch“ dokumentiert angemessen die mögliche korporative Nuance des pluralischen ὑμῖν, ohne die im Text bewahrte Präpositionsdifferenz aufzuheben.
