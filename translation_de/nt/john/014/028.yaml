source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: de
  text: 'Ihr habt gehört, dass ich zu euch gesagt habe: »Ich gehe fort und komme zu euch.« Wenn ihr mich lieben würdet, hättet ihr euch gefreut[a], dass ich zum Vater gehe; denn der Vater ist größer als ich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „würdet ihr euch freuen“. Die griechische Form lässt diese Wiedergabe zu; im Zusammenhang passt „hättet ihr euch gefreut“ jedoch besser zur irrealen Bedingung.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „Der Vater ist größer als ich“ wird ihrem Wortlaut entsprechend wiedergegeben, ohne einen deutenden Zusatz wie „seiner Stellung nach“ oder „während meines irdischen Daseins“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Ihr habt gehört
  rationale: Der Aorist bezeichnet hier das bereits erfolgte Hören der früheren Aussage Jesu. Im Deutschen ist das Perfekt in direkter Rede natürlich und gegenwartssprachlich.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: dass ich zu euch gesagt habe
  rationale: ὅτι leitet den Inhalt des Gehörten ein; die explizite Wiedergabe mit „dass“ bewahrt den griechischen Satzbau in natürlichem Deutsch.
- source_word: Ὑπάγω
  choice: Ich gehe fort
  rationale: Das Präsens hat im Kontext bevorstehende Bedeutung. „fortgehen“ gibt die Bewegung weg von den Jüngern prägnant wieder.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: komme zu euch
  rationale: Das griechische Präsens wird beibehalten und bewahrt die lebendige, zugleich zukunftsbezogene Formulierung.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Wenn ihr mich lieben würdet
  rationale: Der Imperfekt in der irrealen Bedingung wird im Deutschen idiomatisch mit Konjunktiv II wiedergegeben, ohne die Aussage als schlichten Vorwurf zu verflachen.
- source_word: ἐχάρητε ἄν
  choice: hättet ihr euch gefreut
  rationale: Aorist mit ἄν bildet die irreale Folge. Der Konjunktiv II der Vergangenheit gibt die unterbliebene Reaktion am genauesten wieder.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: ich zum Vater gehe
  rationale: „zum Vater gehen“ ist natürlich und wahrt sowohl die Bewegung als auch das relationale Ziel. Der Artikel wird in der etablierten titularen Form „der Vater“ wiedergegeben.
- source_word: μείζων μού
  choice: größer als ich
  rationale: Die schlichte Vergleichsaussage wird ohne deutende Ergänzung übersetzt. „als ich“ ist in gehobenem Standarddeutsch grammatisch und stilistisch angemessen.
theological_decisions:
- issue: Bedeutung der Aussage „der Vater ist größer als ich“
  choice: Die uneingeschränkte Vergleichsaussage „der Vater ist größer als ich“ bleibt im Haupttext stehen.
  alternative: Deutende Zusätze wie „seiner Stellung nach“ oder „während meines irdischen Daseins“
  rationale: Der griechische Text nennt keinen Vergleichsaspekt. Eine Ergänzung würde eine theologische Deutung in die Übersetzung eintragen und die echte Spannung des Textes vorzeitig auflösen.
- issue: Irreale Bedingung „Wenn ihr mich lieben würdet“
  choice: Wiedergabe als gegenwärtige irreale Bedingung mit vergangener irrealer Folge
  alternative: „Wenn ihr mich liebt, werdet ihr euch freuen“ oder eine rein allgemeine Bedingung
  rationale: Die Kombination aus Imperfekt in der Protasis und Aorist mit ἄν in der Apodosis spricht für eine kontrafaktische Aussage; zugleich wird durch eine Fußnote auf die mögliche allgemeinere Wiedergabe der Folge hingewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „ihr/euch“ ist der Pluralform des griechischen Textes entsprechend gewählt. Perfekt und Konjunktiv II sorgen für natürliche Gegenwartssprache; die knappe Vergleichsaussage am Schluss bleibt bewusst unaufgelöst.
