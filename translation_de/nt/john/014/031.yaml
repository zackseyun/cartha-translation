id: JHN.14.31
reference: John 14:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: de
  text: Aber damit die Welt erkennt, dass ich den Vater liebe und so handle, wie der Vater es mir befohlen hat. Steht auf, lasst uns von hier weggehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Aber
  rationale: Bewahrt den adversativen Anschluss an die vorausgehende Aussage.
- source_word: ἵνα γνῷ ὁ κόσμος
  choice: die Welt soll erkennen
  rationale: Gibt den Zwecksinn von ἵνα mit Konjunktiv in natürlichem Deutsch wieder, ohne den johanneischen Ausdruck »die Welt« aufzulösen.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: ich den Vater liebe
  rationale: Der einfache Präsensausdruck und der bestimmte Titel »der Vater« entsprechen dem Griechischen; ein nicht ausdrücklich vorhandenes »meinen« wird nicht ergänzt.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: so handle, wie der Vater es mir aufgetragen hat
  rationale: Bewahrt die Entsprechung von καθώς und οὕτως. »Aufgetragen« erhält den verbindlichen Charakter von ἐντέλλομαι und klingt im Deutschen hier natürlicher als »befohlen«.
- source_word: Ἐγείρεσθε
  choice: Steht auf
  rationale: Direkte und natürliche Wiedergabe des pluralischen Imperativs im situativen Zusammenhang.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: lasst uns von hier weggehen
  rationale: Gibt den hortativen Konjunktiv und die örtliche Bedeutung von ἐντεῦθεν klar und idiomatisch wieder.
theological_decisions:
- issue: Relationaler Titel πατήρ in der johanneischen Christologie
  choice: der Vater
  alternative: mein Vater
  rationale: Der bestimmte Titel wird ohne ein im Griechischen nicht vorhandenes Possessivpronomen wiedergegeben; so bleibt die Vater-Sohn-Beziehung textnah formuliert.
- issue: Verbindlichkeit von ἐντέλλομαι im Verhältnis des Vaters zum Sohn
  choice: aufgetragen
  alternative: befohlen
  rationale: »Aufgetragen« bezeichnet einen verbindlichen Auftrag und wahrt den Gehorsamsgedanken, ohne im modernen Deutschen unnötig einen herrischen Beiklang einzutragen.
- issue: Syntaktische Reichweite des Zwecksatzes
  choice: Der Satz lässt Jesu Handeln als Teil dessen erscheinen, woran die Welt seine Liebe zum Vater erkennt.
  alternative: Der Zwecksatz könnte enger nur auf »dass ich den Vater liebe« bezogen und die folgende Aussage als neuer Hauptsatz verstanden werden.
  rationale: Die koordinierende Verbindung mit καί sowie die korrelative Struktur καθώς … οὕτως sprechen dafür, die Liebe und das entsprechende Handeln eng zusammenzuhalten; die mögliche engere Gliederung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Steht auf« ist klarer und gegenwärtiger als das gehobenere »Erhebt euch«; »von hier weggehen« gibt den Aufbruch ausdrücklich wieder. Die Satzstellung hält Liebe und gehorsames Handeln eng zusammen und bewahrt die alternative Gliederung in einer Fußnote.
