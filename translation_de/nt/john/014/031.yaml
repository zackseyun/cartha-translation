revisions:
- from: Aber die Welt soll erkennen, dass ich den Vater liebe und so handle, wie der Vater es mir aufgetragen hat.[a] Steht auf, lasst uns von hier weggehen!
  to: Aber damit die Welt erkennt, dass ich den Vater liebe und so handle, wie der Vater es mir befohlen hat. Steht auf, lasst uns von hier weggehen.
  rationale: Die Revision macht den Zweckcharakter ausdrücklich, gibt die Entsprechung von καθώς … οὕτως mit »so … wie« wieder und übersetzt ἐνετείλατο mit dem verbindlicheren »befohlen hat«. Die knappe Satzfügung lässt offen, wie weit der finale Zusammenhang diskursiv zu fassen ist, ohne eine interpretierende Fußnote zu benötigen.
