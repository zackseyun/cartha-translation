  verdict: revise
  source_fidelity: Die Übersetzung trifft den adversativen Anschluss, den Zweck von ἵνα, den johanneischen Ausdruck »die Welt«, die Titelbezeichnung »der Vater« sowie die beiden Aufforderungen grundsätzlich gut. »Die Welt soll erkennen« ist jedoch weniger eindeutig final als »damit die Welt erkennt«. Außerdem schwächt »aufgetragen« die verbindliche Bedeutung von ἐνετείλατο gegenüber »befohlen« etwas ab.
  naturalness: Der Entwurf ist gut verständlich und modernes Standarddeutsch. Mit »Aber damit die Welt erkennt« wird der Satzbau zugleich idiomatischer und näher an der griechischen Zweckkonstruktion. Ein Punkt statt eines Ausrufezeichens bei der abschließenden Aufforderung wahrt den zurückhaltenden Ton des Ausgangstextes.
  terminology: »Der Vater« und »die Welt« sind angemessen und konsistent mit der johanneischen Terminologie. »Befohlen« gibt ἐντέλλομαι hier genauer wieder als »aufgetragen«, ohne eine weitergehende theologische Deutung einzutragen.
