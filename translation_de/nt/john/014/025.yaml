  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: de
  text: Das habe ich zu euch gesagt, während ich bei euch bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während ich bei euch bleibe“. Das griechische Wort bedeutet „bleiben“ und ist ein wiederkehrender Ausdruck im Johannesevangelium.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Das
  rationale: Das substantivierte Demonstrativpronomen verweist zusammenfassend auf die vorausgehenden Worte. Im Deutschen ist der Singular „Das“ hier natürlicher als „diese Dinge“, ohne den Rückbezug einzuengen.
- source_word: λελάληκα
  choice: habe ich gesagt
  rationale: Das Perfekt gibt die vollzogene Rede mit gegenwärtiger Relevanz wieder. „Gesagt“ ist im modernen Deutschen idiomatischer als „gesprochen“ und entspricht dem Kontext direkter Unterweisung.
- source_word: ὑμῖν
  choice: zu euch
  rationale: Der Dativ Plural bezeichnet die angesprochenen Jünger. „Zu euch“ gibt sowohl die Redehandlung als auch den Plural klar wieder.
- source_word: παρ’ ὑμῖν
  choice: bei euch
  rationale: παρά mit Dativ bezeichnet hier persönliche Nähe beziehungsweise Anwesenheit. „Bei euch“ ist die natürliche deutsche Entsprechung.
- source_word: μένων
  choice: während ich … bin
  rationale: Das präsentische Partizip bezeichnet den gleichzeitigen Zustand des Bleibens beziehungsweise Anwesendseins. Die finite Wiedergabe ist im Deutschen natürlich; eine Fußnote macht die lexikalische Verbindung zu μένω sichtbar.
theological_decisions:
- issue: Johanneische Leitwortfunktion von μένω
  choice: während ich bei euch bin
  alternative: während ich bei euch bleibe
  rationale: Im unmittelbaren Zusammenhang steht Jesu gegenwärtige Anwesenheit im Vordergrund. „Bei euch bin“ klingt natürlich und lässt die zeitliche Spannung zur angekündigten Sendung des Beistands bestehen; die Alternative bewahrt das wiederkehrende Verb „bleiben“ unmittelbarer und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist idiomatisch und gut verständlich; die Fußnote bewahrt die johanneische Wortverbindung, ohne im Haupttext unnatürlich zu wirken.
