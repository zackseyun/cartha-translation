  verdict: approve
  source_fidelity: 'Der deutsche Text gibt den griechischen Ausgangstext vollständig und präzise wieder: Das historische Präsens λέγει ist angemessen mit „sagt“ wiedergegeben; die betonte Selbstaussage „Ich bin“ sowie die drei bestimmten Prädikate bleiben erhalten. „Niemand kommt zum Vater außer durch mich“ entspricht der ausschließenden Konstruktion οὐδεὶς … εἰ μὴ δι’ ἐμοῦ ohne Abschwächung oder Zusatz.'
  naturalness: „Jesus sagt zu ihm“ ist als erzählendes Präsens im Deutschen natürlich, besonders in einer direkten Gesprächsszene. Die Formulierung ist modernes, würdiges Standarddeutsch. Die Wiederholung von „und“ ist leicht feierlich, aber idiomatisch und der rhetorischen Gestalt des griechischen Satzes angemessen.
  terminology: „Weg“, „Wahrheit“, „Leben“ und „Vater“ sind etablierte, lexikalisch genaue und theologisch nicht einengende Wiedergaben. „Außer durch mich“ bewahrt die instrumentale bzw. vermittelte Bedeutung von διά mit Genitiv. Die Großschreibung von „Vater“ ist im Kontext angemessen.
