id: JHN.14.6
reference: John 14:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: de
  text: 'Jesus sagt zu ihm: „Ich bin der Weg und die Wahrheit und das Leben. Niemand kommt zum Vater außer durch mich.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: sagt zu ihm
  rationale: Das historische Präsens des Griechischen lässt sich im Deutschen hier natürlich und unmittelbar als „sagt zu ihm“ wiedergeben; αὐτῷ bezeichnet den Empfänger der Rede.
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die direkte Wiedergabe bewahrt die durch das ausdrücklich gesetzte Pronomen hervorgehobene Selbstaussage Jesu, ohne künstliche typografische Betonung.
- source_word: ἡ ὁδός
  choice: der Weg
  rationale: „Weg“ erfasst sowohl die konkrete Grundbedeutung als auch den hier maßgeblichen übertragenen Sinn des Zugangs zum Vater.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: „Wahrheit“ entspricht der lexikalischen Grundbedeutung und lässt die weitergehenden johanneischen Bedeutungsnuancen offen.
- source_word: ἡ ζωή
  choice: das Leben
  rationale: „Leben“ bewahrt die breite theologische Bedeutung des Begriffs im Johannesevangelium, ohne sie durch eine erklärende Ergänzung einzuengen.
- source_word: οὐδεὶς ἔρχεται
  choice: Niemand kommt
  rationale: Die Formulierung gibt die allgemeingültige Aussage des griechischen Präsens knapp und idiomatisch wieder.
- source_word: πρὸς τὸν πατέρα
  choice: zum Vater
  rationale: πρός mit Akkusativ bezeichnet die Bewegung beziehungsweise Hinwendung auf ein Ziel zu; „zum Vater“ ist im Deutschen die natürliche Entsprechung.
- source_word: εἰ μὴ δι’ ἐμοῦ
  choice: außer durch mich
  rationale: εἰ μή hat hier ausschließende Bedeutung, während διά mit Genitiv das Mittel beziehungsweise die Vermittlung bezeichnet. „Außer durch mich“ bewahrt beides präzise und natürlich.
theological_decisions:
- issue: Ausschließlichkeit des Zugangs zum Vater durch Jesus
  choice: „Niemand kommt zum Vater außer durch mich.“
  alternative: „Niemand kommt zum Vater, es sei denn durch mich.“
  rationale: Die ausschließende Aussage des griechischen Textes wird weder abgeschwächt noch über ihren Wortlaut hinaus erläutert. Die gewählte Fassung ist im heutigen Deutsch klarer und ebenso genau.
- issue: Dreigliedrige johanneische Prädikatsfolge
  choice: „der Weg und die Wahrheit und das Leben“
  alternative: „der Weg, die Wahrheit und das Leben“
  rationale: Die wiederholten Artikel und Konjunktionen des Griechischen heben jedes der drei Prädikate eigenständig hervor. Die Wiederholung von „und“ erhält diesen feierlichen rhetorischen Nachdruck und bleibt im Deutschen verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wurde beibehalten, weil es im Deutschen in dieser direkten Gesprächsszene natürlich wirkt. Die bekannte, rhythmisch gewichtige Dreierformel bleibt eng an der griechischen Struktur.
