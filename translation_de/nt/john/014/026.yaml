id: JHN.14.26
reference: John 14:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: de
  text: Der Beistand[a] aber, der Heilige Geist, den der Vater in meinem Namen senden wird, er wird euch alles lehren und euch an alles erinnern, was ich euch gesagt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Fürsprecher“, „Helfer“ oder „Tröster“; das griechische Wort paráklētos umfasst unterstützende und vertretende Bedeutungsnuancen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Beistand
  rationale: „Beistand“ bezeichnet eine Person, die unterstützend und vertretend zur Seite steht, und bewahrt damit sowohl den helfenden als auch den anwaltlichen Klang des griechischen Titels. Da kein einzelnes deutsches Wort das gesamte Bedeutungsspektrum erfasst, nennt die Fußnote wichtige Alternativen.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Dies ist die natürliche und etablierte moderne deutsche Wiedergabe des Titels; die Apposition identifiziert den Beistand ausdrücklich als den Heiligen Geist.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: den der Vater … senden wird
  rationale: Das Relativpronomen bezieht sich im Deutschen natürlich auf den grammatisch maskulinen und personalen Titel „Beistand“. Das Futur gibt πέμψει direkt wieder.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die feste Wendung bewahrt die mögliche Bedeutung von Beauftragung, Repräsentation und Autorität, ohne eine einzelne Nuance festzuschreiben.
- source_word: ἐκεῖνος
  choice: er
  rationale: Das ausdrücklich gesetzte maskuline Demonstrativpronomen hebt den zuvor genannten παράκλητος wieder auf. Das eigenständige „er“ erhält diese Hervorhebung und die personale Handlungsfähigkeit im Deutschen.
- source_word: διδάξει ὑμᾶς πάντα
  choice: wird euch alles lehren
  rationale: Die Formulierung folgt der griechischen Konstruktion eng und ist zugleich klares, gegenwärtiges Deutsch.
- source_word: ὑπομνήσει ὑμᾶς
  choice: wird euch … erinnern
  rationale: „Jemanden an etwas erinnern“ gibt den kausativen Sinn von ὑπομιμνῄσκω idiomatisch und präzise wieder.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: alles, was ich euch gesagt habe
  rationale: Die Wiedergabe bewahrt die umfassende Aussage und die Relativkonstruktion des griechischen Textes in natürlichem Deutsch.
theological_decisions:
- issue: Personale Rede vom Heiligen Geist
  choice: Personale Bezugnahme durch „den“ und das hervorgehobene „er“
  alternative: Eine unpersönliche Wiedergabe, die sich allein am grammatischen Neutrum von πνεῦμα orientiert
  rationale: Der Text verbindet das neutrale πνεῦμα mit dem personalen, maskulinen Titel παράκλητος und nimmt diesen durch ἐκεῖνος ausdrücklich wieder auf. Die deutsche Formulierung lässt diese personale Handlungsweise erkennen, ohne über den Vers hinauszugehen.
- issue: Wiedergabe von παράκλητος
  choice: Beistand
  alternative: Fürsprecher, Helfer oder Tröster
  rationale: Der Titel vereint unterstützende, vertretende und tröstende Aspekte. „Beistand“ ist im Deutschen breit genug, um diese Spannung nicht auf eine rein juristische oder rein emotionale Funktion zu verengen; die Alternativen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme „er wird“ ist bewusst leicht markiert, um das emphatische ἐκεῖνος des Ausgangstextes abzubilden. Die Satzstruktur bleibt gut verständlich, ohne die theologisch bedeutsamen Bezüge zu glätten.
