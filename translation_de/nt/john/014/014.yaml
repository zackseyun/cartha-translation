  text: If you ask me anything in my name[a], I will do it.
translation:
  language: de
  text: Wenn ihr mich[a] um etwas in meinem Namen bittet, werde ich es tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen „mich“ aus und lauten: „Wenn ihr um etwas in meinem Namen bittet, werde ich es tun.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Wenn
  rationale: Leitet mit dem Konjunktiv eine Bedingung ein; „wenn“ ist hier die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: τι
  choice: um etwas
  rationale: Das indefinite Pronomen bezeichnet einen nicht näher bestimmten Gegenstand der Bitte. In Verbindung mit „bitten“ ist die deutsche Konstruktion „um etwas bitten“ idiomatisch.
- source_word: αἰτήσητέ
  choice: ihr … bittet
  rationale: Aorist Aktiv Konjunktiv, zweite Person Plural, abhängig von ἐάν. Im deutschen Konditionalsatz gibt das Präsens die Aussage natürlich wieder; „bitten“ bewahrt den Sinn einer Bitte oder eines Ersuchens.
- source_word: με
  choice: mich
  rationale: Das direkte Objekt steht im SBLGNT ausdrücklich im Text und wird daher wiedergegeben.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die geläufige Wendung wahrt den Bezug auf Jesu Namen, Person und Vollmacht, ohne diesen im Haupttext interpretierend auszuweiten.
- source_word: ἐγὼ
  choice: ich
  rationale: Das im Griechischen ausdrücklich gesetzte Personalpronomen trägt eine gewisse Betonung. Im Deutschen ist „ich“ als genanntes Subjekt ausreichend; „ich selbst“ wäre stärker als nötig.
- source_word: ποιήσω
  choice: werde ich es tun
  rationale: Das Futur bezeichnet Jesu zugesagtes Handeln. Das Pronomen „es“ greift idiomatisch den Inhalt der zuvor genannten Bitte auf.
theological_decisions:
- issue: Das Vorhandensein von με („mich“) und die damit verbundene ausdrückliche Adressierung Jesu
  choice: „Wenn ihr mich … bittet“ im Haupttext
  alternative: „Wenn ihr in meinem Namen um etwas bittet, werde ich es tun.“
  rationale: Der vorgegebene griechische Ausgangstext enthält με. Diese Lesart wird übersetzt, während die wichtige Variante ohne das Pronomen in einer Fußnote transparent gemacht wird. So bleibt die christologische Spannung der Überlieferung erhalten, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Pluralanrede „ihr“ bildet die zweite Person Plural ab. Die Wortstellung hält „mich“ und „in meinem Namen“ klar auseinander und bleibt zugleich natürlich.
