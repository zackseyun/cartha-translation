id: JHN.14.24
reference: John 14:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: de
  text: Wer mich nicht liebt, hält sich nicht an meine Worte. Und das Wort, das ihr hört, ist nicht mein, sondern das des Vaters, der mich gesandt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Wer mich nicht liebt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, den fehlende Liebe zu Jesus kennzeichnet. Die deutsche Wer-Konstruktion gibt dies natürlich und prägnant wieder.
- source_word: τοὺς λόγους μου οὐ τηρεῖ
  choice: hält sich nicht an meine Worte
  rationale: τηρέω bezeichnet hier das bewahrende Befolgen von Jesu Worten. „Sich an etwas halten“ ist im heutigen Deutsch natürlich und wahrt sowohl den Gehorsams- als auch den Bewahrungsaspekt besser als das missverständliche „meine Worte halten“.
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: das Wort, das ihr hört
  rationale: Der Singular λόγος wird als „Wort“ bewahrt, um die johanneische Ausdrucksweise und den Wechsel vom Plural zum Singular sichtbar zu lassen; „das ihr hört“ gibt das Präsens ohne interpretierende Ergänzung wieder.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: ist nicht mein eigenes
  rationale: „Nicht mein eigenes“ gibt das prädikative ἐμός idiomatisch wieder und bezeichnet hier nicht eine Verleugnung der Lehre, sondern ihre nicht unabhängige Herkunft.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: sondern kommt von dem Vater, der mich gesandt hat
  rationale: Der Genitiv bezeichnet im Kontrast zu ἐμός Zugehörigkeit beziehungsweise Herkunft. „Kommt von“ macht den in der elliptischen griechischen Konstruktion liegenden Herkunftssinn in natürlichem Deutsch deutlich, während der Relativsatz eindeutig „dem Vater“ zugeordnet bleibt.
theological_decisions:
- issue: Verhältnis zwischen Jesu Wort und dem Wort des Vaters
  choice: „ist nicht mein eigenes, sondern kommt von dem Vater“
  alternative: „gehört nicht mir, sondern dem Vater“
  rationale: Die Formulierung bewahrt die Unterscheidung zwischen Jesus und dem Vater sowie die Herkunft des verkündeten Wortes aus dem Sendungsauftrag. Sie deutet Jesu Aussage weder als Verleugnung seiner Lehre noch löst sie die im Text bestehende Spannung durch eine dogmatische Zusatzformulierung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural wird mit „ihr“ wiedergegeben. „Hält sich an“ ist bewusst idiomatischer als das im Deutschen ungewöhnliche „hält meine Worte“; „mein eigenes“ und „kommt von“ ergeben einen verständlichen Kontrast von Eigenursprung und Herkunft.
