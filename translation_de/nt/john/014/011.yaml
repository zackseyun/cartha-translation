source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: de
  text: Glaubt mir, dass ich im Vater bin und der Vater in mir ist. Wenn aber nicht[a], dann glaubt aufgrund der Werke selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sein kann: „Wenn ihr mir darin nicht glaubt.“ Der griechische Ausdruck ist knapp und lässt die Ergänzung unausgesprochen.'
    reason: Elliptische Formulierung im Ausgangstext; die Fußnote erläutert die naheliegende Ergänzung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Glaubt mir
  rationale: πιστεύω mit dem Dativ μοι bezeichnet hier, jemandem bzw. seiner Aussage Glauben zu schenken. „Glaubt mir“ ist im Deutschen direkt und idiomatisch, ohne den persönlichen Appell zu erweitern.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was geglaubt werden soll. „Dass“ gibt diese Objektsatzfunktion präzise wieder.
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: ich im Vater bin und der Vater in mir ist
  rationale: Die wiederholte Präposition ἐν wird mit „in“ bewahrt. So bleibt die johanneische Aussage wechselseitigen Inseins erhalten, ohne sie durch „eins mit“ auszulegen.
- source_word: εἰ δὲ μή
  choice: Wenn aber nicht
  rationale: Die knappe elliptische Wendung eröffnet eine alternative Grundlage des Glaubens. Die Übersetzung wahrt sowohl den Gegensatz als auch die im Griechischen nicht ausdrücklich ergänzte Bedingung.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: aufgrund der Werke selbst
  rationale: διά mit Akkusativ nennt hier den Grund bzw. die Grundlage des Glaubens. „Aufgrund“ ist klares modernes Deutsch; „selbst“ bewahrt die Hervorhebung durch αὐτά.
- source_word: πιστεύετε
  choice: glaubt
  rationale: Der abschließende Imperativ wird ohne ergänztes Objekt wiedergegeben, da auch der griechische Text keines nennt. Dadurch bleibt offen, ob gedanklich „mir“, „dies“ oder ein umfassenderes Glauben mitzuhören ist.
theological_decisions:
- issue: Wechselseitiges Insein Jesu und des Vaters
  choice: Die Formulierung „ich im Vater bin und der Vater in mir ist“ wird wörtlich-relational beibehalten.
  alternative: „Ich bin eins mit dem Vater, und der Vater ist eins mit mir.“
  rationale: Der Text spricht mit ἐν ausdrücklich vom wechselseitigen Insein. Eine Wiedergabe mit „eins mit“ würde diese Aussage dogmatisch paraphrasieren und die charakteristische johanneische Bildsprache ersetzen.
- issue: Die Werke als Grundlage des Glaubens
  choice: 'Der zweite Imperativ bleibt ohne ausdrückliches Objekt: „glaubt aufgrund der Werke selbst“.'
  alternative: „Glaubt mir aufgrund der Werke selbst“ oder „Glaubt an mich aufgrund der Werke selbst“.
  rationale: Das abschließende πιστεύετε besitzt im Griechischen kein genanntes Objekt. Die knappe deutsche Form bewahrt diese Offenheit und stellt zugleich klar, dass die Werke die Grundlage für den geforderten Glauben bilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem griechischen Plural im vertrauten Plural „ihr“. Der Haupttext wahrt die knappe Syntax und die theologisch gewichtige In-Formulierung des Johannesevangeliums.
