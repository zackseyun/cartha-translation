  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: de
  text: Ich werde euch nicht als Waisen zurücklassen; ich komme zu euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ich komme zu euch“ kann sich auf Jesu Kommen nach der Auferstehung, sein Kommen durch den Heiligen Geist oder seine künftige Wiederkunft beziehen; der griechische Wortlaut legt keine dieser Deutungen eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: werde … zurücklassen
  rationale: Das Futur von ἀφίημι bezeichnet hier das Zurücklassen. „Zurücklassen“ gibt den Zusammenhang mit dem folgenden Bild der Waisen im Deutschen natürlich und präzise wieder.
- source_word: ὀρφανούς
  choice: als Waisen
  rationale: Die konkrete familiäre Vorstellung von Kindern ohne elterliche Fürsorge bleibt erhalten, ohne sie auf ein bloßes Gefühl des Verlassenseins zu reduzieren.
- source_word: ἔρχομαι
  choice: ich komme
  rationale: Das griechische Präsens wird als Präsens wiedergegeben und bewahrt so die unmittelbare, lebendige Ausdrucksweise; der Kontext kann eine bevorstehende Ankunft anzeigen.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Bei einem Verb der Bewegung ist dies die natürliche deutsche Wiedergabe der durch πρός mit Akkusativ bezeichneten Hinwendung.
- source_word: Οὐκ
  choice: nicht
  rationale: Die einfache Verneinung wird zusammen mit dem deutschen Futur idiomatisch als „werde … nicht“ ausgedrückt.
theological_decisions:
- issue: Bezug und Zeitpunkt von „ich komme zu euch“
  choice: Die Formulierung bleibt ohne zeitliche oder heilsgeschichtliche Festlegung stehen.
  alternative: Gemeint sein könnten Jesu Begegnungen mit den Jüngern nach der Auferstehung, sein Kommen durch den Heiligen Geist oder seine künftige Wiederkunft.
  rationale: Der griechische Wortlaut bestimmt den Bezug nicht eindeutig. Die Übersetzung bewahrt daher die im Zusammenhang bestehende theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als Waisen zurücklassen“ bewahrt das anschauliche Familienbild; die knappe Präsensform „ich komme“ erhält die Unmittelbarkeit und Mehrdeutigkeit des Originals.
