id: JHN.14.8
reference: John 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: de
  text: 'Philippus sagt zu ihm: »Herr, zeig uns den Vater, und das genügt uns.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzähltextes lässt sich im Deutschen natürlich als Präsens wiedergeben und bewahrt die unmittelbare Erzählweise.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten der Rede; »zu ihm« entspricht der griechischen Formulierung.
- source_word: Φίλιππος
  choice: Philippus
  rationale: Die im Deutschen eingebürgerte biblische Namensform wird verwendet.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist hier eine respektvolle Anrede an Jesus; »Herr« bewahrt sowohl die übliche Anredeform als auch das mögliche christologische Gewicht.
- source_word: δεῖξον
  choice: zeig
  rationale: Der Aoristimperativ fordert unmittelbar dazu auf, den Vater sichtbar beziehungsweise erkennbar zu machen; »zeig« ist klar und idiomatisch.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ Plural bezeichnet diejenigen, denen der Vater gezeigt werden soll.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Im johanneischen Zusammenhang bezeichnet der Ausdruck Gott als den Vater Jesu; die Großschreibung entspricht deutscher Bibel- und Schreibkonvention.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die Bitte mit der Aussage über deren Genügen, ohne das Verhältnis stärker auszudeuten.
- source_word: ἀρκεῖ ἡμῖν
  choice: das genügt uns
  rationale: ἀρκέω bedeutet »genügen, ausreichen«; das auf die erbetene Offenbarung zurückweisende »das« ergibt im Deutschen eine natürliche und präzise Formulierung.
theological_decisions:
- issue: Anrede κύριος an Jesus
  choice: Herr
  alternative: Mein Herr / Herr (im Sinn von respektvollem »Sir«)
  rationale: »Herr« erhält die im Griechischen vorhandene Spannweite zwischen respektvoller Anrede und christologisch gewichteter Bezeichnung, ohne sie ausdrücklich auf nur eine Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens bleibt erhalten; die direkte Rede ist knapp und natürlich formuliert.
