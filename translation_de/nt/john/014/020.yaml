  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: de
  text: An jenem Tag werdet ihr erkennen, dass ich in meinem Vater bin und ihr in mir seid und ich in euch bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das wiederholte „in“ gibt die Formulierung des griechischen Textes bewusst unmittelbar wieder und lässt ihre Bildsprache offen. Deutender wäre: „in Gemeinschaft mit“ oder „verbunden mit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: An jenem Tag
  rationale: Die Wendung ist temporal; „an jenem Tag“ ist im modernen Deutschen idiomatisch und bewahrt die bestimmte Verweisung durch ἐκείνῃ.
- source_word: γνώσεσθε ὑμεῖς
  choice: werdet ihr erkennen
  rationale: Das Futur von γινώσκω bezeichnet hier eine künftige Einsicht bzw. Erkenntnis. „Erkennen“ gibt diesen Aspekt natürlich wieder; das ausdrücklich gesetzte ὑμεῖς wird durch „ihr“ ausgedrückt, ohne das im Deutschen unnötig verstärkende „ihr selbst“.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet den Inhalt dessen ein, was die Jünger erkennen werden, nicht eine Begründung.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: ich in meinem Vater bin
  rationale: Die Präposition „in“ wird beibehalten, damit die johanneische Bildsprache nicht vorschnell als bloße Einheit oder Gemeinschaft ausgelegt wird.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: und ihr in mir seid
  rationale: Das im Griechischen fehlende Kopulaverb wird im Deutschen ergänzt. Das wiederholte „in“ bleibt erhalten.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: und ich in euch bin
  rationale: κἀγώ bedeutet „und ich“. Die parallele Formulierung wahrt die Aussage gegenseitigen In-Seins.
theological_decisions:
- issue: Johanneische Sprache des gegenseitigen In-Seins
  choice: Das dreimalige ἐν wird durchgehend mit „in“ wiedergegeben.
  alternative: „Ich bin mit meinem Vater eins, ihr seid mit mir verbunden, und ich bin mit euch verbunden.“
  rationale: Die wörtliche Präposition bewahrt die vielschichtige relationale und theologische Aussage, statt sie auf ontologische Einheit oder bloße Verbundenheit festzulegen.
- issue: Das Verhältnis Jesu zum Vater
  choice: „ich in meinem Vater bin“
  alternative: „ich mit meinem Vater eins bin“ oder „ich bei meinem Vater bin“
  rationale: Die Übersetzung erhält die starke christologische Aussage, ohne sie abzuschwächen oder durch eine spätere dogmatische Formulierung zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An jenem Tag“ ist natürlich und zugleich gehoben genug für den biblischen Kontext. Die ergänzten Formen von „sein“ sorgen in den verblosen griechischen Teilsätzen für klare deutsche Syntax; die Wiederholung von „bin/seid/bin“ dient außerdem der Verständlichkeit.
