review_pass:
  verdict: approve
  source_fidelity: Der Text gibt οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν treffend mit „Ich werde nicht mehr viel mit euch reden“ wieder. „Der Herrscher der Welt“ entspricht ὁ τοῦ κόσμου ἄρχων ohne die im griechischen Text fehlende Ergänzung „dieser“. Das futurisch-unmittelbare ἔρχεται ist mit „kommt“ idiomatisch wiedergegeben. „Und er hat nichts in mir“ bewahrt die knappe, offene Form von καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν.
  naturalness: Modernes, klares und würdevolles Standarddeutsch. „Ich werde nicht mehr viel mit euch reden“ und „der Herrscher der Welt kommt“ sind natürlich formuliert. Die bewusst ungewohnte Wendung „hat nichts in mir“ ist als absichtlich wörtliche Wiedergabe eines dichten griechischen Ausdrucks vertretbar und wird angemessen erläutert.
  terminology: „Herrscher“ ist eine zeitgemäße, sachgerechte Wiedergabe von ἄρχων. „Welt“ wahrt die johanneische Weite von κόσμος. Der Titel wird nicht durch eine explizite Identifikation ersetzt; dadurch bleibt die Formulierung des Ausgangstextes erhalten. Die Fußnoten benennen Alternativen, ohne eine einzelne theologische Deutung festzulegen.
