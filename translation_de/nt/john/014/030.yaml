id: JHN.14.30
reference: John 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: de
  text: Ich werde nicht mehr viel mit euch reden, denn der Herrscher der Welt[a] kommt. Und er hat nichts in mir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der Herrscher dieser Welt“. Im Griechischen steht wörtlich nur „der Welt“; „dieser“ wird in manchen Übersetzungen entsprechend ähnlichen Formulierungen im Johannesevangelium ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „Er hat keinen Anspruch auf mich“, „er hat keine Macht über mich“ oder „er findet keinen Anhaltspunkt in mir“. Wörtlich heißt es: „Er hat nichts in mir.“'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Wendung bezeichnet das Ende eines bisherigen Geschehens von diesem Zeitpunkt an und ist im modernen Deutschen natürlich.
- source_word: πολλὰ
  choice: viel
  rationale: Das substantivierte Neutrum Plural wird hier adverbial zu λαλήσω gebraucht; daher ist „viel“ treffender als „viele Dinge“.
- source_word: λαλήσω
  choice: werde … reden
  rationale: Das Futur von λαλέω bezeichnet hier Jesu weiteres Reden mit den Jüngern. „Reden“ klingt natürlich und bewahrt den Bezug auf das Gespräch.
- source_word: μεθ’ ὑμῶν
  choice: mit euch
  rationale: μετά mit dem Genitiv bezeichnet Gemeinschaft beziehungsweise unmittelbaren Austausch mit den angesprochenen Jüngern.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens hat im Zusammenhang futurisch-unmittelbare Bedeutung. Das deutsche Präsens „kommt“ gibt dieses bevorstehende Eintreffen knapp und idiomatisch wieder.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: der Herrscher der Welt
  rationale: ἄρχων bezeichnet einen Herrschenden oder Machthaber. „Herrscher“ ist gegenwärtig verständlicher als das traditionelle „Fürst“. Da im griechischen Text kein Demonstrativpronomen steht, wird „dieser“ nicht ergänzt.
- source_word: κόσμου
  choice: Welt
  rationale: „Welt“ bewahrt die breite johanneische Bedeutung von κόσμος, ohne sie bereits im Haupttext auf eine bestimmte Weltordnung einzuengen.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: Die wörtliche Präpositionalwendung ist bewusst knapp und lässt offen, ob vor allem fehlender Anspruch, fehlender Einfluss oder fehlender Anknüpfungspunkt gemeint ist.
- source_word: οὐκ ἔχει οὐδέν
  choice: er hat nichts
  rationale: Die wörtliche Wiedergabe erhält die prägnante und theologisch vielschichtige Formulierung des Griechischen; mögliche idiomatische Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Identität des „Herrschers der Welt“
  choice: Der Titel wird übersetzt, ohne ihn im Haupttext ausdrücklich durch „Satan“ zu ersetzen.
  alternative: Den Titel als direkte Bezeichnung Satans oder allgemeiner als Personifikation böser Weltmächte auszuformulieren.
  rationale: Im johanneischen Zusammenhang weist der Titel auf den Jesus entgegenstehenden bösen geistlichen Herrscher, gewöhnlich auf Satan. Der griechische Text nennt jedoch nur den Titel; dessen Übersetzung bewahrt den inferentiellen Charakter der Identifikation.
- issue: Bedeutung von „er hat nichts in mir“
  choice: Die wörtliche und offene Formulierung bleibt im Haupttext erhalten.
  alternative: „Er hat keinen Anspruch auf mich“, „er hat keine Macht über mich“ oder „er findet keinen Anhaltspunkt in mir“.
  rationale: Das griechische Idiom kann fehlenden Anspruch, Einfluss, Halt oder gemeinsame Grundlage ausdrücken. Keine einzelne erklärende Wiedergabe schöpft den möglichen Sinn sicher aus; die Spannung bleibt daher im Text bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung und Satzlänge bleiben klar und mündlich verständlich. Das einleitende „Und“ im zweiten Satz bewahrt καί und die markante Zuspitzung. Die bewusst ungewöhnliche Wendung „nichts in mir“ bleibt wegen ihrer theologischen Offenheit stehen und wird durch eine Fußnote erschlossen.
