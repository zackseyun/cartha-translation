source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: de
  text: Und wenn ich gehe und euch einen Ort bereite, komme ich wieder[a][b] und werde euch zu mir nehmen, damit auch ihr dort seid, wo ich bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde wiederkommen.“ Im Griechischen steht ein Verb im Präsens („komme ich“), das hier auf die Zukunft bezogen ist.'
    reason: lexical_alternative
  - marker: b
    text: Umstritten ist, ob „komme ich wieder“ insbesondere Jesu endgültige Wiederkunft, seine Erscheinungen nach der Auferstehung, das Kommen des Geistes oder eine mehrschichtige Verheißung bezeichnet, die mehr als eines davon umfasst.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: wenn ich gehe
  rationale: Der Aorist Konjunktiv mit ἐάν bezeichnet eine auf die Zukunft gerichtete Bedingung. „Gehe“ gibt πορεύομαι schlicht und unmittelbar wieder, ohne die Deutung durch „fortgehe“ unnötig zu verstärken.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: euch einen Ort bereite
  rationale: ἑτοιμάζω bedeutet „bereiten, bereitmachen“, τόπος „Ort, Platz“. Die Formulierung ist natürlich und lässt offen, welcher Art dieser Ort ist.
- source_word: πάλιν ἔρχομαι
  choice: komme ich wieder
  rationale: Das präsentische ἔρχομαι kann hier futurischen Sinn haben. Das deutsche Präsens „komme ich wieder“ bewahrt sowohl die Formnähe als auch den klaren Zukunftsbezug des Zusammenhangs.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: werde euch zu mir nehmen
  rationale: παραλαμβάνω bezeichnet hier das Zu-sich-Nehmen in die eigene Gegenwart. „Zu mir nehmen“ ist gegenwärtiges, verständliches Deutsch und wahrt die relationale Kraft von πρὸς ἐμαυτόν.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet den Zweck ein; „damit“ ist die natürliche deutsche Entsprechung.
- source_word: ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε
  choice: damit auch ihr dort seid, wo ich bin
  rationale: Die Umstellung mit „dort“ ist im Deutschen idiomatisch und macht den Ortsbezug deutlich. „Seid“ gibt den Konjunktiv im durch „damit“ eingeleiteten Zwecksatz angemessen wieder; „auch“ entspricht καί.
theological_decisions:
- issue: Art der in πάλιν ἔρχομαι verheißenen Wiederkunft Jesu
  choice: Als zukunftsbezogene Verheißung „komme ich wieder“ wiedergegeben, ohne Art oder Zeitpunkt näher festzulegen.
  alternative: Eine ausschließliche Bezugnahme auf die Erscheinungen nach der Auferstehung, das Kommen des Geistes, die endgültige Wiederkunft oder eine mehrschichtige Erfüllung.
  rationale: Der Vers verheißt Jesu erneutes Kommen und die Aufnahme der Jünger zu ihm, bestimmt aber an dieser Stelle nicht ausdrücklich, wie die Verheißung innerhalb dieser Deutungsmöglichkeiten einzugrenzen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ort“ wahrt die Bildoffenheit von τόπος; „zu mir nehmen“ ist verständlich und relational. Beide Fußnotenmarker stehen im Haupttext.
