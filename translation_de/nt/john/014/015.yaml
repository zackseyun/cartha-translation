  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: de
  text: Wenn ihr mich liebt, werdet ihr meine Gebote halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werdet ihr meine Gebote befolgen“. Das Verb kann „halten“, „bewahren“, „beachten“ oder „befolgen“ bedeuten; „halten“ bewahrt den weiteren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Wenn
  rationale: Leitet einen real offenen Bedingungssatz ein. „Wenn“ ist im Deutschen natürlich und verlangt keine wiederholende Bedeutung wie „wann immer“.
- source_word: ἀγαπᾶτέ
  choice: ihr mich liebt
  rationale: Das Präsens Konjunktiv Aktiv in der zweiten Person Plural wird nach ἐάν idiomatisch mit deutschem Präsens wiedergegeben; „lieben“ bewahrt die johanneische Wortverbindung zur Liebe.
- source_word: με
  choice: mich
  rationale: Akkusativobjekt, das sich auf Jesus bezieht.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: meine Gebote
  rationale: Die Artikel-Possessiv-Konstruktion wird im Deutschen natürlich als „meine Gebote“ wiedergegeben. „Gebote“ bewahrt das Gewicht und den erkennbaren johanneischen Sprachgebrauch.
- source_word: τηρήσετε
  choice: werdet … halten
  rationale: Die Form ist Futur Indikativ, zweite Person Plural. „Halten“ lässt neben dem Befolgen auch die Bedeutungsnuancen Bewahren und Festhalten anklingen und wahrt die Zukunftsaussage.
theological_decisions:
- issue: Ob τηρήσετε als Aufforderung oder als Zukunftsaussage wiederzugeben ist
  choice: 'Zukunftsaussage: „werdet ihr meine Gebote halten“'
  alternative: 'Aufforderung: „haltet meine Gebote“'
  rationale: Der griechische Text hat einen Futur Indikativ und keinen Imperativ. Die Wiedergabe wahrt daher die grammatische Form und die Spannung, dass Liebe zu Jesus sich im Halten seiner Gebote zeigt, ohne den Satz in eine direkte Aufforderung umzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede im Plural („ihr“) und das Futur werden ausdrücklich beibehalten.
