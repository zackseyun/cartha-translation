id: JHN.14.10
reference: John 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: de
  text: Glaubst du nicht, dass ich im Vater bin und der Vater in mir ist? Die Worte, die ich euch sage, spreche ich nicht von mir selbst aus[a]. Vielmehr tut der Vater, der in mir bleibt[b], seine Werke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus eigener Initiative oder Vollmacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der in mir wohnt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: glaubst
  rationale: „Glauben“ entspricht dem wiederkehrenden johanneischen Gebrauch von πιστεύω und bewahrt die sprachliche Verbindung zum Leitthema des Evangeliums.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: im Vater ... in mir
  rationale: Die wörtliche räumlich-relationale Ausdrucksweise bewahrt die Aussage vom gegenseitigen Innewohnen, ohne sie deutend mit „eins mit“ wiederzugeben.
- source_word: τὰ ῥήματα
  choice: die Worte
  rationale: „Die Worte“ gibt den Plural direkt und in natürlichem modernem Deutsch wieder.
- source_word: λέγω
  choice: sage
  rationale: „Sagen“ bezeichnet hier die inhaltliche Äußerung und erlaubt eine maßvolle Unterscheidung vom folgenden λαλῶ.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: aus mir selbst
  rationale: Die quellennah formulierte Wendung lässt offen, ob besonders Ursprung, Eigeninitiative oder Vollmacht gemeint ist; die idiomatischere Alternative wird in einer Fußnote genannt.
- source_word: λαλῶ
  choice: spreche
  rationale: „Sprechen“ bewahrt die Variation gegenüber λέγω („sage“), ohne im Deutschen unnatürlich zu wirken.
- source_word: μένων
  choice: der ... bleibt
  rationale: „Bleibt“ ist die direkte, moderne Wiedergabe von μένω und bewahrt dessen durativen Sinn.
- source_word: ποιεῖ
  choice: tut
  rationale: „Tut“ verbindet sich natürlich mit „Werke“ und gibt ποιεῖ schlicht und direkt wieder.
- source_word: τὰ ἔργα αὐτοῦ
  choice: seine Werke
  rationale: Das Possessivpronomen αὐτοῦ wird ausdrücklich wiedergegeben; „Werke“ bewahrt zugleich den johanneischen theologischen Wortgebrauch.
theological_decisions:
- issue: Gegenseitiges Innewohnen von Vater und Sohn
  choice: „ich im Vater bin und der Vater in mir ist“
  alternative: „ich mit dem Vater eins bin und der Vater mit mir eins ist“
  rationale: Die relationale Sprache des griechischen Textes bleibt erhalten, ohne sie mit einer anderen johanneischen Formulierung zu harmonisieren oder durch spätere dogmatische Terminologie zu ersetzen.
- issue: Wirken des Vaters im Reden und Handeln Jesu
  choice: „spreche ich nicht aus mir selbst ... der Vater, der in mir bleibt, [tut] seine Werke“
  alternative: „spreche ich nicht aus eigener Vollmacht ... der in mir wohnende Vater vollbringt die Werke“
  rationale: Die Fassung wahrt sowohl die personale Unterscheidung als auch die enge Einheit von Vater und Sohn und legt ἀπ’ ἐμαυτοῦ nicht einseitig auf Eigeninitiative oder Vollmacht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text; „Vielmehr“ stellt den Gegensatz natürlich heraus. Die Wiederholung von „Vater“ und „in mir“ wird wegen ihrer theologischen und rhetorischen Bedeutung beibehalten.
