source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: de
  text: Wenn ihr mich gekannt hättet, hättet ihr auch meinen Vater gekannt.[a] Von jetzt an kennt ihr ihn und habt ihn gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben sinngemäß: „Wenn ihr mich erkannt habt, werdet ihr auch meinen Vater erkennen.“'
    reason: Die Variante verändert im ersten Satz die Zeitformen und die Aussageform; der SBLGNT-Text hat einen irrealen Rückblick.
lexical_decisions:
- source_word: γινώσκω / οἶδα
  choice: erkennen
  rationale: Im Deutschen gibt „erkennen“ das relationale und geistliche Kennen in diesem Zusammenhang natürlicher wieder als das bloß sachliche „wissen“. Obwohl im Griechischen zwei Verben stehen, ist hier kein sicherer Bedeutungsunterschied hervorzuheben.
- source_word: ἀπ’ ἄρτι
  choice: von jetzt an
  rationale: Natürliche und genaue Wiedergabe des zeitlichen Übergangs.
- source_word: ἑωράκατε
  choice: habt ... gesehen
  rationale: Das Perfekt wird als gegenwartsbezogenes Ergebnis einer vollzogenen Wahrnehmung wiedergegeben.
theological_decisions:
- issue: Textkritische Lesart und Aussageform im ersten Satz
  choice: Wenn ihr mich erkannt hättet, hättet ihr auch meinen Vater erkannt.
  alternative: Wenn ihr mich kennt, werdet ihr auch meinen Vater kennen.
  rationale: Der vorgelegte SBLGNT-Text bietet die kontrafaktische Vergangenheitsform εἰ ἐγνώκειτέ ... ἂν ᾔδειτε. Diese Spannung mit der anschließenden positiven Aussage wird bewahrt und nicht harmonisiert.
- issue: Bedeutung von „ihn gesehen“
  choice: wörtlich und ohne erklärenden Zusatz beibehalten
  alternative: ihn in mir gesehen
  rationale: Der Vers nennt das Verhältnis zwischen dem Sehen Jesu und dem Sehen des Vaters nicht ausdrücklich; eine theologische Erläuterung würde den Text erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erkennen“ wird wegen des personal-relationalen Zusammenhangs durchgehend verwendet; die zugespitzte Spannung zwischen dem irrealen Rückblick und „von jetzt an“ bleibt erhalten.
