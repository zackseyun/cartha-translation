  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: de
  text: Und wohin ich gehe, den Weg dahin kennt ihr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lauten: „Und ihr wisst, wohin ich gehe, und den Weg kennt ihr.“'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte Verknüpfung mit dem vorausgehenden Vers.
- source_word: ὅπου
  choice: wohin … dahin
  rationale: Da ὑπάγω eine Bewegung bezeichnet, gibt „wohin“ das Ziel im Deutschen idiomatisch wieder; das korrelative „dahin“ macht die Beziehung zu „den Weg“ verständlich, ohne eine zusätzliche inhaltliche Bestimmung einzuführen.
- source_word: ἐγὼ
  choice: ich
  rationale: Gibt das ausdrücklich gesetzte Personalpronomen wieder und bezeichnet Jesus als Subjekt.
- source_word: ὑπάγω
  choice: gehe
  rationale: Natürliches deutsches Äquivalent für die präsentische Bewegungsform; „weggehe“ würde den Abschiedsgedanken stärker auslegen.
- source_word: οἴδατε
  choice: kennt ihr
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung. Bei „den Weg“ ist „kennen“ im Deutschen idiomatischer als „wissen“.
- source_word: τὴν ὁδόν
  choice: den Weg
  rationale: Bewahrt das konkrete wie übertragene Bedeutungsspektrum von ὁδός und den Anschluss an Johannes 14,6.
theological_decisions:
- issue: Syntaktische Beziehung zwischen dem Ziel des Gehens und „dem Weg“
  choice: Und wohin ich gehe, dahin kennt ihr den Weg.
  alternative: Und ihr kennt den Weg, wohin ich gehe.
  rationale: Die korrelative deutsche Form bewahrt die Vorderstellung des Orts-/Zielsatzes und macht zugleich verständlich, dass die Jünger den Weg im Blick auf Jesu Ziel kennen. Sie vermeidet das unidiomatische oder missverständliche „den Weg, wohin ich gehe“ sowie das interpretativ ergänzte „zu dem Ort“.
- issue: Textvariante mit zusätzlicher Kenntnis des Ziels
  choice: Die kürzere Lesart des SBLGNT steht im Haupttext.
  alternative: Und ihr wisst, wohin ich gehe, und den Weg kennt ihr.
  rationale: Die längere Lesart ist handschriftlich belegt, gehört aber nicht zum vorgegebenen SBLGNT-Text und wird daher nur in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Konstruktion „wohin … dahin“ ist klar und bewahrt die ungewöhnliche syntaktische Spannung des griechischen Textes.
