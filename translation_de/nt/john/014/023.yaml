    issue: μονὴν ... ποιησόμεθα wird mit „bei ihm Wohnung nehmen“ wiedergegeben.
    rationale: Die Formulierung ist verständlich, doch sie macht das explizite Objekt μονή („Wohnstätte“) und das possessive Moment des pluralischen Verbs weniger sichtbar. „bei ihm unsere Wohnstätte machen“ gibt beides genauer wieder, ohne den Sinn zu verändern.
  - severity: low
