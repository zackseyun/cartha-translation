source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Wenn jemand mich liebt, wird er mein Wort[a] halten, und mein Vater wird ihn lieben. Wir werden zu ihm kommen und bei ihm unsere Wohnstätte machen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Lehre“ oder „das, was ich sage“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bei ihm eine Wohnstätte machen“; auch möglich: „bei ihm unser Zuhause machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die im Griechischen übliche Doppelwendung „antwortete und sagte zu ihm“ wird im heutigen Deutsch idiomatisch durch „antwortete ihm“ wiedergegeben, ohne den Aussagegehalt zu verändern.
- source_word: Ἐάν τις
  choice: Wenn jemand
  rationale: Die offene, allgemein geltende Bedingung wird natürlich und geschlechtsübergreifend wiedergegeben.
- source_word: ἀγαπᾷ με
  choice: mich liebt
  rationale: Direkte und übliche Wiedergabe von ἀγαπάω; die persönliche Beziehung bleibt deutlich.
- source_word: τὸν λόγον μου
  choice: mein Wort
  rationale: „Wort“ bewahrt die johanneische Ausdrucksweise und deren möglichen Bezug auf Jesu Botschaft, Lehre und konkrete Aussagen.
- source_word: τηρήσει
  choice: wird ... halten
  rationale: „Das Wort halten“ ist im Deutschen eine verständliche biblische Wendung und umfasst Beachten, Bewahren und Gehorchen, ohne den Sinn vorschnell auf bloßen Regelgehorsam zu verengen.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: mein Vater wird ihn lieben
  rationale: Die Zukunftsform und die persönliche Bezeichnung „mein Vater“ werden unmittelbar erhalten; „ihn“ nimmt den generischen Singular „jemand“ auf.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: Wir werden zu ihm kommen
  rationale: Die erste Person Plural sowie die Bewegung und persönliche Hinwendung zu dem Betreffenden werden ausdrücklich bewahrt.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: bei ihm Wohnung nehmen
  rationale: Die deutsche Redewendung gibt das griechische „eine Bleibe/Wohnstätte bei ihm machen“ natürlich wieder und bewahrt sowohl die bleibende Gegenwart als auch das „bei ihm“.
theological_decisions:
- issue: Pluralisches Subjekt in „Wir werden ... kommen und ... Wohnung nehmen“
  choice: Der Plural wird ausdrücklich beibehalten und bezeichnet Jesus und den Vater in gemeinsamem Handeln.
  alternative: Eine stilistische Umformung in den Singular oder eine unpersönliche Aussage.
  rationale: Die griechischen Verben ἐλευσόμεθα und ποιησόμεθα stehen ausdrücklich in der ersten Person Plural. Die Übersetzung wahrt diese Spannung von unterscheidbaren Sprechenden und gemeinsamem Handeln, ohne sie dogmatisch weiter auszudeuten.
- issue: Generischer Singular bei τις und αὐτόν/αὐτῷ
  choice: „jemand“ mit anschließendem singularischem „er/ihn/ihm“
  alternative: Durchgehend pluralische oder umschreibende geschlechtsneutrale Formen.
  rationale: „Jemand“ macht den allgemeinen Geltungsbereich deutlich; die anschließenden Pronomen bewahren die singularische Struktur des griechischen Textes und sind im Deutschen grammatisch eindeutig generisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische griechische Doppelwendung „antwortete und sagte“ wurde idiomatisch gestrafft. „Mein Wort halten“ bewahrt bewusst den johanneischen Schlüsselbegriff λόγος und die Bedeutungsbreite von τηρέω. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
