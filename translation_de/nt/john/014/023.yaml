- from: 'Jesus antwortete ihm: „Wenn jemand mich liebt, wird er mein Wort[a] halten, und mein Vater wird ihn lieben. Wir werden zu ihm kommen und bei ihm Wohnung nehmen[b].“'
  to: 'Jesus antwortete ihm: „Wenn jemand mich liebt, wird er mein Wort[a] halten, und mein Vater wird ihn lieben. Wir werden zu ihm kommen und bei ihm unsere Wohnstätte machen[b].“'
  rationale: Die Revision bewahrt die natürliche moderne deutsche Satzgestaltung, stellt bei μονή jedoch die im Griechischen ausdrücklich genannte Wohnstätte und das in ποιησόμεθα mitgetragene „unsere“ deutlicher heraus. Die Fußnote wird entsprechend präzisiert. Die idiomatische Straffung von „antwortete und sagte“ zu „antwortete ihm“ ist weiterhin vertretbar.
