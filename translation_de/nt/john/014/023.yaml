  source_fidelity: 'Der griechische Text wird im Wesentlichen treffend wiedergegeben: die offene Bedingung, der Singularbezug, die Zukunftsformen sowie das gemeinsame Handeln von Jesus und dem Vater bleiben erhalten. Bei μονὴν παρ’ αὐτῷ ποιησόμεθα ist jedoch „bei ihm Wohnung nehmen“ eine idiomatische, aber leicht verkürzende Wiedergabe, da das griechische Objekt ausdrücklich eine „Wohnstätte“ nennt und die Wendung wörtlich „bei ihm eine Wohnstätte machen“ lautet.'
  naturalness: Das Deutsch ist klar, modern und würdig. „Bei ihm Wohnstatt nehmen“ wäre unnatürlich; „bei ihm eine Wohnstätte nehmen“ wäre falsch. „Bei ihm unsere Wohnstätte machen“ ist dem Ausgangstext näher und im biblisch-literarischen Register noch gut verständlich.
  terminology: '„Mein Wort halten“ bewahrt die johanneische Terminologie von λόγος und τηρεῖν angemessen. „Mein Vater“ und der Plural „Wir“ sind korrekt. Die Fußnote b ist allerdings nicht sauber abgestimmt: Sie bezeichnet die gewählte Formulierung als wörtlicher, obwohl „Wohnung nehmen“ kein ausdrückliches Objekt für μονή wiedergibt; außerdem ist „unser Zuhause haben“ weniger genau als „unser Zuhause machen“.'
  issues:
