id: JHN.14.19
reference: John 14:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: de
  text: Nur noch eine kurze Zeit, dann sieht die Welt mich nicht mehr; ihr aber seht mich. Weil ich lebe, werdet auch ihr leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihr werdet leben“ kann die Teilhabe der Jünger am Auferstehungsleben Jesu, geistliches Leben in Verbundenheit mit ihm oder beides bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Nur noch eine kurze Zeit
  rationale: Gibt die idiomatische Zeitangabe natürlich wieder und bewahrt den Gedanken einer kurzen verbleibenden Frist.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Entspricht dem etablierten johanneischen Ausdruck, ohne ihn im Haupttext auf die von Gott entfremdete Menschheit einzuengen.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: sieht / seht
  rationale: „Sehen“ ist im Deutschen natürlich und lässt offen, ob körperliches Sehen, geistliches Erkennen oder beides gemeint ist. Das Präsens der zweiten Aussage bleibt erhalten.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Gibt das Ende eines bisherigen Zustands knapp und idiomatisch wieder.
- source_word: δὲ
  choice: aber
  rationale: Markiert den deutlichen Gegensatz zwischen der Welt und den Jüngern.
- source_word: ὅτι
  choice: Weil
  rationale: Gibt den hier naheliegenden kausalen Zusammenhang zwischen Jesu Leben und dem künftigen Leben der Jünger wieder.
- source_word: ἐγὼ ζῶ
  choice: ich lebe
  rationale: Bewahrt das Präsens und die prägnante Aussage des griechischen Textes.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: werdet auch ihr leben
  rationale: Gibt Futur und καί ausdrücklich wieder und betont den Zusammenhang mit Jesu Leben.
theological_decisions:
- issue: Art des Sehens Jesu durch die Jünger
  choice: Schlicht mit „ihr aber seht mich“ wiedergegeben.
  alternative: „Ihr aber werdet mich sehen“ oder eine ausdrückliche Festlegung auf Auferstehungserscheinungen beziehungsweise geistliches Erkennen.
  rationale: Das griechische Präsens θεωρεῖτέ steht im Kontrast zu θεωρεῖ und kann im zeitlichen Zusammenhang zukunftsbezogen verstanden werden, ohne seine präsentische Form zu verlieren. Die Formulierung hält körperliches Sehen des Auferstandenen und geistliches Erkennen bewusst offen.
- issue: Bedeutung von „ihr werdet leben“
  choice: Breit mit „werdet auch ihr leben“ übersetzt.
  alternative: „Ihr werdet auferstehen“, „ihr werdet geistlich leben“ oder „ihr werdet ewiges Leben haben“.
  rationale: Das Verb ζήσετε legt nicht fest, ob Auferstehungsleben, gegenwärtige Teilhabe an Jesu Leben oder beides im Vordergrund steht. Die offene Wiedergabe bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon-Satzbau wahrt den scharfen Kontrast des griechischen Textes. „Nur noch eine kurze Zeit“ ist allgemein verständlich und nicht unnötig altertümlich.
