  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die Satzfolge und den Kontrast des griechischen Textes zuverlässig wieder: die kurze verbleibende Zeit, das Nicht-mehr-Sehen durch die Welt, das Sehen durch die Jünger sowie die kausale Verknüpfung von Jesu Leben mit ihrem künftigen Leben. Das Präsens in „sieht“ / „seht“ bewahrt die griechische Form und funktioniert im durch „Nur noch eine kurze Zeit“ gesetzten zukunftsbezogenen Rahmen natürlich.'
  naturalness: „Nur noch eine kurze Zeit, dann sieht die Welt mich nicht mehr; ihr aber seht mich“ ist modernes, gut verständliches Standarddeutsch. Der Semikolon-Satzbau macht den Kontrast klar, ohne künstlich zu wirken. „Weil ich lebe, werdet auch ihr leben“ ist prägnant und idiomatisch.
  terminology: „Die Welt“ bewahrt den etablierten johanneischen Ausdruck ohne interpretierende Einengung. „Sehen“ lässt die mögliche Mehrdeutigkeit von körperlichem und geistlichem Wahrnehmen offen. „Leben“ gibt ζήσετε breit und ohne konfessionelle Festlegung wieder. Die Fußnote erläutert mögliche Resonanzen, ohne sie zur alleinigen Bedeutung zu machen.
