source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: de
  text: Und worum ihr auch in meinem Namen bittet, das werde ich tun, damit der Vater im Sohn[a] verherrlicht wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch den Sohn«. Im Griechischen steht »im Sohn«; die Wendung kann den Bereich bezeichnen, in dem der Vater verherrlicht wird, oder das Mittel, durch das er verherrlicht wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: worum … auch
  rationale: Die Verbindung aus Relativpronomen und ἄν bezeichnet einen offenen, uneingeschränkten Umfang. Zusammen mit »bitten« ist »worum ihr auch … bittet« im Deutschen natürlich und präzise.
- source_word: αἰτήσητε
  choice: ihr bittet
  rationale: Die Verbform ist zweite Person Plural. »Bitten« entspricht αἰτέω hier idiomatisch und passt zum Gebetskontext besser als das sachlichere »erbitten« oder »verlangen«.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die feste Wendung bewahrt die möglichen Bedeutungsaspekte von Bevollmächtigung, Repräsentation und Übereinstimmung mit Jesus, ohne sie auf eine einzelne Auslegung zu verengen.
- source_word: τοῦτο
  choice: das
  rationale: Das ausdrückliche Demonstrativpronomen greift die vorausgehende Bitte auf und erhält die Hervorhebung der griechischen Formulierung.
- source_word: ποιήσω
  choice: werde ich tun
  rationale: Die einfache und umfassende Bedeutung von ποιέω wird direkt wiedergegeben; die deutsche Wortstellung bewahrt zugleich die Betonung von »das«.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« gibt den durch ἵνα bezeichneten Zweck in gegenwärtigem Deutsch klar und knapp wieder.
- source_word: δοξασθῇ
  choice: verherrlicht wird
  rationale: Die passive Konjunktivform wird sachgerecht wiedergegeben. »Verherrlicht« erhält den biblisch-theologischen Bedeutungsgehalt von δόξα/δοξάζω.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Der griechische Text hat die bestimmte Bezeichnung »der Vater« und nicht »mein Vater«.
- source_word: ἐν τῷ υἱῷ
  choice: im Sohn
  rationale: Die Wiedergabe mit »in« bewahrt die Mehrdeutigkeit der Präposition hinsichtlich Sphäre oder Mittel und vermeidet eine vorschnelle Festlegung auf »durch«.
theological_decisions:
- issue: Bedeutung des Bittens »in meinem Namen«
  choice: Die Wendung bleibt unverändert als »in meinem Namen« stehen.
  alternative: unter meiner Vollmacht; in Verbundenheit mit mir; in Übereinstimmung mit meinem Wesen und Willen
  rationale: Die johanneische Wendung umfasst mehrere miteinander verbundene Aspekte. Eine erklärende Paraphrase im Haupttext würde ihre theologische Tiefe unnötig auf eine Deutung beschränken.
- issue: Bedeutung von ἐν τῷ υἱῷ
  choice: im Sohn
  alternative: durch den Sohn
  rationale: ἐν kann hier die Sphäre oder das Mittel der Verherrlichung bezeichnen. Der Haupttext wahrt mit »im Sohn« die Form und Spannung des Griechischen; die instrumentale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, klingt mit »worum ihr auch … bittet« jedoch natürlich. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung »im Sohn«.
