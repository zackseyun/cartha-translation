  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: de
  text: Euer Herz soll nicht beunruhigt sein. Glaubt[a] an Gott[b] und glaubt auch an mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr glaubt an Gott; glaubt auch an mich.“ Die griechische Form πιστεύετε kann sowohl eine Aussage („ihr glaubt“) als auch eine Aufforderung („glaubt“) sein.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Vertraut auf Gott und vertraut auch auf mich.“ Das griechische Verb kann neben Glauben auch Vertrauen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: soll nicht erschrecken
  rationale: Der verneinte Imperativ der dritten Person wird im Deutschen natürlich mit „soll nicht“ wiedergegeben. „Erschrecken“ bezeichnet hier eine innere Erschütterung, ohne sie vorschnell auf Angst oder Sorge einzuengen.
- source_word: ὑμῶν ἡ καρδία
  choice: euer Herz
  rationale: Der griechische Text verbindet den Plural „euer“ mit dem Singular „Herz“. Die deutsche Wiedergabe bewahrt diesen kollektiven Singular und spricht die Jünger als Gemeinschaft an.
- source_word: πιστεύετε
  choice: Glaubt
  rationale: πιστεύω kann sowohl Glauben als auch Vertrauen bezeichnen. „Glaubt an“ ist eine direkte, geläufige Wiedergabe; die mögliche Nuance „Vertraut auf“ wird in einer Fußnote erhalten.
- source_word: εἰς τὸν θεόν
  choice: an Gott
  rationale: Bei πιστεύω wird εἰς im Deutschen idiomatisch mit „an“ wiedergegeben und bezeichnet die Ausrichtung des Glaubens beziehungsweise Vertrauens auf Gott.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: und glaubt auch an mich
  rationale: „Auch“ gibt die additive Kraft von καί wieder. Die Wiederholung von „glaubt“ bewahrt den Parallelismus des griechischen Satzes.
theological_decisions:
- issue: Indikativ oder Imperativ bei den beiden Formen πιστεύετε
  choice: 'Beide Formen als Imperative: „Glaubt an Gott und glaubt auch an mich.“'
  alternative: „Ihr glaubt an Gott; glaubt auch an mich.“ Möglich sind grammatisch außerdem indikativische Deutungen beider Formen.
  rationale: Die Form πιστεύετε kann sowohl Indikativ als auch Imperativ der zweiten Person Plural sein. Im Zusammenhang schließt sich die doppelte Aufforderung natürlich an das einleitende Verbot an. Da die grammatische Mehrdeutigkeit echt ist, wird die indikativische Alternative in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „euer Herz“ und die Parallelstruktur des Ausgangstextes bleiben erhalten; echte grammatische und lexikalische Alternativen werden nicht im Haupttext aufgelöst, sondern in Fußnoten kenntlich gemacht.
