id: JHN.14.12
reference: John 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wer an mich glaubt, der wird auch die Werke tun, die ich tue, und er wird noch größere Werke als diese tun[b], weil ich zum Vater gehe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich ist auch möglich: „noch Größeres als diese“. Das griechische Adjektiv kann das zuvor genannte Wort „Werke“ sinngemäß aufnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die verdoppelte feierliche Bekräftigungsformel wird bewahrt. „Amen“ ist im Deutschen geläufig und vermeidet das heute altertümlich wirkende „Wahrlich, wahrlich“.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Wer an mich glaubt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Glaubenden. Die deutsche Wer-Konstruktion gibt diesen repräsentativen Sinn natürlich wieder.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ bewahrt den johanneischen Leitbegriff und umfasst Jesu Taten und Zeichen, ohne ihn enger auszudeuten.
- source_word: ἃ ἐγὼ ποιῶ
  choice: die ich tue
  rationale: Das schlichte Präsens entspricht dem griechischen Präsens und ist im Deutschen idiomatisch.
- source_word: κἀκεῖνος
  choice: der wird auch
  rationale: Das korrelative „Wer …, der …“ gibt den rückbezüglichen und leicht hervorhebenden Charakter von κἀκεῖνος wieder; „auch“ bewahrt die additive Bedeutung.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: und er wird noch größere Werke als diese tun
  rationale: Das substantivierte neutrale μείζονα nimmt sinngemäß „Werke“ aus dem vorherigen Satzglied auf. „Noch größere“ drückt die Steigerung natürlich aus, ohne ihre genaue Art festzulegen.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι nennt hier den Grund für die vorausgehende Aussage; „weil“ macht den kausalen Zusammenhang klar.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: ich zum Vater gehe
  rationale: Der griechische Präsensausdruck bezeichnet im Kontext Jesu bevorstehendes Gehen. „Zum Vater“ wahrt den bestimmten Artikel und ergänzt kein Possessivpronomen.
theological_decisions:
- issue: Sinn der „größeren Werke“
  choice: 'Die Aussage bleibt offen: Glaubende werden Werke tun, die in einem nicht näher bestimmten Sinn größer sind als die genannten Werke Jesu; dies wird mit Jesu Gang zum Vater begründet.'
  alternative: Die Größe ausdrücklich als größere räumliche Reichweite, heilsgeschichtliche Bedeutung oder geistgewirkte Wirksamkeit bestimmen.
  rationale: Der Vers selbst erläutert nicht, worin das Größere besteht. Die Übersetzung bewahrt diese theologische Spannung und fügt keine bestimmte Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufige biblische Formel „Amen, amen“ bewahrt die feierliche Wiederholung; die Wer-der-Konstruktion gibt den generischen Singular natürlich wieder. Der Fußnotenmarker [b] steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
