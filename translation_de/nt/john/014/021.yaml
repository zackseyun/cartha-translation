id: JHN.14.21
reference: John 14:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: de
  text: Wer meine Gebote hat und sie hält, der ist es, der mich liebt.[a] Und wer mich liebt, wird von meinem Vater geliebt werden; auch ich werde ihn lieben und mich ihm offenbaren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Einzahl „der/ihn/ihm“ ist allgemein gemeint: Die Aussage gilt für jeden Menschen, der Jesu Gebote hat und hält.'
    reason: Erläuterung des repräsentativen Singulars.
  - marker: b
    text: 'Oder: „mich ihm zeigen“. Das griechische Verb kann ein Sichtbarwerden oder ein persönliches Sich-zu-erkennen-Geben bezeichnen.'
    reason: Semantische Alternative zu ἐμφανίσω.
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Wer … hat
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. Die deutsche Wer-Konstruktion gibt diesen repräsentativen Singular natürlich wieder.
- source_word: ἐντολάς
  choice: Gebote
  rationale: „Gebote“ bewahrt den verbindlichen Charakter der Weisungen Jesu und entspricht dem johanneischen Sprachgebrauch.
- source_word: τηρῶν
  choice: hält
  rationale: „Halten“ umfasst treues Bewahren und Befolgen und bildet zugleich die im Deutschen geläufige Verbindung „Gebote halten“.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: der ist es, der mich liebt
  rationale: Die Formulierung bewahrt die durch ἐκεῖνος hervorgehobene Identifizierung, ohne sie unnatürlich wörtlich wiederzugeben.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: liebt / wird … geliebt werden / werde … lieben
  rationale: Die Wiederholung desselben Wortstamms wird erhalten und damit der innere Zusammenhang der Aussage sichtbar gemacht.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Und wer mich liebt
  rationale: δέ führt hier den Gedankengang mild weiter und ist nicht deutlich adversativ; „Und“ gibt den Anschluss natürlich wieder.
- source_word: κἀγώ
  choice: auch ich
  rationale: κἀγώ verbindet καί mit dem ausdrücklich gesetzten ἐγώ. „Auch ich“ bewahrt den additiven Nachdruck und stellt Jesu Liebe neben die des Vaters.
- source_word: ἐμφανίσω … ἐμαυτόν
  choice: mich … offenbaren
  rationale: „Sich offenbaren“ bezeichnet persönliche Selbsterschließung und lässt offen, ob dabei Sichtbarkeit, Erkennbarkeit oder beides gemeint ist.
- source_word: αὐτὸν / αὐτῷ
  choice: ihn / ihm
  rationale: Die Pronomen greifen im Deutschen den generischen Singular der Wer-Konstruktion auf. Eine Fußnote erläutert dessen umfassende Bedeutung.
theological_decisions:
- issue: Verhältnis von Liebe und Gebotserfüllung
  choice: Das Halten der Gebote kennzeichnet den Menschen, der Jesus liebt.
  alternative: Gehorsam beweist die Liebe oder verdient die Liebe Gottes.
  rationale: Der griechische Satz identifiziert, ohne ausdrücklich ein Beweis-, Ursache- oder Verdienstverhältnis zu formulieren. Diese Spannung bleibt bestehen.
- issue: Liebe des Vaters und Jesu
  choice: Die zukünftige passive Aussage über die Liebe des Vaters sowie Jesu anschließende Zusage werden unmittelbar wiedergegeben.
  alternative: Die göttliche Liebe als Lohn für Gehorsam erklären.
  rationale: Der Text verbindet die Aussagen eng, legt aber die dogmatische Art ihres Verhältnisses nicht näher fest.
- issue: Art der Selbstoffenbarung Jesu
  choice: „mich ihm offenbaren“
  alternative: „mich ihm zeigen“
  rationale: ἐμφανίζω kann Sichtbarwerden oder Bekanntmachen bezeichnen. „Offenbaren“ wahrt die größere Bedeutungsbreite und die persönliche Selbsterschließung.
- issue: Generischer maskuliner Singular
  choice: „Wer … der“ mit „ihn/ihm“, ergänzt durch eine Fußnote.
  alternative: Pluralische oder durchgehend geschlechtsneutrale Umformulierung.
  rationale: So bleibt die singularische, repräsentative Form erhalten; zugleich wird klargestellt, dass die Aussage für jeden entsprechenden Menschen gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wer-Konstruktion ist allgemein verständlich und gibt den repräsentativen Singular natürlich wieder. „Der ist es, der“ erhält den Nachdruck des griechischen Demonstrativpronomens; „offenbaren“ bewahrt die absichtlich nicht näher bestimmte Art der Selbsterschließung Jesu.
