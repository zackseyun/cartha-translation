  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes präzise wieder: Das Haben und Halten der Gebote kennzeichnet denjenigen, der Jesus liebt; die zukünftige Liebe des Vaters, Jesu eigene Liebe und seine Selbstoffenbarung bleiben klar erhalten. Der Nachdruck von ἐκεῖνός ist mit „der ist es, der“ angemessen abgebildet. „Auch ich“ gibt die additive Kraft von κἀγώ gut wieder.'
  naturalness: Modernes, würdiges und idiomatisches Standarddeutsch. Die Verbindung „Gebote halten“ ist besonders treffend. Das doppelte Futurpassiv „wird … geliebt werden“ ist im Deutschen etwas formeller, aber grammatisch korrekt und für eine quellennahe Bibelübersetzung angemessen.
  terminology: „Gebote“, „hält“, „liebt“ und „mich ihm offenbaren“ sind terminologisch konsistent und dem johanneischen Sprachgebrauch angemessen. Die Wahl „offenbaren“ wahrt die semantische Offenheit von ἐμφανίσω besser als eine ausschließlich visuelle Wiedergabe. Die Fußnoten sind sinnvoll verankert und erläutern sowohl den repräsentativen Singular als auch die mögliche visuelle Nuance.
