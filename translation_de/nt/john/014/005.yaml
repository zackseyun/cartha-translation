source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: de
  text: 'Thomas sagte zu ihm: „Herr, wir wissen nicht, wohin du gehst. Wie können wir den Weg kennen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht derselbe Verbstamm zweimal: bei „wir wissen nicht“ und bei „den Weg kennen“.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Thomas sagte zu ihm
  rationale: Das historische Präsens λέγει wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben; αὐτῷ bleibt als „zu ihm“ ausdrücklich erhalten.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede bewahrt sowohl den respektvollen als auch den im Johannesevangelium möglichen tieferen Gehalt, ohne diesen näher festzulegen.
- source_word: οὐκ οἴδαμεν
  choice: wir wissen nicht
  rationale: οἶδα bezeichnet hier Wissen; „wissen“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: ποῦ ὑπάγεις
  choice: wohin du gehst
  rationale: Die Formulierung ist idiomatisch und lässt die johanneische Tiefendimension des Weggehens offen, ohne das Ziel auszudeuten.
- source_word: πῶς δυνάμεθα
  choice: Wie können wir
  rationale: Die Übersetzung gibt sowohl das Fragewort πῶς als auch die von δύναμαι bezeichnete Fähigkeit unmittelbar wieder.
- source_word: τὴν ὁδὸν
  choice: den Weg
  rationale: „Weg“ bewahrt die konkrete und übertragene Bedeutung von ὁδός sowie den Zusammenhang mit dem folgenden Vers.
- source_word: εἰδέναι
  choice: wissen
  rationale: Die Wiederholung von „wissen“ bildet den Gebrauch desselben griechischen Verbstamms in οἴδαμεν und εἰδέναι ab. Obwohl „den Weg kennen“ idiomatischer wäre, bewahrt „den Weg wissen“ die auffällige Wiederholung und ist im Deutschen verständlich.
theological_decisions:
- issue: Mögliche theologische Nuance von ὑπάγεις im Johannesevangelium
  choice: neutral als „wohin du gehst“ wiedergegeben
  alternative: „wohin du weggehst“ oder „wohin du fortgehst“
  rationale: Das Ziel Jesu besitzt im Johannesevangelium theologische Bedeutung, doch Thomas erklärt gerade seine Unkenntnis. Die neutrale Formulierung wahrt diese Spannung, ohne Jesu Rückkehr zum Vater bereits auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wurde im Erzählkontext natürlich als Präteritum wiedergegeben. Die Hauptfassung bewahrt bewusst die zweimalige Verwendung von „wissen“, auch wenn die zweite Wendung im Deutschen markiert klingt.
