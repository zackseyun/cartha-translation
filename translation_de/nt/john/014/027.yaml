  naturalness: „Euer Herz lasse sich nicht beunruhigen und verzage nicht“ verbindet eine Umschreibung mit „lassen“ mit einem anschließenden Imperativ, dessen Bezug auf „Herz“ zwar grammatisch möglich, aber im modernen Standarddeutsch unerquicklich und ungebräuchlich ist. „Euer Herz soll sich nicht beunruhigen und nicht den Mut verlieren“ ist klar, idiomatisch und behält beide unterschiedlichen Verbvorstellungen bei.
  terminology: „Frieden“, „meinen Frieden“, „die Welt“ und „hinterlasse ich“ sind treffend. „Den Mut verlieren“ gibt δειλιάω angemessen als Furchtsam- bzw. Mutloswerden wieder, ohne es moralisch verschärfend als Feigheit auszulegen. Die Fußnote muss syntaktisch an die Formulierung mit „Herz“ angepasst werden.
