source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: de
  text: Frieden hinterlasse ich euch; meinen Frieden gebe ich euch. Nicht wie die Welt gibt, gebe ich euch. Euer Herz soll sich nicht beunruhigen und nicht den Mut verlieren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Euer Herz soll sich nicht fürchten; oder: nicht furchtsam werden. Das griechische Verb bezeichnet Furchtsamwerden oder den Verlust des Mutes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ ist die direkte und im Deutschen natürliche Entsprechung. Sie bewahrt die inhaltliche Weite des Begriffs, ohne ihn auf innere Ruhe, Wohlergehen oder Versöhnung einzuengen.
- source_word: ἀφίημι
  choice: hinterlasse ich
  rationale: Bei „Frieden“ bezeichnet das Verb ein Zurücklassen. „Hinterlassen“ gibt dies idiomatisch wieder und lässt einen möglichen testamentarischen Anklang erkennen, ohne ihn durch „vermachen“ festzuschreiben.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: meinen Frieden
  rationale: Die vorangestellte possessive Bestimmung hebt hervor, dass es Jesu eigener Frieden ist. „Meinen Frieden“ bewahrt diese Betonung knapp und natürlich.
- source_word: δίδωμι
  choice: gebe ich
  rationale: Das schlichte Präsens entspricht dem griechischen Verb und bewahrt dessen Wiederholung im Kontrast zwischen Jesus und der Welt.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: Nicht wie die Welt gibt, gebe ich euch
  rationale: Die Wortstellung erhält den betonten Gegensatz und bleibt zugleich in gehobenem, verständlichem Deutsch natürlich.
- source_word: κόσμος
  choice: die Welt
  rationale: Die traditionelle und lexikalisch breite Wiedergabe bewahrt die johanneische Bedeutungsfülle, ohne den Ausdruck auf Gesellschaft oder Weltordnung zu verengen.
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: Euer Herz lasse sich nicht beunruhigen
  rationale: Die Formulierung bildet den passiven Imperativ ab und bewahrt den kollektiven Singular „Herz“ bei pluralischem „euer“. Sie ist zugleich verständlich und würdevoll.
- source_word: μηδὲ δειλιάτω
  choice: und verzage nicht
  rationale: „Verzagen“ bezeichnet das Ängstlich- oder Mutloswerden und unterscheidet sich semantisch von „beunruhigen“. Das gemeinsame Subjekt bleibt „euer Herz“.
theological_decisions:
- issue: Art des Friedens, den Jesus gibt
  choice: Der Haupttext bleibt bei „Frieden“ und „meinen Frieden“.
  alternative: Der Ausdruck könnte erläuternd als innere Ruhe, eschatologische Ganzheit oder Versöhnung mit Gott entfaltet werden.
  rationale: Der Vers selbst legt den Frieden nicht auf eine einzige Dimension fest. Die breite Wiedergabe bewahrt die theologische Mehrschichtigkeit.
- issue: Bedeutung von δειλιάω
  choice: „verzagen“
  alternative: „Angst haben“, „furchtsam werden“ oder „mutlos werden“
  rationale: Das Verb kann sowohl Furcht als auch den daraus entstehenden Verlust des Mutes bezeichnen. „Verzagen“ hält diese Verbindung offen; die Fußnote nennt geläufigere Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Satzstellung „Nicht wie die Welt gibt, gebe ich euch“ erhält den Nachdruck des griechischen Kontrasts. Der kollektive Singular „euer Herz“ folgt bewusst der Vorlage.
