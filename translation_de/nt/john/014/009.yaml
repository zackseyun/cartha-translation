    issue: „nicht erkannt“ kann missverständlich punktuell wirken.
    rationale: οὐκ ἔγνωκάς με ist ein Perfekt und bezeichnet hier angesichts der langen gemeinsamen Zeit einen fortdauernden Zustand fehlender Kenntnis. „Kennst du mich noch immer nicht“ gibt diesen Sinn im modernen Deutsch klarer und natürlicher wieder.
  - severity: low
    issue: „da“ in der abschließenden Frage ist eine zusätzliche Nuancierung.
    rationale: πῶς σὺ λέγεις drückt rhetorische Verwunderung aus; „Wie kannst du sagen“ genügt dafür. Das zusätzliche „da“ kann einen nicht ausdrücklich markierten Folgerungsbezug verstärken.
