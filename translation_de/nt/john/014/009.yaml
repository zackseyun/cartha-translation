source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Schon so lange bin ich bei euch, und du kennst mich noch immer nicht, Philippus? Wer mich gesehen hat, hat den Vater gesehen. Wie kannst du sagen: ›Zeig uns den Vater‹?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: So lange
  rationale: Die Zeitangabe im Dativ bezeichnet die bisherige Dauer. „So lange“ ist im modernen Deutschen natürlich und bewahrt den vorwurfsvollen rhetorischen Ton.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: bin ich schon bei euch
  rationale: Das griechische Präsens bezeichnet ein bis zur Sprechzeit andauerndes Zusammensein. Das deutsche Präsens mit „schon“ gibt diese Dauer idiomatisch wieder; der Plural „euch“ bleibt erhalten.
- source_word: οὐκ ἔγνωκάς με
  choice: du hast mich nicht erkannt
  rationale: Das Perfekt von γινώσκω blickt auf die lange Gelegenheit zurück und bezeichnet den daraus hervorgehenden Mangel an Erkenntnis. „Erkannt“ ist hier natürlicher als „gekannt“ und wahrt den tieferen johanneischen Erkenntnissinn, ohne ihn auszudeuten.
- source_word: Φίλιππε
  choice: Philippus
  rationale: Übliche deutsche Namensform für den griechischen Vokativ.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Wer mich gesehen hat
  rationale: Das substantivierte Perfektpartizip wird durch einen allgemeinen Relativsatz wiedergegeben; das Perfekt und seine bleibende Tragweite bleiben erkennbar.
- source_word: ἑώρακεν τὸν πατέρα
  choice: hat den Vater gesehen
  rationale: Die Formulierung übernimmt bewusst „den Vater“ und schwächt die starke Aussage weder zu bloßer Ähnlichkeit ab noch erweitert sie dogmatisch.
- source_word: πῶς σὺ λέγεις
  choice: Wie kannst du da sagen
  rationale: „Wie kannst du … sagen?“ gibt die rhetorische Verwunderung idiomatisch wieder. „Da“ stellt im Deutschen den Folgerungsbezug zum unmittelbar vorher Gesagten her.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Zeig uns den Vater
  rationale: Der Aoristimperativ wird als direkte, natürliche Aufforderung wiedergegeben und nimmt den Wortlaut von Philippus’ Bitte auf.
theological_decisions:
- issue: Verhältnis zwischen dem Sehen Jesu und dem Sehen des Vaters
  choice: „Wer mich gesehen hat, hat den Vater gesehen.“
  alternative: „Wer mich gesehen hat, hat gesehen, wie der Vater ist“ oder eine dogmatisch erweiterte ontologische Erklärung
  rationale: Die unmittelbare und starke christologische Aussage des griechischen Textes bleibt bestehen. Sie wird weder auf bloße Repräsentation abgeschwächt noch durch spätere dogmatische Begrifflichkeit über den Wortlaut hinaus präzisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede wechselt entsprechend dem Griechischen vom pluralischen „euch“ zum persönlichen „du … Philippus“. Die Zeichensetzung macht die zwei rhetorischen Fragen deutlich; die zitierte Bitte steht in deutschen einfachen Anführungszeichen.
