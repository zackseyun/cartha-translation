  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: de
  text: Im Haus meines Vaters gibt es viele Wohnstätten.[a] Wenn es nicht so wäre, hätte ich euch dann gesagt, dass ich hingehe, um einen Platz für euch vorzubereiten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Zimmer“ beziehungsweise „viele Wohnungen“. Das griechische Wort bezeichnet Orte, an denen man bleibt oder wohnt; „Wohnstätten“ bewahrt die Verbindung zum Motiv des Bleibens in diesem Kapitel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Wenn es nicht so wäre, hätte ich es euch gesagt; denn ich gehe hin, um einen Platz für euch vorzubereiten.“ Der griechische Satz kann aufgrund seiner mehrdeutigen Gliederung auch als Aussage statt als rhetorische Frage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῇ οἰκίᾳ τοῦ πατρός μου
  choice: Im Haus meines Vaters
  rationale: „Haus“ gibt οἰκία konkret und idiomatisch wieder und bewahrt die johanneische Wendung, ohne sie auf „Haushalt“ oder „Familie“ umzudeuten.
- source_word: μοναὶ πολλαί
  choice: viele Wohnstätten
  rationale: μονή bezeichnet einen Ort des Bleibens oder Wohnens. „Wohnstätten“ ist weiter als „Zimmer“ und bewahrt zugleich die Verbindung zum Motiv des Bleibens in Johannes 14.
- source_word: εἰ δὲ μή
  choice: Wenn es nicht so wäre
  rationale: Die elliptische griechische Bedingung wird im Deutschen natürlich vervollständigt; der Bezug gilt der unmittelbar vorausgehenden Aussage.
- source_word: εἶπον ἂν ὑμῖν
  choice: hätte ich euch dann gesagt
  rationale: Aorist mit ἄν wird als irrealer Bedingungssatz wiedergegeben. Die Frageform folgt der gewählten, im Kontext gut möglichen Interpunktion.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι wird als Einleitung des Inhalts dessen verstanden, was Jesus gesagt hat; die alternative kausale Auffassung bleibt in der Fußnote erhalten.
- source_word: πορεύομαι
  choice: ich hingehe
  rationale: „Hingehen“ gibt die gerichtete Bewegung aus der Sprecherperspektive natürlich wieder und passt zum wiederkehrenden johanneischen Sprachgebrauch.
- source_word: ἑτοιμάσαι τόπον ὑμῖν
  choice: um einen Platz für euch vorzubereiten
  rationale: Der Infinitiv bezeichnet den Zweck; τόπος bleibt mit „Platz“ bewusst allgemein und wird nicht auf ein Zimmer verengt.
theological_decisions:
- issue: Bildsprache von μονή und die Art der künftigen Unterkunft
  choice: viele Wohnstätten
  alternative: viele Zimmer; viele Wohnungen
  rationale: Der Text beschreibt Orte dauernden Bleibens, legt aber weder luxuriöse „Villen“ noch ausdrücklich architektonische Zimmer fest. „Wohnstätten“ erhält diese Offenheit.
- issue: Interpunktion und Aussageform des zweiten Satzes
  choice: 'rhetorische Frage: „Wenn es nicht so wäre, hätte ich euch dann gesagt, dass ich hingehe ...?“'
  alternative: 'Aussage: „Wenn es nicht so wäre, hätte ich es euch gesagt; denn ich gehe hin, um ...“'
  rationale: Die ältesten Textzeugen enthalten keine ursprüngliche moderne Interpunktion. Grammatik und Satzfolge erlauben sowohl die rhetorische Frage mit inhaltlichem ὅτι als auch eine Aussage mit kausalem ὅτι; die Hauptfassung folgt der gut passenden Frageform, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wohnstätten“ ist leicht gehoben, aber allgemein verständlich und trägt die lexikalische Weite von μονή besser als das engere „Zimmer“. Die Anrede „euch“ macht den Plural des griechischen ὑμῖν sichtbar.
