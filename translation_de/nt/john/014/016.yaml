  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: de
  text: Und ich werde den Vater bitten, und er wird euch einen anderen Beistand[a] geben, damit er für immer bei euch bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürsprecher“, „Helfer“ oder traditionell „Tröster“; das griechische Wort παράκλητος umfasst mehrere dieser Bedeutungsnuancen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Und ich
  rationale: Die Krasis aus καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und setzt eine leichte Betonung auf Jesus, ohne sie im Deutschen zu überzeichnen.
- source_word: ἐρωτήσω
  choice: werde ... bitten
  rationale: Das Futur von ἐρωτάω bezeichnet hier eine an den Vater gerichtete Bitte. „Bitten“ ist im Deutschen natürlicher und genauer als das mehrdeutige „fragen“.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Der griechische Text enthält den Artikel, aber kein Possessivpronomen. Daher wird nicht „meinen Vater“ ergänzt.
- source_word: ἄλλον
  choice: einen anderen
  rationale: ἄλλος bezeichnet einen weiteren Beistand in Beziehung zu Jesus. Eine nähere Bestimmung wie „von derselben Art“ wäre interpretierende Ausweitung.
- source_word: παράκλητον
  choice: Beistand
  rationale: „Beistand“ ist eine natürliche, personbezogene und semantisch offene deutsche Wiedergabe, die Hilfe, Fürsprache und Vertretung anklingen lässt, ohne den Ausdruck auf eine einzige Funktion festzulegen.
- source_word: δώσει ὑμῖν
  choice: er wird euch ... geben
  rationale: Die deutsche Wortstellung gibt das Futur und den Dativ idiomatisch und genau wieder.
- source_word: ἵνα ᾖ
  choice: damit er ... ist
  rationale: „Damit“ bewahrt die Ziel- beziehungsweise Zweckbeziehung von ἵνα. Im Deutschen ist der Indikativ nach „damit“ natürlich; ein formaler Konjunktiv würde hier unzeitgemäß oder missverständlich wirken.
- source_word: μεθ’ ὑμῶν
  choice: bei euch
  rationale: μετά mit Genitiv bedeutet „mit“. In diesem Vers drückt „bei euch“ die verheißene bleibende Gegenwart idiomatisch aus; „mit euch“ wäre ebenfalls möglich.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die johanneische Wendung bezeichnet unbegrenzte Dauer. „Für immer“ gibt den idiomatischen Sinn in modernem Deutsch klar wieder.
theological_decisions:
- issue: Wiedergabe von παράκλητος im trinitarischen Zusammenhang
  choice: Beistand
  alternative: Fürsprecher, Helfer, Tröster
  rationale: „Beistand“ wahrt den persönlichen und repräsentativen Charakter des Verheißenen und lässt die Bandbreite des griechischen Begriffs offen. Die Alternativen werden in einer Fußnote genannt, damit keine einzelne traditionelle Deutung stillschweigend verabsolutiert wird.
- issue: Bezug von „einen anderen“
  choice: Keine erläuternde Ergänzung im Haupttext
  alternative: einen anderen Beistand derselben Art
  rationale: Der Zusammenhang stellt den anderen παράκλητος in Beziehung zu Jesus, doch „derselben Art“ steht nicht ausdrücklich im griechischen Text und würde die theologische Beziehung stärker bestimmen, als der Vers selbst es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber flüssig. „Beistand“ ist verständlich, personbezogen und weniger eng festgelegt als einzelne funktionale Alternativen.
