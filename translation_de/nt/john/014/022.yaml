source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: de
  text: 'Judas, nicht der Iskariot, sagte zu ihm: „Herr, was ist geschehen, dass du dich uns offenbaren[a] willst und nicht der Welt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich zu erkennen geben“ beziehungsweise „sich sichtbar zeigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird im modernen deutschen Erzählstil idiomatisch mit dem Präteritum wiedergegeben.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Judas, nicht der Iskariot
  rationale: Die nachgestellte Klarstellung unterscheidet diesen Judas ausdrücklich von Judas Iskariot; die knappe griechische Form bleibt erhalten.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die natürliche deutsche Anrede und bewahrt zugleich das mögliche theologische Gewicht des Titels.
- source_word: τί γέγονεν
  choice: was ist geschehen
  rationale: Die Perfektform bezeichnet etwas Eingetretenes mit gegenwärtiger Folge. Die Formulierung bewahrt diese Nuance genauer als das idiomatischere „Wie kommt es“.
- source_word: ὅτι
  choice: dass
  rationale: 'Hier leitet ὅτι den Inhalt beziehungsweise die Folge der Frage ein: Was ist geschehen, dass Jesus sich nur den Jüngern offenbaren will?'
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der Selbstoffenbarung; eine erklärende Ergänzung wie „uns Jüngern“ ist nicht nötig.
- source_word: μέλλεις
  choice: willst
  rationale: Im Zusammenhang drückt μέλλω mit Infinitiv eine bevorstehende Absicht aus. „Willst“ klingt natürlich und lässt offen, wie unmittelbar die Handlung bevorsteht.
- source_word: ἐμφανίζειν σεαυτόν
  choice: dich offenbaren
  rationale: Die Wendung bezeichnet das Sichtbar- oder Erkennbarwerden einer Person. „Dich offenbaren“ bewahrt den reflexiven Sinn und ist im Deutschen verständlich und würdevoll.
- source_word: κόσμῳ
  choice: der Welt
  rationale: Die traditionelle und sachlich offene Wiedergabe bewahrt das johanneische Schlüsselwort, ohne es vorschnell als „Menschheit“ oder „ungläubige Weltordnung“ auszulegen.
theological_decisions:
- issue: Johanneischer Gebrauch von κόσμος
  choice: der Welt
  alternative: der Menschheit; der ungläubigen Welt
  rationale: „Welt“ bewahrt die theologische Mehrdeutigkeit des johanneischen Sprachgebrauchs und lässt den weiteren Kontext bestimmen, ob vor allem die Menschheit oder die von Gott entfremdete Ordnung gemeint ist.
- issue: Art der Selbstoffenbarung in ἐμφανίζειν σεαυτόν
  choice: dich offenbaren
  alternative: dich zu erkennen geben; dich sichtbar zeigen
  rationale: Der Vers legt nicht abschließend fest, ob eine sichtbare Erscheinung oder ein umfassenderes Sich-zu-erkennen-Geben gemeint ist. Die gewählte Formulierung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgestalt folgt dem fragenden Ton des griechischen Textes, ohne die etwas ungewöhnliche Formulierung „was ist geschehen, dass …“ zu glätten; dadurch bleibt die Nuance des griechischen Perfekts erhalten.
