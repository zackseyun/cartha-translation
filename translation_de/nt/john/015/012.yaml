  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: de
  text: 'Das ist mein Gebot: Liebt einander, wie ich euch geliebt habe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: Das ist mein Gebot
  rationale: Die demonstrative Identifizierung und die Zugehörigkeit zu Jesus werden in natürlichem Deutsch bewahrt. „Gebot“ gibt die verbindliche Autorität von ἐντολή prägnant wieder.
- source_word: ἵνα ἀγαπᾶτε
  choice: Liebt
  rationale: ἵνα leitet hier den Inhalt des Gebots ein. Im Deutschen gibt der Imperativ nach dem Doppelpunkt diesen Inhalt natürlicher wieder als eine Konstruktion mit „dass“, ohne die fortdauernde Geltung des Präsensstamms zu verengen.
- source_word: ἀλλήλους
  choice: einander
  rationale: „Einander“ ist die natürliche, stilistisch würdige Wiedergabe des reziproken Pronomens.
- source_word: καθὼς
  choice: wie
  rationale: „Wie“ bezeichnet sowohl Vergleich als auch Vorbild und lässt die genaue Reichweite des Vergleichs offen, wie es der griechische Ausdruck tut.
- source_word: ἠγάπησα ὑμᾶς
  choice: ich euch geliebt habe
  rationale: Das deutsche Perfekt drückt Jesu bereits erwiesene Liebe mit ihrer fortdauernden Bedeutung idiomatisch aus; „euch“ bezeichnet die angesprochenen Jünger als Gruppe.
theological_decisions:
- issue: Verhältnis von Jesu Liebe zum gegenseitigen Lieben
  choice: wie ich euch geliebt habe
  alternative: so, wie ich euch geliebt habe
  rationale: Die knappe Vergleichsform wahrt Jesu Liebe als Maßstab und Vorbild, ohne näher festzulegen, ob καθὼς zusätzlich eine begründende oder stärker modale Nuance trägt.
- issue: Wiedergabe von ἀγαπάω
  choice: lieben
  alternative: Liebe erweisen
  rationale: „Lieben“ bewahrt die lexikalische Kontinuität und legt die Liebe weder bloß als Gefühl noch ausschließlich als Handlung aus.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Doppelpunkt mit anschließendem Imperativ ist idiomatischer als „dass ihr einander liebt“ und bewahrt die unmittelbare Kraft des Gebots.
