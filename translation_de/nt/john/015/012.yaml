  source_fidelity: '„Das ist mein Gebot: Liebt einander, wie ich euch geliebt habe.“ gibt die demonstrative Identifizierung des Gebots (Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμή), den Inhaltssatz mit ἵνα, die Gegenseitigkeit von ἀλλήλους und den Vergleich καθὼς präzise wieder. Der deutsche Imperativ ist eine idiomatische Wiedergabe des inhaltlichen ἵνα-Satzes. Das Perfekt „habe geliebt“ ist für ἠγάπησα in diesem Kontext gut vertretbar und wahrt die gegenwartsbezogene Relevanz, ohne mehr zu behaupten als der griechische Aorist.'
  naturalness: Modernes, klares Standarddeutsch mit angemessen würdigem Register. Die Folge aus Doppelpunkt und Imperativ ist natürlich und direkter als eine dass-Konstruktion, ohne den Sinn zu verändern.
  terminology: „Gebot“ gibt ἐντολή treffend und nicht archaisierend wieder; „liebt“ bewahrt die lexikalische Kontinuität von ἀγαπάω; „einander“ ist die übliche präzise Wiedergabe von ἀλλήλους. „Wie“ ist für καθὼς natürlich und ausreichend genau.
