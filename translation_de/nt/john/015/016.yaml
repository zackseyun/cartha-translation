  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: de
  text: Nicht ihr habt mich erwählt,[a] sondern ich habe euch erwählt und euch dazu bestimmt, dass ihr hingeht und Frucht bringt und dass eure Frucht bleibt,[b] damit der Vater[c] euch das gibt, worum auch immer ihr ihn in meinem Namen bittet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgewählt“. Das Verb kann auch mit „auserwählt“ wiedergegeben werden; „erwählt“ wahrt hier den unmittelbaren Zusammenhang von Beziehung und Auftrag, ohne einen späteren theologischen Fachbegriff in den Haupttext einzutragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bestand hat“ beziehungsweise „fortbesteht“. Das häufig bei Johannes verwendete Verb kann Bleiben, Fortdauern oder Beständigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich in der griechischen Satzfolge: „damit, worum auch immer ihr den Vater in meinem Namen bittet, er euch gebe“. Der Text sagt „den Vater“, nicht „meinen Vater“.'
    reason: textual_and_syntactic_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: habt erwählt / habe erwählt
  rationale: „Erwählen“ gibt den bewussten, relationalen Akt des Auswählens würdig und idiomatisch wieder. Es wahrt den betonten Gegensatz zwischen „ihr“ und „ich“, ohne im Vers selbst eine ausgearbeitete systematisch-theologische Bedeutung festzulegen.
- source_word: ἔθηκα
  choice: dazu bestimmt
  rationale: Das wörtliche „gesetzt“ wäre im heutigen Deutsch unnatürlich. „Dazu bestimmt“ bezeichnet hier die zielgerichtete Beauftragung, die durch die folgende Zweckangabe erläutert wird, ohne sie auf die Einsetzung in ein kirchliches Amt zu verengen.
- source_word: ἵνα
  choice: dass / damit
  rationale: Die beiden Zweck- beziehungsweise Zielangaben werden in natürlichem Deutsch mit „dass“ und „damit“ wiedergegeben. Die Ergänzung „dazu“ bei ἔθηκα macht die erste Zweckbeziehung deutlich.
- source_word: ὑπάγητε
  choice: hingeht
  rationale: „Hingehen“ bewahrt gegenüber dem schlichten „gehen“ die Bewegungsrichtung des griechischen Verbs, ohne das nicht ausdrücklich genannte Missionsziel näher zu bestimmen.
- source_word: καρπὸν φέρητε
  choice: Frucht bringt
  rationale: Die geläufige deutsche Wendung erhält das johanneische Bild unverändert.
- source_word: μένῃ
  choice: bleibt
  rationale: „Bleibt“ ist die direkte, natürliche Wiedergabe des für Johannes wichtigen Verbs μένω und lässt offen, ob hier vor allem Fortbestand, Dauer oder bleibende Wirkung gemeint ist.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: worum auch immer ihr ihn bittet
  rationale: Die Formulierung gibt die unbestimmte Weite von ὅ τι ἄν wieder. Das im Deutschen nötige Objektpronomen „ihn“ bezieht sich eindeutig auf den Vater.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die etablierte Formulierung bewahrt die theologische und relationale Offenheit des griechischen Ausdrucks, ohne ihn paraphrasierend auf eine einzige Deutung festzulegen.
- source_word: δῷ
  choice: gibt
  rationale: Der deutsche Indikativ ist nach „damit“ idiomatisch und gibt den griechischen Konjunktiv der Zweckkonstruktion wieder; ein deutsches „möge geben“ würde hier eher einen Wunsch ausdrücken und wäre missverständlich.
- source_word: τὸν πατέρα
  choice: der Vater
  rationale: Der griechische Text nennt „den Vater“, nicht ausdrücklich „meinen Vater“. Durch die Umstellung in einen deutschen Nebensatz erscheint das Akkusativobjekt als Subjekt „der Vater“, ohne Bedeutungsänderung.
theological_decisions:
- issue: Mögliche dogmatische Überbestimmung von ἐξελεξάμην als technischer Erwählungsbegriff
  choice: „Ich habe euch erwählt“ im unmittelbaren Zusammenhang von Jüngerschaft, Auftrag und Fruchtbringen
  alternative: „Ich habe euch auserwählt“ oder eine ausdrücklich heilsgeschichtliche beziehungsweise systematisch-theologische Deutung
  rationale: Der Vers betont klar Jesu Initiative, legt aber an dieser Stelle keine vollständige Lehre der Erwählung dar. Die Übersetzung wahrt beides.
- issue: Bedeutung von ἔθηκα ὑμᾶς
  choice: Zielgerichtete Bestimmung beziehungsweise Beauftragung zum Hingehen und Fruchtbringen
  alternative: Wörtlich „ich habe euch gesetzt“ oder eng als Ordination in ein kirchliches Amt
  rationale: Der nachfolgende ἵνα-Satz benennt den Zweck. „Dazu bestimmt“ macht diesen Zusammenhang deutlich, ohne den Auftrag institutionell zu verengen.
- issue: Kraft des abschließenden ἵνα-Satzes
  choice: Als mit Auftrag und Fruchtbringen verbundene Zweck- beziehungsweise Zielaussage mit „damit“ wiedergegeben
  alternative: Als losgelöstes, uneingeschränktes Zukunftsversprechen formuliert
  rationale: Die griechische Syntax verbindet die Gebetsaussage mit dem Vorhergehenden. Die Übersetzung erhält diese Verknüpfung und macht daraus keine isolierte Gebetsformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der betonte Gegensatz der griechischen Pronomen wird mit „Nicht ihr … sondern ich“ erhalten. Die Satzstellung des letzten Teils wurde für natürliches Deutsch umgeordnet, während Zweckbeziehung, Bezug auf den Vater und die Wendung „in meinem Namen“ bewahrt bleiben.
