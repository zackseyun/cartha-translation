  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: de
  text: 'Wenn die Welt euch hasst, dann wisst: Mich hat sie schon vor euch gehasst.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, indikativisch verstanden: „Wenn die Welt euch hasst, wisst ihr, dass sie mich vor euch gehasst hat.“ Die griechische Form von „wisst“ kann Aufforderung oder Aussage sein; „zuerst/vor euch“ bezeichnet zeitlichen Vorrang.'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: die Welt
  rationale: In Johannes bezeichnet κόσμος häufig die Menschenwelt in ihrer Ablehnung Gottes. „Die Welt“ bewahrt die Breite und die theologische Spannung, ohne den Ausdruck durch „Weltsystem“ übermäßig auszudeuten.
- source_word: μισεῖ
  choice: hasst
  rationale: Das Präsens wird im Deutschen natürlich mit dem einfachen Präsens wiedergegeben und kann hier eine allgemeine beziehungsweise fortdauernde Haltung ausdrücken.
- source_word: γινώσκετε
  choice: dann wisst
  rationale: Die Form kann morphologisch Indikativ oder Imperativ sein. Im Zusammenhang ist die auffordernde Lesart besonders natürlich; „dann wisst“ gibt sie idiomatisch wieder, ohne das stärkere „erkennt“ einzutragen.
- source_word: μεμίσηκεν
  choice: hat ... gehasst
  rationale: Das deutsche Perfekt gibt die vorausliegende Handlung mit ihrer bleibenden Bedeutung natürlich wieder.
- source_word: πρῶτον ὑμῶν
  choice: schon vor euch
  rationale: Mit dem Genitiv drückt πρῶτον zeitlichen Vorrang aus. „Vor euch“ ist im Deutschen idiomatisch; „schon“ unterstreicht die vorausliegende und weiterhin relevante Ablehnung, ohne ein zusätzliches Ereignis einzuführen.
theological_decisions:
- issue: Bedeutung von κόσμος im johanneischen Zusammenhang
  choice: „die Welt“ bleibt ohne erklärende Erweiterung im Haupttext stehen.
  alternative: „das Weltsystem“ oder „die von Gott abgekehrte Menschheit“
  rationale: Der Zusammenhang legt eine gegen Jesus und seine Jünger gerichtete Menschenwelt nahe, doch eine ausdeutende Umschreibung würde die offene Reichweite des Ausdrucks unnötig festlegen.
- issue: Modus von γινώσκετε
  choice: 'Imperativisch: „dann wisst“'
  alternative: 'Indikativisch: „so wisst ihr“'
  rationale: Beide Deutungen sind aufgrund der Form möglich. Der auffordernde Sinn passt gut zum Trost- und Belehrungszusammenhang, die grammatische Mehrdeutigkeit wird jedoch in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Satzführung bewahrt den eindringlichen Ton. „Dann wisst“ ist allgemein verständlich; „schon vor euch“ gibt den zeitlichen Vorrang natürlich wieder.
