source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: de
  text: Wie der Vater mich geliebt hat, so habe auch ich euch geliebt. Bleibt in meiner Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie der Vater mich liebte, so liebte auch ich euch. Bleibt in meiner Liebe.“ Die griechischen Verben stehen im Aorist; im Deutschen können sie je nach Stil und Kontext mit Präteritum oder Perfekt wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Wie ... so
  rationale: Die korrelative deutsche Form gibt den Vergleich zwischen der Liebe des Vaters zu Jesus und Jesu Liebe zu den Jüngern klar und natürlich wieder.
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: der Vater mich geliebt hat
  rationale: Das Perfekt ist im modernen Deutsch eine natürliche Vergangenheitsform und lässt zugleich die fortdauernde Bedeutung dieser Liebe im Kontext erkennen, ohne sie ausdrücklich auszudeuten.
- source_word: κἀγὼ
  choice: so habe auch ich
  rationale: „Auch ich“ bewahrt den verbindenden und betonten Gehalt von κἀγώ; „so“ nimmt die durch καθὼς eröffnete Entsprechung idiomatisch auf.
- source_word: ὑμᾶς ἠγάπησα
  choice: habe auch ich euch geliebt
  rationale: Das deutsche Perfekt entspricht dem ersten Satzteil und bringt die rückblickend bezeichnete, im Zusammenhang weiterhin maßgebliche Liebe Jesu natürlich zum Ausdruck.
- source_word: μείνατε
  choice: Bleibt
  rationale: Der Imperativ Plural wird direkt und idiomatisch wiedergegeben; „bleiben“ bewahrt zugleich das johanneische Leitmotiv von μένω.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: in meiner Liebe
  rationale: Die knappe deutsche Wendung gibt sowohl ἀγάπη als auch die hervorgehobene Zugehörigkeit durch ἐμῇ sachgerecht wieder.
theological_decisions:
- issue: Bedeutung von ἀγάπη
  choice: Liebe
  alternative: Nächstenliebe; Zuneigung
  rationale: „Liebe“ ist hier der umfassende, unmarkierte Begriff und engt Jesu Aussage weder auf menschliche Nächstenliebe noch auf bloßes Gefühl ein.
- issue: Zeitliche und aspektuelle Wiedergabe von ἠγάπησέν / ἠγάπησα
  choice: deutsches Perfekt („geliebt hat“ / „habe ... geliebt“)
  alternative: Präteritum („liebte“ / „liebte“) oder präsentische Wiedergabe
  rationale: Die griechischen Aoriste stellen die Liebe jeweils als Ganzes dar. Das deutsche Perfekt ist in gegenwärtiger Standardsprache natürlich und bewahrt im Abschiedsreden-Kontext ihre bleibende Relevanz, ohne aus dem Aorist ausdrücklich eine fortdauernde Handlung zu machen.
- issue: „In meiner Liebe bleiben“
  choice: Die relationale Formulierung bleibt ohne nähere Auflösung stehen.
  alternative: „Bleibt darin, mich zu lieben“ oder „Bleibt euch meiner Liebe bewusst“
  rationale: Der Genitivgedanke in „meiner Liebe“ kann im Kontext vor allem Jesu Liebe zu den Jüngern bezeichnen, darf aber nicht paraphrastisch auf eine einzige Deutung verengt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nah am griechischen Vergleich, während „Wie ... so“ natürliches Deutsch schafft. Die Anrede „euch“ macht den Plural sichtbar.
