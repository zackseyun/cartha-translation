id: JHN.15.19
reference: John 15:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: de
  text: Wenn ihr von der Welt wärt, würde die Welt das Eigene lieben. Weil ihr aber nicht von der Welt seid, sondern ich euch aus der Welt erwählt habe, darum hasst euch die Welt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: von der Welt / aus der Welt
  rationale: Bei der Zugehörigkeit ist „von der Welt“ im Deutschen natürlich und bewahrt die johanneische Wendung; zusammen mit dem Erwählen gibt „aus der Welt“ den trennenden Ausgangspunkt von ἐκ klar wieder.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ wahrt die Breite des johanneischen Begriffs und vermeidet die einengende Deutung als bloßes „Weltsystem“.
- source_word: ἂν ... ἐφίλει
  choice: würde ... lieben
  rationale: Der deutsche Konjunktiv II gibt die nicht erfüllte Bedingung und ihre hypothetische Folge natürlich wieder.
- source_word: τὸ ἴδιον
  choice: das Ihre
  rationale: Die substantivierte Form entspricht dem substantivierten Neutrum und lässt offen, ob vor allem eigene Menschen oder allgemeiner das Eigene gemeint ist.
- source_word: φιλέω
  choice: lieben
  rationale: „Lieben“ bildet den klaren, ungeschwächten Gegensatz zu μισέω und ist im Kontext idiomatisch.
- source_word: ἐξελεξάμην
  choice: erwählt habe
  rationale: „Erwählen“ ist eine natürliche biblische Wiedergabe von ἐκλέγομαι und bezeichnet hier Jesu bewusste Wahl, ohne eine spätere Lehrsystematik einzutragen.
- source_word: διὰ τοῦτο
  choice: darum
  rationale: „Darum“ drückt den ausdrücklich begründenden Zusammenhang knapp und natürlich aus.
- source_word: μισεῖ
  choice: hasst
  rationale: Das Präsens wird als allgemeine beziehungsweise fortdauernde Wirklichkeit wiedergegeben; die Schärfe des griechischen Verbs bleibt erhalten.
theological_decisions:
- issue: Bedeutung von κόσμος im johanneischen Zusammenhang
  choice: Im Haupttext steht ohne erklärende Erweiterung „Welt“.
  alternative: „Weltsystem“ oder „die gottfeindliche Menschheit“
  rationale: Der Kontext zeichnet die Welt als einen Jesus und seinen Jüngern entgegenstehenden Bereich; die schlichte Wiedergabe bewahrt jedoch die begriffliche Weite und Mehrschichtigkeit.
- issue: Tragweite von ἐξελεξάμην
  choice: Jesu Handeln wird unmittelbar mit „ich euch ... erwählt habe“ wiedergegeben.
  alternative: Eine Formulierung, die ausdrücklich eine bestimmte Lehre von Erwählung oder Vorherbestimmung festlegt
  rationale: Der Vers sagt klar, dass Jesus die Jünger erwählt hat, entscheidet aber nicht die späteren konfessionellen Debatten über die systematische Tragweite dieser Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gegensatz und der wiederholten Wendung „Welt“, ohne unnatürlich zu wirken. „Das Ihre“ ist bewusst etwas gehoben, aber allgemein verständlich und semantisch weniger festlegend als „ihre eigenen Leute“.
