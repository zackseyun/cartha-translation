source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: de
  text: 'Denkt an das Wort, das ich euch gesagt habe: »Ein Sklave ist nicht größer als sein Herr.[a]« Wenn sie mich verfolgt haben, werden sie auch euch verfolgen. Wenn sie mein Wort bewahrt haben, werden sie auch eures bewahren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Diener ist nicht größer als sein Herr.« Das griechische Wort kann je nach Zusammenhang »Sklave« oder »Diener« bedeuten; hier hebt die Gegenüberstellung mit dem Herrn die untergeordnete Stellung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wenn sie mein Wort befolgt haben, werden sie auch eures befolgen.« Das griechische Verb kann sowohl das Bewahren beziehungsweise Festhalten als auch das gehorsame Befolgen eines Wortes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Denkt an
  rationale: Der Präsensimperativ fordert dazu auf, Jesu frühere Aussage fortwährend im Gedächtnis zu behalten; „Denkt an“ ist natürliches, gegenwärtiges Deutsch.
- source_word: λόγου
  choice: Wort
  rationale: Gemeint ist hier die konkrete frühere Aussage Jesu. „Wort“ bewahrt zugleich den johanneischen Sprachgebrauch und die Wiederaufnahme im zweiten Versteil.
- source_word: δοῦλος
  choice: Sklave
  rationale: Im Gegensatz zu κύριος bezeichnet δοῦλος eine rechtlich und sozial untergeordnete Person. „Sklave“ gibt dieses starke Statusgefälle genauer wieder als „Diener“.
- source_word: μείζων
  choice: größer
  rationale: Die allgemeine Vergleichsaussage über Rang und Stellung bleibt so bewusst breit und wird nicht auf „wichtiger“ oder „höhergestellt“ verengt.
- source_word: κυρίου
  choice: Herr
  rationale: Im Verhältnis zu „Sklave“ bezeichnet κύριος dessen Herrn beziehungsweise Besitzer. „Herr“ erhält die traditionelle und idiomatische Paarung, ohne das Wort hier als göttlichen Titel zu markieren.
- source_word: ἐδίωξαν / διώξουσιν
  choice: verfolgt haben / werden ... verfolgen
  rationale: Im Kontext der Feindschaft gegen Jesus und seine Jünger bezeichnet διώκω feindselige Verfolgung.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: befolgt haben / werden ... befolgen
  rationale: Bei einem „Wort“ bezeichnet τηρέω hier dessen Beachtung mit gehorsamer Aufnahme. „Befolgen“ ist im Deutschen idiomatischer als „ein Wort halten“ und lässt die positive Aufnahme der Botschaft erkennen.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: mein Wort ... eures
  rationale: Die knappe Parallelität des Griechischen bleibt erhalten; „eures“ bezieht sich eindeutig auf „Wort“ und kennzeichnet die Verkündigung der Jünger als Entsprechung zu Jesu Wort.
theological_decisions:
- issue: Wiedergabe von δοῦλος in der Rangvergleichsaussage
  choice: Sklave
  alternative: Diener
  rationale: Die Aussage beruht auf dem ausgeprägten sozialen Gefälle zwischen δοῦλος und κύριος. „Sklave“ bewahrt diese historische und rhetorische Schärfe; die Fußnote nennt die geläufige schwächere Alternative.
- issue: Bedeutungsumfang von τηρέω beim Wort Jesu
  choice: befolgen
  alternative: bewahren / festhalten
  rationale: Der Ausdruck kann sowohl das Annehmen als auch das gehorsame Beachten des Wortes umfassen. „Befolgen“ ist im heutigen Deutsch natürlich, während die Fußnote den weiteren Bedeutungsumfang offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt der klaren Dreiteilung des griechischen Textes. „Sklave“ ist historisch präzise, „Herr“ in dieser Relation idiomatisch; die Fußnoten bewahren relevante lexikalische Alternativen und die Bedeutungsbreite von τηρέω.
