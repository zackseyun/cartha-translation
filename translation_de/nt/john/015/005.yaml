source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: de
  text: Ich bin der Weinstock, ihr seid die Reben. Wer in mir bleibt und ich in ihm[a], der bringt viel Frucht; denn getrennt von mir könnt ihr nichts tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische „ihm“ steht im männlichen Singular, ist hier aber stellvertretend gebraucht: Die Aussage gilt allgemein jedem Menschen, der in Jesus bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: Weinstock
  rationale: Im Deutschen bezeichnet „Weinstock“ natürlich die ganze Weinpflanze und bildet zusammen mit „Reben“ das vertraute, klare Bild.
- source_word: κλήματα
  choice: Reben
  rationale: κλήματα sind im weinbaulichen Zusammenhang die Zweige beziehungsweise Triebe des Weinstocks. „Reben“ ist hier die geläufige biblische und allgemein verständliche Bezeichnung.
- source_word: ὁ μένων
  choice: Wer ... bleibt
  rationale: Die substantivierte Partizipialform wird idiomatisch und allgemein gültig wiedergegeben. „Bleibt“ bewahrt den fortdauernden, relationalen Sinn von μένω.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: in mir ... in ihm
  rationale: Die Präposition „in“ erhält die starke wechselseitige Verbundenheits- und Innewohnungssprache des griechischen Textes.
- source_word: φέρει καρπὸν πολύν
  choice: bringt viel Frucht
  rationale: „Frucht bringen“ ist im Deutschen die natürliche Verbindung innerhalb des Weinstockbildes und gibt den Sinn ohne unnötige Ausdeutung wieder.
- source_word: χωρὶς ἐμοῦ
  choice: getrennt von mir
  rationale: Die Formulierung hebt entsprechend χωρίς die Trennung von Jesus hervor und bezeichnet nicht bloß fehlende Hilfe.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: könnt ihr nichts tun
  rationale: Diese knappe, natürliche deutsche Formulierung drückt die im Griechischen bezeichnete Unfähigkeit vollständig aus.
theological_decisions:
- issue: Johanneische Sprache wechselseitiger Innewohnung
  choice: „in mir bleibt und ich in ihm“
  alternative: „bei mir bleibt und ich bei ihm“
  rationale: „In“ wahrt die auffällige reziproke Aussage des griechischen Textes und schwächt ihre theologische Spannung nicht zu einem bloßen Zusammensein ab.
- issue: Generisch-repräsentatives Maskulinum αὐτῷ
  choice: „ihm“ im Haupttext, mit erläuternder Fußnote
  alternative: „diesem Menschen“ oder eine pluralische Formulierung
  rationale: Das maskuline Singularpronomen des griechischen Satzes wird formal bewahrt; die Fußnote macht deutlich, dass die Aussage allgemein für jeden Menschen gilt, der in Jesus bleibt.
- issue: Reichweite von „nichts tun“
  choice: Die uneingeschränkte Formulierung des Ausgangstextes wird beibehalten
  alternative: „nichts geistlich Fruchtbares tun“
  rationale: Eine einschränkende Ergänzung würde die Aussage auslegen und ihre bewusst zugespitzte Form abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter Bildsprache. Der Satzbau bleibt nah an der prägnanten Struktur des griechischen Textes; das einleitende „der“ im Folgesatz sorgt für natürliche deutsche Hervorhebung.
