  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: de
  text: Wenn der Beistand[a] kommt, den ich euch vom Vater senden werde – der Geist der Wahrheit, der vom Vater ausgeht[b] –, dann wird er von mir Zeugnis geben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürsprecher“, „Helfer“, „Tröster“; auch als „Paraklet“ wiedergegeben. Das griechische Wort παράκλητος umfasst mehrere dieser Bedeutungsnuancen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich entsprechend dem Griechischen: „vom Vater ausgeht“; diese Formulierung erlangte später besondere Bedeutung in der Trinitätslehre.'
    reason: theological_context
  - marker: c
    text: 'Oder: „dann wird er über mich aussagen“ beziehungsweise „von mir Zeugnis ablegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Wenn … kommt
  rationale: Ὅταν mit Aorist Konjunktiv bezeichnet hier das erwartete zukünftige Eintreffen. Im Deutschen ist dafür die Präsensform im temporalen Nebensatz natürlich.
- source_word: ὁ παράκλητος
  choice: der Beistand
  rationale: „Beistand“ gibt die persönliche helfende, vertretende und unterstützende Rolle wieder, ohne den griechischen Ausdruck lediglich zu übertragen. Da kein einzelnes deutsches Wort alle Bedeutungsnuancen erfasst, werden Alternativen in einer Fußnote genannt.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: den ich euch … senden werde
  rationale: Das Futur πέμψω und der Dativ ὑμῖν werden direkt und in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: παρὰ τοῦ πατρός
  choice: vom Vater
  rationale: παρά mit Genitiv bezeichnet die Herkunft vom Vater beziehungsweise aus seiner Gegenwart. „Vom Vater“ ist knapp und quellennah.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: der Geist der Wahrheit
  rationale: Die Genitivverbindung bleibt entsprechend dem johanneischen Ausdruck als Titel erhalten.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: der vom Vater ausgeht
  rationale: „Ausgeht“ bewahrt die Bewegungs- und Herkunftsbedeutung von ἐκπορεύεται genauer als das allgemeinere „kommt“. Der Relativsatz wird im Deutschen persönlich formuliert.
- source_word: ἐκεῖνος
  choice: dann wird er
  rationale: Das Personalpronomen wahrt die persönliche Darstellung des Geistes; „dann“ nimmt die einleitende Zeitangabe auf. Das im Griechischen nachdrückliche Demonstrativpronomen wird so in flüssigem Deutsch wiedergegeben.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: wird er von mir Zeugnis geben
  rationale: Die Wendung gibt den Zeugnischarakter von μαρτυρέω und den Gegenstandsbezug von περί wieder. „Von mir Zeugnis geben“ ist würdig, verständlich und idiomatisch.
theological_decisions:
- issue: Wiedergabe von παράκλητος im trinitarischen Zusammenhang
  choice: Beistand
  alternative: Fürsprecher; Helfer; Tröster; Paraklet
  rationale: Der Ausdruck ist bedeutungsreich. „Beistand“ hält die persönliche und unterstützende beziehungsweise vertretende Funktion offen, ohne die Rolle auf Trost, Rechtsvertretung oder allgemeine Hilfe zu verengen.
- issue: Persönliche Bezugnahme auf den Geist
  choice: der … er
  alternative: das … es
  rationale: πνεῦμα ist grammatisch sächlich, doch ἐκεῖνος nimmt den Geist beziehungsweise Beistand mit einem maskulinen, nachdrücklichen Ausdruck auf. Die persönliche deutsche Wiedergabe folgt dieser Darstellung.
- issue: Wiedergabe von ἐκπορεύεται
  choice: vom Vater ausgeht
  alternative: vom Vater hervorgeht; vom Vater kommt
  rationale: „Ausgeht“ bleibt lexikalisch konkret und bewahrt die Formulierung des griechischen Textes, ohne spätere trinitätstheologische Folgerungen in den Vers hineinzulesen. Die spätere dogmengeschichtliche Bedeutung wird lediglich in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet „der Geist der Wahrheit“ als erläuternde Apposition. „Beistand“ und „Zeugnis geben“ bewahren den johanneischen und zeugnishaften Ton, bleiben aber für heutige Leser verständlich.
