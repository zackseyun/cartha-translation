revisions:
- from: Wenn jemand nicht in mir bleibt[a], wird er hinausgeworfen wie die Rebe und verdorrt. Man sammelt solche Reben ein und wirft sie ins Feuer[b], und sie verbrennen.
  to: Wenn jemand nicht in mir bleibt[a], wird er hinausgeworfen wie die Rebe und verdorrt. Man sammelt solche Reben ein und wirft sie ins Feuer[b], und sie werden verbrannt.
  rationale: Die einzige sichere Korrektur ist die Änderung von „sie verbrennen“ zu „sie werden verbrannt“, damit die passive Verbform καίεται und die Bildhandlung des Verbrennens deutlich bleiben. Der deutsche Plural folgt weiterhin natürlich den unmittelbar zuvor gesammelten Reben, ohne die im griechischen Text vorhandene, syntaktisch auffällige Singularform dogmatisch oder interpretativ aufzulösen.
