  verdict: revise
  source_fidelity: Die Übersetzung gibt Bedingung, Nichtbleiben „in mir“, das Hinauswerfen, Verdorren sowie das Sammeln und Werfen ins Feuer insgesamt sachgerecht wieder. Im letzten Satzteil ist jedoch καίεται ein Passiv. „Sie verbrennen“ kann im Deutschen intransitiv verstanden werden und gibt die passive Bildhandlung weniger deutlich wieder. Der griechische Singular nach dem vorhergehenden Plural ist auffällig; die deutsche pluralische Rückaufnahme der gesammelten Reben ist idiomatisch, sollte aber das Passiv bewahren.
  naturalness: Modernes, würdiges Standarddeutsch. „Man“ ist eine natürliche Wiedergabe des unbestimmten griechischen Plurals. „Rebe“ ist im Weinstockbild geläufig; „solche Reben“ macht den Wechsel vom exemplarischen Singular zum Plural verständlich.
  terminology: „Bleiben in mir“ bewahrt das johanneische Schlüsselwort μένω und die direkte Formulierung ἐν ἐμοί. Die Fußnoten erläutern die lexikalische Alternative und die theologisch nicht aufgelöste Warnfunktion ausgewogen, ohne eine konfessionelle Deutung festzuschreiben.
