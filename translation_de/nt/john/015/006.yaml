id: JHN.15.6
reference: John 15:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: de
  text: Wenn jemand nicht in mir bleibt[a], wird er hinausgeworfen wie die Rebe und verdorrt. Man sammelt solche Reben ein und wirft sie ins Feuer[b], und sie werden verbrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch mit „in mir verweilen“ wiedergegeben werden. „Bleiben“ bezeichnet hier eine fortdauernde Beziehung und Verbundenheit mit Jesus.
    reason: lexical_alternative
  - marker: b
    text: Das Bild warnt vor Ausschluss und Verbrennung. Der Vers selbst legt jedoch nicht fest, ob damit der Verlust echter Jüngerschaft oder die Offenlegung einer nur scheinbaren Zugehörigkeit gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: bleibt
  rationale: „Bleiben“ ist die natürliche und zugleich konsequente Wiedergabe des johanneischen Schlüsselverbs μένω; es bezeichnet hier fortdauernde Beziehung und Verbundenheit.
- source_word: ἐν ἐμοί
  choice: in mir
  rationale: Die Präpositionalphrase wird direkt beibehalten, damit ihre relationale und theologische Aussagekraft nicht zu „bei mir“ oder „mit mir verbunden“ abgeschwächt beziehungsweise ausgedeutet wird.
- source_word: ἐβλήθη ἔξω
  choice: wird er hinausgeworfen
  rationale: Das deutsche Präsens passt zur allgemeinen Bedingung und wahrt sowohl das Passiv als auch die konkrete räumliche Bildsprache.
- source_word: ὡς τὸ κλῆμα
  choice: wie die Rebe
  rationale: κλῆμα bezeichnet im unmittelbaren Weinstockbild einen Rebzweig. „Rebe“ ist im Deutschen die geläufige biblische Bezeichnung für diesen Zweig und knüpft an den Kontext an.
- source_word: ἐξηράνθη
  choice: verdorrt
  rationale: „Verdorren“ gibt das Austrocknen eines abgetrennten Rebzweigs knapp und idiomatisch wieder.
- source_word: συνάγουσιν
  choice: Man sammelt ... ein
  rationale: Der unbestimmte Plural bezeichnet nicht näher genannte Handelnde. Das deutsche unpersönliche „man“ bewahrt diese Unbestimmtheit natürlicher als ein mehrdeutiges „sie“.
- source_word: αὐτὰ
  choice: solche Reben
  rationale: Das griechische Pronomen steht im Plural und verallgemeinert vom einzelnen Rebzweig auf derartige Reben. Die Wiederaufnahme als „solche Reben“ macht den Numeruswechsel im Deutschen verständlich, ohne die Handelnden mit den Gegenständen zu verwechseln.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: wirft sie ins Feuer
  rationale: Die Formulierung ist konkret, gegenwärtig und entspricht der Bildhandlung des griechischen Textes.
- source_word: καίεται
  choice: sie verbrennen
  rationale: Das griechische Singularverb nimmt wahrscheinlich das kollektive beziehungsweise repräsentative Bild der Rebe wieder auf, während zuvor mehrere Reben gesammelt werden. Im Deutschen führt der Plural die unmittelbar genannten Reben natürlich fort; „verbrennen“ lässt offen, ob der Vorgang oder sein Ergebnis betont ist.
- source_word: τις
  choice: jemand
  rationale: „Jemand“ entspricht dem indefiniten Singular und ist in der deutschen Bedingungsform „wenn jemand“ idiomatisch und allgemein.
theological_decisions:
- issue: Ob die Warnung als Verlust echter Jüngerschaft oder als Offenbarung nur scheinbarer Zugehörigkeit festgelegt werden soll
  choice: Direkte Wiedergabe der metaphorischen Warnung ohne dogmatische Festlegung
  alternative: Ausdrückliche Deutung entweder als Abfall wahrer Glaubender oder als Gericht über Menschen, die Jesus nie wirklich angehörten
  rationale: Der Vers spricht von Nichtbleiben, Ausschluss und Verbrennung, bestimmt aber den vorherigen geistlichen Status der betroffenen Person nicht ausdrücklich. Die Übersetzung bewahrt daher Schärfe und Spannung des Bildes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten die Eindringlichkeit des Warnbildes. „Man“ bildet den unbestimmten griechischen Plural idiomatisch ab; „solche Reben“ verdeutlicht den Wechsel vom beispielhaften Singular zum Plural.
