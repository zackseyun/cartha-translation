id: JHN.15.15
reference: John 15:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: de
  text: Ich nenne euch nicht mehr Sklaven[a], denn ein Sklave weiß nicht, was sein Herr tut. Euch aber habe ich Freunde genannt, denn ich habe euch alles bekannt gemacht, was ich von meinem Vater gehört habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch mit »Diener« oder »Knechte« wiedergegeben werden; hier betont »Sklaven« den Gegensatz zum vertrauten Verhältnis von Freunden.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: Ich nenne euch nicht mehr
  rationale: Die Wendung bezeichnet, wie Jesus die Jünger nennt beziehungsweise einordnet. Das Präsens von λέγω und die zeitliche Verneinung οὐκέτι werden natürlich und genau wiedergegeben.
- source_word: δούλους / ὁ δοῦλος
  choice: Sklaven / ein Sklave
  rationale: δοῦλος kann je nach Zusammenhang einen Sklaven oder Diener bezeichnen. Der Gegensatz zu Freunden sowie die Unterordnung unter einen Herrn rücken hier den unfreien Status in den Vordergrund.
- source_word: οὐκ οἶδεν τί ποιεῖ
  choice: weiß nicht, was ... tut
  rationale: οἶδα bezeichnet Wissen; die einfache deutsche Präsensform gibt τί ποιεῖ natürlich wieder, ohne eine besondere Verlaufsbedeutung aufzuzwingen.
- source_word: αὐτοῦ ὁ κύριος
  choice: sein Herr
  rationale: κύριος bezeichnet hier innerhalb des Sklavenverhältnisses den Herrn des Sklaven. Das deutsche »Herr« bewahrt sowohl die konkrete soziale Bedeutung als auch die Wortnähe, ohne es als göttlichen Titel großzuschreiben.
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: Euch aber habe ich Freunde genannt
  rationale: Die Voranstellung von »Euch aber« erhält den Kontrast. Das Perfekt εἴρηκα wird mit dem deutschen Perfekt wiedergegeben und bezeichnet eine erfolgte, weiterhin gültige Benennung.
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: alles, was ich von meinem Vater gehört habe
  rationale: πάντα ἃ wird idiomatisch als »alles, was« wiedergegeben; παρά mit Genitiv bezeichnet die Quelle, und ἀκούω behält seine Grundbedeutung »hören«.
- source_word: ἐγνώρισα ὑμῖν
  choice: habe ich euch ... bekannt gemacht
  rationale: γνωρίζω bedeutet hier, etwas mitzuteilen oder bekannt zu machen. Das deutsche Perfekt lässt die vollzogene Offenlegung mit ihrer fortdauernden Bedeutung erkennen.
theological_decisions:
- issue: Sozialer Status in δοῦλος
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Die Gegenüberstellung von Unwissenheit in einem Unterordnungsverhältnis und vertraulicher Mitteilung an Freunde spricht für den stärkeren Statusbegriff »Sklaven«. Die Übersetzung macht daraus jedoch keine Aussage, dass die Jünger Jesus in jeder Hinsicht nicht mehr dienen.
- issue: Bedeutung von κύριος in der Analogie
  choice: sein Herr
  alternative: sein Gebieter; sein Besitzer
  rationale: Der Ausdruck bezeichnet hier den übergeordneten Herrn eines Sklaven, nicht ausdrücklich einen christologischen Titel. »Herr« ist im Deutschen natürlich und hält zugleich die lexikalische Breite des griechischen Wortes offen.
- issue: Resultative Bedeutung von εἴρηκα
  choice: habe ich Freunde genannt
  alternative: nenne ich Freunde; nannte ich Freunde
  rationale: Das deutsche Perfekt wahrt, dass die Benennung bereits erfolgt ist und weiterhin gilt, ohne die Aussage stärker systematisch auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt der griechischen Kontraststruktur, bleibt aber idiomatisch. »Bekannt gemacht« ist bewusst klarer und weniger fachsprachlich als »offenbart«.
