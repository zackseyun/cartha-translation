  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: de
  text: Ich bin der wahre Weinstock, und mein Vater ist der Weingärtner[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weinbauer“. Das griechische Wort bezeichnet allgemein jemanden, der das Land bearbeitet; hier ist es auf die Pflege des Weinstocks bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die natürliche deutsche Wiedergabe bewahrt die prägnante Form des johanneischen Ich-bin-Wortes; eine Verstärkung zu „Ich selbst bin“ wäre im Deutschen unnötig schwer.
- source_word: ἄμπελος
  choice: Weinstock
  rationale: „Weinstock“ ist im Deutschen die natürliche und bildkräftige Bezeichnung für die Weinrebe als ganze Pflanze und entspricht dem metaphorischen Zusammenhang.
- source_word: ἀληθινή
  choice: wahr
  rationale: „Wahr“ bewahrt die für Johannes charakteristische Bedeutungsbreite zwischen wahrhaftig, wirklich und der göttlichen Wirklichkeit vollkommen entsprechend, ohne sie einseitig festzulegen.
- source_word: ὁ πατήρ μου
  choice: mein Vater
  rationale: Die Wendung gibt Jesu persönliche Beziehung zu Gott unmittelbar und ohne erklärende Zusätze wieder.
- source_word: ὁ γεωργός
  choice: der Weingärtner
  rationale: Das Grundwort bezeichnet einen Landarbeiter beziehungsweise Landwirt; im Bild vom Weinstock macht „Weingärtner“ den konkreten Anbauzusammenhang klar und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Die metaphorische Identifikation im Ich-bin-Wort
  choice: Das Bild wird unmittelbar als „Ich bin der wahre Weinstock“ wiedergegeben.
  alternative: Ich bin der wirkliche/echte Weinstock.
  rationale: Die Übersetzung lässt die Metapher und die theologische Spannung des johanneischen Wortes stehen, ohne seine Symbolik auszudeuten. „Wahr“ erhält zudem den charakteristischen johanneischen Sprachklang.
- issue: Die Rolle des Vaters im Weinbau-Bild
  choice: Weingärtner
  alternative: Weinbauer; Landwirt
  rationale: „Weingärtner“ bindet die Tätigkeit des Vaters klar an den Weinstock, ohne eine weitergehende dogmatische Deutung einzutragen. Die allgemeinere Grundbedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, einprägsamer Satzstruktur. Die traditionelle Bildsprache „wahrer Weinstock“ bleibt erhalten; „Weingärtner“ ist anschaulich und im Zusammenhang unmittelbar verständlich.
