  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: de
  text: Das alles habe ich euch gesagt, damit meine Freude in euch sei[a] und eure Freude vollkommen werde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Fülle gelangt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: das alles
  rationale: Die Wendung gibt den pluralischen Rückbezug auf Jesu vorausgehende Worte im natürlichen modernen Deutsch wieder.
- source_word: λελάληκα ὑμῖν
  choice: habe ich euch gesagt
  rationale: Das Perfekt wird mit dem deutschen Perfekt wiedergegeben; „gesagt“ ist hier natürlicher als das formellere „gesprochen“ und bewahrt den Sinn einer an die Jünger gerichteten Äußerung.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ drückt den Zweck beziehungsweise das beabsichtigte Ergebnis idiomatisch aus.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: meine Freude
  rationale: Die knappe possessive Formulierung bewahrt offen, ob Jesu eigene Freude mit den Jüngern geteilt wird oder ob es um die von ihm ausgehende Freude geht.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: „In euch“ entspricht der primären räumlich-internen Lesart; die ebenfalls mögliche gemeinschaftliche Bedeutung „unter euch“ wird in einer Fußnote erhalten.
- source_word: ᾖ
  choice: ist
  rationale: Nach „damit“ kennzeichnet der deutsche Indikativ den beabsichtigten Zustand natürlich; ein zusätzliches Modalverb ist im Deutschen nicht erforderlich.
- source_word: ἡ χαρὰ ὑμῶν
  choice: eure Freude
  rationale: Die possessive Wendung bildet den bewussten Gegensatz zu „meine Freude“ klar und idiomatisch ab.
- source_word: πληρωθῇ
  choice: vollkommen wird
  rationale: Die Formulierung gibt den passiven Gedanken des Zur-Vollendung-Kommens wieder und klingt in Verbindung mit „Freude“ natürlich.
theological_decisions:
- issue: Bedeutung von „meine Freude“
  choice: Die knappe Formulierung „meine Freude“ bleibt ohne erklärende Erweiterung stehen.
  alternative: „die Freude, die ich euch gebe“ oder „die Freude über mich“
  rationale: Der griechische Text bestimmt nicht ausdrücklich, ob Jesu eigene Freude geteilt oder von ihm Freude vermittelt wird. Eine Erweiterung würde diese theologische Offenheit unnötig einschränken.
- issue: Ort beziehungsweise Bereich der Freude Jesu
  choice: „in euch“
  alternative: „unter euch“
  rationale: ἐν ὑμῖν lässt beide Deutungen zu. Die Hauptfassung wahrt die naheliegende innere Dimension, während die Fußnote die gemeinschaftliche Lesart offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das alles“ ist flüssiger als das steifere „Diese Dinge“, ohne den pluralischen Rückbezug aufzugeben. Die Satzstruktur bleibt eng am griechischen Zweckgefüge.
