  source_fidelity: 'Der Entwurf gibt den Inhalt des griechischen Textes insgesamt zuverlässig wieder: ταῦτα ist angemessen als „Das alles“ gefasst, λελάληκα als deutsches Perfekt, und die beiden Besitzangaben bleiben klar unterschieden. ἐν ὑμῖν wird sinnvoll mit „in euch“ wiedergegeben; „unter euch“ bleibt als echte lexikalische Möglichkeit in der Anmerkung erhalten. Bei πληρωθῇ trifft „vollkommen werde“ den Gedanken der zur vollen Entfaltung bzw. Vollendung gelangenden Freude besser als eine interpretierende Umschreibung.'
  naturalness: Die Formulierung „damit meine Freude in euch ist“ ist zwar verständlich, markiert den vom griechischen ἵνα-Satz getragenen Ziel- bzw. Wunschcharakter im Deutschen jedoch weniger deutlich. Die Konjunktivformen „sei“ und „werde“ sind in diesem würdigen, modernen Bibelregister idiomatisch und machen die Satzverknüpfung klarer.
  terminology: „Freude“ ist für χαρά konsequent und idiomatisch. „Meine Freude“ wahrt die semantische und theologische Offenheit des Genitiv-/Possessivbezugs, ohne ihn als von Jesus gegebene Freude zu erläutern. „Vollkommen werde“ ist für πληρωθῇ angemessen; die Fußnotenalternative „zur Fülle gelangt“ bleibt als mögliche Ergebnisumschreibung vertretbar.
  issues:
