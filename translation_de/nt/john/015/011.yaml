    rationale: Der griechische ἵνα-Satz mit den Konjunktiven ᾖ und πληρωθῇ bezeichnet den beabsichtigten Zustand bzw. das Ziel. Im Deutschen stellt „sei … werde“ dies klarer dar, ohne den Sinn zu verändern.
