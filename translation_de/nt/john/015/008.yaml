id: JHN.15.8
reference: John 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: de
  text: 'Darin wird mein Vater verherrlicht: dass ihr viel Frucht bringt und meine Jünger werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Darin
  rationale: Bewahrt den rück- oder vorausweisenden Charakter der Wendung; der folgende dass-Satz erläutert, worin die Verherrlichung des Vaters besteht.
- source_word: ἐδοξάσθη
  choice: wird … verherrlicht
  rationale: Das deutsche Präsens ist in diesem allgemein gültigen Zusammenhang natürlicher als ein isoliertes Perfekt und gibt das theologische Passiv wieder, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: καρπὸν πολὺν φέρητε
  choice: viel Frucht bringt
  rationale: Bewahrt das im Kontext zentrale Bild des Fruchtbringens und gibt den Mengenakzent von πολύς direkt wieder.
- source_word: γένησθε
  choice: werdet
  rationale: Gibt den im SBLGNT bezeugten Aorist-Konjunktiv von γίνομαι wieder und bewahrt gegenüber einer Lesart wie „erweist euch als“ den Gedanken des Werdens.
- source_word: ἐμοὶ μαθηταί
  choice: meine Jünger
  rationale: Natürliches Deutsch für die Zugehörigkeitsbeziehung des Dativs ἐμοί; „Jünger“ erhält den sachlichen und traditionsgeprägten Sinn von μαθηταί.
theological_decisions:
- issue: Verhältnis von Fruchtbringen und Jüngerwerden
  choice: „dass ihr viel Frucht bringt und meine Jünger werdet“
  alternative: „dass ihr viel Frucht bringt und euch als meine Jünger erweist“
  rationale: Der griechische Text verbindet beide Aussagen mit καί und verwendet γένησθε („werdet“). Die Übersetzung wahrt diese Spannung, statt das Jüngerwerden interpretierend nur als Nachweis bereits bestehender Jüngerschaft zu erklären.
- issue: Zeitform von ἐδοξάσθη
  choice: „wird … verherrlicht“
  alternative: „ist … verherrlicht worden“
  rationale: Der Aorist kann die Verherrlichung als feststehendes bzw. durch den genannten Vorgang eintretendes Geschehen darstellen. Im Deutschen vermittelt das Präsens den Zusammenhang idiomatisch, ohne eine ausschließlich vergangene Verherrlichung nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und das vertraute johanneische Bildwort „Frucht bringen“ bleiben erhalten; der Doppelpunkt macht die erläuternde Funktion des ἵνα-Satzes transparent.
