  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: de
  text: Das alles gebiete ich euch, damit ihr einander liebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das gebiete ich euch: Liebt einander.« Der mit ἵνα eingeleitete Satz kann einen Zweck ausdrücken oder nahezu den Inhalt des Gebots angeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: das alles
  rationale: Das substantivierte Demonstrativpronomen steht im griechischen Neutrum Plural und verweist wahrscheinlich auf die vorausgehenden Weisungen. »Das alles« gibt diesen zusammenfassenden Rückbezug im Deutschen natürlich wieder.
- source_word: ἐντέλλομαι
  choice: gebiete ich
  rationale: Das Präsens bezeichnet hier ein verbindliches Gebieten. Das deutsche Präsens ist idiomatisch und bewahrt die unmittelbare Kraft der Aussage, ohne den Verlauf eigens zu überzeichnen.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ der zweiten Person Plural wird nach »gebieten« direkt und natürlich mit »euch« wiedergegeben.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« gibt die naheliegende finale Bedeutung des ἵνα-Satzes wieder und lässt den Zusammenhang zwischen Jesu Gebieten und der gegenseitigen Liebe klar erkennen.
- source_word: ἀγαπᾶτε
  choice: liebt
  rationale: Der Präsens Konjunktiv steht in einem ἵνα-Satz. Nach deutschem »damit« ist der Indikativ »liebt« die natürliche Wiedergabe; eine ausdrücklich fortdauernde Bedeutung wie »weiter liebt« wäre stärker als die Form verlangt.
- source_word: ἀλλήλους
  choice: einander
  rationale: Das reziproke Pronomen bezeichnet die gegenseitige Liebe innerhalb der angesprochenen Gruppe; »einander« ist prägnant und idiomatisch.
theological_decisions:
- issue: Verhältnis zwischen dem Gebieten und dem ἵνα-Satz
  choice: 'Der Satz wird als Zweckbeziehung wiedergegeben: Jesus gebietet dies alles, damit die Jünger einander lieben.'
  alternative: 'Der ἵνα-Satz kann nahezu den Inhalt des Gebots entfalten: »Das gebiete ich euch: Liebt einander.«'
  rationale: Die finale Wiedergabe mit »damit« entspricht der gewöhnlichen Funktion von ἵνα und bewahrt die griechische Satzstruktur. Da ἵνα im johanneischen Sprachgebrauch bisweilen einer Inhaltsangabe nahekommt, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Das alles« ist verständlicher und idiomatischer als ein wörtlich-plurales »diese Dinge«; »gebieten« bewahrt den verbindlichen Ton des griechischen Verbs.
