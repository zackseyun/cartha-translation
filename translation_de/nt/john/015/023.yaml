  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: de
  text: Wer mich hasst, hasst auch meinen Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐμὲ μισῶν
  choice: Wer mich hasst
  rationale: Der substantivierte Präsenspartizipialausdruck bezeichnet allgemein eine Person, die durch dieses Handeln gekennzeichnet ist. „Wer mich hasst“ gibt den generischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: μισῶν / μισεῖ
  choice: hasst / hasst
  rationale: μισέω bedeutet „hassen“. Das deutsche Präsens entspricht hier dem allgemeinen beziehungsweise charakterisierenden Gebrauch; die Wiederholung desselben Verbs bewahrt die pointierte Parallelität des Griechischen.
- source_word: καὶ
  choice: auch
  rationale: καί verbindet hier den Hass gegen Jesus mit dem Hass gegen seinen Vater und hat im Deutschen idiomatisch den Sinn „auch“.
- source_word: τὸν πατέρα μου
  choice: meinen Vater
  rationale: Der Ausdruck wird im Deutschen natürlich possessiv wiedergegeben. „Vater“ ist als Bezeichnung Gottes großgeschrieben und bezeichnet Jesu Beziehung zu ihm.
theological_decisions:
- issue: Großschreibung von „Vater“ als Bezeichnung Gottes
  choice: meinen Vater
  alternative: meinen vater
  rationale: Nach deutscher Rechtschreibung wird das Substantiv ohnehin großgeschrieben; zugleich bleibt der klare Bezug auf Gott als Jesu Vater erhalten, ohne zusätzliche dogmatische Präzisierung.
- issue: Verhältnis zwischen dem Hass gegen Jesus und dem Hass gegen den Vater
  choice: „auch“ bewahrt die ausdrückliche Verknüpfung
  alternative: „und“ als rein koordinierende Wiedergabe
  rationale: Die Übersetzung sagt mit dem griechischen Text, dass der Hass gegen Jesus zugleich seinen Vater betrifft, ohne die Aussage weiter systematisch-theologisch zu erklären.
translation_notes:
  register: Knappes, würdiges und allgemein verständliches Standarddeutsch. Die Wiederholung „hasst … hasst“ bildet die rhetorische Schärfe und die lexikalische Wiederholung des Ausgangstextes ab.
