source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: de
  text: Aber all das werden sie euch wegen meines Namens antun[a], weil sie den nicht kennen, der mich gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gegen euch“. Die griechische Wendung bezeichnet Handlungen, die auf die Jünger gerichtet sind; im Zusammenhang ist ein feindseliger Sinn naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Kennzeichnet den deutlichen Gegensatz zum vorausgehenden Gedanken und klingt im modernen Deutschen natürlich.
- source_word: ταῦτα πάντα
  choice: all das
  rationale: Gibt sowohl den rückverweisenden Charakter des Demonstrativpronomens als auch die Gesamtheit wieder, ohne unnötig schwerfällig zu klingen.
- source_word: ποιήσουσιν εἰς ὑμᾶς
  choice: werden sie euch antun
  rationale: Die Verbindung bezeichnet hier Handlungen, die sich feindselig gegen die Jünger richten. „Euch antun“ ist idiomatisches Deutsch; die etwas offenere Richtungsbedeutung von εἰς wird in einer Fußnote kenntlich gemacht.
- source_word: διὰ τὸ ὄνομά μου
  choice: wegen meines Namens
  rationale: διά mit Akkusativ bezeichnet den Grund. „Name“ bleibt erhalten, da er über bloßen Ruf hinaus Jesu Person, Identität und Autorität repräsentiert.
- source_word: οὐκ οἴδασιν
  choice: sie kennen nicht
  rationale: Bewahrt die schlichte Formulierung und lässt zugleich die im Johannesevangelium wichtige relationale Bedeutung des Kennens bestehen.
- source_word: τὸν πέμψαντά με
  choice: den, der mich gesandt hat
  rationale: Gibt das substantivierte Partizip natürlich wieder, ohne den im Kontext erkennbaren Vater ausdrücklich zu benennen, da der griechische Text den Titel nicht verwendet.
theological_decisions:
- issue: Bezug von „der mich gesandt hat“
  choice: Der implizite Bezug auf den Vater bleibt als „der mich gesandt hat“ stehen.
  alternative: „der Vater, der mich gesandt hat“
  rationale: Der johanneische Kontext macht den Bezug deutlich, doch der griechische Wortlaut nennt hier nicht ausdrücklich den Vater. Die Übersetzung vermeidet daher eine erläuternde Ergänzung im Haupttext.
- issue: Bedeutungsumfang von „wegen meines Namens“
  choice: Die Wendung bleibt wörtlich-theologisch offen und wird nicht auf Ruf, Bekenntnis oder Zugehörigkeit eingeengt.
  alternative: „weil ihr euch zu mir bekennt“
  rationale: ὄνομα kann Jesu Person, Identität und Autorität repräsentieren. Eine ausdeutende Wiedergabe würde diese Bedeutungsfülle unnötig verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „All das“ vermeidet die schwerere Form „alle diese Dinge“; „gesandt“ bewahrt den für das Johannesevangelium charakteristischen Sendungsgedanken.
