id: JHN.15.13
reference: John 15:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: de
  text: Niemand hat größere Liebe als die, dass jemand sein Leben für seine Freunde hingibt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Leben« gibt das griechische psychē wieder, das auch »Seele« oder »Selbst« bedeuten kann; hier ist das Leben gemeint, das jemand im Tod hingibt.
    reason: lexical_alternative
  - marker: b
    text: Das mit »für« wiedergegebene griechische Wort hyper kann auch »zugunsten von« oder »um ... willen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: größere Liebe als die
  rationale: Der Genitiv ταύτης steht beim Komparativ und verweist voraus auf die folgende Erläuterung; die deutsche Formulierung ist zugleich nah am Griechischen und natürlich.
- source_word: οὐδεὶς ἔχει
  choice: Niemand hat
  rationale: Die schlichte possessive Aussage wird im Deutschen direkt und idiomatisch wiedergegeben.
- source_word: ἵνα τις
  choice: dass jemand
  rationale: ἵνα erläutert hier, worin die zuvor genannte Liebe besteht; τις bleibt als unbestimmtes, generisches Subjekt erhalten.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: sein Leben hingibt
  rationale: ψυχή bezeichnet hier das irdische Leben, das im Tod gegeben wird. »Sein Leben hingeben« gibt die johanneische Wendung natürlich und würdig wieder.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: für seine Freunde
  rationale: ὑπέρ bezeichnet hier ein Handeln zugunsten anderer; »für« bewahrt die mögliche repräsentative oder stellvertretende Nuance, ohne sie einseitig festzulegen.
theological_decisions:
- issue: Bedeutung von ψυχή in der Aussage über Selbsthingabe
  choice: Leben
  alternative: Seele; Selbst
  rationale: Gemeint ist die konkrete Hingabe des eigenen Lebens bis in den Tod, nicht ausdrücklich eine Aussage über die immaterielle Seele.
- issue: Bedeutungsweite von ὑπέρ
  choice: für
  alternative: zugunsten von; um ... willen; anstelle von
  rationale: Die knappe Wiedergabe lässt die benefaktive und möglicherweise stellvertretende Bedeutung offen, statt eine einzelne theologische Auslegung festzuschreiben.
- issue: Bezug des generischen τις mit αὐτοῦ
  choice: jemand ... sein ... seine
  alternative: ein Mensch ... sein ... seine
  rationale: Die grammatisch männlichen deutschen Possessivformen beziehen sich auf das generische »jemand« und schränken die Aussage nicht auf Männer ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die Formulierung bewahrt die knappe Struktur des griechischen Satzes; »hingibt« klingt im heutigen Deutsch natürlicher als das wörtlichere »niederlegt«.
