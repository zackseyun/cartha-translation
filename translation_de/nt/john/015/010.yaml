review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Kondition von ἐὰν mit „Wenn“ angemessen wieder, bewahrt die Wiederholung von „Gebote halten“ für τηρέω/τετηρηκα und von „bleiben“ für μένω und bildet die Zeitverhältnisse korrekt ab: futurisch „werdet ... bleiben“, Perfekt „gehalten habe“ und Präsens „bleibe“. Die Bezüge von „meiner/seiner Liebe“ und „meines Vaters“ sind eindeutig und vollständig.'
  naturalness: Der Satz ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. „In meiner Liebe bleiben“ ist zwar bewusst bildhaft, aber im johanneischen Kontext verständlich und stilistisch passend. „So wie“ ist eine natürliche Wiedergabe von καθὼς.
  terminology: „Gebote“, „halten“, „Liebe“, „Vater“ und „bleiben“ sind terminologisch konsequent, entsprechen dem griechischen Wortlaut und folgen sinnvoll der englischen Audit-Spur, ohne deren Formulierungen unnötig zu kopieren.
