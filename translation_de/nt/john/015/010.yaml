id: JHN.15.10
reference: John 15:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: de
  text: Wenn ihr meine Gebote haltet, werdet ihr in meiner Liebe bleiben, so wie ich die Gebote meines Vaters gehalten habe und in seiner Liebe bleibe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Wenn
  rationale: Leitet mit dem Konjunktiv einen real dargestellten Bedingungssatz ein; „wenn“ bewahrt den konditionalen Sinn ohne zusätzliche wiederholende Nuance.
- source_word: ἐντολάς
  choice: Gebote
  rationale: Gibt den autoritativen Charakter von ἐντολή wieder und entspricht dem geläufigen johanneischen Sprachgebrauch.
- source_word: τηρήσητε / τετήρηκα
  choice: haltet / gehalten habe
  rationale: „Gebote halten“ ist im Deutschen natürlich und bewahrt sowohl die lexikalische Wiederholung als auch beim Perfekt τετήρηκα die fortdauernde Relevanz des Handelns Jesu.
- source_word: μενεῖτε / μένω
  choice: werdet ... bleiben / bleibe
  rationale: Bewahrt die Wiederholung des johanneischen Schlüsselworts μένω und drückt das Fortbestehen innerhalb einer Beziehungssphäre klar und modern aus.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: in meiner Liebe / in seiner Liebe
  rationale: Die räumlich-relationale Bildsprache der Präposition ἐν sowie die parallele Satzstruktur bleiben erhalten.
- source_word: καθὼς
  choice: so wie
  rationale: Kennzeichnet die Entsprechung zwischen dem Verhalten der Jünger und dem Beispiel Jesu in natürlichem modernem Deutsch.
- source_word: τοῦ πατρός μου
  choice: meines Vaters
  rationale: Der Genitiv wird direkt und idiomatisch wiedergegeben; „Vater“ bezeichnet hier Gott und bleibt als Beziehungsbezeichnung großgeschrieben.
theological_decisions:
- issue: Verhältnis von Gehorsam und Bleiben in Jesu Liebe
  choice: Die konditionale Beziehung wird unmittelbar wiedergegeben.
  alternative: Die Bedingung als Verdienst der Liebe oder lediglich als folgenloses Erkennungszeichen auszudeuten.
  rationale: Der griechische Text formuliert eine echte Bedingung und zieht einen Vergleich zu Jesu eigenem Halten der Gebote, entscheidet aber keine weitergehenden Lehrfragen zu Verdienst, Heilsverlust oder Heilsgewissheit.
- issue: Bedeutung von ἀγάπη
  choice: Liebe
  alternative: Nächstenliebe / Zuneigung
  rationale: „Liebe“ ist hier die umfassende, natürliche Entsprechung und erhält die identische Benennung in beiden parallelen Satzteilen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben und die johanneische Wendung „in ... Liebe bleiben“ werden bewusst beibehalten; keine erklärende Paraphrase löst die theologische Spannung auf.
