id: JHN.15.25
reference: John 15:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: de
  text: 'Doch dies geschah, damit sich das Wort erfüllte, das in ihrem Gesetz geschrieben steht: »Sie haben mich ohne Grund gehasst.«[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Doch damit sich das Wort erfüllte, das in ihrem Gesetz geschrieben steht.« Im Griechischen bleibt der Hauptsatz unausgesprochen; »dies geschah« ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: »Ihr Gesetz« bezeichnet hier die jüdischen Schriften in einem weiteren Sinn; das Zitat stammt aus den Psalmen (vgl. Ps 35,19; 69,5).
    reason: cross_reference
  - marker: c
    text: 'Oder: »ohne Anlass«; auch: »grundlos«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch dies geschah
  rationale: ἀλλά setzt einen Gegensatz zum Vorhergehenden. Das im Griechischen elliptisch bleibende Hauptgeschehen wird für verständliches modernes Deutsch aus dem Zusammenhang mit »dies geschah« ergänzt.
- source_word: ἵνα πληρωθῇ
  choice: damit sich ... erfüllte
  rationale: ἵνα mit Aorist Passiv Konjunktiv kann Zweck beziehungsweise Folge ausdrücken. Die übliche deutsche Erfüllungsformel wahrt diese Offenheit, ohne eine stärkere Determination einzutragen.
- source_word: ὁ λόγος
  choice: das Wort
  rationale: λόγος bezeichnet hier einen bestimmten Schriftwortlaut, nicht den Logos-Titel aus Johannes 1.
- source_word: ὁ ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: das in ihrem Gesetz geschrieben steht
  rationale: Das Perfektpartizip γεγραμμένος bezeichnet, was weiterhin als geschrieben feststeht. »In ihrem Gesetz« bewahrt sowohl νόμος als auch das rhetorisch markierte αὐτῶν.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι führt den Inhalt des Schriftwortes ein; im Deutschen leitet ein Doppelpunkt das Zitat natürlich ein.
- source_word: Ἐμίσησάν με
  choice: Sie haben mich ... gehasst
  rationale: Der griechische Aorist zitiert ein abgeschlossen dargestelltes Geschehen. Das deutsche Perfekt ist in heutigem Standarddeutsch natürlich und lässt den Schriftzitat-Charakter erkennen.
- source_word: δωρεάν
  choice: ohne Grund
  rationale: δωρεάν bedeutet hier grundlos beziehungsweise ohne berechtigten Anlass. »Ohne Grund« ist klar, gegenwärtig und bewahrt die moralische Aussage unverdienter Feindschaft.
theological_decisions:
- issue: »Ihr Gesetz« bei einem Zitat aus den Psalmen
  choice: νόμος wird als »Gesetz« wiedergegeben und in einer Fußnote als breitere Bezeichnung für die jüdischen Schriften erläutert.
  alternative: Im Haupttext »Schrift« schreiben.
  rationale: Der Haupttext bewahrt die ausdrückliche griechische Bezeichnung νόμος, während die Erläuterung verhindert, dass sie irrtümlich nur auf den Pentateuch beschränkt wird.
- issue: Elliptischer Anschluss nach ἀλλ’
  choice: Aus dem Kontext wird »dies geschah« ergänzt.
  alternative: 'Formal elliptisch: »Doch damit sich das Wort ... erfüllte«'
  rationale: Die Ergänzung schafft einen vollständigen, verständlichen deutschen Satz, ohne ein neues Geschehen oder eine zusätzliche theologische Behauptung einzuführen.
- issue: Zweck oder Folge in ἵνα πληρωθῇ
  choice: »damit sich ... erfüllte«
  alternative: »sodass sich ... erfüllte«
  rationale: »Damit« wahrt die johanneische Erfüllungsformel und lässt die im Zusammenhang bestehende Spannung zwischen Zweck und Folge stehen, statt sie ausdrücklich auf bloße Folge zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzergänzung dient der Verständlichkeit; »Gesetz« und die Erfüllungsformel bleiben quellennah. Das Perfekt im Zitat entspricht natürlichem heutigem Deutsch.
