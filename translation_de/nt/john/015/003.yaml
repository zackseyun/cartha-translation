  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: de
  text: Ihr seid bereits rein wegen des Wortes, das ich zu euch gesprochen habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch das Wort, das ich zu euch gesprochen habe«; auch: »aufgrund des Wortes …«'
    reason: διά mit Akkusativ bezeichnet hier wahrscheinlich den Grund bzw. die Ursache; »durch« kann als alternative, stärker vermittelnd-instrumentale Wiedergabe verstanden werden.
lexical_decisions:
- source_word: ἤδη
  choice: schon
  rationale: Bezeichnet einen bereits bestehenden gegenwärtigen Zustand und klingt im modernen Deutsch natürlich.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen wird wiedergegeben; die vorangestellte Formulierung „Ihr seid“ trägt die Betonung ohne einen unnatürlichen Zusatz wie „ihr selbst“.
- source_word: καθαροί
  choice: rein
  rationale: Bewahrt die Verbindung zum Reinigen in Vers 2 und lässt sowohl die bildliche als auch die geistlich-moralische Bedeutung offen.
- source_word: διὰ τὸν λόγον
  choice: durch das Wort
  rationale: διά mit Akkusativ kann den Grund bezeichnen; im Deutschen kann „durch“ hier zugleich vermittelnde Ursache bzw. Mittel ausdrücken und bewahrt so die genuine Deutungsspannung.
- source_word: λόγον
  choice: Wort
  rationale: Ist die direkte und johanneisch geprägte Wiedergabe; „Botschaft“ oder „Lehre“ wäre stärker auslegend.
- source_word: ὃν λελάληκα
  choice: das ich ... gesprochen habe
  rationale: Das Perfekt wird mit dem deutschen Perfekt wiedergegeben und deutet eine erfolgte Rede mit fortdauernder Bedeutung an.
- source_word: ὑμῖν
  choice: zu euch
  rationale: Gibt den Dativ als Empfängerangabe schlicht und genau wieder; der Plural ist durch „euch“ klar.
theological_decisions:
- issue: Art der Reinheit der Jünger
  choice: Die gegenwärtige Reinheit wird in der Bildsprache des Zusammenhangs ausgesagt, ohne sie auf eine technische dogmatische Kategorie festzulegen.
  alternative: Spezifisch sakramentale Reinigung oder forensische Rechtfertigung
  rationale: Der unmittelbare Zusammenhang verbindet Reinigen und Beschneiden im Weinstockbild und führt die Reinheit auf Jesu gesprochenes Wort zurück. Die Übersetzung wahrt diese theologische Offenheit.
- issue: Funktion von διά mit Akkusativ
  choice: „durch das Wort“
  alternative: „wegen des Wortes“ oder „aufgrund des Wortes“
  rationale: Die Konstruktion lässt sich kausal verstehen; „durch“ ist im Deutschen idiomatisch und hält zugleich den Aspekt der vermittelnden Wirksamkeit offen, ohne eine scharfe Trennung von Ursache und Mittel zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rein“ hält den sprachlichen und bildlichen Zusammenhang mit der Reinigung der Reben fest; „Wort“ bewahrt die knappe johanneische Ausdrucksweise.
