source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: de
  text: Und auch ihr legt Zeugnis ab, weil[a] ihr von Anfang an bei mir seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: Und auch ihr
  rationale: Gibt die Verknüpfung mit dem vorherigen Satz, die Hervorhebung des ausdrücklichen Pronomens und den Gedanken wieder, dass neben dem Beistand auch die Jünger Zeugnis ablegen.
- source_word: μαρτυρεῖτε
  choice: legt Zeugnis ab
  rationale: Bewahrt den Zeugen- und Aussagecharakter des Verbs und klingt im modernen Deutschen natürlich und würdig.
- source_word: ὅτι
  choice: weil
  rationale: Leitet im Zusammenhang am ehesten die Begründung dafür ein, weshalb die Jünger als Zeugen auftreten können.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Ist die natürliche deutsche Entsprechung und lässt offen, welcher kontextuelle Anfang genau gemeint ist.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: bei mir seid
  rationale: Das deutsche Präsens zusammen mit „von Anfang an“ bezeichnet idiomatisch einen in der Vergangenheit begonnenen und bis jetzt fortdauernden Zustand und entspricht zugleich eng dem griechischen Präsens.
theological_decisions:
- issue: Bezug von „von Anfang an“
  choice: Die offene Formulierung „von Anfang an“ bleibt im Haupttext erhalten.
  alternative: Ausdrückliche Festlegung auf den Beginn des öffentlichen Wirkens Jesu oder ein absoluter, theologischer Anfang.
  rationale: Der Zusammenhang legt die historische Begleitung Jesu durch die Jünger nahe, doch die Übersetzung fügt keine im griechischen Text nicht ausdrücklich genannte Präzisierung hinzu.
- issue: Funktion von ὅτι
  choice: 'kausal: „weil“'
  alternative: 'inhaltlich: „dass“'
  rationale: Im Zusammenhang begründet die langjährige Gemeinschaft mit Jesus die Eignung der Jünger als Zeugen. Da ὅτι grammatisch auch eine Inhaltsangabe einleiten kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch. „Zeugnis ablegen“ wahrt die forensische Zeugenmetaphorik, ohne altertümlich zu wirken.
