id: JHN.15.4
reference: John 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: de
  text: Bleibt in mir[a], und ich in euch. Wie die Rebe nicht von sich aus Frucht tragen kann, wenn sie nicht am Weinstock bleibt, so könnt auch ihr es nicht, wenn ihr nicht in mir bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bleibt mit mir verbunden, und ich mit euch.“ Das griechische Verb μένω bedeutet „bleiben“ und kann hier zugleich fortdauernde Verbundenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: bleibt / bleibt
  rationale: „Bleiben“ gibt das wiederholte μένω im modernen Deutschen natürlich und einheitlich wieder und bewahrt den Gedanken fortdauernder Verbundenheit.
- source_word: ἐν ἐμοί
  choice: in mir
  rationale: „In mir“ bewahrt die räumlich-relationale Bildsprache von ἐν und reduziert sie nicht auf bloße Nähe oder Begleitung.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: und ich in euch
  rationale: Die knappe Ellipse des Griechischen bleibt erhalten; ein Verb wie „bleibe“ oder „werde bleiben“ wird nicht ausdrücklich ergänzt.
- source_word: τὸ κλῆμα
  choice: die Rebe
  rationale: Im Zusammenhang des Weinstocks bezeichnet κλῆμα präzise den fruchttragenden Rebzweig; „Rebe“ ist im Deutschen die etablierte biblische und weinbauliche Bezeichnung.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: nicht … Frucht tragen kann
  rationale: Diese Formulierung gibt die ausdrückliche Unfähigkeit von δύναμαι idiomatisch wieder und erhält die landwirtschaftliche Metapher.
- source_word: ἀφ’ ἑαυτοῦ
  choice: von sich aus
  rationale: Die Wendung bezeichnet hier eigenständiges Hervorbringen und klingt im Deutschen natürlicher als das wörtlichere „aus sich selbst“.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: am Weinstock
  rationale: Im natürlichen deutschen Sprachgebrauch bleibt eine Rebe „am Weinstock“. Die Verbindung wird ausgedrückt, ohne das erklärende „mit dem Weinstock verbunden“ in den Text einzutragen.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: so könnt auch ihr es nicht
  rationale: „Könnt … nicht“ nimmt das zuvor ausdrücklich genannte δύναται auf; „es“ verweist verständlich auf das Fruchttragen, ohne die ganze Wendung zu wiederholen.
theological_decisions:
- issue: μένω im Zusammenhang von Jüngerschaft und Verbundenheit mit Jesus
  choice: bleiben
  alternative: in jemandem wohnen / verbunden bleiben
  rationale: „Bleiben“ wahrt sowohl die Dauer als auch die relationale Bildsprache, ohne die Aussage durch eine erklärende Formulierung dogmatisch festzulegen.
- issue: Ellipse in κἀγὼ ἐν ὑμῖν
  choice: und ich in euch
  alternative: und ich bleibe in euch
  rationale: Da im Griechischen kein Verb steht, bewahrt die knappe Wiedergabe die mögliche Spannung zwischen Aufforderung, wechselseitigem Bleiben und Zusage, statt eine davon ausdrücklich festzuschreiben.
- issue: Metaphorische Verbindung der Rebe mit dem Weinstock
  choice: am Weinstock bleibt
  alternative: im Weinstock bleibt
  rationale: „Am Weinstock“ ist natürliches Deutsch und erhält die organische Verbindung des Bildes. Es soll keine bestimmte Lehre über die genaue Art der Verbundenheit definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „bleiben“ wird als Leitwort beibehalten. „Rebe“ und „Weinstock“ erhalten die traditionelle und sachlich genaue Bildsprache; die griechische Ellipse in „und ich in euch“ bleibt bewusst bestehen.
