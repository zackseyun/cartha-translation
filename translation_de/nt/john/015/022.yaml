  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: de
  text: Wenn ich nicht gekommen wäre und zu ihnen gesprochen hätte, hätten sie keine Sünde[a]. Jetzt aber haben sie keine Entschuldigung für ihre Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wären sie nicht der Sünde schuldig“ beziehungsweise „hätten sie keine Schuld“. Wörtlich steht im Griechischen: „hätten sie keine Sünde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keinen Vorwand hinsichtlich ihrer Sünde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Wenn ich nicht gekommen wäre und zu ihnen gesprochen hätte
  rationale: Der irreale Bedingungssatz der Vergangenheit wird im Deutschen natürlich mit Konjunktiv II Perfekt wiedergegeben; αὐτοῖς ist als „zu ihnen“ ausgedrückt.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: hätten sie keine Sünde
  rationale: Die Formulierung bewahrt das johanneische „Sünde haben“ und deutet es nicht vorschnell als bloße Schuld oder Strafwürdigkeit aus.
- source_word: νῦν δὲ
  choice: Jetzt aber
  rationale: Gibt den scharfen Gegensatz zwischen der irrealen Voraussetzung und der gegenwärtigen Lage knapp und idiomatisch wieder.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: haben sie keine Entschuldigung
  rationale: πρόφασις kann einen Vorwand oder Entschuldigungsgrund bezeichnen; „keine Entschuldigung haben“ ist hier natürliches modernes Deutsch.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: für ihre Sünde
  rationale: Obwohl περί mit Genitiv wörtlich „hinsichtlich“ bedeuten kann, verlangt die deutsche Verbindung „eine Entschuldigung haben“ idiomatisch „für“.
theological_decisions:
- issue: Bezeichnet „keine Sünde haben“ völlige Sündlosigkeit oder fehlende Verantwortlichkeit für die Zurückweisung Jesu?
  choice: Die wörtliche johanneische Wendung „hätten sie keine Sünde“ bleibt im Haupttext stehen.
  alternative: „wären sie nicht schuldig“ oder „trügen sie keine Schuld an dieser Sünde“
  rationale: Der Zusammenhang betrifft die Verantwortung angesichts von Jesu Kommen und Reden; der griechische Wortlaut sagt jedoch allgemein „Sünde haben“. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch einzuengen.
- issue: Bedeutung von πρόφασις im Verhältnis zur Sünde
  choice: „keine Entschuldigung für ihre Sünde“
  alternative: „keinen Vorwand hinsichtlich ihrer Sünde“
  rationale: „Entschuldigung“ vermittelt den kontextuellen Gedanken fehlender Entlastung, während die Fußnote die mögliche Nuance „Vorwand“ offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der irreale Vergangenheitssatz ist idiomatisch formuliert; die theologisch spannungsreiche Wendung „Sünde haben“ bleibt bewusst erhalten.
