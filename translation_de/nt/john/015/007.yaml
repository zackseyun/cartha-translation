  source_fidelity: Die Übersetzung bewahrt die zweigliedrige ἐὰν-Bedingung, die Wiederholung von μένω mit „bleiben“, die Beziehungssprache „in mir/in euch“ sowie den offenen Umfang von ὃ ἐὰν θέλητε. „Bittet um alles, was ihr wollt“ gibt den Imperativ αἰτήσασθε idiomatisch und inhaltlich zutreffend wieder. „Es wird euch zuteilwerden“ lässt, entsprechend γενήσεται ὑμῖν, offen, wie das Erbetene zustande kommt, ohne ein ausdrücklich göttliches Passiv einzutragen.
