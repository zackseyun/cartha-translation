  terminology: „Bleiben“, „in mir“, „meine Worte“ und „bitten“ sind konsistent, sachgerecht und erhalten die für den johanneischen Kontext wichtige Wiederholung und Beziehungsdimension. Die Formulierung fügt keine konfessionelle Deutung oder zusätzliche Einschränkung hinzu.
