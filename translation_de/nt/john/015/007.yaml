id: JHN.15.7
reference: John 15:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: de
  text: Wenn ihr in mir bleibt und meine Worte in euch bleiben, dann bittet um alles, was ihr wollt, und es wird euch zuteilwerden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: bleibt / bleiben
  rationale: „Bleiben“ ist die natürliche, direkte deutsche Wiedergabe und bewahrt sowohl den fortdauernden Beziehungssinn als auch die Wiederholung des griechischen Verbs.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: Die Präposition wird wörtlich als „in“ wiedergegeben, damit die für Johannes kennzeichnende Sprache der innigen Verbundenheit erhalten bleibt.
- source_word: τὰ ῥήματά μου
  choice: meine Worte
  rationale: „Meine Worte“ gibt die Mehrzahl direkt und in natürlichem Deutsch wieder, ohne sie erklärend zu „was ich euch gesagt habe“ auszuweiten.
- source_word: ὃ ἐὰν θέλητε
  choice: alles, was ihr wollt
  rationale: Die Formulierung gibt den offenen, unbestimmten Gegenstand des Wollens idiomatisch wieder. Die im Satz genannte Bedingung verhindert, dass die Wendung als losgelöste, grenzenlose Zusage erscheint.
- source_word: αἰτήσασθε
  choice: bittet um
  rationale: Das Verb bezeichnet hier ein Bitten beziehungsweise Erbitten. Mit „um“ schließt die deutsche Formulierung natürlich an „alles“ an.
- source_word: γενήσεται ὑμῖν
  choice: es wird euch zuteilwerden
  rationale: Diese Wendung gibt das Eintreten des Erbetenen zugunsten der Angesprochenen wieder, ohne mit dem passivischen „wird für euch getan“ einen im griechischen Verb nicht ausdrücklich genannten Handelnden einzutragen.
theological_decisions:
- issue: Bedingung und Verheißung im Zusammenhang des Gebets
  choice: Die Zusage des erhörten Bittens bleibt ausdrücklich an das Bleiben der Jünger in Jesus und das Bleiben seiner Worte in ihnen gebunden.
  alternative: Eine freiere Fassung, in der die Gebetszusage wie eine unbedingte Verheißung klingt.
  rationale: Der mit ἐὰν eingeleitete Bedingungssatz umfasst die beiden Voraussetzungen; „dann“ macht diesen syntaktischen Zusammenhang im Deutschen klar, ohne zusätzliche Bedingungen einzuführen.
- issue: Agens und Bedeutung von γενήσεται ὑμῖν
  choice: „es wird euch zuteilwerden“
  alternative: „es wird für euch getan werden“
  rationale: Das griechische γίνομαι bedeutet hier, dass etwas geschieht beziehungsweise zustande kommt. Die gewählte Fassung wahrt diese Offenheit und setzt nicht ausdrücklich ein göttliches Passiv voraus, auch wenn der Kontext Gebetserhörung nahelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiedergabe von μένω mit „bleiben“ erhält die johanneische Schlüsselwortwiederholung. „Zuteilwerden“ ist leicht gehoben, aber allgemein verständlich und sachlich genauer als eine ausdrücklich passivische Handlungsformulierung.
