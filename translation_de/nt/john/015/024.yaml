id: JHN.15.24
reference: John 15:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: de
  text: Hätte ich nicht unter ihnen die Werke getan, die kein anderer getan hat, hätten sie keine Sünde.[a] Nun aber haben sie sowohl mich als auch meinen Vater gesehen und gehasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wären sie nicht der Sünde schuldig“. Wörtlich lautet die griechische Wendung: „hätten sie keine Sünde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ bewahrt den für das Johannesevangelium charakteristischen Ausdruck für Jesu Taten, die seine Identität und Sendung offenbaren.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: ich unter ihnen … getan
  rationale: ἐν αὐτοῖς bezeichnet hier Jesu Wirken in ihrer Mitte beziehungsweise vor ihren Augen; „unter ihnen“ gibt dies natürlich wieder. Der irreale Bedingungssatz wird im Deutschen mit Konjunktiv II der Vergangenheit ausgedrückt.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: die kein anderer getan hat
  rationale: Die Formulierung hebt ohne interpretierende Zusätze die Einzigartigkeit der Werke Jesu hervor.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: hätten sie keine Sünde
  rationale: Die wörtlich nahe Form bewahrt die johanneische Wendung „Sünde haben“ und legt sie nicht vorschnell ausschließlich als Schuld oder Verantwortlichkeit aus.
- source_word: νῦν δὲ
  choice: Nun aber
  rationale: Die Wendung markiert knapp und deutlich den Gegensatz zwischen dem irrealen Fall und der tatsächlich eingetretenen Lage.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: haben sie gesehen und gehasst
  rationale: Die Perfektformen bezeichnen Geschehenes mit fortdauernder Bedeutung. Das deutsche Perfekt gibt dies natürlich wieder; die Verbindung beider Verben bleibt erhalten.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: mich ebenso wie meinen Vater
  rationale: Die Formulierung erhält die durch das wiederholte καί betonte Zuordnung beider Objekte und klingt im Deutschen natürlicher als eine doppelte sowohl-als-auch-Konstruktion.
theological_decisions:
- issue: Bedeutung von ἁμαρτίαν οὐκ εἴχοσαν im Blick auf Schuld und Verantwortlichkeit
  choice: Die johanneische Wendung „keine Sünde haben“ wird im Haupttext beibehalten.
  alternative: „wären sie nicht der Sünde schuldig“
  rationale: Der Zusammenhang weist auf gesteigerte Schuld angesichts der einzigartigen Werke Jesu hin. Dennoch soll die Übersetzung die weitere und theologisch spannungsreiche Ausdrucksweise des griechischen Textes nicht auf eine einzige Erklärung verengen.
- issue: Bezug von „gesehen“ und „gehasst“ auf Jesus und den Vater
  choice: Beide Verben werden mit „mich ebenso wie meinen Vater“ verbunden.
  alternative: „Nun aber haben sie die Werke gesehen und sowohl mich als auch meinen Vater gehasst.“
  rationale: Die griechische Satzstruktur verbindet die beiden Verben mit den beiden nachfolgenden Objekten. Eine Ergänzung von „die Werke“ würde die Aussage interpretierend vereindeutigen und die auffällige Verbindung von Sehen und Hassen abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorangestellte Konditionalsatz sorgt für einen natürlichen deutschen Satzbau. Der Gedankenstrich im zweiten Satz trägt die doppelte Betonung der griechischen καί-Reihe, ohne eine schwerfällige doppelte Korrelativkonstruktion zu erzeugen.
