  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: de
  text: Jede Rebe an mir, die keine Frucht bringt, nimmt er weg[a]; und jede, die Frucht bringt, beschneidet er[b], damit sie noch mehr Frucht bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entfernt er“. Manche verstehen das griechische Verb hier im Sinn von „hebt sie hoch“.'
    reason: alternative_reading
  - marker: b
    text: Das mit „beschneidet“ wiedergegebene Verb kann auch „reinigt“ bedeuten. Die Formulierung passt zum Weinbau und bereitet zugleich die Aussage über das Reinsein im nächsten Vers vor.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: Jede Rebe
  rationale: πᾶν mit einem Substantiv im Singular hat distributiven Sinn. „Jede Rebe“ ist im Deutschen natürlich und bewahrt den individualisierenden Charakter.
- source_word: ἐν ἐμοὶ
  choice: an mir
  rationale: Im deutschen Bild von Weinstock und Reben ist „an mir“ idiomatischer als „in mir“, ohne die johanneische Beziehungssprache erklärend auszuweiten.
- source_word: μὴ φέρον καρπὸν
  choice: die keine Frucht bringt
  rationale: Der attributive Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben; „keine Frucht“ entspricht idiomatisch der Negation des Fruchtbringens.
- source_word: αἴρει
  choice: nimmt er weg
  rationale: αἴρω kann „wegnehmen/entfernen“ und je nach Kontext auch „anheben“ bedeuten. Im Gegensatz zum Beschneiden fruchttragender Reben ist „wegnimmt“ hier die naheliegende Bedeutung; die andere Deutung bleibt in einer Fußnote sichtbar.
- source_word: καρπός
  choice: Frucht
  rationale: „Frucht“ ist die übliche und bildlich passende Wiedergabe im Weinbaukontext.
- source_word: καθαίρει
  choice: beschneidet er
  rationale: Im Weinbau bezeichnet das Verb das Reinigen beziehungsweise Beschneiden der Rebe. „Beschneiden“ gibt die konkrete gärtnerische Handlung klar wieder; die Bedeutung „reinigen“ und das Wortspiel mit Vers 3 werden in der Fußnote bewahrt.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: damit sie noch mehr Frucht bringt
  rationale: ἵνα drückt hier den Zweck aus. „Noch mehr Frucht“ gibt den Komparativ πλείονα im Deutschen natürlich und im Anschluss an bereits vorhandene Frucht präzise wieder.
- source_word: αὐτό / αὐτὸ
  choice: sie
  rationale: Die Pronomen beziehen sich auf κλῆμα. Wegen des femininen deutschen Bezugsworts „Rebe“ steht im Deutschen „sie“.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: und jede, die Frucht bringt
  rationale: Der substantivierte Ausdruck greift „Rebe“ aus dem ersten Satzteil auf. Die elliptische Wiedergabe mit „jede“ bewahrt die Parallelität, ohne das Bezugswort unnötig zu wiederholen.
theological_decisions:
- issue: Bedeutung von αἴρει im ersten Satzteil
  choice: nimmt er weg
  alternative: hebt er an
  rationale: 'Der unmittelbare Kontext stellt zwei Handlungen des Weingärtners gegenüber: Eine unfruchtbare Rebe wird weggenommen, eine fruchttragende zur Mehrung der Frucht beschnitten. Diese Wiedergabe legt keine konfessionelle Lehre über Abfall oder Bewahrung fest. Da „anheben“ lexikalisch möglich und eine vertretene Auslegung ist, wird es in einer Fußnote genannt.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Syntax hält die Parallelität des griechischen Satzes fest. „Rebe“ und „beschneiden“ bewahren das konkrete Weinbaubild; die Fußnoten erhalten die wesentlichen lexikalischen Mehrdeutigkeiten.
