  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: de
  text: Ihr seid meine Freunde, wenn ihr tut, was ich euch gebiete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wenn ihr die Dinge tut, die ich euch gebiete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen steht im Griechischen hervorgehoben. Im Deutschen ist „Ihr“ natürlich und lässt die Anrede im Kontext hervortreten, ohne sie durch „ihr selbst“ zu überzeichnen.
- source_word: φίλοι μού
  choice: meine Freunde
  rationale: φίλοι bezeichnet hier eine persönliche, enge Beziehung; der Genitiv μού wird idiomatisch als Possessivbegleiter „meine“ wiedergegeben.
- source_word: ἐστε
  choice: seid
  rationale: Präsens Indikativ von εἰμί, in der zweiten Person Plural direkt mit „seid“ wiedergegeben.
- source_word: ἐὰν
  choice: wenn
  rationale: ἐὰν mit Konjunktiv führt eine Bedingung ein. Im Deutschen kann „wenn“ diese reale bzw. offene Bedingung natürlich ausdrücken; der Satz bleibt klar konditional.
- source_word: ποιῆτε
  choice: ihr tut
  rationale: ποιέω bezeichnet hier das Ausführen dessen, was geboten wird. „tut“ ist knapp und natürlich; eine ausdrücklich durative Wiedergabe wie „weiterhin tut“ wäre grammatisch zu stark.
- source_word: ἃ
  choice: was
  rationale: Das substantivisch gebrauchte neutrale Relativpronomen im Plural bezeichnet den Inhalt der Gebote. Idiomatisches Deutsch fasst dies mit „was“ zusammen.
- source_word: ἐγὼ
  choice: ich
  rationale: Das im Griechischen ausdrücklich gesetzte Subjekt trägt eine gewisse Hervorhebung. Das deutsche „ich“ bewahrt den Bezug auf Jesus, ohne mit „ich selbst“ übermäßig zu markieren.
- source_word: ἐντέλλομαι
  choice: gebiete
  rationale: Das Verb bezeichnet ein verbindliches, autoritatives Auftragen. „gebiete“ bewahrt diese Autorität in einem würdigen biblischen Register; „anweise“ wäre schwächer.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ Plural bezeichnet die Empfänger des Gebots und wird in der deutschen Konstruktion „jemandem etwas gebieten“ unmittelbar als „euch“ wiedergegeben.
theological_decisions:
- issue: Verhältnis von Freundschaft und Gehorsam im Bedingungssatz
  choice: „Ihr seid meine Freunde, wenn ihr tut, was ich euch gebiete.“
  alternative: „Ihr seid meine Freunde, wann immer ihr tut, was ich euch gebiete.“
  rationale: ἐὰν mit dem Konjunktiv formuliert hier am natürlichsten eine Bedingung. Die Übersetzung erhält die ausdrücklich gesetzte Verbindung zwischen Freundschaft mit Jesus und Gehorsam, ohne sie als Verdienstlehre zu erklären oder auf eine bloße Zeitangabe abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Gebiete“ ist etwas gehobener als „befehle“, entspricht aber der autoritativen Aussage und passt idiomatisch zur Konstruktion „jemandem etwas gebieten“. Der Plural der Anrede ist durch „ihr/euch“ eindeutig.
