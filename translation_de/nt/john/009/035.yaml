id: JHN.9.35
reference: John 9:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: de
  text: 'Jesus hörte, dass sie ihn hinausgeworfen hatten. Als er ihn fand, sagte er: »Glaubst du an den Menschensohn?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »den Sohn Gottes« statt »den Menschensohn«.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: hinausgeworfen hatten
  rationale: Die Verbindung von ἐκβάλλω mit ἔξω betont die Ausstoßung. »Hinausgeworfen« gibt diese Nachdrücklichkeit und den sozialen Ausschluss im heutigen Deutsch natürlich wieder.
- source_word: εὑρὼν
  choice: Als er ihn fand
  rationale: Das Aoristpartizip wird hier sinnvoll temporal wiedergegeben und wahrt die Abfolge der Handlungen in natürlichem Deutsch.
- source_word: Σὺ πιστεύεις
  choice: Glaubst du
  rationale: πιστεύω bezeichnet hier Glauben beziehungsweise persönliches Vertrauen. Die direkte Frage lässt die Betonung des ausdrücklichen Pronomens Σὺ erkennen, ohne eine schwerfällige Zusatzmarkierung einzuführen.
- source_word: εἰς
  choice: an
  rationale: Bei πιστεύω bezeichnet εἰς die auf eine Person gerichtete Glaubens- und Vertrauensbeziehung; »an jemanden glauben« ist dafür die idiomatische deutsche Entsprechung.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: »Menschensohn« ist die etablierte deutsche Wiedergabe des Titels und bewahrt seine Bezüge zu Daniel 7 sowie zum johanneischen Sprachgebrauch.
theological_decisions:
- issue: Lesart des christologischen Titels in Jesu Frage
  choice: Menschensohn
  alternative: Sohn Gottes
  rationale: Der Haupttext des SBLGNT bietet ἀνθρώπου (»Mensch«). Die bedeutende und wirkungsgeschichtlich wichtige Variante θεοῦ (»Gottes«) wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Formulierung »hinausgeworfen« bewahrt den Nachdruck des griechischen Ausdrucks; der traditionelle Titel »Menschensohn« bleibt wegen seiner Wiedererkennbarkeit und intertextuellen Bedeutung erhalten.
