id: JHN.9.40
reference: John 9:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: de
  text: 'Einige der Pharisäer, die bei ihm waren, hörten das und sagten zu ihm: »Wir sind doch nicht etwa auch blind?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: hörten
  rationale: Der Aorist von ἀκούω bezeichnet hier, dass sie Jesu vorausgehende Worte vernahmen; »hörten« ist im deutschen Erzählstil natürlich.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Einige von den Pharisäern
  rationale: Die partitive Verbindung mit ἐκ bezeichnet eine Teilgruppe und nicht alle Pharisäer.
- source_word: ταῦτα
  choice: das
  rationale: Obwohl das griechische Demonstrativpronomen im Plural steht, verweist es gesammelt auf das zuvor Gesagte; idiomatisches Deutsch verwendet hier gewöhnlich »das«.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: die bei ihm waren
  rationale: Die attributive Partizipialfügung kennzeichnet die betreffenden Pharisäer als bei Jesus anwesend; »bei ihm« ist natürlich und wahrt den Bezug, ohne ihn weiter auszudeuten.
- source_word: εἶπον αὐτῷ
  choice: sagten zu ihm
  rationale: Die Grundbedeutung von λέγω bleibt erhalten; dass es sich inhaltlich um eine Frage handelt, zeigt die direkte Rede.
- source_word: Μὴ
  choice: doch nicht etwa
  rationale: μή leitet eine Frage ein, auf die eine verneinende Antwort erwartet wird. »doch nicht etwa« gibt diese erwartungsvolle, ungläubige Ausrichtung im Deutschen deutlich wieder.
- source_word: καὶ
  choice: auch
  rationale: καί bezieht die Sprecher in die zuvor angesprochene Blindheit ein und wird idiomatisch mit »auch« wiedergegeben.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck; die deutsche Wortstellung in »Wir sind ...« bewahrt diesen Schwerpunkt.
- source_word: τυφλοί
  choice: blind
  rationale: Das unqualifizierte Adjektiv wird ebenso unqualifiziert übersetzt, sodass die im Kontext erkennbare übertragene Bedeutung und die johanneische Ironie erhalten bleiben.
- source_word: ἐσμεν
  choice: sind
  rationale: Die Präsensform von εἰμί wird mit der einfachen deutschen Kopula wiedergegeben.
theological_decisions:
- issue: Soll die übertragene Bedeutung von τυφλοί ausdrücklich gemacht werden?
  choice: »blind« ohne ergänzendes »geistlich«
  alternative: »geistlich blind«
  rationale: Der Zusammenhang macht die übertragene Bedeutung erkennbar, doch der griechische Text qualifiziert das Wort nicht. Die offene Formulierung bewahrt Bildsprache und Ironie, ohne eine Auslegung in den Haupttext einzutragen.
- issue: Wie stark soll die von μή erwartete verneinende Antwort markiert werden?
  choice: »doch nicht etwa«
  alternative: schlicht »Sind wir auch blind?«
  rationale: Die gewählte Form gibt die grammatisch angelegte Erwartung »nein« wieder, ohne die tatsächliche Antwort Jesu vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage klingt natürlich und vermittelt durch »doch nicht etwa« die mit μή verbundene Erwartung einer verneinenden Antwort. Keine Fußnote ist nötig, da diese Nuance im Haupttext ausgedrückt wird.
