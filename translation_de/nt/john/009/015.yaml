source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: de
  text: 'Da fragten ihn auch die Pharisäer noch einmal, wie er sein Augenlicht erhalten hatte.[a] Er sagte zu ihnen: »Er hat mir Schlamm[b] auf die Augen gelegt, ich habe mich gewaschen, und ich sehe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie er wieder sehen konnte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Lehm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Da … noch einmal
  rationale: οὖν führt die Erzählung folgernd weiter, ohne zwingend eine strenge Schlussfolgerung auszudrücken; πάλιν bezeichnet die erneute Befragung.
- source_word: ἠρώτων
  choice: fragten
  rationale: Der Imperfekt beschreibt die Befragung im Fortgang der Erzählung; zusammen mit „noch einmal“ ist die schlichte Vergangenheitsform im Deutschen natürlich.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: auch die Pharisäer
  rationale: καί bezieht die Pharisäer als weitere Fragende in die Abfolge ein.
- source_word: πῶς ἀνέβλεψεν
  choice: wie er sehend geworden war
  rationale: ἀναβλέπω bezeichnet hier das Erlangen des Sehvermögens. Da der Mann von Geburt an blind war, vermeidet „sehend geworden“ die unzutreffende Festlegung, er habe früher bereits sehen können.
- source_word: πηλόν
  choice: Schlamm
  rationale: πηλός kann feuchte Erde, Schlamm oder Lehm bezeichnen. „Schlamm“ ist im Zusammenhang mit der zuvor aus Speichel bereiteten Masse natürlich und allgemein verständlich.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: hat mir … auf die Augen gelegt
  rationale: Die Formulierung gibt sowohl das Auflegen als auch den griechischen Dativ der betroffenen Person idiomatisch wieder.
- source_word: ἐνιψάμην
  choice: ich habe mich gewaschen
  rationale: Die mediale Verbform bezeichnet hier das eigene Waschen beziehungsweise Abwaschen; das Perfekt ist in gegenwärtigem Standarddeutsch die natürliche Erzählform in direkter Rede.
- source_word: βλέπω
  choice: ich sehe
  rationale: Das Präsens bewahrt die knappe, unmittelbare Aussage über den nun bestehenden Zustand.
theological_decisions:
- issue: Ob ἀνέβλεψεν Wiedererlangung oder erstmaliges Erlangen des Sehvermögens bezeichnet
  choice: sehend geworden war
  alternative: wieder sehen konnte
  rationale: Das Verb kann für wiedergewonnenes Sehen gebraucht werden, doch der Erzählzusammenhang nennt den Mann von Geburt an blind. Die gewählte Form wahrt die Bedeutung des Verbs, ohne eine frühere Sehfähigkeit vorauszusetzen; die lexikalische Alternative wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem, knappem Erzählton. Die direkte Rede folgt der prägnanten Abfolge des Griechischen; das abschließende Präsens „ich sehe“ bleibt bewusst erhalten.
