  naturalness: „Wie er sein Augenlicht erhalten hatte“ ist modernes, natürliches Standarddeutsch und gibt die abgeschlossene Heilung vor dem Zeitpunkt der Befragung klar wieder. Die direkte Rede bleibt knapp und gut verständlich.
  terminology: „Pharisäer“, „Schlamm“, „auf die Augen gelegt“, „mich gewaschen“ und „ich sehe“ sind sachgerecht. „Schlamm“ gibt πηλός gut wieder; „Lehm“ ist als lexikalische Alternative sinnvoll.
