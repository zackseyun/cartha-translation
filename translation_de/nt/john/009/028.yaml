source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: de
  text: 'Da beschimpften sie ihn und sagten: »Du bist ein Jünger von dem da[a]; wir aber sind Jünger des Mose.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Jünger«. Das griechische Wort bedeutet wörtlich »jenem/jenem da« und kann hier abwertende Distanz ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: beschimpften
  rationale: Das Verb bezeichnet verbale Schmähung oder Beschimpfung. »Beschimpften« gibt die feindselige Schärfe in natürlichem modernem Deutsch wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den zuvor geheilten Mann.
- source_word: καὶ εἶπον
  choice: und sagten
  rationale: Die einfache erzählerische Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte und vorangestellte Pronomen ist betont und eröffnet im Deutschen ebenfalls den Gegensatz.
- source_word: μαθητής / μαθηταί
  choice: Jünger / Jünger
  rationale: »Jünger« bezeichnet im johanneischen Zusammenhang nicht nur einen Schüler, sondern einen Menschen in verbindlicher Gefolgschaft. Die gleiche Wiedergabe in beiden Satzhälften bewahrt den rhetorischen Gegensatz.
- source_word: ἐκείνου
  choice: von jenem
  rationale: Das Demonstrativpronomen schafft Distanz. »Von jenem« bewahrt diese mögliche Geringschätzung, ohne sie durch eine ausdrücklichere Beschimpfung zu verstärken.
- source_word: ἡμεῖς δὲ
  choice: wir aber
  rationale: Die betonte Gegenüberstellung und die adversative Kraft von δέ werden in natürlicher deutscher Wortstellung erhalten.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: sind Jünger des Mose
  rationale: Der Genitiv bezeichnet die Zugehörigkeit beziehungsweise Gefolgschaft. »Jünger des Mose« ist prägnant und bewahrt die Parallelität.
theological_decisions:
- issue: Ton von ἐκείνου als Bezeichnung für Jesus
  choice: »von jenem« mit Fußnote zur möglichen abwertenden Distanz
  alternative: »sein Jünger« oder stärker abwertend »ein Jünger von dem da«
  rationale: Das Demonstrativpronomen ist distanzierend und kann im Zusammenhang der Beschimpfung geringschätzig klingen. Die Übersetzung bewahrt diese Möglichkeit, ohne einen eindeutig verächtlichen Ton festzuschreiben, den das Wort allein nicht zwingend verlangt.
- issue: Einheitliche Wiedergabe von μαθητής
  choice: Beide Vorkommen mit »Jünger« wiedergegeben
  alternative: »Anhänger« oder »Schüler«
  rationale: Die Wiederholung desselben Wortes stellt die Gefolgschaft Jesu der beanspruchten Gefolgschaft des Mose gegenüber. »Jünger« erhält sowohl die terminologische Einheit als auch die Bindung an einen Lehrer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Beschimpften« ist klar und kräftig, ohne altertümlich zu wirken. Die Stellung »wir aber« erhält die betonte Gegenüberstellung; »des Mose« entspricht gehobenem, aber weiterhin allgemein verständlichem Bibeldeutsch.
