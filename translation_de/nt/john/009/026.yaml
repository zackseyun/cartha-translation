base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Was hat er dir getan? Wie hat er dir die Augen geöffnet?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: sagten sie
  rationale: Der Aorist von λέγω leitet die direkte Rede der befragenden Gruppe ein; »sagten sie« gibt das allgemeine Sprechverb genauer wieder als das kontextuell mögliche »fragten sie«.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt den Gedankengang beziehungsweise die Erzählung folgernd weiter. »Da« wirkt im modernen deutschen Erzählstil natürlich und bewahrt den Anschluss, ohne ihn übermäßig kausal als »deshalb« festzulegen.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten und verweist auf den geheilten Mann.
- source_word: Τί ἐποίησέν σοι
  choice: Was hat er mit dir gemacht?
  rationale: ποιέω mit dem Dativ kann hier das Handeln an der Person bezeichnen. »Mit dir gemacht« ist im Deutschen natürlich und wahrt den untersuchenden, möglicherweise misstrauischen Ton besser als das positiv klingende »für dich getan«.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Wie hat er dir die Augen geöffnet?
  rationale: Die deutsche Konstruktion mit Dativ des Besitzers ist bei Körperteilen idiomatisch und bildet sowohl die Frage nach der Art und Weise als auch das aktive Verb »öffnen« klar ab.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Erzählton. Die zwei direkten Fragen und ihre investigative Schärfe bleiben erhalten; keine erklärenden Zusätze.
