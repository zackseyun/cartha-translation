  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: de
  text: 'Da sagten einige der Pharisäer: „Dieser Mann ist nicht von Gott, denn er hält den Sabbat nicht.“ Andere aber sagten: „Wie kann ein sündiger Mensch[a] solche Zeichen[b] tun?“ Und unter ihnen kam es zu einer Spaltung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Sünder“. Wörtlich steht im Griechischen „ein sündiger Mensch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Johannes nennt Jesu Taten häufig „Zeichen“, weil sie auf ihre tiefere Bedeutung hinweisen. Möglich wäre auch: „Wunderzeichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν ... τινές
  choice: Da sagten einige
  rationale: „Da“ führt den Gedankengang natürlich fort und gibt οὖν wieder. Das deutsche Präteritum „sagten“ bezeichnet hier idiomatisch die Äußerungen in der Szene; eine Verlaufsform wäre im Deutschen schwerfällig.
- source_word: ἐκ τῶν Φαρισαίων
  choice: von den Pharisäern
  rationale: Die Formulierung bezeichnet einige aus der Gruppe der Pharisäer und ist im Deutschen natürlich.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: dieser Mensch
  rationale: Die Übersetzung bewahrt sowohl das Demonstrativpronomen als auch die konkrete Bezeichnung ἄνθρωπος, ohne zusätzliche Geringschätzung einzutragen.
- source_word: παρὰ θεοῦ
  choice: von Gott
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise göttliche Autorisierung. „Von Gott gesandt“ wäre eine nicht ausdrücklich im griechischen Wortlaut enthaltene Präzisierung.
- source_word: τὸ σάββατον οὐ τηρεῖ
  choice: er hält den Sabbat nicht
  rationale: „Den Sabbat halten“ ist die übliche und verständliche deutsche Wiedergabe für das Beachten des Sabbatgebots.
- source_word: ἄνθρωπος ἁμαρτωλός
  choice: ein sündiger Mensch
  rationale: Die Wiedergabe bildet die griechische Verbindung aus Substantiv und Adjektiv unmittelbar ab; „ein Sünder“ ist eine mögliche idiomatischere Alternative.
- source_word: τοιαῦτα σημεῖα
  choice: solche Zeichen
  rationale: „Zeichen“ bewahrt den für das Johannesevangelium wichtigen Hinweischarakter der Taten; „Wunder“ würde diesen Aspekt abschwächen.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: unter ihnen kam es zu einer Spaltung
  rationale: Die Formulierung gibt die entstandene Trennung innerhalb der Gruppe in natürlichem Deutsch wieder und bewahrt das starke Substantiv σχίσμα.
theological_decisions:
- issue: Bedeutung von σημεῖα im Johannesevangelium
  choice: Zeichen
  alternative: Wunderzeichen; Wunder
  rationale: Johannes bezeichnet Jesu Taten häufig als „Zeichen“, weil sie über das außergewöhnliche Geschehen hinaus auf seine Identität verweisen. Die Übersetzung bewahrt diese Bedeutung, ohne sie erklärend auszubauen.
- issue: Aussage, Jesus sei nicht παρὰ θεοῦ
  choice: nicht von Gott
  alternative: nicht von Gott gesandt
  rationale: „Von Gott“ lässt offen, ob Herkunft, Beauftragung oder Anerkennung im Vordergrund steht, und bewahrt damit die Spannung des griechischen Ausdrucks.
- issue: Charakterisierung als ἄνθρωπος ἁμαρτωλός
  choice: ein sündiger Mensch
  alternative: ein Sünder
  rationale: Die attributive Struktur des griechischen Textes bleibt sichtbar. Die Aussage der zweiten Gruppe wird dabei weder bestätigt noch theologisch abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und zugespitzt. „Spaltung“ bewahrt die Stärke des griechischen σχίσμα; die Satzstellung „unter ihnen“ macht deutlich, dass die Pharisäergruppe selbst uneins war.
