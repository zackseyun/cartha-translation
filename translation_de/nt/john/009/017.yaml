source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: de
  text: 'Da fragten sie den Blinden noch einmal: »Was sagst du selbst über ihn, da er dir die Augen geöffnet hat?« Er antwortete: »Er ist ein Prophet.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ist Prophet.« Das artikellose griechische Prädikat kann auch stärker qualitativ oder titelartig verstanden werden; der Zusammenhang erlaubt jedoch ebenso »ein Prophet«.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die folgernde Fortsetzung des Gesprächs. »Da« verbindet die Aussage im Deutschen natürlich mit dem vorausgehenden Verlauf, ohne eine stärkere Schlussfolgerung als im Kontext auszudrücken.
- source_word: τῷ τυφλῷ
  choice: den Blinden
  rationale: Das Adjektiv wird substantivisch gebraucht. »Den Blinden« ist knapp und entspricht der Bezeichnung, die die Fragenden in dieser Szene weiterhin verwenden; »den Mann, der blind gewesen war« würde eine im Ausdruck selbst nicht enthaltene Perspektive ergänzen.
- source_word: πάλιν
  choice: noch einmal
  rationale: Gibt die Wiederholung innerhalb der laufenden Befragung idiomatisch wieder.
- source_word: Τί σὺ λέγεις
  choice: Was sagst du selbst
  rationale: Das ausdrücklich gesetzte Pronomen σὺ trägt Nachdruck. »Du selbst« macht diesen Kontrast im Deutschen hörbar, ohne die Frage als bloße Meinungsfrage umzudeuten.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: Natürliche deutsche Wiedergabe von περί mit Genitiv in der Bedeutung »über/betreffs«.
- source_word: ὅτι
  choice: da
  rationale: 'Leitet hier am wahrscheinlichsten den Grund beziehungsweise Anlass der Frage ein: Der Mann soll Jesus angesichts der Öffnung seiner Augen beurteilen. »Da« bewahrt diesen kausalen Bezug in flüssigem Deutsch.'
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: er dir die Augen geöffnet hat
  rationale: Gibt das konkrete Geschehen wörtlich und im deutschen Erzählzusammenhang mit natürlichem Perfekt wieder.
- source_word: Προφήτης ἐστίν
  choice: Er ist ein Prophet
  rationale: Die prädikative, artikellose Bezeichnung ordnet Jesus am natürlichsten den Propheten zu. Der unbestimmte Artikel ist im Deutschen idiomatisch; eine mögliche stärker qualitative oder titelartige Nuance wird in der Fußnote offengehalten.
theological_decisions:
- issue: Ob Προφήτης als allgemeine Einordnung oder stärker titelartig zu verstehen ist
  choice: ein Prophet
  alternative: Prophet
  rationale: Im Erzählverlauf äußert der Geheilte eine sich entwickelnde Einschätzung Jesu. »Ein Prophet« ist die natürlichste deutsche Lesart und legt keinen bestimmten endzeitlichen Prophetentitel fest. Die artikellose griechische Form kann jedoch auch qualitativer oder titelartiger klingen; diese Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; »du selbst« bewahrt den griechischen Nachdruck. Keine konfessionell geprägte Deutung wird in den Haupttext eingetragen.
