    issue: Ungenaue Formulierung der Fußnote zu „Prophet“
    rationale: „Er ist Prophet“ ist nicht ohne Weiteres „wörtlicher“ als „Er ist ein Prophet“, da Deutsch bei prädikativen Berufs- und Rollenbezeichnungen eigene Artikelkonventionen hat. Die griechische Artikellosigkeit kann eine qualitative oder titelartige Nuance zulassen, erzwingt aber keine artikellose deutsche Wiedergabe.
