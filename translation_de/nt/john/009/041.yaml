  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Wenn ihr blind wärt, hättet ihr keine Sünde.[a] Nun aber sagt ihr: ‚Wir sehen‘; eure Sünde bleibt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr hättet keine Schuld“. Im Griechischen steht „Sünde“, was hier auch den Sinn von Schuld oder Verantwortlichkeit einschließen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: blind
  rationale: Das griechische Adjektiv bedeutet wörtlich „blind“. Im Zusammenhang ist es metaphorisch auf geistliche Wahrnehmung bezogen; die schlichte Wiedergabe bewahrt jedoch das im ganzen Kapitel entwickelte Bild, ohne es erklärend einzuengen.
- source_word: οὐκ ἂν εἴχετε
  choice: hättet ihr keine
  rationale: Der Irrealis mit ἄν bezeichnet die Folge einer nicht verwirklichten Bedingung. Der deutsche Konjunktiv II gibt dies natürlich und genau wieder.
- source_word: ἁμαρτίαν
  choice: Sünde
  rationale: ἁμαρτία bedeutet primär „Sünde“ und kann hier zugleich den Gedanken der Schuld beziehungsweise Verantwortlichkeit einschließen. „Sünde“ wahrt den johanneischen Sprachgebrauch und vermeidet eine unnötige Verengung.
- source_word: νῦν δὲ
  choice: Nun aber
  rationale: Die Wendung stellt der hypothetischen Aussage die gegenwärtige Wirklichkeit gegenüber. „Nun aber“ ist knapp, würdevoll und idiomatisch.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'sagt ihr: ‚Wir sehen.‘'
  rationale: Die direkte Rede mit dem Wechsel von der zweiten Person Plural zur ersten Person Plural bleibt erhalten und bewahrt die rhetorische Ironie.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: bleibt eure Sünde
  rationale: μένει bezeichnet ein Fortbestehen und ist als johanneischer Schlüsselbegriff mit „bleibt“ natürlich und präzise wiedergegeben.
theological_decisions:
- issue: Ob ausdrücklich erklärt werden soll, dass „blind“ geistliche Blindheit und „Sünde“ hier auch Schuld meint
  choice: Die wörtlichen Begriffe „blind“ und „Sünde“ bleiben im Haupttext ohne interpretierende Ergänzung erhalten.
  alternative: „Wenn ihr geistlich blind wärt, wärt ihr nicht schuldig.“
  rationale: Der Zusammenhang macht die geistliche Dimension deutlich, doch Jesu Wortwahl greift bewusst das Motiv körperlicher Blindheit aus dem Kapitel auf. Eine ausdrückliche Deutung würde das Bild und den Bedeutungsumfang von ἁμαρτία vorschnell festlegen.
- issue: Logische Beziehung des Schlusssatzes zur Behauptung „Wir sehen“
  choice: Die im Zusammenhang erschlossene Folgerung wird mit „Deshalb“ ausgedrückt.
  alternative: '„Nun aber sagt ihr: ‚Wir sehen‘; eure Sünde bleibt.“'
  rationale: Der griechische Text hat an dieser Stelle kein ausdrücklich ausgeschriebenes Folgewort; der Zusammenhang legt jedoch eine resultative Beziehung nahe. „Deshalb“ macht sie im Deutschen verständlich, ohne den theologischen Gehalt zu verändern.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die knappen Gegensätze und die direkte Rede bleiben erhalten; das Bild der Blindheit wird nicht ausgedeutet.
