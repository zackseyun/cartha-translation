id: JHN.9.2
reference: John 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: de
  text: 'Und seine Jünger fragten ihn: „Rabbi, wer hat gesündigt – dieser Mann oder seine Eltern –, dass er blind geboren wurde?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er blind geboren würde“. Der griechische Satz kann in der Frage der Jünger die von ihnen vorausgesetzte Zweck- oder Folgebeziehung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: fragten
  rationale: Der Aorist von ἐρωτάω bezeichnet hier eine schlichte Frage an Jesus; „fragten“ ist im modernen Deutschen natürlich und präzise.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte deutsche Bezeichnung für Schüler und Nachfolger eines Lehrers.
- source_word: λέγοντες
  choice: nicht gesondert wiedergegeben
  rationale: Das partizipiale „sagend“ wird idiomatisch in die direkte Rede nach „fragten“ integriert; „fragten ihn und sagten“ wäre im Deutschen unnötig schwerfällig.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die jüdische Anrede wird transliteriert und bewahrt das historische Kolorit; sie ist im Deutschen allgemein verständlich.
- source_word: τίς
  choice: wer
  rationale: Das Interrogativpronomen fragt unmittelbar nach der Person, der die Sünde zugerechnet wird.
- source_word: ἥμαρτεν
  choice: hat gesündigt
  rationale: Das deutsche Perfekt gibt das vergangene Geschehen in natürlicher direkter Rede wieder, ohne die Aussage auszuweiten.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Wörtlich „dieser“; „dieser Mann“ verdeutlicht idiomatisch den Bezug auf den blinden Mann.
- source_word: γονεῖς
  choice: Eltern
  rationale: Dies ist die direkte und übliche Entsprechung des griechischen Plurals.
- source_word: ἵνα
  choice: sodass
  rationale: „Sodass“ wahrt die von den Jüngern vorausgesetzte Zweck-/Folgebeziehung, ohne sie ausdrücklich als vom Erzähler bestätigte Kausalität auszugeben.
- source_word: τυφλὸς
  choice: blind
  rationale: Das prädikative Adjektiv bezeichnet unmittelbar seinen Zustand bei der Geburt.
- source_word: γεννηθῇ
  choice: geboren wurde
  rationale: In Verbindung mit ἵνα wird der Aorist Passiv im Deutschen natürlich als bereits eingetretene Geburt ausgedrückt; die modale beziehungsweise finale Nuance liegt in „sodass“.
theological_decisions:
- issue: Nuance von ἵνα in der Frage nach Sünde und angeborener Blindheit
  choice: „sodass er blind geboren wurde“
  alternative: „damit er blind geboren würde“ / „mit der Folge, dass er blind geboren wurde“
  rationale: Die Formulierung bewahrt die von den Jüngern angenommene Verbindung zwischen Sünde und Blindheit, stellt diese Annahme aber nicht als theologische Bestätigung des Erzählers dar. „Sodass“ lässt im Deutschen sowohl eine gedachte Folge- als auch eine zweckartige Beziehung anklingen, ohne sie abschließend festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist flüssig gestaltet; der semitisch-jüdische Anredetitel „Rabbi“ bleibt erhalten. Gedankenstriche markieren die beiden einander gegenübergestellten Möglichkeiten, ohne den Sinn zu verändern.
