  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: de
  text: 'Er antwortete ihnen: „Ich habe es euch schon gesagt, und ihr habt nicht zugehört.[a] Warum wollt ihr es noch einmal hören? Ihr wollt doch nicht etwa auch seine Jünger werden?[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihr habt es nicht gehört“. Das griechische Verb kann sowohl „hören“ als auch „zuhören“ beziehungsweise „auf etwas hören“ bedeuten; hier geht es wahrscheinlich darum, dass sie das Gesagte nicht beherzigten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wollt etwa auch ihr seine Jünger werden?“ Die griechische Frage ist mit μή eingeleitet und erwartet eine verneinende Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: Er antwortete
  rationale: Die übliche erzählende Wiedergabe des griechischen Antwortverbs; sie ist quellentreu und im Deutschen natürlich.
- source_word: ἤδη
  choice: schon
  rationale: Bezeichnet, dass die Mitteilung bereits zuvor erfolgt ist; „schon“ klingt hier natürlicher als „bereits“.
- source_word: οὐκ ἠκούσατε
  choice: ihr habt nicht zugehört
  rationale: ἀκούω kann „hören“ oder „zuhören/auf etwas hören“ bedeuten. Im Kontext wirft der Geheilte ihnen nicht fehlende akustische Wahrnehmung, sondern mangelnde Bereitschaft vor, das Gesagte anzunehmen.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Warum wollt ihr es noch einmal hören?
  rationale: τί ist hier im Zusammenhang mit θέλετε idiomatisch als „warum“ zu verstehen und bringt die Verärgerung des Sprechers zum Ausdruck. „es“ ist im Deutschen als aus dem Kontext erschlossenes Objekt erforderlich.
- source_word: μὴ καὶ ὑμεῖς
  choice: Ihr wollt doch nicht etwa auch …?
  rationale: μή kennzeichnet eine Frage, bei der eine verneinende Antwort erwartet wird. „doch nicht etwa“ gibt diese rhetorische, spöttische Erwartung im Deutschen natürlich wieder; „auch“ entspricht καί.
- source_word: αὐτοῦ μαθηταὶ
  choice: seine Jünger
  rationale: Die possessive Konstruktion ist die natürliche deutsche Entsprechung; „Jünger“ ist im johanneischen Zusammenhang die etablierte Wiedergabe von μαθηταί.
- source_word: γενέσθαι
  choice: werden
  rationale: γίνομαι bezeichnet hier den Eintritt in einen neuen Zustand; „werden“ bewahrt diesen ingressiven Sinn.
theological_decisions:
- issue: Rhetorische Kraft der Schlussfrage
  choice: 'Eine spöttische Frage, die eine verneinende Antwort erwartet: „Ihr wollt doch nicht etwa auch seine Jünger werden?“'
  alternative: „Wollt etwa auch ihr seine Jünger werden?“
  rationale: Das einleitende μή lässt normalerweise eine verneinende Antwort erwarten. Die deutsche Formulierung macht diese grammatische und pragmatische Kraft sichtbar, ohne eine zusätzliche Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die gereizte und spöttische Zuspitzung der Antwort bleibt erhalten, ohne umgangssprachlich oder unnötig interpretierend zu werden.
