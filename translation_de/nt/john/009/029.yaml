source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: de
  text: Wir wissen, dass Gott zu Mose gesprochen hat. Von diesem aber wissen wir nicht, woher er kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »woher er stammt«. Im Johannesevangelium können Fragen nach Jesu Herkunft sowohl eine gewöhnliche als auch eine tiefere theologische Bedeutung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck und bildet einen Gegensatz. Im Deutschen wird dies durch die Anfangsstellung von »Wir« und den späteren Kontrast mit »diesem hier« hinreichend deutlich.
- source_word: οἴδαμεν / οὐκ οἴδαμεν
  choice: wissen / wissen nicht
  rationale: Die wiederholte Formulierung bewahrt den pointierten Gegensatz zwischen der behaupteten Gewissheit über Mose und dem angeblichen Nichtwissen über Jesus.
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: Gott zu Mose gesprochen hat
  rationale: Das Perfekt λελάληκεν wird mit dem deutschen Perfekt wiedergegeben und bezeichnet Gottes Reden als feststehende, weiterhin maßgebliche Tatsache. »Zu Mose« entspricht dem Dativ und ist im Deutschen idiomatisch.
- source_word: τοῦτον δὲ
  choice: Von diesem hier aber
  rationale: Die Formulierung gibt sowohl den Kontrast durch δέ als auch die distanzierende, möglicherweise geringschätzige Wirkung des Demonstrativpronomens τοῦτον wieder, ohne sie unnötig zu verstärken.
- source_word: πόθεν ἐστίν
  choice: woher er ist
  rationale: Die wörtlich-nahe und dennoch verständliche Wendung lässt offen, ob nur Jesu Herkunft im gewöhnlichen Sinn oder zugleich sein tieferer Ursprung und seine Vollmacht gemeint sind.
theological_decisions:
- issue: Bedeutung von Jesu Herkunft in πόθεν ἐστίν
  choice: »woher er ist« ohne nähere Festlegung
  alternative: »woher er kommt« oder »welchen Ursprung er hat«
  rationale: Im Johannesevangelium können Aussagen über Jesu Herkunft zugleich eine alltägliche und eine tiefere theologische Ebene haben. Die Übersetzung bewahrt diese Spannung und die erzählerische Ironie, statt sie aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählregister. Der kurze Satzwechsel erhält die scharfe Gegenüberstellung der Sprecher. Die Fußnote steht bei der Wendung, auf die sie sich inhaltlich bezieht.
