id: JHN.9.7
reference: John 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: de
  text: 'Und er sagte zu ihm: „Geh, wasch dich im Teich Siloah“ (was übersetzt „Gesandt“ heißt).[a] Da ging er hin, wusch sich und kam sehend zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was ‚Gesandt‘ bedeutet“.'
    reason: Lexikalische Alternative für ἑρμηνεύεται; neben „übersetzt ... heißt“ ist im Deutschen auch „bedeutet“ möglich.
lexical_decisions:
- source_word: Ὕπαγε
  choice: Geh
  rationale: Der schlichte Bewegungsimperativ wird im modernen Deutschen natürlich und ohne zusätzliche Nuance wiedergegeben.
- source_word: νίψαι / ἐνίψατο
  choice: wasch dich / wusch sich
  rationale: νίπτω bezeichnet hier das Waschen, nicht notwendig ein vollständiges Bad. Im Deutschen verlangt die intransitiv-reflexive Verwendung in diesem Zusammenhang „sich waschen“.
- source_word: εἰς τὴν κολυμβήθραν
  choice: im Teich
  rationale: κολυμβήθρα bezeichnet ein Wasserbecken oder Reservoir; „Teich“ entspricht dem etablierten deutschen Ausdruck für Siloah. Bei „sich waschen“ gibt „im“ die Ziel- und Ortsvorstellung von εἰς idiomatisch wieder.
- source_word: Σιλωάμ
  choice: Siloah
  rationale: „Siloah“ ist die im Deutschen geläufige Form des Ortsnamens.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: 'das heißt übersetzt: „Gesandt“'
  rationale: Die Formulierung bewahrt den ausdrücklichen Übersetzungshinweis von ἑρμηνεύεται. „Gesandt“ gibt das passive Partizip wieder, ohne die mögliche johanneische Symbolik weiter auszudeuten.
- source_word: οὖν
  choice: Da
  rationale: οὖν kennzeichnet hier die unmittelbare erzählerische Folge. „Da“ verbindet Befehl und Reaktion in natürlichem deutschem Erzählstil.
- source_word: ἀπῆλθεν
  choice: ging er hin
  rationale: Die Bewegungsrichtung weg vom Sprecher und hin zum genannten Teich wird im Deutschen mit „hingehen“ knapp und idiomatisch ausgedrückt.
- source_word: ἦλθεν βλέπων
  choice: kam sehend zurück
  rationale: Die Formulierung erhält die anschauliche Partizipialkonstruktion βλέπων. „Zurück“ macht die im Erzählzusammenhang naheliegende Rückkehr verständlich, ohne die Heilung ausführlicher zu umschreiben.
theological_decisions:
- issue: Erklärende Deutung des Namens Siloah und mögliche johanneische Symbolik
  choice: 'Die Erklärung „das heißt übersetzt: ‚Gesandt‘“ bleibt im Haupttext, ohne einen ausdrücklichen Bezug auf Jesus als den vom Vater Gesandten herzustellen.'
  alternative: Die Symbolik durch eine interpretierende Formulierung oder einen ausdrücklichen christologischen Zusatz hervorheben.
  rationale: Der griechische Text selbst bietet die Namensdeutung, erklärt ihre theologische Bedeutung an dieser Stelle aber nicht ausdrücklich. Die Übersetzung bewahrt daher sowohl den Hinweis als auch seine Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die knappen Erzählverben und die Partizipialwendung „sehend zurück“ bewahren die Prägnanz und Anschaulichkeit des griechischen Satzes.
