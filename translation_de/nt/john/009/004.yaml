revisions:
- from: Wir müssen die Werke dessen tun, der mich gesandt hat, solange es Tag ist. Es kommt die Nacht, in der niemand wirken kann.[a]
  to: Wir[a] müssen die Werke dessen tun, der mich gesandt hat, solange es Tag ist. Die Nacht kommt, wenn niemand arbeiten kann.
  rationale: Die Revision bewahrt die SBLGNT-Lesart „Wir müssen“ und die bewusst nicht näher bestimmte Bezeichnung „dessen, der mich gesandt hat“. Sie gibt ὅτε mit dem regulären temporalen „wenn“ wieder, verwendet für das absolute ἐργάζεσθαι das natürliche „arbeiten“ und verlegt den textkritischen Anker an die tatsächlich betroffene Pluralform. Die Singularvariante bleibt ohne wertende Auslegung dokumentiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:52:45Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt zutreffend der SBLGNT-Lesart ἡμᾶς mit „Wir müssen“ und gibt die übrige Syntax und den zeitlichen Kontrast von Tag und kommender Nacht im Wesentlichen genau wieder. Der Schluss sollte jedoch ὅτε als temporalen Nebensatz („wenn“) wiedergeben, nicht als auf „Nacht“ bezogenen Relativsatz („in der“).
  naturalness: „Wir müssen die Werke dessen tun, der mich gesandt hat“ und „solange es Tag ist“ sind idiomatisches modernes Standarddeutsch. „wirken kann“ ist hier weniger unmittelbar als „arbeiten kann“ und kann im Deutschen unnötig religiös oder künstlerisch konnotiert sein. „Die Nacht kommt“ ist die natürliche knappe Formulierung.
  terminology: „Werke“ wahrt den johanneischen Schlüsselbegriff. „arbeiten“ im absoluten zweiten Vorkommen gibt ἐργάζεσθαι klar wieder und vermeidet sowohl die unnatürliche Wiederholung „Werke wirken“ als auch die Nebenbedeutungen von „wirken“. Die textkritische Fußnote soll unmittelbar an „Wir“ verankert werden, da genau dieses Wort die Variante betrifft.
  issues:
  - severity: medium
    issue: „in der niemand wirken kann“ statt eines temporalen Anschlusses
    rationale: ὅτε bedeutet „wenn/zu der Zeit, wenn“ und leitet einen Zeitsatz ein. Der Relativanschluss „in der“ ist zwar verständlich, verschiebt die Formulierung aber zu einer Eigenschaft der Nacht. „wenn niemand arbeiten kann“ bildet die griechische Konstruktion genauer und natürlicher ab.
  - severity: low
    issue: „wirken kann“ für absolutes ἐργάζεσθαι
    rationale: „Wirken“ kann „etwas bewirken“, künstlerisch tätig sein oder religiös-geistlich handeln bedeuten. „arbeiten“ ist im heutigen Standarddeutsch die unmarkierte Entsprechung für die hier allgemeine Unmöglichkeit zu arbeiten.
  - severity: low
    issue: Fußnotenanker steht am Versende statt bei der varianten Lesart
    rationale: Die Fußnote betrifft ἡμᾶς/„Wir“ am Satzanfang. Ein unmittelbarer Anker macht den Bezug transparent.
  revised_text: Wir[a] müssen die Werke dessen tun, der mich gesandt hat, solange es Tag ist. Die Nacht kommt, wenn niemand arbeiten kann.
  revised_footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »Ich muss die Werke dessen tun, der mich gesandt hat.«'
    reason: textual_variant
  revision_rationale: Die Revision bewahrt die SBLGNT-Lesart „Wir müssen“ und die bewusst nicht näher bestimmte Bezeichnung „dessen, der mich gesandt hat“. Sie gibt ὅτε mit dem regulären temporalen „wenn“ wieder, verwendet für das absolute ἐργάζεσθαι das natürliche „arbeiten“ und verlegt den textkritischen Anker an die tatsächlich betroffene Pluralform. Die Singularvariante bleibt ohne wertende Auslegung dokumentiert.
