source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: de
  text: Wir[a] müssen die Werke dessen tun, der mich gesandt hat, solange es Tag ist. Die Nacht kommt, wenn niemand arbeiten kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »Ich muss die Werke dessen tun, der mich gesandt hat.«'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς δεῖ
  choice: Wir müssen
  rationale: 'Der SBLGNT-Text hat das Akkusativpronomen der ersten Person Plural bei δεῖ: »Für uns ist es nötig«, idiomatisch und mit gleicher Verpflichtungskraft: »Wir müssen«.'
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: die Werke … tun
  rationale: Das deutsche »die Werke tun« vermeidet die unnatürliche Klangfigur »die Werke wirken« und bewahrt zugleich den johanneischen Leitbegriff »Werke«.
- source_word: τοῦ πέμψαντός με
  choice: dessen, der mich gesandt hat
  rationale: Das substantivierte Partizip bezeichnet die Person, die Jesus gesandt hat, ohne sie im Vers ausdrücklich zu benennen. Die Formulierung wahrt diesen Bezug.
- source_word: ἕως ἡμέρα ἐστίν
  choice: solange es Tag ist
  rationale: Im Zusammenhang mit der kommenden Nacht bezeichnet ἕως die Dauer der noch verfügbaren Zeit. »Solange« gibt dies im Deutschen natürlich wieder.
- source_word: ἔρχεται νὺξ
  choice: Es kommt die Nacht
  rationale: Das Präsens drückt das Herannahen der Nacht aus. Die deutsche Wortstellung ist würdig und eindringlich, ohne die Aussage zu deuten.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: in der niemand wirken kann
  rationale: ὅτε leitet die Zeitangabe ein; der Relativanschluss »in der« bezieht sie natürlich auf die Nacht. Das absolute ἐργάζεσθαι wird mit »wirken« wiedergegeben und damit vom transitiven »Werke tun« unterschieden.
theological_decisions:
- issue: 'Textvariante am Versanfang: ἡμᾶς (»wir/uns«) gegenüber ἐμέ (»ich/mich«)'
  choice: Wir müssen die Werke dessen tun, der mich gesandt hat
  alternative: Ich muss die Werke dessen tun, der mich gesandt hat
  rationale: Die Übersetzung folgt der vorgegebenen SBLGNT-Lesart ἡμᾶς. Da die Singularlesart breit bezeugt und aus vielen Übersetzungen bekannt ist, wird sie zur Wahrung der Texttransparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Werke tun« erhält den johanneischen Schlüsselbegriff; »wirken« im Schlusssatz vermeidet eine schwerfällige Wiederholung. Der Fußnotenmarker steht am Versende und verweist auf die Variante am Versanfang.
