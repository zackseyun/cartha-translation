  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Du hast ihn gesehen, und der, der mit dir spricht, der ist es.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Die erzählende Aoristform von λέγω bezeichnet hier schlicht das Sagen; der Dativ αὐτῷ nennt den Angesprochenen.
- source_word: Καὶ ἑώρακας
  choice: Du hast ihn gesehen
  rationale: Das deutsche Perfekt gibt die vollendete, für die gegenwärtige Situation bedeutsame Wahrnehmung natürlich wieder. Das einleitende καί muss im Deutschen nicht eigens mit „und“ wiederholt werden, da es hier den Anschluss beziehungsweise die Bekräftigung trägt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Pronomen nimmt den unmittelbar zuvor genannten Referenten auf, ohne dessen Titel erklärend in den Vers einzufügen.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: der, der mit dir spricht
  rationale: Das substantivierte Präsenspartizip wird als laufende Handlung wiedergegeben. „Mit dir“ bildet μετά mit Genitiv genau und zugleich idiomatisch ab.
- source_word: ἐκεῖνός ἐστιν
  choice: der ist es
  rationale: Die betonte deutsche Identifikationsformel bewahrt die knappe Selbstoffenbarung und die demonstrative Kraft von ἐκεῖνος.
theological_decisions:
- issue: Jesu Selbstidentifikation mit dem zuvor erfragten Menschensohn
  choice: „der, der mit dir spricht, der ist es“
  alternative: „Ich bin es“ oder „der Menschensohn ist der, der mit dir spricht“
  rationale: Der griechische Text identifiziert Jesus direkt mit dem zuvor genannten Referenten, formuliert jedoch weder ausdrücklich „Ich bin es“ noch wiederholt er den Titel. Die Übersetzung bewahrt diese knappe Identifikation ohne erklärende Erweiterung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederaufnahme „der … der ist es“ ist im Deutschen leicht markiert, gibt aber die emphatische Identifikationsstruktur des Griechischen klar und verständlich wieder.
