source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: de
  text: Nachdem er das gesagt hatte, spuckte er auf die Erde, machte aus dem Speichel Schlamm und strich ihm den Schlamm auf die Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „salbte ihm die Augen mit dem Schlamm“. Das griechische Verb kann „salben“ oder „aufstreichen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die den folgenden Handlungen vorausgeht. Die Formulierung gibt diese zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: ἔπτυσεν χαμαί
  choice: spuckte er auf die Erde
  rationale: χαμαί bezeichnet den Boden beziehungsweise die Erde als Ziel des Spuckens. „Auf die Erde“ ist konkret und im Zusammenhang idiomatisch.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: machte aus dem Speichel Schlamm
  rationale: πηλός kann feuchte Erde, Schlamm oder Lehm bezeichnen. Da die Substanz aus Speichel und der Erde am Boden entsteht, ist „Schlamm“ die klare, allgemeinverständliche Wiedergabe; ἐκ wird mit „aus“ erhalten.
- source_word: ἐπέχρισεν
  choice: strich ... auf
  rationale: ἐπιχρίω bezeichnet das Aufstreichen oder Salben. Bei Schlamm beschreibt „aufstreichen“ die konkrete Handlung natürlich, ohne von sich aus einen kultischen oder zeremoniellen Beiklang einzutragen.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: strich ihm den Schlamm auf die Augen
  rationale: Die deutsche Dativkonstruktion gibt den Bezug des Pronomens auf den Blinden idiomatisch wieder und bewahrt zugleich den bestimmten Artikel bei „den Schlamm“, der auf die zuvor hergestellte Substanz zurückverweist.
theological_decisions:
- issue: Möglicher zeremonieller Beiklang von ἐπέχρισεν
  choice: Im Haupttext steht die konkrete Formulierung „strich ihm den Schlamm auf die Augen“.
  alternative: „salbte ihm die Augen mit dem Schlamm“
  rationale: Das Verb kann „salben“ bedeuten, doch der unmittelbare Zusammenhang beschreibt zunächst das körperliche Auftragen von Schlamm. Die Hauptfassung vermeidet daher eine nicht ausdrücklich bezeichnete kultische Deutung; die lexikalisch mögliche Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Schlamm“ und „auf die Erde“ halten die Szene anschaulich; „strich ihm ... auf die Augen“ ist natürliches Deutsch und vermeidet unnötig medizinische oder zeremonielle Festlegungen.
