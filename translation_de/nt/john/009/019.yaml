  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: das Fragen der Eltern, die Identifikation als ihr Sohn, die neutrale Wiedergabe von λέγετε durch „sagt“, die Blindheit seit Geburt sowie die folgernde Frage nach seinem gegenwärtigen Sehen. „Wie kommt es dann, dass“ ist eine idiomatische Wiedergabe von πῶς οὖν und fügt keine sachliche Deutung hinzu.'
