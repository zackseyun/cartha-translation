source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: de
  text: 'Und sie fragten sie: »Ist das euer Sohn, von dem ihr sagt, dass er blind geboren wurde? Wie kommt es dann, dass er jetzt sieht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: sie fragten sie
  rationale: Das einfache »fragten« gibt das Aoristverb natürlich wieder; das im Deutschen schwerfällige, semitisch geprägte Partizip »indem sie sagten« wird idiomatisch in die direkte Rede integriert.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Ist das euer Sohn
  rationale: Die formal aussageartige griechische Formulierung fungiert im Zusammenhang als Frage. Die deutsche Wortstellung macht diese Funktion eindeutig.
- source_word: ὃν ὑμεῖς λέγετε
  choice: von dem ihr sagt
  rationale: »Sagt« bleibt gegenüber »behauptet« neutral und bewahrt die ausdrückliche Hervorhebung der angesprochenen Eltern durch »ihr«.
- source_word: τυφλὸς ἐγεννήθη
  choice: blind geboren wurde
  rationale: Dies ist die natürliche deutsche Wiedergabe und bezeichnet eindeutig Blindheit seit der Geburt.
- source_word: πῶς οὖν
  choice: Wie kommt es dann, dass
  rationale: Die Wendung gibt sowohl die Frage nach der Erklärung als auch die folgernde Kraft von οὖν in natürlichem modernem Deutsch wieder.
- source_word: βλέπει ἄρτι
  choice: er jetzt sieht
  rationale: »Sieht« bezeichnet den gegenwärtigen tatsächlichen Zustand, während »jetzt« den Kontrast zur früheren Blindheit ausdrückt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist idiomatisch gestaltet, ohne die skeptische Haltung der Fragenden durch wertende Wörter wie »behauptet« zusätzlich zu verstärken.
