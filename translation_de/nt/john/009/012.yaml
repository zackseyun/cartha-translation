  source_fidelity: 'Die Grundstruktur und die Tempora sind zutreffend wiedergegeben: εἶπαν steht in der Erzählvergangenheit, λέγει bleibt als johanneisches historisches Präsens erhalten. „Der Mann“ gibt ἐκεῖνος jedoch nur teilweise wieder; die demonstrative Markierung sollte im Deutschen sichtbar bleiben. Außerdem ist „Und“ für καὶ näher als das leicht zeitlich akzentuierende „Da“.'
  naturalness: „Und sie sagten zu ihm“ und „Er sagt“ sind klares, modernes Standarddeutsch und bewahren die knappe Erzählweise. „Wo ist dieser Mann?“ ist idiomatisch und gibt die demonstrative Bezugnahme natürlich wieder.
  terminology: Keine besonderen theologischen oder namensbezogenen Termini kommen vor. „Dieser Mann“ wahrt die demonstrative Distanz von ἐκεῖνος, ohne das im heutigen Deutsch oft unnatürliche „jener“ zu erzwingen.
