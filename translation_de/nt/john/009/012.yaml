base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: de
  text: 'Und sie sagten zu ihm: „Wo ist dieser Mann?“ Er sagt: „Ich weiß es nicht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Da
  rationale: Der Anschluss führt im Deutschen natürlich die Reaktion auf die vorangehende Aussage fort; „Da“ gibt den narrativen Zusammenhang wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: εἶπαν
  choice: sagten sie
  rationale: Die Grundbedeutung von λέγω wird beibehalten. Obwohl die direkte Rede eine Frage enthält, vermeidet „sagten“ eine unnötige Präzisierung gegenüber dem griechischen Wortlaut.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den geheilten Mann als Adressaten der Rede.
- source_word: Ποῦ
  choice: Wo
  rationale: Direkte und idiomatische Wiedergabe des lokalen Frageadverbs.
- source_word: ἐκεῖνος
  choice: der Mann
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist im Kontext auf Jesus. „Der Mann“ klingt im modernen Deutschen natürlich und erhält mehr Bestimmtheit als das bloße „er“, ohne mit dem weniger idiomatischen „jener“ künstliche Distanz zu erzeugen.
- source_word: λέγει
  choice: Er sagt
  rationale: Das historische Präsens wird beibehalten und bewahrt die für die johanneische Erzählweise typische Unmittelbarkeit.
- source_word: Οὐκ οἶδα
  choice: Ich weiß es nicht
  rationale: Natürliche, vollständige und stilistisch würdige Wiedergabe der schlichten Verneinung.
theological_decisions: []
translation_notes:
