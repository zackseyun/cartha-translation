  - severity: medium
    issue: Demonstrativkraft von ἐκεῖνος in „der Mann“ abgeschwächt
    rationale: Der bestimmte Artikel bezeichnet den Mann, markiert aber die demonstrative Deixis nicht. „Dieser Mann“ erhält diese Nuance in natürlichem modernem Deutsch.
