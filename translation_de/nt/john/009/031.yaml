source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: de
  text: Wir wissen, dass Gott nicht auf Sünder hört. Doch wenn jemand gottesfürchtig ist[a] und seinen Willen tut, auf den hört er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Verehrer Gottes“.'
    reason: Lexikalische Alternative für θεοσεβής; sie hebt den Aspekt der Gottesverehrung hervor, während „gottesfürchtig“ den weiteren Sinn der Ehrfurcht vor Gott wahrt.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Wir wissen
  rationale: Das formal perfekte οἶδα hat im Koine-Griechischen präsentische Bedeutung; „wir wissen“ ist die natürliche deutsche Wiedergabe.
- source_word: ἁμαρτωλῶν
  choice: Sünder
  rationale: Der Genitiv Plural bezeichnet hier die Personengruppe, auf die Gott nach Aussage des Sprechers nicht hört. „Sünder“ wahrt knapp die moralisch-religiöse Bedeutung.
- source_word: ἀκούει
  choice: hört auf
  rationale: ἀκούω mit einer Person im Genitiv meint in diesem Zusammenhang nicht bloß akustisches Hören, sondern geneigtes Hören beziehungsweise Beachtung. „Auf jemanden hören“ gibt dies idiomatisch wieder, ohne bereits ausdrücklich „Gebete erhören“ zu sagen.
- source_word: θεοσεβὴς
  choice: gottesfürchtig
  rationale: Das Adjektiv bezeichnet einen Menschen, der Gott verehrt und ihm mit Ehrfurcht begegnet. „Gottesfürchtig“ bewahrt den ausdrücklichen Gottesbezug und ist weiter als eine allein auf kultische Anbetung bezogene Formulierung.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: seinen Willen tut
  rationale: Dies entspricht dem griechischen Ausdruck eng und ist zugleich eine verständliche, in biblisch-religiöser Sprache geläufige deutsche Wendung.
- source_word: τούτου ἀκούει
  choice: auf den hört er
  rationale: Das vorangestellte τούτου greift die zuvor beschriebene Person betont auf. Die Formulierung erhält diesen Nachdruck und wiederholt konsequent die Bedeutung von ἀκούει.
- source_word: ἀλλ’ ἐάν τις
  choice: Doch wenn jemand
  rationale: Die Formulierung führt den kontrastierenden Bedingungssatz klar und natürlich ein und bewahrt den unbestimmten Singular.
theological_decisions:
- issue: Reichweite der Aussage, Gott höre nicht auf Sünder
  choice: Die Behauptung wird so wiedergegeben, wie der Sprecher sie formuliert, ohne sie abzuschwächen oder zu einer umfassenden Lehrformel auszubauen.
  alternative: „Gott erhört die Gebete von Sündern nicht“ oder „Gott billigt Sünder nicht“
  rationale: Der griechische Text sagt schlicht, dass Gott nicht auf Sünder hört, und stellt dem den gottesfürchtigen Menschen gegenüber, der Gottes Willen tut. Die Übersetzung bewahrt diese Spannung, ohne zusätzliche Einschränkungen oder dogmatische Folgerungen einzutragen.
- issue: Wiedergabe von θεοσεβής
  choice: gottesfürchtig
  alternative: „ein Verehrer Gottes“ beziehungsweise „jemand, der Gott verehrt“
  rationale: „Gottesfürchtig“ erhält den adjektivischen und umfassend ehrfürchtigen Sinn. Die alternative Wiedergabe ist lexikalisch möglich und wird deshalb in der Fußnote genannt, kann aber stärker nach einer besonderen kultischen Rolle klingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf jemanden hören“ bringt den kontextuellen Sinn von geneigtem Hören klar zum Ausdruck. Die leicht markierte Schlussstellung „auf den hört er“ bewahrt die Hervorhebung von τούτου. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Alternative bezieht.
