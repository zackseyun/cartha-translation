id: JHN.9.38
reference: John 9:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: de
  text: 'Er aber sagte: »Ich glaube, Herr[a]«, und warf sich vor ihm nieder[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch eine respektvolle Anrede wie »mein Herr« ausdrücken. Hier kann »Herr« wegen des Glaubensbekenntnisses und der folgenden Niederwerfung zugleich stärkeres Gewicht haben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und betete ihn an« beziehungsweise »und huldigte ihm«. Das griechische Verb bezeichnet ein Sich-Niederwerfen und kann je nach Zusammenhang Huldigung oder Anbetung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Er aber
  rationale: Der Artikel steht pronominal für den geheilten Mann; δέ markiert hier einen leichten Fortgang beziehungsweise Übergang, den »aber« knapp wiedergibt, ohne einen starken Gegensatz zu behaupten.
- source_word: ἔφη
  choice: sagte
  rationale: Der Aorist von φημί ist eine gewöhnliche Einleitung direkter Rede; »sagte« ist natürlich und präzise.
- source_word: Πιστεύω
  choice: Ich glaube
  rationale: Die Wiedergabe bewahrt den für das Johannesevangelium zentralen Wortlaut des Glaubens und antwortet unmittelbar auf Jesu Selbstoffenbarung.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« erhält sowohl die mögliche respektvolle Anrede als auch das im Kontext naheliegende christologische Gewicht; die höfliche Alternative »mein Herr« wird in der Fußnote genannt.
- source_word: προσεκύνησεν
  choice: warf sich vor ihm nieder
  rationale: Die Formulierung bildet zunächst die körperliche beziehungsweise huldigende Handlung von προσκυνέω ab und bewahrt damit die lexikalische Spannweite, ohne die im Kontext mögliche Bedeutung »anbeten« aus dem Haupttext auszuschließen.
- source_word: αὐτῷ
  choice: vor ihm
  rationale: Beim deutschen Ausdruck »sich vor jemandem niederwerfen« wird das Dativobjekt idiomatisch mit »vor« wiedergegeben.
theological_decisions:
- issue: Ob κύριε lediglich als höfliche Anrede oder als Bekenntnis zu Jesus als dem Herrn zu verstehen ist
  choice: Herr
  alternative: mein Herr / Herr im Sinne einer respektvollen Anrede
  rationale: Der Zusammenhang von Jesu Selbstoffenbarung, dem Glaubensbekenntnis und der anschließenden προσκύνησις spricht für »Herr«, doch die griechische Anrede allein erzwingt die volle christologische Bedeutung nicht. Die Fußnote wahrt diese Ambiguität.
- issue: Ob προσεκύνησεν ausdrücklich mit »betete ihn an« oder handlungsnah mit »warf sich vor ihm nieder« wiederzugeben ist
  choice: warf sich vor ihm nieder
  alternative: betete ihn an / huldigte ihm
  rationale: Das Verb kann Niederwerfung, Huldigung oder Anbetung bezeichnen. Die handlungsnahe Wiedergabe vermeidet, die lexikalische Mehrdeutigkeit stillschweigend aufzulösen; der unmittelbare Kontext lässt jedoch »betete ihn an« deutlich als mögliche Deutung hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp. »warf sich vor ihm nieder« ist allgemein verständlich und erhält die konkrete Handlung sowie die theologische Spannung des griechischen Verbs; die mögliche kultische Bedeutung wird in der Fußnote offengelegt.
