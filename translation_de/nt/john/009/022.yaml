  naturalness: Der Text ist modernes, verständliches Standarddeutsch. Eine Umformulierung mit passivischer Sanktion ist sowohl natürlich als auch näher an der griechischen Aussage.
  terminology: „Messias“ ist für χριστός als Titel angemessen. „Die Juden“ bewahrt den griechischen Wortlaut; die kontextualisierende Fußnote verhindert eine unterschiedslose Verallgemeinerung. Die Fußnote zu b wird auf die im Kontext naheliegende Titelalternative beschränkt.
