  rationale: Die Revision ersetzt die aktive Sanktion durch eine passivische Formulierung und wahrt damit die im griechischen ἀποσυνάγωγος γένηται enthaltene Offenheit hinsichtlich der ausführenden Instanz. Die Fußnote zu χριστός wird zu einer idiomatischen deutschen Titelalternative gestrafft. Bedeutung, Erzählton und die kontextuelle Anmerkung zu „die Juden“ bleiben erhalten.
