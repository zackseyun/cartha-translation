id: JHN.9.22
reference: John 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: de
  text: Seine Eltern sagten dies, weil sie sich vor den Juden[a] fürchteten. Denn die Juden hatten bereits vereinbart, dass jeder, der ihn als den Messias[b] bekennen würde, aus der Synagoge ausgeschlossen werden sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Juden“. In diesem Zusammenhang sind wahrscheinlich die jüdischen Autoritäten gemeint, nicht unterschiedslos das jüdische Volk.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „als den Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: sagten dies
  rationale: Das griechische Neutrum Plural kann im Deutschen idiomatisch mit dem zusammenfassenden Singular „dies“ wiedergegeben werden; der Rückbezug auf die vorausgehenden Aussagen bleibt klar.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seine Eltern
  rationale: Die natürliche und genaue deutsche Entsprechung von γονεῖς mit dem Possessivbezug αὐτοῦ.
- source_word: ἐφοβοῦντο
  choice: sie sich … fürchteten
  rationale: Das Imperfekt bezeichnet hier den anhaltenden Beweggrund der Eltern; „sich vor jemandem fürchten“ ist im Deutschen idiomatisch.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Formulierung bewahrt den Wortlaut des Griechischen. Der Zusammenhang weist wahrscheinlich auf die jüdischen Autoritäten, was in der Fußnote erläutert wird.
- source_word: ἤδη … συνετέθειντο
  choice: hatten bereits vereinbart
  rationale: Das Plusquamperfekt und ἤδη bezeichnen eine schon zuvor getroffene gemeinsame Festlegung; „vereinbart“ vermeidet die stärkere Wertung von „verschworen“.
- source_word: ἵνα ἐάν τις
  choice: jeden …, der
  rationale: Die konditionale Regelung wird in natürlichem Deutsch als generische Relativkonstruktion wiedergegeben.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: ihn als den Messias bekennen würde
  rationale: ὁμολογέω bezeichnet öffentliches Anerkennen oder Bekennen; χριστός ist hier prädikativ und titular gebraucht.
- source_word: ἀποσυνάγωγος γένηται
  choice: aus der Synagoge auszuschließen
  rationale: Das Adjektiv bezeichnet den Ausschluss aus der Synagogengemeinschaft. Die aktive Form entspricht der deutschen Formulierung einer zuvor vereinbarten Sanktion.
theological_decisions:
- issue: Wiedergabe von χριστός
  choice: der Messias
  alternative: der Christus / Christus
  rationale: χριστός fungiert hier als Titel und bezeichnet den erwarteten Gesalbten; „Messias“ macht den jüdischen Erwartungshorizont im Deutschen deutlich.
- issue: Referent von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden, mit kontextueller Fußnote
  alternative: die jüdischen Autoritäten / die Judäer
  rationale: Der Haupttext bewahrt die lexikalische Breite und mögliche Spannung des griechischen Ausdrucks. Wegen der Befugnis zum Synagogenausschluss sind im unmittelbaren Kontext wahrscheinlich die zuständigen jüdischen Autoritäten gemeint.
- issue: Art des Synagogenausschlusses
  choice: aus der Synagoge auszuschließen
  alternative: aus der Synagogengemeinschaft auszustoßen
  rationale: Die knappe Formulierung bewahrt die institutionelle und soziale Tragweite, ohne Art oder Dauer der Sanktion näher festzulegen, als es der Text tut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung gibt die erklärende Funktion von γάρ natürlich wieder. Der Haupttext bleibt nahe am griechischen Wortlaut, während mögliche Missverständnisse durch knappe Fußnoten geklärt werden.
