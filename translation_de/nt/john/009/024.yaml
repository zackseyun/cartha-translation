  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: de
  text: 'Da riefen sie den Mann, der blind gewesen war, ein zweites Mal und sagten zu ihm: »Gib Gott die Ehre![a] Wir wissen, dass dieser Mann ein Sünder ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise eine feierliche Aufforderung: »Gib Gott die Ehre«, das heißt: »Sag vor Gott die Wahrheit« oder »Lege vor Gott offen Bekenntnis ab.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: riefen sie
  rationale: φωνέω bezeichnet hier, dass die Behörden den geheilten Mann erneut zu sich rufen. »Riefen« ist natürlich und vermeidet die bei »vorladen« zusätzlich mitschwingende amtliche Zwangsgewalt.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt die Handlung als Folge des vorangehenden Gesprächs weiter. Im Deutschen gibt »Da« diesen erzählerischen Zusammenhang natürlich wieder.
- source_word: τὸν ἄνθρωπον
  choice: den Mann
  rationale: ἄνθρωπος bezeichnet hier einen bestimmten erwachsenen Mann; »den Mann« ist daher sachlich und idiomatisch.
- source_word: ἐκ δευτέρου
  choice: ein zweites Mal
  rationale: Die Wendung bedeutet ausdrücklich »zum zweiten Mal«; die gewählte Form ist im modernen Deutsch flüssig und präzise.
- source_word: ὃς ἦν τυφλός
  choice: der blind gewesen war
  rationale: Der griechische Imperfekt beschreibt seinen früheren Zustand. Da er inzwischen geheilt ist, macht das deutsche Plusquamperfekt den zeitlichen Bezug klar, ohne zu behaupten, er sei noch blind.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Gib Gott die Ehre!
  rationale: Die Übersetzung bewahrt den konkreten Wortlaut der Aufforderung. Ihre wahrscheinliche idiomatische Funktion als feierliche Verpflichtung zur Wahrheit wird in der Fußnote erläutert.
- source_word: ἡμεῖς οἴδαμεν
  choice: Wir wissen
  rationale: Das ausdrücklich gesetzte ἡμεῖς unterstreicht die behauptete Gewissheit der Sprecher; »Wir wissen« erhält diesen Nachdruck.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: dieser Mensch
  rationale: »Dieser Mensch« bildet Demonstrativpronomen und Substantiv genau ab, ohne durch eine abwertende Bezeichnung einen im Griechischen nicht eindeutig markierten Ton hinzuzufügen.
- source_word: ἁμαρτωλός
  choice: ein Sünder
  rationale: Das prädikativ gebrauchte Adjektiv bezeichnet hier eine Person als Sünder. Die substantivische deutsche Wiedergabe erhält die Schärfe der Anschuldigung.
theological_decisions:
- issue: Idiomatische Bedeutung von Δὸς δόξαν τῷ θεῷ
  choice: Den wörtlichen Ausdruck »Gib Gott die Ehre!« im Haupttext beibehalten
  alternative: Deutend mit »Sag vor Gott die Wahrheit!« oder »Lege vor Gott ein offenes Bekenntnis ab!« übersetzen
  rationale: Die Wendung fungiert wahrscheinlich als feierliche Aufforderung, vor Gott die Wahrheit zu sagen beziehungsweise offen zu bekennen (vgl. Josua 7,19). Da ihr Wortlaut zugleich eine Aufforderung zur Ehrung Gottes ist, bewahrt der Haupttext diese Spannung; die mögliche idiomatische Bedeutung steht in der Fußnote.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Erzählgang, bleibt aber idiomatisch; die direkte Rede wird mit deutschen Anführungszeichen wiedergegeben.
