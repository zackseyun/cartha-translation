source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: de
  text: 'Er antwortete: „Der Mann namens Jesus machte Schlamm und strich ihn mir auf die Augen. Dann sagte er zu mir: ‚Geh zum Siloah und wasch dich.‘ Da ging ich hin, wusch mich und konnte sehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Er antwortete
  rationale: Die übliche deutsche Erzählformel gibt Verb und hervorgehobenes Pronomen im Kontext natürlich wieder, ohne das schwerfällige „Jener antwortete“.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Der Mann, der Jesus genannt wird
  rationale: Bewahrt die Identifizierung als „der Mann“ und damit den begrenzten Erkenntnisstand des Sprechers; die Formulierung folgt dem Partizip λεγόμενος eng und bleibt natürlich.
- source_word: πηλὸν ἐποίησεν
  choice: machte Schlamm
  rationale: πηλός kann Schlamm oder Lehm bezeichnen. Im unmittelbaren Zusammenhang ist „Schlamm“ im heutigen Deutsch die natürliche Bezeichnung für die hergestellte Mischung.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: strich ihn mir auf die Augen
  rationale: Gibt die konkrete Bedeutung des Auftragens wieder, ohne die im Deutschen möglichen rituellen Nebenbedeutungen von „salben“ einzutragen.
- source_word: εἶπέν μοι ὅτι
  choice: Dann sagte er zu mir
  rationale: Natürliche Einleitung der folgenden direkten Rede; „Dann“ macht die Abfolge deutlich, ohne eine zusätzliche inhaltliche Aussage einzuführen.
- source_word: Ὕπαγε εἰς τὸν Σιλωάμ
  choice: Geh zum Siloah
  rationale: Folgt der knappen Ortsangabe des griechischen Textes, der an dieser Stelle das Becken nicht nochmals ausdrücklich nennt.
- source_word: νίψαι
  choice: wasch dich
  rationale: Der Medium-Imperativ wird im Deutschen idiomatisch reflexiv wiedergegeben.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Da ging ich hin, wusch mich
  rationale: „Da“ vermittelt die folgernde Funktion von οὖν; die koordinierte deutsche Form gibt die Partizipialfolge verständlich wieder.
- source_word: ἀνέβλεψα
  choice: konnte sehen
  rationale: Im Heilungskontext bezeichnet das Verb das Erlangen des Sehvermögens. Die gewählte Form ist natürlich und vermeidet die mögliche Annahme, der von Geburt an Blinde habe früher bereits gesehen.
theological_decisions:
- issue: Bezeichnung Jesu durch den Geheilten
  choice: Der Mann, der Jesus genannt wird
  alternative: Der Mann namens Jesus
  rationale: 'Die Wiedergabe erhält die erzählerische Spannung: Der Sprecher bezeichnet Jesus hier lediglich als Mann und legt noch kein weitergehendes Bekenntnis ab.'
- issue: Beginn des Sehens bei einem von Geburt an Blinden
  choice: konnte sehen
  alternative: erhielt ich mein Augenlicht / wurde ich wieder sehend
  rationale: „Konnte sehen“ beschreibt die Heilung, ohne fälschlich nahezulegen, er habe ein früher vorhandenes Sehvermögen zurückerlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „Augen“ statt „Augäpfel“ entspricht natürlichem Deutsch. Der einzige Fußnotenhinweis erläutert die kontextuelle Wiedergabe von ἀνέβλεψα und vermeidet die missverständliche Formulierung „wieder sehen“ bei einem von Geburt an Blinden.
