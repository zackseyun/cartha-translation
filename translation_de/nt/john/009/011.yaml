  source_fidelity: 'Der Satz gibt die Abfolge und den Sinn des griechischen Textes insgesamt treffend wieder: Jesus wird lediglich als „der Mann“ identifiziert; das Auftragen des Schlamms, der Befehl zum Waschen, das Hingehen, Waschen und anschließende Erlangen des Sehvermögens sind erhalten. Die Fußnote ist jedoch nicht quellentreu, weil „wurde sehend“ keine wörtliche Wiedergabe von ἀνέβλεψα ist.'
  naturalness: Der deutsche Text ist modernes, verständliches Standarddeutsch. „Der Mann namens Jesus“ ist gegenüber „der Jesus genannt wird“ idiomatischer und bewahrt dieselbe zurückhaltende Identifizierung. „Ich konnte sehen“ ist im Kontext natürlich und besagt angemessen, dass der zuvor Blinde nun sehen konnte.
  terminology: „Schlamm“, „auf die Augen streichen“, „Siloah“ und „wasch dich“ sind passend. Die Formulierung „namens Jesus“ fügt keinen christologischen Titel oder eine theologische Deutung hinzu.
