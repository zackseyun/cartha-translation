  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: de
  text: 'Da antwortete er: „Ob er ein Sünder ist, weiß ich nicht. Eines weiß ich: Ich war blind, und jetzt sehe ich.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Da antwortete er
  rationale: „Da“ führt den Dialog natürlich fort und gibt οὖν im Erzählzusammenhang wieder; das deutsche Pronomen genügt als Rückverweis auf den zuvor genannten Mann.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Ob er ein Sünder ist
  rationale: Nach „wissen“ leitet εἰ eine indirekte Entscheidungsfrage ein; „ob“ ist die natürliche deutsche Entsprechung und lässt die vom Sprecher offengelassene Beurteilung bestehen.
- source_word: οὐκ οἶδα
  choice: weiß ich nicht
  rationale: Das Perfekt οἶδα hat präsentische Bedeutung; die deutsche Wortstellung hebt den Gegensatz zum folgenden „Eines weiß ich“ hervor.
- source_word: ἓν οἶδα
  choice: Eines weiß ich
  rationale: Die Voranstellung von „Eines“ bewahrt die Betonung und den rhetorischen Kontrast des griechischen Satzes.
- source_word: τυφλὸς ὢν
  choice: Ich war blind
  rationale: Die Partizipialkonstruktion bezeichnet im Kontext den früheren Zustand. Ein selbstständiger deutscher Satz gibt den zeitlichen Gegensatz klar und idiomatisch wieder, ohne eine zusätzliche kausale oder konzessive Deutung aufzuzwingen.
- source_word: ἄρτι βλέπω
  choice: jetzt sehe ich
  rationale: „Jetzt“ bildet den prägnanten Gegensatz zur früheren Blindheit; „sehe ich“ bewahrt die schlichte Aussage von βλέπω.
theological_decisions:
- issue: Die Aussage des Geheilten darf nicht als Urteil des Erzählers über Jesu Sündhaftigkeit oder Sündlosigkeit formuliert werden.
  choice: „Ob er ein Sünder ist, weiß ich nicht.“
  alternative: „Wenn er ein Sünder ist, weiß ich nicht.“
  rationale: „Ob“ gibt hier die indirekte Frage nach dem behaupteten Sachverhalt idiomatisch wieder und bewahrt die begrenzte Erkenntnisperspektive des Sprechers, ohne die Frage theologisch zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, mündlich glaubwürdiger Satzführung. Der starke Gegensatz zwischen Nichtwissen und sicherem Erfahrungswissen bleibt erhalten.
