  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: de
  text: 'Die einen sagten: „Er ist es.“ Andere sagten: „Nein, aber er sieht ihm ähnlich.“ Er selbst sagte immer wieder: „Ich bin es.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Die einen … Andere
  rationale: Die beiden Vorkommen unterscheiden zwei Gruppen. Die deutsche Gegenüberstellung „die einen … andere“ gibt diesen distributiven Kontrast natürlich wieder.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der Imperfekt zeichnet die laufende Diskussion; im Deutschen kann das Präteritum diesen erzählerischen Hintergrund idiomatisch ausdrücken, ohne ein schwerfälliges „waren am Sagen“.
- source_word: ὅτι
  choice: durch Doppelpunkt und Anführungszeichen wiedergegeben
  rationale: ὅτι leitet hier direkte Rede ein; deutsche Zeichensetzung gibt diese Funktion natürlich wieder.
- source_word: Οὗτός ἐστιν
  choice: Er ist es
  rationale: Die knappe Identifizierung wird im Deutschen idiomatisch wiedergegeben. „Dieser ist es“ wäre näher an der Form, klingt hier jedoch unnötig steif.
- source_word: Οὐχί, ἀλλὰ
  choice: Nein, … nur
  rationale: Οὐχί weist die Identifizierung entschieden zurück; ἀλλά führt die korrigierende Aussage ein. In natürlichem Deutsch bringt „nur“ den Gegensatz zwischen Identität und bloßer Ähnlichkeit klar zum Ausdruck.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: er sieht ihm ähnlich
  rationale: ὅμοιος mit Dativ bezeichnet Ähnlichkeit. Im Zusammenhang mit der visuellen Wiedererkennung ist „sieht ihm ähnlich“ die natürliche deutsche Formulierung.
- source_word: ἐκεῖνος
  choice: Er selbst
  rationale: Das Pronomen hebt den Mann gegenüber den diskutierenden Gruppen hervor. „Er selbst“ macht diesen Wechsel zum Betroffenen als Sprecher klar, ohne das substantivische „jener“ nachzuahmen.
- source_word: ἔλεγεν
  choice: sagte immer wieder
  rationale: Der Imperfekt kann hier sein wiederholtes Beharren während der Diskussion ausdrücken. „Immer wieder“ vermittelt diese iterative Nuance verständlich.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Kontext identifiziert sich der geheilte Mann als die Person, über die gesprochen wird. „Ich bin es“ bewahrt die Form mit „sein“ und ist zugleich natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe von Ἐγώ εἰμι im johanneischen Kontext
  choice: Ich bin es
  alternative: Ich bin
  rationale: Hier spricht der geheilte Mann und bestätigt seine Identität. Der unmittelbare Kontext verlangt keine absolute oder christologische Deutung; zugleich bleibt die griechische Form mit dem Verb „sein“ in der idiomatischen deutschen Selbstidentifikation erkennbar.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp und lebendig; der fortlaufende beziehungsweise wiederholte Charakter des letzten ἔλεγεν wird ausdrücklich wiedergegeben.
