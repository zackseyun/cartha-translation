  verdict: approve
  source_fidelity: Die Übersetzung gibt εἰς κρίμα treffend mit „Zum Gericht“ wieder und bewahrt die durch ἵνα ausgedrückte Ziel-/Ergebnisrelation. „bin ich in diese Welt gekommen“ entspricht εἰς τὸν κόσμον τοῦτον ἦλθον. Die beiden substantivierten Partizipgruppen und die resultative Aussage τυφλοὶ γένωνται sind vollständig und parallel wiedergegeben.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Wiederholung „die, die“ ist zwar leicht markiert, aber natürlich genug und dient sinnvoll der engen rhetorischen Parallele sowie der Offenheit zwischen körperlichem und übertragenem Sehen.
  terminology: „Gericht“ ist für κρίμα hier angemessen und weniger verengend als „Verurteilung“. „Welt“, „sehen“ und „blind werden“ sind terminologisch konsistent und bewahren die johanneische Bildsprache. Die Fußnote bietet die legitime alternative Artikellosigkeit/Lesart „zu einem Gericht“ und erklärt sie ohne dogmatische Festlegung.
