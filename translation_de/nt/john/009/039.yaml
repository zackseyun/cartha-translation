id: JHN.9.39
reference: John 9:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: de
  text: 'Und Jesus sagte: „Zum Gericht bin ich in diese Welt gekommen, damit die, die nicht sehen, sehen und die, die sehen, blind werden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zu einem Gericht“. Das griechische εἰς κρίμα kann die richterliche Wirkung von Jesu Kommen hervorheben und meint nicht nur Verurteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: Gericht
  rationale: „Gericht“ bewahrt die knappe, richterliche Bedeutung und umfasst hier sowohl das Sehendwerden als auch das Blindwerden; „Verurteilung“ wäre zu eng.
- source_word: κόσμον
  choice: Welt
  rationale: „Welt“ ist die natürliche und im Johannesevangelium etablierte Wiedergabe und bezeichnet hier die menschliche Welt, in die Jesus gekommen ist.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: die, die nicht sehen / die, die sehen
  rationale: Die substantivierten Partizipien werden parallel wiedergegeben, sodass die wörtliche und die übertragene Bedeutung des Sehens offenbleiben.
- source_word: βλέπωσιν
  choice: sehen
  rationale: Die schlichte Wiedergabe bewahrt sowohl das körperliche als auch das geistliche Sehen; „sehend werden“ würde die Formulierung stärker ausdeuten.
- source_word: τυφλοὶ γένωνται
  choice: blind werden
  rationale: Die Wendung erhält den resultativen Sinn von γίνομαι und die scharfe Umkehrung des Ausspruchs.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: bin ich in diese Welt gekommen
  rationale: Diese Formulierung entspricht natürlichem modernem Deutsch und bewahrt die johanneische Rede vom Kommen Jesu in die Welt.
theological_decisions:
- issue: Verhältnis zu Johannes 3,17 („nicht, um die Welt zu richten“)
  choice: κρίμα wird ohne harmonisierende Abschwächung mit „Gericht“ wiedergegeben.
  alternative: „Entscheidung“, „Scheidung“ oder „Verurteilung“
  rationale: 'Der Vers beschreibt die richterliche Wirkung von Jesu Kommen: Vermeintliche Blindheit und vermeintliches Sehen werden umgekehrt. „Gericht“ erhält die Spannung zu anderen Aussagen des Johannesevangeliums, ohne sie aufzulösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung „die, die …“ ist bewusst beibehalten, um die rhetorische Gegenüberstellung und die Doppeldeutigkeit von körperlichem und geistlichem Sehen zu erhalten. Der Fußnotenmarker steht nach dem vollständigen Zitat, da er die Wendung „Zum Gericht“ erläutert.
