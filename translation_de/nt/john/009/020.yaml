  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: de
  text: 'Da antworteten seine Eltern und sagten: „Wir wissen, dass dies unser Sohn ist und dass er blind geboren wurde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die erzählerische und folgernde Fortsetzung des vorausgehenden Verhörs; „Da“ ist in diesem Zusammenhang natürlich und würdevoll.
- source_word: γονεῖς
  choice: Eltern
  rationale: Das Substantiv im Plural bezeichnet gemeinsam Vater und Mutter; „Eltern“ ist die genaue und idiomatische Entsprechung.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: antworteten ... und sagten
  rationale: Beide Verben werden beibehalten, um die johanneische Ausdrucksweise und die Struktur der Vorlage abzubilden.
- source_word: Οἴδαμεν
  choice: Wir wissen
  rationale: Gibt die ausdrücklich behauptete Kenntnis der Eltern direkt und natürlich wieder.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: dies unser Sohn ist
  rationale: Bewahrt die demonstrative Identifizierung und entspricht natürlichem deutschem Satzbau im dass-Satz.
- source_word: τυφλὸς ἐγεννήθη
  choice: blind geboren wurde
  rationale: Gibt das prädikative Adjektiv und den passiven Geburtsausdruck direkt und idiomatisch wieder.
