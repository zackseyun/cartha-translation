  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: de
  text: 'Er antwortete und sagte: »Und wer ist er, Herr[a], damit ich an ihn glaube?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische κύριε kann hier auch einfach eine respektvolle Anrede sein (etwa: »mein Herr«), nicht nur die Anrede »Herr« im stärkeren Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Er antwortete und sagte
  rationale: Die Formulierung gibt den griechischen erzählerischen Doppelausdruck eng wieder; ἐκεῖνος wird im Deutschen durch das bereits im Verb enthaltene Pronomen natürlich aufgenommen.
- source_word: Καὶ τίς ἐστιν
  choice: Und wer ist er
  rationale: Das einleitende καί bleibt als anschließendes »Und« erhalten; die Frage folgt der griechischen Struktur, ohne den Bezug durch eine zusätzliche Bezeichnung festzulegen.
- source_word: κύριε
  choice: Herr
  rationale: »Herr« bewahrt die übliche Wiedergabe von κύριε und zugleich die im Kontext bestehende Möglichkeit, dass es sich lediglich um eine respektvolle Anrede handelt; diese Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: damit ich an ihn glaube
  rationale: »Damit« gibt den Ziel- bzw. Absichtssinn von ἵνα mit Konjunktiv wieder; »an ihn glauben« ist die klare und etablierte Entsprechung für πιστεύειν εἰς αὐτόν.
theological_decisions:
- issue: Bedeutung der Anrede κύριε vor dem ausdrücklichen Glaubensbekenntnis des Geheilten
  choice: Herr
  alternative: mein Herr / respektvolle Anrede
  rationale: κύριε kann sowohl eine ehrerbietige Anrede als auch die Anrede »Herr« im stärkeren christologischen Sinn sein. Der Haupttext wahrt die traditionelle Entsprechung, während die Fußnote verhindert, dass der Erkenntnisstand des Mannes an dieser Stelle vorschnell festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Doppelausdruck »antwortete und sagte« sowie das anschließende »Und« werden bewusst beibehalten; die Mehrdeutigkeit der Anrede wird nicht aufgelöst.
