    issue: Unbegründetes Plusquamperfekt bei Jesu Handlungen
    rationale: ἐποίησεν und ἀνέῳξεν sind Aoriste und stehen innerhalb der Zeitangabe „an dem Tag, als“. Das deutsche Plusquamperfekt lässt die Handlungen gegenüber dem genannten Sabbattag als bereits abgeschlossen erscheinen, obwohl der Vers gerade sagt, dass sie an diesem Tag geschahen.
  - severity: low
    issue: Fußnote nennt den „Blindgeborenen“
    rationale: Diese Bezeichnung stammt aus dem weiteren Kontext, nicht aus diesem Vers. Die Fußnote kann die konkrete Heilungsausdrucksweise erläutern, ohne zusätzliche Kontextinformation einzutragen.
