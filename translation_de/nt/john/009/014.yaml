  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: de
  text: Es war Sabbat an dem Tag, als Jesus den Schlamm machte und ihm die Augen öffnete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Schlamm“ ist auch „Lehm“ möglich. Wörtlich: „öffnete ihm die Augen“; eine konkrete Ausdrucksweise für die Heilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: Sabbat
  rationale: Das artikellose Prädikatsnomen bezeichnet den Sabbattag. Im Deutschen ist „Es war Sabbat“ natürlich und bewahrt die kalendarische Aussage ohne einen im Ausgangstext fehlenden Artikel zu erzwingen.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: an dem Tag, an dem
  rationale: Die relative Zeitangabe wird idiomatisch und zugleich eng am griechischen Satzbau wiedergegeben.
- source_word: πηλόν
  choice: Schlamm
  rationale: Im Erzählzusammenhang ist damit die aus Speichel und Erde hergestellte feuchte Masse gemeint; „Schlamm“ ist im modernen Deutsch natürlicher als „Lehm“.
- source_word: ἐποίησεν
  choice: gemacht hatte
  rationale: ποιέω bezeichnet hier schlicht das Herstellen des Schlamms. Das Plusquamperfekt macht im Deutschen deutlich, dass diese Handlungen dem nun berichteten Sabbatstreit vorausgingen.
- source_word: ἀνέῳξεν
  choice: geöffnet hatte
  rationale: Die konkrete johanneische Ausdrucksweise wird beibehalten und nicht deutend durch „das Augenlicht gegeben“ ersetzt.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: ihm die Augen
  rationale: Der deutsche possessive Dativ gibt die griechische Zugehörigkeitsangabe natürlich wieder und behält den körperlich-konkreten Bezug bei.
- source_word: δὲ
  choice: unmarkiert
  rationale: δέ leitet hier mild zum erläuternden zeitlichen Hintergrund über. Eine ausdrückliche Wiedergabe mit „nun“ oder „aber“ wäre im Deutschen unnötig oder zu stark.
theological_decisions:
- issue: Sabbatbezug der Heilung Jesu
  choice: Die Zeitangabe wird sachlich wiedergegeben, ohne die folgende Auseinandersetzung über das Sabbatgebot vorwegzunehmen.
  alternative: Die Aussage durch „ausgerechnet an einem Sabbat“ oder einen Hinweis auf einen Gesetzesverstoß deutend zuspitzen.
  rationale: Der Vers nennt zunächst nur den erzählerisch bedeutsamen Zeitpunkt. Ob und wie Jesu Handeln am Sabbat zu bewerten ist, bleibt der anschließenden Kontroverse überlassen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bewahrt die konkrete Rede von Schlamm und geöffneten Augen; das Plusquamperfekt sorgt für eine natürliche zeitliche Einordnung.
