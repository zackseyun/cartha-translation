  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: de
  text: Solange ich in der Welt bin, bin ich das Licht der Welt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Solange
  rationale: Im Zusammenhang mit dem durativen Präsens ὦ bezeichnet ὅταν hier den Zeitraum, in dem Jesus in der Welt ist. „Solange“ gibt diesen zeitlichen Sinn natürlich wieder, ohne das im Deutschen missverständliche „wann immer“.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ ist die geläufige und sachlich passende Entsprechung für κόσμος; die Wiederholung wird wie im Griechischen bewahrt.
- source_word: φῶς ... τοῦ κόσμου
  choice: das Licht der Welt
  rationale: Die metaphorische Prädikatswendung wird eng am griechischen Wortlaut und in ihrer theologischen Offenheit wiedergegeben.
theological_decisions:
- issue: Zeitliche Aussage von ὅταν ἐν τῷ κόσμῳ ὦ
  choice: Solange ich in der Welt bin
  alternative: Wann immer ich in der Welt bin
  rationale: Das durative Verständnis passt zum unmittelbaren Aussagezusammenhang und vermeidet die mögliche Vorstellung wiederholter Aufenthalte Jesu in der Welt. Es legt jedoch nicht genauer fest, in welchem theologischen Sinn seine Gegenwart in der Welt begrenzt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelität und die Wiederholung von „Welt“ bleiben erhalten.
