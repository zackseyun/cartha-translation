source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: de
  text: Als Jesus vorbeiging, sah er einen Mann, der von Geburt an blind war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Im Vorübergehen sah er einen Mann, der von Geburt an blind war.“ Das griechische Partizip schildert Jesus als unterwegs, als er den Mann sah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Als
  rationale: Der griechische Anschluss wird zusammen mit dem Partizip παράγων in einen natürlichen deutschen temporalen Nebensatz gefasst; der fortlaufende Erzählzusammenhang bleibt gewahrt.
- source_word: παράγων
  choice: Jesus weiterging
  rationale: Das präsentische Partizip bezeichnet die gleichzeitig andauernde Begleithandlung. Der im Kontext eindeutige Handelnde wird im Deutschen zur Klarheit als Jesus benannt.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Wiedergabe mit „sehen“ entspricht dem Aorist von ὁράω, ohne die zusätzliche Nuance von „bemerken“ einzutragen.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Obwohl ἄνθρωπος allgemein „Mensch“ bedeuten kann, handelt es sich im Erzählzusammenhang um eine bestimmte männliche Person.
- source_word: τυφλὸν ἐκ γενετῆς
  choice: der von Geburt an blind war
  rationale: Der Relativsatz ist im modernen Deutschen natürlich und gibt klar wieder, dass die Blindheit seit der Geburt bestand.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἄνθρωπον
  choice: einen Mann
  alternative: einen Menschen
  rationale: Der Begriff kann an sich geschlechtsübergreifend sein, bezeichnet hier aber nach dem weiteren Kontext einen konkreten Mann; die Übersetzung wahrt diese kontextuelle Bestimmung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Eigenname „Jesus“ verdeutlicht das im griechischen Kontext nur mitgedachte Subjekt; die Fußnote bewahrt die knappere partizipiale Alternative.
