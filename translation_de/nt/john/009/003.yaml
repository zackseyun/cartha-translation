id: JHN.9.3
reference: John 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: de
  text: 'Jesus antwortete: »Weder dieser Mann hat gesündigt noch seine Eltern. Sondern an ihm sollen die Werke Gottes offenbar werden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sondern damit die Werke Gottes in ihm offenbar werden«. Der griechische Satz ist verkürzt formuliert. »An ihm« kann in diesem Zusammenhang auch im Sinn von »durch ihn« verstanden werden.'
    reason: Bewahrt die Ellipse sowie die mögliche lokale beziehungsweise instrumentale Nuance von ἐν αὐτῷ.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche deutsche Wiedergabe der narrativen Dialogformel.
- source_word: Οὔτε ... οὔτε
  choice: Weder ... noch
  rationale: Gibt die korrelative und nachdrückliche Verneinung beider vorgeschlagenen Möglichkeiten idiomatisch wieder.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Macht den aus dem Kontext eindeutigen Bezug auf den Blindgeborenen natürlich deutlich.
- source_word: ἥμαρτεν
  choice: hat gesündigt
  rationale: Das deutsche Perfekt ist in gegenwärtiger Standardsprache eine direkte und natürliche Wiedergabe des Aorists in dieser Aussage.
- source_word: γονεῖς
  choice: Eltern
  rationale: Präzise und geläufige Entsprechung.
- source_word: ἀλλ’ ἵνα
  choice: Vielmehr sollen
  rationale: Die elliptische griechische Gegenüberstellung wird im Deutschen verständlich, ohne das nicht ausdrücklich vorhandene »dies geschah« einzufügen; »sollen« wahrt die Zielrichtung des ἵνα-Satzes.
- source_word: φανερωθῇ
  choice: sichtbar werden
  rationale: Gibt den passiven Sinn des Offenbar- beziehungsweise Erkennbarwerdens in natürlichem Deutsch wieder.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: die Werke Gottes
  rationale: Bewahrt die johanneische Ausdrucksweise und die Genitivbeziehung.
- source_word: ἐν αὐτῷ
  choice: an ihm
  rationale: Im Deutschen bezeichnet »an ihm« natürlich den Menschen als Ort beziehungsweise Gegenstand, an dem Gottes Werke sichtbar werden, ohne eindeutig auf ein bloß instrumentales »durch ihn« festzulegen.
theological_decisions:
- issue: Umfang der Verneinung eines Zusammenhangs zwischen Sünde und Blindheit
  choice: Die Aussage wird auf diesen Mann und seine Eltern in diesem konkreten Fall bezogen.
  alternative: Eine verallgemeinernde Paraphrase, nach der Leiden niemals mit persönlicher oder elterlicher Sünde zusammenhängt.
  rationale: Jesus verneint die beiden von den Jüngern für diesen Fall vorgeschlagenen Erklärungen; der Vers formuliert keine ausdrückliche universale Lehre über jedes Leiden.
- issue: Zweck oder Folge bei ἵνα
  choice: Zielgerichtet mit »sollen ... sichtbar werden« übersetzen.
  alternative: 'Rein konsekutiv: »sodass ... sichtbar wurden«; oder durch Umstellung jeden Zweckbezug vermeiden.'
  rationale: ἵνα mit dem Konjunktiv legt hier zunächst eine Zweckrichtung nahe. Die Übersetzung bewahrt diese Spannung, ohne ausdrücklich zu ergänzen, Gott habe die Blindheit verursacht.
- issue: Elliptischer Anschluss von ἀλλ’ ἵνα
  choice: Keine Ergänzung wie »dies geschah« im Haupttext; stattdessen ein natürlicher elliptischer Neuansatz mit »Vielmehr«.
  alternative: »Sondern dies geschah, damit ...« oder eine Anbindung an den folgenden Vers.
  rationale: Im Griechischen fehlt ein ausdrückliches Verb wie »geschah«. Die deutsche Form soll verständlich bleiben, aber die interpretierende Ergänzung nicht als Quelltext ausgeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vielmehr sollen« vermeidet sowohl die im Deutschen harte wörtliche Ellipse »sondern damit« als auch die nicht ausdrücklich im Griechischen stehende Ergänzung »dies geschah«. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterungsbedürftigen Schlussaussage.
