  rationale: Die Revision stellt die positive Aussage mit »Sondern« enger der vorhergehenden Verneinung gegenüber und verwendet »offenbar werden« als nähere Wiedergabe von φανερωθῇ. Sie ergänzt weder »dies geschah« noch eine Aussage darüber, wodurch die Blindheit verursacht wurde, und bewahrt damit die Ellipse sowie die theologische Spannung des griechischen Textes.
