  source_fidelity: Die Verneinung von Sünde bei dem Mann und seinen Eltern wird zutreffend wiedergegeben. »An ihm« wahrt die lokale, zugleich möglicherweise instrumentale Offenheit von ἐν αὐτῷ. Die Zweckrichtung von ἀλλ’ ἵνα sollte jedoch im Haupttext klarer hervortreten als mit dem bloß kontrastierenden »Vielmehr«.
  naturalness: Der Satz ist insgesamt modernes, würdevolles Standarddeutsch. Die Stellung »Sondern an ihm sollen ...« ist als deutsche Wiedergabe der griechischen Ellipse idiomatisch und knüpft die positive Aussage unmittelbarer an die vorherige Verneinung an.
  terminology: »Werke Gottes«, »gesündigt«, »Eltern« und »offenbar werden« sind treffend und bewahren die johanneische Ausdrucksweise. »Offenbar werden« bildet φανερωθῇ genauer ab als »sichtbar werden«.
