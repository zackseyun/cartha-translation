    rationale: »Vielmehr« gibt zwar ἀλλά wieder, markiert aber die mit ἵνα ausgedrückte Zielrichtung nicht ausdrücklich. Eine mit »Sondern« angeschlossene Sollensform ist für die Ellipse natürlich und erhält den zielgerichteten Sinn.
  - severity: low
