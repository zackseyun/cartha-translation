  source_fidelity: Die Wiedergabe von πῶς δὲ νῦν βλέπει als „wie er jetzt sehen kann“ verschiebt den Präsensausdruck βλέπει („er sieht“) in Richtung Fähigkeit („sehen kann“). Der Kontext lässt zwar die wiedererlangte Sehfähigkeit erkennen, doch der griechische Wortlaut behauptet hier schlicht sein gegenwärtiges Sehen. Die übrigen Satzglieder sind inhaltlich treffend wiedergegeben.
  naturalness: „Wie er jetzt sieht“ ist modernes, natürliches Standarddeutsch und bewahrt den knappen Aussagecharakter. „Er wird selbst für sich sprechen“ ist verständlich und im verhörartigen Kontext angemessen.
  terminology: „Alt genug“ gibt ἡλικίαν ἔχει idiomatisch wieder, ohne eine moderne rechtliche Altersgrenze festzulegen. „Die Augen geöffnet“ bewahrt die erzählerische Ausdrucksweise. Die Fußnote kennzeichnet die mögliche praktisch-modale Nuance des Futurs, ohne sie in den Haupttext einzutragen.
