source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: de
  text: Doch wie er jetzt sieht, wissen wir nicht; oder wer ihm die Augen geöffnet hat, wissen wir nicht. Fragt ihn! Er ist alt genug. Er wird selbst für sich sprechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er kann selbst für sich sprechen.“ Das griechische Futur kann hier praktisch ausdrücken, dass er selbst antworten kann.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Doch wie er jetzt sehen kann
  rationale: πῶς fragt nach dem Wie, δέ setzt leicht ab, und νῦν bezeichnet den jetzigen Zustand. Im Deutschen gibt „wie er jetzt sehen kann“ den gemeinten Übergang vom Blindsein zum Sehen natürlicher wieder als das missverständliche „wie er jetzt sieht“, ohne die Ursache näher festzulegen.
- source_word: οὐκ οἴδαμεν
  choice: wissen wir nicht
  rationale: Die einfache und zweimal wiederholte Wiedergabe bewahrt den nachdrücklichen, aussageartigen Stil der Antwort.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: oder wer ihm die Augen geöffnet hat
  rationale: Die Formulierung erhält sowohl die alternative Frage mit ἤ als auch das im Erzählzusammenhang wichtige Bild vom Öffnen der Augen.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Fragt ihn!
  rationale: Der Aoristimperativ im Plural wird direkt und idiomatisch wiedergegeben; die Mehrzahl der Angesprochenen ist in der deutschen Verbform sichtbar.
- source_word: ἡλικίαν ἔχει
  choice: Er ist alt genug
  rationale: Im Zusammenhang bezeichnet die Wendung ein Alter, in dem der Sohn selbstständig Auskunft geben kann. „Alt genug“ ist natürlich und vermeidet die Eintragung einer bestimmten modernen Grenze der Volljährigkeit.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Er wird selbst für sich sprechen
  rationale: Die Wiedergabe erhält das Futur λαλήσει, die Betonung durch αὐτός und den Sinn eigenständiger Auskunft beziehungsweise Aussage. Eine mögliche modale Nuance des Futurs wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von ἡλικίαν ἔχει im Zusammenhang
  choice: Der Mann ist alt genug, um selbstständig zu antworten.
  alternative: Die Wendung bezeichnet allgemein Reife oder, hier weniger wahrscheinlich, körperliche Größe.
  rationale: Die Eltern verweisen die Fragenden an ihren Sohn und entziehen sich damit einer eigenen Erklärung. Der Zusammenhang verlangt daher vor allem die Fähigkeit und Verantwortung zur selbstständigen Aussage, nicht eine Aussage über seine Körpergröße.
- issue: Aussagekraft von αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Er wird in eigener Sache selbst sprechen.
  alternative: Das Futur kann praktisch auch heißen, dass er selbst sprechen beziehungsweise Auskunft geben kann.
  rationale: Die Übersetzung bewahrt zunächst die grammatische Zukunftsform und den Nachdruck auf αὐτός, ohne den verhörähnlichen Zusammenhang mit modernen rechtlichen Fachbegriffen zu überladen. Die mögliche modale Kraft bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Aufforderung bleibt knapp; die zweimalige Aussage „wissen wir nicht“ bewahrt den Nachdruck des griechischen Textes. Keine konfessionell geprägte Terminologie.
