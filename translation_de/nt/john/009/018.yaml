source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: de
  text: Daher glaubten die Juden[a] nicht, dass er blind gewesen war und sein Augenlicht erlangt hatte, bis sie die Eltern dessen riefen, der sein Augenlicht erlangt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Je nach Verständnis des Ausdrucks im Zusammenhang auch: »die jüdischen Verantwortlichen« oder »die Judäer«.'
    reason: Der Ausdruck οἱ Ἰουδαῖοι kann im Johannesevangelium je nach Kontext unterschiedlich bezogen sein. Die Fußnote bewahrt diese Mehrdeutigkeit und beugt einer pauschalen Lesart vor.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: glaubten ... nicht
  rationale: Mit dem durch ὅτι eingeleiteten Inhaltssatz bezeichnet πιστεύω hier das Für-wahr-Halten einer Aussage; „glaubten nicht“ ist die natürliche deutsche Entsprechung.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Formulierung gibt den griechischen Ausdruck formal wieder, ohne seinen Bezug vorschnell auf die jüdischen führenden Männer oder die Judäer einzuengen. Der mögliche Kontextbezug wird in einer Fußnote erläutert.
- source_word: περὶ αὐτοῦ
  choice: von ihm
  rationale: περί mit Genitiv bedeutet hier „über/von ihm“; in Verbindung mit „glauben“ und dem folgenden Inhaltssatz ist „von ihm nicht glauben, dass ...“ idiomatisches, gehobenes Deutsch.
- source_word: ἦν τυφλὸς
  choice: blind gewesen war
  rationale: Das Plusquamperfekt verdeutlicht aus der Erzählperspektive, dass die Blindheit dem nun bestrittenen Sehendwerden vorausging.
- source_word: ἀνέβλεψεν
  choice: sehend geworden war
  rationale: ἀναβλέπω bezeichnet im Heilungszusammenhang das Erlangen des Sehvermögens. „Sehend geworden“ vermeidet die mögliche Andeutung von „wieder sehen“, er habe früher schon einmal sehen können.
- source_word: ἕως ὅτου
  choice: bis
  rationale: Die Wendung bezeichnet die zeitliche Grenze des Unglaubens beziehungsweise den Zeitpunkt des nächsten Untersuchungsschritts.
- source_word: ἐφώνησαν
  choice: riefen
  rationale: φωνέω kann „rufen“ oder „herbeirufen“ bedeuten. „Riefen“ bleibt nah am Wortlaut und passt zum Kontext der Befragung.
- source_word: τοὺς γονεῖς αὐτοῦ
  choice: die Eltern dessen
  rationale: Die Verbindung wahrt den Bezug der Eltern auf den anschließend durch das substantivierte Partizip bezeichneten Geheilten.
- source_word: τοῦ ἀναβλέψαντος
  choice: dessen ..., der sehend geworden war
  rationale: Der Relativsatz bildet das substantivierte Partizip ab und identifiziert den Betroffenen durch das Erlangen seines Sehvermögens, ohne ein zusätzliches Substantiv einzuführen.
theological_decisions:
- issue: Bezug und Bedeutungsumfang von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die jüdischen führenden Männer; die Judäer
  rationale: Der Haupttext bewahrt die ausdrückliche, jedoch kontextuell mehrdeutige Bezeichnung des griechischen Textes. Die Fußnote macht deutlich, dass hier aufgrund der Untersuchungsszene eine begrenzte Gruppe gemeint sein kann, ohne diese Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ formaler Satzführung. Die Wiederholung „sehend geworden war“ folgt der Wiederaufnahme von ἀναβλέπω im griechischen Text und hält die Identifizierung des Geheilten ausdrücklich fest.
