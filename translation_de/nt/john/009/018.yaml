    rationale: Die griechische Wiederholung von ἀναβλέπω soll erkennbar bleiben, muss aber nicht mit einer im Deutschen ungewohnten Prädikativkonstruktion wiedergegeben werden. Die wiederholte Formulierung „sein Augenlicht erlangt hatte“ erhält die Identifizierung durch die Heilung.
