  naturalness: „Darum glaubten die Juden von ihm nicht, dass …“ ist im modernen Standarddeutsch unnatürlich. Eine direkte Wiedergabe des Inhaltssatzes mit „glaubten daher nicht, dass“ ist klar und wahrt den gemeinten Sachverhalt. „Sehend geworden war“ ist verständlich, aber merklich sperrig; „sein Augenlicht erlangt hatte“ ist in diesem Heilungskontext natürlich und behauptet nicht, dass der Mann zuvor sehen konnte.
  terminology: „die Juden“ bewahrt die griechische Bezeichnung οἱ Ἰουδαῖοι ohne kontextuelle Einengung. Die Fußnote soll die möglichen engeren Bezüge sprachlich natürlich benennen, ohne sie als Entscheidung des Haupttexts auszugeben.
