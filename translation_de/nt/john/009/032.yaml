  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: de
  text: Seit Menschengedenken hat man noch nie davon gehört, dass jemand einem von Geburt an Blinden die Augen geöffnet hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seit Beginn der Welt hat man noch nie davon gehört …“'
    reason: Lexikalische Alternative für ἐκ τοῦ αἰῶνος; diese Wiedergabe macht den möglichen Bezug auf den Weltanfang ausdrücklich.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Von jeher
  rationale: Die adverbiale Wendung bezeichnet die gesamte erinnerte Vergangenheit. „Von jeher“ bewahrt den historischen Sinn, ohne die metaphysisch stärkere Bedeutung „von Ewigkeit her“ einzutragen.
- source_word: οὐκ ἠκούσθη
  choice: hat man noch nie davon gehört
  rationale: Die unpersönliche deutsche Form gibt den idiomatischen Passivgedanken eines nie berichteten Präzedenzfalls natürlich wieder.
- source_word: ὅτι
  choice: dass
  rationale: Leitet wie im Griechischen den Inhalt dessen ein, wovon nie gehört wurde.
- source_word: ἠνέῳξέν
  choice: geöffnet hat
  rationale: Gibt ἀνοίγω in der festen Verbindung mit „Augen“ unmittelbar wieder; „geheilt“ wäre interpretierender.
- source_word: τις
  choice: jemand
  rationale: Entspricht dem indefiniten Subjekt und passt zur umfassenden negativen Aussage.
- source_word: ὀφθαλμοὺς
  choice: die Augen
  rationale: Die im Deutschen natürliche Wendung lautet „jemandem die Augen öffnen“.
- source_word: τυφλοῦ γεγεννημένου
  choice: einem von Geburt an Blinden
  rationale: Die substantivierte Form ist im Deutschen natürlich, wahrt den maskulinen Singular und bringt den Zustand seit der Geburt klar zum Ausdruck.
theological_decisions:
- issue: Zeitlicher Umfang von ἐκ τοῦ αἰῶνος
  choice: 'historische Redewendung: „von jeher“'
  alternative: „seit Beginn der Welt“ oder „von Ewigkeit her“
  rationale: Der Sprecher behauptet, dass es in der gesamten menschlichen Erinnerung keinen solchen Präzedenzfall gab; der Text verlangt keine metaphysische Aussage über die Ewigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die Konstruktion mit „davon gehört, dass“ ist idiomatisch; „einem … Blinden die Augen geöffnet“ bildet den griechischen Satzbau natürlich ab.
