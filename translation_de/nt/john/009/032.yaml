  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Aussage zuverlässig wieder: ἐκ τοῦ αἰῶνος bezeichnet den gesamten Bereich menschlicher Erinnerung bzw. Erfahrung; οὐκ ἠκούσθη wird idiomatisch als fehlender Bericht über einen Präzedenzfall wiedergegeben; und „jemand einem von Geburt an Blinden die Augen geöffnet hat“ entspricht dem griechischen Inhalt ohne die Heilung zusätzlich zu interpretieren.'
  naturalness: „Von jeher hat man noch nie“ ist im heutigen Standarddeutsch stilistisch gespannt, weil „von jeher“ gewöhnlich eine durchgehende positive Geltung ausdrückt. „Seit Menschengedenken hat man noch nie … gehört“ ist eine etablierte, natürliche Wendung für die beabsichtigte historische Reichweite und den rhetorischen Nachdruck.
  terminology: „von Geburt an Blinden“ ist sachlich und idiomatisch; die Formulierung wahrt, dass die Blindheit seit der Geburt besteht. „Die Augen geöffnet“ hält die Bild- und Wundensprache von ἀνοίγω bei und vermeidet die stärker deutende Wiedergabe „geheilt“.
