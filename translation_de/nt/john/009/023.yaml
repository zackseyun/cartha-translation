  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: de
  text: 'Deshalb sagten seine Eltern: „Er ist alt genug; fragt ihn.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Die Wendung verweist begründend auf die in Vers 22 genannte Furcht der Eltern zurück; „Deshalb“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seine Eltern
  rationale: Die Wortgruppe bezeichnet gemeinsam Vater und Mutter des Mannes; „seine Eltern“ ist die genaue und idiomatische deutsche Entsprechung.
- source_word: εἶπαν
  choice: sagten
  rationale: Das gewöhnliche Verb des Sprechens wird ohne unnötige Präzisierung wiedergegeben.
- source_word: Ἡλικίαν ἔχει
  choice: Er ist alt genug
  rationale: Die griechische Wendung besagt im Kontext, dass der Mann das nötige Alter besitzt, um selbst Auskunft zu geben. „Er ist alt genug“ ist im modernen Deutsch natürlicher als „Er ist mündig“, ohne die rechtliche oder soziale Nuance zu überbestimmen.
- source_word: αὐτὸν
  choice: ihn selbst
  rationale: Das Pronomen verweist betont auf den ehemals Blinden als denjenigen, den man unmittelbar befragen soll; „selbst“ macht diese Hervorhebung im Deutschen deutlich.
- source_word: ἐπερωτήσατε
  choice: fragt
  rationale: Der Aoristimperativ fordert dazu auf, die Frage direkt an ihn zu richten. „Fragt“ ist natürlich und wahrt den Plural des griechischen Imperativs.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung aus Vers 21 bleibt sinngemäß erhalten; die direkte Rede klingt natürlich, ohne den Wortlaut durch eine ausdrückliche rechtliche Deutung wie „volljährig“ festzulegen.
