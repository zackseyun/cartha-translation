base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: de
  text: Sie bringen den Mann, der früher blind gewesen war, zu den Pharisäern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Sie bringen
  rationale: Das historische Präsens wird beibehalten. Es ist im Deutschen erzählerisch verständlich und vergegenwärtigt das Geschehen, ohne einen Wechsel ins Präteritum zu erzwingen.
- source_word: αὐτὸν
  choice: den Mann
  rationale: Das Pronomen wird zusammen mit der substantivisch gebrauchten folgenden Beschreibung natürlich als „den Mann“ wiedergegeben.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: zu den Pharisäern
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu einer Personengruppe; „zu“ gibt dies direkt und idiomatisch wieder.
- source_word: Φαρισαίους
  choice: Pharisäern
  rationale: Dies ist die etablierte deutsche Bezeichnung der Gruppe.
- source_word: τόν ποτε τυφλόν
  choice: den Mann, der früher blind gewesen war
  rationale: Die substantivierte Wendung bezeichnet den zuvor Blinden. Der Relativsatz klingt im modernen Deutsch natürlich und macht deutlich, dass seine Blindheit der Vergangenheit angehört.
- source_word: ποτε
  choice: früher
  rationale: In diesem Zusammenhang bezeichnet ποτε einen früheren Zustand und hebt den Gegensatz zur gegenwärtigen Heilung hervor.
- source_word: τυφλόν
  choice: blind
  rationale: Direkte Wiedergabe des Adjektivs für seinen früheren Zustand.
