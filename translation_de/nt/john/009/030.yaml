id: JHN.9.30
reference: John 9:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: de
  text: 'Der Mann antwortete ihnen: „Darin liegt ja das Erstaunliche: Ihr wisst nicht, woher er kommt, und doch hat er mir die Augen geöffnet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Der Mann antwortete ihnen
  rationale: Die im Griechischen übliche Verbindung „antwortete und sagte zu ihnen“ wird in natürlichem modernem Deutsch knapp wiedergegeben, ohne den Inhalt oder die Dialogfunktion zu verändern.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Darin liegt ja das Erstaunliche
  rationale: „Darin liegt“ bewahrt den demonstrativen Bezug von ἐν τούτῳ. „Das Erstaunliche“ gibt θαυμαστόν passend zum ironisch zugespitzten Ton wieder; „ja“ vermittelt die begründende und hervorhebende Funktion von γάρ idiomatisch.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: Ihr wisst nicht
  rationale: Das ausdrücklich gesetzte ὑμεῖς bleibt als „ihr“ erhalten; οἴδατε bezeichnet hier Wissen um Jesu Herkunft.
- source_word: πόθεν ἐστίν
  choice: woher er kommt
  rationale: Diese idiomatische deutsche Wendung bezeichnet Herkunft und entspricht dem Sinn von πόθεν ἐστίν, ohne die Art dieser Herkunft näher festzulegen.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: und doch hat er mir die Augen geöffnet
  rationale: „Und doch“ bringt den im Zusammenhang klaren Gegensatz zum Ausdruck. „Die Augen geöffnet“ bewahrt sowohl den unmittelbaren Bezug auf die körperliche Heilung als auch die mögliche weitergehende Resonanz im Johannesevangelium.
theological_decisions:
- issue: Mögliche übertragene Bedeutung von „die Augen geöffnet“ im johanneischen Zusammenhang
  choice: Die konkrete Formulierung der Heilung beibehalten, ohne geistliche Erleuchtung ausdrücklich zu ergänzen
  alternative: Die Wendung so formulieren, dass geistliche Erkenntnis in den Vordergrund tritt
  rationale: Unmittelbar spricht der geheilte Mann von seinem körperlichen Sehen. Die umfassendere Spannung zwischen Sehen und Blindheit soll aus dem Zusammenhang hervorgehen und nicht in den Wortlaut hineingedeutet werden.
- issue: Die Herkunft Jesu in πόθεν ἐστίν
  choice: Mit „woher er kommt“ offen wiedergeben
  alternative: Die Aussage ausdrücklich auf Jesu irdische oder himmlische Herkunft beziehen
  rationale: Die Formulierung lässt die für Johannes charakteristische Spannung um Jesu Herkunft bestehen und legt nicht fest, welche Herkunftsebene die Sprecher erfassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede klingt pointiert und leicht ironisch, ohne umgangssprachlich oder unnötig interpretierend zu werden.
