source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: de
  text: 'Sie antworteten ihm: »Du bist ganz in Sünden geboren, und du belehrst uns?« Dann warfen sie ihn hinaus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie warfen ihn hinaus“ kann zunächst bedeuten, dass sie ihn aus ihrer Gegenwart entfernten; im Zusammenhang kann zugleich ein Ausschluss aus der Synagogengemeinschaft mitgemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Die griechische Doppelwendung wird im natürlichen modernen Deutsch idiomatisch zusammengezogen; der Antwortcharakter bleibt vollständig erhalten.
- source_word: Ἐν ἁμαρτίαις
  choice: in Sünden
  rationale: Der Plural des griechischen Textes bleibt erhalten und bewahrt die scharfe, pauschale Anschuldigung, ohne sie als bestimmte Lehre über Sünde und Blindheit auszudeuten.
- source_word: ἐγεννήθης ὅλος
  choice: bist ganz … geboren
  rationale: „Ganz“ gibt ὅλος knapp und natürlich wieder und bezieht die Anschuldigung auf die gesamte Verfassung des Mannes von Geburt an.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: und du willst uns belehren?
  rationale: Das betonte σὺ und der empörte rhetorische Ton werden durch „du willst uns“ wiedergegeben; „belehren“ passt zur herablassenden Zurückweisung.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: Dann warfen sie ihn hinaus
  rationale: Die deutsche Wendung gibt die nachdrückliche und feindselige Entfernung natürlich wieder, ohne über den unmittelbaren Wortlaut hinaus eine formelle Synagogenausschließung festzulegen.
theological_decisions:
- issue: Bedeutung der Anschuldigung, der Mann sei „in Sünden geboren“
  choice: Die feindselige Anschuldigung bleibt im Plural und ohne nähere dogmatische Erklärung stehen.
  alternative: „Du bist ganz in Sünde geboren“ oder „Du bist als durch und durch sündiger Mensch geboren“
  rationale: Der Text sagt nicht ausdrücklich, ob eigene Sünde, die Sünde der Eltern, Erbsünde oder eine aus der Blindheit abgeleitete Schuldvorstellung gemeint ist. Diese Spannung darf die Übersetzung nicht auflösen.
- issue: Reichweite des Hinauswerfens
  choice: Die unmittelbare Vertreibung wird übersetzt; eine mögliche Ausstoßung aus der Synagogengemeinschaft wird nur als Kontextmöglichkeit angemerkt.
  alternative: „Dann schlossen sie ihn aus der Synagoge aus.“
  rationale: ἐξέβαλον αὐτὸν ἔξω bezeichnet sicher ein Hinauswerfen, legt aber für sich allein die institutionelle Form der Maßnahme nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt scharf und herablassend. Die ungewöhnliche Mehrzahl „in Sünden“ wurde bewusst quellengetreu bewahrt; die narrative Doppelwendung „antworteten und sagten“ dagegen zugunsten natürlichen Deutschen zusammengezogen.
