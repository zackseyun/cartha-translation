review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die pluralische Anschuldigung „in Sünden“, die Verstärkung durch ὅλος und die konkrete Vertreibung zuverlässig wieder. „Du willst uns belehren?“ verschiebt jedoch das präsentische διδάσκεις („du belehrst/unterrichtest uns“) zu einer Aussage über Absicht oder Anspruch. Die rhetorische Empörung lässt sich ohne diese Bedeutungsverschiebung ausdrücken.
  naturalness: Modernes Standarddeutsch und der scharfe Ton sind insgesamt gelungen. „Du bist ganz in Sünden geboren“ ist bewusst ungewöhnlich, aber als wörtlich-nahe Wiedergabe der beleidigenden pluralischen Form vertretbar. „Und du belehrst uns?“ ist als empörte Gegenfrage natürlich und genauer als „willst“.
  terminology: „Sünden“ bewahrt den griechischen Plural und legt keine bestimmte Deutung des Zusammenhangs von Sünde und Blindheit fest. „hinauswerfen“ gibt ἐξέβαλον … ἔξω idiomatisch und mit angemessener Schärfe wieder. Die Fußnote wahrt zutreffend die Offenheit zwischen bloßer Entfernung und möglichem Synagogenausschluss.
  issues:
  - severity: medium
    issue: „du willst uns belehren?“
    rationale: Das deutsche Modalverb „willst“ fügt eine Nuance des Wollens bzw. Anmaßens hinzu, während διδάσκεις als Präsensindikativ aussagt, dass der Mann sie gerade belehrt. Die Rhetorik des griechischen Fragesatzes wird mit „du belehrst uns?“ ausreichend wiedergegeben.
