id: JHN.9.33
reference: John 9:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: de
  text: Wenn dieser Mann nicht von Gott wäre, könnte er nichts tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ μὴ
  choice: Wenn … nicht
  rationale: Die zweiteilige Form gibt die bedingende Struktur des Griechischen im Deutschen transparent und natürlich wieder; „wenn nicht“ passt hier besser als das komprimierte „es sei denn“.
- source_word: ἦν
  choice: wäre
  rationale: Der Konjunktiv II bringt zusammen mit dem Bedingungssatz den als irreal dargestellten Gedanken idiomatisch zum Ausdruck.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Das Demonstrativpronomen bezeichnet im Kontext Jesus als den bereits besprochenen männlichen Menschen; „dieser Mann“ ist klar und natürlich.
- source_word: παρὰ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv bezeichnet hier Herkunft beziehungsweise Ursprung. „Von Gott“ wahrt die Breite der Formulierung, ohne sie als „von Gott gesandt“ auszudeuten.
- source_word: οὐκ ἠδύνατο
  choice: könnte … nicht
  rationale: Der Konjunktiv II gibt die Unfähigkeit innerhalb des irrealen Bedingungsgefüges im Deutschen treffend wieder.
- source_word: ποιεῖν
  choice: tun
  rationale: Das breite Verb ποιέω wird durch „tun“ schlicht und kontextgerecht wiedergegeben, ohne die gemeinten Werke ausdrücklich als Wunder zu interpretieren.
- source_word: οὐδέν
  choice: nichts
  rationale: „Nichts“ bewahrt die umfassende und nachdrückliche Verneinung des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von „von Gott“ in Bezug auf Jesus
  choice: Die quellensprachliche Wendung wird ohne Erweiterung als „von Gott“ beibehalten.
  alternative: „von Gott gesandt“ oder „von Gott bevollmächtigt“
  rationale: Der Ausdruck kann göttliche Herkunft beziehungsweise Bevollmächtigung nahelegen, legt sich hier aber nicht ausdrücklich auf eine technische Aussage über Sendung oder Wesen fest. Die offene Formulierung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der irreale Bedingungssatz wird idiomatisch durch „wäre … könnte“ ausgedrückt.
