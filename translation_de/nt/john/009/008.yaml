  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: de
  text: 'Da sagten die Nachbarn und die, die ihn früher als Bettler gesehen hatten: »Ist das nicht der Mann, der dasaß und bettelte?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die narrative Folge aus dem vorausgehenden Geschehen; „Da“ ist im Deutschen natürlich und wahrt den erzählerischen Anschluss.
- source_word: γείτονες
  choice: Nachbarn
  rationale: Direkte und idiomatische Wiedergabe für die Menschen, die in seiner Nähe wohnten.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: die ihn früher … gesehen hatten
  rationale: Gibt den rückblickenden Zeitbezug von τὸ πρότερον und das Wahrnehmen beziehungsweise Wiedererkennen natürlich wieder.
- source_word: ὅτι προσαίτης ἦν
  choice: als Bettler
  rationale: Im Zusammenhang bezeichnet die Wendung den früheren Zustand, in dem sie ihn kannten. „Als Bettler“ vermeidet eine unnötige kausale Festlegung von ὅτι.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der deutsche Erzählstil gibt den imperfektiven Vorgang idiomatisch mit dem Präteritum wieder; mehrere Sprecher und der Kontext lassen das Gespräch erkennen.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ist das nicht der Mann
  rationale: Bewahrt die Frageform, die eine bejahende Antwort erwartet, in natürlichem modernem Deutsch.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: der immer dasaß und bettelte
  rationale: Die substantivierten Partizipien kennzeichnen seine gewohnheitsmäßige frühere Tätigkeit. „immer“ drückt diesen habituellen Sinn aus, ohne den Satz unnatürlich wörtlich zu gestalten.
