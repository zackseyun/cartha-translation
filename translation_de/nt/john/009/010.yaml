  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: de
  text: 'Da fragten sie ihn: „Wie wurden dir die Augen geöffnet?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: fragten
  rationale: Der Imperfekt bezeichnet hier die fortlaufende Erzählhandlung; im natürlichen deutschen Erzählstil wird er idiomatisch mit dem Präteritum wiedergegeben. Wegen der folgenden direkten Frage ist „fragten“ präziser und natürlicher als „sagten zu ihm“.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt die aus dem Vorangehenden folgende Reaktion erzählerisch weiter. „Da“ verbindet Folgerung und zeitlichen Fortgang natürlich, ohne das stärkere argumentative „daher“ zu erzwingen.
- source_word: αὐτῷ
  choice: ihn
  rationale: Das griechische Dativobjekt zum Sprechen beziehungsweise Fragen wird bei deutschem „fragen“ idiomatisch als Akkusativobjekt ausgedrückt.
- source_word: Πῶς
  choice: Wie
  rationale: Direkte und idiomatische Wiedergabe des Frageadverbs nach der Art und Weise.
- source_word: ἠνεῴχθησάν
  choice: sind … geöffnet worden
  rationale: Das Perfektpassiv ist im Deutschen eine natürliche Wiedergabe des griechischen Aoristpassivs, dessen Ergebnis für die gegenwärtige Befragung relevant ist. Das Passiv bleibt ausdrücklich erhalten und lässt den Handelnden ungenannt.
- source_word: σου οἱ ὀφθαλμοί
  choice: deine Augen
  rationale: Natürliche deutsche Wiedergabe der griechischen Possessivkonstruktion; der Artikel wird im Deutschen durch das Possessivwort ersetzt.
theological_decisions:
- issue: Ungenannter Handelnder beim Öffnen der Augen
  choice: 'Passiv ohne ausdrückliches Agens: „sind … geöffnet worden“'
  alternative: Aktivische Umschreibung wie „Wie kannst du jetzt sehen?“
  rationale: Der griechische Text nennt nicht ausdrücklich, wer die Augen geöffnet hat. Das Passiv bewahrt diese Offenheit sowie die mögliche theologische Resonanz, ohne sie auszudeuten.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; das deutsche Perfekt klingt in einer gegenwartsbezogenen Frage natürlicher als das Präteritumspassiv.
