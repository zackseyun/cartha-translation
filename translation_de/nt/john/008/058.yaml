  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Amen, amen, ich sage euch: Bevor Abraham ins Dasein kam[a], bin ich[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bevor Abraham geboren wurde“. Das griechische Verb ist weiter gefasst und kann „werden“, „entstehen“ oder „ins Dasein kommen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „Ich bin schon gewesen“. Wörtlich steht im Griechischen die Präsensform „bin ich“, die hier mitsamt ihrem möglichen theologischen Anklang beibehalten wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Jesus sagte zu ihnen
  rationale: Gibt die schlichte narrative Einleitung direkt und in natürlichem Deutsch wieder.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die markante doppelte Bekräftigungsformel Jesu. „Wahrlich, wahrlich“ wäre ebenfalls möglich, wirkt im heutigen Deutsch jedoch altertümlicher.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Entspricht der feierlichen johanneischen Wendung eng und idiomatisch.
- source_word: πρὶν
  choice: bevor
  rationale: Die geläufige deutsche temporale Konjunktion gibt das zeitliche Verhältnis klar wieder.
- source_word: Ἀβραὰμ γενέσθαι
  choice: Abraham ins Dasein kam
  rationale: Gibt das umfassendere γίνομαι wieder, ohne es auf Abrahams Geburt zu verengen, und lässt den Gegensatz zu „bin ich“ hervortreten.
- source_word: ἐγὼ εἰμί
  choice: bin ich
  rationale: Bewahrt die griechische Präsensform und ihre auffällige absolute Aussage. Die deutsche Wortstellung folgt natürlich auf den vorangestellten Bevor-Satz.
theological_decisions:
- issue: Wiedergabe von ἐγὼ εἰμί in einem christologisch bedeutsamen Zusammenhang
  choice: bin ich
  alternative: bin ich schon gewesen; existierte ich bereits
  rationale: Die Präsensform bleibt erhalten, sodass sowohl die Aussage über Jesu Dasein vor Abraham als auch ein möglicher Anklang an göttliche Selbstbezeichnung sichtbar bleiben. Eine glättende Vergangenheitsform würde diese Spannung vorzeitig auf bloße Präexistenz reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Amen, amen“ bewahrt die charakteristische feierliche Formel ohne das heute altertümlich wirkende „wahrlich“. Die ungewöhnliche Spannung zwischen „ins Dasein kam“ und „bin ich“ wird bewusst nicht geglättet.
