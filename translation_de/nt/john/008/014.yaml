id: JHN.8.14
reference: John 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: de
  text: 'Jesus antwortete und sagte zu ihnen: »Auch wenn ich über mich selbst Zeugnis ablege[a], ist mein Zeugnis wahr; denn ich weiß, woher ich gekommen bin und wohin ich gehe. Ihr aber wisst nicht, woher ich komme oder wohin ich gehe.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über mich selbst Zeugnis gebe“.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften haben „und wohin ich gehe“ statt „oder wohin ich gehe“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς
  choice: antwortete und sagte zu ihnen
  rationale: Bewahrt die johanneische Verbindung beider Verben und gibt αὐτοῖς ausdrücklich wieder, ohne den Satz im Deutschen unverständlich zu machen.
- source_word: Κἂν
  choice: Auch wenn
  rationale: 'Gibt die konzessive Kraft von καὶ ἐάν natürlich wieder: Jesus räumt den angenommenen Fall ein, ohne die Wahrheit seines Zeugnisses preiszugeben.'
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: über mich selbst Zeugnis ablege
  rationale: Bewahrt sowohl das Zeugnismotiv von μαρτυρέω als auch die schlichte Bedeutung von περί mit Genitiv; eine ausschließlich juristische Deutung wird vermieden.
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  choice: ist mein Zeugnis wahr
  rationale: „Wahr“ entspricht ἀληθής und lässt neben der möglichen forensischen Dimension den umfassenderen johanneischen Wahrheitsbegriff bestehen.
- source_word: ὅτι οἶδα
  choice: denn ich weiß
  rationale: „Denn“ führt den ausdrücklich genannten Grund für die Wahrheit des Zeugnisses in natürlichem, gehobenem Deutsch ein.
- source_word: πόθεν ἦλθον
  choice: woher ich gekommen bin
  rationale: Das Perfekt ist im Deutschen die natürliche rückblickende Wiedergabe des griechischen Aorists und hebt Jesu Herkunft hervor, ohne sie im Vers näher auszudeuten.
- source_word: ποῦ ὑπάγω
  choice: wohin ich gehe
  rationale: Gibt die gegenwärtig ausgerichtete Bewegung des Präsens ὑπάγω knapp und idiomatisch wieder.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Ihr aber wisst nicht
  rationale: Das vorangestellte „Ihr“ bewahrt die ausdrückliche Betonung des griechischen Pronomens; „aber“ markiert den Gegensatz zu Jesu Wissen.
- source_word: πόθεν ἔρχομαι
  choice: woher ich komme
  rationale: Das Präsens wird gegenüber dem vorausgehenden rückblickenden ἦλθον als deutsches Präsens erhalten.
theological_decisions:
- issue: Wesen und Begründung von Jesu Selbstzeugnis
  choice: Jesu Zeugnis wird als wahr bezeichnet, weil er seine Herkunft und sein Ziel kennt.
  alternative: Eine enger forensische Wiedergabe als rechtlich gültige Aussage oder eine ausdrücklich metaphysische Ausdeutung seiner himmlischen Herkunft.
  rationale: Der Wortlaut verbindet die Wahrheit des Zeugnisses mit Jesu einzigartigem Wissen. Die Übersetzung bewahrt diese Aussage, ohne eine spätere dogmatische Formulierung in den Vers einzutragen.
- issue: Bezug von Jesu Herkunft und Ziel
  choice: Die räumlich offenen Ausdrücke „woher“ und „wohin“ bleiben stehen.
  alternative: Explizite Ergänzungen wie „vom Himmel“ und „zum Vater“.
  rationale: Solche Bezüge sind im weiteren Johannesevangelium naheliegend, werden in diesem Satz selbst jedoch nicht ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische Doppelwendung „antwortete und sagte“ bleibt wegen der markanten griechischen Form erhalten. Das durchgehende Zeugnismotiv wird mit „Zeugnis ablegen/Zeugnis“ wiedergegeben; Herkunft und Ziel bleiben bewusst unausgedeutet.
