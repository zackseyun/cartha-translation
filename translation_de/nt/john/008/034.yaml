id: JHN.8.34
reference: John 8:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Amen, amen, ich sage euch: Jeder, der Sünde tut[a], ist ein Sklave der Sünde[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder, der sündigt“. Die griechische Form kann im Zusammenhang auch ein fortdauerndes oder kennzeichnendes Tun bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „Diener“ bedeuten; hier hebt „Sklave“ die Bindung und Unfreiheit gegenüber der Sünde hervor.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus antwortete ihnen
  rationale: Natürliche deutsche Erzählform, die sowohl den antwortenden Charakter des Verbs als auch die im Griechischen genannten Adressaten bewahrt.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die doppelte, für das Johannesevangelium kennzeichnende Bekräftigungsformel wird unverändert und transparent bewahrt; die Wiederholung trägt ihren feierlichen Nachdruck.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Formnahe und im Deutschen idiomatische Wiedergabe der feierlichen Redeeinleitung.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: jeder, der Sünde tut
  rationale: Gibt das substantivierte Präsenspartizip knapp und formnah wieder, ohne dessen Aspekt zwingend als Gewohnheit festzulegen. Der Artikel vor ἁμαρτίαν bezeichnet hier nicht notwendig eine bestimmte Einzelsünde und wird im Deutschen idiomatisch nicht ausgedrückt.
- source_word: δοῦλος
  choice: Sklave
  rationale: Die Aussage handelt von Unfreiheit und Unterworfenheit; „Sklave“ bewahrt diese starke Metapher deutlicher als „Diener“.
- source_word: τῆς ἁμαρτίας
  choice: der Sünde
  rationale: Der Genitiv wird direkt wiedergegeben und bezeichnet die Sünde als die Macht, der der Mensch gehört beziehungsweise untersteht.
theological_decisions:
- issue: Aspekt von ποιῶν und Reichweite der Aussage über das Sündigen
  choice: „jeder, der Sünde tut“
  alternative: „jeder, der fortgesetzt sündigt“ oder „jeder, der Sünde praktiziert“
  rationale: Das Präsenspartizip kann im Zusammenhang eine fortdauernde oder kennzeichnende Tätigkeit nahelegen, kodiert aber nicht für sich allein zwingend Gewohnheitsmäßigkeit. Die Hauptfassung lässt die Spannung bestehen; die Fußnote nennt die kontextuell mögliche Nuance.
- issue: Stärke der δοῦλος-Metapher
  choice: „Sklave der Sünde“
  alternative: „Diener der Sünde“
  rationale: Im Zusammenhang von Freiheit und Unfreiheit ist der Status der Gebundenheit zentral. „Sklave“ bringt diesen Sinn deutlich zum Ausdruck, ohne die Metapher abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle johanneische Formel „Amen, amen“ bleibt wegen ihres Wiedererkennungswerts und ihrer feierlichen Prägnanz erhalten. Der Satzbau ist eng am Griechischen orientiert, bleibt aber natürlich verständlich.
