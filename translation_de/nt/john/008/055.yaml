id: JHN.8.55
reference: John 8:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: de
  text: Doch ihr habt ihn nicht erkannt[a]; ich aber kenne ihn. Wenn ich sagen würde, dass ich ihn nicht kenne, wäre ich ein Lügner wie ihr. Aber ich kenne ihn und bewahre sein Wort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr kennt ihn nicht“. Die griechische Verbform kann den fortdauernden Zustand fehlender wirklicher Erkenntnis hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: „Bewahren“ kann hier auch „sich an etwas halten“, „befolgen“ oder „festhalten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: habt … nicht erkannt
  rationale: Die Perfektform bezeichnet hier einen bis in die Gegenwart reichenden Mangel an wirklicher Erkenntnis. Das deutsche Perfekt erhält den Rückblick, ohne den gegenwärtigen Zustand auszuschließen.
- source_word: οἶδα
  choice: kenne
  rationale: οἶδα ist der Form nach ein Perfekt, fungiert aber als präsentisches Zustandsverb. „Kenne“ gibt den Sinn im Deutschen natürlich wieder und wahrt den Gegensatz zu ἐγνώκατε.
- source_word: κἂν εἴπω
  choice: Wenn ich sagen würde
  rationale: Die Formulierung leitet eine hypothetische Aussage ein. Der deutsche Konditional macht deutlich, dass Jesus einen nur angenommenen Fall beschreibt.
- source_word: ἔσομαι
  choice: wäre ich
  rationale: Obwohl das griechische Verb im Futur steht, verlangt der hypothetische Bedingungssatz im natürlichen Deutschen den Konjunktiv „wäre“.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: ein Lügner wie ihr
  rationale: Die direkte Vergleichsform bewahrt die Schärfe der Konfrontation und gibt ψεύστης als Personenbezeichnung wieder.
- source_word: τὸν λόγον αὐτοῦ
  choice: sein Wort
  rationale: „Sein Wort“ wahrt die johanneische Ausdrucksweise und lässt sowohl Gottes konkrete Rede als auch seine offenbarte Botschaft im Blick.
- source_word: τηρῶ
  choice: bewahre
  rationale: τηρέω umfasst bewahren, festhalten und befolgen. „Bewahre“ erhält diese Bedeutungsbreite besser als eine ausschließlich auf Gehorsam verengte Wiedergabe.
- source_word: καὶ … δὲ
  choice: Doch … aber
  rationale: Die Kontrastpartikeln werden im Deutschen so wiedergegeben, dass der scharfe Gegensatz zwischen den Angesprochenen und Jesus klar hervortritt.
theological_decisions:
- issue: Jesu einzigartige Gotteserkenntnis im Gegensatz zu der seiner Gegner
  choice: Die Aussage wird unmittelbar als Anspruch wahrer Gotteserkenntnis und treuen Festhaltens an Gottes Wort wiedergegeben.
  alternative: Die Aussage durch einen ausdrücklichen Hinweis auf Jesu göttliche Sohnschaft erweitern oder „kennen“ zu bloßer Bekanntschaft abschwächen.
  rationale: Der Vers selbst stellt Jesu Erkenntnis Gottes und sein Bewahren von Gottes Wort der fehlenden Erkenntnis seiner Gegner gegenüber. Diese Spannung bleibt erhalten, ohne über den Wortlaut hinaus eine dogmatische Erklärung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die Schärfe von „ein Lügner wie ihr“ bleiben ungemildert. „Sein Wort bewahren“ erhält bewusst die für Johannes charakteristische Ausdrucksweise.
