id: JHN.8.24
reference: John 8:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: de
  text: 'Darum habe ich euch gesagt: Ihr werdet in euren Sünden sterben. Denn wenn ihr nicht glaubt, dass ich es bin[a], werdet ihr in euren Sünden sterben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass ich bin“. Im Griechischen folgt auf „ich bin“ kein ausdrückliches Prädikat; die Formulierung kann im Johannesevangelium einen tieferen Anklang haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Darum habe ich euch gesagt
  rationale: οὖν stellt eine folgernde Verbindung zum vorausgehenden Zusammenhang her; „darum“ gibt diese Funktion natürlich wieder. Das Perfekt „habe gesagt“ ist im Deutschen eine idiomatische Erzählform für den griechischen Aorist und bewahrt den Bezug zu Jesu vorheriger Aussage.
- source_word: ἀποθανεῖσθε
  choice: ihr werdet sterben
  rationale: Die schlichte Zukunftsform entspricht dem griechischen Verb, ohne die zusätzliche Deutung „umkommen“ einzutragen.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: in euren Sünden
  rationale: Der Plural „Sünden“ wird bewahrt. ἐν bezeichnet hier den Zustand beziehungsweise Bereich, in dem sie beim Sterben verbleiben.
- source_word: ἐὰν γὰρ μὴ
  choice: Denn wenn ihr nicht
  rationale: „Denn“ gibt γάρ als Begründung wieder; „wenn ... nicht“ bildet die negative Bedingung von ἐὰν μή im Deutschen klar und unmittelbar ab.
- source_word: πιστεύσητε
  choice: glaubt
  rationale: „Glauben“ ist die übliche und kontextgerechte Wiedergabe von πιστεύω im Johannesevangelium; Vertrauen ist mitgemeint, muss aber nicht ausdrücklich ergänzt werden.
- source_word: ὅτι ἐγώ εἰμι
  choice: dass ich es bin
  rationale: Im Deutschen ist „ich es bin“ eine natürliche Selbstidentifikation, ohne einen konkreten Prädikatsinhalt wie „der Messias“ einzusetzen. Da der griechische Wortlaut absolut „ich bin“ lautet und tiefere Resonanzen tragen kann, wird dies in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von ἐγώ εἰμι ohne ausdrückliches Prädikat
  choice: dass ich es bin
  alternative: dass ich bin
  rationale: „Ich es bin“ ist im modernen Deutschen idiomatisch als Selbstidentifikation, fügt aber keine bestimmte Amts- oder Wesensbezeichnung ein. Die wörtlichere absolute Form „ich bin“ bleibt in der Fußnote sichtbar, damit eine mögliche Anspielung auf göttliche Selbstoffenbarung nicht ausgeschlossen oder als zwingend festgelegt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die eindringliche Wiederholung des Satzes über das Sterben in den Sünden bleiben erhalten. Der Doppelpunkt nach „gesagt“ macht den Inhalt der vorausgehenden Aussage klar, ohne ein zusätzliches Bindewort einzufügen.
