id: JHN.8.17
reference: John 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: de
  text: Und auch in eurem Gesetz steht geschrieben, dass das Zeugnis zweier Menschen wahr ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass das Zeugnis zweier Menschen als gültig gilt.“ Im rechtlichen Zusammenhang kann „wahr“ die Anerkennung eines Zeugnisses als gültig oder verlässlich einschließen.'
    reason: Semantische Alternative zur rechtlich-forensischen Nuance von ἀληθής.
lexical_decisions:
- source_word: νόμῳ
  choice: Gesetz
  rationale: Der Ausdruck bezeichnet hier die jüdische gesetzliche beziehungsweise schriftgemäße Autorität, auf die Jesus sich beruft. „Gesetz“ bewahrt diesen Sinn, ohne die Wendung ausdrücklich auf einen engeren Kanontitel festzulegen.
- source_word: ὑμετέρῳ
  choice: eurem
  rationale: Das Possessivpronomen wird ausdrücklich beibehalten und wahrt die rhetorische Distanz in Jesu Anrede, ohne sie durch „eurem eigenen“ zu verschärfen.
- source_word: γέγραπται
  choice: steht geschrieben
  rationale: Die geläufige deutsche Zitierformel gibt das griechische Perfekt idiomatisch wieder und lässt den fortdauernden Geltungsanspruch erkennen.
- source_word: δύο ἀνθρώπων
  choice: zweier Menschen
  rationale: ἄνθρωπος bezeichnet Menschen beziehungsweise menschliche Zeugen. „Zweier Menschen“ ist formal nah am Griechischen, im Deutschen natürlich und vermeidet eine unnötige Beschränkung auf männliche Zeugen; die juristische Bedeutung wird in der Fußnote erläutert.
- source_word: μαρτυρία
  choice: Zeugnis
  rationale: „Zeugnis“ entspricht dem juridischen Zusammenhang und lässt sich natürlich mit dem Genitiv „zweier Menschen“ verbinden.
- source_word: ἀληθής
  choice: wahr
  rationale: „Wahr“ gibt die Grundbedeutung direkt wieder; dass das Zeugnis im rechtlichen Sinn als gültig beziehungsweise verlässlich gilt, bleibt als Kontextbedeutung erhalten und wird in der Fußnote kenntlich gemacht.
- source_word: καὶ ... δὲ
  choice: Und auch
  rationale: Die Verbindung gibt sowohl den Anschluss als auch die leichte Hervorhebung wieder. „Sogar“ wäre im Deutschen stärker als hier erforderlich.
theological_decisions:
- issue: Rhetorische Wirkung von „eurem Gesetz“
  choice: „eurem Gesetz“ wird als direkte Anrede beibehalten.
  alternative: „dem Gesetz“ oder „eurem eigenen Gesetz“
  rationale: Das Griechische enthält ausdrücklich das Possessivpronomen. Die Übersetzung bewahrt die Spannung der Rede, ohne daraus abzuleiten, Jesus lehne das Gesetz ab, und ohne den Ton durch „eigenen“ zu verschärfen.
- issue: Bedeutung von ἀνθρώπων in der Rechtsformel
  choice: „Menschen“ im Haupttext
  alternative: „Männer“ oder „Personen“
  rationale: ἀνθρώπων ist hier Teil einer allgemeinen Rechtsformel über menschliche Zeugen. „Menschen“ wahrt im modernen Deutschen den repräsentativen Sinn, während „Männer“ leicht als ausdrücklich männlich-exklusiv verstanden würde.
- issue: Wahrheit oder rechtliche Gültigkeit des Zeugnisses
  choice: „wahr“ im Haupttext
  alternative: „gültig“ oder „glaubwürdig“
  rationale: ἀληθής bedeutet unmittelbar „wahr“, trägt im Zusammenhang aber eine rechtlich-forensische Nuance. Die Übersetzung bewahrt die Ausdrucksweise und löst die Spannung zwischen Wahrheit und rechtlicher Anerkennung nicht einseitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Schriftformel „steht geschrieben“ bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser klar und natürlich.
