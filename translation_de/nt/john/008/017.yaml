  source_fidelity: 'Der Text gibt sämtliche Elemente des griechischen Satzes zuverlässig wieder: die anschließende und leicht hervorhebende Verbindung („Und auch“), die direkte rhetorische Anrede („eurem Gesetz“), die Schriftformel im Perfekt („steht geschrieben“) sowie die Aussage über das Zeugnis zweier Menschen. „Wahr“ bewahrt die Grundbedeutung von ἀληθής, ohne die forensische Nuance im Haupttext unzulässig einseitig zu „gültig“ umzudeuten.'
  naturalness: „Und auch in eurem Gesetz steht geschrieben, dass das Zeugnis zweier Menschen wahr ist“ ist verständliches, modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die traditionelle Formel „steht geschrieben“ ist idiomatisch und hier stilistisch passend.
  terminology: „Gesetz“, „Zeugnis“ und „wahr“ sind terminologisch treffend. „Zweier Menschen“ gibt ἀνθρώπων im heutigen Deutschen natürlich und ohne eine im griechischen Ausdruck nicht zwingend vorgegebene männliche Exklusivität wieder. Die Fußnote erläutert die rechtliche Implikation vorsichtig, ohne den griechischen Wortlaut zu ersetzen.
