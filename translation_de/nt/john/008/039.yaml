source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: de
  text: 'Sie antworteten ihm: »Abraham ist unser Vater.« Jesus sagt zu ihnen: »Wenn ihr Abrahams Kinder wärt, würdet ihr die Werke Abrahams tun.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht: »Wenn ihr Abrahams Kinder seid, würdet ihr die Werke Abrahams tun.« Die griechische Formulierung verbindet »ihr seid« im Präsens mit einem Verb im Imperfekt. Sie kann deshalb als gemischter Bedingungssatz verstanden werden; die Übersetzung gibt die im Zusammenhang naheliegende irreale Aussage wieder.'
    reason: Die Fußnote wahrt die auffällige griechische Tempusfolge, ohne das Imperfekt fälschlich als Aufforderung wiederzugeben.
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Die griechische Doppelwendung aus »antworten« und »sagen« ist eine semitisch geprägte Erzählformel. Im heutigen Deutsch gibt »sie antworteten ihm« ihren vollen kommunikativen Sinn natürlich und ohne unnötige Schwerfälligkeit wieder.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Abraham ist unser Vater
  rationale: Die Wortstellung ist im Deutschen natürlich und bewahrt die nachdrückliche Berufung auf Abraham als Vater.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus sagt zu ihnen
  rationale: Das historische Präsens λέγει wird als Präsens wiedergegeben und erhält so die erzählerische Unmittelbarkeit des griechischen Textes.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: Abrahams Kinder
  rationale: τέκνα bezeichnet geschlechtsübergreifend Kinder beziehungsweise Nachkommen und stellt hier die beanspruchte Beziehung zu Abraham heraus.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: die Werke Abrahams
  rationale: »Werke« bewahrt den konkreten ethischen Sinn von ἔργα und den johanneischen Gegensatz zwischen behaupteter Abstammung und tatsächlichem Handeln.
- source_word: Εἰ … ἐστε … ἐποιεῖτε
  choice: Wenn ihr … wärt, würdet ihr … tun
  rationale: Die Verbindung des formal präsentischen ἐστε mit dem Imperfekt ἐποιεῖτε lässt sich als irrealer Bedingungssatz verstehen. Der deutsche Konjunktiv gibt diese naheliegende Deutung klar wieder; die abweichende formnähere Möglichkeit wird in der Fußnote offengehalten.
theological_decisions:
- issue: Art der Kindschaft Abrahams in Jesu Antwort
  choice: Die Beziehungssprache bleibt wörtlich, während Jesu Gegenüberstellung von beanspruchter Kindschaft und entsprechenden Werken erhalten bleibt.
  alternative: Die Aussage ausdrücklich als Leugnung der leiblichen Abstammung oder ausschließlich als Definition geistlicher Kindschaft deuten.
  rationale: Der Vers stellt den Anspruch, Abraham sei ihr Vater, ihrem Handeln gegenüber. Er entfaltet jedoch für sich genommen keine vollständige Lehre über leibliche und geistliche Abstammung; diese Spannung soll die Übersetzung nicht vorzeitig auflösen.
- issue: Wirklichkeitsgrad des Bedingungssatzes
  choice: 'Als irrealer Bedingungssatz: »Wenn ihr … wärt, würdet ihr … tun.«'
  alternative: 'Als offene beziehungsweise direkte Bedingung und Aufforderung: »Wenn ihr … seid, dann tut die Werke Abrahams.«'
  rationale: Das Imperfekt ἐποιεῖτε stützt im Zusammenhang die irreale Lesart, während ἐστε formal im Präsens steht. Wegen dieser Spannung wird die alternative Deutung in einer Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; »Werke« bleibt als prägnanter johanneischer Schlüsselbegriff erhalten. Das historische Präsens wird bewusst beibehalten.
