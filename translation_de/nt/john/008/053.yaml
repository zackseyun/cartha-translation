  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: de
  text: Du bist doch nicht etwa größer als unser Vater Abraham, der gestorben ist? Auch die Propheten sind gestorben. Für wen gibst du dich aus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer behauptest du zu sein?“ Die griechische Wendung fragt danach, welche Identität oder welchen Rang jemand für sich beansprucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Du bist doch nicht etwa
  rationale: Die Formulierung gibt die mit μή signalisierte Erwartung einer verneinenden Antwort als natürliche, konfrontative deutsche Frage wieder.
- source_word: μείζων
  choice: größer
  rationale: „Größer“ bewahrt die offene Bedeutung hinsichtlich Rang, Bedeutung und Autorität, ohne sie enger auszulegen.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: als unser Vater Abraham
  rationale: Der Genitiv nach dem Komparativ wird mit „als“ wiedergegeben; „unser Vater Abraham“ bewahrt den Anspruch auf Abraham als Stammvater und die ehrende Bezeichnung.
- source_word: ὅστις ἀπέθανεν
  choice: der gestorben ist
  rationale: Das Perfekt im Deutschen bezeichnet Abrahams eingetretenen Tod idiomatisch und klar; es fügt keine Aussage über den Zeitpunkt hinzu.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Auch die Propheten sind gestorben
  rationale: '„Auch“ stellt die parallele Begründung heraus: Nicht nur Abraham, sondern ebenso die Propheten starben.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Für wen hältst du dich eigentlich?
  rationale: 'Die idiomatische deutsche Wendung gibt den vorwurfsvollen Sinn wieder: Welche Stellung oder Identität beanspruchst du für dich? „Eigentlich“ verstärkt hier den konfrontativen Ton, ohne eine bestimmte Antwort vorzugeben.'
theological_decisions:
- issue: Rhetorische Infragestellung von Jesu Rang gegenüber Abraham und den Propheten
  choice: Die Frage wird als feindselige rhetorische Zurückweisung formuliert, die eine verneinende Antwort erwartet.
  alternative: 'Neutraler: „Bist du größer als unser Vater Abraham?“'
  rationale: Das griechische μή markiert die erwartete Verneinung. Die Übersetzung bewahrt die Spannung um Jesu Identität und Autorität, ohne sie innerhalb dieses Verses theologisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, aber deutlich konfrontativem Ton. Die rhetorische Erwartung der ersten Frage und die offene Spannung um Jesu Identität bleiben erhalten.
