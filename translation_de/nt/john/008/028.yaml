  source_fidelity: 'Der deutsche Text gibt die Satzglieder und Beziehungen des griechischen Textes zuverlässig wieder: οὖν als diskursfortführendes „Da“, die konkrete Zukunftsbedingung mit „Wenn“, ὑψώσητε mit dem mehrdeutigen „erhöht“, γνώσεσθε als künftiges Erkennen sowie die Abhängigkeit Jesu vom Vater. „Ich es bin“ stellt eine idiomatische deutsche Wiedergabe der elliptischen Formel ἐγώ εἰμι dar, ohne deren möglichen Referenten festzulegen.'
  naturalness: Der Vers ist flüssiges, modernes und zugleich würdevolles Standarddeutsch. Die Verbindung „sondern genau das sage, was der Vater mich gelehrt hat“ ist idiomatisch und vermittelt die Entsprechung von Lehre des Vaters und Jesu Reden klar.
  terminology: „Menschensohn“ und „der Vater“ entsprechen dem etablierten biblischen deutschen Sprachgebrauch. „Erhöht“ bewahrt die johanneische Spannung zwischen physischem Emporheben und Erhöhung/Verherrlichung. Die Fußnoten sind korrekt an den jeweils erläuterten Ausdrücken verankert. Der englische Audit-Trail weist zwar offenbar vertauschte Fußnotenanker auf, doch die deutsche Fassung übernimmt diesen Fehler nicht.
