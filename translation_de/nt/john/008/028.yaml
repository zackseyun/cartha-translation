id: JHN.8.28
reference: John 8:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: de
  text: 'Da sagte Jesus: „Wenn ihr den Menschensohn erhöht[a], dann werdet ihr erkennen, dass ich es bin[b] und dass ich nichts von mir aus tue, sondern genau das sage, was der Vater mich gelehrt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erhöhen“ kann hier sowohl das körperliche Emporheben am Kreuz als auch die Erhöhung im Sinn von Verherrlichung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass ich bin“. Im Griechischen steht lediglich ἐγώ εἰμι („ich bin“), ohne ein ausdrücklich genanntes Prädikat.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Fortführung und Folgerung aus dem vorausgehenden Gespräch. „Da“ verbindet den Satz im modernen Deutschen natürlich, ohne eine stärkere Kausalität einzutragen.
- source_word: Ὅταν ὑψώσητε
  choice: Wenn ihr … erhöht
  rationale: Der Aorist Konjunktiv bezeichnet hier ein bestimmtes künftiges Geschehen. „Erhöht“ bewahrt im Johannesevangelium die mögliche Doppelbedeutung von körperlichem Emporheben am Kreuz und Erhöhung im Sinn von Verherrlichung.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Die geläufige deutsche Wiedergabe bewahrt den Charakter der Selbstbezeichnung und ihre biblischen Anklänge.
- source_word: γνώσεσθε
  choice: werdet ihr erkennen
  rationale: „Erkennen“ gibt hier den Gedanken eines künftigen Einsehens oder Begreifens genauer wieder als das bloße „wissen“.
- source_word: ἐγώ εἰμι
  choice: ich es bin
  rationale: Die idiomatische deutsche Ellipse lässt offen, worauf „es“ inhaltlich verweist, während die Anmerkung den prädikatslosen griechischen Wortlaut transparent macht.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: ich nichts von mir aus tue
  rationale: Bewahrt sowohl die Herkunfts- als auch die Eigeninitiative-Nuance von ἀπ’ ἐμαυτοῦ und gibt das allgemeine Präsens natürlich wieder.
- source_word: καθὼς ἐδίδαξέν με ὁ πατὴρ ταῦτα λαλῶ
  choice: sondern genau das sage, was der Vater mich gelehrt hat
  rationale: Gibt die Übereinstimmung zwischen der Lehre des Vaters und Jesu Worten in natürlichem Deutsch wieder. „Genau das“ trägt die vergleichende Kraft von καθώς und den Rückverweis ταῦτα gemeinsam.
theological_decisions:
- issue: Wiedergabe des absoluten beziehungsweise elliptischen ἐγώ εἰμι
  choice: ich es bin
  alternative: ich bin
  rationale: Der Haupttext bleibt idiomatisch, ohne die Aussage ausdrücklich mit einem Prädikat zu füllen. Die Fußnote bewahrt den bloßen griechischen Ausdruck und damit seine mögliche Anspielung auf göttliche Selbstoffenbarung, ohne diese Deutung festzuschreiben.
- issue: Bedeutung von ὑψώσητε im johanneischen Zusammenhang
  choice: erhöht
  alternative: emporhebt / kreuzigt
  rationale: „Erhöht“ kann sowohl das sichtbare Emporheben Jesu am Kreuz als auch seine Erhöhung und Verherrlichung anklingen lassen; die theologisch bedeutsame Spannung wird nicht auf nur eine Bedeutung reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, ohne die inhaltlichen Beziehungen oder die johanneischen Mehrdeutigkeiten aufzulösen.
