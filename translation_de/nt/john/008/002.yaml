source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὄρθρου δὲ πάλιν παρεγένετο εἰς τὸ ἱερόν, καὶ πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν· καὶ καθίσας ἐδίδασκεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: de
  text: Bei Tagesanbruch kam er wieder in den Tempel, und das ganze Volk kam zu ihm. Er setzte sich und lehrte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers setzt den Bericht von der Frau fort, die beim Ehebruch ertappt wurde (Johannes 7,53–8,11). Dieser Abschnitt fehlt in den frühesten griechischen Handschriften. Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Bei Tagesanbruch
  rationale: Der zeitliche Genitiv bezeichnet die frühe Morgenzeit um den Sonnenaufgang; „bei Tagesanbruch“ gibt dies prägnant und würdig wieder.
- source_word: παρεγένετο
  choice: kam
  rationale: Das Verb bezeichnet das Eintreffen an einem Ort; zusammen mit dem Ziel „in den Tempel“ ist „kam“ natürlich und genau.
- source_word: ἱερόν
  choice: Tempel
  rationale: Ἱερόν bezeichnet hier den gesamten öffentlich zugänglichen Tempelbezirk, nicht das innere Heiligtum (ναός). Im Deutschen ist „Tempel“ die übliche, kontextuell verständliche Wiedergabe.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Die Formulierung bewahrt den umfassenden Ausdruck des Griechischen, ohne ihn zu einer absolut wörtlichen Aussage über ausnahmslos jeden Menschen zu überdeuten.
- source_word: ἤρχετο
  choice: kam
  rationale: Der Imperfekt beschreibt einen fortlaufenden oder wiederholten Zulauf. Im natürlichen deutschen Erzählstil kann „kam zu ihm“ diesen Vorgang ausdrücken, ohne eine schwerfällige Verlaufsform zu erzwingen.
- source_word: καθίσας
  choice: Er setzte sich
  rationale: Das Aoristpartizip bezeichnet eine der Lehrtätigkeit vorausgehende Handlung; ein neuer Hauptsatz bildet die Abfolge im Deutschen klar ab.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Der Imperfekt stellt die Lehrtätigkeit als andauernd dar. „Lehrte“ bewahrt diese Offenheit besser als die mögliche, aber nicht zwingende inchoative Deutung „begann zu lehren“.
theological_decisions:
- issue: Textkritischer Status von Johannes 7,53–8,11
  choice: Der Vers wird entsprechend der vorgegebenen byzantinischen Ausgangsausgabe im Haupttext übersetzt; eine Fußnote weist auf seine handschriftliche Überlieferung hin.
  alternative: Den Vers aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Die gewählte Ausgangsausgabe enthält den Vers. Zugleich ist die bekannte textkritische Unsicherheit für Leser relevant und darf nicht verschwiegen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzteilung vermeidet eine überladene griechische Periodenstruktur. Der Fußnotenmarker steht am Versende, da die Anmerkung den textkritischen Status des gesamten Verses und seines Erzählzusammenhangs betrifft.
