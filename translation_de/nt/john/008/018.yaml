id: JHN.8.18
reference: John 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: de
  text: Ich bin es, der über mich selbst Zeugnis ablegt, und der Vater, der mich gesandt hat, legt über mich Zeugnis ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Ich bin es, der … Zeugnis ablegt
  rationale: Die deutsche Spaltsatzkonstruktion gibt das betonte ἐγώ und das substantivierte Partizip ὁ μαρτυρῶν natürlich wieder, ohne ἐγώ εἰμι als absolute Gottesformel zu deuten; hier folgt ausdrücklich ein Prädikat.
- source_word: μαρτυρῶν / μαρτυρεῖ
  choice: Zeugnis ablegt / legt … Zeugnis ab
  rationale: „Zeugnis ablegen“ bewahrt den rechtlich-zeugenschaftlichen Sinn von μαρτυρέω und gibt das wiederholte Verb in beiden Satzteilen einheitlich wieder.
- source_word: περὶ ἐμαυτοῦ
  choice: über mich selbst
  rationale: περί mit dem Genitiv bezeichnet hier am natürlichsten den Gegenstand des Zeugnisses. „Über mich selbst“ ist idiomatisches modernes Deutsch und erhält die reflexive Bedeutung.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: Die gleiche Wiedergabe von περί wahrt die Parallelität beider Satzteile und vermeidet die weitergehende Deutung „für mich“.
- source_word: ὁ πέμψας με πατήρ
  choice: der Vater, der mich gesandt hat
  rationale: Das artikulierte Aoristpartizip wird als Relativsatz wiedergegeben. „Der Vater“ folgt dem griechischen Text; „mein Vater“ oder „Gott, der Vater“ wären nicht ausdrücklich vorhanden.
theological_decisions:
- issue: Bezeichnung des zweiten Zeugen
  choice: der Vater
  alternative: mein Vater / Gott, der Vater
  rationale: Die knappe Bezeichnung des griechischen Textes bleibt erhalten. Die relationale und theologische Aussage wird nicht durch eine erklärende Ergänzung erweitert.
- issue: Rechtlicher Zeugnischarakter
  choice: Zeugnis ablegen
  alternative: bezeugen
  rationale: Die Formulierung lässt das im Kontext wichtige Motiv zweier Zeugen deutlich erkennen und erhält zugleich die Wiederholung des griechischen Verbs.
- issue: Bedeutung von ἐγώ εἰμι in diesem Satz
  choice: Ich bin es, der
  alternative: Ich bin / Ich bin derjenige, der
  rationale: Da auf ἐγώ εἰμι das substantivierte Partizip als Prädikat folgt, wird die Wendung als betonte Identifikation verstanden, ohne eine absolute christologische Formel vorauszusetzen oder auszuschließen, wo der unmittelbare Satzbau sie nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Zeugnis ablegen“ ist bewusst beibehalten, weil sie die Parallelstruktur und das Zeugnis-Motiv des griechischen Textes trägt. Die Konstruktion „Ich bin es, der über mich selbst …“ folgt dem Sinnbezug der ersten Person und vermeidet das missverständliche „über sich selbst“.
