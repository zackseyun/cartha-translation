  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: de
  text: 'Da fragten sie ihn: »Wer bist du?« Jesus antwortete ihnen: »Genau das, was ich euch von Anfang an sage.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satz ist schwer zu deuten. Auch möglich: »Warum rede ich überhaupt noch mit euch?«'
    reason: Die Verbindung Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν erlaubt neben der traditionellen temporalen-relativen Auffassung auch eine Deutung von τὴν ἀρχήν als »überhaupt« und ὅ τι als »warum«.
lexical_decisions:
- source_word: ἔλεγον
  choice: fragten
  rationale: Das Imperfekt bezeichnet hier die fortgesetzte beziehungsweise einsetzende Äußerung der Gesprächspartner; im natürlichen deutschen Erzählstil genügt »fragten«.
- source_word: Σὺ τίς εἶ;
  choice: Wer bist du?
  rationale: Das ausdrücklich gesetzte σύ hebt die angesprochene Person hervor; die idiomatische deutsche Frage trägt diese Betonung durch den Kontext.
- source_word: Τὴν ἀρχὴν
  choice: von Anfang an
  rationale: Diese traditionelle und kontextuell gut mögliche Deutung versteht die Akkusativfügung temporal und bezieht sie auf Jesu bisheriges Reden.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: genau das, was ich euch … sage
  rationale: ὅ τι wird als relatives »das, was« verstanden; καί verstärkt hier die Identität zwischen Jesu Person und seiner bisherigen Aussage. Das Präsens λαλῶ wird mit »sage« wiedergegeben.
theological_decisions:
- issue: Beziehung zwischen Jesu Identität und seinem bisherigen Reden
  choice: »Genau das, was ich euch von Anfang an sage«
  alternative: »Warum rede ich überhaupt noch mit euch?«
  rationale: Die gewählte Fassung bewahrt die enge Verbindung zwischen Jesu Identität und seiner Offenbarung im bisherigen Reden, ohne eine zusätzliche christologische Erklärung einzutragen. Wegen der ungewöhnlichen griechischen Syntax wird die substantiell andere mögliche Deutung in der Fußnote offengelegt.
translation_notes:
  register: Moderne, klare und würdevolle Standardsprache. »Da fragten sie« verbindet den Vers natürlich mit dem vorausgehenden Gespräch; die direkte Rede bleibt knapp. Die echte syntaktische Mehrdeutigkeit wird nicht im Haupttext geglättet, sondern transparent in einer markierten Fußnote dokumentiert.
