id: JHN.8.29
reference: John 8:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: de
  text: Und der, der mich gesandt hat, ist bei mir. Er hat mich nicht allein gelassen, denn ich tue immer, was ihm gefällt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: der, der mich gesandt hat
  rationale: Das substantivierte Aoristpartizip bezeichnet den Sendenden. Die Formulierung bleibt nahe an der relationalen Ausdrucksweise des Griechischen und ist in modernem Deutsch verständlich.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: ist bei mir
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft bzw. Gegenwart. „Bei mir“ gibt dies im Deutschen idiomatisch wieder und passt zur anschließenden Aussage, Jesus sei nicht allein gelassen worden.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Er hat mich nicht allein gelassen
  rationale: Das deutsche Perfekt wahrt den Rückbezug des Aorists und bringt zugleich die fortdauernde Bedeutung im Kontext zum Ausdruck. μόνον steht prädikativ zu με und wird natürlich mit „allein“ wiedergegeben.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier eine Begründung ein. „Denn“ erhält den kausalen Zusammenhang, ohne ihn stärker als im Ausgangstext zu bestimmen.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: was ihm gefällt
  rationale: Die substantivierte neutrale Pluralform bezeichnet das, was ihm wohlgefällig ist. „Was ihm gefällt“ ist natürliches modernes Deutsch und bewahrt den wertenden Sinn.
- source_word: ποιῶ πάντοτε
  choice: ich tue immer
  rationale: Das Präsens bezeichnet fortdauerndes bzw. regelmäßiges Handeln; πάντοτε wird mit „immer“ wiedergegeben.
theological_decisions:
- issue: Bezug von ὁ πέμψας με
  choice: Die relationale Bezeichnung „der, der mich gesandt hat“ bleibt stehen.
  alternative: Den Bezug ausdrücklich als „der Vater, der mich gesandt hat“ wiederzugeben.
  rationale: Im johanneischen Kontext ist der Vater gemeint, doch der griechische Wortlaut nennt ihn hier nicht ausdrücklich. Die Übersetzung vermeidet daher eine erklärende Ergänzung.
- issue: Zusammenhang zwischen Jesu Tun und der Gegenwart des Sendenden
  choice: ὅτι wird kausal mit „denn“ wiedergegeben.
  alternative: Eine bloß erläuternde oder inhaltliche Wiedergabe, etwa „dass“, oder eine Umformulierung, die den Satz von jeder Begründungsbeziehung löst.
  rationale: Der griechische Text stellt Jesu beständiges Tun des Wohlgefälligen als Begründung in Beziehung dazu, dass der Sendende ihn nicht allein gelassen hat. Diese theologische Spannung wird nicht abgeschwächt oder systematisch aufgelöst.
- issue: Zeitbezug von οὐκ ἀφῆκεν
  choice: 'Deutsches Perfekt: „Er hat mich nicht allein gelassen“.'
  alternative: 'Präteritum: „Er ließ mich nicht allein“.'
  rationale: Das Perfekt ist idiomatisch und verbindet die im Aorist bezeichnete Handlung mit der im ersten Satz ausgesagten gegenwärtigen Gemeinschaft, ohne aus dem Verb selbst eine zusätzliche Aspektlehre abzuleiten.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der doppelte Relativanschluss „der, der“ ist bewusst gewählt: Er klingt mündlich und verständlich, bewahrt aber die substantivierte relationale Bezeichnung. Keine Fußnoten sind erforderlich, da keine für das Verständnis wesentliche textliche oder lexikalische Alternative ausgelagert werden muss.'
