source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: de
  text: Ich weiß, dass ihr Abrahams Nachkommen[a] seid. Aber ihr sucht mich zu töten, weil mein Wort in euch keinen Raum findet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Abrahams Same.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: weil mein Wort in euch keinen Platz hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: Abrahams Nachkommen
  rationale: Das singularische Kollektivum σπέρμα bezeichnet hier die leibliche Abstammung. „Nachkommen“ gibt diesen Sinn im modernen Deutschen natürlich wieder; „Same“ wäre formaler, wirkt hier jedoch ungewohnt und kann missverständlich sein.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: ihr sucht mich zu töten
  rationale: Die Verbindung von ζητέω mit Infinitiv bezeichnet das Bestreben, etwas zu tun. Die Wiedergabe bewahrt den durativen Präsensaspekt und bleibt näher am griechischen Ausdruck als das stärker deutende „ihr versucht, mich zu töten“.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: mein Wort
  rationale: „Mein Wort“ ist die direkte und im johanneischen Sprachgebrauch gewichtige Wiedergabe. „Meine Botschaft“ wäre möglich, würde aber die lexikalische Verbindung von λόγος abflachen.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: in euch keinen Raum findet
  rationale: χωρέω kann hier das Raumfinden beziehungsweise Aufgenommenwerden bezeichnen. Die Formulierung erhält das räumliche Bild und lässt offen, ob vor allem fehlende Aufnahme, Wirkung oder Fortschritt gemeint ist.
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die Konjunktion setzt die anerkannte leibliche Abstammung in einen deutlichen Gegensatz zu ihrem Bestreben, Jesus zu töten.
- source_word: οἶδα ὅτι
  choice: Ich weiß, dass
  rationale: Dies entspricht unmittelbar der griechischen Einleitung samt Inhaltssatz und ist natürliches modernes Deutsch.
theological_decisions:
- issue: Verhältnis zwischen leiblicher Abstammung von Abraham und wahrer Übereinstimmung mit Abraham
  choice: σπέρμα Ἀβραάμ wird mit „Abrahams Nachkommen“ in einem klar genealogischen Sinn wiedergegeben.
  alternative: „Abrahams Kinder“
  rationale: Jesus erkennt hier ihre leibliche Abstammung an, während er ihre Haltung ihm gegenüber beanstandet. „Nachkommen“ bewahrt diese Spannung, ohne die in den folgenden Versen entwickelte Unterscheidung vorwegzunehmen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und kontrastreich. „In euch keinen Raum findet“ bewahrt die Bildhaftigkeit und die semantische Offenheit des griechischen χωρεῖ.
