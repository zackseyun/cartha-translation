base_translation:
  language: en
  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: de
  text: 'Sie sagten[a] zu ihm: »Lehrer, diese Frau ist auf frischer Tat beim Ehebruch ertappt worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fortsetzung des Berichts über die beim Ehebruch ertappte Frau (Johannes 7,53–8,11). Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: Sie sagten
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Direkte, im modernen Standarddeutsch verständliche Anrede für Jesus; die Anredeform wird ohne konfessionelle Zusatzdeutung bewahrt.
- source_word: κατείληπται
  choice: ist … ertappt worden
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Feststellung, deren Ergebnis in der gegenwärtigen Situation fortbesteht.
- source_word: ἐπαυτοφώρῳ
  choice: auf frischer Tat
  rationale: Diese geläufige deutsche Wendung gibt das griechische Idiom für das Ergreifen während der Tat natürlich und präzise wieder.
- source_word: μοιχευομένη
  choice: beim Ehebruch
  rationale: Das Präsenspartizip beschreibt, wobei die Frau ertappt wurde; die knappe Form verbindet sich idiomatisch mit »auf frischer Tat ertappt«.
theological_decisions:
- issue: Textkritischer Status von Johannes 7,53–8,11
  choice: Der Vers steht im Haupttext und erhält einen Fußnotenhinweis zum größeren Abschnitt.
  alternative: Den Vers aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Die angegebene byzantinische Ausgangsausgabe enthält den Abschnitt. Zugleich wird seine handschriftliche Überlieferung durch die Fußnote transparent gemacht, ohne die Übersetzung des vorgegebenen Ausgangstextes zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Auf frischer Tat« ist eine allgemein verständliche feste Wendung; der Satz bleibt nah an Wortfolge und Aussage des griechischen Textes.
