  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wenn jemand an meinem Wort festhält, wird er in Ewigkeit den Tod nicht sehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die feierliche, für Jesu Aussagen im Johannesevangelium charakteristische Bekräftigungsformel und ist im Deutschen verständlich.
- source_word: τηρήσῃ
  choice: an … festhält
  rationale: Gibt das treue Bewahren, Beachten und Befolgen des Wortes natürlicher wieder als das missverständliche bloße „bewahren“.
- source_word: τὸν ἐμὸν λόγον
  choice: meinem Wort
  rationale: Der Singular λόγος bezeichnet hier Jesu Botschaft beziehungsweise Ausspruch; „Wort“ erhält diese Bedeutungsweite.
- source_word: θάνατον … θεωρήσῃ
  choice: den Tod … sehen
  rationale: Erhält das bildhafte Verb θεωρέω und die bewusst zugespitzte Aussage des griechischen Textes.
- source_word: οὐ μὴ … εἰς τὸν αἰῶνα
  choice: wird … in Ewigkeit … nicht
  rationale: Die starke griechische Verneinung zusammen mit der Zeitangabe wird nachdrücklich und idiomatisch wiedergegeben.
theological_decisions:
- issue: Verheißung, den Tod nicht zu sehen
  choice: Die absolute Formulierung „wird er in Ewigkeit den Tod nicht sehen“ bleibt stehen.
  alternative: Deutend „wird den ewigen Tod nicht erleiden“ oder „wird nicht für immer tot bleiben“.
  rationale: Der Vers selbst erklärt die Spannung zur leiblichen Sterblichkeit nicht. Eine präzisierende Deutung würde die johanneische Mehrdeutigkeit vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Amen-Formel und das Todesbild bleiben bewusst nah am griechischen Wortlaut; die Satzstellung ist zugleich natürlich deutsch.
