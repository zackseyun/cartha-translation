id: JHN.8.47
reference: John 8:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: de
  text: Wer aus Gott ist[b], hört die Worte Gottes. Deshalb hört ihr nicht, weil ihr nicht aus Gott seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deshalb hört ihr nicht, dass ihr nicht aus Gott seid.“ Das griechische Bindewort ὅτι kann auch „dass“ bedeuten; im Zusammenhang liegt die kausale Bedeutung „weil“ jedoch näher.'
    reason: alternative_reading
  - marker: b
    text: „Aus Gott“ kann auch mit „von Gott“ wiedergegeben werden. Der griechische Ausdruck hebt Herkunft oder Ursprung hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὢν
  choice: Wer … ist
  rationale: Der substantivierte Partizipialausdruck bezeichnet allgemein jeden Menschen, auf den die Aussage zutrifft. „Wer … ist“ gibt diese repräsentative Einzahl im heutigen Deutsch natürlich wieder.
- source_word: ἐκ τοῦ θεοῦ
  choice: aus Gott
  rationale: ἐκ bezeichnet hier Herkunft oder Ursprung. „Aus Gott“ bewahrt die prägnante johanneische Ausdrucksweise und legt sie nicht vorschnell als bloße Zugehörigkeit aus.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: die Worte Gottes
  rationale: „Worte“ erhält den konkreten Plural von ῥήματα; der Genitiv wird knapp und würdevoll als „Gottes“ wiedergegeben.
- source_word: ἀκούει / ἀκούετε
  choice: hört / hört
  rationale: Die Wiederholung desselben Verbs bleibt erhalten. Im Zusammenhang schließt „hören“ ein aufnehmendes Hören ein, ohne die Bedeutung im Haupttext interpretierend auf „gehorchen“ festzulegen.
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: „Deshalb“ gibt die folgernde Wendung klar, knapp und in natürlichem modernem Deutsch wieder.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Die Anrede steht im Plural. Das ausdrücklich gesetzte griechische Pronomen wird durch „ihr“ wiedergegeben, ohne seine Betonung durch einen Zusatz zu übersteigern.
- source_word: ὅτι
  choice: weil
  rationale: 'ὅτι wird hier am besten kausal verstanden: Der folgende Satz nennt den Grund dafür, dass die Angesprochenen nicht hören. Die grammatisch mögliche Lesart „dass“ bleibt in einer Fußnote erhalten.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: ihr nicht aus Gott seid
  rationale: Die Wiederaufnahme von ἐκ τοῦ θεοῦ wird ebenso wie am Versanfang übersetzt und bewahrt so den Gegensatz von Herkunft beziehungsweise Ursprung.
theological_decisions:
- issue: Bedeutung von „aus Gott sein“ im johanneischen Zusammenhang
  choice: Die Herkunftssprache „aus Gott“ bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: „zu Gott gehören“ oder eine ausdrückliche Deutung als Wiedergeburt, Erwählung oder Bundeszugehörigkeit
  rationale: Der Vers stellt Menschen, die aus Gott sind, den Angesprochenen gegenüber. Die Übersetzung bewahrt diese theologische Spannung, ohne den Ausdruck auf eine später systematisierte Kategorie einzuengen.
- issue: Bedeutungsumfang von ἀκούω
  choice: Im Haupttext steht „hören“.
  alternative: „auf etwas hören“, „Folge leisten“ oder „gehorchen“
  rationale: Ein annehmendes und entsprechendes Reagieren ist im Kontext wahrscheinlich mitgemeint; das griechische Verb bezeichnet jedoch zunächst das Hören. Daher wird die Folgerung nicht in den Wortlaut hineingetragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. „Wer … ist“ klingt natürlicher als „Der, der … ist“; „aus Gott“ bleibt bewusst etwas markant, um die johanneische Herkunftssprache und die Wiederholung des griechischen Ausdrucks zu erhalten.
