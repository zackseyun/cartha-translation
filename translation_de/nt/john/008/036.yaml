id: JHN.8.36
reference: John 8:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: de
  text: Wenn also der Sohn euch frei macht, werdet ihr wirklich frei sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „tatsächlich frei“ oder „wahrhaft frei“. Das griechische Adverb betont, dass diese Freiheit echt und wirklich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Wenn also
  rationale: Die Verbindung bewahrt sowohl die Bedingung durch ἐὰν als auch die folgernde Rückbindung durch οὖν und klingt im modernen Deutschen natürlich.
- source_word: ὁ υἱὸς
  choice: der Sohn
  rationale: Der bestimmte Ausdruck bezeichnet im johanneischen Zusammenhang Jesus als den Sohn; die Großschreibung kennzeichnet den christologischen Titel.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen steht im Griechischen im Plural; „euch“ macht diese Anrede im Deutschen eindeutig sichtbar.
- source_word: ἐλευθερώσῃ
  choice: frei macht
  rationale: „Frei machen“ gibt die Handlung idiomatisch wieder und erhält die Wortverbindung zum folgenden Adjektiv „frei“.
- source_word: ὄντως
  choice: wirklich
  rationale: Das Adverb betont, dass die bezeichnete Freiheit tatsächlich und echt ist; „wirklich“ ist klar und gegenwärtig, ohne den Umfang näher festzulegen.
- source_word: ἐλεύθεροι
  choice: frei
  rationale: Das prädikative Adjektiv bezeichnet den daraus folgenden Zustand und wahrt die sprachliche Verbindung zu „frei macht“.
- source_word: ἔσεσθε
  choice: werdet ihr … sein
  rationale: Diese Form gibt das Futur von εἰμί in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Identität des „Sohnes“
  choice: Christologischer Titel für Jesus
  alternative: ein Sohn im allgemeinen Sinn
  rationale: Im johanneischen Zusammenhang ist „der Sohn“ Teil von Jesu Aussage über Sohnschaft, bleibende Stellung im Haus und die Vollmacht, echte Freiheit zu geben.
- issue: Art und Umfang der Freiheit
  choice: „wirklich frei“, ohne die Freiheit in der Übersetzung weiter einzugrenzen
  alternative: ausschließlich geistlich, innerlich, gesellschaftlich oder politisch frei
  rationale: Der unmittelbare Zusammenhang spricht von der Sklaverei der Sünde; der Vers selbst formuliert das Ergebnis jedoch umfassend. Die Übersetzung bewahrt diese Spannung, statt sie erklärend zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Wenn also …“ bildet Bedingung und Folgerung natürlich ab. „Frei macht“ vermeidet das stärker politische oder institutionelle Register von „befreit“ und wahrt die hörbare Wiederholung des griechischen Wortstamms.
