  text: Und wieder[a] beugte er sich hinunter und schrieb auf den Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11) fehlt in den frühesten erhaltenen griechischen Handschriften.
