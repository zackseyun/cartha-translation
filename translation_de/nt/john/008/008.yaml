lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung der bereits in Johannes 8,6 beschriebenen Handlung natürlich und präzise wieder.
- source_word: κάτω κύψας
  choice: beugte er sich hinunter
  rationale: Das Partizip κύψας bezeichnet zusammen mit κάτω das Vor- und Hinunterbeugen des Körpers. Die deutsche Formulierung bewahrt die körperliche Bewegung und klingt natürlich.
- source_word: ἔγραφεν
  choice: schrieb
  rationale: Der Imperfekt kann einen andauernden oder wiederholten Schreibvorgang ausdrücken. Im deutschen Erzählstil ist das Präteritum „schrieb“ natürlich, ohne den Verlaufsaspekt auszuschließen.
- source_word: εἰς τὴν γῆν
  choice: auf die Erde
  rationale: Die Präposition εἰς bezeichnet hier die Fläche, auf die geschrieben wird; γῆ meint den Boden beziehungsweise die Erdoberfläche. „Auf die Erde“ ist in diesem Zusammenhang idiomatisch und konkret.
theological_decisions:
- issue: Textkritischer Status von Johannes 7,53–8,11
  choice: Der Vers wird im Haupttext übersetzt und mit einer textkritischen Fußnote gekennzeichnet.
  alternative: Den Abschnitt aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Die angegebene byzantinische Ausgangsausgabe enthält den Vers. Zugleich ist die Überlieferungsgeschichte des gesamten Abschnitts bedeutsam und soll transparent gemacht werden, ohne sie im Vers selbst zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des griechischen Erzähltexts bleibt erhalten; „beugte er sich hinunter“ ist anschaulich und allgemein verständlich.
