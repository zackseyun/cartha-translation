id: JHN.8.59
reference: John 8:59
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: de
  text: Da hoben sie Steine auf, um sie auf ihn zu werfen. Jesus aber verbarg sich und ging aus dem Tempelbereich hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise genauer: aus dem Tempelbezirk; das griechische Wort ἱερόν bezeichnet die gesamte Tempelanlage und nicht nur das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: hoben … auf
  rationale: Das idiomatische „Steine aufheben“ gibt αἴρω in dieser feindseligen Handlung natürlich und präzise wieder.
- source_word: οὖν
  choice: Da
  rationale: „Da“ stellt knapp den folgernden beziehungsweise erzählerischen Anschluss an Jesu vorherige Aussage her, ohne schwerfällig zu wirken.
- source_word: λίθους
  choice: Steine
  rationale: „Steine“ ist die übliche und kontextgerechte Wiedergabe im Zusammenhang eines beabsichtigten Steinwurfs.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: um sie auf ihn zu werfen
  rationale: Die Konstruktion mit „um … zu“ bewahrt den Zweck der ἵνα-Konstruktion; „auf ihn werfen“ entspricht βάλλω mit ἐπί.
- source_word: ἐκρύβη
  choice: verbarg sich
  rationale: Obwohl die Form morphologisch passiv ist, liegt hier kontextuell ein medialer Sinn nahe. „Ver barg sich“ wäre ein Tippfehler; korrekt ist „verbarg sich“ und vermeidet einen nicht genannten äußeren Handelnden.
- source_word: ἐξῆλθεν
  choice: ging … hinaus
  rationale: Die Formulierung bildet die konkrete Bewegung aus dem bezeichneten Bereich natürlich ab.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: aus dem Tempelbereich hinaus
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbezirk beziehungsweise die Tempelanlage, nicht speziell das innere Heiligtum (ναός).
theological_decisions:
- issue: Art und Weise von Jesu Entkommen
  choice: Nur wiedergeben, dass Jesus sich verbarg und den Tempelbereich verließ.
  alternative: Ein wunderbares Hindurchgehen oder Unsichtbarwerden ergänzen.
  rationale: Der vorliegende SBLGNT-Text nennt weder ein wunderbares Hindurchgehen noch ein Unsichtbarwerden. Solche Einzelheiten werden daher nicht aus späteren Texttraditionen eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ wahrt den Anschluss an den vorherigen Vers; „Tempelbereich“ macht die räumliche Bedeutung von ἱερόν bereits im Haupttext deutlich. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
