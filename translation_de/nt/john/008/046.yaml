  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: de
  text: Wer von euch kann mir eine Sünde nachweisen?[a] Wenn ich die Wahrheit sage, warum glaubt ihr mir nicht?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer von euch überführt mich einer Sünde?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warum vertraut ihr mir nicht?“ Das griechische Verb kann sowohl bedeuten, jemandem zu glauben, als auch, ihm zu vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Wer von euch
  rationale: Die Wendung bezeichnet in natürlichem Deutsch eine Person aus dem Kreis der Angesprochenen und bewahrt die direkte Herausforderung.
- source_word: ἐλέγχει
  choice: kann … nachweisen
  rationale: ἐλέγχω kann überführen, bloßstellen oder Schuld erweisen bedeuten. Zusammen mit περὶ ἁμαρτίας gibt „eine Sünde nachweisen“ den beweisenden, beinahe forensischen Ton idiomatisch wieder.
- source_word: περὶ ἁμαρτίας
  choice: eine Sünde
  rationale: Die Verbindung bezeichnet hier den Gegenstand der Beschuldigung. Im Deutschen verlangt „jemandem etwas nachweisen“ ein entsprechendes Objekt; „eine Sünde“ lässt die Art des möglichen Vergehens offen.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Wenn ich die Wahrheit sage
  rationale: „Wenn“ bewahrt die Form der griechischen Bedingung, ohne sie deutend in „da“ oder „weil“ umzuwandeln.
- source_word: διὰ τί
  choice: warum
  rationale: „Warum“ ist die natürliche deutsche Entsprechung der Frage nach dem Grund.
- source_word: πιστεύετέ μοι
  choice: glaubt ihr mir
  rationale: πιστεύω mit Dativ kann bedeuten, jemandem zu glauben oder ihm zu vertrauen. „Mir glauben“ bewahrt hier sowohl den Bezug auf Jesu Aussage als auch die persönliche Dimension, ohne sie einseitig festzulegen.
theological_decisions:
- issue: Rhetorische Tragweite von Jesu Herausforderung hinsichtlich Sünde und Wahrheit
  choice: Die beiden Fragen werden unmittelbar wiedergegeben, ohne die darin liegende Behauptung ausdrücklich auszuschreiben.
  alternative: „Kann einer von euch beweisen, dass ich irgendeine Sünde begangen habe?“ oder eine ausdrückliche Aussage über Jesu Sündlosigkeit.
  rationale: Der griechische Text stellt die Herausforderung direkt und verbindet sie mit Jesu Wahrhaftigkeit. Die Übersetzung bewahrt diese starke Aussage und ihre rhetorische Spannung, ohne zusätzliche dogmatische Erläuterung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Eine Sünde nachweisen“ vermeidet das im heutigen Deutsch steife „einer Sünde überführen“, während die Fußnote diese nähere formale Alternative dokumentiert.
