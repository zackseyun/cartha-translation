  text: Jesus aber ging zum Ölberg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zur Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11). Zur handschriftlichen Überlieferung siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: πορεύομαι
  choice: ging
  rationale: Der Aorist ἐπορεύθη hat hier trotz seiner passiven Form aktive Bedeutung und bezeichnet schlicht die Bewegung zu einem Ziel.
- source_word: ὄρος τῶν Ἐλαιῶν
  choice: Ölberg
  rationale: Die eingebürgerte deutsche Ortsbezeichnung »Ölberg« gibt die wörtliche Bedeutung »Berg der Olivenbäume« natürlich und eindeutig wieder.
- source_word: δέ
  choice: aber
  rationale: Die adversativ beziehungsweise fortführend-kontrastive Partikel verbindet Jesu Weggang mit dem vorausgehenden Satz; »aber« bewahrt diese Verknüpfung knapp und idiomatisch.
theological_decisions:
- issue: Textkritischer Status von Johannes 7,53–8,11
  choice: Der Vers wird im Haupttext übersetzt und mit einer textkritischen Fußnote versehen.
  alternative: Den Abschnitt aus dem Haupttext auslassen oder einklammern.
  rationale: Die vorgegebene byzantinische Ausgangsausgabe enthält den Vers. Zugleich muss die bedeutende handschriftliche Unsicherheit für Leser transparent gemacht werden, ohne sie im Übersetzungstext selbst aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und allgemein verständliche Ortsbezeichnung »Ölberg« wird verwendet; die Satzstellung bewahrt den Anschluss durch δέ, ohne unnötig griechisch zu klingen.
