  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: de
  text: Ich aber suche nicht meine eigene Ehre; da ist einer, der sie sucht und richtet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da ist der, der sucht und richtet.“ Das Objekt von „sucht“ – Jesu Ehre – ist aus dem vorhergehenden Satzteil zu ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: Der ungenannte Handelnde wird aus dem Zusammenhang gewöhnlich als der Vater verstanden; ausdrücklich gesagt wird das im griechischen Text an dieser Stelle jedoch nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ich aber
  rationale: Das ausdrücklich gesetzte Pronomen bewahrt die Betonung; „aber“ gibt den Gegensatz des δέ natürlich wieder.
- source_word: οὐ ζητῶ
  choice: suche nicht
  rationale: Der einfache Präsensausdruck entspricht dem griechischen Präsens und erhält die Verbindung zum folgenden ζητῶν.
- source_word: τὴν δόξαν μου
  choice: meine eigene Ehre
  rationale: δόξα bezeichnet hier die einer Person zukommende Ehre beziehungsweise Herrlichkeit. „Eigene“ verdeutlicht im Deutschen idiomatisch die Ablehnung eigennütziger Ehrsuche, ohne einen neuen Bezug einzuführen.
- source_word: ἔστιν ὁ ζητῶν
  choice: es gibt einen, der sie sucht
  rationale: Die existentielle Formulierung wahrt, dass der griechische Text den Handelnden nicht ausdrücklich benennt. „sie“ nimmt als erschlossenes Objekt die Ehre aus dem ersten Satzteil auf.
- source_word: καὶ κρίνων
  choice: und richtet
  rationale: Das koordinierte substantivierte Partizip wird als Relativsatz fortgeführt. „Richtet“ bewahrt den forensischen und theologisch offenen Sinn von κρίνω.
theological_decisions:
- issue: Identität dessen, der sucht und richtet
  choice: Der Haupttext lässt die Person mit „einen“ unbenannt.
  alternative: „Es gibt den Einen, der sie sucht und richtet“ oder eine ausdrückliche Identifizierung als der Vater.
  rationale: Der Zusammenhang legt den Vater nahe, doch der griechische Wortlaut nennt ihn hier nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung.
- issue: Erschlossenes Objekt von ζητῶν
  choice: „sie“ verweist auf Jesu Ehre.
  alternative: 'Wörtlicher ohne Objekt: „der sucht und richtet“.'
  rationale: Das Objekt ist aus τὴν δόξαν μου im vorherigen Satzteil zu ergänzen; seine Aufnahme ergibt natürliches Deutsch und macht den syntaktischen Bezug deutlich, ohne die Aussage inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ehre“ ist hier für gewöhnliche Leser natürlicher als „Herrlichkeit“, während die Fußnoten die knappe und bewusst unbenannte griechische Formulierung transparent machen.
