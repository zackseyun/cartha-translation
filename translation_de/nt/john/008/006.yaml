  variant: modern standard German
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: de
  text: Das sagten sie[a], um ihn auf die Probe zu stellen, damit sie einen Grund hätten, ihn anzuklagen. Jesus aber beugte sich hinunter und schrieb mit dem Finger auf die Erde, ohne sie zu beachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zur Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11). Der Abschnitt fehlt in frühen wichtigen Handschriften und steht in einigen anderen an anderer Stelle. Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: um ihn auf die Probe zu stellen
  rationale: Das Partizip bezeichnet hier eine feindselige Prüfung mit dem Ziel, Jesus in eine Falle zu bringen. Die Formulierung gibt den Prüfungsaspekt wieder, ohne die Falle als ausdrücklich genanntes Ergebnis vorwegzunehmen.
- source_word: κατηγορίαν κατ' αὐτοῦ
  choice: einen Grund hätten, ihn anzuklagen
  rationale: 'κατηγορία kann eine Anklage bzw. Beschuldigung bezeichnen. Im Deutschen gibt diese Wendung den finalen Zusammenhang idiomatisch wieder: Sie wollten belastbares Material für eine Anklage gegen Jesus gewinnen.'
- source_word: κάτω κύψας
  choice: beugte sich hinunter
  rationale: Die deutsche finite Form verbindet sich natürlich mit dem folgenden Hauptverb und bewahrt die körperliche Bewegung des griechischen Partizips.
- source_word: ἔγραφεν εἰς τὴν γῆν
  choice: schrieb … auf die Erde
  rationale: Der Imperfekt bezeichnet die andauernde Schreibhandlung. Der Inhalt des Geschriebenen bleibt wie im griechischen Text offen.
- source_word: μὴ προσποιούμενος
  choice: ohne sie zu beachten
  rationale: Die byzantinische Lesart beschreibt, dass Jesus ihnen keine Beachtung schenkte bzw. sich so verhielt, als nehme er sie nicht wahr. Die knappe Formulierung ist im modernen Deutschen natürlich, ohne das im Text nicht ausdrücklich genannte Hören einzutragen.
theological_decisions:
- issue: Absicht der Fragenden
  choice: auf die Probe stellen
  alternative: versuchen / in eine Falle locken
  rationale: Die feindselige Absicht wird durch den anschließenden Zweck der Anklage deutlich. Die Übersetzung wahrt zugleich den üblichen Bedeutungsumfang von πειράζω.
- issue: Inhalt von Jesu Schreiben
  choice: nicht erläutert
  alternative: eine bestimmte Deutung des Geschriebenen ergänzen
  rationale: Der griechische Text sagt weder, was Jesus schrieb, noch warum; diese inhaltliche Offenheit wird bewahrt.
- issue: Textkritischer Status des Abschnitts
  choice: Fußnote am ersten Satz
  alternative: keine Kennzeichnung
  rationale: Johannes 7,53–8,11 fehlt in frühen wichtigen Textzeugen und steht in der Überlieferung teils an anderer Stelle. Da die vorgelegte byzantinische Edition den Vers enthält, wird er übersetzt und sein Überlieferungsstatus knapp vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng an der griechischen Struktur, wird aber idiomatisch formuliert. Das Pronomen „sie“ bei „ohne sie zu beachten“ nimmt die Fragenden aus dem Zusammenhang auf; der Inhalt des Schreibens wird bewusst nicht konkretisiert.
