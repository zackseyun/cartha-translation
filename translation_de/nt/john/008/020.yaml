  rationale: Die Revision ersetzt die unnötig kontrastierende Konjunktion, ordnet die Orts- und Partizipialangaben klarer und verwendet die natürliche Standardwiedergabe „in der Schatzkammer“. Die Fußnoten bleiben inhaltlich erhalten; Anmerkung b ist an die erläuterte Wendung verschoben und zurückhaltender als johanneischer Bezug formuliert.
