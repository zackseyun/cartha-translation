base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: de
  text: Diese Worte sprach Jesus in der Schatzkammer[a], als er im Tempel lehrte; und niemand ergriff ihn, denn seine Stunde[b] war noch nicht gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann die Schatzkammer beziehungsweise den Bereich der Opferkästen im Tempelbezirk bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: '„Seine Stunde“ bezieht sich im Johannesevangelium auf den bestimmten Zeitpunkt von Jesu entscheidendem Leiden und seiner Verherrlichung; auch möglich: „seine festgesetzte Stunde“.'
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: Diese Worte sprach Jesus
  rationale: Die Wendung gibt den Rückbezug auf die unmittelbar vorausgehende Rede natürlich wieder. Das im Griechischen nur implizite Subjekt wird im Deutschen zur Klarheit als „Jesus“ benannt.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: im Bereich der Schatzkammer
  rationale: γαζοφυλάκιον kann die Tempelschatzkammer beziehungsweise den Bereich der Opferkästen bezeichnen. „Im Bereich der Schatzkammer“ vermeidet die irreführende Vorstellung eines einzelnen abgeschlossenen Raumes.
- source_word: διδάσκων ἐν τῷ ἱερῷ
  choice: beim Lehren im Tempel
  rationale: Das Präsenspartizip bezeichnet eine gleichzeitig stattfindende Handlung. ἱερόν meint hier den gesamten Tempelbezirk, was „Tempel“ im üblichen deutschen Sprachgebrauch knapp wiedergibt.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: niemand ergriff ihn
  rationale: πιάζω bezeichnet ein feindliches Ergreifen oder Festnehmen. „Ergriff“ bewahrt die körperliche Bedeutung, ohne den Vorgang ausdrücklich als formelle Verhaftung festzulegen.
- source_word: ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ
  choice: denn seine Stunde war noch nicht gekommen
  rationale: „Denn“ stellt den begründenden Zusammenhang natürlich her. Die johanneische Formulierung „seine Stunde“ bleibt bewusst erhalten.
theological_decisions:
- issue: Johanneischer Ausdruck „seine Stunde“
  choice: seine Stunde
  alternative: seine festgesetzte Stunde; seine Zeit
  rationale: Die wörtliche Formulierung wahrt das zentrale johanneische Motiv des bestimmten Zeitpunkts von Jesu Leiden und Verherrlichung, ohne dessen Bedeutung im Haupttext erklärend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für natürliche deutsche Informationsstruktur leicht umgestellt. „Doch“ markiert den erzählerischen Gegensatz, ohne einen zusätzlichen theologischen Gedanken einzutragen.
