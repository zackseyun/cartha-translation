  verdict: approve
  source_fidelity: „Ihr“ und „ich“ bewahren den im Griechischen ausdrücklich gesetzten Kontrast. „urteilt nach dem Fleisch“ gibt κατὰ τὴν σάρκα und κρίνετε formnah wieder; „ich urteile über niemanden“ entspricht der uneingeschränkten Negation οὐ κρίνω οὐδένα. Es werden keine im Ausgangstext fehlenden zeitlichen oder sachlichen Einschränkungen ergänzt.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die Verbindung „über jemanden urteilen“ ist idiomatisch; die parallele Gegenüberstellung mit Semikolon ist klar und prägnant. „Nach dem Fleisch“ ist bewusst bibelsprachlich und wird durch die Fußnote verständlich eingeordnet.
  terminology: „Fleisch“ ist als Haupttextentsprechung zu σάρξ sachgerecht, da die Wendung im Kontext mehrere Nuancen zulässt und nicht zu „sündige Natur“ verengt werden sollte. Die Fußnotenalternativen „nach menschlichen Maßstäben“ und „nach dem äußeren Anschein“ entsprechen dem englischen Audit Trail und markieren die idiomatische Spannweite ohne eine Deutung vorzuschreiben.
