  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: de
  text: Ihr urteilt nach dem Fleisch[a]; ich urteile über niemanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach menschlichen Maßstäben“ oder „nach dem äußeren Anschein“.'
    reason: Lexikalische und idiomatische Alternativen für κατὰ τὴν σάρκα.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt den Kontrast zu ἐγώ. Im Deutschen wird dieser Gegensatz durch „Ihr …; ich …“ klar und natürlich wiedergegeben.
- source_word: κατὰ τὴν σάρκα
  choice: nach dem Fleisch
  rationale: Die formnahe Wendung bewahrt die johanneische Ausdrucksweise und ihre Deutungsspannung. Sie bezeichnet hier wahrscheinlich ein Urteilen nach bloß menschlichen oder äußerlichen Maßstäben, ohne auf eine einzige Auslegung festgelegt zu werden.
- source_word: κρίνετε
  choice: urteilt
  rationale: Das Präsens κρίνετε wird direkt und idiomatisch mit „urteilt“ wiedergegeben.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bildet den antithetischen Gegenpol zu ὑμεῖς; die deutsche Satzstellung macht diesen Kontrast deutlich.
- source_word: οὐ κρίνω οὐδένα
  choice: ich urteile über niemanden
  rationale: „Über jemanden urteilen“ ist im modernen Deutschen eine natürliche Wiedergabe von κρίνω mit personalem Objekt. „Niemanden“ erhält die knappe und nachdrückliche Negation des Griechischen.
theological_decisions:
- issue: Bedeutung von σάρξ in κατὰ τὴν σάρκα
  choice: „Fleisch“ im Haupttext beibehalten
  alternative: „nach menschlichen Maßstäben“ oder „nach dem äußeren Anschein“
  rationale: Die wörtlichere Wiedergabe lässt offen, ob der Akzent auf menschlich-begrenzten, weltlichen oder äußerlichen Kriterien liegt, und vermeidet sowohl eine Verengung auf das äußere Erscheinungsbild als auch die Eintragung der Deutung „sündige Natur“.
- issue: Reichweite von „ich urteile über niemanden“
  choice: Die uneingeschränkte Formulierung des Verses bewahren
  alternative: Den Satz durch einen Zusatz wie „jetzt“ oder „auf diese Weise“ kontextuell einschränken
  rationale: Im griechischen Satz steht keine ausdrückliche zeitliche oder modale Einschränkung. Die Spannung zu anderen johanneischen Aussagen über Jesu Gericht soll nicht durch einen erklärenden Zusatz im Haupttext aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „Ihr …; ich …“ bewahrt den scharfen Kontrast des griechischen Satzes; das Semikolon erhält seine knappe antithetische Form.
