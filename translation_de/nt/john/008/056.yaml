  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Abraham wird als „euer Vater“ bezeichnet, seine starke Freude wird mit „jubelte“ passend ausgedrückt, und die anschließenden Aoriste werden klar als „Er sah ihn und freute sich“ wiedergegeben. „Meinen Tag“ bleibt bewusst offen. Die Wiedergabe „darüber, dass er meinen Tag sehen sollte“ bringt die vorausblickende Nuance der ἵνα-Konstruktion idiomatisch zum Ausdruck, ohne ihre genaue syntaktische Einordnung zu überentscheiden.'
