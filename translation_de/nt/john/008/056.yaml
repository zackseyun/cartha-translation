id: JHN.8.56
reference: John 8:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: de
  text: Abraham, euer Vater, jubelte darüber, dass er meinen Tag sehen sollte.[a][b] Er sah ihn und freute sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jubelte, um meinen Tag zu sehen“ oder „jubelte bei der Aussicht, meinen Tag zu sehen“. Die griechische Konstruktion lässt mehrere eng verwandte Wiedergaben zu.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Tag“ kann allgemein den messianischen Tag oder die Erfüllung des Wirkens Jesu bezeichnen; der Vers selbst bestimmt nicht genauer, welches Ereignis oder welcher Zeitpunkt gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Die im Deutschen eingebürgerte Namensform des Patriarchen.
- source_word: ὁ πατὴρ ὑμῶν
  choice: euer Vater
  rationale: Natürliche deutsche Wiedergabe, die die Beziehung zu den Angesprochenen unmittelbar ausdrückt.
- source_word: ἠγαλλιάσατο
  choice: jubelte
  rationale: Das Verb bezeichnet starke, überschwängliche Freude; „jubelte“ bildet diese Intensität deutlicher ab als das schlichtere „freute sich“ und unterscheidet es vom folgenden ἐχάρη.
- source_word: ἵνα ἴδῃ
  choice: darüber, dass er … sehen sollte
  rationale: Diese Formulierung bewahrt den erwartungsbezogenen Sinn und lässt zugleich die mögliche Zweck- oder Inhaltsnuance der ἵνα-Konstruktion offen.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: meinen Tag
  rationale: Nahe Wiedergabe der bewusst offenen und theologisch vielschichtigen griechischen Formulierung, ohne ein bestimmtes Ereignis einzutragen.
- source_word: καὶ εἶδεν
  choice: Er sah ihn
  rationale: Das Pronomen nimmt im Deutschen natürlich „meinen Tag“ auf; der Gegenstand ist im Griechischen aus dem vorherigen Satzglied erschließbar.
- source_word: καὶ ἐχάρη
  choice: und freute sich
  rationale: Gibt χαίρω natürlich wieder und erhält gegenüber dem stärkeren „jubelte“ die lexikalische Abstufung.
theological_decisions:
- issue: Bedeutung von „meinen Tag“
  choice: Die wörtliche und offene Formulierung „meinen Tag“ bleibt erhalten.
  alternative: Jesu irdisches Wirken, die messianische Heilszeit, Tod und Auferstehung oder der endzeitliche Tag Christi ausdrücklich benennen.
  rationale: Der Vers selbst legt nicht eindeutig fest, welches Ereignis oder welcher Zeitraum gemeint ist; die Übersetzung soll diese theologische Offenheit nicht auflösen.
- issue: Sinn der ἵνα-Konstruktion
  choice: „darüber, dass er … sehen sollte“ als erwartungsbezogene Wiedergabe
  alternative: „um … zu sehen“ oder „… zu sehen“
  rationale: Die Konstruktion kann eng verwandte Zweck- und Inhaltsnuancen tragen. Die gewählte Fassung klingt im Deutschen natürlich und markiert Abrahams vorausblickende Erwartung, ohne die grammatische Frage endgültig zu entscheiden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Jubelte“ wahrt die Stärke des ersten Freudeverbs; „freute sich“ gibt das zweite zurück. Die Fußnotenmarker stehen direkt nach der mehrdeutigen Wendung und sind in fortlaufender Reihenfolge gesetzt.
