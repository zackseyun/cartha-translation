source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: de
  text: 'Da sagten die Juden zu ihm: „Jetzt wissen wir, dass du einen Dämon hast.[a] Abraham ist gestorben, ebenso die Propheten, und du sagst: ‚Wenn jemand an meinem Wort festhält, wird er in Ewigkeit niemals den Tod schmecken.‘[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du von einem Dämon besessen bist“. Wörtlich: „dass du einen Dämon hast“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Formulierung ist besonders nachdrücklich: Er wird niemals, in alle Ewigkeit nicht, den Tod schmecken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die direkte Gruppenbezeichnung des griechischen Textes wird beibehalten; „die jüdischen Führer“ wäre eine kontextuelle Deutung, „die Judäer“ hier weniger natürlich.
- source_word: Νῦν ἐγνώκαμεν
  choice: Jetzt wissen wir
  rationale: Das Perfekt bezeichnet einen nun bestehenden Erkenntnisstand; diese Formulierung ist im Deutschen natürlich und präzise.
- source_word: δαιμόνιον ἔχεις
  choice: du einen Dämon hast
  rationale: Gibt die griechische Wendung wörtlich wieder, ohne sie im Haupttext als „besessen“ auszulegen.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Abraham ist gestorben, ebenso die Propheten
  rationale: Das deutsche Perfekt ist in direkter Rede natürlich; „ebenso“ verdeutlicht, dass auch die Propheten gestorben sind.
- source_word: καὶ σὺ λέγεις
  choice: und du sagst
  rationale: Bewahrt das griechische καί; der kontrastierende beziehungsweise vorwurfsvolle Sinn ergibt sich aus dem Zusammenhang.
- source_word: Ἐάν τις
  choice: Wenn jemand
  rationale: Natürliche generische Bedingungsformulierung ohne Einschränkung des Personenkreises.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: an meinem Wort festhält
  rationale: „Wort“ bewahrt λόγος; „festhalten“ gibt τηρέω als bewahren, beachten und treu daran halten wieder, ohne es ausschließlich auf Gehorsam zu verengen.
- source_word: οὐ μὴ γεύσηται θανάτου
  choice: wird er niemals den Tod schmecken
  rationale: „Den Tod schmecken“ erhält das transparente Bild; „niemals“ gibt die nachdrückliche Verneinung οὐ μή wieder.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste johanneische Wendung wird unmittelbar wiedergegeben und verstärkt zusammen mit οὐ μή die zeitlich uneingeschränkte Verneinung.
theological_decisions:
- issue: Bedeutung der Zusage über den Tod
  choice: Die bildhafte Wendung „den Tod schmecken“ bleibt ohne nähere Bestimmung stehen.
  alternative: Den Ausdruck ausdrücklich als körperlichen, geistlichen oder endgültigen beziehungsweise ewigen Tod deuten.
  rationale: Die Gegner verstehen die Aussage mit Blick auf das körperliche Sterben, während der johanneische Zusammenhang eine tiefere Bedeutung zulässt. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich; die johanneischen Schlüsselbegriffe „Wort“, „festhalten“ und „den Tod schmecken“ werden bewahrt. Sämtliche Fußnotenmarker stehen im Haupttext.
