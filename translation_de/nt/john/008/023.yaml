  source_fidelity: 'Der Text gibt die griechischen Kontraste genau wieder: die hervorgehobenen Personalpronomen, die parallelen Herkunftsaussagen „von unten/von oben“ sowie die zweimalige Zugehörigkeits- bzw. Herkunftsbestimmung mit ἐκ und „dieser Welt“. „Sagte“ ist für das erzählende Imperfekt ἔλεγεν im modernen deutschen Bibelstil eine vertretbare, idiomatische Wiedergabe, ohne den Sinn zu verändern.'
  naturalness: Die Formulierung ist flüssiges, modernes Standarddeutsch und wahrt die prägnante Parallelstruktur. „Aus dieser Welt“ ist hier absichtlich gewählt und verständlich, da es den im Griechischen wiederholten Herkunftsaspekt besser erhält als das im Deutschen stärker zugehörigkeitsbezogene „von dieser Welt“.
  terminology: „Welt“ ist die etablierte und ausreichend offene Wiedergabe von κόσμος. Die Fußnote erläutert den möglichen johanneischen Bedeutungshorizont zurückhaltend, ohne die Metapher im Übersetzungstext dogmatisch festzulegen. Die Begriffe „von unten/von oben“ bewahren die bildhafte und theologisch offene Antithese.
