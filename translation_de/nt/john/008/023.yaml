id: JHN.8.23
reference: John 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Ihr seid von unten, ich bin von oben. Ihr seid aus dieser Welt[a], ich bin nicht aus dieser Welt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Welt“ kann bei Johannes neben der geschaffenen Welt auch die von Gott entfremdete menschliche Ordnung gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt beschreibt hier das Sprechen im fortlaufenden Erzählzusammenhang. Im natürlichen modernen Deutsch ist das Präteritum „sagte“ angemessener als die schwerfällige Verlaufsform „war dabei zu sagen“.
- source_word: Ὑμεῖς / ἐγώ
  choice: ihr / ich
  rationale: Die ausdrücklich gesetzten Pronomen werden beibehalten und tragen den scharfen Kontrast zwischen den Angesprochenen und Jesus.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: von unten / von oben
  rationale: Die knappe, parallele Formulierung bewahrt sowohl das räumliche Bild als auch seine theologische Tiefendimension, ohne es durch „untere“ oder „himmlische Welt“ auszudeuten.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ ist die breite und im Johannesevangelium etablierte Entsprechung; sie lässt offen, wie stark hier neben der geschaffenen Welt auch die von Gott entfremdete menschliche Ordnung gemeint ist.
- source_word: ἐκ τούτου τοῦ κόσμου / ἐκ τοῦ κόσμου τούτου
  choice: aus dieser Welt
  rationale: „Aus“ gibt bei Welt beziehungsweise Herkunftsbereich die wiederholte Konstruktion mit ἐκ idiomatisch wieder und erhält in beiden Satzhälften die Betonung des Ursprungs.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: ich bin nicht aus dieser Welt
  rationale: Die Formulierung wahrt die Aussage über Herkunft oder Ursprung. „Ich gehöre nicht zu dieser Welt“ wäre verständlich, würde den Schwerpunkt aber stärker auf Zugehörigkeit verschieben.
theological_decisions:
- issue: Bedeutung des Gegensatzes „von unten/von oben“ und „aus dieser Welt“
  choice: Die Bildsprache von Herkunft und Bereich bleibt unaufgelöst erhalten.
  alternative: Eine stärker deutende Wiedergabe könnte ausdrücklich von einem irdischen beziehungsweise himmlischen oder moralisch bösen beziehungsweise göttlichen Bereich sprechen.
  rationale: Der griechische Text setzt einen scharfen johanneischen Gegensatz, bestimmt ihn hier aber nicht durch eine solche ausführliche Erklärung. Die Übersetzung soll die christologische Spannung bewahren, ohne sie konfessionell oder systematisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und der betonte Wechsel zwischen „ihr“ und „ich“ werden bewahrt. Nur eine Fußnote ist gesetzt; die mögliche Alternative „von dem, was unten/oben ist“ lässt sich im Deutschen weniger natürlich wiedergeben und bietet hier keinen hinreichenden zusätzlichen Erkenntniswert.
