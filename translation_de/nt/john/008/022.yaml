source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: de
  text: 'Da sagten die Juden[a]: »Er wird sich doch nicht selbst töten, weil er sagt: ›Wohin ich gehe, dorthin könnt ihr nicht kommen‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im johanneischen Zusammenhang möglicherweise: »die Judäer« oder »die jüdischen Führer«, je nachdem, wie weit die Bezeichnung hier gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das griechische Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen; im Deutschen gibt die schlichte Erzählform »sagten« den Kontext natürlich wieder, ohne eine im Deutschen schwerfällige Verlaufsform zu erzwingen.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die erzählerische Folgerung beziehungsweise Reaktion auf Jesu vorherige Aussage; »Da« ist in diesem Zusammenhang natürlich und wahrt den Anschluss.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies ist die direkte lexikalische Wiedergabe. Im Johannesevangelium kann der Ausdruck je nach Kontext enger die Judäer oder bestimmte jüdische Gegner beziehungsweise führende Kreise bezeichnen; da der Vers selbst den Bezug nicht ausdrücklich eingrenzt, bleibt diese Offenheit in einer Fußnote erhalten.
- source_word: Μήτι
  choice: doch nicht
  rationale: Die Partikel leitet eine Frage ein, auf die eine verneinende Antwort erwartet wird. »Er wird sich doch nicht …?« gibt diese skeptische Erwartung idiomatisch wieder.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: wird sich selbst töten
  rationale: Direkte und moderne Wiedergabe des Futurs mit reflexivem Objekt.
- source_word: ὅτι
  choice: weil
  rationale: 'Leitet hier den Grund für die Vermutung ein: Die Sprecher folgern aus Jesu Aussage. »Weil« gibt diesen erklärenden Zusammenhang klar wieder.'
- source_word: λέγει
  choice: er sagt
  rationale: Bewahrt das griechische Präsens und die lebendige Bezugnahme auf Jesu soeben geäußerte Worte.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Wohin ich gehe
  rationale: ὑπάγω bezeichnet das Gehen beziehungsweise Weggehen. »Wohin ich gehe« ist natürlich und legt die Art des Fortgehens nicht über den Ausgangstext hinaus fest.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: dorthin könnt ihr nicht kommen
  rationale: Gibt die ausgedrückte Unfähigkeit knapp und idiomatisch wieder; »dorthin« entspricht im Deutschen natürlich dem vorausgehenden »Wohin«.
theological_decisions:
- issue: Bezugsgruppe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext steht die direkte Wiedergabe »die Juden«.
  alternative: Je nach johanneischem Kontext sind auch »die Judäer« oder »die jüdischen Führer« als engeres Verständnis möglich.
  rationale: Der griechische Ausdruck grenzt die Bezugsgruppe in diesem Vers nicht ausdrücklich ein. Eine engere Wiedergabe im Haupttext würde eine kontextuelle Deutung festschreiben; die Fußnote bewahrt deshalb die mögliche Bedeutungsbreite und beugt einer pauschalen ethnischen Lesart vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert; die negative Erwartung der Frage bleibt durch »doch nicht« erhalten. Der historisch und kontextuell mehrdeutige Gruppenbegriff wird im Haupttext formal bewahrt und in der Fußnote erläutert.
