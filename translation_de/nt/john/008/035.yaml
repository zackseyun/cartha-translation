id: JHN.8.35
reference: John 8:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: de
  text: Der Sklave[a] aber bleibt nicht für immer im Haus; der Sohn[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knecht“ beziehungsweise „Diener“. Das griechische Wort bezeichnet hier jedoch einen unfreien Menschen; „Sklave“ verdeutlicht seinen vom Sohn unterschiedenen Status im Haus.'
    reason: lexical_alternative
  - marker: b
    text: „Der Sohn“ kann im Zusammenhang zugleich auf Jesus anspielen, obwohl der Satz auch wie ein allgemeiner Grundsatz über die Stellung im Haus formuliert ist.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: „Sklave“ gibt den rechtlich und sozial unfreien Status wieder, der für den Gegensatz zum Sohn entscheidend ist. „Diener“ würde diesen Status abschwächen.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ ist natürliches modernes Deutsch und bewahrt die Wiederholung desselben griechischen Verbs in beiden Satzhälften.
- source_word: οἰκία
  choice: Haus
  rationale: „Haus“ entspricht dem griechischen Ausdruck eng und kann hier zugleich das Gebäude und die soziale Hausgemeinschaft bezeichnen. Der Zusammenhang mit Sklave und Sohn macht die Zugehörigkeit zum Haushalt deutlich.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die geläufige deutsche Wendung drückt in beiden Satzhälften die unbegrenzte Dauer aus und bewahrt die Parallelität.
- source_word: υἱός
  choice: Sohn
  rationale: Der maskuline Singular wird genau wiedergegeben und erhält sowohl den sprichwortartigen Gegensatz zum Sklaven als auch den möglichen Bezug auf Jesus.
- source_word: δέ
  choice: aber
  rationale: „Aber“ macht den weiterführenden Kontrast zum vorausgehenden Gedanken und innerhalb des Spruchs knapp sichtbar, ohne ein im Griechischen nicht vorhandenes Zeitadverb einzuführen.
theological_decisions:
- issue: Möglicher christologischer Anklang von „der Sohn“
  choice: „der Sohn“ kleingeschrieben und mit bestimmtem Artikel
  alternative: „der Sohn“ als ausdrücklicher Christustitel beziehungsweise typografisch hervorgehoben
  rationale: Der Satz ist zugleich sprichwortartig formuliert und bereitet Jesu Anwendung im folgenden Vers vor. Die nicht hervorgehobene Form bewahrt diese Spannung, statt den möglichen Bezug auf Jesus schon hier eindeutig festzulegen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „bleibt“ und „für immer“ bilden die griechische Gegenüberstellung nach. „Im Haus“ lässt den räumlichen und den sozialen Sinn bewusst zusammenklingen.
