  source_fidelity: Der Text gibt die Satzglieder, den Kontrast durch δέ, die Wiederholung von μένει sowie die zweimalige Dauerangabe εἰς τὸν αἰῶνα angemessen wieder. „Sklave“ trifft δοῦλος im hier statusbezogenen Haus-Kontrast präzise; „im Haus“ ist für οἰκία möglich und lässt den räumlichen wie sozialen Bezug offen.
  naturalness: „Der Sklave aber …; der Sohn …“ ist knappes, modernes und zugleich würdiges Standarddeutsch. Die leicht markierte Stellung von „aber“ passt zum sentenzhaften Stil; „bleibt“ und „für immer“ bewahren die klare Parallelität.
  terminology: „Sklave“, „Haus“ und „Sohn“ sind konsistent und sachgerecht. Die Kleinschreibung von „Sohn“ legt die mögliche christologische Resonanz nicht voreilig als Titel fest. Die Fußnoten sind idiomatisch, inhaltlich zurückhaltend und an den passenden Ausdrücken verankert.
