  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: de
  text: Ich rede von dem, was ich beim Vater gesehen habe; und ihr tut also, was ihr von eurem Vater[a] gehört habt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dem Vater“. Wer mit dem zweiten „Vater“ gemeint ist, wird hier noch nicht ausdrücklich gesagt; siehe Vers 44.'
    reason: Die Übersetzung ergänzt das im Kontext nahegelegte Possessivpronomen, bewahrt aber die rhetorische Entwicklung des Abschnitts.
  - marker: b
    text: 'Oder als Aufforderung: „Und so tut auch ihr, was ihr von eurem Vater gehört habt.“ Die griechische Verbform kann sowohl Aussage als auch Aufforderung sein.'
    reason: Die morphologische Mehrdeutigkeit von ποιεῖτε lässt sich im deutschen Haupttext nicht vollständig erhalten.
lexical_decisions:
- source_word: ἃ
  choice: von dem, was
  rationale: Das substantivierte Relativpronomen bezeichnet den Inhalt des Redens. Die deutsche Wendung „von dem, was“ ist natürlich und gibt den Sachbezug wieder.
- source_word: ἑώρακα
  choice: ich … gesehen habe
  rationale: Das Perfekt bezeichnet ein Sehen in der Vergangenheit mit fortdauernder Bedeutung; das deutsche Perfekt passt hier idiomatisch.
- source_word: παρὰ τῷ πατρὶ
  choice: beim Vater
  rationale: 'παρά mit Dativ bezeichnet hier Nähe beziehungsweise Gegenwart: Jesus hat es beim Vater, das heißt in dessen Gegenwart, gesehen.'
- source_word: λαλῶ
  choice: Ich rede von
  rationale: λαλέω bedeutet „reden, sprechen“. „Von dem … reden“ verbindet das Verb im Deutschen natürlich mit seinem inhaltlichen Gegenstand, ohne die Aussage zu erweitern.
- source_word: καὶ ὑμεῖς οὖν
  choice: und so tut auch ihr
  rationale: „So“ gibt die folgernde beziehungsweise vergleichende Funktion von οὖν wieder; „auch ihr“ bewahrt die betonte Gegenüberstellung zwischen Jesus und seinen Gesprächspartnern.
- source_word: παρὰ τοῦ πατρὸς
  choice: von eurem Vater
  rationale: παρά mit Genitiv bezeichnet die Quelle. Das Possessivpronomen steht nicht ausdrücklich im Griechischen, ist aber durch die Gegenüberstellung der jeweiligen Väter stark nahegelegt und im Deutschen zur Unterscheidung hilfreich.
- source_word: ποιεῖτε
  choice: tut
  rationale: Die Form kann grammatisch Indikativ oder Imperativ sein. Im Haupttext wird sie entsprechend dem argumentativen Zusammenhang als Indikativ verstanden; die mögliche Aufforderung wird in einer Fußnote genannt.
theological_decisions:
- issue: Identität des zweiten Vaters
  choice: „eurem Vater“, ohne ihn in diesem Vers ausdrücklich zu benennen
  alternative: „dem Vater“ oder vorwegnehmend „dem Teufel“
  rationale: Der griechische Text enthält nur „dem Vater“ und benennt dessen Identität hier noch nicht ausdrücklich. Das ergänzte „eurem“ verdeutlicht die Gegenüberstellung, ohne die erst in Vers 44 ausgesprochene Identifizierung vorwegzunehmen.
- issue: Aussage oder Aufforderung bei ποιεῖτε
  choice: 'Indikativ: „ihr tut“'
  alternative: 'Imperativ: „tut“'
  rationale: Beide Deutungen sind aufgrund der identischen griechischen Verbform möglich. Der Indikativ passt zur folgenden Entlarvung ihres Handelns; die echte grammatische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Beim Vater“ gibt die räumlich-relationale Bedeutung von παρά mit Dativ knapp und natürlich wieder. Der parallele Gegensatz zwischen Jesu Sehen und ihrem Hören sowie zwischen Reden und Tun bleibt erhalten.
