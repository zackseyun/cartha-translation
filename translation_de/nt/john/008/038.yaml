  terminology: „Vater“ für den ersten Bezug ist angemessen großgeschrieben; „eurem Vater“ hält den zweiten Bezug bewusst offen. Die Fußnote zur möglichen Imperativdeutung ist sachgerecht, muss aber den korrigierten indikativischen Haupttext präzise beschreiben.
