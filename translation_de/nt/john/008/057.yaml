  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: de
  text: 'Da sagten die Juden[a] zu ihm: „Du bist noch keine fünfzig Jahre alt und hast Abraham gesehen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“ beziehungsweise „die jüdischen Autoritäten“, je nachdem, wie weit Johannes die Bezeichnung hier fasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies ist die direkte Wiedergabe der johanneischen Gruppenbezeichnung. Der Kontext legt nicht ausdrücklich fest, dass ausschließlich führende Personen gemeint sind; mögliche engere oder regionale Bedeutungen werden daher in einer Fußnote offengehalten.
- source_word: οὖν
  choice: Da
  rationale: Das folgernde beziehungsweise anknüpfende οὖν verbindet die Reaktion mit der vorangehenden Aussage Jesu. „Da“ ist im Deutschen natürlich und wahrt den erzählerischen Zusammenhang.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Du bist noch keine fünfzig Jahre alt
  rationale: Die griechische Altersangabe mit „Jahre haben“ wird idiomatisch und präzise ins Deutsche übertragen.
- source_word: ἑώρακας
  choice: hast ... gesehen
  rationale: Das Perfekt von ὁράω wird mit dem deutschen Perfekt wiedergegeben. So bleibt die ungläubig-staunende Frage erhalten, ohne sie interpretierend umzuformen.
- source_word: καὶ
  choice: und
  rationale: Das einfache Bindewort wird direkt wiedergegeben; im rhetorischen Fragesatz trägt „und“ den Ausdruck des Unglaubens natürlich mit.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Die im Deutschen etablierte Form des Personennamens wird verwendet.
theological_decisions:
- issue: Bedeutungsumfang von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer; die jüdischen Autoritäten
  rationale: Der griechische Ausdruck kann je nach Kontext das jüdische Volk, Menschen aus Judäa oder bestimmte jüdische Autoritäten bezeichnen. Da dieser Vers den Kreis nicht ausdrücklich auf führende Personen begrenzt, bleibt die breite, formnahe Wiedergabe im Haupttext stehen; die kontextuell möglichen Alternativen werden transparent vermerkt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Form der ungläubigen Frage und das griechische Perfekt werden ohne erklärende Zusätze bewahrt.
