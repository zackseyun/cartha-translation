  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: de
  text: Während er dies sagte, glaubten viele an ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: dies
  rationale: Das substantivische „dies“ verweist im natürlichen Deutschen auf den Inhalt der vorausgehenden Rede. Obwohl das Griechische formal im Plural steht, wäre „diese Dinge“ hier unnötig wörtlich und weniger idiomatisch.
- source_word: αὐτοῦ λαλοῦντος
  choice: Während er … sagte
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig andauernde Handlung. „Während er dies sagte“ gibt diesen zeitlichen Zusammenhang natürlich wieder.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv lässt sich ebenso knapp und genau mit „viele“ wiedergeben.
- source_word: ἐπίστευσαν
  choice: kamen … zum Glauben
  rationale: Die Form bezeichnet das Glaubensgeschehen als Ganzes. Zusammen mit „an ihn“ ist „zum Glauben an ihn kommen“ im Deutschen idiomatisch und verdeutlicht den Eintritt in den Glauben, ohne dessen spätere Beständigkeit vorwegzunehmen.
- source_word: εἰς αὐτόν
  choice: an ihn
  rationale: Bei πιστεύω mit εἰς bezeichnet die Wendung im Johannesevangelium auf Jesus gerichtetes Vertrauen. Die übliche deutsche Entsprechung lautet „an ihn glauben“.
theological_decisions:
- issue: Wiedergabe von πιστεύω εἰς αὐτόν im johanneischen Sprachgebrauch
  choice: kamen zum Glauben an ihn
  alternative: glaubten ihm
  rationale: „An ihn glauben“ bewahrt die personale Ausrichtung der Konstruktion mit εἰς; „ihm glauben“ könnte dagegen lediglich bedeuten, seine Aussagen für wahr zu halten. Der Vers selbst entscheidet noch nicht über Tiefe oder Dauer dieses Glaubens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bildet den zeitlichen Zusammenhang klar ab; auf Fußnoten wurde verzichtet, da die bedeutenden Nuancen im Haupttext natürlich wiedergegeben werden können.
