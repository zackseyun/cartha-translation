id: JHN.8.21
reference: John 8:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: de
  text: 'Da sagte er noch einmal zu ihnen: „Ich gehe fort, und ihr werdet mich suchen[a], und ihr werdet in eurer Sünde sterben[b]. Wohin ich gehe, dorthin könnt ihr nicht kommen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach mir suchen“. Das Verb kann eine konkrete Suche bezeichnen und bei Johannes zugleich einen tieferen geistlichen Sinn tragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen der Singular: „in eurer Sünde“. Er kann einen fortdauernden Zustand bezeichnen, nicht nur einzelne sündige Taten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „seid ihr nicht imstande zu kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Fortsetzung beziehungsweise Folgerung aus dem vorausgehenden Gespräch; „Da“ ist im Deutschen natürlich, ohne den Zusammenhang zu stark als logischen Schluss festzulegen.
- source_word: πάλιν
  choice: noch einmal
  rationale: Gibt die Wiederholung idiomatisch und eindeutig wieder.
- source_word: ὑπάγω
  choice: ich gehe fort
  rationale: Bewahrt den Gedanken des Weggehens, der bei Johannes über eine bloße Ortsveränderung hinausweisen kann, ohne das Ziel ausdrücklich auszudeuten.
- source_word: ζητήσετέ με
  choice: ihr werdet mich suchen
  rationale: „Suchen“ kann sowohl die konkrete Suche als auch den möglichen tieferen geistlichen Sinn im Johannesevangelium tragen.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: in eurer Sünde
  rationale: Bewahrt Präposition und Singular des griechischen Textes; der Singular kann einen fortdauernden Zustand bezeichnen.
- source_word: ἀποθανεῖσθε
  choice: ihr werdet sterben
  rationale: Natürliche Wiedergabe der Futurform.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Wohin ich gehe
  rationale: „Wohin“ ist bei einer zielgerichteten Bewegung im modernen Deutschen idiomatisch; die Wiederholung von ὑπάγω bleibt durch „gehe“ erkennbar.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: dorthin könnt ihr nicht kommen
  rationale: Gibt die ausdrücklich bezeichnete Unfähigkeit mit „könnt“ wieder und stellt durch „dorthin“ einen natürlichen Bezug zu „wohin“ her.
theological_decisions:
- issue: Singular ἁμαρτίᾳ gegenüber einer idiomatisch möglichen Mehrzahl
  choice: in eurer Sünde
  alternative: in euren Sünden
  rationale: Der Singular des Ausgangstextes bleibt erhalten. So wird die mögliche Aussage über einen Zustand der Sünde beziehungsweise des Unglaubens nicht auf einzelne Verfehlungen verengt.
- issue: Bedeutungsweite von Jesu Weggehen
  choice: Ich gehe fort
  alternative: Ich gehe / Ich scheide
  rationale: „Ich gehe fort“ lässt sowohl das unmittelbare Weggehen als auch die johanneische Tiefendimension von Tod, Auferstehung und Rückkehr zum Vater offen, ohne diese im Vers auszuschreiben.
- issue: Verhältnis von Suchen und Nichtfinden
  choice: ihr werdet mich suchen
  alternative: ihr werdet nach mir suchen
  rationale: Die knappe Form wahrt die mögliche geistliche Tiefendimension des Verbs, ohne festzulegen, aus welchem Motiv oder auf welche Weise die Angeredeten suchen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Gedankengang, wird aber durch „wohin … dorthin“ natürlich deutsch gestaltet. Der Singular „Sünde“ und die modale Aussage „könnt … nicht“ werden bewusst bewahrt.
