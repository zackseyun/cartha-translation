review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt οὐκ ἔγνωσαν zutreffend kontextuell mit „verstanden nicht“ wieder und bewahrt mit „dass“ den Inhaltssatz. „Vater“ ist im johanneischen Kontext als Gottesbezeichnung angemessen großgeschrieben. Die dative Adressatenangabe αὐτοῖς sollte jedoch zusammen mit dem Redegegenstand klarer wiedergegeben werden.
  naturalness: „zu ihnen vom Vater sprach“ ist zwar verständlich, aber im modernen Standarddeutsch keine natürliche Verbindung. Bei „von jemandem sprechen“ steht die Person, zu der gesprochen wird, besser getrennt vom Gegenstand der Rede.
  terminology: „der Vater“ ist als kontextuell bestimmte Gottesbezeichnung korrekt. Die Fußnotenalternative sollte die naheliegende lexikalische Möglichkeit „wussten nicht“ dokumentieren; „erkannten nicht“ ist möglich, aber in diesem Satz weniger idiomatisch.
