    rationale: Das Griechische unterscheidet klar zwischen αὐτοῖς („zu ihnen“) und τὸν πατέρα als Gegenstand der Rede. „zu ihnen über den Vater sprach“ bildet beide Beziehungen im Deutschen natürlich und eindeutig ab.
  - severity: low
    issue: Fußnotenalternative ist weniger naheliegend als „wussten nicht“
    rationale: Für οὐκ ἔγνωσαν ist „wussten nicht“ die unmittelbare lexikalische Alternative und entspricht auch dem englischen Audit-Trail; „verstanden nicht“ bleibt im Kontext die bevorzugte Hauptlesart.
