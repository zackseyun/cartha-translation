  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: de
  text: Sie verstanden nicht, dass er zu ihnen über den Vater sprach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie wussten nicht, dass er zu ihnen über den Vater sprach.'
    reason: 'Lexikalische Alternative: γινώσκω kann hier auch mit „wissen“ wiedergegeben werden.'
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Sie verstanden nicht
  rationale: γινώσκω kann „wissen“, „erkennen“ oder kontextuell „verstehen“ bedeuten. Hier erfassten die Angesprochenen nicht, wen Jesus meinte; „verstanden nicht“ gibt dies in natürlichem Deutsch wieder.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt dessen ein, was sie nicht verstanden; der deutsche Inhaltssatz mit „dass“ entspricht dieser Funktion.
- source_word: τὸν πατέρα
  choice: vom Vater
  rationale: Der Akkusativ bezeichnet den Gegenstand von Jesu Rede. Im johanneischen Kontext ist Gott als Jesu Vater gemeint; „vom Vater“ ist idiomatisches Deutsch und die Großschreibung kennzeichnet die kontextuell bestimmte Gottesbezeichnung.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ bei λέγω bezeichnet die Adressaten und wird im Deutschen natürlich mit „zu ihnen“ wiedergegeben.
- source_word: ἔλεγεν
  choice: sprach
  rationale: Das Imperfekt stellt Jesu Reden als im Verlauf befindlich dar. Im deutschen Nebensatz ist „sprach“ idiomatisch; eine Verlaufsform wie „am Sprechen war“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Bezug von „der Vater“
  choice: Die Großschreibung „Vater“ zeigt, dass im Kontext Gott als Jesu Vater gemeint ist.
  alternative: Bezug auf einen menschlichen Vater
  rationale: Der unmittelbare johanneische Zusammenhang gebraucht „der Vater“ als Bezeichnung Gottes. Die Übersetzung macht diese kontextuelle Referenz kenntlich, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Bedeutung von γινώσκω an dieser Stelle
  choice: „verstehen“
  alternative: „wissen“ oder „erkennen“
  rationale: Der Satz beschreibt, dass die Zuhörer den Bezug von Jesu Worten nicht erfassten. „Verstehen“ bringt diesen Sinn im modernen Deutsch am klarsten zum Ausdruck; die lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; „vom Vater sprechen“ ist idiomatischer als eine mechanische Wiedergabe des griechischen Akkusativs.
