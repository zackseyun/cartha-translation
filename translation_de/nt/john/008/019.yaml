  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: de
  text: 'Da fragten sie ihn: »Wo ist dein Vater?« Jesus antwortete: »Ihr kennt weder mich noch meinen Vater. Wenn ihr mich kennen würdet, würdet ihr auch meinen Vater kennen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich, mit stärker vergangenheitsbezogener Wiedergabe: »Wenn ihr mich gekannt hättet, hättet ihr auch meinen Vater gekannt.« Die griechische Bedingung stellt den Sachverhalt als nicht erfüllt dar; im Zusammenhang liegt jedoch ein Gegenwartsbezug näher.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν αὐτῷ
  choice: Da fragten sie ihn
  rationale: Das Imperfekt ἔλεγον führt die Reaktion der Gesprächspartner im Erzählfluss fort; bei einer direkten Frage ist „fragten“ im Deutschen natürlicher als das formalere „sagten zu ihm“. „Da“ gibt die weiterführende Funktion von οὖν knapp wieder, ohne eine stärkere Schlussfolgerung zu behaupten.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Wo ist dein Vater?
  rationale: Die direkte, möglicherweise missverstehende Frage bleibt unverändert knapp. „Vater“ wird im Deutschen als Substantiv ohnehin großgeschrieben und legt daher typografisch nicht vorab fest, ob die Sprecher Jesu menschlichen Vater oder Gott meinen.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Ihr kennt weder mich noch meinen Vater
  rationale: „weder … noch“ bildet οὔτε … οὔτε genau ab. „kennen“ ist bei Personen idiomatischer als „wissen“ und bewahrt sowohl persönliche Vertrautheit als auch Erkenntnis, ohne den Sinn auf bloßes Verstehen oder Wiedererkennen zu verengen.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Wenn ihr mich kennen würdet, würdet ihr auch meinen Vater kennen
  rationale: Der deutsche Konjunktiv II gibt die als nicht erfüllt dargestellte gegenwärtige Bedingung natürlich wieder. „auch“ entspricht καί und verbindet die Erkenntnis des Vaters mit der Erkenntnis Jesu.
theological_decisions:
- issue: Zusammenhang zwischen der Erkenntnis Jesu und der Erkenntnis des Vaters
  choice: Das breite Verb „kennen“ wird in beiden Satzteilen beibehalten.
  alternative: „erkennen“ oder „verstehen“
  rationale: Die lexikalische Wiederholung wahrt den johanneischen Zusammenhang und lässt offen, in welchem Maß persönliche Beziehung, Anerkennung und Einsicht gemeint sind.
- issue: Referent von „Vater“ in der Frage der Gesprächspartner
  choice: Die Formulierung „dein Vater“ bleibt ohne erklärenden Zusatz.
  alternative: „Gott, dein Vater“ oder eine andere ausdrückliche Identifizierung
  rationale: Der Kontext weist auf Gott als Jesu Vater, doch die Frage kann zugleich das Unverständnis der Sprecher erkennen lassen. Ein Zusatz würde diese Spannung vorzeitig auflösen.
- issue: Zeitbezug des irrealen Bedingungssatzes
  choice: 'Gegenwartsbezogener Konjunktiv II: „Wenn ihr mich kennen würdet …“'
  alternative: 'Vergangenheitsbezogen: „Wenn ihr mich gekannt hättet, hättet ihr auch meinen Vater gekannt.“'
  rationale: Obwohl die griechischen Formen formal auf οἶδα zurückgehen und unterschiedlich wiedergegeben werden können, bezeichnet der Zusammenhang am natürlichsten eine gegenwärtig nicht erfüllte Bedingung. Die alternative Wiedergabe wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „fragten“ vermeidet eine im Deutschen schwerfällige Nachbildung von „sagten zu ihm“, und der Konjunktiv II klingt natürlich, ohne die theologische Aussage auszudeuten.
