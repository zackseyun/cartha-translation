id: JHN.8.33
reference: John 8:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: de
  text: 'Sie antworteten ihm: „Wir sind Abrahams Nachkommen[a] und sind noch nie jemandes Sklaven gewesen[b]. Wie kannst du da sagen: ‚Ihr werdet frei werden[c]‘?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Abrahams Same“. Das Griechische verwendet einen kollektiven Singular für die leibliche Abstammung.
    reason: lexical_alternative
  - marker: b
    text: Oder „haben noch nie jemandem gedient“. Das Verb kann „dienen“ bedeuten; im Zusammenhang mit Freiheit und Sklaverei steht hier jedoch die Unfreiheit im Vordergrund.
    reason: lexical_alternative
  - marker: c
    text: Oder „Ihr werdet frei sein“. Das Griechische sagt genauer „Ihr werdet frei werden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Sie antworteten ihm
  rationale: Das ist die natürliche deutsche Wiedergabe einer unmittelbar an Jesus gerichteten Antwort.
- source_word: Σπέρμα Ἀβραάμ
  choice: Abrahams Nachkommen
  rationale: σπέρμα ist hier eine kollektive Singularform für leibliche Abstammung. „Nachkommen“ gibt den Sinn im heutigen Deutsch natürlich wieder; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: sind noch nie jemandes Sklaven gewesen
  rationale: Im Gegensatz von Sklaverei und Freiheit in diesem Abschnitt ist die Bedeutung der Unfreiheit stärker als das allgemeinere „dienen“. Die Formulierung gibt außerdem den resultativen Aspekt des Perfekts idiomatisch wieder.
- source_word: πῶς σὺ λέγεις
  choice: Wie kannst du da sagen
  rationale: „Wie kannst du da sagen“ bringt den ungläubigen Einwand und die Hervorhebung von σὺ in natürlichem Deutsch zum Ausdruck.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Ihr werdet frei werden
  rationale: „frei werden“ bewahrt gegenüber dem bloßen „frei sein“ den durch γίνομαι bezeichneten Übergang in einen neuen Zustand.
theological_decisions:
- issue: Wiedergabe von δουλεύω im Gegensatz zwischen Sklaverei und Freiheit
  choice: Sklaven gewesen
  alternative: gedient / versklavt gewesen
  rationale: Der unmittelbare Zusammenhang in Johannes 8,34–36 handelt ausdrücklich von Sklaverei und Freiheit. Die gewählte Formulierung erhält diese soziale und theologische Spannung, ohne die Aussage zusätzlich auszulegen.
- issue: Wiedergabe von Σπέρμα Ἀβραάμ
  choice: Abrahams Nachkommen
  alternative: Abrahams Same / Nachkommenschaft Abrahams
  rationale: Die Aussage bezeichnet zunächst den Anspruch auf leibliche Abstammung. „Nachkommen“ ist verständlich und vermeidet, andere theologische Verwendungen von „Same“ in den Vers hineinzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählregister. Der rhetorische Einwand wird durch „da“ natürlich markiert; die Anrede im Zitat bleibt beim pluralischen „ihr“.
