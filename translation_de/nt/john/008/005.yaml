  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: de
  text: In unserem Gesetz hat Mose angeordnet, dass solche Frauen gesteinigt werden.[a] Was sagst du also dazu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fortsetzung der Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11). Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: In unserem Gesetz
  rationale: Gibt die Zugehörigkeit des Gesetzes und den Satzanschluss natürlich wieder; δέ wird nicht mit einem unnötigen deutschen Diskurswort überladen.
- source_word: ἐνετείλατο
  choice: hat … befohlen
  rationale: Bezeichnet eine verbindliche Anordnung; das Perfekt ist in modernem Standarddeutsch für den zurückliegenden, weiterhin relevanten Befehl natürlich.
- source_word: τὰς τοιαύτας
  choice: solche Frauen
  rationale: Der feminine Akkusativ Plural verweist im Zusammenhang auf Frauen dieser Art; die Formulierung lässt den konkreten Bezug aus dem Kontext hervorgehen.
- source_word: λιθοβολεῖσθαι
  choice: zu steinigen
  rationale: Gibt die angeordnete Hinrichtungsart knapp und idiomatisch wieder; die aktive deutsche Konstruktion folgt auf „uns befohlen“, während das griechische Passiv sachlich gewahrt bleibt.
- source_word: σὺ οὖν τί λέγεις;
  choice: Was sagst du nun dazu?
  rationale: Das betonte σὺ wird durch die direkte Anrede getragen; οὖν bezeichnet hier die Folgerung aus der Berufung auf Mose und wird mit „nun“ natürlich wiedergegeben.
theological_decisions:
- issue: Reichweite des mosaischen Gebots
  choice: Die Sprecher behaupten allgemein, Mose habe die Steinigung „solcher Frauen“ befohlen.
  alternative: Den Satz so erweitern, dass ausdrücklich beide am Ehebruch Beteiligten oder bestimmte rechtliche Voraussetzungen genannt werden.
  rationale: Die Übersetzung gibt die Formulierung der Sprecher wieder, ohne sie mit weiteren Bestimmungen aus den einschlägigen Gesetzestexten zu harmonisieren oder ihre Darstellung stillschweigend zu korrigieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Steinigen“ ist der geläufige und sachlich genaue Ausdruck. Der Fußnotenmarker steht nach dem ersten Satz, auf den die textkritische Anmerkung zur Überlieferung der gesamten Erzählung bezogen ist.
