    issue: Das hinzugefügte „uns“ in „hat Mose uns befohlen“ ist im Ausgangstext nicht ausdrücklich vorhanden.
    rationale: ἐνετείλατο regiert hier den passiven Infinitiv λιθοβολεῖσθαι; der Text bezeichnet keine konkrete Gruppe als Empfänger oder Vollstrecker des Befehls. Eine unpersönliche deutsche Wiedergabe wahrt diese Offenheit.
  revised_text: In unserem Gesetz hat Mose angeordnet, dass solche Frauen gesteinigt werden.[a] Was sagst du also dazu?
  revised_footnotes:
