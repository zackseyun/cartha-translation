review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die wesentlichen Aussagen: das Gesetz als „unser Gesetz“, Mose als Anordnenden, den femininen Bezug von „solche Frauen“, die Steinigung und die an Jesus gerichtete Frage. Die Konstruktion „hat Mose uns befohlen, solche Frauen zu steinigen“ fügt jedoch ein im griechischen Text nicht genanntes „uns“ als Adressaten bzw. Ausführende hinzu und macht die Sprecher zu den ausdrücklich Beauftragten. Das griechische Passiv sagt lediglich, dass solche Frauen gesteinigt werden sollen.'
  naturalness: Die vorgeschlagene Umformung mit einem dass-Satz ist modernes, klares Standarddeutsch und vermeidet die missverständliche Infinitivkonstruktion. „Was sagst du also dazu?“ gibt die folgernde Kraft von οὖν natürlich wieder.
  terminology: „Gesetz“, „Mose“, „solche Frauen“ und „gesteinigt werden“ sind sachlich präzise und im würdigen Bibelregister idiomatisch. Die textkritische Fußnote ist korrekt verankert und angemessen formuliert.
