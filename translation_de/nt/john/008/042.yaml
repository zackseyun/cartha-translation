source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Wenn Gott euer Vater wäre, würdet ihr mich lieben; denn ich bin von Gott ausgegangen und hierhergekommen. Ich bin ja nicht von mir selbst gekommen,[a] sondern er hat mich gesandt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin ja nicht von mir aus gekommen.“ Der griechische Ausdruck kann sowohl die Herkunft als auch eine eigenständige Initiative betreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν, ἠγαπᾶτε ἂν ἐμέ
  choice: Wenn Gott euer Vater wäre, würdet ihr mich lieben
  rationale: Der deutsche Konjunktiv II gibt die im Griechischen als irreal dargestellte Bedingung natürlich und präzise wieder.
- source_word: ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: denn ich bin von Gott ausgegangen
  rationale: „Von Gott ausgegangen“ bewahrt die Herkunfts- und Ausgangssprache von ἐκ und ἐξέρχομαι, ohne daraus einen späteren theologischen Fachausdruck zu machen.
- source_word: καὶ ἥκω
  choice: und hier
  rationale: 'ἥκω bezeichnet das Gekommensein mit gegenwärtigem Ergebnis. Im Deutschen ergänzt „und hier“ idiomatisch „bin“ aus dem vorangehenden Verb: „ich bin … hier“.'
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Ich bin ja nicht von mir selbst gekommen
  rationale: „Von mir selbst“ erhält die sprachliche Parallele zu „von Gott“ und lässt zugleich die mögliche Bedeutung eigenständiger Initiative offen. „Ja“ gibt die begründende beziehungsweise bestätigende Kraft von γάρ natürlich wieder.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: sondern er hat mich gesandt
  rationale: „Gesandt“ bewahrt die Sendungssprache von ἀποστέλλω; „er“ verweist im Deutschen eindeutig auf Gott, ohne das betonte ἐκεῖνος unnatürlich als „jener“ wiederzugeben.
theological_decisions:
- issue: Jesu Herkunft von Gott
  choice: ich bin von Gott ausgegangen und hier
  alternative: ich bin von Gott gekommen und bin hier
  rationale: Die gewählte Fassung bewahrt die Bewegung vom Ursprung her, ohne die Aussage durch spätere dogmatische Terminologie näher festzulegen.
- issue: Bedeutung von ἀπ’ ἐμαυτοῦ
  choice: nicht von mir selbst gekommen
  alternative: nicht von mir aus gekommen
  rationale: Die Hauptfassung hält die Herkunftssprache parallel zu „von Gott“ fest; die Alternative macht den ebenfalls möglichen Akzent auf eigenständiger Initiative deutlich und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Konjunktiv II macht die irreale Bedingung klar. „Ausgegangen“ ist bewusst etwas formeller als „gekommen“, bleibt aber verständlich und bildet die griechische Herkunftssprache genauer ab.
