source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: de
  text: Doch jetzt seid ihr darauf aus, mich zu töten – einen Menschen, der euch die Wahrheit gesagt hat, die ich von Gott gehört habe. Das hat Abraham nicht getan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Doch jetzt
  rationale: Gibt sowohl den zeitlichen Gegensatz von νῦν als auch die adversative Kraft von δέ knapp und natürlich wieder.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: versucht ihr, mich zu töten
  rationale: ζητέω mit Infinitiv bezeichnet hier das zielgerichtete Bestreben, etwas zu tun. „Versucht“ ist im modernen Deutschen natürlicher als „sucht“ und bewahrt den durativen Charakter des Präsens.
- source_word: ἀποκτεῖναι
  choice: zu töten
  rationale: Direkte Entsprechung ohne die zusätzliche rechtliche oder moralische Wertung von „hinrichten“ oder „ermorden“.
- source_word: ἄνθρωπον
  choice: einen Menschen
  rationale: Bezeichnet Jesus hier ausdrücklich als menschliche Person. „Mensch“ ist im Deutschen die natürliche und lexikalisch genaue Wiedergabe; „Mann“ würde stärker Geschlecht oder Erwachsenenstatus hervorheben, als es der Satz erfordert.
- source_word: τὴν ἀλήθειαν
  choice: die Wahrheit
  rationale: Bewahrt den bestimmten Artikel und die johanneische Betonung der Wahrheit als konkreten Inhalt seiner Rede.
- source_word: ὑμῖν λελάληκα
  choice: euch … gesagt hat
  rationale: Das deutsche Perfekt gibt die vollzogene Rede mit fortdauernder Relevanz angemessen wieder. Wegen der Apposition „einen Menschen, der“ steht die dritte Person, entsprechend der griechischen Relativkonstruktion.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: die ich von Gott gehört habe
  rationale: παρά mit Genitiv kennzeichnet Gott als Quelle. „Von Gott“ ist präzise und vermeidet eine nicht im Text stehende Spezifizierung als „vom Vater“.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Das hat Abraham nicht getan
  rationale: Natürliches Deutsch, das den Rückverweis von τοῦτο und den ausdrücklichen Kontrast zu Abrahams Verhalten bewahrt.
theological_decisions:
- issue: Wiedergabe von ἄνθρωπον in Jesu Selbstbeschreibung
  choice: einen Menschen
  alternative: einen Mann
  rationale: ἄνθρωπος hebt hier Jesu Menschsein hervor. Das deutsche „Mensch“ bewahrt diese Aussage klar, ohne eine christologische Folgerung hinzuzufügen oder Jesu Göttlichkeit zu relativieren.
- issue: Quelle der Botschaft Jesu in παρὰ τοῦ θεοῦ
  choice: von Gott
  alternative: vom Vater
  rationale: Der Ausgangstext hat τοῦ θεοῦ („Gott“), nicht πατρός („Vater“). Die Übersetzung übernimmt die Benennung des Verses, ohne sie anhand anderer johanneischer Stellen zu präzisieren.
- issue: Bezugsweite von τοῦτο („das“)
  choice: Das hat Abraham nicht getan
  alternative: So hat Abraham nicht gehandelt
  rationale: „Das“ lässt wie der griechische Rückverweis offen, ob besonders das Tötenwollen oder das gesamte beschriebene Verhalten im Blick steht. „So gehandelt“ wäre erklärender und würde die Bezugsweite tendenziell verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich markiert die appositionelle Selbstbezeichnung Jesu klar, ohne den Satz unnötig zu formalisieren. Keine Fußnoten erforderlich.
