  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: de
  text: 'Da richtete Jesus[a] sich auf. Als er niemanden außer der Frau sah, sagte er zu ihr: »Frau, wo sind deine Ankläger? Hat dich niemand verurteilt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zur Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11), die in den frühesten griechischen Handschriften fehlt. Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: richtete sich auf
  rationale: Bezeichnet hier, dass Jesus sich aus der gebeugten Haltung wieder aufrichtet, nachdem er zuvor auf den Boden geschrieben hatte.
- source_word: θεασάμενος
  choice: sah
  rationale: Gibt die visuelle Wahrnehmung des Partizips schlicht und natürlich wieder.
- source_word: οἱ κατήγοροί σου
  choice: deine Ankläger
  rationale: Bewahrt den rechtlichen Sinn von κατήγοροι und die direkte persönliche Anrede.
- source_word: κατέκρινεν
  choice: verurteilt
  rationale: Entspricht dem rechtlichen beziehungsweise quasi-rechtlichen Sinn, ein Schuldurteil über jemanden zu fällen.
- source_word: Ἡ γυνή
  choice: Frau
  rationale: Eine direkte, im damaligen Kontext nicht abwertende Anrede; die knappe Wiedergabe wahrt Ton und Form des Griechischen.
theological_decisions:
- issue: Textgeschichtlicher Status von Johannes 7,53–8,11
  choice: Der Vers wird im Haupttext übersetzt und mit einer textkritischen Fußnote gekennzeichnet.
  alternative: Den Abschnitt aus dem Haupttext auslassen oder einklammern.
  rationale: Die vorgegebene byzantinische Ausgangsausgabe enthält den Vers; zugleich muss seine Abwesenheit in den frühesten griechischen Handschriften transparent gemacht werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge wurde für natürliches Deutsch leicht gegliedert, ohne den Inhalt oder die rechtliche Bildsprache zu verändern.
