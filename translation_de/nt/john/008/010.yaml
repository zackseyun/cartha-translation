  source_fidelity: 'Der Entwurf gibt den griechischen Satzinhalt zuverlässig wieder: Jesu Aufrichten (ἀνακύψας), das Wahrnehmen, dass außer der Frau niemand da ist, die Anrede »Frau«, die Frage nach den Anklägern und die abschließende Frage nach einer Verurteilung. »Verurteilt« trifft den rechtlich geprägten Sinn von κατέκρινεν angemessen. Das demonstrative ἐκεῖνοι (»jene/die da«) ist in der idiomatischen deutschen Formulierung nicht eigens markiert, ohne dass wesentliche Bedeutung verlorengeht.'
