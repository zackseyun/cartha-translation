id: JHN.8.12
reference: John 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: de
  text: 'Jesus sprach nun wieder zu ihnen: »Ich bin das Licht der Welt. Wer mir folgt, wird niemals[a] in der Finsternis gehen, sondern wird das Licht des Lebens[b] haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird keinesfalls in der Finsternis gehen“. Im Griechischen steht mit οὐ μή eine besonders nachdrückliche Verneinung.'
    reason: lexical_alternative
  - marker: b
    text: „Das Licht des Lebens“ kann auch als „das Licht, das Leben gibt“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Da … erneut
  rationale: Πάλιν bezeichnet die Wiederholung, während οὖν den Fortgang des Gesprächs markiert. „Da … erneut“ gibt beides in natürlichem modernem Deutsch wieder, ohne οὖν eine zu starke Schlussfolgerung zuzuschreiben.
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: 'sprach Jesus …:'
  rationale: Der Doppel-Ausdruck aus finitem Verb und Partizip wird im Deutschen idiomatisch durch „sprach …:“ mit direkter Rede wiedergegeben; der Aussagegehalt bleibt vollständig erhalten.
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die einfache Kopulakonstruktion mit Prädikatsnomen wird direkt wiedergegeben. Eine zusätzliche Hervorhebung oder ausdrückliche Anspielung auf den Gottesnamen wird nicht in den Text eingetragen.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: das Licht der Welt
  rationale: Die traditionelle und präzise Wiedergabe bewahrt sowohl das Lichtbild als auch die johanneische Bedeutungsweite von κόσμος.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Wer mir folgt
  rationale: Das substantivierte Partizip bezeichnet jeden, der Jesus folgt. „Wer mir folgt“ ist im Deutschen natürlicher als „Derjenige, der mir folgt“ und bewahrt den allgemeinen Singular.
- source_word: οὐ μὴ περιπατήσῃ
  choice: wird keinesfalls … umhergehen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Keinesfalls“ bildet diese Stärke ab; „umhergehen“ bewahrt das Weg- und Lebenswandelbild von περιπατέω.
- source_word: ἐν τῇ σκοτίᾳ
  choice: in der Finsternis
  rationale: Der bestimmte Artikel und das in Johannes ausgeprägte Gegenbild zum Licht werden mit „der Finsternis“ erhalten.
- source_word: ἕξει
  choice: wird … haben
  rationale: Direkte, idiomatische Wiedergabe des Futurs von ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: das Licht des Lebens
  rationale: Die kompakte Genitivverbindung bleibt erhalten und wird nicht auf eine einzige Deutung wie „das lebenspendende Licht“ verengt.
theological_decisions:
- issue: Tragweite der Selbstbezeichnung Ἐγώ εἰμι
  choice: „Ich bin“ innerhalb der Prädikatsaussage „Ich bin das Licht der Welt“
  alternative: Durch besondere Hervorhebung eine ausdrückliche Anspielung auf den Gottesnamen signalisieren
  rationale: Hier ist Ἐγώ εἰμι grammatisch mit dem Prädikatsnomen verbunden. Die direkte Wiedergabe wahrt die Syntax und lässt mögliche größere johanneische Resonanzen offen, ohne sie übersetzerisch festzuschreiben.
- issue: Bedeutung von „das Licht des Lebens“
  choice: Die Genitivverbindung wörtlich beibehalten
  alternative: „das Licht, das Leben gibt“ oder „das lebenspendende Licht“
  rationale: τῆς ζωῆς kann verschieden verstanden werden, etwa als Herkunft, Eigenschaft oder nähere Bestimmung. Die wörtliche Form bewahrt diese theologische Bedeutungsfülle.
- issue: Gehen in der Finsternis
  choice: Das Bewegungs- und Lebenswandelbild mit „umhergehen“ bewahren
  alternative: Deutend mit „in der Finsternis leben“ wiedergeben
  rationale: Die metaphorische Bedeutung ist im Zusammenhang erkennbar, doch eine Auflösung zu „leben“ würde das konkrete Wegmotiv von περιπατέω abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber der griechischen Partizipialkonstruktion behutsam geglättet. Die zentralen johanneischen Bilder „Licht“, „Welt“, „Finsternis“ und „Leben“ sowie die starke Verneinung bleiben erkennbar erhalten.
