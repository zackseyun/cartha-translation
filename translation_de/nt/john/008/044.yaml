revisions:
- from: Ihr stammt von eurem Vater, dem Teufel, und ihr wollt die Begierden eures Vaters tun. Er war von Anfang an ein Menschenmörder und steht nicht in der Wahrheit[a], weil keine Wahrheit in ihm ist. Wenn er die Lüge redet[b], redet er aus dem Eigenen[c], denn er ist ein Lügner und ihr Vater[d].
  to: Ihr stammt von eurem Vater, dem Teufel, und ihr wollt die Begierden eures Vaters erfüllen. Er war von Anfang an ein Menschenmörder und steht nicht in der Wahrheit[a], weil keine Wahrheit in ihm ist. Wenn er die Lüge redet[b], redet er aus dem Eigenen[c], denn er ist ein Lügner und der Vater der Lüge[d].
  rationale: Die Revision beseitigt die zentrale deutsche Mehrdeutigkeit von „ihr Vater“ und glättet die unidiomatische Verbindung „Begierden ... tun“. Sie erhält zugleich die markierten griechischen Wortbilder „in der Wahrheit stehen“, „die Lüge reden“ und „aus dem Eigenen“. Die Fußnote zu „Vater der Lüge“ dokumentiert den wörtlichen Bezug, ohne eine dogmatische oder spekulative Deutung aufzuzwingen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:52:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung bildet die Satzfolge und die wesentlichen Begriffe des griechischen Textes weitgehend zuverlässig ab. „steht nicht in der Wahrheit“ wahrt die Bildlichkeit von ἔστηκεν und vermeidet zu Recht die nicht zwingende Aussage, der Teufel habe zuvor in der Wahrheit gestanden. Bei ὁ πατὴρ αὐτοῦ ist „ihr Vater“ im Deutschen jedoch mehrdeutig: Es kann leicht auf die angeredeten Personen statt auf „die Lüge“ bezogen werden. Die explizite Wiedergabe „der Vater der Lüge“ macht den im Kontext naheliegenden Bezug verständlich.'
  naturalness: „Begierden ... tun“ und besonders „ihr Vater“ sind im modernen Standarddeutsch entweder unnötig holprig oder missverständlich. „die Begierden ... erfüllen“ ist natürlich und gibt die beabsichtigte Ausführung wieder. „der Vater der Lüge“ ist idiomatisch und klar. Die bewusst knappe Formulierung „aus dem Eigenen“ kann als eng am griechischen Wortlaut orientierte, noch verständliche Formulierung stehen bleiben und wird ausreichend erläutert.
  terminology: „Teufel“, „Wahrheit“, „Lügner“ und „Lüge“ sind sachgerecht. „Menschenmörder“ ist verständlich und bewahrt die ausdrückliche menschliche Zielgruppe von ἀνθρωποκτόνος, auch wenn „Mörder“ idiomatischer wäre. Die Formulierung wird daher nicht zwingend geändert.
  issues:
  - severity: medium
    issue: „ihr Vater“ ist als Wiedergabe von ὁ πατὴρ αὐτοῦ missverständlich.
    rationale: Die Form kann im Deutschen ohne Weiteres als Possessivpronomen zu „ihr“ (den Angeredeten) verstanden werden. Der grammatisch und kontextuell naheliegende Bezug auf „die Lüge“ sollte im Haupttext klar ausgedrückt werden, ohne eine Aussage über einen Vater des Teufels zu erzeugen.
  - severity: low
    issue: „die Begierden eures Vaters tun“ klingt im modernen Standarddeutsch unidiomatisch.
    rationale: Das griechische ποιεῖν in Verbindung mit ἐπιθυμίας bezeichnet die Verwirklichung bzw. Ausführung der Wünsche. „erfüllen“ gibt dies natürlich wieder, ohne den Sinn einzuengen.
  - severity: low
    issue: Fußnote d formuliert den Bezug als bloße Gleichsetzung.
    rationale: '„Das heißt: der Vater der Lüge“ lässt die im Ausgangstext vorhandene knappe pronominale Konstruktion und ihre diskutierte Auslegung unsichtbar werden. Die Fußnote sollte den wörtlichen Anhaltspunkt und die sinngemäße Wiedergabe unterscheiden.'
