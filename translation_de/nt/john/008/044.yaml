id: JHN.8.44
reference: John 8:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: de
  text: Ihr stammt von eurem Vater, dem Teufel, und ihr wollt die Begierden eures Vaters erfüllen. Er war von Anfang an ein Menschenmörder und steht nicht in der Wahrheit[a], weil keine Wahrheit in ihm ist. Wenn er die Lüge redet[b], redet er aus dem Eigenen[c], denn er ist ein Lügner und der Vater der Lüge[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist nicht in der Wahrheit stehen geblieben“. Diese Wiedergabe kann jedoch stärker nahelegen, dass er früher in der Wahrheit stand.'
    reason: preserve_ambiguity
  - marker: b
    text: 'Natürlicher: „Wenn er lügt“ oder „Wenn er Unwahrheit redet“. Wörtlich steht im Griechischen: „Wenn er die Lüge redet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „aus dem Eigenen“, also aus dem, was ihm selbst zugehört; gemeint sein können sein eigenes Wesen oder sein Charakter.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „und ihr Vater“, wobei „ihr“ sich auf „die Lüge“ beziehen kann. Sinngemäß: „der Vater der Lüge“; häufig wird auch „der Vater der Lügen“ übersetzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: Ihr stammt von eurem Vater, dem Teufel
  rationale: ἐκ mit εἰμί bezeichnet hier Herkunft beziehungsweise Zugehörigkeit. „stammt von“ ist natürliches Deutsch und bewahrt die scharfe Aussage geistlicher Herkunft, ohne biologische Abstammung ausdrücklich festzulegen.
- source_word: ἐπιθυμίας
  choice: Begierden
  rationale: „Begierden“ gibt die moralisch negativ geprägten Wünsche des Vaters wieder, ohne sie auf Sexualität zu beschränken.
- source_word: θέλετε ποιεῖν
  choice: ihr wollt … tun
  rationale: Die Formulierung bewahrt sowohl den Willen als auch das beabsichtigte Handeln.
- source_word: ἀνθρωποκτόνος
  choice: Menschenmörder
  rationale: Das Kompositum bezeichnet wörtlich einen Menschen-Töter; „Menschenmörder“ ist präzise, verständlich und würdevoll.
- source_word: ἀπ’ ἀρχῆς
  choice: von Anfang an
  rationale: Die Wendung gibt die zeitliche Aussage direkt wieder und wahrt den johanneischen Anklang.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: steht nicht in der Wahrheit
  rationale: Das deutsche Präsens gibt den aus dem Perfekt resultierenden gegenwärtigen Zustand natürlich wieder und bewahrt das Bild des Stehens, ohne durch „blieb nicht“ zwingend einen früheren Stand in der Wahrheit anzunehmen.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: Wenn er die Lüge redet
  rationale: Die markierte Form mit Artikel und Singular bleibt erhalten; eine idiomatischere Alternative steht in der Fußnote.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: redet er aus dem Eigenen
  rationale: Die bewusst knappe griechische Wendung wird formal bewahrt, statt sie im Haupttext auf „Natur“ oder „Wesen“ festzulegen.
- source_word: ψεύστης
  choice: ein Lügner
  rationale: Direkte und idiomatische Wiedergabe des Prädikatsnomens.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ihr Vater
  rationale: Das feminine Pronomen nimmt im Deutschen natürlich „die Lüge“ auf und bewahrt das Bild des Teufels als ihres Ursprungs.
theological_decisions:
- issue: Impliziert ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν, dass der Teufel früher in der Wahrheit stand?
  choice: „steht nicht in der Wahrheit“ lässt eine frühere Stellung offen.
  alternative: „ist nicht in der Wahrheit geblieben“ würde eine frühere Teilhabe stärker nahelegen.
  rationale: Die negierte Perfektform beschreibt einen bestehenden Zustand, entscheidet aber für sich genommen die Frage einer früheren Stellung nicht eindeutig. Die Übersetzung soll diese Spannung nicht auflösen.
- issue: Bezug von ὁ πατὴρ αὐτοῦ
  choice: 'Das Pronomen wird auf „die Lüge“ bezogen: „ihr Vater“.'
  alternative: „Vater der Lüge“ oder verallgemeinernd „Vater der Lügen“; grammatisch wurde auch „sein Vater“ erwogen.
  rationale: τὸ ψεῦδος ist der nächstliegende sachliche Bezug. Das deutsche „ihr“ nimmt „die Lüge“ eindeutig auf. Der Plural „Lügen“ wäre eine erklärende Erweiterung, „sein Vater“ ergäbe eine kontextuell schwierige und spekulative Aussage.
- issue: Bedeutung von ἐκ τῶν ἰδίων
  choice: „aus dem Eigenen“ bewahrt die offene, substantivierte Wendung.
  alternative: „aus seinem eigenen Wesen“ oder „aus seiner eigenen Natur“.
  rationale: Die Alternativen erläutern plausibel den Sinn, legen aber stärker fest, ob Besitz, Charakter, Wesen oder innere Quelle gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die drastische Konfrontation des Ausgangstextes bleibt erhalten. „Menschenmörder“ und „die Lüge reden“ bewahren zentrale Wortbilder; Fußnoten bieten glattere deutsche Alternativen und markieren echte Auslegungsfragen.
