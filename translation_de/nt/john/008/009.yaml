base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: de
  text: Als sie[a] das hörten und von ihrem Gewissen überführt wurden, gingen sie einer nach dem anderen hinaus, angefangen bei den Älteren bis hin zu den Letzten.[b] Jesus blieb allein zurück, und die Frau stand in der Mitte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zur Fortsetzung des Abschnitts über die Ehebrecherin (Johannes 7,53–8,11). Der Abschnitt fehlt in einigen frühen Handschriften und steht in anderen an unterschiedlicher Stelle. Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
  - marker: b
    text: 'Auch möglich: „bis zum Letzten“.'
    reason: translation_alternative
lexical_decisions:
- source_word: συνείδησις
  choice: Gewissen
  rationale: „Gewissen“ ist die natürliche deutsche Entsprechung für die innere moralische Instanz, die zwischen Recht und Unrecht unterscheidet.
- source_word: ἐλέγχω
  choice: überführt wurden
  rationale: Das Passiv bezeichnet hier das innere Erkennen eigener Schuld. „Überführt“ wahrt den moralisch-rechtlichen Beiklang, ohne eine äußere Zurechtweisung vorauszusetzen.
- source_word: πρεσβύτερος
  choice: die Älteren
  rationale: Der Zusammenhang beschreibt eine Reihenfolge unter den Fortgehenden. Daher ist eine Alters- beziehungsweise Rangangabe wahrscheinlicher als der Amtstitel „Älteste“.
- source_word: ἕως τῶν ἐσχάτων
  choice: bis hin zu den Letzten
  rationale: Die Wiedergabe erhält die Mehrzahl und die räumlich-sequenzielle Bewegung der griechischen Formulierung, ohne „ἕως“ unnötig zeitlich zu verstehen.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: stand in der Mitte
  rationale: Die knappe Formulierung gibt sowohl die stehende Haltung als auch die weiterhin zentrale Position der Frau wieder.
theological_decisions:
- issue: Textgeschichtliche Stellung des Abschnitts Johannes 7,53–8,11
  choice: Der Vers wird gemäß der vorgegebenen byzantinischen Ausgangsausgabe im Haupttext übersetzt und mit einer textkritischen Fußnote gekennzeichnet.
  alternative: Den Abschnitt aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Die Übersetzungsgrundlage enthält den Vers. Die Fußnote macht zugleich transparent, dass die Überlieferung des gesamten Abschnitts textkritisch umstritten ist, ohne die Frage im Übersetzungstext vorzuentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am griechischen Text, während „einer nach dem anderen“ und „bis hin zu“ für einen natürlichen deutschen Erzählfluss sorgen. „Die Älteren“ vermeidet eine vorschnelle Deutung als formelles Leitungsamt.
