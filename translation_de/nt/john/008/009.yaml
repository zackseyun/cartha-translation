  source_fidelity: 'Der deutsche Text gibt die maßgeblichen Elemente des griechischen Ausgangstextes zuverlässig wieder: das Hören, das Überführtwerden durch das Gewissen, das Weggehen einzeln nacheinander, die Reihenfolge von den Älteren bis zu den Letzten sowie Jesu Zurückbleiben bei der weiterhin in der Mitte stehenden Frau. „Das“ als Objekt zu „hörten“ ist im deutschen Erzählzusammenhang eine angemessene Wiedergabe des elliptischen griechischen Partizips.'
