source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: de
  text: Doch selbst wenn ich urteile[a], ist mein Urteil wahr, denn ich bin nicht allein, sondern ich und der Vater, der mich gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich urteile“ oder „wenn ich urteilen sollte“. Die griechische Bedingungsform kann formaler wiedergegeben werden; hier hat sie im Zusammenhang wahrscheinlich einen einräumenden Sinn: „selbst wenn ich urteile“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: selbst wenn ich urteile
  rationale: ἐάν mit dem Präsens Konjunktiv κρίνω bezeichnet eine bedingte Möglichkeit. Im Zusammenhang liegt eine konzessive Wiedergabe nahe; die formalere konditionale Bedeutung bleibt in der Fußnote erhalten.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen Gegensatz beziehungsweise eine Weiterführung gegenüber der vorangehenden Aussage.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: mein Urteil
  rationale: Die Verbindung aus Artikel, Substantiv und Possessivadjektiv wird im Deutschen natürlich mit „mein Urteil“ wiedergegeben und bewahrt den rechtlichen Klang von κρίσις.
- source_word: ἀληθινή
  choice: wahr
  rationale: ἀληθινή kann „wahr“, „wirklich“ oder im Zusammenhang auch „gültig“ bedeuten. „Wahr“ erhält die johanneische Begrifflichkeit und lässt sowohl Wahrheit als auch Geltung anklingen.
- source_word: μόνος οὐκ εἰμί
  choice: ich bin nicht allein
  rationale: Diese natürliche deutsche Formulierung bewahrt die Aussage, dass Jesus beim Urteilen nicht unabhängig beziehungsweise als alleinstehender Zeuge handelt.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: sondern ich und der Vater, der mich gesandt hat
  rationale: Die Formulierung stellt Jesus und den sendenden Vater zusammen. Der substantivierte Partizipialausdruck wird idiomatisch als Relativsatz wiedergegeben.
theological_decisions:
- issue: Verhältnis zwischen Jesu Urteil und dem Zeugnis des Vaters
  choice: Jesu Urteil ist wahr, weil er nicht unabhängig vom Vater handelt, der ihn gesandt hat.
  alternative: Die Aussage kann enger als rechtlicher Hinweis auf zwei Zeugen verstanden werden, ohne dass daraus weitergehende theologische Folgerungen gezogen werden.
  rationale: Der Wortlaut begründet die Wahrheit von Jesu Urteil ausdrücklich damit, dass er nicht allein ist, sondern der Vater bei ihm steht. Die Übersetzung bewahrt diese Beziehung, ohne sie durch spätere dogmatische Formulierungen auszuweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Register. „Doch“ und „sondern“ bilden den argumentativen Gegensatz klar ab; „Urteil“ und „wahr“ bewahren die rechtliche sowie johanneische Spannung des Ausgangstextes.
