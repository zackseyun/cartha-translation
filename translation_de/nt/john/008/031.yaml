id: JHN.8.31
reference: John 8:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: de
  text: 'Darauf sagte Jesus zu den Juden, die ihm geglaubt hatten[a]: »Wenn ihr in meinem Wort bleibt, seid ihr wirklich meine Jünger.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die an ihn geglaubt hatten«. Wörtlich steht im Griechischen: »die ihm geglaubt hatten«.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sagte
  rationale: Der Imperfekt kann den fortlaufenden Verlauf markieren; im Deutschen ist hier jedoch das einfache »sagte« idiomatischer, ohne den erzählerischen Zusammenhang zu verfälschen.
- source_word: οὖν
  choice: Darauf
  rationale: Kennzeichnet die Weiterführung aus dem vorausgehenden Geschehen, ohne eine stärkere logische Folgerung auszudrücken, als der Kontext verlangt.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: zu den Juden, die ihm geglaubt hatten
  rationale: Das Plusquamperfekt gibt die Vorzeitigkeit des Perfektpartizips wieder. »Ihm geglaubt« bildet den Dativ αὐτῷ unmittelbar ab und lässt die mögliche Abgrenzung zu »an ihn geglaubt« bestehen.
- source_word: Ἐὰν
  choice: Wenn
  rationale: Gibt die Bedingung mit Konjunktiv klar und natürlich wieder.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrückliche Pronomen bleibt erhalten und trägt die leichte Hervorhebung des griechischen Textes.
- source_word: μείνητε
  choice: bleibt
  rationale: »Bleiben« bewahrt die für Johannes charakteristische Vorstellung von Fortdauer und Verbundenheit und ist zugleich modernes, verständliches Deutsch.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: in meinem Wort
  rationale: Bewahrt die johanneische Wortwahl und deren Bedeutungsweite zwischen Jesu Ausspruch, Botschaft und Lehre.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: Bezeichnet hier die Echtheit des Jüngerseins in natürlichem modernem Deutsch.
- source_word: μαθηταί μού ἐστε
  choice: seid ihr wirklich meine Jünger
  rationale: »Jünger« ist im Evangelienkontext die etablierte und sachlich passende Wiedergabe von μαθηταί; die deutsche Wortstellung klingt natürlich und hält den prädikativen Sinn fest.
theological_decisions:
- issue: Wiedergabe von πιστεύω mit dem Dativ αὐτῷ
  choice: die ihm geglaubt hatten
  alternative: die an ihn geglaubt hatten
  rationale: Der griechische Text verwendet den Dativ ohne εἰς. Die Hauptfassung bewahrt daher die direkte Bedeutung »jemandem glauben«, während die im johanneischen Zusammenhang mögliche Deutung »an jemanden glauben« in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung folgt eng dem griechischen Satzbau, vermeidet aber unnatürliche Verlaufsformen. Die Anrede steht in zeitgemäßer Kleinschreibung; die direkte Rede verwendet deutsche Anführungszeichen.
