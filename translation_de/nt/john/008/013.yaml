id: JHN.8.13
reference: John 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: de
  text: 'Da sagten die Pharisäer zu ihm: »Du legst über dich selbst Zeugnis ab; dein Zeugnis ist nicht wahr.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Zeugnis ist nicht gültig«. Das griechische Wort bedeutet wörtlich »nicht wahr«, kann hier aber auch die rechtliche Gültigkeit des Zeugnisses betreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die folgernde Reaktion auf Jesu vorausgehende Aussage und klingt im modernen deutschen Erzählfluss natürlich.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: sagten die Pharisäer zu ihm
  rationale: Gibt das Aoristverb und das ausdrückliche Pronomen schlicht und quellennah wieder, ohne den Namen Jesus ergänzend einzufügen.
- source_word: Σὺ
  choice: Du
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt Nachdruck; die Voranstellung im direkten Aussagesatz bewahrt ihn ohne künstlichen Zusatz.
- source_word: περὶ σεαυτοῦ
  choice: über dich selbst
  rationale: Gibt sowohl den Gegenstand als auch den selbstbezogenen Charakter des Zeugnisses idiomatisch wieder.
- source_word: μαρτυρεῖς
  choice: legst ... Zeugnis ab
  rationale: Bewahrt die Wortverbindung mit μαρτυρία und den sachlich-rechtlichen Klang; das deutsche Präsens entspricht dem griechischen Präsens.
- source_word: ἡ μαρτυρία σου
  choice: dein Zeugnis
  rationale: Hält die lexikalische Verbindung zu μαρτυρεῖς aufrecht und passt zum beweisrechtlichen Unterton des Gesprächs.
- source_word: οὐκ ἔστιν ἀληθής
  choice: ist nicht wahr
  rationale: Ist die direkte Wiedergabe von ἀληθής und lässt zugleich offen, ob im Kontext zusätzlich die Gültigkeit eines Zeugnisses gemeint ist.
theological_decisions:
- issue: Bedeutung des Einwands gegen das Selbstzeugnis
  choice: dein Zeugnis ist nicht wahr
  alternative: dein Zeugnis ist nicht gültig
  rationale: Der Zusammenhang hat rechtliche Anklänge, doch ἀληθής bezeichnet unmittelbar das Wahrsein und kann hier zugleich die Anerkennung beziehungsweise Gültigkeit des Zeugnisses berühren. Die Hauptübersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zeugnis ablegen« bewahrt den gerichtlichen Unterton und ist allgemein verständlich; die Fußnote erhält die Bedeutungsbreite von ἀληθής.
