id: JHN.8.11
reference: John 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: de
  text: 'Sie[a] antwortete: »Niemand, Herr.« Da sagte Jesus: »Auch ich verurteile dich nicht. Geh, und sündige von jetzt an nicht mehr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Letzter Vers der Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11). Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Die Anrede kann je nach Kontext auch höflich »mein Herr« bedeuten. »Herr« bewahrt hier sowohl die natürliche direkte Anrede als auch die mögliche Anerkennung der Autorität Jesu, ohne die Mehrdeutigkeit weiter aufzulösen.
- source_word: κατακρίνω
  choice: verurteilen
  rationale: Das Verb bezeichnet hier im gerichtlichen Zusammenhang ein verurteilendes Urteil; »verurteilen« gibt diesen Sinn klar und idiomatisch wieder.
- source_word: μηκέτι
  choice: von jetzt an nicht mehr
  rationale: 'Die Wendung macht den zeitlichen Aspekt deutlich: Das bisherige Sündigen soll ab diesem Zeitpunkt aufhören.'
- source_word: ἁμάρτανε
  choice: sündige
  rationale: Der Imperativ Präsens mit μηκέτι fordert dazu auf, künftig nicht weiter zu sündigen. »Sündige ... nicht mehr« erhält den theologischen und ethischen Gehalt des griechischen Verbs.
- source_word: πορεύου
  choice: Geh
  rationale: Der präsentische Imperativ wird als natürliche deutsche Aufforderung »Geh« wiedergegeben.
theological_decisions:
- issue: Bedeutung der Anrede κύριε
  choice: Herr
  alternative: mein Herr; Herr im höflichen Sinn
  rationale: Der Text selbst legt nicht eindeutig fest, ob die Frau ein umfassendes christologisches Bekenntnis ablegt oder Jesus respektvoll als Autorität anspricht. »Herr« bewahrt diese Spannung.
- issue: Verhältnis von Nichtverurteilung und Aufforderung zur Umkehr
  choice: Beide Aussagen werden ohne erklärenden Zusatz unmittelbar nebeneinandergestellt.
  alternative: Die Nichtverurteilung als Billigung oder die Aufforderung als nachträgliche Bedingung auszudeuten.
  rationale: Jesus verurteilt die Frau nicht und fordert sie zugleich auf, nicht weiter zu sündigen. Die Übersetzung bewahrt diese theologische Spannung, ohne eine Aussage gegen die andere auszuspielen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Dialogform ist knapp und mündlich natürlich. »Da sagte Jesus« gibt den Fortgang des Gesprächs flüssig wieder; »von jetzt an nicht mehr« verdeutlicht den zeitlichen Gehalt von μηκέτι, ohne den Sinn auszubauen.
