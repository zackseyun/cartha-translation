  source_fidelity: 'Der deutsche Text gibt den griechischen Wortlaut zuverlässig wieder: οὐδείς mit „Niemand“, κύριε mit dem bewusst mehrdeutigen „Herr“, οὐδὲ ἐγώ … κατακρίνω mit „Auch ich verurteile dich nicht“ sowie πορεύου, καὶ μηκέτι ἁμάρτανε mit „Geh, und sündige von jetzt an nicht mehr“. „Von jetzt an“ macht die in μηκέτι liegende Fortsetzungs- bzw. Abbruchperspektive ausdrücklich, ohne den Sinn unzulässig zu verändern.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die direkte Rede und die knappen Satzfolgen sind idiomatisch. „Da sagte Jesus“ ist als erzählerische Fortführung natürlich.
