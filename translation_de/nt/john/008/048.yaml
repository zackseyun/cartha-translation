source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: de
  text: 'Die Juden[a] antworteten und sagten zu ihm: »Haben wir nicht recht, wenn wir sagen, dass du ein Samariter bist und einen Dämon hast[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder je nach Zusammenhang: »die Judäer« beziehungsweise »die jüdischen Führer«. Im Johannesevangelium bezeichnet »die Juden« häufig eine bestimmte Gruppe, die Jesus entgegentritt, nicht ausnahmslos alle jüdischen Menschen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »einen Dämon hast«; deutender könnte man übersetzen: »von einem Dämon besessen bist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: antworteten
  rationale: Das formal passive, deponent gebrauchte Aoristverb bedeutet hier schlicht »antworteten« und passt zum erzählerischen Stil.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies bildet den griechischen Ausdruck direkt ab. Der unmittelbare Wortlaut spezifiziert weder »jüdische Führer« noch »Judäer«; die kontextuelle Begrenzung des Referenten wird deshalb in einer Fußnote erläutert.
- source_word: εἶπαν αὐτῷ
  choice: sagten zu ihm
  rationale: Die Wiedergabe bewahrt beide griechischen Redeverben und damit die für biblisches Erzählen charakteristische, leicht redundante Formulierung.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Sagen wir nicht zu Recht
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung; »zu Recht« gibt καλῶς hier natürlich und präzise als »richtig/mit gutem Grund« wieder.
- source_word: Σαμαρίτης
  choice: ein Samariter
  rationale: Direkte ethnisch-religiöse Bezeichnung, die in diesem Zusammenhang abwertend als Vorwurf gebraucht wird.
- source_word: δαιμόνιον ἔχεις
  choice: einen Dämon hast
  rationale: Dies folgt der konkreten griechischen Wendung wörtlich. »Von einem Dämon besessen bist« wäre stärker deutend, »einen unreinen Geist hast« würde ein anderes griechisches Wort voraussetzen.
theological_decisions:
- issue: Referent von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer; die jüdischen Führer
  rationale: Der Haupttext hält sich an die lexikalisch direkte Wiedergabe, ohne den Referenten interpretierend einzuengen. Eine Fußnote macht deutlich, dass im Johannesevangelium häufig eine bestimmte Gruppe von Gegnern Jesu gemeint ist und keine pauschale Aussage über alle jüdischen Menschen vorliegt.
- issue: Bedeutung von δαιμόνιον ἔχεις
  choice: einen Dämon hast
  alternative: von einem Dämon besessen bist
  rationale: Die konkrete Besitzkonstruktion bleibt erhalten, sodass der Grad oder die Art dämonischer Einwirkung nicht über den griechischen Wortlaut hinaus festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht redundante Erzählformel »antworteten und sagten zu ihm« bewahrt bewusst die Struktur des griechischen Textes. Die direkte Rede ist idiomatisch, ohne die rhetorische Schärfe oder die belastete johanneische Gruppenbezeichnung zu glätten.
