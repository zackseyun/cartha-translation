id: JHN.8.54
reference: John 8:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: de
  text: 'Jesus antwortete: „Wenn ich mich selbst verherrliche, ist meine Herrlichkeit nichts. Mein Vater ist es, der mich verherrlicht, von dem ihr sagt, er sei unser Gott[a],“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben „euer Gott“ statt „unser Gott“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche, natürliche Erzählform für ἀποκρίνομαι in einem Gespräch.
- source_word: δοξάσω / δοξάζων
  choice: verherrliche / verherrlicht
  rationale: „Verherrlichen“ bewahrt das Gewicht des johanneischen Herrlichkeitsmotivs besser als das allgemeinere „ehren“.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: ist meine Herrlichkeit nichts
  rationale: Die Formulierung bildet οὐδέν ἐστιν eng ab und bleibt in gehobenem, verständlichem Deutsch natürlich.
- source_word: ὁ πατήρ μου
  choice: mein Vater
  rationale: Entspricht der persönlichen Bezeichnung Jesu für Gott, ohne dem griechischen Ausdruck zusätzliche Deutung hinzuzufügen.
- source_word: ὁ δοξάζων με
  choice: der mich verherrlicht
  rationale: Der substantivierte Präsenspartizip wird als Relativsatz wiedergegeben; so bleiben seine beschreibende Funktion und der Gegenwartsbezug erhalten.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: er, von dem ihr sagt, er sei unser Gott
  rationale: Die Wiedergabe erhält den Bezug des Relativpronomens auf den Vater und gibt die Aussage nach λέγετε im Deutschen natürlich als indirekte Rede wieder.
- source_word: ἡμῶν
  choice: unser
  rationale: Folgt dem vorgegebenen SBLGNT-Haupttext; die Variante ὑμῶν wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Pronomen in θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: unser Gott
  alternative: euer Gott
  rationale: Der Haupttext folgt der SBLGNT-Lesart ἡμῶν. Die bedeutungsrelevante Variante ὑμῶν wird nicht stillschweigend verworfen, sondern in einer textkritischen Fußnote bewahrt.
- issue: Bedeutung von δοξάζω und δόξα
  choice: verherrlichen / Herrlichkeit
  alternative: ehren / Ehre
  rationale: Die gewählte Wortfamilie wahrt die theologische Spannung und die terminologische Verbindung zum Herrlichkeitsmotiv des Johannesevangeliums.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Mein Vater ist es, der …“ macht den griechischen Fokus idiomatisch deutlich. Gedankenstriche gliedern den langen Relativanschluss. Das abschließende Komma bleibt stehen, weil der Vers innerhalb der fortlaufenden Rede endet.
