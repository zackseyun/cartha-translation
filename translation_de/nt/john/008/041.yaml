id: JHN.8.41
reference: John 8:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: de
  text: 'Ihr tut die Werke eures Vaters.« Sie sagten zu ihm: »Wir sind nicht aus sexueller Unmoral geboren[a]; wir haben nur einen Vater: Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir sind keine unehelichen Kinder.« Wörtlich: »Wir sind nicht aus sexueller Unmoral geboren.«'
    reason: Die griechische Wendung kann idiomatisch eine uneheliche Herkunft bezeichnen; der Haupttext bewahrt zugleich ihre konkrete Bildsprache.
lexical_decisions:
- source_word: ποιεῖτε
  choice: ihr tut
  rationale: Das Präsens bezeichnet ihr gegenwärtiges und fortdauerndes Handeln; im Deutschen ist das einfache Präsens natürlich.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: Bewahrt den johanneischen Schlüsselbegriff und die Verbindung zum Verb ποιεῖτε, ohne ihn auf einzelne Taten zu verengen.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: eures Vaters
  rationale: Bewahrt die relationale und metaphorische Sprache sowie die zunächst noch offene, im Kontext zugespitzte Identität dieses Vaters.
- source_word: ἐκ πορνείας
  choice: aus sexueller Unmoral
  rationale: Gibt die Herkunftskonstruktion mit ἐκ und den breiten Sinn von πορνεία eng wieder; die idiomatische Bedeutung einer unehelichen Herkunft wird in der Fußnote erläutert.
- source_word: οὐ γεγεννήμεθα
  choice: wir sind nicht … geboren
  rationale: Das deutsche Perfekt mit Zustandsbezug gibt das griechische Perfekt Passiv natürlich wieder.
- source_word: ἕνα πατέρα ἔχομεν
  choice: wir haben nur einen Vater
  rationale: „Nur einen“ bringt die Exklusivität von ἕνα idiomatisch zum Ausdruck.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Die nachgestellte Apposition identifiziert den einen Vater; ein Doppelpunkt bildet diese Bestimmung im Deutschen klar ab.
theological_decisions:
- issue: Ob die Aussage ἐκ πορνείας οὐ γεγεννήμεθα im Haupttext ausdrücklich als Verneinung unehelicher Abstammung wiederzugeben ist
  choice: Die konkrete Herkunftsformulierung „nicht aus sexueller Unmoral geboren“ bleibt im Haupttext erhalten.
  alternative: „Wir sind keine unehelichen Kinder.“
  rationale: Die Alternative trifft wahrscheinlich die idiomatische Stoßrichtung, würde aber mögliche polemische und theologische Untertöne stärker festlegen als der griechische Wortlaut. Die Fußnote macht die naheliegende Bedeutung zugänglich, ohne die Spannung im Haupttext aufzulösen.
- issue: Identität des in „eures Vaters“ bezeichneten Vaters
  choice: Die Formulierung bleibt ohne erklärenden Zusatz stehen.
  alternative: Den Vater bereits hier ausdrücklich als den Teufel identifizieren.
  rationale: Jesus nennt ihn in diesem Vers noch nicht ausdrücklich; die Identifizierung erfolgt erst im weiteren Kontext. Die Übersetzung soll die schrittweise Zuspitzung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sexuelle Unmoral“ ist breit genug für πορνεία und verständlicher als das veraltete „Unzucht“. Der Doppelpunkt vor „Gott“ gibt die Apposition natürlich wieder.
