id: JHN.8.49
reference: John 8:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: de
  text: 'Jesus antwortete: »Ich habe keinen Dämon, sondern ich ehre meinen Vater; ihr aber entehrt mich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche und natürliche deutsche Erzählverb für eine Antwort im Dialog.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: ich habe keinen Dämon
  rationale: Bewahrt die direkte griechische Ausdrucksweise, die auch im Deutschen verständlich ist; die sinngemäße Wiedergabe »ich bin nicht von einem Dämon besessen« wäre stärker auslegend.
- source_word: τιμῶ
  choice: ich ehre
  rationale: Gibt die Grundbedeutung wieder und erhält den bewussten Gegensatz zu ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: meinen Vater
  rationale: Im johanneischen Zusammenhang bezeichnet Jesus Gott als seinen Vater; die Großschreibung kennzeichnet diese Bezugnahme, ohne zusätzliche Aussage einzutragen.
- source_word: ἀτιμάζετέ με
  choice: ihr aber entehrt mich
  rationale: »Entehren« bildet den lexikalischen Gegensatz zu »ehren« präzise ab; »aber« macht den im Griechischen durch καὶ im Kontrast gebrauchten Anschluss im Deutschen natürlich deutlich.
theological_decisions:
- issue: Bedeutung von »einen Dämon haben«
  choice: Die konkrete Wendung »ich habe keinen Dämon« bleibt im Haupttext erhalten.
  alternative: »Ich bin nicht von einem Dämon besessen.«
  rationale: Die Alternative erläutert wahrscheinlich zutreffend den gemeinten Zustand, legt die knappe griechische Wendung jedoch stärker aus.
- issue: Bezug von »meinen Vater«
  choice: »Vater« wird als Bezeichnung Gottes großgeschrieben.
  alternative: Kleinschreibung als gewöhnliche familiäre Bezeichnung
  rationale: Der unmittelbare johanneische Kontext identifiziert den Vater, von dem Jesus spricht, als Gott; die Großschreibung folgt dieser kontextuellen Referenz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz »ehre/entehrt« wird bewusst erhalten. Keine Fußnote ist nötig, da die wörtliche Wendung »einen Dämon haben« im Deutschen verständlich bleibt.
