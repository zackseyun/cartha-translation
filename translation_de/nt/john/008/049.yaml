  terminology: »Dämon«, »ehre«, »entehrt« und »Vater« sind angemessen. Die Großschreibung von »Vater« ist im unmittelbaren johanneischen Kontext als Gottesbezeichnung gerechtfertigt. Die Entscheidung bewahrt zudem den lexikalischen Gegensatz von τιμῶ und ἀτιμάζετε.
