  source_fidelity: 'Der Entwurf gibt alle Satzelemente des griechischen Textes genau wieder: Jesu Antwort, die wörtliche Wendung »keinen Dämon haben«, das Ehren seines Vaters und die Entehrung durch die Angesprochenen. Die explizite Gegenüberstellung durch »sondern« und »ihr aber« entspricht dem argumentativen Kontrast des Kontextes, ohne den Sinn zu erweitern.'
