  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: de
  text: Und ihr werdet die Wahrheit erkennen[a], und die Wahrheit wird euch frei machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr werdet die Wahrheit kennenlernen“.'
    reason: lexical_alternative
  - marker: b
    text: Worin diese Freiheit besteht, bleibt im Wortlaut dieses Verses offen; der folgende Zusammenhang verbindet sie mit der Freiheit von der Sünde.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: ihr werdet … erkennen
  rationale: Das Futur von γινώσκω wird direkt wiedergegeben. „Erkennen“ ist im Deutschen natürlich und lässt sowohl schlichtes Wissen als auch ein im Zusammenhang gewonnenes Erkennen zu, ohne die mögliche ingressive Nuance ausdrücklich festzulegen.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: die Wahrheit
  rationale: Der bestimmte Artikel steht im Griechischen an beiden Stellen. Die Wiederholung von „die Wahrheit“ bewahrt die Bestimmtheit und die rhetorische Parallelität des Ausgangstextes.
- source_word: ἐλευθερώσει
  choice: wird … frei machen
  rationale: Die Form ist Futur Aktiv von ἐλευθερόω. „Frei machen“ gibt die bewirkende Bedeutung idiomatisch wieder und lässt, wie der griechische Wortlaut, zunächst offen, worin die Freiheit besteht.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen ist Akkusativ der zweiten Person Plural; „euch“ gibt Zahl und Funktion eindeutig und natürlich wieder.
- source_word: καὶ … καὶ
  choice: und … und
  rationale: Beide koordinierenden Konjunktionen werden beibehalten, sodass Rhythmus und gedankliche Folge des griechischen Satzes erhalten bleiben.
theological_decisions:
- issue: Art der Freiheit in „die Wahrheit wird euch frei machen“
  choice: Die Freiheit wird im Haupttext nicht näher bestimmt.
  alternative: „Die Wahrheit wird euch von der Sünde befreien.“
  rationale: Der unmittelbare Fortgang verbindet die Freiheit mit der Befreiung aus der Sklaverei der Sünde, doch der Wortlaut dieses Verses nennt das Ziel oder den Bereich der Freiheit nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und überlässt die nähere Bestimmung dem Kontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die Wiederholung und die beiden „und“ des griechischen Textes bleiben erhalten; „frei machen“ vermeidet eine unnötige politische oder konfessionelle Einengung.
