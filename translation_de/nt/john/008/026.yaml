id: JHN.8.26
reference: John 8:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: de
  text: Ich habe vieles über euch zu sagen und zu urteilen. Doch der, der mich gesandt hat, ist wahrhaftig, und was ich von ihm gehört habe, das sage ich der Welt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: vieles
  rationale: Das substantivierte Neutrum Plural bezeichnet zahlreiche Dinge bzw. Aussagen; „vieles“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: περὶ ὑμῶν
  choice: über euch
  rationale: περί mit Genitiv bezeichnet hier das Thema bzw. den Bezug. „Über euch“ ist im Deutschen natürlich und bezieht sich sowohl auf das Sagen als auch auf das Urteilen.
- source_word: λαλεῖν
  choice: zu sagen
  rationale: Im ersten Infinitivpaar klingt „zu sagen und zu urteilen“ idiomatisch; der Sinn sprachlicher Äußerung bleibt erhalten.
- source_word: κρίνειν
  choice: zu urteilen
  rationale: „Urteilen“ bewahrt den weiten Bedeutungsumfang von κρίνω und verengt ihn nicht ohne Not auf „verurteilen“.
- source_word: ὁ πέμψας με
  choice: der, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird persönlich und ohne ausdrückliche Ergänzung von „Vater“ wiedergegeben.
- source_word: ἀληθής
  choice: wahr
  rationale: „Wahr“ erhält die johanneische Bedeutungsweite zwischen wahr, wahrhaftig und zuverlässig, ohne sie einseitig festzulegen.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: was ich von ihm gehört habe
  rationale: Die Wendung gibt den empfangenen Inhalt idiomatisch wieder und bewahrt zugleich die Herkunftsangabe „von ihm“.
- source_word: ταῦτα
  choice: das
  rationale: Das deutsche Korrelat „was …, das …“ bildet die ausdrückliche Wiederaufnahme durch ταῦτα natürlich und betont nach.
- source_word: λαλῶ
  choice: sage ich
  rationale: „Sagen“ ist mit einem als Inhalt vorangestellten Relativsatz im Deutschen natürlicher als „sprechen“ und gibt die gegenwärtige Äußerung wieder.
- source_word: εἰς τὸν κόσμον
  choice: der Welt
  rationale: Bei einem Verb des Sagens bezeichnet εἰς die Ausrichtung an einen Adressaten; der deutsche Dativ ist hier idiomatisch.
theological_decisions:
- issue: Bezug von „der, der mich gesandt hat“
  choice: Der Vater bleibt als kontextuell erkennbarer, aber nicht ausdrücklich benannter Bezug erhalten.
  alternative: „Doch der Vater, der mich gesandt hat, ist wahr.“
  rationale: Der johanneische Zusammenhang macht den Bezug deutlich, doch der griechische Satz nennt den Vater an dieser Stelle nicht ausdrücklich.
- issue: Bedeutungsumfang von κρίνειν
  choice: „zu urteilen“
  alternative: „zu verurteilen“
  rationale: κρίνω kann je nach Kontext auch Verurteilung bezeichnen; hier verlangt der Wortlaut diese engere Bedeutung jedoch nicht.
- issue: Bedeutungsumfang von ἀληθής
  choice: „wahr“
  alternative: „wahrhaftig“ oder „zuverlässig“
  rationale: „Wahr“ bewahrt die theologische und semantische Spannung zwischen Wahrhaftigkeit, Echtheit und Verlässlichkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederaufnahme „was …, das …“ bildet die griechische Demonstrativkonstruktion ab, ohne im Deutschen gekünstelt zu wirken. „Der, der“ ist bewusst als klare moderne Entsprechung der substantivierten Partizipialform gewählt.
