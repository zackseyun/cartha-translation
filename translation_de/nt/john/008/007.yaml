  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: de
  text: 'Als sie ihn aber immer weiter fragten,[a] richtete er sich auf und sagte zu ihnen: »Wer von euch ohne Sünde ist, soll als Erster einen Stein auf sie werfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zur Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11), die in den frühesten griechischen Handschriften fehlt. Siehe die Anmerkung zu Johannes 7,53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: immer weiter fragten
  rationale: Das Imperfekt ἐπέμενον zusammen mit dem Partizip Präsens ἐρωτῶντες bezeichnet ein anhaltendes, beharrliches Fragen; die Formulierung ist im modernen Deutschen natürlich.
- source_word: ἀνακύψας
  choice: richtete er sich auf
  rationale: Die Wendung beschreibt die körperliche Bewegung aus der zuvor gebückten Haltung und gibt das Aoristpartizip idiomatisch wieder.
- source_word: ἀναμάρτητος
  choice: ohne Sünde
  rationale: Das seltene Adjektiv bedeutet hier »ohne Sünde« beziehungsweise »schuldlos«. Die gewählte Formulierung bewahrt sowohl die moralische als auch die rechtliche Spannung des Zusammenhangs.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: soll als Erster einen Stein ... werfen
  rationale: Der Imperativ der dritten Person wird im Deutschen natürlich mit »soll« wiedergegeben; »einen Stein« entspricht der idiomatischen Bedeutung des griechischen Artikels in dieser Handlung.
theological_decisions:
- issue: Reichweite von ἀναμάρτητος
  choice: ohne Sünde
  alternative: in dieser Sache ohne Schuld
  rationale: Der griechische Ausdruck nennt keine Einschränkung auf diese konkrete Verfehlung. Die Übersetzung lässt die umfassendere Aussage stehen, ohne sie auslegend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Immer weiter fragten« bringt die fortdauernde Beharrlichkeit verständlich zum Ausdruck; die direkte Rede bleibt knapp und eindringlich.
