base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: de
  text: Ich aber sage die Wahrheit; deshalb glaubt ihr mir nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: „Weil/dass ich die Wahrheit sage, glaubt ihr mir nicht.“ Das griechische Wort kann auch mit „dass“ wiedergegeben werden. Im Zusammenhang liegt jedoch die kausale Bedeutung nahe: „weil“ beziehungsweise „deshalb“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten, um den Kontrast zwischen Jesus und den zuvor genannten Gesprächspartnern hervorzuheben.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen Gegensatz zum vorausgehenden Zusammenhang; „aber“ gibt diese adversative Funktion natürlich wieder.
- source_word: ὅτι
  choice: und gerade deshalb
  rationale: ὅτι wird kausal verstanden. Die explizite Formulierung „gerade deshalb“ macht die zugespitzte, ironische Logik des Satzes im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: τὴν ἀλήθειαν
  choice: die Wahrheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe; der bestimmte Artikel lässt sich im Deutschen direkt erhalten.
- source_word: λέγω
  choice: sage
  rationale: Das Präsens wird als deutsches Präsens wiedergegeben. „Die Wahrheit sagen“ ist die natürliche deutsche Verbindung.
- source_word: οὐ πιστεύετέ μοι
  choice: glaubt ihr mir nicht
  rationale: πιστεύω mit Dativ bezeichnet hier, jemandem Glauben zu schenken. „Ihr glaubt mir nicht“ bewahrt den persönlichen Bezug und ist idiomatisch.
theological_decisions:
- issue: Bedeutung von ὅτι im Verhältnis zwischen Jesu wahrer Rede und dem Unglauben seiner Zuhörer
  choice: 'kausal: „und gerade deshalb“'
  alternative: 'deklarativ beziehungsweise formal: „dass ich die Wahrheit sage, glaubt ihr mir nicht“'
  rationale: 'Der unmittelbare Gegensatz zum Lügenredner im vorausgehenden Kontext legt die kausale Lesart nahe: Jesus sagt die Wahrheit, und gerade deswegen schenken seine Gegner ihm keinen Glauben. Die alternative syntaktische Auffassung bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Voranstellung „Ich aber“ erhält den griechischen Nachdruck; „gerade deshalb“ bildet die scharfe Ironie des kausal verstandenen ὅτι natürlich ab.
