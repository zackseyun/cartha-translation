id: JHN.8.43
reference: John 8:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: de
  text: Warum versteht ihr meine Redeweise nicht? Weil ihr nicht imstande seid, mein Wort zu hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weil ihr mein Wort nicht hören könnt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: Redeweise
  rationale: „Redeweise“ bezeichnet natürlich die Art des Sprechens und bewahrt die Unterscheidung zum folgenden λόγος („Wort“).
- source_word: γινώσκετε
  choice: versteht
  rationale: Im Zusammenhang geht es um das Erfassen von Jesu Rede, nicht lediglich um Kennen oder Wiedererkennen.
- source_word: ἀκούειν
  choice: zu hören
  rationale: Die Grundbedeutung „hören“ bleibt erhalten; eine weitergehende Deutung als Annehmen oder Gehorchen wird nicht in den Text eingetragen.
- source_word: λόγον
  choice: Wort
  rationale: „Wort“ kann hier Jesu Äußerung beziehungsweise Botschaft bezeichnen und erhält zugleich den sprachlichen Unterschied zu λαλιά.
- source_word: οὐ δύνασθε
  choice: nicht imstande seid
  rationale: Die Formulierung bringt ausdrücklich Unvermögen zum Ausdruck, ohne dessen Ursache näher zu bestimmen.
- source_word: ὅτι
  choice: Weil
  rationale: ὅτι leitet hier unmittelbar die Begründung für die vorausgehende Frage ein.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: meine / mein
  rationale: Die Possessivformen werden im Deutschen idiomatisch attributiv wiedergegeben und erhalten die Parallelität.
theological_decisions:
- issue: Art des Unvermögens in „nicht imstande seid, mein Wort zu hören“
  choice: Die Aussage wird als tatsächliches Unvermögen wiedergegeben, ohne dessen theologischen Grund festzulegen.
  alternative: Moralische Unwilligkeit, gerichtliche Verstockung oder geistliche Unfähigkeit ausdrücklich benennen.
  rationale: Der Vers stellt das Unvermögen fest, erläutert hier aber nicht abschließend, worin es gründet. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Redeweise“ ist alltagssprachlich verständlich und bildet den Unterschied zwischen λαλιά und λόγος prägnant ab. „Nicht imstande seid“ betont die im Griechischen ausgesagte Unfähigkeit, während die Fußnote die knappere natürliche Alternative nennt.
