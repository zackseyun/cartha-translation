id: JHN.2.25
reference: John 2:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: de
  text: Und er brauchte niemanden, der über den Menschen[a] Zeugnis ablegte; denn er selbst wusste, was im Menschen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über einen Menschen“ / „was in einem Menschen war“. Das griechische Wort steht in der Einzahl und kann hier allgemein den Menschen beziehungsweise einen Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: er brauchte niemanden
  rationale: Die verneinte Wendung οὐ χρείαν εἶχεν wird im modernen Deutschen natürlich mit „er brauchte niemanden“ wiedergegeben; der anschließende ἵνα-Satz wird dabei als Relativsatz angeschlossen.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: der … Zeugnis ablegte
  rationale: μαρτυρέω behält mit „Zeugnis ablegen“ seinen Zeugnischarakter. Der Konjunktiv nach der verneinten Bedarfsformulierung bezeichnet eine nicht benötigte Handlung; idiomatisches Deutsch verwendet hier den Relativsatz.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: über den Menschen
  rationale: Der bestimmte Singular ὁ ἄνθρωπος ist generisch. „Der Mensch“ bewahrt sowohl die Einzahl als auch die mögliche repräsentative Aussage über den Menschen beziehungsweise die Menschheit.
- source_word: αὐτὸς γὰρ
  choice: denn er selbst
  rationale: „selbst“ gibt die Hervorhebung durch αὐτός wieder; „denn“ markiert γάρ als Begründung.
- source_word: ἐγίνωσκεν
  choice: wusste
  rationale: Beim Zustandsverb γινώσκω gibt das deutsche Präteritum den imperfektischen, anhaltenden Wissenszustand natürlich wieder.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: was im Menschen war
  rationale: Die Formulierung bleibt bewusst weit und bewahrt die Wiederholung des generischen Singulars sowie das Bild dessen, was sich im Inneren des Menschen befindet.
theological_decisions:
- issue: Reichweite von Jesu Wissen über den Menschen
  choice: Die Aussage wird als unmittelbares Wissen Jesu darüber wiedergegeben, was im Menschen war, ohne die Reichweite näher festzulegen.
  alternative: „was in jedem Menschen war“ oder „wie die menschliche Natur beschaffen war“
  rationale: Der generische Singular kann sowohl den einzelnen Menschen als auch den Menschen allgemein im Blick haben. Die Übersetzung lässt diese Spannung bestehen und fügt keine dogmatische Präzisierung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „der/im Mensch(en)“ bewahrt die formale Entsprechung und den rhetorischen Zusammenhang des griechischen Textes; die Fußnote erläutert die generische Einzahl.
