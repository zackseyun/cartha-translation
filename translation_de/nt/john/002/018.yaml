  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: de
  text: 'Darauf entgegneten die Juden[a] ihm: »Welches Zeichen zeigst du uns dafür, dass du diese Dinge tust?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die jüdischen Führer« beziehungsweise »die Judäer«. Im Johannesevangelium kann »die Juden« je nach Zusammenhang enger eine bestimmte Gruppe bezeichnen, besonders Vertreter der judäischen Autoritäten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν … καὶ εἶπαν αὐτῷ
  choice: Darauf entgegneten … ihm
  rationale: Die im Griechischen übliche Doppelwendung aus »antworten« und »sagen« wird in natürlichem Deutsch zu einer einzigen Redeeinleitung zusammengezogen; »darauf« gibt den erzählerischen Anschluss von οὖν wieder.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die formale Entsprechung bewahrt die im Ausgangstext nicht ausdrücklich eingegrenzte Bezeichnung; eine mögliche kontextuelle Verengung wird in der Fußnote erläutert.
- source_word: Τί σημεῖον
  choice: Was für ein Zeichen
  rationale: »Zeichen« erhält den für Johannes wichtigen Sinn einer sichtbaren Handlung, die Jesu Vollmacht ausweist, ohne den Ausdruck auf »Wunder« zu verengen.
- source_word: δεικνύεις ἡμῖν
  choice: zeigst du uns
  rationale: Direkte Wiedergabe des Präsens und des Dativobjekts.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: als Berechtigung dafür, dass du dies tust
  rationale: ὅτι verbindet die Zeichenforderung mit Jesu Handeln. Die Ergänzung »als Berechtigung« macht im Deutschen die elliptische argumentative Beziehung deutlich, ohne festzulegen, ob ὅτι kausal oder inhaltlich aufzufassen ist; »dies« fasst die unmittelbar vorausgehenden Tempelhandlungen idiomatisch zusammen.
theological_decisions:
- issue: Referent von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: »die Juden« im Haupttext beibehalten
  alternative: »die jüdischen Führer« oder »die Judäer«
  rationale: Der Kontext kann eine bestimmte Gruppe, besonders Vertreter der judäischen Autoritäten, nahelegen; der Vers selbst nennt diese Einschränkung jedoch nicht ausdrücklich. Daher bleibt die Bezeichnung im Haupttext formal erhalten und wird durch eine Fußnote gegen eine pauschale Deutung abgesichert.
- issue: Funktion des verlangten Zeichens
  choice: Die Zeichenforderung als Frage nach der Berechtigung zu Jesu Handeln ausdrücken
  alternative: 'Wörtlicher: »Was für ein Zeichen zeigst du uns, dass du dies tust?«; kausal: »weil du dies tust«'
  rationale: Die Frage verlangt im Kontext eine beglaubigende Ausweisung von Jesu Vollmacht. Die deutsche Formulierung stellt diese pragmatische Funktion klar, ohne das Zeichen selbst lediglich als »Beweis« zu übersetzen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die griechische redundante Redeformel wurde idiomatisch gestrafft; die zentrale johanneische Bezeichnung »Zeichen« und die mehrdeutige Gruppenbezeichnung bleiben erhalten.
