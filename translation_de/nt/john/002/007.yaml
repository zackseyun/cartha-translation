  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Das historische Präsens wird als deutsches Präteritum wiedergegeben; die direkte Rede bleibt knapp und bestimmt. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
