source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Füllt die Wasserkrüge mit Wasser!“ Und sie füllten sie bis oben hin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Rand“.'
    reason: Lexikalische Alternative für ἕως ἄνω; die Wendung kann idiomatisch als vollständiges Füllen bis an den Rand ausgedrückt werden.
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ Plural bezeichnet die Personen, an die Jesus seine Aufforderung richtet.
- source_word: Γεμίσατε
  choice: Füllt
  rationale: Der Aorist-Imperativ Plural ist eine direkte Aufforderung an mehrere Personen; „Füllt“ gibt sie knapp und natürlich wieder.
- source_word: τὰς ὑδρίας
  choice: die Wasserkrüge
  rationale: ὑδρία bezeichnet ein Gefäß für Wasser. „Wasserkrüge“ ist im modernen Deutsch verständlich; das in Vers 6 genannte Material wird hier nicht erneut ergänzt.
- source_word: ὕδατος
  choice: mit Wasser
  rationale: Der Genitiv bezeichnet den Inhalt, mit dem die Gefäße gefüllt werden, und wird im Deutschen idiomatisch mit „mit Wasser“ ausgedrückt.
- source_word: ἐγέμισαν αὐτάς
  choice: sie füllten sie
  rationale: Der Aorist berichtet die ausgeführte Handlung; das zweite „sie“ bezieht sich auf die Wasserkrüge.
- source_word: ἕως ἄνω
  choice: bis oben hin
  rationale: Die Wendung bezeichnet das Füllen bis zum obersten Punkt. „Bis oben hin“ bewahrt die räumliche Ausdrucksweise des Griechischen und klingt zugleich natürlich.
theological_decisions: []
