  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: de
  text: 'Dann sagte er zu ihnen: „Schöpft jetzt etwas und bringt es dem Festleiter[a].“ Und sie brachten es ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem für das Festmahl Verantwortlichen“; auch „dem Speisemeister“. Das griechische Wort bezeichnet die Person, die das Festmahl beaufsichtigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im modernen deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben.
- source_word: Ἀντλήσατε
  choice: Schöpft ... etwas
  rationale: Das Verb bezeichnet das Schöpfen von Flüssigkeit; „etwas“ ergänzt das im Kontext vorausgesetzte Objekt, ohne es näher zu bestimmen.
- source_word: νῦν
  choice: jetzt
  rationale: Die zeitliche Unmittelbarkeit des Auftrags bleibt direkt erhalten.
- source_word: φέρετε
  choice: bringt
  rationale: „Bringen“ gibt die Bewegung des Geschöpften zum Festleiter idiomatisch und unmittelbar wieder.
- source_word: ἀρχιτρικλίνῳ
  choice: dem Festleiter
  rationale: Der Ausdruck bezeichnet den für das Festmahl verantwortlichen Aufseher; „Festleiter“ ist knapp, verständlich und vermeidet eine zu spezifische gesellschaftliche Rollenbeschreibung.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Und sie brachten es ihm
  rationale: δέ ist hier schlicht verbindend. „Es“ nimmt die geschöpfte Flüssigkeit auf; „ihm“ verdeutlicht im Deutschen das aus dem Auftrag klare Ziel, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit natürlichem deutschem Satzbau. Der knappe Vollzug des Auftrags bleibt erhalten; die genaue gesellschaftliche Stellung des ἀρχιτρίκλινος wird nicht überbestimmt.
