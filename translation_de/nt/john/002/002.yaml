  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: de
  text: Auch Jesus und seine Jünger waren zu der Hochzeit eingeladen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: waren … eingeladen
  rationale: Das Passiv von καλέω bezeichnet im Zusammenhang einer Hochzeit idiomatisch eine Einladung. Das deutsche Pluralprädikat gibt Jesus und seine Jünger als gemeinsam eingeladene Satzglieder natürlich wieder.
- source_word: δὲ καὶ
  choice: Auch
  rationale: Die milde Weiterführung durch δέ und die additive Funktion von καί werden im Deutschen knapp und natürlich mit „Auch“ ausgedrückt.
- source_word: ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Jesus und seine Jünger
  rationale: Die koordinierte griechische Formulierung wird direkt wiedergegeben; „Jünger“ ist im Evangelienkontext die geläufige und sachlich angemessene Entsprechung für μαθηταί.
- source_word: εἰς τὸν γάμον
  choice: zu der Hochzeit
  rationale: γάμος bezeichnet hier die Hochzeit beziehungsweise Hochzeitsfeier. „Hochzeit“ ist verständlich und fügt kein im Vers nicht ausdrücklich genanntes Festmahl hinzu.
