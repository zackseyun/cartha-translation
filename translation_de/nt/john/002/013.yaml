  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: de
  text: Das Passafest der Juden war nahe[a], und Jesus ging hinauf nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Passafest der Judäer.“ Ἰουδαῖοι kann bei Johannes in manchen Zusammenhängen „Judäer“ statt „Juden“ bedeuten; hier bezeichnet die Wendung jedoch am ehesten das jüdische Fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: war nahe
  rationale: Das Adverb bezeichnet hier zeitliche Nähe. „War nahe“ gibt den schlichten Sinn natürlich und ohne altertümliche Färbung wieder.
- source_word: πάσχα
  choice: Passafest
  rationale: „Passafest“ ist eine klare, im modernen Deutschen geläufige Bezeichnung des jüdischen Festes und macht ausdrücklich deutlich, dass hier das Fest gemeint ist.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Die Wendung bestimmt das Passafest hier als jüdisches Fest. Obwohl Ἰουδαῖοι bei Johannes je nach Kontext auch „Judäer“ bedeuten kann, passt hier „Juden“ am natürlichsten; die Alternative bleibt in der Fußnote erhalten.
- source_word: ἀνέβη
  choice: ging hinauf
  rationale: Die Form bezeichnet das Hinaufgehen nach Jerusalem und bewahrt sowohl die geografische als auch die traditionelle Pilgerperspektive.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Bei einer Bewegung auf eine Stadt zu ist „nach Jerusalem“ die natürliche deutsche Wiedergabe.
- source_word: Καὶ … καὶ
  choice: Das …, und
  rationale: Das erste καί führt die Erzählung weiter, ohne dass im Deutschen zwingend ein ausdrückliches „Und“ am Satzanfang nötig ist; das zweite verbindet die beiden Aussagen mit „und“.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖοι im Johannesevangelium
  choice: der Juden
  alternative: der Judäer
  rationale: In diesem Vers bezeichnet die Wendung das Passa als jüdisches Fest und nicht erkennbar eine engere regionale oder polemisch markierte Gruppe. „Der Juden“ ist daher im Haupttext sachlich und idiomatisch; die grundsätzlich mögliche regionale Bedeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die Wiederholung der einfachen Satzverbindung werden bewahrt; „ging hinauf“ erhält die räumliche und pilgrimssprachliche Nuance des Griechischen.
