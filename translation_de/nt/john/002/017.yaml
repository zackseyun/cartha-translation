  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: de
  text: 'Seine Jünger erinnerten sich daran, dass geschrieben steht: »Der Eifer für dein Haus wird mich verzehren.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat mich verzehrt«. Diese Wiedergabe entspricht dem Wortlaut von Psalm 69,10 in manchen Textüberlieferungen; im griechischen Text des Johannesevangeliums steht hier »wird mich verzehren«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: erinnerten sich
  rationale: Der Aorist der deponentisch gebrauchten Form wird im Deutschen natürlich mit »erinnerten sich« wiedergegeben.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: »Jünger« ist die geläufige und kontextgerechte Wiedergabe von μαθηταί; das Possessivpronomen gibt αὐτοῦ idiomatisch wieder.
- source_word: ὅτι γεγραμμένον ἐστίν
  choice: daran, dass geschrieben steht
  rationale: Nach »sich erinnern« ist »daran, dass« natürliches modernes Deutsch; »geschrieben steht« bewahrt die geläufige Schriftzitat-Formel und den resultativen Sinn des Perfekts.
- source_word: Ὁ ζῆλος
  choice: Der Eifer
  rationale: »Eifer« bezeichnet hier die intensive Hingabe und bewahrt den würdigen, schriftsprachlichen Klang des Psalmzitats.
- source_word: τοῦ οἴκου σου
  choice: für dein Haus
  rationale: Der Genitiv bezeichnet hier den Gegenstand des Eifers. »Haus« erhält den Wortlaut und die alttestamentliche Anspielung, statt ihn kontextuell zu »Tempel« zu verdeutlichen.
- source_word: καταφάγεταί με
  choice: wird mich verzehren
  rationale: Die Zukunftsform wird ausdrücklich als Zukunft wiedergegeben. »Verzehren« vermittelt die bildhafte Intensität angemessen und klingt im Zitat natürlich und würdig.
theological_decisions:
- issue: Zeitform des Psalmzitats in seiner Anwendung auf Jesus
  choice: »wird mich verzehren«
  alternative: »hat mich verzehrt«
  rationale: Der griechische Text des Johannesevangeliums bietet mit καταφάγεται eine Futurform. Diese wird beibehalten und nicht an abweichende Texttraditionen von Psalm 69,10 angeglichen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftzitat. Die Formulierung bleibt eng am griechischen Text, ohne unnatürlich wörtlich zu wirken; die Zukunftsform und »Haus« werden bewusst bewahrt.
