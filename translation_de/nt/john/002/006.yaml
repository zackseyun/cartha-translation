  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: de
  text: Dort standen sechs steinerne Wasserkrüge, die für den jüdischen Reinigungsbrauch bestimmt waren; jeder fasste zwei oder drei Maß[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Maß“ (griechisch metretēs) war ein antikes Flüssigkeitsmaß von ungefähr 35–40 Litern.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ … κείμεναι
  choice: Dort standen …
  rationale: δέ verbindet den Satz leicht mit dem Vorhergehenden und muss im Deutschen nicht eigens wiedergegeben werden. ἐκεῖ und κείμεναι werden idiomatisch in „Dort standen“ gebündelt; bei aufgestellten Krügen ist „standen“ natürlicher als „lagen“.
- source_word: λίθιναι ὑδρίαι ἓξ
  choice: sechs steinerne Wasserkrüge
  rationale: λίθιναι bezeichnet das Material, ὑδρίαι Wassergefäße. „Steinerne Wasserkrüge“ ist präzise, verständlich und stilistisch würdig.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: wie sie für die jüdische Reinigung bestimmt waren
  rationale: κατά bezeichnet hier die Zuordnung zu beziehungsweise Verwendung für den rituellen Reinigungsbrauch. Die Formulierung bewahrt den kultischen Sinn von καθαρισμός, ohne einen bestimmten Einzelritus hinzuzufügen.
- source_word: χωροῦσαι ἀνὰ
  choice: Jeder fasste
  rationale: χωρέω bezeichnet hier das Fassungsvermögen; das distributive ἀνά wird durch „Jeder“ ausgedrückt.
- source_word: μετρητὰς δύο ἢ τρεῖς
  choice: zwei oder drei Maß
  rationale: Die antike Maßeinheit wird im Haupttext allgemein als „Maß“ wiedergegeben, damit keine Scheingenauigkeit durch eine moderne Umrechnung entsteht; die ungefähre Literangabe steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von τῶν Ἰουδαίων im johanneischen Erzählzusammenhang
  choice: jüdische Reinigung
  alternative: Reinigung der Judäer
  rationale: Hier geht es um eine religiös-kulturelle Reinigungspraxis, nicht vorrangig um regionale Herkunft. „Jüdisch“ gibt diesen Sinn im Deutschen am klarsten wieder und vermeidet eine unnötige geografische Festlegung.
- issue: Funktion von κατὰ beim Reinigungsbrauch
  choice: für … bestimmt
  alternative: gemäß der jüdischen Reinigung
  rationale: Die Krüge stehen im Zusammenhang mit der rituellen Reinigung und dienen ihr. Die gewählte Formulierung macht diese sachliche Zuordnung natürlich verständlich, ohne den genauen Brauch über den griechischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist gegenüber dem langen griechischen Satz leicht gegliedert. Das antike Hohlmaß bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
