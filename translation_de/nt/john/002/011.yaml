revisions:
- from: Dies tat Jesus als Anfang der Zeichen[a] in Kana in Galiläa. Damit offenbarte er seine Herrlichkeit, und seine Jünger glaubten an ihn.
  to: Dies tat Jesus als Anfang seiner Zeichen in Kana in Galiläa und offenbarte seine Herrlichkeit, und seine Jünger glaubten an ihn.[a]
  rationale: Die Revision ergänzt den im Kontext eindeutigen Bezug „seiner“ für eine natürliche deutsche Wiedergabe von ἀρχὴν τῶν σημείων und stellt die griechische koordinierende Satzfolge ohne das stärker deutende „Damit“ wieder her. Die Alternative „als erstes seiner Zeichen“ bewahrt die mögliche ordinale Nuance von ἀρχή. Der Fußnotenanker wurde an der durch die Fußnote erläuterten Wendung positioniert.
