id: JHN.2.11
reference: John 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: de
  text: Dies tat Jesus als Anfang seiner Zeichen in Kana in Galiläa und offenbarte seine Herrlichkeit, und seine Jünger glaubten an ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als erstes seiner Zeichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: Dies tat Jesus
  rationale: Die schlichte Wiedergabe bewahrt das Demonstrativpronomen und das breite ποιέω, ohne erklärend „Wunder“ oder „Zeichen“ in den ersten Satzteil einzutragen.
- source_word: ἀρχὴν τῶν σημείων
  choice: als Anfang der Zeichen
  rationale: „Anfang“ bildet ἀρχή direkt ab; „als“ macht im Deutschen die prädikative Funktion verständlich. Die mögliche Bedeutung „erstes Zeichen“ bleibt in der Fußnote erhalten.
- source_word: σημείων
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den für das Johannesevangelium wichtigen Offenbarungscharakter dieser Taten besser als „Wunder“.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: in Kana in Galiläa
  rationale: Die Formulierung ist im modernen Deutsch natürlich und gibt die geografische Zuordnung eindeutig wieder.
- source_word: ἐφανέρωσεν
  choice: offenbarte
  rationale: „Offenbarte“ gibt das Sichtbar- beziehungsweise Erkennbarwerden wieder und passt zum theologischen Zusammenhang, ohne zusätzliche Erklärung.
- source_word: τὴν δόξαν αὐτοῦ
  choice: seine Herrlichkeit
  rationale: „Herrlichkeit“ ist die sachlich und theologisch angemessene Wiedergabe des johanneischen Schlüsselbegriffs δόξα.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: glaubten an ihn
  rationale: Diese idiomatische deutsche Wendung bewahrt die persönliche Ausrichtung des Glaubens auf Jesus.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Natürliche und genaue Wiedergabe der griechischen Nominalgruppe.
theological_decisions:
- issue: Johanneische Terminologie von σημεῖον
  choice: „Zeichen“
  alternative: „Wunder“
  rationale: Johannes stellt die Taten als Hinweise dar, die Jesu Identität und Herrlichkeit offenbaren; „Zeichen“ erhält diese Dimension.
- issue: Bedeutung von ἀρχὴν τῶν σημείων
  choice: „als Anfang der Zeichen“
  alternative: „als erstes seiner Zeichen“
  rationale: Die Hauptfassung wahrt das griechische „Anfang“ und damit den Gedanken des Beginns einer Zeichenfolge; die idiomatischere ordinale Deutung wird als echte Alternative in der Fußnote genannt.
- issue: Bezug des Glaubens der Jünger
  choice: „glaubten an ihn“
  alternative: „setzten ihr Vertrauen auf ihn“
  rationale: Die gewählte Formulierung ist im Deutschen idiomatisch, bleibt nahe am Text und lässt die genaue Ausprägung ihres Glaubens im Erzählzusammenhang offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung nach „Galiläa“ erhöht die Verständlichkeit, ohne die logische Abfolge des griechischen Satzes zu verändern; „Damit“ macht den Bezug der Offenbarung auf das vollbrachte Zeichen deutlich.
