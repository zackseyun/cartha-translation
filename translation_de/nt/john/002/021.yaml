  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: de
  text: Er aber sprach vom Tempel seines Leibes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum seines Leibes“. Das griechische Wort naos bezeichnet häufig genauer das innere Tempelheiligtum und nicht die gesamte Tempelanlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: er
  rationale: Das Demonstrativpronomen verweist im Zusammenhang auf Jesus. Im Deutschen ist das Personalpronomen natürlich; „jener“ wäre unnötig betont.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier den milden Gegensatz zwischen dem Missverständnis der Gesprächspartner und der tatsächlichen Bedeutung von Jesu Worten.
- source_word: ἔλεγεν
  choice: sprach
  rationale: Das Imperfekt beschreibt rückblickend, worauf Jesu Äußerung bezogen war. „Sprach“ bleibt eng am Verb λέγω, ohne es deutend mit „meinte“ wiederzugeben.
- source_word: περὶ
  choice: von
  rationale: περί mit Genitiv bezeichnet den Gegenstand des Sprechens. Die Verbindung „von etwas sprechen“ ist im Deutschen natürlich und prägnant.
- source_word: ναοῦ
  choice: Tempel
  rationale: ναός bezeichnet genauer das Tempelheiligtum und nicht die gesamte Tempelanlage. „Tempel“ ist die geläufige Wiedergabe; die genauere Bedeutung wird in der Fußnote genannt.
- source_word: σώματος
  choice: Leib
  rationale: „Leib“ gibt σῶμα in diesem christologischen und metaphorischen Zusammenhang würdig und verständlich wieder und bewahrt die direkte Genitivverbindung.
- source_word: αὐτοῦ
  choice: seines
  rationale: Das Genitivattribut kennzeichnet den Leib als Jesu eigenen Leib.
theological_decisions:
- issue: Metaphorische Bezeichnung von Jesu Leib als Tempel
  choice: Die Metapher wird unmittelbar als „Tempel seines Leibes“ beibehalten.
  alternative: „sein Leib als Tempel“ oder „das Heiligtum seines Leibes“
  rationale: Die direkte Genitivkonstruktion bewahrt die erklärende Identifikation des Evangelisten und ihre christologische Spannung, ohne sie paraphrasierend auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Erklärungssatzes und die Tempelmetapher bleiben erhalten.
