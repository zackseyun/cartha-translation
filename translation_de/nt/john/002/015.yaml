id: JHN.2.15
reference: John 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: de
  text: Nachdem er aus Stricken eine Peitsche gemacht hatte, trieb er alle aus dem Tempelbezirk hinaus, sowohl die Schafe als auch die Rinder.[a] Er schüttete die Münzen der Geldwechsler aus und warf ihre Tische um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut sagt zunächst »alle« und nennt dann »die Schafe und die Rinder«. Er sagt nicht ausdrücklich, dass Jesus die Peitsche gegen Menschen einsetzte.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: er machte
  rationale: Das vorzeitige Aoristpartizip bezeichnet die der Vertreibung vorausgehende Handlung; die deutsche Reihung mit »und« gibt den Ablauf natürlich und klar wieder.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: aus Stricken eine Peitsche
  rationale: »Peitsche« ist die klare moderne Bezeichnung; »Stricke« bewahrt den Materialsinn von σχοινία, ohne die genaue Beschaffenheit festzulegen.
- source_word: πάντας ἐξέβαλεν
  choice: trieb sie alle ... hinaus
  rationale: Die maskuline Pluralform πάντας bleibt in ihrem Bezug offen. »Sie alle« wahrt den umfassenden Ausdruck, während »hinaustreiben« die kraftvolle Entfernung treffend wiedergibt.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: aus dem Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage und nicht speziell das innere Heiligtum; »Tempelbezirk« macht diesen Unterschied präzise und knapp deutlich.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: auch die Schafe und die Rinder
  rationale: Die Formulierung schließt die genannten Tiere ausdrücklich in die Vertreibung ein. »Rinder« ist eine natürliche umfassende Wiedergabe von βόες.
- source_word: κολλυβιστῶν
  choice: Geldwechsler
  rationale: Der etablierte und allgemein verständliche deutsche Ausdruck für Personen, die Münzen beziehungsweise Währungen wechselten.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: schüttete die Münzen ... aus
  rationale: »Ausschütten« bewahrt das konkrete Bild von ἐκχέω und passt im Deutschen idiomatisch zu Münzen.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: stieß ihre Tische um
  rationale: Im Kontext bedeutet ἀναστρέφω, die Tische umzustürzen. »Stieß ... um« ist anschaulich und modernes, natürliches Deutsch; das Possessivpronomen stellt den naheliegenden Bezug zu den Geldwechslern her.
theological_decisions:
- issue: Umfang der Vertreibung und Gebrauch der Peitsche
  choice: Der Text sagt, dass Jesus »sie alle« hinaustrieb, und nennt anschließend ausdrücklich Schafe und Rinder, ohne zu behaupten, dass er die Peitsche gegen Menschen einsetzte.
  alternative: Entweder alle Menschen und Tiere oder ausschließlich die Tiere als Objekt der Vertreibung zu bestimmen.
  rationale: Die Syntax von πάντας mit der folgenden Nennung der Tiere lässt den genauen Umfang des Bezugs diskutierbar. Die Übersetzung bewahrt diese Spannung und ergänzt keine Aussage darüber, wen Jesus mit der Peitsche berührte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, anschaulicher Satzführung. »Tempelbezirk« unterscheidet die gesamte Anlage vom inneren Heiligtum. Der einzige Fußnotenhinweis bewahrt die syntaktische und theologisch bedeutsame Offenheit des griechischen Textes.
