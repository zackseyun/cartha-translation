  terminology: „Tempelbezirk“ gibt ἱερόν sachgerecht als gesamte Tempelanlage wieder. „Stricke“, „Peitsche“, „Geldwechsler“, „Münzen“ und „Rinder“ sind in diesem Kontext angemessen. Die offene Reichweite von πάντας wird mit „alle“ samt Anmerkung bewahrt, ohne zu behaupten, die Peitsche sei gegen Menschen eingesetzt worden.
