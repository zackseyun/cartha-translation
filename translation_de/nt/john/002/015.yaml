  source_fidelity: 'Die wesentlichen Handlungen und Begriffe sind zutreffend wiedergegeben: eine aus Stricken gefertigte Peitsche, das Hinaustreiben aus dem Tempelbezirk, die ausdrückliche Nennung von Schafen und Rindern, das Ausschütten der Münzen und das Umwerfen der Tische. Die vorzeitige Funktion von ποιήσας sollte jedoch im Deutschen klarer als vorausgehende Handlung markiert werden.'
