base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: de
  text: Danach ging er zusammen mit seiner Mutter, seinen Brüdern[a] und seinen Jüngern nach Kafarnaum hinab. Sie blieben dort nicht viele Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandte“ oder „andere Angehörige“. Das griechische Wort kann Brüder im engeren Sinn bezeichnen, in manchen Zusammenhängen aber auch eine weiter gefasste familiäre Beziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Danach
  rationale: Eine natürliche moderne Zeitangabe, die den singularischen Rückverweis knapp wiedergibt.
- source_word: κατέβη
  choice: ging er hinab
  rationale: Bewahrt die topografische Bewegung nach Kafarnaum und klingt im Deutschen erzählerisch angemessen.
- source_word: εἰς Καφαρναοὺμ
  choice: nach Kafarnaum
  rationale: Bei Städtenamen ist „nach“ die natürliche deutsche Richtungsangabe.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrückliche Pronomen leitet die Aufzählung der Mitreisenden ein; „selbst“ bildet diese Hervorhebung sichtbar ab.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: seine Mutter
  rationale: Gibt den griechischen Wortlaut wieder, ohne den im Vers nicht genannten Namen Maria zu ergänzen.
- source_word: οἱ ἀδελφοὶ
  choice: seine Brüder
  rationale: Die maskuline Pluralform bezeichnet am unmittelbarsten Brüder; eine mögliche weitere Verwandtschaftsbedeutung wird in der Fußnote offengehalten.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist der etablierte und kontextgerechte deutsche Ausdruck für μαθηταί.
- source_word: ἐκεῖ ἔμειναν
  choice: Dort blieben sie
  rationale: Die Pluralform bezieht die zuvor genannte Gruppe ein; die Formulierung ist natürlich und nah am Ausgangstext.
- source_word: οὐ πολλὰς ἡμέρας
  choice: nicht viele Tage
  rationale: Bewahrt die verneinende Ausdrucksweise des Griechischen, statt sie glättend als „nur wenige Tage“ wiederzugeben.
theological_decisions:
- issue: Verwandtschaftsbezeichnung ἀδελφοί im Blick auf Jesu Familie
  choice: Im Haupttext „Brüder“.
  alternative: „Verwandte“ oder „Angehörige“.
  rationale: ἀδελφοί bedeutet hier am direktesten „Brüder“, kann jedoch je nach sprachlichem und familiärem Kontext einen weiteren Verwandtschaftskreis bezeichnen. Die Übersetzung entscheidet die damit verbundenen späteren theologischen Fragen nicht, sondern nennt die lexikalische Alternative in einer Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verbessert die Lesbarkeit, ohne den Zusammenhang oder Inhalt des griechischen Satzes zu verändern.
