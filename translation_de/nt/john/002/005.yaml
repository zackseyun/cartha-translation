  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes präzise wieder: „seine Mutter“, die Empfängergruppe, die offene indefinit-relative Anweisung und der pluralische Imperativ bleiben erhalten. Das implizite Subjekt von λέγῃ wird angemessen als „er“ wiedergegeben, ohne es unnötig zu explizieren.'
  naturalness: '„Seine Mutter sagte zu den Dienern: ‚Was immer er euch sagt, das tut.‘“ ist verständliches, modernes und zugleich würdiges Standarddeutsch. Die korrelative Form „Was immer …, das tut“ ist leicht gehoben, aber in direkter Rede idiomatisch und passend.'
