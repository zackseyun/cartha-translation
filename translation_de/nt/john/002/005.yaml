  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: de
  text: 'Seine Mutter sagte zu den Dienern: „Was immer er euch sagt, das tut.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: seine Mutter
  rationale: Die natürliche deutsche Wiedergabe der Genitivverbindung bewahrt die familiäre Bezeichnung und den knappen Erzählstil.
- source_word: διακόνοις
  choice: den Dienern
  rationale: Im Zusammenhang des Hochzeitsfestes bezeichnet das Wort die dort Dienstleistenden, nicht das spätere kirchliche Amt der Diakone. „Diener“ ist verständlich und kontextgerecht.
- source_word: Ὅ τι ἂν
  choice: Was immer
  rationale: Die indefinite Relativverbindung mit ἄν drückt eine offene Möglichkeit aus. „Was immer“ gibt diese Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: λέγῃ ὑμῖν
  choice: er euch sagt
  rationale: Der Konjunktiv Präsens in Verbindung mit ἄν hat hier einen indefiniten, zukunftsbezogenen Sinn. Die deutsche Formulierung ist idiomatisch und bewahrt den impliziten männlichen Bezug auf Jesus.
- source_word: ποιήσατε
  choice: das tut
  rationale: Der Aoristimperativ Plural fordert zum entschlossenen Ausführen auf. Das Demonstrativpronomen „das“ nimmt den Inhalt von „was immer“ natürlich wieder auf.
theological_decisions:
- issue: Bezug des im Griechischen unausgedrückten Subjekts von λέγῃ
  choice: „er“, im Kontext auf Jesus bezogen
  alternative: „Jesus“ ausdrücklich nennen
  rationale: Der Kontext macht Jesus zum eindeutigen Bezug, doch der griechische Text nennt seinen Namen hier nicht. „Er“ wahrt die sprachliche Knappheit, ohne den Sinn zu verdunkeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Was immer er euch sagt, das tut“ klingt eindringlich, bleibt gut verständlich und bildet die korrelative Struktur des griechischen Satzes ab.
