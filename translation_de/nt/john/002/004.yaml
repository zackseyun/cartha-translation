id: JHN.2.4
reference: John 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihr: „Was hat das mit mir und mit dir zu tun[a], Frau[b]? Meine Stunde ist noch nicht gekommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was ist mir und dir?“ Die Redewendung schafft Abstand hinsichtlich des Anliegens oder der Zuständigkeit, drückt aber nicht zwangsläufig Feindseligkeit aus.'
    reason: lexical_alternative
  - marker: b
    text: „Frau“ war damals eine übliche und nicht notwendig unhöfliche Anrede, auch wenn sie im heutigen Deutschen gegenüber der eigenen Mutter schroff klingen kann.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens („sagt“) wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben, ohne seine erzählerische Funktion zu verändern.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Was hat das mit mir und mit dir zu tun
  rationale: Die semitisch geprägte Wendung drückt Abstand in der Zuständigkeit oder im Anliegen aus. Diese Wiedergabe bleibt verständlich und bewahrt die ungewöhnliche ausdrückliche Einbeziehung beider Personen, ohne daraus eine schroffe Zurückweisung zu machen.
- source_word: γύναι
  choice: Frau
  rationale: Der Vokativ bedeutet wörtlich „Frau“ und war im damaligen Umfeld nicht notwendig unhöflich. Zusätze wie „liebe“ würden eine im Griechischen nicht ausdrücklich vorhandene Herzlichkeit eintragen; „Madam“ wäre kulturell und stilistisch unpassend.
- source_word: οὔπω
  choice: noch nicht
  rationale: Die Formulierung bezeichnet unmittelbar, dass der betreffende Zeitpunkt bis jetzt nicht eingetreten ist.
- source_word: ἥκει
  choice: ist … gekommen
  rationale: Das Verb bezeichnet das Eintreffen oder Dasein. In Verbindung mit „Stunde“ ist „ist gekommen“ im Deutschen natürlich und bewahrt zugleich den johanneischen Sprachgebrauch.
- source_word: ἡ ὥρα μου
  choice: meine Stunde
  rationale: „Stunde“ erhält das für das Johannesevangelium wichtige Motiv des von Gott bestimmten Zeitpunkts und ist weniger allgemein als „meine Zeit“.
theological_decisions:
- issue: Ton und Tragweite von Jesu Anrede an seine Mutter
  choice: Eine respektvolle, aber Distanz setzende Antwort, keine Beleidigung
  alternative: Eine harte Zurechtweisung oder eine ausdrücklich liebevolle Anrede
  rationale: Τί ἐμοὶ καὶ σοί markiert einen Abstand hinsichtlich Anliegen oder Zuständigkeit, während γύναι als Anrede im damaligen Kontext nicht notwendig abwertend war. Text und Fußnoten bewahren diese Spannung, ohne den Ton einseitig zu verschärfen oder zu mildern.
- issue: Bedeutung von „meine Stunde“ in der johanneischen Theologie
  choice: Wörtliche Wiedergabe, die den von Gott bestimmten Zeitpunkt und den weiteren johanneischen Bedeutungsrahmen offenhält
  alternative: Nur der Zeitpunkt dieses Zeichens oder eine allgemeine Zeitangabe ohne theologischen Nachklang
  rationale: „Stunde“ ist im Johannesevangelium ein wiederkehrendes Motiv im Zusammenhang mit Jesu Auftrag und Verherrlichung. Die Übersetzung erhält diesen Ausdruck, ohne seine genaue Reichweite an dieser Stelle im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Frage bleibt bewusst etwas markant, damit die Distanz des griechischen Ausdrucks erkennbar ist. Die Fußnoten erläutern dessen möglichen Ton sowie die kulturbedingte Wirkung der Anrede, ohne die bestehende Deutungsspannung aufzulösen.
