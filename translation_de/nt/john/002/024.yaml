id: JHN.2.24
reference: John 2:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: de
  text: Jesus selbst aber vertraute sich ihnen nicht an[a], weil er alle Menschen kannte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht dasselbe Verb wie im vorherigen Vers: Viele „glaubten an“ Jesus, doch Jesus „vertraute sich ihnen nicht an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Jesus selbst aber
  rationale: Das hervorgehobene αὐτός wird mit „selbst“ wiedergegeben; δέ markiert den Gegensatz zu den Menschen aus Vers 23. Die Wortstellung ist würdevoll und im modernen Standarddeutsch verständlich.
- source_word: οὐκ ἐπίστευεν
  choice: vertraute sich … nicht an
  rationale: πιστεύω steht hier mit dem reflexiven Akkusativ und einem Dativ und bedeutet daher idiomatisch „sich jemandem anvertrauen“. Das deutsche Präteritum kann den fortdauernden beziehungsweise grundsätzlichen Sinn des Imperfekts natürlich ausdrücken.
- source_word: αὑτὸν αὐτοῖς
  choice: sich ihnen … an
  rationale: Die reflexive Selbsthingabe beziehungsweise das Sich-Anvertrauen wird im Deutschen durch das trennbare Verb „sich jemandem anvertrauen“ natürlich und genau wiedergegeben.
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: weil er … kannte
  rationale: διά mit substantiviertem Infinitiv bezeichnet hier den Grund. γινώσκω meint in diesem Zusammenhang umfassende Kenntnis; „kannte“ ist natürlicher als eine Verlaufsform.
- source_word: πάντας
  choice: alle Menschen
  rationale: Der substantivisch gebrauchte maskuline Plural bezeichnet allgemein Menschen. Die ausdrückliche Ergänzung „Menschen“ macht den Bezug im Deutschen klar, ohne ihn auf eine bestimmte Gruppe einzuengen.
theological_decisions:
- issue: Wortspiel mit πιστεύω in den Versen 23–24
  choice: In Vers 24 „vertraute sich … an“ verwenden und die Verbindung zu „glaubten“ aus Vers 23 in einer Fußnote kenntlich machen.
  alternative: Dasselbe deutsche Verb in beiden Versen verwenden, etwa „vertrauen“, dabei jedoch entweder die idiomatische Aussage oder den üblichen Ausdruck „an Jesus glauben“ beeinträchtigen.
  rationale: Das Griechische verwendet bewusst dasselbe Verb, doch im Deutschen verlangt die unterschiedliche Konstruktion verschiedene idiomatische Wiedergaben. Die Fußnote bewahrt die sprachliche und theologische Spannung, ohne dem Text eine zusätzliche Deutung aufzuzwingen.
- issue: Bezugsweite von πάντας
  choice: „alle Menschen“ allgemein verstehen.
  alternative: „sie alle“ als Beschränkung auf die unmittelbar erwähnte Gruppe.
  rationale: 'Das unbeschränkte πάντας und der Übergang zur Aussage über das Innere des Menschen in Vers 25 sprechen für die allgemeine Formulierung. Sie behauptet nicht mehr als der Text selbst: Jesus kannte alle Menschen.'
translation_notes:
  register: Modernes, natürliches und zugleich würdevolles Standarddeutsch. „Jesus selbst aber“ erhält die emphatische Gegenüberstellung; „sich anvertrauen“ gibt die griechische Konstruktion idiomatisch wieder. Der Fußnotenmarker [a] steht unmittelbar bei der erklärten Wendung.
