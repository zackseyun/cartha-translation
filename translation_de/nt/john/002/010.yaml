id: JHN.2.10
reference: John 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Jeder[a] setzt zuerst den guten Wein vor und, wenn sie betrunken geworden sind[b], den schlechteren. Du aber hast den guten Wein bis jetzt aufbewahrt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „jeder Mensch“; gemeint sind Menschen allgemein, nicht nur Männer.
    reason: cultural_note
  - marker: b
    text: Oder „betrunken sind“. Das griechische Verb bedeutet gewöhnlich „betrunken werden“; manche Übersetzungen geben es abschwächend mit „reichlich getrunken haben“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: er sagte zu ihm
  rationale: Das griechische Präsens ist hier ein historisches Präsens; im natürlichen deutschen Erzählstil steht dafür das Präteritum.
- source_word: Πᾶς ἄνθρωπος
  choice: Jeder
  rationale: Die generische Singularform bezeichnet Menschen allgemein. „Jeder“ ist im Deutschen natürlich und schränkt die Aussage nicht auf Männer ein.
- source_word: τὸν καλὸν οἶνον
  choice: den guten Wein
  rationale: καλός bezeichnet hier die Qualität und steht im Gegensatz zum später vorgesetzten geringeren Wein.
- source_word: τίθησιν
  choice: setzt … vor
  rationale: Die Formulierung bleibt nahe bei der Grundbedeutung „setzen, hinstellen“, ist aber im Zusammenhang eines Festmahls idiomatisch.
- source_word: ὅταν μεθυσθῶσιν
  choice: wenn die Gäste betrunken geworden sind
  rationale: μεθύω bezeichnet gewöhnlich das Betrunkenwerden. „Die Gäste“ macht das im Griechischen nur implizite pluralische Subjekt im Deutschen verständlich.
- source_word: τὸν ἐλάσσω
  choice: den geringeren
  rationale: Der Komparativ bezeichnet Wein von geringerer Qualität; „Wein“ kann wie im Griechischen aus dem Zusammenhang ergänzt werden.
- source_word: τετήρηκας
  choice: du hast … aufbewahrt
  rationale: Das Perfekt beschreibt ein Aufbewahren mit bis in die Gegenwart reichendem Ergebnis.
- source_word: ἕως ἄρτι
  choice: bis jetzt
  rationale: Die Wendung bezeichnet den gegenwärtigen Zeitpunkt innerhalb der Erzählung.
theological_decisions:
- issue: Bedeutung von μεθυσθῶσιν im Zusammenhang mit Wein und dem Zeichen Jesu
  choice: Die klare Bedeutung „betrunken geworden sind“ bleibt erhalten.
  alternative: „reichlich getrunken haben“ oder „genug getrunken haben“
  rationale: Das Verb bezeichnet gewöhnlich Trunkenheit. Die Äußerung schildert eine gesellschaftliche Praxis, ohne sie ausdrücklich gutzuheißen; eine Abschwächung aus ethischen oder theologischen Gründen würde die Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Setzt … vor“ bewahrt die Bildhaftigkeit des griechischen Verbs, während „die Gäste“ das implizite pluralische Subjekt natürlich verdeutlicht.
