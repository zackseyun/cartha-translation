  to: 'Und er sagte zu ihm: „Jeder[a] setzt zuerst den guten Wein vor und, wenn sie betrunken geworden sind[b], den schlechteren. Du aber hast den guten Wein bis jetzt aufbewahrt.“'
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text enthaltene Spezifizierung „die Gäste“ und ersetzt die im Deutschen unnatürliche Formulierung „den geringeren“ durch „den schlechteren“. Die Aussage über das Betrunkensein bleibt ausdrücklich erhalten; die Fußnotenanker und ihre Inhalte bleiben strukturell korrekt.
