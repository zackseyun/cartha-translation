id: JHN.2.22
reference: John 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: de
  text: Als er nun von den Toten auferweckt worden war[a], erinnerten sich seine Jünger daran, dass er dies gesagt hatte[b], und sie glaubten der Schrift und dem Wort, das Jesus gesprochen hatte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Toten auferstanden war“. Das griechische Verb steht im Passiv: „auferweckt worden war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dass er dies sagte“ oder „dass er dies immer wieder sagte“. Die griechische Vergangenheitsform kann einen andauernden oder wiederholten Vorgang bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Aussage“. Das griechische Wort kann ein gesprochenes Wort, eine Aussage oder eine Botschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Als ... nun
  rationale: „Als“ leitet den vergangenen Zeitpunkt ein; „nun“ bewahrt die folgernde und fortführende Funktion von οὖν in natürlichem Deutsch.
- source_word: ἠγέρθη
  choice: auferweckt worden war
  rationale: Die passive Form wird bewahrt. Das Plusquamperfekt macht deutlich, dass die Auferweckung der später erwähnten Erinnerung vorausging.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die geläufige und sachlich genaue deutsche Wiedergabe der griechischen Auferstehungsformel.
- source_word: ἐμνήσθησαν
  choice: erinnerten sich
  rationale: Die Form bezeichnet hier das Sich-Erinnern beziehungsweise das Ins-Gedächtnis-Kommen.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Natürliche deutsche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: dass er dies gesagt hatte
  rationale: Der deutsche Rückblick verlangt hier natürlich das Plusquamperfekt. Der Imperfekt kann einen Verlauf oder wiederholtes Sprechen bezeichnen, erzwingt dies im Kontext jedoch nicht; die mögliche Nuance wird in einer Fußnote offengehalten.
- source_word: ἐπίστευσαν
  choice: sie glaubten
  rationale: „Glaubten“ gibt πιστεύω mit seinen Dativobjekten knapp und ohne zusätzliche Deutung wieder.
- source_word: τῇ γραφῇ
  choice: der Schrift
  rationale: Der Singular des griechischen Textes wird bewahrt und bezeichnet die als autoritativ verstandene heilige Schrift.
- source_word: τῷ λόγῳ
  choice: dem Wort
  rationale: „Wort“ bewahrt die johanneische Ausdrucksweise; gemeint ist hier Jesu zuvor ausgesprochene Aussage.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: das Jesus gesprochen hatte
  rationale: Der Relativsatz bezieht sich auf „Wort“; das Plusquamperfekt entspricht der rückblickenden Erzählperspektive.
theological_decisions:
- issue: Passivform des Auferstehungsverbs
  choice: von den Toten auferweckt worden war
  alternative: von den Toten auferstanden war
  rationale: Die gewählte Fassung bewahrt das grammatische Passiv und legt nicht stillschweigend eine andere Stimme zugrunde.
- issue: πιστεύω mit Dativobjekten
  choice: sie glaubten der Schrift und dem Wort
  alternative: sie vertrauten der Schrift und dem Wort
  rationale: „Glaubten“ bleibt am wenigsten deutend und wahrt die Formulierung, dass Schrift und Jesu Wort geglaubt wurde.
- issue: Aspekt von ἔλεγεν
  choice: dass er dies gesagt hatte
  alternative: dass er dies immer wieder sagte / gesagt hatte
  rationale: Der Imperfekt lässt fortdauerndes oder wiederholtes Sprechen zu, doch der unmittelbare Zusammenhang verlangt diese Nuance nicht. Die Hauptfassung bleibt idiomatisch, während die Fußnote die Ambiguität ausweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber gut verständlich. „Auferweckt“ bewahrt bewusst das Passiv; „der Schrift“ hält den Singular fest; die Fußnoten dokumentieren echte lexikalische und aspektuelle Alternativen.
