id: JHN.2.23
reference: John 2:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: de
  text: Als er aber in Jerusalem war, am Passafest, während des Festes, glaubten viele an seinen Namen[a], als sie die Zeichen[b] sahen, die er tat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glaubten an ihn“. Wörtlich steht hier „glaubten an seinen Namen“, eine johanneische Ausdrucksweise für Vertrauen auf seine offenbarte Identität.'
    reason: lexical_alternative
  - marker: b
    text: „Zeichen“ ist bei Johannes eine charakteristische Bezeichnung für Taten, die über sich selbst hinaus darauf hinweisen, wer Jesus ist; andere Übersetzungen geben den Ausdruck mit „Wunderzeichen“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als … aber
  rationale: Gibt sowohl den zeitlichen Anschluss durch ὡς als auch die leichte Fortführung beziehungsweise Gegenüberstellung durch δέ wieder.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Natürliche moderne deutsche Ortsangabe.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: während des Passafestes
  rationale: πάσχα bezeichnet hier das Passa als Fest; die zusammengezogene Formulierung gibt die appositionale Verdeutlichung durch ἐν τῇ ἑορτῇ idiomatisch wieder, ohne ein zweites, scheinbar anderes Fest einzuführen.
- source_word: πολλοὶ
  choice: viele
  rationale: Die knappe Mengenangabe benötigt im Deutschen keinen ergänzten Ausdruck wie „Menschen“.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: glaubten an seinen Namen
  rationale: Bewahrt die johanneische Wendung mit „Name“, statt sie auf „glaubten an ihn“ zu verkürzen; gemeint ist Vertrauen, das seiner offenbarten Identität gilt.
- source_word: θεωροῦντες
  choice: als sie … sahen
  rationale: Gibt die gleichzeitige Wahrnehmung des Partizips in natürlichem Deutsch wieder, ohne die Aussage ausdrücklich auf einen rein kausalen Zusammenhang festzulegen.
- source_word: τὰ σημεῖα
  choice: die Zeichen
  rationale: Bewahrt den für Johannes charakteristischen Ausdruck für Taten, die über sich hinaus auf Jesu Identität weisen.
- source_word: ἃ ἐποίει
  choice: die er tat
  rationale: „Tat“ ist im Deutschen die natürliche Formulierung für das durative Imperfekt; der Pluralkontext der Zeichen vermittelt die wiederholte Tätigkeit.
theological_decisions:
- issue: Art des in ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ beschriebenen Glaubens
  choice: Die Aussage wird ohne abschwächenden Zusatz als „glaubten an seinen Namen“ wiedergegeben.
  alternative: „kamen zu einem oberflächlichen Glauben an ihn“ oder „bekannten sich aufgrund der Wunder zu ihm“
  rationale: Der Vers selbst bezeichnet die Reaktion als Glauben. Erst der folgende Kontext qualifiziert sie näher; diese erzählerische und theologische Spannung darf die Übersetzung nicht vorwegnehmend auflösen.
- issue: Verhältnis des Sehens der Zeichen zum Glauben
  choice: „als sie … sahen“ lässt den zeitlichen Zusammenhang hervortreten, ohne eine ausschließlich kausale Deutung festzuschreiben.
  alternative: „weil sie … sahen“
  rationale: Das Partizip θεωροῦντες kann kontextuell kausal verstanden werden, bezeichnet formal jedoch zunächst die begleitende beziehungsweise gleichzeitige Wahrnehmung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und verständlich; zugleich bleiben die johanneischen Schlüsselbegriffe „Name“, „glauben“ und „Zeichen“ sichtbar.
