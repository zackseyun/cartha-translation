  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: de
  text: Und am dritten Tag fand in Kana in Galiläa eine Hochzeit[a] statt, und die Mutter Jesu war dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Hochzeitsfeier“. Das griechische Wort kann sowohl die Hochzeit als Ereignis als auch die dazugehörige Feier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der gewöhnliche erzählende Anschluss bleibt erhalten, ohne eine zusätzliche zeitliche oder deutende Nuance einzuführen.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Die Zeitangabe wird im Deutschen idiomatisch und zugleich eng am bestimmten griechischen Ausdruck wiedergegeben.
- source_word: γάμος
  choice: eine Hochzeit
  rationale: Das Wort kann sowohl die Eheschließung als auch die Hochzeitsfeier bezeichnen. „Hochzeit“ ist natürlich und lässt diesen Bedeutungsumfang weitgehend offen.
- source_word: ἐγένετο
  choice: fand … statt
  rationale: γίνομαι führt hier ein Ereignis ein. „fand statt“ ist in Verbindung mit „Hochzeit“ klares, modernes Deutsch.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: in Kana in Galiläa
  rationale: Der Ortsname wird üblich transkribiert; die Genitivbestimmung wird im Deutschen natürlich als geografische Einordnung mit „in“ ausgedrückt.
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt liefert eine schlichte Hintergrundangabe und wird ohne interpretierende Erweiterung wiedergegeben.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: die Mutter von Jesus
  rationale: Diese Formulierung bildet den griechischen Genitiv klar ab und klingt im modernen Standarddeutsch natürlicher als „Jesu Mutter“, ohne den Bezug umzudeuten.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das einfache Ortsadverb wird direkt wiedergegeben.
theological_decisions:
- issue: Zeitangabe „am dritten Tag“
  choice: Als chronologische Angabe unverändert beibehalten
  alternative: Die Formulierung ausdrücklich als Vorausdeutung auf die Auferstehung wiedergeben
  rationale: Der Wortlaut kann im Johannesevangelium weitergehende Anklänge wecken, dient hier aber unmittelbar als Zeitangabe. Eine theologische Deutung wird daher nicht in die Übersetzung eingebaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichtem erzählerischem Rhythmus. Das Semikolon trennt Ereignis und Hintergrundangabe klar, ohne den Zusammenhang aufzulösen.
