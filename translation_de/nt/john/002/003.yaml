  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: de
  text: 'Und als der Wein ausging[a], sagt[b] Jesu Mutter zu ihm: »Sie haben keinen Wein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »als es an Wein mangelte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht das historische Präsens: »sagt«. Manche Übersetzungen geben es mit »sagte« wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: als der Wein ausging
  rationale: Der Genitivus absolutus mit Aoristpartizip bezeichnet den Umstand, der der Haupthandlung vorausgeht. »Als der Wein ausging« gibt den eintretenden Mangel im modernen Deutschen natürlich wieder.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt das historische Präsens der johanneischen Erzählung und dessen lebendige Wirkung.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: die Mutter von Jesus
  rationale: Die Formulierung folgt der charakteristischen Bezeichnung im griechischen Text und klingt zugleich in modernem Standarddeutsch natürlich.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: In Verbindung mit »sagt« bezeichnet die Wendung den Adressaten der Äußerung knapp und idiomatisch.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Sie haben keinen Wein
  rationale: Das nicht ausdrücklich genannte Subjekt der dritten Person Plural bleibt als »sie« unbestimmt; so werden weder die Gastgeber noch eine andere Gruppe ausdrücklich in den Text eingetragen.
- source_word: οἶνος
  choice: Wein
  rationale: »Wein« ist die gewöhnliche und kontextuell passende Bedeutung; eine abschwächende Umschreibung wäre unbegründet.
theological_decisions:
- issue: Historisches Präsens in der johanneischen Erzählung
  choice: Das Präsens »sagt« wird beibehalten.
  alternative: Vergangenheitsform »sagte« für einen einheitlicheren deutschen Erzählstil.
  rationale: Die Beibehaltung spiegelt die griechische Erzählweise wider, ohne eine theologische Deutung hinzuzufügen.
- issue: Bezug des unausgesprochenen Pluralsubjekts in Οἶνον οὐκ ἔχουσιν
  choice: Der Bezug bleibt mit »sie« unbestimmt.
  alternative: Ausdrückliche Benennung als »die Gastgeber« oder »die Hochzeitsgesellschaft«.
  rationale: Der griechische Text nennt den Bezug nicht ausdrücklich. Eine nähere Bestimmung würde eine mögliche Kontextdeutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und die Unbestimmtheit des Pluralsubjekts bleiben erhalten.
