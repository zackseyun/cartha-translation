id: JHN.2.16
reference: John 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: de
  text: 'Und zu denen, die die Tauben verkauften, sagte er: „Schafft das von hier weg! Macht das Haus meines Vaters nicht zu einem Haus des Handels[a]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Marktplatz“. Wörtlich steht im Griechischen „zu einem Haus des Handels“; dadurch wird „Haus“ im Satz wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: Tauben
  rationale: Der Ausdruck bezeichnet die als Opfertiere verkauften Vögel. „Tauben“ ist im Deutschen die natürliche und im Tempelkontext übliche Wiedergabe.
- source_word: πωλοῦσιν
  choice: verkauften
  rationale: Das substantivierte Präsenspartizip bezeichnet die Personen anhand ihrer fortdauernden Tätigkeit; der deutsche Relativsatz gibt dies natürlich wieder.
- source_word: Ἄρατε
  choice: Schafft ... weg
  rationale: Der Aoristimperativ verlangt entschiedenes Handeln. „Schafft ... weg“ bewahrt die Kraft des Befehls und verbindet sich idiomatisch mit der Ortsangabe.
- source_word: ταῦτα
  choice: das
  rationale: Das griechische Neutrum Plural verweist allgemein auf das Vorhandene, wahrscheinlich auf die Tauben samt Behältnissen oder Verkaufsgegenständen. Das deutsche Sammelpronomen „das“ bleibt ebenso unspezifisch und klingt natürlich.
- source_word: ἐντεῦθεν
  choice: von hier
  rationale: Die Ortsangabe bezeichnet die Entfernung vom gegenwärtigen Ort und wird zusammen mit „wegschaffen“ idiomatisch wiedergegeben.
- source_word: μὴ ποιεῖτε
  choice: Macht ... nicht zu
  rationale: Die Verbindung aus μή und Präsensimperativ formuliert ein Verbot. Die Konstruktion „etwas zu etwas machen“ bildet ποιεῖτε direkt und verständlich ab.
- source_word: οἶκον τοῦ πατρός μου
  choice: das Haus meines Vaters
  rationale: Die Formulierung bewahrt sowohl den Tempelbezug als auch Jesu ausdrückliche persönliche Beziehung zu seinem Vater.
- source_word: οἶκον ἐμπορίου
  choice: ein Haus des Handels
  rationale: Diese Wiedergabe erhält die auffällige Wiederholung von οἶκος („Haus“) und den rhetorischen Gegensatz innerhalb des Satzes. Zugleich gibt „Handel“ den kommerziellen Sinn von ἐμπόριον sachgerecht wieder.
theological_decisions:
- issue: Jesu Bezeichnung des Tempels als „Haus meines Vaters“
  choice: Die ausdrückliche Aussage „das Haus meines Vaters“ wird unverändert beibehalten.
  alternative: „das Haus unseres Vaters“ oder „Gottes Haus“
  rationale: Der griechische Text hat den Singular μου („meines“) und bringt damit Jesu eigene Sohnesbeziehung und seinen daraus hervorgehenden Anspruch im Kontext zum Ausdruck. Eine Verallgemeinerung oder Ersetzung würde diese Aussage abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der energische Imperativ wird natürlich wiedergegeben; die ungewöhnliche, aber verständliche Wendung „Haus des Handels“ bewahrt bewusst die rhetorische Wiederholung des griechischen Textes.
