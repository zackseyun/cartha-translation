id: JHN.2.14
reference: John 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: de
  text: Und er fand im Tempel[a] Händler, die Rinder, Schafe und Tauben verkauften, und Geldwechsler, die dort saßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier den gesamten Tempelbezirk mit seinen Höfen, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: fand er
  rationale: Gibt den Aorist von εὑρίσκω direkt wieder und beschreibt, was Jesus dort antraf.
- source_word: ἐν τῷ ἱερῷ
  choice: dort im Tempel
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbezirk, nicht speziell das innere Heiligtum. „Im Tempel“ ist im Deutschen idiomatisch; „dort“ verbindet den Satz natürlich mit dem vorangehenden Kontext.
- source_word: τοὺς πωλοῦντας
  choice: die Händler, die … verkauften
  rationale: Macht das substantivierte Präsenspartizip in natürlichem Deutsch verständlich und bewahrt den durativen Charakter der Verkaufstätigkeit.
- source_word: βόας
  choice: Rinder
  rationale: βοῦς bezeichnet Großvieh; „Rinder“ ist im modernen Deutschen präzise, verständlich und legt im Unterschied zu „Stiere“ kein Geschlecht fest.
- source_word: πρόβατα
  choice: Schafe
  rationale: Die übliche und kontextgemäße deutsche Entsprechung im Zusammenhang mit Opfertieren.
- source_word: περιστερὰς
  choice: Tauben
  rationale: Bewahrt die im Griechischen mögliche allgemeine Bezeichnung für Tauben, ohne unnötig zwischen Turtel- und Haustauben zu unterscheiden.
- source_word: κερματιστὰς
  choice: Geldwechsler
  rationale: Die etablierte und sachlich genaue deutsche Bezeichnung für Personen, die Münzen beziehungsweise Geld wechselten.
- source_word: καθημένους
  choice: die dort saßen
  rationale: Gibt die Körperhaltung und ihre feste Anwesenheit an diesem Ort natürlich wieder.
theological_decisions:
- issue: Räumlicher Umfang von ἱερόν beim Jerusalemer Tempel
  choice: „Tempel“ im Haupttext, durch eine Fußnote als Tempelbezirk erläutert
  alternative: „Tempelhof“ oder „Tempelbezirk“ unmittelbar im Haupttext
  rationale: Die Händler und Geldwechsler befanden sich im weiteren Tempelareal, nicht im inneren Heiligtum. „Tempel“ bleibt die natürliche Haupttextformulierung, während die Fußnote die historisch-räumliche Präzision wahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung ist für natürliches Deutsch leicht geglättet; die Aufzählung und beide Gruppen des griechischen Textes bleiben erhalten.
