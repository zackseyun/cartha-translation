id: JHN.2.20
reference: John 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: de
  text: 'Darauf sagten die Juden[a]: »Dieser Tempel wurde in sechsundvierzig Jahren erbaut, und du willst ihn in drei Tagen aufrichten[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Judäer«. Johannes verwendet den griechischen Ausdruck für »die Juden« je nach Zusammenhang in unterschiedlicher Weise.'
    reason: alternative_reading
  - marker: b
    text: 'Oder im Verständnis der Gesprächspartner: »wieder aufbauen«. Das griechische Verb kann vom Aufrichten eines Bauwerks, aber auch vom Auferwecken eines Toten gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Darauf
  rationale: Kennzeichnet die Folgerung beziehungsweise Reaktion auf Jesu vorherige Aussage und klingt im modernen Deutschen natürlich.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Gibt den griechischen Ausdruck unmittelbar wieder, ohne den Bezug eigenmächtig auf die jüdischen Führer zu verengen. Die kontextabhängige Verwendung im Johannesevangelium wird in einer Fußnote erläutert.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: in sechsundvierzig Jahren
  rationale: Der Zeitdativ bezeichnet hier die Dauer, innerhalb deren der Bau erfolgte.
- source_word: οἰκοδομήθη
  choice: wurde … erbaut
  rationale: Gibt den Aorist Passiv als zusammenfassende Aussage über den Bau des Tempels wieder; »erbaut« passt idiomatisch zum Tempel.
- source_word: ὁ ναὸς οὗτος
  choice: dieser Tempel
  rationale: ναός bezeichnet genauer das Heiligtum, doch »Tempel« ist hier die natürliche und allgemein verständliche deutsche Wiedergabe.
- source_word: καὶ σὺ
  choice: und du willst
  rationale: Das ausdrücklich gesetzte σὺ wird durch das betonte »du« bewahrt; »willst« vermittelt im Deutschen den ungläubig-herausfordernden Ton der Frage.
- source_word: ἐν τρισὶν ἡμέραις
  choice: in drei Tagen
  rationale: Natürliche deutsche Zeitangabe, die zugleich die sprachliche Verbindung zur später erläuterten Auferstehungsaussage offenhält.
- source_word: ἐγερεῖς
  choice: aufrichten
  rationale: Bewahrt das Bedeutungsspektrum von ἐγείρω zwischen dem Aufrichten eines Bauwerks und dem Auferwecken beziehungsweise Auferstehen, statt die Aussage vorzeitig als »wieder aufbauen« festzulegen.
- source_word: αὐτόν
  choice: ihn
  rationale: Bezieht sich auf das im Deutschen maskuline Substantiv »Tempel«.
theological_decisions:
- issue: Mögliches antijüdisches Missverständnis von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: »die Juden« im Haupttext beibehalten und die kontextabhängige Bedeutung in einer Fußnote kenntlich machen
  alternative: »die Judäer« oder »die jüdischen Führer«
  rationale: Der griechische Wortlaut wird bewahrt, ohne die im Vers nicht ausdrücklich genannte Bezugsgruppe interpretierend einzuengen. Zugleich verhindert die Fußnote, dass die Bezeichnung pauschal auf alle Juden bezogen wird.
- issue: Verbindung von ἐγερεῖς mit der Auferstehung Jesu
  choice: »aufrichten«
  alternative: »wieder aufbauen«
  rationale: 'Die Formulierung erhält die johanneische Doppeldeutigkeit: Die Gesprächspartner denken an das Bauwerk, während der Evangelist die Aussage im folgenden Vers auf Jesu Leib und seine Auferstehung bezieht.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bewahrt den ungläubigen, herausfordernden Ton. »Aufrichten« erhält bewusst die im Kontext wichtige Doppeldeutigkeit, ohne sie im Haupttext aufzulösen.
