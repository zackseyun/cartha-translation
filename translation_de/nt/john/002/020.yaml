  source_fidelity: 'Der griechische Wortlaut wird insgesamt präzise wiedergegeben: οὖν als anschließende Reaktion („Darauf“), οἱ Ἰουδαῖοι als „die Juden“, der Zeitdativ als „in sechsundvierzig Jahren“, das Passiv οἰκοδομήθη als „wurde … erbaut“ und die rhetorische Frage mit betontem „du“. „Aufrichten“ bewahrt bei ἐγερεῖς die für den folgenden Kontext relevante Mehrdeutigkeit, ohne den Sinn auf „wieder aufbauen“ festzulegen.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und wahrt einen würdevollen, zugleich herausfordernden Dialogton. „Und du willst ihn in drei Tagen aufrichten?“ ist als ungläubige rhetorische Frage idiomatisch.
  terminology: „Tempel“ ist für ναός in diesem Kontext die natürliche deutsche Wiedergabe. „Die Juden“ folgt dem griechischen Ausdruck, während die Fußnote die kontextabhängige johanneische Verwendung sachlich kenntlich macht. Die Fußnote zu „aufrichten“ erläutert die lexikalische Spannweite angemessen und löst die erzählerische Doppeldeutigkeit nicht im Haupttext auf.
