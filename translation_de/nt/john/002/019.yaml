source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Brecht diesen Tempel nieder, und in drei Tagen werde ich ihn aufrichten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zerstört diesen Tempel, und in drei Tagen werde ich ihn wieder aufbauen.“ Das griechische Verb für „aufrichten“ kann hier zugleich den Gedanken an Auferweckung anklingen lassen. Johannes erklärt später, dass Jesus vom Tempel seines Leibes sprach (2,21).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Die griechische Doppelwendung »antwortete und sagte« ist semitisch geprägt. Im heutigen Deutschen gibt »antwortete ihnen« ihren Sinn natürlich und ohne unnötige Schwerfälligkeit wieder.
- source_word: Λύσατε
  choice: Brecht … nieder
  rationale: λύω bezeichnet hier im Zusammenhang mit dem Tempel das Abbrechen oder Zerstören. »Brecht … nieder« bewahrt das bauliche Bild und lässt zugleich die tiefere Bedeutung offen.
- source_word: τὸν ναὸν τοῦτον
  choice: diesen Tempel
  rationale: ναός meint den Tempel beziehungsweise das Heiligtum. »Tempel« ist im Deutschen die verständlichste Entsprechung; die in Vers 21 erklärte Bezugnahme auf Jesu Leib wird hier nicht vorweggenommen.
- source_word: ἐν τρισὶν ἡμέραις
  choice: in drei Tagen
  rationale: Die geläufige deutsche Zeitangabe entspricht der griechischen Formulierung, ohne deren zeitliche Nuance unnötig festzulegen.
- source_word: ἐγερῶ αὐτόν
  choice: werde ich ihn aufrichten
  rationale: ἐγείρω kann sowohl das Aufrichten als auch das Auferwecken bezeichnen. »Aufrichten« passt zum Tempelbild und bewahrt im Kontext den Anklang an die Auferstehung; das Pronomen »ihn« nimmt grammatisch korrekt »Tempel« auf.
theological_decisions:
- issue: Ob der Tempel bereits in diesem Vers ausdrücklich als Jesu Leib erklärt werden soll
  choice: Die rätselhafte Formulierung »diesen Tempel« bleibt im Haupttext bestehen.
  alternative: »Brecht diesen Tempel – meinen Leib – nieder«
  rationale: Johannes liefert die Deutung erst in 2,21. Eine vorweggenommene Erklärung würde die beabsichtigte erzählerische und theologische Spannung auflösen.
- issue: Ob ἐγερῶ rein architektonisch oder mit Auferstehungsanklang wiederzugeben ist
  choice: »werde ich ihn aufrichten«
  alternative: »werde ich ihn wieder aufbauen« oder »werde ich ihn auferwecken«
  rationale: »Wieder aufbauen« würde den Auferstehungsanklang abschwächen, während »auferwecken« das Tempelbild im unmittelbaren Wortlaut stark zugunsten der späteren Erklärung auflösen würde. »Aufrichten« erhält beide Bedeutungsebenen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die semitisch geprägte Doppelwendung »antwortete und sagte« wird natürlich zu »antwortete« verdichtet. »Brecht … nieder« und »aufrichten« halten Tempelbild und Auferstehungsanklang zugleich präsent.
