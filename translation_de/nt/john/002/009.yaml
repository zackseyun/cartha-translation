source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: de
  text: Als der Festleiter das Wasser kostete, das Wein geworden war, und nicht wusste, woher es kam – die Diener aber, die das Wasser geschöpft hatten, wussten es –, ruft der Festleiter den Bräutigam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: Festleiter
  rationale: Bezeichnet hier den für das Festmahl verantwortlichen Aufseher. „Festleiter“ ist verständlich und bewahrt die Funktion, ohne ihn enger als bloßen Oberkellner zu bestimmen.
- source_word: ἐγεύσατο
  choice: kostete
  rationale: Gibt das Probieren eines Getränks in diesem Zusammenhang natürlich und präzise wieder.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: das Wasser, das Wein geworden war
  rationale: Das Perfektpartizip bezeichnet eine vollzogene Verwandlung mit fortbestehendem Ergebnis. Die Formulierung folgt dem Griechischen eng und vermeidet zusätzliche Ausschmückung.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: nicht wusste, woher er kam
  rationale: πόθεν bezeichnet die Herkunft. Das Pronomen bezieht sich im Deutschen natürlich auf den nun vorliegenden Wein.
- source_word: διάκονοι
  choice: Diener
  rationale: Im erzählerischen Kontext sind Bedienstete gemeint, nicht ein kirchliches Amt.
- source_word: ἠντληκότες
  choice: geschöpft hatten
  rationale: „Schöpfen“ ist die übliche deutsche Bezeichnung für das Entnehmen von Wasser und gibt das vorzeitige Partizip angemessen wieder.
- source_word: φωνεῖ
  choice: ruft
  rationale: Bewahrt das historische Präsens des griechischen Erzählstils.
- source_word: νυμφίον
  choice: Bräutigam
  rationale: Die natürliche und lexikalisch genaue Bezeichnung im Hochzeitskontext.
- source_word: ὡς δὲ
  choice: Als
  rationale: Leitet den nächsten zeitlichen Erzählschritt ein; ein zusätzliches „nun“ ist im Deutschen nicht erforderlich.
theological_decisions:
- issue: Erzählende Beschreibung des Wunders
  choice: „das Wasser, das Wein geworden war“ als tatsächliche Zustandsveränderung
  alternative: „das zu Wein gewordene Wasser“ oder idiomatischer „das in Wein verwandelt worden war“
  rationale: Der griechische Text bezeichnet ausdrücklich eine vollzogene Veränderung vom Wasser zum Wein. Die Übersetzung schwächt dies weder zu einem bloßen Anschein ab noch ergänzt sie eine Erklärung der Art des Wunders.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der griechische Einschub über das Wissen der Diener wird mit Gedankenstrichen erhalten. Das historische Präsens φωνεῖ wird durch „ruft“ sichtbar gemacht.
