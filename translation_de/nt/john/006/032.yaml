source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: „Amen, amen, ich sage euch: Nicht Mose hat euch das Brot vom Himmel gegeben[a], sondern mein Vater gibt euch das wahre Brot vom Himmel[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Mose hat euch nicht das Brot vom Himmel gegeben.“ Im Griechischen steht die Verneinung unmittelbar vor „Mose“; dadurch wird besonders hervorgehoben, wer der Geber ist.'
    reason: lexical_alternative
  - marker: b
    text: '„Wahr“ kann hier auch „wirklich“ oder „echt“ bedeuten: das Brot vom Himmel im Unterschied zum früheren Manna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Fortführung der vorangehenden Auseinandersetzung. „Da“ ist im Deutschen natürlich und gibt den erzählerisch-folgernden Zusammenhang wieder, ohne ihn stärker zu bestimmen als der Kontext.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die für das Johannesevangelium charakteristische doppelte Formel und ihren feierlichen, nachdrücklichen Klang. Das im Deutschen bekannte „Amen“ lässt die semitisch geprägte Redeweise Jesu erkennen.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Gibt die griechische Wendung transparent wieder und passt zum feierlichen Einleitungssatz.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: Nicht Mose hat euch … gegeben
  rationale: Die Voranstellung von „Nicht Mose“ erhält den im Griechischen hervorgehobenen Gegensatz der Handelnden. Das Perfekt „hat gegeben“ bewahrt den Gegenwartsbezug der früheren Gabe.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: das Brot vom Himmel
  rationale: „Vom Himmel“ ist eine natürliche deutsche Wiedergabe von ἐκ τοῦ οὐρανοῦ und erhält das Herkunftsbild.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: sondern mein Vater gibt euch
  rationale: „Sondern“ bildet den Gegensatz nach der Verneinung idiomatisch ab. Das Präsens „gibt“ wahrt den zeitlichen Kontrast zum Perfekt des ersten Satzteils.
- source_word: τὸν ἀληθινόν
  choice: das wahre
  rationale: „Wahr“ lässt die johanneische Bedeutungsbreite von „echt“, „wirklich“ und „endgültig“ offen und vermeidet eine vorschnelle Deutung.
theological_decisions:
- issue: Gegensatz zwischen Mose und dem Vater als Geber
  choice: „Nicht Mose hat euch … gegeben, sondern mein Vater gibt euch …“
  alternative: „Mose hat euch nicht … gegeben, sondern …“
  rationale: Die gewählte Wortstellung erhält die besondere Hervorhebung des Handelnden durch οὐ Μωϋσῆς. Sie lässt zugleich offen, ob die Aussage Moses vermittelnde Rolle bestreitet oder vor allem den Vater als eigentlichen Geber herausstellt.
- issue: Zeitlicher und aspektueller Gegensatz der Verben
  choice: Perfekt „hat gegeben“ gegenüber Präsens „gibt“
  alternative: Präteritum „gab“ gegenüber Präsens „gibt“
  rationale: So bleibt der Gegensatz zwischen der in der Diskussion gegenwärtig relevanten früheren Gabe und dem gegenwärtigen Geben des Vaters erkennbar, ohne ihn theologisch auszudeuten.
- issue: Bedeutung des „wahren Brotes“
  choice: „das wahre Brot“
  alternative: „das wirkliche Brot“ oder „das echte Brot“
  rationale: „Wahr“ bewahrt die Spannung zwischen Echtheit und der im Johannesevangelium häufig anklingenden endgültigen Wirklichkeit, auf die frühere Zeichen hinweisen können.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. Die doppelte Amen-Formel und die syntaktische Hervorhebung von „Nicht Mose“ wurden bewusst erhalten.
