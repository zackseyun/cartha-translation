  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: de
  text: Was nun, wenn ihr den Menschensohn dorthin aufsteigen seht, wo er zuvor war?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wenn ihr nun den Menschensohn dorthin aufsteigen seht, wo er zuvor war?“ Im Griechischen ist dies eine rhetorische Bedingungsfrage, deren Folgerung unausgesprochen bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Was nun, wenn
  rationale: Die Wendung leitet eine rhetorische Bedingungsfrage ein und knüpft folgernd an den vorherigen Anstoß an. „Was nun, wenn“ gibt beides in natürlichem Deutsch wieder.
- source_word: θεωρῆτε
  choice: ihr … seht
  rationale: θεωρέω bezeichnet ein bewusstes Wahrnehmen oder Anschauen. Im Deutschen ist „seht“ hier natürlich; die Konstruktion mit „wenn“ bewahrt den vorgestellten, zukünftigen Fall.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Die feststehende Selbstbezeichnung Jesu wird bewahrt und behält ihre biblischen, insbesondere danielischen, Bezüge.
- source_word: ἀναβαίνοντα
  choice: aufsteigen
  rationale: Das Partizip bezeichnet eine Aufwärtsbewegung. „Aufsteigen“ wahrt sowohl den räumlichen Sinn als auch den möglichen himmlischen Bezug, ohne diesen ausdrücklich hinzuzufügen.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: dorthin …, wo er zuvor war
  rationale: Die Formulierung bezeichnet einen früheren Ort oder Zustand. „Dorthin, wo er zuvor war“ ist idiomatisch und erhält die Aussage über sein vorheriges Sein, ohne den Ort näher zu bestimmen.
theological_decisions:
- issue: Ob der Aufstieg ausdrücklich als Rückkehr in den Himmel oder zum Vater erklärt werden soll
  choice: „dorthin …, wo er zuvor war“ ohne interpretierende Ergänzung
  alternative: „in den Himmel, wo er zuvor war“ oder „zurück zum Vater“
  rationale: Der griechische Text legt Präexistenz und himmlische Herkunft nahe, nennt jedoch weder den Himmel noch den Vater ausdrücklich. Die offene Formulierung bewahrt die christologische Aussagekraft, ohne über den Wortlaut hinauszugehen.
- issue: Wie die unvollständige rhetorische Bedingungsfrage wiederzugeben ist
  choice: „Was nun, wenn …?“
  alternative: „Wenn ihr nun … seht?“
  rationale: Im Griechischen bleibt der Nachsatz unausgesprochen. Die deutsche Form bewahrt diesen rhetorischen Charakter und vermeidet, eine bestimmte Folgerung ergänzend festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die etablierte Bezeichnung „Menschensohn“ und die offene rhetorische Struktur bleiben erhalten.
