id: JHN.6.28
reference: John 6:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Was müssen wir tun, um die Werke Gottes zu vollbringen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was sollen wir tun, damit wir die Werke Gottes tun?“ Der griechische Ausdruck kann auch „die Werke, die Gott verlangt“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: sagten sie
  rationale: Der Aorist von λέγω wird im erzählenden Zusammenhang natürlich als einfaches Präteritum wiedergegeben.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt den Gesprächsgang fort und kann zugleich eine Folgerung markieren. „Da“ klingt im modernen deutschen Erzählstil natürlich, ohne die logische Kraft zu überzeichnen.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Bei einem Verb des Sprechens bezeichnet πρός mit Akkusativ den Adressaten.
- source_word: Τί ποιῶμεν
  choice: Was müssen wir tun
  rationale: Der deliberative Konjunktiv fragt nach dem erforderlichen Handeln. „Müssen“ gibt diesen praktischen Anspruch idiomatisch wieder.
- source_word: ἵνα
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt den finalen Sinn von ἵνα knapp und natürlich wieder.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: die Werke … vollbringen
  rationale: „Vollbringen“ vermittelt den Sinn von ἐργάζομαι als bewirken oder ausführen. Die im Griechischen enthaltene Wortverbindung zwischen Verb und Substantiv lässt sich im Deutschen nicht ohne die schwerfällige Formulierung „Werke wirken“ vollständig nachbilden.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ bewahrt die johanneische und theologische Tragweite des Ausdrucks besser als „Aufgaben“ oder „Taten“.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der formale Genitiv bleibt erhalten und damit auch seine mögliche Deutung als Werke, die Gott verlangt, die Gott gehören oder die von Gott ausgehen.
theological_decisions:
- issue: Bedeutung des Genitivs in τὰ ἔργα τοῦ θεοῦ
  choice: „die Werke Gottes“ bleibt im Haupttext bewusst offen.
  alternative: „die Werke, die Gott verlangt“ beziehungsweise „Gottes eigene Werke“
  rationale: Der griechische Genitiv legt die Beziehung nicht eindeutig fest; zudem greift Vers 29 diese Spannung auf. Eine eindeutige Auslegung im Haupttext würde dem Wortlaut vorgreifen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da sagten sie“ wahrt den erzählerischen Anschluss; „vollbringen“ vermeidet das im heutigen Deutsch unnatürliche „Werke wirken“. Der Fußnotenmarker steht unmittelbar nach der gesamten direkten Rede.
