  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: de
  text: 'Da murrten die Juden[a] über ihn, weil er gesagt hatte: »Ich bin das Brot, das vom Himmel herabgekommen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »die Judäer«; in manchen Zusammenhängen auch »jüdische Führungspersonen«. Die johanneische Bezeichnung »die Juden« kann eine bestimmte Gruppe meinen, die Jesus widerspricht, und nicht das jüdische Volk als Ganzes.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: murrten
  rationale: Das Imperfekt beschreibt ein anhaltendes oder wiederholtes Murren. „Murrten“ ist im Deutschen verständlich und bewahrt zugleich den möglichen Anklang an das Murren Israels in der Wüste.
- source_word: οὖν
  choice: Da
  rationale: „Da“ stellt einen natürlichen erzählerischen und folgernden Anschluss an Jesu vorangehende Aussage her, ohne eine streng logische Folgerung zu erzwingen.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies gibt die johanneische Formulierung unmittelbar wieder, ohne den Bezug im Haupttext ausdrücklich auf Führungspersonen oder Bewohner Judäas zu verengen. Eine Fußnote schützt vor einer pauschalen Deutung auf das jüdische Volk insgesamt.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: περί mit Genitiv bedeutet hier „über/wegen ihn“. „Über ihn murren“ ist natürliches Deutsch und verstärkt die feindselige Bedeutung nicht unnötig zu „gegen ihn“.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι führt hier den Grund des Murrens ein. „Weil“ macht den kausalen Zusammenhang idiomatisch deutlich.
- source_word: εἶπεν
  choice: gesagt hatte
  rationale: Das deutsche Plusquamperfekt verdeutlicht, dass Jesu Aussage dem daraufhin einsetzenden Murren vorausging, ohne den Sinn des griechischen Aorists zu verändern.
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die direkte Wiedergabe erhält die betonte Selbstbezeichnung und vermeidet eine interpretierende Erweiterung.
- source_word: ὁ ἄρτος
  choice: das Brot
  rationale: Der bestimmte Artikel wird bewahrt und kennzeichnet Jesus als „das Brot“, nicht lediglich allgemein als Brot.
- source_word: ὁ καταβὰς
  choice: das … herabgekommen ist
  rationale: Der substantivisch-artikulierte Aoristpartizip wird durch einen natürlichen deutschen Relativsatz wiedergegeben. „Herabgekommen“ bewahrt die räumliche Richtung der Aussage.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: „Vom Himmel“ ist die geläufige deutsche Wiedergabe und erhält die Aussage über Herkunft und Ausgangspunkt.
theological_decisions:
- issue: Bezug und Übersetzung von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext „die Juden“, mit erläuternder Fußnote
  alternative: „die Judäer“ oder kontextuell „die jüdischen führenden Männer“
  rationale: Die direkte Wiedergabe wahrt die Formulierung des griechischen Textes und legt den Bezug nicht enger fest, als dieser Vers es ausdrücklich tut. Zugleich stellt die Fußnote klar, dass Johannes damit je nach Zusammenhang eine bestimmte Gruppe jüdischer Gegner Jesu bezeichnen kann und nicht pauschal das gesamte jüdische Volk meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murrten“ erhält den biblischen Anklang an die Wüstenerzählungen, bleibt aber allgemein verständlich. Die Satzstellung folgt natürlichem deutschem Erzählstil.
