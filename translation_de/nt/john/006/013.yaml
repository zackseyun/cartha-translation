  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: de
  text: Da sammelten sie sie ein und füllten zwölf Körbe mit Brotstücken von den fünf Gerstenbroten, die denen, die gegessen hatten, übrig geblieben waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „Stücke“. Wörtlich: „Brotstücke von den fünf Gerstenbroten, die den Essenden übrig geblieben waren“; die genaue Beziehung des griechischen Dativs kann auch als „für die Essenden“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Da sammelten sie ... ein
  rationale: Das aoristische Verb bezeichnet das Einsammeln auf Jesu vorherige Anweisung hin; „Da“ gibt die folgernde narrative Verknüpfung von οὖν natürlich wieder.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: füllten zwölf Körbe
  rationale: Direkte und klare Wiedergabe; κοφίνοι sind Körbe, ohne dass ihre genaue Bauart im Haupttext festgelegt werden muss.
- source_word: κλασμάτων
  choice: mit den Resten
  rationale: Gemeint sind die nach dem Brechen und Essen verbliebenen Brotstücke. „Reste“ passt im Deutschen natürlich zur Mahlzeitsituation; die konkretere Alternative wird in der Fußnote genannt.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: von den fünf Gerstenbroten
  rationale: Bewahrt Herkunft und Material der Brotstücke; „Gerstenbrote“ ist eine natürliche, präzise deutsche Wiedergabe.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: die bei denen, die gegessen hatten, übrig geblieben waren
  rationale: Bewahrt die Zuordnung des griechischen Dativs zu den Essenden, ohne ihn kausal als „von ihnen übrig gelassen“ festzulegen. Das Plusquamperfekt entspricht der vorzeitigen vollendeten Mahlzeit.
theological_decisions:
- issue: Bezug und Sinn von τοῖς βεβρωκόσιν
  choice: „bei denen, die gegessen hatten“
  alternative: „von denen übrig gelassen, die gegessen hatten“ oder „für diejenigen, die gegessen hatten“
  rationale: Der Dativ lässt die genaue Beziehung offen. Die gewählte Formulierung drückt die Verbindung zu den Essenden aus, ohne Verantwortung für das Übriglassen oder einen Zweck ausdrücklich in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ hält den erzählerischen Anschluss knapp; „sammelten ... ein“ und „übrig geblieben“ sind allgemein verständlich. Die Fußnote bewahrt die konkretere Bedeutung von κλάσματα und die ungewöhnliche griechische Dativkonstruktion.
