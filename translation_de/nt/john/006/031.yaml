id: JHN.6.31
reference: John 6:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: de
  text: 'Unsere Väter[a] aßen das Manna in der Wüste[b], wie geschrieben steht: »Brot vom Himmel gab er ihnen zu essen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsere Vorfahren“. Wörtlich: „Unsere Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Einöde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Die wörtliche und im biblischen Zusammenhang geläufige Wiedergabe bewahrt die maskuline Form des Griechischen; „unsere Vorfahren“ ist als natürliche Bedeutungsalternative in der Fußnote angegeben.
- source_word: τὸ μάννα
  choice: das Manna
  rationale: „Manna“ ist die etablierte Bezeichnung für die Speise während der Wüstenwanderung; der bestimmte Artikel bezeichnet die aus der Überlieferung bekannte Gabe.
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist von ἐσθίω bezeichnet hier schlicht das Essen als vergangenes Geschehen.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die natürliche, intertextuell vertraute Bezeichnung für den Schauplatz der Exodusüberlieferung; „Einöde“ wäre ebenfalls möglich, klingt hier aber weniger geläufig.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: wie geschrieben steht
  rationale: Diese etablierte deutsche Schriftformel gibt den bleibenden Geltungsaspekt des griechischen Perfekts natürlich wieder.
- source_word: Ἄρτον
  choice: Brot
  rationale: ἄρτος bedeutet hier allgemein „Brot“ beziehungsweise Nahrung und bezeichnet keinen einzelnen Laib.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Verbindung „vom Himmel“ gibt Herkunft und biblische Bildsprache idiomatisch wieder.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: gab er ihnen zu essen
  rationale: Die deutsche Konstruktion bewahrt Dativ und Infinitiv des griechischen Ausdrucks, ohne ihn auszudeuten.
theological_decisions:
- issue: Das Zitat über das Manna ohne Vorwegnahme seiner späteren christologischen Deutung wiedergeben
  choice: „Brot vom Himmel gab er ihnen zu essen“ ohne deutende Erweiterung
  alternative: Durch Großschreibung oder erklärende Formulierung bereits ausdrücklich auf Jesus als das wahre Brot beziehen
  rationale: Hier führen die Sprecher zunächst die Schrift und die historische Mannagabe an. Die weitergehende christologische Bedeutung soll sich erst im Fortgang der Rede entfalten.
- issue: Das im Zitat nicht ausdrücklich genannte Subjekt von ἔδωκεν offenlassen
  choice: Das Pronomen „er“ verwenden, ohne im Haupttext „Gott“ oder „Mose“ einzusetzen
  alternative: Das Subjekt ausdrücklich als „Gott“ oder „Mose“ benennen
  rationale: Das Griechische nennt an dieser Stelle kein Substantiv als Subjekt. Die Übersetzung bewahrt diese grammatische Offenheit, die im folgenden Vers für Jesu Erwiderung bedeutsam ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Schriftformel „wie geschrieben steht“ und die bekannte Bezeichnung „Manna“ sichern den biblischen Klang, während Satzbau und Wortwahl gut verständlich bleiben. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
