  source_fidelity: „Von da an“ gibt Ἐκ τούτου im erzählerischen Kontext angemessen temporal wieder. „Viele seiner Jünger“ bewahrt den partitiven Bezug, ohne die Gruppe auf die Zwölf zu beschränken. „Zogen sich … zurück“ trifft ἀπῆλθον εἰς τὰ ὀπίσω, und „gingen nicht mehr mit ihm“ gibt das fortan beendete Mitgehen bzw. die fortgesetzte Gemeinschaft aus οὐκέτι μετ’ αὐτοῦ περιεπάτουν idiomatisch wieder.
  naturalness: Der Satz ist klares, modernes Standarddeutsch und wahrt einen würdigen biblischen Erzählton. Die Verbindung „zogen sich zurück und gingen nicht mehr mit ihm“ ist verständlich und nicht unnötig erklärend.
  terminology: „Jünger“ ist für μαθηταί die sachgerechte etablierte Bezeichnung und legt weder eine Identifikation mit den Zwölf noch eine konfessionelle Bewertung ihres Glaubensstatus nahe. Die Fußnote erhält die mögliche kausale Lesart der griechischen Eröffnung, ohne sie zur Hauptlesart zu machen.
