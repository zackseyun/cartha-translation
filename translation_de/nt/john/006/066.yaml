id: JHN.6.66
reference: John 6:66
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: de
  text: Von da an zogen sich viele seiner Jünger zurück und gingen nicht mehr mit ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deshalb zogen sich viele seiner Jünger zurück“; die griechische Anfangsformulierung kann auch kausal verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Von da an
  rationale: Die Wendung wird im Kontext am besten temporal als Beginn eines entscheidenden Umschwungs verstanden. „Von da an“ ist im modernen Deutschen natürlich und lässt den Zusammenhang mit dem vorangehenden Geschehen erkennen.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: viele seiner Jünger
  rationale: Die partitive Konstruktion bezeichnet viele aus der größeren Gruppe seiner Jünger. Die knappe deutsche Formulierung gibt diesen Sinn idiomatisch wieder, ohne sie mit den Zwölf gleichzusetzen.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: zogen sich … zurück
  rationale: Verb und Richtungsangabe bilden zusammen den Sinn des Zurückweichens beziehungsweise Abwendens. „zogen sich zurück“ trifft dies natürlicher als eine wörtliche Wiedergabe mit „nach hinten“.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Wendung bezeichnet das Ende eines bis dahin andauernden Verhaltens.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: gingen nicht mehr mit ihm
  rationale: „Mit ihm gehen“ bewahrt das Bild des gemeinsamen Weges und zugleich dessen Bedeutung als fortgesetzte Zugehörigkeit und Nachfolge, ohne diese auf nur einen Aspekt festzulegen.
theological_decisions:
- issue: Ob μαθηταί die Zwölf oder ausschließlich wahre Glaubende bezeichnet
  choice: Jünger
  alternative: Anhänger
  rationale: Der Text spricht von vielen aus Jesu Jüngerkreis, ohne sie mit den Zwölf gleichzusetzen oder ihren inneren Glaubensstatus abschließend zu bestimmen. „Jünger“ bewahrt diese erzählerische und theologische Spannung.
- issue: Temporale oder kausale Deutung von Ἐκ τούτου
  choice: Von da an
  alternative: Deshalb
  rationale: Der unmittelbare Zusammenhang legt einen zeitlichen Wendepunkt nahe. Da die griechische Wendung jedoch auch kausal verstanden werden kann, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „zogen sich zurück“ und „gingen … mit ihm“ vermeiden eine schwerfällige wörtliche Wiedergabe, bewahren aber sowohl die Bewegung weg von Jesus als auch das Bild des gemeinsamen Weges.
