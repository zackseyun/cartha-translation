id: JHN.6.65
reference: John 6:65
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: de
  text: 'Und er sagte: „Darum habe ich euch gesagt: Niemand kann zu mir kommen, wenn es ihm nicht vom Vater gegeben ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das Imperfekt kann den fortlaufenden Diskurs markieren. Im natürlichen Deutschen gibt das Präteritum die Äußerung in diesem Zusammenhang angemessen wieder; „er sagte immer wieder“ würde eine Wiederholung zu stark festlegen.
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Die knappe deutsche Verknüpfung verweist auf den zuvor genannten Grund und leitet Jesu Erklärung natürlich ein.
- source_word: εἴρηκα
  choice: habe ich euch gesagt
  rationale: Das Perfekt bezeichnet eine bereits gemachte, weiterhin maßgebliche Aussage. Das deutsche Perfekt bewahrt diesen Bezug; „euch“ gibt ὑμῖν ausdrücklich wieder.
- source_word: οὐδεὶς δύναται
  choice: Niemand kann
  rationale: „Kann“ drückt hier Unvermögen und nicht bloß fehlende Erlaubnis aus und ist idiomatischer als „ist imstande“.
- source_word: ἐλθεῖν πρός με
  choice: zu mir kommen
  rationale: Dies ist die natürliche und im johanneischen Zusammenhang angemessene Wiedergabe, ohne die relationale beziehungsweise glaubensbezogene Bedeutung erläuternd auszuweiten.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: wenn es ihm nicht gegeben ist
  rationale: Die passive Konstruktion und das unbestimmte „es“ bleiben erhalten. „gegeben“ steht nahe am Grundsinn von δίδωμι; „ihm“ bewahrt den grammatisch maskulinen Singular mit generischer Reichweite.
- source_word: ἐκ τοῦ πατρός
  choice: vom Vater
  rationale: „Vom“ gibt den Ursprung beziehungsweise die Quelle wieder und lässt im Deutschen zugleich die natürliche passive Beziehung zum Vater erkennen, ohne ἐκ ausschließlich als Agensangabe festzulegen.
theological_decisions:
- issue: Göttliche Ermöglichung und menschliche Fähigkeit, zu Jesus zu kommen
  choice: Die notwendige Bedingung wird unmittelbar als etwas wiedergegeben, das einem Menschen vom Vater gegeben sein muss.
  alternative: Die Aussage ausdrücklich als unwiderstehliche Gewährung oder als allen vorausgehende Befähigung deuten.
  rationale: Der griechische Satz bekräftigt die Unfähigkeit ohne dieses Geben, entscheidet aber nicht die späteren Lehrstreitigkeiten über Art, Umfang und Wirksamkeit der göttlichen Gabe.
- issue: Generisches Maskulinum αὐτῷ
  choice: ihm
  alternative: diesem Menschen; der betreffenden Person
  rationale: „Ihm“ entspricht dem maskulinen Singular des Ausgangstextes und kann im Deutschen hier generisch verstanden werden, ohne den Bezug auf Männer einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist klar und mündlich verständlich. Keine Fußnote ist nötig, da „gegeben“ und „vom Vater“ die maßgebliche Lesart knapp bewahren und die generische Funktion von „ihm“ im Deutschen hinreichend erkennbar ist.
