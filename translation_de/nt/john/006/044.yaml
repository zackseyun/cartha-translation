source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: de
  text: Niemand kann zu mir kommen, wenn nicht der Vater, der mich gesandt hat, ihn[b] zieht[a]; und ich werde ihn am letzten Tag auferwecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit sich zieht“, möglicherweise auch stärker: „zerrt“. Das griechische Verb kann ein kräftiges Ziehen bezeichnen. „Zieht“ lässt offen, wie das Wirken des Vaters hier genauer zu verstehen ist.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Pronomen steht in der männlichen Einzahl, ist hier aber stellvertretend gebraucht; die Aussage gilt allgemein und nicht nur Männern.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Niemand kann
  rationale: Die natürliche deutsche Formulierung bewahrt sowohl die umfassende Verneinung als auch die Aussage über das Vermögen beziehungsweise die Fähigkeit.
- source_word: ἐλθεῖν πρός με
  choice: zu mir kommen
  rationale: Gibt die Bewegung auf Jesus hin unmittelbar wieder und bewahrt zugleich den relationalen Sinn im johanneischen Zusammenhang, ohne ihn auszudeuten.
- source_word: ἐὰν μὴ
  choice: wenn nicht
  rationale: Die Konstruktion lässt sich hier natürlich als ausschließende Bedingung mit „wenn nicht“ wiedergeben; dadurch bleibt auch die griechische Satzstruktur erkennbar.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: der Vater, der mich gesandt hat
  rationale: Das substantivierte Partizip wird als deutscher Relativsatz wiedergegeben. „Gesandt hat“ wahrt den Sendungsgedanken und passt zum gehobenen, aber gegenwärtigen Register.
- source_word: ἑλκύσῃ
  choice: zieht
  rationale: „Zieht“ bewahrt die Bewegung verursachende Kraft des Verbs, ohne durch „zerrt“ oder eine erklärende Umschreibung vorab festzulegen, auf welche Weise der Vater handelt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen des Griechischen wird formal bewahrt; eine Fußnote stellt klar, dass es hier stellvertretend und allgemein gebraucht ist.
- source_word: κἀγὼ
  choice: und ich
  rationale: Gibt die Verbindung von καί und ἐγώ knapp wieder; das ausdrücklich gesetzte „ich“ erhält die Hervorhebung des Subjekts.
- source_word: ἀναστήσω
  choice: werde … auferwecken
  rationale: „Auferwecken“ bezeichnet im Deutschen eindeutig die endzeitliche Auferstehung und entspricht dem Sinn des Verbs in diesem johanneischen Zusammenhang.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: Dies ist die idiomatische deutsche Wiedergabe der Zeitangabe und bewahrt ihren endzeitlichen Bezug.
theological_decisions:
- issue: Bedeutung von ἑλκύσῃ in einem theologisch umstrittenen Zusammenhang
  choice: zieht
  alternative: zerrt; zieht mit sich
  rationale: Das Verb kann je nach Zusammenhang ein kräftiges Ziehen bezeichnen. „Zieht“ lässt diese Stärke zu, zwingt dem Vers aber keine bestimmte Erklärung darüber auf, wie das Wirken des Vaters und das Kommen des Menschen zueinander stehen.
- issue: Allgemeiner Bezug des maskulinen Pronomens αὐτόν
  choice: ihn, mit erläuternder Fußnote
  alternative: diesen Menschen; die betreffende Person
  rationale: Die gewählte Form folgt dem grammatischen Singular des Ausgangstextes. Die Fußnote verhindert zugleich das Missverständnis, die Aussage gelte ausschließlich Männern.
- issue: Bedeutung von ἀναστήσω
  choice: werde … auferwecken
  alternative: werde … aufstehen lassen
  rationale: Der unmittelbare Zusammenhang und die Zeitangabe „am letzten Tag“ weisen auf die Auferstehung der Toten. „Auferwecken“ gibt dies klar wieder, ohne darüber hinaus Einzelheiten der Eschatologie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hält den Relativsatz eng bei „der Vater“ und bewahrt dennoch einen gut verständlichen Satzfluss. Das Semikolon macht die zwei eng verbundenen Aussagen übersichtlich, ohne ihre Verbindung abzuschwächen.
