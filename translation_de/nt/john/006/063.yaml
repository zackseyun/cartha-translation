id: JHN.6.63
reference: John 6:63
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: de
  text: Der Geist ist es, der lebendig macht; das Fleisch nützt nichts.[a] Die Worte, die ich zu euch gesprochen habe, sind Geist[b] und sind Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Fleisch“ kann hier umfassend das rein Menschliche bezeichnen. Die Übersetzung „sündige Natur“ wäre enger, als es der griechische Ausdruck verlangt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sind vom Geist“ beziehungsweise „sind geistlich“. Die griechische Formulierung ist knapp und wahrscheinlich qualitativ; sie kann auch stärker auf den Heiligen Geist bezogen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Artikel und der johanneische Zusammenhang sprechen am ehesten für den Heiligen Geist. Die Großschreibung gibt diesen wahrscheinlichen Bezug wieder, ohne die lexikalisch mögliche Bedeutung „Geist“ als allgemeineres Prinzip auszuschließen.
- source_word: ζῳοποιοῦν
  choice: der lebendig macht
  rationale: Das substantivierte Präsenspartizip bezeichnet fortdauerndes Lebendigmachen. „Lebendig macht“ ist direkt, natürlich und bewahrt den verbalen Charakter.
- source_word: ἡ σὰρξ
  choice: das Fleisch
  rationale: „Fleisch“ erhält die bewusst breite Gegenüberstellung zu „Geist“. Deutungen wie „sündige Natur“, „menschliches Bemühen“ oder „Körper“ würden den griechischen Ausdruck unnötig verengen.
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: nützt nichts
  rationale: Die Formulierung gibt die uneingeschränkte Verneinung knapp und idiomatisch wieder.
- source_word: τὰ ῥήματα
  choice: die Worte
  rationale: ῥήματα bezeichnet hier gesprochene Äußerungen; „Worte“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: λελάληκα
  choice: ich ... gesprochen habe
  rationale: Das Perfekt verweist auf bereits gesprochene Worte mit fortbestehender Bedeutung. Das deutsche Perfekt bildet dies im Kontext natürlich ab.
- source_word: πνεῦμά ἐστιν
  choice: sind Geist
  rationale: Die artikellose Prädikatsnennung ist wahrscheinlich qualitativ. Die knappe Formulierung bewahrt die Spannung des Griechischen besser als das deutendere „sind geistlich“ oder „machen lebendig“.
- source_word: ζωή
  choice: Leben
  rationale: „Leben“ ist die direkte Entsprechung und bewahrt die theologische Tiefe des johanneischen Sprachgebrauchs.
theological_decisions:
- issue: Bezug von πνεῦμα im ersten Satzteil
  choice: „der Geist“ als wahrscheinlicher Bezug auf den Heiligen Geist
  alternative: „der Geist“ als allgemeines geistiges Prinzip oder als menschlicher Geist
  rationale: Der bestimmte Ausdruck und der Zusammenhang des Johannesevangeliums legen den Heiligen Geist als lebensschaffenden Handelnden nahe. Die Übersetzung fügt jedoch „Heilige“ nicht in den Haupttext ein.
- issue: Bedeutung von σάρξ im Gegensatz zum Geist
  choice: den breiten Ausdruck „Fleisch“ beibehalten
  alternative: „sündige Natur“, „bloß menschliche Kraft“ oder „Körper“
  rationale: Der Vers selbst legt keine dieser engeren Auslegungen eindeutig fest. „Fleisch“ bewahrt die theologische Spannung und vermeidet eine konfessionell oder anthropologisch vorgeprägte Festlegung.
- issue: Prädikative Bedeutung von πνεῦμά ἐστιν im Schlusssatz
  choice: 'qualitativ: „sind Geist“'
  alternative: 'identifizierend: „sind der Geist“; deutend: „sind geistlich“ oder „sind geistgewirkt und lebenspendend“'
  rationale: Das artikellose Prädikatsnomen spricht für eine qualitative Aussage. Die wörtlich knappe Wiedergabe lässt offen, wie genau das Verhältnis der Worte zum Geist zu bestimmen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Der Geist ist es, der ...“ bildet die Hervorhebung des griechischen Ausdrucks natürlich ab. Der absolute Gegensatz zwischen Geist und Fleisch sowie die knappe Aussage „sind Geist und sind Leben“ bleiben bewusst unaufgelöst.
