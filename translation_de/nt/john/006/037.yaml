review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung folgt dem griechischen Text sorgfältig. „Alles, was“ gibt das neutrale kollektive πᾶν ὃ angemessen wieder, ohne die referierte Größe zu individualisieren. Präsens („gibt“), Futur („wird ... kommen“) und die generische Partizipialkonstruktion („wer ... kommt“) sind treffend abgebildet. „Ganz gewiss nicht hinausstoßen“ vermittelt die starke Negation οὐ μὴ und berücksichtigt mit „hinaus-“ auch die Verstärkung durch ἔξω.
  naturalness: Modernes, gut verständliches Standarddeutsch mit würdigem, zum Johannesevangelium passendem Register. Die Korrelativform „wer ..., den ...“ ist idiomatisch; das Semikolon gliedert die zwei eng verknüpften Aussagen klar.
  terminology: „Der Vater“ wahrt den griechischen Artikel und die johanneische Ausdrucksweise. „Zu mir kommen“ ist terminologisch und stilistisch passend. „Hinausstoßen“ ist eine formnahe und im Kontext verständliche Wiedergabe von ἐκβάλω ἔξω; sie vermeidet eine theologisch ausdeutende Paraphrase wie „nicht abweisen“.
