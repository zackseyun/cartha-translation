source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: de
  text: Alles, was der Vater mir gibt, wird zu mir kommen; und wer zu mir kommt, den werde ich ganz gewiss nicht hinausstoßen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „werde ich niemals hinausstoßen“ oder „werde ich keinesfalls hinausstoßen“. Im Griechischen steht eine nachdrückliche Verneinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Alles, was
  rationale: Die neutrale Singularform wird als kollektiver Ausdruck wiedergegeben. „Alles, was“ bewahrt die grammatische Form und bleibt im Deutschen natürlich, ohne sie ausdrücklich zu „jeder, den“ zu personalisieren.
- source_word: δίδωσίν μοι
  choice: mir gibt
  rationale: Der griechische Präsensindikativ wird mit einfachem Präsens wiedergegeben, ohne den Vorgang als abgeschlossen oder ausdrücklich fortlaufend zu deuten.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Der bestimmte Artikel wird bewahrt; ein im Griechischen nicht ausdrücklich vorhandenes „mein“ wird nicht ergänzt.
- source_word: πρὸς ἐμὲ ἥξει
  choice: wird zu mir kommen
  rationale: Dies ist eine natürliche und zugleich formnahe Wiedergabe der zukünftigen Bewegung auf Jesus hin.
- source_word: τὸν ἐρχόμενον πρός με
  choice: wer zu mir kommt, den
  rationale: Die deutsche Korrelativkonstruktion gibt das substantivierte Partizip idiomatisch wieder und bewahrt dessen allgemeinen, auf eine Person bezogenen Sinn.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: werde ich ganz gewiss nicht hinausstoßen
  rationale: „Ganz gewiss nicht“ vermittelt die nachdrückliche Verneinung οὐ μή. „Hinausstoßen“ nimmt sowohl ἐκβάλλω als auch das verstärkende ἔξω auf, ohne die Aussage dogmatisch auszuweiten.
theological_decisions:
- issue: Das kollektive Neutrum πᾶν ὃ im Verhältnis von göttlichem Geben und menschlichem Kommen
  choice: „Alles, was der Vater mir gibt“
  alternative: „Jeder, den der Vater mir gibt“
  rationale: Die Übersetzung bewahrt den neutralen kollektiven Ausdruck des Griechischen und entscheidet nicht stillschweigend, ob einzelne Personen oder eine Gesamtheit als Einheit im Vordergrund stehen.
- issue: Die Stärke der Zusage in οὐ μὴ ἐκβάλω ἔξω
  choice: „werde ich ganz gewiss nicht hinausstoßen“
  alternative: „werde ich niemals hinausstoßen“
  rationale: Die emphatische Verneinung wird deutlich ausgedrückt, ohne daraus eine weitergehende Lehrformel über Beharren oder Abfall abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon macht die beiden eng verbundenen Aussagen gut lesbar. Die kollektive neutrale Form wird im Haupttext bewahrt; die emphatische Verneinung wird im Haupttext deutlich und in der Fußnote mit idiomatischen Alternativen erläutert.
