  text: ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: de
  text: Dies sagte er, als er in der Synagoge von Kafarnaum lehrte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: Dies
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist zusammenfassend auf die vorangehenden Worte. „Dies“ ist im Deutschen natürlich und kann den gesamten vorangehenden Redeinhalt bezeichnen, auch wenn das Griechische formal im Neutrum Plural steht.
- source_word: εἶπεν
  choice: sagte er
  rationale: Der Aorist von λέγω bezeichnet hier schlicht das Sagen. Das im Griechischen nur durch die Verbform ausgedrückte Subjekt wird im Deutschen mit „er“ wiedergegeben; Jesus ist aus dem Zusammenhang eindeutig.
- source_word: ἐν συναγωγῇ
  choice: in der Synagoge
  rationale: Obwohl im Griechischen kein Artikel steht, kann die Präpositionalfügung kontextuell bestimmt sein. Gemeint ist natürlich die örtliche Synagoge in Kafarnaum.
- source_word: διδάσκων
  choice: als er … lehrte
  rationale: Das präsentische Partizip beschreibt eine zum Sagen gleichzeitige Tätigkeit. Der Nebensatz gibt dieses Verhältnis in natürlichem Deutsch wieder.
- source_word: ἐν Καφαρναούμ
  choice: von Kafarnaum
  rationale: In Verbindung mit „Synagoge“ ist „die Synagoge von Kafarnaum“ eine natürliche deutsche Ortsangabe und bewahrt den lokalen Bezug des griechischen ἐν Καφαρναούμ.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satz bleibt knapp und folgt der griechischen Informationsstruktur, ohne den Namen Jesu ausdrücklich hinzuzufügen.
