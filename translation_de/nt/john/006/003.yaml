  text: Dann ging Jesus auf den Berg hinauf und saß dort mit seinen Jüngern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: ging … hinauf
  rationale: Der Aorist von ἀνέρχομαι bezeichnet hier eine gewöhnliche räumliche Aufwärtsbewegung. Die deutsche Verbklammer „ging … hinauf“ gibt dies natürlich und präzise wieder.
- source_word: δὲ
  choice: Dann
  rationale: δέ führt hier die Erzählung weiter, ohne einen deutlichen Gegensatz auszudrücken. „Dann“ bildet diesen narrativen Fortgang idiomatisch ab.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: Mit ἀνῆλθεν bezeichnet die Wendung die Bewegung auf einen Berg beziehungsweise Berghang hinauf. „Auf den Berg“ ist im Deutschen idiomatisch und bewahrt den bestimmten Artikel, ohne einen namentlich bekannten Berg vorauszusetzen.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das einfache Ortsadverb wird im Deutschen natürlich mit „dort“ wiedergegeben.
- source_word: ἐκάθητο
  choice: setzte sich
  rationale: Die Form von κάθημαι beschreibt hier im Erzählablauf, dass Jesus dort Platz nahm. „Setzte sich“ ist natürliches Deutsch und passt zur auf den Ortswechsel folgenden Szene; auch „saß“ wäre grammatisch möglich, würde aber eher einen bereits bestehenden Zustand hervorheben.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: mit seinen Jüngern
  rationale: μετά mit Genitiv bedeutet „mit“. „Jünger“ bewahrt im Evangelienkontext die Beziehung von Schülern und Nachfolgern zu ihrem Lehrer.
