id: JHN.6.24
reference: John 6:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: de
  text: Als nun die Menge sah, dass Jesus nicht dort war und auch seine Jünger nicht, stiegen sie selbst in die Boote[a] und kamen nach Kafarnaum, um Jesus zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die kleinen Boote«; im Griechischen steht eine Verkleinerungsform von »Boot«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Als nun
  rationale: Gibt sowohl den zeitlichen Anschluss durch ὅτε als auch die fortführende beziehungsweise folgernde Funktion von οὖν in natürlichem erzählendem Deutsch wieder.
- source_word: ὁ ὄχλος
  choice: die Menge
  rationale: Bezeichnet hier die versammelte Menschenmenge und ist im modernen Deutschen klar und idiomatisch.
- source_word: εἶδεν
  choice: sah
  rationale: Bewahrt die konkrete Grundbedeutung, ohne den Vorgang durch »erkannte« oder »bemerkte« stärker kognitiv auszudeuten.
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: nicht dort war
  rationale: Das griechische Präsens steht innerhalb einer vergangenen Erzählung; die deutsche Rückverlagerung ins Präteritum ist hier natürlich.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: und auch seine Jünger nicht
  rationale: Gibt die negative Hinzufügung idiomatisch wieder und lässt offen, dass das Prädikat aus dem ersten Satzteil mitzudenken ist.
- source_word: ἐνέβησαν
  choice: stiegen ... in
  rationale: Bezeichnet konkret das Einsteigen in Wasserfahrzeuge und entspricht natürlichem deutschem Sprachgebrauch.
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Erhält die ausdrückliche Betonung des griechischen Personalpronomens.
- source_word: τὰ πλοιάρια
  choice: die Boote
  rationale: Die Grundreferenz wird im Haupttext flüssig wiedergegeben; die mögliche diminutive Nuance wird in einer Fußnote bewahrt.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: kamen nach Kafarnaum
  rationale: Folgt der Grundbedeutung von ἔρχομαι und verwendet bei Ortsnamen die im Deutschen übliche Richtungsangabe mit »nach«.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: um Jesus zu suchen
  rationale: Gibt das begleitende Partizip als zielgerichtete Handlung in klarem modernem Deutsch wieder, ohne eine geistliche Sonderbedeutung in »suchen« hineinzulesen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. Die Satzstruktur bleibt nahe am griechischen Handlungsablauf; die emphatische Wendung »sie selbst« und die mögliche Verkleinerungsbedeutung von πλοιάρια bleiben erhalten.
