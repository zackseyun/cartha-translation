  text: I am the bread of life.
translation:
  language: de
  text: Ich bin das Brot des Lebens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Ich bin
  rationale: Die ausdrückliche griechische Subjektform ἐγώ zusammen mit εἰμι wird im Deutschen natürlich mit „Ich bin“ wiedergegeben. Eine Verstärkung wie „Ich selbst bin“ ist möglich, aber hier nicht nötig.
- source_word: ὁ ἄρτος
  choice: das Brot
  rationale: Der bestimmte Artikel und das Prädikatsnomen werden als „das Brot“ wiedergegeben. „Der Laib“ wäre zu konkret und in diesem Bild weniger idiomatisch.
- source_word: τῆς ζωῆς
  choice: des Lebens
  rationale: Die formnahe Wiedergabe bewahrt die knappe Genitivverbindung und lässt offen, in welchem genauen Sinn das Brot zum Leben gehört oder Leben vermittelt.
theological_decisions:
- issue: Aussagekraft der Ich-bin-Formulierung
  choice: Ich bin
  alternative: Ich selbst bin; Ich bin es
  rationale: Hier steht keine absolute Ich-bin-Aussage, sondern eine Aussage mit dem Prädikat „das Brot des Lebens“. Die Übersetzung wahrt Jesu starke Selbstidentifikation, ohne sie durch eine theologische Paraphrase auszuweiten.
- issue: Bedeutung des Genitivs „des Lebens“
  choice: des Lebens
  alternative: das Leben gibt; zum Leben
  rationale: Der Genitiv kann inhaltlich eine lebensspendende Beziehung nahelegen, doch die Übersetzung bewahrt die im Griechischen vorhandene Kürze und Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die traditionelle und natürliche Formulierung entspricht eng dem griechischen Satz.
