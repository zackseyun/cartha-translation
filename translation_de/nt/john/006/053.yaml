id: JHN.6.53
reference: John 6:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: „Amen, amen, ich sage euch: Wenn ihr nicht das Fleisch[a] des Menschensohnes esst und sein Blut trinkt, habt ihr kein Leben[b] in euch selbst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Leib“; im Griechischen steht wörtlich „Fleisch“ (σάρξ), was die konkrete Schärfe der Aussage bewahrt.
    reason: lexical_alternative
  - marker: b
    text: Hier steht nur „Leben“, nicht ausdrücklich „ewiges Leben“; im weiteren Zusammenhang des Johannesevangeliums ist dieses Leben jedoch häufig mit dem ewigen Leben verbunden.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier den Anschluss an die vorausgehende Rede und klingt im modernen deutschen Erzählstil natürlicher als das stärker folgernde „Daher“.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die feierliche, für das Johannesevangelium charakteristische Doppelformel und vermeidet das heute altertümlich klingende „Wahrlich, wahrlich“.
- source_word: ἐὰν μὴ
  choice: wenn ... nicht
  rationale: Gibt die negative Bedingung idiomatisch und genau wieder; „es sei denn“ wäre in diesem Satzbau weniger natürlich.
- source_word: φάγητε
  choice: esst
  rationale: Gibt die konkrete Grundbedeutung des Verbs wieder und bewahrt die provozierende Bildsprache.
- source_word: σάρκα
  choice: Fleisch
  rationale: Entspricht dem konkreten griechischen Ausdruck und schwächt ihn nicht zum deutenderen „Leib“ ab.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Bewahrt Jesu etablierte Selbstbezeichnung sowie ihre biblischen und messianischen Bezüge.
- source_word: πίητε ... τὸ αἷμα
  choice: sein Blut trinkt
  rationale: Die wörtliche Wiedergabe erhält die auffällige Parallelität zu „Fleisch esst“ und die Schärfe der Aussage.
- source_word: ζωὴν
  choice: Leben
  rationale: Der Ausgangstext hat hier nur „Leben“ und nicht ausdrücklich „ewiges Leben“.
- source_word: ἐν ἑαυτοῖς
  choice: in euch selbst
  rationale: Gibt die präpositionale Wendung direkt wieder und bewahrt die Betonung des Lebensbesitzes in den Angesprochenen.
theological_decisions:
- issue: Deutung des Essens des Fleisches und Trinkens des Blutes
  choice: Die konkrete Formulierung „das Fleisch ... esst und sein Blut trinkt“ bleibt ohne erklärende Erweiterung stehen.
  alternative: Deutende Wiedergaben wie „an ihm Anteil habt“, „ihn aufnehmt“ oder ausdrücklich eucharistische Sprache mit „Leib“.
  rationale: Der griechische Wortlaut ist bewusst konkret und anstößig. Die Übersetzung soll die Spannung zwischen sakramentalen, bildlichen und weiteren möglichen Deutungen bewahren, statt sie konfessionell festzulegen.
- issue: Bedeutungsumfang von ζωὴν
  choice: Im Haupttext steht schlicht „Leben“.
  alternative: „Ewiges Leben“.
  rationale: Der weitere johanneische Zusammenhang prägt das Verständnis des Lebens, doch das Adjektiv „ewig“ steht in diesem Vers nicht im Ausgangstext und soll daher nicht ergänzt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. Die doppelte Formel „Amen, amen“ bleibt als markante johanneische Redeform erhalten; die drastische Bildsprache wird nicht geglättet.
