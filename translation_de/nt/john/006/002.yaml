id: JHN.6.2
reference: John 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: de
  text: Und eine große Menschenmenge folgte ihm, weil sie die Zeichen[a] sahen, die er an den Kranken tat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wunder« oder »Wunderzeichen«. Das bei Johannes verwendete Wort »Zeichen« betont, was diese Taten über Jesus erkennen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der deutsche Imperfekt gibt die fortlaufende Handlung in der Erzählung natürlich wieder; eine Umschreibung wie „war dabei, ihm zu folgen“ wäre unnötig schwerfällig.
- source_word: δὲ
  choice: Und
  rationale: δέ führt hier die Erzählung mit einer schwachen Verknüpfung weiter und bezeichnet keinen starken Gegensatz.
- source_word: ὄχλος πολύς
  choice: eine große Menschenmenge
  rationale: Die Formulierung bewahrt die Größenangabe und klingt in modernem Standarddeutsch natürlich.
- source_word: ἐθεώρουν
  choice: sahen
  rationale: Das deutsche Imperfekt fügt sich natürlich in den Erzählstil ein; der Kontext lässt zugleich wiederholtes beziehungsweise anhaltendes Sehen erkennen.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den johanneischen Akzent auf der Bedeutung dieser Taten als Hinweise darauf, wer Jesus ist, statt sie nur als Wunder zu bezeichnen.
- source_word: ἐποίει
  choice: tat
  rationale: „tat“ entspricht dem allgemeinen Verb ποιέω und vermeidet die erklärende Einengung „vollbrachte“ oder „wirkte“.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: an den Kranken
  rationale: „an den Kranken“ gibt die Beziehung der Zeichen zu den erkrankten Menschen idiomatisch wieder und bleibt näher an ἐπί mit Genitiv als eine reine Nutzenaussage.
- source_word: ἀσθενούντων
  choice: den Kranken
  rationale: Im Zusammenhang bezeichnet das substantivierte Partizip körperlich kranke Menschen; „die Kranken“ ist prägnant und natürlich.
theological_decisions:
- issue: Johanneische Terminologie σημεῖα
  choice: Zeichen
  alternative: Wunder; Wunderzeichen
  rationale: Johannes bezeichnet Jesu außergewöhnliche Taten als „Zeichen“, wodurch neben ihrem wunderhaften Charakter auch ihre offenbarende Funktion erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden griechischen Imperfekte werden mit dem im Deutschen natürlichen erzählenden Präteritum wiedergegeben. „An den Kranken tat“ ist bewusst knapp und quellennah; der Fußnotenmarker steht unmittelbar bei „Zeichen“, auf das die Anmerkung Bezug nimmt.
