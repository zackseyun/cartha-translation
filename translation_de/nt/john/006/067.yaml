  terminology: »die Zwölf« ist als etablierte Bezeichnung korrekt großgeschrieben. Die Wiedergabe von θέλετε durch »wollt« und von ὑπάγειν durch »weggehen« ist sachlich und nicht unnötig deutend. Die Fußnote erklärt die griechische Fragepartikel präzise und verständlich.
