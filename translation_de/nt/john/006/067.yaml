  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: de
  text: 'Da sagte Jesus zu den Zwölf: »Ihr wollt doch nicht etwa auch weggehen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wollt auch ihr weggehen?« Die griechische Frage beginnt mit μή, das häufig eine verneinende Antwort erwarten lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die erzählerische und folgernde Fortsetzung nach dem Weggang vieler Jünger; »Da« klingt im modernen Deutschen natürlich, ohne den Zusammenhang zu überdeuten.
- source_word: τοῖς δώδεκα
  choice: zu den Zwölf
  rationale: Die Wendung ist eine feste Bezeichnung für den engeren Kreis um Jesus. »Die Zwölf« bewahrt diesen titularen Charakter, ohne erklärend »Jünger« hinzuzufügen.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Ihr wollt doch nicht etwa auch …?
  rationale: Das einleitende μή lässt gewöhnlich eine verneinende Antwort erwarten. »doch nicht etwa« gibt diese Erwartung wieder, während »auch« das καί und den Kontrast zu den zuvor Weggegangenen ausdrückt.
- source_word: θέλετε
  choice: wollt
  rationale: θέλω bezeichnet hier Wunsch beziehungsweise Bereitschaft; »wollen« ist die direkte und idiomatische deutsche Entsprechung.
- source_word: ὑπάγειν
  choice: weggehen
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb die Bewegung fort von Jesus. »Weggehen« wahrt diesen räumlichen und relationalen Sinn, ohne stärker deutend »Jesus verlassen« zu formulieren.
theological_decisions:
- issue: Aussagekraft der mit μή eingeleiteten Frage Jesu
  choice: Eine verneinte Frage, die eine Antwort im Sinn von »Nein« erwarten lässt, ohne sie zwingend vorzugeben
  alternative: 'Die neutralere Frage: »Wollt auch ihr weggehen?«'
  rationale: Das griechische μή signalisiert in Fragen üblicherweise die Erwartung einer negativen Antwort. »doch nicht etwa« macht diese Gesprächsnuance sichtbar, ohne aus der Erwartung eine Behauptung oder Gewissheit zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Frage bleibt natürlich und bewahrt zugleich die im Griechischen angelegte Erwartung einer negativen Antwort.
