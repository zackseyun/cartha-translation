id: JHN.6.12
reference: John 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: de
  text: 'Als sie satt geworden waren, sagt er zu seinen Jüngern: »Sammelt die übrig gebliebenen Brotstücke ein, damit nichts verloren geht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: »damit nichts verschwendet wird«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als
  rationale: Gibt die temporale Funktion von ὡς natürlich wieder; das schwache δέ wird im Deutschen nicht eigens ausgedrückt, da der Erzählzusammenhang die Verbindung trägt.
- source_word: ἐνεπλήσθησαν
  choice: sie satt geworden waren
  rationale: Im Zusammenhang einer Mahlzeit bezeichnet das Passiv, dass die Menschen ihren Hunger gestillt hatten. Die Formulierung ist idiomatischer als das wörtlichere »gefüllt worden waren«.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das historische Präsens des griechischen Erzählstils, das auch im Deutschen verständlich und lebendig wirkt.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: »Jünger« ist die etablierte und sachlich genaue Wiedergabe von μαθηταί im Evangelienkontext.
- source_word: Συναγάγετε
  choice: Sammelt … ein
  rationale: Der direkte Imperativ wird mit dem für das Auflesen verstreuter Essensreste natürlichen Verb »einsammeln« wiedergegeben.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: die übrig gebliebenen Brotstücke
  rationale: περισσεύσαντα bezeichnet das Übriggebliebene; κλάσματα sind abgebrochene Stücke. »Brotstücke« macht den aus dem Kontext eindeutigen Bezug verständlich, ohne die Wendung unnötig schwer zu gestalten.
- source_word: ἵνα μή τι ἀπόληται
  choice: damit nichts verloren geht
  rationale: Bleibt nahe an ἀπόλλυμι und bewahrt eine mögliche johanneische Resonanz, ohne die Aussage auf das praktischere »damit nichts verschwendet wird« festzulegen.
theological_decisions:
- issue: Mögliche theologische Nebenbedeutung von ἀπόληται im Kontext des Zeichens
  choice: »damit nichts verloren geht«
  alternative: »damit nichts verschwendet wird«
  rationale: Unmittelbar geht es um übrig gebliebenes Brot. Die lexikalisch nähere Wiedergabe »verloren geht« lässt zugleich eine mögliche johanneische Tiefendimension offen, ohne sie ausdrücklich in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wird erhalten. »Satt geworden« ist im Mahlzeitkontext natürlich; »Brotstücke« verdeutlicht den sachlichen Bezug von κλάσματα.
