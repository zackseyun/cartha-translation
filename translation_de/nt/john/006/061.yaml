id: JHN.6.61
reference: John 6:61
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: de
  text: 'Jesus wusste jedoch in sich selbst, dass seine Jünger darüber murrten, und sagte zu ihnen: »Nehmt ihr daran Anstoß?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bringt euch das zu Fall?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: wusste
  rationale: Das Partizip bezeichnet Jesu gleichzeitiges Wissen. Im Deutschen gibt ein finites Verb die griechische Konstruktion natürlich und klar wieder.
- source_word: ἐν ἑαυτῷ
  choice: in sich selbst
  rationale: Die Wendung bewahrt die Aussage, dass Jesus dies aus sich heraus wusste und nicht erst durch eine äußere Mitteilung erfuhr.
- source_word: γογγύζουσιν
  choice: murrten
  rationale: Das Verb bezeichnet unzufriedenes, eher gedämpftes Reden. „Murrten“ ist prägnant, würdevoll und trägt zudem den biblischen Resonanzraum des Murrens.
- source_word: περὶ τούτου
  choice: darüber
  rationale: Die natürliche deutsche Form verweist knapp auf Jesu unmittelbar vorausgehende Aussage, ohne den Bezug interpretierend zu erweitern.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Dies ist die idiomatische Wiedergabe und lässt offen, dass hier der weitere Jüngerkreis gemeint ist, nicht ausschließlich die Zwölf.
- source_word: Τοῦτο
  choice: daran
  rationale: In der festen deutschen Wendung „an etwas Anstoß nehmen“ verweist „daran“ natürlich auf das zuvor Gesagte, ohne ein erklärendes Substantiv hinzuzufügen.
- source_word: σκανδαλίζει
  choice: Nehmt ihr daran Anstoß?
  rationale: „Anstoß nehmen“ gibt die unmittelbare Reaktion idiomatisch wieder und hält zugleich die Bildwelt des griechischen Verbs erkennbar. Die mögliche stärkere Bedeutung des Zu-Fall-Kommens wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsbreite von σκανδαλίζει angesichts einer möglichen Abkehr von Jesus
  choice: Nehmt ihr daran Anstoß?
  alternative: Bringt euch das zu Fall?
  rationale: Das griechische Verb kann sowohl Anstoß oder Entrüstung als auch ein geistliches Straucheln bis hin zur Abkehr bezeichnen. Der Haupttext verwendet die natürliche deutsche Wendung, während die Fußnote die stärkere metaphorische und theologische Dimension offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen moderat geglättet; „in sich selbst“ bleibt bewusst erhalten, und „murrten“ wahrt den biblischen Klang sowie den negativen Unterton.
