source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: de
  text: Denn mein Fleisch ist wahre Speise[a], und mein Blut ist wahrer Trank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirkliche Speise“ und „wirklicher Trank“; auch: „echte Speise“ und „echter Trank“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden beziehungsweise erläuternden Anschluss an die vorausgehende Aussage und klingt im Deutschen natürlich.
- source_word: σάρξ
  choice: Fleisch
  rationale: Die wörtliche Wiedergabe erhält die bewusste Parallelität von Fleisch und Blut und vermeidet die interpretierende Abschwächung zu „Leib“ oder „Körper“.
- source_word: ἀληθής
  choice: wahr
  rationale: „Wahr“ gibt die direkte Bedeutung und das johanneische Gewicht des Adjektivs wieder. Das ebenfalls mögliche „wirklich“ wird in einer Fußnote genannt, damit die Übersetzung die theologische Tragweite nicht vorentscheidet.
- source_word: βρῶσις
  choice: Speise
  rationale: Im prädikativen Parallelismus mit πόσις bezeichnet βρῶσις hier am ehesten das, was gegessen wird. „Speise“ ist würdig, verständlich und entspricht „Trank“.
- source_word: αἷμα
  choice: Blut
  rationale: Die wörtliche Wiedergabe bewahrt die Aussage und den Parallelismus des griechischen Textes ohne Abschwächung.
- source_word: πόσις
  choice: Trank
  rationale: Hier bezeichnet πόσις am ehesten das, was getrunken wird. „Trank“ bildet im Deutschen eine klare und stilistisch ausgewogene Entsprechung zu „Speise“.
theological_decisions:
- issue: Wiedergabe von ἀληθής im eucharistisch bedeutsamen Zusammenhang
  choice: wahr
  alternative: wirklich; echte Speise und echter Trank
  rationale: „Wahr“ bleibt eng am griechischen Wortlaut und bewahrt dessen johanneische und theologische Spannung. Die Alternative „wirklich“ beziehungsweise „echt“ wird als lexikalische Möglichkeit ausgewiesen, ohne eine bestimmte sakramentale Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Speise“ und „Trank“ sind leicht gehoben, aber allgemein verständlich; sie bewahren zudem den ausgewogenen Parallelismus des Ausgangstextes.
