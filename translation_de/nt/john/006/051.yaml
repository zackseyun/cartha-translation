source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: de
  text: Ich bin das lebendige Brot, das vom Himmel herabgekommen ist. Wenn jemand von diesem Brot isst, wird er ewig leben.[a] Und das Brot, das ich geben werde, ist mein Fleisch für das Leben der Welt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wird er in Ewigkeit leben“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Fleisch“, nicht „Leib“. Die Formulierung ist bewusst konkret.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: das lebendige Brot
  rationale: Das attributive Partizip ζῶν wird direkt und natürlich adjektivisch wiedergegeben. „Brot des Lebens“ wäre eine Angleichung an den nahen Kontext, nicht die genaue Übersetzung dieser Wortgruppe.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: das vom Himmel herabgekommen ist
  rationale: Die Relativkonstruktion gibt das auf einen vollzogenen Abstieg bezogene Aoristpartizip natürlich wieder und bewahrt die christologische Aussage.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Wenn jemand von diesem Brot isst
  rationale: „Wenn jemand“ gibt die allgemeine Bedingung mit unbestimmtem Singular wieder; „von diesem Brot isst“ bildet ἐκ idiomatisch und zugleich erkennbar ab.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: wird er ewig leben
  rationale: Die johanneische Wendung εἰς τὸν αἰῶνα bezeichnet unbegrenzte Dauer. „Ewig leben“ ist die klare, geläufige deutsche Entsprechung.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Und das Brot, das ich ... geben werde
  rationale: δέ entwickelt den Gedanken weiter, ohne einen starken Gegensatz auszudrücken. Das Futur bewahrt den Ausblick auf Jesu bevorstehende Selbsthingabe.
- source_word: ἡ σάρξ μού ἐστιν
  choice: ist mein Fleisch
  rationale: σάρξ wird mit „Fleisch“ wiedergegeben, weil die konkrete und bewusst anstößige Wortwahl nicht durch das deutendere „Leib“ abgeschwächt werden soll.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: für das Leben der Welt
  rationale: Die Formulierung gibt den benefaktiven Sinn von ὑπέρ natürlich wieder und bewahrt mit „Welt“ den weiten johanneischen Ausdruck κόσμος.
theological_decisions:
- issue: Bedeutung von σάρξ in Jesu Selbstaussage
  choice: „Fleisch“ im Haupttext
  alternative: „Leib“ als sakramental oder anderweitig deutende Wiedergabe
  rationale: Der konkrete griechische Ausdruck wird bewahrt, ohne die möglichen Bezüge der Aussage vorab konfessionell festzulegen.
- issue: Reichweite von κόσμος
  choice: „Welt“ ohne Einschränkung
  alternative: „Menschheit“ oder eine theologisch enger bestimmte Gruppe
  rationale: Die breite Formulierung des Textes bleibt stehen; die Übersetzung verengt ihre Reichweite nicht durch ein dogmatisches System.
- issue: Christologische Aussage von „vom Himmel herabgekommen“
  choice: direkte Wiedergabe des Herabkommens vom Himmel
  alternative: bloß metaphorische göttliche Beauftragung
  rationale: Die Übersetzung erhält die starke johanneische Aussage, ohne sie abzuschwächen oder über den Wortlaut hinaus zu erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, klingt jedoch natürlich. Der generische Singular „jemand … er“ entspricht der griechischen Konstruktion; „Fleisch“ und „Welt“ bewahren die theologische Spannung des Wortlauts.
