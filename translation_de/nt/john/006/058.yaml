source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: de
  text: Dies ist das Brot, das vom Himmel herabgekommen ist, nicht so, wie die Väter aßen und starben.[a] Wer dieses Brot isst, wird in Ewigkeit leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorfahren“. Gemeint sind wahrscheinlich Israels Väter, die in der Wüste das Manna aßen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird bis in das Zeitalter hinein leben“; die Wendung bezeichnet hier fortdauerndes, ewiges Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Dies ist das Brot
  rationale: Die demonstrative Kopulakonstruktion und das bestimmte, im Zusammenhang bereits eingeführte Brot werden direkt und idiomatisch wiedergegeben.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: das vom Himmel herabgekommen ist
  rationale: Das substantivbezogene Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben; „vom Himmel“ bewahrt die Herkunftsangabe.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: 'Es ist nicht wie bei den Vätern: Sie aßen und starben'
  rationale: Die knappe griechische Vergleichskonstruktion ist im Deutschen elliptisch schwer verständlich. Die Aufteilung verdeutlicht den Vergleich mit der Wüstengeneration, ohne ein im Ausgangstext nicht ausdrücklich wiederholtes Objekt wie „Manna“ einzusetzen.
- source_word: οἱ πατέρες
  choice: die Väter
  rationale: Die ausdrücklich maskuline Bezeichnung und der wahrscheinliche Bezug auf Israels Vorväter bleiben erhalten; „Vorfahren“ ist als mögliche sachbezogene Wiedergabe in der Fußnote genannt.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: Wer dieses Brot isst
  rationale: Das substantivierte Präsenspartizip wird generisch und idiomatisch wiedergegeben. „Isst“ bewahrt die konkrete Bildsprache, ohne eine bestimmte sakramentale oder rein metaphorische Deutung festzulegen.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: wird in Ewigkeit leben
  rationale: Die geläufige deutsche Wendung gibt die johanneische Zeitformel idiomatisch wieder und bewahrt zugleich ihre sprachliche Nähe zur Vorstellung des Zeitalters.
theological_decisions:
- issue: Bezug der „Väter“ im Vergleich mit dem Himmelsbrot
  choice: „die Väter“ beibehalten
  alternative: „die Vorfahren“
  rationale: Der griechische Ausdruck ist maskulin und verweist wahrscheinlich auf Israels Väter beziehungsweise die Wüstengeneration. Die Übersetzung verallgemeinert den Ausdruck nicht stillschweigend, nennt die mögliche sachbezogene Wiedergabe aber in einer Fußnote.
- issue: Bedeutungsgehalt von τρώγων im Brotrede-Kontext
  choice: neutral mit „isst“ wiedergegeben
  alternative: „davon isst“ oder „sich davon nährt“
  rationale: „Isst“ entspricht dem Grundsinn und lässt die umstrittene Frage offen, wie das Essen theologisch genau zu verstehen ist. Weder eine ausschließlich sakramentale noch eine ausschließlich metaphorische Lesart wird in die Übersetzung eingebaut.
- issue: Zeitliche Tragweite von εἰς τὸν αἰῶνα
  choice: „in Ewigkeit“
  alternative: „bis in das Zeitalter hinein“
  rationale: „In Ewigkeit“ ist im Deutschen die natürliche Entsprechung der johanneischen Formel. Die wörtlichere Struktur wird in der Fußnote dokumentiert, ohne die Aussage auf ein begrenztes Zeitalter festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die kurzen Hauptsätze lösen die im Deutschen schwer verständliche griechische Ellipse auf, ohne den theologischen Gegensatz zwischen dem Brot vom Himmel und der Speise der Wüstengeneration näher auszudeuten.
