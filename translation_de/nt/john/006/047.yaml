  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wer glaubt,[a] hat ewiges Leben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Glaubende“; auch möglich: „jeder, der glaubt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „immerwährendes Leben“; wörtlich kann der Ausdruck als „Leben des Zeitalters“ umschrieben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die doppelte feierliche Bekräftigungsformel wird unverändert wiedergegeben. „Amen“ ist im Deutschen verständlich und bewahrt sowohl die Wiederholung als auch den markanten johanneischen Sprachklang.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Formulierung gibt Präsens, Verb und Dativpronomen direkt wieder und wahrt den feierlichen Satzrhythmus.
- source_word: ὁ πιστεύων
  choice: wer glaubt
  rationale: Die idiomatische deutsche Formulierung bezeichnet wie das substantivierte griechische Präsenspartizip denjenigen, der glaubt, ohne das unnatürliche „der Glaubende“ in den Haupttext zu setzen.
- source_word: ἔχει
  choice: hat
  rationale: Das Präsens wird als gegenwärtige Aussage bewahrt; der Text spricht nicht nur von einem künftigen Empfang.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die natürliche und etablierte deutsche Wiedergabe. Sie wahrt im johanneischen Zusammenhang sowohl den zeitlichen als auch den qualitativen Sinn, ohne auf „Leben des Zeitalters“ einzuengen.
theological_decisions:
- issue: Gegenwärtiger Besitz des ewigen Lebens
  choice: hat ewiges Leben
  alternative: wird ewiges Leben haben
  rationale: Das griechische ἔχει steht im Präsens. Die Wiedergabe bewahrt die gegenwärtige Aussage und verlagert sie nicht eigenmächtig in die Zukunft.
- issue: Gegenstand des Glaubens nicht ausdrücklich genannt
  choice: Wer glaubt
  alternative: Wer an mich glaubt
  rationale: Der vorliegende griechische Text enthält nach πιστεύων keine ausdrückliche Ergänzung. Auch wenn der Kontext einen Bezug nahelegt, wird er nicht in diesen Vers eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel „Amen, amen“ erhält den charakteristischen johanneischen Klang; „wer glaubt“ ist zugleich natürlich und allgemein verständlich.
