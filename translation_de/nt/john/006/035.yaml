  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Ich bin das Brot des Lebens. Wer zu mir kommt, wird niemals hungern, und wer an mich glaubt, wird niemals dürsten.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird auf keinen Fall jemals dürsten“. Das Griechische verbindet eine nachdrückliche Verneinung mit „jemals“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus sagte zu ihnen
  rationale: Die natürliche deutsche Erzählform gibt den Aorist von λέγω und den Dativ αὐτοῖς genau wieder.
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die direkte Selbstvorstellung bleibt knapp und feierlich; das ausdrücklich gesetzte ἐγώ wird im Deutschen durch die natürliche Formulierung ausreichend getragen.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: das Brot des Lebens
  rationale: Die geläufige, zugleich quellennah formulierte Wendung bewahrt den Genitiv und die Metapher, ohne sie als „lebenspendendes Brot“ auszulegen.
- source_word: ὁ ἐρχόμενος πρὸς ἐμὲ
  choice: Wer zu mir kommt
  rationale: Das substantivierte Präsenspartizip wird im Deutschen idiomatisch und mit seiner allgemeinen Geltung wiedergegeben.
- source_word: οὐ μὴ πεινάσῃ
  choice: wird niemals hungern
  rationale: „Niemals“ vermittelt die nachdrückliche Verneinung οὐ μή in natürlichem modernem Deutsch.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: wer an mich glaubt
  rationale: „An jemanden glauben“ ist die etablierte und quellennah transparente deutsche Entsprechung für πιστεύω εἰς im johanneischen Sprachgebrauch.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: wird niemals dürsten
  rationale: Die Formulierung gibt sowohl die emphatische Negation οὐ μή als auch den zeitlich uneingeschränkten Sinn von πώποτε wieder. Ein „wieder“ wird nicht ergänzt, da πώποτε „jemals/zu irgendeiner Zeit“, nicht „wieder“, bedeutet.
theological_decisions:
- issue: Wiedergabe von πιστεύων εἰς ἐμέ
  choice: wer an mich glaubt
  alternative: wer auf mich vertraut
  rationale: Die Hauptfassung bewahrt die etablierte johanneische Glaubenssprache. „Vertraut“ bezeichnet eine mögliche Bedeutungsnuance, würde den Ausdruck aber stärker auslegen.
- issue: Kraft der Selbstbezeichnung Ἐγώ εἰμι
  choice: Ich bin
  alternative: Ich selbst bin
  rationale: Die direkte Aussage wahrt die Resonanz der johanneischen Ich-bin-Worte, ohne durch eine erklärende oder dogmatisch zugespitzte Formulierung über den Text hinauszugehen.
- issue: Zeitliche Reichweite von πώποτε
  choice: niemals dürsten
  alternative: ganz gewiss niemals dürsten
  rationale: Die Übersetzung bewahrt die uneingeschränkte und emphatische Verneinung, ohne „wieder“ einzuführen, das im griechischen Ausdruck nicht enthalten ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der parallele Satzbau und die zentrale Brotmetapher bleiben erhalten; die emphatische Verneinung wird idiomatisch durch „niemals“ ausgedrückt.
