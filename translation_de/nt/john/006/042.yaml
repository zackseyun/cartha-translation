  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: de
  text: 'Und sie sagten immer wieder: „Ist das nicht Jesus, der Sohn Josefs, dessen Vater und Mutter wir kennen? Wie kann er jetzt sagen: ‚Ich bin vom Himmel herabgekommen‘?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten immer wieder
  rationale: Der Imperfekt bezeichnet hier fortdauerndes oder wiederholtes Reden; die Formulierung macht diesen Aspekt in natürlichem Deutsch sichtbar.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ist das nicht
  rationale: Die natürliche deutsche negative Frage bewahrt den rhetorischen Charakter und die erwartete Zustimmung.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: der Sohn Josefs
  rationale: Die Genitivverbindung wird direkt und idiomatisch wiedergegeben und betont Jesu den Sprechern bekannte menschliche Herkunft.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: dessen Vater und Mutter wir kennen
  rationale: Die Relativkonstruktion sowie das betonte ἡμεῖς werden in einer natürlichen deutschen Form bewahrt; „wir“ trägt im Kontext den Kontrast.
- source_word: πῶς νῦν λέγει
  choice: Wie kann er jetzt sagen
  rationale: Das idiomatische deutsche „Wie kann er … sagen?“ gibt die erstaunte, bestreitende Frage wieder. Das Modalverb ist pragmatisch bedingt und behauptet keine zusätzliche sachliche Unmöglichkeit.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: „Aus“ bildet ἐκ als Herkunftsangabe präzise ab; „Himmel“ ist die übliche und würdige deutsche Entsprechung von οὐρανός.
- source_word: καταβέβηκα
  choice: ich bin … herabgekommen
  rationale: Das deutsche Perfekt gibt den vollendeten Vorgang mit gegenwärtiger Relevanz wieder; „herabgekommen“ ist natürlicher als „herabgestiegen“ und bewahrt die räumliche Bildsprache.
theological_decisions:
- issue: Einwand gegen Jesu Anspruch himmlischer Herkunft
  choice: „Ich bin aus dem Himmel herabgekommen“ wörtlich beibehalten
  alternative: „Ich komme vom Himmel“ oder eine metaphorisch erklärende Umschreibung
  rationale: Der Text stellt die Spannung zwischen der den Leuten bekannten menschlichen Familie Jesu und seinem Anspruch himmlischer Herkunft unvermittelt dar. Die Übersetzung mildert oder erklärt diese Spannung nicht.
- issue: Bezeichnung „Sohn Josefs“
  choice: Die Aussage der Sprecher ohne harmonisierende Erläuterung wiedergeben
  alternative: Durch einen Zusatz wie „vermeintlicher Sohn Josefs“ präzisieren
  rationale: Der Vers gibt die Perspektive der Sprecher wieder. Ein erklärender Zusatz würde über den griechischen Wortlaut hinausgehen und die erzählerische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt lebendig; „sagten immer wieder“ verdeutlicht den Imperfekt, ohne altertümlich zu wirken.
