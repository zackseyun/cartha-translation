source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: de
  text: Bemüht euch nicht um die Nahrung, die vergeht, sondern um die Nahrung, die bis ins ewige Leben bleibt[a] und die der Menschensohn euch geben wird; denn auf ihn hat Gott, der Vater, sein Siegel gesetzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zum ewigen Leben bleibt“ beziehungsweise „die zum ewigen Leben führt“. Das Griechische kann Richtung, Ziel oder Reichweite ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihn versiegelt“. Das Bild bezeichnet Bestätigung, Beglaubigung oder Bevollmächtigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: Bemüht euch um
  rationale: Der Imperativ bezeichnet hier im Zusammenhang mit dem Akkusativobjekt ein zielgerichtetes Streben. „Sich um etwas bemühen“ ist im modernen Deutschen natürlich und vermeidet das mögliche Missverständnis, es gehe lediglich um Erwerbsarbeit.
- source_word: βρῶσιν
  choice: Nahrung
  rationale: Gemeint ist das, was gegessen wird. „Nahrung“ passt zum würdigen Register und lässt zugleich die übertragene Bedeutung im folgenden Gegensatz zu.
- source_word: ἀπολλυμένην
  choice: die vergeht
  rationale: Das Präsenspartizip beschreibt Nahrung, die dem Verfall und der Vergänglichkeit unterliegt. „Vergeht“ bewahrt den weiteren Sinn besser als das engere „verdirbt“.
- source_word: μένουσαν
  choice: die bleibt
  rationale: Die Grundbedeutung von μένω wird unmittelbar wiedergegeben und bildet einen klaren Gegensatz zu „vergeht“.
- source_word: εἰς ζωὴν αἰώνιον
  choice: bis ins ewige Leben
  rationale: εἰς bezeichnet hier Richtung, Ziel oder Reichweite. „Bis ins ewige Leben“ bewahrt diese Offenheit besser als eine rein kausale Deutung.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält die Selbstbezeichnung und ihre biblisch-theologische Resonanz.
- source_word: ἐσφράγισεν
  choice: hat sein Siegel gesetzt
  rationale: Die Formulierung erhält das Siegelbild des griechischen Verbs und ist zugleich im modernen Deutschen verständlich; im Kontext weist es auf Bestätigung oder Bevollmächtigung hin.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Gott, der Vater
  rationale: Die Apposition wird sichtbar bewahrt und identifiziert den Vater als Gott, ohne zusätzliche dogmatische Formulierungen einzutragen.
theological_decisions:
- issue: Bezug und Sinn von εἰς ζωὴν αἰώνιον
  choice: die bis ins ewige Leben bleibt
  alternative: die zum ewigen Leben führt / die für das ewige Leben bleibt
  rationale: Die Präposition kann Ziel, Ergebnis oder zeitliche Reichweite ausdrücken. Die gewählte Fassung lässt diese Spannung bestehen und behauptet nicht ausdrücklich, die Nahrung sei bloß ein Mittel, das ewiges Leben verursacht.
- issue: Bedeutung des Siegels für den Menschensohn
  choice: auf ihn hat Gott, der Vater, sein Siegel gesetzt
  alternative: ihn hat Gott, der Vater, bestätigt / bevollmächtigt
  rationale: Das konkrete Bild wird nicht durch eine einzelne Deutung ersetzt. Die Fußnote nennt die naheliegenden Bedeutungsaspekte der Bestätigung, Beglaubigung und Bevollmächtigung.
- issue: Apposition ὁ πατὴρ ... ὁ θεός
  choice: Gott, der Vater
  alternative: der Vater, Gott
  rationale: Die idiomatische deutsche Wortstellung wahrt die ausdrückliche Identifizierung des Vaters als Gott, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe an der griechischen Kontraststruktur, während „Bemüht euch um“ idiomatischer ist als eine wörtliche Formulierung mit „arbeiten“. Die Metapher des Siegels sowie die mögliche Bedeutungsbreite von εἰς bleiben erhalten.
