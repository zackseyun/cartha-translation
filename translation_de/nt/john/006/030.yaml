  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Was für ein Zeichen vollbringst du denn, damit wir sehen und dir glauben[a]? Was für ein Werk vollbringst du?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dich glauben“ oder „dir vertrauen“. Wörtlicher steht im Griechischen „dir glauben“; hier folgt auf „glauben“ ein Dativ und nicht die bei Johannes häufigere Wendung „an jemanden glauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Da sagten sie zu ihm
  rationale: „Da“ gibt den folgernden und zugleich fortschreitenden Anschluss von οὖν im Deutschen natürlich wieder.
- source_word: Τί οὖν ποιεῖς σὺ σημεῖον
  choice: Was für ein Zeichen tust du denn
  rationale: „Zeichen“ bewahrt den für das Johannesevangelium wichtigen Begriff σημεῖον. Das betonte σὺ wird durch die ausdrückliche Anrede „du“ wiedergegeben; „denn“ erhält die drängende Kraft des zweiten οὖν.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: damit wir sehen und dir glauben
  rationale: „Damit“ drückt den Zweck von ἵνα mit Konjunktiv aus. „Dir glauben“ bildet die Dativkonstruktion σοι genau und idiomatisch ab, ohne sie stillschweigend mit der sonst bei Johannes häufigen Wendung „an dich glauben“ gleichzusetzen.
- source_word: τί ἐργάζῃ
  choice: Was vollbringst du?
  rationale: „Vollbringen“ ist natürliches modernes Deutsch und unterscheidet ἐργάζομαι vom zuvor gebrauchten ποιέω, während die Frage nach Jesu Werk bzw. Wirken erhalten bleibt.
theological_decisions:
- issue: Bedeutung von πιστεύω mit dem Dativ σοι
  choice: dir glauben
  alternative: an dich glauben; dir vertrauen
  rationale: Der griechische Text verwendet den Dativ σοι und nicht die bei Johannes häufige Konstruktion εἰς mit Akkusativ. Die Hauptfassung bewahrt deshalb die unmittelbare Bedeutung, jemandem bzw. dessen Aussage Glauben zu schenken; weiter reichende mögliche Nuancen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die doppelte argumentative Verknüpfung durch οὖν wird mit „Da“ und „denn“ wiedergegeben. Die Formulierung „ein Zeichen tun“ ist bewusst etwas bibelsprachlich, bleibt jedoch verständlich und bewahrt die johanneische Terminologie.
