  verdict: revise
  source_fidelity: 'Die Satzstruktur und die zentralen Bedeutungen werden zutreffend wiedergegeben: ἤθελον als andauernde Bereitschaft („wollten“), εὐθέως als „sofort“ und die unvermittelte Ankunft des Bootes bleiben erhalten. „An dem Land“ ist jedoch keine natürliche deutsche Ortsangabe für ein Boot und stellt γῆ zu wörtlich nach, ohne den griechischen Sinn klarer zu bewahren. „An Land“ gibt die Landung bzw. das Erreichen des Festlands idiomatisch wieder, ohne zu behaupten, das Boot sei auf trockenem Boden gewesen.'
  naturalness: „Da wollten sie ihn ins Boot nehmen“ ist modernes, angemessenes Standarddeutsch. Die Formulierung „war das Boot an dem Land“ ist dagegen deutlich unidiomatisch. „War das Boot an Land“ und „wohin sie unterwegs waren“ sind flüssig und bewahren den knappen Erzählrhythmus.
  terminology: „Boot“ ist im Kontext passend. „An Land“ ist hier die natürliche deutsche Entsprechung für ἐπὶ τῆς γῆς; die Fußnote darf die stärker dynamische Wiedergabe mit „erreichte ... das Ufer“ als Alternative nennen. Die Formulierung erklärt die auffällige Unmittelbarkeit nicht weg.
