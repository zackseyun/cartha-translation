    rationale: Für ein Boot ist „an dem Land“ im modernen Standarddeutsch nicht gebräuchlich. „An Land“ bezeichnet idiomatisch das Erreichen des Landes, ohne das Boot als auf trockenem Boden befindlich darzustellen.
  - severity: low
    issue: Relativanschluss „zu dem sie unterwegs waren“
    rationale: Grammatisch möglich, aber „wohin sie unterwegs waren“ ist im Deutschen natürlicher und gibt die zielgerichtete Bewegung von εἰς ἣν ὑπῆγον klar wieder.
