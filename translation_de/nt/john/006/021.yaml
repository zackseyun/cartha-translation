  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: de
  text: Da wollten sie ihn ins Boot nehmen, und sofort war das Boot an Land, wohin sie unterwegs waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sofort erreichte das Boot das Ufer, wohin sie unterwegs waren.“'
    reason: Lexikalisch und syntaktisch plausible, stärker idiomatische Wiedergabe von ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς.
lexical_decisions:
- source_word: ἤθελον
  choice: wollten sie
  rationale: Das Imperfekt von θέλω bezeichnet hier im Erzählzusammenhang ihre nun vorhandene Bereitschaft beziehungsweise Absicht. „Wollten sie“ ist im Deutschen natürlich und lässt beide Nuancen offen.
- source_word: οὖν
  choice: Da
  rationale: οὖν kennzeichnet die Folgerung aus Jesu Worten und dem Nachlassen ihrer Furcht. „Da“ verbindet den Satz in natürlichem Erzählstil mit dem Vorhergehenden.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: ihn ins Boot nehmen
  rationale: Die Wendung gibt die konkrete Aufnahme Jesu in das Boot klar, idiomatisch und quellennah wieder.
- source_word: πλοῖον
  choice: Boot
  rationale: Für das Fahrzeug auf dem See von Galiläa ist „Boot“ die sachlich und sprachlich passende moderne Bezeichnung.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ bewahrt die markierte Unmittelbarkeit und damit auch die mögliche wunderhafte Tragweite des Geschehens.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: war das Boot an dem Land
  rationale: Die Wiedergabe bleibt nahe an der Verbindung von γίνομαι mit der Ortsangabe und vermeidet die irreführende Vorstellung, das Boot habe sich auf trockenem Boden befunden.
- source_word: γῆς
  choice: Land
  rationale: γῆ bezeichnet hier das Land am Ziel ihrer Fahrt. „Land“ ist formal näher als „Ufer“, während die kontextuell plausible Alternative in der Fußnote erscheint.
- source_word: εἰς ἣν ὑπῆγον
  choice: zu dem sie unterwegs waren
  rationale: Diese Formulierung gibt die Bewegung auf ein Ziel und den andauernden Verlauf des Imperfekts natürlich wieder.
theological_decisions:
- issue: Ob die zweite Satzhälfte die auffällige, möglicherweise wunderhafte Unmittelbarkeit erklären oder abschwächen soll
  choice: Die knappe Aussage „sofort war das Boot an dem Land“ bleibt erhalten.
  alternative: „Sofort erreichte das Boot das Ufer“ oder abgeschwächt „bald erreichte das Boot das Land“.
  rationale: Der griechische Text schildert den Übergang knapp und ausdrücklich als unmittelbar. Die Übersetzung bewahrt diese erzählerische und theologische Spannung, ohne den Vorgang näher zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt dem knappen Erzählrhythmus des Griechischen; „an dem Land“ ist bewusst quellennah, während die geläufigere Lesart mit „erreichte … das Ufer“ in der Fußnote erhalten bleibt.
