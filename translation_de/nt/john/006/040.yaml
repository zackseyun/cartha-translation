  to: 'Denn dies ist der Wille meines Vaters: dass jeder, der den Sohn sieht[a] und an ihn glaubt, ewiges Leben hat und dass ich selbst ihn am letzten Tag auferwecken werde.[b]'
  rationale: Die Revision ersetzt allein die im Deutschen missverständliche Soll-Formulierung durch eine natürliche dass-Konstruktion. Das Präsens „hat“ ist im Kontext des Willens Gottes und der johanneischen Verheißung angemessen; das zukünftige „werde ... auferwecken“ bewahrt die Form und die eschatologische Ausrichtung von ἀναστήσω. Die explizite Betonung durch ἐγώ bleibt mit „ich selbst“ erhalten.
