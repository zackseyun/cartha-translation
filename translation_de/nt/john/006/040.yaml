id: JHN.6.40
reference: John 6:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: de
  text: 'Denn dies ist der Wille meines Vaters: dass jeder, der den Sohn sieht[a] und an ihn glaubt, ewiges Leben hat und dass ich selbst ihn am letzten Tag auferwecken werde.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder, der den Sohn betrachtet“. Das Verb kann ein aufmerksames Sehen bezeichnen, nicht nur die körperliche Wahrnehmung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich mit betontem „ich“: „und ich selbst werde ihn auferwecken“.'
    reason: lexical_emphasis
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Denn das ist
  rationale: „Denn“ bewahrt die erklärende Rückbindung an den vorausgehenden Vers; „das ist“ gibt τοῦτο ἐστιν direkt und natürlich wieder.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: der Wille meines Vaters
  rationale: Die Formulierung entspricht dem griechischen Genitiv und bewahrt die personale Vater-Sohn-Beziehung.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱόν
  choice: Jeder, der den Sohn sieht
  rationale: Die substantivierten Präsenspartizipien haben allgemeine, charakterisierende Bedeutung. „Sieht“ ist verständlich; eine Fußnote weist auf den möglichen Sinn aufmerksamen Betrachtens hin.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: und an ihn glaubt
  rationale: „An jemanden glauben“ ist die natürliche deutsche Wiedergabe von πιστεύω εἰς und bezeichnet hier auf den Sohn gerichteten Glauben bzw. Vertrauen.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: soll ewiges Leben haben
  rationale: „Soll“ gibt im Deutschen den von ἵνα eingeleiteten Inhalt des väterlichen Willens mit dem Konjunktiv wieder, ohne die Zusage zu einem bloß ungewissen „kann“ abzuschwächen.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: und ich selbst werde ihn auferwecken
  rationale: „Auferwecken“ bezeichnet in diesem eschatologischen Zusammenhang eindeutig die Auferstehung; „ich selbst“ bewahrt die Hervorhebung durch das ausdrücklich gesetzte ἐγώ.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der temporalen Dativphrase.
theological_decisions:
- issue: Verhältnis von Sehen und Glauben zum ewigen Leben
  choice: Jeder, der den Sohn sieht und an ihn glaubt, soll ewiges Leben haben
  alternative: Jeder, der den Sohn sieht und an ihn glaubt, hat ewiges Leben
  rationale: Die gewählte Fassung bewahrt die Struktur mit ἵνα und Konjunktiv als Inhalt des Willens des Vaters. Sie legt weder eine bestimmte Lehre über Erwählung und menschliche Entscheidung fest noch macht sie die Verheißung unverbindlich.
- issue: Hervorhebung des handelnden Ichs bei der Auferweckung
  choice: ich selbst werde ihn auferwecken
  alternative: ich werde ihn auferwecken
  rationale: Das ausdrückliche ἐγώ hebt Jesu persönliche Handlung hervor. „Ich selbst“ erhält diese textlich gegebene Betonung, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch Doppelpunkt und Semikolon im Deutschen übersichtlich gegliedert.
