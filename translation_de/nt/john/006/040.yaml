  terminology: „Vater“, „der Sohn“, „an ihn glaubt“, „ewiges Leben“, „auferwecken“ und „am letzten Tag“ sind sachgerecht, modern und in der johanneischen Terminologie stabil. Die Fußnoten sind inhaltlich zutreffend; die Betonungsfußnote zu ἐγώ ist sinnvoll.
