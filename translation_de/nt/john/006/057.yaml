  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: de
  text: Wie mich der lebendige Vater gesandt hat und ich wegen des Vaters lebe, so wird auch, wer mich isst[a], meinetwegen leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer sich von mir nährt“. Das griechische Verb ist anschaulich und konkret und kann das Essen beziehungsweise Kauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird durch mich leben“. Entsprechend kann es zuvor heißen: „ich lebe durch den Vater“. Die griechische Präposition kann hier einen Grund oder ein Mittel bezeichnen; der Haupttext gibt beide Wendungen kausal wieder und bewahrt so ihre Parallelität.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Wie … so
  rationale: Die zweiteilige deutsche Vergleichsform macht die Analogie des ganzen Satzes natürlich und deutlich, ohne den Sinn zu erweitern.
- source_word: ὁ ζῶν πατὴρ
  choice: der lebendige Vater
  rationale: Die attributive Partizipialform wird direkt wiedergegeben; „lebendig“ bewahrt das johanneische Lebensmotiv, ohne bereits „lebensspendend“ hineinzulesen.
- source_word: ἀπέστειλέν με
  choice: mich … gesandt hat
  rationale: Das Perfekt ist im Deutschen für die zurückliegende Sendung mit gegenwärtiger Bedeutung idiomatisch; „gesandt“ wahrt den biblisch-dignifieden Ton, ohne das Verb auf eine bloße Beauftragung zu verengen.
- source_word: ζῶ
  choice: ich … lebe
  rationale: Die präsentische, verbale Aussage und ihre Entsprechung zum späteren „leben“ bleiben erhalten.
- source_word: διὰ τὸν πατέρα
  choice: wegen des Vaters
  rationale: διά mit Akkusativ bezeichnet hier am ehesten Ursache oder Grund. Die Formulierung bleibt eng am Griechischen und lässt sich parallel zu δι’ ἐμέ wiedergeben.
- source_word: ὁ τρώγων με
  choice: wer mich isst
  rationale: Die substantivierte Partizipialform wird im Deutschen natürlich mit „wer“ wiedergegeben. „Isst“ bewahrt den auffällig konkreten Charakter von τρώγω und legt weder eine rein sakramentale noch eine rein bildliche Deutung fest.
- source_word: κἀκεῖνος
  choice: so wird auch, wer
  rationale: Das verstärkende καί im zusammengezogenen κἀκεῖνος wird durch „auch“ ausgedrückt; die deutsche Wie-so-Konstruktion gibt die hervorgehobene Entsprechung idiomatisch wieder.
- source_word: ζήσει
  choice: wird … leben
  rationale: Das Futur und der verbale Parallelismus zu „ich lebe“ werden unmittelbar bewahrt.
- source_word: δι’ ἐμέ
  choice: meinetwegen
  rationale: Die kausale Lesart von διά mit Akkusativ wird passend zur ersten Präpositionalphrase wiedergegeben. „Meinetwegen“ ist standardsprachlich und wahrt die knappe Parallelität.
theological_decisions:
- issue: Das Lebensverhältnis des Sohnes zum Vater in διὰ τὸν πατέρα
  choice: Kausal als „ich lebe wegen des Vaters“ wiedergegeben
  alternative: „Ich lebe durch den Vater“
  rationale: Die Übersetzung erhält die im Satz angelegte Beziehung und die Parallele zwischen Vater–Sohn und Sohn–Glaubendem, ohne daraus eine Aussage über ontologische Unterordnung oder eine Leugnung der Gottheit des Sohnes abzuleiten.
- issue: Sakramentale oder weiter gefasste bildliche Bedeutung von ὁ τρώγων με
  choice: Konkret als „wer mich isst“ übersetzt
  alternative: „wer sich von mir nährt“
  rationale: Das konkrete Essensverb bleibt hörbar. So wird weder eine ausschließlich eucharistische noch eine ausschließlich metaphorische Auslegung in den Übersetzungstext eingebaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die auffällige Wendung „mich isst“ ist bewusst beibehalten, weil auch das griechische Verb konkret und anstößig wirken kann. „Wie … so“ macht die Satzarchitektur im Deutschen klar.
