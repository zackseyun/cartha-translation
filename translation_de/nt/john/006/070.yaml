id: JHN.6.70
reference: John 6:70
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: »Habe nicht ich euch, die Zwölf, erwählt? Und doch ist einer von euch ein Teufel.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Verleumder«. Das griechische Wort kann einen falschen Ankläger bezeichnen und in vielen Zusammenhängen auch den Teufel. Hier ist die Formulierung qualitativ und keine ausdrückliche Gleichsetzung mit Satan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche deutsche Wiedergabe des erzählenden Verbs in einem Dialog.
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: Habe nicht ich euch, die Zwölf, erwählt?
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung. Die Stellung von »ich« bewahrt dessen Hervorhebung; »die Zwölf« bezeichnet die anerkannte Gruppe.
- source_word: καὶ
  choice: Und doch
  rationale: 'Das formal verbindende καί hat hier im Zusammenhang eine kontrastierende Kraft: Trotz der Erwählung der Zwölf gilt die folgende Aussage über einen von ihnen.'
- source_word: ἐξ ὑμῶν εἷς
  choice: einer von euch
  rationale: Natürliche deutsche Wiedergabe des partitiven Ausdrucks.
- source_word: διάβολός
  choice: ein Teufel
  rationale: Das artikellose Prädikatsnomen ist hier qualitativ formuliert. »Ein Teufel« erhält die Schärfe und Mehrdeutigkeit des griechischen Ausdrucks, ohne den Betreffenden ausdrücklich mit Satan gleichzusetzen.
theological_decisions:
- issue: Ob διάβολός eine unmittelbare Gleichsetzung mit Satan oder eine qualitative Charakterisierung ausdrückt
  choice: ein Teufel
  alternative: ein Verleumder; der Teufel
  rationale: Der artikellose griechische Ausdruck ist qualitativ und lässt die genaue Art der Charakterisierung offen. »Ein Teufel« bewahrt das theologische und rhetorische Gewicht; die Fußnote nennt die lexikalische Alternative, während »der Teufel« die Aussage zu stark als direkte Identifikation festlegen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die Hervorhebung von »ich« bleiben erhalten; »die Zwölf« wird als feste Gruppenbezeichnung großgeschrieben.
