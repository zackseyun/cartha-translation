  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Μὴ γογγύζετε μετ’ ἀλλήλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: »Murrt nicht untereinander.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Murrt nicht miteinander.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: antwortete
  rationale: Die griechische Antwortformel lässt sich im natürlichen modernen Deutsch am besten mit dem einen Verb »antwortete« wiedergeben; ein wörtliches »antwortete und sagte« wäre unnötig schwerfällig.
- source_word: Μὴ γογγύζετε
  choice: Murrt nicht
  rationale: »Murren« gibt γογγύζω prägnant wieder und bewahrt den biblischen Anklang an das unzufriedene Murren Israels. Der präsentische Imperativ mit μή kann sowohl eine allgemeine Untersagung als auch das Beenden eines bereits laufenden Verhaltens bezeichnen; »Murrt nicht« legt sich nicht unnötig auf Letzteres fest.
- source_word: μετ’ ἀλλήλων
  choice: untereinander
  rationale: »Untereinander« ist eine natürliche deutsche Wiedergabe der wechselseitigen beziehungsweise gruppeninternen Bedeutung; die mögliche Nuance »miteinander/gegeneinander« wird in einer Fußnote kenntlich gemacht.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Gebräuchliche deutsche Form des Namens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Doppelwendung »antwortete und sagte« wird idiomatisch verdichtet, während »murren« den biblischen Resonanzraum des Ausgangswortes bewahrt.
