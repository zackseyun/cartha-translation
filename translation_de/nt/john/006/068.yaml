  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: de
  text: 'Simon Petrus antwortete ihm: „Herr“[a], zu wem sollen wir gehen? Du hast Worte des ewigen Lebens,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meister“. Das griechische κύριος kann als respektvolle Anrede dienen; „Herr“ bewahrt hier zugleich den für das Johannesevangelium möglichen weitergehenden Bedeutungsgehalt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche und natürliche deutsche Erzählverb für eine Antwort im Dialog.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich auf Jesus und wird direkt mit „ihm“ wiedergegeben.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Entspricht der etablierten deutschen Namensform.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος bezeichnet eine ehrerbietige Anrede und trägt im Johannesevangelium zugleich christologischen Nachhall; „Herr“ bewahrt beides.
- source_word: πρὸς τίνα
  choice: zu wem
  rationale: Gibt die persönliche Zielrichtung der Frage idiomatisch und genau wieder.
- source_word: ἀπελευσόμεθα
  choice: sollen wir gehen
  rationale: Der griechische Futur in der rhetorischen Frage wird im Deutschen natürlich mit „sollen wir gehen“ ausgedrückt; dies vermittelt die Frage nach einer denkbaren Alternative, ohne bloße Vorhersage zu suggerieren.
- source_word: ῥήματα
  choice: Worte
  rationale: Bezeichnet hier gesprochene Worte; „Worte“ ist natürlich und bewahrt den Plural.
- source_word: ζωῆς αἰωνίου
  choice: des ewigen Lebens
  rationale: Bewahrt die Genitivverbindung und die zentrale johanneische Wendung „ewiges Leben“.
- source_word: ἔχεις
  choice: du hast
  rationale: Direkte, idiomatische Wiedergabe des einfachen Besitzverbs.
theological_decisions:
- issue: Bedeutungsgehalt von Κύριε als Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: „Herr“ wahrt sowohl die ehrerbietige Anrede als auch den möglichen christologischen Bedeutungsgehalt, ohne diesen über den Wortlaut hinaus festzulegen.
- issue: Verhältnis der Worte zum ewigen Leben in ῥήματα ζωῆς αἰωνίου
  choice: Worte des ewigen Lebens
  alternative: Worte, die ewiges Leben geben
  rationale: 'Die formale Genitivverbindung bleibt bewusst offen: Die Worte können vom ewigen Leben handeln, es vermitteln oder durch es gekennzeichnet sein. Eine kausale Paraphrase würde diese Spannung vorschnell auflösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage klingt mit „zu wem sollen wir gehen?“ natürlich und eindringlich. Die traditionelle, zugleich allgemein verständliche Wendung „Worte des ewigen Lebens“ bewahrt die knappe und theologisch offene Genitivkonstruktion des Griechischen.
