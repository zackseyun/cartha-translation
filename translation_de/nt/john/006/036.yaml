  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: de
  text: 'Aber ich habe euch gesagt: Ihr habt mich tatsächlich gesehen[a] und glaubt doch nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ihr habt mich sogar gesehen.'
    reason: Das erste καί kann neben einer allgemein hervorhebenden Bedeutung auch mit „sogar“ wiedergegeben werden.
lexical_decisions:
- source_word: ἀλλ’
  choice: Aber
  rationale: Kennzeichnet den Gegensatz zur vorausgehenden Aussage und entspricht dem knappen adversativen Anschluss des Griechischen.
- source_word: εἶπον ὑμῖν
  choice: ich habe euch gesagt
  rationale: Die deutsche Perfektform gibt den vergangenen, für die Gegenwart relevanten Sprechakt natürlich wieder; das Dativpronomen entspricht ὑμῖν.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen den Inhalt des Gesagten idiomatisch ein, ohne die griechische Konstruktion unnötig schwerfällig mit „dass“ nachzubilden.
- source_word: καὶ ἑωράκατέ με
  choice: Ihr habt mich tatsächlich gesehen
  rationale: Das erste καί hat hier wahrscheinlich hervorhebende Kraft. „Tatsächlich“ bringt diese Betonung zum Ausdruck; das Perfekt „habt gesehen“ wahrt die gegenwärtige Relevanz des Sehens.
- source_word: καὶ οὐ πιστεύετε
  choice: und glaubt doch nicht
  rationale: „Und“ bewahrt die Koordination, während „doch“ den im Zusammenhang deutlich empfundenen Gegensatz natürlich ausdrückt. Das Präsens gibt den fortbestehenden Unglauben wieder.
theological_decisions:
- issue: Bedeutung des ersten καί
  choice: 'hervorhebend: „tatsächlich“'
  alternative: „auch“, „sogar“ oder konzessiv „obwohl“
  rationale: Das καί kann emphatisch verstanden werden, doch sein genauer rhetorischer Wert bleibt offen. Die Hauptfassung hebt die Tatsache des Sehens hervor; die Fußnote nennt die naheliegende Alternative „sogar“, ohne die Konstruktion eindeutig konzessiv festzulegen.
- issue: Wiedergabe von πιστεύετε
  choice: glaubt
  alternative: vertraut / habt Glauben
  rationale: „Glauben“ ist die direkte und im Johannesevangelium etablierte Entsprechung für πιστεύω. Sie legt weder bloßes Fürwahrhalten noch eine weitergehende konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „euch/ihr“ bleibt erhalten; „doch“ macht den Gegensatz idiomatisch sichtbar, ohne ihn durch eine ausdrücklich konzessive Umformung festzuschreiben.
