  source_fidelity: Die Übersetzung gibt die Abfolge des aoristischen Partizips („Sie stiegen in ein Boot“) und die fortgesetzte Bewegung des Imperfekts idiomatisch wieder. „über den See nach Kafarnaum“ entspricht πέραν τῆς θαλάσσης εἰς Καφαρναούμ; „See“ ist im Deutschen in diesem Kontext natürlich. Die beiden Plusquamperfektformen bewahren den rückblickenden erzählerischen Bezug von ἐγεγόνει und ἐληλύθει angemessen.
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen würdigem, ungekünsteltem Bibelregister. Die Koordination der ersten Satzhälfte ist idiomatisch; das einfache Präteritum „fuhren“ ist im deutschen Erzählstil eine natürliche Wiedergabe, auch wenn der griechische Imperfektverlauf nicht ausdrücklich markiert wird.
  terminology: „Boot“, „See“, „Kafarnaum“ und „Jesus“ sind sachgerecht und konsistent. Es werden keine theologischen Deutungen ergänzt.
