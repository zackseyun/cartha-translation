id: JHN.6.17
reference: John 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: de
  text: Sie stiegen in ein Boot und fuhren über den See nach Kafarnaum.[a] Es war bereits dunkel geworden, und Jesus war noch nicht zu ihnen gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und fuhren zum anderen Ufer des Sees, nach Kafarnaum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Sie stiegen in ein Boot
  rationale: Das Partizip wird idiomatisch als koordinierter Hauptsatz wiedergegeben; die zeitliche Abfolge bleibt erhalten. Der unbestimmte Artikel entspricht dem artikellosen πλοῖον.
- source_word: ἤρχοντο πέραν τῆς θαλάσσης
  choice: fuhren über den See
  rationale: Der deutsche Verlaufscharakter ergibt sich hier aus dem narrativen Zusammenhang; „fuhren“ bezeichnet natürlich die Bewegung im Boot. „Über den See“ bewahrt die Zielrichtung von πέραν, während θάλασσα im deutschen Kontext des Sees Gennesaret natürlich als „See“ erscheint.
- source_word: εἰς Καφαρναούμ
  choice: nach Kafarnaum
  rationale: Bei Städtenamen ist „nach“ die natürliche deutsche Wiedergabe der Zielangabe.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Es war bereits dunkel geworden
  rationale: Die Formulierung bewahrt den resultativen Charakter des Plusquamperfekts und ist zugleich natürliches Deutsch.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς
  choice: Jesus war noch nicht zu ihnen gekommen
  rationale: Das Plusquamperfekt und οὔπω werden direkt wiedergegeben; „zu ihnen gekommen“ vermeidet die interpretierende Erweiterung „sich ihnen angeschlossen“.
theological_decisions:
- issue: Erzählaspekt und zeitliche Abfolge
  choice: Das Einsteigen wird als vorausgehende Handlung ausgedrückt, die Fahrt als im Gang befindliches Geschehen; Dunkelheit und Jesu Ausbleiben werden im Plusquamperfekt wiedergegeben.
  alternative: „Sie gingen hinüber“ beziehungsweise „Es war schon dunkel“
  rationale: Die gewählte Fassung erhält die erzählerische Spannung und die griechischen Zeitverhältnisse, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und gut verständlich; „See“ ist im Deutschen für das Gewässer natürlich, während die Bewegung mit dem Boot durch „fuhren“ verdeutlicht wird.
