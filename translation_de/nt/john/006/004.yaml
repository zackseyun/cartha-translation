  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: de
  text: Das Passafest, das Fest der Juden[a], war nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Judäer“. Das griechische Wort kann je nach Zusammenhang entweder Juden allgemein oder Judäer im Besonderen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches Bindewort zur Fortführung der Erzählung. Im Deutschen ist kein ausdrückliches „nun“ oder „aber“ nötig; die Verbindung ergibt sich natürlich aus dem Kontext.
- source_word: ἐγγὺς
  choice: war nahe
  rationale: ἐγγύς bezeichnet zusammen mit ἦν die zeitliche Nähe des Festes. „War nahe“ ist knapp, würdevoll und in diesem Zusammenhang verständlich.
- source_word: πάσχα
  choice: Passafest
  rationale: πάσχα bezeichnet das jüdische Passa. „Passafest“ macht unmittelbar deutlich, dass hier das Fest gemeint ist.
- source_word: ἑορτὴ
  choice: Fest
  rationale: ἑορτή bezeichnet eine religiöse Festfeier. „Fest“ ist im modernen Deutsch natürlich und bewahrt den kultischen Zusammenhang.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Ἰουδαῖοι kann je nach Kontext „Juden“ oder „Judäer“ bedeuten. Da das Passa ein Fest des jüdischen Volkes insgesamt ist, passt hier „der Juden“ am besten; die grundsätzlich mögliche engere Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων in der johanneischen Erzählung
  choice: der Juden
  alternative: der Judäer
  rationale: Der Ausdruck ist im Johannesevangelium kontextabhängig. Hier bezeichnet er am natürlichsten die religiöse und ethnische Gemeinschaft, deren Fest das Passa ist, nicht nur Bewohner Judäas. Die Fußnote bewahrt die lexikalische Alternative, ohne eine antijüdische Zuspitzung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die appositionale Struktur des griechischen Satzes bleibt erhalten; ein künstliches einleitendes „Nun“ wird vermieden.
