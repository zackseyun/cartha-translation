  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Amen, amen, ich sage euch: Ihr sucht mich nicht, weil ihr Zeichen gesehen habt, sondern weil ihr von den Broten gegessen habt und satt geworden seid.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von den Broten“; gemeint sind die zuvor vermehrten Brote. Für „satt geworden“ ist auch „gesättigt worden“ möglich.'
    reason: Die Anmerkung erläutert die partitive Wendung ἐκ τῶν ἄρτων und die mögliche formnähere Wiedergabe des Passivs ἐχορτάσθητε.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: 'Jesus antwortete ihnen:'
  rationale: Die im Griechischen übliche doppelte Redeeinleitung „antwortete … und sagte“ wird im natürlichen Deutschen durch „antwortete ihnen“ mit Doppelpunkt vollständig wiedergegeben.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die Transliteration bewahrt die für Johannes charakteristische feierliche Doppelformel und ist im deutschen Bibelsprachgebrauch verständlich; das altertümliche „Wahrlich, wahrlich“ wird vermieden.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die formnahe Wiedergabe erhält den feierlichen Charakter der Aussage.
- source_word: ζητεῖτέ με
  choice: ihr sucht mich
  rationale: Das deutsche Präsens gibt die gegenwärtig andauernde Suche idiomatisch wieder, ohne den Ausdruck zu „ihr sucht nach mir“ abzuschwächen.
- source_word: οὐχ ὅτι … ἀλλ’ ὅτι
  choice: nicht, weil …, sondern weil
  rationale: Die Konstruktion stellt hier zwei Beweggründe kontrastierend gegenüber.
- source_word: εἴδετε
  choice: gesehen habt
  rationale: Das Perfekt ist im gegenwärtigen Standarddeutsch die natürliche Erzählform für die zurückliegende Wahrnehmung; „erkannt habt“ würde geistliches Verständnis hineinlesen.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den johanneischen Begriff für Taten, die über sich selbst hinausweisen, statt ihn auf „Wunder“ zu verengen.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: von den Broten gegessen habt
  rationale: Die Wiedergabe erhält sowohl den Plural „Brote“ als auch die partitive Aussage von ἐκ, auch wenn „vom Brot“ im Deutschen geläufiger wäre.
- source_word: ἐχορτάσθητε
  choice: satt geworden seid
  rationale: Die Wendung bezeichnet, dass sie bis zur Sättigung aßen. „Satt geworden“ ist im heutigen Deutsch natürlicher als das formale „gesättigt worden“ und bewahrt den resultativen Sinn.
theological_decisions:
- issue: Bedeutung von σημεῖα im Johannesevangelium
  choice: Zeichen
  alternative: Wunder; Wunderzeichen
  rationale: Jesu Taten erscheinen bei Johannes als offenbarende Zeichen. „Zeichen“ erhält diese theologische Spannung, ohne eine Erklärung in den Haupttext einzufügen.
- issue: Sinn der Aussage über das Sehen der Zeichen
  choice: gesehen habt
  alternative: verstanden oder geistlich erkannt habt
  rationale: Der Text sagt zunächst „gesehen“; ob Jesus damit zugleich mangelndes geistliches Erfassen andeutet, bleibt dem Zusammenhang überlassen und wird nicht in die Übersetzung eingebaut.
- issue: Doppelte griechische Redeeinleitung
  choice: 'Jesus antwortete ihnen:'
  alternative: 'Jesus antwortete ihnen und sagte:'
  rationale: Die natürliche deutsche Form vermeidet eine semitisch-griechische Redundanz, ohne Inhalt oder Sprecherwechsel auszulassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche johanneische Formel bleibt als „Amen, amen“ erhalten; veraltetes „wahrlich“ und unnötig schwerfällige Passivformen werden vermieden.
