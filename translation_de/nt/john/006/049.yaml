base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: de
  text: Eure Väter haben in der Wüste das Manna gegessen, und sie sind gestorben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eure Vorfahren“. Wörtlich steht im Griechischen: „Eure Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Eure Väter
  rationale: „Väter“ entspricht der griechischen Form und bezeichnet hier Israels Vorfahren aus der Wüstengeneration. Die wörtliche Form bewahrt zugleich die direkte rhetorische Anrede.
- source_word: ἔφαγον
  choice: haben … gegessen
  rationale: Der Aorist bezeichnet das vergangene, tatsächliche Essen. Im modernen Deutschen klingt das Perfekt in direkter Rede natürlich.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige biblische Bezeichnung für den Schauplatz der Exoduswanderung und wahrt den intertextuellen Bezug.
- source_word: τὸ μάννα
  choice: das Manna
  rationale: Der bestimmte Artikel verweist auf das aus der Exodusüberlieferung bekannte Manna und wird im Deutschen idiomatisch wiedergegeben.
- source_word: καὶ ἀπέθανον
  choice: und sie sind gestorben
  rationale: Die ausdrückliche Wiedergabe des Subjekts sorgt für Klarheit und erhält den Kontrast zwischen dem gegessenen Manna und dem dennoch eingetretenen Tod.
theological_decisions:
- issue: Bezeichnung der Wüstengeneration Israels
  choice: Eure Väter
  alternative: Eure Vorfahren
  rationale: „Väter“ folgt der griechischen Wortwahl und erhält die geschichtliche sowie rhetorische Kraft, ohne den Bezug über den Text hinaus auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt ist für die direkte Rede natürlich; „Wüste“ und „Manna“ bewahren den vertrauten biblischen Klang.
