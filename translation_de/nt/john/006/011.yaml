  - severity: low
    issue: Formulierung für τοῖς ἀνακειμένοις
    rationale: „die sich zum Essen niedergelegt hatten“ ist zwar sachlich richtig, aber stilistisch umständlich. „die bei Tisch lagen“ ist natürliches modernes Deutsch und erhält die von ἀνάκειμαι bezeichnete Liegehaltung.
  - severity: low
    issue: 'Fußnote a: „Daliegenden“'
    rationale: „Daliegenden“ ist im heutigen Deutsch keine gute lexikalische Alternative. Die Anmerkung sollte stattdessen knapp erläutern, dass das griechische Wort die beim Mahl Lagernden bzw. Liegenden bezeichnet.
