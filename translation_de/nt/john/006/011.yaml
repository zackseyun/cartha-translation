  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: de
  text: Da nahm Jesus die Brote und verteilte sie, nachdem er gedankt hatte, an die, die bei Tisch lagen[a]; ebenso gab er ihnen von den Fischen[b], so viel sie wollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die, die zu Tisch lagen“. Das griechische Wort bezeichnet Menschen, die bei einer Mahlzeit lagen; dies war damals die übliche Haltung bei Tisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den kleinen Fischen“. Das griechische Wort kann Fische bezeichnen, die zum Brot gegessen wurden, möglicherweise kleine Fische.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: οὖν führt die Erzählung folgernd weiter. „Da“ verbindet den Satz im modernen Deutschen natürlich mit dem vorausgehenden Geschehen, ohne ein zu starkes logisches „deshalb“ einzutragen.
- source_word: τοὺς ἄρτους
  choice: die Brote
  rationale: Der Plural bezeichnet im Speisungsbericht die einzelnen Brote und wird daher gegenüber dem allgemeineren Singular „Brot“ bewahrt.
- source_word: εὐχαριστήσας
  choice: dankte
  rationale: Das Partizip bezeichnet eine vor beziehungsweise mit der Austeilung vollzogene Danksagung. Die koordinierte Wiedergabe ist im Deutschen natürlich; ein nicht ausdrücklich genanntes Objekt wie „Gott“ wird nicht ergänzt.
- source_word: διέδωκεν
  choice: verteilte sie
  rationale: διαδίδωμι bezeichnet hier das Austeilen an die Menge. Das Pronomen nimmt die Brote idiomatisch wieder auf.
- source_word: τοῖς ἀνακειμένοις
  choice: an die, die sich zum Essen niedergelegt hatten
  rationale: ἀνάκειμαι bezeichnet die damalige Haltung bei einer Mahlzeit, nämlich das Lagern beziehungsweise Sich-Niederlegen. Die Formulierung macht den Mahlkontext verständlich, ohne das Bild auf das moderne Sitzen zu reduzieren.
- source_word: ὁμοίως καὶ
  choice: ebenso
  rationale: „Ebenso“ wahrt die Parallelität zwischen Brot und Fisch; das zusätzliche καί wird im Deutschen durch die parallele Satzbildung und das Verb „gab“ ausreichend wiedergegeben.
- source_word: ἐκ τῶν ὀψαρίων
  choice: von den Fischen
  rationale: ὀψάριον kann kleine Fische oder Fisch als Beikost bezeichnen. „Fische“ ist im Haupttext natürlich und lässt die genauere Nuance offen.
- source_word: ὅσον ἤθελον
  choice: so viel sie wollten
  rationale: Die Wendung bezeichnet die Menge nach dem Wunsch der Essenden und wird klar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Mögliche eucharistische Anklänge von εὐχαριστήσας
  choice: „dankte“ ohne sakramentale Ausdeutung
  alternative: „sprach den Segen“ oder eine ausdrückliche eucharistische Deutung
  rationale: Das griechische Verb bezeichnet hier das Danken. Mögliche eucharistische Bezüge des Kontextes bleiben bestehen, werden aber nicht durch eine interpretierende Erweiterung in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich zum Essen niedergelegt hatten“ bewahrt die historische Esshaltung und bleibt für heutige Leser verständlich. Die leichte Ergänzung „gab er ihnen“ im zweiten, elliptischen Satzglied macht die griechische Parallelkonstruktion im Deutschen flüssig, ohne den Sinn zu erweitern.
