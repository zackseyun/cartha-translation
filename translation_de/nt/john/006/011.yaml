  source_fidelity: 'Der Entwurf gibt die Satzglieder und den Sinn des griechischen Textes insgesamt zuverlässig wieder: Jesus nimmt die Brote, dankt, verteilt sie an die beim Mahl Lagernden und gibt ebenso von den Fischen, so viel sie wollten. Eine kleine Präzisierung ist jedoch sinnvoll: Das griechische Aoristpartizip εὐχαριστήσας bezeichnet die der Austeilung vorausgehende Danksagung deutlicher, als es die bloße Reihung „dankte und verteilte“ erkennen lässt.'
  naturalness: Das Deutsch ist klar und modernes Standarddeutsch. „Die sich zum Essen niedergelegt hatten“ ist verständlich, wirkt aber etwas schwerfällig und legt durch das Plusquamperfekt eine stärkere zeitliche Vorzeitigkeit nahe, als erforderlich ist. „Die bei Tisch lagen“ ist idiomatischer und bewahrt die historische Mahlhaltung.
  terminology: „Brote“, „dankte“, „verteilte“ und „Fische“ sind angemessen. „Bei Tisch lagen“ trifft τοῖς ἀνακειμένοις besser als die substanzialisierende Fußnotenform „Daliegenden“. Die Fußnote soll die lexikalische Alternative erläutern, ohne eine unnatürliche wörtliche Form als bevorzugte deutsche Wiedergabe erscheinen zu lassen.
  issues:
