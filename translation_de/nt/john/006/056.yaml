id: JHN.6.56
reference: John 6:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: de
  text: Wer mein Fleisch isst[a] und mein Blut trinkt, bleibt in mir, und ich in ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb ist anschaulicher als das allgemeine Wort für »essen« und kann auch »kauen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Wer … isst
  rationale: Der Artikel mit dem substantivierten Präsenspartizip bezeichnet einen Menschen, der durch dieses fortdauernde Tun gekennzeichnet ist. Die deutsche Konstruktion mit »Wer« ist natürlich und bewahrt den allgemeinen Bezug.
- source_word: τρώγων
  choice: isst
  rationale: τρώγω ist anschaulicher als ein allgemeines Verb für Essen und kann auch den Vorgang des Kauens bezeichnen. »Isst« ist im Deutschen hier klar und idiomatisch; die stärkere Bildhaftigkeit wird in einer Fußnote erhalten.
- source_word: μου τὴν σάρκα
  choice: mein Fleisch
  rationale: Die konkrete Wiedergabe bewahrt die anstößige, leibliche Bildsprache des griechischen Textes, ohne sie sakramental oder metaphorisch auszudeuten.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: und mein Blut trinkt
  rationale: Das koordinierte Präsenspartizip wird unmittelbar und parallel wiedergegeben. »Blut« bleibt konkret und erhält die Opferbildsprache.
- source_word: ἐν ἐμοὶ μένει
  choice: bleibt in mir
  rationale: »Bleiben« ist eine natürliche und zugleich präzise Wiedergabe des johanneischen Schlüsselverbs μένω; es drückt fortdauernde Verbundenheit aus, ohne diese dogmatisch zu definieren.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: und ich in ihm
  rationale: Wie im Griechischen wird das Verb im zweiten Satzglied nicht wiederholt. Die Ellipse ist auch im Deutschen verständlich und bewahrt die knappe Parallelstruktur.
theological_decisions:
- issue: Sakramentale gegenüber metaphorischer Deutung des Essens des Fleisches und Trinkens des Blutes
  choice: Die konkrete Ausdrucksweise des griechischen Textes bleibt ohne interpretierende Ergänzung erhalten.
  alternative: Eine ausdrücklich eucharistische Deutung oder eine ausdrückliche Gleichsetzung mit dem Glauben.
  rationale: Der Vers selbst entscheidet die zwischen christlichen Traditionen umstrittene Deutung nicht ausdrücklich. Die Übersetzung bewahrt deshalb die theologische Spannung.
- issue: Johanneische Sprache des gegenseitigen Innewohnens
  choice: »bleibt in mir, und ich in ihm«
  alternative: Eine Deutung wie »ist mit mir vereint« oder die ausdrückliche Wiederholung »und ich bleibe in ihm«.
  rationale: Die gewählte Form bewahrt sowohl das Schlüsselwort μένω als auch die Ellipse des Ausgangstextes und vermeidet eine systematisch-theologische Festlegung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die konkrete Bildsprache sowie die knappe johanneische Parallelstruktur bleiben erhalten.
