  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: de
  text: Und der See wurde von einem starken Wind aufgewühlt, der wehte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und der See geriet in Bewegung, weil ein starker Wind wehte.“'
    reason: Lexikalische und syntaktische Alternative zu διεγείρετο und zum Verhältnis des Partizips πνέοντος.
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Und der See
  rationale: θάλασσα bezeichnet hier den See; obwohl der Kontext den See von Galiläa meint, steht im Griechischen das gewöhnliche Substantiv. τε wird als leichte Verknüpfung mit „Und“ wiedergegeben.
- source_word: ἀνέμου μεγάλου
  choice: von einem starken Wind
  rationale: ἄνεμος bedeutet „Wind“; μέγας wird bei Wind im heutigen Deutsch idiomatisch mit „stark“ wiedergegeben, ohne die Intensität zu „heftig“ oder „gewaltig“ zu steigern.
- source_word: πνέοντος
  choice: der wehte
  rationale: Das Präsenspartizip beschreibt den Wind als anhaltend wehend. Der Relativsatz bildet diese fortdauernde Begleitumstandsangabe natürlich ab.
- source_word: διεγείρετο
  choice: wurde ... aufgewühlt
  rationale: Das Imperfekt Passiv bezeichnet einen fortdauernden Vorgang, der den See erfasst. „Aufgewühlt“ bewahrt das anschauliche Bild und die passive Perspektive.
theological_decisions: []
