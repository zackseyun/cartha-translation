  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: de
  text: Das sagte er aber, um ihn auf die Probe zu stellen[a]; denn er selbst wusste, was er tun würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn zu prüfen“. Das griechische Verb kann auch „versuchen“ bedeuten; hier ist jedoch ein Prüfen oder Erproben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: Das sagte er aber
  rationale: τοῦτο verweist auf die unmittelbar vorausgehende Frage Jesu. Das deutsche Präteritum gibt das griechische Imperfekt in erzählender Prosa natürlich wieder; „aber“ markiert den leichten erklärenden Gegensatz.
- source_word: πειράζων αὐτόν
  choice: um ihn auf die Probe zu stellen
  rationale: Das Partizip bezeichnet hier den Zweck der Äußerung. Im Kontext geht es um ein Prüfen oder Erproben Philipps, nicht um eine Verleitung zum Bösen.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: denn er selbst wusste
  rationale: „denn“ bewahrt die begründende Funktion von γάρ; „er selbst“ erhält die Betonung des ausdrücklich gesetzten Pronomens αὐτός.
- source_word: τί ἔμελλεν ποιεῖν
  choice: was er tun würde
  rationale: μέλλω mit Infinitiv weist auf die bevorstehende beziehungsweise beabsichtigte Handlung hin. „tun würde“ ist im deutschen Rückblick natürlich und lässt diese Nuance angemessen offen.
theological_decisions:
- issue: Bedeutung von πειράζων im Handeln Jesu gegenüber Philippus
  choice: „um ihn auf die Probe zu stellen“
  alternative: „um ihn zu versuchen“
  rationale: Der Zusammenhang beschreibt eine Prüfung seines Verständnisses oder Vertrauens, keine Verleitung zum Bösen. Die Fußnote bewahrt dennoch die weitere Bedeutungsbreite des Verbs.
- issue: Betonung des Wissens Jesu
  choice: „er selbst wusste“
  alternative: „er wusste“
  rationale: Das ausdrückliche αὐτός ist emphatisch und wird bewahrt, ohne über die Aussage des Textes hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Auf die Probe stellen“ vermeidet die im heutigen Deutsch leicht missverständliche moralische Bedeutung von „versuchen“.
