  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: de
  text: 'Viele seiner Jünger sagten daraufhin, als sie das hörten: »Dieses Wort ist hart[a]. Wer kann es anhören[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese Aussage ist hart“ beziehungsweise „Diese Lehre ist hart“. Das griechische Wort kann hier „Wort“, „Aussage“, „Botschaft“ oder „Lehre“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wer kann darauf hören?“ beziehungsweise „Wer kann es annehmen?“ Das griechische Verb kann je nach Zusammenhang „hören“, „anhören“ oder „auf etwas hören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ … ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Viele von seinen Jüngern
  rationale: Die Formulierung bezeichnet eine größere Zahl innerhalb des weiteren Jüngerkreises. „Viele von seinen Jüngern“ gibt diese Teilmenge klar und natürlich wieder.
- source_word: οὖν
  choice: daher
  rationale: Die Konjunktion kennzeichnet eine Folgerung beziehungsweise die Reaktion auf die vorangegangene Rede Jesu. „Daher“ bewahrt diesen Zusammenhang.
- source_word: ἀκούσαντες
  choice: als sie das hörten
  rationale: Das Aoristpartizip hat hier temporale Bedeutung. Das ergänzte „das“ verweist im Deutschen natürlich auf die zuvor gehörte Rede.
- source_word: Σκληρός
  choice: hart
  rationale: „Hart“ bewahrt die mögliche Spannweite zwischen schwer anzunehmen, streng, anstößig und schwer erträglich, ohne die Aussage auf bloße intellektuelle Schwierigkeit zu verengen.
- source_word: ὁ λόγος οὗτος
  choice: Dieses Wort
  rationale: λόγος bezeichnet hier die eben gehörte Äußerung oder Lehre. „Dieses Wort“ bleibt formal nah am Griechischen und ist im gehobenen, aber verständlichen deutschen Bibelstil geläufig.
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: Wer kann es anhören?
  rationale: „Anhören“ erhält den Bezug zum tatsächlichen Hören, kann im Deutschen aber zugleich die Frage ausdrücken, wer eine solche Aussage ertragen oder annehmen kann. So bleibt die Bedeutungsweite von ἀκούω erhalten.
theological_decisions:
- issue: Art des Anstoßes an Jesu Rede
  choice: Die Rede wird als „hart“ bezeichnet, ohne festzulegen, ob sie als schwer verständlich, streng, anstößig oder unannehmbar empfunden wird.
  alternative: Eine engere Wiedergabe wie „Diese Lehre ist unerträglich“ oder „Diese Aussage ist schwer zu verstehen“.
  rationale: σκληρός bezeichnet hier mehr als bloße intellektuelle Schwierigkeit, legt aber nicht eindeutig fest, worin die Härte besteht. Die offene Formulierung bewahrt diese theologische und sprachliche Spannung.
- issue: Bedeutung von ἀκούειν in der Schlussfrage
  choice: „anhören“ lässt sowohl das Hören als auch das ertragende beziehungsweise aufnehmende Zuhören anklingen.
  alternative: „Wer kann das akzeptieren?“ würde die Bedeutung ausdrücklich auf Zustimmung festlegen; „Wer kann es hören?“ könnte dagegen als Frage der akustischen Wahrnehmung missverstanden werden.
  rationale: Der Kontext deutet auf die Schwierigkeit hin, Jesu Rede aufzunehmen, doch das Verb selbst kann hören, zuhören oder auf etwas hören bedeuten. Die Übersetzung vermeidet eine vollständige Auflösung dieser Mehrdeutigkeit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Bibelstil. Die Wortstellung ist natürlich, während „Dieses Wort ist hart“ bewusst die knappe und eindringliche Form des griechischen Satzes bewahrt. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
