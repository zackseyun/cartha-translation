  source_fidelity: 'Der deutsche Haupttext gibt alle wesentlichen Elemente des griechischen Satzes getreu wieder: der substantivierte präsentische Partizipialausdruck wird idiomatisch mit „Wer … isst und … trinkt“ erfasst, σάρξ und αἷμα bleiben konkret als „Fleisch“ und „Blut“ stehen, ἔχει ist gegenwärtig mit „hat“ wiedergegeben, und ἀναστήσω markiert zutreffend die künftige Auferweckung „am letzten Tag“. Die Verbindung von gegenwärtigem ewigen Leben und künftiger Auferweckung bleibt erhalten.'
