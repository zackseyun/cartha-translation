  terminology: „Fleisch“, „Blut“, „ewiges Leben“, „auferwecken“ und „letzter Tag“ sind terminologisch präzise und für den johanneischen Kontext angemessen. Der Text deutet die konkrete Ess- und Trinksprache weder sakramental noch metaphorisch aus. Die Fußnote zu τρώγω bewahrt die mögliche stärkere Konkretheit, ohne sie in den Haupttext zu erzwingen.
