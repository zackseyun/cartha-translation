id: JHN.6.54
reference: John 6:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: de
  text: Wer mein Fleisch isst[a] und mein Blut trinkt, hat ewiges Leben, und ich werde ihn am letzten Tag auferwecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sich von meinem Fleisch ernährt“; anschaulicher: „mein Fleisch kaut“. Das griechische Verb τρώγω ist konkreter als ein allgemeines Wort für Essen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ihn am letzten Tag auferstehen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Wer … isst
  rationale: Der Artikel mit dem substantivierten Präsenspartizip bezeichnet einen Menschen, der durch diese Handlung gekennzeichnet ist. „Wer … isst“ gibt die allgemeine, personenbezogene Aussage im heutigen Deutsch natürlich wieder.
- source_word: τρώγων
  choice: isst
  rationale: τρώγω ist ein konkretes Wort für das Essen und kann anschaulich auch das Kauen oder Verzehren bezeichnen. „Isst“ ist im Haupttext klar und natürlich; die stärkere Bildhaftigkeit wird in einer Fußnote bewahrt.
- source_word: μου τὴν σάρκα
  choice: mein Fleisch
  rationale: σάρξ wird konkret und unverändert mit „Fleisch“ wiedergegeben; „Körper“ würde die auffällige Wortwahl abschwächen.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: und mein Blut trinkt
  rationale: Die koordinierte Form wird parallel zu „isst“ wiedergegeben. „Blut“ bleibt bewusst wörtlich und ungemildert.
- source_word: ἔχει
  choice: hat
  rationale: Das Präsens bezeichnet den gegenwärtigen Besitz ewigen Lebens; das schlichte „hat“ entspricht dem unmittelbar.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: „Ewiges Leben“ ist die geläufige und im johanneischen Zusammenhang sachgerechte Wiedergabe, die sowohl Dauer als auch endzeitliche Lebensqualität ausdrücken kann.
- source_word: κἀγὼ
  choice: und ich
  rationale: Die Verbindung aus καί und ἐγώ wird knapp wiedergegeben; das ausdrücklich gesetzte „ich“ bewahrt die Betonung.
- source_word: ἀναστήσω αὐτόν
  choice: ich werde ihn … auferwecken
  rationale: Im Auferstehungszusammenhang ist „auferwecken“ die natürliche transitive Wiedergabe. „Ihn“ nimmt den einzelnen Menschen auf, der zuvor durch „wer“ bezeichnet wurde.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: Dies ist die natürliche deutsche Form der festen johanneischen Endzeitformulierung.
theological_decisions:
- issue: Deutung des Essens und Trinkens als sakramental oder metaphorisch
  choice: Die konkrete Sprache von Fleischessen und Bluttrinken bleibt im Haupttext stehen.
  alternative: Die Aussage ausdrücklich auf das Abendmahl oder ausdrücklich auf den Glauben deuten.
  rationale: Der griechische Text selbst formuliert konkret, legt hier aber keine konfessionelle Auslegung ausdrücklich fest. Die wörtliche Wiedergabe bewahrt die theologische Spannung.
- issue: Wiedergabe des maskulinen Singularpronomens αὐτόν
  choice: ihn
  alternative: diesen Menschen
  rationale: „Ihn“ bewahrt den grammatischen Singular und nimmt im Deutschen das indefinite „wer“ natürlich wieder auf, ohne die Aussage in den Plural zu verschieben.
- issue: Verhältnis von gegenwärtigem ewigen Leben und künftiger Auferweckung
  choice: 'Beide Zeitperspektiven werden unverändert nebeneinandergestellt: „hat“ und „werde … auferwecken“.'
  alternative: Das ewige Leben ausschließlich als gegenwärtig oder ausschließlich als zukünftig erläutern.
  rationale: Der Vers verbindet ausdrücklich gegenwärtigen Besitz mit künftiger Auferweckung; diese Spannung darf die Übersetzung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und allgemein verständlich; die anstößig-konkreten Wörter „Fleisch“ und „Blut“ werden nicht abgeschwächt. „Wer“ vermeidet die schwerfällige Form „Derjenige, der“, während „ihn“ den Singular des griechischen Rückbezugs wahrt.
