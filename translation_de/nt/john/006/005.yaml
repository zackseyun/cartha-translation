id: JHN.6.5
reference: John 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: de
  text: 'Jesus blickte nun auf und sah, dass eine große Menschenmenge[a] auf ihn zukam. Da sagte er zu Philippus: »Wo[b] sollen wir Brot[c] kaufen, damit diese Leute essen können?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine zahlreiche Menge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Woher sollen wir …?“'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann Brot allgemein oder einzelne Brote beziehungsweise Laibe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας … τοὺς ὀφθαλμούς
  choice: blickte … auf
  rationale: Die idiomatische Wendung bedeutet, die Augen zu erheben bzw. aufzublicken. „Blickte auf“ ist im modernen Deutsch natürlich und bewahrt die Blickbewegung.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet den Fortgang der Erzählung, ohne einen stärkeren logischen Schluss zu behaupten, als der Zusammenhang verlangt.
- source_word: θεασάμενος
  choice: sah
  rationale: Das Partizip bezeichnet bewusstes Wahrnehmen. „Sah“ ist klar und lässt sich in natürlicher deutscher Erzählfolge mit dem vorausgehenden Aufblicken verbinden.
- source_word: πολὺς ὄχλος
  choice: eine große Menschenmenge
  rationale: Die Wendung bezeichnet eine große Anzahl versammelter Menschen. „Menschenmenge“ ist eindeutig und gegenwärtig verständlich.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: auf ihn zukam
  rationale: Die Verlaufsform gibt die im Gang befindliche Bewegung wieder; „auf ihn zu“ bewahrt die Richtungsangabe von πρός.
- source_word: λέγει πρὸς Φίλιππον
  choice: sagte er zu Philippus
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben; πρός kennzeichnet den Angesprochenen.
- source_word: Πόθεν
  choice: Wo
  rationale: Im Deutschen fragt man beim Kaufen idiomatisch „Wo sollen wir … kaufen?“. Die wörtlichere Herkunftsfrage „Woher“ bleibt in einer Fußnote erhalten.
- source_word: ἀγοράσωμεν
  choice: sollen wir … kaufen
  rationale: Der Konjunktiv in der überlegenden Frage wird natürlich mit „sollen wir“ ausgedrückt; „kaufen“ ist die direkte moderne Entsprechung.
- source_word: ἄρτους
  choice: Brot
  rationale: ἄρτος kann Brot als Nahrung oder einzelne Brote bzw. Laibe bezeichnen. „Brot“ passt hier als Sammelbegriff, ohne die mögliche Zählbarkeit zu leugnen.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: damit diese Leute essen können
  rationale: „Damit“ bewahrt den Zwecksinn von ἵνα. „Diese Leute“ macht den demonstrativen Bezug auf die anwesende Menge im Deutschen natürlich deutlich; „essen können“ drückt die beabsichtigte Ermöglichung idiomatisch aus.
theological_decisions:
- issue: Historisches Präsens und Abfolge der Partizipien
  choice: 'Vergangenheitsform in natürlicher deutscher Erzählfolge: „blickte … auf und sah … sagte“'
  alternative: 'Formnäher: „Nachdem Jesus nun die Augen erhoben und gesehen hatte …, sagt er …“'
  rationale: Die gewählte Fassung verändert keine theologische Aussage, sondern gibt die griechische Handlungsfolge in flüssigem modernem Deutsch wieder.
- issue: Zwecksatz ἵνα φάγωσιν
  choice: „damit diese Leute essen können“
  alternative: „damit diese Leute essen“
  rationale: Die Fassung versteht den Zweck als Ermöglichung der Mahlzeit, ohne eine weitergehende Aussage über Willen, Fähigkeit oder Heilsbedeutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wurde gegenüber der griechischen Partizipialkonstruktion behutsam geglättet. „Philippus“ folgt der im Deutschen etablierten biblischen Namensform.
