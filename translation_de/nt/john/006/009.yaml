source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: de
  text: Hier ist ein Junge, der fünf Gerstenbrote und zwei Fische hat; aber was ist das für so viele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was können diese für so viele ausrichten?“'
    reason: Die griechische Frage kann neben der knappen wörtlichen Formulierung wertend ausdrücken, dass die vorhandene Menge für die große Zahl unzureichend ist.
lexical_decisions:
- source_word: παιδάριον
  choice: Junge
  rationale: Das Wort bezeichnet ein Kind beziehungsweise einen jungen Knaben. „Junge“ ist im modernen Deutsch natürlich und legt weder ein besonders geringes Alter noch eine genaue Altersstufe fest.
- source_word: ὧδε
  choice: hier
  rationale: Das örtliche Adverb wird knapp und unmittelbar mit „hier“ wiedergegeben.
- source_word: ὃς ἔχει
  choice: der … hat
  rationale: Der Relativsatz kennzeichnet den Jungen durch die Lebensmittel, die er bei sich hat; die deutsche Formulierung ist natürlich und quellennah.
- source_word: ἄρτους κριθίνους
  choice: Gerstenbrote
  rationale: ἄρτοι bezeichnet Brote beziehungsweise Brotlaibe, κριθίνοις bestimmt sie als aus Gerste hergestellt. „Gerstenbrote“ ist präzise und idiomatisch.
- source_word: ὀψάρια
  choice: Fische
  rationale: Im Zusammenhang sind damit Fische als Speise zum Brot gemeint. Das mögliche Moment kleiner Fische wird nicht ausdrücklich ergänzt, da es lexikalisch nicht sicher genug ist.
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die Konjunktion leitet den Gegensatz zwischen dem vorhandenen Essen und der großen Menschenmenge ein.
- source_word: ταῦτα τί ἐστιν
  choice: was ist das
  rationale: Das griechische neutrale Pluralpronomen steht idiomatisch mit einem Verb im Singular. Im Deutschen fasst „das“ die genannten Lebensmittel als vorhandene Menge zusammen und bewahrt die rhetorische Frage.
- source_word: εἰς τοσούτους
  choice: für so viele
  rationale: Die Wendung fragt nach der Zulänglichkeit der Lebensmittel angesichts der großen Zahl von Menschen; „für so viele“ gibt dies knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und direktem Erzählton. Die rhetorische Knappheit und die Spannung zwischen der kleinen vorhandenen Menge und der großen Menschenmenge bleiben erhalten.
