  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: de
  text: Denn ich bin vom Himmel herabgekommen, nicht um meinen eigenen Willen zu tun, sondern den Willen dessen, der mich gesandt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorausgehende Aussage. „Denn“ gibt diese erklärend-kausale Funktion im Deutschen natürlich und prägnant wieder.
- source_word: καταβέβηκα
  choice: ich bin … herabgekommen
  rationale: Das Perfekt bezeichnet ein vollendetes Herabkommen mit fortdauernder Gegenwartsbedeutung. Das deutsche Perfekt ist hier idiomatisch und bewahrt diesen Aspekt besser als ein bloßes Präteritum.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Wendung gibt den Ausgangspunkt des Herabkommens räumlich und mit der im Johannesevangelium wichtigen Aussage über Jesu himmlische Herkunft wieder.
- source_word: οὐχ ἵνα ποιῶ
  choice: nicht um … zu tun
  rationale: οὐχ ἵνα drückt einen verneinten Zweck aus. Die deutsche Infinitivkonstruktion ist natürlich und erhält den finalen Sinn.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: meinen eigenen Willen
  rationale: „Willen“ wahrt den persönlichen und theologischen Gehalt von θέλημα; „eigenen“ bildet die betonte possessive Form und den Gegensatz zur folgenden Wendung ab.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung ist „sondern“ im Deutschen die genaue und natürliche adversative Entsprechung und hebt den Gegensatz der beiden Zwecke hervor.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: den Willen dessen, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird als Relativsatz klar wiedergegeben, ohne die sendende Person über den Wortlaut dieses Verses hinaus ausdrücklich zu benennen.
theological_decisions:
- issue: Jesu Herabkommen vom Himmel
  choice: Die Aussage wird unmittelbar als „vom Himmel herabgekommen“ wiedergegeben.
  alternative: Die Formulierung lediglich als bildliche Aussage über eine göttliche Beauftragung abschwächen.
  rationale: Der griechische Text formuliert Jesu Herkunft räumlich als Herabkommen vom Himmel. Die Übersetzung bewahrt diese christologische Aussage, ohne zusätzliche dogmatische Erläuterung einzufügen.
- issue: Verhältnis zwischen Jesu Willen und dem Willen dessen, der ihn gesandt hat
  choice: „Willen“ wird in beiden Satzgliedern beibehalten und der Gegensatz formal gewahrt.
  alternative: Dynamisch mit „was ich will“ und „was er will“ übersetzen oder den Gegensatz erklärend harmonisieren.
  rationale: Die parallele Wiedergabe erhält die im Text erkennbare Unterscheidung und die Spannung von Sendung und Gehorsam, ohne sie durch spätere theologische Kategorien aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Parallelismus, klingt aber natürlich. „Dessen, der“ ist leicht gehoben, hier jedoch präzise und gut verständlich; es vermeidet eine über den unmittelbaren Wortlaut hinausgehende ausdrückliche Identifizierung des Sendenden.
