id: JHN.6.22
reference: John 6:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: de
  text: Am nächsten Tag sah die Menschenmenge, die sich auf der anderen Seite des Sees aufhielt, dass dort nur ein einziges kleines Boot[a] gewesen war und dass Jesus nicht mit seinen Jüngern in das Boot[b] gestiegen war, sondern nur seine Jünger fortgegangen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Boot“. Das griechische Wort πλοιάριον ist der Form nach eine Verkleinerungsform.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften und Textausgaben schwanken in diesem Vers zwischen „kleines Boot“ (πλοιάριον) und „Boot“ (πλοῖον). Die Übersetzung folgt in den jeweiligen Satzteilen dem gedruckten griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die temporale Dativwendung wird im modernen Standarddeutsch idiomatisch und präzise wiedergegeben.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: die Menschenmenge, die … geblieben war
  rationale: Das Perfektpartizip bezeichnet hier den fortbestehenden Aufenthalt der Menge; „geblieben war“ klingt natürlicher als eine wörtliche Wiedergabe mit „gestanden“.
- source_word: πέραν τῆς θαλάσσης
  choice: auf der anderen Seite des Sees
  rationale: Die Wendung bezeichnet den Standort jenseits des Gewässers; „See“ entspricht im johanneischen Kontext dem See von Galiläa und ist im Deutschen natürlich.
- source_word: εἶδον
  choice: sah
  rationale: Das Verb behält seine gewöhnliche Wahrnehmungsbedeutung; die folgenden ὅτι-Sätze nennen den Inhalt der Wahrnehmung.
- source_word: πλοιάριον
  choice: kleines Boot
  rationale: Die Diminutivform wird in der ersten Erwähnung durch „kleines Boot“ sichtbar gemacht.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: dass außer einem einzigen kleinen Boot kein anderes dort gewesen war
  rationale: Die Formulierung bewahrt die ausschließende Konstruktion und den rückblickenden zeitlichen Zusammenhang.
- source_word: συνεισῆλθεν
  choice: nicht mit seinen Jüngern … gestiegen war
  rationale: Im Zusammenhang mit einem Boot bedeutet das zusammengesetzte Verb, gemeinsam mit anderen hineinzugehen; „in das Boot gestiegen“ ist idiomatisches Deutsch.
- source_word: εἰς τὸ πλοῖον
  choice: in das Boot
  rationale: πλοῖον ist die nicht-diminutive Bezeichnung; „Boot“ bildet den Unterschied zu πλοιάριον in der ersten Klausel ab.
- source_word: μόνοι
  choice: allein
  rationale: Das Wort betont, dass die Jünger ohne Jesus abfuhren, ohne diese Folgerung zusätzlich auszuschreiben.
- source_word: ἀπῆλθον
  choice: weggefahren waren
  rationale: Bei einer Abreise im Boot ist „weggefahren“ im Deutschen natürlicher und kontextuell genauer als das allgemeinere „weggegangen“.
