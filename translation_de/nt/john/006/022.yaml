revisions:
- from: Am nächsten Tag sah die Menschenmenge, die auf der anderen Seite des Sees geblieben war, dass außer einem einzigen kleinen Boot[a] kein anderes dort gewesen war und dass Jesus nicht mit seinen Jüngern in das Boot[b] gestiegen war, sondern seine Jünger allein weggefahren waren.
  to: Am nächsten Tag sah die Menschenmenge, die sich auf der anderen Seite des Sees aufhielt, dass dort nur ein einziges kleines Boot[a] gewesen war und dass Jesus nicht mit seinen Jüngern in das Boot[b] gestiegen war, sondern nur seine Jünger fortgegangen waren.
  rationale: Die Revision ersetzt die semantisch zu starke Aussage „geblieben war“ durch eine genaue, natürliche Umschreibung des Perfektpartizips. Sie formuliert die Exklusivaussage zum Boot klarer und gibt ἀπῆλθον ohne die zusätzliche Spezifizierung einer Fahrt wieder. Die Fußnoten und die begründete Unterscheidung zwischen πλοιάριον und πλοῖον bleiben erhalten.
