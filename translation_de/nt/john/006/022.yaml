  timestamp: '2026-07-14T23:50:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den zeitlichen Rahmen, den Standort jenseits des Sees, die beiden von ὅτι abhängigen Wahrnehmungsinhalte sowie den Kontrast zwischen Jesus und den allein abfahrenden Jüngern grundsätzlich zutreffend wieder. „Geblieben war“ ist jedoch stärker als ὁ ἑστηκώς: Das Perfektpartizip beschreibt ihren fortdauernden Aufenthalt bzw. ihr Dortsein, nicht ausdrücklich, dass sie zurückgeblieben waren. „Weggefahren“ ist im Bootskontext möglich, doch „fortgefahren“/„weggefahren“ konkretisiert ἀπῆλθον stärker als nötig.'
  naturalness: Der Satz ist insgesamt modernes, gut lesbares Standarddeutsch. „Die Menschenmenge, die ... geblieben war“ klingt zwar idiomatisch, verschiebt aber die Aussage. „die sich ... aufhielt“ ist sowohl natürlich als auch genauer. Die Formulierung „außer einem einzigen kleinen Boot kein anderes“ ist verständlich, aber unnötig verschachtelt; „dort nur ein einziges kleines Boot gewesen war“ ist klarer.
  terminology: „Menschenmenge“, „See“, „kleines Boot“ und „Boot“ sind angemessen. Die Unterscheidung von πλοιάριον und πλοῖον bleibt erhalten. „Nur seine Jünger“ gibt μόνοι idiomatisch wieder und verdeutlicht den Kontrast, ohne eine zusätzliche theologische Deutung einzutragen.
  issues:
  - severity: medium
    issue: „geblieben war“ für ὁ ἑστηκώς
    rationale: Das Wort bezeichnet eine bestehende Lage bzw. einen fortdauernden Aufenthalt („stand“, „hielt sich auf“). „Geblieben“ kann zusätzlich nahelegen, dass die Menge bewusst zurückgeblieben sei; dies steht nicht im griechischen Text.
  - severity: low
    issue: „weggefahren waren“ für ἀπῆλθον
    rationale: Das Verb bedeutet allgemein „weggingen/fortgingen“. Der Kontext lässt eine Fahrt im Boot erkennen, doch eine weniger spezifizierende Wiedergabe bewahrt die Lexik besser.
