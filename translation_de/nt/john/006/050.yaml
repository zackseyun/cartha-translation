id: JHN.6.50
reference: John 6:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: de
  text: Dies ist das Brot, das vom Himmel herabkommt, damit jemand davon isst und nicht stirbt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „nicht stirbt“ bleibt bewusst offen; im Zusammenhang kann sie auf den endgültigen Tod, den geistlichen Tod oder das endzeitliche Verderben bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Dies
  rationale: Das Demonstrativpronomen weist unmittelbar auf das Brot, das Jesus hier bestimmt; „Dies“ ist im Deutschen natürlich und prägnant.
- source_word: ἄρτος
  choice: Brot
  rationale: „Brot“ ist die direkte und im Zusammenhang tragfähige Wiedergabe; sie bewahrt sowohl die konkrete als auch die bildhafte Bedeutung.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: das vom Himmel herabkommt
  rationale: Der attributive Präsenspartizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben. „Herabkommt“ erhält die räumliche Bewegung und den präsentischen Charakter.
- source_word: οὐρανός
  choice: Himmel
  rationale: Im johanneischen Zusammenhang ist die himmlische, göttliche Sphäre gemeint, nicht bloß der sichtbare Himmel.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Folgebeziehung idiomatisch wieder, ohne sie unnötig festzulegen.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen bezeichnet allgemein eine beliebige Person. „Jemand“ folgt der griechischen Form enger als eine ausdrücklich universalisierende Wiedergabe.
- source_word: ἐξ αὐτοῦ
  choice: davon
  rationale: In Verbindung mit „essen“ ist „davon“ eine natürliche deutsche Wiedergabe von ἐξ αὐτοῦ und wahrt den Bezug auf das Brot.
- source_word: φάγῃ
  choice: isst
  rationale: Der Aorist Konjunktiv innerhalb des ἵνα-Satzes wird im Deutschen idiomatisch mit Präsens wiedergegeben; die konjunktivische Abhängigkeit wird bereits durch „damit“ ausgedrückt.
- source_word: μὴ ἀποθάνῃ
  choice: und nicht stirbt
  rationale: „Sterben“ entspricht dem Grundsinn von ἀποθνῄσκω. Die schlichte Formulierung lässt offen, in welchem Sinn der Tod gemeint ist.
theological_decisions:
- issue: Art des Todes in „nicht stirbt“
  choice: Die allgemeine Formulierung „nicht stirbt“ bleibt ohne nähere Bestimmung stehen.
  alternative: „nicht geistlich stirbt“ oder „nicht ewig verloren geht“
  rationale: Der Vers selbst legt nicht ausdrücklich fest, ob körperlicher, geistlicher oder endgültiger eschatologischer Tod gemeint ist. Die offene Formulierung bewahrt die johanneische Spannung.
- issue: Zeitlicher Aspekt des Herabkommens
  choice: „das vom Himmel herabkommt“
  alternative: „das vom Himmel herabgekommen ist“
  rationale: Das griechische Präsenspartizip καταβαίνων stellt das Herabkommen präsentisch beziehungsweise charakterisierend dar; ein deutsches Perfekt würde es stärker als abgeschlossen deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Relativsatz bildet die griechische Partizipialkonstruktion natürlich ab. Die Wortstellung bleibt klar und mündlich verständlich; interpretierende Zusätze werden vermieden.
