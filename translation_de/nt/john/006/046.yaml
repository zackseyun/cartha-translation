source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: de
  text: Nicht, dass jemand den Vater gesehen hat, außer dem, der von Gott ist; dieser hat den Vater gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus der Gegenwart Gottes« oder »bei Gott«. Die griechische Wendung kann neben der Herkunft auch persönliche Nähe ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Nicht als hätte
  rationale: Leitet eine klarstellende Einschränkung ein, nicht eine Begründung. Die deutsche Wendung gibt den korrigierenden Sinn natürlich wieder.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Entspricht dem johanneischen Gebrauch als Bezeichnung Gottes, ohne zusätzliche Deutung einzutragen.
- source_word: ἑώρακέν τις
  choice: jemand ... gesehen hätte
  rationale: Im verneinten Satz ist »jemand« idiomatisches Deutsch. Das Perfekt von ὁράω bezeichnet ein vollzogenes Sehen mit bleibender Bedeutung; durch die Konstruktion mit »als hätte« wird es im Deutschen als Konjunktiv II wiedergegeben.
- source_word: εἰ μὴ
  choice: außer
  rationale: Kennzeichnet hier eine Ausnahme, keine Bedingung.
- source_word: ὁ ὢν
  choice: dem, der ... ist
  rationale: Bewahrt den substantivierten Präsenspartizip und damit die bezeichnete fortdauernde Beziehung beziehungsweise Herkunft.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv kann Herkunft oder Ausgangspunkt bezeichnen. »Von Gott« ist im Haupttext natürlich und lässt die genaue Art der Beziehung offen; die mögliche räumlich-persönliche Nuance wird in der Fußnote genannt.
- source_word: οὗτος
  choice: Dieser
  rationale: Gibt den nachdrücklichen Rückverweis auf die zuvor bezeichnete Person deutlicher wieder als ein bloßes »er«.
- source_word: ἑώρακεν
  choice: hat ... gesehen
  rationale: Das deutsche Perfekt gibt die vollzogene Handlung mit fortbestehender Bedeutung angemessen wieder.
theological_decisions:
- issue: Beziehung des Bezeichneten zu Gott in παρὰ τοῦ θεοῦ
  choice: von Gott
  alternative: aus der Gegenwart Gottes; bei Gott
  rationale: Der Haupttext wahrt die Aussage einer einzigartigen Herkunft beziehungsweise Beziehung, ohne deren metaphysische oder räumliche Dimension genauer festzulegen, als es die griechische Präpositionalphrase selbst tut. Die mögliche persönliche Nähe bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die Ausnahme klar erkennbar. »Nicht als hätte« ist idiomatisch und bewahrt den klarstellenden, nicht kausalen Charakter des griechischen Satzanfangs.
