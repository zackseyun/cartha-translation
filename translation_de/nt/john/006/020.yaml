  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: »Ich bin es[a]. Habt keine Angst!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich bin.« Im Johannesevangelium kann diese Wendung eine einfache Selbstidentifikation ausdrücken und zugleich weiterreichende theologische Anklänge haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Doch er
  rationale: δέ markiert hier eine leichte Gegenbewegung zur Angst der Jünger; der substantivierte Artikel ὁ verweist pronominal auf Jesus. »Doch er« gibt den Übergang natürlich wieder, ohne ihn zu verstärken.
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Die Form ist ein Dativ Plural; der Kontext, nicht der Vers selbst, bestimmt die Angesprochenen als die Jünger.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Zusammenhang dient die Wendung der Selbstidentifikation und Beruhigung. »Ich bin es« ist im Deutschen idiomatisch, während die wörtlichere Wiedergabe »Ich bin« wegen möglicher johanneischer Tiefenbezüge in der Fußnote erhalten bleibt.
- source_word: μὴ φοβεῖσθε
  choice: Habt keine Angst!
  rationale: Die verneinte Präsensimperativform bezeichnet hier ein Verbot beziehungsweise eine Aufforderung, die Angst abzulegen. Die gewählte Form ist natürliches, modernes Deutsch.
theological_decisions:
- issue: Ob Ἐγώ εἰμι nur als Selbstidentifikation oder als »Ich bin« mit möglichem theologischem Anklang wiederzugeben ist
  choice: 'Im Haupttext: »Ich bin es.«'
  alternative: »Ich bin.«
  rationale: Der Erzählzusammenhang verlangt zunächst eine beruhigende Selbstidentifikation Jesu. Zugleich kann die Wendung im Johannesevangelium weiterreichende theologische Anklänge tragen. Die Fußnote bewahrt diese Spannung, ohne sie im Haupttext einseitig festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Erzählton. Die Anrede im Plural und die Zeichensetzung machen Jesu beruhigende Worte klar erkennbar.
