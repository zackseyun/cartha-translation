  source_fidelity: Der Wortlaut gibt εἶπον οὖν πρὸς αὐτόν, Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον vollständig und in angemessener Reihenfolge wieder. »Da« ist für οὖν als anschließende Folgerung vertretbar; »Herr« wahrt die Spannweite von Κύριε, und die Fußnote dokumentiert die mögliche höfliche Anrede. Das Ausrufezeichen ist im griechischen Text jedoch nicht markiert und kann die Bitte stärker akzentuieren, als der Wortlaut verlangt.
