  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Herr[a], gib uns immer dieses Brot.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn einer höflichen Anrede: »Mein Herr«. Das griechische Wort kann sowohl eine respektvolle Anrede als auch den Titel »Herr« bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: sagten sie
  rationale: Der Aorist von λέγω wird im erzählenden Dialog natürlich mit »sagten sie« wiedergegeben.
- source_word: οὖν
  choice: Da
  rationale: »Da« stellt in natürlichem Deutsch den folgernden Anschluss an Jesu vorausgehende Worte her, ohne das stärkere »deshalb« aufzudrängen.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Bei einem Verb des Sprechens bezeichnet πρός mit Akkusativ den Angesprochenen.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die mögliche höfliche Anrede als auch den im Johannesevangelium anklingenden höheren christologischen Gehalt.
- source_word: πάντοτε
  choice: immer
  rationale: »Immer« gibt die zeitlich fortdauernde Bedeutung von πάντοτε klar und idiomatisch wieder.
- source_word: δὸς
  choice: gib
  rationale: Der Aoristimperativ von δίδωμι formuliert hier eine unmittelbare Bitte.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Empfänger der erbetenen Gabe.
- source_word: τὸν ἄρτον τοῦτον
  choice: dieses Brot
  rationale: »Dieses Brot« wahrt den demonstrativen Rückbezug auf das zuvor besprochene Brot.
theological_decisions:
- issue: Wiedergabe von κύριος als direkte Anrede Jesu
  choice: Herr
  alternative: Mein Herr / Herr im Sinn einer höflichen Anrede
  rationale: Die Anrede kann hier respektvoll gemeint sein, zugleich aber im literarischen Kontext mehr anklingen lassen. »Herr« erhält diese Offenheit; die Fußnote weist auf die höfliche Lesart hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Dialogton. Das Ausrufezeichen lässt die nachdrückliche Bitte erkennen, ohne zusätzliche Bedeutung einzutragen.
