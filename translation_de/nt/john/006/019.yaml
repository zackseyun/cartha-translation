id: JHN.6.19
reference: John 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: de
  text: Als sie nun etwa fünfundzwanzig oder dreißig Stadien[a] weit gerudert waren, sahen sie Jesus auf dem See[b] gehen und sich dem Boot nähern, und sie bekamen Angst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war ein antikes Längenmaß. Fünfundzwanzig oder dreißig Stadien entsprechen ungefähr fünf bis sechs Kilometern.
    reason: cultural_note
  - marker: b
    text: 'Oder: „auf dem Wasser“. Wörtlich steht im Griechischen: „auf dem See“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: gerudert waren
  rationale: ἐλαύνω bezeichnet im nautischen Zusammenhang das Fortbewegen eines Bootes durch Rudern. Das deutsche Plusquamperfekt gibt die vor dem Sehen bereits zurückgelegte Strecke natürlich wieder.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ wahrt den erzählerischen Anschluss und klingt im modernen Deutschen natürlicher als ein stark folgerndes „daher“.
- source_word: ὡς
  choice: etwa
  rationale: Vor einer Maßangabe kennzeichnet ὡς eine ungefähre Größenordnung.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: fünfundzwanzig oder dreißig Stadien
  rationale: Die antike Maßeinheit bleibt im Haupttext erhalten; eine moderne Näherungsangabe steht in der Fußnote.
- source_word: θεωροῦσιν
  choice: sahen sie
  rationale: Das schlichte „sahen“ gibt die Wahrnehmung in diesem Erzählzusammenhang klar und idiomatisch wieder; das historische Präsens wird für einen flüssigen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: auf dem See gehen
  rationale: „See“ entspricht θάλασσα im Kontext des Sees von Galiläa, und „auf dem See“ bewahrt die Aussage, dass Jesus auf dessen Oberfläche geht, ohne sie abzuschwächen.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: sich dem Boot nähern
  rationale: Die Verbindung von γίνομαι mit ἐγγύς bezeichnet das Gelangen in die Nähe; „sich nähern“ bringt diese Bewegung im Deutschen prägnant zum Ausdruck.
- source_word: πλοίου
  choice: Boot
  rationale: Im galiläischen Kontext bezeichnet πλοῖον ein Boot; „Schiff“ würde eher ein größeres Fahrzeug vermuten lassen.
- source_word: ἐφοβήθησαν
  choice: sie bekamen Angst
  rationale: Die Form bezeichnet die einsetzende Reaktion der Jünger. „Sie bekamen Angst“ ist natürlich und bildet den Eintritt der Furcht deutlicher ab als das statische „sie hatten Angst“.
theological_decisions:
- issue: Wiedergabe der Wunderbeschreibung ohne Abschwächung
  choice: auf dem See gehen
  alternative: am See entlanggehen / auf dem Wasser gehen
  rationale: ἐπί mit dem Genitiv bezeichnet hier im Erzählzusammenhang das Gehen auf dem See selbst. „Am See“ widerspräche der Situation weit vom Ufer; „auf dem Wasser“ gibt den Sinn treffend wieder, ersetzt aber das konkrete griechische Wort θάλασσα („See/Meer“). Die gewählte Form bewahrt den unmittelbaren Aussagegehalt und lässt die theologische Bedeutung des Geschehens unkommentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die antike Maßeinheit bleibt aus Quellennähe im Haupttext stehen und wird in der Fußnote erklärt. Die Satzstruktur folgt dem griechischen Ablauf, ohne im Deutschen schwerfällig zu wirken.
