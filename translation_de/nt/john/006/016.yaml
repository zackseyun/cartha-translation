  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: de
  text: Als es Abend wurde, gingen seine Jünger zum Meer hinunter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum See“. Gemeint ist der See Gennesaret, der geographisch ein Binnensee ist; im Griechischen steht jedoch „Meer“ (θάλασσα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als
  rationale: Die Verbindung leitet einen zeitlichen Übergang ein. Im Deutschen gibt „Als“ den temporalen Sinn natürlich wieder; die leichte fortführende Kraft von δέ ergibt sich aus dem Erzählzusammenhang.
- source_word: ὀψία ἐγένετο
  choice: es Abend wurde
  rationale: Die griechische Wendung bezeichnet den Eintritt des Abends. „Es Abend wurde“ ist idiomatisch und bleibt dem Ausdruck eng verbunden.
- source_word: κατέβησαν
  choice: gingen … hinunter
  rationale: καταβαίνω bezeichnet eine Bewegung nach unten. Die trennbare deutsche Verbform bewahrt diese räumliche Aussage natürlich.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Die griechische Artikel-Substantiv-Possessiv-Konstruktion wird im Deutschen natürlich mit einem Possessivartikel wiedergegeben.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: zum See
  rationale: ἐπί mit Akkusativ bezeichnet hier das Ziel der Bewegung. θάλασσα heißt grundsätzlich „Meer“, kann jedoch auch einen großen Binnensee bezeichnen; im modernen Deutschen ist „See“ für den See Gennesaret die natürliche geografische Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „zum See hinunter“ klingt natürlich und erhält sowohl das Bewegungsziel als auch die Abwärtsbewegung.
