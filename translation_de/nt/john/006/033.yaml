  to: Denn das Brot Gottes ist derjenige, der vom Himmel herabkommt und der Welt Leben gibt.[a]
  rationale: Die Revision beschränkt sich auf eine idiomatischere deutsche Formulierung des persönlichen Bezugs und eine stilistische Präzisierung der Fußnote. Sie verändert weder die Aussage noch die im griechischen Wortlaut vorhandene und in der englischen Auditspur dokumentierte Auslegungsambiguität.
