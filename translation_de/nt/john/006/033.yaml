review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des griechischen Textes zutreffend wieder: γάρ mit „Denn“, ἄρτος τοῦ θεοῦ mit „Brot Gottes“, die Herkunft „vom Himmel“, ζωὴ mit „Leben“ und κόσμος mit „Welt“. Die persönliche Wiedergabe der maskulinen articularen Partizipien ist gut begründet; die Fußnote erhält die mögliche unpersönliche Auffassung.'
  naturalness: „Das Brot Gottes ist der, der …“ ist zwar verständlich, wirkt im modernen Standarddeutsch wegen der unmittelbaren Gegenüberstellung eines sächlichen Subjekts mit „der, der“ jedoch unnötig sperrig. „Derjenige, der …“ bewahrt den persönlichen maskulinen Bezug und ist deutlich idiomatischer.
  terminology: „Brot Gottes“, „Himmel“, „Leben“ und „Welt“ sind treffende, konsistente und theologisch nicht einengende Wiedergaben. „Herabkommt“ gibt καταβαίνων angemessen wieder. Die Anmerkung sollte idiomatischer von einem „persönlichen Bezug“ sprechen statt von „einer Person als Bezug“.
  issues:
  - severity: low
    issue: Unidiomatische Prädikatsformulierung „ist der, der“
    rationale: Die Form ist strukturell nachvollziehbar, klingt aber im Deutschen holprig. „Ist derjenige, der“ überträgt die maskuline, persönliche Form des griechischen Partizips klar und natürlich.
  - severity: low
    issue: 'Unnatürliche Formulierung in der Fußnote: „für eine Person als Bezug“'
    rationale: „Für einen persönlichen Bezug“ ist idiomatisches modernes Deutsch und beschreibt die grammatische Beobachtung präziser, ohne die Auslegung zu überziehen.
