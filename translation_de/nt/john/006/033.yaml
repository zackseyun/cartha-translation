  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: de
  text: Denn das Brot Gottes ist derjenige, der vom Himmel herabkommt und der Welt Leben gibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das, was vom Himmel herabkommt und der Welt Leben gibt«. Der griechische Wortlaut kann unpersönlicher verstanden werden; die maskulinen Partizipien sprechen jedoch eher für einen persönlichen Bezug.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: Brot
  rationale: Die konkrete Grundbedeutung bleibt erhalten, weil die Bildsprache des gesamten Abschnitts auf »Brot« beruht.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv bewahrt die Offenheit des griechischen Genitivs zwischen Zugehörigkeit und Herkunft.
- source_word: ὁ καταβαίνων
  choice: der, der … herabkommt
  rationale: Der substantivierte maskuline Partizipialausdruck legt einen persönlichen Bezug nahe; die finite Form ist im modernen Deutsch natürlich und wahrt den durativen Charakter.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Dies ist die natürliche deutsche Wiedergabe der Herkunftsangabe mit ἐκ.
- source_word: ζωὴν
  choice: Leben
  rationale: Der zentrale johanneische Begriff bleibt schlicht und prägnant erhalten.
- source_word: διδοὺς
  choice: gibt
  rationale: Die finite Wiedergabe verbindet die beiden kennzeichnenden Handlungen idiomatisch und erhält den gegenwärtigen, charakteristischen Sinn.
- source_word: τῷ κόσμῳ
  choice: der Welt
  rationale: »Welt« bewahrt die johanneische Begrifflichkeit und vermeidet eine vorschnelle Einschränkung auf eine bestimmte Personengruppe.
- source_word: γὰρ
  choice: Denn
  rationale: »Denn« macht den begründenden beziehungsweise erläuternden Anschluss an den vorherigen Satz deutlich.
theological_decisions:
- issue: Persönlicher oder unpersönlicher Bezug von ὁ καταβαίνων … καὶ ζωὴν διδοὺς
  choice: 'Persönliche Wiedergabe: »der, der vom Himmel herabkommt und der Welt Leben gibt«'
  alternative: 'Unpersönlich: »das, was vom Himmel herabkommt und der Welt Leben gibt«'
  rationale: Die maskulinen singularischen Partizipien sprechen grammatisch für einen persönlichen Bezug und bereiten im Kontext Jesu Selbstbezeichnung vor. Die Fußnote wahrt dennoch die mögliche unpersönlichere Auffassung.
- issue: Bedeutungsumfang von κόσμος
  choice: »Welt«
  alternative: »Menschheit« oder »alle Menschen«
  rationale: »Welt« erhält die Weite und theologische Spannung des griechischen Ausdrucks, ohne Fragen nach Umfang oder Aneignung des Lebens vorzeitig zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Herabkommt« entspricht dem vertikalen Bild des griechischen Verbs und klingt in diesem theologischen Zusammenhang natürlich. Die Formulierung »der, der« ist bewusst gewählt, um den persönlichen Bezug klar auszudrücken, ohne den Vers auszudeuten.
