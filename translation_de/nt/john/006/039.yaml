id: JHN.6.39
reference: John 6:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: de
  text: 'Und das ist der Wille dessen, der mich gesandt hat: dass ich nichts von allem, was er mir gegeben hat, verliere, sondern es[a] am letzten Tag auferwecke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder persönlicher: „dass ich keinen von denen, die er mir gegeben hat, verliere, sondern sie am letzten Tag auferwecke“. Im Griechischen steht eine kollektive Form im neutralen Singular, wörtlich: „alles, was … es“.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: Wille
  rationale: „Wille“ ist hier die natürliche und theologisch nicht überbestimmte Wiedergabe für Gottes Absicht beziehungsweise Vorhaben.
- source_word: τοῦ πέμψαντός με
  choice: dessen, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird relational und verbal wiedergegeben; das Perfekt „gesandt hat“ ist im Deutschen idiomatisch.
- source_word: ἵνα
  choice: dass
  rationale: Nach „das ist der Wille“ führt „dass“ natürlich den Inhalt des Willens ein und lässt zugleich den Zielgedanken erkennen.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: alles, was er mir gegeben hat
  rationale: Die neutralen Singularformen πᾶν und ὃ werden formal als kollektives „alles, was“ bewahrt; der Perfekt δέδωκέν wird mit „gegeben hat“ wiedergegeben.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: nichts von allem … verliere
  rationale: Im Zusammenhang bedeutet ἀπόλλυμι „verlieren“. „Nichts von allem“ gibt die Negation und ἐξ αὐτοῦ idiomatisch wieder und wahrt den neutralen Kollektivbezug.
- source_word: ἀναστήσω αὐτό
  choice: es … auferwecke
  rationale: „Auferwecken“ bezeichnet im Deutschen klar die eschatologische Auferstehung; „es“ bewahrt den neutralen Singular αὐτό und seinen kollektiven Rückbezug.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: Dies ist die geläufige, präzise deutsche Wiedergabe der johanneischen eschatologischen Zeitangabe.
theological_decisions:
- issue: Soll der kollektiv-neutrale Gegenstand persönlich als Menschenmehrzahl wiedergegeben werden?
  choice: alles, was … es
  alternative: alle, die … sie
  rationale: Der griechische Text verwendet durchgehend neutrale Singularformen (πᾶν, ὃ, αὐτό). Die Hauptfassung bewahrt diese Form und löst den inhaltlich persönlichen Bezug nicht stillschweigend auf; die persönlichere Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken; die kollektive Singularform wird bewusst erhalten.
