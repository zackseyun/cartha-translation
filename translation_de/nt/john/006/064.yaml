id: JHN.6.64
reference: John 6:64
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: de
  text: Doch einige von euch glauben nicht. Denn Jesus wusste von Anfang an, wer nicht glaubte und wer ihn ausliefern[a] würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verraten“. Wörtlicher: „übergeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Zusammenhang natürlich und würdevoll.
- source_word: ἐξ ὑμῶν τινες
  choice: einige von euch
  rationale: Gibt die Zugehörigkeit eines nicht näher bestimmten Teils der angesprochenen Gruppe idiomatisch wieder.
- source_word: οἳ οὐ πιστεύουσιν
  choice: glauben nicht
  rationale: Das deutsche Präsens bewahrt den gegenwärtigen, fortdauernden Zustand des Nichtglaubens.
- source_word: ᾔδει
  choice: wusste
  rationale: Die Vergangenheitsform von οἶδα bezeichnet hier einen in der Vergangenheit bestehenden Wissenszustand.
- source_word: ἐξ ἀρχῆς
  choice: von Anfang an
  rationale: Bewahrt die zeitliche Aussage, ohne näher festzulegen, auf welchen Anfang sie sich bezieht.
- source_word: τίνες εἰσὶν οἱ μὴ πιστεύοντες
  choice: wer nicht glaubte
  rationale: Natürliches Deutsch für die substantivierte Partizipialkonstruktion; der Numerusunterschied ist bei interrogativem „wer“ im Deutschen idiomatisch und aus dem Kontext erschließbar.
- source_word: παραδώσων αὐτόν
  choice: ihn ausliefern würde
  rationale: „Ausliefern“ bewahrt die konkrete Grundbedeutung des Übergebens in fremde Gewalt und lässt zugleich den verräterischen Charakter im Erzählzusammenhang erkennen, ohne ihn lexikalisch festzuschreiben.
theological_decisions:
- issue: Bedeutung von πιστεύω als Reaktion der Jünger auf Jesus
  choice: glauben
  alternative: vertrauen
  rationale: „Glauben“ ist im johanneischen Sprachgebrauch breit genug für die sachliche und relationale Dimension und engt den Ausdruck nicht auf subjektives Vertrauen ein.
- issue: Wiedergabe von παραδίδωμι mit Bezug auf Judas
  choice: ausliefern
  alternative: verraten
  rationale: Das griechische Verb bezeichnet unmittelbar das Übergeben bzw. Ausliefern. Der Kontext macht den Verrat deutlich; die Übersetzung bewahrt jedoch die lexikalische Bildlichkeit und vermeidet, diese Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Wiederholung von „glauben“ folgt dem griechischen Text; „wer“ fasst die betreffende Personengruppe im Deutschen natürlich zusammen.
