  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: de
  text: Und wir haben geglaubt und erkannt, dass du der Heilige Gottes bist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »der Christus, der Sohn des lebendigen Gottes«.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »der Heilige von Gott«. Der griechische Genitiv kann eine Beziehung oder Herkunft ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen betont die Jünger als Gruppe. Im Deutschen wird diese Hervorhebung durch „wir“ nach „Und“ hinreichend natürlich wiedergegeben; „wir selbst“ wäre zu stark.
- source_word: πεπιστεύκαμεν
  choice: sind zum Glauben gekommen
  rationale: Das Perfekt bezeichnet einen eingetretenen Glauben mit fortdauernder Geltung. Die deutsche Wendung gibt sowohl den vorausgegangenen Vorgang als auch den gegenwärtigen Stand idiomatisch wieder.
- source_word: ἐγνώκαμεν
  choice: haben erkannt
  rationale: Das Perfekt von γινώσκω verbindet erlangte Erkenntnis mit ihrem bleibenden Ergebnis. „Haben erkannt“ bewahrt diese Bedeutung in natürlichem Deutsch.
- source_word: ὅτι
  choice: ':'
  rationale: Ein Doppelpunkt führt den Inhalt dessen, was geglaubt und erkannt wurde, im Deutschen klar und natürlich ein; inhaltlich entspricht er hier einem „dass“-Satz.
- source_word: ὁ ἅγιος
  choice: der Heilige
  rationale: Der substantivierte Ausdruck ist ein christologischer Titel und bezeichnet den in einzigartiger Weise für Gott Ausgesonderten. „Der Heilige“ ist würdig, verständlich und titelhaft.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv bewahrt die Weite des griechischen Genitivs, der Beziehung, Zugehörigkeit oder Herkunft ausdrücken kann, ohne eine Deutung vorschnell festzulegen.
theological_decisions:
- issue: Christologischer Titel in Johannes 6,69
  choice: der Heilige Gottes
  alternative: der von Gott kommende Heilige; der Christus, der Sohn des lebendigen Gottes
  rationale: Der SBLGNT bietet ὁ ἅγιος τοῦ θεοῦ. Der Titel wird unmittelbar übersetzt und weder mit Matthäus 16,16 harmonisiert noch durch eine spätere ausführlichere Lesart ersetzt. Der Genitiv „Gottes“ lässt die genaue Beziehung bewusst offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Perfektformen werden semantisch differenziert und dennoch flüssig wiedergegeben. Der Doppelpunkt vermeidet einen schwerfälligen dass-Satz; die Fußnotenmarker stehen unmittelbar nach dem betroffenen Titel.
