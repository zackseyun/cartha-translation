  naturalness: »Und wir haben geglaubt und erkannt, dass du der Heilige Gottes bist« ist modernes, würdiges und idiomatisches Standarddeutsch. Der dass-Satz bildet die mit ὅτι eingeleitete Inhaltsaussage unmittelbar ab.
