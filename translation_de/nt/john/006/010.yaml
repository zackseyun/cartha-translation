source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: de
  text: 'Jesus sagte: »Sorgt dafür, dass die Leute sich setzen.«[a] An diesem Ort gab es viel Gras. Da setzten sich die Männer, etwa fünftausend an der Zahl.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sorgt dafür, dass die Leute sich lagern.« Das griechische Verb kann das Niederlassen oder Lagern zu einer Mahlzeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht zuerst die allgemeine Bezeichnung »Leute« (ἄνθρωποι), später jedoch »Männer« (ἄνδρες). Die ungefähre Zahl von fünftausend bezieht sich daher ausdrücklich auf die Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε ... ἀναπεσεῖν
  choice: Sorgt dafür, dass ... sich setzen
  rationale: Die Verbindung des Imperativs von ποιέω mit dem Infinitiv drückt Veranlassung aus. Die gewählte Formulierung ist im modernen Deutsch natürlich und bewahrt den Aufforderungscharakter.
- source_word: τοὺς ἀνθρώπους
  choice: die Leute
  rationale: ἄνθρωποι bezeichnet hier allgemein die Menschen der versammelten Menge und ist vom späteren, männlich spezifischen ἄνδρες zu unterscheiden.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: sich setzen / setzten sich
  rationale: ἀναπίπτω kann besonders bei einer Mahlzeit das Sich-Niederlassen oder Sich-Lagern bezeichnen. Im natürlichen modernen Deutsch gibt „sich setzen“ die Handlung im Freien angemessen wieder; die kulturell nähere Alternative wird in der Fußnote genannt.
- source_word: χόρτος πολὺς
  choice: viel Gras
  rationale: Die schlichte und quellennahe Wiedergabe erhält sowohl die Bedeutung von χόρτος als auch die Mengenangabe πολὺς.
- source_word: ἐν τῷ τόπῳ
  choice: an diesem Ort
  rationale: Die Wendung gibt die Ortsangabe ausdrücklich und in idiomatischem Deutsch wieder.
- source_word: οἱ ἄνδρες
  choice: die Männer
  rationale: ἀνήρ bezeichnet hier Männer und unterscheidet sich bewusst vom zuvor gebrauchten allgemeinen ἄνθρωποι.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: es waren etwa fünftausend
  rationale: ὡς kennzeichnet die Zahl als ungefähr; die deutsche Existenzformulierung vermittelt die ausdrückliche Zählangabe flüssig.
theological_decisions:
- issue: Geschlechtsspezifische Zählung bei der Speisung
  choice: Das allgemeine ἀνθρώπους wird mit „Leute“, das männlich spezifische ἄνδρες mit „Männer“ wiedergegeben.
  alternative: Beide Ausdrücke allgemein mit „Menschen“ oder „Leute“ wiederzugeben.
  rationale: Der griechische Text wechselt von einer allgemeinen Bezeichnung der Menge zu einer männlich spezifischen Bezeichnung der gezählten Gruppe. Diese lexikalische Spannung soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; „sich setzen“ vermeidet ein unnötig altertümliches „sich lagern“, während die Fußnote die kulturelle Nuance sichert. Die Unterscheidung zwischen der gesamten Menge und den gezählten Männern bleibt sichtbar.
