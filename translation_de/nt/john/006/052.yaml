  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: de
  text: 'Da stritten die Juden untereinander[a] und sagten: „Wie kann dieser Mann uns sein Fleisch[b] zu essen geben?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“; dem Zusammenhang nach möglicherweise „die jüdischen Führer“. Im Griechischen steht einfach „die Juden“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seinen Körper“ beziehungsweise „seinen Leib“. Im Griechischen steht „Fleisch“ (σάρξ); diese konkrete Ausdrucksweise bleibt hier erhalten, um die Spannung des Abschnitts zu bewahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: stritten
  rationale: Das Imperfekt bezeichnet einen andauernden heftigen Wortstreit; „stritten“ gibt dies natürlich wieder, ohne einen körperlichen Kampf zu behaupten.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die erzählerische Folge beziehungsweise Reaktion auf Jesu vorherige Aussage; „Da“ ist im Deutschen flüssig und wahrt diesen Zusammenhang.
- source_word: πρὸς ἀλλήλους
  choice: untereinander
  rationale: Gibt den wechselseitigen Streit innerhalb der Gruppe idiomatisch wieder.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Entspricht unmittelbar dem griechischen Ausdruck. Eine mögliche kontextuelle Eingrenzung wird nicht stillschweigend in den Haupttext aufgenommen, sondern in der Fußnote genannt.
- source_word: λέγοντες
  choice: und sagten
  rationale: Leitet den Inhalt ihres Streits ein; die koordinierte deutsche Formulierung gibt das griechische Partizip natürlich wieder.
- source_word: Πῶς δύναται
  choice: Wie kann
  rationale: Direkte und idiomatische Wiedergabe der Frage nach Möglichkeit beziehungsweise Fähigkeit.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Bewahrt den distanzierenden Beiklang des Demonstrativpronomens besser als das bloße „er“.
- source_word: ἡμῖν
  choice: uns
  rationale: Natürliche Wiedergabe des indirekten Objekts zu „geben“.
- source_word: δοῦναι
  choice: geben
  rationale: Entspricht der Grundbedeutung des Verbs, ohne sie interpretierend zu verstärken oder abzuschwächen.
- source_word: τὴν σάρκα αὐτοῦ
  choice: sein Fleisch
  rationale: Bewahrt die konkrete und anstößige Wortwahl des griechischen σάρξ sowie die Spannung des Zusammenhangs; „Leib“ oder „Körper“ wäre bereits stärker deutend.
- source_word: φαγεῖν
  choice: zu essen
  rationale: Direkte und im Deutschen natürliche Wiedergabe des ergänzenden Infinitivs.
theological_decisions:
- issue: Wiedergabe von σάρξ in einem theologisch umstrittenen Zusammenhang
  choice: Fleisch
  alternative: Leib oder Körper
  rationale: „Fleisch“ entspricht dem konkreten griechischen Ausdruck und bewahrt die Spannung der Aussage, ohne vorwegzunehmen, wie sie eucharistisch, metaphorisch oder anderweitig zu deuten ist.
- issue: Mögliche Eingrenzung von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer oder die jüdischen Führer
  rationale: Der Haupttext folgt der nicht näher eingegrenzten griechischen Bezeichnung. Die mögliche kontextuelle Einschränkung wird transparent in einer Fußnote vermerkt, statt sie als sicher vorauszusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung ist natürlich gehalten; „dieser Mann“ bewahrt den distanzierenden Ton, und „Fleisch“ erhält bewusst die konkrete, theologisch spannungsreiche Formulierung.
