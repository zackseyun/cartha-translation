  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des griechischen Textes zutreffend wieder: οἱ ἄνθρωποι als „die Menschen“, σημεῖον als „Zeichen“, der bestimmte Titel „der Prophet“ und die gegenwartsbezogene Wendung „der in die Welt kommt“. Die Deutung des Titels bleibt angemessen in der Fußnote und wird nicht in den Haupttext eingetragen.'
