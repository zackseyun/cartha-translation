base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: de
  text: 'Als die Menschen nun das Zeichen sahen, das er vollbracht hatte,[a] sagten sie: „Dieser ist wirklich der Prophet, der in die Welt kommt.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wunder sahen, das er vollbracht hatte“. Johannes verwendet regelmäßig „Zeichen“ (σημεῖον), um nicht nur den wunderhaften Charakter, sondern auch die offenbarende Bedeutung der Taten Jesu hervorzuheben.'
    reason: lexical_alternative
  - marker: b
    text: „Der Prophet“ bezieht sich wahrscheinlich auf den erwarteten Propheten wie Mose (5. Mose 18,15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Als nun die Menschen
  rationale: ἄνθρωποι bezeichnet hier die anwesenden Menschen bzw. die Menge, nicht ausschließlich Männer. „Nun“ gibt die erzählerische Weiterführung durch οὖν wieder; zusammen mit dem Partizip wird die Wendung im Deutschen natürlich als temporaler Nebensatz formuliert.
- source_word: ἰδόντες
  choice: sahen
  rationale: Das Aoristpartizip wird idiomatisch als finites Verb in einem temporalen Nebensatz wiedergegeben.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: das Zeichen, das er getan hatte
  rationale: „Zeichen“ bewahrt die für Johannes wichtige offenbarende Bedeutung von σημεῖον und reduziert das Geschehen nicht auf seinen wunderhaften Charakter. Das Plusquamperfekt macht deutlich, dass die Tat dem Sehen und Reden vorausging.
- source_word: ἔλεγον
  choice: sagten sie
  rationale: Der Imperfekt kann andauerndes oder wiederholtes Reden bezeichnen. Im natürlichen deutschen Erzählstil kann der Zusammenhang dies tragen, ohne die nicht zwingend geforderte Nuance durch „sagten immer wieder“ zu überbestimmen.
- source_word: ἀληθῶς
  choice: wahrhaftig
  rationale: „Wahrhaftig“ gibt die nachdrückliche Bestätigung wieder und passt zum würdigen Register einer öffentlichen Bekenntnisaussage.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Der bestimmte Artikel weist auf eine bekannte erwartete Gestalt hin. Die Formulierung bleibt beim griechischen Wortlaut und identifiziert diese Gestalt nicht ausdrücklich im Haupttext.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: der in die Welt kommt
  rationale: Die attributive Präsenspartizipialkonstruktion wird mit einem natürlichen deutschen Relativsatz wiedergegeben; das Präsens und die johanneische Wendung bleiben erhalten.
theological_decisions:
- issue: Identität des Propheten
  choice: „der Prophet“, ohne nähere Identifizierung im Haupttext
  alternative: „der Prophet wie Mose“ oder „ein Prophet“
  rationale: Die Aussage spielt wahrscheinlich auf den in 5. Mose 18,15–18 erwarteten Propheten an. Der griechische Text selbst sagt jedoch nur „der Prophet“; deshalb bleibt die mögliche Identifizierung einer Fußnote und dem weiteren Kontext überlassen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Wahrhaftig“ und die titelartige Form „der Prophet“ tragen die feierliche Aussage, ohne altertümliche Satzformen zu verwenden.
