id: JHN.6.45
reference: John 6:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: de
  text: 'Es steht bei den Propheten geschrieben: »Und alle werden von Gott gelehrt werden.« Jeder, der vom Vater gehört und gelernt hat, kommt zu mir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Es steht … geschrieben
  rationale: Gängige deutsche Wiedergabe des umschriebenen Perfekts; sie bringt den fortdauernden Geltungsanspruch der Schrift natürlich und würdig zum Ausdruck.
- source_word: ἐν τοῖς προφήταις
  choice: bei den Propheten
  rationale: Im Deutschen ist dies eine natürliche Zitierformel für die prophetischen Schriften; die Großschreibung weist auf den anerkannten Schriftkorpus hin.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: sie werden alle von Gott gelehrt sein
  rationale: Bewahrt Futur, Passiv und Gott als Lehrenden. Die Formulierung bleibt eng am Griechischen und ist zugleich verständlich.
- source_word: πᾶς ὁ ἀκούσας
  choice: Jeder, der … gehört hat
  rationale: Gibt die substantivierte Einzahl mit allgemeiner Bedeutung wieder; das Perfekt markiert das Hören als dem Kommen vorausgehend.
- source_word: παρὰ τοῦ πατρὸς
  choice: vom Vater
  rationale: παρά mit Genitiv bezeichnet hier die Quelle; die johanneische Bezeichnung »der Vater« bleibt erhalten.
- source_word: καὶ μαθὼν
  choice: und gelernt hat
  rationale: Entspricht dem vorausgehenden Aoristpartizip und verbindet Hören und Lernen als dem Hauptverb vorausgehende Vorgänge.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: kommt zu mir
  rationale: Natürliche, genaue Wiedergabe des Präsens und der persönlichen Hinwendung zu Jesus.
theological_decisions:
- issue: Verhältnis zwischen Gottes Lehren und dem Kommen zu Jesus
  choice: 'Die Abfolge bleibt unausgedeutet stehen: Wer vom Vater gehört und gelernt hat, kommt zu Jesus.'
  alternative: Eine stärker deterministische oder eine stärker synergistische Auslegung ausdrücklich in die Übersetzung einzutragen.
  rationale: Der griechische Text nennt den Zusammenhang, erklärt aber nicht dessen metaphysische Wirkungsweise. So bleibt die theologische Spannung erhalten.
- issue: Beziehung zwischen dem Vater und Jesus
  choice: »vom Vater« und »zu mir« werden unmittelbar aufeinander bezogen.
  alternative: Den christologischen Sinn durch erklärende Zusätze auszuweiten.
  rationale: Dies bewahrt die Aussagekraft des johanneischen Textes, ohne mehr zu behaupten, als der Vers ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zitierformel »Es steht bei den Propheten geschrieben« klingt schriftsprachlich, aber nicht altertümlich. Keine Fußnote ist nötig, da »von Gott gelehrt« die im Englischen erläuterte Alternative bereits transparent wiedergibt.
