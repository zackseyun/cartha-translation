id: JHN.6.15
reference: John 6:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: de
  text: Als Jesus nun erkannte, dass sie im Begriff waren zu kommen und ihn mit Gewalt zu ergreifen, um ihn zum König zu machen, zog er sich wieder allein auf den Berg zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die erzählerische Folgerung beziehungsweise Fortführung; „nun“ ist im Deutschen natürlich und bewahrt die verbindende Funktion.
- source_word: γνοὺς
  choice: als Jesus erkannte
  rationale: Das Aoristpartizip nennt den Umstand, der Jesu Reaktion auslöst. Eine temporale Konstruktion ist im Deutschen idiomatischer als ein schwerfälliges „wissend“.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: sie kommen … wollten
  rationale: Im Zusammenhang beschreibt μέλλω nicht nur zeitliche Nähe, sondern die bevorstehende Absicht der Menge; die Verbindung mit „wollten“ gibt dies natürlich wieder.
- source_word: ἁρπάζειν
  choice: mit Gewalt ergreifen
  rationale: ἁρπάζω bezeichnet hier ein gewaltsames oder eigenmächtiges Ergreifen. Die Formulierung macht den Zwang deutlicher als das möglicherweise neutrale „ergreifen“ allein.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: um ihn zum König zu machen
  rationale: Die Konstruktion mit ἵνα und Konjunktiv drückt den Zweck des geplanten Ergreifens aus.
- source_word: ἀνεχώρησεν
  choice: zog er sich … zurück
  rationale: Gibt sowohl die räumliche Entfernung als auch Jesu Ausweichen vor dem Vorhaben der Menge treffend wieder.
- source_word: πάλιν
  choice: wieder
  rationale: Bewahrt den Hinweis auf eine erneute Bewegung beziehungsweise Rückkehr in die Abgeschiedenheit.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: Entspricht der üblichen deutschen Bewegungsrichtung bei einem Berg und hält sich an die konkrete Ortsangabe des Griechischen.
- source_word: αὐτὸς μόνος
  choice: allein
  rationale: Das im Griechischen hervorgehobene Alleinsein wird im Deutschen mit „allein“ natürlich und ausreichend deutlich ausgedrückt.
theological_decisions:
- issue: Art des beabsichtigten Vorgehens der Menge und ihres Königtumsverständnisses
  choice: „ihn mit Gewalt ergreifen …, um ihn zum König zu machen“
  alternative: „ihn holen …, um ihn zum König zu machen“
  rationale: ἁρπάζειν trägt eine deutliche Zwangskomponente. Die Übersetzung bewahrt den Versuch einer eigenmächtigen politischen Inthronisierung, ohne zusätzliche Motive oder eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, bleibt aber eng an der griechischen Abfolge von Erkenntnis, Absicht der Menge und Jesu Rückzug.
