  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: de
  text: Er sprach von Judas, dem Sohn Simons Iskariot, denn dieser würde ihn ausliefern[a], einer von den Zwölf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn verraten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Er sprach von Judas
  rationale: Der Imperfekt steht in einer rückblickenden Erläuterung; im Deutschen gibt das Präteritum den fortlaufenden bzw. erklärenden Vergangenheitsbezug natürlich wieder. δέ verlangt hier keinen ausdrücklich übersetzten Gegensatz oder Zeitmarker.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: dem Sohn von Simon Iskariot
  rationale: Die Genitivfolge bezeichnet Judas am natürlichsten als Sohn Simons, wobei »Iskariot« zu Simon gehört. Die Verwandtschaftsbezeichnung wird im Deutschen ergänzt, um die syntaktische Beziehung verständlich auszudrücken.
- source_word: οὗτος γὰρ
  choice: denn dieser
  rationale: »Denn« bewahrt die begründende Funktion von γάρ; »dieser« erhält die leicht hervorhebende demonstrative Kraft von οὗτος.
- source_word: ἔμελλεν
  choice: sollte
  rationale: Im erzählenden Rückblick bezeichnet μέλλω ein aus damaliger Sicht bevorstehendes Geschehen. »Sollte« gibt dies knapp wieder, ohne ausdrücklich Absicht oder göttliche Vorherbestimmung festzulegen.
- source_word: παραδιδόναι αὐτόν
  choice: ihn ausliefern
  rationale: »Ausliefern« bewahrt die konkrete Grundbedeutung des Verbs im Passionszusammenhang und lässt zugleich den verräterischen Charakter der Tat erkennen, ohne ihn durch ein ausschließlich deutendes Verb zu ersetzen.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: einer von den Zwölf
  rationale: Die knappe Apposition hebt den erschütternden Umstand hervor, dass der Ausliefernde zum Kreis der Zwölf gehörte.
theological_decisions:
- issue: Bedeutung von παραδιδόναι im Blick auf Judas
  choice: ausliefern
  alternative: verraten
  rationale: Das griechische Verb bezeichnet konkret das Übergeben bzw. Ausliefern. Im Zusammenhang ist dies zugleich Judas’ Verrat; die gewählte Formulierung erhält beide Ebenen, während die Fußnote die geläufige kontextuelle Wiedergabe nennt.
- issue: Nuance von ἔμελλεν
  choice: sollte
  alternative: war im Begriff / hatte vor
  rationale: Die Formulierung wahrt die Zukunft-aus-Vergangenheit-Perspektive, ohne eindeutig zwischen bevorstehendem Geschehen, Absicht und Bestimmung zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bindet die abschließende Apposition klar an Judas zurück und bewahrt ihre hervorgehobene Wirkung.
