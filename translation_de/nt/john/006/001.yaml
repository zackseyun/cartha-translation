source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: de
  text: Danach[a] begab sich Jesus ans andere Ufer des Sees von Galiläa, der auch See von Tiberias heißt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nach diesen Dingen“.'
    reason: lexical_alternative
  - marker: b
    text: „See von Galiläa“ und „See von Tiberias“ sind zwei Namen für dasselbe Gewässer.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die zeitliche Übergangsformel wird in natürlichem modernem Deutsch wiedergegeben. Die wörtlichere Mehrzahl „Nach diesen Dingen“ bleibt in Fußnote [a] sichtbar.
- source_word: ἀπῆλθεν
  choice: begab sich
  rationale: Das Verb bezeichnet ein Weggehen beziehungsweise Sichfortbewegen. „Begab sich“ klingt hier natürlicher als „ging weg“ und legt nicht fest, auf welche Weise Jesus den See überquerte.
- source_word: πέραν
  choice: ans andere Ufer
  rationale: Bei einem Gewässer bezeichnet πέραν idiomatisch die gegenüberliegende Seite. „Ans andere Ufer“ ist im Deutschen klar und natürlich.
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: des Sees von Galiläa
  rationale: Obwohl θάλασσα wörtlich „Meer“ heißen kann, bezeichnet es hier den als See bekannten Binnensee. „See von Galiläa“ ist die geläufige deutsche Benennung.
- source_word: τῆς Τιβεριάδος
  choice: der auch See von Tiberias heißt
  rationale: Der zweite Genitiv benennt dasselbe Gewässer mit einem weiteren Namen. Die aufgelöste Form macht diese Apposition im Deutschen eindeutig und flüssig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt hinsichtlich der Art der Überquerung offen und löst die griechische Häufung von Genitiven zugunsten einer verständlichen deutschen Apposition auf.
