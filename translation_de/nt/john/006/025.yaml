source:
  edition: SBLGNT
  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: de
  text: 'Als sie ihn auf der anderen Seite des Sees fanden, sagten sie zu ihm: »Rabbi, wann bist du hierhergekommen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτόν
  choice: Als sie ihn … fanden
  rationale: Das vorangestellte Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben. Das einleitende καί muss im Deutschen dabei nicht eigens mit »und« abgebildet werden, da der Anschluss durch »Als« hinreichend deutlich ist.
- source_word: πέραν τῆς θαλάσσης
  choice: auf der anderen Seite des Sees
  rationale: πέραν mit Genitiv bezeichnet hier den Ort jenseits des Gewässers. »Auf der anderen Seite des Sees« ist idiomatisch und bewahrt den geografischen Bezug.
- source_word: εἶπον αὐτῷ
  choice: sagten sie zu ihm
  rationale: Die Wiedergabe bleibt beim Grundsinn von λέγω, obwohl die folgende Äußerung eine Frage ist.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die übernommene Anrede bewahrt das jüdische Umfeld und den konkreten Ehrentitel; eine Übersetzung mit »Lehrer« wäre stärker deutend.
- source_word: πότε ὧδε γέγονας
  choice: wann bist du hierhergekommen?
  rationale: Das Perfekt von γίνομαι bezeichnet in diesem Zusammenhang das Eintreffen beziehungsweise die nun bestehende Anwesenheit. »Hierhergekommen« gibt Zielrichtung und idiomatischen Sinn im Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die Anrede »Rabbi« bleibt zur Wahrung des historischen und kulturellen Kolorits erhalten.
