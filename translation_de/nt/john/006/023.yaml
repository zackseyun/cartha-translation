id: JHN.6.23
reference: John 6:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: de
  text: Doch aus Tiberias kamen Boote in die Nähe des Ortes, wo sie das Brot gegessen hatten, nachdem der Herr gedankt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „kleine Boote“. Das griechische Wort πλοιάρια ist eine Verkleinerungsform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert den Gegensatz zur zuvor geschilderten Lage und setzt den Satz im Deutschen natürlich fort.
- source_word: ἦλθεν
  choice: kamen
  rationale: Der griechische Singular steht bei dem sächlichen Plural πλοιάρια; im Deutschen verlangt das plurale Subjekt „Boote“ die Form „kamen“.
- source_word: πλοιάρια
  choice: Boote
  rationale: Das Diminutiv kann kleine Boote bezeichnen, doch „Boote“ ist im Deutschen natürlich; die mögliche Verkleinerungsnuance wird in der Fußnote bewahrt.
- source_word: ἐκ Τιβεριάδος
  choice: aus Tiberias
  rationale: Gibt die Herkunft der Boote idiomatisch wieder.
- source_word: ἐγγὺς τοῦ τόπου
  choice: in die Nähe des Ortes
  rationale: In Verbindung mit dem Bewegungsverb „kamen“ gibt diese Formulierung sowohl die Annäherung als auch die räumliche Nähe natürlich wieder.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: wo sie das Brot gegessen hatten
  rationale: Das Plusquamperfekt verdeutlicht im deutschen Erzählzusammenhang, dass das Essen vor dem Eintreffen der Boote lag; „das Brot“ verweist auf das zuvor erwähnte Brot.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: nachdem der Herr gedankt hatte
  rationale: Die Genitivkonstruktion mit Aoristpartizip bezeichnet hier eine vorausgehende Handlung des Herrn; ein Nebensatz ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Meister
  rationale: „Der Herr“ wahrt den ehrenden Titel für Jesus und seine christologische Resonanz, ohne die Aussage weiter auszudeuten.
- issue: Bezug und zeitliches Verhältnis von εὐχαριστήσαντος τοῦ κυρίου
  choice: nachdem der Herr gedankt hatte
  alternative: als der Herr gedankt hatte
  rationale: Der Genitivus absolutus bezieht das Danken eindeutig auf den Herrn; „nachdem“ stellt die naheliegende Vorzeitigkeit gegenüber dem Essen dar, ohne den Inhalt des Dankes näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ schafft einen natürlichen Anschluss an den vorigen Vers; die Satzstellung hält den erzählerischen Fluss aufrecht. Die mögliche Diminutivbedeutung von πλοιάρια bleibt durch die Fußnote sichtbar.
