  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Das ist das Werk Gottes[a]: dass ihr an den glaubt[b], den er gesandt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Werk, das Gott verlangt“ oder „das Werk, das Gott tut“. Die griechische Wendung „das Werk Gottes“ lässt mehrere Deutungen zu; der Wortlaut bewahrt diese Mehrdeutigkeit.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „dass ihr dem vertraut, den er gesandt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Das Deutsche verwendet in direkter Rede idiomatisch ein einziges Redeverb. „Antwortete“ gibt die Funktion der griechischen Doppelformel vollständig wieder, ohne die schwerfällige Wendung „antwortete und sagte“ nachzuahmen.
- source_word: Τοῦτό ἐστιν
  choice: Das ist
  rationale: Die demonstrative Kopulakonstruktion wird direkt und mit dem im Deutschen natürlichen Rückverweis „Das“ wiedergegeben.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: das Werk Gottes
  rationale: 'Die formal nahe Genitivkonstruktion bewahrt die genuine Mehrdeutigkeit: Gemeint sein kann das von Gott verlangte oder das von Gott gewirkte Werk.'
- source_word: ἵνα πιστεύητε
  choice: dass ihr … glaubt
  rationale: Nach der identifizierenden Aussage gibt der dass-Satz Inhalt beziehungsweise Ziel des Werkes natürlich wieder. Der Präsenskonjunktiv wird ohne künstlichen Modalzusatz idiomatisch übersetzt.
- source_word: πιστεύητε εἰς ὃν
  choice: dass ihr an den glaubt, den
  rationale: πιστεύω εἰς bezeichnet bei Johannes regelmäßig ein auf eine Person gerichtetes Glauben beziehungsweise Vertrauen. „An jemanden glauben“ ist dafür die etablierte und natürliche deutsche Formulierung.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: er gesandt hat
  rationale: Das Perfekt ist im Deutschen idiomatisch, weil Gottes Sendung Jesu für die gegenwärtige Aussage fortdauernde Bedeutung hat. Das betonte griechische Pronomen wird natürlich mit „er“ wiedergegeben.
theological_decisions:
- issue: Bedeutung des Genitivs in τὸ ἔργον τοῦ θεοῦ
  choice: Die mehrdeutige Formulierung „das Werk Gottes“ bleibt im Haupttext erhalten.
  alternative: „das Werk, das Gott verlangt“ oder „das Werk, das Gott tut/wirkt“
  rationale: Der Genitiv kann objektiv beziehungsweise näher bestimmend oder subjektiv verstanden werden. Der Kontext fragt nach dem Tun der Menschen, während Jesu Antwort zugleich Gottes Sendung und möglicherweise Gottes Wirken hervorhebt. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.
- issue: Wiedergabe von πιστεύητε εἰς
  choice: „an den glaubt“
  alternative: „dem vertraut“
  rationale: „An jemanden glauben“ ist die übliche deutsche Entsprechung der johanneischen Konstruktion πιστεύω εἰς und bewahrt den Anschluss an die Glauben-Terminologie. Die Vertrauensdimension wird als mögliche Nuance in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Griechischen übliche Doppelformel „antwortete und sagte“ wird idiomatisch zu „antwortete“ gestrafft. „Gesandt“ bleibt wegen des johanneischen Sendungsmotivs erhalten; „geschickt“ wäre alltäglicher, aber weniger registergerecht.
