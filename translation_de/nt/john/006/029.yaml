review_pass:
  verdict: approve
  source_fidelity: Der Text gibt den Sinn des griechischen Verses zuverlässig wieder. „Jesus antwortete ihnen“ ist eine idiomatische deutsche Wiedergabe der griechischen Erzählformel ἀπεκρίθη … καὶ εἶπεν αὐτοῖς; das zusätzliche εἶπεν muss im Deutschen nicht mechanisch mit einem zweiten Redeverb abgebildet werden. „Das ist das Werk Gottes“ bewahrt den mehrdeutigen Genitiv τοῦ θεοῦ. „dass ihr an den glaubt, den er gesandt hat“ entspricht πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος angemessen. Das deutsche Perfekt bei „gesandt hat“ ist als idiomatische Wiedergabe des Aorists vertretbar.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die Satzführung ist klar; „an den glauben, den er gesandt hat“ ist eine etablierte und natürliche Formulierung.
  terminology: „Werk Gottes“, „glaubt“ und „gesandt“ sind terminologisch passend. Die Fußnote zu „Werk Gottes“ erläutert die möglichen Verständnisse, ohne eines im Haupttext festzulegen. Die Vertrauensnuance bei πιστεύω wird sachgerecht als Alternative angegeben.
