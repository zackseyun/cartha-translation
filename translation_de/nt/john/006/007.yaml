  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: de
  text: 'Philippus antwortete ihm: „Brot für zweihundert Denare[a] reicht nicht für sie aus, damit jeder ein wenig bekommt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar entsprach ungefähr dem üblichen Tageslohn eines Arbeiters.
    reason: Die antike Währung ist heutigen Lesern meist unbekannt; die Erläuterung vermittelt ihre ungefähre Größenordnung, ohne den Betrag spekulativ in modernes Geld umzurechnen.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: antwortete ihm
  rationale: Gibt die geläufige griechische Antwortformel knapp und natürlich wieder.
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: Brot für zweihundert Denare
  rationale: Bewahrt den konkreten Geldbetrag und gibt den attributiven Genitiv idiomatisch als Preisangabe wieder.
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  choice: reicht nicht für sie aus
  rationale: Entspricht der Bedeutung von ἀρκέω und klingt im modernen Deutschen natürlich.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: damit jeder auch nur ein wenig bekommt
  rationale: „Damit“ bildet die ἵνα-Konstruktion ab; „auch nur ein wenig“ bringt die im Kontext betonte äußerst geringe Menge natürlich zum Ausdruck.
theological_decisions:
- issue: Funktion von ἵνα
  choice: damit
  alternative: sodass
  rationale: Die Aussage beschreibt, wozu die Brotmenge ausreichen müsste. „Damit“ bewahrt die finale Färbung der griechischen Konstruktion, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und betont durch „auch nur“ die Unzulänglichkeit selbst einer sehr großen Geldsumme.
