source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: de
  text: Und das Wort wurde Fleisch und wohnte unter uns[a]. Wir sahen seine Herrlichkeit – eine Herrlichkeit wie die des Einzigen, der vom Vater kommt[b]. Er war voller Gnade und Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zeltete unter uns“ oder „schlug unter uns sein Zelt auf“. Das Verb klingt an die Zelt- beziehungsweise Heiligtumsvorstellung von Gottes Wohnen unter seinem Volk an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Herrlichkeit wie die eines einzigartigen Sohnes, der vom Vater kommt“; traditionell: „wie die des eingeborenen Sohnes vom Vater“. Das griechische Wort betont wahrscheinlich vor allem Einzigartigkeit; „Sohn“ steht hier nicht ausdrücklich, ist im Zusammenhang jedoch naheliegend.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: das Wort
  rationale: Bewahrt den etablierten, kontextreichen johanneischen Titel und gibt den griechischen Ausdruck knapp und würdig wieder.
- source_word: σὰρξ ἐγένετο
  choice: wurde Fleisch
  rationale: Erhält die konkrete Aussage wirklicher menschlicher Existenz und die starke Übergangsbedeutung von ἐγένετο, ohne sie zu einer abstrakten Aussage über die menschliche Natur abzuschwächen.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: wohnte unter uns
  rationale: Ist in modernem Deutsch natürlich; die im Verb anklingende Zelt- und Heiligtumsvorstellung wird in der Fußnote sichtbar gemacht.
- source_word: ἐθεασάμεθα
  choice: wir sahen
  rationale: Drückt die unmittelbare Wahrnehmung verständlich aus; „schauten“ wäre gehobener, aber im heutigen Sprachgebrauch weniger direkt.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: Ist die gebräuchliche und theologisch tragfähige Entsprechung im biblischen Zusammenhang.
- source_word: μονογενοῦς
  choice: der Einzige
  rationale: Gibt hier vor allem die einzigartige, unvergleichliche Stellung wieder und vermeidet, die umstrittene etymologische Deutung „eingeboren“ ungekennzeichnet in den Haupttext einzutragen.
- source_word: παρὰ πατρός
  choice: vom Vater
  rationale: Gibt Herkunft und Beziehung natürlich wieder; der artikellose griechische Ausdruck ist im johanneischen Kontext auf den Vater bezogen.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: voller Gnade und Wahrheit
  rationale: Bewahrt die knappe, vertraute Formulierung und lässt den grammatischen Bezug auf das Wort beziehungsweise den Einzigen bestehen.
theological_decisions:
- issue: Bedeutung und christologischer Bezug von μονογενοῦς
  choice: der Einzige vom Vater
  alternative: der einziggeborene Sohn; der einzigartige Sohn
  rationale: μονογενής bezeichnet wahrscheinlich Einzigartigkeit beziehungsweise Einmaligkeit. Das Substantiv „Sohn“ steht in diesem Vers nicht ausdrücklich im Griechischen, ist aber kontextuell naheliegend; der Haupttext vermeidet deshalb eine stillschweigende Ergänzung, während die Fußnote die traditionellen und erläuternden Möglichkeiten nennt.
- issue: Heiligtums- beziehungsweise Zeltmotiv in ἐσκήνωσεν
  choice: wohnte unter uns
  alternative: schlug unter uns sein Zelt auf; zeltete unter uns
  rationale: Der Haupttext bleibt natürlich und verständlich, während die Fußnote den wahrscheinlichen Anklang an Gottes Wohnen im Zelt-Heiligtum bewahrt.
- issue: Bezug von πλήρης
  choice: voller Gnade und Wahrheit als Beschreibung des Wortes beziehungsweise des Einzigen
  alternative: freie Umformung mit ausdrücklichem „Er war“
  rationale: Die knappe griechische Konstruktion wird beibehalten, ohne den syntaktischen Bezug stärker festzulegen, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertrauten Schlüsselbegriffe „Wort“, „Fleisch“, „Herrlichkeit“, „Gnade“ und „Wahrheit“ bleiben erhalten. Die Satzteilung nach „unter uns“ verbessert die Lesbarkeit, ohne den Gedankengang zu verändern.
