  text: In ihm war Leben, und das Leben war das Licht der Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: In ihm
  rationale: Die Präposition ἐν wird unmittelbar mit „in“ wiedergegeben. Obwohl das deutsche „Wort“ grammatisch sächlich ist, stellt der Kontext den Logos persönlich dar; daher gibt „ihm“ den gemeinten Bezug natürlicher wieder als „ihm/ihm“ rein nach deutschem Genus oder das unpersönliche „darin“.
- source_word: ζωὴ
  choice: Leben
  rationale: ζωή bedeutet hier schlicht „Leben“. Die knappe Form bewahrt die theologische Tiefe des johanneischen Begriffs, ohne sie durch „ewiges Leben“ vorwegnehmend auszulegen.
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt von εἰμί wird natürlich und im Einklang mit dem Stil des Prologs durch „war“ wiedergegeben.
- source_word: ἡ ζωὴ
  choice: das Leben
  rationale: Der Artikel und der Rückbezug auf das zuvor genannte Leben werden im Deutschen durch „das Leben“ bewahrt.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: φῶς wird mit dem etablierten und bildkräftigen Ausdruck „Licht“ übersetzt; der Artikel gehört zur bestimmten prädikativen Aussage.
- source_word: τῶν ἀνθρώπων
  choice: der Menschen
  rationale: Der Genitiv wird formal als „der Menschen“ wiedergegeben. Das deutsche „Menschen“ bezeichnet hier von selbst alle Menschen und bildet den generischen Sinn von ἀνθρώπων ohne geschlechtliche Verengung ab.
theological_decisions:
- issue: Persönlicher Bezug von αὐτῷ
  choice: „ihm“ mit Bezug auf das Wort
  alternative: „darin“ oder grammatisch am deutschen Neutrum orientiert „in ihm“ nicht persönlich verstanden
  rationale: Der unmittelbare Zusammenhang beschreibt den Logos zunehmend persönlich. „In ihm“ wahrt diesen Bezug, ohne spätere dogmatische Formulierungen in den Vers einzutragen.
- issue: Bedeutungsumfang von ἀνθρώπων
  choice: „der Menschen“ im umfassenden, generischen Sinn
  alternative: „der Menschheit“ oder „für die Menschen“
  rationale: „Der Menschen“ erhält sowohl den Genitiv als auch den Bezug auf die Menschheit insgesamt. „Für die Menschen“ würde eine Zweck- oder Nutzenbeziehung ausdrücklicher machen, als der griechische Genitiv es verlangt.
translation_notes:
  register: Knappe, würdige und gegenwärtige Standardsprache. Die traditionelle Satzmelodie bleibt erhalten, während „Menschen“ im heutigen Deutschen eindeutig inklusiv verstanden wird; eine Fußnote ist daher nicht nötig.
