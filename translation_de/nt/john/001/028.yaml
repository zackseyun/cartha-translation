  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: de
  text: Dies alles geschah in Betanien jenseits des Jordan[a], wo Johannes taufte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und spätere Übersetzungstraditionen lesen hier „Betabara“ statt „Betanien“.
    reason: Textvariante
lexical_decisions:
- source_word: ταῦτα
  choice: Dies alles
  rationale: Gibt den pluralischen Rückverweis auf das zuvor berichtete Geschehen in natürlichem modernem Deutsch wieder; „diese Dinge“ wäre formaler, aber unidiomatisch.
- source_word: ἐν Βηθανίᾳ
  choice: in Betanien
  rationale: Direkte und im Deutschen übliche Ortsangabe.
- source_word: ἐγένετο
  choice: geschah
  rationale: Gibt hier das Eintreten beziehungsweise Stattfinden der berichteten Vorgänge knapp und würdig wieder.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: jenseits des Jordan
  rationale: Bewahrt die räumliche Perspektive des griechischen Ausdrucks und ist im Deutschen klar und geläufig.
- source_word: ὅπου
  choice: wo
  rationale: Natürliche Wiedergabe des relativen Ortsadverbs.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: wo Johannes taufte
  rationale: Die Verbindung aus Imperfekt und Partizip bezeichnet eine fortdauernde Tätigkeit; das deutsche Imperfekt gibt sie im Erzählzusammenhang natürlich wieder.
theological_decisions:
- issue: Ortsname Βηθανίᾳ („Betanien“) gegenüber der Textvariante Βηθαβαρᾷ („Betabara“)
  choice: Betanien
  alternative: Betabara
  rationale: Der zugrunde gelegte SBLGNT liest Βηθανίᾳ. Die traditionsgeschichtlich bekannte Variante wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Dies alles“ vermeidet das im Deutschen schwerfällige „Diese Dinge“, ohne den pluralischen Rückbezug von ταῦτα zu verlieren.
