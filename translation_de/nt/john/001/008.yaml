  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: de
  text: Er war nicht das Licht[a], sondern er kam, um von dem Licht Zeugnis abzulegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher, mit Ergänzung der Ellipse: „Er war nicht das Licht, sondern [er kam], damit er von dem Licht Zeugnis ablege.“ Im Griechischen bleibt das Verb im zweiten Satzteil unausgesprochen und wird aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: war nicht
  rationale: Das negierte Imperfekt von εἰμί wird im Deutschen hier natürlich mit „war nicht“ wiedergegeben.
- source_word: ἐκεῖνος
  choice: Er
  rationale: Das Demonstrativpronomen verweist im johanneischen Zusammenhang nachdrücklich auf Johannes; „Er“ ist im modernen Deutsch natürlicher als „jener“ oder „jener Mann“.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Der bestimmte Artikel bleibt erhalten, da das zuvor eingeführte, konkrete Licht gemeint ist.
- source_word: ἀλλ’ ἵνα
  choice: sondern er kam, um
  rationale: Nach ἀλλά ist das Verb im Griechischen elliptisch; „er kam“ wird aus dem Zusammenhang von Vers 7 ergänzt. Die Infinitivkonstruktion gibt den Zweck natürlich wieder.
- source_word: μαρτυρήσῃ
  choice: Zeugnis abzulegen
  rationale: Die Formulierung bewahrt den für Johannes wichtigen Aussage- und Zeugencharakter von μαρτυρέω und klingt zugleich würdig und verständlich.
- source_word: περὶ τοῦ φωτός
  choice: von dem Licht
  rationale: Bei „Zeugnis ablegen“ ist „von“ eine natürliche deutsche Entsprechung für περί mit Genitiv und bezeichnet den Gegenstand des Zeugnisses.
theological_decisions:
- issue: Identität und Rolle des Johannes gegenüber dem Licht
  choice: Der Vers verneint, dass Johannes selbst das Licht war, und beschreibt seinen Auftrag als Zeugnis für das Licht.
  alternative: 'Wörtlicher: „Er war nicht das Licht, sondern damit er von dem Licht Zeugnis ablege.“'
  rationale: Die Fassung wahrt die klare Unterscheidung zwischen dem Zeugen und dem Licht. Das ergänzte „er kam“ macht lediglich die griechische Ellipse aus dem Zusammenhang verständlich und fügt keine weitergehende theologische Deutung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Zeugnis ablegen“ erhält das johanneische Zeugenmotiv; die Fußnote macht die Ellipse des griechischen Satzes transparent.
