source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: de
  text: 'Da sagte Natanaël zu ihm: „Kann aus Nazaret etwas Gutes kommen?“ Philippus sagte zu ihm: „Komm und sieh!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: Da sagte Natanaël zu ihm
  rationale: Das einleitende καί verbindet den Satz mit dem vorherigen Erzählgang. „Da“ gibt diesen Anschluss in natürlichem deutschem Erzählstil wieder, ohne eine starke zeitliche Folgerung hinzuzufügen; εἶπεν mit dem Dativ αὐτῷ wird als „sagte … zu ihm“ wiedergegeben.
- source_word: Ναθαναήλ
  choice: Natanaël
  rationale: Gebräuchliche deutsche Form des Personennamens; die Trema-Schreibung macht die getrennte Aussprache der Vokale kenntlich.
- source_word: Ἐκ Ναζαρὲτ
  choice: aus Nazaret
  rationale: ἐκ bezeichnet hier Herkunft oder Ursprung. Bei Ortsnamen ist „aus“ im Deutschen die natürliche und genaue Wiedergabe.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: Kann … etwas Gutes kommen?
  rationale: Wörtlich steht „Kann … etwas Gutes sein?“. Zusammen mit ἐκ und dem Ortsnamen bringt das idiomatische deutsche „aus … kommen“ jedoch Herkunft zum Ausdruck und bewahrt die rhetorische Kraft der Frage.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Philippus sagte zu ihm
  rationale: Das historische Präsens λέγει wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben. Der griechische Artikel vor dem Personennamen wird im Deutschen nicht ausgedrückt.
- source_word: Ἔρχου καὶ ἴδε
  choice: Komm und sieh!
  rationale: Die beiden Imperative werden knapp und unmittelbar wiedergegeben. „Sieh“ bewahrt neben dem konkreten Sehen auch die im Johannesevangelium mögliche weitergehende Bedeutung des Erkennens.
theological_decisions:
- issue: Ton von Natanaëls Frage über Nazaret
  choice: Als skeptische rhetorische Frage ohne zusätzliche Kennzeichnung von Spott oder Verachtung wiedergegeben.
  alternative: Eine ausdrücklich abwertende oder sarkastische Formulierung.
  rationale: Der griechische Wortlaut vermittelt Skepsis, markiert aber keinen bestimmten spöttischen Ton. Die Übersetzung verstärkt Natanaëls Haltung daher nicht über den Text hinaus.
- issue: Bedeutung von εἶναι in Verbindung mit ἐκ Ναζαρὲτ
  choice: „aus Nazaret … kommen“
  alternative: „in Nazaret … sein“ oder wörtlicher „aus Nazaret … sein“
  rationale: Die Herkunftskonstruktion ἐκ Ναζαρὲτ legt im Deutschen „aus Nazaret kommen“ nahe. Damit wird weder festgelegt, ob Natanaël allgemein über Menschen beziehungsweise Dinge aus Nazaret noch im Kontext insbesondere über den erwarteten Messias spricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper johanneischer Erzählweise. Die Namensformen „Natanaël“, „Nazaret“ und „Philippus“ folgen geläufigen deutschen Bibelkonventionen. Keine Fußnote ist nötig, da die wörtlichere Alternative „aus Nazaret … sein“ im Deutschen unnatürlich wäre und keinen entscheidenden Bedeutungsunterschied erschließt.
