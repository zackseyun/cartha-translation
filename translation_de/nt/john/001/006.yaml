id: JHN.1.6
reference: John 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: de
  text: Da trat ein Mensch auf, von Gott gesandt. Sein Name war Johannes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er hieß Johannes.“'
    reason: Die griechische Namensformel kann im Deutschen sowohl ausdrücklich mit „Sein Name war“ als auch knapper mit „Er hieß“ wiedergegeben werden.
lexical_decisions:
- source_word: Ἐγένετο
  choice: Da trat … auf
  rationale: γίνομαι führt hier eine neue Person in die Erzählung ein. „Da trat … auf“ gibt diesen erzählerischen Einsatz natürlich wieder, ohne eine Erschaffung oder ein bloßes Erscheinen zu behaupten.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Das Wort bezeichnet hier einen einzelnen Menschen, nämlich Johannes. „Mensch“ bewahrt zugleich den bewussten Gegensatz zur vorherigen Rede vom Wort.
- source_word: ἀπεσταλμένος
  choice: gesandt
  rationale: Das passive Perfektpartizip kennzeichnet Johannes als jemanden, der mit einem Auftrag gesandt worden ist. „Gesandt“ wahrt die passive Form und bleibt knapp.
- source_word: παρὰ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv bezeichnet hier den Ursprung der Sendung. „Von Gott“ bewahrt diesen Herkunfts- und Auftragsgedanken, ohne ihn unnötig auszudeuten.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: Sein Name war Johannes
  rationale: 'Die semitisch geprägte Wendung bedeutet wörtlich etwa „Name ihm: Johannes“. Die gewählte Fassung ist im Deutschen natürlich und erhält die ausdrückliche Namensangabe.'
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Verwendet wird die im Deutschen etablierte Form des biblischen Personennamens.
theological_decisions:
- issue: Art der Sendung des Johannes
  choice: Johannes wird als von Gott gesandt dargestellt.
  alternative: Johannes wurde durch Gott gesandt.
  rationale: ἀπεσταλμένος παρὰ θεοῦ bezeichnet Gott als Ursprung seiner Sendung. „Von Gott gesandt“ lässt sowohl Herkunft als auch Beauftragung anklingen, ohne über den Text hinaus ein bestimmtes Amtsverständnis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze erste Satzteil führt Johannes markant in die Erzählung ein; die nachgestellte Wendung „von Gott gesandt“ bewahrt die Hervorhebung seines göttlichen Auftrags.
