  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: de
  text: 'Er sagte: „Ich bin eine Stimme[a] eines Rufenden in der Wüste: ›Macht den Weg des Herrn gerade‹, wie der Prophet Jesaja gesagt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Zuordnung von „in der Wüste“: „Ich bin eine Stimme in der Wüste, eines Rufenden.“ Diese Deutung ist im Deutschen weniger naheliegend; der griechische Wortlaut lässt die Zuordnung jedoch offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Er sagte
  rationale: Eine schlichte, natürliche Redeeinleitung, die dem unmittelbaren Dialog entspricht.
- source_word: Ἐγὼ φωνὴ
  choice: Ich bin die Stimme
  rationale: Das im Deutschen idiomatische Prädikatsnomen mit bestimmtem Artikel gibt die Selbstidentifikation klar wieder; das ausdrücklich gesetzte Ἐγώ wird durch „Ich“ bewahrt.
- source_word: βοῶντος
  choice: eines Rufenden
  rationale: Das substantivierte Partizip bildet die Genitivbeziehung zu „Stimme“ knapp und würdig ab; „Rufenden“ bewahrt die prophetische Eindringlichkeit.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist im modernen Standarddeutsch die natürliche und traditionsfähige Wiedergabe von ἔρημος in diesem Jesajazitat.
- source_word: Εὐθύνατε
  choice: Macht … gerade
  rationale: Der Imperativ fordert unmittelbar zum Handeln auf und erhält das Bild eines zu begradigenden Weges.
- source_word: τὴν ὁδὸν
  choice: den Weg
  rationale: „Weg“ bewahrt sowohl das konkrete Bild als auch dessen übertragene Bedeutung.
- source_word: κυρίου
  choice: des Herrn
  rationale: „Herr“ wahrt im Jesajazitat das theologische Gewicht von κύριος und ist die etablierte deutsche Wiedergabe.
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: wie der Prophet Jesaja gesagt hat
  rationale: Die Formulierung drückt die Übereinstimmung mit Jesajas Aussage natürlich aus; „der Prophet Jesaja“ ist im Deutschen idiomatischer als die griechische Wortfolge.
theological_decisions:
- issue: Wiedergabe von κύριος im Jesajazitat
  choice: des Herrn
  alternative: des Gebieters
  rationale: „Herr“ erhält den Bezug auf den Gottesnamen im alttestamentlichen Ausgangstext und lässt zugleich die johanneische theologische Spannung bestehen, ohne sie erklärend aufzulösen.
- issue: Zuordnung von „in der Wüste“
  choice: eines Rufenden in der Wüste
  alternative: eine Stimme in der Wüste, die ruft
  rationale: Die gewählte Fassung verbindet die Ortsangabe in der natürlichsten Weise mit dem Rufenden und entspricht der naheliegenden griechischen Konstruktion.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt eng am Griechischen, ohne im Deutschen steif zu wirken. Kein Fußnotenmarker ist nötig, da die alternative syntaktische Zuordnung im Deutschen deutlich weniger naheliegt und die Hauptfassung die echte griechische Konstruktion angemessen wiedergibt.
