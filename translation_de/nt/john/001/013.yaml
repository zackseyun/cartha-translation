id: JHN.1.13
reference: John 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: de
  text: die nicht aus Blutlinien[a], nicht aus dem Willen des Fleisches und nicht aus dem Willen eines Mannes geboren wurden, sondern aus Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »aus Bluten«; der ungewöhnliche Plural im Griechischen meint wahrscheinlich natürliche Abstammung oder menschliche Elternschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: die
  rationale: Das Relativpronomen knüpft den Satz unmittelbar an die im vorherigen Vers genannten Menschen an und erhält so die griechische Satzstruktur.
- source_word: ἐξ αἱμάτων
  choice: aus Blutlinien
  rationale: Der ungewöhnliche griechische Plural »Blute« bezeichnet wahrscheinlich natürliche Abstammung beziehungsweise menschliche Elternschaft. »Blutlinien« gibt diesen Sinn in verständlichem Deutsch wieder und lässt zugleich den im Plural ausgedrückten Abstammungsgedanken erkennen; die wörtlichere Form steht in der Fußnote.
- source_word: θελήματος
  choice: Willen
  rationale: »Willen« entspricht hier dem Bedeutungsbereich von θέλημα und bewahrt die parallele Wiederholung der beiden Wendungen.
- source_word: σαρκὸς
  choice: Fleisches
  rationale: »Fleisch« erhält die konkrete, menschlich-leibliche Ausdrucksweise. Gemeint ist im Zusammenhang die natürliche menschliche Zeugung beziehungsweise der geschlechtliche Antrieb, nicht ausdrücklich eine »sündige Natur«.
- source_word: ἀνδρὸς
  choice: eines Mannes
  rationale: ἀνήρ bezeichnet hier wahrscheinlich einen erwachsenen männlichen Menschen und damit den männlichen Anteil beziehungsweise Willen bei der Zeugung. Der unbestimmte Singular des Griechischen bleibt erhalten.
- source_word: ἐκ θεοῦ
  choice: aus Gott
  rationale: »Aus Gott« bewahrt die wiederholte Herkunftsangabe mit ἐκ und stellt den Gegensatz zwischen menschlichem Ursprung und Gott prägnant dar.
- source_word: ἐγεννήθησαν
  choice: geboren wurden
  rationale: Die passive Verbform von γεννάω kann Zeugung oder Geburt bezeichnen. »Geboren wurden« ist im Deutschen natürlich, passt zur Rede von Gottes Kindern und legt den biologischen Vorgang nicht unnötig auf die väterliche Seite fest.
theological_decisions:
- issue: Gegensatz zwischen menschlichem und göttlichem Ursprung
  choice: Der Vers beschreibt eine Geburt beziehungsweise Herkunft, die nicht auf natürlicher Abstammung oder menschlichem Zeugungswillen beruht, sondern auf Gott.
  alternative: Die Aussage könnte enger nur auf ethnische Abstammung bezogen oder im Licht späterer Traditionen ausdrücklich sakramental beziehungsweise metaphysisch gedeutet werden.
  rationale: Die dreifache Verneinung stellt natürliche Abstammung und menschlichen Willen dem Ursprung aus Gott gegenüber. Die Übersetzung erhält diesen Gegensatz, ohne eine bestimmte konfessionelle Lehre über die Wiedergeburt in den Text hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Parallelstruktur der drei verneinten Herkunftsangaben bleibt erhalten. »Blutlinien« ist verständlicher als das altertümliche »Geblüt«; die ungewöhnliche Form des griechischen Plurals wird in der Fußnote offengelegt.
