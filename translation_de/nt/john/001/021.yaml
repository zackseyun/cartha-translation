  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: de
  text: 'Und sie fragten ihn: „Was denn? Bist du Elia?“ Er sagt[a]: „Ich bin es nicht.“ „Bist du der Prophet[b]?“ Und er antwortete: „Nein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht das historische Präsens: „Er sagt“. Diese Erzählweise vergegenwärtigt das Geschehen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich der erwartete Prophet wie Mose (5. Mose 18,15.18).
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: fragten
  rationale: Der Aorist von ἐρωτάω bezeichnet hier eine direkte Frage; „fragten“ ist die natürliche, sachliche deutsche Entsprechung.
- source_word: Τί οὖν;
  choice: Was dann?
  rationale: Die knappe Wendung führt folgernd zur nächsten Frage und bewahrt die abrupte Form des Griechischen.
- source_word: σὺ Ἠλίας εἶ
  choice: Bist du Elija?
  rationale: Die deutsche Frageform gibt die Identitätsfrage natürlich wieder; das ausdrücklich gesetzte σὺ wird durch die direkte Anrede hinreichend abgebildet. „Elija“ folgt der üblichen deutschen Namensform.
- source_word: Οὐκ εἰμί
  choice: Ich bin es nicht
  rationale: Die Formulierung bewahrt die knappe Verneinung, ergänzt aber das im Deutschen für eine natürliche Identitätsaussage erforderliche „es“.
- source_word: Ὁ προφήτης
  choice: der Prophet
  rationale: Der Artikel weist auf eine bestimmte, erwartete Gestalt hin. „Der Prophet“ lässt deren genaue Identität im Haupttext offen.
- source_word: λέγει
  choice: er sagt
  rationale: Das historische Präsens des griechischen Erzählstils wird bewusst beibehalten und verleiht der Szene Unmittelbarkeit.
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und genaue deutsche Erzählform für eine direkte Erwiderung.
- source_word: Οὔ
  choice: Nein
  rationale: Das alleinstehende Verneinungswort ist eine kurze, eindeutige Antwort.
theological_decisions:
- issue: Identität des „Propheten“
  choice: „der Prophet“ ohne erklärende Erweiterung im Haupttext
  alternative: „der Prophet wie Mose“ beziehungsweise eine unspezifische Wiedergabe als „ein Prophet“
  rationale: Der griechische Artikel bezeichnet offenbar eine bekannte Erwartung, doch der Vers benennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit; die wahrscheinliche Anspielung wird nur in der Fußnote genannt.
- issue: Johannes’ Verneinung, Elija zu sein
  choice: Die Verneinung steht uneingeschränkt als „Ich bin es nicht“
  alternative: Eine Erläuterung wie „nicht im wörtlichen Sinn“ oder eine Harmonisierung mit anderen Evangelienstellen
  rationale: Der Wortlaut enthält eine direkte Verneinung. Eine harmonisierende Deutung würde dem Vers etwas hinzufügen und seine theologische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Dialogführung. Das historische Präsens wird entsprechend dem griechischen Text beibehalten; die wiederholten Verneinungen bleiben bewusst kurz.
