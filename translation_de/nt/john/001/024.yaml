  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: de
  text: Und sie waren von den Pharisäern ausgesandt worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit stärkerer Betonung der Herkunft bzw. Zugehörigkeit: „Und sie waren aus dem Kreis der Pharisäer ausgesandt worden.“ Wörtlich steht „aus den Pharisäern“; die Präposition kann Herkunft stärker hervorheben als die Rolle der Pharisäer als Auftraggeber.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der schlichte Anschluss bewahrt den Erzählfluss, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: sie waren … gesandt worden
  rationale: Die Verbindung aus perfektem Partizip und Imperfekt beschreibt eine bereits erfolgte Sendung und den daraus bestehenden Zustand; die deutsche Plusquamperfektform gibt dies natürlich wieder.
- source_word: ἐκ
  choice: von
  rationale: Die Präposition bezeichnet hier zunächst Herkunft oder Ausgangspunkt. „Von“ bewahrt diese Offenheit besser als eine ausdrücklich handelnde Urheberschaft.
- source_word: τῶν Φαρισαίων
  choice: den Pharisäern
  rationale: Dies ist die übliche moderne deutsche Bezeichnung der religiösen Gruppe; der bestimmte Artikel ist in der Verschmelzung „von den“ enthalten.
theological_decisions:
- issue: Verhältnis der Abgesandten zu den Pharisäern
  choice: Die Männer waren von den Pharisäern gesandt worden; die Formulierung lässt Herkunft und Beauftragung anklingen, ohne die Präposition auf reine Urheberschaft festzulegen.
  alternative: „Sie waren aus dem Kreis der Pharisäer gesandt worden“, mit stärkerer Betonung ihrer Gruppenzugehörigkeit.
  rationale: ἐκ mit dem Genitiv bezeichnet unmittelbar den Ausgangspunkt. Im Deutschen kann „von den Pharisäern“ sowohl Herkunft als auch Beauftragung ausdrücken und erhält damit die im Griechischen verbleibende Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die relativ wörtliche Wortstellung bleibt gut verständlich und bewahrt die knappe Form des griechischen Satzes.
