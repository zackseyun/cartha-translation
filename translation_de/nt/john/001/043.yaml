id: JHN.1.43
reference: John 1:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: de
  text: 'Am nächsten Tag wollte Jesus nach Galiläa aufbrechen. Er findet Philippus und sagt zu ihm: »Folge mir!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Folge mir« kann sowohl das unmittelbare Mitgehen als auch den umfassenderen Ruf bezeichnen, Jesu Jünger zu werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die natürliche deutsche Zeitangabe wahrt die erzählerische Abfolge.
- source_word: ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: wollte Jesus nach Galiläa aufbrechen
  rationale: »Wollte« erhält den Willens- bzw. Absichtsaspekt von θέλω, ohne ihn zu »beschloss« zu verstärken. »Aufbrechen« gibt ἐξελθεῖν im deutschen Reisekontext idiomatisch wieder; »nach Galiläa« ist bei Regionen die natürliche Wiedergabe der Zielrichtung mit εἰς.
- source_word: εὑρίσκει Φίλιππον
  choice: Er findet Philippus
  rationale: Das Präsens erhält das historische Präsens des griechischen Erzählstils und dessen Lebendigkeit.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: und sagt zu ihm
  rationale: Das historische Präsens wird beibehalten. Jesus wird bereits im vorherigen Satz ausdrücklich genannt, sodass das deutsche Pronomen den Bezug eindeutig und den Satzfluss natürlich hält.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Die knappe, etablierte Formulierung umfasst sowohl das konkrete Mitgehen als auch den Ruf in die Nachfolge, ohne die Spannung zwischen beiden Bedeutungsaspekten aufzulösen.
theological_decisions:
- issue: Bedeutungsumfang des Rufes an Philippus
  choice: »Folge mir!« als offener Ruf, der konkretes Mitgehen und Jüngerschaft umfasst
  alternative: »Komm mit mir!« als bloße Aufforderung zur Reisebegleitung
  rationale: ἀκολουθέω kann im unmittelbaren Zusammenhang körperliches Folgen bezeichnen, trägt im Johannesevangelium hier aber zugleich den Sinn eines Rufes in die Jüngerschaft. Die traditionelle und natürliche deutsche Form bewahrt beide Ebenen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Übergang vom Vergangenheitstempus zum historischen Präsens bildet den auffälligen Tempuswechsel des griechischen Textes ab. Der Name wird nach üblicher deutscher Bibeltradition als »Philippus« wiedergegeben.
