base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: de
  text: Er war in der Welt, und die Welt kam durch ihn ins Dasein[a], und die Welt erkannte ihn nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „entstand durch ihn“ oder „wurde durch ihn geschaffen“. Das griechische Verb bedeutet, dass etwas entstand oder ins Dasein kam.'
    reason: lexical_alternative
  - marker: b
    text: '„Erkannte ihn nicht“ kann auch bedeuten: „kannte ihn nicht“, „erkannte ihn nicht als den, der er war“ oder „erkannte ihn nicht an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: Welt
  rationale: κόσμος steht dreimal im Vers. Die durchgängige Wiedergabe mit „Welt“ bewahrt sowohl den Bezug auf die geschaffene Welt als auch die mögliche Bedeutungsschattierung zur Menschheit, ohne die einzelnen Vorkommen vorschnell festzulegen.
- source_word: ἦν
  choice: war
  rationale: Der Imperfekt von εἰμί bezeichnet hier das fortdauernde Dasein beziehungsweise die Gegenwart des Logos in der Welt. „War“ gibt die schlichte Aussage natürlich wieder und wahrt den Gegensatz zu ἐγένετο.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet Vermittlung oder mittelbare Urheberschaft. „Durch ihn“ ist im Deutschen klar und entspricht derselben Aussage in Johannes 1,3.
- source_word: ἐγένετο
  choice: kam ins Dasein
  rationale: γίνομαι bezeichnet hier das Entstehen beziehungsweise Ins-Dasein-Kommen der Welt. Die Formulierung unterscheidet dieses Verb deutlich von ἦν („war“) und erhält so den Gegensatz zwischen dem Dasein des Logos und dem Entstehen der Welt.
- source_word: ἔγνω
  choice: erkannte
  rationale: γινώσκω kann „kennen“ oder „erkennen“ bedeuten und hier auch den Gedanken des Anerkennens einschließen. „Erkannte“ ist im Deutschen idiomatisch und lässt sowohl fehlende Erkenntnis als auch fehlende Anerkennung anklingen.
- source_word: αὐτοῦ / αὐτόν
  choice: ihn
  rationale: Die Pronomen beziehen sich auf den Logos im unmittelbaren Kontext. Das persönliche Maskulinum bewahrt diesen Bezug.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Subjekt wird mit „Er“ wiedergegeben und auf den Logos des unmittelbaren Zusammenhangs bezogen.
  alternative: Eine unpersönliche Wiedergabe mit „es“
  rationale: Der vorausgehende Kontext behandelt den Logos bereits als persönliche Größe und verwendet entsprechende Pronomen. „Er“ folgt dem Diskurszusammenhang, ohne über den Text hinauszugehen.
- issue: Schöpfungssprache in Bezug auf den Logos
  choice: „Die Welt kam durch ihn ins Dasein“
  alternative: „Die Welt wurde durch ihn geschaffen“
  rationale: Die gewählte Formulierung bewahrt den im griechischen Prolog erkennbaren Unterschied zwischen ἦν und ἐγένετο und legt zugleich die Art der vermittelten Urheberschaft nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die dreifache Wiederholung von „Welt“ und die verbindende Satzstruktur des griechischen Textes bleiben bewusst erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
