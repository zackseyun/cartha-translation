  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: de
  text: 'Zuerst fand er seinen eigenen Bruder Simon und sagte zu ihm: „Wir haben den Messias gefunden“ (was übersetzt heißt: der Gesalbte).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει οὗτος
  choice: fand er
  rationale: Das Demonstrativpronomen verweist im Zusammenhang auf Andreas. Der historische Präsens wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: πρῶτον
  choice: Als Erstes
  rationale: Die adverbiale Lesart bezeichnet am natürlichsten die erste Handlung des Andreas; die textkritische Alternative wird in einer Fußnote bewahrt.
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: seinen eigenen Bruder
  rationale: „Eigenen“ erhält die durch ἴδιον gesetzte Hervorhebung; „Bruder“ entspricht der männlichen Form und dem konkreten Zusammenhang.
- source_word: Σίμωνα
  choice: Simon
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Auch dieser historische Präsens wird im deutschen Erzählstil als Präteritum wiedergegeben; „sagte zu ihm“ bleibt nahe an der griechischen Formulierung.
- source_word: Εὑρήκαμεν
  choice: Wir haben ... gefunden
  rationale: 'Das deutsche Perfekt gibt den griechischen Perfektaspekt natürlich wieder: Die Entdeckung ist erfolgt und für die Gegenwart der Sprecher bedeutsam.'
- source_word: Μεσσίαν
  choice: Messias
  rationale: Der aus dem Semitischen übernommene Titel wird in seiner etablierten deutschen Form beibehalten.
- source_word: μεθερμηνευόμενον χριστός
  choice: 'das heißt übersetzt: „der Gesalbte“'
  rationale: Die Formulierung erhält die erklärende Funktion des griechischen Einschubs. „Der Gesalbte“ gibt die Bedeutung von χριστός für heutige deutschsprachige Leser verständlich wieder; die traditionelle Form „Christus“ steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des messianischen Titels und seiner griechischen Erklärung
  choice: „Messias“ mit der Bedeutungserklärung „der Gesalbte“
  alternative: „Messias“ mit der Übersetzung „Christus“
  rationale: Der Ausgangstext stellt den semitischen Titel Μεσσίας seinem griechischen Äquivalent χριστός gegenüber. Da „Christus“ im Deutschen meist nicht mehr als verständliche Übersetzung wahrgenommen wird, bewahrt „der Gesalbte“ die erklärende Wirkung, während die traditionelle Form in der Fußnote genannt wird.
- issue: Bezug von πρῶτον und textkritische Variante
  choice: '„Als Erstes“: Andreas fand zunächst Simon'
  alternative: '„Als Erster“: Andreas war der Erste, der seinen Bruder fand'
  rationale: Das im SBLGNT gedruckte adverbiale πρῶτον stützt die zeitliche Abfolge der Handlung. Die Variante πρῶτος ermöglicht den Vergleich mit einer anderen Person und wird deshalb nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die historischen Präsensformen werden natürlich im Präteritum wiedergegeben. Direkte Rede und erklärender Einschub bleiben klar erkennbar; die semantische Beziehung zwischen „Messias“ und χριστός wird für heutige Leser transparent gemacht.
