review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsatz gibt den griechischen Text im Wesentlichen treffend wieder: πρῶτον ist adverbial („zuerst“), ἴδιον wird mit „eigenen“ berücksichtigt, und der Perfekt Εὑρήκαμεν ist mit „Wir haben ... gefunden“ angemessen wiedergegeben. Die Fußnote a behauptet jedoch ohne Grundlage in der vorgelegten SBLGNT-Textbasis eine Textvariante zu πρῶτον/πρῶτος und sollte nicht stehen. Die Parenthese soll χριστός als erklärende Übersetzung von Μεσσίας erkennbar machen.'
  naturalness: '„Zuerst fand er“ ist im modernen Standarddeutsch direkter und idiomatischer als das etwas schwerfällige „Als Erstes fand er“. „Was übersetzt heißt: der Gesalbte“ ist eine natürliche, knappe Form für die erklärende Parenthese.'
  terminology: „Messias“ ist die etablierte deutsche Form von Μεσσίας. „der Gesalbte“ gibt χριστός semantisch wieder und erhält die erklärende Funktion der griechischen Parenthese, statt bloß einen für viele Leser nicht mehr transparenten Titel zu wiederholen.
  issues:
  - severity: medium
    issue: Fußnote a führt eine nicht belegte Textvariante ein.
    rationale: Der vorgelegte SBLGNT-Quelltext liest πρῶτον. Die Fußnote behauptet eine Variante mit „Als Erster“, ohne dass dafür in den bereitgestellten Quelldaten ein textkritischer Nachweis oder eine Apparatsignatur vorhanden ist. Sie erzeugt daher einen unbegründeten Variantenanspruch.
  - severity: low
    issue: Der Anker [a] ist an „Simon“ gesetzt, obwohl seine behauptete Variante πρῶτον am Satzanfang betrifft.
    rationale: Auch falls eine solche Variante dokumentiert wäre, müsste ihr Anker bei „Zuerst“ stehen, nicht beim Namen Simon.
  - severity: low
    issue: Die Fußnote b ist für den revidierten Wortlaut entbehrlich.
    rationale: Die Übersetzung „der Gesalbte“ wird im Text bereits transparent erklärt. Ein Hinweis auf die traditionelle Wiedergabe „Christus“ ist keine erforderliche Text- oder Übersetzungsanmerkung.
