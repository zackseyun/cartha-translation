  to: 'Zuerst fand er seinen eigenen Bruder Simon und sagte zu ihm: „Wir haben den Messias gefunden“ (was übersetzt heißt: der Gesalbte).'
  rationale: Die unbelegte Variantenfußnote wird entfernt. Der Satzanfang wird idiomatischer gefasst, ohne die adverbiale Bedeutung von πρῶτον zu verändern. Die Parenthese bewahrt die im Ausgangstext vorhandene Übersetzungs- und Erklärungsfunktion von χριστός durch „der Gesalbte“.
