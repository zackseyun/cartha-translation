id: JHN.1.30
reference: John 1:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: de
  text: 'Das ist der, von dem ich sagte: »Nach mir kommt ein Mann, der mir voraus ist[a], denn er war vor mir[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der den Vorrang vor mir erlangt hat«. Die griechische Wendung kann ein Voraus-Sein oder einen höheren Rang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »denn er existierte schon vor mir«. Im Zusammenhang weist die Aussage wahrscheinlich auf Jesu Präexistenz hin; der griechische Wortlaut sagt jedoch knapper: »Er war vor mir.«'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Das ist der
  rationale: Die demonstrative Identifikation wird knapp und im modernen Deutschen natürlich wiedergegeben; zugleich bleibt die Hervorhebung der bezeichneten Person erhalten.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: von dem ich sagte
  rationale: ὑπέρ bezeichnet hier nach εἶπον die Person, über die Johannes zuvor gesprochen hat. „Von dem“ ist knapp, idiomatisch und entspricht dem Bezugssinn.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Nach mir kommt
  rationale: ὀπίσω mit Genitiv bezeichnet hier die Folge nach Johannes. Die Wortstellung bewahrt den Kontrast zwischen „nach mir“ und „vor mir“.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Das ausdrücklich maskuline Substantiv bezeichnet Jesus als konkrete männliche Person und wird ohne Verallgemeinerung wiedergegeben.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: der mir voraus ist
  rationale: Das Perfekt γέγονεν bezeichnet einen eingetretenen Zustand; zusammen mit ἔμπροσθεν kann die Wendung Vorrang oder ein Voraus-Sein ausdrücken. „Mir voraus ist“ ist natürlich und lässt diese Bedeutungsbreite eher offen als eine rein zeitliche Formulierung.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das vorausgehende Voraus-Sein ein. „Denn“ gibt diesen kausalen Zusammenhang in würdigem, flüssigem Deutsch wieder.
- source_word: πρῶτός μου ἦν
  choice: er war vor mir
  rationale: Die knappe Formulierung bewahrt die Spannung zwischen zeitlicher Priorität und Vorrang. Im johanneischen Zusammenhang lässt sie die Aussage über Jesu Präexistenz hervortreten, ohne sie durch einen Zusatz ausdrücklich auszudeuten.
theological_decisions:
- issue: Wie ausdrücklich die Schlussklausel auf Christi Präexistenz bezogen werden soll
  choice: er war vor mir
  alternative: er existierte schon vor mir
  rationale: Der Kontext legt Jesu Präexistenz stark nahe, doch der griechische Wortlaut formuliert knapper. Die gewählte Fassung bewahrt sowohl den möglichen zeitlichen Sinn als auch den Anklang an Vorrang, statt die theologische Spannung aufzulösen.
- issue: Ob ἔμπροσθέν μου γέγονεν ausschließlich als Rangvorrang wiederzugeben ist
  choice: der mir voraus ist
  alternative: der den Vorrang vor mir erlangt hat
  rationale: Die griechische Wendung kann Überlegenheit beziehungsweise Vorrang bezeichnen, ist aber nicht auf eine ausdrücklich hierarchische Aussage beschränkt. „Mir voraus ist“ hält den Sinn offen und verbindet sich schlüssig mit der folgenden Begründung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Zeugnisstil. Der wiederholte Gegensatz „nach mir“/„vor mir“ bleibt erhalten. Die Fußnoten erläutern echte lexikalische und theologische Mehrdeutigkeit, ohne sie im Haupttext einseitig aufzulösen.
