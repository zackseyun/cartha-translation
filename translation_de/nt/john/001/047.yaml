  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: de
  text: 'Jesus sah Natanaël auf sich zukommen und sagte über ihn: „Sieh, da ist wirklich ein Israelit, in dem keine Falschheit ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ natürlich und würdevoll wieder.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: ein wahrer Israelit
  rationale: Im Deutschen bringt die attributive Form den Sinn ‚wirklich/wahrhaft ein Israelit‘ idiomatisch zum Ausdruck, ohne die Aussage weiter auszudeuten.
- source_word: δόλος
  choice: Falsch
  rationale: Bezeichnet Arglist, Täuschung oder Hinterlist. ‚Falsch‘ bewahrt hier die knappe, charakterbezogene Aussage und den möglichen Anklang an alttestamentliche Formulierungen.
theological_decisions:
- issue: Bedeutung von ‚Israelit‘ und ‚kein δόλος‘
  choice: Die Aussage bleibt als Jesu Charakterisierung Natanaëls stehen.
  alternative: Ausdeutung als Aussage über einen ‚wahren geistlichen Israeliten‘ oder als ausdrücklicher Jakob-Kontrast.
  rationale: Der griechische Text erklärt die theologische Tragweite nicht ausdrücklich; mögliche Anspielungen sollen nicht zur Hauptaussage gemacht werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die wörtlich mögliche Folge ‚wahrhaftig ein Israelit‘ wurde zugunsten der natürlicheren Formulierung ‚ein wahrer Israelit‘ geglättet.
