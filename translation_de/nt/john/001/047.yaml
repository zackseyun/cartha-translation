    issue: „Seht“ steht im Plural.
    rationale: Ἴδε ist ein Singularimperativ. Das Deutsche sollte nicht ohne textlichen Anlass einen pluralischen Adressaten einführen.
  - severity: low
    issue: „kein Falsch“ ist nicht modernes Standarddeutsch.
    rationale: Die Formulierung wirkt stark bibelsprachlich-archaisch. „keine Falschheit“ ist verständlich und bewahrt die Aussage über das Fehlen von δόλος.
  - severity: low
    issue: „ein wahrer Israelit“ kann ἀληθῶς leicht als definierende Wesensaussage lesen lassen.
    rationale: „wirklich ein Israelit“ hält den adverbialen Nachdruck von ἀληθῶς unmittelbarer fest, ohne eine weitergehende Auslegung nahezulegen.
