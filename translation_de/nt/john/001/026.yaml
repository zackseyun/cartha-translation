  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: de
  text: 'Johannes antwortete ihnen: „Ich taufe mit Wasser. Mitten unter euch steht einer, den ihr nicht kennt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Johannes antwortete ihnen
  rationale: Die natürliche deutsche Redeform gibt sowohl das finite Verb als auch das die Antwort einleitende Partizip wieder; ein zusätzliches „und sagte“ wäre im Deutschen schwerfällig.
- source_word: βαπτίζω
  choice: taufe
  rationale: „Taufen“ ist hier der etablierte, kontextgerechte Ausdruck; „untertauchen“ würde die Bedeutung unnötig verengen.
- source_word: ἐν ὕδατι
  choice: mit Wasser
  rationale: Obwohl ἐν örtlich „in“ bedeuten kann, ist „mit Wasser taufen“ im modernen Deutschen die natürliche und semantisch offene Formulierung.
- source_word: μέσος ὑμῶν
  choice: mitten unter euch
  rationale: Die Wendung gibt die Anwesenheit innerhalb der angesprochenen Gruppe idiomatisch und mit dem Nachdruck von μέσος wieder.
- source_word: ἕστηκεν
  choice: steht
  rationale: Das deutsche Präsens bringt den gegenwärtigen, aus dem griechischen Perfekt resultierenden Zustand natürlich zum Ausdruck.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: den ihr nicht kennt
  rationale: „Kennen“ bewahrt die breite Bedeutung von οἶδα; „erkennen“ würde die Aussage stärker auf fehlende Identifizierung festlegen.
theological_decisions:
- issue: Identität des ungenannten Mannes in ihrer Mitte
  choice: „einer“ ohne ausdrückliche Identifizierung
  alternative: „der Messias“ oder „er“
  rationale: Der weitere Zusammenhang weist auf Jesus, doch der Vers selbst nennt ihn noch nicht. Die unbestimmte Wiedergabe bewahrt die beabsichtigte narrative Spannung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert, ohne den ungenannten Referenten theologisch vorzeitig zu identifizieren.
