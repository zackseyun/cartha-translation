  source_fidelity: Die Übersetzung gibt ἀπεκρίθη αὐτοῖς, βαπτίζω ἐν ὕδατι, μέσος ὑμῶν ἕστηκεν und ὃν ὑμεῖς οὐκ οἴδατε vollständig und sachgerecht wieder. Das deutsche Präsens „steht“ vermittelt die gegenwartsbezogene stative Kraft von ἕστηκεν angemessen. Der ungenannte Referent bleibt wie im griechischen Text unbestimmt.
  naturalness: „Johannes antwortete ihnen“ und die anschließende direkte Rede sind flüssiges modernes Standarddeutsch. „Mit Wasser taufen“ ist idiomatisch; „mitten unter euch“ ist klar und würdig, ohne künstlich zu wirken.
  terminology: „Taufen“ ist der etablierte und angemessene Terminus. „Mit Wasser“, „einer“ und „den ihr nicht kennt“ bewahren jeweils die semantische Offenheit des Ausgangstextes und vermeiden eine vorzeitige messianische Identifizierung oder die engere Deutung „erkennt“.
