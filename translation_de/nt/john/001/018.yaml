revisions:
- from: Niemand hat Gott jemals gesehen. Der einzige Gott[a], der am Herzen des Vaters ist[b], hat ihn bekannt gemacht.[c]
  to: Niemand hat Gott jemals gesehen. Der einzigartige Gott[a], der im Schoß des Vaters ist[b], hat ihn bekannt gemacht[c].
  rationale: Die Revision präzisiert die Wiedergabe von μονογενὴς θεός, erhält die konkrete Metapher von κόλπος und setzt den Anker für ἐξηγήσατο an die zugehörige Verbform. Die strittige Lesart »der einzige Sohn« bleibt transparent als textkritische Fußnote vermerkt.
