  variant: modern standard German
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: de
  text: Niemand hat Gott jemals gesehen. Der einzigartige Gott[a], der im Schoß des Vaters ist[b], hat ihn bekannt gemacht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen »der einzige Sohn« (oder: »der einziggezeugte Sohn«) statt »der einzigartige Gott«.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »der dem Vater ganz nahe ist«. Das Griechische lautet wörtlich »im Schoß des Vaters« und drückt innige Nähe aus.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »hat ihn erschlossen«, »hat ihn erklärt« oder »hat ihn offenbart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Gott
  rationale: Direktes Objekt von ἑώρακεν; die übliche Wiedergabe von θεός, das hier absolut von Gott gebraucht wird.
- source_word: οὐδεὶς
  choice: Niemand
  rationale: Natürliches modernes Deutsch, das die uneingeschränkte Verneinung bewahrt.
- source_word: ἑώρακεν πώποτε
  choice: hat … jemals gesehen
  rationale: Das Perfekt zusammen mit πώποτε wird im Deutschen idiomatisch durch »hat … jemals gesehen« wiedergegeben.
- source_word: μονογενὴς θεὸς
  choice: der einzige Gott
  rationale: Der gedruckte SBLGNT-Text liest θεός. μονογενής bezeichnet hier den Einzigen beziehungsweise Einzigartigen; »der einzige Gott« ist verständlich und bewahrt die auffällige christologische Aussage des Ausgangstextes.
- source_word: ὁ ὢν
  choice: der … ist
  rationale: Das substantivierte Partizip wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: am Herzen des Vaters
  rationale: Die Formulierung bewahrt das Bild inniger Nähe, ohne das im heutigen Deutsch missverständliche oder altertümliche »im Schoß des Vaters« in den Haupttext zu setzen.
- source_word: πατρὸς
  choice: des Vaters
  rationale: Bestimmter Beziehungstitel im johanneischen Sprachgebrauch.
- source_word: ἐξηγήσατο
  choice: hat ihn bekannt gemacht
  rationale: Das Verb kann erzählen, darlegen oder erschließen bedeuten. Im Kontext bezeichnet es die Offenbarung Gottes; »bekannt gemacht« ist klar, idiomatisch und legt die Art dieser Offenbarung nicht unnötig fest.
theological_decisions:
- issue: Textlesart μονογενὴς θεὸς gegenüber ὁ μονογενὴς υἱός
  choice: Im Haupttext steht gemäß SBLGNT »der einzige Gott«.
  alternative: »der einzige Sohn« beziehungsweise traditionell »der einziggezeugte Sohn«
  rationale: Die vorgegebene Ausgangsausgabe liest μονογενὴς θεός. Da die Variante textkritisch und christologisch bedeutsam ist, wird sie in einer Fußnote ausdrücklich dokumentiert, statt stillschweigend harmonisiert zu werden.
- issue: Bedeutung von μονογενής
  choice: einzige
  alternative: einzigartig; einziggezeugt
  rationale: Der gegenwärtige lexikalische Befund spricht primär für Einzigkeit beziehungsweise Einzigartigkeit. »Einziggezeugt« ist traditionsreich, könnte aber den Eindruck erwecken, der Begriff selbst bezeichne ausdrücklich den Vorgang des Zeugens.
- issue: Bezug des unausgesprochenen Objekts bei ἐξηγήσατο
  choice: »ihn« bezieht sich auf Gott im ersten Satz.
  alternative: Explizit »Gott« wiederholen
  rationale: Der Kontext legt Gott als Gegenstand des Bekanntmachens nahe. Das Pronomen bewahrt die knappe Struktur und den gedanklichen Zusammenhang des griechischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei Hauptsätze vermeiden eine schwerfällige Satzperiode. »Am Herzen des Vaters« erhält das Bild persönlicher Nähe in heute verständlicher Sprache; die wörtlichere Form wird in der Fußnote genannt. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
