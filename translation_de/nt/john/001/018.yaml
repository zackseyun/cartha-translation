review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem SBLGNT-Grundtext grundsätzlich, einschließlich der Lesart μονογενὴς θεός und des impliziten Objekts von ἐξηγήσατο. »Der einzige Gott« kann jedoch im Deutschen vor allem bedeuten: der einzig existierende Gott. Für μονογενής ist »der einzigartige Gott« präziser, da es die Einzigartigkeit des Bezeichneten ausdrückt, ohne eine zusätzliche Aussage über das Nichtvorhandensein anderer Götter in den Ausdruck hineinzulegen. »Am Herzen des Vaters« gibt die Bildsprache von κόλπος nur frei wieder; »im Schoß des Vaters« bewahrt das griechische Bild direkt und ist in würdigem modernem Bibeldeutsch verständlich.'
  naturalness: Die Satzfolge ist klar und modernes Standarddeutsch. »Hat ihn bekannt gemacht« ist eine idiomatische Wiedergabe von ἐξηγήσατο. Die Fußnotenanker sollten unmittelbar an den jeweiligen Bezugsausdrücken stehen; im Entwurf steht Marker c nach dem Satzzeichen statt beim Verb.
  terminology: »Vater« und »Gott« sind angemessen. »Einzigartig« entspricht bei μονογενής dem Sinn „einzig/ohnegleichen“ besser als »einzig«, das im Deutschen leicht monotheistisch-quantitativ verstanden wird. Die textkritische Alternative bleibt ausdrücklich dokumentiert, ohne die SBLGNT-Lesart im Haupttext zu verdrängen.
  issues:
  - severity: medium
    issue: Die Wiedergabe »der einzige Gott« ist im Deutschen semantisch missverständlich.
    rationale: Sie wird gewöhnlich als Aussage verstanden, dass Gott der allein existierende Gott sei. μονογενής bezeichnet in dieser Verbindung primär Einzigkeit bzw. Einzigartigkeit. »Der einzigartige Gott« wahrt diese Nuance besser.
  - severity: low
    issue: »Am Herzen des Vaters« ersetzt die konkrete Bildsprache von κόλπος.
    rationale: Die Formulierung ist verständlich, aber stärker interpretierend. »Im Schoß des Vaters« erhält das griechische Bild von innigster Nähe; die idiomatischere Alternative kann in der Fußnote stehen.
  - severity: low
    issue: Fußnotenmarker c ist nicht unmittelbar beim Bezugswort platziert.
    rationale: Der Marker gehört an »bekannt gemacht«, das ἐξηγήσατο wiedergibt, nicht hinter den Schlusspunkt.
