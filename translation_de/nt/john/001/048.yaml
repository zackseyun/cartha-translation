reference: John 1:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: de
  text: 'Nathanael sagte zu ihm: „Woher kennst du mich?“ Jesus antwortete ihm: „Noch bevor Philippus dich rief, sah ich dich unter dem Feigenbaum.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Woher kennst du mich?
  rationale: „Woher“ entspricht Πόθεν unmittelbar und ist zusammen mit „kennen“ auch im modernen Deutschen eine natürliche Frage nach der Quelle oder Grundlage von Jesu Kenntnis.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die griechische Doppelwendung „antwortete und sagte zu ihm“ ist semitisch geprägter Erzählstil. Im Deutschen gibt „antwortete ihm“ ihren Aussagegehalt natürlich und vollständig wieder.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Noch bevor Philippus dich rief
  rationale: Die Konstruktion Πρὸ τοῦ mit Infinitiv bezeichnet Vorzeitigkeit. „Noch bevor“ hebt die im Kontext wichtige zeitliche Priorität idiomatisch hervor.
- source_word: φωνῆσαι
  choice: rief
  rationale: φωνέω bedeutet hier „rufen“; das Präteritum passt zur erzählenden direkten Rede und lässt offen, ob ein Herbeirufen oder Ansprechen gemeint ist.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: unter dem Feigenbaum
  rationale: Das Partizip beschreibt Nathanaels damaligen Aufenthaltsort. Im Deutschen kann dies knapp und natürlich in die Aussage „sah ich dich unter dem Feigenbaum“ einbezogen werden.
- source_word: εἶδόν σε
  choice: sah ich dich
  rationale: Der Aorist bezeichnet hier ein zurückliegendes Sehen; das deutsche Präteritum ist die passende Erzählform.
theological_decisions:
- issue: Art von Jesu Kenntnis Nathanaels
  choice: Die Aussage wird ohne Erklärung des Vorgangs unmittelbar als „sah ich dich“ wiedergegeben.
  alternative: Das Sehen ausdrücklich als übernatürliche Erkenntnis oder als gewöhnliche vorherige Beobachtung deuten.
  rationale: Der Vers erklärt nicht, auf welche Weise Jesus Nathanael sah oder kannte. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Frage „Woher kennst du mich?“ erhält die Bildlichkeit und Mehrdeutigkeit des griechischen Πόθεν besser als das stärker deutende „Wie kennst du mich?“. Keine Fußnote erforderlich.
