  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: de
  text: Am Anfang[a] war das Wort, und das Wort war bei Gott, und das Wort war Gott.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung erinnert an 1. Mose 1,1 und verbindet das Wort mit dem Anfang der Schöpfung.
    reason: cross_reference
  - marker: b
    text: 'Auch sinngemäß: „Das Wort war seinem Wesen nach Gott“ oder „Was Gott war, war das Wort.“ Die griechische Formulierung beschreibt hier die Wesensart des Wortes und unterscheidet es zugleich von „Gott“ im vorangehenden Satzteil.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Am Anfang
  rationale: Die Wendung gibt den zeitlichen Sinn natürlich wieder und bewahrt zugleich den deutlichen Anklang an 1. Mose 1,1.
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt von εἰμί wird schlicht und idiomatisch mit „war“ wiedergegeben; die Wiederholung erhält den feierlichen Rhythmus des griechischen Satzes.
- source_word: ὁ λόγος
  choice: das Wort
  rationale: „Das Wort“ bewahrt sowohl den Gedanken göttlicher Rede und Offenbarung als auch die im Kontext erkennbare personale Bedeutung, ohne einseitig philosophisch oder paraphrasierend zu übersetzen.
- source_word: πρὸς τὸν θεόν
  choice: bei Gott
  rationale: „Bei Gott“ ist im Deutschen die natürliche Wiedergabe der hier ausgedrückten persönlichen Beziehung und Gegenüberstellung. Das wörtlichere „auf Gott hin“ wäre unnötig sperrig und könnte eine Bewegung nahelegen.
- source_word: θεὸς ἦν ὁ λόγος
  choice: das Wort war Gott
  rationale: Die Formulierung gibt die qualitative Aussage über das Wesen des Wortes klar und knapp wieder, ohne das Wort mit der in der vorangehenden Aussage genannten Person Gottes gleichzusetzen. Die griechische Voranstellung von θεός wird zugunsten eines natürlichen deutschen Satzbaus nicht mechanisch nachgebildet.
theological_decisions:
- issue: Wiedergabe des artikellosen Prädikats θεός im letzten Satzteil
  choice: das Wort war Gott
  alternative: das Wort war göttlich; was Gott war, war das Wort
  rationale: Das vorangestellte, artikellose θεός beschreibt hier vor allem die Wesensart des Wortes. „Das Wort war Gott“ bewahrt die starke Aussage des Griechischen, während der vorhergehende Satzteil zugleich die personale Unterscheidung bestehen lässt. „Göttlich“ könnte im heutigen Deutschen eine bloß gottähnliche Eigenschaft nahelegen; die erläuternde Alternative ist zu paraphrastisch für den Haupttext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und rhythmischem Satzbau. „Am Anfang“ und „bei Gott“ sind natürlich und klar; „das Wort“ bewahrt die etablierte johanneische Bezeichnung. Die Fußnotenmarker wurden jeweils unmittelbar an die Aussage gesetzt, die sie erläutern.
