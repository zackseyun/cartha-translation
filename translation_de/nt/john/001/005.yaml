  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: de
  text: Und das Licht leuchtet in der Finsternis, und die Finsternis hat es nicht überwältigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Finsternis hat es nicht erfasst“ beziehungsweise „nicht begriffen“. Das griechische Verb kann sowohl „überwältigen“ als auch „ergreifen, erfassen“ und damit „begreifen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: das Licht
  rationale: Der bestimmte Artikel und der thematische Rückbezug im Prolog werden bewahrt.
- source_word: σκοτίᾳ / σκοτία
  choice: der Finsternis / die Finsternis
  rationale: „Finsternis“ gibt den bestimmten, personifiziert wirkenden Gegenpol zum Licht in einem würdigen und verständlichen Register wieder.
- source_word: φαίνει
  choice: leuchtet
  rationale: Das Präsens wird als fortdauernde, lebendige Aussage wiedergegeben, ohne den Aspekt zu überdehnen.
- source_word: κατέλαβεν
  choice: hat ... nicht überwältigt
  rationale: Im Bildgegensatz von Licht und Finsternis liegt die feindliche Bedeutung „überwältigen“ nahe; die ebenfalls mögliche Bedeutung „erfassen/begreifen“ bleibt in der Fußnote erhalten.
- source_word: αὐτό
  choice: es
  rationale: Das sächliche Pronomen entspricht grammatisch dem sächlichen Substantiv „Licht“, ohne den weiteren personalen Bezug des Prologs ausdrücklich in diesen Vers einzutragen.
theological_decisions:
- issue: Bedeutung von κατέλαβεν im Gegensatz zwischen Licht und Finsternis
  choice: hat es nicht überwältigt
  alternative: hat es nicht erfasst / begriffen
  rationale: Das Griechische erlaubt sowohl eine feindliche als auch eine kognitive Bedeutung. Der Haupttext folgt dem Konfliktbild, während die Fußnote die echte Mehrdeutigkeit und mögliche johanneische Bedeutungsfülle bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Bibelregister. „Finsternis“ bewahrt den markanten theologischen Bildkontrast; die Satzstruktur bleibt nahe am griechischen Parallelismus.
