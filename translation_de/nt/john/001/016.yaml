  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: de
  text: Denn aus seiner Fülle haben wir alle empfangen, und Gnade anstelle von Gnade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gnade über Gnade“ oder „eine Gnade nach der anderen“. Die griechische Wendung kann auf aufeinanderfolgende Gnadengaben hinweisen; ἀντί bedeutet grundlegend „anstelle von“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorangehende Aussage; „Denn“ bewahrt diese Funktion im Deutschen natürlich.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: aus seiner Fülle
  rationale: „Fülle“ gibt πλήρωμα knapp wieder, während „aus“ die Herkunft dessen bezeichnet, was empfangen wird.
- source_word: ἡμεῖς πάντες
  choice: wir alle
  rationale: Die ausdrückliche Verbindung von Pronomen und πάντες wird beibehalten und trägt den Nachdruck des Griechischen.
- source_word: ἐλάβομεν
  choice: haben … empfangen
  rationale: Das Perfekt ist im Deutschen hier idiomatisch und bringt den fortwirkenden Bezug des Empfangenen zur Gegenwart zum Ausdruck, ohne den Aorist als Verlaufsform zu deuten.
- source_word: καὶ
  choice: und zwar
  rationale: „Und zwar“ schließt die folgende Wendung natürlich als nähere Bestimmung dessen an, was aus seiner Fülle empfangen wurde; ein schlichtes „und“ ist ebenfalls möglich.
- source_word: χάριν ἀντὶ χάριτος
  choice: Gnade anstelle von Gnade
  rationale: „Anstelle von“ wahrt die grundlegende Austausch- beziehungsweise Ablösungsbedeutung von ἀντί und lässt offen, ob eine Gnadengabe auf eine andere folgt oder eine frühere Gnadenordnung ersetzt.
theological_decisions:
- issue: Deutung von χάριν ἀντὶ χάριτος
  choice: Gnade anstelle von Gnade
  alternative: Gnade über Gnade; eine Gnade nach der anderen
  rationale: Die umstrittene Wendung kann Ablösung, Austausch oder aufeinanderfolgende Gnade ausdrücken. Der Haupttext erhält mit „anstelle von“ die markante Grundbedeutung von ἀντί und löst die theologische Spannung nicht zugunsten einer ausschließlich steigernden Deutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „Gnade anstelle von Gnade“ ist bewusst quellennah; die geläufigeren, aber stärker deutenden Wiedergaben stehen in der Fußnote.
