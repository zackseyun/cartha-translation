  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: de
  text: 'Und ich habe es gesehen und bezeugt: Dieser ist der Erwählte Gottes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »der Sohn Gottes« statt »der Erwählte Gottes«.
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Und ich
  rationale: Die Verschmelzung von καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und betont zugleich den Sprecher, ohne die Betonung im Deutschen zu überzeichnen.
- source_word: ἑώρακα
  choice: habe es gesehen
  rationale: Das Perfekt bezeichnet das vollzogene Sehen mit fortdauernder Bedeutung. Das ergänzte „es“ macht die deutsche Formulierung natürlich und verweist auf das zuvor geschilderte Zeichen.
- source_word: μεμαρτύρηκα
  choice: bezeugt
  rationale: Das Perfekt beschreibt ein abgelegtes Zeugnis mit bleibender Gültigkeit. „Bezeugt“ ist prägnant, würdig und entspricht dem johanneischen Zeugniswortfeld.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet den Inhalt des Zeugnisses ein. Ein Doppelpunkt gibt diese Funktion im Deutschen idiomatisch wieder, ohne eine kausale Bedeutung nahezulegen.
- source_word: οὗτός
  choice: Dieser
  rationale: Das Demonstrativpronomen weist unmittelbar auf Jesus. „Dieser“ bewahrt den nachdrücklichen Zeigegestus des griechischen Textes.
- source_word: ἐκλεκτός
  choice: der Erwählte
  rationale: Das artikulierte Adjektiv wird substantivisch gebraucht. „Der Erwählte“ ist im modernen Deutschen verständlich und bewahrt den titelartigen Charakter.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird natürlich und knapp als deutscher Genitiv wiedergegeben; seine genaue Beziehungsnuance wird nicht unnötig auf „von Gott erwählt“ festgelegt.
theological_decisions:
- issue: Christologischer Titel in Johannes 1,34
  choice: der Erwählte Gottes
  alternative: der Sohn Gottes
  rationale: Der vorgegebene SBLGNT-Haupttext liest ὁ ἐκλεκτὸς τοῦ θεοῦ und wird daher unmittelbar übersetzt. Die bedeutende Variante „der Sohn Gottes“ wird in einer Fußnote dokumentiert, statt den Haupttext an die vertrautere Lesart anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gestaltet den Inhaltssatz natürlich; „Dieser“ und „der Erwählte Gottes“ erhalten den feierlichen, zeugnishaften Ton und die christologische Spannung der Textfassung.
