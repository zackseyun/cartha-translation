id: JHN.1.51
reference: John 1:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: de
  text: 'Und er sagt zu ihm: „Amen, amen, ich sage euch[a]: Ihr werdet den Himmel geöffnet sehen und die Engel Gottes auf den Menschensohn hinauf- und herabsteigen.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Euch“ und „ihr“ stehen im Griechischen im Plural, obwohl Jesus in der vorangehenden Erzählung Nathanael als Einzelnen anspricht.
    reason: lexical_alternative
  - marker: b
    text: Das Bild erinnert an Jakobs Traum in 1. Mose 28,12; hier ist das Auf- und Herabsteigen der Engel auf den Menschensohn bezogen.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die bekräftigende, feierliche Doppelformel bleibt in ihrer im Deutschen vertrauten biblischen Gestalt erhalten.
- source_word: ὑμῖν / ὄψεσθε
  choice: euch / ihr werdet sehen
  rationale: Die deutschen Formen geben den Plural des griechischen Pronomens und Verbs eindeutig wieder, obwohl Jesus zuvor zu Nathanael als Einzelperson spricht.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: den Himmel geöffnet sehen
  rationale: Das Perfektpartizip bezeichnet den Himmel im Zustand des Geöffnetseins; die Formulierung ist zugleich präzise und im Deutschen verständlich.
- source_word: ἀγγέλους
  choice: Engel
  rationale: Der Gottesbezug und die Anspielung auf 1. Mose 28 sprechen hier eindeutig für himmlische Engel, nicht allgemein für Boten.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: hinauf- und herabsteigen
  rationale: Das Richtungspaar bildet die Bewegung der Engel ab und hält den sprachlichen Widerhall von Jakobs Traum fest.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: auf den Menschensohn
  rationale: Die Wiedergabe bewahrt die auffällige räumliche Beziehung und lässt deren genaue bildhafte beziehungsweise theologische Ausdeutung offen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung und ihre biblisch-apokalyptischen Bezüge.
theological_decisions:
- issue: Wechsel von der singularischen Erzähladresse αὐτῷ zur pluralischen direkten Anrede ὑμῖν und ὄψεσθε
  choice: Der Plural wird im Haupttext ausdrücklich mit „euch“ und „ihr“ wiedergegeben.
  alternative: Die Anrede durch eine weniger eindeutige Formulierung nur auf Nathanael beziehen.
  rationale: Das Deutsche kann den im Griechischen markierten Numerus ohne Unnatürlichkeit sichtbar machen; dadurch bleibt die mögliche Ausweitung der Verheißung über Nathanael hinaus erhalten.
- issue: Bezug des Bildes vom Auf- und Herabsteigen der Engel
  choice: Das Bild wird ohne erklärende Erweiterung auf den Menschensohn bezogen.
  alternative: Im Haupttext ausdrücklich erklären, Jesus trete an die Stelle der Leiter aus Jakobs Traum.
  rationale: Die Anspielung ist deutlich, doch ihre theologische Deutung sollte nicht in den Wortlaut der Übersetzung eingefügt werden.
- issue: Bedeutung von ἐπί mit Akkusativ beim Menschensohn
  choice: „auf den Menschensohn“
  alternative: „über dem Menschensohn“ oder „am Menschensohn“
  rationale: „Auf“ wahrt die engste formale Entsprechung und die Spannung des Bildes; „über“ könnte eine bloße Position oberhalb nahelegen, „am“ die Beziehung stärker als im Ausgangstext auslegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Formel „Amen, amen“ und der Titel „Menschensohn“ erhalten die biblischen Bezüge; die klare Pluralanrede macht eine im Deutschen verfügbare grammatische Information direkt sichtbar.
