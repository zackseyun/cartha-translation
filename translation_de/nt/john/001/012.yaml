review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: den Kontrast (δέ), die umfassende Personengruppe (ὅσοι), das Aufnehmen Jesu, die Gabe der ἐξουσία, das Werden zu Kindern Gottes sowie die appositionelle Kennzeichnung als Glaubende an seinen Namen. „Kinder Gottes“ entspricht τέκνα θεοῦ präzise; „zu werden“ bewahrt den Aspekt des Eintritts in diesen Status.'
  naturalness: „Doch allen, die ihn aufnahmen, gab er das Recht, Kinder Gottes zu werden“ ist modernes, würdiges und syntaktisch klares Standarddeutsch. Die nachgestellte Doppelpunktkonstruktion ist als erläuternde Apposition verständlich und erhält die Doppelung des griechischen Satzes. „An seinen Namen glauben“ ist zwar religiös geprägter Sprachgebrauch, im vorliegenden biblischen Register jedoch idiomatisch und notwendig, um ὄνομα nicht auszulassen.
  terminology: „Das Recht“ ist für ἐξουσία in diesem Kontext eine gut begründete Hauptwiedergabe. Die Fußnote nennt mit „Vollmacht“ und „Befähigung“ tragfähige lexikalische Alternativen, ohne den Haupttext unnötig zu überladen. „Aufnahmen“ und „Kinder Gottes“ sind terminologisch sachgerecht und nicht unnötig konfessionell zugespitzt.
