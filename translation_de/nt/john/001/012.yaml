source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: de
  text: 'Doch allen, die ihn aufnahmen, gab er das Recht[a], Kinder Gottes zu werden: denen, die an seinen Namen glauben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Vollmacht oder die Befähigung; das griechische Wort kann eine verliehene Berechtigung, Vollmacht oder Fähigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι δὲ
  choice: Doch allen, die
  rationale: ὅσοι bezeichnet die Gesamtheit der betreffenden Menschen; „allen, die“ ist im modernen Deutsch natürlich. „Doch“ gibt den Gegensatz zur Ablehnung im vorherigen Vers wieder.
- source_word: ἔλαβον αὐτόν
  choice: ihn aufnahmen
  rationale: λαμβάνω meint hier, den Logos anzunehmen beziehungsweise willkommen zu heißen, nicht ihn körperlich zu ergreifen. „Aufnahmen“ bewahrt das Bild des Empfangens, ohne es auf bloße gedankliche Zustimmung zu verengen.
- source_word: ἔδωκεν αὐτοῖς
  choice: gab er
  rationale: Die einfache Wiedergabe entspricht δίδωμι; der Gedanke einer Gewährung ergibt sich aus dem Gegenstand ἐξουσία.
- source_word: ἐξουσίαν
  choice: das Recht
  rationale: Im Zusammenhang bezeichnet ἐξουσία eine verliehene Berechtigung oder Befugnis. „Das Recht“ ist klar und idiomatisch; die ebenfalls möglichen Nuancen „Vollmacht“ und „Befähigung“ werden in der Fußnote kenntlich gemacht.
- source_word: τέκνα θεοῦ
  choice: Kinder Gottes
  rationale: τέκνα ist eine geschlechtsübergreifende Bezeichnung für Kinder und bedeutet nicht speziell „Söhne“.
- source_word: γενέσθαι
  choice: zu werden
  rationale: Der Infinitiv von γίνομαι bezeichnet den Eintritt in einen neuen Zustand; „werden“ erhält diesen Übergangscharakter.
- source_word: τοῖς πιστεύουσιν
  choice: denen, die … glauben
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die durch Glauben gekennzeichnet sind. Die verbale Form „glauben“ ist im Deutschen unmittelbar und natürlich.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: an seinen Namen
  rationale: πιστεύειν εἰς bezeichnet ein auf jemanden oder etwas gerichtetes Vertrauen. „An seinen Namen glauben“ bewahrt ὄνομα und verweist auf die in seinem Namen offenbarte Person und Identität, ohne dies ausdeutend in den Haupttext einzutragen.
theological_decisions:
- issue: Verhältnis zwischen „ihn aufnehmen“ und „an seinen Namen glauben“
  choice: Beide Wendungen werden wiedergegeben; die zweite wird durch einen Doppelpunkt als nähere Bestimmung der zuvor genannten Menschen angeschlossen.
  alternative: Beide Ausdrücke zu einer einzigen Aussage zusammenziehen oder sie als zwei getrennte Gruppen verstehen.
  rationale: Der griechische Text bewahrt beide Formulierungen und setzt τοῖς πιστεύουσιν appositionell zu αὐτοῖς beziehungsweise ὅσοι. Die Übersetzung erhält diese johanneische Doppelung, ohne ihr Verhältnis stärker zu definieren als der Text.
- issue: Bedeutung von ἐξουσία im Zusammenhang der Gotteskindschaft
  choice: „das Recht“ im Haupttext, mit lexikalischen Alternativen in der Fußnote
  alternative: „die Vollmacht“, „die Macht“ oder „die Befähigung“ ohne Hinweis auf die Bedeutungsbreite
  rationale: Der Zusammenhang legt eine verliehene Berechtigung nahe, doch ἐξουσία kann auch Vollmacht oder Befähigung bezeichnen. Die Fußnote bewahrt diese echte lexikalische Spannweite.
- issue: Bezeichnung der Gotteskindschaft
  choice: „Kinder Gottes“
  alternative: „Söhne Gottes“
  rationale: Das Griechische verwendet τέκνα und nicht das männlich spezifizierende υἱοί. „Kinder Gottes“ ist daher sachlich und geschlechtlich genau.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ macht den Kontrast zum vorangehenden Vers sichtbar; der Doppelpunkt hält die appositionelle Erläuterung verständlich. Der Fußnotenmarker steht unmittelbar bei „Recht“, auf das sich die lexikalische Anmerkung bezieht.
