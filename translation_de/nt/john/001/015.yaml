  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: de
  text: 'Johannes legt Zeugnis über ihn ab und hat laut gerufen: „Dieser war es, von dem ich sagte: Der nach mir Kommende ist mir voraus[a], denn er war vor mir[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat Vorrang vor mir erlangt“ beziehungsweise „hat mich übertroffen“. Die griechische Wendung kann sowohl zeitliche Priorität als auch Vorrang oder Rang ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn er existierte schon vor mir“. „Er war vor mir“ folgt dem griechischen Wortlaut enger und lässt zugleich die im Zusammenhang liegende Aussage von seiner Präexistenz zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ περὶ αὐτοῦ
  choice: legt Zeugnis über ihn ab
  rationale: Das Präsens wird beibehalten und der Zeugencharakter von μαρτυρέω klar und in modernem Deutsch wiedergegeben.
- source_word: κέκραγεν λέγων
  choice: hat laut gerufen
  rationale: Das Perfekt κέκραγεν wird mit deutschem Perfekt wiedergegeben; „laut gerufen“ bewahrt die nachdrückliche öffentliche Äußerung, während das folgende Zitat das partizipiale λέγων natürlich aufnimmt.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Dieser war es, von dem ich sagte
  rationale: Die Vergangenheitsform ἦν und die Relativkonstruktion bleiben erhalten, ohne im Deutschen altertümlich zu wirken.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Der nach mir Kommende
  rationale: Die substantivierte Partizipialform und die zeitliche beziehungsweise aufeinanderfolgende Bedeutung von ὀπίσω μου werden knapp bewahrt.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ist mir voraus geworden
  rationale: Die ungewöhnliche Formulierung erhält sowohl das Perfekt von γίνομαι als auch das Bild räumlicher oder rangmäßiger Priorität in ἔμπροσθεν, ohne sich ausschließlich auf Rang oder zeitliche Reihenfolge festzulegen.
- source_word: ὅτι πρῶτός μου ἦν
  choice: denn er war vor mir
  rationale: „Denn“ gibt die begründende Funktion von ὅτι wieder. „Er war vor mir“ bleibt nahe an der knappen griechischen Formulierung und lässt den Kontext ihre Aussage über Präexistenz entfalten.
theological_decisions:
- issue: Wie ausdrücklich die Schlussklausel auf Christi Präexistenz bezogen werden soll
  choice: „denn er war vor mir“
  alternative: „denn er existierte schon vor mir“
  rationale: Der Kontext legt Präexistenz nahe, doch πρῶτός μου ἦν formuliert dies nicht mit einem eigenen Verb für Existenz. Die gewählte Wiedergabe wahrt die theologische Aussagekraft und zugleich die Spannung des griechischen Wortlauts.
- issue: Ob ἔμπροσθέν μου γέγονεν ausschließlich als Rangvorrang zu deuten ist
  choice: „ist mir voraus geworden“
  alternative: „hat Vorrang vor mir erlangt“ / „hat mich übertroffen“
  rationale: Die griechische Wendung kann zeitliche Priorität, Vorrang oder Überlegenheit ausdrücken. Die Hauptübersetzung hält diese Bedeutungsbreite offen; die Fußnote nennt die stärker deutenden Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst auffällige Wendung „ist mir voraus geworden“ spiegelt die sprachliche Spannung des Originals; zwei Fußnoten erläutern die echten Deutungsmöglichkeiten, ohne sie im Haupttext festzulegen.
