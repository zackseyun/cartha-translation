  source_fidelity: Die Übersetzung gibt die Satzstruktur, das Präsens von μαρτυρεῖ, das Perfekt von κέκραγεν und die begründende Funktion von ὅτι insgesamt zuverlässig wieder. „Der nach mir Kommende“ und „denn er war vor mir“ bewahren die absichtliche Mehrschichtigkeit von zeitlicher Reihenfolge, Vorrang und – im Kontext – Präexistenz. Bei ἔμπροσθέν μου γέγονεν ist „ist mir voraus geworden“ zwar sehr nah am griechischen Bild, im modernen Standarddeutsch jedoch keine natürliche oder klar verständliche Wendung.
  naturalness: „Johannes legt Zeugnis über ihn ab“ und „hat laut gerufen“ sind würdig und verständlich. „Ist mir voraus geworden“ klingt hingegen künstlich und ist im heutigen Deutsch schwer zugänglich. „Ist mir voraus“ ist idiomatisch und lässt, wie das Griechische, sowohl Vorrang als auch Reihenfolge anklingen.
  terminology: „Zeugnis ablegen“ trifft den Zeugencharakter von μαρτυρεῖ angemessen. „Kommende“ ist als substantiviertes Partizip passend. Die zurückhaltende Wiedergabe „er war vor mir“ überträgt πρῶτός μου ἦν ohne eine konfessionell bestimmte Auslegung in den Text einzutragen. Die Fußnoten sind korrekt an den einschlägigen Stellen verankert und erläutern die Alternativen ausgewogen.
