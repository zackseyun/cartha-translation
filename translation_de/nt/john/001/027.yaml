  terminology: „Würdig“ bewahrt die Demuts- und Angemessenheitsnuance von ἄξιος. „Sandalenriemen“ ist gegenüber allgemeineren Begriffen wie „Schuhriemen“ kulturell und lexikalisch genauer. Die Fußnote ist sachlich, angemessen knapp und korrekt am Ausdruck „kommt“ verankert.
