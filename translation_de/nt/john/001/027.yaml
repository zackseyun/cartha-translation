source:
  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: de
  text: der nach mir kommt[a], dessen Sandalenriemen zu lösen ich nicht würdig bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der nach mir Kommende“.'
    reason: Die Fußnote macht die substantivierte Partizipialkonstruktion des Griechischen sichtbar, während der Haupttext natürliches modernes Deutsch verwendet.
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: der nach mir kommt
  rationale: Das substantivierte Präsenspartizip bezeichnet eine bestimmte Person. Die Relativsatzform ist im heutigen Deutsch natürlicher; „nach mir“ bewahrt den zeitlichen beziehungsweise aufeinanderfolgenden Sinn, ohne eine weitergehende Rangordnung ausdrücklich einzutragen.
- source_word: οὗ
  choice: dessen
  rationale: Das Genitivpronomen wird als possessives Relativpronomen wiedergegeben und eindeutig auf den Kommenden bezogen.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: ich nicht würdig bin
  rationale: „Nicht würdig“ gibt die Aussage über Unwürdigkeit beziehungsweise mangelnde Eignung präzise wieder und bewahrt den Ausdruck der Demut.
- source_word: ἵνα λύσω
  choice: zu lösen
  rationale: Nach „würdig“ ist der Infinitiv mit „zu“ im Deutschen idiomatisch. „Lösen“ bezeichnet hier das Öffnen beziehungsweise Lockern des Sandalenriemens.
- source_word: ἱμάντα τοῦ ὑποδήματος
  choice: Sandalenriemen
  rationale: Das deutsche Kompositum gibt die Genitivverbindung knapp und kulturgeschichtlich passend wieder; ἱμάς ist der Riemen und ὑπόδημα hier die Sandale.
theological_decisions:
- issue: Beziehung des Kommenden zu Johannes in „nach mir“
  choice: 'zeitlich beziehungsweise in der Abfolge: „der nach mir kommt“'
  alternative: „der hinter mir kommt“
  rationale: ὀπίσω μου kann räumlich „hinter mir“ bedeuten, bezeichnet in diesem johanneischen Zusammenhang jedoch naheliegend das Nachfolgen in der zeitlichen beziehungsweise öffentlichen Abfolge. Die Übersetzung trägt keine zusätzliche Aussage über Rang oder Wesen in diesen Satzteil ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt kleingeschrieben, da der vorgelegte Vers syntaktisch als Fortsetzung des vorausgehenden Zusammenhangs erscheint. „Sandalenriemen“ ist anschaulich und gegenwärtig verständlich; die Wortstellung bewahrt den feierlichen Ton, ohne altertümlich zu wirken.
