  source_fidelity: 'Der Entwurf gibt die griechische Konstruktion präzise wieder: Das substantivierte Partizip ὁ ... ἐρχόμενος ist natürlich als Relativsatz („der nach mir kommt“) wiedergegeben; οὗ als „dessen“; οὐκ εἰμὶ ἄξιος ἵνα λύσω als idiomatisches „zu lösen ich nicht würdig bin“. „Sandalenriemen“ entspricht ἱμάντα τοῦ ὑποδήματος treffend. Die zeitlich-sukzessive Deutung von ὀπίσω μου entspricht dem Kontext und dem englischen Audit Trail, ohne eine zusätzliche Rangbehauptung in die Übersetzung einzutragen.'
