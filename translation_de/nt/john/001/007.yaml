id: JHN.1.7
reference: John 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: de
  text: Er kam als Zeuge, um über das Licht Zeugnis abzulegen, damit alle durch ihn[a] glauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist wahrscheinlich: durch Johannes und sein Zeugnis. Manche beziehen „ihn“ stattdessen auf das Licht.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Er
  rationale: Das Demonstrativpronomen weist auf Johannes im vorherigen Vers zurück. Im Deutschen ist das Pronomen „Er“ hier natürlicher als das betonte, aber schwerfällige „Dieser“; der Bezug bleibt durch den Zusammenhang eindeutig.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: kam als Zeuge
  rationale: Die Wendung beschreibt im Kontext den Zweck und die Rolle des Johannes. „Als Zeuge“ gibt den Zeugnischarakter idiomatisch wieder, ohne den Ausdruck auf eine bloße Ankunft zu reduzieren.
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: um über das Licht Zeugnis abzulegen
  rationale: Die Zweckbedeutung von ἵνα wird mit „um … zu“ natürlich wiedergegeben. „Zeugnis ablegen“ bewahrt den Aussage- und Zeugencharakter von μαρτυρέω; περί mit Genitiv entspricht „über“.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: damit alle … glauben
  rationale: Die zweite ἵνα-Konstruktion bleibt als eigener Zwecksatz erhalten. „Alle“ gibt das uneingeschränkte πάντες knapp wieder, und „glauben“ ist hier die sachgemäße Wiedergabe von πιστεύω.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet Vermittlung oder Mittel. „Durch ihn“ bewahrt diese Bedeutung und lässt die grammatische Bezugsmöglichkeit des Pronomens bestehen.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in δι’ αὐτοῦ
  choice: Im Haupttext bleibt „ihn“ stehen; dem Zusammenhang nach bezieht es sich am ehesten auf Johannes als Zeugen.
  alternative: Das Pronomen kann auf das Licht, also auf Christus, bezogen werden.
  rationale: Johannes ist das handelnde Subjekt des Verses, und der folgende Vers unterscheidet ihn ausdrücklich vom Licht. Dennoch lässt die griechische Pronominalform den Bezug grammatisch offen; deshalb wird die alternative Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung des Wortfeldes „Zeuge/Zeugnis“ bildet die griechische Verbindung von μαρτυρία und μαρτυρέω sichtbar ab. „Licht“ wird nach deutscher Rechtschreibung großgeschrieben; daraus folgt für sich genommen keine zusätzliche Kennzeichnung als Titel.
