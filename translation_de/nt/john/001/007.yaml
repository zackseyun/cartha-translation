  source_fidelity: 'Der Text gibt die Struktur und den Sinn des griechischen Satzes zuverlässig wieder: Johannes kommt in der Funktion eines Zeugen; die beiden ἵνα-Sätze werden als Zweckangaben erkennbar wiedergegeben; περὶ τοῦ φωτός ist treffend mit „über das Licht“ übersetzt; und δι’ αὐτοῦ bleibt als „durch ihn“ offen genug.'
  naturalness: „Er kam als Zeuge, um über das Licht Zeugnis abzulegen, damit alle durch ihn glauben“ ist verständliches modernes Standarddeutsch mit angemessen würdigem Register. Die Verbindung „Zeuge/Zeugnis ablegen“ bildet die Wortverwandtschaft μαρτυρία/μαρτυρέω sinnvoll ab. Die unterschiedliche deutsche Gestaltung der beiden Zweckangaben („um … zu“ / „damit“) ist idiomatisch und verändert ihre Funktion nicht.
  terminology: '„Zeuge“, „Zeugnis ablegen“, „Licht“ und „glauben“ sind sachgemäß und theologisch nicht überdeutet. Die Fußnote behandelt den nicht ausdrücklich benannten Bezug von αὐτοῦ ausgewogen: Der Kontext legt Johannes nahe, ohne die mögliche Rückbeziehung auf das Licht aus dem Text auszuschließen.'
