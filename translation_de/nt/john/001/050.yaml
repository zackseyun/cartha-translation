source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Glaubst du, weil ich dir gesagt habe, dass ich dich unter dem Feigenbaum sah?[a] Du wirst Größeres als das sehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glaubst du deshalb, weil ich dir gesagt habe, dass ich dich unter dem Feigenbaum sah?“'
    reason: Die Stellung des einleitenden ὅτι erlaubt im Deutschen verschiedene natürliche Fassungen derselben kausalen Frage; „deshalb“ hebt den erfragten Grund stärker hervor.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die griechische Erzählformel bedeutet wörtlich „Jesus antwortete und sagte ihm“. Im heutigen Deutsch gibt „antwortete ihm“ die Formel vollständig und natürlich wieder, ohne das redundante „antwortete und sagte“ nachzuahmen.
- source_word: Ὅτι ... πιστεύεις;
  choice: Glaubst du, weil ...?
  rationale: Das erste ὅτι wird kausal verstanden. Die deutsche Satzstellung bewahrt die Frageform und lässt offen, ob Jesus lediglich nach dem Grund fragt oder Nathanaels Glauben zugleich behutsam herausfordert.
- source_word: ὅτι εἶδόν σε
  choice: dass ich dich ... sah
  rationale: Das zweite ὅτι leitet den Inhalt der vorausgehenden Aussage ein. Der einfache Präteritumgebrauch entspricht dem Aorist und klingt in dieser erzählenden Rede würdig und natürlich.
- source_word: ὑποκάτω τῆς συκῆς
  choice: unter dem Feigenbaum
  rationale: Direkte und idiomatische Wiedergabe des konkreten Bildes.
- source_word: πιστεύεις
  choice: glaubst du
  rationale: Das Präsens wird als unmittelbare Frage wiedergegeben. „Glauben“ entspricht dem johanneischen Sprachgebrauch besser als eine einengende Festlegung auf „vertrauen“.
- source_word: μείζω τούτων
  choice: Größeres als das
  rationale: Das substantivierte neutrale Plural μείζω wird im Deutschen idiomatisch durch den singularisch-kollektiven substantivierten Komparativ „Größeres“ wiedergegeben. „Als das“ bezieht sich natürlich auf das zuvor genannte Geschehen, ohne künstliches Deutsch wie „größere Dinge als diese“.
- source_word: ὄψῃ
  choice: du wirst sehen
  rationale: Klare, moderne Wiedergabe des Futurs ohne archaisches „du sollst sehen“.
theological_decisions:
- issue: Aussagekraft der Frage πιστεύεις;
  choice: 'Eine echte rhetorische Frage: „Glaubst du, weil ...?“'
  alternative: 'Eine Feststellung: „Weil ich dir sagte ..., glaubst du.“'
  rationale: Der Kontext und die überlieferte Interpunktion legen eine Frage nahe. Die Formulierung verschärft sie weder zu einem ausdrücklichen Tadel noch macht sie zu einer bloßen Feststellung.
- issue: Bezug und Tragweite von μείζω τούτων
  choice: „Größeres als das“ bleibt allgemein und vorausweisend
  alternative: Eine konkretisierende Wiedergabe, die bereits festlegt, welche Offenbarungen oder Zeichen gemeint sind
  rationale: Der Vers selbst benennt das Größere noch nicht. Die Übersetzung wahrt diesen offenen Vorausblick und greift der folgenden Aussage nicht vor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Doppelwendung „antwortete und sagte“ wird idiomatisch zusammengezogen. Die Frage bleibt rhetorisch offen; weder ein Tadel noch eine Aussage über die Qualität von Nathanaels Glauben wird hinzugefügt.
