id: JHN.1.2
reference: John 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: de
  text: Dieser war im Anfang bei Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er war im Anfang bei Gott.«'
    reason: Lexikalische Alternative für οὗτος; im Deutschen kann der Rückbezug auch durch das Personalpronomen ausgedrückt werden.
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen greift den »Logos« aus Vers 1 ausdrücklich wieder auf. »Dieser« ist im Deutschen natürlich und bewahrt die anaphorische Hervorhebung des griechischen Ausdrucks besser als das ebenfalls mögliche »Er«.
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt von εἰμί bezeichnet hier den fortdauernden Zustand und wird idiomatisch mit »war« wiedergegeben. »Existierte« wäre deutender und stilistisch schwerer.
- source_word: ἐν ἀρχῇ
  choice: im Anfang
  rationale: Die Formulierung bewahrt den erkennbaren Anklang an Genesis 1,1 und entspricht der Wendung in Johannes 1,1. »Am Anfang« wäre ebenfalls möglich, hebt aber eher einen Zeitpunkt hervor.
- source_word: πρὸς
  choice: bei
  rationale: πρός mit Akkusativ beschreibt hier Nähe, Beziehung und zugleich Unterschiedenheit. Das deutsche »bei« gibt dies knapp und natürlich wieder, ohne die räumliche Bedeutung von »zu« oder »auf ... hin« überzubetonen.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Der griechische Artikel wird vor »Gott« im idiomatischen Deutschen nicht eigens wiedergegeben; der bestimmte Referent bleibt aus dem Zusammenhang eindeutig.
theological_decisions:
- issue: Bezug von οὗτος auf den Logos in Johannes 1,1
  choice: »Dieser« verweist auf den zuvor genannten Logos.
  alternative: »Er«
  rationale: »Dieser« wahrt die demonstrative Kraft des griechischen Pronomens und fasst die Aussagen aus Vers 1 zusammen, ohne eine über den Text hinausgehende Bezeichnung einzuführen.
- issue: Aussagekraft von πρὸς τὸν θεόν
  choice: »bei Gott« drückt Beziehung und Unterschiedenheit aus.
  alternative: »Gott zugewandt« oder »in der Gegenwart Gottes«
  rationale: Die knappe Wiedergabe erhält die theologische Spannung des Prologs, ohne die Art der Beziehung metaphysisch näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »im Anfang« und »bei Gott« verbindet den Vers hörbar mit Johannes 1,1; »Dieser« ist bewusst leicht markiert, aber verständlich und quellennah.
