id: JHN.1.32
reference: John 1:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: de
  text: 'Und Johannes legte Zeugnis ab und sagte: „Ich habe gesehen, wie der Geist gleich einer Taube[a] aus dem Himmel[b] herabkam, und er blieb auf ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als eine Taube“. Der griechische Ausdruck lässt beide Wiedergaben zu, bezeichnet aber am ehesten eine Ähnlichkeit.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Oder: „vom Himmel“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: legte Zeugnis ab
  rationale: Die Wendung gibt den Zeugnischarakter von μαρτυρέω klar und in natürlichem, würdigem Deutsch wieder.
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip führt den Inhalt des Zeugnisses ein; die finite deutsche Form ist idiomatisch und bewahrt die Funktion.
- source_word: Τεθέαμαι
  choice: Ich habe gesehen
  rationale: Das Perfekt bezeichnet eine bezeugte Wahrnehmung mit fortdauernder Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der Kontext von Johannes 1,32–33 weist auf den Heiligen Geist; die Großschreibung kennzeichnet den göttlichen Referenten, ohne ein zusätzliches Wort einzufügen.
- source_word: καταβαῖνον
  choice: herabkam
  rationale: Die Form bezeichnet eine Bewegung nach unten. Im deutschen Nebensatz ist die finite Form natürlicher als ein Partizip.
- source_word: ὡς περιστερὰν
  choice: gleich einer Taube
  rationale: ὡς drückt hier am ehesten einen Vergleich aus. „Gleich einer Taube“ erhält die Bildhaftigkeit und vermeidet die im Deutschen störende Wiederholung von „wie“.
- source_word: ἐξ οὐρανοῦ
  choice: aus dem Himmel
  rationale: Die Formulierung bewahrt die räumliche Vorstellung einer Bewegung aus einem Herkunftsbereich; „vom Himmel“ bleibt als natürliche Alternative möglich.
- source_word: ἔμεινεν
  choice: blieb
  rationale: „Bleiben“ bewahrt die für das Johannesevangelium wichtige Bedeutung und Wortverbindung von μένω.
- source_word: ἐπ’ αὐτόν
  choice: auf ihm
  rationale: Die Wendung gibt die räumliche Beziehung schlicht und natürlich wieder; das Bezugswort ist im Kontext Jesus.
theological_decisions:
- issue: Identifikation von τὸ πνεῦμα
  choice: „der Geist“ bezeichnet den Heiligen Geist
  alternative: „der Geist“ als nicht näher bestimmter Geist
  rationale: Der unmittelbare Zusammenhang mit Johannes 1,33 identifiziert den Referenten als den Heiligen Geist. Die Übersetzung fügt jedoch „heilig“ im Vers selbst nicht hinzu.
- issue: Bedeutung von ὡς περιστερὰν
  choice: 'vergleichend: „gleich einer Taube“'
  alternative: „als eine Taube“
  rationale: ὡς bezeichnet am natürlichsten eine Ähnlichkeit, ohne die Art der Erscheinung genauer festzulegen. Die alternative Wiedergabe bleibt sprachlich möglich und wird in der Fußnote genannt.
- issue: Pronomen bei πνεῦμα
  choice: „er blieb“ gemäß dem grammatischen Geschlecht von „Geist“
  alternative: Wiederholung von „der Geist blieb“
  rationale: Das griechische Subjekt bleibt τὸ πνεῦμα; im Deutschen verlangt das maskuline Substantiv „Geist“ das Pronomen „er“. Daraus wird keine zusätzliche Aussage über Geschlecht oder Personalität abgeleitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gleich einer Taube“ vermeidet die schwerfällige Folge „wie der Geist wie eine Taube“ und bewahrt zugleich den vergleichenden Sinn. Die johanneische Wortwahl „blieb“ wird aus Gründen der thematischen Einheitlichkeit erhalten.
