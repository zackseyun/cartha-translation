id: JHN.1.25
reference: John 1:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: de
  text: 'Da fragten sie ihn: „Warum taufst du dann, wenn du weder der Messias[a] noch Elia noch der Prophet[b] bist?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Χριστός (Christos) ist hier als jüdischer Erwartungstitel mit „Messias“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: Mit „dem Propheten“ ist wahrscheinlich der erwartete Prophet wie Mose gemeint; siehe 5. Mose 18,15.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: Da fragten sie ihn
  rationale: Die beiden griechischen Redeformeln leiten gemeinsam die direkte Frage ein. Die knappe deutsche Wiedergabe vermeidet die unnatürliche Verdoppelung „sie fragten ihn und sagten zu ihm“, während „Da“ den erzählerischen Anschluss ausdrückt.
- source_word: Τί οὖν βαπτίζεις
  choice: Warum taufst du dann
  rationale: τί fragt hier zusammen mit οὖν nach dem Grund beziehungsweise der Berechtigung für die gegenwärtige Tauftätigkeit. „Warum … dann“ gibt diesen Folgerungscharakter idiomatisch wieder.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός bezeichnet hier einen erwarteten jüdischen Titel und nicht einen Eigennamen. „Messias“ bewahrt diesen Kontext; „der Christus“ bleibt als mögliche Wiedergabe in der Fußnote genannt.
- source_word: Ἠλίας
  choice: Elia
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Der bestimmte Artikel weist im Kontext auf eine bekannte erwartete Gestalt hin. Die Großschreibung von „Prophet“ kennzeichnet den titelartigen Gebrauch, ohne die Identität dieser Gestalt im Haupttext näher festzulegen.
- source_word: οὐδὲ … οὐδὲ
  choice: weder … noch … noch
  rationale: Die fortgesetzte Verneinung wird im Deutschen durch die natürliche Reihung „weder … noch … noch“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Identitätsfrage
  choice: der Messias
  alternative: der Christus
  rationale: Im Zusammenhang der Frage nach erwarteten jüdischen Gestalten fungiert Χριστός als Titel. „Messias“ macht diesen Erwartungshorizont verständlich, ohne zusätzliche christologische Deutung einzutragen.
- issue: Titelcharakter von ὁ προφήτης
  choice: der Prophet
  alternative: der Prophet (ohne titelbetonende Großschreibung, soweit orthografisch unterscheidbar)
  rationale: Der Ausdruck bezeichnet offenbar eine bestimmte erwartete Gestalt. Die Formulierung lässt offen, wie genau diese Erwartung theologisch zu bestimmen ist; eine wahrscheinliche Verbindung zu 5. Mose 18,15 wird nur in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Frage bleibt knapp und mündlich natürlich; „Da“ stellt den Anschluss an den vorherigen Wortwechsel her. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Titeln.
