  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: de
  text: 'Am nächsten Tag sieht er Jesus auf sich zukommen und sagt: »Sieh, das Lamm Gottes, das die Sünde der Welt wegnimmt!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Natürliche und genaue Wiedergabe der Zeitangabe.
- source_word: βλέπει
  choice: sieht
  rationale: Das historische Präsens des griechischen Erzählstils wird beibehalten.
- source_word: Ἴδε
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ würdig und unmittelbar wieder; der Plural passt zu den angesprochenen Umstehenden.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: das Lamm Gottes
  rationale: Bewahrt die zentrale Bildsprache und die mögliche Mehrdeutigkeit des Genitivs.
- source_word: ὁ αἴρων
  choice: das … wegnimmt
  rationale: αἴρω kann hier das Beseitigen bzw. Wegnehmen bezeichnen; die Formulierung lässt den theologischen Vollzug unausgeführt.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: die Sünde der Welt
  rationale: Der Singular wird bewahrt, ebenso der umfassende Genitiv τοῦ κόσμου.
theological_decisions:
- issue: Bedeutung von αἴρων
  choice: wegnimmt
  alternative: trägt
  rationale: Das Verb kann je nach Kontext sowohl aufnehmen/tragen als auch beseitigen bedeuten. »Wegnimmt« entspricht hier der verbreiteten kontextuellen Deutung, ohne die Weise näher festzulegen; »trägt« bleibt als mögliche Anspielung im Bildhintergrund, wird aber nicht in den Haupttext eingetragen.
- issue: Genitiv in »Lamm Gottes«
  choice: Lamm Gottes
  alternative: von Gott bestimmtes Lamm
  rationale: Die knappe Genitivkonstruktion des Ausgangstextes wird erhalten, sodass Zugehörigkeit, Herkunft oder göttliche Bereitstellung nicht einseitig festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens und der Ausrufcharakter werden bewahrt; keine konfessionell spezifizierende Zusatzdeutung.
