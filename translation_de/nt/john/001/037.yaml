  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: de
  text: Die beiden Jünger[a] hörten ihn reden und folgten Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, ausdrücklich: »seine beiden Jünger«; gemeint sind die Jünger Johannes des Täufers.'
    reason: Die Fußnote macht das im Griechischen vorhandene Possessivpronomen αὐτοῦ sichtbar und klärt seinen Bezug auf Johannes den Täufer.
lexical_decisions:
- source_word: ἤκουσαν
  choice: hörten
  rationale: Der Aorist bezeichnet hier das schlichte Wahrnehmen des Gesagten; „hörten“ ist im Deutschen natürlich und legt kein länger anhaltendes Zuhören nahe.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: die beiden Jünger
  rationale: Gemeint sind die beiden bereits in Johannes 1,35 genannten Jünger Johannes des Täufers. Das Possessivpronomen wird im Haupttext nicht eigens wiedergegeben, da die bestimmte Wortgruppe auf diese beiden zurückverweist und „seine“ im Deutschen missverständlich auf Jesus bezogen werden könnte; die Fußnote macht die wörtlichere Form sichtbar.
- source_word: λαλοῦντος
  choice: ihn reden
  rationale: Die Konstruktion „hörten ihn reden“ gibt das gleichzeitige Geschehen des Präsenspartizips knapp und idiomatisch wieder.
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: „Folgten“ bewahrt sowohl den unmittelbaren Sinn, dass sie Jesus nachgingen, als auch den möglichen erzählerischen Anklang an Jüngerschaft.
- source_word: τῷ Ἰησοῦ
  choice: Jesus
  rationale: Der Dativ bezeichnet bei ἀκολουθέω die Person, der man folgt; im Deutschen steht „folgen“ entsprechend mit dem Dativ, wobei die Namensform unverändert bleibt.
theological_decisions:
- issue: Bezug von αὐτοῦ in οἱ δύο μαθηταὶ αὐτοῦ
  choice: Als Bezug auf Johannes den Täufer verstanden; im Haupttext durch „die beiden Jünger“ wiedergegeben.
  alternative: „Seine beiden Jünger“, wodurch der Bezug im Deutschen stärker mehrdeutig oder fälschlich auf Jesus bezogen werden könnte.
  rationale: Nach Johannes 1,35–36 steht Johannes der Täufer mit zwei seiner Jünger da und spricht über Jesus. Vers 37 berichtet, dass genau diese beiden ihn reden hörten und daraufhin Jesus folgten.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Erzähldeutsch. Die knappe Satzstruktur folgt dem griechischen Erzählfluss; „ihn reden hören“ ist idiomatisch und bewahrt die Gleichzeitigkeit der Handlungen.
