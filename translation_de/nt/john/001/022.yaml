  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Wer bist du? Damit wir denen, die uns geschickt haben, eine Antwort geben können: Was sagst du über dich selbst?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier den folgernden Fortgang des Gesprächs; »Da« klingt im modernen Deutschen natürlich und bewahrt den Anschluss an die vorherige Antwort.
- source_word: εἶπαν ... αὐτῷ
  choice: fragten sie ihn
  rationale: Wörtlich steht »sagten sie zu ihm«; da die unmittelbar folgende direkte Rede aus Fragen besteht, gibt »fragten sie ihn« die kommunikative Funktion im Deutschen präzise und natürlich wieder.
- source_word: Τίς εἶ;
  choice: Wer bist du?
  rationale: Gibt die knappe Frage nach der Identität ohne zusätzliche Deutung oder Hervorhebung wieder.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Wir müssen ... eine Antwort geben
  rationale: Der griechische Zwecksatz bezeichnet den praktischen Zweck ihrer Frage. Die deutsche Hauptsatzform mit »müssen« macht diesen beauftragungsbedingten Zweck idiomatisch deutlich, ohne den Inhalt zu verändern.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: denen, die uns geschickt haben
  rationale: Gibt das substantivierte Partizip klar und strukturell angemessen als Relativsatz wieder.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: Was sagst du über dich selbst?
  rationale: Bewahrt sowohl das Verb des Sagens als auch den Bezug auf die eigene Person; »über dich selbst« ist natürlich und entspricht περί mit Genitiv.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Standardsprache. Die direkte Rede bleibt knapp und eindringlich; die beiden Fragen werden durch einen natürlichen deutschen Aussagesatz verbunden.
