  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: de
  text: Alles ist durch ihn geworden, und ohne ihn ist nicht einmal ein einziges Ding geworden, was geworden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wenn der letzte Satzteil mit Vers 4 verbunden wird: »Was geworden ist, war in ihm Leben.«'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte »Alles« gibt den umfassenden Sinn des griechischen Neutrums natürlich wieder und bewahrt die kosmische Reichweite.
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise Mittel. »Durch ihn« ist im Deutschen natürlich und gibt diese Beziehung wieder, ohne sie auf bloße Urheberschaft zu verengen.
- source_word: ἐγένετο
  choice: ist … geworden
  rationale: γίνομαι bezeichnet hier das Ins-Dasein-Kommen. »Ist geworden« wahrt diesen Sinn und hält zugleich die bewusste sprachliche Gegenüberstellung zu »war« in Vers 1 fest.
- source_word: χωρὶς αὐτοῦ
  choice: ohne ihn
  rationale: χωρίς bezeichnet Trennung beziehungsweise Ausschluss. »Ohne ihn« ist klar, idiomatisch und in diesem Satz präziser als das schwerfälligere »getrennt von ihm«.
- source_word: οὐδὲ ἕν
  choice: auch nicht eines
  rationale: Die Formulierung erhält die emphatische Einzelverneinung des griechischen Ausdrucks, statt sie zum weniger markierten »nichts« zusammenzuziehen.
- source_word: ὃ γέγονεν
  choice: was geworden ist
  rationale: Der Relativsatz wird entsprechend der gesetzten Interpunktion an Vers 3 angeschlossen. Das Perfekt wird mit »geworden ist« wiedergegeben und bezeichnet Gewordensein mit fortbestehendem Ergebnis.
theological_decisions:
- issue: Zuordnung des Schlusssatzes ὃ γέγονεν
  choice: 'An Vers 3 anschließen: »auch nicht eines geworden, was geworden ist«'
  alternative: 'Mit Vers 4 beginnen: »Was in ihm geworden ist, war Leben.«'
  rationale: Die frühesten griechischen Handschriften legen durch ihre Zeichensetzung keine eindeutige Satzgrenze fest. Der Haupttext folgt der im vorgelegten SBLGNT-Text gesetzten Verbindung mit Vers 3; die sachlich mögliche andere Gliederung wird in einer Fußnote bewahrt, damit die echte syntaktische und theologische Spannung nicht verdeckt wird.
translation_notes:
  register: Gehobenes, aber modernes Standarddeutsch. Die wiederholte Form von »werden« bildet die Wiederholung von γίνομαι ab und bewahrt den feierlichen, präzisen Stil des Prologs. »Auch nicht eines« ist bewusst markierter als alltägliches »nichts«, um die griechische Emphase zu erhalten.
