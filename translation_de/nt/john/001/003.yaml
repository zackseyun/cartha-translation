  source_fidelity: Der Hauptsatz gibt πάντα δι’ αὐτοῦ ἐγένετο und χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν grundsätzlich treffend wieder. Die Wiederholung von »geworden« bildet ἐγένετο angemessen ab. Die Zuordnung von ὃ γέγονεν zu Vers 3 folgt der vorgegebenen SBLGNT-Interpunktion und ist mit einer Fußnote zur alternativen Gliederung korrekt als strittig gekennzeichnet.
  naturalness: »Auch nicht eines« ist im heutigen Standarddeutsch ohne ein ausdrücklich substantiviertes Bezugswort unnötig spröde. »Nicht einmal ein einziges Ding« ist klar, idiomatisch und erhält die emphatische Einzelverneinung. Die Stellung von »was geworden ist« bleibt bewusst wiederholend, da sie den griechischen Schlusssatz abbildet.
  terminology: »Alles«, »durch ihn«, »ohne ihn« und »geworden« sind für den gehobenen, modernen Stil des Prologs geeignet. In der Fußnote sollte »in ihm« syntaktisch zu »war Leben« gehören; die vorliegende Formulierung »Was in ihm geworden ist« verschiebt »in ihm« zum Werden und ist daher weniger quellentreu.
