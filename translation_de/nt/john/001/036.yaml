  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: de
  text: 'Und er blickte Jesus beim Gehen aufmerksam an und sagte: »Seht, das Lamm Gottes!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: blickte … an
  rationale: Gibt den gezielten, aufmerksamen Blick des Verbs natürlicher wieder als ein bloßes »sah«.
- source_word: περιπατοῦντι
  choice: der vorüberging
  rationale: Das Partizip bezeichnet Jesus beim Gehen; im Zusammenhang klingt »vorüberging« idiomatisch und bewahrt die konkrete Bewegung.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im modernen deutschen Erzählstil natürlich als Präteritum wiedergegeben.
- source_word: Ἴδε
  choice: Seht
  rationale: Bewahrt den auffordernden, die Aufmerksamkeit lenkenden Charakter des Ausdrucks und passt zur Mehrzahl der angesprochenen Jünger.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: das Lamm Gottes
  rationale: Die etablierte und formal genaue Wiedergabe erhält die theologisch dichte Genitivverbindung, ohne sie auszudeuten.
theological_decisions:
- issue: Bedeutung des Genitivs in »τοῦ θεοῦ«
  choice: Lamm Gottes
  alternative: von Gott gegebenes Lamm / Gott gehörendes Lamm
  rationale: Der knappe Genitiv bleibt bewusst unausgelegt, sodass seine mögliche Zugehörigkeits-, Herkunfts- und heilsgeschichtliche Bedeutung nicht eingeengt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich; keine erklärenden Zusätze.
