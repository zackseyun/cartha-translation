  source_fidelity: Die gezielte Blickhandlung (ἐμβλέψας), Jesu Gehen (περιπατοῦντι), der aufmerksamkeitslenkende Ausruf (Ἴδε) und die knappe Genitivverbindung „das Lamm Gottes“ sind grundsätzlich getroffen. „Vorüberging“ ist jedoch enger als περιπατοῦντι, das schlicht Jesu Gehen bezeichnet und kein tatsächliches Vorbeigehen ausdrücken muss.
  naturalness: Die Revision ist modernes, würdiges und flüssiges Standarddeutsch. „beim Gehen“ gibt die gleichzeitige Handlung natürlich wieder, ohne eine zusätzliche Bewegungsrichtung zu behaupten.
  terminology: „Das Lamm Gottes“ ist die etablierte, quellennahe Wiedergabe und lässt die Bedeutung des Genitivs offen. „Seht“ ist als knapper Aufmerksamkeitsruf idiomatisch; die mögliche formale Singularnuance von Ἴδε wird nicht doktrinär oder unnötig ausgedeutet.
