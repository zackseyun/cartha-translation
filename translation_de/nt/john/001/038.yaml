revisions:
- from: 'Da wandte sich Jesus um, sah, dass sie ihm folgten, und fragte sie: »Was sucht ihr?« Sie antworteten ihm: »Rabbi« – das heißt übersetzt: Lehrer[a] –, »wo wohnst du?«[b]'
  to: 'Da wandte sich Jesus um, sah sie ihm folgen und sagte zu ihnen: »Was sucht ihr?« Sie sagten zu ihm: »Rabbi« (das übersetzt »Lehrer« bedeutet), »wo wohnst du?«[a]'
  rationale: Die Revision glättet nur die deutsche Satzführung und bildet den griechischen Klammerzusatz zu „Rabbi“ direkt ab. Sie behält die bewusst offene Wiedergabe „Was sucht ihr?“ sowie die kontextuell natürliche Frage „wo wohnst du?“ bei. Die verbleibende Fußnote weist knapp auf die wiederkehrende Wortverbindung von μένω und „bleiben“ hin, ohne deren Bedeutung für diese konkrete Frage zu überdehnen.
