  naturalness: „Da wandte sich Jesus um, sah sie ihm folgen und sagte zu ihnen“ ist flüssigeres modernes Standarddeutsch als die Konstruktion mit „sah, dass sie ihm folgten“. Der Klammerzusatz entspricht zugleich der Form des griechischen Einschubs und ist in direkter Rede klar lesbar.
  terminology: „Rabbi“ ist beizubehalten; „Lehrer“ trifft Διδάσκαλε angemessen. Die zusätzliche Kulturfußnote ist entbehrlich, weil der Vers selbst die Übersetzung liefert. Die Fußnote zu μένω kann die lexikalische Verbindung mit „bleiben“ sachlich benennen, ohne in diesem Kontext eine theologische Lesart festzulegen.
