source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: de
  text: 'Da wandte sich Jesus um, sah sie ihm folgen und sagte zu ihnen: »Was sucht ihr?« Sie sagten zu ihm: »Rabbi« (das übersetzt »Lehrer« bedeutet), »wo wohnst du?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wo bleibst du?“ Dasselbe griechische Verb wird im Johannesevangelium häufig mit „bleiben“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: wandte sich … um
  rationale: Das Aoristpartizip bezeichnet Jesu Wendung vor dem Sprechen. „Sich umwenden“ gibt die im Kontext naheliegende Körperbewegung natürlich und präzise wieder.
- source_word: θεασάμενος
  choice: sah
  rationale: Das Partizip bezeichnet bewusstes visuelles Wahrnehmen. „Sah“ ist im Deutschen knapp und natürlich, ohne das Wahrnehmen als bloß zufälliges Bemerken zu deuten.
- source_word: ἀκολουθοῦντας
  choice: dass sie ihm folgten
  rationale: Die finite Nebensatzkonstruktion ist idiomatisches Deutsch und bewahrt sowohl den konkreten Vorgang als auch den möglichen Anklang an Jüngerschaft.
- source_word: Τί ζητεῖτε;
  choice: Was sucht ihr?
  rationale: „Suchen“ kann wie ζητέω sowohl eine konkrete Suche als auch ein tieferes Verlangen bezeichnen und erhält damit die johanneische Mehrdeutigkeit.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Der semitische Titel wird wie im Ausgangstext beibehalten, da der Evangelist unmittelbar eine Übersetzung hinzufügt.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: 'das heißt übersetzt: Lehrer'
  rationale: Die Formulierung gibt den erklärenden Einschub verständlich wieder. „Lehrer“ entspricht dem als Anrede gebrauchten Vokativ Διδάσκαλε.
- source_word: ποῦ μένεις;
  choice: wo wohnst du?
  rationale: Im unmittelbaren Kontext fragt μένω nach Jesu Aufenthalts- beziehungsweise Wohnort. „Wo wohnst du?“ ist natürliches Deutsch; die Fußnote macht die wiederkehrende Bedeutung „bleiben“ sichtbar.
theological_decisions:
- issue: Die mögliche johanneische Tiefenbedeutung von ζητέω
  choice: Was sucht ihr?
  alternative: Was wollt ihr? / Wonach sucht ihr?
  rationale: „Was sucht ihr?“ bleibt im Deutschen offen für die praktische und die existenzielle Ebene, ohne eine geistliche Bedeutung ausdrücklich einzutragen.
- issue: Die Wiedergabe von μένω bei seinem frühen Auftreten im Johannesevangelium
  choice: wo wohnst du?
  alternative: wo bleibst du? / wo hältst du dich auf?
  rationale: Die unmittelbare Szene legt eine Frage nach Jesu Unterkunft nahe. Die Hauptübersetzung soll daher natürlich bleiben; zugleich weist die Fußnote auf das für Johannes bedeutsame Verb „bleiben“ hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet; der erklärende Einschub bleibt als solcher deutlich. Die Übersetzung bewahrt bei „suchen“ die mögliche doppelte Bedeutung und erläutert die lexikalische Verbindung von μένω mit „bleiben“ in einer Fußnote.
