id: JHN.1.19
reference: John 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: de
  text: 'Und dies ist das Zeugnis des Johannes, als die Juden[a] Priester und Leviten aus Jerusalem zu ihm sandten, um ihn zu fragen: »Wer bist du?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die jüdischen Führer« beziehungsweise »die Judäer«. Im Johannesevangelium bezeichnet »die Juden« häufig besonders die religiösen Autoritäten Judäas und nicht das jüdische Volk als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: Zeugnis
  rationale: „Zeugnis“ gibt den sachlichen und zugleich rechtlich geprägten Sinn des johanneischen Zeugenmotivs wieder und bezeichnet hier das von Johannes abgelegte Zeugnis.
- source_word: τοῦ Ἰωάννου
  choice: des Johannes
  rationale: 'Der Genitiv wird subjektiv verstanden: Es geht um das Zeugnis, das Johannes ablegt, nicht um ein Zeugnis über ihn.'
- source_word: ὅτε
  choice: als
  rationale: „Als“ gibt die einmalige zeitliche Situation natürlich wieder, in der Johannes sein Zeugnis ablegte.
- source_word: ἀπέστειλαν
  choice: sandten
  rationale: „Sandten“ ist die klare und kontextgerechte Wiedergabe des Verbs; eine stärkere Formulierung wie „entsandten“ wäre möglich, aber unnötig gehoben.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Hauptfassung bewahrt die unmittelbare Gruppenbezeichnung des griechischen Textes. Eine Fußnote erläutert, dass im Johannesevangelium häufig besonders die jüdischen beziehungsweise judäischen Autoritäten gemeint sind.
- source_word: ἐξ Ἱεροσολύμων
  choice: aus Jerusalem
  rationale: Dies gibt den örtlichen Ausgangspunkt der Sendung idiomatisch wieder.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: Priester und Leviten
  rationale: Die beiden mit dem Tempeldienst verbundenen Gruppen werden als unterschiedliche Gruppen wörtlich und verständlich benannt.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: um ihn zu fragen
  rationale: Die Infinitivkonstruktion drückt den Zweck der Sendung in natürlichem modernem Deutsch aus.
- source_word: Σὺ τίς εἶ;
  choice: Wer bist du?
  rationale: Dies ist die natürliche deutsche Frageform. Die Hervorhebung durch das ausdrückliche griechische Pronomen wird durch den unmittelbaren, zugespitzten Wortlaut ausreichend vermittelt.
theological_decisions:
- issue: Bezug und Wiedergabe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext „die Juden“, ergänzt durch eine erläuternde Fußnote
  alternative: „die jüdischen Führer“ oder „die Judäer“
  rationale: Die wörtliche Gruppenbezeichnung bleibt erhalten, ohne sie im Haupttext vorschnell einzuengen. Zugleich verhindert die Fußnote eine pauschale ethnische Deutung, da der Zusammenhang mit einer offiziellen Abordnung von Priestern und Leviten aus Jerusalem besonders auf die religiösen Autoritäten weist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem zeitlichen Anschluss mit ὅτε, während „um ihn zu fragen“ den griechischen Zwecksatz idiomatisch wiedergibt. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Gruppenbezeichnung.
