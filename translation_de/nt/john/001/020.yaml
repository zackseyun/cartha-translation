  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: de
  text: 'Und er bekannte es und leugnete es nicht; er bekannte: »Ich bin nicht der Messias[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«. Das griechische Χριστός (Christos) ist hier ein messianischer Titel und wird deshalb im Haupttext mit »der Messias« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: bekannte
  rationale: Das Verb bezeichnet hier ein offenes, öffentliches Bekenntnis. „Bekannte“ bewahrt zudem die bewusste Wiederholung des griechischen Textes und dessen feierlichen Nachdruck.
- source_word: οὐκ ἠρνήσατο
  choice: leugnete nicht
  rationale: Die direkte Wiedergabe erhält die emphatische Gegenüberstellung von Bekennen und Nichtleugnen.
- source_word: καὶ ... καὶ ... καὶ
  choice: Und ... und ... sondern ...
  rationale: Die ersten beiden Bindewörter werden formal wiedergegeben; beim dritten bringt „sondern“ im natürlichen Deutschen die steigernde Wiederaufnahme und den Gegensatz zur Verneinung klar zum Ausdruck.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Ich bin nicht
  rationale: Das ausdrücklich gesetzte Ἐγώ verleiht der Aussage Nachdruck. Die direkte deutsche Formulierung vermittelt diesen im Kontext, ohne das schwerfällige „Ich selbst bin nicht“ einzuführen.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier der Titel des erwarteten Gesalbten und keine namensähnliche Bezeichnung. „Der Messias“ wahrt den jüdischen Erwartungshorizont der Szene.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Johannes bestreitet, der erwartete Gesalbte zu sein. Da Χριστός hier eindeutig als Titel gebraucht wird, gibt „Messias“ die Funktion und den jüdischen Kontext verständlich wieder; die formnähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Deutschen leicht markierte Wiederholung von „bekannte“ wurde bewusst beibehalten, weil sie die rhetorische Eindringlichkeit des Ausgangstextes trägt.
