  rationale: Die Revision beseitigt die unidiomatische Doppelung von „damit“ und „darum“, bewahrt aber sowohl den Zweck der Offenbarung Jesu für Israel als auch den begründenden Bezug von διὰ τοῦτο. „Kannte ihn nicht“ und die Fußnote lassen die im griechischen οὐκ ᾔδειν enthaltene Ambiguität unverengt. Die Formulierung „um mit Wasser zu taufen“ gibt das begleitende Partizip βαπτίζων in natürlichem modernem Deutsch wieder.
