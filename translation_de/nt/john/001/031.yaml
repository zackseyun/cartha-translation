  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: de
  text: Und ich kannte ihn nicht[a]; aber damit er Israel offenbart werde, bin ich deshalb gekommen, um mit Wasser zu taufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich erkannte ihn nicht“. Das griechische Wort kann sowohl fehlende Bekanntschaft als auch fehlendes Erkennen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Und ich
  rationale: Die Krasis aus καί und ἐγώ führt das Zeugnis fort und betont das Subjekt leicht; „Und ich“ bewahrt beides natürlich.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: kannte ihn nicht
  rationale: Das Imperfekt bezeichnet einen vergangenen Zustand des Nichtkennens. „Kannte“ ist im Deutschen persönlicher und idiomatischer als „wusste“ und lässt offen, ob fehlende Bekanntschaft oder fehlendes Erkennen gemeint ist.
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zwischen dem vorherigen Nichtkennen und dem Zweck des Taufdienstes.
- source_word: ἵνα φανερωθῇ
  choice: damit er … offenbart würde
  rationale: „Damit“ gibt den Zweck wieder; die passive Form und die theologisch offene Bedeutung von φανερόω bleiben erhalten.
- source_word: τῷ Ἰσραήλ
  choice: Israel
  rationale: Der Dativ bezeichnet den Empfänger der Offenbarung; die kollektive Bezeichnung wird ohne erklärende Erweiterung bewahrt.
- source_word: διὰ τοῦτο
  choice: darum
  rationale: Verweist auf den vorangestellten Zweck und klingt in der deutschen Satzführung natürlich.
- source_word: ἦλθον ἐγὼ
  choice: bin ich gekommen
  rationale: Das Perfekt ist im modernen gesprochenen und geschriebenen Standarddeutsch für ein vergangenes Kommen mit Gegenwartsbezug idiomatisch; die Stellung von „ich“ bewahrt die leichte Betonung.
- source_word: ἐν ὕδατι βαπτίζων
  choice: und taufe mit Wasser
  rationale: Das koordinierte Präsens gibt das begleitende Partizip natürlich wieder. „Mit Wasser“ bezeichnet hier idiomatisch das Element der Taufe, ohne eine bestimmte Taufweise festzulegen.
theological_decisions:
- issue: Bedeutung von Johannes’ Aussage, er habe Jesus nicht gekannt
  choice: „ich kannte ihn nicht“ ohne nähere Bestimmung
  alternative: „ich erkannte ihn nicht“ oder „ich kannte ihn nicht als den Messias“
  rationale: Der griechische Wortlaut legt nicht fest, ob persönliche Unbekanntheit oder fehlendes Erkennen seiner Identität gemeint ist. Die breitere Formulierung bewahrt diese Spannung.
- issue: Wiedergabe von ἐν ὕδατι bei der Taufe
  choice: „mit Wasser“
  alternative: „in Wasser“
  rationale: „Mit Wasser taufen“ ist natürliches modernes Deutsch und gibt das verwendete Element wieder, ohne aus der Präposition eine konfessionell bestimmte Taufweise abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Umstellung des Zwecksatzes vor „darum“ bildet die griechische Voranstellung ab und bleibt gut verständlich; der Punkt nach dem ersten Satzglied vermeidet einen überladenen Satz.
