id: JHN.1.33
reference: John 1:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: de
  text: 'Und ich kannte ihn nicht[a]. Aber der, der mich gesandt hat, mit Wasser zu taufen[b], sagte zu mir: »Der, auf den du den Geist herabkommen und auf ihm bleiben[c] siehst, der ist es, der mit dem Heiligen Geist tauft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich erkannte ihn nicht«.'
    reason: Das griechische Verb kann hier sowohl fehlende Kenntnis als auch fehlendes Erkennen ausdrücken.
  - marker: b
    text: 'Wörtlicher/formaler: »in Wasser zu taufen«; entsprechend am Versende: »im Heiligen Geist tauft«. Im Griechischen steht in beiden Wendungen dieselbe Präposition.'
    reason: Der Haupttext verwendet in beiden Wendungen die im modernen Deutschen idiomatische Präposition »mit« und bewahrt damit zugleich die griechische Parallelität.
  - marker: c
    text: »Bleiben« gibt ein für das Johannesevangelium wichtiges Verb wieder, das auch mit »verweilen« übersetzt werden kann.
    reason: Weist auf die wiederkehrende johanneische Wortwahl hin, ohne eine einzige traditionelle Wiedergabe festzuschreiben.
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: Und ich kannte ihn nicht
  rationale: Gibt die fortführende Verbindung durch κἀγώ und die anhaltende frühere Unkenntnis durch das Imperfekt natürlich wieder; ob fehlende Bekanntschaft oder fehlendes Erkennen gemeint ist, bleibt im Haupttext offen.
- source_word: ὁ πέμψας με
  choice: der, der mich gesandt hat
  rationale: Gibt das substantivierte Aoristpartizip bestimmt und in gegenwärtigem Standarddeutsch wieder.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: in Wasser zu taufen
  rationale: Bewahrt die Präposition ἐν und die sprachliche Parallele zu ἐν πνεύματι ἁγίῳ.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Der, auf den du ... siehst
  rationale: Gibt die identifizierende Relativkonstruktion verständlich wieder, ohne das unbestimmte Element unnötig aufzulösen.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: den Geist herabkommen und auf ihm bleiben
  rationale: Die deutschen Infinitive nach „siehst“ bilden die beiden griechischen Partizipien natürlich ab; „bleiben“ wahrt das johanneische Schlüsselverb μένω.
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: der ist es, der ... tauft
  rationale: Bewahrt die nachdrückliche Identifikationsformel und klingt zugleich natürlich.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: im Heiligen Geist
  rationale: Entspricht formal der griechischen Präposition und hält die Parallele zur Taufe in Wasser aufrecht.
theological_decisions:
- issue: Bedeutung von οὐκ ᾔδειν
  choice: kannte ihn nicht
  alternative: erkannte ihn nicht
  rationale: Das Verb kann je nach Kontext fehlende Kenntnis oder fehlendes Erkennen bezeichnen. Der Haupttext wählt die unmittelbarere Wiedergabe; die Alternative wird in einer Fußnote erhalten.
- issue: Präposition in den beiden Taufformulierungen
  choice: in Wasser ... im Heiligen Geist
  alternative: mit Wasser ... mit dem Heiligen Geist
  rationale: Die gleiche Wiedergabe von ἐν erhält die bewusste Parallelität des griechischen Textes, ohne eine bestimmte Tauftheologie vorzugeben.
- issue: Referenz und Großschreibung von πνεῦμα
  choice: der Geist ... der Heilige Geist
  alternative: der geist ... heiliger geist
  rationale: Der Schluss der Aussage bestimmt den herabkommenden Geist als den Heiligen Geist; die Großschreibung kennzeichnet den Referenten, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „der, der“ ist bewusst gewählt, weil sie das substantivierte Partizip verständlich und ohne altertümliches „jener, welcher“ wiedergibt. Die Stellung „auf ihm bleiben“ vermeidet eine missverständliche Zuordnung und erhält die Dauerkomponente des Zeichens.
