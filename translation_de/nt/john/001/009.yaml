id: JHN.1.9
reference: John 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: de
  text: Das wahre Licht[a], das jeden Menschen erleuchtet, kam in die Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das wahre Licht erleuchtet jeden Menschen, der in die Welt kommt.“ Das griechische Partizip „kommend“ kann auf „jeden Menschen“ statt auf „das wahre Licht“ bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: Licht
  rationale: Das gewöhnliche Substantiv wahrt zugleich die johanneische Bildsprache und den christologischen Bezug; eine Großschreibung ist im Deutschen nicht erforderlich.
- source_word: ἀληθινόν
  choice: wahr
  rationale: „Wahr“ ist im johanneischen Sprachgebrauch natürlich und kann neben faktischer Wahrheit auch das Eigentliche und Wirkliche bezeichnen.
- source_word: φωτίζει
  choice: erleuchtet
  rationale: „Erleuchtet“ gibt sowohl die Lichtmetaphorik als auch die übertragene Bedeutung knapp und idiomatisch wieder.
- source_word: πάντα ἄνθρωπον
  choice: jeden Menschen
  rationale: Die singularische, allgemein-menschliche Aussage wird im modernen Deutschen natürlich und geschlechtsübergreifend wiedergegeben.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: kam in die Welt
  rationale: Im Haupttext wird das Partizip sinngemäß auf das wahre Licht bezogen. Zusammen mit ἦν ergibt sich im Deutschen natürlich „kam in die Welt“; die grammatisch mögliche andere Zuordnung steht in der Fußnote.
- source_word: κόσμον
  choice: Welt
  rationale: „Welt“ ist die übliche und kontextgemäße Wiedergabe von κόσμος im Johannesevangelium.
- source_word: ἦν
  choice: kam
  rationale: Das Imperfekt ἦν bildet zusammen mit dem präsentischen Partizip eine Umschreibung. Da eine wörtliche deutsche Form wie „war kommend“ unnatürlich wäre, wird der Vorgang idiomatisch mit „kam“ ausgedrückt.
theological_decisions:
- issue: Syntaktische Zuordnung von ἐρχόμενον („kommend“)
  choice: 'Sinngemäß auf „das wahre Licht“ bezogen: „Das wahre Licht … kam in die Welt.“'
  alternative: 'Auf „jeden Menschen“ bezogen: „Das wahre Licht, das jeden Menschen erleuchtet, der in die Welt kommt.“'
  rationale: Das maskuline Akkusativpartizip kann grammatisch unmittelbar zu ἄνθρωπον gehören. Der johanneische Kontext und die Rede vom Kommen in die Welt stützen jedoch die christologische Lesart. Die echte Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankengang, ohne eine im Deutschen schwerfällige Verlaufsform zu erzwingen.
