  naturalness: Modernes, klares Standarddeutsch mit angemessen würdigem Register. Das Semikolon trägt die knappe parallele Satzstruktur gut. „Jesus, den Messias“ ist als akkusativische Apposition nach „durch“ grammatisch korrekt und verständlich.
  terminology: „Gesetz“, „Gnade“ und „Wahrheit“ entsprechen dem johanneischen Sprachgebrauch. „Messias“ gibt Χριστός als bedeutungsvollen Titel wieder; die Fußnote dokumentiert die traditionelle Form „Jesus Christus“, ohne den Ausgangstext oder die Hauptübersetzung zu verfälschen.
