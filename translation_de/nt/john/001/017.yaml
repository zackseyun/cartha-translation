id: JHN.1.17
reference: John 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: de
  text: Denn das Gesetz wurde durch Mose gegeben; die Gnade und die Wahrheit kamen durch Jesus, den Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „durch Jesus Christus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorausgehende Aussage in Johannes 1,16. „Denn“ gibt diese erklärende beziehungsweise begründende Funktion im Deutschen natürlich wieder.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Der Ausdruck bezeichnet hier das durch Mose vermittelte Gesetz. Der bestimmte Artikel und die Großschreibung des deutschen Substantivs geben den griechischen Ausdruck ohne zusätzliche Deutung wieder.
- source_word: διὰ Μωϋσέως
  choice: durch Mose
  rationale: διά mit Genitiv bezeichnet Vermittlung oder mittelbare Urheberschaft. „Durch“ bewahrt zudem die Parallelität zur Aussage über Jesus.
- source_word: ἐδόθη
  choice: wurde gegeben
  rationale: Die Passivform gibt den Aorist Passiv von δίδωμι formal und idiomatisch wieder, ohne den unausgesprochenen Handelnden ausdrücklich zu benennen.
- source_word: ἡ χάρις
  choice: die Gnade
  rationale: „Gnade“ bewahrt den reichen theologischen Sinn von χάρις im johanneischen Zusammenhang und entspricht dem Rückbezug auf Johannes 1,14.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: „Wahrheit“ ist die natürliche und kontextgerechte Wiedergabe von ἀλήθεια und wahrt den sprachlichen Rückbezug auf Johannes 1,14.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: „Durch“ gibt erneut die vermittelnde Funktion von διά mit Genitiv wieder. Χριστός wird als bedeutungstragender Titel mit „Messias“ übersetzt; die Apposition ist im Deutschen idiomatisch.
- source_word: ἐγένετο
  choice: kamen
  rationale: Im Kontrast zu „wurde gegeben“ bezeichnet ἐγένετο das geschichtliche Eintreten beziehungsweise Kommen von Gnade und Wahrheit. Der Plural folgt im Deutschen dem zusammengesetzten Subjekt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός trägt hier weiterhin Titelfunktion und wird deshalb seinem Sinn nach als „Messias“ wiedergegeben. Die traditionelle, namensähnliche Form „Jesus Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- issue: Verhältnis von Gesetz zu Gnade und Wahrheit
  choice: Semikolon ohne ergänzendes Gegensatzwort
  alternative: „aber die Gnade und die Wahrheit“
  rationale: Der griechische Text stellt die beiden Aussagen parallel nebeneinander, enthält jedoch kein ausdrückliches δέ oder ἀλλά. Das Semikolon wahrt den erkennbaren Kontrast, ohne ihn durch ein hinzugefügtes „aber“ zu verstärken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzstruktur und das Semikolon bewahren die knappe Gegenüberstellung des griechischen Textes; „Mose“ entspricht der heute üblichen deutschen Namensform.
