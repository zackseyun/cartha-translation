  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: de
  text: 'Er sagte zu ihnen: »Kommt, dann werdet ihr sehen.« Da gingen sie hin und sahen, wo er sich aufhielt, und blieben an jenem Tag bei ihm. Es war ungefähr die zehnte Stunde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei einer Zählung ab Sonnenaufgang entspricht das etwa 16 Uhr; manche verstehen die Angabe nach römischer Zeitrechnung als etwa 10 Uhr.
    reason: Die zugrunde liegende Stundenrechnung ist im Text nicht ausdrücklich angegeben.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Er sagte zu ihnen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben.
- source_word: Ἔρχεσθε καὶ ὄψεσθε
  choice: Kommt, dann werdet ihr sehen
  rationale: Die Einladung und die Zukunftsform bleiben erhalten; »dann« gibt den natürlichen Zusammenhang der beiden Verben wieder, ohne den Sinn näher festzulegen.
- source_word: ἦλθαν οὖν
  choice: Da gingen sie mit
  rationale: »Da« bildet die erzählerische Folgerung von οὖν ab. »gingen sie mit« bezeichnet idiomatisch, dass sie Jesu Einladung folgten.
- source_word: εἶδαν
  choice: sahen
  rationale: Die schlichte Wiedergabe bewahrt den sprachlichen Rückbezug auf »werdet ihr sehen«.
- source_word: ποῦ μένει
  choice: wo er wohnte
  rationale: Im unmittelbaren Zusammenhang bezeichnet μένω den Ort, an dem Jesus sich aufhielt beziehungsweise Unterkunft hatte; »wohnte« ist hier natürlich und lässt offen, ob der Aufenthalt dauerhaft war.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: blieben ... bei ihm
  rationale: Die Formulierung gibt sowohl das Verweilen als auch die persönliche Gemeinschaft mit Jesus wieder und bewahrt die Wortverbindung von μένει und ἔμειναν soweit im Deutschen möglich.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: an jenem Tag
  rationale: Die Zeitangabe wird ohne den nicht ausdrücklich genannten Zusatz »den Rest des Tages« wiedergegeben.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Es war ungefähr die zehnte Stunde
  rationale: Die wörtliche Zeitangabe und die Näherung durch ὡς bleiben erhalten, ohne ein bestimmtes System der Stundenrechnung vorauszusetzen.
theological_decisions:
- issue: Berechnung der »zehnten Stunde«
  choice: Die Quellformulierung »die zehnte Stunde« bleibt im Haupttext stehen.
  alternative: Etwa 16 Uhr bei einer Zählung ab Sonnenaufgang; nach einer römischen Zeitrechnung möglicherweise etwa 10 Uhr.
  rationale: Der griechische Text nennt das zugrunde liegende System der Stundenrechnung nicht. Die Übersetzung bewahrt diese Unbestimmtheit, während die Fußnote die wichtigsten Deutungen nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist knapp und einladend; die antike Zeitangabe bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
