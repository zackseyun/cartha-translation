revisions:
- from: 'Er sagte zu ihnen: »Kommt, dann werdet ihr sehen.« Da gingen sie mit und sahen, wo er wohnte, und blieben an jenem Tag bei ihm. Es war ungefähr die zehnte Stunde.[a]'
  to: 'Er sagte zu ihnen: »Kommt, dann werdet ihr sehen.« Da gingen sie hin und sahen, wo er sich aufhielt, und blieben an jenem Tag bei ihm. Es war ungefähr die zehnte Stunde.[a]'
  rationale: Die Revision entfernt die durch »mitgehen« nahegelegte, im Ausgangstext nicht ausdrücklich formulierte Begleitung und vermeidet mit »sich aufhielt« die mögliche Implikation eines dauerhaften Wohnsitzes. Die übrigen Formulierungen einschließlich der bewusst offenen Zeitangabe und ihrer Fußnote bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:53:49Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Einladung, Folgehandlung, Ort des Aufenthalts, Verbleiben und die unbestimmte Zeitangabe insgesamt zutreffend wieder. »Gingen sie mit« fügt jedoch gegenüber ἦλθαν eine nicht ausdrücklich bezeichnete Begleitung Jesu hinzu. »Wohnte« kann zudem im heutigen Deutsch eher einen dauerhaften Wohnsitz nahelegen, während μένει hier seinen gegenwärtigen Aufenthaltsort bezeichnet.
  naturalness: Der Text ist insgesamt modernes, flüssiges Standarddeutsch. »Da gingen sie hin« ist in diesem Zusammenhang idiomatisch und neutraler als »gingen sie mit«. »Wo er sich aufhielt« ist natürlich und trifft die situationsbezogene Aussage genauer.
  terminology: Die Wiedergabe von ὥρα ἦν ὡς δεκάτη als »ungefähr die zehnte Stunde« bewahrt die im griechischen Text offene Stundenrechnung. Die Fußnote stellt die verbreiteten Deutungsmöglichkeiten sachlich dar, ohne eine davon festzulegen.
  issues:
  - severity: medium
    issue: »Da gingen sie mit«
    rationale: Das deutsche »mitgehen« legt nahe, dass die beiden Jesus auf seinem Weg begleiteten. Das griechische ἦλθαν sagt lediglich, dass sie kamen; die Richtung bzw. Begleitung wird nicht eigens ausgedrückt. »Da gingen sie hin« gibt die Folge der Einladung ohne diesen Zusatz wieder.
  - severity: low
    issue: »wo er wohnte«
    rationale: Im Kontext bezeichnet μένει den Ort, an dem Jesus gerade untergebracht war bzw. sich aufhielt. »Wohnte« ist möglich, kann im modernen Deutsch aber unnötig einen festen Wohnsitz implizieren. »Wo er sich aufhielt« wahrt die zeitlich offene Aussage besser.
  revised_text: 'Er sagte zu ihnen: »Kommt, dann werdet ihr sehen.« Da gingen sie hin und sahen, wo er sich aufhielt, und blieben an jenem Tag bei ihm. Es war ungefähr die zehnte Stunde.[a]'
