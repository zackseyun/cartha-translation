  variant: modern standard German
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: de
  text: 'Philippus fand Nathanael und sagte zu ihm: »Wir haben den gefunden, über den Mose im Gesetz geschrieben hat und über den auch die Propheten geschrieben haben: Jesus, Sohn Josefs, aus Nazaret.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει … λέγει
  choice: fand … sagte
  rationale: Die historischen Präsensformen werden im Deutschen als Erzählpräteritum wiedergegeben; so bleibt der Handlungsablauf natürlich, ohne den Sinn zu verändern.
- source_word: Ὃν … ἔγραψεν
  choice: den, über den … geschrieben hat
  rationale: Die Formulierung gibt das Relativpronomen als Personenbezug wieder und ergänzt im Deutschen idiomatisch »über«.
- source_word: ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: »Gesetz« bezeichnet hier die mit Mose verbundene Schriftensammlung, nicht ein beliebiges einzelnes Gebot.
- source_word: οἱ προφῆται
  choice: die Propheten
  rationale: Die traditionelle und verständliche Bezeichnung bewahrt den Bezug auf das prophetische Schriftzeugnis.
- source_word: εὑρήκαμεν
  choice: wir haben … gefunden
  rationale: Das deutsche Perfekt gibt den gegenwärtigen Ergebnisbezug des griechischen Perfekts gut wieder.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: den Sohn Josefs
  rationale: Der Akkusativ kennzeichnet die Wortgruppe als nähere Bestimmung zu Jesus; der bestimmte Artikel ist im Deutschen in dieser Apposition natürlich.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: aus Nazaret
  rationale: »Aus« bildet ἀπό transparent als Herkunfts- oder Zuordnungsangabe ab und vermeidet die weniger genaue traditionelle Form »von Nazaret«.
- source_word: Ναθαναὴλ / Ἰησοῦν / Μωϋσῆς
  choice: Nathanael / Jesus / Mose
  rationale: Die Personennamen folgen den im modernen deutschen Bibelgebrauch etablierten Formen.
theological_decisions:
- issue: Die Bezeichnung Jesu als »Sohn Josefs«
  choice: Die Aussage wird ohne erklärende Harmonisierung als Äußerung des Philippus wiedergegeben.
  alternative: »Jesus, der für einen Sohn Josefs gehalten wurde« oder eine ausdrückliche rechtliche beziehungsweise soziale Einordnung
  rationale: Der Vers nennt Jesus in der berichteten Rede schlicht »Sohn Josefs«. Eine christologische Erläuterung würde dem Wortlaut eine Deutung hinzufügen, die hier nicht ausdrücklich steht.
- issue: Das Zeugnis von Mose und den Propheten
  choice: Mose schreibt im Gesetz über den Gesuchten, ebenso die Propheten.
  alternative: Eine ausdrücklich messianische Paraphrase wie »den verheißenen Messias«
  rationale: Die Übersetzung bewahrt den Anspruch des Philippus auf das Schriftzeugnis, ohne dessen genaue Auslegung oder Reichweite über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; »aus Nazaret« hält sich eng an die Herkunftsangabe des griechischen Textes. Die Wiederholung des gedanklich zu ergänzenden Verbs bei Mose und den Propheten vermeidet im Deutschen eine schwerfällige oder missverständliche Koordination.
