    rationale: Die Vorlage kann die Verbhandlung bei „die Propheten“ implizieren. Im Deutschen ist „und über den auch die Propheten geschrieben haben“ eindeutig und natürlich, ohne den Umfang des Schriftzeugnisses auszudeuten.
