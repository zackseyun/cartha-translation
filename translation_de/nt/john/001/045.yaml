  source_fidelity: Der Entwurf gibt die historischen Präsensformen sinnvoll im Präteritum wieder und bewahrt das Perfekt εὑρήκαμεν mit „haben gefunden“. Die Bezüge auf Mose, das Gesetz und die Propheten sowie die Herkunftsangabe ἀπὸ Ναζαρέτ sind sachgerecht. Die appositionelle Akkusativgruppe zu Jesus sollte jedoch ohne den im Deutschen unnötig bestimmten Artikel stehen.
  naturalness: „Jesus, den Sohn Josefs, aus Nazaret“ wirkt als Apposition im modernen Deutsch etwas schwerfällig. „Jesus, Sohn Josefs, aus Nazaret“ ist natürlicher und lässt zugleich die drei Bezeichnungen klar auf Jesus bezogen bleiben. Die elliptische Koordination „geschrieben hat und ebenso die Propheten“ ist verständlich, aber die Wiederaufnahme des Verbs ergibt einen klareren, flüssigeren Satz.
  terminology: „Philippus“, „Nathanael“, „Mose“, „Gesetz“, „Propheten“ und „Nazaret“ entsprechen dem modernen deutschen Bibelgebrauch. „Sohn Josefs“ gibt die berichtete soziale Identifikation wieder, ohne eine zusätzliche christologische Deutung einzutragen.
