base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: de
  text: Philippus stammte aus Betsaida, der Stadt, aus der auch Andreas und Petrus stammten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν
  choice: stammte
  rationale: Das Imperfekt von εἰμί bezeichnet hier den Herkunftshintergrund des Philippus. Im Deutschen gibt „stammte aus“ die Verbindung mit ἀπό natürlich und präzise wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwacher erzählerischer Anschluss. Ein vorangestelltes „Nun“ wäre im heutigen Deutschen unnötig markiert; der Zusammenhang trägt den Übergang.
- source_word: ὁ Φίλιππος
  choice: Philippus
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform; der Artikel wird bei einem Eigennamen im Deutschen nicht wiedergegeben.
- source_word: ἀπὸ Βηθσαϊδά
  choice: aus Betsaida
  rationale: ἀπό bezeichnet Herkunft. „Aus Betsaida stammen“ ist idiomatisches modernes Deutsch; der Ortsname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: ἐκ τῆς πόλεως
  choice: der Stadt, aus der auch … kamen
  rationale: πόλις wird seinem üblichen Sinn entsprechend mit „Stadt“ wiedergegeben. Die appositionale Wiederaufnahme wird im Deutschen als Relativsatz natürlich und verständlich formuliert.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: aus der auch Andreas und Petrus kamen
  rationale: Die Genitive bezeichnen hier die Verbindung der Stadt mit Andreas und Petrus, wahrscheinlich als deren Herkunftsort. Der Relativsatz macht diese im Deutschen sonst schwer verständliche Beziehung explizit, ohne mehr als den kontextuell naheliegenden Herkunftssinn zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung vermeidet das im Deutschen unnatürliche „die Stadt des Andreas und Petrus“ und bewahrt zugleich die Herkunftsangabe sowie die Identifikation Betsuidas mit dem Herkunftsort der beiden Männer.
