  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: de
  text: 'Nathanael antwortete ihm: »Rabbi, du bist der Sohn Gottes, du bist der König Israels.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche Wiedergabe von ἀποκρίνομαι in einer erzählenden Dialogszene.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Der vertraute jüdische Anredetitel bleibt erhalten und bewahrt den geschichtlichen und kulturellen Kontext; »Lehrer« wäre sinngemäß, aber weniger spezifisch.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die bestimmte, titelartige griechische Formulierung wird ohne Abschwächung oder erklärende Erweiterung wiedergegeben.
- source_word: βασιλεὺς
  choice: König
  rationale: »König« ist die direkte lexikalische Entsprechung; das prädikative Substantiv ist hier durch »Israels« bestimmt und titelartig zu verstehen.
- source_word: τοῦ Ἰσραήλ
  choice: Israels
  rationale: Der deutsche Genitiv gibt den griechischen Genitiv knapp und natürlich wieder und wahrt die Titelform.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: du bist … du bist
  rationale: Die Wiederholung bewahrt die betonte, parallele Form des Bekenntnisses.
- source_word: Ναθαναήλ
  choice: Nathanael
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Schreibweise.
theological_decisions:
- issue: Christologische Aussage »der Sohn Gottes«
  choice: Der Titel wird unverändert als »der Sohn Gottes« wiedergegeben.
  alternative: »ein Sohn Gottes« oder eine abschwächende Umschreibung
  rationale: Der griechische Text formuliert bestimmt und titelartig. Die Übersetzung bewahrt diese christologische Aussage, ohne spätere dogmatische Formeln einzutragen.
- issue: Königlich-messianischer Sinn von »König Israels«
  choice: »der König Israels«
  alternative: »König über Israel« oder »Israels König«
  rationale: Die Formulierung erhält den ausdrücklichen Königstitel und den Genitiv des Ausgangstextes, ohne dessen messianische Bedeutung auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält den jüdischen Titel »Rabbi« sowie die emphatische Wiederholung »du bist … du bist« bei.
