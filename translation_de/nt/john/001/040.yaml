review_pass:
  verdict: revise
  source_fidelity: Die explizite Ergänzung „Jesus“ in der Hauptübersetzung geht über das griechische αὐτῷ („ihm“) hinaus. Zwar ist Jesus im Erzählzusammenhang eindeutig die gemeinte Person, doch die Übersetzung kann das Pronomen ohne Verlust natürlich beibehalten. „Von Johannes gehört“ gibt παρὰ Ἰωάννου präziser wieder als die im Entwurf gewählte Stellung „Johannes gehört“.
  naturalness: „Andreas, der Bruder des Simon Petrus, war einer der beiden ...“ ist modernes, klares Standarddeutsch. „Einer der beiden“ ist idiomatischer als „einer von den beiden“.
  terminology: Die etablierten Namensformen Andreas, Simon Petrus, Johannes und Jesus sind angemessen. „Bruder“ gibt ἀδελφός zutreffend wieder; die Formulierung „des Simon Petrus“ ist natürlich und quellennah.
  issues:
