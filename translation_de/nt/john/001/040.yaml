id: JHN.1.40
reference: John 1:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: de
  text: Andreas, der Bruder des Simon Petrus, war einer der beiden, die von Johannes gehört hatten und ihm gefolgt waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Pronomen „ihm“ bezieht sich im Zusammenhang auf Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt von εἰμί dient als Kopula zur Identifizierung des Andreas als einer der beiden; „war“ ist die natürliche deutsche Entsprechung.
- source_word: Ἀνδρέας
  choice: Andreas
  rationale: Der Personenname folgt der etablierten deutschen Namensform.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: der Bruder von Simon Petrus
  rationale: Die Formulierung bewahrt die familiäre Beziehung und gibt den Genitiv in natürlichem Standarddeutsch wieder.
- source_word: εἷς ἐκ τῶν δύο
  choice: einer von den beiden
  rationale: Dies ist eine idiomatische und genaue Wiedergabe des partitiven Ausdrucks.
- source_word: τῶν ἀκουσάντων
  choice: die ... gehört hatten
  rationale: 'Das Plusquamperfekt macht im Deutschen die zeitliche Abfolge natürlich deutlich: Zuerst hörten sie Johannes, dann folgten sie Jesus.'
- source_word: παρὰ Ἰωάννου
  choice: Johannes gehört hatten
  rationale: Bei einem Verb des Hörens bezeichnet παρά mit Genitiv die Person, von der etwas gehört wird. Die knappe deutsche Konstruktion bewahrt Johannes als Quelle, ohne „den Täufer“ ergänzend einzufügen.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: und Jesus gefolgt waren
  rationale: ἀκολουθέω wird direkt mit „folgen“ wiedergegeben. Der Name Jesus macht den im Erzählzusammenhang klaren Bezug des griechischen Pronomens in natürlichem Deutsch deutlich; die formnähere Alternative steht in der Fußnote.
theological_decisions:
- issue: Bezugswort von αὐτῷ
  choice: Jesus
  alternative: ihm; formal könnte das Pronomen isoliert auch auf Johannes bezogen werden
  rationale: Nach Johannes 1,35–39 hören die beiden Jünger Johannes und folgen daraufhin Jesus. Die Erzählung bestimmt somit Jesus als Bezugsperson. Eine Fußnote dokumentiert dennoch die wörtlichere pronominale Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist klar und mündlich gut verständlich; der historische Eigenname „Simon Petrus“ bleibt unverändert. Das explizite „Jesus“ vermeidet im Deutschen eine unnötige Mehrdeutigkeit, während die Fußnote die Form des griechischen Pronomens offenlegt.
