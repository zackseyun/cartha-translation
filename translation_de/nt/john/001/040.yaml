    issue: „Jesus“ wird anstelle des griechischen Pronomens αὐτῷ in den Haupttext eingefügt.
    rationale: Der Kontext weist das Pronomen auf Jesus, aber der griechische Text nennt ihn in diesem Vers nicht ausdrücklich. Das deutsche „ihm“ ist idiomatisch und bewahrt die Formulierung des Ausgangstextes; die Kontextzuordnung kann in der Fußnote erläutert werden.
  - severity: low
    issue: Die Formulierung „die Johannes gehört hatten“ ist weniger präzise als „die von Johannes gehört hatten“.
    rationale: παρὰ Ἰωάννου bezeichnet hier die Person als Quelle dessen, was die beiden hörten. „Von Johannes gehört“ bildet dies im Deutschen klarer ab.
  - severity: low
    issue: „Einer von den beiden“ ist stilistisch etwas schwerfälliger.
    rationale: „Einer der beiden“ ist die übliche knappe deutsche partitive Form und wahrt εἷς ἐκ τῶν δύο.
  revised_text: Andreas, der Bruder des Simon Petrus, war einer der beiden, die von Johannes gehört hatten und ihm gefolgt waren.[a]
