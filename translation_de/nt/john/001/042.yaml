  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: de
  text: 'Er brachte ihn zu Jesus. Jesus sah ihn aufmerksam an und sagte: »Du bist Simon, der Sohn des Johannes[a]. Du wirst Kephas genannt werden[b]« (das heißt übersetzt: Petrus).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen hier »Jona« statt »Johannes«; der SBLGNT-Text hat »Johannes«.
    reason: textual_variant
  - marker: b
    text: Kephas ist die semitische Namensform, der Petrus als griechische Form entspricht; die Grundbedeutungen sind »Fels« beziehungsweise »Stein«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Er brachte ihn zu Jesus
  rationale: ἄγω mit πρός und Akkusativ bezeichnet hier die vollzogene Bewegung zu einer Person; „brachte … zu“ ist im Deutschen natürlich und genau.
- source_word: ἐμβλέψας αὐτῷ
  choice: sah ihn aufmerksam an
  rationale: ἐμβλέπω bezeichnet einen gerichteten, eingehenden Blick. „Aufmerksam ansehen“ gibt diese Nuance wieder, ohne sie zu „anstarren“ zu übersteigern.
- source_word: Σὺ εἶ Σίμων
  choice: Du bist Simon
  rationale: Die ausdrückliche Anrede wird direkt und natürlich wiedergegeben; eine zusätzliche typografische Betonung von „du“ ist nicht erforderlich.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: der Sohn des Johannes
  rationale: Die Übersetzung folgt der SBLGNT-Lesart Ἰωάννου. „Johannes“ ist die etablierte deutsche Namensform.
- source_word: σὺ κληθήσῃ
  choice: Du wirst … genannt werden
  rationale: Die Form ist Futur Passiv von καλέω. Die Wiedergabe bewahrt sowohl den Zukunftsbezug als auch die passive Namensgebung.
- source_word: Κηφᾶς
  choice: Kephas
  rationale: Der semitische Personenname wird nach gebräuchlicher deutscher Konvention transliteriert und nicht im Haupttext mit „Fels“ übersetzt.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: das wird mit Petrus übersetzt
  rationale: Die erklärende Parenthese des griechischen Textes wird bewahrt. Πέτρος erscheint als Personenname in seiner etablierten deutschen Form „Petrus“.
theological_decisions:
- issue: Erklärende Beziehung zwischen Kephas und Petrus
  choice: Beide Formen bleiben im Haupttext Personennamen; ihre Bedeutung wird in einer Fußnote erläutert.
  alternative: Die Namen im Haupttext dynamisch mit „Fels“ oder „Stein“ wiedergeben.
  rationale: Der Vers schildert eine Namensgebung und erklärt den semitischen Namen durch seine griechische Entsprechung. Die Beibehaltung beider Namen wahrt diese Textgestalt und vermeidet, aus der Wortbedeutung weitergehende theologische Folgerungen in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Anführungszeichen folgen deutscher Typografie. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Angaben.
