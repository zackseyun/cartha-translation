  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: de
  text: Er kam zu dem, was ihm gehörte[a], doch die Seinen nahmen ihn nicht auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinen eigenen Bereich“. Der erste griechische Ausdruck steht im sächlichen Plural und unterscheidet sich vom folgenden männlichen Plural „die Seinen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „nahmen ihn nicht an“ beziehungsweise „hießen ihn nicht willkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: in sein Eigentum
  rationale: Das substantivierte Neutrum Plural bezeichnet das, was ihm gehörte—seinen eigenen Bereich, seine Heimat oder seinen Besitz—und wird bewusst vom folgenden maskulinen Ausdruck für Personen unterschieden. „In sein Eigentum“ ist im Deutschen knapp und lässt den genauen Umfang offen.
- source_word: ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι bezeichnet hier schlicht das Kommen und wird natürlich mit „kam“ wiedergegeben.
- source_word: οἱ ἴδιοι
  choice: die Seinen
  rationale: Der maskuline Plural bezeichnet Personen. „Die Seinen“ bewahrt die sprachliche Wiederaufnahme von ἴδιος und unterscheidet sich zugleich vom vorausgehenden sächlichen „sein Eigentum“.
- source_word: παρέλαβον
  choice: nahmen ... auf
  rationale: παραλαμβάνω kann hier das Aufnehmen, Annehmen oder Willkommenheißen einer Person bezeichnen. „Aufnehmen“ wahrt diese Bedeutungsbreite und klingt im Deutschen natürlich.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist im Kontext auf das Wort beziehungsweise das Licht und wird entsprechend maskulin wiedergegeben.
theological_decisions:
- issue: Bezug und Nuance der doppelten Verwendung von ἴδιος
  choice: Der erste Ausdruck bezeichnet das, was ihm gehörte („sein Eigentum“), der zweite seine eigenen Leute („die Seinen“).
  alternative: Beide Ausdrücke könnten auf sein eigenes Volk bezogen oder der erste enger als sein Zuhause beziehungsweise sein Haus verstanden werden.
  rationale: Der Wechsel vom sächlichen Plural τὰ ἴδια zum männlichen Plural οἱ ἴδιοι legt eine bewusste Unterscheidung zwischen Bereich beziehungsweise Besitz und Personen nahe. Die Formulierung hält offen, ob „sein Eigentum“ besonders Heimat, Herrschaftsbereich oder Besitz meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität des griechischen Satzes bleibt erhalten; „sein Eigentum“ und „die Seinen“ bilden den grammatischen und inhaltlichen Kontrast ab, ohne den ersten Ausdruck auf Heimat, Haus, Volk oder Schöpfungsbereich festzulegen.
