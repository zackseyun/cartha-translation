  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: de
  text: Am nächsten Tag stand Johannes wieder dort, und zwei seiner Jünger waren bei ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die Verbindung mit Artikel ist eine Zeitangabe und bedeutet „am nächsten“ beziehungsweise „am folgenden Tag“. „Am nächsten Tag“ ist im modernen Deutschen natürlich und genau.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort kennzeichnet die Wiederholung gegenüber der vorherigen Szene und wird knapp und idiomatisch mit „wieder“ wiedergegeben.
- source_word: εἱστήκει
  choice: stand ... dort
  rationale: Die Form bezeichnet hier einen in der Vergangenheit bestehenden Zustand. „Stand ... dort“ gibt Haltung und szenische Verortung natürlich wieder; „dort“ ist zur idiomatischen Verdeutlichung ergänzt.
- source_word: ὁ Ἰωάννης
  choice: Johannes
  rationale: Dies ist die etablierte deutsche Namensform. Obwohl der Kontext Johannes den Täufer meint, steht im griechischen Text lediglich „Johannes“.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion koordiniert Johannes und die folgende Gruppe schlicht parataktisch.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: zwei von seinen Jüngern waren bei ihm
  rationale: Wörtlich steht „zwei von seinen Jüngern“. Das ergänzte Prädikat „waren bei ihm“ macht die im Griechischen knappe Szenenbeschreibung im Deutschen vollständig, ohne die partitive Bedeutung von ἐκ aufzugeben.
