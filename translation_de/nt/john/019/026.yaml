source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: de
  text: 'Als Jesus nun seine Mutter und den Jünger sah, den er liebte und der dabeistand, sagt er zu seiner Mutter: »Frau[a], sieh, dein Sohn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Anrede »Frau« ist im Griechischen respektvoll und nicht unhöflich oder abweisend; sinngemäß auch: »werte Frau«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet den Fortgang der Erzählung und stellt zugleich den Zusammenhang mit der vorausgehenden Szene her, ohne eine stärkere Schlussfolgerung auszudrücken.
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das Aoristpartizip wird in natürlichem Deutsch als temporaler Nebensatz wiedergegeben.
- source_word: τὴν μητέρα
  choice: seine Mutter
  rationale: Der griechische Artikel bezeichnet im Kontext Jesu Mutter; das Deutsche verlangt hier idiomatisch das Possessivpronomen.
- source_word: τὸν μαθητὴν
  choice: den Jünger
  rationale: Der bestimmte Artikel kennzeichnet einen in der johanneischen Erzählung bereits identifizierbaren Jünger.
- source_word: παρεστῶτα
  choice: dabeistehen sah
  rationale: Gibt anschaulich wieder, dass der Jünger dort anwesend war und stand; die Wiederholung von „sah“ sorgt im Deutschen für syntaktische Klarheit.
- source_word: ὃν ἠγάπα
  choice: den er liebte
  rationale: Bewahrt die charakteristische johanneische Bezeichnung des Jüngers und lässt das Subjekt wie im Kontext eindeutig auf Jesus bezogen.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das historische Präsens und damit die erzählerische Unmittelbarkeit des griechischen Textes.
- source_word: Γύναι
  choice: Frau
  rationale: Ist die direkte deutsche Entsprechung der respektvollen, aber nicht vertraulichen Anrede. Eine Fußnote verhindert, dass sie nach heutigem Sprachempfinden fälschlich als schroff verstanden wird.
- source_word: ἴδε
  choice: sieh
  rationale: Gibt den deiktischen Imperativ in gegenwärtigem, würdigem Deutsch wieder, ohne das altertümlichere „siehe“ vorauszusetzen.
- source_word: ὁ υἱός σου
  choice: dein Sohn
  rationale: Bewahrt die knappe Identifikationsaussage und ihre feierliche Offenheit, ohne die Beziehung durch zusätzliche Erklärung auszudeuten.
theological_decisions:
- issue: Ton der Anrede Γύναι an Jesu Mutter
  choice: Die direkte Anrede „Frau“ bleibt im Haupttext erhalten und wird durch eine Fußnote als respektvoll erläutert.
  alternative: „Liebe Frau“ oder „Madam“
  rationale: Der griechische Ausdruck ist nicht geringschätzig, enthält aber auch nicht ausdrücklich die Vertraulichkeit von „liebe“. Die direkte Wiedergabe bewahrt den Wortlaut und vermeidet zugleich durch die Fußnote ein modernes Missverständnis.
- issue: Bedeutung der Aussage „dein Sohn“
  choice: Die knappe Formulierung wird ohne erklärenden Zusatz wiedergegeben.
  alternative: „Sieh, er ist jetzt dein Sohn“ oder „Hier ist dein Sohn“
  rationale: Der Ausgangstext identifiziert den Jünger in einer neuen Sohnesbeziehung, erklärt aber deren genaue Tragweite nicht. Die Übersetzung bewahrt diese theologische und erzählerische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens bleibt erhalten. „Sieh“ vermeidet unnötige Altertümlichkeit, während die knappe direkte Rede die feierliche Wirkung des Ausgangstextes wahrt.
