  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: de
  text: Daraufhin nahm Pilatus Jesus und peitschte ihn aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε οὖν
  choice: Daraufhin
  rationale: Die Verbindung kennzeichnet den zeitlichen Fortgang und zugleich die Folgerung aus dem vorangehenden Geschehen. „Daraufhin“ gibt beides in natürlichem Deutsch knapp wieder.
- source_word: ἔλαβεν
  choice: nahm
  rationale: Die schlichte Wiedergabe bewahrt die aktive Satzstruktur des Griechischen, ohne das Verb unnötig zu „ergreifen“ oder „festnehmen“ zu verstärken.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Die im Deutschen übliche Namensform; der Artikel wird bei Personennamen hier nicht wiedergegeben.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Die im Deutschen übliche Namensform im Akkusativ.
- source_word: ἐμαστίγωσεν
  choice: ließ ihn auspeitschen
  rationale: Das Verb bezeichnet eine schwere Auspeitschung. Die Formulierung mit „ließ“ entspricht im Deutschen natürlichem Sprachgebrauch für die amtlich veranlasste Handlung eines Statthalters, ohne die Verantwortung des Pilatus abzuschwächen; die strengere grammatische Oberflächenform wird in der Fußnote genannt.
theological_decisions:
- issue: Unmittelbare oder beauftragte Ausführung der Auspeitschung durch Pilatus
  choice: 'Pilatus als verantwortlichen Veranlasser ausdrücken: „ließ ihn auspeitschen“'
  alternative: „Pilatus nahm Jesus und peitschte ihn aus“
  rationale: Im Griechischen ist Pilatus grammatisches Subjekt beider Verben; dies kann sowohl persönliche Ausführung als auch amtlich veranlasstes Handeln bezeichnen. Natürliches Deutsch formuliert bei einem römischen Statthalter eher mit delegierter Handlung. Die Fußnote hält die formnähere Möglichkeit ausdrücklich offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Auspeitschen“ ist gegenwärtiger und unmittelbarer als das traditionellere „geißeln“.
