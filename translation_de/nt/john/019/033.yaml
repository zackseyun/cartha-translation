id: JHN.19.33
reference: John 19:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: de
  text: Als sie aber zu Jesus kamen[a] und sahen, dass er schon tot war[b], brachen sie ihm die Beine nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Johannes verbindet dieses Geschehen später mit der Schrift: »Kein Knochen von ihm wird zerbrochen werden« (Johannes 19,36; vgl. 2. Mose 12,46; 4. Mose 9,12; Psalm 34,21).'
    reason: cross_reference
  - marker: b
    text: 'Oder: »und sahen, dass er bereits gestorben war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Als sie aber zu Jesus kamen
  rationale: Die Partizipialkonstruktion wird im Deutschen natürlich als Temporalsatz wiedergegeben. »Aber« bewahrt den leichten Kontrast von δέ zum Vorgehen bei den zuvor genannten Gekreuzigten.
- source_word: ὡς εἶδον
  choice: und sahen, dass
  rationale: Die Formulierung gibt die Wahrnehmung wieder, auf der das folgende Unterlassen beruht, ohne die kausale Beziehung stärker auszudeuten, als es der griechische Text verlangt.
- source_word: ἤδη
  choice: schon
  rationale: »Schon« bezeichnet knapp und idiomatisch, dass Jesu Tod vor ihrer Ankunft eingetreten war.
- source_word: τεθνηκότα
  choice: tot war
  rationale: Das Perfektpartizip betont den eingetretenen und fortbestehenden Zustand. »Tot war« gibt diesen Zustand in natürlichem Deutsch wieder.
- source_word: οὐ κατέαξαν
  choice: brachen ... nicht
  rationale: κατάγνυμι bezeichnet hier das Brechen von Gliedmaßen beziehungsweise Knochen; »brechen« ist im Kontext die präzise und geläufige Wiedergabe.
- source_word: τὰ σκέλη
  choice: die Beine
  rationale: σκέλη bezeichnet die Beine. Die natürliche deutsche Wendung lautet »jemandem die Beine brechen«; eine ausdrückliche Nennung der Knochen würde die Verbindung zu Vers 36 vorwegnehmen.
theological_decisions:
- issue: Möglicher Schriftbezug der nicht gebrochenen Beine Jesu
  choice: Der Haupttext bleibt eine sachliche Erzählung und spricht von den Beinen.
  alternative: »Knochen« verwenden, um die Erfüllungsaussage in Johannes 19,36 vorwegzunehmen.
  rationale: Erst Johannes 19,36 stellt die ausdrückliche Verbindung zur Schrift her. Vers 33 sollte diese theologische Deutung nicht vorzeitig in die Erzählung eintragen; die Fußnote weist auf den später genannten Zusammenhang hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und bewahrt den milden Kontrast des griechischen δέ. »Schon tot war« ist allgemein verständlich; die Alternative in der Fußnote bildet den verbalen Aspekt von τεθνηκότα ausdrücklich ab.
