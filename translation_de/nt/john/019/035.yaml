id: JHN.19.35
reference: John 19:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: de
  text: Und der, der es gesehen hat, hat es bezeugt, und sein Zeugnis ist wahr; und jener weiß, dass er die Wahrheit sagt, damit auch ihr glaubt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit auch ihr weiter glaubt“. Der griechische Präsenskonjunktiv kann eine fortdauernde Bedeutung haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: der, der es gesehen hat
  rationale: Das substantivierte Perfektpartizip wird bewahrt. Das ergänzte „es“ ist im Deutschen für einen natürlichen Rückbezug auf das zuvor geschilderte Geschehen erforderlich; das Perfekt hebt die bleibende Bedeutung des Gesehenen hervor.
- source_word: μεμαρτύρηκεν
  choice: hat es bezeugt
  rationale: Das deutsche Perfekt gibt das abgeschlossene Zeugnis mit fortdauernder Geltung natürlich wieder. „Bezeugen“ wahrt zudem den Zusammenhang mit „Zeugnis“.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: sein Zeugnis ist wahr
  rationale: Die direkte Formulierung erhält die Aussage über die Wahrheit und Verlässlichkeit des Zeugnisses, ohne sie auf bloße Aufrichtigkeit oder Echtheit zu verengen.
- source_word: ἐκεῖνος
  choice: jener
  rationale: „Jener“ wahrt die betonte demonstrative Form des Griechischen und lässt offen, ob der Erzähler auf sich selbst in der dritten Person oder auf einen anderen Zeugen verweist.
- source_word: οἶδεν
  choice: weiß
  rationale: οἶδα ist formal ein Perfekt, hat hier aber präsentisch-stative Bedeutung; „weiß“ ist die sachgemäße deutsche Wiedergabe.
- source_word: ἀληθῆ λέγει
  choice: die Wahrheit sagt
  rationale: Die idiomatische Wendung gibt das substantivierte neutrale Pluraladjektiv natürlich wieder, ohne das Griechische unnötig zu paraphrasieren.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: damit auch ihr glaubt
  rationale: „Damit“ drückt den Zweck aus; „auch ihr“ erhält die Hervorhebung der angesprochenen Leser. Das Präsens des Konjunktivs wird im Haupttext unmarkiert wiedergegeben.
theological_decisions:
- issue: Bezug der betonten Bezeichnungen für den Zeugen
  choice: Die dritte Person bleibt mit „der, der …“ und „jener“ erhalten.
  alternative: Den Zeugen ausdrücklich als den geliebten Jünger, den Erzähler oder eine davon verschiedene Person identifizieren.
  rationale: Der griechische Text nennt den Zeugen nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und die feierliche Selbstbezeugungsform.
- issue: Aspektuelle Aussage von πιστεύητε
  choice: damit auch ihr glaubt
  alternative: damit auch ihr weiter glaubt
  rationale: Der Präsenskonjunktiv kann eine fortdauernde Glaubenshaltung nahelegen, muss aber nicht ausdrücklich durativ verstanden werden. Der Haupttext bleibt unmarkiert; die mögliche Nuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Zeugnis-Wortgruppe und die betonte Form „jener“ bleiben erhalten. Das Semikolon gliedert den langen Satz, ohne seinen argumentativen Zusammenhang aufzubrechen.
