  verdict: approve
  source_fidelity: Der Entwurf gibt die Perfektformen ὁ ἑωρακὼς und μεμαρτύρηκεν angemessen wieder und erhält die Abfolge von Sehen, Zeugnis und Wissen. „Sein Zeugnis ist wahr“ trifft ἀληθινὴ ... ἡ μαρτυρία. „Die Wahrheit sagt“ ist eine idiomatische und sachlich genaue Wiedergabe von ἀληθῆ λέγει. Die finale Konstruktion „damit auch ihr glaubt“ gibt ἵνα καὶ ὑμεῖς πιστεύητε korrekt wieder.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Ergänzung „es“ ist im Kontext verständlich und macht die im Griechischen nur kontextuell bestimmte Bezugnahme natürlich. „Jener“ ist leicht gehoben, aber für die demonstrative Hervorhebung von ἐκεῖνος stilistisch vertretbar.
  terminology: Die Wortfamilie „bezeugt/Zeugnis“ bildet μαρτυρέω/μαρτυρία konsistent ab. Die Wiedergabe vermeidet eine unbegründete Identifikation des Zeugen. Die Fußnote bewahrt die mögliche fortdauernde Nuance des Präsenskonjunktivs, ohne sie dem Haupttext aufzuzwingen.
