id: JHN.19.42
reference: John 19:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: de
  text: Dort legten sie Jesus also ins Grab, weil der Vorbereitungstag der Juden war und weil das Grab in der Nähe lag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf das unmittelbar zuvor genannte Grab. „Dort“ gibt diesen räumlichen Bezug knapp und natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet die Folgerung beziehungsweise den Fortgang aus dem vorherigen Zusammenhang. Das nachgestellte „also“ wirkt im modernen Deutschen natürlich.
- source_word: διὰ τὴν παρασκευὴν
  choice: weil es der Vorbereitungstag … war
  rationale: διά mit Akkusativ bezeichnet hier den Grund. παρασκευή ist in diesem Zusammenhang ein kalendarischer Fachausdruck für den Tag der Vorbereitung; die verbale Wiedergabe ist im Deutschen flüssiger als „wegen des Vorbereitungstags“.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Der Genitiv wird formal sichtbar bewahrt, ohne genauer festzulegen, ob die Zuordnung ethnisch, religiös oder auf den Brauch bezogen gemeint ist.
- source_word: ὅτι
  choice: und
  rationale: Der zweite begründende Umstand wird innerhalb des bereits mit „weil“ eröffneten Kausalsatzes koordiniert. So bleibt erhalten, dass sowohl der Vorbereitungstag als auch die Nähe des Grabes die Bestattung an diesem Ort erklären.
- source_word: ἐγγὺς
  choice: in der Nähe
  rationale: Die geläufige deutsche Wendung gibt die räumliche Nähe des Grabes klar wieder.
- source_word: μνημεῖον
  choice: Grab
  rationale: Im Bestattungskontext bezeichnet μνημεῖον die Grabstätte; „Grab“ ist die klare und übliche deutsche Entsprechung.
- source_word: ἔθηκαν
  choice: legten … ins Grab
  rationale: τίθημι bedeutet hier, Jesus an diesem Ort niederzulegen. „Ins Grab legen“ macht den im Zusammenhang eindeutigen Zielort natürlich kenntlich, ohne die Handlung näher auszudeuten.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe von παρασκευή im Passionsbericht
  choice: Vorbereitungstag
  alternative: Rüsttag
  rationale: „Vorbereitungstag“ ist für heutige Leser unmittelbar verständlich und bewahrt den kalendarischen Charakter des Ausdrucks, ohne über den griechischen Text hinaus einen bestimmten Fest- oder Sabbatkalender festzulegen.
- issue: Wiedergabe von τῶν Ἰουδαίων im johanneischen Erzählzusammenhang
  choice: der Juden
  alternative: jüdischer Vorbereitungstag
  rationale: Die Genitivform des Ausgangstextes bleibt erkennbar. Die Formulierung bezeichnet hier den zugehörigen Vorbereitungstag und enthält an dieser Stelle kein theologisches Urteil über das jüdische Volk.
- issue: Verhältnis der beiden Kausalangaben
  choice: weil … und …
  alternative: wegen …, weil …
  rationale: Die deutsche Koordination behandelt Vorbereitungstag und Nähe des Grabes als zusammengehörige Umstände, ohne ihre genaue logische Gewichtung dogmatisch festzulegen. Die formalere Alternative bleibt möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist gegenüber der griechischen Wortstellung behutsam umgeordnet, damit die beiden begründenden Umstände klar und flüssig erscheinen. „Ins Grab“ verdeutlicht den aus dem unmittelbaren Kontext sicheren Bezug von „dort“, ohne einen zusätzlichen theologischen Gehalt einzuführen.
