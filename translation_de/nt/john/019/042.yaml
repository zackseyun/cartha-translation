review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: ἐκεῖ durch „Dort“, οὖν durch „also“, die Bestattung Jesu im Grab sowie beide dafür genannten Umstände. „Ins Grab“ ist aus dem unmittelbaren Kontext gedeckt. Die zwei griechischen Kausalangaben (διά … und ὅτι) sollten im Deutschen jedoch als zwei ausdrücklich kausale Angaben erkennbar bleiben.'
  naturalness: Der Entwurf ist insgesamt verständlich und registergerecht. Die Formulierung „weil es der Vorbereitungstag der Juden war“ ist jedoch unnötig schwerfällig; ohne „es“ ist sie idiomatischer. Die Wiederholung von „weil“ vor dem zweiten Grund macht den Satz zudem klarer.
  terminology: „Vorbereitungstag der Juden“ gibt παρασκευὴ τῶν Ἰουδαίων sachlich und ohne zusätzliche Festlegung wieder. „Rüsttag“ ist als traditionelle lexikalische Alternative in einer Fußnote vertretbar, aber nicht als Haupttext für modernes Standarddeutsch erforderlich.
  issues:
  - severity: low
    issue: Unidiomatische Kopulakonstruktion
    rationale: „weil es der Vorbereitungstag der Juden war“ ist zwar verständlich, aber gegenüber „weil der Vorbereitungstag der Juden war“ stilistisch unnötig umständlich.
  - severity: low
    issue: Zweite Kausalangabe nur koordinierend angeschlossen
    rationale: Das bloße „und“ kann den zweiten, mit ὅτι eingeführten Begründungsumstand abschwächen. „und weil“ bewahrt die kausale Funktion klar und bleibt natürlich.
  - severity: low
    issue: Fußnotenalternative ist sprachlich holprig
    rationale: „weil der jüdische Vorbereitungstag war“ wirkt im Deutschen elliptisch. Eine Nominalformulierung bietet eine klare, tatsächlich gleichwertige Alternative.
  revised_text: Dort legten sie Jesus also ins Grab, weil der Vorbereitungstag der Juden war und weil das Grab in der Nähe lag.
  revised_footnotes:
  - marker: a
    text: 'Oder: „wegen des jüdischen Vorbereitungstags“; auch: „wegen des Rüsttags der Juden“.'
    reason: Die Genitivverbindung kann idiomatisch mit dem Adjektiv „jüdisch“ wiedergegeben werden; παρασκευή lässt sich traditionell auch mit „Rüsttag“ übersetzen.
  revision_rationale: Die Revision glättet die deutsche Satzbildung und kennzeichnet beide im Griechischen angeführten Gründe ausdrücklich als kausal. Sie erhält den Ortsbezug, die narrative Verknüpfung und die sachliche, nicht polemische Wiedergabe von τῶν Ἰουδαίων.
