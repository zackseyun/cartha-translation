revisions:
- from: Dort legten sie Jesus also ins Grab, weil es der Vorbereitungstag der Juden[a] war und das Grab in der Nähe lag.
  to: Dort legten sie Jesus also ins Grab, weil der Vorbereitungstag der Juden war und weil das Grab in der Nähe lag.
  rationale: Die Revision glättet die deutsche Satzbildung und kennzeichnet beide im Griechischen angeführten Gründe ausdrücklich als kausal. Sie erhält den Ortsbezug, die narrative Verknüpfung und die sachliche, nicht polemische Wiedergabe von τῶν Ἰουδαίων.
