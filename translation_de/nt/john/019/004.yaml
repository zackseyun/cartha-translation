  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: de
  text: 'Da ging Pilatus wieder hinaus und sagte zu ihnen: „Seht, ich bringe ihn zu euch heraus, damit ihr erkennt, dass ich keinen Anklagegrund gegen ihn finde.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich keine Schuld an ihm finde.“ Der griechische Ausdruck kann traditionell so wiedergegeben werden; im vorliegenden Zusammenhang hat er wahrscheinlich einen besonders juristischen Sinn: Pilatus findet keinen tragfähigen Anklagegrund gegen Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: ging ... hinaus
  rationale: Die Verbindung bezeichnet die Bewegung nach draußen. „ging ... hinaus“ ist im Deutschen natürlich und bewahrt die räumliche Aussage.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort kennzeichnet die Wiederholung der Handlung und wird knapp und idiomatisch mit „wieder“ wiedergegeben.
- source_word: λέγει
  choice: sagte
  rationale: Der historische Präsensgebrauch des Griechischen wird dem üblichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben.
- source_word: Ἴδε
  choice: Seht
  rationale: Der Imperativ lenkt die Aufmerksamkeit der Angesprochenen auf das unmittelbar Folgende. „Seht“ ist verständlich, würdig und weniger altertümlich als „Siehe“.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: ich bringe ihn ... heraus
  rationale: ἄγω kann „führen“ oder „bringen“ bedeuten. Hier lässt Pilatus Jesus nach draußen bringen beziehungsweise führt ihn der Menge vor; „herausbringen“ gibt die Szene natürlich wieder.
- source_word: ἵνα γνῶτε
  choice: damit ihr erkennt
  rationale: „damit“ bewahrt den finalen Sinn von ἵνα; „erkennt“ gibt das bewusste Erfassen der von Pilatus erklärten Feststellung wieder.
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: dass ich keinen Grund für eine Anklage gegen ihn finde
  rationale: αἰτία hat in diesem Verhörkontext forensischen Sinn und bezeichnet einen Anklagegrund beziehungsweise eine rechtlich tragfähige Beschuldigung. Die Formulierung ist im modernen Deutsch klarer als die wörtlichere Wendung „keine Schuld an ihm“.
theological_decisions:
- issue: Pilatus’ Feststellung über Jesus im gerichtlichen Kontext
  choice: keinen Grund für eine Anklage gegen ihn finde
  alternative: keine Schuld an ihm finde
  rationale: Die Übersetzung hält sich an den juristischen Zusammenhang und gibt Pilatus’ Urteil über die fehlende Grundlage einer Anklage wieder, ohne daraus ausdrücklich eine umfassendere theologische Aussage zu machen. Die traditionelle Alternative bleibt als mögliche Wiedergabe in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der historische Präsensgebrauch wurde idiomatisch ins Präteritum übertragen; die gerichtliche Aussage wurde klar formuliert, ohne ihre theologische Tragweite auszudeuten.
