id: JHN.19.19
reference: John 19:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: de
  text: 'Pilatus schrieb auch eine Aufschrift und brachte sie am Kreuz an. Darauf stand: »Jesus, der Nazarener, der König der Juden[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der König der Judäer«. Das griechische Wort kann je nach Zusammenhang entweder Juden allgemein oder insbesondere die Bewohner Judäas bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: Aufschrift
  rationale: Im Zusammenhang der Kreuzigung bezeichnet das Wort die schriftliche Bekanntmachung am Kreuz. »Aufschrift« ist im heutigen Deutsch klarer als das wörtlich mögliche, aber missverständliche »Titel«.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: brachte sie am Kreuz an
  rationale: Diese Formulierung gibt die ausdrückliche Ortsangabe »am/auf dem Kreuz« natürlich wieder, ohne die aus dem Kontext erschlossene Lage »über dem Kreuz« in den Text einzutragen.
- source_word: ἦν δὲ γεγραμμένον
  choice: Darauf stand
  rationale: 'Die idiomatische deutsche Wendung gibt den resultativen Zustand der griechischen Konstruktion wieder: Der angegebene Wortlaut war auf der Aufschrift zu lesen.'
- source_word: Ναζωραῖος
  choice: der Nazarener
  rationale: Die Bezeichnung bewahrt den Charakter eines Herkunfts- beziehungsweise Beinamens und ist im modernen Deutsch verständlicher als »Nazoräer«; sie ersetzt das griechische Adjektiv nicht durch die ausführlichere Formulierung »aus Nazaret«.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: der König der Juden
  rationale: Im Passionsbericht bezeichnet die Wendung den öffentlichen königlichen Anspruch beziehungsweise Anklagepunkt. »König der Juden« ist hier die geläufige und kontextuell naheliegende Wiedergabe; die lexikalisch mögliche räumliche Bedeutung »Judäer« wird in einer Fußnote erhalten.
- source_word: δὲ καὶ
  choice: auch
  rationale: »Auch« gibt den additiven Fortgang der Erzählung knapp und natürlich wieder.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Übliche deutsche Form des griechischen Personennamens.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Übliche deutsche Form des griechischen Personennamens.
- source_word: σταυροῦ
  choice: Kreuz
  rationale: »Kreuz« ist im Passionsbericht die sachlich und sprachlich angemessene Standardwiedergabe von σταυρός.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων in der Aufschrift
  choice: der Juden
  alternative: der Judäer
  rationale: Die Aufschrift formuliert einen öffentlichen Königstitel beziehungsweise Anklagepunkt; in diesem Zusammenhang ist der Bezug auf das jüdische Volk am wahrscheinlichsten. Da das griechische Wort je nach Kontext auch die Bewohner Judäas bezeichnen kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Text; »Darauf stand« vermeidet eine im Deutschen schwerfällige Wiederholung von »schreiben«.
