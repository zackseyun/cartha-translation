  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Pilatus als Handelnder, die Aufschrift, ihre Anbringung am Kreuz sowie ihr Wortlaut. »Am Kreuz anbringen« ist eine natürliche deutsche Wiedergabe von ἐπὶ τοῦ σταυροῦ, ohne das nicht ausdrücklich genannte »über dem Kreuz« einzutragen. »Darauf stand« bildet ἦν ... γεγραμμένον idiomatisch und dem Sinn nach präzise ab.'
  naturalness: Modernes, flüssiges und zugleich für den erzählenden Passionskontext angemessen würdiges Standarddeutsch. »Aufschrift«, »brachte sie am Kreuz an« und »Darauf stand« sind klar und nicht unnötig traditionell oder technisch.
  terminology: »Pilatus«, »Kreuz«, »Jesus«, »der Nazarener« und »der König der Juden« sind sachgerecht und im Deutschen etabliert. Die Fußnote bewahrt die lexikalisch mögliche Lesart »Judäer«, ohne den erzählten Wortlaut oder seine Mehrdeutigkeit dogmatisch festzulegen. Der Fußnotenanker steht unmittelbar bei »Juden« und ist korrekt zugeordnet.
