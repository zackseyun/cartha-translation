id: JHN.19.5
reference: John 19:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: de
  text: 'Da kam Jesus heraus. Er trug die Dornenkrone und das purpurfarbene Gewand. Pilatus sagt zu ihnen: „Seht[a], der Mensch!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe“. Das griechische Ἰδού ist ein Aufmerksamkeitsruf und kann je nach Zusammenhang mit „Seht“, „Siehe“ oder „Schaut“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν … ἔξω
  choice: Da kam … heraus
  rationale: Die Verbindung aus οὖν, ἐξῆλθεν und dem verstärkenden ἔξω bezeichnet die folgerichtige Fortsetzung der Handlung und die Bewegung nach draußen. „Da kam … heraus“ ist im Deutschen natürlich und bewahrt den erzählerischen Anschluss.
- source_word: φορῶν
  choice: Er trug
  rationale: Das Präsenspartizip beschreibt, was Jesus beim Herauskommen angelegt hatte. Ein eigener kurzer Satz gibt diesen Begleitumstand in klarem, natürlichem Deutsch wieder.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: die Dornenkrone
  rationale: Die Wendung bezeichnet eine aus Dornen bestehende Krone. „Dornenkrone“ ist präzise, allgemein verständlich und im Deutschen idiomatisch.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: das purpurfarbene Gewand
  rationale: ἱμάτιον bezeichnet hier ein Kleidungsstück beziehungsweise Obergewand. „Gewand“ legt die genaue Form weniger stark fest als „Mantel“, während „purpurfarben“ die Farbangabe eindeutig wiedergibt.
- source_word: λέγει αὐτοῖς
  choice: Pilatus sagt zu ihnen
  rationale: Das historische Präsens wird mit „sagt“ bewahrt. Der im Kontext eindeutige Sprecher Pilatus wird genannt, weil ein bloßes deutsches „er“ unmittelbar nach Jesus missverständlich wäre.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf fordert die anwesende Menge auf, den vorgeführten Jesus anzusehen. „Seht“ ist gegenwärtiges, würdevolles Deutsch und erhält die öffentliche, demonstrative Kraft.
- source_word: ὁ ἄνθρωπος
  choice: der Mensch
  rationale: Die wörtliche und im Deutschen traditionsreiche Formulierung bezeichnet Jesus als den konkret vorgeführten Menschen, ohne mögliche weitergehende theologische Resonanzen auszuschließen oder festzuschreiben.
theological_decisions:
- issue: Bedeutung von ὁ ἄνθρωπος in der Erklärung des Pilatus
  choice: der Mensch
  alternative: der Mann
  rationale: „Der Mensch“ gibt ἄνθρωπος direkt wieder und bewahrt sowohl den konkreten Bezug auf Jesus als auch die mögliche repräsentative Tiefendimension. „Der Mann“ würde den unmittelbaren Bezug ausdrücken, aber den weiteren Bedeutungsraum unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze halten die öffentliche Vorführung eindringlich fest; das historische Präsens in „sagt“ bewahrt die erzählerische Unmittelbarkeit des Johannesevangeliums.
