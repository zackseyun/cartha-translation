  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: den erzählerischen Anschluss (οὖν), Jesu Hervortreten (ἐξῆλθεν … ἔξω), die begleitende Bekleidung mit Dornenkrone und purpurfarbenem Gewand sowie die Rede des Pilatus im historischen Präsens. Die Aufteilung des Partizipialsatzes in einen kurzen deutschen Folgesatz ist bedeutungstreu.'
  naturalness: „Da kam Jesus heraus. Er trug die Dornenkrone und das purpurfarbene Gewand“ ist modernes, klares Standarddeutsch. Die kurzen Sätze passen zur szenischen Zuspitzung. „Pilatus sagt zu ihnen“ vermeidet einen im Deutschen naheliegenden missverständlichen Bezug des Pronomens „er“ auf Jesus.
  terminology: „Dornenkrone“ und „purpurfarbenes Gewand“ sind präzise und idiomatisch. „Seht, der Mensch!“ ist eine vertretbare, traditionsbewusste und zugleich quellennahe Wiedergabe von Ἰδοὺ ὁ ἄνθρωπος. Sie wahrt den konkreten Bezug auf Jesus und legt mögliche weitergehende Resonanzen nicht aus. Die Fußnote ist sachlich richtig und am passenden Ausdruck verankert.
