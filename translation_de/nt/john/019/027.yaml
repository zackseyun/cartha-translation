source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: de
  text: 'Dann sagte er zu dem Jünger: »Sieh, deine Mutter!« Und von jener Stunde an nahm der Jünger sie bei sich auf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nahm der Jünger sie in das Seine auf«; gemeint ist die Aufnahme in seinen eigenen Lebens- und Hausbereich.'
    reason: Erläutert die ungewöhnliche substantivierte griechische Wendung εἰς τὰ ἴδια und macht sichtbar, dass »Haus« nicht ausdrücklich im Ausgangstext steht.
lexical_decisions:
- source_word: Ἴδε
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ knapp und würdig wieder, ohne die Aussage zu einer bloßen Aufforderung zum Anschauen zu verengen.
- source_word: εἰς τὰ ἴδια
  choice: bei sich auf
  rationale: Die idiomatische deutsche Wendung bezeichnet die Aufnahme in den eigenen Lebens- und Hausbereich, ohne das im Griechischen nicht ausdrücklich stehende Wort »Haus« einzufügen.
theological_decisions:
- issue: Art und Tragweite der Beziehung zwischen dem Jünger und Jesu Mutter
  choice: »Sieh, deine Mutter!« sowie »nahm ... sie bei sich auf«
  alternative: Eine ausdrückliche Deutung als rechtliche Adoption, universale geistliche Mutterschaft oder bloße Haushaltsversorgung
  rationale: Der Text begründet eine neue fürsorgliche Beziehung, bestimmt deren weitergehende theologische oder rechtliche Tragweite jedoch nicht ausdrücklich; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Von jener Stunde an« bewahrt die zeitliche Formulierung des Griechischen; »bei sich aufnehmen« ist im Deutschen natürlicher als eine wörtliche Nachbildung.
