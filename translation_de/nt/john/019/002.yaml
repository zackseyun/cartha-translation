id: JHN.19.2
reference: John 19:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: de
  text: Und die Soldaten flochten eine Krone aus Dornen, setzten sie ihm auf den Kopf und legten ihm ein purpurfarbenes Gewand um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: Soldaten
  rationale: Die übliche und genaue Bezeichnung für römisches Militärpersonal in diesem Erzählzusammenhang.
- source_word: πλέξαντες
  choice: flochten
  rationale: Die Auflösung des vorzeitigen Aoristpartizips in eine koordinierte Verbform klingt im Deutschen natürlich; die Abfolge der Handlungen bleibt durch die Satzreihenfolge erhalten.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: eine Krone aus Dornen
  rationale: „Krone“ vermittelt im Kontext die königliche Symbolik, während „aus Dornen“ das Material ausdrücklich wiedergibt.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: setzten sie ihm auf den Kopf
  rationale: Das ist die natürliche deutsche Wiedergabe der griechischen Konstruktion; das Pronomen „sie“ nimmt die Krone auf.
- source_word: ἱμάτιον πορφυροῦν
  choice: ein purpurfarbenes Gewand
  rationale: „Gewand“ wahrt die allgemeine Bedeutung von ἱμάτιον, ohne eine bestimmte Kleidungsform festzulegen; „purpurfarben“ gibt die Farbe und ihre königliche Konnotation wieder.
- source_word: περιέβαλον αὐτόν
  choice: legten ihm … um
  rationale: Die Formulierung gibt das Umlegen beziehungsweise Umhüllen mit dem Gewand idiomatisch wieder, ohne die Handlung übermäßig auszudeuten.
theological_decisions:
- issue: Königliche Verspottung durch Krone und Purpurgewand
  choice: Die Handlungen und Gegenstände werden unmittelbar wiedergegeben, ohne die Verspottung ausdrücklich zu erläutern.
  alternative: „Sie verspotteten ihn als König mit einer Krone und einem Purpurgewand.“
  rationale: Die spöttische Königssymbolik ergibt sich aus „Krone“ und „purpurfarbenes Gewand“ sowie aus dem Kontext; eine ausdrückliche Deutung stünde nicht im Wortlaut dieses Verses.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die dreigliedrige Verbfolge ist flüssig und bewahrt die zeitliche Abfolge der griechischen Aussage.
