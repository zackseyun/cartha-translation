source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: de
  text: Beim Kreuz Jesu standen seine Mutter, die Schwester seiner Mutter[b], Maria, die Frau des Klopas,[a] und Maria Magdalena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische nennt die genaue Beziehung Marias zu Klopas nicht ausdrücklich; häufig wird sie als seine Frau verstanden.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz kann auch als Aufzählung von drei Frauen verstanden werden, wenn „die Schwester seiner Mutter“ und „Maria, die Frau des Klopas“ dieselbe Person bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: standen
  rationale: Das Plusquamperfekt von ἵστημι beschreibt hier einen fortdauernden Zustand. Das deutsche Präteritum „standen“ gibt dies im erzählenden Zusammenhang natürlich wieder.
- source_word: δὲ
  choice: unübersetzt als leichter Erzählübergang
  rationale: δέ markiert hier vor allem den Übergang von den Soldaten zu den beim Kreuz stehenden Frauen. Im Deutschen ist dafür kein ausdrückliches Bindewort nötig; „aber“ oder „jedoch“ könnte einen zu starken Gegensatz nahelegen.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: beim Kreuz Jesu
  rationale: παρά mit Dativ bezeichnet räumliche Nähe. „Beim Kreuz Jesu“ ist knapp, natürlich und vermeidet die mögliche Vorstellung, die Frauen seien selbst am Kreuz befestigt gewesen.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: seine Mutter
  rationale: Direkte und natürliche Wiedergabe der Nominalgruppe.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: die Schwester seiner Mutter
  rationale: Die Genitivkonstruktion wird im Deutschen klar und quellennah wiedergegeben.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Maria, die Frau des Klopas
  rationale: Die Konstruktion mit Artikel und Genitiv kennzeichnet Maria durch ihre Beziehung zu Klopas; gewöhnlich wird eine eheliche Beziehung angenommen. Da das Griechische „Frau/Ehefrau“ nicht ausdrücklich nennt, wird die offenere Wiedergabe in einer Fußnote bewahrt.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Die geläufige deutsche Namensform gibt die Herkunftsbezeichnung aus Magdala idiomatisch wieder.
theological_decisions:
- issue: Identität und Anzahl der Frauen beim Kreuz
  choice: 'Der Haupttext liest den Vers als Aufzählung von vier Frauen: Jesu Mutter, ihre Schwester, Maria, die Frau des Klopas, und Maria Magdalena.'
  alternative: Es können auch drei Frauen gemeint sein, wenn „die Schwester seiner Mutter“ als nähere Bestimmung derselben Person verstanden wird wie „Maria des Klopas“.
  rationale: Die kompakte griechische Syntax lässt beide Zuordnungen zu. Der Haupttext folgt der naheliegenden Vier-Personen-Lesart, ohne die alternative Dreier-Lesart dogmatisch auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die schlichte Satzstruktur bewahrt die knappe Aufzählung des griechischen Textes; echte syntaktische und relationale Mehrdeutigkeiten werden in den Fußnoten offengehalten.
