  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die Antwort der als οἱ Ἰουδαῖοι bezeichneten Gruppe, den unbestimmten ersten Verweis auf ein Gesetz, den rückverweisenden zweiten Verweis, die rechtlich verstandene Verpflichtung zu sterben sowie die Selbstzuschreibung der Gottessohnschaft. „muss er sterben“ ist für ὀφείλει ἀποθανεῖν im Kontext einer geltend gemachten Rechtsforderung angemessen.'
  naturalness: Die Formulierung ist idiomatisches modernes Standarddeutsch und bewahrt einen sachlich-würdigen Erzählton. „Nach diesem Gesetz“ macht den im Griechischen durch den Artikel markierten Rückverweis klar, ohne unnötig schwerfällig zu sein.
  terminology: „Die Juden“ entspricht der ausdrücklichen Gruppenbezeichnung des Ausgangstextes, ohne den Kreis unzulässig auf Führer zu verengen. „Sohn Gottes“ gibt die im johanneischen Kontext qualitative beziehungsweise titulare Prädikatsbezeichnung angemessen wieder. Die alternative Form „Gottes Sohn“ ist als Fußnote möglich und verändert die Aussage nicht.
