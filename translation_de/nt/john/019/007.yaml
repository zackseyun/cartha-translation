id: JHN.19.7
reference: John 19:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: de
  text: 'Die Juden antworteten ihm: „Wir haben ein Gesetz, und nach diesem Gesetz[a] muss er sterben, weil er sich selbst zum Sohn Gottes[b] gemacht hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nach dem Gesetz“. Im Griechischen steht „Gesetz“ zweimal; beim zweiten Mal ist das zuvor genannte Gesetz gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zu Gottes Sohn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: antworteten ihm
  rationale: Gibt das übliche erzählende Antwortverb und das Dativpronomen direkt und natürlich wieder.
- source_word: οἱ Ἰουδαῖοι
  choice: Die Juden
  rationale: Bewahrt die ausdrückliche Gruppenbezeichnung des griechischen Textes, ohne den Bezug eigenmächtig auf eine enger bestimmte Führungsgruppe zu beschränken.
- source_word: νόμον ἔχομεν
  choice: Wir haben ein Gesetz
  rationale: Der erste Beleg von νόμος ist artikellos; „ein Gesetz“ gibt sowohl die Form als auch den Hinweis auf eine geltend gemachte Rechtsgrundlage natürlich wieder.
- source_word: κατὰ τὸν νόμον
  choice: nach diesem Gesetz
  rationale: Der Artikel beim zweiten νόμος verweist auf das gerade genannte Gesetz zurück; „diesem“ macht diesen Rückbezug im Deutschen klar.
- source_word: ὀφείλει ἀποθανεῖν
  choice: muss er sterben
  rationale: ὀφείλει bezeichnet hier eine aus dem Gesetz abgeleitete Verpflichtung; „muss“ ist im Deutschen die natürliche und prägnante Formulierung für diesen juristischen Anspruch.
- source_word: υἱὸν θεοῦ
  choice: zum Sohn Gottes
  rationale: Die artikellose Prädikatsbezeichnung ist qualitativ beziehungsweise titular zu verstehen. „Sohn Gottes“ bewahrt die einzigartige, im Kontext beanstandete Sohnesstellung, ohne dem Vorwurf zusätzliche Auslegung hinzuzufügen.
- source_word: ἑαυτὸν ἐποίησεν
  choice: sich selbst … gemacht hat
  rationale: Gibt die Formulierung der Ankläger eng wieder und vermeidet die interpretierende Umschreibung „behauptet hat, … zu sein“.
theological_decisions:
- issue: Wiedergabe von υἱὸν θεοῦ in der gegen Jesus erhobenen Anklage
  choice: zum Sohn Gottes
  alternative: zu Gottes Sohn; zu einem Sohn Gottes
  rationale: Der johanneische Zusammenhang spricht für eine einzigartige göttliche Sohnesstellung und nicht für die Einordnung als einer von mehreren „Söhnen Gottes“. Zugleich bleibt die Aussage als Vorwurf der Ankläger formuliert und wird nicht in einen dogmatischen Kommentar verwandelt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Wiederholung von „Gesetz“ wird wie im Griechischen beibehalten; der Rückbezug wird durch „diesem“ natürlich kenntlich gemacht.
