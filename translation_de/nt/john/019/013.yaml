source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: de
  text: Als Pilatus nun diese Worte hörte, führte er Jesus hinaus und setzte sich auf den Richterstuhl an einem Ort, der »Steinpflaster« genannt wurde, auf Hebräisch aber Gabbata.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und setzte ihn auf den Richterstuhl«. Das griechische Verb kann transitiv verstanden werden; wahrscheinlicher ist hier jedoch, dass Pilatus selbst auf dem Richterstuhl Platz nahm.'
    reason: alternative_reading
  - marker: b
    text: Mit »Hebräisch« ist wahrscheinlich die örtliche semitische Sprache gemeint, vermutlich Aramäisch, wie auch sonst im Johannesevangelium.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die erzählerische Folgerung und Fortführung aus dem vorangehenden Wortwechsel; »nun« klingt im Deutschen natürlich.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: als Pilatus diese Worte hörte
  rationale: Das Aoristpartizip wird idiomatisch temporal wiedergegeben; λόγοι bezeichnet hier die unmittelbar zuvor gesprochenen Worte.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: führte er Jesus hinaus
  rationale: Gibt die Bewegung nach draußen prägnant und quellennah wieder, ohne unnötige Zusatzinformation.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: setzte sich auf den Richterstuhl
  rationale: βῆμα bezeichnet hier den amtlichen Richterstuhl beziehungsweise die Gerichtstribüne. Am wahrscheinlichsten ist Pilatus das Subjekt des intransitiv verstandenen Verbs.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: an dem Ort, der »Steinpflaster« heißt
  rationale: εἰς bezeichnet im Zusammenhang den erreichten Ort. Λιθόστρωτον hat im Griechischen eine erkennbare Bedeutung und wird daher übersetzt.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: auf Hebräisch aber Gabbata
  rationale: Die Hauptübersetzung bewahrt die ausdrückliche Bezeichnung »Hebräisch« sowie den leicht kontrastierenden Anschluss durch δέ; der semitische Ortsname wird transliteriert.
theological_decisions:
- issue: Subjekt und Valenz von ἐκάθισεν
  choice: Pilatus setzte sich auf den Richterstuhl
  alternative: Pilatus setzte Jesus auf den Richterstuhl
  rationale: Die Form kann intransitiv oder transitiv verstanden werden. Gerichtskontext und Syntax sprechen eher dafür, dass Pilatus selbst Platz nahm; die echte und auslegungsrelevante Alternative bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt gut verständlich und bewahrt zugleich die erzählerische sowie gerichtliche Sprache des Ausgangstextes. Die Anführungszeichen kennzeichnen die übersetzte griechische Ortsbezeichnung.
