id: JHN.19.18
reference: John 19:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: de
  text: Dort kreuzigten sie ihn und mit ihm zwei andere, den einen auf der einen, den anderen auf der anderen Seite, Jesus aber in der Mitte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder knapper: „je einen auf jeder Seite, Jesus aber in der Mitte.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Dort
  rationale: Das lokative Relativadverb knüpft an den im vorherigen Vers genannten Ort an. Im Deutschen setzt „Dort“ den fortlaufenden Satz natürlich und präzise fort.
- source_word: ἐσταύρωσαν
  choice: kreuzigten sie
  rationale: σταυρόω bezeichnet im Passionszusammenhang die Hinrichtung durch Kreuzigung; die übliche deutsche Wiedergabe vermeidet unbelegte Einzelheiten zur Durchführung.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit Genitiv bezeichnet Begleitung beziehungsweise gemeinsame Zuordnung und wird knapp und genau wiedergegeben.
- source_word: ἄλλους δύο
  choice: zwei andere
  rationale: Die Übersetzung wahrt die substantivische Form des Griechischen, ohne „Männer“ ausdrücklich hinzuzufügen.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: den einen auf der einen, den anderen auf der anderen Seite
  rationale: Die paarweise gebrauchten Adverbien bezeichnen die Verteilung auf zwei gegenüberliegende Seiten. Die deutsche Formulierung macht diese Verteilung idiomatisch deutlich.
- source_word: μέσον
  choice: in der Mitte
  rationale: μέσον bezeichnet hier die mittlere räumliche Position und wird bildhaft sowie ohne zusätzliche Deutung wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: δέ hebt Jesus innerhalb der räumlichen Anordnung leicht kontrastierend hervor; „aber“ bewahrt diese Akzentsetzung, ohne einen starken Gegensatz zu erzeugen.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Der Akkusativ bezeichnet Jesus als den in der Mitte Positionierten; die deutsche Satzellipse gibt dies natürlich wieder.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass Jesus zwischen den beiden anderen war
  choice: Die räumliche Anordnung wird als „den einen auf der einen, den anderen auf der anderen Seite, Jesus aber in der Mitte“ wiedergegeben.
  alternative: „Jesus zwischen ihnen“
  rationale: Der griechische Text nennt zunächst die beiden Seiten und hebt danach Jesus als den in der Mitte Befindlichen hervor. Die gewählte Fassung bewahrt diese Reihenfolge und Akzentsetzung, statt sie zur erschlossenen Aussage „zwischen ihnen“ zusammenzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die distributive Formulierung ist bewusst anschaulich; „Jesus aber“ erhält die leichte Hervorhebung des griechischen δέ.
