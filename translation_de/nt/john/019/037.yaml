  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: de
  text: 'Und noch eine andere Schriftstelle sagt: »Sie werden auf den blicken, den sie durchbohrt haben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie werden zu dem schauen, den sie durchbohrt haben.« Die griechische Wendung kann ein Hinsehen auf jemanden oder ein Sich-Hinwenden zu jemandem ausdrücken und klingt an Sacharja 12,10 an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: noch
  rationale: Kennzeichnet hier eine weitere Schriftanführung; zusammen mit »eine andere Schriftstelle« ist »noch« im Deutschen natürlich und prägnant.
- source_word: ἑτέρα γραφή
  choice: eine andere Schriftstelle
  rationale: γραφή bezeichnet hier eine einzelne Aussage der Schrift. »Schriftstelle« ist im Deutschen eindeutiger und idiomatischer als »eine andere Schrift«.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens der Zitationsformel bleibt erhalten und lässt die Schrift als gegenwärtig sprechend erscheinen.
- source_word: Ὄψονται
  choice: sie werden sehen
  rationale: In Verbindung mit εἰς bezeichnet das Verb ein gerichtetes Hinsehen. Im Deutschen drückt »auf den sehen« dies natürlich aus, ohne die Bedeutung zu einem bloßen Wahrnehmen zu verengen.
- source_word: εἰς ὃν
  choice: auf den, den
  rationale: εἰς gibt nach dem Verb des Sehens die Blickrichtung auf eine Person an. »auf den, den« bewahrt diese Ausrichtung und die relative Konstruktion.
- source_word: ἐξεκέντησαν
  choice: sie durchbohrt haben
  rationale: Das Perfekt im deutschen Relativsatz gibt die abgeschlossene Handlung des griechischen Aorists idiomatisch wieder; »durchbohren« passt zum unmittelbaren Kreuzigungskontext und zum Sacharja-Anklang.
theological_decisions:
- issue: Wiedergabe des Sacharja-Anklangs bei Wahrung des johanneischen Wortlauts
  choice: Sie werden auf den sehen, den sie durchbohrt haben.
  alternative: Sie werden zu dem aufblicken, den sie durchbohrt haben.
  rationale: Die Übersetzung folgt dem griechischen Wortlaut des Johannes und übernimmt keine ausdrückliche göttliche Ich-Form aus Sacharja 12,10. Zugleich bleibt die Identifizierung des Durchbohrten mit Jesus im Kontext erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zitationsformel ist knapp gehalten; »Schriftstelle« vermeidet die im Deutschen mögliche Vorstellung einer zweiten heiligen Schrift. Die Fußnote bewahrt die Richtungsnuance von εἰς und den Bezug zu Sacharja.
