  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: de
  text: 'Als nun die Hohenpriester und die Gerichtsdiener ihn sahen, schrien sie: »Kreuzige ihn! Kreuzige ihn!« Pilatus sagte zu ihnen: »Nehmt ihr ihn und kreuzigt ihn![a] Denn ich finde keinen Anklagegrund gegen ihn.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nehmt ihn selbst und kreuzigt ihn!« Im Griechischen steht das Pronomen »ihr« ausdrücklich und ist dadurch betont.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Denn ich finde keinen Grund zur Anklage gegen ihn.« Das griechische Wort bezeichnet hier den rechtlichen Grund für eine Anklage oder Beschuldigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Als nun
  rationale: Verbindet den zeitlichen Sinn von ὅτε mit dem folgernden beziehungsweise fortführenden οὖν in natürlichem Deutsch.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Bezeichnet hier die priesterliche Führungsschicht in Jerusalem; die Wiedergabe vermeidet das missverständliche wörtliche Pluralwort »Hohepriester«.
- source_word: οἱ ὑπηρέται
  choice: die Gerichtsdiener
  rationale: Bezeichnet untergeordnete Amtsträger der jüdischen Führung. Im Prozesszusammenhang gibt »Gerichtsdiener« ihre amtliche Funktion wieder, ohne sie pauschal als Tempelwache festzulegen.
- source_word: ἐκραύγασαν λέγοντες
  choice: schrien sie
  rationale: Gibt den lauten Ausruf idiomatisch wieder; das im Deutschen entbehrliche »und sagten« wird nicht mechanisch übernommen.
- source_word: Σταύρωσον σταύρωσον
  choice: Kreuzige ihn! Kreuzige ihn!
  rationale: Bewahrt Wiederholung und Dringlichkeit; das im Griechischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen ergänzt.
- source_word: Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε
  choice: Nehmt ihr ihn und kreuzigt ihn!
  rationale: Das ausdrücklich gesetzte ὑμεῖς wird durch »ihr« betont und stellt die Angesprochenen Pilatus gegenüber.
- source_word: αἰτίαν
  choice: Anklagegrund
  rationale: Der Ausdruck bezeichnet im gerichtlichen Zusammenhang einen Grund zur Anklage oder Beschuldigung; »Anklagegrund« wahrt den forensischen Sinn.
theological_decisions:
- issue: Pilatus’ Erklärung zur Unschuld Jesu
  choice: ich finde keinen Anklagegrund gegen ihn
  alternative: ich finde keine Schuld an ihm
  rationale: Die Aussage wird primär als richterliche Einschätzung im laufenden Verfahren wiedergegeben. Sie bezeugt Jesu Unschuld in diesem Zusammenhang, ohne αἰτία vorschnell als umfassenden theologischen Schuldbegriff zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede ist klar und eindringlich; rechtliche Terminologie bleibt verständlich. Die Bezeichnung »führende Priester« und die Fußnoten vermeiden unnötige kirchliche Fachsprache und bewahren zugleich die historische und forensische Aussage.
