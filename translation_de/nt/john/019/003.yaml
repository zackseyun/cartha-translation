  source_fidelity: Der Haupttext trifft Anrede und Titel gut. »Dann« fügt jedoch eine zeitliche Fortfolge hinzu, wo der griechische Text lediglich καί („und“) bietet. »ins Gesicht« ist bei ῥαπίσματα zu eng, da der Text die Körperstelle nicht nennt. »Schläge versetzen« gibt die mit δίδωμι gebildete Wendung und den Plural angemessen wieder.
  naturalness: »Sei gegrüßt, König der Juden!« ist ein natürliches, zugleich bewusst feierliches Deutsch und transportiert die kontextuelle Verhöhnung. »Und sie versetzten ihm Schläge« ist idiomatisches Standarddeutsch; die Fußnote hält die mögliche Handbedeutung ohne ungesicherte Lokalisierung fest.
  terminology: Der etablierte Titel »König der Juden« ist direkt und angemessen. Die Grußformel wahrt den höhnisch-königlichen Ton, ohne die Deutung ausdrücklich in den Text einzutragen.
  issues:
