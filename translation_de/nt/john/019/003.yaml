  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: de
  text: 'Und sie kamen zu ihm und sagten[a]: »Sei gegrüßt, König der Juden!« Und sie versetzten ihm Schläge.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie kamen immer wieder zu ihm und sagten«; die griechischen Imperfektformen können wiederholte oder andauernde Handlungen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Und sie gaben ihm Schläge«. Das griechische Wort kann besonders Schläge mit der Hand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: sie kamen zu ihm und sagten
  rationale: Die natürlichen deutschen Erzählformen geben den Vorgang klar wieder; die Imperfekte können im Zusammenhang auch wiederholtes Herantreten und Rufen bezeichnen, was in einer Fußnote offengehalten wird.
- source_word: Χαῖρε
  choice: Sei gegrüßt
  rationale: Die formelhafte Begrüßung entspricht hier einer spöttischen königlichen Huldigung. »Sei gegrüßt« klingt im Deutschen feierlich genug, um den Hohn erkennen zu lassen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: König der Juden
  rationale: Die direkte und im Passionsbericht etablierte Wiedergabe bewahrt sowohl die politische als auch die messianische Spannung des Titels.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: Dann schlugen sie ihm ins Gesicht
  rationale: ῥάπισμα bezeichnet einen Schlag, besonders mit der Hand, und kann kontextuell einen Schlag ins Gesicht meinen. Das deutsche Verb im Plural wahrt den wiederholten Vorgang; die Fußnote nennt die formal nähere Alternative.
theological_decisions:
- issue: Ton der Anrede an Jesus
  choice: Formelhafte königliche Begrüßung, deren Spott sich aus dem Kontext ergibt
  alternative: Neutrales »Grüß dich, König der Juden« oder ausdrücklich ergänztes »spotteten sie«
  rationale: Der Passionskontext zeigt die Verhöhnung deutlich. Eine feierliche Grußformel bewahrt die Ironie, ohne eine erklärende Deutung in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist bewusst formell gehalten, damit die spöttische Nachahmung einer königlichen Huldigung hörbar bleibt. Alle Fußnotenmarker stehen im Haupttext.
