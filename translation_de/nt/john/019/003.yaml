    issue: »Dann« statt »und«
    rationale: καί verbindet die Handlung mit der vorherigen Aussage, ohne notwendig einen zusätzlichen zeitlichen Schritt zu markieren. »Und« ist genauer und bewahrt zudem die wiederholende bzw. fortlaufende Szenerie der Imperfekte besser.
  - severity: medium
    issue: »ins Gesicht« als Haupttext
    rationale: ῥαπίσματα bezeichnet Schläge bzw. Ohrfeigen/Handschläge, aber der griechische Text nennt keine Körperstelle. Die Einschränkung auf das Gesicht sollte daher nicht im Haupttext stehen.
  - severity: low
