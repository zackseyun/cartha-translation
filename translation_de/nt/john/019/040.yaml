  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: das Nehmen des Leichnams, das Einwickeln in mehrere Leinentücher zusammen mit den ἀρώματα sowie die Bezugnahme auf jüdische Bestattungssitte. „Leichnam“ ist im Kontext angemessen; „Da“ vermittelt die narrative Folgerung von οὖν idiomatisch.'
