  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: de
  text: Da nahmen sie den Leichnam Jesu und wickelten ihn zusammen mit den Duftstoffen in Leinentücher, wie es bei den Juden[a] für die Bestattung üblich ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei den Judäern“, falls die Bezeichnung geografisch statt ethnisch-religiös verstanden wird; hier spricht der Zusammenhang eher für die jüdische Bestattungspraxis allgemein.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: Da nahmen sie
  rationale: οὖν führt die Handlung als Folge des Vorangehenden weiter; „da“ ist im deutschen Erzählstil natürlich. ἔλαβον bezeichnet hier das Ergreifen bzw. Übernehmen des Leichnams zur Bestattung.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: den Leichnam Jesu
  rationale: σῶμα bedeutet wörtlich „Körper/Leib“; da Jesus gestorben ist und die Bestattung vorbereitet wird, gibt „Leichnam“ den Kontext im Deutschen eindeutig und würdig wieder.
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: wickelten ihn … in Leinentücher
  rationale: δέω bezeichnet zwar grundsätzlich Binden oder Festbinden, doch mit den Leinentüchern im Bestattungskontext ist „wickelten … in“ natürlich und sachlich treffend. ὀθόνια sind leinene Tücher, nicht notwendig ein einziges Tuch.
- source_word: μετὰ τῶν ἀρωμάτων
  choice: zusammen mit den Duftstoffen
  rationale: ἀρώματα sind wohlriechende, bei der Bestattung verwendete Substanzen. „Duftstoffe“ ist verständlich und weiter als „Gewürze“, das im heutigen Deutsch vor allem an Speisezutaten denken lässt.
- source_word: καθὼς ἔθος ἐστὶν
  choice: wie es … üblich ist
  rationale: Die Wendung bezeichnet die Übereinstimmung mit einer bestehenden Sitte; die deutsche Formulierung ist klar und idiomatisch.
- source_word: τοῖς Ἰουδαίοις
  choice: bei den Juden
  rationale: Der Dativ bezeichnet hier die Gemeinschaft, in der diese Bestattungssitte gilt. Der Zusammenhang spricht für die jüdische religiös-kulturelle Praxis allgemein, nicht speziell für Behörden oder nur Bewohner Judäas.
- source_word: ἐνταφιάζειν
  choice: für die Bestattung
  rationale: Das Verb umfasst in diesem Zusammenhang das Zurichten bzw. Bestatten eines Toten. Die nominale Wendung fügt sich natürlich in die deutsche Aussage über eine Sitte ein.
theological_decisions:
- issue: Bedeutung von τοῖς Ἰουδαίοις
  choice: bei den Juden
  alternative: bei den Judäern
  rationale: Ἰουδαῖοι kann im Johannesevangelium je nach Zusammenhang „Juden“ oder „Judäer“ bedeuten. Hier geht es um eine allgemein jüdische Bestattungssitte; dennoch wird die geografische Möglichkeit in einer Fußnote transparent gehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leichnam“ entspricht dem Bestattungskontext besser als das allgemeinere „Körper“; „Duftstoffe“ vermeidet die heute missverständliche Verengung von „Gewürze“. Der Satz bewahrt den erzählerischen Zusammenhang und formuliert die kulturelle Angabe ohne polemischen Beiklang.
