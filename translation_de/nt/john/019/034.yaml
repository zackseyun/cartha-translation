id: JHN.19.34
reference: John 19:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: de
  text: Doch einer der Soldaten stach ihm mit einem Speer[a] in die Seite, und sofort kamen Blut und Wasser heraus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer Lanze“.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen „Blut und Wasser“ symbolisch oder sakramental, andere als körperliche Beschreibung. Der griechische Text erklärt die Bedeutung an dieser Stelle nicht.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz dazu, dass Jesu Beine nicht gebrochen wurden, und klingt im Deutschen natürlich.
- source_word: εἷς τῶν στρατιωτῶν
  choice: einer der Soldaten
  rationale: Bewahrt die ausdrückliche partitive Konstruktion des Griechischen.
- source_word: λόγχῃ
  choice: mit einem Speer
  rationale: Bezeichnet die Stichwaffe eines Soldaten; „Speer“ ist im modernen Deutsch klar und geläufig.
- source_word: αὐτοῦ τὴν πλευράν
  choice: ihm … in die Seite
  rationale: Die deutsche Konstruktion mit Dativ und Richtungsangabe gibt den Vorgang natürlich wieder, ohne die Körperstelle genauer festzulegen als der griechische Text.
- source_word: ἔνυξεν
  choice: stach … in
  rationale: Gibt das Einstechen mit einer spitzen Waffe anschaulich und präzise wieder; das bloße „durchbohrte“ könnte eine vollständige Durchdringung nahelegen.
- source_word: καὶ ἐξῆλθεν εὐθὺς
  choice: und sofort kamen … heraus
  rationale: Bewahrt sowohl die Abfolge durch καί als auch die unmittelbare Zeitangabe εὐθύς; der deutsche Plural richtet sich natürlich nach „Blut und Wasser“.
- source_word: αἷμα καὶ ὕδωρ
  choice: Blut und Wasser
  rationale: Gibt die ungewöhnliche Formulierung wörtlich wieder, ohne ihre Bedeutung medizinisch, symbolisch oder sakramental auszulegen.
theological_decisions:
- issue: Deutung von „Blut und Wasser“
  choice: Die wörtliche Wendung „Blut und Wasser“ bleibt im Haupttext unerklärt.
  alternative: Die Worte ausdrücklich als körperliche Beschreibung oder als symbolische beziehungsweise sakramentale Anspielung auslegen.
  rationale: Der griechische Vers berichtet das Geschehen, erklärt dessen Bedeutung hier aber nicht. Die Übersetzung bewahrt diese Offenheit und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „stach ihm … in die Seite“ ist natürlich und präzise; sie vermeidet unnötige medizinische oder theologische Deutung. Beide Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
