  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes angemessen wieder: den adversativen Anschluss (ἀλλ’), die partitive Formulierung „einer der Soldaten“, das Instrument λόγχῃ, die Seitenwunde, die unmittelbare Folge (εὐθύς) sowie „Blut und Wasser“. „Stach ihm … in die Seite“ ist eine idiomatische und semantisch genaue Wiedergabe von τὴν πλευρὰν ἔνυξεν, ohne eine Durchbohrung über den griechischen Befund hinaus zu behaupten.'
