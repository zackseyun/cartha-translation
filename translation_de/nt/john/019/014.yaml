  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: de
  text: 'Es war aber der Rüsttag des Passafestes; es war ungefähr die sechste Stunde.[a] Und er sagt zu den Juden[b]: »Seht, euer König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei der üblichen antiken Stundenzählung entspricht die sechste Stunde ungefähr zwölf Uhr mittags; welche Stundenzählung hier vorausgesetzt wird, ist jedoch umstritten.
    reason: cultural_note
  - marker: b
    text: Mit „den Juden“ können hier im Zusammenhang genauer die judäischen Behörden oder jüdischen Führungskreise gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: der Rüsttag des Passafestes
  rationale: „Rüsttag“ ist eine etablierte, knappe Bezeichnung für den Vorbereitungstag; der Genitiv „des Passafestes“ bleibt nahe an der griechischen Formulierung, ohne die genaue kalendarische Beziehung weiter festzulegen.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: es war ungefähr die sechste Stunde
  rationale: Die Formulierung bewahrt die antike Stundenzählung und gibt ὡς mit „ungefähr“ wieder, statt eine umstrittene moderne Uhrzeit in den Haupttext einzutragen.
- source_word: λέγει
  choice: Da sagt er
  rationale: Das Präsens erhält das für Johannes typische lebendige historische Präsens; „Da“ stellt den natürlichen erzählerischen Anschluss von καί her.
- source_word: τοῖς Ἰουδαίοις
  choice: zu den Juden
  rationale: Die direkte Wiedergabe wahrt den Wortlaut und verengt den Bezug nicht stillschweigend auf bestimmte Amtsträger; eine kontextuell engere Deutung wird in der Fußnote genannt.
- source_word: Ἴδε
  choice: Seht
  rationale: Der deutsche Aufforderungsruf lenkt feierlich und unmittelbar die Aufmerksamkeit auf Jesus und klingt zugleich natürlicher als das heute altertümliche „Siehe“.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: euer König
  rationale: Die idiomatische deutsche Wortstellung bewahrt die politische und ironische Zuspitzung des griechischen Ausdrucks.
theological_decisions:
- issue: Bezugsgruppe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext „die Juden“ beibehalten
  alternative: „die judäischen Behörden“ oder „die jüdischen führenden Männer“
  rationale: Der Vers selbst nennt die Gruppe allgemein. Eine engere kontextuelle Zuordnung ist möglich, sollte aber nicht ohne Kennzeichnung in den Haupttext eingetragen werden.
- issue: Deutung der sechsten Stunde
  choice: Antike Zeitangabe im Haupttext bewahren
  alternative: „ungefähr mittags“
  rationale: Die griechische Form und ihr Ungefährheitsmarker bleiben sichtbar; zugleich wird eine bestimmte Lösung chronologischer und historischer Fragen vermieden.
- issue: Beziehung des Rüsttags zum Passafest
  choice: „Rüsttag des Passafestes“
  alternative: „Vorbereitungstag für das Passafest“
  rationale: Die genitivische Fassung bewahrt die Mehrdeutigkeit, ob die Bezeichnung den Vorbereitungstag für das Passa oder den Rüsttag innerhalb der Passazeit meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rüsttag“ ist ein sachlich-biblischer Fachausdruck, bleibt aber verständlich; „Seht“ vermeidet unnötig altertümliches Deutsch. Die Marker [a] und [b] stehen jeweils direkt bei der betreffenden Aussage.
