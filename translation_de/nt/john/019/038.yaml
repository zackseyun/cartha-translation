id: JHN.19.38
reference: John 19:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: de
  text: Danach bat Josef aus Arimathäa, der ein Jünger Jesu war, dies aber aus Furcht vor den Juden[a] verborgen gehalten hatte, Pilatus darum, den Leichnam Jesu wegnehmen zu dürfen. Pilatus erlaubte es. Da kam er und nahm seinen Leichnam weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Zusammenhang sind damit insbesondere die jüdischen Autoritäten gemeint, die Jesus ablehnten. Johannes gebraucht »die Juden« häufig in diesem Sinn, nicht unterschiedslos für das jüdische Volk.
    reason: Lexikalische und kontextuelle Klarstellung, um eine pauschale ethnische Deutung zu vermeiden.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang im modernen Deutschen natürlich wieder; der Plural ταῦτα ist in der idiomatischen deutschen Übergangsform mit enthalten.
- source_word: ἠρώτησεν τὸν Πιλᾶτον
  choice: bat Pilatus darum
  rationale: Im Kontext bezeichnet ἐρωτάω eine Bitte. Die Konstruktion mit »darum« verbindet sie klar mit dem folgenden Inhaltssatz.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: aus Arimathäa
  rationale: ἀπό bezeichnet hier die Herkunft; »aus« bildet dies unmittelbar und natürlich ab.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: der ein Jünger von Jesus war
  rationale: Löst das Partizip lesbar als Relativsatz auf und bewahrt μαθητής mit der etablierten Wiedergabe »Jünger«.
- source_word: κεκρυμμένος
  choice: dies ... verborgen gehalten hatte
  rationale: Das sachlich ergänzte »dies« bezieht sich auf sein Jüngersein. Das Plusquamperfekt gibt den resultativen Aspekt des Perfektpartizips verständlich wieder.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: aus Furcht vor den Juden
  rationale: Eine knappe, idiomatische und strukturell nahe Wiedergabe der kausalen Präpositionalphrase.
- source_word: τῶν Ἰουδαίων
  choice: den Juden
  rationale: Bewahrt die ausdrückliche, kontextuell komplexe Bezeichnung des griechischen Textes; eine Fußnote schützt vor einer pauschalen ethnischen Deutung.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: den Leichnam von Jesus abnehmen zu dürfen
  rationale: Der finale Inhalt der Bitte wird im Deutschen natürlich mit »zu dürfen« ausgedrückt. Im Kreuzigungskontext bezeichnet αἴρω das Abnehmen bzw. Wegnehmen des toten Körpers; »Leichnam« ist hier präziser als das allgemeinere »Körper«.
- source_word: ἐπέτρεψεν
  choice: erlaubte es
  rationale: Gibt das Gewähren der erbetenen Erlaubnis knapp und idiomatisch wieder.
- source_word: ἦλθεν οὖν καὶ ἦρεν
  choice: Da kam er und nahm ... ab
  rationale: »Da« gibt οὖν hier als erzählerische Folge wieder. Die Wiederholung von »abnehmen« wahrt den lexikalischen Zusammenhang mit αἴρω im vorigen Satz.
- source_word: τὸ σῶμα αὐτοῦ
  choice: seinen Leichnam
  rationale: Bildet das Pronomen αὐτοῦ ausdrücklich ab und vermeidet zugleich eine unnötige Wiederholung des Namens.
theological_decisions:
- issue: Referenz und Wiedergabe von τῶν Ἰουδαίων im Johannesevangelium
  choice: Im Haupttext »den Juden«, ergänzt durch eine erklärende Fußnote
  alternative: »den jüdischen Autoritäten« oder »den Judäern«
  rationale: Der griechische Wortlaut soll in seiner Spannung erhalten bleiben und nicht im Haupttext interpretierend verengt werden. Zugleich macht die Fußnote deutlich, dass hier im Zusammenhang nicht das jüdische Volk unterschiedslos gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem langen griechischen Satz behutsam gegliedert. »Leichnam« entspricht dem Bestattungskontext; »abnehmen« verdeutlicht die Entfernung vom Kreuz, ohne den Zweck der Bestattung in den Text hineinzuschreiben.
