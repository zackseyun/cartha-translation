source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: de
  text: Nachdem die Soldaten Jesus gekreuzigt hatten, nahmen sie seine Obergewänder[a] und teilten sie in vier Teile, für jeden Soldaten einen Teil, und nahmen auch das Untergewand. Das Untergewand aber war ohne Naht[b], von oben an durchgehend gewebt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Kleider«. Das griechische Wort kann Kleidung allgemein bezeichnen; hier sind wahrscheinlich die Obergewänder im Unterschied zu dem anschließend eigens genannten Untergewand gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nicht genäht«; möglicherweise ist gemeint, dass es als ein einziges Stück gewebt war.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich auch möglich: »von oben her durch das Ganze gewebt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Nachdem die Soldaten
  rationale: οὖν führt die Erzählung weiter; im Deutschen stellt die mit ὅτε verbundene temporale Fügung den natürlichen Anschluss her, ohne eine starke Schlussfolgerung auszudrücken.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: Nachdem die Soldaten Jesus gekreuzigt hatten
  rationale: Der Aorist bezeichnet hier die Kreuzigung als der anschließenden Verteilung vorausgehend; das Plusquamperfekt gibt diese Abfolge idiomatisch wieder.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: nahmen sie seine Obergewänder
  rationale: ἱμάτια kann allgemein Kleidung bezeichnen, meint hier im Gegensatz zum gesondert genannten χιτών wahrscheinlich die äußeren Kleidungsstücke.
- source_word: ἐποίησαν τέσσαρα μέρη
  choice: teilten sie in vier Teile
  rationale: Die idiomatische deutsche Formulierung gibt das wörtliche 'machten vier Teile' klar wieder.
- source_word: ἑκάστῳ στρατιώτῃ μέρος
  choice: für jeden Soldaten einen Teil
  rationale: Die Dativfügung erläutert die vierfache Aufteilung; die Wiederholung von 'Teil' wahrt die Formulierung des griechischen Textes.
- source_word: καὶ τὸν χιτῶνα
  choice: dazu auch das Untergewand
  rationale: χιτών bezeichnet das unmittelbar am Körper getragene Kleidungsstück. 'Untergewand' ist verständlicher als das historisch gefärbte 'Leibrock' und grenzt es von den Obergewändern ab.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Das Untergewand aber war ohne Naht
  rationale: δέ markiert eine leichte Weiterführung beziehungsweise Gegenüberstellung. ἄραφος bedeutet wörtlich 'nicht genäht' und wird präzise mit 'ohne Naht' wiedergegeben.
- source_word: ἐκ τῶν ἄνωθεν
  choice: von oben an
  rationale: Im Zusammenhang mit der Herstellung eines Kleidungsstücks bezeichnet ἄνωθεν wahrscheinlich dessen oberen Ausgangspunkt; die allgemeinere Bedeutung 'von oben her' bleibt in der Fußnote sichtbar.
- source_word: ὑφαντὸς δι’ ὅλου
  choice: durchgehend gewebt
  rationale: ὑφαντός bezeichnet Gewebtes, während δι’ ὅλου die gesamte Ausdehnung beziehungsweise ununterbrochene Beschaffenheit ausdrückt.
theological_decisions:
- issue: Mögliche symbolische Deutung des nahtlosen Untergewands
  choice: Die Beschaffenheit des Untergewands wird rein beschreibend übersetzt.
  alternative: Die Formulierung als Hinweis auf priesterliche Kleidung oder auf die Einheit der Kirche deuten.
  rationale: Der Vers selbst beschreibt das Kleidungsstück und das Handeln der Soldaten, ohne eine symbolische Deutung ausdrücklich zu machen. Eine solche Deutung wird daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zeitliche Abfolge wird mit einem Nachdem-Satz natürlich ausgedrückt. 'Obergewänder' und 'Untergewand' machen den im Kontext angelegten Unterschied verständlich; die Fußnoten bewahren die lexikalische Weite und die Mehrdeutigkeit der Herstellungsbeschreibung.
