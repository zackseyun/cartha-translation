id: JHN.19.17
reference: John 19:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: de
  text: Er trug das Kreuz selbst und ging hinaus zu dem Ort, der Schädelstätte genannt wird und auf Hebräisch[a] Golgota heißt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: „auf Aramäisch“. Der von Johannes verwendete Ausdruck „auf Hebräisch“ kann die örtliche semitische Sprache Judäas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: trug
  rationale: Das Verb bezeichnet hier das konkrete Tragen des Kreuzes; „trug“ ist im modernen Deutschen natürlich und präzise.
- source_word: αὑτῷ τὸν σταυρόν
  choice: das Kreuz selbst
  rationale: 'Die Formulierung bewahrt die reflexive Hervorhebung: Jesus trug das Kreuz selbst. Sie vermeidet zugleich, αὑτῷ ohne Not als bloße Besitzangabe „sein eigenes“ wiederzugeben.'
- source_word: σταυρός
  choice: Kreuz
  rationale: „Kreuz“ ist im Passionszusammenhang die sachlich und sprachlich angemessene Entsprechung. Die engere historische Deutung „Querbalken“ wird vom griechischen Ausdruck hier nicht verlangt.
- source_word: ἐξῆλθεν
  choice: ging hinaus
  rationale: Die Wendung gibt die räumliche Bewegung des Aorists direkt und in heutigem Deutsch wieder.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: zu dem Ort, der Schädelstätte genannt wird
  rationale: Die Wiedergabe erhält sowohl τόπος („Ort“) als auch die Benennung mit κρανίον („Schädel“). „Schädelstätte“ ist eine verständliche und würdige deutsche Ortsbezeichnung.
- source_word: ὃ λέγεται
  choice: heißt
  rationale: In Verbindung mit dem Eigennamen ist „heißt“ die natürliche deutsche Wiedergabe der passiven Benennungsformel.
- source_word: Ἑβραϊστί
  choice: auf Hebräisch
  rationale: Der Haupttext folgt der ausdrücklichen griechischen Sprachbezeichnung; die mögliche weitere Bedeutung im johanneischen Sprachgebrauch wird in einer Fußnote offengehalten.
- source_word: Γολγοθα
  choice: Golgota
  rationale: Der semitische Ortsname wird in der im Deutschen üblichen transliterierten Form wiedergegeben.
theological_decisions:
- issue: Sprachbezeichnung Ἑβραϊστί
  choice: auf Hebräisch
  alternative: auf Aramäisch
  rationale: Der griechische Wortlaut nennt Hebräisch. Da der Ausdruck im damaligen Gebrauch auch die örtliche semitische Sprache Judäas und damit möglicherweise Aramäisch bezeichnen kann, wird diese Möglichkeit nicht in den Haupttext eingesetzt, sondern in der Fußnote bewahrt.
- issue: Reflexive Hervorhebung bei αὑτῷ τὸν σταυρόν
  choice: das Kreuz selbst
  alternative: sein eigenes Kreuz
  rationale: Die gewählte Fassung hebt hervor, dass Jesus das Kreuz selbst trug, ohne die syntaktisch nicht zwingende Besitzbedeutung „sein eigenes“ festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ablauf, wird jedoch für natürliche deutsche Lesbarkeit leicht geglättet. Der traditionelle Ausdruck „Schädelstätte“ bewahrt die wörtliche Bedeutung, ohne eine zusätzliche Deutung des Ortsnamens einzuführen.
