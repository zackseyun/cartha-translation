  to: 'Da sagten sie zueinander: »Wir wollen es nicht zerreißen, sondern darum losen, wem es gehören soll.« Damit die Schrift erfüllt würde, die sagt: »Sie haben meine Gewänder unter sich verteilt und über meine Kleidung das Los geworfen.«[a] Dies taten die Soldaten.'
