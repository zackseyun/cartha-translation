    issue: Unnötige Verstärkung in »Genau das taten die Soldaten«
    rationale: ταῦτα bedeutet »dies/diese Dinge«; »genau« fügt eine Betonung hinzu, die der griechische Text nicht ausdrücklich setzt.
  - severity: low
    issue: »Kleid« für ἱματισμός
    rationale: Im modernen Standarddeutsch wird »Kleid« häufig als Damenkleid verstanden. »Kleidung« ist hier natürlicher und entspricht dem allgemeinen Kleidungsbegriff im Psalmzitat.
  - severity: low
    issue: »So sollte die Schrift erfüllt werden«
    rationale: Die Formulierung kann wie eine bloße Erwartung oder Notwendigkeit klingen. »Damit die Schrift erfüllt würde« bildet die finale ἵνα-Konstruktion transparenter ab, ohne deren theologisches Verhältnis näher zu bestimmen.
