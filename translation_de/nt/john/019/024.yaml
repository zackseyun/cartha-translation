source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: de
  text: 'Da sagten sie zueinander: »Wir wollen es nicht zerreißen, sondern darum losen, wem es gehören soll.« Damit die Schrift erfüllt würde, die sagt: »Sie haben meine Gewänder unter sich verteilt und über meine Kleidung das Los geworfen.«[a] Dies taten die Soldaten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Psalm 22,19.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: zerreißen
  rationale: Das Verb bezeichnet hier das Zerreißen eines Kleidungsstücks; »zerreißen« ist im Deutschen natürlich und genau.
- source_word: λάχωμεν
  choice: darum losen
  rationale: Das Verb meint, die Zuteilung durch ein Los zu bestimmen. »Darum losen« gibt die Handlung knapp und idiomatisch wieder.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: wem es gehören soll
  rationale: Die Wendung bezeichnet die durch das Los zu klärende Eigentumsfrage; die deutsche Formulierung macht diesen Sinn natürlich deutlich.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: So sollte die Schrift erfüllt werden
  rationale: Die Formulierung bewahrt die johanneische Erfüllungsaussage, ohne die Beziehung zwischen göttlicher Absicht und menschlichem Handeln näher festzulegen.
- source_word: ἱμάτιά
  choice: Gewänder
  rationale: »Gewänder« ist eine verständliche, leicht gehobene Wiedergabe für die Mehrzahl der Kleidungsstücke und passt zum Schriftzitat.
- source_word: ἱματισμόν
  choice: Kleid
  rationale: »Kleid« bezeichnet hier ein einzelnes Kleidungsstück und erhält die lexikalische Unterscheidung gegenüber dem vorausgehenden Plural »Gewänder«.
- source_word: ἔβαλον κλῆρον
  choice: das Los geworfen
  rationale: Die wörtlich-nahe Form bewahrt den Singular von κλῆρον und die Bildsprache des Psalmzitats.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Genau das taten die Soldaten
  rationale: »Genau das« gibt den rückverweisenden und bestätigenden Sinn natürlich wieder; das erneute οὖν wird im Deutschen nicht mechanisch wiederholt.
theological_decisions:
- issue: Verhältnis der Handlung der Soldaten zur Erfüllung der Schrift in ἵνα ἡ γραφὴ πληρωθῇ
  choice: Als Erfüllungsaussage wiedergeben, ohne einen stärkeren Determinismus ausdrücklich einzutragen.
  alternative: »damit die Schrift erfüllt würde« oder resultativ »sodass die Schrift erfüllt wurde«
  rationale: Die Übersetzung erhält die theologische Spannung zwischen dem Handeln der Soldaten und der Erfüllung der Schrift, ohne deren philosophischen Zusammenhang zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich formuliert; das Schriftzitat bleibt leicht gehoben. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem Zitat.
