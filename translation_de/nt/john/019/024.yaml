  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Die Soldaten sollen das Kleidungsstück nicht zerreißen, sondern durch Los entscheiden, wem es gehören wird. Die Erfüllungsformel und das Psalmzitat sind sachgerecht erfasst. »Genau das« verstärkt jedoch das schlichte ταῦτα unnötig. Außerdem ist »Kleid« für ἱματισμός im heutigen Deutsch leicht missverständlich, da es meist ein bestimmtes einteiliges Kleidungsstück bezeichnet.'
  naturalness: Die direkte Rede ist insgesamt flüssig. »Darum losen« ist verständlich und im Kontext idiomatisch genug. »Damit die Schrift erfüllt würde« ist als deutsche Wiedergabe der finalen ἵνα-Konstruktion klarer und quellennäher als »So sollte die Schrift erfüllt werden«.
  terminology: »Schrift«, »Gewänder« und »Los« sind im würdigen, modernen Bibelregister passend. Im Zitat wahrt »Kleidung« die Unterscheidung zu »Gewänder«, ohne die im Gegenwartsdeutsch möglichen Nebenbedeutungen von »Kleid« hervorzurufen. Die Fußnote verweist korrekt auf Psalm 22,19 (deutsche Verszählung).
  issues:
