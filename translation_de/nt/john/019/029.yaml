  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: de
  text: Dort stand ein Gefäß voll sauren Weins[a]. Sie tränkten also einen Schwamm mit dem sauren Wein, befestigten ihn an Ysop[b] und brachten ihn an seinen Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Essig“. Das griechische Wort kann sauren Wein oder Essig bezeichnen; hier ist wahrscheinlich das säuerliche Weingetränk gemeint, das Soldaten zur Verfügung stand.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „auf einen Ysopzweig“ oder „mithilfe von Ysop“. Im Griechischen steht nur „auf/mit Ysop“; der genaue Vorgang ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: Gefäß
  rationale: Der allgemeine Begriff bezeichnet hier einen Behälter, ohne dessen genaue Art festzulegen; „Gefäß“ ist natürlich und textnah.
- source_word: ἔκειτο
  choice: stand dort
  rationale: κεῖμαι beschreibt den vorhandenen Standort. Bei einem Gefäß klingt im Deutschen „stand dort“ natürlicher als „lag dort“.
- source_word: ὄξος
  choice: saurer Wein
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich ein billiges, säuerliches Weingetränk; „saurer Wein“ ist als angebotene Flüssigkeit verständlicher als bloß „Essig“.
- source_word: μεστός
  choice: voll / getränkt mit
  rationale: Beim Gefäß wird die Fülle direkt mit „voll“ wiedergegeben; beim Schwamm drückt das idiomatische „tränkten ... mit“ denselben Sachverhalt im Deutschen natürlich aus.
- source_word: σπόγγος
  choice: Schwamm
  rationale: Direkte und eindeutige deutsche Entsprechung.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folge innerhalb der Erzählung knapp und natürlich.
- source_word: ὑσσώπῳ
  choice: auf Ysop
  rationale: Der Dativ kann Befestigung oder Mittel bezeichnen. „Auf Ysop“ bleibt nahe am griechischen Wortlaut und legt die genaue Beschaffenheit nicht fest.
- source_word: περιθέντες
  choice: steckten ihn auf
  rationale: Das vorzeitige Partizip beschreibt das Anbringen des Schwamms am Ysop; die koordinierte deutsche Verbform gibt den Handlungsablauf flüssig wieder.
- source_word: προσήνεγκαν
  choice: hielten ihn an
  rationale: Das Verb bedeutet heranbringen oder darbieten. Im konkreten Vorgang am Mund ist „hielten ihn an“ natürlich, ohne eine darüber hinausgehende Deutung einzutragen.
- source_word: αὐτοῦ τῷ στόματι
  choice: an seinen Mund
  rationale: Die Dativverbindung bezeichnet das Ziel des Heranbringens; „an seinen Mund“ entspricht dem konkreten deutschen Sprachgebrauch.
theological_decisions:
- issue: Historische und kultische Resonanz von ὑσσώπῳ
  choice: „Ysop“ bleibt unkommentiert im Haupttext erhalten.
  alternative: Deutender „ein Ysopzweig“ schreiben oder den Ausdruck als bloßen Stängel beziehungsweise Stock wiedergeben.
  rationale: Die Wortwahl kann an Passa und Reinigung erinnern, doch der Vers erklärt diese Symbolik nicht ausdrücklich. Die Beibehaltung von „Ysop“ bewahrt die mögliche Resonanz, ohne sie zur festgelegten Deutung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählweise. „Gefäß“ vermeidet eine unbelegte Festlegung auf Krug oder Schale; die Fußnoten erhalten die echten lexikalischen und syntaktischen Alternativen.
