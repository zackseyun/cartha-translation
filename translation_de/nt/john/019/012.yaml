reference: John 19:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: de
  text: 'Von da an bemühte sich Pilatus, ihn freizulassen.[a] Doch die Juden[b] schrien: »Wenn du diesen Mann freilässt, bist du kein Freund des Kaisers. Jeder, der sich selbst zum König macht, stellt sich gegen den Kaiser.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deshalb bemühte sich Pilatus immer wieder, ihn freizulassen.« Die griechische Wendung kann zeitlich (»von da an«) oder kausal (»deshalb«) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnung »die Juden« meint bei Johannes je nach Zusammenhang häufig bestimmte jüdische Gegner Jesu oder judäische Autoritäten, nicht das jüdische Volk insgesamt.
    reason: cultural_note
  - marker: c
    text: 'Oder: »widerspricht dem Kaiser« beziehungsweise »tritt gegen den Kaiser auf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Von da an
  rationale: Die Wendung wird im Erzählzusammenhang zeitlich verstanden und markiert die weitere Entwicklung; die mögliche kausale Deutung bleibt in Fußnote [a] erhalten.
- source_word: ἐζήτει
  choice: versuchte
  rationale: Im Zusammenhang mit dem Infinitiv bezeichnet das Imperfekt ein anhaltendes beziehungsweise wiederholtes Bemühen. Das deutsche Präteritum ist erzählerisch natürlich; der durative Sinn ergibt sich aus »Von da an« und dem Verbzusammenhang.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: freizulassen / freilässt
  rationale: »Freilassen« bezeichnet hier präzise die amtliche Entlassung aus dem Gewahrsam und klingt im modernen Deutsch natürlich.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Doch die Juden
  rationale: Die Übersetzung bewahrt die nicht weiter eingegrenzte Formulierung des griechischen Textes. Eine kontextuelle Erläuterung verhindert in Fußnote [b] eine pauschale Auslegung auf das jüdische Volk insgesamt.
- source_word: ἐκραύγασαν λέγοντες
  choice: schrien
  rationale: Das Verb bezeichnet einen lauten öffentlichen Ausruf. Das zusätzliche Partizip »sagend« wird im Deutschen idiomatisch durch die unmittelbar folgende direkte Rede ausgedrückt.
- source_word: τοῦτον
  choice: diesen Mann
  rationale: Die Formulierung gibt die demonstrative und möglicherweise abweisende Färbung natürlicher wieder als ein bloßes »ihn«.
- source_word: φίλος τοῦ Καίσαρος
  choice: Freund des Kaisers
  rationale: Die Genitivverbindung wird eng am Wortlaut wiedergegeben und lässt offen, ob nur persönliche beziehungsweise politische Loyalität oder auch eine besondere Ehrenbezeichnung anklingt.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Jeder, der sich selbst zum König macht
  rationale: Diese Wiedergabe folgt der griechischen Konstruktion, ohne sie interpretierend zu »wer behauptet, König zu sein« abzuschwächen.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: stellt sich gegen den Kaiser
  rationale: Im politisch-juristischen Zusammenhang bezeichnet ἀντιλέγω Widerstand oder Gegnerschaft. Die Formulierung ist im Deutschen natürlich und bewahrt zugleich den relationalen Sinn; die stärker verbale Alternative steht in Fußnote [c].
theological_decisions:
- issue: Bezugsgruppe der Bezeichnung οἱ Ἰουδαῖοι im Johannesevangelium
  choice: »die Juden« im Haupttext beibehalten
  alternative: »die jüdischen führenden Männer« oder »die Judäer«
  rationale: Der griechische Wortlaut grenzt die Gruppe hier nicht ausdrücklich auf Amtsträger ein. Eine solche Eingrenzung im Haupttext würde die genuine Mehrdeutigkeit auflösen; Fußnote [b] erläutert den narrativen Kontext und beugt einer pauschalen antijüdischen Lesart vor.
- issue: Politische Bedeutung von φίλος τοῦ Καίσαρος
  choice: »Freund des Kaisers« ohne zusätzliche Festlegung
  alternative: »dem Kaiser treu« oder »ein offizieller Freund des Kaisers«
  rationale: Der Ausdruck kann allgemein politische Loyalität bezeichnen und möglicherweise an einen Ehrentitel erinnern. Der Haupttext soll keine dieser Möglichkeiten exklusiv festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. »Kaiser« ist die im Deutschen etablierte Wiedergabe von Καῖσαρ; »Pilatus« bleibt ohne ergänzenden Amtstitel. Die direkte Rede ist klar und politisch zugespitzt formuliert, ohne mögliche Ehrentitel oder institutionelle Hintergründe in den Haupttext hineinzulesen.
