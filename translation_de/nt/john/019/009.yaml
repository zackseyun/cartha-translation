  naturalness: Modernes Standarddeutsch und ein passender erzählerischer Register. „Jesus aber gab ihm keine Antwort“ ist idiomatisch und dem griechischen Ausdruck eng verbunden. „ging wieder in den Amtssitz des Statthalters hinein“ ist zwar etwas ausführlicher als „betrat“, aber natürlich und bildet die Bewegungsrichtung von εἰσῆλθεν klar ab.
