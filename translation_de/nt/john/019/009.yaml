  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: de
  text: 'Und er ging wieder in den Amtssitz des Statthalters[a] hinein und sagte zu Jesus: »Woher kommst du?« Jesus aber gab ihm keine Antwort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Prätorium“; gemeint ist die offizielle Residenz oder der Amtssitz des römischen Statthalters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging … hinein
  rationale: Das Verb bezeichnet die Bewegung in einen Ort hinein. Die Wendung ist im modernen Deutschen natürlich und gibt die räumliche Richtung ausdrücklich wieder.
- source_word: πραιτώριον
  choice: Amtssitz des Statthalters
  rationale: Der Ausdruck bezeichnet hier die offizielle Residenz beziehungsweise den Amtssitz des römischen Statthalters. Die funktionale Wiedergabe ist für heutige Leser verständlicher als das Fremdwort „Prätorium“.
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb kennzeichnet die Wiederholung der Handlung und wird direkt und idiomatisch wiedergegeben.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens des griechischen Erzählstils wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben.
- source_word: Πόθεν εἶ σύ;
  choice: Woher kommst du?
  rationale: Die Frage zielt auf Jesu Herkunft oder Ursprung. Diese Formulierung ist idiomatisch und bewahrt die im Kontext bedeutsame Offenheit der Frage.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: gab ihm keine Antwort
  rationale: Die Wiedergabe folgt der griechischen Ausdrucksweise wörtlich nah und klingt zugleich natürlich auf Deutsch.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jesus aber
  rationale: Die Nachstellung von „aber“ ist im Deutschen idiomatisch und hebt den Gegensatz zwischen der Frage und Jesu Schweigen hervor.
theological_decisions:
- issue: Unausgesprochenes Subjekt von εἰσῆλθεν und λέγει
  choice: „er“, wobei der Zusammenhang auf Pilatus verweist
  alternative: Den Namen „Pilatus“ ausdrücklich in den Haupttext einsetzen
  rationale: Im Griechischen bleibt das Subjekt unausgesprochen und ist aus dem Zusammenhang eindeutig. Das Pronomen wahrt die Form des Ausgangstextes, ohne eine zusätzliche ausdrückliche Benennung einzuführen.
- issue: Bedeutungsweite der Herkunftsfrage Πόθεν εἶ σύ;
  choice: „Woher kommst du?“
  alternative: „Woher stammst du?“
  rationale: Die gewählte Fassung lässt wie das Griechische offen, ob nach geografischer, persönlicher oder tieferer Herkunft gefragt wird, und löst die johanneische Spannung nicht vorschnell auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Text, während die Wortstellung natürlich deutsch ist.
