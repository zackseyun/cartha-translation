source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: de
  text: Da es Vorbereitungstag[d] war und die Körper am Sabbat nicht am Kreuz bleiben sollten – denn jener Sabbat war ein besonders bedeutender Tag[b] –, baten die Juden[a] Pilatus, ihnen die Beine brechen und die Körper abnehmen zu lassen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Juden“ kann im Johannesevangelium je nach Zusammenhang auch Judäer oder spezifischer jüdische Autoritäten bezeichnen.
    reason: Kontextuelle Bedeutungsalternative von Ἰουδαῖοι.
  - marker: b
    text: 'Wörtlicher: „Denn der Tag jenes Sabbats war groß“; gemeint ist ein Sabbat von besonderer Bedeutung.'
    reason: Die Bedeutung von μεγάλη und die besondere Hervorhebung des Sabbats bleiben nachvollziehbar.
  - marker: c
    text: 'Oder: „wegbringen zu lassen“. Das griechische Verb kann allgemein „wegnehmen“ oder „entfernen“ bedeuten; hier liegt das Abnehmen vom Kreuz nahe.'
    reason: Lexikalische Bedeutungsbreite von αἴρω.
  - marker: d
    text: 'Oder: „Rüsttag“. Der Ausdruck bezeichnet den Tag der Vorbereitung vor dem Sabbat.'
    reason: Erläuterung von παρασκευή und traditionelle deutsche Alternative.
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: die Juden
  rationale: Ἰουδαῖοι bezeichnet im Johannesevangelium je nach Zusammenhang Juden, Judäer oder jüdische Autoritäten. Der Haupttext bleibt bei der nicht weiter eingeengten Wiedergabe; die mögliche spezifischere Bedeutung wird in einer Fußnote genannt. οὖν wird im Deutschen durch den kausalen Gesamtbau mit „nun“ aufgenommen.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: Weil nun Rüsttag war
  rationale: παρασκευή ist hier der Vorbereitungstag vor dem Sabbat. „Rüsttag“ ist eine knappe, im biblischen Deutsch verständliche Bezeichnung und bewahrt den Charakter eines festen Tagesnamens.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: und die Leichen am Sabbat nicht am Kreuz bleiben sollten
  rationale: Der ἵνα-Satz bezeichnet den beabsichtigten Zweck. „Leichen“ gibt σώματα im Zusammenhang mit den bereits erwarteten Todesfällen natürlich wieder; „am Kreuz bleiben sollten“ drückt die beabsichtigte Vermeidung idiomatisch aus.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: denn jener Sabbat war ein besonders bedeutender Tag
  rationale: μεγάλη bedeutet wörtlich „groß“, bezeichnet hier aber die besondere Bedeutung dieses Sabbats. Die Formulierung ist modernes Deutsch, ohne den Ausdruck konfessionell auszudeuten; der wörtlichere Wortlaut bleibt in der Fußnote sichtbar.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: baten ... Pilatus
  rationale: ἐρωτάω hat hier den Sinn einer an eine zuständige Person gerichteten Bitte. „Pilatus bitten“ ist im Deutschen natürlicher und kontextgemäßer als bloßes „fragen“.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: ihnen die Beine brechen ... zu lassen
  rationale: Der passive Aorist Konjunktiv von κατάγνυμι bezeichnet das Brechen der Beine. Die deutsche Konstruktion mit „lassen“ macht deutlich, dass Pilatus die Handlung genehmigen beziehungsweise anordnen sollte.
- source_word: καὶ ἀρθῶσιν
  choice: und sie abnehmen zu lassen
  rationale: αἴρω kann „aufheben“, „wegnehmen“ oder „entfernen“ bedeuten. Im unmittelbaren Zusammenhang ist das Abnehmen der Körper vom Kreuz gemeint; „abnehmen“ ist daher natürlich und sachlich präzise.
theological_decisions:
- issue: Referent von Ἰουδαῖοι
  choice: die Juden
  alternative: die jüdischen Autoritäten / die Judäer
  rationale: Der griechische Ausdruck ist nicht ausdrücklich auf die Führungsschicht beschränkt, kann im johanneischen Zusammenhang aber eine solche Gruppe meinen. Der Haupttext wahrt die lexikalische Breite; die kontextuelle Alternative wird in der Fußnote offengelegt.
- issue: Bedeutung von μεγάλη beim Sabbat
  choice: ein besonders bedeutender Tag
  alternative: 'wörtlicher: Der Tag jenes Sabbats war groß; traditionell: ein hoher Feiertag'
  rationale: Die Aussage hebt die besondere Bedeutung dieses Sabbats hervor, erklärt aber nicht näher, worin sie bestand. Die Übersetzung gibt diese Hervorhebung verständlich wieder, ohne eine bestimmte festkalenderliche oder konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau hält Ursache, Zweck und Bitte klar zusammen. „Rüsttag“ bewahrt den historischen Tagesbegriff; weniger geläufige oder kontextuell variable Ausdrücke werden knapp in Fußnoten erläutert.
