id: JHN.19.11
reference: John 19:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Du hättest überhaupt keine Vollmacht über mich, wenn sie dir nicht von oben[a] gegeben wäre. Darum ist derjenige, der mich dir ausgeliefert hat[b], einer größeren Sünde schuldig.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Himmel“. Das griechische Wort bedeutet „von oben“ und weist im Johannesevangelium häufig auf einen göttlichen Ursprung hin.'
    reason: lexical_alternative
  - marker: b
    text: Wer Jesus ausgeliefert hat, wird hier nicht ausdrücklich genannt. Gemeint sein können Judas, Kajaphas oder allgemeiner die jüdische Führung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet hier treffend die übertragene rechtliche und politische Befugnis des Pilatus; „Macht“ könnte eher bloße Durchsetzungsgewalt meinen.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: überhaupt keine Vollmacht über mich
  rationale: „Über mich“ gibt κατά mit Genitiv im gerichtlichen Zusammenhang idiomatisch wieder; „überhaupt keine“ bewahrt die nachdrückliche Verneinung durch οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: dir … gegeben wäre
  rationale: Die passive Form wird im irrealen Bedingungssatz natürlich wiedergegeben und lässt den Geber, wie im Griechischen, unausgesprochen.
- source_word: ἄνωθεν
  choice: von oben
  rationale: Die Wendung bewahrt die johanneische Ausdrucksweise und den Hinweis auf einen göttlichen Ursprung, ohne im Haupttext ausdrücklich „vom Himmel“ einzusetzen.
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: „Darum“ gibt den folgernden beziehungsweise begründenden Zusammenhang knapp und natürlich wieder.
- source_word: ὁ παραδούς μέ σοι
  choice: derjenige, der mich dir ausgeliefert hat
  rationale: „Ausgeliefert“ passt zum Passions- und Gerichtsrahmen; die allgemeine Formulierung legt nicht fest, ob Judas, Kajaphas oder eine größere Führungsgruppe gemeint ist.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: ist … einer größeren Sünde schuldig
  rationale: Die Formulierung bewahrt ausdrücklich „Sünde“, gibt das griechische „hat“ jedoch in natürlichem Deutsch als persönliche Schuld wieder und erhält den Vergleich unterschiedlicher Verantwortungsgrade.
theological_decisions:
- issue: Ursprung der Vollmacht des Pilatus in ἄνωθεν
  choice: „von oben“ als Hinweis auf göttlich verliehene Vollmacht, ohne eine umfassende Lehre politischer Herrschaft auszuformulieren
  alternative: „vom Himmel“ oder ein unspezifischer höherer Ursprung
  rationale: Im johanneischen Zusammenhang weist ἄνωθεν auf Gott als Quelle; die wörtlich-nahe Formulierung bewahrt zugleich die Ausdrucksweise und vermeidet eine über den Vers hinausgehende politische Aussage.
- issue: Identität von ὁ παραδούς μέ σοι
  choice: Die Person oder Gruppe bleibt im Haupttext unbestimmt.
  alternative: Judas, Kajaphas oder die jüdische Führung insgesamt
  rationale: Der griechische Text nennt den Bezug nicht ausdrücklich. Eine offene Wiedergabe erhält diese echte Auslegungsfrage und vermeidet eine konfessionell oder exegetisch verengende Festlegung.
- issue: Vergleich der Sündenschuld
  choice: Der Ausliefernde trägt größere Sündenschuld als Pilatus; Pilatus wird dadurch nicht für schuldlos erklärt.
  alternative: Pilatus sei vollständig entschuldigt oder der Ausliefernde trage allein die Schuld.
  rationale: Der Komparativ μείζονα setzt abgestufte Verantwortung voraus, hebt die Verantwortung des Pilatus aber nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollmacht“ hält den rechtlich-delegierten Charakter fest; „überhaupt keine“ bewahrt den Nachdruck. Die Satzstruktur bleibt klar und mündlich verständlich, während „einer größeren Sünde schuldig“ die theologische Schärfe des griechischen Ausdrucks erhält.
