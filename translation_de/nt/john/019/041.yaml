  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Bedeutungen des griechischen Textes zuverlässig wieder: Ortsangabe der Kreuzigung, Garten, neues Grab sowie die Aussage, dass dort bis dahin niemand beigesetzt/hingelegt worden war. Das Passiv bei „gekreuzigt worden war“ wahrt ἐσταυρώθη. „Noch nie jemand“ entspricht in diesem erzählerischen Rückblick angemessen οὐδέπω οὐδείς.'
