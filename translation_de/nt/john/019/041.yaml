id: JHN.19.41
reference: John 19:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: de
  text: An dem Ort, wo er gekreuzigt worden war, lag ein Garten, und in dem Garten war ein neues Grab, in das noch nie jemand gelegt worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: Die schwache erzählerische Verknüpfung wird im Deutschen durch den unmittelbaren Anschluss an den Kontext hinreichend deutlich; ein einleitendes „Nun“ könnte fälschlich zeitlich verstanden werden.
- source_word: ἐν τῷ τόπῳ ὅπου ἐσταυρώθη
  choice: An dem Ort, wo er gekreuzigt worden war
  rationale: „An dem Ort“ ist für die Lageangabe natürliches Deutsch. Das Passiv bleibt erhalten; das Plusquamperfekt ordnet die Kreuzigung gegenüber der erzählten Grabsituation zeitlich ein.
- source_word: κῆπος
  choice: Garten
  rationale: „Garten“ ist die gewöhnliche und im Zusammenhang nicht unnötig spezifizierende Entsprechung.
- source_word: μνημεῖον καινόν
  choice: ein neues Grab
  rationale: „Grab“ bezeichnet hier natürlich die für eine Beisetzung bestimmte Grabanlage. „Neu“ gibt καινόν wieder; dass das Grab unbenutzt war, erklärt erst der folgende Satzteil.
- source_word: ἐν ᾧ
  choice: in das
  rationale: Beim deutschen Verb „legen“ ist wegen der gerichteten Bewegung der Akkusativ idiomatisch; der Bezug auf das Grab bleibt eindeutig.
- source_word: οὐδέπω οὐδεὶς
  choice: noch nie jemand
  rationale: Die idiomatische deutsche Verbindung gibt wieder, dass bis zu diesem Zeitpunkt keine Person dort bestattet worden war.
- source_word: ἦν τεθειμένος
  choice: gelegt worden war
  rationale: Das passive Plusquamperfekt gibt die periphrastische Vorzeitigkeit und den Bestattungskontext angemessen wieder.
theological_decisions:
- issue: Bestattungssprache bei μνημεῖον und τεθειμένος
  choice: Grab … gelegt worden war
  alternative: Grabstätte … beigesetzt worden war
  rationale: Die gewählte Formulierung wahrt die konkrete Erzählung und bleibt nahe am Bild des Hineinlegens, ohne zusätzliche zeremonielle oder theologische Vorstellungen einzutragen.
- issue: Genus und Stimme von ἐσταυρώθη
  choice: er gekreuzigt worden war
  alternative: man ihn gekreuzigt hatte
  rationale: Das grammatische Passiv des griechischen Textes bleibt erhalten; ein handelndes Subjekt wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „lag ein Garten“ wird als natürliche Ortsbeschreibung verwendet; Wiederholung von „Garten“ und „Grab“ bewahrt die klare Struktur des griechischen Satzes.
