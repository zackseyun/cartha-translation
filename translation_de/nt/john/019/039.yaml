  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: de
  text: Auch Nikodemus kam, der früher bei Nacht zu Jesus gekommen war. Er brachte eine Mischung aus Myrrhe und Aloe mit, etwa hundert Litra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Litra war ein römisches Pfund von ungefähr 327 Gramm. Hundert Litra entsprechen etwa 32–33 Kilogramm.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ Νικόδημος
  choice: Auch Nikodemus kam
  rationale: δέ verbindet den Satz locker mit dem Vorhergehenden; καί fügt Nikodemus zu den bereits genannten Beteiligten hinzu. „Auch Nikodemus kam“ ist im Deutschen natürlich und bewahrt diese additive Aussage.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: der Mann, der das erste Mal nachts zu Jesus gekommen war
  rationale: Die substantivierte Partizipialfügung identifiziert Nikodemus durch den Rückverweis auf Johannes 3,1–2. „Das erste Mal“ gibt τὸ πρῶτον wieder, ohne den möglichen Sinn vorschnell nur auf „früher“ festzulegen. Das Pronomen wird zur natürlichen und eindeutigen deutschen Bezugnahme als „Jesus“ wiedergegeben.
- source_word: φέρων
  choice: Er brachte … mit
  rationale: Das Präsenspartizip bezeichnet einen begleitenden Umstand seines Kommens. Ein neuer deutscher Satz mit „brachte … mit“ ist idiomatisch und erhält den sachlichen Zusammenhang.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: eine Mischung aus Myrrhe und Aloe
  rationale: μίγμα bedeutet „Mischung“, σμύρνη „Myrrhe“. ἀλόη bezeichnet hier einen aromatischen Stoff für die Bestattung; „Aloe“ ist die geläufige deutsche Bezeichnung.
- source_word: ὡς λίτρας ἑκατόν
  choice: etwa hundert Litra
  rationale: ὡς kennzeichnet bei einer Mengenangabe eine Näherung. Die antike Einheit „Litra“ bleibt erhalten, während die Fußnote ihr ungefähres modernes Gewicht erklärt.
theological_decisions:
- issue: Bezug von αὐτόν im identifizierenden Relativsatz
  choice: „Jesus“ als ausdrücklicher Bezug
  alternative: „ihm“
  rationale: Der johanneische Erzählzusammenhang verweist eindeutig auf den nächtlichen Besuch des Nikodemus bei Jesus in Johannes 3,1–2. Die Wiederaufnahme des Namens vermeidet im Deutschen eine mögliche Unklarheit, ohne die Aussage theologisch zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der griechische lange Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Gedankenstriche markieren die nachgestellte Identifizierung des Nikodemus. Die antike Gewichtseinheit wird nicht durch ein modernes, potenziell missverständliches „Pfund“ ersetzt.
