  source_fidelity: 'Der Text gibt den griechischen Satzbau und die Aussage zuverlässig wieder: Der laute Ausruf, die doppelte Wiederholung, der Imperativ zur Kreuzigung, Pilatus’ deliberative Frage und die exklusive Erklärung der ἀρχιερεῖς bleiben erhalten. Die kontextuell ergänzte Wendung „Weg mit ihm!“ ist idiomatisch und verändert den Sinn nicht.'
