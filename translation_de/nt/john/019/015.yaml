source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: de
  text: 'Da schrien sie: „Weg mit ihm! Weg mit ihm! Kreuzige ihn!“ Pilatus sagte zu ihnen: „Euren König soll ich kreuzigen?“ Die führenden Priester antworteten: „Wir haben keinen König außer dem Kaiser.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Da schrien sie
  rationale: κραυγάζω bezeichnet einen lauten Ruf; „schrien“ gibt die Heftigkeit natürlich wieder. οὖν wird hier als folgernd-erzählendes „Da“ wiedergegeben. Das betonte ἐκεῖνοι lässt sich im Deutschen kontextgemäß mit „sie“ ausdrücken.
- source_word: Ἆρον ἆρον
  choice: Weg mit ihm! Weg mit ihm!
  rationale: Der wiederholte Imperativ von αἴρω ist hier der eindringliche Ruf, Jesus zu beseitigen bzw. fortzuschaffen. „Weg mit ihm!“ ist im Deutschen idiomatisch und bewahrt die Wiederholung; „ihm“ wird aus dem Kontext ergänzt.
- source_word: σταύρωσον αὐτόν
  choice: Kreuzige ihn!
  rationale: σταυρόω bezeichnet im römischen Hinrichtungskontext die Kreuzigung; die Imperativform und das Pronomen werden direkt wiedergegeben.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Pilatus sagte zu ihnen
  rationale: Das griechische historische Präsens wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Euren König soll ich kreuzigen?
  rationale: Die Voranstellung von „euren König“ erhält die pointierte, rhetorische Hervorhebung. „Soll ich“ bildet den deliberativen Konjunktiv natürlich ab.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der hohen Priesterschaft, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ ist verständlich und sachlich präzise.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Wir haben keinen König außer dem Kaiser
  rationale: εἰ μὴ drückt eine ausschließende Ausnahme aus. „Außer dem Kaiser“ bewahrt die Schärfe der Erklärung, ohne weitergehende theologische Folgerungen in den Text einzutragen.
theological_decisions:
- issue: Politische und theologische Spannung in der Erklärung der führenden Priester
  choice: Wir haben keinen König außer dem Kaiser
  alternative: Wir haben keinen König als nur den Kaiser
  rationale: Die gewählte Formulierung erhält die ausschließliche Loyalitätserklärung in ihrer erzählerischen Schärfe und lässt ihre theologische Ironie bestehen, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger direkter Rede. Die Wiederholung des Zurufs bleibt erhalten; Pilatus’ zugespitzte Frage hebt „euren König“ hervor.
