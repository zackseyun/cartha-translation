id: JHN.19.28
reference: John 19:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: de
  text: 'Danach sagte Jesus im Wissen, dass bereits alles vollendet war, damit die Schrift erfüllt würde: »Ich habe Durst.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »Mich dürstet.«'
    reason: Bewahrt die geläufige, formellere deutsche Wiedergabe von Διψῶ.
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Danach
  rationale: Eine natürliche zeitliche Überleitung, die den singularischen Rückverweis τοῦτο angemessen wiedergibt.
- source_word: εἰδὼς
  choice: im Wissen
  rationale: Gibt das begleitende Partizip wieder, ohne eine im Griechischen nicht ausdrücklich bezeichnete kausale Beziehung einzuführen.
- source_word: ἤδη πάντα τετέλεσται
  choice: dass bereits alles vollendet war
  rationale: Das Perfekt bezeichnet einen erreichten Zustand; »bereits« entspricht ἤδη und »alles« gibt πάντα ausdrücklich wieder.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: damit die Schrift erfüllt würde
  rationale: »Damit« wahrt den Zweck- beziehungsweise Ergebnisbezug von ἵνα. Bei der Schrift ist »erfüllt werden« im Deutschen idiomatisch, während »vollendet war« zuvor die begriffliche Nähe der beiden griechischen Verben noch erkennen lässt.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählstil in der Vergangenheit wiedergegeben.
- source_word: Διψῶ
  choice: Ich habe Durst
  rationale: Eine klare, gegenwärtige und natürliche Wiedergabe des Präsens; die traditionelle Formulierung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Verhältnis zwischen Jesu Wissen, der Vollendung von allem und der Erfüllung der Schrift
  choice: Jesus weiß, dass bereits alles vollendet ist, und spricht dann, damit die Schrift erfüllt wird.
  alternative: 'ἵνα kann neben einer deutlichen Zweckangabe auch den eintretenden Erfolg hervorheben: Durch Jesu Wort kommt die Schrift zur Erfüllung.'
  rationale: Die Übersetzung bewahrt den syntaktischen Zusammenhang und legt weder eine weitergehende Lehre über Vorherwissen oder Vorherbestimmung fest noch löst sie die Spannung zwischen dem bereits Vollendeten und der noch zu erfüllenden Schrift auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ich habe Durst« ist allgemein verständlich; die traditionelle Form steht als Alternative in der Fußnote. Der Satzbau bleibt nah am griechischen Zusammenhang, ohne im Deutschen unnötig schwerfällig zu wirken.
