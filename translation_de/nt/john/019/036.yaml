id: JHN.19.36
reference: John 19:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: de
  text: 'Denn dies geschah, damit die Schrift erfüllt würde: »Keiner seiner Knochen wird zerbrochen werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ein Knochen von ihm wird nicht zerbrochen werden.« Der griechische Singular wird im Deutschen sinngemäß mit »keiner seiner Knochen« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: geschah
  rationale: Der Aorist von γίνομαι bezeichnet hier die zuvor berichteten Ereignisse; »geschah« ist knapp, natürlich und dem erzählerischen Zusammenhang angemessen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorhergehende Aussage und wird durch den vorangestellten deutschen Erklärungskonnektor »Denn« treffend wiedergegeben.
- source_word: ταῦτα
  choice: dies
  rationale: Das neutrale Pluralpronomen verweist zusammenfassend auf die unmittelbar zuvor geschilderten Vorgänge. Im Deutschen ist der kollektive Singular »dies« natürlicher als »diese Dinge«.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« bewahrt die Zweck- beziehungsweise Erfüllungsbeziehung der ἵνα-Konstruktion, ohne sie einseitig nur als Folge zu deuten.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: γραφή bezeichnet hier die heilige Schrift beziehungsweise eine konkrete Schriftstelle; »die Schrift« erhält den etablierten johanneischen Sprachgebrauch.
- source_word: πληρωθῇ
  choice: erfüllt würde
  rationale: Der passive Konjunktiv nach ἵνα wird im Deutschen mit »damit … erfüllt würde« wiedergegeben; so bleiben Passiv und Zweckbezug erhalten.
- source_word: Ὀστοῦν
  choice: Keiner seiner Knochen
  rationale: Der griechische Singular »Knochen« hat in der Schriftzitierung distributiv-kollektiven Sinn. Die deutsche Formulierung »keiner seiner Knochen« gibt diesen Sinn idiomatisch wieder.
- source_word: οὐ συντριβήσεται
  choice: wird zerbrochen werden
  rationale: Das Futur Passiv von συντρίβω bezeichnet im Zusammenhang das Brechen eines Knochens. »Zerbrochen werden« bewahrt Zeitform, Passiv und die alttestamentliche Anspielung.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Der Genitiv des Personalpronomens wird natürlich als Possessivpronomen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Schriftzitats und seiner Anspielung auf Exodus 12,46; Numeri 9,12 und Psalm 34,21
  choice: Keiner seiner Knochen wird zerbrochen werden
  alternative: Ein Knochen von ihm wird nicht zerbrochen werden
  rationale: Der griechische Singular kann distributiv verstanden werden. Die gewählte deutsche Form ist idiomatisch, bewahrt die Aussage, dass kein Knochen gebrochen wird, und legt nicht fest, welche der möglichen alttestamentlichen Bezugstellen allein gemeint ist.
- issue: Verhältnis von göttlicher Absicht und eingetretener Folge in der ἵνα-Konstruktion
  choice: damit die Schrift erfüllt würde
  alternative: sodass die Schrift erfüllt wurde
  rationale: »Damit« erhält den im Griechischen angelegten Zweckbezug, ohne die Spannung zwischen Absicht und Erfüllungsfolge aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Begründungs- und Erfüllungsgefüge; das Schriftzitat wird zugleich idiomatisch formuliert.
