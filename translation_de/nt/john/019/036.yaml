  source_fidelity: Der Text gibt ἐγένετο γὰρ ταῦτα sachgerecht als „Denn dies geschah“ wieder und bewahrt mit „damit die Schrift erfüllt würde“ sowohl den Begründungszusammenhang als auch die finale ἵνα-Konstruktion mit passivischer Erfüllung. Das Zitat gibt die Aussage des griechischen Singulars ὀστοῦν in idiomatischem kollektivem Deutsch korrekt wieder; das futurische Passiv „wird zerbrochen werden“ entspricht συντριβήσεται.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Keiner seiner Knochen“ ist eine etablierte und natürliche distributive Formulierung; die Satzfügung ist klar.
  terminology: „Die Schrift“ ist für ἡ γραφή im johanneischen Kontext angemessen. „Erfüllt“ und „zerbrochen“ treffen die traditions- und kontextgerechte Bedeutung, ohne eine bestimmte alttestamentliche Bezugstelle oder theologische Deutung festzulegen. Die Fußnote erläutert den Unterschied zwischen griechischem Singular und deutscher idiomatischer Wiedergabe angemessen.
