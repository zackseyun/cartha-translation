  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: de
  text: Als Pilatus diese Aussage hörte, bekam er noch mehr Angst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Als
  rationale: Ὅτε leitet den Zeitpunkt von Pilatus’ Reaktion ein. Das schwache erzählerische οὖν wird im Deutschen durch den natürlichen Fortgang des Satzes mitgetragen; ein ausdrückliches »da« oder »daraufhin« ist nicht nötig.
- source_word: ἤκουσεν
  choice: hörte
  rationale: ἀκούω bezeichnet hier das Wahrnehmen der unmittelbar zuvor geäußerten Aussage.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Der griechische Artikel vor dem Eigennamen wird im heutigen Standarddeutsch nicht wiedergegeben.
- source_word: τοῦτον τὸν λόγον
  choice: das
  rationale: Das Demonstrativpronomen nimmt im Deutschen natürlich die unmittelbar zuvor genannte Aussage auf. Dadurch bleibt der Bezug klar, ohne λόγος unidiomatisch als »Wort« wiederzugeben.
- source_word: μᾶλλον ἐφοβήθη
  choice: bekam er noch mehr Angst
  rationale: μᾶλλον kennzeichnet eine Steigerung bereits vorhandener Furcht. Die Formulierung gibt die ereignishafte Zunahme der Angst natürlich und verständlich wieder.
theological_decisions:
- issue: Grund und Art von Pilatus’ Angst
  choice: Die zunehmende Angst wird ohne nähere Deutung wiedergegeben.
  alternative: Die Angst ausdrücklich als politisch, abergläubisch oder durch den möglichen göttlichen Anspruch Jesu verursacht bestimmen.
  rationale: Der griechische Text nennt nur die Steigerung von Pilatus’ Angst, nicht deren genaue Ursache oder Art. Diese erzählerische und theologische Spannung bleibt daher offen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die pronominale Wiedergabe »das« vermeidet eine schwerfällige Wiederholung und verweist eindeutig auf die vorausgehende Aussage.
