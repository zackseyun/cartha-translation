  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: de
  text: Daraufhin lieferte er ihn ihnen aus, damit er gekreuzigt würde.[a] Sie nahmen Jesus mit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „um ihn kreuzigen zu lassen“. Die griechische Konstruktion bezeichnet Zweck oder beabsichtigtes Ergebnis.'
    reason: lexical_alternative
  - marker: b
    text: Wen „ihnen“ und „sie“ genau bezeichnet, wird in diesem Vers nicht ausdrücklich gesagt; der Zusammenhang gibt darüber Aufschluss.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Da … also
  rationale: Die Verbindung markiert die aus dem vorherigen Geschehen folgende Handlung. Im Deutschen wird sie natürlich über „Da“ im ersten Satz und „also“ im anschließenden Satz wiedergegeben, ohne die Partikeln schwerfällig zu verdoppeln.
- source_word: παρέδωκεν
  choice: lieferte … aus
  rationale: „Ausliefern“ bewahrt den Sinn der Übergabe in die Verfügungsgewalt anderer und passt zum gerichtlichen Kontext.
- source_word: αὐτὸν αὐτοῖς
  choice: ihn ihnen
  rationale: Die Pronomen werden entsprechend dem Griechischen beibehalten; die Empfänger werden in diesem Vers nicht ausdrücklich benannt.
- source_word: ἵνα σταυρωθῇ
  choice: damit er gekreuzigt würde
  rationale: Die Formulierung bewahrt den Zweck- beziehungsweise Zielcharakter von ἵνα sowie das Passiv.
- source_word: Παρέλαβον
  choice: Sie übernahmen
  rationale: Hier bezeichnet παραλαμβάνω die Übernahme Jesu in die eigene Gewalt beziehungsweise Obhut; „übernahmen“ stellt zudem den Bezug zur vorausgehenden Auslieferung her.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Übliche deutsche Form des Namens.
theological_decisions:
- issue: Bezug von αὐτοῖς und des unausgesprochenen Subjekts von Παρέλαβον
  choice: Die unbestimmten Pronomen „ihnen“ und „sie“ bleiben im Haupttext erhalten.
  alternative: Die Empfänger ausdrücklich als führende Juden, Tempelwachen oder römische Soldaten identifizieren.
  rationale: Der griechische Vers benennt die betreffende Gruppe nicht ausdrücklich. Eine Konkretisierung würde die im Text bestehende referenzielle Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausliefern“ und „übernehmen“ bilden den gerichtlichen Übergabevorgang klar ab; die nicht ausdrücklich identifizierten Beteiligten bleiben unbestimmt.
