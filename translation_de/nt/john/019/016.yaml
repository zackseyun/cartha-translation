review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt παρέδωκεν („lieferte ... aus“), die unbenannten Bezüge von αὐτῷ/αὐτοῖς und die passive Zweckkonstruktion ἵνα σταυρωθῇ zutreffend wieder. Das zweite οὖν kann im Deutschen idiomatisch schwach bleiben. Für Παρέλαβον ist „übernahmen“ zwar möglich, klingt hier jedoch verwaltungssprachlich und legt stärker eine formelle Gewahrsamsübernahme nahe als der griechische Erzählfluss verlangt.
  naturalness: „Sie übernahmen Jesus also“ ist im modernen Standarddeutsch unnatürlich, insbesondere wegen der Stellung von „also“. „Sie nahmen Jesus mit“ ist idiomatisch, narrativ passend und wahrt die Offenheit hinsichtlich der handelnden Gruppe.
  terminology: „ausliefern“ ist im gerichtlichen Zusammenhang angemessen. „gekreuzigt würde“ erhält Passiv und Zweckbezug ohne eine Gruppe als Ausführende einzutragen. Der Name „Jesus“ entspricht dem üblichen deutschen Gebrauch.
  issues:
