- from: Da lieferte er ihn ihnen aus, damit er gekreuzigt würde.[a] Sie übernahmen Jesus also.[b]
  to: Daraufhin lieferte er ihn ihnen aus, damit er gekreuzigt würde.[a] Sie nahmen Jesus mit.[b]
  rationale: Die erste Satzverbindung wird mit „Daraufhin“ flüssig wiedergegeben. Die zweite Handlung wird mit „nahmen Jesus mit“ natürlich und quellentreu formuliert. Die im Griechischen nicht ausdrücklich benannten Beteiligten bleiben sowohl im Text als auch in der Anmerkung offen.
  reviewer_model: gpt-5.6-terra
