translation:
  language: de
  text: 'Pilatus antwortete: »Was ich geschrieben habe, habe ich geschrieben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Was ich schrieb, schrieb ich.« Im Griechischen steht zweimal das Perfekt; es kann die bleibende Gültigkeit und Endgültigkeit dessen hervorheben, was Pilatus geschrieben hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Der Aorist des deponentischen ἀποκρίνομαι bezeichnet hier im erzählenden Dialog natürlich »antwortete«.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Der griechische Artikel entspricht dem üblichen Erzählstil und wird im Deutschen beim Eigennamen nicht wiedergegeben.
- source_word: Ὃ
  choice: Was
  rationale: Das substantivisch gebrauchte sächliche Relativpronomen bedeutet idiomatisch »was« bzw. »das, was«; »Was« ist knapp und natürlich.
- source_word: γέγραφα
  choice: ich geschrieben habe / habe ich geschrieben
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis. Das deutsche Perfekt und die unveränderte Wiederholung bewahren sowohl diesen Aspekt als auch die entschiedene Endgültigkeit der Aussage.
theological_decisions:
- issue: Aussagekraft des wiederholten Perfekts γέγραφα γέγραφα
  choice: »Was ich geschrieben habe, habe ich geschrieben.«
  alternative: »Was ich schrieb, schrieb ich.«
  rationale: Das deutsche Perfekt gibt den vollzogenen Vorgang mit seinem bleibenden Ergebnis wieder. Die Wiederholung lässt die entschiedene Weigerung des Pilatus erkennen, ohne eine zusätzliche Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prägnante Wiederholung des griechischen Satzes bleibt erhalten; das Perfekt klingt natürlich und vermittelt den fortbestehenden Zustand der Aufschrift.
