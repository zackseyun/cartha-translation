  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: de
  text: 'Als Jesus nun den sauren Wein[a] zu sich genommen hatte, sagte er: »Es ist vollbracht.«[b] Dann neigte er den Kopf und übergab seinen Geist.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Essig“ beziehungsweise „den Weinessig“. Das griechische Wort bezeichnet sauren Wein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Es ist vollendet“ beziehungsweise „Es ist abgeschlossen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sinngemäß: „Er tat seinen letzten Atemzug.“ Wörtlicher lautet das Griechische: „Er übergab den Geist.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Als … nun
  rationale: „Als“ gibt den zeitlichen Zusammenhang wieder; „nun“ bewahrt die folgernde und fortführende Funktion von οὖν in natürlichem Deutsch.
- source_word: ἔλαβεν
  choice: zu sich genommen hatte
  rationale: Im Zusammenhang mit dem auf einem Schwamm gereichten sauren Wein bezeichnet λαμβάνω das Annehmen beziehungsweise Trinken. Das Plusquamperfekt macht die zeitliche Abfolge vor Jesu Ausspruch deutlich.
- source_word: τὸ ὄξος
  choice: den sauren Wein
  rationale: ὄξος bezeichnet sauren Wein beziehungsweise Weinessig. „Saurer Wein“ ist im heutigen Deutsch verständlich und vermeidet die mögliche Fehlvorstellung von modernem Speiseessig.
- source_word: Τετέλεσται
  choice: Es ist vollbracht
  rationale: Die Perfektform von τελέω bezeichnet etwas, das zum Abschluss gebracht worden ist und abgeschlossen bleibt. Die Formulierung wahrt sowohl Endgültigkeit als auch Erfüllung, ohne ausdrücklich festzulegen, was vollbracht wurde.
- source_word: κλίνας τὴν κεφαλήν
  choice: neigte er den Kopf
  rationale: Die deutsche Verbfolge gibt die dem Hauptverb vorausgehende Handlung des Aoristpartizips natürlich und klar wieder.
- source_word: παρέδωκεν
  choice: übergab
  rationale: παραδίδωμι bedeutet grundsätzlich „übergeben“ oder „ausliefern“. Zusammen mit τὸ πνεῦμα bezeichnet es hier Jesu Sterben, wobei „übergab“ die auffällige und möglicherweise willentliche Nuance der griechischen Formulierung bewahrt.
- source_word: τὸ πνεῦμα
  choice: seinen Geist
  rationale: Obwohl der griechische Text den Artikel verwendet, verlangt natürliches Deutsch in dieser Wendung den Possessivartikel. „Geist“ bewahrt die Bedeutungsweite und das theologische Gewicht von πνεῦμα besser als eine rein physiologische Wiedergabe mit „Atem“.
theological_decisions:
- issue: Ob παρέδωκεν τὸ πνεῦμα lediglich als gewöhnliche Umschreibung für das Sterben oder näher am griechischen Wortlaut wiederzugeben ist.
  choice: übergab seinen Geist
  alternative: starb / tat seinen letzten Atemzug
  rationale: Die gewählte Fassung bewahrt die persönliche und geistliche Dimension der Aussage sowie die mögliche johanneische Betonung von Jesu willentlichem Handeln, ohne daraus eine weitergehende Lehre abzuleiten. Die idiomatische Deutung als Sterben wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Es ist vollbracht“ bleibt wegen seiner Genauigkeit, Prägnanz und vertrauten Feierlichkeit erhalten. Die Satzgliederung folgt dem griechischen Handlungsablauf, ohne unnatürlich wörtlich zu wirken.
