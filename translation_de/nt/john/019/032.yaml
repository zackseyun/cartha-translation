source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: de
  text: Da kamen die Soldaten und brachen dem ersten die Beine und dem anderen, der mit ihm[a] gekreuzigt worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihm“ bezieht sich im Zusammenhang wahrscheinlich auf Jesus; grammatisch ist auch ein Bezug auf den zuerst genannten Gekreuzigten möglich.
    reason: referential_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die folgerichtige Fortsetzung des Geschehens. „Da“ verbindet den Satz natürlich mit der zuvor erteilten Anweisung.
- source_word: οἱ στρατιῶται
  choice: die Soldaten
  rationale: Die übliche und im römischen Hinrichtungskontext eindeutige Bezeichnung.
- source_word: τοῦ μὲν πρώτου
  choice: dem ersten
  rationale: Der substantivierte Ausdruck bezeichnet den ersten der beiden mit Jesus Gekreuzigten. Im Deutschen ist keine Ergänzung wie „Mann“ nötig.
- source_word: κατέαξαν τὰ σκέλη
  choice: brachen … die Beine
  rationale: Gibt die konkrete Handlung klar und idiomatisch wieder; das Dativgefüge bezeichnet, wessen Beine gebrochen wurden.
- source_word: καὶ τοῦ ἄλλου
  choice: und ebenso dem anderen
  rationale: Nimmt Verb und Objekt sinngemäß aus dem ersten Satzteil auf und bewahrt die knappe Parallelstruktur des Griechischen in natürlichem Deutsch.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: der mit ihm gekreuzigt worden war
  rationale: Der attributive Aoristpartizipialsatz kennzeichnet den anderen als zusammen mit dem durch αὐτῷ bezeichneten Mann Gekreuzigten. Das Plusquamperfekt ordnet die Kreuzigung zeitlich vor dem Kommen der Soldaten ein.
theological_decisions:
- issue: Bezug von αὐτῷ
  choice: Das Pronomen „ihm“ bleibt im Haupttext erhalten; im Zusammenhang ist Jesus der wahrscheinlichste Bezug.
  alternative: Bezug auf den zuerst genannten Gekreuzigten
  rationale: Jesus ist die zentrale Bezugsperson der Kreuzigungsszene, doch die griechische Pronomenform benennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Offenheit, statt den Namen in den Text einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dativkonstruktion „jemandem die Beine brechen“ ist idiomatisch; „ebenso“ macht die griechische Ellipse verständlich, ohne unnötig Wörter zu wiederholen.
