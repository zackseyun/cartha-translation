reference: John 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: de
  text: 'Da sagten die führenden Priester der Juden zu Pilatus[a]: »Schreib nicht: ›Der König der Juden‹, sondern: ›Jener sagte: „Ich bin König der Juden.“‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Judäer« beziehungsweise »König der Judäer«. Das griechische Wort kann je nach Zusammenhang Juden allgemein oder insbesondere Menschen aus Judäa bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt schildert die Äußerung im fortlaufenden Erzählgeschehen. Im natürlichen Deutschen ist das Präteritum hier idiomatischer als eine Verlaufsumschreibung; ein wiederholtes Drängen ist möglich, aber nicht zwingend.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die erzählerische Folgerung beziehungsweise Fortführung und klingt im modernen deutschen Kontext natürlich.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Bezeichnet die leitenden priesterlichen Autoritäten; diese Wiedergabe vermeidet das Missverständnis, mehrere Personen hätten gleichzeitig das Amt des einen Hohenpriesters inne.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Bewahrt sowohl bei den Priestern als auch in der Inschrift die geläufige politisch-religiöse Bezeichnung. Die mögliche engere Bedeutung »Judäer« wird in einer Fußnote offengelegt.
- source_word: Μὴ γράφε
  choice: Schreib nicht
  rationale: Gibt das Verbot direkt und idiomatisch wieder; der griechische Präsensimperativ verlangt hier nicht zwingend die Deutung »Hör auf zu schreiben«.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Der König der Juden
  rationale: Bewahrt den bestimmten Artikel und den genauen Wortlaut der beanstandeten Inschrift.
- source_word: ἀλλ’ ὅτι
  choice: sondern, dass
  rationale: Leitet den von den Priestern verlangten Ersatzwortlaut ein und bildet die griechische Konstruktion eng ab.
- source_word: ἐκεῖνος
  choice: er
  rationale: Im Deutschen ist das Personalpronomen in dieser indirekten Einleitung natürlich. Das demonstrative griechische Pronomen kann distanzierend wirken, doch »jener« oder »der da« würde den Ton stärker festlegen als nötig.
- source_word: εἶπεν
  choice: gesagt hat
  rationale: Gibt das schlichte Verbum des Sagens ohne die zusätzliche Wertung von »behauptet« wieder.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Ich bin König der Juden
  rationale: Der artikellose prädikative Titel lässt sich im Deutschen natürlich ohne bestimmten Artikel wiedergeben und unterscheidet sich so auch hörbar vom Wortlaut der Inschrift.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖος/Ἰουδαίων im johanneischen Passionsbericht
  choice: Juden
  alternative: Judäer
  rationale: Im unmittelbaren Zusammenhang steht die feste öffentliche Bezeichnung »König der Juden«. »Juden« bewahrt diesen erkennbaren Titel; da das griechische Wort kontextabhängig auch geografisch »Judäer« bedeuten kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
- issue: Bestimmtheit des Titels in Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Ich bin König der Juden
  alternative: Ich bin der König der Juden
  rationale: Vor βασιλεύς steht in diesem Satz kein Artikel. Auch wenn ein artikelloses Prädikatsnomen semantisch bestimmt sein kann, bewahrt die artikellose deutsche Fassung die formale Spannung zur Inschrift, ohne den Sinn dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Syntax. »Führende Priester« ist für heutige Leser klarer als das missverständliche pluralische »Hohepriester«. Die verschachtelte Rede wird durch deutsche Anführungszeichen transparent gegliedert.
