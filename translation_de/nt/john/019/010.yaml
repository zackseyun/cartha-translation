  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: de
  text: 'Da sagte Pilatus zu ihm: „Sprichst du nicht mit mir? Weißt du nicht, dass ich die Vollmacht[a] habe, dich freizulassen, und die Vollmacht habe, dich zu kreuzigen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Macht; das griechische Wort exousia kann Vollmacht, Befugnis, Recht oder Macht bezeichnen. Hier spricht der rechtlich-hoheitliche Zusammenhang für „Vollmacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Da sagte
  rationale: οὖν führt hier die Erzählung folgernd beziehungsweise fortschreitend weiter. „Da“ ist im modernen deutschen Erzählstil natürlich und wahrt diesen Zusammenhang.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten und wird ausdrücklich wiedergegeben.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Sprichst du nicht mit mir?
  rationale: Das vorangestellte Ἐμοί betont Pilatus als Gesprächspartner. „Mit mir“ gibt im Deutschen sowohl den Adressatenbezug als auch den gekränkten, vorwurfsvollen Ton wieder.
- source_word: οὐκ οἶδας
  choice: Weißt du nicht
  rationale: Die direkte Wiedergabe mit „wissen“ ist klar, idiomatisch und bewahrt die rhetorische Frage.
- source_word: ἐξουσίαν ἔχω
  choice: ich habe die Vollmacht
  rationale: ἐξουσία bezeichnet hier im rechtlich-hoheitlichen Zusammenhang eine Befugnis oder Amtsgewalt, nicht lediglich physische Macht. „Vollmacht“ lässt zugleich offen, woher diese Befugnis letztlich stammt.
- source_word: ἀπολῦσαί σε
  choice: dich freizulassen
  rationale: ἀπολύω bedeutet in diesem gerichtlichen Zusammenhang freilassen; die Formulierung legt nicht zusätzlich einen Freispruch nahe.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: und die Vollmacht habe, dich zu kreuzigen
  rationale: Die Wiederholung von ἐξουσίαν ἔχω wird beibehalten, weil sie Pilatus’ rhetorische Gegenüberstellung der beiden möglichen Entscheidungen hervorhebt.
theological_decisions:
- issue: Art der von Pilatus beanspruchten ἐξουσία
  choice: „Vollmacht“ als berichtete hoheitliche Befugnis, ohne den Anspruch als uneingeschränkt oder letztgültig zu bestätigen
  alternative: „Macht“ oder „Recht“
  rationale: Der Vers gibt Pilatus’ Behauptung wieder; er bestätigt weder ihre moralische Rechtmäßigkeit noch eine von Gott unabhängige Souveränität. So bleibt die Spannung zur Antwort Jesu im folgenden Vers erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen und die Wiederholung von Pilatus’ beanspruchter Vollmacht bleiben erhalten.
