id: JHN.19.20
reference: John 19:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: de
  text: Daher lasen viele der Juden diese Aufschrift, denn der Ort, an dem Jesus gekreuzigt wurde, lag nahe bei der Stadt. Die Aufschrift war auf Hebräisch[a], Lateinisch und Griechisch geschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist „Aramäisch“ gemeint; Johannes bezeichnet die örtliche semitische Sprache als „Hebräisch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: Aufschrift
  rationale: Im Zusammenhang der Kreuzigung bezeichnet τίτλος die angebrachte schriftliche Bekanntmachung. „Aufschrift“ ist im Deutschen natürlich und genauer als „Titel“.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: viele von den Juden
  rationale: Diese Wiedergabe bewahrt den partitiven Sinn der Genitivkonstruktion und vermeidet, die Aussage pauschal auf alle Juden zu beziehen.
- source_word: ἀνέγνωσαν
  choice: lasen
  rationale: Der Aorist bezeichnet hier schlicht den Vorgang des Lesens; ein lautes Vorlesen wird im griechischen Text nicht ausdrücklich angezeigt.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: der Ort ... lag nahe bei der Stadt
  rationale: Dies gibt den räumlichen Bezug klar und idiomatisch wieder, ohne etwa ein Stadttor hinzuzufügen.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: an dem Jesus gekreuzigt wurde
  rationale: Die Passivform wird natürlich als deutsches Passiv wiedergegeben; ein handelndes Subjekt wird nicht ergänzt.
- source_word: ἦν γεγραμμένον
  choice: sie war ... geschrieben
  rationale: Die Konstruktion aus Imperfekt und Perfektpartizip beschreibt den bestehenden Zustand der Aufschrift als geschrieben.
- source_word: Ἑβραϊστί
  choice: auf Hebräisch
  rationale: Die Hauptübersetzung folgt der ausdrücklichen griechischen Bezeichnung; die mögliche Bezugnahme auf Aramäisch wird in einer Fußnote bewahrt.
- source_word: Ῥωμαϊστί
  choice: auf Lateinisch
  rationale: Wörtlich bezeichnet das Adverb „auf Römisch“, meint hier jedoch idiomatisch die lateinische Sprache.
- source_word: Ἑλληνιστί
  choice: auf Griechisch
  rationale: Direkte und im Deutschen übliche Wiedergabe der Sprachbezeichnung.
- source_word: οὖν
  choice: Daher
  rationale: „Daher“ macht die folgernde Verbindung zum vorherigen Vers deutlich und klingt zugleich natürlich.
theological_decisions:
- issue: Wiedergabe von Ἑβραϊστί im johanneischen Sprachgebrauch
  choice: Hebräisch im Haupttext
  alternative: Aramäisch
  rationale: Der griechische Text sagt ausdrücklich „Hebräisch“. Da der Ausdruck im damaligen Sprachgebrauch jedoch die örtliche semitische Sprache und damit möglicherweise Aramäisch bezeichnen kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit in zwei Sätze gegliedert. Das feminine Pronomen „Sie“ nimmt eindeutig „Aufschrift“ auf; die drei Sprachen bleiben in der Reihenfolge des griechischen Textes.
