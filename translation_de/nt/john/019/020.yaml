review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Sinn des griechischen Textes insgesamt zuverlässig wieder: τίτλος ist angemessen als „Aufschrift“ wiedergegeben, die Kreuzigung steht korrekt im Passiv, und die Ortsangabe wird ohne Zusatzinformationen übersetzt. Die Reihenfolge der drei Sprachangaben entspricht dem Ausgangstext. „Hebräisch“ im Haupttext mit einem Hinweis auf die mögliche gemeinte aramäische Ortssprache bewahrt die griechische Formulierung und die sachliche Unsicherheit.'
  naturalness: „Viele von den Juden“ ist im modernen Standarddeutsch deutlich weniger idiomatisch als „Viele der Juden“. Außerdem kann das Pronomen „Sie“ nach „der Stadt“ beim flüchtigen Lesen auf „Stadt“ bezogen werden; die Wiederaufnahme mit „Die Aufschrift“ ist klarer und stilistisch besser.
  terminology: „Aufschrift“, „gekreuzigt“, „Hebräisch“, „Lateinisch“ und „Griechisch“ sind treffend, verständlich und im angemessen würdevollen Register gehalten. Die Fußnote ist sachlich formuliert und wahrt die sprachgeschichtliche Möglichkeit, ohne sie zur Hauptlesart zu machen.
  issues:
  - severity: low
    issue: 'Unidiomatische partitive Formulierung: „viele von den Juden“'
    rationale: Die Genitivform „Viele der Juden“ bewahrt den partitiven Bezug von πολλοὶ ... τῶν Ἰουδαίων und ist im heutigen Standarddeutsch wesentlich natürlicher.
  - severity: low
    issue: Potentiell missverständlicher Pronomenbezug in „Sie war ... geschrieben“
    rationale: Wegen des unmittelbar vorausgehenden femininen Nomens „Stadt“ ist „Sie“ nicht völlig eindeutig. Die explizite Wiederholung „Die Aufschrift“ stellt den Bezug ohne Bedeutungsänderung klar.
