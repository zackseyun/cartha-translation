revisions:
- from: Daher lasen viele von den Juden diese Aufschrift, denn der Ort, an dem Jesus gekreuzigt wurde, lag nahe bei der Stadt. Sie war auf Hebräisch[a], Lateinisch und Griechisch geschrieben.
  to: Daher lasen viele der Juden diese Aufschrift, denn der Ort, an dem Jesus gekreuzigt wurde, lag nahe bei der Stadt. Die Aufschrift war auf Hebräisch[a], Lateinisch und Griechisch geschrieben.
  rationale: 'Die Revision beschränkt sich auf zwei sprachliche Klarstellungen: „viele der Juden“ ist die natürliche deutsche partitive Formulierung, und die ausdrückliche Wiederaufnahme von „die Aufschrift“ beseitigt einen möglichen Pronomenbezug auf „Stadt“. Sinn, Register, sprachliche Reihenfolge und Fußnoteninhalt bleiben erhalten.'
