source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: de
  text: Und ich habe noch andere Schafe, die nicht aus dieser Schafhürde stammen. Auch sie muss ich herführen, und sie werden auf meine Stimme hören.[a] Dann wird es eine Herde und einen Hirten geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Sie werden meine Stimme hören.“ Das griechische Verb kann sowohl „hören“ als auch „auf jemanden hören“ bedeuten; im Zusammenhang ist wahrscheinlich ein Hören mit entsprechender Reaktion gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen stehen hier verschiedene Wörter: zuerst „Schafhürde“ (αὐλή), also ein umschlossener Ort, dann „Herde“ (ποίμνη), also die Gemeinschaft der Schafe. Die Schlussformel lautet daher „eine Herde, ein Hirte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: noch andere Schafe
  rationale: πρόβατα bezeichnet Schafe, nicht eigens Lämmer; ἄλλα meint weitere Schafe neben den bereits genannten. „noch“ gibt diesen ergänzenden Sinn im Deutschen natürlich wieder.
- source_word: αὐλή
  choice: Schafhof
  rationale: Im Hirtenbild bezeichnet αὐλή den umschlossenen Aufenthaltsort der Schafe. „Schafhof“ ist verständlich und hält den Ort deutlich von der später genannten Herde als Tiergemeinschaft auseinander.
- source_word: κἀκεῖνα
  choice: Auch sie
  rationale: Das Pronomen verweist auf die anderen Schafe zurück; „Auch sie“ ist im Deutschen natürlich und bewahrt den einschließenden Zusatz.
- source_word: δεῖ με ἀγαγεῖν
  choice: muss ich herführen
  rationale: δεῖ drückt Notwendigkeit aus. „muss“ bewahrt diese Stärke, ohne ihren theologischen Grund näher festzulegen; „herführen“ passt zu ἄγω und zum Hirtenbild.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: sie werden auf meine Stimme hören
  rationale: ἀκούω kann sowohl das Hören als auch das hörende Befolgen bezeichnen. Die deutsche Wendung „auf meine Stimme hören“ lässt beide Aspekte anklingen und entspricht dem johanneischen Hirtenbild.
- source_word: γενήσονται μία ποίμνη
  choice: Dann wird es eine Herde geben
  rationale: γενήσονται bezeichnet das künftige Entstehen beziehungsweise Bestehen. Die unpersönliche deutsche Formulierung gibt den Ergebnissinn natürlich wieder; „Herde“ bezeichnet ποίμνη als Gemeinschaft der Schafe.
- source_word: εἷς ποιμήν
  choice: einen Hirten
  rationale: ποιμήν bedeutet wörtlich „Hirte“. Die parallele Formulierung „eine Herde und einen Hirten“ bewahrt die pointierte Einheit des Schlusses.
theological_decisions:
- issue: Unterscheidung zwischen αὐλή und ποίμνη
  choice: diesem Schafhof … eine Herde
  alternative: dieser Hürde … eine Hürde
  rationale: 'Der griechische Text verwendet zwei verschiedene Wörter: αὐλή für den umschlossenen Ort und ποίμνη für die Schafgemeinschaft. Die Übersetzung wahrt diesen Unterschied und legt die eine Herde nicht als einen einzigen institutionellen Einschluss aus.'
- issue: Stärke von δεῖ
  choice: muss ich herführen
  alternative: soll ich herführen / ist es für mich nötig, herzuführen
  rationale: „muss“ bewahrt die im Johannesevangelium häufig gewichtige Notwendigkeit, ohne zu bestimmen, worin diese Notwendigkeit theologisch begründet ist.
- issue: Bedeutungsumfang von ἀκούω
  choice: auf meine Stimme hören
  alternative: meine Stimme hören
  rationale: Die gewählte Wendung kann sowohl Wahrnehmung als auch bereitwillige Reaktion ausdrücken, ohne das im Griechischen vorhandene Bedeutungsspektrum auf bloßes akustisches Hören oder ausdrücklich auf Gehorsam zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Hirtenmetaphorik. „Schafhof“ ist allgemein verständlich und wahrt den sachlichen Gegensatz zu „Herde“. Die markante Schlussformel bleibt knapp und einprägsam.
