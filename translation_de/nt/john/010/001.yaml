source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wer nicht durch die Tür[a] in die Schafhürde[b] hineingeht, sondern anderswo hinaufsteigt, der ist ein Dieb und ein Räuber.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Tor“. Das griechische Wort kann je nach Zusammenhang „Tür“ oder „Tor“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Schafpferch“ oder „in den Hof der Schafe“. Das griechische Wort bezeichnet einen umschlossenen Hof oder ein Gehege.'
    reason: lexical_alternative
  - marker: c
    text: Das Griechische unterscheidet zwischen einem „Dieb“ (κλέπτης) und einem „Räuber“ (λῃστής); das zweite Wort kann stärker an offenen oder gewaltsamen Raub denken lassen.
    reason: lexical_distinction
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die im Johannesevangelium charakteristische, feierliche Doppelung bleibt erhalten. „Amen“ ist im modernen deutschen Bibelregister verständlich und bewahrt die Form des griechischen Ausdrucks besser als eine bloße Umschreibung.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Entspricht der direkten und feierlichen Redeformel des Griechischen.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: Wer nicht … hineingeht
  rationale: Gibt das substantivierte Partizip als natürliche generische Einzahl wieder, ohne den Satz unnötig schwerfällig zu machen.
- source_word: διὰ τῆς θύρας
  choice: durch die Tür
  rationale: „Tür“ ist die unmittelbare Entsprechung von θύρα; im Kontext ist auch „Tor“ möglich und wird deshalb in einer Fußnote genannt.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: in den Schafhof
  rationale: αὐλή bezeichnet hier einen umschlossenen Hof für Schafe. „Schafhof“ bewahrt sowohl den Hofcharakter als auch das konkrete Hirtenbild.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: sondern anderswo hinaufsteigt
  rationale: „Hinaufsteigt“ erhält das Bild des Übersteigens oder Erkletterns; „anderswo“ gibt den räumlichen Sinn von ἀλλαχόθεν knapp wieder, ohne die nicht ausdrücklich genannte Mauer einzufügen.
- source_word: ἐκεῖνος
  choice: der
  rationale: Das korrelative deutsche „wer …, der …“ gibt den identifizierenden Nachdruck des Demonstrativums natürlich wieder.
- source_word: κλέπτης
  choice: Dieb
  rationale: Bezeichnet gewöhnlich jemanden, der stiehlt, und ist die etablierte deutsche Entsprechung.
- source_word: λῃστής
  choice: Räuber
  rationale: Bewahrt die Unterscheidung zu κλέπτης und kann gewaltsamen oder offenen Raub anklingen lassen.
theological_decisions:
- issue: Bildsprache von θύρα und αὐλή
  choice: Die konkrete Bildwelt mit „Tür“ und „Schafhof“ wiedergeben, ohne sie in diesem Vers allegorisch auszudeuten.
  alternative: „Tor“ und „Schafpferch“ verwenden oder die einzelnen Bildelemente ausdrücklich auf Personen beziehungsweise Heilswirklichkeiten beziehen.
  rationale: Der Vers eröffnet ein Bild, das erst im folgenden Zusammenhang erläutert wird. Die Übersetzung soll weder die spätere Erklärung vorwegnehmen noch eine bestimmte dogmatische Zuordnung ergänzen.
- issue: Generische Einzahl des substantivierten Partizips
  choice: Die Konstruktion „Wer …, der …“ verwenden.
  alternative: „Derjenige, der …“ oder „Ein Mann, der …“ verwenden.
  rationale: „Wer …, der …“ bewahrt die generische Einzahl und klingt im heutigen Deutsch natürlich; eine ausdrücklich männliche Ergänzung ist für die Aussage des griechischen Textes nicht erforderlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die feierliche Formel „Amen, amen“ bleibt bewusst stehen; der Hauptsatz folgt mit „Wer …, der …“ einem natürlichen deutschen Muster. Die Bildsprache wird konkret, aber ohne erklärende Zusätze wiedergegeben.
