  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: de
  text: Wer aber durch die Tür hineingeht, ist der Hirte der Schafe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Hirte der Schafe“. Das griechische Prädikatsnomen „Hirte“ steht ohne Artikel; der Zusammenhang spricht jedoch für die bestimmte Bedeutung, also für den rechtmäßigen Hirten im Gegensatz zu unrechtmäßigen Eindringlingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Wer aber … hineingeht
  rationale: Das substantivierte Präsenspartizip bezeichnet die Person, die auf diese Weise eintritt. „Wer … hineingeht“ ist im modernen Deutschen natürlich und bewahrt den allgemeinen Charakter; „aber“ gibt den Gegensatz zu Dieb und Räuber im vorhergehenden Vers wieder.
- source_word: διὰ τῆς θύρας
  choice: durch die Tür
  rationale: διά mit Genitiv bezeichnet hier die Bewegung durch einen Durchgang; „durch die Tür“ gibt das räumliche Bild unmittelbar wieder.
- source_word: ποιμήν
  choice: der Hirte
  rationale: 'Obwohl das griechische Prädikatsnomen keinen Artikel trägt, legt der Gegensatz zu den unrechtmäßigen Eindringlingen im Kontext die bestimmte Bedeutung nahe: Es handelt sich um den rechtmäßigen Hirten. Die formal mögliche unbestimmte Wiedergabe wird in der Fußnote genannt.'
- source_word: τῶν προβάτων
  choice: der Schafe
  rationale: Die wörtliche Wiedergabe bewahrt das konkrete Bild von πρόβατα; „der Herde“ wäre stärker deutend.
theological_decisions:
- issue: Bestimmtheit des artikellosen Prädikatsnomens ποιμήν
  choice: der Hirte
  alternative: ein Hirte
  rationale: Der unmittelbare Zusammenhang stellt den durch die Tür Eintretenden den Dieben und Räubern gegenüber. Die bestimmte Wiedergabe kennzeichnet ihn als den rechtmäßigen Hirten, ohne zusätzliche christologische Aussagen in den Vers hineinzutragen; die grammatisch mögliche unbestimmte Lesart bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstellung bleibt nah am griechischen Gegensatz und klingt dennoch idiomatisch.
