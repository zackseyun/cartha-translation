  source_fidelity: 'Die Übersetzung gibt den griechischen Satz vollständig und zutreffend wieder: Das substantivierte Partizip ὁ δὲ εἰσερχόμενος wird idiomatisch mit „Wer aber … hineingeht“ erfasst, διὰ τῆς θύρας mit „durch die Tür“ und τῶν προβάτων mit „der Schafe“. Der durch δέ markierte Gegensatz zum vorherigen Vers bleibt durch „aber“ erhalten. Die bestimmte Wiedergabe von ποιμήν ist im unmittelbaren Kontrast zu den unrechtmäßigen Eindringlingen gut begründet, ohne den Text über seine Bildsprache hinaus auszudeuten.'
