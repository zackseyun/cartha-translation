  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: de
  text: 'Doch viele von ihnen sagten: „Er hat einen Dämon und ist von Sinnen. Warum hört ihr auf ihn?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt die Äußerung innerhalb der erzählten Szene; im natürlichen deutschen Erzählstil gibt das Präteritum „sagten“ dies angemessen wieder, ohne eine im Kontext nicht zwingende Wiederholung auszudrücken.
- source_word: δὲ
  choice: Doch
  rationale: „Doch“ gibt den Kontrast zur vorausgehenden Reaktion knapp und idiomatisch wieder.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: viele von ihnen
  rationale: Die partitive Wendung wird natürlich wiedergegeben und macht deutlich, dass nur ein Teil der genannten Gruppe so sprach.
- source_word: Δαιμόνιον ἔχει
  choice: Er hat einen Dämon
  rationale: Die Formulierung folgt der transparenten Aussage des Griechischen und vermeidet die stärker deutende Wiedergabe „Er ist besessen“.
- source_word: μαίνεται
  choice: ist von Sinnen
  rationale: Die Wendung bezeichnet den Vorwurf geistiger Verwirrtheit beziehungsweise wahnsinnigen Verhaltens, klingt im Deutschen würdig und ist weniger klinisch festlegend als „ist geisteskrank“.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Warum hört ihr auf ihn?
  rationale: τί hat hier idiomatisch die Bedeutung „warum“, und ἀκούω mit Genitiv bezeichnet in diesem vorwurfsvollen Zusammenhang das Hören auf jemanden, nicht nur das akustische Wahrnehmen.
theological_decisions:
- issue: Feindseliger Vorwurf gegen Jesus
  choice: Er hat einen Dämon und ist von Sinnen
  alternative: Er ist von einem Dämon besessen und wahnsinnig
  rationale: Die Übersetzung bewahrt die doppelte Verleumdung als direkte Aussage der Gegner, ohne sie abzuschwächen oder durch eine weitergehende Lehre über Besessenheit beziehungsweise eine klinische Diagnose auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt scharf und unverhüllt; „von Sinnen“ ist geläufig, ohne unnötig klinische Terminologie einzuführen.
