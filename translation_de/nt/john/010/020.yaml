  source_fidelity: 'Die Übersetzung gibt alle Sinnelemente des griechischen Textes wieder: den kontrastiven Anschluss (δέ), die partitive Gruppe („viele von ihnen“), den Vorwurf „Er hat einen Dämon“, μαίνεται als Vorwurf geistiger Verwirrung und die idiomatische Frage „Warum hört ihr auf ihn?“. Das deutsche Präteritum „sagten“ ist im erzählenden Standarddeutsch eine angemessene Wiedergabe des Imperfekts ἔλεγον, ohne eine ungesicherte Nuance zu erzwingen.'
  naturalness: „Doch viele von ihnen sagten“ ist flüssiges modernes Standarddeutsch. Die direkte Rede klingt klar und dem feindseligen Charakter der Äußerung entsprechend. „Von Sinnen“ ist leicht gehoben, aber weiterhin geläufig und in diesem biblisch-erzählenden Register natürlich.
  terminology: „Dämon“ hält die transparente Formulierung Δαιμόνιον ἔχει bei und vermeidet die stärker interpretierende Festlegung „besessen“. „Von Sinnen“ gibt den polemischen Vorwurf von μαίνεται wieder, ohne eine moderne klinische Diagnose zu behaupten. Es sind keine Fußnoten erforderlich.
