  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: de
  text: Ich bin der gute Hirte. Ich kenne die Meinen, und die Meinen kennen mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Ich bin
  rationale: Die ausdrückliche Selbstbezeichnung wird im Deutschen direkt und natürlich wiedergegeben; zugleich bleibt der johanneische Anklang der Ich-bin-Worte erhalten.
- source_word: ὁ ποιμὴν ὁ καλός
  choice: der gute Hirte
  rationale: „Hirte“ bewahrt das konkrete Bild des Zusammenhangs, ohne spätere kirchliche Amtsvorstellungen einzutragen. „Gut“ gibt die moralische Güte und vorbildliche Qualität von καλός idiomatisch wieder.
- source_word: γινώσκω / γινώσκουσί
  choice: kenne / kennen
  rationale: „Kennen“ bezeichnet im Deutschen natürliche, persönliche und wechselseitige Vertrautheit und passt daher besser als das stärker sachbezogene „wissen“.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: die Meinen
  rationale: Die substantivierte Possessivform wahrt die knappe Ausdrucksweise des griechischen Neutrums und bezeichnet diejenigen, die zu Jesus gehören, ohne das im Vers nicht ausdrücklich stehende Wort „Schafe“ einzufügen.
- source_word: καί
  choice: und
  rationale: Die einfache Verknüpfung des griechischen Textes bleibt ohne zusätzliche Gewichtung erhalten.
theological_decisions:
- issue: Die wechselseitige Beziehung zwischen Jesus und den zu ihm Gehörenden wiedergeben, ohne spätere Lehrformulierungen einzutragen
  choice: die Meinen
  alternative: meine Schafe / die, die zu mir gehören
  rationale: „Die Meinen“ bewahrt sowohl die Zugehörigkeit als auch die persönliche Gegenseitigkeit des Kennens. Es ergänzt nicht ausdrücklich „Schafe“, das zwar aus dem Kontext naheliegt, hier aber im griechischen Wortlaut fehlt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Punkt statt eines Kommas nach „Hirte“ entspricht natürlicher deutscher Satzführung, ohne die inhaltliche Koordination zu verändern. „Die Meinen“ ist gut verständlich und bewahrt die bewusste Wiederholung des griechischen Textes.
