  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes sachgerecht wieder: die Selbstidentifikation, „der gute Hirte“, das wechselseitige προσωπale Kennen und die zweimalige, bewusst knappe Bezeichnung τὰ ἐμά als „die Meinen“. Die nicht näher spezifizierte Zugehörigkeitsbezeichnung bleibt erhalten; „meine Schafe“ wird nicht unberechtigt in den Haupttext eingetragen.'
