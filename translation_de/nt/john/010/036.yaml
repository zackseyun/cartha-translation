  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: de
  text: 'Sagt ihr zu dem, den der Vater geheiligt[a] und in die Welt gesandt hat: »Du lästerst«, weil ich gesagt habe: »Ich bin Gottes Sohn«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geweiht« oder »ausgesondert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: geheiligt
  rationale: „Geheiligt“ bewahrt die Verbindung von ἁγιάζω zur Heiligkeit und lässt zugleich die kontextuell naheliegende Bedeutung der Weihe beziehungsweise Aussonderung für einen Auftrag erkennen. Eine Fußnote nennt die natürlichen deutschen Alternativen.
- source_word: ἀπέστειλεν
  choice: gesandt hat
  rationale: Die Wiedergabe bewahrt die für das Johannesevangelium charakteristische Sendungssprache und vermeidet die stärker deutende Übersetzung „beauftragt“.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Dies ist die natürliche und theologisch offene Entsprechung des johanneischen Ausdrucks.
- source_word: Βλασφημεῖς
  choice: Du lästerst Gott
  rationale: Im modernen Deutsch bezeichnet „lästern“ allein nicht immer eindeutig Gotteslästerung. Die Ergänzung „Gott“ macht den im griechischen Verb und im Kontext enthaltenen Vorwurf idiomatisch deutlich.
- source_word: Υἱὸς τοῦ θεοῦ εἰμι
  choice: Ich bin Gottes Sohn
  rationale: „Gottes Sohn“ ist im Deutschen eine natürliche, titelhaft verständliche Wiedergabe der prädikativen Genitivkonstruktion und bewahrt ihren christologischen Gehalt.
- source_word: ὃν ὁ πατὴρ
  choice: dem, den der Vater
  rationale: Die Formulierung nimmt das von λέγετε abhängige Bezugsobjekt idiomatisch vorweg und bewahrt den Relativsatz des Griechischen.
- source_word: ὅτι ... ὅτι
  choice: 'sagt ihr ...: …, weil ich gesagt habe'
  rationale: Der erste ὅτι-Satz wird als direkte Rede mit Doppelpunkt wiedergegeben; der zweite ὅτι-Satz bezeichnet den Grund für den Vorwurf und wird deshalb mit „weil“ übersetzt.
theological_decisions:
- issue: Bedeutung von ἡγίασεν in Bezug auf den Sohn
  choice: geheiligt
  alternative: geweiht / für sich ausgesondert
  rationale: Die Hauptübersetzung wahrt die lexikalische und theologische Spannung des Ausdrucks, ohne eine moralische Verbesserung oder vorherige Unheiligkeit des Sohnes zu unterstellen. Die möglichen auftragsbezogenen Bedeutungen stehen in der Fußnote.
- issue: Christologischer Gehalt von Υἱὸς τοῦ θεοῦ
  choice: Gottes Sohn
  alternative: der Sohn Gottes
  rationale: Beide Formulierungen können im Deutschen titelhaft sein. „Gottes Sohn“ folgt der prädikativen Konstruktion natürlich und schwächt den christologischen Anspruch im Zusammenhang des Gotteslästerungsvorwurfs nicht ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt den rhetorischen Charakter der Frage; „Gott lästern“ ist für heutige Leser eindeutiger und natürlicher als das isolierte „lästern“.
