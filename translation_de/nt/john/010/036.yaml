  to: 'Sagt ihr zu dem, den der Vater geheiligt[a] und in die Welt gesandt hat: »Du lästerst«, weil ich gesagt habe: »Ich bin Gottes Sohn«?'
  rationale: Die Revision entfernt nicht im griechischen Text ausgedrückte Zusätze, strafft die deutsche Frage und präzisiert die lexikalische Alternative in der Fußnote. Der Sinn, die rhetorische Struktur und die christologisch gewichtige Selbstbezeichnung bleiben erhalten.
