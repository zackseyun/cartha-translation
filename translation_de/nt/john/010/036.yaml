review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Satzbau, Zeitformen und die johanneische Sendungssprache insgesamt treffend wieder. Die explizite Ergänzung „Gott“ bei „Du lästerst Gott“ steht jedoch nicht im griechischen Wortlaut; Βλασφημεῖς ist hier absolut gebraucht. Der Kontext macht den religiösen Charakter des Vorwurfs deutlich, rechtfertigt aber keine Ergänzung im Haupttext.
  naturalness: „Sagt ihr zu dem, den der Vater geheiligt und in die Welt gesandt hat“ ist modernes, würdevolles Standarddeutsch. Das einleitende „da“ ist entbehrlich und hat keine griechische Entsprechung. „Du lästerst“ ist innerhalb des klaren Kontextes einer Blasphemieanklage verständlich und hält den Wortlaut offen.
  terminology: „geheiligt“ bewahrt die Verbindung zu ἁγιάζω; die Fußnote sollte die idiomatischen Alternativen „geweiht“ und „ausgesondert“ nennen. „Gottes Sohn“ ist eine natürliche Wiedergabe von Υἱὸς τοῦ θεοῦ in dieser prädikativen Aussage und erhält deren Gewicht, ohne den griechischen anarthrischen Ausdruck unnötig als „der Sohn Gottes“ festzulegen.
  issues:
  - severity: medium
    issue: „Gott“ wird in der direkten Anklage ergänzt.
    rationale: Βλασφημεῖς enthält kein ausdrücklich genanntes Objekt. Die Ergänzung erklärt den Kontext, verengt aber die knappe griechische Formulierung im Haupttext. „Du lästerst“ ist hier die quellengetreuere Wiedergabe.
  - severity: low
    issue: „da“ in „sagt ihr da zu dem“ ist zusätzlich.
    rationale: Das griechische ὑμεῖς kann in der deutschen Frage durch die Stellung von „ihr“ hervorgehoben werden; „da“ trägt keinen eigenständigen Ausgangstextbefund bei.
  - severity: low
    issue: Die Fußnotenalternative „für sich ausgesondert“ ist missverständlich.
    rationale: Sie kann im Deutschen nahelegen, der Vater habe den Sohn für sich selbst ausgesondert. „Ausgesondert“ gibt die mögliche Weihe-/Beauftragungsnuance klarer wieder.
  revised_text: 'Sagt ihr zu dem, den der Vater geheiligt[a] und in die Welt gesandt hat: »Du lästerst«, weil ich gesagt habe: »Ich bin Gottes Sohn«?'
