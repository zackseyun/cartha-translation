source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: de
  text: Darum liebt mich der Vater, weil ich mein Leben hingebe[a], um es wieder zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Seele hingebe“. ψυχή bedeutet hier am natürlichsten „Leben“, nämlich das Leben, das Jesus im Tod hingibt und wieder nimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den rückwärts- beziehungsweise vorwärtsweisenden Kausalzusammenhang knapp und idiomatisch wieder.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: liebt mich der Vater
  rationale: Bewahrt den bestimmten Ausdruck „der Vater“ und die ausdrückliche Objektbeziehung, ohne ein nicht im Griechischen stehendes Possessivpronomen einzufügen.
- source_word: ὅτι
  choice: weil
  rationale: Leitet hier den Grund für die Liebe des Vaters ein.
- source_word: τίθημι τὴν ψυχήν μου
  choice: ich mein Leben hingebe
  rationale: „Das Leben hingeben“ ist im heutigen Deutsch eine natürliche Wiedergabe für die freiwillige Preisgabe des Lebens; der Kontext spricht von Jesu Tod.
- source_word: ἵνα
  choice: um
  rationale: Die Infinitivkonstruktion mit „um“ bringt die finale Bedeutung im Deutschen natürlich zum Ausdruck, ohne den Zusammenhang als bloße Zukunftsaussage wiederzugeben.
- source_word: πάλιν λάβω αὐτήν
  choice: es wieder zu nehmen
  rationale: Bewahrt die Grundbedeutung von λαμβάνω als „nehmen“ sowie den Bezug auf das zuvor hingegebene Leben; „wieder“ gibt πάλιν wieder.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang von Jesu Selbsthingabe
  choice: Leben
  alternative: Seele
  rationale: Gemeint ist hier das Leben, das Jesus im Tod hingibt und wieder nimmt. „Seele“ könnte einen Leib-Seele-Gegensatz nahelegen, den der Vers nicht in den Vordergrund stellt.
- issue: Finale Aussage von ἵνα mit λάβω
  choice: um es wieder zu nehmen
  alternative: damit ich es wieder nehme / nehmen kann
  rationale: Die deutsche Infinitivkonstruktion erhält den Zweckbezug und lässt die im Text bestehende Beziehung zwischen freiwilligem Tod und erneuter Annahme des Lebens stehen, ohne sie als bloße Vorhersage zu glätten.
- issue: Beziehung von der Liebe des Vaters zu Jesu Lebenshingabe
  choice: 'Darum ...: weil ...'
  alternative: Deshalb ... , weil ...
  rationale: Der Doppelpunkt macht die folgende Begründung klar kenntlich. Die Aussage wird nicht so umgedeutet, als beginne die Liebe des Vaters erst aufgrund der Tat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hingeben“ erfasst die freiwillige Selbsthingabe idiomatischer als das im Deutschen ungewöhnlichere „niederlegen“; „wieder nehmen“ wahrt zugleich die Wiederaufnahme von λαμβάνω im folgenden Vers.
