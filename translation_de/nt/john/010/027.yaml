  verdict: revise
  source_fidelity: 'Die Vorlage gibt drei koordinierte Präsensaussagen wieder: Die Jesus zugehörigen Schafe hören seine Stimme, er kennt sie, und sie folgen ihm. Der Entwurf trifft die Grundbedeutung, doch „auf meine Stimme hören“ kann im Deutschen stärker „auf mich hören/gehorchen“ bedeuten und damit über das hier unmarkierte ἀκούειν hinausgehen. Der Satzpunkt und das ausgelassene „und“ vor „ich kenne sie“ schwächen außerdem die durch κἀγώ und die folgende Koordination markierte Reihung ab.'
  naturalness: „Meine Schafe hören meine Stimme, und ich kenne sie, und sie folgen mir“ ist modernes, klares Standarddeutsch. Die Wiederholung von „und“ ist in diesem kurzen, parallel gebauten Ausspruch natürlich und bildet die griechische Struktur nachvollziehbar ab.
  terminology: „Schafe“, „Stimme“, „kenne“ und „folgen“ sind etablierte und präzise Entsprechungen. „Kenne“ bewahrt die relationale Offenheit von γινώσκω, ohne sie lehrmäßig zu erweitern.
  issues:
  - severity: medium
    issue: „hören auf meine Stimme“ ist semantisch stärker als die Grundbedeutung.
    rationale: Die deutsche Wendung kann ausdrücklich das Befolgen oder Gehorchen einer Aufforderung bedeuten. ἀκούειν mit Genitiv bezeichnet hier zunächst das Hören der Stimme; das anschließende „sie folgen mir“ bringt die Reaktion selbst zum Ausdruck.
  - severity: low
    issue: Die griechische koordinierende Verbindung wird durch Satztrennung und Auslassung von „und“ vor „ich kenne sie“ abgeschwächt.
    rationale: κἀγώ („und ich“) und καί verbinden die drei Aussagen. Eine fortlaufende Koordination lässt sich im Deutschen ohne Unnatürlichkeit bewahren.
  revised_text: Meine Schafe hören meine Stimme, und ich kenne sie, und sie folgen mir.
  revised_footnotes: []
