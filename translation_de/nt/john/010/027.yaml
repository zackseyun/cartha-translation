  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: de
  text: Meine Schafe hören meine Stimme, und ich kenne sie, und sie folgen mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Meine Schafe
  rationale: Die artikulierte Possessivkonstruktion bezeichnet die Schafe als Jesus zugehörig. „Meine Schafe“ ist im Deutschen natürlich und bewahrt die leichte Hervorhebung, ohne sie durch „meine eigenen Schafe“ zu verstärken.
- source_word: τῆς φωνῆς μου ἀκούουσιν
  choice: hören auf meine Stimme
  rationale: ἀκούω mit dem Genitiv kann das Hören beziehungsweise Beachten einer Stimme ausdrücken. Im Deutschen ist „auf meine Stimme hören“ in der Hirtenmetapher idiomatisch und vermittelt mehr als bloße akustische Wahrnehmung, ohne den Gehorsamsaspekt ausdrücklich auszuformulieren.
- source_word: κἀγὼ
  choice: Ich
  rationale: Die Krasis entspricht καὶ ἐγώ. Nach dem deutschen Satzabschluss wird der Zusammenhang durch die unmittelbare Fortführung gewahrt; ein zusätzliches „und“ wäre möglich, wirkt hier aber weniger natürlich.
- source_word: γινώσκω αὐτά
  choice: Ich kenne sie
  rationale: „Kennen“ gibt das relationale Wissen über Personen beziehungsweise die als Herde dargestellten Menschen im Deutschen natürlicher wieder als „wissen“ und lässt die johanneische Beziehungstiefe unausgedeutet bestehen.
- source_word: ἀκολουθοῦσίν μοι
  choice: sie folgen mir
  rationale: Der einfache Präsenssatz gibt die fortdauernde beziehungsweise kennzeichnende Handlung natürlich wieder.
theological_decisions:
- issue: Relationale Bedeutung von γινώσκω im Bild von Hirte und Schafen
  choice: „Ich kenne sie“ ohne erläuternde Erweiterung
  alternative: „Ich kenne sie persönlich“ oder „Ich erkenne sie“
  rationale: „Kennen“ bewahrt sowohl die schlichte Aussage als auch ihre mögliche relationale Tiefe. „Persönlich“ würde diese auslegen, „erkennen“ könnte sie abschwächen oder auf Identifikation verengen.
- issue: Bedeutungsumfang von ἀκούω mit Genitiv
  choice: „auf meine Stimme hören“
  alternative: „meine Stimme hören“
  rationale: Die gewählte deutsche Wendung passt zur wiederkehrenden johanneischen Darstellung, dass die Schafe die Stimme des Hirten wahrnehmen und ihr folgen. Sie macht jedoch keinen ausdrücklich formulierten Gehorsamsbegriff daraus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei Aussagen bleiben knapp und parallel. Der Punkt nach dem ersten Satz erleichtert den natürlichen deutschen Sprachfluss, ohne die logische Reihung des Griechischen aufzulösen.
