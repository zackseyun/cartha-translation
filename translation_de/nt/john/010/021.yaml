id: JHN.10.21
reference: John 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: de
  text: 'Andere aber sagten: „Diese Worte sind nicht die eines Besessenen. Kann etwa ein Dämon Blinden die Augen öffnen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Andere aber
  rationale: Bezeichnet im Gegensatz zu den zuvor Sprechenden eine andere Gruppe; „aber“ macht diesen im Zusammenhang vorhandenen Kontrast im Deutschen natürlich deutlich.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt kann andauerndes oder wiederholtes Reden bezeichnen. Im erzählenden deutschen Präteritum gibt „sagten“ dies ohne eine schwerfällige Umschreibung angemessen wieder.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Diese Worte
  rationale: Gibt die gesprochenen Äußerungen Jesu unmittelbar und idiomatisch wieder.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: sind nicht die eines Besessenen
  rationale: 'Bewahrt die elliptische Zuordnung des griechischen Genitivs: Solche Worte gehören nicht zu einem Menschen, der unter dämonischem Einfluss steht. „Besessener“ ist im Deutschen die klare, geläufige Bezeichnung, ohne eine weiter ausgearbeitete Dämonologie einzutragen.'
- source_word: μὴ
  choice: Kann etwa …?
  rationale: „Etwa“ kennzeichnet eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird.
- source_word: δαιμόνιον
  choice: ein Dämon
  rationale: Entspricht dem griechischen Ausdruck direkt; „böser Geist“ wäre stärker deutend.
- source_word: τυφλῶν ὀφθαλμοὺς ἀνοῖξαι
  choice: Blinden die Augen öffnen
  rationale: Bewahrt das konkrete Bild des Augenöffnens und klingt zugleich natürlich; der Bezug zur Heilung des Blindgeborenen bleibt erkennbar.
theological_decisions:
- issue: Wiedergabe von δαιμονίζομαι und δαιμόνιον
  choice: Besessener / Dämon
  alternative: von einem Dämon beherrschter Mensch / böser Geist
  rationale: Die gewählte Formulierung gibt die Gegenüberstellung von angeblicher dämonischer Beeinflussung und dämonischer Wirkmacht knapp wieder, ohne die Aussage abzuschwächen oder den genauen Zustand des Betroffenen dogmatisch näher zu bestimmen.
- issue: Erwartete Antwort auf die mit μή eingeleitete Frage
  choice: Kann etwa ein Dämon …?
  alternative: Ein Dämon kann doch nicht …, oder?
  rationale: Die Form mit „etwa“ erhält die grammatische Frageform und signalisiert zugleich klar, dass die Sprecher eine verneinende Antwort erwarten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Parallelität von Worten und Werk bleibt erhalten; unnötige Fachsprache und konfessionell geprägte Zusätze werden vermieden.
