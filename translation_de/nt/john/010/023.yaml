  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: de
  text: Und Jesus ging im Tempelbezirk in der Säulenhalle Salomos[a] umher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Säulengang Salomos“; das griechische Wort bezeichnet einen überdachten Gang mit Säulen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Gibt die einfache Satzverknüpfung wieder, ohne eine zusätzliche zeitliche Nuance einzuführen.
- source_word: περιεπάτει
  choice: ging … umher
  rationale: Das Imperfekt beschreibt eine andauernde Handlung in der Vergangenheit; die idiomatische deutsche Wendung bewahrt zugleich den iterativen bzw. räumlichen Gehalt von περιπατέω.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage bzw. deren öffentlich zugänglichen Bereich, nicht speziell das innere Heiligtum (ναός).
- source_word: ἐν τῇ στοᾷ
  choice: in der Säulenhalle
  rationale: στοά bezeichnet einen überdachten, von Säulen getragenen Gang; „Säulenhalle“ ist im modernen Deutsch anschaulich und architektonisch treffend.
- source_word: τοῦ Σολομῶνος
  choice: Salomos
  rationale: Der Genitiv wird in der deutschen Ortsbezeichnung natürlich als vorangestellter Genitiv wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. „Tempelbezirk“ verdeutlicht den weiteren Sinn von ἱερόν; „Säulenhalle“ vermeidet das weniger alltägliche Fremdwort „Portikus“.
