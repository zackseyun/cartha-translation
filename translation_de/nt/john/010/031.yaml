id: JHN.10.31
reference: John 10:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: de
  text: Da hoben die Juden wieder Steine auf, um ihn zu steinigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Zusammenhang möglicherweise: „die jüdischen Führer“ oder „die Judäer“. Die bei Johannes häufige Bezeichnung „die Juden“ meint oft bestimmte jüdische Gegner Jesu und nicht das jüdische Volk als Ganzes.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: hoben … auf
  rationale: βαστάζω bedeutet grundsätzlich „tragen“ oder „aufheben“. In Verbindung mit Steinen, die unmittelbar eingesetzt werden sollen, gibt „aufheben“ die konkrete Handlung natürlich und genau wieder.
- source_word: οὖν
  choice: Da
  rationale: οὖν verbindet die Reaktion folgernd mit Jesu vorausgehender Aussage. „Da“ ist im Deutschen eine natürliche narrative Verknüpfung und vermeidet ein schwerfälliges „Daher“.
- source_word: πάλιν
  choice: wieder
  rationale: πάλιν bezeichnet die Wiederholung der feindseligen Handlung und wird direkt mit „wieder“ wiedergegeben.
- source_word: λίθους
  choice: Steine
  rationale: λίθος bedeutet hier schlicht „Stein“; die beabsichtigte Verwendung wird durch den folgenden Infinitivsatz deutlich.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Formulierung entspricht dem ausdrücklichen griechischen Wortlaut. Da sie bei Johannes je nach Kontext eine begrenzte Gruppe jüdischer Gegner bezeichnen kann, wird diese mögliche Eingrenzung in einer Fußnote erläutert, ohne sie in den Haupttext hineinzulesen.
- source_word: ἵνα λιθάσωσιν
  choice: um … zu steinigen
  rationale: ἵνα mit Konjunktiv bezeichnet hier den Zweck. Die deutsche Konstruktion „um … zu“ gibt diesen Sinn knapp und idiomatisch wieder; λιθάζω wird präzise mit „steinigen“ übersetzt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus und wird unmittelbar mit „ihn“ wiedergegeben.
theological_decisions:
- issue: Referent und Umfang von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext „die Juden“, ergänzt durch eine kontextuelle Fußnote
  alternative: „die jüdischen Führer“ oder „die Judäer“
  rationale: Der Haupttext bewahrt die ausdrückliche griechische Bezeichnung und deren mögliche Bedeutungsbreite. Zugleich verhindert die Fußnote, dass die Wendung unberechtigt auf das jüdische Volk insgesamt bezogen wird; der unmittelbare Kontext kann bestimmte Gegner Jesu meinen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da … wieder“ stellt den narrativen Zusammenhang knapp her; „Steine aufheben, um jemanden zu steinigen“ bewahrt die bewusste Wiederholung des griechischen Wortfelds.
