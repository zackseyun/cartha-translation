  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: de
  text: Ich und der Vater sind eins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „eins“ steht im Neutrum. Es betont die Einheit, ohne Jesus und den Vater als ein und dieselbe Person zu bezeichnen.
    reason: Die grammatische Form ist im Deutschen nicht für alle Leser unmittelbar erkennbar und schützt die echte Spannung zwischen Einheit und personaler Unterscheidung.
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten; im Griechischen hebt es Jesus als ersten Teil des zusammengesetzten Subjekts hervor.
- source_word: καὶ
  choice: und
  rationale: Die einfache nebenordnende Konjunktion verbindet Jesus und den Vater, ohne eine zusätzliche Bedeutungsnuance einzutragen.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Der bestimmte Artikel und der johanneische Kontext weisen auf Jesu Vater als personale Bezeichnung; die Großschreibung entspricht dem deutschen Gebrauch für diese Gottesbezeichnung.
- source_word: ἕν
  choice: eins
  rationale: Das substantivisch gebrauchte Neutrum Singular wird im Deutschen idiomatisch und formal entsprechend mit „eins“ wiedergegeben. Es behauptet Einheit, ohne Jesus und den Vater als dieselbe Person zu bezeichnen.
- source_word: ἐσμεν
  choice: sind
  rationale: Die erste Person Plural Präsens von „sein“ bewahrt die grammatische Unterscheidung der beiden Subjekte innerhalb der ausgesagten Einheit.
theological_decisions:
- issue: Bedeutung des neutralen ἕν zusammen mit dem pluralischen ἐσμεν in einer christologisch bedeutsamen Aussage
  choice: „Ich und der Vater sind eins.“ – eine wirkliche Einheit wird ausgesagt, während die personale Unterscheidung grammatisch bestehen bleibt.
  alternative: „Ich und der Vater sind eine Einheit“ oder „Ich und der Vater sind eines Sinnes“.
  rationale: „Eins“ bildet die knappe Spannung des griechischen Textes am besten ab. „Eine Einheit“ wäre erklärender, „eines Sinnes“ würde die Aussage auf Übereinstimmung verengen. Weder eine spätere dogmatische Formel noch eine Abschwächung der Einheit wird in den Haupttext eingetragen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die vertraute, prägnante Formulierung folgt eng der Wortstellung und Aussagekraft des griechischen Textes.
