  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: de
  text: Wenn ich sie aber tue, dann glaubt den Werken, auch wenn ihr mir nicht glaubt[a], damit ihr erkennt und versteht[b], dass der Vater in mir ist und ich im Vater bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „auch wenn ihr nicht an mich glaubt“. Die griechische Verbindung von „glauben“ mit dem Dativ kann sowohl „jemandem glauben“ als auch „an jemanden glauben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen stehen zwei Formen derselben Wortfamilie („erkennen“), zunächst im Aorist, dann im Präsens. Die genaue Bedeutung dieses Formwechsels ist umstritten; er kann den Eintritt in Erkenntnis und deren Fortdauer hervorheben.
    reason: aspectual_nuance
lexical_decisions:
- source_word: ποιῶ
  choice: ich sie tue
  rationale: Das Präsens bezeichnet Jesu gegenwärtiges Tun; das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang als „sie“, nämlich die Werke, ergänzt.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: auch wenn ihr mir nicht glaubt
  rationale: πιστεύω mit dem Dativ ἐμοί kann bedeuten, Jesus Glauben zu schenken oder an ihn zu glauben. „Mir glaubt“ bildet hier den klarsten Gegensatz zu „den Werken glaubt“.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: glaubt den Werken
  rationale: 'Die knappe Dativkonstruktion bleibt erhalten: Die Werke legen Zeugnis ab und sollen als glaubwürdig anerkannt werden. „Glaubt an die Werke“ würde die Werke missverständlich zum Gegenstand religiösen Glaubens machen.'
- source_word: ἔργοις
  choice: Werken
  rationale: „Werke“ bewahrt den johanneischen Sprachgebrauch für Jesu offenbarendes Handeln; „Zeichen“ wäre enger als das hier verwendete ἔργα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: damit ihr erkennt und weiter erkennt
  rationale: 'Die bewusst leicht markierte Formulierung gibt die Wiederholung desselben Verbs sowie den Wechsel vom Aorist zum Präsens wieder: zum Erkennen gelangen und in fortdauernder Erkenntnis bleiben.'
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: dass der Vater in mir ist und ich im Vater bin
  rationale: Das wiederholte ἐν wird unmittelbar mit „in“ wiedergegeben und bewahrt die Aussage wechselseitigen Inseins ohne dogmatische Ausdeutung.
- source_word: πατήρ
  choice: der Vater
  rationale: Der bestimmte Ausdruck entspricht dem griechischen ὁ πατήρ; „mein Vater“ würde ein nicht ausdrücklich vorhandenes Possessiv ergänzen.
theological_decisions:
- issue: Wechselseitiges Insein des Vaters und des Sohnes
  choice: „der Vater in mir ist und ich im Vater bin“
  alternative: „der Vater mit mir eins ist und ich mit dem Vater“
  rationale: Die räumlich-relationale Bildsprache des griechischen ἐν bleibt stehen. So wird die starke johanneische Aussage bewahrt, ohne sie durch spätere dogmatische Begrifflichkeit zu ersetzen.
- issue: Gegenstand des Glaubens im ersten Satzteil
  choice: „mir nicht glaubt“
  alternative: „nicht an mich glaubt“
  rationale: Der Dativ lässt beide Nuancen zu. Im unmittelbaren Gegensatz zum Glauben an das Zeugnis der Werke liegt das Glauben an Jesu Aussage näher; die andere Möglichkeit wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glaubt den Werken“ und „erkennt und weiter erkennt“ sind bewusst knapp beziehungsweise leicht markiert, um die johanneische Wiederholung und die Struktur des griechischen Textes sichtbar zu halten.
