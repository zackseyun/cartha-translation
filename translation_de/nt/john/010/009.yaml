id: JHN.10.9
reference: John 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: de
  text: Ich bin die Tür.[a] Wer durch mich hineingeht, wird gerettet werden; er wird ein- und ausgehen und Weide finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Tor“. Das griechische Wort kann eine Tür oder ein Tor bezeichnen; „Tür“ steht im Haupttext als unmittelbarere lexikalische Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: Tür
  rationale: „Tür“ ist die unmittelbare lexikalische Entsprechung und bewahrt die prägnante johanneische Ich-bin-Metapher. Im Bild eines Schafstalls ist auch „Tor“ möglich und wird deshalb in einer Fußnote genannt.
- source_word: δι’ ἐμοῦ
  choice: durch mich
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise den vermittelnden Zugang; „durch mich“ gibt dies im Deutschen klar und idiomatisch wieder.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Wer … hineingeht
  rationale: Die offene, allgemeine Bedingung wird im Deutschen mit einem konditionalen Relativsatz natürlich wiedergegeben. „Wer“ bewahrt den unbestimmten und umfassenden Bezug von τις.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Die passive Zukunftsform wird formal gewahrt. „Gerettet“ lässt sowohl den soteriologischen Gehalt als auch die im Hirtenbild anklingende Sicherheit bestehen, ohne den Sinn auf bloßen Schutz oder eine bestimmte Lehrformel zu verengen.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: wird ein- und ausgehen
  rationale: Die parallele Bewegungsformel wird knapp und idiomatisch wiedergegeben, ohne Freiheit oder Sicherheit ausdrücklich in den Text hineinzudeuten.
- source_word: νομὴν
  choice: Weide
  rationale: „Weide“ ist im Zusammenhang mit Schafen die natürliche deutsche Entsprechung und bezeichnet Weideland beziehungsweise Nahrung.
- source_word: εὑρήσει
  choice: finden
  rationale: „Finden“ entspricht der gewöhnlichen Bedeutung von εὑρίσκω und erhält die schlichte Aussage des griechischen Textes.
theological_decisions:
- issue: Metaphorische Wiedergabe von θύρα im Bild des Schafstalls
  choice: Tür
  alternative: Tor
  rationale: „Tür“ hält sich eng an die Grundbedeutung und die traditionelle Form der johanneischen Metapher. „Tor“ passt kontextuell zum Schafstall, ist aber nicht zwingend; die echte lexikalische Möglichkeit wird in der Fußnote bewahrt.
- issue: Bedeutungsumfang von σωθήσεται
  choice: wird gerettet werden
  alternative: wird sicher sein / wird befreit werden
  rationale: „Gerettet werden“ bewahrt den theologischen Bedeutungsraum des Johannesevangeliums und zugleich die Bildwelt von Schutz und Versorgung. Die Übersetzung legt nicht fest, ob hier ausschließlich ein einzelner Aspekt der Rettung gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Futurformen und die Folge „ein- und ausgehen“ bleiben erhalten. Das generische τις wird natürlich und inklusiv mit „Wer“ wiedergegeben; das anschließende „er“ nimmt dieses grammatisch maskuline Indefinitpronomen auf.
