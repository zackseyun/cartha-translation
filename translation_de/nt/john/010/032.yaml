id: JHN.10.32
reference: John 10:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Viele gute Werke habe ich euch vom Vater gezeigt. Für welches dieser Werke steinigt ihr mich?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Jesus antwortete ihnen
  rationale: Die übliche und natürliche Wiedergabe der erzählenden Antwortformel; αὐτοῖς wird ausdrücklich mit „ihnen“ wiedergegeben.
- source_word: Πολλὰ ἔργα καλὰ
  choice: viele gute Werke
  rationale: „Werke“ bewahrt den johanneischen Sprachgebrauch für Jesu Taten, während „gut“ die positive, wohltuende beziehungsweise anerkennenswerte Qualität von καλὰ ausdrückt.
- source_word: ἔδειξα ὑμῖν
  choice: habe ich euch gezeigt
  rationale: Das deutsche Perfekt klingt in direkter Rede natürlich und gibt die bereits vollzogene, für die Angesprochenen sichtbare Handlung passend wieder.
- source_word: ἐκ τοῦ πατρός
  choice: vom Vater
  rationale: Die Formulierung bezeichnet den Ursprung der Werke und fügt kein im griechischen Text fehlendes Possessivpronomen hinzu.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: für welches dieser Werke
  rationale: διά mit Akkusativ bezeichnet hier den Grund beziehungsweise Anlass. „Dieser Werke“ nimmt verständlich die zuvor genannten vielen Werke auf und bewahrt den Singular von ποῖον … ἔργον.
- source_word: ἐμὲ λιθάζετε
  choice: steinigt ihr mich
  rationale: Die Präsensform wird ohne die interpretierende Ergänzung „versucht“ oder „wollt“ direkt wiedergegeben; die deutsche Wortstellung legt den Kontrast auf „mich“.
theological_decisions:
- issue: Bezeichnung des Vaters als Ursprung der Werke Jesu
  choice: vom Vater
  alternative: von meinem Vater
  rationale: Im vorliegenden griechischen Text steht kein μου („mein“). Die Übersetzung bewahrt daher die christologische Aussage in ihrer tatsächlichen Form, ohne sie durch eine Ergänzung zu verstärken.
- issue: Charakter der Werke Jesu
  choice: gute Werke
  alternative: schöne oder edle Werke
  rationale: καλά kann auch Schönheit oder Vorzüglichkeit bezeichnen. Im Zusammenhang des Vorwurfs und der Frage nach dem Grund der Steinigung bringt „gute Werke“ ihre erkennbare Güte und Wohltätigkeit am klarsten zum Ausdruck, ohne sie auf bloße Wunderzeichen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage bleibt knapp und zugespitzt. „Vom Vater“ folgt bewusst dem SBLGNT-Wortlaut ohne possessive Erweiterung; „steinigt ihr“ bewahrt das griechische Präsens trotz der im Deutschen möglichen, stärker deutenden Formulierung „wollt ihr steinigen“.
