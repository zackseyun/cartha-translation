  source_fidelity: 'Die Übersetzung gibt den griechischen Wortlaut präzise wieder: ἀπεκρίθη αὐτοῖς als „antwortete ihnen“, Πολλὰ ἔργα καλὰ als „Viele gute Werke“, das aoristische ἔδειξα idiomatisch im deutschen Perfekt und ἐκ τοῦ πατρός ohne unzulässige Ergänzung eines Possessivpronomens. „Für welches dieser Werke“ bewahrt die kausale Frage von διά mit Akkusativ und den Singular von ἔργον. „Steinigt ihr mich?“ gibt das Präsens λιθάζετε direkt wieder, ohne „versucht“ hinzuzufügen.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung der direkten Rede ist idiomatisch; insbesondere ist „Viele gute Werke habe ich euch vom Vater gezeigt“ als betonte Aussage in direkter Rede natürlich.
  terminology: „Werke“, „Vater“ und „steinigen“ sind in diesem johanneischen Kontext sachgerecht und registerangemessen. „Vom Vater“ folgt dem bestimmten Artikel des griechischen Textes, ohne daraus „meinem Vater“ zu machen.
