  to: Niemand nimmt es mir weg,[a] sondern ich gebe es aus eigenem Entschluss hin.[b] Ich habe die Vollmacht, es hinzugeben, und ich habe die Vollmacht, es wieder zu nehmen.[c] Dieses Gebot habe ich von meinem Vater empfangen.
  rationale: Die Revision beseitigt die umgangssprachliche Mehrdeutigkeit von „von mir aus“, ohne die Spannung zwischen Jesu freiwilliger Hingabe und dem vom Vater empfangenen Gebot aufzulösen. Ferner wird die Formulierung für die erneute Annahme des Lebens idiomatischer. Die Begriffe „hingeben“, „Vollmacht“ und „Gebot“ sowie die vorhandenen Fußnoten bleiben inhaltlich erhalten; die textkritische Notiz wird nur redaktionell präzisiert.
