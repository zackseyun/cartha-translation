  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: de
  text: Niemand nimmt es mir weg,[a] sondern ich gebe es aus eigenem Entschluss hin.[b] Ich habe die Vollmacht, es hinzugeben, und ich habe die Vollmacht, es wieder zu nehmen.[c] Dieses Gebot habe ich von meinem Vater empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Niemand hat es mir weggenommen.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „aus eigenem Antrieb“. Die Wendung betont, dass Jesus sein Leben freiwillig hingibt.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: sein Leben; siehe den unmittelbaren Zusammenhang in Johannes 10,17. „Vollmacht“ kann hier sowohl Befugnis als auch Recht und wirksame Macht einschließen.'
    reason: cross_reference_and_lexical_note
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: nimmt es mir weg
  rationale: Das Präsens und die Verbindung mit ἀπό bezeichnen hier, dass niemand Jesus sein Leben entreißt. „Wegnehmen“ gibt den Gegensatz zu seiner freiwilligen Hingabe natürlich wieder.
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: ich gebe es hin / es hinzugeben
  rationale: Beim Leben bezeichnet τίθημι in diesem Zusammenhang die freiwillige Hingabe. „Hingeben“ ist im heutigen Deutsch natürlicher als das wörtliche „niederlegen“ und bewahrt den Gedanken der Selbsthingabe.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: von mir aus
  rationale: Die Wendung hebt Jesu eigenes, freiwilliges Handeln hervor, ohne den unmittelbar folgenden Bezug auf das Gebot des Vaters aufzulösen.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ umfasst sowohl das Recht als auch die Befugnis zu handeln und passt zum abschließenden Hinweis auf das vom Vater empfangene Gebot.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: es wieder an mich zu nehmen
  rationale: Die Formulierung wahrt die aktive Bedeutung von λαμβάνω und den Wiederholungsaspekt von πάλιν; das Pronomen verweist auf Jesu Leben im unmittelbaren Kontext.
- source_word: ἐντολήν
  choice: Gebot
  rationale: „Gebot“ entspricht der direkten Bedeutung von ἐντολή und bewahrt die Spannung zwischen Jesu freiwilligem Handeln und dem Auftrag des Vaters.
- source_word: παρὰ τοῦ πατρός μου
  choice: von meinem Vater
  rationale: παρά mit Genitiv bezeichnet hier die Quelle; die persönliche Vaterbezeichnung bleibt unverändert erhalten.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Blick auf Jesu Tod und erneute Annahme des Lebens
  choice: Vollmacht
  alternative: Macht; Recht
  rationale: „Vollmacht“ bringt rechtmäßige Befugnis und wirksame Handlungsfreiheit zusammen. So bleiben Jesu eigene Autorität und seine geordnete Beziehung zum Vater zugleich bestehen.
- issue: Aussage von ἀπ’ ἐμαυτοῦ
  choice: von mir aus
  alternative: aus eigenem Entschluss; aus mir selbst
  rationale: Die Übersetzung betont die Freiwilligkeit der Lebenshingabe, behauptet aber keine vom Vater unabhängige Initiative; das folgende Gebot des Vaters bleibt als notwendige Spannung stehen.
- issue: Bezug von αὐτήν
  choice: es
  alternative: mein Leben
  rationale: Das Pronomen verweist eindeutig auf „mein Leben“ im unmittelbaren Zusammenhang von Vers 17. Seine Beibehaltung wahrt die Form des Ausgangstextes und vermeidet eine unnötige Explizierung.
- issue: Verhältnis von Gebot und freiwilliger Hingabe
  choice: Beide Aussagen unvermittelt nebeneinander stehen lassen
  alternative: Das Gebot als bloße Erlaubnis oder die Freiwilligkeit als Gehorsam paraphrasieren
  rationale: Der Vers verbindet Jesu freiwilliges Handeln mit einem vom Vater empfangenen Gebot. Die Übersetzung löst diese theologische Spannung nicht durch erklärende Zusätze auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hingeben“ vermeidet die im Deutschen schwer verständliche wörtliche Metapher „das Leben niederlegen“, während „Vollmacht“ die rechtliche und wirksame Dimension von ἐξουσία erhält. Die wiederholte Satzstruktur des Griechischen bleibt weitgehend gewahrt.
