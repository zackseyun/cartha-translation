  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: de
  text: Mein Vater[a], der sie mir gegeben hat, ist größer als alle, und niemand kann sie aus der Hand des Vaters reißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was mein Vater mir gegeben hat, ist größer als alles.“ Der griechische Wortlaut ist hier schwierig; manche verstehen die Gabe selbst als Gegenstand des Vergleichs statt der Personen, die der Vater mir gegeben hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Mein Vater
  rationale: Idiomatic German rendering of the possessive phrase; it preserves Jesus’ filial relationship to God without explanatory expansion.
- source_word: ὃ δέδωκέν μοι
  choice: der sie mir gegeben hat
  rationale: The printed neuter singular relative pronoun is syntactically difficult. In context, the preceding sheep are those whom the Father has given to Jesus. The personal relative clause makes that contextual sense natural in German, while the genuine alternative is retained in a footnote. The German perfect conveys the completed gift with continuing relevance.
- source_word: πάντων μεῖζων
  choice: größer als alle
  rationale: This follows the immediate personal referent while leaving the group denoted by „alle“ unspecified. It avoids narrowing the comparison to a named class.
- source_word: οὐδεὶς δύναται
  choice: niemand kann
  rationale: Natural modern German that fully expresses inability without the heavier wording „niemand ist imstande“.
- source_word: ἁρπάζειν
  choice: sie … reißen
  rationale: „Aus der Hand reißen“ naturally conveys forceful removal and preserves the protective-hand metaphor. The object „sie“ is supplied from the context, as German syntax requires it here.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: aus der Hand des Vaters
  rationale: „Aus“ closely reflects ἐκ, while „Hand“ preserves the metaphor of secure possession and protection. Repeating „des Vaters“ reflects the source rather than replacing it with a pronoun.
theological_decisions:
- issue: Textual and syntactic difficulty of ὃ δέδωκέν μοι
  choice: 'The main text understands the clause contextually of the sheep: „der sie mir gegeben hat“'
  alternative: „Mein Vater – was er mir gegeben hat – ist größer als alles“ or „Was mein Vater mir gegeben hat, ist größer als alles“
  rationale: The Greek neuter relative ὃ permits an understanding in which the gift itself is the subject, but the masculine comparative and the discourse about the sheep make the syntax difficult. The main rendering follows the personal contextual referent without concealing the alternative, which is documented in the footnote.
- issue: Scope of πάντων
  choice: „größer als alle“
  alternative: „größer als alles“
  rationale: The rendering does not specify who is included in „alle“. The alternative construction tied to the neuter gift reading naturally yields „alles“ and is therefore noted with that reading rather than silently harmonized.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Formulierung „aus der Hand … reißen“ ist anschaulich und idiomatisch; die Wiederholung von „Vater“ hält sich eng an den griechischen Text.
