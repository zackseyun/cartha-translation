  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: de
  text: Denn er ist ein Lohnarbeiter, und die Schafe liegen ihm nicht am Herzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die zuvor geschilderte Flucht. „Denn“ stellt diesen rückbezüglichen Begründungszusammenhang im Deutschen natürlich und knapp her.
- source_word: μισθωτός
  choice: Lohnarbeiter
  rationale: Das Wort bezeichnet jemanden, der gegen Lohn arbeitet und im Gegensatz zum Hirten keine eigene Bindung an die Schafe hat. „Lohnarbeiter“ ist gegenwärtig und vermeidet das veraltete „Mietling“.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: liegen ihm nicht am Herzen
  rationale: Die unpersönliche Konstruktion mit Dativ und περί bezeichnet fehlende Sorge bzw. Anteilnahme. Die deutsche Wendung gibt die persönliche und ethische Aussage idiomatisch wieder, ohne zusätzliche Motive einzutragen.
- source_word: τῶν προβάτων
  choice: die Schafe
  rationale: Die konkrete Wiedergabe bewahrt das durchgehende Hirtenbild; „Herde“ wäre zusammenfassender und weniger lexikalisch direkt.
theological_decisions:
- issue: Charakterisierung des μισθωτός im Gegensatz zum guten Hirten
  choice: Die Aussage wird als schlichte Begründung seiner fehlenden Sorge wiedergegeben, ohne den Lohnarbeiter mit einer bestimmten Gruppe gleichzusetzen.
  alternative: Den Lohnarbeiter ausdrücklich als bestimmte Klasse falscher Leiter deuten oder die Aussage zu bloßer beruflicher Distanz abschwächen.
  rationale: Der Vers nennt als Grund sein Verhältnis als Lohnarbeiter und seine mangelnde Sorge um die Schafe. Eine nähere Identifizierung oder dogmatische Ausdeutung steht nicht ausdrücklich im Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lohnarbeiter“ ist verständlicher als das traditionelle, heute abwertend oder altertümlich wirkende „Mietling“. Die Wendung „liegen ihm nicht am Herzen“ bewahrt die moralische Schärfe in natürlichem Deutsch.
