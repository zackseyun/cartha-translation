  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: de
  text: Wenn ich nicht die Werke meines Vaters tue, dann glaubt mir nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Wenn
  rationale: Leitet einen real formulierten Bedingungssatz ein; „wenn“ ist die natürliche deutsche Entsprechung.
- source_word: οὐ ποιῶ
  choice: ich nicht … tue
  rationale: Das Präsens bezeichnet Jesu gegenwärtiges Handeln, ohne dass im Deutschen zwingend eine Verlaufsform ausgedrückt werden muss.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ bewahrt den johanneischen Leitbegriff für Jesu Taten, die von seinem Vater zeugen.
- source_word: τοῦ πατρός μου
  choice: meines Vaters
  rationale: Gibt die Genitivverbindung knapp und unmittelbar wieder; „Vater“ wird als Gottesbezeichnung großgeschrieben.
- source_word: μὴ πιστεύετέ μοι
  choice: dann glaubt mir nicht
  rationale: πιστεύω mit dem Dativ μοι bedeutet hier natürlich „jemandem glauben“; „dann“ macht im Deutschen die Folgerung des Bedingungssatzes deutlich, ohne einen zusätzlichen Sachgehalt einzuführen.
theological_decisions:
- issue: Bedeutung von πιστεύω mit dem Dativ μοι
  choice: „glaubt mir nicht“
  alternative: „glaubt nicht, was ich sage“ oder „vertraut mir nicht“
  rationale: Die Konstruktion kann sowohl persönliche Glaubwürdigkeit als auch die Annahme von Jesu Worten betreffen. Die direkte Wiedergabe „glaubt mir nicht“ erhält diese Überschneidung und vermeidet eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung „die Werke meines Vaters tue“ bewahrt den Nachdruck auf den Werken; „dann“ sorgt für einen natürlichen deutschen Bedingungssatz.
