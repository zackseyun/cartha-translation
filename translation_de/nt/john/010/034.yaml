  source_fidelity: 'Der Entwurf gibt ἀπεκρίθη αὐτοῖς idiomatisch als „antwortete ihnen“ wieder und bewahrt die Frageform von Οὐκ ἔστιν γεγραμμένον. „Steht nicht … geschrieben“ ist eine treffende deutsche Schriftzitatsformel. „in eurem Gesetz“ entspricht ἐν τῷ νόμῳ ὑμῶν; die Großschreibung ist angesichts des breiteren johanneischen Schriftgebrauchs, der hier einen Psalm einschließt, angemessen. Das Zitat „Ich habe gesagt: Ihr seid Götter“ wahrt die direkte Aussage von Ἐγὼ εἶπα· Θεοί ἐστε. Das deutsche Perfekt ist hier als Rückverweis auf die im Psalm ausgesprochene Aussage idiomatisch und inhaltlich genau.'
