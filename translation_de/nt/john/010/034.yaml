source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Steht nicht in eurem Gesetz geschrieben: ‚Ich habe gesagt: Ihr seid Götter‘?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „göttliche Wesen“. Jesus zitiert Psalm 82,6. Wie die dort so Bezeichneten zu verstehen sind, ist umstritten; der Haupttext bewahrt den unmittelbaren Wortlaut des Zitats.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: antwortete ihnen
  rationale: Die übliche und natürliche deutsche Wiedergabe der erzählerischen Wendung im johanneischen Dialog.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Steht nicht … geschrieben
  rationale: Bewahrt die Frageform und gibt die geläufige Formel zur Einführung eines Schriftzitats idiomatisch wieder.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: in eurem Gesetz
  rationale: „Gesetz“ bezeichnet hier die jüdische Schrift in einem weiteren Sinn, da das Zitat aus Psalm 82,6 stammt; die Großschreibung kennzeichnet diese Schriftbezeichnung.
- source_word: Ἐγὼ εἶπα
  choice: Ich habe gesagt
  rationale: Das Perfekt entspricht im Deutschen natürlich dem Rückverweis auf die im Psalm ausgesprochene Aussage, ohne das ausdrückliche ἐγώ zusätzlich zu überbetonen.
- source_word: Θεοί ἐστε
  choice: Ihr seid Götter
  rationale: Gibt Substantiv und Kopula direkt wieder und bewahrt die auffällige, deutungsoffene Formulierung des Psalmzitats.
theological_decisions:
- issue: Wiedergabe von θεοί im Zitat aus Psalm 82,6
  choice: Götter
  alternative: göttliche Wesen
  rationale: Die direkte lexikalische Wiedergabe bewahrt die rhetorische und theologische Spannung von Jesu Zitat. Die alternative Deutung wird in der Fußnote genannt, statt sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftregister. Die Formulierung bleibt nah am griechischen Satzbau, ohne unnatürlich zu wirken.
