  terminology: „Gesetz“ ist als Schriftbezeichnung kontextgerecht. „Götter“ ist die unmittelbare und notwendige Wiedergabe von Θεοί und vermeidet eine interpretierende Abschwächung. Die Fußnote nennt „göttliche Wesen“ zutreffend als mögliche alternative Wiedergabe, ohne die umstrittene Deutung des Psalms festzulegen.
