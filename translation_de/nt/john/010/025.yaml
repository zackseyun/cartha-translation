id: JHN.10.25
reference: John 10:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: „Ich habe es euch gesagt, doch ihr glaubt nicht. Die Werke, die ich im Namen meines Vaters[a] tue, die zeugen von mir[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kraft der Vollmacht meines Vaters.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: legen Zeugnis über mich ab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: antwortete ihnen
  rationale: Die übliche und natürliche Wiedergabe der erzählerischen Dialogformel; der Dativ αὐτοῖς wird direkt wiedergegeben.
- source_word: Εἶπον ὑμῖν
  choice: Ich habe es euch gesagt
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists mit Bezug auf eine vorausgegangene Äußerung. Das ergänzte „es“ ist idiomatisch, ohne den Inhalt näher festzulegen.
- source_word: καὶ οὐ πιστεύετε
  choice: doch ihr glaubt nicht
  rationale: καί hat hier im Zusammenhang adversative Kraft. „glaubt“ bewahrt die johanneische Begriffskontinuität und lässt offen, ob Zustimmung, Vertrauen oder beides gemeint ist.
- source_word: τὰ ἔργα
  choice: Die Werke
  rationale: „Werke“ bewahrt den für das Johannesevangelium wichtigen wiederkehrenden Begriff und ist enger am Ausgangstext als „Taten“.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: im Namen meines Vaters
  rationale: Die feste Wendung bleibt erhalten und umfasst Repräsentation, Beauftragung und Vollmacht, ohne eine dieser Bedeutungsnuancen allein festzuschreiben.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: die zeugen von mir
  rationale: Das wiederaufnehmende „die“ bildet die Hervorhebung durch ταῦτα natürlich nach. „zeugen von mir“ ist verständliches modernes Deutsch und bewahrt das johanneische Zeugnis-Motiv.
theological_decisions:
- issue: Verhältnis der Werke Jesu zum Namen und zur Vollmacht des Vaters
  choice: im Namen meines Vaters
  alternative: kraft der Vollmacht meines Vaters
  rationale: Die formnahe Wendung bewahrt die theologische Breite des griechischen Ausdrucks und beschränkt ihn nicht auf Vollmacht allein.
- issue: Funktion der Werke als Zeugnis über Jesus
  choice: die zeugen von mir
  alternative: diese legen Zeugnis über mich ab
  rationale: Die Übersetzung hält fest, dass die Werke selbst auf Jesus verweisen und für seine Sendung sprechen, ohne den genauen christologischen Schluss über den Wortlaut des Verses hinaus zu erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme „die … die“ erhält die Hervorhebung von ταῦτα in einer mündlich klaren, allgemein verständlichen Form. Die Anmerkungszeichen stehen jeweils unmittelbar bei der Wendung, auf die sich die Alternative bezieht.
