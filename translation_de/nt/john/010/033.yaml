id: JHN.10.33
reference: John 10:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: de
  text: 'Die Juden antworteten ihm: „Nicht wegen eines guten Werkes steinigen wir dich, sondern wegen Gotteslästerung und weil du, obwohl du ein Mensch bist, dich selbst zu Gott[a] machst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich selbst zu einem Gott machst“. Im Griechischen steht θεόν ohne Artikel; im Zusammenhang mit dem Vorwurf der Gotteslästerung ist jedoch wahrscheinlich „Gott“ gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: die Juden
  rationale: Die direkte Wiedergabe bewahrt den johanneischen Sprachgebrauch und legt die im unmittelbaren Zusammenhang feindlich auftretende Gruppe nicht enger als „jüdische Führer“ oder „Judäer“ fest.
- source_word: Περὶ καλοῦ ἔργου
  choice: wegen eines guten Werkes
  rationale: περί mit Genitiv bezeichnet hier den Grund beziehungsweise Anlass. Die Formulierung ist natürliches Deutsch und bewahrt den Singular sowie die positive Wertung von καλοῦ.
- source_word: λιθάζομέν
  choice: steinigen wir
  rationale: Das Präsens bezeichnet die gegenwärtige Handlung beziehungsweise Absicht. Die deutsche Präsensform gibt beides idiomatisch wieder.
- source_word: βλασφημίας
  choice: Gotteslästerung
  rationale: Im Kontext bezeichnet βλασφημία eine gegen Gott gerichtete Lästerung. „Gotteslästerung“ ist im Deutschen präziser und natürlicher als das fachsprachlichere „Blasphemie“.
- source_word: ἄνθρωπος ὢν
  choice: obwohl du ein Mensch bist
  rationale: Die partizipiale Wendung hat hier einen deutlich konzessiven Sinn und bringt den von den Sprechern behaupteten Gegensatz zwischen Jesu Menschsein und seinem Anspruch verständlich zum Ausdruck.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: dich selbst zu Gott machst
  rationale: ποιέω mit Reflexivobjekt und Prädikatsakkusativ bedeutet „sich selbst zu etwas machen/als etwas darstellen“. Trotz des fehlenden Artikels legt der Vorwurf der Gotteslästerung im monotheistischen Kontext „Gott“ nahe; die grammatisch mögliche Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von θεόν in der Anklage ποιεῖς σεαυτὸν θεόν
  choice: Gott
  alternative: einen Gott
  rationale: Das artikellose θεόν lässt isoliert beide Wiedergaben zu. Der unmittelbare Vorwurf der Gotteslästerung und der johanneische Kontext sprechen jedoch dafür, dass die Gegner Jesus einen Anspruch auf den einzigartigen Rang Gottes vorwerfen. Die Alternative bleibt zur Wahrung der sprachlichen Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der pointierten Gegenüberstellung des griechischen Textes, ohne im Deutschen unnötig altertümlich zu wirken.
