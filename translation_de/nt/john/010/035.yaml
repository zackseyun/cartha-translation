source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: de
  text: Wenn er diejenigen, an die das Wort Gottes erging, »Götter«[a] nannte – und die Schrift kann nicht außer Kraft gesetzt werden[b] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »göttliche Wesen«. Im Griechischen steht »Götter«, als Anklang an Psalm 82,6; manche verstehen die Bezeichneten als menschliche Richter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »kann nicht aufgelöst werden«; dem Sinn nach auch: »kann nicht aufgehoben werden« oder »kann nicht für ungültig erklärt werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Wenn
  rationale: Leitet die Bedingung innerhalb von Jesu Argumentation ein und bewahrt den syntaktischen Anschluss an den folgenden Vers.
- source_word: ἐκείνους
  choice: diejenigen
  rationale: Verweist bestimmt auf die in der angeführten Schriftstelle Angesprochenen, ohne sie näher zu identifizieren.
- source_word: εἶπεν
  choice: nannte
  rationale: Die Konstruktion bezeichnet hier die Benennung als »Götter«; das wörtlichere »sagte« wäre im Deutschen unnatürlich.
- source_word: θεοὺς
  choice: »Götter«
  rationale: Gibt den Wortlaut des Zitats aus Psalm 82,6 unmittelbar wieder. Die Kleinschreibung unterscheidet die Bezeichneten von Gott, ohne ihre genaue Identität festzulegen.
- source_word: πρὸς οὓς
  choice: an die
  rationale: 'Drückt zusammen mit ἐγένετο die Richtung aus: Gottes Wort richtete sich an diese Personen oder Wesen.'
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Bewahrt die geläufige und transparente Formulierung; gemeint ist hier die göttliche Aussage beziehungsweise Anrede, nicht ausdrücklich der persönliche Logos aus Johannes 1.
- source_word: ἐγένετο
  choice: erging
  rationale: »Das Wort erging an« ist eine natürliche, würdige deutsche Wendung für das Eintreffen beziehungsweise Ergehen einer göttlichen Botschaft.
- source_word: οὐ δύναται λυθῆναι
  choice: kann nicht außer Kraft gesetzt werden
  rationale: Gibt den Sinn von λύω als Aufheben, Entkräften oder Ungültigmachen idiomatisch wieder. Das wörtlichere »kann nicht gebrochen werden« ist im heutigen Deutschen bei »Schrift« weniger natürlich.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Bezeichnet die autoritative heilige Schrift; der bestimmte Artikel wird beibehalten.
theological_decisions:
- issue: Bedeutung von θεοὺς in der angeführten Schriftstelle
  choice: »Götter« bleibt im Haupttext stehen.
  alternative: »göttliche Wesen« oder interpretierend »Richter«
  rationale: Jesu Argument beruht auf dem Wortlaut von Psalm 82,6. Eine Festlegung auf menschliche Richter oder übermenschliche Wesen würde die im Text bestehende Deutungsspannung auflösen.
- issue: Tragweite der Aussage über die Schrift
  choice: »die Schrift kann nicht außer Kraft gesetzt werden«
  alternative: »die Schrift kann nicht gebrochen/aufgehoben werden«
  rationale: Die Formulierung bewahrt die Aussage von der Unaufhebbarkeit der Schrift, ohne über den unmittelbaren Satz hinaus eine konfessionell ausgearbeitete Schriftlehre einzutragen.
- issue: Unausgesprochenes Subjekt von εἶπεν
  choice: Das Pronomen »er« wird beibehalten.
  alternative: Explizit »Gott«, »das Gesetz« oder »die Schrift«
  rationale: Im griechischen Satz ist das Subjekt nicht ausdrücklich genannt. Eine explizite Benennung würde die syntaktische beziehungsweise referenzielle Mehrdeutigkeit unnötig entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet den eingeschobenen Satz über die Schrift; das abschließende Komma bewahrt den syntaktischen Anschluss an Johannes 10,36. Die Anführungszeichen um »Götter« verdeutlichen den Zitatklang, ohne den Ausdruck interpretierend abzuschwächen.
