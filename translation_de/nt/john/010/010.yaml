id: JHN.10.10
reference: John 10:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: de
  text: Der Dieb kommt nur, um zu stehlen, zu schlachten[a] und zu vernichten. Ich bin gekommen, damit sie Leben haben und es in Fülle haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu töten“. Das griechische Verb bezeichnet häufig das Schlachten; das passt zum Bild von den Schafen im Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Leben in Fülle haben“ beziehungsweise „es im Überfluss haben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: der Dieb
  rationale: 'Der Artikel und der Zusammenhang tragen die bestimmte, zugleich repräsentative Einzahl: der Dieb als Gegenfigur zum Hirten.'
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: kommt nur
  rationale: Diese natürliche deutsche Wendung bewahrt die ausschließende Kraft der griechischen Konstruktion.
- source_word: ἵνα κλέψῃ
  choice: um zu stehlen
  rationale: Der Infinitiv mit „um zu“ gibt nach der ausschließenden Wendung den Zweck knapp und idiomatisch wieder.
- source_word: θύσῃ
  choice: zu schlachten
  rationale: θύω bezeichnet häufig das Schlachten von Tieren; im Bildfeld von Schafen und Hirten ist „schlachten“ treffender und anschaulicher als das allgemeinere „töten“.
- source_word: ἀπολέσῃ
  choice: zu vernichten
  rationale: „Vernichten“ bringt die umfassende Zerstörung in der dreigliedrigen Reihe zum Ausdruck, ohne Gegenstand oder Art näher festzulegen.
- source_word: ἐγὼ ἦλθον
  choice: Ich bin gekommen
  rationale: Das deutsche Perfekt ist in moderner Standardsprache für ein vergangenes Kommen mit fortdauernder Bedeutung natürlich und stellt Jesu Sendung der des Diebes gegenüber.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: damit sie Leben haben
  rationale: Die Zweckkonstruktion bleibt erhalten; „Leben“ bewahrt den weiten johanneischen Sinn, ohne ausdrücklich „ewiges Leben“ einzusetzen.
- source_word: περισσὸν ἔχωσιν
  choice: es in Fülle haben
  rationale: Das substantivisch beziehungsweise adverbial gebrauchte περισσόν beschreibt das überreiche Maß des Lebens. „Es in Fülle haben“ bezieht die Fülle klar auf das Leben und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutungsumfang von ζωή im Johannesevangelium
  choice: Leben
  alternative: ewiges Leben; wahres Leben
  rationale: Im Vers steht ζωή ohne das Adjektiv „ewig“. „Leben“ erhält die theologische Tiefe und Mehrdeutigkeit, ohne den Wortlaut dogmatisch zu präzisieren.
- issue: Aussagekraft von περισσόν
  choice: in Fülle
  alternative: überreich; im Überfluss; in ganzer Fülle
  rationale: Die Formulierung bezeichnet die reiche Fülle des von Jesus gegebenen Lebens, ohne sie auf materiellen Wohlstand oder eine bestimmte Segenslehre einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Zweckangaben und der scharfe Gegensatz zwischen dem Dieb und Jesu Sendung bleiben sichtbar. „Schlachten“ erhält das konkrete Bildfeld des Hirtenwortes; „Leben in Fülle“ vermeidet sowohl altertümliche Sprache als auch eine Verengung auf materiellen Wohlstand.
