  source_fidelity: Die Übersetzung gibt ἐζήτουν mit „versuchten“ angemessen als auf einen nicht erfolgreichen Zugriff gerichteten Vorgang wieder; „erneut“ entspricht πάλιν. „festzunehmen“ ist im Konfliktkontext eine natürliche Wiedergabe von πιάσαι. „entkam ihrem Zugriff“ gibt die idiomatische Gesamtwendung ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν verständlich wieder, ohne die Art des Entkommens zu erläutern oder zu überdeuten. „Daraufhin“ bildet den diskursiven Anschluss von οὖν vertretbar ab.
  naturalness: Modernes, flüssiges Standarddeutsch mit passendem erzählerischem Register. Die Gegenüberstellung durch „Doch“ ist idiomatisch und macht das Scheitern des Festnahmeversuchs klar.
