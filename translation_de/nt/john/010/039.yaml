  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: de
  text: Daraufhin versuchten sie erneut, ihn festzunehmen. Doch er entkam ihrem Zugriff.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus ihrer Hand“; gemeint ist: aus ihrer Gewalt oder ihrem Zugriff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: versuchten
  rationale: Das Imperfekt bezeichnet hier einen anhaltenden beziehungsweise versuchten Vorgang. Im Deutschen gibt „versuchten“ zusammen mit dem Infinitiv die nicht erfolgreiche Absicht natürlich wieder.
- source_word: οὖν
  choice: Daraufhin
  rationale: Das Wort markiert die Folgerung beziehungsweise narrative Weiterentwicklung aus dem vorangehenden Wortwechsel. „Daraufhin“ ist im modernen Deutschen idiomatisch und stellt den Zusammenhang klar her.
- source_word: πάλιν
  choice: erneut
  rationale: Das Adverb bezeichnet die Wiederholung eines früheren Versuchs und wird direkt und natürlich wiedergegeben.
- source_word: πιάσαι
  choice: festzunehmen
  rationale: Im johanneischen Konfliktzusammenhang meint πιάζω das gewaltsame Ergreifen mit dem Ziel, Jesus in Gewahrsam zu bringen. „Festzunehmen“ gibt dies natürlicher wieder als „zu ergreifen“, ohne zwingend ein modernes förmliches Polizeiverfahren vorauszusetzen.
- source_word: ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν
  choice: er entkam ihrem Zugriff
  rationale: Wörtlich heißt die Wendung „er ging aus ihrer Hand heraus“. χείρ ist hier idiomatisch für Gewalt, Verfügungsgewalt oder Zugriff gebraucht. Die gewählte Formulierung bewahrt diesen Sinn in verständlichem, natürlichem Deutsch.
theological_decisions:
- issue: Ob Jesu Entkommen ausdrücklich benannt oder die griechische Wendung formal nachgebildet werden soll
  choice: „er entkam ihrem Zugriff“
  alternative: „er ging aus ihrer Hand heraus“
  rationale: Das griechische ἐξῆλθεν ist zwar wörtlich „ging hinaus“, doch die Gesamtwendung ἐκ τῆς χειρὸς αὐτῶν ist ein Idiom für das Entkommen aus ihrer Gewalt. Die natürliche deutsche Wiedergabe macht den erzählten Ausgang deutlich, ohne eine übernatürliche Art des Entkommens zu behaupten oder zu erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Daraufhin“ bewahrt den Folgezusammenhang; „festzunehmen“ und „ihrem Zugriff“ vermeiden eine unnatürliche wörtliche Nachbildung, ohne die Art des Entkommens näher festzulegen.
