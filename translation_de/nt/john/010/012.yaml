id: JHN.10.12
reference: John 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: de
  text: Der Lohnarbeiter, der kein Hirte ist und dem die Schafe nicht selbst gehören, sieht den Wolf kommen, lässt die Schafe zurück[a] und flieht. Der Wolf reißt sie fort und zerstreut sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lässt die Schafe im Stich.'
    reason: 'Lexikalische Alternative: ἀφίησιν kann hier angesichts der Gefahr das stärkere schuldhafte Preisgeben bezeichnen.'
lexical_decisions:
- source_word: μισθωτός
  choice: Lohnarbeiter
  rationale: Bezeichnet jemanden, der gegen Lohn arbeitet. „Lohnarbeiter“ ist modernes Standarddeutsch und bewahrt den Gegensatz zum wirklichen Hirten, ohne das altertümliche „Mietling“ zu verwenden.
- source_word: οὐκ ὢν ποιμήν
  choice: der kein Hirte ist
  rationale: Die partizipiale Konstruktion wird als natürlicher deutscher Relativsatz wiedergegeben; die Aussage, dass er kein wirklicher Hirte ist, bleibt erhalten.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: dem die Schafe nicht selbst gehören
  rationale: Gibt sowohl das fehlende Eigentumsverhältnis als auch den Nachdruck von ἴδια wieder und klingt im Deutschen natürlicher als eine eng nachgebildete Genitivkonstruktion.
- source_word: θεωρεῖ τὸν λύκον ἐρχόμενον
  choice: sieht den Wolf kommen
  rationale: Die Wahrnehmung und die lebendige Bewegung des herankommenden Wolfes werden knapp und idiomatisch ausgedrückt.
- source_word: ἀφίησιν
  choice: lässt … zurück
  rationale: Bewahrt die Grundbedeutung „verlassen/zurücklassen“, während der Zusammenhang ein schuldhaftes Im-Stich-Lassen nahelegt; die stärkere Möglichkeit wird in der Fußnote genannt.
- source_word: φεύγει
  choice: flieht
  rationale: Eine knappe, anschauliche Wiedergabe der Flucht angesichts der Gefahr.
- source_word: ἁρπάζει αὐτά
  choice: reißt sie fort
  rationale: Bringt das gewaltsame Ergreifen durch ein Raubtier zum Ausdruck und lässt offen, ob einzelne Schafe erbeutet oder mitgerissen werden.
- source_word: σκορπίζει
  choice: zerstreut sie
  rationale: Gibt die Auflösung und Verteilung der Schafe wieder; das im Griechischen aus dem Zusammenhang erschließbare Objekt wird im Deutschen ausdrücklich genannt.
theological_decisions:
- issue: Bildhafte Hirtenrede
  choice: Die konkreten Begriffe „Lohnarbeiter“, „Hirte“, „Schafe“ und „Wolf“ bleiben als Bestandteile des Bildes stehen.
  alternative: Deutende Begriffe wie „Leiter“, „Betreuer“ oder ausdrücklich benannte religiöse Gruppen einsetzen.
  rationale: Johannes 10 entfaltet ein zusammenhängendes Hirtenbild. Eine vorwegnehmende Deutung würde die Bildsprache verengen und mehr sagen als der griechische Text.
- issue: Stärke von ἀφίησιν
  choice: Im Haupttext steht das offenere „lässt … zurück“; die schuldhafte Nuance ergibt sich aus Gefahr und Flucht.
  alternative: Im Haupttext unmittelbar „lässt … im Stich“ übersetzen.
  rationale: Das Verb kann schlichtes Verlassen wie auch Preisgeben bezeichnen. Die Übersetzung bewahrt diese Spannweite, ohne die im Kontext naheliegende stärkere Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt gut verständlich und bewahrt die wiederholte konkrete Nennung der Schafe sowie die anschauliche Gegenwartsbewegung des griechischen Textes.
