source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: de
  text: Ihm öffnet der Torhüter, und die Schafe hören seine Stimme. Er ruft seine eigenen Schafe beim Namen und führt sie hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bringt sie hinaus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: Ihm
  rationale: Der Dativ verweist auf die Hirtenfigur aus dem vorhergehenden Vers. „Ihm“ ist im Deutschen knapp, natürlich und wahrt den persönlichen Bezug.
- source_word: ὁ θυρωρός
  choice: der Torhüter
  rationale: Bezeichnet den Wächter am Zugang. „Torhüter“ passt zum Schafpferch und ist verständlicher sowie bildgerechter als „Türhüter“.
- source_word: ἀνοίγει
  choice: öffnet
  rationale: Gibt das einfache Präsens direkt und idiomatisch wieder; das Objekt, das Tor, bleibt wie im Griechischen unausgesprochen.
- source_word: τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει
  choice: die Schafe hören auf seine Stimme
  rationale: Der Genitiv bei ἀκούω kann im Deutschen natürlich mit „auf seine Stimme hören“ wiedergegeben werden. Die Formulierung bewahrt sowohl das Wahrnehmen als auch den Gedanken des Folgens; trotz des griechischen Verbs im Singular verlangt das neutrale Pluralsubjekt im Deutschen den Plural.
- source_word: τὰ ἴδια πρόβατα
  choice: seine eigenen Schafe
  rationale: „Eigenen“ bewahrt die durch ἴδια betonte Zugehörigkeit und besondere Beziehung.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: ruft … beim Namen
  rationale: Die geläufige deutsche Wendung bringt das individuelle Rufen jedes Schafes natürlich zum Ausdruck.
- source_word: ἐξάγει αὐτά
  choice: führt sie hinaus
  rationale: ἐξάγω bezeichnet das Hinausführen oder Hinausbringen. Im Hirtenbild hebt „führt … hinaus“ die persönliche Leitung hervor, ohne über den Ausgangstext hinauszugehen.
theological_decisions:
- issue: Hirtenbild und handelnde Person
  choice: Die Handlungen werden weiterhin der im Bild dargestellten Hirtenfigur zugeschrieben, ohne sie im Vers ausdrücklich als Jesus zu benennen.
  alternative: Die Hirtenfigur in der Übersetzung ausdrücklich mit Jesus gleichsetzen.
  rationale: Der Zusammenhang legt die christologische Deutung nahe, doch der Vers selbst bleibt innerhalb des Bildes. Die Übersetzung soll diese Bildsprache bewahren und ihre Deutung nicht in den Wortlaut eintragen.
- issue: Bedeutungsumfang von ἀκούω
  choice: „hören auf seine Stimme“
  alternative: „hören seine Stimme“
  rationale: Die griechische Genitivkonstruktion kann bloßes Hören und beachtendes Hören umfassen. Die deutsche Wendung passt zur Beziehung zwischen Hirte und Schafen, ohne den Gedanken vollständig auf Gehorsam zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher Satzgliederung. Die Wiederholung von „Schafe“ und die betonte Zugehörigkeit durch „seine eigenen“ bleiben erhalten. Das abschließende Satzzeichen steht vor dem Fußnotenmarker, während der Marker unmittelbar an der betreffenden Aussage erscheint.
