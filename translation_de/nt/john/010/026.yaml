  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: de
  text: Aber ihr glaubt nicht[a], weil ihr nicht zu meinen Schafen gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aber ihr glaubt nicht, dass ihr nicht zu meinen Schafen gehört.“ Die griechische Konjunktion kann statt eines Grundes auch den Inhalt des Glaubens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die adversative Konjunktion markiert den Gegensatz zum vorangehenden Zusammenhang; „Aber“ ist im modernen Deutschen natürlich und präzise.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen eine gewisse Betonung. Das deutsche „ihr“ gibt Person und Numerus klar wieder, ohne die Betonung durch „ihr selbst“ zu überzeichnen.
- source_word: οὐ πιστεύετε
  choice: glaubt nicht
  rationale: Der negierte Präsens Indikativ wird idiomatisch als „glaubt nicht“ wiedergegeben und entspricht dem johanneischen Sprachgebrauch.
- source_word: ὅτι
  choice: weil
  rationale: 'ὅτι ist hier wahrscheinlich kausal: Der folgende Satz nennt den Grund für ihren Unglauben. Da auch eine Inhaltssatz-Lesart möglich ist, wird diese in der Fußnote bewahrt.'
- source_word: οὐκ ἐστὲ
  choice: ihr ... nicht ... gehört
  rationale: Die negierte Kopula wird zusammen mit ἐκ idiomatisch als verneinte Zugehörigkeit ausgedrückt.
- source_word: ἐκ τῶν προβάτων
  choice: zu ... Schafen gehört
  rationale: ἐκ bezeichnet hier die Zugehörigkeit zu einer Gruppe. „Zu den Schafen gehören“ ist im Deutschen natürlicher als die formale Wiedergabe „von den Schafen sein“.
- source_word: τῶν ἐμῶν
  choice: meinen
  rationale: Das substantivisch bzw. attributiv bezogene Possessivpronomen wird natürlich als „meinen“ bei „Schafen“ wiedergegeben.
theological_decisions:
- issue: Funktion von ὅτι im Verhältnis zwischen Unglauben und Zugehörigkeit zu Jesu Schafen
  choice: 'kausal: „weil ihr nicht zu meinen Schafen gehört“'
  alternative: 'inhaltlich/epexegetisch: „dass ihr nicht zu meinen Schafen gehört“'
  rationale: Die kausale Lesart passt wahrscheinlich am besten zum unmittelbaren Gedankengang, in dem Jesu Schafe seine Stimme hören. Sie erklärt den Unglauben durch die fehlende Zugehörigkeit, ohne daraus ein umfassenderes Lehrsystem abzuleiten. Die grammatisch mögliche Inhaltssatz-Lesart bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu meinen Schafen gehört“ gibt die griechische Gruppenzugehörigkeit idiomatisch wieder. Die theologisch bedeutsame Mehrdeutigkeit von ὅτι wird nicht eingeebnet, sondern durch die Fußnote erhalten.
