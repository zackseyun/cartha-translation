source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: de
  text: Ich gebe ihnen ewiges Leben, und sie werden ganz gewiss niemals verloren gehen, und niemand wird sie aus meiner Hand reißen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Die geläufige und sachlich genaue Wiedergabe bezeichnet Leben von bleibender, zur kommenden Welt gehörender Dauer und Qualität.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: sie werden in Ewigkeit ganz gewiss nicht verloren gehen
  rationale: „Ganz gewiss nicht“ bildet die nachdrückliche griechische Verneinung οὐ μή ab; „in Ewigkeit“ bewahrt die zusätzliche Zeitbestimmung εἰς τὸν αἰῶνα, ohne sie mit „ewiges Leben“ zusammenzuziehen.
- source_word: ἁρπάσει
  choice: wird … reißen
  rationale: „Aus der Hand reißen“ gibt das gewaltsame Ergreifen bzw. Entziehen des Verbs ἁρπάζω idiomatisch wieder.
- source_word: τις
  choice: niemand
  rationale: In Verbindung mit οὐχ wird das indefinite Pronomen im Deutschen natürlich als „niemand“ wiedergegeben.
- source_word: ἐκ τῆς χειρός μου
  choice: aus meiner Hand
  rationale: Die konkrete Metapher des Schutzes und der Zugehörigkeit wird unverändert bewahrt.
theological_decisions:
- issue: Nachdruck und Dauer der Verneinung
  choice: „in Ewigkeit ganz gewiss nicht verloren gehen“
  alternative: „niemals verloren gehen“
  rationale: Die gewählte Fassung macht sowohl die emphatische Konstruktion οὐ μή als auch die eigene Wendung εἰς τὸν αἰῶνα sichtbar. Sie lässt die starke Zusage des Textes stehen, ohne weitergehende systematische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am griechischen Dreischritt; die leicht markierte Formulierung „in Ewigkeit ganz gewiss nicht“ dient der vollständigen Wiedergabe des doppelten Nachdrucks.
