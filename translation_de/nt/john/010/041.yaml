  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zuverlässig wieder: πολλοὶ („viele“), die Bewegung zu Jesus, das imperfektische Berichten, das johanneische σημεῖον als „Zeichen“, die μὲν … δὲ-Gegenüberstellung, den umfassenden Ausdruck πάντα ὅσα sowie die Wahrheit von Johannes’ Aussage. „Über diesen Mann“ bewahrt die demonstrative Nuance von περὶ τούτου angemessen.'
