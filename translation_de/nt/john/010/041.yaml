id: JHN.10.41
reference: John 10:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: de
  text: 'Und viele kamen zu ihm und sagten: „Johannes hat zwar kein Zeichen getan, aber alles, was Johannes über diesen Mann gesagt hat, war wahr.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird im Deutschen natürlich und ohne unnötige Ergänzung mit „viele“ wiedergegeben.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: kamen zu ihm
  rationale: Die Wendung bezeichnet die Bewegung auf eine Person zu; „kamen zu ihm“ entspricht dem Erzählstandpunkt und ist idiomatisch.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der Imperfekt beschreibt das Sprechen als Vorgang; im natürlichen deutschen Erzählstil kann dies mit dem Präteritum wiedergegeben werden, ohne eine ausdrücklich wiederholte Handlung zu behaupten.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den für das Johannesevangelium charakteristischen Sinn eines außergewöhnlichen Geschehens, das über sich selbst hinausweist; „Wunder“ wäre weniger präzise.
- source_word: ἐποίησεν οὐδέν
  choice: hat kein Zeichen getan
  rationale: Diese Formulierung folgt der schlichten griechischen Konstruktion und ist im Deutschen verständlich; „vollbracht“ wäre ebenfalls möglich, aber stilistisch stärker.
- source_word: μὲν ... δὲ
  choice: zwar ... aber
  rationale: Das deutsche Korrelat gibt die Gegenüberstellung zwischen dem Ausbleiben eines Zeichens und der Wahrheit des Zeugnisses klar wieder.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die Formulierung bewahrt den umfassenden Sinn und klingt in modernem Deutsch natürlich.
- source_word: περὶ τούτου
  choice: über diesen Mann
  rationale: Das Demonstrativpronomen τούτου verweist im Kontext auf Jesus. „Diesen Mann“ erhält dessen demonstrative Kraft deutlicher als das bloße „ihn“.
- source_word: ἀληθῆ ἦν
  choice: war wahr
  rationale: Die direkte Wiedergabe vermeidet die zusätzliche Bedeutung einer späteren Bestätigung, die „bewahrheitete sich“ nahelegen könnte.
theological_decisions:
- issue: Johanneischer Gebrauch von σημεῖον
  choice: Zeichen
  alternative: Wunder
  rationale: Der Leitbegriff „Zeichen“ bleibt erhalten, weil im Johannesevangelium solche Taten auf Jesu Identität und Bedeutung hinweisen; die Übersetzung soll diese thematische Funktion nicht einebnen.
- issue: Bezug von περὶ τούτου
  choice: über diesen Mann
  alternative: über ihn
  rationale: Beide Wiedergaben beziehen sich auf Jesus. „Diesen Mann“ bewahrt die demonstrative Form des griechischen Ausdrucks, ohne eine weitergehende christologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; „zwar ... aber“ bildet die griechische Gegenüberstellung natürlich ab. Keine Fußnote ist erforderlich, da die gewählten Formulierungen die maßgeblichen Bedeutungsnuancen im Haupttext ausdrücken.
