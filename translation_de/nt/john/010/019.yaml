  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: de
  text: Wegen dieser Worte[a] kam es unter den Juden erneut zu einer Spaltung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Judäern“; in manchen Zusammenhängen bei Johannes auch: „unter den führenden Juden“. Die Formulierung „die Juden“ entspricht hier dem griechischen Wortlaut. Im Johannesevangelium bezeichnet dieser Ausdruck jedoch häufig eine bestimmte Gruppe im jeweiligen Zusammenhang und nicht das jüdische Volk als Ganzes.'
    reason: Lexikalische Alternative und notwendige Kontextklärung zu Ἰουδαῖοι.
lexical_decisions:
- source_word: Σχίσμα
  choice: eine Spaltung
  rationale: Das Substantiv bezeichnet einen Riss oder eine Spaltung; hier geht es um gegensätzliche Reaktionen auf Jesu Worte.
- source_word: πάλιν
  choice: erneut
  rationale: Das Adverb kennzeichnet die Wiederholung einer bereits zuvor im Johannesevangelium berichteten Spaltung.
- source_word: ἐγένετο
  choice: kam es zu
  rationale: Die Wendung gibt das Entstehen eines Zustands oder Ereignisses im modernen Deutschen natürlich wieder.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: unter den Juden
  rationale: Dies entspricht der griechischen Formulierung unmittelbar; die kontextabhängige Bedeutung von Ἰουδαῖοι wird wegen möglicher moderner Missverständnisse in einer Fußnote erläutert.
- source_word: διὰ
  choice: Wegen
  rationale: διά mit Akkusativ bezeichnet hier die Ursache; „wegen“ ist knapp und idiomatisch.
- source_word: τοὺς λόγους τούτους
  choice: dieser Worte
  rationale: λόγοι bezieht sich auf die unmittelbar vorausgehenden Äußerungen Jesu; „Worte“ ist verständlich und würdevoll.
theological_decisions:
- issue: Bezugsgruppe von Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext steht „die Juden“, ergänzt durch eine kontextklärende Fußnote.
  alternative: „die Judäer“ oder „die jüdischen führenden Männer“
  rationale: Die direkte Wiedergabe bewahrt die sprachliche Offenheit des griechischen Ausdrucks. Zugleich verhindert die Fußnote, dass die Aussage pauschal auf das jüdische Volk insgesamt bezogen wird, obwohl Johannes den Ausdruck häufig für eine jeweils bestimmte Gruppe gebraucht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung stellt wie der griechische Text den Anlass voran; „kam es … zu einer Spaltung“ klingt natürlich und bewahrt den Ereignischarakter.
