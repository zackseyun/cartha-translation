- issue: Bedeutung von ψυχή in diesem Zusammenhang
  choice: Leben
  alternative: Seele
  rationale: Im Bild vom guten Hirten geht es um Jesu freiwillige Lebenshingabe und seinen Tod. „Leben“ vermeidet eine irreführende Verengung auf die immaterielle Seele, während die Fußnote die lexikalische Alternative sichtbar hält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Parallelismus von „der Vater mich kennt“ und „ich den Vater kenne“ sowie das Hirtenbild bleiben erhalten. Das Semikolon macht die enge syntaktische Verbindung sichtbar, ohne den langen Satz unübersichtlich werden zu lassen.
