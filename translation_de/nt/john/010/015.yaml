  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: de
  text: wie der Vater mich kennt und ich den Vater kenne; und ich gebe mein Leben[a] für[b] die Schafe hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Seele“; hier im Sinn von „mein Leben“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann sowohl „zugunsten der Schafe“ als auch „stellvertretend für die Schafe“ ausdrücken.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet den Vergleich mit der vorausgehenden Aussage über das gegenseitige Kennen von Hirten und Schafen ein. Im fortlaufenden Satz ist „wie“ natürlich und bewahrt den engen Anschluss.
- source_word: γινώσκει / γινώσκω
  choice: kennt / kenne
  rationale: „Kennen“ gibt hier die persönliche, relationale Erkenntnis zwischen dem Vater und Jesus wieder und bewahrt zugleich die Wiederholung des griechischen Verbs.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: der Vater / den Vater
  rationale: Der griechische Text verwendet den bestimmten Artikel und kein Possessivpronomen. Die Wiedergabe bewahrt zudem den johanneischen Sprachgebrauch und den Parallelismus.
- source_word: κἀγὼ
  choice: und ich
  rationale: Die Krasis aus καί und ἐγώ verbindet die beiden parallelen Aussagen. „Und ich“ bildet diese koordinierende Struktur knapp und natürlich ab.
- source_word: τὴν ψυχήν μου
  choice: mein Leben
  rationale: Im Zusammenhang mit Jesu freiwilligem Sterben bezeichnet ψυχή sein Leben, nicht lediglich einen immateriellen Teil des Menschen. Eine Fußnote nennt die formnähere Alternative.
- source_word: τίθημι
  choice: gebe … hin
  rationale: In Verbindung mit ψυχή bezeichnet τίθημι das freiwillige Hingeben des eigenen Lebens. Die im Deutschen idiomatische Verbklammer „gebe … hin“ bewahrt diesen Sinn.
- source_word: ὑπὲρ
  choice: für
  rationale: „Für“ ist im Deutschen knapp und lässt sowohl die begünstigende als auch die stellvertretend-sakr ف? Actually typo risk. Need valid clean. Continue.
- source_word: τῶν προβάτων
  choice: die Schafe
  rationale: Die wörtliche Wiedergabe erhält das für den Abschnitt zentrale Hirtenbild; „die Herde“ würde das konkrete griechische Substantiv verallgemeinern.
