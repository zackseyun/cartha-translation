  source_fidelity: Die räumliche Bewegung („wieder auf die andere Seite des Jordans“) und das anschließende Bleiben werden sachgerecht wiedergegeben. Die griechische Partizipialkonstruktion ἦν … βαπτίζων bezeichnet jedoch Johannes’ frühere fortlaufende Tauftätigkeit; das deutsche Plusquamperfekt „getauft hatte“ kann ohne Objekt zwar so verstanden werden, legt aber leicht einen abgeschlossenen Vorgang nahe und schwächt den durativen Bezug.
  naturalness: Der Satz ist insgesamt klar und modernes Standarddeutsch. „Wo Johannes zuerst taufte“ ist ebenso idiomatisch, knapper und im Erzählstil natürlicher als „wo Johannes zuerst getauft hatte“.
