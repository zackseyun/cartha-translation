source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: de
  text: Und er ging wieder auf die andere Seite des Jordans, an den Ort, wo Johannes zuerst taufte, und blieb dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Der Aorist von ἀπέρχομαι bezeichnet das Weggehen vom bisherigen Ort. Im Deutschen ergibt „ging“ zusammen mit der Zielangabe eine natürliche und hinreichend klare Formulierung.
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung der Bewegung unmittelbar und idiomatisch wieder.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: auf die andere Seite des Jordans
  rationale: πέραν mit Genitiv bezeichnet die jenseitige Seite. Die Formulierung ist in modernem Deutsch eindeutig und bezeichnet hier wegen des Bewegungsverbs das Ziel der Überquerung.
- source_word: εἰς τὸν τόπον
  choice: an den Ort
  rationale: εἰς bezeichnet die Bewegungsrichtung auf ein Ziel hin; „an den Ort“ ist hier natürliches Deutsch.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: wo Johannes zuerst getauft hatte
  rationale: Die Verbindung aus Imperfekt ἦν, Partizip βαπτίζων und τὸ πρῶτον verweist auf Johannes’ frühere, fortdauernde Tauftätigkeit. Das deutsche Plusquamperfekt stellt das zeitliche Verhältnis zu Jesu Rückkehr natürlich dar, ohne den Vorgang unnötig schwerfällig auszudrücken.
- source_word: ἔμεινεν
  choice: blieb
  rationale: „Blieb“ entspricht μένω direkt und ist in diesem Zusammenhang natürlicher als „hielt sich auf“.
- source_word: ἐκεῖ
  choice: dort
  rationale: Direkte und idiomatische Wiedergabe des Ortsadverbs.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Übersetzung bleibt nahe an der griechischen Satzbewegung, vermeidet jedoch die im Deutschen schwerfällige Form „war am Taufen“. Keine Fußnote ist nötig, da „auf die andere Seite des Jordans“ die räumliche Bedeutung von πέραν τοῦ Ἰορδάνου transparent wiedergibt.
