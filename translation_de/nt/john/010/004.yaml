id: JHN.10.4
reference: John 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: de
  text: Wenn er alle, die ihm gehören, hinausgebracht hat[a], geht er vor ihnen her, und die Schafe folgen ihm, weil sie seine Stimme kennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinausgetrieben“ oder „hinausgeführt“; das griechische Verb kann ausdrücken, dass Tiere aus einem umschlossenen Bereich hinausgetrieben oder hinausgebracht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Wenn
  rationale: Leitet mit dem Konjunktiv einen zeitlich-unbestimmten, hier allgemein beschriebenen Vorgang ein. „Wenn“ ist im Deutschen natürlich und lässt auch den wiederholbaren Sinn offen.
- source_word: τὰ ἴδια πάντα
  choice: alle, die ihm gehören
  rationale: Gibt die substantivierte Wendung idiomatisch wieder und bewahrt den Bezug auf den Besitz des Hirten, ohne das erst später ausdrücklich stehende „die Schafe“ vorwegzunehmen.
- source_word: ἐκβάλῃ
  choice: hinausgebracht hat
  rationale: Bewahrt die Bewegung aus dem umschlossenen Bereich nach draußen. Das Perfekt passt im deutschen Temporalsatz zum vorzeitigen Aorist; eine Fußnote hält die kräftigeren möglichen Bedeutungsnuancen fest.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: geht er vor ihnen her
  rationale: 'Eine natürliche deutsche Wiedergabe des räumlichen Bildes: Der Hirte bewegt sich an der Spitze der Herde.'
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: die Schafe folgen ihm
  rationale: Entspricht der üblichen Bedeutung von πρόβατα und der deutschen Rektion von „folgen“ mit Dativ.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: weil sie seine Stimme kennen
  rationale: „Weil“ bezeichnet klar den Grund; „kennen“ wahrt den Grundsinn von οἶδα und schließt das Wiedererkennen der Stimme ein, ohne es darauf zu verengen.
theological_decisions:
- issue: Hirtenbild und Bedeutungsbreite von ἐκβάλῃ
  choice: „hinausgebracht hat“ im Haupttext
  alternative: „hinausgetrieben hat“ oder „hinausgeführt hat“
  rationale: Der Zusammenhang handelt vom Hirten und seinen eigenen Schafen, nicht von feindseliger Vertreibung. „Hinausgebracht“ vermeidet eine unnötig harte theologische Festlegung, während die Fußnote die mögliche kräftigere Nuance des griechischen Verbs offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf; „alle, die ihm gehören“ ist zugleich verständlich und bewahrt die substantivierte Ausdrucksweise des Ausgangstextes.
