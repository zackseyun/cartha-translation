  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: de
  text: Damals fand in Jerusalem das Fest der Tempelweihe statt.[a] Es war Winter,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch als „Chanukka“ bekannt, das jüdische Fest zur Erinnerung an die erneute Weihe des Tempels.
    reason: Kulturelle Erläuterung und Angabe der geläufigen Festbezeichnung.
lexical_decisions:
- source_word: Ἐγένετο
  choice: fand … statt
  rationale: Das Verb führt hier ein zeitlich stattfindendes Ereignis ein. „fand … statt“ gibt diesen Ereignischarakter im Deutschen natürlich wieder.
- source_word: τότε
  choice: Damals
  rationale: „Damals“ markiert den zeitlichen Übergang knapp und idiomatisch, ohne einen engeren unmittelbaren Anschluss zu erzwingen, wie ihn „dann“ nahelegen könnte.
- source_word: τὰ ἐγκαίνια
  choice: das Fest der Tempelweihe
  rationale: Der Ausdruck bezeichnet das Fest zur Erinnerung an die erneute Weihe des Tempels. Die Übersetzung macht Anlass und Festcharakter für heutige Leser verständlich; die geläufige Bezeichnung „Chanukka“ steht in der Fußnote.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Dies ist die natürliche deutsche Wiedergabe der Ortsangabe.
- source_word: χειμὼν ἦν
  choice: Es war Winter
  rationale: Die schlichte Aussage bewahrt sowohl die zeitliche Angabe als auch die atmosphärische Wirkung des griechischen Satzes.
theological_decisions:
- issue: Identifikation von τὰ ἐγκαίνια
  choice: Im Haupttext als „das Fest der Tempelweihe“ wiedergegeben
  alternative: „die Tempelweihe“ oder „Chanukka“
  rationale: Die Formulierung übersetzt den griechischen Ausdruck transparent, statt ihn ausschließlich durch den geläufigen Festnamen zu ersetzen. „Chanukka“ wird als kulturelle Erläuterung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fest der Tempelweihe“ ist für gewöhnliche Leser unmittelbar verständlich; die kurze Satzstruktur folgt der knappen Erzählweise des griechischen Textes.
