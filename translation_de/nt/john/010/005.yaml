  source_fidelity: 'Der Entwurf gibt die syntaktischen und semantischen Hauptmerkmale des griechischen Textes zuverlässig wieder: ἀλλοτρίῳ als „einem Fremden“, die emphatische Zukunftsverneinung οὐ μή als „auf keinen Fall“, den Gegenkontrast mit „sondern“, φεύξονται ἀπ’ αὐτοῦ als „vor ihm fliehen“ sowie die kollektive Formulierung „die Stimme der Fremden“. Die Metapher bleibt, wie im Ausgangstext, unausgelegt.'
  naturalness: Das Deutsch ist modernes Standarddeutsch und im bildhaften Kontext gut verständlich. Die Stellung „Einem Fremden aber werden sie … folgen“ ist leicht gehoben, aber natürlich und dem würdigen Register angemessen. „Vor ihm fliehen“ ist idiomatisch.
