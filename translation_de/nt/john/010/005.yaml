id: JHN.10.5
reference: John 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: de
  text: Einem Fremden aber werden sie auf keinen Fall folgen[a], sondern vor ihm fliehen, denn sie kennen die Stimme der Fremden nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sie niemals folgen“. Im Griechischen steht eine besonders nachdrückliche Verneinung (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: „Die Stimme kennen“ kann hier auch im Sinn von „die Stimme wiedererkennen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: einem Fremden
  rationale: Der Dativ Singular bezeichnet im Bild vom Hirten jemanden, der den Schafen nicht vertraut ist bzw. nicht zu ihnen gehört. „Fremder“ bewahrt das Bild, ohne ethnische Fremdheit zu betonen.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: werden sie auf keinen Fall folgen
  rationale: οὐ μή mit Futur ist eine nachdrückliche Verneinung. „Auf keinen Fall“ gibt diese Verstärkung in natürlichem modernem Deutsch wieder.
- source_word: ἀκολουθήσουσιν
  choice: folgen
  rationale: Im Zusammenhang von Schafen und Hirten ist „folgen“ die direkte und idiomatische Wiedergabe.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: vor ihm fliehen
  rationale: φεύγω mit ἀπό bezeichnet das Fliehen bzw. Sich-Entfernen von jemandem. Deutsch verwendet hier idiomatisch „vor jemandem fliehen“.
- source_word: οἴδασι
  choice: kennen ... nicht
  rationale: Bei einer Stimme ist „kennen“ im Deutschen natürlich und lässt zugleich die mögliche Nuance des Wiedererkennens bestehen.
- source_word: τῶν ἀλλοτρίων
  choice: der Fremden
  rationale: Der Genitiv Plural bezeichnet die Stimmen der Klasse der Fremden und wird formal direkt wiedergegeben.
- source_word: φωνήν
  choice: Stimme
  rationale: φωνή meint hier die identifizierbare Stimme bzw. den Ruf; „Stimme“ wahrt die wörtliche und relationale Dimension.
- source_word: δὲ ... ἀλλὰ
  choice: aber ... sondern
  rationale: Die Partikeln markieren den Gegensatz zwischen dem ausgeschlossenen Folgen und der gegenteiligen Reaktion. „Aber ... sondern“ bildet diese Struktur idiomatisch ab.
theological_decisions:
- issue: Bildhafte Aussage von Schafen, Hirten und Fremden
  choice: Das Bild bleibt ohne allegorische Ausdeutung stehen.
  alternative: „Fremder“ im Haupttext ausdrücklich als falschen Lehrer oder unrechtmäßigen Führer deuten.
  rationale: Der Vers identifiziert den Fremden an dieser Stelle nicht ausdrücklich. Eine Konkretisierung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den deutlichen Gegensatz des Griechischen; „auf keinen Fall“ vermittelt die emphatische Verneinung ohne altertümliche Formulierung.
