id: JHN.10.24
reference: John 10:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: de
  text: 'Da umringten ihn die Juden[a] und sagten immer wieder zu ihm: »Wie lange lässt du uns noch im Ungewissen[b]? Wenn du der Messias bist, dann sag es uns frei heraus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Johannesevangelium kann »die Juden« je nach Zusammenhang eine bestimmte Gruppe jüdischer Autoritäten oder Gegner Jesu bezeichnen, nicht das jüdische Volk als Ganzes.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »Wie lange hebst du unsere Seele empor?« Die griechische Wendung bedeutet hier, jemanden in Ungewissheit oder Spannung zu halten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: umringten
  rationale: Das Verb bezeichnet ein Umgeben oder Einkreisen. »Umringten« ist im Deutschen natürlich und bewahrt den möglicherweise konfrontativen räumlichen Sinn.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die Erzählung folgernd beziehungsweise weiterführend fort. »Da« verbindet den Satz idiomatisch mit dem vorausgehenden Zusammenhang.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Formulierung entspricht dem griechischen Wortlaut und legt nicht im Haupttext fest, dass ausschließlich führende Autoritäten gemeint seien. Die mögliche kontextuelle Eingrenzung wird in einer Fußnote erläutert.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt zeichnet die Äußerung als Teil der fortlaufenden Szene. Eine künstliche Verlaufsform ist im Deutschen nicht erforderlich.
- source_word: Ἕως πότε
  choice: Wie lange
  rationale: Dies ist die natürliche deutsche Entsprechung der griechischen Zeitfrage.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: lässt du uns noch im Ungewissen
  rationale: Die wörtlich bildhafte Wendung mit ψυχή und αἴρω bezeichnet hier das Hinhalten in Unsicherheit. Die idiomatische deutsche Wiedergabe vermittelt den Sinn, während die Fußnote das Bild bewahrt.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier als jüdischer Erwartungs- und Hoheitstitel. »Messias« macht diese Titelfunktion im Deutschen deutlich.
- source_word: εἰπὲ ἡμῖν
  choice: sag es uns
  rationale: Der Aoristimperativ ist eine unmittelbare Aufforderung; das im Deutschen nötige Objekt »es« ergibt sich eindeutig aus der vorausgehenden Bedingung.
- source_word: παρρησίᾳ
  choice: frei heraus
  rationale: Die Wendung bezeichnet offenes, freimütiges und unzweideutiges Reden. »Frei heraus« ist eine natürliche deutsche Formulierung für die verlangte eindeutige Auskunft.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck steht hier als jüdischer Titel in einer direkten Frage nach Jesu Identität und nicht als namensähnliche Bezeichnung. »Messias« bewahrt diesen Zusammenhang.
- issue: Bezug von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die jüdischen führenden Männer / die Judäer
  rationale: Der Vers selbst grenzt die bezeichnete Gruppe nicht ausdrücklich auf Amtsträger oder Judäer ein. Deshalb bleibt der Wortlaut im Haupttext allgemein; eine Fußnote weist darauf hin, dass der Ausdruck im johanneischen Kontext eine bestimmte Gruppe von Gegnern bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Umringten« erhält die körperlich-räumliche Spannung der Szene; »im Ungewissen« und »frei heraus« geben die griechischen Wendungen idiomatisch wieder, ohne ihre inhaltliche Schärfe abzuschwächen.
