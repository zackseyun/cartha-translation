  source_fidelity: Die inhaltliche Wiedergabe trifft den Sinn des Verses grundsätzlich. »Was er ihnen damit sagte« legt jedoch stärker auf die beabsichtigte Bedeutung aus, während der griechische Wortlaut zunächst auf das von Jesus Gesagte zielt. Die Wiederholung von »ihnen« ist im Ausgangstext vorhanden und kann im Deutschen klar wiedergegeben werden.
  naturalness: »Jesus gebrauchte ihnen gegenüber dieses Bildwort« ist im modernen Standarddeutsch unnötig schwerfällig. »Jesus sagte ihnen dieses Bildwort« ist einfacher, idiomatisch und bewahrt die Aussage. Auch die Fußnotenformulierung »zuvor gebrauchte Hirtenrede« klingt unnatürlich.
  terminology: »Bildwort« ist als offene Wiedergabe von παροιμία vertretbar und vermeidet eine zu enge Festlegung auf »Gleichnis« oder »Sprichwort«. Die Alternativen in der Fußnote sind sinnvoll. Der Bezug sollte neutral als vorangehende Rede vom Hirten und den Schafen beschrieben werden.
