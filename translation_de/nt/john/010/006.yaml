  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: de
  text: Jesus sagte ihnen dieses Bildwort[a]; sie aber verstanden nicht, was er ihnen sagte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gleichnis«, »Sinnbild« oder »Sprichwort«. Das griechische Wort bezeichnet allgemein eine bildhafte oder verhüllte Aussage; hier bezieht es sich auf die vorangehende Rede vom Hirten und den Schafen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: Bildwort
  rationale: Das griechische Wort bezeichnet eine bildhafte oder verhüllte Rede und kann je nach Zusammenhang auch mit »Gleichnis«, »Sinnbild« oder »Sprichwort« wiedergegeben werden. »Bildwort« erfasst hier die nicht wörtlich gemeinte Hirtenrede, ohne sie vorschnell einer engeren Gattung zuzuordnen.
- source_word: εἶπεν
  choice: gebrauchte
  rationale: In Verbindung mit »dieses Bildwort« ist »gebrauchte« im Deutschen idiomatisch und gibt wieder, dass Jesus diese Redeform ihnen gegenüber verwendete.
- source_word: ἐκεῖνοι δὲ
  choice: sie aber
  rationale: Die Formulierung wahrt den ausdrücklich gesetzten Gegensatz zwischen Jesus und seinen Zuhörern und klingt zugleich natürlich.
- source_word: οὐκ ἔγνωσαν
  choice: verstanden nicht
  rationale: Im Zusammenhang geht es nicht um bloßes Wissen, sondern darum, dass die Zuhörer den Sinn von Jesu bildhafter Rede nicht erfassten.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: was er ihnen damit sagte
  rationale: 'Die griechische Wendung ist wörtlich sperrig (etwa: »was das war, was er zu ihnen redete«). Die deutsche Fassung gibt verständlich wieder, dass ihnen der Inhalt beziehungsweise Sinn seiner Worte unklar blieb; »damit« stellt den Bezug zum Bildwort her.'
