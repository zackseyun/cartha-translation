id: JHN.10.8
reference: John 10:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: de
  text: Alle, die vor mir[a] kamen, sind Diebe und Räuber; doch die Schafe hörten nicht auf sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir voraus“. Die Wendung kann zeitlich („vor mir“) verstanden werden oder von Menschen sprechen, die Jesus vorausgingen und unabhängig von ihm Autorität beanspruchten. Im Zusammenhang sind offenbar falsche Hirten gemeint, nicht unterschiedslos alle früheren Diener Gottes.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Alle, die
  rationale: Die idiomatische Verbindung bezeichnet umfassend alle Angehörigen der hier gemeinten Gruppe; „Alle, die“ ist im Deutschen knapp und natürlich.
- source_word: ἦλθον
  choice: kamen
  rationale: Der Aorist wird hier sachgerecht mit dem deutschen Präteritum wiedergegeben, ohne eine im Griechischen nicht ausdrücklich bezeichnete fortdauernde Wirkung hinzuzufügen.
- source_word: πρὸ ἐμοῦ
  choice: vor mir
  rationale: Die Wendung kann zeitlich „vor mir“ bedeuten, lässt im Zusammenhang aber auch die Nuance „mir voraus“ zu. Die Hauptfassung bewahrt die naheliegende und formal offene Wiedergabe.
- source_word: κλέπται
  choice: Diebe
  rationale: „Diebe“ ist die übliche Entsprechung und passt zum Bild des unrechtmäßigen Eindringens und Wegnehmens.
- source_word: λῃσταί
  choice: Räuber
  rationale: „Räuber“ wahrt die Unterscheidung zu „Diebe“ und kann eine gewaltsamere oder räuberische Bedrohung bezeichnen, ohne sie übermäßig zu präzisieren.
- source_word: ἀλλ’
  choice: doch
  rationale: „Doch“ gibt den adversativen Übergang in diesem Satz natürlich und würdevoll wieder.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: hörten nicht auf sie
  rationale: ἀκούω mit Genitiv kann nicht nur das akustische Hören, sondern auch das beachtende Hören ausdrücken. „Auf jemanden hören“ passt besonders zum Motiv der Schafe, die eine Stimme erkennen und ihr folgen.
- source_word: τὰ πρόβατα
  choice: die Schafe
  rationale: Dies ist die direkte und im Hirtenbild geläufige deutsche Entsprechung.
theological_decisions:
- issue: Reichweite und Sinn von „alle, die vor mir kamen“
  choice: Die breite Formulierung wird im Haupttext als „Alle, die vor mir kamen“ bewahrt.
  alternative: „Alle, die mir voraus kamen“, insbesondere solche, die unabhängig von Jesus Hirten- oder Autoritätsansprüche erhoben.
  rationale: Der griechische Wortlaut ist allgemein formuliert. Der Zusammenhang spricht jedoch von falschen Hirten und zwingt nicht zu der Deutung, Jesus verurteile sämtliche früheren, von Gott gesandten Diener. Diese Spannung wird nicht durch eine einschränkende Ergänzung im Haupttext aufgelöst, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Hörten nicht auf sie“ bringt im Deutschen das aufmerksame und gehorsame Hören im Hirtenbild natürlich zum Ausdruck. Die Fußnotenmarke steht unmittelbar bei der mehrdeutigen Wendung.
