  source_fidelity: 'Der deutsche Haupttext gibt den griechischen Satz vollständig und in seiner Struktur zutreffend wieder: πάντες ὅσοι mit „Alle, die“, Aorist ἦλθον mit „kamen“, πρὸ ἐμοῦ mit „vor mir“, die Paarung κλέπται καὶ λῃσταί mit „Diebe und Räuber“ sowie ἀκούω mit Genitiv idiomatisch als „auf sie hören“. Die Fußnote bewahrt die kontextuell relevante Offenheit von πρὸ ἐμοῦ, ohne den Haupttext interpretativ einzuengen.'
  naturalness: „Alle, die vor mir kamen, sind Diebe und Räuber; doch die Schafe hörten nicht auf sie“ ist flüssiges modernes Standarddeutsch und wahrt einen angemessen würdigen, aber nicht altertümlichen biblischen Registerton. „Auf jemanden hören“ trifft im Deutschen die beachtende bzw. gehorsame Nuance im Bildfeld gut.
  terminology: „Diebe und Räuber“ erhält die im Griechischen bestehende Unterscheidung, ohne λῃσταί unnötig als gewalttätige „Banditen“ zu konkretisieren. „Schafe“ und „Hirten“ in der erläuternden Fußnote sind im johanneischen Kontext terminologisch stimmig. Die Fußnotenmarke ist korrekt unmittelbar an der mehrdeutigen Wendung platziert.
