  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: de
  text: Und dort glaubten viele an ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche koordinierende Konjunktion verbindet den Vers mit dem vorausgehenden Bericht, ohne einen stärkeren Folgezusammenhang ausdrücklich zu machen.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet viele Menschen; im Deutschen ist „viele“ knapp und natürlich.
- source_word: ἐπίστευσαν
  choice: kamen zum Glauben
  rationale: Der Aorist berichtet hier ein eintretendes Glauben im Fortgang der Erzählung. Die idiomatische deutsche Wendung gibt diesen Vorgang natürlich wieder, ohne das Glaubensverb unnötig auszudeuten.
- source_word: εἰς αὐτόν
  choice: an ihn
  rationale: Bei πιστεύω εἰς bezeichnet die Präpositionalverbindung denjenigen, auf den der Glaube gerichtet ist. „An ihn glauben“ ist die etablierte und natürliche deutsche Entsprechung.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor genannten Aufenthaltsort Jesu und wird direkt mit „dort“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von πιστεύω εἰς αὐτόν im Zusammenhang des Glaubens an Jesus
  choice: kamen zum Glauben an ihn
  alternative: glaubten an ihn
  rationale: Beide Formulierungen bewahren die persönliche Ausrichtung des Glaubens auf Jesus. „Kamen zum Glauben“ passt natürlich zum erzählerisch berichteten Eintritt vieler Menschen in den Glauben, ohne Art oder Tiefe dieses Glaubens über den griechischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Wortstellung hebt mit „dort“ wie der griechische Schluss des Satzes den Ort des Geschehens hervor.
