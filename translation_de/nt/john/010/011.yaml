  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: de
  text: Ich bin der gute Hirte.[a] Der gute Hirte gibt sein Leben für die Schafe hin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der edle Hirte“; das griechische Wort kann auch „edel“, „vortrefflich“ oder „vorbildlich“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „legt seine Seele für die Schafe nieder“; die griechische Wendung bedeutet, dass er sein Leben für sie hingibt. „Für“ kann hier auch „zugunsten von“ oder „für das Wohl von“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die natürliche deutsche Selbstidentifikation gibt die ausdrückliche, leicht betonte Ich-Aussage wieder, ohne eine mögliche theologische Anspielung im Wortlaut zu überdehnen.
- source_word: ποιμήν
  choice: Hirte
  rationale: „Hirte“ entspricht dem unmittelbaren Bild; „Pastor“ würde spätere kirchliche Bedeutungen eintragen.
- source_word: καλός
  choice: gut
  rationale: „Gut“ ist idiomatisch und bewahrt die Bedeutungsbreite von moralisch gut, edel und vorbildlich.
- source_word: ψυχήν
  choice: Leben
  rationale: In der Verbindung τίθησιν τὴν ψυχὴν bezeichnet ψυχή das eigene Leben, nicht speziell die immaterielle Seele.
- source_word: τίθησιν
  choice: gibt … hin
  rationale: „Sein Leben hingeben“ ist eine natürliche deutsche Wiedergabe der griechischen Wendung und erhält den Gedanken freiwilliger Selbsthingabe.
- source_word: ὑπὲρ
  choice: für
  rationale: „Für“ wahrt knapp die stellvertretende beziehungsweise zugunsten anderer gerichtete Bedeutungsbreite, ohne sie auf eine bestimmte Sühnetheorie festzulegen.
- source_word: προβάτων
  choice: die Schafe
  rationale: Der Artikel wird wiedergegeben; ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
theological_decisions:
- issue: Tragweite der Selbstidentifikation Ἐγώ εἰμι
  choice: Schlicht als „Ich bin“ wiedergegeben.
  alternative: „Ich selbst bin“ oder eine ausdrücklich auf den Gottesnamen bezogene Formulierung.
  rationale: Die Wendung bildet hier grammatisch eine Selbstidentifikation mit Prädikatsnomen. Ein weiterer johanneischer Nachklang bleibt möglich, wird aber nicht erklärend in den Text eingetragen.
- issue: Bedeutung von καλός im Hirtentitel
  choice: „der gute Hirte“
  alternative: „der edle Hirte“ oder „der vorbildliche Hirte“
  rationale: Die vertraute Formulierung ist sprachlich natürlich und lässt die Nuancen von Güte, Vortrefflichkeit und Vorbildlichkeit offen.
- issue: Bedeutung von ὑπὲρ τῶν προβάτων
  choice: „für die Schafe“
  alternative: „zugunsten der Schafe“ oder „für die Schafe eintretend“
  rationale: Die knappe Präposition hält benefaktive und stellvertretende Aspekte zusammen, ohne eine einzelne Lehrformulierung vorzugeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle Bezeichnung „der gute Hirte“ bleibt erhalten; „gibt sein Leben hin“ klingt natürlich und bildet die wiederkehrende johanneische Wendung angemessen ab.
