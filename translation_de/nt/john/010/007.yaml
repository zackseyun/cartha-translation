  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: de
  text: 'Darum sagte Jesus noch einmal zu ihnen: »Amen, amen, ich sage euch: Ich bin die Tür der Schafe.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Tor der Schafe« beziehungsweise »das Tor für die Schafe«. Das griechische Wort kann »Tür« oder »Tor« bedeuten; der Genitiv lässt die genaue Beziehung zu den Schafen offen.'
    reason: Lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die folgernde Fortsetzung nach dem Unverständnis der Zuhörer in Vers 6; »darum« ist natürlich und bewahrt den logischen Zusammenhang.
- source_word: πάλιν
  choice: noch einmal
  rationale: Gibt die Wiederholung der Erklärung idiomatisch und unmittelbar wieder.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die für das Johannesevangelium charakteristische doppelte Formel, ihren feierlichen Nachdruck und die Wiederholung des griechischen Wortlauts.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Formale und zugleich natürliche Wiedergabe der Redeeinleitung.
- source_word: ὅτι
  choice: nicht eigens wiedergegeben
  rationale: Die deutsche direkte Rede benötigt hier kein zusätzliches »dass«; der Inhaltssatz ist vollständig erhalten.
- source_word: ἐγώ εἰμι
  choice: Ich bin
  rationale: Natürliche Standardwiedergabe der betonten Selbstidentifikation; das vorangestellte deutsche »Ich« trägt den erforderlichen Akzent.
- source_word: θύρα
  choice: Tür
  rationale: Die grundlegende Bedeutung ist »Tür«, daneben im Kontext einer Einfriedung auch »Tor«. Die Hauptfassung bleibt lexikalisch eng; die kontextuelle Alternative wird in der Fußnote genannt.
- source_word: τῶν προβάτων
  choice: zu den Schafen
  rationale: Der Genitiv bezeichnet hier die Beziehung der Tür zu den Schafen. »Zu den Schafen« klingt im Deutschen natürlicher als »der Schafe«, ohne die genaue Art dieser Beziehung vorschnell als Nutzen oder Besitz festzulegen.
theological_decisions:
- issue: Metaphorische Selbstaussage Jesu
  choice: Ich bin die Tür zu den Schafen
  alternative: Ich bin das Tor für die Schafe
  rationale: Die Übersetzung erhält das Bild eines Zugangs im Hirtenkontext, ohne dessen theologische Bedeutung paraphrasierend auszulegen. »Tür« bleibt nahe am Lexem; »Tor« ist kontextuell möglich.
- issue: Beziehung des Genitivs τῶν προβάτων
  choice: zu den Schafen
  alternative: für die Schafe / der Schafe
  rationale: Die Formulierung wahrt die im Griechischen offene associative Beziehung. Sie legt weder ausschließlich eine Zweckbeziehung (»für«) noch eine Besitzbeziehung (»der Schafe«) fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel »Amen, amen« bewahrt den markanten johanneischen Sprachklang; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
