source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: de
  text: Vater, ich will, dass diejenigen, die du mir gegeben hast,[a] auch sie bei mir sind, wo ich bin, damit sie meine Herrlichkeit sehen, die du mir gegeben hast; denn du hast mich vor der Grundlegung der Welt geliebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen im Neutrum Singular: „das, was du mir gegeben hast“. Der Ausdruck bezeichnet hier kollektiv die Menschen, die der Vater dem Sohn gegeben hat; dies wird durch das anschließende „auch sie/jene“ und das Verb im Plural deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede wird ohne ein im Griechischen nicht vorhandenes Possessivpronomen natürlich und würdevoll wiedergegeben.
- source_word: ὃ δέδωκάς μοι
  choice: diejenigen, die du mir gegeben hast
  rationale: Das Neutrum Singular ὃ ist hier kollektiv auf Menschen bezogen, wie das folgende pluralische κἀκεῖνοι ὦσιν zeigt. „Diejenigen, die“ gibt den persönlichen Plural im Deutschen eindeutig wieder; eine Fußnote bewahrt die auffällige Form des griechischen Ausdrucks.
- source_word: δέδωκάς
  choice: du mir gegeben hast
  rationale: Das deutsche Perfekt bringt die abgeschlossene Gabe mit ihrer fortdauernden Bedeutung im Zusammenhang angemessen zum Ausdruck.
- source_word: θέλω
  choice: ich will
  rationale: Im Deutschen bezeichnet „ich will“ hier klar Jesu entschiedenen Wunsch und wird anders als englisches „I will“ nicht als bloße Futurform missverstanden. Die Formulierung bewahrt die starke Willensäußerung im Gebetszusammenhang.
- source_word: ἵνα
  choice: dass / damit
  rationale: Das erste ἵνα führt den Inhalt des Willens ein; das zweite bezeichnet Ziel oder Folge. Die unterschiedlichen deutschen Konjunktionen bilden diese Funktionen natürlich ab.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: wo ich bin
  rationale: Dies ist die natürliche deutsche Wiedergabe; das ausdrücklich gesetzte ἐγώ lässt sich hier ohne schwerfälliges „ich selbst“ ausreichend durch die normale Personalform vermitteln.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: auch dort bei mir sind
  rationale: „Auch“ erhält die additive Kraft von κἀκεῖνοι; „dort bei mir“ verbindet den Bezug auf den Ort mit der Gemeinschaft mit Jesus idiomatisch.
- source_word: θεωρῶσιν
  choice: sehen
  rationale: „Sehen“ ist eine klare, gegenwärtige Wiedergabe von θεωρέω. Das gehobenere „schauen“ wäre möglich, ist aber für gewöhnliche Leser weniger neutral.
- source_word: τὴν δόξαν τὴν ἐμήν
  choice: meine Herrlichkeit
  rationale: Die idiomatische Form wahrt den ausdrücklich possessiven Charakter des griechischen Ausdrucks.
- source_word: ἣν δέδωκάς μοι
  choice: die du mir gegeben hast
  rationale: Der Relativsatz bestimmt die Herrlichkeit näher; das Perfekt gibt den griechischen Perfektaspekt im Deutschen passend wieder.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ markiert den begründenden Zusammenhang klar und würdevoll, ohne ihn interpretierend auszubauen.
- source_word: ἠγάπησάς με πρὸ καταβολῆς κόσμου
  choice: du hast mich vor der Grundlegung der Welt geliebt
  rationale: Die Formulierung wahrt die ausdrückliche zeitliche Aussage vor der Weltschöpfung. „Grundlegung der Welt“ bildet die Metapher καταβολή genauer ab als eine bloße Umschreibung mit „Erschaffung“.
theological_decisions:
- issue: Die vorweltliche Liebe des Vaters zum Sohn
  choice: Die zeitliche Aussage „vor der Grundlegung der Welt“ wird uneingeschränkt beibehalten.
  alternative: Eine metaphorische oder abschwächende Umschreibung der vorweltlichen Aussage.
  rationale: Der griechische Text stellt die Liebe des Vaters zum Sohn ausdrücklich in die Zeit vor der Weltgründung. Die Übersetzung bewahrt diese Aussage, ohne sie dogmatisch zu erweitern.
- issue: Die Kraft von θέλω im Gebet Jesu
  choice: „ich will“
  alternative: „ich wünsche“ oder „ich möchte“
  rationale: „Ich will“ wahrt die starke volitive Kraft des Verbs. Im Deutschen klingt es nicht futurisch, und die Gebetsform selbst verhindert, dass die Aussage als bloßer Befehl missverstanden werden muss.
- issue: Dem Sohn gegebene Herrlichkeit
  choice: „meine Herrlichkeit, die du mir gegeben hast“
  alternative: Eine harmonisierende Umschreibung, die entweder den Besitz oder das Gegebensein der Herrlichkeit abschwächt.
  rationale: Der Text spricht zugleich von „meiner“ Herrlichkeit und davon, dass der Vater sie dem Sohn gegeben hat. Diese theologische Spannung bleibt unverändert stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des griechischen Gebets, ohne unnötig altertümliche Wörter zu verwenden. „Grundlegung der Welt“ bewahrt das biblische Bild und bleibt zugleich verständlich.
