  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: de
  text: Ich bitte aber nicht nur für sie, sondern auch für die, die durch ihr Wort[a] an mich glauben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihre Botschaft“ beziehungsweise „durch ihre Verkündigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ich bitte
  rationale: Im Gebet Jesu an den Vater bezeichnet ἐρωτάω ein Bitten. „Ich bitte“ ist im Deutschen natürlich und wahrt den personalen Bezug, ohne die allgemeinere Bedeutung durch „ich bete“ einzuengen.
- source_word: περὶ τούτων
  choice: für sie
  rationale: περί mit Genitiv bezeichnet hier den Gegenstand der Bitte. Im Deutschen ist „für sie bitten“ idiomatischer als „über sie bitten“; das Pronomen verweist zurück auf die unmittelbar zuvor genannten Jünger, ohne sie ausdrücklich zu identifizieren.
- source_word: μόνον
  choice: nur
  rationale: „Nur“ gibt die Einschränkung des Umfangs der Bitte knapp und natürlich wieder.
- source_word: ἀλλὰ καὶ
  choice: sondern auch
  rationale: Nach der deutschen Negation „nicht nur“ bildet „sondern auch“ die natürliche korrelative Fortsetzung und bewahrt Gegensatz und Erweiterung.
- source_word: τῶν πιστευόντων
  choice: die, die … glauben
  rationale: Die substantivierte Präsenspartizipialform wird verbal wiedergegeben. Dadurch bleibt offen, ob gegenwärtig oder künftig Glaubende im Blick sind; ein zusätzliches „werden“ würde den griechischen Wortlaut zeitlich stärker festlegen.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: durch ihr Wort
  rationale: λόγος kann „Wort“, „Botschaft“ oder „Verkündigung“ bedeuten. „Wort“ wahrt die johanneische Ausdrucksweise und die formale Nähe; eine Fußnote nennt die verständliche Bedeutungsalternative.
- source_word: εἰς ἐμέ
  choice: an mich
  rationale: πιστεύειν εἰς wird im Deutschen idiomatisch mit „an jemanden glauben“ wiedergegeben. Dies bewahrt die personale Ausrichtung des Glaubens.
- source_word: Οὐ … μόνον
  choice: nicht nur
  rationale: Die deutsche korrelative Konstruktion „nicht nur … sondern auch“ gibt die griechische Negation und Einschränkung klar und natürlich wieder.
theological_decisions:
- issue: Reichweite der Bitte Jesu über die unmittelbar angesprochenen Jünger hinaus
  choice: Die Formulierung schließt Menschen ein, die durch das Zeugnis der Jünger an Jesus glauben, ohne den Zeitpunkt ihres Glaubens ausdrücklich festzulegen.
  alternative: Ausdrücklich von künftig Glaubenden sprechen oder die Aussage auf einen bereits entstehenden engeren Kreis begrenzen.
  rationale: Das Präsenspartizip πιστευόντων bezeichnet Glaubende, während der Gegensatz zu τούτων die Bitte über die unmittelbare Gruppe hinaus erweitert. Da der griechische Text kein ausdrückliches Futur enthält, bleibt die zeitliche Reichweite in der Übersetzung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich bitte für sie“ ist idiomatisch und für ein Gebet verständlich. Die Konstruktion „die, die“ ist bewusst alltagssprachlich klarer als „diejenigen, die“. Der abschließende Beistrich entspricht dem fortlaufenden Satz des Ausgangstextes.
