id: JHN.17.9
reference: John 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: de
  text: Ich bitte für sie[a]. Ich bitte nicht für die Welt, sondern für diejenigen, die du mir gegeben hast, denn sie gehören dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Bezug auf sie“. Die griechische Präposition kann hier sowohl den Gegenstand als auch die Begünstigten der Bitte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ich bitte
  rationale: Das Verb bedeutet hier „bitten“ bzw. „ersuchen“. Im Gebetskontext ist „ich bitte“ natürlich, ohne das stärker religiös geprägte „ich bete“ in den Wortlaut einzutragen.
- source_word: περὶ αὐτῶν
  choice: für sie
  rationale: περί mit Genitiv kann „über/betreffs“ bedeuten, bezeichnet bei einem Bittgebet hier aber idiomatisch die Personen, für die Jesus bittet. Die Alternative wird in einer Fußnote bewahrt.
- source_word: τοῦ κόσμου
  choice: die Welt
  rationale: Bewahrt den johanneischen Ausdruck und seine theologische Spannung, ohne „Welt“ als Menschheit oder gottfeindliches System interpretierend einzuengen.
- source_word: ὧν δέδωκάς μοι
  choice: die, die du mir gegeben hast
  rationale: Die substantivische Relativkonstruktion bezeichnet eine Personengruppe. Das deutsche Perfekt gibt die vollzogene Gabe mit ihrer fortdauernden Bedeutung angemessen wieder.
- source_word: ὅτι σοί εἰσιν
  choice: denn sie gehören dir
  rationale: ὅτι ist kausal; „denn“ verbindet die Begründung würdig und natürlich. „Sie gehören dir“ gibt die possessive Dativkonstruktion idiomatisch wieder.
- source_word: ἐγώ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen wird erhalten und trägt zusammen mit der Wiederholung die kontrastive Struktur.
theological_decisions:
- issue: Wiedergabe von ἐρωτῶ als Gebetssprache
  choice: „ich bitte“ statt „ich bete“
  alternative: „ich bete für sie“
  rationale: Obwohl Jesus zum Vater betet, bezeichnet ἐρωτάω zunächst das Bitten. Die Übersetzung lässt den Gebetskontext wirken, ohne ihn lexikalisch zu verstärken.
- issue: Bedeutungsumfang von „die Welt“
  choice: Unverändert „die Welt“
  alternative: „die Menschheit“ oder „die ungläubige Welt“
  rationale: κόσμος ist bei Johannes vielschichtig. Eine nähere Bestimmung würde die Spannung zwischen der Welt und den vom Vater Gegebenen einseitig auflösen.
- issue: Sinn von περί beim Bitten
  choice: Fürbittend „für“ im Haupttext
  alternative: „in Bezug auf“ bzw. „wegen“
  rationale: Im unmittelbaren Gebetszusammenhang ist „für“ im Deutschen am natürlichsten; die weitere semantische Möglichkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Ich bitte“ und der Gegensatz „nicht … sondern“ bilden die klare Parallelstruktur des griechischen Satzes nach. „Denn sie gehören dir“ ist idiomatischer als „denn sie sind dein“, ohne den possessiven Sinn auszuweiten.
