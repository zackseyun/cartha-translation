  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: de
  text: Und ich[a] habe ihnen die Herrlichkeit gegeben, die du mir gegeben hast, damit sie eins seien, wie wir eins sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch ich habe ihnen die Herrlichkeit gegeben, die du mir gegeben hast.« Das griechische κἀγώ kann einen zusätzlichen Akzent tragen: »auch ich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Und ich
  rationale: Die Krasis aus καί und ἐγώ verbindet den Satz mit dem vorherigen Zusammenhang und nennt das betonte Subjekt ausdrücklich. Eine additive Wiedergabe mit »auch« ist möglich und wird in der Fußnote bewahrt.
- source_word: τὴν δόξαν
  choice: die Herrlichkeit
  rationale: Im Johannesevangelium bezeichnet δόξα häufig die göttliche Herrlichkeit und nicht lediglich menschliche Ehre. »Herrlichkeit« bewahrt dieses theologische Gewicht.
- source_word: ἣν δέδωκάς μοι
  choice: die du mir gegeben hast
  rationale: Das deutsche Perfekt gibt die vollendete Gabe mit fortdauernder Bedeutung natürlich wieder; der Relativsatz bleibt eng auf »Herrlichkeit« bezogen.
- source_word: δέδωκα αὐτοῖς
  choice: habe ihnen ... gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit bleibender Wirkung. Die Stellung des Dativobjekts ist im modernen Deutsch natürlich.
- source_word: ἵνα ὦσιν
  choice: damit sie ... sind
  rationale: »Damit« wahrt die Ziel- beziehungsweise Ergebnisrichtung von ἵνα. Der Indikativ nach »damit« ist gegenwärtiges, verständliches Deutsch, ohne den Zweckcharakter aufzugeben.
- source_word: ἓν
  choice: eins
  rationale: Das substantivierte Neutrum »eins« bewahrt die knappe Formulierung des griechischen Textes und bezeichnet Einheit, ohne sie als Einheit einer Person oder als bloß organisatorische Einigkeit auszulegen.
- source_word: καθὼς
  choice: wie
  rationale: »Wie« stellt den Vergleich klar und idiomatisch her; ein verstärkendes »genauso wie« wäre möglich, aber nicht erforderlich.
- source_word: ἡμεῖς ἕν
  choice: wir eins sind
  rationale: Die im Griechischen elliptische Kopula muss im Deutschen ergänzt werden. Die Formulierung wahrt den theologisch gewichtigen Vergleich, ohne die Art der Einheit näher zu bestimmen.
theological_decisions:
- issue: Art der Einheit der Glaubenden im Vergleich zur Einheit von Vater und Sohn
  choice: »damit sie eins sind, wie wir eins sind«
  alternative: Die Einheit ausdrücklich als rein zwischenmenschlich, institutionell, missionarisch oder als Teilhabe am göttlichen Leben bestimmen
  rationale: Der Vers zieht einen wirklichen Vergleich, erläutert hier aber nicht dessen genaue Art. Die offene, textnahe Formulierung bewahrt diese theologische Spannung und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Herrlichkeit« hält die johanneische Begrifflichkeit fest; »eins sein« bleibt bewusst knapp und deutungsoffen. Die parallelen Perfektformen spiegeln die beiden griechischen Perfektformen und klingen im Deutschen natürlich.
