id: JHN.17.1
reference: John 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: de
  text: 'Dies sagte Jesus, und er erhob seine Augen zum Himmel und sagte: „Vater, die Stunde ist gekommen. Verherrliche deinen Sohn, damit der Sohn dich verherrlicht“,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: Dies sagte
  rationale: Das neutrale Pluralpronomen verweist auf die vorausgehenden Worte zurück. Im Deutschen gibt „Dies“ den zusammenfassenden Rückverweis natürlicher wieder als „Diese Dinge“; ἐλάλησεν wird idiomatisch mit „sagte“ übersetzt.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Dann erhob er seine Augen
  rationale: Das Aoristpartizip bezeichnet die der Rede vorausgehende beziehungsweise sie begleitende Geste. Ein deutscher Hauptsatz mit „Dann“ ist natürlich und bewahrt die zeitliche Abfolge sowie das konkrete Bild.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: εἰς bezeichnet hier die Richtung des Blicks; „zum Himmel“ ist die übliche und genaue deutsche Wendung.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ enthält kein ausdrückliches Possessivpronomen; daher wird kein „mein“ ergänzt.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: die Stunde ist gekommen
  rationale: Das Perfekt bezeichnet das nun eingetretene, entscheidende Kommen. „Stunde“ bewahrt zugleich den johanneischen Leitbegriff.
- source_word: δόξασόν
  choice: Verherrliche
  rationale: „Verherrlichen“ erhält das Bedeutungsfeld von δοξάζω, das Ehre, Herrlichkeit und deren Offenbarung umfasst, besser als das engere „ehren“.
- source_word: σου τὸν υἱόν
  choice: deinen Sohn
  rationale: Der Genitiv σου wird im Deutschen natürlich possessiv wiedergegeben. Die Großschreibung kennzeichnet „Sohn“ im Kontext als christologische Bezeichnung.
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: damit der Sohn dich verherrlicht
  rationale: „Damit“ gibt die Ziel- beziehungsweise Folgebeziehung von ἵνα wieder. Der Konjunktiv nach ἵνα verlangt im heutigen Deutschen kein Modalverb; der Präsenssatz ist idiomatisch und bewahrt die Aussage.
theological_decisions:
- issue: Wechselseitige Verherrlichung von Vater und Sohn
  choice: „Verherrliche deinen Sohn, damit der Sohn dich verherrlicht“
  alternative: „Ehre deinen Sohn, damit er dir Ehre bringt“
  rationale: Die Formulierung erhält die Wiederholung desselben Verbs und damit die theologische Spannung und Symmetrie des griechischen Textes, ohne die Art der Verherrlichung erklärend festzulegen.
- issue: Großschreibung von „Sohn“
  choice: „Sohn“ wird großgeschrieben
  alternative: Kleinschreibung als gewöhnliche Verwandtschaftsbezeichnung
  rationale: Im Kontext bezeichnet der Ausdruck Jesus in seiner einzigartigen Beziehung zum Vater. Die im Deutschen ohnehin substantivische Großschreibung trägt keine zusätzliche dogmatische Auslegung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion. „Erhob seine Augen“ bewahrt bewusst das biblische Körperbild, ohne altertümliche Wortstellung; die direkte Rede bleibt knapp und feierlich.
