  source_fidelity: Die Übersetzung trifft die zentralen Ausdrücke (»Stunde«, »verherrliche«, Vater/Sohn) zutreffend. Der abschließende Punkt setzt jedoch einen Satzabschluss, obwohl die direkte Rede und der griechische Satz in den folgenden Vers weitergehen; das SBLGNT setzt hier ein Komma.
  naturalness: Modernes, würdiges Standarddeutsch. Die Verbindung mit »und« bildet die griechische Koordination unmittelbarer ab als der durch Satzteilung und »Dann« erzeugte neue Hauptsatz.
  terminology: »Vater«, »Stunde«, »Sohn« und »verherrlichen« sind präzise und registergerecht. Die Wiederholung von »Sohn« und »verherrlicht« bewahrt die griechische Symmetrie.
  issues:
  - severity: low
    issue: Satzteilung mit »Dann«
    rationale: Das griechische καί verbindet die Rede, das Erheben der Augen und die anschließende Anrede. »Dann« ist nicht sinnwidrig, fügt aber eine stärker explizite zeitliche Abfolge ein; »und« ist näher am Ausgangstext.
  - severity: medium
    issue: Abschließender Punkt innerhalb der fortlaufenden Rede
    rationale: Der griechische Text endet mit Komma, und die Bitte wird in Johannes 17,2 fortgesetzt. Ein Punkt schließt die Rede und den Gedankengang vorzeitig ab.
