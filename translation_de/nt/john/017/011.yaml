source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: de
  text: Ich bin nicht mehr in der Welt; sie aber sind in der Welt, und ich komme zu dir. Heiliger Vater, bewahre sie in deinem Namen[a], den du mir gegeben hast, damit sie eins seien[b], so wie wir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „bewahre sie durch deinen Namen“ oder „beschütze sie kraft deines Namens“. Die griechische Wendung kann eine Sphäre, ein Mittel oder eine Autorität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften werden im Sinn von „bewahre sie in deinem Namen, den du mir gegeben hast“ verstanden, andere im Sinn von „bewahre in deinem Namen die, die du mir gegeben hast“. Die Übersetzung folgt dem hier zugrunde gelegten SBLGNT-Text, in dem sich „den“ auf „Namen“ bezieht.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die geläufige moderne Zeitangabe drückt aus, dass Jesu Gegenwart in der Welt aus seiner gegenwärtigen Perspektive endet.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ bewahrt den prägenden johanneischen Begriff für den irdisch-menschlichen Bereich, in dem die Jünger bleiben.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: und ich komme zu dir
  rationale: Das Präsens ἔρχομαι hat hier eine auf die nahe Zukunft gerichtete Bedeutung; „komme zu dir“ bewahrt zugleich die Perspektive des griechischen Verbs.
- source_word: πάτερ ἅγιε
  choice: Heiliger Vater
  rationale: Dies ist eine natürliche deutsche Anrede und gibt sowohl πάτερ als auch das attributiv gebrauchte ἅγιε wieder.
- source_word: τήρησον
  choice: bewahre
  rationale: „Bewahren“ umfasst Schutz und treues Erhalten, ohne die Bedeutung auf körperlichen Schutz zu verengen.
- source_word: ἐν τῷ ὀνόματί σου
  choice: in deinem Namen
  rationale: Die Wiedergabe mit „in“ erhält die mögliche räumlich-relationale Bedeutung und legt die Wendung nicht einseitig auf Mittel oder Autorität fest.
- source_word: ᾧ δέδωκάς μοι
  choice: den du mir gegeben hast
  rationale: Das Relativpronomen bezieht sich in der vorliegenden SBLGNT-Lesart grammatisch auf „Namen“; das Maskulinum „den“ macht diesen Bezug im Deutschen deutlich.
- source_word: ἵνα ὦσιν ἓν
  choice: damit sie eins sind
  rationale: „Damit“ gibt den Zwecksinn von ἵνα wieder. Das prädikative „eins“ bezeichnet Einheit, ohne die Art dieser Einheit näher festzulegen.
- source_word: καθὼς ἡμεῖς
  choice: so wie wir
  rationale: Die knappe Vergleichsform bewahrt die Analogie zur Einheit von Vater und Sohn, ohne sie interpretierend auszuweiten.
theological_decisions:
- issue: Bedeutung von „bewahre sie in deinem Namen“
  choice: 'Die Wendung bleibt im Haupttext wörtlich-offen: „bewahre sie in deinem Namen“.'
  alternative: „Bewahre sie durch deinen Namen“ oder „beschütze sie kraft deines Namens“.
  rationale: ἐν kann hier Sphäre, Mittel oder Autorität bezeichnen. Die offene Formulierung wahrt diese Mehrdeutigkeit.
- issue: Aussage „damit sie eins sind, so wie wir“
  choice: Der wirkliche Vergleich zwischen der Einheit der Jünger und der Einheit von Vater und Sohn bleibt unbestimmt stehen.
  alternative: Die Einheit entweder auf bloße Zusammenarbeit zu reduzieren oder als metaphysische Identität auszudeuten.
  rationale: Der Wortlaut gibt der Analogie theologisches Gewicht, bestimmt aber in diesem Satz nicht genauer, welcher Art sie ist.
- issue: Bezug des Relativpronomens in ᾧ δέδωκάς μοι
  choice: „den du mir gegeben hast“ bezieht sich auf den Namen.
  alternative: 'Nach einer abweichenden Lesart: „die du mir gegeben hast“, bezogen auf die Jünger.'
  rationale: Die Übersetzung folgt dem angegebenen SBLGNT-Text mit dem Relativpronomen ᾧ, das mit ὀνόματι übereinstimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bewahre“ hält den johanneischen Ton und die Bedeutungsbreite von τηρέω fest. Das Semikolon bildet den Gegensatz zwischen Jesu Weggang und dem Verbleib der Jünger klar ab; „so wie wir“ lässt die im Griechischen elliptische Schlussform natürlich deutsch klingen.
