  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: de
  text: Doch jetzt komme ich zu dir und sage dies in der Welt, damit sie meine Freude in sich voll und ganz haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie meine Freude in sich vollkommen haben“; auch: „in ihnen“ statt „in sich“.

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Doch jetzt
  rationale: νῦν markiert den gegenwärtigen Zeitpunkt, während δέ einen milden Gegensatz beziehungsweise Übergang zum Vorhergehenden ausdrückt.
- source_word: πρὸς σὲ ἔρχομαι
  choice: komme ich zu dir
  rationale: Das Präsens ἔρχομαι mit πρός und Akkusativ bezeichnet die Bewegung hin zum Vater; das natürliche deutsche Präsens bewahrt zugleich die Unmittelbarkeit.
- source_word: ταῦτα λαλῶ
  choice: dies rede ich
  rationale: λαλέω bezeichnet hier das ausgesprochene Reden. Die Formulierung ist würdig, verständlich und bleibt nahe an der johanneischen Ausdrucksweise.
- source_word: ἐν τῷ κόσμῳ
  choice: in der Welt
  rationale: Die schlichte Wiedergabe bewahrt das für Johannes wichtige Motiv der Welt und legt die Wendung nicht vorschnell als bloße Zeitangabe aus.
- source_word: ἵνα ἔχωσιν
  choice: damit sie … haben
  rationale: ἵνα führt hier den beabsichtigten Zweck ein; „damit“ gibt dies im modernen Deutsch klar wieder.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: meine Freude
  rationale: Die Artikel-Adjektiv-Konstruktion hebt die Jesus eigene Freude hervor; „meine Freude“ ist die natürliche deutsche Entsprechung.
- source_word: πεπληρωμένην
  choice: vollkommen
  rationale: Das Perfektpassiv-Partizip von πληρόω bezeichnet einen herbeigeführten Zustand der Fülle. In Verbindung mit „haben“ gibt „vollkommen“ diesen Ergebniszustand natürlich wieder.
- source_word: ἐν ἑαυτοῖς
  choice: in sich
  rationale: Die reflexive Wendung bezeichnet am ehesten die Freude als in den Jüngern gegenwärtig; die kollektive Form lässt zugleich die griechische Mehrzahl erkennen.
theological_decisions:
- issue: Bedeutung von „meine Freude“
  choice: Die Freude gehört Jesus und soll in seinen Jüngern zur Fülle gelangen.
  alternative: Die Freude ist vor allem Freude über Jesus.
  rationale: Das betonte Possessivpronomen ἐμὴν bezeichnet am natürlichsten Jesu eigene Freude. Die Übersetzung erklärt nicht näher, auf welche Weise diese Freude in den Jüngern gegenwärtig ist.
- issue: Bezug von ἐν ἑαυτοῖς
  choice: „in sich“ bezeichnet die innere Gegenwart der Freude bei den Jüngern.
  alternative: „untereinander“ bezeichnet ihre gemeinschaftliche Erfahrung der Freude.
  rationale: Der reflexive Ausdruck kann je nach Kontext intern oder gemeinschaftlich verstanden werden; hier ist der innere Bezug natürlicher, ohne die gemeinschaftliche Dimension grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dies rede ich“ bewahrt bewusst den feierlichen johanneischen Ton, ohne veraltet zu wirken. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Schlusssatz.
