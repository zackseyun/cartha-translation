revisions:
- from: Doch jetzt komme ich zu dir. Und dies rede ich in der Welt, damit sie meine Freude in sich vollkommen haben.[a]
  to: Doch jetzt komme ich zu dir und sage dies in der Welt, damit sie meine Freude in sich voll und ganz haben.[a]
  rationale: Die Revision erhält den milden Übergang von νῦν δέ, die Bewegung zu dem angesprochenen Vater, das johanneische „Welt“-Motiv sowie die Zweckangabe. „Voll und ganz haben“ gibt die durch πεπληρωμένην bezeichnete erfüllte Fülle in idiomatischem modernem Deutsch wieder. Die Fußnote nennt nur Alternativen, die weder die grammatische Rolle der Jünger noch die Aussage des griechischen Textes verschieben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:55:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Satzbau und die wesentlichen Begriffe insgesamt zutreffend wieder. „in sich vollkommen haben“ ist jedoch im heutigen Deutsch syntaktisch und semantisch weniger klar: „vollkommen“ kann dort wie ein bloßes Adverb zu „haben“ wirken, während πεπληρωμένην die zur Fülle gelangte Freude bezeichnet.'
  naturalness: „Dies rede ich“ ist verständlich, wirkt im modernen Standarddeutsch aber unnötig gehoben und weniger idiomatisch als „dies sage ich“. Der Satz sollte zudem nicht durch einen Punkt zwischen die eng verbundenen Teilsätze getrennt werden.
  terminology: „Welt“, „meine Freude“ und „in sich“ bewahren die johanneische Terminologie und den Bezug auf Jesu eigene Freude. „voll und ganz haben“ ist eine natürliche deutsche Wiedergabe des resultativen Fülle-Gedankens, ohne zu behaupten, die Jünger bewirkten diese Erfüllung.
  issues:
  - severity: medium
    issue: Unklare Wiedergabe von πεπληρωμένην
    rationale: Die Fügung „meine Freude in sich vollkommen haben“ ist zwar verständlich, aber im modernen Deutsch stilistisch schwerfällig und bildet den Zustand erfüllter Freude nicht so klar ab.
  - severity: low
    issue: Register von „dies rede ich“
    rationale: „Rede ich“ ist nicht falsch, klingt jedoch deutlich formelhafter als die im modernen Deutsch natürliche Entsprechung „sage ich“ für λαλέω in diesem Kontext.
  - severity: low
    issue: Fußnote bietet eine missverständliche Alternative
    rationale: „zur Fülle gebracht haben“ kann nahelegen, dass die Jünger die Freude selbst zur Fülle bringen. Das griechische Perfektpassiv beschreibt dagegen die Freude als in den Jüngern zur Fülle gelangt.
  revised_text: Doch jetzt komme ich zu dir und sage dies in der Welt, damit sie meine Freude in sich voll und ganz haben.[a]
