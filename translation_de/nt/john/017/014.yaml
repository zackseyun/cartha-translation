  naturalness: Der Satz ist modernes, idiomatisches Standarddeutsch und behält zugleich den schlichten, würdigen johanneischen Registerton. Die Wiederholung von „aus der Welt“ ist im Deutschen verständlich und stilistisch dem griechischen Parallelismus entsprechend.
