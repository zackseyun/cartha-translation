id: JHN.17.14
reference: John 17:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: de
  text: Ich habe ihnen dein Wort gegeben, und die Welt hat sie gehasst, weil sie nicht aus der Welt[a] sind, so wie ich nicht aus der Welt bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht zur Welt gehören“. Der griechische Ausdruck verwendet wörtlich „aus“ und kann Herkunft oder Zugehörigkeit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: δέδωκα
  choice: habe … gegeben
  rationale: Das griechische Perfekt bezeichnet eine vollzogene Handlung mit fortdauernder Wirkung. Das deutsche Perfekt gibt dies hier natürlich wieder.
- source_word: λόγον
  choice: Wort
  rationale: „Wort“ bewahrt den johanneischen Sprachgebrauch und die theologische Bedeutungsweite besser als das stärker deutende „Botschaft“.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ ist die übliche und breite Wiedergabe. Die feindliche Haltung der Welt gegenüber Jesus und den Jüngern ergibt sich aus dem Zusammenhang, ohne dass sie in die Übersetzung des Substantivs eingetragen werden muss.
- source_word: ἐμίσησεν
  choice: hat … gehasst
  rationale: Das griechische Aorist bezeichnet den Hass als eingetretene Tatsache. Das deutsche Perfekt klingt gegenwartsnah und lässt die fortbestehende Feindschaft erkennen, ohne den Aspekt übermäßig festzulegen.
- source_word: ὅτι
  choice: weil
  rationale: 'Die Konjunktion ist hier kausal: Der folgende Satz nennt den Grund für den Hass der Welt.'
- source_word: ἐκ τοῦ κόσμου
  choice: aus der Welt
  rationale: „Aus“ entspricht der Grundbedeutung von ἐκ und bewahrt die Spannung zwischen Herkunft und Zugehörigkeit, statt den Ausdruck ausschließlich als soziale Zugehörigkeit auszulegen.
- source_word: καθὼς
  choice: so wie
  rationale: „So wie“ stellt den direkten Vergleich zwischen dem Verhältnis der Jünger zur Welt und dem Verhältnis Jesu zur Welt klar und idiomatisch her.
theological_decisions:
- issue: Das Verhältnis der Jünger zur Welt im Vergleich mit Jesus
  choice: „nicht aus der Welt … so wie ich nicht aus der Welt bin“
  alternative: „nicht zur Welt gehören, so wie ich nicht zur Welt gehöre“
  rationale: Die gewählte Fassung gibt den Vergleich unmittelbar wieder und erhält bei ἐκ sowohl den Gedanken der Herkunft als auch den der Zugehörigkeit. Sie schwächt die Analogie nicht ab und legt sie zugleich nicht über den Wortlaut hinaus metaphysisch fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, schlichtem Satzbau. Die traditionelle johanneische Wendung „aus der Welt“ bleibt erhalten; eine Fußnote erläutert ihre mögliche Bedeutung als Zugehörigkeit.
