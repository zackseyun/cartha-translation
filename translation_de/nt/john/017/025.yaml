id: JHN.17.25
reference: John 17:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: de
  text: Gerechter Vater, die Welt kennt dich nicht; ich aber kenne dich, und diese haben erkannt, dass du mich gesandt hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die drei Verben für »kennen/erkennen« stehen im Griechischen im Aorist. Die ersten beiden werden im Deutschen idiomatisch als gegenwärtiges »kennt« wiedergegeben; »diese haben erkannt« bezeichnet ihr Erkennen, dass der Vater Jesus gesandt hat. Das einleitende καί kann auch ausdrücklich koordinierend wiedergegeben werden: »und die Welt hat dich nicht erkannt; ich aber habe dich erkannt«.'
    reason: Erläutert die idiomatische deutsche Wiedergabe der Aoristformen und bewahrt die mögliche koordinierende Nuance des einleitenden καί.
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Gerechter Vater
  rationale: Die Anredeform wird im Deutschen ohne altertümliches »o« wiedergegeben. »Gerecht« bewahrt die moralische und theologische Weite von δίκαιος und verengt sie nicht auf richterliche Unparteilichkeit.
- source_word: καὶ ὁ κόσμος σε οὐκ ἔγνω
  choice: obwohl die Welt dich nicht erkannt hat
  rationale: Das erste καί lässt sich im Zusammenhang konzessiv verstehen. »Obwohl« macht den Gegensatz zum folgenden ἐγὼ δέ in natürlichem Deutsch deutlich; die koordinierende Lesart bleibt in der Fußnote erhalten.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Die übliche johanneische Bezeichnung bleibt bewusst offen und wird nicht deutend auf »die Menschen« oder ein »Weltsystem« eingeengt.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: hat erkannt / habe erkannt / haben erkannt
  rationale: Das deutsche Perfekt gibt die Aoristformen in gegenwärtig natürlicher Erzähl- und Gebetssprache wieder. »Erkennen« bewahrt sowohl die kognitive als auch die relationale Bedeutung von γινώσκω.
- source_word: οὗτοι
  choice: diese
  rationale: Das Demonstrativpronomen wird ohne den erklärenden Zusatz »Jünger« wiedergegeben, sodass der kontextuelle Bezug erhalten bleibt, ohne ihn in den Text einzutragen.
- source_word: σύ με ἀπέστειλας
  choice: du mich gesandt hast
  rationale: »Senden« beziehungsweise »gesandt« entspricht dem johanneisch bedeutsamen ἀποστέλλω; die deutsche Nebensatzstellung verlangt das Perfekt hier idiomatisch.
theological_decisions:
- issue: Bezeichnung des Vaters als δίκαιος
  choice: Gerechter Vater
  alternative: Rechter Vater; gerechter Vater im engeren richterlichen Sinn
  rationale: »Gerecht« trägt die umfassende Aussage über Gottes moralische Richtigkeit und Treue, ohne sie ausschließlich juristisch auszulegen.
- issue: Bedeutungsumfang von κόσμος
  choice: die Welt
  alternative: die Menschen der Welt; das gottentfremdete Weltsystem
  rationale: Die wörtliche, im Johannesevangelium vielschichtige Bezeichnung erhält die Spannung zwischen Menschheit, geschaffener Welt und gottentfremdeter Ordnung.
- issue: Verhältnis der ersten beiden Aussagen
  choice: 'konzessiv: obwohl die Welt dich nicht erkannt hat'
  alternative: 'koordinierend: und die Welt hat dich nicht erkannt, ich aber habe dich erkannt'
  rationale: Der Zusammenhang legt eine konzessive Beziehung nahe, doch καί bezeichnet sie nicht ausdrücklich. Daher steht die natürlichere konzessive Fassung im Haupttext und die formal koordinierende Möglichkeit in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt gebetsnah und klar; altertümliche Anredepartikeln sowie konfessionell geprägte Zusätze werden vermieden. »Diese« ist bewusst quellennah, auch wenn »diese hier« oder »diese Menschen« umgangssprachlich expliziter wäre.
