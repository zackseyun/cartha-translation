revisions:
- from: Gerechter Vater, obwohl die Welt dich nicht erkannt hat[a], habe ich dich erkannt, und diese haben erkannt, dass du mich gesandt hast.[b]
  to: Gerechter Vater, die Welt kennt dich nicht; ich aber kenne dich, und diese haben erkannt, dass du mich gesandt hast.[a]
  rationale: Die Revision vermeidet die im Deutschen missverständliche Formulierung »ich habe dich erkannt«, gibt den griechischen Kontrast ἐγὼ δέ mit »ich aber« sichtbar wieder und legt die Funktion des einleitenden καί nicht im Haupttext konzessiv fest. Der letzte Aorist bleibt als »haben erkannt« erhalten, weil der folgende dass-Satz eine Erkenntnis als Inhalt bezeichnet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:55:56Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von δίκαιε mit »Gerechter« sowie von κόσμος mit »die Welt« ist treffend. Die konzessive Auffassung des einleitenden καί ist kontextuell möglich, legt jedoch eine Beziehung explizit fest, die das Griechische lediglich durch Koordination und den Kontrast δέ nahelegt. Bei γινώσκω ist »erkennen« im letzten Satz wegen des Inhaltssatzes passend; für die ersten beiden, relationalen Aussagen ist im modernen Deutschen »kennen« idiomatischer.
  naturalness: »Ich habe dich erkannt« kann im heutigen Deutsch leicht ein punktuelles Wiedererkennen oder eine nachträgliche Einsicht ausdrücken. »Ich aber kenne dich« bildet die dauerhafte relationale Aussage klarer ab. Die parallele Formulierung »Die Welt kennt dich nicht; ich aber kenne dich« ist zugleich gebetsnah und modernes Standarddeutsch.
  terminology: »Gerechter Vater«, »Welt«, »kennen« und »gesandt« bewahren die johanneische Terminologie ohne konfessionelle Einengung. »Diese« bleibt als quellennahes Demonstrativpronomen erhalten. Die Fußnote zur Aoristverwendung sollte nicht pauschal eine gegenwartsbedeutsame Perfektbedeutung behaupten und die nicht passende Alternative »wussten« vermeiden.
  issues:
  - severity: medium
    issue: Die Hauptfassung macht das erste καί mit »obwohl« ausdrücklich konzessiv.
    rationale: Eine konzessive Nuance ist im Kontext vertretbar, aber καί markiert sie nicht selbst. Eine koordinierende Hauptfassung mit deutlich wiedergegebenem »ich aber« erhält die syntaktische Offenheit besser.
  - severity: medium
    issue: »habe ich dich erkannt« ist für Jesu Kenntnis des Vaters im modernen Deutsch semantisch weniger natürlich.
    rationale: Das Perfekt von »erkennen« legt oft einen punktuellen Erkenntnisvorgang nahe. Das präsentische »kenne dich« gibt die fortbestehende relationale Kenntnis idiomatisch und kontextgerecht wieder.
  - severity: low
    issue: Die bisherige Fußnote b übergeneralisiert die Wirkung des Aorists und nennt »wussten« als Alternative.
    rationale: Der Aorist erzwingt keine deutsche Perfektform mit behaupteter Gegenwartsbedeutsamkeit. Für den Inhaltssatz passt »erkannt haben« besser als »wussten«.
  revised_text: Gerechter Vater, die Welt kennt dich nicht; ich aber kenne dich, und diese haben erkannt, dass du mich gesandt hast.[a]
