id: JHN.17.8
reference: John 17:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: de
  text: Denn die Worte, die du mir gegeben hast, habe ich ihnen gegeben. Sie haben sie empfangen und wirklich erkannt, dass ich von dir ausgegangen bin[b], und sie haben geglaubt, dass du mich gesandt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „dass ich von dir gekommen bin“.'
    reason: Die griechische Wendung kann idiomatisch die Herkunft bezeichnen; „ausgegangen“ bewahrt stärker die Form des Bewegungsverbs.
lexical_decisions:
- source_word: ῥήματα
  choice: Worte
  rationale: ῥῆμα bezeichnet hier gesprochene Worte oder Aussprüche. „Worte“ bewahrt den konkreten Plural und vermeidet die stärker deutende Zusammenfassung „Botschaft“.
- source_word: ἔδωκάς ... δέδωκα
  choice: du ... gegeben hast ... habe ich ... weitergegeben
  rationale: Das deutsche Perfekt gibt beide vergangenen Handlungen natürlich wieder; „weitergegeben“ macht den im Kontext liegenden Übergang vom Vater über Jesus zu den Jüngern deutlich, ohne den Inhalt zu erweitern.
- source_word: ἔλαβον
  choice: angenommen
  rationale: Im Zusammenhang offenbarender Worte meint λαμβάνω mehr als ein körperliches Nehmen. „Angenommen“ drückt die positive Aufnahme aus; das schlichtere „empfangen“ bleibt möglich.
- source_word: ἔγνωσαν ἀληθῶς
  choice: wirklich erkannt
  rationale: „Erkannt“ gibt die erreichte Einsicht des Aorists wieder, während „wirklich“ ἀληθῶς unmittelbar bewahrt.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: ich von dir ausgegangen bin
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Ausgang von Gott. „Von dir ausgegangen“ bewahrt die Bewegungskomponente und die theologische Offenheit genauer als eine bloße Ortsangabe.
- source_word: ἐπίστευσαν ὅτι
  choice: sie haben geglaubt, dass
  rationale: Da auf πιστεύω ein ὅτι-Satz mit propositionalem Inhalt folgt, ist „geglaubt, dass“ syntaktisch und semantisch direkt.
- source_word: ἀπέστειλας
  choice: gesandt hast
  rationale: „Gesandt“ ist eine natürliche, würdige Wiedergabe der Sendung Jesu und bewahrt gegenüber „geschickt“ das Gewicht des johanneischen Zusammenhangs.
- source_word: ὅτι
  choice: Denn
  rationale: Das einleitende ὅτι begründet oder erläutert die vorausgehende Aussage. „Denn“ stellt diese Verbindung im Deutschen klar her.
theological_decisions:
- issue: Verhältnis Jesu zum Vater in παρὰ σοῦ ἐξῆλθον
  choice: dass ich von dir ausgegangen bin
  alternative: dass ich von dir gekommen bin
  rationale: „Ausgegangen“ bewahrt die Aussage über Jesu Ursprung und die mögliche theologische Tiefe, ohne sie durch spätere dogmatische Fachsprache festzulegen.
- issue: Bedeutung von πιστεύω mit ὅτι-Satz
  choice: geglaubt, dass du mich gesandt hast
  alternative: darauf vertraut, dass du mich gesandt hast
  rationale: Der griechische Satz bezeichnet ausdrücklich den geglaubten Sachverhalt. „Vertraut“ würde die relationale Dimension stärker hervorheben, als es diese Konstruktion verlangt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wurde moderat gegliedert, um die längere griechische Periode gut lesbar zu machen; die wiederholten Verknüpfungen bleiben inhaltlich erhalten.
