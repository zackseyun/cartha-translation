  source_fidelity: Der Entwurf gibt ὑπὲρ αὐτῶν, die Wiederaufnahme von ἁγιάζω/ἡγιασμένοι und die Zweckbeziehung von ἵνα grundsätzlich zutreffend wieder. Die Konstruktion „damit ... geheiligt sind“ bildet jedoch keine idiomatische deutsche Zweckkonstruktion für den griechischen Konjunktiv und sollte durch „geheiligt werden“ ersetzt werden. „In der Wahrheit“ ist im Deutschen im johanneischen Kontext klarer und natürlicher als das leicht adverbial missverständliche „in Wahrheit“; die artikellose griechische Form lässt diese kontextbezogene Wiedergabe zu.
  naturalness: „Und für sie heilige ich mich selbst“ ist in einem würdigen biblischen Register möglich; die Fußnote erklärt die hier erforderliche Bedeutung von Selbstweihung. „Damit auch sie in der Wahrheit geheiligt werden“ ist modernes, grammatisch vollständiges Standarddeutsch.
  terminology: Die Stammverbindung „heilige ... geheiligt“ bleibt erhalten. „Heiligen“ ist als theologischer Leitbegriff angemessen; die Alternative „weihen“ gehört in die Fußnote. Die Formulierung „in der Wahrheit“ knüpft sinnvoll an Johannes 17,17 an, ohne eine dogmatische Aussage über die genaue Funktion von ἐν festzulegen.
