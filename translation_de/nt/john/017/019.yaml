  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: de
  text: Und für sie heilige[a] ich mich selbst, damit auch sie in der Wahrheit[b] geheiligt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihe mich selbst“. Das griechische Verb hat denselben Wortstamm wie „geheiligt“ im zweiten Teil des Verses.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Wahrheit“; vergleiche Vers 17. Auch „durch die Wahrheit“ ist möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: für sie
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier, dass Jesus zu ihrem Nutzen beziehungsweise für sie handelt. „Für sie“ ist im Deutschen natürlich und lässt offen, ob zusätzlich ein stellvertretender Akzent mitzuhören ist.
- source_word: ἁγιάζω … ἡγιασμένοι
  choice: heilige … geheiligt
  rationale: Die Wiederholung desselben griechischen Wortstamms wird im Deutschen sichtbar bewahrt. Beim ersten Vorkommen bezeichnet „heiligen“ in diesem Zusammenhang Jesu Selbsthingabe beziehungsweise Weihe für seinen Auftrag, nicht einen Übergang von Unreinheit zu Reinheit.
- source_word: ἐμαυτόν
  choice: mich selbst
  rationale: Die betonte reflexive Form wird direkt und idiomatisch wiedergegeben.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweckbeziehung klar und natürlich wieder.
- source_word: ὦσιν καὶ αὐτοὶ
  choice: damit auch sie … sind
  rationale: „Auch sie“ bewahrt den einschließenden und leicht betonten Sinn von καὶ αὐτοί. Die deutsche Konstruktion mit „damit“ gibt den griechischen Konjunktiv funktional wieder.
- source_word: ἡγιασμένοι
  choice: geheiligt
  rationale: Das Perfektpartizip beschreibt einen aus der Heiligung hervorgegangenen Zustand. Zusammen mit „sind“ bleibt dieser Zustandsaspekt erhalten.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die artikellose griechische Wendung kann den Bereich oder die Wirklichkeit der Heiligung bezeichnen. „In Wahrheit“ wahrt diese Offenheit, ohne den im Griechischen fehlenden Artikel einzufügen.
theological_decisions:
- issue: Bedeutung von Jesu Selbstheiligung
  choice: Jesus heiligt sich selbst im Sinn der Weihe und Selbsthingabe für seinen Auftrag zugunsten der Jünger.
  alternative: Jesus macht sich selbst moralisch heiliger.
  rationale: Der unmittelbare Zusammenhang legt eine kultisch-missionale Selbstweihung nahe. Die Übersetzung bewahrt dennoch bewusst dasselbe Verb wie in der Aussage über die Jünger und erklärt die kontextuelle Nuance nur in der Fußnote.
- issue: Bedeutung von ἐν ἀληθείᾳ
  choice: „in Wahrheit“ als Bereich, Wirklichkeit oder Weise der Heiligung
  alternative: „in der Wahrheit“ oder „durch die Wahrheit“
  rationale: Der fehlende Artikel und die semantische Spannweite von ἐν erlauben mehrere Deutungen. Der Haupttext vermeidet eine unnötige Festlegung; die engere Verbindung mit Vers 17 bleibt durch die Fußnote zugänglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstammwiederholung „heilige … geheiligt“ bildet die auffällige Verbindung im Griechischen ab. „Für sie“ bleibt natürlicher als „um ihretwillen“ und weniger auslegend als „stellvertretend für sie“. Die Stellung „in Wahrheit geheiligt“ ist flüssig und erhält die Mehrdeutigkeit der Präpositionalphrase.
