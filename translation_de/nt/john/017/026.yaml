id: JHN.17.26
reference: John 17:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: de
  text: Und ich habe ihnen deinen Namen bekannt gemacht[a] und werde ihn bekannt machen, damit die Liebe, mit der du mich geliebt hast, in ihnen sei[b] und ich in ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihnen deinen Namen offenbart und werde ihn offenbaren«. »Dein Name« meint Gottes offenbarte Identität und Wesensart, nicht nur eine Bezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unter ihnen«; »in ihnen« bewahrt deutlicher das johanneische Motiv des Innewohnens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: habe ... bekannt gemacht
  rationale: Das Perfekt gibt den griechischen Aorist im Deutschen natürlich als vollzogene Handlung wieder; »bekannt machen« bewahrt den kausativen Sinn von γνωρίζω.
- source_word: τὸ ὄνομά σου
  choice: deinen Namen
  rationale: Die konkrete biblische Ausdrucksweise bleibt erhalten, ohne sie deutend zu »dein Wesen« oder »wer du bist« auszuweiten.
- source_word: γνωρίσω
  choice: werde ihn weiter bekannt machen
  rationale: Das Futur wird ausdrücklich wiedergegeben. »Weiter« verdeutlicht im Deutschen die Fortsetzung nach der bereits genannten Bekanntmachung, ohne den Gegenstand zu ändern; »ihn« verweist auf den Namen.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Ziel- beziehungsweise Folgebeziehung der ἵνα-Konstruktion knapp und idiomatisch wieder.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: die Liebe, mit der du mich geliebt hast
  rationale: Bewahrt das Substantiv ἀγάπη und gibt die relative Wendung natürlich wieder.
- source_word: ἐν αὐτοῖς
  choice: in ihnen
  rationale: Entspricht unmittelbar ἐν mit Dativ und erhält den johanneischen Anklang des Innewohnens; »unter ihnen« bleibt als mögliche Alternative vermerkt.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: und ich in ihnen
  rationale: Die Ellipse des griechischen Textes bleibt erhalten; das zuvor stehende »sei« ist sinngemäß auch auf diese koordinierte Wendung zu beziehen.
theological_decisions:
- issue: Bedeutung von »deinen Namen«
  choice: Die Formulierung »deinen Namen« bleibt im Haupttext stehen.
  alternative: »dein Wesen« oder »wer du bist«
  rationale: »Name« bezeichnet hier mehr als eine bloße Benennung und trägt die Bedeutung der offenbarten Identität und Wesensart Gottes; eine ausdeutende Paraphrase würde diese Bedeutung jedoch im Haupttext unnötig festlegen.
- issue: Verhältnis zwischen der göttlichen Liebe und Christi Gegenwart in den Glaubenden
  choice: 'Beide Aussagen werden koordiniert wiedergegeben: »damit die Liebe ... in ihnen sei und ich in ihnen«.'
  alternative: Eine kausale oder unterordnende Verknüpfung, etwa »weil ich in ihnen bin«
  rationale: Der griechische Text stellt beide Wirklichkeiten nebeneinander, ohne ihr theologisches Verhältnis ausdrücklich weiter zu bestimmen.
- issue: Bedeutung von ἐν αὐτοῖς
  choice: »in ihnen«
  alternative: »unter ihnen«
  rationale: Beides ist sprachlich möglich, doch »in ihnen« ist die unmittelbarere Wiedergabe und bewahrt das für Johannes wichtige Motiv des Innewohnens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ist jedoch idiomatisch. Das elliptische Schlussglied wird bewusst nicht durch ein zweites Verb ausgedeutet.
