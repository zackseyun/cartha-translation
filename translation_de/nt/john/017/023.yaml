  terminology: „in ihnen / in mir“, „die Welt“, „gesandt“, „geliebt“ und „wie“ sind treffend und konsistent. „Zur Einheit vollendet werden“ gibt τετελειωμένοι εἰς ἕν angemessen wieder, ohne die Aussage auf moralische Fehlerlosigkeit festzulegen.
