id: JHN.17.23
reference: John 17:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: de
  text: Ich in ihnen und du in mir, damit sie zur Einheit vollendet werden[a], damit die Welt erkennt, dass du mich gesandt und sie geliebt hast, wie du mich geliebt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Einssein vollendet werden“; auch: „vollkommen eins werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: in ihnen / in mir
  rationale: Das wiederholte „in“ bewahrt die für das Johannesevangelium kennzeichnende Sprache des gegenseitigen Innewohnens; „unter ihnen“ würde diesen Bezug abschwächen.
- source_word: τετελειωμένοι
  choice: vollendet sind
  rationale: Das Perfekt Passiv bezeichnet einen durch vollendendes Handeln erreichten Zustand. „Vollendet“ wahrt den Gedanken des Zu-Ende-Bringens, ohne den Ausdruck ausschließlich als sittliche Sündlosigkeit zu deuten.
- source_word: εἰς ἕν
  choice: zur Einheit
  rationale: Die Wendung gibt die auf ein Ergebnis gerichtete Kraft von εἰς wieder. Das im Deutschen unnatürliche „in eins hinein“ wird idiomatisch als „zur Einheit“ ausgedrückt.
- source_word: γινώσκῃ
  choice: erkennt
  rationale: „Erkennt“ ist im Deutschen eine natürliche Wiedergabe des präsentischen Konjunktivs in der ἵνα-Konstruktion und kann sowohl Wissen als auch Einsicht bezeichnen.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Die traditionelle und zugleich direkte Wiedergabe erhält die johanneische Mehrdeutigkeit, statt den Ausdruck erklärend auf ein Weltsystem oder auf bestimmte Menschen einzugrenzen.
- source_word: ἀπέστειλας
  choice: gesandt hast
  rationale: „Senden“ gibt ἀποστέλλω direkt wieder und bewahrt das im Johannesevangelium wiederkehrende Motiv der Sendung Jesu durch den Vater.
- source_word: ἠγάπησας
  choice: geliebt hast
  rationale: Die zweimalige identische Wiedergabe erhält die auffällige lexikalische Wiederholung des griechischen Textes.
- source_word: καθὼς
  choice: wie
  rationale: „Wie“ markiert im Deutschen klar und ohne erklärende Abschwächung den vom griechischen Text gesetzten Vergleich.
theological_decisions:
- issue: Tragweite des Vergleichs zwischen der Liebe zu den Glaubenden und der Liebe zum Sohn
  choice: 'Der Vergleich wird direkt wiedergegeben: „wie du mich geliebt hast“.'
  alternative: Abschwächende Formulierungen wie „mit einer ähnlichen Liebe“ oder „mit derselben Art von Liebe“.
  rationale: καθὼς setzt einen gewichtigen Vergleich. Die Übersetzung lässt dessen theologische Spannung stehen, ohne Gleichheit näher zu definieren oder abzuschwächen.
- issue: Bedeutung von τετελειωμένοι im Zusammenhang der Einheit
  choice: „zur Einheit vollendet sind“ stellt das vollendende Handeln und sein Ergebnis heraus.
  alternative: „vollkommen eins sind“ oder eine Deutung als bereits erreichte absolute sittliche Vollkommenheit.
  rationale: Die Form bezeichnet einen erreichten Zustand; zusammen mit εἰς ἕν liegt der Schwerpunkt auf dem Zur-Einheit-Bringen. Die Übersetzung vermeidet es, daraus ausdrücklich eine Aussage über sündlose Vollkommenheit zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Ellipse „Ich in ihnen und du in mir“ wird beibehalten, da sie die knappe Parallelstruktur des griechischen Gebets bewahrt. Die beiden aufeinanderfolgenden Zwecksätze mit „damit“ spiegeln die Wiederholung von ἵνα.
