id: JHN.17.4
reference: John 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: de
  text: Ich habe dich auf der Erde verherrlicht, indem ich das Werk vollendet habe, das du mir aufgetragen hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe dich auf der Erde verherrlicht, nachdem ich das Werk vollendet habe, das du mir zu tun gegeben hast.“'
    reason: Die adverbiale Beziehung des Aoristpartizips τελειώσας zum Hauptverb kann neben modal („indem“) auch temporal beziehungsweise als begleitender Umstand verstanden werden.
lexical_decisions:
- source_word: ἐδόξασα
  choice: verherrlicht
  rationale: „Verherrlichen“ bewahrt den gewichtigen johanneischen Sinn von δοξάζω und gibt mehr wieder als das schwächere „geehrt“.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Formulierung gibt die räumliche Bedeutung von ἐπί mit Genitiv samt Artikel transparent und in natürlichem Deutsch wieder.
- source_word: τελειώσας
  choice: indem ich ... vollendet habe
  rationale: Die modale Wiedergabe bezeichnet das Vollenden des Werkes als die Weise, in der Jesus den Vater verherrlicht hat; die Fußnote hält die formalere partizipiale Alternative offen.
- source_word: τὸ ἔργον
  choice: das Werk
  rationale: „Werk“ ist die direkte, im Johannesevangelium kontextuell passende Bezeichnung für den Jesus übertragenen Auftrag.
- source_word: δέδωκάς μοι
  choice: das du mir aufgetragen hast
  rationale: Im Deutschen gibt „aufgetragen“ die Verbindung von Geben und auszuführender Aufgabe idiomatisch wieder; das Perfekt wahrt die fortdauernde Relevanz der erfolgten Beauftragung.
- source_word: ἵνα ποιήσω
  choice: aufgetragen hast
  rationale: Der Zweck- beziehungsweise Inhaltsgedanke von ἵνα ποιήσω wird idiomatisch in das Verb „auftragen“ aufgenommen, ohne das Deutsche durch „damit ich es tue“ zu beschweren.
- source_word: ἐγώ σε
  choice: Ich ... dich
  rationale: Die Personalpronomen werden ausdrücklich wiedergegeben; ein zusätzliches „ich selbst“ wäre im Deutschen hier überbetont.
theological_decisions:
- issue: Verhältnis des Verherrlichens zum Partizip τελειώσας
  choice: 'Das Partizip wird modal wiedergegeben: Jesus verherrlichte den Vater, indem er das ihm übertragene Werk vollendete.'
  alternative: '„... nachdem/da ich das Werk vollendet habe“ oder nebengeordnet: „...; ich habe das Werk vollendet ...“'
  rationale: Die Syntax legt nahe, dass das Partizip erläutert, wie die Verherrlichung geschah. Die Fußnote bewahrt zugleich die Möglichkeit einer weniger eindeutig modalen Zuordnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf der Erde“ bleibt quellennah; „das du mir aufgetragen hast“ ist idiomatischer als die formalere Wendung „das du mir zu tun gegeben hast“, die in der Fußnote erscheint.
