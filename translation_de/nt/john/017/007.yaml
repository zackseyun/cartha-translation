  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: de
  text: Nun haben sie erkannt, dass alles, was du mir gegeben hast, von dir ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass alles, was du mir gegeben hast, von dir kommt.«'
    reason: Lexikalisch-syntaktische Alternative für παρὰ σοῦ εἰσιν, die den Herkunftssinn ausdrücklich verbal wiedergibt.
lexical_decisions:
- source_word: νῦν
  choice: Jetzt
  rationale: Das temporale Adverb bezeichnet den gegenwärtig erreichten Stand der Erkenntnis.
- source_word: ἔγνωκαν
  choice: haben sie erkannt
  rationale: Das Perfekt von γινώσκω beschreibt eine gewonnene Erkenntnis mit fortdauerndem Ergebnis; das deutsche Perfekt gibt dies hier natürlich wieder.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die Verbindung drückt umfassende Gesamtheit aus und wird im Deutschen idiomatisch durch »alles, was« wiedergegeben.
- source_word: δέδωκάς μοι
  choice: du mir gegeben hast
  rationale: Das Perfekt hebt die vollzogene Gabe und ihre bleibende Bedeutung hervor; die deutsche Wortstellung ist natürlich und wahrt den Dativ.
- source_word: παρὰ σοῦ
  choice: von dir
  rationale: παρά mit Genitiv bezeichnet hier Herkunft oder Quelle.
- source_word: εἰσιν
  choice: ist
  rationale: Obwohl das griechische Verb im Plural steht, verlangt das zusammenfassende deutsche Pronomen »alles« idiomatisch den Singular.
theological_decisions:
- issue: Die Herkunft dessen, was der Vater dem Sohn gegeben hat
  choice: »alles, was du mir gegeben hast, von dir ist«
  alternative: »alles, was du mir gegeben hast, von dir kommt«
  rationale: Die Formulierung bewahrt die Aussage, dass der Vater die Quelle all dessen ist, was der Sohn empfangen hat, ohne die Beziehung dogmatisch weiter auszudeuten. Die alternative Wiedergabe macht den Herkunftssinn etwas ausdrücklicher.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. »Haben sie erkannt« klingt natürlicher als »sind sie zu der Erkenntnis gelangt« und bewahrt den resultativen Sinn des griechischen Perfekts.
