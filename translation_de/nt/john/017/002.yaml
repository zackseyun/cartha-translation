id: JHN.17.2
reference: John 17:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: de
  text: wie du ihm Vollmacht über alles Fleisch[a] gabst, damit er allen, die du ihm gegeben hast,[b] ewiges Leben gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die ganze Menschheit“. Wörtlich steht im Griechischen „über alles Fleisch“, ein biblischer Ausdruck für alle Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „allem, was du ihm gegeben hast“. Das Griechische verwendet eine sächliche Einzahl als Sammelbezeichnung für die Menschen, die dem Sohn gegeben sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet die Entsprechung zur Bitte im vorhergehenden Vers ein; im Deutschen gibt „wie“ die vergleichende Funktion natürlich wieder.
- source_word: ἔδωκας
  choice: gabst
  rationale: Der Aorist bezeichnet hier die Gewährung der Vollmacht als geschehenes Handeln des Vaters.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet übertragene Befugnis und Zuständigkeit genauer als bloße Kraft oder Macht.
- source_word: πάσης σαρκός
  choice: über alles Fleisch
  rationale: Bewahrt den biblischen Ausdruck und seinen umfassenden Bezug auf die gesamte Menschheit; die idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: ἵνα
  choice: damit
  rationale: Gibt die Ziel- bzw. Zweckbeziehung des griechischen Satzes klar und idiomatisch wieder.
- source_word: πᾶν ὃ
  choice: allen, die
  rationale: Der griechische Neutrum-Singular ist ein Kollektivausdruck für die Menschen, die der Vater dem Sohn gegeben hat. Die deutsche Form macht den Personenbezug verständlich.
- source_word: δέδωκας
  choice: du ihm gegeben hast
  rationale: Das Perfekt stellt eine vollzogene Gabe mit fortdauernder Geltung dar.
- source_word: δώσῃ
  choice: gibt
  rationale: Nach „damit“ drückt der deutsche Indikativ den mit dem griechischen Konjunktiv bezeichneten Zweck natürlich aus, ohne Unsicherheit einzutragen.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Entspricht dem etablierten johanneischen Ausdruck und umfasst sowohl bleibendes Leben als auch das Leben der kommenden Weltzeit.
theological_decisions:
- issue: Umfang von „alles Fleisch“ und Empfänger des ewigen Lebens
  choice: Die umfassende Vollmacht des Sohnes über „alles Fleisch“ wird von der besonderen Gruppe unterschieden, die der Vater ihm gegeben hat und der er ewiges Leben gibt.
  alternative: Beide Ausdrücke verallgemeinernd oder einschränkend auf denselben Personenkreis beziehen.
  rationale: Der griechische Satz hält universale Vollmacht und die kollektiv bezeichneten Empfänger des ewigen Lebens nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne sie konfessionell aufzulösen.
- issue: Kollektivform πᾶν ὃ und pluralisches αὐτοῖς
  choice: Im Haupttext personenbezogen mit „allen, die …“ wiedergeben und die wörtliche Kollektivform in der Fußnote nennen.
  alternative: Wörtlich „allem, was du ihm gegeben hast“ schreiben.
  rationale: Die idiomatische Wiedergabe verdeutlicht den Personenbezug; die Fußnote bewahrt zugleich die auffällige grammatische Gestalt des Originals.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. „Vollmacht“ und „ewiges Leben“ bewahren den theologischen Wortlaut; „alles Fleisch“ erhält bewusst die biblische Sprachprägung und wird für heutige Leser in der Fußnote erläutert.
