source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: de
  text: damit sie alle eins seien[a], so wie du, Vater, in mir bist und ich in dir; damit auch sie in uns seien[b], damit die Welt glaube[c], dass du mich gesandt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie alle vereint seien“. Wörtlicher heißt es im Griechischen „damit sie alle eins seien“; diese Formulierung bewahrt den umfassenderen Sinn der Einheit, ohne ihn auf einen bestimmten Aspekt einzugrenzen.'
    reason: lexical_alternative
  - marker: b
    text: Das wiederholte „in“ („in mir“, „in dir“, „in uns“) gehört zur johanneischen Sprache des gegenseitigen Innewohnens und der Teilhabe; es drückt mehr aus als bloße Gemeinschaft oder Nähe.
    reason: cross_reference
  - marker: c
    text: 'Oder: „zum Glauben kommt“. Das griechische Verb lässt offen, ob hier besonders der Beginn des Glaubens oder das Glauben als solches gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Die dreimalige Wiedergabe mit „damit“ bewahrt die aufeinanderfolgenden Ziel- bzw. Folgeaussagen und klingt zugleich natürlich im Deutschen.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ gibt den umfassenden Bezug knapp und unmittelbar wieder.
- source_word: ἓν
  choice: eins
  rationale: Das substantivisch gebrauchte Neutrum „eins“ bewahrt die offene, vielschichtige Aussage des Griechischen, ohne die Art der Einheit näher festzulegen.
- source_word: καθὼς
  choice: so wie
  rationale: „So wie“ kennzeichnet den Vergleich zwischen der Einheit der Glaubenden und der Beziehung von Vater und Sohn klar und idiomatisch.
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede wird ausdrücklich beibehalten und wahrt ihren relationalen wie theologischen Gehalt.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: in mir ... in dir
  rationale: Die wiederholte Präposition ἐν wird einheitlich mit „in“ wiedergegeben; dadurch bleibt die für Johannes kennzeichnende Sprache gegenseitigen Innewohnens erhalten.
- source_word: κἀγώ
  choice: und ich
  rationale: 'Die Verbindung gibt die wechselseitige Beziehung schlicht und natürlich wieder: „und ich in dir“.'
- source_word: καὶ αὐτοὶ
  choice: auch sie
  rationale: „Auch“ bewahrt die hinzufügende Kraft von καί und verbindet die Glaubenden mit der zuvor beschriebenen Beziehung.
- source_word: ἐν ἡμῖν
  choice: in uns
  rationale: Die wörtliche Wendung erhält die johanneische Aussage von Teilhabe und Innewohnen; „bei uns“ oder „mit uns“ wäre schwächer.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: „Die Welt“ bewahrt den etablierten, theologisch dichten johanneischen Ausdruck und seinen weiten Bezug.
- source_word: πιστεύῃ
  choice: glaubt
  rationale: Das Präsens im damit-Satz lässt offen, ob der Beginn oder das Fortbestehen des Glaubens im Vordergrund steht.
- source_word: ἀπέστειλας
  choice: gesandt hast
  rationale: Das deutsche Perfekt ist in diesem dass-Satz idiomatisch und bringt die in der Vergangenheit vollzogene Sendung mit ihrer fortdauernden Bedeutung zum Ausdruck, ohne den Aorist unnötig auszudeuten.
theological_decisions:
- issue: Art der Einheit der Glaubenden im Verhältnis zum Vater und zum Sohn
  choice: ἓν wird mit „eins“ wiedergegeben; „in uns“ bleibt ohne erklärenden Zusatz stehen.
  alternative: „damit sie alle vereint sind“ oder „damit sie alle eines Sinnes sind“
  rationale: Der Text vergleicht die Einheit der Glaubenden mit der Beziehung zwischen Vater und Sohn, bestimmt ihre Art aber nicht als organisatorisch, ethisch oder metaphysisch. Die offene Formulierung wahrt diese theologische Spannung.
- issue: Johanneische Sprache des Innewohnens
  choice: „in mir“, „in dir“ und „in uns“ werden wörtlich und parallel wiedergegeben.
  alternative: „bei mir / bei dir / bei uns“ oder „mit uns verbunden“
  rationale: Das wiederholte ἐν trägt die Aussage von gegenseitigem Innewohnen und Teilhabe. Eine Umschreibung würde diese Resonanz abschwächen oder die im Ausgangstext verbleibende Offenheit vorzeitig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die dreifache Wiederholung von „damit“ und die parallelen Wendungen mit „in“ wurden bewusst erhalten, um Struktur und johanneischen Sprachklang sichtbar zu machen.
