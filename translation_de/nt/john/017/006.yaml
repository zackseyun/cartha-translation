source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: de
  text: Ich habe den Menschen, die du mir aus der Welt gegeben hast, deinen Namen[b] offenbart.[a] Sie gehörten dir, und du hast sie mir gegeben, und sie haben dein Wort bewahrt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bekannt gemacht“.'
    reason: lexical_alternative
  - marker: b
    text: Mit Gottes „Namen“ ist seine offenbarte Identität und sein Charakter gemeint, nicht nur eine Bezeichnung.
    reason: cultural_note
  - marker: c
    text: 'Oder: „befolgt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: ich habe … offenbart
  rationale: φανερόω bezeichnet hier das Sichtbar- oder Bekanntmachen. „Offenbart“ ist im Deutschen natürlich, würdevoll und bewahrt den Gedanken göttlicher Selbsterschließung; „bekannt gemacht“ bleibt eine mögliche Alternative.
- source_word: τὸ ὄνομα
  choice: deinen Namen
  rationale: Der konkrete Ausdruck „Name“ wird beibehalten. Im johanneischen Zusammenhang umfasst er Gottes offenbarte Identität und sein Wesen, ohne dass dies im Haupttext paraphrasierend eingeengt wird.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: ἄνθρωποι kann Menschen allgemein bezeichnen. „Den Menschen“ gibt die griechische Form genau und idiomatisch wieder; der nähere Kontext bestimmt, dass hier Jesu Jünger gemeint sind.
- source_word: οὓς ἔδωκάς μοι ἐκ τοῦ κόσμου
  choice: die du mir aus der Welt gegeben hast
  rationale: Die Formulierung bewahrt sowohl den Gedanken des Gebens durch den Vater als auch die Herkunft beziehungsweise Herausnahme „aus der Welt“, ohne deren theologische Tragweite näher festzulegen.
- source_word: σοὶ ἦσαν
  choice: Sie gehörten dir
  rationale: Das prädikative Dativgefüge drückt Zugehörigkeit aus. „Sie gehörten dir“ ist im Deutschen natürlicher und eindeutiger als „Sie waren dein“.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: und du hast sie mir gegeben
  rationale: Die natürliche deutsche Wortstellung gibt den Sinn von κἀμοί („und mir“) klar wieder, ohne eine im Deutschen künstliche Hervorhebung zu erzeugen.
- source_word: τὸν λόγον σου
  choice: dein Wort
  rationale: „Wort“ wahrt die johanneische Begrifflichkeit und lässt die Bedeutungsbreite von Aussage, Botschaft und Weisung bestehen.
- source_word: τετήρηκαν
  choice: sie haben … bewahrt
  rationale: Das Perfekt wird mit deutschem Perfekt wiedergegeben. „Bewahrt“ erhält die Bedeutungsbreite von τηρέω zwischen Festhalten, Beachten und Befolgen besser als das engere „gehorcht“.
theological_decisions:
- issue: Bedeutung von „dein Name“
  choice: Den bildhaften Ausdruck „deinen Namen“ im Haupttext beibehalten
  alternative: „wer du bist“ oder „dein Wesen“
  rationale: Gemeint ist mehr als eine bloße Benennung, nämlich Gottes offenbarte Identität und sein Wesen. Die wörtliche Formulierung bewahrt jedoch die biblische Bildsprache und ihre theologische Tiefe.
- issue: Referent von τοῖς ἀνθρώποις
  choice: „den Menschen“
  alternative: „den Männern“ oder „den Jüngern“
  rationale: Der Ausdruck ist lexikalisch generisch, während der Kontext die von Jesus angesprochenen Jünger als konkrete Bezugsgruppe erkennen lässt. Die Übersetzung bewahrt den Wortlaut, ohne den Referenten durch eine engere Wiedergabe festzuschreiben.
- issue: Das Geben der Menschen durch den Vater an den Sohn
  choice: Die Aussage direkt wiedergeben, ohne ihren Mechanismus systematisch zu erklären
  alternative: Eine ausdrückliche Deutung im Sinne eines bestimmten Erwählungsmodells
  rationale: Der Vers bezeugt das Geben durch den Vater, erläutert hier aber nicht dessen Verhältnis zu Erwählung, Glauben oder menschlicher Antwort. Diese Spannung bleibt erhalten.
- issue: Bedeutung von τηρέω in Bezug auf Gottes Wort
  choice: „bewahrt“
  alternative: „befolgt“ oder „gehorcht“
  rationale: „Bewahrt“ lässt sowohl treues Festhalten als auch gehorsames Beachten anklingen und vermeidet, die Aussage auf nur einen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung setzt „den Menschen“ früh und hält den langen Relativsatz verständlich. Das Semikolon gliedert die aufeinanderfolgenden Aussagen, ohne ihre enge Verbindung aufzulösen.
