id: JHN.17.15
reference: John 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: de
  text: Ich bitte nicht darum, dass du sie aus der Welt wegnimmst, sondern dass du sie vor dem Bösen bewahrst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische τοῦ πονηροῦ kann sowohl „das Böse“ als auch „der Böse“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Ich bitte
  rationale: Das Präsens bezeichnet Jesu gegenwärtiges Bitten im Gebet. „Bitten“ gibt den unmittelbaren lexikalischen Sinn natürlich wieder; „beten“ wäre kontextuell möglich, wäre aber stärker religiös markiert.
- source_word: ἄρῃς
  choice: wegnimmst
  rationale: αἴρω bedeutet hier im Zusammenhang mit ἐκ τοῦ κόσμου, jemanden aus einem Bereich herauszunehmen bzw. zu entfernen. „Aus der Welt wegnehmen“ ist im Deutschen klar und idiomatisch.
- source_word: κόσμου
  choice: Welt
  rationale: „Welt“ bewahrt die Breite von κόσμος und lässt den johanneischen Kontext seine genauere Färbung bestimmen, ohne vorschnell auf „Weltordnung“ oder „menschliche Gesellschaft“ einzuengen.
- source_word: τηρήσῃς
  choice: bewahrst
  rationale: τηρέω kann „bewahren“, „hüten“ oder „schützen“ bedeuten. „Bewahren vor“ ist natürliches, würdevolles Deutsch und passt zur Konstruktion mit ἐκ.
- source_word: ἐκ
  choice: vor
  rationale: Nach τηρέω gibt ἐκ eine Bewahrung vor bzw. aus dem Einflussbereich einer Gefahr an. Im Deutschen ist „vor … bewahren“ die natürliche Entsprechung.
- source_word: τοῦ πονηροῦ
  choice: dem Bösen
  rationale: Die artikulierte Genitivform kann grammatisch sowohl unpersönlich „das Böse“ als auch persönlich „der Böse“ bedeuten. Im Haupttext steht die unpersönliche, im Deutschen sehr natürliche Lesart; die ebenso mögliche persönliche Lesart wird in der Fußnote ausdrücklich erhalten.
theological_decisions:
- issue: Ob τοῦ πονηροῦ unpersönlich („das Böse“) oder persönlich („der Böse“) zu verstehen ist
  choice: dem Bösen
  alternative: 'dem Bösen, das heißt: vor dem Bösen als Person / vor dem Bösen (dem Teufel)'
  rationale: Die griechische Form entscheidet grammatisch nicht zwischen Neutrum und Maskulinum. Der johanneische Sprachgebrauch kann eine persönliche Deutung stützen, während die unpersönliche Wiedergabe im Deutschen ebenfalls unmittelbar möglich ist. Die Fußnote bewahrt deshalb die echte Mehrdeutigkeit, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetsregister. Der Satzbau folgt der klaren Gegenüberstellung οὐκ … ἀλλά („nicht … sondern“).
