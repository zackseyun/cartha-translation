id: JHN.17.3
reference: John 17:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: de
  text: 'Und darin besteht das ewige Leben: dass sie dich erkennen, den allein wahren Gott, und Jesus, den Messias[a], den du gesandt hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „Jesus Christus“. Das griechische Wort Χριστός kann als Titel („Messias“) oder in manchen Zusammenhängen als namensähnliche Bezeichnung („Christus“) gebraucht werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Und darin besteht
  rationale: Die Wendung leitet eine erklärende Bestimmung ein. „Darin besteht“ gibt die definierende Aussage im Deutschen natürlich wieder; „Und“ bewahrt die weiterführende Kraft von δέ, ohne einen starken Gegensatz einzutragen.
- source_word: ἡ αἰώνιος ζωὴ
  choice: das ewige Leben
  rationale: Die etablierte und sachlich angemessene Wiedergabe des johanneischen Ausdrucks für das bleibende, zur kommenden Weltzeit gehörende Leben.
- source_word: ἵνα γινώσκωσι
  choice: dass sie … erkennen
  rationale: ἵνα bestimmt hier inhaltlich, worin das ewige Leben besteht. Das Präsens kann fortdauerndes, personales Erkennen einschließen. „Erkennen“ ist würdig und im biblisch-theologischen Kontext gehaltvoller als bloßes Faktenwissen, ohne eine zusätzliche Deutung auszuschreiben.
- source_word: σὲ
  choice: dich
  rationale: Direktes Objekt zu γινώσκωσι und Anrede des Vaters im Gebet Jesu.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: den allein wahren Gott
  rationale: „Allein wahr“ gibt μόνον ἀληθινόν idiomatisch und eng am griechischen Ausdruck wieder. Die Formulierung wahrt den exklusiven Anspruch, ohne ihn durch Zusätze auszulegen.
- source_word: καὶ
  choice: und
  rationale: Einfache Koordination zwischen dem angesprochenen Vater und Jesus als dem Gesandten; darüber hinausgehende dogmatische Beziehungen werden nicht in die Übersetzung eingetragen.
- source_word: ὃν ἀπέστειλας
  choice: den du gesandt hast
  rationale: Die Relativkonstruktion identifiziert Jesus durch seine Sendung vom Vater. Das deutsche Perfekt ist hier eine natürliche Wiedergabe des Aorists.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, den Messias
  rationale: Χριστός bleibt hier als Titel verständlich und wird daher mit „Messias“ wiedergegeben. Die Apposition mit Artikel ist im modernen Deutschen idiomatisch; die traditionelle Wiedergabe „Jesus Christus“ wird als echte Alternative in der Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis der Bezeichnung „der allein wahre Gott“ zu Jesus
  choice: Der Vater wird unmittelbar als „der allein wahre Gott“ angeredet; Jesus wird davon syntaktisch unterschieden und als der vom Vater Gesandte genannt.
  alternative: Durch erläuternde Zusätze entweder die trinitarische Lehre ausdrücklich eintragen oder die im Satz bestehende Unterscheidung abschwächen.
  rationale: Die Übersetzung bewahrt Wortlaut und theologische Spannung des Verses. Sie entscheidet spätere dogmatische Debatten nicht durch Zusätze und leugnet zugleich nichts, was der weitere johanneische Kontext über Jesus aussagt.
- issue: Wiedergabe von Χριστόν
  choice: Messias
  alternative: Christus
  rationale: Der Titelgehalt ist in diesem erklärenden und bekenntnishaften Zusammenhang weiterhin hörbar. Da Χριστός zugleich namensähnlich gebraucht werden kann, bleibt „Jesus Christus“ als traditionelle Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darin besteht“ formuliert die Definition natürlich; „erkennen“ bewahrt den personalen und fortdauernden Beiklang des griechischen Verbs. Die Kommas um „den Messias“ kennzeichnen die Apposition klar.
