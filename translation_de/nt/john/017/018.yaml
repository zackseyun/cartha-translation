review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die griechische Vergleichsstruktur καθὼς ... κἀγώ sachgerecht mit „Wie ... so habe auch ich ...“ wieder. Beide Vorkommen von ἀποστέλλω sind parallel als „gesandt“ übersetzt; εἰς τὸν κόσμον wird treffend und ohne zusätzliche Deutung mit „in die Welt“ wiedergegeben. Das unmarkierte Pronomen „sie“ bewahrt den kontextuellen Bezug auf die Jünger, ohne ihn interpretierend auszuschreiben.
  naturalness: „Wie du mich in die Welt gesandt hast, so habe auch ich sie in die Welt gesandt“ ist natürliches, modernes und zugleich dem Gebetskontext angemessen würdiges Standarddeutsch. Die Stellung von „auch ich“ ist idiomatisch und erhält die additive Nuance von κἀγώ.
  terminology: „Welt“ und „gesandt“ sind für den johanneischen Sprachgebrauch angemessen und konsistent. Die Wiedergabe vermeidet sowohl eine unnötig alltägliche Formulierung wie „geschickt“ als auch die stärker ausdeutende Wiedergabe „beauftragt“.
