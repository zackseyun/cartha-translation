id: JHN.17.18
reference: John 17:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: de
  text: Wie du mich in die Welt gesandt hast, so habe auch ich sie in die Welt gesandt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Wie ... so
  rationale: Die deutsche Vergleichskonstruktion gibt die Entsprechung zwischen dem Senden durch den Vater und dem Senden durch Jesus klar und natürlich wieder.
- source_word: ἐμὲ
  choice: mich
  rationale: Direktes Objekt von ἀπέστειλας; die Form ist im griechischen Satz hervorgehoben, ohne dass im Deutschen eine zusätzliche Verstärkung nötig ist.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: gesandt hast / habe ... gesandt
  rationale: Dasselbe deutsche Verb bewahrt die beabsichtigte Parallelität. „Senden“ entspricht zudem der johanneischen Sendungssprache, ohne sie durch „beauftragen“ auszudeuten.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Die Wendung bewahrt sowohl die durch εἰς bezeichnete Bewegung hinein als auch die theologische Mehrdeutigkeit von κόσμος im Johannesevangelium.
- source_word: κἀγὼ
  choice: so habe auch ich
  rationale: „Auch ich“ gibt καὶ ἐγώ wieder; das korrelative „so“ macht im Deutschen die durch καθὼς eröffnete Vergleichsstruktur vollständig und flüssig.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Pronomen verweist im Kontext auf die Jünger und wird ohne interpretierende Ergänzung wiedergegeben.
- source_word: κόσμον
  choice: Welt
  rationale: „Welt“ ist die übliche und offene Wiedergabe des johanneischen Schlüsselbegriffs und legt nicht vorschnell fest, ob vor allem Menschheit, Lebensbereich oder gottferne Ordnung gemeint ist.
theological_decisions:
- issue: Parallele zwischen der Sendung des Sohnes durch den Vater und der Sendung der Jünger durch Jesus
  choice: In beiden Satzteilen „senden“ verwenden und die Vergleichsstruktur „Wie ... so“ bewahren.
  alternative: Das zweite Verb mit „beauftragen“ oder „aussenden“ wiedergeben.
  rationale: Die Wiederholung wahrt die sprachliche Analogie des Verses, ohne daraus eine Gleichheit von Rang, Wesen oder Auftrag abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gesandt“ statt des alltagssprachlicheren „geschickt“ erhält den feierlichen Gebetskontext und die johanneische Sendungssprache, bleibt aber allgemein verständlich.
