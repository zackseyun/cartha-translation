  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: de
  text: Heilige sie in der Wahrheit[a]; dein Wort ist Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heilige sie durch die Wahrheit.“ Auch im zweiten Satz ist möglich: „Dein Wort ist die Wahrheit.“ Das griechische Prädikatsnomen „Wahrheit“ steht dort ohne Artikel und kann die Wesensart betonen: „ist Wahrheit“.'
    reason: Alternative syntaktische und semantische Wiedergaben der Präposition ἐν und des artikellosen Prädikatsnomens ἀλήθεια.
lexical_decisions:
- source_word: ἁγίασον
  choice: Heilige
  rationale: Der Aorist Aktiv Imperativ von ἁγιάζω bezeichnet hier, dass die Jünger Gott geweiht und in seine Heiligkeit hineingenommen werden. „Heilige“ bewahrt sowohl den Gedanken der Aussonderung für Gott als auch den der Heiligkeit und ist im Deutschen knapp und würdig.
- source_word: αὐτοὺς
  choice: sie
  rationale: Das Akkusativpronomen im Plural bezieht sich auf die Jünger; „sie“ gibt dies unmittelbar wieder.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: in der Wahrheit
  rationale: Die Wiedergabe bewahrt die durch den Artikel bestimmte „Wahrheit“ sowie die mögliche lokale beziehungsweise instrumentale Bedeutungsbreite von ἐν, ohne vorschnell nur „durch die Wahrheit“ festzulegen.
- source_word: ὁ λόγος ὁ σὸς
  choice: dein Wort
  rationale: Die wörtlich hervorgehobene Konstruktion „das Wort, das deine“ wird im natürlichen Deutschen treffend mit „dein Wort“ wiedergegeben. „Wort“ bleibt transparent für den johanneischen Gebrauch von λόγος.
- source_word: ἀλήθειά ἐστιν
  choice: ist Wahrheit
  rationale: Das artikellose Prädikatsnomen ἀλήθεια lässt sich qualitativ als „ist Wahrheit“ verstehen. Diese Formulierung bewahrt die substantivische Aussage stärker als „ist wahr“, ohne die ebenfalls mögliche bestimmte Wiedergabe auszuschließen.
theological_decisions:
- issue: Qualitative oder identifizierende Wiedergabe von ἀλήθειά ἐστιν
  choice: dein Wort ist Wahrheit
  alternative: dein Wort ist die Wahrheit
  rationale: Da das Prädikatsnomen im Griechischen keinen Artikel hat, bewahrt „ist Wahrheit“ die mögliche qualitative Aussage. Zugleich ist „ist die Wahrheit“ grammatisch nicht ausgeschlossen und wird deshalb in der Fußnote genannt, statt die theologische Spannung stillschweigend aufzulösen.
- issue: Bedeutungsbreite von ἐν bei der Heiligung
  choice: in der Wahrheit
  alternative: durch die Wahrheit
  rationale: „In der Wahrheit“ lässt sowohl den Bereich, in dem die Heiligung geschieht, als auch eine mögliche instrumentale Nuance offen. „Durch die Wahrheit“ würde allein das Mittel stärker festlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle Wendung „Heilige sie“ bleibt erhalten, weil sie den Sinn von Weihe und Heiligkeit bündig trägt; die Fußnote erläutert die echte Mehrdeutigkeit, ohne sie im Haupttext aufzulösen.
