  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: de
  text: Und nun, Vater, verherrliche du mich bei dir[a] mit der Herrlichkeit, die ich bei dir hatte, bevor die Welt existierte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „bei dir selbst“; die griechische Wendung bezeichnet Nähe beziehungsweise Gegenwart beim Vater.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „bevor die Welt war“ oder „bevor die Welt ins Dasein kam“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: verherrliche
  rationale: Der Imperativ von δοξάζω wird mit „verherrliche“ wiedergegeben. So bleibt das für Johannes zentrale Wortfeld von Herrlichkeit und Verherrlichung erhalten; „ehre“ wäre inhaltlich enger und weniger prägnant.
- source_word: σύ, πάτερ
  choice: Vater, verherrliche du mich
  rationale: Das ausdrücklich gesetzte Pronomen σύ ist betont. Das deutsche „du“ bewahrt diese Hervorhebung, ohne die Anrede unnatürlich wirken zu lassen.
- source_word: παρὰ σεαυτῷ
  choice: bei dir
  rationale: παρά mit dem Dativ bezeichnet hier Nähe beziehungsweise Gegenwart. „Bei dir“ ist im Deutschen natürlich und bewahrt zugleich den räumlich-relationalen Klang; die reflexive Form wird in einer Fußnote kenntlich gemacht.
- source_word: τῇ δόξῃ
  choice: mit der Herrlichkeit
  rationale: Der Dativ bezeichnet die Herrlichkeit, mit der die erbetene Verherrlichung geschehen soll. „Mit der Herrlichkeit“ gibt diese Verbindung klar und idiomatisch wieder.
- source_word: ᾗ εἶχον
  choice: die ich … hatte
  rationale: Der Imperfekt εἶχον bezeichnet den früheren Besitz dieser Herrlichkeit. Das deutsche Präteritum ist hier die natürliche Entsprechung.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: bevor die Welt existierte
  rationale: Die Konstruktion mit πρὸ τοῦ und Infinitiv bezeichnet Vorzeitigkeit. „Bevor die Welt existierte“ ist klares modernes Deutsch und lässt offen, ob alternativ schlichter „war“ oder stärker ingressiv „ins Dasein kam“ formuliert wird.
- source_word: παρὰ σοί
  choice: bei dir
  rationale: Die Wiederholung von παρά mit dem Dativ wird bewusst ebenfalls mit „bei dir“ übersetzt. Dadurch bleibt die sprachliche Verknüpfung zwischen der gegenwärtig erbetenen und der vorweltlichen Gemeinschaft sichtbar.
- source_word: κόσμον
  choice: Welt
  rationale: „Welt“ ist die übliche und kontextgemäße Wiedergabe von κόσμος im Johannesevangelium und vermeidet eine unnötige Eingrenzung auf „Universum“ oder „Schöpfungsordnung“.
theological_decisions:
- issue: Die im Vers ausgesagte Präexistenz Jesu
  choice: Die Zeitangabe wird unmittelbar auf die Herrlichkeit bezogen, die Jesus beim Vater hatte, bevor die Welt existierte.
  alternative: Die Formulierung abschwächen oder lediglich auf einen vorausbestimmten Ruhm beziehen.
  rationale: Der griechische Wortlaut stellt einen früheren Besitz von Herrlichkeit bei dem Vater vor der Existenz der Welt dar. Die Übersetzung gibt dies wieder, ohne die Aussage dogmatisch auszuweiten.
- issue: Wesen der mit dem Vater verbundenen Herrlichkeit
  choice: Herrlichkeit
  alternative: Majestät oder Ehre
  rationale: „Herrlichkeit“ bewahrt das johanneische Schlüsselwort und lässt die genaue Art dieser Herrlichkeit unausgedeutet, wie es auch der Vers selbst tut.
- issue: Räumlich-relationale Bedeutung von παρά mit Dativ
  choice: bei dir
  alternative: in deiner Gegenwart oder bei dir selbst
  rationale: „Bei dir“ wahrt sowohl persönliche Gemeinschaft als auch Nähe, ohne die Aussage rein räumlich oder abstrakt zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „bei dir“ spiegelt die parallelen griechischen Wendungen παρὰ σεαυτῷ und παρὰ σοί. Das betonte „du“ gibt das ausdrücklich gesetzte griechische Pronomen wieder. Beide Fußnotenmarker stehen an den jeweils sachlich zugehörigen Stellen im Haupttext.
