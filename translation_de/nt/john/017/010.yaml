  source_fidelity: Der Entwurf gibt die gegenseitige Zugehörigkeit in den ersten beiden Satzteilen zutreffend wieder und erhält bei ἐν αὐτοῖς sinnvoll die direkte Wiedergabe „in ihnen“. Das griechische Perfektpassiv δεδόξασμαι wird grundsätzlich angemessen durch das deutsche Perfektpassiv wiedergegeben.
  naturalness: „Alles, was mein ist“ sowie „was dein ist“ sind verständlich, wirken im modernen Standarddeutsch jedoch merklich gehoben beziehungsweise altertümlich. „Was mir/dir gehört“ ist natürlicher und wahrt die knappe parallele Struktur. Die Stellung von „in ihnen“ unmittelbar beim Verb ist ebenfalls flüssiger.
  terminology: „Verherrlicht“ ist für δεδόξασμαι im johanneischen Kontext ein etablierter und präziser Begriff. Die Fußnote soll die Mehrdeutigkeit von ἐν nicht durch die zusätzliche, im griechischen Wortlaut nicht enthaltene Vorstellung einer ausdrücklich „sichtbaren“ Verwirklichung einengen.
