  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: de
  text: Und alles, was mir gehört, gehört dir, und was dir gehört, gehört mir; und ich bin in ihnen verherrlicht worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch sie“ oder „unter ihnen“. Im Griechischen steht „in ihnen“; je nach Verständnis kann dies Ort, Mittel oder die Weise bezeichnen, in der die Verherrlichung in ihnen zum Ausdruck kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: alles, was mein ist
  rationale: Die substantivierte sächliche Pluralform mit πᾶς bezeichnet umfassend alles, was Jesus gehört. Die Formulierung ist im Deutschen natürlich und bewahrt den umfassenden Sinn, ohne ihn auf materielle Dinge zu verengen.
- source_word: σά
  choice: dein
  rationale: Das possessive Adjektiv steht prädikativ und wird im Deutschen idiomatisch mit „dein“ wiedergegeben. So bleibt die knappe Aussage gegenseitiger Zugehörigkeit erhalten.
- source_word: τὰ σὰ ἐμά
  choice: was dein ist, ist mein
  rationale: Die Formulierung spiegelt den ersten Satzteil natürlich wider und gibt die wechselseitige Zugehörigkeit ohne unnötige Ergänzungen wieder.
- source_word: δεδόξασμαι
  choice: ich bin verherrlicht worden
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Verherrlichung mit fortdauernder Geltung. Das deutsche Perfekt bewahrt sowohl das Passiv als auch den Ergebnisbezug.
- source_word: ἐν αὐτοῖς
  choice: in ihnen
  rationale: Dies ist die unmittelbarste Wiedergabe der Präposition ἐν. Im Zusammenhang verweist αὐτοῖς am ehesten auf die Menschen beziehungsweise Jünger, die der Vater Jesus gegeben hat; die Formulierung lässt offen, ob Ort, Mittel oder sichtbare Manifestation im Vordergrund steht.
theological_decisions:
- issue: Wechselseitige Zugehörigkeit zwischen dem Sohn und dem Vater
  choice: 'Die Aussage wird unmittelbar als gegenseitige Zugehörigkeit wiedergegeben: „Alles, was mein ist, ist dein, und was dein ist, ist mein.“'
  alternative: Die Aussage lediglich als funktionale Zusammenarbeit statt als wirkliche gegenseitige Zugehörigkeit abzuschwächen.
  rationale: Der griechische Text formuliert die Gegenseitigkeit ausdrücklich. Die Übersetzung darf diese christologische Aussage nicht abschwächen, soll aber auch keine späteren dogmatischen Fachbegriffe in den Vers eintragen.
- issue: Bezug und Bedeutung von ἐν αὐτοῖς
  choice: Die Grundbedeutung „in ihnen“ bleibt im Haupttext erhalten.
  alternative: „durch sie“ im instrumentalen Sinn oder „unter ihnen“ im Sinn relationaler Gegenwart.
  rationale: ἐν kann je nach Kontext örtliche, instrumentale oder manifestierende Nuancen tragen. Der Vers erzwingt keine eindeutige Festlegung; deshalb wahrt der Haupttext die Ambiguität, während die Fußnote mögliche Sinnrichtungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst parallele Satzstruktur bewahrt die feierliche Gegenseitigkeit der griechischen Aussage; das Semikolon gliedert die Besitz- und Verherrlichungsaussage klar.
