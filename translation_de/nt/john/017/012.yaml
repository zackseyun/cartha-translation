id: JHN.17.12
reference: John 17:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: de
  text: Solange ich bei ihnen war, bewahrte ich sie in deinem Namen, den du mir gegeben hast. Ich behütete sie, und kein Einziger von ihnen ging zugrunde[a] außer dem Sohn des Verderbens[b], damit die Schrift erfüllt würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging verloren“.'
    reason: lexical_alternative
  - marker: b
    text: '„Sohn des Verderbens“ ist eine semitisch geprägte Ausdrucksweise; sinngemäß auch: „einer, der dem Verderben verfallen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Solange ich bei ihnen war
  rationale: „Solange“ gibt den zeitlichen Rahmen und den andauernden Charakter der Imperfektformen natürlich wieder.
- source_word: ἐτήρουν
  choice: bewahrte ich sie
  rationale: „Bewahren“ bezeichnet hier ein fortdauerndes Schützen und Festhalten; der deutsche Kontext vermittelt den durativen Aspekt ohne schwerfällige Verlaufsform.
- source_word: ἐν τῷ ὀνόματί σου
  choice: in deinem Namen
  rationale: Die formnahe Wendung lässt die Bedeutung des Namens als Offenbarung, Vollmacht und Zugehörigkeit offen, ohne sie auslegend einzuengen.
- source_word: ᾧ δέδωκάς μοι
  choice: den du mir gegeben hast
  rationale: Das neutrale griechische Relativpronomen bezieht sich grammatisch auf „Name“; im Deutschen verlangt das maskuline „Name“ die Form „den“.
- source_word: καὶ ἐφύλαξα
  choice: Ich behütete sie
  rationale: „Behüten“ wahrt die Abwechslung gegenüber τηρέω („bewahren“) und bringt den Schutzaspekt von φυλάσσω zum Ausdruck.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: kein Einziger von ihnen ging zugrunde
  rationale: „Zugrunde gehen“ gibt den ernsten intransitiven Sinn von ἀπόλλυμι wieder; die johanneisch anschlussfähige Alternative „ging verloren“ steht in der Fußnote.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: der Sohn des Verderbens
  rationale: Die semitisch geprägte Genitivverbindung bleibt sichtbar, ohne sie zu einer ausdrücklichen Aussage über Vorherbestimmung auszuweiten.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: damit die Schrift erfüllt würde
  rationale: „Damit“ bewahrt die Ziel- beziehungsweise Ergebnisnuance von ἵνα; „die Schrift“ entspricht dem bestimmten Ausdruck im Griechischen.
theological_decisions:
- issue: Bezugswort von ᾧ δέδωκάς μοι
  choice: 'Der Relativsatz bezieht sich auf „deinen Namen“: „den du mir gegeben hast“.'
  alternative: 'Bezug auf die Jünger: „die du mir gegeben hast“.'
  rationale: Im vorliegenden SBLGNT-Text steht ein neutrales Relativpronomen im Singular, das grammatisch zu ὄνομα („Name“) passt, nicht zum maskulinen Plural αὐτούς („sie“).
- issue: Bedeutung von ὁ υἱὸς τῆς ἀπωλείας
  choice: „der Sohn des Verderbens“
  alternative: „der dem Verderben bestimmte Mensch“ oder traditionell „der Sohn der Verdammnis“
  rationale: Die formnahe Wiedergabe erhält die hebräisch-semitische Ausdrucksweise und ihre theologische Spannung, ohne eine bestimmte Lehre über Vorherbestimmung in den Text einzutragen.
- issue: Sinn von ἀπώλετο
  choice: „ging zugrunde“
  alternative: „ging verloren“
  rationale: Beide Bedeutungsrichtungen sind lexikalisch möglich. Der Haupttext gibt den gewichtigen Sinn des Verbs wieder; die Fußnote bewahrt die im Johannesevangelium bedeutsame Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bewahren“ und „behüten“ unterscheiden die beiden griechischen Verben, ohne unnatürlich zu wirken. „Kein Einziger“ gibt οὐδείς nachdrücklich, aber idiomatisch wieder. Die Satzteilung verbessert die Verständlichkeit, ohne die Gedankenfolge zu verändern.
