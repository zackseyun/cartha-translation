  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: de
  text: Sie sind nicht von der Welt[a], so wie ich nicht von der Welt bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie gehören nicht zur Welt.“ Die griechische Wendung mit ἐκ kann Herkunft, Ursprung oder Zugehörigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: aus
  rationale: Mit κόσμος bezeichnet ἐκ Herkunft, Ursprung oder Zugehörigkeit. „Aus“ entspricht der griechischen Präposition unmittelbar und ist im Deutschen natürlich.
- source_word: κόσμου
  choice: der Welt
  rationale: Die schlichte Wiedergabe bewahrt die johanneische Bedeutungsbreite, ohne κόσμος vorschnell als „Weltsystem“ oder „gefallene Weltordnung“ auszudeuten.
- source_word: οὐκ εἰσὶν
  choice: sie sind nicht
  rationale: Der verneinte Präsens von εἰμί wird direkt und idiomatisch wiedergegeben.
- source_word: καθὼς
  choice: so wie
  rationale: Die Formulierung kennzeichnet den Vergleich zwischen den Jüngern und Jesus klar und in natürlichem modernem Deutsch.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt den Vergleich.
- source_word: οὐκ εἰμὶ
  choice: ich nicht … bin
  rationale: Der verneinte Präsens der ersten Person wird entsprechend der deutschen Satzstellung wiedergegeben.
- source_word: ἐκ τοῦ κόσμου
  choice: aus der Welt
  rationale: Die wiederholte Wendung wird in beiden Satzteilen gleich übersetzt. „Aus der Welt“ bewahrt besonders den Herkunfts- oder Ursprungsaspekt; Zugehörigkeit bleibt als mögliche Nuance bestehen.
theological_decisions:
- issue: Bedeutung von „Welt“ in der johanneischen Theologie
  choice: „Welt“ ohne deutende Erweiterung im Haupttext
  alternative: „Weltsystem“ oder „gegenwärtige gefallene Ordnung“
  rationale: κόσμος besitzt bei Johannes häufig theologische Tiefe, doch der Vers selbst legt keine einzelne ausdeutende Umschreibung fest. Die einfache Bezeichnung bewahrt die Spannung und Bedeutungsbreite.
- issue: Bedeutungsnuance von ἐκ
  choice: Herkunft mit „aus“ ausdrücken und Zugehörigkeit in einer Fußnote offenhalten
  alternative: „von der Welt“ beziehungsweise eine reine Zugehörigkeitsformulierung
  rationale: ἐκ bezeichnet primär ein Ausgehen oder Herkommen, kann in diesem Zusammenhang aber zugleich Herkunft, Prägung und Zugehörigkeit berühren. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die symmetrische Wiederholung von „aus der Welt“ bildet die Struktur des griechischen Satzes ab; „so wie“ klingt gegenwärtig und verständlich.
