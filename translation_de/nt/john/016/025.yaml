source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: de
  text: Das habe ich in bildhafter Sprache[a] zu euch gesagt. Es kommt eine Stunde[b], in der ich nicht mehr in bildhafter Sprache zu euch reden werde, sondern euch offen[c] vom Vater erzählen werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Gleichnissen« beziehungsweise »in verhüllten Worten«; das griechische Wort bezeichnet hier bildhafte oder indirekte Rede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Es kommt eine Zeit.« Bei Johannes kann »Stunde« eine besondere theologische Bedeutung haben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »klar und deutlich« beziehungsweise »freimütig«; gemeint ist hier eine direkte, nicht bildhaft verhüllte Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: in bildhafter Sprache
  rationale: Das Wort bezeichnet im johanneischen Zusammenhang bildhafte oder indirekte Rede, nicht notwendig ein Gleichnis im engeren Sinn. Die Formulierung ist modern, verständlich und wahrt die wiederholte Wendung.
- source_word: λελάληκα
  choice: habe ich ... gesagt
  rationale: Das deutsche Perfekt gibt die vollendete Rede mit ihrer gegenwärtigen Bedeutung natürlich wieder. Beim ersten Vorkommen klingt „gesagt“ idiomatischer als „gesprochen“.
- source_word: ἔρχεται ὥρα
  choice: Es kommt eine Stunde
  rationale: „Stunde“ bewahrt die für Johannes charakteristische Ausdrucksweise und ihre mögliche theologische Resonanz; der fehlende Artikel wird nicht zu „die Stunde“ präzisiert.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Dies ist die natürliche und genaue deutsche Entsprechung im zukünftigen Gegensatz.
- source_word: λαλήσω
  choice: reden werde
  rationale: „Reden“ passt idiomatisch zur adverbialen Wendung „in bildhafter Sprache“ und hält den Vorgang des Sprechens fest.
- source_word: παρρησίᾳ
  choice: offen
  rationale: Im Gegensatz zur bildhaften, indirekten Rede bezeichnet das Wort hier eine offene und unverhüllte Mitteilung. „Offen“ lässt sowohl Klarheit als auch Freimütigkeit anklingen.
- source_word: ἀπαγγελῶ
  choice: erzählen werde
  rationale: Das Verb bezeichnet hier das Mit- oder Bekanntgeben. „Euch vom Vater erzählen“ ist natürliches Deutsch und unterscheidet die direkte Darlegung vom vorherigen „reden“.
- source_word: περὶ τοῦ πατρὸς
  choice: vom Vater
  rationale: Die idiomatische deutsche Verbindung mit „erzählen“ gibt den Gegenstand der Mitteilung klar wieder und wahrt die johanneische Vaterbezeichnung.
theological_decisions:
- issue: Wiedergabe von ὥρα im johanneischen Kontext
  choice: Es kommt eine Stunde
  alternative: Es kommt eine Zeit; Die Stunde kommt
  rationale: Die wörtliche Wiedergabe bewahrt die johanneische Resonanz, ohne durch einen bestimmten Artikel eine im Griechischen nicht ausdrücklich markierte Bestimmtheit einzutragen.
- issue: Bedeutung von παρρησίᾳ im Gegensatz zu ἐν παροιμίαις
  choice: offen
  alternative: klar und deutlich; freimütig
  rationale: Der unmittelbare Gegensatz betrifft verhüllte beziehungsweise indirekte und offene Rede. „Offen“ bewahrt diese Spannung, ohne die Bedeutung ausschließlich auf Verständlichkeit oder mutiges Auftreten festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gegensatz zwischen bisheriger bildhafter Rede und künftiger offener Mitteilung. „Eine Stunde“ erhält bewusst die johanneische Ausdrucksweise; die Fußnoten dokumentieren die echten lexikalischen Alternativen.
