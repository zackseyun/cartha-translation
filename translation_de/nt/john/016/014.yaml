id: JHN.16.14
reference: John 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: de
  text: Er wird mich verherrlichen, denn er wird von dem nehmen[a], was mein ist, und es euch verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „empfangen“.'
    reason: Lexikalische Alternative zu λήμψεται; λαμβάνω kann hier „nehmen“ oder „empfangen“ bedeuten.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Er
  rationale: Das Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf den Geist. Im natürlichen Deutschen genügt das Personalpronomen; ein betontes „jener“ wäre hier unnötig markiert.
- source_word: ἐμὲ
  choice: mich
  rationale: Direktes Objekt zu δοξάσει; die hervorgehobene Form des griechischen Pronomens wird durch die normale deutsche Wortstellung ausreichend wiedergegeben.
- source_word: δοξάσει
  choice: wird verherrlichen
  rationale: „Verherrlichen“ bewahrt das theologische Gewicht von δοξάζω im Johannesevangelium besser als das allgemeinere „ehren“.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier die Begründung dafür ein, wie der Geist Jesus verherrlichen wird. „Denn“ gibt den kausalen Zusammenhang würdig und natürlich wieder.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: von dem, was mein ist
  rationale: Die substantivierte possessive Wendung bleibt bewusst weit und wird nicht auf Lehre, Autorität oder Offenbarung eingeengt.
- source_word: λήμψεται
  choice: wird nehmen
  rationale: λαμβάνω kann „nehmen“ oder „empfangen“ bedeuten. „Nehmen“ passt zur Konstruktion mit ἐκ und bewahrt die aktive Ausdrucksweise; die Alternative wird in der Fußnote genannt.
- source_word: ἀναγγελεῖ
  choice: wird es verkünden
  rationale: „Verkünden“ gibt das Mitteilen oder Bekanntmachen angemessen und gewichtig wieder. Das im Deutschen nötige „es“ nimmt den Inhalt der vorausgehenden Wendung auf.
- source_word: ὑμῖν
  choice: euch
  rationale: Das Pronomen ist Dativ Plural und wird im Deutschen eindeutig mit „euch“ wiedergegeben.
theological_decisions:
- issue: Das Verhältnis des Geistes zu Jesus in ἐκ τοῦ ἐμοῦ λήμψεται
  choice: von dem nehmen, was mein ist
  alternative: von dem empfangen, was mein ist
  rationale: Die Formulierung lässt offen, was genau zu Jesus gehört und vom Geist mitgeteilt wird. So wird die Aussage nicht über den Text hinaus zu einer technischen Lehrformel verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken; die theologische Offenheit der possessiven Wendung bleibt erhalten.
