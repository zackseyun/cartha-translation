id: JHN.16.5
reference: John 16:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: de
  text: 'Doch jetzt gehe ich zu dem, der mich gesandt hat, und keiner von euch fragt mich: »Wohin gehst du?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Doch jetzt
  rationale: Gibt den durch δέ markierten Gegensatz in natürlichem Deutsch wieder und wahrt zugleich den zeitlichen Übergang mit νῦν.
- source_word: ὑπάγω
  choice: gehe ich / gehst du
  rationale: Das schlichte Bewegungsverb »gehen« entspricht dem johanneischen Gebrauch und lässt die im Kontext mitschwingende Rückkehr offen, ohne sie erklärend einzutragen.
- source_word: πρὸς τὸν πέμψαντά με
  choice: zu dem, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird idiomatisch wiedergegeben; der nicht ausdrücklich genannte Absender wird nicht als »Vater« ergänzt.
- source_word: πέμψαντά
  choice: gesandt hat
  rationale: »Senden« bewahrt die für das Johannesevangelium wichtige Sendungssprache; das Perfekt ist im Deutschen für die vorausliegende Sendung natürlich.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: keiner von euch
  rationale: Direkte und idiomatische Wiedergabe des partitiven Ausdrucks mit seiner uneingeschränkten Verneinung.
- source_word: ἐρωτᾷ με
  choice: fragt mich
  rationale: Im Zusammenhang bezeichnet ἐρωτάω das Stellen einer Frage; »fragt mich« ist klar und gegenwärtig.
- source_word: Ποῦ ὑπάγεις;
  choice: Wohin gehst du?
  rationale: »Wohin« bildet die gerichtete Bewegung präzise und in natürlichem modernem Deutsch ab.
theological_decisions:
- issue: Identität dessen, der Jesus gesandt hat
  choice: »zu dem, der mich gesandt hat« ohne ausdrückliche Ergänzung »Vater«
  alternative: »zu dem Vater, der mich gesandt hat«
  rationale: Der Vater ist im johanneischen Zusammenhang als Bezugsperson erkennbar, wird in diesem griechischen Satz jedoch nicht ausdrücklich genannt. Die Übersetzung bewahrt diese Formulierung und vermeidet eine erklärende Einfügung.
- issue: Spannung zu früheren Fragen der Jünger nach Jesu Ziel
  choice: Die uneingeschränkte Aussage »keiner von euch fragt mich« bleibt unverändert stehen.
  alternative: Durch eine Ergänzung wie »jetzt« bei »fragt« oder durch eine Umschreibung den scheinbaren Widerspruch zu Johannes 13,36 und 14,5 auflösen.
  rationale: Der Wortlaut enthält diese rhetorische Spannung. Eine Übersetzung soll sie nicht durch eine nicht ausdrücklich vorhandene Deutung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Doch jetzt« macht den Kontrast klar; »gesandt« hält das johanneische Sendungsmotiv in einem bibelsprachlich vertrauten, aber weiterhin allgemein verständlichen Register fest.
