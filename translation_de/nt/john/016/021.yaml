id: JHN.16.21
reference: John 16:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: de
  text: Wenn eine Frau ein Kind zur Welt bringt, hat sie Kummer, weil ihre Stunde gekommen ist. Doch wenn sie das Kind geboren hat, denkt sie nicht mehr an die Bedrängnis, aus Freude darüber, dass ein Mensch[a] in die Welt geboren worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann „Mensch“ oder „Mann“ bedeuten; hier ist ein Mensch allgemein gemeint, nicht eigens ein männliches Kind.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: Frau
  rationale: Die Aussage beschreibt allgemein eine gebärende Frau; „Ehefrau“ wäre hier unnötig einschränkend.
- source_word: ὅταν τίκτῃ
  choice: wenn eine Frau ein Kind zur Welt bringt
  rationale: Die Form bezeichnet bei einem allgemein gültigen Vergleich den laufenden Geburtsvorgang. Die deutsche Wendung ist natürlich und verständlich.
- source_word: λύπην ἔχει
  choice: hat sie Kummer
  rationale: „Kummer“ bewahrt die emotionale Bedeutung von λύπη und den Zusammenhang, in dem Trauer in Freude verwandelt wird, ohne den Ausdruck auf körperlichen Schmerz zu verengen.
- source_word: ἡ ὥρα αὐτῆς
  choice: ihre Stunde
  rationale: „Stunde“ bezeichnet hier den gekommenen Zeitpunkt der Geburt und erhält zugleich den für das Johannesevangelium charakteristischen Anklang von ὥρα.
- source_word: γεννήσῃ τὸ παιδίον
  choice: wenn sie das Kind geboren hat
  rationale: Die Form stellt die Geburt als abgeschlossenes Ereignis dar; das Perfekt gibt dies im Deutschen natürlich wieder.
- source_word: οὐκέτι μνημονεύει
  choice: denkt sie nicht mehr an
  rationale: Im Deutschen ist dies in Bezug auf eine gerade erlebte Bedrängnis natürlicher als das wörtlichere „erinnert sie sich nicht mehr an“, ohne den Sinn abzuschwächen.
- source_word: τῆς θλίψεως
  choice: die Bedrängnis
  rationale: Der Ausdruck bezeichnet die belastende Not der Geburt. „Bedrängnis“ wahrt die Stärke des griechischen Wortes, ohne es ausschließlich als körperlichen Schmerz zu deuten.
- source_word: διὰ τὴν χαράν
  choice: aus Freude darüber
  rationale: διά mit Akkusativ gibt den Grund an; die Formulierung verbindet diesen Grund im Deutschen flüssig mit dem folgenden ὅτι-Satz.
- source_word: ὅτι ἐγεννήθη
  choice: dass ... geboren worden ist
  rationale: ὅτι erläutert hier den Inhalt beziehungsweise Grund der Freude; der deutsche dass-Satz erhält diesen Zusammenhang.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet in diesem Geburtsvergleich einen Menschen allgemein und nicht notwendig ein männliches Kind.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: Die Wendung wird räumlich und idiomatisch wiedergegeben und bewahrt zugleich die johanneische Ausdrucksweise.
theological_decisions:
- issue: Generische Bedeutung von ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann
  rationale: Das grammatisch maskuline Substantiv kann „Mann“ bedeuten, wird hier aber im Zusammenhang einer Geburt allgemein für neu entstandenes menschliches Leben gebraucht. „Mensch“ bewahrt diese generische Bedeutung, ohne ein männliches Kind vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt die Gegenüberstellung von Kummer und Freude sowie die johanneisch bedeutsame Formulierung „ihre Stunde“. „Ein Kind zur Welt bringt“ ist bewusst idiomatisch, während „ein Mensch in die Welt geboren worden ist“ die auffällige Ausdrucksweise des griechischen Schlusssatzes erhält.
