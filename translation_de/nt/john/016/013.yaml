id: JHN.16.13
reference: John 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: de
  text: Wenn aber jener, der Geist der Wahrheit, kommt, wird er euch in der ganzen Wahrheit leiten.[a] Denn er wird nicht von sich selbst aus reden,[b] sondern er wird reden, was immer er hören wird, und euch verkünden, was kommen wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird er euch in die ganze Wahrheit führen«.'
    reason: Die Präposition ἐν bedeutet gewöhnlich »in«; zusammen mit »leiten/führen« kann die Wendung jedoch auch direktional verstanden werden.
  - marker: b
    text: 'Oder: »wird er nicht eigenmächtig reden«.'
    reason: »Von sich selbst aus« ist die nähere Wiedergabe des Griechischen; »eigenmächtig« gibt eine mögliche idiomatische Bedeutung wieder, legt die Wendung aber stärker auf Autorität fest.
  - marker: c
    text: 'Oder: »die kommenden Dinge«; »das Kommende«.'
    reason: Das substantivierte Partizip τὰ ἐρχόμενα lässt sich sowohl konkret-pluralisch als auch zusammenfassend wiedergeben.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Wenn aber
  rationale: ὅταν leitet eine zukünftige Zeitangabe ein; δέ wird als milder Gegensatz zum vorherigen Zusammenhang mit »aber« wiedergegeben.
- source_word: ἔλθῃ ἐκεῖνος
  choice: jener kommt
  rationale: Der Aorist Konjunktiv nach ὅταν bezeichnet hier ein zukünftiges Eintreten. »Jener« bildet die Hervorhebung durch ἐκεῖνος ab und ermöglicht die natürliche Apposition »der Geist der Wahrheit«.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: der Geist der Wahrheit
  rationale: Der johanneische Ausdruck wird als feste Bezeichnung bewahrt; der Genitiv bleibt bewusst offen und wird nicht als »der wahre Geist« oder »der Geist, der Wahrheit ist« aufgelöst.
- source_word: ὁδηγήσει ὑμᾶς
  choice: wird er euch … leiten
  rationale: ὁδηγέω bedeutet führen oder leiten. »Leiten« ist im Deutschen in Verbindung mit »in der Wahrheit« natürlich und würdevoll.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: in der ganzen Wahrheit
  rationale: Die Wiedergabe folgt der Präposition ἐν und bewahrt den bestimmten Artikel sowie die Zuordnung von πάσῃ zu »Wahrheit«. Die mögliche dynamisch-direktionale Auffassung wird in der Fußnote genannt.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: Denn er wird nicht von sich selbst aus reden
  rationale: »Von sich selbst aus« bildet ἀφ’ ἑαυτοῦ eng ab, ohne die Wendung ausdrücklich als Frage eigener Autorität auszudeuten.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: sondern er wird reden, was immer er hört
  rationale: Die Gegenüberstellung bleibt erhalten; ὅσα wird umfassend als »was immer« und das Futur ἀκούσει in natürlicher deutscher Zukunftsfolge als Präsens wiedergegeben.
- source_word: τὰ ἐρχόμενα
  choice: was kommen wird
  rationale: Die substantivierte Partizipialwendung bezeichnet Kommendes. Die Formulierung ist verständlich und lässt offen, ob einzelne Ereignisse oder die Zukunft insgesamt gemeint sind.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: euch verkünden
  rationale: ἀναγγέλλω kann berichten, ankündigen oder bekannt machen bedeuten; »verkünden« wahrt hier den feierlichen Offenbarungscharakter.
theological_decisions:
- issue: Personale Bezugnahme auf den Geist
  choice: Maskuline personale Bezüge durch »jener« und »er«
  alternative: Nur »der Geist« wiederholen oder sachlich-pronominal formulieren
  rationale: Obwohl πνεῦμα im Griechischen sächlich ist, verwendet der Text das maskuline ἐκεῖνος. Die Übersetzung wahrt diese ausdrücklich personale Bezugnahme, ohne daraus zusätzliche dogmatische Aussagen abzuleiten.
- issue: Bedeutung von ἐν τῇ ἀληθείᾳ πάσῃ
  choice: »in der ganzen Wahrheit« im Haupttext
  alternative: »in die ganze Wahrheit«
  rationale: »In der ganzen Wahrheit« bildet ἐν formal ab und ist im Deutschen mit »leiten« möglich. Die direktionale Deutung der Metapher bleibt als echte Übersetzungsalternative in einer Fußnote erhalten.
- issue: Abhängigkeit der Rede des Geistes
  choice: »nicht von sich selbst aus reden«
  alternative: »nicht eigenmächtig reden«
  rationale: Die engere Formulierung wahrt die Aussage der Herkunft beziehungsweise Quelle seiner Rede, ohne sie einseitig auf Autorität oder Eigenmächtigkeit festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bewahrt die hervorgehobene Apposition »jener … der Geist der Wahrheit«, ohne im Deutschen unnötig schwerfällig zu werden. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
