id: JHN.16.27
reference: John 16:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: de
  text: Denn der Vater selbst liebt euch, weil ihr mich geliebt habt und geglaubt habt, dass ich von Gott ausgegangen bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich von Gott gekommen bin“; das Griechische kann auch ein Ausgehen aus Gottes Gegenwart anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατήρ
  choice: Denn der Vater selbst
  rationale: „Denn“ führt die Begründung zum vorherigen Zusammenhang fort; „selbst“ bewahrt die intensive Hervorhebung von αὐτός beim Vater.
- source_word: φιλεῖ
  choice: liebt
  rationale: Das Präsens bezeichnet die gegenwärtige persönliche Liebe des Vaters; „liebt“ ist im Deutschen natürlich und angemessen, ohne die Zuneigung abzuschwächen.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: weil ihr mich geliebt habt
  rationale: Das erste ὅτι ist kausal. Das Perfekt πεφιλήκατε bezeichnet eine vollzogene Liebe mit fortdauernder Bedeutung; das deutsche Perfekt gibt dies im natürlichen Gegenwartsdeutsch gut wieder.
- source_word: καὶ πεπιστεύκατε
  choice: und geglaubt habt
  rationale: Die koordinierte Perfektform bezeichnet einen Glauben, der entstanden ist und weiterhin gilt. Die Satzklammer vermeidet eine unnötige Wiederholung von „habt“.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: dass ich von Gott ausgegangen bin
  rationale: Das zweite ὅτι leitet den Inhalt des Glaubens ein. „Von Gott ausgegangen“ bewahrt die Herkunfts- und Sendungssprache von παρά und ἐξέρχομαι, ohne sie dogmatisch auszudeuten.
theological_decisions:
- issue: Christologische Aussage über Jesu Herkunft und Sendung
  choice: „dass ich von Gott ausgegangen bin“
  alternative: „dass ich von Gott gekommen bin“ / „dass ich aus Gottes Gegenwart herausgegangen bin“
  rationale: „Ausgegangen“ hält sich eng an ἐξῆλθον und lässt offen, wie Herkunft, Gegenwart Gottes und Sendung zueinander stehen. Eine ausführlichere dogmatische Erklärung wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aussagen über Lieben und Glauben bleiben erhalten; die Herkunftsaussage wird bewusst nicht erklärend erweitert.
