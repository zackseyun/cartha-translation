revisions:
- from: Und wenn jener kommt, wird er die Welt überführen – in Bezug auf Sünde, auf Gerechtigkeit[a] und auf Gericht.
  to: Und wenn jener kommt, wird er die Welt hinsichtlich Sünde, Gerechtigkeit[a] und Gericht überführen.
  rationale: Der Gedankenstrich und die schwerfällige Wendung „in Bezug auf“ werden durch „hinsichtlich“ ersetzt. So bleibt die dreigliedrige, von περί bestimmte Gegenstandsangabe erhalten, während der Satz im modernen Standarddeutsch flüssiger und klarer ist. Alle übrigen Entscheidungen bleiben bestehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:55:26Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die temporale Funktion von ἐλθών, den hervorgehobenen Bezug von ἐκεῖνος, die drei mit περί eingeführten Gegenstandsbereiche sowie die Singularformen sachgerecht wieder. „Überführen“ ist für ἐλέγξει als forensisch-moralisch offene Wiedergabe vertretbar.
  naturalness: Die Fügung „die Welt überführen – in Bezug auf …“ ist im Deutschen syntaktisch und idiomatisch schwerfällig. Die Präpositionalgruppe sollte unmittelbar und ohne den abtrennenden Gedankenstrich an „überführen“ angeschlossen werden.
  terminology: „Jener“, „Welt“, „Sünde“, „Gerechtigkeit“ und „Gericht“ sind in diesem Kontext tragfähige Wiedergaben. Die Fußnotenalternative „Recht“ ist möglich, wenngleich „Gerechtigkeit“ im Haupttext die passendere offene Standardwiedergabe bleibt.
  issues:
  - severity: medium
    issue: Unnatürliche Stellung und Abtrennung der Präpositionalgruppe
    rationale: „überführen – in Bezug auf Sünde“ unterbricht im Deutschen die Rektion von „überführen“ und klingt weniger natürlich als eine unmittelbar angeschlossene Angabe wie „hinsichtlich …“. Die Änderung betrifft Stil und syntaktische Klarheit, nicht den Sinn.
  revised_text: Und wenn jener kommt, wird er die Welt hinsichtlich Sünde, Gerechtigkeit[a] und Gericht überführen.
