id: JHN.16.8
reference: John 16:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: de
  text: Und wenn jener kommt, wird er die Welt hinsichtlich Sünde, Gerechtigkeit[a] und Gericht überführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Recht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθὼν
  choice: wenn … kommt
  rationale: Das aoristische Partizip hat hier temporale Funktion; die Wiedergabe mit einem deutschen Nebensatz ist natürlich und wahrt den zeitlichen Bezug.
- source_word: ἐκεῖνος
  choice: jener
  rationale: Das betonte Demonstrativpronomen wird gegenüber einem bloßen „er“ kenntlich gemacht und verweist im unmittelbaren Kontext auf den kommenden Beistand.
- source_word: ἐλέγξει
  choice: wird … überführen
  rationale: '„Überführen“ bewahrt die moralisch-forensische Bedeutung: Schuld beziehungsweise Irrtum wird aufgedeckt und erwiesen. Es legt nicht unnötig fest, ob zugleich innere Überzeugung gemeint ist.'
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: Die herkömmliche Wiedergabe erhält die für Johannes charakteristische Weite und Spannung des Ausdrucks, ohne ihn ausdrücklich auf ein Weltsystem oder bestimmte Menschen einzuengen.
- source_word: περὶ
  choice: in Bezug auf … auf … und auf
  rationale: Die Formulierung gibt die dreimalige Präposition in einer im Deutschen verständlichen, rhetorisch parallelen Reihe wieder.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Der Singular des griechischen Textes bleibt erhalten; seine nähere Bestimmung folgt im nächsten Vers.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die übliche und kontextuell offene Wiedergabe von δικαιοσύνη; sie kann hier sowohl rechtes Sein als auch die forensische Dimension mitschwingen lassen.
- source_word: κρίσεως
  choice: Gericht
  rationale: „Gericht“ bewahrt die rechtliche und eschatologische Bedeutung, ohne den Begriff vorschnell auf Verurteilung zu verengen.
theological_decisions:
- issue: Bezug und Nachdruck von ἐκεῖνος
  choice: Das Demonstrativpronomen bezieht sich auf den zuvor genannten Beistand und wird betont mit „jener“ wiedergegeben.
  alternative: Einfaches „er“, wobei der griechische Nachdruck unausgedrückt bleibt.
  rationale: Der unmittelbare Zusammenhang bestimmt den Bezug; „jener“ erhält die im Griechischen markierte Hervorhebung, ohne weitere dogmatische Aussagen einzutragen.
- issue: Bedeutungsumfang von ἐλέγξει
  choice: „wird … überführen“
  alternative: „wird … zurechtweisen“, „wird … bloßstellen“ oder „wird … von Schuld überzeugen“
  rationale: „Überführen“ hält die Spannung zwischen Aufdeckung, Erweis des Unrechts und Schuldnachweis offen und vermeidet die Festlegung auf eine rein innere Überzeugungswirkung.
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht[a]
  rationale: „Gerechtigkeit“ passt zur Erklärung im Folgevers und wahrt zugleich den breiten theologischen und forensischen Gehalt. Die mögliche Alternative wird vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich gliedert die Aussage und macht deutlich, dass die drei mit περὶ eingeleiteten Begriffe den Bereich des Überführens angeben. Die dreigliedrige Parallelstruktur des griechischen Satzes bleibt hörbar.
