  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: de
  text: Ich bin vom Vater ausgegangen und in die Welt gekommen. Nun verlasse ich die Welt wieder und gehe zum Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Ich bin vom Vater ausgegangen
  rationale: „Ausgehen von“ gibt sowohl die Bewegung als auch den Ursprung beim Vater wieder und ist im Deutschen natürlich, ohne die Aussage dogmatisch auszudeuten.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: und in die Welt gekommen
  rationale: Das Perfekt wird im Deutschen idiomatisch mit „bin … gekommen“ wiedergegeben; „in die Welt“ bewahrt die durch εἰς bezeichnete Bewegung hinein.
- source_word: πάλιν
  choice: wieder
  rationale: „Wieder“ kennzeichnet die gegenläufige zweite Bewegung und steht im Deutschen natürlich bei „verlasse“.
- source_word: ἀφίημι τὸν κόσμον
  choice: Nun verlasse ich die Welt
  rationale: Das Präsens beschreibt das unmittelbar bevorstehende Verlassen. „Nun“ macht den Übergang zur zweiten Bewegung deutlich, ohne zusätzlichen Inhalt einzuführen.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: und gehe zum Vater
  rationale: „Gehe zum Vater“ gibt die gegenwärtige beziehungsweise bevorstehende Bewegung auf den Vater hin knapp und idiomatisch wieder.
theological_decisions:
- issue: Jesu Herkunft vom Vater und Rückkehr zum Vater
  choice: Die Aussage wird unmittelbar als „vom Vater ausgegangen“ und „zum Vater“ wiedergegeben.
  alternative: Die Herkunft lediglich mit „von Gott gekommen“ abzuschwächen oder sie durch eine ausdrückliche dogmatische Erklärung von Präexistenz und Inkarnation zu erweitern.
  rationale: Der griechische Text behauptet Herkunft vom Vater, Eintritt in die Welt und Rückkehr zum Vater. Diese christologische Spannung bleibt erhalten, ohne über den Wortlaut hinaus erläutert zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bewegungen – vom Vater in die Welt und aus der Welt zum Vater – bleiben klar erkennbar; „nun … wieder“ bildet den Übergang natürlich ab.
