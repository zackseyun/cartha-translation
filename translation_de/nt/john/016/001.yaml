  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: de
  text: Dies alles habe ich euch gesagt, damit ihr nicht zu Fall kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ins Straucheln geratet“, „Anstoß nehmt“ oder „vom Glauben abfallt“. Das griechische Verb kann bezeichnen, dass jemand zu Fall gebracht und dadurch zum Unglauben oder Abfall verleitet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Dies alles
  rationale: Das substantivierte „dies alles“ gibt den rückverweisenden neutralen Plural natürlich wieder und bezieht sich auf Jesu vorangegangene Worte.
- source_word: λελάληκα
  choice: habe ich … gesagt
  rationale: Das deutsche Perfekt bewahrt die vollendete, für die Gegenwart bedeutsame Aussage; „gesagt“ ist im heutigen Deutsch natürlicher als „gesprochen“ mit indirektem Objekt.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ der zweiten Person Plural wird im Deutschen eindeutig und idiomatisch mit „euch“ wiedergegeben.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Formulierung gibt den verneinten Zwecksatz klar und natürlich wieder.
- source_word: σκανδαλισθῆτε
  choice: zu Fall kommt
  rationale: Die Wendung bewahrt das Bild des Stolperns beziehungsweise Zu-Fall-Kommens und lässt zugleich den im Verfolgungskontext möglichen Sinn eines Glaubensabfalls erkennen, ohne ihn im Haupttext festzuschreiben.
theological_decisions:
- issue: Bedeutung von σκανδαλισθῆτε im Zusammenhang angekündigter Verfolgung
  choice: nicht zu Fall kommt
  alternative: nicht ins Straucheln geratet; keinen Anstoß nehmt; nicht vom Glauben abfallt
  rationale: „Zu Fall kommen“ wahrt das Bild und den ernsten geistlichen Sinn, legt sich aber nicht ausschließlich auf vollständigen Glaubensabfall oder bloße Kränkung fest. Die Fußnote macht die Spannweite ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dies alles“ ist im fortlaufenden Lehrgespräch natürlich; „zu Fall kommen“ bewahrt die Bildhaftigkeit und die theologische Offenheit des griechischen Ausdrucks.
