  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: de
  text: Doch weil ich euch das alles gesagt habe, hat Trauer euer Herz[a] erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Herzen“. Im Griechischen steht „Herz“ im Singular, während „euer“ mehrere Angesprochene bezeichnet. Das kann die gemeinsame innere Trauer der Gruppe ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Die adversative Konjunktion stellt einen Kontrast zum vorher Gesagten her. „Doch“ klingt im Deutschen natürlich und trägt den feierlichen Ton des Zusammenhangs.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι ist hier kausal und nennt den Grund für die Trauer der Jünger.
- source_word: ταῦτα
  choice: das alles
  rationale: Der Plural verweist auf die zuvor von Jesus angesprochenen Dinge. „Das alles“ gibt diesen zusammenfassenden Plural im heutigen Deutsch natürlicher wieder als „diese Dinge“.
- source_word: λελάληκα
  choice: gesagt habe
  rationale: Das Perfekt bezeichnet ein abgeschlossenes Reden mit gegenwärtiger Wirkung. Das deutsche Perfekt „gesagt habe“ bewahrt diesen Bezug und ist idiomatischer als „gesprochen habe“.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ Plural wird unmittelbar und natürlich mit „euch“ wiedergegeben.
- source_word: ἡ λύπη
  choice: Trauer
  rationale: λύπη bezeichnet tiefen inneren Schmerz beziehungsweise Kummer. „Trauer“ ist gewichtig, verständlich und passt zur Füllungsmetapher.
- source_word: πεπλήρωκεν
  choice: hat … erfüllt
  rationale: Die wörtliche Füllungsmetapher von πληρόω sowie der perfektische Aspekt bleiben erhalten; eine Wiedergabe wie „hat überwältigt“ wäre stärker deutend.
- source_word: ὑμῶν τὴν καρδίαν
  choice: euer Herz
  rationale: Der griechische Text verbindet das pluralische Possessivpronomen mit dem Singular „Herz“. Die deutsche Form bewahrt diese kollektive Darstellung des gemeinsamen inneren Zustands.
theological_decisions:
- issue: Kollektiver Singular „Herz“ oder distributiver Plural „Herzen“
  choice: euer Herz
  alternative: eure Herzen
  rationale: Der Singular καρδίαν bei pluralischem ὑμῶν kann die Jüngergruppe in ihrer gemeinsamen inneren Trauer darstellen. Der Haupttext bewahrt diese Form, während die Fußnote die im Deutschen ebenfalls mögliche distributive Wiedergabe nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die Satzstellung ist natürlich, während die Füllungsmetapher, das Perfekt und der auffällige kollektive Singular des Ausgangstextes erhalten bleiben.
