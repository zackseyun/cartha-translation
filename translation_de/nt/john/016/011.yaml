  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: de
  text: und über das Gericht[a], weil der Herrscher[b] dieser Welt gerichtet ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fürst“. Gemeint ist wahrscheinlich Satan; vergleiche Johannes 12,31 und 14,30.'
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 'Oder: „als gerichtet dasteht“. Das griechische Perfekt bezeichnet ein vollzogenes Gericht, dessen Wirkung fortbesteht.'
    reason: verbal_aspect
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: und über das Gericht
  rationale: περί mit Genitiv bezeichnet hier das Thema; δέ verbindet diesen dritten Punkt mit den vorausgehenden Aussagen über Sünde und Gerechtigkeit. „Gericht“ gibt κρίσις direkt und im johanneischen Zusammenhang passend wieder.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι leitet hier die Begründung dafür ein, weshalb der Geist die Welt im Blick auf das Gericht überführt.
- source_word: ὁ ἄρχων
  choice: der Herrscher
  rationale: ἄρχων bezeichnet jemanden, der Herrschaft oder Autorität ausübt. „Herrscher“ ist im heutigen Deutsch klarer als das traditionelle „Fürst“ und bewahrt den Titel, ohne die Person im Haupttext ausdrücklich zu benennen.
- source_word: τοῦ κόσμου τούτου
  choice: dieser Welt
  rationale: κόσμος wird im Johannesevangelium regelmäßig mit „Welt“ wiedergegeben; die Formulierung bezeichnet hier die gegen Gott stehende Weltordnung, ohne dass dies in der Übersetzung erklärend ergänzt werden muss.
- source_word: κέκριται
  choice: gerichtet worden ist
  rationale: Die Form ist Perfekt Passiv von κρίνω. „Gerichtet worden ist“ bewahrt das Passiv und bezeichnet ein vollzogenes Gericht, dessen Ergebnis fortbesteht, ohne die Bedeutung vorschnell auf „verurteilt“ zu verengen.
theological_decisions:
- issue: Identität des „Herrschers dieser Welt“
  choice: Der Titel bleibt im Haupttext stehen; die wahrscheinliche Beziehung auf Satan wird nur in der Fußnote genannt.
  alternative: „Satan, der Herrscher dieser Welt“
  rationale: Johannes 12,31 und 14,30 legen die Identifikation mit Satan nahe, doch der Vers selbst verwendet einen Titel und keinen Eigennamen. Die Übersetzung bewahrt diese Ausdrucksweise.
- issue: Bedeutungsumfang von κέκριται
  choice: „gerichtet worden ist“
  alternative: „verurteilt worden ist“ oder „als verurteilt dasteht“
  rationale: κρίνω bezeichnet zunächst das Richten. Eine Verurteilung liegt im Zusammenhang nahe, wird aber durch das Verb allein nicht so eng festgelegt; daher bleibt die Hauptübersetzung lexikalisch offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt als Teil der fortlaufenden Aufzählung bewusst satzfragmentarisch und schließt mit „und über“ an den vorherigen Kontext an.
