base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: de
  text: 'Da sagten einige seiner Jünger zueinander: »Was ist das, was er uns sagt: ›Eine kurze Zeit, und ihr seht mich nicht, und wieder eine kurze Zeit, und ihr werdet mich sehen‹? Und: ›Weil ich zum Vater gehe‹[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und: ›Dass ich zum Vater gehe‹?« Das griechische Bindewort kann entweder einen angeführten Inhalt einleiten (»dass«) oder einen Grund angeben (»weil«).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier eine folgernde erzählerische Fortsetzung; „Da“ klingt im modernen Deutschen natürlich.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: einige seiner Jünger
  rationale: Die partitive Wendung bezeichnet eine Teilgruppe der Jünger.
- source_word: πρὸς ἀλλήλους
  choice: zueinander
  rationale: Gibt die wechselseitige Unterhaltung knapp und idiomatisch wieder.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Was meint er damit, wenn er zu uns sagt
  rationale: Gibt die verständnisbezogene Frage der Jünger in natürlichem Deutsch wieder, ohne den Inhalt auszulegen.
- source_word: Μικρὸν
  choice: noch eine kurze Zeit
  rationale: Das substantivisch gebrauchte Adjektiv ist hier zeitlich zu verstehen; „noch“ passt im Deutschen zur bevorstehenden kurzen Frist.
- source_word: θεωρεῖτέ με
  choice: seht ihr mich nicht mehr
  rationale: „Sehen“ ist kontextgerecht; „nicht mehr“ drückt in natürlichem Deutsch das Ende des gegenwärtigen Sehens aus.
- source_word: ὄψεσθέ με
  choice: werdet ihr mich sehen
  rationale: Die Zukunftsform wird ausdrücklich wiedergegeben; trotz unterschiedlicher griechischer Verben bleibt die rhetorische Wiederholung von „sehen“ erhalten.
- source_word: πάλιν
  choice: wieder
  rationale: Direkte und idiomatische Entsprechung.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Weil ich zum Vater gehe
  rationale: Bewahrt die mögliche kausale Kraft von ὅτι und die Formulierung „zum Vater“ des griechischen Textes; die alternative inhaltseinleitende Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von Jesu Fortgehen und Wiedersehen
  choice: Der Vers bleibt hinsichtlich Tod, Auferstehung, Himmelfahrt, Erscheinungen nach der Auferstehung oder geistlicher Gegenwart offen.
  alternative: Eine dieser heilsgeschichtlichen Deutungen ausdrücklich in die Übersetzung aufnehmen.
  rationale: Der Vers schildert gerade das Unverständnis der Jünger und bestimmt den Bezug noch nicht eindeutig.
- issue: Funktion von ὅτι vor „ich gehe zum Vater“
  choice: 'Im Haupttext kausal: „Weil ich zum Vater gehe“'
  alternative: 'Inhaltseinleitend: „Dass ich zum Vater gehe“'
  rationale: Beides ist grammatisch möglich. Die Hauptfassung folgt der möglichen kausalen Verknüpfung; die genuine Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; die Wiederholung „eine kurze Zeit“ und „sehen“ bleibt erhalten. Die Fußnotenmarkierung [a] steht unmittelbar nach dem Vers.
