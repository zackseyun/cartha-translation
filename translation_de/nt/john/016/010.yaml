id: JHN.16.10
reference: John 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: de
  text: und über Gerechtigkeit[a], weil ich zum Vater gehe und ihr mich nicht mehr seht;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann moralische Gerechtigkeit, gerechtes Handeln oder Recht im Sinne eines gerechten Urteils bezeichnen. Hier steht es im Zusammenhang damit, dass Jesus zum Vater geht.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: über
  rationale: In der wiederholten Gliederung von Vers 9–11 gibt „über“ den jeweiligen Gegenstand knapp und natürlich wieder.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt im Deutschen sowohl die moralische als auch die rechtliche Bedeutungsbreite des griechischen Begriffs und lässt den Bezug auf Jesu Bestätigung durch seine Rückkehr zum Vater offen.
- source_word: δέ
  choice: und
  rationale: δέ führt hier den nächsten Punkt der Aufzählung fort und bezeichnet keinen starken Gegensatz.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι leitet hier die Begründung für die Aussage über die Gerechtigkeit ein.
- source_word: πρὸς τὸν πατέρα
  choice: zum Vater
  rationale: Bei einem Verb der Bewegung bezeichnet πρός das Ziel; der bestimmte Artikel wird in der natürlichen deutschen Verbindung „zum Vater“ bewahrt.
- source_word: ὑπάγω
  choice: gehe
  rationale: Das Präsens hat im Zusammenhang auf die unmittelbar bevorstehende Rückkehr Jesu zum Vater bezogene Bedeutung; „gehe“ ist natürlich und nah am Ausgangstext.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Formulierung bezeichnet das Ende des bisherigen Sehens.
- source_word: θεωρεῖτέ
  choice: seht
  rationale: Im Zusammenhang meint das Verb das wahrnehmende Sehen Jesu; „seht“ ist klar und modern, ohne eine stärkere Nuance wie „betrachtet“ aufzuzwingen.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in diesem theologisch gewichtigen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtsein; Rechtfertigung
  rationale: Das deutsche Wort „Gerechtigkeit“ deckt die mögliche moralische und forensische Dimension ab. Der Vers kann auf Jesu Gerechtigkeit beziehungsweise seine Bestätigung durch den Gang zum Vater zielen, sagt dies jedoch nicht ausdrücklich; die Übersetzung legt sich daher nicht enger fest.
- issue: Bezug des begründenden ὅτι-Satzes
  choice: kausale Wiedergabe mit „weil“
  alternative: inhaltliche Wiedergabe mit „dass“
  rationale: Im Zusammenhang der drei Aussagen in Johannes 16,9–11 erklärt der ὅτι-Satz am natürlichsten, weshalb es um Gerechtigkeit geht. Die grammatisch mögliche inhaltliche Lesart wird nicht eigens in den Haupttext übernommen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzform bleibt als Teil der Aufzählung aus Johannes 16,8–11 bewusst unvollständig; das abschließende Semikolon signalisiert die Fortsetzung zum nächsten Glied.
