review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die fortdauernde bzw. wiederholte Rede mit „sagten sie immer wieder“ angemessen wieder und erhält den rätselhaften Ausdruck μικρόν als Zitat. „Was meint er damit“ ist jedoch gegenüber Τί ἐστιν τοῦτο („Was ist das?“) stärker deutend; die Frage sollte als Frage nach dem Gesagten formuliert bleiben. Auch „wovon er spricht“ ist möglich, aber gegenüber τί λαλεῖ weniger unmittelbar als „was er sagt“.
  naturalness: Die vorliegende Fassung ist gut verständlich und hat einen passenden modernen Erzählton. Die Wiederholung von „sagt“ im revidierten Text entspricht der bewusst wiederholten Verben λέγει und λαλεῖ im Griechischen und ist im Deutschen hier nicht störend.
  terminology: Keine theologischen Fachbegriffe oder Eigennamen sind betroffen. „Eine kurze Zeit“ gibt das elliptische μικρόν verständlich wieder, ohne die konkrete Dauer festzulegen.
