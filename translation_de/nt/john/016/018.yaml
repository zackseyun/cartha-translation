  - severity: low
    issue: Der Inhalt der abschließenden Ratlosigkeit wird paraphrasiert.
    rationale: „Wovon er spricht“ trifft den Sinn, aber τί λαλεῖ fragt unmittelbar danach, was er sagt. Die Wiederholung kann im Deutschen erhalten bleiben.
