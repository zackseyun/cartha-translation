  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: de
  text: 'Da sagten sie immer wieder: „Was ist das, was er sagt: ‚Eine kurze Zeit‘? Wir wissen nicht, was er sagt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten sie immer wieder
  rationale: Das Imperfekt bezeichnet hier ein anhaltendes oder wiederholtes Gespräch unter den Jüngern. „Sagten sie immer wieder“ gibt diesen Aspekt in natürlichem Deutsch wieder.
- source_word: οὖν
  choice: Da
  rationale: „Da“ stellt einen natürlichen erzählerischen Anschluss an ihre zuvor geschilderte Ratlosigkeit her, ohne die Folgerungsbeziehung übermäßig zu betonen.
- source_word: Τί ἐστιν τοῦτο
  choice: Was meint er damit
  rationale: Wörtlich steht „Was ist dies?“. Im Deutschen gibt „Was meint er damit?“ die Frage nach der Bedeutung natürlich wieder; der Bezug auf Jesu Worte wird im anschließenden Nebensatz ausdrücklich bewahrt.
- source_word: ὃ λέγει μικρόν
  choice: 'wenn er sagt: ‚Eine kurze Zeit‘'
  rationale: Die Formulierung erhält μικρόν als hervorgehobenes Zitat und macht deutlich, dass die Jünger gerade diesen Ausdruck Jesu nicht verstehen.
- source_word: μικρόν
  choice: Eine kurze Zeit
  rationale: Das substantivisch beziehungsweise adverbial gebrauchte μικρόν bezeichnet im Zusammenhang eine kurze Zeitspanne. „Eine kurze Zeit“ ist klar und entspricht dem Ausdruck im Kontext.
- source_word: οὐκ οἴδαμεν
  choice: Wir wissen nicht
  rationale: Dies gibt das negierte οἴδαμεν mit seiner präsentischen Bedeutung unmittelbar wieder.
- source_word: τί λαλεῖ
  choice: wovon er spricht
  rationale: „Wovon er spricht“ gibt die Ratlosigkeit über den Inhalt seiner Rede idiomatisch wieder und vermeidet die im Deutschen schwerfällige Wiederholung von „sagt“.
