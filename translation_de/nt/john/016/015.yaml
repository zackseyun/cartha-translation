id: JHN.16.15
reference: John 16:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: de
  text: 'Alles, was der Vater hat, ist mein. Deshalb habe ich gesagt: Er nimmt[a] von dem, was mein ist, und wird es euch verkünden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „empfängt“.'
    reason: 'Lexikalische Alternative: λαμβάνει kann sowohl „nimmt“ als auch „empfängt“ bedeuten.'
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Alles, was
  rationale: Die Wendung ist umfassend und nachdrücklich. „Alles, was“ gibt diese Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: ἔχει
  choice: hat
  rationale: „Hat“ ist die direkte und idiomatische Wiedergabe des Präsens von ἔχω.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Im johanneischen Zusammenhang bezeichnet „der Vater“ Gott in seiner Beziehung zum Sohn.
- source_word: ἐμά
  choice: ist mein
  rationale: Das substantivisch gebrauchte Possessivpronomen steht prädikativ und formuliert einen starken Anspruch auf alles, was der Vater hat. „Ist mein“ bewahrt die knappe Form des Griechischen.
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: „Deshalb“ gibt den folgernden Zusammenhang klar und prägnant wieder.
- source_word: εἶπον
  choice: habe ich gesagt
  rationale: Das griechische Aoristverb verweist auf Jesu unmittelbar vorausgehende Aussage; im modernen deutschen Diskurs ist das Perfekt hier natürlicher als das Präteritum.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: von dem, was mein ist
  rationale: Die im Griechischen substantivierte Possessivform wird im Deutschen verständlich entfaltet, ohne ihren Bezug auf das dem Sohn Gehörende näher festzulegen.
- source_word: λαμβάνει
  choice: nimmt
  rationale: λαμβάνω kann sowohl „nehmen“ als auch „empfangen“ bedeuten. „Nimmt“ entspricht der aktiveren Grundbedeutung; die ebenfalls mögliche rezeptive Nuance wird in einer Fußnote bewahrt.
- source_word: ἀναγγελεῖ
  choice: wird es verkünden
  rationale: Das Futur bleibt erhalten. „Verkünden“ gibt den feierlichen Offenbarungscharakter von ἀναγγέλλω wieder; das im Deutschen nötige „es“ nimmt inhaltlich das zuvor Empfangene auf.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Jünger als Adressaten der Verkündigung.
theological_decisions:
- issue: Das Verhältnis dessen, was der Vater hat, zum Sohn
  choice: Alles, was der Vater hat, ist mein
  alternative: Alles, was der Vater hat, gehört mir
  rationale: Die Formulierung bewahrt die starke christologische Aussage des Textes, ohne sie durch spätere dogmatische Fachbegriffe auszulegen.
- issue: Der Empfang des Geistes vom Sohn
  choice: Er nimmt von dem, was mein ist
  alternative: Er empfängt von dem, was mein ist
  rationale: Das griechische λαμβάνει lässt beide Nuancen zu. Der Haupttext verwendet „nimmt“, während die Fußnote „empfängt“ festhält und so die sprachliche wie theologische Spannung nicht vorschnell auflöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau bleibt nahe am griechischen Gedankengang, ohne unnatürlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wendung.
