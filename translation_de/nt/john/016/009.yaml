translation:
  language: de
  text: 'über die Sünde: weil[a] sie nicht an mich glauben;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sie nicht an mich glauben“. Das griechische Bindewort kann hier sowohl begründend als auch erläuternd verstanden werden; „weil“ bringt den Zusammenhang im Kontext am klarsten zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: über
  rationale: Die Präposition mit Genitiv führt hier das Thema an, auf das sich das Überführen durch den Geist bezieht. „Über“ ist im modernen Deutschen natürlich und bewahrt die Parallelstruktur der Verse 9–11.
- source_word: ἁμαρτίας
  choice: die Sünde
  rationale: Der abstrakte Singular bezeichnet die Kategorie „Sünde“, ohne einzelne Sünden oder allgemein „Sündhaftigkeit“ einzutragen.
- source_word: μέν
  choice: nicht eigens wiedergegeben
  rationale: μέν kennzeichnet den ersten Punkt einer in den Versen 9–11 fortgeführten Reihe. Im Deutschen wird diese Gliederungsfunktion durch die Parallelstruktur und Zeichensetzung ausreichend erkennbar.
- source_word: ὅτι
  choice: weil
  rationale: „Weil“ gibt die kausale beziehungsweise erklärende Beziehung zum vorangehenden Ausdruck „über die Sünde“ klar wieder. Die mögliche Wiedergabe mit „dass“ bleibt in der Fußnote erhalten.
- source_word: οὐ πιστεύουσιν
  choice: sie nicht glauben
  rationale: Das Präsens beschreibt den bestehenden Unglauben. „Glauben“ ist die sachlich und idiomatisch passende Wiedergabe von πιστεύω.
- source_word: εἰς ἐμέ
  choice: an mich
  rationale: Bei πιστεύω εἰς bezeichnet die Wendung den auf Jesus gerichteten Glauben beziehungsweise das Vertrauen. Die natürliche deutsche Konstruktion lautet „an mich glauben“.
theological_decisions:
- issue: Art der in diesem Vers bezeichneten Sünde
  choice: Der Vers verbindet die hier gemeinte Sünde unmittelbar mit dem Nichtglauben an Jesus.
  alternative: Der Vers könnte allgemeiner menschliche Sündhaftigkeit meinen und den Unglauben nur als Beispiel nennen.
  rationale: Der mit ὅτι eingeleitete Satz erklärt oder begründet unmittelbar „über die Sünde“. Die Übersetzung bewahrt diese enge Verbindung, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Doppelpunkt verdeutlicht die erklärende Fortführung; das Semikolon entspricht dem Anschluss an die folgende Aufzählung.
