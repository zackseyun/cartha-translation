  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: de
  text: Bis jetzt habt ihr um nichts in meinem Namen gebeten. Bittet, und ihr werdet empfangen, damit eure Freude vollkommen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Bis jetzt
  rationale: Die idiomatische Zeitangabe bezeichnet den Zeitraum bis zum gegenwärtigen Augenblick; „Bis jetzt“ ist im modernen Deutsch natürlich und präzise.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: habt ihr um nichts gebeten
  rationale: Im Zusammenhang mit „Bis jetzt“ gibt das Perfekt den griechischen Aorist idiomatisch wieder. „Um etwas bitten“ unterscheidet die erbetene Sache klar vom bloßen Stellen einer Frage.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die wörtliche, im Deutschen geläufige Wendung bewahrt die theologische Bedeutungsfülle, ohne sie auf Bevollmächtigung, Stellvertretung oder Verbundenheit einzuengen.
- source_word: αἰτεῖτε
  choice: Bittet
  rationale: Der Präsensimperativ kann eine allgemeine, wiederholte oder fortdauernde Handlung bezeichnen. „Bittet“ ist natürlich und legt den Aspekt nicht unnötig fest.
- source_word: λήμψεσθε
  choice: ihr werdet empfangen
  rationale: „Empfangen“ entspricht dem feierlichen Gebetskontext besser als das umgangssprachlichere „bekommen“.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Ziel- beziehungsweise Folgesinn der Konjunktion klar und idiomatisch wieder.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: eure Freude vollkommen ist
  rationale: Die periphrastische Perfektkonstruktion beschreibt einen erreichten Zustand der Fülle. „Vollkommen ist“ ist natürliches, würdiges Deutsch und bewahrt sowohl Vollständigkeit als auch Erfülltheit.
theological_decisions:
- issue: Bedeutung des Bittens „in meinem Namen“
  choice: Die wörtliche Formulierung „in meinem Namen“ bleibt stehen.
  alternative: „in meinem Auftrag“, „unter meiner Vollmacht“ oder „in Gemeinschaft mit mir“
  rationale: Die Wendung kann Jesu Person, Vollmacht und Sendung umfassen. Keine einzelne erklärende Wiedergabe schöpft ihre johanneische Bedeutungsfülle aus.
- issue: Verheißung des Empfangens
  choice: Die uneingeschränkte Form „ihr werdet empfangen“ bleibt erhalten.
  alternative: Eine Ergänzung wie „was Gottes Willen entspricht“
  rationale: Der Vers selbst enthält keine solche ausdrückliche Einschränkung. Eine harmonisierende Ergänzung würde die Spannung des Textes auflösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Anrede im Plural wird durchgehend beibehalten; zentrale johanneische Formulierungen bleiben ohne konfessionelle Ausdeutung erhalten.
