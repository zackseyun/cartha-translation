  terminology: „In meinem Namen“, „bitten“ und „empfangen“ sind angemessen und bewahren die johanneische sowie gebetssprachliche Registerhöhe. Die bisherige Anmerkung zu „in meinem Namen“ erläutert die Wendung recht eng und ist keine echte Übersetzungsalternative; die wörtliche Haupttextfassung genügt, ohne ihre Bedeutung einzuengen.
