  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: de
  text: Noch eine kurze Zeit[a], dann seht ihr mich nicht mehr; und wieder eine kurze Zeit, dann werdet ihr mich sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Verben für „sehen“: θεωρέω im ersten und ὁράω im zweiten Satzteil. Sie können unterschiedliche Nuancen haben, werden hier aber beide mit „sehen“ wiedergegeben, weil vor allem der zeitliche Gegensatz betont wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: noch eine kurze Zeit / wieder eine kurze Zeit
  rationale: Das substantivisch-adverbial gebrauchte Neutrum bezeichnet jeweils eine kurze Zeitspanne. „Eine kurze Zeit“ ist im heutigen Deutsch natürlich; das vorangestellte „noch“ gibt im ersten Satzteil die unmittelbar bevorstehende Veränderung idiomatisch wieder.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: „Nicht mehr“ ist die natürliche deutsche Entsprechung für das Ende eines bisherigen Zustands.
- source_word: θεωρεῖτέ
  choice: seht
  rationale: θεωρέω kann ein betrachtendes oder wahrnehmendes Sehen bezeichnen, überschneidet sich hier aber stark mit ὁράω. „Sehen“ bewahrt den Grundsinn, ohne eine ungesicherte Bedeutungsdifferenz einzutragen.
- source_word: πάλιν
  choice: wieder
  rationale: „Wieder“ gibt die zeitliche Umkehr beziehungsweise erneute Begegnung knapp und idiomatisch wieder.
- source_word: ὄψεσθέ
  choice: werdet ... sehen
  rationale: Die Futurform von ὁράω bezeichnet hier zukünftiges Sehen. Das deutsche Futur erhält den zeitlichen Gegensatz zur Präsensform im ersten Satzteil.
- source_word: με
  choice: mich
  rationale: Das Akkusativpronomen bezieht sich unmittelbar auf Jesus und wird entsprechend wiedergegeben.
- source_word: καὶ
  choice: dann / und
  rationale: Das erste καί wird in der deutschen Zeitfolge idiomatisch mit „dann“ ausgedrückt; das weitere καί erhält als „und“ die ausgewogene Parallelstruktur der Aussage.
theological_decisions:
- issue: Ob θεωρέω und ὁράω durch verschiedene deutsche Verben unterschieden werden sollen
  choice: Beide Verben im Haupttext mit „sehen“ wiedergeben
  alternative: „mich nicht mehr erblicken … mich sehen“ oder „mich nicht mehr sehen … mich erblicken“
  rationale: Die beiden griechischen Verben können unterschiedliche Nuancen tragen, weisen im johanneischen Sprachgebrauch jedoch erhebliche Bedeutungsüberschneidungen auf. Eine feste theologische Unterscheidung würde mehr festlegen, als der Vers selbst eindeutig erkennen lässt; der zeitliche Gegensatz bleibt daher im Vordergrund.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallele Satzstruktur bleibt erkennbar; „dann“ macht den im Griechischen durch die Satzverknüpfung ausgedrückten zeitlichen Ablauf im Deutschen natürlich verständlich.
