id: JHN.16.20
reference: John 16:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Ihr werdet weinen und klagen, aber die Welt wird sich freuen. Ihr werdet traurig sein, doch eure Trauer wird zur Freude werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eure Trauer wird sich in Freude verwandeln.“'
    reason: lexikalisch-syntaktische Alternative für εἰς χαρὰν γενήσεται
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die im Johannesevangelium charakteristische feierliche Doppelung bleibt transparent erhalten; „Amen“ ist im Deutschen als Bekräftigungswort verständlich und würdevoll.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Gibt die direkte Anrede und die wiederkehrende johanneische Formel eng und natürlich wieder.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: ihr werdet weinen und klagen
  rationale: Bewahrt die zwei Verben für den hörbaren Ausdruck von Schmerz, ohne sie zu einem einzigen Begriff zu verflachen.
- source_word: ὁ δὲ κόσμος χαρήσεται
  choice: aber die Welt wird sich freuen
  rationale: „Die Welt“ lässt den breiten, im Johannesevangelium spannungsvollen Begriff κόσμος ohne deutende Erweiterung stehen; „aber“ markiert den Kontrast.
- source_word: ὑμεῖς λυπηθήσεσθε
  choice: ihr werdet traurig sein
  rationale: Natürliches modernes Deutsch für den zukünftigen Zustand des Betrübtseins; das ausdrücklich gesetzte ὑμεῖς wird durch den erneuten Satzbeginn mit „ihr“ hervorgehoben.
- source_word: ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται
  choice: eure Trauer wird zur Freude werden
  rationale: Gibt die Bewegung von λύπη zu χαρά eng wieder und bewahrt die pointierte Gegenüberstellung von Trauer und Freude.
theological_decisions:
- issue: Johanneischer Gebrauch von κόσμος
  choice: die Welt
  alternative: die ungläubige Welt / das Weltsystem
  rationale: Der Kontext stellt die Welt den Jüngern gegenüber, definiert sie hier aber nicht ausdrücklich näher. Die unkommentierte Wiedergabe bewahrt die theologische Weite und Spannung.
- issue: Art der Verwandlung der Trauer
  choice: eure Trauer wird zur Freude werden
  alternative: eure Trauer wird sich in Freude verwandeln
  rationale: Die Formulierung hält sich an εἰς χαρὰν γενήσεται und lässt offen, ob die Trauer selbst verwandelt wird oder ob aus ihr Freude hervorgeht.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die feierliche johanneische Einleitungsformel bleibt als „Amen, amen“ erhalten; ansonsten werden geläufige Verben verwendet. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
