source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: de
  text: 'Das habe ich zu euch gesagt, damit ihr in mir Frieden habt. In der Welt habt ihr Bedrängnis[a]. Aber habt Mut[b]: Ich habe die Welt überwunden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Not, Drangsal.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Seid zuversichtlich; wörtlich näher: Seid guten Mutes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λελάληκα ὑμῖν
  choice: Das habe ich zu euch gesagt
  rationale: Das pluralische ταῦτα blickt auf Jesu vorausgehende Rede zurück; im Deutschen kann der zusammenfassende Singular „das“ diesen Rückbezug natürlich ausdrücken. Das Perfekt „habe … gesagt“ bewahrt die vollendete Handlung mit fortdauernder Bedeutung.
- source_word: ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε
  choice: damit ihr in mir Frieden habt
  rationale: „Damit“ gibt den Zweck wieder. „In mir“ bewahrt die prägnante johanneische Verbindungssprache, ohne sie als „durch mich“ oder „in Gemeinschaft mit mir“ auszudeuten.
- source_word: ἐν τῷ κόσμῳ
  choice: In der Welt
  rationale: Die wörtliche Wiedergabe erhält die Mehrdeutigkeit von κόσμος bei Johannes und den bewussten Gegensatz zu „in mir“.
- source_word: θλῖψιν
  choice: Bedrängnis
  rationale: „Bedrängnis“ bezeichnet belastenden Druck, Not und Anfeindung und bewahrt das Gewicht des griechischen Ausdrucks besser als das allgemeinere „Schwierigkeiten“.
- source_word: θαρσεῖτε
  choice: habt Mut
  rationale: Der Imperativ fordert angesichts der Bedrängnis zu Mut und Zuversicht auf. „Habt Mut“ ist klar, natürlich und gegenwärtig.
- source_word: ἐγὼ νενίκηκα τὸν κόσμον
  choice: Ich habe die Welt überwunden
  rationale: Das deutsche Perfekt gibt die im griechischen Perfekt ausgedrückte vollendete und bleibend wirksame Überwindung wieder. Das betonte „Ich“ bleibt erhalten.
theological_decisions:
- issue: Bedeutung von κόσμος
  choice: Welt
  alternative: gottfeindliche Weltordnung; gefallene Welt
  rationale: „Welt“ lässt die johanneische Bedeutungsbreite bestehen und vermeidet eine konfessionell oder systematisch verengende Erklärung im Haupttext.
- issue: Zeitliche und theologische Kraft von νενίκηκα
  choice: Ich habe die Welt überwunden
  alternative: Ich werde die Welt überwinden; Ich besiege die Welt
  rationale: Das Perfekt stellt Jesu Sieg schon vor der Kreuzigung innerhalb der Erzählfolge als vollendet und dauerhaft wirksam dar. Diese Spannung wird nicht geglättet.
- issue: Frieden in Christus trotz gegenwärtiger Bedrängnis
  choice: Der Gegensatz zwischen „in mir“ und „in der Welt“ bleibt unmittelbar stehen.
  alternative: Eine erklärende Auflösung, wonach der Friede nur innerlich oder erst zukünftig sei
  rationale: Der griechische Text hält gegenwärtigen Frieden und gegenwärtige Bedrängnis zusammen; die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Bedrängnis“ behält das biblische Gewicht, ohne altertümlich zu wirken; „habt Mut“ ist unmittelbarer und natürlicher als „seid getrost“. Die Fußnotenmarker stehen jeweils direkt beim betreffenden Ausdruck.
