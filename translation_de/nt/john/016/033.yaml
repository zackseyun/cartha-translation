review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt den griechischen Wortlaut zuverlässig wieder: Das Perfekt in „habe ... gesagt“ und „habe ... überwunden“ ist gewahrt; ἵνα wird als Zweck mit „damit“ wiedergegeben; „in mir“ und die zweimalige Wiedergabe von κόσμος als „Welt“ erhalten den johanneischen Gegensatz. „Bedrängnis“ trifft θλῖψις angemessen, und „Habt Mut“ gibt den Imperativ θαρσεῖτε natürlich wieder.'
  naturalness: Modernes, idiomatisches Standarddeutsch mit einem angemessen würdigen, aber nicht archaischen Register. Der zusammenfassende Singular „Das“ ist trotz des griechischen Plurals ταῦτα im Deutschen natürlich und semantisch ausreichend.
  terminology: „Frieden“, „Welt“, „Bedrängnis“ und „überwunden“ sind treffend und in sich konsistent. Die Fußnotenmarker sind im deutschen Text korrekt an „Bedrängnis“ bzw. „Mut“ verankert. Im englischen Audit-Trail sind hingegen die Texte der Fußnoten a und b offenbar vertauscht; dies betrifft nicht die deutsche Fassung.
  issues:
  - severity: low
    issue: Vertauschte Fußnotenzuordnung im englischen Audit-Trail
    rationale: 'Die englische Fußnote a steht bei „peace“, erläutert aber „take heart“; Fußnote b steht bei „take courage“, erläutert aber „tribulation“. Die deutsche Fassung übernimmt diesen Fehler nicht: ihre Fußnoten sind korrekt verankert.'
  revised_text: 'Das habe ich zu euch gesagt, damit ihr in mir Frieden habt. In der Welt habt ihr Bedrängnis[a]. Aber habt Mut[b]: Ich habe die Welt überwunden.'
  revised_footnotes:
