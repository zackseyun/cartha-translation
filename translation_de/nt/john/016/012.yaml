  source_fidelity: „Ich habe euch noch vieles zu sagen“ gibt Ἔτι πολλὰ ἔχω ὑμῖν λέγειν vollständig und idiomatisch wieder. „Ihr könnt es jetzt nicht tragen“ bewahrt die metaphorische Offenheit von βαστάζειν und die gegenwärtige Begrenzung von ἄρτι. Der Singular „es“ bezieht sich im Deutschen natürlich auf das zusammenfassende „vieles“ und ist mit dem substantivischen Neutrum Plural im Griechischen vereinbar.
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit angemessen würdigem Register. Die Formulierung „etwas nicht tragen können“ ist als bewusst offene Belastungsmetapher verständlich; die Fußnote unterstützt dies sachgerecht.
  terminology: „Vieles“, „sagen“, „könnt“ und „tragen“ sind treffend. Insbesondere vermeidet „tragen“ eine voreilige Einengung auf bloßes Verstehen oder bloßes Ertragen. Die Fußnote nennt die relevante lexikalische Alternative ohne eine dogmatische Deutung einzutragen.
