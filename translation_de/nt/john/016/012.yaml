  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: de
  text: Ich habe euch noch vieles zu sagen, aber ihr könnt es jetzt nicht tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aber ihr könnt es jetzt nicht ertragen“. Das griechische Verb kann „tragen“ oder „ertragen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ ἔχω
  choice: Ich habe euch noch vieles zu sagen
  rationale: Die natürliche deutsche Wendung gibt wieder, dass Jesus weitere Aussagen beziehungsweise Lehren mitzuteilen hat. „Vieles“ bildet das substantivisch gebrauchte Neutrum Plural πολλὰ idiomatisch ab.
- source_word: ὑμῖν λέγειν
  choice: euch … zu sagen
  rationale: Der Dativ ὑμῖν bezeichnet die Adressaten; die Stellung von „euch“ in der deutschen Gesamtkonstruktion ist natürlich und bewahrt den schlichten Sinn von λέγειν.
- source_word: ἀλλ’ οὐ δύνασθε
  choice: aber ihr könnt … nicht
  rationale: „Aber“ gibt den Gegensatz direkt wieder; „ihr könnt nicht“ ist modernes, idiomatisches Deutsch und drückt die in δύνασθε bezeichnete Fähigkeit aus.
- source_word: βαστάζειν
  choice: tragen
  rationale: „Tragen“ bewahrt das Bild einer Last und lässt offen, ob vor allem geistige Aufnahmefähigkeit, seelische Belastbarkeit oder das Ertragen des Gehörten gemeint ist.
- source_word: ἄρτι
  choice: jetzt
  rationale: „Jetzt“ bezeichnet knapp den gegenwärtigen Zeitpunkt im Gegensatz zu der späteren Führung, von der die folgenden Verse sprechen.
theological_decisions:
- issue: Art der gegenwärtigen Unfähigkeit der Jünger
  choice: Die offene Metapher „nicht tragen“ bleibt erhalten.
  alternative: „noch nicht verstehen“ oder „jetzt nicht ertragen“
  rationale: βαστάζειν kann Tragen oder Ertragen bezeichnen. Der Kontext erlaubt, sowohl Erkenntnisfähigkeit als auch geistliche und emotionale Belastbarkeit mitzuhören; eine eindeutigere Wiedergabe würde diese Spannung unnötig auflösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Metapher „es nicht tragen können“ wird bewusst beibehalten und in der Fußnote erläutert.
