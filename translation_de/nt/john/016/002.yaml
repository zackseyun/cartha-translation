source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: de
  text: Sie werden euch aus den Synagogen ausschließen.[a] Ja, es kommt eine Stunde, in der jeder, der euch tötet, meinen wird, Gott einen religiösen Dienst zu erweisen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie werden euch zu Ausgeschlossenen aus den Synagogen machen“; auch: „euch aus der Synagoge ausschließen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gott Verehrung darzubringen“ oder „Gott einen Dienst zu erweisen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Sie werden euch aus den Synagogengemeinden ausschließen
  rationale: Das prädikative Adjektiv mit ποιέω bezeichnet den Ausschluss aus der Synagoge als religiöser und sozialer Gemeinschaft. „Synagogengemeinden“ macht diesen gemeinschaftlichen Sinn deutlich und wahrt den Plural.
- source_word: ἀλλ’
  choice: Ja
  rationale: Die Partikel steigert hier die vorausgehende Ankündigung, statt lediglich einen Gegensatz auszudrücken. „Ja“ gibt diese Zuspitzung im Deutschen knapp und natürlich wieder.
- source_word: ἔρχεται ὥρα
  choice: es kommt eine Stunde
  rationale: Die Formulierung bewahrt die johanneische Stunden-Metaphorik und entspricht dem artikellosen ὥρα, ohne vorschnell zu „Zeit“ zu verallgemeinern.
- source_word: ἵνα
  choice: in der
  rationale: Nach „es kommt eine Stunde“ führt ἵνα den Inhalt beziehungsweise das Kennzeichen dieser Stunde ein. Der Relativanschluss ist im Deutschen idiomatisch und lässt die funktionale Nuance offen.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: jeder, der euch tötet
  rationale: Die substantivierte Partizipialkonstruktion wird als generische Personenbezeichnung wiedergegeben; „jeder“ erhält die umfassende Kraft von πᾶς.
- source_word: δόξῃ
  choice: wird meinen
  rationale: δοκέω bezeichnet hier die subjektive, irrige Einschätzung des Täters. „Meinen“ klingt würdig und markiert, ohne Zusatz, dass es um seine Auffassung geht.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: er bringe Gott damit einen Gottesdienst dar
  rationale: λατρεία bezeichnet kultischen beziehungsweise religiösen Dienst, während προσφέρειν die Vorstellung des Darbringens trägt. Die Formulierung bewahrt beides; „damit“ verdeutlicht, dass der Täter gerade das Töten als vermeintlichen Gottesdienst versteht.
theological_decisions:
- issue: Kultische Selbstdeutung der Verfolger
  choice: er bringe Gott damit einen Gottesdienst dar
  alternative: er erweise Gott einen Dienst; er bringe Gott Verehrung dar
  rationale: Die Übersetzung erhält die schockierende Ironie, dass die Täter das Töten selbst als legitimen religiösen Dienst ansehen, ohne diese Einschätzung zu bestätigen. „Gottesdienst“ trägt hier seinen weiteren Sinn als Dienst für Gott, nicht nur den einer gottesdienstlichen Versammlung.
- issue: Generisches Maskulinum in πᾶς ὁ ἀποκτείνας
  choice: jeder, der euch tötet ... er
  alternative: alle, die euch töten ... sie
  rationale: Der griechische Text steht im generischen maskulinen Singular. Die deutsche Wiedergabe erhält Singular und Allgemeingültigkeit, ohne den Personenkreis sachlich einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Synagogengemeinden“ verhindert, dass der Ausschluss nur als Entfernung aus einem Gebäude verstanden wird. Der Konjunktiv „bringe“ kennzeichnet die Handlung als Inhalt der irrigen Meinung. „Gottesdienst darbringen“ ist bewusst gehoben und kultisch; die Fußnote erläutert den weiteren Bedeutungsumfang.
