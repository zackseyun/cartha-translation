    rationale: Im heutigen Deutsch bezeichnet „Gottesdienst“ gewöhnlich eine Versammlung bzw. Feier. λατρεία meint hier den religiösen Dienst gegenüber Gott; „einen religiösen Dienst erweisen“ transportiert dies klarer.
