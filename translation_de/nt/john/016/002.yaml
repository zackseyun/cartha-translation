revisions:
- from: Sie werden euch aus den Synagogengemeinden ausschließen.[a] Ja, es kommt eine Stunde, in der jeder, der euch tötet, meinen wird, er bringe Gott damit einen Gottesdienst dar.[b]
  to: Sie werden euch aus den Synagogen ausschließen.[a] Ja, es kommt eine Stunde, in der jeder, der euch tötet, meinen wird, Gott einen religiösen Dienst zu erweisen.[b]
  rationale: Die Revision ersetzt zwei unnötig spezifizierende beziehungsweise im Deutschen missverständliche Formulierungen. Sie bewahrt den Plural der Synagogen, die steigernde Funktion von ἀλλά („Ja“), die johanneische „Stunde“, die generische Einzahl und die Ironie der vermeintlichen Gottesverehrung. Die Fußnoten bleiben an denselben Stellen verankert und bieten echte lexikalische Alternativen.
