  source_fidelity: Der Entwurf gibt den Ausschluss aus den Synagogen, die zeitliche Zuspitzung, die umfassende Tätergruppe und deren vermeintlich Gott geltenden religiösen Dienst grundsätzlich zutreffend wieder. „Synagogengemeinden“ ist jedoch gegenüber dem griechischen Plural „Synagogen“ eine vermeidbare Konkretisierung. „Gottesdienst darbringen“ ist in modernem Deutsch zudem missverständlich und keine natürliche Verbindung für λατρείαν προσφέρειν.
  naturalness: „Jeder, der euch tötet, meinen wird, er bringe Gott damit einen Gottesdienst dar“ wirkt durch den Konjunktivanschluss und insbesondere „einen Gottesdienst darbringen“ schwerfällig. Die Infinitivkonstruktion „meinen wird, Gott einen religiösen Dienst zu erweisen“ ist idiomatischer und bewahrt den kultisch-religiösen Sinn.
  terminology: „Religiösen Dienst erweisen“ gibt λατρείαν angemessen als Gott geltenden kultischen Dienst wieder, ohne es auf eine konkrete Gottesdienstveranstaltung einzuengen. „Aus den Synagogen ausschließen“ folgt dem Wortlaut genauer als „aus den Synagogengemeinden ausschließen“.
