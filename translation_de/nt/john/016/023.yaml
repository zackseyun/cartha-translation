source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: de
  text: 'An jenem Tag werdet ihr mich nichts fragen.[a] Amen, amen, ich sage euch: Worum ihr den Vater in meinem Namen bittet, das wird er euch geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Verben: Zuerst bezeichnet ἐρωτάω das Fragen oder Befragen Jesu, danach bezeichnet αἰτέω das Bitten gegenüber dem Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: An jenem Tag
  rationale: Natürliche deutsche Zeitangabe, die den hervorgehobenen, im Kontext bedeutsamen Tag wahrt.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: werdet ihr mich nichts fragen
  rationale: „Fragen“ gibt ἐρωτάω hier als Fragen bzw. Befragen einer Person wieder; „nichts“ bewahrt die umfassende Verneinung, ohne das im Griechischen nicht ausdrücklich vorhandene „mehr“ hinzuzufügen.
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die im Johannesevangelium charakteristische feierliche Doppelung bleibt als verständliche, im Deutschen eingebürgerte Formel erhalten.
- source_word: ἄν τι αἰτήσητε
  choice: Worum ihr … bittet
  rationale: Die freie Relativkonstruktion gibt den offenen, nicht näher bestimmten Gegenstand der Bitte idiomatisch wieder. „Bitten“ unterscheidet das ersuchende αἰτέω natürlich vom vorausgehenden ἐρωτάω („fragen“).
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Bewahrt den bestimmten Ausdruck des griechischen Textes, ohne ein nicht vorhandenes Possessivpronomen einzufügen.
- source_word: δώσει ὑμῖν
  choice: das wird er euch geben
  rationale: Das deutsche Korrelat „das“ nimmt den Inhalt von „worum“ natürlich wieder auf und macht das im Griechischen erschließbare Objekt ausdrücklich, ohne seinen Inhalt zu erweitern.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Bewahrt die wichtige johanneische Wendung, ohne ihre repräsentative oder relationale Bedeutung durch eine Paraphrase einzuengen.
theological_decisions:
- issue: Unterschied zwischen ἐρωτάω gegenüber Jesus und αἰτέω gegenüber dem Vater
  choice: „fragen“ im ersten Satz und „bitten“ im zweiten
  alternative: Beide Verben mit „fragen“ wiedergeben
  rationale: 'Das Deutsche kann den im Griechischen vorhandenen Unterschied hier natürlich ausdrücken: Zuerst geht es um das Fragen Jesu, dann um eine an den Vater gerichtete Bitte. Damit wird keine weitergehende theologische Deutung festgelegt.'
- issue: Bezug von „in meinem Namen“
  choice: Die Wendung wird im Haupttext auf die Bitte an den Vater bezogen.
  alternative: „Worum ihr den Vater bittet, das wird er euch in meinem Namen geben.“
  rationale: Die Stellung der Wendung im überlieferten Satz lässt eine Beziehung zum Geben zu; zugleich entspricht der Bezug auf das Bitten dem johanneischen Sprachgebrauch und ergibt einen natürlichen Haupttext. Die alternative syntaktische Zuordnung bleibt in einer Fußnote sichtbar.
- issue: Reichweite der Verheißung über das Gebet
  choice: Die Zusage wird ohne ergänzende Einschränkung wiedergegeben.
  alternative: Im Haupttext Bedingungen wie die Übereinstimmung mit Jesu Willen ergänzen
  rationale: Solche Einordnungen können aus dem weiteren Kontext erschlossen werden, stehen aber nicht ausdrücklich in diesem Vers und dürfen dessen Spannung nicht verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche johanneische Formel „Amen, amen“ bleibt erhalten; ansonsten ist der Satz bewusst klar und mündlich verständlich formuliert.
