source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: de
  text: Doch ich habe euch das alles gesagt, damit ihr, wenn ihre Stunde kommt, daran denkt, dass ich es euch gesagt habe.[a] Das alles habe ich euch aber nicht von Anfang an gesagt, weil ich bei euch war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht zweimal αὐτῶν: zuerst in „ihre Stunde“ und nach „ihr euch erinnert“ noch einmal. Diese zweite Form lässt sich im Deutschen nicht zugleich wörtlich und ohne Unklarheit wiedergeben; sie kann etwa „an sie“ entsprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: habe … gesagt
  rationale: Das Perfekt bezeichnet eine abgeschlossene Äußerung mit fortdauernder Bedeutung. Das deutsche Perfekt ist hier natürlich und stellt den Bezug zu Jesu vorausgehenden Worten her.
- source_word: ταῦτα
  choice: das / Dies
  rationale: Der griechische Plural verweist zusammenfassend auf die vorausgehenden Warnungen. Im modernen Deutsch gibt das zusammenfassende „das“ beziehungsweise „Dies“ diesen Rückbezug natürlicher wieder als das schwerfällige „diese Dinge“.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ bewahrt den finalen Sinn und ist im Deutschen die natürliche Einleitung eines Zwecksatzes.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: wenn ihre Stunde kommt
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet einen zukünftigen Eintritt. „Stunde“ bewahrt das im Johannesevangelium bedeutsame Bild eines bestimmten beziehungsweise festgesetzten Zeitpunkts; „ihre“ lässt den Bezug des Genitivs bewusst offen.
- source_word: μνημονεύητε
  choice: daran denkt
  rationale: Im Zusammenhang mit einem folgenden ὅτι-Satz ist „daran denkt, dass …“ klares, natürliches Deutsch und gibt den Sinn von Erinnern beziehungsweise Sich-ins-Gedächtnis-Rufen wieder.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: dass ich es euch gesagt habe
  rationale: Der dass-Satz gibt die erinnerte Aussage wieder. Das betonte ἐγώ wird durch die normale deutsche Wortstellung ausreichend vermittelt; eine künstliche Hervorhebung von „ich“ ist im Kontext nicht nötig.
- source_word: ἐξ ἀρχῆς
  choice: von Anfang an
  rationale: Dies ist die direkte und idiomatische deutsche Wiedergabe des zeitlichen Ausdrucks.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: ich bei euch war
  rationale: „Bei euch“ ist eine natürliche deutsche Wiedergabe der persönlichen Anwesenheit, die μετά mit Genitiv hier ausdrückt.
theological_decisions:
- issue: Bezug und doppelte Verwendung von αὐτῶν
  choice: Das erste αὐτῶν erscheint ausdrücklich als „ihre“; das zweite wird im Haupttext idiomatisch durch „daran denkt, dass …“ aufgefangen und in einer Fußnote offengelegt.
  alternative: 'Wörtlicher: „wenn ihre Stunde kommt, euch an sie erinnert, dass ich es euch gesagt habe“; je nach syntaktischer und textkritischer Beurteilung kann das zweite αὐτῶν auch fehlen oder anders zugeordnet werden.'
  rationale: Der SBLGNT-Text bietet zwei Vorkommen von αὐτῶν. Eine mechanische Wiedergabe beider Pronomen wäre im Deutschen unklar und holprig. Der Haupttext bleibt lesbar, während die Fußnote die formale Schwierigkeit und die mögliche Mehrdeutigkeit bewahrt, ohne den Bezug auf Personen, Ereignisse oder Warnungen dogmatisch festzulegen.
- issue: Sinn von „ihre Stunde“
  choice: Die bildhafte Formulierung bleibt unverändert stehen.
  alternative: „wenn ihre Zeit kommt“ oder eine ausdrückliche Deutung als Zeit der Verfolgungen beziehungsweise der Verfolger.
  rationale: „Stunde“ kann einen bestimmten, eintretenden Zeitpunkt bezeichnen und trägt im Johannesevangelium zusätzliche Resonanz. Eine explizite Identifikation des Bezugs würde eine im Griechischen vorhandene Offenheit unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das/Dies“ dient als natürliche zusammenfassende Wiedergabe des griechischen Plurals; „diese Dinge“ wurde wegen seiner im Deutschen sachlich-schwerfälligen Wirkung vermieden. Der Satzbau bleibt nah am griechischen Gedankengang, ohne dessen Pronomenfolge künstlich nachzuahmen.
