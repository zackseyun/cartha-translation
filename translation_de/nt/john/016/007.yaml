  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: de
  text: 'Doch ich sage euch die Wahrheit: Es ist zu eurem Vorteil, dass ich weggehe. Denn wenn ich nicht weggehe, wird der Beistand[a] keinesfalls zu euch kommen; wenn ich aber gehe, werde ich ihn zu euch senden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürsprecher“, „Helfer“ oder „Tröster“; griechisch: „Paraklet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zur Trauer der Jünger im vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlich.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: ich sage euch die Wahrheit
  rationale: Bewahrt die nachdrückliche Versicherung Jesu in klarer, gegenwärtiger Standardsprache.
- source_word: συμφέρει ὑμῖν
  choice: Es ist gut für euch
  rationale: Gibt den Gedanken des Nutzens oder Vorteils idiomatisch wieder, ohne einen im Griechischen nicht ausdrücklich markierten Vergleich zu stark hervorzuheben.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: dass ich weggehe
  rationale: Gibt den Inhalt dessen wieder, was den Jüngern nützt, und wahrt die Wiederholung von ἀπέρχομαι im folgenden Satz.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Denn wenn ich nicht weggehe
  rationale: Erhält die erklärende Funktion von γάρ, die Bedingungsstruktur und die verbale Wiederholung.
- source_word: ὁ παράκλητος
  choice: der Beistand
  rationale: Bezeichnet verständlich eine persönlich handelnde, helfende und vertretende Gestalt. Da das Bedeutungsspektrum breiter ist als jede einzelne deutsche Entsprechung, nennt die Fußnote Alternativen.
- source_word: οὐ μὴ ἔλθῃ
  choice: wird keinesfalls ... kommen
  rationale: Gibt die emphatische Verneinung οὐ μή mit Konjunktiv deutlich und ohne altertümliche Formulierung wieder.
- source_word: πρὸς ὑμᾶς
  choice: zu euch
  rationale: Gibt die durch πρός bezeichnete Bewegung auf die Jünger zu unmittelbar wieder.
- source_word: ἐὰν δὲ πορευθῶ
  choice: wenn ich aber gehe
  rationale: δέ markiert den Gegensatz zur vorherigen Bedingung; „gehe“ ist hier natürlich und unterscheidet sich angemessen vom wiederholten ἀπέρχομαι.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: werde ich ihn zu euch senden
  rationale: Gibt das gewöhnliche Verb πέμπω direkt wieder und bewahrt mit „ihn“ die persönliche, maskuline Bezugnahme des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von παράκλητος in den johanneischen Abschiedsreden
  choice: Beistand
  alternative: Fürsprecher; Helfer; Tröster; Paraklet
  rationale: „Beistand“ ist im Deutschen als persönliche Bezeichnung verständlich und umfasst Hilfe sowie vertretendes Eintreten, ohne die Bedeutung auf bloßen Trost oder ausschließlich forensische Fürsprache einzuengen. Die echte lexikalische Breite wird in einer Fußnote offengelegt.
- issue: Persönliche Bezugnahme auf den παράκλητος
  choice: ihn
  alternative: es
  rationale: Das maskuline αὐτόν nimmt den maskulinen Titel παράκλητος auf, und der Zusammenhang stellt den Beistand als kommenden und gesandten Akteur dar. „Ihn“ folgt dieser persönlichen Darstellung, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die kurzen Satzglieder und die Wiederholung von „weggehen“ folgen der Argumentation des griechischen Textes. „Keinesfalls“ bewahrt die starke Verneinung, während die Fußnote das nicht vollständig mit einem einzigen deutschen Wort erfassbare Spektrum von παράκλητος sichtbar hält.
