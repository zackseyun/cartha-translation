  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: de
  text: Jetzt wissen wir, dass du alles weißt und es nicht nötig hast, dass dich jemand fragt[a]. Deshalb glauben wir, dass du von Gott gekommen bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass dich jemand befragt“. Das griechische Verb kann „fragen“ oder „befragen“ bedeuten; im Zusammenhang geht es darum, dass Jesus die unausgesprochenen Gedanken und Fragen der Jünger bereits kennt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Jetzt
  rationale: Das temporale Adverb bezeichnet die gegenwärtige Erkenntnis der Jünger; „Jetzt“ ist knapp und natürlich.
- source_word: οἴδαμεν
  choice: wissen wir
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung; das deutsche Präsens gibt dies idiomatisch wieder.
- source_word: οἶδας πάντα
  choice: du alles weißt
  rationale: πάντα ist umfassend; „alles“ ist im heutigen Deutsch natürlicher als „alle Dinge“ und bewahrt die volle Aussageweite.
- source_word: οὐ χρείαν ἔχεις
  choice: es nicht nötig hast
  rationale: Diese Wendung bildet die griechische Bedarfsformulierung natürlich und mit leichtem Nachdruck ab.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: dass dich jemand fragt
  rationale: ἐρωτάω kann „fragen“ oder „befragen“ bedeuten. „Fragt“ bewahrt die neutrale lexikalische Weite; der Zusammenhang macht deutlich, dass Jesus auch unausgesprochene Fragen kennt.
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die Wendung bezeichnet hier den Erkenntnisgrund beziehungsweise das Anzeichen, auf das sich das Bekenntnis der Jünger stützt.
- source_word: πιστεύομεν
  choice: glauben wir
  rationale: „Glauben“ ist in diesem bekenntnishaften Zusammenhang die direkte und geläufige Wiedergabe.
- source_word: ἀπὸ θεοῦ
  choice: von Gott
  rationale: Die Übersetzung folgt der ausdrücklichen Formulierung des Textes und ersetzt „Gott“ nicht harmonisierend durch „den Vater“.
- source_word: ἐξῆλθες
  choice: gekommen bist
  rationale: Im Zusammenhang bezeichnet das Verb Jesu Herkunft und Sendung; „von Gott gekommen“ ist im modernen Deutsch natürlich und textnah.
theological_decisions:
- issue: Christologische Tragweite von „du alles weißt“
  choice: Die Aussage der Jünger bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Aussage ausdrücklich als Allwissenheit deuten.
  rationale: Der griechische Text enthält ein weitreichendes Bekenntnis über Jesu Wissen, formuliert es aber nicht als ausgearbeitete Lehrdefinition. Die direkte Wiedergabe erhält sein theologisches Gewicht, ohne es zu erweitern.
- issue: Bedeutung von ἀπὸ θεοῦ ἐξῆλθες
  choice: du von Gott gekommen bist
  alternative: du vom Vater gekommen bist
  rationale: Die Formulierung bewahrt sowohl den Gedanken göttlicher Herkunft beziehungsweise Sendung als auch den genauen Wortlaut „von Gott“, ohne aus dem nahen Kontext eine Spezifizierung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Daran glauben wir“ bewahrt den evidenziellen Bezug von ἐν τούτῳ, obwohl die Wendung im Deutschen leicht ungewöhnlicher klingt als eine stärker auslegende Formulierung wie „Deshalb glauben wir“.
