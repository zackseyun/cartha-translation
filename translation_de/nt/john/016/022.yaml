  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: de
  text: So habt auch ihr jetzt Kummer; doch ich werde euch wiedersehen[a], und euer Herz wird sich freuen, und niemand wird euch eure Freude nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „Ich werde euch wiedersehen“, nicht: „Ihr werdet mich wiedersehen.“ Damit kann Jesu Initiative bei der erneuten Begegnung hervorgehoben sein.'
    reason: Bewahrung der im Deutschen leicht überhörbaren grammatischen Perspektive des griechischen Wortlauts.
lexical_decisions:
- source_word: οὖν
  choice: So
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Bild von der Geburt und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: habt auch ihr jetzt Kummer
  rationale: „Kummer“ gibt λύπη als seelischen Schmerz verständlich und würdig wieder. Das μέν wird durch den folgenden Gegensatz mit „doch“ aufgenommen.
- source_word: πάλιν δὲ
  choice: doch … wieder
  rationale: „Doch“ bewahrt den Gegensatz zwischen gegenwärtigem Kummer und der erneuten Begegnung; „wieder“ gibt πάλιν wieder.
- source_word: ὄψομαι ὑμᾶς
  choice: ich werde euch wiedersehen
  rationale: 'Bewahrt die eindeutige grammatische Perspektive des griechischen Textes: Jesus ist das Subjekt, die Jünger sind das Objekt.'
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: euer Herz wird sich freuen
  rationale: Natürliche deutsche Wiedergabe, die sowohl das Herz als inneres Zentrum der Person als auch die verbale Aussage des Sichfreuens erhält.
- source_word: τὴν χαρὰν ὑμῶν
  choice: eure Freude
  rationale: Direkte possessive Wiedergabe; zugleich bleibt die Wortverbindung zwischen „sich freuen“ und „Freude“ erkennbar.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: niemand wird euch … nehmen
  rationale: Obwohl αἴρει formal im Präsens steht, ist die Aussage auf die kommende, bleibende Freude bezogen. Das deutsche Futur schließt natürlich an die vorangehenden Zukunftsformen an.
theological_decisions:
- issue: Subjekt und Akzent der künftigen Wiederbegegnung
  choice: ich werde euch wiedersehen
  alternative: ihr werdet mich wiedersehen
  rationale: Der griechische Wortlaut hat eindeutig Jesus als Subjekt und die Jünger als Objekt. Die Übersetzung bewahrt damit seine Initiative und harmonisiert den Satz nicht mit der Formulierung in Johannes 16,16.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Kummer“ ist emotional klar, ohne altertümlich zu wirken; die Satzstruktur wahrt den feierlichen Gegensatz von gegenwärtigem Leid und kommender, unentziehbarer Freude.
