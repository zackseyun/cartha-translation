lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Der narrative Aorist von ἀποκρίνομαι wird im deutschen Dialog natürlich und ohne zusätzliche Bedeutungsnuance mit „antwortete“ wiedergegeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ Plural bezeichnet die Empfänger der Antwort; „antwortete ihnen“ ist die idiomatische deutsche Form.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Der Eigenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
- source_word: Ἄρτι
  choice: jetzt
  rationale: Ἄρτι bezeichnet die unmittelbare Gegenwart. „Jetzt“ bewahrt diese zeitliche Zuspitzung knapp und natürlich.
- source_word: πιστεύετε
  choice: glaubt ihr
  rationale: Das Präsens Aktiv Indikativ, 2. Person Plural, wird direkt mit „glaubt ihr“ wiedergegeben; dies entspricht dem johanneischen Sprachgebrauch und lässt Gegenstand und Tragweite des Glaubens unausgeführt wie im Griechischen.
theological_decisions:
- issue: Aussage- oder Fragesatz bei Ἄρτι πιστεύετε;
  choice: 'Als rhetorische Frage: „Glaubt ihr jetzt?“'
  alternative: 'Als Aussage: „Jetzt glaubt ihr.“'
  rationale: Da die ältesten griechischen Textzeugen keine moderne Interpunktion vorgeben, lässt die Wortfolge beide Lesarten zu. Der folgende Hinweis auf die bevorstehende Zerstreuung der Jünger spricht im Zusammenhang eher für eine zugespitzte, möglicherweise ironische Frage. Die alternative Aussagelesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Dialogstil. Die Mehrdeutigkeit der griechischen Interpunktion wird nicht eingeebnet, sondern durch eine Fußnote bewahrt.
