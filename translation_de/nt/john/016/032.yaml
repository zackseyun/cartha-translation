  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: de
  text: Seht, es kommt eine Stunde, und sie ist schon gekommen, in der ihr zerstreut werdet, jeder zu dem, was ihm gehört[a], und mich allein lasst. Doch ich bin nicht allein, denn der Vater ist bei mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder nach Hause“ oder „jeder an seinen eigenen Ort“. Der griechische Ausdruck ist weiter als eine bestimmte Ortsangabe und kann allgemein das bezeichnen, was jeweils einem gehört oder eigen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden, feierlichen Diskursmarker in heutigem, verständlichem Deutsch wieder, ohne das altertümlichere „Siehe“ zu verwenden.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: es kommt eine Stunde, und sie ist schon gekommen
  rationale: Bewahrt sowohl den fehlenden Artikel bei ὥρα als auch die Spannung zwischen dem gegenwärtigen Kommen und dem bereits eingetretenen Zeitpunkt.
- source_word: ἵνα
  choice: in der
  rationale: Leitet idiomatisch den Inhalt beziehungsweise das Geschehen dieser Stunde ein, ohne hier eine eindeutige Zweckbeziehung zu erzwingen.
- source_word: σκορπισθῆτε
  choice: ihr zerstreut werdet
  rationale: Bewahrt das Passiv und bezeichnet die erwartete Auflösung der Jüngergruppe.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: jeder zu seinem Eigenen
  rationale: Erhält die distributive Einzahl und lässt den breiten Bezug auf den eigenen Ort, Haushalt, Besitz oder Lebensbereich offen.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: und mich allein lasst
  rationale: Gibt das Zurücklassen Jesu natürlich und emotional treffend wieder, ohne die Aussage durch „verlassen“ oder „im Stich lassen“ zu verstärken.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Doch ich bin nicht allein
  rationale: Macht den im Zusammenhang liegenden Gegensatz zwischen dem Weggehen der Jünger und der Gegenwart des Vaters deutlich.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: denn der Vater ist bei mir
  rationale: Gibt die Begründung sowie den bestimmten relationalen Titel „der Vater“ unmittelbar wieder.
theological_decisions:
- issue: Spannung zwischen dem kommenden und bereits gekommenen Zeitpunkt
  choice: es kommt eine Stunde, und sie ist schon gekommen
  alternative: die Stunde kommt und ist jetzt da
  rationale: Die gewählte Fassung bewahrt die zeitliche Spannung des griechischen Präsens und Perfekts und legt nicht näher fest, in welchem Sinn die Stunde bereits gekommen ist.
- issue: Das Zurücklassen Jesu und die Gegenwart des Vaters
  choice: Doch ich bin nicht allein, denn der Vater ist bei mir
  alternative: Und ich bin nicht allein, weil der Vater mit mir ist
  rationale: 'Die Fassung hält beides nebeneinander: Die Jünger lassen Jesus tatsächlich allein, doch aufgrund der Gegenwart des Vaters ist er nicht letztlich allein. Weitergehende dogmatische Folgerungen werden nicht in den Vers eingetragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ trägt den feierlichen Aufmerksamkeitssignalton, während „zu seinem Eigenen“ bewusst knapp bleibt und die Mehrdeutigkeit des griechischen Ausdrucks wahrt.
