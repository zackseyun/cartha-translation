  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: de
  text: Und das werden sie tun, weil sie weder den Vater noch mich erkannt haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie weder den Vater noch mich kannten“; oder: „weil sie weder den Vater noch mich kennengelernt haben“. Das griechische Verb lässt hier mehrere natürliche Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Begründung der zuvor angekündigten Verfolgung fort.
- source_word: ταῦτα
  choice: das
  rationale: Im Deutschen verweist das substantivisch gebrauchte „das“ natürlich zusammenfassend auf die zuvor genannten feindseligen Handlungen; ein wörtliches „diese Dinge“ wäre weniger idiomatisch.
- source_word: ποιήσουσιν
  choice: werden sie tun
  rationale: Das Futur Aktiv von ποιέω wird in dieser Verbindung natürlich und bedeutungsnah wiedergegeben.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι leitet hier den Grund für die angekündigten Handlungen ein.
- source_word: οὐκ ἔγνωσαν
  choice: nicht erkannt haben
  rationale: Das Perfekt wahrt die gegenwärtige Bedeutung des griechischen Aorists; „erkannt“ kann im johanneischen Zusammenhang ein persönliches, relationales Kennen ausdrücken.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: „Vater“ bezeichnet hier Gott in seiner Beziehung zu Jesus und wird daher als Hoheitstitel großgeschrieben.
- source_word: οὐδὲ ἐμέ
  choice: weder … noch mich
  rationale: Die deutsche Korrelativkonstruktion gibt die auf beide Objekte bezogene Verneinung klar und idiomatisch wieder.
theological_decisions:
- issue: Johanneische Erkenntnissprache in Bezug auf den Vater und Jesus
  choice: weil sie weder den Vater noch mich erkannt haben
  alternative: weil sie weder den Vater noch mich kennen gelernt haben; weil sie weder den Vater noch mich kannten
  rationale: „Erkannt haben“ bewahrt die mögliche relationale Tiefe von γινώσκω und den bis in die Gegenwart reichenden Befund, ohne den Ausdruck dogmatisch auszudeuten. Die Fußnote hält die aspektuell und lexikalisch möglichen Alternativen offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Das“ ist als rückverweisende Zusammenfassung im Deutschen natürlicher als „diese Dinge“; „weder … noch“ macht die doppelte Verneinung deutlich.
