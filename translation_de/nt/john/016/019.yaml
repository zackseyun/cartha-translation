source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: de
  text: 'Jesus wusste, dass sie ihn fragen wollten, und sagte zu ihnen: »Sprecht ihr miteinander darüber, dass ich gesagt habe[b]: ›Noch eine kurze Zeit, dann seht ihr mich nicht mehr, und wieder eine kurze Zeit, dann werdet ihr mich sehen[a]‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Verben für »sehen«: zuerst θεωρέω (etwa »betrachten, wahrnehmen«), dann ὁράω (»sehen«).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weil ich gesagt habe«. Die griechische Konjunktion kann hier sowohl den Gegenstand des Gesprächs als auch dessen Anlass bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: wusste
  rationale: Das Aorist von γινώσκω bezeichnet hier Jesu Wissen um die Absicht der Jünger; »wusste« ist im Deutschen direkt und natürlich.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: sie ihn fragen wollten
  rationale: Die Wendung bezeichnet ihre fortdauernde Absicht, Jesus zu fragen, ohne einen konfrontativen Unterton.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Sprecht ihr miteinander darüber
  rationale: ζητέω meint in Verbindung mit μετ’ ἀλλήλων hier das gemeinsame Erörtern beziehungsweise Klären; die deutsche Formulierung gibt dies idiomatisch wieder.
- source_word: ὅτι εἶπον
  choice: dass ich gesagt habe
  rationale: ὅτι wird als Inhaltssatz verstanden und leitet die Aussage ein, über die sie miteinander sprechen. Die mögliche kausale Bedeutung bleibt in einer Fußnote erhalten.
- source_word: Μικρὸν
  choice: noch eine kurze Zeit
  rationale: Das substantivisch gebrauchte Neutrum bezeichnet idiomatisch einen kurzen Zeitraum. »Noch« macht den bevorstehenden zeitlichen Übergang im Deutschen natürlich deutlich.
- source_word: οὐ θεωρεῖτέ με
  choice: dann seht ihr mich nicht mehr
  rationale: Im zeitlichen Zusammenhang bezeichnet das Präsens den nach kurzer Zeit eintretenden Zustand. »nicht mehr« gibt die bevorstehende Beendigung des Sehens idiomatisch wieder.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: und wieder eine kurze Zeit, dann werdet ihr mich sehen
  rationale: Die Formulierung bewahrt die zeitliche Parallelität; das Futur von ὁράω wird ausdrücklich mit »werdet ... sehen« wiedergegeben.
theological_decisions:
- issue: Unterschied zwischen θεωρέω und ὁράω
  choice: Beide Verben im Haupttext mit »sehen« wiedergeben
  alternative: Das erste Verb etwa mit »betrachten« oder »wahrnehmen«, das zweite mit »sehen« übersetzen
  rationale: Der Zusammenhang betont Abwesenheit und erneutes Sehen, ohne zwingend zwei theologisch verschiedene Arten des Sehens zu unterscheiden. Eine Fußnote dokumentiert dennoch den lexikalischen Wechsel.
- issue: Funktion von ὅτι
  choice: 'Als Inhaltssatz: »dass ich gesagt habe«'
  alternative: 'Kausal: »weil ich gesagt habe«'
  rationale: Der folgende direkte Wortlaut legt nahe, dass ὅτι den Gegenstand ihres Gesprächs einführt. Da eine kausale Lesart grammatisch möglich ist, wird sie in einer Fußnote genannt.
- issue: Form von Jesu Äußerung
  choice: Als echte Frage formulieren
  alternative: 'Als feststellende Aussage: »Darüber sprecht ihr miteinander ...«'
  rationale: Die griechische Form und der Kontext unterstützen eine fragende, ihre interne Erörterung offenlegende Äußerung.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede verwendet eine natürliche deutsche Satzstellung; die zeitliche Parallelität der beiden Aussagen bleibt erhalten.
