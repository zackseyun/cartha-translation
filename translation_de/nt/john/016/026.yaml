  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: de
  text: An jenem Tag werdet ihr in meinem Namen bitten[a], und ich sage euch nicht, dass ich den Vater für euch[b] bitten werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen in diesem Vers zwei verschiedene Verben für „bitten“: αἰτέω für das Bitten der Jünger und ἐρωτάω für Jesu Bitten an den Vater.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „euretwegen“ oder „im Blick auf euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: An jenem Tag
  rationale: Die Wendung ist temporal; „an jenem Tag“ ist im modernen Deutschen natürlich und bewahrt den Nachdruck des Demonstrativpronomens.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die vertraute johanneische Wendung wahrt den Bezug zu Jesu Person und Vollmacht, ohne ihn erklärend einzuengen.
- source_word: αἰτήσεσθε
  choice: werdet ihr … bitten
  rationale: Das Futur und die zweite Person Plural werden direkt wiedergegeben. „Bitten“ passt zum Gebetskontext und ist im Deutschen idiomatischer als „ersuchen“.
- source_word: οὐ λέγω ὑμῖν
  choice: ich sage euch nicht
  rationale: Die Formulierung gibt das Präsens schlicht und würdig wieder, ohne es als grundsätzliche Verneinung über den unmittelbaren Aussagezusammenhang hinaus zu verstärken.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt dessen ein, was Jesus nicht sagt, und ist nicht kausal zu verstehen.
- source_word: ἐρωτήσω
  choice: ich … bitten werde
  rationale: Auch hier ist „bitten“ die natürliche deutsche Entsprechung. Dass im Griechischen ein anderes Verb als zuvor steht, wird in einer Fußnote kenntlich gemacht, statt im Haupttext eine künstliche Unterscheidung zu erzwingen.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: Der griechische Text enthält keinen ausdrücklichen Possessivzusatz; „den Vater“ bewahrt die johanneische Ausdrucksweise.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: Bei Personen kann περί mit Genitiv ein Eintreten für sie bezeichnen. „Für euch“ ist natürliches Deutsch und lässt sowohl den Bezug auf die Jünger als auch den interzessorischen Sinn erkennen.
theological_decisions:
- issue: Ob Jesus jede künftige Fürsprache verneint oder hier nur sagt, dass er den Zugang der Jünger zum Vater nicht auf diese Weise beschreibt
  choice: Die Aussage wird eng am Wortlaut als „ich sage euch nicht, dass …“ wiedergegeben.
  alternative: Eine stärkere Deutung wie „Ich werde den Vater nicht für euch bitten“ oder eine Auslegung, nach der keinerlei Vermittlung mehr nötig sei.
  rationale: Der unmittelbare Zusammenhang betont das Bitten der Jünger im Namen Jesu. Die Formulierung soll jedoch weder eine umfassende Verneinung der Fürsprache Jesu noch eine dogmatische Erklärung des Zugangs zum Vater in den Text hineintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die Wiederholung von „bitten“ klingt natürlich; die im Deutschen nicht ohne Weiteres abbildbare griechische Verbunterscheidung wird in der Fußnote erläutert.
