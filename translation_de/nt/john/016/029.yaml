lexical_decisions:
- source_word: Λέγουσιν
  choice: sagten
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Seine Jünger
  rationale: Idi­omatische Wiedergabe des griechischen Possessivverhältnisses.
- source_word: Ἴδε
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ knapp und würdig wieder; „Siehe“ wäre im modernen Standarddeutsch stärker altertümlich.
- source_word: νῦν
  choice: jetzt
  rationale: Bewahrt die unmittelbare zeitliche Markierung.
- source_word: ἐν παρρησίᾳ
  choice: offen
  rationale: Im Kontrast zu παροιμία bezeichnet der Ausdruck hier vor allem offene, unverhüllte beziehungsweise deutliche Rede.
- source_word: λαλεῖς
  choice: sprichst du
  rationale: Das deutsche Präsens entspricht der gegenwärtigen Gesprächssituation natürlich.
- source_word: παροιμίαν οὐδεμίαν λέγεις
  choice: gebrauchst keine bildhafte Rede
  rationale: „Bildhafte Rede“ erfasst im johanneischen Zusammenhang eine bildliche oder verhüllte Ausdrucksweise; „gebrauchst“ ist hierzu idiomatischer als das wörtliche „sagst“.
theological_decisions:
- issue: Bedeutung von παρρησία im Gegensatz zu παροιμία
  choice: Jesus wird als offen beziehungsweise unverhüllt sprechend beschrieben.
  alternative: Jesus spricht freimütig oder kühn.
  rationale: Der unmittelbare Gegensatz zu παροιμία spricht stärker für Klarheit und Unverhülltheit als für Mut; die Fußnote wahrt die semantische Breite.
- issue: Bedeutung von παροιμία
  choice: bildhafte Rede
  alternative: Sprichwort, Gleichnis oder verhüllte Rede
  rationale: Im Kontext von Johannes 16 geht es um indirekte beziehungsweise bildliche Ausdrucksweise; die möglichen engeren Wiedergaben bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das historische Präsens wird erzählerisch im Präteritum wiedergegeben; die direkte Rede bleibt im Präsens. Die beiden Fußnoten bewahren die echte lexikalische Spannweite der Schlüsselbegriffe.
