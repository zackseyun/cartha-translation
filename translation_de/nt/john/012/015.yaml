review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft Anrede, Imperativ, deiktische Aufforderung, Königstitel und das präsentische Kommen im Wesentlichen gut. „Eselin“ ist jedoch zu spezifisch: ὄνος bezeichnet hier einen Esel, ohne das biologische Geschlecht festzulegen. „Eselsfohlen“ gibt πῶλον ὄνου idiomatisch und ohne diese Einengung wieder.'
  naturalness: „Fürchte dich nicht, Tochter Zion! Sieh, dein König kommt“ ist verständliches, würdiges modernes Standarddeutsch mit bewusst prophetischem Ton. „Er sitzt auf einem Eselsfohlen“ ist natürlich; die Partizipbeziehung des Griechischen bleibt ausreichend erkennbar.
  terminology: „Tochter Zion“ ist die etablierte deutsche prophetische Personifikation. „König“ und „Eselsfohlen“ sind sachgerecht. Die Fußnote darf Jesus als Bezug des johanneischen Kontextes nennen, sollte aber den Wortlaut nicht durch die geschlechtsspezifische Formulierung „Eselin“ verfälschen.
