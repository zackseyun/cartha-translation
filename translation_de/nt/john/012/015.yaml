source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: de
  text: „Fürchte dich nicht, Tochter Zion[a]! Sieh, dein König kommt; er sitzt auf einem Eselsfohlen.“[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tochter Zion“ ist eine prophetische Personifizierung Zions beziehungsweise Jerusalems.
    reason: cultural_note
  - marker: b
    text: 'Der Wortlaut greift Sacharja 9,9 auf und stellt Jesus als den verheißenen König Zions dar. Wörtlich: „auf einem Fohlen eines Esels“.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Fürchte dich nicht
  rationale: Die Verneinung μή mit dem Imperativ von φοβέομαι untersagt die Furcht. Die traditionelle deutsche Formulierung ist weiterhin klar, prägnant und nicht unnötig altertümlich.
- source_word: θυγάτηρ Σιών
  choice: Tochter Zion
  rationale: Die Anrede personifiziert Zion beziehungsweise Jerusalem nach prophetischem Sprachgebrauch. „Tochter Zion“ ist im Deutschen die geläufige und zugleich formnahe Wiedergabe.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel lenkt den Blick auf das unmittelbar Folgende. „Sieh“ bewahrt diesen auffordernden Charakter in knapper, würdiger Sprache.
- source_word: ὁ βασιλεύς σου
  choice: dein König
  rationale: Die bestimmte Nominalgruppe mit Possessivpronomen wird direkt wiedergegeben. Die Großschreibung folgt der normalen deutschen Substantivschreibung und trägt keine zusätzliche Auslegung ein.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens vermittelt unmittelbares Geschehen. Das deutsche „kommt“ ist natürlich und lässt sowohl gegenwärtige Annäherung als auch prophetische Ankündigung gelten.
- source_word: καθήμενος
  choice: er sitzt
  rationale: Das präsentische Partizip beschreibt die Weise seines Kommens. Die finite Nebenformulierung ist im Deutschen natürlich und vermeidet das interpretativ stärkere „reitet“.
- source_word: ἐπὶ πῶλον ὄνου
  choice: auf dem Fohlen einer Eselin
  rationale: πῶλος bezeichnet ein Jungtier, während der Genitiv ὄνου die Tierart angibt und grammatisch auch die Wiedergabe „einer Eselin“ stützt. Die Formulierung erhält beide Bestandteile des Griechischen.
theological_decisions:
- issue: Messianische Anspielung auf Sacharja 9,9
  choice: Die prophetische Anrede und den Königstitel ohne erklärende Erweiterung im Haupttext beibehalten.
  alternative: Zion ausdrücklich als Jerusalem erklären oder Jesus im Vers selbst als den verheißenen Messias bezeichnen.
  rationale: Johannes lässt die prophetische Königsmotivik für sich sprechen. Eine Erläuterung gehört in die Fußnote, nicht als interpretative Ergänzung in den Bibeltext.
- issue: Verhältnis zum Wortlaut von Sacharja 9,9
  choice: Den eigenständigen Wortlaut des johanneischen Zitats übersetzen, einschließlich „Fürchte dich nicht“.
  alternative: Den Vers an eine deutsche Übersetzung von Sacharja 9,9 angleichen, etwa mit „Juble sehr“.
  rationale: Der SBLGNT-Text von Johannes ist maßgeblich; seine Form der Schriftaufnahme darf nicht stillschweigend durch den Wortlaut des alttestamentlichen Ausgangstextes ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erkennbarer prophetischer Sprachgestalt. „Sieh“ ist gehoben, aber allgemein verständlich; „er sitzt“ bleibt näher am griechischen καθήμενος als das stärker deutende „er reitet“. Sämtliche Fußnotenmarker erscheinen im Haupttext.
