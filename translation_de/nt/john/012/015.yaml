  rationale: Die Revision ersetzt die geschlechtsspezifische Wiedergabe „Fohlen einer Eselin“ durch das im Deutschen natürliche und quellensprachlich offene „Eselsfohlen“. Die Fußnote wird entsprechend korrigiert. Die Anker werden unmittelbar bei „Tochter Zion“ beziehungsweise am Satzende gesetzt, sodass sie klar ihrem Bezug zugeordnet sind.
