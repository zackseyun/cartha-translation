  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: de
  text: Unter denjenigen, die zum Fest hinaufzogen, um anzubeten, waren einige Griechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewisse Griechen“. Möglicherweise waren Nichtjuden gemeint, die zum Fest hinaufgezogen waren, um anzubeten.'
    reason: Die unbestimmte Formulierung und die nicht näher geklärte Identität der Griechen sollen sichtbar bleiben.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: waren auch
  rationale: Ἦσαν wird im Deutschen durch die natürliche Existenzkonstruktion mit „waren“ wiedergegeben. δέ markiert einen milden Anschluss beziehungsweise Übergang; in der gewählten Satzstellung bringt „auch“ die Hinzufügung dieser Gruppe idiomatisch zum Ausdruck, ohne ein zeitliches „nun“ einzuführen.
- source_word: Ἕλληνές τινες
  choice: einige Griechen
  rationale: Ἕλληνες bezeichnet seinem naheliegenden Wortsinn nach Griechen; τινες macht die Gruppe unbestimmt. „Einige Griechen“ ist im modernen Deutsch natürlicher als „gewisse Griechen“ und legt ihre genauere religiöse Zugehörigkeit nicht fest.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: unter denen, die hinaufzogen
  rationale: ἐκ kennzeichnet die Griechen als Teil der Gruppe. „Hinaufzogen“ bewahrt die übliche räumliche und religiöse Rede vom Hinaufziehen nach Jerusalem.
- source_word: ἵνα προσκυνήσωσιν
  choice: um ... anzubeten
  rationale: ἵνα mit dem Konjunktiv bezeichnet hier den Zweck. προσκυνέω meint in diesem Zusammenhang religiöse Verehrung; „anbeten“ gibt dies knapp und natürlich wieder.
- source_word: ἐν τῇ ἑορτῇ
  choice: beim Fest
  rationale: ἑορτή bezeichnet hier den jüdischen Festanlass. „Beim Fest“ ist eine natürliche deutsche Wiedergabe, ohne im Haupttext eine nicht ausdrücklich genannte nähere Bestimmung hinzuzufügen.
theological_decisions:
- issue: Identität der Ἕλληνες
  choice: „Griechen“ als ethnisch-kulturelle Bezeichnung
  alternative: „Nichtjuden“ beziehungsweise eine nähere Bestimmung als Proselyten oder Gottesfürchtige
  rationale: Der Text nennt sie Ἕλληνες und sagt lediglich, dass sie zum Fest hinaufgezogen waren, um anzubeten. Ob es sich genauer um nichtjüdische Gottesfürchtige, Proselyten oder eine andere Gruppe handelte, bleibt offen; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die größere Pilgergruppe zuerst vor und macht die Zugehörigkeit der Griechen zu ihr klar. „Fest“ bleibt bewusst allgemein, wie im griechischen Vers.
