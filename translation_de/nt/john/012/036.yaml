id: JHN.12.36
reference: John 12:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: de
  text: Solange ihr das Licht habt, glaubt an das Licht, damit ihr Söhne des Lichts[a] werdet. Dies sagte Jesus; dann ging er fort und verbarg sich vor ihnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder des Lichts“. Wörtlich steht im Griechischen „Söhne des Lichts“, eine Wendung für Menschen, die vom Licht geprägt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Nachdem er fortgegangen war, verbarg er sich vor ihnen.“'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Solange ihr das Licht habt
  rationale: ὡς mit dem Präsens ἔχετε ist hier temporal. „Solange“ gibt die begrenzte Gelegenheit und die Dringlichkeit im Deutschen natürlich wieder.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Der bestimmte Artikel bleibt erhalten; zugleich bleiben die bildhafte und die christologische Bedeutung des johanneischen Lichtmotivs offen.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: glaubt an das Licht
  rationale: „An … glauben“ ist die natürliche deutsche Entsprechung von πιστεύειν εἰς und wahrt die johanneische Ausdrucksweise ohne erklärende Erweiterung.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ drückt den Ziel- beziehungsweise Folgesinn des griechischen Zwecksatzes knapp und idiomatisch aus.
- source_word: υἱοὶ φωτός
  choice: Söhne des Lichts
  rationale: Die Übersetzung bildet das ausdrücklich männliche υἱοί formal ab und bewahrt zugleich die semitisch geprägte Wendung für Menschen, die vom Licht bestimmt sind.
- source_word: γένησθε
  choice: werdet
  rationale: Das Verb gibt den Gedanken des Werdens wieder und reduziert γίνομαι nicht auf bloßes Sein.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Dies sagte Jesus
  rationale: „Dies sagte Jesus“ ist im modernen Deutschen natürlicher als „Diese Dinge sprach Jesus“, ohne den rückverweisenden Charakter von ταῦτα zu verlieren.
- source_word: ἀπελθὼν
  choice: dann ging er fort
  rationale: Das vorzeitige aoristische Partizip wird durch „dann“ und ein koordiniertes finites Verb als nachfolgende Handlung natürlich wiedergegeben.
- source_word: ἐκρύβη ἀπ’ αὐτῶν
  choice: verbarg sich vor ihnen
  rationale: Die formal passive Form kann hier intransitiv beziehungsweise medial verstanden werden. Die reflexive deutsche Form passt zum erzählten Handeln, ohne einen fremden Verursacher einzuführen.
theological_decisions:
- issue: Geschlechtsspezifische familiäre Wendung υἱοὶ φωτός
  choice: Söhne des Lichts
  alternative: Kinder des Lichts
  rationale: „Söhne“ wahrt die Form des griechischen Ausdrucks; die idiomatisch umfassende Bedeutung wird in einer Fußnote kenntlich gemacht, statt sie im Haupttext stillschweigend zu neutralisieren.
- issue: Johanneische Wendung πιστεύειν εἰς
  choice: an das Licht glauben
  alternative: dem Licht vertrauen
  rationale: Die gewählte Form entspricht dem etablierten johanneischen Sprachgebrauch und lässt den theologischen Gehalt stehen, ohne ihn paraphrasierend festzulegen.
- issue: Handlungsfolge bei ἀπελθὼν ἐκρύβη
  choice: dann ging er fort und verbarg sich vor ihnen
  alternative: nachdem er fortgegangen war, verbarg er sich vor ihnen
  rationale: Die koordinierte Form wahrt die zeitliche Abfolge und klingt erzählerisch natürlicher; die stärker formale partizipiale Alternative wird als Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „das Licht“ und das johanneische „an … glauben“ bleiben bewusst erhalten. „Dies sagte Jesus“ vermeidet unnatürliches Bibeldeutsch, während „Söhne des Lichts“ die markierte Ausgangsform bewahrt.
