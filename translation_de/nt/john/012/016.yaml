review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von »verstanden«, »zunächst«, »verherrlicht«, »über ihn geschrieben stand« und »erinnerten sie sich« trifft den griechischen Sinn insgesamt gut. Das Plusquamperfekt bei ἐδοξάσθη legt jedoch eine im griechischen Aorist nicht ausdrücklich markierte Vorzeitigkeit nahe. Bei ταῦτα ἐποίησαν αὐτῷ ist »ihm dies getan« im Deutschen stark negativ konnotiert und verdeckt im Kontext die ehrende Handlung; »für ihn getan« gibt den kontextuell naheliegenden Bezug wieder.
  naturalness: Der Satz ist in modernem Standarddeutsch klar und würdig. »Als Jesus verherrlicht wurde« ist idiomatisch und folgt der zeitlichen Gliederung des griechischen Satzes unmittelbarer. Die Wiederholung von »dies« bewahrt die Kohärenz des Ausgangstextes.
  terminology: »Verherrlicht« bewahrt das zentrale johanneische Sprachmotiv. »Jünger« und »geschrieben stand« sind angemessen. Die Anführungszeichen der Fußnote folgen deutschem Gebrauch.
  issues:
  - severity: medium
    issue: Das Plusquamperfekt bei »verherrlicht worden war« überinterpretiert den Aorist ἐδοξάσθη.
    rationale: Der griechische Aorist bezeichnet hier die Verherrlichung als Bezugspunkt der späteren Erinnerung, markiert aber nicht selbst ein Plusquamperfekt. »Als Jesus verherrlicht wurde« ist näher am Wortlaut und lässt die zeitliche Relation offen genug.
  - severity: medium
    issue: »dass man ihm dies getan hatte« kann im Deutschen eine schädigende Handlung nahelegen.
    rationale: Im Kontext bezieht sich ταῦτα ἐποίησαν αὐτῷ auf die in der Erzählung vollzogenen, Jesus ehrenden Handlungen. »Für ihn getan« gibt diesen Bezug natürlich wieder, ohne die Handelnden fälschlich als Jünger zu bestimmen.
