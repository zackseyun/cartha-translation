  to: Seine Jünger verstanden das zunächst nicht[a]. Doch als Jesus verherrlicht wurde[b], erinnerten sie sich daran, dass dies über ihn[c] geschrieben stand und dass man dies für ihn getan hatte[d].
  rationale: Die Revision ersetzt das nicht erforderliche Plusquamperfekt durch die aoristische, zeitlich neutrale Form »wurde«. Sie formuliert außerdem die letzte Aussage so, dass die im Kontext ehrende Handlung nicht durch die im Deutschen meist negative Wendung »jemandem etwas antun« missverstanden wird. Die Fußnote dokumentiert die wörtlichere, im Deutschen jedoch missverständliche Konstruktion.
