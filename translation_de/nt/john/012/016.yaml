  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: de
  text: Seine Jünger verstanden das zunächst nicht[a]. Doch als Jesus verherrlicht wurde[b], erinnerten sie sich daran, dass dies über ihn[c] geschrieben stand und dass man dies für ihn getan hatte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erkannten das zunächst nicht.'
    reason: lexical_alternative
  - marker: b
    text: Im Johannesevangelium kann Jesu »Verherrlichung« seinen Tod, seine Auferstehung und seine Erhöhung in ihrem Zusammenhang bezeichnen.
    reason: cross_reference
  - marker: c
    text: 'Oder: in Bezug auf ihn.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: dass sie ihm dies getan hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: verstanden
  rationale: Im Zusammenhang geht es nicht nur um fehlendes Wissen, sondern darum, dass die Jünger die Bedeutung der Ereignisse zunächst nicht erfassten. »Verstanden« gibt dies in natürlichem Deutsch wieder.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: seine Jünger
  rationale: Der Genitiv bezeichnet die Zugehörigkeit zu Jesus; »seine Jünger« ist die natürliche deutsche Form.
- source_word: τὸ πρῶτον
  choice: zunächst
  rationale: Die Wendung bezeichnet den anfänglichen Zeitpunkt und wird knapp und idiomatisch wiedergegeben.
- source_word: ἐδοξάσθη
  choice: verherrlicht worden war
  rationale: »Verherrlicht« bewahrt das gewichtige johanneische Sprachmotiv. Das Plusquamperfekt macht deutlich, dass die spätere Erinnerung auf die bereits erfolgte Verherrlichung folgt.
- source_word: ἐμνήσθησαν
  choice: erinnerten sie sich
  rationale: Das mediale/passive Verb wird im Deutschen natürlich reflexiv wiedergegeben und wahrt die erzählte Abfolge.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: über ihn geschrieben stand
  rationale: ἐπί mit Dativ bezeichnet hier den Gegenstand der Schriftworte. »Geschrieben stand« verweist idiomatisch auf die bereits vorliegenden Schriften.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: dass man ihm dies getan hatte
  rationale: Das griechische Verb hat ein nicht ausdrücklich genanntes Subjekt in der dritten Person Plural. Das unpersönliche »man« verhindert, dass fälschlich die Jünger als Handelnde verstanden werden; »ihm« hält den Dativ offen.
- source_word: ταῦτα
  choice: dies
  rationale: Das neutrale »dies« fasst die zuvor geschilderten Vorgänge kollektiv zusammen und erhält die Wiederaufnahme innerhalb des Verses.
theological_decisions:
- issue: Bedeutung der Verherrlichung Jesu im Johannesevangelium
  choice: »verherrlicht worden war« bleibt ohne zeitliche oder sachliche Einengung stehen.
  alternative: Die Formulierung ausdrücklich nur auf Auferstehung und Erhöhung oder umfassend auf Leiden, Tod, Auferstehung und Erhöhung beziehen.
  rationale: Die johanneische Rede von Jesu Verherrlichung ist mehrschichtig. Die Übersetzung bewahrt diese theologische Spannung, statt sie durch eine erklärende Paraphrase aufzulösen.
- issue: Bezug von ἐπ’ αὐτῷ
  choice: »über ihn«
  alternative: »in Bezug auf ihn«
  rationale: »Über ihn« ist natürlich und bezeichnet Jesus als Gegenstand der Schriftworte, ohne deren genaue Art weiter festzulegen.
- issue: Bedeutung des Dativs αὐτῷ bei ἐποίησαν
  choice: »ihm dies getan hatte«
  alternative: »dies für ihn getan hatte«
  rationale: Der Dativ kann die auf Jesus bezogene Handlung bezeichnen, ohne dass im Deutschen zwingend zwischen »ihm« und »für ihn« entschieden werden muss. Die Hauptfassung bleibt näher an der offenen griechischen Konstruktion; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am griechischen Gedankengang. »Man« gibt das nicht genannte Subjekt der dritten Person Plural natürlich wieder und vermeidet einen irreführenden Bezug auf die Jünger.
