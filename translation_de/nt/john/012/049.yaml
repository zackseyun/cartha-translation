  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: de
  text: Denn ich habe nicht aus mir selbst gesprochen,[a] sondern der Vater selbst, der mich gesandt hat, hat mir geboten, was ich sagen und was ich reden soll.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von mir aus“ oder „aus eigener Vollmacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen stehen hier zwei verschiedene Verben: „sagen“ und „reden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: aus mir selbst
  rationale: Die relativ formale Wiedergabe bewahrt das johanneische Herkunftsmotiv und lässt offen, ob vor allem eigenständiges Handeln oder eigene Autorität gemeint ist; die Fußnote nennt natürliche deutsche Alternativen.
- source_word: οὐκ ἐλάλησα
  choice: habe nicht ... gesprochen
  rationale: Das deutsche Perfekt ist im gegenwärtigen Standarddeutsch natürlich und fasst Jesu bisheriges Reden in den Blick.
- source_word: ὁ πέμψας με πατήρ
  choice: der Vater, der mich gesandt hat
  rationale: Der substantivierte Partizipialausdruck wird als Relativsatz wiedergegeben. „Vater“ steht als Gottesbezeichnung groß.
- source_word: αὐτός μοι
  choice: hat mir selbst
  rationale: „Selbst“ bildet die Hervorhebung durch αὐτός ab und bezieht sich im deutschen Satz natürlich auf den Vater.
- source_word: ἐντολήν
  choice: aufgetragen
  rationale: Die verbale Formulierung „hat mir aufgetragen“ gibt die autoritative Weisung idiomatisch wieder, ohne den Ausdruck unnötig an einen Gesetzeskodex anzunähern.
- source_word: δέδωκεν
  choice: hat ... aufgetragen
  rationale: 'Das deutsche Perfekt spiegelt den griechischen Perfektaspekt angemessen: Der erteilte Auftrag bleibt maßgeblich.'
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: was ich sagen und was ich reden soll
  rationale: Die Konstruktion nach ἐντολή wird mit „soll“ als indirekte Frage unter Weisungscharakter wiedergegeben. „sagen“ und „reden“ bewahren die zwei verschiedenen griechischen Verben.
theological_decisions:
- issue: Verhältnis des Redens des Sohnes zum Auftrag des Vaters
  choice: Jesus redet nicht aus sich selbst, sondern gemäß dem Auftrag des Vaters.
  alternative: Die Aussage als bloße Übereinstimmung ohne Abhängigkeit im Auftrag oder als Aussage über eine geringere Natur Jesu auszudeuten.
  rationale: Der Wortlaut betont Herkunft, Sendung und Auftrag, macht hier aber keine ausdrückliche Aussage über das Wesen des Sohnes. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch auszubauen.
- issue: Wiedergabe von πατήρ
  choice: Vater
  alternative: Vater in rein allgemein-familiärem Sinn
  rationale: Im johanneischen Zusammenhang bezeichnet „der Vater“ Gott in seiner Beziehung zu Jesus; die Großschreibung entspricht dem deutschen Gebrauch für die Gottesbezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „was ich sagen und was ich reden soll“ ist bewusst beibehalten, um die lexikalische Unterscheidung des griechischen Textes sichtbar zu machen.
