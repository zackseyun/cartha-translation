id: JHN.12.47
reference: John 12:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: de
  text: Und wenn jemand meine Worte hört und sie nicht bewahrt, richte ich ihn[a][b] nicht; denn ich bin nicht gekommen, um die Welt zu richten, sondern um die Welt zu retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verurteile ich ihn nicht“. Das griechische Verb kann „richten“ bedeuten und im Zusammenhang auch den Sinn eines verurteilenden Urteils tragen.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihn“ ist hier allgemein gemeint: Die Aussage gilt jedem Menschen, der Jesu Worte hört und sie nicht bewahrt.'
    reason: generic_pronoun
lexical_decisions:
- source_word: ἐάν τίς
  choice: wenn jemand
  rationale: Die unbestimmte Bedingung bezeichnet einen allgemein geltenden Fall; „jemand“ gibt die offene, generische Aussage natürlich wieder.
- source_word: ἀκούσῃ
  choice: hört
  rationale: „Hört“ entspricht der Grundbedeutung und fügt nicht die stärkere Nuance aufmerksamen oder gehorsamen Zuhörens hinzu.
- source_word: τῶν ῥημάτων
  choice: meine Worte
  rationale: ῥήματα bezeichnet hier Jesu gesprochene Worte oder Äußerungen; „meine Worte“ ist natürlich und wahrt den Bezug auf seine Verkündigung.
- source_word: φυλάξῃ
  choice: sie nicht bewahrt
  rationale: φυλάσσω kann „bewahren“, „festhalten“ oder „befolgen“ bedeuten. „Bewahrt“ erhält die mögliche Verbindung von Festhalten und gehorsamer Treue, ohne auf bloßen Gehorsam zu verengen.
- source_word: οὐ κρίνω αὐτόν
  choice: richte ich ihn nicht
  rationale: „Richten“ wahrt die Wiederholung von κρίνω im folgenden Zwecksatz und lässt offen, ob hier besonders das verurteilende Gericht gemeint ist. „Ihn“ entspricht dem grammatischen Singular und hat im Deutschen nach „jemand“ ebenfalls generische Kraft.
- source_word: οὐ γὰρ ἦλθον
  choice: denn ich bin nicht gekommen
  rationale: Das deutsche Perfekt ist hier die natürliche Form für Jesu zusammenfassende Aussage über sein Kommen und seine Sendung.
- source_word: ἵνα κρίνω
  choice: um … zu richten
  rationale: Die Konstruktion mit „um … zu“ gibt den von ἵνα ausgedrückten Zweck klar wieder.
- source_word: τὸν κόσμον
  choice: die Welt
  rationale: „Die Welt“ ist die sachgerechte und im Johannesevangelium etablierte Wiedergabe von κόσμος; eine engere Deutung auf bestimmte Menschengruppen wäre nicht begründet.
- source_word: ἵνα σώσω
  choice: um … zu retten
  rationale: „Retten“ gibt den zentralen heilsgeschichtlichen Sinn von σῴζω verständlich und ohne zusätzliche dogmatische Präzisierung wieder.
theological_decisions:
- issue: Jesu Aussage „ich richte ihn nicht“ im Verhältnis zu anderen johanneischen Gerichtsaussagen
  choice: κρίνω an beiden Stellen mit „richten“ wiedergeben und die zeitliche beziehungsweise sendungsgeschichtliche Einordnung dem Kontext überlassen.
  alternative: „verurteilen“ oder ausdrücklich „jetzt nicht richten“
  rationale: Die Aussage stellt den Zweck von Jesu Kommen als Rettung und nicht als Gericht dar. Die einheitliche Wiedergabe mit „richten“ bewahrt die Spannung zu anderen Aussagen über Jesu Gericht, statt sie durch eine erklärende Paraphrase aufzulösen.
- issue: Generischer maskuliner Singular αὐτόν
  choice: „ihn“ im Haupttext, mit Erläuterung seiner generischen Reichweite in einer Fußnote.
  alternative: „diesen Menschen“ oder eine pluralische, geschlechtsneutrale Umformung
  rationale: „Ihn“ bildet den griechischen Singular nach τις grammatisch genau ab. Die Fußnote verhindert zugleich das Missverständnis, die Aussage gelte nur Männern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Schlüsselwörter „richten“ und „die Welt“ bleiben erhalten. „Bewahren“ ist leicht gehoben, aber allgemein verständlich und trägt die semantische Breite von Festhalten, Beachten und gehorsamer Treue besser als das engere „befolgen“.
