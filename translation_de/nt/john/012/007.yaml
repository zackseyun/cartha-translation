  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: de
  text: 'Da sagte Jesus: »Lass sie in Ruhe,[a] damit sie es für den Tag meines Begräbnisses aufbewahrt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lass sie in Ruhe; sie hat es für den Tag meines Begräbnisses aufbewahrt.« Manche verstehen den Satz als Beschreibung dessen, was sie bereits getan hat, und nicht dessen, was sie noch tun soll.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »damit sie es bis zum Tag meines Begräbnisses aufbewahrt.« Die griechische Wendung kann auch ausdrücklich zeitlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Fortführung und Reaktion im Erzählzusammenhang. »Da« klingt im modernen Deutschen natürlich, ohne den Zusammenhang stärker als ausdrücklich folgernd festzulegen.
- source_word: Ἄφες αὐτήν
  choice: Lass sie in Ruhe
  rationale: Der Imperativ von ἀφίημι fordert hier idiomatisch dazu auf, die Frau nicht weiter zu behelligen oder ihr Tun zu verhindern.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck beziehungsweise das beabsichtigte Ergebnis wieder und wahrt die syntaktische Verknüpfung der beiden Satzteile.
- source_word: εἰς τὴν ἡμέραν
  choice: für den Tag
  rationale: Bezeichnet den künftigen Anlass, für den etwas aufbewahrt wird, ohne die Präposition im Haupttext eindeutig auf »bis zu« festzulegen.
- source_word: ἐνταφιασμοῦ
  choice: Begräbnisses
  rationale: Bezeichnet die Bestattung beziehungsweise Beisetzung. »Begräbnis« ist im Deutschen klar, würdig und weniger technisch als »Grablegung«.
- source_word: τηρήσῃ
  choice: aufbewahrt
  rationale: Passt im Zusammenhang zu etwas, das für einen bestimmten Anlass zurückbehalten wird. Der Konjunktiv nach ἵνα wird im deutschen damit-Satz idiomatisch mit dem Indikativ wiedergegeben.
- source_word: αὐτό
  choice: es
  rationale: Bewahrt das sächliche Pronomen des griechischen Textes, dessen Bezug im Kontext das Salböl beziehungsweise Duftöl ist, ohne im Vers ein erklärendes Substantiv hinzuzufügen.
theological_decisions:
- issue: Bezug der Salbung auf Jesu bevorstehendes Begräbnis
  choice: Der Haupttext gibt die Aussage zukunftsbezogen als Aufforderung wieder, das Salböl für den Tag von Jesu Begräbnis aufzubewahren.
  alternative: 'Die Klausel kann als Aussage über das bereits Geschehene verstanden werden: »Sie hat es für den Tag meines Begräbnisses aufbewahrt.« Eine weitere Möglichkeit ist die ausdrücklich zeitliche Wiedergabe »bis zum Tag meines Begräbnisses«.'
  rationale: Die griechische Konstruktion ist syntaktisch schwierig. Der Haupttext folgt der naheliegenden Zweckbeziehung von Ἄφες … ἵνα … τηρήσῃ, während die echten Deutungsalternativen in den Fußnoten offengehalten werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt; die syntaktische Mehrdeutigkeit wird nicht im Haupttext geglättet, sondern durch zwei Fußnoten transparent gemacht.
