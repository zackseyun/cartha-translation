  source_fidelity: Der Haupttext gibt εἶπεν οὖν mit dem im Erzählzusammenhang natürlichen »Da sagte« wieder und trifft Ἄφες αὐτήν idiomatisch mit »Lass sie in Ruhe«. Die Zweckkonstruktion ἵνα … τηρήσῃ αὐτό ist als »damit sie es … aufbewahrt« angemessen wiedergegeben. »Für den Tag meines Begräbnisses« bewahrt die zukunftsgerichtete, syntaktisch schwierige Formulierung des griechischen Textes, ohne die alternative zeitliche Nuance in den Haupttext zu verlagern.
