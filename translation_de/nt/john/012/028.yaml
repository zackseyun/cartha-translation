id: JHN.12.28
reference: John 12:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: de
  text: 'Vater, verherrliche deinen Namen! Da kam eine Stimme aus dem Himmel: „Ich habe ihn verherrlicht[a] und werde ihn wieder verherrlichen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich verherrlichte ihn.“'
    reason: Der griechische Aorist bezeichnet die Handlung als geschehen; im Deutschen ist hier auch eine einfache Vergangenheitsform möglich, während das Perfekt natürlicher klingt und die fortdauernde Bedeutung hervorhebt.
lexical_decisions:
- source_word: πάτερ
  choice: Vater
  rationale: Der Vokativ redet Gott unmittelbar an. „Vater“ ist im Deutschen natürlich und fügt kein im Griechischen fehlendes Possessivpronomen hinzu.
- source_word: δόξασόν
  choice: verherrliche
  rationale: „Verherrlichen“ bewahrt den für das Johannesevangelium wichtigen Zusammenhang von δόξα und δοξάζω und ist hier gewichtiger und genauer als bloßes „ehren“.
- source_word: σου τὸ ὄνομα
  choice: deinen Namen
  rationale: Die idiomatische Wiedergabe bewahrt die biblische Bedeutung des Namens als Ausdruck der offenbarten Person und ihres Ansehens, ohne sie auszudeuten.
- source_word: ἦλθεν οὖν
  choice: Da kam
  rationale: οὖν führt hier die Erzählung folgerichtig weiter. „Da kam“ klingt in modernem Deutsch natürlich und vermeidet das zu stark kausale „deshalb“.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: eine Stimme aus dem Himmel
  rationale: Die folgende direkte Rede macht deutlich, dass φωνή eine artikulierte Stimme bezeichnet. „Aus dem Himmel“ gibt den göttlichen Ursprung angemessen wieder.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Ich habe ihn verherrlicht und werde ihn wieder verherrlichen
  rationale: Das Perfekt gibt die vollendete, für die Gegenwart bedeutsame Handlung im natürlichen Deutschen wieder; die Fußnote hält die formal näher am Aorist liegende Alternative offen. Das Pronomen „ihn“ nimmt grammatisch korrekt „Namen“ auf, und „wieder“ gehört zum Futur.
theological_decisions:
- issue: Unausgesprochenes Objekt in der Antwort der Stimme
  choice: „ihn“ als Rückbezug auf „deinen Namen“ ergänzen
  alternative: 'Das Objekt unausgesprochen lassen: „Ich habe verherrlicht und werde wieder verherrlichen“'
  rationale: Im Griechischen ist das Objekt aus dem unmittelbaren Kontext erschließbar. Im Deutschen wäre seine Auslassung unnatürlich und könnte den Bezug verdunkeln; „ihn“ macht keine neue Deutung auf, sondern nimmt „Namen“ auf.
- issue: Theologisch geprägtes δοξάζω im Johannesevangelium
  choice: „verherrlichen“
  alternative: „ehren“ oder „Herrlichkeit erweisen“
  rationale: „Verherrlichen“ wahrt das johanneische Wortfeld der Herrlichkeit und lässt offen, auf welche vergangenen und zukünftigen Taten Gottes sich die Aussage konkret bezieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Text, ohne unnatürlich zu wirken. Das Ausrufezeichen gibt den dringlichen Imperativ angemessen wieder; die göttliche Antwort steht in direkter Rede.
