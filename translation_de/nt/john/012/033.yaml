  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: de
  text: Das sagte er, um anzudeuten, welche Art von Tod[a] er sterben würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »welchen Tod er sterben würde«. Der griechische Ausdruck kann die Art oder Weise des Todes hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Das
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist auf Jesu unmittelbar vorausgehende Aussage.
- source_word: δὲ
  choice: unmarkiert im deutschen Satzfluss
  rationale: δέ verbindet hier nur leicht beziehungsweise führt die Erläuterung weiter. Ein ausdrückliches »aber« würde einen stärkeren Gegensatz nahelegen, als der Zusammenhang verlangt.
- source_word: ἔλεγεν
  choice: sagte er
  rationale: Das griechische Imperfekt beschreibt die Äußerung aus der Erzählperspektive. Im natürlichen deutschen Erzählstil gibt das Präteritum den Vorgang angemessen wieder; »war dabei zu sagen« wäre unnötig schwerfällig.
- source_word: σημαίνων
  choice: um anzudeuten
  rationale: Das Partizip erklärt, was Jesus mit seiner Aussage erkennen ließ. »Andeuten« bewahrt den indirekten Charakter des johanneischen Ausdrucks.
- source_word: ποίῳ θανάτῳ
  choice: durch welche Art von Tod
  rationale: Der Dativ bezeichnet die Art beziehungsweise Weise des Todes. Die Formulierung macht diese Nuance im Deutschen deutlich, ohne die Kreuzigung ausdrücklich vorwegzunehmen.
- source_word: ἤμελλεν
  choice: würde
  rationale: Hier bezeichnet μέλλω ein aus damaliger Sicht bevorstehendes Geschehen. Das deutsche Futur in der Vergangenheit ist natürlich und vermeidet die stärkere Schicksalsnuance von »sollte«.
- source_word: ἀποθνῄσκειν
  choice: sterben
  rationale: Der Infinitiv ergänzt μέλλω und wird im Deutschen idiomatisch mit dem einfachen Infinitiv wiedergegeben.
theological_decisions:
- issue: Soll die Kreuzigung ausdrücklich genannt werden?
  choice: Die indirekte Formulierung »durch welche Art von Tod er sterben würde« bleibt erhalten.
  alternative: »dass er am Kreuz sterben würde«
  rationale: Der Erzähler erläutert die Todesart, nennt in diesem Vers aber die Kreuzigung nicht ausdrücklich. Eine explizite Nennung wäre aus dem Zusammenhang verständlich, ginge jedoch über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und erklärend; die indirekte Aussageweise des griechischen Textes wird bewahrt.
