id: JHN.12.24
reference: John 12:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wenn das Weizenkorn nicht in die Erde fällt und stirbt, bleibt es für sich allein[a]; wenn es aber stirbt, bringt es viel Frucht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bleibt es allein“.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild beschreibt ein Korn, das in der Erde sterben muss, um Frucht zu bringen. Im Zusammenhang bezieht Jesus dieses Muster auf seinen eigenen Tod und auf die Menschen, die ihm folgen.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die Wiederholung und der feierliche Bekräftigungscharakter der johanneischen Redeformel bleiben unmittelbar erhalten. „Wahrlich, wahrlich“ wäre möglich, wirkt im heutigen Deutsch jedoch altertümlicher.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte Anrede und die für Johannes typische Formel werden schlicht und quellennah wiedergegeben.
- source_word: ἐὰν μὴ
  choice: wenn ... nicht
  rationale: Diese Form entspricht hier natürlichem deutschem Bedingungssatzbau und erhält die konditionale Struktur.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: das Weizenkorn
  rationale: „Weizenkorn“ ist im Deutschen die natürliche, präzise Bezeichnung und bewahrt das landwirtschaftliche Bild.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: in die Erde fällt
  rationale: Das Partizip wird als finites Verb wiedergegeben; „in die Erde“ bezeichnet im Zusammenhang den Boden, in den das Korn gelangt, und erhält die Richtung von εἰς.
- source_word: ἀποθάνῃ
  choice: stirbt
  rationale: Der Aorist Konjunktiv in den Bedingungssätzen wird im Deutschen idiomatisch mit dem Präsens wiedergegeben.
- source_word: αὐτὸς μόνος μένει
  choice: bleibt es für sich allein
  rationale: Die Formulierung bewahrt sowohl das intensive αὐτός als auch μόνος und macht deutlich, dass das Korn einzeln und ohne Frucht bleibt, ohne emotionale Einsamkeit nahezulegen.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: wenn es aber stirbt
  rationale: „Aber“ gibt den von δέ markierten Gegensatz zum ersten Bedingungssatz klar wieder.
- source_word: πολὺν καρπὸν φέρει
  choice: bringt es viel Frucht
  rationale: Die geläufige deutsche Wendung bewahrt die Fruchtmetapher und vermeidet die stärker deutende Wiedergabe „reiche Ernte“.
theological_decisions:
- issue: Landwirtschaftliches Bild mit christologischer und auf die Nachfolge bezogener Bedeutung
  choice: Das Bild vom sterbenden und fruchtbringenden Weizenkorn bleibt im Haupttext unausgelegt.
  alternative: Im Vers ausdrücklich ergänzen, dass Jesus damit seinen eigenen Tod und dessen Wirkung sowie den Weg seiner Nachfolger meint.
  rationale: Der Zusammenhang legt diese Anwendung nahe, doch der Vers selbst formuliert zunächst das Bild. Die Übersetzung lässt dessen theologische Tragweite durch den Kontext hervortreten, statt sie in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Formel „Amen, amen“ bewahrt bewusst den semitisch-griechischen Ausdruck und seine für das Johannesevangelium charakteristische Wiederholung. Satzbau und Wortwahl bleiben allgemein verständlich; die Metapher wird nicht erklärend in den Haupttext aufgelöst.
