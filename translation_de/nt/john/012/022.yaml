    issue: Explizite Bewegungsziele ergänzt
    rationale: „geht zu Andreas“ und „gehen … zu Jesus“ machen aus dem bloßen ἔρχεται („kommt“) eine zielgerichtete Bewegung zu den jeweiligen Personen. Die Empfänger sind nur bei λέγει/λέγουσιν im Dativ ausgedrückt.
  - severity: low
    issue: „dann“ verstärkt die Verknüpfung
    rationale: Das zweite καί ist primär additiv/parataktisch. Die Reihenfolge ist ohnehin erkennbar; „dann“ ist nicht nötig.
  - severity: low
    issue: „berichtet“ ist enger als λέγει
    rationale: λέγει/λέγουσιν bezeichnet allgemein „sagt/sagen“. „Berichtet“ kann zwar kontextuell passen, ist aber semantisch spezifischer.
