  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: de
  text: Philippus kommt und sagt es Andreas; Andreas und Philippus kommen und sagen es Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen stehen die Verben im historischen Präsens („kommt … sagt … kommen … sagen“), einer lebendigen Erzählweise.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: geht zu
  rationale: Das historische Präsens bleibt erhalten. Im Deutschen bezeichnet „geht zu“ die Bewegung zum jeweils genannten Gesprächspartner natürlich; ein starres „kommt“ würde ohne dessen Perspektive missverständlich wirken.
- source_word: λέγει
  choice: berichtet es ihm
  rationale: Der Kontext liefert den Inhalt der Mitteilung aus dem vorigen Vers. „Berichtet es ihm“ gibt die kommunikative Funktion idiomatisch wieder, ohne direkte Rede einzuführen.
- source_word: τῷ Ἀνδρέᾳ
  choice: zu Andreas … ihm
  rationale: Der Dativ bezeichnet den Empfänger der Mitteilung. Der Name wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: dann gehen Andreas und Philippus zu Jesus
  rationale: Das zweite historische Präsens wird bewahrt; „dann“ macht die im parataktischen Ablauf erkennbare zeitliche Folge verständlich. Das Ziel ergibt sich aus dem folgenden Dativ.
- source_word: λέγουσιν τῷ Ἰησοῦ
  choice: berichten es ihm
  rationale: Der Plural wird gewahrt. Das Pronomen nimmt Jesus als Empfänger auf und vermeidet eine im Deutschen schwerfällige Namenswiederholung.
- source_word: καί
  choice: und / dann
  rationale: Die erste Verbindung bleibt additiv; bei der zweiten wird die natürliche zeitliche Abfolge im Deutschen mit „dann“ ausgedrückt, ohne eine weitergehende logische Beziehung einzutragen.
- source_word: ὁ Φίλιππος
  choice: Philippus
  rationale: Der griechische Artikel vor dem Eigennamen wird im Deutschen nicht wiedergegeben; die traditionelle deutsche Namensform lautet „Philippus“.
- source_word: τῷ Ἰησοῦ
  choice: zu Jesus
  rationale: Der Dativ nennt den Empfänger beziehungsweise das Ziel der Bewegung. „Jesus“ ist die geläufige deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens des griechischen Textes wird durchgehend erhalten; die zweimalige Mitteilung wird zur Klarheit mit einem aus dem Kontext erschlossenen „es“ ausgedrückt.
