  source_fidelity: 'Der Entwurf bewahrt zutreffend die historischen Präsensformen und die Abfolge der Beteiligten. Er fügt jedoch mit „geht zu Andreas“ und „gehen … zu Jesus“ ausdrücklich Bewegungsziele ein, die der griechische Wortlaut nicht nennt: ἔρχεται bedeutet hier jeweils schlicht „kommt“. Auch „dann“ legt eine zeitliche Nuance stärker aus als das einfache καί.'
  naturalness: „Philippus kommt und sagt es Andreas; Andreas und Philippus kommen und sagen es Jesus“ ist modernes, verständliches Standarddeutsch und bildet die knappe parataktische Erzählweise natürlich nach. Das aus dem unmittelbaren Kontext erschlossene „es“ ist im Deutschen idiomatisch.
  terminology: Die traditionellen deutschen Namensformen „Philippus“, „Andreas“ und „Jesus“ sind angemessen. „Sagen“ gibt λέγει/λέγουσιν neutraler und enger wieder als „berichten“, das einen Berichtsvorgang nahelegen kann.
