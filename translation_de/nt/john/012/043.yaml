id: JHN.12.43
reference: John 12:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: de
  text: Denn sie liebten die Anerkennung der Menschen mehr als die Anerkennung Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Herrlichkeit der Menschen mehr als die Herrlichkeit Gottes“; auch: „die Ehre“ oder „das Ansehen“. Der Genitiv kann jeweils auch die Herkunft bezeichnen: „Anerkennung von Menschen“ beziehungsweise „von Gott“.'
    reason: Lexikalische und syntaktische Alternativen zu δόξα sowie zur Bedeutung der Genitive.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: sie liebten
  rationale: Der Aorist Aktiv Indikativ von ἀγαπάω bezeichnet hier eine starke Zuneigung bzw. bewusste Wertschätzung. „Liebten“ bewahrt die lexikalische Stärke und den johanneischen Sprachgebrauch; der Vergleich drückt zugleich die Bevorzugung aus.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage. „Denn“ stellt diese argumentative Verknüpfung im Deutschen knapp und natürlich her.
- source_word: δόξαν
  choice: Anerkennung
  rationale: δόξα kann Herrlichkeit, Ehre, Ansehen oder Anerkennung bezeichnen. Im Gegensatz zwischen Menschen und Gott bezeichnet „Anerkennung“ idiomatisch das erstrebte Ansehen bzw. die Billigung, ohne die Aussage auf bloßes Lob zu verengen. Da dasselbe Wort zweimal steht, wird auch im Deutschen dieselbe Wiedergabe verwendet.
- source_word: τῶν ἀνθρώπων
  choice: der Menschen
  rationale: ἄνθρωποι meint hier Menschen allgemein, nicht ausschließlich Männer. Der Genitiv bleibt bewusst offen zwischen zuerkannter Anerkennung und Anerkennung, die von Menschen ausgeht.
- source_word: μᾶλλον ἤπερ
  choice: mehr als
  rationale: Die Vergleichsformel bezeichnet eine stärkere Zuneigung bzw. Bevorzugung. „Mehr als“ bildet die graduelle Form des griechischen Ausdrucks unmittelbar ab.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird parallel zu „der Menschen“ wiedergegeben und lässt offen, ob Gottes Anerkennung als von ihm kommend oder ihm geltend verstanden wird.
theological_decisions:
- issue: Bedeutung von δόξα im Gegensatz zwischen Menschen und Gott
  choice: Anerkennung
  alternative: Herrlichkeit; Ehre; Ansehen
  rationale: Im unmittelbaren Zusammenhang geht es um das höhere Gewicht menschlicher gegenüber göttlicher Anerkennung. „Anerkennung“ ist im modernen Deutsch verständlich und wahrt den Parallelismus. Die Fußnote hält die weitere Bedeutung „Herrlichkeit“ und die damit verbundene johanneische Resonanz sichtbar.
- issue: Semantische Richtung der Genitive τῶν ἀνθρώπων und τοῦ θεοῦ
  choice: 'formaler Genitiv: „der Menschen“ / „Gottes“'
  alternative: „von Menschen“ / „von Gott“
  rationale: Die deutsche Genitivkonstruktion bewahrt die echte Mehrdeutigkeit zwischen Herkunft, Zuerkennung und Zugehörigkeit, statt sie stillschweigend auf die Quelle der Anerkennung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Der Menschen“ ist generisch und geschlechtsübergreifend. Der wiederholte Ausdruck „Anerkennung“ erhält den Parallelismus des griechischen Satzes.
