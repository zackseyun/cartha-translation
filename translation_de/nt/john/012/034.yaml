  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: de
  text: 'Da antwortete ihm die Menge: »Wir haben aus dem Gesetz gehört, dass der Messias für immer bleibt. Und wie kannst du sagen, dass der Menschensohn erhöht werden müsse[a]? Wer ist dieser Menschensohn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Höhe gehoben werden«. Im Johannesevangelium kann »erhöht werden« sowohl das körperliche Emporheben als auch die Erhöhung im Sinn der Verherrlichung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Da antwortete ihm die Menge
  rationale: „Da“ führt den Gedankengang natürlich fort und gibt die anschließende Reaktion wieder; „die Menge“ entspricht dem kollektiven ὁ ὄχλος.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Wir haben aus dem Gesetz gehört
  rationale: Das Perfekt ist im Deutschen für eine überlieferte, weiterhin maßgebliche Aussage natürlich; „aus dem Gesetz“ bewahrt die jüdische Schriftbezeichnung des griechischen Textes.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier eindeutig als Titel und wird daher mit dem im Deutschen verständlichen jüdischen Hoheitstitel „Messias“ wiedergegeben.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: für immer bleibt
  rationale: Die Formulierung gibt sowohl die Dauerhaftigkeit von μένει als auch die idiomatische Bedeutung von εἰς τὸν αἰῶνα klar wieder.
- source_word: πῶς λέγεις σὺ
  choice: Wie kannst du dann sagen
  rationale: Die Formulierung bringt den erstaunten Einwand der Menge idiomatisch zum Ausdruck; „dann“ macht den aus dem Zusammenhang hervorgehenden Gegensatz deutlich.
- source_word: δεῖ ὑψωθῆναι
  choice: müsse erhöht werden
  rationale: Der Konjunktiv I passt zur abhängigen Wiedergabe der Aussage Jesu. „Erhöht werden“ bewahrt im Johannesevangelium die Spannung zwischen physischem Emporheben und Erhöhung im Sinn der Verherrlichung.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe des titularen Ausdrucks und bewahrt seine biblischen Resonanzen.
theological_decisions:
- issue: Wiedergabe von ὁ χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Hier bezeichnet der Ausdruck die erwartete messianische Gestalt und ist klar als Titel gebraucht; „Messias“ macht den jüdischen Erwartungshorizont unmittelbar verständlich.
- issue: Mehrdeutigkeit von ὑψωθῆναι
  choice: erhöht werden
  alternative: emporgehoben werden
  rationale: „Erhöht werden“ kann im Deutschen sowohl eine räumliche Bewegung als auch Erhöhung im übertragenen Sinn bezeichnen und bewahrt damit die johanneische Doppelbedeutung, ohne sie einseitig auf Kreuzigung oder Verherrlichung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig und verständlich; traditionelle biblische Titel wie „Messias“ und „Menschensohn“ bleiben erhalten. Die indirekt zitierte Aussage wird mit „müsse“ idiomatisch markiert.
