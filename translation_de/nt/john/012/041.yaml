id: JHN.12.41
reference: John 12:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: de
  text: Jesaja sagte dies, weil er seine Herrlichkeit sah und über ihn sprach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Pronomen beziehen sich im Zusammenhang des Johannesevangeliums wahrscheinlich auf Jesus. Im Hintergrund steht jedoch Jesajas Vision von der Herrlichkeit des Herrn (Jesaja 6,1); daher ist auch ein allgemeinerer Bezug auf Gott möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: dies
  rationale: Das substantivisch gebrauchte „dies“ verweist im Deutschen natürlich auf die zuvor angeführten prophetischen Aussagen; ein wörtlicheres „diese Dinge“ wäre unnötig schwerfällig.
- source_word: εἶπεν
  choice: sagte
  rationale: Die einfache Vergangenheitsform gibt den Aorist von λέγω treffend wieder und lässt gegenüber dem späteren ἐλάλησεν eine leichte lexikalische Unterscheidung erkennen.
- source_word: Ἠσαΐας
  choice: Jesaja
  rationale: Gebräuchliche deutsche Namensform des Propheten.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι bezeichnet hier am natürlichsten den Grund dafür, dass Jesaja dies sagte. Die grammatisch mögliche Wiedergabe mit „dass“ passt weniger gut zum erklärenden Zusammenhang.
- source_word: εἶδεν
  choice: sah
  rationale: Direkte und natürliche Wiedergabe des Aorists von ὁράω.
- source_word: τὴν δόξαν αὐτοῦ
  choice: seine Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt das theologische Gewicht von δόξα im Johannesevangelium; das Pronomen bleibt wie im Griechischen unausdrücklich und wird nicht durch einen Namen ersetzt.
- source_word: ἐλάλησεν
  choice: sprach
  rationale: „Sprach“ gibt λαλέω würdig und idiomatisch wieder und unterscheidet es leicht vom vorangehenden εἶπεν („sagte“).
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: περί mit Genitiv bedeutet „über/über … betreffend“; „über ihn“ ist die natürliche moderne deutsche Formulierung.
theological_decisions:
- issue: Bezugswort der beiden Pronomen αὐτοῦ
  choice: Die Pronomen bleiben als „seine“ und „ihn“ stehen; im unmittelbaren johanneischen Zusammenhang beziehen sie sich wahrscheinlich auf Jesus.
  alternative: Die Pronomen können vor dem Hintergrund von Jesaja 6 allgemeiner auf Gott beziehungsweise den Herrn bezogen werden.
  rationale: Johannes wendet die Jesajaworte im unmittelbaren Kontext auf die Reaktion gegenüber Jesus an, sodass ein christologischer Bezug naheliegt. Da der griechische Text jedoch nur Pronomen verwendet und Jesaja 6 die Herrlichkeit des Herrn beschreibt, wird die sprachliche Mehrdeutigkeit im Haupttext bewahrt und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten; „dies“ vermeidet das unnatürliche „diese Dinge“. Die Fußnote bewahrt die echte Spannung beim Bezug der Pronomen, ohne sie im Haupttext durch eine ausdrückliche Namensnennung aufzulösen.
