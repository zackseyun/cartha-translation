  source_fidelity: Die Wiedergabe von βαΐα, ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, dem imperfektischen ἐκραύγαζον, dem Psalmzitat und dem Titel „König Israels“ ist im Wesentlichen treffend. „Und er ist der König Israels“ ergänzt jedoch ein finites Verb und gestaltet den letzten Nominalausdruck zu einer eigenständigen Behauptung um. Der griechische Ausdruck kann vielmehr als weiterer Teil der Akklamation bzw. als appositionelle Zuspitzung verstanden werden.
  naturalness: Die Übersetzung ist modernes, würdevolles Standarddeutsch. Die leicht elliptische Ausrufform „und der König Israels!“ ist in einer öffentlichen, psalmisch geprägten Akklamation verständlich und lässt die griechische Konstruktion offener als die eingefügte Formulierung „er ist“.
  terminology: „Palmzweige“, „Hosanna“, „im Namen des Herrn“ und „König Israels“ sind sachgerecht. Die Fußnote zu Hosanna erklärt sowohl die hebräische Grundbedeutung als auch die spätere akklamatorische Funktion angemessen.
