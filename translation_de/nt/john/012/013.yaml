source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: de
  text: 'Sie nahmen Palmzweige und gingen hinaus, ihm entgegen. Dabei riefen sie immer wieder: „Hosanna![a] Gesegnet sei, der im Namen des Herrn kommt![b] Und der König Israels!“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hosanna“ geht auf einen hebräischen Ruf zurück, der „Hilf doch!“ oder „Rette doch!“ bedeutet; zur damaligen Zeit diente er auch als Jubel- und Lobpreisruf.
    reason: lexical_alternative
  - marker: b
    text: Diese Worte greifen Psalm 118,26 auf.
    reason: cross_reference
  - marker: c
    text: 'Oder: „ja, der König Israels!“'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: Palmzweige
  rationale: Die kompakte deutsche Bezeichnung gibt die Zweige der Palmen natürlich und genau wieder.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: gingen hinaus, ihm entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen zur Begegnung; „entgegen“ bewahrt dies, ohne den zusätzlichen Gedanken des Willkommenheißens einzutragen.
- source_word: ἐκραύγαζον
  choice: riefen sie immer wieder
  rationale: Die Form im Imperfekt beschreibt ein anhaltendes oder wiederholtes Rufen.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Der eingebürgerte liturgische Ruf wird transliteriert; sein hebräischer Ursprungssinn wird in einer Fußnote erläutert.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Gesegnet sei, der … kommt
  rationale: Diese im Deutschen natürliche Akklamationsform bewahrt das substantivierte Partizip und den Anklang an Psalm 118,26.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die feste biblische Wendung bildet den griechischen Ausdruck formal und verständlich ab.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: Und er ist der König Israels
  rationale: Das explizite „Und“ bewahrt καί und gibt die königliche Akklamation im Deutschen klar wieder; die mögliche appositionelle Verknüpfung wird in der Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe von κύριος im Psalmzitat
  choice: Herr
  alternative: HERR
  rationale: Der griechische Ausgangstext hat κύριος. „Herr“ bildet ihn unmittelbar ab; „HERR“ würde zusätzlich die hebräische Gottesnamenskonvention des zitierten Psalms markieren.
- issue: Verknüpfung des Königstitels durch καί
  choice: Und er ist der König Israels
  alternative: ja, der König Israels
  rationale: καί kann koordinierend („und“) oder hier erläuternd beziehungsweise steigernd verstanden werden. Der Haupttext wahrt die formale Koordination, während die Fußnote die appositionelle Möglichkeit nennt.
- issue: Königliche und messianische Aussage der Akklamation
  choice: den Titel „König Israels“ ungekürzt beibehalten
  alternative: Israels König
  rationale: Der Text nennt den königlichen Titel ausdrücklich; die Übersetzung bewahrt ihn, ohne ihn theologisch zu erweitern oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anhaltende Wirkung des Imperfekts wird mit „immer wieder“ ausgedrückt. Die Ausrufezeichen spiegeln den Charakter der öffentlichen Akklamation wider; echte Mehrdeutigkeit bei καί bleibt durch die Fußnote erhalten.
