source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: de
  text: 'Und ich weiß: Sein Gebot ist ewiges Leben. Was ich also sage, das sage ich so, wie der Vater mir gesagt hat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: Gebot
  rationale: „Gebot“ entspricht dem autoritativen Charakter von ἐντολή und ist im modernen Deutschen natürlicher als „Gebotswort“ oder „Anweisung“, ohne die Aussage abzuschwächen.
- source_word: ζωὴ αἰώνιος
  choice: ewiges Leben
  rationale: Dies ist die etablierte und sachlich angemessene Wiedergabe der johanneischen Wendung; sie bewahrt sowohl den zeitlichen als auch den heilsgeschichtlichen Gehalt.
- source_word: ἃ
  choice: Was
  rationale: Das substantivisch gebrauchte neutrale Relativpronomen wird im Deutschen idiomatisch mit „was“ wiedergegeben; das aufnehmende „das“ im Hauptsatz macht die Konstruktion klar.
- source_word: λαλῶ
  choice: sage
  rationale: „Sagen“ klingt hier im Deutschen natürlicher als das wörtlichere „reden“. Die Wiederholung in beiden Vorkommen bewahrt die rhetorische Parallelität des Griechischen.
- source_word: καθώς
  choice: so, wie
  rationale: Die Korrespondenzformel „so, wie“ gibt den genauen Zusammenhang zwischen dem Auftrag des Vaters und Jesu Worten klar und idiomatisch wieder.
- source_word: εἴρηκέν μοι
  choice: es mir aufgetragen hat
  rationale: Im Zusammenhang mit dem zuvor genannten Gebot bezeichnet das Perfekt eine weiterhin maßgebliche Mitteilung des Vaters. „Aufgetragen hat“ bringt deren autoritativen Charakter natürlich zum Ausdruck, ohne dem Inhalt etwas hinzuzufügen.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Der bestimmte Artikel und der johanneische Beziehungstitel werden direkt bewahrt; „mein Vater“ wäre eine nicht ausdrücklich im Text stehende Ergänzung.
- source_word: οὖν
  choice: also
  rationale: „Also“ markiert die Folgerung aus dem vorangehenden Satz in natürlichem, würdigem Deutsch.
- source_word: οἶδα
  choice: ich weiß
  rationale: Dies ist die direkte, idiomatische Wiedergabe und bewahrt die Gewissheit der Aussage.
theological_decisions:
- issue: Bedeutung von „sein Gebot ist ewiges Leben“
  choice: 'Die direkte Gleichsetzung bleibt im Haupttext erhalten: „Sein Gebot ist ewiges Leben.“'
  alternative: „Sein Gebot führt zum ewigen Leben“ oder „Sein Gebot betrifft das ewige Leben.“
  rationale: Das Griechische verwendet eine direkte Kopulakonstruktion. Eine kausale oder inhaltliche Umschreibung würde die echte Offenheit der Aussage enger festlegen, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Doppelpunkt nach „ich weiß“ führt die inhaltliche Aussage klar ein. Die Wiederholung „sage ... sage“ bildet die Wiederholung von λαλῶ ab; „so, wie“ bewahrt die korrelative Struktur.
