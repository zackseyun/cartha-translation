  source_fidelity: 'Die direkte Aussage „sein Gebot ist ewiges Leben“ gibt die griechische Kopulakonstruktion angemessen wieder und bewahrt ihre Auslegungsweite. Die Wiedergabe von εἴρηκέν μοι mit „es mir aufgetragen hat“ ist jedoch zu stark: Das Verb λέγω bezeichnet hier zunächst, dass der Vater zu Jesus gesprochen bzw. ihm etwas gesagt hat; ein ausdrücklicher Auftrag ist nicht im Wortlaut enthalten.'
  naturalness: Der Satzbau ist modernes, würdiges Standarddeutsch. „Was ich also sage, das sage ich so, wie ...“ bewahrt die Wiederholung und ist idiomatisch. „Mir gesagt hat“ ist hier natürlicher und genauer als „es mir aufgetragen hat“.
  terminology: „Gebot“, „ewiges Leben“ und „der Vater“ sind treffend und entsprechen dem johanneischen Sprachgebrauch. Die Wiederholung von „sage“ bildet λαλῶ konsequent ab.
