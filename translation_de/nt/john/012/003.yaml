id: JHN.12.3
reference: John 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: de
  text: Da nahm Maria eine Litra[a] kostbares Duftöl aus reiner Narde[b], salbte Jesus die Füße und wischte seine Füße mit ihrem Haar ab. Das Haus aber wurde vom Duft des Öls erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Litra war eine römische Gewichtseinheit von etwa 327 Gramm.
    reason: cultural_note
  - marker: b
    text: 'Oder: „aus echter Narde“. Die genaue Bedeutung des mit „rein“ übersetzten griechischen Wortes πιστικῆς ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Fortführung der Erzählung und knüpft natürlich an die vorherige Szene an, ohne eine stärkere logische Folgerung zu behaupten.
- source_word: λαβοῦσα
  choice: nahm
  rationale: Das vorzeitige Aoristpartizip wird in natürlichem deutschem Erzählstil als finites Verb wiedergegeben.
- source_word: λίτραν
  choice: eine Litra
  rationale: Die Transliteration bewahrt die antike römische Gewichtseinheit; ihr ungefährer moderner Wert wird in einer Fußnote erklärt.
- source_word: μύρου νάρδου
  choice: Duftöl aus … Narde
  rationale: μύρον bezeichnet hier ein wohlriechendes Öl beziehungsweise Salböl; νάρδος benennt den aromatischen Grundstoff. Die Formulierung ist im modernen Deutschen verständlich und sachlich präzise.
- source_word: πιστικῆς
  choice: reiner
  rationale: Das seltene Adjektiv ist lexikalisch umstritten. „Rein“ gibt eine verbreitete Deutung wieder; die mögliche Bedeutung „echt/unverfälscht“ bleibt in der Fußnote sichtbar.
- source_word: πολυτίμου
  choice: kostbares
  rationale: Gibt den hohen materiellen Wert idiomatisch wieder und passt zum erzählerischen Nachdruck auf den Wert des Öls.
- source_word: ἤλειψεν
  choice: salbte
  rationale: Bezeichnet das Auftragen des Duftöls und erhält mögliche symbolische Resonanzen, ohne eine bestimmte sakramentale oder königliche Deutung festzulegen.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: wischte … mit ihrem Haar ab
  rationale: Gibt sowohl die Handlung des Abwischens als auch das instrumentale Dativgefüge klar und natürlich wieder.
- source_word: ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: Das Haus aber erfüllte sich mit dem Duft des Öls
  rationale: Bewahrt den Kontrast beziehungsweise Erzählungsfortgang durch „aber“ und gibt die Ausbreitung des Duftes im ganzen Haus idiomatisch wieder.
theological_decisions:
- issue: Mögliche theologische Überdeutung des Salbens
  choice: ἤλειψεν wird mit „salbte“ wiedergegeben, ohne die Handlung ausdrücklich als sakramental, königlich oder messianisch zu deuten.
  alternative: „trug das Duftöl auf“
  rationale: „Salben“ ist lexikalisch und kontextuell angemessen und lässt die mögliche Symbolik bestehen, ohne sie über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antike Maßeinheit bleibt erhalten und wird erklärt. Die Wiederholung von „seine Füße“ folgt dem griechischen Text und hält den Bezug eindeutig; die umstrittene Bedeutung von πιστικῆς wird nicht verschwiegen.
