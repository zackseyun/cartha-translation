  variant: modern standard German
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: de
  text: Jetzt ist meine Seele erschüttert, und was soll ich sagen?[a] Vater, rette mich aus dieser Stunde. Doch gerade deshalb bin ich in diese Stunde gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was soll ich sagen: ‚Vater, rette mich aus dieser Stunde‘?“ Da die ursprünglichen griechischen Handschriften keine Interpunktion boten, kann dies auch als rhetorische Frage statt als unmittelbare Bitte gelesen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Jetzt
  rationale: Das temporale Adverb bezeichnet die Unmittelbarkeit von Jesu gegenwärtiger Erschütterung; „Jetzt“ ist direkt und natürlich.
- source_word: ἡ ψυχή μου
  choice: meine Seele
  rationale: ψυχή bezeichnet hier Jesu inneres Leben beziehungsweise seine Person in Bedrängnis. „Seele“ bewahrt die feierliche und anthropologische Ausdrucksweise, ohne sie auszudeuten.
- source_word: τετάρακται
  choice: ist erschüttert
  rationale: Das Perfekt bezeichnet einen gegenwärtigen Zustand infolge einer Erschütterung. „Ist erschüttert“ gibt die starke innere Unruhe prägnant wieder und greift den johanneischen Wortgebrauch angemessen auf.
- source_word: τί εἴπω
  choice: was soll ich sagen?
  rationale: Der deliberative Konjunktiv drückt erwägendes Fragen aus; die deutsche Formulierung ist modern und erhält diese Offenheit.
- source_word: πάτερ
  choice: Vater
  rationale: Die unmittelbare Anrede Gottes wird im Deutschen natürlich mit „Vater“ wiedergegeben.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: rette mich aus dieser Stunde
  rationale: Der Imperativ σῶσον und ἐκ bezeichnen Rettung beziehungsweise Herausrettung aus der bevorstehenden Bedrängnis. „Aus dieser Stunde“ folgt der räumlich geprägten griechischen Wendung und wahrt das johanneische Motiv.
- source_word: ὥρα
  choice: Stunde
  rationale: „Stunde“ bewahrt den bei Johannes theologisch gewichtigen Ausdruck für die festgesetzte Zeit von Jesu Leiden, Tod und Verherrlichung.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Doch gerade deshalb
  rationale: ἀλλά setzt einen deutlichen Gegensatz, während διὰ τοῦτο rückbezüglich Grund beziehungsweise Zweck ausdrückt. „Gerade deshalb“ stellt den Zusammenhang idiomatisch heraus, ohne ihn enger als nötig festzulegen.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: bin ich in diese Stunde gekommen
  rationale: Das deutsche Perfekt klingt in gegenwärtiger Rede natürlich; „in diese Stunde“ bildet εἰς ab und bewahrt das Bild des Eintretens in den entscheidenden Zeitpunkt, ohne εἰς ausdrücklich als „für“ zu deuten.
theological_decisions:
- issue: Ob „Vater, rette mich aus dieser Stunde“ als unmittelbare Bitte oder als Teil einer rhetorischen Frage zu lesen ist
  choice: 'Als unmittelbare Bitte: „Vater, rette mich aus dieser Stunde.“'
  alternative: 'Als rhetorische, verworfene Möglichkeit: „Was soll ich sagen: ‚Vater, rette mich aus dieser Stunde‘?“'
  rationale: Die ursprünglichen Handschriften legen die Interpunktion nicht fest. Die Zeichensetzung des SBLGNT liest den Satz als Bitte, auf die eine kontrastierende Aussage folgt. Diese Wiedergabe lässt die Spannung zwischen Jesu Erschütterung und seiner bewussten Annahme der Stunde bestehen; die andere syntaktische Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Seele“ und „Stunde“ erhalten die gewichtige johanneische Ausdrucksweise; „erschüttert“ vermittelt die anhaltende innere Unruhe. Die Satzstruktur bleibt eng am Griechischen, ohne im Deutschen unnatürlich zu wirken.
