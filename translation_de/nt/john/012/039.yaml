  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: de
  text: 'Deshalb konnten sie nicht glauben, weil Jesaja wiederum sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Aus diesem Grund
  rationale: Die Wendung bezeichnet ausdrücklich den Grund bzw. die Ursache und knüpft klar an den vorausgehenden Zusammenhang an.
- source_word: οὐκ ἠδύναντο
  choice: konnten sie nicht
  rationale: Die idiomatische deutsche Form gibt die im Imperfekt ausgedrückte Unfähigkeit direkt wieder, ohne sie zu bloßer Unwilligkeit abzuschwächen.
- source_word: πιστεύειν
  choice: glauben
  rationale: Das Verb ist im johanneischen Sprachgebrauch und in dieser Konstruktion am natürlichsten mit „glauben“ wiederzugeben.
- source_word: ὅτι
  choice: denn
  rationale: Hier leitet ὅτι die Begründung der zuvor genannten Unfähigkeit ein. „Denn“ bildet den deutschen Satzanschluss natürlich ab; „weil“ wäre wegen des folgenden vorangestellten Zitats syntaktisch schwerfälliger.
- source_word: πάλιν
  choice: an anderer Stelle
  rationale: πάλιν kennzeichnet hier eine weitere Aussage bzw. Schriftstelle desselben Propheten nach dem unmittelbar vorausgehenden Jesaja-Zitat. „An anderer Stelle“ macht diese diskursive Funktion im Deutschen klarer als ein potenziell missverständliches „wieder“.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche und genaue Wiedergabe der Einleitungsformel für ein Zitat lautet „sagte“.
- source_word: Ἠσαΐας
  choice: Jesaja
  rationale: Verwendet wird die im modernen Standarddeutsch etablierte Namensform.
theological_decisions:
- issue: Art der genannten Unfähigkeit zu glauben
  choice: „konnten sie nicht glauben“ bewahrt die ausdrücklich formulierte Unfähigkeit, ohne ihren theologischen Mechanismus näher zu bestimmen.
  alternative: „wollten sie nicht glauben“ oder eine ausdrückliche Einordnung in ein bestimmtes Lehrsystem
  rationale: Der griechische Text spricht von Unfähigkeit und nicht lediglich von fehlender Bereitschaft. Zugleich erklärt dieser Vers für sich allein nicht abschließend, wie göttliche Verstockung und menschliche Verantwortung zueinander stehen; diese Spannung darf die Übersetzung nicht auflösen.
- issue: Bezug von ὅτι
  choice: ὅτι wird kausal als „denn“ verstanden und leitet die folgende Jesaja-Aussage als Begründung ein.
  alternative: ὅτι als rein inhaltliches „dass“ auffassen
  rationale: Im Zusammenhang kündigt der Satz eine weitere Jesaja-Stelle an, die begründet, weshalb sie nicht glauben konnten. Die kausale Lesart entspricht dem unmittelbaren Argumentationsgang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist natürlich und verständlich; der Doppelpunkt bleibt erhalten, da der folgende Vers das angekündigte Jesaja-Zitat enthält.
