  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: de
  text: Wer sein Leben[a] liebt, verliert es; wer sein Leben in dieser Welt hasst[b], wird es zum ewigen Leben bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Seele“ beziehungsweise „sich selbst“. Das griechische ψυχή kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: '„Sein Leben … hasst“ ist eine bewusste paradoxe Zuspitzung: Gemeint ist die Absage an das Festhalten am eigenen Leben innerhalb der gegenwärtigen Weltordnung, nicht Selbsthass. Eine ähnlich starke Ausdrucksweise findet sich in Lukas 14,26.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: wer … liebt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, auf den die Aussage zutrifft. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn natürlich und knapp wieder.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang von Verlieren und Bewahren vor allem das eigene Leben beziehungsweise Selbst, nicht ausdrücklich eine vom Körper getrennte Seele. „Sein Leben“ bewahrt zudem den generischen Singular.
- source_word: ἀπολλύει
  choice: verliert
  rationale: Das Präsens steht pointiert dem zukünftigen Bewahren gegenüber. Mit „Leben“ als Objekt ist „verliert“ im Deutschen idiomatisch; „vernichtet“ würde eine stärker aktive Bedeutung nahelegen.
- source_word: ὁ μισῶν
  choice: wer … hasst
  rationale: Das starke Verb μισέω und die beabsichtigte paradoxe Zuspitzung werden nicht zu „weniger liebt“ abgeschwächt.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: in dieser Welt
  rationale: Die Wendung begrenzt die Aussage auf das Leben innerhalb der gegenwärtigen Weltordnung und entspricht dem johanneischen Kontrast zu den ewigen Wirklichkeiten.
- source_word: φυλάξει
  choice: wird … bewahren
  rationale: Das Futur wird ausdrücklich wiedergegeben. „Bewahren“ erfasst den Sinn des Erhaltens und bildet einen klaren Gegensatz zu „verliert“.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. „Zum ewigen Leben“ gibt diese Zielrichtung in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von „sein Leben hasst“
  choice: Die schroffe Formulierung bleibt als „sein Leben … hasst“ erhalten und bezeichnet im Kontext die Absage an das Festhalten am eigenen Leben in dieser Welt.
  alternative: „sein Leben weniger liebt“ oder „sein Leben gering achtet“
  rationale: Das griechische μισέω ist stark, und die paradoxe Spannung soll im Haupttext nicht aufgelöst werden. Der Zusatz „in dieser Welt“ zeigt, dass weder Selbstverachtung noch eine Verneinung des Wertes menschlichen Lebens gefordert wird.
- issue: Wiedergabe von ψυχή
  choice: „Leben“ in beiden Satzhälften
  alternative: „Seele“ oder „Selbst“
  rationale: Der unmittelbare Zusammenhang handelt vom Verlieren und Bewahren des eigenen Lebens. „Seele“ könnte eine bestimmte anthropologische Trennung nahelegen, die der Vers selbst nicht festlegt; die Bedeutungsbreite wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, prägnantem Satzbau. Die parallele Wer-Konstruktion bildet die griechischen substantivierten Partizipien natürlich ab; „hasst“ bewahrt bewusst die rhetorische Härte des Originals.
