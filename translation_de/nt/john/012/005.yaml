  variant: modern standard German
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: de
  text: Warum wurde dieses Salböl nicht für dreihundert Denare verkauft und der Erlös den Armen gegeben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar entsprach dem üblichen Tageslohn eines Arbeiters; dreihundert Denare waren ungefähr der Verdienst eines Jahres, wenn man arbeitsfreie Tage berücksichtigt.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Warum
  rationale: Die knappe Frageform gibt die idiomatische Bedeutung »warum?« im modernen Deutschen unmittelbar wieder.
- source_word: μύρον
  choice: Salböl
  rationale: Das Wort bezeichnet hier ein kostbares, duftendes Öl beziehungsweise eine Salbe; »Salböl« passt zum Vorgang der Salbung im Kontext und ist im Deutschen verständlich.
- source_word: οὐκ ἐπράθη
  choice: wurde … nicht … verkauft
  rationale: Die passive Form und der vorwurfsvolle Charakter der rhetorischen Frage bleiben erhalten.
- source_word: τριακοσίων δηναρίων
  choice: für dreihundert Denare
  rationale: Der Genitiv bezeichnet den Preis. Die historische Währung wird im Haupttext bewahrt und in der Fußnote erläutert.
- source_word: καὶ ἐδόθη
  choice: und der Erlös … gegeben
  rationale: Im Griechischen ist das, was den Armen gegeben werden sollte, ausgelassen und aus dem Verkauf zu erschließen. »Der Erlös« macht diese notwendige Ellipse im Deutschen klar, ohne den Sinn weiter auszudeuten.
- source_word: πτωχοῖς
  choice: den Armen
  rationale: Die substantivierte Bezeichnung wird mit der geläufigen und ebenso allgemeinen deutschen Sozialbezeichnung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die passive rhetorische Frage bleibt erhalten; die im Griechischen vorausgesetzte Verwendung des Verkaufserlöses wird für ein natürliches und eindeutiges Deutsch ausdrücklich benannt.
