id: JHN.12.40
reference: John 12:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: de
  text: Er hat ihre Augen blind gemacht und ihr Herz verhärtet, damit sie nicht mit den Augen sehen, mit dem Herzen verstehen und umkehren[a] und ich sie heile.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich bekehren; wörtlich auch: sich wenden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen die Zukunftsform: „und ich sie heilen werde“. Im Zusammenhang kann sie im Deutschen auch als „und ich sie heilen würde“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: Diese Worte greifen Jesaja 6,10 auf.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: hat … blind gemacht
  rationale: Das griechische Perfekt bezeichnet eine vollzogene Handlung mit fortdauerndem Ergebnis. Das deutsche Perfekt bewahrt diesen Aspekt, während „blind gemacht“ die konkrete Bildsprache von τυφλόω wiedergibt.
- source_word: ἐπώρωσεν
  choice: verhärtet
  rationale: πωρόω bezeichnet hier ein Hart- beziehungsweise Unempfindlichmachen. „Verhärtet“ ist im Deutschen natürlich und erhält den prophetischen Gedanken des Gerichts.
- source_word: καρδίαν / καρδίᾳ
  choice: Herz / mit dem Herzen
  rationale: „Herz“ bewahrt die biblische Rede vom inneren Menschen; die geistige Dimension wird durch „verstehen“ deutlich. Der Singular bleibt als kollektive Form erhalten.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Wendung kann Zweck oder Folge ausdrücken. „Damit … nicht“ erhält diese Spannung in verständlichem modernem Deutsch, ohne die schwierige Aussage abzuschwächen.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: mit den Augen sehen
  rationale: Die konkrete Formulierung wahrt den Parallelismus zu „mit dem Herzen verstehen“.
- source_word: νοήσωσιν
  choice: verstehen
  rationale: νοέω bezeichnet geistiges Erfassen. „Verstehen“ ist hier klar und idiomatisch.
- source_word: στραφῶσιν
  choice: umkehren
  rationale: Die passive Form kann in diesem Zusammenhang intransitiv als Rück- oder Umkehr verstanden werden. „Umkehren“ bewahrt den prophetischen Sprachgebrauch und ist weniger konfessionell festgelegt als „bekehrt werden“.
- source_word: ἰάσομαι
  choice: ich sie heile
  rationale: Die griechische Form ist formal Futur. Im Deutschen gibt das Präsens innerhalb der abhängigen Zweck-/Folgekonstruktion den Zusammenhang natürlicher wieder; die formale Zukunftsbedeutung wird in einer Fußnote genannt.
theological_decisions:
- issue: Göttliches Handeln beim Blindmachen und Verhärten
  choice: 'Das ausdrückliche Subjekt bleibt erhalten: „Er hat … blind gemacht und … verhärtet“.'
  alternative: Unpersönliche oder passive Formulierungen, die das göttliche Handeln abschwächen.
  rationale: Die griechischen Verben haben ein ausdrückliches, aus dem Zitatkontext erschließbares Subjekt. Die theologische Spannung der gerichtlichen Verhärtung darf nicht geglättet werden.
- issue: Bedeutung von στραφῶσιν
  choice: „umkehren“
  alternative: „bekehrt werden“
  rationale: „Umkehren“ bringt den Gedanken der Hinwendung beziehungsweise Rückkehr zum Ausdruck, ohne die grammatische und theologische Aussage konfessionell zu verengen.
- issue: Wiedergabe von ἰάσομαι im Zweck-/Folgezusammenhang
  choice: „und ich sie heile“
  alternative: „und ich sie heilen werde“ oder „und ich sie heilen würde“
  rationale: Das Präsens ist in der deutschen abhängigen Konstruktion idiomatisch und hält die Aussage offen. Eine wörtliche Zukunftsform klingt schwerfällig; „würde“ könnte stärker als der griechische Text eine Irrealität ausdrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wendungen „mit den Augen sehen“ und „mit dem Herzen verstehen“ bleiben erhalten. Der kollektive Singular „ihr Herz“ folgt dem griechischen Text. Die harte Aussage über göttliches Blindmachen und Verhärten wird nicht abgeschwächt.
