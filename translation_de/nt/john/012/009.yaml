  terminology: „Juden“ ist im Haupttext eine vertretbare, kontextuell naheliegende Wiedergabe von Ἰουδαίων. Die Fußnote bewahrt sachgerecht die mögliche geografisch-regionale Nuance „Judäer“, ohne sie dem Text aufzuzwingen. „von den Toten auferweckt“ gibt ἐκ νεκρῶν idiomatisch und theologisch unvoreingenommen wieder.
