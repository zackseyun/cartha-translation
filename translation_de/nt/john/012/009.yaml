  source_fidelity: 'Der Entwurf gibt die zentralen Sinnelemente des griechischen Textes zuverlässig wieder: das Bekanntwerden (ἔγνω), die große Volksmenge, die partitive Herkunftsangabe ἐκ τῶν Ἰουδαίων, Jesu Anwesenheit, die beiden Beweggründe des Kommens sowie den Zweck, Lazarus zu sehen. Das Plusquamperfekt bei „auferweckt hatte“ ist im deutschen Erzählzusammenhang angemessen und macht die Vorzeitigkeit deutlich.'
