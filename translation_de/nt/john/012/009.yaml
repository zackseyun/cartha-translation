id: JHN.12.9
reference: John 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: de
  text: Daraufhin erfuhr eine große Menschenmenge aus den Reihen der Juden[a], dass Jesus dort war. Sie kamen nicht nur wegen Jesus, sondern auch, um Lazarus zu sehen, den er von den Toten auferweckt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Reihen der Judäer“. Das griechische Wort kann sowohl jüdische Menschen allgemein als auch, in manchen Zusammenhängen des Johannesevangeliums, speziell Judäer bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: erfuhr
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erlangen einer Information; „erfuhr“ ist im deutschen Erzählstil natürlich.
- source_word: οὖν
  choice: Daraufhin
  rationale: Das Wort verbindet den Vers folgernd mit dem vorherigen Geschehen und führt zugleich die Erzählung weiter.
- source_word: ὄχλος πολὺς
  choice: eine große Menschenmenge
  rationale: Bewahrt den kollektiven Singular und die Größenangabe in verständlichem modernem Deutsch.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: aus den Reihen der Juden
  rationale: Gibt ἐκ ausdrücklich als Zugehörigkeit beziehungsweise Herkunft aus einer größeren Gruppe wieder, ohne die Menge mit allen Juden gleichzusetzen.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: dass Jesus dort war
  rationale: Das im Griechischen unausgesprochene Subjekt wird aus dem Kontext als Jesus verdeutlicht; „war“ entspricht der natürlichen deutschen Zeitenfolge nach „erfuhr“.
- source_word: ἦλθον
  choice: Sie kamen
  rationale: Entspricht der szenischen Perspektive des griechischen ἦλθον.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: nicht nur wegen Jesus
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund; „wegen“ ist prägnant und idiomatisch.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: sondern auch, um ... zu sehen
  rationale: Die deutsche Infinitivkonstruktion bewahrt sowohl den Gegensatz als auch den Zweck des griechischen ἵνα-Satzes.
- source_word: Λάζαρον
  choice: Lazarus
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: den er von den Toten auferweckt hatte
  rationale: „Auferweckt“ gibt die Wiederbelebung durch ἐγείρω wieder; das Plusquamperfekt verdeutlicht, dass dies vor dem Kommen der Menge geschehen war.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων im Johannesevangelium
  choice: aus den Reihen der Juden
  alternative: aus den Reihen der Judäer
  rationale: Ἰουδαῖοι kann jüdische Menschen allgemein oder, je nach Kontext, Judäer bezeichnen. Der Haupttext verwendet die geläufige ethnisch-religiöse Bezeichnung, während die mögliche geografische Bedeutung in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit. „Menschenmenge“ vermeidet die mögliche Nebenbedeutung einer ungeordneten „Menge“; die Formulierung „aus den Reihen“ macht den partitiven Sinn von ἐκ deutlich.
