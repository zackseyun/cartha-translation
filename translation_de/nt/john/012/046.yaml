id: JHN.12.46
reference: John 12:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: de
  text: Ich bin als Licht[a] in die Welt gekommen, damit jeder, der an mich glaubt, nicht in der Finsternis bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein Licht“. Das griechische Wort steht ohne Artikel und kann sowohl qualitativ („als Licht“) als auch unbestimmt („als ein Licht“) verstanden werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: φῶς
  choice: als Licht
  rationale: Das artikellose φῶς ist hier am besten qualitativ zu verstehen. „Als Licht“ bewahrt die johanneische Metapher und beschreibt Jesu Identität und Wirken, ohne sie erklärend aufzulösen.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: εἰς mit Akkusativ bezeichnet die Bewegung in einen Bereich hinein; die deutsche Wendung gibt den Gedanken des Kommens in die Welt natürlich wieder.
- source_word: ἐλήλυθα
  choice: bin … gekommen
  rationale: Das Perfekt hebt das vollzogene Kommen mit fortdauernder Bedeutung hervor. Das deutsche Perfekt ist zugleich idiomatisch und aspektuell passend.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck des Kommens klar und in natürlichem modernem Deutsch wieder.
- source_word: πᾶς ὁ πιστεύων
  choice: jeder, der … glaubt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Menschen, auf den das Glauben zutrifft. Die gewählte Formulierung ist präzise und idiomatisch.
- source_word: πιστεύων εἰς ἐμέ
  choice: an mich glaubt
  rationale: πιστεύω mit εἰς und einer Person als Bezugsgröße bezeichnet im Johannesevangelium auf Jesus gerichteten Glauben beziehungsweise Vertrauen. „An mich glaubt“ ist dafür die etablierte, natürliche deutsche Wiedergabe.
- source_word: ἐν τῇ σκοτίᾳ
  choice: in der Finsternis
  rationale: Der Artikel und der johanneische Kontext stellen die Finsternis als bestimmten geistlich-moralischen Bereich dar. „In der Finsternis“ bewahrt diese Bildwelt.
- source_word: μὴ μείνῃ
  choice: nicht … bleibt
  rationale: Der Aorist Konjunktiv mit μή nach ἵνα drückt den verneinten Zweck beziehungsweise beabsichtigten Ausgang aus. „Nicht … bleibt“ gibt das Verharren in diesem Zustand knapp und natürlich wieder.
theological_decisions:
- issue: Christologische Selbstaussage im Lichtmotiv
  choice: Jesus sagt, dass er „als Licht“ in die Welt gekommen ist.
  alternative: „als ein Licht“ oder erklärend „um der Welt Licht zu bringen“
  rationale: Die Übersetzung bewahrt die unmittelbare Selbstaussage und die johanneische Lichtmetapher, ohne sie durch eine dogmatische oder funktionale Erläuterung zu ersetzen. Die mögliche qualitative beziehungsweise unbestimmte Nuance wird in der Fußnote offengehalten.
- issue: Reichweite von πᾶς ὁ πιστεύων
  choice: „jeder, der an mich glaubt“
  alternative: „wer an mich glaubt“
  rationale: Die Formulierung gibt die umfassende Klasse der Glaubenden wieder, ohne weitergehende Aussagen darüber einzutragen, wie Glaube zustande kommt oder wie er sich zu bestimmten Lehrsystemen verhält.
- issue: Zweck des Kommens und Verbleiben in der Finsternis
  choice: „damit … nicht in der Finsternis bleibt“
  alternative: „sodass … nicht in der Finsternis bleibt“
  rationale: ἵνα hat hier primär finale Kraft. „Damit“ bewahrt die Aussage über den Zweck von Jesu Kommen, ohne einen darüber hinausgehenden Heilsautomatismus zu formulieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Finsternis“ wurde gegenüber „Dunkelheit“ gewählt, weil es die etablierte johanneische Bildsprache und ihren geistlich-moralischen Gehalt prägnant bewahrt.
