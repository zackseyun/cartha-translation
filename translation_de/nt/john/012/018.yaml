id: JHN.12.18
reference: John 12:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: de
  text: Aus diesem Grund ging ihm auch die Menge entgegen[a], denn sie hatte gehört, dass er dieses Zeichen getan hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „traf ihn“ beziehungsweise „kam ihm entgegen“. Das griechische Verb kann ausdrücken, dass man aufbricht, um jemanden zu treffen.'
    reason: lexical_alternative
  - marker: b
    text: '„Zeichen“ ist bei Johannes eine charakteristische Bezeichnung für eine machtvolle Tat, die über sich hinaus auf Jesu Identität und Sendung weist; auch: „Wunder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Aus diesem Grund
  rationale: Die Wendung mit διά und Akkusativ bezeichnet ausdrücklich den Grund und knüpft kausal an den vorausgehenden Zusammenhang an.
- source_word: καὶ
  choice: auch
  rationale: Das additive καί wird natürlich wiedergegeben, ohne es stärker als im Griechischen zu gewichten.
- source_word: ὑπήντησεν αὐτῷ
  choice: ging ihm entgegen
  rationale: ὑπαντάω bezeichnet das Entgegengehen, um jemanden zu treffen; die deutsche Wendung bewahrt diese Bewegungsrichtung knapp und idiomatisch.
- source_word: ὁ ὄχλος
  choice: die Menge
  rationale: ὄχλος bezeichnet hier die versammelte Menschenmenge; „die Menge“ ist im modernen Deutschen natürlich und kontextgerecht.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier die Begründung für das Handeln der Menge ein. „Denn“ bildet diesen Zusammenhang in einem flüssigen deutschen Hauptsatz ab.
- source_word: ἤκουσαν
  choice: sie hatte gehört
  rationale: Das deutsche Plusquamperfekt macht natürlich deutlich, dass das Hören dem Entgegengehen vorausging, ohne dem Aorist eine zusätzliche inhaltliche Nuance aufzuzwingen.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: dass er dieses Zeichen getan hatte
  rationale: Die Konstruktion des indirekten Diskurses wird idiomatisch mit einem dass-Satz wiedergegeben; der Demonstrativbezug und die vorzeitige, vollendete Handlung bleiben erhalten.
- source_word: τὸ σημεῖον
  choice: dieses Zeichen
  rationale: „Zeichen“ bewahrt den für Johannes charakteristischen Ausdruck für eine machtvolle Tat, die über sich hinaus auf Jesu Identität und Sendung weist.
theological_decisions:
- issue: Wiedergabe des johanneischen σημεῖον
  choice: Zeichen
  alternative: Wunder
  rationale: „Zeichen“ erhält die offenbarende Dimension des johanneischen Begriffs und reduziert die Tat nicht auf ihren außergewöhnlichen Charakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ging ihm entgegen“ hält die Bewegungsnuance des griechischen Verbs fest; „dieses Zeichen“ bewahrt den johanneischen Schlüsselbegriff.
