id: JHN.12.38
reference: John 12:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: de
  text: 'damit das Wort des Propheten Jesaja erfüllt würde, das er gesprochen hatte: »Herr, wer hat unserer Botschaft[a] geglaubt? Und wem ist der Arm des Herrn offenbart worden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem, was wir gehört haben«; oder: »unserer Verkündigung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet die Erfüllungsaussage natürlich ein und lässt offen, ob Zweck, Folge oder beides im Vordergrund steht.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: das Wort des Propheten Jesaja
  rationale: Bewahrt die johanneische Erfüllungsformel und entspricht zugleich natürlichem, würdigem Deutsch.
- source_word: πληρωθῇ
  choice: erfüllt würde
  rationale: Gibt den Aorist Passiv Konjunktiv nach ἵνα wieder und bewahrt das biblische Erfüllungsmotiv.
- source_word: ὃν εἶπεν
  choice: das er gesprochen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Jesajas Ausspruch der nun beschriebenen Erfüllung vorausging.
- source_word: Κύριε
  choice: Herr
  rationale: Direkte Wiedergabe des Vokativs und angemessene Anrede im Schriftzitat.
- source_word: τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν
  choice: wer hat unserer Botschaft geglaubt?
  rationale: ἀκοή bezeichnet hier wahrscheinlich den gehörten beziehungsweise verkündigten Inhalt; „Botschaft“ ist im modernen Deutsch klar und verbindet sich idiomatisch mit „glauben“.
- source_word: ὁ βραχίων κυρίου
  choice: der Arm des Herrn
  rationale: Erhält das biblische Bild für Gottes Macht und Handeln, statt es erklärend aufzulösen.
- source_word: ἀπεκαλύφθη
  choice: ist ... offenbart worden
  rationale: Bewahrt Passiv und Offenbarungsmotiv; das Perfekt passt zur parallelen rhetorischen Frage.
theological_decisions:
- issue: Erfüllungssprache und Verhältnis von göttlichem Zweck und eingetretener Folge
  choice: „damit ... erfüllt würde“
  alternative: „sodass ... erfüllt wurde“
  rationale: Die Formulierung bewahrt die mögliche Zweck- und Ergebnisnuance von ἵνα, ohne die theologische Spannung einseitig aufzulösen.
- issue: Bedeutung von ἀκοή im Jesajazitat
  choice: „unserer Botschaft“
  alternative: „dem, was wir gehört haben“ oder „unserer Verkündigung“
  rationale: Das Wort kann das Hören, das Gehörte oder die verkündigte Nachricht bezeichnen. Der Haupttext gibt den im Zusammenhang naheliegenden Inhaltsaspekt wieder; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Schriftzitat behält die rhetorischen Fragen und das Bild vom „Arm des Herrn“ bei. Der Fußnotenmarker steht unmittelbar bei „Botschaft“, da sich die Alternative auf ἀκοή bezieht.
