  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: de
  text: 'Wer mich ablehnt und meine Worte nicht annimmt[a], hat den, der ihn richtet: Das Wort[b], das ich gesprochen habe, wird ihn am letzten Tag richten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Worte nicht aufnimmt“. Das griechische Verb kann empfangen, aufnehmen oder annehmen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Botschaft, die ich gesprochen habe“. Das griechische Wort logos kann je nach Zusammenhang „Wort“ oder „Botschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: ablehnt
  rationale: Das Verb bezeichnet hier die Zurückweisung Jesu. „Ablehnt“ ist im heutigen Standarddeutsch klar und gibt die persönliche Ausrichtung des griechischen Verbs wieder, ohne es zu „missachtet“ abzuschwächen.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: meine Worte nicht annimmt
  rationale: „Annimmt“ bildet den Sinn von Empfangen, Willkommenheißen oder Akzeptieren natürlich ab. „Worte“ wahrt den Plural und den Bezug auf Jesu gesprochene Äußerungen.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: hat den, der ihn richtet
  rationale: Die relativische Formulierung bewahrt die auffällige, leicht elliptische Konstruktion des Griechischen und bereitet die folgende Bestimmung des Richtenden als Jesu Wort vor.
- source_word: ὁ λόγος
  choice: Das Wort
  rationale: „Wort“ erhält den Singular und die gewichtige, nahezu personifizierte Ausdrucksweise. „Botschaft“ ist ebenfalls möglich, würde den Wortlaut aber stärker auslegen.
- source_word: ὃν ἐλάλησα
  choice: das ich gesprochen habe
  rationale: Das deutsche Perfekt ist hier die natürliche Wiedergabe einer vergangenen Äußerung mit bleibender Bedeutung. Es macht deutlich, dass es um das von Jesus ausgesprochene Wort geht.
- source_word: κρινεῖ
  choice: wird … richten
  rationale: „Richten“ bewahrt die Bedeutungsbreite von κρίνω. „Verurteilen“ würde den Ausgang des Gerichts über den Wortlaut hinaus festlegen.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: Dies ist die natürliche deutsche Form der johanneischen Zeitangabe und lässt deren endzeitlichen Bezug ohne weitere dogmatische Ausgestaltung stehen.
theological_decisions:
- issue: Das Wort als richtende Instanz
  choice: Jesu gesprochenes Wort wird ausdrücklich als das bezeichnet, was den Menschen am letzten Tag richtet.
  alternative: Man könnte das Wort lediglich als Maßstab des von Jesus selbst vollzogenen Gerichts umschreiben.
  rationale: 'Die Übersetzung erhält die Spannung des Satzbaus: Zunächst ist von „dem, der ihn richtet“ die Rede, danach wird Jesu gesprochenes Wort als richtende Instanz genannt. Diese Spannung wird nicht mit anderen Aussagen über Jesu Rolle im Gericht harmonisiert.'
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die bewusst ungewöhnliche Wendung „hat den, der ihn richtet“ bleibt erhalten, damit die nachfolgende Identifizierung mit Jesu Wort nicht vorweggenommen oder geglättet wird.
