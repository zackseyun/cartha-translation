id: JHN.12.32
reference: John 12:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: de
  text: Und ich, wenn ich von der Erde erhöht werde[a][b], werde alle Menschen[c] zu mir ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „falls ich von der Erde erhöht werde“. Das Griechische verwendet eine Bedingungsform; im Zusammenhang ist jedoch Jesu bevorstehender Tod im Blick.'
    reason: alternative_reading
  - marker: b
    text: „Erhöht“ kann zugleich das Hinaufheben am Kreuz und Jesu Erhöhung beziehungsweise Verherrlichung bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Griechischen nur „alle“. Gemeint sind Menschen; der Vers selbst erläutert nicht näher, wie die Reichweite dieser Aussage theologisch zu bestimmen ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Und ich
  rationale: Die Verschmelzung von καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und betont zugleich Jesus als handelndes Subjekt.
- source_word: ἐὰν
  choice: wenn
  rationale: Das deutsche „wenn“ bewahrt sowohl die bedingende Form des Griechischen als auch den im Zusammenhang erwarteten Eintritt des Ereignisses.
- source_word: ὑψωθῶ
  choice: erhöht werde
  rationale: „Erhöht werden“ kann im Deutschen sowohl das körperliche Hinaufheben am Kreuz als auch Erhöhung und Verherrlichung ausdrücken und erhält damit das johanneische Doppelverständnis.
- source_word: ἐκ τῆς γῆς
  choice: von der Erde
  rationale: Die Wendung bezeichnet hier am natürlichsten das Erhöhtwerden von der Erde beziehungsweise vom Erdboden und passt zur Deutung auf Jesu Todesart im folgenden Vers.
- source_word: πάντας
  choice: alle Menschen
  rationale: Das substantivisch gebrauchte maskuline Pluralwort bezieht sich natürlich auf Menschen. Die Ergänzung „Menschen“ verhindert, dass „alle“ als alle Dinge missverstanden wird.
- source_word: ἑλκύσω
  choice: werde … ziehen
  rationale: „Ziehen“ gibt das Bedeutungsspektrum von ἕλκω wieder, ohne die Art oder Wirksamkeit dieses Ziehens über den Wortlaut hinaus festzulegen.
- source_word: πρὸς ἐμαυτόν
  choice: zu mir
  rationale: Im Deutschen gibt „zu mir“ das Ziel des Ziehens natürlich wieder; „zu mir selbst“ wäre hier unnötig schwerfällig.
theological_decisions:
- issue: Bedingungsform und Gewissheit des bevorstehenden Todes Jesu
  choice: wenn ich … erhöht werde
  alternative: falls ich … erhöht werde
  rationale: Die griechische Konstruktion ist formal bedingend. Im erzählerischen Zusammenhang wird Jesu Tod jedoch als bevorstehendes Ereignis vorausgesetzt. „Wenn“ lässt beides erkennen, ohne die Form in eine bloße Zeitangabe umzudeuten.
- issue: Doppelbedeutung von ὑψωθῶ
  choice: erhöht werde
  alternative: hinaufgehoben werde
  rationale: Die gewählte Formulierung hält Kreuzigung und Verherrlichung zusammen, statt eine der beiden Bedeutungsebenen auszuschließen.
- issue: Reichweite von πάντας
  choice: alle Menschen
  alternative: alle
  rationale: Der griechische Ausdruck verweist auf Menschen und formuliert eine umfassende Reichweite. Die Übersetzung entscheidet nicht, wie diese Aussage in späteren Debatten über den Umfang des Heils systematisch einzuordnen ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die leicht markierte Satzstellung bewahrt die Betonung von „ich“. Die Wiederholung von „werde“ folgt der deutschen Verbform und bleibt gut verständlich.
