  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Bedeutungen des griechischen Textes zuverlässig wieder: κἀγώ als anschließendes und betontes „Und ich“, ἐὰν mit „wenn“, ὑψωθῶ als passivisches „erhöht werde“, ἐκ τῆς γῆς als „von der Erde“, πάντας als menschenbezogenes „alle Menschen“, ἑλκύσω als „ziehen“ und πρὸς ἐμαυτόν idiomatisch als „zu mir“. Die für Johannes zentrale Mehrdeutigkeit von ὑψωθῶ bleibt erhalten.'
  naturalness: „Und ich, wenn ich von der Erde erhöht werde, werde alle Menschen zu mir ziehen“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Die Voranstellung von „Und ich“ und die Wiederholung von „werde“ sind im Deutschen stilistisch markiert, aber klar und dem Nachdruck des griechischen Satzes angemessen.
  terminology: „Erhöht werde“ ist hier besonders gelungen, weil es sowohl das Erhobenwerden am Kreuz als auch Erhöhung/Verherrlichung anklingen lassen kann. „Alle Menschen“ macht das maskuline pluralische Objekt sachgerecht explizit, ohne eine systematisch-theologische Deutung über die Aussage des Verses hinaus festzulegen. Die Fußnoten erläutern beide Punkte zurückhaltend und treffend.
