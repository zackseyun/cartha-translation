  rationale: Die Revision beseitigt die vermeidbare modale Mehrdeutigkeit von „sollte“ und glättet die Genitivform. Aussagegehalt, narrative Vorwegnahme, Name, Jüngerterminologie und die durch die Fußnote dokumentierte Alternative bleiben erhalten.
