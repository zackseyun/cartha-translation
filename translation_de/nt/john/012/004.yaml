  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: de
  text: 'Doch Judas Iskariot, einer seiner Jünger – der ihn verraten würde[a] –, sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der ihn ausliefern würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens des griechischen Erzählstils wird im natürlichen modernen Deutsch als Präteritum wiedergegeben.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen leichten Gegensatz zu Marias hingebungsvoller Handlung und leitet den Einwand des Judas ein.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Judas Iskariot
  rationale: Dies ist die im Deutschen eingebürgerte Namensform.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: einer von seinen Jüngern
  rationale: „Jünger“ bewahrt die für die Evangelien zentrale Lehrer-Schüler-Beziehung; die Formulierung ist zugleich verständliches modernes Deutsch.
- source_word: ὁ μέλλων αὐτὸν παραδιδόναι
  choice: der, der ihn verraten sollte
  rationale: μέλλω bezeichnet das bevorstehende Geschehen; „sollte“ ist im deutschen Rückblick idiomatisch. „Verraten“ gibt den kontextuellen Sinn von παραδίδωμι wieder, während die wörtlichere Bedeutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe von παραδιδόναι für die Tat des Judas an Jesus
  choice: verraten
  alternative: ausliefern / übergeben
  rationale: Das Verb bedeutet grundsätzlich „übergeben“ oder „ausliefern“. Im Zusammenhang mit Judas bezeichnet es jedoch eine treulose Auslieferung und kann daher treffend mit „verraten“ wiedergegeben werden. Die Fußnote bewahrt die weitere, wörtlichere Bedeutung und damit die Verbindung zu anderen Übergabe-Aussagen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die griechische Apposition ab; der Doppelpunkt hält den Vers für die im nächsten Vers folgende direkte Rede offen.
