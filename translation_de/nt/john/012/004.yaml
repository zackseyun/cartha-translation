    issue: „der, der ihn verraten sollte“ ist für μέλλων modal mehrdeutig.
    rationale: „Sollte“ kann im heutigen Deutsch neben einer Zukunft aus der Vergangenheit auch eine Verpflichtung bzw. Vorherbestimmung ausdrücken. Das griechische μέλλων markiert hier die kommende Handlung, nicht ein Sollen. „Der ihn verraten würde“ gibt dies eindeutiger wieder.
  - severity: low
    issue: „einer von seinen Jüngern“ ist stilistisch weniger idiomatisch.
    rationale: „Einer seiner Jünger“ ist im modernen Standarddeutsch die übliche Form und wahrt vollständig die Bedeutung von εἷς τῶν μαθητῶν αὐτοῦ.
