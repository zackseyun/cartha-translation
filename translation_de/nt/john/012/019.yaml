  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: de
  text: 'Da sagten die Pharisäer zueinander: »Ihr seht, dass ihr nichts ausrichtet. Seht nur: Die Welt ist ihm nachgegangen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Die Welt« ist hier offenbar rhetorisch übertreibend gebraucht, im Sinn von: alle oder die ganze Menge ist ihm nachgegangen.'
    reason: Erläuterung der rhetorischen Übertreibung bei κόσμος.
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Folgerung aus der unmittelbar vorausgehenden Szene und klingt im modernen deutschen Erzählstil natürlich.
- source_word: πρὸς ἑαυτούς
  choice: zueinander
  rationale: 'Gibt den hier naheliegenden wechselseitigen Sinn idiomatisch wieder: Die Pharisäer sprechen innerhalb ihrer Gruppe miteinander.'
- source_word: Θεωρεῖτε
  choice: Ihr seht
  rationale: Bewahrt die Form des Präsens Indikativ Plural und den resigniert-feststellenden Ton, ohne sie als Imperativ umzudeuten.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: ihr nichts ausrichtet
  rationale: Die doppelte Verneinung bezeichnet die völlige Erfolglosigkeit ihrer Bemühungen. »Nichts ausrichten« ist dafür eine natürliche und prägnante deutsche Wendung.
- source_word: ἴδε
  choice: Seht nur
  rationale: Dient als nachdrücklicher Aufmerksamkeitsruf. »Seht nur« bewahrt die rhetorische Schärfe und passt zur Anrede einer Mehrzahl.
- source_word: κόσμος
  choice: die Welt
  rationale: Bewahrt den griechischen Ausdruck und seine johanneische Resonanz, während die Fußnote auf die offenkundige rhetorische Übertreibung hinweist.
- source_word: ὀπίσω αὐτοῦ
  choice: ihm nach
  rationale: Gibt die räumliche Metapher idiomatisch wieder und kann zugleich das Folgen einer Person ausdrücken.
- source_word: ἀπῆλθεν
  choice: ist … nachgelaufen
  rationale: Das Perfekt betont im Deutschen das aus Sicht der Sprecher gegenwärtig sichtbare Ergebnis. »Nachlaufen« verbindet die Bewegung mit dem polemischen Unterton ihrer frustrierten Aussage.
theological_decisions:
- issue: Reichweite von κόσμος in der Aussage der Pharisäer
  choice: »die Welt« als rhetorische Übertreibung im Haupttext beibehalten
  alternative: »alle« oder »die ganze Menschenmenge«
  rationale: Die Aussage behauptet nicht sachlich, dass ausnahmslos jeder Mensch Jesus folgt. Die wörtliche Bildsprache bleibt dennoch erhalten, ohne ihre Reichweite im Haupttext interpretierend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt erregt und resigniert; »Seht nur« und »nachgelaufen« erhalten den pointierten, leicht polemischen Ton der Sprecher.
