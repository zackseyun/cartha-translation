id: JHN.12.37
reference: John 12:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: de
  text: Obwohl er so viele Zeichen vor ihren Augen getan hatte, glaubten sie nicht an ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb steht im Imperfekt; gemeint sein kann auch: »sie glaubten weiterhin nicht an ihn« beziehungsweise wiederholt nicht.'
    reason: Aspektuelle Alternative ohne stärkere Willensdeutung.
lexical_decisions:
- source_word: τοσαῦτα
  choice: so viele
  rationale: Die Wendung hebt die große Zahl der Zeichen hervor und entspricht natürlichem, modernem Deutsch.
- source_word: δὲ
  choice: obwohl
  rationale: Der Gegensatz wird im Deutschen durch den konzessiven Nebensatz natürlich ausgedrückt; ein zusätzliches »doch« wäre möglich, aber stilistisch entbehrlich.
- source_word: σημεῖα
  choice: Zeichen
  rationale: »Zeichen« bewahrt den für das Johannesevangelium wichtigen Hinweischarakter der Taten und verengt sie nicht auf bloße Wunder.
- source_word: πεποιηκότος
  choice: getan hatte
  rationale: Das Perfektpartizip im Genitivus absolutus bezeichnet eine vorausgehende Handlung mit fortwirkender Bedeutung; das Plusquamperfekt gibt dies im Deutschen angemessen wieder.
- source_word: ἔμπροσθεν αὐτῶν
  choice: vor ihren Augen
  rationale: Die Formulierung macht verständlich, dass die Zeichen öffentlich und für sie sichtbar geschahen.
- source_word: οὐκ ἐπίστευον
  choice: glaubten sie nicht
  rationale: Das Präteritum ist idiomatisches Deutsch. Die mögliche fortdauernde oder wiederholte Bedeutung des Imperfekts wird in einer Fußnote kenntlich gemacht, ohne den Haupttext zu überdeuten.
- source_word: εἰς αὐτόν
  choice: an ihn
  rationale: »An ihn glauben« ist die natürliche deutsche Wiedergabe der johanneischen Verbindung πιστεύω εἰς und wahrt deren personale Ausrichtung.
theological_decisions:
- issue: Fortdauernder Unglaube beim griechischen Imperfekt
  choice: glaubten sie nicht
  alternative: glaubten sie weiterhin nicht
  rationale: Die Hauptfassung bleibt natürlich und lässt offen, wie stark der durative Aspekt hervorzuheben ist. Die Fußnote weist auf den möglichen anhaltenden oder wiederholten Unglauben hin, ohne ausdrücklich eine bewusste Verweigerung zu unterstellen.
- issue: Verhältnis der Zeichen zum Unglauben
  choice: Obwohl
  alternative: Doch obwohl
  rationale: 'Die konzessive Form bewahrt die Spannung: Trotz der zahlreichen sichtbaren Zeichen kam es nicht zum Glauben. Das griechische δέ wird funktional in diese Satzstruktur aufgenommen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zeichen« wahrt den johanneischen Leitbegriff; »vor ihren Augen« ist anschaulich und allgemein verständlich. Die Satzstruktur ist flüssig, ohne den Gegensatz oder die aspektuelle Offenheit des griechischen Textes einzuebnen.
