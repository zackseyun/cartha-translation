id: JHN.12.26
reference: John 12:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: de
  text: Wenn jemand mir dient[a], soll er mir folgen; und wo ich bin, da wird auch mein Diener sein. Wenn jemand mir dient, wird der Vater ihn ehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text verwendet eine allgemein gemeinte Konstruktion im maskulinen Singular: „Wenn jemand mir dient … wird der Vater ihn ehren.“'
    reason: Erläuterung des generischen maskulinen Singularbezugs
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: dient
  rationale: Das Verb bezeichnet hier den Dienst für Jesus allgemein. „Dient“ ist im Deutschen natürlich und bewahrt den Zusammenhang mit „Diener“, ohne den Sinn auf ein kirchliches Amt zu verengen.
- source_word: ἀκολουθείτω
  choice: soll er mir folgen
  rationale: Die Form ist ein Imperativ der dritten Person. „Soll er mir folgen“ gibt die auffordernde Kraft in verständlichem modernem Deutsch wieder; eine Form wie „der folge mir“ wäre zwar formal näher, klänge aber deutlich gehobener und weniger gegenwärtig.
- source_word: διάκονος
  choice: Diener
  rationale: Gemeint ist hier jemand, der Jesus dient, nicht das spätere kirchliche Amt eines Diakons. „Diener“ erhält zudem die erkennbare Verbindung zum Verb „dienen“.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: wo ich bin
  rationale: Das ausdrücklich gesetzte ἐγώ verleiht „ich“ Nachdruck. Die natürliche deutsche Formulierung „wo ich bin“ lässt diesen im Zusammenhang erkennen, ohne ein schwerfälliges „wo ich selbst bin“ einzuführen.
- source_word: ἐκεῖ καί
  choice: da wird auch
  rationale: „Da“ nimmt den Ort auf, und „auch“ bewahrt die additive Bedeutung von καί.
- source_word: τιμήσει (τιμάω)
  choice: wird ... ehren
  rationale: Das Verb verheißt Ehre beziehungsweise Anerkennung. „Ehren“ ist präzise, knapp und lässt offen, in welcher konkreten Weise diese Ehre erteilt wird.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Der griechische Text sagt „der Vater“ und enthält hier kein Possessivpronomen. Deshalb wird kein „mein“ ergänzt.
- source_word: τις
  choice: jemand
  rationale: Das indefinite Pronomen ist allgemein gemeint. „Jemand“ gibt diese offene Reichweite natürlich wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf das allgemein gebrauchte τις zurück. „Ihn“ bewahrt die grammatische Form des Ausgangstextes; die Fußnote erläutert ihren generischen Gebrauch.
theological_decisions:
- issue: Generisches Maskulinum in den Bedingungssätzen
  choice: „Jemand“ wird mit den maskulinen Singularformen „er“, „Diener“ und „ihn“ wieder aufgenommen.
  alternative: Durchgehend geschlechtsneutral umformulieren, etwa mit „diese Person“ oder einer Pluralkonstruktion.
  rationale: Der griechische Text verwendet eine allgemein gemeinte indefinite Konstruktion mit maskulinem Singularbezug. Die Übersetzung bewahrt diese Form, während die Fußnote klarstellt, dass die Aussage nicht auf Männer beschränkt ist.
- issue: Art der vom Vater verliehenen Ehre
  choice: 'Die Verheißung bleibt allgemein: „der Vater wird ihn ehren“.'
  alternative: Die Ehre ausdrücklich als himmlischen Lohn oder endzeitliche Verherrlichung deuten.
  rationale: Der Vers bestimmt die konkrete Gestalt der Ehre nicht. Die offene Formulierung bewahrt daher die theologische Spannweite des griechischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Wortverbindung „dient/Diener“ werden erhalten. „Soll er mir folgen“ vermeidet sowohl eine altertümliche Imperativform als auch eine unnötige Abschwächung der Aufforderung.
