  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: de
  text: Und wer mich sieht, sieht den, der mich gesandt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer mich betrachtet, betrachtet den, der mich gesandt hat“. Das griechische Verb kann aufmerksames, wahrnehmendes Sehen bezeichnen, nicht nur den körperlichen Sehvorgang.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion verbindet den Satz mit dem vorausgehenden Kontext; „Und“ ist die unmittelbarste deutsche Wiedergabe.
- source_word: ὁ θεωρῶν
  choice: wer … sieht
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, der diese Handlung vollzieht. Die deutsche Konstruktion „wer … sieht“ ist natürlich und bewahrt den generischen Sinn.
- source_word: ἐμὲ
  choice: mich
  rationale: Das betonte griechische Pronomen steht als direktes Objekt. „Mich“ gibt es idiomatisch wieder; eine zusätzliche Hervorhebung ist im Deutschen nicht zwingend.
- source_word: θεωρεῖ
  choice: sieht
  rationale: θεωρέω kann ein betrachtendes, aufmerksames Sehen oder Wahrnehmen bezeichnen. „Sieht“ ist modernes, natürliches Deutsch und erhält die Wiederholung desselben griechischen Verbs.
- source_word: τὸν πέμψαντά με
  choice: den, der mich gesandt hat
  rationale: Das substantivierte Aoristpartizip beschreibt den Sendenden. Die Formulierung ist idiomatisch, bewahrt den relationalen Ausdruck und fügt den im Vers nicht ausdrücklich genannten Titel „Vater“ nicht ein.
theological_decisions:
- issue: Verhältnis zwischen dem Sehen Jesu und dem Sehen dessen, der ihn gesandt hat
  choice: Die unmittelbare Aussage wird als „wer mich sieht, sieht den, der mich gesandt hat“ bewahrt.
  alternative: Eine abschwächende Deutung im Sinn von „erfährt etwas über den Sender“ oder eine verstärkende Paraphrase, die ausdrücklich ontologische Identität behauptet.
  rationale: Der griechische Text formuliert eine starke Einheit der Offenbarung, ohne sie hier näher zu erklären. Die Übersetzung erhält diese theologische Spannung und vermeidet dogmatische Zusätze.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wiedergabe von θεωρέω mit „sehen“ erhält die prägnante Wiederholung des Originals; „gesandt hat“ entspricht dem biblisch geprägten, aber weiterhin geläufigen Sprachgebrauch.
