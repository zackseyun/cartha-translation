  source_fidelity: 'Die Übersetzung gibt die syntaktische Struktur und die bewusste Wiederholung von θεωρέω treffend wieder: „wer mich sieht, sieht“. „Den, der mich gesandt hat“ entspricht dem artikulierten Aoristpartizip τὸν πέμψαντά με, ohne den im Vers nicht genannten „Vater“ einzutragen. Die generische Wiedergabe des artikulierten Partizips mit „wer“ ist im modernen Deutsch idiomatisch und inhaltlich präzise.'
