review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzglieder und die Aussage des griechischen Textes grundsätzlich zutreffend wieder: Die bei Jesus anwesende Menge bezeugt das Rufen des Lazarus aus dem Grab und seine Auferweckung von den Toten. Das Imperfekt ἐμαρτύρει verlangt jedoch nicht die zusätzliche zeitliche Behauptung „weiterhin“; es kann die im Erzählhintergrund andauernde bzw. wiederholte Zeugnisgabe kennzeichnen.'
  naturalness: „Weiterhin“ klingt im Deutschen so, als sei eine bereits vorher ausdrücklich begonnene Zeugnisgabe fortgesetzt worden; dies ist hier nicht gesagt. Außerdem sollte das Rufen und Auferwecken im Deutschen als den Hauptsatzhandlungen vorausliegend markiert werden.
  terminology: „Menge“, „Zeugnis ablegen“, „Grab“ und „von den Toten auferwecken“ sind sachgerecht und im modernen Standarddeutsch verständlich. „Zeugnis ablegen“ bewahrt das johanneische Wortfeld von μαρτυρέω.
  issues:
  - severity: medium
    issue: „weiterhin“ fügt eine nicht ausdrücklich im Text liegende Fortsetzungsnuance hinzu.
    rationale: Der Imperfekt kann zwar einen Verlauf oder eine Wiederholung ausdrücken, bezeichnet aber nicht zwingend eine Fortsetzung einer zuvor bereits laufenden Handlung. Die deutsche Ergänzung sollte daher entfallen.
  - severity: low
    issue: Die Ereignisse des Rufens und Auferweckens sind im Entwurf nicht eindeutig als vor der Zeugnisgabe liegend markiert.
    rationale: Das Plusquamperfekt („gerufen und ... auferweckt hatte“) stellt den zeitlichen Bezug der rückblickenden Relativbestimmung im Deutschen klarer dar.
  revised_text: Die Menge, die bei ihm gewesen war, als er Lazarus aus dem Grab gerufen und ihn von den Toten auferweckt hatte, legte nun Zeugnis davon ab.[a]
  revised_footnotes:
  - marker: a
