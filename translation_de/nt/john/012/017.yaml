revisions:
- from: Die Menge, die bei ihm gewesen war, als er Lazarus aus dem Grab rief und ihn von den Toten auferweckte, legte also weiterhin Zeugnis davon ab.[a]
  to: Die Menge, die bei ihm gewesen war, als er Lazarus aus dem Grab gerufen und ihn von den Toten auferweckt hatte, legte nun Zeugnis davon ab.[a]
  rationale: Die Revision entfernt die überstarke Ergänzung „weiterhin“, erhält mit „nun“ die verbindende Funktion von οὖν und markiert die zuvor geschehenen Ereignisse mit dem Plusquamperfekt. Die Aussage über Lazarus und das johanneische Zeugnisvokabular bleiben erhalten.
