reference: John 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: de
  text: Die Menge, die bei ihm gewesen war, als er Lazarus aus dem Grab gerufen und ihn von den Toten auferweckt hatte, legte nun Zeugnis davon ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bezeugte dies“. Das griechische Verb kann das Ablegen eines Zeugnisses oder ein Bezeugen bezeichnen, ein wiederkehrendes Thema im Johannesevangelium.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: legte weiterhin Zeugnis davon ab
  rationale: Der Imperfekt bezeichnet hier ein andauerndes oder wiederholtes Bezeugen. „Zeugnis ablegen“ bewahrt zugleich das für Johannes wichtige Wortfeld des Zeugnisses; „weiterhin“ macht den durativen Aspekt im Deutschen deutlich.
- source_word: οὖν
  choice: also
  rationale: „Also“ stellt den erzählerischen beziehungsweise folgernden Zusammenhang mit dem vorherigen Kontext natürlich her.
- source_word: ὁ ὄχλος
  choice: die Menge
  rationale: „Die Menge“ ist eine klare und geläufige Wiedergabe für die versammelte Menschengruppe.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: die bei ihm gewesen war
  rationale: Die attributive Partizipialkonstruktion bestimmt die betreffende Menge näher. Das Plusquamperfekt ordnet ihre Anwesenheit beim früheren Ereignis verständlich ein.
- source_word: ἐφώνησεν ἐκ τοῦ μνημείου
  choice: aus dem Grab rief
  rationale: Die Wortstellung gibt sowohl Jesu Rufen als auch die durch ἐκ bezeichnete Bewegung aus dem Grab knapp und natürlich wieder.
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: ihn von den Toten auferweckte
  rationale: „Auferwecken“ gibt ἐγείρω im Zusammenhang der Totenerweckung präzise wieder; „von den Toten“ ist die etablierte natürliche Entsprechung zu ἐκ νεκρῶν.
theological_decisions:
- issue: Aussage über die Auferweckung des Lazarus
  choice: ihn von den Toten auferweckte
  alternative: ihn aus den Toten erweckte
  rationale: Die gewählte Fassung bewahrt die ausdrückliche Aussage, dass Jesus Lazarus von den Toten auferweckte, ohne sie abzuschwächen oder dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zusammenhang, ist aber idiomatisch geglättet. Das demonstrative „davon“ verdeutlicht im Deutschen den Inhalt des Zeugnisses, ohne zusätzliche Sachinformation einzuführen.
