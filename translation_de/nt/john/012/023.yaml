id: JHN.12.23
reference: John 12:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: de
  text: 'Jesus aber antwortete ihnen: „Die Stunde[a] ist gekommen, dass der Menschensohn[b] verherrlicht wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Zeit ist gekommen.“ Im Griechischen steht „Stunde“, ein wiederkehrender Ausdruck im Johannesevangelium für den festgesetzten Zeitpunkt von Jesu Leiden und Herrlichkeit.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ein Titel mit der Bedeutung „Sohn des Menschen“. „Menschensohn“ erinnert an Daniel 7 und wird wegen seiner theologischen und intertextuellen Bedeutung beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: antwortete
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird nach „antworten“ im Deutschen direkt als „ihnen“ wiedergegeben.
- source_word: λέγων
  choice: ':'
  rationale: Das redeeinleitende Partizip wird idiomatisch durch einen Doppelpunkt vor der direkten Rede ausgedrückt; ein zusätzliches „und sagte“ wäre im Deutschen schwerfällig.
- source_word: Ἐλήλυθεν
  choice: ist gekommen
  rationale: Das Perfekt bewahrt sowohl das Bild des Kommens als auch den nun eingetretenen, gegenwärtigen Zustand.
- source_word: ὥρα
  choice: Stunde
  rationale: „Stunde“ erhält den wiederkehrenden johanneischen Leitbegriff für Jesu festgesetzten Zeitpunkt; „Zeit“ wäre allgemeiner.
- source_word: ἵνα
  choice: dass
  rationale: „Dass“ verbindet das Kommen der Stunde idiomatisch mit dem folgenden Geschehen und lässt den möglichen Gehalt von Zweck und Bestimmung offen.
- source_word: δοξασθῇ
  choice: verherrlicht wird
  rationale: Die passive Form und das theologische Bedeutungsfeld von Jesu Herrlichkeit, Erhöhung und Bestätigung bleiben gewahrt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung und ihre Anklänge an Daniel 7.
theological_decisions:
- issue: Wiedergabe des Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Menschensohn“ bewahrt den christologischen Titel und seine intertextuelle Verbindung zu Daniel 7, ohne ihn auf eine bloß allgemeine Bezeichnung des Menschseins zu reduzieren.
- issue: Aspekt und theologische Prägung von Ἐλήλυθεν ἡ ὥρα
  choice: Die Stunde ist gekommen
  alternative: Die Zeit ist gekommen / Die Stunde ist da
  rationale: Die Formulierung erhält sowohl den griechischen Perfektaspekt als auch das johanneische Motiv der festgesetzten Stunde von Leiden und Herrlichkeit.
- issue: Funktion von ἵνα
  choice: dass
  alternative: damit
  rationale: Der Zusammenhang kann Gehalt, Folge beziehungsweise göttliche Bestimmung anklingen lassen. „Dass“ vermeidet es, die Konstruktion ausschließlich als Zweckangabe festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das einleitende „aber“ gibt δέ wieder; die direkte Rede wird ohne das im Deutschen entbehrliche „sagend“ eingeleitet. Die traditionellen Schlüsselbegriffe „Stunde“, „Menschensohn“ und „verherrlicht“ bleiben wegen ihrer johanneischen Prägung erhalten.
