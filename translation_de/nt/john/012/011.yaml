source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: de
  text: Denn viele von den Juden[a] gingen seinetwegen weg[b] und glaubten an Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Judäern“. Bei Johannes kann „die Juden“ je nach Zusammenhang auch enger die Judäer oder jüdische Autoritäten bezeichnen. Hier ist ausdrücklich von vielen aus der Gruppe die Rede, nicht von allen Juden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „gingen fort“ oder „wandten sich ab“. Das griechische Verb beschreibt ein andauerndes oder wiederholtes Weggehen, nennt hier aber kein ausdrückliches Ziel.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „vertrauten Jesus“ oder „setzten ihr Vertrauen auf Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet den in Vers 10 genannten Tötungsplan. „Denn“ stellt den kausalen Anschluss in einem selbstständig lesbaren deutschen Satz natürlich her.
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: viele von den Juden
  rationale: 'Der Genitiv ist partitiv: Gemeint sind viele aus einer größeren Gruppe, nicht alle Juden. Die mögliche regionale Bedeutung „Judäer“ bleibt in einer Fußnote erhalten.'
- source_word: δι’ αὐτὸν
  choice: seinetwegen
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Das Pronomen bezieht sich im Zusammenhang auf Lazarus; „seinetwegen“ gibt die kausale Bedeutung knapp und natürlich wieder.
- source_word: ὑπῆγον
  choice: gingen … weg
  rationale: Das Imperfekt von ὑπάγω beschreibt ein fortdauerndes oder wiederholtes Weggehen. Die Formulierung bewahrt das Bewegungsbild, ohne ein ausdrückliches Ziel oder eine formelle Abkehr einzutragen.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: glaubten an Jesus
  rationale: Die geläufige deutsche Wendung gibt den auf Jesus gerichteten Glauben wieder. Sie vermeidet stärkere Deutungen wie „wurden Jünger“ oder „wurden gerettet“, die der Vers nicht ausdrücklich formuliert.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων im johanneischen Zusammenhang
  choice: „von den Juden“ im Haupttext
  alternative: „von den Judäern“; kontextuell auch eine Abgrenzung von den Jesus ablehnenden jüdischen Autoritäten
  rationale: Johannes verwendet Ἰουδαῖοι mit unterschiedlichen Bezugsbereichen. Die partitive Formulierung bezeichnet hier ausdrücklich nur viele aus der Gruppe und darf nicht als pauschale Aussage über alle Juden verstanden werden. Der Haupttext bewahrt den weiteren Ausdruck, die geografische Alternative steht in der Fußnote.
- issue: Tragweite von πιστεύω εἰς
  choice: „glaubten an Jesus“
  alternative: „vertrauten Jesus“; „setzten ihr Vertrauen auf Jesus“
  rationale: Die Wendung bezeichnet auf Jesus gerichteten Glauben beziehungsweise Vertrauen, legt in diesem Vers aber nicht alle weiteren theologischen Folgen dieses Glaubens dar.
- issue: Bezug und Wirkung des Weggehens
  choice: „gingen seinetwegen weg“ ohne ergänztes Ziel
  alternative: „wandten sich seinetwegen ab“ oder „gingen seinetwegen fort“
  rationale: Der Zusammenhang legt ein Weggehen aus dem Einflussbereich der Gegner Jesu nahe, doch der griechische Satz nennt weder Ausgangspunkt noch Ziel ausdrücklich. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Seinetwegen“ vermeidet die schwerfällige Wiederholung von „weil … wegen“. Das Präteritum ist im deutschen Erzählstil natürlich; der fortdauernde Aspekt der griechischen Imperfekte wird nicht durch interpretierende Zusätze überzeichnet.
