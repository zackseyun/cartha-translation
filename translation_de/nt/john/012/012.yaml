  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: de
  text: Am nächsten Tag hörte die große Menschenmenge, die zum Fest gekommen war, dass Jesus nach Jerusalem kam,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »dass Jesus nach Jerusalem kommt«; im Griechischen steht ein historisches Präsens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Am nächsten Tag
  rationale: Die adverbiale Zeitangabe wird im modernen Deutschen idiomatisch wiedergegeben und wahrt die erzählerische Abfolge.
- source_word: ὁ ὄχλος πολὺς
  choice: die große Menschenmenge
  rationale: ὄχλος bezeichnet eine Menschenmenge, πολὺς deren beträchtliche Größe. Die Formulierung ist klar und gegenwärtig.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: die zum Fest gekommen war
  rationale: Das attributive Partizip wird natürlich als Relativsatz wiedergegeben; das Plusquamperfekt macht die Vorzeitigkeit des Kommens deutlich.
- source_word: ἀκούσαντες
  choice: hörte
  rationale: Das pluralische Partizip bezieht sich sinngemäß auf die einzelnen Menschen der kollektiv bezeichneten Menge. Im Deutschen kann das finite Verb grammatisch im Singular bei »Menschenmenge« stehen, ohne den Sinn zu verändern.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: dass Jesus nach Jerusalem kam
  rationale: Das griechische historische Präsens wird passend zur deutschen Vergangenheitsnarration im Präteritum wiedergegeben. Das Verb bezeichnet hier Jesu bevorstehende beziehungsweise bereits einsetzende Ankunftsbewegung.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist »nach« im Deutschen die natürliche Wiedergabe einer gerichteten Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Fest« ist für ἑορτή im johanneischen Kontext natürlich und verständlich. Der Vers bleibt wie im griechischen Ausgangstext syntaktisch offen und wird im folgenden Vers fortgesetzt.
