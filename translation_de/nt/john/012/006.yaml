  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: de
  text: Das sagte er aber nicht, weil ihm die Armen am Herzen lagen, sondern weil er ein Dieb war. Er hatte die Geldkasse[a] bei sich und nahm an sich, was hineingelegt wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Geldbeutel“ beziehungsweise „die Geldkassette“. Das griechische Wort bezeichnet einen Behälter, in dem Geld aufbewahrt wurde.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „tragen“ bedeuten. Im Zusammenhang damit, dass Judas als Dieb bezeichnet wird, ist jedoch gemeint, dass er sich aneignete, was hineingelegt wurde.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Das sagte er aber
  rationale: Das vorangestellte „Das“ nimmt τοῦτο natürlich auf; „aber“ gibt das leicht kontrastive δέ wieder, ohne es zu überbetonen.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: nicht, weil ihm die Armen am Herzen lagen
  rationale: Die deutsche Wendung drückt die persönliche Sorge aus, die μέλει mit Dativ und περί bezeichnet, und bewahrt den verneinten Beweggrund.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: sondern weil er ein Dieb war
  rationale: „Sondern weil“ bildet den Gegensatz zu „nicht, weil“ idiomatisch ab; κλέπτης bezeichnet einen Dieb.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: Er verwaltete die Kasse
  rationale: γλωσσόκομον bezeichnet hier den gemeinsamen Geldbehälter; ἔχων meint im Zusammenhang, dass Judas ihn innehatte beziehungsweise darüber verfügte. „Kasse verwalten“ ist im Deutschen natürlicher als „die Geldkassette haben“.
- source_word: τὰ βαλλόμενα
  choice: was hineingelegt wurde
  rationale: Die substantivierte Passivform bezeichnet das, was in den Geldbehälter eingelegt wurde; das Ziel ist aus dem Kontext eindeutig.
- source_word: ἐβάσταζεν
  choice: nahm immer wieder an sich
  rationale: Der Imperfekt bezeichnet wiederholtes beziehungsweise fortdauerndes Handeln. Im unmittelbaren Zusammenhang mit „Dieb“ hat βαστάζω hier die Bedeutung des widerrechtlichen Ansichnehmens, ohne im Haupttext unnötig nochmals „stehlen“ zu sagen.
theological_decisions:
- issue: Bedeutung von ἐβάσταζεν im Zusammenhang mit Judas’ Diebstahl
  choice: als wiederholtes widerrechtliches Ansichnehmen wiedergeben
  alternative: „trug, was hineingelegt wurde“ oder ausdrücklich „stahl immer wieder“
  rationale: βαστάζω kann grundsätzlich „tragen“ bedeuten, doch die ausdrückliche Bezeichnung als Dieb spricht hier stark für Veruntreuung. „Nahm immer wieder an sich“ bewahrt sowohl den kontextuellen Vorwurf als auch die wiederholte Handlung des Imperfekts, ohne die lexikalische Mehrdeutigkeit völlig zu verdecken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Partizipialkonstruktion. „Am Herzen liegen“, „die Kasse verwalten“ und „an sich nehmen“ sind gegenwärtig und natürlich, ohne umgangssprachlich zu wirken.
