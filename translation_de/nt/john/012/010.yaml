id: JHN.12.10
reference: John 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: de
  text: Da beschlossen die führenden Priester, auch Lazarus zu töten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da planten die führenden Priester, auch Lazarus zu töten.“'
    reason: Lexikalische Alternative für ἐβουλεύσαντο, bei der der planende Vorgang stärker hervortritt.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: beschlossen
  rationale: Das Verb bezeichnet hier eine Beratung beziehungsweise Überlegung, die zu einem festen Vorhaben führt. „Beschlossen“ ist im modernen Deutsch klar und bewahrt die bewusste Entschlossenheit; „planten“ würde den Vorgang stärker betonen.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung weiter und nimmt hier den ursächlichen Zusammenhang mit dem vorigen Vers auf. „Da“ gibt diesen Fortgang natürlich wieder, ohne einen zu starken Gegensatz einzutragen.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet im Johannesevangelium die hohepriesterliche Führungsschicht, nicht mehrere amtierende Hohepriester. „Führende Priester“ ist für heutige Leser verständlich und sachlich präzise.
- source_word: ἵνα
  choice: zu
  rationale: Nach einem Verb des Beschließens drückt ἵνα mit Konjunktiv den beabsichtigten Inhalt aus. Der deutsche Infinitiv mit „zu“ ist die natürliche Entsprechung.
- source_word: καὶ
  choice: auch
  rationale: 'καί hat additive Bedeutung: Lazarus wird zusätzlich als Ziel genannt, im Zusammenhang neben Jesus.'
- source_word: τὸν Λάζαρον
  choice: Lazarus
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben; der griechische Artikel wird nicht eigens abgebildet.
- source_word: ἀποκτείνωσιν
  choice: zu töten
  rationale: ἀποκτείνω bedeutet direkt „töten“. „Hinrichten“ würde ein förmliches Gerichtsverfahren nahelegen, „ermorden“ eine über die Wortbedeutung hinausgehende moralische Einordnung ausdrücklich machen.
theological_decisions:
- issue: Darstellung der Absicht der führenden Priester gegenüber Lazarus
  choice: Die Aussage wird nüchtern als bewusster Beschluss wiedergegeben, Lazarus zu töten.
  alternative: Stärkere Formulierungen wie „sie schmiedeten einen Plan“ oder „sie verschworen sich“
  rationale: Der griechische Text bezeugt Überlegung und einen gefassten Beschluss, verwendet aber keinen speziellen Ausdruck für eine Verschwörung. Die Übersetzung bewahrt die Schwere der Absicht, ohne zusätzliche Motive oder Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Priester“ vermeidet das im Deutschen missverständliche pluralische „Hohepriester“ und bezeichnet verständlich die hohepriesterliche Führungsschicht. Die knappe Satzform entspricht dem nüchternen Ernst des griechischen Textes.
