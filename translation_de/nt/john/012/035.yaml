  source_fidelity: Der Entwurf gibt den Satzbau, die temporale Dringlichkeit, das Licht-Finsternis-Bild und die Mehrdeutigkeit von ἐν ὑμῖν insgesamt gut wieder. »Überwältigt« verschiebt καταλάβῃ jedoch stärker in Richtung Besiegen/Beherrschen; im Bild eines Gehenden ist »einholt« die näherliegende Wiedergabe.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. »Geht euren Weg« ist zwar idiomatisch, ergänzt aber das nicht im griechischen Text stehende Possessiv- und Lebenswegkonzept. Die schlichtere Aufforderung »Geht« bewahrt die bewusst bildhafte Offenheit besser.
  terminology: »Licht«, »Finsternis« und »unter euch« sind angemessen. Die Fußnote bewahrt die semantische Offenheit von ἐν ὑμῖν, ohne eine dogmatische Deutung festzulegen.
  issues:
