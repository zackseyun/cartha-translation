id: JHN.12.35
reference: John 12:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: »Noch kurze Zeit ist das Licht unter euch[a]. Geht, solange ihr das Licht habt, damit die Finsternis euch nicht einholt. Wer in der Finsternis geht, weiß nicht, wohin er geht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in euch« oder »bei euch«. Die griechische Wendung kann unterschiedlich verstanden werden; im unmittelbaren Zusammenhang passt »unter euch« am besten zu Jesu gegenwärtiger öffentlicher Anwesenheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Ein natürlicher deutscher Erzählanschluss, der die Aussage mit dem vorausgehenden Gespräch verbindet, ohne eine stärkere Schlussfolgerung auszudrücken.
- source_word: Ἔτι μικρὸν χρόνον
  choice: Nur noch kurze Zeit
  rationale: Gibt sowohl ἔτι als auch die zeitliche Begrenzung idiomatisch und mit der im Kontext liegenden Dringlichkeit wieder.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Bewahrt das johanneische Bild und seine christologische Tragweite, ohne es erklärend aufzulösen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Passt im unmittelbaren Zusammenhang am besten zur noch begrenzten öffentlichen Gegenwart Jesu; die echte Mehrdeutigkeit der Präpositionalphrase wird in der Fußnote erhalten.
- source_word: περιπατεῖτε
  choice: Geht euren Weg
  rationale: Bewahrt das Bild des Gehens und lässt zugleich die übertragene Bedeutung der Lebensführung im natürlichen Deutschen anklingen.
- source_word: ὡς
  choice: solange
  rationale: Die Konjunktion ist hier temporal verstanden und bringt in Verbindung mit ἔχετε die zeitliche Dringlichkeit klar zum Ausdruck.
- source_word: ἵνα μὴ
  choice: damit ... nicht
  rationale: Gibt den Zweck- beziehungsweise Vermeidungssinn in klarem modernem Deutsch wieder.
- source_word: σκοτία
  choice: die Finsternis
  rationale: Bewahrt den bestimmten, literarisch geprägten Gegenpol zu »dem Licht« im Johannesevangelium.
- source_word: καταλάβῃ
  choice: überwältigt
  rationale: Gibt die bedrohliche Bedeutung von καταλαμβάνω wieder. Auch »einholt« oder »ergreift« wären möglich; »überwältigt« ist verständlich und wahrt die Kraft des Bildes.
- source_word: ὁ περιπατῶν ἐν τῇ σκοτίᾳ
  choice: Wer in der Finsternis geht
  rationale: Überträgt das substantivierte Partizip als natürliche generische Aussage und behält die Geh-Metapher bei.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: weiß nicht, wohin er geht
  rationale: Eine direkte und idiomatische Wiedergabe, die den gegenwärtigen Richtungs- und Orientierungsverlust erhält.
theological_decisions:
- issue: Bedeutung von ἐν ὑμῖν in Bezug auf das Licht
  choice: unter euch
  alternative: in euch; bei euch
  rationale: Im narrativen Zusammenhang bezeichnet das Licht am ehesten Jesu zeitlich begrenzte Gegenwart inmitten der angesprochenen Menschen. Da ἐν ὑμῖν jedoch auch innerlich oder im Sinn von Nähe verstanden werden kann, werden die Alternativen in einer Fußnote genannt, ohne die Spannung aufzulösen.
- issue: Identität des Lichtes
  choice: Das Bild bleibt als »das Licht« stehen
  alternative: Explizite Paraphrase als »Jesus«
  rationale: Der johanneische Kontext legt den christologischen Bezug nahe, doch der Vers selbst spricht bildhaft. Die Übersetzung soll diesen Bezug nicht durch eine erklärende Einsetzung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Licht-Finsternis-Metaphorik bleibt erhalten. »Geht euren Weg« klingt natürlicher als das isolierte »Geht«, ohne die Metapher zur bloßen Aufforderung »Lebt« zu verflachen.
