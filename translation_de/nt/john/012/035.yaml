    issue: καταλάβῃ als »überwältigt«
    rationale: Das Verb kann zwar auch »überwältigen« bedeuten, doch der unmittelbare Kontext des Gehens und Nichtwissens, wohin man geht, legt das Bild nahe, dass die Finsternis die Betreffenden einholt. »Einholt« erhält dieses Bild und vermeidet eine stärkere Deutung als Sieg oder Unterwerfung.
  - severity: low
    issue: περιπατεῖτε als »Geht euren Weg«
    rationale: Die Formulierung ist verständlich, fügt aber »euren« und damit eine konkretere Vorstellung eines persönlichen Lebenswegs hinzu. »Geht« ist hier natürlich genug und lässt die griechische Gehmetapher unverengt stehen.
