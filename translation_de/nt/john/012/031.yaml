review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die zweimalige emphatische Zeitangabe νῦν mit „jetzt“ parallel wieder. „Das Gericht über diese Welt“ trifft κρίσις τοῦ κόσμου τούτου im Kontext angemessen, ohne es unnötig zu „Verurteilung“ zu verschärfen. „Der Herrscher dieser Welt“ entspricht ὁ ἄρχων τοῦ κόσμου τούτου, und „wird hinausgeworfen werden“ bildet Futur und Passiv von ἐκβληθήσεται sowie die verstärkende Richtungsangabe ἔξω zuverlässig ab.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „Das Gericht ergeht über diese Welt“ ist eine natürliche, präzise gerichtssprachliche Wendung; die Wiederholung von „jetzt“ bewahrt den knappen Parallelismus. Das Futurpassiv „wird hinausgeworfen werden“ ist etwas markiert, aber hier korrekt und zur Wiedergabe der griechischen Form sinnvoll.
  terminology: „Gericht“, „Welt“ und „Herrscher“ sind sachgerecht und in der johanneischen Terminologie gut verständlich. Die Fußnote nennt „Fürst dieser Welt“ zutreffend als traditionelle lexikalische Alternative, ohne diese in den Haupttext zu drängen. Die verbreitete Identifizierung mit Satan wird ausdrücklich als Deutung und nicht als Bestandteil des griechischen Wortlauts kenntlich gemacht.
