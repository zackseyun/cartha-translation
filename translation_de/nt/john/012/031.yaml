id: JHN.12.31
reference: John 12:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: de
  text: Jetzt ergeht das Gericht über diese Welt; jetzt wird der Herrscher dieser Welt hinausgeworfen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der »Herrscher dieser Welt« wird gewöhnlich als Satan verstanden; auch möglich: »Fürst dieser Welt«.'
    reason: Die Anmerkung bewahrt die traditionelle lexikalische Alternative zu ἄρχων und informiert über die verbreitete Identifizierung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: νῦν
  choice: jetzt
  rationale: In beiden Satzhälften gleich wiedergegeben, um den emphatischen Zeitbezug und den Parallelismus des Griechischen zu bewahren.
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: ergeht das Gericht über diese Welt
  rationale: Der Genitiv kann im Deutschen nicht ebenso knapp und natürlich an »Gericht« angeschlossen werden. »Gericht über« gibt den naheliegenden objektiven Bezug wieder, während »ergeht« den Eintritt des entscheidenden Gerichtsgeschehens ausdrückt, ohne κρίσις auf bloße Verurteilung zu verengen.
- source_word: κόσμου τούτου
  choice: diese Welt
  rationale: Die Wiedergabe bewahrt den Demonstrativbezug von τούτου und die johanneische Bezeichnung der gegenwärtigen, Gott entfremdeten Weltordnung, ohne daraus ausdrücklich »dieses Zeitalter« zu machen.
- source_word: ὁ ἄρχων
  choice: der Herrscher
  rationale: »Herrscher« ist im heutigen Deutsch klar und bezeichnet jemanden, der Autorität ausübt. Das traditionell mögliche »Fürst« klingt stärker historisch und ist weniger unmittelbar verständlich.
- source_word: ἐκβληθήσεται ἔξω
  choice: wird hinausgeworfen werden
  rationale: Die Formulierung erhält sowohl das Futur Passiv als auch die durch ἔξω verstärkte Vorstellung der Entfernung und Ausgrenzung.
theological_decisions:
- issue: Identität des »Herrschers dieser Welt«
  choice: Die Bezeichnung bleibt im Haupttext ohne ausdrückliche Identifizierung stehen.
  alternative: Explizite Wiedergabe oder Erklärung als Satan beziehungsweise Teufel.
  rationale: Im Johannesevangelium wird die Wendung gewöhnlich auf Satan bezogen; der griechische Text nennt jedoch den Titel und nicht den Namen. Die Übersetzung bewahrt diese Zurückhaltung, während die Fußnote die verbreitete Deutung nennt.
- issue: Bezug von κρίσις auf κόσμου τούτου
  choice: »Gericht über diese Welt«
  alternative: »Gericht dieser Welt«, möglicherweise als ein von der Welt ausgeübtes Gericht verstanden.
  rationale: Der Kontext legt nahe, dass die Welt Gegenstand des Gerichts ist. Da der griechische Genitiv formal knapper und potenziell offener ist, wird die syntaktische Verdeutlichung im Deutschen nicht zur ausdrücklichen »Verurteilung« verschärft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »jetzt« und die parallele Satzstruktur werden beibehalten. »Hinausgeworfen werden« ist kräftig und anschaulich, ohne altertümlich zu wirken.
