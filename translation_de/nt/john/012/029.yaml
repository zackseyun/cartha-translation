id: JHN.12.29
reference: John 12:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: de
  text: 'Da sagte die Menge, die dort stand und es gehört hatte, es habe gedonnert; andere sagten: »Ein Engel hat zu ihm gesprochen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die erzählerische Fortführung und den Anschluss an die Stimme im vorigen Vers; im Deutschen steht »nun« an natürlicher Satzposition.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: die Menge, die dort stand
  rationale: Gibt das substantivierte Partizip als natürlichen deutschen Relativsatz wieder; »dort« macht den im Kontext gegebenen Ort deutlich.
- source_word: ἀκούσας
  choice: es gehört hatte
  rationale: Das Plusquamperfekt bildet die Vorzeitigkeit des Aoristpartizips zur anschließenden Reaktion ab. »Es« nimmt den zuvor erwähnten Laut beziehungsweise die Stimme auf, ohne dessen Deutung vorwegzunehmen.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das deutsche Präteritum ist in erzählender Prosa idiomatisch. Eine ausdrückliche Wiedergabe als »sagte immer wieder« würde dem Imperfekt eine nicht zwingend vorhandene Iteration zuschreiben.
- source_word: βροντὴν γεγονέναι
  choice: es habe gedonnert
  rationale: Die indirekte Rede mit Konjunktiv I ist natürlich und kennzeichnet die Aussage als Wahrnehmungsdeutung der Menge. Die unpersönliche Wendung gibt den Sinn von »Donner sei geschehen« idiomatisch wieder.
- source_word: ἄλλοι
  choice: Andere
  rationale: Bezeichnet eine zweite Gruppe innerhalb der anwesenden Menge.
- source_word: Ἄγγελος
  choice: Ein Engel
  rationale: Im Zusammenhang mit der himmlischen Stimme ist ein überirdischer Bote gemeint; »Engel« ist dafür die übliche und kontextgerechte deutsche Bezeichnung.
- source_word: αὐτῷ λελάληκεν
  choice: hat zu ihm gesprochen
  rationale: »Zu ihm gesprochen« gibt den Dativ als Adressatenbezug wieder; das deutsche Perfekt bewahrt die abgeschlossene Handlung mit gegenwärtiger Relevanz.
theological_decisions:
- issue: Identität des von einem Teil der Menge angenommenen Sprechers
  choice: Ein Engel hat zu ihm gesprochen
  alternative: Ein Bote hat zu ihm gesprochen
  rationale: Der Vers berichtet die Deutung einer Stimme vom Himmel durch die Menge. »Engel« entspricht in diesem Kontext dem wahrscheinlichen überirdischen Referenten, ohne die Aussage der Menge als objektive Erklärung des Ereignisses auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher indirekter Rede. Der Unterschied zwischen den beiden Deutungen des gehörten Phänomens bleibt unverändert bestehen; das ergänzte Pronomen »es« benennt weder Stimme noch bloßen Laut und wahrt damit die Perspektive der Menge.
