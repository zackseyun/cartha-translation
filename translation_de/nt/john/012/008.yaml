id: JHN.12.8
reference: John 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: de
  text: Denn die Armen habt ihr immer bei euch, mich aber habt ihr nicht immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς πτωχούς
  choice: die Armen
  rationale: Das substantivierte Adjektiv bezeichnet arme Menschen als Gruppe. „Die Armen“ ist im Deutschen idiomatisch, knapp und entspricht der Form des griechischen Ausdrucks.
- source_word: γάρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage. „Denn“ bewahrt diese erklärende Verknüpfung in natürlichem Deutsch.
- source_word: πάντοτε
  choice: immer
  rationale: Das Adverb bezeichnet hier die fortdauernde Anwesenheit beziehungsweise Erreichbarkeit. Die gleiche Wiedergabe in beiden Satzteilen erhält den sprachlichen Kontrast.
- source_word: ἔχετε
  choice: habt
  rationale: Das Verb bezeichnet hier nicht Besitz im engen Sinn, sondern Anwesenheit und Verfügbarkeit. Das deutsche „haben“ trägt diese Bedeutung im Zusammenhang natürlich.
- source_word: μεθ’ ἑαυτῶν
  choice: bei euch
  rationale: Die Wendung bezeichnet die Anwesenheit in ihrer Gemeinschaft. „Bei euch“ ist im Deutschen natürlicher als das wörtlichere „mit euch selbst“ und passt zum hier gemeinten Verhältnis.
- source_word: ἐμέ
  choice: mich
  rationale: Das betonte Objektpronomen verweist unmittelbar auf Jesus; die schlichte Wiedergabe „mich“ ist erforderlich.
- source_word: δέ
  choice: aber
  rationale: δέ markiert den Gegensatz zwischen der bleibenden Anwesenheit der Armen und Jesu zeitlich begrenzter Anwesenheit.
- source_word: οὐ πάντοτε
  choice: nicht immer
  rationale: 'Die Stellung bei „immer“ gibt die Negation präzise wieder: Jesu Anwesenheit bei ihnen ist nicht dauerhaft.'
theological_decisions:
- issue: Möglicher Missbrauch der Aussage zur Abwertung der Fürsorge für Arme
  choice: Die Aussage wird als sachlicher Gegensatz hinsichtlich Anwesenheit und Zeitpunkt wiedergegeben, ohne eine Geringschätzung der Armen hineinzulesen.
  alternative: Eine erklärende Paraphrase, nach der Arme weniger wichtig seien, oder eine Abschwächung, die den Gegensatz verdeckt.
  rationale: Der griechische Text kontrastiert die fortdauernde Anwesenheit der Armen mit Jesu zeitlich begrenzter Anwesenheit bei den Jüngern. Er sagt nicht, dass die Sorge für Arme unwichtig sei; zugleich darf die Dringlichkeit dieses Augenblicks nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Wiederholung von „habt“ und „immer“ bewahren den pointierten Gegensatz des griechischen Textes. Keine Fußnote ist nötig, da „die Armen“ als substantiviertes Adjektiv im Deutschen ebenso natürlich und eindeutig ist wie im Griechischen.
