  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes sachgerecht wieder: γάρ als „Denn“, τοὺς πτωχούς als „die Armen“, πάντοτε in beiden Satzteilen als „immer“, μεθ’ ἑαυτῶν als idiomatisches „bei euch“ sowie den durch δέ markierten Kontrast als „aber“. Die Stellung „mich aber“ bewahrt die Betonung des griechischen ἐμέ. „Nicht immer“ gibt οὐ πάντοτε korrekt als zeitlich begrenzte Gegenüberstellung wieder.'
  naturalness: „Denn die Armen habt ihr immer bei euch, mich aber habt ihr nicht immer“ ist natürliches, modernes und zugleich würdiges Standarddeutsch. Der parallele Satzbau ist klar und prägnant.
