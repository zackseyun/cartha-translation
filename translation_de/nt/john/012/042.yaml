source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: de
  text: Dennoch glaubten sogar viele von den führenden Männern an ihn. Doch wegen der Pharisäer bekannten sie sich nicht zu ihm, um nicht aus der Synagogengemeinschaft ausgeschlossen zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Synagoge ausgeschlossen“ beziehungsweise „aus der Synagoge ausgestoßen“. Das griechische Wort bezeichnet den Ausschluss aus der Synagogengemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Dennoch
  rationale: Die Partikelverbindung drückt einen nachdrücklichen Gegensatz beziehungsweise ein Zugeständnis aus; „Dennoch“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: sogar viele von den führenden Männern
  rationale: ἐκ mit Genitiv bezeichnet die Zugehörigkeit zu einer Gruppe; ἄρχοντες meint hier führende Autoritäten. „Sogar“ bringt die hervorhebende Kraft von καί im Zusammenhang zum Ausdruck.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: glaubten … an ihn
  rationale: Die im Johannesevangelium häufige Verbindung πιστεύω εἰς bezeichnet auf Jesus gerichteten Glauben beziehungsweise Vertrauen; „an ihn glauben“ ist die natürliche deutsche Entsprechung.
- source_word: διὰ τοὺς Φαρισαίους
  choice: wegen der Pharisäer
  rationale: διά mit Akkusativ gibt hier den Grund an. Angst ist im Zusammenhang naheliegend, wird aber nicht ausdrücklich genannt und daher nicht in den Haupttext eingefügt.
- source_word: οὐχ ὡμολόγουν
  choice: bekannten sie sich nicht offen zu ihm
  rationale: Der Imperfekt beschreibt ihr fortgesetztes beziehungsweise wiederholtes Unterlassen. Das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Bezug auf Jesus erschlossen; „offen“ verdeutlicht den öffentlichen Charakter des Bekenntnisses, ohne den Glauben selbst abzuschwächen.
- source_word: ἵνα μὴ
  choice: um nicht
  rationale: Die deutsche Infinitivkonstruktion gibt die Absicht wieder, die genannte Folge zu vermeiden, und ist hier natürlicher als eine schwerfällige Nebensatzkonstruktion.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: aus der Synagogengemeinschaft ausgeschlossen zu werden
  rationale: ἀποσυνάγωγος bezeichnet den Ausschluss aus der religiösen und sozialen Gemeinschaft der Synagoge; die Formulierung wahrt den resultativen Sinn, ohne ein bestimmtes formales Rechtsverfahren vorauszusetzen.
theological_decisions:
- issue: Art des Glaubens der führenden Männer im Rahmen der johanneischen Theologie
  choice: ἐπίστευσαν wird uneingeschränkt mit „glaubten … an ihn“ wiedergegeben, während ihr ausbleibendes öffentliches Bekenntnis ausdrücklich stehen bleibt.
  alternative: Den Glauben entweder als bloß äußerliches Fürwahrhalten abzuschwächen oder als zweifelsfrei rettenden Glauben näher zu bestimmen.
  rationale: Der Vers verbindet tatsächlichen Glauben an Jesus mit fehlendem öffentlichem Bekenntnis. Die Übersetzung bewahrt diese Spannung, ohne den geistlichen Zustand der Betreffenden über die Aussage des Textes hinaus festzulegen.
- issue: Unausgesprochenes Objekt von ὡμολόγουν
  choice: Der unmittelbare Personenbezug wird mit „zu ihm“ ausgedrückt.
  alternative: „es offen bekennen“ beziehungsweise eine objektlose nominale Formulierung wie „kein offenes Bekenntnis ablegen“.
  rationale: Das Griechische nennt kein ausdrückliches Objekt. Im Kontext liegt Jesus als Bezug des Bekenntnisses nahe; die Formulierung bleibt jedoch auf das öffentliche Sich-zu-ihm-Bekennen beschränkt und macht keine weitergehende lehrmäßige Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Synagogengemeinschaft“ macht die soziale und religiöse Tragweite des Ausschlusses deutlich; die geläufigeren Alternativen stehen in der Fußnote.
