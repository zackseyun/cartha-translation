review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Elemente korrekt wieder: das für Jesus bereitete Mahl, Martas fortdauerndes Bedienen und Lazarus als einen unter den mit Jesus zu Tisch Liegenden. Die Wiedergabe von ἀνακειμένων durch „zu Tisch lagen“ ist treffend und kulturgeschichtlich angemessen.'
  naturalness: Der Text ist insgesamt gut verständlich. „Dort bereiteten sie ihm nun ein Essen zu“ ist jedoch in der Stellung von „nun“ weniger flüssig; außerdem bildet „und Lazarus“ das leicht absetzende δέ weniger deutlich ab als „Lazarus aber“.
  terminology: „Mahl“ ist als würdige, moderne Wiedergabe von δεῖπνον passend. „Zu Tisch liegen“ wahrt die konkrete Mahlhaltung. Die Fußnote sollte nicht von einem „festlichen“ Essen oder zwingend von „Polstern“ sprechen, da beides der Vers nicht ausdrücklich sagt.
  issues:
  - severity: low
    issue: Die adversativ-absetzende Nuance von δέ wird abgeschwächt.
    rationale: „Und Lazarus“ ist möglich, doch „Lazarus aber“ bildet die Gegenüberstellung von Martas Bedienung und Lazarus’ Stellung unter den Tischgenossen genauer ab.
  - severity: low
    issue: Die Fußnote enthält nicht ausdrücklich belegte kulturelle Konkretisierungen.
    rationale: Der Vers nennt weder ein festliches Essen noch Polster. Eine allgemeinere Erklärung des Liegenreklining bewahrt die Aussage ohne zusätzliche Festlegung.
  revised_text: Dort bereiteten sie ihm ein Mahl zu, und Marta bediente; Lazarus aber war einer von denen, die mit ihm zu Tisch lagen.[a]
  revised_footnotes:
  - marker: a
    text: Bei Mahlzeiten lag man damals gewöhnlich zu Tisch, statt auf Stühlen zu sitzen.
