  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: de
  text: Dort bereiteten sie ihm ein Mahl zu, und Marta bediente; Lazarus aber war einer von denen, die mit ihm zu Tisch lagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei Mahlzeiten lag man damals gewöhnlich zu Tisch, statt auf Stühlen zu sitzen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: bereiteten … zu
  rationale: ποιέω mit δεῖπνον bezeichnet hier das Zubereiten bzw. Ausrichten eines Essens. Die Formulierung ist im Deutschen natürlich und lässt offen, wer genau die Gastgeber waren.
- source_word: οὖν
  choice: nun
  rationale: οὖν führt die Erzählung aus dem vorherigen Zusammenhang weiter. „Nun“ bewahrt diese verbindende Funktion, ohne eine stärkere Schlussfolgerung auszudrücken.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet den, für den das Essen bereitet wurde; im Kontext ist Jesus gemeint.
- source_word: δεῖπνον
  choice: ein Essen
  rationale: δεῖπνον bezeichnet die Hauptmahlzeit, häufig am Abend. „Essen“ ist allgemeinverständlich und vermeidet die heute regional oder stilistisch schwankende Wirkung von „Abendmahl“ bzw. „Abendessen“.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Das Ortsadverb verweist im Kontext auf Betanien zurück.
- source_word: διηκόνει
  choice: bediente
  rationale: Im Zusammenhang einer Mahlzeit meint διακονέω das Bedienen bzw. Aufwarten. Das deutsche Präteritum ist narrativ natürlich; der Handlungsverlauf ist aus der Szene ersichtlich.
- source_word: ὁ δὲ Λάζαρος
  choice: und Lazarus
  rationale: δέ setzt hier die Beschreibung Martas mit einer leicht absetzenden weiteren Angabe fort. „Und“ gibt den Zusammenhang im Deutschen natürlicher wieder als ein stärker kontrastierendes „aber“.
- source_word: εἷς ἦν ἐκ
  choice: gehörte zu
  rationale: Die Wendung ordnet Lazarus der Gruppe der mit Jesus Speisenden zu. „Gehörte zu“ ist idiomatisches Deutsch und bewahrt den partitivischen Sinn.
- source_word: ἀνακειμένων
  choice: zu Tisch lagen
  rationale: ἀνάκειμαι bezeichnet im Mahlkontext das Liegen auf Speisepolstern. Die Formulierung bewahrt die kulturell konkrete Körperhaltung, statt sie nur mit „aßen“ wiederzugeben.
- source_word: σὺν αὐτῷ
  choice: mit ihm
  rationale: Die Präpositionalphrase bezeichnet die Gemeinschaft mit Jesus bei der Mahlzeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kulturell fremde Tischhaltung bleibt im Haupttext sichtbar und wird knapp erläutert. Die Identität derjenigen, die das Essen zubereiteten, wird entsprechend dem unbestimmten griechischen Plural nicht ergänzt.
