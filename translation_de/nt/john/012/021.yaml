id: JHN.12.21
reference: John 12:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: de
  text: 'Diese kamen nun zu Philippus, der aus Betsaida in Galiläa stammte, und baten ihn: »Herr[a], wir möchten Jesus sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische κύριε kann hier auch einfach eine respektvolle Anrede an Philippus sein, etwa im Sinn von »mein Herr« oder »verehrter Herr«.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: Diese kamen nun
  rationale: »Diese« bewahrt den Rückbezug auf die im vorigen Vers genannten Griechen; »nun« gibt den erzählerischen Anschluss durch οὖν natürlich wieder.
- source_word: προσῆλθον Φιλίππῳ
  choice: kamen zu Philippus
  rationale: Gibt die Bewegung auf Philippus zu eng am griechischen Ausdruck und zugleich idiomatisch wieder.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: der aus Betsaida in Galiläa stammte
  rationale: Die attributive Präpositionalgruppe wird als natürlicher deutscher Relativsatz wiedergegeben; »in Galiläa« verdeutlicht die geografische Zuordnung.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: baten ihn
  rationale: Im Kontext bezeichnet ἐρωτάω eine Bitte. Das deutsche Verb erfasst den fortdauernden beziehungsweise nachdrücklichen Charakter des Imperfekts hinreichend, ohne die im Deutschen schwerfällige Formel »fragten ihn und sagten« nachzubilden.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt die lexikalische Entsprechung zu κύριος. Da hier Philippus angeredet wird, kann das Wort zugleich eine höfliche Anrede sein; diese kontextuelle Möglichkeit wird in der Fußnote genannt.
- source_word: θέλομεν
  choice: wir möchten
  rationale: Gibt den Wunsch in einer höflichen direkten Bitte idiomatisch wieder; »wir wollen« wäre im heutigen Deutschen leicht schroffer als die Situation nahelegt.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: Jesus sehen
  rationale: Bewahrt die einfache und möglicherweise bewusst offene Bedeutung von ἰδεῖν, ohne sie zu »treffen« oder »sprechen mit« auszuweiten.
theological_decisions:
- issue: Anrede κύριε an Philippus
  choice: Herr
  alternative: Mein Herr; höfliche Anrede etwa im Sinn von »Herr«/»verehrter Herr«
  rationale: Die Hauptfassung wahrt die feste lexikalische Verbindung von κύριος mit »Herr«, ohne die Anrede als christologisches Bekenntnis zu verstehen. Die Fußnote hält fest, dass hier wahrscheinlich eine respektvolle Anrede an Philippus gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Redeeinleitung λέγοντες wird zugunsten natürlicher deutscher Erzählweise nicht eigens abgebildet. Der Demonstrativbezug »Diese« bleibt erhalten; die mögliche Höflichkeitsbedeutung von κύριε wird nicht stillschweigend vereindeutigt.
