id: JHN.12.44
reference: John 12:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: de
  text: 'Jesus aber rief laut: »Wer an mich glaubt, glaubt nicht an mich[a], sondern an den, der mich gesandt hat,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Damit wird nicht bestritten, dass Jesus selbst Gegenstand des Glaubens ist. Vielmehr ist der Glaube an ihn untrennbar mit dem Glauben an den verbunden, der ihn gesandt hat.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: rief laut
  rationale: κράζω bezeichnet hier eine laute, öffentliche Äußerung. »Rief laut« ist im modernen Deutsch natürlich und bewahrt den Nachdruck.
- source_word: Ὁ πιστεύων
  choice: Wer … glaubt
  rationale: Das substantivierte Partizip hat allgemeinen Sinn. Die deutsche Konstruktion mit »wer« gibt diesen Sinn idiomatisch und ohne unnötige Schwerfälligkeit wieder.
- source_word: πιστεύων / πιστεύει
  choice: glaubt
  rationale: Bei πιστεύω mit εἰς ist »an … glauben« im johanneischen Zusammenhang die etablierte und präzise deutsche Wiedergabe; die Wiederholung des Verbs bleibt erhalten.
- source_word: εἰς ἐμέ
  choice: an mich
  rationale: »An mich glauben« entspricht der idiomatischen deutschen Verbindung und bezeichnet den auf Jesus gerichteten Glauben.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: sondern an den, der mich gesandt hat
  rationale: Die Wiedergabe bewahrt den Gegensatz sowie die indirekte Bezeichnung des Sendenden, ohne im Haupttext ausdrücklich »den Vater« einzusetzen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen Übergang mit leichter Kontrastwirkung. »Aber« gibt dies knapp und natürlich wieder.
theological_decisions:
- issue: Die Aussage »glaubt nicht an mich, sondern an den, der mich gesandt hat« könnte als Leugnung verstanden werden, dass Jesus selbst Gegenstand des Glaubens ist.
  choice: Die spannungsvolle Formulierung des griechischen Textes bleibt im Haupttext unverändert erhalten.
  alternative: »glaubt nicht nur an mich« oder die ausdrückliche Ergänzung »an den Vater«
  rationale: Im Griechischen steht kein Wort für »nur«. Eine solche Ergänzung würde die theologische Spannung interpretierend auflösen. Der Satz stellt den Glauben an Jesus in untrennbare Beziehung zum Glauben an den, der ihn gesandt hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Rief laut« vermittelt die öffentliche Eindringlichkeit; »Wer … glaubt« ist natürlicher als »Der Glaubende«. Die auffällige theologische Spannung wird nicht durch die Ergänzung »nur« geglättet.
