source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: de
  text: 'Jesus antwortete: „Diese Stimme war nicht für mich bestimmt, sondern für euch.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Jesus antwortete
  rationale: Die griechische Antwortformel enthält wörtlich »antwortete und sagte«. Im heutigen Standarddeutsch gibt »antwortete« ihre Erzähl- und Gesprächsfunktion vollständig und natürlicher wieder, ohne einen eigenständigen Bedeutungsanteil zu verlieren.
- source_word: ἡ φωνὴ αὕτη
  choice: diese Stimme
  rationale: Im Zusammenhang bezeichnet φωνή die zuvor vernommene himmlische Äußerung; »Stimme« ist daher genauer als das allgemeinere »Laut« oder »Geräusch«.
- source_word: γέγονεν
  choice: ist … geschehen
  rationale: Das Perfekt von γίνομαι bezeichnet hier das erfolgte Auftreten der Stimme mit gegenwärtiger Relevanz. »Ist geschehen« bewahrt die Ereignisbedeutung und passt zum gehobenen, aber verständlichen Register.
- source_word: δι’ ἐμὲ … δι’ ὑμᾶς
  choice: um meinetwillen … um euretwillen
  rationale: διά mit Akkusativ wird in beiden parallelen Wendungen am besten final beziehungsweise benefaktiv verstanden. »Um … willen« wahrt den Kontrast und lässt sowohl Zweck als auch Nutzen anklingen.
- source_word: Οὐ … ἀλλὰ
  choice: nicht … sondern
  rationale: Die ausschließende Gegenüberstellung wird im Deutschen unmittelbar und idiomatisch mit »nicht … sondern« wiedergegeben.
theological_decisions:
- issue: Zweck beziehungsweise Nutzen der himmlischen Stimme
  choice: Die Stimme geschah nicht Jesus zugute, sondern den Umstehenden zugute.
  alternative: Die Stimme geschah wegen Jesus beziehungsweise wegen der Umstehenden.
  rationale: Der Kontext und der genaue Parallelismus von διά mit Akkusativ sprechen für eine finale oder benefaktive Deutung. Die Formulierung »um … willen« bewahrt jedoch mehr von der semantischen Spannweite als eine ausdrücklich erklärende Wiedergabe wie »zu eurem Nutzen« und fügt keine Aussage darüber hinzu, weshalb Jesus selbst die Stimme nicht benötigte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Antwortformel wird idiomatisch verkürzt; »um meinetwillen … um euretwillen« ist leicht gehoben, aber allgemein verständlich und bildet den griechischen Parallelismus prägnant ab.
