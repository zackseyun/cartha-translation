  source_fidelity: Die Übersetzung gibt den Kontrast οὐ ... ἀλλά sowie die im Kontext naheliegende benefaktive/finale Bedeutung von δι’ ἐμέ ... δι’ ὑμᾶς zutreffend wieder. Die idiomatische Verkürzung der Antwortformel zu „Jesus antwortete“ ist im Deutschen vertretbar. Allerdings ist „eine Stimme ist ... geschehen“ kein natürliches modernes Standarddeutsch und verdeckt dadurch die Aussage des Perfekts γέγονεν.
  naturalness: „Diese Stimme ist nicht um meinetwillen geschehen“ wirkt im heutigen Standarddeutsch unidiomatisch. „Diese Stimme war nicht für mich bestimmt, sondern für euch“ ist klar, natürlich und gibt den kontextuell gemeinten Zweck beziehungsweise Nutzen wieder.
