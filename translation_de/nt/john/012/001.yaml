id: JHN.12.1
reference: John 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: de
  text: Jesus kam also sechs Tage vor dem Passafest nach Betanien, wo Lazarus war, den Jesus von den Toten[a] auferweckt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus der Mitte der Toten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: also
  rationale: „Also“ gibt den rückbezüglichen erzählerischen Anschluss natürlich wieder, ohne eine stärkere Schlussfolgerung auszudrücken, als der Zusammenhang verlangt.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: sechs Tage vor dem Passafest
  rationale: Die griechische Zeitangabe wird idiomatisch wiedergegeben. „Passafest“ bezeichnet hier das bekannte jüdische Fest und ist im Deutschen eindeutiger als das bloße „Passa“.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: kam … nach Betanien
  rationale: „Kam nach“ ist eine natürliche deutsche Wiedergabe der gerichteten Bewegung; „Betanien“ entspricht der etablierten deutschen Namensform.
- source_word: ὅπου ἦν Λάζαρος
  choice: wo Lazarus war
  rationale: Die schlichte Ortsangabe bleibt erhalten. Präzisierungen wie „wohnte“ oder „sich aufhielt“ würden nicht ausdrücklich genannte Informationen hinzufügen.
- source_word: ἤγειρεν
  choice: auferweckt hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass die Auferweckung vor Jesu Ankunft geschah. Im Zusammenhang mit Lazarus gibt „auferweckt“ den Sinn von ἐγείρω angemessen wieder.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die natürliche deutsche Auferstehungsformel; die räumlicher klingende Grundbedeutung „aus der Mitte der Toten“ wird in der Fußnote sichtbar gemacht.
theological_decisions:
- issue: Bezeichnung Jesu als desjenigen, der Lazarus auferweckte
  choice: den Jesus von den Toten auferweckt hatte
  alternative: den er von den Toten auferweckt hatte
  rationale: Der griechische Text nennt am Ende des Relativsatzes ausdrücklich nochmals Ἰησοῦς. Die Wiederholung wird beibehalten, damit die ausdrückliche Identifizierung Jesu als Handelnder nicht abgeschwächt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung folgt natürlichem Deutsch, bewahrt aber den erzählerischen Anschluss durch „also“ und die ausdrückliche Wiederholung des Namens Jesus.
