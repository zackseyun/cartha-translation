  source_fidelity: Der Entwurf gibt die Abfolge von εὑρών und ἐκάθισεν zutreffend wieder und bewahrt die schlichte Aussage, dass Jesus einen jungen Esel fand und sich auf ihn setzte. „Wie geschrieben steht“ entspricht der griechischen Schriftzitat-Formel καθώς ἐστιν γεγραμμένον angemessen, ohne Jesu Motiv über den Text hinaus zu bestimmen.
  naturalness: „Jesus aber fand einen jungen Esel und setzte sich darauf“ ist natürliches, würdiges modernes Standarddeutsch. Das vorangestellte „aber“ ist als herkömmlich-zurückhaltende Wiedergabe des erzählfortführenden δέ vertretbar und erzeugt keinen unangemessen starken Gegensatz.
  terminology: „Junger Esel“ ist für ὀνάριον sachgerecht und weniger einengend als „Eselsfohlen“. Die Fußnote bietet „Eselsfohlen“ zutreffend als lexikalische Alternative an und erläutert die häufige Bedeutung als junges Tier, ohne sie zur zwingenden Bedeutung zu machen.
