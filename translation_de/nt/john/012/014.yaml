  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: de
  text: 'Jesus aber fand einen jungen Esel[a] und setzte sich darauf, wie geschrieben steht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Eselsfohlen“. Das griechische Wort bezeichnet einen Esel, häufig einen jungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: fand
  rationale: Das vorzeitige Aoristpartizip wird im natürlichen modernen Deutsch als koordinierte Verbform wiedergegeben; die Abfolge bleibt durch die Wortstellung erkennbar.
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein leichter fortführender Konnektor. „Aber“ wahrt den Anschluss und einen möglichen schwachen Gegensatz, ohne ihn stark zu betonen.
- source_word: ὀνάριον
  choice: einen jungen Esel
  rationale: Das Diminutiv ὀνάριον bezeichnet einen Esel, häufig einen jungen. Die Formulierung ist verständlich und vermeidet die zusätzliche Festlegung von „Eselsfohlen“.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: setzte sich darauf
  rationale: Dies gibt die einfache Handlung idiomatisch wieder; „bestieg ihn“ wäre stärker deutend.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: wie geschrieben steht
  rationale: Die geläufige deutsche Zitationsformel bewahrt sowohl den Vergleichsbezug als auch den fortbestehenden Geltungsaspekt des griechischen Perfekts.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der griechische Artikel vor dem Eigennamen wird nach üblichem deutschem Sprachgebrauch nicht wiedergegeben.
theological_decisions:
- issue: Verhältnis von Jesu Handlung zum anschließenden Schriftzitat
  choice: Die Handlung wird als Entsprechung zur Schrift dargestellt, ohne Jesu Absicht ausdrücklich zu bestimmen.
  alternative: Die Formulierung könnte eine bewusste prophetische Inszenierung ausdrücklich nahelegen.
  rationale: Der Vers berichtet die Handlung und führt danach das Schriftzitat ein. Er zeigt die prophetische Entsprechung, benennt an dieser Stelle aber nicht ausdrücklich Jesu Motiv.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialkonstruktion wurde zugunsten natürlicher deutscher Erzählweise aufgelöst; der Doppelpunkt bereitet das folgende Schriftzitat vor.
