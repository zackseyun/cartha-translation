id: JHN.7.13
reference: John 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: de
  text: Doch niemand sprach offen über ihn, aus Angst vor den Juden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in diesem Zusammenhang genauer: „den jüdischen Führern“ oder „den judäischen Behörden“. Im Johannesevangelium kann „die Juden“ allgemein das jüdische Volk bezeichnen, an manchen Stellen aber auch die in Jerusalem ansässigen Autoritäten, die Jesus ablehnten.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: niemand
  rationale: Das umfassende negative Indefinitpronomen wird im Deutschen natürlich und genau mit „niemand“ wiedergegeben.
- source_word: μέντοι
  choice: doch
  rationale: „Doch“ kennzeichnet knapp den milden Gegensatz zur vorausgehenden Diskussion und entspricht dem modernen Erzählstil.
- source_word: παρρησίᾳ
  choice: offen
  rationale: Im Zusammenhang geht es um unverdecktes, öffentlich wahrnehmbares Reden; „offen“ bewahrt diesen Sinn, ohne ein zusätzliches Moment besonderer Kühnheit aufzudrängen.
- source_word: ἐλάλει
  choice: sprach
  rationale: Das deutsche Präteritum ist in erzählender Prosa idiomatisch; der fortdauernde beziehungsweise wiederholte Charakter ergibt sich zusammen mit „niemand“ und dem situativen Kontext.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: Dies ist die natürliche moderne Entsprechung für περί mit Genitiv.
- source_word: διὰ τὸν φόβον
  choice: aus Angst
  rationale: Die Wendung gibt den kausalen Sinn von διά mit Akkusativ idiomatisch wieder und bewahrt die nominale Formulierung.
- source_word: τῶν Ἰουδαίων
  choice: den Juden
  rationale: Die direkte Wiedergabe erhält die lexikalische und erzählerische Mehrdeutigkeit von Ἰουδαῖοι; eine Fußnote erläutert den im Kontext möglichen engeren Bezug auf jüdische Führungspersonen beziehungsweise judäische Behörden.
theological_decisions:
- issue: Bezugsgruppe von τῶν Ἰουδαίων im Johannesevangelium
  choice: „den Juden“ im Haupttext, mit erläuternder Fußnote
  alternative: „den jüdischen Führern“ oder „den judäischen Behörden“
  rationale: Der griechische Ausdruck kann je nach Zusammenhang das jüdische Volk allgemein, Judäer oder insbesondere Jerusalemer Autoritäten bezeichnen. Die direkte Wiedergabe wahrt diese Spannung; die Fußnote verhindert zugleich, dass die Aussage pauschal und anachronistisch auf alle Juden bezogen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch niemand sprach offen über ihn“ ist knapp und gut verständlich; „aus Angst vor“ gibt die Ursache natürlich wieder. Die historisch sensible Mehrdeutigkeit von „den Juden“ bleibt im Haupttext erhalten und wird in der Fußnote eingeordnet.
