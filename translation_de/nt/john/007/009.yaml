  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: de
  text: Nachdem er das gesagt hatte, blieb er selbst in Galiläa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: das
  rationale: Das substantivisch gebrauchte Neutrum fasst im natürlichen modernen Deutsch die unmittelbar vorausgehenden Worte zusammen; „diese Dinge“ wäre unnötig wörtlich und unidiomatisch.
- source_word: δὲ … εἰπὼν
  choice: Nachdem er … gesagt hatte
  rationale: Die Konstruktion wird als zeitlicher Übergang wiedergegeben. Der Aoristpartizip bezeichnet hier eine Handlung, die dem Bleiben vorausgeht; δέ bedarf im Deutschen keiner eigenen adversativen Übersetzung.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen kann eine leichte Hervorhebung beziehungsweise einen Kontrast zu den Brüdern im Kontext tragen. „Er selbst“ bewahrt diese mögliche Nuance, ohne sie weiter auszudeuten.
- source_word: ἔμεινεν
  choice: blieb
  rationale: „Blieb“ gibt die narrative Bedeutung von μένω hier präzise und idiomatisch wieder; „verweilte“ wäre im modernen Deutsch gehobener und weniger natürlich.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: in Galiläa
  rationale: Schlichte und natürliche Wiedergabe der Ortsangabe.
theological_decisions: []
translation_notes:
