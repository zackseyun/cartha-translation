  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: »Ein einziges Werk[a] habe ich getan, und ihr alle wundert euch darüber.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »eine Werk« bezieht sich wahrscheinlich auf die Heilung des gelähmten Mannes am Sabbat (Johannes 5,1–18).
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: antwortete
  rationale: Die griechische Doppelformel wird im natürlichen modernen Deutsch idiomatisch mit einem einzigen Verb wiedergegeben; der Sinn des Antwortens bleibt erhalten.
- source_word: Ἓν ἔργον
  choice: ein einziges Werk
  rationale: »Ein einziges« erhält die Hervorhebung des Zahlworts; »Werk« bewahrt den johanneischen Leitbegriff für Jesu Taten.
- source_word: ἐποίησα
  choice: habe ich getan
  rationale: Das deutsche Perfekt gibt die abgeschlossene Tat in direkter Rede natürlich wieder.
- source_word: πάντες
  choice: ihr alle
  rationale: Die Formulierung macht deutlich, dass die gesamte angesprochene Gruppe gemeint ist.
- source_word: θαυμάζετε
  choice: wundert euch darüber
  rationale: Die Übersetzung wahrt das Präsens sowie die mögliche Spannung zwischen Erstaunen und Befremden; »darüber« nimmt idiomatisch auf das genannte Werk Bezug.
theological_decisions:
- issue: Johanneische Bedeutung von ἔργον
  choice: Werk
  alternative: Tat
  rationale: »Werk« erhält die wiederkehrende johanneische Bezeichnung für Jesu Handlungen und ihre theologische Bedeutung, ohne diese im Haupttext näher auszudeuten.
- issue: Bezug des einen Werkes
  choice: nur in einer Fußnote als wahrscheinlicher Rückbezug erläutert
  alternative: die Heilung ausdrücklich in den Haupttext einsetzen
  rationale: Der griechische Text nennt das Werk nicht näher. Der wahrscheinliche Bezug auf die Sabbatheilung aus Johannes 5 darf daher nicht Bestandteil des Haupttextes werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die semitisch geprägte Doppelformel »antwortete und sagte« wurde zugunsten natürlichen Deutschen zu »antwortete« zusammengezogen. »Werk« hält den johanneischen Schlüsselbegriff fest; »wundert euch« lässt offen, ob Erstaunen oder Befremden überwiegt.
