  source_fidelity: Der Entwurf gibt die zeitliche Abfolge von Ὡς δὲ … τότε, das additive καὶ αὐτός sowie die Bewegungsrichtung von ἀναβαίνω angemessen wieder. „Nicht öffentlich, sondern wie im Verborgenen“ erhält sowohl den Gegensatz οὐ … ἀλλά als auch die Qualifizierung durch ὡς, ohne den erzählerischen Spannungsbogen zu harmonisieren.
