id: JHN.7.10
reference: John 7:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: de
  text: Als aber seine Brüder zum Fest hinaufgezogen waren, ging auch er hinauf, nicht öffentlich, sondern wie im Verborgenen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern im Verborgenen“. Der griechische Ausdruck lautet wörtlich „sondern wie im Verborgenen“ und kann die Aussage etwas abschwächen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als aber
  rationale: ὡς mit dem Aorist leitet einen temporalen Nebensatz ein; δέ markiert einen leichten Übergang beziehungsweise Kontrast zum vorherigen Zusammenhang.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: hinaufgezogen waren ... ging ... hinauf
  rationale: Die Vorzeitigkeit des ersten Aorists wird im Deutschen durch das Plusquamperfekt deutlich. „Hinauf“ bewahrt sowohl die geografische Bewegung nach Jerusalem als auch den Sprachgebrauch einer Festpilgerreise.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Brüder
  rationale: Im unmittelbaren Erzählzusammenhang bezeichnet ἀδελφοί Jesu männliche Geschwister; „Brüder“ ist daher kontextuell und grammatisch präzise.
- source_word: εἰς τὴν ἑορτήν
  choice: zum Fest
  rationale: ἑορτή bezeichnet hier das im Kontext genannte Laubhüttenfest. „Zum Fest“ ist knapp, natürlich und wahrt den bestimmten Bezug.
- source_word: τότε καὶ αὐτὸς
  choice: ging auch er
  rationale: Das anschließende Hauptsatztempus gibt τότε ausreichend wieder, während „auch er“ den additiven Nachdruck von καὶ αὐτός erhält.
- source_word: οὐ φανερῶς
  choice: nicht öffentlich
  rationale: φανερῶς bedeutet offen beziehungsweise öffentlich. Im Zusammenhang einer Reise zum Fest bringt „nicht öffentlich“ den Gegensatz zu verborgenem Vorgehen natürlich zum Ausdruck.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: sondern wie im Verborgenen
  rationale: Die Wiedergabe erhält das qualifizierende ὡς („wie“) und glättet die Formulierung nicht zu einer uneingeschränkten Aussage „heimlich“.
theological_decisions:
- issue: Verhältnis von Jesu Handeln zu seiner früheren Aussage über den Festbesuch
  choice: 'Der Vers wird ohne Harmonisierung wiedergegeben: Jesus zieht später und nicht öffentlich hinauf.'
  alternative: Durch eine Paraphrase andeuten, Jesus habe seine Absicht geändert, oder den möglichen Spannungsbogen zu 7,8 ausdrücklich auflösen.
  rationale: Der griechische Text berichtet lediglich die zeitliche Folge und die nicht öffentliche Art seines Hinaufziehens. Eine darüber hinausgehende Erklärung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt verdeutlicht die zeitliche Abfolge; „wie im Verborgenen“ bewahrt die auffällige und leicht qualifizierende Formulierung des griechischen Textes.
