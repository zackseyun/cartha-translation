  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: de
  text: 'Da sagten einige der Einwohner Jerusalems: „Ist das nicht der, den sie zu töten suchen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt die Äußerung innerhalb der laufenden Szene. Im natürlichen deutschen Erzählstil gibt das Präteritum „sagten“ diesen Hintergrund angemessen wieder; „sagten immer wieder“ würde eine Wiederholung stärker festlegen, als der Kontext verlangt.
- source_word: οὖν
  choice: Da
  rationale: „Da“ markiert knapp und idiomatisch die narrative Folgerung beziehungsweise Fortsetzung aus dem vorangehenden Geschehen.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: einige von den Einwohnern Jerusalems
  rationale: Die Formulierung bewahrt mit „von“ den partitiven Sinn von ἐκ und gibt Ἱεροσολυμιτῶν verständlich als Bewohner der Stadt wieder.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ist das nicht der
  rationale: Die verneinte Frage legt eine bejahende Antwort nahe. Das demonstrative „das“ ist bei einer identifizierenden Frage über eine anwesende Person im modernen Deutsch natürlich.
- source_word: ζητοῦσιν
  choice: suchen
  rationale: „Zu töten suchen“ bewahrt den gegenwärtigen, zielgerichteten Versuch, ohne das Verb vorschnell nur als Wunsch oder Absicht auszulegen.
- source_word: ἀποκτεῖναι
  choice: zu töten
  rationale: „Töten“ gibt die direkte lexikalische Bedeutung wieder und fügt keine ausdrücklich gerichtliche Nuance hinzu.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und rhetorisch. Kein Fußnotenbedarf, da „Einwohner Jerusalems“ die Herkunfts- beziehungsweise Zugehörigkeitsangabe präzise und natürlich wiedergibt.
