source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: de
  text: Wer an mich glaubt – wie die Schrift gesagt hat –, aus dessen Innerstem werden Ströme lebendigen Wassers fließen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dessen Bauch“ oder „aus dessen Leib“; gemeint ist hier wahrscheinlich das Innerste des Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Manche verstehen „dessen“ nicht als Hinweis auf den Glaubenden, sondern auf den Messias: Aus seinem Inneren werden Ströme lebendigen Wassers fließen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Wer an mich glaubt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jeden Menschen, der glaubt. „Wer … glaubt“ ist im Deutschen natürlich und bewahrt den generischen Charakter; εἰς ἐμέ wird idiomatisch mit „an mich“ wiedergegeben.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: wie die Schrift gesagt hat
  rationale: Die Formulierung führt die Schrift als bleibend gültiges Zeugnis an. Das deutsche Perfekt klingt in dieser Zitierformel natürlich und gibt den griechischen Aorist angemessen wieder.
- source_word: ποταμοὶ
  choice: Ströme
  rationale: Das Wort bezeichnet Flüsse beziehungsweise große Wasserströme. „Ströme“ bewahrt hier das Bild überwältigender Fülle natürlicher als das konkrete „Flüsse“.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: aus dessen Innerstem
  rationale: κοιλία bedeutet wörtlich „Bauch“ oder „Leib“, bezeichnet hier aber bildlich das innere Zentrum eines Menschen. „Innerstes“ erhält die körperlich-räumliche Metapher, ohne im heutigen Deutsch irreführend anatomisch zu wirken. „Dessen“ bezieht sich grammatisch auf den Glaubenden, ohne ein generisches männliches Pronomen zu erzwingen.
- source_word: ῥεύσουσιν
  choice: werden … fließen
  rationale: Die Zukunftsform wird direkt wiedergegeben; „fließen“ fügt dem Verb keine im Ausgangstext nicht ausdrücklich enthaltene Intensität hinzu.
- source_word: ὕδατος ζῶντος
  choice: lebendigen Wassers
  rationale: Die feste johanneische Metapher „lebendiges Wasser“ bewahrt sowohl das Bild von frischem, fließendem Wasser als auch seine theologische Tiefe.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: 'Das Pronomen wird auf den glaubenden Menschen bezogen: Aus dessen Innerstem fließen die Ströme.'
  alternative: 'Das Pronomen beziehungsweise die Ursprungsangabe kann auf den Messias bezogen werden: Aus seinem Inneren fließt das lebendige Wasser.'
  rationale: Der grammatisch nächstliegende Bezug ist ὁ πιστεύων; zudem erklärt Vers 39 das Bild mit dem Geist, den die Glaubenden empfangen sollten. Da eine messianische Deutung syntaktisch und traditionsgeschichtlich vertreten wird, wird sie in einer Fußnote offengehalten.
- issue: Bildgehalt von κοιλία
  choice: Innerstes
  alternative: Bauch, Leib
  rationale: Die Übersetzung gibt den bildlichen Sinn als inneres Zentrum der Person wieder, während die Fußnote den konkreten Wortlaut transparent macht.
- issue: Zuordnung von καθὼς εἶπεν ἡ γραφή
  choice: Die Schriftformel wird durch Gedankenstriche eng mit der gesamten folgenden Aussage verbunden, ohne ein bestimmtes alttestamentliches Einzelzitat zu behaupten.
  alternative: Die Formel kann stärker mit „Wer an mich glaubt“ oder ausschließlich mit der Aussage über die Wasserströme verbunden werden.
  rationale: Wortstellung und Interpunktion lassen mehrere syntaktische Akzentsetzungen zu. Die deutsche Zeichensetzung soll die Schriftbegründung kenntlich machen, ohne die im Griechischen nicht vollständig aufgelöste Zuordnung unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wer an mich glaubt“ ist allgemein verständlich und geschlechtsübergreifend. „Ströme“ erhält die Fülle des Bildes; „Innerstes“ vermeidet eine im Deutschen leicht komisch oder rein anatomisch wirkende Wiedergabe mit „Bauch“. Die beiden Fußnotenmarker stehen am Versende, weil beide die Aussage über den Ursprung der Wasserströme erläutern.
