  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: „Meine Zeit ist noch nicht da; eure Zeit dagegen ist immer günstig.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Zeit ist jederzeit bereit“. Das griechische Wort für „Zeit“ kann einen passenden oder bestimmten Zeitpunkt beziehungsweise eine Gelegenheit bezeichnen; „bereit“ gibt das griechische Wort für „bereit, vorbereitet“ näher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die folgernde Fortsetzung des Gesprächs und klingt im modernen deutschen Erzählstil natürlich.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: sagte Jesus
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil im Präteritum wiedergegeben.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Gibt das Dativobjekt ohne eine im Vers selbst nicht ausdrücklich genannte Identifizierung wieder.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: meine Zeit
  rationale: Bewahrt die betonte Zuordnung zu Jesus, ohne καιρός mit dem johanneischen Begriff „Stunde“ (ὥρα) gleichzusetzen.
- source_word: οὔπω πάρεστιν
  choice: ist noch nicht da
  rationale: Gibt die zeitliche Aussage idiomatisch und nahe am Sinn von πάρεστιν („ist gegenwärtig/ist eingetroffen“) wieder.
- source_word: δὲ
  choice: dagegen
  rationale: Macht den deutlichen Gegensatz zwischen Jesu Zeit und der Zeit seiner Gesprächspartner sichtbar.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: eure Zeit
  rationale: Spiegelt die Formulierung „meine Zeit“ und erhält dadurch den Kontrast.
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: ist immer günstig
  rationale: Bei einer „Zeit“ meint ἕτοιμος, dass sie jederzeit passend beziehungsweise verfügbar ist; „günstig“ ergibt eine natürliche deutsche Verbindung und bewahrt den Gelegenheitsaspekt von καιρός.
theological_decisions:
- issue: Bedeutung von Jesu „Zeit“ im johanneischen Zusammenhang
  choice: „Meine Zeit“
  alternative: „Meine festgesetzte Zeit“ oder „Meine Stunde“
  rationale: καιρός kann einen passenden oder bestimmten Zeitpunkt bezeichnen, doch der Text sagt nicht ausdrücklich, wer ihn festgesetzt hat. Zudem steht hier nicht ὥρα („Stunde“). Die knappe Wiedergabe erhält die theologische Bedeutungsoffenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon-Satzbau bewahrt die enge Gegenüberstellung der beiden Satzhälften. „Zeit“ bleibt bewusst unentfaltet; die Fußnote erläutert den Bedeutungsumfang von καιρός und die wörtlichere Wiedergabe von ἕτοιμος.
