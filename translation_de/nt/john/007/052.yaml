source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: de
  text: 'Sie erwiderten ihm: „Bist du etwa auch aus Galiläa? Forsche nach und sieh: Aus Galiläa tritt kein Prophet auf.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus Galiläa wird kein Prophet erweckt.“ Das griechische Verb kann auch andeuten, dass Gott einen Propheten erweckt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sie erwiderten ihm
  rationale: Die im Griechischen übliche Doppelwendung bedeutet idiomatisch „antworten/erwidern“. Die knappe deutsche Form vermeidet die unnatürliche Redundanz „sie antworteten und sagten ihm“, ohne den Sinn zu verkürzen.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Bist du etwa auch aus Galiläa?
  rationale: „Etwa“ gibt in einer natürlichen deutschen Frage die durch μή signalisierte Erwartung einer verneinenden Antwort und den spöttisch-abweisenden Ton wieder.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Forsche nach und sieh
  rationale: Die beiden Imperative bleiben erhalten. „Forsche nach“ bezeichnet eine gründliche Prüfung, während „sieh“ die daraus zu gewinnende Einsicht ausdrückt.
- source_word: ἐκ τῆς Γαλιλαίας προφήτης
  choice: Aus Galiläa … kein Prophet
  rationale: Das artikellose προφήτης bezeichnet hier allgemein einen Propheten, nicht ausdrücklich „den Propheten“ als bestimmte endzeitliche Gestalt.
- source_word: οὐκ ἐγείρεται
  choice: tritt … nicht auf
  rationale: Die mediale/passive Form kann hier idiomatisch das Hervortreten oder Erscheinen eines Propheten bezeichnen. „Tritt … auf“ ist gegenwärtiges, verständliches Deutsch; die mögliche passivische Nuance wird in der Fußnote bewahrt.
theological_decisions:
- issue: Rhetorische Kraft der mit μή eingeleiteten Frage
  choice: „Bist du etwa auch aus Galiläa?“
  alternative: „Du bist doch nicht etwa auch aus Galiläa?“
  rationale: Die gewählte Form macht die erwartete Verneinung und den abweisenden Ton im Deutschen erkennbar, ohne die Frage unnötig zu überzeichnen.
- issue: Bedeutung und Diathese von ἐγείρεται
  choice: „tritt … auf“
  alternative: „wird … erweckt“
  rationale: Im Zusammenhang geht es wahrscheinlich darum, dass ein Prophet aus einer Region hervorgeht beziehungsweise dort erscheint. Da das griechische Passiv zugleich an Gottes Erwecken eines Propheten denken lassen kann, wird diese theologisch relevante Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schroffe, herablassende Frage bleibt hörbar; zugleich wird die griechische Erzählformel idiomatisch statt mechanisch wiedergegeben.
