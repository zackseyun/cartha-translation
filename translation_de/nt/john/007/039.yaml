id: JHN.7.39
reference: John 7:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: de
  text: Das sagte er über den Geist, den die empfangen sollten, die an ihn glaubten; denn der Geist war noch nicht da[a], weil Jesus noch nicht verherrlicht worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn der Geist war noch nicht“. Gemeint sein kann: „denn der Geist war noch nicht gegeben“. Das griechische Wort für „gegeben“ steht jedoch nicht im Text.'
    reason: Die knappe griechische Formulierung ist im Deutschen ohne Ergänzung ungewöhnlich und theologisch spannungsvoll; die Fußnote dokumentiert sowohl den Wortlaut als auch die verbreitete Deutung.
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: der Geist
  rationale: Im Zusammenhang ist Gottes Geist gemeint. „Heiliger Geist“ wäre sachlich naheliegend, würde aber das im Griechischen nicht vorhandene ἅγιον ergänzen.
- source_word: οὗ
  choice: den
  rationale: Das Relativpronomen bezieht sich auf „den Geist“; der deutsche Akkusativ ergibt sich aus „empfangen“.
- source_word: ἔμελλον λαμβάνειν
  choice: empfangen sollten
  rationale: Die Verbindung bezeichnet aus der damaligen Erzählperspektive ein bevorstehendes Geschehen; „sollten“ gibt diesen prospektiven Sinn natürlich wieder, ohne zwingend eine Verpflichtung auszudrücken.
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: die an ihn glaubten
  rationale: Die substantivierte Aoristpartizipialform bezeichnet die Glaubenden beziehungsweise diejenigen, die zum Glauben gekommen waren. Das schlichte Präteritum ist im deutschen Erzählzusammenhang natürlich und vermeidet eine unnötig festgelegte Vorzeitigkeit.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: denn der Geist war noch nicht da
  rationale: Die ungewöhnlich knappe Aussage wird eng wiedergegeben. „Da“ macht den deutschen Satz verständlich, ohne das im Griechischen fehlende „gegeben“ ausdrücklich einzufügen; die verbleibende theologische Spannung wird durch die Fußnote transparent gemacht.
- source_word: ἐδοξάσθη
  choice: verherrlicht worden war
  rationale: „Verherrlichen“ bewahrt den für das Johannesevangelium wichtigen Wortstamm und lässt dessen Bezug auf Tod, Auferstehung und Erhöhung offen.
theological_decisions:
- issue: Wie οὔπω γὰρ ἦν πνεῦμα wiederzugeben ist, ohne eine Aussage über die Nichtexistenz des Geistes vor Jesu Verherrlichung festzuschreiben
  choice: „denn der Geist war noch nicht da“ im Haupttext, mit wörtlicher und erläuternder Alternative in der Fußnote
  alternative: „denn der Geist war noch nicht gegeben“ oder ganz wörtlich „denn der Geist war noch nicht“
  rationale: Das Griechische enthält weder „gegeben“ noch ein anderes ergänzendes Verb. Die deutsche Wendung wahrt die auffällige Spannung und bleibt lesbar; die Fußnote legt offen, wo die Übersetzung idiomatisch ergänzt und welche Deutung häufig angenommen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Hauptsatz bleibt klar und knapp. „War noch nicht da“ ist bewusst näher am ungewöhnlichen griechischen Wortlaut als die stärker deutende Formulierung „war noch nicht gegeben“.
