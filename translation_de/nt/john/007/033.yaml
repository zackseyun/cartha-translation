id: JHN.7.33
reference: John 7:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: de
  text: 'Da sagte Jesus: „Ich bin nur noch kurze Zeit bei euch[a] und gehe zu dem, der mich gesandt hat[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Noch eine kurze Zeit bin ich bei euch.“'
    reason: lexical_alternative
  - marker: b
    text: Mit dem, der Jesus gesandt hat, ist im weiteren Zusammenhang des Johannesevangeliums der Vater gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die erzählerische und folgernde Fortsetzung des vorausgehenden Geschehens, ohne ein stärkeres Kausalverhältnis auszudrücken.
- source_word: Ἔτι χρόνον μικρόν
  choice: nur noch kurze Zeit
  rationale: Gibt sowohl ἔτι („noch“) als auch χρόνον μικρόν („kurze Zeit“) in natürlichem modernem Deutsch wieder.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: bin ich bei euch
  rationale: Bewahrt die schlichte präsentische Aussage über Jesu fortdauernde Gegenwart bei seinen Hörern.
- source_word: καὶ ὑπάγω
  choice: und gehe
  rationale: Gibt die einfache Verknüpfung und das johanneische Verb für Jesu Weggang knapp wieder. Das deutsche Präsens kann hier wie das griechische Präsens auf das bevorstehende Geschehen weisen, ohne ein nicht ausdrücklich vorhandenes „dann“ einzufügen.
- source_word: πρὸς τὸν πέμψαντά με
  choice: zu dem, der mich gesandt hat
  rationale: Gibt das substantivierte Partizip relational wieder und macht den im Vers selbst nicht genannten Absender nicht ausdrücklich zum Vater.
theological_decisions:
- issue: Identität dessen, der Jesus gesandt hat
  choice: Die relationale Formulierung „der mich gesandt hat“ bleibt im Haupttext erhalten.
  alternative: „zu meinem Vater, der mich gesandt hat“
  rationale: Im weiteren Johanneskontext ist der Vater gemeint; der griechische Vers bezeichnet ihn jedoch indirekt. Die Übersetzung bewahrt diese Ausdrucksweise, während eine Fußnote den Kontext erläutert.
- issue: Zeitliche Beziehung zwischen Jesu Bleiben und Weggehen
  choice: „und gehe“ ohne eingefügtes „dann“
  alternative: „und dann gehe ich“
  rationale: Der zeitliche Ablauf ist aus dem Zusammenhang erschließbar, doch καί bedeutet hier zunächst schlicht „und“. Die Übersetzung macht die Abfolge nicht stärker ausdrücklich als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit „nur noch kurze Zeit“ ist idiomatisch und bewahrt den Nachdruck auf der knapp verbleibenden Zeit. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
