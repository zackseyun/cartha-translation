  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: de
  text: 'Nikodemus, der schon früher zu ihm gekommen war und zu ihnen gehörte, sagte zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Νικόδημος
  choice: Nikodemus
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet nach einem Verb des Sprechens die Adressaten.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: der schon früher zu ihm gekommen war
  rationale: Die artikulierte Partizipialkonstruktion identifiziert Nikodemus näher. Das Plusquamperfekt drückt die Vorzeitigkeit aus; »ihm« bewahrt die pronominale Form des Griechischen.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: und zu ihnen gehörte
  rationale: Die natürliche deutsche Formulierung gibt die Zugehörigkeit zur angesprochenen Gruppe wieder, ohne das Partizip kausal auszulegen.
theological_decisions:
- issue: Bezugswort von αὐτόν in der Wendung über Nikodemus' früheres Kommen
  choice: Das Pronomen bleibt im Vers als »ihm« stehen; im Kontext bezieht es sich auf Jesus.
  alternative: Jesus im Haupttext ausdrücklich nennen.
  rationale: Johannes 3,1–2 macht den Bezug auf Jesus deutlich. Die pronominale Wiedergabe erhält jedoch die Form und geringe syntaktische Mehrdeutigkeit des Ausgangstextes.
- issue: Funktion von εἷς ὢν ἐξ αὐτῶν
  choice: 'Als identifizierende Hintergrundangabe: »und zu ihnen gehörte«.'
  alternative: 'Kausal wiedergeben: »weil er einer von ihnen war«.'
  rationale: Die Partizipialkonstruktion bezeichnet sicher Nikodemus' Gruppenzugehörigkeit, markiert aber keinen eindeutigen Kausalzusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die beiden näheren Angaben zu Nikodemus vor dem Redeverb zusammen; der Doppelpunkt leitet seine in Vers 51 folgende Rede ein.
