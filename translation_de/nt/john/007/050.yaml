  source_fidelity: 'Die Übersetzung gibt sämtliche Bestandteile des griechischen Satzes wieder: Nikodemus als Subjekt, die frühere Begegnung mit dem pronominal belassenen »ihm«, seine Zugehörigkeit zur angesprochenen Gruppe sowie seine an diese Gruppe gerichtete Rede. Das Präteritum »sagte« ist eine idiomatische deutsche Wiedergabe des historischen Präsens λέγει. Der Doppelpunkt ist korrekt, da die direkte Rede in V. 51 folgt.'
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch klar und flüssig. Die vorangestellten Relativangaben sind trotz der Wiederholung von »ihnen« gut verständlich und spiegeln die appositionale Struktur des Griechischen angemessen.
  terminology: »Nikodemus« entspricht der etablierten deutschen biblischen Namensform. »zu ihnen gehörte« gibt εἷς ὢν ἐξ αὐτῶν idiomatisch als Gruppenzugehörigkeit wieder, ohne eine im Griechischen nicht ausdrücklich markierte kausale Beziehung einzutragen. Das Pronomen »ihm« wahrt die Form des Ausgangstextes; sein Kontextbezug auf Jesus muss nicht im Vers selbst expliziert werden.
