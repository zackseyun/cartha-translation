  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: de
  text: 'Da suchten die Juden[a] ihn auf dem Fest und sagten: »Wo ist jener?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Judäer«; im Erzählzusammenhang des Johannesevangeliums sind möglicherweise insbesondere die jüdischen Autoritäten in Judäa gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Darum
  rationale: 'Knüpft folgernd und zugleich erzählerisch an V. 10 an: Weil Jesus nicht öffentlich, sondern im Verborgenen zum Fest gegangen war, suchten sie ihn.'
- source_word: Ἰουδαῖοι
  choice: die Juden
  rationale: Gibt die lexikalisch naheliegende Bezeichnung wieder, ohne den im Vers nicht ausdrücklich eingegrenzten Personenkreis im Haupttext auf Judäer oder jüdische Autoritäten zu beschränken.
- source_word: ἐζήτουν
  choice: suchten
  rationale: Das Imperfekt bezeichnet eine während des Festes andauernde Handlung; im Deutschen ergibt sich diese Verlaufsbedeutung natürlich aus dem Kontext.
- source_word: ἐν τῇ ἑορτῇ
  choice: während des Festes
  rationale: Bezeichnet das bereits erwähnte Laubhüttenfest und macht den zeitlichen Rahmen idiomatisch deutlich.
- source_word: ἔλεγον
  choice: fragten immer wieder
  rationale: Im Zusammenhang leitet λέγω eine direkte Frage ein. »Fragten« ist daher natürliches Deutsch; »immer wieder« lässt den durativen beziehungsweise iterativen Wert des Imperfekts erkennen.
- source_word: ἐκεῖνος
  choice: der da
  rationale: Bewahrt die gegenüber einem bloßen »er« stärkere, möglicherweise distanzierende Kraft des Demonstrativpronomens, ohne das im Griechischen nicht ausgedrückte Substantiv »Mann« hinzuzufügen.
theological_decisions:
- issue: Bezugsgruppe von Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext »die Juden«, mit einer Fußnote zur möglichen kontextuellen Eingrenzung
  alternative: »die Judäer« oder »die jüdischen Autoritäten«
  rationale: Der einzelne Vers legt die Gruppe nicht ausdrücklich enger fest. Der johanneische Erzählzusammenhang kann jedoch insbesondere Judäer beziehungsweise jüdische Autoritäten meinen; diese Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Der da« bildet die demonstrative Distanz von ἐκεῖνος idiomatisch ab; die wiederholte Frage wird durch »immer wieder« kenntlich gemacht.
