revisions:
- from: 'Darum suchten die Juden[a] ihn während des Festes und fragten immer wieder: »Wo ist der da?«'
  to: 'Da suchten die Juden[a] ihn auf dem Fest und sagten: »Wo ist jener?«'
  rationale: Die Revision schwächt die nicht zwingend kausale Deutung von οὖν ab, gibt λέγω mit dem semantisch offenen »sagten« wieder und ersetzt die potenziell abwertend-kolloquiale Formulierung »der da« durch »jener«. Die Fußnote bleibt erhalten, da sie die lexikalische und kontextuelle Ambiguität von Ἰουδαῖοι angemessen dokumentiert.
