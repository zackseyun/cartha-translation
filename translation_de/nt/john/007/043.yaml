  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: de
  text: So kam es seinetwegen zu einer Spaltung in der Menge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: Spaltung
  rationale: Das Substantiv bezeichnet eine Trennung oder einen Riss innerhalb einer Gruppe. „Spaltung“ gibt die soziale Entzweiung prägnant und in modernem Deutsch wieder.
- source_word: οὖν
  choice: So
  rationale: Die Konjunktion kennzeichnet hier die Folge der zuvor geschilderten unterschiedlichen Urteile. „So“ stellt diesen Zusammenhang natürlich her, ohne eine streng logische Folgerung zu behaupten.
- source_word: ἐγένετο
  choice: kam es … zu
  rationale: γίνομαι bezeichnet hier das Entstehen eines Zustands. Die deutsche Wendung „es kam zu“ ist idiomatisch und bewahrt den Vorgangscharakter.
- source_word: ἐν τῷ ὄχλῳ
  choice: in der Menge
  rationale: ὄχλος meint die versammelte Menschenmenge. „In der Menge“ ist knapp, natürlich und entspricht dem räumlich-sozialen Ausdruck des Griechischen.
- source_word: δι’ αὐτόν
  choice: seinetwegen
  rationale: διά mit Akkusativ bezeichnet die Ursache. „Seinetwegen“ gibt die kausale Bedeutung präzise wieder und lässt den Bezug des Pronomens wie im Griechischen implizit.
theological_decisions:
- issue: Bezug von αὐτόν
  choice: Das Pronomen bleibt als „seinetwegen“ stehen und bezieht sich im Kontext auf Jesus.
  alternative: „wegen Jesus“
  rationale: Der Kontext macht den Bezug deutlich; eine ausdrückliche Nennung würde mehr festlegen als der Wortlaut dieses Verses und ist für das Verständnis nicht nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt den kausalen Auslöser hervor, ohne den knappen Charakter des griechischen Verses zu verlieren.
