review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von οἱ Ἰουδαῖοι, πρὸς ἑαυτούς, οὗτος, der rhetorisch negativ erwarteten Frage mit μή und von τοὺς Ἕλληνας ist sachgerecht. Die Entfaltung von εἰς τὴν διασπορὰν τῶν Ἑλλήνων zu »zu den ... verstreut lebenden Juden gehen« verschiebt jedoch die griechische Zielbestimmung »in die Diaspora unter den Griechen« zu einer Bewegung zu einer Personengruppe.
  naturalness: Die vorgeschlagene Fassung ist überwiegend idiomatisches modernes Standarddeutsch. »In die Diaspora unter den Griechen« ist präzise, gut verständlich und wird durch die Anmerkung ausreichend erläutert.
  terminology: »Die Juden« mit lexikalischer Alternativanmerkung ist vertretbar. »Diaspora« ist als etablierter historisch-jüdischer Begriff der angemessene Ausdruck; die Kleinschreibung ist im Deutschen hier unauffällig. »Griechen« bewahrt die wiederholte Bezeichnung Ἕλληνες.
  issues:
