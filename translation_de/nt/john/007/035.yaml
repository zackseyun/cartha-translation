id: JHN.7.35
reference: John 7:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: de
  text: 'Da sagten die Juden[a] zueinander: »Wohin will dieser Mann gehen, dass wir ihn nicht finden werden? Will er etwa in die Diaspora unter den Griechen[b] gehen und die Griechen lehren?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Judäer«. Das griechische Wort kann allgemein Juden oder in manchen Zusammenhängen Menschen aus Judäa bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind jüdische Menschen, die verstreut unter griechischsprachigen Bevölkerungen lebten, nicht verstreut lebende Griechen.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die Wiedergabe entspricht hier der ethnisch-korporativen Bezeichnung, ohne die Referenz unbegründet auf führende Personen oder auf Bewohner Judäas einzuengen.
- source_word: πρὸς ἑαυτούς
  choice: zueinander
  rationale: 'Der Kontext verlangt den wechselseitigen Sinn: Die Angehörigen der Gruppe sprechen miteinander.'
- source_word: Ποῦ οὗτος μέλλει πορεύεσθαι
  choice: Wohin will dieser Mann gehen
  rationale: Im Deutschen gibt »will … gehen« die hier gemeinte bevorstehende beziehungsweise beabsichtigte Bewegung idiomatisch wieder; »dieser Mann« bewahrt den distanzierenden Ton von οὗτος.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: dass wir ihn nicht finden werden
  rationale: Die Formulierung bewahrt den erklärenden Folgesinn und das Futur, ohne ein im Griechischen nicht ausdrücklich genanntes Unvermögen hinzuzufügen.
- source_word: μὴ
  choice: Will er etwa …?
  rationale: »Etwa« kennzeichnet eine Frage, bei der die Sprecher eher mit einer verneinenden Antwort rechnen.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: die in der griechischen Welt verstreut lebenden Juden
  rationale: διασπορά bezeichnet hier die jüdische Diaspora unter griechischsprachigen Bevölkerungen. Die explizite deutsche Formulierung verhindert das Missverständnis, es handle sich um verstreute Griechen.
- source_word: τοὺς Ἕλληνας
  choice: die Griechen
  rationale: Die direkte ethnisch-kulturelle Bezeichnung bewahrt den Wortlaut, ohne ihn pauschal zu »Nichtjuden« zu erweitern.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer
  rationale: Der Zusammenhang verlangt keine regionale Verengung. Die Hauptfassung bleibt beim transparenten lexikalischen Äquivalent; die mögliche regionale Bedeutung wird in einer Fußnote offengehalten.
- issue: Referenz von διασπορὰ τῶν Ἑλλήνων
  choice: die in der griechischen Welt verstreut lebenden Juden
  alternative: die Diaspora unter den Griechen
  rationale: Gemeint sind jüdische Menschen in der griechisch geprägten Welt, nicht eine Zerstreuung, die aus Griechen besteht. Die Hauptfassung macht den kulturell vorausgesetzten Bezug verständlich, während die Fußnote ihn erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage bleibt durch »etwa« erkennbar. Die kulturell schwer verständliche Diaspora-Formulierung wird im Haupttext transparent entfaltet; beide Fußnotenmarker stehen an den einschlägigen Stellen.
