    issue: Die Haupttextwiedergabe von διασπορὰν τῶν Ἑλλήνων ist semantisch umgestellt.
    rationale: εἰς τὴν διασποράν bezeichnet das Ziel als die Diaspora; »zu den verstreut lebenden Juden« macht daraus ein Ziel bei Personen. Die Erklärung, dass damit jüdische Menschen unter Griechen gemeint sind, gehört sinnvoll in die Fußnote, sollte aber nicht die syntaktische und begriffliche Form des Haupttexts ersetzen.
