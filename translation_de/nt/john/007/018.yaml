  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: de
  text: Wer aus sich selbst redet, sucht seine eigene Ehre[a]. Wer aber die Ehre dessen sucht, der ihn gesandt hat, der ist wahrhaftig[b], und in ihm ist keine Ungerechtigkeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von sich aus redet“ oder „aus eigener Vollmacht redet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wahr“ beziehungsweise „glaubwürdig“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „kein Unrecht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: aus sich selbst
  rationale: Die formnahe Wendung bewahrt den johanneischen Gegensatz zwischen der eigenen Quelle des Redens und dem Gesandtsein; „aus eigener Vollmacht“ wäre bereits stärker auslegend.
- source_word: λαλῶν
  choice: wer … redet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein den Redenden; die deutsche Relativkonstruktion ist natürlich und erhält den zeitunabhängigen Sinn.
- source_word: δόξαν τὴν ἰδίαν
  choice: seine eigene Ehre
  rationale: „Ehre“ gibt hier das Streben nach Anerkennung idiomatischer wieder als „Herrlichkeit“, ohne den Bezug von δόξα auf die dem Sender gebührende Ehre abzuschwächen.
- source_word: ζητεῖ
  choice: sucht
  rationale: Die Wiederholung desselben Verbs in beiden Satzhälften wird beibehalten und macht den Kontrast der Zielrichtung sichtbar.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: dessen …, der ihn gesandt hat
  rationale: Die Formulierung gibt das artikulierte Partizip persönlich und klar wieder und bewahrt das zentrale Sendungsmotiv.
- source_word: οὗτος
  choice: der
  rationale: Das wiederaufnehmende „der“ erhält in idiomatischem Deutsch die demonstrative Hervorhebung; ein ausdrückliches „dieser“ klänge hier unnötig steif.
- source_word: ἀληθής
  choice: wahrhaftig
  rationale: „Wahrhaftig“ kann sowohl Echtheit als auch Verlässlichkeit bzw. Wahrhaftigkeit bezeichnen und bewahrt damit die semantische Weite des griechischen Adjektivs.
- source_word: ἀδικία
  choice: Ungerechtigkeit
  rationale: Der Ausdruck bewahrt die ethische und theologische Breite von ἀδικία und vermeidet die Verengung auf einzelne Verfehlungen.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: in ihm ist keine
  rationale: Die Satzform folgt der räumlich-inneren Charakterisierung des griechischen Textes und klingt zugleich würdig und verständlich.
theological_decisions:
- issue: Der Gegensatz zwischen dem Reden „aus sich selbst“ und dem Suchen der Ehre des Sendenden
  choice: Der Wortlaut stellt selbstbezogenes Reden dem Streben nach der Ehre des Sendenden gegenüber.
  alternative: „Aus sich selbst“ ausdrücklich als „aus eigener Vollmacht“ zu deuten oder den Satz ausschließlich auf falsche Lehrer zu beziehen.
  rationale: Der unmittelbare Zusammenhang betrifft Quelle und Ziel des Lehrens. Die Übersetzung erhält das Sendungsmotiv, ohne eine weitergehende dogmatische Bestimmung in den Wortlaut einzutragen.
- issue: Bedeutung von ἀληθής
  choice: „wahrhaftig“ mit offenem Bezug auf Echtheit und Verlässlichkeit
  alternative: „wahr“ oder enger „wahrheitsliebend“
  rationale: Das Adjektiv kann hier sowohl die Echtheit als auch die Wahrhaftigkeit der Person bezeichnen. „Wahrhaftig“ lässt diese Spannung bestehen.
- issue: Bedeutung von ἀδικία
  choice: „Ungerechtigkeit“
  alternative: „Unrecht“ oder „Falschheit“
  rationale: „Ungerechtigkeit“ erhält den umfassenden moralischen Gehalt, ohne ihn allein auf soziale Ungerechtigkeit, Täuschung oder einzelne falsche Handlungen zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und die Wiederholung von „sucht“ bleiben erhalten. „Ehre“ ist im gegenwärtigen Deutsch in diesem Zusammenhang natürlicher als „Herrlichkeit“; die Fußnoten markieren wesentliche lexikalische Alternativen. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
