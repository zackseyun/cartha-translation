  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: de
  text: Nach diesen Ereignissen ging Jesus in Galiläa umher; denn er wollte nicht in Judäa umhergehen, weil die Juden[a] ihn zu töten suchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“; dem Zusammenhang nach können besonders jüdische führende Kreise beziehungsweise die Gegner Jesu in Judäa gemeint sein. Die Bezeichnung meint hier nicht unterschiedslos das jüdische Volk als Ganzes.'
    reason: Lexikalische Alternative und notwendige kontextuelle Präzisierung der johanneischen Gruppenbezeichnung.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Nach diesen Ereignissen
  rationale: Bewahrt den rückblickenden Plural und stellt den johanneischen Erzählanschluss in natürlichem Deutsch her.
- source_word: περιεπάτει … περιπατεῖν
  choice: zog … umher / umherziehen
  rationale: Gibt die andauernde Bewegung innerhalb einer Region wieder und bewahrt die auffällige Wiederholung desselben griechischen Verbs.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: in Galiläa
  rationale: Schlichte lokative Wiedergabe ohne eine Bewegung durch das gesamte Gebiet zu behaupten.
- source_word: οὐ γὰρ ἤθελεν
  choice: denn er wollte nicht
  rationale: „Denn“ bewahrt die erklärende Funktion von γάρ; „wollte nicht“ bezeichnet fehlende Bereitschaft, nicht fehlende Fähigkeit.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: in Judäa
  rationale: Entspricht der geografischen Bezeichnung und wahrt den Kontrast zu Galiläa.
- source_word: ὅτι ἐζήτουν
  choice: weil … suchten
  rationale: Gibt den Kausalzusammenhang und den fortdauernden feindlichen Vorsatz wieder; die Verbindung „zu töten suchten“ ist würdig und im modernen Standarddeutsch verständlich.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Bewahrt die formale Gruppenbezeichnung des griechischen Textes. Eine Fußnote erläutert, dass sie im johanneischen Erzählzusammenhang kontextuell eingeschränkt sein kann und nicht pauschal das jüdische Volk bezeichnet.
- source_word: ἀποκτεῖναι
  choice: ihn zu töten
  rationale: Direkte und natürliche Wiedergabe des Infinitivs samt Objekt.
theological_decisions:
- issue: Bezug von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext steht die formnahe Wiedergabe „die Juden“, ergänzt durch eine kontextklärende Fußnote.
  alternative: „die Judäer“ oder „die jüdischen führenden Kreise“ unmittelbar im Haupttext
  rationale: Der griechische Ausdruck bleibt sichtbar, ohne ihn als undifferenzierte Aussage über alle jüdischen Menschen erscheinen zu lassen. Welche genauere Gruppe gemeint ist, wird nicht dogmatisch festgelegt; die möglichen kontextuellen Eingrenzungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umherziehen“ ist idiomatischer als das formale „gehen“ und bewahrt zugleich die Wiederholung von περιπατέω. Die Konstruktion „ihn zu töten suchten“ hält den fortdauernden Vorsatz knapp und gehoben fest.
