  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: de
  text: Wenn ein Mann am Sabbat beschnitten wird,[a] damit das Gesetz des Mose nicht gebrochen wird,[b] seid ihr dann zornig auf mich, weil ich am Sabbat einen ganzen Menschen gesund gemacht habe?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Beschneidung empfängt“.'
    reason: lexical_alternative
  - marker: b
    text: Für „gebrochen wird“ sind auch „außer Kraft gesetzt wird“ oder „aufgehoben wird“ möglich.
    reason: lexical_alternative
  - marker: c
    text: Die Formulierung „einen ganzen Menschen gesund gemacht“ betont den Gegensatz zwischen der Beschneidung eines Körperteils und der Wiederherstellung des ganzen Menschen.
    reason: rhetorical_clarification
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: die Beschneidung empfängt
  rationale: Die Formulierung gibt die griechische Wendung eng wieder und ist im Deutschen verständlich. Gemeint ist, dass der Mann beschnitten wird.
- source_word: ἄνθρωπος
  choice: ein Mann / einen … Menschen
  rationale: Im ersten Vorkommen bezeichnet ἄνθρωπος wegen der Beschneidung konkret einen männlichen Menschen, daher „ein Mann“. In ὅλον ἄνθρωπον hebt „einen ganzen Menschen“ die Wiederherstellung der gesamten Person hervor und bewahrt den rhetorischen Kontrast.
- source_word: ἐν σαββάτῳ
  choice: am Sabbat
  rationale: Dies ist die natürliche deutsche Wiedergabe der temporalen Dativverbindung und bezeichnet den Sabbattag.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: damit das Gesetz des Mose nicht gebrochen wird
  rationale: λύω kann in diesem rechtlichen Zusammenhang „brechen“, „außer Kraft setzen“ oder „aufheben“ bedeuten. „Das Gesetz brechen“ ist klar und idiomatisch, ohne die möglichen Bedeutungsnuancen völlig festzulegen.
- source_word: χολᾶτε
  choice: seid ihr … zornig auf mich
  rationale: Das Verb bezeichnet Zorn oder Entrüstung. „Zornig sein“ entspricht der Intensität und passt zur rhetorischen Frage.
- source_word: ὅλον ἄνθρωπον
  choice: einen ganzen Menschen
  rationale: Die ungewöhnliche, betonte Formulierung bewahrt den Kontrast zwischen dem Eingriff an einem Körperteil und der Wiederherstellung des ganzen Menschen.
- source_word: ὑγιῆ ἐποίησα
  choice: gesund gemacht habe
  rationale: Die Wiedergabe folgt der griechischen Konstruktion „gesund machen“ und erhält zusammen mit „einen ganzen Menschen“ die Wortwahl und Argumentationsstruktur besser als das glattere „geheilt habe“.
theological_decisions:
- issue: Jesu Vergleich zwischen Beschneidung und Heilung am Sabbat
  choice: Jesus schließt von der anerkannten Beschneidung am Sabbat auf die umso größere Berechtigung, am Sabbat einen ganzen Menschen gesund zu machen.
  alternative: Jesus stellt Ritualgesetz und barmherziges Handeln allgemein einander gegenüber.
  rationale: 'Der Wortlaut entwickelt ein argumentum a minori ad maius: Wenn die Beschneidung zur Wahrung des mosaischen Gesetzes am Sabbat vorgenommen wird, kann die umfassende Wiederherstellung eines Menschen nicht als unrecht gelten. Die Übersetzung bewahrt diesen Gedankengang, ohne einen allgemeinen Gegensatz zwischen Gesetz und Barmherzigkeit in den Text hineinzutragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wendung „einen ganzen Menschen gesund gemacht“ bleibt erhalten, weil sie den rhetorischen Schwerpunkt des griechischen Textes trägt.
