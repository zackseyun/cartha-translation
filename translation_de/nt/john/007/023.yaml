  rationale: Die einzige nötige Änderung ersetzt eine griechischnahe, aber im modernen Deutsch hölzerne Formulierung durch die idiomatische passive Wiedergabe „beschnitten wird“. Die Fußnote erhält die wörtliche griechische Ausdrucksweise. Satzlogik, Register, die auffällige Gegenüberstellung von Teil und Ganzem sowie sämtliche Fußnotenanker bleiben erhalten.
