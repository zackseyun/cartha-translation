id: JHN.7.19
reference: John 7:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: de
  text: Hat euch nicht Mose das Gesetz gegeben? Doch keiner von euch hält das Gesetz.[a] Warum sucht ihr mich zu töten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tut das Gesetz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Hat ... nicht ... gegeben?
  rationale: Die mit οὐ eingeleitete Frage erwartet eine bejahende Antwort. Das deutsche Perfekt gibt das griechische Perfekt natürlich wieder und lässt die fortdauernde Bedeutung der Gesetzesgabe erkennen.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Dies ist die im modernen Standarddeutsch übliche Form des Namens.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Gemeint ist durch die ausdrückliche Nennung Moses das mosaische Gesetz; der bestimmte Artikel wahrt diesen konkreten Bezug.
- source_word: καὶ
  choice: Doch
  rationale: καί verbindet hier zwei inhaltlich gegensätzliche Aussagen. „Doch“ macht diesen Kontrast im Deutschen natürlich deutlich.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: keiner von euch
  rationale: Die Formulierung bewahrt die umfassende Verneinung und klingt zugleich idiomatisch.
- source_word: ποιεῖ τὸν νόμον
  choice: hält das Gesetz
  rationale: Wörtlich steht „tut das Gesetz“. Im Deutschen bezeichnet „das Gesetz halten“ idiomatisch dessen Befolgung, ohne den Sinn zu erweitern.
- source_word: τί
  choice: Warum
  rationale: τί bezeichnet hier bei ζητεῖτε mit Infinitiv den Grund und wird natürlich mit „Warum“ wiedergegeben.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: sucht ... zu töten
  rationale: „Sucht ... zu töten“ bildet das fortdauernde Streben des Präsens und die Infinitivkonstruktion eng nach, ohne es stärker als bloßen Versuch zu deuten.
- source_word: ἀποκτεῖναι
  choice: zu töten
  rationale: Die direkte, sachlich passende deutsche Entsprechung wahrt die Schärfe der Aussage.
theological_decisions:
- issue: Bezug von „das Gesetz“
  choice: Das durch Mose gegebene mosaische Gesetz
  alternative: Gesetz im allgemeinen moralischen Sinn
  rationale: Da Jesus Mose ausdrücklich als denjenigen nennt, der es gegeben hat, bezeichnet νόμος hier die Tora beziehungsweise das mosaische Gesetz. Die Übersetzung macht dies nicht durch einen erklärenden Zusatz enger als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; „Doch“ verdeutlicht den im Zusammenhang liegenden Gegensatz. Die relativ formnahe Wendung „sucht ihr mich zu töten“ bewahrt die johanneische Ausdrucksweise.
