  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: de
  text: Doch einige von ihnen wollten ihn ergreifen, aber niemand legte Hand an ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Doch einige
  rationale: τινές bezeichnet eine unbestimmte Teilgruppe; δέ setzt ihre Absicht in Kontrast zu den zuvor geschilderten Reaktionen. „Doch einige“ ist natürlich und gibt beides knapp wieder.
- source_word: ἤθελον
  choice: wollten
  rationale: Der Imperfekt bezeichnet ihre in der damaligen Situation bestehende Absicht. Das deutsche Präteritum „wollten“ gibt dies idiomatisch wieder, ohne den Aspekt zu überzeichnen.
- source_word: ἐξ αὐτῶν
  choice: von ihnen
  rationale: Die Wendung bezeichnet einige aus der zuvor genannten Gruppe. „Von ihnen“ bewahrt diesen Teilmengenbezug klar und natürlich.
- source_word: πιάσαι
  choice: ergreifen
  rationale: πιάζω bezeichnet hier das gewaltsame Ergreifen mit dem Ziel einer Festnahme. „Ergreifen“ bewahrt die konkrete Bildlichkeit und lässt den Festnahmebezug aus dem Kontext hervorgehen.
- source_word: ἀλλ’ οὐδεὶς
  choice: aber niemand
  rationale: ἀλλά markiert den deutlichen Gegensatz zwischen Absicht und tatsächlichem Ausgang; οὐδείς wird direkt mit „niemand“ wiedergegeben.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: legte Hand an ihn
  rationale: Die griechische Wendung bezeichnet ein feindseliges körperliches Zugreifen. Die idiomatische deutsche Formulierung „Hand an jemanden legen“ erhält dieses Bild und passt zum beabsichtigten Ergreifen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung zweier adversativer Bindewörter („Doch … aber“) spiegelt die griechische Kontraststruktur, ohne schwerfällig zu wirken. Keine Fußnote ist nötig, da „von ihnen“ und „ergreifen“ die relevanten Bedeutungsnuancen im Haupttext ausreichend bewahren.
