review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die griechische Aussage vollständig und ohne sachliche Einengung wieder: „einige von ihnen“ entspricht τινὲς … ἐξ αὐτῶν, „wollten“ bildet den imperfektischen Wunsch bzw. Vorsatz idiomatisch ab, und „ergreifen“ bewahrt gegenüber der möglichen Deutung „festnehmen“ die offenere Wortwahl von πιάσαι. „Niemand legte Hand an ihn“ gibt die idiomatische Wendung ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας treffend als tatsächliches Ausbleiben eines körperlichen Zugreifens wieder.'
  naturalness: „Doch einige von ihnen wollten ihn ergreifen, aber niemand legte Hand an ihn“ ist flüssiges modernes Standarddeutsch mit einem angemessen zurückhaltenden biblischen Ton. Die doppelte Kontrastmarkierung ist verständlich und stilistisch vertretbar.
  terminology: „Ergreifen“ ist hier die geeignete, nicht überinterpretierende Wiedergabe; es kann den im Kontext möglichen Festnahmebezug tragen, ohne ihn als alleinigen Sinn festzulegen. Die Wendung „Hand an ihn legen“ ist etabliert und verständlich.
