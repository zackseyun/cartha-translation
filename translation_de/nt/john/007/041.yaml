id: JHN.7.41
reference: John 7:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: de
  text: 'Andere sagten: „Dieser ist der Messias.“ Wieder andere aber sagten: „Der Messias kommt doch nicht etwa aus Galiläa?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Andere
  rationale: Das substantivierte Adjektiv bezeichnet eine weitere Gruppe innerhalb der Menge; „Andere“ gibt dies knapp und natürlich wieder.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das griechische Imperfekt beschreibt die Äußerungen innerhalb der andauernden Diskussion. Im Deutschen ist das Präteritum „sagten“ hierfür idiomatischer als eine Verlaufsumschreibung.
- source_word: Οὗτός ἐστιν
  choice: Dieser ist
  rationale: Die betonte Identifizierung der anwesenden Person wird mit „Dieser ist“ würdig und verständlich wiedergegeben.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier der umstrittene Titel des erwarteten Gesalbten und wird daher mit „Messias“ wiedergegeben.
- source_word: οἱ δὲ
  choice: Wieder andere aber
  rationale: Der substantivierte Artikel bezeichnet eine weitere, kontrastierende Gruppe. „Wieder andere aber“ macht sowohl den Gruppenwechsel als auch den Gegensatz deutlich.
- source_word: Μὴ γὰρ
  choice: doch nicht etwa ...?
  rationale: μή kennzeichnet eine Frage, auf die eine verneinende Antwort erwartet wird; γάρ verstärkt hier den Einwand. Die deutsche Wendung „doch nicht etwa“ bildet diese rhetorische Erwartung natürlich ab.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: aus Galiläa
  rationale: ἐκ bezeichnet Herkunft; bei einem geografischen Gebiet ist „aus Galiläa“ die natürliche deutsche Form.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens formuliert eine allgemeine Erwartung hinsichtlich der Herkunft des Messias; „kommt“ bewahrt diesen Sinn.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Im Streitgespräch fungiert Χριστός als Titel des erwarteten Gesalbten, nicht als namensähnliche Bezeichnung. „Messias“ lässt diesen jüdischen Erwartungshorizont unmittelbar erkennen, ohne die Aussage der Sprecher zu bestätigen oder zu verwerfen.
- issue: Rhetorische Frage zur Herkunft des Messias
  choice: Der Messias kommt doch nicht etwa aus Galiläa?
  alternative: Kommt der Messias etwa aus Galiläa?
  rationale: Die gewählte Fassung bewahrt die durch μή nahegelegte Erwartung einer negativen Antwort, ohne den sachlich irrigen Einwand der Sprecher im Text aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „andere“ bildet die wechselnden Gruppen in der Menge ab; die rhetorische Frage bewahrt ihre ablehnende, aber nicht überzeichnete Färbung.
