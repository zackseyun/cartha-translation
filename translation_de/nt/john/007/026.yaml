source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: de
  text: 'Und seht: Er spricht ganz offen, und sie sagen ihm nichts. Haben die führenden Männer etwa wirklich erkannt, dass er der Messias ist?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: seht
  rationale: Das aufmerksamkeitslenkende Signal wird in natürlichem modernem Deutsch mit „seht“ wiedergegeben. Das griechische ἴδε ist formal Singular, kann hier aber interjektional gebraucht sein; angesichts der redenden Menge ist der deutsche Plural idiomatisch.
- source_word: παρρησίᾳ
  choice: ganz offen
  rationale: Die Wendung bezeichnet hier öffentliches, unverhülltes Reden. „Ganz offen“ bewahrt diesen Sinn, ohne einseitig Mut oder Kühnheit hervorzuheben.
- source_word: λαλεῖ
  choice: spricht
  rationale: Das Präsens stellt Jesu gegenwärtiges Reden dar. Das einfache deutsche Präsens ist dafür natürlich und würdig.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: sie sagen nichts zu ihm
  rationale: Die Formulierung folgt der griechischen Konstruktion eng. „Gegen ihn“ wäre im Kontext möglich, würde aber eine nicht ausdrücklich bezeichnete feindliche Richtung ergänzen.
- source_word: μήποτε
  choice: etwa
  rationale: In der Frage kennzeichnet μήποτε eine zögernde, überraschte Vermutung. Das Fragepartikel „etwa“ gibt diese Spannung knapp und idiomatisch wieder.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: „Wirklich“ gibt die bestätigende Kraft des Adverbs in heutigem Deutsch natürlich wieder.
- source_word: ἔγνωσαν
  choice: erkannt
  rationale: Der Aorist kann hier das Erlangen einer Erkenntnis bezeichnen. „Erkannt“ bewahrt diesen Aspekt besser als das rein statische „wissen“.
- source_word: οἱ ἄρχοντες
  choice: die führenden Männer
  rationale: Gemeint sind die maßgeblichen jüdischen Führungspersonen. „Die führenden Männer“ ist verständlich und kontextgerecht; „Herrscher“ klänge im Deutschen zu monarchisch oder politisch allgemein.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: dass er der Messias ist
  rationale: Das demonstrative οὗτός verweist auf Jesus und wird im Deutschen natürlich mit „er“ aufgenommen. χριστός fungiert hier als messianischer Titel und wird deshalb mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Titels ὁ χριστός
  choice: der Messias
  alternative: der Christus
  rationale: Im Zusammenhang der öffentlichen Spekulation über Jesu Identität bezeichnet χριστός den erwarteten Gesalbten als Titel. „Messias“ macht diesen jüdischen Erwartungshorizont deutlich, ohne die Aussage weiter dogmatisch festzulegen.
- issue: Bedeutung von ἔγνωσαν
  choice: erkannt
  alternative: wissen
  rationale: „Erkannt“ lässt offen, worauf eine mögliche Einsicht der führenden Männer beruht, und bewahrt den im Aorist möglichen Gedanken, dass sie zu dieser Erkenntnis gelangt seien.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die überraschte Vermutung der Menge bleibt als echte Frage erhalten; „etwa“ vermittelt ihre Zurückhaltung und ihr Erstaunen.
