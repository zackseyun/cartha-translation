  to: 'Und seht: Er spricht ganz offen, und sie sagen ihm nichts. Haben die führenden Männer etwa wirklich erkannt, dass er der Messias ist?'
  rationale: Ausschließlich die unnatürliche deutsche Wiedergabe von οὐδὲν αὐτῷ λέγουσιν wurde idiomatisch korrigiert. Bedeutung, Fragecharakter, Ambiguität und die Wiedergabe von χριστός als „Messias“ bleiben unverändert.
