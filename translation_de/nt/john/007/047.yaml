  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: de
  text: 'Da antworteten ihnen die Pharisäer: »Seid etwa auch ihr in die Irre geführt worden?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid etwa auch ihr getäuscht worden?« Das griechische Verb kann sowohl ein Irreführen als auch ein Täuschen bezeichnen.'
