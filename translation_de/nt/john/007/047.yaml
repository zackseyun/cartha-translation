lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: antworteten
  rationale: Das übliche deutsche Erzählverb für eine Reaktion im Gespräch; es gibt den Aorist natürlich wieder.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier den anschließenden beziehungsweise folgernden Fortgang des Gesprächs. »Da« klingt im deutschen Erzählzusammenhang natürlicher als das stärker folgernde »daher«.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird entsprechend der deutschen Rektion von »antworten« unmittelbar wiedergegeben.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Die etablierte deutsche Bezeichnung der jüdischen Gruppierung bewahrt den bestimmten Artikel.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Habt ihr euch etwa auch
  rationale: »Etwa« lässt erkennen, dass die mit μή eingeleitete Frage eine verneinende Antwort erwartet; »auch« gibt καί wieder, während das ausdrücklich gesetzte »ihr« in der deutschen Verbform und im Pronomen erhalten bleibt.
- source_word: πεπλάνησθε
  choice: in die Irre führen lassen
  rationale: Die Konstruktion gibt den resultativen Sinn des Perfekts sowie die passive beziehungsweise mediale Form wieder und bezeichnet ein Irregeführtwerden, ohne vorschnell ausschließlich bewusste Täuschung zu unterstellen.
theological_decisions:
- issue: Rhetorische Kraft der mit μή eingeleiteten Frage
  choice: Die erwartete verneinende Antwort wird durch »etwa« angedeutet.
  alternative: »Seid doch nicht etwa auch ihr irregeführt worden?«
  rationale: μή zeigt an, dass die Pharisäer mit einem Nein rechnen. »Etwa« bewahrt diese rhetorische Färbung in natürlichem Deutsch, ohne die Verachtung der Sprecher durch zusätzliche Wörter übermäßig auszudeuten.
- issue: Aktive Beteiligung oder passives Irregeführtwerden bei πεπλάνησθε
  choice: »habt ihr euch … führen lassen« bewahrt die mögliche passive/mediale Spannung
  alternative: »seid ihr … irregeführt worden«
  rationale: Die Form kann passiv oder medial verstanden werden. Die gewählte natürliche deutsche Wendung lässt sowohl fremde Einwirkung als auch ein Sich-darauf-Einlassen anklingen, ohne die Ambiguität dogmatisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Frage klingt scharf und rhetorisch, ohne durch zusätzliche wertende Sprache verschärft zu werden.
