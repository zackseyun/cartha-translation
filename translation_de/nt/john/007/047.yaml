  source_fidelity: 'Die Personen, der Anschluss durch οὖν, die rhetorische Frage mit erwarteter Verneinung sowie καί („auch“) sind zutreffend wiedergegeben. Die deutsche Wendung „habt ihr euch … führen lassen“ verschiebt jedoch die passive Form von πεπλάνησθε: Sie kann ein willentliches Sich-Führen-Lassen und damit eine Mitverantwortung der Angeredeten nahelegen. Das griechische Perfekt kann zwar formal passiv oder medial diskutiert werden, doch im Kontext ist „seid … in die Irre geführt worden“ die sichere, nicht einengende Wiedergabe des Irregeführtseins.'
  naturalness: „Da antworteten ihnen die Pharisäer“ ist idiomatisches modernes Standarddeutsch. „Seid etwa auch ihr in die Irre geführt worden?“ ist eine natürliche scharfe rhetorische Frage; „etwa“ vermittelt die durch μή nahegelegte Erwartung einer verneinenden Antwort.
  terminology: „Pharisäer“ ist die etablierte deutsche Gruppenbezeichnung. „In die Irre geführt“ gibt πλανάω angemessen wieder, ohne die Bedeutung auf absichtliche Täuschung zu beschränken. Die Fußnotenalternative „getäuscht worden“ ist als lexikalische Alternative angemessen.
