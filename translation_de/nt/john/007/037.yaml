reference: John 7:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: de
  text: 'Am letzten, dem großen Tag des Festes stand Jesus da und rief laut: »Wenn jemand Durst hat, soll er zu mir kommen und trinken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς
  choice: Am letzten, dem großen Tag des Festes
  rationale: Ἐν mit dem Dativ bezeichnet den Zeitpunkt; δέ ist ein schwacher Anschluss und muss hier im Deutschen nicht eigens wiedergegeben werden. Die Apposition bewahrt sowohl »letzten« als auch die Hervorhebung »großen«.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: stand Jesus da
  rationale: Das Plusquamperfekt von ἵστημι bezeichnet hier den bestehenden aufrechten Stand. »stand … da« klingt im deutschen Erzählzusammenhang natürlich und bildet die öffentliche Haltung Jesu ab, ohne ein vorheriges Sich-Hinstellen ausdrücklich einzutragen.
- source_word: ἔκραξεν λέγων
  choice: rief laut
  rationale: κράζω bezeichnet einen lauten, öffentlichen Ruf. Das deutsche Redeeinleitungszeichen macht eine zusätzliche Wiedergabe von λέγων als »und sagte« entbehrlich.
- source_word: Ἐάν τις διψᾷ
  choice: Wenn jemand Durst hat
  rationale: τις ist indefinit und generisch; »jemand« ist im Deutschen singularisch und ohne unnötige Geschlechtsfestlegung. »Durst hat« ist die natürliche moderne Wiedergabe von διψᾷ und lässt die Bildsprache offen.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: soll er zu mir kommen und trinken
  rationale: Die Imperative der dritten Person werden idiomatisch mit »soll« wiedergegeben. Das singularische Pronomen nimmt das grammatisch maskuline »jemand« auf; beim zweiten Verb muss »soll er« nicht wiederholt werden.
theological_decisions:
- issue: Bildsprache von Durst und Trinken
  choice: Die Bilder werden wörtlich als »Durst hat« und »trinken« bewahrt.
  alternative: Deutende Wiedergaben wie »nach Leben verlangt« oder »den Geist empfängt«.
  rationale: Der Vers selbst erläutert die Bilder noch nicht. Eine auslegende Auflösung würde der Entwicklung im unmittelbaren Zusammenhang vorgreifen.
- issue: Bezug des generischen τις
  choice: »Wenn jemand … soll er …«
  alternative: »Wer Durst hat, soll …« oder eine explizit geschlechtsneutrale Umformung im Plural.
  rationale: Die gewählte Form erhält den indefiniten Singular und ist im modernen Standarddeutsch idiomatisch. »Jemand« ist grammatisch maskulin, schließt sachlich aber alle Personen ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Fest« ist für ἑορτή verständlich und bewahrt den johanneischen Festkontext. Keine Fußnote ist nötig, da das Deutsche mit »jemand … er« den generischen Singular natürlich ausdrückt und keine sachliche Mehrdeutigkeit verloren geht.
