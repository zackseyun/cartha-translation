id: JHN.7.49
reference: John 7:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: de
  text: Aber diese Menschenmenge, die das Gesetz[a] nicht kennt, ist verflucht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Gesetz“ ist hier die jüdische Tora gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: steht unter einem Fluch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die adversative Konjunktion setzt die abwertende Beurteilung der Menge in Gegensatz zum vorangehenden Einwand; „Aber“ ist im Deutschen natürlich und präzise.
- source_word: ὁ ὄχλος οὗτος
  choice: diese Menschenmenge
  rationale: „Menschenmenge“ gibt ὄχλος neutral wieder und vermeidet den zusätzlichen abwertenden Beiklang von „Pöbel“ oder „Mob“, den das griechische Wort für sich allein nicht verlangt.
- source_word: ὁ μὴ γινώσκων
  choice: die … nicht kennt
  rationale: Das attributive Partizip bezeichnet einen der Menge zugeschriebenen Zustand. Der Relativsatz ist im modernen Deutschen klar und natürlich.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Gemeint ist hier die jüdische Tora. Die Großschreibung ergibt sich im Deutschen bereits aus der Substantivorthografie; eine Fußnote klärt den kulturellen Bezug.
- source_word: ἐπάρατοί
  choice: verflucht
  rationale: Das Prädikatsadjektiv bezeichnet Menschen als verflucht beziehungsweise unter einem Fluch stehend. „Verflucht“ bewahrt die scharfe, verurteilende Aussage in natürlichem Deutsch.
- source_word: εἰσιν
  choice: ist
  rationale: Obwohl das griechische Verb im Plural steht, verlangt das singularische deutsche Kollektivsubstantiv „Menschenmenge“ grammatisch den Singular.
theological_decisions:
- issue: Ob das feindselige Urteil der Sprecher als Aussage des Erzählers abgeschwächt oder ausdrücklich distanziert werden soll
  choice: Die Äußerung wird als direkte, harte Verurteilung unverändert wiedergegeben.
  alternative: 'Eine Distanzierung ergänzen, etwa: „Sie halten diese Menschenmenge für verflucht.“'
  rationale: Der Vers gehört zur direkten Rede der Gegner Jesu. Die Übersetzung soll deren Urteil weder als Erzählerurteil ausgeben noch durch einen nicht im Ausgangstext stehenden Zusatz abschwächen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Wortwahl vermeidet unnötig abwertende Zusätze, bewahrt aber die Schärfe der direkten Rede.
