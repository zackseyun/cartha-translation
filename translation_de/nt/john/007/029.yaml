  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: de
  text: Ich kenne ihn, denn[a] ich bin von ihm[b], und er hat mich gesandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Konjunktion kann auch einen Inhaltssatz einleiten („dass“); die genaue syntaktische Einordnung ist umstritten. Im Zusammenhang liegt jedoch die kausale Bedeutung „denn/weil“ näher.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von ihm gekommen bin“ beziehungsweise „aus seiner Gegenwart komme“. Die griechische Wendung bezeichnet Quelle oder Herkunft; die Hauptfassung bewahrt die wörtlichere Form mit „bin“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen bewahrt die Hervorhebung der Aussage Jesu.
- source_word: οἶδα αὐτόν
  choice: kenne ihn
  rationale: οἶδα bezeichnet hier einen gegenwärtigen Wissens- bzw. Kenntnisstand; mit einem persönlichen Objekt ist „kennen“ im Deutschen natürlich und präzise.
- source_word: ὅτι
  choice: weil
  rationale: 'Die Konjunktion wird im Zusammenhang am besten kausal verstanden: Jesu Herkunft von Gott begründet, dass er ihn kennt. Die mögliche inhaltliche Auffassung wird in Fußnote [a] offengehalten.'
- source_word: παρ’ αὐτοῦ
  choice: von ihm
  rationale: παρά mit Genitiv bezeichnet Quelle oder Herkunft. „Von ihm“ gibt dies knapp wieder, ohne die Beziehung räumlich oder metaphysisch weiter festzulegen.
- source_word: εἰμι
  choice: bin
  rationale: Die Präsensform der Kopula wird beibehalten; eine Erweiterung zu „gekommen bin“ würde eine Bewegung ausdrücklich machen, die im griechischen Wortlaut nicht ausgedrückt ist.
- source_word: κἀκεῖνός
  choice: und er
  rationale: Die Verschmelzung von καί und ἐκεῖνος wird in natürlichem Deutsch wiedergegeben; „und jener“ wäre hier unnötig markiert.
- source_word: με ἀπέστειλεν
  choice: hat mich gesandt
  rationale: Das deutsche Perfekt gibt die abgeschlossene Sendung in gegenwärtig natürlichem Deutsch wieder; „gesandt“ bewahrt das johanneische Sendungsmotiv.
theological_decisions:
- issue: Jesu Beziehung zum Vater in παρ’ αὐτοῦ εἰμι
  choice: „ich von ihm bin“ als Aussage über Quelle oder Herkunft
  alternative: „ich von ihm gekommen bin“ oder „ich aus seiner Gegenwart komme“
  rationale: Die gewählte Formulierung erhält die theologische Tiefe der Herkunftsaussage, ohne sie auf bloße räumliche Bewegung, Aufenthalt oder Auftrag einzuengen.
- issue: Funktion von ὅτι
  choice: kausales „weil“
  alternative: inhaltliches „dass“
  rationale: Der Zusammenhang und die Satzstruktur sprechen vor allem für eine Begründung. Da ὅτι grundsätzlich auch einen Inhaltssatz einleiten kann, wird diese sprachliche Möglichkeit in einer Fußnote genannt, ohne sie zur Hauptlesart zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe Satzstruktur und die Herkunftsaussage bleiben möglichst nah am Griechischen; erklärende theologische Zusätze werden vermieden.
