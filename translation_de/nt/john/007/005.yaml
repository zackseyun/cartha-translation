  text: For not even his brothers believed in him[a].
translation:
  language: de
  text: Denn nicht einmal seine Brüder glaubten an ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Betonung des damaligen andauernden Zustands: „Denn nicht einmal seine Brüder glaubten zu jener Zeit an ihn.“ Das griechische Imperfekt kann schlicht vergangenes Geschehen oder einen zu jener Zeit fortdauernden Zustand ausdrücken.'
    reason: Aspektuelle Übersetzungsalternative zu ἐπίστευον.
lexical_decisions:
- source_word: οὐδὲ
  choice: nicht einmal
  rationale: Die Wendung hebt hervor, dass sogar Jesu Brüder nicht glaubten; „nicht einmal“ gibt diese emphatische Bedeutung im Deutschen natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet bzw. erläutert die vorausgehende Aussage und wird mit dem anschließenden Hauptsatz natürlich durch „denn“ wiedergegeben.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Brüder
  rationale: Der maskuline Plural bezeichnet hier im Erzählzusammenhang Jesu Brüder; die Übersetzung wahrt die konkrete Bezeichnung, ohne die Art der Verwandtschaft näher festzulegen.
- source_word: ἐπίστευον
  choice: glaubten
  rationale: Das Präteritum ist im Deutschen die natürliche Erzählform. Der griechische Imperfekt kann den damaligen, fortdauernden Zustand des Nichtglaubens hervorheben; diese Aspektnuance wird in einer Fußnote dokumentiert.
- source_word: εἰς αὐτόν
  choice: an ihn
  rationale: πιστεύω εἰς bezeichnet im Johannesevangelium auf eine Person gerichteten Glauben bzw. Vertrauen; „an ihn glauben“ ist dafür die idiomatische deutsche Formulierung.
theological_decisions:
- issue: Bedeutung von πιστεύω εἰς αὐτόν im johanneischen Sprachgebrauch
  choice: an ihn glauben
  alternative: ihm vertrauen
  rationale: Die Formulierung bezeichnet persönlichen, auf Jesus gerichteten Glauben beziehungsweise Vertrauen. „An ihn glauben“ bewahrt den etablierten johanneischen Ausdruck, ohne Art, Umfang oder spätere Entwicklung dieses Glaubens näher zu bestimmen.
- issue: Bedeutung von ἀδελφοί
  choice: Brüder
  alternative: Verwandte
  rationale: Der griechische Ausdruck lässt je nach historischem und theologischem Verständnis unterschiedliche genaue Verwandtschaftsverhältnisse zu. „Brüder“ übersetzt die vorliegende Bezeichnung direkt und entscheidet diese weitergehende Frage nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Nicht einmal“ erhält die Hervorhebung von οὐδέ; das Präteritum vermeidet eine im Deutschen unnatürliche Verlaufsform.
