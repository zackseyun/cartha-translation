  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: de
  text: 'Darauf antwortete Jesus ihnen: „Was ich lehre, stammt nicht von mir, sondern von dem, der mich gesandt hat.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Lehre gehört nicht mir, sondern dem, der mich gesandt hat.“ Der griechische Genitiv kann sowohl Herkunft als auch Zugehörigkeit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Darauf antwortete Jesus ihnen
  rationale: „Darauf“ gibt οὖν als Fortführung und Folgerung aus dem vorausgehenden Gespräch natürlich wieder. Die im Griechischen übliche Doppelung „antwortete … und sagte“ wird zu einer idiomatischen deutschen Redeeinleitung zusammengezogen.
- source_word: Ἡ ἐμὴ διδαχή
  choice: Was ich lehre
  rationale: Die verbale Formulierung ist in modernem Deutsch natürlicher als „meine Lehre“ und wahrt den Bezug auf Jesu Unterweisung, ohne den technisch-kirchlichen Klang von „Lehre“ als festem Lehrsystem aufzudrängen.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: stammt nicht von mir
  rationale: Im Zusammenhang bezeichnet die possessive Aussage nicht nur Eigentum, sondern besonders den Ursprung der Unterweisung. „Stammt nicht von mir“ macht diesen Sinn verständlich, ohne eine Aussage über Jesu Autorität hinzuzufügen.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: sondern von dem, der mich gesandt hat
  rationale: Der allein stehende Genitiv kann Herkunft oder Zugehörigkeit ausdrücken. Die Hauptfassung nimmt wegen des unmittelbaren Gegensatzes zu „stammt nicht von mir“ die Herkunft auf; die Besitznuance bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Verhältnis von Jesu Lehre zu dem, der ihn gesandt hat
  choice: Die Formulierung betont, dass Jesu Lehre ihren Ursprung bei seinem Sender hat.
  alternative: „Meine Lehre gehört nicht mir, sondern dem, der mich gesandt hat.“
  rationale: Der griechische Genitiv lässt Herkunft und Zugehörigkeit anklingen. Die Übersetzung bewahrt die personale Unterscheidung und die Einheit der Sendung, ohne daraus weitergehende christologische Aussagen abzuleiten oder Jesu Autorität abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung vermeidet das potenziell technische Wort „Doktrin“ und gibt den knappen Kontrast des Griechischen klar und mündlich verständlich wieder.
