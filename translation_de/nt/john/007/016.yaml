  source_fidelity: 'Die Übersetzung gibt die Aussagefolge zuverlässig wieder: Jesu Antwort, die Verneinung einer eigenständigen Herkunft seiner Lehre und der Kontrast zu dem, der ihn gesandt hat. „Was ich lehre, stammt nicht von mir“ ist eine idiomatische Entfaltung von Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμή und wahrt den im Kontext naheliegenden Herkunftsaspekt. Die Fußnote hält die ebenfalls im Genitiv anklingende Besitz- bzw. Zugehörigkeitsnuance fest.'
  naturalness: „Darauf antwortete Jesus ihnen“ sowie die anschließende direkte Rede sind flüssiges modernes Standarddeutsch. Die verbale Wiedergabe „Was ich lehre“ vermeidet unnötig fachsprachlichen Klang und bleibt dem Sinn von διδαχή angemessen.
  terminology: „gesandt“ ist die treffende, etablierte Wiedergabe von πέμψαντος. Die Formulierung vermeidet sowohl eine dogmatisch überbestimmte Deutung als auch eine Abschwächung der im Text erkennbaren Beziehung zwischen Jesus und seinem Sender.
