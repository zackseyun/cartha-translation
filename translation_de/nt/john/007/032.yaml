  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: de
  text: Die Pharisäer hörten die Menge dies über ihn murmeln[a]. Da sandten die führenden Priester und die Pharisäer Bedienstete[b] aus, um ihn festzunehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „murren“ oder „tuscheln“. Das griechische Wort bezeichnet gedämpftes Reden und kann einen missbilligenden Unterton haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wachleute“ oder „Leute von der Tempelwache“. Gemeint sind offizielle Bedienstete, die von den führenden Priestern und Pharisäern ausgesandt wurden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „um ihn zu ergreifen“. Im Zusammenhang ist seine Festnahme gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: hörten
  rationale: Der Aorist von ἀκούω bezeichnet hier, dass die Pharisäer die Äußerungen der Menge wahrnahmen bzw. davon erfuhren. „Hörten“ ist im Deutschen natürlich und lässt beides zu.
- source_word: τοῦ ὄχλου
  choice: die Menge
  rationale: ὄχλος bezeichnet die versammelte Menschenmenge; „die Menge“ ist eine klare und geläufige deutsche Wiedergabe.
- source_word: γογγύζοντος
  choice: murmelte
  rationale: γογγύζω bezeichnet gedämpftes, oft unzufriedenes Reden. „Murmeln“ bewahrt sowohl die geringe Lautstärke als auch die mögliche missbilligende Färbung, ohne sie zu stark festzulegen.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: dies über ihn
  rationale: Die Wendung bezeichnet den Inhalt der Äußerungen über Jesus. Das idiomatische „dies“ fasst das griechische neutrale Plural ταῦτα im Deutschen natürlich zusammen.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural ἀρχιερεῖς meint die Mitglieder der hohen priesterlichen Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ macht diese historische Funktion verständlich.
- source_word: ἀπέστειλαν
  choice: sandten ... aus
  rationale: ἀποστέλλω bedeutet hier, Personen mit einem Auftrag zu entsenden. Die trennbare Form „aussenden“ gibt diesen Auftragscharakter natürlich wieder.
- source_word: ὑπηρέτας
  choice: ihre Leute
  rationale: ὑπηρέται sind hier amtliche Bedienstete der religiösen Führung, die zur Vollstreckung ausgesandt werden. „Ihre Leute“ ist verständlich und institutionell offen; genauere Alternativen werden in der Fußnote genannt.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: um ihn festzunehmen
  rationale: ἵνα mit dem Aorist Konjunktiv drückt den Zweck aus. πιάζω bedeutet ergreifen bzw. gefangen nehmen; „festnehmen“ gibt im Kontext die beabsichtigte Verhaftung natürlich wieder.
theological_decisions:
- issue: Institutionelle Identität der ὑπηρέται
  choice: amtliche Bedienstete der führenden Priester und Pharisäer, im Text allgemein als „ihre Leute“ bezeichnet
  alternative: „Tempelwache“, „Wachleute“ oder „Diener“
  rationale: Der Zusammenhang zeigt einen offiziellen Auftrag zur Festnahme Jesu. Die griechische Bezeichnung selbst legt jedoch nicht vollständig fest, wie spezialisiert oder organisatorisch abgegrenzt diese Gruppe war; daher bleibt der Haupttext zurückhaltend und die Fußnote nennt präzisierende Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murmeln“ wahrt die gedämpfte und möglicherweise unzufriedene Nuance. „Führende Priester“ vermeidet das missverständliche „Hohepriester“ im Plural. „Ihre Leute“ hält die genaue institutionelle Stellung der ὑπηρέται offen; die Fußnote bietet historische Präzisierungen.
