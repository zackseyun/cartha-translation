source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: de
  text: Darum hat Mose euch die Beschneidung gegeben – sie stammt nicht von Mose, sondern von den Vätern – und am Sabbat beschneidet ihr einen Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihr beschneidet am Sabbat einen Menschen.“ Die Wortstellung kann im Deutschen variiert werden. „Die Väter“ bezeichnet die patriarchalischen Vorfahren; die Beschneidung hat ihren Ursprung nicht bei Mose, sondern schon vor ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den erklärenden beziehungsweise folgernden Anschluss knapp und idiomatisch wieder; der genaue Bezug zum vorangehenden Gedankengang bleibt wie im Griechischen offen.
- source_word: Μωϋσῆς δέδωκεν ὑμῖν
  choice: Mose hat euch … gegeben
  rationale: Das deutsche Perfekt bildet die vollendete Stiftung mit fortdauernder Geltung natürlich ab.
- source_word: τὴν περιτομήν
  choice: die Beschneidung
  rationale: Bezeichnet die überlieferte Bundesordnung und Praxis direkt und im Deutschen geläufig.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: nicht als ob sie von Mose stammte, sondern von den Vätern
  rationale: Kennzeichnet den Einschub als Korrektur eines möglichen Missverständnisses und bewahrt mit „von“ die Aussage über den Ursprung. „Die Väter“ erhält den biblischen Bezug auf die patriarchalischen Vorfahren.
- source_word: ἐν σαββάτῳ
  choice: am Sabbat
  rationale: Natürliche deutsche Wiedergabe der temporalen Dativkonstruktion; gemeint ist die allgemein anerkannte Praxis am Sabbat.
- source_word: περιτέμνετε ἄνθρωπον
  choice: ihr beschneidet einen Menschen
  rationale: Bewahrt sowohl die direkte Verbform als auch das ausdrücklich gesetzte Objekt. „Mensch“ entspricht ἄνθρωπος und vermeidet die zusätzliche Festlegung auf einen erwachsenen Mann, auch wenn die Beschneidung einen männlichen Menschen betrifft.
theological_decisions:
- issue: Bezug von „den Vätern“
  choice: Die patriarchalischen Vorfahren, bei denen die Beschneidung schon vor Mose bestand
  alternative: Israels Vorfahren im weiteren Sinn
  rationale: Der Einschub stellt den vormosaischen Ursprung der Beschneidung heraus, ohne die Referenz im Haupttext erklärend auszuweiten.
- issue: Verhältnis der Beschneidung zu Mose
  choice: Mose gab Israel die Beschneidung als geltende Ordnung, war aber nicht ihr historischer Ursprung
  alternative: Mose habe die Beschneidung ausschließlich deshalb gegeben, weil sie von den Vätern stammt
  rationale: „Nicht als ob …“ wahrt die korrigierende Funktion von οὐχ ὅτι; die kausale Deutung bleibt in der Fußnote als sprachliche Möglichkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche markieren den erklärenden Einschub des griechischen Satzes. „Einen Menschen“ klingt bewusst etwas formeller, erhält aber die konkrete und zugleich altersneutrale Ausdrucksweise des Originals.
