  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: de
  text: Als das Fest schon zur Hälfte vorüber war[a], ging Jesus hinauf in den Tempel[b] und lehrte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als die Mitte des Festes erreicht war.“'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete griechische Wort bezeichnet den Tempelbezirk mit seinen Vorhöfen, nicht speziell das innere Heiligtum.
    reason: cultural_note
  - marker: c
    text: 'Das griechische Imperfekt kann die andauernde Handlung betonen: „lehrte gerade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: schon
  rationale: Kennzeichnet den bereits erreichten Zeitpunkt innerhalb des Festverlaufs und entspricht im Deutschen natürlich dem griechischen Temporaladverb.
- source_word: δὲ
  choice: unmarkiert im Satzanschluss
  rationale: Die Partikel dient hier einem milden erzählerischen Übergang; ein ausdrückliches „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: als das Fest schon zur Hälfte vorüber war
  rationale: Der Genitivus absolutus gibt den zeitlichen Umstand an; die Formulierung drückt verständlich aus, dass die Festmitte erreicht war.
- source_word: ἀνέβη
  choice: ging … hinauf
  rationale: Bewahrt die Richtungsangabe von ἀναβαίνω, die zum Hinaufgehen nach Jerusalem beziehungsweise in den Tempelbereich passt.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Im Deutschen übliche Namensform.
- source_word: εἰς τὸ ἱερὸν
  choice: in den Tempel
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbezirk einschließlich der Vorhöfe; „Tempel“ ist die natürliche deutsche Wiedergabe, die Präzisierung steht in der Fußnote.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt beschreibt die damals andauernde Lehrtätigkeit. Das deutsche Präteritum ist idiomatisch und legt anders als „begann zu lehren“ keinen ausdrücklich inchoativen Sinn in den Text.
theological_decisions:
- issue: Bezugsumfang von ἱερόν
  choice: „Tempel“ mit Fußnote zum Tempelbezirk und zu den Vorhöfen
  alternative: „Tempelbezirk“ oder „Tempelvorhöfe“ im Haupttext
  rationale: Die griechische Wortwahl meint nicht speziell das innere Heiligtum (ναός). Die traditionelle, verständliche Bezeichnung bleibt im Haupttext, während die räumliche Genauigkeit in der Fußnote gewahrt wird.
- issue: Aspekt von ἐδίδασκεν
  choice: „lehrte“ mit Hinweis auf den möglichen Verlaufssinn
  alternative: „war am Lehren“ oder „begann zu lehren“
  rationale: Das Imperfekt kann die fortdauernde Handlung hervorheben, bezeichnet aber nicht von sich aus ausdrücklich ihren Beginn. Die Übersetzung vermeidet daher eine unbelegte inchoative Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und erzählerisch. „Zur Hälfte vorüber“ ist allgemein verständlich; die Fußnoten bewahren die räumliche Präzision von ἱερόν und den Verlaufssinn des Imperfekts.
