  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: de
  text: Urteilt nicht nach dem äußeren Anschein[a], sondern fällt ein gerechtes Urteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem, was äußerlich sichtbar ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Urteilt nicht
  rationale: Der verneinte Präsensimperativ wird als allgemeines Verbot wiedergegeben, ohne den Aspekt überdeutend als „Hört auf zu urteilen“ festzulegen.
- source_word: κατ’ ὄψιν
  choice: nach dem äußeren Anschein
  rationale: Die Wendung bezeichnet ein Urteil aufgrund dessen, was äußerlich sichtbar ist oder zunächst den Anschein erweckt. „Äußerer Anschein“ ist im Deutschen natürlich und wahrt den Gegensatz zum gerechten Urteil.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung bringt „sondern“ den scharfen Gegensatz zwischen der untersagten und der gebotenen Art des Urteilens idiomatisch zum Ausdruck.
- source_word: τὴν δικαίαν κρίσιν κρίνετε
  choice: fällt ein gerechtes Urteil
  rationale: Die wörtliche Verbindung „urteilt das gerechte Urteil“ wäre im Deutschen unnatürlich. „Ein Urteil fällen“ bewahrt κρίσις als Substantiv und gibt die Aufforderung klar und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von δικαίαν im ethisch-rechtlichen Zusammenhang
  choice: gerecht
  alternative: richtig / rechtmäßig
  rationale: „Gerecht“ erhält sowohl die ethische als auch die richterliche Bedeutungsweite von δίκαιος, ohne den Ausdruck auf bloße Verfahrenskorrektheit oder subjektive Richtigkeit einzuengen.
- issue: Verhältnis zwischen dem Verbot und dem anschließenden Gebot zu urteilen
  choice: Beide Aufforderungen werden ausdrücklich stehen gelassen
  alternative: Das erste κρίνετε als absolutes Verbot jedes Urteilens deuten
  rationale: Der Vers verbietet nicht jedes Urteilen schlechthin, sondern stellt dem Urteilen nach äußerem Anschein ein gerechtes Urteil gegenüber. Diese Spannung wird nicht dogmatisch weiter aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die idiomatische Wendung „ein Urteil fällen“ vermeidet eine unnatürliche Nachbildung der griechischen figura etymologica, während „Urteilt … Urteil“ ihren Wortklang teilweise erhält.
