id: JHN.7.31
reference: John 7:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: de
  text: 'Doch viele aus der Menge glaubten an ihn, und sie sagten: „Wenn der Messias[a] kommt, wird er etwa mehr Zeichen tun, als dieser Mann getan hat?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Χριστός ist hier ein Titel und bedeutet „der Gesalbte“; im jüdisch-messianischen Zusammenhang wird es mit „Messias“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Doch viele aus der Menge
  rationale: „Doch“ gibt den milden Gegensatz des δέ wieder; „viele aus der Menge“ bewahrt den partitiven Sinn von ἐκ τοῦ ὄχλου.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: glaubten an ihn
  rationale: Die geläufige deutsche Wendung gibt den auf Jesus gerichteten persönlichen Glauben präzise und ohne zusätzliche Deutung wieder.
- source_word: ἔλεγον
  choice: sie sagten
  rationale: Das deutsche Präteritum ist im erzählenden Kontext natürlich. Eine ausdrückliche Wiederholungsangabe wie „immer wieder“ wäre möglich, würde den imperfektiven Aspekt aber stärker festlegen, als der Kontext verlangt.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός wird hier eindeutig als jüdischer Erwartungstitel gebraucht; „Messias“ macht diese Funktion im modernen Deutschen unmittelbar verständlich.
- source_word: ὅταν ἔλθῃ
  choice: wenn … kommt
  rationale: Die Verbindung bezeichnet ein erwartetes, noch zukünftiges Kommen; „wenn“ gibt dies idiomatisch wieder, ohne daraus eine bloße Möglichkeit zu machen.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: wird er etwa mehr Zeichen tun
  rationale: „Etwa“ kennzeichnet im Deutschen eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird, ohne die Aussage in eine ausdrückliche Behauptung umzuwandeln.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ erhält den für das Johannesevangelium wichtigen Hinweischarakter der Taten und verengt sie nicht auf das Wort „Wunder“.
- source_word: ὧν οὗτος ἐποίησεν
  choice: als dieser Mann getan hat
  rationale: „Dieser Mann“ ist eine natürliche Wiedergabe des demonstrativen οὗτος im Sprachgebrauch der Menge; das Perfekt stellt die bereits vollbrachten Zeichen passend dem erwarteten zukünftigen Handeln gegenüber.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Im Satz geht es um den erwarteten Gesalbten, der noch kommen soll. „Messias“ wahrt diesen jüdisch-messianischen Zusammenhang; „Christus“ bleibt als mögliche formnähere Wiedergabe in der Fußnote erhalten.
- issue: Aussagekraft der mit μή eingeleiteten rhetorischen Frage
  choice: Eine verneinende Antwort wird durch „etwa“ nahegelegt
  alternative: Neutrale Zukunftsfrage ohne erkennbare Antworterwartung
  rationale: μή signalisiert hier üblicherweise die Erwartung „nein“. Die Formulierung lässt die Äußerung dennoch als Frage stehen und löst die darin enthaltene messianische Spannung nicht ausdrücklich auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede der Menge bleibt natürlich und knapp; „etwa“ trägt die rhetorische Erwartung der griechischen Frage, ohne eine erklärende Aussage daraus zu machen.
