id: JHN.7.30
reference: John 7:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: de
  text: Daraufhin versuchten sie, ihn zu ergreifen[a]. Doch niemand legte Hand an ihn, denn seine Stunde war noch nicht gekommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn festzunehmen“. Das griechische Verb bedeutet „ergreifen“; im Zusammenhang ist wahrscheinlich eine Festnahme beabsichtigt.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Stunde“ ist im Johannesevangelium eine wiederkehrende Bezeichnung für den von Gott bestimmten Zeitpunkt in Jesu Sendung, besonders für sein Leiden, seinen Tod, seine Auferstehung und seine Verherrlichung.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: versuchten sie
  rationale: Das Imperfekt bezeichnet ein anhaltendes oder wiederholtes Bemühen. Im Deutschen gibt „versuchten sie“ dies natürlich wieder; die Zielhandlung folgt im Infinitiv.
- source_word: οὖν
  choice: Daraufhin
  rationale: Das Wort kennzeichnet hier die folgernde Fortsetzung der Erzählung. „Daraufhin“ verbindet den Versuch unmittelbar mit dem vorausgehenden Geschehen, ohne übermäßig formell zu wirken.
- source_word: πιάσαι
  choice: zu ergreifen
  rationale: „Ergreifen“ bewahrt den Grundsinn des Verbs. Im Kontext ist eine Festnahme gemeint, doch „festzunehmen“ würde den rechtlichen Aspekt stärker ausdeuten, als das Verb allein verlangt.
- source_word: οὐδεὶς
  choice: niemand
  rationale: Klare und unmittelbare Wiedergabe des verneinten Indefinitpronomens.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: legte Hand an ihn
  rationale: Die deutsche Wendung gibt das griechische Bild idiomatisch wieder und bewahrt den Singular „Hand“; im Zusammenhang bedeutet sie, ihn gewaltsam zu ergreifen.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung dafür ein, dass niemand gegen Jesus vorging. „Denn“ ist hier im Deutschen natürlich und würdevoll.
- source_word: οὔπω
  choice: noch nicht
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Verneinung.
- source_word: ἐληλύθει
  choice: war ... gekommen
  rationale: Das Plusquamperfekt bezeichnet, dass der entscheidende Zeitpunkt bis dahin noch nicht eingetreten war.
- source_word: ἡ ὥρα αὐτοῦ
  choice: seine Stunde
  rationale: Die wörtliche Wendung bewahrt den wiederkehrenden johanneischen Leitbegriff und seine theologische Mehrdeutigkeit besser als das allgemeinere „seine Zeit“.
theological_decisions:
- issue: Bedeutung von „seine Stunde“ im Johannesevangelium
  choice: Die Wendung „seine Stunde“ bleibt im Haupttext unaufgelöst stehen.
  alternative: „Seine Zeit“ oder „die für seinen Tod bestimmte Zeit“
  rationale: Im Johannesevangelium verweist die „Stunde“ auf den von Gott bestimmten Verlauf der Sendung Jesu, besonders auf Leiden, Tod und Verherrlichung. Der einzelne Vers beschränkt sie jedoch nicht ausdrücklich auf nur eines dieser Ereignisse; daher wird die theologische Spannung bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Daraufhin“ stellt den Folgezusammenhang her; „Hand an ihn legen“ und „seine Stunde“ bewahren die Bildsprache und die johanneische Begrifflichkeit.
