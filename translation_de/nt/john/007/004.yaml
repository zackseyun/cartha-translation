  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: de
  text: Denn niemand tut etwas im Verborgenen und will zugleich öffentlich auftreten.[a] Wenn du diese Dinge tust, dann zeige dich der Welt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in aller Öffentlichkeit sein« oder »öffentlich bekannt sein«. Der griechische Ausdruck betont Offenheit und öffentliche Sichtbarkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Denn niemand
  rationale: Bewahrt die verallgemeinernde Verneinung und die begründende Verbindung zum vorherigen Vers.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: tut etwas im Verborgenen
  rationale: Gibt das indefinite Objekt τι wieder und übersetzt ἐν κρυπτῷ mit einer natürlichen, würdigen deutschen Wendung.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: und will zugleich
  rationale: ζητεῖ bezeichnet hier das Streben nach einem Ziel; „will“ klingt im Deutschen natürlich. „zugleich“ macht den im Satz angelegten Gegensatz deutlich, während die Subjektbetonung durch αὐτός im Deutschen nicht eigens wiederholt werden muss.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: öffentlich bekannt sein
  rationale: Im Kontext bezeichnet παρρησία öffentliche Offenheit beziehungsweise Sichtbarkeit, nicht in erster Linie freimütiges Reden. Die Formulierung wahrt die Bedeutungsbreite, ohne eine bestimmte Auslegung festzulegen.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Wenn du diese Dinge tust
  rationale: Entspricht der offenen Bedingungsform und lässt „diese Dinge“ auf Jesu zuvor genannte Werke verweisen.
- source_word: φανέρωσον σεαυτὸν
  choice: dann zeige dich
  rationale: Gibt den entschiedenen Imperativ direkt und idiomatisch wieder; „dann“ markiert im Deutschen natürlich die Folgerung aus dem Wenn-Satz.
- source_word: τῷ κόσμῳ
  choice: der Welt
  rationale: Bewahrt den johanneischen Schlüsselbegriff κόσμος und dessen mögliche literarisch-theologische Resonanz, statt ihn auf „Öffentlichkeit“ einzuengen.
theological_decisions:
- issue: Bedeutung von κόσμος im johanneischen Zusammenhang
  choice: der Welt
  alternative: der Öffentlichkeit
  rationale: Der unmittelbare Zusammenhang betrifft öffentliches Auftreten, doch „Welt“ bewahrt die wiederkehrende johanneische Ausdrucksweise und lässt deren weitergehende Resonanz offen.
- issue: Bedeutung von ἐν παρρησίᾳ εἶναι
  choice: öffentlich bekannt sein
  alternative: öffentlich auftreten / in aller Öffentlichkeit sein
  rationale: Die Wendung kann Offenheit, Öffentlichkeit oder Sichtbarkeit bezeichnen. „Öffentlich bekannt sein“ passt zum Gegensatz mit dem Verborgenen, ohne die Aussage auf bloße räumliche Sichtbarkeit oder auf freimütiges Reden zu reduzieren.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Register. Der erklärende Anschluss mit „Denn“, der Gegensatz zwischen Verborgenheit und Öffentlichkeit sowie der zugespitzte Imperativ bleiben erhalten.
