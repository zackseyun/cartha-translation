  language: de
  text: Und jeder ging nach Hause.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers eröffnet die Erzählung von der beim Ehebruch ertappten Frau (Johannes 7,53–8,11). Der gesamte Abschnitt fehlt in den frühesten erhaltenen griechischen Handschriften, darunter Papyri aus dem 3. Jahrhundert sowie der Codex Sinaiticus und der Codex Vaticanus aus dem 4. Jahrhundert, ebenso in frühen koptischen und syrischen Übersetzungen. Er findet sich dagegen im Codex Bezae aus dem 5. Jahrhundert, in der lateinischen Überlieferung und in der späteren byzantinischen Mehrheitstradition. In einigen Handschriften steht die Erzählung an anderen Stellen, etwa nach Johannes 21,25 oder nach Lukas 21,38. Diese unterschiedliche Stellung ist ein wichtiger Befund für die Überlieferungsgeschichte des Abschnitts. Hier wird sie bewahrt, weil sie seit rund 1.500 Jahren in der christlichen Lesetradition theologisch und seelsorgerlich hochgeschätzt wird.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: Und
  rationale: Die Konjunktion verbindet den Satz mit dem vorausgehenden Erzählzusammenhang; das natürliche deutsche „Und“ bewahrt diesen Anschluss.
- source_word: ἐπορεύθη
  choice: ging
  rationale: Das Verb bezeichnet hier die Bewegung beim Auseinandergehen; „ging“ ist im Deutschen schlicht und kontextgerecht.
- source_word: ἕκαστος
  choice: jeder
  rationale: Das substantivisch gebrauchte Singularwort hebt hervor, dass die Einzelnen jeweils für sich fortgingen.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nach Hause
  rationale: Die Wendung bedeutet in diesem Zusammenhang idiomatisch „nach Hause“; „in sein Haus“ wäre im modernen Deutschen unnötig wörtlich.
theological_decisions:
- issue: Textgeschichtlicher Status von Johannes 7,53–8,11
  choice: Der Vers bleibt im Haupttext und wird mit einer textkritischen Fußnote gekennzeichnet.
  alternative: Den Abschnitt aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Der vorgegebene byzantinische Ausgangstext enthält den Vers. Zugleich verlangt die bedeutende und frühe handschriftliche Abwesenheit des gesamten Abschnitts einen transparenten Hinweis, ohne seine Zugehörigkeit zum ursprünglichen Johannesevangelium vorschnell zu behaupten oder zu verneinen.
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Die idiomatische Wendung „nach Hause“ vermeidet steife Wörtlichkeit; die knappe Satzgestalt des Griechischen bleibt erhalten.
