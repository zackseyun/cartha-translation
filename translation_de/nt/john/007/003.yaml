source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: de
  text: 'Da sagten seine Brüder zu ihm: „Geh von hier fort und geh nach Judäa, damit auch deine Jünger die Werke sehen[a], die du vollbringst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sehen werden“. Das griechische Verb kann auch ein aufmerksames Betrachten oder Beobachten bezeichnen.'
    reason: Die Futurform θεωρήσουσιν steht in einem Zwecksatz mit ἵνα. Natürliches Deutsch verwendet hier meist das Präsens; die Fußnote weist auf die mögliche futurische Wiedergabe sowie auf die Bedeutungsnuance des Verbs hin.
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: „Da“ verbindet den Satz natürlich mit dem vorausgehenden Erzählzusammenhang und bewahrt den folgernden beziehungsweise fortführenden Charakter von οὖν.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: seine Brüder
  rationale: Der maskuline Plural bezeichnet in diesem Zusammenhang Jesu männliche Familienangehörige; „Brüder“ gibt die Form direkt wieder, ohne den Verwandtschaftsgrad näher festzulegen, als es der Text tut.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Geh von hier fort
  rationale: Die direkte Aufforderung zum Verlassen des gegenwärtigen Ortes wird in modernem Deutsch klar und mit der nötigen Nachdrücklichkeit wiedergegeben.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: geh nach Judäa
  rationale: Die zweite Bewegungsaufforderung und das geografische Ziel bleiben ausdrücklich erhalten. „Judäa“ ist die übliche deutsche Bezeichnung der Region.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: damit auch deine Jünger
  rationale: „Damit“ gibt den Zweck wieder; „auch“ steht beim Subjekt und erhält so den Bezug von καί. „Jünger“ bewahrt die für Johannes wichtige Lehrer-Schüler-Beziehung.
- source_word: θεωρήσουσιν
  choice: sehen
  rationale: Im deutschen Zwecksatz ist „sehen“ die natürliche Wiedergabe. Die griechische Futurform und die mögliche Nuance des betrachtenden Beobachtens werden in der Fußnote kenntlich gemacht.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: die Werke, die du vollbringst
  rationale: „Werke“ bewahrt den johanneischen Schlüsselbegriff ἔργα. „Vollbringst“ ist im Deutschen eine natürliche Verbindung mit „Werke“ und gibt ποιεῖς wieder; der Bezug auf Jesus ist durch den Relativsatz eindeutig, auch wenn das possessive Pronomen nicht nochmals eigens ausgedrückt wird.
theological_decisions:
- issue: Bezug von „seine Brüder“
  choice: Die Sprecher werden schlicht als Jesu Brüder bezeichnet.
  alternative: Weitere Verwandte oder Angehörige könnten mit dem Verwandtschaftsausdruck gemeint sein.
  rationale: Der unmittelbare Kontext spricht von Jesu ἀδελφοί. Die Übersetzung gibt den familiären Ausdruck direkt wieder, ohne daraus über den Vers hinausgehende dogmatische Folgerungen zur genauen biologischen Beziehung abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die zwei Bewegungsverben des griechischen Textes bleiben erhalten. Der thematisch wichtige Begriff „Werke“ wird nicht durch „Taten“ ersetzt.
