lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche deutsche Erzählverb gibt die Reaktion im Dialog klar und würdig wieder.
- source_word: ὁ ὄχλος
  choice: die Menge
  rationale: Die Wendung bezeichnet die anwesende Menschenmenge; „die Menge“ ist im Deutschen natürlich und vermeidet das altertümliche „Volkshaufen“.
- source_word: Δαιμόνιον ἔχεις
  choice: Du hast einen Dämon
  rationale: Die Übersetzung bewahrt die konkrete griechische Formulierung und verlegt die Deutung „besessen“ in die Fußnote.
- source_word: τίς
  choice: wer
  rationale: Das ausdrücklich gesetzte Fragepronomen bleibt in der rhetorischen Frage erhalten.
- source_word: ζητεῖ
  choice: sucht
  rationale: „Sucht“ bildet das griechische Präsens knapp ab; zusammen mit dem Infinitiv ist es verständliches, gehobenes Standarddeutsch.
- source_word: ἀποκτεῖναι
  choice: zu töten
  rationale: Dies ist die direkte Entsprechung, ohne die zusätzliche rechtlich-moralische Wertung von „ermorden“.
theological_decisions:
- issue: Wiedergabe von δαιμόνιον in der gegen Jesus gerichteten Anschuldigung
  choice: Die wörtliche Wendung „Du hast einen Dämon“ im Haupttext
  alternative: „Du bist von einem Dämon besessen“
  rationale: Der Text berichtet die feindselige Anschuldigung der Menge, ohne sie zu bestätigen. Die konkrete Ausgangsformulierung wahrt diese Spannung und vermeidet eine stillschweigende Ausdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Menge“ und „antwortete“ sind allgemein verständlich; die leicht ungewohnte Wendung „einen Dämon haben“ bleibt wegen ihrer Nähe zum griechischen Ausdruck stehen und wird durch die Fußnote erläutert.
