  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: de
  text: 'Die Menge antwortete: „Du hast einen Dämon[a]! Wer versucht, dich zu töten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bist von einem Dämon besessen.“ Wörtlich: „Du hast einen Dämon.“'
