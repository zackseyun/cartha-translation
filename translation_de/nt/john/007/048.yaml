  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: de
  text: Hat etwa jemand von den Oberen oder von den Pharisäern an ihn geglaubt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Frage ist so formuliert, dass eine verneinende Antwort erwartet wird.
    reason: Die Funktion von μή in dieser Frage ist im Deutschen durch „etwa“ angedeutet, lässt sich aber in einer Fußnote genauer benennen.
lexical_decisions:
- source_word: μή τις
  choice: Hat etwa einer
  rationale: Die Verbindung bewahrt die Frageform und zeigt im Deutschen zugleich natürlich an, dass die Sprecher eine verneinende Antwort erwarten, ohne die Frage in eine ausdrückliche Behauptung umzuwandeln.
- source_word: ἐκ τῶν ἀρχόντων
  choice: von den führenden Männern
  rationale: Gemeint sind anerkannte Angehörige der jüdischen Führung. „Führende Männer“ ist im Kontext verständlich und bildet zusammen mit „einer von“ die Zugehörigkeit zu dieser Gruppe idiomatisch ab.
- source_word: ἐπίστευσεν
  choice: geglaubt
  rationale: Das Perfekt in der deutschen Frage gibt den griechischen Aorist hier natürlich wieder und bewahrt die johanneische Glaubensterminologie.
- source_word: εἰς αὐτόν
  choice: an ihn
  rationale: Bei πιστεύω εἰς ist „an ihn glauben“ die idiomatische deutsche Entsprechung; das wörtlichere „in ihn hinein“ wäre unverständlich.
- source_word: ἢ
  choice: oder
  rationale: Die einfache nebenordnende Verbindung entspricht dem Griechischen, ohne eine zusätzliche Steigerung einzutragen.
- source_word: ἐκ τῶν Φαρισαίων
  choice: von den Pharisäern
  rationale: Die Formulierung bezeichnet die Zugehörigkeit zur Gruppe und steht parallel zu „von den führenden Männern“.
theological_decisions:
- issue: Rhetorische Wirkung der mit μή eingeleiteten Frage
  choice: Als Frage mit erwarteter verneinender Antwort wiedergeben
  alternative: Keiner von den führenden Männern oder den Pharisäern hat an ihn geglaubt.
  rationale: μή τις legt die erwartete Antwort „nein“ nahe, doch der griechische Text bleibt eine Frage. Die deutsche Partikel „etwa“ erhält sowohl die Frageform als auch ihre abweisende rhetorische Tendenz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten; „etwa“ macht ihre erwartete Verneinung natürlich hörbar. „Führende Männer“ bezeichnet hier die anerkannten jüdischen Führungspersonen und vermeidet das im heutigen Deutsch missverständliche „Herrscher“.
