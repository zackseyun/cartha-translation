id: JHN.7.51
reference: John 7:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: de
  text: Spricht etwa unser Gesetz über einen Menschen ein Urteil, ohne ihn zuerst selbst anzuhören und festzustellen, was er tut?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bevor es ihn selbst angehört und erfahren hat, was er tut?“'
    reason: Die griechische Formulierung kann näher an ihrer Satzstruktur mit „bevor“ wiedergegeben werden; γνῷ kann auch „erfahren“ bedeuten.
lexical_decisions:
- source_word: Μὴ
  choice: Spricht etwa ...?
  rationale: Das einleitende μή kennzeichnet eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird. „Etwa“ vermittelt diese Erwartung im natürlichen Deutschen.
- source_word: ὁ νόμος ἡμῶν
  choice: unser Gesetz
  rationale: Die Wendung bezeichnet die Rechtsordnung, auf die Nikodemus sich beruft. Die Kleinschreibung vermeidet, den Bezug unnötig auf den Pentateuch allein einzuengen.
- source_word: κρίνει
  choice: spricht ... ein Urteil über
  rationale: κρίνω bezeichnet hier das Fällen eines Urteils. Diese Formulierung wahrt den rechtlichen Rahmen, ohne das stärkere „verurteilen“ vorwegzunehmen.
- source_word: τὸν ἄνθρωπον
  choice: einen Menschen
  rationale: Der Singular ist repräsentativ und allgemein gebraucht. „Einen Menschen“ bewahrt den Singular und klingt im modernen Deutschen natürlich.
- source_word: ἐὰν μὴ
  choice: ohne
  rationale: 'In Verbindung mit der rhetorischen Hauptfrage gibt „ohne“ die notwendige Vorbedingung idiomatisch wieder: Das Gesetz urteilt nicht, bevor das Anhören und Feststellen erfolgt ist.'
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: ihn zuerst selbst anzuhören
  rationale: παρ’ αὐτοῦ hebt hervor, dass die Auskunft von der betroffenen Person selbst kommt. „Ihn ... selbst anzuhören“ gibt dies natürlich wieder; „zuerst“ bewahrt πρῶτον.
- source_word: γνῷ
  choice: festzustellen
  rationale: Im rechtlichen Zusammenhang geht es um das Ermitteln beziehungsweise Feststellen des Sachverhalts, nicht bloß um statisches Wissen.
- source_word: τί ποιεῖ
  choice: was er tut
  rationale: Die Präsensform wird gewahrt und bleibt bewusst offen zwischen gegenwärtigem Handeln und charakteristischem Tun.
theological_decisions:
- issue: Reichweite von νόμος
  choice: „unser Gesetz“ ohne nähere Bestimmung
  alternative: „unser Gesetz“, ausdrücklich als mosaisches Gesetz erklärt
  rationale: Der Vers selbst legt nicht eindeutig fest, ob ausschließlich die Tora oder auch die geltende jüdische Rechtstradition gemeint ist; die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Färbung wird durch „ein Urteil sprechen“, „anhören“ und „feststellen“ bewahrt. Die rhetorische Frage bleibt als Frage mit erwarteter verneinender Antwort erkennbar.
