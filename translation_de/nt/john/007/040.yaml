source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: de
  text: 'Als nun einige aus der Menge diese Worte hörten, sagten sie: »Dieser ist wirklich der Prophet.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Der Prophet« meint wahrscheinlich den erwarteten Propheten wie Mose (siehe 5. Mose 18,15). Manche verstehen den Ausdruck jedoch nicht als feste Titelbezeichnung, sondern allgemeiner.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: Einige aus der Menge
  rationale: Die Präpositionalfügung bezeichnet hier einen Teil der größeren Menschenmenge; »Einige aus der Menge« macht diesen partitiven Sinn im Deutschen natürlich deutlich.
- source_word: οὖν
  choice: nun
  rationale: »Nun« wahrt den folgernden beziehungsweise fortführenden Anschluss an Jesu vorherige Worte, ohne im Deutschen eine stärkere logische Folgerung zu behaupten, als der Kontext verlangt.
- source_word: ἀκούσαντες
  choice: die ... gehört hatten
  rationale: Das Partizip bezeichnet eine Handlung, die der Äußerung vorausgeht. Das Plusquamperfekt bildet dieses zeitliche Verhältnis idiomatisch ab.
- source_word: τῶν λόγων τούτων
  choice: diese Worte
  rationale: Gemeint sind die unmittelbar zuvor gesprochenen Worte Jesu; die schlichte Wiedergabe ist im Kontext präzise und natürlich.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der deutsche Plural bezeichnet die Äußerung mehrerer Personen hinreichend natürlich. Eine Verlaufsform wie »waren am Sagen« wäre unidiomatisch, während »sagten immer wieder« eine nicht sicher geforderte Wiederholung verstärken würde.
- source_word: Οὗτός ἐστιν
  choice: Dieser ist
  rationale: Die Formulierung bewahrt den nachdrücklichen, auf Jesus weisenden Demonstrativcharakter des griechischen Ausdrucks und passt zum würdevollen Register.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: »Wirklich« drückt die Bekräftigung als echte, zutreffende Identifikation in modernem Standarddeutsch aus, ohne unnötig altertümlich zu klingen.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Der bestimmte Ausdruck hat im johanneischen Zusammenhang wahrscheinlich titelartigen Charakter und verweist auf den erwarteten Propheten; die Großschreibung signalisiert dies, ohne die Identität ausdrücklich weiter festzulegen.
theological_decisions:
- issue: Identität des mit ὁ προφήτης bezeichneten »Propheten«
  choice: Titelartig als »der Prophet« wiedergeben, ohne ihn im Haupttext ausdrücklich mit dem Messias gleichzusetzen.
  alternative: Den Ausdruck allgemein als »der Prophet« ohne Bezug auf die Erwartung eines Mose ähnlichen Propheten verstehen oder ihn ausdrücklich als messianischen Titel deuten.
  rationale: Johannes 7 lässt unterschiedliche Einschätzungen Jesu nebeneinanderstehen. Der Ausdruck kann auf die Erwartung aus 5. Mose 18,15 anspielen, doch der Vers selbst löst das Verhältnis zwischen diesem Propheten und dem Messias nicht ausdrücklich auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung »Einige aus der Menge nun« hält den Anschluss durch οὖν sichtbar. Der Haupttext wahrt die titelartige, aber nicht vollständig erklärte Bezeichnung »der Prophet«.
