  source_fidelity: Der Entwurf gibt die griechische Frage und das anschließende, einheitlich zitierte Jesuswort zuverlässig wieder. »Ihr werdet mich suchen und nicht finden« entspricht Ζητήσετέ με καὶ οὐχ εὑρήσετε; »wo ich bin« bewahrt das Präsens von ὅπου εἰμὶ ἐγώ. »Dorthin könnt ihr nicht kommen« gibt die durch οὐ δύνασθε ausgedrückte Unmöglichkeit idiomatisch wieder, ohne »wo ich bin« zu »wohin ich gehe« umzudeuten.
  naturalness: Modernes Standarddeutsch und angemessen würdevoller Bibelregister. Die einleitende Formulierung »Was meint er mit diesem Ausspruch?« ist gegenüber einer streng formalen Nachbildung natürlich, ohne den Sinn wesentlich einzuengen. Das Semikolon gliedert die zwei durch καί verbundenen Teile des einen Zitats lesbar.
  terminology: »Ausspruch« ist für λόγος in diesem Kontext vertretbar und wird durch die Fußnote sachgerecht als kontextuelle Wahl ausgewiesen. »Suchen«, »finden«, »wo ich bin« und »könnt ihr nicht kommen« sind terminologisch und theologisch umsichtig. Die Fußnote zu »wo ich bin« bewahrt die im griechischen Präsens liegende Spannung und folgt dem englischen Audit-Trail.
