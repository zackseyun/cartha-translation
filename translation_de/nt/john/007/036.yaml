source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: de
  text: 'Was meint er mit diesem Ausspruch[a]: »Ihr werdet mich suchen und nicht finden; und wo ich bin[b], dorthin könnt ihr nicht kommen«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was ist dieser Ausspruch, den er gesagt hat?« Das griechische Wort λόγος kann je nach Zusammenhang unter anderem »Wort«, »Ausspruch«, »Aussage« oder »Botschaft« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Manche Übersetzungen geben dies mit »wohin ich gehe« wieder. Im griechischen Text steht hier jedoch »wo ich bin«; damit bleibt die Spannung in der Ausdrucksweise des Johannesevangeliums erhalten.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐστιν ὁ λόγος οὗτος ὃν εἶπε
  choice: Was meint er mit diesem Ausspruch
  rationale: Die Formulierung gibt die Frage nach dem Gehalt des zuvor Gesagten in natürlichem modernem Deutsch wieder. »Ausspruch« bezeichnet hier den Inhalt der Äußerung; »Was meint er mit …?« ist idiomatischer als das formal nähere, im Deutschen jedoch schwerfällige »Was ist dieser Ausspruch, den er gesagt hat?«.
- source_word: Ζητήσετέ με
  choice: Ihr werdet mich suchen
  rationale: »Suchen« entspricht ζητέω unmittelbar und bewahrt den gewichtigen johanneischen Sprachgebrauch.
- source_word: οὐχ εὑρήσετε
  choice: und nicht finden
  rationale: Die einfache Futurverneinung wird ohne zusätzliche Verstärkung wiedergegeben. Das Objekt »mich« ist im Deutschen aus dem ersten Teilsatz eindeutig mitzudenken.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: wo ich bin
  rationale: Die Übersetzung bewahrt bewusst das Präsens εἰμί und löst es nicht deutend zu »wohin ich gehe« auf. Das betonte ἐγώ muss im Deutschen nicht durch ein unnatürliches zusätzliches Pronomen markiert werden.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: dorthin könnt ihr nicht kommen
  rationale: »Könnt … nicht kommen« gibt die mit δύνασθε ausgedrückte Unfähigkeit idiomatisch und genau wieder. »Dorthin« nimmt den mit ὅπου bezeichneten Ort im Deutschen natürlich auf.
theological_decisions:
- issue: Präsens in Jesu Aussage »wo ich bin«
  choice: Das Präsens »wo ich bin« wird beibehalten.
  alternative: »wohin ich gehe«
  rationale: Der griechische Text hat εἰμί im Präsens. Die Übersetzung erhält damit die johanneische Spannung hinsichtlich Jesu Herkunft, Identität und Beziehung zum Vater, statt sie auf ein künftiges räumliches Ziel festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die einleitende Frage wird idiomatisch formuliert; die zitierte Aussage bleibt eng am griechischen Satzbau. Das Semikolon gliedert die beiden mit καί verbundenen Teile eines einzigen zusammenhängenden Ausspruchs.
