  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: de
  text: 'Da rief Jesus, während er im Tempel lehrte: »Ihr kennt mich und wisst, woher ich bin. Doch ich bin nicht von mir selbst aus gekommen; vielmehr ist der, der mich gesandt hat, wahrhaftig[a]. Ihn kennt ihr nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Wahrhaftig« kann hier auch »wirklich« oder »echt« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: rief
  rationale: Gibt die laute, öffentliche Äußerung wieder, ohne im Deutschen unnötig Not oder Aggressivität anzudeuten.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich; die übliche deutsche Wendung ist natürlich und im Kontext verständlich.
- source_word: διδάσκων ... καὶ λέγων
  choice: während er ... lehrte
  rationale: Der begleitende Partizipialausdruck wird flüssig wiedergegeben; das zusätzliche λέγων muss vor der direkten Rede im Deutschen nicht mechanisch mit »sagte« verdoppelt werden.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Ihr kennt mich und wisst
  rationale: Bewahrt die Wiederholung des Wissensverbs sinngemäß, verwendet aber für Personen idiomatisch »kennen« und für die Herkunft »wissen«.
- source_word: πόθεν εἰμί
  choice: woher ich bin
  rationale: Hält die Aussage über Jesu Herkunft bewusst weit und bewahrt ihren ungewöhnlichen, johanneischen Klang.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: von mir selbst aus
  rationale: Bewahrt die Herkunftsmetaphorik und kann zugleich das Handeln aus eigener Initiative bezeichnen.
- source_word: οὐκ ἐλήλυθα
  choice: bin nicht ... gekommen
  rationale: Das deutsche Perfekt gibt den vollzogenen Eintritt in Jesu gegenwärtige Sendung natürlich wieder.
- source_word: ἀληθινὸς
  choice: wahrhaftig
  rationale: Kann sowohl Verlässlichkeit als auch Echtheit ausdrücken und passt als Personenprädikat im Deutschen besser als das missverständliche »wahr«.
- source_word: ὁ πέμψας με
  choice: der, der mich gesandt hat
  rationale: Bewahrt die persönliche Handlungsbezeichnung, ohne den im Vers nicht ausdrücklich genannten Vater einzufügen.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: Ihn kennt ihr nicht
  rationale: Gibt den betonten Gegensatz und den persönlichen Gegenstand des Erkennens direkt wieder.
theological_decisions:
- issue: Aussage oder rhetorisch-ironische Frage in »Ihr kennt mich und wisst, woher ich bin«
  choice: Als Aussagesatz wiedergegeben
  alternative: »Ihr kennt mich und wisst, woher ich bin?«
  rationale: Die griechische Form ist deklarativ. Ein ironischer oder herausfordernder Unterton bleibt im Zusammenhang möglich, wird aber nicht durch Satzzeichen festgelegt.
- issue: Bedeutung von Jesu Herkunft
  choice: Die Formulierung bleibt offen für die sichtbare menschliche Herkunft und die tiefere göttliche Sendung
  alternative: Ausdrückliche Beschränkung auf geografische oder himmlische Herkunft
  rationale: Der johanneische Zusammenhang arbeitet mit mehreren Bedeutungsebenen; der Vers selbst grenzt die Herkunft hier nicht ausdrücklich auf nur eine Ebene ein.
- issue: Identität dessen, der Jesus gesandt hat
  choice: »der, der mich gesandt hat«
  alternative: »der Vater, der mich gesandt hat«
  rationale: Der griechische Text verwendet an dieser Stelle eine Umschreibung und nennt den Vater nicht ausdrücklich.
- issue: Bedeutung von ἀληθινός
  choice: »wahrhaftig« mit möglicher Bedeutung von verlässlich und wirklich/echt
  alternative: »wirklich« oder »echt«
  rationale: Die Übersetzung soll die johanneische Bedeutungsbreite nicht vorschnell auf nur Echtheit oder nur Wahrhaftigkeit verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentliche Lautstärke wird mit »rief« markiert. Die direkte Rede bleibt knapp und konfrontativ; die mögliche Ironie des ersten Satzes wird nicht ausdrücklich festgelegt.
