source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: de
  text: 'Da wunderten sich die Juden[a] und sagten: »Wie kann dieser Mann so gelehrt sein[b], ohne Unterricht erhalten zu haben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „die Juden“ sind hier im Zusammenhang Jesu jüdische Gesprächspartner beziehungsweise Gegner in Jerusalem gemeint, wahrscheinlich einschließlich judäischer Autoritäten, nicht das jüdische Volk insgesamt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Buchstaben kennen“; die Wendung kann bedeuten, schriftkundig oder gelehrt zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: wunderten sich
  rationale: Das Imperfekt beschreibt ihre anhaltende Reaktion; die deutsche Formulierung gibt das natürliche und fortdauernde Erstaunen im Erzählzusammenhang wieder.
- source_word: οὖν
  choice: Da
  rationale: „Da“ verbindet die Reaktion natürlich mit dem vorausgehenden Geschehen und bewahrt die erzählerische Folgerung.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Die direkte lexikalische Wiedergabe bewahrt die johanneische Ausdrucksweise. Eine Fußnote erläutert den kontextuell begrenzten Personenkreis, ohne ihn im Haupttext interpretierend einzuengen.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die beigeordnete deutsche Form gibt das Partizip idiomatisch wieder und leitet die direkte Rede klar ein.
- source_word: Πῶς
  choice: Wie kann
  rationale: Die erweiterte deutsche Frageform bringt das erstaunte Fragen nach der Möglichkeit dieser Kenntnis natürlich zum Ausdruck.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Dies entspricht im Deutschen dem distanzierenden, aber nicht notwendig abwertenden „dieser“.
- source_word: γράμματα οἶδεν
  choice: so gelehrt sein
  rationale: Die griechische Wendung bedeutet wörtlich „Buchstaben kennen“, bezeichnet hier aber anerkannte schriftbezogene Bildung oder Gelehrsamkeit. Die idiomatische Wiedergabe vermeidet die irreführende Aussage, Jesus könne lediglich lesen und schreiben; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
- source_word: μὴ μεμαθηκώς
  choice: obwohl er keinen Unterricht erhalten hat
  rationale: Das Perfektpartizip bezeichnet das Fehlen vorausgegangener, anerkannter Unterweisung mit fortbestehendem Ergebnis. Die Formulierung vermeidet die moderne Engführung von „nicht studiert“ auf ein Hochschulstudium.
theological_decisions:
- issue: Bezugsgruppe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden im Haupttext mit kontextueller Fußnote
  alternative: die jüdischen Führer / die Judäer
  rationale: Der Haupttext wahrt die breite griechische Bezeichnung und legt den Referenten nicht enger fest, als es der Wortlaut erlaubt. Die Fußnote verhindert zugleich, dass die Aussage fälschlich auf das jüdische Volk insgesamt bezogen wird.
- issue: Bedeutung von γράμματα οἶδεν
  choice: so gelehrt sein
  alternative: die Buchstaben kennen / die Schriften kennen / Schriftkenntnis besitzen
  rationale: Im Zusammenhang geht es um Jesu erstaunliche Kenntnis trotz fehlender formaler Unterweisung. „Gelehrt sein“ gibt diese idiomatische Bedeutung wieder, während die Fußnote die wörtliche Form und ihre Bedeutungsbreite bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist gut verständlich; „gelehrt“ bewahrt den Bezug zu anerkannter Bildung, ohne eine moderne akademische Institution vorauszusetzen.
