  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: de
  text: Das jüdische Laubhüttenfest stand kurz bevor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: Der schwache griechische Erzählanschluss wird im Deutschen durch den natürlichen Satz- und Kontextübergang ausreichend wiedergegeben; „aber“ würde einen zu starken Gegensatz ausdrücken.
- source_word: ἐγγὺς
  choice: war nahe
  rationale: Gibt die zeitliche Nähe knapp und verständlich wieder. „Stand kurz bevor“ wäre idiomatischer, aber etwas stärker ausdeutend.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: das jüdische …fest
  rationale: Die Genitivverbindung bezeichnet hier das Fest als jüdisches Fest. Die adjektivische Wiedergabe ist natürlich und vermeidet eine unnötig schwerfällige Formulierung.
- source_word: σκηνοπηγία
  choice: Laubhüttenfest
  rationale: Dies ist die etablierte und allgemein verständliche deutsche Bezeichnung für das jüdische Pilgerfest, dessen Name auf das Wohnen in Hütten verweist.
theological_decisions:
- issue: Wiedergabe von τῶν Ἰουδαίων in der Festbezeichnung
  choice: jüdische
  alternative: der Juden
  rationale: Die Wendung identifiziert das Fest sachlich als jüdisches Fest; sie ist hier nicht polemisch gebraucht.
- issue: Benennung von σκηνοπηγία
  choice: Laubhüttenfest
  alternative: Hüttenfest
  rationale: „Laubhüttenfest“ ist im Deutschen der geläufige Eigenname und bewahrt zugleich den Bezug auf die beim Fest errichteten Hütten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und folgt der griechischen Aussage eng, ohne den milden Anschluss δὲ durch ein überbetontes „aber“ wiederzugeben.
