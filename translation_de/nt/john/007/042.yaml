id: JHN.7.42
reference: John 7:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: de
  text: Hat nicht die Schrift gesagt, dass der Messias[a] aus der Nachkommenschaft Davids und aus Bethlehem, dem Dorf, wo David war, kommt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Der griechische Titel lautet ὁ χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Im johanneischen Sprachgebrauch bezeichnet der Singular die autoritative heilige Schrift; „die Schrift“ ist dafür die natürliche und traditionsübergreifend verständliche deutsche Wiedergabe.
- source_word: εἶπεν
  choice: hat ... gesagt
  rationale: Das Perfekt gibt die rhetorische Frage idiomatisch wieder und bringt zugleich die fortdauernde Geltung der Schriftaussage zum Ausdruck, ohne den griechischen Aorist übermäßig auszudeuten.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: aus der Nachkommenschaft Davids
  rationale: σπέρμα bezeichnet hier die genealogische Abstammung. „Nachkommenschaft“ ist präzise und würdevoll; das wörtlichere „Samen“ wäre im heutigen Deutsch missverständlich.
- source_word: ἀπὸ Βηθλέεμ
  choice: aus Bethlehem
  rationale: ἀπό bezeichnet hier Herkunft beziehungsweise Ursprung; „aus Bethlehem“ ist im Deutschen die natürliche Formulierung.
- source_word: τῆς κώμης
  choice: dem Dorf
  rationale: κώμη bezeichnet eine kleinere Ortschaft und wird lexikalisch genauer mit „Dorf“ als mit „Stadt“ wiedergegeben.
- source_word: ὅπου ἦν Δαυίδ
  choice: wo David war
  rationale: Die knappe, im Deutschen leicht ungewöhnliche Form wahrt die Unbestimmtheit des griechischen Ausdrucks. „Woher David stammte“ oder „wo David lebte“ würde den Bezug interpretierend festlegen.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens formuliert die geltende messianische Erwartung und lässt sich direkt und natürlich mit „kommt“ wiedergeben.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός fungiert hier als jüdischer Hoheitstitel in einer Debatte über die erwartete Herkunft. „Messias“ vermittelt diesen Titelsinn im modernen Deutsch; „der Christus“ bleibt als formnähere Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von ὁ χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Der Ausdruck bezeichnet hier den erwarteten davidischen Herrscher und ist nicht namensartig gebraucht. „Messias“ macht diese Funktion verständlich, ohne die Aussage konfessionell festzulegen; die formnähere Alternative wird dokumentiert.
- issue: Bedeutung von ὅπου ἦν Δαυίδ
  choice: wo David war
  alternative: woher David stammte / wo David lebte
  rationale: Der griechische Wortlaut bestimmt nicht ausdrücklich, ob Davids Herkunft, Wohnort oder Aufenthalt gemeint ist. Die Übersetzung bewahrt diese genuine Unbestimmtheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der rhetorischen Frage des Originals. „Wo David war“ wurde trotz seiner leichten Fremdheit beibehalten, um die semantische Offenheit des griechischen Textes nicht stillschweigend auf Herkunft oder Wohnsitz einzuengen.
