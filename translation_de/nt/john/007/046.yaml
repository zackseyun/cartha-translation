  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: de
  text: 'Die Diener antworteten: »Noch nie hat ein Mensch so gesprochen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: antworteten
  rationale: Das Aoristverb bezeichnet im erzählerischen Zusammenhang eine Antwort und wird im Deutschen natürlich mit »antworteten« wiedergegeben.
- source_word: οἱ ὑπηρέται
  choice: die Gerichtsdiener
  rationale: Gemeint sind die von den führenden jüdischen Autoritäten ausgesandten Amtspersonen (Johannes 7,32.45). »Gerichtsdiener« macht ihre amtliche Funktion deutlich, ohne die stärker ausdeutende Bezeichnung »Tempelpolizei« zu verwenden.
- source_word: Οὐδέποτε
  choice: Noch nie
  rationale: »Noch nie« gibt die zeitlich uneingeschränkte Verneinung idiomatisch wieder und bezieht die Erfahrung bis zu diesem Augenblick ein.
- source_word: ἐλάλησεν
  choice: hat … gesprochen
  rationale: Das deutsche Perfekt ist nach »noch nie« die natürliche Zeitform für eine Erfahrung bis zur Gegenwart; es bewahrt hier die Aussagekraft des griechischen Aorists.
- source_word: οὕτως
  choice: so
  rationale: Das Adverb bezeichnet die Art und Weise des Sprechens; »so« ist im Deutschen knapp und idiomatisch.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: »Ein Mensch« entspricht dem griechischen Singular und hat im Deutschen ohne geschlechtliche Verengung die hier gemeinte repräsentative Bedeutung.
theological_decisions:
- issue: Repräsentative Bedeutung von ἄνθρωπος
  choice: ein Mensch
  alternative: jemand
  rationale: Die Wiedergabe bewahrt das konkrete Substantiv und den Singular des griechischen Textes. Zugleich ist »Mensch« im Deutschen in diesem Satz natürlicherweise allgemein zu verstehen; »jemand« wäre möglich, würde die Ausdrucksform der Vorlage aber stärker verallgemeinern.
translation_notes:
  register: Kurzer, würdevoller und moderner Erzählsatz. »Gerichtsdiener« ist funktional präziser als das missverständliche allgemeine »Diener«; die direkte Rede bleibt bewusst knapp und nachdrücklich.
