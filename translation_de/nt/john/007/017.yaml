source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: de
  text: Wenn jemand Gottes Willen tun will, wird er erkennen, ob die Lehre von Gott stammt oder ob ich von mir selbst rede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von mir aus“ oder „aus eigener Vollmacht“. Wörtlich: „von mir selbst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Wenn jemand … will
  rationale: Die Verbindung ἐάν mit dem Konjunktiv formuliert eine allgemeine Bedingung. Die deutsche Wendung bewahrt sowohl den Bedingungscharakter als auch den Willensaspekt von θέλω.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: seinen Willen tun
  rationale: Das Pronomen bleibt wie im Griechischen erhalten; im Kontext bezieht es sich auf Gott. „Den Willen tun“ ist eine direkte, verständliche Wiedergabe der festen Verbindung mit ποιεῖν.
- source_word: γνώσεται περὶ τῆς διδαχῆς
  choice: wird er erkennen, ob die Lehre
  rationale: γνώσεται bezeichnet hier die daraus folgende Erkenntnis beziehungsweise Unterscheidungsfähigkeit. Im Deutschen lässt sich περί mit der anschließenden indirekten Frage natürlich durch „erkennen, ob“ wiedergeben.
- source_word: πότερον … ἢ
  choice: ob … oder ob
  rationale: Die Wiederholung von „ob“ stellt die beiden im Griechischen ausdrücklich gegenübergestellten Möglichkeiten klar heraus.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: von Gott stammt
  rationale: ἐκ bezeichnet Herkunft oder Ursprung. „Von Gott stammt“ gibt dies in natürlichem Deutsch wieder; das wörtlichere „von Gott ist“ wäre weniger idiomatisch.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: aus mir selbst heraus rede
  rationale: Die Formulierung bewahrt das Bild des Ursprungs der Rede und vermeidet es, die mögliche Bedeutung „aus eigener Vollmacht“ bereits im Haupttext festzulegen.
theological_decisions:
- issue: Bezug von αὐτοῦ in „seinen Willen“
  choice: Das Pronomen wird beibehalten und bezieht sich im Kontext auf Gott.
  alternative: „Gottes Willen“
  rationale: Der Zusammenhang macht den Bezug auf Gott deutlich. Die Beibehaltung des Pronomens folgt der griechischen Ausdrucksweise und vermeidet eine unnötige Explizierung.
- issue: Bedeutungsumfang von ἀπ’ ἐμαυτοῦ
  choice: „aus mir selbst heraus“ als Herkunftsangabe
  alternative: „von mir aus“ oder „aus eigener Vollmacht“
  rationale: Der griechische Ausdruck bezeichnet unmittelbar den Ursprung. Eine Aussage über eigenständige Vollmacht kann mitschwingen, sollte aber nicht ohne Kennzeichnung in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber idiomatisch formuliert. Der Fußnotenmarker steht unmittelbar nach der erklärungsbedürftigen Wendung.
