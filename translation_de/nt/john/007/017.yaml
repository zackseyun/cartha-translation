revisions:
- from: Wenn jemand seinen Willen tun will, wird er erkennen, ob die Lehre von Gott stammt oder ob ich aus mir selbst heraus rede.[a]
  to: Wenn jemand Gottes Willen tun will, wird er erkennen, ob die Lehre von Gott stammt oder ob ich von mir selbst rede.[a]
  rationale: Die Revision klärt den im Deutschen sonst missverständlichen Bezug des göttlichen Willens und gibt ἀπ’ ἐμαυτοῦ unmittelbar und idiomatisch wieder. Die Alternative „aus eigener Vollmacht“ bleibt als mögliche kontextuelle Nuance ausschließlich in der Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:51:33Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die beiden Alternativen von πότερον … ἢ sind zutreffend wiedergegeben. „Aus mir selbst heraus rede“ ist jedoch im Deutschen unnötig paraphrasierend; ἀπ’ ἐμαυτοῦ wird genauer und idiomatischer mit „von mir selbst“ wiedergegeben. Außerdem ist „seinen Willen“ im Deutschen ohne klaren Bezug leicht als der Wille des jeweiligen Menschen zu lesen, während αὐτοῦ im Kontext auf Gott verweist.
  naturalness: Der Satz ist insgesamt gut verständlich. „Wenn jemand seinen Willen tun will“ erzeugt allerdings eine vermeidbare und sinnverändernde Mehrdeutigkeit. „Wenn jemand Gottes Willen tun will“ ist modernes, natürliches Standarddeutsch. „Von mir selbst rede“ ist zudem natürlicher als „aus mir selbst heraus rede“.
  terminology: „Lehre“, „von Gott stammt“ und „rede“ passen zum Register und zur Aussage des Verses. Die Fußnote sollte die Haupttextform „von mir selbst“ korrekt als wörtliche Wiedergabe benennen; „von mir selbst her“ ist keine angemessene deutsche wörtliche Formulierung.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „seinen Willen“
    rationale: Deutsch legt bei „jemand seinen Willen“ nahe, dass jemand den eigenen Willen tun möchte. Im griechischen Kontext bezieht sich αὐτοῦ auf Gott. Die Explizierung als „Gottes Willen“ verhindert hier eine durch die Zielsprache entstandene Sinnverschiebung.
  - severity: low
    issue: „aus mir selbst heraus rede“ erweitert die Ausdrucksweise
    rationale: Die Wendung ist verständlich, aber stilistisch schwerfällig und weniger direkt als ἀπ’ ἐμαυτοῦ. „Von mir selbst rede“ bewahrt die Herkunftsangabe ohne zusätzliche Bildlichkeit.
  - severity: low
    issue: Fußnote bezeichnet „von mir selbst her“ als wörtlich
    rationale: Die sachgerechte knappe wörtliche Angabe lautet „von mir selbst“.
  revised_text: Wenn jemand Gottes Willen tun will, wird er erkennen, ob die Lehre von Gott stammt oder ob ich von mir selbst rede.[a]
  revised_footnotes:
