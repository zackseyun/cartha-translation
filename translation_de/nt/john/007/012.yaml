source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: de
  text: 'Unter den Menschenmengen wurde viel über ihn getuschelt[a]. Die einen sagten: »Er ist gut.« Andere dagegen sagten: »Nein, er führt die Menge in die Irre[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gemurrt« oder »leise geredet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »täuscht die Menge« oder »führt die Menge irre«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: getuschelt
  rationale: Das Verb gibt das gedämpfte, nicht offen geführte Reden natürlich wieder. Anders als »diskutiert« bewahrt es den inoffiziellen, leisen Charakter; anders als »gemurrt« legt es nicht ausschließlich Unmut fest.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet Jesus als Gegenstand des Tuschelns, ohne eine zusätzliche Wertung einzutragen.
- source_word: πολύς
  choice: viel
  rationale: »Viel« gibt die große Verbreitung beziehungsweise das erhebliche Ausmaß des Tuschelns knapp wieder.
- source_word: ἐν τοῖς ὄχλοις
  choice: unter den Menschenmengen
  rationale: Die Formulierung bewahrt den Plural von ὄχλοι und bezeichnet die verschiedenen beim Fest versammelten Gruppen.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Die einen ... Andere dagegen ...
  rationale: Diese natürliche deutsche Gegenüberstellung macht die gegensätzlichen Gruppen innerhalb der Menschenmengen deutlich.
- source_word: Ἀγαθός
  choice: gut
  rationale: Das prädikative Adjektiv wird ohne den im Griechischen nicht ausgedrückten Zusatz »Mann« wiedergegeben und lässt die Aussage in ihrer knappen Form stehen.
- source_word: Οὔ, ἀλλὰ
  choice: Nein,
  rationale: »Nein« leitet die entschiedene Zurückweisung ein; das bereits vorangestellte »dagegen« trägt den adversativen Kontrast von ἀλλά im natürlichen deutschen Satzbau mit.
- source_word: πλανᾷ
  choice: führt ... in die Irre
  rationale: Die Wendung wahrt die mögliche Bedeutung des Irreführens oder Irreleitens, ohne zwingend bewusste Täuschungsabsicht festzulegen.
- source_word: τὸν ὄχλον
  choice: die Menge
  rationale: Der Singular wird als kollektive Bezeichnung für die versammelten Menschen bewahrt und zugleich von dem vorherigen Plural unterschieden.
theological_decisions:
- issue: Gegensätzliche Beurteilungen Jesu durch die Menschenmenge
  choice: Beide Aussagen werden als direkte, gegensätzliche Urteile der jeweiligen Gruppen wiedergegeben.
  alternative: Eine der Aussagen durch erklärende Zusätze abschwächen oder als Erzählerurteil kennzeichnen.
  rationale: Der Vers berichtet unaufgelöst von positiven und negativen Urteilen über Jesus; der Erzähler bestätigt an dieser Stelle keines davon ausdrücklich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Getuschelt« ist alltagssprachlich zugänglich, ohne salopp zu wirken. Die direkte Rede bleibt knapp und bewahrt die Schärfe des Gegensatzes.
