  naturalness: Modernes, klares Standarddeutsch. Die Aufteilung in zwei Sätze ist gegenüber dem griechischen Semikolon stilistisch natürlich und bewahrt den Gedankengang. Die Wortstellung und die Wiederholung von „woher er kommt“ sind gut verständlich.
