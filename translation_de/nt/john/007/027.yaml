id: JHN.7.27
reference: John 7:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: de
  text: Aber von diesem Mann wissen wir, woher er kommt. Wenn jedoch der Messias kommt, weiß niemand, woher er kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Markiert den Gegensatz zum vorangehenden Gespräch direkt und natürlich.
- source_word: τοῦτον
  choice: von diesem Mann
  rationale: Der Demonstrativausdruck verweist konkret und leicht zugespitzt auf Jesus; im Deutschen ist „dieser Mann“ natürlicher als „dieser“ oder „dieser da“.
- source_word: οἴδαμεν
  choice: wissen wir
  rationale: Gibt das von den Sprechern beanspruchte Wissen schlicht und idiomatisch wieder.
- source_word: πόθεν ἐστίν
  choice: woher er kommt
  rationale: Bezeichnet Herkunft oder Ursprung. Die wiederholte Formulierung wird in beiden Satzteilen beibehalten.
- source_word: ὁ δὲ χριστός
  choice: Wenn jedoch der Messias
  rationale: Χριστός bezeichnet hier den erwarteten messianischen Titel; „Messias“ bewahrt den jüdischen Erwartungshorizont. „jedoch“ trägt den erneuten Kontrast durch δέ.
- source_word: ὅταν ἔρχηται
  choice: wenn ... kommt
  rationale: Die unbestimmte zukünftige Bedingung wird im Deutschen im Kontext einer erwarteten Gestalt natürlich mit „wenn“ ausgedrückt.
- source_word: οὐδεὶς γινώσκει
  choice: weiß niemand
  rationale: Klare, gegenwärtige Standardsprache für die umfassende Verneinung einer Kenntnis.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Χριστός fungiert hier als Titel der erwarteten Heilsgestalt und nicht als namensähnliche Bezeichnung; „Messias“ wahrt diesen Kontext.
- issue: Aussage der Menge über die Herkunft des Messias
  choice: Die Aussage ohne erklärende Ergänzung wiedergeben
  alternative: „Niemand weiß, woher der Messias kommen wird“ oder eine theologische Erläuterung einfügen
  rationale: Der Vers berichtet die Auffassung der Sprecher, ohne sie als Erzählerurteil zu bestätigen. Die Spannung beziehungsweise mögliche Fehlvorstellung bleibt erhalten.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Der Punkt statt eines Semikolons gliedert die doppelte Kontraststruktur im Deutschen natürlich, ohne den Gedankengang zu verändern. Keine Fußnote erforderlich.
