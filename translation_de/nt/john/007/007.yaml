id: JHN.7.7
reference: John 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: de
  text: Die Welt kann euch nicht hassen[a], mich aber hasst sie, weil ich von ihr bezeuge[b], dass ihre Werke böse sind[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist nicht imstande, euch zu hassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über sie Zeugnis ablege“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihre Taten böse sind“. „Die Welt“ bezeichnet bei Johannes häufig die menschliche Ordnung in ihrer Opposition zu Gott, nicht die geschaffene Welt als solche.'
    reason: lexical_alternative_and_context_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: kann … nicht
  rationale: Die natürliche deutsche Wiedergabe bewahrt ausdrücklich den Gedanken des Könnens beziehungsweise Nichtkönnens.
- source_word: ὁ κόσμος
  choice: die Welt
  rationale: Die übliche Wiedergabe erhält die für Johannes charakteristische Mehrdeutigkeit, ohne den Ausdruck im Haupttext interpretierend auf ein gottfeindliches Menschheitssystem einzuengen.
- source_word: μισεῖν / μισεῖ
  choice: hassen / hasst
  rationale: Die Wiederholung desselben Verbs und seine scharfe Aussage werden im Deutschen beibehalten.
- source_word: ἐμὲ δὲ
  choice: mich aber hasst sie
  rationale: Die Wortstellung hebt entsprechend dem griechischen Kontrastpronomen Jesus gegenüber den Angesprochenen hervor und bleibt zugleich natürlich verständlich.
- source_word: μαρτυρῶ
  choice: ich … bezeuge
  rationale: „Bezeugen“ gibt den Zeugnischarakter von μαρτυρέω prägnant wieder und passt zu seinem johanneischen Gebrauch.
- source_word: περὶ αὐτοῦ
  choice: über sie
  rationale: Das Pronomen wird auf die im Deutschen feminine „Welt“ bezogen; „über“ ist hier idiomatisch und wahrt den Gegenstandsbezug.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ihre Werke
  rationale: „Werke“ bleibt nahe am griechischen Ausdruck und bewahrt dessen moralisch-theologische Resonanz bei Johannes.
- source_word: πονηρά
  choice: böse
  rationale: Das Wort bezeichnet hier moralische Bosheit, nicht bloß schlechte Qualität; „böse“ ist die direkte und gewichtige Entsprechung.
theological_decisions:
- issue: Bedeutung und theologische Tragweite von „die Welt“ im Johannesevangelium
  choice: „die Welt“ ohne deutende Erweiterung im Haupttext
  alternative: „die gottfeindliche Menschheit“ oder „das Weltsystem“
  rationale: κόσμος hat bei Johannes eine vielschichtige Bedeutung. Hier erscheint die Welt als Jesus feindlich gesinnt, weil er ihre bösen Werke offenlegt; die Übersetzung erhält diese Spannung, ohne den Begriff enger auszulegen als der Text.
- issue: Art der Unfähigkeit der Welt, die Brüder zu hassen
  choice: Die Aussage „kann euch nicht hassen“ bleibt ohne erklärenden Zusatz stehen
  alternative: Eine moralische, psychologische oder situationsbedingte Unfähigkeit ausdrücklich benennen
  rationale: Der Vers erklärt nicht näher, in welchem Sinn die Welt sie nicht hassen kann. Eine Präzisierung würde die genuine Offenheit der Aussage auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kontrastive Stellung „mich aber“ bewahrt die Hervorhebung des griechischen Textes. „Werke“ wurde trotz des alltagssprachlich möglichen „Taten“ beibehalten, weil es verständlich ist und den johanneischen Sprachgebrauch erkennen lässt.
