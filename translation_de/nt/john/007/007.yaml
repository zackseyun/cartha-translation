  source_fidelity: Der Entwurf gibt die Satzstruktur, den Kontrast zwischen „euch“ und „mich“, die Wiederholung von μισέω sowie die moralische Bedeutung von πονηρά zuverlässig wieder. Für μαρτυρῶ περὶ αὐτοῦ ist jedoch „über sie bezeuge“ im modernen Deutschen nicht idiomatisch. „Von ihr bezeuge“ gibt den Gegenstandsbezug von περί wieder und ermöglicht den dass-Satz natürlich.
  naturalness: „Die Welt kann euch nicht hassen, mich aber hasst sie“ ist klares, würdevolles modernes Standarddeutsch. Die Umformulierung zu „weil ich von ihr bezeuge“ beseitigt die einzige merkliche syntaktische Unnatürlichkeit.
  terminology: „Welt“, „hassen“, „bezeuge“, „Werke“ und „böse“ sind sachgerecht und bewahren die johanneische Sprache sowie die theologische Offenheit von κόσμος. Die Kontextanmerkung zu „Welt“ ist zurückhaltend formuliert und legt den Ausdruck nicht im Haupttext fest.
