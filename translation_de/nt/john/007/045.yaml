  source_fidelity: Die Übersetzung gibt den narrativen Anschluss von οὖν mit „Daraufhin“ angemessen wieder. „Wachleute“ trifft ὑπηρέται im unmittelbaren Kontext als ausgesandte Amtspersonen, ohne die stärker interpretierende Bezeichnung „Tempelwache“ festzuschreiben. „führende Priester“ gibt ἀρχιερεῖς als kollektive priesterliche Führungsschicht verständlich wieder. Das demonstrative ἐκεῖνοι wird mit „Diese“ sichtbar bewahrt und verweist eindeutig auf die führenden Priester und Pharisäer. Die Frage entspricht dem griechischen Sinn; „hergebracht“ ist im Kontext der Rückkehr zu den Auftraggebern idiomatisch.
  naturalness: Modernes, flüssiges Standarddeutsch. Die Aufteilung in zwei Sätze ist natürlich und erhält die Sprecherzuordnung klar. Direkte Rede und Zeichensetzung sind idiomatisch.
  terminology: „Pharisäer“ ist die übliche deutsche Gruppenbezeichnung. „führende Priester“ ist eine sachgerechte, nicht irreführend wörtliche Wiedergabe von ἀρχιερεῖς. Es werden keine konfessionell geprägten Deutungen eingeführt.
