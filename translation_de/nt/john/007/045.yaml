id: JHN.7.45
reference: John 7:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: de
  text: 'Daraufhin kamen die Wachleute zu den führenden Priestern und den Pharisäern. Diese fragten sie: »Warum habt ihr ihn nicht hergebracht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Daraufhin
  rationale: Kennzeichnet die erzählerische Folge aus der vorausgehenden Szene, ohne eine stärker logische Schlussfolgerung auszudrücken.
- source_word: ὑπηρέται
  choice: Wachleute
  rationale: Gemeint sind die von den religiösen Autoritäten ausgesandten Amtspersonen, die Jesus festnehmen sollten. »Wachleute« gibt ihre Funktion natürlich wieder; »Diener« wäre im heutigen Deutsch zu unbestimmt, »Tempelwache« stärker ausdeutend.
- source_word: ἀρχιερεῖς
  choice: führende Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. Die Formulierung ist verständlich und vermeidet dieses mögliche Missverständnis.
- source_word: Φαρισαίους
  choice: Pharisäern
  rationale: Übliche deutsche Bezeichnung der jüdischen Gruppierung.
- source_word: ἐκεῖνοι
  choice: Diese
  rationale: Das ausdrückliche Demonstrativpronomen verweist auf die unmittelbar zuvor genannten führenden Priester und Pharisäer und macht eindeutig, dass sie die Frage stellen.
- source_word: Διὰ τί
  choice: Warum
  rationale: Natürliche und genaue deutsche Entsprechung der Frage nach dem Grund.
- source_word: ἠγάγετε
  choice: habt ihr … hergebracht
  rationale: Das Verb bedeutet grundsätzlich »führen« oder »bringen«. Im Kontext des Auftrags, Jesus festzunehmen und zu den Autoritäten zu bringen, ist »hergebracht« idiomatisch und bewahrt die Zielrichtung der Bewegung.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf Jesus und wird im Deutschen natürlich mit »ihn« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Sätze vermeiden eine schwerfällige Reihung und lassen das demonstrative ἐκεῖνοι mit »Diese« klar hervortreten. Die direkte Rede folgt der im Deutschen üblichen Zeichensetzung.
