  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: de
  text: Ihr werdet mich suchen und nicht finden; und wo ich bin, dorthin könnt ihr nicht kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: ihr werdet suchen
  rationale: Das Futur Aktiv in der zweiten Person Plural wird direkt wiedergegeben. „Suchen“ entspricht dem griechischen Verb und ist im modernen Deutschen natürlich.
- source_word: με
  choice: mich
  rationale: Das Akkusativpronomen bezeichnet Jesus als direktes Objekt.
- source_word: οὐχ εὑρήσετε
  choice: nicht finden
  rationale: Die einfache Verneinung des Futurs wird ohne zusätzliche Verstärkung wiedergegeben.
- source_word: ὅπου
  choice: wo
  rationale: Das lokale Adverb leitet eine Ortsangabe ein; „wo“ ist präzise und idiomatisch.
- source_word: εἰμὶ ἐγώ
  choice: ich bin
  rationale: Das ausdrücklich gesetzte ἐγώ steht im Kontrast zu ὑμεῖς. Die deutsche Satzstruktur bewahrt diesen Gegensatz, ohne ein nicht vorhandenes „dort“ in diese Teilaussage einzufügen.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: dorthin könnt ihr nicht kommen
  rationale: „Könnt … nicht“ gibt die in δύνασθε bezeichnete Unfähigkeit wieder, nicht ein Verbot. „Dorthin“ ist im Deutschen die natürliche Richtungsangabe zu „kommen“ und nimmt das vorausgehende „wo“ auf.
theological_decisions:
- issue: Art der Aussage „wo ich bin, dorthin könnt ihr nicht kommen“
  choice: Als Aussage der Unfähigkeit wiedergeben, ohne deren Grund näher zu bestimmen.
  alternative: „dorthin dürft ihr nicht kommen“ würde ein Verbot ausdrücken.
  rationale: δύνασθε bezeichnet Fähigkeit beziehungsweise Möglichkeit. Der Vers selbst legt nicht fest, ob die Unfähigkeit moralisch, geistlich, richterlich oder zeitlich bedingt ist; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede ist aufgrund der griechischen Pluralformen mit „ihr“ wiedergegeben. Das Semikolon macht die beiden eng verbundenen Zukunftsaussagen gut lesbar.
