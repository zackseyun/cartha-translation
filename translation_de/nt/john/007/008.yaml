  source_fidelity: 'Der Haupttext folgt dem SBLGNT genau: ὑμεῖς ἀνάβητε wird mit dem hervorgehobenen Imperativ „Geht ihr hinauf“ wiedergegeben, ἀναβαίνω bleibt durchgehend als „hinaufgehen“ erkennbar, und die Lesart οὐκ („nicht“) steht korrekt im Haupttext. „Meine Zeit ist noch nicht erfüllt“ gibt οὔπω πεπλήρωται einschließlich des noch ausstehenden Erfüllungsaspekts angemessen wieder, ohne es zu „gekommen“ zu glätten.'
