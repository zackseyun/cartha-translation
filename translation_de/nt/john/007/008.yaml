  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: de
  text: Geht ihr hinauf zum Fest. Ich gehe nicht zu diesem Fest hinauf[a], denn meine Zeit[b] ist noch nicht erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Ich gehe noch nicht zu diesem Fest hinauf.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „meine festgesetzte Zeit ist noch nicht erfüllt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς ἀνάβητε
  choice: Geht ihr hinauf
  rationale: Das ausdrücklich gesetzte ὑμεῖς wird durch „ihr“ wiedergegeben; „hinaufgehen“ bewahrt die räumliche und religiöse Bewegung nach Jerusalem.
- source_word: ἑορτή
  choice: Fest
  rationale: „Fest“ ist im Deutschen die natürliche Bezeichnung für das jüdische Wallfahrtsfest und wahrt den religiösen Zusammenhang.
- source_word: οὐκ ἀναβαίνω
  choice: Ich gehe nicht … hinauf
  rationale: Die Übersetzung folgt der SBLGNT-Lesart οὐκ („nicht“) und gibt das Präsens im unmittelbaren Handlungszusammenhang natürlich wieder, ohne das textkritisch abweichende „noch nicht“ in den Haupttext einzutragen.
- source_word: καιρός
  choice: Zeit
  rationale: „Zeit“ ist knapp und natürlich und lässt offen, ob vor allem der passende oder der festgesetzte Zeitpunkt gemeint ist.
- source_word: οὔπω πεπλήρωται
  choice: ist noch nicht erfüllt
  rationale: Die Formulierung bewahrt sowohl das „noch nicht“ als auch den Vollendungs- bzw. Erfüllungsaspekt des Perfekt Passiv von πληρόω.
theological_decisions:
- issue: Textvariante in Jesu Aussage über das Hinaufgehen zum Fest
  choice: 'Im Haupttext steht gemäß SBLGNT οὐκ: „Ich gehe nicht zu diesem Fest hinauf.“'
  alternative: 'Die Lesart οὔπω ergibt: „Ich gehe noch nicht zu diesem Fest hinauf.“'
  rationale: Die bedeutende Variante wird nicht zur Auflösung der Spannung mit Jesu späterem Handeln in den Haupttext übernommen, sondern transparent in einer Fußnote genannt.
- issue: Bedeutung von καιρός
  choice: „meine Zeit“
  alternative: „meine festgesetzte Zeit“
  rationale: Der Haupttext wahrt die Kürze und semantische Offenheit des griechischen Ausdrucks; die mögliche Bedeutung eines bestimmten, vorgesehenen Zeitpunktes wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „hinauf“ entspricht dem griechischen Text und hält den Bezug des Festbesuchs auf Jerusalem erkennbar. Die leicht markierte Wendung „Zeit … erfüllt“ bewahrt die Bild- und Bedeutungsstruktur des Originals.
