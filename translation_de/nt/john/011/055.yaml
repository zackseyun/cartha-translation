  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: de
  text: Das Passafest der Juden[a] stand nahe bevor, und viele zogen vor dem Fest vom Land hinauf nach Jerusalem, um sich zu reinigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das jüdische Passafest“. Wörtlicher lautet das Griechische „das Passafest der Juden“, eine im Johannesevangelium wiederkehrende Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die rituelle Reinigung als Vorbereitung auf das Passafest.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: stand nahe bevor
  rationale: Die idiomatische deutsche Wendung gibt den zeitlichen Sinn von ἐγγύς klar wieder. Das schwache Bindewort δέ muss hier nicht eigens ausgedrückt werden, da der Zusammenhang den Erzählfluss trägt.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: das Passafest der Juden
  rationale: Die Genitivverbindung wird transparent bewahrt; „Passafest“ ist im modernen Deutschen verständlich und bezeichnet eindeutig das jüdische Fest.
- source_word: ἀνέβησαν
  choice: zogen … hinauf
  rationale: „Hinaufziehen“ bewahrt die geographische und traditionelle Vorstellung der Pilgerreise nach Jerusalem.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv lässt sich im Deutschen natürlich ohne ergänzendes Substantiv wiedergeben.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: „Nach“ ist bei Städten die natürliche deutsche Wiedergabe der gerichteten Bewegung.
- source_word: ἐκ τῆς χώρας
  choice: vom Land
  rationale: Die Formulierung bezeichnet das Gebiet außerhalb der Stadt beziehungsweise die ländlichen Gegenden, ohne den Umfang genauer festzulegen.
- source_word: πρὸ τοῦ πάσχα
  choice: schon vor dem Fest
  rationale: „Vor“ gibt die zeitliche Bedeutung direkt wieder; „schon“ macht natürlich deutlich, dass die Anreise der Vorbereitung diente. Die verkürzte Wiederaufnahme „dem Fest“ vermeidet eine schwerfällige Wiederholung, ohne den Bezug zu verwischen.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: um sich zu reinigen
  rationale: Der finale Infinitiv gibt den Zweck der Reise präzise wieder. „Reinigen“ bewahrt den rituellen Sinn, ohne ihn im Haupttext auszudeuten.
theological_decisions:
- issue: Art der Reinigung vor dem Passafest
  choice: „um sich zu reinigen“ mit kulturgeschichtlicher Fußnote
  alternative: „um sich rituell zu reinigen“ oder „um sich zu heiligen“
  rationale: Im Zusammenhang geht es um jüdische rituelle Vorbereitung auf das Passafest. Der Haupttext bleibt nah an der Ausdrucksweise des Griechischen und legt weder eine spätere sakramentale Bedeutung noch ausschließlich eine innere moralische Reinigung nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stand nahe bevor“ und „zogen … hinauf“ sind gut verständlich und bewahren zugleich die zeitliche Nähe sowie die traditionelle Bewegung nach Jerusalem. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Wendung.
