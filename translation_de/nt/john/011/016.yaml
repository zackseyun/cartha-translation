source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: de
  text: 'Da sagte Thomas, genannt Didymus,[a] zu seinen Mitjüngern: »Lasst uns auch gehen, damit wir mit ihm sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didymus ist das griechische Wort für »Zwilling«.
    reason: Erläuterung des bedeutungstragenden griechischen Beinamens.
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die erzählerische und folgernde Fortsetzung; „Da“ ist in modernem Deutsch natürlich, ohne den Zusammenhang stärker als ausdrücklich kausal festzulegen.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Der Personenname wird gemäß der etablierten deutschen Form wiedergegeben.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: der Didymus, das heißt »Zwilling«, genannt wurde
  rationale: „Didymus“ gibt den griechischen Beinamen wieder; seine Bedeutung wird unmittelbar verständlich gemacht. So bleiben sowohl die Namensform des Ausgangstextes als auch ihr Sinn erhalten.
- source_word: τοῖς συμμαθηταῖς
  choice: zu den anderen Jüngern
  rationale: Das seltene Wort bezeichnet Mitjünger. „Die anderen Jünger“ ist im Deutschen idiomatisch und macht ihre gemeinsame Zugehörigkeit zur Jüngergruppe deutlich.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: Lasst uns auch hingehen
  rationale: Der hortative Konjunktiv wird als Aufforderung wiedergegeben; „auch“ bewahrt die ausdrückliche Einbeziehung von Thomas und seinen Mitjüngern.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: damit wir mit ihm sterben
  rationale: „Damit“ erhält die Ziel- beziehungsweise Folgebeziehung, ohne Thomas’ genaue innere Haltung festzulegen; „mit ihm“ wahrt die schlichte Begleitvorstellung.
theological_decisions:
- issue: Ton und Absicht der Aussage des Thomas
  choice: Die Aussage wird ohne deutende Zusätze als direkte Aufforderung wiedergegeben.
  alternative: Sie ausdrücklich als mutige Loyalität, fatalistische Resignation oder ironischen Pessimismus kennzeichnen.
  rationale: Der griechische Wortlaut legt Thomas’ Ton nicht eindeutig fest. Die Übersetzung bewahrt diese psychologische und theologische Spannung.
- issue: Bezug von „mit ihm“
  choice: Das Pronomen bleibt stehen und verweist im Kontext auf Jesus.
  alternative: „mit Jesus“ ausdrücklich einsetzen.
  rationale: Der Ausgangstext verwendet ein Pronomen; der Bezug ist aus dem Kontext klar, sodass keine Explizierung nötig ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist knapp und ernst gehalten. Der Fußnotenmarker steht unmittelbar nach der erklärenden Namensform; die Übersetzung vermeidet jede Festlegung auf Mut, Resignation oder Ironie.
