  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: de
  text: Einige von ihnen aber gingen zu den Pharisäern und berichteten ihnen, was Jesus getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sagten ihnen, was Jesus getan hatte“. Der griechische Text nennt nicht ausdrücklich das Motiv derer, die zu den Pharisäern gingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Einige von ihnen aber
  rationale: Gibt die unbestimmte Teilgruppe und den kontextuellen Gegensatz knapp und quellennah wieder.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: gingen zu den Pharisäern
  rationale: Bezeichnet die Bewegung vom Schauplatz zu den Pharisäern; „gingen“ ist im Deutschen natürlich, ohne die Abgangskomponente unnötig zu betonen.
- source_word: εἶπαν αὐτοῖς
  choice: berichteten ihnen
  rationale: Im Zusammenhang wird den Pharisäern mitgeteilt, was Jesus getan hatte. „Berichteten“ ist natürlich und legt weder eine feindselige noch eine wohlwollende Absicht fest.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: was Jesus getan hatte
  rationale: „Was“ gibt das neutrale Pluralrelativ idiomatisch wieder; das Plusquamperfekt verdeutlicht, dass Jesu Handeln dem Bericht vorausging.
theological_decisions:
- issue: Motiv derjenigen, die zu den Pharisäern gingen
  choice: Neutrale Mitteilung ohne ausdrückliche Motivzuschreibung
  alternative: „Jesus bei ihnen anzeigen“ oder „ihnen von Jesus erzählen“
  rationale: Der griechische Text nennt lediglich Gang und Bericht. Ob die Personen feindselig, besorgt oder aus einem anderen Grund handelten, wird in diesem Vers nicht ausdrücklich gesagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Stellung „Einige von ihnen aber“ bewahrt den Gegensatz zum Glauben anderer aus dem vorherigen Vers, ohne unnatürlich zu wirken.
