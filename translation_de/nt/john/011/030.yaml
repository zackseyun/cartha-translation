  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: de
  text: Jesus war noch nicht in das Dorf gekommen, sondern befand sich noch an dem Ort, wo Marta ihm begegnet war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: „wo Marta ihm entgegengegangen war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: noch nicht
  rationale: Die natürliche deutsche Entsprechung bezeichnet, dass das Ereignis bis zu diesem Zeitpunkt noch nicht eingetreten war.
- source_word: δὲ
  choice: unmarkiert
  rationale: Die Partikel kennzeichnet hier einen leichten narrativen Übergang; ein ausdrücklich vorangestelltes „nun“ oder „aber“ wäre im Deutschen unnötig und könnte den Kontrast überzeichnen.
- source_word: ἐληλύθει
  choice: war … gekommen
  rationale: Das Plusquamperfekt gibt die gegenüber der Erzählgegenwart vorzeitige Lage wieder.
- source_word: κώμην
  choice: Dorf
  rationale: κώμη bezeichnet gewöhnlich eine kleinere Ortschaft; „Dorf“ ist präzise und idiomatisch.
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der verneinten ersten Aussage stellt ἀλλά den tatsächlichen Aufenthaltsort Jesu gegenüber; „sondern“ bildet diese deutsche Kontraststruktur natürlich ab.
- source_word: ἔτι
  choice: noch
  rationale: Das Wort hebt das Fortdauern seines Aufenthalts an demselben Ort hervor.
- source_word: τόπῳ
  choice: Ort
  rationale: Eine schlichte, genaue Wiedergabe des allgemeinen Ortsbegriffs.
- source_word: ὅπου
  choice: wo
  rationale: Direkte und natürliche Einleitung des örtlichen Relativsatzes.
- source_word: ὑπήντησεν
  choice: begegnet war
  rationale: ὑπαντάω kann sowohl das Begegnen als auch das Entgegengehen zum Treffen ausdrücken. „Begegnet war“ ist im Haupttext knapp und bewahrt die Grundbedeutung; die ausdrücklichere Nuance steht in der Fußnote.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ wird bei „begegnen“ im Deutschen unmittelbar als Dativobjekt wiedergegeben.
- source_word: Μάρθα
  choice: Marta
  rationale: Gebräuchliche moderne deutsche Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Befand sich“ vermeidet die im Deutschen missverständliche Formulierung „war noch an dem Ort“ und gibt den fortdauernden Aufenthalt klar wieder. Der Fußnotenmarker steht unmittelbar nach dem Satzteil, auf den sich die alternative Wiedergabe bezieht.
