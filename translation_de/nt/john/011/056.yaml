id: JHN.11.56
reference: John 11:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: de
  text: 'So suchten sie nach Jesus und sagten zueinander, während sie im Tempelbezirk[a] standen: »Was meint ihr? Wird er etwa auf keinen Fall zum Fest kommen?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet die gesamte Tempelanlage beziehungsweise den Tempelbezirk, nicht speziell das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Er wird gewiss nicht zum Fest kommen?« Im Griechischen steht eine nachdrückliche Verneinung (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: suchten sie nach
  rationale: Das Imperfekt bezeichnet eine andauernde oder wiederholte Suche; »nach Jesus suchen« ist im modernen Deutsch natürlich.
- source_word: οὖν
  choice: Darum
  rationale: Die Partikel stellt einen folgernden Zusammenhang mit dem vorausgehenden Kontext her.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: fragten sie einander
  rationale: Wörtlich steht »sagten sie zueinander«; da die folgende Äußerung eine Frage ist, gibt »fragten sie einander« die kommunikative Funktion natürlich wieder.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage und nicht ausschließlich das innere Heiligtum.
- source_word: ἑστηκότες
  choice: Während sie … standen
  rationale: Das Perfektpartizip beschreibt ihren bestehenden Aufenthaltszustand; die temporale Formulierung ist im Deutschen flüssig.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Was meint ihr?
  rationale: Eine natürliche deutsche Frage nach der Einschätzung der Gesprächspartner.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: Er wird doch bestimmt nicht … kommen?
  rationale: Die Formulierung bewahrt den fragenden Zusammenhang und gibt die nachdrückliche Verneinung οὐ μή idiomatisch wieder, ohne die syntaktische Mehrdeutigkeit unnötig aufzulösen.
- source_word: εἰς τὴν ἑορτήν
  choice: zum Fest
  rationale: Im Kontext ist das Passafest gemeint; »Fest« ist knapp, verständlich und entspricht dem johanneischen Sprachgebrauch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Imperfektformen werden als fortlaufende Szene wiedergegeben; die starke Verneinung bleibt hörbar, während der etwas spannungsreiche griechische Fragebau in natürlichem Deutsch erhalten wird.
