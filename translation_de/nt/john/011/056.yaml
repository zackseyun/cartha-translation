revisions:
- from: 'Darum suchten sie nach Jesus. Während sie im Tempelbezirk[a] standen, fragten sie einander: »Was meint ihr? Er wird doch bestimmt nicht zum Fest kommen?«[b]'
  to: 'So suchten sie nach Jesus und sagten zueinander, während sie im Tempelbezirk[a] standen: »Was meint ihr? Wird er etwa auf keinen Fall zum Fest kommen?«[b]'
  rationale: Die Revision wahrt die Syntax und den fortlaufenden Charakter der beiden Imperfekte besser, indem sie Suche und Rede mit »und« verbindet und ἔλεγον nicht zu »fragten« umdeutet. Die starke Verneinung οὐ μή bleibt mit »auf keinen Fall« klar erkennbar. Ortsterminologie und Anmerkungsanker bleiben erhalten.
