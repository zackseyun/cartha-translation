id: JHN.11.52
reference: John 11:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: de
  text: und nicht nur für das Volk[a], sondern auch, um die verstreuten Kinder Gottes zu einem zusammenzuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Volk“ ist hier das jüdische Volk gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: Volk
  rationale: Im unmittelbaren Zusammenhang bezeichnet der Singular das jüdische Volk. „Volk“ ist im Deutschen natürlicher als „Nation“ und bewahrt den korporativen Sinn.
- source_word: ἵνα
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt die finale Bedeutung der Konjunktion natürlich und klar wieder.
- source_word: τέκνα τοῦ θεοῦ
  choice: Kinder Gottes
  rationale: τέκνα ist geschlechtsübergreifend und wird mit der etablierten, genauen Wendung „Kinder Gottes“ wiedergegeben.
- source_word: τὰ διεσκορπισμένα
  choice: die verstreuten
  rationale: Das Partizip Perfekt Passiv beschreibt einen fortbestehenden Zustand der Zerstreuung; „verstreut“ bewahrt diesen Sinn knapp und idiomatisch.
- source_word: συναγάγῃ
  choice: zusammenzuführen
  rationale: Das Verb bezeichnet das Sammeln beziehungsweise Zusammenbringen. „Zusammenführen“ vermeidet in Verbindung mit εἰς ἕν eine schwerfällige Wiederholung.
- source_word: εἰς ἕν
  choice: zu einem Ganzen
  rationale: Die Formulierung wahrt die knappe, nicht näher bestimmte Einheit des Griechischen, ohne „Leib“ oder eine bestimmte institutionelle Gestalt einzutragen.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: und nicht nur für das Volk, sondern auch
  rationale: Die Wendung setzt die Aussage des vorigen Verses über Jesu stellvertretenden Tod fort. „Für“ gibt ὑπέρ im Zusammenhang angemessen wieder und erhält die Kontraststruktur.
theological_decisions:
- issue: Identität der „Kinder Gottes“
  choice: Die Bezeichnung bleibt bewusst offen und umfasst Gottes über das jüdische Volk hinaus verstreute Kinder, die durch Jesu Tod geeint werden.
  alternative: Nur Juden in der Diaspora; oder ausdrücklich die Erwählten aus Juden und Nichtjuden.
  rationale: Der Vers stellt „das Volk“ einer weiter gefassten Gruppe verstreuter Kinder Gottes gegenüber, bestimmt deren genaue Zusammensetzung jedoch nicht. Die Übersetzung löst diese Spannung nicht konfessionell auf.
- issue: Art der Einheit in εἰς ἕν
  choice: „zu einem Ganzen“ ohne nähere Bestimmung
  alternative: „zu einem Leib“, „in die Einheit“ oder „als eins“
  rationale: Das Griechische nennt weder einen „Leib“ noch eine bestimmte organisatorische Form. Die offene Formulierung wahrt die theologische Breite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax schließt unmittelbar an Vers 51 an. „Zu einem Ganzen“ ist verständlich, bewahrt aber die Unbestimmtheit von εἰς ἕν; die Fußnote dokumentiert die wörtlichere Form.
