  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: de
  text: 'Da ließen die Schwestern ihm ausrichten: „Herr, sieh, der, den du liebst, ist krank.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: ließen ... ihm ausrichten
  rationale: Gibt die idiomatische Bedeutung des Sendens einer Nachricht im modernen Deutschen natürlich wieder, ohne einen nicht genannten Boten hinzuzufügen.
- source_word: οὖν
  choice: Da
  rationale: Markiert den folgernden Anschluss an die zuvor geschilderte Krankheit und Situation.
- source_word: ἴδε
  choice: sieh
  rationale: Bewahrt den auffordernden Aufmerksamkeitsruf des griechischen Imperativs in knapper, würdiger Form.
- source_word: ὃν φιλεῖς
  choice: der, den du liebst
  rationale: Gibt die persönliche Zuneigung von φιλέω natürlich wieder; eine künstliche Abgrenzung gegenüber ἀγαπάω wird vermieden.
- source_word: ἀσθενεῖ
  choice: ist krank
  rationale: Entspricht im Kontext eindeutig dem gesundheitlichen Zustand des Lazarus.
theological_decisions:
- issue: Art der Liebe in φιλεῖς
  choice: liebst
  alternative: lieb hast
  rationale: Beide sind möglich; „liebst“ ist im modernen Standarddeutsch natürlicher und vermeidet die unbegründete Annahme, φιλέω bezeichne hier eine theologisch grundsätzlich andere Art von Liebe.
- issue: Funktion von ἴδε
  choice: sieh
  alternative: doch / siehe
  rationale: „Sieh“ bewahrt den ausdrücklich formulierten Aufmerksamkeitsruf. „Siehe“ wirkt heute stärker altertümlich, während ein bloßes „doch“ das Bild des Sehens aufgibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die indirekte Mitteilung wird idiomatisch mit „jemandem etwas ausrichten lassen“ wiedergegeben; die direkte Rede bleibt knapp und eindringlich.
