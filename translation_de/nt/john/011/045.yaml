source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: de
  text: Darum glaubten viele der Juden[a], die zu Maria gekommen waren und gesehen hatten, was er getan hatte, an ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. In manchen johanneischen Zusammenhängen kann Ἰουδαῖοι auch regional auf Menschen aus Judäa bezogen sein.'
    reason: Die Anmerkung erhält die lexikalische Alternative zu Ἰουδαῖοι offen, ohne die direkte Wiedergabe von ἐπίστευσαν εἰς αὐτόν im Haupttext zu relativieren.
lexical_decisions:
- source_word: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων
  choice: Darum kamen viele von den Juden … zum Glauben
  rationale: οὖν stellt den Zusammenhang mit der vorausgehenden Auferweckung des Lazarus her. ἐκ τῶν Ἰουδαίων ist partitiv; „viele von den Juden“ gibt dies natürlich und präzise wieder.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: die zu Maria gekommen waren
  rationale: Das substantivierte Partizip bestimmt die betreffende Gruppe näher. Das Plusquamperfekt bildet die zeitliche Vorordnung gegenüber dem Hauptverb idiomatisch ab.
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: gesehen hatten, was er getan hatte
  rationale: θεάομαι bezeichnet hier das wahrnehmende Anschauen des Geschehens; „gesehen“ ist im Deutschen natürlich. Die Vorzeitigkeit beider Handlungen wird kontextgerecht wiedergegeben.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: kamen zum Glauben an ihn
  rationale: Die Wendung gibt den Eintritt in den Glauben an Jesus natürlich wieder und bewahrt die personale Ausrichtung von πιστεύω εἰς.
theological_decisions:
- issue: Wiedergabe von πιστεύω εἰς αὐτόν im johanneischen Kontext
  choice: kamen zum Glauben an ihn
  alternative: glaubten an ihn
  rationale: Beide Wiedergaben sind sachlich möglich. „Kamen zum Glauben an ihn“ macht im Deutschen deutlich, dass das Gesehene zu einer neuen Reaktion führte, ohne den Inhalt oder die Tiefe dieses Glaubens über den griechischen Text hinaus festzulegen.
- issue: Bedeutungsumfang von Ἰουδαῖοι
  choice: Juden
  alternative: Judäer
  rationale: „Juden“ ist hier die natürliche Bezeichnung für die im Erzählzusammenhang genannte Gruppe. Da Ἰουδαῖοι in Johannes je nach Kontext auch regional als „Judäer“ verstanden werden kann, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem Griechischen, bleibt aber idiomatisch; die partitive Formulierung und die zeitlichen Verhältnisse der Partizipien bleiben erhalten.
