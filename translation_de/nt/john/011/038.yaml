  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: de
  text: Jesus war also erneut in seinem Innersten tief aufgewühlt[a] und ging zum Grab. Es war eine Höhle, und ein Stein lag davor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinem Innersten empört« oder »in seinem Innersten zutiefst erschüttert«. Das griechische Verb ist ungewöhnlich stark und kann mehr als Trauer allein ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die erzählerische Folgerung beziehungsweise Weiterführung aus der vorausgehenden Szene, ohne im Deutschen eine zu strenge logische Schlussfolgerung anzudeuten.
- source_word: πάλιν
  choice: erneut
  rationale: Verweist unmittelbar auf Jesu vorherige heftige innere Reaktion und klingt in moderner deutscher Erzählprosa natürlich.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: in seinem Innersten tief aufgewühlt
  rationale: Bewahrt die ungewöhnliche emotionale Stärke des Verbs und die nach innen gerichtete Reaktion, ohne die Empfindung eindeutig auf Trauer oder Empörung festzulegen.
- source_word: ἔρχεται
  choice: ging
  rationale: Das historische Präsens wird in natürlicher deutscher Erzählweise als Vergangenheit wiedergegeben; im Zusammenhang bezeichnet das Verb die Bewegung zum Grab.
- source_word: μνημεῖον
  choice: Grab
  rationale: Bezeichnet hier eine Grabstätte; die folgende Beschreibung als Höhle verdeutlicht deren konkrete Gestalt.
- source_word: σπήλαιον
  choice: Höhle
  rationale: Direkte und allgemein verständliche Entsprechung des griechischen Substantivs.
- source_word: λίθος
  choice: Stein
  rationale: Übliche und sachlich passende Wiedergabe für den Verschlussstein des Grabes.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: lag davor
  rationale: Gibt bei einem Höhlengrab idiomatisch wieder, dass der Stein am Eingang angebracht war, und vermeidet die missverständliche Vorstellung, er habe oben auf der Höhle gelegen.
theological_decisions:
- issue: Emotionale Bedeutung von ἐμβριμώμενος bei Jesus
  choice: Jesu heftige innere Bewegung bleibt im Haupttext hinsichtlich ihrer genauen emotionalen Färbung offen.
  alternative: Jesus war in seinem Innersten empört beziehungsweise zutiefst erschüttert.
  rationale: Das starke Verb kann Empörung oder heftige Erregung ausdrücken, doch der unmittelbare Kontext legt die genaue Mischung der Gefühle nicht eindeutig fest. Die Übersetzung bewahrt deshalb die Intensität und nennt die engeren Deutungen in der Fußnote.
translation_notes:
  register: Moderne, würdige Standardsprache. »In seinem Innersten tief aufgewühlt« wahrt Intensität und Mehrdeutigkeit; »lag davor« beschreibt den Verschluss eines Höhlengrabs natürlich und anschaulich.
