  source_fidelity: 'Der Text gibt die griechische Aussage zuverlässig wieder: ἐκείνη bezieht sich auf Maria und ist idiomatisch mit „sie“ aufgenommen; ὡς ἤκουσεν wird treffend temporal mit „Als sie das hörte“ wiedergegeben. „Stand sie schnell auf“ entspricht dem intransitiven Gebrauch von ἠγέρθη mit ταχύ, und „ging zu ihm“ gibt die Bewegung zu Jesus hin sachgerecht wieder. Der Imperfekt von ἤρχετο ist im deutschen Erzählstil mit dem Präteritum natürlich wiedergegeben, ohne eine unzulässige zusätzliche Aussage einzutragen.'
