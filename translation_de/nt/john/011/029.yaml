  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: de
  text: Als sie das hörte, stand sie schnell auf und ging zu ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: sie
  rationale: Das Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf Maria. Im natürlichen Deutschen genügt das Personalpronomen „sie“.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ führt die Erzählung hier nur leicht weiter. Ein ausdrückliches „aber“ würde einen zu starken Gegensatz setzen; der Anschluss ist im Deutschen auch ohne Konjunktion klar.
- source_word: ὡς ἤκουσεν
  choice: als sie das hörte
  rationale: ὡς bezeichnet hier den Zeitpunkt der folgenden Handlung. „Als“ gibt dies natürlich wieder; das ergänzte „das“ verweist auf die soeben übermittelte Nachricht.
- source_word: ἠγέρθη
  choice: stand ... auf
  rationale: Die formal passive Form wird hier intransitiv gebraucht und bedeutet, dass Maria aufstand; „wurde aufgerichtet“ würde fälschlich einen äußeren Handelnden nahelegen.
- source_word: ταχὺ
  choice: schnell
  rationale: Das Adverb bezeichnet die zügige, unverzügliche Reaktion, ohne so stark wie „sofort“ zu formulieren.
- source_word: ἤρχετο
  choice: ging
  rationale: Der Imperfekt schildert die Bewegung als im Verlauf befindlich. Im deutschen Erzählstil gibt „ging“ die Handlung natürlich wieder, während „war auf dem Weg“ stärker ausdeuten würde.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf Jesus zu; „zu ihm“ ist die natürliche deutsche Wiedergabe.
