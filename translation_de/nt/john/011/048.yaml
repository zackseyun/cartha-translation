id: JHN.11.48
reference: John 11:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: de
  text: Wenn wir ihn so weitermachen lassen, werden alle an ihn glauben, und die Römer werden kommen und uns sowohl unseren Ort[a] als auch unser Volk[b] wegnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „unserem Ort“ kann besonders der Tempel gemeint sein, möglicherweise aber auch unser Platz oder unsere Stellung.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „unsere Nation“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: ihn so weitermachen lassen
  rationale: ἀφίημι hat hier permissiven Sinn („lassen, gewähren lassen“); zusammen mit οὕτως bezeichnet die Wendung, dass Jesu gegenwärtiges Wirken ungehindert weitergeht. Die Formulierung ist im modernen Deutsch natürlich, ohne den Kontext unnötig auszudeuten.
- source_word: πάντες
  choice: alle
  rationale: Das substantivisch gebrauchte Maskulinum Plural ist allgemein und umfassend gemeint; „alle“ gibt diese Reichweite knapp und idiomatisch wieder.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: werden an ihn glauben
  rationale: Die für Johannes typische Verbindung πιστεύω εἰς mit Akkusativ wird im Deutschen sachgerecht und geläufig mit „an jemanden glauben“ wiedergegeben.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: die Römer werden kommen
  rationale: Dies entspricht unmittelbar dem Futur von ἔρχομαι und dem ausdrücklich genannten Subjekt.
- source_word: ἀροῦσιν
  choice: wegnehmen
  rationale: αἴρω bedeutet hier „wegnehmen, beseitigen“. „Zerstören“ wäre stärker und würde eine im Zusammenhang mögliche Folge bereits in die lexikalische Bedeutung eintragen.
- source_word: τόπον
  choice: Ort
  rationale: „Ort“ wahrt die Offenheit von τόπος. Gemeint sein kann insbesondere der Tempel, möglicherweise aber auch der eigene Platz beziehungsweise die gesellschaftlich-politische Stellung der führenden Kreise.
- source_word: ἔθνος
  choice: Volk
  rationale: ἔθνος bezeichnet hier das jüdische Volk als geschichtlich-politische Gemeinschaft. „Volk“ ist im Deutschen natürlicher als „Nation“, während „Nation“ als mögliche Alternative in der Fußnote erhalten bleibt.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: uns sowohl unseren Ort als auch unser Volk
  rationale: Das vorangestellte ἡμῶν bezieht sich auf beide Objekte. Das zusätzliche dativische „uns“ gibt im Deutschen natürlich wieder, dass beides den Sprechern weggenommen würde; „sowohl ... als auch“ bildet die doppelte καί-Verknüpfung ab.
theological_decisions:
- issue: Bezug von τόπον („unseren Ort“)
  choice: Im Haupttext bleibt die allgemeine Wiedergabe „Ort“ stehen.
  alternative: Tempel; Platz beziehungsweise Stellung
  rationale: Der Tempel dürfte im Blick sein, doch τόπος legt den Bezug nicht eindeutig darauf fest. Die offenere Wiedergabe bewahrt die mögliche institutionelle und politische Dimension.
- issue: Bedeutungsumfang von ἔθνος
  choice: Volk
  alternative: Nation
  rationale: Die Sorge gilt dem Fortbestand des jüdischen Gemeinwesens beziehungsweise Volkes. „Volk“ wahrt den ethnisch-kollektiven Sinn, ohne einen modernen Nationalstaat vorauszusetzen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der erste griechische Satz wird zur besseren deutschen Lesbarkeit in zwei Hauptsätze gegliedert; „Dann“ gibt den folgernden Anschluss von καί im Zusammenhang wieder. Die mehrdeutigen Begriffe τόπος und ἔθνος werden im Haupttext nicht konfessionell oder politisch verengt.
