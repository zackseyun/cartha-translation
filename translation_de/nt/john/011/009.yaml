source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: de
  text: 'Jesus antwortete: „Hat der Tag nicht zwölf Stunden?[a] Wenn jemand[b] tagsüber geht, stolpert er nicht, weil er das Licht dieser Welt[c] sieht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Sind es nicht zwölf Stunden des Tages?“'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht der repräsentative Singular: „jemand … er“.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „das Licht dieser Welt“ kann im Johannesevangelium über das unmittelbare Bild hinaus an göttliche Erleuchtung erinnern; der Haupttext lässt diese mögliche Bedeutung offen.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche und natürliche deutsche Erzählverb für eine Erwiderung; es fügt dem griechischen Verb keine zusätzliche Nuance hinzu.
- source_word: Οὐχὶ
  choice: Hat ... nicht
  rationale: Die verneinte Frage erwartet Zustimmung. Die deutsche Form bewahrt diesen rhetorischen Charakter.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: Hat der Tag nicht zwölf Stunden?
  rationale: Die idiomatische deutsche Form gibt die zwölf Stunden des lichten Tages wieder und erhält zugleich die rhetorische Frage.
- source_word: ἐάν τις περιπατῇ
  choice: Wenn jemand ... umhergeht
  rationale: „Jemand“ bewahrt den unbestimmten repräsentativen Singular; „umhergeht“ gibt περιπατῇ anschaulich wieder, ohne die mögliche bildliche Bedeutung auszuschließen.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: am Tag
  rationale: Natürliches modernes Deutsch, das den Gegensatz von Tag und Nacht sowie die Wiederaufnahme von ἡμέρα wahrt.
- source_word: προσκόπτει
  choice: stößt ... nicht an
  rationale: Die Wendung bewahrt das konkrete Bild eines Hindernisses und lässt zugleich eine übertragene Bedeutung offen.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Die lexikalische Grundbedeutung bleibt erhalten; zugleich wird die für das Johannesevangelium typische weitergehende Resonanz nicht verdeckt.
- source_word: τοῦ κόσμου τούτου
  choice: dieser Welt
  rationale: Direkte und natürliche Wiedergabe des Genitivs mit demonstrativer Bestimmung.
- source_word: βλέπει
  choice: sieht
  rationale: Entspricht unmittelbar dem Präsens Indikativ; ein ergänztes „sehen kann“ wäre bereits stärker auslegend.
theological_decisions:
- issue: Mögliche symbolische Bedeutung des Lichtes im Johannesevangelium
  choice: Das gewöhnliche Bild bleibt im Haupttext unverändert stehen.
  alternative: „Das Licht dieser Welt“ ausdrücklich auf Jesus oder göttliche Führung beziehen.
  rationale: Der unmittelbare Wortlaut ist als anschauliche Aussage verständlich, kann im johanneischen Zusammenhang aber zugleich theologisch mitschwingen. Die Übersetzung legt diese Mehrdeutigkeit nicht einseitig fest.
- issue: Unbestimmter repräsentativer Singular in τις ... βλέπει
  choice: „jemand ... er“
  alternative: Eine unpersönliche oder pluralische Formulierung wie „wer ...“ beziehungsweise „Menschen ... sie“
  rationale: Die Formulierung bewahrt den griechischen Singular und bleibt im modernen Deutschen verständlich, ohne eine Personengruppe zu spezifizieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage ist idiomatisch formuliert; die wiederholten Begriffe „Tag“ und „Licht“ sowie das konkrete Bild des Anstoßens bleiben erhalten.
