source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: de
  text: 'Jesus sagte: »Nehmt den Stein weg!« Marta, die Schwester des Verstorbenen, sagte zu ihm: »Herr, er riecht schon[a]; denn er ist seit vier Tagen tot.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: »Er stinkt schon.« Das griechische Verb bedeutet, einen Geruch auszuströmen; hier ist ein unangenehmer Verwesungsgeruch gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Er ist ein Viertägiger«, das heißt, er ist seit vier Tagen tot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Nehmt … weg
  rationale: Der Aoristimperativ Plural fordert die Anwesenden auf, den Stein zu entfernen. »Nehmt den Stein weg« ist im modernen Deutsch natürlich und gibt Handlung sowie Numerus wieder.
- source_word: τὸν λίθον
  choice: den Stein
  rationale: Im Zusammenhang mit einem Grab bezeichnet λίθος den Stein, der den Zugang verschließt; »Stein« ist die geläufige und klare Wiedergabe.
- source_word: τοῦ τετελευτηκότος
  choice: des Verstorbenen
  rationale: Das substantivierte Perfektpartizip bezeichnet den, der gestorben ist und nun tot ist. »Des Verstorbenen« ist knapp, würdig und im Deutschen idiomatisch.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede lässt sowohl respektvolle als auch weitergehende christologische Bedeutung anklingen. »Herr« bewahrt diese im Johannesevangelium bedeutsame Offenheit besser als »mein Herr« oder eine rein höfliche Anrede.
- source_word: ἤδη
  choice: schon
  rationale: ἤδη bezeichnet den inzwischen eingetretenen Zustand; »schon« ist hier die natürliche deutsche Entsprechung.
- source_word: ὄζει
  choice: er riecht
  rationale: ὄζω bedeutet, einen Geruch auszuströmen; der Zusammenhang macht den unangenehmen Geruch deutlich. »Er riecht« wahrt die verbale Form und vermeidet, die Stärke unnötig auf »stinkt« festzulegen.
- source_word: τεταρταῖος
  choice: er ist … seit vier Tagen tot
  rationale: Das prädikative Adjektiv bedeutet wörtlich etwa »viertägig« und bezeichnet hier den vierten Tag seit dem Tod. Die ausdrückliche deutsche Formulierung vermittelt den Sinn klar.
- source_word: γάρ
  choice: nämlich
  rationale: γάρ begründet Marthas Einwand. »Nämlich« stellt diesen erklärenden Zusammenhang im deutschen Dialog natürlich her.
theological_decisions:
- issue: Anrede κύριος an Jesus
  choice: Herr
  alternative: mein Herr; höfliches Herr/Sir
  rationale: »Herr« entspricht der üblichen theologischen Tragweite von κύριος, ohne festzulegen, wie vollständig Marthas Anrede an dieser Stelle als christologisches Bekenntnis zu verstehen ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede klingt natürlich; »Verstorbener« vermeidet eine unnötig harte Formulierung, während die Fußnoten die konkretere und die wörtlichere Lesart dokumentieren.
