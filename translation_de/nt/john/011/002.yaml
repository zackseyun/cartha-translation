source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: de
  text: Es war Maria, die den Herrn mit duftendem Öl[a] gesalbt und seine Füße mit ihrem Haar abgewischt hatte. Ihr Bruder Lazarus war krank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit wohlriechender Salbe“ beziehungsweise „mit Parfüm“; das griechische Wort bezeichnet duftendes Öl oder eine duftende Salbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Es war Maria
  rationale: Die identifizierende Konstruktion wird im Deutschen natürlich wiedergegeben; δέ wirkt hier als leichter Fortgang im Zusammenhang und benötigt keinen ausdrücklich übersetzten Zeit- oder Gliederungsmarker.
- source_word: ἡ ἀλείψασα
  choice: die … gesalbt … hatte
  rationale: Der substantivierte Aoristpartizipialsatz identifiziert Maria durch die Salbung. Das Plusquamperfekt stellt das beschriebene Geschehen aus der Perspektive der gegenwärtigen Erzählsituation als vorausliegend dar.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Bewahrt die gebräuchliche ehrende und theologisch gewichtige Bezeichnung für Jesus.
- source_word: μύρῳ
  choice: mit duftendem Öl
  rationale: μύρον bezeichnet parfümiertes beziehungsweise wohlriechendes Salböl oder eine entsprechende Salbe. „Duftendes Öl“ ist im Deutschen anschaulich, natürlich und sachlich.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: und seine Füße … abgewischt hatte
  rationale: ἐκμάσσω bezeichnet das Ab- oder Trockenwischen; „abgewischt“ wahrt den konkreten Vorgang, ohne die Art des Trocknens stärker festzulegen.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: mit ihrem Haar
  rationale: Der Dativ ist instrumental; der deutsche Singular „Haar“ bezeichnet idiomatisch das Haupthaar.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει
  choice: Ihr Bruder Lazarus war krank
  rationale: Ein neuer Hauptsatz vermeidet im Deutschen eine schwerfällige Verschachtelung, während die Beziehung Marias zu Lazarus und dessen Erkrankung vollständig erhalten bleiben.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Jesus
  choice: Herr
  alternative: Meister
  rationale: „Herr“ bewahrt sowohl den erzählerischen Ehrentitel als auch dessen mögliche theologische Tragweite; „Meister“ würde die Bedeutung unnötig auf eine soziale Rolle verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze verbessert die Verständlichkeit, ohne die Bezüge oder die zeitliche Einordnung des griechischen Satzes aufzugeben.
