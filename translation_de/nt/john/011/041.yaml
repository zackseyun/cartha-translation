  rationale: Die einzige sichere Verbesserung betrifft die deutsche Idiomatik der Bewegungsformel. „Emporheben“ gibt ἦρεν … ἄνω mit dem Bild des Hebens der Augen präzise und natürlich wieder. Alle übrigen Formulierungen und die vorhandenen, korrekt verankerten Fußnoten können unverändert bleiben.
