  source_fidelity: 'Der Entwurf gibt die Satzfolge und den Sinn des griechischen Textes zuverlässig wieder: οὖν wird folgerichtig angeschlossen, δέ als leichter Übergang markiert, und ἤκουσάς μου wird im Gebetskontext angemessen mit „mich erhört hast“ wiedergegeben. Die Fußnote bewahrt die formal offenere Lesart „gehört hast“.'
  naturalness: „Die Augen nach oben heben“ ist verständlich, klingt im heutigen Standarddeutsch jedoch weniger idiomatisch als „die Augen emporheben“. Letzteres erhält das konkrete Bild des griechischen Ausdrucks und ist zugleich natürlich sowie würdig im Register.
  terminology: „Stein“, „Vater“, „ich danke dir“ und „erhört hast“ sind passend. „Erhört“ legt im Deutschen die im Gebetskontext naheliegende günstige Bedeutung von ἀκούω aus, ohne eine über den Vers hinausgehende Lehraussage einzutragen; die Fußnote sichert die wörtlichere Alternative.
