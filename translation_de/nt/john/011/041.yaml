  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: de
  text: 'Da nahmen sie den Stein weg. Jesus aber hob die Augen empor[a] und sagte: »Vater, ich danke dir, dass du mich erhört hast.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richtete seinen Blick nach oben“; knapper: „blickte nach oben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dass du mich gehört hast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: nahmen … weg
  rationale: αἴρω bezeichnet hier das Entfernen des Steins vom Grabeingang. „Wegnehmen“ ist im Deutschen natürlich und wahrt zugleich das Bild der konkreten Handlung.
- source_word: οὖν
  choice: Da
  rationale: οὖν kennzeichnet die Handlung als Folge des zuvor erteilten Befehls. Das narrative „Da“ gibt diesen Anschluss in modernem Deutsch flüssig wieder.
- source_word: λίθον
  choice: Stein
  rationale: „Stein“ ist die übliche und sachlich passende Bezeichnung für den Verschluss des Grabes.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jesus aber
  rationale: δέ markiert hier einen leichten Wechsel zum Handeln Jesu. „Aber“ bewahrt diesen Übergang, ohne einen scharfen Gegensatz zu behaupten.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: hob die Augen nach oben
  rationale: Die Formulierung erhält sowohl das konkrete Bild der Augen als auch die nach oben gerichtete Bewegung; glattere Wiedergaben wie „blickte nach oben“ sind als Alternative in der Fußnote genannt.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ wird als direkte, schlichte Gebetsanrede wiedergegeben, ohne altertümliche oder liturgische Erweiterung.
- source_word: εὐχαριστῶ σοι
  choice: ich danke dir
  rationale: Dies ist die natürliche und vollständige deutsche Entsprechung der präsentischen Dankesformel.
- source_word: ὅτι ἤκουσάς μου
  choice: dass du mich erhört hast
  rationale: Im Gebetszusammenhang kann ἀκούω das gnädige oder zustimmende Hören einer Bitte bezeichnen. Das deutsche Perfekt bringt die abgeschlossene Handlung mit gegenwärtiger Bedeutung natürlich zum Ausdruck; die formal nähere Alternative „gehört hast“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Jesu Anrede an Gott im Gebet
  choice: Vater
  alternative: O Vater
  rationale: Die einfache Anrede bewahrt Nähe und Ehrfurcht des griechischen Vokativs, ohne dem Text liturgische Färbung oder eine zusätzliche Lehrdeutung aufzuerlegen.
- issue: Bedeutung von ἤκουσάς μου im Gebetszusammenhang
  choice: du mich erhört hast
  alternative: du mich gehört hast
  rationale: „Erhört“ macht die im Gebetskontext naheliegende Bedeutung deutlich, dass der Vater Jesu Bitte angenommen hat. Da ἀκούω formal auch schlicht „hören“ heißen kann, wird diese offenere Wiedergabe in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die bildhafte Wendung vom Heben der Augen bleibt erhalten; altertümliche Formen und nicht ausdrücklich genannte Ergänzungen wie „zum Himmel“ werden vermieden.
