  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: de
  text: 'Jesus sagte zu ihr: „Habe ich dir nicht gesagt, dass du, wenn du glaubst, die Herrlichkeit Gottes sehen wirst?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens des griechischen Erzählstils wird im natürlichen modernen Deutsch idiomatisch mit dem Präteritum wiedergegeben.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der Dativ bezeichnet die Adressatin, im Zusammenhang Marta; „zu ihr“ ist die natürliche deutsche Wiedergabe.
- source_word: Οὐκ εἶπόν σοι
  choice: Habe ich dir nicht gesagt
  rationale: Die rhetorische Frage erwartet Zustimmung. Das deutsche Perfekt klingt in direkter Rede natürlich und verweist auf Jesu frühere Aussage.
- source_word: ἐὰν πιστεύσῃς
  choice: Wenn du glaubst
  rationale: „glauben“ bewahrt den für das Johannesevangelium wichtigen Wortgebrauch, ohne ihn auf eine engere Auslegung festzulegen.
- source_word: ὄψῃ
  choice: wirst du … sehen
  rationale: Die Futurform wird im modernen Deutsch natürlich mit „werden“ und Infinitiv wiedergegeben.
- source_word: τὴν δόξαν
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte, sachgerechte Wiedergabe von δόξα und bewahrt den Bezug auf Gottes machtvolle Selbstoffenbarung.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv gibt die griechische Genitivverbindung knapp, würdig und eindeutig wieder.
theological_decisions:
- issue: Verhältnis von Glauben und dem Sehen der Herrlichkeit Gottes
  choice: Die Aussage wird ohne erläuternden Zusatz als bedingte Verheißung an Marta wiedergegeben.
  alternative: Sie als allgemeines Prinzip über Glauben und Wunder oder ausschließlich als auf die Auferweckung des Lazarus begrenzte Aussage auslegen.
  rationale: Der Wortlaut richtet eine unmittelbare bedingte Zusage an Marta. Die Übersetzung soll weder ihren möglichen weiteren Geltungsbereich bestimmen noch die theologische Spannung auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Doppelpunkt nach „gesagt“ führt den Inhalt der früheren Aussage klar ein; die direkte Anrede und die rhetorische Frage bleiben erhalten.
