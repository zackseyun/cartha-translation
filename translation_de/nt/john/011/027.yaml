id: JHN.11.27
reference: John 11:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: de
  text: 'Sie sagt zu ihm: „Ja, Herr. Ich glaube, dass du der Messias[a] bist, der Sohn Gottes, der in die Welt kommt[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Wort Christos bedeutet „der Gesalbte“ und ist hier ein Titel.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „der in die Welt Kommende“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Sie sagt zu ihm
  rationale: Das historische Präsens des griechischen Erzähltexts wird im Deutschen natürlich und quellennah als Präsens wiedergegeben; das feminine Subjekt ergibt sich aus dem Zusammenhang.
- source_word: Ναί
  choice: Ja
  rationale: Die einfache Bejahung entspricht dem direkten und nachdrücklichen Antwortcharakter.
- source_word: κύριε
  choice: Herr
  rationale: In diesem feierlichen Bekenntnis ist „Herr“ sowohl sprachlich angemessen als auch offen für den ehrerbietigen und theologischen Gehalt der Anrede.
- source_word: ἐγὼ πεπίστευκα
  choice: Ich glaube
  rationale: Das griechische Perfekt bezeichnet hier einen gewonnenen und fortbestehenden Glauben. Das deutsche „ich habe geglaubt“ könnte fälschlich einen abgeschlossenen oder vergangenen Glauben nahelegen; „ich glaube“ gibt den gegenwärtig bestehenden Zustand natürlich wieder.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt des Glaubens ein, nicht dessen Begründung.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier ein Bekenntnistitel. „Messias“ bewahrt seinen jüdischen Erwartungs- und Königstitelcharakter deutlicher als eine bloße Transliteration.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die bestimmte und theologisch gewichtige Titelform wird unmittelbar bewahrt.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: der in die Welt kommt
  rationale: Der substantivierte präsentische Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben, ohne den Vorgang zeitlich enger festzulegen.
- source_word: κόσμον
  choice: Welt
  rationale: „Welt“ ist die natürliche Entsprechung und bewahrt den johanneischen Bezugsraum menschlicher Existenz, in den Jesus kommt.
theological_decisions:
- issue: Wiedergabe von Χριστός als Bekenntnistitel
  choice: Messias
  alternative: Christus
  rationale: Im Identitätsbekenntnis bezeichnet der Ausdruck einen Titel. „Messias“ macht dessen inhaltlichen und jüdischen Hintergrund sichtbar; die geläufige Alternative wird in einer Fußnote genannt.
- issue: Bedeutungsumfang der Anrede κύριε
  choice: Herr
  alternative: mein Herr; Herr im rein höflichen Sinn
  rationale: „Herr“ wahrt die mögliche ehrerbietige und theologische Tiefe im unmittelbaren Bekenntniskontext, ohne durch einen Zusatz eine bestimmte Nuance festzuschreiben.
- issue: Aspekt des Perfekts πεπίστευκα
  choice: Ich glaube
  alternative: Ich bin zum Glauben gekommen; Ich habe geglaubt
  rationale: Die Übersetzung bringt den fortbestehenden Glaubenszustand idiomatisch zum Ausdruck. Sie vermeidet sowohl eine übermäßige Betonung des Anfangspunkts als auch den im Deutschen möglichen Eindruck, der Glaube liege nur in der Vergangenheit.
- issue: Funktion von ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: der in die Welt kommt
  alternative: der in die Welt Kommende
  rationale: Der Relativsatz bewahrt die Kennzeichnung Jesu als des Kommenden und bleibt zugleich in modernem Deutsch verständlich; die nominale Struktur des Griechischen wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bekenntnisform und die Abfolge der drei Aussagen über Jesus bleiben erhalten. Das historische Präsens wird bewahrt; unnötige konfessionelle Präzisierungen werden vermieden.
