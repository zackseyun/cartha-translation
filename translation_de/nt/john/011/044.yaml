    issue: Der Imperativ „Löst die Binden“ ersetzt das Objekt „ihn“.
    rationale: λύσατε αὐτόν fordert dazu auf, die betreffende Person loszubinden. Eine deutsche Formulierung mit „ihn“ bewahrt den Wortlaut und die Handlungsrichtung unmittelbarer.
  - severity: low
    issue: „Jesus sagte“ gibt das historische Präsens λέγει nicht wieder.
    rationale: Präteritum ist in deutscher Erzählsprache möglich, doch „Jesus sagt“ erhält die im griechischen Text gewählte Präsensform und stimmt mit dem englischen Audittext überein.
