review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Handlung und die Bestattungsumhüllung im Wesentlichen. In der direkten Aufforderung wird jedoch αὐτόν („ihn“) durch „die Binden“ ersetzt; das ist zwar kontextuell verständlich, verschiebt aber die Formulierung vom Losbinden der Person zu einem bloßen Lösen der Binden. Das historische Präsens λέγει wird am besten als „sagt“ beibehalten, entsprechend dem griechischen Text und dem englischen Audittext.
  naturalness: „Löst ihn los“ ist modernes, idiomatisches Deutsch und bewahrt den personalen Bezug des Imperativs. Die knappe Partizipialkonstruktion beschreibt die Szene anschaulich, ohne unnötige Zusätze.
  terminology: „Der Verstorbene“, „Binden“ und „Tuch“ sind sachlich, verständlich und ohne konfessionelle Überprägung. „Binden“ gibt κειρίαις angemessen wieder, ohne die Materialangabe über das im griechischen Wort sicher Ausgedrückte hinaus zu spezifizieren.
  issues:
