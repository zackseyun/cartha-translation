source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: de
  text: 'Der Verstorbene kam heraus, an Füßen und Händen mit Binden gebunden; sein Gesicht war mit einem Tuch umwickelt. Jesus sagt zu ihnen: »Löst ihn los und lasst ihn gehen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: der Verstorbene
  rationale: Das substantivierte Perfektpartizip bezeichnet knapp und würdevoll den Mann, der gestorben war; »der Verstorbene« ist im Deutschen natürlich.
- source_word: κειρίαις
  choice: mit Leinenbinden
  rationale: Das Wort bezeichnet schmale Stoff- beziehungsweise Leinenstreifen; im Bestattungskontext ist »Leinenbinden« präzise und verständlich.
- source_word: ἡ ὄψις
  choice: sein Gesicht
  rationale: Hier ist die sichtbare Gesichtsfläche gemeint; »Gesicht« entspricht dem Kontext natürlich.
- source_word: σουδαρίῳ
  choice: mit einem Tuch
  rationale: Gemeint ist ein separates Tuch, das um das Gesicht beziehungsweise den Kopf gebunden war; »Tuch« vermeidet eine unbelegte nähere Festlegung.
- source_word: Λύσατε αὐτόν
  choice: Löst die Binden
  rationale: Wörtlich heißt es »Löst ihn«. Im Deutschen macht die metonymische Formulierung den Bezug auf die zuvor genannten Binden klar, ohne den Sinn zu verändern.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: lasst ihn gehen
  rationale: Gibt die Aufforderung idiomatisch wieder und bewahrt die mögliche Bedeutung sowohl des Weggehens als auch der wiedergewonnenen Bewegungsfreiheit.
theological_decisions:
- issue: Historisches Präsens λέγει
  choice: Jesus sagte zu ihnen
  alternative: Jesus sagt zu ihnen
  rationale: Das griechische Präsens belebt die Erzählung, wird in einer durchgehend deutsch erzählten Vergangenheit jedoch natürlich mit Präteritum wiedergegeben; daraus folgt keine theologische Deutung.
- issue: Beschreibung des Auferweckten
  choice: der Verstorbene
  alternative: der Tote / der gestorben war
  rationale: Die Formulierung hält fest, dass Lazarus tatsächlich gestorben war, bezeichnet ihn im Moment des Herauskommens aber nicht missverständlich als weiterhin tot.
translation_notes:
  register: Moderne, würdige Standardsprache. Kurze Hauptsätze erhalten die Anschaulichkeit und Dramatik der Szene; keine konfessionell geprägte Terminologie.
