  naturalness: „Und er sagte … Sie sagten zu ihm …“ ist im modernen deutschen Bibelerzählstil natürlich und knapp. „Herr, komm und sieh!“ ist idiomatisch; das Ausrufezeichen passt zur direkten Aufforderung.
  terminology: „Herr“ ist für κύριε angemessen, da es die mögliche respektvolle Anrede und einen möglichen weitergehenden theologischen Klang offenhält. Die Fußnote sollte die Ambiguität erklären, ohne mit der wenig idiomatischen Alternative „Geehrter Herr“ eine zu spezifische deutsche Anrede nahezulegen.
