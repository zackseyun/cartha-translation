  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: de
  text: 'Und er sagte: „Wo habt ihr ihn hingelegt?“ Sie sagten zu ihm: „Herr[a], komm und sieh!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herr“ als respektvolle Anrede. Das griechische κύριε kann höflich-respektvoll gebraucht sein; „Herr“ kann zugleich einen weitergehenden christologischen Klang bewahren.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: fragte
  rationale: Wörtlich steht das gewöhnliche Verb „sagen“. Da die folgende direkte Rede eine Frage ist, gibt „fragte“ die Funktion im natürlichen deutschen Erzählstil präzise wieder.
- source_word: Ποῦ
  choice: Wo
  rationale: Das direkte Frageadverb bezeichnet den Ort.
- source_word: τεθείκατε
  choice: habt ihr … hingelegt
  rationale: Der Perfekt Aktiv von τίθημι bezeichnet hier das abgeschlossene Niederlegen beziehungsweise Beisetzen von Lazarus; „hingelegt“ bewahrt den konkreten Sinn, ohne ausdrücklich ein Grab zu ergänzen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf Lazarus.
- source_word: λέγουσιν
  choice: Sie antworteten
  rationale: Der griechische historische Präsens wird für einen flüssigen deutschen Erzählstil als Vergangenheit wiedergegeben. Da die Äußerung auf Jesu Frage folgt, ist „antworteten“ idiomatisch, auch wenn λέγω wörtlich „sagen“ bedeutet.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt sowohl die mögliche höfliche Anrede als auch einen möglichen christologischen Nachklang; die Ambiguität wird in der Fußnote kenntlich gemacht.
- source_word: ἔρχου
  choice: komm
  rationale: Der Imperativ von ἔρχομαι wird unmittelbar und idiomatisch wiedergegeben.
- source_word: ἴδε
  choice: sieh
  rationale: Der Imperativ von ὁράω wird mit „sieh“ wiedergegeben und bewahrt die knappe Verbindung „komm und sieh“.
theological_decisions:
- issue: Bedeutung von κύριε als Anrede Jesu
  choice: Herr
  alternative: mein Herr / geehrter Herr
  rationale: κύριε kann in diesem Zusammenhang sowohl eine respektvolle Anrede als auch eine Anrede mit weitergehender theologischer Bedeutung sein. „Herr“ lässt beides zu, während die Fußnote die höfliche Lesart ausdrücklich nennt.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die idiomatischen Verben „fragte“ und „antworteten“ geben die Gesprächsfunktion wieder; „hingelegt“ vermeidet eine erklärende Ergänzung wie „ins Grab gelegt“. Der Ausruf nach „komm und sieh“ entspricht der direkten Aufforderung.
