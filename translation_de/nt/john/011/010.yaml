  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: de
  text: Wenn aber jemand in der Nacht geht, stolpert er, weil das Licht nicht in ihm ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil das Licht nicht bei ihm ist“. Wörtlich steht im Griechischen: „weil das Licht nicht in ihm ist“; dies kann mehr andeuten als nur das Fehlen äußeren Lichts.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: Wenn aber jemand
  rationale: Gibt die kontrastive Bedingung und den allgemeinen Bezug knapp und natürlich wieder.
- source_word: περιπατῇ
  choice: umhergeht
  rationale: Bewahrt das konkrete Bild des Gehens und lässt zugleich eine mögliche übertragene Bedeutung offen.
- source_word: ἐν τῇ νυκτί
  choice: in der Nacht
  rationale: Entspricht der räumlich-bildhaften Formulierung und deutet νύξ nicht vorschnell als abstrakte Finsternis.
- source_word: προσκόπτει
  choice: stößt er an
  rationale: Gibt das Anstoßen an einem Hindernis genauer wieder als eine ausschließlich auf das Stolpern bezogene Formulierung und bleibt bildhaft.
- source_word: ὅτι
  choice: weil
  rationale: Kennzeichnet den kausalen Zusammenhang klar.
- source_word: τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ
  choice: das Licht nicht in ihm ist
  rationale: Bewahrt die ausdrückliche Wendung mit ἐν und damit sowohl den unmittelbaren Bildsinn als auch einen möglichen tieferen johanneischen Sinn.
theological_decisions:
- issue: Sinn von „das Licht ist nicht in ihm“
  choice: Die innere Ortsangabe „in ihm“ wird beibehalten.
  alternative: „Das Licht ist nicht bei ihm“ als rein äußerliche Aussage über fehlende Beleuchtung.
  rationale: ἐν αὐτῷ bedeutet wörtlich „in ihm“. Die Formulierung kann im unmittelbaren Bild ungewöhnlich wirken, bewahrt aber bewusst die johanneische Spannung zwischen äußerem Licht und innerer Erleuchtung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umhergeht“ bewahrt das Gehmotiv; „stößt an“ ist konkret und verständlich. Die ungewöhnliche Wendung „in ihm“ bleibt zur Wahrung der Mehrdeutigkeit im Haupttext.
