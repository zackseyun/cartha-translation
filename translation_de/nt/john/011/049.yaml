  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: de
  text: 'Doch einer von ihnen, Kajaphas, der in jenem Jahr Hoher Priester war, sagte zu ihnen: »Ihr wisst überhaupt nichts.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Zusammenhang entsprechend: »Ihr versteht überhaupt nichts.« Die griechische Formulierung ist ein nachdrücklicher Vorwurf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Doch einer von ihnen
  rationale: εἷς … τις bezeichnet idiomatisch eine einzelne Person aus der Gruppe. »Doch« gibt den leichten Kontrast beziehungsweise Übergang von δέ wieder.
- source_word: Καϊάφας
  choice: Kajaphas
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Schreibweise wiedergegeben.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: der in jenem Jahr Hoher Priester war
  rationale: Die partizipiale Fügung beschreibt Kajaphas und wird in natürlichem Deutsch als Relativsatz wiedergegeben. »In jenem Jahr« bewahrt den zeitlichen Hinweis, ohne ihn auszudeuten.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Die schlichte Redeeinleitung entspricht λέγω mit Dativ und vermeidet eine stärkere Interpretation.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Ihr versteht überhaupt nichts
  rationale: Das ausdrücklich gesetzte ὑμεῖς und die griechische Negativkonstruktion bilden einen scharfen, emphatischen Vorwurf. Im beratenden Kontext kann οἴδατε natürlich mit »versteht« wiedergegeben werden; »überhaupt nichts« erhält die Verstärkung.
theological_decisions:
- issue: Zeitangabe zum Amt des Kajaphas
  choice: der in jenem Jahr Hoher Priester war
  alternative: der Hoher Priester jenes Jahres war
  rationale: Die Formulierung bleibt eine historische Beschreibung und erklärt weder die Amtsdauer noch eine mögliche erzählerische oder theologische Ironie.
- issue: Bedeutungsnuance von οἴδατε im Vorwurf
  choice: versteht überhaupt nichts
  alternative: wisst überhaupt nichts
  rationale: »Versteht« passt zum Kontext einer Beratung über das weitere Vorgehen und gibt den Vorwurf idiomatisch wieder, ohne seinen Gegenstand ausdrücklich zu ergänzen. Die mögliche Grundbedeutung »wissen« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt scharf und herablassend, ohne umgangssprachlich zu werden. »Hoher Priester« wird als Amtsbezeichnung großgeschrieben.
