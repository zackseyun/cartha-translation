  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: de
  text: Jesus liebte Marta, ihre Schwester und Lazarus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: liebte
  rationale: Das Imperfekt von ἀγαπάω beschreibt hier am natürlichsten Jesu fortdauernde Liebe in der Vergangenheit. Das deutsche Präteritum »liebte« gibt dies idiomatisch wieder, ohne eine künstliche Verlaufsform einzuführen.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwacher Diskursanschluss. Im modernen Deutschen braucht der eigenständig verständliche Satz keinen ausdrücklichen Konnektor; »aber« wäre zu adversativ und »nun« könnte fälschlich temporal verstanden werden.
- source_word: τὴν Μάρθαν
  choice: Marta
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: ihre Schwester
  rationale: Die natürliche deutsche Entsprechung bewahrt den Bezug auf Marta und nennt die im griechischen Vers ungenannte Schwester nicht ausdrücklich beim Namen.
- source_word: τὸν Λάζαρον
  choice: Lazarus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: καὶ ... καὶ
  choice: Kommasetzung mit abschließendem »und«
  rationale: Die drei Objekte bleiben gleichrangig koordiniert. Im Deutschen ist die Aufzählung »Marta, ihre Schwester und Lazarus« natürlicher als eine mechanische Wiederholung von »und« und bewahrt denselben Sinn.
theological_decisions:
- issue: Aspekt des Imperfekts ἠγάπα und Jesu Liebe
  choice: Aussage über Jesu fortdauernde Liebe zu Marta, ihrer Schwester und Lazarus
  alternative: »Jesus war dabei, ... zu lieben« oder »Jesus begann ... zu lieben«
  rationale: Das Imperfekt stellt die Liebe am ehesten als anhaltenden Zustand in vergangener Zeit dar. Die Übersetzung vermeidet sowohl einen ingressiven Beginn als auch eine im Deutschen unnatürlich hervorgehobene Verlaufsbedeutung.
translation_notes:
  register: Klares, modernes und würdevolles Standarddeutsch. Die etablierte deutsche Namensform »Marta« wird verwendet. Die schlichte Satzstruktur entspricht dem griechischen Aussagecharakter.
