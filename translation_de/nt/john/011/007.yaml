  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: de
  text: 'Danach sagt er zu den Jüngern: »Lasst uns wieder nach Judäa gehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Danach
  rationale: Die beiden aufeinanderfolgenden Zeitangaben markieren gemeinsam den nächsten Schritt der Erzählung. »Danach« gibt diese zeitliche Abfolge im Deutschen natürlich wieder, ohne die im Deutschen schwerfällige Doppelung »dann nach diesem« nachzuahmen.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens bewahrt das für Johannes typische historische Präsens und die lebendige Erzählweise des griechischen Textes.
- source_word: τοῖς μαθηταῖς
  choice: zu den Jüngern
  rationale: Der bestimmte Artikel wird wiedergegeben; ein besitzanzeigendes »seinen« wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: Ἄγωμεν
  choice: Lasst uns … gehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als gemeinsame Aufforderung wiedergegeben.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: nach Judäa
  rationale: Bei der Richtungsangabe zu einer Region ohne Artikel ist »nach Judäa« die natürliche standarddeutsche Form. Das griechische εἰς bezeichnet hier die Bewegung zum beziehungsweise in das Gebiet.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort kennzeichnet die Rückkehr in eine bereits zuvor besuchte Region und wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Historisches Präsens in der johanneischen Erzählung
  choice: 'Präsens: »sagt er«'
  alternative: 'Erzählpräteritum: »sagte er«'
  rationale: Das Präsens entspricht der Form des griechischen Textes und bewahrt die johanneische Erzählweise, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die griechische doppelte Zeitmarkierung ἔπειτα μετὰ τοῦτο wird idiomatisch zu »Danach« gebündelt. Für εἰς τὴν Ἰουδαίαν ist im Deutschen »nach Judäa« natürlicher als »in Judäa hinein«; daher ist keine Fußnote zur englischen Alternative »into/to« erforderlich.
