id: JHN.11.57
reference: John 11:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: de
  text: 'Die führenden Priester und die Pharisäer hatten angeordnet: Wenn jemand wisse, wo Jesus sei, solle er es melden, damit sie ihn festnehmen könnten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: hatten angeordnet
  rationale: Der Plusquamperfekt wahrt die gegenüber dem Erzählzeitpunkt vorzeitige Handlung; zusammen mit ἐντολάς ergibt sich im Deutschen natürlich „hatten angeordnet“.
- source_word: δὲ
  choice: unmarkiert
  rationale: δέ führt hier die Erzählung weiter, ohne einen starken Gegensatz auszudrücken. Im Deutschen ist dafür kein ausdrückliches Bindewort nötig.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die leitenden priesterlichen Autoritäten und nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche deutsche Bezeichnung der jüdischen Gruppierung.
- source_word: ἐντολὰς
  choice: angeordnet
  rationale: Im administrativen Kontext bezeichnet das Wort verbindliche Anweisungen; die verbale Fassung ist natürliches modernes Deutsch.
- source_word: ἵνα ἐάν τις γνῷ
  choice: Wenn jemand wisse
  rationale: Die Konstruktion gibt den Inhalt der Anordnung mit einer Bedingung wieder. Der Konjunktiv I kennzeichnet die abhängige Wiedergabe.
- source_word: ποῦ ἐστιν
  choice: wo Jesus sei
  rationale: Der griechische Präsens steht innerhalb der mitgeteilten Anordnung. Der deutsche Konjunktiv I „sei“ erhält diese Perspektive; „Jesus“ beseitigt eine im Deutschen potenziell störende Pronomenmehrdeutigkeit, ohne den Referenten zu verändern.
- source_word: μηνύσῃ
  choice: solle er es melden
  rationale: μηνύω bezeichnet hier das Melden einer Information an Autoritäten. „Es melden“ ist knapp und kontextgerecht.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: damit sie ihn festnehmen könnten
  rationale: ὅπως gibt den Zweck an. πιάζω bedeutet ergreifen oder fassen; im behördlichen Kontext ist „festnehmen“ eine natürliche, aber nicht übermäßig technische Wiedergabe.
