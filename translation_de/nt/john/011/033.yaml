  source_fidelity: 'Die Wiedergabe der zeitlichen Einleitung, des wiederholten Weinens, der anwesenden Ἰουδαῖοι und der starken, in ihrer genauen Ausrichtung umstrittenen Regung Jesu ist im Grundsatz quellennah. Bei ἐτάραξεν ἑαυτόν ist „erschütterte sich selbst“ jedoch im modernen Deutsch semantisch missverständlich: Es legt nahe, Jesus habe sich absichtlich oder körperlich erschüttert. Die griechische reflexive Konstruktion beschreibt hier sein Erschüttertwerden bzw. sein inneres Aufgewühltsein.'
  naturalness: „Im Geist“ ohne Possessivbezug ist im Deutschen weniger präzise und kann unnötig abstrakt wirken. „In seinem Geist“ entspricht dem Kontext besser. „Wurde innerlich erschüttert“ ist idiomatisches modernes Standarddeutsch und gibt die Zustandsveränderung wieder, ohne eine körperliche oder willentliche Selbsterschütterung zu suggerieren.
  terminology: „Juden“ ist als direkte Wiedergabe von Ἰουδαίους vertretbar, sofern die kontextuelle Fußnote klarstellt, dass die bei Maria anwesenden jüdischen Trauergäste gemeint sind. Die Alternative „Judäer“ bleibt sinnvoll. Die Fußnote zu ἐνεβριμήσατο soll neben Entrüstung/Zorn auch die weniger spezifische Bedeutung starker innerer Erregung wahren.
