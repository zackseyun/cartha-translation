    rationale: Das Griechische hat zwar kein Possessivpronomen, doch ἑαυτόν im anschließenden Ausdruck und der Zusammenhang beziehen die Regung eindeutig auf Jesus. „In seinem Geist“ ist im Deutschen klarer und entspricht auch der englischen Audit-Trail-Entscheidung.
