revisions:
- from: Als Jesus nun sah, wie sie weinte und wie auch die Juden[a], die mit ihr gekommen waren, weinten, geriet er im Geist in heftige Erregung[b] und erschütterte sich selbst.
  to: Als Jesus nun sah, wie sie weinte und wie auch die Juden[a], die mit ihr gekommen waren, weinten, geriet er in seinem Geist in heftige Erregung[b] und wurde innerlich erschüttert.
  rationale: Die Revision beseitigt die im Deutschen missverständliche Selbsthandlung in „erschütterte sich selbst“. „Wurde innerlich erschüttert“ gibt die mit ἐτάραξεν ἑαυτόν ausgedrückte innere Aufgewühltheit natürlich wieder, ohne eine Deutung über Ursache oder theologische Bedeutung vorzunehmen. „In seinem Geist“ macht den personalen Bezug von τῷ πνεύματι klar. Die umstrittene emotionale Nuance von ἐνεβριμήσατο bleibt im Haupttext offen und wird in der Fußnote abgebildet.
