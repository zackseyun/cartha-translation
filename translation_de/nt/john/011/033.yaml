source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: de
  text: Als Jesus nun sah, wie sie weinte und wie auch die Juden[a], die mit ihr gekommen waren, weinten, geriet er in seinem Geist in heftige Erregung[b] und wurde innerlich erschüttert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Judäer“. Hier sind die jüdischen Trauergäste gemeint, die mit Maria gekommen waren, nicht das jüdische Volk als Ganzes.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch „wurde unwillig“, „war entrüstet“ oder „wurde zornig“ bedeuten und bezeichnet eine starke innere Bewegung.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet hier die Fortführung der Erzählung und den Zusammenhang mit dem Vorangehenden; „nun“ ist im Deutschen natürlicher als ein ausdrücklich folgerndes „daher“.
- source_word: ὡς εἶδεν
  choice: als ... sah
  rationale: ὡς mit dem Aorist ist hier temporal gebraucht. „Als ... sah“ gibt die zeitliche Abfolge idiomatisch wieder.
- source_word: κλαίουσαν / κλαίοντας
  choice: weinte / weinten
  rationale: κλαίω bezeichnet hörbares Weinen oder Klagen. „Weinen“ wahrt den ernsten Ton, ohne die möglicherweise vorhandene Nuance rituellen Klagens festzuschreiben.
- source_word: συνελθόντας αὐτῇ
  choice: die mit ihr gekommen waren
  rationale: Die Partizipialform bezeichnet diejenigen, die zusammen mit Maria gekommen waren; die vorzeitige deutsche Form macht das Verhältnis zum Sehen Jesu klar.
- source_word: Ἰουδαίους
  choice: die Juden
  rationale: Dies ist die direkte lexikalische Wiedergabe. Im unmittelbaren Zusammenhang sind die jüdischen Trauergäste bei Maria gemeint, nicht das jüdische Volk insgesamt; eine Fußnote grenzt den Bezug ein.
- source_word: ἐνεβριμήσατο
  choice: geriet ... in heftige Erregung
  rationale: Das Verb bezeichnet eine starke innere Bewegung, die auch Entrüstung oder Zorn einschließen kann. Die Formulierung bewahrt die Intensität, ohne die umstrittene Art oder den Gegenstand der Emotion festzulegen.
- source_word: τῷ πνεύματι
  choice: im Geist
  rationale: Der Dativ bezeichnet wahrscheinlich den Bereich, in dem sich die Erregung vollzieht. „Im Geist“ bleibt nahe am Griechischen und ist im Deutschen verständlich.
- source_word: ἐτάραξεν ἑαυτόν
  choice: erschütterte sich selbst
  rationale: Die auffällige aktive Reflexivkonstruktion des Griechischen wird bewusst erhalten und nicht zu einem bloßen passiven „wurde erschüttert“ eingeebnet.
theological_decisions:
- issue: Art der Gemütsbewegung Jesu in ἐνεβριμήσατο
  choice: Starke innere Erregung ausdrücken, ohne sie eindeutig als Trauer, Entrüstung oder Zorn zu bestimmen.
  alternative: „wurde unwillig“, „war entrüstet“ oder „wurde zornig“
  rationale: Das Verb trägt eine schärfere emotionale Färbung als bloßes Mitgefühl, doch der genaue Charakter und Gegenstand dieser Regung bleiben im Vers unausgesprochen. Haupttext und Fußnote bewahren diese Spannung.
- issue: Reflexivität von ἐτάραξεν ἑαυτόν
  choice: „erschütterte sich selbst“
  alternative: „wurde erschüttert“ oder „war tief erschüttert“
  rationale: Die reflexive Form stellt Jesus nicht lediglich als passiv von einem Gefühl überwältigt dar. Die bewusst markierte Übersetzung erhält diesen ungewöhnlichen Zug, ohne seine christologische Bedeutung näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „weinte/weinten“ bildet die Wiederholung von κλαίω ab. „Erschütterte sich selbst“ klingt bewusst leicht markiert, um die ausdrückliche griechische Reflexivkonstruktion zu bewahren.
