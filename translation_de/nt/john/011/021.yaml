  terminology: '»Herr« ist als projekttreue Wiedergabe von κύριε geeignet und bewahrt sowohl höfliche Anrede als auch möglichen theologischen Resonanzraum. Die Fußnotenalternative »Mein Herr« ist dagegen keine direkte, gleichwertige Übersetzungsalternative: Das griechische Vokativ κύριε enthält kein Possessivpronomen. Als Alternative ist »Sir« bzw. im Deutschen »verehrter Herr« nur eingeschränkt idiomatisch; am klarsten ist eine erläuternde Fußnote zur möglichen höflichen Anrede.'
