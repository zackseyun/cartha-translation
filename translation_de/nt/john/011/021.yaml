source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: de
  text: 'Da sagte Marta zu Jesus: »Herr, wenn du hier gewesen wärst, wäre mein Bruder nicht gestorben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische κύριε kann als respektvolle Anrede gebraucht werden; »Herr« bewahrt zugleich mögliches theologisches Gewicht im Johannesevangelium.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: οὖν führt die Erzählung folgernd bzw. weiterführend fort. »Da« klingt im deutschen Erzählfluss natürlich und bewahrt den Zusammenhang, ohne ein zu stark logisches »deshalb« einzutragen.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche und natürliche Wiedergabe des Redeverbs λέγω in diesem erzählenden Kontext.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: zu Jesus
  rationale: πρός mit Akkusativ bezeichnet nach einem Redeverb den Angesprochenen; »zu Jesus« ist die idiomatische deutsche Form.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die mögliche Funktion als respektvolle Anrede als auch das mögliche christologische Gewicht im Johannesevangelium.
- source_word: εἰ ἦς ὧδε
  choice: wenn du hier gewesen wärst
  rationale: Der irreale Vergangenheitsfall wird im Deutschen natürlich mit Konjunktiv II der Vergangenheit wiedergegeben; ὧδε bedeutet hier »hier«.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: wäre … nicht gestorben
  rationale: οὐκ mit ἄν und Aorist Indikativ bildet die Folge eines irrealen Vergangenheitsfalls; die deutsche Konstruktion gibt dies genau und idiomatisch wieder.
- source_word: ὁ ἀδελφός μου
  choice: mein Bruder
  rationale: ἀδελφός bezeichnet hier Martas leiblichen Bruder Lazarus; »mein Bruder« ist eindeutig und direkt.
theological_decisions:
- issue: Wiedergabe von κύριος in Martas Anrede an Jesus
  choice: Herr
  alternative: Mein Herr; verehrter Herr
  rationale: »Herr« lässt offen, ob die Anrede vor allem respektvoll oder zugleich theologisch gewichtig gemeint ist, und löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der irreale Bedingungssatz ist idiomatisch formuliert; die mögliche Mehrdeutigkeit der Anrede κύριε bleibt durch »Herr« und die Fußnote erhalten.
