  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: de
  text: 'Marta sagte zu ihm: „Ich weiß, dass er auferstehen wird bei der Auferstehung am letzten Tag.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird in einer natürlich erzählten deutschen Vergangenheit idiomatisch mit dem Präteritum wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten der Äußerung; „zu ihm“ ist die natürliche deutsche Entsprechung.
- source_word: ἡ Μάρθα
  choice: Marta
  rationale: Der Personenname folgt der im modernen Deutschen üblichen biblischen Schreibweise.
- source_word: Οἶδα
  choice: Ich weiß
  rationale: Die direkte Formulierung bewahrt Martas bestimmte Aussage und gibt den Wissensanspruch ohne Verstärkung oder Abschwächung wieder.
- source_word: ἀναστήσεται
  choice: er wird auferstehen
  rationale: Der futurische Verbgebrauch bezeichnet im Kontext das künftige Auferstehen. Die aktive deutsche Form entspricht der Perspektive des griechischen Mediums besser als „wird auferweckt werden“.
- source_word: ἐν τῇ ἀναστάσει
  choice: bei der Auferstehung
  rationale: Im Deutschen bezeichnet „bei“ idiomatisch den Zeitpunkt beziehungsweise das Ereignis, in dessen Zusammenhang er auferstehen wird, ohne den Ausdruck unnötig auszudeuten.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: am letzten Tag
  rationale: „Am“ ist die natürliche deutsche Wiedergabe der temporalen Präposition bei einer Tagesangabe; „der letzte Tag“ bewahrt die eschatologische Bestimmtheit.
theological_decisions:
- issue: Eschatologische Auferstehung
  choice: Marta spricht von seinem künftigen Auferstehen bei der Auferstehung am letzten Tag.
  alternative: Eine allgemein gehaltene Hoffnung auf ein Leben nach dem Tod.
  rationale: Die Verbindung von ἀναστήσεται, ἀνάστασις und „dem letzten Tag“ verweist ausdrücklich auf die endzeitliche Auferstehung. Die Übersetzung erhält diese Aussage, ohne zusätzliche dogmatische Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „auferstehen … Auferstehung“ bleibt erhalten, weil sie die bewusste Wiederaufnahme desselben griechischen Wortstamms und die Aussage des Verses prägt.
