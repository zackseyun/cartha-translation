review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: Marta als Sprecherin, die Anrede an Jesus, ihr sicheres Wissen, das zukünftige Auferstehen sowie die doppelte eschatologische Zeitbestimmung „bei der Auferstehung am letzten Tag“. Das historische Präsens λέγει ist idiomatisch und ohne Bedeutungsverlust als „sagte“ wiedergegeben.'
  naturalness: '„Marta sagte zu ihm: ‚Ich weiß, dass er auferstehen wird bei der Auferstehung am letzten Tag.‘“ ist modernes, verständliches und würdiges Standarddeutsch. Die Wiederholung von „auferstehen“ und „Auferstehung“ ist hier sachlich und stilistisch angemessen, da sie die griechische Wortverbindung abbildet.'
  terminology: „Marta“ entspricht der üblichen deutschen biblischen Namensform. „Auferstehen“, „Auferstehung“ und „letzter Tag“ sind etablierte, theologisch nicht überdeutende Begriffe. „Bei der Auferstehung“ ist für ἐν τῇ ἀναστάσει eine natürliche und kontexttreue deutsche Wiedergabe.
