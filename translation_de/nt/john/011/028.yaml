  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: de
  text: 'Nachdem sie dies gesagt hatte, ging sie weg, rief ihre Schwester Maria heimlich[a] und sagte: »Der Lehrer[b] ist da und ruft dich[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter vier Augen« oder »im Verborgenen«. Gemeint ist, dass die Umstehenden die Ansprache nicht hören sollten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Meister«. Wörtlich: »Lehrer«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »ruft nach dir«. Im Zusammenhang kann damit gemeint sein, dass er sie zu sich bittet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Nachdem sie dies gesagt hatte
  rationale: Das Aoristpartizip bezeichnet hier eine der folgenden Handlung vorausgehende Handlung. Der temporale Nebensatz gibt Reihenfolge und Rückbezug im natürlichen Deutschen klar wieder.
- source_word: ἀπῆλθεν
  choice: ging sie weg
  rationale: Die Wendung gibt das Verlassen des bisherigen Ortes schlicht und erzählerisch natürlich wieder.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: rief … ihre Schwester Maria
  rationale: φωνέω bezeichnet hier das Rufen beziehungsweise Herbeirufen einer Person; die Apposition wird im Deutschen natürlich als »ihre Schwester Maria« wiedergegeben.
- source_word: λάθρᾳ
  choice: heimlich
  rationale: Das Adverb bezeichnet ein Rufen beziehungsweise Sprechen, das vor den anderen verborgen oder außerhalb ihrer Wahrnehmung geschieht. »Heimlich« bewahrt diesen Aspekt knapper und genauer als eine bloße Angabe persönlicher Vertraulichkeit.
- source_word: εἰποῦσα
  choice: und sagte
  rationale: Das Partizip leitet die direkte Rede ein. Eine beigeordnete finite Verbform ist im modernen deutschen Erzählstil natürlicher und bewahrt den Handlungsablauf.
- source_word: ὁ διδάσκαλος
  choice: Der Lehrer
  rationale: διδάσκαλος bedeutet grundsätzlich »Lehrer« und wird hier als respektvolle Bezeichnung für Jesus gebraucht, ohne dass zusätzliche Herrschaftsnuancen eingeführt werden.
- source_word: πάρεστιν
  choice: ist da
  rationale: Die idiomatische deutsche Wendung gibt die gegenwärtige Anwesenheit wieder; »ist anwesend« klänge in der direkten Rede unnötig förmlich.
- source_word: φωνεῖ σε
  choice: ruft dich
  rationale: Das griechische Präsens und das direkte Objekt werden formal und zugleich idiomatisch wiedergegeben. Im Kontext ist ein Ruf zu Jesus hin gemeint, doch wird diese Zielrichtung nicht ausdrücklich ergänzt.
theological_decisions:
- issue: Bezeichnung Jesu als διδάσκαλος
  choice: Der Lehrer
  alternative: Der Meister
  rationale: »Lehrer« bewahrt die gewöhnliche lexikalische Bedeutung und den respektvollen Titel der Erzählung, ohne eine stärkere Autoritätsbedeutung einzutragen.
- issue: Nuance von λάθρᾳ
  choice: heimlich
  alternative: unter vier Augen / unbemerkt
  rationale: Der Text kennzeichnet die Mitteilung als den Umstehenden verborgen, nennt aber kein Motiv wie Furcht oder Täuschungsabsicht. Die Übersetzung wahrt diese Spannung, und die Fußnote zeigt eine weniger stark klingende Möglichkeit.
- issue: Bedeutung von φωνεῖ σε
  choice: ruft dich
  alternative: ruft nach dir / lässt dich rufen
  rationale: Die Hauptfassung folgt der unmittelbaren Formulierung des griechischen Textes. Die kontextuelle Bedeutung eines Herbeirufens wird in der Fußnote erläutert, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Satzfolge. Die direkte Rede bleibt knapp und mündlich natürlich. »Heimlich« erhält die im griechischen Adverb liegende Verborgenheit, ohne im Haupttext ein Motiv dafür zu behaupten.
