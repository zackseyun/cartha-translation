  text: ἦν δὲ ⸀ἡ Βηθανία ἐγγὺς τῶν Ἱεροσολύμων ὡς ἀπὸ σταδίων δεκαπέντε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: de
  text: Betanien lag nahe bei Jerusalem, etwa fünfzehn Stadien[a] entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entspricht ungefähr drei Kilometern.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches Bindewort, das die Erzählung weiterführt. Ein ausdrückliches „nun“ oder „aber“ wäre im Deutschen unnötig oder würde einen zu starken zeitlichen beziehungsweise gegensätzlichen Akzent setzen.
- source_word: Βηθανία
  choice: Betanien
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: nahe bei Jerusalem
  rationale: Gibt die räumliche Nähe natürlich und genau wieder; „Jerusalem“ ist die übliche deutsche Namensform.
- source_word: ὡς
  choice: etwa
  rationale: Kennzeichnet bei einer Maßangabe die ungefähre Entfernung.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: fünfzehn Stadien entfernt
  rationale: Bewahrt das antike Längenmaß und gibt mit „entfernt“ die durch ἀπό ausgedrückte räumliche Distanz idiomatisch wieder.
theological_decisions: []
