  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: de
  text: 'Da sagte Jesus ihnen offen: »Lazarus ist gestorben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  choice: Da
  rationale: Die Kombination führt die Erzählung zeitlich und folgernd weiter. Im Deutschen gibt »Da« diesen Übergang natürlich wieder, ohne die Partikeln hölzern zu verdoppeln.
- source_word: εἶπεν αὐτοῖς
  choice: sagte Jesus ihnen
  rationale: Die direkte Entsprechung ist im modernen Deutschen natürlich und bewahrt die Struktur des griechischen Satzes.
- source_word: παρρησίᾳ
  choice: offen
  rationale: Das Adverb bezeichnet hier unverhülltes, unmissverständliches Reden im Gegensatz zur vorausgehenden Rede vom Schlaf. »Offen« bewahrt zudem die Grundbedeutung von Freimütigkeit beziehungsweise Offenheit.
- source_word: Λάζαρος
  choice: Lazarus
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: ἀπέθανεν
  choice: ist gestorben
  rationale: Das deutsche Perfekt gibt das eingetretene Ereignis samt seiner gegenwärtigen Relevanz idiomatisch wieder.
theological_decisions:
- issue: Art der Aussage über den Zustand des Lazarus
  choice: Eine direkte Aussage über den leiblichen Tod des Lazarus
  alternative: Die vorausgehende bildhafte Rede vom Schlaf fortzuführen
  rationale: Mit ἀπέθανεν löst der Ausgangstext die zuvor bestehende Bildlichkeit selbst auf; die Übersetzung muss deshalb an dieser Stelle eindeutig vom Sterben sprechen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform entspricht der direkten Klarstellung im Kontext; »offen« ist verständlich und hält die mögliche Nuance von »freimütig/unverhüllt« präsent.
