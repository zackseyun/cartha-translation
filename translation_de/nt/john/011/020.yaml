id: JHN.11.20
reference: John 11:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: de
  text: Als Marta nun hörte, dass Jesus komme[a], ging sie ihm entgegen; Maria aber saß im Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass Jesus käme«. Im Griechischen steht in der berichteten Aussage ein Präsens, wörtlicher: »Jesus kommt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet die Fortführung der Erzählung und knüpft an den vorherigen Kontext an; »nun« ist im Deutschen natürlich und wahrt die verbindende Funktion.
- source_word: ὡς
  choice: als
  rationale: Leitet hier einen temporalen Nebensatz ein. »Als« ist für ein einmaliges Geschehen in der Vergangenheit die idiomatische deutsche Entsprechung, ohne die Unmittelbarkeit durch »sobald« zu verstärken.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Gibt den Aorist von ἀκούω unmittelbar wieder; ein stärker deutendes »erfuhr« ist nicht erforderlich.
- source_word: ἔρχεται
  choice: komme
  rationale: Der Konjunktiv I bewahrt in der indirekten Rede die präsentische Perspektive des griechischen ἔρχεται und klingt zugleich in deutscher Vergangenheitsprosa natürlich. Die Vergangenheitsform »käme« ist ebenfalls möglich, würde die Zeitrelation stärker an das Erzähltempus angleichen.
- source_word: ὑπήντησεν
  choice: ging sie ihm entgegen
  rationale: 'Bewahrt die gerichtete Bedeutung von ὑπαντάω: Marta begibt sich auf den Ankommenden zu, um ihn zu treffen. Das Pronomen im Dativ entspricht αὐτῷ.'
- source_word: δὲ
  choice: aber
  rationale: Hebt den milden Kontrast zwischen Martas Handeln und Marias Verbleiben im Haus hervor.
- source_word: ἐν τῷ οἴκῳ
  choice: im Haus
  rationale: Ist eine direkte und natürliche Wiedergabe der konkreten Ortsangabe; »zu Hause« wäre idiomatisch, aber weniger eng am Substantiv οἶκος.
- source_word: ἐκαθέζετο
  choice: saß
  rationale: Das deutsche Präteritum von »sitzen« bezeichnet hier natürlich den andauernden Zustand des griechischen Imperfekts. »Blieb sitzen« würde ein Fortdauern oder einen bewussten Gegensatz stärker ausdrücken, als der Wortlaut verlangt.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Marta / Maria / Jesus
  rationale: Verwendet die im modernen deutschen Bibelgebrauch üblichen Namensformen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählführung. Der Semikolon-Satzbau erhält die Gegenüberstellung von Marta und Maria. Der Konjunktiv I »komme« bildet die indirekte Rede ab und bewahrt zugleich das Präsens des griechischen Wortlauts.
