  rationale: Die Revision beschränkt sich auf die neutrale deutsche Zukunftswiedergabe von μέλλω mit Infinitiv und bereinigt die dazugehörige Fußnote. Die Aussage über Kajaphas als Propheten, die Funktion seines Hohepriesteramtes und die offene Bedeutung von ὑπέρ bleiben unverändert erhalten.
