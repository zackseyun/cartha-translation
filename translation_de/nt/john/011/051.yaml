id: JHN.11.51
reference: John 11:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: de
  text: Das sagte er jedoch nicht von sich aus[a], sondern als Hohepriester jenes Jahres prophezeite er, dass Jesus für das Volk[b] sterben würde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus eigener Initiative.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: für die Nation; gemeint ist hier das jüdische Volk. Möglich ist auch: zugunsten des Volkes.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: sterben sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: Das ... jedoch
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise eine Fortführung; „jedoch“ fügt sich natürlich in den deutschen Satz ein, ohne den Kontrast zu überzeichnen.
- source_word: ἀφ’ ἑαυτοῦ
  choice: von sich aus
  rationale: Die idiomatische deutsche Wendung bezeichnet den Ursprung beziehungsweise die eigene Initiative der Aussage und wahrt, dass der Text nichts Genaueres über das Bewusstsein des Kajaphas sagt.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: sondern als Hohepriester jenes Jahres
  rationale: „Als“ gibt den begleitenden und möglicherweise begründenden Sinn des Partizips knapp und natürlich wieder; „jenes Jahres“ bewahrt die johanneische Hervorhebung dieses bestimmten Jahres.
- source_word: ἐπροφήτευσεν
  choice: prophezeite er
  rationale: Das Verb bezeichnet ausdrücklich prophetisches Reden und sollte nicht zu bloßer Ironie oder unbewusster Vorhersage abgeschwächt werden.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: sterben sollte
  rationale: Die deutsche Fügung gibt die bevorstehende beziehungsweise im Gang der Ereignisse vorgesehene Handlung wieder, ohne zwingend unmittelbare zeitliche Nähe oder einen technisch verstandenen Schicksalsbegriff einzutragen.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: für das Volk
  rationale: „Für“ lässt die benefaktive und repräsentative Weite von ὑπέρ bestehen. Im Kontext bezeichnet ἔθνος das jüdische Volk; „Volk“ ist im Deutschen natürlicher als „Nation“ und vermeidet moderne staatsrechtliche Nebenbedeutungen.
theological_decisions:
- issue: Der prophetische Charakter der Aussage des Kajaphas
  choice: Die Aussage wird ausdrücklich als Prophezeiung bezeichnet, die mit seinem Amt als Hohepriester verbunden ist.
  alternative: Kajaphas habe bewusst unter göttlicher Inspiration gesprochen; oder Johannes meine lediglich eine ironische, nicht wirkliche Prophezeiung.
  rationale: Der griechische Text sagt ausdrücklich ἐπροφήτευσεν, erklärt aber weder den inneren Bewusstseinszustand noch die moralische Billigung des Kajaphas.
- issue: Bedeutung von ὑπέρ beim Tod Jesu
  choice: „für das Volk“
  alternative: „zugunsten des Volkes“, „für das Volk stellvertretend“ oder „anstelle des Volkes“
  rationale: Die schlichte Wiedergabe „für“ erhält den theologischen Bedeutungsraum der Präposition, ohne in diesem Vers allein eine engere Sühneformel festzuschreiben.
- issue: Modalität von μέλλω mit Infinitiv
  choice: „sterben sollte“
  alternative: „sterben würde“, „im Begriff war zu sterben“ oder „zum Sterben bestimmt war“
  rationale: Die gewählte Form wahrt die Spannung zwischen zukünftigem Geschehen und einer übergeordneten Bestimmung, ohne eine einzelne Nuance exklusiv festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von sich aus“ und „als Hohepriester“ sind natürlich verständlich, während „prophezeite“ die ausdrückliche theologische Aussage des Ausgangstextes bewahrt. Die Zeichensetzung schließt den Einzelvers mit einem Punkt ab.
