  - severity: low
    issue: Die Alternative „zum Sterben bestimmt war“ in Fußnote c ist stärker als der Ausgangstext.
    rationale: Sie kann als mögliche interpretierende Umschreibung erscheinen, legt aber eine Bestimmung stärker fest, als μέλλω hier allein erfordert.
