  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: de
  text: Ihr bedenkt auch nicht, dass es für euch besser ist, wenn ein einziger Mensch für das Volk[a] stirbt, statt dass die ganze Nation zugrunde geht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten des Volkes“; die Wendung kann auch „anstelle des Volkes“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: auch nicht
  rationale: Führt in Verbindung mit dem vorherigen Vers einen weiteren Vorwurf an und gibt die koordinierende Verneinung im Deutschen natürlich wieder.
- source_word: λογίζεσθε
  choice: bedenkt
  rationale: Bezeichnet hier abwägendes Überlegen oder Berechnen; „bedenkt“ passt zum beratenden, machtpolitischen Kontext.
- source_word: συμφέρει ὑμῖν
  choice: es für euch besser ist
  rationale: Drückt den Vorteil für die Angesprochenen klar und idiomatisch aus, ohne das heute leicht technisch klingende „vorteilhaft“ zu benötigen.
- source_word: ἵνα
  choice: wenn
  rationale: Nach „es ist besser“ formuliert der deutsche wenn-Satz die als günstiger bewertete Möglichkeit natürlich; die Beziehung des griechischen Inhaltssatzes bleibt erhalten.
- source_word: εἷς ἄνθρωπος
  choice: ein einziger Mensch
  rationale: Bewahrt die starke Gegenüberstellung zwischen dem einen Menschen und dem ganzen Volk; „Mensch“ entspricht ἄνθρωπος, während „einziger“ den Zahlakzent ausdrückt.
- source_word: ἀποθάνῃ
  choice: stirbt
  rationale: Gibt den Aorist Konjunktiv im durch „wenn“ eingeleiteten deutschen Satz idiomatisch wieder, ohne zusätzliche Modalität einzutragen.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: für das Volk
  rationale: Das breite deutsche „für“ lässt sowohl den unmittelbaren Gedanken eines Nutzens für das Volk als auch stellvertretende beziehungsweise repräsentative Anklänge offen.
- source_word: ὅλον τὸ ἔθνος
  choice: das ganze Volk
  rationale: ἔθνος bezeichnet hier die Nation als politisch-ethnische Gesamtheit. „Das ganze Volk“ vermeidet im modernen Deutschen die mögliche Verwechslung des Staates mit der Bevölkerung und erhält zugleich die Wiederaufnahme von λαός.
- source_word: ἀπόληται
  choice: zugrunde geht
  rationale: Bezeichnet hier Untergang oder Vernichtung; „zugrunde geht“ ist gegenwärtiges, würdiges Deutsch und lässt die genaue Art des Untergangs offen.
theological_decisions:
- issue: Bedeutungsumfang von ὑπέρ im Blick auf Jesu Tod
  choice: Im Haupttext breit mit „für das Volk“ wiedergegeben
  alternative: „zugunsten des Volkes“ oder „anstelle des Volkes“
  rationale: Kaiphas spricht unmittelbar von politischer Zweckmäßigkeit, während der Evangelist seine Worte anschließend als unbeabsichtigte Prophetie deutet. Die breite Formulierung bewahrt sowohl die politische als auch die opferbezogene beziehungsweise stellvertretende Dimension, ohne eine davon im Haupttext festzuschreiben.
- issue: Verhältnis von λαός und ἔθνος
  choice: Beide hier mit „Volk“ wiedergegeben, bei ἔθνος durch „das ganze Volk“ als nationale Gesamtheit markiert
  alternative: „das Volk“ und „die ganze Nation“
  rationale: Der Kontext betrifft das jüdische Volk zugleich als Bevölkerung und nationale Einheit. Im heutigen Deutsch klingt „die ganze Nation geht zugrunde“ weniger natürlich; die Wiederholung bewahrt die rhetorische Gegenüberstellung, ohne einen theologischen Unterschied zu behaupten, den der Satz nicht ausdrücklich entfaltet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede im Plural wird beibehalten. „Ein einziger Mensch“ hebt die kalkulierte Gegenüberstellung zu „dem ganzen Volk“ hervor.
