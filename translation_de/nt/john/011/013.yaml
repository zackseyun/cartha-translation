  naturalness: Die Überarbeitung ist modernes, klares Standarddeutsch. „Sie dagegen meinten“ markiert den Kontrast natürlich; „vom Schlaf“ ist idiomatischer und verständlicher als „vom Ruhen im Schlaf“.
  terminology: „Tod“ und „Schlaf“ erhalten die im Kontext nötige Unterscheidung zwischen Jesu metaphorischer Bezugnahme auf den Tod und dem wörtlichen Verständnis der Jünger. Die Fußnote erläutert die auffällige Doppelung ohne lehrmäßige Folgerung. Der Fußnotenanker wird an die erläuterte Formulierung gesetzt.
