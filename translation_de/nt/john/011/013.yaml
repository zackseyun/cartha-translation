id: JHN.11.13
reference: John 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: de
  text: Jesus hatte jedoch von seinem Tod gesprochen. Sie dagegen meinten, er spreche vom Schlaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „vom Schlaf des Schlafes“; gemeint ist tatsächlicher Schlaf und nicht der Tod.'
    reason: Die Anmerkung erläutert die ungewöhnliche griechische Doppelung und den erzählerischen Gegensatz, ohne eine Aussage über den Zustand der Toten hineinzulesen.
lexical_decisions:
- source_word: εἰρήκει
  choice: hatte gesprochen
  rationale: Der griechische Plusquamperfekt bezeichnet eine Äußerung, die der geschilderten Fehldeutung vorausging.
- source_word: δὲ … δὲ
  choice: aber … dagegen
  rationale: Das erste δέ führt die erklärende Klarstellung leicht weiter; das zweite hebt den Gegensatz zwischen Jesu gemeinter Aussage und dem Verständnis der Jünger hervor.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: von seinem Tod
  rationale: περί mit Genitiv bedeutet hier „von/über“. Das Pronomen bezieht sich im Zusammenhang auf Lazarus.
- source_word: ἐκεῖνοι
  choice: sie
  rationale: Das Demonstrativpronomen verweist auf die bereits genannten Jünger; im natürlichen Deutschen genügt das Personalpronomen.
- source_word: ἔδοξαν
  choice: meinten
  rationale: δοκέω bezeichnet hier die irrtümliche Auffassung der Jünger.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: vom Ruhen im Schlaf
  rationale: Die Formulierung gibt den wörtlichen Schlaf als von den Jüngern angenommene Bedeutung verständlich wieder und bewahrt zugleich die auffällige Verbindung der beiden griechischen Schlafbegriffe.
- source_word: λέγει
  choice: er spreche
  rationale: Der griechische historische Präsens wird in der abhängigen Rede idiomatisch mit dem deutschen Konjunktiv I wiedergegeben.
theological_decisions:
- issue: Ob die Schlafmetapher eine Lehre über den Zustand der Toten ausdrückt
  choice: Jesu Aussage wird ausdrücklich auf Lazarus’ Tod bezogen, während die Jünger sie als gewöhnlichen Schlaf verstehen.
  alternative: Die Formulierung so ausbauen, dass sie eine bestimmte Lehre über den Zwischenzustand nahelegt.
  rationale: Der Vers erklärt eine erzählerische Fehldeutung. Er bietet keinen Anlass, eine weitergehende Lehre über den Zustand der Toten in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Ruhen im Schlaf“ ist bewusst etwas gehobener, bleibt aber gut verständlich und bildet die griechische Doppelung genauer ab als eine bloße Wiedergabe mit „Schlaf“.
