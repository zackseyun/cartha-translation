id: JHN.11.8
reference: John 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: de
  text: 'Die Jünger sagten zu ihm: „Rabbi, eben noch wollten die Juden[a] dich steinigen, und nun gehst du wieder dorthin?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“; dem Zusammenhang nach möglicherweise die jüdischen Gegner oder führenden Kreise. Johannes bezeichnet mit „die Juden“ häufig Jesu Gegner in Judäa, nicht das jüdische Volk als Ganzes.'
    reason: Alternative Bedeutung und mögliche kontextuelle Eingrenzung von οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: λέγουσιν
  choice: sagten
  rationale: Das historische Präsens des griechischen Erzählstils wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Der griechische Text bewahrt die semitische Anrede als Lehnwort; „Rabbi“ erhält diese Anrede und den johanneischen Stil.
- source_word: νῦν
  choice: eben noch
  rationale: Hier bezeichnet νῦν die erst kurze Zeit zurückliegende Bedrohung; „eben noch“ gibt diese zeitliche Nähe idiomatisch wieder.
- source_word: ἐζήτουν
  choice: wollten
  rationale: Das Imperfekt bezeichnet ein fortdauerndes beziehungsweise versuchtes Vorhaben. Im Deutschen drückt „wollten … steinigen“ dieses versuchte Handeln natürlich aus, ohne zu behaupten, dass die Steinigung ausgeführt wurde.
- source_word: λιθάσαι
  choice: steinigen
  rationale: Dies ist die direkte deutsche Entsprechung; „zu Tode“ wird nicht ergänzt, weil es im griechischen Text nicht ausdrücklich steht.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: „Die Juden“ ist die direkte lexikalische Wiedergabe. Da der Ausdruck bei Johannes je nach Zusammenhang enger die Judäer oder jüdische Gegner beziehungsweise führende Kreise bezeichnen kann, wird diese mögliche Eingrenzung in einer Fußnote offengehalten.
- source_word: πάλιν
  choice: wieder
  rationale: „Wieder“ gibt die erneute Bewegung an denselben Ort knapp und natürlich wieder.
- source_word: ὑπάγεις
  choice: gehst du
  rationale: Mit dem Ortsadverb ἐκεῖ bezeichnet das Verb hier das Gehen an den zuvor genannten Ort; „gehst du“ ist die klare deutsche Entsprechung.
- source_word: ἐκεῖ
  choice: dorthin
  rationale: „Dorthin“ verweist idiomatisch auf den bereits genannten gefährlichen Ort in Judäa.
theological_decisions:
- issue: Bezugsgruppe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: 'die Judäer; kontextuell: die jüdischen Gegner oder führenden Kreise'
  rationale: Der Haupttext bewahrt die lexikalisch naheliegende und traditionell erkennbare Wiedergabe, ohne den Bezug eigenmächtig auf Amtsträger zu beschränken. Die Fußnote macht zugleich deutlich, dass Johannes damit in solchen Zusammenhängen nicht notwendig das jüdische Volk insgesamt bezeichnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und die eindringliche Gegenüberstellung „eben noch … und nun … wieder“ werden natürlich wiedergegeben; der Titel „Rabbi“ bleibt erhalten.
