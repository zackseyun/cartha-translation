id: JHN.11.15
reference: John 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: de
  text: Und euretwegen freue ich mich, dass ich nicht dort war, damit ihr glaubt.[a] Doch lasst uns zu ihm gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ihr zum Glauben kommt“. Der griechische Aorist kann den Eintritt in den Glauben hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: freue ich mich
  rationale: Das Präsens bezeichnet Jesu gegenwärtige Freude; die reflexive deutsche Wendung ist natürlich und wahrt den positiven Affekt.
- source_word: δι’ ὑμᾶς
  choice: euretwegen
  rationale: διά mit Akkusativ bezeichnet hier den Bezug auf den Nutzen der Jünger. „Euretwegen“ ist knapp und idiomatisch, ohne die Jünger als bloße Ursache der Freude darzustellen.
- source_word: ἵνα πιστεύσητε
  choice: damit ihr glaubt
  rationale: ἵνα mit Aorist Konjunktiv drückt den Zweck aus. „glaubt“ bewahrt die im Johannesevangelium zentrale, zugleich aber hinsichtlich eines möglichen Eintritts in den Glauben offene Formulierung.
- source_word: ὅτι
  choice: dass
  rationale: 'ὅτι leitet hier am natürlichsten den Inhalt der Freude ein: dass Jesus nicht dort war.'
- source_word: οὐκ ἤμην ἐκεῖ
  choice: ich nicht dort war
  rationale: Direkte und natürliche Wiedergabe des Imperfekts von εἰμί mit ἐκεῖ.
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Kontrast und den Übergang von der Erklärung zum Aufbruch; „Doch“ klingt in diesem Zusammenhang würdevoll und natürlich.
- source_word: ἄγωμεν
  choice: lasst uns gehen
  rationale: Der Konjunktiv der ersten Person Plural ist hortativ und wird im Deutschen idiomatisch mit „lasst uns“ wiedergegeben.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu; „zu ihm“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bedeutungsumfang von πιστεύσητε im johanneischen Zusammenhang
  choice: damit ihr glaubt
  alternative: damit ihr zum Glauben kommt
  rationale: Der Aorist Konjunktiv kann einen Eintritt in den Glauben hervorheben, verlangt aber nicht die Aussage, die Jünger seien zuvor völlig ungläubig gewesen. Die Hauptfassung erhält diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die leichte Voranstellung „Und euretwegen“ bewahrt die Abfolge und Betonung des griechischen Satzes. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Wendung.
