    issue: Die Fußnote bezeichnet „Lazarus“ als Teil einer wörtlichen Wiedergabe.
    rationale: Der griechische Text lautet ὅτι ἀσθενεῖ („dass er krank ist“); der Name steht in diesem Vers nicht. Er kann im deutschen Haupttext kontextbedingt zur eindeutigen Bezugnahme stehen, darf aber nicht in der wörtlichen Fußnotenwiedergabe erscheinen.
  - severity: low
    issue: „noch zwei Tage“ trägt eine nicht ausdrücklich markierte Zusatznuance.
    rationale: Das Akkusativobjekt δύο ἡμέρας bezeichnet die Dauer von zwei Tagen. „Noch“ kann im Deutschen speziell „weitere zwei Tage“ nahelegen; diese Zusatzbedeutung ist im griechischen Wortlaut nicht explizit.
