base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: de
  text: Als er nun hörte, dass Lazarus krank war,[a] blieb er zwei Tage an dem Ort, an dem er sich aufhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass er krank ist“. Im Griechischen steht nach „hörte“ das Präsens; im Deutschen ist hier gewöhnlich die Vergangenheitsform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Als er nun
  rationale: „Als“ gibt den zeitlichen Sinn von ὡς wieder; „nun“ bewahrt die fortführende und folgernde Funktion von οὖν im Erzählgang.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Die gewöhnliche Bedeutung von ἀκούω passt hier und vermeidet die zusätzliche Deutung „erfuhr“ oder „ihm wurde berichtet“.
- source_word: ὅτι ἀσθενεῖ
  choice: dass Lazarus krank war
  rationale: ἀσθενέω bezeichnet im Zusammenhang eine körperliche Erkrankung. Der Name verdeutlicht im Deutschen das Subjekt, das im griechischen Kontext erschlossen wird; die Vergangenheitsform folgt natürlicher deutscher Zeitenfolge. Die griechische Präsensform wird in der Fußnote ausgewiesen.
- source_word: τότε μὲν ἔμεινεν
  choice: blieb er noch
  rationale: „blieb“ gibt μένω ortsbezogen natürlich wieder. „noch“ macht die in μέν liegende, auf den weiteren Fortgang vorausweisende Spannung idiomatisch deutlich, ohne sie mit „zwar“ künstlich zu überzeichnen.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: an dem Ort, an dem er sich aufhielt
  rationale: Die Formulierung bewahrt die ausdrückliche Ortsangabe und gibt ἦν kontextgemäß als Aufenthalt wieder, ohne einen konkreten Ort hinzuzufügen.
- source_word: δύο ἡμέρας
  choice: zwei Tage
  rationale: Direkte und eindeutige Zeitdauer.
theological_decisions:
- issue: Die erzählerische Spannung, dass Jesus nach der Nachricht von Lazarus’ Krankheit bleibt
  choice: Das zweitägige Bleiben wird ohne Rechtfertigung oder Abschwächung wiedergegeben.
  alternative: Den Aufenthalt als ausdrücklich mitfühlenden oder strategischen Aufschub erklären.
  rationale: Der griechische Text stellt die Nachricht und das anschließende Bleiben unmittelbar nebeneinander. Die Übersetzung bewahrt diese theologische und erzählerische Spannung, statt sie aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist natürlich erzählend; die ausdrückliche Ortsangabe des griechischen Textes bleibt erhalten. „Lazarus“ verhindert die im Deutschen mögliche falsche Zuordnung des Pronomens.
