  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: de
  text: 'Doch auch jetzt[a] weiß ich: Was immer du von Gott erbittest[b], wird Gott dir geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und auch jetzt“. Das griechische Bindewort kann schlicht „und“ bedeuten; im Zusammenhang ist jedoch auch eine kontrastierende Wendung zu Marthas vorheriger Aussage zu hören.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „was immer du Gott bittest“. Im heutigen Deutschen wird dieser Gedanke natürlicher mit „von Gott erbitten“ oder „Gott um etwas bitten“ ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Doch auch jetzt
  rationale: καί kann schlicht anschließen, erhält hier nach Marthas Aussage über den Tod des Lazarus aber zugleich eine kontrastierende beziehungsweise einräumende Funktion. „Doch auch jetzt“ bewahrt sowohl diese Wendung als auch den Zeitbezug von νῦν.
- source_word: οἶδα
  choice: weiß ich
  rationale: οἶδα ist eine Perfektform mit präsentischer Bedeutung und wird im Deutschen natürlich mit „wissen“ wiedergegeben.
- source_word: ὅσα ἂν
  choice: was immer
  rationale: Die Verbindung des Relativpronomens mit ἄν bezeichnet eine unbestimmte, offene Gesamtheit. „Was immer“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: αἰτήσῃ τὸν θεόν
  choice: du von Gott erbittest
  rationale: Im Griechischen steht Gott als direktes Objekt von αἰτέω. Im modernen Deutschen ist „etwas von Gott erbitten“ natürlich und bewahrt sowohl die Bitte als auch deren offene Sache.
- source_word: δώσει σοι ὁ θεός
  choice: wird Gott dir geben
  rationale: Die einfache Zukunftsform und das ausdrücklich genannte Subjekt werden direkt wiedergegeben. „Geben“ entspricht δίδωμι näher als das stärker deutende „gewähren“.
theological_decisions:
- issue: Marthas Aussage über Jesu Bitte an Gott und Gottes Geben könnte als abschließende dogmatische Aussage über Jesu Wesen gelesen werden.
  choice: 'Marthas Worte bleiben ohne dogmatische Erweiterung stehen: Jesus bittet Gott, und Gott wird ihm geben.'
  alternative: „Gott“ erläuternd durch „der Vater“ ersetzen oder die Bitte so umformulieren, dass jede mögliche Unterordnungssprache vermieden wird.
  rationale: Der Vers gibt Marthas Rede wieder und lässt die johanneische erzählerische und theologische Spannung bestehen. Weder eine antitrinitarische Folgerung noch eine harmonisierende Erweiterung darf in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht den Inhalt von Marthas Wissen klar, ohne ein zusätzliches Bedeutungelement einzuführen. Die Wiederholung von „Gott“ folgt der ausdrücklichen Wiederholung im griechischen Text.
