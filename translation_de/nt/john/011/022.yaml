  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: καὶ νῦν als kontrastiv-weiterführendes „Doch auch jetzt“, οἶδα präsentisch als „weiß ich“, die indefinite Relativkonstruktion ὅσα ἂν als „Was immer“, und die Zukunft δώσει als „wird ... geben“. Die notwendige deutsche Umformung von αἰτεῖν mit Gott als direktem Objekt zu „von Gott erbitten“ wahrt den gemeinten Sachverhalt, ohne einen konkreten erbetenen Gegenstand hinzuzufügen.'
  naturalness: '„Doch auch jetzt weiß ich: Was immer du von Gott erbittest, wird Gott dir geben“ ist idiomatisches, würdiges modernes Standarddeutsch. Der vorangestellte Relativausdruck funktioniert zugleich als Objekt zu „geben“; die Wiederholung von „Gott“ ist klar und entspricht dem griechischen Nachdruck.'
  terminology: „Gott“ und „geben“ sind sachgerecht und theologisch nicht überformt. Der Text macht aus θεός nicht erläuternd „der Vater“ und zieht aus Marthas Aussage keine dogmatische Folgerung.
