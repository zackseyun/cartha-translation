  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: de
  text: Von diesem Tag an planten sie also, ihn zu töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: Von diesem Tag an
  rationale: Die Wendung bezeichnet diesen Tag als Ausgangspunkt einer fortdauernden Entwicklung. „Von diesem Tag an“ gibt diesen zeitlichen Sinn im modernen Deutsch natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp die Folgerung beziehungsweise erzählerische Konsequenz aus der vorangehenden Beratung des Hohen Rates.
- source_word: ἐβουλεύσαντο
  choice: planten sie
  rationale: Das Verb bezeichnet hier eine Beratung, die in einen konkreten Plan mündet. „planten“ bewahrt den zielgerichteten, konspirativen Sinn, ohne eine bloße Erwägung oder ein förmliches Rechtsurteil daraus zu machen.
- source_word: ἵνα ἀποκτείνωσιν
  choice: ihn zu töten
  rationale: Der Infinitiv gibt den durch ἵνα ausgedrückten Inhalt beziehungsweise Zweck nach „planen“ idiomatisch wieder. „töten“ entspricht dem unverhüllten Sinn von ἀποκτείνω, ohne einen gerichtlichen Vollzug zu unterstellen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang auf Jesus; die Wiedergabe als Pronomen folgt dem griechischen Text.
theological_decisions:
- issue: Art der Absicht der führenden Männer gegenüber Jesus
  choice: Die Aussage wird als konkreter Plan wiedergegeben, Jesus zu töten.
  alternative: Sie erwogen lediglich, ihn zu töten, oder berieten nur darüber.
  rationale: Der griechische Text beschreibt nach der vorangehenden Beratung einen entschiedenen Übergang zu einem zielgerichteten Tötungsplan. Die Übersetzung schwächt diesen Ernst nicht ab, deutet ihn aber auch nicht ausdrücklich als gerichtliche Hinrichtung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der knappe Satzbau folgt der erzählerischen Zuspitzung des griechischen Textes.
