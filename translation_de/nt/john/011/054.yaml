id: JHN.11.54
reference: John 11:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: de
  text: Darum bewegte sich Jesus nicht mehr öffentlich unter den Juden[a], sondern zog von dort weg in die Gegend nahe der Wüste, in eine Stadt namens Ephraim. Dort blieb er mit den Jüngern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Judäern“. Im Johannesevangelium kann „die Juden“ je nach Zusammenhang auch genauer die Menschen in Judäa oder die judäischen Autoritäten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Darum
  rationale: Kennzeichnet die erzählerische Folge aus dem unmittelbar zuvor geschilderten Beschluss gegen Jesus und gibt den Folgerungszusammenhang in natürlichem Deutsch wieder.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: 'Gibt die zeitliche Verneinung wieder: Jesus beendet eine bisherige Art öffentlichen Auftretens.'
- source_word: παρρησίᾳ περιεπάτει
  choice: bewegte sich ... öffentlich
  rationale: παρρησίᾳ bezeichnet hier öffentliches, unverdecktes Auftreten; περιπατέω meint im erzählerischen Zusammenhang das Umhergehen beziehungsweise Sichbewegen. Die Verbindung klingt im Deutschen natürlicher als das wörtliche „ging öffentlich umher“.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: unter den Juden
  rationale: Bewahrt die übliche Wiedergabe des kontextabhängigen johanneischen Ausdrucks. Da auch eine regionale Bedeutung („Judäer“) möglich ist, wird diese in einer Fußnote genannt.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: zog von dort weg
  rationale: Gibt die erzählerische Ortsveränderung klar und idiomatisch wieder; „zog“ passt zu einer Reisebewegung, ohne eine endgültige Abreise anzudeuten.
- source_word: τὴν χώραν ἐγγὺς τῆς ἐρήμου
  choice: die Gegend nahe der Wüste
  rationale: χώρα bezeichnet hier ein Gebiet oder eine Gegend, nicht einen modernen Staat; ἔρημος meint eine unbewohnte oder dünn besiedelte Wildnis beziehungsweise Wüstengegend.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: in eine Stadt namens Ephraim
  rationale: πόλις wird direkt mit „Stadt“ wiedergegeben; „namens“ ist eine knappe und natürliche Entsprechung für λεγομένην.
- source_word: κἀκεῖ ἔμεινεν
  choice: Dort blieb er
  rationale: Im Reisekontext bedeutet μένω, sich für eine Zeit an einem Ort aufzuhalten; „blieb“ bewahrt zugleich die Grundbedeutung des Verbs.
- source_word: μετὰ τῶν μαθητῶν
  choice: mit den Jüngern
  rationale: Folgt dem griechischen bestimmten Artikel, ohne das im Ausgangstext nicht ausdrücklich vorhandene Possessivpronomen „seinen“ einzufügen.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαῖοι im Johannesevangelium
  choice: unter den Juden
  alternative: unter den Judäern
  rationale: Der Ausdruck kann je nach Zusammenhang ethnisch, regional oder auf führende jüdische Kreise bezogen sein. Der Haupttext bewahrt die geläufige Wiedergabe, während die Fußnote die plausible regionale Nuance offenhält und eine pauschale Aussage über alle Juden vermeiden hilft.
translation_notes:
  register: Modernes, allgemein verständliches und würdevolles Standarddeutsch. Die Formulierung „bewegte sich ... öffentlich“ vermittelt die öffentliche Bewegungs- und Wirkungssphäre Jesu, ohne παρρησίᾳ als innere Kühnheit umzudeuten. Der griechische Satz wurde zur besseren deutschen Lesbarkeit vor „Dort blieb er“ geteilt.
