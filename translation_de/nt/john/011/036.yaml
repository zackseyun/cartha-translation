id: JHN.11.36
reference: John 11:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: de
  text: 'Da sagten die Juden[a]: »Seht, wie lieb er ihn hatte!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Judäer«, wenn die Bezeichnung hier regional enger auf die anwesenden jüdischen Beobachter bezogen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das griechische Imperfekt kann andauerndes oder wiederholtes Reden anzeigen. Im Deutschen ist hier das einfache Präteritum idiomatischer; »sagten immer wieder« würde eine Wiederholung stärker festlegen, als der Kontext verlangt.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Reaktion auf Jesu Weinen im vorhergehenden Vers und gibt den erzählerisch-folgernden Zusammenhang in natürlichem Deutsch wieder.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Bewahrt die übliche Bedeutung der johanneischen Bezeichnung. Im unmittelbaren Zusammenhang sind die anwesenden jüdischen Trauergäste beziehungsweise Beobachter gemeint; eine Fußnote nennt die regional engere Wiedergabe.
- source_word: Ἴδε
  choice: Seht
  rationale: Der Aufmerksamkeitsimperativ steht im Plural und richtet sich an die Umstehenden. »Seht« ist würdig und im Zusammenhang natürlich.
- source_word: πῶς
  choice: wie
  rationale: Bewahrt die mögliche Nuance von Art und Ausmaß der Zuneigung, ohne sie auf »wie sehr« festzulegen.
- source_word: ἐφίλει
  choice: lieb er ihn hatte
  rationale: Gibt die persönliche Zuneigung von φιλέω idiomatisch wieder. Die Konstruktion mit »hatte« passt natürlich zum rückblickenden Ausruf über Jesu sichtbares Weinen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen bezieht sich im Kontext auf Lazarus.
theological_decisions:
- issue: Wiedergabe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer
  rationale: Der Haupttext bleibt nahe an der griechischen Bezeichnung, während die Fußnote die mögliche regional spezifischere Deutung nennt. Der Kontext bezieht die Aussage auf die dort anwesenden jüdischen Beobachter und nicht pauschal auf alle Juden.
- issue: Nuance von φιλέω
  choice: lieb er ihn hatte
  alternative: er ihn liebte
  rationale: Beide Wiedergaben bezeichnen echte persönliche Zuneigung. »Lieb haben« klingt in diesem Ausruf natürlich und trägt keine künstliche theologische Abgrenzung gegenüber ἀγαπάω ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede ist knapp und emotional; die historische Sensibilität der Bezeichnung »die Juden« wird durch die Fußnote berücksichtigt.
