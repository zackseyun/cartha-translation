  source_fidelity: 'Der Sinn und die Satzglieder des griechischen Textes sind im Wesentlichen korrekt wiedergegeben. Eine Korrektur ist bei „erhörst“ ratsam: ἀκούω mit Genitiv bedeutet hier zunächst „hören“ im Sinn eines zugewandten Hörens; „erhören“ kann im heutigen Deutsch stärker das Gewähren einer Bitte implizieren. Das Partizip περιεστῶτα beschreibt die gegenwärtig um Jesus versammelte Menge und wird mit „umherstehend“ idiomatischer wiedergegeben.'
  naturalness: Die Revision bleibt modernes, würdiges Standarddeutsch. „die umherstehende Menge“ klingt flüssiger als „die ringsum steht“, und „du mich immer hörst“ ist im Gebetskontext natürlich, ohne die Bedeutung durch „erhören“ einzuengen.
  terminology: „gesandt hast“ bewahrt die johanneische Sendungsterminologie. Das ausdrücklich gesetzte σύ wird nicht überinterpretiert; die Fußnote weist angemessen auf seine Hervorhebung hin. Der englische Audit-Trail hat offenbar vertauschte Fußnotenanker (a/b); die deutschen Anker sind dagegen sachlich richtig zugeordnet und werden beibehalten.
  issues:
  - severity: medium
    issue: „erhörst“ ist gegenüber ἀκούεις potenziell zu spezifisch.
    rationale: Im Deutschen bezeichnet „erhören“ oft nicht nur das Hören einer Bitte, sondern auch deren Gewährung. Der griechische Wortlaut sagt, dass der Vater Jesus stets hört; die unmittelbar folgende Danksagung im Kontext kann zwar die Erhörung nahelegen, sollte aber nicht in dieses Verb hineingetragen werden.
  - severity: low
    issue: „die ringsum steht“ ist stilistisch weniger idiomatisch.
    rationale: Die Formulierung ist verständlich, doch das attributive Partizip „die umherstehende Menge“ bildet τὸν ὄχλον τὸν περιεστῶτα im modernen Deutsch natürlicher nach.
  - severity: low
    issue: Die englischen Audit-Fußnoten a und b sind inhaltlich gegenüber ihren Ankern vertauscht.
    rationale: Englisch [a] steht nach „hear me“, erläutert aber die Menge; Englisch [b] steht nach „standing around“, erläutert aber σύ. Dies betrifft nicht die deutschen Anker, die korrekt bei Menge bzw. „du“ stehen.
  revised_text: Ich aber wusste, dass du mich immer hörst. Doch wegen der umherstehenden Menge[a] habe ich es gesagt, damit sie glauben, dass du[b] mich gesandt hast.
