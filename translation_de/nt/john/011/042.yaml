source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: de
  text: Ich aber wusste, dass du mich immer hörst. Doch wegen der umherstehenden Menge[a] habe ich es gesagt, damit sie glauben, dass du[b] mich gesandt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um der Menge willen, die umhersteht“.'
    reason: διά mit Akkusativ bezeichnet den Anlass beziehungsweise Grund; im Zusammenhang kann auch die Ausrichtung auf die Menge anklingen.
  - marker: b
    text: 'Im Griechischen steht das Pronomen ausdrücklich und hervorgehoben: „dass du mich gesandt hast“.'
    reason: Das ausdrücklich gesetzte σύ hebt den Vater als den Sendenden hervor; diese Hervorhebung ist im deutschen Fließtext nur begrenzt sichtbar.
lexical_decisions:
- source_word: ἐγὼ δὲ ᾔδειν
  choice: Ich aber wusste
  rationale: ᾔδειν ist die als Vergangenheit gebrauchte Form von οἶδα. „Ich wusste“ ist im Deutschen natürlich; das ausdrücklich gesetzte ἐγώ und δέ werden durch „Ich aber“ wiedergegeben.
- source_word: πάντοτέ μου ἀκούεις
  choice: dass du mich immer erhörst
  rationale: ἀκούω mit Genitiv bezeichnet hier im Gebetszusammenhang nicht bloß akustisches Hören, sondern das Hören einer Bitte. „Erhören“ gibt diesen Sinn im Deutschen knapp und idiomatisch wieder, ohne eine bestimmte sichtbare Antwort zu behaupten.
- source_word: διὰ τὸν ὄχλον τὸν περιεστῶτα
  choice: wegen der Menge, die ringsum steht
  rationale: διά mit Akkusativ bezeichnet den Grund beziehungsweise Anlass; „wegen“ wahrt diese Grundbedeutung. Das Perfektpartizip περιεστῶτα beschreibt die Menge in ihrem gegenwärtigen Zustand rings um Jesus.
- source_word: εἶπον
  choice: habe ich es gesagt
  rationale: Das ergänzte „es“ verweist natürlich auf die unmittelbar zuvor ausgesprochene Äußerung. Das deutsche Perfekt passt zu einer gerade vollzogenen Handlung in direkter Rede.
- source_word: ἵνα πιστεύσωσιν
  choice: damit sie glauben
  rationale: Die Konstruktion ἵνα mit Konjunktiv drückt hier den Zweck der öffentlichen Äußerung aus.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: dass du mich gesandt hast
  rationale: Das explizite σύ hebt den Vater als den Sendenden hervor; der Fußnotenhinweis bewahrt diese im Deutschen nur durch Betonung vollständig hörbare Hervorhebung. Das Perfekt „gesandt hast“ bezeichnet die vergangene Sendung mit ihrer fortdauernden Bedeutung.
theological_decisions:
- issue: Das Hören des Vaters
  choice: „du mich immer erhörst“ stellt das beständige Hören Jesu durch den Vater fest
  alternative: „du mich immer hörst“ könnte näher an der Grundbedeutung bleiben, aber im Deutschen auch bloß akustisches Wahrnehmen bezeichnen
  rationale: Der unmittelbare Gebetszusammenhang stützt „erhören“. Die Übersetzung formuliert dabei nicht näher aus, wie dieses Erhören mit der einzigartigen Beziehung zwischen Vater und Sohn zusammenhängt.
- issue: Zweck der öffentlich gesprochenen Worte
  choice: Die umstehende Menge soll glauben, dass der Vater Jesus gesandt hat
  alternative: Die Aussage könnte enger nur als Bestätigung dieses einzelnen Wunders verstanden werden
  rationale: Der ausdrückliche ἵνα-Satz nennt den Glauben an Jesu Sendung als Zweck. Die Übersetzung bewahrt diese Aussage, ohne den Umfang seiner Sendung über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ringsum steht“ ist anschaulich und gegenwärtig; „habe ich es gesagt“ klingt in Jesu direkter Rede natürlich. Die Satzstruktur bleibt dem griechischen Gedankengang eng verbunden, ohne unnatürlich zu wirken.
