revisions:
- from: Ich aber wusste, dass du mich immer erhörst. Doch wegen der Menge, die ringsum steht,[a] habe ich es gesagt, damit sie glauben, dass du[b] mich gesandt hast.
  to: Ich aber wusste, dass du mich immer hörst. Doch wegen der umherstehenden Menge[a] habe ich es gesagt, damit sie glauben, dass du[b] mich gesandt hast.
  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: „hörst“ bildet ἀκούεις ohne die mögliche Zusatzbedeutung von „erhören“ ab, und „umherstehende Menge“ ist eine natürlichere Wiedergabe des Partizips περιεστῶτα. Satzstruktur, Zweckangabe und Sendungsaussage bleiben unverändert. Die Fußnotenanker bleiben am jeweils zutreffenden deutschen Bezugsausdruck.'
