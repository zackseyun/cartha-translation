  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: de
  text: 'Jesus sagt zu ihr: »Dein Bruder wird auferstehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das griechische historische Präsens wird beibehalten; es ist auch im deutschen Erzählstil verständlich und erhält die Lebendigkeit der johanneischen Darstellung.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der Dativ wird nach »sagt« idiomatisch und ausdrücklich als indirektes Objekt wiedergegeben.
- source_word: Ἀναστήσεται
  choice: wird auferstehen
  rationale: Das Futur von ἀνίστημι bezeichnet im Zusammenhang mit Lazarus das Aufstehen von den Toten. »Auferstehen« drückt dies im Deutschen klar aus, ohne durch ein Passiv göttliches Handeln stärker hervorzuheben, als es die griechische Form selbst tut.
- source_word: ὁ ἀδελφός σου
  choice: dein Bruder
  rationale: Natürliche deutsche Wiedergabe der Nominalphrase mit Possessivpronomen; gemeint ist Marthas Bruder Lazarus.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben; der griechische Artikel wird bei einem Eigennamen im Deutschen nicht eigens abgebildet.
theological_decisions:
- issue: Auferstehungsformulierung
  choice: wird auferstehen
  alternative: wird aufstehen; wird auferweckt werden
  rationale: Die Aussage lässt hier offen, ob Jesus unmittelbar Lazarus’ Wiederbelebung oder die künftige Auferstehung meint. »Auferstehen« bewahrt diesen zeitlichen Deutungsspielraum und vermeidet es, durch das Passiv eine handelnde Instanz ausdrücklich einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens bleibt erhalten. Keine Fußnote ist nötig, weil »auferstehen« im Deutschen den kontextuellen Sinn von ἀνίστημι präzise und idiomatisch ausdrückt, ohne ein dem griechischen Verb nicht entsprechendes »wieder« ergänzen zu müssen.
