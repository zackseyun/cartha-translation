id: JHN.11.37
reference: John 11:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: de
  text: 'Einige von ihnen aber sagten: »Hätte dieser Mann, der dem Blinden die Augen geöffnet hat, nicht auch verhindern können, dass dieser hier stirbt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Einige von ihnen aber
  rationale: τινές mit ἐξ αὐτῶν bezeichnet einen Teil der Anwesenden; das nachgestellte „aber“ gibt den Kontrast von δέ in natürlichem, gehobenem Deutsch wieder.
- source_word: εἶπαν
  choice: sagten
  rationale: Der Aorist bezeichnet im Erzählzusammenhang eine abgeschlossene Äußerung und wird schlicht im Präteritum wiedergegeben.
- source_word: Οὐκ ἐδύνατο
  choice: Hätte ... nicht ... können
  rationale: Die rhetorische Frage blickt auf eine in der Vergangenheit nicht verwirklichte Möglichkeit zurück. Der deutsche Konjunktiv II wahrt sowohl die Fähigkeitsfrage als auch den vorwurfsvollen Unterton.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: dieser Mann, der dem Blinden die Augen geöffnet hat
  rationale: „Dieser Mann“ bewahrt den pointierten Demonstrativbezug auf Jesus. Die Relativkonstruktion gibt das substantivierte Partizip natürlich wieder; „dem Blinden die Augen öffnen“ entspricht idiomatischem Deutsch.
- source_word: ποιῆσαι ἵνα ... μὴ ἀποθάνῃ
  choice: verhindern ..., dass ... stirbt
  rationale: Die Konstruktion beschreibt hier das Herbeiführen des Nichtsterbens. „Verhindern, dass“ ist eine natürliche und präzise deutsche Wiedergabe, ohne eine zusätzliche Handlung zu spezifizieren.
- source_word: καὶ
  choice: auch
  rationale: καί zieht den Schluss vom früheren Zeichen auf die ebenfalls erwartete Möglichkeit, den Tod des Lazarus zu verhindern.
- source_word: οὗτος
  choice: dieser hier
  rationale: Der zweite Demonstrativ verweist auf Lazarus. „Dieser hier“ erhält den deiktischen Nachdruck und unterscheidet ihn klar von Jesus.
theological_decisions:
- issue: Ton der rhetorischen Frage
  choice: Als skeptisch-vorwurfsvolle Frage nach Jesu nicht genutzter Fähigkeit wiedergegeben
  alternative: Als neutrale Frage nach seiner Fähigkeit wiedergeben
  rationale: Die mit οὐκ gebildete Frage legt die Erwartung einer bejahenden Antwort nahe. Die Übersetzung erhält die darin liegende Spannung, ohne den Sprechern ausdrücklich Motive zuzuschreiben.
- issue: Verhältnis von Heilungsvermögen und Tod des Lazarus
  choice: 'Die Folgerung der Sprecher wird stehen gelassen: Wer den Blinden heilte, hätte nach ihrer Auffassung auch Lazarus vor dem Tod bewahren können'
  alternative: Die Aussage durch eine Erklärung von Jesu Absicht oder zeitlicher Abwesenheit auflösen
  rationale: Der Vers selbst erklärt weder Jesu Absicht noch die Ursache seines Nicht-Eingreifens; diese theologische Spannung soll nicht in der Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich plausibel; der Konjunktiv II bildet die rückblickende rhetorische Kritik natürlich ab. Keine Fußnote ist nötig, da die idiomatische Fassung „verhindern, dass“ den Sinn der griechischen Konstruktion ohne wesentlichen Bedeutungsverlust erfasst.
