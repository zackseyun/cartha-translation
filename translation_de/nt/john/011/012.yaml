id: JHN.11.12
reference: John 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: de
  text: 'Da sagten die Jünger zu ihm: »Herr, wenn er eingeschlafen ist[a], wird er wieder gesund werden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann gewöhnlichen Schlaf bezeichnen und auch verhüllend für den Tod gebraucht werden. Jesus hatte vom Tod des Lazarus als Schlaf gesprochen; die Jünger verstehen seine Worte hier als gewöhnlichen Schlaf.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: »wird gerettet werden«. Im Zusammenhang mit der Krankheit bedeutet das Verb hier: »wird genesen« oder »wieder gesund werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die Folgerung der Jünger aus Jesu vorheriger Aussage und stellt den erzählerischen Zusammenhang in natürlichem Deutsch her.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: Gibt den bestimmten griechischen Ausdruck ohne den nicht ausdrücklich vorhandenen Zusatz »seine« wieder.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Bewahrt das Pronomen des Ausgangstextes; der Bezug auf Jesus ist aus dem Zusammenhang eindeutig.
- source_word: Κύριε
  choice: Herr
  rationale: Entspricht der üblichen Bedeutung der direkten Anrede und bewahrt sowohl den respektvollen als auch den im Johannesevangelium möglichen christologischen Klang.
- source_word: εἰ
  choice: wenn
  rationale: Leitet eine reale Bedingung ein und klingt in der geäußerten Schlussfolgerung der Jünger natürlicher als »falls«.
- source_word: κεκοίμηται
  choice: eingeschlafen ist
  rationale: Gibt den resultativen Zustand des griechischen Perfekts wieder. Die Formulierung kann im Deutschen wie im Griechischen gewöhnlichen Schlaf oder verhüllend den Tod bezeichnen; hier verstehen die Jünger sie im Sinn gewöhnlichen Schlafs.
- source_word: σωθήσεται
  choice: wird wieder gesund werden
  rationale: σῴζω kann in einem Krankheitszusammenhang Genesung bedeuten. Diese Wiedergabe drückt die von den Jüngern erwartete gesundheitliche Erholung idiomatisch aus, ohne an dieser Stelle eine heilsgeschichtliche Bedeutung aufzuzwingen.
theological_decisions:
- issue: Anrede κύριε an Jesus
  choice: Herr
  alternative: Meister; mein Herr
  rationale: »Herr« bewahrt die respektvolle direkte Anrede und lässt zugleich die christologische Tiefendimension des Johannesevangeliums offen, ohne sie in diesem Satz ausdrücklich festzulegen.
- issue: Doppelsinn von κεκοίμηται als Schlaf oder Tod
  choice: eingeschlafen ist
  alternative: schläft; sich schlafen gelegt hat
  rationale: Die gewählte Formulierung erhält den möglichen Doppelsinn. Im unmittelbaren Gespräch verstehen die Jünger Jesu bildliche Rede vom Tod als Hinweis auf gewöhnlichen Schlaf.
- issue: Bedeutungsumfang von σωθήσεται
  choice: wird wieder gesund werden
  alternative: wird gerettet werden
  rationale: Im Zusammenhang mit Krankheit bezeichnet das Verb hier nach dem Verständnis der Jünger die Genesung. Eine Fußnote bewahrt die breitere lexikalische Möglichkeit »gerettet werden«.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bleibt nah am griechischen Text, ohne unnatürlich zu wirken; die Mehrdeutigkeit der Schlafmetapher wird im Haupttext und in der Fußnote bewahrt.
