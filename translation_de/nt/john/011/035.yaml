    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: weinte
  rationale: Aorist Aktiv Indikativ, 3. Person Singular von δακρύω. „Weinte“ ist im modernen Deutschen die natürliche, knappe Wiedergabe. Das Verb bezeichnet hier das Vergießen von Tränen; eine Übersetzung mit „begann zu weinen“ würde einen nicht zwingend ausgedrückten Beginn hervorheben.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der artikulierte Eigenname steht als Subjekt. Im Deutschen wird der Artikel vor dem Namen hier natürlicherweise nicht wiedergegeben.
theological_decisions:
- issue: Die emotionale Reaktion Jesu
  choice: Jesus weinte.
  alternative: Jesus vergoss Tränen.
  rationale: Die schlichte Aussage bewahrt die echte menschliche Gefühlsäußerung Jesu, ohne sie abzuschwächen oder zu einer lauten Totenklage zu verstärken. Die lexikalisch genauere Umschreibung bleibt in der Fußnote erhalten.
translation_notes:
  register: Sehr knapper, würdevoller Erzählsatz in modernem Standarddeutsch. Die geläufige Formulierung „Jesus weinte“ wahrt die Prägnanz des griechischen Textes; die Fußnote erläutert dessen spezifischere lexikalische Färbung.
