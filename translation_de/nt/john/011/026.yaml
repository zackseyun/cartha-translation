  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: de
  text: Und jeder, der lebt und an mich glaubt, wird in Ewigkeit nicht sterben. Glaubst du das?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: jeder, der lebt und an mich glaubt
  rationale: Gibt die beiden substantivierten Präsenspartizipien parallel und natürlich wieder, ohne das Verhältnis von Leben und Glauben näher zu bestimmen.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: wird … nicht sterben
  rationale: Die starke griechische Verneinung wird zusammen mit der Zukunftsaussage bestimmt wiedergegeben; die nachfolgende Zeitangabe verstärkt sie zusätzlich.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Bewahrt die ausdrückliche, idiomatische Zeitbestimmung und klingt im modernen, würdigen Deutsch natürlich.
- source_word: πιστεύεις τοῦτο;
  choice: Glaubst du das?
  rationale: Direkte und genaue Wiedergabe der persönlichen Frage Jesu.
theological_decisions:
- issue: Spannung zwischen der Aussage, nicht zu sterben, und dem leiblichen Tod von Glaubenden
  choice: wird in Ewigkeit nicht sterben
  alternative: wird niemals sterben
  rationale: Die Übersetzung wahrt die zugespitzte Formulierung des griechischen Textes, ohne sie durch einen erklärenden Zusatz auf geistlichen oder endgültigen Tod festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die knappe, emphatische Aussage und die abschließende persönliche Frage bleiben erhalten.
