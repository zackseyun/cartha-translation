  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zuverlässig wieder: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ wird angemessen als „jeder, der lebt und an mich glaubt“ wiedergegeben; οὐ μὴ ἀποθάνῃ als nachdrückliche Verneinung mit Zukunftsbezug; εἰς τὸν αἰῶνα durch „in Ewigkeit“. Die Aussage bleibt, wie im Ausgangstext, bewusst zugespitzt und wird nicht dogmatisch erklärend eingegrenzt. Die Schlussfrage πιστεύεις τοῦτο; ist genau getroffen.'
