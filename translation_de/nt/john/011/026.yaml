  terminology: „an mich glaubt“, „in Ewigkeit“ und „Glaubst du das?“ sind terminologisch stimmig. Insbesondere vermeidet „in Ewigkeit“ eine unnötige Auslegung der Aussage auf eine bestimmte Todesart. Gegenüber dem englischen Audit-Text wahrt die deutsche Fassung die im griechischen εἰς τὸν αἰῶνα enthaltene Zeitbestimmung ohne dessen im Englischen etwas redundante Formulierung nachzuahmen.
