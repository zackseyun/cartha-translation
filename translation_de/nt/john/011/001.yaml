source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: de
  text: Da war ein Mann krank, Lazarus aus Betanien, aus dem Dorf Marias und ihrer Schwester Marta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Da war
  rationale: Das imperfektische ἦν wird mit „war“ wiedergegeben; „da“ trägt im Deutschen knapp die milde, fortführende Erzählfunktion von δέ, ohne einen ausdrücklichen zeitlichen Sinn wie „nun“ zu behaupten.
- source_word: τις
  choice: ein Mann
  rationale: τις bezeichnet eine zunächst unbestimmt eingeführte, aber konkrete Person. Da der Genannte Lazarus ist, ist „ein Mann“ natürlich und sachgerecht; „ein gewisser Mann“ klänge im heutigen Deutsch unnötig distanziert.
- source_word: ἀσθενῶν
  choice: krank
  rationale: Das Partizip bezeichnet hier eine Erkrankung, nicht bloß allgemeine Schwäche. Zusammen mit ἦν ergibt sich idiomatisch „war … krank“.
- source_word: Λάζαρος
  choice: Lazarus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἀπὸ Βηθανίας
  choice: aus Betanien
  rationale: ἀπό bezeichnet hier Herkunft beziehungsweise Wohnort; „aus Betanien“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: ἐκ τῆς κώμης
  choice: aus dem Dorf
  rationale: κώμη bezeichnet eine kleinere Ortschaft und wird präzise mit „Dorf“ wiedergegeben; ἐκ bezeichnet hier Herkunft.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Marias und ihrer Schwester Marta
  rationale: Die Genitive ordnen das Dorf Maria und Marta zu; τῆς ἀδελφῆς αὐτῆς identifiziert Marta als Marias Schwester. Die Formulierung bewahrt diese syntaktische Zuordnung knapp und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählstil, ohne im Deutschen künstlich zu wirken. Die etablierte deutsche Schreibweise „Betanien“ und die moderne Namensform „Marta“ werden verwendet.
