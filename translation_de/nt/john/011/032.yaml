id: JHN.11.32
reference: John 11:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: de
  text: 'Als Maria nun dorthin kam, wo Jesus war, und ihn sah, fiel sie ihm zu Füßen und sagte zu ihm: »Herr,[a] wärst du hier gewesen, wäre mein Bruder nicht gestorben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch als respektvolle Anrede gebraucht werden; hier bleibt offen, wie viel Maria damit über Jesus aussagt.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet den Fortgang der Erzählung und knüpft natürlich an den vorherigen Zusammenhang an.
- source_word: ὡς ἦλθεν ὅπου ἦν Ἰησοῦς
  choice: als Maria dorthin kam, wo Jesus war
  rationale: Das temporale ὡς wird idiomatisch mit »als« wiedergegeben; »dorthin« macht im Deutschen die durch ἦλθεν ausgedrückte Bewegung zum Ort hin natürlich verständlich.
- source_word: ἰδοῦσα αὐτόν
  choice: und ihn sah
  rationale: Das Partizip bezeichnet einen begleitenden beziehungsweise unmittelbar anschließenden Umstand und wird in natürlichem Deutsch als koordinierter Verbalsatz wiedergegeben.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: fiel sie ihm zu Füßen
  rationale: Die feste deutsche Wendung gibt die Bewegung beziehungsweise Niederwerfung an Jesu Füßen prägnant wieder.
- source_word: λέγουσα αὐτῷ
  choice: und sagte zu ihm
  rationale: Die finite Form ist im Deutschen flüssiger als eine wörtliche Partizipialkonstruktion und erhält den Bezug des Sprechens zu Jesus.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die respektvolle Anrede als auch die im Johannesevangelium mögliche weitergehende christologische Bedeutung.
- source_word: εἰ ἦς ὧδε
  choice: wärst du hier gewesen
  rationale: Der irreale Vergangenheitsbezug wird im Deutschen idiomatisch mit Konjunktiv II Plusquamperfekt ausgedrückt.
- source_word: οὐκ ἄν μου ἀπέθανεν ὁ ἀδελφός
  choice: wäre mein Bruder nicht gestorben
  rationale: Die Verbindung von ἄν und Aorist bezeichnet die irreale Folge in der Vergangenheit; die deutsche Form wahrt diese Aussage genau.
theological_decisions:
- issue: Bedeutung von κύριε in Marias Anrede an Jesus
  choice: Herr
  alternative: Mein Herr / Herr im rein höflichen Sinn
  rationale: Das griechische κύριε kann eine respektvolle Anrede sein und zugleich im Kontext des Evangeliums mehr anklingen lassen. »Herr« erhält diese Spannung, ohne Maria ausdrücklich ein voll entfaltetes Bekenntnis zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, während der irreale Bedingungssatz und die mögliche Bedeutungsbreite der Anrede »Herr« erhalten bleiben.
