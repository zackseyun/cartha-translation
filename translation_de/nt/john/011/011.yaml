id: JHN.11.11
reference: John 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: de
  text: 'Das sagte er, und danach sagte er zu ihnen: „Unser Freund Lazarus ist eingeschlafen[a]. Aber ich gehe hin, um ihn aufzuwecken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: „ist gestorben“. Jesus spricht hier bildhaft vom Tod als Schlaf; in den folgenden Versen verstehen die Jünger ihn zunächst wörtlich.'
    reason: Das Bild soll im Haupttext und seine Bedeutung zugleich für heutige Leser nachvollziehbar bleiben.
lexical_decisions:
- source_word: ταῦτα εἶπεν
  choice: Das sagte er
  rationale: Das pluralische ταῦτα verweist auf das zuvor Gesagte. Im Deutschen fasst „das“ einen vorausgehenden Redeabschnitt natürlich zusammen, ohne den Rückbezug abzuschwächen.
- source_word: μετὰ τοῦτο λέγει αὐτοῖς
  choice: und danach sagte er zu ihnen
  rationale: „Danach“ gibt die zeitliche Abfolge klar wieder. Das historische Präsens λέγει wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Unser Freund Lazarus
  rationale: Diese im Deutschen natürliche Wortstellung bewahrt sowohl die persönliche Beziehung als auch den Namen.
- source_word: κεκοίμηται
  choice: ist eingeschlafen
  rationale: Das Perfekt bewahrt den gegenwärtigen Zustand als Folge des Geschehens. Zugleich bleibt das im Kontext bewusst mehrdeutige Bild des Schlafes erhalten.
- source_word: ἀλλὰ πορεύομαι
  choice: Aber ich gehe hin
  rationale: „Aber“ erhält den Gegensatz; „gehe hin“ bringt die zielgerichtete Bewegung zum Ort des Lazarus idiomatisch zum Ausdruck.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: um ihn aufzuwecken
  rationale: Die deutsche Infinitivkonstruktion gibt den Zweck natürlich und eindeutig wieder und führt das Schlafbild fort.
theological_decisions:
- issue: Soll κεκοίμηται deutend mit „ist gestorben“ oder bildhaft mit „ist eingeschlafen“ übersetzt werden?
  choice: Das Schlafbild wird im Haupttext als „ist eingeschlafen“ bewahrt.
  alternative: „ist gestorben“
  rationale: Jesus gebraucht das Schlafbild für den Tod; die Jünger missverstehen es zunächst in den folgenden Versen. Eine direkte Wiedergabe als „ist gestorben“ würde diese erzählerische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Ablauf, vermeidet jedoch unnatürliche Nachahmung. Der Fußnotenmarker steht unmittelbar bei der bildhaften Aussage, die er erläutert.
