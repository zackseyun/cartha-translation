  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: de
  text: 'Und nachdem er das gesagt hatte, rief er mit lauter Stimme: »Lazarus, komm heraus!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: nachdem er das gesagt hatte
  rationale: Der Aoristpartizip εἰπών bezeichnet eine der Haupthandlung vorausgehende Äußerung. Obwohl ταῦτα formal Plural ist, verweist das natürliche deutsche »das« zusammenfassend auf die vorangegangenen Worte, ohne ihren Umfang zu verändern.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Der Dativ bezeichnet die Art und Weise; »mit lauter Stimme« ist idiomatisches, würdiges Gegenwartsdeutsch und gibt die hörbare Lautstärke wieder.
- source_word: ἐκραύγασεν
  choice: rief er
  rationale: κραυγάζω bezeichnet lautes Rufen oder Schreien. Da »mit lauter Stimme« die Intensität ausdrücklich nennt, vermeidet »rief« im Deutschen eine unnötige Verdoppelung, ohne die Kraft des Ausdrucks abzuschwächen.
- source_word: Λάζαρε
  choice: Lazarus
  rationale: Der Vokativ des Eigennamens wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: δεῦρο ἔξω
  choice: komm heraus
  rationale: Das imperativisch gebrauchte δεῦρο fordert zum Herkommen auf, ἔξω bezeichnet die Bewegung nach draußen. »Komm heraus« gibt den knappen, kraftvollen Ruf natürlich und genau wieder.
theological_decisions:
- issue: Wiedergabe des bekannten Befehls ohne altertümliche Sprache
  choice: komm heraus
  alternative: komm hervor
  rationale: »Komm heraus« entspricht δεῦρο ἔξω in modernem Standarddeutsch und bewahrt die unmittelbare Kraft des Befehls. Das traditioneller klingende »komm hervor« ist möglich, aber weniger alltäglich und lexikalisch nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und eindringlich; die direkte Rede wird mit deutschen Anführungszeichen gesetzt. Keine Fußnote ist nötig, da die bedeutenden lexikalischen Nuancen im Haupttext angemessen wiedergegeben werden.
