source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: de
  text: Als nun die Juden[a], die bei ihr im Haus waren und sie trösteten, sahen, dass Maria schnell aufstand und hinausging, folgten sie ihr, weil sie meinten, sie gehe zum Grab, um dort zu weinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Im Johannesevangelium kann das griechische Wort in engerem Sinn Menschen aus Judäa oder die judäische Führung bezeichnen; hier ist die Gruppe gemeint, die mit Maria trauerte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Als nun die Juden
  rationale: οὖν führt die Erzählung folgernd weiter; „als nun“ verbindet dies im Deutschen natürlich mit dem folgenden Wahrnehmungssatz. Ἰουδαῖοι wird direkt mit „die Juden“ wiedergegeben, während die mögliche engere Bedeutung in der Fußnote erhalten bleibt.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: die bei ihr im Haus waren
  rationale: Der attributive Partizipialsatz grenzt die gemeinte Gruppe ein. „Bei ihr im Haus“ gibt sowohl μετ’ αὐτῆς als auch ἐν τῇ οἰκίᾳ klar und idiomatisch wieder.
- source_word: παραμυθούμενοι αὐτήν
  choice: sie trösteten
  rationale: Das Verb bezeichnet hier den Beistand und Trost im Trauerfall; „trösten“ ist die natürliche moderne Entsprechung.
- source_word: ἰδόντες
  choice: sahen
  rationale: Das Aoristpartizip wird in der durch „als“ eröffneten deutschen Satzkonstruktion als finite zeitliche Handlung wiedergegeben.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: schnell aufstand und hinausging
  rationale: ἀνίστημι meint hier das Aufstehen, nicht Auferstehung; ἐξέρχομαι bezeichnet das Hinausgehen aus dem Haus.
- source_word: ἠκολούθησαν αὐτῇ
  choice: folgten sie ihr
  rationale: Gemeint ist das konkrete Hinterhergehen; ein besonderer Nachfolgebegriff ist im Kontext nicht angezeigt.
- source_word: δόξαντες
  choice: weil sie meinten
  rationale: Das Partizip nennt ihre Annahme als Grund für das Folgen. „Meinten“ bewahrt, dass es sich um ihre Einschätzung handelt.
- source_word: ὑπάγει
  choice: sie gehe
  rationale: Der griechische Präsens wird in abhängiger Rede nach einem Verb des Meinens idiomatisch mit dem deutschen Konjunktiv I wiedergegeben.
- source_word: εἰς τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet die Begräbnisstätte des Lazarus. „Grab“ ist im Deutschen die geläufige und kontextgerechte Bezeichnung.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: um dort zu weinen
  rationale: Die ἵνα-Konstruktion drückt den Zweck aus; der deutsche Infinitivsatz gibt ihn knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαῖοι im Johannesevangelium
  choice: „die Juden“, hier ausdrücklich als die bei Maria trauernde Gruppe bestimmt
  alternative: „die Judäer“
  rationale: Ἰουδαῖοι ist im Johannesevangelium kontextabhängig und kann teils geografisch oder auf bestimmte Führungskreise bezogen sein. Hier begrenzt der Relativsatz die Bezeichnung auf die Trauernden im Haus. Die direkte Wiedergabe bleibt im Text, die mögliche geografische Nuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte griechische Struktur bleibt erkennbar, wird aber durch eine natürliche deutsche Als-Konstruktion lesbar gemacht. Der Konjunktiv I kennzeichnet die nicht bestätigte Annahme der Trauernden.
