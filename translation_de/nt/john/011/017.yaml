id: JHN.11.17
reference: John 11:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: de
  text: Als Jesus nun ankam, stellte er fest, dass Lazarus schon seit vier Tagen im Grab lag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: als Jesus ... ankam
  rationale: Das Aoristpartizip bezeichnet hier die dem Hauptverb zugeordnete Ankunft Jesu. Ein temporaler Nebensatz gibt dies im modernen deutschen Erzählstil natürlich wieder.
- source_word: οὖν
  choice: nun
  rationale: οὖν führt hier den Erzählgang aus dem vorherigen Zusammenhang fort. „Nun“ wahrt diese verbindende Funktion, ohne einen stärkeren logischen Schluss anzudeuten.
- source_word: εὗρεν
  choice: stellte er fest
  rationale: εὑρίσκω bezeichnet hier nicht das Auffinden des Leichnams, sondern das Feststellen des bereits bestehenden Sachverhalts. „Stellte fest“ macht diese Konstruktion im Deutschen klar.
- source_word: αὐτὸν
  choice: Lazarus
  rationale: Das Pronomen bezieht sich im unmittelbaren Kontext eindeutig auf Lazarus. Die ausdrückliche Nennung vermeidet im deutschen dass-Satz Unklarheit, ohne neue Information einzuführen.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: schon seit vier Tagen ... lag
  rationale: Die wörtliche Konstruktion „bereits vier Tage habend“ bezeichnet eine bis zu diesem Zeitpunkt andauernde Zeitspanne. „Schon seit vier Tagen“ ist dafür die natürliche deutsche Formulierung; „lag“ passt zum Aufenthalt des Verstorbenen im Grab.
- source_word: μνημείῳ
  choice: Grab
  rationale: μνημεῖον bezeichnet hier die Grabstätte. „Grab“ ist im modernen Standarddeutsch präzise, geläufig und dem johanneischen Kontext angemessen.
theological_decisions:
- issue: Explizite Benennung des Bezugs von αὐτόν
  choice: Lazarus wird ausdrücklich genannt.
  alternative: Das Pronomen wird als „ihn“ beibehalten.
  rationale: Der griechische Bezug ist aus dem Kontext klar. Die Namensnennung erhöht im Deutschen die Verständlichkeit und legt keine theologisch strittige Deutung fest.
- issue: Sinn der Zeitangabe im Grab
  choice: Eine bis zur Ankunft Jesu andauernde Dauer wird mit „schon seit vier Tagen“ ausgedrückt.
  alternative: „bereits vier Tage im Grab“ oder „den vierten Tag im Grab“
  rationale: τέσσαρας ἤδη ἡμέρας ἔχοντα bezeichnet am natürlichsten vier bereits verstrichene Tage. Die Übersetzung bewahrt die erzählerische Betonung der Dauer, ohne weitere Folgerungen in den Text einzutragen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Satz bleibt knapp und verständlich; „stellte fest“ vermeidet den missverständlichen Eindruck, Jesus habe Lazarus erst suchen und auffinden müssen.
