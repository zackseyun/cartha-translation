  naturalness: „Als Jesus nun ankam, stellte er fest, dass Lazarus schon seit vier Tagen im Grab lag“ ist modernes, flüssiges und dem narrativen Register angemessenes Standarddeutsch. „Stellte er fest“ ist hier eine natürliche Wiedergabe der Konstruktion mit εὗρεν und dem folgenden Sachverhalt.
  terminology: „Grab“ ist für μνημεῖον im Kontext passend. „Schon seit vier Tagen“ gibt ἤδη und die Dauerangabe τέσσαρας ἡμέρας klar wieder. Es bestehen keine problematischen theologischen oder namensbezogenen Entscheidungen.
