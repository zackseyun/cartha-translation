  to: 'Daraufhin beriefen die Hohenpriester und die Pharisäer einen Rat[a] ein und sagten: »Was tun wir? Denn dieser Mann vollbringt viele Zeichen.«'
  rationale: Die Revision stellt die fachsprachliche Wiedergabe von ἀρχιερεῖς als „Hohenpriester“ wieder her und vermeidet bei συνέδριον eine über die artikellose griechische Form hinausgehende Festlegung im Haupttext. Die Fußnote bewahrt die wahrscheinliche, aber im Wortlaut nicht ausdrücklich titulierte Identifizierung mit dem Sanhedrin. „Denn“ und „vollbringt viele Zeichen“ ergeben eine klare, natürliche und quellentreue deutsche Redeform.
