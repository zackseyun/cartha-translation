  variant: modern standard German
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: de
  text: 'Daraufhin beriefen die Hohenpriester und die Pharisäer einen Rat[a] ein und sagten: »Was tun wir? Denn dieser Mann vollbringt viele Zeichen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Sanhedrin, das jüdische Ratsgremium in Jerusalem.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγον
  choice: beriefen … ein
  rationale: Der Aorist bezeichnet hier das Einberufen beziehungsweise Zusammenbringen eines beratenden Gremiums. Die deutsche Wendung ist natürlich und gibt die Handlung präzise wieder.
- source_word: οὖν
  choice: Daraufhin
  rationale: Kennzeichnet die erzählerische und folgerichtige Reaktion auf die vorausgehenden Ereignisse, ohne den Schluss zu stark zu formalisieren.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führung und nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Eingebürgerte deutsche Bezeichnung der jüdischen Gruppierung.
- source_word: συνέδριον
  choice: den Hohen Rat
  rationale: Im gegebenen Jerusalemer Kontext bezeichnet der Ausdruck sehr wahrscheinlich das oberste jüdische Ratsgremium. Die bestimmte Wiedergabe passt dazu; eine Fußnote nennt die traditionelle Bezeichnung.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt kann den Verlauf der Beratung anzeigen. Im natürlichen Deutschen genügt hier das Präteritum; eine künstliche Verlaufsform wäre unidiomatisch.
- source_word: Τί ποιοῦμεν
  choice: Was tun wir?
  rationale: Bewahrt den griechischen Präsens-Indikativ und dessen alarmierten, beratenden Unterton, ohne ihn ausdrücklich in ein »Was sollen wir tun?« umzudeuten.
- source_word: ὅτι
  choice: nämlich
  rationale: Leitet in der direkten Rede die Begründung für die Frage idiomatisch ein.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: dieser Mensch
  rationale: Gibt die Formulierung direkt wieder und bewahrt die distanzierte Redeweise der Sprecher.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: tut … viele Zeichen
  rationale: Bewahrt das Präsens sowie den für das Johannesevangelium theologisch bedeutsamen Begriff »Zeichen« statt ihn auf »Wunder« zu verengen.
theological_decisions:
- issue: Wiedergabe von σημεῖα im Johannesevangelium
  choice: Zeichen
  alternative: Wunder; Wunderzeichen
  rationale: »Zeichen« bewahrt den johanneischen Gedanken, dass Jesu Taten über sich hinaus auf seine Identität weisen, ohne diese Deutung erläuternd in den Text einzubauen.
- issue: Identifizierung von συνέδριον
  choice: der Hohe Rat
  alternative: ein Rat; der Sanhedrin
  rationale: Der Kontext spricht für das bekannte Jerusalemer Führungsgremium. »Hoher Rat« ist verständliches, etabliertes Deutsch; die traditionelle Benennung »Sanhedrin« wird ergänzend in der Fußnote angegeben.
- issue: Deliberativer Sinn von Τί ποιοῦμεν
  choice: Was tun wir?
  alternative: Was sollen wir tun?
  rationale: Die gewählte Form wahrt den Indikativ des griechischen Textes und lässt zugleich den aus dem Kontext erkennbaren beratenden Sinn offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und alarmiert. »Beriefen … ein« ist idiomatischer als eine wörtliche Wiedergabe mit »versammelten«, während »Zeichen« die johanneische Begrifflichkeit erhält.
