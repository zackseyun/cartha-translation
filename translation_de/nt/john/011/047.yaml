  terminology: „Hohepriester“ gibt ἀρχιερεῖς als fachsprachlich etablierte Bezeichnung wieder, ohne zu behaupten, alle hätten zugleich das eine Hohepriesteramt innegehabt. „Zeichen“ bleibt für σημεῖα erhalten. „Sanhedrin“ wird nur erläuternd als mögliche institutionelle Identifizierung genannt.
