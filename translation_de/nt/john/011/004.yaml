  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: de
  text: 'Als Jesus das hörte, sagte er: „Diese Krankheit ist nicht zum Tod[a], sondern zur Herrlichkeit Gottes, damit der Sohn Gottes durch sie verherrlicht wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führt nicht zum Tod“. Die griechische Wendung kann besagen, dass der Tod nicht das endgültige Ergebnis oder Ziel dieser Krankheit ist.'
    reason: Lexikalische Alternative; die Fußnote bewahrt die mögliche Ziel- und Ergebnisbedeutung der griechischen Präposition.
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Als Jesus das hörte
  rationale: Das temporale Aoristpartizip wird im Deutschen natürlich mit einem Nebensatz wiedergegeben. δέ markiert hier nur eine leichte Fortführung beziehungsweise einen milden Kontrast und muss nicht eigens mit „aber“ übersetzt werden. „Das“ greift die zuvor überbrachte Nachricht von der Krankheit des Lazarus auf.
- source_word: ἀσθένεια
  choice: Krankheit
  rationale: „Krankheit“ ist eine klare, allgemein verständliche und nicht unnötig klinische Wiedergabe des Zustands von Lazarus.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: ist nicht zum Tod
  rationale: Die bewusst knappe Formulierung bewahrt die Ziel- beziehungsweise Ergebnisbedeutung von πρός und damit die Spannung zur später berichteten Tatsache, dass Lazarus tatsächlich stirbt. Sie legt nicht vorschnell fest, ob der Tod als unmittelbarer Verlauf, endgültiges Ergebnis oder Zweck gemeint ist.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: dient der Herrlichkeit Gottes
  rationale: ὑπέρ bezeichnet hier Zweck oder dienende Ausrichtung. „Dient der Herrlichkeit Gottes“ ist im modernen Deutschen natürlicher als „ist für die Herrlichkeit Gottes“, ohne die Zweckbeziehung aufzulösen.
- source_word: ἵνα δοξασθῇ
  choice: damit … verherrlicht wird
  rationale: „Damit“ gibt den Zwecksatz mit ἵνα wieder; die Passivform „verherrlicht wird“ bewahrt das Passiv des griechischen Verbs.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Dies ist die geläufige und genaue deutsche Wiedergabe des christologischen Titels.
- source_word: δι’ αὐτῆς
  choice: durch sie
  rationale: διά mit Genitiv bezeichnet das Mittel. Das feminine Pronomen „sie“ verweist eindeutig auf „diese Krankheit“ zurück.
theological_decisions:
- issue: Bedeutung von „nicht zum Tod“ angesichts des späteren Todes von Lazarus
  choice: Die Formulierung lässt erkennen, dass der Tod nicht das endgültige Ziel oder Ergebnis der Krankheit ist, ohne die erzählerische Spannung aufzulösen.
  alternative: Eine uneingeschränkte Vorhersage, Lazarus werde überhaupt nicht sterben, oder die bloß medizinische Aussage, die Krankheit sei nicht tödlich.
  rationale: Der weitere Erzählverlauf berichtet ausdrücklich vom Tod des Lazarus. Die zielbezogene Wendung „zum Tod“ bewahrt deshalb sowohl den Wortlaut als auch die Spannung des Textes.
- issue: Verhältnis zwischen der Herrlichkeit Gottes und der Verherrlichung des Sohnes Gottes
  choice: Beide Aussagen bleiben voneinander unterschieden und zugleich durch den Zwecksatz verbunden.
  alternative: Beide Aussagen zu einer allgemeinen Aussage über göttliche Herrlichkeit zusammenzufassen.
  rationale: Der griechische Text nennt zunächst die Herrlichkeit Gottes und anschließend ausdrücklich die Verherrlichung des Sohnes Gottes durch die Krankheit. Diese Struktur wird ohne zusätzliche dogmatische Erklärung beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markante Wendung „nicht zum Tod“ ist bewusst beibehalten, um die Mehrdeutigkeit und erzählerisch-theologische Spannung des griechischen Textes nicht durch eine glättende Paraphrase aufzulösen.
