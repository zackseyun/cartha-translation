source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: de
  text: Viele der Juden waren zu Marta und Maria gekommen, um sie wegen ihres Bruders zu trösten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Viele der Judäer waren zu Marta und Maria gekommen.« Das griechische Wort kann allgemein Juden oder in manchen Zusammenhängen bei Johannes genauer Judäer bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Viele
  rationale: πολλοί bedeutet »viele«. δέ ist hier ein schwaches Gliederungswort; im natürlichen deutschen Erzählfluss muss es nicht eigens mit »aber« oder »nun« wiedergegeben werden, da kein deutlicher Gegensatz vorliegt.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: von den Juden
  rationale: 'Die Wendung ist partitiv: Viele aus der Gruppe der Ἰουδαῖοι waren gekommen. »Von den Juden« bewahrt hier die breite ethnisch-religiöse Bedeutung; die mögliche regionalere Wiedergabe »Judäer« wird in der Fußnote genannt.'
- source_word: ἐληλύθεισαν
  choice: waren … gekommen
  rationale: Der Plusquamperfekt bezeichnet ein bereits vor dem erzählten Zeitpunkt erfolgtes Kommen.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: zu Marta und Maria
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung beziehungsweise den Besuch bei Personen. »Marta« und »Maria« sind die im Deutschen üblichen Namensformen.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: um sie … zu trösten
  rationale: ἵνα mit Konjunktiv drückt den Zweck aus. παραμυθέομαι bezeichnet hier das Trösten oder Zusprechen in der Trauer.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: wegen ihres Bruders
  rationale: περί mit Genitiv bedeutet »wegen, hinsichtlich, in Bezug auf«. Das griechische »des Bruders« bezieht sich auf den gemeinsamen Bruder der beiden Schwestern; das deutsche Possessivpronomen macht diesen Bezug natürlich verständlich, ohne den Tod ausdrücklich in den Wortlaut einzufügen.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων im Johannesevangelium
  choice: Juden
  alternative: Judäer
  rationale: Der Vers beschreibt Trauernde, die Marta und Maria besuchen, und kennzeichnet nicht ausdrücklich eine bestimmte Führungsgruppe. Daher passt die umfassendere ethnisch-religiöse Bezeichnung »Juden« im Zusammenhang am besten. Weil Ἰουδαῖοι bei Johannes je nach Kontext auch regional als »Judäer« verstanden werden kann, bleibt diese echte Bedeutungsoption in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der schwache griechische Anschluss δέ wird nicht mechanisch wiedergegeben; die partitive Formulierung »viele von den Juden« und die zeitliche Vorordnung des Plusquamperfekts bleiben erhalten.
