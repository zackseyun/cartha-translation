  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: de
  text: 'Jesus sagte zu ihr: „Ich bin die Auferstehung und das Leben. Wer an mich glaubt, wird leben, auch wenn er stirbt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihr
  rationale: Die schlichte narrative Redeeinleitung gibt den Aorist von λέγω und den femininen Dativ αὐτῇ natürlich und genau wieder; im Kontext bezieht sich „ihr“ auf Marta.
- source_word: Ἐγώ εἰμι
  choice: Ich bin
  rationale: Die direkte Identitätsaussage mit dem ausdrücklich gesetzten Pronomen bleibt unverändert erhalten und wahrt ihr mögliches offenbarungstheologisches Gewicht im Johannesevangelium.
- source_word: ἡ ἀνάστασις
  choice: die Auferstehung
  rationale: Im Kontext bezeichnet ἀνάστασις die Auferstehung von den Toten. Der bestimmte Artikel wird entsprechend wiedergegeben.
- source_word: ἡ ζωή
  choice: das Leben
  rationale: Der bestimmte Artikel und die parallele, emphatische Identifikation mit „die Auferstehung“ werden bewahrt.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Wer an mich glaubt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden Menschen, der glaubt. „Wer … glaubt“ ist im Deutschen idiomatisch, inklusiv und bewahrt den verbalen Charakter; πιστεύειν εἰς wird natürlich mit „an … glauben“ wiedergegeben.
- source_word: κἂν ἀποθάνῃ
  choice: auch wenn er stirbt
  rationale: κἄν leitet eine konzessive Bedingung ein. Das generische „er“ entspricht hier dem singularischen Bezugswort „wer“ und erhält die Einzahl des griechischen Satzes.
- source_word: ζήσεται
  choice: wird leben
  rationale: Die einfache Zukunftsaussage bleibt weit genug, um Leben über den Tod hinaus auszudrücken, ohne das im Griechischen nicht ausdrücklich vorhandene „wieder“ hinzuzufügen.
theological_decisions:
- issue: Repräsentativer maskuliner Singular in ὁ πιστεύων und den folgenden Verbformen
  choice: Wer an mich glaubt, wird leben, auch wenn er stirbt
  alternative: Wer an mich glaubt, wird leben, auch wenn dieser Mensch stirbt
  rationale: Das deutsche „wer“ schließt Menschen unabhängig vom Geschlecht ein; das anschließende generische „er“ bewahrt den Singular und klingt würdig und natürlich. Eine Fußnote ist im Deutschen nicht nötig, da die inklusive Bedeutung der Konstruktion gewöhnlich verständlich ist.
- issue: Umfang der Selbstidentifikation Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Ich bin die Auferstehung und das Leben
  alternative: Ich schenke Auferstehung und Leben
  rationale: Die direkte prädikative Identitätsaussage wird nicht in eine bloße Funktionsbeschreibung umgedeutet. So bleibt die christologische Spannung des griechischen Wortlauts erhalten.
- issue: Verhältnis von Tod und verheißenem Leben
  choice: wird leben, auch wenn er stirbt
  alternative: wird wieder lebendig werden, selbst wenn er stirbt
  rationale: ζήσεται sagt schlicht „wird leben“. Die Übersetzung legt nicht zusätzlich fest, ob ausschließlich die künftige leibliche Auferstehung oder umfassender das Leben in Christus gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung „wird leben, auch wenn er stirbt“ klingt im Deutschen natürlicher als eine streng griechische Reihenfolge und bewahrt zugleich die konzessive Aussage.
