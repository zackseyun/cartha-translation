review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes zuverlässig wieder: Jesus als Sprecher, den Bezug auf Marta durch „zu ihr“, die direkte Selbstidentifikation „Ich bin die Auferstehung und das Leben“, den generischen Glaubenden, die Beziehung „an mich“, die konzessive Bedingung des Sterbens und die zukünftige Zusage des Lebens. Die Umstellung von κἂν ἀποθάνῃ vor ζήσεται zu „wird leben, auch wenn er stirbt“ ist im Deutschen idiomatisch und ohne Bedeutungsverschiebung.'
  naturalness: Modernes Standarddeutsch und ein angemessen würdevoller biblischer Registerton. „Wer an mich glaubt … auch wenn er stirbt“ ist klar, flüssig und verständlich. Das generische „er“ nach „wer“ ist grammatisch möglich und wahrt die Singularform, während „wer“ selbst inklusiv verstanden wird.
  terminology: „Auferstehung“ entspricht ἀνάστασις im Kontext präzise; „Leben“ gibt ζωή angemessen wieder. „An mich glauben“ ist die etablierte und natürliche deutsche Wiedergabe von πιστεύειν εἰς ἐμέ. Die Übersetzung ergänzt weder ein nicht im Ausgangstext stehendes „wieder“ noch reduziert sie Jesu Identitätsaussage auf eine bloße Funktion.
