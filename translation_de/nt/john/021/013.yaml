id: JHN.21.13
reference: John 21:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: de
  text: Jesus kommt, nimmt das Brot und gibt es ihnen und ebenso den Fisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus kam, nahm das Brot und gab es ihnen und ebenso den Fisch.« Im Griechischen stehen historische Präsensformen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens wird als historisches Präsens beibehalten und bewahrt so die lebendige Erzählweise des griechischen Textes.
- source_word: λαμβάνει
  choice: nimmt
  rationale: Das schlichte »nimmt« gibt die Handlung vor dem Austeilen treffend und ohne zusätzliche Deutung wieder.
- source_word: τὸν ἄρτον
  choice: das Brot
  rationale: Der bestimmte Artikel verweist auf das bei der Mahlzeit vorhandene Brot.
- source_word: δίδωσιν αὐτοῖς
  choice: gibt es ihnen
  rationale: Das Pronomen »es« nimmt im Deutschen natürlich das unmittelbar vorausgehende »Brot« auf; eine Wiedergabe wie »bedient sie« wäre stärker deutend.
- source_word: τὸ ὀψάριον
  choice: den Fisch
  rationale: Im johanneischen Zusammenhang bezeichnet das Wort Fisch als Speise; »Fisch« ist klar und legt keine im Wort selbst nicht zwingend enthaltene Zubereitungsart fest.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Das Adverb zeigt knapp an, dass Jesus mit dem Fisch dasselbe tut wie zuvor mit dem Brot.
theological_decisions:
- issue: Historisches Präsens im Bericht von der Erscheinung des Auferstandenen
  choice: 'Präsens beibehalten: »kommt, nimmt … und gibt«'
  alternative: 'Vergangenheit: »kam, nahm … und gab«'
  rationale: Die Beibehaltung des historischen Präsens wahrt die griechische Erzählstruktur, ohne die Aussage inhaltlich oder lehrmäßig zu verändern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die Ellipse beim Fisch wird wie im Griechischen beibehalten, ist im Deutschen jedoch eindeutig verständlich.
