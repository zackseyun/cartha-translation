id: JHN.21.11
reference: John 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: de
  text: Da stieg Simon Petrus ins Boot[a] und zog das Netz ans Ufer. Es war voll von großen Fischen, hundertdreiundfünfzig. Und obwohl es so viele waren, riss das Netz nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „stieg hinauf“. Im Zusammenhang ist wahrscheinlich gemeint, dass Simon Petrus ins Boot stieg.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: stieg … ins Boot
  rationale: Das Verb bedeutet wörtlich „stieg hinauf“. Im Zusammenhang bezeichnet es wahrscheinlich, dass Petrus in das Boot stieg; die Ergänzung macht den erzählten Vorgang im Deutschen verständlich, ohne die Bewegungsrichtung des Verbs aufzugeben.
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die erzählerische Folge aus der vorangehenden Aufforderung; „Da“ klingt in modernem deutschem Erzählstil natürlich.
- source_word: εἵλκυσεν
  choice: zog
  rationale: Direkte, natürliche Wiedergabe des Heranziehens eines Netzes.
- source_word: τὸ δίκτυον
  choice: das Netz
  rationale: Übliche und eindeutige Bezeichnung des Fischernetzes.
- source_word: εἰς τὴν γῆν
  choice: ans Ufer
  rationale: Wörtlich „auf/ans Land“; in der Fischereiszene bezeichnet γῆ das Ufer als Ziel des Heranziehens.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: voll von großen Fischen
  rationale: Formnahe und zugleich natürliche Wiedergabe der Inhaltsangabe zum Netz.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: hundertdreiundfünfzig
  rationale: Gibt die ausdrücklich genannte Zahl unverändert wieder.
- source_word: τοσούτων ὄντων
  choice: obwohl es so viele waren
  rationale: 'Der Genitivus absolutus hat im Zusammenhang einen konzessiven Sinn: Trotz der großen Zahl blieb das Netz unversehrt.'
- source_word: οὐκ ἐσχίσθη
  choice: riss … nicht
  rationale: 'Natürliches deutsches Aktiv in intransitiver Bedeutung, das den griechischen Passivgedanken sachlich wiedergibt: Das Netz wurde nicht zerrissen bzw. ging nicht entzwei.'
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdevoller Erzählstil. Die langen griechischen Satzglieder sind zur besseren Verständlichkeit in drei deutsche Sätze gegliedert. Die konkrete Zahl bleibt ohne symbolische Deutung stehen.
