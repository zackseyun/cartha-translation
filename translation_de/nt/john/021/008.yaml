  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: de
  text: Die anderen Jünger aber kamen mit dem kleinen Boot, denn sie waren nicht weit vom Land entfernt, sondern nur etwa zweihundert Ellen davon entfernt[a]. Dabei zogen sie das Netz mit den Fischen[b] hinter sich her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zweihundert Ellen entsprechen ungefähr 90 Metern.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „das Netz der Fische“. Gemeint ist wahrscheinlich das Netz, in dem sich die Fische befanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Die anderen Jünger aber
  rationale: Das nachgestellte „aber“ gibt δέ natürlich wieder und markiert den Gegensatz zu Petrus’ vorausgehendem Handeln.
- source_word: τῷ πλοιαρίῳ
  choice: mit dem kleinen Boot
  rationale: πλοιάριον bezeichnet ein kleines Boot; der instrumentale Dativ wird im Deutschen idiomatisch mit „mit“ wiedergegeben.
- source_word: ἦλθον
  choice: kamen
  rationale: Der Aorist von ἔρχομαι wird in der Erzählfolge schlicht mit „kamen“ wiedergegeben.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: denn sie waren nicht weit vom Land entfernt
  rationale: γάρ begründet das Geschehen; γῆ bezeichnet hier das Land im Gegensatz zum Wasser, kontextuell also auch das Ufer.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: sondern nur etwa zweihundert Ellen
  rationale: ὡς drückt eine ungefähre Angabe aus. „Ellen“ bewahrt das antike Maß; „nur“ macht den durch οὐ … ἀλλά ausgedrückten geringen Abstand im Deutschen natürlich deutlich.
- source_word: σύροντες
  choice: Dabei zogen sie … hinter sich her
  rationale: Das präsentische Partizip bezeichnet eine gleichzeitig ablaufende Begleithandlung; die Formulierung gibt das kräftige Ziehen von σύρω anschaulich und idiomatisch wieder.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: das Netz mit den Fischen
  rationale: Der Genitiv kann den Inhalt des Netzes bezeichnen. „Mit den Fischen“ ist natürlich, ohne das im Griechischen nicht ausdrücklich stehende „voll“ hinzuzufügen.
theological_decisions: []
