  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die antike Maßeinheit bleibt im Haupttext erhalten und wird in der Fußnote erklärt; die Genitivkonstruktion am Versende wird natürlich wiedergegeben, ihre wörtlichere Form jedoch dokumentiert.
