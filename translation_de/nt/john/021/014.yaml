revisions:
- from: Dies war nun das dritte Mal, dass Jesus den Jüngern offenbart wurde, nachdem er von den Toten auferweckt worden war.[a]
  to: Dies war nun schon zum dritten Mal, dass Jesus sich den Jüngern offenbarte, nachdem er von den Toten auferweckt worden war.[a]
  rationale: Die Revision verbessert die moderne deutsche Idiomatik und macht die additive Nuance von ἤδη deutlicher. Sie hält an der Offenbarungssemantik von ἐφανερώθη und am passivischen Auferweckungswortlaut fest; die plausible kontextuelle Wiedergabe „erschien“ bleibt transparent in der Fußnote.
