  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: de
  text: Dies war nun schon zum dritten Mal, dass Jesus sich den Jüngern offenbarte, nachdem er von den Toten auferweckt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies war nun schon zum dritten Mal, dass Jesus den Jüngern erschien, nachdem er von den Toten auferweckt worden war.“'
    reason: Lexikalische und kontextuelle Alternative für ἐφανερώθη.
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Dies war nun das dritte Mal
  rationale: Die Formulierung gibt den rückverweisenden Demonstrativausdruck, den erreichten Zeitpunkt und den adverbial gebrauchten Ordinal idiomatisch und präzise wieder.
- source_word: ἐφανερώθη
  choice: wurde offenbart
  rationale: Die passive Form und die johanneische Wortwahl werden bewahrt; im Kontext ist auch „erschien“ möglich.
- source_word: τοῖς μαθηταῖς
  choice: den Jüngern
  rationale: Der bestimmte Artikel wird wiedergegeben, ohne das im Griechischen nicht ausdrücklich stehende Possessivpronomen „seinen“ einzufügen.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: nachdem er von den Toten auferweckt worden war
  rationale: Der temporale Bezug des Aoristpartizips und sein Passiv werden in natürlichem Deutsch ausdrücklich wiedergegeben.
theological_decisions:
- issue: Passivische Auferstehungssprache in ἐγερθεὶς ἐκ νεκρῶν
  choice: nachdem er von den Toten auferweckt worden war
  alternative: nachdem er von den Toten auferstanden war
  rationale: Die gewählte Fassung wahrt das grammatische Passiv des griechischen Textes, ohne die Aussage theologisch weiter auszudeuten.
- issue: Bedeutung von ἐφανερώθη
  choice: wurde offenbart
  alternative: erschien
  rationale: Die Hauptfassung erhält das Passiv und die johanneische Offenbarungssprache; die kontextuell natürliche Wiedergabe „erschien“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung bleibt relativ formnah, ist aber syntaktisch natürlich und allgemein verständlich.
