review_pass:
  verdict: revise
  source_fidelity: Der Rückverweis (τοῦτο), die erreichte Zählung (ἤδη τρίτον), die Jünger als Adressaten sowie das vorzeitige passive Auferwecktwerden (ἐγερθεὶς ἐκ νεκρῶν) sind sachgerecht wiedergegeben. Für ἐφανερώθη wahrt „sich ... offenbarte“ im Deutschen die Offenbarungsnuance genauer und idiomatischer als das schwerfällige unpersönliche Passiv „den Jüngern offenbart wurde“.
  naturalness: Die vorliegende Konstruktion „das dritte Mal, dass Jesus den Jüngern offenbart wurde“ ist zwar verständlich, klingt im modernen Standarddeutsch jedoch unnötig passivisch und weniger natürlich. „nun schon zum dritten Mal“ und „Jesus sich den Jüngern offenbarte“ sind flüssig und behalten Sinn und Register bei.
  terminology: „Offenbarte“ bewahrt die johanneische Wortwahl gegenüber der möglichen, kontextuell glatteren Alternative „erschien“. „Von den Toten auferweckt“ erhält das Passiv von ἐγερθείς; die Fußnote kennzeichnet „erschien“ zutreffend als lexikalisch-kontextuelle Alternative.
  issues:
  - severity: low
    issue: Unidiomatische passive Wiedergabe von ἐφανερώθη
    rationale: „Jesus den Jüngern offenbart wurde“ ist grammatisch möglich, wirkt aber im Deutschen sperrig. Das reflexive „Jesus sich den Jüngern offenbarte“ gibt die Erscheinungs-/Offenbarungsfunktion des griechischen Passivs natürlich wieder, ohne die johanneische Nuance auf „erschien“ zu reduzieren.
  - severity: low
    issue: ἤδη wird mit „nun“ allein nur abgeschwächt wiedergegeben
    rationale: „Nun schon“ bringt sowohl den narrativen Zeitpunkt als auch die bereits erreichte Zahl in idiomatischem Deutsch klarer zum Ausdruck.
  revised_text: Dies war nun schon zum dritten Mal, dass Jesus sich den Jüngern offenbarte, nachdem er von den Toten auferweckt worden war.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: „Dies war nun schon zum dritten Mal, dass Jesus den Jüngern erschien, nachdem er von den Toten auferweckt worden war.“'
    reason: Lexikalische und kontextuelle Alternative für ἐφανερώθη.
  revision_rationale: Die Revision verbessert die moderne deutsche Idiomatik und macht die additive Nuance von ἤδη deutlicher. Sie hält an der Offenbarungssemantik von ἐφανερώθη und am passivischen Auferweckungswortlaut fest; die plausible kontextuelle Wiedergabe „erschien“ bleibt transparent in der Fußnote.
