id: JHN.21.4
reference: John 21:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: de
  text: Als es schon Morgen geworden war, stand Jesus am Ufer. Doch die Jünger wussten nicht, dass es Jesus war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch die Jünger erkannten nicht, dass es Jesus war.“ Im Griechischen steht wörtlicher „wussten nicht“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Als es schon Morgen geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. „Morgen“ gibt πρωΐα natürlich wieder; „schon … geworden war“ bewahrt ἤδη und die vorausliegende Zustandsänderung. Das schwache δέ wird im flüssigen deutschen Erzählzusammenhang nicht eigens markiert.
- source_word: ἔστη
  choice: stand
  rationale: Der Aorist von ἵστημι bezeichnet hier, dass Jesus seinen Platz am Ufer eingenommen hatte beziehungsweise dort stand. Das schlichte „stand“ ist im Deutschen natürlich und lässt diese Nuance offen.
- source_word: εἰς τὸν αἰγιαλόν
  choice: am Ufer
  rationale: Obwohl εἰς gewöhnlich eine Richtung ausdrückt, bezeichnet die Verbindung mit ἔστη hier idiomatisch den Standort. αἰγιαλός meint den Ufer- oder Strandbereich; „am Ufer“ passt natürlich zum Kontext.
- source_word: οὐ μέντοι
  choice: Doch … nicht
  rationale: 'Die Verbindung drückt einen adversativen beziehungsweise konzessiven Gegensatz aus: Jesus war anwesend, die Jünger identifizierten ihn dennoch nicht.'
- source_word: ᾔδεισαν
  choice: wussten nicht
  rationale: οἶδα bedeutet grundsätzlich „wissen/kennen“. Im Kontext liegt „erkennen“ nahe, doch die Hauptübersetzung bewahrt die weniger spezifische Formulierung des griechischen Textes.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel verweist auf die bereits bekannte Gruppe. Ein im Griechischen nicht vorhandenes Possessivpronomen ist unnötig.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: dass es Jesus war
  rationale: Die deutsche Identifikationsformel „es war Jesus“ gibt den Sinn natürlich wieder. Das Präteritum folgt der deutschen Erzählperspektive, ohne die Identität Jesu zeitlich einzuschränken.
theological_decisions:
- issue: Identifizierung des auferstandenen Jesus
  choice: Die Jünger „wussten nicht, dass es Jesus war“
  alternative: Die Jünger „erkannten nicht, dass es Jesus war“
  rationale: Der Vers berichtet die fehlende Identifizierung, erklärt aber nicht deren Ursache. Die Übersetzung vermeidet daher Aussagen darüber, ob Jesu Erscheinung verändert war oder ob die Wahrnehmung der Jünger eingeschränkt wurde.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am griechischen Ablauf, ohne unnatürliche Wörtlichkeit.
