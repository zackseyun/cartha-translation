id: JHN.21.1
reference: John 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: de
  text: Danach offenbarte sich Jesus den Jüngern wieder am See von Tiberias. Er offenbarte sich auf folgende Weise:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So zeigte er sich“; das griechische Verb kann sowohl das Sichtbarwerden als auch das Sich-zu-erkennen-Geben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang und den Rückbezug des griechischen Plurals im Deutschen natürlich wieder; das wörtlichere „Nach diesen Dingen“ wäre unnötig schwerfällig.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: offenbarte sich
  rationale: Bewahrt sowohl die reflexive Form als auch den Gedanken, dass Jesus sich sichtbar macht beziehungsweise zu erkennen gibt.
- source_word: πάλιν
  choice: wieder
  rationale: Bezeichnet eine erneute Selbstoffenbarung nach den vorausgehenden Erscheinungen.
- source_word: τοῖς μαθηταῖς
  choice: den Jüngern
  rationale: Folgt dem bestimmten Artikel, ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen „seinen“ zu ergänzen.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: am See von Tiberias
  rationale: „Am“ gibt die Ortsangabe mit ἐπί und Genitiv idiomatisch wieder; „See von Tiberias“ entspricht der johanneischen Bezeichnung.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Er offenbarte sich auf folgende Weise
  rationale: Die Wiederholung des Verbs bleibt aus Gründen des literarischen Zusammenhangs erhalten; ein neuer deutscher Satz gibt den Übergang klar und natürlich wieder.
theological_decisions:
- issue: Sprache für die Erscheinung des Auferstandenen
  choice: offenbarte sich
  alternative: erschien
  rationale: „Offenbarte sich“ erhält den Akzent des griechischen Verbs auf Jesu aktiver Selbstkundgabe, ohne die wirkliche Sichtbarkeit der Begegnung zu bestreiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Verbwiederholung des Ausgangstextes wurde bewusst beibehalten; die Fußnote markiert die Bedeutungsbreite von φανερόω.
