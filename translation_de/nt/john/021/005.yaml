  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: de
  text: 'Da sagte Jesus zu ihnen: „Kinder, habt ihr keinen Fisch[a]?“ Sie antworteten ihm: „Nein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichts zu essen“. Das griechische Wort bezeichnet genauer etwas, das zum Brot gegessen wird; in diesem Zusammenhang ist vermutlich Fisch gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Als natürlicher deutscher Erzählanschluss gibt „Da“ die Fortführung der Handlung wieder, ohne eine stärkere Schlussfolgerung auszudrücken.
- source_word: Παιδία
  choice: Kinder
  rationale: Die direkte Anrede bewahrt den vertraulichen, leicht liebevollen Ton und vermeidet die stärker deutenden Wiedergaben „Freunde“ oder „Männer“.
- source_word: μή τι
  choice: habt ihr keinen …?
  rationale: Die mit μή eingeleitete Frage erwartet eine verneinende Antwort. Die negative deutsche Frageform gibt diese Erwartung knapp und idiomatisch wieder.
- source_word: προσφάγιον
  choice: Fisch
  rationale: Das Wort bezeichnet eigentlich etwas, das zum Brot gegessen wird. Im unmittelbaren Zusammenhang des Fischfangs ist sehr wahrscheinlich Fisch gemeint; die allgemeinere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: ἔχετε
  choice: habt ihr
  rationale: Die schlichte Besitzangabe wird in der deutschen Frage natürlich mit „habt ihr“ wiedergegeben.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Dies entspricht der üblichen erzählenden Antwortformel und bleibt nah am griechischen Wortlaut.
- source_word: Οὔ
  choice: Nein
  rationale: Die knappe verneinende Antwort entspricht unmittelbar dem griechischen Text.
