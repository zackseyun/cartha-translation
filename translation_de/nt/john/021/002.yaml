source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: de
  text: Simon Petrus, Thomas, der Zwilling genannt wurde,[a] Natanaël aus Kana in Galiläa, die Söhne des Zebedäus und zwei weitere seiner Jünger waren beisammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Thomas, der Didymus genannt wurde“. „Didymus“ ist das griechische Wort für „Zwilling“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: waren beisammen
  rationale: Das Imperfekt ἦσαν bezeichnet den vergangenen Zustand; ὁμοῦ bedeutet, dass sie zusammen beziehungsweise am selben Ort waren. „Waren beisammen“ gibt beides natürlich und knapp wieder.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Gebräuchliche deutsche Form des Namens und Beinamens.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Thomas, der Zwilling genannt wurde
  rationale: λεγόμενος bedeutet „genannt“; Δίδυμος ist das griechische Wort für „Zwilling“. Die Übersetzung erhält die Bedeutung des Beinamens, statt ihn lediglich als „Didymus“ zu transkribieren.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Natanaël aus Kana in Galiläa
  rationale: ἀπό bezeichnet hier die Herkunft. „Kana in Galiläa“ ist im heutigen Deutsch eine natürliche geografische Angabe.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: die Söhne des Zebedäus
  rationale: Die substantivierte Genitivkonstruktion bezeichnet im Kontext eindeutig die Söhne des Zebedäus; „Söhne“ muss im Deutschen ergänzt werden.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: zwei weitere von seinen Jüngern
  rationale: 'Die Formulierung bewahrt den partitiven Sinn von ἐκ: Es handelt sich um zwei weitere aus dem Kreis seiner Jünger.'
- source_word: καί … καί
  choice: Aufzählung mit Kommas und abschließendem „und“
  rationale: Das wiederholte καί koordiniert die Glieder. Eine normale deutsche Aufzählung gibt diese Struktur ohne Bedeutungsverlust wieder.
