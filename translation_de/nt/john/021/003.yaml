id: JHN.21.3
reference: John 21:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: de
  text: 'Simon Petrus sagte zu ihnen[a]: »Ich gehe fischen.« Sie sagten zu ihm: »Wir kommen auch mit dir.« Sie gingen hinaus, stiegen in das Boot und fingen in jener Nacht nichts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht das historische Präsens: »Simon Petrus sagt zu ihnen … sie sagen zu ihm«. Es ist ein übliches Erzählmittel und wird hier im Deutschen mit dem Präteritum wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει … λέγουσιν
  choice: sagte … sagten
  rationale: Die historischen Präsensformen werden für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben; ihre Funktion wird in der Fußnote kenntlich gemacht.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Ich gehe fischen
  rationale: Die idiomatische deutsche Verbindung gibt sowohl die beabsichtigte Bewegung als auch den Zweck des Fischens knapp und genau wieder.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Wir kommen auch mit dir
  rationale: »Auch« bewahrt die Betonung von καὶ ἡμεῖς, und »mit dir« gibt die Gemeinschaftsaussage von σύν wieder.
- source_word: ἐξῆλθον
  choice: Sie gingen hinaus
  rationale: Die Übersetzung bewahrt die räumliche Bewegung des Verbs, ohne ein nicht ausdrücklich genanntes Ausgangsziel festzulegen.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: stiegen in das Boot
  rationale: Dies ist eine natürliche deutsche Wiedergabe des Einsteigens; »Boot« entspricht dem galiläischen Fischereikontext besser als »Schiff«.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: in jener Nacht
  rationale: Die Formulierung gibt den zeitlichen Ausdruck präzise und in einem würdigen modernen Register wieder.
- source_word: ἐπίασαν οὐδέν
  choice: fingen … nichts
  rationale: Im Fischereikontext bedeutet πιάζω »fangen«; οὐδέν bezeichnet den vollständigen Misserfolg.
