revisions:
- from: 'Petrus wandte sich um und sah den Jünger, den Jesus liebte, hinterhergehen[a]. Es war der, der sich auch beim Abendessen an die Brust Jesu zurückgelehnt und gesagt hatte: »Herr, wer ist es, der dich ausliefert?«'
  to: 'Petrus wandte sich um und sah den Jünger, den Jesus liebte, folgen[a], der sich auch beim Mahl an Jesu Brust gelehnt und gesagt hatte: »Herr, wer ist es, der dich ausliefert?«'
  rationale: Die Revision bewahrt die im Griechischen offene Bezugsgröße von ἀκολουθοῦντα mit »folgen«, glättet die deutsche Satzführung und formuliert die Rückblende auf die Mahlgeste idiomatisch und quellennah. Die Übersetzung von παραδίδωμι mit »ausliefert« bleibt bestehen, da sie die Grundbedeutung wahrt, ohne die Bedeutung auf »verrät« festzulegen.
