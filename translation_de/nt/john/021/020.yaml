source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: de
  text: 'Petrus wandte sich um und sah den Jünger, den Jesus liebte, folgen[a], der sich auch beim Mahl an Jesu Brust gelehnt und gesagt hatte: »Herr, wer ist es, der dich ausliefert?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »hinterhergehen«. Im Griechischen wird nicht ausdrücklich gesagt, wem der Jünger folgt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: wandte sich um
  rationale: Das Aoristpartizip leitet die nächste Handlung des Petrus ein; die finite Wiedergabe ist im modernen deutschen Erzählstil natürlich.
- source_word: βλέπει
  choice: sah
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil im Präteritum wiedergegeben.
- source_word: τὸν μαθητὴν
  choice: den Jünger
  rationale: »Jünger« ist die geläufige und im Johannesevangelium sachlich passende Wiedergabe von μαθητής.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: den Jesus liebte
  rationale: Die Formulierung gibt den Relativsatz knapp und idiomatisch wieder, ohne die Bedeutung von ἀγαπάω abzuschwächen.
- source_word: ἀκολουθοῦντα
  choice: hinterhergehen
  rationale: Das Partizip bezeichnet, dass der Jünger hinter den zuvor genannten Personen hergeht. Die Wiedergabe lässt wie das Griechische offen, wem genau er folgt.
- source_word: ἀνέπεσεν
  choice: sich … zurückgelehnt hatte
  rationale: Im Kontext eines im Liegen eingenommenen Mahls bezeichnet das Verb die Bewegung des Zurücklehnens; das Plusquamperfekt macht den Rückblick verständlich.
- source_word: ἐν τῷ δείπνῳ
  choice: beim Abendessen
  rationale: δεῖπνον bezeichnet hier das Mahl; »Abendessen« ist natürlich und vermeidet eine unbegründete liturgische Festlegung.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: an die Brust Jesu
  rationale: στῆθος bezeichnet Brust beziehungsweise Brustkorb. Der Name »Jesus« klärt den deutschen Pronomenbezug, der im Griechischen durch den Kontext gegeben ist.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die ehrerbietige Anrede als auch den johanneischen theologischen Klang von κύριος.
- source_word: ὁ παραδιδούς σε
  choice: der dich ausliefert
  rationale: »Ausliefern« wahrt die Grundbedeutung von παραδίδωμι und zugleich die im Passionszusammenhang mitschwingende Bedeutung des Verrats.
theological_decisions:
- issue: Historisches Präsens βλέπει
  choice: Präteritum »sah«
  alternative: Historisches Präsens »sieht«
  rationale: Das Präteritum entspricht natürlichem deutschem Erzählstil; die Handlung und ihr Gewicht bleiben unverändert.
- issue: Nicht genanntes Objekt bei ἀκολουθοῦντα
  choice: Objektloses »hinterhergehen«
  alternative: »ihnen folgen« oder »ihm folgen«
  rationale: Der griechische Text nennt kein Objekt. Die deutsche Formulierung bewahrt diese echte syntaktische Offenheit, statt zwischen Jesus allein und Jesus mit Petrus zu entscheiden.
- issue: Bedeutungsumfang von παραδίδωμι
  choice: »ausliefert«
  alternative: »verrät«
  rationale: »Ausliefert« bewahrt die konkrete Handlung des Übergebens und lässt zugleich den Verrat im Passionskontext erkennen, ohne die Bedeutung vorschnell auf ein einziges deutsches Konzept zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung entlastet den langen griechischen Relativsatz. »Beim Abendessen« ist alltagssprachlich verständlich, ohne salopp zu wirken; »Herr« und »Jünger« sichern die vertraute biblische Begrifflichkeit.
