  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: de
  text: 'Dies sagte er, um anzudeuten, durch welche Art von Tod Petrus Gott verherrlichen würde.[a] Und nachdem er dies gesagt hat, sagt er zu ihm[b]: »Folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch was für einen Tod«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht hier das historische Präsens: »sagt er zu ihm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: um anzudeuten
  rationale: Das Partizip erläutert die Absicht der vorausgehenden Aussage. »Andeuten« gibt das indirekte Kenntlichmachen natürlich und präzise wieder.
- source_word: ποίῳ θανάτῳ
  choice: durch welche Art von Tod
  rationale: ποίῳ trägt eine qualitative Nuance; die Formulierung bewahrt den Bezug auf Art beziehungsweise Weise des Todes.
- source_word: δοξάσει
  choice: verherrlichen würde
  rationale: Der griechische Futur wird in der von einem Vergangenheitstempus abhängigen indirekten Aussage im Deutschen idiomatisch mit »würde« wiedergegeben; der Zukunftsbezug bleibt erhalten.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Entspricht der üblichen Wiedergabe von θεός als Objekt von δοξάζω.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Nachdem er das gesagt hat
  rationale: Die aoristische Partizipialkonstruktion wird als natürliche deutsche Temporalkonstruktion wiedergegeben.
- source_word: λέγει αὐτῷ
  choice: sagt er zu ihm
  rationale: Das historische Präsens des Griechischen bleibt erhalten und bewahrt den lebendigen Erzählstil.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Die natürliche deutsche Aufforderung bewahrt sowohl den unmittelbaren Ruf als auch die mögliche fortdauernde Dimension der Nachfolge.
theological_decisions:
- issue: Wer durch seinen Tod Gott verherrlichen würde
  choice: Petrus wird zur Verdeutlichung als Subjekt genannt.
  alternative: Das Pronomen »er« beibehalten.
  rationale: Im unmittelbaren Kontext bezieht sich das unausgedrückte Subjekt von δοξάσει auf Petrus. Die Namensnennung verhindert im Deutschen eine irreführende Rückbeziehung auf Jesus, ohne die Aussage theologisch auszuweiten.
- issue: Bedeutung von »Gott verherrlichen« im Zusammenhang mit dem Tod des Petrus
  choice: Die Wendung bleibt ohne interpretierende Erweiterung stehen.
  alternative: Ausdrücklich von Martyrium oder treuem Zeugnis sprechen.
  rationale: Der Text sagt, dass Petrus durch diesen Tod Gott verherrlichen würde, erklärt aber nicht ausdrücklich, auf welche Weise. Diese theologische Spannung wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wird bewusst beibehalten. »Petrus« verdeutlicht das im Griechischen aus dem Kontext erschlossene Subjekt und verhindert eine falsche Zuordnung zu Jesus.
