  source_fidelity: Der Entwurf gibt σημαίνων, die qualitative Nuance von ποίῳ θανάτῳ, den futurischen Bezug von δοξάσει und das historische Präsens λέγει sachgerecht wieder. Die explizite Nennung von Petrus ist aus dem unmittelbaren Kontext gedeckt und verhindert im Deutschen eine falsche Zuordnung des Subjekts. Das einleitende δέ muss nicht zwingend eigens wiedergegeben werden.
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind insgesamt gelungen. Die Satzverbindung mit καί sollte jedoch durch „Und“ kenntlich gemacht werden. Der Fußnotenanker zum historischen Präsens muss direkt an „sagt er zu ihm“ stehen, nicht nach dem Doppelpunkt.
  terminology: „Gott verherrlichen“ und „Folge mir!“ sind treffend und etabliert. Die Fußnote zu [a] sollte bei einer wirklichen lexikalischen Alternative bleiben; „auf welche Weise er sterben würde“ ist eher eine erläuternde Umformulierung als eine gleichwertige lexikalische Wiedergabe.
