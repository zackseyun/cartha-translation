source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: de
  text: 'Als sie nun gefrühstückt hatten, sagte Jesus zu Simon Petrus: „Simon, Sohn des Johannes, liebst du mich mehr als diese[b]?“ Er antwortete ihm: „Ja, Herr, du weißt, dass ich dich liebe.[a]“ Jesus sagte zu ihm: „Weide meine Lämmer.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier zwei verschiedene Verben: Jesus fragt mit ἀγαπάω („lieben“), Petrus antwortet mit φιλέω („lieben, Zuneigung haben“). Manche sehen darin einen Bedeutungsunterschied, andere eine stilistische Variation. Im Haupttext werden beide mit „lieben“ wiedergegeben, damit kein Gegensatz behauptet wird, den der Zusammenhang nicht ausdrücklich macht.'
    reason: lexical_alternative
  - marker: b
    text: '„Mehr als diese“ kann bedeuten: „mehr, als diese mich lieben“, „mehr als diese Dinge“ oder „mehr, als du diese liebst“. Der griechische Wortlaut lässt den Vergleich unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: gefrühstückt hatten
  rationale: ἀριστάω bezeichnet hier das Einnehmen der Morgenmahlzeit. Die Formulierung gibt den temporalen Rückblick des Aorists nach ὅτε natürlich wieder.
- source_word: λέγει
  choice: sagte / antwortete
  rationale: Das historische Präsens wird im modernen deutschen Erzählstil mit dem Präteritum wiedergegeben. Beim zweiten Vorkommen macht „antwortete“ die Gesprächsfolge idiomatisch deutlich, ohne den Sinn zu verändern.
- source_word: Σίμων Ἰωάννου
  choice: Simon, Sohn des Johannes
  rationale: Der Genitiv Ἰωάννου ist als Patronym zu verstehen. „Johannes“ folgt unmittelbar dem griechischen Text; „Jona“ wäre eine aus anderer Überlieferung eingetragene Form.
- source_word: ἀγαπᾷς / φιλῶ
  choice: liebst / liebe
  rationale: Beide Verben können in diesem johanneischen Zusammenhang mit „lieben“ wiedergegeben werden. Eine unterschiedliche Übersetzung im Haupttext würde möglicherweise einen umstrittenen Bedeutungsunterschied überzeichnen; der Wortwechsel wird in einer Fußnote dokumentiert.
- source_word: πλέον τούτων
  choice: mehr als diese
  rationale: Die griechische Wendung lässt den Bezug von τούτων und den unausgesprochenen Vergleich offen. Die knappe deutsche Form bewahrt diese echte Mehrdeutigkeit.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ entspricht der ehrerbietigen Anrede κύριε und ist im johanneischen Kontext angemessener als das bloß höfliche „mein Herr“ oder „Herr und Meister“.
- source_word: οἶδας
  choice: du weißt
  rationale: Die direkte, idiomatische Wiedergabe bewahrt den Nachdruck auf Jesu persönlichem Wissen.
- source_word: Βόσκε
  choice: Weide
  rationale: βόσκω bezeichnet das Füttern beziehungsweise Weiden von Herdentieren. „Weide“ erhält das Hirtenbild und grenzt das Verb nicht unnötig auf eine technische Fütterungshandlung ein.
- source_word: τὰ ἀρνία μου
  choice: meine Lämmer
  rationale: ἀρνία bezeichnet Lämmer beziehungsweise junge Schafe; „meine“ gibt Jesu Besitz- und Fürsorgebeziehung unmittelbar wieder.
theological_decisions:
- issue: Ob ἀγαπάω und φιλέω im Haupttext deutlich unterschieden werden sollen
  choice: Beide Verben werden mit „lieben“ wiedergegeben; der griechische Wortwechsel steht in einer Fußnote.
  alternative: ἀγαπάω mit „lieben“ und φιλέω mit „liebhaben“ oder „Zuneigung haben“ wiedergeben.
  rationale: Ob der Wechsel eine abgestufte Art der Liebe oder lediglich stilistische Variation ausdrückt, ist umstritten. Eine einheitliche Wiedergabe vermeidet es, dem Text eine nicht eindeutig ausgesagte Rangordnung der Liebe aufzuerlegen.
- issue: Bezug und Vergleich bei πλέον τούτων
  choice: Die Mehrdeutigkeit bleibt mit „mehr als diese“ erhalten.
  alternative: „mehr, als diese mich lieben“ oder „mehr als diese Dinge“ beziehungsweise „mehr, als du diese liebst“.
  rationale: Der griechische Text nennt weder ausdrücklich, was verglichen wird, noch eindeutig, ob τούτων Personen oder Dinge bezeichnet. Eine Festlegung würde den möglichen Sinn unzulässig verengen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit natürlichem Erzählpräteritum. Die traditionelle Hirtenmetapher bleibt in „Weide meine Lämmer“ erhalten. Die Fußnotenmarker stehen unmittelbar an den jeweils erklärten mehrdeutigen beziehungsweise lexikalisch umstrittenen Stellen.
