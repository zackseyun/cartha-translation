source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Kommt, frühstückt[a]!“ Doch keiner der Jünger wagte, ihn zu fragen[b]: „Wer bist du?“ Denn sie wussten, dass es der Herr war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Esst Frühstück.“ Das griechische Verb bezeichnet ausdrücklich die Morgenmahlzeit.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „fragen“ wiedergegebene Verb kann auch „eingehend befragen“ oder „genau prüfen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Kommt
  rationale: Die auffordernde Einladung wird im Deutschen natürlich mit „Kommt“ wiedergegeben.
- source_word: ἀριστήσατε
  choice: esst Frühstück
  rationale: Das Verb bezeichnet ausdrücklich das Einnehmen der Morgenmahlzeit; „esst Frühstück“ bewahrt diese zeitliche Bestimmtheit.
- source_word: οὐδεὶς δὲ
  choice: Doch keiner
  rationale: δέ markiert hier einen leichten Gegensatz beziehungsweise Übergang; „Doch“ gibt diesen Wechsel idiomatisch wieder.
- source_word: ἐτόλμα
  choice: wagte
  rationale: Das Imperfekt von τολμάω bezeichnet hier den fehlenden Mut, die folgende Frage zu stellen.
- source_word: ἐξετάσαι
  choice: zu fragen
  rationale: Im Zusammenhang mit der direkten Rede ist „fragen“ klar und natürlich; der mögliche stärkere Sinn von eingehendem Befragen wird in der Fußnote bewahrt.
- source_word: Σὺ τίς εἶ;
  choice: Wer bist du?
  rationale: Die direkte Identitätsfrage wird in natürlicher deutscher Wortstellung wiedergegeben; das Personalpronomen „du“ bleibt erhalten.
- source_word: εἰδότες ὅτι
  choice: Denn sie wussten, dass
  rationale: Die Partizipialkonstruktion kann hier naheliegend begründend verstanden werden. „Denn“ drückt diesen Zusammenhang natürlich aus, ohne die Frage in die Aussage einzubauen.
- source_word: ὁ κύριός
  choice: der Herr
  rationale: „Der Herr“ bewahrt die christologische Bezeichnung und den bestimmten Artikel in idiomatischem Deutsch.
theological_decisions:
- issue: Wiedergabe von κύριος in Bezug auf Jesus
  choice: der Herr
  alternative: der Meister
  rationale: „Der Herr“ bewahrt das christologische Gewicht der Bezeichnung in der Auferstehungserzählung, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Logischer Bezug von εἰδότες
  choice: 'begründend: „Denn sie wussten“'
  alternative: 'modal/begleitend: „wobei sie wussten“ oder „da sie wussten“'
  rationale: Das Wissen erklärt im Kontext plausibel, weshalb niemand die Identitätsfrage zu stellen wagte. Die griechische Partizipialform lässt den genauen logischen Bezug jedoch unausgesprochen; „Denn“ ist eine zurückhaltende, natürliche Explikation.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Esst Frühstück“ erhält die konkrete Bedeutung des griechischen Verbs; die etwas knappere Alternative „frühstückt“ steht in der Fußnote. Die Anrede wechselt nicht in ein künstlich gehobenes Register.
