  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: de
  text: 'Jesus sagte zu ihnen: »Bringt einige der Fische her, die ihr jetzt gefangen habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben.
- source_word: Ἐνέγκατε
  choice: Bringt … her
  rationale: Der Aorist-Imperativ Plural formuliert eine direkte Aufforderung; »herbringen« gibt die Bewegung zu Jesus idiomatisch wieder.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: einige von den Fischen
  rationale: ἀπό mit dem Genitiv bezeichnet hier eine Teilmenge des gesamten Fangs; diese partitive Bedeutung wird im Deutschen ausdrücklich und natürlich wiedergegeben.
- source_word: ὀψαρίων
  choice: Fischen
  rationale: Im unmittelbaren Zusammenhang bezeichnet ὀψάριον die gefangenen Fische, ohne dass Größe oder Zubereitung näher bestimmt werden sollte.
- source_word: ὧν ἐπιάσατε νῦν
  choice: die ihr gerade gefangen habt
  rationale: Das Perfekt verbindet den soeben abgeschlossenen Fang mit der gegenwärtigen Situation; »gerade« gibt die zeitliche Nähe von νῦν idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; die partitive Aussage des Griechischen bleibt erhalten.
