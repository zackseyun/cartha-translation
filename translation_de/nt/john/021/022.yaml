  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Wenn ich will, dass er bleibt, bis ich komme, was geht das dich an? Du folge mir!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Das historische Präsens wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Ἐὰν
  choice: Wenn
  rationale: Leitet eine Bedingung ein und bewahrt deren hypothetischen Charakter ohne zusätzliche Deutung.
- source_word: θέλω
  choice: ich will
  rationale: „Wollen“ gibt die volitive Bedeutung von θέλω im Deutschen natürlich wieder und kann sowohl Wunsch als auch Willensentschluss ausdrücken.
- source_word: μένειν
  choice: bleibt
  rationale: „Bleiben“ entspricht μένω direkt, wahrt den johanneischen Wortgebrauch und legt nicht ausdrücklich „am Leben bleiben“ fest.
- source_word: ἕως ἔρχομαι
  choice: bis ich komme
  rationale: Die Formulierung lässt offen, auf welches Kommen Jesu Bezug genommen wird, und vermeidet die deutende Übersetzung „wiederkomme“.
- source_word: τί πρὸς σέ;
  choice: was geht das dich an?
  rationale: Diese geläufige deutsche Wendung gibt die direkte, abweisende Frage des griechischen Idioms treffend wieder.
- source_word: σύ μοι ἀκολούθει
  choice: Du folge mir!
  rationale: Das vorangestellte „Du“ bewahrt die Betonung und den Gegensatz zu „er“; der Imperativ „folge“ gibt den fortdauernd verstandenen Auftrag natürlich wieder.
theological_decisions:
- issue: Bedeutung von Jesu „Kommen“ in ἕως ἔρχομαι
  choice: „bis ich komme“ ohne nähere Bestimmung
  alternative: „bis ich wiederkomme“ oder eine ausdrückliche Zuordnung zu einem historischen Ereignis bzw. zur endgültigen Wiederkunft
  rationale: Der Vers bestimmt das gemeinte Kommen nicht näher. Die offene Formulierung bewahrt diese exegetische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert den Übergang von der Bedingung zur scharf abgrenzenden Frage. „Du folge mir!“ ist im Deutschen leicht markiert, bewahrt aber die ausdrückliche Betonung des griechischen σύ.
