source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: de
  text: Das ist der Jünger, der über diese Dinge Zeugnis ablegt und der diese Dinge geschrieben hat,[a] und wir wissen, dass sein Zeugnis wahr ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verwendet für „Zeugnis ablegt“ und „Zeugnis“ verwandte Wörter.
    reason: Macht die im griechischen Text durch μαρτυρῶν und μαρτυρία gebildete Wortverbindung sichtbar.
lexical_decisions:
- source_word: Οὗτός
  choice: Das ist
  rationale: Die identifizierende Wendung verweist auf den zuvor genannten Jünger und klingt im Deutschen natürlich.
- source_word: ὁ μαθητὴς
  choice: der Jünger
  rationale: „Jünger“ ist die übliche und sachlich passende Bezeichnung für einen Nachfolger Jesu im Johannesevangelium.
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: der über diese Dinge Zeugnis ablegt
  rationale: Die Formulierung gibt die charakteristische bzw. fortdauernde Aussage des Präsenspartizips wieder und bewahrt die Wortverbindung mit „Zeugnis“ am Versende.
- source_word: ὁ γράψας ταῦτα
  choice: der diese Dinge aufgeschrieben hat
  rationale: Das Perfekt im Deutschen gibt die abgeschlossene, für den vorliegenden Text relevante Schreibhandlung des Aoristpartizips natürlich wieder.
- source_word: οἴδαμεν
  choice: wir wissen
  rationale: Die griechische Perfektform hat präsentische Bedeutung; der nicht näher bestimmte Sprecherkreis bleibt erhalten.
- source_word: ἀληθὴς
  choice: wahr
  rationale: „Wahr“ ist die direkte und im johanneischen Zusammenhang angemessene Wiedergabe des Prädikatsadjektivs.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: sein Zeugnis
  rationale: Die possessive Form ist im Deutschen idiomatisch; „Zeugnis“ wahrt zugleich den Zusammenhang mit „Zeugnis ablegt“.
theological_decisions:
- issue: Identität und Stimme des „wir“
  choice: Die erste Person Plural wird ohne nähere Bestimmung als „wir wissen“ wiedergegeben.
  alternative: Das „wir“ ausdrücklich als den Evangelisten oder als eine bestätigende Gemeinschaft deuten.
  rationale: Der griechische Text nennt den Sprecherkreis nicht. Die Übersetzung bewahrt diese Offenheit und entscheidet weder die Verfasserfrage noch die Frage nach einer bestätigenden Gemeinschaft.
- issue: Verhältnis zwischen dem Jünger, seinem Zeugnis und der Niederschrift
  choice: Die beiden Partizipialaussagen werden auf denselben Jünger bezogen, ohne darüber hinaus eine Autorschaftstheorie zu formulieren.
  alternative: Zwischen dem bezeugenden Jünger und einem redaktionellen Verfasser unterscheiden.
  rationale: Die griechische Syntax identifiziert den genannten Jünger sowohl als den Bezeugenden als auch als denjenigen, der diese Dinge geschrieben hat; weitergehende Schlussfolgerungen werden nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „diese Dinge“ und die Zeugnis-Sprache werden trotz leichter stilistischer Schwere beibehalten, weil sie die Struktur und den Wortlaut des griechischen Textes prägen.
