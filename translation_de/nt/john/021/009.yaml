id: JHN.21.9
reference: John 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: de
  text: Als sie nun an Land kamen, sahen sie dort ein Kohlenfeuer, auf dem Fisch lag, und Brot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Kohlenfeuer“ übersetzte griechische Wort steht auch in Johannes 18,18 und verbindet diese Szene sprachlich mit dem Ort, an dem Petrus Jesus verleugnete.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Als sie nun
  rationale: „Als“ gibt den zeitlichen Anschluss wieder, „nun“ den fortführenden Charakter von οὖν; zusammen klingt die Wendung im deutschen Erzählstil natürlich.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: an Land gegangen waren
  rationale: Die Formulierung bezeichnet das Verlassen des Bootes und das Betreten des Landes. Das Plusquamperfekt ordnet den Vorgang im deutschen Satz natürlich vor dem Sehen ein.
- source_word: βλέπουσιν
  choice: sahen sie
  rationale: Das historische Präsens wird für einen flüssigen modernen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: ἀνθρακιὰν κειμένην
  choice: dort ein Kohlenfeuer
  rationale: ἀνθρακιά bezeichnet ein Holzkohlenfeuer beziehungsweise eine Kohlenglut. „Kohlenfeuer“ ist knapp und bewahrt die Wortverbindung zu Johannes 18,18; κειμένην wird idiomatisch durch „dort“ als vorhandenes Feuer ausgedrückt.
- source_word: ὀψάριον ἐπικείμενον
  choice: auf dem Fisch lag
  rationale: ὀψάριον bezeichnet im johanneischen Zusammenhang Fisch als Speise; der Singular kann stofflich oder kollektiv verstanden werden. ἐπικείμενον gibt seine Lage auf dem Kohlenfeuer an.
- source_word: ἄρτον
  choice: Brot
  rationale: „Brot“ ist die natürliche unmarkierte Wiedergabe und legt weder Zahl noch Form näher fest.
theological_decisions:
- issue: Historisches Präsens in der Erzählung
  choice: 'βλέπουσιν im deutschen Präteritum wiedergeben: „sahen sie“'
  alternative: 'Das lebhafte Präsens beibehalten: „sehen sie“'
  rationale: Die Tempuswahl betrifft den Erzählstil, nicht den Ereignisinhalt. Das Präteritum entspricht hier natürlichem modernem Deutsch.
- issue: Verbale Verbindung mit der Verleugnung des Petrus
  choice: ἀνθρακιά mit „Kohlenfeuer“ wiedergeben
  alternative: „Feuer“ oder „Glut“
  rationale: „Kohlenfeuer“ bewahrt die im griechischen Text bestehende seltene Wortverbindung zu Johannes 18,18, ohne ihre theologische Bedeutung im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Übersetzung bleibt nahe an der griechischen Bildfolge, ohne „Fisch“ als einen einzelnen Fisch oder als bereits zubereitete Speise näher festzulegen.
