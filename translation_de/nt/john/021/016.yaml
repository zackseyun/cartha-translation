base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: de
  text: 'Er sagte ein zweites Mal zu ihm: „Simon, Sohn des Johannes, liebst du mich?“[a] Er antwortete ihm: „Ja, Herr, du weißt, dass ich dich liebe.“ Da sagte er zu ihm: „Hüte meine Schafe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen in diesem Gespräch zwei verschiedene Verben für „lieben“: Jesus verwendet hier agapaō, Petrus antwortet mit phileō. Manche sehen darin einen Bedeutungsunterschied, andere eine stilistische Variation. Im Haupttext werden beide mit „lieben“ wiedergegeben, damit der mögliche Unterschied nicht überbetont wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: ein zweites Mal
  rationale: Die idiomatische deutsche Wendung bezeichnet die erneute Frage ausdrücklich als die zweite; ein zusätzliches „wieder“ wäre im Deutschen unnötig schwerfällig.
- source_word: Σίμων Ἰωάννου
  choice: Simon, Sohn des Johannes
  rationale: Der Genitiv bezeichnet hier den Vater. „Johannes“ entspricht der vorliegenden griechischen Lesart Ἰωάννου; „Jona“ beruht auf einer anderen Überlieferungsform.
- source_word: ἀγαπᾷς με / φιλῶ σε
  choice: liebst du mich / ich dich liebe
  rationale: Beide Verben können in diesem johanneischen Zusammenhang natürlich mit „lieben“ wiedergegeben werden. Die unterschiedliche Wortwahl wird in einer Fußnote transparent gemacht, ohne eine unsichere Bedeutungsabstufung in den Haupttext einzutragen.
- source_word: Ναί, κύριε
  choice: Ja, Herr
  rationale: „Ja“ gibt die schlichte Bejahung wieder; „Herr“ wahrt die ehrerbietige Anrede an Jesus.
- source_word: σὺ οἶδας
  choice: du weißt
  rationale: Das ausdrücklich gesetzte Pronomen wird im Deutschen beibehalten und trägt die leichte Betonung.
- source_word: Ποίμαινε
  choice: Sei der Hirte
  rationale: Die Formulierung bewahrt das Hirtenbild und umfasst Leitung, Schutz und Fürsorge besser als das engere „weide“.
- source_word: τὰ πρόβατά μου
  choice: meiner Schafe
  rationale: Die konkrete Metapher und Jesu Besitzanspruch werden unmittelbar bewahrt.
theological_decisions:
- issue: Mögliche Bedeutungsunterscheidung zwischen ἀγαπάω und φιλέω
  choice: Beide Verben im Haupttext mit „lieben“ wiedergeben und den griechischen Wortwechsel in einer Fußnote nennen.
  alternative: ἀγαπάω mit „lieben“ und φιλέω etwa mit „lieb haben“ oder „gern haben“ unterscheiden.
  rationale: Der Wortwechsel ist echt, doch eine klare Abstufung ist im johanneischen Sprachgebrauch nicht sicher. Unterschiedliche deutsche Verben könnten eine psychologische oder theologische Deutung festschreiben, die der Text offenlässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich gestaltet; das Hirtenbild bleibt ausdrücklich erhalten. „Ein zweites Mal“ gibt πάλιν δεύτερον idiomatisch wieder, ohne die griechische Häufung mechanisch nachzubilden.
