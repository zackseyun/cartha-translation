source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: de
  text: 'Zum dritten Mal[a] sagte er zu ihm: „Simon, Sohn des Johannes, liebst du mich?“ Petrus war betrübt, weil er zum dritten Mal zu ihm sagte: „Liebst du mich?“ Er sagte zu ihm: „Herr, du weißt alles; du weißt, dass ich dich liebe.“ Jesus sagte zu ihm[b]: „Weide meine Schafe!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier steht im Griechischen φιλέω („lieben, Zuneigung haben“), während Jesus in den beiden vorherigen Fragen ἀγαπάω gebraucht hatte. Manche sehen darin einen bedeutsamen Unterschied; andere halten die Verben in diesem Zusammenhang für weitgehend bedeutungsgleich. Die Übersetzung gibt beide mit „lieben“ wieder und erzwingt keine schärfere Unterscheidung, als der griechische Text eindeutig erkennen lässt.
    reason: lexical_alternative
  - marker: b
    text: 'In Petrus’ Antwort stehen im Griechischen zwei verschiedene Verben für „wissen/kennen“: οἶδα und γινώσκω. Im Deutschen werden beide hier natürlich mit „wissen“ wiedergegeben. Die Wiederholung kann eine Nuance tragen, doch diese lässt sich nicht ohne Überinterpretation eindeutig ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: zum dritten Mal
  rationale: Die Wendung bezeichnet idiomatisch die dritte Wiederholung und bewahrt das Motiv der dreimaligen Frage.
- source_word: Σίμων Ἰωάννου
  choice: Simon, Sohn des Johannes
  rationale: Der Genitiv ist hier am natürlichsten als Vatersname zu verstehen. „Johannes“ entspricht der vorliegenden griechischen Lesart, nicht der abweichenden Überlieferung „Jona“.
- source_word: φιλεῖς / φιλῶ
  choice: liebst du / ich liebe
  rationale: φιλέω bezeichnet Liebe beziehungsweise Zuneigung. „lieben“ wahrt die Ernsthaftigkeit des Gesprächs, ohne gegenüber ἀγαπάω eine im Kontext umstrittene scharfe Unterscheidung festzuschreiben.
- source_word: ἐλυπήθη
  choice: wurde traurig
  rationale: Die Form bezeichnet, dass Petrus Schmerz oder Kummer empfand. „Wurde traurig“ ist in modernem Deutsch natürlich und bewahrt die emotionale Wirkung.
- source_word: Κύριε
  choice: Herr
  rationale: Im Kontext der Anrede des auferstandenen Jesus gibt „Herr“ den Ausdruck angemessen und würdevoll wieder.
- source_word: πάντα σὺ οἶδας
  choice: du weißt alles
  rationale: Die Formulierung bewahrt die umfassende Aussage von πάντα und gibt das betonte Pronomen in natürlichem Deutsch wieder.
- source_word: οἶδας ... γινώσκεις
  choice: du weißt ... du weißt
  rationale: Beide Verben bezeichnen hier ein Wissen oder Erkennen. Eine künstliche Differenzierung im Deutschen würde eine unsichere Nuance überdeuten; die Wiederholung bleibt erhalten.
- source_word: Βόσκε
  choice: Weide
  rationale: βόσκω meint, für Nahrung beziehungsweise Weide zu sorgen. Das deutsche „weiden“ bewahrt das Hirtenbild und unterscheidet sich von einem allgemeineren „hüten“.
- source_word: πρόβατά
  choice: Schafe
  rationale: πρόβατα bezeichnet Schafe, nicht speziell Lämmer, und wahrt damit die Wortwahl gegenüber ἀρνία in Vers 15.
theological_decisions:
- issue: Ob der Wechsel zwischen ἀγαπάω und φιλέω als scharfer Unterschied verschiedener Arten von Liebe wiederzugeben ist
  choice: φιλέω im Haupttext ebenfalls mit „lieben“ wiedergeben
  alternative: φιλέω etwa mit „lieb haben“ oder „Zuneigung haben“ von ἀγαπάω unterscheiden
  rationale: Die Bedeutungsbereiche der beiden Verben überschneiden sich im Koine-Griechischen, und die Tragweite des Wechsels ist umstritten. Der Haupttext soll daher keine bestimmte theologische Deutung erzwingen; die sprachliche Variation wird in einer Fußnote offengelegt.
- issue: Tragweite von Petrus’ Aussage „du weißt alles“
  choice: Die umfassende Formulierung ohne Abschwächung oder dogmatische Erweiterung beibehalten
  alternative: Auf „du weißt alles darüber“ einschränken oder ausdrücklich als Lehrsatz über Allwissenheit ausformulieren
  rationale: Der griechische Text sagt uneingeschränkt πάντα. Die Übersetzung bewahrt diese starke Aussage, ohne ihren unmittelbaren Wortlaut durch eine Auslegung zu verengen oder zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Satzstellung. „Wurde traurig“ vermeidet einen unnötig altertümlichen Ton; „Weide meine Schafe!“ erhält dagegen das verständliche und traditionsreiche Hirtenbild. Sämtliche Fußnotenmarker stehen im Haupttext.
