  to: 'Amen, amen, ich sage dir: Als du jünger warst, hast du dich selbst gegürtet[a] und bist gegangen, wohin du wolltest. Wenn du aber alt wirst, wirst du deine Hände ausstrecken[b], und ein anderer wird dich gürten und dich an einen Ort bringen[c], an den du nicht gehen willst.'
  rationale: Die Revision beseitigt ausschließlich eine deutsche Stil- und Verständlichkeitsunebenheit am Satzende. „An einen Ort bringen, an den du nicht gehen willst“ macht die im griechischen Kontext vorausgesetzte Bewegungsrichtung idiomatisch explizit, ohne die Bildsprache oder die offene Deutung der Aussage zu verändern. Zusätzlich ist die interne Verweisangabe in der theologischen Entscheidungsnotiz von Vers 22 auf Vers 19 zu korrigieren.
  reviewer_model: gpt-5.6-terra
