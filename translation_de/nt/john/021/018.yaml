id: JHN.21.18
reference: John 21:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: de
  text: 'Amen, amen, ich sage dir: Als du jünger warst, hast du dich selbst gegürtet[a] und bist gegangen, wohin du wolltest. Wenn du aber alt wirst, wirst du deine Hände ausstrecken[b], und ein anderer wird dich gürten und dich an einen Ort bringen[c], an den du nicht gehen willst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich geht es um das Befestigen oder Umbinden der Kleidung. Die beiden Vorkommen von „gürten“ stellen Peters frühere Selbstständigkeit seiner späteren Abhängigkeit gegenüber.
    reason: lexical_alternative
  - marker: b
    text: „Deine Hände ausstrecken“ wird häufig als Anspielung auf Peters Tod durch Kreuzigung verstanden. Der folgende Vers erklärt, Jesus habe damit angedeutet, durch welche Art von Tod Petrus Gott verherrlichen würde.
    reason: cross_reference
  - marker: c
    text: 'Oder: „dich mitnehmen“ beziehungsweise „dich führen“. Das griechische Verb kann bezeichnen, dass jemand an einen Ort gebracht wird, zu dem er nicht gehen will.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die im Johannesevangelium charakteristische doppelte Bekräftigungsformel wird in ihrer feierlichen und markanten Form bewahrt; „Amen“ ist im Deutschen geläufig.
- source_word: ὅτε ἦς νεώτερος
  choice: Als du jünger warst
  rationale: Gibt den Komparativ νεώτερος und den Rückblick auf Peters frühere Lebenszeit natürlich wieder.
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  choice: hast du dich selbst gegürtet / ein anderer wird dich gürten
  rationale: Die Wiederholung desselben deutschen Verbs erhält die bewusste lexikalische Entsprechung und den Gegensatz zwischen früherer Selbstständigkeit und späterer Fremdbestimmung. Eine Fußnote erläutert den heute weniger alltäglichen Ausdruck.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: bist gegangen, wohin du wolltest
  rationale: Im Kontext bezeichnet περιπατέω konkrete Fortbewegung. „Gehen“ klingt im modernen Deutsch natürlicher als das engere „umhergehen“ und lässt die betonte Bewegungsfreiheit erkennen.
- source_word: ὅταν δὲ γηράσῃς
  choice: Wenn du aber alt wirst
  rationale: Gibt die zukünftige Zeitbeziehung von ὅταν mit Aorist Konjunktiv und den leichten Kontrast von δέ idiomatisch wieder.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: du wirst deine Hände ausstrecken
  rationale: Bewahrt das konkrete Bild, ohne die im Folgevers erklärte Todesart bereits in den Wortlaut hineinzudeuten.
- source_word: οἴσει
  choice: dich dorthin bringen
  rationale: φέρω kann hier das Verbringen beziehungsweise Mitnehmen an einen Ort bezeichnen. „Bringen“ ist natürliches Deutsch und legt im Gegensatz zu „tragen“ nicht unnötig fest, ob Petrus körperlich getragen wird.
- source_word: ὅπου οὐ θέλεις
  choice: wohin du nicht willst
  rationale: Die Zielrichtung wird mit „wohin“ klar und knapp ausgedrückt; ein zusätzliches „gehen“ ist im Deutschen nicht erforderlich.
theological_decisions:
- issue: Ob die Aussage im Haupttext ausdrücklich als Ankündigung einer Kreuzigung wiederzugeben ist
  choice: Das Bild „deine Hände ausstrecken“ wird unaufgelöst beibehalten.
  alternative: Die Aussage ausdrücklich als Fesselung oder Kreuzigung formulieren.
  rationale: Vers 22 erklärt erst anschließend, dass Jesus damit die Art von Peters Tod bezeichnete. Der Haupttext bewahrt daher die Bildsprache und die erzählerische Abfolge, während eine Fußnote auf die verbreitete Deutung hinweist.
- issue: Ob ζώννυμι im zweiten Vorkommen als „binden“ zu deuten ist
  choice: Beide Vorkommen werden parallel mit „gürten“ übersetzt.
  alternative: Beim zweiten Vorkommen „binden“ verwenden.
  rationale: Die identische Wortwahl des griechischen Textes stellt Peters frühere Selbstbestimmung der späteren Bestimmung durch einen anderen gegenüber. „Binden“ könnte zwar zur Todesankündigung passen, würde diese Deutung jedoch stärker in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche johanneische Formel „Amen, amen“ und das textprägende Verb „gürten“ bleiben erhalten; weniger geläufige oder mehrdeutige Ausdrücke werden knapp in Fußnoten erläutert.
