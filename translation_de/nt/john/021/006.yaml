  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: de
  text: 'Er aber sagte zu ihnen: »Werft das Netz auf der rechten Seite des Bootes aus, und ihr werdet etwas finden.«[a] Da warfen sie es aus, konnten es aber wegen der großen Menge an Fischen nicht mehr einholen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfach: »und ihr werdet finden«; was sie finden werden – im Zusammenhang Fische –, wird im Griechischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Werft … aus
  rationale: Der Aoristimperativ von βάλλω bezeichnet hier das Auswerfen eines Fischernetzes; die deutsche Fügung ist idiomatisch und bewahrt den befehlenden Charakter.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: auf der rechten Seite des Bootes
  rationale: μέρη bezeichnet in dieser Verbindung den rechten Bereich beziehungsweise die rechte Seite des Bootes; die Formulierung ist klar und vermeidet unnötige nautische Fachsprache.
- source_word: τὸ δίκτυον
  choice: das Netz
  rationale: Direkte und natürliche Wiedergabe des singularischen Ausdrucks für ein Fischernetz.
- source_word: καὶ εὑρήσετε
  choice: dann werdet ihr etwas finden
  rationale: Das Objekt bleibt im Griechischen unausgesprochen und ergibt sich aus dem Fischfangkontext. „etwas“ wahrt diese Offenheit besser als die ausdrückliche Ergänzung „Fische“; „dann“ gibt den folgernden Sinn des καί natürlich wieder.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: konnten es … nicht mehr einholen
  rationale: ἰσχύω mit Infinitiv drückt die fehlende Kraft beziehungsweise Fähigkeit aus; „einholen“ bezeichnet bei einem ausgeworfenen Netz die Handlung idiomatisch.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: wegen der großen Menge Fische
  rationale: ἀπό hat hier kausalen Sinn, und πλῆθος bezeichnet die große Anzahl; die deutsche Wendung ist verständlich und behält die quantitative Aussage bei.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt knapp; das im Griechischen nur implizierte Objekt von εὑρήσετε wird im Text zurückhaltend mit „etwas“ ergänzt und in der Fußnote offengelegt.
