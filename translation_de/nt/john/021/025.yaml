id: JHN.21.25
reference: John 21:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: de
  text: Es gibt aber noch vieles andere, was Jesus getan hat. Wenn es einzeln aufgeschrieben würde, könnte, so meine ich, selbst die Welt die Bücher nicht fassen, die dann geschrieben würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „selbst die Welt hätte keinen Raum für die Bücher, die geschrieben würden.“ Das griechische Verb kann sowohl „fassen/enthalten“ als auch „Raum haben für“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen milden weiterführenden Übergang; im Deutschen verbindet „aber“ den abschließenden Nachtrag natürlich mit dem Vorangehenden, ohne einen starken Gegensatz zu erzwingen.
- source_word: ἄλλα πολλὰ
  choice: noch vieles andere
  rationale: Gibt die zusätzliche große Zahl weiterer Taten idiomatisch wieder; das substantivierte Singularwort „vieles“ entspricht im Deutschen natürlich dem griechischen Neutrum Plural.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: was Jesus getan hat
  rationale: ποιέω bezeichnet hier umfassend Jesu Taten; das Perfekt ist im modernen Deutsch für abgeschlossene Handlungen mit gegenwärtiger Relevanz natürlich.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: wenn es einzeln aufgeschrieben würde
  rationale: Bewahrt den hypothetischen Sinn des Konjunktivs und die distributive Bedeutung „je eines / einzeln“, ohne ein unbestimmtes handelndes Subjekt einzuführen.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: selbst die Welt ... nicht
  rationale: „selbst“ gibt die intensive Hervorhebung von αὐτόν und die Steigerung durch οὐδέ natürlich wieder.
- source_word: οἶμαι
  choice: so meine ich
  rationale: Erhält den persönlichen, rhetorisch-reflektierenden Einschub des Verfassers.
- source_word: χωρήσειν
  choice: fassen
  rationale: „Fassen“ kann im Deutschen sowohl räumliches Platzhaben als auch Aufnehmen beziehungsweise Enthalten ausdrücken und bewahrt damit die Bildsprache und Bedeutungsbreite des Verbs.
- source_word: τὰ γραφόμενα βιβλία
  choice: die Bücher, die dann geschrieben würden
  rationale: Der hypothetische Folgesinn des präsentischen Passivpartizips wird im Deutschen idiomatisch ausgedrückt; „dann“ bindet die Bücher klar an die vorausgesetzte Niederschrift.
theological_decisions:
- issue: Rhetorische Übertreibung über das Fassungsvermögen der Welt
  choice: Die räumliche Hyperbel bleibt mit „selbst die Welt ... nicht fassen“ vollständig erhalten.
  alternative: Eine verallgemeinernde Wiedergabe wie „es wären unzählige Bücher“
  rationale: Der griechische Text schließt mit einem bewusst emphatischen Bild. Dieses soll weder wörtlich-systematisch eingeengt noch zu einer bloßen Mengenangabe abgeflacht werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die zwei Sätze vermeiden eine schwerfällige Verschachtelung, während der persönliche Einschub und die abschließende Hyperbel erhalten bleiben.
