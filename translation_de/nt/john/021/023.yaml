source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: de
  text: 'So verbreitete sich unter den Brüdern[a] die Aussage[b], jener Jünger werde nicht sterben. Jesus sagte ihm aber nicht, er werde nicht sterben, sondern: »Wenn ich will, dass er bleibt, bis ich komme, was geht das dich an?«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Brüdern« ist hier die Gemeinschaft der Jünger gemeint; im Griechischen steht die männliche Pluralform ἀδελφοί.
    reason: cultural_note
  - marker: b
    text: 'Oder: »dieses Wort«. Das griechische λόγος kann hier »Wort«, »Aussage« oder »Nachricht« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Jesus verhieß also nicht, dieser Jünger werde niemals sterben, sondern formulierte eine Bedingung: »Wenn ich will, dass er bleibt, bis ich komme …«'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς τοὺς ἀδελφοὺς
  choice: verbreitete sich unter den Brüdern
  rationale: Die Wendung beschreibt, wie eine Nachricht innerhalb einer Gruppe Verbreitung findet. Das idiomatische deutsche »verbreitete sich unter« gibt diesen Sinn natürlich wieder.
- source_word: οὗτος ὁ λόγος
  choice: die Aussage
  rationale: λόγος bezeichnet hier die umlaufende Aussage, die anschließend berichtigt wird. »Aussage« bleibt näher am griechischen Ausdruck als »Gerücht«, ohne vorwegzunehmen, dass der Inhalt falsch verstanden wurde.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: jener Jünger
  rationale: »Jener« bewahrt die demonstrative Bestimmtheit von ἐκεῖνος und passt zum gehobenen, aber verständlichen Erzählstil.
- source_word: οὐκ ἀποθνῄσκει
  choice: werde nicht sterben
  rationale: Im abhängigen Aussagesatz gibt der deutsche Konjunktiv I den Inhalt der verbreiteten Behauptung wieder, ohne ihn als Tatsache zu bestätigen.
- source_word: οὐκ εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς
  choice: Jesus hatte aber nicht zu ihm gesagt
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Jesu vorausgegangene Worte nun gegenüber ihrer späteren Deutung richtiggestellt werden; »aber« bildet den korrigierenden Kontrast von δέ ab.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Wenn ich will, dass er bleibt
  rationale: Die Formulierung gibt die Bedingung und Jesu Willensentscheidung direkt und natürlich wieder. »bleibt« bewahrt den Grundsinn von μένω.
- source_word: ἕως ἔρχομαι
  choice: bis ich komme
  rationale: Die Übersetzung bleibt eng beim griechischen Wortlaut und legt ἔρχομαι nicht ausdrücklich als »wiederkomme« aus.
- source_word: τί πρὸς σέ
  choice: was geht das dich an?
  rationale: Diese geläufige deutsche Wendung gibt die knappe, zurechtweisende griechische Frage treffend wieder.
theological_decisions:
- issue: Art der unter den Jüngern verbreiteten Behauptung
  choice: Die Formulierung als verbreitete »Aussage« wiedergeben und anschließend Jesu ausdrückliche Berichtigung bewahren.
  alternative: Mit »Gerücht« bereits in der ersten Satzhälfte ausdrücklich eine unzuverlässige Überlieferung kennzeichnen.
  rationale: Der Text selbst stellt klar, dass Jesus nicht gesagt hatte, der Jünger werde nicht sterben. »Aussage« erhält diese erzählerische Spannung, statt die Wertung vorwegzunehmen.
- issue: Bedeutung von Jesu bedingter Äußerung
  choice: Die Bedingung »Wenn ich will« unverändert stehen lassen.
  alternative: Die Aussage als Vorhersage oder Verheißung deuten, dass der Jünger bis zu Jesu Kommen leben werde.
  rationale: Der griechische Text formuliert eine hypothetische Bedingung und weist gerade die daraus abgeleitete sichere Behauptung zurück.
- issue: Bezug von ἕως ἔρχομαι
  choice: Mit »bis ich komme« übersetzen.
  alternative: Deutend »bis ich wiederkomme« oder »bis zu meiner Wiederkunft« schreiben.
  rationale: »Komme« wahrt die Offenheit des griechischen Ausdrucks und importiert keine weitergehende eschatologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv I kennzeichnet die umlaufende Behauptung als berichtete Rede. »Was geht das dich an?« ist unmittelbar und idiomatisch, ohne unnötig umgangssprachlich zu wirken.
