source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: de
  text: 'Da sagte jener Jünger, den Jesus liebte, zu Petrus: »Es ist der Herr!« Als Simon Petrus nun hörte, dass es der Herr war, band sich sein Obergewand um – denn er war nur leicht bekleidet[a] – und warf sich in den See.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nackt«. Das griechische Wort kann je nach Kontext vollständige Nacktheit oder unzureichende beziehungsweise geringe Bekleidung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Da sagte
  rationale: οὖν führt hier die Erzählung folgernd und fortschreitend weiter; »Da« klingt im modernen Deutschen natürlich und bewahrt den Anschluss.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: jener Jünger, den Jesus liebte
  rationale: »Jener« gibt das demonstrative ἐκεῖνος wieder; die johanneische Bezeichnung bleibt unverändert erhalten.
- source_word: Ὁ κύριός ἐστιν
  choice: Es ist der Herr!
  rationale: »Herr« bewahrt sowohl die gewöhnliche Anrede als auch das christologische Gewicht von κύριος in der Wiedererkennungsszene.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Als Simon Petrus nun hörte
  rationale: Das Aoristpartizip wird idiomatisch temporal wiedergegeben; »nun« trägt die erneute narrative Verknüpfung durch οὖν.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: band er sich sein Obergewand um
  rationale: ἐπενδύτης bezeichnet ein darüber getragenes Kleidungsstück; διεζώσατο beschreibt dessen Befestigen beziehungsweise Umschlingen am eigenen Körper.
- source_word: ἦν γὰρ γυμνός
  choice: denn er war unbekleidet
  rationale: »Unbekleidet« gibt die Grundbedeutung von γυμνός direkt wieder, ohne im Deutschen zwingend vollständige Nacktheit zu behaupten; die kontextuell mögliche Bedeutung »nur leicht bekleidet« wird in der Fußnote bewahrt.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: warf sich in den See
  rationale: »Warf sich« erhält die anschauliche Kraft der reflexiven Konstruktion mit βάλλω. Für den See Gennesaret ist »See« im Deutschen die natürliche geographische Bezeichnung.
theological_decisions:
- issue: Wiedergabe von κύριος bei der Wiedererkennung Jesu
  choice: Herr
  alternative: Meister
  rationale: »Herr« erhält die im Kontext beabsichtigte Anrede und ihre mögliche christologische Tragweite, ohne sie erklärend auszuweiten.
- issue: Bedeutung von γυμνός für den Bekleidungszustand des Petrus
  choice: unbekleidet
  alternative: nur leicht bekleidet / nackt
  rationale: Das griechische Wort lässt je nach Kontext vollständige Nacktheit oder das Fehlen der üblichen Oberbekleidung zu. »Unbekleidet« hält diese Spannung im Haupttext eher offen; die Alternativen werden in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die traditionelle Wendung »sich gürten« wird vermieden. Die Ausrufezeichnung bei der Wiedererkennung entspricht der lebhaften direkten Rede, ohne dem griechischen Wortlaut zusätzliche Aussageinhalte hinzuzufügen.
