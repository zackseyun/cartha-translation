  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: de
  text: 'Als Petrus ihn nun sah, sagte er zu Jesus: »Herr, was ist mit ihm?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: als Petrus ihn … sah
  rationale: Das Demonstrativpronomen verweist auf den zuvor genannten Jünger; im Deutschen ist hier das natürliche Pronomen »ihn« eindeutig genug.
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet den erzählerischen Anschluss beziehungsweise die Folgerung aus der vorausgehenden Szene.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil als Präteritum wiedergegeben, ohne den Inhalt zu verändern.
- source_word: Κύριε
  choice: Herr
  rationale: Übliche und kontextgerechte Anrede Jesu.
- source_word: οὗτος δὲ τί;
  choice: was ist mit ihm?
  rationale: 'Die knappe, idiomatische Frage meint im Kontext: Was wird mit diesem Jünger geschehen? Die deutsche Form bewahrt die Kürze, ohne eine ausdrücklich nicht genannte Ergänzung einzufügen.'
theological_decisions:
- issue: Unausgesprochener Bezug der elliptischen Frage
  choice: Die Ellipse wird mit »Was ist mit ihm?« bewahrt.
  alternative: »Was wird aber mit ihm geschehen?«
  rationale: Der griechische Text nennt weder ausdrücklich sein künftiges Geschick noch seine Aufgabe. Die offene Form vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und natürlich; das historische Präsens wird im deutschen Erzählkontext idiomatisch als Präteritum wiedergegeben.
