  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: de
  text: Daraufhin befragte der Hohe Priester Jesus zu seinen Jüngern und zu seiner Lehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fragte Jesus nach seinen Jüngern und nach seiner Lehre“. Das griechische Verb kann sowohl „fragen“ als auch „befragen“ bedeuten; „befragte“ entspricht hier dem Rahmen einer förmlichen Anhörung.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: οὖν
  choice: Daraufhin
  rationale: Kennzeichnet die Fortführung der Erzählung und den Anschluss an die vorausgehenden Ereignisse, ohne eine stärkere logische Folgerung auszudrücken.
- source_word: ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Gibt die bestimmte Amtsbezeichnung im Singular unmittelbar wieder, ohne den historischen Bezug durch einen Namen zu harmonisieren.
- source_word: ἠρώτησεν
  choice: befragte
  rationale: Das Verb kann allgemein „fragen“ oder kontextbezogen „befragen“ bedeuten. „Befragte“ passt zur förmlichen Anhörung, ohne die stärkere Konnotation von „verhörte“ einzutragen.
- source_word: περὶ
  choice: zu
  rationale: Bezeichnet in beiden Vorkommen den Gegenstand der Befragung; „zu“ ist in dieser Konstruktion natürliches modernes Deutsch.
- source_word: μαθητῶν
  choice: Jüngern
  rationale: „Jünger“ ist die etablierte und präzise Bezeichnung für Schüler und Anhänger eines Lehrers im Evangelienkontext.
- source_word: διδαχῆς
  choice: Lehre
  rationale: „Lehre“ gibt sowohl Inhalt als auch Tätigkeit des Lehrens knapp und idiomatisch wieder, ohne die stärker systematische Färbung von „Doktrin“.
- source_word: αὐτοῦ
  choice: seinen / seiner
  rationale: Das Pronomen bezieht sich in beiden Fällen auf Jesus und wird entsprechend den deutschen Kasusformen possessiv wiedergegeben.
theological_decisions:
- issue: Amtsbezeichnung ἀρχιερεύς in einem Kontext, in dem die Erzählung Annas betrifft und Kajaphas der römisch anerkannte amtierende Hohe Priester war
  choice: Die griechische Amtsbezeichnung unmittelbar mit „der Hohe Priester“ wiedergeben
  alternative: „Annas, der Hohe Priester“ oder „der Oberpriester“
  rationale: Die Übersetzung bewahrt die Darstellung des Evangelisten, ohne den historischen Bezug im Haupttext zu harmonisieren oder einen Namen einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist klar und mündlich verständlich; „befragte“ wahrt den förmlichen Kontext, ohne ein gewaltsames Verhör anzudeuten.
