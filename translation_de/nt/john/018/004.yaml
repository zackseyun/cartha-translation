  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente wieder: Jesu umfassendes Wissen um das Kommende, sein Heraustreten und die Frage an die Gruppe. Die Satzaufteilung ist grundsätzlich möglich. Die Stellung von „nun“ in „Jesus nun wusste“ ist jedoch im modernen Standarddeutsch unnatürlich und kann den Anschluss von οὖν weniger klar erkennen lassen.'
