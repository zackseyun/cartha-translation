  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: de
  text: 'Jesus wusste nun alles, was über ihn kommen würde. Er trat hinaus und sagte zu ihnen: »Wen sucht ihr?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Kennzeichnet hier den erzählerischen und folgernden Anschluss. »Nun« klingt im modernen deutschen Erzählstil natürlicher als ein stark kausales »daher«.
- source_word: εἰδὼς
  choice: wusste
  rationale: Gibt das vorzeitige beziehungsweise begleitende Wissen Jesu idiomatisch wieder, ohne über den griechischen Wortlaut hinauszugehen.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: alles, was über ihn kommen würde
  rationale: Bewahrt die umfassende Aussage von πάντα sowie den Sinn bevorstehender, ihn treffender Ereignisse. Die Konstruktion mit »würde« ist im Deutschen natürlich und macht den Zukunftsbezug aus der damaligen Erzählperspektive deutlich.
- source_word: ἐξῆλθεν
  choice: trat hinaus
  rationale: Gibt die räumliche Bewegung klar und natürlich wieder. »Trat hinaus« passt zum unmittelbaren Hervortreten Jesu, ohne zusätzliche Dramatik einzutragen.
- source_word: λέγει
  choice: fragte
  rationale: Der Inhalt der direkten Rede ist eine Frage. »Fragte« überträgt das historische Präsens in idiomatisches deutsches Erzählpräteritum und vermeidet das schwerfällige »sagte zu ihnen«.
- source_word: Τίνα ζητεῖτε;
  choice: Wen sucht ihr?
  rationale: »Wen« entspricht dem Akkusativobjekt; »sucht ihr« bewahrt den gegenwärtigen Vorgang und den würdigen, zugleich natürlichen Ton.
theological_decisions:
- issue: Jesu Vorwissen im Erzählzusammenhang
  choice: Die Übersetzung sagt umfassend, dass Jesus alles wusste, was über ihn kommen würde.
  alternative: Eine stärker auslegende Fassung könnte ausdrücklich von allwissendem oder erschöpfendem Vorwissen sprechen.
  rationale: Der Vers betont Jesu volle Kenntnis der bevorstehenden Ereignisse, formuliert daraus jedoch keine weitergehende systematisch-theologische Aussage.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens λέγει wird zugunsten eines flüssigen deutschen Präteritums als »fragte« wiedergegeben.
