  terminology: „alles, was über ihn kommen würde“, „trat hinaus“ und „Wen sucht ihr?“ sind sachgerecht. Es sind keine besonderen Namen oder theologischen Fachbegriffe zu harmonisieren. Die Aussage über Jesu Wissen wird weder abgeschwächt noch dogmatisch ausgeweitet.
