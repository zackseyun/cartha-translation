base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: de
  text: 'Simon Petrus stand und wärmte sich. Da sagten sie zu ihm[a]: »Du bist doch nicht auch einer von seinen Jüngern?« Er leugnete es und sagte: »Ich bin es nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bist doch sicher nicht auch einer von seinen Jüngern?« Die griechische Frage mit μή erwartet eine verneinende Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος ἑστὼς
  choice: Simon Petrus stand da
  rationale: Die periphrastische Verbform beschreibt den anhaltenden Zustand des Stehens. Das milde δέ führt die Szene weiter, ohne einen starken Gegensatz zu markieren; im Deutschen genügt hier der natürliche Erzählfluss. „Da“ gibt den im Zusammenhang vorausgesetzten Ort knapp wieder.
- source_word: θερμαινόμενος
  choice: und wärmte sich
  rationale: Das Partizip bezeichnet, dass Petrus sich wärmte. Ein Feuer wird in diesem Vers nicht ausdrücklich genannt und daher nicht ergänzt.
- source_word: εἶπον οὖν αὐτῷ
  choice: Da sagten sie zu ihm
  rationale: Das nicht ausdrücklich genannte Subjekt ist im griechischen Plural enthalten. οὖν verbindet die Frage folgernd mit der Situation; das deutsche „Da“ wahrt den erzählerischen Zusammenhang natürlich.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Du bist doch nicht auch ...?
  rationale: μή signalisiert bei dieser Frage die Erwartung einer verneinenden Antwort. „doch nicht auch“ gibt sowohl diese Erwartung als auch καὶ σὺ idiomatisch wieder.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: einer von seinen Jüngern
  rationale: ἐκ mit dem Genitiv bezeichnet die Zugehörigkeit zu einer Gruppe. Die gewählte Formulierung ist im modernen Deutsch natürlich.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Er leugnete es
  rationale: Das Verb bezeichnet das Bestreiten beziehungsweise Nichtanerkennen. „Es“ bezieht sich auf die in der Frage enthaltene Behauptung, ohne die Aussage theologisch auszuweiten.
- source_word: Οὐκ εἰμί
  choice: Ich bin es nicht
  rationale: Die knappe Antwort greift die Frage elliptisch auf. „Es“ ist im Deutschen für diese Rückbeziehung natürlich; ein zusätzliches „Nein“ wird nicht eingefügt.
theological_decisions:
- issue: Umfang der Verleugnung des Petrus
  choice: Die Aussage wird als unmittelbares Leugnen seiner Zugehörigkeit zu Jesu Jüngern wiedergegeben.
  alternative: Die Antwort ausdrücklich zu „Ich gehöre nicht zu seinen Jüngern“ auszubauen.
  rationale: Der griechische Text antwortet knapp und elliptisch auf die Frage. Die Übersetzung wahrt diese Zurückhaltung und erweitert die Verleugnung nicht zu einer umfassenderen theologischen Aussage.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die negative Antworterwartung der Frage wird bewahrt, ohne sie unnötig zu verstärken.
