  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: de
  text: 'Pilatus antwortete: »Bin ich etwa ein Jude?[a] Dein eigenes Volk und die Hohen Priester haben dich mir ausgeliefert. Was hast du getan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Judäer«. Das griechische Wort kann je nach Zusammenhang eine ethnische beziehungsweise religiöse Zugehörigkeit (»Jude«) oder eine regionale Herkunft (»Judäer«) bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche deutsche Wiedergabe des erzählenden Verbs in einem Dialog.
- source_word: Μήτι ἐγὼ Ἰουδαῖός εἰμι
  choice: Bin ich etwa ein Jude?
  rationale: »Etwa« bewahrt den rhetorischen Charakter der Frage und zeigt, dass Pilatus eine verneinende Antwort erwartet.
- source_word: Ἰουδαῖός
  choice: Jude
  rationale: Der Zusammenhang stellt Pilatus der ethnisch-nationalen Gemeinschaft Jesu gegenüber. »Jude« ist hier die verständlichste Wiedergabe; die mögliche regionale Bedeutung »Judäer« wird in der Fußnote erhalten.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: dein eigenes Volk
  rationale: »Volk« gibt ἔθνος hier als ethnisch-nationale Gemeinschaft wieder; »eigenes« bringt die betonte Zugehörigkeit und Pilatus’ Distanzierung zum Ausdruck.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Gemeint ist die Jerusalemer priesterliche Führungsschicht im Plural. Die Formulierung ist im heutigen Deutsch unmittelbar verständlich und vermeidet die mögliche Fehlvorstellung mehrerer gleichzeitig amtierender Hoher Priester.
- source_word: παρέδωκάν σε ἐμοί
  choice: haben dich mir ausgeliefert
  rationale: »Ausliefern« bezeichnet passend die Übergabe an die staatliche Gewalt und wahrt den gerichtlichen Zusammenhang, ohne hier ausdrücklich »verraten« einzutragen.
- source_word: τί ἐποίησας
  choice: Was hast du getan?
  rationale: Das deutsche Perfekt bezeichnet natürlich eine abgeschlossene Handlung, deren Folgen für das gegenwärtige Verhör maßgeblich sind.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαῖος im Johannesevangelium
  choice: Jude
  alternative: Judäer
  rationale: Pilatus grenzt sich in seiner rhetorischen Frage von Jesu »eigenem Volk« ab; daher liegt hier die ethnisch-nationale Bedeutung näher als eine rein regionale. Weil Ἰουδαῖος je nach Kontext auch »Judäer« bedeuten kann, bleibt diese Möglichkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich, ohne umgangssprachlich zu wirken; »etwa« erhält Pilatus’ abweisend-rhetorischen Ton.
