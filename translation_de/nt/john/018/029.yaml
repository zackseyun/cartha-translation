source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: de
  text: 'Da ging Pilatus zu ihnen hinaus und sagte: „Welche Anklage erhebt ihr gegen diesen Mann?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: ging … hinaus
  rationale: Die Verbindung aus ἐξέρχομαι und ἔξω bezeichnet die Bewegung aus dem Inneren nach draußen. „ging … hinaus“ gibt beide Elemente natürlich wieder.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die Erzählung folgernd weiter. „Da“ ist im deutschen Erzählstil natürlich und bewahrt den Zusammenhang, ohne eine zu starke logische Folgerung auszudrücken.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu den wartenden Personen hin.
- source_word: φησίν
  choice: sagte
  rationale: Das historische Präsens wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Τίνα κατηγορίαν
  choice: Welche Anklage
  rationale: κατηγορία bezeichnet im gerichtlichen Zusammenhang eine Anklage beziehungsweise Beschuldigung. „Anklage“ wahrt den forensischen Sinn.
- source_word: φέρετε
  choice: erhebt ihr
  rationale: φέρω bedeutet in diesem Rechtskontext, eine Anklage vorzubringen. Die feste deutsche Verbindung „Anklage erheben“ ist klar und idiomatisch.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: gegen diesen Mann
  rationale: κατά mit Genitiv bedeutet im gerichtlichen Zusammenhang „gegen“; ἄνθρωπος bezeichnet hier einen bestimmten männlichen Menschen.
theological_decisions: []
