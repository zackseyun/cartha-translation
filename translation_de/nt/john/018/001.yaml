  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: de
  text: Nachdem Jesus dies gesagt hatte, ging er mit seinen Jüngern hinaus auf die andere Seite des Kidronbachs[a]. Dort war ein Garten, in den er und seine Jünger hineingingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die andere Seite der Kidronschlucht“. Das griechische Wort bezeichnet einen Wasserlauf, der nur zeitweise Wasser führt; je nach örtlicher Auffassung kann auch eine Schlucht oder ein Bachtal gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Nachdem Jesus das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet hier natürlich die zeitliche Abfolge. Die Formulierung ist idiomatisches modernes Deutsch und hält den Rückbezug auf Jesu vorherige Worte offen.
- source_word: ἐξῆλθεν
  choice: ging ... hinaus
  rationale: Die konkrete Bewegungsbedeutung von ἐξέρχομαι bleibt erhalten; „hinausgehen“ passt zum johanneischen Erzählstil.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: mit seinen Jüngern
  rationale: σύν mit Dativ bezeichnet die Begleitung; die knappe deutsche Wendung gibt dies vollständig und natürlich wieder.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: auf die andere Seite des Kidronbachs
  rationale: πέραν bezeichnet die jenseitige Seite beziehungsweise die Bewegung dorthin. „Kidronbach“ ist verständlich, während die Fußnote die genauere Bedeutung des saisonalen Wasserlaufs festhält.
- source_word: ὅπου ἦν κῆπος
  choice: Dort war ein Garten
  rationale: Die Aufteilung in einen neuen deutschen Satz gibt den örtlichen Relativanschluss natürlich wieder, ohne Information hinzuzufügen.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: in den ... hineingingen
  rationale: Die durch εἰς ausgedrückte Bewegung in den Garten hinein wird ausdrücklich bewahrt.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: er und seine Jünger
  rationale: Das ausdrückliche αὐτός wird mit „er“ wiedergegeben; „er selbst“ würde im Deutschen eine hier nicht erforderliche Hervorhebung erzeugen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Bewegungsrichtung, Begleitung und die Wiederholung der Jünger bleiben erhalten.
