  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: de
  text: 'Da sagte Jesus zu Petrus: „Steck das Schwert in die Scheide.[a] Soll ich den Kelch[b], den der Vater mir gegeben hat, etwa nicht trinken?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Schwertscheide“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Kelch“ ist ein biblisches Bild für ein von Gott zugeteiltes Leiden oder Geschick; vergleiche Jesu Gebet in Gethsemane (Matthäus 26,39; Markus 14,36; Lukas 22,42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die unmittelbare narrative Reaktion Jesu; „Da“ ist im modernen Deutschen natürlich und bewahrt den fortführenden Zusammenhang.
- source_word: Βάλε
  choice: Steck
  rationale: Im Zusammenhang mit Schwert und Scheide ist „stecken“ die idiomatische deutsche Wiedergabe des Befehls, etwas hineinzutun.
- source_word: μάχαιραν
  choice: Schwert
  rationale: Bezeichnet eine Klingenwaffe; „Schwert“ ist in dieser Festnahmeszene die klare, etablierte Wiedergabe, ohne die Bauart unnötig einzuengen.
- source_word: θήκην
  choice: Scheide
  rationale: „Scheide“ ist die geläufige deutsche Bezeichnung für die Hülle eines Schwertes und bewahrt das konkrete Bild.
- source_word: ποτήριον
  choice: Kelch
  rationale: Bewahrt die biblisch geprägte Metapher für das von Gott zugeteilte Leiden oder Geschick; eine erklärende Paraphrase im Haupttext würde die Aussage verengen.
- source_word: δέδωκέν
  choice: gegeben hat
  rationale: Gibt den griechischen Perfekt als vollzogene Handlung mit gegenwärtiger Bedeutung natürlich wieder.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Entspricht dem griechischen Ausdruck ohne ergänztes Possessivpronomen und bewahrt den johanneischen Sprachgebrauch.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Soll ich … etwa nicht trinken?
  rationale: Die rhetorische Frage erwartet eine bejahende Antwort. „etwa nicht“ macht diese Stoßrichtung im heutigen Deutsch deutlich, ohne sie in eine Aussage umzuwandeln.
theological_decisions:
- issue: Bedeutung des Kelches
  choice: Die Kelchmetapher bleibt im Haupttext unaufgelöst und bezeichnet im Zusammenhang das vom Vater zugeteilte Leiden beziehungsweise Geschick.
  alternative: Das Leiden Jesu; sein Tod; der Kelch des göttlichen Zorns
  rationale: Der Kontext trägt die Vorstellung zugeteilten Leidens, doch der Vers selbst legt die Metapher nicht auf eine engere dogmatische Deutung fest.
- issue: Jesu Verhältnis zum Vater
  choice: Die Formulierung stellt Jesu willige Annahme dessen dar, was der Vater ihm gegeben hat, ohne zusätzliche dogmatische Erläuterung.
  alternative: „den mein Vater mir bestimmt hat“ oder eine ausführliche Erklärung der innertrinitarischen Beziehung
  rationale: Eine unmittelbare Übersetzung wahrt sowohl die im Text ausgesagte Unterordnung im Handeln als auch Jesu Würde und fügt dem Wortlaut nichts hinzu.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Steck … in die Scheide“ ist bewusst idiomatisch; „Kelch“ bewahrt die biblische Metapher. Beide Fußnotenmarker stehen an den inhaltlich passenden Stellen im Haupttext.
