source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: de
  text: 'Sie antworteten ihm: »Jesus, den Nazoräer.« Er sagte zu ihnen: »Ich bin es.« Auch Judas, der ihn auslieferte, stand bei ihnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, den Nazoräer
  rationale: Der bestimmte Beiname wird idiomatisch wiedergegeben; »Nazoräer« bewahrt die traditionelle, im Johannesevangelium verwendete Bezeichnung.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Zusammenhang ist dies die natürliche deutsche Antwort auf die Suche nach Jesus. Zugleich bleibt durch die knappe Formulierung ein möglicher theologischer Nachklang der johanneischen Ich-bin-Worte hörbar, ohne ihn ausdrücklich festzulegen.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: der ihn auslieferte
  rationale: Das präsentische Partizip bezeichnet Judas in seiner gerade ausgeübten Rolle; »ausliefern« trifft den Vorgang genauer und neutraler als das stärker wertende »verraten«.
- source_word: μετ’ αὐτῶν
  choice: bei ihnen
  rationale: Die Formulierung gibt Judas’ räumliche und gruppenbezogene Stellung auf der Seite der Suchenden natürlich wieder.
theological_decisions:
- issue: Möglicher absoluter Gebrauch von Ἐγώ εἰμι
  choice: Ich bin es
  alternative: Ich bin
  rationale: Die Identifikationsfrage des Kontexts legt im Deutschen »Ich bin es« nahe. Die Übersetzung vermeidet eine ungrammatische Härte, ohne den möglichen theologischen Bezug der griechischen Wendung dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper johanneischer Satzführung. »Nazoräer« ist bewusst bibelsprachlich, aber weiterhin verständlich; »auslieferte« wahrt die konkrete Handlungsperspektive.
