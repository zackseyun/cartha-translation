  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: de
  text: Ihr habt aber den Brauch, dass ich euch am Passafest einen freilasse. Wollt ihr nun, dass ich euch den König der Juden[a] freilasse?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „König der Judäer“. Das griechische Wort kann je nach Zusammenhang sowohl Juden als auch Judäer bezeichnen; hier steht es in der festen Titelformel der Passionsgeschichte.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: Brauch
  rationale: „Brauch“ bezeichnet hier natürlich und präzise eine etablierte gesellschaftliche Praxis, nicht eine persönliche Gewohnheit.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: dass ich euch … einen freilasse
  rationale: Die Formulierung gibt den Inhalt des Brauchs wieder. „Einen“ bewahrt die knappe substantivische Form des griechischen ἕνα, während „freilassen“ dem rechtlichen Zusammenhang entspricht.
- source_word: ἀπολύω
  choice: freilassen
  rationale: Im Zusammenhang mit einem Gefangenen ist „freilassen“ im Deutschen präzise und idiomatisch; dieselbe Wiedergabe wird bei beiden Vorkommen beibehalten.
- source_word: ἐν τῷ πάσχα
  choice: zum Passafest
  rationale: „Zum Passafest“ bezeichnet idiomatisch den Zeitpunkt beziehungsweise festlichen Anlass des Brauchs und macht deutlich, dass πάσχα hier das Fest meint.
- source_word: βούλεσθε οὖν
  choice: Wollt ihr nun
  rationale: „Nun“ gibt den folgernden Übergang οὖν wieder; „wollt ihr“ ist eine natürliche, heutige Entsprechung zu βούλεσθε.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: den König der Juden
  rationale: Die Wendung fungiert in der Passionsgeschichte als feste königliche beziehungsweise messianische Anklagebezeichnung. Die Großschreibung von „König“ folgt der deutschen Substantivschreibung und legt darüber hinaus keine besondere Titulatur fest.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων in τὸν βασιλέα τῶν Ἰουδαίων
  choice: König der Juden
  alternative: König der Judäer
  rationale: In der johanneischen Passionsgeschichte ist dies die feststehende Bezeichnung der gegen Jesus erhobenen königlichen beziehungsweise messianischen Anklage. „Juden“ bewahrt diese historische und narrative Titelformel, während die mögliche regionale Bedeutung „Judäer“ in einer Fußnote transparent gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den Gegensatz zum vorausgehenden Zusammenhang; „Brauch“ und „freilassen“ sind allgemein verständlich und zugleich sachlich präzise. Die Satzstellung bleibt natürlich, ohne die Wiederholung des griechischen Verbs zu beseitigen.
