review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der gerichtliche Charakter sind zutreffend erfasst. Die Ellipse „wenn aber recht“ ist im gegenwärtigen Standarddeutsch jedoch unvollständig und erschwert die eindeutige Zuordnung zu Jesu Reden. Eine ausgeschriebene Entsprechung zu κακῶς/καλῶς gibt den griechischen Gegensatz klarer wieder.
  naturalness: „Wenn ich Unrecht geredet habe“ ist verständlich, aber weniger idiomatisch als „wenn ich falsch gesprochen habe“. Die vollständige zweite Bedingung „wenn ich aber richtig gesprochen habe“ ist natürliches modernes Standarddeutsch.
  terminology: „Bezeuge“ bewahrt den forensischen Imperativ μαρτύρησον. „Was daran falsch war“ bezieht sich präzise auf das behauptete Fehlverhalten in Jesu Rede, ohne „das Böse“ unnötig zu moralisieren. „Schlagen“ bleibt für δέρεις angemessen weit. Die bisherige Fußnote über „auspeitschen“ ist als Alternative in diesem Vers zu stark und nicht nötig.
  issues:
  - severity: medium
    issue: Unvollständige zweite Bedingung
    rationale: „wenn aber recht“ lässt im modernen Deutschen das Verb und den Bezug auf Jesu Sprechen zu stark aus. Das Griechische ist zwar elliptisch, aber eine vollständige deutsche Klausel ist zur klaren Wiedergabe sinnvoll.
  - severity: low
    issue: Fußnotenalternative „auf mich einschlagen“ und Hinweis auf „auspeitschen“
    rationale: „Auf jemanden einschlagen“ legt eher wiederholte Schläge nahe; „auspeitschen“ ist in diesem unmittelbaren Kontext eine unnötig starke Konkretisierung. „Schlagen“ deckt die lexikalische Spannweite hier ausreichend ab.
  revised_text: 'Jesus antwortete ihm: „Wenn ich falsch gesprochen habe, bezeuge, was daran falsch war; wenn ich aber richtig gesprochen habe, warum schlägst du mich?“'
