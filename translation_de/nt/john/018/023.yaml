  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Wenn ich falsch gesprochen habe, bezeuge, was daran falsch war; wenn ich aber richtig gesprochen habe, warum schlägst du mich?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Jesus antwortete ihm
  rationale: Natürliches modernes Deutsch, das das gewöhnliche narrative Antwortverb und den Dativ wahrt.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Wenn ich Unrecht geredet habe
  rationale: „Unrecht reden“ gibt den sachlich-moralischen Sinn von κακῶς im gerichtlichen Zusammenhang wieder und bewahrt den Gegensatz zu καλῶς.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: dann bezeuge, was daran unrecht war
  rationale: „Bezeuge“ erhält den forensischen Zeugnischarakter; die Ausformulierung macht den substantivierten griechischen Ausdruck im Deutschen verständlich, ohne das behauptete Unrecht näher festzulegen.
- source_word: εἰ δὲ καλῶς
  choice: wenn aber recht
  rationale: Die knappe, elliptische Form bewahrt den scharfen Gegensatz zwischen κακῶς und καλῶς; „recht“ bezeichnet hier richtiges bzw. angemessenes Reden.
- source_word: τί με δέρεις
  choice: warum schlägst du mich?
  rationale: „Schlagen“ ist breit genug für δέρω und passt zum einzelnen Schlag im unmittelbaren Kontext, ohne die Art oder Schwere übermäßig festzulegen.
theological_decisions:
- issue: Jesu Reaktion auf ungerechte Gewalt
  choice: Als rechtlich-moralische Herausforderung formuliert, die Beweis verlangt und die Gewalttat infrage stellt.
  alternative: Eine stärker anklagende Paraphrase oder eine Abschwächung des forensischen Tons.
  rationale: Der griechische Text verbindet die Aufforderung zum Zeugnis mit der Frage nach dem Grund des Schlages. Die Übersetzung erhält diese Spannung, ohne zusätzliche ethische oder dogmatische Aussagen einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und argumentativ. „Unrecht … recht“ bildet den griechischen Gegensatz hörbar ab; „bezeuge“ erhält den gerichtlichen Ton.
