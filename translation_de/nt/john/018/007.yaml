  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: de
  text: 'Da fragte er sie noch einmal: „Wen sucht ihr?“ Sie antworteten: „Jesus, den Nazarener[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus von Nazaret.“ Griechisch: „Jesus, den Nazarener.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Da … noch einmal
  rationale: „Da“ führt die Erzählung folgerichtig weiter und gibt οὖν natürlich wieder; „noch einmal“ bezeichnet die Wiederholung der Frage.
- source_word: ἐπηρώτησεν αὐτούς
  choice: fragte er sie
  rationale: Die schlichte deutsche Wendung gibt die direkte Frage ohne unnötig verhörartigen Beiklang wieder.
- source_word: Τίνα ζητεῖτε;
  choice: Wen sucht ihr?
  rationale: „Wen“ entspricht der Objektfunktion von Τίνα; „sucht“ bewahrt die knappe und im Johannesevangelium bedeutsame Wortwahl von ζητέω.
- source_word: οἱ δὲ εἶπαν
  choice: Sie antworteten
  rationale: Im deutschen Dialog gibt „antworteten“ den durch δέ markierten Fortgang natürlich wieder; der unmittelbare Kontext macht den Bezug eindeutig.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, den Nazarener
  rationale: „Den Nazarener“ bewahrt die griechische Bezeichnung als identifizierenden Beinamen, statt sie stillschweigend in eine Herkunftsangabe umzudeuten.
theological_decisions:
- issue: Wiedergabe von Ναζωραῖος als Bezeichnung für Jesus
  choice: den Nazarener
  alternative: Jesus von Nazaret
  rationale: Die Formulierung ist vor allem eine historische und lexikalische Kennzeichnung. „Den Nazarener“ bleibt näher an der griechischen Ausdrucksweise; die geläufige Herkunftsangabe wird als mögliche Wiedergabe in der Fußnote genannt, ohne weitergehende theologische Schlüsse einzutragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede bleibt knapp; „ihr“ ist in der konkreten Anrede einer Gruppe idiomatisch. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Bezeichnung.
