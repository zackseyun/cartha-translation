source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: de
  text: 'Da sagte Pilatus zu ihm: „Dann bist du also ein König?“ Jesus antwortete: „Du sagst, dass ich ein König bin.[a] Dazu bin ich geboren, und dazu bin ich in die Welt gekommen: um für die Wahrheit Zeugnis abzulegen. Jeder, der aus der Wahrheit ist, hört auf meine Stimme.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du sagst es: Ich bin ein König“ oder „Du sagst zu Recht, dass ich ein König bin.“ Die knappe griechische Formulierung kann als qualifizierte Zustimmung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Dann … also
  rationale: Gibt den folgernden Charakter von Pilatus’ Frage im natürlichen Deutschen wieder.
- source_word: βασιλεὺς
  choice: König
  rationale: Ist die kontextgemäße Grundbedeutung und bewahrt sowohl die politische als auch die messianische Spannung.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Du sagst, dass ich ein König bin
  rationale: Folgt der knappen griechischen Formulierung eng und legt sie weder eindeutig als nachdrückliche Zustimmung noch als Distanzierung fest.
- source_word: γεγέννημαι
  choice: bin ich geboren
  rationale: Natürliches modernes Deutsch; der griechische Perfekt bezeichnet die Geburt mit ihrer fortdauernden Bedeutung, ohne hier den theologisch aufgeladenen Ausdruck „gezeugt“ zu verlangen.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: bin ich in die Welt gekommen
  rationale: Bewahrt die johanneische Rede von Jesu Kommen in die Welt und hält sie von der vorherigen Aussage über seine Geburt unterschieden.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: für die Wahrheit Zeugnis abzulegen
  rationale: Bewahrt die rechtlich-zeugnishafte Sprache des Verbs und gibt den Dativ im Deutschen idiomatisch wieder.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Jeder, der aus der Wahrheit ist
  rationale: Erhält die johanneische Herkunfts- und Zugehörigkeitssprache von ἐκ, auch wenn die Formulierung bewusst markanter ist als eine erklärende Paraphrase.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: hört auf meine Stimme
  rationale: Drückt im Deutschen sowohl das Hören als auch die bereitwillige Beachtung aus und bewahrt das Motiv der Stimme.
theological_decisions:
- issue: Nuance von Jesu Antwort an Pilatus (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: 'Als knappe, qualifizierte Zustimmung transparent wiedergegeben: „Du sagst, dass ich ein König bin“'
  alternative: '„Du sagst es: Ich bin ein König“ oder „Du sagst zu Recht, dass ich ein König bin“'
  rationale: Der griechische Wortlaut kann als qualifizierte Bejahung verstanden werden, formuliert aber weder eine ausdrückliche nachdrückliche Bestätigung noch eine Verneinung. Haupttext und Fußnote bewahren diese Spannung.
- issue: Verhältnis von Geburt und Kommen in die Welt
  choice: Beide Aussagen getrennt und parallel beibehalten
  alternative: Beide Glieder zu einer allgemeinen Aussage über Jesu Sendung zusammenziehen
  rationale: Der griechische Text unterscheidet Jesu Geborensein von seinem Kommen in die Welt. Die Übersetzung bewahrt diese mögliche christologische Bedeutung, ohne sie durch einen Zusatz auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Dazu … und dazu …“ bildet die bewusste Parallelität des griechischen Textes ab. „Aus der Wahrheit“ bleibt als prägnante johanneische Ausdrucksweise erhalten, statt interpretierend zu „zur Wahrheit gehören“ geglättet zu werden.
