source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: de
  text: 'Pilatus sagte zu ihm: „Was ist Wahrheit?“ Nachdem er das gesagt hatte, ging er wieder hinaus zu den Juden[a] und sagte zu ihnen: „Ich finde keinen Anklagegrund gegen ihn.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den jüdischen Anführern“. Im Johannesevangelium kann „die Juden“ bisweilen genauer die judäischen Autoritäten oder die im jeweiligen Zusammenhang als Gegner Jesu auftretende Vertretergruppe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilatus sagte zu ihm
  rationale: Das historische Präsens λέγει wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Was ist Wahrheit?
  rationale: Das artikellose ἀλήθεια wird ohne bestimmten Artikel übersetzt; so bleibt die offene, allgemein gehaltene Formulierung des Griechischen erhalten.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Die vorzeitige Handlung des Aoristpartizips εἰπών wird durch einen idiomatischen temporalen Nebensatz wiedergegeben.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: ging er wieder zu den Juden hinaus
  rationale: πάλιν bezeichnet die Wiederholung, ἐξῆλθεν die Bewegung nach draußen. Die Stellung von „hinaus“ macht im Deutschen deutlich, dass Pilatus aus dem Innenraum zu der draußen befindlichen Gruppe ging.
- source_word: καὶ λέγει αὐτοῖς
  choice: und sagte zu ihnen
  rationale: Auch dieses historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Ich finde keinen Anklagegrund gegen ihn
  rationale: αἰτία hat hier im gerichtlichen Zusammenhang den Sinn eines Grundes für eine Anklage. „Anklagegrund“ wahrt diesen forensischen Sinn prägnanter als das allgemeinere „Schuld“; ἐν αὐτῷ wird in natürlicher deutscher Rechtssprache mit „gegen ihn“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαίους in der johanneischen Passionsgeschichte
  choice: Im Haupttext steht „die Juden“, ergänzt durch eine erläuternde Fußnote.
  alternative: „die jüdischen Anführer“ oder „die Judäer“
  rationale: Die lexikalisch direkte Wiedergabe bleibt im Haupttext erhalten. Zugleich kann der Ausdruck im unmittelbaren Kontext enger die jüdischen Autoritäten oder die Jesus gegenüberstehende Vertretergruppe bezeichnen; die Fußnote verhindert daher eine unbegründete Verallgemeinerung auf das gesamte jüdische Volk.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzähltempus. Die knappe Frage des Pilatus und der gerichtliche Ton seiner anschließenden Feststellung bleiben erhalten.
