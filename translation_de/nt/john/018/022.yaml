  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: de
  text: 'Als er das gesagt hatte, versetzte Jesus einer der dabeistehenden Bediensteten einen Schlag[a] und sagte: »Antwortest du so dem Hohen Priester?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gab ihm eine Ohrfeige«. Der griechische Ausdruck bezeichnet einen Schlag mit der Hand und kann eine Ohrfeige oder einen ähnlichen Schlag meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Als er das gesagt hatte
  rationale: Der Genitivus absolutus wird als temporaler Nebensatz wiedergegeben. Das deutsche Singularpronomen „das“ verweist natürlich auf die zuvor gesprochenen Worte, ohne den griechischen Plural in unidiomatischer Weise nachzubilden; δέ dient hier dem Erzählfortgang.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: einer von den Dienern, die dabeistanden
  rationale: ὑπηρέται bezeichnet hier untergeordnete Bedienstete beziehungsweise Amtspersonen im Umfeld des Hohen Priesters. „Diener“ bewahrt die lexikalische Breite; die Relativkonstruktion gibt das Partizip und den partitiven Genitiv natürlich wieder.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: versetzte ihm … einen Schlag
  rationale: Die griechische Wendung bezeichnet einen mit der Hand ausgeführten Schlag, lässt aber offen, ob genauer an eine Ohrfeige oder einen ähnlichen Schlag zu denken ist. „Ihm“ verweist im Zusammenhang eindeutig auf Jesus.
- source_word: εἰπών
  choice: und sagte
  rationale: Das begleitende aoristische Partizip wird im Deutschen idiomatisch als koordinierte Verbform wiedergegeben.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: Antwortest du so dem Hohen Priester?
  rationale: Die Wortstellung erhält den vorwurfsvollen Bezug von οὕτως auf die Art des Antwortens. „Hoher Priester“ ist die etablierte und sachgerechte Wiedergabe von ἀρχιερεύς.
theological_decisions:
- issue: Identität der ὑπηρέται
  choice: Diener im amtlichen Umfeld des Hohen Priesters
  alternative: Gerichtsdiener, Tempelwachen oder Bedienstete
  rationale: Der Kontext spricht für Personal mit einer offiziellen Funktion, doch das Substantiv selbst legt die genaue institutionelle Stellung nicht eindeutig fest. Die Übersetzung „Diener“ vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Versetzte ihm einen Schlag“ ist verständlich und bildet die griechische Wendung ab, ohne die Art des Schlages stärker festzulegen als der Ausgangstext. Die Anredefrage bleibt knapp und vorwurfsvoll.
