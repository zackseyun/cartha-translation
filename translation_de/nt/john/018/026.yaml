  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: de
  text: 'Einer der Sklaven des Hohepriesters, ein Verwandter des Mannes, dem Petrus das Ohr abgehauen hatte, sagte: »Habe ich dich nicht mit ihm im Garten gesehen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: Sklaven
  rationale: Das Wort bezeichnet hier Angehörige des Haushalts des Hohen Priesters und schließt ihren unfreien sozialen Status ein; „Diener“ würde diesen Aspekt abschwächen.
- source_word: ἀρχιερέως
  choice: Hohen Priesters
  rationale: Die übliche und kontextgerechte Bezeichnung für das oberste priesterliche Amt im Passionsbericht.
- source_word: συγγενὴς ὢν
  choice: ein Verwandter
  rationale: Die appositive Formulierung gibt die partizipiale Wendung natürlich wieder und bezeichnet das familiäre Verhältnis zum Verletzten.
- source_word: οὗ
  choice: des Mannes, dem
  rationale: Der Bezug auf die Person, deren Ohr Petrus abtrennte, wird im Deutschen zur Klarheit ausdrücklich gemacht.
- source_word: ἀπέκοψεν
  choice: abgehauen hatte
  rationale: Das Plusquamperfekt markiert die gegenüber dem Sprechen frühere Handlung; „abhauen“ beschreibt das gewaltsame Abtrennen in diesem Zusammenhang natürlich.
- source_word: ὠτίον
  choice: Ohr
  rationale: Direkte, idiomatische Wiedergabe; die diminutive Form verlangt hier im Deutschen keine Verkleinerungsform.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Habe ich dich nicht … gesehen?
  rationale: Die verneinte Frage erwartet Zustimmung. Die deutsche Satzstellung bewahrt den Nachdruck auf dem Sprecher hinreichend, ohne unnatürlich zu wirken.
- source_word: ἐν τῷ κήπῳ
  choice: im Garten
  rationale: „Garten“ ist die geläufige und kontextuell passende Bedeutung von κῆπος.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Direkte Wiedergabe; das Pronomen bezieht sich im Zusammenhang auf Jesus.
theological_decisions:
- issue: Wiedergabe von δοῦλος in einem konkreten Haushaltsverhältnis
  choice: Sklaven
  alternative: Diener
  rationale: Der Ausdruck bezeichnet hier keine bloßen Bediensteten, sondern unfreie Angehörige des Haushalts. Die Übersetzung bewahrt diese historische und soziale Bedeutung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt natürlich und bewahrt den rhetorischen Charakter der griechischen Frage. Keine Fußnote ist nötig, da „Sklaven“ die kontextuell naheliegende Bedeutung unmittelbar wiedergibt.
