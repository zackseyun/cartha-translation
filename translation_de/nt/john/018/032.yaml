id: JHN.18.32
reference: John 18:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: de
  text: Damit sollte sich das Wort Jesu erfüllen[a], das er gesprochen hatte, wobei er darauf hinwies[b], auf welche Weise er sterben würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Aussage Jesu«.'
    reason: lexical_alternative
  - marker: b
    text: Jesus hatte damit auf die Art seines Todes hingewiesen, wahrscheinlich auf die Kreuzigung; vergleiche Johannes 12,32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: So sollte
  rationale: Gibt in diesem erzählerischen Zusammenhang die Zweck- beziehungsweise Ergebnisbeziehung natürlich wieder, ohne sie unnötig festzulegen.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: das Wort Jesu
  rationale: Bewahrt die johanneische Erfüllungsformel; λόγος bezeichnet hier eine Aussage Jesu, nicht den Logos-Titel aus Johannes 1,1.
- source_word: πληρωθῇ
  choice: sich ... erfüllen
  rationale: Die etablierte deutsche Wendung bewahrt das theologisch gewichtige Erfüllungsmotiv.
- source_word: ὃν εἶπεν
  choice: das er gesprochen hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jesu Aussage dem berichteten Geschehen vorausging.
- source_word: σημαίνων
  choice: als er darauf hinwies
  rationale: Gibt das begleitende Partizip verständlich wieder und lässt offen, ob vor allem Art und Weise oder Zweck des Sprechens akzentuiert ist.
- source_word: ποίῳ θανάτῳ
  choice: durch welche Art von Tod
  rationale: ποίῳ bezeichnet die Art beziehungsweise Weise des Todes; die Präposition gibt den instrumentalen Dativ wieder.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: er sterben würde
  rationale: Drückt die aus damaliger Perspektive bevorstehende Zukunft natürlich aus, ohne mit »bestimmt war« einen stärkeren Vorherbestimmungsgedanken einzutragen.
theological_decisions:
- issue: Erfüllung der früheren Aussage Jesu
  choice: »das Wort Jesu erfüllen«
  alternative: »wahr werden, was Jesus gesagt hatte«
  rationale: Die ausdrückliche Erfüllungssprache des griechischen Textes bleibt erhalten und bewahrt das johanneische Motiv der verlässlichen Vorankündigung Jesu.
- issue: Aussagekraft von μέλλω hinsichtlich des Todes Jesu
  choice: »sterben würde«
  alternative: »zu sterben bestimmt war«
  rationale: Die Übersetzung bezeichnet den bevorstehenden Tod, ohne aus μέλλω allein eine stärkere Aussage über Vorherbestimmung abzuleiten.
- issue: Bezug von σημαίνων
  choice: 'Begleitumstand: »als er darauf hinwies«'
  alternative: 'Zweck: »um darauf hinzuweisen«'
  rationale: Das Partizip kann erklärend oder modal verstanden werden. Die gewählte Form bewahrt diese Offenheit besser als eine eindeutige Zweckangabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist nah an der griechischen Erfüllungssprache, vermeidet jedoch unnatürliche Partizipialkonstruktionen und überstarke deterministische Deutungen.
