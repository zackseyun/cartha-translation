  source_fidelity: Der griechische Zweck-/Ergebnissatz und das Erfüllungsmotiv sind im Entwurf grundsätzlich zutreffend wiedergegeben. Das Partizip σημαίνων beschreibt jedoch Jesu frühere Aussage als Hinweis auf die Weise seines Todes; die temporale Formulierung „als er darauf hinwies“ kann im Deutschen unnötig den Zeitpunkt dieses Hinweises hervorheben.
  naturalness: „Damit sollte sich das Wort Jesu erfüllen“ und „wobei er darauf hinwies“ sind modernes, würdiges Standarddeutsch. „auf welche Weise er sterben würde“ ist idiomatischer als „durch welche Art von Tod“, ohne die Frage nach der Todesart bzw. Todesweise einzuebnen.
  terminology: „Wort Jesu“ wahrt die johanneische Erfüllungssprache, ohne den Logos-Titel zu behaupten; die lexikalische Alternative in der Fußnote ist passend. „Sterben würde“ gibt ἤμελλεν ἀποθνῄσκειν zurück, ohne eine weitergehende Aussage über Bestimmung vorzunehmen.
