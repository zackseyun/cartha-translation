revisions:
- from: So sollte sich das Wort Jesu erfüllen[a], das er gesprochen hatte, als er darauf hinwies[b], durch welche Art von Tod er sterben würde.
  to: Damit sollte sich das Wort Jesu erfüllen[a], das er gesprochen hatte, wobei er darauf hinwies[b], auf welche Weise er sterben würde.
  rationale: Die Revision beseitigt die unnötig temporale Nuance von „als er darauf hinwies“ und glättet die Wiedergabe von ποίῳ θανάτῳ. Der Zweck-/Ergebniszusammenhang von ἵνα, die Erfüllungssprache von πληρωθῇ sowie die zurückhaltende Zukunftsnuance von ἤμελλεν bleiben erhalten. Die vorhandenen Fußnotenanker bleiben sinnvoll gesetzt.
