  variant: modern standard German
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: de
  text: Darauf zog Simon Petrus das Schwert, das er bei sich hatte, schlug den Sklaven[a] des Hohen Priesters und hieb ihm das rechte Ohr ab. Der Sklave hieß Malchus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener des Hohen Priesters“. Das griechische Wort doulos kann je nach Zusammenhang „Sklave“ oder „Diener“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Darauf
  rationale: Kennzeichnet den Fortgang der Erzählung und stellt einen natürlichen Anschluss an die vorherige Szene her, ohne eine streng logische Folgerung auszudrücken.
- source_word: ἔχων μάχαιραν
  choice: das Schwert, das er bei sich hatte
  rationale: Gibt das Partizip verständlich wieder. μάχαιρα kann ein Schwert oder Kurzschwert bezeichnen; „Schwert“ ist die angemessen breite und geläufige Wiedergabe.
- source_word: εἵλκυσεν αὐτήν
  choice: zog … das Schwert
  rationale: „Ein Schwert ziehen“ ist die idiomatische deutsche Bezeichnung für das Herausziehen der Waffe. Die Wiederholung von „Schwert“ vermeidet einen unklaren Pronomenbezug.
- source_word: ἔπαισεν
  choice: schlug
  rationale: Entspricht der tätlichen Gewalteinwirkung direkt und bewahrt den knappen Erzählstil.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: den Sklaven des Hohen Priesters
  rationale: δοῦλος bezeichnet grundsätzlich einen unfreien, einem Herrn zugehörigen Menschen. Die Genitivverbindung mit dem Hohen Priester macht dieses Abhängigkeitsverhältnis hier deutlich; „Diener“ bleibt als kontextuell mögliche Alternative in der Fußnote erhalten.
- source_word: ἀπέκοψεν
  choice: hieb … ab
  rationale: Bezeichnet hier das Abtrennen durch einen Schlag mit der Klinge. „Hieb … ab“ ist im Deutschen anschaulich, präzise und dem Waffenkontext angemessen.
- source_word: ὠτάριον τὸ δεξιόν
  choice: das rechte Ohr
  rationale: Das Diminutiv ὠτάριον verlangt hier weder „Öhrchen“ noch die spezifischere Wiedergabe „Ohrläppchen“; gemeint ist das rechte Ohr.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Der Sklave hieß Malchus
  rationale: Gibt die griechische Namenskonstruktion knapp und idiomatisch wieder. δέ leitet ergänzende Identifikation ein und braucht nach dem deutschen Satzanschluss kein eigenes adversatives Wort.
theological_decisions:
- issue: Wiedergabe von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: „Sklave“ wahrt den im griechischen Ausdruck angelegten Status persönlicher Unfreiheit beziehungsweise Zugehörigkeit. Da δοῦλος je nach Kontext auch funktional als „Diener“ wiedergegeben werden kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die Satzstellung wurde für natürliche Lesbarkeit geglättet, ohne Einzelheiten oder die Spannung des Ausgangstextes aufzulösen.
