source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: de
  text: 'Da sagte Pilatus zu ihnen: „Nehmt ihn selbst und richtet ihn nach eurem Gesetz.“ Die Juden[a] sagten zu ihm: „Uns ist es nicht erlaubt, jemanden zu töten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „die Juden“. In diesem Zusammenhang sind die jüdischen Autoritäten beziehungsweise Ankläger gemeint, die mit Pilatus sprechen, nicht das jüdische Volk insgesamt.
    reason: Kontextklärung zur Referenz von οἱ Ἰουδαῖοι und Vermeidung einer pauschalen Fehllektüre.
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Markiert in natürlichem modernem Deutsch den folgernden und zugleich erzählerischen Anschluss.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Nehmt ihr ihn
  rationale: Das ausdrücklich gesetzte ὑμεῖς wird durch das betonte „ihr“ wiedergegeben, ohne das stärker ausdeutende „selbst“ einzufügen.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: nach eurem Gesetz
  rationale: Gibt κατά als Maßstab beziehungsweise Norm prägnant und idiomatisch wieder.
- source_word: κρίνατε
  choice: richtet
  rationale: Bewahrt den rechtlichen Sinn von κρίνω, ohne den Vorgang auf eine bestimmte Prozessform einzuengen.
- source_word: οἱ Ἰουδαῖοι
  choice: Die Juden
  rationale: Folgt der griechischen Bezeichnung formal; die kontextuell engere Referenz wird in einer Fußnote erläutert.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Uns ist es nicht erlaubt
  rationale: Gibt sowohl die vorangestellte Betonung von ἡμῖν als auch den rechtlich-permissiven Sinn von ἔξεστιν in gegenwärtigem Deutsch wieder.
- source_word: ἀποκτεῖναι οὐδένα
  choice: jemanden zu töten
  rationale: Gibt den allgemeinen Wortlaut direkt wieder; der gerichtliche Hinrichtungskontext bleibt aus dem Dialog erkennbar, ohne ἀποκτεῖναι unnötig zu verengen.
theological_decisions:
- issue: Referenz von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext „Die Juden“, ergänzt durch eine kontextklärende Fußnote.
  alternative: „die jüdischen Autoritäten“ oder „die Judäer“
  rationale: Die formale Bezeichnung des griechischen Textes bleibt erhalten, während die Fußnote einer pauschalen, antijüdischen Fehllektüre vorbeugt. Im unmittelbaren Zusammenhang sind die vor Pilatus auftretenden jüdischen Autoritäten beziehungsweise Ankläger gemeint.
- issue: Reichweite von ἀποκτεῖναι im rechtlichen Kontext
  choice: „zu töten“
  alternative: „hinzurichten“ oder „zu Tode zu bringen“
  rationale: „Töten“ wahrt die lexikalische Breite des Verbs; der Zusammenhang mit Pilatus vermittelt den rechtlich-exekutiven Aspekt, ohne ihn ausdrücklich in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die betonte Konstruktion „Nehmt ihr ihn“ bildet das ausdrücklich gesetzte griechische Pronomen ab. „Richtet“ hält den juristischen Ton, während „Uns ist es nicht erlaubt“ verständlich und gegenwärtig bleibt.
