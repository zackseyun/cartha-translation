id: JHN.18.36
reference: John 18:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: de
  text: 'Jesus antwortete: „Mein Reich stammt nicht aus dieser Welt. Wenn mein Reich aus dieser Welt stammte, würden meine Diener kämpfen, damit ich nicht den Juden[a] ausgeliefert würde. Nun aber ist mein Reich nicht von hier.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den Judäern“; hier sind möglicherweise genauer die judäischen Autoritäten gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: Reich
  rationale: „Reich“ ist im Deutschen die natürliche und traditionsgeprägte Entsprechung im königlichen Kontext und kann hier sowohl den Herrschaftsbereich als auch die Königsherrschaft umfassen, ohne den Ausdruck einseitig festzulegen.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: stammt nicht aus dieser Welt
  rationale: ἐκ bezeichnet Herkunft oder Ursprung. Die Formulierung mit „stammt … aus“ macht diesen Bezug im modernen Deutschen klarer als das missverständliche „ist nicht von dieser Welt“.
- source_word: κόσμος
  choice: Welt
  rationale: „Welt“ gibt κόσμος direkt wieder und lässt die johanneische Bedeutung der gegenwärtigen, Gott widerstehenden Weltordnung durch den Zusammenhang hervortreten, ohne sie in den Text hineinzuerklären.
- source_word: ὑπηρέται
  choice: Diener
  rationale: Das Wort bezeichnet Personen, die im Dienst einer Autorität stehen. „Diener“ passt zum königlichen Zusammenhang und legt keine besondere Amts- oder Polizeifunktion fest.
- source_word: ἠγωνίζοντο ἄν
  choice: würden … kämpfen
  rationale: Die Formulierung gibt die irreale Folge der Bedingung verständlich wieder. Der Kontext lässt erkennen, dass ein tatsächlicher, gegebenenfalls andauernder Kampf gemeint wäre.
- source_word: ἵνα μὴ παραδοθῶ
  choice: damit ich nicht … ausgeliefert würde
  rationale: „Damit“ bewahrt den Zwecksinn von ἵνα; „ausgeliefert“ ist eine natürliche gerichtliche beziehungsweise gewaltsame Wiedergabe von παραδίδωμι.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Die Hauptübersetzung bleibt beim lexikalisch direkten Ausdruck. Da Ἰουδαῖοι im Johannesevangelium kontextabhängig auch Judäer oder insbesondere judäische Autoritäten bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
- source_word: νῦν δὲ
  choice: Nun aber
  rationale: Die Wendung markiert den Gegensatz zwischen der irrealen Annahme und dem tatsächlichen Sachverhalt. „Nun aber“ bewahrt zugleich die mögliche zeitliche Färbung.
- source_word: ἐντεῦθεν
  choice: von hier
  rationale: Die knappe deiktische Wendung entspricht dem griechischen Adverb und bewahrt dessen Bezugsoffenheit, statt „hier“ deutend durch „Bereich“ oder „Weltordnung“ zu ersetzen.
theological_decisions:
- issue: Das Verhältnis des Reiches Jesu zur Welt
  choice: Die Herkunftsaussage wird mit „stammt nicht aus dieser Welt“ wiedergegeben.
  alternative: „ist nicht von dieser Welt“ oder „ist kein Teil dieser Welt“
  rationale: Der griechische Text verneint vor allem, dass Jesu Reich seinen Ursprung in der Welt hat. Er sagt nicht, dass es in der Welt keine Gegenwart oder Wirkung besitzt. Die Übersetzung bewahrt diese Spannung.
- issue: Der Bezug von Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext steht „den Juden“, ergänzt durch eine kontextuelle Alternative in der Fußnote.
  alternative: „den Judäern“ oder „den jüdischen Autoritäten“
  rationale: Der unmittelbare Zusammenhang kann auf judäische Autoritäten weisen, doch der griechische Ausdruck legt diese engere Bestimmung nicht ausdrücklich fest. Haupttext und Fußnote bilden sowohl die lexikalische Form als auch die kontextuelle Mehrdeutigkeit ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „mein Reich“ bildet die rhetorische Wiederholung des griechischen Textes ab. „Stammt … aus“ verdeutlicht die Herkunftsaussage, während der abschließende Satz mit „von hier“ die knappe und offene Ausdrucksweise des Originals bewahrt.
