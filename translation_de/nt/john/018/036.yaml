  verdict: approve
  source_fidelity: Die Übersetzung gibt die wiederholte Herkunftsaussage mit „stammt ... aus“ treffend wieder, bildet die irreale Bedingung mit angemessenem Konjunktiv ab und wahrt den Unterschied zwischen „aus dieser Welt“ und dem abschließenden deiktischen „von hier“. „Damit ich nicht den Juden ausgeliefert würde“ entspricht dem Zweck von ἵνα μὴ παραδοθῶ, ohne zusätzliche Deutung einzutragen.
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. Die Wiederholung von „mein Reich“ ist im Deutschen nicht störend und bewahrt die rhetorische Struktur des griechischen Satzes. „Nun aber“ ist idiomatisch und gibt den Kontrast zur hypothetischen Aussage angemessen wieder.
  terminology: „Reich“ ist für βασιλεία hier eine etablierte und ausreichend offene Wahl. „Diener“ gibt ὑπηρέται im königlichen Bildfeld passend wieder. Die Hauptlesart „den Juden“ bleibt nah am Wortlaut; die Fußnote nennt sachgerecht die mögliche geographisch bzw. kontextuell engere Bedeutung, ohne sie als alleinige Deutung festzuschreiben.
