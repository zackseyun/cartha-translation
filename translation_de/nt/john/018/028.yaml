id: JHN.18.28
reference: John 18:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: de
  text: Darauf führten sie Jesus von Kajaphas zum Amtssitz des Statthalters[a]. Es war früh am Morgen. Sie selbst gingen nicht in den Amtssitz hinein, damit sie nicht unrein würden[b], sondern das Passa essen könnten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Prätorium“, der offiziellen Residenz und Gerichtsstätte des römischen Statthalters.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist kultische beziehungsweise zeremonielle Unreinheit.
    reason: cultural_note
  - marker: c
    text: „Das Passa essen“ kann sich speziell auf das Passamahl oder weiter gefasst auf Mahlzeiten im Zusammenhang mit dem Passafest beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: führten sie
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben. „Führten“ passt zur bewachten Überstellung Jesu.
- source_word: οὖν
  choice: Darauf
  rationale: Kennzeichnet hier die Fortführung der Erzählung; „darauf“ gibt den zeitlich-folgernden Zusammenhang idiomatisch wieder.
- source_word: πραιτώριον
  choice: Amtssitz des Statthalters
  rationale: Bezeichnet hier die offizielle Residenz und Gerichtsstätte des römischen Statthalters. Die Übersetzung vermittelt die Funktion verständlicher als die bloße Transliteration „Prätorium“.
- source_word: πρωΐ
  choice: früh am Morgen
  rationale: Bezeichnet die frühe Tageszeit, ohne den Zeitpunkt enger als „Morgengrauen“ festzulegen.
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Bewahrt die Hervorhebung des Pronomens und den Kontrast zu Jesus, den sie hineinbringen ließen.
- source_word: εἰσῆλθον
  choice: gingen nicht … hinein
  rationale: Eine natürliche deutsche Wiedergabe des erzählenden Aorists; die räumliche Bewegung in das Gebäude bleibt deutlich.
- source_word: μιανθῶσιν
  choice: unrein würden
  rationale: Gibt die hier gemeinte kultisch-rituelle Verunreinigung verständlich wieder, ohne eine moralische Verunreinigung anzudeuten.
- source_word: φάγωσιν τὸ πάσχα
  choice: das Passa essen könnten
  rationale: Bewahrt die knappe und mehrdeutige Formulierung des Ausgangstextes. Ob das eigentliche Passamahl oder das Essen im weiteren Festzusammenhang gemeint ist, wird nicht im Haupttext entschieden.
- source_word: Καϊάφα
  choice: Kajaphas
  rationale: Entspricht der etablierten deutschen Schreibweise des Namens.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Entspricht der etablierten deutschen Form des Namens.
theological_decisions:
- issue: Bedeutung von „das Passa essen“ im Verhältnis zur johanneischen Passionschronologie
  choice: Die wörtlich-nahe Wendung „das Passa essen“ bleibt im Haupttext stehen.
  alternative: „das Passamahl essen“ oder „die Festopfer essen“
  rationale: Der genaue Bezug der Wendung ist umstritten. Die offene Formulierung bewahrt die im griechischen Text vorhandene Spannung, statt eine chronologische Harmonisierung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Amtssitz des Statthalters“ vermeidet ein erklärungsbedürftiges Fremdwort im Haupttext; „das Passa essen“ erhält bewusst die sachliche und chronologische Offenheit des griechischen Ausdrucks.
