source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: de
  text: Da ergriffen die Kohorte, der Befehlshaber und die Wachleute der Juden[a] Jesus und fesselten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der jüdischen Führer“ beziehungsweise „der Judäer“, je nach Zusammenhang. Johannes gebraucht „die Juden“ häufig in einem engeren Sinn und meint damit nicht das gesamte jüdische Volk.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die Fortsetzung und Folge des unmittelbar zuvor geschilderten Geschehens; „Da“ ist im deutschen Erzählstil natürlich und bewahrt den Zusammenhang, ohne eine stärkere logische Folgerung auszudrücken.
- source_word: σπεῖρα
  choice: Kohorte
  rationale: Der Ausdruck bezeichnet gewöhnlich eine militärische Einheit. „Kohorte“ erhält den spezifischen militärischen Sinn, ohne die im Substantiv selbst nicht ausdrücklich genannte römische Zugehörigkeit hinzuzufügen.
- source_word: χιλίαρχος
  choice: Befehlshaber
  rationale: Gemeint ist der befehlshabende Offizier der Truppe. „Befehlshaber“ ist verständlich und funktional genau; „Tribun“ wäre historisch spezieller, für viele Leser aber weniger unmittelbar verständlich.
- source_word: ὑπηρέται
  choice: Wachleute
  rationale: Im johanneischen Zusammenhang bezeichnet das Wort hier amtlich eingesetzte Kräfte, die an der Festnahme beteiligt sind, nicht Hausdiener. „Wachleute“ gibt diese Funktion wieder, ohne sie über den Text hinaus ausdrücklich als Tempelpolizei zu bestimmen.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Die Genitivverbindung wird formal transparent wiedergegeben. Da Johannes damit je nach Zusammenhang eine begrenztere Gruppe, etwa die jüdischen Führungskreise oder Judäer, meinen kann, weist eine Fußnote auf die mögliche Eingrenzung hin.
- source_word: συνέλαβον
  choice: ergriffen
  rationale: Das Verb bezeichnet das Ergreifen beziehungsweise Festnehmen. „Ergriffen“ bewahrt sowohl den körperlichen Zugriff als auch die aus dem Zusammenhang erkennbare Ingewahrsamnahme, ohne den Vorgang stärker juristisch zu formulieren.
- source_word: ἔδησαν
  choice: fesselten
  rationale: Gibt das Binden einer festgenommenen Person im Deutschen klar, knapp und dem erzählerischen Register angemessen wieder.
theological_decisions:
- issue: Bezug und Tragweite von τῶν Ἰουδαίων im Johannesevangelium
  choice: Im Haupttext steht die formal entsprechende Wendung „der Juden“.
  alternative: „der jüdischen Führer“ oder „der Judäer“
  rationale: Der Vers selbst grenzt die bezeichnete Gruppe nicht ausdrücklich ein. Die Übersetzung bewahrt deshalb die sprachliche Offenheit des griechischen Textes, während die Fußnote verhindert, dass die Wendung ohne Weiteres auf das gesamte jüdische Volk bezogen wird.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Syntax. Militärische und institutionelle Begriffe werden verständlich, aber nicht unnötig interpretierend wiedergegeben. Die Wiederholung von „ihn“ im letzten Satzteil ist im Deutschen entbehrlich, da das Objekt eindeutig bleibt.
