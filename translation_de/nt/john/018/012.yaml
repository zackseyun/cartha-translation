review_pass:
  verdict: approve
  source_fidelity: 'Der Satz gibt sämtliche Bestandteile des griechischen Textes sachgerecht wieder: οὖν als erzählerisches „Da“, σπεῖρα als „Kohorte“, χιλίαρχος als „Befehlshaber“, ὑπηρέται als institutionell verstandene „Wachleute“, συνέλαβον als „ergriffen“ und ἔδησαν als „fesselten“. Die Zuordnung „der Juden“ zu den Wachleuten entspricht der griechischen Konstruktion. „Fesselten“ ist im Kontext eine angemessene moderne Wiedergabe von ἔδησαν, ohne einen abweichenden Vorgang einzutragen.'
  naturalness: Der deutsche Satz ist flüssig, klar und in einem modernen, würdigen Erzählregister formuliert. Die Reihung der beteiligten Gruppen ist verständlich; „Da ergriffen … Jesus und fesselten ihn“ klingt idiomatisch.
  terminology: „Kohorte“ und „Befehlshaber“ bewahren den militärischen Charakter, ohne über das Griechische hinaus die römische Zugehörigkeit ausdrücklich einzutragen. „Wachleute“ ist für ὑπηρέται kontextgerecht, ohne die stärker interpretierende Benennung „Tempelpolizei“ zu wählen. Die Fußnote zu „der Juden“ wahrt die Form des Haupttextes und erläutert die in Johannes mögliche engere Referenz, ohne sie dogmatisch oder pauschalisierend festzulegen.
