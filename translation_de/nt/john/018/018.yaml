source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: de
  text: Die Sklaven und die Diener[a] standen bei einem Holzkohlenfeuer, das sie gemacht hatten, und wärmten sich, weil es kalt war. Auch Petrus stand bei ihnen und wärmte sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Diener“ ist auch „Wachen“ oder „Gerichtsdiener“ möglich. Das griechische Wort bezeichnet hier amtliche Bedienstete, wahrscheinlich im Umfeld des Tempels oder des Hohenpriesters.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Die Wiedergabe bewahrt den wahrscheinlichen unfreien Status des zum Haushalt gehörenden Personals; „Diener“ wäre möglich, würde diesen sozialen Aspekt aber abschwächen.
- source_word: ὑπηρέται
  choice: Diener
  rationale: Gemeint sind amtliche Bedienstete des hohepriesterlichen Umfelds, in johanneischem Sprachgebrauch häufig mit Ordnungs- oder Vollzugsaufgaben. „Diener“ bleibt bewusst weiter als „Wachen“.
- source_word: ἀνθρακιὰν
  choice: Kohlenfeuer
  rationale: Das Wort bezeichnet ein Feuer aus Holzkohle; „Kohlenfeuer“ ist natürlich und bewahrt das für die Erzählung bedeutsame konkrete Detail.
- source_word: πεποιηκότες
  choice: hatten ... gemacht
  rationale: Das Plusquamperfekt gibt die bereits vollzogene Handlung mit fortbestehendem Ergebnis im Deutschen flüssig wieder.
- source_word: ὅτι ψῦχος ἦν
  choice: weil es kalt war
  rationale: ὅτι nennt hier eindeutig den Grund für das Feuer und das Wärmen.
- source_word: εἱστήκεισαν ... καὶ ἐθερμαίνοντο
  choice: Sie standen darum herum und wärmten sich
  rationale: Die Formulierung bewahrt die andauernde Körperhaltung und Handlung; „darum herum“ bezieht das Stehen natürlich auf das zuvor genannte Feuer, ohne eine zusätzliche Ortsangabe einzuführen.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Auch Petrus stand bei ihnen
  rationale: „Auch“ erhält den additiven Akzent von καί, und „bei ihnen“ gibt μετ’ αὐτῶν knapp und idiomatisch wieder.
- source_word: θερμαινόμενος
  choice: wärmte sich
  rationale: Die reflexive, fortdauernde Handlung wird im Deutschen unmittelbar wiedergegeben.
- source_word: δέ
  choice: nicht eigens wiedergegeben
  rationale: Die milden verbindenden δέ strukturieren die Erzählung, verlangen hier im natürlichen Deutschen aber weder „nun“ noch einen starken Gegensatz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber der griechischen Partizipialkonstruktion leicht gegliedert, damit der Vers mündlich wie schriftlich klar verständlich bleibt. „Sklaven“ bewahrt die historische soziale Wirklichkeit; „Diener“ bezeichnet daneben die amtlichen Bediensteten.
