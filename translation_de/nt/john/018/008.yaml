id: JHN.18.8
reference: John 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: de
  text: 'Jesus antwortete: „Ich habe euch gesagt: Ich bin es.[a] Wenn ihr also mich sucht, dann lasst diese hier gehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfach: „Ich bin.“ Im Griechischen steht kein Wort für „es“; im Deutschen wird es bei einer solchen Selbstidentifikation gewöhnlich ergänzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche und natürliche Erzählform für ἀποκρίνομαι in einem Gespräch.
- source_word: Εἶπον ὑμῖν
  choice: Ich habe euch gesagt
  rationale: Der Aorist verweist auf Jesu unmittelbar vorausgehende Aussage; das deutsche Perfekt gibt diesen Rückbezug in heutiger Standardsprache natürlich wieder.
- source_word: ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Zusammenhang identifiziert Jesus sich als den Gesuchten. „Ich bin es“ ist dafür im Deutschen idiomatisch; die formal mögliche und theologisch bedeutsame Wiedergabe „Ich bin“ bleibt in der Fußnote erhalten.
- source_word: εἰ οὖν
  choice: Wenn … also
  rationale: Bewahrt sowohl die Bedingung als auch die folgernde Funktion von οὖν.
- source_word: ἐμὲ ζητεῖτε
  choice: ihr … mich sucht
  rationale: Die Voranstellung von „mich“ im Griechischen hebt Jesus gegenüber seinen Begleitern hervor; die deutsche Wortstellung „Wenn ihr also mich sucht“ erhält diese Betonung.
- source_word: ἄφετε
  choice: lasst
  rationale: Der Imperativ bedeutet hier, jemandem das Weggehen zu gestatten; „lasst“ ist knapp und legt keine bereits bestehende Haft nahe.
- source_word: τούτους
  choice: diese hier
  rationale: Das Demonstrativpronomen bezeichnet die bei Jesus stehenden Begleiter. „Diese hier“ ist im Deutschen verständlich und vermeidet die nicht ausdrücklich im Griechischen enthaltene Ergänzung „Männer“.
- source_word: ὑπάγειν
  choice: gehen
  rationale: Nach ἄφετε bezeichnet der Infinitiv das gestattete Fortgehen; „gehen“ ist die natürliche, nicht überdeutende Wiedergabe.
theological_decisions:
- issue: Wiedergabe von ἐγώ εἰμι im johanneischen Zusammenhang
  choice: Ich bin es
  alternative: Ich bin
  rationale: Die Aussage dient unmittelbar der Selbstidentifikation Jesu gegenüber denen, die ihn festnehmen wollen. Zugleich kann die prädikatslose griechische Form im Johannesevangelium einen weiterreichenden theologischen Anklang tragen. Daher steht die idiomatische Identifikationsform im Haupttext, während die formnähere Lesart in der Fußnote bewahrt wird.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstellung betont „mich“ als Gegenüber zu Jesu Begleitern; „diese hier“ hält den Bezug anschaulich, ohne ein nicht ausdrücklich genanntes Substantiv einzufügen.
