id: JHN.18.16
reference: John 18:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: de
  text: Petrus aber stand draußen an der Tür. Da ging der andere Jünger, der dem Hohen Priester bekannt war,[a] hinaus, sprach mit der Türhüterin[b] und brachte Petrus hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ein Bekannter des Hohen Priesters war“. Das Griechische lässt offen, wie eng die Beziehung war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Torhüterin“. Gemeint ist die Person, die am Eingang Dienst hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: stand
  rationale: Das Plusquamperfekt von ἵστημι bezeichnet hier einen fortdauernden Zustand; das deutsche Präteritum „stand“ gibt ihn im Erzählzusammenhang natürlich wieder.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: draußen an der Tür
  rationale: Die Wendung bewahrt sowohl die Lage am Eingang als auch ἔξω („draußen“); „Tür“ ist die grundlegende Bedeutung von θύρα.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: der andere Jünger
  rationale: „Jünger“ ist im Evangelienkontext die natürliche Wiedergabe von μαθητής und erhält dessen Beziehungs- und Nachfolgeaspekt.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: der dem Hohen Priester bekannt war
  rationale: Die Formulierung lässt wie das Griechische offen, wie eng die Beziehung war, und legt weder Freundschaft noch bloße flüchtige Bekanntschaft fest.
- source_word: ἀρχιερεύς
  choice: Hoher Priester
  rationale: Dies ist die geläufige und sachlich genaue Bezeichnung des jüdischen Hohepriesteramtes.
- source_word: θυρωρῷ
  choice: Türhüterin
  rationale: Der feminine Artikel τῇ zeigt, dass die am Eingang eingesetzte Person weiblich ist; „Türhüterin“ gibt Rolle und Geschlecht knapp wieder.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: sprach mit der Türhüterin
  rationale: Da kein Wortlaut folgt, klingt „sprach mit“ im Deutschen natürlicher als „sagte der Türhüterin“.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: brachte Petrus hinein
  rationale: Die Formulierung gibt εἰσάγω idiomatisch wieder, ohne stärker als der Ausgangstext ein Führen oder Begleiten zu betonen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählfolge. „Aber“ nimmt den Kontrast zum vorherigen Vers auf; „Da“ gibt οὖν hier als narrative Folge wieder. Die Großschreibung von „Hoher Priester“ behandelt die Amtsbezeichnung als Titel.
