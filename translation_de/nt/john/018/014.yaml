id: JHN.18.14
reference: John 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: de
  text: Kajaphas war es, der den Juden[a] geraten hatte, es sei besser, dass ein einziger Mensch für das Volk[b] sterbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den jüdischen Führern“ oder „den Judäern“, je nachdem, wie die Bezeichnung „die Juden“ bei Johannes in diesem Zusammenhang verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zugunsten des Volkes“. Die Wendung kann im Zusammenhang auch repräsentative oder opferbezogene Anklänge haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: war es
  rationale: δέ ist hier ein schwaches fortführendes beziehungsweise wiederaufnehmendes Bindewort. Im Deutschen ist kein ausdrückliches einleitendes Bindewort nötig; die Konstruktion „war es“ gibt den Erzählfluss natürlich wieder.
- source_word: Καϊάφας
  choice: Kajaphas
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ὁ συμβουλεύσας
  choice: der … geraten hatte
  rationale: Das substantivierte Aoristpartizip kennzeichnet Kajaphas durch einen früher erteilten Rat; das Plusquamperfekt bildet diese Vorzeitigkeit verständlich ab.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden
  rationale: Der griechische Text enthält keine ausdrückliche Einschränkung auf Führungspersonen. Die formnahe Wiedergabe bewahrt die mögliche Spannweite des johanneischen Sprachgebrauchs; eine Fußnote nennt kontextuelle Alternativen.
- source_word: ὅτι συμφέρει
  choice: es sei besser
  rationale: συμφέρει bezeichnet das, was nützt oder vorteilhaft ist. „Es sei besser“ ist im Deutschen idiomatisch und gibt den Inhalt des früheren Rates in indirekter Rede wieder.
- source_word: ἕνα ἄνθρωπον
  choice: ein einziger Mensch
  rationale: Die Wendung bewahrt die Betonung der Zahl eins. „Mensch“ entspricht ἄνθρωπος und vermeidet eine unnötige Verengung, ohne den männlichen Bezug auf Jesus zu verdecken.
- source_word: ἀποθανεῖν
  choice: sterbe
  rationale: Der Infinitiv wird innerhalb der deutschen dass-Konstruktion als Konjunktiv wiedergegeben.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: für das Volk
  rationale: ὑπέρ bezeichnet hier mindestens Nutzen beziehungsweise stellvertretendes Handeln. „Für das Volk“ bleibt natürlich und offen für die im Kontext möglichen repräsentativen oder opferbezogenen Anklänge.
- source_word: λαοῦ
  choice: Volk
  rationale: λαός bedeutet hier „Volk“. Es wird nicht mit „Nation“ wiedergegeben, da dafür im verwandten Wortlaut Johannes 11,50 ἔθνος steht.
theological_decisions:
- issue: Möglicher Sühne- oder Stellvertretungssinn von ὑπὲρ τοῦ λαοῦ
  choice: für das Volk
  alternative: zugunsten des Volkes; stellvertretend für das Volk
  rationale: Die knappe Wiedergabe lässt sowohl den politischen Sinn von Kajaphas’ Rat als auch die tiefere repräsentative oder opferbezogene Bedeutung im johanneischen Zusammenhang bestehen, ohne eine bestimmte Sühnetheorie ausdrücklich in den Vers einzutragen.
- issue: Bezugsgruppe von τοῖς Ἰουδαίοις im Johannesevangelium
  choice: den Juden
  alternative: den jüdischen Führern; den Judäern
  rationale: Da der Ausgangstext die Bezeichnung nicht ausdrücklich einschränkt, bleibt sie im Haupttext erhalten. Die Fußnote weist auf die kontextuell diskutierten Bezugsgruppen hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die indirekte Rede mit Konjunktiv („es sei“, „sterbe“) macht kenntlich, dass der Vers Kajaphas’ früheren Rat referiert. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
