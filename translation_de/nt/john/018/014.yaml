  source_fidelity: Die Übersetzung gibt die Identifizierung Kajaphas’ durch das vorzeitige συμβουλεύσας, die Aussage über den Nutzen (συμφέρει), die numerische Hervorhebung ἕνα und ὑπὲρ τοῦ λαοῦ zuverlässig wieder. „Ein einziger Mensch“ ist eine vertretbare deutsche Entsprechung von ἕνα ἄνθρωπον; „für das Volk“ wahrt die bewusst nicht weiter spezifizierte Bedeutung von ὑπέρ.
  naturalness: Der Satz ist verständliches, würdevolles modernes Standarddeutsch. Die indirekte Rede mit „es sei“ und „sterbe“ passt zum berichteten früheren Rat. Die Konstruktion „Kajaphas war es, der …“ ist leicht hervorgehoben, aber idiomatisch und bildet die identifizierende Struktur des griechischen Artikularpartizips angemessen ab.
  terminology: „Kajaphas“, „den Juden“ und „Volk“ sind etablierte und quellennah gewählte Formen. Die Fußnoten erläutern die umstrittene johanneische Bezugsweite von Ἰουδαῖοι sowie die mögliche benefaktive, repräsentative und opferbezogene Resonanz von ὑπέρ, ohne diese in den Haupttext einzutragen.
