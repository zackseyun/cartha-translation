id: JHN.18.9
reference: John 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: de
  text: 'damit sich das Wort erfüllte, das er gesagt hatte: »Von denen, die du mir gegeben hast, habe ich keinen verloren.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »habe ich keinen von ihnen verloren« oder nachdrücklicher: »habe ich nicht einen Einzigen von ihnen verloren«.'
    reason: Lexikalische Alternative für die partitive und emphatische Formulierung ἐξ αὐτῶν οὐδένα.
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das erzielte Ergebnis ein und bewahrt die zielgerichtete Aussage des griechischen Satzes in natürlichem Deutsch.
- source_word: πληρωθῇ
  choice: sich erfüllte
  rationale: Die im Deutschen übliche Wendung für das Eintreffen eines zuvor gesprochenen Wortes gibt den passiven Aoristkonjunktiv sinngemäß und würdig wieder.
- source_word: ὁ λόγος
  choice: das Wort
  rationale: Bezeichnet hier einen bestimmten früheren Ausspruch Jesu, nicht den christologischen Titel »das Wort«. Die Wiedergabe erhält zugleich den johanneischen Sprachgebrauch.
- source_word: ὃν εἶπεν
  choice: das er gesagt hatte
  rationale: Das Plusquamperfekt verdeutlicht auf natürliche Weise, dass Jesus dieses Wort vor der gegenwärtigen Szene gesprochen hatte.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι führt den Inhalt des Ausspruchs ein; der Doppelpunkt leitet das direkte Zitat im Deutschen klar und knapp ein.
- source_word: Οὓς δέδωκάς μοι
  choice: Von denen, die du mir gegeben hast
  rationale: Die vorangestellte partitive Formulierung entspricht dem späteren ἐξ αὐτῶν und bewahrt mit »gegeben hast« die resultative Nuance des Perfekts.
- source_word: ἀπώλεσα
  choice: habe ich … verloren
  rationale: Im Zusammenhang mit Jesu Schutz seiner Jünger bedeutet das Verb nicht aktives Vernichten, sondern den Verlust eines ihm Anvertrauten. »Verloren« bewahrt außerdem die Verbindung zu Johannes 17,12.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: keinen
  rationale: 'Zusammen mit dem vorangestellten »Von denen« gibt »keinen« den partitiven und nachdrücklichen Sinn wieder: keinen Einzigen aus ihrer Mitte.'
theological_decisions:
- issue: Art der Erfüllungsaussage
  choice: Das frühere Wort Jesu wird als etwas dargestellt, das sich erfüllt, ohne es ausdrücklich als Schriftprophetie zu bezeichnen.
  alternative: »damit das Wort wahr wurde«
  rationale: Johannes verwendet Erfüllungssprache hier für Jesu eigenen früheren Ausspruch. »Sich erfüllen« bewahrt dessen theologisches Gewicht, ohne eine nicht ausdrücklich genannte Kategorie einzutragen.
- issue: Bedeutung von ἀπώλεσα in Bezug auf die Jünger
  choice: »habe ich keinen verloren« im Sinn der Bewahrung der Jesus Anvertrauten
  alternative: »habe ich keinen zugrunde gehen lassen«
  rationale: Der unmittelbare Zusammenhang betrifft Jesu Schutz seiner Jünger bei seiner Festnahme und greift Johannes 17,12 auf. »Verloren« erhält die johanneische Ausdrucksweise und vermeidet eine vorschnelle dogmatische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, ohne unnatürlich zu wirken; das Zitat ist klar als früheres Wort Jesu markiert.
