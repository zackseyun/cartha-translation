source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: de
  text: Judas kommt nun dorthin, nachdem er die Kohorte[a] sowie Amtsdiener[b] von den führenden Priestern und von den Pharisäern mit sich genommen hatte, mit Laternen, Fackeln und Waffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Abteilung« beziehungsweise »die Soldatentruppe«. Das griechische Wort kann eine militärische Einheit bezeichnen, ohne vorauszusetzen, dass die gesamte Kohorte anwesend war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wachleute« beziehungsweise »Tempelwächter«. Gemeint sind amtliche Bedienstete der jüdischen Autoritäten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die erzählerische Fortführung und den Zusammenhang mit dem vorherigen Geschehen, ohne eine zu starke Schlussfolgerung auszudrücken.
- source_word: λαβὼν
  choice: nahm … mit
  rationale: Gibt die dem Hauptverb vorausgehende Handlung idiomatisch wieder und passt zur Mitnahme der bewaffneten Gruppe.
- source_word: σπεῖραν
  choice: Kohorte
  rationale: Bewahrt die militärische Bedeutung und historische Konkretheit des Ausdrucks, ohne zu behaupten, dass die gesamte Einheit anwesend war.
- source_word: ὑπηρέτας
  choice: Wachleute
  rationale: Bezeichnet hier amtliche Bedienstete der jüdischen Autoritäten; »Wachleute« macht ihre Funktion verständlich, ohne sie genauer als Tempelpolizei festzulegen.
- source_word: ἀρχιερέων
  choice: führenden Priester
  rationale: Bezeichnet die maßgeblichen priesterlichen Autoritäten und vermeidet das Missverständnis, gleichzeitig hätten mehrere Hohepriester im engeren Sinn amtiert.
- source_word: ἔρχεται
  choice: kommt
  rationale: Bewahrt das lebendige historische Präsens des griechischen Erzählstils.
- source_word: ἐκεῖ
  choice: dorthin
  rationale: Verweist auf den zuvor genannten Ort und verbindet sich im Deutschen natürlich mit dem Bewegungsverb.
- source_word: φανῶν
  choice: Laternen
  rationale: Bezeichnet tragbare Leuchten und hält die Unterscheidung von λαμπάδων aufrecht.
- source_word: λαμπάδων
  choice: Fackeln
  rationale: Gibt die zweite Art tragbarer Lichtquelle passend und von »Laternen« unterscheidbar wieder.
- source_word: ὅπλων
  choice: Waffen
  rationale: Ist die klare moderne Wiedergabe des allgemeinen Begriffs für bewaffnete Ausrüstung.
theological_decisions:
- issue: Zusammensetzung und Stärke der Gruppe, die Jesus festnehmen sollte
  choice: »die Kohorte sowie Wachleute der führenden Priester und der Pharisäer«
  alternative: »eine Abteilung Soldaten sowie Amtsdiener der führenden Priester und der Pharisäer«
  rationale: Die Wiedergabe erhält die im Griechischen erkennbare Verbindung einer militärischen Einheit mit Bediensteten jüdischer Autoritäten, legt aber weder die genaue Truppenstärke noch eine präzisere institutionelle Funktion der Wachleute fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens »kommt« bewahrt die erzählerische Lebendigkeit des griechischen Textes; die vorangehende Partizipialhandlung wird idiomatisch als koordinierte Handlung wiedergegeben.
