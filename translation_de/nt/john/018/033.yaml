source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: de
  text: 'Da ging Pilatus wieder in den Amtssitz des Statthalters[a], rief Jesus zu sich und sagte zu ihm: »Bist du der König der Juden[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in das Prätorium«; gemeint ist der Amtssitz oder das Hauptquartier des römischen Statthalters.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Judäer«. Das griechische Wort kann sowohl Juden allgemein als auch, je nach Zusammenhang, Menschen aus Judäa bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν … πάλιν
  choice: ging … wieder in
  rationale: Die Verbindung bezeichnet die Rückkehr in einen zuvor verlassenen Ort. „ging … wieder in“ ist im Deutschen natürlich und gibt sowohl die Bewegung als auch die Wiederholung wieder.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die Erzählung folgernd weiter. „Da“ wahrt den Zusammenhang und klingt in erzählender Prosa natürlich.
- source_word: πραιτώριον
  choice: Amtssitz des Statthalters
  rationale: Das Wort bezeichnet hier den offiziellen Sitz beziehungsweise das Hauptquartier des römischen Statthalters. Die verständliche Sachbezeichnung vermeidet das für viele undurchsichtige Fremdwort „Prätorium“.
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: ließ Jesus rufen
  rationale: φωνέω mit Personenobjekt kann bedeuten, jemanden zu sich zu rufen. „ließ Jesus rufen“ passt zum amtlichen Schauplatz und behauptet nicht unnötig, Pilatus habe selbst laut nach Jesus gerufen.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Die Wiedergabe bleibt beim allgemeinen Verb λέγω; der folgende Fragesatz trägt selbst die interrogative Bedeutung.
- source_word: Σὺ εἶ
  choice: Bist du
  rationale: Die deutsche Frageform ist idiomatisch. Das ausdrücklich gesetzte σύ lässt sich durch die natürliche Betonungsmöglichkeit von „du“ erfassen, ohne typografisch eine bestimmte Betonung vorzuschreiben.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: der König der Juden
  rationale: Dies ist im Prozesszusammenhang die etablierte und historisch passende Wiedergabe des politischen Titels. Die mögliche regionale Bedeutung von Ἰουδαῖοι bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαίων im Königstitel
  choice: Juden
  alternative: Judäer / Bewohner Judäas
  rationale: Im Zusammenhang der römischen Anklage bezeichnet „König der Juden“ am ehesten das Volk beziehungsweise die ethnisch-religiös und politisch verstandene Gruppe. Da Ἰουδαῖοι kontextabhängig auch regional „Judäer“ bedeuten kann, wird diese Spannung nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Amtssitz des Statthalters“ ist für heutige Leser verständlich; das traditionelle Fremdwort bleibt in der Fußnote erhalten. Die direkte Rede bleibt knapp und eindringlich.
