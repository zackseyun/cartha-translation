source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Ich habe offen vor aller Welt gesprochen. Ich habe immer in der Synagoge und im Tempel[a] gelehrt, wo alle Juden[b] zusammenkommen, und im Verborgenen habe ich nichts gesagt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „im Tempelbezirk“ beziehungsweise „in den Tempelhöfen“. Das griechische Wort ἱερόν bezeichnet die gesamte Tempelanlage, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
  - marker: b
    text: Oder „das ganze jüdische Volk“, in manchen Zusammenhängen bei Johannes auch „alle Judäer“. Das griechische Wort Ἰουδαῖοι ist kontextabhängig.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: offen
  rationale: Der Zusammenhang stellt Jesu öffentliches, unverdecktes Reden dem Reden „im Verborgenen“ gegenüber. „Offen“ gibt diesen Gegensatz wieder, ohne die mögliche Nebenbedeutung von Freimut überzubetonen.
- source_word: λελάληκα
  choice: habe gesprochen
  rationale: Das Perfekt hebt Jesu bisheriges Reden mit seiner fortdauernden Bedeutung für das Verhör hervor.
- source_word: τῷ κόσμῳ
  choice: zur Welt
  rationale: Die Wiedergabe bewahrt den für Johannes charakteristischen Ausdruck κόσμος und dessen mögliche größere Bedeutungsweite, statt ihn auf „Öffentlichkeit“ zu verengen.
- source_word: πάντοτε
  choice: immer
  rationale: „Immer“ ist eine direkte und natürliche Wiedergabe des zeitlichen Adverbs und beschreibt Jesu regelmäßige öffentliche Lehrtätigkeit.
- source_word: ἐδίδαξα
  choice: habe gelehrt
  rationale: Das deutsche Perfekt klingt in direkter Rede natürlich und bezeichnet Jesu bisherige Lehrtätigkeit, ohne eine zusätzliche Verlaufsbedeutung einzuführen.
- source_word: ἐν συναγωγῇ
  choice: in der Synagoge
  rationale: Der griechische Singular wird bewahrt; er kann die Synagoge zugleich allgemein als öffentlichen Lehrort bezeichnen.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: „Tempel“ ist die knappe übliche Wiedergabe. Da ἱερόν hier den gesamten Tempelbezirk und nicht speziell das innere Heiligtum bezeichnet, wird dies in einer Fußnote erläutert.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: alle Juden
  rationale: Dies ist die direkte Wiedergabe. Der Kontext öffentlicher Zusammenkünfte spricht hier für eine breite gemeinschaftliche Bezeichnung; die kontextabhängigen Alternativen werden in einer Fußnote offengehalten.
- source_word: συνέρχονται
  choice: zusammenkommen
  rationale: Die Formulierung gibt das gemeinschaftliche Zusammenkommen präzise und in natürlichem Deutsch wieder.
- source_word: ἐν κρυπτῷ
  choice: im Verborgenen
  rationale: Der Ausdruck bewahrt den räumlich-bildhaften Gegensatz zu Jesu offenem Reden und klingt würdig und natürlich.
- source_word: ἐλάλησα οὐδέν
  choice: habe ich nichts gesagt
  rationale: Die deutsche Wortstellung hebt den abschließenden Gegensatz hervor; „nichts gesagt“ ist idiomatischer als eine wörtliche Formulierung wie „nichts gesprochen“.
- source_word: ἀπεκρίθη αὐτῷ
  choice: antwortete ihm
  rationale: Eine knappe, natürliche Wiedergabe der erzählenden Einleitung.
theological_decisions:
- issue: Bedeutungsumfang von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: Im Haupttext steht „alle Juden“; im vorliegenden Zusammenhang ist damit die jüdische Gemeinschaft an ihren öffentlichen Versammlungsorten gemeint.
  alternative: „das ganze jüdische Volk“ oder, je nach Verständnis des johanneischen Sprachgebrauchs, „alle Judäer“
  rationale: Ἰουδαῖοι ist bei Johannes kontextabhängig und kann Juden allgemein, Judäer oder in bestimmten Zusammenhängen führende jüdische Gruppen bezeichnen. Synagoge und Tempel weisen hier auf einen breiten gemeinschaftlichen Bezug. Die direkte Wiedergabe bleibt im Text, während die Fußnote die echte lexikalische Spannweite sichtbar macht und eine pauschal antijüdische Deutung vermeidet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung von „Ich habe“ spiegelt die zweimalige Setzung von ἐγώ und unterstreicht Jesu eigenes öffentliches Reden und Lehren. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
