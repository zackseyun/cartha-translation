source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: de
  text: 'Sie antworteten und sagten zu ihm: „Wenn dieser Mann nicht Böses täte[a], hätten wir ihn dir nicht ausgeliefert.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Übeltäter wäre“.'
    reason: Die griechische Wendung κακὸν ποιῶν kann verbal als „Böses tun“ oder substantivischer als Bezeichnung eines Übeltäters verstanden werden.
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Sie antworteten und sagten zu ihm
  rationale: Die Wiedergabe erhält beide Verben der semitisch geprägten Erzählformel, bleibt dabei in modernem Deutsch verständlich und bezieht αὐτῷ ausdrücklich auf Pilatus.
- source_word: Εἰ μὴ ἦν
  choice: Wenn ... nicht ... täte
  rationale: Der irreale Bedingungssatz wird im Deutschen idiomatisch mit Konjunktiv II wiedergegeben.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Die Formulierung bezeichnet Jesus klar und bewahrt zugleich den distanzierenden Ton des Demonstrativpronomens, ohne zusätzliche Verachtung einzutragen.
- source_word: κακὸν ποιῶν
  choice: Böses täte
  rationale: Die verbale Formulierung bewahrt die Bedeutung „Böses tun“ und macht daraus nicht vorschnell eine feste rechtliche oder moralische Personenbezeichnung.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: hätten wir ihn dir nicht ausgeliefert
  rationale: Der Konjunktiv II der Vergangenheit gibt die irreale Folge wieder. „Ausgeliefert“ passt zum behördlich-gerichtlichen Kontext von παραδίδωμι.
theological_decisions:
- issue: Art und Tragweite der gegen Jesus erhobenen Anschuldigung
  choice: Böses täte
  alternative: ein Übeltäter wäre
  rationale: κακὸν ποιῶν formuliert eine allgemeine Anschuldigung bösen Handelns und nennt keinen bestimmten Straftatbestand. Die Übersetzung bewahrt diese Unbestimmtheit und die ausweichende Antwort der Ankläger.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Redeeinleitung spiegelt bewusst die Ausdrucksweise des griechischen Textes; der Vorwurf bleibt allgemein und wird nicht zu einer konkreten juristischen Anklage präzisiert.
