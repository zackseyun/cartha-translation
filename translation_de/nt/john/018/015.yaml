source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: de
  text: Simon Petrus folgte Jesus, ebenso ein anderer Jünger.[a] Dieser Jünger war dem Hohepriester bekannt und ging zusammen mit Jesus in den Innenhof des Hohepriesters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Simon Petrus aber folgte Jesus und ein anderer Jünger.« Im Griechischen bleibt unausgesprochen, dass sich das Verb »folgte« auch auf den anderen Jünger bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: folgte
  rationale: Das deutsche Präteritum gibt die im griechischen Imperfekt dargestellte fortlaufende Handlung in einer Erzählung natürlich wieder; die Gleichzeitigkeit wird im Kontext deutlich.
- source_word: δὲ
  choice: unmarkiert
  rationale: Die milde fortführende Funktion von δέ wird durch den deutschen Erzählfluss ausreichend vermittelt; ein ausdrückliches »nun« würde eine nicht vorhandene Zeitangabe nahelegen.
- source_word: καὶ ἄλλος μαθητής
  choice: ebenso ein anderer Jünger
  rationale: Die Formulierung macht die im Griechischen implizite gemeinsame Handlung verständlich, ohne mehr als die koordinierte Aussage auszudrücken.
- source_word: μαθητής
  choice: Jünger
  rationale: »Jünger« ist im Johannesevangelium die geläufige und sachlich passende Bezeichnung für einen Schüler und Anhänger Jesu.
- source_word: ἐκεῖνος
  choice: dieser
  rationale: Das Demonstrativpronomen verweist auf den unmittelbar zuvor erwähnten anderen Jünger; »dieser Jünger« ist dafür im Deutschen natürlich.
- source_word: γνωστός
  choice: bekannt
  rationale: »Bekannt« bewahrt die offene Aussage über das Verhältnis zum Hohen Priester, ohne mit »gut bekannt« einen engeren Bekanntheitsgrad zu behaupten.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: dem Hohen Priester / des Hohen Priesters
  rationale: »Hoher Priester« ist die etablierte deutsche Wiedergabe des singularischen ἀρχιερεύς in diesem Zusammenhang.
- source_word: συνεισῆλθεν
  choice: ging zusammen mit Jesus hinein
  rationale: Die Wiedergabe bringt sowohl das Eintreten als auch die durch σύν bezeichnete Begleitung Jesu zum Ausdruck.
- source_word: αὐλήν
  choice: Innenhof
  rationale: Gemeint ist der umschlossene Hofbereich des Anwesens; »Innenhof« ist für heutige Leser klar, ohne das Gebäude näher zu bestimmen.
