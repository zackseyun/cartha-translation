id: JHN.18.13
reference: John 18:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: de
  text: Sie führten ihn zuerst zu Hannas; denn er war der Schwiegervater von Kajaphas, der in jenem Jahr Hohepriester war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: sie führten ihn
  rationale: ἄγω bezeichnet hier das Führen beziehungsweise Bringen einer festgenommenen Person. „Sie führten ihn“ gibt die Bewegung unter Bewachung natürlich und präzise wieder; das im Deutschen nötige Objekt „ihn“ ergibt sich aus dem Kontext.
- source_word: πρὸς Ἅνναν
  choice: zu Hannas
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf eine Person zu; „zu Hannas“ ist die direkte deutsche Entsprechung.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das adverbiale πρῶτον kennzeichnet die zeitliche Reihenfolge und weist Hannas als erste Station aus.
- source_word: πενθερός
  choice: Schwiegervater
  rationale: πενθερός bezeichnet spezifisch den Vater der Ehefrau; „Schwiegervater“ ist präzise und idiomatisch.
- source_word: ἀρχιερεύς
  choice: Hoher Priester
  rationale: Der Ausdruck bezeichnet hier das jüdische Hohepriesteramt. „Hoher Priester“ ist die etablierte deutsche Wiedergabe; die Großschreibung hebt den Amtstitel hervor.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: in jenem Jahr
  rationale: Die Genitivverbindung bezeichnet das betreffende Jahr der Amtsausübung. Die idiomatische Formulierung „in jenem Jahr“ bewahrt den zeitlichen Hinweis.
- source_word: Ἅνναν
  choice: Hannas
  rationale: Die im Deutschen bibelsprachlich etablierte Namensform wird verwendet.
- source_word: Καϊάφα
  choice: Kajaphas
  rationale: Die im Deutschen etablierte Namensform wird verwendet.
theological_decisions:
- issue: Bezugswort des Relativsatzes ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου
  choice: Der Relativsatz bezieht sich auf Kajaphas.
  alternative: Ein missverständlicher deutscher Satzbau könnte den Relativsatz auf Hannas beziehen.
  rationale: Das maskuline Singularpronomen ὃς schließt grammatisch zwar keinen der beiden Männer aus, doch der unmittelbar vorausgehende Genitiv τοῦ Καϊάφα und der johanneische Kontext bestimmen Kajaphas als den Hohen Priester jenes Jahres. Die deutsche Wortstellung hält diesen Bezug klar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Das Semikolon bildet die griechische Begründungsverknüpfung mit γάρ gut ab, ohne den Satz unnötig aufzuteilen. Keine Fußnote erforderlich.
