base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: de
  text: Da leugnete Petrus wieder, und sofort krähte ein Hahn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet die Wiederholung von Petrus’ Leugnen und wird im Deutschen knapp und natürlich mit »wieder« wiedergegeben.
- source_word: οὖν
  choice: Da
  rationale: Die Partikel verbindet die Antwort mit der unmittelbar vorausgehenden Frage und führt die Erzählung weiter; »da« bewahrt diesen folgernd-zeitlichen Zusammenhang, ohne eine starke logische Folgerung auszudrücken.
- source_word: ἠρνήσατο
  choice: leugnete es
  rationale: Das Verb bezeichnet hier Petrus’ verneinende Zurückweisung der vorausgehenden Frage. Das im Griechischen unausgesprochene Objekt wird im Deutschen idiomatisch als »es« aufgenommen; die Fußnote hält die formale Alternative offen.
- source_word: Πέτρος
  choice: Petrus
  rationale: Eingebürgerte deutsche Namensform.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet Petrus’ Leugnen mit dem unmittelbar folgenden Hahnenschrei.
- source_word: εὐθέως
  choice: sofort
  rationale: Bezeichnet die unmittelbare zeitliche Folge und klingt in modernem Deutsch natürlich und prägnant.
- source_word: ἀλέκτωρ
  choice: ein Hahn
  rationale: Die natürliche deutsche Bezeichnung für das männliche Haushuhn; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: ἐφώνησεν
  choice: krähte
  rationale: Das Verb bedeutet allgemein »einen Laut von sich geben/rufen«; bei einem Hahn ist »krähen« die idiomatische deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die kontextuell ergänzte Objektangabe »es« verbessert die deutsche Idiomatik; die Fußnote bewahrt die syntaktische Offenheit des griechischen Textes.
