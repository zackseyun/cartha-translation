  rationale: Die Revision beseitigt die im Deutschen unnötige Objekt-Ergänzung und die dazugehörige Fußnote. So bleibt die syntaktische Offenheit des griechischen Textes unmittelbar im deutschen Haupttext erhalten, während »Da«, »wieder«, »sofort« und »krähte« die narrative Abfolge und den Wortlaut angemessen wiedergeben.
