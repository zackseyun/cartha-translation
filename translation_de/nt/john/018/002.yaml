id: JHN.18.2
reference: John 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: de
  text: Auch Judas, der ihn auslieferte[a], kannte den Ort, denn Jesus war dort oft mit seinen Jüngern zusammengekommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihn verriet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn Jesus hatte sich dort oft mit seinen Jüngern getroffen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: kannte
  rationale: Das Verb bezeichnet hier Judas’ Vertrautheit mit dem Ort; „kannte“ ist im Deutschen dafür idiomatischer als „wusste“.
- source_word: δὲ καὶ
  choice: Auch
  rationale: δέ führt die Erzählung leicht weiter, während καί Judas ausdrücklich einbezieht. Im Deutschen gibt „Auch“ die additive Kraft natürlich wieder, ohne einen unnötig starken Gegensatz zu erzeugen.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: der ihn auslieferte
  rationale: „Ausliefern“ bewahrt die konkrete Bedeutung von παραδίδωμι und lässt zugleich im Kontext den verräterischen Charakter von Judas’ Handlung erkennen.
- source_word: τὸν τόπον
  choice: den Ort
  rationale: Eine direkte und natürliche Wiedergabe des bestimmten Ausdrucks.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι nennt hier den Grund dafür, dass Judas den Ort kannte; „denn“ stellt diesen Zusammenhang in flüssigem Deutsch her.
- source_word: πολλάκις συνήχθη
  choice: war dort oft … zusammengekommen
  rationale: Der formal passive Aorist von συνάγω kann hier intransitiv verstanden werden. Das Plusquamperfekt gibt das wiederholte, vor dem erzählten Geschehen liegende Zusammenkommen natürlich wieder.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: mit seinen Jüngern
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft; μαθηταί wird im Evangelium sachgerecht mit „Jünger“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von παραδιδοὺς bei Judas
  choice: der ihn auslieferte
  alternative: der ihn verriet
  rationale: „Ausliefern“ bleibt näher am konkreten Vorgang des Übergebens und vermeidet es, die kontextuell klare moralische Wertung direkt in das Verb einzubauen. Die geläufige Deutung „verraten“ wird in einer Fußnote genannt.
- issue: Sinn des passiven συνήχθη
  choice: Jesus war dort oft mit seinen Jüngern zusammengekommen
  alternative: Jesus hatte sich dort oft mit seinen Jüngern getroffen
  rationale: Die gewählte Fassung bewahrt das Motiv des Zusammenkommens und gibt den im Kontext intransitiven Sinn idiomatisch wieder, ohne eine handelnde Instanz hinter dem Passiv zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung setzt das additive „Auch“ natürlich an den Anfang. „Zusammengekommen“ hält die Nähe zum griechischen Sammel- bzw. Versammlungsausdruck, während die Fußnote die idiomatischere Alternative „sich getroffen“ bietet.
