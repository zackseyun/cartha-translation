source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: de
  text: 'Da fragte die Dienerin, die den Eingang bewachte, Petrus: „Du bist doch nicht auch einer von den Jüngern dieses Mannes?“ Er sagte: „Nein, bin ich nicht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier den Fortgang der Erzählung und den Anschluss an die vorausgehende Situation, ohne eine zu starke Schlussfolgerung auszudrücken.
- source_word: παιδίσκη
  choice: Dienerin
  rationale: Bezeichnet eine junge weibliche Bedienstete, möglicherweise eine Sklavin. „Dienerin“ ist im heutigen Deutsch natürlich; der rechtliche Status ist an dieser Stelle nicht eindeutig im Vordergrund.
- source_word: θυρωρός
  choice: die am Tor Wache hielt
  rationale: Gibt ihre Funktion am Eingang verständlich und idiomatisch wieder. „Torhüterin“ wäre möglich, klingt hier jedoch eher wie eine feste Amtsbezeichnung.
- source_word: Μὴ καὶ σὺ
  choice: Du bist doch nicht auch
  rationale: Die mit μή eingeleitete Frage legt eine verneinende Antwort nahe. Die deutsche Formulierung mit „doch nicht auch“ bewahrt diese Erwartung.
- source_word: ἐκ τῶν μαθητῶν
  choice: einer von den Jüngern
  rationale: Gibt die Zugehörigkeit zu einer Gruppe idiomatisch wieder und bewahrt den partitiven Sinn von ἐκ.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: dieses Mannes
  rationale: Bewahrt die gewöhnliche Bedeutung von ἄνθρωπος und den distanzierenden Ton des Demonstrativpronomens, ohne daraus einen Titel zu machen.
- source_word: ἐκεῖνος
  choice: Er
  rationale: Das Pronomen verweist im Zusammenhang auf Petrus; im natürlichen Deutschen genügt „Er“.
- source_word: Οὐκ εἰμί
  choice: Nein, bin ich nicht
  rationale: Eine knappe, natürliche deutsche Verneinung, die die elliptische Kürze der griechischen Antwort wahrt.
theological_decisions:
- issue: Aussagekraft der mit μή eingeleiteten Frage
  choice: 'Als Frage formuliert, die eine verneinende Antwort nahelegt: „Du bist doch nicht auch …?“'
  alternative: Eine neutrale Frage wie „Bist du auch …?“ oder die stärker markierte Form „Du bist doch wohl nicht auch …?“
  rationale: Die gewählte Form bewahrt die grammatische Erwartung einer negativen Antwort, ohne Tonfall oder Motivation der Dienerin über den Text hinaus festzulegen.
- issue: Sozialer Status der παιδίσκη
  choice: „Dienerin“ im Haupttext
  alternative: „Sklavin“ oder „Dienstmädchen“
  rationale: Das Wort kann eine junge Sklavin oder Dienerin bezeichnen. Der genaue Rechtsstatus bleibt hier offen; „Dienerin“ ist natürlich und vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Frage bewahrt ihre Erwartung einer negativen Antwort; die knappe Antwort des Petrus bleibt pointiert. Keine Fußnote ist nötig, da die mögliche Statusnuance von παιδίσκη im Deutschen nicht sicher genug ist, um eine Alternative im Haupttext zu erzwingen.
