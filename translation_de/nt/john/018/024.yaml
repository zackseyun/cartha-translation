  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: de
  text: Daraufhin schickte Hannas ihn gefesselt zu Kajafas, dem Hohenpriester[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Zusammenhang als rückblickender Einschub: „Hannas hatte ihn gefesselt zu Kajafas, dem Hohenpriester, geschickt.“'
    reason: Alternative zeitliche Einordnung des Aorists im Erzählzusammenhang.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Der Aorist Aktiv bezeichnet hier im fortlaufenden Bericht ein Senden. „Schickte“ ist im modernen Deutschen natürlich und weniger amtlich als „sandte“.
- source_word: οὖν
  choice: Daraufhin
  rationale: Die Partikel kennzeichnet den Fortgang beziehungsweise die Folgerung im Bericht. „Daraufhin“ gibt diese Funktion idiomatisch wieder, ohne eine streng logische Folgerung zu erzwingen.
- source_word: δεδεμένον
  choice: gefesselt
  rationale: Das Perfekt Passiv Partizip beschreibt Jesu fortbestehenden Zustand beim Wegschicken. „Gefesselt“ ist präzise und natürlich; „weiterhin gefesselt“ würde eine im Griechischen nicht eigens markierte Betonung hinzufügen.
- source_word: πρὸς
  choice: zu
  rationale: Bei einem Verb der Bewegung und einer Person als Ziel bezeichnet πρός die Bewegung zu dieser Person hin.
- source_word: ὁ Ἅννας
  choice: Hannas
  rationale: „Hannas“ ist die im Deutschen etablierte Form des Eigennamens.
- source_word: Καϊάφαν
  choice: Kajafas
  rationale: „Kajafas“ ist die im Deutschen etablierte Form des Eigennamens.
- source_word: τὸν ἀρχιερέα
  choice: dem Hohen Priester
  rationale: ἀρχιερεύς bezeichnet hier das Amt des Hohen Priesters. Die Apposition steht im Deutschen nach „zu Kajafas“ im Dativ.
theological_decisions:
- issue: Zeitliche Einordnung gegenüber dem unmittelbaren Kontext
  choice: 'Der Haupttext gibt den Aorist als Ereignis der fortlaufenden Erzählung wieder: Hannas schickte Jesus gefesselt zu Kajafas.'
  alternative: 'Der Satz kann als rückblickender Einschub verstanden werden: Hannas hatte Jesus bereits gefesselt zu Kajafas geschickt.'
  rationale: Die griechische Aoristform lässt sich zunächst als schlichtes Erzähltempus verstehen. Da jedoch die Einordnung in den Zusammenhang umstritten ist, wird die rückblickende Deutung in einer Fußnote bewahrt, statt die Spannung im Haupttext harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Daraufhin“ sorgt für einen natürlichen Erzählfluss; „gefesselt“ erhält knapp den im griechischen Perfektpartizip ausgedrückten Zustand. Die Großschreibung von „Hohen Priester“ behandelt die Bezeichnung als Amtsbezeichnung.
