  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: de
  text: 'Jesus antwortete: »Sagst du das von dir selbst aus, oder haben andere dir von mir erzählt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche deutsche Erzählverb für die Antwort auf eine vorausgehende Frage.
- source_word: Ἀπὸ σεαυτοῦ
  choice: von dir selbst aus
  rationale: Bewahrt den mit ἀπό ausgedrückten Gedanken des Ursprungs und klingt im modernen Deutschen natürlich.
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und trägt die Betonung der griechischen Frage.
- source_word: τοῦτο λέγεις
  choice: sagst du das
  rationale: Eine natürliche deutsche Wiedergabe der gegenwärtigen Äußerung; »das« verweist auf die unmittelbar vorausgehende Frage des Pilatus.
- source_word: ἄλλοι εἶπόν σοι
  choice: haben andere dir … erzählt
  rationale: Gibt die Mitteilung durch andere idiomatisch wieder. Das Perfekt ist in gegenwärtiger deutscher Rede für ein zurückliegendes, hier relevantes Mitteilen natürlich.
- source_word: περὶ ἐμοῦ
  choice: von mir
  rationale: Bei »erzählen« ist »von mir« die natürliche Wiedergabe von περί mit Genitiv im Sinn von »über mich«.
theological_decisions:
- issue: Sinnrichtung der Gegenfrage Jesu an Pilatus
  choice: 'Die Frage bleibt auf den Ursprung der Aussage bezogen: ob sie von Pilatus selbst oder von anderen stammt.'
  alternative: 'Deutender wiedergeben: »Fragst du das aus eigenem Antrieb?«'
  rationale: Der griechische Wortlaut fragt zunächst nach der Herkunft des Gesagten und legt Pilatus weder ein bestimmtes Motiv noch ein theologisches Verständnis in den Mund.
translation_notes:
  register: Moderne, würdige Standardsprache in direkter Rede. »Von dir selbst aus« erhält die Quellenbedeutung des griechischen Ausdrucks, ohne unnötig wörtlich oder altertümlich zu wirken.
