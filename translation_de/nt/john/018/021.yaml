source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: de
  text: Warum fragst du mich? Frag die, die gehört haben, was ich ihnen gesagt habe. Sieh[a], diese hier wissen, was ich gesagt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe“. Das griechische Wort fordert dazu auf, die Aufmerksamkeit auf die genannten Hörenden zu richten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Warum fragst du mich?
  rationale: τί mit dem Präsens ἐρωτᾷς bildet eine direkte Gegenfrage. „Fragen“ ist im Deutschen auch in einem Verhör natürlich; „verhören“ wäre stärker und enger als das griechische Verb.
- source_word: ἐρώτησον
  choice: Frag
  rationale: Der Aoristimperativ fordert zu einer unmittelbaren Handlung auf. Die Wiederholung von „fragen“ bewahrt die Parallelität mit dem vorhergehenden Verb.
- source_word: τοὺς ἀκηκοότας
  choice: die, die gehört haben
  rationale: Das Perfektpartizip bezeichnet diejenigen, die Jesu Worte gehört haben und daher als Wissende gelten. Das Perfekt wird im Deutschen natürlich wiedergegeben.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: was ich zu ihnen gesagt habe
  rationale: λαλέω bedeutet hier schlicht „reden/sagen“. „Zu ihnen gesagt“ ist idiomatisch und hält die Adressatenangabe αὐτοῖς ausdrücklich fest.
- source_word: ἴδε
  choice: Sieh
  rationale: Der Imperativ dient als aufmerksamkeitslenkender Ausdruck. „Sieh“ bewahrt die Bildlichkeit und den direkten Ton, ohne das altertümliche „siehe“ zu verwenden.
- source_word: οὗτοι οἴδασιν
  choice: sie wissen
  rationale: Das deutsche Pronomen greift die unmittelbar zuvor genannten Hörenden natürlich auf. Der demonstrative Bezug von οὗτοι bleibt aus dem Zusammenhang erkennbar; „diese wissen“ wäre unidiomatisch.
- source_word: ἃ εἶπον ἐγώ
  choice: was ich gesagt habe
  rationale: Die Formulierung gibt die Inhaltsangabe natürlich wieder. Das ausdrücklich gesetzte ἐγώ hebt Jesus hervor, doch ein zusätzliches „ich selbst“ wäre im Deutschen unnötig schwer und stärker markiert.
theological_decisions:
- issue: Forensischer Ton von Jesu Antwort vor dem Hohen Priester
  choice: ἐρωτάω in beiden Fällen mit „fragen“ wiedergeben
  alternative: „verhören“ beziehungsweise „befragen“ verwenden
  rationale: Der gerichtliche Zusammenhang verleiht dem neutralen Verb bereits einen forensischen Ton. „Verhören“ würde eine engere Bedeutung eintragen; „befragen“ würde zudem die erkennbare Wortwiederholung weniger natürlich gestalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede. Die bewusste Wiederholung von „fragen“ und „gesagt“ folgt der griechischen Struktur. Der Satz bleibt knapp und konfrontativ, ohne den gerichtlichen Ton durch ein engeres deutsches Fachwort zu überzeichnen.
