id: JHN.18.6
reference: John 18:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: de
  text: 'Als er nun zu ihnen sagte: »Ich bin es«[a], wichen sie zurück und fielen zu Boden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich bin«. Die griechische Wendung kann zugleich an die markanten Ich-bin-Aussagen im Johannesevangelium anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Als … nun
  rationale: Die Verbindung gibt sowohl den zeitlichen Sinn von ὡς als auch den erzählerischen Anschluss durch οὖν in natürlichem Deutsch wieder.
- source_word: εἶπεν αὐτοῖς
  choice: er zu ihnen sagte
  rationale: Direkte und im Deutschen idiomatische Wiedergabe von λέγω mit dem Dativ αὐτοῖς.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Zusammenhang dient die Wendung der Selbstidentifikation. »Ich bin es« ist dafür natürliches Deutsch; die wörtlichere und möglicherweise theologisch anklingende Form »Ich bin« bleibt in der Fußnote erhalten.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: wichen sie zurück
  rationale: Die Formulierung bezeichnet eine Bewegung nach hinten. »Wichen … zurück« gibt diese Reaktion prägnant und idiomatisch wieder, ohne eine Ursache hinzuzufügen.
- source_word: ἔπεσαν χαμαί
  choice: fielen zu Boden
  rationale: Natürliche, genaue Wiedergabe des Sturzes auf den Boden.
theological_decisions:
- issue: Wiedergabe von Ἐγώ εἰμι im johanneischen Zusammenhang
  choice: Ich bin es
  alternative: Ich bin
  rationale: Der unmittelbare Gesprächszusammenhang spricht für eine Selbstidentifikation. Zugleich kann die absolute griechische Form an die markanten Ich-bin-Aussagen im Johannesevangelium erinnern; diese Spannung wird durch eine Fußnote bewahrt, statt im Haupttext einseitig aufgelöst zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählstil; »wichen zurück« bewahrt die körperliche Rückwärtsbewegung knapp und anschaulich.
