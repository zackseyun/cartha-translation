  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: de
  text: 'Da schrien sie wieder: „Nicht diesen, sondern Barabbas!“ Barabbas aber war ein Räuber.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Bandit“; das griechische Wort kann je nach Zusammenhang einen Räuber, Wegelagerer oder gewalttätigen Aufständischen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: schrien
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien; „schrien“ ist im modernen Deutschen kräftig und natürlich.
- source_word: οὖν
  choice: Da
  rationale: οὖν knüpft folgernd beziehungsweise fortführend an den vorausgehenden Wortwechsel an; „Da“ gibt diesen erzählerischen Zusammenhang idiomatisch wieder.
- source_word: πάλιν
  choice: wieder
  rationale: Die Wiederholung des Rufens wird direkt wiedergegeben.
- source_word: λέγοντες
  choice: durch direkte Rede wiedergegeben
  rationale: Das partizipiale „sagend“ wird im Deutschen nach „schrien“ nicht eigens ausgedrückt, da der Doppelpunkt mit der direkten Rede dieselbe Funktion natürlich übernimmt.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Nicht diesen, sondern Barabbas!
  rationale: „Diesen“ bewahrt die demonstrative Kraft von τοῦτον; die knappe Ellipse und der scharfe Gegensatz bleiben erhalten.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barabbas
  rationale: Der Personenname wird gemäß der etablierten deutschen Form wiedergegeben.
- source_word: ἦν δὲ
  choice: Barabbas aber war
  rationale: δέ führt eine erklärende Hintergrundangabe ein; „aber“ wahrt zugleich die formale Verknüpfung und klingt in diesem Satz natürlich.
- source_word: λῃστής
  choice: Räuber
  rationale: „Räuber“ gibt den Grundsinn transparent wieder. Die mögliche Bedeutung „Bandit“ beziehungsweise in bestimmten Kontexten „gewalttätiger Aufständischer“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von λῃστής als Bezeichnung für Barabbas
  choice: Räuber
  alternative: Bandit; gewalttätiger Aufständischer
  rationale: Der Grundsinn des Wortes ist „Räuber“ oder „Bandit“. Im judäischen Kontext des ersten Jahrhunderts kann es mit gewaltsamem Aufruhr verbunden sein, doch dieser Vers allein legt die präzisere Deutung „Aufständischer“ nicht eindeutig fest. Daher steht die transparente Grundbedeutung im Haupttext, während die weitere Bedeutungsbreite in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Zuruf bleibt knapp und nachdrücklich; unnötig steife Doppelungen wie „schrien und sagten“ werden vermieden. Die echte Bedeutungsbreite von λῃστής wird nicht im Haupttext vereindeutigt, sondern in der Fußnote offengelegt.
