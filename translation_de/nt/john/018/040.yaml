  naturalness: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede ist idiomatisch und nachdrücklich; die Auslassung eines zusätzlichen „sagten“ nach „schrien“ ist im Deutschen natürlich.
  terminology: „Räuber“ ist für λῃστής die angemessene Grundbedeutung. Die Fußnote nennt mit „Bandit“, „Wegelagerer“ und kontextabhängig „gewalttätiger Aufständischer“ die relevante Bedeutungsbreite, ohne den Vers auf eine historisch weitergehende Deutung festzulegen. Der Name Barabbas entspricht der üblichen deutschen Form.
