  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: de
  text: Da ging nun auch der andere Jünger, der zuerst zum Grab gekommen war, hinein; er sah und glaubte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text sagt lediglich „glaubte“, ohne ausdrücklich zu nennen, was er glaubte. Ausleger verstehen dies unterschiedlich: Er könnte an die Auferstehung geglaubt haben, an das, was er vorfand, oder an den früheren Bericht.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Da … nun
  rationale: Die Verbindung kennzeichnet sowohl den nächsten Schritt der Erzählung als auch eine leichte Folgerung. „Da … nun“ gibt beides in natürlichem deutschen Erzählstil wieder.
- source_word: εἰσῆλθεν
  choice: ging … hinein
  rationale: Das Verb bezeichnet das Eintreten in das Grab. „Hineingehen“ ist im Deutschen anschaulich und idiomatisch.
- source_word: ὁ ἄλλος μαθητής
  choice: der andere Jünger
  rationale: „Jünger“ ist in diesem johanneischen Zusammenhang die etablierte und sachlich passende Wiedergabe von μαθητής.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: der zuerst zum Grab gekommen war
  rationale: Der Relativsatz gibt die vorzeitige Handlung des Partizips natürlich wieder und bezeichnet den Jünger als denjenigen, der das Grab vor Petrus erreicht hatte.
- source_word: μνημεῖον
  choice: Grab
  rationale: Gemeint ist hier konkret die Grabanlage, in die Jesus gelegt worden war; „Grab“ ist die präzise und geläufige deutsche Bezeichnung.
- source_word: καὶ εἶδεν
  choice: er sah
  rationale: Die einfache Wiedergabe bewahrt die knappe Folge der griechischen Verben; das ausgesprochene Pronomen sorgt nach dem Relativsatz für Klarheit.
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Wie im Griechischen bleibt das Objekt unausgesprochen. So wird nicht vorweggenommen, was genau der Jünger glaubte.
theological_decisions:
- issue: Inhalt des Glaubens des Jüngers
  choice: 'Das Verb steht ohne ergänztes Objekt: „glaubte“.'
  alternative: „glaubte, dass Jesus auferstanden war“, „glaubte Marias Bericht“ oder „kam zum Glauben“
  rationale: Der griechische Text nennt den Inhalt des Glaubens nicht ausdrücklich. Eine Ergänzung würde die in Verbindung mit dem folgenden Vers bestehende Auslegungsfrage einseitig entscheiden.
translation_notes:
  register: Moderner, würdiger Erzählstil. Das Semikolon hält die eng verbundene Handlungsfolge zusammen, ohne die wiederholten griechischen καί-Verknüpfungen schwerfällig nachzubilden. Die Fußnotenmarkierung steht unmittelbar bei der auslegungsbedürftigen Aussage.
