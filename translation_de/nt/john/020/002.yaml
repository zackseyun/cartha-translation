source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: de
  text: 'Da läuft sie los und kommt zu Simon Petrus und zu dem anderen Jünger, den Jesus lieb hatte,[a] und sagt zu ihnen: »Sie haben den Herrn aus dem Grab weggenommen, und wir wissen nicht, wo sie ihn hingelegt haben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der andere Jünger, den Jesus liebte«. Das hier verwendete Verb φιλέω kann persönliche Zuneigung hervorheben; auch möglich: »den Jesus besonders gernhatte«.'
    reason: lexical_alternative
  - marker: b
    text: Maria sagt »wir wissen nicht« und verwendet damit wie der griechische Text die erste Person Plural. Ob sie dabei weitere Frauen einschließt, erklärt der Vers nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Da läuft sie los und kommt
  rationale: Die historischen Präsensformen werden zur lebendigen Erzählung im Präsens beibehalten. »Da« gibt die folgernde narrative Funktion von οὖν natürlich wieder; »läuft sie los« drückt den Beginn der eiligen Bewegung idiomatisch aus.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: zu Simon Petrus und zu dem anderen Jünger
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu Personen. μαθητής wird im Evangelienkontext sachgerecht mit »Jünger« wiedergegeben.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: den Jesus lieb hatte
  rationale: φιλέω bezeichnet hier persönliche Liebe beziehungsweise Zuneigung. »lieb hatte« bewahrt diese mögliche Nuance und klingt im modernen Deutschen natürlich, ohne die Bedeutung zu bloßer Sympathie abzuschwächen.
- source_word: λέγει αὐτοῖς
  choice: sagt zu ihnen
  rationale: Das historische Präsens wird beibehalten und führt unmittelbar zur direkten Rede.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Sie haben den Herrn aus dem Grab weggenommen
  rationale: Das Perfekt gibt im Deutschen die abgeschlossene Handlung mit gegenwärtigem Ergebnis natürlich wieder. μνημεῖον bezeichnet hier ein Grab; κύριος wird als ehrerbietiger Titel mit »Herr« übersetzt.
- source_word: οὐκ οἴδαμεν
  choice: wir wissen nicht
  rationale: Die ausdrücklich erste Person Plural des griechischen Textes bleibt erhalten und wird nicht zu einer Einzahl harmonisiert.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: wohin sie ihn gelegt haben
  rationale: ποῦ kann im Zusammenhang der Verbringung idiomatisch als Zielangabe »wohin« verstanden werden. »gelegt haben« gibt τίθημι wieder und hält die gegenwärtige Ungewissheit fest.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Jesus
  choice: der Herr
  alternative: der Meister
  rationale: »Herr« bewahrt den etablierten ehrerbietigen und christologischen Titel, ohne ihn auf eine bloße Lehrer- oder Autoritätsbezeichnung zu verengen.
- issue: Mehrzahl in οὐκ οἴδαμεν
  choice: wir wissen nicht
  alternative: ich weiß nicht
  rationale: Die Mehrzahl wird entsprechend dem griechischen Wortlaut bewahrt. Wer außer Maria darin eingeschlossen ist, erklärt dieser Vers nicht; eine Angleichung an ihre einzelne Person würde die Spannung vorschnell auflösen.
- issue: Subjekt der Wegnahme
  choice: Sie haben … weggenommen
  alternative: Man hat … weggenommen
  rationale: Die griechische Verbform enthält ein unbestimmtes Subjekt in der dritten Person Plural. Die deutsche Wiedergabe mit »sie« bewahrt diese Form, ohne die Handelnden zu identifizieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die historischen Präsensformen sorgen für Unmittelbarkeit. Die Anführungszeichen folgen der üblichen deutschen Typografie.
