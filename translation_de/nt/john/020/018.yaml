  terminology: „Maria aus Magdala“, „Jünger“ und „Herr“ sind treffend und im modernen, würdevollen Standarddeutsch angemessen. Die Stellung „er ihr dies gesagt“ ist idiomatischer als „er dies zu ihr gesagt“.
