source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: de
  text: Maria aus Magdala kam zu den Jüngern und berichtete ihnen[a], sie habe den Herrn gesehen und er habe ihr dies gesagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Maria aus Magdala kam zu den Jüngern und berichtete ihnen, sie habe den Herrn gesehen. Und er sagte ihr dies.“ Der letzte Satzteil kann entweder als Bestandteil von Marias Bericht oder als Kommentar des Erzählers verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: kam
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; „kam“ bezeichnet die Bewegung zu den Jüngern.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria aus Magdala
  rationale: Die Herkunftsbezeichnung wird transparent und idiomatisch wiedergegeben.
- source_word: ἀγγέλλουσα
  choice: berichtete ihnen
  rationale: Das Partizip bezeichnet die gleichzeitig mit dem Kommen erfolgende Übermittlung einer Nachricht. Eine finite Verbform klingt im Deutschen natürlicher.
- source_word: τοῖς μαθηταῖς
  choice: zu den Jüngern … ihnen
  rationale: „Jünger“ ist die etablierte Wiedergabe von μαθητής; ein nicht ausdrücklich vorhandenes Possessivpronomen wird vermieden.
- source_word: ὅτι
  choice: Doppelpunkt und direkte Rede
  rationale: ὅτι leitet den Inhalt der Mitteilung ein; die direkte Rede bewahrt die Unmittelbarkeit der Aussage.
- source_word: Ἑώρακα
  choice: Ich habe … gesehen
  rationale: Das deutsche Perfekt gibt die vollendete Wahrnehmung mit fortdauernder Bedeutung angemessen wieder.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ bewahrt in diesem Auferstehungskontext den Titel und sein christologisches Gewicht.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: und dass er dies zu ihr gesagt hatte
  rationale: Die Formulierung versteht den Satzteil als Fortsetzung des Inhalts von Marias Bericht. Das Plusquamperfekt macht deutlich, dass Jesu Worte ihrem Bericht vorausgingen; „dies“ gibt ταῦτα idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von κύριος im Auferstehungskontext
  choice: den Herrn
  alternative: den Meister
  rationale: „Herr“ ist der etablierte Titel für Jesus und erhält das christologische Gewicht des Ausdrucks, ohne es auszudeuten.
- issue: Bezug von καὶ ταῦτα εἶπεν αὐτῇ
  choice: 'Als weiterer Inhalt von Marias Bericht: „und dass er dies zu ihr gesagt hatte“'
  alternative: 'Als Erzählerkommentar: „Und er hatte dies zu ihr gesagt.“'
  rationale: Ein zweites ὅτι steht zwar nicht im Griechischen, doch kann der Satzteil syntaktisch als Fortsetzung dessen verstanden werden, was Maria berichtete. Da auch ein Erzählerkommentar möglich ist, wird die Mehrdeutigkeit in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist für gewöhnliche Leser gut verständlich und bewahrt durch die Fußnote die echte syntaktische Mehrdeutigkeit des griechischen Textes.
