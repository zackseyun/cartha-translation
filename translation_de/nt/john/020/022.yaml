  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: de
  text: 'Nachdem er das gesagt hatte, hauchte er sie an[a] und sagte zu ihnen: »Empfangt den Heiligen Geist!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hauchte er in sie hinein«. Das Verb erinnert außerdem an die Bildsprache von Schöpfung und Neuschöpfung in 1. Mose 2,7 und Hesekiel 37.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht. Diese Formulierung gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: ἐνεφύσησεν
  choice: hauchte er sie an
  rationale: Das Verb bezeichnet hier ein Anhauchen beziehungsweise Einhauchen. »Er hauchte sie an« ist im Deutschen idiomatisch und legt die mögliche Schöpfungs- und Neuschöpfungsbildsprache nicht schon im Haupttext eindeutig fest.
- source_word: λέγει αὐτοῖς
  choice: sagte zu ihnen
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben, ohne den Sinn zu verändern.
- source_word: Λάβετε
  choice: Empfangt
  rationale: Der Imperativ bezeichnet hier das Empfangen des Geistes. »Empfangt« ist kontextgemäß und vermeidet die mögliche Vorstellung eigenmächtigen Ergreifens, die »Nehmt« nahelegen könnte.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Im johanneischen Zusammenhang ist der göttliche Heilige Geist gemeint. Der bestimmte Artikel ist im Deutschen nach »empfangen« natürlich, obwohl die griechische Wortgruppe artikellos ist.
theological_decisions:
- issue: Ob πνεῦμα ἅγιον als unpersönlicher »heiliger Geist« oder als der göttliche »Heilige Geist« wiederzugeben ist
  choice: den Heiligen Geist
  alternative: heiligen Geist
  rationale: Der Zusammenhang im Johannesevangelium spricht für den göttlichen Heiligen Geist. Großschreibung und bestimmter Artikel entsprechen diesem Bezug, ohne über den Text hinauszugehen.
- issue: Richtung beziehungsweise Ziel des in ἐνεφύσησεν bezeichneten Hauchens
  choice: hauchte er sie an
  alternative: hauchte er in sie hinein
  rationale: Die Formulierung im Haupttext bewahrt die im unmittelbaren Satz nicht vollständig bestimmte Richtung. Die alternative Wiedergabe und die Anklänge an Schöpfung und Neuschöpfung werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Präteritum dient der flüssigen Erzählung; die direkte Rede bleibt knapp und nachdrücklich.
