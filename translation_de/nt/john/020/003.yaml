  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: de
  text: Da gingen Petrus und der andere Jünger hinaus und waren auf dem Weg zum Grab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: »und gingen zum Grab.« Das griechische Imperfekt schildert die Bewegung als andauernd; »waren auf dem Weg« bringt dies deutlicher zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: gingen … hinaus
  rationale: Der griechische Singular steht bei einem zusammengesetzten Subjekt, dessen erstes Glied Petrus ist; im natürlichen Deutschen verlangt das gemeinsame Prädikat den Plural. »Hinausgehen« bewahrt die Bedeutung des Aufbruchs aus einem Ort.
- source_word: οὖν
  choice: Da
  rationale: οὖν kennzeichnet hier die erzählerische Folge aus dem vorherigen Vers. »Da« verbindet die Handlung natürlich und würdevoll, ohne das stärker folgernde »deshalb« aufzudrängen.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: ὁ ἄλλος μαθητής
  choice: der andere Jünger
  rationale: »Jünger« ist im Evangelienkontext die etablierte und verständliche Wiedergabe von μαθητής; »der andere« nimmt die bereits bekannte Person auf.
- source_word: ἤρχοντο
  choice: machten sich auf den Weg
  rationale: Die Form ist Imperfekt und stellt die Bewegung als im Verlauf befindlich dar. Die deutsche Wendung gibt den fortschreitenden Aufbruch natürlich wieder und vermeidet das schwerfällige »waren unterwegs« nach »gingen hinaus«.
- source_word: εἰς τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet hier Jesu Grabstätte. »Zum« drückt die Bewegung auf das Ziel hin aus, ohne vorwegzunehmen, dass sie in das Grab hineingingen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechische Verbfolge wird bewahrt, aber idiomatisch formuliert; die aspektuelle Nuance des Imperfekts bleibt durch »machten sich auf den Weg« erkennbar.
