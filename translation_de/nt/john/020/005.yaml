  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: de
  text: Und als er sich vorbeugte, sah er die Leinentücher daliegen[a], ging aber nicht hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sah die Leinentücher liegen“; das griechische Partizip lässt offen, ob die örtliche Bedeutung „da“ ausdrücklich wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: er beugte sich vor
  rationale: Das Aoristpartizip bezeichnet eine körperliche Bewegung nach vorn bzw. ein Sich-Hineinbeugen. Im Zusammenhang mit dem Grab ist die Blickrichtung bereits durch das anschließende Sehen deutlich.
- source_word: βλέπει
  choice: sah
  rationale: Das griechische historische Präsens belebt die Erzählung; im natürlichen deutschen Erzählstil wird es hier mit dem Präteritum wiedergegeben.
- source_word: κείμενα
  choice: daliegen
  rationale: Das Partizip von κεῖμαι beschreibt die vorgefundene Lage der Tücher. „daliegen“ gibt dies knapp und idiomatisch wieder, ohne ein absichtliches Hinlegen zu unterstellen.
- source_word: τὰ ὀθόνια
  choice: die Leinentücher
  rationale: Die Bezeichnung meint kleinere Leinentücher beziehungsweise Leinenbinden; „Leinentücher“ bleibt nah am Wortlaut, während der Bestattungskontext die Funktion erkennen lässt.
- source_word: οὐ μέντοι
  choice: aber nicht
  rationale: Die Verbindung markiert den Gegensatz zwischen dem Sehen und dem unterlassenen Hineingehen; „aber nicht“ ist im Deutschen klar und natürlich.
- source_word: εἰσῆλθεν
  choice: ging ... hinein
  rationale: Der Aorist bezeichnet das Hineingehen. „hineingehen“ ist in der konkreten Grabszene natürlich und präzise.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Das deutsche Präteritum wahrt einen flüssigen narrativen Zusammenhang; die konkrete Körperbewegung und der Gegensatz zum Nicht-Hineingehen bleiben erhalten.
