id: JHN.20.27
reference: John 20:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: de
  text: 'Dann sagte er zu Thomas: „Bring deinen Finger hierher und sieh meine Hände an! Bring deine Hand her und lege sie in meine Seite! Und werde nicht ungläubig, sondern gläubig.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und werde nicht treulos, sondern treu.“ Die griechischen Adjektive können beide Bedeutungen tragen; in diesem Zusammenhang steht jedoch Thomas’ Glaube an den auferstandenen Jesus im Vordergrund.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Dann
  rationale: Kennzeichnet die zeitliche Abfolge der Erzählung knapp und natürlich.
- source_word: λέγει
  choice: sagte er
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Φέρε … φέρε
  choice: Bring … Bring … her
  rationale: Bewahrt die Wiederholung des griechischen Imperativs und beschreibt die Bewegung von Finger und Hand zu Jesus hin.
- source_word: δάκτυλόν σου ὧδε
  choice: deinen Finger hierher
  rationale: „Hierher“ gibt die auf ein Bewegungsziel bezogene deiktische Kraft von ὧδε in diesem Zusammenhang natürlich wieder.
- source_word: ἴδε τὰς χεῖράς μου
  choice: sieh meine Hände an
  rationale: „Ansehen“ ist im Deutschen bei einem bewussten prüfenden Blick idiomatischer als das bloße „sehen“ und bleibt dem Imperativ ἴδε nahe.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: lege sie in meine Seite
  rationale: „Lege“ gibt den Imperativ βάλε natürlich wieder; „in“ bewahrt die Richtung von εἰς. Das Pronomen nimmt die im Deutschen feminine „Hand“ auf.
- source_word: μὴ γίνου
  choice: werde nicht
  rationale: Bewahrt gegenüber einem statischen „sei nicht“ die prozesshafte Bedeutung von γίνομαι, ohne ein bereits dauerhaft bestehendes Unglauben zu behaupten.
- source_word: ἄπιστος … πιστός
  choice: ungläubig … gläubig
  rationale: Im unmittelbaren Kontext geht es um Thomas’ Glauben an den auferstandenen Jesus. Zugleich erhält das Adjektivpaar seine knappe, direkte Form.
theological_decisions:
- issue: Bedeutung des Gegensatzes ἄπιστος / πιστός
  choice: ungläubig / gläubig
  alternative: treulos / treu
  rationale: Der Erzählzusammenhang stellt Thomas’ Weigerung, das Zeugnis von Jesu Auferstehung zu glauben, in den Mittelpunkt. Die alternative Bedeutung im Sinn von Treue ist lexikalisch möglich und wird deshalb in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Imperative und der scharfe Schlusskontrast bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
