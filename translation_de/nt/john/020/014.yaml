source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: de
  text: Nachdem sie das gesagt hatte, wandte sie sich um und sah Jesus dastehen; und sie wusste nicht, dass es Jesus war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie erkannte nicht, dass es Jesus war.“ Im Griechischen steht wörtlich: „sie wusste nicht, dass Jesus ist“; die Formulierung beschreibt ihre fehlende Erkenntnis seiner Identität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: Nachdem sie das gesagt hatte
  rationale: Das pluralische ταῦτα wird im natürlichen Deutschen idiomatisch mit „das“ zusammengefasst; die vorzeitige Handlung des Aoristpartizips εἰποῦσα wird durch „nachdem … gesagt hatte“ klar ausgedrückt.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: wandte sie sich um
  rationale: Die griechische Wendung bezeichnet eine Drehung zu dem, was hinter ihr liegt; „sich umwenden“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: θεωρεῖ
  choice: sah
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben. „Sah“ bezeichnet hier die tatsächliche visuelle Wahrnehmung, ohne bereits Erkennen zu unterstellen.
- source_word: ἑστῶτα
  choice: dastehen
  rationale: Das Partizip beschreibt Jesus in stehender Haltung. „Dastehen“ verbindet Wahrnehmungsverb und Haltung knapp und idiomatisch.
- source_word: οὐκ ᾔδει
  choice: sie wusste nicht
  rationale: Die Form von οἶδα bezeichnet grundsätzlich Wissen beziehungsweise Kenntnis. Die wörtlichere Wiedergabe bewahrt, dass der griechische Text den Grund ihres Nichterkennens nicht erklärt.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: dass es Jesus war
  rationale: Die deutsche Identifikationsformel „dass es Jesus war“ ist idiomatisch. Das griechische Präsens steht in der eingebetteten Aussage, während Deutsch im Erzählzusammenhang natürlich das Präteritum verwendet.
theological_decisions:
- issue: Identifikation des auferstandenen Jesus
  choice: sie wusste nicht, dass es Jesus war
  alternative: sie erkannte nicht, dass es Jesus war
  rationale: Die Hauptfassung bleibt eng bei οὐκ ᾔδει und stellt lediglich Marias fehlende Kenntnis der Identität fest. Sie legt nicht fest, warum sie Jesus nicht erkannte; die kontextuell naheliegende Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt dem griechischen Handlungsablauf, vermeidet jedoch eine unnatürlich wörtliche Partizipialkonstruktion. Das Semikolon gliedert Wahrnehmung und fehlende Identifikation klar.
