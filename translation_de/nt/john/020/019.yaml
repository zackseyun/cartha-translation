id: JHN.20.19
reference: John 20:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: de
  text: 'Als es nun an jenem Tag, dem ersten Tag der Woche, Abend geworden war und die Türen dort, wo die Jünger waren, aus Furcht vor den Juden[a] verschlossen waren, kam Jesus, trat in ihre Mitte und sagte zu ihnen: »Friede sei mit euch!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Je nach Verständnis des Ausdrucks im Zusammenhang auch: „vor den jüdischen Führern“ oder „vor den Judäern“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Friede euch!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: Als es nun … Abend geworden war
  rationale: Der Genitivus absolutus setzt den zeitlichen Rahmen; „als“ gibt ihn im Deutschen idiomatisch wieder. „Nun“ bewahrt die leichte erzählerische Verknüpfung durch οὖν.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: an jenem Tag, dem ersten Tag der Woche
  rationale: Die appositionelle Formulierung bewahrt den Rückbezug auf denselben Tag und gibt die feste Wendung für den ersten Wochentag verständlich wieder.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: die Türen … verschlossen waren
  rationale: Das Perfektpartizip bezeichnet den fortbestehenden Zustand; „verschlossen“ lässt sowohl zugemachte als auch gesicherte Türen zu und behauptet nicht ausdrücklich einen Schlüssel oder Riegel.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: dort, wo die Jünger waren
  rationale: Die schlichte Ortsangabe wird ohne Zusätze wie „versammelt“ oder „untergebracht“ wiedergegeben.
- source_word: διὰ τὸν φόβον
  choice: aus Furcht
  rationale: διά mit Akkusativ bezeichnet hier den Grund; die knappe deutsche Wendung entspricht der griechischen Konstruktion.
- source_word: τῶν Ἰουδαίων
  choice: vor den Juden
  rationale: Die Grundbedeutung bleibt im Haupttext erhalten. Da der johanneische Gebrauch je nach Zusammenhang enger auf jüdische Autoritäten oder Judäer zielen kann, erläutert eine Fußnote die mögliche Reichweite.
- source_word: ἔστη εἰς τὸ μέσον
  choice: trat in ihre Mitte
  rationale: Die dynamische deutsche Wendung gibt Jesu Erscheinen und seine Position mitten unter den Jüngern natürlich wieder, ohne die räumliche Aussage abzuschwächen.
- source_word: λέγει αὐτοῖς
  choice: sagte zu ihnen
  rationale: Das historische Präsens wird entsprechend natürlichem deutschem Erzählstil im Präteritum wiedergegeben.
- source_word: Εἰρήνη ὑμῖν
  choice: Friede sei mit euch!
  rationale: Dies ist die geläufige und würdevolle deutsche Wiedergabe des semitisch geprägten Grußes; die wörtlichere Form wird in der Fußnote genannt.
theological_decisions:
- issue: Bezugsgruppe von τῶν Ἰουδαίων im Johannesevangelium
  choice: Im Haupttext „die Juden“, ergänzt durch eine kontextuelle Fußnote
  alternative: „die jüdischen Führer“ oder „die Judäer“
  rationale: Der griechische Ausdruck nennt nicht ausdrücklich die Führungsschicht. Seine genaue Reichweite ist im Johannesevangelium kontextabhängig; die Fußnote bewahrt diese Mehrdeutigkeit und beugt zugleich einer pauschalen ethnischen Deutung vor.
- issue: Bedeutung des Friedensgrußes
  choice: „Friede sei mit euch!“ ohne zusätzliche theologische Ausdeutung
  alternative: 'Wörtlicher: „Friede euch!“'
  rationale: Der Text kann als gewöhnlicher Gruß und zugleich im größeren johanneischen Zusammenhang als inhaltlich gewichtige Friedenszusage gehört werden. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der lange griechische Eingangssatz bleibt als zusammenhängender Temporalsatz erhalten, ist aber syntaktisch klar gegliedert. Die Anrede verwendet das zeitgemäße pluralische „euch“.
