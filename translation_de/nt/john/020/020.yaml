id: JHN.20.20
reference: John 20:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: de
  text: Nachdem er das gesagt hatte, zeigte er ihnen seine Hände und seine Seite. Da freuten sich die Jünger, als sie den Herrn sahen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Nachdem er das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Hauptverb vorausgeht. Der temporale Nebensatz gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: ἔδειξεν
  choice: zeigte
  rationale: δείκνυμι bedeutet hier, etwas sichtbar vor Augen zu führen; „zeigte“ ist direkt und idiomatisch.
- source_word: τὰς χεῖρας
  choice: seine Hände
  rationale: Der griechische Artikel wird im Deutschen bei eigenen Körperteilen kontextgemäß durch das Possessivpronomen wiedergegeben.
- source_word: τὴν πλευράν
  choice: seine Seite
  rationale: πλευρά bezeichnet die Körperseite. „Seine Seite“ bleibt knapp und lässt den Bezug auf die zuvor erwähnte Wunde erkennen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Personen, denen Jesus seine Hände und seine Seite zeigt.
- source_word: ἐχάρησαν
  choice: freuten sich
  rationale: χαίρω bezeichnet Freude beziehungsweise Sichfreuen. „Freuten sich“ ist im heutigen Deutsch natürlich und bewahrt die deutliche emotionale Reaktion.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die Folge des Zeigens beziehungsweise Erkennens ein. „Da“ verbindet den narrativen Fortgang und die resultative Nuance natürlich.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: „Jünger“ ist die etablierte und in diesem Kontext verständliche deutsche Wiedergabe von μαθηταί.
- source_word: ἰδόντες
  choice: als sie … sahen
  rationale: Das Aoristpartizip gibt den Anlass beziehungsweise Zeitpunkt ihrer Freude an; ein temporaler Nebensatz ist im Deutschen klar und idiomatisch.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος trägt im Kontext der Auferstehungserscheinung titulare und christologische Bedeutung; „der Herr“ bewahrt dieses Gewicht.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Meister
  rationale: Im Kontext der Begegnung mit dem Auferstandenen ist κύριος mehr als eine höfliche Anrede. „Der Herr“ bewahrt sowohl die Identifikation Jesu als auch die christologische Tragweite des johanneischen Sprachgebrauchs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Satzfolge. Keine Fußnote ist erforderlich, da weder die Syntax noch die maßgeblichen lexikalischen Entscheidungen eine für den Leser wesentliche, im Haupttext nicht bewahrbare Mehrdeutigkeit enthalten.
