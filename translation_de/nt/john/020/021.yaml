  verdict: approve
  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes wieder: den erzählerischen Anschluss (οὖν), die Wiederholung (πάλιν), den Friedensgruß, den Vergleich καθὼς … κἀγώ sowie die Gegenüberstellung der Sendung Jesu durch den Vater und seiner Sendung der Jünger. „gesandt hat“ bildet das Perfekt ἀπέσταλκεν angemessen ab; „sende“ ist eine idiomatische Wiedergabe des Präsens πέμπω.'
  naturalness: „Da sagte Jesus noch einmal zu ihnen“ und die Korrelativform „Wie …, so …“ sind modernes, flüssiges Standarddeutsch. „Friede sei mit euch!“ ist ein etablierter, verständlicher und im Kontext würdiger Gruß; die ergänzte Verbform ist im Deutschen idiomatisch.
  terminology: „der Vater“ wahrt die bestimmte johanneische Bezeichnung ohne ergänztes Possessivpronomen. „sende“ ist für πέμπω sachgemäß. Die Übersetzung zieht aus der Vergleichsaussage keine weitergehenden theologischen oder amtstheoretischen Folgerungen.
