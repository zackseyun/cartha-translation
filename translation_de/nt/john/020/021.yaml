id: JHN.20.21
reference: John 20:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: de
  text: 'Da sagte Jesus noch einmal zu ihnen: „Friede sei mit euch! Wie der Vater mich gesandt hat, so sende auch ich euch.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet hier die Fortführung der Erzählung und den Anschluss an die vorausgehende Reaktion der Jünger; „Da“ ist im modernen Deutschen natürlich, ohne eine stärkere Schlussfolgerung als nötig auszudrücken.
- source_word: πάλιν
  choice: noch einmal
  rationale: Verweist eindeutig auf die Wiederholung des Friedensgrußes aus dem vorherigen Vers.
- source_word: Εἰρήνη ὑμῖν
  choice: Friede sei mit euch!
  rationale: Gibt den knappen, verblosen semitischen Gruß idiomatisch und würdig wieder. Eine formnähere Alternative wäre „Friede euch!“.
- source_word: καθὼς
  choice: Wie … so
  rationale: Die deutsche Korrelativkonstruktion bildet den Vergleich zwischen der Sendung Jesu und der Sendung der Jünger klar und natürlich ab.
- source_word: ἀπέσταλκέν
  choice: gesandt hat
  rationale: Das Perfekt bezeichnet eine vollzogene Sendung mit fortdauernder Bedeutung; das deutsche Perfekt bewahrt diesen Aspekt angemessen.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Bewahrt den bestimmten Artikel und die johanneische Ausdrucksweise, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: κἀγώ
  choice: auch ich
  rationale: Gibt die Verbindung von καί und dem betonten ἐγώ wieder und hebt innerhalb der Vergleichskonstruktion Jesus als den nun Sendenden hervor.
- source_word: πέμπω
  choice: sende
  rationale: Das deutsche Präsens bezeichnet die gegenwärtig vollzogene Beauftragung prägnant und natürlicher als eine Verlaufsform.
theological_decisions:
- issue: Verhältnis zwischen der Sendung Jesu durch den Vater und der Sendung der Jünger durch Jesus
  choice: „Wie der Vater mich gesandt hat, so sende auch ich euch.“
  alternative: „Wie mich der Vater gesandt hat, sende ich auch euch.“
  rationale: Die Formulierung wahrt die Analogie der Sendungen, ohne daraus eine vollständige Gleichheit hinsichtlich Autorität, Weise oder Amt abzuleiten. Sie lässt das theologische Gewicht und die Spannung der Aussage bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionelle Friedensgruß ist allgemein verständlich; „senden“ bewahrt die missionale Leitwortverbindung zwischen ἀποστέλλω und πέμπω, obwohl im Griechischen zwei verschiedene Verben stehen.
