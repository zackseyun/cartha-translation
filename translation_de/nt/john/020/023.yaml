base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: de
  text: Wenn ihr jemandem die Sünden vergebt, sind sie ihm vergeben[a]; wenn ihr sie zurückhaltet, sind sie zurückgehalten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Perfektpassiv kann auch mit „sind ihm vergeben worden“ wiedergegeben werden; es bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis.
    reason: tense_aspect
  - marker: b
    text: 'Oder: „behaltet … sind behalten“. Gemeint ist im Gegensatz zum Vergeben, die Sünden zurückzuhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: wenn ihr jemandem
  rationale: ἄν mit dem Konjunktiv bildet hier einen unbestimmten Bedingungssatz. „Wenn ihr jemandem“ gibt sowohl die Bedingung als auch den unbestimmten Personenbezug natürlich wieder.
- source_word: ἀφῆτε
  choice: vergebt
  rationale: ἀφίημι bedeutet in Verbindung mit Sünden gewöhnlich „vergeben“. Das ist im modernen Deutschen klarer und natürlicher als „erlassen“.
- source_word: τὰς ἁμαρτίας
  choice: die Sünden
  rationale: Die bestimmte Form des griechischen Ausdrucks wird direkt und idiomatisch wiedergegeben.
- source_word: ἀφέωνται αὐτοῖς
  choice: sind sie ihm vergeben
  rationale: Das deutsche Zustandspassiv bewahrt den resultativen Sinn des griechischen Perfekt Passiv und lässt den Handelnden ebenso ungenannt wie der griechische Text. „Ihm“ nimmt den unbestimmten Singular „jemandem“ auf.
- source_word: κρατῆτε
  choice: festhaltet
  rationale: κρατέω bezeichnet im Gegensatz zum Vergeben das Festhalten beziehungsweise Nichtfreigeben der Sünden. „Festhalten“ wahrt das Bild und vermeidet eine konfessionell vorgeprägte Ausdeutung.
- source_word: κεκράτηνται
  choice: sind sie festgehalten
  rationale: Das Zustandspassiv spiegelt die resultative Kraft des Perfekts und erhält die formale Parallelität zur ersten Aussage.
theological_decisions:
- issue: Ob die Jünger selbständig Vergebung bewirken oder ob ihr Handeln einer vorausliegenden beziehungsweise göttlichen Wirklichkeit entspricht
  choice: 'Die Perfekt-Passiv-Formen werden resultativ und ohne ausdrücklich genannten Handelnden wiedergegeben: „sind ... vergeben“ und „sind ... festgehalten“.'
  alternative: 'Ausdeutend ergänzen: „Gott hat sie vergeben“ beziehungsweise „Gott hält sie fest“, oder präsentisch übersetzen: „werden ... vergeben/festgehalten“.'
  rationale: Der griechische Text nennt den Handelnden des Passivs nicht. Die gewählte Fassung bewahrt diese Offenheit sowie die Spannung zwischen dem Handeln der Jünger und der göttlichen Vergebung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der unbestimmte Singular „jemandem … ihm“ ist im Deutschen natürlicher als eine wörtliche pluralische Konstruktion. Die parallelen Zustandspassive erhalten den gehobenen, prägnanten Satzbau und die theologische Offenheit des griechischen Textes.
