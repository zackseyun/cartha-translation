  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: de
  text: Die beiden liefen zusammen, und der andere Jünger lief schneller als Petrus[a] und kam als Erster zum Grab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lief Petrus schneller voraus“. Auch möglich: „überholte Petrus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: liefen
  rationale: Der deutsche Präteritumkontext gibt die fortdauernde Handlung des griechischen Imperfekts natürlich wieder; eine Verlaufsform wie „waren am Laufen“ wäre unnötig schwerfällig.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier die beiden Aussagen leicht weiterführend. „Und“ vermeidet einen stärkeren Gegensatz, als der griechische Text verlangt.
- source_word: οἱ δύο ὁμοῦ
  choice: die beiden liefen zusammen
  rationale: „Die beiden“ bewahrt die ausdrückliche Bezeichnung der zwei Personen; „zusammen“ gibt ihre zunächst gemeinsame Bewegung prägnant wieder.
- source_word: ὁ ἄλλος μαθητής
  choice: der andere Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachgerechte Wiedergabe von μαθητής; „der andere“ unterscheidet ihn von Petrus.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: lief schneller als Petrus voraus
  rationale: Die Formulierung bewahrt sowohl die Bedeutung „vorauslaufen“ des Verbs als auch den ausdrücklich formulierten Geschwindigkeitsvergleich mit Petrus.
- source_word: ἦλθεν πρῶτος
  choice: kam als Erster
  rationale: Die Wendung hält sich eng an die griechische Aussage, dass der andere Jünger als erster dort ankam.
- source_word: εἰς τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet hier Jesu Grabstätte. „Zum“ entspricht dem Erreichen des Grabes, ohne vorwegzunehmen, dass der Jünger hineinging; Vers 5 zeigt, dass er zunächst draußen blieb.
