  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: de
  text: Dann kommt auch Simon Petrus, ihm folgend, und ging in das Grab hinein; und er sieht die Leinentücher daliegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text verwendet bei „kommt“ und „sieht“ das historische Präsens. „Ging“ gibt dagegen den Aorist „trat ein“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens wird beibehalten; es ist im Deutschen erzählerisch gut verständlich und bewahrt die Unmittelbarkeit des griechischen Textes.
- source_word: οὖν
  choice: Dann
  rationale: Kennzeichnet hier vor allem den Fortgang der Erzählung; „Dann“ ist dafür natürlich und klar.
- source_word: καὶ Σίμων Πέτρος
  choice: auch Simon Petrus
  rationale: 'Das καί hat im Zusammenhang additive Kraft: Nach dem anderen Jünger trifft auch Simon Petrus ein.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: der ihm folgte
  rationale: Gibt das begleitende Partizip verständlich wieder und lässt offen, wie groß der Abstand zwischen beiden war.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: geht in das Grab hinein
  rationale: Das historische Präsens der deutschen Erzählung wird durchgehend fortgeführt; „hinein“ bringt die durch εἰς bezeichnete Bewegung ausdrücklich zum Ausdruck.
- source_word: θεωρεῖ
  choice: sieht
  rationale: Gibt das anschauliche historische Präsens schlicht und natürlich wieder, ohne durch „betrachtet“ eine längere oder besonders eingehende Beobachtung festzulegen.
- source_word: τὰ ὀθόνια
  choice: die Leinentücher
  rationale: Bewahrt die konkrete Materialangabe und vermeidet die stärker deutende Übersetzung „Grabtücher“.
- source_word: κείμενα
  choice: daliegen
  rationale: Bezeichnet anschaulich den vorgefundenen Zustand der Tücher; die genaue Anordnung wird nicht näher bestimmt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze geben die lebendige Erzählbewegung wieder; „Grab“ ist im Kontext die natürliche Bezeichnung für μνημεῖον.
