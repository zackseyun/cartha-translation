source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Weil du mich gesehen hast, glaubst du?[a] Glücklich zu preisen sind die, die nicht gesehen und geglaubt haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Aussage: „Weil du mich gesehen hast, glaubst du.“ Der griechische Text kann als Frage oder als Feststellung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Das historische Präsens λέγει wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben; αὐτῷ bleibt als „zu ihm“ erhalten.
- source_word: Ὅτι
  choice: Weil
  rationale: Ὅτι wird hier kausal verstanden und leitet den Grund für den Glauben des Thomas ein. Die Formulierung bewahrt zugleich die mögliche Frageform.
- source_word: ἑώρακάς με
  choice: du mich gesehen hast
  rationale: Das griechische Perfekt bezeichnet ein vollendetes Sehen mit gegenwärtiger Bedeutung; im deutschen Nebensatz wird dies natürlich mit dem Perfekt ausgedrückt.
- source_word: πεπίστευκας
  choice: glaubst du
  rationale: Das griechische Perfekt beschreibt den aus dem Sehen hervorgegangenen gegenwärtigen Glaubenszustand. Deutsches Präsens gibt diesen Ergebniszustand natürlicher wieder als „hast du geglaubt“.
- source_word: μακάριοι
  choice: Glücklich zu preisen
  rationale: Die Wendung bezeichnet nicht bloß ein subjektives Glücksgefühl, sondern erklärt Menschen für begünstigt und gesegnet; „glücklich zu preisen“ ist verständlich und bewahrt den feierlichen Charakter.
- source_word: οἱ μὴ ἰδόντες
  choice: die, die nicht gesehen
  rationale: Das substantivierte Aoristpartizip wird als Personengruppe wiedergegeben; das Sehen ist als nicht erfolgte, dem Glauben vorausliegende Handlung gefasst.
- source_word: καὶ πιστεύσαντες
  choice: und doch geglaubt haben
  rationale: καί bedeutet wörtlich „und“. Das deutsche „doch“ macht den im Kontext klaren Gegensatz zwischen Nichtsehen und Glauben idiomatisch sichtbar, ohne einen neuen Sachinhalt einzuführen.
theological_decisions:
- issue: Frage oder Aussage im ersten Satz Jesu
  choice: 'Als Frage: „Weil du mich gesehen hast, glaubst du?“'
  alternative: 'Als Aussage: „Weil du mich gesehen hast, glaubst du.“'
  rationale: Der griechische Wortlaut lässt wegen der ursprünglichen Interpunktionslage sowohl eine Frage als auch eine Feststellung zu. Die Frage folgt der Interpunktion des SBLGNT und wahrt den möglichen rhetorischen Kontrast; die Aussage wird in der Fußnote erhalten.
- issue: Bedeutung von μακάριοι
  choice: „Glücklich zu preisen“
  alternative: „Gesegnet“ oder „glücklich“
  rationale: Die Formulierung vermeidet eine Verengung auf subjektives Wohlbefinden und zugleich eine unnötig konfessionell aufgeladene Deutung. Sie gibt den Charakter eines Seligpreises wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während Tempus und Wortfolge natürlich deutsch gestaltet sind. Die echte Mehrdeutigkeit der ersten Äußerung wird durch eine Fußnote bewahrt.
