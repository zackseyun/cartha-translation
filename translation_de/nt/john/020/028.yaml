  source_fidelity: Der Entwurf gibt die Satzstruktur und den Bezug von αὐτῷ korrekt wieder. Die beiden artikulierten Nominative ὁ κύριός μου und ὁ θεός μου können hier als Anrede fungieren; die direkte Anrede an Jesus wird daher zutreffend nicht abgeschwächt.
  naturalness: „Thomas antwortete und sagte zu ihm“ ist zwar verständlich und formnah, klingt im modernen Standarddeutsch jedoch unnötig doppelt und hölzern. „Thomas antwortete ihm:“ ist idiomatisch und wahrt die Aussagefunktion von ἀπεκρίθη sowie den durch αὐτῷ bezeichneten Adressaten.
  terminology: „Herr“ und „Gott“ sind die etablierten und quellentreuen Wiedergaben von κύριος bzw. θεός. Die Possessivformen und die Koordination bleiben erhalten.
