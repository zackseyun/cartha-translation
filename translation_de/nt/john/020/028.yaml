  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: de
  text: 'Thomas antwortete ihm[a]: »Mein Herr und mein Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Weniger wahrscheinlich: »Thomas antwortete: ›Mein Herr und mein Gott!‹«, verstanden als bloßer Ausruf. Das griechische αὐτῷ („zu ihm“) kennzeichnet Jesus als den Angesprochenen und stützt daher das Verständnis als direkte Anrede an Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche erzählerische Bedeutung von ἀποκρίνομαι ist »antworten«; die knappe Wiedergabe bewahrt die griechische Ausdrucksweise.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Das Dativpronomen αὐτῷ bezeichnet ausdrücklich den Angesprochenen. »Zu ihm« bleibt nahe am griechischen Text, ohne den Namen Jesus ergänzend einzusetzen.
- source_word: Ὁ κύριός μου
  choice: Mein Herr
  rationale: κύριος wird mit »Herr« wiedergegeben; dies bewahrt sowohl die direkte Anrede als auch ihr ehrendes und theologisches Gewicht.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet beide Bezeichnungen zu einer koordinierten Aussage und wird daher schlicht mit »und« wiedergegeben.
- source_word: ὁ θεός μου
  choice: mein Gott
  rationale: θεός entspricht »Gott«, und μου wird als persönliches Possessivpronomen »mein« bewahrt.
theological_decisions:
- issue: Sind die Worte des Thomas eine direkte, an Jesus gerichtete Aussage oder lediglich ein nicht an ihn gerichteter Ausruf?
  choice: 'Direkte Anrede an Jesus: »Mein Herr und mein Gott!«'
  alternative: Ein allgemeiner Ausruf zu Gott, der Jesus nicht unmittelbar als »Herr« und »Gott« bezeichnet.
  rationale: Das griechische αὐτῷ besagt ausdrücklich, dass Thomas dies »zu ihm« sagte. Zudem können die Nominativformen mit Artikel im Koine-Griechischen als Anrede dienen. Die Übersetzung bewahrt deshalb die direkte Aussage an Jesus, ohne ihre christologische Aussagekraft abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst formnahe Wendung »antwortete und sagte« bewahrt die zweigliedrige griechische Erzählform; »sagte zu ihm« hält den Bezug ausdrücklich fest. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
