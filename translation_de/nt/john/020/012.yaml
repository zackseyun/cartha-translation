  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des griechischen Textes sachgerecht wieder: historisches Präsens („sieht“), δύο ἀγγέλους ἐν λευκοῖς („zwei Engel in Weiß“), die sitzende Haltung, die Verteilung bei Kopf- und Fußende sowie den Ort, an dem Jesu Körper zuvor gelegen hatte. Das Plusquamperfekt ist im erzählerischen Zusammenhang eine vertretbare, natürlich deutsche Ausgestaltung des Imperfekts ἔκειτο; die Fußnote nennt transparent die einfachere Alternative.'
  naturalness: Modernes Standarddeutsch und flüssiger Erzählstil. „in Weiß dasitzen“ und „am Kopfende … am Fußende“ sind klar und idiomatisch. „der Körper von Jesus“ ist zwar weniger traditionssprachlich als „der Leib Jesu“, aber sachlich, verständlich und ohne Bedeutungsverlust.
  terminology: „Engel“ ist im Kontext angemessen. „Körper“ wahrt die offene, nicht überinterpretierende Bedeutung von σῶμα. Die räumlichen Ausdrücke und die Benennung Jesu sind korrekt. Beide Fußnotenmarker stehen an den jeweiligen Übersetzungseinheiten und die Fußnoten erläutern echte lexikalische bzw. zeitformbezogene Alternativen.
