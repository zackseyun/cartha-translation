id: JHN.20.12
reference: John 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: de
  text: Und sie sieht zwei Engel in Weiß[a] dasitzen, einen am Kopfende und einen am Fußende, wo der Körper von Jesus gelegen hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in Weiß“; gemeint sein kann auch „weiß gekleidet“ oder „in weißen Gewändern“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo der Körper von Jesus lag“. Das griechische Imperfekt kann einfacher wiedergegeben werden; „gelegen hatte“ verdeutlicht im Zusammenhang den vorausliegenden Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: sie sieht
  rationale: Das historische Präsens wird als anschauliches Präsens bewahrt. Das im Zusammenhang erkennbare Subjekt Maria wird im Deutschen ausdrücklich genannt.
- source_word: ἀγγέλους
  choice: Engel
  rationale: Im Zusammenhang des leeren Grabes bezeichnet das Wort eindeutig himmlische Boten; „Engel“ ist daher die natürliche Wiedergabe.
- source_word: ἐν λευκοῖς
  choice: in Weiß
  rationale: Die knappe, wörtliche Wendung lässt sich im Deutschen idiomatisch bewahren und deutet weiße Kleidung an, ohne sie ausdrücklich zu ergänzen.
- source_word: καθεζομένους
  choice: dasitzen
  rationale: Das Partizip beschreibt die sitzende Haltung der Engel. „dasitzen“ verbindet diese Haltung natürlich mit dem Wahrnehmungsverb.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: einen am Kopfende und einen am Fußende
  rationale: Die Formulierung gibt die Lage an den beiden Enden der Stelle, an der der Körper gelegen hatte, im Deutschen klar und knapp wieder.
- source_word: ὅπου
  choice: wo
  rationale: Das einfache Relativadverb entspricht der knappen griechischen Formulierung.
- source_word: ἔκειτο
  choice: gelegen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass der Körper zuvor an dieser Stelle lag, zum Zeitpunkt des Sehens aber nicht mehr dort war.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: der Körper von Jesus
  rationale: „Körper“ ist sachlich und würdevoll; die Formulierung mit „von Jesus“ ist in modernem Standarddeutsch natürlich und vermeidet ein schwerfälliges Genitivattribut.
theological_decisions:
- issue: Bedeutung von ἀγγέλους im Auferstehungsbericht
  choice: Engel als himmlische Wesen
  alternative: Boten beziehungsweise menschliche Gesandte
  rationale: Der unmittelbare Zusammenhang des leeren Grabes und die weiße Erscheinung sprechen klar für himmlische Wesen, ohne dass darüber hinausgehende Aussagen über ihre Natur eingeführt werden.
- issue: Zeitlicher Bezug von ἔκειτο
  choice: vorheriger Liegeort, ausgedrückt mit Plusquamperfekt
  alternative: „lag“, als einfaches Präteritum
  rationale: „gelegen hatte“ macht die zeitliche Abfolge des Berichts deutlich und entspricht dem vorausliegenden Zustand, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens bleibt erhalten. Die knappe Bildsprache des Griechischen wird möglichst bewahrt; „Kopfende“ und „Fußende“ machen die räumliche Anordnung natürlich verständlich.
