  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Inhalt des griechischen Textes zuverlässig wieder: Das Imperfekt ἔλεγον erscheint angemessen als „sagten ... immer wieder“, das Perfekt Ἑωράκαμεν als „Wir haben ... gesehen“, und die dreifache, konkret formulierte Bedingung des Thomas bleibt vollständig erhalten. „An seinen Händen“ ist für ἐν ταῖς χερσὶν αὐτοῦ idiomatisches Deutsch. Die Wiederholung von „das Mal der Nägel“ bewahrt die griechische Wiederholung. „Ganz gewiss nicht glauben“ vermittelt die Nachdrücklichkeit von οὐ μή, ohne die bedingte Aussage unnötig zu einer absolut zeitlosen Verweigerung umzudeuten.'
