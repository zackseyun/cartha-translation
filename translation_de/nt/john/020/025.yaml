reference: John 20:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: de
  text: 'Da sagten ihm die anderen Jünger immer wieder: „Wir haben den Herrn gesehen.“ Er aber sagte zu ihnen: „Wenn ich nicht an seinen Händen das Mal der Nägel sehe und meinen Finger in das Mal der Nägel lege und meine Hand in seine Seite lege, werde ich ganz gewiss nicht glauben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich niemals glauben.“ Im Griechischen steht eine besonders nachdrückliche Verneinung.'
    reason: Lexikalische Alternative zur Wiedergabe von οὐ μὴ πιστεύσω.
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten … immer wieder
  rationale: Der Imperfekt bezeichnet hier am ehesten ein wiederholtes oder anhaltendes Sagen; die Formulierung gibt diesen Aspekt in natürlichem Deutsch wieder.
- source_word: οὖν
  choice: Da
  rationale: Die Partikel führt die Erzählung folgernd weiter. „Da“ bewahrt den Zusammenhang und klingt im modernen deutschen Erzählstil natürlicher als ein schweres „daher“ oder „also“.
- source_word: οἱ ἄλλοι μαθηταί
  choice: die anderen Jünger
  rationale: Die direkte Wiedergabe hält den Kontrast zwischen Thomas und den übrigen Jüngern fest.
- source_word: Ἑωράκαμεν
  choice: Wir haben … gesehen
  rationale: Das Perfekt bezeichnet ein abgeschlossenes Sehen mit fortdauernder gegenwärtiger Bedeutung; das deutsche Perfekt gibt dies idiomatisch wieder.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος ist hier die Bezeichnung für den auferstandenen Jesus und wird als christologischer Titel wiedergegeben.
- source_word: Ἐὰν μὴ ἴδω
  choice: Wenn ich nicht … sehe
  rationale: Die negative Bedingung wird klar und natürlich wiedergegeben, ohne ihren Inhalt abzuschwächen.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: an seinen Händen
  rationale: Bei sichtbaren Malen auf beziehungsweise an Körperteilen ist „an seinen Händen“ im Deutschen idiomatischer als das wörtliche „in seinen Händen“.
- source_word: τὸν τύπον τῶν ἥλων
  choice: das Mal der Nägel
  rationale: τύπος bezeichnet hier den sichtbaren Abdruck oder die zurückgebliebene Spur der Nägel. „Mal“ ist konkret, verständlich und fügt nicht ausdrücklich den im Kontext zwar naheliegenden Begriff „Wunde“ hinzu.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: meinen Finger in … lege
  rationale: εἰς bezeichnet die Bewegung hinein; „legen“ ist in Verbindung mit Finger und Hand natürlich und bewahrt die anschauliche Forderung.
- source_word: μου τὴν χεῖρα
  choice: meine Hand
  rationale: Das ausdrücklich genannte Possessivpronomen wird beibehalten.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: seine Seite
  rationale: πλευρά bezeichnet hier Jesu Körperseite; die knappe Wiedergabe vermeidet eine zusätzliche anatomische Festlegung.
- source_word: οὐ μὴ πιστεύσω
  choice: werde ich ganz gewiss nicht glauben
  rationale: Die Verbindung οὐ μή mit dem Konjunktiv Aorist drückt eine besonders nachdrückliche Verneinung aus. „Ganz gewiss nicht“ bewahrt diese Stärke innerhalb der vorausgehenden Bedingung.
theological_decisions:
- issue: Stärke und zeitliche Reichweite von Thomas’ Verweigerung in οὐ μὴ πιστεύσω
  choice: „werde ich ganz gewiss nicht glauben“ als nachdrückliche, an die genannten Bedingungen geknüpfte Weigerung
  alternative: „werde ich niemals glauben“
  rationale: Die griechische Konstruktion ist stark emphatisch. Die Hauptfassung wahrt diese Kraft, ohne Thomas über die bedingte Aussage hinaus eine zeitlich unbegrenzte endgültige Verweigerung zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „das Mal der Nägel“ folgt bewusst der eindringlichen Wiederholung des griechischen Textes; sie wird nicht stilistisch geglättet. Die wörtliche Rede bleibt klar und mündlich nachvollziehbar.
