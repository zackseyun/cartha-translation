review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft Anrede, Fragegrund, den Titel „mein Herr“ und die Aussage über die Wegnahme insgesamt gut. Bei ποῦ fragt der griechische Text jedoch nach dem gegenwärtigen Ort („wo“), nicht nach einer Bewegungsrichtung („wohin“).
  naturalness: „Und jene fragten sie“ wirkt im modernen Standarddeutsch etwas demonstrativ und weniger idiomatisch. „Und sie sagten zu ihr“ ist natürlich und gibt die einleitende Redeeinleitung unmittelbar wieder.
  terminology: „Frau“ ist als knappe, respektvolle Anrede angemessen. „Mein Herr“ bewahrt den Bedeutungsumfang von κύριος, ohne ihn auf „Meister“ zu verengen. „Weggenommen“ und „hingelegt“ sind im Kontext des Grabes passende, verständliche Wiedergaben.
  issues:
  - severity: medium
    issue: „wohin sie ihn gelegt haben“
    rationale: ποῦ bezeichnet hier den Ort, an dem Jesus nun liegt. Im Deutschen ist „wo sie ihn hingelegt haben“ die genaue und idiomatische Entsprechung; „wohin“ fokussiert dagegen die Zielrichtung des Legens.
  - severity: low
    issue: „jene fragten sie“
    rationale: Die Formulierung ist verständlich, klingt aber im modernen Deutsch unnötig demonstrativ. Das griechische ἐκεῖνοι kann angesichts des klaren Kontextes idiomatisch durch „sie“ wiedergegeben werden; λέγουσιν wird mit „sagten zu ihr“ direkt abgebildet.
  revised_text: 'Und sie sagten zu ihr: „Frau, warum weinst du?“ Sie sagte zu ihnen: „Sie haben meinen Herrn weggenommen, und ich weiß nicht, wo sie ihn hingelegt haben.“'
