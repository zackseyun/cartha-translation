  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: de
  text: 'Und sie sagten zu ihr: „Frau, warum weinst du?“ Sie sagte zu ihnen: „Sie haben meinen Herrn weggenommen, und ich weiß nicht, wo sie ihn hingelegt haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: jene
  rationale: Das Demonstrativpronomen wird sichtbar wiedergegeben und verweist auf die zuvor genannten Engel; im Deutschen ist „jene“ hier knapp und verständlich.
- source_word: Γύναι
  choice: Frau
  rationale: Die Anrede ist im griechischen Kontext respektvoll und nicht abweisend. „Frau“ bewahrt ihre Direktheit, ohne eine nicht ausdrücklich vorhandene Vertraulichkeit einzutragen.
- source_word: τί κλαίεις
  choice: warum weinst du?
  rationale: Obwohl τί wörtlich „was“ bedeutet, fragt die griechische Wendung idiomatisch nach dem Grund des Weinens. „Warum weinst du?“ ist die natürliche deutsche Entsprechung.
- source_word: Ἦραν
  choice: haben ... weggenommen
  rationale: Das Perfekt gibt im Deutschen eine abgeschlossene Handlung mit gegenwärtiger Auswirkung natürlich wieder; „weggenommen“ entspricht der Entfernung aus dem Grab.
- source_word: τὸν κύριόν μου
  choice: meinen Herrn
  rationale: „Herr“ bewahrt sowohl die persönliche Ehrfurcht als auch die im Johannesevangelium mögliche christologische Bedeutung von κύριος.
- source_word: οὐκ οἶδα
  choice: ich weiß nicht
  rationale: Das formal perfekte οἶδα bezeichnet einen gegenwärtigen Wissensstand und wird im Deutschen idiomatisch im Präsens wiedergegeben.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: wohin sie ihn gelegt haben
  rationale: Bei einer Ortsveränderung ist im Deutschen „wohin“ natürlich. „Gelegt“ passt zum leiblichen Ablegen Jesu und bewahrt zugleich die allgemeine Bedeutung von τίθημι.
theological_decisions:
- issue: Bedeutungsumfang von κύριος in Marias Rede
  choice: mein Herr
  alternative: mein Meister
  rationale: „Herr“ lässt sowohl eine ehrerbietige persönliche Anrede als auch die christologische Tragweite des Titels offen, statt ihn auf ein bloß soziales Verhältnis zu verengen.
- issue: Ton der Anrede Γύναι
  choice: Frau
  alternative: Liebe Frau
  rationale: Der griechische Ausdruck ist respektvoll, enthält aber kein ausdrückliches Element der Zärtlichkeit. Die knappe Wiedergabe vermeidet eine zusätzliche emotionale Deutung.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Die direkte Rede bleibt natürlich; auf Fußnoten wurde verzichtet, weil die maßgeblichen Bedeutungsnuancen ohne störende Vereindeutigung im Haupttext erhalten bleiben.
