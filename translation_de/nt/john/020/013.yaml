  rationale: Die Revision korrigiert die Ortsfrage von „wohin“ zu „wo“ und glättet die Redeeinleitung zugunsten natürlichen modernen Deutschs. Aussagegehalt, Register und die theologisch offene Wiedergabe von κύριος bleiben erhalten.
