id: JHN.20.1
reference: John 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: de
  text: Am ersten Tag der Woche[a] kommt Maria Magdalena früh zum Grab, als es noch dunkel ist, und sieht, dass der Stein vom Grab weggenommen worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »an einem der Sabbate«; eine Redewendung für den ersten Tag der Woche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Am ersten Tag der Woche
  rationale: Die griechische Wendung lautet wörtlich etwa »am ersten der Sabbate«, ist im Koine-Griechischen jedoch eine geläufige Bezeichnung für den ersten Wochentag. Das schwach weiterführende δέ erfordert hier im Deutschen kein eigenes Wort.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Die im Deutschen geläufige Form des Namens und der Herkunftsbezeichnung.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens des griechischen Erzählstils bleibt erhalten und verleiht der Szene Unmittelbarkeit.
- source_word: πρωῒ
  choice: früh
  rationale: Die knappe Zeitangabe lässt die folgende Aussage, dass es noch dunkel ist, den Zeitpunkt näher bestimmen, ohne vorschnell »bei Tagesanbruch« einzutragen.
- source_word: σκοτίας ἔτι οὔσης
  choice: als es noch dunkel ist
  rationale: Der Genitivus absolutus wird als natürliche deutsche Zeitangabe wiedergegeben; das Präsens fügt sich in die beibehaltene historische Erzählgegenwart ein.
- source_word: εἰς τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet hier die Grabanlage; »Grab« ist im Deutschen klar und kontextgerecht.
- source_word: βλέπει
  choice: sieht
  rationale: Das historische Präsens und die schlichte Wahrnehmungsaussage des Ausgangstextes bleiben erhalten.
- source_word: τὸν λίθον ἠρμένον
  choice: dass der Stein … weggenommen worden ist
  rationale: Das Perfektpassiv-Partizip bezeichnet eine bereits vollzogene Handlung mit fortbestehendem Ergebnis. Die deutsche Perfektpassiv-Konstruktion gibt beides verständlich wieder.
- source_word: ἐκ τοῦ μνημείου
  choice: vom Grab
  rationale: Die Wiedergabe bewahrt die Bewegung beziehungsweise Entfernung vom Grab, ohne den im Ausgangstext nicht ausdrücklich genannten Grabeingang hinzuzufügen.
theological_decisions:
- issue: Erzähltempus im Auferstehungsbericht
  choice: Die historischen Präsensformen werden mit »kommt« und »sieht« beibehalten.
  alternative: Sämtliche Verben zur Glättung der deutschen Erzählung ins Präteritum setzen.
  rationale: Das historische Präsens ist ein erkennbares Merkmal der griechischen Erzählweise und lässt sich auch im Deutschen verständlich bewahren, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Urheber der Entfernung des Steins
  choice: Die Passivform »weggenommen worden ist« bleibt ohne Nennung eines Handelnden.
  alternative: Einen göttlichen oder menschlichen Urheber ausdrücklich nennen.
  rationale: Der Vers selbst bezeichnet den Handelnden nicht; diese Offenheit darf nicht durch die Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens wurde bewusst erhalten. Die Satzstellung verbindet »früh« unmittelbar mit dem Gang zum Grab und gibt die noch herrschende Dunkelheit als begleitenden Umstand wieder.
