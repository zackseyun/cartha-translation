  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: de
  text: 'Jesus sagte zu ihr: „Halte mich nicht fest[a], denn ich bin noch nicht zum Vater hinaufgegangen. Geh aber zu meinen Brüdern[b] und sag ihnen: ‚Ich gehe hinauf zu meinem Vater und eurem Vater, zu meinem Gott und eurem Gott.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Berühre mich nicht“ beziehungsweise „Halte dich nicht an mir fest.“ Das griechische Verb kann Berühren oder Festhalten bedeuten; hier ist wahrscheinlich ein fortdauerndes Festhalten gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Brüder“ gibt die maskuline griechische Pluralform wieder. Hier sind Jesu Jünger gemeint; der Ausdruck kann eine größere repräsentative Gruppe einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Halte mich nicht fest
  rationale: Das Präsensimperativ mit μή kann hier das Unterlassen beziehungsweise Beenden eines fortdauernden Festhaltens bezeichnen. „Halte mich nicht fest“ ist natürliches Deutsch und wahrt zugleich die mögliche Bedeutungsbreite gegenüber einem bloßen Berührungsverbot.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: denn ich bin noch nicht … hinaufgegangen
  rationale: Das Perfekt wird mit „bin … hinaufgegangen“ wiedergegeben; „noch nicht“ bewahrt οὔπω. Im Deutschen klingt dies hier natürlicher als das substantivisch geprägte „aufgefahren“, ohne die Bewegung zum Vater zu verdecken.
- source_word: πρὸς τὸν πατέρα
  choice: zum Vater
  rationale: Der erste Ausdruck enthält keinen Possessivartikel. „Zum Vater“ erhält diesen Unterschied zur anschließenden ausdrücklichen Formulierung „zu meinem Vater und eurem Vater“.
- source_word: πορεύου
  choice: Geh
  rationale: Die schlichte Bewegungsaufforderung wird knapp und idiomatisch wiedergegeben.
- source_word: ἀδελφούς
  choice: Brüdern
  rationale: Die maskuline Pluralform wird formal genau wiedergegeben. Eine Fußnote erläutert den möglichen Referenzumfang, ohne ihn im Haupttext vorzuentscheiden.
- source_word: εἰπὲ αὐτοῖς
  choice: sag ihnen
  rationale: Dies ist die natürliche deutsche Wiedergabe der Aufforderung, ihnen die folgende Botschaft mitzuteilen.
- source_word: Ἀναβαίνω
  choice: Ich gehe hinauf
  rationale: Die präsentische Form und die anschauliche Bewegungsrichtung bleiben erhalten. Der Kontext nennt das Ziel ausdrücklich und trägt die theologische Bedeutung des Hinaufgehens.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: meinem Vater und eurem Vater
  rationale: Die parallele, aber unterschiedene Zuordnung wird unmittelbar und ohne harmonisierende Paraphrase bewahrt.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: meinem Gott und eurem Gott
  rationale: Die auffällige christologische Aussage und ihre Parallelstruktur werden direkt wiedergegeben, ohne sie dogmatisch abzuschwächen oder zu erklären.
theological_decisions:
- issue: Bedeutung von Μή μου ἅπτου
  choice: Verbot eines fortdauernden Festhaltens
  alternative: „Berühre mich nicht“ als Verbot jeder Berührung
  rationale: Form und Kontext lassen ein bereits stattfindendes oder fortgesetztes Festhalten plausibel erscheinen. Die Fußnote bewahrt jedoch die lexikalische Alternative.
- issue: Wiedergabe von πατέρα im ersten Satzteil
  choice: „zum Vater“
  alternative: „zu meinem Vater“
  rationale: Im griechischen Text fehlt an dieser Stelle μου. Die gewählte Fassung erhält den Wortlaut und lässt die folgende direkte Rede die Beziehungen ausdrücklich entfalten.
- issue: Aussage „meinem Gott und eurem Gott“
  choice: unveränderte direkte Wiedergabe
  alternative: eine christologisch entschärfende Paraphrase
  rationale: Die theologische Spannung gehört zum Wortlaut des Verses und darf nicht durch konfessionelle Vorentscheidungen geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede verwendet das natürliche Singular-Du; die direkte Rede bleibt knapp. „Hinaufgehen“ bewahrt die lexikalische Verbindung zwischen ἀναβέβηκα und Ἀναβαίνω, während die Fußnoten echte Bedeutungsalternativen transparent machen.
