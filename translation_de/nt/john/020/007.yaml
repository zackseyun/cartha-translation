  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: de
  text: und das Schweißtuch, das auf seinem Kopf gelegen hatte, lag nicht bei den Leinentüchern, sondern getrennt davon an einer Stelle zusammengerollt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eingewickelt“ oder „zusammengefaltet“; das griechische Wort bezeichnet einen zusammengelegten, eingerollten oder eingewickelten Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: Schweißtuch
  rationale: Die in deutschen Bibelübersetzungen geläufige Bezeichnung wahrt den konkreten Tuchbegriff; der Relativsatz erklärt hier eindeutig seine Verwendung als Kopftuch im Bestattungskontext.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: auf seinem Kopf
  rationale: Nahe Wiedergabe der Präpositionalphrase, ohne die genaue Art der Bedeckung näher zu bestimmen.
- source_word: ὀθονίων
  choice: Leinentüchern
  rationale: Gibt den Plural und das Material wieder, ohne spezifische Wickel- oder Bestattungspraktiken hinzuzufügen.
- source_word: κείμενον
  choice: Es lag
  rationale: Gibt den resultativen Zustand des Partizips idiomatisch und anschaulich wieder.
- source_word: χωρὶς
  choice: separat
  rationale: Bezeichnet klar die räumliche Trennung von den übrigen Leinentüchern.
- source_word: ἐντετυλιγμένον
  choice: zusammengerollt
  rationale: Das Perfektpassiv bezeichnet einen bestehenden eingerollten oder eingewickelten Zustand. Diese Wiedergabe vermeidet die nicht zwingend im Verb enthaltene Vorstellung eines ordentlich gefalteten Tuchs.
- source_word: εἰς ἕνα τόπον
  choice: an einer Stelle
  rationale: Natürliche deutsche Wiedergabe einer räumlich bestimmten, gesonderten Lage, ohne unnötig ‚an seinem eigenen Platz‘ hineinzulesen.
- source_word: καὶ
  choice: und
  rationale: Bewahrt den Anschluss an die Beschreibung im vorhergehenden Vers.
theological_decisions:
- issue: Ob die Anordnung der Grabtücher über die Beobachtung hinaus eine symbolische oder apologetische Aussage macht
  choice: Der Vers wird als sachliche Beschreibung der getrennten Lage des Kopftuchs wiedergegeben.
  alternative: Die Anordnung ausdrücklich als Zeichen bewusster Ordnung oder als Beweis eines bestimmten Ablaufs der Auferstehung deuten.
  rationale: Der griechische Text beschreibt Zustand und Ort des Tuchs, nennt aber keine symbolische Bedeutung und zieht keine ausdrückliche Schlussfolgerung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bleibt als Fortsetzung des vorangehenden Verses mit „und“ angeschlossen. Die Aufteilung in zwei deutsche Sätze erhöht die Verständlichkeit, ohne den Sinnzusammenhang zu verändern.
