id: JHN.20.24
reference: John 20:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: de
  text: Thomas aber, einer von den Zwölf, der Didymus[a] genannt wurde, war nicht bei ihnen, als Jesus kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name „Didymus“ bedeutet „Zwilling“.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Das nachgestellte „aber“ gibt den milden erzählerischen Kontrast wieder und lenkt den Blick auf Thomas, ohne einen zeitlichen Ausdruck wie „nun“ einzuführen.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: einer von den Zwölf
  rationale: Die Formulierung gibt die Zugehörigkeit zu dem als feste Gruppe bezeichneten Kreis der Zwölf idiomatisch und knapp wieder.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: der Didymus genannt wurde
  rationale: „Didymus“ bewahrt den im griechischen Text als Beiname verwendeten Namen; seine Bedeutung „Zwilling“ wird für heutige Leser in der Fußnote erschlossen.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: war nicht bei ihnen
  rationale: Dies ist eine direkte und natürliche Wiedergabe des Imperfekts mit μετά und bezeichnet Thomas’ Abwesenheit von der Gruppe.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: als Jesus kam
  rationale: „Als“ bezeichnet den einmaligen vergangenen Zeitpunkt; „kam“ gibt ἦλθεν direkt und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von Δίδυμος
  choice: Didymus im Haupttext, Bedeutung in der Fußnote
  alternative: Zwilling im Haupttext
  rationale: Δίδυμος ist bedeutungstragend („Zwilling“), fungiert hier jedoch zugleich als griechischer Beiname des Thomas. Die gewählte Lösung bewahrt sowohl die Namensform des Ausgangstextes als auch durch die Fußnote deren verständliche Bedeutung, ohne eine lehrmäßige Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Thomas aber“ wahrt den milden Kontrast des griechischen δέ; „die Zwölf“ bleibt als feste Gruppenbezeichnung substantiviert.
