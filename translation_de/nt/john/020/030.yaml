id: JHN.20.30
reference: John 20:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: de
  text: Jesus tat vor den Augen der Jünger noch viele andere Zeichen[a], die nicht in diesem Buch aufgeschrieben sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wunderzeichen. Das griechische Wort bezeichnet Taten, die über sich hinaus darauf hinweisen, wer Jesus ist.'
    reason: Lexikalische Alternative und Erklärung des johanneischen Schlüsselbegriffs.
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: noch viele andere
  rationale: Die Wendung führt den Gedanken folgernd weiter und bereitet den Gegensatz zu Vers 31 vor. „Noch viele andere“ gibt den fortführenden und ergänzenden Sinn im Deutschen natürlich wieder, ohne die griechischen Diskurspartikeln hölzern einzeln abzubilden.
- source_word: σημεῖα
  choice: Zeichen
  rationale: Im Johannesevangelium bezeichnet das Wort machtvolle Taten, die über sich hinaus auf Jesu Identität und Auftrag hinweisen. „Zeichen“ bewahrt diesen charakteristischen Sinn besser als das allgemeinere „Wunder“.
- source_word: ἐποίησεν
  choice: tat
  rationale: Die schlichte Wiedergabe entspricht ποιέω und bildet zusammen mit „Zeichen“ eine verständliche, quellennahe Formulierung. „Vollbrachte“ wäre ebenfalls möglich, wäre aber stilistisch stärker markiert.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: vor den Augen der Jünger
  rationale: Die Formulierung macht deutlich, dass die Jünger bei diesen Zeichen als Augenzeugen anwesend waren. Ein nicht im Griechischen stehendes Possessivpronomen wird vermieden.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: die nicht … aufgeschrieben sind
  rationale: 'Die Formulierung bewahrt den passiven, resultativen Sinn: Diese Zeichen stehen nicht als schriftlich festgehaltene Berichte im Buch.'
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: in diesem Buch
  rationale: „Buch“ ist im modernen Deutschen die natürliche Bezeichnung für das vorliegende schriftliche Werk; „Schriftrolle“ wäre unnötig materialspezifisch.
theological_decisions:
- issue: Johanneischer Gebrauch von σημεῖα
  choice: Zeichen
  alternative: Wunder / Wunderzeichen
  rationale: „Zeichen“ erhält die theologische Spannung, dass Jesu Taten nicht nur Machterweise sind, sondern auf seine Identität und Sendung verweisen, ohne diese Bedeutung im Haupttext auszudeuten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. „Vor den Augen“ hebt die Zeugenschaft der Jünger hervor; die Satzstruktur bleibt nah am Griechischen und zugleich gut lesbar.
