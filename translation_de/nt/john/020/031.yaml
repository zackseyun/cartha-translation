  naturalness: „Diese aber sind aufgeschrieben worden“ ist im modernen Standarddeutsch mit einem substantivisch gebrauchten Plural-„Diese“ am Satzanfang unnötig sperrig. „Dies aber ist geschrieben worden“ ist idiomatischer. Die verbale Wiedergabe „indem ihr glaubt“ bewahrt zudem die Satzbewegung besser als „durch den Glauben“.
  terminology: „Messias“, „der Sohn Gottes“, „Leben“ und „in seinem Namen“ sind angemessen. Die Fußnote sollte die im SBLGNT gedruckte Präsensform und die abweichende aoristische Lesart sachlich beschreiben, ohne die Präsensform zu stark auf Fortdauer festzulegen.
