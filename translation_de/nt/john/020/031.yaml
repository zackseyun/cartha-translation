id: JHN.20.31
reference: John 20:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: de
  text: Dies aber ist geschrieben worden, damit ihr glaubt, dass Jesus der Messias[a], der Sohn Gottes, ist, und damit ihr, indem ihr glaubt, Leben in seinem Namen habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „der Christus“. Einige Handschriften lesen im ersten Zwecksatz eine aoristische Verbform: „damit ihr zum Glauben kommt“. Die im Haupttext des SBLGNT stehende Präsensform kann einen fortdauernden Glauben nahelegen. „Damit ihr glaubt“ lässt beide Nuancen offen.'
    reason: alternative_reading_and_textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: diese
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist auf die zuvor genannten Zeichen und ihre schriftliche Darstellung; „diese“ bewahrt den knappen Ausdruck des Griechischen.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen milden Gegensatz beziehungsweise Übergang gegenüber dem vorangehenden Vers.
- source_word: γέγραπται
  choice: sind aufgeschrieben worden
  rationale: Gibt das Perfekt Passiv als abgeschlossene Niederschrift mit fortdauerndem Ergebnis wieder.
- source_word: ἵνα πιστεύητε
  choice: damit ihr glaubt
  rationale: Bewahrt den Zweckcharakter von ἵνα und lässt die aspektuelle Aussage von πιστεύητε im Haupttext bewusst offen.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Gibt Χριστός als Titel in seiner inhaltlichen Bedeutung wieder und erhält den jüdisch-messianischen Kontext.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Präzise und etablierte Wiedergabe des christologischen Titels ohne Abschwächung oder Erweiterung.
- source_word: πιστεύοντες
  choice: durch den Glauben
  rationale: Gibt das Partizip modal als Mittel wieder und stellt einen natürlichen Bezug zum bereits genannten Glauben her.
- source_word: ζωὴν
  choice: Leben
  rationale: Entspricht dem unqualifizierten griechischen Substantiv; „ewiges“ wird nicht ergänzt.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: in seinem Namen
  rationale: Bewahrt die johanneische Formulierung und ihre theologische Dichte, ohne sie erklärend aufzulösen.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Χριστός bezeichnet hier den messianischen Titel Jesu. „Messias“ vermittelt dessen Bedeutung deutlicher, während die geläufige Alternative in der Fußnote genannt wird.
- issue: Textvariante und Aspekt bei πιστεύητε
  choice: damit ihr glaubt
  alternative: damit ihr zum Glauben kommt / damit ihr im Glauben bleibt
  rationale: Der gedruckte SBLGNT-Text hat das Präsens πιστεύητε, während wichtige Handschriften den Aorist πιστεύσητε bieten. Die breite Haupttextformulierung vermeidet es, die Zielrichtung einseitig auf Beginn oder Fortdauer des Glaubens festzulegen.
- issue: Bedeutung von ζωή
  choice: Leben
  alternative: ewiges Leben
  rationale: Der Vers selbst enthält kein Adjektiv für „ewig“. Die johanneische theologische Bedeutung bleibt im schlichten Ausdruck „Leben“ erhalten, ohne eine ausdrückliche Ergänzung vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt die beiden parallelen Zwecksätze des Griechischen. „Aufgeschrieben worden“ klingt natürlich und bildet zugleich das Perfekt Passiv ab; theologische Schlüsselbegriffe bleiben knapp und unaufgelöst.
