  to: Dies aber ist geschrieben worden, damit ihr glaubt, dass Jesus der Messias[a], der Sohn Gottes, ist, und damit ihr, indem ihr glaubt, Leben in seinem Namen habt.
  rationale: Die Revision glättet das einleitende Demonstrativpronomen zu natürlichem modernem Deutsch und gibt das Partizip πιστεύοντες verbal wieder. Die parallelen Zwecksätze, die unqualifizierte Wiedergabe von ζωή als „Leben“ und die bewusst nicht aufgelöste textkritische bzw. aspektuelle Frage bei πιστεύητε bleiben erhalten.
