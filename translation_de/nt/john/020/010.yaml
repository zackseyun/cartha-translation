  text: So the disciples went away again to their own homes[a].
translation:
  language: de
  text: Da gingen die Jünger wieder nach Hause.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »zu sich selbst« oder »an ihren eigenen Ort«. Gemeint ist wahrscheinlich, dass sie an den Ort zurückkehrten, an dem sie sich aufhielten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: gingen … zurück
  rationale: Der Aorist von ἀπέρχομαι bezeichnet das Verlassen des Schauplatzes. Zusammen mit πάλιν gibt »gingen … zurück« die Bewegung im Deutschen natürlich wieder.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die erzählerische Folge aus dem Vorangehenden ein. »Da« bewahrt diesen Zusammenhang in flüssigem, modernem Deutsch.
- source_word: πάλιν
  choice: wieder … zurück
  rationale: πάλιν bezeichnet hier die Rückkehr. Im Deutschen bringt die Verbindung mit »zurückgehen« diesen Sinn idiomatisch zum Ausdruck.
- source_word: πρὸς αὑτούς
  choice: dorthin, wo sie untergebracht waren
  rationale: Wörtlich steht »zu sich selbst/zu ihnen selbst«. Im Kontext bezeichnet die Wendung wahrscheinlich den Ort, an dem die Jünger sich aufhielten. Die Übersetzung macht diesen wahrscheinlichen Sinn verständlich, ohne ausdrücklich eigene Häuser vorauszusetzen.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: »Die Jünger« ist die geläufige und sachlich passende deutsche Bezeichnung für Jesu μαθηταί.
