id: JHN.20.16
reference: John 20:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: de
  text: 'Jesus sagt zu ihr: „Maria!“ Sie wendet sich um und sagt auf Hebräisch[a] zu ihm: „Rabbuni!“ (Das bedeutet: „Lehrer“.)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Aramäisch“. Mit „Hebräisch“ kann Johannes allgemeiner die semitische Sprache Judäas bezeichnen.'
    reason: Alternative Deutung des sprachlichen Ausdrucks Ἑβραϊστί.
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens bewahrt den lebendigen Erzählstil des Johannes.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der griechische Dativ wird im Deutschen natürlich mit „zu ihr“ wiedergegeben.
- source_word: Μαριάμ
  choice: Maria
  rationale: Die im Deutschen etablierte Namensform ist idiomatisch und eindeutig.
- source_word: στραφεῖσα
  choice: Sie wendet sich um
  rationale: Die finite Form klingt im modernen Deutsch natürlich und gibt die Handlung des Aoristpartizips klar wieder.
- source_word: ἐκείνη
  choice: sie
  rationale: Das Demonstrativpronomen fungiert hier als Subjekt und wird im Deutschen idiomatisch als Personalpronomen wiedergegeben.
- source_word: Ἑβραϊστί
  choice: auf Hebräisch
  rationale: Die Hauptübersetzung folgt dem ausdrücklichen griechischen Wortlaut; die mögliche weitere Bedeutung „auf Aramäisch“ wird in einer Fußnote bewahrt.
- source_word: Ραββουνι
  choice: Rabbuni
  rationale: Die semitische Anrede wird transliteriert, da der Evangelist sie unmittelbar selbst erklärt; „Rabbuni“ entspricht einer geläufigen deutschen Umschrift.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: 'Das bedeutet: „Lehrer“.'
  rationale: Die Formulierung gibt die erklärende Glosse natürlich wieder; „Lehrer“ entspricht dem gewöhnlichen Sinn des Vokativs Διδάσκαλε.
theological_decisions:
- issue: Bedeutung von Ἑβραϊστί im johanneischen Sprachgebrauch
  choice: auf Hebräisch
  alternative: auf Aramäisch
  rationale: Die Hauptübersetzung wahrt den griechischen Wortlaut, ohne die verbreitete Deutung auszuschließen, dass der Ausdruck die semitische Umgangssprache Judäas und damit Aramäisch bezeichnen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens bleibt erhalten. Die Satzstellung ist leicht geglättet, ohne Aussagen des griechischen Textes hinzuzufügen oder theologische Spannungen aufzulösen.
