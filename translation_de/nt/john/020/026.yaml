id: JHN.20.26
reference: John 20:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: de
  text: 'Und acht Tage später waren seine Jünger wieder drinnen, und Thomas war bei ihnen. Da kommt Jesus, als die Türen verschlossen waren, tritt in ihre Mitte und sagt: »Friede sei mit euch!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: acht Tage später
  rationale: Gibt die griechische Zeitangabe natürlich und inhaltlich genau wieder, ohne sie interpretierend in »eine Woche später« umzuwandeln.
- source_word: ἔσω
  choice: drinnen
  rationale: Bewahrt die knappe räumliche Angabe des griechischen Textes; ein bestimmtes Gebäude wird nicht ergänzt.
- source_word: ἔρχεται
  choice: Da kommt
  rationale: Bewahrt das historische Präsens und damit die lebendige Erzählweise des Ausgangstextes.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: obwohl die Türen verschlossen waren
  rationale: Gibt den Genitivus absolutus konzessiv wieder und erhält den bemerkenswerten Gegensatz zwischen den verschlossenen Türen und Jesu Kommen.
- source_word: ἔστη εἰς τὸ μέσον
  choice: tritt in ihre Mitte
  rationale: Eine natürliche deutsche Wiedergabe des Eintretens und Stehens in der Mitte; das Präsens führt den mit ἔρχεται begonnenen lebendigen Erzählzug fort.
- source_word: Εἰρήνη ὑμῖν
  choice: Friede sei mit euch!
  rationale: Entspricht der idiomatischen deutschen Form des semitisch geprägten Friedensgrußes und lässt zugleich seinen möglichen tieferen Zuspruch bestehen.
theological_decisions:
- issue: Jesu Kommen bei verschlossenen Türen
  choice: obwohl die Türen verschlossen waren
  alternative: bei verschlossenen Türen
  rationale: Die konzessive Fassung macht den im Kontext naheliegenden Gegensatz sichtbar, ohne zu erklären, auf welche Weise Jesus in den Raum gelangte.
- issue: Bedeutung des Friedenswortes
  choice: Friede sei mit euch!
  alternative: Friede euch!
  rationale: Die idiomatische Form lässt offen, ob die Worte hier vor allem Gruß, Zuspruch oder beides sind, und löst diese theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Erzählweise. Das historische Präsens wird in »kommt«, »tritt« und »sagt« erhalten; »waren« bleibt für den vorausliegenden Zustand der Türen und der Jünger stehen. Keine konfessionellen Erläuterungen oder spekulativen Angaben zur Art von Jesu Eintritt.
