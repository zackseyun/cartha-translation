  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: de
  text: Denn sie verstanden die Schrift noch nicht, dass er von den Toten auferstehen musste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er von den Toten auferweckt werden musste“. Im Griechischen steht hier ein aktives Verb: „auferstehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: noch nicht
  rationale: 'Gibt den zeitlichen Sinn idiomatisch wieder: Bis zu diesem Zeitpunkt hatten sie die Schrift nicht verstanden.'
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die Erklärung zum vorausgehenden Geschehen und bewahrt den argumentativen Zusammenhang.
- source_word: ᾔδεισαν
  choice: hatten … verstanden
  rationale: Das Verb bedeutet grundsätzlich „wissen/kennen“, bezeichnet hier mit der Schrift und dem Inhaltssatz jedoch das Erfassen ihrer Aussage.
- source_word: τὴν γραφὴν
  choice: die Schrift
  rationale: Bewahrt den griechischen Singular und bezeichnet die maßgebliche heilige Schrift, möglicherweise mit Blick auf ein bestimmtes Schriftzeugnis.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was sie aus der Schrift noch nicht verstanden hatten.
- source_word: δεῖ
  choice: musste
  rationale: Drückt die im Heilshandeln begründete Notwendigkeit aus und fügt sich natürlich in den vergangenen Erzählrahmen ein.
- source_word: αὐτὸν
  choice: er
  rationale: Das Akkusativsubjekt des Infinitivs wird im deutschen dass-Satz als Subjekt wiedergegeben.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Ist die natürliche deutsche Wiedergabe der üblichen neutestamentlichen Auferstehungsformel.
- source_word: ἀναστῆναι
  choice: auferstehen
  rationale: Bewahrt die aktive Form des griechischen Infinitivs und ist im Deutschen die geläufige Formulierung für die Auferstehung.
theological_decisions:
- issue: Ausdruck der Auferstehung und Handelnder
  choice: dass er von den Toten auferstehen musste
  alternative: dass er von den Toten auferweckt werden musste
  rationale: Der griechische Text verwendet einen aktiven Infinitiv. Daher bleibt die Hauptübersetzung aktiv, ohne die an anderen Stellen bezeugte passive Formulierung oder die Frage nach der handelnden Person gegen diesen Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Plusquamperfekt verdeutlicht, dass ihr fehlendes Verständnis dem unmittelbar geschilderten Geschehen vorauslag. Der Singular „die Schrift“ und die aktive Auferstehungsformulierung bleiben erhalten.
