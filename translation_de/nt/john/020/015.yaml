reference: John 20:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: de
  text: 'Jesus sagte zu ihr: „Frau, warum weinst du? Wen suchst du?“ Sie dachte, er sei der Gärtner, und sagte zu ihm: „Herr[a], wenn du ihn weggetragen hast, sag mir, wo du ihn hingelegt hast, und ich werde ihn wegtragen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann „Herr“ als Titel bedeuten, wird hier aber wahrscheinlich als höfliche Anrede gebraucht, da Maria meint, mit dem Gärtner zu sprechen.
    reason: Bedeutungs- und theologische Spannung von κύριε
lexical_decisions:
- source_word: Γύναι
  choice: Frau
  rationale: Die vokativische Anrede ist im Griechischen respektvoll und nicht herabsetzend. „Frau“ bewahrt die direkte johanneische Formulierung ohne den Zusatz einer im Ausgangstext nicht ausdrücklich vorhandenen Nuance.
- source_word: τί κλαίεις
  choice: warum weinst du
  rationale: κλαίω bezeichnet Weinen; die feierliche und natürliche Formulierung „warum weinst du“ gibt das idiomatisch gebrauchte τί als Frage nach dem Grund wieder.
- source_word: τίνα ζητεῖς
  choice: Wen suchst du
  rationale: ζητέω bedeutet hier „suchen“; der Akkusativ τίνα bezeichnet eine Person und wird knapp und natürlich mit „wen“ wiedergegeben.
- source_word: δοκοῦσα
  choice: sie dachte
  rationale: Das Partizip bezeichnet Marias irrtümliche Annahme. „Sie dachte“ ist in modernem Deutsch natürlicher als „in der Annahme“, ohne die Aussage zu verstärken.
- source_word: ὁ κηπουρός
  choice: der Gärtner
  rationale: κηπουρός bezeichnet unmittelbar einen Gärtner; eine Wiedergabe wie „Gartenwächter“ wäre unnötig interpretierend.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ kann im Deutschen sowohl respektvolle Anrede als auch Hoheitstitel sein und bewahrt dadurch die lexikalische und erzählerische Spannung des griechischen κύριε. Der Kontext legt hier eine höfliche Anrede nahe, weil Maria Jesus für den Gärtner hält.
- source_word: ἐβάστασας αὐτόν
  choice: du ihn weggetragen hast
  rationale: βαστάζω bezeichnet das Tragen beziehungsweise Wegtragen; im Zusammenhang mit einem Leichnam bewahrt „weggetragen“ den körperlichen Sinn.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: wohin du ihn gelegt hast
  rationale: τίθημι kann „setzen, stellen, legen“ bedeuten. Bei einem Leichnam ist „gelegt“ im Deutschen natürlich; das richtungsbezogene „wohin“ passt zum vorausgesetzten Wegtragen.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: dann werde ich ihn holen
  rationale: αἴρω kann „aufheben, tragen, wegnehmen“ bedeuten. „Holen“ drückt in diesem Kontext natürlich Marias Absicht aus, den Leichnam an sich zu nehmen und fortzubringen; „dann“ gibt die resultative Verbindung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von κύριε in Marias Anrede, bevor sie den auferstandenen Jesus erkennt
  choice: Herr
  alternative: mein Herr; werter Herr
  rationale: Da Maria Jesus für den Gärtner hält, ist κύριε hier wahrscheinlich eine respektvolle Anrede und noch kein bewusstes christologisches Bekenntnis. Das deutsche „Herr“ erhält jedoch dieselbe mögliche Titelresonanz wie das Griechische und löst die erzählerische Spannung nicht stillschweigend auf; die Fußnote erklärt den wahrscheinlichen Gebrauch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Das historische Präsens des griechischen λέγει wird im deutschen Erzählzusammenhang idiomatisch als Präteritum wiedergegeben. Die direkte Anrede „Frau“ bleibt bewusst erhalten; die Ambiguität von κύριε wird im Haupttext und in der Fußnote gewahrt.
