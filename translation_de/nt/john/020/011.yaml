source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: de
  text: Maria aber stand draußen beim Grab und weinte. Während sie weinte, beugte sie sich vor, um in das Grab hineinzuschauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beugte sie sich vor und blickte in das Grab hinein“. Das griechische Verb bezeichnet ein Vorbeugen, um hineinzusehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten erzählerischen Gegensatz beziehungsweise Übergang von den fortgehenden Jüngern zu Maria.
- source_word: εἱστήκει
  choice: stand
  rationale: Das Plusquamperfekt bezeichnet hier einen fortdauernden Zustand; im natürlichen deutschen Erzählstil gibt das Präteritum diesen angemessen wieder.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: draußen vor dem Grab
  rationale: Gibt Marias Standort außerhalb des Grabes idiomatisch wieder und wahrt den räumlichen Gegensatz zum anschließenden Hineinschauen.
- source_word: μνημεῖον
  choice: Grab
  rationale: Bezeichnet hier die Grabanlage, in der Jesus bestattet worden war; „Grab“ ist die natürliche moderne deutsche Entsprechung.
- source_word: κλαίουσα / ἔκλαιεν
  choice: weinte / Während sie weinte
  rationale: Bewahrt den fortdauernden Charakter des Weinens sowie die Wiederholung im griechischen Text, ohne im Deutschen schwerfällig zu wirken.
- source_word: ὡς οὖν
  choice: Während
  rationale: Verbindet die folgende Handlung mit dem andauernden Weinen. Das folgernde οὖν wird im flüssigen deutschen Zusammenhang nicht eigens ausgedrückt, da „also“ hier unnatürlich und zu stark kausal klänge.
- source_word: παρέκυψεν
  choice: beugte sie sich vor, um … hineinzuschauen
  rationale: Bringt sowohl die körperliche Bewegung als auch den damit verbundenen Blick in das Grab zum Ausdruck.
- source_word: εἰς τὸ μνημεῖον
  choice: in das Grab hinein
  rationale: Gibt die durch εἰς bezeichnete Blickrichtung zum Inneren des Grabes wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortlaufende Trauerhandlung und die räumliche Bewegung werden klar und natürlich wiedergegeben; die Wiederholung von κλαίω bleibt erhalten.
