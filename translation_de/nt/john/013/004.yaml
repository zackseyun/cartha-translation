  verdict: revise
  source_fidelity: 'Der Entwurf trifft die wesentlichen Handlungen korrekt: Aufstehen vom Mahl, Ablegen der Obergewänder, Nehmen eines λέντιον und Umbinden. Das zusätzliche „Dann“ macht jedoch die bloße partizipiale Verknüpfung unnötig ausdrücklich. Die Fußnote gibt mit „damit“ ein im Griechischen nicht ausgedrücktes Objekt als angeblich wörtlichen Bestandteil wieder.'
  naturalness: „Er steht vom Mahl auf und legt seine Obergewänder ab“ ist natürliches, würdevolles modernes Standarddeutsch. Die koordinierte Fortsetzung mit „und nimmt ... und bindet ...“ ist ebenso idiomatisch und bildet den Ablauf ohne Zusatz besser ab.
  terminology: „Mahl“, „Obergewänder“ und „Leinentuch“ sind sachgerecht. „Leinentuch“ gibt λέντιον angemessen wieder, ohne die Funktion unnötig auf ein modernes Handtuch einzugrenzen. Die Alternative „gürtet sich“ gibt διέζωσεν ἑαυτόν ohne zusätzliches „damit“ wieder.
  issues:
  - severity: low
    issue: „Dann“ ist eine nicht erforderliche explizite Zeitverknüpfung.
    rationale: Das Partizip λαβών reiht die Handlung an; die koordinierte deutsche Formulierung kann dies ohne den zusätzlichen zeitlichen Akzent wiedergeben.
  - severity: medium
    issue: Die Fußnote bezeichnet „umgürtete sich damit“ als wörtlich.
    rationale: Das griechische διέζωσεν ἑαυτόν lautet wörtlich „gürtete sich“; ein auf λέντιον zurückweisendes Objekt ist nur aus dem Kontext zu ergänzen und sollte nicht als wörtlich ausgegeben werden.
  revised_text: Er steht vom Mahl auf und legt seine Obergewänder ab, nimmt ein Leinentuch und bindet es sich um.[a]
