base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: de
  text: Er steht vom Mahl auf und legt seine Obergewänder ab, nimmt ein Leinentuch und bindet es sich um.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gürtet sich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται ἐκ τοῦ δείπνου
  choice: Er steht vom Mahl auf
  rationale: Das historische Präsens wird als Präsens bewahrt. „Vom Mahl aufstehen“ gibt die Bewegung aus der Mahlsituation natürlich und genau wieder.
- source_word: τίθησιν τὰ ἱμάτια
  choice: legt seine Obergewänder ab
  rationale: τίθημι bezeichnet hier im Zusammenhang das Ablegen; ἱμάτια meint wahrscheinlich die äußeren Kleidungsstücke und nicht sämtliche Kleidung.
- source_word: λαβὼν λέντιον
  choice: Dann nimmt er ein Leinentuch
  rationale: Das aoristische Partizip bezeichnet die nächste Handlung. λέντιον ist ein Leinentuch, das hier als Tuch zum Abtrocknen dient; „Leinentuch“ wahrt den Stoffbezug deutlicher als das funktionale „Handtuch“.
- source_word: διέζωσεν ἑαυτόν
  choice: bindet es sich um
  rationale: Die Wendung gibt das Umbinden des zuvor genannten Tuchs in natürlichem modernem Deutsch wieder. Das im Deutschen notwendige Objekt „es“ bezieht sich eindeutig auf das Leinentuch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom historischen Präsens ἐγείρεται/τίθησιν zum Aorist διέζωσεν wird zugunsten eines flüssigen deutschen Erzählpräsens vereinheitlicht. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
