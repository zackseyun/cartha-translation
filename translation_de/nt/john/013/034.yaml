id: JHN.13.34
reference: John 13:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: de
  text: 'Ein neues Gebot gebe ich euch: Liebt einander. Wie ich euch geliebt habe, so sollt auch ihr einander lieben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „damit auch ihr einander liebt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: ein neues Gebot
  rationale: „Gebot“ gibt die verbindliche ethische Kraft von ἐντολή im johanneischen Sprachgebrauch natürlich wieder; „neu“ bewahrt die im Vers nicht näher erklärte Bedeutung von καινός.
- source_word: δίδωμι ὑμῖν
  choice: gebe ich euch
  rationale: Das Präsens und der Dativ des Empfängers werden direkt und in würdigem, natürlichem Deutsch wiedergegeben.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: Liebt einander
  rationale: Nach „ein Gebot gebe ich euch“ bezeichnet ἵνα den Inhalt des Gebots. Der deutsche Imperativ bringt dessen verpflichtende Kraft klar zum Ausdruck, ohne den Sinn auszuweiten.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Wie ich euch geliebt habe
  rationale: „Wie“ gibt καθὼς als Vergleich und Maßstab wieder. Das deutsche Perfekt ist hier die natürliche Erzählzeit für Jesu bereits erwiesene Liebe und bleibt semantisch mit dem griechischen Aorist vereinbar.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: so sollt auch ihr einander lieben
  rationale: „So“ nimmt den Vergleich auf; „auch ihr“ bewahrt die Hervorhebung von καὶ ὑμεῖς. „Sollt“ vermittelt die auffordernde Kraft, lässt aber die syntaktische Mehrdeutigkeit der zweiten ἵνα-Klausel in einer Fußnote sichtbar.
theological_decisions:
- issue: Art der Neuheit des Gebots
  choice: „ein neues Gebot“ ohne nähere Erklärung im Haupttext
  alternative: neu in zeitlicher Hinsicht; neu in seiner Qualität; neu in seiner Verwirklichung durch Jesu Liebe
  rationale: Der Vers nennt das Gebot neu, bestimmt aber nicht ausdrücklich, worin seine Neuheit besteht. Die Übersetzung lässt diese theologische Spannung offen.
- issue: Funktion der zweiten ἵνα-Klausel
  choice: „so sollt auch ihr einander lieben“ als erneute Aufforderung
  alternative: „damit auch ihr einander liebt“ als Ziel- oder Folgesatz
  rationale: Der Zusammenhang mit dem Gebot stützt die auffordernde Wiedergabe; zugleich kann ἵνα syntaktisch Ziel oder Folge ausdrücken, weshalb die Alternative in einer Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „einander lieben“ bleibt wie im Griechischen erhalten; die Satzstellung „auch ihr“ bewahrt den ausdrücklichen Nachdruck des Ausgangstextes.
