review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des Griechischen wieder: „ein neues Gebot“, die direkte Gabe an „euch“, die gegenseitige Liebe, Jesu bereits erwiesene Liebe als Maßstab sowie die Betonung von „auch ihr“. Die imperativische Wiedergabe der ersten ἵνα-Klausel ist im Deutschen nach „Gebot“ idiomatisch und wahrt deren gebietenden Sinn. „Wie ich euch geliebt habe, so sollt auch ihr einander lieben“ stellt den Vergleich und die erneute Aufforderung angemessen dar.'
  naturalness: Modernes, flüssiges Standarddeutsch mit einem dem Abschiedsreden-Kontext angemessen würdigen Ton. „Ein neues Gebot gebe ich euch“ ist zwar leicht gehoben, aber klar und natürlich. Die Wiederholung von „einander lieben“ bewahrt die beabsichtigte Betonung.
  terminology: „Gebot“ ist die passende, etablierte Wiedergabe von ἐντολή. „Neu“, „lieben“ und „einander“ sind konsequent, verständlich und theologisch nicht überbestimmt. Die Übersetzung erklärt nicht, worin die Neuheit des Gebots besteht, und erhält damit die Offenheit des Ausgangstextes.
