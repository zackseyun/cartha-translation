id: JHN.13.11
reference: John 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: de
  text: 'Denn er wusste, wer ihn auslieferte[a]. Deshalb sagte er: »Nicht ihr alle seid rein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wer ihn verriet«. Wörtlicher bezeichnet das griechische Wort ein Übergeben oder Ausliefern; im Zusammenhang ist der Verrat des Judas gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: er wusste
  rationale: Das Plusquamperfekt von οἶδα hat hier gegenwärtigen Sinn innerhalb der vergangenen Erzählung; »er wusste« ist im Deutschen die natürliche Wiedergabe.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet die vorausgehende Aussage und wird mit dem natürlichen deutschen Erklärungspartikel »denn« wiedergegeben.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: wer ihn auslieferte
  rationale: Die substantivierte Präsenspartizipialkonstruktion bezeichnet denjenigen, der Jesus auslieferte. »Ausliefern« bewahrt die Grundbedeutung von παραδίδωμι und lässt den im Kontext erkennbaren Verrat mitschwingen.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die Wendung bezeichnet ausdrücklich die Folgerung aus Jesu Wissen; »deshalb« gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: εἶπεν ὅτι
  choice: 'sagte er:'
  rationale: ὅτι leitet hier direkte Rede ein; im Deutschen wird dies natürlich durch Doppelpunkt und Anführungszeichen dargestellt.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Nicht ihr alle seid rein
  rationale: Die Wortstellung hebt hervor, dass die Aussage nicht auf alle Angeredeten zutrifft. »Rein« bewahrt im Fußwaschungskontext sowohl die körperliche als auch die übertragene Bedeutung von καθαρός.
theological_decisions:
- issue: Bedeutung von παραδιδόντα im Blick auf Judas
  choice: auslieferte
  alternative: verriet
  rationale: »Ausliefern« bildet die lexikalische Grundbedeutung ab, ohne den im Erzählzusammenhang deutlich vorhandenen Verratsaspekt zu leugnen oder auf eine einzige deutsche Deutung zu verengen.
- issue: Bedeutung von καθαροί im Fußwaschungsdiskurs
  choice: rein
  alternative: sauber
  rationale: »Rein« kann im Deutschen körperliche Reinheit bezeichnen und zugleich die geistlich-moralische Tiefendimension tragen. »Sauber« würde hier stärker auf den rein körperlichen Sinn festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur folgt dem erklärenden Gedankengang des griechischen Textes; »Nicht ihr alle« ist idiomatisch und erhält die leichte Hervorhebung der Verneinung.
