  naturalness: Modernes, gut verständliches Standarddeutsch. Die knappe Satzfolge und die direkte Rede sind idiomatisch. „Nicht ihr alle seid rein“ ist eine mögliche und verständliche Wiedergabe der hervorgehobenen Verneinung.
