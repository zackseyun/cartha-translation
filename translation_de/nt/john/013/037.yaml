  source_fidelity: Der Text gibt alle wesentlichen Elemente des griechischen Satzes wieder. Das historische Präsens „sagt“ entspricht λέγει; „Herr“, „jetzt nicht folgen“, „mein Leben“ und „für dich hingeben“ geben Κύριε, ἄρτι ... ἀκολουθῆσαι, τὴν ψυχήν μου und ὑπὲρ σοῦ θήσω idiomatisch und sinngetreu wieder. „Folgen“ bewahrt die konkrete wie auch die im Kontext mitschwingende Jüngerschaftsdimension.
  naturalness: Modernes Standarddeutsch, klar und würdig. „Mein Leben werde ich für dich hingeben“ ist eine natürliche, leicht nachdrückliche Wortstellung und reflektiert die Voranstellung von τὴν ψυχήν μου.
  terminology: „Herr“ ist für Κύριε angemessen. Die Wiedergabe von ψυχή als „Leben“ trifft den hier vorliegenden idiomatischen Bezug auf den Tod; die Fußnote dokumentiert die wörtliche lexikalische Alternative „Seele“, ohne den Haupttext zu belasten.
