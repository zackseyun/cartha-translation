id: JHN.13.37
reference: John 13:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: de
  text: 'Petrus sagt zu ihm: „Herr, warum kann ich dir jetzt nicht folgen? Mein Leben[a] werde ich für dich hingeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: meine Seele; hier im Sinn von mein Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das griechische historische Präsens wird beibehalten; im Deutschen ist es in einer lebendigen Erzählung natürlich und gibt die Form des Ausgangstextes wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche Anrede für κύριος wahrt sowohl den respektvollen Ton als auch das mögliche theologische Gewicht.
- source_word: οὐ δύναμαί σοι ἀκολουθῆσαι ἄρτι
  choice: warum kann ich dir jetzt nicht folgen?
  rationale: Die Formulierung ist natürliches Deutsch und bewahrt mit „folgen“ sowohl die räumliche als auch die auf Jüngerschaft bezogene Bedeutung von ἀκολουθέω.
- source_word: τὴν ψυχήν μου
  choice: mein Leben
  rationale: In der Verbindung mit τίθημι bezeichnet ψυχή hier das Leben, das jemand im Tod hingibt; „meine Seele“ würde im Deutschen unnötig metaphysisch klingen.
- source_word: ὑπὲρ σοῦ
  choice: für dich
  rationale: Die knappe Wiedergabe lässt offen, ob besonders der Nutzen, die Stellvertretung oder allgemein das Eintreten für Jesus betont ist.
- source_word: θήσω
  choice: werde ich hingeben
  rationale: „Sein Leben hingeben“ ist die natürliche deutsche Entsprechung der Wendung τίθημι τὴν ψυχήν und drückt die Bereitschaft zum Tod aus.
theological_decisions:
- issue: Bedeutung von ψυχή in der Erklärung des Petrus
  choice: „mein Leben“
  alternative: „meine Seele“
  rationale: Der Zusammenhang handelt von der Bereitschaft des Petrus, für Jesus zu sterben. Die idiomatische Verbindung meint die Hingabe des Lebens, nicht eine isolierte metaphysische Seele.
- issue: Bedeutungsweite von ἀκολουθέω
  choice: „folgen“
  alternative: „mitgehen“ oder „begleiten“
  rationale: „Folgen“ bewahrt zugleich die konkrete Bewegung und den für das Johannesevangelium wichtigen Bezug auf Jüngerschaft.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die vorangestellte Formulierung „Mein Leben“ trägt den Nachdruck der griechischen Wortstellung; „hingeben“ ist idiomatisch und in diesem Zusammenhang klar.
