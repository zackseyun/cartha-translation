source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Wer gebadet hat[a], braucht sich nur noch die Füße zu waschen; er ist vielmehr ganz rein. Auch ihr seid rein, aber nicht alle.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen zwei verschiedene Verben: λούω bezeichnet hier das Baden beziehungsweise Waschen des ganzen Körpers, νίπτω dagegen meist das Waschen eines Körperteils, hier der Füße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Das historische Präsens λέγει wird dem natürlichen deutschen Erzählstil entsprechend mit dem Präteritum wiedergegeben.
- source_word: Ὁ λελουμένος
  choice: Wer gebadet hat
  rationale: Das substantivierte Perfektpartizip von λούω bezeichnet jemanden im Zustand nach einem vollständigen Bad. Die deutsche Formulierung ist allgemein, singularisch und bewahrt den Ergebnisaspekt.
- source_word: οὐκ ἔχει χρείαν εἰ μὴ τοὺς πόδας νίψασθαι
  choice: braucht sich außer den Füßen nichts zu waschen
  rationale: Die Formulierung gibt die einzige Ausnahme mit εἰ μή idiomatisch wieder und unterscheidet das Waschen einzelner Körperteile (νίπτω) vom vorherigen Baden (λούω). Das reflexive „sich“ entspricht dem Medium νίψασθαι.
- source_word: ἀλλ’ ἔστιν καθαρὸς ὅλος
  choice: sondern ist ganz rein
  rationale: „Ganz rein“ bewahrt sowohl die Totalität von ὅλος als auch die mögliche wörtliche und übertragene Bedeutung von καθαρός; „sondern“ bildet den griechischen Gegensatz mit ἀλλά ab.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Auch ihr seid rein
  rationale: „Ihr“ macht die pluralische Anrede deutlich; die Wiederholung von „rein“ erhält das Leitwort des Verses.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: aber nicht alle
  rationale: Die knappe Formulierung bewahrt die Ausnahme innerhalb der angesprochenen Gruppe, ohne sie im Vers ausdrücklich zu identifizieren.
theological_decisions:
- issue: Wörtliches Waschen und symbolische beziehungsweise geistliche Reinheit
  choice: Die Wörter „gebadet“, „waschen“ und „rein“ bleiben ohne erklärende geistliche Erweiterung stehen.
  alternative: „rein“ ausdrücklich als „geistlich rein“ deuten oder beide Waschverben gleich übersetzen
  rationale: Der Kontext lässt die körperliche Handlung und ihre symbolische Bedeutung ineinandergreifen. Die Übersetzung bewahrt diese Spannung und legt keine bestimmte sakramentale oder sonstige dogmatische Deutung fest.
- issue: Generischer Gebrauch des maskulinen Singularpartizips
  choice: Wer gebadet hat
  alternative: Derjenige, der gebadet hat / Ein Mann, der gebadet hat
  rationale: „Wer“ gibt den generischen Sinn natürlich wieder, ohne das grammatische Maskulinum fälschlich auf männliche Personen zu beschränken.
- issue: Reichweite von ὅλος bei καθαρός
  choice: ganz rein
  alternative: am ganzen Körper rein
  rationale: „Ganz rein“ wahrt die Totalität und lässt zugleich offen, wie stark die Aussage körperlich oder symbolisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch, bleibt aber nahe an der griechischen Gegenüberstellung. „Ganz rein“ erhält die johanneische Doppeldeutigkeit, ohne sie durch eine ausdrückliche Deutung einzuengen.
