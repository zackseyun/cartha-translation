base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: de
  text: Daran werden alle erkennen, dass ihr meine Jünger seid, wenn ihr Liebe untereinander habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Daran
  rationale: Die demonstrative Präpositionalfügung bezeichnet hier das erkennbare Kennzeichen beziehungsweise das Mittel der Erkenntnis. „Daran“ ist im Deutschen natürlich und bewahrt diesen Bezug.
- source_word: γνώσονται
  choice: werden erkennen
  rationale: Das Futur von γινώσκω bezeichnet hier das Erkennen einer Tatsache. „Erkennen“ passt zur Wahrnehmung des sichtbaren Kennzeichens besser als das statischere „wissen“.
- source_word: πάντες
  choice: alle
  rationale: Der maskuline Plural ist generisch; „alle“ gibt den umfassenden Bezug knapp und geschlechtsübergreifend wieder.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was alle erkennen werden.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: ihr meine Jünger seid
  rationale: Der Dativ ἐμοί bezeichnet die persönliche Zugehörigkeit zu Jesus. Die etablierte Wendung „meine Jünger“ gibt das Verhältnis von Lehrer und Lernenden beziehungsweise Nachfolgenden natürlich wieder.
- source_word: ἐὰν
  choice: wenn
  rationale: ἐάν mit Konjunktiv formuliert eine Bedingung. Im Deutschen ist „wenn“ hier idiomatisch und kann den kennzeichnenden Bedingungscharakter ausdrücken, ohne ihn als bloße Ungewissheit zu überzeichnen.
- source_word: ἀγάπην ἔχητε
  choice: ihr Liebe ... habt
  rationale: Die direkte Wiedergabe mit „Liebe haben“ bewahrt die substantivische Formulierung des Griechischen und den Anschluss an den Kontext.
- source_word: ἐν ἀλλήλοις
  choice: untereinander
  rationale: Die Wendung bezeichnet die wechselseitige Beziehung innerhalb der Gemeinschaft. „Untereinander“ bewahrt das Bild von Liebe in ihrer Mitte; die Fußnote erläutert den gemeinten gegenseitigen Bezug.
theological_decisions:
- issue: Bedingung mit ἐὰν
  choice: wenn ihr Liebe untereinander habt
  alternative: falls ihr einander liebt
  rationale: „Wenn“ bewahrt die griechische Bedingungsform und stellt die gegenseitige Liebe als Erkennungszeichen der Jüngerschaft dar, ohne zu behaupten, sie verdiene oder bewirke die Jüngerschaft.
- issue: Bedeutung der Liebe als Kennzeichen
  choice: Daran werden alle erkennen
  alternative: Dadurch werden alle wissen
  rationale: Die Formulierung lässt die Liebe als öffentlich wahrnehmbares Kennzeichen erscheinen, ohne die Aussage zu einer Definition des Heils oder zu einer Aussage über Verdienst auszuweiten.
- issue: Generischer Bezug von πάντες
  choice: alle
  alternative: alle Menschen
  rationale: „Alle“ bewahrt den universalen, nicht auf Männer beschränkten Sinn, ohne ein im Griechischen nicht ausdrücklich vorhandenes Substantiv hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jünger“ bleibt als im Evangelienkontext etablierter Fachbegriff erhalten. Der Doppelpunkt macht den nachgestellten Bedingungssatz übersichtlich, ohne die Satzbeziehung zu verändern.
