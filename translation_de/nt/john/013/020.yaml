  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wer jemanden aufnimmt, den ich sende, nimmt mich auf; und wer mich aufnimmt, nimmt den auf, der mich gesandt hat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem, der mich gesandt hat“ ist im Zusammenhang der Vater gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die verdoppelte, feierliche Einleitungsformel wird in ihrer vertrauten und im Deutschen verständlichen Form bewahrt.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung gibt die johanneische Redeformel unmittelbar und würdevoll wieder.
- source_word: ὁ λαμβάνων ἄν τινα πέμψω
  choice: Wer den aufnimmt, den ich sende
  rationale: Die generische Kraft des substantivierten Partizips sowie die unbestimmte Reichweite von ἄν τινα mit dem Konjunktiv werden ohne geschlechtliche Verengung natürlich wiedergegeben.
- source_word: λαμβάνει
  choice: nimmt … auf
  rationale: Bei Personen bezeichnet λαμβάνω hier das Annehmen beziehungsweise Aufnehmen. Die Wiederholung wird durchgehend bewahrt, weil sie die Repräsentationskette des Satzes trägt.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: und wer mich aufnimmt
  rationale: δέ verbindet hier eher weiterführend als kontrastierend; „und“ entspricht dem parallelen Aufbau.
- source_word: τὸν πέμψαντά με
  choice: den, der mich gesandt hat
  rationale: Die relationale Bezeichnung des Sendenden bleibt erhalten, ohne den im unmittelbaren Wortlaut nicht genannten Titel „Vater“ einzufügen.
theological_decisions:
- issue: Identität dessen, der Jesus gesandt hat
  choice: den, der mich gesandt hat
  alternative: den Vater, der mich gesandt hat
  rationale: Im johanneischen Zusammenhang ist der Vater gemeint; der Vers selbst nennt jedoch nur den Sendenden. Die Übersetzung bewahrt diese Ausdrucksweise, während die Fußnote die kontextuelle Identifikation erläutert.
- issue: Generischer Sinn der maskulinen Partizipien
  choice: wer
  alternative: derjenige, der
  rationale: Die Formen bezeichnen allgemein jeden Menschen und sind nicht auf Männer beschränkt. „Wer“ gibt diesen Sinn knapp und idiomatisch wieder.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem johanneischem Ton. Die wiederholte Formulierung „aufnehmen“ erhält die gedankliche Kette vom Gesandten über Jesus bis zu dem, der Jesus gesandt hat.
