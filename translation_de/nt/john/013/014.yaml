id: JHN.13.14
reference: John 13:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: de
  text: Wenn also ich, der Herr[a] und der Lehrer, euch die Füße gewaschen habe, dann sollt auch ihr einander die Füße waschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Meister.'
    reason: Alternative Bedeutungsnuance von κύριος; „Herr“ bleibt wegen des üblichen Titelgebrauchs im Haupttext.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Wenn nun … dann
  rationale: Die Formulierung gibt sowohl die Bedingung εἰ als auch die folgernde Kraft von οὖν wieder und bildet Jesu Schlussfolgerung im Deutschen natürlich ab.
- source_word: ἐγὼ
  choice: ich
  rationale: 'Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt die Betonung: Gerade Jesus, der Herr und Lehrer, hat diesen Dienst getan.'
- source_word: ἔνιψα
  choice: gewaschen habe
  rationale: Das Perfekt gibt die unmittelbar zuvor vollendete Handlung des griechischen Aorists in diesem deutschen Bedingungssatz idiomatisch wieder.
- source_word: ὑμῶν τοὺς πόδας
  choice: euch die Füße
  rationale: Diese im Deutschen natürliche Dativkonstruktion bezeichnet eindeutig die Füße der Angesprochenen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: „Herr“ wahrt den üblichen Titel κύριος und erhält den Kontrast zwischen Jesu hoher Stellung und seinem demütigen Handeln.
- source_word: ὁ διδάσκαλος
  choice: der Lehrer
  rationale: Die bestimmte Form und die parallele Titelstruktur des Griechischen werden bewahrt.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Das betonte Pronomen und καί werden so wiedergegeben, dass die entsprechende Verpflichtung der Jünger deutlich hervortritt.
- source_word: ὀφείλετε
  choice: sollt
  rationale: „Sollt“ drückt die moralische Verpflichtung klar und natürlich aus, ohne die indikativische Form unnötig zu einem schroffen Befehl zu verschärfen.
- source_word: ἀλλήλων … τοὺς πόδας
  choice: einander die Füße
  rationale: Die reziproke Beziehung wird in einer idiomatischen deutschen Dativkonstruktion präzise ausgedrückt.
- source_word: νίπτειν
  choice: waschen
  rationale: Das konkrete Waschen eines Körperteils bleibt erhalten; seine mögliche beispielhafte Bedeutung wird nicht an die Stelle des ausdrücklich genannten Handelns gesetzt.
theological_decisions:
- issue: κύριος als christologischer Titel
  choice: der Herr
  alternative: der Gebieter
  rationale: '„Herr“ entspricht dem üblichen Titelgebrauch und bewahrt die theologische Spannung: Derjenige mit höchster Stellung übernimmt den niedrigen Dienst.'
- issue: Art der Verpflichtung zum Fußwaschen
  choice: Die konkrete Aussage „einander die Füße waschen“ bleibt im Haupttext stehen.
  alternative: einander demütig dienen
  rationale: Der griechische Text nennt ausdrücklich das Fußwaschen. Eine Verallgemeinerung auf demütigen Dienst wäre Auslegung und darf die konkrete Aussage nicht ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Wortstellung „Wenn nun ich“ wahrt die Betonung des ausdrücklichen ἐγώ; „dann“ macht den Folgerungszusammenhang für heutige Leser klar. Die wiederholten bestimmten Artikel in „der Herr und der Lehrer“ spiegeln die griechische Apposition.
