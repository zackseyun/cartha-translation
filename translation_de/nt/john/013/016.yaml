source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: de
  text: 'Amen, amen[a], ich sage euch: Ein Sklave ist nicht größer als sein Herr; auch ein Apostel ist nicht größer als der, der ihn gesandt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrlich, wahrlich“. Das doppelte „Amen“ ist eine feierliche Bekräftigungsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die verdoppelte feierliche Bekräftigungsformel wird in ihrer johanneischen Form und Wiederholung bewahrt. „Wahrlich, wahrlich“ wäre sinngemäß, klingt im heutigen Deutsch jedoch altertümlicher.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Formulierung bildet die griechische Redeformel unmittelbar und zugleich natürlich ab.
- source_word: δοῦλος
  choice: Sklave
  rationale: Im Vergleich mit dem Herrn bezeichnet das Wort eine Person in einem ausgeprägten Abhängigkeits- und Unterordnungsverhältnis. „Diener“ wäre geläufiger, schwächte dieses soziale Verhältnis aber ab.
- source_word: μείζων
  choice: größer
  rationale: „Größer“ bewahrt die offene Bedeutung der Überordnung nach Rang, Stellung oder Bedeutung in beiden parallelen Aussagen.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ bezeichnet hier im unmittelbaren sozialen Vergleich den Herrn eines Sklaven. Zugleich bleibt die im griechischen Wort mögliche weitergehende Resonanz erhalten, ohne daraus ausdrücklich einen Titel zu machen.
- source_word: ἀπόστολος
  choice: Gesandter
  rationale: Hier steht die allgemeine Bedeutung eines beauftragten und ausgesandten Vertreters im Vordergrund, wie der parallele Ausdruck „der, der ihn gesandt hat“ zeigt. „Apostel“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: der, der ihn gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird idiomatisch wiedergegeben und die Beziehung zwischen Gesandtem und Sendendem klar erhalten.
theological_decisions:
- issue: κύριος innerhalb des Vergleichs zwischen Sklave und Herrn
  choice: Herr
  alternative: Herr im ausdrücklich titularen Sinn / Gebieter
  rationale: Der unmittelbare Zusammenhang verlangt zunächst die soziale Bedeutung. Das deutsche „Herr“ bildet diese ab, ohne eine mögliche christologische Resonanz des griechischen κύριος auszuschließen oder sie dem Satz aufzuzwingen.
- issue: ἀπόστολος als allgemeine Rollenbezeichnung oder kirchlicher Titel
  choice: Gesandter
  alternative: Apostel
  rationale: Die Parallelität mit dem Sendenden spricht für die allgemeine Funktionsbezeichnung. Dadurch wird nicht behauptet, dass der Begriff an dieser Stelle ausschließlich oder technisch die Zwölf beziehungsweise einen bestimmten kirchlichen Kreis bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante johanneische Eingangsformel bleibt bewusst als „Amen, amen“ stehen. „Sklave“ wahrt die soziale Schärfe des Bildes; „Gesandter“ macht den allgemeinen Sinn des zweiten Vergleichs verständlich. Die parallele Satzstruktur des Griechischen wird beibehalten.
