source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: de
  text: Schon jetzt sage ich es euch, bevor es geschieht, damit ihr, wenn es geschieht, glaubt, dass ich es bin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass ich bin“. Die griechische Wendung kann an göttliche Selbstidentifikation bei Jesaja und an ähnliche Aussagen an anderen Stellen im Johannesevangelium anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Von jetzt an
  rationale: Eine natürliche moderne Wiedergabe des zeitlichen Ausdrucks, die den Blick vom gegenwärtigen Zeitpunkt an nach vorn bewahrt.
- source_word: λέγω ὑμῖν
  choice: sage ich es euch
  rationale: Das Präsens wird im Deutschen idiomatisch als einfaches Präsens wiedergegeben; das ergänzte „es“ verweist natürlich auf das angekündigte Geschehen.
- source_word: πρὸ τοῦ γενέσθαι
  choice: bevor es geschieht
  rationale: Gibt die durch πρό mit substantiviertem Infinitiv bezeichnete Vorzeitigkeit klar wieder, ohne das nicht näher bezeichnete Ereignis festzulegen.
- source_word: ἵνα
  choice: damit
  rationale: Bewahrt die Zweckbeziehung in natürlichem Deutsch.
- source_word: πιστεύσητε
  choice: glaubt
  rationale: Der Konjunktiv Aorist nach ἵνα wird im deutschen damit-Satz idiomatisch mit dem Indikativ wiedergegeben; „glaubt“ bewahrt die johanneische Begriffslinie von πιστεύω.
- source_word: ὅταν γένηται
  choice: wenn es geschieht
  rationale: Drückt den zukünftigen Fall sachlich und verständlich aus; das Deutsche benötigt hier keine besondere Konjunktivmarkierung.
- source_word: ὅτι ἐγώ εἰμι
  choice: dass ich es bin
  rationale: Die idiomatische deutsche Selbstidentifikation lässt das Prädikat weiterhin unausgesprochen und bleibt verständlicher als das isolierte „dass ich bin“; eine Fußnote bewahrt die formnähere Wiedergabe und den möglichen theologischen Nachklang.
theological_decisions:
- issue: Die absolute Wendung ἐγώ εἰμι im Johannesevangelium kann eine schlichte Selbstidentifikation ausdrücken und zugleich göttliche Selbstvorstellungen, besonders bei Jesaja, anklingen lassen.
  choice: dass ich es bin
  alternative: dass ich bin
  rationale: „Dass ich es bin“ ist im Deutschen eine natürliche Selbstidentifikation, ohne ein konkretes Prädikat wie „der Messias“ einzutragen. Die Fußnote erhält die formale Offenheit und weist auf den möglichen biblisch-theologischen Nachklang hin, ohne ihn im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung von „geschieht“ bildet die Wiederholung von γίνομαι im griechischen Text ab. Der Haupttext bleibt idiomatisch, während die Fußnote die sprachliche und theologische Spannung von ἐγώ εἰμι offenhält.
