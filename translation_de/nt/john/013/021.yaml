  rationale: Die Revision stellt die zweigliedrige griechische Prädikation ἐμαρτύρησεν καὶ εἶπεν vollständig wieder. „Legte Zeugnis ab“ ist eine idiomatische deutsche Wiedergabe von μαρτυρέω und erhält den johanneischen Sprachgebrauch; „und sagte“ bleibt als eigenständiges Element erhalten. Alle übrigen Entscheidungen können bestehen bleiben.
