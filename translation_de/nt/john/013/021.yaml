  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: de
  text: 'Nachdem Jesus dies gesagt hatte, wurde er im Geist erschüttert und legte Zeugnis ab und sagte: „Amen, amen, ich sage euch: Einer von euch wird mich verraten[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „wird mich ausliefern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Nachdem Jesus dies gesagt hatte
  rationale: Die temporale Wiedergabe des Aoristpartizips macht die Abfolge im Deutschen natürlich deutlich; das knappe „dies“ entspricht ταῦτα.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: wurde er im Geist erschüttert
  rationale: „Erschüttert“ gibt die innere Beunruhigung von ταράσσω würdig und ohne zusätzliche Intensivierung wieder; „im Geist“ bewahrt die offene Bezugssphäre des Dativs, ohne „seinem“ hinzuzufügen.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: Er bezeugte mit Nachdruck
  rationale: „Bezeugte“ erhält den johanneischen Zeugniswortschatz. „Mit Nachdruck“ vermittelt in natürlichem Deutsch die feierliche Bekräftigung, die durch die Verbindung mit „sagte“ ausgedrückt wird, ohne die schwerfällige Doppelung „bezeugte und sagte“.
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die Wiederholung und die charakteristische feierliche Formel Jesu bleiben unmittelbar erhalten; „Amen“ ist im modernen deutschen Bibelregister verständlich und etabliert.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte, feierliche Form entspricht dem griechischen Wortlaut und fügt sich idiomatisch in die Amen-Formel ein.
- source_word: εἷς ἐξ ὑμῶν
  choice: Einer von euch
  rationale: Dies ist die natürliche deutsche Entsprechung des partitiven Ausdrucks und bewahrt dessen persönliche Schärfe.
- source_word: παραδώσει με
  choice: wird mich verraten
  rationale: Im unmittelbaren Zusammenhang bezeichnet παραδίδωμι die treulose Auslieferung Jesu durch einen Jünger. „Verraten“ gibt diese kontextuelle Bedeutung klar wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Jesu innere Erschütterung
  choice: wurde er im Geist erschüttert
  alternative: wurde er in seinem Geist erschüttert; wurde er innerlich erschüttert
  rationale: Die Formulierung lässt Jesu wirkliche innere Erschütterung unverkürzt stehen und legt zugleich nicht fest, ob τῷ πνεύματι ausdrücklich possessiv oder als Bereichsangabe zu verstehen ist.
- issue: Bedeutung von παραδίδωμι in der Ankündigung
  choice: wird mich verraten
  alternative: wird mich ausliefern / übergeben
  rationale: „Verraten“ bringt den treulosen Charakter der Tat im Kontext zur Geltung. Die wörtlichere Übergabe- beziehungsweise Auslieferungsbedeutung bleibt als lexikalische Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung. Die traditionelle doppelte Amen-Formel und der johanneische Zeugniswortschatz bleiben erhalten.
