review_pass:
  verdict: revise
  source_fidelity: 'Die temporale Einleitung, „im Geist“, die doppelte Amen-Formel, die partitive Aussage und „wird mich verraten“ geben den griechischen Text angemessen wieder. Die Fassung „Er bezeugte mit Nachdruck“ gibt jedoch ἐμαρτύρησεν καὶ εἶπεν nicht vollständig wieder: Das ausdrücklich folgende „und sagte“ entfällt, während „mit Nachdruck“ als Zusatz hinzukommt.'
  naturalness: „Im Geist erschüttert“ ist würdiges und verständliches modernes Standarddeutsch. „Legte Zeugnis ab und sagte“ ist im Deutschen natürlich genug und bewahrt zugleich den für Johannes wichtigen Zeugniswortschatz.
  terminology: „Amen, amen“ ist als traditionelle johanneische Formel passend. „Verraten“ ist im Kontext treffend; die Fußnote wahrt mit „ausliefern“ die semantisch nähere Alternative zu παραδίδωμι. „Zeugnis ablegen“ bewahrt die johanneische Terminologie von μαρτυρέω.
  issues:
  - severity: medium
    issue: Das explizite καὶ εἶπεν ist nicht wiedergegeben.
    rationale: „Bezeugte mit Nachdruck“ ersetzt die griechische Verbindung „bezeugte und sagte“ durch eine interpretierende Intensivierung. Damit entfällt das Verb des Sagens und „mit Nachdruck“ fügt eine Nuance hinzu, die nicht eigens im Wortlaut steht.
  revised_text: 'Nachdem Jesus dies gesagt hatte, wurde er im Geist erschüttert und legte Zeugnis ab und sagte: „Amen, amen, ich sage euch: Einer von euch wird mich verraten[a].“'
