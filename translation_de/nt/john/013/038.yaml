  source_fidelity: 'Der Text gibt die griechische Aussage zuverlässig wieder: ψυχή ist im Kontext treffend als „Leben“ verstanden, ὑπὲρ ἐμοῦ als „für mich“, die doppelte Bekräftigung ἀμὴν ἀμὴν bleibt erhalten, und die starke Verneinung οὐ μή wird durch „ganz gewiss nicht“ angemessen hervorgehoben. „Bevor du mich dreimal verleugnet hast“ gibt die zeitliche Beziehung von ἕως οὗ mit dem vollendeten Verleugnen natürlich und sachgerecht wieder.'
