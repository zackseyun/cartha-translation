id: JHN.13.38
reference: John 13:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: de
  text: 'Jesus antwortete: »Dein Leben[a] willst du für mich hingeben? Amen, amen, ich sage dir: Der Hahn wird ganz gewiss nicht krähen, bevor du mich dreimal verleugnet hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »deine Seele«. Das griechische Wort ψυχή kann »Seele« oder »Leben« bedeuten; hier geht es darum, das eigene Leben hinzugeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: antwortete
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: τὴν ψυχήν σου
  choice: dein Leben
  rationale: In der Wendung mit τίθημι bezeichnet ψυχή hier das Leben, das jemand für einen anderen hingibt, nicht speziell eine vom Körper unterschiedene Seele.
- source_word: ὑπὲρ ἐμοῦ
  choice: für mich
  rationale: Die knappe deutsche Formulierung gibt den Gedanken des stellvertretenden beziehungsweise zugunsten einer Person erfolgenden Handelns natürlich wieder.
- source_word: θήσεις
  choice: willst du … hingeben
  rationale: „Das Leben hingeben“ ist die idiomatische deutsche Entsprechung und bewahrt den johanneischen Gedanken freiwilliger Selbstaufopferung. Die Formulierung als rhetorische Frage entspricht dem Futur im Kontext.
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die charakteristische doppelte Bekräftigungsformel im Johannesevangelium bleibt in ihrer wiederholten, feierlichen Form erhalten.
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: Die verstärkte griechische Verneinung wird ausdrücklich wiedergegeben, ohne altertümlich zu klingen.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: der Hahn … krähen
  rationale: „Der Hahn kräht“ ist die geläufige und genaue deutsche Wiedergabe.
- source_word: ἕως οὗ
  choice: bevor
  rationale: Nach einer verneinten Hauptaussage drückt „bevor“ die zeitliche Abfolge im Deutschen klar und natürlich aus.
- source_word: ἀρνήσῃ με
  choice: du mich … verleugnet hast
  rationale: „Verleugnen“ bezeichnet hier, dass Petrus seine Verbindung zu Jesus abstreiten wird; das Perfekt im Nebensatz stellt die vollendete Handlung vor dem Krähen heraus.
- source_word: τρίς
  choice: dreimal
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der dreifachen Wiederholung.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang mit Selbsthingabe
  choice: Leben
  alternative: Seele
  rationale: Der Zusammenhang handelt von Petrus’ Bereitschaft, für Jesus zu sterben. „Leben“ bewahrt diese konkrete Bedeutung und legt keine engere anthropologische Deutung fest.
- issue: Stärke der Vorhersage durch οὐ μή
  choice: ganz gewiss nicht
  alternative: nicht
  rationale: Die verstärkte Verneinung wird bewahrt, damit die Bestimmtheit von Jesu Ankündigung nicht abgeschwächt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Voranstellung von „Dein Leben“ bewahrt den Nachdruck der griechischen Wortstellung; „Amen, amen“ erhält die für Jesus im Johannesevangelium charakteristische Formel.
