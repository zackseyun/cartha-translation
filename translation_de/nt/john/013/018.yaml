source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: de
  text: 'Ich rede nicht von euch allen. Ich weiß, wen ich erwählt habe. Doch damit die Schrift erfüllt werde: »Wer mein Brot isst, hat seine Ferse gegen mich erhoben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat beziehungsweise Anspielung auf Psalm 41,10. Das Bild von der gegen jemanden erhobenen Ferse drückt Feindschaft und Verrat aus.
    reason: cross_reference_and_lexical_explanation
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Ich rede nicht von euch allen
  rationale: Gibt die Verneinung und περὶ („von/über“) in natürlichem, gegenwärtigem Deutsch wieder, ohne den Bezug auf die gesamte Gruppe zu verwischen.
- source_word: ἐγὼ οἶδα τίνας ἐξελεξάμην
  choice: Ich weiß, wen ich erwählt habe
  rationale: οἶδα hat trotz seiner Form präsentische Bedeutung. „Erwählt“ bewahrt das Gewicht von ἐκλέγομαι, ohne die Art dieser Erwählung theologisch festzulegen.
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: Doch die Schrift soll erfüllt werden
  rationale: „Doch“ markiert den Gegensatz; die deutsche Konstruktion mit „soll“ gibt den Zweck- beziehungsweise Erfüllungssinn von ἵνα mit dem passiven Konjunktiv knapp wieder, ohne zusätzliche Kausalität einzutragen.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Wer mein Brot isst
  rationale: Die substantivierte Partizipialform wird idiomatisch mit „Wer …“ wiedergegeben. Das Possessivpronomen wird entsprechend dem griechischen Sinn auf „Brot“ bezogen.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: hat seine Ferse gegen mich erhoben
  rationale: Bewahrt das auffällige Bild des Psalmzitats und die Vergangenheitsform, statt die Metapher durch eine reine Deutung wie „hat mich verraten“ zu ersetzen.
theological_decisions:
- issue: Verhältnis der Erwählung Jesu zum Verräter
  choice: „wen ich erwählt habe“ ohne nähere dogmatische Bestimmung
  alternative: Die Erwählung ausdrücklich als Heilserwählung oder ausschließlich als Berufung zum Apostelamt deuten
  rationale: Der Vers bezeichnet Jesu Erwählen, definiert dessen theologische Kategorie hier aber nicht. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von ἵνα bei Schrift und Verrat
  choice: „Doch die Schrift soll erfüllt werden“
  alternative: Eine zwingende Kausalaussage wie „Das geschah, weil die Schrift eintreffen musste“
  rationale: Die Formulierung wahrt die johanneische Erfüllungsaussage, ohne eine über den Wortlaut hinausgehende Erklärung von Ursache, Zwang oder Verantwortung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Fersenmetapher bleibt als Schriftzitat erhalten und wird in der Fußnote erklärt. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem Zitat.
