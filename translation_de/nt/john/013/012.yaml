  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: de
  text: 'Nachdem er ihnen nun die Füße gewaschen, seine Kleider genommen und sich wieder zu Tisch gelegt hatte[a], sagte er zu ihnen: »Versteht ihr, was ich für euch getan habe[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich wieder gesetzt hatte«; das griechische Verb bezeichnet hier das Liegen bei Tisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »was ich euch getan habe«; der griechische Dativ lässt beide Wiedergaben zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Nachdem … nun
  rationale: Die Konstruktion gibt sowohl den zeitlichen Anschluss von ὅτε als auch die fortführende Kraft von οὖν in natürlichem Deutsch wieder.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: er ihnen die Füße gewaschen
  rationale: Der Dativ mit Körperteil ist im Deutschen idiomatisch und entspricht dem griechischen »ihre Füße gewaschen« ohne Bedeutungsverlust.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: seine Kleider genommen
  rationale: »Genommen« bleibt nahe am lexikalischen Wert von ἔλαβεν; »Kleider« gibt ἱμάτια wieder, ohne das im Verb nicht ausdrücklich enthaltene Anziehen in den Text einzutragen.
- source_word: καὶ ἀνέπεσεν
  choice: und sich wieder zu Tisch gelegt hatte
  rationale: Im Kontext eines Mahls bezeichnet ἀναπίπτω das Sich-Niederlegen beziehungsweise Lagern am Tisch. Die Formulierung macht die antike Tischhaltung verständlich.
- source_word: πάλιν εἶπεν αὐτοῖς
  choice: sagte er zu ihnen
  rationale: πάλιν gehört hier natürlicherweise zum erneuten Platznehmen und ist dort mit »wieder« wiedergegeben; εἶπεν αὐτοῖς wird neutral und direkt übersetzt.
- source_word: Γινώσκετε
  choice: Versteht ihr
  rationale: Die Frage zielt nicht nur auf Kenntnis der Handlung, sondern auf das Erfassen ihrer Bedeutung.
- source_word: τί πεποίηκα ὑμῖν
  choice: was ich für euch getan habe
  rationale: Das Perfekt wird durch »getan habe« mit fortwirkender Bedeutung wiedergegeben. Der Dativ ὑμῖν wird kontextgemäß benefaktiv als »für euch« verstanden, bleibt aber grundsätzlich auch als »an euch« übersetzbar.
theological_decisions:
- issue: Tischhaltung Jesu nach der Fußwaschung
  choice: »sich wieder zu Tisch gelegt hatte«
  alternative: »sich wieder gesetzt hatte« / »wieder seinen Platz am Tisch eingenommen hatte«
  rationale: Die gewählte Formulierung bewahrt den historischen Sinn des griechischen Verbs im Mahlkontext, ohne daraus eine theologische Folgerung abzuleiten.
- issue: Bedeutung des Dativs ὑμῖν
  choice: »für euch«
  alternative: »an euch«
  rationale: Der Zusammenhang der dienenden Fußwaschung stützt die benefaktive Wiedergabe. Weil der griechische Dativ die Beziehung nicht völlig eindeutig festlegt, wird die ebenfalls mögliche Fassung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Erzählablauf nahe, wird aber durch »Nachdem … hatte« idiomatisch gegliedert. Die direkte Rede ist klar und alltagstauglich formuliert.
