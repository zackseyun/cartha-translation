    rationale: »ging dann Satan in ihn hinein« ist zwar wörtlich nachvollziehbar, klingt jedoch im modernen Standarddeutsch hölzern. »fuhr Satan in ihn« ist die übliche direkte Wiedergabe für das Eintreten einer personal gedachten geistigen Macht und fügt keine weitere Lehraussage hinzu.
  - severity: low
