id: JHN.13.27
reference: John 13:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: de
  text: 'Und nach dem Bissen[a] fuhr Satan in ihn. Da sagte Jesus zu ihm: »Was du tust, das tu schneller[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Stück Brot«. Das griechische Wort bezeichnet einen kleinen Bissen oder ein kleines Stück Speise, hier wohl das beim Essen eingetauchte Stück Brot.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, geglättet: »tu schnell«. Im Griechischen steht die Komparativform »schneller«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: Stück Brot
  rationale: Das Diminutiv bezeichnet ein kleines Stück Speise, im Zusammenhang ein eingetauchtes Stück Brot. »Stück Brot« ist konkret und in modernem Deutsch verständlicher als das isolierte »Bissen«.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: ging … in ihn hinein
  rationale: Die räumlich direkte Formulierung gibt εἰσέρχομαι mit εἰς wieder, ohne sie als bloße Beeinflussung zu erklären oder zur vollständigen Kontrolle auszuweiten.
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: »Satan« ist im Deutschen die etablierte Wiedergabe des Namens beziehungsweise Titels; der griechische Artikel wird nicht eigens wiedergegeben.
- source_word: τότε
  choice: dann
  rationale: »Dann« erhält die ausdrücklich markierte zeitliche Folge nach dem Brotstück.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Da sagte Jesus zu ihm
  rationale: »Da« verbindet die Aussage natürlich mit dem Vorangehenden. Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Ὃ ποιεῖς
  choice: Was du tust
  rationale: Die präsentische Form bleibt offen zwischen gegenwärtigem und unmittelbar bevorstehendem Handeln; »was du tun willst« wäre stärker deutend.
- source_word: ποίησον
  choice: tu
  rationale: Der knappe Imperativ entspricht der Schärfe und Kürze des griechischen Befehls.
- source_word: τάχιον
  choice: schneller
  rationale: Die Komparativform wird ausdrücklich als »schneller« wiedergegeben, statt sie zum bloßen Adverb »schnell« zu glätten.
theological_decisions:
- issue: Art von Satans Einwirkung auf Judas
  choice: Die direkte Aussage »Satan ging … in ihn hinein« bleibt ohne erklärenden Zusatz stehen.
  alternative: »Satan nahm ihn in Besitz« oder »Judas überließ sich Satan«
  rationale: Der Vers spricht von einem persönlichen Eintreten Satans, erläutert aber weder den genauen Grad der Kontrolle noch Judas’ innere Beteiligung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas auffällige Wendung »nach dem Stück Brot« bewahrt die knappe Ellipse des griechischen Textes, ohne aus dem Zusammenhang zusätzliche Handlungen einzufügen. Das Präteritum entspricht natürlichem deutschem Erzählstil.
