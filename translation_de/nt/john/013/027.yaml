  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge, Satans persönliches Eintreten, die Anrede Jesu und den Komparativ τάχιον grundsätzlich korrekt wieder. »ging … in ihn hinein« ist jedoch als Wiedergabe von εἰσῆλθεν εἰς ἐκεῖνον im Deutschen unnötig umständlich und wenig idiomatisch. Die feste, verständliche Wendung »fuhr in ihn« gibt das direkte Eintreten wieder, ohne dessen Wesen weiter auszudeuten.
  naturalness: »Nach dem Stück Brot« ist zwar als Ellipse möglich, wirkt im heutigen Deutsch aber sperrig. »Nach dem Bissen« ist in diesem Mahlkontext idiomatischer und wahrt die knappe Form des griechischen Textes. »Was du tust, das tu schneller« ist eine natürliche, nachdrückliche deutsche Entsprechung, die sowohl die Wiederaufnahme des Objekts als auch den Komparativ erhält.
  terminology: »Satan« ist die etablierte deutsche Benennung. »Bissen« kann ψωμίον angemessen bezeichnen; die Alternative »Stück Brot« soll in der Anmerkung erhalten bleiben. Die Formulierung »fuhr in ihn« erläutert weder Besitzergreifung noch das Maß einer Kontrolle und bewahrt damit die im Ausgangstext bestehende Offenheit.
