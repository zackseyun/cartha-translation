  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Was ich tue, weißt du jetzt nicht[a]; aber danach[b] wirst du es erkennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen hier und am Satzende zwei verschiedene Verben: zuerst eines für „wissen“, dann eines, das auch „erkennen“ oder „verstehen lernen“ bedeuten kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach diesen Dingen“. Gemeint sein kann das Folgende in dieser Begebenheit oder, weiter gefasst, spätere Ereignisse, die Jesu Handeln verständlich machen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Die im Griechischen übliche doppelte Redeeinleitung („antwortete und sagte zu ihm“) wird im natürlichen modernen Deutsch zu „antwortete ihm“ zusammengezogen; sowohl die Reaktion Jesu als auch der Bezug auf Petrus bleiben erhalten.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Was ich tue
  rationale: Die substantivierte Relativkonstruktion wird idiomatisch wiedergegeben. Das Präsens bezeichnet die gerade stattfindende Handlung Jesu.
- source_word: οὐκ οἶδας ἄρτι
  choice: weißt du jetzt nicht
  rationale: „wissen“ bildet die Grundbedeutung von οἶδα transparent ab; „jetzt“ bezeichnet den gegenwärtigen Zeitpunkt, ohne die Aussage durch ein zusätzliches „noch“ zu erweitern.
- source_word: γνώσῃ
  choice: wirst du es erkennen
  rationale: „erkennen“ wahrt den Wechsel zu γινώσκω und kann hier das spätere Begreifen der Bedeutung von Jesu Handlung ausdrücken.
- source_word: δὲ μετὰ ταῦτα
  choice: danach aber
  rationale: „aber“ markiert den Gegensatz zwischen gegenwärtigem Nichtwissen und späterer Erkenntnis. „danach“ ist die natürliche deutsche Wiedergabe von μετὰ ταῦτα.
theological_decisions:
- issue: Zeitlicher Bezug der späteren Erkenntnis
  choice: Das offene „danach“ wird beibehalten.
  alternative: Den Bezug ausdrücklich auf Jesu anschließende Erklärung, auf Kreuz und Auferstehung oder auf das Wirken des Geistes festlegen.
  rationale: μετὰ ταῦτα bestimmt nicht eindeutig, welche späteren Ereignisse die Erkenntnis vermitteln. Die Übersetzung lässt diese theologisch bedeutsame Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform bewahrt den johanneischen Gegensatz zwischen gegenwärtigem Nichtwissen und späterer Erkenntnis. Die griechische doppelte Redeeinleitung wurde zugunsten natürlichen Deutschen verdichtet.
