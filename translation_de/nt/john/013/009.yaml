id: JHN.13.9
reference: John 13:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: de
  text: 'Simon Petrus sagt zu ihm: „Herr[a], nicht nur meine Füße, sondern auch meine Hände und meinen Kopf!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meister“. Griechisch: kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das erzählende Präsens des Griechischen wird beibehalten; es verleiht der johanneischen Erzählung Unmittelbarkeit und ist auch im Deutschen natürlich.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Das Pronomen wird entsprechend dem griechischen Wortlaut wiedergegeben, ohne den aus dem Zusammenhang eindeutigen Bezug auf Jesus ausdrücklich einzusetzen.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Die Namen folgen der etablierten deutschen Form.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche und theologisch offene Wiedergabe der Anrede κύριε; eine mögliche respektvolle Bedeutung wird in der Fußnote genannt.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: nicht nur …, sondern auch
  rationale: Diese natürliche deutsche Konstruktion bewahrt die kontrastive Erweiterung des griechischen Ausdrucks.
- source_word: τοὺς πόδας μου
  choice: meine Füße
  rationale: Direkte Wiedergabe des Akkusativobjekts mit Possessivpronomen.
- source_word: τὰς χεῖρας
  choice: meine Hände
  rationale: Obwohl μου im Griechischen nicht wiederholt wird, gilt es sinngemäß auch für die koordinierten Körperteile; im Deutschen wird das Possessivpronomen zur Klarheit wiederholt.
- source_word: τὴν κεφαλήν
  choice: meinen Kopf
  rationale: „Kopf“ ist hier die natürliche deutsche Entsprechung; das im koordinierten Ausdruck mitgemeinte Possessivpronomen wird ausdrücklich gesetzt.
theological_decisions:
- issue: κύριος als Anrede für Jesus
  choice: Herr
  alternative: Meister
  rationale: „Herr“ bewahrt sowohl die gewöhnliche respektvolle Anrede als auch den möglichen johanneischen theologischen Nachklang, ohne diesen im unmittelbaren Zusammenhang festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens wird erhalten. Der Ausruf entspricht der nachdrücklichen, spontanen Reaktion des Petrus.
