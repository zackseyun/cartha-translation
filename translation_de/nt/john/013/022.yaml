  text: ⸀ἔβλεπον εἰς ἀλλήλους οἱ μαθηταὶ ἀπορούμενοι περὶ τίνος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: de
  text: Die Jünger blickten einander an, ratlos darüber, von wem er sprach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβλεπον
  choice: blickten
  rationale: Der Imperfekt beschreibt die fortdauernde Szene; im Deutschen kann das Präteritum diesen Verlauf natürlich wiedergeben, ohne eine schwerfällige Verlaufsform zu bilden.
- source_word: εἰς ἀλλήλους
  choice: einander an
  rationale: Zusammen mit „blickten“ gibt dies das gegenseitige Anschauen der Jünger idiomatisch und präzise wieder.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der Artikel verweist auf die aus dem Zusammenhang bekannte Gruppe; ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: ἀπορούμενοι
  choice: wussten nicht
  rationale: Das begleitende Partizip bezeichnet Ratlosigkeit oder Ungewissheit. In Verbindung mit der indirekten Frage ist „wussten nicht“ natürliches modernes Deutsch und bewahrt die Unsicherheit.
- source_word: περὶ τίνος
  choice: von wem
  rationale: Bei „sprechen“ ist „von wem“ die natürliche deutsche Entsprechung für die Person, auf die sich Jesu Aussage bezieht.
- source_word: λέγει
  choice: er sprach
  rationale: Das griechische historische Präsens wird im deutschen Erzählzusammenhang idiomatisch als Präteritum wiedergegeben; „sprach“ bleibt beim verbalen Sinn und deutet nicht zu „meinte“ um.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdiges Erzählungsdeutsch. Die fortdauernde Handlung des griechischen Imperfekts wird ohne unnatürliche deutsche Verlaufsumschreibung ausgedrückt; die Ratlosigkeit der Jünger bleibt ausdrücklich erhalten.
