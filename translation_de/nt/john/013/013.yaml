id: JHN.13.13
reference: John 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: de
  text: Ihr nennt mich »Lehrer« und »Herr«[a], und ihr sagt es mit Recht, denn ich bin es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebieter«. Das griechische Wort kyrios bezeichnet jemanden mit Autorität oder Herrschaft; hier wird es als Titel mit »Herr« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: nennt
  rationale: Mit dem doppelten Prädikatsakkusativ gibt »ihr nennt mich …« die direkte Benennung im Deutschen natürlich und präzise wieder.
- source_word: Ὁ διδάσκαλος
  choice: »Lehrer«
  rationale: »Lehrer« ist die klare moderne Wiedergabe des Titels. Die Anführungszeichen kennzeichnen die beiden von den Jüngern gebrauchten Anreden; der griechische Artikel muss in dieser deutschen Konstruktion nicht als bestimmter Artikel erscheinen.
- source_word: Ὁ κύριος
  choice: »Herr«
  rationale: »Herr« bewahrt sowohl den Autoritätsanspruch als auch das Gewicht des neutestamentlichen Titels κύριος, ohne dessen Bedeutung im Vers weiter auszudeuten.
- source_word: καλῶς λέγετε
  choice: ihr sagt es mit Recht
  rationale: Die feste deutsche Wendung gibt die bestätigende Bewertung idiomatisch wieder und hält zugleich am Verb des Sagens fest.
- source_word: εἰμὶ γάρ
  choice: denn ich bin es
  rationale: Die knappe Form wahrt Jesu nachdrückliche Selbstbestätigung. Das deutsche »es« nimmt die beiden zuvor genannten Titel auf, ohne zusätzliche Erklärung einzuführen.
theological_decisions:
- issue: κύριος als Titel Jesu
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist die etablierte und semantisch breite Wiedergabe des christologischen Titels. »Gebieter« könnte den Autoritätsaspekt ausdrücken, würde die Bedeutung aber stärker auf Herrschaft verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede »Ihr« wird beibehalten; die Titel stehen zur besseren Erkennbarkeit in deutschen Anführungszeichen.
