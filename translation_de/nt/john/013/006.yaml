  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: de
  text: 'Da kommt er zu Simon Petrus. Simon Petrus sagt zu ihm: »Herr, du wäschst mir die Füße?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens wird beibehalten und bewahrt die lebendige Erzählweise des griechischen Textes.
- source_word: οὖν
  choice: So
  rationale: Kennzeichnet hier den Fortgang der Handlung; »So« ist im modernen Deutschen natürlich und wahrt die verbindende Funktion.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: zu Simon Petrus
  rationale: πρός mit Akkusativ bezeichnet die Bewegung zu einer Person hin; »zu Simon Petrus« ist idiomatisch.
- source_word: λέγει αὐτῷ
  choice: Der sagt zu ihm
  rationale: Das historische Präsens bleibt erhalten. »Der« bezieht sich im unmittelbaren Zusammenhang auf Simon Petrus und vermeidet die im Deutschen missverständliche Folge zweier unmarkierter männlicher Pronomen.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die respektvolle Anrede als auch die mögliche christologische Bedeutung im Johannesevangelium.
- source_word: σύ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen ist im Deutschen durch die vorangestellte Form »du willst …?« deutlich hervorgehoben.
- source_word: μου
  choice: mir … die Füße
  rationale: Der griechische Genitiv wird mit der im Deutschen bei Körperteilen üblichen Dativkonstruktion natürlich wiedergegeben.
- source_word: νίπτεις
  choice: willst … waschen
  rationale: νίπτω bezeichnet das Waschen eines Körperteils. Das deutsche Präsens mit »willst« gibt in dieser Situation die erstaunte Frage nach Jesu unmittelbar bevorstehender Handlung idiomatisch wieder, ohne eine fernere Zukunft auszudrücken.
- source_word: τοὺς πόδας
  choice: die Füße
  rationale: Mit dem possessiven Dativ »mir« ist der bestimmte Artikel im Deutschen die natürliche Konstruktion.
theological_decisions:
- issue: Wiedergabe von κύριε in der Anrede Jesu
  choice: Herr
  alternative: Mein Herr / Herr (als rein höfliche Anrede)
  rationale: »Herr« lässt sowohl eine respektvolle Anrede als auch die im Johannesevangelium mitschwingende christologische Tiefe offen, ohne die Stelle eindeutig auf nur eine Funktion festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens des griechischen Erzählstils wird bewahrt. Die erstaunte Betonung des ausdrücklich gesetzten σύ wird durch die Wortstellung »du willst mir …?« vermittelt.
