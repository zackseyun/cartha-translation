review_pass:
  verdict: revise
  source_fidelity: 'Die historische Gegenwart von ἔρχεται und λέγει wird angemessen bewahrt. Die Wiedergabe von νίπτεις mit „willst ... waschen“ fügt jedoch ein nicht ausdrücklich vorhandenes Willens- bzw. Zukunftselement hinzu; das griechische Präsens fragt nach der gegenwärtig sich vollziehenden Handlung. Die Sprecherzuordnung bei λέγει αὐτῷ ergibt sich aus dem unmittelbaren Kontext: Simon Petrus spricht Jesus an.'
  naturalness: „Da kommt er zu Simon Petrus. Simon Petrus sagt zu ihm ...“ ist klares, modernes Standarddeutsch. Die Wiederholung des Namens vermeidet die künstlich klingende und potenziell unklare Formulierung „Der sagt zu ihm“. „Du wäschst mir die Füße?“ ist eine natürliche, erstaunte Frage und gibt die Emphase des vorangestellten σύ angemessen wieder.
  terminology: „Herr“ ist für κύριε passend und lässt die respektvolle Anrede wie auch den weiteren johanneischen Bedeutungsraum offen. Die deutsche Dativkonstruktion „mir die Füße“ gibt μου τοὺς πόδας idiomatisch wieder.
  issues:
  - severity: medium
    issue: „willst mir die Füße waschen“ für νίπτεις
    rationale: „Willst“ legt Absicht oder unmittelbar bevorstehende Zukunft nahe. νίπτεις ist Präsens und bezieht sich in der Szene auf das Waschen selbst; „wäschst mir die Füße?“ ist näher am Ausgangstext.
  - severity: medium
    issue: Fußnote behauptet eine textliche Referenzmehrdeutigkeit bei λέγει αὐτῷ
    rationale: Zwar ist das Subjekt von λέγει nicht ausgedrückt, doch der Kontext macht Simon Petrus als Sprecher und Jesus als Adressaten deutlich. Die Fußnote formuliert zudem ungenau, indem sie die Mehrdeutigkeit beim Pronomen verortet, obwohl αὐτῷ im Kontext auf Jesus weist. Sie sollte entfallen.
  - severity: low
    issue: „Der sagt zu ihm“
    rationale: Die Formulierung ist zwar verständlich, wirkt in modernem Standarddeutsch aber stilistisch steif und ist bei zwei männlichen Personen weniger klar als die ausdrückliche Nennung von „Simon Petrus“.
  revised_text: 'Da kommt er zu Simon Petrus. Simon Petrus sagt zu ihm: »Herr, du wäschst mir die Füße?«'
  revised_footnotes: []
