id: JHN.13.5
reference: John 13:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: de
  text: Dann goss er Wasser in eine Waschschüssel[a] und begann, den Jüngern die Füße zu waschen und sie mit dem Tuch abzutrocknen, das er sich umgebunden hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Waschbecken“. Das griechische Wort bezeichnet ein Gefäß, das zum Waschen verwendet wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „mit dem er umgürtet war“. Gemeint ist das Tuch, das er zum Dienen umgebunden hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Dann
  rationale: Kennzeichnet in der Erzählung den nächsten Handlungsschritt klar und natürlich.
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  choice: goss er Wasser in eine Waschschüssel
  rationale: βάλλω bedeutet grundsätzlich „werfen/legen“, bezeichnet bei Wasser und einem Gefäß idiomatisch jedoch das Eingießen. Das Präteritum fügt das historische Präsens natürlich in die deutsche Erzählung ein. Der bestimmte griechische Artikel bezeichnet hier nicht zwingend ein zuvor erwähntes Gefäß.
- source_word: ἤρξατο νίπτειν
  choice: begann … zu waschen
  rationale: Gibt die einsetzende Handlung und die Infinitivkonstruktion unmittelbar wieder.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: den Jüngern die Füße
  rationale: Die deutsche Dativkonstruktion ist bei Körperteilen idiomatisch und bewahrt die Beziehung zwischen den Jüngern und ihren Füßen.
- source_word: ἐκμάσσειν
  choice: abzutrocknen
  rationale: Im Zusammenhang mit den gewaschenen Füßen bezeichnet das Abwischen zugleich das Trocknen; „abzutrocknen“ ist im Deutschen die natürliche Kontextbedeutung.
- source_word: τῷ λεντίῳ
  choice: mit dem Tuch
  rationale: λέντιον bezeichnet ein zum Abwischen verwendetes Tuch; „Tuch“ ist sachlich, verständlich und vermeidet eine unnötig moderne Spezifizierung.
- source_word: ᾧ ἦν διεζωσμένος
  choice: das er sich umgebunden hatte
  rationale: Gibt verständlich wieder, dass Jesus das Tuch zur Verrichtung des Dienstes um den Körper gebunden trug.
theological_decisions:
- issue: Der Dienstcharakter des umgebundenen Tuches
  choice: das er sich umgebunden hatte
  alternative: mit dem er umgürtet war
  rationale: Die gewählte Formulierung bewahrt die konkrete Handlung, ohne mit dem heute ungebräuchlichen „umgürtet“ zusätzliche kultische oder symbolische Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum vereinheitlicht den deutschen Erzählstil trotz des griechischen historischen Präsens bei βάλλει. Die Satzstruktur erhält, dass sowohl das Waschen als auch das Abtrocknen von „begann“ abhängen.
