  source_fidelity: 'Die Übersetzung gibt den Satzbau und Sinn des griechischen Textes zuverlässig wieder: δέ wird angemessen mit „Doch“ erfasst, οὐδείς als umfassende Verneinung, ἔγνω idiomatisch-kontextuell als „verstand“, und πρὸς τί mit der zweckbezogenen Frage „wozu“. „Das“ nimmt τοῦτο korrekt wieder auf; „ihm“ bewahrt den Bezug auf αὐτῷ.'
