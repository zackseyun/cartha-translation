  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: de
  text: Doch keiner von denen, die zu Tisch lagen, verstand, wozu er ihm das sagte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warum er ihm das sagte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen verweist auf die unmittelbar vorausgehende Äußerung; im Deutschen nimmt „das“ diesen Rückbezug natürlich auf.
- source_word: δὲ
  choice: Doch
  rationale: 'δέ kennzeichnet hier einen leichten Gegensatz: Jesus sprach zu Judas, doch die anderen verstanden den Zweck seiner Worte nicht.'
- source_word: οὐδεὶς
  choice: keiner
  rationale: Gibt die vollständige Verneinung wieder und lässt sich natürlich mit dem partitiven Ausdruck „von denen“ verbinden.
- source_word: ἔγνω
  choice: verstand
  rationale: γινώσκω bezeichnet hier nicht bloß Wissen, sondern das Erfassen der Absicht hinter Jesu Äußerung.
- source_word: τῶν ἀνακειμένων
  choice: von denen, die zu Tisch lagen
  rationale: ἀνάκειμαι bezeichnet im Zusammenhang einer Mahlzeit das damals übliche Liegen bei Tisch; die Formulierung bewahrt dieses historische Szenendetail.
- source_word: πρὸς τί
  choice: wozu
  rationale: Die Wendung fragt nach Zweck oder Ziel. „Wozu“ gibt diese Nuance genauer wieder als das breitere „warum“.
- source_word: εἶπεν αὐτῷ
  choice: er ihm das sagte
  rationale: Gibt Verb und indirektes Objekt direkt wieder; „das“ nimmt im natürlichen deutschen Satzbau das vorangestellte τοῦτο auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Tisch lagen“ hält die historische Esshaltung sichtbar, ohne die Wendung unnötig zu erklären; die Fußnote bewahrt die weitere mögliche Bedeutung von πρὸς τί.
