source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: de
  text: Vor dem Passafest wusste Jesus, dass seine Stunde gekommen war, aus dieser Welt zum Vater hinüberzugehen. Er hatte die Seinen, die in der Welt sind, geliebt und liebte sie bis ans Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollkommen“ oder „in höchstem Maß“. Die griechische Wendung kann sowohl Liebe bis zum letzten Augenblick als auch Liebe in ihrer ganzen Fülle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Vor dem Passafest
  rationale: Πρό mit Genitiv bezeichnet die zeitliche Vorordnung. δέ ist hier ein milder Erzählanschluss und braucht im Deutschen kein eigenes Wort. „Passafest“ gibt sowohl ἑορτή als auch πάσχα knapp und idiomatisch wieder.
- source_word: εἰδὼς ὁ Ἰησοῦς
  choice: wusste Jesus
  rationale: Das Partizip bezeichnet Jesu gleichzeitiges, bewusstes Wissen. Eine finite Form ist im modernen Deutschen natürlicher und klarer.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: seine Stunde gekommen war
  rationale: Die johanneische Wendung „seine Stunde“ bleibt erhalten und bezeichnet den entscheidenden Zeitpunkt von Leiden, Tod, Rückkehr und Verherrlichung, ohne diese Aspekte einzeln auszudeuten.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: aus dieser Welt zum Vater hinüberzugehen
  rationale: „Hinübergehen“ bewahrt die Bewegung beziehungsweise den Übergang, den μεταβαίνω ausdrückt, und lässt den Zusammenhang von Tod und Rückkehr zum Vater offen. „Zum Vater“ erhält den johanneischen Beziehungstitel.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: die Seinen, die in der Welt waren
  rationale: „Die Seinen“ bewahrt die knappe, relationale und nicht ausdrücklich auf „Jünger“ eingeengte Bezeichnung. Der Relativsatz gibt die nähere Bestimmung wörtlich und verständlich wieder.
- source_word: ἀγαπήσας ... ἠγάπησεν αὐτούς
  choice: Er hatte ... geliebt, und er liebte sie
  rationale: Die Wiederholung von ἀγαπάω wird bewusst mit „lieben“ beibehalten. Die Aufteilung in einen zweiten deutschen Satz und die Vorvergangenheit machen das Verhältnis des Partizips zum Hauptverb verständlich, ohne einen nicht ausdrücklich genannten Grund einzuführen.
- source_word: εἰς τέλος
  choice: bis ans Ende
  rationale: Die Wendung kann zeitlich „bis ans Ende“ und qualitativ „vollkommen/in höchstem Maß“ bedeuten. Die Hauptfassung erhält die konkrete, mehrdeutige Formulierung; die weitere Bedeutungsweite wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsweite von εἰς τέλος als Höhepunkt der Liebe Jesu
  choice: bis ans Ende
  alternative: vollkommen; in höchstem Maß
  rationale: Die griechische Wendung kann sowohl das Lieben bis zum letzten Augenblick als auch Liebe in ihrer ganzen Fülle ausdrücken. Die Übersetzung entscheidet diese johanneische Spannung nicht einseitig, sondern wahrt sie durch Haupttext und Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Der lange griechische Satz wird zur besseren Lesbarkeit in zwei Sätze gegliedert; zentrale johanneische Ausdrücke wie „seine Stunde“, „die Seinen“ und „zum Vater“ bleiben erhalten.
