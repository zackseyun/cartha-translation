  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: de
  text: Jesus wusste, dass der Vater ihm alles in die Hände gegeben hatte und dass er von Gott gekommen war[a] und zu Gott ging[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott ausgegangen war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „zu Gott zurückging“; im Griechischen steht schlicht „zu Gott ging“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: wusste
  rationale: Das Partizip nennt den Wissenshintergrund für Jesu unmittelbar folgende Handlung. Ein finiter Hauptsatz ist im Deutschen natürlich und lässt den möglichen begründenden Zusammenhang im Kontext offen.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend alles; „alles“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: ἔδωκεν
  choice: gegeben hatte
  rationale: Der griechische Aorist bezeichnet hier eine gegenüber der erzählten Situation vorausliegende Übergabe; das deutsche Plusquamperfekt bildet dieses Zeitverhältnis klar ab.
- source_word: εἰς τὰς χεῖρας
  choice: in die Hände
  rationale: Die konkrete Metapher für übertragene Gewalt und Verfügungsbefugnis ist auch im Deutschen verständlich und wird daher nicht zu „in seine Macht“ verflacht.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Der bestimmte Titel des griechischen Textes wird ohne ergänztes Possessivpronomen bewahrt.
- source_word: ἀπὸ θεοῦ
  choice: von Gott
  rationale: Die Übersetzung folgt der ausdrücklichen Bezeichnung „Gott“ und ersetzt sie nicht durch „den Vater“.
- source_word: ἐξῆλθεν
  choice: gekommen war
  rationale: Im johanneischen Zusammenhang bezeichnet das Verb Herkunft beziehungsweise Ausgang und Sendung. „Gekommen war“ ist idiomatisch, während die Fußnote die formnähere Wiedergabe festhält.
- source_word: πρὸς τὸν θεὸν
  choice: zu Gott
  rationale: Die Wendung bezeichnet das Ziel der Bewegung. „Zu Gott“ gibt sie direkt wieder, ohne durch „zurück“ eine nur aus dem Kontext erschlossene Nuance ausdrücklich einzutragen.
- source_word: ὑπάγει
  choice: ging
  rationale: Das Präsens bezeichnet in diesem narrativen Zusammenhang Jesu bevorstehendes Weggehen. Das deutsche Präteritum fügt sich natürlich in die berichtete Szene ein.
theological_decisions:
- issue: Christologische Herkunftsaussage in ἀπὸ θεοῦ ἐξῆλθεν
  choice: von Gott gekommen war
  alternative: von Gott ausgegangen war
  rationale: Die Hauptfassung bringt Jesu Herkunft von Gott in natürlichem Deutsch zum Ausdruck, ohne die Aussage durch spätere dogmatische Begrifflichkeit näher festzulegen. Die formnähere Alternative bleibt in der Fußnote sichtbar.
- issue: Zielaussage in πρὸς τὸν θεὸν ὑπάγει
  choice: zu Gott ging
  alternative: zu Gott zurückging
  rationale: „Zurück“ liegt angesichts der vorausgehenden Herkunftsaussage nahe, steht aber nicht ausdrücklich in dieser griechischen Wortgruppe. Die Übersetzung bewahrt deshalb die knappe Formulierung und erläutert die kontextuelle Alternative nur in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Metapher „in die Hände gegeben“ und die johanneische Wiederholung von „Gott“ bleiben erhalten. Das abschließende Komma kennzeichnet, dass der Satz in Vers 4 weitergeführt wird.
