id: JHN.13.36
reference: John 13:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: de
  text: 'Simon Petrus sagt zu ihm: „Herr, wohin gehst du?“ Jesus antwortete: „Wohin ich gehe, dorthin kannst du mir jetzt nicht folgen[a]; später aber wirst du mir folgen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher im Blick auf das ausdrücklich gebrauchte Fähigkeitsverb: „bist du jetzt nicht imstande, mir zu folgen“.'
    reason: lexical_alternative
  - marker: b
    text: Das spätere Folgen kann auf das spätere Leiden oder Sterben des Petrus in der Nachfolge Jesu anspielen; der Wortlaut legt nicht ausdrücklich fest, wie es zu verstehen ist.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzählstils wird beibehalten und verleiht der Szene Unmittelbarkeit.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche und würdige Wiedergabe der direkten Anrede bewahrt sowohl den Respekt als auch die mögliche theologische Tragweite des Titels.
- source_word: ποῦ ὑπάγεις
  choice: wohin gehst du
  rationale: Gibt die Bewegungsrichtung von ποῦ mit ὑπάγω natürlich und ohne Festlegung des Zielortes wieder.
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das griechische Aoristverb wird im Deutschen idiomatisch mit dem erzählenden Präteritum wiedergegeben.
- source_word: Ὅπου ὑπάγω
  choice: Wohin ich gehe, dorthin
  rationale: Die Wiederholung von ὑπάγω aus der Frage bleibt erhalten; das korrelative „dorthin“ macht den deutschen Satz klar und natürlich.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: kannst du mir jetzt nicht folgen
  rationale: „kannst“ gibt das ausdrücklich verwendete Fähigkeitsverb δύναμαι wieder; „mir folgen“ entspricht dem Dativ μοι bei ἀκολουθέω.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: später aber wirst du mir folgen
  rationale: Das Futur und der Gegensatz zwischen „jetzt nicht“ und „später“ werden bewahrt. Das im zweiten Satzglied implizite Objekt wird im Deutschen zur Klarheit erneut als „mir“ ausgedrückt.
theological_decisions:
- issue: Bedeutung des späteren Folgens des Petrus
  choice: Die Aussage bleibt im Haupttext offen und benennt weder Martyrium noch Wiederherstellung oder endgültige Gemeinschaft ausdrücklich.
  alternative: Ausdrückliche Deutung als Hinweis auf den späteren Märtyrertod des Petrus.
  rationale: Der griechische Wortlaut sagt lediglich, Petrus werde später folgen. Eine nähere Bestimmung würde eine mögliche Anspielung zur alleinigen Bedeutung machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Das historische Präsens bei „sagt“ folgt dem griechischen Text; „antwortete“ wahrt dagegen die im Ausgangstext stehende Aoristform. Die Wiederaufnahme „dorthin“ dient der natürlichen deutschen Syntax.
