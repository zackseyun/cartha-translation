source:
  edition: SBLGNT
  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: de
  text: Einer seiner Jünger, den Jesus liebte, lag beim Essen unmittelbar an Jesu Seite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an Jesu Brust«; gemeint ist der Platz unmittelbar neben Jesus bei einem Mahl, bei dem man zu Tisch lag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: lag beim Essen
  rationale: Das Partizip bezeichnet hier die liegende Haltung bei einem Mahl. Die Formulierung ist für heutige Leser verständlich und macht den Mahlkontext ausdrücklich, ohne bloß das allgemeinere »saß zu Tisch« zu verwenden.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Einer von seinen Jüngern
  rationale: Dies gibt den partitiven Ausdruck im Deutschen unmittelbar und idiomatisch wieder.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: unmittelbar an Jesu Seite
  rationale: Im Kontext eines Mahls beschreibt die Wendung die Position des Jüngers, der direkt neben Jesus lag. Die idiomatische Wiedergabe vermeidet das heute missverständliche Bild »im Schoß Jesu«; der wörtliche Ausdruck wird in der Fußnote bewahrt.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: den Jesus liebte
  rationale: Die Relativkonstruktion und die gewöhnliche Bedeutung von ἀγαπάω werden knapp und direkt wiedergegeben.
theological_decisions:
- issue: Position des geliebten Jüngers im Verhältnis zu Jesus
  choice: Die Wendung wird im Haupttext als unmittelbare räumliche Nähe beim Mahl wiedergegeben.
  alternative: »im Schoß Jesu« beziehungsweise »an der Brust Jesu«
  rationale: Der Satz beschreibt zunächst die Liegeordnung beim Mahl und sollte nicht stillschweigend als Aussage über mystische Vereinigung verstanden werden. Die Fußnote erhält zugleich den wörtlichen Wortlaut und damit mögliche johanneische Resonanzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Lag beim Essen« erklärt die historisch fremde Körperhaltung knapp; »unmittelbar an Jesu Seite« vermittelt die räumliche Nähe natürlich, während die Fußnote die wörtliche Metapher dokumentiert.
