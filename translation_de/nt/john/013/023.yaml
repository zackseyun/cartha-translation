review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den partitiven Ausdruck, die Aussage von Jesu Liebe und die beim Mahl übliche Liegehaltung sachgerecht wieder. »Unmittelbar an Jesu Seite« ist als kontextuelle Wiedergabe von ἐν τῷ κόλπῳ τοῦ Ἰησοῦ vertretbar, sofern die konkretere Bildsprache in der Fußnote erhalten bleibt.
  naturalness: »Einer seiner Jünger« ist im modernen Standarddeutsch idiomatischer als »Einer von seinen Jüngern«. Die Fußnotenerklärung wird mit »bei dem man zu Tisch lag« natürlicher und präziser formuliert.
  terminology: »liebte« gibt ἠγάπα angemessen wieder. Für κόλπος ist »an Jesu Brust« im deutschen Mahlkontext treffender und weniger irreführend als »im Schoß Jesu«; es wahrt die körperlich-räumliche Bildsprache, ohne eine über das Mahlsetting hinausgehende Deutung festzulegen.
  issues:
  - severity: low
    issue: Unidiomatischer partitiver Possessivausdruck
    rationale: »Einer von seinen Jüngern« ist verständlich, aber »Einer seiner Jünger« ist die übliche moderne deutsche Formulierung.
  - severity: medium
    issue: Die Fußnote verwendet »im Schoß Jesu« als wörtliche Wiedergabe.
    rationale: κόλπος bezeichnet hier den Brust-/Busenbereich in der Liegeordnung. »Schoß« kann im heutigen Deutsch vorrangig den Schoß beziehungsweise die Knie einer sitzenden Person nahelegen. »an Jesu Brust« gibt das Bild im Kontext präziser wieder.
  - severity: low
    issue: Fußnotenerklärung stilistisch holprig
    rationale: »ein Mahl, das man liegend einnahm« ist verständlich, aber »ein Mahl, bei dem man zu Tisch lag« ist idiomatischer.
