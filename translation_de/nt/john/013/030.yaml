  variant: modern standard German
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: de
  text: Als jener[b] nun das Stück Brot[a] genommen hatte, ging er sofort hinaus. Es war Nacht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Bissen“. Das griechische Wort bezeichnet ein kleines Stück Brot oder Speise, das beim Mahl gereicht wurde.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „jener“; die griechische Form ist betonter als ein einfaches „er“ und hebt Judas hervor.
    reason: lexical_alternative
  - marker: c
    text: Die Nacht ist zunächst eine wirkliche Zeitangabe. Zugleich kann die Formulierung an das Licht-und-Finsternis-Motiv des Johannesevangeliums erinnern.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: als … genommen hatte
  rationale: Das Aoristpartizip bezeichnet hier eine der Haupthandlung vorausgehende Handlung. Die temporale Wiedergabe ist im Deutschen natürlich und bewahrt die Abfolge.
- source_word: οὖν
  choice: nun
  rationale: οὖν führt die Erzählung folgernd weiter. „Nun“ passt zum deutschen Erzählstil, ohne eine stärkere logische Folgerung zu behaupten.
- source_word: τὸ ψωμίον
  choice: das Stück Brot
  rationale: ψωμίον bezeichnet ein kleines Stück Brot beziehungsweise Speise. „Das Stück Brot“ ist konkret, verständlich und nimmt den Mahlkontext auf.
- source_word: ἐκεῖνος
  choice: jener
  rationale: Das Demonstrativpronomen ist betonter als ein schlichtes „er“ und lenkt den Blick auf Judas. „Jener“ erhält diese markierte, leicht distanzierende Ausdrucksweise, ohne den Namen in den Text einzufügen.
- source_word: ἐξῆλθεν
  choice: ging … hinaus
  rationale: Die Wiedergabe erhält die räumliche Bedeutung von ἐξέρχομαι und klingt im Deutschen natürlich.
- source_word: εὐθύς
  choice: sofort
  rationale: εὐθύς bezeichnet die Unmittelbarkeit der Handlung; „sofort“ ist präzise und gegenwärtiges Standarddeutsch.
- source_word: ἦν δὲ νύξ
  choice: Es war Nacht
  rationale: Die knappe Formulierung bewahrt sowohl die wörtliche Zeitangabe als auch deren mögliche literarische Resonanz. Das schwach weiterführende δέ muss hier im Deutschen nicht eigens durch eine Konjunktion ausgedrückt werden.
theological_decisions:
- issue: Mögliche symbolische Bedeutung der Nacht im Johannesevangelium
  choice: 'Die Aussage wird im Haupttext als schlichte Zeitangabe wiedergegeben: „Es war Nacht.“'
  alternative: Die Nacht im Haupttext ausdrücklich als geistliche Finsternis deuten.
  rationale: Die Licht-und-Finsternis-Motivik des Johannesevangeliums kann der Aussage zusätzliche Bedeutung verleihen. Der griechische Satz selbst bleibt jedoch eine knappe Zeitangabe; die Übersetzung erhält diese Offenheit.
- issue: Betonung von ἐκεῖνος mit Bezug auf Judas
  choice: Das betonte Demonstrativpronomen wird mit „jener“ erhalten.
  alternative: Natürlich glättend nur „er“ schreiben oder den Namen „Judas“ einsetzen.
  rationale: „Jener“ wahrt die auffällige und möglicherweise distanzierende Bezugnahme des Ausgangstextes. „Er“ würde sie einebnen; „Judas“ wäre eine erklärende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch. Das bewusst markierte „jener“ spiegelt die Betonung des griechischen Demonstrativpronomens; die mögliche Symbolik von „Nacht“ wird nicht in den Haupttext hineingedeutet.
