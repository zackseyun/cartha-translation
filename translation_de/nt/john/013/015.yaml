id: JHN.13.15
reference: John 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: de
  text: Denn ich habe euch ein Beispiel[a] gegeben, damit auch ihr so handelt, wie ich an euch gehandelt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Vorbild“ oder „ein Muster“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ein Beispiel
  rationale: Das Wort bezeichnet ein zur Nachahmung gegebenes Beispiel, Muster oder Vorbild. „Beispiel“ ist im modernen Deutsch natürlich und lässt offen, wie genau die Handlung nachzuahmen ist.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet beziehungsweise erläutert Jesu vorausgehende Anweisung; „Denn“ bewahrt diesen Zusammenhang knapp und würdig.
- source_word: ἔδωκα
  choice: habe … gegeben
  rationale: Der griechische Aorist bezeichnet die vollzogene Handlung. Das deutsche Perfekt ist hier natürlich und bringt zugleich deren gegenwärtige Bedeutung zum Ausdruck.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck der beispielhaften Handlung klar wieder.
- source_word: καθὼς
  choice: so … wie
  rationale: Die Korrespondenz zwischen Jesu Handeln und dem erwarteten Handeln der Jünger wird im Deutschen idiomatisch durch „so … wie“ ausgedrückt.
- source_word: ἐποίησα ὑμῖν
  choice: wie ich an euch gehandelt habe
  rationale: „An euch gehandelt“ bildet den Dativ ὑμῖν ab, ohne ausdrücklich eine nur benefaktive Deutung („für euch“) festzulegen, und passt zur unmittelbar vorausgehenden Fußwaschung.
- source_word: καὶ ὑμεῖς
  choice: auch ihr
  rationale: Die betonte Entsprechung wird im Deutschen natürlich durch „auch ihr“ wiedergegeben.
- source_word: ποιῆτε
  choice: handelt
  rationale: Der Präsenskonjunktiv nach ἵνα bezeichnet die beabsichtigte entsprechende Praxis. Im deutschen damit-Satz ist der Indikativ idiomatisch; „handelt“ vermeidet das unvollständige „tut“ und wahrt den offenen Bezug auf Jesu Tun.
theological_decisions:
- issue: Art und Umfang der Nachahmung von Jesu Handlung
  choice: Die Handlung Jesu wird als verbindliches Beispiel für entsprechendes Handeln der Jünger dargestellt, ohne die genaue Form der Nachahmung festzulegen.
  alternative: Den Vers ausdrücklich als universale rituelle Anordnung der Fußwaschung oder lediglich als allgemeines Sinnbild demütigen Dienens wiederzugeben.
  rationale: Der Text fordert eine dem Handeln Jesu entsprechende Nachahmung, entscheidet aber in diesem Satz allein nicht, ob diese ausschließlich oder notwendig als ritualisierte Fußwaschung zu vollziehen ist.
- issue: Bedeutung des Dativs ὑμῖν bei ἐποίησα
  choice: „an euch“
  alternative: „für euch“ oder „euch“
  rationale: Der Kontext macht deutlich, dass Jesus den Jüngern konkret etwas getan hat. „An euch“ wahrt diesen Bezug und vermeidet, einen benefaktiven Sinn stärker festzuschreiben, als es die Form allein verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung stellt „auch ihr“ heraus und wahrt den Zweck- und Vergleichszusammenhang des griechischen Satzes.
