  source_fidelity: 'Der Text gibt alle wesentlichen griechischen Elemente angemessen wieder: Petrus gibt dem zuvor genannten Jünger ein nonverbales Zeichen, damit dieser erfragt, wer die von Jesus gemeinte Person sei. „Wen er wohl meine“ gibt die durch τίς ἂν εἴη ausgedrückte vorsichtige Unbestimmtheit idiomatisch wieder. Die Präsensform λέγει ist im deutschen indirekten Fragesatz mit „meine“ angemessen aufgenommen.'
  naturalness: „Da gab Simon Petrus ihm ein Zeichen, er solle fragen, wen er wohl meine“ ist natürliches, modernes Standarddeutsch in einem würdigen erzählerischen Register. Das Pronomen „ihm“ ist durch den unmittelbaren Kontext ausreichend bestimmt.
  terminology: „Simon Petrus“ entspricht der etablierten deutschen Namensform. „Ein Zeichen geben“ ist für νεύει treffend, ohne die konkrete Geste unzulässig auf Nicken einzuengen. Die Fußnote bietet sinnvoll die formnähere Alternative zu „wen er meine“.
