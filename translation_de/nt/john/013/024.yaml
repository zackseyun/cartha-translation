  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: de
  text: Da gab Simon Petrus ihm ein Zeichen, er solle fragen, wen er wohl meine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über wen er spreche“.'
    reason: Die Fußnote bewahrt die formale Struktur von περὶ οὗ λέγει und macht deutlich, dass im Haupttext idiomatisch mit „meinen“ übersetzt wurde.
lexical_decisions:
- source_word: νεύει
  choice: gab … ein Zeichen
  rationale: Das Verb bezeichnet ein nonverbales Zeichen oder eine Geste. „Ein Zeichen geben“ ist im Deutschen natürlich und legt die genaue Art der Bewegung nicht unnötig fest.
- source_word: οὖν
  choice: Da
  rationale: οὖν kennzeichnet hier die Folgerung beziehungsweise den Fortgang der Erzählung. „Da“ stellt den Zusammenhang mit dem vorherigen Vers knapp und idiomatisch her.
- source_word: τούτῳ
  choice: ihm
  rationale: Das Demonstrativpronomen verweist auf den unmittelbar zuvor genannten Jünger. Das deutsche „ihm“ ist in diesem Kontext natürlicher als das markierte „diesem“.
- source_word: πυθέσθαι
  choice: er solle fragen
  rationale: 'Der Infinitiv gibt den Inhalt von Petrus’ Zeichen wieder: Der Jünger soll nachfragen. Die Konstruktion mit „solle“ macht dies im Deutschen klar und flüssig.'
- source_word: τίς ἂν εἴη
  choice: wen … wohl
  rationale: ἄν mit dem Optativ verleiht der Frage einen unbestimmten oder vorsichtigen Ton. Das Modalwort „wohl“ bewahrt diese Nuance idiomatisch.
- source_word: περὶ οὗ λέγει
  choice: wen er … meine
  rationale: Wörtlich heißt die Wendung „über wen er spricht“. Im gegebenen Zusammenhang bringt das deutsche „wen er meint“ denselben Bezug natürlich und knapp zum Ausdruck; die formalere Wiedergabe steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die indirekte Aufforderung „er solle fragen“ ist idiomatisches Standarddeutsch; „wohl“ erhält die im griechischen Optativ mit ἄν liegende Unbestimmtheit.
