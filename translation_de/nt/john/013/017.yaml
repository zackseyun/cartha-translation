  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: de
  text: Wenn ihr das alles wisst, seid ihr selig[a], wenn ihr danach handelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glücklich“ beziehungsweise „glücklich zu preisen“. Das griechische Wort bezeichnet einen begünstigten, heilvollen Zustand und nicht nur ein Glücksgefühl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: wenn
  rationale: Leitet die erste reale bzw. offene Bedingung ein und entspricht der griechischen Syntax natürlich.
- source_word: ταῦτα
  choice: das alles
  rationale: Gibt den neutralen Plural rückbezüglich und in natürlichem Deutsch wieder; gemeint sind Jesu vorausgehendes Beispiel und seine Unterweisung.
- source_word: οἴδατε
  choice: wisst
  rationale: Bewahrt die Grundbedeutung des Verbs als Wissen bzw. Kenntnis, ohne es enger als „verstehen“ auszulegen.
- source_word: μακάριοί
  choice: selig
  rationale: Bewahrt den biblischen Sinn eines von Gott begünstigten, heilvollen Zustands und reduziert die Aussage nicht auf ein momentanes Glücksgefühl.
- source_word: ἐστε
  choice: seid
  rationale: Direkte Wiedergabe der Kopula im Präsens.
- source_word: ἐὰν
  choice: wenn
  rationale: Kennzeichnet mit dem Konjunktiv eine kontingente Bedingung; „wenn“ ist dafür im Deutschen idiomatisch.
- source_word: ποιῆτε αὐτά
  choice: danach handelt
  rationale: Gibt das praktische Tun des zuvor Erkannten natürlich wieder. „Danach“ hält den Rückbezug auf ταῦτα/αὐτά aufrecht, ohne das schwerfällige „diese Dinge tut“.
theological_decisions:
- issue: Wiedergabe von μακάριοι im Zusammenhang der Nachfolge
  choice: selig
  alternative: glücklich; glücklich zu preisen
  rationale: „Selig“ erhält das biblisch-theologische Gewicht einer begünstigten und heilvollen Lage. Die Fußnote macht deutlich, dass nicht allein ein subjektives Gefühl gemeint ist.
- issue: Verhältnis von Wissen und Tun
  choice: zwei aufeinander bezogene Bedingungssätze beibehalten
  alternative: „Selig seid ihr, wenn ihr das wisst und danach handelt“
  rationale: 'Die gewählte Fassung bewahrt die griechische Spannung: Das Wissen wird vorausgesetzt, doch die Seligpreisung steht unter der weiteren Bedingung des Tuns.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das alles“ und „danach handelt“ vermeiden eine unnatürliche wörtliche Wiederholung des griechischen Neutrum Plural, ohne dessen Rückbezug oder Aussagegehalt aufzugeben.
