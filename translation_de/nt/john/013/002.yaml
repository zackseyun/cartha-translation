  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: de
  text: Und während des Abendessens[a], als der Teufel dem Judas Iskariot, dem Sohn Simons, bereits ins Herz gelegt hatte, ihn auszuliefern[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während das Abendessen stattfand“. Das Griechische besagt nicht, dass das Essen bereits beendet war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihn zu verraten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: während des Abendessens
  rationale: Der Genitivus absolutus bezeichnet einen gleichzeitig stattfindenden Umstand. Die Wiedergabe macht deutlich, dass das Essen im Gang war und nicht bereits beendet.
- source_word: διάβολος
  choice: der Teufel
  rationale: Im johanneischen Erzählzusammenhang bezeichnet der Ausdruck den persönlichen Bösen; der im Deutschen geläufige Titel gibt den Referenten klar wieder.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: bereits ins Herz gegeben hatte
  rationale: Die Formulierung bewahrt das griechische Bild vom Einbringen eines Vorhabens in das Herz und gibt die Vorzeitigkeit von βεβληκότος wieder.
- source_word: καρδίαν
  choice: Herz
  rationale: „Herz“ erhält die biblische anthropologische Metapher, die hier auch Wollen und Absicht umfasst.
- source_word: ἵνα παραδοῖ
  choice: ihn auszuliefern
  rationale: παραδίδωμι bezeichnet hier das Übergeben Jesu an seine Gegner. „Ausliefern“ wahrt diese Grundbedeutung und lässt zugleich den verräterischen Charakter im Judas-Kontext erkennen.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Judas Iskariot, dem Sohn Simons
  rationale: Die Interpunktion fasst Ἰσκαριώτου als Bezeichnung des Judas auf und Σίμωνος als Angabe seines Vaters. Damit wird vermieden, Simon als „Iskariot“ zu bezeichnen; die griechische Namensfügung bleibt jedoch textlich etwas mehrdeutig.
theological_decisions:
- issue: Handlungsmacht bei Judas’ Auslieferung Jesu
  choice: Der Teufel gibt Judas das Vorhaben ins Herz; Judas bleibt derjenige, der Jesus ausliefern soll.
  alternative: Der Teufel veranlasste Judas bereits dazu.
  rationale: Die Übersetzung bewahrt sowohl den satanischen Einfluss als auch Judas’ eigene Rolle, ohne das Verhältnis von Einfluss und Verantwortung dogmatisch aufzulösen.
- issue: Bedeutung von παραδίδωμι
  choice: ausliefern
  alternative: verraten
  rationale: „Ausliefern“ liegt näher an der Grundbedeutung des griechischen Verbs; im Zusammenhang ist die Handlung zugleich Verrat. Eine Fußnote nennt daher die kontextuell treffende Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als zeitlicher Nebensatz offen, weil Vers 2 im griechischen Text syntaktisch in den folgenden Zusammenhang führt. Die traditionelle, aber sachlich irreführende Wiedergabe „nach dem Abendessen“ wurde vermieden.
