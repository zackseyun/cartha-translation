    issue: Falscher Kasus und falsche syntaktische Zuordnung bei Judas
    rationale: 'In „als der Teufel Judas Iskariot ... bereits ins Herz gegeben hatte“ ist „Judas Iskariot“ formal Akkusativobjekt. Der griechische Ausdruck besagt dagegen, dass der Teufel Judas das Vorhaben ins Herz gelegt hatte. Der Personenname muss daher im Dativ stehen: „dem Judas Iskariot ...“.'
  - severity: medium
    issue: „ins Herz gegeben hatte“ ist nicht idiomatisch
    rationale: Die deutsche Wendung „jemandem etwas ins Herz legen“ gibt die bildhafte Absichtsvermittlung natürlich wieder und wahrt zugleich die Metapher von καρδία.
