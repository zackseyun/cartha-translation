  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: de
  text: Wenn Gott in ihm verherrlicht wurde[a], wird Gott auch ihn in sich selbst verherrlichen[b], und er wird ihn sogleich verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da Gott in ihm verherrlicht wurde.“ Das griechische Wort bedeutet wörtlich „wenn“, doch im Zusammenhang wird die Bedingung wahrscheinlich als erfüllt vorausgesetzt. In einigen Handschriften fehlt der einleitende Teilsatz.'
    reason: alternative_reading
  - marker: b
    text: „In sich selbst“ kann auch im Sinn von „bei sich“ oder „durch sich selbst“ verstanden werden; die griechische Wendung ist knapp und deutungsoffen.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: wenn
  rationale: „Wenn“ gibt die griechische Bedingungspartikel unmittelbar wieder. Im Zusammenhang wird die Bedingung wohl als erfüllt vorausgesetzt; deshalb wird „da“ als mögliche Sinnwiedergabe in der Fußnote genannt.
- source_word: ἐδοξάσθη
  choice: verherrlicht worden ist
  rationale: Das Perfektpassiv ist im Deutschen eine natürliche Wiedergabe des griechischen Aorist Passiv und bezeichnet hier die eingetretene Verherrlichung, ohne den Zeitpunkt unnötig festzulegen.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die räumlich-relationale Formulierung bewahrt die knappe johanneische Ausdrucksweise. „Durch ihn“ wäre möglich, aber stärker deutend.
- source_word: δοξάσει
  choice: wird verherrlichen
  rationale: Das Futur und die Wiederholung von δοξάζω werden beibehalten, sodass die enge Verbindung zwischen der Verherrlichung Gottes und der Verherrlichung Jesu hörbar bleibt.
- source_word: ἐν αὑτῷ
  choice: in sich selbst
  rationale: Das Reflexivpronomen bezieht sich auf Gott. Die wörtlich-nahe Form bewahrt die theologisch dichte Wendung, statt sie auf „durch sich selbst“ oder „bei sich“ festzulegen.
- source_word: εὐθύς
  choice: sogleich
  rationale: „Sogleich“ drückt die Unmittelbarkeit prägnant und in einem würdigen, zugleich verständlichen Register aus.
theological_decisions:
- issue: Bedingungscharakter von εἰ bei einer im Kontext als wirklich vorausgesetzten Verherrlichung
  choice: Die Bedingungsform „Wenn Gott …“ bleibt im Haupttext erhalten.
  alternative: „Da Gott in ihm verherrlicht worden ist“
  rationale: Der Zusammenhang legt nahe, dass die Bedingung als erfüllt gilt. Dennoch steht im Griechischen εἰ und keine ausdrückliche kausale Konjunktion. Die Übersetzung wahrt diese Spannung und nennt die kontextuelle Deutung in der Fußnote.
- issue: Bedeutung von ἐν αὑτῷ
  choice: „in sich selbst“
  alternative: „bei sich“ oder „durch sich selbst“
  rationale: Die griechische Wendung ist knapp und mehrdeutig. Die Hauptfassung bleibt formal nah und vermeidet es, Art oder Sphäre der Verherrlichung abschließend zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „verherrlichen“ und die Pronomenstruktur werden trotz ihrer Dichte bewahrt, weil sie für den johanneischen Gedankengang wesentlich sind.
