  to: 'Meine Kinder, ich bin nur noch kurze Zeit bei euch. Ihr werdet mich suchen. Und wie ich zu den Juden[a] sagte: »Wohin ich gehe, könnt ihr nicht kommen[b]«, das sage ich jetzt auch euch.'
  rationale: 'Die Revision glättet zwei deutsche Formulierungen. Sie bewahrt alle semantischen Entscheidungen des Entwurfs: die liebevolle Anrede, die kurze verbleibende Zeit, das künftige Suchen, die nicht eingeengte Bezeichnung »die Juden«, das Ziel des Fortgehens und die nicht spezifizierte Unmöglichkeit zu kommen. Beide Fußnotenmarker bleiben unmittelbar am jeweiligen Bezugswort erhalten.'
