review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzglieder, die Zukunftsform von ζητήσετέ, die temporale Einschränkung ἔτι μικρόν, den Vergleich καθὼς sowie die offene Unmöglichkeit von οὐ δύνασθε ἐλθεῖν zuverlässig wieder. »Meine Kinder« ist als idiomatische Wiedergabe der zärtlichen Anrede τεκνία vertretbar, ohne eine sachliche Aussage über das Alter der Angesprochenen zu erzeugen. Die Umstellung des ersten Satzes und eine explizitere deutsche Wiederaufnahme im Schlussglied verbessern die moderne idiomatische Form, ohne den Sinn zu verändern.
  naturalness: Die vorliegende Stellung »nur noch kurze Zeit bin ich bei euch« ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig literarisch. »Ich bin nur noch kurze Zeit bei euch« ist klarer. Im letzten Satz benötigt Deutsch für die elliptische griechische Konstruktion eine natürliche Inhaltswiederaufnahme; »Das sage ich jetzt auch euch« leistet dies besser als »so sage ich es jetzt auch euch«.
  terminology: »den Juden« entspricht τοῖς Ἰουδαίοις und sollte im Haupttext nicht zu »jüdischen Autoritäten« eingeengt werden. Die Anmerkung bewahrt die im Johannesevangelium mögliche kontextuelle Engführung. »könnt ihr nicht kommen« gibt δύνασθε angemessen als fehlende Möglichkeit wieder, ohne deren Grund theologisch festzulegen.
  issues:
  - severity: low
    issue: Wortstellung im ersten Satz
    rationale: Die Stellung des Zeitadverbials vor dem Verb ist zwar möglich, aber für modernes Standarddeutsch weniger natürlich als die reguläre Verb-Zweit-Stellung mit anschließendem Adverbial.
  - severity: low
    issue: Unklare deutsche Inhaltsaufnahme im Schlusssatz
    rationale: Das griechische λέγω kann den Inhalt aus dem vorangehenden Zitat elliptisch aufnehmen. Im Deutschen macht »Das sage ich jetzt auch euch« diesen Bezug idiomatisch deutlich; die Aussage wird dadurch nicht erweitert.
  - severity: low
    issue: Formulierung der Fußnote b
    rationale: »Wörtlicher« ist bei einer modalen Konstruktion missverständlich, und »imstande zu kommen« benötigt in dieser Form eine glattere Einbettung. Eine als Alternative gekennzeichnete Formulierung erklärt die Nuance präziser.
