source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: de
  text: 'Meine Kinder, ich bin nur noch kurze Zeit bei euch. Ihr werdet mich suchen. Und wie ich zu den Juden[a] sagte: »Wohin ich gehe, könnt ihr nicht kommen[b]«, das sage ich jetzt auch euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Johannesevangelium kann »die Juden« je nach Zusammenhang auch enger die jüdischen Autoritäten, besonders aus Judäa, bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »ihr seid nicht imstande zu kommen«; die fehlende Möglichkeit wird ausgedrückt, ohne dass ihr Grund hier näher bestimmt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Meine Kinder
  rationale: Die Anrede ist die verkleinernde, liebevolle Form von τέκνον. »Meine Kinder« vermittelt im heutigen Deutsch die familiäre Zuneigung natürlicher als das missverständliche »kleine Kinder«; das Possessivpronomen macht die in der Anrede liegende persönliche Nähe idiomatisch deutlich.
- source_word: ἔτι μικρόν
  choice: nur noch kurze Zeit
  rationale: Die Verbindung bezeichnet eine kurze verbleibende Zeitspanne. Diese Wiedergabe ist natürlich und bewahrt sowohl die Kürze als auch das Moment des »noch«.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: bin ich bei euch
  rationale: Gibt die gegenwärtige persönliche Anwesenheit schlicht und unmittelbar wieder.
- source_word: ζητήσετέ με
  choice: Ihr werdet mich suchen
  rationale: Das Futur von ζητέω wird direkt wiedergegeben; »suchen« lässt dabei die im johanneischen Sprachgebrauch mögliche inhaltliche Tiefe offen.
- source_word: τοῖς Ἰουδαίοις
  choice: zu den Juden
  rationale: Die formale Bedeutung wird beibehalten, ohne den Bezug im Haupttext interpretierend auf die jüdischen Autoritäten zu verengen.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Wohin ich gehe
  rationale: ὑπάγω bezeichnet hier das Fortgehen. »Wohin ich gehe« ist idiomatisch und wahrt die noch nicht näher erklärte Zielrichtung.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: könnt ihr nicht kommen
  rationale: Die Konstruktion mit δύνασθε wird im Deutschen natürlich durch das Modalverb »können« wiedergegeben und bewahrt die Aussage der Unfähigkeit beziehungsweise fehlenden Möglichkeit.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: so sage ich es jetzt auch euch
  rationale: »So« nimmt den Vergleich mit der früheren Aussage auf; »jetzt« entspricht ἄρτι, und »auch« macht die aus der Parallelkonstruktion hervorgehende Anwendung auf die Jünger deutlich.
theological_decisions:
- issue: Bezugsgruppe von τοῖς Ἰουδαίοις im Johannesevangelium
  choice: den Juden
  alternative: den jüdischen führenden Männern / den jüdischen Autoritäten
  rationale: Der griechische Ausdruck lautet formal »den Juden«. Obwohl er im Johannesevangelium je nach Zusammenhang eine begrenztere Gruppe, besonders Autoritäten aus Judäa, bezeichnen kann, erzwingt dieser Vers keine solche Eingrenzung. Die mögliche kontextuelle Bedeutung bleibt daher in einer Fußnote erhalten.
- issue: Art der Unmöglichkeit in οὐ δύνασθε ἐλθεῖν
  choice: könnt ihr nicht kommen
  alternative: seid ihr nicht imstande zu kommen
  rationale: Der Text nennt hier keinen ausdrücklichen Grund für die fehlende Möglichkeit. Die Übersetzung bewahrt diese Offenheit und deutet sie weder als bloßes Verbot noch als endgültige geistliche Unfähigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die liebevolle Anrede wird ohne das im Deutschen missverständliche »kleine Kinder« ausgedrückt. Der Satzbau bleibt eng am griechischen Gedankengang, wird aber zur besseren Verständlichkeit in drei Sätze gegliedert. Die Fußnotenmarker stehen jeweils direkt bei dem Ausdruck, auf den sich die Anmerkung bezieht.
