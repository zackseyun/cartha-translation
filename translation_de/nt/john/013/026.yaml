source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: de
  text: 'Jesus antwortet: „Der ist es, für den ich das Stück Brot eintauchen und dem ich es geben werde.“ Nachdem er nun das Stück Brot eingetaucht hatte, gibt er es Judas, dem Sohn Simons Iskariot.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… Judas Iskariot, dem Sohn Simons.“ Die griechische Formulierung lässt beide Zuordnungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: antwortet
  rationale: Das historische Präsens wird beibehalten und verleiht der Erzählung die im Griechischen vorhandene Unmittelbarkeit.
- source_word: Ἐκεῖνός ἐστιν
  choice: Der ist es
  rationale: Die Formulierung identifiziert eine Person und ist im modernen Deutschen nach der vorausgehenden Frage natürlich und prägnant.
- source_word: ᾧ
  choice: für den … und dem
  rationale: Im Deutschen lässt sich der Dativ nicht natürlich zugleich mit „eintauchen“ und „geben“ verbinden. Die zweigliedrige Formulierung gibt den Bezug auf dieselbe Person klar wieder.
- source_word: βάψω
  choice: werde … eintauchen
  rationale: Das Futur wird ausdrücklich wiedergegeben; gemeint ist das Eintauchen eines Brotstücks, nicht eine rituelle Waschung.
- source_word: ψωμίον
  choice: Stück Brot
  rationale: Die Wendung bezeichnet ein kleines Stück Brot beziehungsweise einen Bissen; „Stück Brot“ ist klar, gegenwärtig und nicht unnötig gehoben.
- source_word: καὶ δώσω αὐτῷ
  choice: und dem ich es geben werde
  rationale: Das Pronomen „es“ nimmt das Brotstück auf, und der Dativbezug wird im Deutschen ausdrücklich wiederholt.
- source_word: βάψας οὖν
  choice: Dann taucht er … ein
  rationale: Die koordinierte deutsche Erzählweise stellt die durch den Aoristpartizip ausgedrückte zeitliche Abfolge natürlich dar; „dann“ nimmt zugleich den folgernden Erzählanschluss von οὖν auf.
- source_word: δίδωσιν
  choice: gibt
  rationale: Das historische Präsens des griechischen Textes bleibt erhalten.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: Judas, dem Sohn von Simon Iskariot
  rationale: Die Hauptfassung folgt der unmittelbaren griechischen Genitivfolge, nach der „Iskariot“ zu Simon gehören kann; die andere syntaktisch mögliche Zuordnung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Zuordnung der Bezeichnung „Iskariot“ in Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: „Judas, dem Sohn von Simon Iskariot“
  alternative: „Judas Iskariot, dem Sohn Simons“
  rationale: Die griechische Wortfolge kann „Iskariot“ unmittelbar auf Simon beziehen, lässt aber auch die traditionelle Zuordnung zu Judas zu. Die Hauptfassung folgt der naheliegenden grammatischen Verbindung, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historischen Präsensformen werden bewahrt. Die partizipiale Konstruktion wird zur natürlichen deutschen Handlungsfolge entfaltet; die syntaktische Mehrdeutigkeit der Schlussformulierung bleibt durch die Fußnote sichtbar.
