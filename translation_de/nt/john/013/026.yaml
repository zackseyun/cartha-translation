    issue: Die Vorzeitigkeit von βάψας ist in der Hauptzeile nicht hinreichend markiert.
    rationale: βάψας ist ein Aoristpartizip und bezeichnet das Eintauchen als der anschließenden Gabe vorausgehende Handlung. „Dann taucht er … ein und gibt“ kann zwar eine Reihenfolge nahelegen, stellt aber beide Verben unnötig gleichgeordnet dar.
  - severity: low
    issue: Die Fußnote enthält nur die alternative Personenbezeichnung statt einer vollständigen alternativen Satzfortsetzung.
    rationale: Eine mit Auslassungspunkten versehene Alternative zeigt klar, dass die alternative Zuordnung von „Iskariot“ innerhalb desselben Satzes gemeint ist, und erhält den Dativ von „Judas“ korrekt.
