review_pass:
  verdict: approve
  source_fidelity: Der Text gibt Ὅτε οὖν mit „Als … nun“ angemessen wieder und bewahrt mit dem Plusquamperfekt die Abfolge von Judas’ Weggang und Jesu Rede. „Der Menschensohn“, „Gott“ und die zweimalige passive Aussage „ist … verherrlicht worden“ entsprechen dem griechischen Wortlaut und seiner Parallelität. „In ihm“ ist die naheliegende, nicht einengende Wiedergabe von ἐν αὐτῷ.
  naturalness: Der Satz ist modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „verherrlicht worden“ ist stilistisch vertretbar und bildet die bewusst parallele Struktur des Ausgangstextes ab.
  terminology: „Menschensohn“ ist die im deutschen Bibelgebrauch etablierte Wiedergabe des Titels. Die Formulierungen „verherrlicht“ und „Gott“ sind präzise und registergerecht. Die Fußnote wahrt die mögliche instrumentale Nuance von ἐν αὐτῷ, ohne den Haupttext interpretativ festzulegen.
