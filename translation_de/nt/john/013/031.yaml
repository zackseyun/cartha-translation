id: JHN.13.31
reference: John 13:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: de
  text: 'Als er nun hinausgegangen war, sagte Jesus: „Jetzt ist der Menschensohn verherrlicht worden, und Gott ist in ihm[a] verherrlicht worden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihn“. Die griechische Formulierung kann bedeuten, dass Gott in dem Menschensohn oder durch ihn verherrlicht worden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Als … nun
  rationale: Ὅτε leitet den temporalen Nebensatz ein; οὖν führt die Erzählung folgernd weiter. „Als … nun“ gibt beides in natürlichem Deutsch wieder.
- source_word: ἐξῆλθεν
  choice: er hinausgegangen war
  rationale: Der Aorist bezeichnet hier den zuvor erfolgten Weggang des Judas. Das Plusquamperfekt macht die zeitliche Abfolge zum anschließenden Reden Jesu deutlich und bewahrt mit „hinausgehen“ die räumliche Nuance.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben.
- source_word: Νῦν
  choice: Jetzt
  rationale: '„Jetzt“ bewahrt den zeitlichen und hervorhebenden Charakter des griechischen Ausdrucks: Mit dem Weggang des Judas ist der angekündigte Augenblick eingetreten.'
- source_word: ἐδοξάσθη
  choice: ist verherrlicht worden
  rationale: Das Perfekt Passiv gibt die vollzogene, für die Gegenwart bedeutsame Verherrlichung wieder, ohne sie auf Kreuzigung, Auferstehung oder Erhöhung allein festzulegen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung und ihre Anklänge insbesondere an Daniel 7.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direkte und idiomatische Wiedergabe von θεός; der griechische Artikel wird im Deutschen bei „Gott“ nicht übernommen.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Formulierung folgt der naheliegenden relationalen beziehungsweise lokalen Bedeutung von ἐν mit Dativ. Eine instrumentale Deutung als „durch ihn“ bleibt möglich und wird in der Fußnote genannt.
theological_decisions:
- issue: Umfang der Verherrlichung des Menschensohnes
  choice: Die Verherrlichung wird als bereits wirksam eingetreten ausgesagt, ohne sie im Wortlaut auf ein einzelnes Ereignis festzulegen.
  alternative: Die Aussage ausschließlich auf die Kreuzigung oder ausschließlich auf Auferstehung und Erhöhung beziehen.
  rationale: Der Vers selbst benennt das gemeinte Ereignis nicht näher. Die Übersetzung bewahrt daher die johanneische Spannung und lässt den größeren Zusammenhang von Tod, Auferstehung und Rückkehr zum Vater offen.
- issue: Bedeutung von ἐν αὐτῷ
  choice: in ihm
  alternative: durch ihn
  rationale: Die griechische Präpositionalphrase kann relational beziehungsweise lokal oder instrumental verstanden werden. Der Haupttext bleibt nahe an der Formulierung des Ausgangstextes; die instrumentale Möglichkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Gedankengang, ohne unnatürlich zu wirken; das wiederholte „verherrlicht worden“ erhält die Parallelität und theologische Offenheit des Ausgangstextes.
