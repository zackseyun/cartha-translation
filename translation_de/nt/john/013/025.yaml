  source_fidelity: 'Der Text gibt die wesentlichen Elemente des Griechischen zutreffend wieder: ἀναπεσών als Zurücklehnen im Mahlkontext, ἐκεῖνος als kontextuell klares »er«, οὕτως als »so«, die körperliche Nähe in ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ sowie die Identitätsfrage τίς ἐστιν. Das Präteritum »fragte« ist eine im deutschen erzählenden Stil vertretbare Wiedergabe des historischen Präsens λέγει; die Frage wird dabei nicht inhaltlich verändert.'
