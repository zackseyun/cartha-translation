id: JHN.13.25
reference: John 13:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: de
  text: 'Da lehnte er sich so an die Brust Jesu zurück und fragte ihn: »Herr, wer ist es?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: lehnte … zurück
  rationale: Das Partizip bezeichnet im Zusammenhang eines Mahls das Zurücklehnen beim Essen. Zusammen mit ἐπὶ τὸ στῆθος gibt es hier eine Bewegung hin zur Brust Jesu an.
- source_word: ἐκεῖνος
  choice: er
  rationale: Das Pronomen verweist auf den unmittelbar zuvor genannten Jünger. Das schlichte »er« wahrt den Bezug, ohne die im Vers selbst nicht wiederholte Bezeichnung »Jünger« einzufügen.
- source_word: οὕτως
  choice: so
  rationale: »So« nimmt knapp und natürlich auf die zuvor beschriebene Lage des Jüngers beim Mahl Bezug.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: an die Brust Jesu
  rationale: »Brust« gibt στῆθος präzise wieder; »an« passt zur gerichteten Bewegung, die durch ἐπί mit Akkusativ ausgedrückt wird.
- source_word: λέγει αὐτῷ
  choice: fragte ihn
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben. Weil die direkte Rede eine Frage ist, fasst »fragte« den Sprechakt idiomatisch, ohne seinen Inhalt zu verändern.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die ehrerbietige Anrede als auch die mögliche christologische Bedeutung im Johannesevangelium.
- source_word: τίς ἐστιν;
  choice: wer ist es?
  rationale: Die Formulierung fragt nach der Identität der von Jesus gemeinten Person und entspricht natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von κύριος als direkte Anrede Jesu
  choice: Herr
  alternative: Meister; mein Herr
  rationale: »Herr« lässt sowohl eine respektvolle Anrede als auch die weitergehende christologische Bedeutung offen und legt den Ausdruck nicht einseitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tischhaltung wird als konkrete Bewegung verständlich gemacht; das historische Präsens wird zugunsten eines flüssigen deutschen Erzählstils im Präteritum wiedergegeben.
