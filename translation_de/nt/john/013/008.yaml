id: JHN.13.8
reference: John 13:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: de
  text: 'Petrus sagte zu ihm: „Du sollst mir niemals die Füße waschen!“ Jesus antwortete ihm: „Wenn ich dich nicht wasche, hast du keinen Anteil an mir.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hast du keinen Teil mit mir“.'
    reason: „Teil“ ist eine nahe Alternative für μέρος und „mit mir“ macht die Präposition μετά ausdrücklich sichtbar.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Niemals sollst du … waschen!
  rationale: Die Verbindung aus οὐ μή mit dem Aorist Konjunktiv und εἰς τὸν αἰῶνα drückt eine nachdrückliche, auf die Zukunft gerichtete Weigerung aus. Die deutsche Formulierung gibt diesen entschiedenen Ton natürlich wieder.
- source_word: μου τοὺς πόδας
  choice: mir die Füße
  rationale: Beim Waschen von Körperteilen verwendet das Deutsche idiomatisch den Dativ der betroffenen Person mit bestimmtem Artikel; sachlich entspricht dies „meine Füße“.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Jesus antwortete ihm
  rationale: Dies gibt das gewöhnliche erzählerische Antwortverb und beide ausdrücklich genannten Personenbezüge knapp wieder.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Wenn ich dich nicht wasche
  rationale: Die Formulierung bewahrt die ausdrückliche Bedingung und lässt offen, in welchem umfassenderen Sinn Jesu Waschen zu verstehen ist.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: hast du keinen Anteil an mir
  rationale: μέρος bezeichnet hier Anteil beziehungsweise Teilhabe. „Anteil an mir“ ist im Deutschen natürlicher als „Anteil mit mir“ und bewahrt die Aussage relational, ohne sie dogmatisch enger zu bestimmen.
theological_decisions:
- issue: Bedeutung des von Jesus gewährten Waschens
  choice: Die offene Bildsprache „wenn ich dich nicht wasche“ bleibt unverändert erhalten.
  alternative: Ausdrückliche Deutung als sakramentale Reinigung, Sündenvergebung oder bloßes Vorbild demütigen Dienens.
  rationale: Der Vers erklärt die Notwendigkeit des Waschens, legt dessen theologischen Mechanismus hier aber nicht abschließend fest.
- issue: Bedeutung von μέρος μετ’ ἐμοῦ
  choice: „keinen Anteil an mir“ als Aussage über Teilhabe beziehungsweise Zugehörigkeit zu Jesus
  alternative: „keinen Teil mit mir“ oder eine eng bestimmte Aussage über Heil beziehungsweise Gemeinschaft
  rationale: Die Übersetzung wahrt die theologische Spannung und vermeidet es, eine bestimmte sakramentale oder soteriologische Auslegung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf macht die emphatische Weigerung des Petrus hörbar. Die Formulierung bleibt verständlich und bewahrt zugleich die offene theologische Tragweite des griechischen Textes.
