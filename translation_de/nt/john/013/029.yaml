source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: de
  text: 'Einige meinten nämlich, weil Judas die Geldkasse[a] hatte, Jesus sage zu ihm: »Kaufe, was wir für das Fest brauchen«, oder er solle den Armen etwas geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geldbeutel«. Das griechische Wort bezeichnet den Behälter, in dem die gemeinsamen Geldmittel aufbewahrt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: Einige
  rationale: Die unbestimmte Mehrzahl bezeichnet einige der Anwesenden; »Einige« ist knapp und natürlich.
- source_word: γὰρ
  choice: nämlich
  rationale: Die Partikel erläutert, weshalb die Anwesenden Jesu Worte missverstanden; »nämlich« bildet diese begründend-erklärende Funktion im Deutschen natürlich ab.
- source_word: ἐδόκουν
  choice: meinten
  rationale: Das Imperfekt beschreibt ihre damalige, anhaltende Annahme. »Meinten« passt idiomatisch zum folgenden indirekten Redeinhalt.
- source_word: ἐπεὶ
  choice: weil
  rationale: 'Die Konjunktion nennt den Grund für ihre Annahme: Judas hatte die gemeinsame Geldkasse bei sich.'
- source_word: γλωσσόκομον
  choice: Geldkasse
  rationale: Das Wort bezeichnet hier den Behälter für die gemeinsamen Geldmittel. »Geldkasse« ist verständlich, ohne die konkrete Form des Behälters unnötig festzulegen.
- source_word: εἶχεν
  choice: bei sich hatte
  rationale: Das einfache »hatte« bezeichnet Besitz oder Verwahrung. »Bei sich hatte« gibt diese Bedeutung im deutschen Satzzusammenhang klar wieder, ohne ausdrücklich eine Amtsfunktion hinzuzufügen.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sage zu ihm
  rationale: Der historische Präsens wird innerhalb der von ὅτι eingeleiteten indirekten Rede natürlich mit dem deutschen Konjunktiv I wiedergegeben.
- source_word: Ἀγόρασον
  choice: Kaufe
  rationale: Der Aoristimperativ enthält einen einfachen direkten Auftrag; »Kaufe« ist klar und gegenwärtiges Standarddeutsch.
- source_word: ὧν χρείαν ἔχομεν
  choice: was wir brauchen
  rationale: Diese idiomatische Form entspricht der griechischen Relativkonstruktion mit χρείαν ἔχομεν, ohne unnötige Schwerfälligkeit.
- source_word: εἰς τὴν ἑορτήν
  choice: für das Fest
  rationale: ἑορτή bezeichnet ein religiöses Fest. Der unmittelbare Kontext ist das Passafest, doch der Vers selbst wiederholt dessen Namen nicht.
- source_word: τοῖς πτωχοῖς
  choice: den Armen
  rationale: Der substantivierte Plural bezeichnet arme Menschen und bildet zusammen mit »geben« die natürliche deutsche Dativkonstruktion.
- source_word: ἵνα τι δῷ
  choice: er solle den Armen etwas geben
  rationale: ἵνα mit dem Konjunktiv bezeichnet hier die von den Jüngern vermutete Aufforderung beziehungsweise Absicht; »solle« wahrt den Charakter indirekter Rede.
theological_decisions:
- issue: Bezug von »das Fest«
  choice: Der Haupttext behält die allgemeine Bezeichnung »das Fest« bei.
  alternative: »das Passafest«
  rationale: Der Kontext identifiziert das Fest als Passa, doch εἰς τὴν ἑορτήν nennt es in diesem Vers nur »das Fest«. Die Übersetzung fügt daher keine ausdrückliche Bezeichnung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv I »sage« und der Konjunktiv II »solle« kennzeichnen die vermutete indirekte Rede. Die Satzstellung bewahrt die griechische Begründungsstruktur, bleibt aber im Deutschen gut lesbar.
