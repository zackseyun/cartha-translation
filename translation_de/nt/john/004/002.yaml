lexical_decisions:
- source_word: καίτοιγε
  choice: obwohl
  rationale: Leitet eine einräumende Klarstellung zur vorausgehenden Aussage ein und gibt die konzessive Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: Ἰησοῦς αὐτὸς
  choice: Jesus nicht selbst
  rationale: Die Stellung von „selbst“ bewahrt die Betonung, dass Jesus die Taufen nicht persönlich vollzog.
- source_word: οὐκ ἐβάπτιζεν
  choice: nicht taufte
  rationale: Das Präteritum ist in deutscher Erzählprosa natürlich. Der Imperfekt kann im Kontext einen andauernden oder wiederholten Vorgang bezeichnen; diese Nuance wird in der Fußnote erläutert.
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet „sondern“ den berichtigenden Gegensatz zwischen Jesus und seinen Jüngern präziser als „aber“.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Wie im Griechischen bleibt das Verb im zweiten Satzglied unausgesprochen und wird aus „taufte“ ergänzt.
theological_decisions:
- issue: Wer die Taufen im Wirken Jesu vollzog
  choice: Jesus taufte nicht persönlich; seine Jünger taten es.
  alternative: „Jesus taufte nicht, sondern seine Jünger.“ ohne ausdrückliche Hervorhebung des persönlichen Vollzugs
  rationale: Das emphatische αὐτός grenzt Jesu persönliches Handeln vom Handeln seiner Jünger ab, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Gedankenstrich bleibt erhalten, da der Vers syntaktisch als eingeschobene Klarstellung zum umgebenden Satz gehört.
