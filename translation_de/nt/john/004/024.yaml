  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: de
  text: Gott ist Geist,[a] und die ihn anbeten, müssen im Geist und in Wahrheit anbeten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gott ist Geist“ beschreibt Gottes Wesen; es bedeutet nicht lediglich, dass Gott ein Geistwesen unter anderen sei.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Geist und in der Wahrheit“. Der griechische Ausdruck kann spezifischer auf den Heiligen Geist bezogen werden; die Übersetzung im Haupttext bewahrt seinen weiteren Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Geist
  rationale: Das artikellose Prädikatsnomen vor ὁ θεός beschreibt qualitativ Gottes Wesen. „Gott ist Geist“ vermeidet die missverständliche Einordnung Gottes als „ein Geist“ unter anderen Geistwesen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Der Artikel kennzeichnet θεός als Subjekt; im Deutschen ist „Gott“ hier die natürliche Standardwiedergabe.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: die ihn anbeten
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein die Menschen, die Gott anbeten. Die Formulierung ist natürlich und bewahrt den allgemeinen, fortdauernden Sinn.
- source_word: ἐν πνεύματι
  choice: in Geist
  rationale: 'Die bewusst knappe Wiedergabe erhält die Mehrdeutigkeit des artikellosen Ausdrucks: Gemeint sein kann eine vom Geist beziehungsweise geistlicher Wirklichkeit bestimmte Anbetung, ohne den Bezug ausdrücklich auf den Heiligen Geist festzulegen.'
- source_word: ἀληθείᾳ
  choice: Wahrheit
  rationale: „Wahrheit“ entspricht dem johanneischen Sprachgebrauch und bewahrt sowohl den sachlichen als auch den offenbarungsbezogenen Gehalt.
- source_word: δεῖ
  choice: müssen
  rationale: „Müssen“ gibt die vom Verb ausgedrückte Notwendigkeit knapp und deutlich wieder.
- source_word: προσκυνεῖν
  choice: anbeten
  rationale: Im Zusammenhang ist „anbeten“ die natürliche Wiedergabe; die ursprüngliche körperliche Bedeutung des Niederwerfens steht hier nicht im Vordergrund.
theological_decisions:
- issue: Bedeutung von „Gott ist Geist“
  choice: Qualitative Aussage über Gottes Wesen
  alternative: „Gott ist ein Geist“
  rationale: Wortstellung und Artikellosigkeit von πνεῦμα sprechen für eine qualitative Aussage. Die Übersetzung ordnet Gott daher nicht als einzelnes Wesen einer Gattung von Geistern zu.
- issue: Bedeutung von „in Geist und Wahrheit“
  choice: Breite, nicht abschließend festgelegte Bedeutung beibehalten
  alternative: „im Heiligen Geist und in der Wahrheit“ oder „aufrichtig und wahrhaftig“
  rationale: Die artikellosen und parallel verbundenen Substantive lassen eine geistgewirkte beziehungsweise geistlich bestimmte Anbetung zu, ohne den Ausdruck eindeutig auf den Heiligen Geist oder bloße innere Aufrichtigkeit zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Formulierung „in Geist und Wahrheit“ folgt bewusst der Struktur des Griechischen und bewahrt die theologisch bedeutsame Offenheit; eine Fußnote bietet die im Deutschen geläufigere bestimmte Fassung.
