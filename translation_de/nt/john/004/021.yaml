source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: de
  text: 'Jesus sagte zu ihr: „Glaube mir[a], Frau[b]: Es kommt eine Stunde[c], in der ihr weder auf diesem Berg noch in Jerusalem den Vater anbeten werdet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrau mir.“ Das griechische Verb kann bedeuten, einer Aussage Glauben zu schenken oder der Person zu vertrauen.'
    reason: lexical_alternative
  - marker: b
    text: „Frau“ war in diesem Zusammenhang eine respektvolle Anrede, keine grobe oder herabsetzende.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Stunde kommt“. Obwohl „Stunde“ hier im Griechischen keinen Artikel hat, gebraucht Johannes das Wort häufig als Leitbegriff für einen entscheidenden Zeitpunkt in Gottes Plan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Glaube mir
  rationale: Der Imperativ mit Dativ fordert dazu auf, Jesu folgender Aussage Glauben zu schenken. „Glaube mir“ ist im Deutschen natürlich und bewahrt zugleich die Verbindung zu πιστεύω im Johannesevangelium; „Vertrau mir“ ist ebenfalls möglich, betont jedoch stärker das persönliche Vertrauen.
- source_word: γύναι
  choice: Frau
  rationale: Der Vokativ bedeutet wörtlich „Frau“ und ist in diesem Zusammenhang eine respektvolle Anrede. Die ungewohnte Wirkung im heutigen Deutschen wird in einer Fußnote erläutert, statt den Ausgangstext durch Zusätze wie „liebe Frau“ auszudeuten.
- source_word: ἔρχεται ὥρα
  choice: Es kommt eine Stunde
  rationale: „Stunde“ bewahrt den wiederkehrenden johanneischen Ausdruck für einen entscheidenden Zeitpunkt. Der unbestimmte Artikel entspricht dem artikellosen ὥρα, ohne die mögliche thematische Anspielung auf „die Stunde“ aufzulösen.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: auf diesem Berg
  rationale: Bei einem Berg ist „auf“ die natürliche deutsche Entsprechung von ἐν und bezeichnet hier den samaritanischen Kultort.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Die griechische Pluralform ist eine übliche Form des Ortsnamens; im Deutschen steht der Stadtname im Singular mit „in“.
- source_word: προσκυνήσετε
  choice: ihr ... anbeten werdet
  rationale: Die zweite Person Plural wird ausdrücklich mit „ihr“ wiedergegeben. „Anbeten“ trifft im Zusammenhang von Johannes 4 die religiöse Bedeutung von προσκυνέω besser als das engere „sich niederwerfen“.
- source_word: τῷ πατρί
  choice: den Vater
  rationale: Der Zusammenhang bezeichnet Gott als Vater. Die Großschreibung kennzeichnet im Deutschen den persönlichen Gottestitel, ohne eine zusätzliche Deutung einzuführen.
- source_word: οὔτε ... οὔτε
  choice: weder ... noch
  rationale: Die deutsche Korrelativkonstruktion bewahrt den gleichrangigen Gegensatz zwischen dem samaritanischen Berg und Jerusalem.
theological_decisions:
- issue: Ton der Anrede γύναι
  choice: Wörtlich „Frau“, ergänzt durch eine kulturelle Fußnote
  alternative: „Liebe Frau“ oder „meine Dame“
  rationale: Die Anrede ist im Kontext nicht geringschätzig. Eine erläuternde Fußnote bewahrt sowohl den Wortlaut als auch den historischen Ton, ohne eine im Griechischen nicht ausdrücklich vorhandene Zuneigungsformel hinzuzufügen.
- issue: Johanneisches Motiv der ὥρα
  choice: „eine Stunde“ beibehalten
  alternative: „eine Zeit“ oder „die Stunde“
  rationale: „Stunde“ erhält Johannes’ wiederkehrende theologische Ausdrucksweise. Der unbestimmte Artikel folgt der artikellosen Form, während die Fußnote darauf hinweist, dass dennoch ein entscheidender Zeitpunkt in Gottes Handeln gemeint sein kann.
- issue: Pluralform προσκυνήσετε
  choice: Mit „ihr“ als Plural wiedergegeben
  alternative: Verallgemeinernd „man“ oder singularisch „du“
  rationale: Der grammatische Plural weitet die Aussage über die angesprochene Frau hinaus aus, ohne die genaue Bezugsgruppe im Text ausdrücklich festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzform bleibt gut verständlich, bewahrt aber mit „Frau“ und „Stunde“ bewusst zwei markante Ausdrücke des griechischen Textes. Der Doppelpunkt nach der Anrede macht deutlich, dass der folgende Satz der Inhalt dessen ist, was die Frau glauben soll.
