source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: de
  text: Als nun die Samariter zu ihm kamen, baten sie ihn, bei ihnen zu bleiben. Und er blieb zwei Tage dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Als nun
  rationale: „Als“ gibt den zeitlichen Bezug von ὡς wieder; „nun“ bewahrt den fortführenden beziehungsweise folgernden Charakter von οὖν in natürlichem Deutsch.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: zu ihm kamen
  rationale: Die Wendung bezeichnet die Bewegung auf eine Person zu und wird im Deutschen idiomatisch mit „zu ihm kamen“ wiedergegeben.
- source_word: οἱ Σαμαρῖται
  choice: die Samariter
  rationale: Direkte und im Deutschen geläufige Bezeichnung der ethnisch-religiösen Gruppe.
- source_word: ἠρώτων
  choice: baten sie
  rationale: Im Zusammenhang mit dem folgenden Infinitiv bezeichnet ἐρωτάω eine Bitte. Das Imperfekt kann einen anhaltenden oder wiederholten Vorgang ausdrücken, doch das deutsche Präteritum gibt diesen hier natürlich wieder, ohne unnötig „immer wieder“ hineinzulesen.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: bei ihnen zu bleiben
  rationale: „Bleiben“ entspricht μένω; „bei ihnen“ gibt παρά mit Dativ als Aufenthalt in ihrer Gemeinschaft natürlich wieder.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: Und er blieb … dort
  rationale: „Blieb“ hält die Verbindung zu μεῖναι aufrecht; „dort“ bildet das ausdrücklich gesetzte ἐκεῖ ab. Ein neuer Satz ist im Deutschen klar und würdevoll.
- source_word: δύο ἡμέρας
  choice: zwei Tage
  rationale: Direkte Wiedergabe des Akkusativs der Zeitdauer.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in einem schlichten und würdevollen Erzählstil. Die Satzteilung vermeidet eine schwerfällige Häufung von Hauptsätzen. Der mögliche Verlaufscharakter des Imperfekts wird nicht ausdrücklich markiert, da „sie baten ihn“ im Deutschen kontextgerecht und ohne Überinterpretation ist.
