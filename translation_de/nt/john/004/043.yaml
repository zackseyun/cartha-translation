  text: Nach den zwei Tagen brach er von dort nach Galiläa auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Nach den zwei Tagen
  rationale: μετά mit Akkusativ bezeichnet die zeitliche Folge. Der Artikel verweist auf den zuvor erwähnten zweitägigen Aufenthalt; δέ ist ein schwacher Anschluss und muss im natürlichen Deutschen nicht eigens wiedergegeben werden.
- source_word: ἐξῆλθεν
  choice: zog er … weiter
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier das Aufbrechen vom bisherigen Ort. „zog … weiter“ ist in einer Reiseerzählung natürlich und stellt den Übergang zur nächsten Station heraus.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Das Ortsadverb bezeichnet den Ausgangspunkt, nämlich den zuvor genannten Aufenthaltsort in Samarien.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: εἰς bezeichnet die Bewegungsrichtung beziehungsweise das Ziel. Bei Ortsnamen ist „nach Galiläa“ die natürliche deutsche Entsprechung.
