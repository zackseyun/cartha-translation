source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Geh! Dein Sohn lebt.“ Der Mann glaubte[a] dem Wort, das Jesus zu ihm gesagt hatte, und machte sich auf den Weg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertraute dem Wort, das Jesus zu ihm gesagt hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύου
  choice: Geh!
  rationale: Der Imperativ fordert den Mann knapp und unmittelbar zum Aufbruch auf. „Geh!“ entspricht dem natürlichen deutschen Sprachgebrauch und bewahrt das Erzähltempo.
- source_word: ὁ υἱός σου
  choice: dein Sohn
  rationale: υἱός bezeichnet hier ausdrücklich den Sohn und nicht allgemein ein Kind.
- source_word: ζῇ
  choice: lebt
  rationale: Das Präsens bezeichnet, dass der Sohn lebt beziehungsweise am Leben ist; es ist keine bloße Zukunftsverheißung. „Lebt“ bewahrt die knappe, nachdrückliche Formulierung.
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Mit dem Dativ τῷ λόγῳ bedeutet πιστεύω hier, einer Aussage Glauben zu schenken. „Glaubte“ wahrt die johanneische Wortwahl und lässt offen, wie umfassend der Glaube des Mannes an dieser Stelle zu verstehen ist.
- source_word: ὁ ἄνθρωπος
  choice: Der Mann
  rationale: Obwohl die Person im Kontext als königlicher Beamter bezeichnet wird, steht hier ausdrücklich die allgemeinere Bezeichnung ἄνθρωπος. Diese wird nicht durch die frühere Amtsbezeichnung ersetzt.
- source_word: τῷ λόγῳ
  choice: dem Wort
  rationale: λόγος meint hier die von Jesus ausgesprochene Zusage. „Dem Wort“ erhält die konkrete Bezugnahme; der folgende Relativsatz erläutert sie.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: das Jesus zu ihm gesagt hatte
  rationale: Der Relativsatz bezieht sich auf „dem Wort“. Das deutsche Plusquamperfekt macht natürlich deutlich, dass Jesus dieses Wort zuvor gesprochen hatte, ohne den Sinn zu erweitern.
- source_word: ἐπορεύετο
  choice: machte sich auf den Weg
  rationale: Das Imperfekt beschreibt, dass der Mann nach Jesu Zusage aufbrach beziehungsweise seines Weges ging. „Machte sich auf den Weg“ gibt den erzählerischen Fortgang in gegenwärtigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von πιστεύω als Reaktion auf Jesu Zusage
  choice: glaubte
  alternative: vertraute
  rationale: Der Text sagt, dass der Mann Jesu Wort glaubte, ohne abschließend zu bestimmen, wie dieser Glaube heilsgeschichtlich oder soteriologisch einzuordnen ist. „Glaubte“ bewahrt diese Spannung; „vertraute“ ist als kontextuelle Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und kraftvoll; „dem Wort glauben“ bewahrt die Nähe zur griechischen Formulierung, während „machte sich auf den Weg“ den Erzählfluss natürlich wiedergibt.
