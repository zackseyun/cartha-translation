  text: They went out of the city and were coming to him[a].
translation:
  language: de
  text: Sie gingen aus der Stadt hinaus und kamen zu ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie gingen aus der Stadt hinaus und waren auf dem Weg zu ihm.“'
    reason: Die Imperfektform ἤρχοντο kann den noch andauernden Vorgang des Kommens beziehungsweise Unterwegsseins hervorheben.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: gingen … hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Verlassen eines abgegrenzten Ortes. „gingen … hinaus“ gibt die Bewegung aus der Stadt natürlich wieder.
- source_word: ἐκ τῆς πόλεως
  choice: aus der Stadt
  rationale: ἐκ mit dem Genitiv bezeichnet die Bewegung aus dem Inneren heraus; πόλις wird hier standardgemäß mit „Stadt“ wiedergegeben.
- source_word: ἤρχοντο
  choice: kamen
  rationale: Der Imperfekt bezeichnet ein im Verlauf befindliches Kommen. Im Deutschen kann „kamen“ diesen Vorgang im erzählerischen Zusammenhang idiomatisch ausdrücken; die Verlaufsbedeutung wird in der Fußnote ausdrücklich angeboten.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet hier die gerichtete Bewegung auf eine Person zu. „zu ihm“ ist die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Kombination „gingen … hinaus und kamen“ bewahrt die beiden Bewegungsverben des griechischen Textes; die alternative Wiedergabe macht den imperfektiven Verlauf deutlicher.
