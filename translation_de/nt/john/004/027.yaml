  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: de
  text: 'In diesem Augenblick kamen seine Jünger, und sie wunderten sich, dass er mit einer Frau sprach. Doch keiner sagte: »Was suchst du?[a]« oder: »Worüber sprichst du mit ihr?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was willst du?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, als Frage nach dem Grund des Gesprächs: »Warum sprichst du mit ihr?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: in diesem Augenblick
  rationale: Die Wendung wird hier zeitlich gebraucht und bezeichnet den Moment, in dem die Jünger während des Gesprächs eintreffen.
- source_word: ἦλθαν
  choice: kamen
  rationale: Die einfache Wiedergabe bleibt beim griechischen Verb. „Kamen zurück“ wäre im Zusammenhang verständlich, würde aber eine im Verb selbst nicht ausdrücklich enthaltene Angabe ergänzen.
- source_word: ἐθαύμαζον
  choice: sie wunderten sich
  rationale: Das Imperfekt schildert ihre anhaltende Reaktion. „Sich wundern“ ist im modernen Deutsch natürlich und gibt die überraschte Verwunderung wieder, ohne sie zu übersteigern.
- source_word: μετὰ γυναικὸς
  choice: mit einer Frau
  rationale: Das artikellose γυνή ist hier unbestimmt zu verstehen. Der Text nennt als Anlass ihrer Verwunderung lediglich das Gespräch mit einer Frau.
- source_word: ἐλάλει
  choice: sprach
  rationale: Das Imperfekt bezeichnet das noch laufende Gespräch. Die deutsche Formulierung ist natürlich und wahrt die Verbindung zum späteren λαλεῖς.
- source_word: μέντοι
  choice: doch
  rationale: Das Wort markiert den Gegensatz zwischen der Verwunderung der Jünger und ihrem Schweigen.
- source_word: Τί ζητεῖς;
  choice: Was suchst du?
  rationale: Die Wiedergabe bleibt nah an der Grundbedeutung von ζητέω und lässt offen, wonach oder was Jesus sucht. Die kontextuell mögliche Bedeutung „Was willst du?“ steht in der Fußnote.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Warum sprichst du mit ihr?
  rationale: Wörtlich steht eine Frage mit τί („was“), doch in Verbindung mit „mit ihr sprechen“ gibt „warum“ die pragmatische Bedeutung im Deutschen natürlich wieder. Die formnähere Möglichkeit wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Grund der Verwunderung über Jesu Gespräch mit einer Frau
  choice: Die Verwunderung wird genannt, ohne ihren sozialen, ethnischen oder religiösen Hintergrund im Haupttext auszudeuten.
  alternative: Im Vers ausdrücklich auf damalige Geschlechterrollen oder auf das Verhältnis zwischen Juden und Samaritern hinzuweisen.
  rationale: Der griechische Text sagt nur, dass die Jünger sich wunderten, weil Jesus mit einer Frau sprach. Eine nähere Begründung würde über den Wortlaut hinausgehen.
- issue: Sinn der unausgesprochenen ersten Frage
  choice: „Was suchst du?“ bewahrt die lexikalische Offenheit von ζητεῖς.
  alternative: „Was willst du?“ beziehungsweise „Was willst du von ihr?“
  rationale: Ein nicht genanntes Objekt darf nicht stillschweigend ergänzt werden. Die idiomatische Deutung als Frage nach Jesu Absicht bleibt durch die Fußnote zugänglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem erzählerischen Ablauf des Griechischen, ohne unnötig altertümliche Wörter zu verwenden. Die beiden Fragen bleiben als unausgesprochene direkte Rede erhalten; echte Bedeutungsnuancen werden in Fußnoten ausgewiesen.
