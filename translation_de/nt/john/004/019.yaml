  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: de
  text: 'Die Frau sagte zu ihm: „Herr[a], ich sehe, dass du ein Prophet bist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische κύριε kann hier auch eine höfliche Anrede sein und muss noch nicht den Titel „Herr“ im religiösen Sinn ausdrücken.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im modernen deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten der Rede.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: Gemeint ist im Kontext die samaritanische Frau; „Frau“ ist die sachlich und idiomatisch passende Wiedergabe.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt die übliche Wiedergabe von κύριε und lässt zugleich eine ehrerbietige Anrede erkennen; die kontextuell mögliche Bedeutung „mein Herr“ wird in der Fußnote genannt.
- source_word: θεωρῶ
  choice: ich sehe
  rationale: Hier bezeichnet das Verb eine aus Jesu Wissen gewonnene Einsicht; „ich sehe“ ist natürlich und erhält die wahrnehmende Nuance.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was die Frau erkennt.
- source_word: προφήτης
  choice: ein Prophet
  rationale: Das artikellose Prädikatsnomen bezeichnet Jesus hier als einen Propheten, ohne ihn ausdrücklich mit „dem Propheten“ gleichzusetzen.
- source_word: σύ
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen hebt im Griechischen die angesprochene Person hervor; die deutsche Wortstellung „dass du … bist“ gibt dies hinreichend natürlich wieder.
theological_decisions:
- issue: Anrede κύριε an Jesus
  choice: Herr
  alternative: mein Herr
  rationale: Im unmittelbaren Zusammenhang kann κύριε eine respektvolle Anrede sein, ohne bereits ein volles christologisches Bekenntnis auszudrücken. „Herr“ erhält die traditionelle und lexikalisch zentrale Wiedergabe; die höfliche Lesart wird in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das narrative Präsens wird idiomatisch als Präteritum wiedergegeben; die Mehrdeutigkeit der Anrede bleibt durch die Fußnote erhalten.
