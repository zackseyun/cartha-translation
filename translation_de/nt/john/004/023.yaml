id: JHN.4.23
reference: John 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: de
  text: Doch es kommt eine Stunde, und sie ist jetzt da, in der die wahren Anbeter den Vater in Geist und Wahrheit[a] anbeten werden; denn der Vater sucht solche, die ihn anbeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Geist“. Das Griechische kann Anbetung bezeichnen, die durch den Heiligen Geist gewirkt wird, im menschlichen Geist geschieht oder von geistlicher Wirklichkeit geprägt ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert knapp und natürlich den Gegensatz zur vorausgehenden Erörterung ortsgebundener Anbetung.
- source_word: ἔρχεται ὥρα
  choice: es kommt eine Stunde
  rationale: Bewahrt das johanneische Stundenmotiv und gibt das artikellose ὥρα angemessen wieder.
- source_word: καὶ νῦν ἐστιν
  choice: und sie ist jetzt da
  rationale: Drückt in natürlichem Deutsch aus, dass die angekündigte Stunde bereits gegenwärtig ist.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: die wahren Anbeter
  rationale: Bewahrt den johanneischen Sinn von echt, wirklich beziehungsweise der göttlichen Wirklichkeit entsprechend.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: werden den Vater … anbeten
  rationale: Gibt den Futur und den religiösen Sinn von προσκυνέω klar und idiomatisch wieder.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: in Geist und Wahrheit
  rationale: Bewahrt beide Substantive und lässt die mögliche Beziehung von πνεῦμα zum menschlichen Geist, zum Heiligen Geist oder zur geistlichen Wirklichkeit offen.
- source_word: καὶ γὰρ
  choice: denn
  rationale: Gibt die begründende Funktion sicher wieder; die zusätzliche Hervorhebung von καί wird im Deutschen nicht eigens ausgedrückt, um einen schwerfälligen Satz zu vermeiden.
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: der Vater sucht solche, die ihn anbeten
  rationale: Gibt den substantivierten Bezug von τοιούτους und das erläuternde Partizip natürlich wieder, ohne eine zusätzliche Personengruppe einzuführen.
theological_decisions:
- issue: Bedeutung von ἐν πνεύματι
  choice: in Geist
  alternative: im Geist; geistlich
  rationale: Der griechische Ausdruck steht ohne Artikel und lässt mehrere theologisch bedeutsame Deutungen zu. Der Haupttext entscheidet nicht ausdrücklich zwischen menschlichem Geist, Heiligem Geist und geistlicher Wirklichkeit.
- issue: Bedeutung von ἀληθινοὶ προσκυνηταί
  choice: die wahren Anbeter
  alternative: die echten Anbeter; die wirklichen Anbeter
  rationale: Die Formulierung wahrt den qualitativen Gegensatz, ohne eine konfessionelle oder sektiererische Abgrenzung einzutragen.
- issue: Gegenwarts- und Zukunftsspannung der Stunde
  choice: es kommt eine Stunde, und sie ist jetzt da
  alternative: die Stunde kommt und ist schon jetzt
  rationale: Die paradoxe Spannung zwischen kommender und bereits gegenwärtiger Stunde wird bewusst erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das johanneische Motiv der „Stunde“ sowie die Spannung zwischen Zukunft und Gegenwart bleiben erhalten. Die Formulierung „in Geist und Wahrheit“ ist bewusst knapp und theologisch offen; die Fußnote erläutert die echte Mehrdeutigkeit.
