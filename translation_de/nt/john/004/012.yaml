source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: de
  text: Bist du etwa größer als unser Vater Jakob[a], der uns den Brunnen gab und selbst daraus trank – ebenso wie seine Söhne und sein Vieh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ausführlicher: „Du bist doch nicht größer als unser Vater Jakob, oder?“ Die griechische Frage mit μή erwartet eine verneinende Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Bist du etwa
  rationale: Die mit μή eingeleitete Frage erwartet eine verneinende Antwort. Das deutsche „etwa“ bringt diese Erwartung idiomatisch zum Ausdruck; die betonte Anrede σὺ wird durch „du“ bewahrt.
- source_word: μείζων
  choice: größer als
  rationale: Der Komparativ bezeichnet hier Rang oder Bedeutung, nicht körperliche Größe. „Größer als“ ist im Deutschen natürlich und lässt den genauen Umfang des Vergleichs offen.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: unser Vater Jakob
  rationale: Die Formulierung bewahrt die ehrende Sprache der Abstammung und den Bezug auf das gemeinsame samaritanische Erbe.
- source_word: ἔδωκεν ἡμῖν
  choice: der uns den Brunnen gab
  rationale: Der Aorist wird als abgeschlossene Handlung in der Vergangenheit wiedergegeben. Die deutsche Wortstellung ist knapp und natürlich.
- source_word: τὸ φρέαρ
  choice: den Brunnen
  rationale: φρέαρ bezeichnet hier einen Brunnen beziehungsweise Brunnenschacht. „Brunnen“ passt zum Kontext und vermeidet die mit πηγή eher verbundene Bedeutung „Quelle“.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: und selbst daraus trank
  rationale: „selbst“ erhält die Hervorhebung durch αὐτός; „daraus“ gibt den Rückbezug auf den Brunnen idiomatisch wieder.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: seine Söhne
  rationale: υἱοί bezeichnet hier ausdrücklich Jakobs Söhne; die geschlechtsspezifische Aussage bleibt erhalten.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: sein Vieh
  rationale: θρέμματα meint gehaltene beziehungsweise domestizierte Tiere. „Vieh“ ist eine verständliche, umfassende deutsche Entsprechung, ohne die Tiere auf Rinder zu beschränken.
theological_decisions:
- issue: Aussagekraft der mit μή eingeleiteten rhetorischen Frage
  choice: Rhetorische Frage mit „etwa“, die eine verneinende Antwort erwarten lässt
  alternative: „Du bist doch nicht größer als unser Vater Jakob, oder?“
  rationale: Die Übersetzung lässt die Herausforderung der Frau als Frage stehen und macht zugleich die im Griechischen erkennbare Erwartung einer negativen Antwort hörbar, ohne die Antwort selbst auszusprechen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bist du etwa …?“ klingt natürlich und gibt den herausfordernden rhetorischen Ton wieder. Der Gedankenstrich gliedert die Aufzählung, ohne ihren syntaktischen Zusammenhang zu verändern.
