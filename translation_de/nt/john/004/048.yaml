id: JHN.4.48
reference: John 4:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: de
  text: 'Darauf sagte Jesus zu ihm[a]: »Wenn ihr nicht Zeichen und Wunder seht, werdet ihr ganz gewiss nicht glauben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verben »seht« und »glauben« stehen im Griechischen in der Mehrzahl. Jesu Worte richten sich daher über den einzelnen Mann hinaus wahrscheinlich an einen größeren Kreis.
    reason: Die grammatische Numerusverschiebung vom einzelnen Gesprächspartner zur pluralischen Anrede ist für Reichweite und Verständnis der Aussage bedeutsam.
lexical_decisions:
- source_word: οὖν
  choice: Darauf
  rationale: Kennzeichnet die erzählerische und folgernde Fortsetzung des vorausgehenden Gesprächs, ohne übermäßig formell zu wirken.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Gibt die übliche Konstruktion zur Einführung direkter Rede schlicht und natürlich wieder.
- source_word: Ἐὰν μὴ
  choice: Wenn ihr nicht
  rationale: Gibt die negative Bedingung idiomatisch wieder; zusammen mit dem Hauptsatz entspricht dies dem Sinn von »es sei denn«.
- source_word: σημεῖα
  choice: Zeichen
  rationale: Bewahrt den für das Johannesevangelium bedeutsamen Ausdruck, bei dem die außergewöhnliche Tat über sich hinausweist.
- source_word: τέρατα
  choice: Wunder
  rationale: Gibt den zweiten Begriff der festen Wortverbindung »Zeichen und Wunder« verständlich und würdevoll wieder.
- source_word: ἴδητε
  choice: ihr … seht
  rationale: Die zweite Person Plural des griechischen Verbs wird im Deutschen ausdrücklich sichtbar gemacht; der Aorist Konjunktiv steht in einem Bedingungssatz und wird natürlich mit dem Präsens wiedergegeben.
- source_word: οὐ μὴ πιστεύσητε
  choice: werdet ihr ganz gewiss nicht glauben
  rationale: »Ganz gewiss nicht« bewahrt die nachdrückliche Verneinung von οὐ μή, ohne sie als absolutes »niemals« zu überzeichnen.
- source_word: πιστεύσητε
  choice: glauben
  rationale: »Glauben« ist die natürliche und im Johannesevangelium angemessene Wiedergabe von πιστεύω und lässt dessen mögliche Vertrauensdimension bestehen.
theological_decisions:
- issue: Zahl und Reichweite der Angesprochenen
  choice: Die Redeeinleitung bleibt singular (»zu ihm«), während Jesu Worte mit »ihr« ausdrücklich im Plural stehen.
  alternative: Die Aussage ausschließlich auf den königlichen Beamten beziehen oder den Adressatenkreis interpretierend als »ihr Leute« benennen.
  rationale: Der Erzählrahmen nennt einen einzelnen Gesprächspartner, doch ἴδητε und πιστεύσητε stehen im Plural. Die Übersetzung wahrt diese Spannung, ohne festzulegen, welche größere Gruppe Jesus genau einschließt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede »ihr« macht den griechischen Plural sichtbar; »Zeichen und Wunder« bewahrt die johanneische Begrifflichkeit und die traditionelle Wortverbindung.
