  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: de
  text: 'Viele Samariter aus jener Stadt glaubten an ihn aufgrund der Aussage der Frau, die bezeugte: „Er hat mir alles gesagt, was ich getan habe.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: aus jener Stadt
  rationale: ἐκ bezeichnet die Herkunft; πόλις wird im Deutschen natürlich mit „Stadt“ wiedergegeben. Das schwache δέ muss hier nicht eigens ausgedrückt werden, da der deutsche Satz den Erzählzusammenhang auch ohne ein einleitendes „Und“ klar fortführt.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: Viele Samariter
  rationale: Die partitive Konstruktion bedeutet „viele aus der Gruppe der Samariter“. „Viele Samariter“ gibt dies im Deutschen knapp und idiomatisch wieder.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: glaubten an ihn
  rationale: πιστεύω mit εἰς bezeichnet hier auf Jesus gerichteten Glauben beziehungsweise Vertrauen. „An ihn glauben“ bewahrt diese persönliche Ausrichtung ohne interpretierende Erweiterung.
- source_word: διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης
  choice: weil die Frau bezeugte
  rationale: διά mit Akkusativ gibt den Grund an. λόγος bezeichnet hier den Inhalt der Aussage, während das präsentische Partizip μαρτυρούσης ihr Zeugnisgeben beschreibt. Die deutsche Nebensatzform bündelt beides natürlich und erhält den Zeugnischarakter.
- source_word: Εἶπέν μοι
  choice: Er hat mir ... gesagt
  rationale: λέγω mit Dativ kann idiomatisch als „jemandem etwas sagen“ wiedergegeben werden. Das Perfekt ist im gegenwärtigen Rückblick der Frau natürlich.
- source_word: πάντα ἃ ἐποίησα
  choice: alles, was ich getan habe
  rationale: 'πάντα ἃ ist umfassend: „alles, was“. Der griechische Aorist legt nicht zwingend ein deutsches Präteritum fest; im berichteten Gespräch klingt das Perfekt „getan habe“ natürlich und bewahrt den Rückblick auf ihr bisheriges Handeln.'
theological_decisions:
- issue: Bedeutung von πιστεύω εἰς im johanneischen Sprachgebrauch
  choice: glaubten an ihn
  alternative: vertrauten ihm / setzten ihr Vertrauen auf ihn
  rationale: Die Formulierung bezeichnet auf Jesus gerichteten Glauben, ohne dessen späteren Verlauf oder eine weitergehende dogmatische Kategorie festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kompakte Formulierung vermeidet das im Deutschen schwerfällige „wegen des Wortes der Frau, die bezeugte“, ohne den kausalen Zusammenhang oder ihre Rolle als Zeugin zu verlieren.
