  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: de
  text: 'Eine Frau aus Samaria kam, um Wasser zu schöpfen. Jesus sagte zu ihr[a]: »Gib mir zu trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »kommt … sagt«; im Griechischen stehen hier erzählende Präsensformen (historisches Präsens).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: kam
  rationale: Das Präsens ist hier ein historisches Präsens innerhalb der Erzählung. Das deutsche Präteritum gibt den Erzählverlauf natürlich wieder.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Im Kontext bezeichnet das Wort eine zunächst nicht näher bestimmte weibliche Person, nicht ausdrücklich eine Ehefrau.
- source_word: ἐκ τῆς Σαμαρείας
  choice: aus Samaria
  rationale: Die Formulierung bewahrt die Herkunftsangabe des griechischen Textes, ohne sie schon in die Bezeichnung »Samariterin« umzudeuten.
- source_word: ἀντλῆσαι ὕδωρ
  choice: um Wasser zu schöpfen
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens; »Wasser schöpfen« ist im Zusammenhang mit einem Brunnen präzise und idiomatisch.
- source_word: λέγει αὐτῇ
  choice: sagte zu ihr
  rationale: Auch λέγει ist ein historisches Präsens. Das Präteritum entspricht einer natürlichen modernen deutschen Erzählweise.
- source_word: Δός μοι πεῖν
  choice: Gib mir zu trinken
  rationale: Die knappe deutsche Bitte entspricht der Konstruktion aus Imperativ und Infinitiv und bewahrt ihren direkten Wortlaut besser als die nominale Wiedergabe »Gib mir etwas zu trinken«.
theological_decisions:
- issue: Bedeutung von »Samaria«
  choice: Die Frau wird als aus Samaria kommend beschrieben.
  alternative: »eine Samariterin« oder »aus der Stadt Samaria«
  rationale: Der Vers formuliert wörtlich eine Herkunft aus Samaria. Die Übersetzung vermeidet es, die ethnische beziehungsweise religiöse Einordnung aus dem weiteren Zusammenhang bereits ausdrücklich in diesen Vers einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Präteritum ist im deutschen schriftlichen Erzählen natürlicher; die Fußnote macht die griechischen historischen Präsensformen sichtbar.
