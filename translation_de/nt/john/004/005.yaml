  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: de
  text: So kam er in eine Stadt Samariens namens Sychar[a], nahe bei dem Landstück[b], das Jakob seinem Sohn Josef gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Ort Samariens“. Das griechische Wort πόλις kann je nach Zusammenhang eine Stadt oder einen Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Grundstück“ oder „Feld“. Das griechische Wort χωρίον kann ein Grundstück, ein Stück Land oder ein Feld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: kam er
  rationale: Das griechische Präsens ist hier als historisches Präsens in einer Erzählung gebraucht; das deutsche Präteritum gibt den Erzählverlauf natürlich wieder.
- source_word: οὖν
  choice: So
  rationale: Die Partikel führt den vorausgehenden Zusammenhang als Folgerung beziehungsweise als nächsten Erzählschritt fort, ohne die Verbindung übermäßig stark auszudeuten.
- source_word: πόλιν
  choice: Stadt
  rationale: πόλις kann eine Stadt oder einen kleineren Ort bezeichnen. „Stadt“ ist die formnahe Standardentsprechung; die mögliche Bedeutung „Ort“ wird in einer Fußnote bewahrt.
- source_word: τῆς Σαμαρείας
  choice: Samariens
  rationale: Der Genitiv wird unmittelbar als Zugehörigkeit beziehungsweise regionale Lage wiedergegeben.
- source_word: λεγομένην Συχὰρ
  choice: namens Sychar
  rationale: Dies gibt die identifizierende Partizipialkonstruktion knapp und idiomatisch wieder.
- source_word: πλησίον
  choice: nahe bei
  rationale: Die räumliche Nähe wird in natürlichem modernem Deutsch ausgedrückt.
- source_word: χωρίου
  choice: Grundstück
  rationale: χωρίον bezeichnet hier ein begrenztes Stück Land beziehungsweise Landbesitz. „Grundstück“ ist prägnant, ohne das Land ausdrücklich als bebautes Feld festzulegen.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: das Jakob … gegeben hatte
  rationale: Das Plusquamperfekt kennzeichnet die Gabe als bereits vor dem erzählten Geschehen erfolgt.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: seinem Sohn Josef
  rationale: Die Dativgruppe nennt Josef als Empfänger und identifiziert ihn zugleich als Jakobs Sohn; die deutsche Wortstellung ist natürlich und eindeutig.
