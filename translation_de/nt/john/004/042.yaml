id: JHN.4.42
reference: John 4:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: de
  text: 'Und sie sagten zu der Frau: „Wir glauben nicht mehr wegen dessen, was du gesagt hast[a]; denn wir haben selbst gehört und wissen: Dieser ist wirklich der Retter der Welt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wegen deiner Rede“. Gemeint ist das mündliche Zeugnis der Frau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Und sie sagten zu der Frau
  rationale: Der Dativ bezeichnet die Adressatin; τε hat hier eine schwache verbindende Funktion. Das Imperfekt kann einen andauernden oder wiederholten Vorgang ausdrücken, doch in natürlichem Deutsch gibt „sie sagten“ die einleitende Redeform angemessen wieder.
- source_word: Οὐκέτι
  choice: nicht mehr
  rationale: Gibt die zeitliche Verneinung und das Ende der bisherigen Glaubensgrundlage direkt wieder.
- source_word: διὰ τὴν σὴν λαλιὰν
  choice: wegen dessen, was du gesagt hast
  rationale: διά mit Akkusativ bezeichnet hier den Grund. λαλιά meint die mündliche Äußerung beziehungsweise das Gesagte; die gewählte Formulierung ist im heutigen Deutsch natürlicher als „wegen deiner Rede“.
- source_word: πιστεύομεν
  choice: wir glauben
  rationale: Das Präsens bezeichnet ihren gegenwärtigen Glauben.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: denn wir haben selbst gehört
  rationale: Das intensive αὐτοί betont die eigene unmittelbare Erfahrung; das Perfekt ἀκηκόαμεν wird passend mit dem deutschen Perfekt wiedergegeben.
- source_word: καὶ οἴδαμεν
  choice: und wissen
  rationale: 'οἶδα ist formal perfektisch, hat aber präsentische, stative Bedeutung: „wissen“.'
- source_word: οὗτός
  choice: Dieser
  rationale: Das Demonstrativpronomen hebt Jesus stärker hervor als ein schlichtes „er“ und bleibt im feierlichen Bekenntnis idiomatisch.
- source_word: ἀληθῶς
  choice: wirklich
  rationale: Das Adverb bekräftigt die Wahrheit des Bekenntnisses; „wirklich“ ist natürliches modernes Deutsch mit angemessenem Nachdruck.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: der Retter der Welt
  rationale: „Retter“ gibt σωτήρ verständlich und würdig wieder. „Der Welt“ bewahrt die breite Aussage von κόσμος, ohne sie durch Zusätze einzuengen oder auszuweiten.
theological_decisions:
- issue: Reichweite des samaritanischen Bekenntnisses
  choice: der Retter der Welt
  alternative: der Retter aller Menschen; der Retter der Erwählten aus der Welt
  rationale: Die Übersetzung bewahrt die umfassende Formulierung des Textes und fügt weder eine dogmatische Einschränkung noch eine erklärende Ausweitung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede ist flüssig formuliert; „Dieser“ bewahrt den Nachdruck des griechischen Demonstrativpronomens. Der einzige Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
