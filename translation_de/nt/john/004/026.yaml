  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: de
  text: 'Jesus sagt zu ihr: „Ich bin es, der zu dir spricht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens wird im Deutschen natürlich und lebendig als Präsens wiedergegeben; es entspricht der griechischen Form.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der Dativ bezeichnet die Adressatin und wird idiomatisch mit „zu ihr“ wiedergegeben.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im Deutschen verlangt die identifizierende Aussage hier idiomatisch „Ich bin es“. Das „es“ greift aus dem Zusammenhang die zuvor genannte Messiaserwartung auf, ohne „der Messias“ ausdrücklich in den Haupttext einzufügen. Eine Fußnote dokumentiert den formal näheren Wortlaut „Ich bin“.
- source_word: ὁ λαλῶν σοι
  choice: der mit dir spricht
  rationale: Der substantivierte Präsenspartizip wird als Relativsatz wiedergegeben. „Mit dir“ ist in diesem Gesprächszusammenhang natürlich; das Präsens bewahrt die Gleichzeitigkeit.
theological_decisions:
- issue: Ob die messianische Identifikation im Haupttext ausdrücklich ergänzt werden soll
  choice: „Ich bin es“ ohne die Ergänzung „der Messias“
  alternative: „Ich bin“ beziehungsweise „Ich, der mit dir spricht, bin es“
  rationale: Der Zusammenhang identifiziert Jesus eindeutig mit dem in Vers 25 erwarteten Messias; im griechischen Satz steht jedoch kein ausdrückliches Wort für „der Messias“ oder „er“. Die idiomatische deutsche Identifikationsformel bewahrt die Aussage, ohne den Bezug stärker auszuschreiben als die Quelle.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich macht die nachgestellte Selbstbezeichnung im Deutschen klar, ohne sie zu einem eigenständigen theologischen Titel auszubauen.
