  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: de
  text: 'Da fragte er sie, zu welcher Stunde es ihm besser wurde. Sie sagten ihm: „Gestern um die siebte Stunde[a] verließ ihn das Fieber.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei einer Zählung ab Sonnenaufgang entspricht die siebte Stunde etwa 13 Uhr; manche verstehen die Zeitangaben bei Johannes anders.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Da fragte er
  rationale: πυνθάνομαι bezeichnet hier das Erfragen einer Auskunft; οὖν führt die Folgerung beziehungsweise den nächsten Erzählschritt fort. „Da fragte er“ ist natürlich und wahrt den Zusammenhang.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: sie, zu welcher Stunde
  rationale: παρά mit Genitiv bezeichnet die Quelle der Auskunft und wird im Deutschen idiomatisch durch das direkte Objekt bei „fragen“ wiedergegeben. ὥρα bleibt als „Stunde“ erhalten.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: zu welcher Stunde es ihm besser gegangen war
  rationale: κομψότερον ἔχειν ist eine idiomatische Wendung für gesundheitliche Besserung. Das Plusquamperfekt ordnet die Besserung natürlich vor dem späteren Erfragen ein, ohne einen über den griechischen Text hinausgehenden Beginn der Genesung ausdrücklich festzulegen.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Sie sagten ihm
  rationale: Die Wendung gibt die anschließende Antwort wieder. Ein weiteres „da“ oder „also“ ist im Deutschen entbehrlich, da die Abfolge bereits klar ist.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Gestern um die siebte Stunde
  rationale: Die wörtliche Stundenangabe bleibt erhalten, damit das im Text nicht erklärte System der Zeitrechnung nicht vorentschieden wird.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: verließ ihn das Fieber
  rationale: Die Formulierung bildet die griechische Subjekt-Objekt-Struktur eng und zugleich verständlich ab; ἀφίημι bedeutet hier „verlassen“ beziehungsweise „weichen“.
theological_decisions:
- issue: Zeitrechnung bei „der siebten Stunde“
  choice: Die wörtliche Angabe „die siebte Stunde“ bleibt im Haupttext stehen.
  alternative: Etwa 13 Uhr bei einer Zählung ab Sonnenaufgang; nach einer anders verstandenen johanneischen Zeitrechnung möglicherweise etwa 19 Uhr.
  rationale: Der Vers selbst legt das verwendete System nicht ausdrücklich fest. Eine Umrechnung im Haupttext würde die echte historische und auslegerische Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die etwas bildhafte Aussage „das Fieber verließ ihn“ wurde wegen ihrer Klarheit und Quellennähe beibehalten.
