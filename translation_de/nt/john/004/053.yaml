  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: de
  text: 'Da erkannte der Vater, dass es in jener Stunde gewesen war, als Jesus zu ihm gesagt hatte: »Dein Sohn lebt.«[a] Er selbst glaubte, ebenso sein ganzer Haushalt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Sohn ist am Leben.«'
    reason: lexical_alternative
  - marker: b
    text: »Glaubte« kann sich darauf beziehen, dass der Vater Jesu Wort glaubte, oder darauf, dass er nun umfassender zum Glauben an Jesus kam. Das Griechische lässt den genauen Bezug offen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: erkannte
  rationale: Der Aorist bezeichnet hier das Erkennen der Übereinstimmung zwischen der von den Dienern genannten Stunde und Jesu Wort. »Erkannte« gibt diesen punktuellen Erkenntnisvorgang natürlicher wieder als »wusste«.
- source_word: οὖν
  choice: Da
  rationale: Das folgernde οὖν knüpft an die Auskunft der Diener im vorigen Vers an. »Da« stellt den erzählerischen Zusammenhang im Deutschen natürlich her.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Folgt der griechischen Bezeichnung und bewahrt den familiären Schwerpunkt der Heilungserzählung.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: genau die Stunde
  rationale: Bezeichnet die bestimmte, zuvor erfragte Stunde. »Genau« verdeutlicht die festgestellte zeitliche Übereinstimmung, ohne die Aussage sachlich zu erweitern.
- source_word: ἐν ᾗ
  choice: in der
  rationale: Die relative Zeitangabe lässt sich im Deutschen idiomatisch und zugleich formnah mit »in der« wiedergeben.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jesus zu ihm gesagt hatte
  rationale: Das Plusquamperfekt macht im deutschen Satz deutlich, dass Jesu Ausspruch dem späteren Erkennen vorausging.
- source_word: Ὁ υἱός σου ζῇ
  choice: Dein Sohn lebt
  rationale: Das Präsens ζῇ bezeichnet den gegenwärtigen Lebenszustand. Die knappe Formulierung entspricht dem Griechischen; »ist am Leben« bleibt als lexikalische Alternative möglich.
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Die einfache Wiedergabe wahrt den im Griechischen nicht ausdrücklich bestimmten Umfang des Glaubens.
- source_word: αὐτός
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck und hebt den Vater hervor, bevor sein ganzes Haus einbezogen wird.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: sein ganzes Haus
  rationale: οἰκία bezeichnet hier metonymisch die Hausgemeinschaft. »Sein ganzes Haus« ist eine im biblischen Erzählregister verständliche und würdige deutsche Wendung.
theological_decisions:
- issue: Reichweite des Glaubens des Vaters
  choice: Die Übersetzung sagt schlicht, dass er glaubte, ohne den Gegenstand oder Reifegrad dieses Glaubens näher festzulegen.
  alternative: Er glaubte ausschließlich Jesu konkretem Heilungswort oder kam in diesem Augenblick zu einem umfassenderen Glauben an Jesus.
  rationale: πιστεύω kann im johanneischen Zusammenhang theologisch gefüllt sein; der Satz selbst nennt jedoch weder ein ausdrückliches Objekt noch den genauen Umfang. Diese Offenheit bleibt erhalten.
- issue: Bedeutung von »sein ganzes Haus«
  choice: Die Hausgemeinschaft wird gemeinsam mit dem Vater als glaubend bezeichnet.
  alternative: Nur die engste Familie oder sämtliche Angehörigen einschließlich Bediensteter sind konkret gemeint.
  rationale: οἰκία bezeichnet eine Hausgemeinschaft, legt deren genaue soziale Zusammensetzung hier aber nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch natürlichem Satzbau. Das Plusquamperfekt klärt die zeitliche Abfolge. »Sein ganzes Haus« bewahrt die knappe kollektive Ausdrucksweise des Ausgangstextes; die Fußnoten markieren echte lexikalische und theologische Offenheit.
