id: JHN.4.46
reference: John 4:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: de
  text: So kam er wieder nach Kana in Galiläa, wo er das Wasser zu Wein gemacht hatte. Dort war ein königlicher Beamter[a], dessen Sohn in Kafarnaum krank war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hofbeamter“, „königlicher Bediensteter“ oder „Adliger“. Das griechische Wort bezeichnet jemanden, der mit einem König oder dessen Hof verbunden ist; sein genauer Rang bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: So
  rationale: Bewahrt die folgernde beziehungsweise fortführende Funktion des griechischen Konnektors und klingt im modernen deutschen Erzählstil natürlich.
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die erneute Ankunft direkt und idiomatisch wieder.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Kana in Galiläa
  rationale: Der Regionsgenitiv wird im Deutschen natürlich mit „in Galiläa“ ausgedrückt.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: das Wasser zu Wein gemacht hatte
  rationale: Bleibt der Formulierung „das Wasser Wein machen“ nahe; „zu Wein“ macht die Aussage im Deutschen verständlich, ohne ausdrücklich das stärker deutende Verb „verwandeln“ einzuführen. Das Plusquamperfekt kennzeichnet das vorausliegende Ereignis.
- source_word: βασιλικός
  choice: königlicher Beamter
  rationale: Bezeichnet einen Mann in Verbindung mit einem König beziehungsweise dessen Hof oder Dienst, ohne einen bestimmten Rang oder Adelstitel vorauszusetzen.
- source_word: τις
  choice: ein
  rationale: Das indefinite Pronomen führt einen nicht namentlich genannten Mann ein. Anders als „ein gewisser“ wirkt „ein“ im heutigen Deutsch natürlich und ohne unnötige Distanzierung.
- source_word: υἱός
  choice: Sohn
  rationale: Gibt die ausdrücklich männliche Verwandtschaftsbezeichnung genau wieder.
- source_word: ἠσθένει
  choice: krank war
  rationale: Im Zusammenhang bezeichnet das Verb eine andauernde körperliche Erkrankung.
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
theological_decisions:
- issue: Wiedergabe von βασιλικός ohne ungesicherte historische Präzisierung
  choice: königlicher Beamter
  alternative: Hofbeamter; königlicher Bediensteter; Adliger
  rationale: Die Bezeichnung stellt eine Beziehung zum königlichen Herrschaftsbereich her, nennt aber weder das genaue Amt noch den Rang des Mannes. Die gewählte Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „So kam er wieder“ hält den Anschluss an den vorangehenden Zusammenhang sichtbar. „Dort war“ vermeidet die im Deutschen schwerfällige wörtliche Nachbildung von „und es war ein gewisser“. Alle Fußnotenmarker erscheinen im Haupttext.
