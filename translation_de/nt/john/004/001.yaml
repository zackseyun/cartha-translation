  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: de
  text: Als Jesus nun erfuhr, dass die Pharisäer gehört hatten, Jesus mache und taufe mehr Jünger als Johannes[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus mache mehr Jünger und taufe mehr als Johannes.“ Im Griechischen kann sich der Vergleich auf die verbundenen Tätigkeiten insgesamt beziehen, statt nur unmittelbar auf „mehr Jünger“ bezogen zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Als … nun
  rationale: ὡς leitet den temporalen Nebensatz ein, während οὖν den folgernden beziehungsweise fortschreitenden Erzählzusammenhang markiert. Die deutsche Verbindung „Als … nun“ gibt beides natürlich wieder.
- source_word: ἔγνω
  choice: erfuhr
  rationale: Der Aorist von γινώσκω bezeichnet hier am ehesten, dass Jesus von der Nachricht Kenntnis erhielt. „Erfuhr“ ist im Deutschen idiomatischer als ein statisches „wusste“, ohne die Art der Kenntnisnahme festzulegen.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Etablierte deutsche Bezeichnung der religiösen Gruppierung; der bestimmte Artikel wird beibehalten.
- source_word: ἤκουσαν
  choice: gehört hatten
  rationale: 'Das Plusquamperfekt verdeutlicht die zeitliche Abfolge: Die Pharisäer hatten die Nachricht bereits gehört, als Jesus davon erfuhr.'
- source_word: πλείονας μαθητὰς ποιεῖ
  choice: mehr Jünger gewinne
  rationale: ποιεῖν mit μαθητάς bedeutet in diesem Zusammenhang, Menschen zu Jüngern zu machen beziehungsweise als Jünger zu gewinnen. „Jünger gewinnen“ ist natürliches, verständliches Deutsch und vermeidet das schwerfällige „Jünger machen“.
- source_word: καὶ βαπτίζει
  choice: und taufe mehr Menschen
  rationale: „taufen“ ist die etablierte Wiedergabe von βαπτίζω. Das ergänzte „Menschen“ macht bei der hier gewählten Lesart deutlich, dass sich „mehr“ auch auf die Tauftätigkeit bezieht; es führt keine Einschränkung ein, wer die Taufe vollzog.
- source_word: ἢ Ἰωάννης
  choice: als Johannes
  rationale: Die übliche deutsche Vergleichskonstruktion gibt den griechischen Komparativ knapp und natürlich wieder.
theological_decisions:
- issue: Mögliche Aussage, Jesus habe persönlich getauft
  choice: 'Die Oberflächenformulierung von Vers 1 bleibt erhalten: Jesus wird als der Handelnde bei der Taufe genannt.'
  alternative: 'Die Klarstellung aus Vers 2 vorwegnehmen, etwa: „seine Jünger tauften“.'
  rationale: Vers 2 erläutert unmittelbar, dass Jesus nicht selbst taufte. Diese Erläuterung soll nicht vorzeitig in Vers 1 eingetragen werden; die erzählerische Spannung des Ausgangstextes bleibt bestehen.
- issue: Reichweite des Vergleichs πλείονας … ἢ Ἰωάννης
  choice: 'Der Vergleich wird auf beide Tätigkeiten bezogen: Jesus gewinnt mehr Jünger und tauft mehr Menschen als Johannes.'
  alternative: „Jesus mache und taufe mehr Jünger als Johannes“, wobei „mehr“ grammatisch unmittelbar „Jünger“ bestimmt.
  rationale: Die Koordination ποιεῖ καὶ βαπτίζει erlaubt, den Vergleich auf die kombinierte beziehungsweise auf beide Tätigkeiten zu beziehen. Die alternative syntaktische Nähe zu „Jünger“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich am Versende bewahrt den unvollständigen Satzbau, der in Vers 2–3 fortgeführt wird. Der indirekte Bericht steht nach „gehört hatten“ im Konjunktiv I.
