source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: de
  text: 'Jesus antwortete ihr: „Wenn du die Gabe Gottes kennen würdest und wüsstest, wer es ist, der zu dir sagt: ‚Gib mir zu trinken!‘, dann hättest du ihn gebeten, und er hätte dir lebendiges Wasser[a] gegeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fließendes Wasser; auch: frisches Wasser. Die Wendung kann fließendes Wasser bezeichnen; »lebendiges Wasser« bewahrt hier zugleich den weiterführenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jesus antwortete ihr
  rationale: Die griechische Antwortformel enthält wörtlich »antwortete und sagte«. Im modernen Standarddeutsch ist »antwortete ihr« die natürliche, würdevolle Erzählform und gibt die gesamte Formel ohne schwerfällige Doppelung wieder.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: die Gabe Gottes
  rationale: »Gabe« bewahrt den Charakter eines frei gewährten Geschenks und gibt den Genitiv τοῦ θεοῦ formal wie idiomatisch wieder, ohne vorschnell zwischen Ursprung und Besitz festzulegen.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: wer es ist, der zu dir sagt
  rationale: Die Formulierung erhält die im Griechischen hervorgehobene Frage nach der Identität des Sprechenden; das Präsens des Partizips wird mit »sagt« natürlich wiedergegeben.
- source_word: Δός μοι πεῖν
  choice: Gib mir zu trinken!
  rationale: Dies ist die idiomatische deutsche Wiedergabe des Imperativs mit Infinitiv und fügt kein ausdrücklich genanntes Objekt hinzu.
- source_word: Εἰ ᾔδεις … σὺ ἂν ᾔτησας … καὶ ἔδωκεν ἄν
  choice: Wenn du … kennen würdest und wüsstest …, dann hättest du … gebeten, und er hätte … gegeben
  rationale: Der deutsche irreal formulierte Bedingungssatz wahrt die nicht erfüllte Voraussetzung und deren hypothetische Folge. Das ergänzte »wüsstest« macht die syntaktische Zuordnung von »wer es ist« im Deutschen klar.
- source_word: ὕδωρ ζῶν
  choice: lebendiges Wasser
  rationale: »Lebendiges Wasser« bewahrt sowohl den gewöhnlichen möglichen Sinn von fließendem beziehungsweise frischem Quellwasser als auch die weiterführende Bedeutung im johanneischen Zusammenhang.
theological_decisions:
- issue: Doppelsinn von ὕδωρ ζῶν
  choice: lebendiges Wasser
  alternative: fließendes Wasser; frisches Quellwasser
  rationale: Die Wendung kann auf der konkreten Ebene fließendes oder frisches Wasser bezeichnen, weist im Kontext aber zugleich über diese Bedeutung hinaus. Die Hauptübersetzung lässt diese Spannung bestehen, statt sie auf eine Ebene zu reduzieren.
- issue: Identität des Gebenden und Art der Gabe
  choice: wer es ist … er hätte dir gegeben
  alternative: eine erklärende Benennung Jesu oder der geistlichen Gabe
  rationale: Der Vers selbst benennt weder Jesu Identität näher noch erklärt er hier ausdrücklich, worin das lebendige Wasser besteht. Die Übersetzung vermeidet daher eine lehrhafte Ergänzung und erhält die fortschreitende Offenbarung des Gesprächs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die semitisch-griechische Doppelung »antwortete und sagte« wird idiomatisch zu »antwortete« verdichtet. Die direkte Rede bleibt klar strukturiert; »Gabe« und »lebendiges Wasser« bewahren den biblischen Ton, ohne altertümlich zu wirken.
