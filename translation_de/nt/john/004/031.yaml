  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: de
  text: 'Inzwischen drängten[b] ihn die Jünger: »Rabbi[c], iss!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Das Verb kann auch mit »baten ihn« oder »forderten ihn wiederholt auf, zu essen« wiedergegeben werden; die Imperfektform kann ein andauerndes oder wiederholtes Bitten ausdrücken.
    reason: lexical_alternative
  - marker: c
    text: »Rabbi« ist ein jüdischer Anredetitel und bedeutet »Lehrer« oder »Meister«.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Inzwischen
  rationale: Die Wendung bezeichnet die Zwischenzeit während der vorausgehenden Ereignisse. »Inzwischen« gibt diesen zeitlichen Zusammenhang natürlich und prägnant wieder.
- source_word: ἠρώτων
  choice: drängten
  rationale: Das Imperfekt beschreibt ein andauerndes oder wiederholtes Bitten. Im Zusammenhang – die Aufforderung an Jesus zu essen – bringt »drängten« den nachdrücklichen Charakter zum Ausdruck, ohne den Vorgang als bloße Frage wiederzugeben.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich im Erzählzusammenhang eindeutig auf Jesus.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Der bestimmte Artikel kennzeichnet die bereits bekannte Gruppe der Jünger.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip leitet den Wortlaut ihres Drängens ein. Die finite Beiordnung ist im modernen Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Der jüdische Anredetitel wird beibehalten; er ist im Deutschen geläufig und bewahrt das johanneische Umfeld.
- source_word: φάγε
  choice: iss
  rationale: Der Aoristimperativ Singular wird als direkte Aufforderung wiedergegeben. »Iss« ist knapp und entspricht der unmittelbaren Form des griechischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; die Partizipialkonstruktion des Griechischen wird idiomatisch als Beiordnung wiedergegeben.
