id: JHN.4.49
reference: John 4:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: de
  text: 'Der königliche Beamte sagte zu ihm: „Herr[a], komm herab, bevor mein Kind stirbt!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herr“. Das griechische Wort κύριε ist eine respektvolle Anrede und kann zugleich „Herr“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: der königliche Beamte
  rationale: Das substantivierte Adjektiv bezeichnet hier einen Mann, der mit dem König oder dessen Hof verbunden ist. „Königlicher Beamter“ ist im modernen Deutsch verständlich, bewahrt den Bezug zum Herrscher und vermeidet die unbelegte Einengung auf einen Adligen.
- source_word: Κύριε
  choice: Herr
  rationale: Κύριε kann sowohl eine respektvolle Anrede als auch den Titel „Herr“ bezeichnen. „Herr“ bewahrt im Johannesevangelium diese mögliche Bedeutungsfülle; die rein höfliche Lesart wird in der Fußnote genannt.
- source_word: κατάβηθι
  choice: komm herab
  rationale: Der Aoristimperativ fordert Jesus auf, von Kana nach Kafarnaum hinabzukommen. „Komm herab“ erhält sowohl die Bewegungsrichtung zum Sprecher beziehungsweise zu dessen Ziel als auch den topografischen Bestandteil des Verbs.
- source_word: πρὶν ἀποθανεῖν
  choice: bevor … stirbt
  rationale: πρίν mit Infinitiv bezeichnet Vorzeitigkeit. Im Deutschen wird der aus dem Zusammenhang erschlossene Satzgegenstand natürlich als Nebensatz ausgedrückt.
- source_word: τὸ παιδίον μου
  choice: mein Kind
  rationale: παιδίον bezeichnet ein Kind beziehungsweise kleines Kind, ohne in diesem Vers ausdrücklich das Geschlecht zu benennen. „Mein Kind“ bleibt deshalb näher am Wortlaut als „mein Sohn“.
- source_word: λέγει πρὸς αὐτόν
  choice: sagte zu ihm
  rationale: Das historische Präsens λέγει wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben.
theological_decisions:
- issue: Κύριος als Anrede Jesu
  choice: Herr
  alternative: Mein Herr; Herr (höfliche Anrede)
  rationale: Die Anrede kann im unmittelbaren Gespräch schlicht respektvoll gemeint sein, trägt im Johannesevangelium aber potenziell eine weitergehende christologische Resonanz. „Herr“ wahrt diese Spannung, ohne dem Beamten ausdrücklich ein volles Bekenntnis zuzuschreiben; die höfliche Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf erhält die Dringlichkeit der Bitte. „Herabkommen“ bewahrt die im griechischen Verb enthaltene topografische Richtung, klingt jedoch bewusst etwas gehobener als alltägliche Umgangssprache.
