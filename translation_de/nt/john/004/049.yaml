  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: ὁ βασιλικός als „der königliche Beamte“, die respektvolle Anrede Κύριε als „Herr“, den abwärts gerichteten Imperativ κατάβηθι als „komm herab“ sowie die zeitliche Dringlichkeit von πρὶν ἀποθανεῖν. „Mein Kind“ bewahrt die im Vers nicht näher bestimmte Bezeichnung παιδίον.'
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem erzählerischem Register. „Komm herab“ ist leicht gehoben, aber idiomatisch und bewahrt sinnvoll die im griechischen Verb markierte Richtung. Das Ausrufezeichen vermittelt die Dringlichkeit der Bitte natürlich.
  terminology: „Königlicher Beamter“ ist sachgerecht und vermeidet unbelegte soziale Präzisierungen. „Herr“ lässt die respektvolle und potenziell weiterreichende Bedeutung von κύριε offen; die Fußnote nennt mit „Mein Herr“ eine mögliche deutschsprachige Anredeform. Die Namens- und theologischen Entscheidungen sind konsistent und überdehnen den Kontext nicht.
