id: JHN.4.51
reference: John 4:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: de
  text: Während er schon hinabging, kamen ihm seine Sklaven entgegen und sagten, dass sein Kind[a] lebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Sohn“; das griechische Wort kann „Kind“, „Junge“ oder in manchen Zusammenhängen „Diener/Sklave“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: schon
  rationale: Kennzeichnet, dass der Abstieg zum Zeitpunkt der Begegnung bereits im Gang war.
- source_word: δὲ
  choice: unübersetzt im fließenden Anschluss
  rationale: Die Partikel führt die Erzählung nur leicht weiter; ein ausdrückliches „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: καταβαίνοντος
  choice: während er hinabging
  rationale: Der präsentische Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung; „hinabgehen“ bewahrt zudem die geografische Bewegung von Kana in Richtung Kafarnaum.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Bezeichnet hier dem Haus des königlichen Beamten zugehörige, seiner Verfügungsgewalt unterstehende Menschen. „Sklaven“ bildet die damalige soziale Wirklichkeit deutlicher ab als das mildere „Diener“.
- source_word: ὑπήντησαν
  choice: kamen ihm entgegen
  rationale: Das Verb kann nicht nur das Zusammentreffen, sondern auch das Entgegengehen ausdrücken; diese Bedeutung passt zum erzählten Ablauf.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die beigeordnete deutsche Verbform gibt die begleitende Handlung des Partizips natürlich wieder.
- source_word: παῖς
  choice: Kind
  rationale: Das Wort kann ein Kind, einen Jungen oder einen Diener/Sklaven bezeichnen. Im Zusammenhang ist eine familiäre Beziehung naheliegend, doch „Kind“ legt Alter und Geschlecht weniger stark fest als „Sohn“.
- source_word: ζῇ
  choice: lebt
  rationale: Bewahrt das griechische Präsens und die knappe Meldung, ohne deutend „ist wieder gesund“ oder „hat sich erholt“ hinzuzufügen.
theological_decisions:
- issue: Bezug und Bedeutung von παῖς in der Heilungserzählung
  choice: sein Kind
  alternative: sein Sohn; sein Diener
  rationale: Der weitere Zusammenhang spricht für das Kind des Beamten und bezeichnet es andernorts als Sohn; παῖς selbst ist jedoch weiter gefasst. Der Haupttext erhält diese lexikalische Offenheit, die Fußnote nennt die möglichen engeren Wiedergaben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Konstruktion mit „während“ bildet die Gleichzeitigkeit natürlich ab; „Sklaven“ vermeidet eine Beschönigung des antiken Abhängigkeitsverhältnisses.
