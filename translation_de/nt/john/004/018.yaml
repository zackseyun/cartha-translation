  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: de
  text: Denn du hast fünf Ehemänner[a] gehabt, und der Mann, den du jetzt hast, ist nicht dein Ehemann; damit hast du die Wahrheit gesagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „fünf Männer“. Das griechische Wort ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten; hier legt der Zusammenhang „Ehemänner“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung dafür ein, dass Jesus die Aussage der Frau als wahr bezeichnet.
- source_word: πέντε ἄνδρας
  choice: fünf Ehemänner
  rationale: ἀνήρ kann sowohl „Mann“ als auch „Ehemann“ bedeuten. Der Gegensatz zur gegenwärtigen Verbindung, in der der betreffende Mann ausdrücklich nicht ihr Ehemann ist, legt hier die eheliche Bedeutung nahe.
- source_word: ἔσχες
  choice: du hast … gehabt
  rationale: Das deutsche Perfekt gibt die zurückliegende Beziehungsgeschichte mit ihrer Bedeutung für die Gegenwart natürlich wieder.
- source_word: νῦν ὃν ἔχεις
  choice: der Mann, den du jetzt hast
  rationale: Die Formulierung bleibt nahe an der relational gebrauchten Wendung des Griechischen und ist im Deutschen verständlich, ohne eine genauere Art der Beziehung hinzuzufügen.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: ist nicht dein Ehemann
  rationale: Der Genitiv σου bezeichnet hier die eheliche Zuordnung; „dein Ehemann“ macht den im Kontext beabsichtigten Gegensatz klar.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: das hast du wahrheitsgemäß gesagt
  rationale: Die Wiedergabe erhält den Rückverweis von τοῦτο, den Wahrheitsbezug von ἀληθές und die resultative Nuance des griechischen Perfekts.
theological_decisions:
- issue: Bedeutung von ἀνήρ an beiden Stellen
  choice: Beide Vorkommen im Haupttext ehelich als „Ehemänner/Ehemann“ wiedergeben.
  alternative: Wörtlicher und mehrdeutiger „Männer/Mann“.
  rationale: Der unmittelbare Gegensatz zwischen den fünf früheren Männern und dem gegenwärtigen Mann, der gerade nicht ihr Ehemann ist, spricht für die eheliche Bedeutung. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengelegt, ohne weitergehende Annahmen über die Beziehungen der Frau einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das Semikolon bewahrt den engen gedanklichen Zusammenhang der beiden griechischen Satzteile; die Formulierung vermeidet eine zusätzliche moralische Bewertung der Frau oder eine nähere Bestimmung ihrer gegenwärtigen Beziehung.
