base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: de
  text: Er musste aber durch Samarien reisen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es war notwendig, dass er durch Samarien reiste.“ Das Griechische spricht von einer Notwendigkeit, ohne deren genaue Grundlage anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: musste
  rationale: Das Imperfekt von δεῖ bezeichnet in der vergangenen Erzählung eine Notwendigkeit. „Musste“ ist natürliches modernes Deutsch und lässt offen, worauf diese Notwendigkeit beruhte.
- source_word: δὲ
  choice: aber
  rationale: δέ ist ein leichter weiterführender oder kontrastierender Konnektor. „Aber“ bewahrt hier die Anschlussfunktion und passt zum Kontextwechsel, ohne einen starken Gegensatz zu erzwingen.
- source_word: αὐτὸν
  choice: er
  rationale: αὐτόν ist formal das Akkusativsubjekt des Infinitivs; im idiomatischen deutschen Nebensatz mit Modalverb wird daraus das nominativische Subjekt „er“.
- source_word: διέρχεσθαι
  choice: ziehen
  rationale: διέρχομαι mit διά bezeichnet das Durchqueren eines Gebiets. „Durch … ziehen“ ist im Deutschen eine natürliche und würdige geografische Wendung.
- source_word: διὰ τῆς Σαμαρείας
  choice: durch Samarien
  rationale: διά mit Genitiv bezeichnet eine Bewegung durch einen Ort oder ein Gebiet. „Samarien“ genügt im Haupttext; „das Gebiet von Samarien“ wäre expliziter, aber schwerfälliger.
theological_decisions:
- issue: Art der Notwendigkeit in ἔδει
  choice: Als wirkliche Notwendigkeit mit „musste“ wiedergegeben, ohne ihren Grund festzulegen.
  alternative: Die Notwendigkeit ausdrücklich als geografisch bedingt oder als Teil eines göttlichen Auftrags deuten.
  rationale: Der griechische Satz bezeichnet eine Notwendigkeit, nennt aber in diesem Vers deren genaue Grundlage nicht. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die knappe Satzgestalt des Griechischen bleibt erhalten; „aber“ gibt δέ als leichten Anschluss wieder.
