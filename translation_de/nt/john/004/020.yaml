id: JHN.4.20
reference: John 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: de
  text: Unsere Vorfahren haben auf diesem Berg angebetet, und ihr sagt, dass in Jerusalem der Ort ist, an dem man anbeten muss.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem man anbeten soll“.'
    reason: Das griechische δεῖ bezeichnet Notwendigkeit oder Verpflichtung; je nach Kontext kann Deutsch dies mit „muss“ oder „soll“ ausdrücken.
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Unsere Vorfahren
  rationale: „Vorfahren“ gibt den gemeinschaftlichen Abstammungsbezug im heutigen Deutsch natürlich wieder; das wörtlichere „unsere Väter“ könnte enger auf unmittelbar vorausgehende Generationen bezogen werden.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: auf diesem Berg
  rationale: Bei einem Berg als Ort des Gottesdienstes entspricht „auf“ dem griechischen lokativen Sinn und ist idiomatisches Deutsch.
- source_word: προσεκύνησαν
  choice: haben ... angebetet
  rationale: Im Zusammenhang mit dem umstrittenen Gottesdienstort bezeichnet προσκυνέω religiöse Anbetung; die deutsche Perfektform klingt in direkter Rede natürlich.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen bildet den Kontrast zu „unsere Vorfahren“ ab, ohne die angesprochene Gruppe erklärend zu benennen.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Dies ist die übliche deutsche Ortsangabe; die griechische Namensform erfordert keine besondere Wiedergabe.
- source_word: ὁ τόπος
  choice: der Ort
  rationale: Die bestimmte Form bleibt erhalten, ohne durch „der richtige Ort“ die im Zusammenhang liegende Ausschließlichkeit zusätzlich auszudeuten.
- source_word: ὅπου
  choice: an dem
  rationale: Der Relativanschluss „der Ort, an dem“ ist in modernem Standarddeutsch natürlich und präzise.
- source_word: προσκυνεῖν δεῖ
  choice: man anbeten muss
  rationale: Die unpersönliche Konstruktion bezeichnet eine allgemeine Notwendigkeit oder Verpflichtung. „Man ... muss“ wahrt diesen normativen Sinn in verständlichem Deutsch.
- source_word: καὶ
  choice: und
  rationale: Die koordinierende Konjunktion wird formal als „und“ wiedergegeben; der Gegensatz ergibt sich bereits aus „unsere“ und „ihr“.
theological_decisions:
- issue: Ausdrückliche Benennung der samaritanischen und jüdischen Gruppen
  choice: Der Gegensatz bleibt in „unsere Vorfahren ... und ihr sagt“ implizit.
  alternative: „Unsere samaritanischen Vorfahren ... aber ihr Juden sagt ...“
  rationale: Der griechische Vers nennt die Gruppen nicht ausdrücklich. Die Erweiterung würde Kontextwissen in den Wortlaut eintragen und den Kontrast stärker auslegen als die Vorlage.
- issue: Unpersönliche Notwendigkeit in προσκυνεῖν δεῖ
  choice: „an dem man anbeten muss“
  alternative: „wo anzubeten notwendig ist“
  rationale: Die gewählte Fassung erhält den allgemeinen und verpflichtenden Charakter, ohne eine bestimmte Person zum Adressaten des Müssens zu machen.
- issue: Zeitlicher Bezug von προσεκύνησαν
  choice: Deutsches Perfekt „haben ... angebetet“
  alternative: Präteritum „beteten ... an“
  rationale: Beide Formen können den griechischen Aorist wiedergeben. Das Perfekt ist in moderner direkter Rede natürlicher und lässt offen, ob eine einzelne historische Handlung oder die überlieferte Praxis zusammenfassend gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in natürlicher direkter Rede. Der Satz bewahrt den durch die Pronomen getragenen Gegensatz und vermeidet konfessionelle oder historische Zusätze.
