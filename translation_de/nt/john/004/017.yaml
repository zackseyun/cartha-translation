  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: de
  text: 'Die Frau antwortete ihm: „Ich habe keinen Mann.“[a] Jesus sagte zu ihr: „Du hast recht, wenn du sagst: ‚Ich habe keinen Mann.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Mann“ kann auch „Ehemann“ bedeuten; hier ist nach dem Zusammenhang der Ehemann gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: Die Frau antwortete ihm
  rationale: Die griechische Doppelformel „antwortete und sagte“ wird im natürlichen modernen Deutsch idiomatisch mit „antwortete“ wiedergegeben; der Adressat αὐτῷ bleibt ausdrücklich erhalten.
- source_word: ἀνήρ / ἄνδρα
  choice: Mann
  rationale: Deutsch „Mann“ bewahrt wie das griechische ἀνήρ die mögliche Bedeutung „Mann“ beziehungsweise „Ehemann“. Im Zusammenhang ist der Ehemann gemeint, doch die lexikalische Spannung bleibt erhalten.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird entsprechend üblicher deutscher Erzählweise als Vergangenheit wiedergegeben.
- source_word: Καλῶς εἶπας
  choice: Du hast recht gesagt
  rationale: Die Formulierung gibt Jesu Bestätigung der Wahrheit ihrer Aussage natürlich und genau wieder. „Gut gesagt“ könnte im Deutschen eher wie ein Lob der Ausdrucksweise klingen.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι führt hier den Inhalt beziehungsweise das Zitat ihrer Aussage ein; ein Doppelpunkt bildet diese Funktion im Deutschen klar und flüssig ab.
- source_word: Ἄνδρα οὐκ ἔχω
  choice: Ich habe keinen Mann
  rationale: Die Wiederholung wird beibehalten, weil Jesus ihre Aussage ausdrücklich aufgreift. Die vorangestellte Objektstellung des Griechischen wird zugunsten natürlichen deutschen Satzbaus nicht nachgebildet.
theological_decisions:
- issue: Bedeutung von ἀνήρ in der Aussage der Frau
  choice: Mann, mit kontextueller Bedeutung „Ehemann“
  alternative: Ehemann
  rationale: Der folgende Vers zeigt, dass es um ihre eheliche Situation geht. „Mann“ ist im Deutschen jedoch ebenfalls idiomatisch für „Ehemann“ und bewahrt zugleich die Bedeutungsbreite des griechischen Wortes, ohne den Kontext zu verdunkeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Doppelformel des Sprechens wird idiomatisch gestrafft; Jesu wörtliche Wiederholung bleibt erhalten. Der Fußnotenmarker steht im Haupttext am Ende des Verses.
