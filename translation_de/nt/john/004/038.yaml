  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: de
  text: Ich habe euch ausgesandt, das zu ernten, wofür ihr euch nicht abgemüht habt. Andere haben sich abgemüht, und ihr seid in ihre Arbeit eingetreten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr seid in ihre Mühe eingetreten«; sinngemäß auch: »ihr erntet die Frucht ihrer Mühe« oder »ihr habt Anteil an ihrer Arbeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: habe … ausgesandt
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists im gegenwärtigen Redekontext. „Aussenden“ bewahrt zudem den Sendungsaspekt, ohne ihn durch „beauftragen“ auszudeuten.
- source_word: θερίζειν
  choice: zu ernten
  rationale: „Ernten“ erhält das landwirtschaftliche Bild des Zusammenhangs und ist im heutigen Deutsch natürlicher als „einbringen“.
- source_word: ὃ
  choice: das
  rationale: Das substantivisch gebrauchte neutrale Relativpronomen wird idiomatisch mit „das“ wiedergegeben.
- source_word: κεκοπιάκατε / κεκοπιάκασιν
  choice: euch … abgemüht habt / haben sich abgemüht
  rationale: „Sich abmühen“ bringt die mit κοπιάω bezeichnete anstrengende Arbeit zum Ausdruck und erhält durch die wiederholte Formulierung den lexikalischen Zusammenhang.
- source_word: ἄλλοι
  choice: Andere
  rationale: Die knappe substantivische Wiedergabe lässt offen, wer mit den anderen gemeint ist.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: ihr seid in ihre Mühe eingetreten
  rationale: Die formal nahe Wiedergabe bewahrt die ungewöhnliche griechische Formulierung und vermeidet, κόπος interpretierend als Frucht oder Ergebnis der Arbeit wiederzugeben.
- source_word: ἐγὼ … ὑμεῖς
  choice: Ich … euch / ihr
  rationale: Die Personalpronomen bleiben ausdrücklich erhalten. Zusätzliche typografische oder sprachliche Hervorhebung wäre im Deutschen unnötig.
theological_decisions:
- issue: Bezug der „Anderen“ und Bedeutung der Ernte
  choice: Die landwirtschaftliche Metapher und der unbestimmte Bezug von „Andere“ bleiben erhalten.
  alternative: Die „Anderen“ ausdrücklich als Propheten, Johannes den Täufer, Jesus oder frühere Zeugen bestimmen.
  rationale: Der Vers selbst identifiziert die Personen nicht eindeutig. Eine nähere Bestimmung würde eine Auslegung in den Text eintragen.
- issue: „In ihre Mühe eingetreten“
  choice: Die wörtlich-metaphorische Spannung wird im Haupttext bewahrt.
  alternative: „Ihr erntet die Frucht ihrer Mühe“ oder „ihr wirkt an ihrer Arbeit mit“.
  rationale: Der griechische Text spricht ausdrücklich vom Eintreten in ihre Mühe. Die Alternativen erklären mögliche Sinne, engen die Formulierung aber interpretierend ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „sich abmühen/Mühe“ bildet den Zusammenhang von κεκοπιάκατε, κεκοπιάκασιν und κόπον soweit idiomatisch möglich ab. Der ungewöhnliche Ausdruck „in ihre Mühe eingetreten“ bleibt bewusst erhalten und wird durch eine Fußnote erläutert.
