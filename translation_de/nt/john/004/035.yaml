source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: de
  text: 'Sagt ihr nicht: »Noch sind es vier Monate, dann kommt die Ernte«? Seht, ich sage euch: Hebt eure Augen auf und schaut auf die Felder: Sie sind weiß für die Ernte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Sie sind reif für die Ernte.« Wörtlich steht »weiß«; das Bild kann ihre Erntereife andeuten. Das griechische »schon« (ἤδη) steht am Übergang zum folgenden Satz und kann entweder hierher oder zu Vers 36 gehören (»Schon empfängt der Erntende seinen Lohn …«).'
    reason: lexical_alternative; syntactic_ambiguity
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Sagt ihr nicht
  rationale: Die negative Frage wird im Deutschen natürlich wiedergegeben; das ausdrücklich gesetzte ὑμεῖς bleibt durch die Verbform und das Pronomen „ihr“ erkennbar, ohne durch „ihr selbst“ überbetont zu werden.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Es sind noch vier Monate
  rationale: Idiomatiche deutsche Zeitangabe für den noch verbleibenden Zeitraum bis zur Ernte.
- source_word: καὶ ὁ θερισμὸς ἔρχεται
  choice: dann kommt die Ernte
  rationale: „Dann“ gibt den zeitlichen Fortgang der sprichwortartigen Aussage im Deutschen natürlich wieder; das Präsens und die Unmittelbarkeit von ἔρχεται bleiben erhalten.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Moderner, würdiger Aufmerksamkeitsruf, der die Mehrzahl der Angeredeten wahrt und nicht archaisch klingt.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: Hebt eure Augen auf
  rationale: Bewahrt das anschauliche griechische Idiom, statt es zu einem bloßen „Schaut hin“ abzuflachen.
- source_word: θεάσασθε
  choice: betrachtet
  rationale: Drückt bewusstes, aufmerksames Hinsehen aus und vermeidet die unmittelbare Wiederholung von „seht“.
- source_word: τὰς χώρας
  choice: die Felder
  rationale: Im Erntezusammenhang bezeichnet χώρας am natürlichsten die bebauten Felder.
- source_word: λευκαί εἰσιν πρὸς θερισμόν
  choice: Sie sind weiß zur Ernte
  rationale: Bewahrt das ungewöhnliche sichtbare Bild „weiß“ und deutet es nicht stillschweigend als „reif“ aus. Die traditionelle, knappe Wendung ist im Deutschen verständlich, wird aber durch eine Fußnote erläutert.
- source_word: ἤδη
  choice: schon
  rationale: Hebt den Gegensatz zum vermeintlichen Warten von vier Monaten hervor. Die mögliche syntaktische Verbindung mit dem folgenden Satz wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Wörtliche oder geistliche Ausdeutung des Erntebildes
  choice: Das landwirtschaftliche Bild bleibt im Haupttext erhalten.
  alternative: Sinngemäß von Menschen sprechen, die bereit seien, gesammelt oder gewonnen zu werden.
  rationale: Der Zusammenhang legt eine übertragene Bedeutung nahe, doch der griechische Wortlaut nennt Felder und Ernte. Die Übersetzung soll das Bild nicht durch seine theologische Deutung ersetzen.
- issue: Bezug von ἤδη („schon/bereits“)
  choice: Im Haupttext wird ἤδη auf die Erntereife der Felder bezogen.
  alternative: 'ἤδη als Auftakt des folgenden Satzes verstehen: „Schon empfängt der Erntende Lohn …“'
  rationale: Die Stellung am Versende und die verbreitete Interpunktion stützen den Bezug auf die Felder; da die ältesten Handschriften die moderne Satzgliederung nicht festlegen, bleibt die andere Verbindung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die anschaulichen Wendungen „Hebt eure Augen auf“ und „weiß zur Ernte“ bewahren bewusst die Bildsprache des griechischen Textes; die ungewöhnliche Farbangabe und die Satzanschlussfrage werden durch Fußnoten erläutert.
