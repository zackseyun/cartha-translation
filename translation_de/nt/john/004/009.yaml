source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: de
  text: 'Da sagte die Samariterin zu ihm: »Wie kannst du als Jude mich als samaritanische Frau um etwas zu trinken bitten?« (Juden haben nämlich keinen Umgang mit Samaritern[a].)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Juden verkehren nämlich nicht mit Samaritern.« Das Verb kann hier auch genauer bedeuten, dass sie nichts gemeinsam benutzen, etwa Trinkgefäße.'
    reason: Lexikalische Alternative bei συγχρῶνται; der unmittelbare Zusammenhang lässt neben dem allgemeinen gesellschaftlichen Umgang auch den gemeinsamen Gebrauch von Gegenständen als Sinn zu.
lexical_decisions:
- source_word: λέγει οὖν
  choice: Da sagte
  rationale: οὖν führt die Erzählung folgernd weiter; „Da“ klingt im modernen Deutschen natürlich und bewahrt den narrativen Anschluss.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: die Samariterin
  rationale: Die artikulierte Bezeichnung identifiziert die bereits eingeführte Frau. „Samariterin“ ist die knappe, natürliche deutsche Wiedergabe.
- source_word: Πῶς σὺ Ἰουδαῖος ὢν
  choice: Wie kannst du als Jude
  rationale: Die Formulierung bringt ihr erstauntes Fragen angesichts der gesellschaftlichen Grenze idiomatisch zum Ausdruck, ohne aus Πῶς ausdrücklich ein kausales „warum“ zu machen.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: mich … um etwas zu trinken bitten
  rationale: Die Konstruktion mit αἰτεῖς und Infinitiv bezeichnet die Bitte um Trinken; die deutsche Fügung ist klar und natürlich.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: mich, eine samaritanische Frau
  rationale: Der Genitivus absolutus nennt Geschlecht und Gemeinschaftszugehörigkeit der Sprecherin als Hintergrund ihres Erstaunens. Die Apposition bewahrt beides in idiomatischem Deutsch.
- source_word: συγχρῶνται
  choice: verkehren mit
  rationale: Das Verb kann allgemeinen gesellschaftlichen Umgang oder spezieller gemeinsamen Gebrauch beziehungsweise das Teilen von Gegenständen bezeichnen. „verkehren mit“ gibt den breiten sozialen Sinn wieder; die engere Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von Ἰουδαῖος im johanneischen Sprachgebrauch
  choice: Jude
  alternative: Judäer
  rationale: Hier werden Juden und Samariter als religiös-gesellschaftliche Gemeinschaften einander gegenübergestellt, nicht lediglich Bewohner zweier Regionen.
- issue: Bedeutungsumfang von συγχρῶνται
  choice: allgemeiner gesellschaftlicher Umgang
  alternative: 'näher bestimmt: nichts gemeinsam benutzen, etwa Trinkgefäße'
  rationale: Der Zusammenhang mit der Bitte um Wasser lässt die engere Bedeutung zu; die erklärende Bemerkung kann jedoch weiter auf den gesellschaftlichen Verkehr bezogen sein. Die Mehrdeutigkeit wird durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt lebendig und verständlich; „samaritanische Frau“ vermeidet die unnatürliche Wiederholung von „Samariterin“, bewahrt aber die ausdrückliche Geschlechts- und Gemeinschaftsbezeichnung des griechischen Textes. Der erklärende Erzählerkommentar steht in Klammern.
