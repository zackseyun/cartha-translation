source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: de
  text: Ihr betet an, was ihr nicht kennt; wir beten an, was wir kennen, denn das Heil kommt von den Juden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom jüdischen Volk“. In anderen Zusammenhängen des Johannesevangeliums kann auch „Judäer“ gemeint sein; hier geht es im Gegenüber zu den Samaritern jedoch um Anbetung und die Geschichte des Heils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: betet an / beten an
  rationale: Im johanneischen Zusammenhang bezeichnet das Verb religiöse Verehrung. „Anbeten“ gibt dies im modernen Deutschen natürlich wieder, ohne es auf eine körperliche Verbeugung zu beschränken.
- source_word: ὃ
  choice: was
  rationale: Das neutrale Relativpronomen wird unmittelbar mit „was“ wiedergegeben. „Wen“ oder „den, den“ würde den griechischen Ausdruck stärker personalisieren und damit die Form des Ausgangstextes unnötig präzisieren.
- source_word: οἴδατε / οἴδαμεν
  choice: kennt / kennen
  rationale: „Kennen“ passt im Deutschen zum Gegenstand beziehungsweise Gegenüber der Anbetung und bewahrt den scharfen Gegensatz. „Wissen“ wäre mit einem direkten Bezugswort hier unidiomatisch.
- source_word: σωτηρία
  choice: Rettung
  rationale: „Rettung“ ist eine klare, gegenwärtige Wiedergabe des umfassenden rettenden Handelns Gottes. Sie vermeidet, den Ausdruck auf bloß zeitliche Befreiung zu verengen.
- source_word: ἐκ
  choice: kommt von
  rationale: Die Präposition bezeichnet Herkunft oder Ursprung. Da das deutsche „die Rettung ist von den Juden“ unnatürlich klingt, gibt „kommt von“ die Relation idiomatisch und ohne wesentliche Erweiterung wieder.
- source_word: τῶν Ἰουδαίων
  choice: den Juden
  rationale: Hier steht die jüdische Gemeinschaft im Gegensatz zu den Samaritern und ist als geschichtliche Trägerin der Heilsoffenbarung gemeint. „Juden“ ist die direkte deutsche Entsprechung; „Judäer“ wäre in diesem Zusammenhang zu regional eingeengt.
theological_decisions:
- issue: Bedeutung von „die Rettung kommt von den Juden“
  choice: Aussage über den geschichtlichen Ursprung und die Vermittlung von Gottes Rettung durch das jüdische Volk
  alternative: Ausschließlich ein Hinweis auf die jüdische Herkunft des Messias oder allgemein auf den Vorrang jüdischer Offenbarung und Anbetung
  rationale: Die Formulierung bleibt bewusst weit und bewahrt die heilsgeschichtliche Spannung des griechischen Textes. Sie behauptet keine ethnische Überlegenheit und schränkt die Aussage nicht allein auf die Herkunft des Messias ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und der Gegensatz zwischen „ihr“ und „wir“ sowie zwischen „nicht kennt“ und „kennen“ bleiben erhalten. Das im Deutschen idiomatische trennbare Verb „anbeten“ wurde verwendet.
