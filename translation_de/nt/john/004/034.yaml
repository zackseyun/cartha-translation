id: JHN.4.34
reference: John 4:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: de
  text: 'Jesus sagt zu ihnen: „Meine Speise ist es, den Willen dessen zu tun, der mich gesandt hat[a], und sein Werk zu vollenden.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang der Vater; der griechische Text nennt ihn hier jedoch nicht ausdrücklich.
    reason: cross_reference
  - marker: b
    text: 'Oder: „zu Ende zu führen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus sagt zu ihnen
  rationale: Das historische Präsens des griechischen Erzähltextes lässt sich im Deutschen natürlich beibehalten und vergegenwärtigt die Szene.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Meine Speise ist es
  rationale: „Speise“ bewahrt die konkrete Metapher, die an das zuvor erwähnte leibliche Essen anknüpft. Die Konstruktion mit „ist es“ führt im Deutschen natürlich zum folgenden Infinitiv.
- source_word: ἵνα ποιήσω
  choice: zu tun
  rationale: Der Infinitiv gibt den Inhalt der ἵνα-Konstruktion nach deutschem Sprachgebrauch knapp und sinngenau wieder.
- source_word: τὸ θέλημα
  choice: den Willen
  rationale: „Wille“ ist die präzise und im theologischen Zusammenhang geläufige Entsprechung, ohne den Ausdruck paraphrasierend einzuengen.
- source_word: τοῦ πέμψαντός με
  choice: dessen, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird als Relativsatz wiedergegeben. Die Formulierung bewahrt den persönlichen Bezug, ohne den im Griechischen hier nicht ausdrücklich genannten Titel „Vater“ einzufügen.
- source_word: τελειώσω
  choice: zu vollenden
  rationale: „Vollenden“ umfasst sowohl das Abschließen als auch das Zum-Ziel-Bringen des aufgetragenen Werkes und bewahrt damit die Bedeutungsweite von τελειόω.
- source_word: ἔργον
  choice: Werk
  rationale: „Werk“ bezeichnet hier passend den Jesus anvertrauten Auftrag und entspricht zugleich dem johanneischen Sprachgebrauch.
theological_decisions:
- issue: Bezug von „dessen, der mich gesandt hat“
  choice: Der Bezug auf Gott beziehungsweise den Vater bleibt im Text unausgesprochen und wird nur in einer Fußnote erläutert.
  alternative: „den Willen des Vaters zu tun, der mich gesandt hat“
  rationale: Der Zusammenhang des Johannesevangeliums weist eindeutig auf den Vater, doch der griechische Wortlaut nennt diesen Titel an dieser Stelle nicht ausdrücklich.
- issue: Bedeutungsumfang von τελειώσω
  choice: „vollenden“
  alternative: „zu Ende führen“ oder „abschließen“
  rationale: „Vollenden“ wahrt neben dem zeitlichen Abschluss auch den Gedanken, das Werk an sein bestimmtes Ziel zu bringen, ohne die mögliche einfachere Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener konkreter Metapher. „Speise“ und „vollenden“ sind leicht gehoben, aber allgemein verständlich und tragen dem johanneischen Ausdruck Rechnung.
