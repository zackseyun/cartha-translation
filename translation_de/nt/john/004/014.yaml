id: JHN.4.14
reference: John 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: de
  text: Wer aber von dem Wasser trinkt, das ich ihm geben werde, wird in Ewigkeit keinen Durst mehr haben. Vielmehr wird das Wasser, das ich ihm geben werde, in ihm zu einer Quelle werden, deren Wasser ins ewige Leben sprudelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: wird in Ewigkeit keinen Durst mehr haben
  rationale: Die starke griechische Verneinung οὐ μή und die Zeitangabe εἰς τὸν αἰῶνα werden ausdrücklich wiedergegeben; „keinen Durst mehr haben“ ist im Deutschen idiomatischer als „niemals dürsten“.
- source_word: πηγὴ ὕδατος
  choice: eine Quelle, deren Wasser
  rationale: Gibt das Bild einer Wasserquelle natürlich wieder und schafft einen klaren Bezug für das folgende Partizip.
- source_word: ἁλλομένου
  choice: sprudelt
  rationale: Das Verb bezeichnet lebhafte, aufwärts gerichtete Bewegung; bei Wasser ist „sprudeln“ eine natürliche und bildkräftige Entsprechung.
- source_word: εἰς ζωὴν αἰώνιον
  choice: ins ewige Leben
  rationale: Bewahrt die Zielrichtung von εἰς, ohne näher festzulegen, ob ausschließlich Ziel, Ergebnis oder fortdauernde Bewegung im Bild gemeint ist.
theological_decisions:
- issue: Reichweite der Verheißung, keinen Durst mehr zu haben
  choice: wird in Ewigkeit keinen Durst mehr haben
  alternative: wird niemals mehr Durst haben
  rationale: Die gewählte Formulierung hält εἰς τὸν αἰῶνα sichtbar fest und bewahrt die eschatologische Weite der Aussage, ohne das Bild auf körperlichen Durst zu reduzieren oder ausdrücklich geistlich auszudeuten.
- issue: Beziehung der Quelle zum ewigen Leben
  choice: deren Wasser ins ewige Leben sprudelt
  alternative: die zum ewigen Leben hervorquillt
  rationale: Die Zielangabe wird beibehalten; die Übersetzung entscheidet nicht zusätzlich, ob das Wasser das ewige Leben vermittelt, hervorbringt oder selbst symbolisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „das ich ihm geben werde“ folgt der bewussten Wiederaufnahme im Griechischen. „Vielmehr“ markiert den Gegensatz von ἀλλά klar und natürlich.
