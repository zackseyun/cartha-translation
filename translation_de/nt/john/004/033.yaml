base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: de
  text: 'Da sagten die Jünger zueinander[a]: »Hat ihm etwa jemand etwas zu essen gebracht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hat ihm doch niemand etwas zu essen gebracht?« Die mit μή eingeleitete griechische Frage lässt eher eine verneinende Antwort erwarten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt die im Gang befindliche Unterhaltung; im natürlichen deutschen Erzählstil kann dies idiomatisch mit dem Präteritum wiedergegeben werden.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt hier die aus Jesu Worten entstehende Reaktion der Jünger im Erzählfluss weiter; »Da« drückt diesen Zusammenhang natürlich aus.
- source_word: οἱ μαθηταί
  choice: die Jünger
  rationale: »Jünger« ist die etablierte und kontextgenaue deutsche Wiedergabe von μαθηταί.
- source_word: πρὸς ἀλλήλους
  choice: zueinander
  rationale: Die Formulierung gibt das wechselseitige Gespräch innerhalb der Gruppe knapp und unmittelbar wieder.
- source_word: μή τις
  choice: Hat ihm etwa jemand …?
  rationale: Das Modalwort »etwa« lässt erkennen, dass die mit μή eingeleitete Frage eher eine verneinende Antwort erwartet, ohne sie als Gewissheit auszugeben.
- source_word: ἤνεγκεν
  choice: gebracht
  rationale: In Verbindung mit Nahrung bedeutet φέρω hier idiomatisch »bringen«.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet Jesus als Empfänger und wird im Deutschen natürlich mit »ihm« wiedergegeben.
- source_word: φαγεῖν
  choice: etwas zu essen
  rationale: Der substantivierte deutsche Infinitivausdruck gibt das zum Essen Bestimmte natürlich wieder, ohne eine im Griechischen nicht näher bestimmte Speise festzulegen.
