  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: de
  text: Er verließ Judäa und ging zurück nach Galiläa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder nach Galiläa“. Das griechische Adverb πάλιν kann „wieder“ bedeuten; hier bezeichnet es wahrscheinlich die Rückkehr nach Galiläa, daher „zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: verließ
  rationale: Das Verb ἀφίημι bedeutet hier, einen Ort hinter sich zu lassen. „Verließ“ ist im Deutschen natürlich und gibt das direkte Objekt „Judäa“ präzise wieder.
- source_word: τὴν Ἰουδαίαν
  choice: Judäa
  rationale: Die übliche und sachlich passende deutsche Bezeichnung für die geografische Region.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: ἀπέρχομαι bezeichnet hier die Bewegung von einem Ort zu einem anderen; „ging“ ist eine natürliche, ungekünstelte Wiedergabe.
- source_word: πάλιν
  choice: zurück
  rationale: Im vorliegenden Reisekontext bezeichnet πάλιν wahrscheinlich eine Rückkehr. „Zurück“ drückt dies im Deutschen idiomatisch aus, während „wieder“ näher an der formalen Mehrdeutigkeit des Adverbs liegt.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: εἰς kennzeichnet das Ziel der Bewegung. Bei geografischen Namen ohne Artikel ist „nach Galiläa“ die natürliche deutsche Form.
