source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: de
  text: 'Denn Jesus selbst hatte bezeugt: »Ein Prophet genießt in seiner eigenen Heimat[a] keine Ehre.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinem eigenen Land« oder »an seinem Heimatort«. Das griechische Wort kann das Heimatland, die Heimatgegend oder den Heimatort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum Erzählzusammenhang ein und bewahrt diese Diskursfunktion im Deutschen.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Jesus selbst
  rationale: Gibt die emphatische Stellung von αὐτός bei Ἰησοῦς natürlich und präzise wieder.
- source_word: ἐμαρτύρησεν
  choice: hatte bezeugt
  rationale: Bewahrt die für das Johannesevangelium wichtige Zeugnissprache. Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass auf eine frühere Äußerung Jesu zurückverwiesen wird, ohne den Aussagegehalt zu verändern.
- source_word: ὅτι
  choice: Doppelpunkt mit direkter Wiedergabe
  rationale: ὅτι führt den Inhalt des Zeugnisses ein. Im Deutschen gibt ein Doppelpunkt mit zitierter Aussage diese Funktion idiomatisch wieder.
- source_word: προφήτης
  choice: ein Prophet
  rationale: Der artikellose Singular hat hier sprichwörtlich-allgemeinen Sinn und wird natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: in seiner eigenen Heimat
  rationale: πατρίς kann den Heimatort, die Heimatgegend oder das Heimatland bezeichnen. „Heimat“ bewahrt diese Breite; „seiner eigenen“ bildet ἰδίᾳ samt dem idiomatisch erforderlichen Bezug ab.
- source_word: τιμὴν οὐκ ἔχει
  choice: gilt ... nichts
  rationale: Die feste deutsche Wendung drückt aus, dass jemand in einem bestimmten Umfeld keine Anerkennung oder Ehre genießt. Sie gibt den sprichwörtlichen Charakter natürlich wieder, ist jedoch etwas idiomatischer als die formnahe Alternative „keine Ehre hat“.
theological_decisions:
- issue: Geografischer Bezug von „seiner eigenen Heimat“ im johanneischen Zusammenhang
  choice: Die allgemeine Formulierung „in seiner eigenen Heimat“ bleibt ohne geografische Festlegung stehen.
  alternative: Ausdrückliche Deutung als Judäa, Galiläa oder Nazaret beziehungsweise Jesu engere Heimatregion.
  rationale: Der Vers nennt den geografischen Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die Spannung im Erzählzusammenhang und fügt keine harmonisierende Deutung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Konjunktion und die Betonung „Jesus selbst“ bleiben erhalten. Die sprichwörtliche Aussage wird idiomatisch formuliert; die Fußnote bewahrt die Bedeutungsbreite von πατρίς.
