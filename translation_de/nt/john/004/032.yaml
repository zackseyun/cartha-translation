  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: „Ich habe etwas zu essen, das ihr nicht kennt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet hier einen milden Gegensatz zur vorausgehenden Aufforderung der Jünger und leitet Jesu unerwartete Antwort ein.
- source_word: εἶπεν αὐτοῖς
  choice: er sagte zu ihnen
  rationale: Entspricht der schlichten Erzählweise des griechischen Textes und ist im modernen Deutsch natürlich.
- source_word: Ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen trägt einen leichten Nachdruck und bildet den Ausgangspunkt des Kontrasts zu „ihr“.
- source_word: βρῶσιν
  choice: eine Speise
  rationale: Gibt das konkrete Bild von Nahrung wieder und lässt den im Kontext beabsichtigten übertragenen Sinn zunächst unausgelegt. „Speise“ ermöglicht zudem einen natürlichen singularischen Bezug des Relativpronomens.
- source_word: ἔχω φαγεῖν
  choice: habe … zu essen
  rationale: Bildet die Besitzkonstruktion mit dem Infinitiv eng und verständlich nach, ohne sie interpretierend aufzulösen.
- source_word: ἣν
  choice: die
  rationale: Bezieht sich grammatisch eindeutig auf „eine Speise“ und bewahrt den direkten relativen Anschluss des Originals.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: ihr nicht kennt
  rationale: Bewahrt den Kontrast des ausdrücklich genannten ὑμεῖς und gibt οἴδατε mit einem direkten Akkusativobjekt idiomatisch wieder.
theological_decisions:
- issue: Übertragene Bedeutung von Jesu „Speise“
  choice: Das konkrete Wort „Speise“ bleibt im Haupttext stehen, ohne die Metapher zu erklären.
  alternative: Ich habe etwas, wovon ich lebe, das ihr nicht kennt.
  rationale: Der Vers soll die zunächst rätselhafte Aussage und das daraus entstehende Missverständnis bewahren; erst der folgende Kontext erläutert, worin Jesu „Speise“ besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ enger Bindung an die griechische Satzstruktur. „Speise“ ist etwas gehobener als „Essen“, hält aber die substantivische Bildsprache und den Relativsatz klar zusammen.
