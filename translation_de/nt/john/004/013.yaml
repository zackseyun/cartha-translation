  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: de
  text: 'Jesus antwortete ihr und sagte: »Wer von diesem Wasser trinkt, wird wieder Durst bekommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jesus antwortete ihr
  rationale: Die griechische Doppelformel »antwortete und sagte« ist eine übliche narrative Wendung. Im heutigen Deutschen gibt »antwortete ihr« ihre kommunikative Funktion vollständig und natürlich wieder.
- source_word: Πᾶς ὁ πίνων
  choice: Wer … trinkt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jede Person, die davon trinkt. Die deutsche Konstruktion mit »wer« ist inklusiv, idiomatisch und bewahrt den generischen Sinn.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: von diesem Wasser
  rationale: »Von diesem Wasser« gibt die Herkunftsangabe ἐκ und den demonstrativen Bezug von τούτου natürlich wieder.
- source_word: διψήσει πάλιν
  choice: wird wieder Durst bekommen
  rationale: Die Formulierung bezeichnet das erneute Einsetzen von Durst. »Durst bekommen« ist im modernen Deutschen natürlicher als das gehobene Verb »dürsten« und erhält durch »wieder« den Wiederholungsaspekt.
theological_decisions:
- issue: Wiedergabe der doppelten Redeeinleitung ἀπεκρίθη … καὶ εἶπεν
  choice: Zu »antwortete ihr« zusammenziehen
  alternative: »antwortete und sagte zu ihr«
  rationale: Im Deutschen wäre die wörtliche Doppelung auffällig und schwerfällig, während sie im Griechischen eine geläufige Erzählformel ist. Die Zusammenziehung verändert weder Sprecher, Adressatin noch Antwortcharakter.
- issue: Generisches Maskulinum Πᾶς ὁ πίνων
  choice: »Wer … trinkt«
  alternative: »Jeder, der … trinkt«
  rationale: Die Aussage gilt unabhängig vom Geschlecht. »Wer« bewahrt den universalen, generischen Umfang ohne eine männliche Einschränkung einzutragen.
- issue: Bildliche Spannung im Gespräch über Wasser
  choice: Die Aussage zunächst auf »dieses Wasser« und erneuten Durst beziehen
  alternative: Die geistliche Bedeutung bereits ausdrücklich auslegen
  rationale: Der Vers hält die Gesprächsebene bewusst offen und entfaltet die geistliche Gegenüberstellung erst im Fortgang. Die Übersetzung fügt daher keine Deutung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Deutsch. Die direkte Rede ist knapp gehalten; »Durst bekommen« klingt natürlich und gibt den zukünftigen erneuten Durst präzise wieder.
