  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: de
  text: 'Da ließ die Frau ihren Wasserkrug stehen, ging in die Stadt und sagt zu den Leuten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: ließ … stehen
  rationale: Im Zusammenhang bedeutet das Verb, dass sie den Wasserkrug am Brunnen zurückließ; die idiomatische Wendung gibt dies im Deutschen natürlich wieder.
- source_word: ὑδρίαν
  choice: Wasserkrug
  rationale: Bezeichnet hier ein Gefäß zum Holen und Aufbewahren von Wasser.
- source_word: πόλιν
  choice: Stadt
  rationale: Entspricht der üblichen Bedeutung und passt zur Bezeichnung des Ortes im Erzählzusammenhang.
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Textes wird bewusst bewahrt und erzeugt einen lebendigen Übergang zur folgenden direkten Rede.
- source_word: τοῖς ἀνθρώποις
  choice: zu den Leuten
  rationale: Die kontextuell natürliche, inklusive Wiedergabe bezeichnet die Menschen im Ort, ohne das griechische Substantiv unnötig auf Männer einzugrenzen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das auffällige historische Präsens „sagt“ bleibt entsprechend dem griechischen Tempus und der revidierten englischen Konsultationsfassung erhalten.
