source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: de
  text: 'Die Frau sagte zu ihm: „Herr[a], gib mir dieses Wasser, damit ich keinen Durst habe und nicht hierherkomme, um Wasser zu schöpfen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder (als höfliche Anrede): „Mein Herr“.'
    reason: Κύριε kann hier sowohl „Herr“ als auch eine respektvolle Anrede ausdrücken.
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben, ohne seine Erzählfunktion zu verändern.
- source_word: γυνή
  choice: die Frau
  rationale: Gemeint ist im Kontext die samaritanische Frau; „Frau“ ist eindeutig und idiomatisch.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt sowohl die mögliche respektvolle Anrede als auch den tieferen johanneischen Bedeutungsanklang; die alltagssprachliche Alternative steht in der Fußnote.
- source_word: δός μοι
  choice: gib mir
  rationale: Die direkte Bitte des griechischen Imperativs wird schlicht und idiomatisch wiedergegeben.
- source_word: τοῦτο τὸ ὕδωρ
  choice: dieses Wasser
  rationale: Der Vers sagt nur „dieses Wasser“; „lebendig“ wird aus dem weiteren Kontext nicht ergänzt.
- source_word: ἵνα μὴ διψῶ
  choice: damit ich keinen Durst mehr habe
  rationale: „Damit“ gibt den Zweck- beziehungsweise Folgesinn natürlich wieder. „Mehr“ verdeutlicht im Deutschen die erwartete Beendigung des wiederkehrenden Durstes, die im Kontext und im präsentischen Verb liegt.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: und nicht mehr hierherkommen muss
  rationale: Die zweite verneinte Folge wird idiomatisch koordiniert; „muss“ macht den praktisch gemeinten Aufwand deutlich, ohne eine neue inhaltliche Behauptung einzuführen.
- source_word: ἀντλεῖν
  choice: um zu schöpfen
  rationale: „Schöpfen“ bezeichnet im Brunnenkontext eindeutig das Wasserschöpfen; das im Griechischen unausgesprochene Objekt muss nicht wiederholt werden.
theological_decisions:
- issue: Bedeutung von κύριος in der Anrede der samaritanischen Frau
  choice: Herr
  alternative: Mein Herr; verehrter Herr
  rationale: Die unmittelbare Gesprächssituation erlaubt eine höfliche Anrede, während das Johannesevangelium zugleich eine weitergehende Bedeutung anklingen lassen kann. „Herr“ bewahrt diese Spannung; die rein höfliche Lesart wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig und alltagstauglich, ohne die mögliche theologische Mehrdeutigkeit von „Herr“ einzuebnen.
