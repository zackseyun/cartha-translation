  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. Die Formulierung „saß nun, von der Reise ermüdet, so am Brunnen“ ist leicht markiert, bewahrt aber bewusst die im Griechischen schwierige Wendung οὕτως, ohne eine nicht gesicherte Deutung in den Text einzutragen.
