lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: Jakobsbrunnen
  rationale: πηγή kann eine Quelle oder einen Brunnen bezeichnen. Im Zusammenhang mit dem Wasserschöpfen und als traditionelle Ortsbezeichnung ist „Jakobsbrunnen“ im Deutschen am natürlichsten; die lexikalische Alternative bleibt in einer Fußnote erhalten.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: müde von der Reise
  rationale: Das Perfektpartizip beschreibt den durch die Reise entstandenen und fortdauernden Erschöpfungszustand. „Müde“ ist natürlich und verständlich, ohne die körperliche Anstrengung abzuschwächen.
- source_word: ἐκαθέζετο οὕτως
  choice: setzte sich so, wie er war
  rationale: „Setzte sich“ gibt das kontextuell naheliegende Niederlassen wieder. Das schwierige οὕτως wird nicht ausgelassen oder bloß räumlich umgedeutet, sondern als Hinweis auf Jesu erschöpften Zustand beziehungsweise die Art seines Niedersitzens bewahrt.
- source_word: ἐπὶ τῇ πηγῇ
  choice: an den Brunnen
  rationale: ἐπί mit Dativ ist hier lokal. In Verbindung mit „sich setzen“ ist „an den Brunnen“ idiomatisches modernes Deutsch und bezeichnet die unmittelbare Nähe.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Es war etwa die sechste Stunde
  rationale: Die wörtliche Zeitangabe bleibt erhalten, da der griechische Text ihre Entsprechung auf einer modernen Uhr nicht ausdrücklich festlegt. „Etwa“ gibt ὡς wieder.
- source_word: δὲ / οὖν
  choice: Dort / also
  rationale: Das schwache δέ wird nicht mit einem unnötig schweren Bindewort überladen; die natürliche deutsche Satzfolge trägt den Übergang. οὖν wird mit „also“ als folgernder narrativer Anschluss wiedergegeben.
theological_decisions:
- issue: Zeitbezug der „sechsten Stunde“
  choice: Die Quellenformulierung „etwa die sechste Stunde“ bleibt im Haupttext stehen.
  alternative: Etwa Mittag; nach einer hypothetischen römischen Zählweise etwa 6 Uhr.
  rationale: Der Text nennt kein modernes Uhrzeitäquivalent. Die wörtliche Formulierung bewahrt die chronologische Offenheit; die geläufigste historische Einordnung wird lediglich in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Jakobsbrunnen“ folgt dem etablierten deutschen Sprachgebrauch. Die ungewöhnliche Wendung οὕτως wird im Haupttext sichtbar bewahrt; die Zeitangabe wird nicht vorschnell in eine moderne Uhrzeit aufgelöst.
