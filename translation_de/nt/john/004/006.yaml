  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: de
  text: Dort war der Jakobsbrunnen[a]. Jesus saß nun, von der Reise ermüdet, so am Brunnen[b]. Es war etwa die sechste Stunde[c].
  philosophy: optimal-equivalence
  footnotes:
