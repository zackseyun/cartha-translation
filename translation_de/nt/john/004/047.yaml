review_pass:
  verdict: revise
  source_fidelity: Der Vers wird insgesamt treffend wiedergegeben. „Lag im Sterben“ bezeichnet jedoch eher einen bereits andauernden Sterbeprozess, während ἤμελλεν ἀποθνῄσκειν das unmittelbar bevorstehende Sterben ausdrückt. „Stand kurz vor dem Tod“ bewahrt diese Nuance klarer.
  naturalness: Der Satz ist modernes, gut lesbares Standarddeutsch. „Stand kurz vor dem Tod“ ist idiomatisch und im erzählerischen Register angemessen.
  terminology: „Dieser Mann“, „Judäa“, „Galiläa“, „hinabzukommen“ und „heilen“ sind sachgerecht. Die Fußnote zu „hinabzukommen“ erklärt den topographischen Bezug angemessen.
  issues:
  - severity: medium
    issue: „der lag im Sterben“ schwächt die Imminenz von ἤμελλεν ἀποθνῄσκειν ab.
    rationale: Die griechische Konstruktion μέλλω mit Infinitiv besagt, dass der Sohn kurz davor war zu sterben. Die deutsche Formulierung kann dagegen nahelegen, dass der Sterbeprozess bereits eingesetzt hatte.
  - severity: low
    issue: Fußnote b ist nach der Korrektur entbehrlich.
    rationale: Wenn der Haupttext die Imminenz direkt mit „stand kurz vor dem Tod“ ausdrückt, ist eine als „wörtlich“ bezeichnete Erläuterung nicht erforderlich; zudem wäre „im Begriff zu sterben“ eher eine sinngemäße als eine streng wörtliche Wiedergabe.
  revised_text: Als dieser Mann hörte, dass Jesus aus Judäa nach Galiläa gekommen war, ging er zu ihm und bat ihn, hinabzukommen[a] und seinen Sohn zu heilen; denn er stand kurz vor dem Tod.
  revised_footnotes:
