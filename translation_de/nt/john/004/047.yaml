revisions:
- from: Als dieser Mann hörte, dass Jesus aus Judäa nach Galiläa gekommen war, ging er zu ihm und bat ihn, hinabzukommen[a] und seinen Sohn zu heilen; denn der lag im Sterben.[b]
  to: Als dieser Mann hörte, dass Jesus aus Judäa nach Galiläa gekommen war, ging er zu ihm und bat ihn, hinabzukommen[a] und seinen Sohn zu heilen; denn er stand kurz vor dem Tod.
  rationale: Die Schlussklausel wurde angepasst, damit die durch μέλλω ausgedrückte unmittelbare Todesnähe des Sohnes erhalten bleibt. Der Bezug von „er“ ist durch den Kontext eindeutig; ein demonstratives „der“ ist nicht nötig. Die nun redundante Fußnote b wurde entfernt.
