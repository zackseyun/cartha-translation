source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: de
  text: Als dieser Mann hörte, dass Jesus aus Judäa nach Galiläa gekommen war, ging er zu ihm und bat ihn, hinabzukommen[a] und seinen Sohn zu heilen; denn er stand kurz vor dem Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hinabzukommen“ beschreibt die Bewegung von dem höher gelegenen Kana nach Kafarnaum.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: dieser Mann
  rationale: Der Ausdruck bewahrt die demonstrative Kraft und verweist natürlich auf den königlichen Beamten aus dem vorhergehenden Vers.
- source_word: ἀκούσας
  choice: als ... hörte
  rationale: Das Aoristpartizip wird als zeitlicher Nebensatz wiedergegeben; das ist im Deutschen natürlich und erhält den Zusammenhang mit der Haupthandlung.
- source_word: ἥκει
  choice: gekommen war
  rationale: ἥκω bezeichnet das erfolgte Kommen mit gegenwärtigem Ergebnis; im Bericht über das Gehörte passt das Plusquamperfekt.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: aus Judäa nach Galiläa
  rationale: Die Wiedergabe erhält Ausgangspunkt und Zielrichtung in idiomatischem Deutsch.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ging er zu ihm
  rationale: Die Formulierung gibt die Ortsbewegung klar und natürlich wieder.
- source_word: ἠρώτα
  choice: bat ihn
  rationale: ἐρωτάω bedeutet hier im Kontext einer Bitte „bitten“. Das Imperfekt kann einen andauernden Vorgang anzeigen, erzwingt aber keine ausdrückliche iterative Wiedergabe wie „bat ihn immer wieder“.
- source_word: ἵνα καταβῇ
  choice: hinabzukommen
  rationale: Nach „bitten“ ist die Infinitivkonstruktion idiomatisch; „hinab“ bewahrt die im Verb enthaltene Abwärtsbewegung.
- source_word: ἰάσηται
  choice: zu heilen
  rationale: „Heilen“ ist die klare und übliche Entsprechung für körperliche Heilung.
- source_word: αὐτοῦ τὸν υἱόν
  choice: seinen Sohn
  rationale: Dies ist die natürliche deutsche Wiedergabe der Genitivverbindung.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: denn der lag im Sterben
  rationale: Die Wendung drückt die unmittelbar drohende Todesgefahr natürlich aus; das Demonstrativpronomen macht den Bezug auf den Sohn eindeutig.
theological_decisions:
- issue: Bezugswort von ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: Die Aussage bezieht sich auf den Sohn.
  alternative: Bezug auf Jesus oder den Beamten
  rationale: Der Sohn ist das nächstliegende Bezugswort und im Zusammenhang eindeutig derjenige, dessen Tod unmittelbar bevorsteht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Dieser Mann“ hält den Rückbezug ausdrücklich fest; „bat ihn“ vermeidet eine nicht zwingende Festlegung des Imperfekts auf wiederholtes Bitten. Sämtliche Fußnotenmarker stehen im Haupttext.
