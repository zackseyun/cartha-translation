id: JHN.4.54
reference: John 4:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: de
  text: Dies wiederum war das zweite Zeichen, das Jesus tat, nachdem er aus Judäa nach Galiläa gekommen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunder“. Johannes nennt solche Taten häufig „Zeichen“ und hebt damit neben ihrer Macht auch ihre Bedeutung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Dies
  rationale: Das Demonstrativpronomen verweist auf die unmittelbar zuvor erzählte Heilung; „Dies“ gibt den Rückverweis knapp und natürlich wieder.
- source_word: δὲ πάλιν
  choice: wiederum
  rationale: δέ verbindet den Satz locker mit dem Vorhergehenden, während πάλιν die Wiederholung beziehungsweise erneute Zählung ausdrückt; „wiederum“ bildet beides flüssig ab.
- source_word: δεύτερον
  choice: das zweite
  rationale: Das Ordinalzahlwort bestimmt „Zeichen“ und wird im Deutschen idiomatisch mit bestimmtem Artikel wiedergegeben.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den für das Johannesevangelium wichtigen Hinweischarakter der Tat und reduziert sie nicht auf ein bloßes Wunderereignis.
- source_word: ἐποίησεν
  choice: tat
  rationale: ποιέω bildet mit σημεῖον eine einfache verbale Verbindung; „tat“ ist würdig, verständlich und näher an der schlichten Ausdrucksweise als „vollbrachte“.
- source_word: ἐλθὼν
  choice: nachdem er … gekommen war
  rationale: Das Aoristpartizip hat hier plausibel temporale, vorzeitige Bedeutung und wird in natürlichem Deutsch als Nebensatz wiedergegeben.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: aus Judäa nach Galiläa
  rationale: Die Präpositionen markieren Ausgangspunkt und Ziel der Bewegung; „aus … nach …“ ist dafür die natürliche deutsche Formulierung.
theological_decisions:
- issue: Johanneischer Gebrauch von σημεῖον
  choice: Zeichen
  alternative: Wunder
  rationale: „Zeichen“ erhält die literarische und theologische Funktion der Tat als Hinweis auf Jesu Identität und Wirken, ohne diese Bedeutung im Text weiter auszudeuten.
- issue: Bezug von δεύτερον und πάλιν
  choice: „wiederum … das zweite Zeichen“ ohne erklärende Ergänzung
  alternative: „das zweite Zeichen nach seiner Rückkehr aus Judäa“
  rationale: Die griechische Formulierung kann im Zusammenhang als Zählung der in Galiläa nach der Judäareise vollbrachten Zeichen verstanden werden. Die Übersetzung bewahrt die Syntax und fügt keine ausdrückliche Eingrenzung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Wiederum“ bewahrt die knappe Verbindung und Wiederholungsnuance; „tat“ vermeidet unnötig gehobene Formulierungen.
