  verdict: approve
  source_fidelity: „Und noch viel mehr Menschen glaubten wegen seines Wortes“ gibt καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ zuverlässig wieder. „Noch viel mehr“ bildet den durch πολλῷ verstärkten Komparativ πλείους ab; „Menschen“ macht den im Griechischen substantivierten Personenbezug idiomatisch explizit. „Glaubten“ bewahrt die objektlose Form von ἐπίστευσαν, und „wegen seines Wortes“ entspricht der kausalen Bedeutung von διά mit Akkusativ sowie λόγος αὐτοῦ im Kontext.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und im knappen erzählerischen Register des Evangeliums angemessen. Die Wortfolge hebt die zahlenmäßige Steigerung natürlich hervor.
  terminology: „Wort“ ist als Wiedergabe von λόγος kontextgemäß und bewahrt die johanneische Ausdrucksweise, ohne den Begriff unnötig zu erläutern. Die Fußnote mit „Botschaft“ bietet eine sachgerechte idiomatische Alternative. Die Wiedergabe von πιστεύω als „glaubten“ fügt kein im griechischen Satz nicht ausgedrücktes Glaubensobjekt hinzu.
