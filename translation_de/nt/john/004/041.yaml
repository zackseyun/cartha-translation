  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: de
  text: Und noch viel mehr Menschen glaubten wegen seines Wortes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen seiner Botschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: noch viel mehr Menschen
  rationale: πολλῷ verstärkt den Komparativ πλείους. „Noch viel mehr Menschen“ gibt sowohl die deutliche Steigerung als auch den Anschluss an die zuvor Glaubenden natürlich wieder; „Menschen“ verdeutlicht lediglich den im substantivierten Komparativ enthaltenen Personenbezug.
- source_word: ἐπίστευσαν
  choice: glaubten
  rationale: Der Aorist von πιστεύω wird schlicht mit „glaubten“ wiedergegeben. Eine Formulierung wie „kamen zum Glauben“ würde den ingressiven Aspekt stärker festlegen, als es die Verbform allein verlangt.
- source_word: διὰ
  choice: wegen
  rationale: διά mit Akkusativ bezeichnet hier den Grund beziehungsweise Anlass ihres Glaubens. „Wegen“ ist im modernen Deutschen knapp und natürlich.
- source_word: τὸν λόγον
  choice: seines Wortes
  rationale: λόγος bezeichnet hier Jesu gesprochenes Wort beziehungsweise seine Botschaft. „Wort“ bewahrt den johanneischen Sprachgebrauch und bleibt im Kontext verständlich.
- source_word: αὐτοῦ
  choice: seines
  rationale: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf Jesus; der Genitiv ist durch die Präposition „wegen“ bedingt.
theological_decisions:
- issue: Wiedergabe von πιστεύω ohne ausdrückliches Objekt
  choice: glaubten
  alternative: glaubten an ihn / kamen zum Glauben
  rationale: Der griechische Vers nennt kein ausdrückliches Objekt. Die knappe Wiedergabe bewahrt diese Form und überlässt es dem Kontext, Jesus als Bezug ihres Glaubens erkennen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich und bewahrt die hervorgehobene quantitative Steigerung. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die lexikalische Alternative bezieht.
