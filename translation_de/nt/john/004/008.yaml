base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: de
  text: Seine Jünger waren nämlich in die Stadt gegangen, um Lebensmittel zu kaufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: nämlich
  rationale: Die Partikel erläutert die vorausgehende Erzählsituation. Im Deutschen stellt „nämlich“ diesen rückbezüglichen Erklärungszusammenhang natürlicher her als ein vorangestelltes „denn“.
- source_word: μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Natürliche possessive Wiedergabe; „Jünger“ ist im johanneischen Erzählzusammenhang die etablierte und sachlich passende Entsprechung für μαθηταί.
- source_word: ἀπεληλύθεισαν
  choice: waren … gegangen
  rationale: Das Plusquamperfekt gibt die Vorzeitigkeit der Handlung gegenüber der aktuellen Szene wieder; „gegangen“ drückt das Entfernen im Deutschen idiomatisch aus.
- source_word: εἰς τὴν πόλιν
  choice: in die Stadt
  rationale: εἰς mit Akkusativ bezeichnet die Bewegung zum beziehungsweise in den Ort hinein. „In die Stadt“ ist die natürliche deutsche Richtungsangabe und gibt πόλις direkt wieder.
- source_word: ἵνα
  choice: um … zu
  rationale: Die Konstruktion bezeichnet hier den Zweck; der deutsche Infinitivsatz mit „um … zu“ bewahrt diese Funktion klar und idiomatisch.
- source_word: τροφὰς
  choice: Lebensmittel
  rationale: Der Plural bezeichnet hier Nahrung beziehungsweise Vorräte zum Kauf. „Lebensmittel“ ist eine natürliche, konkrete deutsche Wiedergabe, ohne Mehrzahlformen wie „Speisen“ aufzudrängen.
- source_word: ἀγοράσωσιν
  choice: kaufen
  rationale: Der Aorist Konjunktiv nach ἵνα bezeichnet die beabsichtigte Handlung; „kaufen“ ist die schlichte moderne Entsprechung.
theological_decisions: []
