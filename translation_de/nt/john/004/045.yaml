  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: de
  text: Als er nun nach Galiläa kam, nahmen ihn die Galiläer freundlich auf[a], da sie alles gesehen hatten, was er in Jerusalem auf dem Fest[b] getan hatte; denn auch sie waren zu dem Fest gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nahmen ihn auf“. Das griechische Verb kann sowohl das Aufnehmen als auch einen freundlichen Empfang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Festfeier“. Gemeint ist ein religiöses Fest in Jerusalem, wahrscheinlich das zuvor erwähnte Passafest.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Als er nun
  rationale: „Nun“ bewahrt die fortführende beziehungsweise folgernde Kraft von οὖν, während „als“ den temporalen Nebensatz natürlich einleitet.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa kam
  rationale: Die Verbindung mit εἰς bezeichnet die Bewegung in die Region hinein; im Deutschen ist „nach Galiläa kommen“ die natürliche Wiedergabe.
- source_word: ἐδέξαντο αὐτὸν
  choice: nahmen ihn freundlich auf
  rationale: δέχομαι kann „aufnehmen“ oder „willkommen heißen“ bedeuten. Die Formulierung gibt den hier naheliegenden positiven Empfang wieder, ohne das Grundmotiv des Aufnehmens ganz aufzugeben.
- source_word: οἱ Γαλιλαῖοι
  choice: die Galiläer
  rationale: Direkte und im Deutschen geläufige geografische Personenbezeichnung.
- source_word: πάντα ἑωρακότες ὅσα
  choice: denn sie hatten alles gesehen, was
  rationale: Das Perfektpartizip bezeichnet ein vorausgehendes Sehen mit fortwirkender Bedeutung. Die kausale Auflösung mit „denn“ macht den Zusammenhang im Deutschen klar, ohne einen vom Kontext unabhängigen neuen Grund einzuführen.
- source_word: ἐποίησεν
  choice: getan hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Jesu Taten zeitlich vor dem Empfang in Galiläa lagen.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Natürliche Wiedergabe der Ortsangabe.
- source_word: ἐν τῇ ἑορτῇ
  choice: auf dem Fest
  rationale: ἑορτή bezeichnet hier ein religiöses Fest; „auf dem Fest“ ist eine natürliche deutsche Zeit- und Situationsangabe.
- source_word: καὶ αὐτοὶ γὰρ
  choice: auch sie selbst waren nämlich
  rationale: „Nämlich“ wahrt die erklärende Funktion von γάρ; „auch sie selbst“ erhält sowohl den einschließenden Sinn von καί als auch die Hervorhebung durch αὐτοί.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: waren zu dem Fest gekommen
  rationale: Das Plusquamperfekt stellt ihren vorausgegangenen Festbesuch klar heraus. „Zu dem Fest gekommen“ wahrt zudem das Bewegungsverb ἦλθον.
theological_decisions:
- issue: Beweggrund des freundlichen Empfangs
  choice: Die Partizipialkonstruktion wird mit „denn“ kausal wiedergegeben.
  alternative: 'Formal enger: „nachdem sie alles gesehen hatten“ oder „da sie alles gesehen hatten“.'
  rationale: Der Zusammenhang legt nahe, dass ihre Beobachtung von Jesu Taten den Empfang erklärt. Die Wiedergabe lässt zugleich die johanneische Spannung bestehen, dass ein an Zeichen orientierter Empfang nicht notwendig tiefen Glauben bedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Gedankenfolge, wird jedoch durch die kausale Auflösung des Partizips und das deutsche Plusquamperfekt flüssig und verständlich.
