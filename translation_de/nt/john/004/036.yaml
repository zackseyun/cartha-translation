source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: de
  text: Wer erntet, empfängt Lohn[a] und sammelt Frucht zum ewigen Leben[b], damit sich der, der sät, und der, der erntet, gemeinsam freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Belohnung«. Das griechische Wort kann sowohl Arbeitslohn als auch eine Belohnung oder Vergeltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für das ewige Leben«. Die Wendung kann Ziel oder Ergebnis ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: wer erntet / der, der erntet
  rationale: Das substantivierte Präsenspartizip bezeichnet die erntende Person. Die Relativkonstruktion klingt im heutigen Deutsch natürlicher als »der Erntende« und bewahrt den verbalen Charakter.
- source_word: μισθὸν λαμβάνει
  choice: empfängt Lohn
  rationale: μισθός kann Arbeitslohn oder allgemeiner eine Belohnung beziehungsweise Vergeltung bezeichnen. »Lohn« erhält sowohl das konkrete Erntebild als auch die weitere Bedeutungsmöglichkeit; »empfängt« gibt λαμβάνει würdig und gegenwartsbezogen wieder.
- source_word: συνάγει καρπὸν
  choice: sammelt Frucht
  rationale: Die Wiedergabe bewahrt das Erntebild und vermeidet, καρπός mit »Ernte« gleichzusetzen, wodurch die Unterscheidung zwischen Ernten und Einsammeln verwischt würde.
- source_word: εἰς ζωὴν αἰώνιον
  choice: für das ewige Leben
  rationale: εἰς bezeichnet hier die Ausrichtung auf ein Ziel beziehungsweise ein Ergebnis. Die deutsche Formulierung ist natürlich, ohne diese Nuance eindeutig auf nur eine Möglichkeit festzulegen.
- source_word: ὁ σπείρων
  choice: der, der sät
  rationale: Die Relativkonstruktion bildet das substantivierte Präsenspartizip ab und steht parallel zu »der, der erntet«.
- source_word: ὁμοῦ χαίρῃ
  choice: sich gemeinsam freuen
  rationale: »Gemeinsam« gibt ὁμοῦ als geteilte Freude wieder; der Konjunktiv nach ἵνα wird durch den deutschen damit-Satz angemessen ausgedrückt.
theological_decisions:
- issue: Zeitliche Unmittelbarkeit der gegenwärtigen Ernte
  choice: Kein zusätzliches »schon« oder »bereits« eingefügt
  alternative: »Wer erntet, empfängt bereits Lohn …«
  rationale: Die Präsensformen zeigen ein gegenwärtiges Geschehen, doch im vorliegenden griechischen Satz steht kein eigenes Adverb für »bereits«. Der Kontext kann die Unmittelbarkeit vermitteln, ohne dass sie im Vers ausdrücklich ergänzt wird.
- issue: Funktion von εἰς ζωὴν αἰώνιον
  choice: »für das ewige Leben« mit Fußnote zur Ziel-/Ergebnisnuance
  alternative: »zum ewigen Leben«
  rationale: Die Formulierung lässt offen, ob vor allem Zielrichtung oder Ergebnis betont ist, und vermeidet eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederholte Konstruktion »der, der …« ist bewusst gewählt, um die Parallelität der beiden substantivierten griechischen Partizipien zu erhalten, ohne das heute weniger natürliche »der Säende / der Erntende« zu verwenden.
