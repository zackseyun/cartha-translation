  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: die erntende Person empfängt Lohn und sammelt Frucht, mit dem Ziel, dass Säender und Erntender gemeinsam Freude haben. Die Präsensformen und die finale Funktion von ἵνα sind angemessen erfasst. Bei εἰς ζωὴν αἰώνιον ist jedoch »zum ewigen Leben« die im Deutschen präzisere und idiomatischere Wiedergabe der ziel- bzw. ergebnisgerichteten Präposition εἰς als »für das ewige Leben«.'
  naturalness: Das Deutsch ist insgesamt modernes Standarddeutsch. Die bewusste Wiederholung »der, der ...« ist etwas schwerfällig, aber klar, natürlich genug und erhält die Parallelität der griechischen Partizipien. »Frucht zum ewigen Leben« klingt in diesem Kontext deutlich natürlicher als »Frucht für das ewige Leben«.
  terminology: »Lohn« entspricht μισθός gut und bewahrt sowohl den konkreten Arbeitslohn als auch die weitergehende Bedeutung von Belohnung. »Ewiges Leben« ist der etablierte und angemessene Ausdruck für ζωὴ αἰώνιος. Die Fußnotenalternativen sind nach Anpassung des Haupttexts stimmig.
