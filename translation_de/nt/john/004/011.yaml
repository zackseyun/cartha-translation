id: JHN.4.11
reference: John 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: de
  text: 'Die Frau sagte zu ihm: „Herr[a], du hast nicht einmal ein Schöpfgefäß, und der Brunnen ist tief. Woher hast du also das lebendige Wasser[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herr.“ Das griechische Wort kann hier auch eine höfliche Anrede sein.'
    reason: alternative_reading
  - marker: b
    text: Der Ausdruck kann auch „fließendes Wasser“ oder „Quellwasser“ bedeuten. Die wörtliche Wiedergabe bewahrt zugleich den tieferen Sinn der Aussage Jesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: Im Zusammenhang ist die samaritanische Frau am Brunnen gemeint, nicht eine Ehefrau.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt die übliche Wiedergabe von κύριε; zugleich kann das Wort hier lediglich eine höfliche Anrede sein, was die Fußnote kenntlich macht.
- source_word: οὔτε ἄντλημα ἔχεις
  choice: du hast nicht einmal ein Schöpfgefäß
  rationale: Das alleinstehende οὔτε hebt hier hervor, dass Jesus keinerlei Gerät zum Wasserschöpfen hat. „Nicht einmal“ gibt diese Aussage im Deutschen klar wieder; „Schöpfgefäß“ bezeichnet den Gegenstand genauer als ein bloßes „Gefäß“.
- source_word: τὸ φρέαρ
  choice: der Brunnen
  rationale: φρέαρ bezeichnet hier den tiefen Brunnen, aus dem Wasser geschöpft wird.
- source_word: βαθύ
  choice: tief
  rationale: Die einfache Adjektivform wird ohne verstärkenden Zusatz wiedergegeben.
- source_word: πόθεν οὖν
  choice: Woher ... also
  rationale: „Woher“ fragt nach der Herkunft, während „also“ den Schluss aus dem fehlenden Schöpfgefäß und der Tiefe des Brunnens ausdrückt.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: das lebendige Wasser
  rationale: Die wörtliche Formulierung bewahrt sowohl die gewöhnliche Bedeutung von frischem, fließendem Wasser als auch den tieferen Sinn im Johannesevangelium.
theological_decisions:
- issue: Bedeutung von κύριε in der Anrede der samaritanischen Frau
  choice: Herr
  alternative: mein Herr; verehrter Herr
  rationale: Zu diesem Zeitpunkt kann κύριε eine respektvolle Anrede sein, ohne bereits ein theologisches Bekenntnis auszudrücken. Die Hauptübersetzung wahrt den traditionellen Titel, die Fußnote macht die höfliche Bedeutung sichtbar.
- issue: Doppelsinn von ὕδωρ τὸ ζῶν
  choice: das lebendige Wasser
  alternative: das fließende Wasser; das Quellwasser
  rationale: Im gewöhnlichen Sprachgebrauch kann der Ausdruck frisches oder fließendes Wasser bezeichnen, während Jesu Aussage zugleich einen tieferen theologischen Sinn trägt. „Lebendiges Wasser“ lässt beide Ebenen bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schöpfgefäß“ ist sachlich präzise und im Zusammenhang verständlich. Die Satzstruktur folgt dem griechischen Gedankengang, ohne die im englischen Beratungstext entstandene unzutreffende korrelative Konstruktion („neither ... nor“) zu übernehmen.
