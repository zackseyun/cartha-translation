id: JHN.4.29
reference: John 4:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: de
  text: Kommt und seht einen Mann, der mir alles gesagt hat, was ich getan habe! Ist dieser etwa der Messias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sollte dieser der Messias sein?“'
    reason: Alternative Wiedergabe der zögernden, prüfenden Frage mit μήτι.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Kommt und seht
  rationale: Die Verbindung gibt eine unmittelbare Einladung wieder; die Formulierung ist im heutigen Deutsch natürlich und bewahrt beide Imperative.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Das Substantiv bezeichnet hier eine einzelne männliche Person und bezieht sich auf Jesus.
- source_word: ὃς εἶπέ μοι
  choice: der mir … gesagt hat
  rationale: λέγω mit Dativ wird in diesem Zusammenhang idiomatisch mit „jemandem etwas sagen“ wiedergegeben.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die Wendung betont die Gesamtheit dessen, worüber Jesus gesprochen hat; „alles, was“ bildet diese umfassende Aussage klar ab.
- source_word: ἐποίησα
  choice: ich getan habe
  rationale: Das Perfekt ist im Deutschen für vergangene Handlungen mit gegenwärtiger Bedeutung natürlich und entspricht dem Zeugnischarakter der Aussage.
- source_word: μήτι
  choice: Ist dieser etwa …?
  rationale: „etwa“ bewahrt den vorsichtigen, prüfenden Charakter der Frage, die formal eher eine verneinende Antwort erwarten kann, hier aber zugleich zum Nachdenken einlädt.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός steht als jüdischer Hoheitstitel; „Messias“ gibt diesen Titel im Kontext verständlich wieder.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Im Gespräch über die erwartete Heilsgestalt dient Χριστός als Titel und nicht als Eigenname. „Messias“ wahrt den jüdischen Erwartungshorizont.
- issue: Zurückhaltung der Frage mit μήτι
  choice: Ist dieser etwa der Messias?
  alternative: Sollte dieser der Messias sein?
  rationale: Die Hauptfassung lässt sowohl die grammatisch angelegte Zurückhaltung als auch die kontextuelle Einladung zur Prüfung erkennen, ohne die Frage in eine feste Behauptung umzudeuten.
translation_notes:
  register: Moderne, mündlich wirkende und zugleich würdevolle Einladung. Das Ausrufezeichen nach der Zeugenaussage und die anschließende vorsichtige Frage bilden die lebhafte Rede der Frau ab.
