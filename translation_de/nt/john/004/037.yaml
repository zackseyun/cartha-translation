  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: de
  text: 'Denn darin erweist sich das Sprichwort als wahr: Der eine sät, und ein anderer erntet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Denn darin ist der Ausspruch wahr: Einer ist der Säende, und ein anderer der Erntende.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Denn darin
  rationale: „Denn“ bewahrt die begründende Verknüpfung mit dem vorangehenden Gedanken; „darin“ verweist knapp und natürlich auf die eben beschriebene Situation.
- source_word: ὁ λόγος
  choice: das Sprichwort
  rationale: λόγος bezeichnet hier einen bekannten Ausspruch beziehungsweise eine allgemeine Lebensregel. „Sprichwort“ passt zum folgenden, prägnant formulierten Satz, ohne λόγος christologisch als „das Wort“ misszuverstehen.
- source_word: ἐστὶν ἀληθινός
  choice: erweist sich … als wahr
  rationale: Diese idiomatische deutsche Wendung gibt wieder, dass sich die Gültigkeit des Ausspruchs gerade an dieser Situation zeigt. Das einfache „ist wahr“ bleibt als mögliche, formal nähere Wiedergabe in der Fußnote erhalten.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt den Inhalt des Ausspruchs im Deutschen natürlich und klar ein.
- source_word: ἄλλος … καὶ ἄλλος
  choice: der eine … und ein anderer
  rationale: Die Formulierung wahrt den Kontrast zwischen zwei verschiedenen Beteiligten, ohne sie näher zu bestimmen.
- source_word: ὁ σπείρων
  choice: der eine sät
  rationale: Das substantivierte Präsenspartizip wird als natürlicher deutscher Satz wiedergegeben; die fortdauernde beziehungsweise charakterisierende Tätigkeit bleibt erkennbar.
- source_word: ὁ θερίζων
  choice: ein anderer erntet
  rationale: Die finite Form ist im Deutschen idiomatisch und erhält den prägnanten Parallelismus mit „sät“.
theological_decisions:
- issue: Identität des Säenden und des Erntenden
  choice: Die beiden Beteiligten bleiben unbestimmt.
  alternative: Den Säenden etwa mit Jesus, Johannes dem Täufer oder den Propheten und den Erntenden mit den Jüngern gleichzusetzen.
  rationale: Der griechische Vers nennt die konkreten Bezugspersonen nicht. Ihre Deutung ergibt sich erst aus dem Zusammenhang und soll nicht in den Wortlaut eingetragen werden.
- issue: Charakter des λόγος
  choice: Als allgemeiner, in dieser Situation bestätigter Ausspruch wiedergegeben.
  alternative: λόγος als theologischen Titel „das Wort“ zu verstehen.
  rationale: Der nachfolgende ὅτι-Satz gibt den Inhalt eines Ausspruchs an; ein christologischer Titel ist hier weder grammatisch noch kontextuell angezeigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sprichwortartige Kürze und der Gegensatz der beiden Tätigkeiten werden bewahrt; die Fußnote dokumentiert die formal nähere Struktur und die breitere Bedeutung von λόγος.
