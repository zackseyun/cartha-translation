id: JHN.4.25
reference: John 4:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: de
  text: 'Die Frau sagt zu ihm: „Ich weiß, dass der Messias kommt, der Christus genannt wird.[a] Wenn er kommt, wird er uns alles mitteilen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Messias“ ist die semitische, „Christus“ die griechische Bezeichnung; beide bedeuten „Gesalbter“.
    reason: Die Anmerkung macht die im griechischen Text angelegte sprachliche Erklärung für heutige deutschsprachige Leser verständlich.
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens lässt sich im Deutschen natürlich beibehalten und vergegenwärtigt die Erzählung.
- source_word: γυνή
  choice: die Frau
  rationale: Im Zusammenhang ist eindeutig die samaritanische Frau gemeint.
- source_word: Οἶδα
  choice: ich weiß
  rationale: Direkte und idiomatische Wiedergabe der sicheren Kenntnis, die οἶδα ausdrückt.
- source_word: Μεσσίας
  choice: Messias
  rationale: Die im Deutschen etablierte Form bewahrt den semitischen Titel.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das griechische Präsens hat hier Zukunftsbezug; das deutsche Präsens drückt die erwartete Ankunft natürlich aus.
- source_word: ὁ λεγόμενος χριστός
  choice: der Christus genannt wird
  rationale: Die Formulierung erhält die erklärende Beziehung zwischen dem semitischen Titel „Messias“ und dessen griechischer Entsprechung „Christus“, ohne beide Wörter zusammenfallen zu lassen.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: wenn er kommt
  rationale: Die Wendung gibt die erwartete zukünftige Ankunft idiomatisch wieder; das betonte Demonstrativpronomen wird im Deutschen durch den eindeutigen Satzbezug ausreichend vertreten.
- source_word: ἀναγγελεῖ
  choice: wird … mitteilen
  rationale: Im Kontext bezeichnet das Verb das umfassende Bekanntmachen beziehungsweise Erklären; „mitteilen“ ist klar und natürlich, ohne den Sinn auf bloßes Lehren einzuengen.
- source_word: ἡμῖν ἅπαντα
  choice: uns alles
  rationale: Dies gibt sowohl den indirekten Gegenstand als auch die umfassende Aussage von ἅπαντα knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von Μεσσίας und χριστός in derselben Aussage
  choice: „Messias“ und „Christus“ werden als zwei sprachlich verschiedene, auf denselben Titel bezogene Bezeichnungen erhalten.
  alternative: Beide Begriffe mit „Messias“ wiedergeben oder beide als „Gesalbter“ übersetzen.
  rationale: Johannes erklärt den semitischen Ausdruck Μεσσίας durch den griechischen Ausdruck χριστός. Die Unterscheidung im Haupttext bewahrt diese zweisprachige Erklärungsfunktion, ohne daraus zwei verschiedene Ämter oder Personen zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Das historische Präsens wird beibehalten. Die direkte Rede bleibt knapp und natürlich; die Titelunterscheidung des Ausgangstextes wird im Haupttext sichtbar gemacht.
