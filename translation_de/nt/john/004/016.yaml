base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: de
  text: 'Er sagt zu ihr[a]: »Geh, ruf deinen Mann und komm hierher!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er sagte zu ihr.« Das Griechische verwendet ein historisches Präsens, eine in Erzählungen übliche Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Er sagt
  rationale: Das griechische Präsens ist ein historisches Präsens. Auch im Deutschen ist es als lebendige Erzählform natürlich und bewahrt die Tempusform des Ausgangstextes.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der Dativ bezeichnet die Adressatin der Rede und wird im Deutschen idiomatisch mit »zu ihr« wiedergegeben.
- source_word: Ὕπαγε
  choice: Geh
  rationale: Der Imperativ fordert sie auf, sich auf den Weg zu machen; »Geh« ist knapp und kontextgemäß.
- source_word: φώνησον
  choice: ruf
  rationale: φωνέω bedeutet hier, jemanden zu rufen beziehungsweise herbeizurufen. »Ruf« ist die natürliche moderne Formulierung.
- source_word: τὸν ἄνδρα σου
  choice: deinen Mann
  rationale: ἀνήρ kann »Mann« oder »Ehemann« bedeuten. In Verbindung mit dem Possessivpronomen und angesichts der folgenden Verse bezeichnet »deinen Mann« im Deutschen idiomatisch den Ehemann, ohne stärker auszudeuten als der griechische Ausdruck.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Aufforderungen unmittelbar.
- source_word: ἐλθὲ
  choice: komm
  rationale: Der Imperativ von ἔρχομαι wird direkt mit »komm« wiedergegeben. »Komm zurück« wäre kontextuell möglich, fügte aber ein im Griechischen nicht ausdrücklich vorhandenes Element hinzu.
- source_word: ἐνθάδε
  choice: hierher
  rationale: Da eine gerichtete Bewegung zu Jesus gemeint ist, gibt »hierher« das Ortsadverb im Deutschen natürlicher wieder als bloßes »hier«.
