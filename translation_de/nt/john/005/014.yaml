id: JHN.5.14
reference: John 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: de
  text: 'Danach fand Jesus ihn im Tempel und sagte zu ihm: „Sieh, du bist gesund geworden. Sündige nicht mehr, damit dir nicht etwas Schlimmeres widerfährt.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus sagt nicht ausdrücklich, ob die frühere Krankheit durch eine bestimmte Sünde verursacht worden war. Ebenso bleibt offen, ob das „Schlimmere“ irdisches Leiden, das endgültige Gericht oder beides meint.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: Gibt die johanneische Erzählfolge und den pluralischen Rückbezug idiomatisch wieder; „Nach diesen Dingen“ wäre formaler, aber im modernen Deutsch unnötig schwerfällig.
- source_word: εὑρίσκει
  choice: fand
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet den Tempelbereich insgesamt, nicht spezifisch das innere Heiligtum; „im Tempel“ bleibt knapp und lässt den genauen Ort offen.
- source_word: Ἴδε
  choice: Sieh
  rationale: Bewahrt den aufmerksam machenden Charakter ohne das altertümliche „Siehe“.
- source_word: ὑγιὴς γέγονας
  choice: du bist gesund geworden
  rationale: Das Perfekt γέγονας bezeichnet eine eingetretene Veränderung mit fortbestehendem Ergebnis; „bist gesund geworden“ bildet beides natürlich ab.
- source_word: μηκέτι ἁμάρτανε
  choice: Sündige nicht mehr
  rationale: Gibt die Aufforderung, mit dem Sündigen aufzuhören, prägnant wieder, ohne aus dem Präsensaspekt eine ausdrückliche fortlaufende Gewohnheit abzuleiten.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: damit dir nicht etwas Schlimmeres widerfährt
  rationale: Bewahrt die Ziel- bzw. Folgenbeziehung und die unbestimmte Formulierung „etwas Schlimmeres“; „widerfährt“ ist in einer ernsten Warnung natürlich und würdevoll.
theological_decisions:
- issue: Verhältnis von Sünde und Leiden in Jesu Warnung
  choice: Die Warnung wird unmittelbar wiedergegeben, ohne zu behaupten, eine bestimmte frühere Sünde habe die Krankheit verursacht; auch die Art des drohenden schlimmeren Geschehens bleibt offen.
  alternative: Die frühere Krankheit als direkte Strafe für eine bestimmte Sünde oder das Schlimmere ausschließlich als zeitliches Leiden beziehungsweise Endgericht bestimmen.
  rationale: Der griechische Text verbindet weiteres Sündigen mit der Warnung vor etwas Schlimmerem, erklärt aber weder ausdrücklich die Ursache der früheren Krankheit noch die genaue Art des angedrohten Geschehens.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das historische Präsens ist als deutsches Erzählpräteritum wiedergegeben; unnötig altertümliche Wendungen wurden vermieden. Die einzige Fußnote bewahrt die theologische Offenheit des Ausgangstextes.
