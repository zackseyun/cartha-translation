  to: Aus diesem Grund suchten die Juden[a] umso mehr, ihn zu töten, weil er nicht nur den Sabbat brach, sondern Gott auch seinen eigenen Vater nannte, indem er sich damit Gott gleichmachte.[b]
  rationale: Die Revision ersetzt die unidiomatische Verbindung „Darum also“ durch die natürliche kausale Wendung „Aus diesem Grund“ und gibt ὅτι mit „weil“ wieder. Die Gleichheitsklausel wird als von der Vaterschaftsaussage abhängige Partizipialhandlung formuliert. Bedeutung, Register, Namen, Schlüsselbegriffe und beide Fußnotenanker bleiben gewahrt.
