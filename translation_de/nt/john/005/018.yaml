source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: de
  text: Aus diesem Grund suchten die Juden[a] umso mehr, ihn zu töten, weil er nicht nur den Sabbat brach, sondern Gott auch seinen eigenen Vater nannte, indem er sich damit Gott gleichmachte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Johannesevangelium bezeichnet „die Juden“ je nach Zusammenhang oft genauer bestimmte jüdische Gegner Jesu oder gewisse jüdische Autoritäten, nicht unterschiedslos alle jüdischen Menschen.
    reason: Kulturelle und kontextuelle Einordnung des möglichen Referenten.
  - marker: b
    text: 'Auch möglich: „und stellte sich damit Gott gleich“.'
    reason: Lexikalische Alternative für ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Darum also
  rationale: Bewahrt beide folgernden Ausdrücke in knapper, natürlicher deutscher Form und stellt den Zusammenhang mit dem vorausgehenden Geschehen her.
- source_word: μᾶλλον
  choice: noch mehr
  rationale: 'Gibt die komparative Steigerung wieder: Die Absicht, Jesus zu töten, wurde verstärkt.'
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: versuchten ... zu töten
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Bemühen; „versuchten“ ist im Deutschen natürlicher als das wörtlichere „suchten“.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Entspricht der offenen Bezeichnung des griechischen Textes. Die im johanneischen Zusammenhang häufig engere Referenz wird in einer Fußnote erläutert, statt sie im Haupttext festzulegen.
- source_word: ἔλυε τὸ σάββατον
  choice: brach ... den Sabbat
  rationale: λύω bezeichnet hier idiomatisch das Übertreten oder Außerkraftsetzen der Sabbatordnung; „den Sabbat brechen“ ist klar und geläufig.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: nannte Gott ... seinen eigenen Vater
  rationale: Bewahrt sowohl den Aussageakt von ἔλεγε als auch die Betonung durch ἴδιον („eigenen“).
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: machte sich damit Gott gleich
  rationale: Gibt die Partizipialkonstruktion und ihre Folgerungsbeziehung idiomatisch wieder, ohne die ausdrückliche Aussage der Gleichheit abzuschwächen.
theological_decisions:
- issue: Christologische Aussage der Gleichheit mit Gott
  choice: machte sich damit Gott gleich
  alternative: beanspruchte, Gott gleich zu sein
  rationale: Die gewählte Form bleibt näher an ποιῶν („machend“) und erhält die starke christologische Aussage. „Damit“ verdeutlicht lediglich den im Satz angelegten Zusammenhang mit der Bezeichnung Gottes als Jesu eigenem Vater.
- issue: Referenz von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden, mit kontextueller Fußnote
  alternative: die jüdischen führenden Männer / die Judäer
  rationale: Der Haupttext bewahrt die lexikalisch offene Form des Originals. Die Fußnote verhindert zugleich die pauschale Anwendung auf alle jüdischen Menschen und wahrt die kontextuelle Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am argumentativen Verlauf des Griechischen, vermeidet jedoch unnatürliche Wörtlichkeit. Die Fußnotenmarker [a] und [b] stehen beide im Haupttext.
