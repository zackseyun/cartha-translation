base_translation:
  language: en
  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: de
  text: Dort war ein Mann, der seit achtunddreißig Jahren krank war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seit achtunddreißig Jahren an seiner Schwäche litt“. Das griechische Wort ἀσθένεια kann allgemein körperliche Schwäche oder Krankheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: war
  rationale: δέ ist hier ein schwaches Bindewort, das die Erzählung fortführt, ohne einen deutlichen Gegensatz auszudrücken. Im natürlichen Deutschen muss es nicht eigens wiedergegeben werden.
- source_word: τις ἄνθρωπος
  choice: ein Mann
  rationale: Die Verbindung bezeichnet eine nicht näher bestimmte männliche Person. „Ein Mann“ ist natürlich und vermeidet das steife „ein gewisser Mann“.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Das Adverb verweist auf den zuvor genannten Ort und wird direkt mit „Dort“ wiedergegeben.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: achtunddreißig Jahre
  rationale: Dies ist die übliche deutsche Wiedergabe der Zeitangabe.
- source_word: ἔχων
  choice: der seit … war
  rationale: Das Partizip bezeichnet zusammen mit der Zeitangabe einen bis zu diesem Zeitpunkt andauernden Zustand. Die finite Relativsatzkonstruktion mit „seit“ gibt diesen durativen Sinn im Deutschen idiomatisch wieder.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: krank war
  rationale: ἀσθένεια kann körperliche Schwäche, Krankheit oder Leiden bezeichnen. „Krank war“ passt zum Zusammenhang, bleibt hinsichtlich der genauen Erkrankung offen und klingt natürlicher als die wörtliche Wendung „in seiner Krankheit“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung beginnt mit der Ortsangabe und führt die Person natürlich ein; die genaue Art seines Leidens bleibt unbestimmt.
