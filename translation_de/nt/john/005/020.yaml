source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: de
  text: Denn der Vater liebt den Sohn und zeigt ihm alles, was er selbst tut. Und er wird ihm größere Werke als diese zeigen, damit ihr staunt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass ihr staunen werdet“. Die griechische Verbindung mit ἵνα kann einen Zweck ausdrücken und hier zugleich das daraus folgende Staunen der Zuhörer einschließen.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: liebt
  rationale: „Liebt“ gibt die persönliche Zuneigung klar und natürlich wieder, ohne zwischen φιλέω und ἀγαπάω eine im johanneischen Sprachgebrauch nicht zwingende Abstufung einzutragen.
- source_word: δείκνυσιν / δείξει
  choice: zeigt / wird zeigen
  rationale: Die gleiche deutsche Wortwurzel bewahrt die Wiederholung und den Tempuswechsel des griechischen Textes.
- source_word: πάντα
  choice: alles
  rationale: „Alles“ ist die direkte und idiomatische Entsprechung des umfassenden πάντα.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: was er selbst tut
  rationale: Das betonte αὐτός wird mit „selbst“ wiedergegeben; das deutsche Präsens „tut“ bezeichnet ebenso natürlich das fortdauernde Handeln.
- source_word: μείζονα τούτων ... ἔργα
  choice: noch größere Werke als diese
  rationale: „Werke“ bewahrt den für das Johannesevangelium bedeutsamen Ausdruck ἔργα. „Noch“ macht die steigernde Vergleichsbeziehung im Deutschen natürlich deutlich, ohne einen zusätzlichen Sachinhalt einzuführen.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: damit ihr staunt
  rationale: „Damit“ wahrt die mögliche Zweck- und Folgebedeutung von ἵνα; „staunt“ ist modernes, würdiges Deutsch und gibt θαυμάζω ohne künstlich gehobenen Ton wieder.
theological_decisions:
- issue: Art der durch φιλεῖ bezeichneten Liebe des Vaters zum Sohn
  choice: „liebt“ ohne Abschwächung oder besondere dogmatische Abstufung
  alternative: „ist dem Sohn zugetan“ oder „hat den Sohn lieb“
  rationale: φιλέω kann persönliche Zuneigung hervorheben, überschneidet sich bei Johannes jedoch mit ἀγαπάω. „Liebt“ bewahrt die relationale Aussage, ohne eine geringere Art von Liebe zu unterstellen.
- issue: Kraft von ἵνα ὑμεῖς θαυμάζητε
  choice: „damit ihr staunt“
  alternative: „sodass ihr staunen werdet“
  rationale: Die Formulierung lässt die im Griechischen mögliche Spannung zwischen beabsichtigtem Zweck und eintretender Folge bestehen. Das „ihr“ bezeichnet ausdrücklich die angeredete Mehrzahl.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzteilung erhöht die Lesbarkeit; „Werke“ bleibt wegen seiner johanneischen Bedeutung erhalten.
