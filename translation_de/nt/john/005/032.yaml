id: JHN.5.32
reference: John 5:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: de
  text: Ein anderer ist es, der über mich Zeugnis ablegt, und ich weiß, dass das Zeugnis, das er über mich ablegt, wahr ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος
  choice: ein anderer
  rationale: Die Formulierung bewahrt den Gegensatz zu Jesu eigenem Zeugnis im Zusammenhang, ohne den anderen Zeugen näher zu bestimmen.
- source_word: ὁ μαρτυρῶν
  choice: der Zeugnis ablegt
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen, der Zeugnis gibt; die deutsche Relativkonstruktion klingt natürlich und erhält den fortdauernden verbalen Sinn.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: περί mit dem Genitiv bezeichnet hier den Gegenstand des Zeugnisses. „Über mich“ ist präzise und in modernem Deutsch verständlich.
- source_word: οἶδα
  choice: ich weiß
  rationale: Die direkte und übliche Wiedergabe des Verbs im gegebenen Zusammenhang.
- source_word: ἡ μαρτυρία
  choice: das Zeugnis
  rationale: „Zeugnis“ bewahrt den rechtlichen Anklang des Abschnitts und die Wortverbindung mit dem Verb μαρτυρεῖ.
- source_word: ἣν μαρτυρεῖ
  choice: das er … ablegt
  rationale: Die Relativsatzstruktur und die johanneische Wiederholung von Substantiv und zugehörigem Verb bleiben in idiomatischem Deutsch erkennbar.
- source_word: ἀληθής
  choice: wahr
  rationale: „Wahr“ gibt die Aussage über die Zuverlässigkeit beziehungsweise Wahrheit des Zeugnisses unmittelbar wieder, ohne sie enger auszudeuten.
theological_decisions:
- issue: Identität des mit ἄλλος bezeichneten Zeugen
  choice: Der Zeuge wird nur als „ein anderer“ bezeichnet.
  alternative: Den anderen ausdrücklich mit Johannes dem Täufer, dem Vater oder einem bestimmten Zeugen im rechtlichen Sinn identifizieren.
  rationale: Der Vers selbst nennt den Betreffenden nicht ausdrücklich. Die Übersetzung wahrt diese Offenheit und überlässt die nähere Bestimmung dem Zusammenhang und der Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „Ein anderer ist es“ bildet die griechische Hervorhebung ab; „Zeugnis ablegen“ erhält den rechtlichen Klang sowie die bewusste Wiederholung des Ausgangstextes.
