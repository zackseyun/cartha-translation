source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: de
  text: Denn von Zeit zu Zeit stieg ein Engel in das Becken hinab und brachte das Wasser in Bewegung. Wer dann nach der Bewegung des Wassers als Erster hineinstieg, wurde gesund, ganz gleich, von welcher Krankheit er befallen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers (zusammen mit der zweiten Hälfte von Vers 3) fehlt in den frühesten griechischen Papyri, darunter Papyrus 66 und Papyrus 75 aus dem 3. Jahrhundert, sowie in bedeutenden Handschriften des 4. Jahrhunderts wie dem Codex Sinaiticus und dem Codex Vaticanus. Er steht jedoch in der byzantinischen Mehrheitstradition sowie in frühen lateinischen und syrischen Übersetzungen. Viele Fachleute halten ihn für eine frühe Ergänzung durch einen Abschreiber, die erklären sollte, warum sich die Kranken an dem Becken versammelten.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: von Zeit zu Zeit
  rationale: Die Wendung bezeichnet hier ein gelegentlich oder wiederholt eintretendes Geschehen, ohne einen festen Zeitplan auszudrücken.
- source_word: κατέβαινεν
  choice: stieg … hinab
  rationale: Der Imperfekt schildert eine wiederkehrende Handlung in der Vergangenheit; zusammen mit „von Zeit zu Zeit“ wird dieser Aspekt im Deutschen natürlich wiedergegeben.
- source_word: ἐτάρασσεν
  choice: brachte … in Bewegung
  rationale: Das Verb bezeichnet ein Aufwühlen oder Bewegen des Wassers. Die Formulierung ist natürlich und bewahrt den Bezug zum folgenden Substantiv ταραχή.
- source_word: ὁ … πρῶτος ἐμβὰς
  choice: wer … als Erster hineinstieg
  rationale: Die substantivierte Partizipialkonstruktion wird idiomatisch wiedergegeben; „hineinstieg“ passt zum Becken und vermeidet eine unnötige Festlegung auf völliges Eintauchen.
- source_word: ὑγιὴς ἐγίνετο
  choice: wurde gesund
  rationale: Die Wendung bezeichnet das Gesundwerden. Der wiederholende Sinn des Imperfekts ergibt sich im deutschen Satz aus der allgemeinen Konstruktion „Wer …, wurde …“.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: ganz gleich, von welcher Krankheit er befallen war
  rationale: κατέχω bedeutet mit einer Krankheit im Passiv idiomatisch „befallen sein“; ᾧ δήποτε wird durch „ganz gleich, von welcher“ wiedergegeben.
theological_decisions:
- issue: Textkritischer Status des Verses
  choice: Der Vers wird gemäß der vorgegebenen byzantinischen Ausgangsausgabe im Haupttext übersetzt und mit einer textkritischen Fußnote versehen.
  alternative: Den Vers aus dem Haupttext auslassen oder in Klammern setzen.
  rationale: Die angegebene Ausgangsausgabe enthält den Vers. Zugleich muss seine fehlende Bezeugung in den frühesten griechischen Handschriften transparent gemacht werden, ohne die textkritische Frage im Haupttext stillschweigend zu entscheiden.
- issue: Darstellung des Engels und der Heilung
  choice: Die Aussage wird ohne erklärende Zusätze als Erzählbehauptung des überlieferten Verses wiedergegeben.
  alternative: Sie als bloße damalige Volksmeinung kennzeichnen.
  rationale: Der griechische Wortlaut enthält keine ausdrückliche Distanzierung oder Kennzeichnung als Volksglauben; eine solche Deutung darf nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Becken“ ist gegenüber „Teich“ sachlich passend für κολυμβήθρα; „brachte das Wasser in Bewegung“ klingt natürlich und hält die lexikalische Verbindung zur anschließenden „Bewegung des Wassers“ aufrecht.
