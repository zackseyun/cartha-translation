  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: de
  text: Denn der Vater richtet niemanden, sondern hat alles Gericht dem Sohn übergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Denn … niemanden
  rationale: γάρ führt die Begründung für die vorausgehende Aussage ein. Die verneinende Kraft von οὐδέ wird im Deutschen zusammen mit οὐδένα natürlich durch „niemanden“ wiedergegeben.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Im johanneischen Zusammenhang ist dies die personale Bezeichnung Gottes in Beziehung zum Sohn.
- source_word: κρίνει
  choice: richtet
  rationale: Das Präsens formuliert eine allgemeine Aussage. „Richtet“ bewahrt den sprachlichen Zusammenhang mit κρίσιν und verengt die Bedeutung nicht auf „verurteilt“.
- source_word: οὐδένα
  choice: niemanden
  rationale: Die Formulierung gibt die umfassende Verneinung präzise und in natürlichem modernem Deutsch wieder.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach einer Verneinung kennzeichnet „sondern“ den starken Gegensatz im Deutschen genauer als „aber“.
- source_word: τὴν κρίσιν πᾶσαν
  choice: das ganze Gericht
  rationale: Die Wiedergabe bewahrt das Substantiv κρίσις und den umfassenden Sinn von πᾶσαν, ohne ausdrücklich „Vollmacht“ einzutragen.
- source_word: δέδωκεν
  choice: hat … übergeben
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis. „Übergeben“ ist hier idiomatisch und lässt die anvertraute richterliche Funktion erkennen, ohne sie ausführlich auszudeuten.
- source_word: τῷ υἱῷ
  choice: dem Sohn
  rationale: Der bestimmte Ausdruck wird als gewichtiger christologischer Titel beibehalten; ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
theological_decisions:
- issue: Verhältnis zwischen dem Richten des Vaters und dem Richten des Sohnes
  choice: 'Die Aussage bleibt uneingeschränkt stehen: Der Vater richtet niemanden, sondern hat das ganze Gericht dem Sohn übergeben.'
  alternative: „Der Vater richtet niemanden unabhängig vom Sohn“ oder Beschränkung auf das endzeitliche Gericht.
  rationale: Solche harmonisierenden oder zeitlich einschränkenden Zusätze stehen nicht im griechischen Text. Die theologische Spannung wird daher bewahrt.
- issue: Christologischer Titel „der Sohn“
  choice: „dem Sohn“ als Titel beibehalten.
  alternative: „seinem Sohn“
  rationale: Der griechische Text enthält kein ausdrückliches Possessivpronomen; der Titel trägt im Kontext die Vater-Sohn-Beziehung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Richten“ und „Gericht“ bewahren die Wortverbindung des griechischen Textes; „das ganze Gericht“ ist bewusst formal und theologisch offen gehalten.
