id: JHN.5.26
reference: John 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: de
  text: Denn wie der Vater Leben in sich selbst hat,[a] so hat er auch dem Sohn gegeben, Leben in sich selbst zu haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Leben in sich selbst“ kann als Leben verstanden werden, das dem eigenen Sein innewohnt. Die Übersetzung bewahrt jedoch die griechische Ausdrucksweise, statt den theologischen Fachausdruck „selbstexistentes Leben“ zu verwenden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „so gab er auch dem Sohn, Leben in sich selbst zu haben.“ Der griechische Aorist kann im Deutschen je nach Zusammenhang mit Perfekt oder Präteritum wiedergegeben werden.'
    reason: translation_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: „Denn“ gibt den erklärenden Anschluss durch γάρ wieder; „wie … so“ bildet die Vergleichsstruktur ὥσπερ … οὕτως natürlich im Deutschen ab.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Bestimmte Bezeichnung Gottes als Vater im johanneischen Zusammenhang.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: Leben in sich selbst hat
  rationale: Bewahrt die konkrete griechische Formulierung und den Präsens, ohne sie durch den theologischen Fachbegriff „Selbstexistenz“ zu ersetzen.
- source_word: οὕτως καὶ
  choice: so … auch
  rationale: Erhält sowohl die korrelative Struktur als auch die Bedeutung von καί.
- source_word: τῷ υἱῷ
  choice: dem Sohn
  rationale: Gibt den Dativ als indirektes Objekt zu ἔδωκεν wieder; „Sohn“ ist hier ein christologischer Titel.
- source_word: ἔδωκεν
  choice: hat … gegeben
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists. „Gegeben“ entspricht dem gewöhnlichen Sinn des Verbs und wahrt die theologisch gewichtige Aussage, ohne sie erklärend abzuschwächen.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: Leben in sich selbst zu haben
  rationale: Gibt die Infinitivkonstruktion klar wieder und bewahrt die genaue Wiederholung der Aussage über den Vater.
theological_decisions:
- issue: Ob „Leben in sich selbst“ ausdrücklich als Selbstexistenz oder Aseität bezeichnet werden soll
  choice: Die biblische Formulierung „Leben in sich selbst“ bleibt im Haupttext erhalten.
  alternative: „Leben aus sich selbst“ oder „selbstexistentes Leben“
  rationale: ἐν ἑαυτῷ lautet wörtlich „in sich selbst“. Die gewählte Form bewahrt die Aussagekraft und mögliche theologische Folgerungen, ohne einen späteren Fachbegriff in den Text einzutragen.
- issue: Wie die Gabe des Vaters an den Sohn auszudrücken ist
  choice: „hat er auch dem Sohn gegeben“
  alternative: „hat er auch dem Sohn gewährt“
  rationale: Der Text verwendet das gewöhnliche Verb für „geben“. Die Übersetzung bewahrt diese Aussage und die Spannung zwischen dem Leben des Sohnes in sich selbst und dessen Gabe durch den Vater, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau „wie … so“ und die zweimalige Formulierung „Leben in sich selbst“ erhalten die rhetorische und theologische Struktur des griechischen Textes.
