id: JHN.5.15
reference: John 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: de
  text: Der Mann ging weg und berichtete den Juden[a], dass Jesus derjenige war, der ihn gesund gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den jüdischen Führern« oder »den Judäern«, je nachdem, wie die Bezeichnung »die Juden« an dieser Stelle im Johannesevangelium verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging weg
  rationale: Gibt die vollzogene Entfernung vom Ort natürlich und ohne den gehobenen Klang von „ging fort“ wieder.
- source_word: ὁ ἄνθρωπος
  choice: Der Mann
  rationale: Bezeichnet im Kontext den zuvor geheilten Mann und wahrt den konkreten Erzählbezug.
- source_word: ἀνήγγειλεν
  choice: berichtete
  rationale: ἀναγγέλλω bezeichnet hier die Weitergabe einer Information; „berichtete“ ist präziser als das öffentlichkeitsbetonte „verkündete“.
- source_word: τοῖς Ἰουδαίοις
  choice: den Juden[a]
  rationale: Bewahrt die formale Bezeichnung des griechischen Textes, ohne ihren kontextuell möglichen Bezug auf jüdische Autoritäten oder Judäer im Haupttext festzulegen.
- source_word: ὅτι
  choice: dass
  rationale: Leitet im Deutschen idiomatisch den Inhalt der Mitteilung ein.
- source_word: Ἰησοῦς ἐστιν
  choice: Jesus es war
  rationale: Das griechische Präsens steht in indirekter Rede nach einem Vergangenheitstempus; die deutsche Rückverschiebung mit „war“ klingt natürlich und verändert den Sachgehalt nicht.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: der ihn gesund gemacht hatte
  rationale: Gibt die Konstruktion aus substantiviertem Aoristpartizip, Objekt und Prädikatsadjektiv natürlich wieder und markiert, dass die Heilung dem Bericht vorausging.
theological_decisions:
- issue: Referenz von τοῖς Ἰουδαίοις im Johannesevangelium
  choice: „den Juden“ im Haupttext mit erläuternder Fußnote
  alternative: „den jüdischen Führern“ oder „den Judäern“
  rationale: Die griechische Bezeichnung wird nicht vorschnell auf eine bestimmte Gruppe eingeengt. Zugleich macht die Fußnote deutlich, dass der johanneische Kontext eine engere oder geografische Bedeutung nahelegen kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung „Jesus es war“ betont wie die griechische Identifikationskonstruktion die Person Jesu; die Plusquamperfektform stellt die zeitliche Abfolge natürlich dar.
