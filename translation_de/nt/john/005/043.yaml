id: JHN.5.43
reference: John 5:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: de
  text: Ich bin im Namen meines Vaters gekommen[a], doch ihr nehmt mich nicht an. Wenn ein anderer in seinem eigenen Namen kommt[b], werdet ihr ihn annehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Vollmacht meines Vaters“. Die griechische Wendung „im Namen“ kann auch Beauftragung, Repräsentation und Autorität ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus eigener Vollmacht“. Die Formulierung steht in scharfem Gegensatz zu Jesu Kommen „im Namen meines Vaters“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: bin ... gekommen
  rationale: Das deutsche Perfekt gibt den vollzogenen Eintritt mit fortdauernder Gegenwartsrelevanz natürlich wieder.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: im Namen meines Vaters
  rationale: Die idiomatische, zugleich formnahe Wiedergabe bewahrt die möglichen Bedeutungsanteile von Beauftragung, Repräsentation und Autorität.
- source_word: οὐ λαμβάνετέ με
  choice: ihr nehmt mich nicht an
  rationale: „Annehmen“ bezeichnet hier die persönliche Anerkennung und Aufnahme Jesu und klingt im modernen Deutschen natürlicher als „empfangen“.
- source_word: ἄλλος
  choice: ein anderer
  rationale: Die schlichte Wiedergabe wahrt den Kontrast zu Jesus, ohne die Identität dieser Person näher festzulegen.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: in seinem eigenen Namen
  rationale: Die Formulierung erhält die genaue Parallele und den Gegensatz zum Kommen im Namen des Vaters.
- source_word: ἐκεῖνον λήμψεσθε
  choice: werdet ihr ihn annehmen
  rationale: Die Wiederholung von „annehmen“ bildet den rhetorischen Gegensatz zum vorherigen Nichtannehmen Jesu ab; das Futur wird ausdrücklich erhalten.
theological_decisions:
- issue: Ob „mein Vater“ ausdrücklich als Gott der Vater erklärt werden soll
  choice: „Vater“ großschreiben, aber keine erklärende Ergänzung in den Text aufnehmen
  alternative: „mein Vater, Gott“ oder Kleinschreibung
  rationale: Der johanneische Kontext macht den göttlichen Bezug deutlich. Die Großschreibung signalisiert ihn im Deutschen, ohne dem griechischen Text eine Apposition hinzuzufügen.
- issue: Ob „im Namen“ im Haupttext als Autoritätsaussage ausgedeutet werden soll
  choice: Das Namensidiom in beiden Satzhälften bewahren
  alternative: „mit der Vollmacht meines Vaters“ beziehungsweise „aus eigener Vollmacht“
  rationale: Autorität und Beauftragung gehören zum Sinn, erschöpfen ihn aber nicht. Die gleiche Wendung in beiden Satzhälften bewahrt zudem den beabsichtigten theologischen und rhetorischen Gegensatz.
- issue: Bedeutung von λαμβάνω im Kontext
  choice: „annehmen“ statt des formnäheren „empfangen“
  alternative: „empfangen“ oder „aufnehmen“
  rationale: Gemeint ist nicht bloß physisches Empfangen, sondern Anerkennung und Annahme. „Annehmen“ vermittelt dies in gegenwärtigem Standarddeutsch klar, ohne die Aussage auf Gastfreundschaft zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Annehmen“ ist in diesem Kontext natürlicher und semantisch klarer als „empfangen“. Das adversative καί wird mit „doch“ wiedergegeben, um den überraschenden Gegensatz idiomatisch auszudrücken. Die parallele Formulierung „im Namen“ bleibt in beiden Satzhälften erhalten.
