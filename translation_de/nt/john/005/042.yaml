id: JHN.5.42
reference: John 5:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: de
  text: 'Doch ich kenne euch: Ihr habt die Liebe Gottes[a] nicht in euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: „die Liebe zu Gott“. Der griechische Ausdruck kann auch weiter als „die von Gott kommende Liebe“ oder „Gottes Liebe“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den deutlichen Gegensatz zum vorherigen Zusammenhang und klingt im modernen Deutschen knapp und natürlich.
- source_word: ἔγνωκα
  choice: ich kenne
  rationale: Das Perfekt bezeichnet eine gefestigte, aus Kenntnis hervorgegangene Einsicht; das deutsche Präsens gibt diesen Zustandswert idiomatisch wieder.
- source_word: ὑμᾶς
  choice: euch
  rationale: Direktes Objekt in der zweiten Person Plural.
- source_word: ὅτι
  choice: ': Ihr habt'
  rationale: Leitet den Inhalt dessen ein, was Jesus über sie weiß. Ein Doppelpunkt gibt die Beziehung im Deutschen natürlicher wieder als ein steifes „dass“ nach „kennen“.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: 'Bewahrt die bestimmte Formulierung und die echte Mehrdeutigkeit des Genitivs: Gemeint sein kann besonders die Liebe zu Gott, aber auch die von Gott kommende beziehungsweise Gott eigene Liebe.'
- source_word: οὐκ ἔχετε
  choice: habt … nicht
  rationale: Gibt die verneinte Präsensform als fortbestehenden Zustand unmittelbar wieder.
- source_word: ἐν ἑαυτοῖς
  choice: in euch
  rationale: Natürliches Deutsch für die innere Gegenwart beziehungsweise den inneren Besitz; „in euch selbst“ wäre hier unnötig schwerfällig.
theological_decisions:
- issue: Bedeutung des Genitivs in „die Liebe Gottes“
  choice: Die mehrdeutige Formulierung „die Liebe Gottes“ bleibt im Haupttext erhalten.
  alternative: „die Liebe zu Gott“; „die von Gott kommende Liebe“; „Gottes Liebe“
  rationale: Der Genitiv τοῦ θεοῦ legt grammatisch nicht eindeutig fest, ob Gott Ziel, Ursprung oder Träger der Liebe ist. Der Kontext spricht stark für Liebe zu Gott, doch der Haupttext soll die genuine Offenheit des griechischen Ausdrucks nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede ist plural („euch“, „ihr“). Der Doppelpunkt sorgt für einen natürlichen deutschen Satzbau und bildet den inhaltserläuternden ὅτι-Satz ab.
