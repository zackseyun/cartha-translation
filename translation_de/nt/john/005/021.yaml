id: JHN.5.21
reference: John 5:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: de
  text: Denn wie der Vater die Toten auferweckt und lebendig macht, so macht auch der Sohn lebendig, wen er will.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „wie“ eröffnet natürlich den mit οὕτως καί fortgeführten Vergleich.
- source_word: ὁ πατὴρ
  choice: der Vater
  rationale: Im johanneischen Zusammenhang ist dies die Gottesbezeichnung „der Vater“.
- source_word: ἐγείρει
  choice: auferweckt
  rationale: Das Verb bezeichnet hier das Erwecken der Toten und wird im Deutschen im Auferstehungszusammenhang idiomatisch mit „auferwecken“ wiedergegeben.
- source_word: τοὺς νεκρούς
  choice: die Toten
  rationale: Natürliche substantivische Wiedergabe des griechischen Ausdrucks mit kollektivem Bezug.
- source_word: ζῳοποιεῖ
  choice: lebendig macht
  rationale: Die Wendung bildet die kausative Bedeutung des Verbs präzise ab und lässt sich an beiden Stellen gleich wiedergeben.
- source_word: οὕτως καὶ
  choice: so ... auch
  rationale: Bewahrt die ausdrückliche Entsprechung zwischen dem Handeln des Vaters und dem des Sohnes.
- source_word: ὁ υἱὸς
  choice: der Sohn
  rationale: Im Vater-Sohn-Gegensatz ist dies die christologische Bezeichnung „der Sohn“.
- source_word: οὓς θέλει
  choice: wen er will
  rationale: Gibt den Plural οὓς im Deutschen idiomatisch durch das kollektiv verwendbare „wen“ wieder und bewahrt mit „will“ die klare Willensbedeutung von θέλει.
theological_decisions:
- issue: Parallele zwischen Vater und Sohn beim Lebendigmachen
  choice: Die gleiche Wendung „lebendig macht“ wird für beide Vorkommen von ζῳοποιεῖ verwendet.
  alternative: Die zweite Aussage abschwächen oder freier umschreiben.
  rationale: Der griechische Text stellt das lebenspendende Handeln des Sohnes ausdrücklich dem entsprechenden Handeln des Vaters an die Seite; diese starke christologische Parallele wird weder abgeschwächt noch über den Wortlaut hinaus erläutert.
- issue: θέλει und der Wille des Sohnes
  choice: „wen er will“
  alternative: „wem er Leben geben möchte“ oder „wen er lebendig machen will“
  rationale: „Will“ ist im heutigen Deutsch klar, würdig und volitional stärker sowie textnäher als das potenziell höflich oder abgeschwächt klingende „möchte“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung „lebendig macht“ ist bewusst beibehalten, um die lexikalische und theologische Parallelität des griechischen Textes sichtbar zu machen.
