review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die Vergleichs- und Begründungsstruktur von ὥσπερ γὰρ … οὕτως καί treffend wieder. „auferweckt“ entspricht ἐγείρει im Auferstehungskontext, und die zweimalige Wiedergabe von ζῳοποιεῖ mit „lebendig macht“ bewahrt die beabsichtigte Parallelität. „wen er will“ ist eine idiomatische deutsche Entsprechung für οὓς θέλει und kann den griechischen Plural kollektiv wiedergeben.
  naturalness: „Denn wie der Vater die Toten auferweckt und lebendig macht, so macht auch der Sohn lebendig, wen er will“ ist flüssiges modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die Stellung von „auch“ und die Wiederholung von „lebendig macht“ sind natürlich und klar.
  terminology: „Vater“ und „Sohn“ sind im Kontext als Titel passend großgeschrieben. „die Toten“, „auferweckt“ und „lebendig macht“ sind etablierte, sachgerechte Begriffe. Die Formulierung fügt keine dogmatische Auslegung hinzu und erhält die starke Vater-Sohn-Parallele des griechischen Textes.
