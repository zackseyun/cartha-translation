id: JHN.5.24
reference: John 5:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: de
  text: 'Amen, amen, ich sage euch: Wer mein Wort hört und dem glaubt, der mich gesandt hat, hat ewiges Leben und kommt nicht ins Gericht[a], sondern ist aus dem Tod ins Leben hinübergegangen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kommt nicht in die Verdammnis“. Das griechische Wort κρίσις kann allgemein „Gericht“ bedeuten, im Zusammenhang aber auch ein verurteilendes Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Perfekt bezeichnet einen vollzogenen Übergang mit fortdauerndem Ergebnis: Er ist aus dem Tod ins Leben hinübergelangt und befindet sich nun dort.'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Die doppelte, feierliche Einleitungsformel Jesu wird bewahrt. „Amen“ ist im Deutschen geläufig und gibt die markante johanneische Redeweise näher wieder als eine bloße Umschreibung mit „Wahrlich“.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Direkte und natürliche Wiedergabe der griechischen Redeformel.
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: Wer mein Wort hört und ... glaubt
  rationale: Die substantivierten Präsenspartizipien bezeichnen allgemein jeden Menschen, auf den dies zutrifft. „Wer“ gibt diese generische Aussage im Deutschen idiomatisch und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: τὸν λόγον μου
  choice: mein Wort
  rationale: Bewahrt die johanneische Wortwahl und bezeichnet hier Jesu verkündete Botschaft.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: dem glaubt, der mich gesandt hat
  rationale: πιστεύω mit Dativ bedeutet, jemandem zu glauben beziehungsweise zu vertrauen. Die Formulierung bildet die griechische Konstruktion präzise und natürlich ab.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: hat ewiges Leben
  rationale: Das Präsens bezeichnet ewiges Leben als gegenwärtigen Besitz; die feste deutsche Wendung entspricht dem johanneischen Sprachgebrauch.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: kommt nicht ins Gericht
  rationale: „Gericht“ bewahrt den breiteren Bedeutungsumfang von κρίσις und die mit εἰς ausgedrückte Bewegung, ohne vorschnell auf „Verdammnis“ einzuengen.
- source_word: μεταβέβηκεν
  choice: ist ... hinübergegangen
  rationale: Das deutsche Perfekt gibt einen vollzogenen Übergang mit fortdauerndem Ergebnis wieder; „hinübergegangen“ macht die Bewegung zwischen den beiden Bereichen anschaulich.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: aus dem Tod ins Leben
  rationale: Die gegensätzlichen Bereiche sowie die Richtungsangaben der griechischen Präpositionen werden knapp und deutlich bewahrt.
theological_decisions:
- issue: Bedeutung von κρίσις im Zusammenhang der Rettung
  choice: Gericht
  alternative: Verdammnis
  rationale: Im Kontext kann ein ungünstiges oder verurteilendes Gericht gemeint sein; das Substantiv selbst ist jedoch weiter gefasst. „Gericht“ bewahrt diese echte Bedeutungsbreite und löst die theologische Spannung nicht stillschweigend auf.
- issue: Zeitliche Aussage über ewiges Leben und den Übergang vom Tod zum Leben
  choice: gegenwärtiger Besitz des ewigen Lebens und bereits vollzogener Übergang mit bleibendem Ergebnis
  alternative: ausschließlich zukünftiger Empfang des Lebens oder ausschließlich zukünftiger Freispruch
  rationale: Das Präsens ἔχει und das Perfekt μεταβέβηκεν stellen beides als gegenwärtige beziehungsweise bereits vollzogene Wirklichkeit dar, ohne daraus ein konfessionelles Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze, feierliche Satzführung und die markanten johanneischen Gegensätze werden bewahrt; „Amen, amen“ erhält die charakteristische doppelte Einleitungsformel.
