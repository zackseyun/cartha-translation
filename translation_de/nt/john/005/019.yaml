source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: de
  text: 'Darauf antwortete Jesus und sagte zu ihnen: „Amen, amen, ich sage euch: Der Sohn kann nichts von sich aus tun[a], wenn er nicht sieht, dass der Vater etwas tut. Denn was immer jener tut, das tut ebenso auch der Sohn.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Der Sohn kann aus sich selbst nichts tun.“ „Von sich aus“ ist im heutigen Deutsch natürlicher und bewahrt den Gedanken, dass der Sohn nicht unabhängig vom Vater handelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Satz hält beides zusammen: Der Sohn handelt nicht unabhängig vom Vater, und er tut ebenso alles, was der Vater tut.'
    reason: theological_clarification
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Darauf antwortete Jesus und sagte zu ihnen
  rationale: „Darauf“ gibt οὖν als erzählerische und folgernde Verknüpfung natürlich wieder. Die beiden Sprechverben bleiben sichtbar; das griechische Imperfekt ἔλεγεν wird im Deutschen idiomatisch mit dem Präteritum wiedergegeben, ohne einen künstlichen Verlaufsaspekt zu erzeugen.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Amen, amen, ich sage euch
  rationale: Die feierliche, für Jesus im Johannesevangelium charakteristische Verdoppelung bleibt erhalten. „Amen“ ist im Deutschen geläufig und bewahrt die markante Formel des Ausgangstextes.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδέν
  choice: Der Sohn kann nichts von sich aus tun
  rationale: „Kann nichts“ gibt οὐ δύναται ... οὐδέν präzise und natürlich wieder. „Von sich aus“ bewahrt den Herkunfts- und Beziehungsaspekt von ἀφ’ ἑαυτοῦ, ohne ihn als bloßes Verbot oder als fehlende Bereitschaft umzudeuten.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: wenn er nicht sieht, dass der Vater etwas tut
  rationale: Die Konstruktion mit βλέπῃ und dem Partizip ποιοῦντα wird in natürlichem Deutsch durch einen dass-Satz wiedergegeben. „Etwas“ bildet das indefinite τι ausdrücklich ab und lässt den Gegenstand des Tuns offen.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: Denn was immer jener tut
  rationale: „Was immer“ gibt die verallgemeinernde Verbindung aus Relativpronomen, ἄν und Konjunktiv wieder. „Jener“ bewahrt die hervorhebende Unterscheidung durch ἐκεῖνος und verweist im Zusammenhang eindeutig auf den Vater.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: das tut ebenso auch der Sohn
  rationale: „Das“ nimmt das vorausgehende „was immer“ auf; „ebenso auch“ erhält sowohl καί als auch ὁμοίως und damit die starke Entsprechung zwischen dem Handeln des Vaters und dem des Sohnes.
theological_decisions:
- issue: Die Unfähigkeit des Sohnes zu unabhängigem Handeln, ohne ontologische Folgerungen in den Text einzutragen
  choice: Der Sohn kann nichts von sich aus tun
  alternative: Der Sohn kann nichts allein tun / Der Sohn tut nichts aus eigener Initiative
  rationale: 'Die gewählte Fassung lässt die Aussage des Textes in ihrer Spannung stehen: Der Sohn handelt nicht unabhängig vom Vater, tut aber zugleich alles, was der Vater tut, auf gleiche Weise. Sie deutet das Verhältnis weder als bloße Willensentscheidung noch als Aussage über ein geringeres Wesen aus.'
- issue: Sohn und Vater als relationale Titel
  choice: der Sohn / der Vater
  alternative: der Sohn / sein Vater
  rationale: Der griechische Text verwendet keine ausdrückliche Possessivform. Die bestimmten Bezeichnungen bringen die einzigartige Beziehung im unmittelbaren Zusammenhang zum Ausdruck, ohne „sein“ ergänzend einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Amen-Formel bleibt bewusst fremdartig und feierlich; ansonsten folgt die Syntax natürlichem Gegenwartsdeutsch. „Jener“ ist leicht gehoben, erhält hier aber die Hervorhebung und Unterscheidung des griechischen ἐκεῖνος.
