  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: οὖν ist angemessen als „Darauf“ angebunden, die doppelte Amen-Formel bleibt erhalten, οὐ δύναται ... οὐδέν wird idiomatisch und vollständig mit „kann nichts ... tun“ wiedergegeben, und die Ausnahmebedingung mit dem indefiniten τι wird durch „wenn er nicht sieht, dass der Vater etwas tut“ klar ausgedrückt. „Was immer jener tut“ bewahrt die generalisierende Aussage von ἃ ... ἄν sowie die Hervorhebung von ἐκεῖνος; „ebenso auch“ gibt ὁμοίως καί angemessen wieder.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung „antwortete ... und sagte“ ist im Deutschen leicht formell, aber als bewusst quellennaher Erhalt der beiden griechischen Sprechverben gut verständlich. „Jener“ ist gehoben, funktioniert jedoch in diesem Kontext und markiert sinnvoll die Bezugnahme auf den Vater.
  terminology: „Der Sohn“ und „der Vater“ sind kontextgerechte, etablierte deutsche Titel. „Von sich aus“ ist eine natürliche und sachgemäße Wiedergabe von ἀφ’ ἑαυτοῦ, ohne eine weitergehende dogmatische Deutung einzutragen. Die Anmerkungen sind korrekt verankert; Anmerkung b erläutert lediglich die im Vers selbst ausgedrückte Entsprechung des Handelns.
