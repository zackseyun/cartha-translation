  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: de
  text: Und der Vater, der mich gesandt hat – er selbst hat über mich Zeugnis abgelegt.[a] Ihr habt weder jemals seine Stimme gehört noch seine Gestalt gesehen,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „jener hat über mich Zeugnis abgelegt“. Das griechische Demonstrativpronomen ἐκεῖνος hebt nach „der Vater, der mich gesandt hat“ den Vater nachdrücklich hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Erscheinung“. Das griechische εἶδος kann die sichtbare Gestalt oder Erscheinung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: der Vater, der mich gesandt hat
  rationale: Das attributive Aoristpartizip πέμψας wird im natürlichen modernen Deutsch als Relativsatz wiedergegeben.
- source_word: ἐκεῖνος
  choice: er selbst
  rationale: Das Demonstrativpronomen greift den Vater mit Nachdruck wieder auf. „Er selbst“ bewahrt diese Hervorhebung natürlicher als „jener“.
- source_word: μεμαρτύρηκεν περὶ ἐμοῦ
  choice: hat über mich Zeugnis abgelegt
  rationale: Das Perfekt bezeichnet ein erfolgtes Zeugnis von bleibender Geltung; „Zeugnis ablegen“ erhält den Zeugencharakter des Verbs.
- source_word: οὔτε ... οὔτε
  choice: weder ... noch
  rationale: Die korrelative Verneinung wird mit der entsprechenden deutschen Standardkonstruktion wiedergegeben.
- source_word: φωνὴν αὐτοῦ πώποτε ἀκηκόατε
  choice: jemals seine Stimme gehört
  rationale: πώποτε bedeutet im verneinten Zusammenhang „jemals“; das deutsche Perfekt gibt ἀκηκόατε idiomatisch wieder.
- source_word: εἶδος αὐτοῦ ἑωράκατε
  choice: seine Gestalt gesehen
  rationale: „Gestalt“ wahrt die Bedeutungsbreite von εἶδος als sichtbare Form oder Erscheinung, ohne die Aussage näher festzulegen.
theological_decisions:
- issue: Nachdruck des auf den Vater bezogenen ἐκεῖνος
  choice: „er selbst hat über mich Zeugnis abgelegt“
  alternative: „jener hat über mich Zeugnis abgelegt“
  rationale: Die gewählte Formulierung bewahrt, dass ausdrücklich der Vater als Zeuge hervorgehoben wird, ohne im Deutschen steif oder distanzierend zu klingen.
- issue: Bedeutung von εἶδος αὐτοῦ
  choice: „seine Gestalt“
  alternative: „seine Erscheinung“
  rationale: „Gestalt“ lässt offen, ob eine sichtbare Form, Erscheinungsweise oder wahrnehmbare Offenbarung gemeint ist, und löst die theologische Spannung nicht vorschnell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeugnis abgelegt“ bewahrt das johanneische Zeugnisvokabular; der Gedankenstrich markiert die nachdrückliche Wiederaufnahme des Vaters. Der Satz wird als eigenständiger Vers mit Punkt abgeschlossen.
