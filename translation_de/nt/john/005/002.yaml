  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: de
  text: In Jerusalem gibt es beim Schaftor[a] einen Teich, der auf Hebräisch[b] Bethesda[c] heißt und fünf Säulenhallen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch steht hier nur „bei der Schaf- …“; das Bezugswort wird nicht ausdrücklich genannt. Wahrscheinlich ist das Gebiet beim Schaftor gemeint; vergleiche Nehemia 3,1; 12,39.
    reason: cross_reference
  - marker: b
    text: 'Oder: „auf Aramäisch“. Johannes bezeichnet mit „Hebräisch“ häufig die örtliche semitische Sprache Judäas und nicht zwingend das klassische Hebräisch im engeren Sinn.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften lesen statt „Bethesda“ „Bethzatha“ oder „Bethsaida“.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: gibt es
  rationale: Das Präsens ἔστιν bleibt erhalten. Das schwach weiterführende δέ verlangt im Deutschen hier kein eigenes Wort.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Der griechisch formal pluralische Ortsname wird nach normalem deutschem Sprachgebrauch im Singular wiedergegeben.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: beim Schaftor
  rationale: Die Wendung ist elliptisch; προβατική bezeichnet wahrscheinlich das aus Nehemia 3,1 und 12,39 bekannte Schaftor oder dessen Umgebung. Das im Griechischen nicht ausdrücklich genannte Wort „Tor“ wird deshalb kenntlich gemacht und in einer Fußnote erläutert.
- source_word: κολυμβήθρα
  choice: einen Teich
  rationale: „Teich“ ist die geläufige und im Zusammenhang verständliche deutsche Bezeichnung für ein angelegtes Wasserbecken dieser Art.
- source_word: ἡ ἐπιλεγομένη
  choice: der … heißt
  rationale: Der Relativsatz gibt das Partizip natürlich wieder und führt den Namen des Teiches ein.
- source_word: Ἑβραϊστὶ
  choice: auf Hebräisch
  rationale: Die Übersetzung folgt der ausdrücklichen Bezeichnung des Ausgangstextes; dass damit bei Johannes auch die örtliche semitische Sprache, möglicherweise Aramäisch, gemeint sein kann, wird in einer Fußnote offengehalten.
- source_word: Βηθεσδά
  choice: Bethesda
  rationale: Die Schreibung folgt dem vorgegebenen SBLGNT-Text; abweichende Handschriftenlesarten werden in einer Fußnote genannt.
- source_word: πέντε στοὰς ἔχουσα
  choice: und fünf Säulenhallen hat
  rationale: στοά bezeichnet eine überdachte Säulenhalle. Die koordinierte Form ist im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Säulenhallen“ ist allgemein verständlicher als das fachsprachlichere „Portiken“. Die knappe Ortsbeschreibung und das Präsens des griechischen Textes bleiben erhalten.
