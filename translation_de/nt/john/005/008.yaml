  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: de
  text: 'Jesus sagt zu ihm: „Steh auf, nimm deine Matte und geh!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens des griechischen Erzähltextes wird als „sagt“ bewahrt; dies ist im Deutschen verständlich und spiegelt den johanneischen Erzählstil.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Wörtliche und natürliche Wiedergabe des Dativobjekts; der Bezug ist aus dem Kontext klar.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Die Aufforderung bezeichnet hier das unmittelbare Aufstehen des liegenden Mannes. „Steh auf“ ist modern und idiomatisch; „Erhebe dich“ wäre feierlicher.
- source_word: ἆρον
  choice: nimm
  rationale: Im Zusammenhang bedeutet αἴρω, die Matte aufzunehmen und mitzunehmen. „Nimm“ ist im Deutschen zusammen mit dem Gegenstand natürlich, ohne die folgende Handlung unnötig auszudeuten.
- source_word: κράβαττόν
  choice: Matte
  rationale: Der Ausdruck bezeichnet eine einfache, tragbare Schlafunterlage und nicht zwingend ein Bettgestell. „Matte“ gibt dies im heutigen Deutsch klar wieder.
- source_word: περιπάτει
  choice: geh
  rationale: Hier ist körperliche Fortbewegung gemeint. Der Imperativ „geh“ klingt im Deutschen in dieser Befehlsfolge natürlicher als „laufe“ oder das markierte „wandle“.
theological_decisions:
- issue: Art von Jesu Aufforderung im Heilungszusammenhang
  choice: Die drei Imperative werden als unmittelbare körperliche Aufforderungen wiedergegeben, ohne einen ausdrücklichen Zusatz über Heilung oder Wunder.
  alternative: Eine ausdeutende Fassung wie „Steh auf und sei geheilt“
  rationale: Der griechische Text befiehlt aufzustehen, die Matte zu nehmen und zu gehen; die Heilung wird durch den Zusammenhang erkennbar, in diesem Vers jedoch nicht ausdrücklich benannt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Das historische Präsens bleibt erhalten. Die kurzen Imperative spiegeln die Direktheit des griechischen Satzes; ein Fußnotenmarker ist nicht nötig, da „Matte“ die Art des einfachen, tragbaren Schlaflagers bereits präzise ausdrückt.
