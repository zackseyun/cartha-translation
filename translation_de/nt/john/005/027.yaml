id: JHN.5.27
reference: John 5:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: de
  text: Und er gab ihm Vollmacht, Gericht zu halten,[a] weil er der Menschensohn ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er ein Menschensohn ist“, das heißt: weil er die menschliche Natur teilt. Der Haupttext bewahrt den im Johannesevangelium wahrscheinlich gemeinten Titel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Bezeichnet hier die vom Vater übertragene rechtmäßige Befugnis und Zuständigkeit, nicht bloß Kraft oder Macht.
- source_word: ἔδωκεν
  choice: gab
  rationale: Gibt den Aorist von δίδωμι direkt und natürlich wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich im Kontext auf den Sohn.
- source_word: κρίσιν ποιεῖν
  choice: Gericht zu halten
  rationale: Die Wendung bedeutet, richterliches Urteil auszuüben beziehungsweise zu vollziehen. „Gericht halten“ bewahrt den forensischen Sinn und ist im Deutschen idiomatisch.
- source_word: ὅτι
  choice: weil
  rationale: Leitet hier den Grund für die Verleihung der Vollmacht ein.
- source_word: υἱὸς ἀνθρώπου
  choice: der Menschensohn
  rationale: Trotz des fehlenden Artikels im Griechischen ist die Wendung im johanneischen Kontext sehr wahrscheinlich als etablierter christologischer Titel zu verstehen; „der Menschensohn“ bewahrt zudem den möglichen Bezug zu Daniel 7.
- source_word: ἐστίν
  choice: ist
  rationale: Schlichte und genaue Wiedergabe der Präsens-Kopula.
theological_decisions:
- issue: Ist υἱὸς ἀνθρώπου ein christologischer Titel oder eine allgemeine Bezeichnung menschlicher Natur?
  choice: Im Haupttext als Titel „der Menschensohn“ wiedergegeben.
  alternative: '„weil er ein Menschensohn ist“, das heißt: weil er menschlicher Natur ist.'
  rationale: Der Sprachgebrauch im Johannesevangelium und der Zusammenhang von richterlicher Vollmacht sprechen für den Titel mit möglichem Anklang an Daniel 7. Da die artikellose griechische Form auch generisch verstanden werden kann, bleibt diese echte Deutungsmöglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollmacht“ trägt den Gedanken rechtmäßig übertragener Autorität; „Gericht halten“ bewahrt die richterliche Bedeutung, ohne unnötig technisch zu klingen. Der Fußnotenmarker [a] steht unmittelbar bei der inhaltlich betroffenen Aussage.
