  source_fidelity: 'Die Übersetzung gibt die kontrastive Aussage präzise wieder: „Ich aber“ entspricht ἐγὼ δέ; „kein Zeugnis von einem Menschen“ bewahrt die Quellenangabe παρὰ ἀνθρώπου im Singular; „nehme … an“ ist für λαμβάνω mit μαρτυρίαν idiomatisch und semantisch vertretbar. „Vielmehr sage ich dies“ bildet ἀλλὰ ταῦτα λέγω angemessen ab. Der Zweck mit passivischem σωθῆτε ist in „damit ihr gerettet werdet“ klar erhalten.'
  naturalness: Die Formulierung ist modernes, würdevolles Standarddeutsch und bleibt knapp. „Von einem Menschen“ ist trotz der generischen Bedeutung des griechischen Singulars im Kontext verständlich und vermeidet eine nicht erforderliche Pluralisierung. „Dies“ ist eine natürliche deutsche kollektive Wiedergabe des neutralen Plurals ταῦτα.
  terminology: „Zeugnis“ trifft die beweis- und aussagebezogene Bedeutung von μαρτυρία. „Gerettet werdet“ bewahrt den passivischen und weit gefassten Heilsbezug von σωθῆτε, ohne ihn dogmatisch einzugrenzen.
