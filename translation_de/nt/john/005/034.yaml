id: JHN.5.34
reference: John 5:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: de
  text: Ich aber nehme kein Zeugnis von einem Menschen an; vielmehr sage ich dies, damit ihr gerettet werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: von einem Menschen
  rationale: παρά mit dem Genitiv bezeichnet hier die Herkunft oder Quelle. Der Singular ἀνθρώπου wird gewahrt; „von einem Menschen“ klingt im heutigen Deutsch natürlich und bezeichnet im Kontext menschliches Zeugnis allgemein.
- source_word: μαρτυρίαν
  choice: Zeugnis
  rationale: „Zeugnis“ gibt den aussage- und beweisbezogenen Sinn von μαρτυρία wieder und passt zum rechtlichen Bildfeld des Zusammenhangs.
- source_word: λαμβάνω
  choice: nehme … an
  rationale: Bei einem Zeugnis bedeutet λαμβάνω hier nicht nur das bloße Empfangen, sondern dessen Annahme oder Inanspruchnahme. „Annehmen“ ist im Deutschen idiomatischer als „empfangen“, ohne die Aussage unnötig auszuweiten.
- source_word: ταῦτα
  choice: dies
  rationale: Obwohl ταῦτα formal im Neutrum Plural steht, fasst das natürliche deutsche „dies“ die soeben genannten Aussagen kollektiv zusammen. „Diese Dinge“ wäre formnäher, klingt hier jedoch unnatürlich.
- source_word: λέγω
  choice: sage ich
  rationale: Das einfache Präsens gibt λέγω unmittelbar und idiomatisch wieder.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: damit ihr gerettet werdet
  rationale: „Damit“ macht den Zwecksinn von ἵνα deutlich. Die passive Form „gerettet werdet“ bewahrt das Passiv von σωθῆτε und lässt den umfassenden Rettungs- beziehungsweise Heilssinn offen.
- source_word: δὲ … ἀλλὰ
  choice: aber … vielmehr
  rationale: Die Verbindung markiert erst einen Gegensatz und führt dann zur eigentlichen Zielaussage weiter. „Aber … vielmehr“ bildet diese argumentative Bewegung klar ab.
theological_decisions:
- issue: Bedeutung von σωθῆτε im Kontext
  choice: damit ihr gerettet werdet
  alternative: damit ihr zum Heil kommt / damit ihr befreit werdet
  rationale: Die Übersetzung bewahrt den breiten soteriologischen Gehalt von σῴζω, ohne die Art und Weise der Rettung konfessionell oder dogmatisch näher festzulegen.
- issue: Verhältnis Jesu zu menschlichem Zeugnis
  choice: Ich aber nehme kein Zeugnis von einem Menschen an
  alternative: Ich bin nicht auf das Zeugnis eines Menschen angewiesen
  rationale: Die gewählte Fassung bleibt näher am Wortlaut und vermeidet es, die Aussage ausdrücklich als bloße Unabhängigkeit oder fehlende Bedürftigkeit auszulegen, auch wenn dies im Kontext mitschwingen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und kontrastreich. „Von einem Menschen“ bewahrt den griechischen Singular, während „dies“ den griechischen Neutrum-Plural im Deutschen idiomatisch kollektiv wiedergibt.
