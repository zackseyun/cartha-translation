id: JHN.5.31
reference: John 5:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: de
  text: Wenn ich über mich selbst Zeugnis ablege, ist mein Zeugnis nicht wahr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gilt mein Zeugnis nicht“; im Zusammenhang kann die rechtliche Gültigkeit einer Zeugenaussage gemeint sein.'
    reason: Lexikalische Alternative im rechtlichen Kontext, ohne die direkte Bedeutung „wahr“ aus dem Haupttext zu verdrängen.
lexical_decisions:
- source_word: Ἐὰν
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein; „wenn“ gibt die einfache konditionale Bedeutung ohne zusätzliche Wiederholungsnuance wieder.
- source_word: ἐγὼ
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und trägt eine leichte Betonung des Sprechers.
- source_word: μαρτυρῶ
  choice: Zeugnis ablege
  rationale: Bewahrt den Aussage- und Rechtskontext von μαρτυρέω und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: περὶ ἐμαυτοῦ
  choice: über mich selbst
  rationale: Gibt περί mit Genitiv direkt als „über/betreffend“ wieder, ohne die stärker deutende Nuance „zu meinen eigenen Gunsten“ einzutragen.
- source_word: ἡ μαρτυρία μου
  choice: mein Zeugnis
  rationale: Erhält die Wortverwandtschaft mit μαρτυρῶ und den beweisrechtlichen Klang des Ausdrucks.
- source_word: οὐκ ἔστιν ἀληθής
  choice: ist nicht wahr
  rationale: Dies ist die direkte Wiedergabe von ἀληθής und bewahrt die Spannung der Aussage; die kontextuell mögliche Bedeutung „nicht gültig“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Aussage Jesu, sein Zeugnis sei „nicht wahr“
  choice: Die Aussage wird unmittelbar mit „ist mein Zeugnis nicht wahr“ wiedergegeben.
  alternative: „ist mein Zeugnis nicht gültig“ bzw. „gilt mein Zeugnis nicht“
  rationale: ἀληθής bedeutet grundsätzlich „wahr“. Der Zusammenhang mit den Regeln über Zeugenaussagen kann auf rechtliche Geltung zielen, doch diese Deutung soll die sprachliche und theologische Spannung, auch im Verhältnis zu Johannes 8,14, nicht im Haupttext auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Wendung „Zeugnis ablegen“ erhält den forensischen Hintergrund, ohne altertümlich zu wirken.
