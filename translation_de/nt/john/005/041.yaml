  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: de
  text: Ich nehme keine Ehre[a] von Menschen[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anerkennung“, „Ruhm“ oder „Herrlichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen ein Wort, das je nach Zusammenhang „Menschen“ oder „Männer“ bedeuten kann; hier sind Menschen allgemein gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: Ehre
  rationale: δόξα bezeichnet hier die Ehre, Anerkennung oder den Ruhm, den andere verleihen. „Ehre“ gibt diesen Sinn im Deutschen natürlich wieder und wahrt zugleich den Bezug zum johanneischen Thema der Herrlichkeit, ohne hier das missverständliche „Herrlichkeit von Menschen“ zu verwenden.
- source_word: παρὰ ἀνθρώπων
  choice: von Menschen
  rationale: παρά mit dem Genitiv bezeichnet die Herkunft oder Quelle. Das generisch gebrauchte ἀνθρώπων meint hier Menschen im Unterschied zu Gott; „von Menschen“ ist im Deutschen präzise, inklusiv und idiomatisch.
- source_word: οὐ λαμβάνω
  choice: nehme ... nicht an
  rationale: λαμβάνω kann „empfangen“ oder „annehmen“ bedeuten. Bei Ehre als angebotenem menschlichem Ansehen ist „annehmen“ im Deutschen natürlicher als „empfangen“ und bleibt eng am griechischen Präsens.
theological_decisions:
- issue: Bedeutung von Jesu Aussage über menschliche Anerkennung
  choice: Der Wortlaut verneint, dass Jesus Ehre von Menschen annimmt, ohne den Satz interpretierend zu erweitern.
  alternative: Jesus sagt ausdrücklich, dass er menschliche Anerkennung weder sucht noch zur Bestätigung seiner Sendung benötigt.
  rationale: Der Zusammenhang legt nahe, dass Jesu Sendung und Identität nicht von menschlicher Anerkennung abhängen. Da im Griechischen jedoch λαμβάνω und nicht „suchen“ steht, bleibt die Übersetzung beim offenen Wortlaut und trägt die kontextuelle Deutung nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit der Verbklammer „nehme ... an“ ist natürlich und klar. „Ehre“ vermeidet die im Deutschen unidiomatische Verbindung „Herrlichkeit von Menschen“, während die Fußnote die breitere Bedeutungsweite von δόξα sichtbar hält.
