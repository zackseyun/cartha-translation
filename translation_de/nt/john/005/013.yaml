source:
  edition: SBLGNT
  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: de
  text: Doch der Mann, der geheilt worden war, wusste nicht, wer es war; denn Jesus hatte sich unbemerkt entfernt[a], weil sich an diesem Ort eine Menschenmenge befand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte sich zurückgezogen“ oder „war unbemerkt weggegangen“. Das griechische Verb deutet hier wahrscheinlich darauf hin, dass Jesus sich unauffällig entfernte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: der Mann, der geheilt worden war
  rationale: Das substantivierte maskuline Passivpartizip bezeichnet den Geheilten. Die Relativsatzform klingt im modernen Deutsch natürlich und bewahrt sowohl den Passivcharakter als auch die zeitliche Vorordnung der Heilung.
- source_word: οὐκ ᾔδει
  choice: wusste nicht
  rationale: Dies ist die schlichte und idiomatische deutsche Entsprechung von οὐκ ᾔδει im Kontext.
- source_word: τίς ἐστιν
  choice: wer es war
  rationale: Die indirekte Frage betrifft die Identität des unbekannten Handelnden. Das deutsche Präteritum folgt natürlich dem vergangenen Erzählrahmen, ohne die Aussage inhaltlich zu verändern.
- source_word: ἐξένευσεν
  choice: hatte sich unbemerkt entfernt
  rationale: Das Verb kann ein unauffälliges Sichentziehen oder Weggehen bezeichnen. Die Formulierung gibt diese Nuance wieder; das Plusquamperfekt verdeutlicht, dass Jesus bereits fort war, als der Geheilte befragt wurde.
- source_word: ὄχλου ὄντος
  choice: weil sich … eine Menschenmenge befand
  rationale: Der Genitivus absolutus kann hier begründend oder als begleitender Umstand verstanden werden. „Weil“ gibt den naheliegenden erklärenden Zusammenhang idiomatisch wieder.
- source_word: ἐν τῷ τόπῳ
  choice: an diesem Ort
  rationale: Die Wendung bewahrt den ausdrücklichen Ortsbezug des Griechischen und klingt im Deutschen natürlicher als „in dem Ort“.
