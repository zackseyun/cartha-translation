review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die rhetorische Möglichkeitsfrage πῶς δύνασθε ... πιστεῦσαι angemessen wieder. Die beiden Vorkommen von δόξα werden einheitlich als „Ehre“ übersetzt, und der Kontrast zwischen voneinander empfangener und von Gott stammender Ehre bleibt klar. „Wenn ihr“ ist eine idiomatische Wiedergabe des griechischen Partizips λαμβάνοντες im argumentativen Zusammenhang; der Sinn wird nicht verändert. „Dem alleinigen Gott“ gibt τοῦ μόνου θεοῦ zutreffend wieder.
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Der Satz ist flüssig; „Ehre voneinander annehmen“ und „die Ehre ... nicht suchen“ sind in diesem Register natürlich. Der mit „aber“ ausgedrückte Kontrast ist im Deutschen sinnvoll und entspricht der deutlich antithetischen Aussage des Verses.
  terminology: „Glauben“ ist für πιστεῦσαι angemessen und lässt die johanneische Bedeutungsweite offen. Die konsequente Wiedergabe von δόξα mit „Ehre“ bewahrt die Wiederholung des griechischen Begriffs. „Herrlichkeit“ und „einzigen Gott“ sind in der Fußnote als tragfähige Alternativen kenntlich gemacht, ohne eine theologische Deutung hinzuzufügen.
