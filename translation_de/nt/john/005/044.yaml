id: JHN.5.44
reference: John 5:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: de
  text: Wie könnt ihr glauben, wenn ihr Ehre voneinander annehmt, aber die Ehre, die von dem alleinigen Gott kommt, nicht sucht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrlichkeit“ statt „Ehre“ an beiden Stellen; auch: „von dem einzigen Gott“.'
    reason: Lexikalische Alternativen für δόξα und μόνος werden transparent gemacht, ohne die Wiederholung oder Gottes Einzigkeit abzuschwächen.
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Wie könnt ihr glauben
  rationale: Die rhetorische Frage nach der Möglichkeit wird im modernen Deutschen natürlich mit „Wie könnt ihr“ wiedergegeben; der Fähigkeitsaspekt von δύνασθε bleibt erhalten.
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck. Im Deutschen vermittelt „ihr“ im Rahmen der rhetorischen Frage diesen Nachdruck, ohne ihn durch „ihr selbst“ zu überzeichnen.
- source_word: δόξαν
  choice: Ehre
  rationale: Im unmittelbaren Zusammenhang bezeichnet δόξα die von Menschen oder von Gott gewährte Anerkennung bzw. Ehre. „Ehre“ ist im Deutschen an beiden Stellen natürlich und bewahrt die lexikalische Wiederholung.
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: wenn ihr Ehre voneinander annehmt
  rationale: Der Partizipialsatz beschreibt die Haltung, die dem Glauben entgegensteht. „Wenn“ macht diesen sachlichen Zusammenhang idiomatisch verständlich; „annehmt“ gibt das aktive Entgegennehmen menschlicher Anerkennung wieder.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: aber ... nicht sucht
  rationale: Obwohl καί gewöhnlich „und“ bedeutet, liegt hier zwischen menschlicher und göttlicher Ehre ein deutlicher Gegensatz vor. „Aber“ bildet diesen im Deutschen natürlich ab.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: die Ehre, die von dem alleinigen Gott kommt
  rationale: Der Relativsatz gibt die attributive Präpositionalphrase klar wieder. „Dem alleinigen Gott“ bewahrt die Exklusivität von μόνος ohne eine zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Bedeutung von πιστεῦσαι im johanneischen Zusammenhang
  choice: glauben
  alternative: vertrauen
  rationale: „Glauben“ ist die breite und übliche Wiedergabe von πιστεύω und lässt offen, welche Aspekte von Vertrauen und Anerkennung Jesu der Kontext einschließt.
- issue: Einheitliche Wiedergabe von δόξα
  choice: Ehre an beiden Stellen
  alternative: Herrlichkeit an beiden Stellen
  rationale: Die Wiederholung wird bewahrt, während „Ehre“ den Kontrast zwischen gegenseitiger menschlicher Anerkennung und der von Gott kommenden Anerkennung im heutigen Deutschen klar ausdrückt. „Herrlichkeit“ ist lexikalisch möglich, klingt bei gegenseitigem menschlichem Empfang jedoch weniger natürlich.
- issue: Aussage von τοῦ μόνου θεοῦ
  choice: dem alleinigen Gott
  alternative: dem einzigen Gott
  rationale: Beide Formulierungen drücken Gottes Einzigkeit aus. „Der alleinige Gott“ bleibt eng an μόνος und vermeidet eine über den Wortlaut hinausgehende christologische oder antichristologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe bleibt erhalten. Der griechische Partizipialsatz wird zur besseren Verständlichkeit als konditionaler Nebensatz wiedergegeben; der Kontrast wird mit „aber“ ausdrücklich und idiomatisch markiert.
