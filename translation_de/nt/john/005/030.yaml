id: JHN.5.30
reference: John 5:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: de
  text: Ich kann nichts von mir selbst aus tun. Wie ich höre, so urteile ich; und mein Urteil ist gerecht, weil ich nicht meinen eigenen Willen suche, sondern den Willen dessen, der mich gesandt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: Ich kann nichts von mir selbst aus tun
  rationale: Die Formulierung bewahrt sowohl die ausdrücklich verneinte Fähigkeit als auch den Herkunfts- und Unabhängigkeitsaspekt von ἀπ’ ἐμαυτοῦ. „Von mir selbst aus“ meint hier nicht bloß alleiniges Handeln, sondern Handeln aus eigener, vom Vater unabhängiger Initiative.
- source_word: καθὼς ἀκούω κρίνω
  choice: Wie ich höre, so urteile ich
  rationale: Die Korrespondenz von Hören und Urteilen wird im Deutschen durch „wie … so“ klar und natürlich wiedergegeben; „urteilen“ wahrt den gerichtlichen Zusammenhang.
- source_word: ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν
  choice: mein Urteil ist gerecht
  rationale: „Urteil“ stellt die Verbindung zu κρίνω her. Im Deutschen ist „gerecht“ in Verbindung mit einem Urteil idiomatisch und umfasst dessen Rechtmäßigkeit und Gerechtigkeit.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: ich suche nicht meinen eigenen Willen
  rationale: „Suche“ bildet ζητῶ formal ab, ohne es vorschnell als bloßes Wünschen oder Verfolgen auszulegen. „Meinen eigenen“ erhält die Hervorhebung des griechischen Possessivums.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: den Willen dessen, der mich gesandt hat
  rationale: Die substantivierte Partizipialwendung wird präzise wiedergegeben, ohne „Vater“ ausdrücklich einzusetzen, wo der griechische Text relational von dem Sendenden spricht.
theological_decisions:
- issue: Das Verhältnis des Handelns des Sohnes zum Sendenden in ἀπ’ ἐμαυτοῦ
  choice: von mir selbst aus
  alternative: aus eigener Macht; allein; unabhängig
  rationale: 'Die Übersetzung lässt die Spannung des Textes bestehen: Jesus verneint ein Handeln aus sich selbst als unabhängiger Quelle. Sie deutet dies weder als absolute Unfähigkeit noch löst sie die Aussage durch eine dogmatische Erläuterung auf.'
- issue: δικαία im Zusammenhang mit κρίσις
  choice: gerecht
  alternative: richtig; rechtmäßig
  rationale: „Gerecht“ ist bei einem gerichtlichen Urteil natürlich und gibt sowohl sachliche Richtigkeit als auch Gerechtigkeit wieder, ohne den Ausdruck auf bloße Korrektheit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus „Wie ich höre, so urteile ich“ macht die syntaktische Beziehung klar. Keine Fußnote ist erforderlich, da „von mir selbst aus“ den Herkunfts- und Unabhängigkeitsaspekt im Haupttext ausreichend bewahrt.
