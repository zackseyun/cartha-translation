id: JHN.5.11
reference: John 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: de
  text: 'Doch er antwortete ihnen: »Der mich gesund gemacht hat, der sagte zu mir: ›Nimm deine Matte[a] und geh!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Liege« oder »Bett« bedeuten; gemeint ist eine einfache Schlafunterlage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche und direkte deutsche Erzählverb für eine Erwiderung im Dialog.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Der mich gesund gemacht hat
  rationale: Gibt das substantivierte Partizip natürlich wieder und bezeichnet im Kontext eindeutig die körperliche Heilung.
- source_word: ἐκεῖνός
  choice: der
  rationale: Die Wiederaufnahme mit »der« in der Konstruktion »Der ..., der ...« bewahrt die Hervorhebung des griechischen Demonstrativpronomens in natürlichem Deutsch.
- source_word: Ἆρον
  choice: Nimm
  rationale: Im Zusammenhang mit der Matte ist »Nimm deine Matte« eine natürliche deutsche Wiedergabe des konkreten Befehls; gemeint ist, sie an sich beziehungsweise hochzunehmen.
- source_word: κράβαττόν
  choice: Matte
  rationale: Bezeichnet hier eine einfache Schlafunterlage und vermeidet die moderne Vorstellung eines großen Bettmöbels.
- source_word: περιπάτει
  choice: geh
  rationale: Der Befehl fordert den Geheilten auf, sich gehend fortzubewegen. »Geh« klingt im Deutschen in Verbindung mit dem Mitnehmen der Matte natürlicher als das isolierte »Lauf«.
- source_word: δὲ
  choice: Doch
  rationale: Markiert die leichte Gegenüberstellung zur vorausgehenden Anklage und wirkt zugleich erzählerisch würdig.
theological_decisions:
- issue: Bedeutungsumfang der Heilungsbeschreibung
  choice: gesund gemacht
  alternative: heil beziehungsweise ganz gemacht
  rationale: Der unmittelbare Zusammenhang spricht von körperlicher Heilung. »Gesund gemacht« bewahrt diesen konkreten Sinn, ohne eine weitergehende geistliche Ganzwerdung in den Vers hineinzulesen.
- issue: Hervorhebung des Heilenden durch ἐκεῖνος
  choice: »Der mich gesund gemacht hat, der ...«
  alternative: »Der mich gesund gemacht hat, sagte ...«
  rationale: Die doppelte »der«-Konstruktion erhält die emphatische Bezugnahme des griechischen Textes, ohne festzulegen, warum der Geheilte sich auf die Autorität des Heilenden beruft.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird durch deutsche Anführungszeichen klar gegliedert; die emphatische griechische Satzstruktur bleibt in idiomatischer Form erhalten.
