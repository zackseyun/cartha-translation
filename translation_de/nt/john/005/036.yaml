id: JHN.5.36
reference: John 5:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: de
  text: 'Doch ich habe ein größeres Zeugnis als das des Johannes. Denn die Werke, die der Vater mir gegeben hat, damit ich sie vollende – eben diese Werke, die ich tue –, legen von mir Zeugnis ab: Der Vater hat mich gesandt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρίαν
  choice: Zeugnis
  rationale: „Zeugnis“ bewahrt den rechtlich-evidenziellen Sinn des johanneischen Begriffs und verbindet sich im Deutschen natürlich mit „haben“.
- source_word: μείζω τοῦ Ἰωάννου
  choice: ein größeres Zeugnis als das des Johannes
  rationale: 'Die Formulierung gibt den Komparativ direkt wieder und macht die im griechischen Genitiv enthaltene Ellipse verständlich: Verglichen wird Jesu Zeugnis mit dem Zeugnis des Johannes.'
- source_word: ἔργα
  choice: Werke
  rationale: „Werke“ erhält die theologische Weite des johanneischen Ausdrucks und verengt ihn nicht auf Wunder allein.
- source_word: δέδωκέν μοι ὁ πατήρ
  choice: die der Vater mir gegeben hat
  rationale: Das deutsche Perfekt spiegelt den vollendeten Akt mit fortdauernder Bedeutung wider; „der Vater“ entspricht dem bestimmten griechischen Titel ohne ergänzten Possessivartikel.
- source_word: ἵνα τελειώσω αὐτά
  choice: damit ich sie vollende
  rationale: Der Finalsatz bewahrt ausdrücklich den Zweckcharakter von ἵνα und gibt τελειόω als das Zu-Ende-Führen des übertragenen Auftrags wieder.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: eben diese Werke, die ich tue
  rationale: „Eben diese“ bildet die emphatische Wiederaufnahme ab; „die ich tue“ ist knapp, gegenwartsbezogen und in biblisch-dignifiziertem Deutsch verständlich.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: legen über mich Zeugnis ab
  rationale: Die Wendung erhält sowohl die Zeugnis-Metaphorik als auch den Bezug περὶ ἐμοῦ. Wegen des deutschen Plurals „Werke“ steht das Verb im Plural, obwohl das griechische Neutrum Plural ein Verb im Singular hat.
- source_word: ἀπέσταλκεν
  choice: hat mich gesandt
  rationale: Das Perfekt wahrt die fortdauernde Bedeutung der erfolgten Sendung; „gesandt“ erhält den johanneischen Sendungsbegriff.
theological_decisions:
- issue: Umfang der Werke, die Jesus bezeugen
  choice: „Werke“ bleibt umfassend und bezeichnet die vom Vater übertragenen Taten Jesu.
  alternative: Den Ausdruck ausdrücklich auf Wunder oder Zeichen zu beschränken.
  rationale: Der Vers nennt allgemein ἔργα. Eine Eingrenzung auf Wunder würde eine mögliche johanneische Dimension hervorheben, die der Wortlaut hier nicht ausdrücklich festlegt.
- issue: Verhältnis des Zeugnisses Jesu zu dem des Johannes
  choice: Das durch Jesu Werke vermittelte Zeugnis ist größer als das Zeugnis des Johannes.
  alternative: Jesus selbst werde unmittelbar mit Johannes verglichen.
  rationale: μαρτυρίαν ist das ausgedrückte Vergleichsglied; der Genitiv τοῦ Ἰωάννου ist am natürlichsten als elliptischer Verweis auf das Zeugnis des Johannes zu verstehen.
- issue: Aussage der Werke über Jesu Sendung
  choice: Die Werke bezeugen, dass der Vater Jesus gesandt hat.
  alternative: Die Werke beweisen lediglich Jesu Vollmacht, ohne seine Sendung durch den Vater zu bezeugen.
  rationale: Der ὅτι-Satz nennt ausdrücklich die Sendung durch den Vater als Inhalt des Zeugnisses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die emphatische Wiederaufnahme „eben diese Werke“ hervor. Der abschließende Doppelpunkt macht den Inhalt des Zeugnisses klar, ohne zusätzliche Deutung einzuführen.
