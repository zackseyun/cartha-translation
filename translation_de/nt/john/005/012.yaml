source:
  edition: SBLGNT
  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: de
  text: 'Da fragten sie ihn: „Wer ist der Mann, der zu dir gesagt hat: ‚Nimm es[a] und geh!‘?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nimm und geh umher.“ Das Objekt bleibt im Griechischen unausgesprochen; aus dem vorherigen Zusammenhang ist die Matte oder Schlafunterlage gemeint, auf der der Mann gelegen hatte.'
    reason: Das Deutsche verlangt hier normalerweise ein Objekt; die Fußnote macht die Ergänzung „es“ und die wörtliche Form transparent.
lexical_decisions:
- source_word: ἠρώτησαν
  choice: fragten
  rationale: Der Aorist von ἐρωτάω bezeichnet hier eine einfache Frage; „fragten“ ist natürlich und unterstellt nicht unnötig ein feindseliges Verhör.
- source_word: οὖν
  choice: Da
  rationale: οὖν führt die Reaktion aus dem vorherigen Vers folgernd und erzählerisch weiter. „Da“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf den geheilten Mann.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Wer ist der Mann
  rationale: Die direkte Frage und die Bezeichnung eines bestimmten männlichen Menschen werden knapp und formal entsprechend wiedergegeben.
- source_word: ὁ εἰπών σοι
  choice: der zu dir gesagt hat
  rationale: Das attributive Aoristpartizip identifiziert den Mann anhand seiner vorausgegangenen Äußerung; das deutsche Perfekt ist im Dialog natürlich.
- source_word: Ἆρον
  choice: Nimm es
  rationale: Der Imperativ von αἴρω bedeutet hier „aufheben/nehmen“. Das im Griechischen unausgesprochene Objekt wird im Deutschen durch „es“ aufgenommen und durch eine Fußnote erklärt.
- source_word: καὶ περιπάτει
  choice: und geh umher
  rationale: περιπατέω bezeichnet wörtlich das Umhergehen. „Geh umher“ bewahrt den Sinn des präsentischen Imperativs, ohne dessen Aspekt übermäßig auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „geh umher“ erhält gegenüber dem bloßen „geh“ die konkrete Grundbedeutung von περιπατέω.
