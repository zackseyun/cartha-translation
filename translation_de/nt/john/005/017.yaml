  text: ὁ ⸀δὲ ἀπεκρίνατο αὐτοῖς· Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται κἀγὼ ἐργάζομαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: de
  text: 'Doch er antwortete ihnen: „Mein Vater wirkt bis jetzt, und auch ich wirke.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel kennzeichnet hier einen milden Gegensatz zur vorausgehenden Anklage und zugleich die Fortführung der Erzählung; „Doch“ gibt die erwidernde Gegenüberstellung natürlich wieder.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: er antwortete ihnen
  rationale: Idiomatiche und genaue Wiedergabe des deponentischen Verbs mit Dativobjekt.
- source_word: Ὁ πατήρ μου
  choice: Mein Vater
  rationale: Bewahrt die persönliche Gottesbezeichnung Jesu und ihre theologische Aussagekraft, ohne sie auszudeuten.
- source_word: ἕως ἄρτι
  choice: bis jetzt
  rationale: Gibt die zeitliche Fortdauer bis zum gegenwärtigen Zeitpunkt unmittelbar und natürlich wieder.
- source_word: ἐργάζεται
  choice: wirkt
  rationale: „Wirken“ bezeichnet fortgesetzte Tätigkeit und passt im Deutschen sowohl zur Tätigkeit des Vaters als auch zu der Jesu; der Präsenscharakter bleibt erhalten.
- source_word: κἀγὼ
  choice: und auch ich
  rationale: Bewahrt die additive Hervorhebung des ausdrücklich genannten ἐγώ und stellt Jesus parallel zum Vater.
- source_word: ἐργάζομαι
  choice: wirke
  rationale: Die identische Wortwahl erhält die bewusste lexikalische und theologische Parallelität zu ἐργάζεται.
theological_decisions:
- issue: Verhältnis des Wirkens Jesu zum Wirken des Vaters am Sabbat
  choice: „Mein Vater wirkt bis jetzt, und auch ich wirke.“
  alternative: „Mein Vater arbeitet bis jetzt, und auch ich arbeite.“
  rationale: Die Formulierung bewahrt die auffällige Parallelität zwischen dem fortdauernden Wirken des Vaters und Jesu eigenem Wirken. Sie fügt weder eine Erklärung zum Sabbat noch eine ausdrückliche Gleichheitsaussage hinzu und schwächt die theologische Spannung nicht ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wirken“ ist in diesem Zusammenhang natürlicher und umfassender als „arbeiten“ und vermeidet einen unnötig beruflichen oder körperlichen Beiklang. Das deutsche Präsens kann sowohl eine aktuelle als auch eine fortdauernde Tätigkeit ausdrücken, sodass keine Fußnote zur Aspektfrage erforderlich ist.
