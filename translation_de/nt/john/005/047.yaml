  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: de
  text: Wenn ihr aber seinen Schriften[a] nicht glaubt, wie werdet ihr dann meinen Worten glauben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schreiben“. Das griechische Wort kann Briefe oder Schriften bezeichnen; hier meint es das, was Mose geschrieben hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn ... aber
  rationale: Gibt die Bedingung εἰ und die kontrastive Weiterführung durch δέ in natürlicher deutscher Wortstellung wieder.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: seinen Schriften
  rationale: γράμματα kann Buchstaben, Schriftstücke oder Schriften bezeichnen; im unmittelbaren Zusammenhang sind die Schriften des Mose gemeint. „Schriften“ trifft den Sinn, ohne ausdrücklich „Heilige Schrift“ einzutragen.
- source_word: οὐ πιστεύετε
  choice: ihr ... nicht glaubt
  rationale: πιστεύω mit Dativ bezeichnet hier, das schriftliche Zeugnis als wahr und glaubwürdig anzunehmen. Das Präsens wird als deutsches Präsens wiedergegeben.
- source_word: πῶς ... πιστεύσετε
  choice: wie werdet ihr dann ... glauben?
  rationale: Die Frageform und das Futur von πιστεύσετε bleiben erhalten. „Dann“ verdeutlicht idiomatisch den Folgerungszusammenhang, ohne die Aussage in ein bloßes „Können“ umzudeuten.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: meinen Worten
  rationale: ῥήματα meint hier Jesu gesprochene Worte oder Äußerungen. „Worte“ ist natürlich und bewahrt den Kontrast zu den „Schriften“ des Mose.
theological_decisions:
- issue: Bezug von ἐκείνου („seinen“)
  choice: Das Pronomen bleibt als „seinen“ stehen und bezieht sich im Kontext auf Mose.
  alternative: Den Namen „Mose“ im Haupttext wiederholen.
  rationale: Johannes 5,45–46 nennt Mose ausdrücklich. Die pronominale Form wahrt die Kohäsion des griechischen Textes, während der Bezug aus dem unmittelbaren Zusammenhang eindeutig ist.
- issue: Bedeutung von πιστεύω
  choice: In beiden Satzhälften „glauben“.
  alternative: „vertrauen“ oder in den beiden Satzhälften unterschiedlich übersetzen.
  rationale: Hier steht die Annahme des Zeugnisses der Schriften und der Worte als wahr im Vordergrund. Die gleiche Wiedergabe bewahrt zudem die rhetorische Parallelität.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede im Plural wird als „ihr“ wiedergegeben. Der rhetorische Gegensatz zwischen den Schriften des Mose und Jesu Worten bleibt erhalten.
