  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: de
  text: 'In diesen Hallen lag eine große Zahl Kranker: Blinde, Lahme und Menschen mit verkümmerten Gliedmaßen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Verdorrte“ oder „Vertrocknete“; gemeint sind wahrscheinlich Menschen mit verkümmerten oder gelähmten Gliedmaßen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: In diesen Hallen
  rationale: Das feminine Demonstrativpronomen im Plural verweist auf die im vorigen Vers genannten Säulenhallen. Die Wiederaufnahme des Bezugsworts ergibt im Deutschen einen klaren und natürlichen Satz.
- source_word: κατέκειτο
  choice: lag
  rationale: Das Imperfekt von κατάκειμαι bezeichnet hier den andauernden Zustand des Liegens. Der Singular entspricht dem kollektiven Subjekt πλῆθος.
- source_word: πλῆθος τῶν ἀσθενούντων
  choice: eine große Zahl Kranker
  rationale: πλῆθος bezeichnet eine große Menge oder Anzahl; ἀσθενούντων meint in diesem Zusammenhang körperlich kranke oder geschwächte Menschen. Die Formulierung ist natürlich und bewahrt den kollektiven Sinn.
- source_word: τυφλῶν
  choice: Blinde
  rationale: Die substantivierte Wiedergabe bezeichnet unmittelbar Menschen, die blind sind, und passt zur folgenden Aufzählung.
- source_word: χωλῶν
  choice: Lahme
  rationale: χωλός bezeichnet Menschen, deren Gehfähigkeit beeinträchtigt ist. „Lahme“ ist hier die knappe und traditionelle deutsche Entsprechung.
- source_word: ξηρῶν
  choice: Menschen mit verdorrten Gliedern
  rationale: ξηρός bedeutet wörtlich „trocken“ oder „verdorrt“ und bezeichnet bei Menschen wahrscheinlich verkümmerte, funktionsunfähige Gliedmaßen. Die Wiedergabe bewahrt das konkrete Bild, ohne die Art der Beeinträchtigung vorschnell auf vollständige Lähmung festzulegen.
