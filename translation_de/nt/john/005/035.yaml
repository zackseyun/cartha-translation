id: JHN.5.35
reference: John 5:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: de
  text: Er war die Lampe, die brannte und leuchtete; ihr aber wolltet euch eine Zeit lang[a] in seinem Licht freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für eine Stunde“; die Wendung kann allgemein einen begrenzten Zeitraum bezeichnen.'
    reason: Die Fußnote macht die wörtliche Form sichtbar, ohne im Haupttext fälschlich eine Dauer von genau sechzig Minuten nahezulegen.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Er
  rationale: Das betonte Demonstrativpronomen verweist im Zusammenhang auf Johannes den Täufer. Das deutsche Personalpronomen ist natürlich und hält den Bezug eindeutig.
- source_word: λύχνος
  choice: Lampe
  rationale: Das Wort bezeichnet eine tragbare Lampe, nicht das Licht als abstrakte Größe. So bleibt Johannes als Lichtträger von Jesus als dem Licht unterschieden.
- source_word: καιόμενος
  choice: brannte
  rationale: Das Partizip beschreibt die fortdauernde Tätigkeit beziehungsweise den Zustand der Lampe; im Deutschen ergibt die finite Form einen natürlichen Relativsatz.
- source_word: φαίνων
  choice: leuchtete
  rationale: Im Bildzusammenhang bedeutet das Verb, Licht auszustrahlen. „Leuchtete“ verbindet sich idiomatisch mit „brannte“.
- source_word: ἠθελήσατε
  choice: ihr wolltet
  rationale: Die Form bezeichnet den willentlichen Wunsch oder die Bereitschaft der Angeredeten, ohne eine dauerhaft anhaltende Haltung zu behaupten.
- source_word: ἀγαλλιαθῆναι
  choice: euch freuen
  rationale: Das Verb bezeichnet starke Freude. „Sich freuen“ ist im heutigen Deutsch natürlich; die Intensität ergibt sich hier aus dem positiven Bild des Lichts, ohne durch ein ungewöhnliches Verb überzeichnet zu werden.
- source_word: πρὸς ὥραν
  choice: eine Zeit lang
  rationale: Die Wendung bezeichnet einen begrenzten Zeitraum und muss keine buchstäbliche Stunde meinen.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: an seinem Licht
  rationale: Diese deutsche Wendung gibt das Sichfreuen im Bereich beziehungsweise angesichts seines Lichts idiomatisch wieder. „Seinem“ bezieht sich trotz des femininen Bildworts „Lampe“ auf Johannes.
theological_decisions:
- issue: Unterscheidung zwischen Johannes und Jesus in der Lichtmetaphorik
  choice: Johannes wird als „die Lampe“ bezeichnet, nicht als „das Licht“.
  alternative: Johannes als „das Licht“ wiederzugeben.
  rationale: Der griechische Text verwendet λύχνος („Lampe“) und nicht φῶς („Licht“). Dadurch bleibt Johannes der Lichtträger und Zeuge, ohne mit dem Licht selbst gleichgesetzt zu werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Relativsatz bewahrt das Bild der aktiv brennenden und leuchtenden Lampe; das Semikolon bildet den griechischen Gegensatz mit δέ klar ab.
