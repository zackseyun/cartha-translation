  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: de
  text: Denn wenn ihr Mose glaubtet, würdet ihr mir glauben; denn er[a] schrieb über mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „jener“; das griechische Pronomen hebt Mose hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: γάρ begründet die vorausgehende Aussage, während εἰ den irrealen Bedingungssatz einleitet.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: ihr Mose glaubtet
  rationale: πιστεύω mit Dativ bezeichnet hier, jemandem Glauben zu schenken. Der Konjunktiv II gibt im Deutschen zusammen mit dem Folgesatz die nicht erfüllte Bedingung wieder.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: würdet ihr mir glauben
  rationale: Imperfekt mit ἄν bildet die Folge einer irrealen Bedingung. Der Dativ ἐμοί wird direkt mit „mir“ wiedergegeben; „an mich glauben“ würde eine im Griechischen nicht vorhandene Präposition eintragen.
- source_word: περὶ γὰρ ἐμοῦ
  choice: denn … über mich
  rationale: περί mit Genitiv bedeutet hier natürlich „über“ oder „von“ im Sinn des Gegenstands des Schreibens.
- source_word: ἐκεῖνος
  choice: er[a]
  rationale: Das Demonstrativpronomen verweist mit Nachdruck auf Mose zurück. „Er“ ist im modernen Deutschen natürlich; die mögliche stärkere Wiedergabe wird in der Fußnote bewahrt.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist bezeichnet die vollzogene Schreibtätigkeit des Mose und lässt sich hier knapp und idiomatisch mit dem Präteritum wiedergeben.
theological_decisions:
- issue: Art des Zeugnisses des Mose über Jesus
  choice: er schrieb über mich
  alternative: jener schrieb von mir
  rationale: Die Formulierung bewahrt die Aussage, dass Moses Schriften Jesus zum Gegenstand haben, ohne bestimmte Stellen zu benennen oder die Art und Reichweite dieses Zeugnisses über den griechischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Verwendung von „glauben“ für beide Formen von πιστεύω bleibt erhalten; der irreale Bedingungssatz wird ohne erklärende Erweiterung wiedergegeben.
