id: JHN.5.23
reference: John 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: de
  text: damit alle den Sohn ebenso ehren, wie sie den Vater ehren. Wer den Sohn nicht ehrt, ehrt den Vater nicht, der ihn gesandt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet einen Zweck- beziehungsweise Folgesatz ein und gibt die Kraft der griechischen Konjunktion im Deutschen knapp und natürlich wieder.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt den uneingeschränkten, allgemein formulierten Bezug des griechischen Plurals.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: ehren / ehrt
  rationale: „Ehren“ ist die direkte und kontextgerechte Wiedergabe von τιμάω; die Wiederholung desselben Verbs erhält die prägnante Parallelstruktur.
- source_word: τὸν υἱὸν
  choice: den Sohn
  rationale: „Sohn“ fungiert im johanneischen Zusammenhang als persönliche christologische Bezeichnung; die Großschreibung entspricht deutscher Konvention.
- source_word: καθὼς
  choice: ebenso … wie
  rationale: Diese Vergleichsformel drückt die starke Entsprechung zwischen der Ehrung des Sohnes und der Ehrung des Vaters idiomatisch aus, ohne zusätzliche dogmatische Terminologie einzuführen.
- source_word: τὸν πατέρα
  choice: den Vater
  rationale: „Vater“ ist hier die persönliche Bezeichnung Gottes und wird nach deutscher Konvention großgeschrieben.
- source_word: ὁ μὴ τιμῶν
  choice: Wer … nicht ehrt
  rationale: Der substantivierte Partizipialausdruck ist generisch. Die deutsche Konstruktion mit „Wer“ ist natürlich und bewahrt seine allgemeingültige Aussage.
- source_word: τὸν πέμψαντα αὐτόν
  choice: der ihn gesandt hat
  rationale: Der Relativsatz bezieht sich auf den Vater. „Gesandt“ wahrt den johanneischen Klang und gibt πέμπω präzise wieder, ohne den Auftrag näher auszugestalten.
theological_decisions:
- issue: Stärke des Vergleichs zwischen der Ehrung des Sohnes und der Ehrung des Vaters
  choice: „ebenso … wie“
  alternative: bloßes „wie“
  rationale: Die gewählte Form bewahrt die starke Entsprechung von καθώς, ohne sie abzuschwächen oder mit späterer dogmatischer Fachsprache zu erläutern.
- issue: Großschreibung von Sohn und Vater
  choice: Großschreibung als personale Bezeichnungen
  alternative: „Sohn“ und „Vater“ kleinschreiben
  rationale: Der griechische Text legt keine moderne Großschreibung fest; im Kontext bezeichnen die Wörter jedoch Jesus und Gott den Vater. Die deutsche Großschreibung verdeutlicht diesen titularen Gebrauch, ohne weitere Aussage hinzuzufügen.
- issue: Explizites „auch“ im zweiten Satz
  choice: „ehrt auch den Vater nicht“
  alternative: „ehrt den Vater nicht“
  rationale: „Auch“ macht im Deutschen den folgernden Zusammenhang idiomatisch deutlich. Es fügt keinen weiteren Gegenstand hinzu, sondern verdeutlicht, dass die Verweigerung der Ehre gegenüber dem Sohn zugleich den Vater betrifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „ehren“ sowie die Parallelität von Sohn und Vater bleiben erhalten. „Gesandt hat“ ist verständlich und trägt zugleich den für das Johannesevangelium charakteristischen Sendungsgedanken.
