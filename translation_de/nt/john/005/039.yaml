id: JHN.5.39
reference: John 5:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: de
  text: Ihr erforscht die Schriften, weil ihr meint, in ihnen ewiges Leben zu haben.[a] Und gerade sie sind es, die über mich Zeugnis ablegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Aufforderung: „Erforscht die Schriften, weil ihr meint, in ihnen ewiges Leben zu haben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Ihr erforscht
  rationale: Die Form kann Indikativ oder Imperativ sein. Im Zusammenhang beschreibt Jesus am ehesten die bestehende Praxis seiner Gesprächspartner. „Erforscht“ gibt die gründliche Beschäftigung mit den Schriften wieder; die mögliche Aufforderung bleibt in der Fußnote erhalten.
- source_word: τὰς γραφάς
  choice: die Schriften
  rationale: Der Ausdruck bezeichnet die heiligen Schriften Israels. „Die Schriften“ ist im Deutschen eindeutig genug und entspricht dem Plural des griechischen Textes.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι wird hier kausal verstanden und nennt den Grund für das Erforschen der Schriften.
- source_word: δοκεῖτε
  choice: ihr meint
  rationale: „Meinen“ gibt die Annahme der Angesprochenen natürlich wieder und bewahrt den leicht kritischen Unterton.
- source_word: ἐν αὐταῖς
  choice: in ihnen
  rationale: Die Präposition und der Rückbezug auf die Schriften werden unmittelbar wiedergegeben, ohne das Verhältnis als „durch sie“ auszudeuten.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die geläufige und im Johannesevangelium sachgerechte Wiedergabe des festen Ausdrucks.
- source_word: ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι
  choice: gerade sie sind es, die … Zeugnis ablegen
  rationale: „Gerade sie“ bewahrt den hervorgehobenen Rückbezug auf die Schriften. „Zeugnis ablegen“ erhält die im Johannesevangelium wichtige Zeugnissprache.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: Die Wendung gibt περί mit Genitiv in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Modus von Ἐραυνᾶτε
  choice: 'Indikativ: „Ihr erforscht die Schriften“'
  alternative: 'Imperativ: „Erforscht die Schriften“'
  rationale: 'Die griechische Verbform erlaubt beide Deutungen. Der unmittelbare Zusammenhang legt den Indikativ nahe: Jesus beschreibt die Schriftbeschäftigung seiner Gegner und stellt ihr Zeugnis über ihn ihrer Weigerung gegenüber, zu ihm zu kommen. Die grammatisch mögliche Aufforderung wird in einer Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am Gedankengang des griechischen Textes; „gerade sie“ macht den betonten Rückverweis natürlich hörbar. Die ambige Verbform wird nicht stillschweigend vereindeutigt, sondern durch die Fußnote transparent gehalten.
