  source_fidelity: 'Die Übersetzung gibt den griechischen Satzbau und die wesentlichen semantischen Beziehungen zuverlässig wieder: Ἐραυνᾶτε ist als Indikativ übersetzt, ὅτι kausal („weil“), ἐν αὐταῖς lokal („in ihnen“), und die Schriften werden als die dargestellt, die von Jesus Zeugnis ablegen. Die mögliche imperativische Lesart von Ἐραυνᾶτε bleibt sachgerecht in der Fußnote erhalten.'
