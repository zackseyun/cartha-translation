source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: de
  text: Danach war ein Fest der Juden, und Jesus ging hinauf nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Die natürliche deutsche Erzählform gibt den zeitlichen Übergang und den Rückbezug des griechischen Plurals knapp wieder; wörtlicher wäre „Nach diesen Dingen“.
- source_word: ἦν
  choice: war
  rationale: Zusammen mit „ein Fest“ bildet „war“ im Deutschen eine natürliche Entsprechung zum Imperfekt von εἰμί.
- source_word: ἑορτὴ
  choice: Fest
  rationale: „Fest“ bezeichnet hier treffend einen religiösen Festanlass und ist im modernen Deutsch natürlicher als „Festmahl“.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Der Genitiv kennzeichnet das Fest als jüdischen Festtag. Eine regionale Wiedergabe als „der Judäer“ passt in diesem Zusammenhang weniger gut.
- source_word: ἀνέβη
  choice: ging hinauf
  rationale: Die Formulierung bewahrt sowohl die Bewegungsrichtung als auch den herkömmlichen Sprachgebrauch für eine Reise nach Jerusalem.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Bedeutung von Ἰουδαίων im johanneischen Sprachgebrauch
  choice: „der Juden“
  alternative: „der Judäer“
  rationale: Da Ἰουδαίων hier ein religiöses Fest näher bestimmt, ist die Zugehörigkeit zum jüdischen Volk beziehungsweise dessen Festpraxis gemeint, nicht vorrangig die regionale Herkunft aus Judäa.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Danach“ vermeidet die im Deutschen schwerfällige Formulierung „Nach diesen Dingen“, während „ging hinauf“ die räumliche und traditionssprachliche Nuance des griechischen Verbs erhält.
