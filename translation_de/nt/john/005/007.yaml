reference: John 5:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: de
  text: 'Der Kranke antwortete ihm: »Herr, ich habe keinen Menschen, der mich in das Becken bringt, wenn das Wasser aufgewühlt wird. Während ich aber hingehe, steigt ein anderer vor mir in das Becken hinab.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: der Kranke
  rationale: Die substantivierte Partizipialform bezeichnet den erkrankten Mann; »der Kranke« ist im Deutschen prägnant und natürlich.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede kann sowohl respektvoll »Herr« als auch christologisch verstanden werden. »Herr« bewahrt diese im Griechischen vorhandene Offenheit besser als »mein Herr« oder »Herr Jesus«.
- source_word: κολυμβήθραν
  choice: Becken
  rationale: Das Wort bezeichnet ein Wasserbecken beziehungsweise einen Teich; im gegebenen städtischen Kontext ist »Becken« eine klare und sachgerechte Wiedergabe.
- source_word: ταραχθῇ
  choice: aufgewühlt wird
  rationale: Die Form beschreibt, dass das Wasser in Bewegung oder Unruhe gerät. »Aufgewühlt« gibt diesen Vorgang anschaulich wieder, ohne seine Ursache zu ergänzen.
- source_word: βάλῃ με
  choice: mich … bringt
  rationale: Wörtlich kann das Verb »werfen/legen« bedeuten; hier ist idiomatisch gemeint, den Kranken in das Becken hineinzubringen. Die Übersetzung vermeidet die im Deutschen unpassend harte Formulierung »hineinwirft«.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: Während ich aber noch unterwegs bin
  rationale: Die Wendung bezeichnet seinen eigenen langsamen Versuch, zum Wasser zu gelangen. »Noch unterwegs« drückt dies natürlich aus, ohne eine nicht ausdrücklich genannte Fortbewegungsart festzulegen.
- source_word: καταβαίνει
  choice: steigt … hinein
  rationale: Das Verb bedeutet »hinabsteigen«. In Verbindung mit dem Becken ist »hineinsteigen« im Deutschen idiomatisch und bewahrt die räumliche Bewegung.
theological_decisions:
- issue: Bedeutung der Anrede Κύριε
  choice: Herr
  alternative: mein Herr / guter Mann
  rationale: Die Übersetzung soll weder ausschließen, dass es sich zunächst um eine höfliche Anrede handelt, noch vorwegnehmen, wie weit der Kranke Jesu Identität erkennt. »Herr« lässt diese Spannung bestehen.
- issue: Ursache der Wasserbewegung
  choice: nicht angegeben
  alternative: durch einen Engel bewegt
  rationale: Der vorliegende SBLGNT-Text nennt in diesem Vers keine Ursache. Eine Engelerklärung aus der längeren Textüberlieferung zu Johannes 5,3–4 wird daher nicht in den Vers eingefügt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nahe am griechischen Gedankengang, wird jedoch für flüssiges Deutsch leicht geglättet. Die direkte Rede verwendet deutsche Anführungszeichen.
