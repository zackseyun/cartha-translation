  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: de
  text: Ihr habt zu Johannes geschickt, und er hat der Wahrheit Zeugnis gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine leichte Betonung. Im Deutschen ist „ihr“ nötig, um Person und Numerus klar auszudrücken; ein zusätzliches „selbst“ würde die Betonung unnötig verstärken.
- source_word: ἀπεστάλκατε
  choice: habt ... geschickt
  rationale: Die Perfektform bezeichnet eine bereits erfolgte Handlung mit Bezug zur gegenwärtigen Aussage. Das deutsche Perfekt klingt hier natürlich und bewahrt diesen Bezug.
- source_word: πρὸς Ἰωάννην
  choice: zu Johannes
  rationale: πρός mit einer Person als Objekt bezeichnet hier die Richtung beziehungsweise den Adressaten einer Gesandtschaft. „Zu Johannes“ ist im Deutschen idiomatisch; der Kontext identifiziert ihn, ohne dass der Text den Zusatz „der Täufer“ verwendet.
- source_word: μεμαρτύρηκε
  choice: hat ... Zeugnis abgelegt
  rationale: Das Perfekt bezeichnet ein erfolgtes Zeugnis mit fortdauernder Bedeutung. „Zeugnis ablegen“ bewahrt die forensische Zeugenmetaphorik und ist in gehobenem modernem Deutsch verständlich.
- source_word: τῇ ἀληθείᾳ
  choice: für die Wahrheit
  rationale: Der Dativ bei μαρτυρέω kann die Sache bezeichnen, für die Zeugnis abgelegt wird. „Für die Wahrheit Zeugnis ablegen“ ist natürliches Deutsch und bewahrt den bestimmten Artikel sowie die johanneische Bedeutungstiefe.
theological_decisions:
- issue: Johanneischer Gebrauch von „die Wahrheit“
  choice: die Wahrheit
  alternative: Wahrheit
  rationale: Der griechische Artikel wird beibehalten. So bleibt offen, ob lediglich wahre Aussage oder die im Johannesevangelium theologisch gewichtete „Wahrheit“ gemeint ist, ohne den Ausdruck weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und nahe am Griechischen. „Zeugnis abgelegt“ erhält das zentrale johanneische Zeugenmotiv; „geschickt“ lässt das im Kontext ergänzte Objekt der Sendung unausgesprochen, wie im Ausgangstext.
