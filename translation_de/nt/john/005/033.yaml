revisions:
- from: Ihr habt zu Johannes geschickt, und er hat für die Wahrheit Zeugnis abgelegt.
  to: Ihr habt zu Johannes geschickt, und er hat der Wahrheit Zeugnis gegeben.
  rationale: Die Revision ersetzt lediglich „für die Wahrheit Zeugnis abgelegt“ durch „der Wahrheit Zeugnis gegeben“, um die syntaktische Beziehung des griechischen Dativs und das johanneische Zeugnisvokabular im Deutschen genauer wiederzugeben. Die Perfektformen, die zurückhaltende Wiedergabe der expliziten Anrede und der bloße Name „Johannes“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:50:25Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἀπεστάλκατε als „habt ... geschickt“ und die Beibehaltung von „Johannes“ sind sachgerecht. Die Präposition „für“ bei „Zeugnis ablegen“ kann im Deutschen jedoch nahelegen, Johannes habe die Wahrheit verteidigt oder sich für sie eingesetzt. Der griechische Dativ τῇ ἀληθείᾳ bezeichnet hier die Wahrheit als Gegenstand seines Zeugnisses.
  naturalness: „Der Wahrheit Zeugnis geben“ ist im modernen, würdigen Standarddeutsch klar, idiomatisch und im johanneischen Kontext gut verständlich. Es bewahrt zugleich die knappe Struktur des Satzes.
  terminology: „Die Wahrheit“ bewahrt Artikel und johanneische Resonanz. „Zeugnis geben“ erhält das zentrale Motiv von μαρτυρέω, ohne die Richtung des Zeugnisses durch „für“ zu verschieben.
  issues:
  - severity: medium
    issue: „für die Wahrheit Zeugnis abgelegt“
    rationale: Diese Formulierung ist zwar möglich, bedeutet aber leicht „zugunsten der Wahrheit“ bzw. „die Wahrheit verteidigend“. Für μαρτυρέω mit Dativ ist „der Wahrheit Zeugnis gegeben“ präziser, weil es die Wahrheit als das Bezeugte ausdrückt.
  revised_text: Ihr habt zu Johannes geschickt, und er hat der Wahrheit Zeugnis gegeben.
  revised_footnotes: []
  revision_rationale: Die Revision ersetzt lediglich „für die Wahrheit Zeugnis abgelegt“ durch „der Wahrheit Zeugnis gegeben“, um die syntaktische Beziehung des griechischen Dativs und das johanneische Zeugnisvokabular im Deutschen genauer wiederzugeben. Die Perfektformen, die zurückhaltende Wiedergabe der expliziten Anrede und der bloße Name „Johannes“ bleiben erhalten.
