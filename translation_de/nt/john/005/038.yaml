source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: de
  text: Und sein Wort bleibt nicht in euch, denn ihr glaubt dem nicht, den er gesandt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: Wort
  rationale: „Wort“ bezeichnet hier Gottes offenbartes Wort und bewahrt zugleich den für das Johannesevangelium charakteristischen Sprachgebrauch.
- source_word: οὐκ ἔχετε ἐν ὑμῖν μένοντα
  choice: bleibt nicht in euch
  rationale: Die natürliche deutsche Verbalkonstruktion gibt das substantivbezogene Partizip μένοντα samt seiner durativen Bedeutung prägnant wieder; gegenüber „ihr habt ... nicht bleibend in euch“ vermeidet sie unnatürliche Syntax.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ gibt den begründenden Zusammenhang klar und in würdigem modernem Deutsch wieder; „weil“ wäre ebenfalls möglich.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: den er gesandt hat
  rationale: Die Relativkonstruktion bleibt erhalten. Das kontextuell auf den Vater bezogene ἐκεῖνος wird im Deutschen natürlich mit „er“ wiedergegeben.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: ihr glaubt dem nicht
  rationale: Der vorangestellte Dativ τούτῳ wird durch „dem“ aufgenommen und behält seinen persönlichen Bezug sowie einen gewissen Nachdruck. πιστεύω mit Dativ bedeutet hier, jemandem zu glauben bzw. Vertrauen zu schenken.
theological_decisions:
- issue: Verhältnis zwischen dem bleibenden Wort Gottes und dem Unglauben gegenüber dem Gesandten
  choice: Der Unglaube gegenüber dem von Gott Gesandten begründet bzw. erweist, dass Gottes Wort nicht in den Angesprochenen bleibt.
  alternative: Die Aussage kann enger darauf bezogen werden, dass sie die Schrift innerlich nicht festhalten oder ihr nicht folgen.
  rationale: Die Übersetzung erhält den kausalen Zusammenhang und die johanneische Spannung, ohne eine bestimmte Lehre über Wiedergeburt, Innewohnung oder Beharrlichkeit einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem griechischen Gedankengang; „gesandt“ bewahrt das johanneische Sendungsmotiv.
