  source_fidelity: Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder. „Sein Wort bleibt nicht in euch“ ist eine idiomatische deutsche Entfaltung von οὐκ ἔχετε ... μένοντα und wahrt die Aussage einer fehlenden dauerhaften Gegenwart des Wortes. „Dem nicht glauben“ bildet πιστεύειν mit Dativ treffend ab; „den er gesandt hat“ bewahrt das Sendungsmotiv und den Bezug auf den Vater.
