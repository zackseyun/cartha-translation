id: JHN.5.16
reference: John 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: de
  text: Und deshalb verfolgten die Juden Jesus[a], weil er dies am Sabbat tat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Judäer“; im Zusammenhang möglicherweise „die jüdischen Führer“. Im Johannesevangelium bezeichnet dieser Ausdruck oft eine bestimmte Gruppe, die Jesus entgegentritt, nicht unterschiedslos alle jüdischen Menschen.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die Wendung verweist kausal auf das zuvor geschilderte Geschehen zurück. „Deshalb“ gibt diesen Zusammenhang im Deutschen knapp und natürlich wieder.
- source_word: ἐδίωκον
  choice: verfolgten
  rationale: Das Imperfekt bezeichnet eine fortdauernde oder wiederholte feindselige Handlung. „Verfolgten“ bewahrt diese Gegnerschaft, ohne die erst in Vers 18 ausdrücklich genannte Tötungsabsicht vorwegzunehmen.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies ist die direkte ethnisch-religiöse Bezeichnung des griechischen Ausdrucks. Da der johanneische Kontext häufig eine bestimmte gegnerische Gruppe meint, erläutert eine Fußnote die mögliche Eingrenzung, ohne sie im Haupttext festzuschreiben.
- source_word: ταῦτα
  choice: dies
  rationale: Das deutsche Singularpronomen fasst die unmittelbar zuvor geschilderte Handlung idiomatisch zusammen. Ein wörtliches „diese Dinge“ wäre hier unnötig steif.
- source_word: ἐποίει
  choice: tat
  rationale: Im Zusammenhang mit der fortdauernden Verfolgung bezeichnet das Imperfekt Jesu beanstandetes Tun. Das schlichte „tat“ ist im Deutschen natürlicher; der mögliche iterative Sinn ergibt sich aus dem Kontext.
- source_word: ἐν σαββάτῳ
  choice: am Sabbat
  rationale: „Am Sabbat“ ist die übliche und natürliche deutsche Zeitangabe und entspricht dem anarthrischen griechischen Singular.
theological_decisions:
- issue: Referenz und Wiedergabe von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die Judäer; die jüdischen Führer
  rationale: Der Haupttext wahrt die direkte lexikalische Wiedergabe und legt den Referenten nicht interpretierend auf die Führungsschicht fest. Die Fußnote macht zugleich deutlich, dass im Kontext eine bestimmte gegnerische Gruppe gemeint sein kann und nicht unterschiedslos das gesamte jüdische Volk.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Kausalgefüge, bleibt aber idiomatisch. Der Fußnotenmarker [a] steht unmittelbar beim erklärungsbedürftigen Ausdruck.
