id: JHN.5.6
reference: John 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: de
  text: 'Als Jesus diesen Mann dort liegen sah und wusste, dass er schon lange in diesem Zustand war,[a] fragte er ihn: »Willst du gesund werden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er schon lange dort war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: diesen Mann
  rationale: Das Demonstrativpronomen bezeichnet den konkreten Mann im Zusammenhang; die ausdrückliche Wiedergabe mit »diesen Mann« ist im Deutschen klar und natürlich.
- source_word: ἰδὼν
  choice: als Jesus … sah
  rationale: Das vorzeitige Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben.
- source_word: κατακείμενον
  choice: dort liegen
  rationale: Die Form bezeichnet die liegende Lage des Mannes; »dort« bindet sie idiomatisch an die erzählte Szene, ohne eine Niederlegung durch andere anzudeuten.
- source_word: γνοὺς
  choice: wusste
  rationale: Die Übersetzung gibt Jesu Kenntnis wieder, ohne festzulegen, wie er zu ihr gelangte.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: schon lange in diesem Zustand war
  rationale: Die elliptische griechische Wendung bezeichnet im Zusammenhang am ehesten die lange Dauer seiner Lage beziehungsweise Erkrankung. Die Formulierung vermeidet die nicht ausdrücklich belegte Behauptung, er habe die ganze Zeit an diesem Ort gelegen.
- source_word: λέγει αὐτῷ
  choice: fragte er ihn
  rationale: Das historische Präsens wird im deutschen Erzählstil als Präteritum wiedergegeben. Wegen des unmittelbar folgenden Fragesatzes ist »fragte« natürlicher als das formal nähere »sagte«.
- source_word: Θέλεις
  choice: Willst du
  rationale: Die direkte Frage nach Wunsch oder Willen wird im heutigen Deutsch prägnant mit »Willst du« ausgedrückt.
- source_word: ὑγιὴς γενέσθαι
  choice: gesund werden
  rationale: »Gesund« gibt ὑγιής im Heilungszusammenhang natürlich wieder, während »werden« den Zustandswechsel von γίνομαι bewahrt.
theological_decisions:
- issue: Art von Jesu Wissen in γνοὺς
  choice: Jesu Wissen wird schlicht festgestellt.
  alternative: Die Kenntnis ausdrücklich als übernatürlich oder als durch Beobachtung beziehungsweise Auskunft erworben bestimmen.
  rationale: Der Text nennt die Quelle dieses Wissens nicht; die Übersetzung lässt diese Frage daher offen.
- issue: Bezug der langen Dauer in πολὺν ἤδη χρόνον ἔχει
  choice: Die lange Dauer wird auf den Zustand des Mannes bezogen.
  alternative: Die lange Dauer ausschließlich auf seinen Aufenthalt an diesem Ort beziehen.
  rationale: Die griechische Wendung ist elliptisch. Der unmittelbare Zusammenhang und Vers 5 stützen den Bezug auf seine lang anhaltende gesundheitliche Lage, ohne die mögliche situative Färbung völlig auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Anrede bleibt entsprechend dem griechischen Singular direkt beim »du«.
