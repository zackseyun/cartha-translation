source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: de
  text: 'und sie werden herauskommen: diejenigen, die Gutes getan haben, zur Auferstehung des Lebens, diejenigen aber, die Böses getan haben, zur Auferstehung des Gerichts[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Auferstehung der Verurteilung“. Im Griechischen steht „Gericht“, ein weiter gefasster Ausdruck; „Verurteilung“ ist eine interpretierende Präzisierung.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: sie werden herauskommen
  rationale: Im Zusammenhang mit den Gräbern in Vers 28 bezeichnet das Verb das Herauskommen der Toten; die Formulierung ist im modernen Deutschen natürlich.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: die, die Gutes getan haben
  rationale: Das substantivierte Adjektiv wird idiomatisch mit „Gutes“ wiedergegeben; das Aoristpartizip fasst ihre Taten als Ganzes zusammen.
- source_word: ἀνάστασιν ζωῆς
  choice: Auferstehung des Lebens
  rationale: Die Genitivverbindung wird formal bewahrt und parallel zu „Auferstehung des Gerichts“ formuliert, ohne die genaue Beziehung durch „zum Leben“ vorwegzunehmen.
- source_word: τὰ φαῦλα πράξαντες
  choice: die, die Böses verübt haben
  rationale: „Böses“ gibt den moralischen Sinn von φαῦλα im Gerichtskontext wieder. „verübt“ wahrt einen erkennbaren Unterschied zu ποιήσαντες, ohne zwingend eine gewohnheitsmäßige Praxis in den Text hineinzulesen.
- source_word: ἀνάστασιν κρίσεως
  choice: Auferstehung des Gerichts
  rationale: „Gericht“ entspricht der breiteren Bedeutung von κρίσις und vermeidet die interpretierende Verengung auf „Verdammnis“ oder „Verurteilung“.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel kennzeichnet hier den deutlichen Gegensatz zwischen den beiden Gruppen und ihren jeweiligen Auferstehungen.
theological_decisions:
- issue: Ob κρίσεως enger als „Verdammnis/Verurteilung“ oder breiter als „Gericht“ wiederzugeben ist
  choice: Gericht
  alternative: Verdammnis oder Verurteilung
  rationale: κρίσις bezeichnet grundsätzlich Gericht beziehungsweise Urteilsfindung. Der negative Kontrast ist im Zusammenhang klar, doch der deutsche Text sollte den griechischen Ausdruck nicht eigenmächtig auf das verurteilende Ergebnis verengen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Doppelpunkt bildet die nachgestellten Gruppen übersichtlich ab; die parallele Genitivkonstruktion des Griechischen bleibt erhalten.
