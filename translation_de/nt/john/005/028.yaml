id: JHN.5.28
reference: John 5:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: de
  text: Wundert euch nicht darüber, denn es kommt eine Stunde, in der alle, die in den Gräbern[a] sind, seine Stimme hören werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grabstätten“. Das griechische Wort kann Begräbnisstätten unterschiedlicher Art bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Wundert euch nicht
  rationale: Der Präsensimperativ mit μή formuliert ein Verbot. „Sich wundern“ gibt θαυμάζω natürlich und würdig wieder; „staunen“ wäre ebenfalls möglich, klingt hier aber eher positiv.
- source_word: τοῦτο
  choice: darüber
  rationale: Das Demonstrativpronomen verweist auf die vorausgehende Aussage. Im Deutschen ist „sich darüber wundern“ idiomatischer als „dies wundern“ und bewahrt denselben Bezug.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier die Begründung der Aufforderung ein. „Denn“ bildet den Zusammenhang natürlich ab, ohne den Satz unnötig zu verschachteln.
- source_word: ἔρχεται ὥρα
  choice: es kommt eine Stunde
  rationale: Der unbestimmte Ausdruck ὥρα wird als „eine Stunde“ wiedergegeben. So bleibt das für das Johannesevangelium gewichtige Bild der „Stunde“ erhalten, statt es allgemein zu „Zeit“ aufzulösen.
- source_word: ἐν ᾗ
  choice: in der
  rationale: Die Relativkonstruktion wird formal transparent und zugleich idiomatisch auf „eine Stunde“ bezogen.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: alle, die in den Gräbern sind
  rationale: πάντες mit dem substantivierenden Artikel bezeichnet „alle, die …“. μνημεῖον meint hier konkrete Begräbnisstätten; „Gräber“ ist im modernen Deutschen die natürliche Entsprechung.
- source_word: ἀκούσουσιν
  choice: werden hören
  rationale: Das Futur Aktiv von ἀκούω wird direkt als „werden hören“ wiedergegeben.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: seine Stimme
  rationale: φωνή bezeichnet in diesem persönlichen Zusammenhang die Stimme. Der griechische Genitiv nach ἀκούω verlangt im Deutschen keine zusätzliche Umschreibung.
theological_decisions:
- issue: Die Auferstehung wird dadurch angedeutet, dass die in den Gräbern seine Stimme hören.
  choice: Das konkrete Bild der Gräber wird beibehalten, ohne die Auferstehungslehre im Vers erklärend auszubauen.
  alternative: Die Aussage ausdrücklich als Auferweckung der Toten formulieren.
  rationale: Die Übersetzung soll die theologische Aussagekraft des Bildes bewahren, aber nicht vorwegnehmen, was der unmittelbare Wortlaut erst im folgenden Vers entfaltet.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die johanneische Wendung „eine Stunde“ bleibt bewusst erhalten. Die Wortstellung am Satzende folgt natürlichem Deutsch, während die Struktur des griechischen Satzes klar erkennbar bleibt.
