  source_fidelity: 'Die Übersetzung gibt den griechischen Satz vollständig und präzise wieder: μὴ θαυμάζετε ist idiomatisch als „Wundert euch nicht“ gefasst, τοῦτο wird treffend durch „darüber“ aufgenommen, und ὅτι hat mit „denn“ seinen begründenden Sinn. „Es kommt eine Stunde“ bewahrt sowohl die Zukunftsaussage als auch die bewusst beibehaltene johanneische Bildsprache von ὥρα. „Alle, die in den Gräbern sind“ entspricht πάντες οἱ ἐν τοῖς μνημείοις, und das Futur „hören werden“ gibt ἀκούσουσιν klar wieder.'
