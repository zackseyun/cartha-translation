  terminology: „Gräbern“ ist für μνημεῖα im Kontext angemessen und konkret. Die Fußnote mit „Grabstätten“ bietet eine sachgerechte lexikalische Alternative, ohne den Vers unnötig auszudeuten. „Stunde“ und „seine Stimme“ sind terminologisch konsistent und theologisch nicht überinterpretierend.
