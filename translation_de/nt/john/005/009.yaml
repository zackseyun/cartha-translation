id: JHN.5.9
reference: John 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: de
  text: Sofort wurde der Mann gesund. Er nahm seine Matte und ging umher. An jenem Tag aber war Sabbat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die Unmittelbarkeit der Heilung in klarem, natürlichem Deutsch wieder.
- source_word: ἐγένετο ὑγιὴς
  choice: wurde gesund
  rationale: Bewahrt den im Griechischen ausgedrückten Zustandswechsel, ohne eine grammatisch nicht ausdrücklich bezeichnete handelnde Person einzuführen.
- source_word: ὁ ἄνθρωπος
  choice: der Mann
  rationale: Bezeichnet den konkreten männlichen Menschen im Zusammenhang natürlich und geschlechtsgenau.
- source_word: ἦρε
  choice: nahm
  rationale: Gibt das Aufnehmen des tragbaren Schlaflagers knapp und idiomatisch wieder.
- source_word: κράβαττον
  choice: Matte
  rationale: Gemeint ist ein einfaches, tragbares Schlaflager, nicht notwendig ein Möbelstück wie ein modernes Bett.
- source_word: περιεπάτει
  choice: ging umher
  rationale: Das Imperfekt kann eine fortdauernde oder wiederholte Bewegung ausdrücken; „ging umher“ bewahrt diesen Aspekt besser als die stärker deutende Wiedergabe „begann zu gehen“.
- source_word: Ἦν δὲ
  choice: aber war
  rationale: δέ leitet hier eine erläuternde, zugleich für den folgenden Konflikt bedeutsame narrative Bemerkung ein; die deutsche Nachstellung klingt natürlich.
- source_word: σάββατον
  choice: Sabbat
  rationale: Die artikellose prädikative Wendung lässt sich im Deutschen idiomatisch ohne Artikel wiedergeben.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Entspricht der griechischen Zeitangabe präzise und in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von σάββατον als narrative Zeitangabe
  choice: Sabbat ohne Artikel
  alternative: ein Sabbat / der Sabbat
  rationale: Das Griechische hat hier keinen Artikel. Die deutsche Formulierung „An jenem Tag war Sabbat“ ist idiomatisch, bewahrt die Zeitangabe und legt sich weder auf den unbestimmten noch auf den bestimmten Artikel fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bilden die rasche Abfolge von Heilung, Aufnehmen der Matte und Gehen ab; die abschließende Sabbatnotiz bereitet den folgenden Konflikt vor.
