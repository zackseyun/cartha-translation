  terminology: „Leben“ ist die sachgerechte Wiedergabe von ζωή, ohne das im griechischen Text nicht vorhandene „ewig“ einzutragen. Die Fußnote erläutert die johanneische Resonanz zurückhaltend. „Zu mir kommen“ vermeidet eine unzulässige Auflösung in „an mich glauben“.
