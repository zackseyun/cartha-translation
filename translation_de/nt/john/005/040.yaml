  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: de
  text: Doch ihr wollt nicht zu mir kommen, damit ihr Leben habt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ihr wollt nicht zu mir kommen, damit ihr Leben habt.“ Das griechische Bindewort kann auch schlicht mit „und“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „Leben“ bezeichnet bei Johannes häufig das von Gott kommende Leben, also ewiges Leben; das Wort „ewig“ steht hier jedoch nicht ausdrücklich.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: Καί bedeutet häufig „und“, hat hier nach dem vorausgehenden Vorwurf jedoch eine kontrastierende Wirkung. „Doch“ gibt diesen Zusammenhang im Deutschen natürlich wieder, ohne den Gegensatz zu überzeichnen.
- source_word: οὐ θέλετε
  choice: ihr wollt nicht
  rationale: Θέλω bezeichnet Wollen oder Bereitsein. „Ihr wollt nicht“ gibt den gegenwärtigen, willensbezogenen Aussagegehalt direkt und in natürlichem Deutsch wieder; das stärkere „ihr weigert euch“ würde mehr ausdrücken als der griechische Wortlaut.
- source_word: ἐλθεῖν πρός με
  choice: zu mir kommen
  rationale: Der Infinitiv ἐλθεῖν mit πρός und Akkusativ bedeutet idiomatisch, zu jemandem zu kommen. Die konkrete johanneische Bildsprache bleibt erhalten und wird nicht deutend durch „an mich glauben“ ersetzt.
- source_word: ἵνα
  choice: damit
  rationale: Ἵνα leitet hier einen Zweck ein. „Damit“ ist die klare und natürliche deutsche Entsprechung.
- source_word: ζωὴν
  choice: Leben
  rationale: Ζωή bedeutet „Leben“. Im Johannesevangelium hat das Wort häufig die umfassendere Bedeutung des von Gott kommenden Lebens; da αἰώνιος („ewig“) hier nicht steht, wird diese Ergänzung nicht in den Haupttext aufgenommen.
- source_word: ἔχητε
  choice: ihr habt
  rationale: Der Präsens Konjunktiv nach ἵνα wird in der deutschen damit-Konstruktion regelgerecht mit dem Indikativ wiedergegeben. „Damit ihr Leben habt“ bewahrt den Zweckgedanken, ohne eine im Griechischen nicht gemeinte Unsicherheit einzutragen.
theological_decisions:
- issue: Ob ζωὴν im johanneischen Zusammenhang mit „Leben“ oder „ewiges Leben“ wiederzugeben ist
  choice: Leben
  alternative: ewiges Leben
  rationale: Johannes verwendet ζωή oft mit heilsgeschichtlicher Tiefe, doch in diesem Vers fehlt das ausdrückliche Adjektiv αἰώνιος. Der Haupttext bleibt daher beim lexikalisch gegebenen „Leben“; die weitergehende Bedeutung wird durch den Zusammenhang und eine Fußnote erschlossen.
- issue: Ob „zu mir kommen“ im Haupttext als Glauben an Jesus auszulegen ist
  choice: zu mir kommen
  alternative: an mich glauben / im Glauben zu mir kommen
  rationale: Das Kommen zu Jesus ist bei Johannes eng mit Glauben verbunden. Der Ausgangstext verwendet jedoch das konkrete Verb „kommen“. Seine Bildsprache und theologische Offenheit sollen nicht durch eine erklärende Paraphrase ersetzt werden.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt erhalten. „Ihr wollt nicht“ ist alltagssprachlich verständlich, ohne den schärferen Vorwurf einer ausdrücklichen Weigerung einzutragen.
