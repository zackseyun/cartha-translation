id: JHN.5.25
reference: John 5:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: de
  text: 'Amen, amen,[a] ich sage euch: Es kommt eine Stunde,[b] und sie ist jetzt da, in der die Toten[c] die Stimme des Sohnes Gottes hören werden; und die sie gehört haben,[d] werden leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: „Wirklich, wirklich“. Der griechische Text übernimmt zweimal das Wort „Amen“.'
    reason: lexical_alternative
  - marker: b
    text: „Stunde“ kann hier weiter gefasst einen bestimmten Zeitpunkt oder eine bestimmte Zeit bezeichnen; im Griechischen steht ausdrücklich „Stunde“.
    reason: lexical_alternative
  - marker: c
    text: „Die Toten“ kann wegen „und sie ist jetzt da“ hier eine gegenwärtige geistliche Bedeutung einschließen und zugleich auf die leibliche Auferstehung im folgenden Zusammenhang vorausweisen.
    reason: cross_reference
  - marker: d
    text: 'Auch möglich: „und die sie hören, werden leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Bewahrt die feierliche, nachdrückliche Wiederholung und den für Jesu Aussagen im Johannesevangelium charakteristischen hebräisch-aramäischen Ausdruck. Eine verständlichere Bedeutungswiedergabe wird in der Fußnote genannt.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Gibt die direkte Anrede knapp und formal entsprechend dem griechischen Wortlaut wieder.
- source_word: ἔρχεται ὥρα
  choice: Es kommt eine Stunde
  rationale: Bewahrt das artikellose ὥρα als „eine Stunde“ sowie das im Johannesevangelium bedeutsame Zeitwort, ohne es zum allgemeineren „Zeitpunkt“ zu glätten.
- source_word: καὶ νῦν ἐστιν
  choice: und sie ist jetzt da
  rationale: Natürliches modernes Deutsch, das die Spannung zwischen der kommenden Stunde und ihrer bereits gegenwärtigen Wirklichkeit erhält.
- source_word: οἱ νεκροὶ
  choice: die Toten
  rationale: Die substantivische Wiedergabe ist knapp und lässt offen, ob hier geistlich Tote, leiblich Tote oder bewusst beide Horizonte anklingen.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: die Stimme … hören werden
  rationale: „Stimme“ passt zum persönlichen Sprecher; „hören“ wahrt die Grundbedeutung, ohne die stärkere Vorstellung gehorsamen Zuhörens einzutragen.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: des Sohnes Gottes
  rationale: Entspricht unmittelbar dem griechischen christologischen Titel und ist im Deutschen klar und geläufig.
- source_word: οἱ ἀκούσαντες
  choice: die sie gehört haben
  rationale: Gibt das Aoristpartizip formal als vorzeitig wieder. Das Pronomen „sie“ nimmt natürlich die Stimme auf; eine im Zusammenhang ebenfalls mögliche präsentische Wiedergabe steht in der Fußnote.
- source_word: ζήσουσιν
  choice: werden leben
  rationale: Entspricht ζάω, ohne durch „werden lebendig“ die Aussage ausschließlich auf körperliche Auferstehung festzulegen.
theological_decisions:
- issue: Bedeutung von „die Toten“ im Zusammenhang
  choice: Die offene Bezeichnung „die Toten“ bleibt im Haupttext stehen.
  alternative: „die geistlich Toten“ oder „die körperlich Verstorbenen“
  rationale: „Und sie ist jetzt da“ weist auf eine gegenwärtige Dimension, während der folgende Zusammenhang die künftige leibliche Auferstehung behandelt. Die Übersetzung darf diese Spannung nicht einseitig auflösen.
- issue: Christologischer Titel τοῦ υἱοῦ τοῦ θεοῦ
  choice: „des Sohnes Gottes“
  alternative: „von Gottes Sohn“
  rationale: Die gewählte Form wahrt den vollständigen Titel und seine sachliche Hervorhebung, ohne zusätzliche dogmatische Erläuterungen in den Vers einzutragen.
- issue: Verhältnis von Hören und Leben
  choice: Das Aoristpartizip wird mit „die sie gehört haben“ wiedergegeben.
  alternative: „die sie hören“
  rationale: Die gewählte Fassung erhält die im Griechischen markierte Vorzeitigkeit, ohne zu behaupten, das Hören sei bloß ein vergangenes Ereignis. Die präsentische Deutung bleibt als sprachlich mögliche Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem johanneischem Satzrhythmus. „Amen, amen“ und „eine Stunde“ halten wichtige Formulierungen des Ausgangstextes sichtbar; „sie ist jetzt da“ vermeidet zugleich unnatürliche Übersetzungsrede. Die Semikolonsetzung verdeutlicht den Ergebniszusammenhang, ohne ihn stärker auszudeuten.
