id: JHN.5.10
reference: John 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: de
  text: 'Daraufhin sagten die Juden[a] zu dem Mann, der geheilt worden war: „Es ist Sabbat, und es ist dir nicht erlaubt, deine Matte[c] zu tragen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Je nachdem, wie Johannes die Bezeichnung hier gebraucht, sind möglicherweise „jüdische Führungspersonen“ oder „die Judäer“ gemeint.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aufzuheben“ beziehungsweise „aufzunehmen“.'
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete Wort bezeichnet eine tragbare Schlafmatte oder ein einfaches Lager, nicht unbedingt ein vollständiges Bett.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt beschreibt die Äußerung im fortlaufenden Erzählgeschehen. Im natürlichen Deutschen gibt das Präteritum „sagten“ dies angemessen wieder, ohne eine im Kontext nicht zwingend geforderte Wiederholung zu behaupten.
- source_word: οὖν
  choice: Daraufhin
  rationale: Der Ausdruck verbindet die Reaktion der Sprecher mit dem unmittelbar zuvor berichteten Geschehen und klingt im modernen erzählenden Deutsch natürlich.
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Dies entspricht der nicht näher eingegrenzten griechischen Formulierung. Da der Vers selbst weder ausdrücklich führende Männer noch Judäer als regionale Gruppe nennt, wird die mögliche engere Bedeutung nicht in den Haupttext eingetragen.
- source_word: τῷ τεθεραπευμένῳ
  choice: zu dem Mann, der geheilt worden war
  rationale: Das Perfektpassiv bezeichnet eine vollzogene Heilung mit fortbestehendem Ergebnis. „Mann“ ist durch den Kontext ausgewiesen und macht die Formulierung im Deutschen idiomatisch.
- source_word: Σάββατόν ἐστιν
  choice: Es ist Sabbat
  rationale: Dies ist eine natürliche deutsche Zeitangabe und gibt die Aussage ohne unnötige Ergänzung wieder.
- source_word: οὐκ ἔξεστίν σοι
  choice: es ist dir nicht erlaubt
  rationale: Die Formulierung bewahrt den Sinn des rechtlich-religiös Zulässigen, klingt dabei im heutigen Deutsch natürlicher als „es ist dir nicht gesetzlich gestattet“.
- source_word: ἆραι
  choice: zu tragen
  rationale: αἴρω kann „aufheben“, „aufnehmen“ oder „tragen“ bedeuten. Im Zusammenhang richtet sich der Einwand gegen das Befördern der Schlafunterlage am Sabbat; „tragen“ gibt diese praktische Bedeutung treffend wieder.
- source_word: κράβαττον
  choice: Matte
  rationale: Gemeint ist eine tragbare Schlafunterlage beziehungsweise ein einfaches Lager, nicht notwendigerweise ein Bett mit Gestell. „Matte“ ist verständlich und passt dazu, dass der Gegenstand getragen wird.
theological_decisions:
- issue: Bezug von οἱ Ἰουδαῖοι im Johannesevangelium
  choice: die Juden
  alternative: die jüdischen führenden Männer; die Judäer
  rationale: Der Haupttext bewahrt die allgemeine griechische Bezeichnung, weil der unmittelbare Vers die Sprecher nicht ausdrücklich enger bestimmt. Die Fußnote hält die kontextuell diskutierten Möglichkeiten offen und vermeidet sowohl eine unbegründete Eingrenzung als auch das Verschweigen der johanneischen Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text, vermeidet jedoch unnatürliche Wortstellung. Die rechtlich-religiöse Färbung von οὐκ ἔξεστιν sowie die mögliche Mehrdeutigkeit von οἱ Ἰουδαῖοι und αἴρω bleiben erhalten.
