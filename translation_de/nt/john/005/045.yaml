source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: de
  text: 'Denkt nicht, dass ich euch vor dem Vater anklagen werde.[a] Es gibt einen, der euch anklagt: Mose,[b] auf den ihr eure Hoffnung gesetzt habt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meint nicht, dass ich vor dem Vater Anklage gegen euch erheben werde.“'
    reason: lexical_alternative
  - marker: b
    text: Mose selbst wird als derjenige vorgestellt, der sie anklagt, obwohl sie ihre Hoffnung auf ihn gesetzt haben.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Denkt nicht
  rationale: Die Verneinung mit dem Präsensimperativ ergibt eine direkte Warnung. „Denkt nicht“ ist natürlich, klar und bewahrt die unmittelbare Anrede.
- source_word: κατηγορήσω
  choice: ich werde … anklagen
  rationale: κατηγορέω bezeichnet das Anklagen beziehungsweise Erheben einer Beschuldigung. „Anklagen“ wahrt den forensischen Sinn, ohne ihn zu „verurteilen“ zu verstärken.
- source_word: πρὸς τὸν πατέρα
  choice: beim Vater
  rationale: In Verbindung mit dem Verb des Anklagens bezeichnet πρός die Ausrichtung der Anklage auf den Vater beziehungsweise das Auftreten vor ihm. „Beim Vater anklagen“ ist im Deutschen idiomatisch und bewahrt die gerichtliche Vorstellung.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Es gibt einen, der euch anklagt
  rationale: Die Formulierung führt im Gegensatz zu Jesus einen anderen Ankläger ein. Das Präsens „anklagt“ gibt die fortdauernde beziehungsweise gegenwärtige Aussage des Partizips wieder.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
- source_word: εἰς ὃν
  choice: auf den
  rationale: ἐλπίζω mit εἰς bezeichnet das Setzen der Hoffnung auf jemanden. Die deutsche Verbindung „Hoffnung auf jemanden setzen“ gibt dies unmittelbar wieder.
- source_word: ἠλπίκατε
  choice: ihr eure Hoffnung gesetzt habt
  rationale: Das Perfekt beschreibt eine vollzogene, weiterhin wirksame Haltung. Die Wendung bringt sowohl das Setzen als auch den fortbestehenden Bezug der Hoffnung zum Ausdruck.
theological_decisions:
- issue: Forensische Bedeutung der Aussage Jesu
  choice: „anklagen“ statt „verurteilen“
  alternative: „verurteilen“
  rationale: κατηγορέω bezeichnet die Anklage, nicht das abschließende Urteil. So bleibt die gerichtliche Bildwelt erhalten, ohne eine stärkere Aussage in den Text einzutragen.
- issue: Bezug der auf Mose gesetzten Hoffnung
  choice: Mose selbst wird als Bezug der Hoffnung genannt.
  alternative: „auf das Gesetz des Mose“ oder „auf die Schriften des Mose“
  rationale: Der griechische Text nennt ausdrücklich Mose. Obwohl der Zusammenhang seine Schriften einbezieht, soll diese Deutung nicht in den Haupttext eingefügt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Warnung und die forensische Bildsprache bleiben erhalten; „Mose“ und „der Vater“ folgen dem etablierten biblischen Sprachgebrauch.
