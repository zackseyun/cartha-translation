  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: de
  text: da es bei Gott gerecht ist, denen, die euch bedrängen, Bedrängnis zu vergelten[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn es denn bei Gott gerecht ist, denen, die euch bedrängen, Bedrängnis zu vergelten“.'
    reason: εἴπερ kann formal bedingt mit „wenn es denn“ wiedergegeben werden; im Zusammenhang wird die Voraussetzung jedoch offenbar als wahr angenommen.
lexical_decisions:
- source_word: εἴπερ
  choice: da
  rationale: εἴπερ führt hier eine als wahr vorausgesetzte Begründung ein. „Da“ gibt diese rhetorisch vorausgesetzte Wirklichkeit im Deutschen natürlich wieder; die formal mögliche Bedingung bleibt in der Fußnote sichtbar.
- source_word: δίκαιον
  choice: gerecht
  rationale: Das Adjektiv bezeichnet hier das moralisch und richterlich Rechte an Gottes Vergeltung. „Gerecht“ ist im Deutschen idiomatisch und bewahrt den Bezug zu Gottes Gerechtigkeit.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: Die Wendung bezeichnet, was bei Gott beziehungsweise nach seinem Urteil als gerecht gilt. „Bei Gott“ bildet die griechische Form knapp ab, ohne eine zusätzliche Auslegung einzutragen.
- source_word: ἀνταποδοῦναι
  choice: zu vergelten
  rationale: Das Verb bezeichnet eine entsprechende Erwiderung oder Rückzahlung. „Vergelten“ passt zum gerichtlichen Zusammenhang und ist würdig, ohne unnötig altertümlich zu wirken.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: denen, die euch bedrängen
  rationale: Das Partizip bezeichnet Menschen, die Druck, Not oder Verfolgung verursachen. „Bedrängen“ ist natürlich und wahrt zusammen mit „Bedrängnis“ die Wortverbindung zum folgenden θλῖψιν.
- source_word: θλῖψιν
  choice: Bedrängnis
  rationale: „Bedrängnis“ bezeichnet schwere Not und bewahrt die hörbare Verbindung mit „bedrängen“. „Trübsal“ wäre traditioneller, aber im heutigen Deutsch weniger unmittelbar.
theological_decisions:
- issue: Art und Zeitpunkt der göttlichen Vergeltung
  choice: Der Satz erklärt es für gerecht, dass Gott den Bedrängern mit Bedrängnis vergilt, ohne in diesem Teilsatz Zeitpunkt und konkrete Form festzulegen.
  alternative: Die Bedrängnis ausschließlich auf das Endgericht zu beziehen oder zusätzlich gegenwärtige geschichtliche Gerichte ausdrücklich einzuschließen.
  rationale: Der griechische Wortlaut bekräftigt die Gerechtigkeit der Vergeltung, bestimmt in diesem Teilsatz aber nicht abschließend deren Zeitpunkt oder Vollzugsweise. Die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortverbindung θλίβουσιν/θλῖψιν wird durch „bedrängen/Bedrängnis“ bewahrt. Der Vers ist syntaktisch Teil des übergreifenden Satzes, daher beginnt die Wiedergabe mit „da“ und endet ohne eigenen Schlusspunkt.
