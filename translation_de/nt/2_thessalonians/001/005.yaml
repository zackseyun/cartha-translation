review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft ἔνδειγμα, δικαίας κρίσεως, die passive Bedeutung von καταξιωθῆναι und den Gegenwartsaspekt von πάσχετε im Wesentlichen. „Durch das“ gibt εἰς τὸ jedoch nicht angemessen wieder: Es macht das gerechte Gericht zum instrumentalen Mittel, während die griechische Konstruktion hier eine Ziel- oder Ergebnisbeziehung ausdrückt.'
  naturalness: „Des Reiches Gottes für würdig erachtet werdet“ ist in einem würdevollen modernen Bibelregister verständlich und idiomatisch. Die Ersetzung von „durch das … sollt“ durch „sodass ihr … werdet“ beseitigt die sachlich und syntaktisch missverständliche Verknüpfung.
  terminology: „Zeichen“, „gerechtes Gericht Gottes“, „Reich Gottes“ und „für würdig erachtet“ sind treffend. „Reich Gottes“ sollte gegenüber dem vorangehenden ausdrücklichen Gottesbezug nicht durch „seines Reiches“ ersetzt werden, damit der wiederholte griechische Ausdruck βασιλεία τοῦ θεοῦ sichtbar bleibt. „Für das ihr leidet“ kann sich im Deutschen unklar auf das Gericht beziehen; „um dessentwillen“ stellt den Bezug auf das Reich eindeutig her.
  issues:
  - severity: high
    issue: „durch das ihr … für würdig erachtet werden sollt“ verfehlt die Funktion von εἰς τὸ καταξιωθῆναι.
    rationale: εἰς τὸ mit Infinitiv bezeichnet hier Ziel oder Ergebnis, nicht das Mittel „durch“ das gerechte Gericht. Zudem fügt „sollt“ eine modale Nuance hinzu, die der passive Aoristinfinitiv nicht ausdrückt.
  - severity: medium
    issue: „für das ihr auch leidet“ hat einen mehrdeutigen Bezug.
    rationale: Das Relativpronomen ἧς bezieht sich grammatisch auf „Reich Gottes“. Nach „Gericht Gottes“ kann das deutsche „das“ jedoch auch auf das Gericht bezogen werden. „Um dessentwillen“ klärt den Bezug ohne Bedeutungszuwachs.
  revised_text: Das ist ein Zeichen für Gottes gerechtes Gericht, sodass ihr des Reiches Gottes für würdig erachtet werdet,[a] um dessentwillen ihr auch leidet.[b]
