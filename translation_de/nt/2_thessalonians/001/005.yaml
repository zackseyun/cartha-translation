  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: de
  text: Das ist ein Zeichen für Gottes gerechtes Gericht, sodass ihr des Reiches Gottes für würdig erachtet werdet,[a] um dessentwillen ihr auch leidet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ihr des Reiches Gottes für würdig erachtet werdet“. Die griechische Wendung kann ein Ziel oder ein Ergebnis bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „für dessen Sache“ oder „für das“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: Zeichen
  rationale: Das Substantiv bezeichnet etwas, das auf eine Wirklichkeit hinweist und sie erkennbar macht. „Zeichen“ ist natürlich und bewahrt diese Hinweisfunktion, ohne die Aussage durch „Beweis“ unnötig zu verstärken.
- source_word: δικαίας κρίσεως τοῦ θεοῦ
  choice: für das gerechte Gericht Gottes
  rationale: Die Genitivverbindung wird direkt wiedergegeben. „Gerecht“ bezeichnet die moralische Beschaffenheit von Gottes Gericht.
- source_word: εἰς τὸ καταξιωθῆναι ὑμᾶς
  choice: durch das ihr … für würdig erachtet werden sollt
  rationale: Die passive Form bedeutet, dass die Adressaten als würdig beurteilt beziehungsweise anerkannt werden, nicht dass sie von sich aus würdig gemacht werden. Die Formulierung lässt den Zusammenhang von Ziel und Ergebnis anklingen.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: seines Reiches
  rationale: Das Possessivpronomen gibt den Genitiv natürlich wieder; der unmittelbare Bezug auf Gott bleibt eindeutig.
- source_word: ὑπὲρ ἧς
  choice: für das
  rationale: ὑπέρ mit Genitiv verbindet ihr Leiden mit Gottes Reich im Sinn von „dafür“ beziehungsweise „um dessentwillen“.
- source_word: καὶ πάσχετε
  choice: ihr auch leidet
  rationale: Das Präsens beschreibt das gegenwärtige, fortdauernde Leiden; καί wird mit „auch“ bewahrt.
theological_decisions:
- issue: Verhältnis des Leidens zur Würdigkeit für Gottes Reich
  choice: Ihr Leiden steht als Zeichen im Zusammenhang mit Gottes gerechtem Gericht, in dem sie seines Reiches für würdig erachtet werden.
  alternative: Ihr Leiden verdient oder erwirbt die Aufnahme in Gottes Reich.
  rationale: Das passive καταξιωθῆναι bezeichnet das Für-würdig-Erachten. Der Text verbindet Leiden, Gericht und Würdigkeit eng miteinander, sagt aber nicht ausdrücklich, dass das Leiden als verdienstvolle Leistung den Eintritt erkauft.
- issue: Ziel oder Ergebnis bei εἰς τὸ mit Infinitiv
  choice: Die Übersetzung deutet eine Zielrichtung an, ohne den Ergebnissinn auszuschließen.
  alternative: 'Rein konsekutiv: „sodass ihr … für würdig erachtet werdet“.'
  rationale: Die griechische Konstruktion kann je nach Kontext Zweck oder Ergebnis ausdrücken; diese Spannung soll nicht dogmatisch aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im griechischen Satzfragment fehlende verbale Anschluss wird mit „Das ist“ aus dem Zusammenhang ergänzt. Die Formulierung vermeidet sowohl archaische Schwere als auch eine vorschnelle Deutung des Leidens als verdienstliche Leistung.
