revisions:
- from: Das ist ein Zeichen für das gerechte Gericht Gottes,[a] durch das ihr seines Reiches für würdig erachtet werden sollt,[b] für das ihr auch leidet.[c]
  to: Das ist ein Zeichen für Gottes gerechtes Gericht, sodass ihr des Reiches Gottes für würdig erachtet werdet,[a] um dessentwillen ihr auch leidet.[b]
  rationale: Die Revision gibt die Ziel-/Ergebnisbeziehung von εἰς τὸ mit „sodass“ wieder und hält die mögliche Zwecklesart in der Fußnote offen. Sie bewahrt die passive Bedeutung von καταξιωθῆναι, wiederholt den Ausdruck „Reich Gottes“ und klärt den Bezug von ὑπὲρ ἧς. Die Fußnotenanker wurden an die revidierte Satzstruktur angepasst.
