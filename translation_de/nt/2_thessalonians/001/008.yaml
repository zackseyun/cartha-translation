  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: de
  text: in flammendem Feuer[a], indem er Vergeltung vollzieht an denen, die Gott nicht kennen, und an denen, die dem Evangelium unseres Herrn Jesus nicht gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Feuerflamme«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: in flammendem Feuer
  rationale: Die Wendung gibt das intensive Feuerbild natürlich und würdevoll wieder. Sie knüpft syntaktisch an die Offenbarung des Herrn im vorhergehenden Vers an.
- source_word: διδόντος ἐκδίκησιν
  choice: wobei er … Vergeltung übt
  rationale: Das wörtliche »Vergeltung geben« ist im Deutschen unnatürlich. »Vergeltung üben« gibt die feste griechische Verbindung idiomatisch wieder; »wobei« lässt das Verhältnis des Partizips zum vorausgehenden Geschehen offen genug.
- source_word: ἐκδίκησιν
  choice: Vergeltung
  rationale: »Vergeltung« bewahrt den ernsten gerichtlichen Sinn, ohne durch »Rache« vorrangig eine menschlich-emotionale Vorstellung aufzurufen oder den Ausdruck zu »Gerechtigkeit« abzuschwächen.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: denen, die Gott nicht kennen
  rationale: Die substantivierte Partizipialgruppe wird in natürlichem Deutsch wiedergegeben; οἶδα hat hier Gegenwartsbedeutung.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: denen, die … nicht gehorchen
  rationale: Die Wiedergabe bleibt nah am durativen Präsens und fügt keine im Verb nicht ausdrücklich enthaltene Aussage über bewusste Verweigerung hinzu.
- source_word: τῷ εὐαγγελίῳ
  choice: dem Evangelium
  rationale: »Evangelium« ist der geläufige und präzise paulinische Begriff und passt zum Dativobjekt von ὑπακούω.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: unseres Herrn Jesus
  rationale: Die deutsche Wortfolge bewahrt sowohl den Herrentitel als auch die genitivische Zuordnung des Evangeliums zu Jesus.
theological_decisions:
- issue: Charakter der ἐκδίκησις im göttlichen Gericht
  choice: Vergeltung
  alternative: Rache; Strafe; gerichtliche Ahndung
  rationale: Der Zusammenhang beschreibt den Vollzug göttlichen Gerichts. »Vergeltung« erhält die Härte und die gerichtliche Dimension des Ausgangstextes, ohne sie als bloß emotionale Rache zu deuten oder abzuschwächen.
- issue: Bezug des handelnden Partizips διδόντος
  choice: Das Pronomen »er« bezieht sich im Zusammenhang auf den Herrn Jesus.
  alternative: Unpersönliche oder ausschließlich auf Gott bezogene Wiedergabe
  rationale: Das maskuline Genitivpartizip setzt die vorausgehende Konstruktion fort und stimmt syntaktisch mit dem im vorherigen Vers genannten Herrn Jesus überein. Die Übersetzung macht den natürlichen Bezug lesbar, ohne darüber hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung von Vers 7 kleingeschrieben. Die Formulierung vermeidet sowohl altertümliches »Rache nehmen« als auch eine Abschwächung des Gerichtsbegriffs.
