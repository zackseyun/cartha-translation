source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: de
  text: und euch, die ihr bedrängt werdet, zusammen mit uns Erleichterung zu gewähren bei der Offenbarung des Herrn Jesus vom Himmel her mit den Engeln seiner Macht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »mit seinen mächtigen Engeln«.'
    reason: Die Genitivverbindung kann qualitativ verstanden und entsprechend idiomatisch wiedergegeben werden.
lexical_decisions:
- source_word: θλιβομένοις
  choice: die ihr bedrängt werdet
  rationale: Das präsentische Passivpartizip bezeichnet Menschen, die gegenwärtig unter Druck, Bedrängnis oder Verfolgung stehen. »Bedrängt werdet« bewahrt den passiven Sinn und den Zusammenhang mit der Bedrängnis im Kontext.
- source_word: ἄνεσιν
  choice: Erleichterung
  rationale: ἄνεσις bezeichnet das Nachlassen von Druck beziehungsweise Befreiung und Ruhe. »Erleichterung« bildet den Gegensatz zur gegenwärtigen Bedrängnis klar ab, ohne nur innere Ruhe anzudeuten.
- source_word: μεθ’ ἡμῶν
  choice: zusammen mit uns
  rationale: Die mit μετά ausgedrückte Gemeinschaft wird idiomatisch wiedergegeben und schließt Paulus und seine Mitarbeiter in dieselbe verheißene Erleichterung ein.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: bei der Offenbarung
  rationale: ἐν hat bei diesem Ereignisbegriff zeitlichen Sinn. Die Wiedergabe erhält zugleich die substantivische Form und die eschatologische Bedeutung von ἀποκάλυψις.
- source_word: ἀπ’ οὐρανοῦ
  choice: vom Himmel her
  rationale: ἀπό bezeichnet Herkunft oder Ausgangspunkt. »Vom Himmel her« ist im Deutschen natürlich und wahrt diese räumliche Aussage.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: mit den Engeln seiner Macht
  rationale: Die genitivische Struktur wird bewusst sichtbar gehalten. Sie kann Engel bezeichnen, die zu seiner Macht gehören beziehungsweise sie begleiten; die qualitative Deutung »seine mächtigen Engel« bleibt als Alternative erhalten.
theological_decisions:
- issue: Deutung der Genitivverbindung ἀγγέλων δυνάμεως αὐτοῦ
  choice: mit den Engeln seiner Macht
  alternative: mit seinen mächtigen Engeln
  rationale: Die gedrängte griechische Verbindung lässt sowohl eine formnahe Zuordnung der Engel zu Christi Macht als auch eine qualitative Beschreibung der Engel zu. Der Haupttext bewahrt die Spannung; die idiomatische Deutung steht in der Fußnote.
- issue: Zeitlicher Sinn von ἐν τῇ ἀποκαλύψει
  choice: bei der Offenbarung
  alternative: wenn der Herr Jesus offenbart wird
  rationale: Die verheißene Erleichterung wird zeitlich mit der eschatologischen Offenbarung Jesu verbunden. Die nominale Wiedergabe bleibt nahe an der Form des Ausgangstextes.
- issue: Ergänzung des im Vers nicht wiederholten Verbs
  choice: zu schenken
  alternative: Satzfragment ohne ergänztes Verb
  rationale: Vers 7 setzt den Satz und die Vergeltungsaussage aus Vers 6 fort. Die Ergänzung macht den deutschen Vers verständlich, ohne eine neue inhaltliche Aussage einzuführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzfügung berücksichtigt, dass Vers 7 den begonnenen Satz aus Vers 6 fortsetzt. »Erleichterung« ist alltagssprachlich verständlich, bleibt aber dem Gegensatz von Bedrängnis und nachlassendem Druck eng verbunden.
