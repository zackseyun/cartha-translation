  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: de
  text: Sie werden als Strafe ewiges Verderben erleiden[a], fern vom Angesicht des Herrn und von der Herrlichkeit seiner Macht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Sie werden als Strafe ewiges Verderben erleiden, das von der Gegenwart des Herrn und von der Herrlichkeit seiner Macht ausgeht.“ Die griechische Präposition kann entweder Trennung („fern von“) oder Herkunft („von … ausgehend“) bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Sie
  rationale: Das Relativpronomen greift die zuvor genannten Gegner auf. Im Deutschen setzt „Sie“ den neuen Satz natürlich fort, ohne die mögliche qualitative Nuance unnötig auszubauen.
- source_word: δίκην τίσουσιν
  choice: werden als Strafe … erleiden
  rationale: Die feste Verbindung bezeichnet das Erleiden einer gerichtlich verhängten Strafe. Diese Wiedergabe bewahrt den Rechtscharakter und klingt in modernem Deutsch natürlich.
- source_word: ὄλεθρον
  choice: Verderben
  rationale: „Verderben“ gibt die Schwere von ὄλεθρος im Gerichtskontext wieder, ohne die genaue Art der endgültigen Strafe dogmatisch festzulegen.
- source_word: αἰώνιον
  choice: ewiges
  rationale: Im endzeitlichen Gerichtskontext ist „ewig“ die naheliegende Wiedergabe und bringt die bleibende Endgültigkeit zum Ausdruck.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: fern vom Angesicht des Herrn
  rationale: ἀπό wird im Haupttext als Trennung beziehungsweise Ausschluss verstanden. „Angesicht“ bewahrt das Bild von πρόσωπον und ist in würdigem biblischem Deutsch verständlich.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: und von der Herrlichkeit seiner Macht
  rationale: „Herrlichkeit“ entspricht δόξα, „Macht“ gibt ἰσχύς hier natürlich wieder. Der Genitiv bezeichnet die Herrlichkeit, die seiner Macht eigen ist oder sie sichtbar macht.
theological_decisions:
- issue: Bedeutung von ἀπό im Zusammenhang mit dem endgültigen Gericht
  choice: 'Trennung beziehungsweise Ausschluss: „fern vom Angesicht des Herrn“'
  alternative: 'Ursprung beziehungsweise Ausgangspunkt: Verderben, das vom Angesicht des Herrn und von der Herrlichkeit seiner Macht ausgeht'
  rationale: ἀπό kann sowohl Trennung als auch Herkunft bezeichnen. Der Haupttext folgt der kontextuell starken Lesart des Ausschlusses; die grammatisch mögliche Ursprungslesart bleibt in der Fußnote erhalten.
- issue: Bedeutungsumfang von „ewiges Verderben“
  choice: Die griechische Formulierung wird wiedergegeben, ohne die Art des endgültigen Verderbens näher zu bestimmen.
  alternative: Auslegung als Vernichtung oder als ewige bewusste Strafe
  rationale: Der Ausdruck benennt die Strafe, entscheidet für sich allein aber nicht die weitergehende dogmatische Debatte. Die Übersetzung vermeidet daher konfessionelle Präzisierungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verderben“ und „Angesicht“ bewahren den ernsten, bildhaften Ton, bleiben aber allgemein verständlich. Die Satzstellung hält den Bezug der beiden mit ἀπό eingeleiteten Wendungen zusammen.
