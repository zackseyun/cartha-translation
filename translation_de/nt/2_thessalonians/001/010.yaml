source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: de
  text: an jenem Tag, wenn er kommt, um unter seinen Heiligen verherrlicht und von allen, die geglaubt haben, bewundert zu werden[a], denn unser Zeugnis bei euch hat Glauben gefunden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinen Heiligen verherrlicht und in allen, die geglaubt haben, bewundert zu werden“. Die griechische Präposition kann sowohl „unter“ als auch „in“ bedeuten; seine Herrlichkeit kann also unter seinem heiligen Volk sichtbar werden oder sich in ihm zeigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Nach der griechischen Wortfolge kann „an jenem Tag“ auch am Ende stehen: „wenn er kommt, um unter seinen Heiligen verherrlicht und von allen, die geglaubt haben, bewundert zu werden – denn unser Zeugnis bei euch hat Glauben gefunden – an jenem Tag.“'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: wenn er kommt
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier ein bestimmtes zukünftiges Ereignis. „Wenn er kommt“ ist natürliches modernes Deutsch.
- source_word: ἐνδοξασθῆναι
  choice: verherrlicht zu werden
  rationale: Der passive Infinitiv bewahrt sowohl den Zweck-/Folgesinn als auch den Bezug auf die offenbar werdende Herrlichkeit.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: unter seinen Heiligen
  rationale: ἐν kann hier „unter“ oder „in“ bedeuten. „Unter“ gibt den gemeinschaftlichen Rahmen idiomatisch wieder; die mögliche Bedeutung „in“ wird in einer Fußnote erhalten.
- source_word: θαυμασθῆναι
  choice: staunend bewundert zu werden
  rationale: Die Form bezeichnet ehrfürchtiges Staunen und Bewunderung. Die Verbindung gibt diese stärkere Bedeutung natürlicher wieder als „bestaunt“ allein.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: von allen, die zum Glauben gekommen sind
  rationale: Beim Passiv θαυμασθῆναι wird ἐν idiomatisch als Bezeichnung der staunenden Personengruppe wiedergegeben. Die Formulierung bewahrt den verbalen Charakter des Partizips und dessen vorausgehenden Glaubensakt.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet, weshalb die Adressaten zu den Glaubenden gehören. „Denn“ wahrt den kausalen Zusammenhang ohne schwerfällige Unterordnung.
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν
  choice: unser Zeugnis hat Glauben gefunden
  rationale: 'Die idiomatische deutsche Wendung bewahrt den passiven Sinn: Das apostolische Zeugnis wurde geglaubt.'
- source_word: ἐφ’ ὑμᾶς
  choice: an euch
  rationale: Die Präposition bezeichnet hier wahrscheinlich die Ausrichtung des Zeugnisses auf die Thessalonicher. „An euch“ ist dafür knapp und natürlich.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Die geläufige deutsche Zeitangabe bewahrt den feierlichen eschatologischen Bezug.
theological_decisions:
- issue: Bedeutung von ἐν τοῖς ἁγίοις αὐτοῦ
  choice: „unter seinen Heiligen“ als gemeinschaftlicher Rahmen
  alternative: „in seinen Heiligen“, sodass seine Herrlichkeit in ihnen sichtbar wird
  rationale: Der Parallelismus mit allen Glaubenden spricht für Gottes beziehungsweise Christi heiliges Volk. Da ἐν sowohl den Rahmen als auch die Sphäre der Verherrlichung bezeichnen kann, wird die zweite Möglichkeit in der Fußnote offengehalten.
- issue: Referenz und Funktion der Glaubenssprache
  choice: Die Glaubenden sind diejenigen, die das apostolische Zeugnis angenommen haben.
  alternative: Ein stärker auf persönliches Vertrauen zugespitztes „die vertraut haben“
  rationale: Die wiederholte πιστεύω-Wortgruppe verbindet die Glaubenden unmittelbar mit dem geglaubten Zeugnis. Eine zusätzliche konfessionelle oder systematische Deutung wird vermieden.
- issue: Stellung von ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: „an jenem Tag“ steht zu Beginn des Verses.
  alternative: Die Zeitangabe steht entsprechend der griechischen Wortfolge am Versende.
  rationale: Die Voranstellung ist im Deutschen klarer und bezieht die Zeitangabe auf das gesamte Kommen und Verherrlichtwerden, ohne die Aussage inhaltlich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heilige“ erhält den paulinischen Ausdruck, während „staunend bewundert“ die starke Bedeutung von θαυμάζω verständlich wiedergibt. Die Satzstellung wurde für natürliches Deutsch geordnet; echte lexikalische und syntaktische Mehrdeutigkeiten sind in den Fußnoten dokumentiert.
