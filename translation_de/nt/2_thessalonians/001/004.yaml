source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: de
  text: sodass wir selbst uns unter den Gemeinden Gottes euer rühmen wegen eurer Standhaftigkeit und eures Glaubens[a] in allen euren Verfolgungen und Bedrängnissen, die ihr ertragt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eurer Treue«; das griechische Wort kann sowohl den Glauben als auch standhafte Treue bezeichnen, besonders im Zusammenhang mit Leiden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet die Folge des zuvor Gesagten ein und stellt den Zusammenhang im Deutschen knapp und natürlich her.
- source_word: αὐτοὺς ἡμᾶς
  choice: wir selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung von Paulus und seinen Mitarbeitern.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: uns euer rühmen
  rationale: Die idiomatische deutsche Wendung gibt das starke Verb des Rühmens wieder und lässt die Thessalonicher als Gegenstand beziehungsweise Anlass erkennen.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: unter den Gemeinden Gottes
  rationale: Bezeichnet den gemeinschaftlichen Bereich, in dem dieses Rühmen geschieht; „Gemeinden“ ist für lokale christliche Versammlungen natürlich.
- source_word: ὑπὲρ
  choice: wegen
  rationale: Kennzeichnet hier den Grund für das Rühmen.
- source_word: ὑπομονῆς
  choice: Standhaftigkeit
  rationale: Drückt ausdauerndes Festhalten unter Druck aus und passt zum Kontext fortdauernder Verfolgung.
- source_word: πίστεως
  choice: Glaubens
  rationale: „Glaube“ ist die naheliegende Hauptwiedergabe; die im Leid ebenfalls plausible Bedeutung „Treue“ wird in der Fußnote bewahrt.
- source_word: διωγμοῖς
  choice: Verfolgungen
  rationale: Bezeichnet gezielte feindselige Bedrängung und wird im Deutschen klar und etabliert wiedergegeben.
- source_word: θλίψεσιν
  choice: Bedrängnissen
  rationale: Bewahrt die Bedeutung von Druck, Not und belastenden Umständen und unterscheidet sie von gezielter Verfolgung.
- source_word: αἷς ἀνέχεσθε
  choice: die ihr ertragt
  rationale: Gibt das fortdauernde Aushalten der gegenwärtigen Leiden natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von πίστις im Zusammenhang des Leidens
  choice: Glaube
  alternative: Treue; Glaubenstreue
  rationale: Der Ausdruck kann sowohl das vertrauende Glauben als auch standhafte Treue bezeichnen. Der Haupttext verwendet „Glaube“, während die Fußnote die echte kontextuelle Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „uns euer rühmen“ bewahrt die rhetorische Stärke und die Satzstruktur des griechischen Textes, ohne konfessionelle Deutungen einzutragen.
