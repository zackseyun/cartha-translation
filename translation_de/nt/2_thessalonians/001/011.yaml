id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: de
  text: Darum beten wir auch immer für euch, dass unser Gott euch der Berufung für würdig erachte[a] und jeden Entschluss zum Guten[b] und jedes Werk des Glaubens[c] mit Kraft vollende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch der Berufung würdig mache“. Das griechische Verb kann sowohl „für würdig halten“ als auch „würdig machen“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „jede Absicht der Güte“ oder „jeden Entschluss zur Güte“.'
    reason: lexical_alternative
  - marker: c
    text: „Werk des Glaubens“ kann auch als „vom Glauben hervorgebrachtes Werk“ verstanden werden; „Glaube“ kann in diesem Zusammenhang auch „Treue“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Darum
  rationale: Die resumptive Wendung verweist auf das zuvor Gesagte und bezeichnet zugleich den Zweck beziehungsweise die Folgerung; „Darum“ ist im Deutschen knapp und natürlich.
- source_word: καὶ
  choice: auch
  rationale: Bewahrt den additiven Akzent der Aussage, ohne ihn zu überzeichnen.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: beten wir auch immer für euch
  rationale: Gibt die anhaltende beziehungsweise regelmäßige Gebetspraxis idiomatisch wieder.
- source_word: ἵνα
  choice: dass
  rationale: Leitet im Deutschen natürlich den Inhalt und zugleich die Zielrichtung des Gebets ein.
- source_word: ἀξιώσῃ
  choice: für würdig erachte
  rationale: Bewahrt primär den möglichen evaluativen Sinn „für würdig halten/erachten“; der ebenfalls mögliche faktitive Sinn wird in einer Fußnote genannt.
- source_word: τῆς κλήσεως
  choice: der Berufung
  rationale: Folgt dem bestimmten Artikel des Griechischen und fügt kein im Ausgangstext nicht ausdrücklich vorhandenes Possessivpronomen hinzu.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Übernimmt das ausdrückliche Possessivpronomen.
- source_word: πληρώσῃ
  choice: vollende
  rationale: Bezeichnet das vollständige Verwirklichen beziehungsweise Zuendeführen und lässt sich im Deutschen sinnvoll auf beide koordinierten Objekte beziehen.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: jeden Entschluss zum Guten
  rationale: εὐδοκία kann Wohlgefallen, Absicht oder Entschluss bezeichnen; mit ἀγαθωσύνης liegt hier eine auf das Gute gerichtete Absicht nahe. Die Wiedergabe bleibt verständlich, ohne bloßes Gefühl zu suggerieren.
- source_word: ἔργον πίστεως
  choice: jedes Werk des Glaubens
  rationale: Bewahrt die knappe Genitivverbindung und lässt offen, ob das Werk aus Glauben hervorgeht oder durch Glauben geprägt ist.
- source_word: ἐν δυνάμει
  choice: kraftvoll
  rationale: 'Gibt die modale Wendung natürlich wieder: Gott vollendet die genannten Vorhaben und Werke mit wirksamer Kraft.'
theological_decisions:
- issue: Bedeutung von ἀξιώσῃ im Verhältnis zur Berufung
  choice: für würdig erachte
  alternative: würdig mache
  rationale: Das Verb kann sowohl ein Würdig-Erachten als auch ein Würdig-Machen ausdrücken. Der Haupttext wählt die evaluative Bedeutung, während die Fußnote die faktitive Möglichkeit erhält und die theologische Spannung nicht auflöst.
- issue: Genitiv in ἔργον πίστεως
  choice: Werk des Glaubens
  alternative: vom Glauben hervorgebrachtes Werk; Werk der Treue
  rationale: Die formnahe Wendung lässt die Beziehung zwischen Werk und Glaube bewusst offen. Die Fußnote macht die möglichen Bedeutungsnuancen zugänglich, ohne eine davon dogmatisch festzulegen.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue
  rationale: „Glaube“ ist hier die naheliegende und etablierte Wiedergabe; „Treue“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Für würdig erachte“ ist bewusst leicht gehoben, aber verständlich und präzise. Die Stellung von „kraftvoll“ am Satzende verbindet ἐν δυνάμει natürlich mit „vollende“ und damit mit beiden koordinierten Objekten.
