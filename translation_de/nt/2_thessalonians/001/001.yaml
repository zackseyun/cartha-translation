source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: de
  text: 'Paulus, Silvanus und Timotheus an die Gemeinde der Thessalonicher in Gott, unserem Vater, und dem Herrn Jesus, dem Messias[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „dem Herrn Jesus Christus“. Das griechische Χριστός bedeutet „Messias“ und kann auch mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen übliche Form des griechischen Personennamens.
- source_word: Σιλουανὸς
  choice: Silvanus
  rationale: Gibt die im griechischen Text stehende Namensform direkt wieder, ohne sie an die Kurzform „Silas“ in der Apostelgeschichte anzugleichen.
- source_word: Τιμόθεος
  choice: Timotheus
  rationale: Die im Deutschen übliche Form des griechischen Personennamens.
- source_word: ἐκκλησίᾳ
  choice: Gemeinde
  rationale: Bezeichnet im paulinischen Briefgebrauch die christliche Gemeinschaft und ist im modernen Deutsch natürlicher als „Kirche“, wenn eine örtliche Gemeinschaft angesprochen wird.
- source_word: Θεσσαλονικέων
  choice: der Thessalonicher
  rationale: Bewahrt den Personenbezug des griechischen Genitivs, statt ihn in die Ortsangabe „in Thessalonich“ umzudeuten.
- source_word: ἐν
  choice: die in … ist
  rationale: Die Ergänzung des im Griechischen ausgelassenen Verbs ergibt einen natürlichen deutschen Relativsatz und bewahrt „in“ als Ausdruck der nicht näher aufgelösten Beziehung der Gemeinde zu Gott und Jesus.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Gott, unserem Vater
  rationale: Bewahrt das ausdrückliche „unserem“ und kennzeichnet „unserem Vater“ durch die Apposition als nähere Bestimmung Gottes.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ ist die angemessene deutsche Wiedergabe des Titels κύριος für Jesus.
- source_word: Χριστῷ
  choice: Messias
  rationale: Übersetzt Χριστός als Titel, statt es lediglich in der traditionellen Form „Christus“ zu übernehmen.
theological_decisions:
- issue: Wiedergabe von Χριστῷ in Ἰησοῦ Χριστῷ
  choice: Jesus, dem Messias
  alternative: Jesus Christus
  rationale: „Messias“ macht den Titelgehalt von Χριστός sichtbar. Die appositionale Form mit Artikel ist im Deutschen idiomatisch; die traditionelle Wiedergabe „Christus“ bleibt als Alternative in der Fußnote erhalten.
- issue: Beziehung in ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: die in Gott, unserem Vater, und dem Herrn Jesus, dem Messias, ist
  alternative: die Gott, unserem Vater, und dem Herrn Jesus, dem Messias, gehört
  rationale: „In“ bewahrt die verdichtete griechische Formulierung und legt nicht fest, ob Zugehörigkeit, Verbundenheit, Gründung oder geistlicher Lebensraum gemeint ist.
translation_notes:
  register: Moderner, würdiger Briefeingang. Die dreifache Namensreihe wird im Deutschen ohne wiederholtes „und“ vor jedem Namen natürlich wiedergegeben. Der Relativsatz vermeidet die missverständliche unmittelbare Verbindung „Gemeinde … in Gott“, ohne die theologische Offenheit der Präposition ἐν aufzulösen.
