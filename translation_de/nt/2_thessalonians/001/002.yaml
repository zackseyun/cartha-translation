id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: de
  text: Gnade und Frieden von Gott, dem Vater, und dem Herrn Jesus, dem Messias[a], seien mit euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus.'
    reason: Χριστός kann als „Messias“ sinngemäß oder traditionell als „Christus“ wiedergegeben werden.
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt sowohl den Charakter des paulinischen Grußes als auch das theologische Gewicht des Begriffs.
- source_word: ὑμῖν
  choice: mit euch
  rationale: Die deutsche Segensformel „seien mit euch“ gibt den Dativ natürlich wieder, ohne den Sinn zu verändern.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Die geläufige Wiedergabe umfasst sowohl Abwesenheit von Feindschaft als auch Wohlergehen und Ganzheit.
- source_word: ἀπὸ
  choice: von
  rationale: Kennzeichnet Gott und den Herrn Jesus als Ursprung des zugesprochenen Segens.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Der gedruckte griechische Text enthält hier kein ausdrückliches „unserem“. Die Apposition „dem Vater“ ist im Deutschen natürlich und vermeidet eine unnötige Ergänzung.
- source_word: κυρίου
  choice: Herrn
  rationale: Bewahrt den titularen Charakter und den etablierten neutestamentlichen Sprachgebrauch.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: „Messias“ macht die Bedeutung des griechischen Titels Χριστός sichtbar; die appositionale Form ist im Deutschen idiomatisch.
theological_decisions:
- issue: Fehlendes Possessivpronomen bei πατρός
  choice: Gott, dem Vater
  alternative: Gott, unserem Vater
  rationale: Anders als die englische Konsultationsfassung enthält der vorliegende griechische Text kein ἡμῶν („unserem“). Das Deutsche erlaubt eine natürliche Wiedergabe ohne Ergänzung.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: „Messias“ bewahrt die Bedeutung als Titel; die traditionelle Form „Christus“ wird als zulässige Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung verbindet die beiden Segenswünsche klar mit ihrer Quelle; die Kommas kennzeichnen „dem Vater“ und „dem Messias“ als Appositionen.
