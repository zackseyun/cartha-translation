id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: de
  text: Wir müssen Gott allezeit für euch danken, Brüder[a], wie es angemessen ist; denn euer Glaube wächst überaus, und die Liebe jedes Einzelnen von euch allen zueinander nimmt zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann als Anrede die ganze Glaubensgemeinschaft einschließen.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Glaube“ übersetzte griechische Wort kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Wir müssen … danken
  rationale: Die Verbindung aus Infinitiv und ὀφείλομεν bezeichnet eine Verpflichtung. „Müssen“ gibt sie im heutigen Deutsch natürlich wieder, ohne einen äußeren Zwang zu unterstellen.
- source_word: πάντοτε
  choice: allezeit
  rationale: Bewahrt den umfassenden zeitlichen Sinn und entspricht dem würdevollen Briefstil; „immer“ wäre ebenfalls möglich.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: In einer Danksagungsformel ist „für euch“ die natürliche deutsche Wiedergabe.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Gibt die maskuline griechische Anrede formal wieder; ihre mögliche inklusive Bezugnahme auf die ganze Gemeinde wird in einer Fußnote erläutert.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: wie es angemessen ist
  rationale: Drückt die sittliche Angemessenheit aus, ohne das missverständliche „würdig“ zu verwenden.
- source_word: ὑπεραυξάνει
  choice: wächst überaus
  rationale: Das verstärkte Verb bezeichnet außergewöhnlich starkes Wachstum; „überaus“ erhält diese Intensivierung knapp und idiomatisch.
- source_word: ἡ πίστις
  choice: euer Glaube
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe; „Treue“ bleibt semantisch möglich und wird in der Fußnote genannt.
- source_word: πλεονάζει
  choice: nimmt zu
  rationale: Gibt die fortschreitende Vermehrung natürlich wieder und vermeidet eine unnötige Wiederholung von „wächst“.
- source_word: ἡ ἀγάπη
  choice: die Liebe
  rationale: „Liebe“ ist die direkte und gegenwärtig verständliche Wiedergabe.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: die Liebe jedes Einzelnen von euch zueinander
  rationale: Bewahrt die betonte distributive Aussage des Griechischen in natürlichem Deutsch; „zueinander“ stellt die gegenseitige Ausrichtung heraus.
theological_decisions:
- issue: Bedeutungsumfang von πίστις
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: Im Zusammenhang der Danksagung ist das Wachsen des Glaubens die wahrscheinlichste Lesart. Der griechische Begriff kann jedoch auch Treue oder Vertrauen bezeichnen, weshalb die Alternative nicht ausgeschlossen wird.
- issue: Inklusive Reichweite von ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Der Haupttext wahrt die grammatische Form des griechischen Maskulinums. Da die Anrede im Gemeindekontext Frauen einschließen kann, wird diese Reichweite in einer Fußnote kenntlich gemacht.
- issue: Stärke der durch ὀφείλομεν bezeichneten Verpflichtung
  choice: wir müssen
  alternative: wir sind es schuldig
  rationale: „Wir müssen“ vermittelt eine echte Verpflichtung in natürlichem modernem Deutsch. Die Formulierung bezeichnet hier eine angemessene moralische Pflicht und keinen erzwungenen Vorgang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formalem Briefklang. „Allezeit“ und die Satzgliederung wahren den gehobenen Ton, während „angemessen“, „wächst“ und „nimmt zu“ allgemein verständlich bleiben.
