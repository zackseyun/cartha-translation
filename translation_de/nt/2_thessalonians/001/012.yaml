source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: de
  text: damit der Name unseres Herrn Jesus in euch[a] verherrlicht wird und ihr in ihm, gemäß der Gnade unseres Gottes und des Herrn Jesus, des Messias.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“. Die griechische Präposition kann hier beide Nuancen tragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“ statt „Messias“. Das griechische Χριστός ist ein Titel und bedeutet „Messias“, der Gesalbte.'
    reason: alternative_reading
  - marker: c
    text: Im Griechischen steht nur ein Artikel vor „Gott“; die Schlussformulierung verbindet „unseren Gott“ und „Herrn Jesus, den Messias“ daher eng. Sie kann als Bezeichnung einer Person oder als Nennung Gottes und des Herrn Jesus verstanden werden. Die deutsche Artikelformulierung folgt dem natürlichen Sprachgebrauch und entscheidet die umstrittene griechische Konstruktion nicht über die Fußnote hinaus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das erhoffte Ergebnis des vorausgehenden Gebets ein und gibt die finale Bedeutung natürlich wieder.
- source_word: ἐνδοξασθῇ
  choice: verherrlicht wird
  rationale: Bewahrt Passiv und theologisches Gewicht des griechischen Verbs; der deutsche Konjunktiv ist nach „damit“ nicht erforderlich.
- source_word: τὸ ὄνομα
  choice: der Name
  rationale: Die biblische Metonymie für offenbarte Identität und Ansehen bleibt erhalten, ohne sie auszudeuten.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: unseres Herrn Jesus
  rationale: Natürliche deutsche Wortstellung bei genauer Wahrung von Titel, Possessivbezug und Eigenname.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Formnah und im Deutschen verständlich; ἐν beim Plural kann hier ebenso die gemeinschaftliche Nuance „unter euch“ tragen, die in einer Fußnote genannt wird.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: und ihr in ihm
  rationale: Erhält die knappe Parallelstruktur. Das maskuline Pronomen bezieht sich am natürlichsten auf den Herrn Jesus.
- source_word: κατὰ τὴν χάριν
  choice: gemäß der Gnade
  rationale: Gibt κατά als Maßstab oder Entsprechung wieder und vermeidet eine vorschnelle instrumentale Festlegung.
- source_word: χάριν
  choice: Gnade
  rationale: Etablierte und sachlich passende Wiedergabe des paulinischen χάρις.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: unseres Gottes und Herrn Jesus, des Messias
  rationale: Bildet die enge syntaktische Verbindung der griechischen Genitivgruppe ohne einen zusätzlichen Artikel vor „Herrn“ ab. Die Apposition „des Messias“ macht Χριστός als Titel in natürlichem Deutsch kenntlich.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christus
  rationale: Χριστός ist hier als Titel kenntlich; „Messias“ vermittelt dessen Bedeutung, während die Apposition idiomatisches Deutsch ermöglicht.
- issue: Bezugswort von αὐτῷ
  choice: ihm, bezogen auf den Herrn Jesus
  alternative: ihm, bezogen auf den Namen
  rationale: Das grammatische Geschlecht lässt im Deutschen wie im Griechischen theoretisch beide Bezüge zu; die wechselseitige Verherrlichung und paulinische Rede vom Sein in Christus sprechen stärker für Jesus. Die Alternative wird dokumentiert.
- issue: Syntaktische Tragweite der abschließenden Genitivgruppe
  choice: 'enge Verbindung: „unseres Gottes und Herrn Jesus, des Messias“'
  alternative: 'zwei ausdrücklich unterschiedene Bezugsgrößen: „unseres Gottes und des Herrn Jesus, des Messias“'
  rationale: Ein einziger Artikel steht vor θεοῦ, und καί verbindet die folgende Bezeichnung eng damit. Die Übersetzung fügt deshalb vor „Herrn“ keinen zweiten Artikel ein, dokumentiert aber die mögliche unterschiedliche Auffassung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und parallel zum Griechischen. „Verherrlicht“ und „Gnade“ bewahren den paulinisch-theologischen Wortschatz; die Fußnoten machen echte lexikalische und syntaktische Mehrdeutigkeiten sichtbar.
