  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: de
  text: Den Gruß schreibe ich, Paulus, mit meiner eigenen Hand. Er ist ein Zeichen in jedem Brief; so schreibe ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: Den Gruß
  rationale: ἀσπασμός bezeichnet hier den abschließenden Briefgruß. „Gruß“ ist im heutigen Deutsch natürlich und weniger fachsprachlich als „Grußformel“.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: schreibe ich, Paulus, mit eigener Hand
  rationale: Die Dativfügung bezeichnet das eigenhändige Schreiben. Die Umstellung in einen deutschen Aktivsatz macht deutlich, dass Paulus diesen Gruß persönlich schreibt, und bewahrt Παύλου als Selbstnennung.
- source_word: σημεῖον
  choice: das Zeichen
  rationale: σημεῖον bezeichnet ein erkennbares beziehungsweise beglaubigendes Zeichen. „Zeichen“ gibt den griechischen Ausdruck direkt wieder, ohne den Zweck stärker auszudeuten als der Text.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: in jedem Brief
  rationale: Die Wendung bezeichnet die Briefe einzeln und Paulus’ wiederkehrende Praxis. „Brief“ ist die natürliche moderne Entsprechung zu ἐπιστολή.
- source_word: οὕτως γράφω
  choice: so schreibe ich
  rationale: Die knappe Wiedergabe bewahrt die mögliche Beziehung sowohl auf Paulus’ Handschrift beziehungsweise Schreibweise als auch auf die unmittelbar vorliegende Grußformel.
theological_decisions:
- issue: Funktion des eigenhändigen Grußes
  choice: Der eigenhändige Gruß wird als Zeichen in Paulus’ Briefen bezeichnet, ohne ausdrücklich „Echtheitszeichen“ einzusetzen.
  alternative: „Das ist mein Echtheitszeichen in jedem Brief.“
  rationale: Der Kontext legt eine beglaubigende Funktion nahe, doch σημεῖον bedeutet zunächst allgemein „Zeichen“. Die offenere Formulierung vermeidet eine unnötige interpretierende Zuspitzung.
- issue: Bezug von οὕτως γράφω
  choice: „so schreibe ich“
  alternative: „So sieht meine Handschrift aus“ oder „Auf diese Weise schreibe ich den Gruß“
  rationale: Das griechische οὕτως kann auf die Art des Schreibens oder auf die konkrete Formel weisen. Die knappe deutsche Fassung erhält diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz wird für natürliche deutsche Syntax als Aktivsatz formuliert; die knappe Schlusswendung bleibt bewusst auslegungsoffen.
