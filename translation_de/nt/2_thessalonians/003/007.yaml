base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: de
  text: 'Denn ihr wisst selbst, wie ihr uns nachahmen sollt: Wir haben uns unter euch nicht ungeordnet verhalten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang dieses Abschnitts genauer: „Wir waren unter euch nicht untätig.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: selbst
  rationale: Das intensive Pronomen betont, dass die Thessalonicher dies aus eigener Kenntnis wissen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorangehende Aufforderung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Das formal perfektische οἶδα hat hier präsentische Bedeutung.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: wie ihr uns nachahmen sollt
  rationale: Die Formulierung gibt sowohl die Art und Weise (πῶς) als auch die Verpflichtung (δεῖ) natürlich wieder und behält „uns“ als persönliches Objekt bei.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι erläutert hier, woran die Leser erkennen, wie sie die Absender nachahmen sollen. Ein Doppelpunkt stellt diesen erläuternd-begründenden Zusammenhang im Deutschen klar dar, ohne ihn unnötig auf eine einzige syntaktische Funktion festzulegen.
- source_word: οὐκ ἠτακτήσαμεν
  choice: wir haben uns nicht ungeordnet verhalten
  rationale: ἀτακτέω bezeichnet ein ungeordnetes oder undiszipliniertes Verhalten. Die Wiedergabe bewahrt den weiteren Wortsinn, während der Kontext besonders an Müßiggang denken lässt.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezeichnet das Verhalten der Absender inmitten der Gemeinde.
theological_decisions:
- issue: Bedeutung von ἀτακτέω im unmittelbaren Zusammenhang
  choice: Breiter als ungeordnetes Verhalten wiedergeben
  alternative: „Wir waren unter euch nicht untätig“
  rationale: Der Zusammenhang des Kapitels verbindet das Wort eng mit Arbeitsverweigerung und Müßiggang. Sein Bedeutungsumfang ist jedoch weiter; der Haupttext soll ihn daher nicht ohne Not verengen.
- issue: Funktion von ὅτι
  choice: Erläuternd-begründenden Anschluss durch einen Doppelpunkt ausdrücken
  alternative: „weil wir uns unter euch nicht ungeordnet verhalten haben“ oder „dass wir uns …“
  rationale: ὅτι kann hier kausal oder inhaltlich-erläuternd verstanden werden. Der Doppelpunkt bewahrt diese leichte syntaktische Offenheit und ergibt zugleich einen natürlichen deutschen Satz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachahmen“ bewahrt die direkte persönliche Ausrichtung des griechischen Ausdrucks; „ungeordnet“ erhält dessen breiteren Sinn. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
