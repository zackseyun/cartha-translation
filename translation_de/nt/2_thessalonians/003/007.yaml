  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: αὐτοὶ betont mit „selbst“, δεῖ wird angemessen durch „sollt“ ausgedrückt, und μιμεῖσθαι ἡμᾶς bleibt als persönliche Nachahmung („uns nachahmen“) erhalten. „Wir haben uns unter euch nicht ungeordnet verhalten“ bewahrt für ἀτακτέω den weiteren Sinnbereich und verengt ihn nicht im Haupttext auf Müßiggang. Der Doppelpunkt ist für das syntaktisch nicht ganz eindeutig einzuordnende ὅτι vertretbar und im Deutschen gut lesbar.'
