id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: de
  text: Wir gebieten euch aber, Brüder und Schwestern[a], im Namen unseres Herrn Jesus Christus, euch von jedem Bruder fernzuhalten[b], der ein ungeordnetes Leben führt[c] und sich nicht an die Überlieferung hält, die sie von uns empfangen haben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die maskuline Pluralform ἀδελφοί dient hier als Anrede der ganzen Gemeinde.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch von jedem Bruder zurückzuziehen“. Gemeint ist, sich von enger Gemeinschaft fernzuhalten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der ungeordnet umhergeht“; gemeint ist seine Lebensführung. Im folgenden Zusammenhang gehört dazu besonders, dass jemand nicht arbeiten will.'
    reason: lexical_alternative
  - marker: d
    text: Der gedruckte griechische Text lautet „die sie von uns empfangen haben“. Einige Handschriften lesen glättend „die ihr von uns empfangen habt“ oder „die er von uns empfangen hat“.
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: Wir gebieten
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Weisung. „Gebieten“ bewahrt diese Stärke in würdigem, verständlichem Deutsch.
- source_word: δὲ
  choice: aber
  rationale: Die adversative beziehungsweise weiterführende Verknüpfung wird sichtbar wiedergegeben, ohne ein im Griechischen nicht vorhandenes zeitliches „nun“ einzuführen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die maskuline Pluralform ist die übliche gemeinschaftliche Anrede und richtet sich hier an die ganze Gemeinde; die Fußnote dokumentiert die Form des Ausgangstextes.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: im Namen unseres Herrn Jesus Christus
  rationale: „Im Namen“ wahrt die feierliche Wendung und den Autoritätsbezug. „Christus“ ist im modernen deutschen Bibelregister die natürliche, zugleich titelhaltige Wiedergabe von Χριστός.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: euch … fernzuhalten
  rationale: Die mediale Form mit ἀπό beschreibt das Zurückziehen aus enger Gemeinschaft, ohne ausdrücklich einen formalen Gemeindeausschluss zu bezeichnen.
- source_word: παντὸς ἀδελφοῦ
  choice: von jedem Bruder
  rationale: Die singularische maskuline Form und die familiäre Gemeindesprache werden direkt bewahrt.
- source_word: ἀτάκτως περιπατοῦντος
  choice: der ein ungeordnetes Leben führt
  rationale: Die paulinische Weg-Metapher wird in natürliches Deutsch übertragen; „ungeordnet“ wahrt den breiteren Sinn, der im Kontext auch Müßiggang umfasst.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: sich nicht an die Überlieferung hält
  rationale: παράδοσις bezeichnet das Weitergegebene. „Überlieferung“ ist direkt, während die idiomatische Verbfügung das Verhalten natürlich ausdrückt.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: die sie von uns empfangen haben
  rationale: Die ungewöhnliche dritte Person Plural des gedruckten SBLGNT-Textes wird trotz des vorhergehenden Singulars beibehalten und durch eine textkritische Fußnote erklärt.
theological_decisions:
- issue: Wiedergabe des christologischen Titels Χριστοῦ
  choice: Christus
  alternative: Messias
  rationale: „Christus“ ist im Deutschen die etablierte titelhaltige Form und lässt die traditionelle christologische Benennung stehen; „Messias“ ist als inhaltlich transparente Alternative möglich, wird hier aber nicht zur Auflösung des griechischen Titels erzwungen.
- issue: Reichweite der angeordneten Distanzierung
  choice: euch von … fernzuhalten
  alternative: euch von … zurückzuziehen
  rationale: Die Formulierung gibt die disziplinierende soziale Distanz wieder, ohne einen förmlichen Ausschluss aus der Gemeinde in den Text hineinzulesen.
- issue: Numerus im Relativsatz zur Überlieferung
  choice: die sie von uns empfangen haben
  alternative: die ihr von uns empfangen habt / die er von uns empfangen hat
  rationale: Der gedruckte SBLGNT-Text hat die dritte Person Plural. Die auffällige Spannung zum singularischen „jedem Bruder“ bleibt erhalten; glättende Varianten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der autoritative Ton von Παραγγέλλομεν bleibt erhalten; unnötig technische Kirchenrechtssprache wird vermieden. Die syntaktische Auffälligkeit der SBLGNT-Lesart wird nicht stillschweigend geglättet.
