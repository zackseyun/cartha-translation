source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: de
  text: Diesen Menschen gebieten wir im Herrn Jesus Christus und ermahnen sie, in Ruhe zu arbeiten und ihr eigenes Brot zu essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Solchen Menschen aber
  rationale: Der Dativ verweist auf die zuvor beschriebenen unordentlich und untätig Lebenden zurück. „Aber“ gibt die leichte weiterführende beziehungsweise kontrastierende Kraft von δέ wieder.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: gebieten wir und ermahnen sie
  rationale: Die beiden Verben bewahren sowohl den verbindlichen apostolischen Auftrag als auch den eindringlichen seelsorgerlichen Appell. Das im Deutschen nötige Objekt „sie“ nimmt „solchen Menschen“ wieder auf.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: im Herrn Jesus Christus
  rationale: „Im Herrn“ wahrt die offene Bedeutung von ἐν als Sphäre, Verbundenheit und autoritativer Grundlage, ohne sie einseitig instrumental als „durch“ festzulegen. „Christus“ ist im modernen deutschen Bibelregister die geläufige Wiedergabe des messianischen Titels Χριστός.
- source_word: μετὰ ἡσυχίας
  choice: in Ruhe
  rationale: Gemeint ist eine ruhige, geordnete Lebens- und Arbeitsweise im Gegensatz zu störender Untätigkeit; „in Ruhe“ ist natürlich und lässt den Ausdruck knapp.
- source_word: ἐργαζόμενοι
  choice: arbeiten
  rationale: Das Partizip beschreibt die begleitende Art und Weise. Im natürlichen Deutschen wird es innerhalb des dass-Satzes verbal wiedergegeben.
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: ihr eigenes Brot
  rationale: Die konkrete Brotmetapher bleibt erhalten und bezeichnet im Zusammenhang den eigenen Lebensunterhalt, ohne den nicht ausdrücklich genannten Gedanken „selbst verdient“ in den Text einzutragen.
- source_word: ἐσθίωσιν
  choice: essen
  rationale: Der durch ἵνα eingeleitete Subjunktiv bezeichnet hier den Inhalt des Gebots. Der deutsche dass-Satz trägt die verpflichtende Kraft bereits durch „gebieten“ und „ermahnen“.
theological_decisions:
- issue: Bedeutung von Χριστός
  choice: Christus
  alternative: Messias
  rationale: Χριστός ist ein messianischer Titel. „Christus“ ist dafür im Deutschen die etablierte, würdige Bezeichnung und wird hier zusammen mit „Herr Jesus“ nicht als bloßer Familienname behandelt.
- issue: Verhältnis von apostolischer Autorität und Ermahnung
  choice: 'Beide Verben werden beibehalten: „gebieten“ und „ermahnen“'
  alternative: Zusammenfassend „weisen wir an“
  rationale: Der Ausgangstext verbindet verbindliche Autorität mit eindringlichem Zuspruch; eine Zusammenfassung würde diese Spannung einebnen.
- issue: Eigenes Brot
  choice: Die konkrete Formulierung wird bewahrt
  alternative: „ihren Lebensunterhalt selbst verdienen“
  rationale: Die Alternative erklärt den Zusammenhang zutreffend, trägt aber Arbeit und Erwerb stärker in die Nominalgruppe ein, als es der griechische Wortlaut selbst tut.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau ist gegenüber der griechischen Partizipialkonstruktion leicht geglättet, ohne die Aufforderung oder die Brotmetapher aufzulösen.
