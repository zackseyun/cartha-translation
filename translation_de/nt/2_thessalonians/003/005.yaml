id: 2TH.3.5
reference: 2 Thessalonians 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: de
  text: Der Herr aber richte eure Herzen auf die Liebe Gottes[a] und auf die Standhaftigkeit des Messias[b][c] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Liebe zu Gott“. Der griechische Genitiv kann auch „Gottes Liebe“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „auf die Standhaftigkeit des Messias selbst“ oder „auf Standhaftigkeit im Blick auf den Messias“.'
    reason: alternative_reading
  - marker: c
    text: 'Griechisch: „Christus“; hier mit „Messias“ übersetzt, weil das Wort als Titel gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Die übliche und theologisch gewichtige Wiedergabe des göttlichen beziehungsweise christologischen Titels; der Bezug wird nicht über den Wortlaut hinaus festgelegt.
- source_word: κατευθύναι
  choice: richte … auf
  rationale: Der Aoristoptativ drückt einen Wunsch oder ein Gebet aus. Die Konstruktion „richte eure Herzen auf“ gibt die leitende Ausrichtung natürlich wieder und passt zu εἰς.
- source_word: καρδίας
  choice: Herzen
  rationale: Bewahrt die biblische Metapher für das Zentrum von Denken, Wollen und Empfinden.
- source_word: ἀγάπην
  choice: Liebe
  rationale: Die klare und übliche deutsche Entsprechung für ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv bewahrt die mögliche Bedeutung sowohl von Gottes Liebe als auch der Liebe zu Gott, ohne sie im Haupttext festzulegen.
- source_word: ὑπομονὴν
  choice: Standhaftigkeit
  rationale: Bezeichnet beharrliches Ausharren unter Belastung und passt zum auf die innere Haltung gerichteten Gebet.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός fungiert hier als Titel und wird daher bedeutungsgemäß mit „Messias“ wiedergegeben. Der Genitiv bleibt im Haupttext formal erhalten.
theological_decisions:
- issue: Mehrdeutiger Genitiv in τὴν ἀγάπην τοῦ θεοῦ
  choice: die Liebe Gottes
  alternative: die Liebe zu Gott; Gottes Liebe
  rationale: Der griechische Genitiv kann subjektiv, objektiv oder weiter als göttlich geprägte Liebe verstanden werden. Die Formulierung im Haupttext bewahrt diese Spannung.
- issue: Mehrdeutiger Genitiv in τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: die Standhaftigkeit des Messias
  alternative: die Standhaftigkeit des Messias selbst; Standhaftigkeit für den Messias; eine Standhaftigkeit wie die des Messias
  rationale: Die Wendung kann subjektiv, objektiv oder qualitativ verstanden werden. Der Haupttext legt keine dieser Möglichkeiten abschließend fest.
- issue: Wiedergabe von Χριστοῦ
  choice: Messias
  alternative: Christus
  rationale: Das Wort bezeichnet hier den Titel „Messias“; diese Übersetzung macht seinen Sinn transparent, während die traditionelle Form in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv „richte“ gibt den gebetsartigen Wunsch des griechischen Optativs knapp wieder. „Aber“ bildet δέ ab, ohne einen nicht vorhandenen zeitlichen Ausdruck einzuführen. Die parallele Formulierung „auf … und auf …“ wahrt die Struktur des Ausgangstextes.
