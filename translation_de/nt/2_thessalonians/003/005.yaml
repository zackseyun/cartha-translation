review_pass:
  verdict: revise
  source_fidelity: Der Aoristoptativ κατευθύναι wird mit „richte … aus“ angemessen als Wunsch bzw. Gebet wiedergegeben. Die beiden εἰς-Phrasen und die formale Offenheit der Genitive bleiben erhalten. „Messias“ gibt Χριστός entsprechend der Projektvorgabe als Titel wieder.
  naturalness: „Die Herzen auf etwas ausrichten“ ist im modernen Standarddeutsch idiomatischer und präziser als das unvollständiger wirkende „die Herzen auf etwas richten“. Die alternative Formulierung „Standhaftigkeit für den Messias“ ist im Deutschen dagegen semantisch unklar und wenig natürlich.
  terminology: „Herr“, „Herzen“, „Liebe“, „Standhaftigkeit“ und „Messias“ sind registergerecht. Die Fußnoten sollen die genitivische Mehrdeutigkeit erläutern, ohne eine Lesart als Auslegung festzulegen.
  issues:
  - severity: low
    issue: Verbpartikel bei „richte … auf“
    rationale: Für die beabsichtigte Bedeutung von Ausrichtung bzw. Leitung ist „richte eure Herzen auf … aus“ die idiomatischere vollständige Konstruktion.
  - severity: medium
    issue: Unnatürliche objektive Alternative in Fußnote b
    rationale: „Standhaftigkeit für den Messias“ ist im Deutschen nicht klar verständlich. „Standhaftigkeit im Blick auf den Messias“ bildet die mögliche objektive bzw. relationale Lesart verständlich ab, ohne sie dogmatisch festzulegen.
  - severity: low
    issue: Formulierung der Fußnote a
    rationale: Die Aussage „der griechische Ausdruck kann auch ‚auf Gottes Liebe‘ bedeuten“ vermischt die Bedeutung des Genitivs mit der deutschen Präposition. Die Fußnote sollte klar benennen, dass der griechische Genitiv auch „Gottes Liebe“ bedeuten kann.
  revised_text: Der Herr aber richte eure Herzen auf die Liebe Gottes[a] und auf die Standhaftigkeit des Messias[b][c] aus.
