  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: de
  text: Und betrachtet ihn nicht als einen Feind, sondern ermahnt ihn als einen Bruder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ bezeichnet hier einen Glaubensgenossen; die männliche Einzelform kann stellvertretend für ein Mitglied der christlichen Gemeinschaft stehen.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: betrachtet
  rationale: Das Verb bezeichnet hier die Einschätzung oder Einordnung einer Person. „Betrachtet … als“ gibt diese wertende Bedeutung im modernen Deutschen natürlich wieder.
- source_word: ἐχθρόν
  choice: Feind
  rationale: „Feind“ ist die direkte und geläufige Entsprechung und bewahrt den starken Gegensatz zu „Bruder“.
- source_word: νουθετεῖτε
  choice: weist … zurecht
  rationale: νουθετέω meint ein mahnendes, korrigierendes Einwirken. „Zurechtweisen“ bewahrt den korrigierenden Nachdruck, ohne persönliche Feindseligkeit auszudrücken.
- source_word: ἀδελφόν
  choice: Bruder
  rationale: Der maskuline Singular wird entsprechend der konkreten Form des Ausgangstextes beibehalten; eine Fußnote erläutert seinen gemeinschaftsbezogenen Sinn.
- source_word: ὡς
  choice: als
  rationale: In beiden Satzteilen bezeichnet ὡς die Rolle oder Kategorie, in der die betreffende Person gesehen beziehungsweise angesprochen werden soll.
- source_word: καὶ μὴ … ἀλλὰ
  choice: Und … nicht …, sondern …
  rationale: Diese Wiedergabe erhält sowohl die Verbindung zum vorausgehenden Gedanken als auch den klaren Gegensatz.
theological_decisions:
- issue: Haltung gegenüber einem ungehorsamen Mitglied der Glaubensgemeinschaft
  choice: Die Person soll nicht als Feind eingeordnet, sondern weiterhin als Bruder anerkannt und korrigiert werden.
  alternative: Der Satz könnte losgelöst vom Kontext als allgemeine Weisung für zwischenmenschliche Konflikte verstanden werden.
  rationale: Der unmittelbare Zusammenhang in 2 Thessalonicher 3,14–15 behandelt gemeinschaftliche Disziplin. Die Bezeichnung „Bruder“ hält trotz der notwendigen Zurechtweisung an der Beziehung innerhalb der Glaubensgemeinschaft fest, ohne den genauen kirchenrechtlichen Status weiter zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zurechtweisen“ ist verständlicher und idiomatischer als das gehobenere „ermahnen“, bewahrt aber den korrigierenden Sinn. Eine zusätzliche Fußnote zu „betrachten“ ist nicht nötig, da „als Feind betrachten“ und „für einen Feind halten“ im Deutschen keine sachlich relevante Bedeutungsalternative darstellen.
