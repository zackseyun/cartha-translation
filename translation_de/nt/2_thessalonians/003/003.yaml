  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: de
  text: Doch der Herr ist treu. Er wird euch stärken und vor dem Bösen[a] bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische τοῦ πονηροῦ kann entweder sächlich („das Böse“) oder männlich („der Böse“) verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: treu
  rationale: Das prädikative Adjektiv bezeichnet die Verlässlichkeit und Treue des Herrn. „Treu“ ist im Deutschen natürlich, würdevoll und bewahrt das theologische Gewicht des Ausdrucks.
- source_word: δέ
  choice: Doch
  rationale: Die Partikel stellt die Treue des Herrn dem vorher erwähnten Mangel an Glauben beziehungsweise Treue bei Menschen gegenüber. „Doch“ gibt diesen Kontrast klar wieder.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Der Titel wird ohne zusätzliche Festlegung wiedergegeben. Im paulinischen Zusammenhang ist wahrscheinlich Jesus gemeint, doch der griechische Wortlaut nennt nur „den Herrn“.
- source_word: στηρίξει
  choice: wird euch stärken
  rationale: στηρίζω kann festigen, stärken oder befestigen bedeuten. „Stärken“ passt zum seelsorgerlichen Zusammenhang und ist in modernem Deutsch unmittelbar verständlich.
- source_word: φυλάξει
  choice: wird ... bewahren
  rationale: φυλάσσω bezeichnet schützendes Bewachen oder Bewahren. „Bewahren“ verbindet sich idiomatisch mit „vor“ und erhält den aktiven Schutzgedanken.
- source_word: ἀπὸ
  choice: vor
  rationale: Bei Verben des Schützens oder Bewahrens wird ἀπό im Deutschen natürlich mit „vor“ wiedergegeben.
- source_word: τοῦ πονηροῦ
  choice: dem Bösen
  rationale: Die artikulierte Genitivform ist grammatisch entweder maskulin („der Böse“) oder neutrum („das Böse“). Der Haupttext folgt der ebenfalls gut möglichen abstrakten Lesart; die personale Lesart wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug von τοῦ πονηροῦ
  choice: dem Bösen
  alternative: dem Bösen, das heißt dem Teufel / dem bösen Einen
  rationale: Die griechische Form lässt offen, ob allgemein das Böse oder personal der Böse gemeint ist. Weil „vor dem Bösen“ im Deutschen die Ambiguität teilweise offenhält und sprachlich natürlich ist, steht diese Form im Haupttext; die mögliche personale Deutung wird ausdrücklich angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Relativsatz wird zur natürlichen deutschen Satzführung in zwei Sätze gegliedert. Die Wiederaufnahme mit „Er“ erhält den Bezug auf den Herrn. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
