  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: de
  text: Denn wir hören, dass einige unter euch ein ungeordnetes Leben führen[a], überhaupt nicht arbeiten, sondern sich einmischen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich untätig verhalten“ oder „undiszipliniert leben“. Das griechische Adverb kann ein Verhalten bezeichnen, das nicht der Ordnung entspricht oder im Blick auf die Gemeinschaft von Untätigkeit geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische enthält ein Wortspiel mit dem Wort für „arbeiten“: Sie verrichten keine Arbeit, sondern beschäftigen sich mit fremden Angelegenheiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: wir hören
  rationale: Das Präsens bezeichnet eine gegenwärtige oder fortlaufend eintreffende Nachricht; „wir hören“ ist im Deutschen natürlich und wahrt den Zeitaspekt.
- source_word: γάρ
  choice: denn
  rationale: γάρ begründet beziehungsweise erläutert die vorausgehende Ermahnung; „denn“ gibt diese Verknüpfung knapp und idiomatisch wieder.
- source_word: τινας
  choice: einige
  rationale: Das indefinite Pronomen bezeichnet eine nicht näher bestimmte Gruppe innerhalb der Gemeinde.
- source_word: περιπατοῦντας
  choice: ein Leben führen
  rationale: περιπατέω wird hier bildlich für Lebensführung und Verhalten gebraucht. Die idiomatische deutsche Wendung vermittelt diesen Sinn klar, ohne ein missverständliches wörtliches „umhergehen“.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Formulierung verortet die Betreffenden innerhalb der Gemeinde.
- source_word: ἀτάκτως
  choice: ungeordnet
  rationale: Das Adverb kann ein ordnungswidriges, undiszipliniertes oder im Kontext auch untätiges Verhalten bezeichnen. „Ungeordnet“ bewahrt den weiteren Sinn; der folgende Satzteil konkretisiert die Arbeitsverweigerung.
- source_word: μηδὲν ἐργαζομένους
  choice: sie arbeiten überhaupt nicht
  rationale: Die Formulierung gibt die durch μηδέν ausgedrückte vollständige Verneinung natürlicher und nachdrücklicher wieder.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung markiert „sondern“ im Deutschen den scharfen Gegensatz zwischen ausbleibender Arbeit und ungehöriger Geschäftigkeit.
- source_word: περιεργαζομένους
  choice: mischen sich überall ein
  rationale: Das Verb bezeichnet unangebrachte Geschäftigkeit beziehungsweise Einmischung. Die Formulierung ist modern und verständlich; die Fußnote weist auf das griechische Wortspiel mit ἐργάζομαι hin.
