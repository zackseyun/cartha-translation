  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: de
  text: Ihr aber, Brüder[a], werdet nicht müde, Gutes zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; das griechische Wort lautet „Brüder“ und kann als inklusive Anrede für die ganze gläubige Gemeinde gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ihr aber
  rationale: Das vorangestellte ὑμεῖς hebt die Angesprochenen hervor, während δέ den Gegensatz zu den zuvor erwähnten Müßiggängern markiert. „Ihr aber“ gibt beides knapp und natürlich wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische Vokativ ist grammatisch maskulin und bedeutet wörtlich „Brüder“. Da Paulus damit hier wahrscheinlich die ganze Gemeinde anspricht, wird die inklusive Reichweite in einer Fußnote erläutert.
- source_word: μὴ ἐγκακήσητε
  choice: werdet nicht müde
  rationale: Die Verbindung aus μή und Aorist Konjunktiv formuliert ein Verbot. ἐγκακέω bezeichnet das Ermüden, Nachlassen oder Verzagtheit beim fortgesetzten Handeln; „werdet nicht müde“ passt idiomatisch zum folgenden Partizip.
- source_word: καλοποιοῦντες
  choice: Gutes zu tun
  rationale: Das Präsenspartizip bezeichnet die fortdauernde Tätigkeit, bei der die Angesprochenen nicht müde werden sollen. „Gutes zu tun“ ist im modernen Deutschen klar und natürlich.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί als Anrede der Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die Übersetzung bewahrt im Haupttext die grammatisch maskuline Form des Griechischen, ohne ihre wahrscheinlich inklusive gemeindliche Bedeutung zu leugnen; diese wird in der Fußnote ausdrücklich kenntlich gemacht.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die knappe Satzstruktur und der hervorgehobene Gegensatz des griechischen Textes bleiben erhalten.
