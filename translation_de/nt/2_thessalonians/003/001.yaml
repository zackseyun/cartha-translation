  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: de
  text: Im Übrigen betet, Brüder[a], für uns, damit sich das Wort des Herrn rasch verbreitet und geehrt wird, wie auch bei euch[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Das griechische Wort lautet „Brüder“ und kann die ganze Gemeinde repräsentativ ansprechen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „damit das Wort des Herrn läuft und verherrlicht wird, wie auch bei euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Im Übrigen
  rationale: Die Wendung leitet einen weiteren beziehungsweise abschließenden Abschnitt des Briefes ein. „Im Übrigen“ gibt diese Funktion wieder, ohne zwingend zu behaupten, dies sei bereits der letzte Gedanke.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Der Imperativ im Präsens fordert die Gemeinde zum Gebet auf; der schlichte deutsche Imperativ ist natürlich und kann auch fortgesetztes Beten bezeichnen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formal wiedergegeben. Dass sie in einer Gemeinde die Glaubensgeschwister insgesamt ansprechen kann, wird in einer Fußnote erläutert.
- source_word: περὶ ἡμῶν
  choice: für uns
  rationale: In Verbindung mit „beten“ ist dies die natürliche deutsche Wiedergabe von περί mit Genitiv.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ wahrt den Zweck- beziehungsweise Zielcharakter der Gebetsbitte.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: Die transparente biblische Wendung bleibt erhalten und bezeichnet hier die verkündete Botschaft des Herrn.
- source_word: τρέχῃ
  choice: sich rasch verbreitet
  rationale: Das wörtliche Bild des Laufens beschreibt den schnellen Fortgang der Botschaft. Die idiomatische Wiedergabe vermittelt diesen Sinn in heutigem Deutsch; das Bild wird in der Fußnote dokumentiert.
- source_word: δοξάζηται
  choice: geehrt wird
  rationale: Beim „Wort“ bezeichnet δοξάζω hier dessen ehrenvolle Aufnahme und Anerkennung. „Geehrt wird“ ist verständlicher als das im Deutschen stärker kultisch klingende „verherrlicht wird“, ohne die passive Form aufzulösen.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: wie auch bei euch
  rationale: Die knappe Vergleichsformulierung bewahrt die Ellipse des Griechischen und legt nicht ausdrücklich fest, ob ein vergangenes oder gegenwärtiges Geschehen gemeint ist.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Der Wortlaut bleibt im Haupttext sichtbar; zugleich weist die Fußnote darauf hin, dass die maskuline Pluralform die ganze Gemeinde repräsentativ anreden kann.
- issue: Metaphorik von τρέχῃ beim Wort des Herrn
  choice: sich rasch verbreitet
  alternative: läuft
  rationale: Die zielsprachlich klare Formulierung gibt die schnelle, ungehinderte Ausbreitung der Botschaft wieder. Das ursprüngliche Laufbild wird nicht als zusätzliche Lehraussage behandelt, sondern in der Fußnote bewahrt.
- issue: Bedeutung von δοξάζηται
  choice: geehrt wird
  alternative: verherrlicht wird
  rationale: Beide Wiedergaben sind lexikalisch möglich. Im Zusammenhang mit der Aufnahme der verkündeten Botschaft drückt „geehrt“ den Sinn natürlich aus; die wörtlichere Alternative wird offengelegt.
- issue: Zeitbezug des Vergleichs mit den Thessalonichern
  choice: wie auch bei euch
  alternative: wie es auch bei euch geschah
  rationale: Da der griechische Vergleich kein Verb und damit keine ausdrückliche Zeitform enthält, wahrt die elliptische deutsche Fassung die genuine Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gebetsaufruf, vermeidet jedoch unnötig hölzerne Formulierungen. Die Ellipse am Versende und das abschließende Komma bleiben erhalten, weil der Satz im folgenden Vers weitergeführt wird.
