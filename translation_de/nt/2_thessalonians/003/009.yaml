  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: de
  text: Nicht weil wir kein Recht dazu haben[a], sondern um uns euch zum Vorbild[b] zu geben, damit ihr uns nachahmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keine Befugnis« beziehungsweise »keine Vollmacht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Muster« beziehungsweise »Beispiel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: Recht
  rationale: Im Zusammenhang bezeichnet das Wort den legitimen Anspruch auf materielle Unterstützung, nicht bloß Macht oder umfassende Amtsgewalt.
- source_word: ἑαυτοὺς
  choice: uns
  rationale: Das Reflexivpronomen bezieht sich auf Paulus und seine Mitarbeiter; im deutschen Ausdruck »uns als Vorbild geben« ist der reflexive Bezug natürlich wiedergegeben.
- source_word: τύπον
  choice: Vorbild
  rationale: Hier ist ein beispielhaftes Verhaltensmuster gemeint, das andere nachahmen sollen. »Vorbild« ist im modernen Deutschen klar und idiomatisch.
- source_word: δῶμεν
  choice: geben
  rationale: Bewahrt das griechische Bild des Sich-selbst-als-Vorbild-Gebens und bleibt im Deutschen verständlich.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: sodass ihr … nachahmt
  rationale: Die Konstruktion bezeichnet die auf das Vorbild bezogene Zielrichtung beziehungsweise Folge; die Wiedergabe ist flüssig, ohne den Bezug zum Zweck zu verlieren.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: ihr uns nachahmt
  rationale: Gibt den Infinitiv mit seinem direkten Objekt eng und verständlich wieder.
- source_word: οὐχ ὅτι οὐκ
  choice: Nicht weil wir kein … hätten
  rationale: Die Formulierung bewahrt die doppelte Verneinung als Klarstellung des Beweggrundes und bildet einen natürlichen Kontrast zum folgenden Zweck.
- source_word: ἀλλ’ ἵνα
  choice: sondern damit
  rationale: Kennzeichnet den positiven Zweck im Gegensatz zur zuvor zurückgewiesenen Begründung.
theological_decisions:
- issue: Bedeutung des Anspruchs in ἐξουσίαν
  choice: Paulus erklärt, dass er und seine Mitarbeiter ein legitimes Recht auf Unterstützung besitzen, es hier aber zugunsten ihres Vorbilds nicht in Anspruch genommen haben.
  alternative: Das Wort kann allgemeiner ihre apostolische Vollmacht oder Befugnis bezeichnen.
  rationale: Der unmittelbare Zusammenhang handelt von Arbeit und davon, anderen nicht zur Last zu fallen. Daher steht der konkrete berechtigte Anspruch im Vordergrund, ohne dass die Übersetzung eine weitergehende Lehre über apostolische Autorität festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv »hätten« macht deutlich, dass der verneinte Grund nur zurückgewiesen wird. »Vorbild« und »nachahmen« erhalten den engen begrifflichen Zusammenhang des griechischen Textes.
