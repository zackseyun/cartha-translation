review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Paulus und seine Mitarbeiter hatten einen berechtigten Anspruch, verzichteten aber darauf, um als nachzuahmendes Vorbild zu dienen. Der Konjunktiv II „hätten“ schwächt jedoch die indikativische Feststellung ἔχομεν („wir haben“) unnötig ab. Außerdem gibt „sodass“ eher eine Folge wieder, während εἰς τὸ μιμεῖσθαι die Zielrichtung ausdrückt.'
  naturalness: „Uns euch als Vorbild geben“ ist verständlich, aber „uns euch zum Vorbild zu geben“ ist im modernen Standarddeutsch idiomatischer. Die Infinitivkonstruktion macht die Zweckbeziehung klar und flüssig.
  terminology: „Recht“ trifft ἐξουσία im Kontext des berechtigten Anspruchs auf Unterstützung gut. „Vorbild“ ist für τύπος passend; „nachahmen“ bewahrt die direkte Beziehung zu μιμεῖσθαι. Die Fußnoten bieten sinnvolle lexikalische Alternativen.
  issues:
  - severity: medium
    issue: Konjunktiv II „hätten“ statt Indikativ „haben“
    rationale: Der griechische Text sagt ausdrücklich, dass Paulus und seine Mitarbeiter das Recht besitzen (ἔχομεν). Die verneinte Kausalbestimmung verlangt im Deutschen keinen Konjunktiv II; „Nicht weil wir kein Recht dazu haben“ bewahrt die Aussagekraft des Indikativs.
  - severity: low
    issue: „sodass ihr uns nachahmt“ gibt die letzte Zielangabe als Folge wieder
    rationale: εἰς τὸ μιμεῖσθαι bezeichnet hier den Zweck des Vorbildseins. „damit ihr uns nachahmt“ gibt diese Zielrichtung präziser wieder.
  - severity: low
    issue: „uns euch als Vorbild geben“ ist weniger idiomatisch
    rationale: „Uns euch zum Vorbild zu geben“ ist eine geläufige deutsche Konstruktion und wahrt die Bildsprache sowie die Rollen von „uns“ und „euch“.
  revised_text: Nicht weil wir kein Recht dazu haben[a], sondern um uns euch zum Vorbild[b] zu geben, damit ihr uns nachahmt.
