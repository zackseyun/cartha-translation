revisions:
- from: Nicht weil wir kein Recht dazu hätten[a], sondern damit wir uns euch als Vorbild[b] geben, sodass ihr uns nachahmt.
  to: Nicht weil wir kein Recht dazu haben[a], sondern um uns euch zum Vorbild[b] zu geben, damit ihr uns nachahmt.
  rationale: Die Revision stellt den indikativischen Anspruch des griechischen Textes mit „haben“ wieder her, formuliert die Wendung mit „zum Vorbild“ idiomatischer und kennzeichnet sowohl das Sich-zum-Vorbild-Geben als auch das Nachahmen eindeutig als Ziel. Die Bedeutung und die vorhandenen Fußnotenanker bleiben erhalten.
