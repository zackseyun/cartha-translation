base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: de
  text: Wir vertrauen aber im Herrn darauf, dass ihr tut und tun werdet, was wir euch auftragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν ... ἐν κυρίῳ ἐφ’ ὑμᾶς
  choice: Wir vertrauen aber im Herrn darauf, dass ihr
  rationale: πεποίθαμεν bezeichnet begründetes Vertrauen bzw. Zuversicht; ἐν κυρίῳ wahrt dessen Verankerung im Herrn, während ἐφ’ ὑμᾶς natürlich auf die Adressaten bezogen wird.
- source_word: παραγγέλλομεν
  choice: was wir euch auftragen
  rationale: Das Verb bezeichnet eine verbindliche Anweisung. „Auftragen“ gibt diese Autorität in heutigem, würdigem Deutsch wieder, ohne unnötig scharf wie „befehlen“ zu klingen.
- source_word: καὶ ποιεῖτε καὶ ποιήσετε
  choice: tut und auch weiterhin tun werdet
  rationale: Die präsentische und futurische Aussage wird klar abgebildet. „Weiterhin“ macht den zeitlichen Zusammenhang idiomatisch deutlich, ohne den Aussagegehalt zu verändern.
theological_decisions:
- issue: Grund und Bezug des Vertrauens
  choice: „im Herrn“ als Verankerung des Vertrauens beibehalten und das Vertrauen zugleich auf das Handeln der Gemeinde beziehen
  alternative: „Wir sind euretwegen im Herrn zuversichtlich“
  rationale: 'Die Formulierung bewahrt die Spannung des griechischen Ausdrucks: Das Vertrauen gilt den Adressaten, gründet aber nicht unabhängig von Christus, sondern „im Herrn“.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apostolischem Ton. Der adversative Anschluss δέ wird mit „aber“ wiedergegeben; die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken.
