review_pass:
  verdict: revise
  source_fidelity: 'Die Bedingung „wenn jemand nicht arbeiten will“ trifft θέλει präzise als fehlende Bereitschaft, nicht als Unfähigkeit. Die Wiedergabe von καὶ γάρ als „Denn schon“ ist jedoch weniger genau: „schon“ legt im Deutschen leicht einen zeitlichen Akzent nahe, während καί hier additiv/emphatisch wirkt. Die Fußnote behauptet zudem eine grammatische Auslegungsalternative, die der griechische Imperativ der dritten Person nicht bietet.'
  naturalness: Der Satz ist insgesamt gut verständlich und würdig. „Denn auch“ ist für den Anschluss natürlicher und genauer als „Denn schon“; „wiesen wir euch immer wieder an“ gibt den wiederholten bzw. fortdauernden Charakter des Imperfekts idiomatisch wieder.
  terminology: „arbeiten will“ wahrt die wichtige Unterscheidung zwischen Unwilligkeit und Unfähigkeit. „Soll er auch nicht essen“ ist eine angemessene moderne Wiedergabe des Imperativs ἐσθιέτω.
  issues:
  - severity: medium
    issue: „Denn schon“ für καὶ γάρ
    rationale: „Schon“ kann temporal verstanden werden und bildet die additive bzw. verstärkende Funktion von καί nicht so klar ab. „Denn auch“ bewahrt die Verknüpfung und den Nachdruck ohne zusätzlichen Zeitakzent.
  - severity: medium
    issue: Fußnote a stellt eine nicht im griechischen Wortlaut angelegte grammatische Alternative dar
    rationale: μηδὲ ἐσθιέτω ist ein Imperativ der dritten Person und richtet die Aussage grammatisch an die genannte Person. „Dem sollt ihr auch nichts zu essen geben“ verlagert die Aufforderung an die Gemeinschaft und fügt „geben“ hinzu; dies ist eine weitergehende Auslegung, keine gleichwertige Übersetzungsalternative.
  revised_text: 'Denn auch als wir bei euch waren, wiesen wir euch immer wieder an: Wenn jemand nicht arbeiten will, soll er auch nicht essen.'
  revised_footnotes: []
