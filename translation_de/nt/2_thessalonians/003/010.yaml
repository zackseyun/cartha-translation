source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: de
  text: 'Denn auch als wir bei euch waren, wiesen wir euch immer wieder an: Wenn jemand nicht arbeiten will, soll er auch nicht essen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn schon
  rationale: „Denn“ gibt die begründende Verknüpfung durch γάρ wieder; „schon“ vermittelt die zusätzliche Hervorhebung durch καί im natürlichen deutschen Zusammenhang.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: als wir bei euch waren
  rationale: πρός mit Personen bezeichnet hier den Aufenthalt bei ihnen; die deutsche Wendung ist natürlich und sachlich genau.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen weist voraus auf den Inhalt der folgenden Anweisung, ohne ein zusätzliches Substantiv einzutragen.
- source_word: παρηγγέλλομεν
  choice: schärften wir euch dies immer wieder ein
  rationale: Das Imperfekt kann eine wiederholte oder fortgesetzte Anweisung ausdrücken. „Immer wieder“ bewahrt diesen Aspekt; „einschärfen“ gibt die nachdrückliche Bedeutung von παραγγέλλω wieder.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet den Inhalt der Anweisung ein; ein Doppelpunkt ist dafür im Deutschen die natürlichste Wiedergabe.
- source_word: εἴ τις
  choice: wenn jemand
  rationale: Die allgemein formulierte Bedingung wird im Deutschen idiomatisch mit „wenn jemand“ wiedergegeben.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: nicht arbeiten will
  rationale: θέλει bezeichnet fehlende Bereitschaft oder fehlenden Willen, nicht Arbeitsunfähigkeit. Die Formulierung erhält diese entscheidende Unterscheidung.
- source_word: μηδὲ ἐσθιέτω
  choice: soll er auch nicht essen
  rationale: μηδέ verbindet die Folgerung mit der Verneinung der Bedingung; der Imperativ der dritten Person wird im modernen Deutsch natürlich mit „soll“ ausgedrückt.
theological_decisions:
- issue: Arbeitsunwilligkeit oder Arbeitsunfähigkeit
  choice: „wenn jemand nicht arbeiten will“
  alternative: „wenn jemand nicht arbeiten kann“
  rationale: Das griechische θέλει betrifft den Willen. Der Vers richtet sich daher gegen mangelnde Arbeitsbereitschaft und macht keine Aussage gegen Menschen, die nicht arbeiten können.
- issue: Generisches Maskulinum in der Folgerung
  choice: „soll er auch nicht essen“
  alternative: „sollen sie auch nicht essen“
  rationale: Das deutsche „jemand“ wird grammatisch mit dem Singularpronomen „er“ wiederaufgenommen. So bleibt die singularische Struktur des Griechischen erhalten, ohne den allgemeinen Geltungsbereich einzuschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einschärfen“ wahrt den nachdrücklichen Charakter der Anweisung; „immer wieder“ macht den möglichen iterativen Aspekt des Imperfekts sichtbar. Die zentrale Unterscheidung zwischen Nichtwollen und Nichtkönnen bleibt ausdrücklich erhalten.
