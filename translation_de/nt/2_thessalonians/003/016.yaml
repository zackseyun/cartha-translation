id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: de
  text: Der Herr des Friedens selbst aber schenke euch den Frieden allezeit[a] und auf jede Weise[b]. Der Herr sei mit euch allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu jeder Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in jeder Art und Weise“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: selbst
  rationale: Das intensiv gebrauchte αὐτός hebt den Herrn persönlich hervor; die Stellung nach „Der Herr des Friedens“ ist im Deutschen natürlich und bewahrt die Betonung.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen milden Übergang zur abschließenden Segensbitte. „Aber“ bewahrt den verbindenden beziehungsweise leicht absetzenden Charakter, ohne einen zeitlichen Sinn einzutragen.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: der Herr des Friedens
  rationale: Die genitivische, titelartige Wendung wird formal und verständlich wiedergegeben, ohne sie deutend zu „der Herr, der Frieden gibt“ zu erweitern.
- source_word: δῴη
  choice: schenke
  rationale: Der Optativ drückt in diesem Segensspruch einen Wunsch beziehungsweise eine Bitte aus. Der deutsche Konjunktiv „schenke“ gibt diese Funktion idiomatisch wieder; „schenken“ ist für eine göttliche Friedensgabe natürlich.
- source_word: τὴν εἰρήνην
  choice: den Frieden
  rationale: Der bestimmte Artikel wird im Deutschen natürlich beibehalten und nimmt zugleich den „Frieden“ aus dem vorangehenden Herrentitel auf.
- source_word: διὰ παντὸς
  choice: allezeit
  rationale: Die Wendung bezeichnet zeitliche Beständigkeit. „Allezeit“ ist knapp, würdig und im heutigen Standarddeutsch verständlich.
- source_word: ἐν παντὶ τρόπῳ
  choice: auf jede Weise
  rationale: τρόπος bezeichnet Art oder Weise. „Auf jede Weise“ wahrt die Breite der Formulierung und klingt natürlicher als „in jeder Weise“.
- source_word: μετὰ πάντων ὑμῶν
  choice: mit euch allen
  rationale: Die Formulierung bewahrt die ausdrückliche Einbeziehung aller Angesprochenen und ist idiomatisches Deutsch.
theological_decisions:
- issue: Bezug von „der Herr“ im Segensspruch
  choice: „Herr“ ohne ausdrückliche Ergänzung
  alternative: „der Herr Jesus“ oder eine allgemeine Umschreibung mit „Gott“
  rationale: Der griechische Text nennt nur ὁ κύριος. Der paulinische Kontext legt wahrscheinlich Jesus Christus nahe, doch die Übersetzung soll die Identifizierung nicht über den Wortlaut hinaus ausdrücklich machen.
- issue: Aussageart des Schlusssatzes
  choice: „Der Herr sei mit euch allen.“ als Segenswunsch
  alternative: „Der Herr ist mit euch allen.“ als Feststellung
  rationale: Obwohl im Griechischen kein Verb steht, ist die Klausel im Kontext als Segenswunsch zu verstehen. Der deutsche Konjunktiv „sei“ gibt diese Funktion angemessen wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die Hervorhebung von „selbst“, ohne schwerfällig zu wirken. „Allezeit“ ist leicht gehoben, aber allgemein verständlich und für einen Segensspruch passend.
