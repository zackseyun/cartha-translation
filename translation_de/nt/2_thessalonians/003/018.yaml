  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: de
  text: Die Gnade unseres Herrn Jesus Christus sei mit euch allen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der etablierte paulinische Segensbegriff bezeichnet Gottes unverdiente, in Christus zugewandte Güte; „Gnade“ ist im Deutschen zugleich präzise, geläufig und würdig.
- source_word: κυρίου
  choice: Herrn
  rationale: Im christologischen Titel bringt „Herr“ Autorität und Verehrung zum Ausdruck und entspricht dem üblichen Bedeutungsumfang von κύριος in dieser Formel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: „Jesus“ gibt den Namen wieder; „Christus“ ist im deutschen Sprachgebrauch die etablierte Wiedergabe des Titels Χριστός und bleibt auch in der formelhaften Verbindung theologisch verständlich.
- source_word: μετὰ πάντων ὑμῶν
  choice: sei mit euch allen
  rationale: μετά mit Genitiv bedeutet „mit“; πάντων ὑμῶν schließt ausdrücklich die gesamte Gemeinde ein. Das im Griechischen unausgesprochene Verb wird für einen natürlichen deutschen Segenswunsch mit „sei“ ergänzt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ im Schlusssegen
  choice: Christus
  alternative: Messias
  rationale: Χριστός ist seinem Ursprung nach ein Titel („der Gesalbte“, „Messias“), erscheint hier jedoch innerhalb der fest geprägten Verbindung „Herr Jesus Christus“. „Christus“ bewahrt die traditionelle und im modernen Deutschen natürliche Form, ohne den Titelcharakter auszuschließen.
- issue: Verbform des Segenswunsches
  choice: sei
  alternative: ist
  rationale: Der griechische Nominalsatz lässt das Verb unausgesprochen. Im Zusammenhang des abschließenden Segens ist der deutsche Optativ „sei“ sachgerecht; eine indikativische Wiedergabe mit „ist“ wäre grammatisch möglich, würde aber den Segenscharakter weniger deutlich ausdrücken.
translation_notes:
  register: Kurzer, feierlicher und zugleich allgemein verständlicher Schlusssegen in modernem Standarddeutsch. Die inklusive Stellung von „allen“ bleibt erhalten; die traditionelle Satzmelodie wird ohne altertümliche Formen bewahrt.
