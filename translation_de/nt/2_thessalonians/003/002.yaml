id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: de
  text: und dass wir von den verkehrten und bösen Menschen gerettet werden; denn nicht alle haben Glauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn nicht alle sind treu.“ Wörtlich lautet das Griechische: „denn nicht aller ist der Glaube.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: wir … gerettet werden
  rationale: Der Aorist Passiv Konjunktiv nach ἵνα bezeichnet das erbetene Ziel. „Gerettet werden“ gibt die Befreiung aus der Gewalt feindseliger Menschen natürlich wieder, ohne die Art der Rettung näher festzulegen.
- source_word: ἀτόπων
  choice: verkehrten
  rationale: ἄτοπος kann „unangebracht“, „widersinnig“ oder „verkehrt“ bedeuten. Im Zusammenhang mit πονηρῶν bezeichnet „verkehrt“ moralisch und im Verhalten fehlgeleitete Gegner, bleibt aber von „böse“ unterscheidbar.
- source_word: πονηρῶν
  choice: bösen
  rationale: Das geläufige moralische Adjektiv wird direkt und verständlich mit „böse“ wiedergegeben.
- source_word: ἀνθρώπων
  choice: Menschen
  rationale: ἄνθρωποι bezeichnet hier feindselige Personen. Das Deutsche „Menschen“ ist die normale, geschlechtsübergreifende Entsprechung und macht keine im griechischen Substantiv nicht ausdrücklich enthaltene Aussage über ihr Geschlecht.
- source_word: πίστις
  choice: Glauben
  rationale: Im unmittelbaren Zusammenhang ist am ehesten gemeint, dass nicht alle Menschen Glauben besitzen. Die mögliche Bedeutung „Treue/Zuverlässigkeit“ wird in einer Fußnote bewahrt.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: denn nicht alle haben Glauben
  rationale: Die wörtlich knappe Wendung „denn nicht aller ist der Glaube“ wird idiomatisch ergänzt, ohne daraus die stärkere Aussage zu machen, der Glaube sei nicht für alle bestimmt.
theological_decisions:
- issue: Bedeutung von πίστις in der elliptischen Schlussklausel
  choice: Glauben
  alternative: Treue beziehungsweise Zuverlässigkeit
  rationale: „Nicht alle haben Glauben“ passt am besten zum Widerstand gegen die apostolische Verkündigung. Da πίστις jedoch auch Treue oder Zuverlässigkeit bezeichnen kann, bleibt diese echte lexikalische Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verkehrt“ wahrt die Eigenbedeutung von ἀτόπων neben „böse“; der Satzbau bleibt nahe am griechischen Gebetsanliegen und zugleich natürlich verständlich.
