id: 2TH.3.14
reference: 2 Thessalonians 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: de
  text: Wenn aber jemand unserem Wort durch diesen Brief[a] nicht gehorcht, dann merkt euch diesen Menschen[b] und habt keinen Umgang mit ihm[c], damit er sich schämt.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Brief“, „mittels dieses Briefes“ oder „in diesem Brief“. Die griechische Wendung kann das Mittel bezeichnen, durch das die Weisung übermittelt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „kennzeichnet ihn“ oder „behaltet ihn im Blick“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „mischt euch nicht mit ihm“; gemeint ist, keinen gemeinschaftlichen Umgang mit ihm zu pflegen.'
    reason: lexical_alternative
  - marker: d
    text: 'Das Ziel ist Korrektur: Vergleiche Vers 15, wo er weiterhin „als Bruder“ zurechtgewiesen werden soll.'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: gehorcht
  rationale: ὑπακούω bezeichnet hier das Befolgen einer verbindlichen apostolischen Weisung. „Gehorchen“ gibt diesen verpflichtenden Charakter klar wieder.
- source_word: τῷ λόγῳ ἡμῶν
  choice: unserem Wort
  rationale: λόγος meint in diesem Zusammenhang die apostolische Botschaft beziehungsweise Weisung. „Unserem Wort“ bewahrt die Ausdrucksweise des Griechischen, ohne sie auf eine einzelne Äußerung einzuengen.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: durch diesen Brief
  rationale: διά mit dem Genitiv bezeichnet hier wahrscheinlich das Mittel, durch das die Weisung vermittelt wird. „Diesen“ ist im Deutschen eine kontextgerechte Verdeutlichung des gegenwärtigen Briefes.
- source_word: τοῦτον σημειοῦσθε
  choice: dann merkt euch diesen Menschen
  rationale: Der Imperativ fordert die Gemeinde auf, die betreffende Person bewusst zu kennzeichnen beziehungsweise im Blick zu behalten. „Merkt euch“ ist gegenwärtiges, verständliches Deutsch und vermeidet eine unnötig technische Färbung.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: habt keinen Umgang mit ihm
  rationale: συναναμίγνυμι bezeichnet das gesellschaftliche Zusammensein oder den Umgang mit jemandem. Die Formulierung wahrt die deutliche Distanzierungsanweisung, ohne eine spätere kirchenrechtliche Kategorie einzutragen.
- source_word: ἐντραπῇ
  choice: damit er sich schämt
  rationale: Das passive Verb kann ausdrücken, dass jemand Scham empfindet oder beschämt wird. Die reflexive deutsche Form gibt das beabsichtigte innere Beschämtsein natürlich wieder, ohne Demütigung als Selbstzweck nahezulegen.
theological_decisions:
- issue: Art der mit μὴ συναναμίγνυσθαι αὐτῷ angeordneten Maßnahme
  choice: Eine deutliche soziale beziehungsweise gemeindliche Distanzierung mit korrigierender Absicht
  alternative: Eine formelle Exkommunikation im stärksten späteren kirchenrechtlichen Sinn oder lediglich unverbindliches privates Meiden
  rationale: Vers 15 verlangt zugleich, den Betreffenden nicht als Feind anzusehen, sondern als Bruder zurechtzuweisen. Daher bleibt die Übersetzung bestimmt, legt aber keine technische Form des Ausschlusses fest.
- issue: Ziel von ἐντραπῇ
  choice: Scham als Anstoß zur Einsicht und Korrektur
  alternative: Öffentliche Demütigung als Selbstzweck
  rationale: Der Zwecksatz und der folgende Vers weisen auf eine korrigierende, nicht auf eine endgültig verurteilende Absicht. „Damit er sich schämt“ erhält den moralischen Ernst und lässt die angestrebte Wirkung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die repräsentative maskuline Rückverweisung des griechischen Textes wird mit „diesen Menschen“ und „ihm“ bewahrt. Die Formulierung bleibt klar und gemeindenah, ohne spätere kirchenrechtliche Fachbegriffe einzutragen.
