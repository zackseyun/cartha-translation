  source_fidelity: 'Der Entwurf gibt die Verneinung und den Kontrast von οὐδὲ ... ἀλλά zutreffend wieder: kein unentgeltlich empfangenes Brot, sondern Arbeit unter Mühe und Anstrengung. „Brot“ bleibt wie im Griechischen konkret; „umsonst“ trifft δωρεάν im hier eindeutigen Sinn „unentgeltlich“. Die Zweckangabe „um keinem von euch zur Last zu fallen“ gibt πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν präzise wieder.'
  naturalness: Modernes, gut verständliches Standarddeutsch. Die Stellung „Auch haben wir“ ist leicht gehoben, aber in einem würdigen Bibelregister natürlich und als Anschluss an den vorigen Vers angemessen. „Tag und Nacht“ ist idiomatisch.
  terminology: „Mühe und Anstrengung“ bewahrt die verstärkende Doppelung von κόπος und μόχθος. „Zur Last fallen“ ist eine natürliche, sachlich offene Wiedergabe des im Kontext materiell verstandenen ἐπιβαρέω. Die Fußnote erläutert die metonymische Tragweite von „Brot“, ohne den Haupttext unnötig zu verallgemeinern.
