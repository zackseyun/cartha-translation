  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: de
  text: Auch haben wir von niemandem Brot umsonst gegessen[a], sondern unter Mühe und Anstrengung Tag und Nacht gearbeitet, um keinem von euch zur Last zu fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch haben wir von niemandem Brot gegessen, ohne dafür zu bezahlen.“ „Brot“ kann hier auch allgemein Nahrung oder materiellen Unterhalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: umsonst
  rationale: Das Adverb bezeichnet hier den unentgeltlichen Empfang. „Umsonst“ ist natürliches, knappes Deutsch und bewahrt den wirtschaftlichen Sinn; die mögliche Bedeutung „vergeblich“ ist im Kontext ausgeschlossen.
- source_word: ἄρτον
  choice: Brot
  rationale: Die konkrete Bedeutung wird beibehalten. „Brot“ kann hier zugleich allgemein für Nahrung oder Lebensunterhalt stehen.
- source_word: παρά τινος
  choice: von niemandem
  rationale: παρά mit Genitiv bezeichnet die Quelle; zusammen mit der Negation und dem indefiniten τις ergibt sich idiomatisch „von niemandem“.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: unter Mühe und Anstrengung
  rationale: Die beiden nah verwandten Begriffe verstärken einander und betonen beschwerliche, kräftezehrende Arbeit. Die Formulierung ist modern und wahrt die kumulative Wirkung.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Tag und Nacht
  rationale: Die Zeitangabe beschreibt ausdauernde Arbeit über den ganzen Tageslauf hinweg. „Tag und Nacht“ ist die natürliche deutsche Wendung, auch wenn die griechische Reihenfolge wörtlich „Nacht und Tag“ lautet.
- source_word: ἐργαζόμενοι
  choice: gearbeitet
  rationale: Das Partizip bezeichnet die konkrete Arbeit, durch die Paulus und seine Mitarbeiter ihren Unterhalt bestritten; im Deutschen wird es natürlich als finites Verb wiedergegeben.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: um ... nicht zur Last zu fallen
  rationale: Die Konstruktion drückt einen Zweck aus. Im Zusammenhang geht es um eine materielle beziehungsweise finanzielle Belastung; „zur Last fallen“ ist idiomatisch und lässt den Umfang der Belastung angemessen offen.
- source_word: τινα ὑμῶν
  choice: keinem von euch
  rationale: Die Verbindung hat distributiven Sinn und wird im Deutschen unter der Negation natürlich mit „keinem von euch“ ausgedrückt.
- source_word: οὐδὲ ... ἀλλ’
  choice: Auch haben wir ... sondern
  rationale: οὐδέ knüpft die weitere Verneinung an den vorausgehenden Zusammenhang an, während ἀλλά den starken Gegensatz zur eigenen Arbeit markiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den Gegensatz zwischen unentgeltlichem Empfang und anstrengender eigener Arbeit, ohne unnötig altertümlich zu klingen.
