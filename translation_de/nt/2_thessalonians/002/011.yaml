  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: de
  text: Und deshalb[a] sendet Gott ihnen eine Kraft der Verführung, sodass sie der Lüge glauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus diesem Grund.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die Wendung verweist begründend auf die zuvor genannte Weigerung, die Wahrheit zu lieben; „deshalb“ gibt den kausalen Zusammenhang knapp und natürlich wieder.
- source_word: πέμπει
  choice: lässt … über sie kommen
  rationale: Das griechische Verb bedeutet wörtlich „sendet“. Die gewählte deutsche Wendung bezeichnet weiterhin Gottes unmittelbares Handeln, klingt mit dem abstrakten Objekt jedoch natürlicher und schwächt es nicht zu bloßem Zulassen ab.
- source_word: ἐνέργειαν πλάνης
  choice: eine Wirkkraft der Verirrung
  rationale: „Wirkkraft“ bewahrt den Gedanken einer wirksamen Tätigkeit oder Kraft; „der Verirrung“ erhält die Genitivstruktur und die Mehrdeutigkeit zwischen irreführender Wirkung und einem wirksamen Verfallen in Irrtum.
- source_word: εἰς τὸ πιστεῦσαι
  choice: sodass sie … glauben
  rationale: Die Konstruktion kann Zweck oder Folge ausdrücken. „Sodass“ hält diese resultativ-final geprägte Beziehung offen, ohne sie unnötig zu präzisieren.
- source_word: τῷ ψεύδει
  choice: der Lüge
  rationale: Der substantivierte Singular mit Artikel bezeichnet hier die bestimmte Lüge beziehungsweise das im Zusammenhang stehende Falsche; „der Lüge glauben“ ist im Deutschen idiomatisch und wahrt diese Bestimmtheit.
theological_decisions:
- issue: Göttliches Handeln beim gerichtlichen Verfallen in Irrtum
  choice: Gott lässt eine Wirkkraft der Verirrung über sie kommen
  alternative: Gott erlaubt lediglich, dass sie irregeführt werden
  rationale: Im Griechischen ist Gott ausdrücklich das Subjekt von „sendet“. Die Formulierung wahrt sein direktes Handeln und damit die Spannung zwischen göttlichem Gericht und der zuvor genannten menschlichen Ablehnung der Wahrheit; sie deutet das Senden nicht zu bloßer Erlaubnis um.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wirkkraft der Verirrung“ ist bewusst etwas markant, um die beiden griechischen Substantive und ihre offene Beziehung sichtbar zu halten; die übrige Syntax ist flüssig und allgemein verständlich.
