source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: de
  text: 'Wir bitten euch aber, Brüder[b], was die Ankunft unseres Herrn Jesus, des Messias[a], und unser Zusammenkommen zu ihm betrifft:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“. Der griechische Titel Χριστός wird hier mit „Messias“ wiedergegeben, um seine Bedeutung sichtbar zu machen.'
    reason: alternative_reading
  - marker: b
    text: „Brüder“ entspricht der Anredeform des Paulus; in diesem Zusammenhang spricht er wahrscheinlich die ganze glaubende Gemeinschaft an.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: wir bitten
  rationale: ἐρωτάω leitet hier eine nachdrückliche, aber nicht befehlende pastorale Bitte ein. „Wir bitten“ gibt diesen Ton im Deutschen natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert den Übergang zu einem neuen, mit dem Vorhergehenden verbundenen Gedanken. Das schwach kontrastierende „aber“ bewahrt diese Verknüpfung.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Anrede wird formnah wiedergegeben; der wahrscheinlich die ganze Gemeinde umfassende Gebrauch wird in einer Fußnote erläutert.
- source_word: ὑπὲρ
  choice: im Blick auf
  rationale: ὑπέρ bezeichnet hier den Gegenstand der Bitte beziehungsweise Erörterung. „Im Blick auf“ ist verständlich und vermeidet die mögliche kausale Bedeutung von „wegen“.
- source_word: παρουσίας
  choice: Ankunft
  rationale: παρουσία bezeichnet in diesem eschatologischen Zusammenhang das künftige Kommen beziehungsweise Eintreffen Jesu. „Ankunft“ wahrt zugleich den Bezug zum Eintreten seiner Gegenwart.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ bewahrt den Autoritätsanspruch und die etablierte neutestamentliche Bedeutung des Titels κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός ist hier als Titel erkennbar. Die appositionale Form „Jesus, des Messias“ macht diese Titelfunktion im Deutschen deutlich, ohne Χριστός zu einem bloßen Namensbestandteil zu machen.
- source_word: ἐπισυναγωγῆς
  choice: Zusammenkommen
  rationale: Das Wort bezeichnet das Zusammengeführtwerden beziehungsweise die gemeinsame Sammlung der Glaubenden. „Zusammenkommen“ ist natürlich und vermeidet institutionelle Nebenbedeutungen von „Versammlung“.
- source_word: ἐπ’ αὐτόν
  choice: bei ihm
  rationale: In Verbindung mit dem Zusammenkommen bezeichnet die Wendung die Ausrichtung auf Christus als Ziel. Das idiomatische „bei ihm“ drückt im Deutschen das Zusammenkommen zu seiner Gegenwart aus.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ im christologischen Titel
  choice: Messias
  alternative: Christus
  rationale: Χριστός hat hier weiterhin erkennbare Titelfunktion. „Messias“ bewahrt die Bedeutung des griechischen Titels; die traditionelle Wiedergabe „Christus“ wird als Alternative vermerkt.
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die maskuline Form des Ausgangstextes bleibt im Haupttext sichtbar. Zugleich erläutert die Fußnote, dass Paulus wahrscheinlich die gesamte glaubende Gemeinschaft anspricht.
- issue: Verhältnis von Ankunft und Zusammenkommen
  choice: Beide Größen bleiben mit „und“ koordiniert
  alternative: unser Zusammenkommen bei seiner Ankunft
  rationale: Der griechische Text verbindet beide Genitive, bestimmt aber ihr genaues zeitliches oder logisches Verhältnis nicht. Die Übersetzung legt deshalb kein bestimmtes endzeitliches Schema fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Blick auf“ und „Zusammenkommen bei ihm“ dienen der natürlichen Verständlichkeit, während die Koordination des griechischen Satzes und seine eschatologische Offenheit erhalten bleiben. Der Doppelpunkt zeigt, dass der Satz im folgenden Vers weitergeführt wird.
