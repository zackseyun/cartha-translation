id: 2TH.2.8
reference: 2 Thessalonians 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: de
  text: Und dann wird der Gesetzlose offenbart werden, den der Herr Jesus mit dem Hauch seines Mundes töten und durch die Erscheinung seiner Ankunft[a] zunichtemachen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Erscheinung seiner Gegenwart“. Das griechische Wort bezeichnet hier gewöhnlich die Ankunft, kann aber auch „Gegenwart“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: wird offenbart werden
  rationale: Bewahrt das Futur Passiv und die für apokalyptische Zusammenhänge geläufige Bedeutung des Sichtbar- bzw. Erkennbarwerdens.
- source_word: ὁ ἄνομος
  choice: der Gesetzlose
  rationale: Gibt das substantivierte Adjektiv knapp wieder, ohne aus dem Kontext die ausdrückliche Bezeichnung „Mensch“ einzutragen.
- source_word: ἀνελεῖ
  choice: töten
  rationale: Bezeichnet hier das Töten; „töten“ ist im heutigen Deutsch klar und gibt die Stärke des Verbs ohne altertümlichen Ton wieder.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: mit dem Hauch seines Mundes
  rationale: πνεῦμα kann „Hauch“ oder „Geist“ bedeuten. In dieser Verbindung und im Anklang an Jesaja 11,4 ist „Hauch“ die natürlichere Wiedergabe.
- source_word: καταργήσει
  choice: zunichtemachen
  rationale: Drückt die entschiedene Aufhebung oder Entmachtung aus, ohne zwingend eine bestimmte Vorstellung vollständiger Vernichtung festzulegen.
- source_word: τῇ ἐπιφανείᾳ
  choice: durch die Erscheinung
  rationale: Gibt die sichtbare Manifestation wieder und bleibt näher am griechischen Substantiv als stärker deutende Alternativen wie „Glanz“.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: seiner Ankunft
  rationale: παρουσία bezeichnet in diesem eschatologischen Zusammenhang gewöhnlich Christi Kommen bzw. Ankunft; die Grundbedeutung „Gegenwart“ bleibt als Alternative vermerkt.
theological_decisions:
- issue: Bezeichnung des endzeitlichen Gegners
  choice: der Gesetzlose
  alternative: der Mensch der Gesetzlosigkeit
  rationale: Der Vers selbst hat nur das substantivierte Adjektiv ὁ ἄνομος. Die gewählte Fassung trägt die ausführlichere Benennung aus dem Kontext nicht in diesen Satz ein.
- issue: Mittel des Sieges des Herrn Jesus
  choice: mit dem Hauch seines Mundes
  alternative: mit dem Geist seines Mundes
  rationale: „Hauch“ entspricht am ehesten der Wendung und ihrem prophetischen Hintergrund; „Geist“ bleibt wegen des Bedeutungsspektrums von πνεῦμα möglich.
- issue: παρουσία als eschatologischer Ausdruck
  choice: Ankunft
  alternative: Gegenwart
  rationale: „Ankunft“ ist im Zusammenhang das natürliche Verständnis, ohne die lexikalisch mögliche Bedeutung „Gegenwart“ zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, ist jedoch natürlich lesbar. „Hauch“ bewahrt die Bildsprache; eine zusätzliche Fußnote dazu ist nicht nötig, da die alternative Bedeutung im Deutschen an dieser Stelle eher irreführen als eine echte kontextuelle Gleichrangigkeit ausdrücken würde.
