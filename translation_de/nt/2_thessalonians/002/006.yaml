base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: de
  text: Und nun wisst ihr, was ihn zurückhält[a], damit er zu seiner Zeit[b] offenbart wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was ihn hemmt“. Der griechische Ausdruck steht im Neutrum und bezeichnet hier nicht näher, welche Macht oder Instanz ihn zurückhält.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu der für ihn bestimmten Zeit“. Das griechische Wort kann eine passende oder festgesetzte Zeit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: was ihn zurückhält
  rationale: Das substantivierte Partizip steht im Neutrum und wird daher unpersönlich wiedergegeben. „Zurückhält“ bewahrt den Sinn des Hemmens, ohne die zurückhaltende Macht näher zu bestimmen; das Objekt „ihn“ ergibt sich aus dem folgenden αὐτόν und dem Zusammenhang.
- source_word: οἴδατε
  choice: wisst ihr
  rationale: Die Perfektform hat hier präsentische Bedeutung. „Wisst ihr“ ist im modernen Deutsch direkt und natürlich und verweist auf die vorausgesetzte Kenntnis der Adressaten.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: damit er … offenbart wird
  rationale: Die Konstruktion aus εἰς und substantiviertem Infinitiv bezeichnet hier Ziel beziehungsweise Folge. Das Passiv „offenbart wird“ wahrt die Form des griechischen Ausdrucks, ohne den Handelnden zu benennen.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: zu seiner eigenen Zeit
  rationale: καιρός bezeichnet einen passenden oder bestimmten Zeitpunkt; ἑαυτοῦ hebt hervor, dass es seine eigene Zeit ist. Die Hauptfassung bleibt nah am Wortlaut und lässt offen, in welchem Sinn diese Zeit bestimmt ist.
- source_word: νῦν
  choice: jetzt
  rationale: Das temporale Adverb wird schlicht und idiomatisch mit „jetzt“ wiedergegeben.
- source_word: αὐτόν
  choice: ihn / er
  rationale: Das maskuline Pronomen verweist auf die zuvor genannte Gestalt. Im deutschen Nebensatz verlangt die Passivkonstruktion den Nominativ „er“; beim idiomatisch ergänzten Objekt von „zurückhält“ erscheint „ihn“.
theological_decisions:
- issue: Identität der zurückhaltenden Macht oder Person
  choice: Der griechische Ausdruck wird neutral mit „was ihn zurückhält“ wiedergegeben, ohne das Zurückhaltende zu identifizieren.
  alternative: Mögliche Deutungen sind die römische Ordnung, der Heilige Geist, eine Engelsmacht oder Gottes Ratschluss beziehungsweise Vorsehung.
  rationale: Der Vers selbst nennt die Identität nicht. Das Neutrum τὸ κατέχον darf deshalb nicht durch eine bestimmte theologische Auslegung ersetzt werden.
- issue: Bedeutung von καιρός im endzeitlichen Zusammenhang
  choice: „zu seiner eigenen Zeit“
  alternative: „zu der für ihn bestimmten Zeit“ oder „zur rechten Zeit“
  rationale: καιρός kann eine bestimmte oder passende Zeit bezeichnen. Die gewählte Fassung bewahrt diese Möglichkeit, legt die Formulierung aber nicht ausdrücklich auf eine von außen festgesetzte Zeit fest.
- issue: Ziel- oder Folgebeziehung von εἰς τὸ ἀποκαλυφθῆναι
  choice: „damit er … offenbart wird“
  alternative: „sodass er … offenbart wird“
  rationale: Die griechische Konstruktion kann Ziel und Ergebnis eng miteinander verbinden. „Damit“ folgt dem naheliegenden Zielgedanken, ohne zu bestimmen, wer die Offenbarung oder das Zurückhalten bewirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt klar und nah am griechischen Text; die unbestimmte Identität des Zurückhaltenden sowie die zeitliche Nuance von καιρός werden nicht konfessionell oder dogmatisch festgelegt.
