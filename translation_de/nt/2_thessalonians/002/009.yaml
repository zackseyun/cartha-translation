  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: de
  text: dessen Kommen gemäß dem Wirken Satans erfolgt, mit aller Macht und Zeichen und Wundern der Lüge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Kommen erfolgt nach dem Wirken Satans, mit aller Macht und Zeichen und Wundern der Lüge.“ „Zeichen und Wunder der Lüge“ kann auch im Sinn von „trügerische Zeichen und Wunder“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: dessen
  rationale: Das Genitiv-Relativpronomen verweist auf den »Gesetzlosen« im vorherigen Vers und verbindet den Satz natürlich mit dessen Kommen.
- source_word: παρουσία
  choice: Kommen
  rationale: Im endzeitlichen Zusammenhang bezeichnet παρουσία das Eintreffen bzw. Auftreten der betreffenden Gestalt; »Kommen« ist idiomatisch und bewahrt den Ankunftsaspekt.
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: dem Wirken Satans entspricht
  rationale: κατά bezeichnet hier Maßgabe oder Übereinstimmung; ἐνέργεια meint wirksame Tätigkeit. Die Formulierung wahrt den engen Zusammenhang mit Satans Wirken, ohne dessen genaue Art weiter festzulegen.
- source_word: ἐν πάσῃ δυνάμει
  choice: mit aller Macht
  rationale: ἐν führt hier die begleitende bzw. wirksame Macht ein. »Macht« vermeidet die vorschnelle Verengung von δύναμις auf einzelne Wunderhandlungen.
- source_word: σημείοις
  choice: Zeichen
  rationale: »Zeichen« ist die übliche und sachlich passende Wiedergabe für außergewöhnliche Taten mit Hinweis- oder Beglaubigungscharakter.
- source_word: τέρασιν
  choice: Wundern
  rationale: »Wunder« gibt die außergewöhnlichen, Staunen hervorrufenden Erscheinungen natürlich wieder und entspricht der geläufigen Verbindung »Zeichen und Wunder«.
- source_word: ψεύδους
  choice: der Lüge
  rationale: Der Genitiv charakterisiert die Zeichen und Wunder, möglicherweise auch die gesamte Dreiergruppe, durch ihre Beziehung zu Lüge und Täuschung. Die substantivische Form bewahrt die griechische Offenheit besser als »falsche Wunder«.
theological_decisions:
- issue: Art der satanischen Machterweise
  choice: Die Machterweise, Zeichen und Wunder werden als von Lüge geprägt bzw. der Lüge zugehörig bezeichnet, ohne zu entscheiden, ob sie bloße Täuschungen oder tatsächlich übernatürliche Vorgänge sind.
  alternative: »trügerische Wunder« oder »falsche Wunder«
  rationale: ψεύδους erklärt nicht abschließend die metaphysische Art der Phänomene. »Wunder der Lüge« wahrt die Spannung zwischen ihrer eindrucksvollen Erscheinung und ihrem täuschenden Charakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »mit« macht die Dreiergruppe verständlich; »geschieht« ergänzt im Deutschen das im griechischen Relativsatz vorausgesetzte Prädikat. Die Fußnote bewahrt die formalere Satzstruktur und die Mehrdeutigkeit von ψεύδους.
