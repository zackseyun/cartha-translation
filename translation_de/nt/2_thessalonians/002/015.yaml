source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: de
  text: Steht also, Brüder[a], fest und haltet an den Überlieferungen fest, die euch gelehrt wurden, sei es mündlich oder durch unseren Brief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“. Im Griechischen steht „Brüder“; wahrscheinlich ist die ganze Gemeinde angesprochen.'
    reason: Lexikalische Alternative und Erläuterung des wahrscheinlich inklusiven Bezugs der maskulinen Anrede.
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Darum also
  rationale: Die Verbindung beider Folgerungspartikeln zieht nachdrücklich die Konsequenz aus dem Vorangehenden; „Darum also“ bewahrt sowohl den Schlusscharakter als auch den Übergang in natürlichem Deutsch.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische Vokativ ist maskulin und bedeutet wörtlich „Brüder“. Im paulinischen Gemeindekontext sind sehr wahrscheinlich Frauen mitgemeint; dies wird in einer Fußnote kenntlich gemacht, ohne die Form des Ausgangstextes im Haupttext zu ersetzen.
- source_word: στήκετε
  choice: steht fest
  rationale: Der Präsensimperativ fordert zu fortdauernder Standhaftigkeit auf. „Steht fest“ ist gegenwärtiges, würdiges Deutsch und erhält das Bild des festen Standes.
- source_word: κρατεῖτε
  choice: haltet … fest
  rationale: Das Verb bezeichnet ein entschiedenes Festhalten oder Bewahren. Die Formulierung erhält die Kraft des Imperativs und entspricht der engen Verbindung mit στήκετε.
- source_word: παραδόσεις
  choice: Überlieferungen
  rationale: παράδοσις bezeichnet das, was weitergegeben oder überliefert wurde. „Überlieferungen“ bildet diesen Vorgang genauer ab als das im Deutschen oft weiter gefasste oder negativ gefärbte „Traditionen“ und passt zur mündlichen wie schriftlichen Weitergabe im Vers.
- source_word: ἐδιδάχθητε
  choice: in denen ihr unterwiesen wurdet
  rationale: Die Passivform stellt die Gemeinde als Empfängerin der Unterweisung dar. Der Relativanschluss bezieht die Überlieferungen idiomatisch auf den Inhalt der empfangenen Unterweisung.
- source_word: διὰ λόγου
  choice: durch ein gesprochenes Wort
  rationale: λόγος steht hier im Gegensatz zum Brief und meint daher mündliche Mitteilung. „Gesprochenes Wort“ macht diesen Gegensatz im Deutschen eindeutig, ohne den Inhalt näher festzulegen.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: durch einen Brief von uns
  rationale: Die Wendung bezeichnet schriftlich übermittelte Unterweisung apostolischer Absender. Der griechische Ausdruck kann im Deutschen natürlich als „einen Brief von uns“ wiedergegeben werden, ohne festzulegen, ob ein bestimmter einzelner Brief oder briefliche Mitteilung allgemein gemeint ist.
theological_decisions:
- issue: παράδοσις in einem später konfessionell umstrittenen Zusammenhang
  choice: Überlieferungen
  alternative: Traditionen; Lehren; Weisungen
  rationale: „Überlieferungen“ bewahrt den Sinn des Weitergegebenen und die ausdrückliche Einbeziehung mündlicher und schriftlicher apostolischer Vermittlung. Die Wiedergabe bestätigt, was der Vers sagt, entscheidet aber nicht über spätere Fragen nach Umfang, Fortbestand oder Autorität kirchlicher Tradition.
- issue: ἀδελφοί als Anrede einer wahrscheinlich gemischten Gemeinde
  choice: Brüder mit erläuternder Fußnote
  alternative: Brüder und Schwestern; Geschwister
  rationale: Die maskuline Form des Griechischen bleibt im Haupttext sichtbar. Zugleich erklärt die Fußnote, dass im damaligen Sprachgebrauch wahrscheinlich die ganze Gemeinde angesprochen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Imperative „steht fest“ und „haltet … fest“ bewahren Nachdruck und Bildsprache. „Überlieferungen“ vermeidet sowohl eine konfessionelle Verengung als auch den Verlust des griechischen Gedankens der Weitergabe.
