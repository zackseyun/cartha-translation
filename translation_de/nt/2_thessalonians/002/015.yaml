  source_fidelity: Die beiden Imperative und die Aussage über mündlich bzw. schriftlich vermittelte Überlieferungen sind grundsätzlich zutreffend wiedergegeben. „Einen Brief von uns“ schwächt jedoch den bestimmten possessiven Bezug von δι’ ἐπιστολῆς ἡμῶν ab; „unseren Brief“ ist genauer. Der Relativsatz sollte die Überlieferungen unmittelbar als das Gelehrte kennzeichnen.
  naturalness: „Darum also“ wirkt im modernen Standarddeutsch doppelt und unidiomatisch. Die Stellung „Steht also, Brüder, fest“ gibt den Schlusscharakter natürlich und nachdrücklich wieder. Die knappe Gegenüberstellung „mündlich oder durch unseren Brief“ ist klar und flüssig.
  terminology: „Überlieferungen“ ist eine sachgerechte, theologisch nicht vereinnahmende Wiedergabe von παραδόσεις. „Brüder“ mit der vorhandenen erläuternden Fußnote wahrt die maskuline Form des griechischen Vokativs und berücksichtigt zugleich den wahrscheinlich umfassenden Gemeindebezug.
