revisions:
- from: Darum also, Brüder[a], steht fest und haltet an den Überlieferungen fest, in denen ihr unterwiesen wurdet, sei es durch ein gesprochenes Wort oder durch einen Brief von uns.
  to: Steht also, Brüder[a], fest und haltet an den Überlieferungen fest, die euch gelehrt wurden, sei es mündlich oder durch unseren Brief.
  rationale: Die Revision ersetzt die unnatürliche Partikelhäufung durch eine im Deutschen idiomatische Schlussfolgerung, stellt den bestimmten Bezug auf „unseren Brief“ wieder her und formuliert den Relativsatz näher am passiven Sinn von ἐδιδάχθητε. „Mündlich“ macht den durch den Gegensatz zum Brief angezeigten Sinn von διὰ λόγου deutlich, ohne den Inhalt über den griechischen Text hinaus zu präzisieren.
