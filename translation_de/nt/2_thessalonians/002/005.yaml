lexical_decisions:
- source_word: μνημονεύετε
  choice: erinnert ihr euch
  rationale: Das Verb bezeichnet das Erinnern an eine frühere Unterweisung; die rhetorische Frage wird im modernen Deutschen natürlich mit „Erinnert ihr euch nicht …?“ wiedergegeben.
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: als ich noch bei euch war
  rationale: ἔτι markiert die damals fortdauernde persönliche Anwesenheit; die temporale Partizipialkonstruktion wird idiomatisch mit einem Nebensatz wiedergegeben.
- source_word: ταῦτα
  choice: dies
  rationale: Das griechische Neutrum Plural verweist zusammenfassend auf die zuvor behandelten Sachverhalte. Im Deutschen ist das singularische Sammelpronomen „dies“ hier natürlicher als „diese Dinge“.
- source_word: ἔλεγον
  choice: immer wieder sagte
  rationale: Der Imperfekt beschreibt eine fortgesetzte oder wiederholte Unterweisung in der Vergangenheit. „Immer wieder sagte“ bringt diesen Aspekt klar und natürlich zum Ausdruck.
- source_word: οὐ ... ὅτι
  choice: Erinnert ihr euch nicht daran, dass …?
  rationale: ὅτι leitet den Inhalt der Erinnerung ein; im Deutschen verlangt „sich erinnern“ in dieser Konstruktion idiomatisch „daran, dass“.
