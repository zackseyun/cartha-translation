  naturalness: Modernes Standarddeutsch und ein angemessen würdevoller Register sind gegeben. Die Umstellung zu »angeblich von uns« nach der gesamten Reihe und »mit der Behauptung« ist natürlicher und beseitigt die syntaktische Einschränkung.
