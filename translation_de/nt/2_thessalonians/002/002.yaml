source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: de
  text: dass ihr euch nicht so schnell aus der Fassung bringen oder beunruhigen lasst – weder durch einen Geist[a] noch durch eine Botschaft noch durch einen Brief, angeblich von uns –, mit der Behauptung, der Tag des Herrn sei schon da[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine geistgewirkte Äußerung« oder »eine prophetische Offenbarung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gekommen ist« oder »gegenwärtig ist«. Das griechische Perfekt kann die Behauptung ausdrücken, der Tag des Herrn sei bereits eingetreten und jetzt gegenwärtig.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: so schnell
  rationale: Das Adverb bezeichnet hier, wie rasch die Adressaten erschüttert oder beunruhigt werden könnten; »so schnell« ist im Deutschen natürlich und bewahrt den warnenden Ton.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: euch aus der Fassung bringen lasst
  rationale: Wörtlich geht es um ein Wegerschüttertwerden vom νοῦς. Die idiomatische deutsche Wendung bewahrt das Bild innerer Erschütterung und bezeichnet einen Verlust gefestigter Besonnenheit, ohne den Ausdruck auf bloßes Denken zu verengen.
- source_word: θροεῖσθαι
  choice: beunruhigen lasst
  rationale: Das Verb bezeichnet ein Erschrecken oder alarmiertes Aufgewühltwerden. »Beunruhigen« gibt die emotionale Wirkung natürlich wieder, ohne sie zu übersteigern.
- source_word: πνεύματος
  choice: einen Geist
  rationale: Die wörtliche Wiedergabe hält offen, ob ein Geist, eine geistgewirkte Äußerung oder eine beanspruchte Offenbarung gemeint ist; die kontextuell naheliegende Alternative wird in der Fußnote genannt.
- source_word: λόγου
  choice: eine Botschaft
  rationale: Im Gegensatz zum Brief ist wahrscheinlich eine mündliche Mitteilung oder Lehre gemeint. »Botschaft« vermittelt diesen Sinn klarer als das isolierte »Wort«.
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: einen Brief, der angeblich von uns stammt
  rationale: Die Formulierung macht die behauptete, aber fragliche Zuschreibung an Paulus und seine Mitarbeiter in natürlichem Deutsch deutlich.
- source_word: ὡς ὅτι
  choice: als sei
  rationale: Die Wendung leitet den behaupteten Inhalt ein. »Als sei« ist knapp, idiomatisch und lässt erkennen, dass Paulus diese Behauptung zurückweist.
- source_word: ἐνέστηκεν
  choice: schon da
  rationale: 'Das Perfekt beschreibt den behaupteten gegenwärtigen Zustand infolge eines Eintretens: Der Tag sei bereits gekommen und nun gegenwärtig. »Schon da« bringt diese eschatologisch wichtige Aussage klar zum Ausdruck.'
- source_word: ἡμέρα τοῦ κυρίου
  choice: der Tag des Herrn
  rationale: Dies ist die etablierte eschatologische Bezeichnung und meint keinen wöchentlichen Gottesdiensttag.
theological_decisions:
- issue: Bedeutung von ἐνέστηκεν in der eschatologischen Behauptung
  choice: schon da
  alternative: ist gekommen; ist gegenwärtig
  rationale: Das griechische Perfekt kann sowohl das erfolgte Eintreten als auch den daraus bestehenden gegenwärtigen Zustand hervorheben. Der Haupttext verbindet beides idiomatisch; die Fußnote bewahrt die formnäheren Alternativen.
- issue: Sinn von πνεύματος innerhalb der Reihe möglicher Mitteilungsquellen
  choice: einen Geist
  alternative: eine geistgewirkte Äußerung; eine prophetische Offenbarung
  rationale: Der artikellose Ausdruck muss nicht ausdrücklich den Heiligen Geist bezeichnen. Die wörtliche Haupttextfassung erhält die Mehrdeutigkeit, während die Fußnote die im Kontext plausible kommunikative Bedeutung erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Aus der Fassung bringen« gibt die griechische Verbindung idiomatisch wieder, während »einen Geist« und die Fußnoten die genuine semantische und theologische Offenheit bewahren. Die Gedankenstriche gliedern die dreifache Quellenangabe, ohne den Satz unnötig zu vereinfachen.
