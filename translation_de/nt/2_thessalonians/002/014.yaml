source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: de
  text: 'Dazu hat er euch durch unser Evangelium berufen: zur Erlangung der Herrlichkeit unseres Herrn Jesus, des Messias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Erwerb“ bzw. „zum Besitz der Herrlichkeit unseres Herrn Jesus, des Messias“. Traditionell: „unseres Herrn Jesus Christus“.'
    reason: Lexikalische Alternativen für περιποίησις und traditionelle Wiedergabe von Χριστός.
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dazu
  rationale: Die Wendung verweist auf das zuvor genannte Heil und die Heiligung und bezeichnet zugleich Ziel beziehungsweise Zweck. „Dazu“ ist im Deutschen natürlich, ohne den Bezug enger festzulegen.
- source_word: ἐκάλεσεν
  choice: hat er euch berufen
  rationale: „Berufen“ gibt den paulinischen Gebrauch von καλέω im Zusammenhang mit Gottes Heilsruf angemessen wieder, ohne dessen Wirkweise dogmatisch näher zu bestimmen.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: durch unser Evangelium
  rationale: διά mit Genitiv bezeichnet das Mittel. „Unser Evangelium“ bewahrt die knappe paulinische Ausdrucksweise und meint die von den Aposteln verkündete Heilsbotschaft, nicht ein ihnen gehörendes anderes Evangelium.
- source_word: εἰς περιποίησιν δόξης
  choice: damit ihr an der Herrlichkeit … Anteil bekommt
  rationale: περιποίησις kann Erlangung, Gewinn oder Besitz bezeichnen. Die idiomatische Formulierung „Anteil bekommt“ wahrt die Zielrichtung und bringt verständlich zum Ausdruck, dass die Glaubenden die Herrlichkeit erlangen beziehungsweise an ihr teilhaben, ohne die lexikalische Mehrdeutigkeit unnötig zu verengen.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: „Herr“ ist die etablierte und kontextgemäße Wiedergabe von κύριος und bewahrt den christologischen Titel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός ist hier nach „unseres Herrn Jesus“ weiterhin als Titel verständlich. Die Apposition „des Messias“ ist idiomatisches Deutsch und macht den Titelcharakter sichtbar.
theological_decisions:
- issue: Wesen des göttlichen Rufes
  choice: „hat er euch berufen“ ohne dogmatische Erweiterung
  alternative: „hat er euch wirksam berufen“ oder „hat er euch eingeladen“
  rationale: Der Text nennt Gottes Ruf durch das Evangelium, erklärt aber an dieser Stelle nicht dessen genaue Wirkweise. Die Übersetzung darf weder eine bestimmte Gnadenlehre eintragen noch den heilsgeschichtlichen Gehalt auf eine bloße Einladung reduzieren.
- issue: Bedeutung von περιποίησις mit δόξης
  choice: Teilhabe beziehungsweise Erlangung der Herrlichkeit
  alternative: Besitz oder Erwerb der Herrlichkeit
  rationale: Die griechische Wendung lässt Nuancen von Erlangung, Besitz und Teilhabe zu. „Anteil bekommt“ ist verständlich und hält diese Aspekte zusammen; eine Fußnote weist auf die enger formalen Möglichkeiten hin.
- issue: Wiedergabe von Χριστοῦ
  choice: „des Messias“ im Haupttext
  alternative: „Christus“
  rationale: Hier ist der Titel semantisch erkennbar. Die traditionelle Wiedergabe „Christus“ bleibt als Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dazu“ schafft einen natürlichen Rückbezug auf Vers 13; „Anteil bekommt“ vermeidet schwerfällige Nominalformulierungen. Die Apposition „Jesus, des Messias“ kennzeichnet Χριστός klar als Titel.
