review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Satzbau, den Kontrast von δέ, die Danksagung, die Erwählung als ἀπαρχή sowie die Zielangabe εἰς σωτηρίαν insgesamt zuverlässig wieder. Die beiden mit ἐν verbundenen Ausdrücke sollten jedoch im Deutschen parallel markiert werden. Die Fassung „durch die Heiligung des Geistes und den Glauben“ lässt die zweite Präposition lediglich elliptisch stehen und schwächt die sichtbare Koordination der griechischen Dative.
  naturalness: „Vom Herrn geliebte Brüder“ ist verständlich, wirkt als eingeschobene Anrede jedoch etwas gedrängt. „Brüder, die vom Herrn geliebt sind“ ist im heutigen Standarddeutsch klarer und bewahrt die passive Aussage. Die parallele Wiederholung von „durch“ ergibt zudem einen flüssigen, eindeutig gegliederten Satz.
  terminology: „Erwählt“, „Erstlingsgabe“, „Heil“ und „Wahrheit“ sind sachgerecht. „Geist“ bleibt im deutschen Haupttext hinsichtlich der Referenz offen; die Fußnote benennt die kontextuell naheliegende Deutung als Heiliger Geist, ohne die Alternative auszuschließen. Die Textvariantenfußnote ist korrekt am Ausdruck „Erstlingsgabe“ verankert.
  issues:
  - severity: low
    issue: Die Präposition bei der zweiten koordinierten Wendung fehlt im deutschen Text.
    rationale: καὶ πίστει ἀληθείας ist mit ἐν ἁγιασμῷ πνεύματος koordiniert. Die Wiederholung von „durch“ macht im Deutschen klar, dass auch der Glaube an die Wahrheit zur präpositionalen Aussage gehört.
  - severity: low
