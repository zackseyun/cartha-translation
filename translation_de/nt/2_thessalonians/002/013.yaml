  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: de
  text: Wir aber sind verpflichtet, Gott allezeit für euch zu danken, Brüder, die vom Herrn geliebt sind[a], weil Gott euch als Erstlingsgabe zum Heil erwählt hat[b] – durch die Heiligung des Geistes[c] und durch den Glauben an die Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ gibt die maskuline Pluralform ἀδελφοί wieder; die Anrede kann die gesamte glaubende Gemeinschaft einschließlich der Frauen umfassen.
    reason: cultural_note
  - marker: b
    text: 'Einige Handschriften lesen statt „als Erstlingsgabe“: „von Anfang an zum Heil erwählt“. Der Haupttext folgt ἀπαρχήν („Erstlingsgabe“); die Variante lautet ἀπ’ ἀρχῆς („von Anfang an“).'
    reason: textual_variant
  - marker: c
    text: 'Oder: „durch die Heiligung des menschlichen Geistes“. Im Zusammenhang ist wahrscheinlich der Heilige Geist gemeint.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Wir aber
  rationale: Das betonte Pronomen und δέ markieren den Gegensatz zur vorausgehenden Beschreibung der Verlorengehenden.
- source_word: ὀφείλομεν
  choice: sind verpflichtet
  rationale: Gibt die moralische Verpflichtung deutlich wieder und bleibt im heutigen Deutsch natürlich und würdig.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: Gott allezeit für euch zu danken
  rationale: Entspricht der paulinischen Dankformel und bewahrt sowohl πάντοτε als auch den Bezug auf die Adressaten.
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: vom Herrn geliebte Brüder
  rationale: Gibt das maskuline ἀδελφοί formal wieder und übersetzt das passive Partizip samt Urheberangabe natürlich.
- source_word: εἵλατο ὑμᾶς ὁ θεὸς
  choice: Gott euch … erwählt hat
  rationale: Erwählen ist im biblischen Register idiomatisch und gibt den Sinn von αἱρέομαι wieder, ohne eine bestimmte Lehrtradition hinzuzufügen.
- source_word: ἀπαρχὴν
  choice: als Erstlingsgabe
  rationale: Folgt der gedruckten SBLGNT-Lesart und erhält das Bild einer ersten, Gott zugehörigen Gabe; die bedeutende Variante wird in einer Fußnote genannt.
- source_word: εἰς σωτηρίαν
  choice: zum Heil
  rationale: Drückt Zielrichtung beziehungsweise Ergebnis knapp und in würdigem modernem Deutsch aus.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: durch die Heiligung des Geistes
  rationale: Durch gibt den instrumentalen Sinn von ἐν wieder; der Genitiv bleibt im Text formal offen, während die Großschreibung die kontextuell wahrscheinliche Deutung als Heiliger Geist signalisiert.
- source_word: καὶ πίστει ἀληθείας
  choice: und den Glauben an die Wahrheit
  rationale: Deutet den Genitiv sachgerecht als Objekt des Glaubens und entspricht natürlichem Deutsch.
theological_decisions:
- issue: Bezug von πνεύματος in ἐν ἁγιασμῷ πνεύματος
  choice: Geist im Sinn des Heiligen Geistes
  alternative: menschlicher Geist beziehungsweise geistliche Heiligung
  rationale: Der soteriologische Zusammenhang spricht am ehesten für das Wirken des Heiligen Geistes. Da der griechische Genitiv für sich genommen nicht völlig eindeutig ist, wird die Alternative in einer Fußnote offengehalten.
- issue: Aussage von εἵλατο ὑμᾶς ὁ θεὸς
  choice: Gott hat euch erwählt
  alternative: Gott hat euch ausgewählt beziehungsweise für sich genommen
  rationale: Die Übersetzung gibt die göttliche Wahl direkt wieder, ohne deren systematisch-theologische Reichweite über den Wortlaut hinaus festzulegen.
- issue: Textvariante ἀπαρχὴν gegenüber ἀπ’ ἀρχῆς
  choice: als Erstlingsgabe
  alternative: von Anfang an
  rationale: Der Haupttext folgt der vorgegebenen SBLGNT-Lesart ἀπαρχήν; die gut bezeugte alternative Lesart wird transparent dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Allezeit“, „Erstlingsgabe“ und „zum Heil“ bewahren die gehobene Prägung, ohne altertümliche Syntax zu verwenden. Der Gedankenstrich verdeutlicht, dass die abschließenden Wendungen die Weise beziehungsweise Mittel des Erwählens zum Heil angeben.
