  to: Wir aber sind verpflichtet, Gott allezeit für euch zu danken, Brüder, die vom Herrn geliebt sind[a], weil Gott euch als Erstlingsgabe zum Heil erwählt hat[b] – durch die Heiligung des Geistes[c] und durch den Glauben an die Wahrheit.
  rationale: Die Revision verbessert die deutsche Satzgliederung und stellt die parallele Beziehung der beiden durch ἐν bestimmten Ausdrücke ausdrücklich dar. Sie verändert weder die SBLGNT-Lesart noch die dokumentierte Variante und wahrt bei πνεύματος die im Griechischen bestehende Deutungsoffenheit.
