source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: de
  text: damit alle gerichtet werden, die der Wahrheit nicht geglaubt, sondern Gefallen an der Ungerechtigkeit gefunden haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verurteilt werden«. Das griechische Verb kann in diesem Zusammenhang ein verurteilendes Urteil meinen, bedeutet aber zunächst »gerichtet werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet in Verbindung mit dem vorhergehenden Zusammenhang einen Zweck oder eine Folge ein, ohne diese Nuance unnötig festzulegen.
- source_word: κριθῶσιν
  choice: gerichtet werden
  rationale: Gibt den passiven Konjunktiv von κρίνω seinem Grundsinn nach wieder. Der Zusammenhang legt ein negatives Urteil nahe, doch die Übersetzung lässt dies kontextuell erschließen.
- source_word: πάντες
  choice: alle
  rationale: Direkte und natürliche Wiedergabe des umfassenden Plurals.
- source_word: οἱ μὴ πιστεύσαντες
  choice: die … nicht geglaubt … haben
  rationale: Das substantivierte Aoristpartizip bezeichnet diejenigen, die nicht glaubten; im Deutschen schließt der Relativsatz flüssig an »alle« an.
- source_word: τῇ ἀληθείᾳ
  choice: der Wahrheit
  rationale: Der Dativ bei πιστεύω wird im Deutschen idiomatisch mit »jemandem/einer Sache glauben« wiedergegeben; der Artikel weist auf die bestimmte Wahrheit, im Kontext die Wahrheit der Botschaft.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung bringt »sondern« den starken Gegensatz im Deutschen genauer und natürlicher zum Ausdruck als »aber«.
- source_word: εὐδοκήσαντες
  choice: Gefallen … gefunden haben
  rationale: Erfasst sowohl die zustimmende als auch die lustbetonte Haltung von εὐδοκέω und wahrt den Parallelismus der beiden Aoristpartizipien.
- source_word: τῇ ἀδικίᾳ
  choice: an der Ungerechtigkeit
  rationale: »Ungerechtigkeit« bewahrt den breiten moralisch-theologischen Sinn von ἀδικία; die Verbindung mit »Gefallen finden an« ist idiomatisch.
theological_decisions:
- issue: Ob κριθῶσιν als »gerichtet« oder ausdrücklich als »verurteilt« wiederzugeben ist
  choice: gerichtet werden
  alternative: verurteilt werden
  rationale: Obwohl der Zusammenhang klar ein nachteiliges Urteil erwarten lässt, bezeichnet κρίνω zunächst das Richten. Die Hauptübersetzung bewahrt diese lexikalische Offenheit und erläutert die stärkere kontextuelle Möglichkeit in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gegensatz zwischen dem Nichtglauben an die Wahrheit und dem Gefallen an der Ungerechtigkeit; das Perfekt klingt im heutigen Deutsch natürlicher als ein Präteritum der Partizipialhandlungen.
