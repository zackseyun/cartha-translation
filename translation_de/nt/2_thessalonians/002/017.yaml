source:
  edition: SBLGNT
  text: παρακαλέσαι ὑμῶν τὰς καρδίας καὶ ⸀στηρίξαι ἐν παντὶ ⸂ἔργῳ καὶ λόγῳ⸃ ἀγαθῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: de
  text: Er ermutige[a] eure Herzen und stärke[b] sie in jedem guten Werk und Wort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »tröste« oder »ermahne«; das griechische Verb kann je nach Zusammenhang alle drei Bedeutungsnuancen tragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »festige« oder »mache fest«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: ermutige
  rationale: Das Verb kann je nach Zusammenhang »ermutigen«, »trösten« oder »ermahnen« bedeuten. Im Anschluss an den »ewigen Trost/ewige Ermutigung« in Vers 16 wahrt »ermutigen« die breite Bedeutung, ohne sie auf Trost oder Mahnung zu verengen.
- source_word: καρδίας
  choice: Herzen
  rationale: »Herzen« bewahrt das biblische Bild für das innere Denken, Wollen und Empfinden des Menschen, statt es auf Gefühle oder Verstand zu reduzieren.
- source_word: στηρίξαι
  choice: stärke
  rationale: Das Verb bezeichnet das Festmachen oder Festigen. »Stärke« ist im heutigen Deutsch natürlich und drückt aus, dass die Herzen zu beständigem guten Handeln und Reden gefestigt werden sollen.
- source_word: ἐν παντὶ
  choice: in jedem
  rationale: Die Wendung bezeichnet hier den Bereich, in dem die Stärkung wirksam werden soll; »in jedem« gibt die Präposition und den distributiven Singular angemessen wieder.
- source_word: ἔργῳ
  choice: Werk
  rationale: ἔργον bezeichnet ein Werk, eine Tat oder Handlung. »Werk« bildet mit »Wort« eine knappe, würdige Paarung und bewahrt den Singular nach παντί.
- source_word: λόγῳ
  choice: Wort
  rationale: λόγος bezeichnet hier im Parallelismus mit »Werk« am ehesten das gesprochene Wort beziehungsweise Reden. »Wort« erhält die prägnante Form des griechischen Ausdrucks.
- source_word: ἀγαθῷ
  choice: guten
  rationale: Das Adjektiv bezieht sich sinngemäß auf »Werk« und »Wort« und wird mit dem direkten, umfassenden Ausdruck »gut« wiedergegeben.
- source_word: ὑμῶν
  choice: eure
  rationale: 'Der Genitiv Plural gehört zu »Herzen«: »eure Herzen«.'
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet sowohl die beiden Gebetswünsche als auch die Substantive »Werk« und »Wort«.
theological_decisions:
- issue: Deutung von καρδία als psychologischer Fachbegriff
  choice: Herzen
  alternative: Innerstes; Sinn
  rationale: Die biblische Metapher bleibt erhalten und wird nicht auf eine einzelne moderne Kategorie wie Gefühl oder Verstand eingeengt.
- issue: Wiedergabe von στηρίξαι
  choice: stärke
  alternative: festige; mache fest
  rationale: »Stärke« ist natürliches modernes Deutsch und bewahrt den Gedanken, standhaft und fest gemacht zu werden, ohne eine besondere dogmatische Deutung einzutragen.
- issue: Ergänzung des im griechischen Satz vorausgesetzten Subjekts
  choice: Er
  alternative: Keine ausdrückliche Ergänzung im isolierten Versfragment
  rationale: Die finite deutsche Wunschform benötigt in dieser eigenständig dargestellten Verszeile ein Subjekt. »Er« greift knapp das Subjekt des vorausgehenden Verses auf, ohne dessen Benennung hier zu wiederholen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Paarung »Werk und Wort« folgt der im angegebenen SBLGNT-Text gebotenen Reihenfolge. Die Konjunktiv-I-Formen geben den Gebetswunsch des griechischen Aorist-Optativs wieder.
