id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: de
  text: Er selbst aber, unser Herr Jesus, der Messias, und Gott, unser Vater, der uns geliebt und uns durch Gnade ewigen Trost[a] und gute Hoffnung geschenkt hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ewige Ermutigung“ beziehungsweise „ewigen Zuspruch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: Er selbst
  rationale: Die intensive Verwendung von αὐτός hebt das persönliche Handeln des im Segenswunsch genannten Subjekts hervor; „Er selbst“ bewahrt diese Betonung.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet einen milden Übergang. „Aber“ gibt den Anschluss knapp wieder, ohne einen starken Gegensatz zu erzwingen.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die übliche und sachgerechte Wiedergabe des christologischen Titels κύριος.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Χριστός bezeichnet hier den messianischen Titel; die Formulierung mit Artikel ist im Deutschen natürlich und semantisch transparent.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Gott, unser Vater
  rationale: Die Apposition wird im Deutschen mit Kommas klar und natürlich wiedergegeben, wobei sowohl θεός als auch πατήρ erhalten bleiben.
- source_word: ὁ ἀγαπήσας
  choice: der uns geliebt hat
  rationale: Das substantivierte Aoristpartizip wird idiomatisch als Relativsatz wiedergegeben; das Perfekt bezeichnet im Deutschen passend die vollzogene, weiterhin bedeutsame Handlung.
- source_word: δοὺς
  choice: geschenkt hat
  rationale: Das koordinierte Aoristpartizip wird parallel zum ersten Partizip wiedergegeben; „geschenkt“ bringt den unverdienten Gabecharakter natürlich zum Ausdruck.
- source_word: παράκλησιν
  choice: Trost
  rationale: παράκλησις kann Trost, Ermutigung oder Zuspruch bedeuten. „Trost“ ist in diesem Gebets- und Hoffnungskontext natürlich; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: αἰωνίαν
  choice: ewigen
  rationale: „Ewig“ ist die gewöhnliche Wiedergabe von αἰώνιος und bezeichnet hier die bleibende Dauer des Trostes.
- source_word: ἐλπίδα ἀγαθὴν
  choice: gute Hoffnung
  rationale: Die knappe Form erhält die qualitative Aussage des anarthrischen griechischen Ausdrucks.
- source_word: ἐν χάριτι
  choice: durch Gnade
  rationale: 'ἐν ist hier plausibel instrumental beziehungsweise kausal: Trost und Hoffnung werden aufgrund beziehungsweise mittels der Gnade gegeben.'
theological_decisions:
- issue: Bezug der singularischen Partizipien auf die verbundenen Subjekte „unser Herr Jesus, der Messias“ und „Gott, unser Vater“
  choice: Die singularische Relativkonstruktion wird mit „der“ bewahrt, ohne ihren Bezug ausdrücklich auf beide Personen auszudehnen oder ausschließlich auf den Vater festzulegen.
  alternative: Den Relativsatz eindeutig nur auf Gott, den Vater, beziehen oder ihn ausdrücklich auf beide genannten Personen beziehen.
  rationale: Der griechische Text verbindet zwei Subjekte und lässt darauf singularische Partizipien folgen. Eine formal nahe Wiedergabe wahrt diese syntaktische und theologische Spannung, statt sie interpretierend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Form ist als Satzanfang des bis Vers 17 reichenden Segenswunsches bewusst unvollständig und endet daher mit einem Komma. Der Marker [a] steht unmittelbar bei dem mehrdeutigen Ausdruck.
