  naturalness: „Niemand soll euch auf irgendeine Weise täuschen“ ist verständlich, klingt als direkte Wiedergabe des prohibitivischen Konjunktivs jedoch weniger idiomatisch und weniger eindringlich als „Lasst euch von niemandem in irgendeiner Weise täuschen“. „Jener Tag wird nicht kommen“ ist in diesem vorausweisenden Zusammenhang natürlich.
  terminology: „Rebellion“ bewahrt die breite Bedeutung von ἀποστασία besser als „Aufstand“, ohne sie auf religiösen Abfall festzulegen. Die Fußnote hält „Abfall“ und „Abtrünnigkeit“ als mögliche, enger religiöse Wiedergaben fest. „der Mensch der Gesetzlosigkeit“ und „der Sohn des Verderbens“ sind quellentreu; die Variantenfußnote ist korrekt am Ausdruck „Gesetzlosigkeit“ verankert.
