revisions:
- from: Niemand soll euch auf irgendeine Weise täuschen. Denn dieser Tag kommt nicht, es sei denn, zuerst kommt der Aufstand[a] und der Mensch der Gesetzlosigkeit[b] wird offenbart, der Sohn des Verderbens.
  to: Lasst euch von niemandem in irgendeiner Weise täuschen. Denn jener Tag wird nicht kommen, es sei denn, dass zuerst die Rebellion[a] kommt und der Mensch der Gesetzlosigkeit[b] offenbart wird, der Sohn des Verderbens.
  rationale: Die Überarbeitung verbessert die idiomatische Kraft des Verbots und ersetzt die potenziell zu eng politische Wiedergabe „Aufstand“ durch „Rebellion“. Sie bewahrt damit die vom griechischen ἀποστασία und vom englischen Audit Trail vorgesehene Bedeutungsweite. Die Ellipse zum zuvor genannten Tag bleibt transparent ergänzt; die textkritische Fußnote und ihre Verankerung bleiben erhalten.
