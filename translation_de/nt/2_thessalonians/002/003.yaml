source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: de
  text: Lasst euch von niemandem in irgendeiner Weise täuschen. Denn jener Tag wird nicht kommen, es sei denn, dass zuerst die Rebellion[a] kommt und der Mensch der Gesetzlosigkeit[b] offenbart wird, der Sohn des Verderbens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Abfall“ beziehungsweise „die Abtrünnigkeit“. Das griechische Wort kann eine entschiedene Auflehnung bezeichnen und wird oft als religiöser Abfall verstanden.'
    reason: alternative_reading
  - marker: b
    text: Einige Handschriften lesen „der Mensch der Sünde“ statt „der Mensch der Gesetzlosigkeit“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: täuschen
  rationale: Das Verb bezeichnet ein Täuschen oder Irreführen. „Täuschen“ ist im Warnzusammenhang natürlich und gibt die mögliche Verstärkung durch die Vorsilbe nicht überzogen wieder.
- source_word: κατὰ μηδένα τρόπον
  choice: auf irgendeine Weise
  rationale: Die Wendung verstärkt die Warnung und schließt jede Art der Täuschung ein.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier die Begründung der vorangehenden Warnung ein. „Denn“ bildet diesen Zusammenhang in gehobenem, aber aktuellem Deutsch klar ab.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: dieser Tag kommt nicht, es sei denn, ... kommt
  rationale: Das im Griechischen ausgelassene Subjekt wird aus Vers 2 ergänzt. Die Konstruktion bezeichnet notwendige Ereignisse, die diesem Tag vorausgehen müssen.
- source_word: ἀποστασία
  choice: der Aufstand
  rationale: Das Wort kann Aufstand, Abfall oder Abtrünnigkeit bezeichnen. „Aufstand“ bewahrt den breiten Gedanken einer entschiedenen Auflehnung, ohne den Ausdruck vorschnell ausschließlich als religiösen Abfall festzulegen; „Abfall“ wird in einer Fußnote genannt.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das Adverb bezeichnet eine zeitliche Reihenfolge und wird direkt wiedergegeben.
- source_word: ἀποκαλυφθῇ
  choice: wird offenbart
  rationale: Die Passivform besagt, dass diese Gestalt sichtbar beziehungsweise bekannt gemacht wird. „Offenbart“ bewahrt zugleich den apokalyptischen Klang des Verbs.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: der Mensch der Gesetzlosigkeit
  rationale: Die SBLGNT-Lesart ἀνομίας wird unmittelbar mit „Gesetzlosigkeit“ wiedergegeben. „Mensch“ entspricht dem bestimmten maskulinen Singular und bezeichnet hier eine konkrete Gestalt.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: der Sohn des Verderbens
  rationale: Die semitisch geprägte Wendung kann jemanden bezeichnen, der vom Verderben gekennzeichnet oder ihm bestimmt ist. Die formnahe Wiedergabe lässt diese Bedeutungsweite bestehen.
theological_decisions:
- issue: Ergänzung des unausgesprochenen Subjekts bei „kommt nicht“
  choice: „dieser Tag“ wird aus dem unmittelbaren Zusammenhang von Vers 2 ausdrücklich ergänzt
  alternative: 'Die Ellipse stehen lassen: „Denn wenn nicht zuerst der Aufstand kommt ...“'
  rationale: Im Griechischen ergibt sich der Bezug auf den Tag des Herrn aus dem vorherigen Vers. Im Deutschen verhindert die Ergänzung eine unvollständige oder missverständliche Konstruktion, ohne über den unmittelbaren Kontext hinauszugehen.
- issue: Bedeutung von ἀποστασία
  choice: die breitere Wiedergabe „der Aufstand“
  alternative: „der Abfall“ oder „die Abtrünnigkeit“
  rationale: Der Ausdruck kann sowohl allgemeine Auflehnung als auch religiösen Abfall bezeichnen. Der Haupttext legt die umstrittene endzeitliche Deutung nicht enger fest, während die Fußnote die wichtige Alternative dokumentiert.
- issue: Textlesart bei τῆς ἀνομίας
  choice: 'Der SBLGNT-Lesart folgend: „der Gesetzlosigkeit“'
  alternative: „der Sünde“ nach einer bekannten Handschriftenvariante
  rationale: Der vorgegebene Ausgangstext liest ἀνομίας. Die vertraute Variante ἁμαρτίας wird aus textkritischer Transparenz in einer Fußnote vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem Gedankengang des griechischen Textes nahe, wird aber durch die Ergänzung „dieser Tag“ idiomatisch verständlich. „Sohn des Verderbens“ bewahrt bewusst die bildhafte semitische Ausdrucksweise.
