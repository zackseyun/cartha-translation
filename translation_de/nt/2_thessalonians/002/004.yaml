id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: de
  text: der sich widersetzt und sich über alles erhebt, was Gott oder Gegenstand der Verehrung genannt wird, sodass er im Tempel Gottes[a] Platz nimmt und sich als Gott[b] darstellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Heiligtum Gottes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »als ein Gott«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: der sich widersetzt
  rationale: Das substantivierte Präsenspartizip bezeichnet denjenigen in seiner fortdauernden Gegnerschaft, ohne daraus einen im Griechischen nicht ausdrücklich gesetzten Titel zu machen.
- source_word: ὑπεραιρόμενος ἐπὶ πάντα
  choice: sich über alles erhebt
  rationale: Die Form bezeichnet Selbsterhöhung; die Verbindung mit ἐπί und Akkusativ drückt hier Überordnung aus.
- source_word: πάντα λεγόμενον θεὸν
  choice: alles, was Gott … genannt wird
  rationale: Die Formulierung gibt λεγόμενον wieder, ohne die Göttlichkeit des so Bezeichneten zu bestätigen. Der Singular θεόν wird im Deutschen innerhalb der umfassenden Wendung natürlich wiedergegeben.
- source_word: σέβασμα
  choice: Gegenstand der Verehrung
  rationale: Der Ausdruck umfasst allgemein das religiös Verehrte und ist nicht auf eine als Gottheit verstandene Person beschränkt.
- source_word: ὥστε … καθίσαι
  choice: sodass er … Platz nimmt
  rationale: ὥστε führt die Folge der beschriebenen Selbsterhöhung ein. »Platz nimmt« lässt das gezielte Sich-Niederlassen erkennen, ohne die Bildsprache unnötig als Thronbesteigung auszudeuten.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: im Tempel Gottes
  rationale: Obwohl εἰς wörtlich eine Bewegung hinein bezeichnen kann, ergibt die Verbindung mit καθίσαι idiomatisch den Ort des Sitzens. ναός bezeichnet den Tempel beziehungsweise enger das Heiligtum; »Tempel« ist im Deutschen klar und lässt die Auslegung des Bildes offen.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: sich … darstellt
  rationale: Die Wiedergabe bezeichnet eine öffentliche Selbstdarstellung, ohne zwingend eine förmliche mündliche Behauptung anzunehmen.
- source_word: ὅτι ἔστιν θεός
  choice: als Gott
  rationale: Die prädikative Konstruktion wird im Deutschen natürlich mit »als« wiedergegeben. Im Zusammenhang mit dem Tempel Gottes trägt θεός den zugespitzten Anspruch, Gott zu sein; die grammatisch mögliche Wiedergabe »ein Gott« bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Ob das abschließende θεός mit »Gott« oder »ein Gott« wiederzugeben ist
  choice: Gott
  alternative: ein Gott
  rationale: Der Zusammenhang schildert, wie die Gestalt im Tempel Gottes Platz nimmt und den höchsten göttlichen Anspruch erhebt. Das artikellose θεός erlaubt grammatisch jedoch auch die Wiedergabe »ein Gott«; diese Möglichkeit wird nicht verschwiegen.
- issue: Ob ναός als »Tempel« oder enger als »Heiligtum« wiederzugeben ist
  choice: Tempel Gottes
  alternative: Heiligtum Gottes
  rationale: ναός kann besonders den inneren Tempelbereich bezeichnen. »Tempel Gottes« ist hier die natürlichere deutsche Formulierung und legt nicht fest, ob das Bild wörtlich oder übertragen zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen reflexiven Wendungen bewahren den Nachdruck auf der Selbsterhöhung. Die Übersetzung vermeidet sowohl einen künstlichen Fachstil als auch konfessionelle Festlegungen zur Identität der Gestalt oder zur Bedeutung des Tempels.
