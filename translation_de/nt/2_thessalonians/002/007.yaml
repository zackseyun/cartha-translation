  terminology: „Geheimnis der Gesetzlosigkeit“ und „am Werk“ sind angemessen. „Der, der jetzt noch zurückhält“ wahrt die personale, bestimmte Form von ὁ κατέχων besser als „einer, der es ... zurückhält“.
