base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: de
  text: Denn das Geheimnis der Gesetzlosigkeit ist schon am Werk. Nur muss der, der jetzt noch zurückhält,[a] erst aus dem Weg sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der jetzt noch Einhalt gebietet“. Der griechische Text sagt nicht, wer dieser Zurückhaltende ist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis er entfernt wird“ oder „bis er aus dem Weg geschafft wird“. Im Griechischen bleibt offener, wie dies geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Bewahrt den paulinischen Sinn einer verborgenen Wirklichkeit, die bereits wirksam ist, ohne sie auf ein bloßes Rätsel zu reduzieren.
- source_word: ἐνεργεῖται
  choice: ist schon am Werk
  rationale: Gibt die bereits gegenwärtige und fortdauernde Wirksamkeit in natürlichem modernem Deutsch wieder.
- source_word: ἀνομίας
  choice: Gesetzlosigkeit
  rationale: Entspricht ἀνομία unmittelbar und bewahrt den thematischen Bezug zur Missachtung der Ordnung und des Willens Gottes.
- source_word: μόνον
  choice: Nur
  rationale: Leitet wie im Griechischen eine einschränkende Aussage ein; die elliptische Konstruktion wird für verständliches Deutsch behutsam ergänzt.
- source_word: ὁ κατέχων ἄρτι
  choice: einer, der es jetzt noch zurückhält
  rationale: Gibt die nicht näher bestimmte Person des Partizips wieder, ohne ihre Identität festzulegen. „Noch“ verdeutlicht im Deutschen die zeitliche Begrenzung durch den folgenden bis-Satz.
- source_word: ἕως ἐκ μέσου γένηται
  choice: bis er aus dem Weg ist
  rationale: Bewahrt den resultativen und hinsichtlich der Verursachung offenen Sinn der griechischen Wendung, ohne einen Handelnden einzuführen, der ihn entfernt.
theological_decisions:
- issue: Identität von ὁ κατέχων
  choice: Unbestimmt als „einer, der es jetzt noch zurückhält“ wiedergegeben.
  alternative: Römischer Staat, menschliche Regierung, Heiliger Geist, Engelwesen oder apostolische Verkündigung.
  rationale: Der griechische Text nennt in diesem Vers keine Identität; die Übersetzung darf die umstrittene endzeitliche Deutung nicht vorentscheiden.
- issue: Verursachung bei ἕως ἐκ μέσου γένηται
  choice: „bis er aus dem Weg ist“
  alternative: „bis er entfernt wird“ oder „bis er aus dem Weg geschafft wird“
  rationale: Die griechische Formulierung sagt nicht ausdrücklich, ob oder durch wen die betreffende Person entfernt wird. Die gewählte Fassung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht elliptische griechische Aussage wird durch „ist da einer“ lesbar gemacht, ohne die Identität des Zurückhaltenden oder die Ursache seines Verschwindens festzulegen.
