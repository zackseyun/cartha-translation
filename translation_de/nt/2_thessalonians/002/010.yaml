  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: de
  text: und mit jeder ungerechten Täuschung[a] für die, die verloren gehen[b], weil sie die Liebe zur Wahrheit nicht angenommen haben[c], um gerettet zu werden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit jeder Täuschung der Ungerechtigkeit“; auch: „mit jedem ungerechten Betrug“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Dativ kann hier auch mit „bei denen“ oder „an denen, die verloren gehen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „nicht aufgenommen“ oder „nicht willkommen geheißen haben“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „damit sie gerettet werden“ oder „sodass sie gerettet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ ἀδικίας
  choice: ungerechten Täuschung
  rationale: Die Verbindung bezeichnet eine Täuschung, die von Ungerechtigkeit geprägt ist. Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt den moralischen Gehalt von ἀδικία.
- source_word: τοῖς ἀπολλυμένοις
  choice: für die, die verloren gehen
  rationale: Die Dativform bezeichnet die Menschen, auf die sich die Täuschung richtet. Das Präsenspartizip wird als fortdauernder Vorgang wiedergegeben, ohne daraus die festlegende Bezeichnung „die Verlorenen“ zu machen.
- source_word: ἀνθ’ ὧν
  choice: weil
  rationale: Die Wendung führt hier den Grund ein. „Weil“ gibt diesen kausalen Zusammenhang in verständlichem Deutsch wieder.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: die Liebe zur Wahrheit
  rationale: Der Genitiv bezeichnet im Zusammenhang am ehesten die Wahrheit als Gegenstand der Liebe. „Liebe zur Wahrheit“ ist dafür die natürliche deutsche Formulierung.
- source_word: ἐδέξαντο
  choice: nicht angenommen haben
  rationale: δέχομαι kann annehmen, aufnehmen oder willkommen heißen bedeuten. „Annehmen“ passt zu dem abstrakten Objekt und bringt die verantwortliche Zurückweisung zum Ausdruck.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: damit sie gerettet würden
  rationale: Die Konstruktion mit εἰς und substantiviertem Infinitiv kann Ziel oder Folge ausdrücken. „Damit“ gibt den Zielbezug klar wieder, während das Passiv erhalten bleibt.
theological_decisions:
- issue: Ob τοῖς ἀπολλυμένοις eine feststehende Verurteilung oder einen gegenwärtigen Vorgang bezeichnet
  choice: die, die verloren gehen
  alternative: die Verlorenen; die dem Verderben entgegengehen
  rationale: Das griechische Präsenspartizip beschreibt einen fortdauernden Zustand oder Vorgang. Die Wiedergabe vermeidet es, eine bestimmte soteriologische Deutung in den Ausdruck hineinzulegen.
- issue: Ob τῆς ἀληθείας subjektiv oder objektiv zu ἀγάπην gehört
  choice: Liebe zur Wahrheit
  alternative: Liebe der Wahrheit
  rationale: Der Zusammenhang spricht deutlich dafür, dass die Wahrheit Gegenstand der verweigerten Liebe ist. Die natürliche deutsche Form macht diese wahrscheinliche Beziehung verständlich, ohne „Wahrheit“ zu einer bloßen Botschaft umzudeuten.
- issue: Ob εἰς τὸ σωθῆναι Ziel oder tatsächliche Folge bezeichnet
  choice: damit sie gerettet würden
  alternative: sodass sie gerettet würden
  rationale: Die griechische Konstruktion lässt einen Ziel- beziehungsweise Ergebnisbezug zu. Im Zusammenhang ist die finale Wiedergabe wahrscheinlich; die alternative resultative Lesart wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satz bleibt als Anschluss an den vorausgehenden Kontext mit „und“ fragmentarisch verbunden. Fachsprachliche oder konfessionell geprägte Formulierungen werden vermieden.
