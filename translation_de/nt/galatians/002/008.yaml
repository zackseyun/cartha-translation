    rationale: Die Formulierung kann einen bloßen Wirkungsort ausdrücken. εἰς mit ἀποστολή kennzeichnet hier die Ausrichtung des Aposteldienstes auf die jeweilige Personengruppe. Zudem ist „Völker“ im Deutschen ohne Kontext weniger eindeutig als die im paulinischen Gegensatz gemeinten Nichtjuden.
