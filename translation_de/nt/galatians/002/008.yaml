  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: de
  text: Denn der, der durch Petrus zum Aposteldienst für die Beschnittenen wirkte, wirkte auch durch mich für die Nichtjuden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für die Völker«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: wirkte / wirkte
  rationale: Die Wiederholung desselben Verbs bewahrt den Parallelismus des griechischen Textes und deutet die Art des göttlichen Wirkens nicht näher aus.
- source_word: Πέτρῳ / ἐμοὶ
  choice: durch Petrus / durch mich
  rationale: 'Die Dative werden im Zusammenhang instrumental verstanden: Der nicht ausdrücklich genannte Handelnde wirkte durch Petrus beziehungsweise Paulus.'
- source_word: εἰς ἀποστολὴν
  choice: für den Aposteldienst
  rationale: Die Formulierung gibt die Ausrichtung auf den apostolischen Auftrag natürlich und würdig wieder, ohne einen vom Text nicht ausdrücklich genannten Auftraggeber einzufügen.
- source_word: τῆς περιτομῆς
  choice: unter den Beschnittenen
  rationale: Die Beschneidung steht metonymisch für das jüdische Volk; „unter den Beschnittenen“ erhält das Bild und bezeichnet zugleich den Wirkungsbereich.
- source_word: τὰ ἔθνη
  choice: unter den Völkern
  rationale: „Völker“ bewahrt die grundlegende Bedeutung von ἔθνη und lässt im Kontrast zu den Beschnittenen erkennen, dass die nichtjüdischen Völker gemeint sind.
theological_decisions:
- issue: Soll das unausgesprochene Subjekt ausdrücklich als Gott bezeichnet werden?
  choice: Denn der, der … wirkte
  alternative: Denn Gott, der … wirkte
  rationale: Das Griechische hat ein substantiviertes Partizip („der Wirkende“), nennt Gott hier aber nicht ausdrücklich. Die Übersetzung bewahrt diese Form und vermeidet eine erklärende Ergänzung.
- issue: Bedeutung von τὰ ἔθνη im jüdisch-nichtjüdischen Gegensatz
  choice: die Völker
  alternative: die Nichtjuden
  rationale: „Die Völker“ hält die lexikalische Weite des Ausdrucks fest; der unmittelbare Gegensatz zu den Beschnittenen erschließt seine kontextuelle Bedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der parallele Satzbau und die zweimalige Verwendung von „wirkte“ bilden die Struktur des griechischen Satzes ab; „Aposteldienst“ ist natürlicher als das abstrakte „Apostelschaft“.
