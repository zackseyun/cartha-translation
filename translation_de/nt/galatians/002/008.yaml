  naturalness: Der Entwurf ist grundsätzlich flüssig und angemessen. „Zum Aposteldienst für die Beschnittenen“ und „für die Nichtjuden“ machen die beabsichtigte Zuordnung im Deutschen klarer und sind modernes Standarddeutsch.
  terminology: „Aposteldienst“ ist eine tragfähige Wiedergabe von ἀποστολή. „Beschnittene“ bewahrt die Metonymie von τῆς περιτομῆς; „Nichtjuden“ gibt τὰ ἔθνη im vorliegenden jüdisch-nichtjüdischen Gegensatz präzise wieder. Die lexikalisch weitere Alternative „die Völker“ gehört in eine Fußnote.
