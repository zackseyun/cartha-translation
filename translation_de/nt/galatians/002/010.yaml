source:
  edition: SBLGNT
  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: de
  text: Nur sollten wir an die Armen denken – genau dafür habe ich mich auch eifrig eingesetzt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: nur
  rationale: Kennzeichnet die einzige ausdrücklich genannte Bitte beziehungsweise Auflage der Vereinbarung.
- source_word: τῶν πτωχῶν
  choice: die Armen
  rationale: Gibt die substantivierte Personenbezeichnung schlicht und geläufig wieder.
- source_word: ἵνα μνημονεύωμεν
  choice: sollten wir an … denken
  rationale: Nach μόνον bezeichnet ἵνα den Inhalt der Bitte. „An die Armen denken“ bewahrt die griechische Ausdrucksweise und lässt den kontextuell vorausgesetzten praktischen Einsatz mitschwingen, ohne ihn auszudeuten.
- source_word: ὃ
  choice: darum
  rationale: Das Relativpronomen greift die gesamte vorausgehende Bitte auf. Im Deutschen verbindet „darum“ die Aussagen natürlich und eindeutig.
- source_word: ἐσπούδασα
  choice: habe ich mich eifrig bemüht
  rationale: σπουδάζω bezeichnet hier ernsthaften Eifer, verbunden mit tätigem Einsatz; die Formulierung gibt beide Aspekte wieder.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: gerade darum
  rationale: Die betonte Wendung αὐτὸ τοῦτο hebt hervor, dass Paulus genau dieser Bitte nachkommen wollte; „gerade“ erhält diesen Nachdruck idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet den engen Anschluss und zugleich den Wechsel vom gemeinsamen „wir“ zum persönlichen „ich“ ab. Die praktische Tragweite des Erinnerns wird nicht ausdrücklich ergänzt, damit die knappe Formulierung des Ausgangstextes erhalten bleibt.
