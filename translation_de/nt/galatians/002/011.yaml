    issue: Unidiomatische Wiedergabe von κατεγνωσμένος ἦν
    rationale: Die Formulierung »weil er verurteilt dastand« ist im heutigen Standarddeutsch unnötig sperrig. »Weil er verurteilt war« bewahrt Passiv und Zustandsaspekt, ohne einen nicht genannten Verurteiler festzulegen.
  - severity: low
    issue: Überstarke Fußnotenalternative
    rationale: »Eindeutig im Unrecht« fügt mit »eindeutig« eine Nuance hinzu, die im griechischen Ausdruck nicht ausdrücklich enthalten ist. Die alternative kontextuelle Deutung sollte knapper formuliert werden.
