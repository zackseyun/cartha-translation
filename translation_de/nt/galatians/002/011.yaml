source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: de
  text: Als Kephas aber nach Antiochia kam, trat ich ihm offen entgegen, weil er verurteilt war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil er im Unrecht war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Als … aber
  rationale: Gibt den zeitlichen Übergang und den leichten Gegensatz von δέ in natürlichem Deutsch wieder.
- source_word: Κηφᾶς
  choice: Kephas
  rationale: Bewahrt die im griechischen Text stehende Namensform, statt sie durch Petrus zu ersetzen.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: nach Antiochia kam
  rationale: Ist die übliche deutsche Formulierung für die Bewegung zu einer Stadt.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: ihm offen entgegen
  rationale: Vermittelt die direkte, persönliche Konfrontation idiomatisch; die wörtlichere Wendung »ins Angesicht« wirkt im modernen Deutsch unnatürlich.
- source_word: ἀντέστην
  choice: trat ich … entgegen
  rationale: Gibt den offenen Widerstand in natürlichem, würdigem Deutsch wieder.
- source_word: ὅτι
  choice: weil
  rationale: Leitet wie im Kontext naheliegend den Grund für Paulus’ Entgegentreten ein.
- source_word: κατεγνωσμένος ἦν
  choice: er verurteilt dastand
  rationale: Bewahrt sowohl das Passiv als auch den resultativen Zustandsaspekt der periphrastischen Konstruktion, ohne festzulegen, von wem die Verurteilung ausgeht.
theological_decisions:
- issue: Identität und Wiedergabe von Κηφᾶς
  choice: Kephas im Haupttext beibehalten
  alternative: Petrus zur leichteren Wiedererkennung einsetzen
  rationale: Die griechische Vorlage verwendet Κηφᾶς. Die Beibehaltung der Namensform wahrt die Textgestalt, ohne die weithin angenommene Identifizierung mit Petrus zur Übersetzung zu machen.
- issue: Bedeutung von κατεγνωσμένος ἦν
  choice: »er verurteilt dastand«
  alternative: »er eindeutig im Unrecht war«
  rationale: Die gewählte Fassung erhält die passive und resultative Spannung des Griechischen. Die Alternative ist kontextuell plausibel, deutet den Ausdruck aber stärker als bloßes Fehlverhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. »Offen entgegen« vermeidet eine altertümliche Lehnübersetzung des Gesichtsidioms; »verurteilt dastand« bewahrt die markante Spannung der griechischen Passivkonstruktion.
