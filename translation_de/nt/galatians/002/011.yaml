review_pass:
  verdict: revise
  source_fidelity: 'Der Satzbau und die zentralen Entsprechungen sind grundsätzlich quellentreu: »Als … aber«, »Kephas«, »nach Antiochia«, die direkte Konfrontation und die kausale Begründung geben den griechischen Text angemessen wieder. »verurteilt dastand« versucht zutreffend, κατεγνωσμένος ἦν als passiven Ergebniszustand zu erfassen, ist im modernen Standarddeutsch jedoch nicht idiomatisch.'
  naturalness: »Trat ich ihm offen entgegen« ist verständlich und angemessen. »Er verurteilt dastand« wirkt dagegen gestelzt und kann fälschlich eine förmliche, von einer bestimmten Instanz ausgesprochene Verurteilung nahelegen. »Er verurteilt war« ist natürlicher und erhält die im Ausgangstext nicht näher bestimmte passive Form.
  terminology: Die Transliteration »Kephas« folgt der griechischen Namensform und ist beizubehalten. Die Fußnotenalternative sollte nicht mit »eindeutig« eine Sicherheit ausdrücken, die κατεγνωσμένος selbst nicht kodiert; »im Unrecht war« gibt die kontextuelle, stärker interpretierende Lesart ausreichend wieder.
  issues:
