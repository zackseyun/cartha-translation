reference: Galatians 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: de
  text: Ich ging aber aufgrund einer Offenbarung hinauf[a] und legte ihnen das Evangelium vor, das ich unter den Nichtjuden verkündige – den Angesehenen jedoch gesondert[b] –, damit ich nicht etwa vergeblich laufe oder gelaufen bin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen einer Offenbarung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „jedoch gesondert den als bedeutend Geltenden“; auch: „denen, die als bedeutend galten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aus Sorge, ich könnte vergeblich laufen oder gelaufen sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: ich ging hinauf
  rationale: Gibt die übliche Bedeutung von ἀναβαίνω wieder, ohne das im Vers nicht ausdrücklich genannte Ziel Jerusalem zu ergänzen.
- source_word: κατὰ ἀποκάλυψιν
  choice: aufgrund einer Offenbarung
  rationale: Die Wendung bezeichnet hier die Offenbarung als Grund beziehungsweise Anlass der Reise und lässt offen, wie die Offenbarung vermittelt wurde.
- source_word: ἀνεθέμην αὐτοῖς
  choice: ich legte ihnen … vor
  rationale: Bezeichnet eine Darlegung zur Erwägung, ohne eine formelle Unterordnung oder ein bloß unverbindliches Mitteilen vorwegzunehmen.
- source_word: τὸ εὐαγγέλιον
  choice: das Evangelium
  rationale: Ist die etablierte, prägnante deutsche Wiedergabe des paulinischen Begriffs εὐαγγέλιον.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Nichtjuden
  rationale: ἔθνη bezeichnet im Kontext die Völker außerhalb Israels beziehungsweise Menschen, die keine Juden sind; „Nichtjuden“ ist in modernem Deutsch klar und vermeidet die heute weniger geläufige Bezeichnung „Heiden“.
- source_word: κατ’ ἰδίαν
  choice: in einem vertraulichen Gespräch
  rationale: Die Wendung bezeichnet eine gesonderte, nicht öffentliche Darlegung; die idiomatische Wiedergabe macht den situativen Sinn deutlich, ohne eine förmliche Sitzung zu behaupten.
- source_word: τοῖς δοκοῦσιν
  choice: den Angesehenen
  rationale: Bewahrt den Bezug auf Personen, die als bedeutend gelten, ohne abschließend zu entscheiden, ob Paulus ihren Rang bestätigt oder sprachlich relativiert.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: damit ich nicht etwa vergeblich laufe oder gelaufen bin
  rationale: Bewahrt das Bild des Laufens sowie den Wechsel vom Präsens zum Aorist, der gegenwärtige Tätigkeit und bereits geleistete Arbeit umfasst.
theological_decisions:
- issue: Ob Paulus sein Evangelium den angesehenen Personen zur verbindlichen Genehmigung unterbreitete
  choice: „legte ihnen … vor“ bleibt hinsichtlich Autorisierung und Bewertung neutral.
  alternative: „unterbreitete ihnen … zur Prüfung“ beziehungsweise „berichtete ihnen lediglich“
  rationale: ἀνατίθημι bezeichnet eine Darlegung, verlangt aber weder die Vorstellung einer lehrmäßigen Unterordnung noch schließt es jede Erwägung durch die anderen aus.
- issue: Zweck oder befürchtete Möglichkeit in μή πως
  choice: 'Der Haupttext gibt die Klausel als Ziel der Vorsorge wieder: „damit ich nicht etwa …“.'
  alternative: „aus Sorge, ich könnte vergeblich laufen oder gelaufen sein“
  rationale: Die griechische Konstruktion kann eine vorsorgliche Absicht beziehungsweise Befürchtung ausdrücken. Die Fußnote bewahrt die stärker subjektiv-sorgende Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjuden“ vermittelt den kontextuellen Sinn von ἔθνη verständlicher und neutraler als „Heiden“. Der Gedankenstrich bildet die eingeschobene Präzisierung κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν ab; die Tempusdifferenz zwischen τρέχω und ἔδραμον bleibt erhalten.
