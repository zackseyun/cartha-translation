revisions:
- from: Ich ging aber aufgrund einer Offenbarung hinauf[a] und legte ihnen das Evangelium vor, das ich unter den Nichtjuden verkündige – den Angesehenen jedoch in einem vertraulichen Gespräch[b] –, damit ich nicht etwa vergeblich laufe oder gelaufen bin.[c]
  to: Ich ging aber aufgrund einer Offenbarung hinauf[a] und legte ihnen das Evangelium vor, das ich unter den Nichtjuden verkündige – den Angesehenen jedoch gesondert[b] –, damit ich nicht etwa vergeblich laufe oder gelaufen bin.[c]
  rationale: Die Revision ersetzt die überbestimmende Formulierung „in einem vertraulichen Gespräch“ durch „gesondert“. Damit werden die private beziehungsweise abgegrenzte Darlegung und die syntaktische Zuordnung zu den Angesehenen wiedergegeben, ohne Vertraulichkeit, ein Einzelgespräch oder eine formelle Sitzung hinzuzufügen. Die Fußnote zu τοῖς δοκοῦσιν wird neutralisiert. Die Gegenüberstellung von gegenwärtigem „laufe“ und bereits erfolgtem „gelaufen bin“ bleibt erhalten.
