- from: Doch weil wir wissen, dass ein Mensch nicht aufgrund von Werken des Gesetzes gerechtfertigt wird, außer durch den Glauben an Jesus, den Messias[a], haben auch wir an den Messias Jesus geglaubt, damit wir durch den Glauben an den Messias[b] gerechtfertigt würden und nicht aufgrund von Werken des Gesetzes. Denn aufgrund von Werken des Gesetzes wird kein Mensch[c] gerechtfertigt werden.
  to: Da wir aber wissen, dass ein Mensch nicht aufgrund von Werken des Gesetzes gerechtfertigt wird, sondern durch den Glauben an Jesus, den Messias[a], haben auch wir an den Messias Jesus geglaubt, damit wir durch den Glauben an den Messias[b] gerechtfertigt werden und nicht aufgrund von Werken des Gesetzes. Denn aufgrund von Werken des Gesetzes wird kein Mensch[c] gerechtfertigt werden.
