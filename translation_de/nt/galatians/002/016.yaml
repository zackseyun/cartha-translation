review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die zentralen griechischen Begriffe und die beiden umstrittenen Genitivverbindungen bei πίστις sachgerecht wieder. Die Fußnoten bewahren zutreffend die mögliche Lesart „Treue ...“. Die Zweckangabe ἵνα δικαιωθῶμεν verlangt jedoch im Deutschen den regulären Konjunktiv der Zweckkonstruktion „damit ... gerechtfertigt werden“, nicht „würden“, das eine nicht im Griechischen angelegte Irrealität oder Bedingtheit nahelegen kann.
  naturalness: „Doch weil wir wissen“ ist verständlich, aber „Da wir aber wissen“ bildet die partizipiale, leicht adversative Anknüpfung εἰδότες δέ idiomatischer ab. „Nicht aufgrund von Werken des Gesetzes, sondern durch ...“ ist im modernen Deutschen klarer und natürlicher als die durch „außer durch“ gebildete Ausnahmeformulierung.
  terminology: „gerechtfertigt“, „Werke des Gesetzes“ und „Messias“ sind konsequent und registergerecht. „Kein Mensch“ ist eine gute idiomatische Wiedergabe von πᾶσα σάρξ; die Fußnote hält das wörtliche Bild fest. Die Wiedergabe „Messias Jesus“ kann wegen der griechischen Titelfolge beibehalten werden.
  issues:
  - severity: medium
    issue: „damit wir ... gerechtfertigt würden“
    rationale: δικαιωθῶμεν ist ein Aorist Konjunktiv Passiv in einem ἵνα-Zwecksatz. Deutsch verwendet hier regelmäßig „damit wir ... gerechtfertigt werden“. „würden“ ist nicht nötig und kann einen kontrafaktischen Unterton erzeugen.
  - severity: low
    issue: „außer durch den Glauben“
    rationale: Die Formulierung ist verständlich, wirkt nach der Negation jedoch etwas schwerfällig. „Nicht ... sondern durch“ gibt die ausschließende Funktion von ἐὰν μὴ idiomatisch und ohne Bedeutungsverlust wieder.
  - severity: low
    issue: Kausale Umformung von εἰδότες δέ
    rationale: „Doch weil wir wissen“ ist möglich, aber „Da wir aber wissen“ bewahrt sowohl die partizipiale Begründung als auch die adversative Nuance von δέ natürlicher.
  revised_text: Da wir aber wissen, dass ein Mensch nicht aufgrund von Werken des Gesetzes gerechtfertigt wird, sondern durch den Glauben an Jesus, den Messias[a], haben auch wir an den Messias Jesus geglaubt, damit wir durch den Glauben an den Messias[b] gerechtfertigt werden und nicht aufgrund von Werken des Gesetzes. Denn aufgrund von Werken des Gesetzes wird kein Mensch[c] gerechtfertigt werden.
