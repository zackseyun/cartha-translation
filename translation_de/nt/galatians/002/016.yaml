id: GAL.2.16
reference: Galatians 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: de
  text: Da wir aber wissen, dass ein Mensch nicht aufgrund von Werken des Gesetzes gerechtfertigt wird, sondern durch den Glauben an Jesus, den Messias[a], haben auch wir an den Messias Jesus geglaubt, damit wir durch den Glauben an den Messias[b] gerechtfertigt werden und nicht aufgrund von Werken des Gesetzes. Denn aufgrund von Werken des Gesetzes wird kein Mensch[c] gerechtfertigt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Treue Jesu, des Messias“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durch die Treue des Messias“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „alles Fleisch wird nicht gerechtfertigt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: gerechtfertigt wird / gerechtfertigt würden / gerechtfertigt werden wird
  rationale: Die einheitliche Wiedergabe mit „rechtfertigen“ bewahrt den forensischen und theologischen Gehalt des paulinischen Ausdrucks, ohne ihn durch eine engere Umschreibung festzulegen.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: „Ein Mensch“ gibt den generischen Singular natürlich und geschlechtsübergreifend wieder.
- source_word: ἐξ ἔργων νόμου
  choice: aufgrund von Werken des Gesetzes
  rationale: Die Formulierung bewahrt den charakteristischen paulinischen Ausdruck und vermeidet die ungenaue Verallgemeinerung „gute Werke“.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: durch den Glauben an Jesus, den Messias
  rationale: Im Haupttext wird der Genitiv als Bezug des Glaubens auf Jesus verstanden; die ebenso mögliche Deutung als Treue Jesu bleibt in Fußnote [a] erhalten.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: haben wir an den Messias Jesus geglaubt
  rationale: „An … glauben“ ist die idiomatische deutsche Wiedergabe von πιστεύω mit εἰς; das Perfekt drückt die vollzogene, weiterhin bedeutsame Hinwendung aus.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: durch den Glauben an den Messias
  rationale: Die Formulierung entspricht der Entscheidung beim ersten Genitivgefüge; die alternative Deutung als Treue des Messias wird in Fußnote [b] bewahrt.
- source_word: Χριστός
  choice: Messias
  rationale: Der Titel wird seinem Sinn entsprechend übersetzt, statt lediglich als „Christus“ transliteriert zu werden.
- source_word: πᾶσα σάρξ
  choice: kein Mensch
  rationale: Die natürliche deutsche Aussage bezeichnet hier die gesamte Menschheit; das wörtliche biblische Sprachbild „alles Fleisch“ wird in Fußnote [c] dokumentiert.
- source_word: εἰδότες δὲ
  choice: Doch weil wir wissen
  rationale: „Doch“ gibt die leicht adversative Kraft von δέ wieder; der kausale Nebensatz verbindet das Wissen natürlich mit der folgenden Aussage.
- source_word: ἐὰν μὴ
  choice: außer durch
  rationale: Die Formulierung erhält die ausschließende Struktur des griechischen Ausdrucks, ohne sie in eine ausführlichere dogmatische Paraphrase aufzulösen.
theological_decisions:
- issue: Bedeutung von πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ
  choice: Glaube an Jesus, den Messias / Glaube an den Messias
  alternative: Treue Jesu, des Messias / Treue des Messias
  rationale: Der Genitiv kann objektiv oder subjektiv verstanden werden. Der Haupttext folgt der im Deutschen geläufigen objektiven Deutung, während die echte exegetische Alternative ausdrücklich in den Fußnoten erhalten bleibt.
- issue: Bedeutung und Wiedergabe von δικαιόω
  choice: rechtfertigen
  alternative: für gerecht erklären
  rationale: „Rechtfertigen“ wahrt die traditionelle forensische Prägnanz und die lexikalische Einheit im Vers; „für gerecht erklären“ wäre verständlicher, könnte den Bedeutungsumfang aber stärker eingrenzen.
- issue: Wiedergabe von πᾶσα σάρξ
  choice: kein Mensch
  alternative: alles Fleisch
  rationale: Der Haupttext gibt den gemeinten universalen Bezug in heutigem Deutsch wieder, während die Fußnote das Schriftzitat beziehungsweise dessen biblisches Sprachbild sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Charakteristische paulinische Wendungen wie „Werke des Gesetzes“ und „gerechtfertigt“ bleiben erhalten; schwer verständliche oder umstrittene Einzelheiten werden knapp in Fußnoten erläutert. Die Bezeichnung Χριστός wird durchgehend als „Messias“ wiedergegeben.
