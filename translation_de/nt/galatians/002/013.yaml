  source_fidelity: 'Die Übersetzung bildet die Satzstruktur und die entscheidenden Bezüge des griechischen Textes zuverlässig ab: καὶ ... καί durch „Und auch“, οἱ λοιποὶ Ἰουδαῖοι durch „die übrigen Juden“, συνυπεκρίθησαν αὐτῷ durch „heuchelten mit ihm“ und das Passiv συναπήχθη durch „wurde ... mitgerissen“. „Ihre Heuchelei“ gibt αὐτῶν τῇ ὑποκρίσει klar wieder.'
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und bewahrt einen dem paulinischen Tadel angemessenen sachlich-würdigen Ton. Die Wiederaufnahme „heuchelten/Heuchelei“ ist stilistisch vertretbar und reflektiert die Wortfeldwiederholung im Griechischen.
