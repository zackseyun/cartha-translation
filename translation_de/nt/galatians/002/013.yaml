source:
  edition: SBLGNT
  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: de
  text: Und auch die übrigen Juden heuchelten mit ihm, sodass sogar Barnabas von ihrer Heuchelei mitgerissen wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: heuchelten mit ihm
  rationale: Das Verb bezeichnet gemeinsames heuchlerisches Verhalten. „Heuchelten mit ihm“ gibt sowohl die konkrete Handlung als auch die gemeinschaftliche Bedeutung der σύν-Komponente knapp und natürlich wieder.
- source_word: αὐτῷ
  choice: mit ihm
  rationale: Der Dativ bezeichnet die Verbindung mit Petrus in diesem Verhalten; „mit ihm“ macht diese Zuordnung im Deutschen ausdrücklich.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: die übrigen Juden
  rationale: „Die übrigen“ bezeichnet die anderen Mitglieder der bereits angesprochenen Gruppe und hebt ihren Gegensatz zu Petrus hervor. „Juden“ meint hier die jüdische ethnisch-religiöse Gruppe, nicht bloß Bewohner Judäas.
- source_word: συναπήχθη
  choice: wurde … mitgerissen
  rationale: Das Passiv beschreibt, wie Barnabas durch den Einfluss und die Gruppendynamik der anderen erfasst wurde. „Mitgerissen“ bewahrt zugleich die passive und gemeinschaftliche Nuance.
- source_word: ὑποκρίσει
  choice: Heuchelei
  rationale: Der Ausdruck benennt das widersprüchliche, verstellte Verhalten. „Heuchelei“ ist im Deutschen transparent und entspricht der Wiederaufnahme des Verbstamms im griechischen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung des griechischen Wortfeldes ὑποκρίνομαι/ὑπόκρισις wird durch „heuchelten/Heuchelei“ bewahrt; dadurch bleibt Paulus’ pointierte moralische Bewertung erhalten.
