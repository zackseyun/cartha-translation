  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: de
  text: Denn wenn ich das, was ich niedergerissen habe, wieder aufbaue, erweise ich mich selbst als Übertreter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stelle ich mich selbst als Übertreter hin“; auch: „weise ich mich selbst als Übertreter aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: „Denn“ wahrt die begründende Verbindung zum vorherigen Gedankengang, während „wenn“ die Bedingung ausdrückt.
- source_word: ἃ ... ταῦτα
  choice: das, was
  rationale: Die deutsche Korrelativkonstruktion gibt die Beziehung zwischen Relativpronomen und Demonstrativpronomen natürlich wieder; der griechische Plural wird dabei idiomatisch als sachbezogenes Kollektiv ausgedrückt.
- source_word: κατέλυσα
  choice: niedergerissen habe
  rationale: Die Wahl bewahrt im Zusammenspiel mit „aufbaue“ das konkrete Bild vom Abreißen und Wiederaufbauen, ohne es vorschnell als „abschaffen“ auszulegen.
- source_word: πάλιν οἰκοδομῶ
  choice: wieder aufbaue
  rationale: „Wieder aufbaue“ gibt sowohl πάλιν als auch das Präsens von οἰκοδομῶ klar und idiomatisch wieder.
- source_word: παραβάτην
  choice: Übertreter
  rationale: „Übertreter“ erhält den moralisch-rechtlichen Sinn, ohne das Bezugsfeld ausdrücklich auf das Gesetz einzuengen.
- source_word: ἐμαυτὸν συνιστάνω
  choice: erweise ich mich selbst als
  rationale: Die Formulierung gibt die reflexive und feststellende Kraft der Wendung wieder und bleibt gegenüber „beweise“ etwas näher an der Bedeutungsbreite von συνιστάνω.
theological_decisions:
- issue: Gegenstand des Niederreißens und Wiederaufbauens
  choice: Der Gegenstand bleibt mit „das, was“ unbestimmt.
  alternative: Eine ausdrückliche Deutung als Gesetz, Gesetzeswerke oder frühere Lebensweise.
  rationale: Der griechische Vers nennt den Gegenstand nicht ausdrücklich; eine Konkretisierung würde die kontextuelle Spannung zugunsten einer bestimmten Auslegung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bau-Bild des griechischen Textes bleibt erhalten; „Übertreter“ wahrt die rechtlich-moralische Nuance und die inhaltliche Offenheit.
