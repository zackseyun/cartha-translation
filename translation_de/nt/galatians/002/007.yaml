id: GAL.2.7
reference: Galatians 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: de
  text: 'Im Gegenteil: Als sie sahen, dass mir das Evangelium für die Unbeschnittenen anvertraut worden war, ebenso wie Petrus das Evangelium für die Beschnittenen anvertraut worden war,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Im Gegenteil
  rationale: Die feste Verbindung markiert einen starken Gegensatz zum Vorhergehenden; „Im Gegenteil“ gibt sie im Deutschen natürlich und prägnant wieder.
- source_word: ἰδόντες
  choice: Sie sahen
  rationale: Das Aoristpartizip bezeichnet den Umstand, unter dem die folgende Einsicht beziehungsweise Anerkennung erfolgte. Ein deutscher Hauptsatz ist hier klar und idiomatisch.
- source_word: πεπίστευμαι
  choice: mir … anvertraut worden war
  rationale: Das Perfekt Passiv von πιστεύω bezeichnet hier die Übertragung eines Auftrags. Das Plusquamperfekt passt zur rückblickenden Wahrnehmung im Erzählzusammenhang.
- source_word: τὸ εὐαγγέλιον
  choice: das Evangelium
  rationale: „Evangelium“ ist im paulinischen Zusammenhang die etablierte, theologisch gewichtige und zugleich allgemein verständliche Wiedergabe.
- source_word: τῆς ἀκροβυστίας
  choice: für die Unbeschnittenen
  rationale: Der Genitiv bezeichnet hier die Zielgruppe beziehungsweise den Wirkungsbereich des anvertrauten Evangeliums. Diese Wiedergabe ist natürlicher als „der Unbeschnittenheit“ und weniger deutend als „für die Heiden“.
- source_word: καθὼς
  choice: ebenso wie
  rationale: Die Formulierung stellt die parallelen Beauftragungen von Paulus und Petrus heraus.
- source_word: Πέτρος
  choice: Petrus
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform wird verwendet.
- source_word: τῆς περιτομῆς
  choice: für die Beschnittenen
  rationale: Die Wiedergabe wahrt die Parallelität zur ersten Zielgruppe und erhält die im Griechischen ausdrücklich genannte Bundesmarkierung, ohne sie vorschnell mit „Juden“ gleichzusetzen.
- source_word: '[Ellipse nach Πέτρος τῆς περιτομῆς]'
  choice: das Evangelium … [war] anvertraut worden
  rationale: Die im Griechischen ausgesparte Aussage wird im Deutschen sinngemäß wiederholt, damit der Vergleich grammatisch vollständig und eindeutig ist.
theological_decisions:
- issue: Sind ἀκροβυστία und περιτομή ethnisch als „Nichtjuden/Heiden“ und „Juden“ oder anhand der ausdrücklich genannten Beschneidungsmerkmale wiederzugeben?
  choice: „die Unbeschnittenen“ und „die Beschnittenen“
  alternative: „die Heiden/Nichtjuden“ und „die Juden“ beziehungsweise wörtlich „Unbeschnittenheit“ und „Beschneidung“
  rationale: Die Übersetzung bewahrt Paulus’ eigene bundestheologisch-ethnische Bezeichnungen und vermeidet sowohl eine unnötige ethnische Verengung als auch unnatürliche deutsche Abstrakta.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelkontrast und die parallele Beauftragung bleiben deutlich; die griechische Ellipse wird für einen natürlichen deutschen Satz behutsam ergänzt.
