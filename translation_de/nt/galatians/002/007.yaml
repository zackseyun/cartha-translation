revisions:
- from: 'Im Gegenteil: Sie sahen, dass mir das Evangelium für die Unbeschnittenen anvertraut worden war, ebenso wie Petrus das Evangelium für die Beschnittenen[a].'
  to: 'Im Gegenteil: Als sie sahen, dass mir das Evangelium für die Unbeschnittenen anvertraut worden war, ebenso wie Petrus das Evangelium für die Beschnittenen anvertraut worden war,'
  rationale: Die Ergänzung des bei Petrus im Griechischen ausgesparten Prädikats stellt die deutsche Syntax her und bewahrt die parallele Beauftragung. „Als sie sahen“ gibt die umstandsbestimmende Funktion des Aoristpartizips ausdrücklich wieder. Die Fußnote erklärt den genitivischen Ausdruck, ohne die Richtung der anvertrauten Beauftragung zu verkehren.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:32:20Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den starken Gegensatz, die Wahrnehmung und die parallelen Aufträge für Unbeschnittene und Beschnittene im Wesentlichen treffend wieder. In der deutschen Vergleichskonstruktion muss jedoch die im Griechischen elliptische Prädikation bei Petrus ausdrücklich ergänzt werden; in der vorliegenden Fassung bleibt sie unvollständig.
  naturalness: „Im Gegenteil“ und die Bezeichnungen „Unbeschnittene/Beschnittene“ sind modernes, verständliches Standarddeutsch. Mit dem ergänzten Prädikat wird der Satz grammatisch vollständig und flüssig.
  terminology: „Evangelium“, „Petrus“, „Unbeschnittene“ und „Beschnittene“ sind angemessen. Die Fußnote sollte nicht behaupten, das Evangelium sei den jeweiligen Gruppen anvertraut worden; anvertraut wurde es Paulus beziehungsweise Petrus, mit Bezug auf diese Gruppen.
  issues:
  - severity: medium
    issue: Unvollständige Vergleichskonstruktion nach „ebenso wie Petrus“
    rationale: Das Griechische lässt nach Πέτρος die bereits genannte Aussage elliptisch aus. Deutsch benötigt hier die Wiederholung von „das Evangelium ... anvertraut worden war“, damit Petrus eindeutig als der Beauftragte und nicht als bloße Vergleichsgröße erscheint.
  - severity: medium
    issue: Die Fußnote verschiebt, wem das Evangelium anvertraut wurde
    rationale: „ihnen ... anvertraut“ kann sich auf die jeweiligen Gruppen beziehen. πεπίστευμαι bezeichnet hier jedoch die Beauftragung des Paulus; bei Petrus ist dieselbe Beauftragung elliptisch mitzudenken.
  revised_text: 'Im Gegenteil: Als sie sahen, dass mir das Evangelium für die Unbeschnittenen anvertraut worden war, ebenso wie Petrus das Evangelium für die Beschnittenen anvertraut worden war,'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: »das Evangelium der Unbeschnittenheit … der Beschneidung«. Gemeint ist das Evangelium in Bezug auf diese jeweiligen Gruppen; es war Paulus beziehungsweise Petrus anvertraut.'
    reason: lexical_alternative
  revision_rationale: Die Ergänzung des bei Petrus im Griechischen ausgesparten Prädikats stellt die deutsche Syntax her und bewahrt die parallele Beauftragung. „Als sie sahen“ gibt die umstandsbestimmende Funktion des Aoristpartizips ausdrücklich wieder. Die Fußnote erklärt den genitivischen Ausdruck, ohne die Richtung der anvertrauten Beauftragung zu verkehren.
