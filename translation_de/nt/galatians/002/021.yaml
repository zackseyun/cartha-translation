source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: de
  text: Ich setze die Gnade Gottes nicht außer Kraft. Denn wenn Gerechtigkeit durch das Gesetz kommt, dann ist der Messias umsonst[a] gestorben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vergeblich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: setze … nicht außer Kraft
  rationale: Die Wendung gibt wieder, dass Gottes Gnade für ungültig oder wirkungslos erklärt würde, und passt natürlich in den deutschen Argumentationsgang.
- source_word: χάριν
  choice: Gnade
  rationale: „Gnade“ ist die etablierte und sachlich passende Wiedergabe von χάρις im paulinischen Zusammenhang.
- source_word: διὰ νόμου
  choice: durch das Gesetz
  rationale: Die Präposition διά mit Genitiv bezeichnet hier das Mittel; „durch das Gesetz“ bewahrt diese Beziehung, ohne das im Griechischen ausgelassene Verb unnötig auszubauen.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ wahrt die Bedeutungsbreite des griechischen Begriffs zwischen gerechtem Status und dem Handeln beziehungsweise der Ordnung Gottes.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός ist hier als Titel gebraucht; „der Messias“ macht die Titelfunktion im modernen Deutsch deutlich.
- source_word: δωρεὰν
  choice: umsonst
  rationale: 'Im bedingten Argument bezeichnet das Adverb Zwecklosigkeit: Wenn Gerechtigkeit durch das Gesetz käme, hätte der Tod des Messias keinen notwendigen Sinn.'
theological_decisions:
- issue: Verhältnis von Gerechtigkeit, Gesetz und Tod des Messias
  choice: Der Satz lässt Paulus erklären, dass Gerechtigkeit durch das Gesetz den Tod des Messias sinnlos machen würde.
  alternative: „Gerechtigkeit“ kann stärker als Gottes gerechtes, ordnendes Handeln gehört werden und nicht nur als der Status eines Menschen vor Gott.
  rationale: Die knappe Formulierung bewahrt den scharfen logischen Gegensatz des griechischen Textes, ohne eine umfassende Rechtfertigungslehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der bildhaften Rechts- und Wirksamkeitssprache des Originals; der zweite bleibt knapp und argumentativ. „Der Messias“ wahrt Χριστός als Titel.
