source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: de
  text: Was aber die betrifft, die als bedeutend galten – was sie auch immer waren, ist für mich ohne Belang; Gott sieht die Person nicht an[a] –, so haben mir die Angesehenen nichts hinzugefügt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gott nimmt das Gesicht eines Menschen nicht an«; gemeint ist, dass Gott niemanden aufgrund seines Ansehens bevorzugt.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »haben mir nichts weiter auferlegt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: die als bedeutend galten / die Angesehenen
  rationale: Die Formulierungen geben den wahrgenommenen Rang wieder und bewahren zugleich Paulus’ leicht distanzierenden Ton, ohne die Legitimität ihrer Stellung ausdrücklich zu bestreiten.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: was sie auch einmal waren
  rationale: Dies bewahrt die Offenheit von ὁποῖοι und gibt ποτε natürlich wieder; Paulus erklärt ihren früheren oder jeweiligen Rang für unerheblich.
- source_word: οὐδέν μοι διαφέρει
  choice: macht für mich keinen Unterschied
  rationale: Eine natürliche und genaue Wiedergabe der griechischen Wendung.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Gott sieht die Person nicht an
  rationale: Die im Deutschen geläufige biblische Wendung bewahrt das Bild des griechischen Idioms und vermittelt, dass Gott niemanden aufgrund seines Ansehens bevorzugt.
- source_word: ἐμοὶ γὰρ
  choice: mir jedenfalls
  rationale: Das vorangestellte ἐμοί bleibt betont; »jedenfalls« gibt die rückbezügliche, erläuternde Kraft von γάρ in idiomatischem Deutsch wieder.
- source_word: οὐδὲν προσανέθεντο
  choice: haben nichts hinzugefügt
  rationale: Die Wiedergabe bleibt bewusst offen, ob es um eine Ergänzung zu Paulus’ Botschaft oder um eine zusätzliche Auflage für ihn geht.
theological_decisions:
- issue: Verhältnis des Paulus zu den angesehenen Jerusalemer Leitern
  choice: 'Ein distanzierter, aber nicht verächtlicher Ton: »die als bedeutend galten« und »die Angesehenen«'
  alternative: »die etwas zu sein schienen« könnte schärfer und abwertender klingen; »die anerkannten Leiter« würde die rhetorische Distanz abschwächen.
  rationale: Paulus bestreitet hier die maßgebliche Bedeutung ihres Ranges für sein Evangelium, ohne zwingend ihre Leitungsstellung als solche zu verwerfen.
- issue: Bedeutung von οὐδὲν προσανέθεντο
  choice: »haben nichts hinzugefügt«
  alternative: »haben mir nichts weiter auferlegt«
  rationale: Das Verb kann im Zusammenhang sowohl Ergänzen als auch zusätzliches Auferlegen nahelegen. Der Haupttext bewahrt die knappe Mehrdeutigkeit; die Fußnote nennt die wichtige Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche erhalten die verschachtelte, rhetorisch gespannte Struktur des griechischen Satzes. »Die Angesehenen« ist verständlich und wahrt Paulus’ Distanz, ohne unnötige Polemik.
