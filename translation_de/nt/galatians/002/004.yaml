id: GAL.2.4
reference: Galatians 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: de
  text: Doch wegen der eingeschleusten falschen Brüder[a], die sich heimlich eindrängten, um die Freiheit auszukundschaften, die wir im Messias Jesus[b] haben, damit sie uns versklaven—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „falsche Brüder“ bezeichnet Paulus Männer, die als Glaubensbrüder auftraten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Christus Jesus“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: παρεισάκτους
  choice: eingeschleusten
  rationale: Das Wort bezeichnet von außen heimlich Eingebrachte. „Eingeschleust“ bewahrt den verdeckten, feindlichen Vorgang und unterscheidet sich vom folgenden Verb παρεισῆλθον.
- source_word: ψευδαδέλφους
  choice: falschen Brüder
  rationale: Die formnahe Wiedergabe erhält sowohl Paulus’ familiäre Bezeichnung als auch ihre scharfe polemische Kraft.
- source_word: παρεισῆλθον
  choice: sich heimlich eindrängten
  rationale: Die Formulierung gibt das unbemerkte, unberechtigte Eindringen idiomatisch wieder, ohne die Wiederholung mit „eingeschleust“ einzuebnen.
- source_word: κατασκοπῆσαι
  choice: auszukundschaften
  rationale: „Auskundschaften“ vermittelt die gezielte und feindselige Beobachtung deutlicher als das neutralere „beobachten“.
- source_word: ἐλευθερίαν
  choice: Freiheit
  rationale: „Freiheit“ ist die natürliche moderne Entsprechung und bewahrt die theologische wie soziale Tragweite des Begriffs.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird hier als Titel verständlich wiedergegeben; „im“ bildet zugleich die feste paulinische ἐν-Formulierung natürlich ab.
- source_word: καταδουλώσουσιν
  choice: versklaven
  rationale: Das Verb bezeichnet ausdrücklich das Unterwerfen unter Sklaverei; „versklaven“ erhält diese Härte knapp und deutlich.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: damit sie uns versklaven
  rationale: Die deutsche Konstruktion gibt den beabsichtigten Zweck idiomatisch wieder. Der Gedankenstrich wahrt den syntaktisch unvollständigen Anschluss an den folgenden Vers.
theological_decisions:
- issue: Χριστῷ als Titel oder als namenähnliche Form
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: In diesem Zusammenhang bleibt die titulare Bedeutung von Χριστός verständlich. „Messias“ macht sie hörbar, ohne eine zusätzliche Lehrdeutung einzuführen.
- issue: Identität der ψευδάδελφοι
  choice: falsche Brüder
  alternative: falsche Gläubige
  rationale: Die Übersetzung bewahrt Paulus’ Verwandtschaftssprache und lässt offen, wie ihr tatsächlicher Glaubensstatus theologisch zu bestimmen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftigen Bilder des heimlichen Eindringens, Auskundschaftens und Versklavens bleiben erhalten. Der abschließende Gedankenstrich zeigt, dass der Satz in Vers 5 weitergeführt wird.
