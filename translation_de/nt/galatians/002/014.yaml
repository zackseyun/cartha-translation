source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: de
  text: 'Als ich aber sah, dass sie nicht im Einklang mit der Wahrheit des Evangeliums handelten[a], sagte ich zu Kephas vor allen: »Wenn du, obwohl du Jude bist, wie ein Nichtjude und nicht wie ein Jude lebst, wie zwingst du dann die Nichtjuden dazu, wie Juden zu leben?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nicht gerade gingen in Bezug auf die Wahrheit des Evangeliums«; gemeint ist ein Verhalten, das nicht mit ihr übereinstimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: »die Nichtjuden zum Judaisieren zu zwingen«; das heißt, sie zur Annahme einer jüdischen Lebensweise zu drängen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: geradlinig … lebten
  rationale: Das seltene Verb bezeichnet wörtlich ein gerades Gehen und im Zusammenhang ein Verhalten, das an einem Maßstab ausgerichtet ist. Die Formulierung bewahrt das Wegbild, bleibt aber im modernen Deutschen verständlich.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: nach der Wahrheit des Evangeliums
  rationale: πρός bezeichnet hier zusammen mit ὀρθοποδεῖν die maßgebende Ausrichtung. „Nach“ drückt aus, dass die Wahrheit des Evangeliums der Maßstab ihres Verhaltens ist.
- source_word: Κηφᾷ
  choice: Kephas
  rationale: Der im griechischen Text verwendete aramäische Name wird beibehalten und nicht durch „Petrus“ ersetzt.
- source_word: ἐθνικῶς
  choice: wie ein Nichtjude
  rationale: Das Adverb beschreibt die Lebensweise. „Wie ein Nichtjude“ gibt den ethnisch-sozialen Gegensatz verständlich wieder, ohne das heute oft missverständliche Wort „Heide“ zu verwenden.
- source_word: Ἰουδαϊκῶς
  choice: wie ein Jude
  rationale: Die parallele Wiedergabe zu ἐθνικῶς erhält den ausdrücklichen Gegensatz des griechischen Satzes.
- source_word: ἀναγκάζεις
  choice: zwingen
  rationale: „Zwingen“ bewahrt die deutliche Bedeutung von Druck oder Nötigung und ist im gegenwärtigen Deutsch natürlicher als „nötigen“.
- source_word: Ἰουδαΐζειν
  choice: wie Juden zu leben
  rationale: Der Infinitiv bezeichnet die Übernahme jüdischer Lebensweise. Die Formulierung ist klar, kontextnah und vermeidet spätere polemische Nebenbedeutungen des Fachworts „judaisieren“.
- source_word: πῶς
  choice: wie kannst du dann
  rationale: Die rhetorische Frage macht die Unstimmigkeit zwischen Kephas’ eigener Lebensweise und dem auf Nichtjuden ausgeübten Druck deutlich. Das deutsche „kannst du“ ist hier idiomatisch und bezeichnet nicht bloß Fähigkeit.
theological_decisions:
- issue: Wiedergabe von Ἰουδαΐζειν ohne spätere konfessionelle oder polemische Überlagerung
  choice: wie Juden zu leben
  alternative: zu judaisieren / jüdische Lebensgewohnheiten anzunehmen
  rationale: Im unmittelbaren Zusammenhang geht es um Lebenspraxis, besonders um Gemeinschaft über ethnisch-religiöse Grenzen hinweg. Die Übersetzung benennt dies, ohne den Ausdruck auf ein späteres theologisches System festzulegen.
- issue: Verhältnis des Verhaltens zur „Wahrheit des Evangeliums“
  choice: nicht geradlinig nach der Wahrheit des Evangeliums lebten
  alternative: nicht im Einklang mit der Wahrheit des Evangeliums handelten
  rationale: Die gewählte Fassung lässt die Wahrheit des Evangeliums als Maßstab des Handelns erkennen und bewahrt zugleich das im Verb enthaltene Wegbild.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtjude“ vermeidet die möglichen abwertenden oder religionsgeschichtlich verengenden Konnotationen von „Heide“. Die Wiederholung „wie ein Nichtjude … wie ein Jude … wie Juden“ bildet die auffällige Parallelität des Ausgangstextes nach.
