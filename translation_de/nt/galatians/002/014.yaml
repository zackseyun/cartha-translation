  verdict: revise
  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: Paulus spricht Kephas öffentlich an und stellt den Kontrast zwischen dessen eigener Lebensweise und dem auf Nichtjuden ausgeübten Zwang heraus. Die Formulierung „wie kannst du dann“ schwächt πῶς jedoch leicht zu einer Frage der Möglichkeit ab; „wie zwingst du“ gibt die direkte rhetorische Frage besser wieder. Die Fußnote a bezeichnet das Verb zudem unzutreffend als ein Zugehen „auf die Wahrheit“; ὀρθοποδεῖν evoziert gerades Gehen, während πρὸς hier die Ausrichtung bzw. Übereinstimmung mit der Wahrheit angibt.'
  naturalness: „Nicht geradlinig nach der Wahrheit des Evangeliums lebten“ ist im modernen Standarddeutsch keine natürliche Verbindung und wirkt semantisch unscharf. „Nicht im Einklang mit der Wahrheit des Evangeliums handelten“ ist idiomatisch und gibt die kontextuelle Bedeutung präzise wieder.
  terminology: „Kephas“ folgt dem griechischen Namen und ist beizubehalten. „Nichtjuden“ ist eine sachliche moderne Wiedergabe von τὰ ἔθνη in diesem Kontrast. „Wie Juden zu leben“ erklärt Ἰουδαΐζειν ohne späteres polemisches Fachvokabular.
