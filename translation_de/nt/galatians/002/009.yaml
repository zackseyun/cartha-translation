id: GAL.2.9
reference: Galatians 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: de
  text: 'Und als sie die Gnade erkannten, die mir gegeben worden war, reichten Jakobus, Kephas und Johannes, die als Säulen galten, Barnabas und mir die rechte Hand zum Zeichen der Gemeinschaft[a]: Wir sollten zu den Nichtjuden[b] gehen, sie aber zu den Beschnittenen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gaben Barnabas und mir die rechten Hände der Gemeinschaft“.'
    reason: Die Fußnote bewahrt den Plural δεξιάς und die kompakte griechische Wendung, während der Haupttext eine natürliche deutsche Redewendung verwendet.
  - marker: b
    text: 'Oder: „zu den Völkern“.'
    reason: ἔθνη kann wörtlich „Völker“ bedeuten, bezeichnet hier aber im Gegensatz zu den Beschnittenen die Nichtjuden.
  - marker: c
    text: 'Wörtlich: „zur Beschneidung“, das heißt zum jüdischen Volk.'
    reason: περιτομή ist eine metonymische Bezeichnung für die jüdischen Menschen.
lexical_decisions:
- source_word: γνόντες
  choice: als sie … erkannten
  rationale: Das Aoristpartizip nennt den vorausgehenden Grund für die anschließende Vereinbarung; „erkannten“ umfasst Wahrnehmung und Anerkennung.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: die Gnade, die mir gegeben worden war
  rationale: „Gnade“ bewahrt den für Paulus charakteristischen weiten Sinn göttlicher Zuwendung und Beauftragung; das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: Κηφᾶς
  choice: Kephas
  rationale: Der im griechischen Text verwendete Name wird beibehalten und nicht durch „Petrus“ ersetzt.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: die als Säulen galten
  rationale: Die Formulierung bezeichnet ihre anerkannte Stellung, ohne Paulus einen abwertenden Unterton zuzuschreiben.
- source_word: δεξιὰς … κοινωνίας
  choice: die rechte Hand zum Zeichen der Gemeinschaft
  rationale: Die im Deutschen geläufige Wendung gibt die förmliche Geste gegenseitiger Anerkennung natürlich wieder; „Gemeinschaft“ bewahrt die relationale und missionarische Weite von κοινωνία.
- source_word: ἔθνη
  choice: Nichtjuden
  rationale: Im Kontext bezeichnet der Ausdruck Menschen aus den Völkern im Gegensatz zum jüdischen Volk, nicht politische Nationen.
- source_word: περιτομήν
  choice: die Beschnittenen
  rationale: Das abstrakte Substantiv „Beschneidung“ steht metonymisch für das jüdische Volk; die personenbezogene Wiedergabe macht den Bezug verständlich und wahrt den Gegensatz.
theological_decisions:
- issue: Bedeutung von κοινωνία in der Vereinbarung
  choice: Gemeinschaft
  alternative: Partnerschaft
  rationale: „Gemeinschaft“ lässt sowohl gegenseitige Anerkennung als auch Zusammenarbeit im Auftrag anklingen, ohne den Begriff auf eine organisatorische Partnerschaft zu verengen.
- issue: Charakter der mit ἵνα eingeleiteten Aussage
  choice: „Wir sollten … gehen“ als Inhalt der Vereinbarung
  alternative: „damit wir … gingen“ als reine Zweckangabe
  rationale: Der griechische Satz lässt das Verb des Gehens aus und beschreibt knapp die vereinbarte Aufteilung der Missionsfelder. Die deutsche Fassung macht diese Ellipse verständlich, ohne eine absolute Trennung der Tätigkeiten zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit am Doppelpunkt gegliedert. „Kephas“ folgt der Namensform des griechischen Textes; „als Säulen galten“ wahrt die öffentliche Anerkennung ohne unnötig skeptischen Ton.
