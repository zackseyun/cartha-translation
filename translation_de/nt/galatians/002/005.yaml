source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: de
  text: Ihnen gaben wir nicht einmal für einen Augenblick[a] nach, indem wir uns ihnen unterordneten, damit die Wahrheit des Evangeliums für euch[b] bestehen bleibe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht einmal für eine Stunde“; gemeint ist: nicht einmal für kurze Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei euch“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Ihnen
  rationale: Das Dativpronomen verweist auf die zuvor genannten Personen zurück; „ihnen“ bewahrt diesen Bezug knapp und natürlich.
- source_word: οὐδὲ πρὸς ὥραν
  choice: nicht einmal für einen Augenblick
  rationale: Die wörtliche Zeitangabe „nicht einmal für eine Stunde“ dient idiomatisch zur Bezeichnung auch nur einer sehr kurzen Zeit; „für einen Augenblick“ vermittelt ihre Aussage im heutigen Deutsch.
- source_word: εἴξαμεν
  choice: gaben wir … nach
  rationale: Das Verb bezeichnet Nachgeben oder Zurückweichen und bleibt so von der folgenden Unterordnung unterschieden.
- source_word: τῇ ὑποταγῇ
  choice: indem wir uns unterordneten
  rationale: Die Dativform beschreibt die Art des Nachgebens. Die verbale Wiedergabe ist im Deutschen verständlich und lässt offen, ob persönliche oder weitergehende Unterordnung gemeint ist.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck der Weigerung klar wieder.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: die Wahrheit des Evangeliums
  rationale: Die etablierte paulinische Wendung wird direkt und ohne erklärende Erweiterung wiedergegeben.
- source_word: διαμείνῃ
  choice: erhalten bliebe
  rationale: Das Verb bezeichnet ein fortdauerndes Bestehen; im Zusammenhang hebt „erhalten bliebe“ die beabsichtigte Bewahrung hervor.
- source_word: πρὸς ὑμᾶς
  choice: für euch
  rationale: Die Präpositionalfügung kann hier die Ausrichtung auf die galatischen Adressaten beziehungsweise ihren Nutzen ausdrücken; „für euch“ bewahrt diese Lesart, während „bei euch“ ebenfalls möglich ist.
theological_decisions:
- issue: Reichweite der verweigerten Unterordnung
  choice: Paulus und seine Begleiter gaben den zuvor genannten Personen überhaupt nicht durch Unterordnung nach.
  alternative: Die Aussage könne enger nur persönliche Unterordnung oder weiter eine institutionelle Konzession bezeichnen.
  rationale: Der griechische Wortlaut bestimmt die Art des Nachgebens als Unterordnung, legt deren persönliche oder institutionelle Reichweite aber nicht eindeutig fest. Die Übersetzung wahrt diese Spannung.
- issue: Bezug von πρὸς ὑμᾶς
  choice: Die Wahrheit des Evangeliums sollte zugunsten der Adressaten erhalten bleiben.
  alternative: Die Wahrheit des Evangeliums sollte bei beziehungsweise unter den Adressaten fortbestehen.
  rationale: Die Präposition erlaubt im Kontext mehr als eine Nuance. Der Haupttext wählt die auf die Adressaten ausgerichtete Lesart, während die örtlich-relationale Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem argumentativen Zusammenhang des griechischen Textes nahe, ohne unnatürlich wörtlich zu wirken. „Evangelium“ wird als allgemein verständlicher theologischer Schlüsselbegriff beibehalten.
