base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: de
  text: Doch nicht einmal Titus, der bei mir war, wurde, obwohl er Grieche[a] war[b], gezwungen, sich beschneiden zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Zusammenhang legt „Grieche“ nahe, dass Titus nichtjüdisch und unbeschnitten war. Der griechische Text verwendet jedoch ausdrücklich „Grieche“.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „ein Grieche seiend“; auch rein beschreibend möglich: „der bei mir war und Grieche war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorausgehenden Gedankengang; „doch“ ist im Deutschen knapp und natürlich.
- source_word: οὐδὲ
  choice: nicht einmal
  rationale: Bewahrt die nachdrückliche Verneinung, die sich auf Titus richtet.
- source_word: Τίτος
  choice: Titus
  rationale: Entspricht der üblichen deutschen Namensform.
- source_word: ὁ σὺν ἐμοί
  choice: der bei mir war
  rationale: Gibt die substantivierte Präpositionalfügung klar wieder, ohne eine engere Beziehung wie „Mitarbeiter“ oder „Begleiter“ hinzuzufügen.
- source_word: Ἕλλην ὤν
  choice: obwohl er Grieche war
  rationale: Gibt die im Zusammenhang naheliegende konzessive Funktion der Partizipialfügung in natürlichem Deutsch wieder; die formal offenere Lesart wird in einer Fußnote bewahrt.
- source_word: Ἕλλην
  choice: Grieche
  rationale: Bewahrt die konkrete Bezeichnung des griechischen Textes, statt sie verallgemeinernd mit „Nichtjude“ wiederzugeben.
- source_word: ἠναγκάσθη
  choice: wurde … gezwungen
  rationale: Das Passiv bezeichnet äußeren Zwang oder starken Druck.
- source_word: περιτμηθῆναι
  choice: sich beschneiden zu lassen
  rationale: Ist die natürliche deutsche Wiedergabe des passiven Infinitivs und hält fest, dass Titus die Beschneidung an sich hätte vornehmen lassen müssen.
theological_decisions:
- issue: Konkrete ethnisch-kulturelle Bezeichnung oder religiöse Verallgemeinerung bei Ἕλλην
  choice: Grieche
  alternative: Nichtjude
  rationale: Der Ausgangstext sagt ausdrücklich „Grieche“. Im Zusammenhang schließt dies den nichtjüdischen und unbeschnittenen Status ein, doch die Übersetzung soll die konkrete Bezeichnung nicht durch eine Deutung ersetzen.
- issue: Funktion der Partizipialfügung Ἕλλην ὤν
  choice: 'konzessiv: „obwohl er Grieche war“'
  alternative: 'begleitend-beschreibend: „der Grieche war“'
  rationale: Der Kontrast zwischen Titus’ griechischer Herkunft und dem fehlenden Zwang zur Beschneidung legt die konzessive Wiedergabe nahe. Da das griechische Partizip die Beziehung nicht ausdrücklich markiert, wird die offenere Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am griechischen Aufbau, ohne im Deutschen schwerfällig zu wirken.
