  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: de
  text: Wir sind von Geburt an Juden und keine Sünder aus den Völkern[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier für „von Geburt an“: „von Natur“; gemeint ist die natürliche beziehungsweise ethnische Herkunft.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „nichtjüdische Sünder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Wir
  rationale: Das ausdrücklich gesetzte Pronomen bewahrt die leichte Hervorhebung, ohne sie im Deutschen zu überzeichnen.
- source_word: φύσει
  choice: von Geburt
  rationale: Hier bezeichnet der Ausdruck die natürliche beziehungsweise ethnische Herkunft, nicht eine innere moralische Beschaffenheit.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Die substantivische Wiedergabe entspricht dem ethnischen Gegensatz des Verses und ist im modernen Deutsch natürlich.
- source_word: ἐξ ἐθνῶν
  choice: aus den anderen Völkern
  rationale: Die Formulierung bildet die Präposition ἐξ ab und macht den Gegensatz zwischen Juden und den übrigen Völkern verständlich, ohne das kirchlich geprägte Wort „Heiden“ zu verwenden.
- source_word: ἁμαρτωλοί
  choice: Sünder
  rationale: Der direkte und theologisch gewichtige Ausdruck bleibt erhalten; die im Kontext aufgegriffene jüdische Gegenüberstellung wird nicht abgeschwächt.
theological_decisions:
- issue: Ob Paulus hier eine moralische Überlegenheit der Juden gegenüber den Nichtjuden behauptet
  choice: Die knappe ethnisch-religiöse Gegenüberstellung bleibt unkommentiert im Haupttext stehen.
  alternative: „nicht solche, die wie Menschen aus den anderen Völkern als Sünder gelten“
  rationale: Der griechische Wortlaut formuliert direkt und lässt erst der weitere Zusammenhang die Spannung entfalten. Eine erklärende Einschränkung würde diese Auslegung vorwegnehmen.
- issue: Zuordnung von ἐξ ἐθνῶν zu ἁμαρτωλοί
  choice: „Sünder aus den anderen Völkern“
  alternative: „nichtjüdische Sünder“
  rationale: Die gewählte Fassung wahrt die griechische Präpositionalstruktur; die kompaktere attributive Lesart ist ebenfalls möglich und wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Andere Völker“ vermeidet die heute oft missverständliche oder abwertend wirkende Bezeichnung „Heiden“, während „Sünder“ als prägnanter paulinischer Begriff erhalten bleibt. Die Zeichensetzung mit Komma trägt dem fortlaufenden Satz in Galater 2,15–16 Rechnung.
