id: GAL.2.17
reference: Galatians 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: de
  text: Wenn wir aber danach streben, im Messias[a] gerechtfertigt zu werden, und dabei auch wir selbst als Sünder befunden wurden, ist der Messias dann etwa ein Diener der Sünde? Auf keinen Fall!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort Christos bedeutet »Messias« und wird traditionell mit »Christus« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: danach streben
  rationale: Das präsentische Partizip bezeichnet das fortdauernde Bemühen, gerechtfertigt zu werden; die Einbindung in den deutschen Hauptsatz gibt den begleitenden Umstand natürlich wieder.
- source_word: δικαιωθῆναι
  choice: gerechtfertigt zu werden
  rationale: Bewahrt den etablierten paulinischen Begriff und die Passivform, ohne ausdrücklich festzulegen, ob der Akzent auf Erklärung, Anerkennung oder Herstellung von Gerechtigkeit liegt.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Bewahrt die Präposition ἐν und gibt Χριστός als Titel wieder. Die relationale Weite von »in« wird nicht durch ein enger deutendes »durch« ersetzt.
- source_word: εὑρέθημεν
  choice: befunden wurden
  rationale: Erhält die Passivform und die feststellende rhetorische Kraft, ohne die Art dieser Feststellung näher auszudeuten.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: dabei auch selbst als Sünder
  rationale: »auch selbst« bildet die Betonung durch καὶ αὐτοί ab; »als Sünder« gibt das prädikative ἁμαρτωλοί idiomatisch wieder.
- source_word: ἁμαρτίας διάκονος
  choice: ein Diener der Sünde
  rationale: »Diener« gibt διάκονος natürlich wieder und bewahrt die zugespitzte Verbindung zur Sünde, ohne ein kirchliches Amt anzudeuten.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Eine kräftige, aktuelle deutsche Zurückweisung, die der nachdrücklichen griechischen Verneinungsform entspricht.
theological_decisions:
- issue: Ob die rhetorische Frage so formuliert werden soll, als bewirke der Messias die Sünde.
  choice: ist der Messias dann etwa ein Diener der Sünde?
  alternative: macht der Messias uns dann zu Sündern?
  rationale: Der griechische Text fragt nach der vermeintlichen Folgerung, Christus sei ἁμαρτίας διάκονος. Die gewählte Form bewahrt diese theologische Spannung, ohne die zurückgewiesene Folgerung als Aussage oder als Verursachung der Sünde auszugeben.
- issue: Bedeutungsumfang von ἐν Χριστῷ
  choice: im Messias
  alternative: durch den Messias
  rationale: »Im Messias« erhält die offene relationale Formulierung des Griechischen; »durch« würde sie stärker instrumental festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der griechischen Argumentation, wird aber durch »dabei« lesbarer. »Auf keinen Fall!« vermittelt die starke Zurückweisung idiomatischer als eine wörtlich-optativische Formulierung.
