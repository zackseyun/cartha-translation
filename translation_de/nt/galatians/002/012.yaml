id: GAL.2.12
reference: Galatians 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: de
  text: Denn bevor einige von Jakobus kamen[a], pflegte er, mit den Nichtjuden zu essen. Als sie aber kamen, zog er sich zurück und sonderte sich ab, aus Furcht vor den Beschnittenen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck kann auch »aus dem Kreis des Jakobus« bedeuten; er lässt offen, ob Jakobus diese Leute ausdrücklich gesandt hatte.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »denen aus der Beschneidung«; der Ausdruck kann eine durch Beschneidung gekennzeichnete Gruppe bezeichnen, ohne ausdrücklich eine Partei zu benennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: bevor ... gekommen waren
  rationale: Gibt die Vorzeitigkeit der mit πρό gebildeten Infinitivkonstruktion im Deutschen natürlich wieder.
- source_word: τινας
  choice: einige Leute
  rationale: Bewahrt die unbestimmte Personenangabe und klingt im heutigen Deutsch natürlich.
- source_word: ἀπὸ Ἰακώβου
  choice: aus dem Umfeld des Jakobus
  rationale: Drückt Herkunft beziehungsweise Zugehörigkeit aus, ohne zu behaupten, Jakobus habe die Leute ausdrücklich gesandt oder ihren Standpunkt gebilligt.
- source_word: μετὰ τῶν ἐθνῶν
  choice: mit den Nichtjuden
  rationale: ἔθνη bezeichnet hier im paulinischen Zusammenhang Menschen nichtjüdischer Herkunft; „Gläubige“ steht nicht ausdrücklich im Text.
- source_word: συνήσθιεν
  choice: pflegte ... zu essen
  rationale: Gibt den durativen beziehungsweise gewohnheitsmäßigen Sinn des Imperfekts wieder.
- source_word: ὑπέστελλεν
  choice: begann er, sich zurückzuziehen
  rationale: Vermittelt den einsetzenden und fortschreitenden Rückzug, den das Imperfekt im Zusammenhang nahelegt.
- source_word: ἀφώριζεν ἑαυτόν
  choice: sich abzusondern
  rationale: Bewahrt die reflexive Bedeutung und bezeichnet die soziale Trennung, ohne ihren Umfang weiter auszudeuten.
- source_word: φοβούμενος
  choice: weil er sich ... fürchtete
  rationale: Macht den im Partizip liegenden kausalen Zusammenhang in natürlichem Deutsch deutlich.
- source_word: τοὺς ἐκ περιτομῆς
  choice: die Beschnittenen
  rationale: Gibt die Bezeichnung der Gruppe knapp wieder, ohne sie im Haupttext ausdrücklich als organisierte Partei festzulegen.
theological_decisions:
- issue: Ob ἀπὸ Ἰακώβου eine Beauftragung oder Billigung durch Jakobus ausdrückt
  choice: aus dem Umfeld des Jakobus
  alternative: von Jakobus; von Jakobus gesandt
  rationale: Die griechische Formulierung bezeichnet Herkunft oder Verbindung, sagt aber nicht ausdrücklich, dass Jakobus diese Leute beauftragt oder ihre Haltung gebilligt hatte.
- issue: Ob τοὺς ἐκ περιτομῆς eine fest umrissene Partei bezeichnet
  choice: die Beschnittenen
  alternative: die Beschneidungspartei; die Leute aus dem Kreis der Beschnittenen
  rationale: Der griechische Ausdruck kennzeichnet die Gruppe durch die Beschneidung, nennt sie jedoch nicht ausdrücklich eine Partei.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Nichtjuden“ ist klarer als das heute teils missverständliche „Heiden“. Die wiederholte reflexive Formulierung bildet den schrittweisen Rückzug des Petrus ab.
