id: GAL.2.20
reference: Galatians 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: de
  text: Ich lebe – doch nicht mehr ich, sondern der Messias lebt in mir. Und das Leben, das ich jetzt im Fleisch lebe, lebe ich im Glauben an den Sohn Gottes[a], der mich geliebt und sich selbst für mich hingegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch die Treue des Sohnes Gottes«.'
    reason: Der griechische Genitiv kann sowohl den Sohn Gottes als Gegenstand des Glaubens als auch seine eigene Treue bezeichnen.
lexical_decisions:
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός wird als Titel mit »Messias« übersetzt; der bestimmte Artikel ist im Deutschen für die natürliche Formulierung erforderlich.
- source_word: ὃ δὲ νῦν ζῶ
  choice: das Leben, das ich jetzt … lebe
  rationale: Die elliptische griechische Relativkonstruktion wird im Deutschen durch das sinngemäß vorausgesetzte »Leben« verständlich gemacht, ohne den Aussagegehalt zu erweitern.
- source_word: ἐν σαρκί
  choice: im Fleisch
  rationale: Die Formulierung bewahrt den paulinischen Schlüsselbegriff und bezeichnet hier das gegenwärtige leiblich-irdische Leben, ohne ihn als »sündige Natur« auszudeuten.
- source_word: πίστει
  choice: im Glauben
  rationale: »Glaube« ist die naheliegende Wiedergabe von πίστις; die durch den Genitiv entstehende Deutungsalternative wird in einer Fußnote bewahrt.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: an den Sohn Gottes
  rationale: Der Haupttext versteht den Genitiv objektiv und formuliert idiomatisch »Glaube an den Sohn Gottes«; die grammatisch mögliche subjektive Deutung wird in der Fußnote genannt.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: sich selbst für mich hingegeben hat
  rationale: Die Wendung gibt sowohl die freiwillige Selbsthingabe als auch das stellvertretende »für mich« natürlich und eng am griechischen Ausdruck wieder.
theological_decisions:
- issue: Deutung von πίστις mit dem Genitiv τοῦ υἱοῦ τοῦ θεοῦ
  choice: im Glauben an den Sohn Gottes
  alternative: in der Treue des Sohnes Gottes
  rationale: Die Genitivverbindung kann objektiv oder subjektiv verstanden werden. Der Haupttext verwendet die im Deutschen unmittelbar verständliche objektive Lesart, während die Fußnote die echte syntaktische und theologische Mehrdeutigkeit ausdrücklich erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bewahrt die zugespitzte paradoxe Betonung von »nicht mehr ich«. Die bewusste Wiederholung von »Leben/leben« spiegelt die griechische Ausdrucksweise; »im Fleisch« bleibt als paulinischer Begriff stehen.
