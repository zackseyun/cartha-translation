id: GAL.2.19
reference: Galatians 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: de
  text: Denn durch das Gesetz bin ich dem Gesetz gestorben, damit ich für Gott lebe. Mit dem Messias bin ich gekreuzigt worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet die Begründung des vorausgehenden Gedankens und wahrt den argumentativen Zusammenhang.
- source_word: διὰ νόμου
  choice: durch das Gesetz
  rationale: διά mit Genitiv bezeichnet hier das Mittel. Obwohl im Griechischen kein Artikel steht, legt der paulinische Zusammenhang die bestimmte Wiedergabe „das Gesetz“ nahe.
- source_word: νόμῳ
  choice: dem Gesetz
  rationale: Der Dativ wird zusammen mit „gestorben“ idiomatisch als „dem Gesetz gestorben“ wiedergegeben und bezeichnet das Ende der bisherigen Beziehung zu dessen Anspruch, ohne dies näher auszudeuten.
- source_word: ἀπέθανον
  choice: bin ich … gestorben
  rationale: Das deutsche Perfekt gibt das punktuelle Geschehen des Aorists in natürlichem Gegenwartsdeutsch wieder.
- source_word: ἵνα
  choice: damit
  rationale: Bringt den Zweck klar und knapp zum Ausdruck.
- source_word: θεῷ ζήσω
  choice: ich für Gott lebe
  rationale: „Für Gott leben“ ist im modernen Deutschen die natürliche Wiedergabe des Dativs und bewahrt dessen relationale Ausrichtung.
- source_word: Χριστῷ
  choice: mit dem Messias
  rationale: Der Dativ bezeichnet die Gemeinschaft mit dem Messias im Geschehen; „Messias“ wahrt den Titelsinn von Χριστός.
- source_word: συνεσταύρωμαι
  choice: bin ich gekreuzigt worden
  rationale: Die Form bezeichnet ein vollzogenes Mitgekreuzigtwerden mit fortwirkender Bedeutung. Das deutsche Passivperfekt hält den vollzogenen Vorgang deutlich fest.
theological_decisions:
- issue: Die genaue Bedeutung von „durch das Gesetz dem Gesetz gestorben“
  choice: Die knappe, spannungsvolle Formulierung bleibt ohne erklärenden Zusatz stehen.
  alternative: „Durch die Verurteilung des Gesetzes bin ich dem Gesetz gestorben“ oder „Durch das Gesetz wurde ich von der Gesetzesbefolgung frei“.
  rationale: Der griechische Text erläutert weder, auf welche Weise das Gesetz den Tod bewirkt, noch reduziert er „dem Gesetz gestorben“ auf eine einzelne dogmatische Deutung.
- issue: Titel oder Eigenname bei Χριστός
  choice: Messias
  alternative: Christus
  rationale: Hier bleibt der Titelsinn erkennbar; die Übersetzung vermeidet es, Χριστός lediglich als unübersetzten Eigennamen zu behandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederholung „durch das Gesetz … dem Gesetz“ wird bewusst beibehalten, weil sie die prägnante theologische Spannung des griechischen Satzes trägt.
