source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: de
  text: Dann zog ich nach vierzehn Jahren wieder zusammen mit Barnabas nach Jerusalem hinauf und nahm auch Titus mit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Dann
  rationale: Setzt die Erzählung mit einem natürlichen deutschen Zeit- und Folgewort fort.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: nach vierzehn Jahren
  rationale: Die Zeitangabe mit διά und Genitiv bezeichnet hier idiomatisch den Ablauf eines Zeitraums bis zum nächsten Ereignis.
- source_word: πάλιν
  choice: wieder
  rationale: Kennzeichnet die Reise als erneuten Gang nach Jerusalem, ohne darüber hinaus festzulegen, wie viele Reisen insgesamt gemeint sind.
- source_word: ἀνέβην
  choice: zog ich ... hinauf
  rationale: Bewahrt die im Ausgangstext ausgedrückte Aufwärtsbewegung nach Jerusalem und klingt im Deutschen als Reiseangabe natürlich.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Gibt die Zielrichtung der Präposition εἰς im Deutschen idiomatisch wieder.
- source_word: μετὰ Βαρναβᾶ
  choice: zusammen mit Barnabas
  rationale: Drückt die Begleitung klar und unmittelbar aus.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: auch Titus nahm ich mit
  rationale: Gibt das begleitende Partizip als natürliche deutsche Nebenhandlung wieder; καί wird in seinem additiven Sinn mit „auch“ wiedergegeben.
theological_decisions:
- issue: Bezugspunkt der vierzehn Jahre
  choice: Im Haupttext bleibt offen, von welchem früheren Ereignis an die vierzehn Jahre gerechnet werden.
  alternative: Ausdrücklich auf den vorherigen Jerusalembesuch oder auf die Berufung/Bekehrung des Paulus beziehen.
  rationale: Der griechische Satz nennt keinen ausdrücklichen Ausgangspunkt; eine Festlegung würde eine exegetische Entscheidung in den Text eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Semikolon-Konstruktion macht deutlich, dass Barnabas als Begleiter genannt wird und Paulus zusätzlich Titus mitnahm, ohne den griechischen Satz unnötig zu verkomplizieren.
