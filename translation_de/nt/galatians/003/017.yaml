  naturalness: „Das meine ich“ und die Satzführung sind modernes, verständliches Standarddeutsch. „zuvor rechtskräftig bestätigt“ ist etwas redundant und juristisch schwerer als erforderlich; „zuvor von Gott bestätigten“ ist natürlich und präzise.
  terminology: „Bund“, „Gesetz“ und „Verheißung“ entsprechen dem paulinischen Kontext und sind terminologisch angemessen. „außer Kraft setzen“ gibt καταργέω im rechtlich-argumentativen Zusammenhang gut wieder.
