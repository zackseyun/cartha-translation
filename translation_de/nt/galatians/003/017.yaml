source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: de
  text: 'Das meine ich: Das Gesetz, das vierhundertdreißig Jahre später kam, hebt einen zuvor von Gott bestätigten Bund nicht auf[a], um die Verheißung außer Kraft zu setzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »macht … nicht ungültig«; »setzt … nicht außer Kraft«.'
    reason: lexikalische Alternative zu οὐκ ἀκυροῖ
  - marker: b
    text: 'Oder, mit stärkerem Ergebnisakzent: »sodass die Verheißung außer Kraft gesetzt wird«.'
    reason: εἰς τὸ mit Infinitiv kann hier Ziel oder Folge akzentuieren.
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Das meine ich
  rationale: Eine natürliche deutsche Einleitung zu Paulus’ Erläuterung; δέ wird im Zusammenhang durch den Übergang mitgetragen, ohne ein zeitliches »nun« einzuführen.
- source_word: διαθήκην
  choice: einen … Bund
  rationale: Im Zusammenhang geht es um Gottes Zusage an Abraham; »Bund« gibt den heilsgeschichtlichen und rechtlichen Sinn angemessen wieder.
- source_word: προκεκυρωμένην
  choice: zuvor rechtskräftig bestätigt
  rationale: Gibt sowohl die zeitliche Vorordnung durch προ- als auch die fortbestehende Gültigkeit des Perfektpartizips und den rechtlichen Klang des Verbs wieder.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Direkte Wiedergabe der handelnden Person ohne zusätzliche Betonung.
- source_word: ὁ … γεγονὼς νόμος
  choice: das Gesetz, das … kam
  rationale: Natürliches Deutsch für das spätere geschichtliche Eintreten des Gesetzes.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: vierhundertdreißig Jahre später
  rationale: Gibt den zeitlichen Abstand klar und idiomatisch wieder.
- source_word: οὐκ ἀκυροῖ
  choice: hebt … nicht auf
  rationale: Bewahrt den rechtlichen Sinn des Ungültigmachens in verständlichem modernem Deutsch.
- source_word: εἰς τὸ καταργῆσαι
  choice: sodass es … außer Kraft setzen würde
  rationale: Gibt die Ziel- beziehungsweise Ergebnisbeziehung wieder, ohne sie stärker als nötig auf eine einzige Kategorie festzulegen; der Konjunktiv verdeutlicht die verneinte Folge.
- source_word: τὴν ἐπαγγελίαν
  choice: die Verheißung
  rationale: »Verheißung« ist im biblisch-theologischen Zusammenhang präzise, geläufig und verweist auf Gottes Zusage an Abraham.
theological_decisions:
- issue: Bedeutung von διαθήκη in Paulus’ Argument
  choice: Bund
  alternative: Testament; rechtsverbindliche Verfügung
  rationale: Der Kontext behandelt Gottes frühere Verheißung an Abraham. »Bund« bewahrt diese heilsgeschichtliche Argumentation, ohne den Ausdruck auf ein späteres Testament im erbrechtlichen Sinn zu verengen.
- issue: Verhältnis von εἰς τὸ καταργῆσαι zum vorangehenden Satz
  choice: als verneinte Ziel- oder Ergebnisfolge offen formuliert
  alternative: 'ausschließlich als Absicht: »mit dem Ziel, …«; ausschließlich als Ergebnis: »mit der Folge, …«'
  rationale: Die griechische Konstruktion kann Ziel oder Ergebnis akzentuieren. »Sodass … würde« bewahrt die Aussage, dass das spätere Gesetz die Verheißung nicht unwirksam macht, ohne die grammatische Spannung unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von »Einen … Bund« spiegelt den Fokus des griechischen Satzes, bleibt aber gut verständlich. Rechtliche Ausdrücke wie »rechtskräftig bestätigt«, »aufheben« und »außer Kraft setzen« erhalten den argumentativen Charakter des Verses.
