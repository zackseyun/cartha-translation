revisions:
- from: Da ist weder Jude noch Grieche, da ist weder Sklave noch freier Mensch, da ist nicht männlich und weiblich[a]; denn ihr alle seid einer im Messias Jesus[b].
  to: Es gibt weder Juden noch Griechen, weder Sklaven noch Freie, nicht männlich und weiblich[a]; denn ihr alle seid eins in Jesus, dem Messias[b].
  rationale: Die Revision beseitigt die unidiomatische und potenziell missverständliche Formulierung „seid einer“, ohne die knappe Aussage über die Einheit in Christus interpretativ zu erweitern. Sie glättet außerdem die existenzielle Reihung zu modernem Deutsch, bewahrt aber im dritten Paar bewusst „männlich und weiblich“ statt eines nivellierenden „weder … noch“. Die Fußnotenanker bleiben an den sachlich erläuterten Stellen erhalten.
