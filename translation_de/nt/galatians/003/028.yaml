source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: de
  text: Es gibt weder Juden noch Griechen, weder Sklaven noch Freie, nicht männlich und weiblich[a]; denn ihr alle seid eins in Jesus, dem Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier anders als bei den beiden vorherigen Paaren nicht die Verbindung „weder … noch“, sondern „männlich und weiblich“. Dies klingt wahrscheinlich an 1. Mose 1,27 an.
    reason: Der Wechsel zu καὶ („und“) und der mögliche Anklang an die Schöpfungsaussage sollen sichtbar bleiben.
  - marker: b
    text: Griechisch „in Christus Jesus“; Χριστός wird hier als der Titel „Messias“ wiedergegeben.
    reason: Die Fußnote nennt die geläufige alternative Wiedergabe und erklärt die Übersetzung des Titels.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: da ist weder / da ist nicht
  rationale: Die wiederholte existentielle Verneinung wird im Deutschen idiomatisch und zugleich nachdrücklich wiedergegeben. Bei den ersten beiden Gegensatzpaaren entspricht „weder … noch“ dem οὐκ … οὐδὲ; beim dritten Paar bleibt der Wechsel zu καὶ („und“) sichtbar.
- source_word: Ἰουδαῖος … Ἕλλην
  choice: Jude … Grieche
  rationale: Die konkrete ethnisch-religiöse Gegenüberstellung des griechischen Textes bleibt erhalten; Ἕλλην wird nicht zum weiter gefassten „Nichtjude“ verallgemeinert.
- source_word: δοῦλος … ἐλεύθερος
  choice: Sklave … freier Mensch
  rationale: „Sklave“ bezeichnet den rechtlich und gesellschaftlich unfreien Status klar. „Freier Mensch“ ist im heutigen Deutsch verständlicher und weniger missverständlich als das substantivierte „Freier“.
- source_word: ἄρσεν καὶ θῆλυ
  choice: männlich und weiblich
  rationale: Die geschlechtsspezifischen Begriffe und das ausdrücklich verwendete καὶ („und“) werden bewahrt; zugleich bleibt der wahrscheinliche Anklang an 1. Mose 1,27 erkennbar.
- source_word: πάντες … ὑμεῖς
  choice: ihr alle
  rationale: Die direkte Anrede und die umfassende Betonung werden natürlich und vollständig wiedergegeben.
- source_word: εἷς
  choice: einer
  rationale: Das maskuline Singularprädikat wird nicht zum neutralen „eins“ eingeebnet. Die knappe Form wahrt die mögliche Vorstellung einer korporativen Einheit, ohne sie erklärend auszubauen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: Χριστός wird hier als Titel „Messias“ wiedergegeben; die Reihenfolge des griechischen Ausdrucks bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von ἄρσεν καὶ θῆλυ
  choice: nicht männlich und weiblich
  alternative: weder männlich noch weiblich
  rationale: Paulus wechselt bei diesem Paar von οὐδέ zu καί. Die formal auffällige Wendung bewahrt sowohl diesen Unterschied als auch den möglichen Rückbezug auf die Schöpfungsaussage in 1. Mose 1,27.
- issue: Deutung von εἷς ἐστε
  choice: ihr alle seid einer
  alternative: ihr seid alle eins / ihr seid alle vereint
  rationale: „Einer“ folgt dem maskulinen εἷς und lässt offen, wie die korporative Einheit näher zu verstehen ist. Die Übersetzung behauptet weder die Aufhebung aller Unterschiede noch schwächt sie die ausgesagte Einheit zu bloßer Einigkeit ab.
- issue: Titel Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Wiedergabe als „Messias“ macht den Titelcharakter kenntlich und vermeidet, Χριστός lediglich wie einen Namensbestandteil zu behandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Satzstruktur bewahrt den rhetorischen Nachdruck. Die bewusst markierten Formulierungen „nicht männlich und weiblich“ und „seid einer“ folgen sprachlichen Besonderheiten des Ausgangstextes, ohne dessen Spannung durch eine glättende Paraphrase aufzulösen.
