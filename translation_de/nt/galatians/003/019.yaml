  to: Wozu also das Gesetz? Es wurde wegen der Übertretungen hinzugefügt,[a] bis der Nachkomme[b] käme, dem die Verheißung zugesagt war, durch Engel angeordnet durch einen Vermittler.
  rationale: Die Revision stellt den Zusagecharakter von ἐπήγγελται klarer dar, bindet διαταγείς wieder direkt an das Gesetz und formuliert die Erläuterung zu τῶν παραβάσεων χάριν ohne einseitige Zweckfestlegung. Die Singularform von σπέρμα und die unbestimmte Identität des μεσίτης bleiben gewahrt.
