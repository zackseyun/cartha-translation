    issue: „dem die Verheißung galt“
    rationale: ἐπήγγελται ist ein Perfekt Passiv und bezeichnet, dass dem Bezugswort die Verheißung zugesagt worden ist bzw. war. „Galt“ kann lediglich die Gültigkeit oder Anwendbarkeit einer Verheißung ausdrücken und schwächt den Zusageakt ab.
  - severity: medium
    issue: Abtrennung von „wurde … angeordnet“ in einen neuen Satz
    rationale: διαταγείς ist ein Partizip, das sich auf das Gesetz bezieht. Die Wiederaufnahme mit „Es wurde“ ist möglich, macht die Beziehung aber weniger unmittelbar. Eine Partizipialfügung bewahrt Syntax und Aussagezusammenhang besser.
