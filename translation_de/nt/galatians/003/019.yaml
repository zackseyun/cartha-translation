id: GAL.3.19
reference: Galatians 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: de
  text: Wozu also das Gesetz? Es wurde wegen der Übertretungen hinzugefügt,[a] bis der Nachkomme[b] käme, dem die Verheißung zugesagt war, durch Engel angeordnet durch einen Vermittler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wegen der Übertretungen“ kann meinen, dass das Gesetz im Blick auf Übertretungen gegeben wurde, etwa um sie aufzudecken oder einzudämmen; das Griechische legt dies nicht genauer fest.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „der Same“; auch „der Nachkomme“ oder „die Nachkommenschaft“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Wozu also das Gesetz?
  rationale: Die elliptische Frage zielt im Argumentationsgang auf Zweck und Funktion des Gesetzes, nicht auf eine Definition seines Wesens.
- source_word: τῶν παραβάσεων χάριν
  choice: wegen der Übertretungen
  rationale: Die Wendung bewahrt die im Griechischen nicht näher bestimmte Beziehung zwischen Gesetz und Übertretungen; sie kann Anlass oder Zweck bezeichnen.
- source_word: προσετέθη
  choice: wurde … hinzugefügt
  rationale: Gibt den Aorist Passiv direkt wieder und wahrt den Gedanken einer nachträglichen Hinzufügung.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: bis … käme
  rationale: Der Konjunktiv gibt das vom damaligen Standpunkt aus erwartete Eintreffen eines Endpunkts natürlich wieder.
- source_word: τὸ σπέρμα
  choice: der Nachkomme
  rationale: Im modernen Deutschen bezeichnet „Nachkomme“ eine Person natürlich und hält zugleich den Singular fest, der im unmittelbaren Kontext argumentativ bedeutsam ist; die wörtlichere Wiedergabe steht in der Fußnote.
- source_word: ᾧ ἐπήγγελται
  choice: dem die Verheißung galt
  rationale: Gibt den Dativ und den fortbestehenden Bezug der perfektischen Verheißung knapp und idiomatisch wieder, ohne einen nicht ausdrücklich genannten Handelnden einzusetzen.
- source_word: διαταγεὶς
  choice: wurde … angeordnet
  rationale: „Angeordnet“ spiegelt die formelle Einrichtung oder Verfügung des Gesetzes wider und passt zum gehobenen, aber verständlichen Register.
- source_word: δι’ ἀγγέλων
  choice: durch Engel
  rationale: Bewahrt die vermittelte Mitwirkung der Engel.
- source_word: ἐν χειρὶ μεσίτου
  choice: durch die Hand eines Vermittlers
  rationale: Erhält das konkrete griechische Idiom, bleibt im Deutschen verständlich und vermeidet die vorschnelle Identifikation des nicht genannten Vermittlers.
theological_decisions:
- issue: Bedeutung von „wegen der Übertretungen“
  choice: Die knappe kausale beziehungsweise finale Wendung bleibt unbestimmt.
  alternative: um Übertretungen aufzudecken, einzudämmen oder hervorzurufen
  rationale: Der griechische Ausdruck legt keine dieser theologischen Deutungen eindeutig fest; die Übersetzung wahrt diese Spannung.
- issue: Wiedergabe von σπέρμα im paulinischen Argument
  choice: Nachkomme im Haupttext, „Same“ als wörtlichere Fußnotenalternative
  alternative: Same; Nachkommenschaft
  rationale: „Nachkomme“ ist für eine einzelne Person im heutigen Deutsch verständlicher und erhält den Singular; die Fußnote sichert die Wortverbindung zur Verheißung an Abraham.
- issue: Identität des μεσίτης
  choice: ein Vermittler
  alternative: der Vermittler oder eine namentliche Identifikation
  rationale: Der griechische Text nennt an dieser Stelle weder Namen noch eindeutige Identität; der unbestimmte Artikel bewahrt dies.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Eingangsfrage wird zweckbezogen wiedergegeben. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die syntaktische Beziehung des Partizips zum Gesetz bleibt erhalten.
