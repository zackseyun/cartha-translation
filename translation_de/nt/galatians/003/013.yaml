source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: de
  text: 'Christus[a] hat uns vom Fluch des Gesetzes freigekauft, indem er für uns[b] zum Fluch wurde. Denn[c] es steht geschrieben: »Verflucht ist jeder, der an einem Holz[d] hängt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Messias“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „zu unseren Gunsten“; möglicherweise: „an unserer Stelle“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „weil geschrieben steht“.'
    reason: lexical_alternative
  - marker: d
    text: Das griechische ξύλον kann „Holz“ oder „Baum“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Christus
  rationale: „Christus“ ist im Deutschen die geläufige und würdige Wiedergabe des Titels; die Bedeutung „Messias“ bleibt als Alternative in der Fußnote sichtbar.
- source_word: ἐξηγόρασεν
  choice: hat … freigekauft
  rationale: Bewahrt sowohl den Gedanken der Befreiung als auch das im Verb enthaltene Bild des Loskaufs, ohne es unnötig auszudeuten.
- source_word: κατάρας
  choice: Fluch
  rationale: Gibt das Substantiv direkt wieder und erhält sein rechtliches und bundestheologisches Gewicht.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Entspricht der Genitivkonstruktion; der Kontext weist auf das mosaische Gesetz, ohne dass dies im Ausdruck ergänzt werden muss.
- source_word: γενόμενος
  choice: indem er … wurde
  rationale: Gibt das Partizip als Mittel beziehungsweise begleitenden Vollzug der Freikaufung in natürlichem Deutsch wieder.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Bewahrt die semantische Weite von ὑπέρ und legt sich nicht über den Wortlaut hinaus auf eine bestimmte Sühnetheorie fest.
- source_word: κατάρα
  choice: zum Fluch
  rationale: Erhält die überraschende substantivische Aussage des Griechischen, statt sie zum Adjektiv „verflucht“ abzuschwächen.
- source_word: ὅτι γέγραπται
  choice: Denn es steht geschrieben
  rationale: Gibt die begründende Funktion der Schriftanführung idiomatisch wieder; eine ausdrücklich kausale Wiedergabe ist ebenfalls möglich.
- source_word: Ἐπικατάρατος
  choice: Verflucht
  rationale: Ist die natürliche, kräftige deutsche Entsprechung und passt zum Stil eines Schriftzitats.
- source_word: κρεμάμενος
  choice: der … hängt
  rationale: Gibt das substantivierte Partizip als allgemeine Aussage wieder.
- source_word: ξύλου
  choice: Holz
  rationale: Entspricht dem möglichen konkreten Sinn von ξύλον und ist in der deutschen Sprache für diese Schriftstelle idiomatisch; „Baum“ bleibt als wörtlich mögliche Alternative vermerkt.
theological_decisions:
- issue: Bedeutungsumfang von ὑπὲρ ἡμῶν in der Sühneaussage
  choice: für uns
  alternative: zu unseren Gunsten; an unserer Stelle
  rationale: Die Formulierung bezeichnet klar ein Handeln Christi zugunsten der Menschen, zwingt als Präposition allein aber nicht zu einer engeren Bestimmung. „Für uns“ bewahrt diese theologische Spannung.
- issue: Substantivische Aussage γενόμενος … κατάρα
  choice: indem er für uns zum Fluch wurde
  alternative: indem er für uns verflucht wurde
  rationale: Das Griechische sagt pointiert, Christus sei „Fluch“ geworden. Die substantivische Form wird deshalb beibehalten und nicht in eine weniger anstößige adjektivische Aussage umgewandelt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftstil. Die Satzteilung vor der Schriftbegründung verbessert die Lesbarkeit, ohne den argumentativen Zusammenhang zu lösen. Die markante Wendung „zum Fluch wurde“ bleibt bewusst erhalten.
