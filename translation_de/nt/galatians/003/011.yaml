id: GAL.3.11
reference: Galatians 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: de
  text: 'Dass aber durch das Gesetz niemand vor Gott gerechtfertigt wird, ist offensichtlich, denn: »Der Gerechte wird aus Glauben leben.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Gerechte wird aus Treue leben.«'
    reason: lexical_alternative
  - marker: b
    text: 'Paulus zitiert Habakuk 2,4. Die Worte können auch verstanden werden als: »Der aus Glauben Gerechte wird leben.«'
    reason: cross_reference_and_syntactic_alternative
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Dass aber
  rationale: δὲ markiert einen leichten argumentativen Übergang; »aber« gibt diesen zurückhaltenden Kontrast wieder, ohne ein zeitliches »nun« einzuführen.
- source_word: ἐν νόμῳ
  choice: durch das Gesetz
  rationale: ἐν bezeichnet hier im juristischen Argument das Mittel; »durch das Gesetz« ist im Deutschen klar und idiomatisch.
- source_word: οὐδεὶς
  choice: niemand
  rationale: Bewahrt die uneingeschränkte Verneinung knapp und natürlich.
- source_word: δικαιοῦται
  choice: gerechtfertigt wird
  rationale: Gibt den forensischen Sinn des Verbs wieder und wahrt zugleich die etablierte paulinische Begrifflichkeit.
- source_word: παρὰ τῷ θεῷ
  choice: vor Gott
  rationale: Bezeichnet den Stand eines Menschen in Gottes Urteil und bewahrt die gerichtliche Nuance.
- source_word: δῆλον
  choice: ist offensichtlich
  rationale: Entspricht der unpersönlichen Feststellung und dem argumentativen Ton des Satzes.
- source_word: Ὁ δίκαιος
  choice: Der Gerechte
  rationale: Gibt das substantivierte Adjektiv prägnant und in der Zitatstruktur natürlich wieder.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Bewahrt die Präposition ἐκ und lässt die syntaktisch-theologische Spannung des Habakuk-Zitats eher offen als das stärker deutende »durch Glauben«.
- source_word: ζήσεται
  choice: wird leben
  rationale: Gibt das Futur in modernem Standarddeutsch unmittelbar wieder.
theological_decisions:
- issue: Zuordnung von ἐκ πίστεως im Zitat Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: »Der Gerechte wird aus Glauben leben«
  alternative: »Der aus Glauben Gerechte wird leben«
  rationale: Die Wortstellung lässt eine unterschiedliche syntaktische Zuordnung zu. Der Haupttext folgt der naheliegenden Anbindung an »wird leben«, während die alternative Zuordnung in einer Fußnote erhalten bleibt.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue
  rationale: »Glaube« ist hier die etablierte und kontextuell plausible Wiedergabe; die ebenfalls mögliche Bedeutung »Treue« wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem griechischen Argumentationsgang, bleibt aber gut verständlich. Das Zitat wird mit deutschen Anführungszeichen markiert; beide Fußnotenmarker stehen im Haupttext.
