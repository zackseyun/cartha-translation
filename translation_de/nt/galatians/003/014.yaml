id: GAL.3.14
reference: Galatians 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: de
  text: damit der Segen Abrahams im Messias Jesus[b] zu den Nichtjuden[a] gelangt, damit wir durch den Glauben die Verheißung des Geistes[c] empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Völkern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „in Christus Jesus“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den verheißenen Geist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Gibt in beiden Teilsätzen die Zweck- bzw. Zielangabe wieder und bewahrt die zweifache Satzstruktur des Griechischen.
- source_word: εἰς τὰ ἔθνη
  choice: zu den Nichtjuden
  rationale: ἔθνη bezeichnet im paulinischen Zusammenhang hier vor allem die nichtjüdischen Völker beziehungsweise Menschen; „Nichtjuden“ macht den Gegensatz zu den Juden im Kontext verständlich. Die formalere Alternative „zu den Völkern“ steht in der Fußnote.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: der Segen Abrahams
  rationale: Bewahrt die knappe Genitivverbindung und den Bezug auf den mit Abraham verbundenen Segen.
- source_word: γένηται
  choice: gelangt
  rationale: „Zu den Nichtjuden gelangt“ gibt die kontextuelle Bedeutung von γίνομαι natürlich wieder, ohne das im Deutschen unidiomatische „wird“ oder „entsteht“ zu verwenden.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: „Messias“ übersetzt Χριστός als Titel; „im“ bewahrt die für Paulus wichtige ἐν-Verbindung, ohne sie vorschnell instrumental als „durch“ auszulegen.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: die Verheißung des Geistes
  rationale: Die Genitivkonstruktion bleibt transparent und wird nicht stillschweigend auf „den verheißenen Geist“ festgelegt.
- source_word: λάβωμεν
  choice: wir … empfangen
  rationale: Nach deutschem „damit“ ist der Indikativ die natürliche moderne Wiedergabe des griechischen Konjunktivs im Zwecksatz.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: Gibt das Mittel mit der üblichen und kontextuell passenden Bedeutung von πίστις wieder.
theological_decisions:
- issue: Χριστός als Titel oder nameähnliche Bezeichnung
  choice: im Messias Jesus
  alternative: in Christus Jesus
  rationale: Im Argument über Abraham, Verheißung und Segen bleibt die Titelfunktion erkennbar. Daher wird Χριστός als „Messias“ übersetzt; die traditionelle Form wird in einer Fußnote genannt.
- issue: Bedeutung des Genitivs τοῦ πνεύματος
  choice: die Verheißung des Geistes
  alternative: den verheißenen Geist
  rationale: Der Haupttext erhält die Mehrdeutigkeit der griechischen Genitivverbindung. Die im Kontext naheliegende Deutung, dass der Geist selbst verheißen ist, wird als Alternative ausgewiesen, aber nicht in den Text hineingelesen.
- issue: Bedeutung von ἐν in ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: durch Jesus, den Messias
  rationale: Die inklusive beziehungsweise relationale Formulierung „im“ entspricht dem griechischen Ausdruck enger und vermeidet eine einseitig instrumentale Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Einleitung mit „damit“ bewahrt die rhetorische Parallelität des Ausgangstextes. „Im Messias Jesus“ ist bewusst markanter als gewöhnliche Alltagssprache, erhält aber sowohl den Titel Χριστός als auch die paulinische ἐν-Formel.
