id: GAL.3.8
reference: Galatians 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: de
  text: Die Schrift aber sah voraus, dass Gott die Völker[a] aufgrund des Glaubens gerecht spricht, und verkündete Abraham im Voraus die gute Nachricht:[b] »In dir werden alle Völker gesegnet werden.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Nichtjuden«. Das griechische Wort kann sowohl »Völker« als auch »Nichtjuden« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verkündete Abraham im Voraus das Evangelium«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: sah voraus
  rationale: Die Wiedergabe wahrt den zeitlichen Sinn des Aoristpartizips und lässt die personifizierte Schrift im Deutschen natürlich als handelndes Subjekt erscheinen.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Hier bezeichnet γραφή in paulinischer Ausdrucksweise personifiziert die Heilige Schrift, nicht bloß irgendeine Schrift oder Niederschrift.
- source_word: ἐκ πίστεως
  choice: aufgrund des Glaubens
  rationale: Die Formulierung gibt den Sinn von Grundlage beziehungsweise maßgeblichem Prinzip wieder und ist im modernen Deutsch klarer als das mehrdeutige »aus Glauben«.
- source_word: δικαιοῖ
  choice: gerecht spricht
  rationale: Diese Formulierung bringt die forensische Bedeutung des Verbs zum Ausdruck, ohne weitergehend zu erklären, wie Gottes Rechtfertigung zu verstehen ist.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: die Völker ... alle Völker
  rationale: Die einheitliche Wiedergabe bewahrt die bewusste Wortverbindung zwischen Paulus’ Aussage und dem Abraham zugesprochenen Verheißungswort. Die mögliche Bedeutung »Nichtjuden« wird in einer Fußnote offengehalten.
- source_word: προευηγγελίσατο
  choice: verkündete ... im Voraus die gute Nachricht
  rationale: Die Übersetzung bewahrt sowohl den zeitlichen Bestandteil προ- als auch den Evangeliums- beziehungsweise Freudenbotschaftssinn des Verbs.
- source_word: τῷ Ἀβραὰμ
  choice: Abraham
  rationale: Der deutsche Dativ ist durch Wortstellung und Verbanschluss eindeutig ausgedrückt.
- source_word: Ἐνευλογηθήσονται
  choice: werden ... gesegnet werden
  rationale: Das Futur Passiv und die Form der Verheißung werden unmittelbar beibehalten.
- source_word: ἐν σοὶ
  choice: In dir
  rationale: Die formal nahe Wiedergabe bewahrt die repräsentative beziehungsweise bundesbezogene Offenheit der Präposition, ohne sie durch »durch dich« festzulegen.
theological_decisions:
- issue: Wiedergabe von ἔθνη als »Völker« oder »Nichtjuden«
  choice: »Völker« an beiden Stellen
  alternative: »Nichtjuden« in Paulus’ Aussage und »Völker« im Zitat
  rationale: »Völker« macht die lexikalische Wiederholung und damit die Verbindung zwischen der Rechtfertigung aus Glauben und der Abrahamverheißung sichtbar. Die im Kontext ebenfalls mögliche Bezugnahme auf Nichtjuden bleibt durch die Fußnote erhalten.
- issue: Bedeutung von δικαιοῖ
  choice: »gerecht spricht«
  alternative: »rechtfertigt« oder »für gerecht erklärt«
  rationale: »Gerecht spricht« wahrt den gerichtlichen Aussagecharakter des Verbs in knapper, verständlicher Form, ohne eine umfassende Rechtfertigungslehre in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personifizierung der Schrift und die enge Verbindung zur Abrahamverheißung bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
