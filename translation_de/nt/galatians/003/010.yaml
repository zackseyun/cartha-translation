id: GAL.3.10
reference: Galatians 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: de
  text: 'Denn alle, die aus Werken des Gesetzes sind, stehen unter einem Fluch[a], denn es steht geschrieben: »Verflucht ist jeder, der nicht an allem festhält, was im Buch des Gesetzes geschrieben steht, um es zu tun.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sich auf Werke des Gesetzes verlassen«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »der nicht in allem bleibt, was im Buch des Gesetzes geschrieben steht, um es zu tun«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Denn alle, die
  rationale: Bewahrt den allgemeinen, pluralischen Umfang von ὅσοι und die begründende Funktion von γάρ in natürlichem Deutsch.
- source_word: ἐξ ἔργων νόμου
  choice: aus Werken des Gesetzes sind
  rationale: Die relativ formale Wiedergabe erhält die paulinische Formulierung und legt sie nicht vorschnell als Vertrauen auf oder Abhängigkeit von Gesetzeswerken aus.
- source_word: ὑπὸ κατάραν
  choice: unter einem Fluch
  rationale: Gibt die Unterstellung unter einen Fluch idiomatisch wieder, ohne durch »dem Fluch« einen bestimmten Fluch ausdrücklich vorauszusetzen.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Übliche deutsche Wiedergabe der Schriftzitat-Formel; sie wahrt den fortdauernden Geltungsaspekt des griechischen Perfekts.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Verflucht ist jeder, der
  rationale: Gibt Fluch und universalen Geltungsumfang klar, würdig und geschlechtsübergreifend im repräsentativen Sinn wieder.
- source_word: ἐμμένει
  choice: an allem festhält
  rationale: Bezeichnet anhaltende Bindung und Befolgung in natürlichem modernem Deutsch; die wörtlichere räumliche Ausdrucksweise wird in der Fußnote dokumentiert.
- source_word: πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: an allem, was im Buch des Gesetzes geschrieben steht
  rationale: Bewahrt die umfassende Forderung von πᾶσιν und gibt den Buch- beziehungsweise Schriftbezug verständlich wieder.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: und es tut
  rationale: Bringt das Ziel der beständigen Bindung als tatsächliches Tun zum Ausdruck und vermeidet im Deutschen eine schwerfällige Infinitivkonstruktion; die formale Struktur steht in der Fußnote.
theological_decisions:
- issue: Deutung von ἐξ ἔργων νόμου
  choice: aus Werken des Gesetzes sind
  alternative: sich auf Werke des Gesetzes verlassen
  rationale: Die theologisch aufgeladene Wendung bleibt bewusst relativ formal. So wird weder ausschließlich Vertrauen noch Verdienst oder Identitätszugehörigkeit als einzige Deutung in den Haupttext eingetragen.
- issue: Umfang der geforderten Gesetzeserfüllung
  choice: an allem festhält … und es tut
  alternative: in allem bleibt …, um es zu tun
  rationale: Das umfassende πᾶσιν und die praktische Forderung des ποιῆσαι werden beide bewahrt, ohne die Spannung von fortdauernder Bindung und tatsächlichem Tun abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat-Register. Die ungewöhnliche Wendung »aus Werken des Gesetzes sind« ist bewusst beibehalten, um die Mehrdeutigkeit des griechischen Ausdrucks nicht im Haupttext aufzulösen.
