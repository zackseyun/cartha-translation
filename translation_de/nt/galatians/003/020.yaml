id: GAL.3.20
reference: Galatians 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: de
  text: Ein Vermittler aber steht nicht für eine einzige Partei allein[a]; Gott aber ist einer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein Vermittler aber ist nicht eines.“ Der knappe Ausdruck kann bedeuten: Ein Vermittler handelt nicht für einen allein oder gehört nicht nur zu einer einzigen Partei.'
    reason: alternative_reading
  - marker: b
    text: „Gott ist einer“ erinnert wahrscheinlich an Israels Bekenntnis zur Einheit Gottes; siehe 5. Mose 6,4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: Vermittler
  rationale: „Vermittler“ ist im modernen Deutschen die präzise und allgemein verständliche Bezeichnung für jemanden, der zwischen Parteien steht; der rechtlich-bundestheologische Zusammenhang bleibt erhalten.
- source_word: ἑνὸς
  choice: eines Einzigen
  rationale: Die knappe Genitivform wird eng am Griechischen wiedergegeben. Die Formulierung bewahrt die Mehrdeutigkeit, ob eine Person, Partei oder Seite gemeint ist, und vermeidet eine zu weitgehende Auslegung.
- source_word: οὐκ ἔστιν
  choice: ist nicht Vermittler
  rationale: Die Wiederaufnahme des Substantivs ergibt einen natürlichen deutschen Satz, ohne den rätselhaften Gedanken durch eine ausführliche Paraphrase aufzulösen.
- source_word: δὲ … δὲ
  choice: aber … aber
  rationale: Beide Partikeln werden als Gliederungs- beziehungsweise Kontrastsignale sichtbar gemacht; ein zeitliches „nun“ wird nicht eingeführt.
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: Gott aber ist einer
  rationale: Die Wiedergabe folgt der knappen griechischen Aussage und bewahrt sowohl den Kontrast als auch den möglichen Anklang an Israels Bekenntnis, dass Gott einer ist.
theological_decisions:
- issue: Der stark verdichtete erste Halbsatz
  choice: Ein Vermittler aber ist nicht Vermittler eines Einzigen
  alternative: Ein Vermittler handelt nicht nur für eine einzige Partei
  rationale: Die gewählte Fassung lässt offen, wie genau der Genitiv ἑνὸς zu verstehen ist. Sie legt weder die beteiligten Parteien noch eine bestimmte Deutung von Gesetz, Verheißung, Mose oder Christus fest.
- issue: Die Aussage über Gottes Einheit
  choice: Gott aber ist einer
  alternative: Gott aber ist ein Einziger
  rationale: „Ist einer“ wahrt die formale Kürze und den möglichen monotheistischen Bekenntnisklang, ohne die Aussage durch „einziger Gott“ stärker auszulegen, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Verdichtung des griechischen Satzes bleibt bewusst spürbar; die Fußnote erläutert mögliche Lesarten, ohne eine davon dogmatisch festzulegen.
