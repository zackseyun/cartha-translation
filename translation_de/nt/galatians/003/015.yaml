source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: de
  text: 'Brüder und Schwestern[a], ich rede nach menschlicher Weise: Selbst einen rechtsverbindlich bestätigten Bund[b] eines Menschen hebt niemand auf oder fügt ihm etwas hinzu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brüder«. Der griechische maskuline Plural kann hier die gesamte Glaubensgemeinschaft einschließlich der Frauen ansprechen.'
    reason: cultural_note
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang auch »Testament« oder »letztwillige Verfügung« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural ist hier als Anrede der Glaubensgemeinschaft gebraucht und schließt im Kontext sehr wahrscheinlich Frauen ein. Die inklusive Wiedergabe ist im heutigen Deutsch natürlich; eine Fußnote weist auf die Form des griechischen Ausdrucks hin.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: ich rede nach menschlicher Weise
  rationale: Die idiomatische Wendung führt ein Beispiel aus menschlichen Rechtsverhältnissen ein. Diese Wiedergabe bleibt bildnah und zugleich verständlich.
- source_word: ὅμως
  choice: selbst
  rationale: 'Das Wort verstärkt den Übergang zum Beispiel: Schon bei einer menschlichen Verfügung gilt der genannte Grundsatz.'
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Der Genitiv Singular wird konkret bewahrt, ohne das im Deutschen unnötig männlich klingende »eines Mannes« zu wählen; ἄνθρωπος bezeichnet hier einen Menschen im allgemeinen Sinn.
- source_word: κεκυρωμένην
  choice: rechtskräftig gewordenen
  rationale: Das Perfekt Passiv bezeichnet eine verbindlich bestätigte und weiterhin gültige Regelung. »Rechtskräftig geworden« vermittelt diese rechtliche Geltung natürlich.
- source_word: διαθήκην
  choice: Bund
  rationale: Im unmittelbaren Zusammenhang geht es um Gottes Bund beziehungsweise Zusage an Abraham. Zugleich kann das griechische Wort in einem menschlichen Rechtsbeispiel auch eine letztwillige Verfügung bezeichnen; diese Möglichkeit wird in der Fußnote erhalten.
- source_word: ἀθετεῖ
  choice: hebt ... auf
  rationale: Die Formulierung gibt den rechtlichen Sinn des Ungültigmachens klar und idiomatisch wieder.
- source_word: ἐπιδιατάσσεται
  choice: ergänzt ihn
  rationale: Das Verb bezeichnet das nachträgliche Hinzufügen weiterer Bestimmungen. »Ergänzt ihn« ist knapp und bewahrt diesen juristischen Sinn.
theological_decisions:
- issue: 'Bedeutung von διαθήκη: Bund oder Testament/letztwillige Verfügung'
  choice: Bund
  alternative: Testament beziehungsweise letztwillige Verfügung
  rationale: »Bund« wahrt die Verbindung zu Gottes Zusage an Abraham im Argument von Galater 3. Der rechtliche Nebensinn einer letztwilligen Verfügung ist jedoch sprachlich möglich und wird deshalb nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die inklusive Anrede ist für eine gemischte Gemeinde natürlich; die griechische Form wird transparent angemerkt. Die rechtliche Bildsprache bleibt erhalten, ohne unnötig fachsprachlich zu werden.
