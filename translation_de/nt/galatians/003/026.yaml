  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: de
  text: Denn ihr alle seid durch den Glauben Söhne Gottes in Jesus, dem Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder Gottes“. Wörtlich steht im Griechischen „Söhne“; damit klingt auch ihr Status als Erben an. Gemeint sind hier alle Glaubenden, unabhängig vom Geschlecht.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „in Christus Jesus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: ihr alle
  rationale: Zusammen mit ἐστε in der zweiten Person Plural bezeichnet πάντες ausdrücklich die gesamte angesprochene Gruppe.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ bewahrt diese Verknüpfung natürlich und präzise.
- source_word: υἱοὶ θεοῦ
  choice: Söhne Gottes
  rationale: Das Griechische verwendet ausdrücklich υἱοί („Söhne“). Diese Wiedergabe erhält zugleich den paulinischen Status- und Erbgedanken; die inklusive Reichweite wird in der Fußnote erläutert.
- source_word: διὰ τῆς πίστεως
  choice: durch den Glauben
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „durch den Glauben“ gibt die griechische Formulierung angemessen wieder.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  rationale: ἐν bleibt als „in“ erhalten und wahrt die paulinische Vorstellung der Zugehörigkeit beziehungsweise Verbundenheit. Χριστός wird als Titel sinngemäß mit „Messias“ übersetzt.
theological_decisions:
- issue: Geschlechtsspezifische Sohnschaftssprache
  choice: Söhne Gottes
  alternative: Kinder Gottes
  rationale: „Söhne“ entspricht υἱοί und bewahrt den Zusammenhang von Sohnschaft, Status und Erbe. Nach dem Kontext sind alle Glaubenden unabhängig vom Geschlecht eingeschlossen; dies wird nicht durch eine stillschweigende Verallgemeinerung des Wortlauts verdeckt, sondern in einer Fußnote erklärt.
- issue: Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Χριστός ist der griechische Titel für den Gesalbten; „Messias“ macht seinen Bedeutungsgehalt sichtbar, während die traditionelle Form in der Fußnote genannt wird.
- issue: Zuordnung von ἐν Χριστῷ Ἰησοῦ
  choice: im Messias Jesus
  alternative: durch den Glauben an den Messias Jesus
  rationale: Die gewählte Stellung wahrt formal die griechische Mehrdeutigkeit und besonders die paulinische In-Christus-Sprache, statt ἐν eindeutig zum Glaubensobjekt umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ihr alle“ bringt die inklusive Anrede deutlich zum Ausdruck. Die Satzstellung folgt dem Griechischen hinreichend eng, bleibt aber im Deutschen natürlich.
