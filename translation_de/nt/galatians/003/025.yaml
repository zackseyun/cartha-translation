base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: de
  text: Seit der Glaube gekommen ist,[a] stehen wir jedoch nicht mehr unter einem Aufseher.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seit aber der Glaube da ist.“'
    reason: Die Wendung beschreibt das Eintreten des Glaubens als heilsgeschichtlichen Übergang; die knappe griechische Form lässt dessen genaue Nuance offen.
  - marker: b
    text: Ein solcher Aufseher war im antiken Haushalt für die Beaufsichtigung und Begleitung eines Minderjährigen zuständig, nicht in erster Linie für dessen Unterricht.
    reason: Die kulturelle Bedeutung von παιδαγωγός unterscheidet sich von der heutigen Vorstellung eines Pädagogen oder Lehrers.
lexical_decisions:
- source_word: ἐλθούσης
  choice: Seit … gekommen ist
  rationale: Der Aoristpartizip im Genitivus absolutus wird als natürlicher deutscher Temporalsatz wiedergegeben. „Seit“ bezeichnet den eingetretenen Übergang und seinen bis in die Gegenwart reichenden Zustand.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert den milden Gegensatz zur vorherigen Zeit unter der Aufsicht des Gesetzes.
- source_word: πίστεως
  choice: der Glaube
  rationale: πίστις wird grundsätzlich mit „Glaube“ wiedergegeben. Der bestimmte Artikel ist im Deutschen hier idiomatisch und lässt sowohl den Glauben als heilsgeschichtliche Wirklichkeit als auch die kontextuell bestimmte Glaubensordnung anklingen.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Dies gibt das Ende des zuvor bestehenden Zustands direkt und natürlich wieder.
- source_word: ὑπὸ
  choice: unter
  rationale: Die räumlich-soziale Metapher einer bestehenden Aufsicht bleibt erhalten.
- source_word: παιδαγωγόν
  choice: Aufseher
  rationale: Ein παιδαγωγός war im antiken Haushalt der Aufseher und Begleiter eines Minderjährigen, nicht in erster Linie dessen Lehrer. „Aufseher“ vermeidet die irreführende moderne Vorstellung eines Pädagogen oder Nachhilfelehrers.
- source_word: ἐσμεν
  choice: stehen wir
  rationale: In Verbindung mit „unter“ ist „unter einem Aufseher stehen“ im Deutschen natürlicher als die wörtliche Kopula „sind“, ohne den Sinn zu verändern.
theological_decisions:
- issue: Bedeutung des Kommens des Glaubens
  choice: „der Glaube gekommen ist“ lässt den heilsgeschichtlichen Übergang erkennen, ohne den Ausdruck weiter auszudeuten.
  alternative: „die Glaubensordnung gekommen ist“ oder „der Glaube offenbar geworden ist“
  rationale: Der Kontext stellt das Kommen des Glaubens der früheren Aufsicht durch das Gesetz gegenüber. Eine erklärende Ergänzung wie „Glaubensordnung“ würde jedoch eine bestimmte Deutung in den Haupttext eintragen; „offenbar geworden“ wäre sprachlich expliziter als das griechische „gekommen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bewahrt sowohl den zeitlichen Kontrast als auch das Bild der Aufsicht über einen Minderjährigen. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
