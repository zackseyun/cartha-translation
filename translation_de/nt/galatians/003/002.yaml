  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: de
  text: 'Nur das möchte ich von euch erfahren: Habt ihr den Geist durch Werke des Gesetzes empfangen oder durch das Hören im Glauben?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus/durch Hören des Glaubens“. Die gedrängte griechische Wendung kann auch „durch das Hören der Glaubensbotschaft“ bedeuten. „Glauben“ kann hier, weniger wahrscheinlich, auch als „Treue“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Nur das
  rationale: Bewahrt die emphatische Voranstellung und klingt im Deutschen natürlich und pointiert.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: möchte ich von euch erfahren
  rationale: Gibt θέλω μαθεῖν idiomatisch wieder und bewahrt mit „von euch“ die persönliche, rhetorische Ausrichtung.
- source_word: ἐξ ἔργων νόμου
  choice: durch Werke des Gesetzes
  rationale: Bewahrt die paulinische Wendung und den Gegensatz der Mittel oder Grundlagen, ohne „Gesetz“ unnötig näher zu bestimmen.
- source_word: τὸ πνεῦμα
  choice: den Geist
  rationale: Der Kontext weist auf Gottes Geist; die Großschreibung macht diesen Bezug deutlich, ohne das im Griechischen nicht ausdrücklich vorhandene „Heiligen“ einzufügen.
- source_word: ἐλάβετε
  choice: Habt ihr … empfangen
  rationale: Das Perfekt ist im Deutschen für eine vergangene, für die Gegenwart bedeutsame Erfahrung idiomatisch.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: dadurch, dass ihr die Botschaft im Glauben gehört habt
  rationale: Entfaltet die gedrängte Genitivverbindung in natürlichem Deutsch. ἀκοή kann das Hören oder das Gehörte, also die Botschaft, bezeichnen; πίστις wird als „Glaube“ wiedergegeben.
theological_decisions:
- issue: Bezug von τὸ πνεῦμα
  choice: Gottes Geist als die von den Glaubenden empfangene Gabe
  alternative: eine allgemeinere geistliche Erfahrung oder Kraft
  rationale: Der unmittelbare Zusammenhang in Galater 3 spricht von Gottes Geist, den die Galater empfangen haben.
- issue: Deutung von ἀκοῆς πίστεως
  choice: Hören der Botschaft im Glauben
  alternative: die Glaubensbotschaft beziehungsweise das Hören, das zum Glauben führt
  rationale: Die griechische Genitivverbindung ist gedrängt und mehrdeutig. Der Haupttext bietet eine natürliche, kontextuell plausible Deutung; die Fußnote hält die Alternativen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp und direkt; die schwer verständliche griechische Genitivverbindung wird im Haupttext behutsam idiomatisiert, während die echte Mehrdeutigkeit in der Fußnote erhalten bleibt.
