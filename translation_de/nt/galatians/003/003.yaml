lexical_decisions:
- source_word: οὕτως
  choice: so
  rationale: 'Im rhetorischen Fragesatz bezeichnet οὕτως vor allem den Grad: »so unverständig«.'
- source_word: ἀνόητοί
  choice: unverständig
  rationale: Gibt den Mangel an Einsicht und Urteilsvermögen deutlich wieder, ohne umgangssprachlich oder unnötig beleidigend zu klingen.
- source_word: ἐναρξάμενοι
  choice: nachdem ihr … angefangen habt
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem jetzigen Versuch der Vollendung vorausgeht.
- source_word: πνεύματι
  choice: durch den Geist
  rationale: Der Dativ ist wahrscheinlich instrumental; der Kontext von Galater 3 weist auf den Heiligen Geist als Handelnden.
- source_word: νῦν
  choice: jetzt
  rationale: Bewahrt den scharfen zeitlichen Gegensatz zwischen Anfang und gegenwärtigem Vorgehen.
- source_word: σαρκὶ
  choice: durch das Fleisch
  rationale: Bewahrt den paulinischen Gegensatz von Geist und Fleisch, ohne σάρξ vorschnell auf menschliche Anstrengung oder sündige Natur zu verengen.
- source_word: ἐπιτελεῖσθε
  choice: sollt ihr … vollendet werden
  rationale: Die Form kann medial oder passiv verstanden werden. Im rhetorischen Zusammenhang gibt »sollt ihr … vollendet werden?« den angestrebten Abschluss wieder und bewahrt zugleich die passive Lesart.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: der Heilige Geist
  alternative: menschlicher Geist oder ein geistliches Prinzip
  rationale: Der unmittelbare Zusammenhang spricht vom Empfangen des Geistes und von Gottes Wirken; daher ist der Heilige Geist die naheliegende Referenz.
- issue: Bedeutung von σάρξ im Gegensatz zum Geist
  choice: Fleisch
  alternative: menschliche Anstrengung; sündige Natur
  rationale: »Fleisch« erhält die mehrschichtige paulinische Ausdrucksweise und legt den Begriff nicht auf nur eine Deutung fest.
- issue: Diathese von ἐπιτελεῖσθε
  choice: 'passiv: vollendet werden'
  alternative: 'medial: euch selbst zum Ziel bringen / nun vollenden'
  rationale: Die Form ist formal mehrdeutig. Die Hauptfassung folgt einer natürlichen passiven Wiedergabe; die alternative Auffassung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Unverständig« ist deutlich, aber weniger umgangssprachlich als »dumm«. Die Satzstellung macht den Gegensatz zwischen Geist und Fleisch hörbar; die Fußnoten bewahren die lexikalische und grammatische Mehrdeutigkeit.
