  source_fidelity: Die Übersetzung gibt οὕτως ἀνόητοί ἐστε treffend als rhetorischen Vorwurf wieder und bewahrt den Gegensatz von πνεύματι und σαρκί mit »durch den Geist«/»durch das Fleisch«. Die aoristische Vorzeitigkeit von ἐναρξάμενοι ist mit »Nachdem ihr ... angefangen habt« angemessen erfasst. Bei ἐπιτελεῖσθε ist die passivische Wiedergabe vertretbar, doch »sollt ihr ... vollendet werden?« fügt ein im Griechischen nicht ausgedrücktes Modal- bzw. Sollenselement hinzu.
  naturalness: »Seid ihr so unverständig?« ist modernes, würdiges Standarddeutsch. Die korrigierte Frage mit »werdet ihr ... vollendet?« ist idiomatisch und gibt die präsentische rhetorische Frage ohne zusätzliche Modalität wieder.
  terminology: »Geist« und »Fleisch« sind als zentrale paulinische Begriffe sachgerecht beibehalten. Die Großschreibung bzw. der bestimmte Artikel bei »der Geist« ist im Kontext als Bezug auf den Heiligen Geist plausibel. Die Fußnoten lassen die relevanten Alternativen offen, ohne »Fleisch« im Haupttext interpretativ einzuengen.
