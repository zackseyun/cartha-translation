  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: de
  text: Seid ihr so unverständig? Nachdem ihr durch den Geist[a] angefangen habt, werdet ihr jetzt durch das Fleisch[b] vollendet[c]?
  philosophy: optimal-equivalence
  footnotes:
