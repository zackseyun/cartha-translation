review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von γάρ, der passiven Taufaussage und des Bekleidungsbildes ist grundsätzlich treffend. „Ihr alle, die ihr ...“ kann jedoch gegenüber ὅσοι die Aussage unnötig auf sämtliche Angeredeten verallgemeinern. Die korrelative, potenziell begrenzende Formulierung „alle, die ihr ...“ gibt ὅσοι genauer wieder. „Auf Christus getauft“ ist als etablierte deutsche Wiedergabe von εἰς Χριστόν vertretbar und wahrt die im Ausgangstext ausgedrückte Ausrichtung bzw. Einbeziehung, ohne sie dogmatisch auszudeuten.
  naturalness: „Denn alle, die ihr auf Christus getauft worden seid, habt Christus angezogen“ ist modernes, würdiges und gut verständliches Standarddeutsch. Das ungewohnte, aber beabsichtigte Kleidungsbild bleibt klar.
  terminology: „Christus“ und „getauft“ entsprechen dem üblichen deutschen biblischen Sprachgebrauch. „Christus angezogen“ erhält die Metapher von ἐνεδύσασθε; die Fußnote macht die reflexive Nuance des griechischen Mediums transparent.
  issues:
  - severity: medium
    issue: „ihr alle, die ihr“ ist für ὅσοι zu pauschal.
    rationale: Ὅσοι bezeichnet „alle/so viele, wie ...“ und qualifiziert damit die Gruppe der Getauften. Die Formulierung „ihr alle“ kann demgegenüber behaupten, dass ausnahmslos alle Angeredeten getauft seien. „Alle, die ihr ...“ erhält den konditional-korrelativen Umfang ohne zusätzliche Aussage.
  revised_text: Denn alle, die ihr auf Christus getauft worden seid, habt Christus angezogen.[a]
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „habt euch mit Christus bekleidet“.'
    reason: lexical_alternative
