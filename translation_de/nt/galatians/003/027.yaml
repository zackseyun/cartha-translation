  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: de
  text: Denn alle, die ihr auf Christus getauft worden seid, habt Christus angezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „habt euch mit Christus bekleidet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: ihr alle, die
  rationale: Gibt die umfassende korrelative Bedeutung von ὅσοι idiomatisch wieder und macht die im Verb enthaltene direkte Anrede ausdrücklich.
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorherigen Gedankengang.
- source_word: εἰς
  choice: auf
  rationale: „Auf Christus getauft“ ist im modernen deutschen Bibel- und Sprachgebrauch eine natürliche Wiedergabe der Taufformel mit εἰς; die Wendung wahrt den Bezug und die Zugehörigkeit zu Christus, ohne eine bestimmte Tauflehre oder Taufweise festzulegen.
- source_word: Χριστόν
  choice: Christus
  rationale: „Christus“ ist im Deutschen die etablierte Wiedergabe des Titels Χριστός und lässt dessen messianischen Gehalt bestehen, ohne im Satz unnatürlich zu wirken.
- source_word: ἐβαπτίσθητε
  choice: getauft wurdet
  rationale: Bewahrt die passive Form und vermeidet eine konfessionelle Festlegung auf eine bestimmte Art der Taufe.
- source_word: ἐνεδύσασθε
  choice: habt Christus angezogen
  rationale: Gibt das griechische Bild des Anziehens knapp, verständlich und formal nah wieder; die ungewöhnliche Bildhaftigkeit bleibt erhalten.
theological_decisions:
- issue: Ob die Taufformulierung eine bestimmte sakramentale Wirkung oder Taufweise ausdrücklich festlegt
  choice: auf Christus getauft wurdet
  alternative: in Christus hineingetauft wurdet
  rationale: Die Formulierung bewahrt Zugehörigkeit und Hinordnung auf Christus, entscheidet aber nicht ausdrücklich spätere Lehrfragen zur sakramentalen Wirksamkeit oder zum äußeren Taufmodus.
- issue: Ob ἐνεδύσασθε rein erklärend als Vereinigung mit Christus wiederzugeben ist
  choice: habt Christus angezogen
  alternative: seid mit Christus bekleidet worden
  rationale: Das Kleidungsbild des Ausgangstextes bleibt bestehen und wird nicht durch eine theologische Auslegung ersetzt; zugleich wird die griechische mediale Form angemessen wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, während das prägnante Kleidungsbild des griechischen Textes erhalten bleibt.
