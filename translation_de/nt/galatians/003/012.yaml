    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: das Gesetz
  rationale: Der bestimmte Artikel wird wiedergegeben; im Kontext ist das mosaische Gesetz im Blick. Die Großschreibung ist im Deutschen bei Substantiven regulär und trifft keine zusätzliche typografische Unterscheidung.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Die relativ formale Wiedergabe bewahrt den Gegensatz von Ursprung bzw. bestimmendem Prinzip, ohne ihn durch »beruht auf« oder »richtet sich nicht nach« auszudeuten.
- source_word: ἀλλά
  choice: sondern
  rationale: Nach der Verneinung markiert »sondern« im Deutschen den scharfen Gegensatz und leitet das Schriftzitat natürlich ein.
- source_word: ὁ ποιήσας
  choice: wer … tut
  rationale: Das substantivierte Partizip bezeichnet allgemein denjenigen, der entsprechend handelt; »wer … tut« ist idiomatisch und bewahrt den generischen Sinn.
- source_word: αὐτά
  choice: diese Gebote
  rationale: Das griechische Pronomen verweist im Zitat auf die zuvor genannten Satzungen und Rechtsbestimmungen aus 3. Mose 18,5. Die knappe Explizierung verhindert im Deutschen einen unklaren Rückverweis.
- source_word: ζήσεται
  choice: wird … leben
  rationale: Gibt das Futur in modernem, würdigem Deutsch wieder.
- source_word: ἐν αὐτοῖς
  choice: durch sie
  rationale: Im Zitat kann ἐν den Bereich oder das Mittel bezeichnen. »Durch sie« gibt den Zusammenhang von Tun und Leben idiomatisch wieder; die formal nähere Alternative steht in der Fußnote.
theological_decisions:
- issue: Paulus’ Gegensatz zwischen Gesetz und Glauben
  choice: »Das Gesetz aber kommt nicht aus Glauben«
  alternative: »Das Gesetz beruht nicht auf Glauben« / »Das Gesetz folgt nicht dem Prinzip des Glaubens«
  rationale: Die Formulierung bleibt nahe bei ἐκ πίστεως und bewahrt die theologische Spannung, ohne das Verhältnis von Gesetz und Glauben systematisch zu erklären.
- issue: Sinn von ἐν αὐτοῖς im Schriftzitat
  choice: »wird durch sie leben«
  alternative: »wird in ihnen leben«
  rationale: Die Hauptfassung versteht die Wendung instrumental bzw. als Grundlage des Lebens. Weil die griechische Präposition auch örtlich bzw. sphärisch wiedergegeben werden kann, wird diese echte lexikalische Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. Die ungewöhnliche Formulierung »aus Glauben« ist bewusst beibehalten, um die Ausdrucksweise und Spannung des griechischen Textes nicht interpretierend zu glätten.
