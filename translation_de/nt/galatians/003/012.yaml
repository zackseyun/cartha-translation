base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: de
  text: 'Das Gesetz aber ist nicht aus Glauben, sondern: »Wer diese Dinge tut, wird durch sie leben.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird in ihnen leben«.'
    reason: lexical_alternative
  - marker: b
