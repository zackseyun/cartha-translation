id: GAL.3.9
reference: Galatians 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: de
  text: Folglich werden alle, die aus Glauben leben, zusammen mit dem gläubigen[a] Abraham gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem treuen Abraham“.'
    reason: πιστός kann hier sowohl „gläubig“ als auch „treu“ bedeuten.
lexical_decisions:
- source_word: ὥστε
  choice: Daher
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: οἱ ἐκ πίστεως
  choice: die, die aus Glauben sind
  rationale: Bewahrt den identitätsprägenden Charakter der griechischen Wendung, ohne sie zu einer Aussage über Werke oder bloßen Besitz von Glauben umzudeuten.
- source_word: πίστεως
  choice: Glauben
  rationale: Im Zusammenhang bezeichnet πίστις den Glauben, durch den Menschen mit Abraham verbunden sind; „Glauben“ wahrt zugleich den Anschluss an den unmittelbaren Kontext.
- source_word: εὐλογοῦνται
  choice: werden … gesegnet
  rationale: Die passive Form hält fest, dass der Segen empfangen und nicht selbst erworben wird; das deutsche Präsens entspricht dem griechischen Präsens.
- source_word: σὺν
  choice: zusammen mit
  rationale: Bringt die gemeinsame Teilhabe am Segen klar zum Ausdruck.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: dem gläubigen Abraham
  rationale: Im unmittelbaren Kontext steht Abrahams Glaube im Mittelpunkt. Da πιστός auch „treu“ bedeuten kann, bleibt diese echte Bedeutungsnuance in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von πιστός bei Abraham in einem vom Glauben bestimmten Zusammenhang
  choice: der gläubige Abraham
  alternative: der treue Abraham
  rationale: Der Argumentationsgang in Galater 3 hebt besonders Abrahams Glauben hervor, weshalb „gläubig“ im Haupttext naheliegt. Die mögliche Bedeutung „treu“ wird jedoch nicht ausgeschlossen, sondern als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst leicht markierte Wendung „aus Glauben sind“ spiegelt die griechische Herkunfts- und Zugehörigkeitsformel, während „zusammen mit“ die Aussage im Deutschen flüssig hält.
