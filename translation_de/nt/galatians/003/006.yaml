- from: So glaubte Abraham Gott, und es wurde ihm als Gerechtigkeit angerechnet,[a]
  to: Wie Abraham Gott glaubte und es ihm als Gerechtigkeit angerechnet wurde,
  rationale: Die Revision ersetzt allein die weniger präzise Vergleichsanbindung „So“ durch „Wie“ und entfernt die nicht erforderliche, als „wörtlich“ ungenau bezeichnete Fußnote. Der unpersönliche Bezug von ἐλογίσθη, die Rechnungsmetapher und das fortführende Schlusskomma bleiben erhalten.
  reviewer_model: gpt-5.6-terra
