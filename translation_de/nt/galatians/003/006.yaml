source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: de
  text: Wie Abraham Gott glaubte und es ihm als Gerechtigkeit angerechnet wurde,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: So
  rationale: Leitet den Schriftbeleg und den Vergleich ein; im Zusammenhang entspricht die natürliche deutsche Zitierform „So glaubte Abraham …“ der vergleichenden Kraft des griechischen Ausdrucks.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Im Deutschen übliche Namensform.
- source_word: ἐπίστευσεν
  choice: glaubte
  rationale: Gibt den Aorist von πιστεύω direkt wieder, ohne die Aussage durch „vertraute“ oder „hatte Glauben“ enger auszulegen.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bei πιστεύω bezeichnet hier den, dessen Aussage Abraham glaubte; „Gott glauben“ bewahrt diesen Akzent besser als „an Gott glauben“.
- source_word: ἐλογίσθη
  choice: wurde … angerechnet
  rationale: Die passive Form von λογίζομαι wird idiomatisch und mit ihrem rechnenden beziehungsweise zuschreibenden Sinn wiedergegeben.
- source_word: αὐτῷ
  choice: ihm
  rationale: Dativpronomen für die Person, der etwas angerechnet wurde.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: Bewahrt die traditionelle und sachlich passende Wiedergabe der resultativen beziehungsweise statusbezogenen Wendung, ohne das Verhältnis näher festzulegen.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη in einem paulinischen Schriftzitat
  choice: Gerechtigkeit
  alternative: Rechtsein; gerechter Status
  rationale: „Gerechtigkeit“ ist die breite, etablierte deutsche Entsprechung und lässt sowohl den forensischen Status als auch die ethisch-bundestheologische Bedeutungsweite offen.
- issue: Bezug des unpersönlichen Passivs ἐλογίσθη
  choice: „es“ bleibt ohne ausdrücklich genanntes Bezugswort
  alternative: „der Glaube wurde ihm … angerechnet“
  rationale: Der griechische Text nennt „Glaube“ nicht ausdrücklich als Subjekt. Die unpersönliche Formulierung vermeidet, diese verbreitete Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „Gott glauben“ ist bewusst gewählt, um den griechischen Dativ und den Gedanken, Gottes Zusage Glauben zu schenken, zu bewahren. Das abschließende Komma zeigt, dass der Satz syntaktisch in Vers 7 weitergeführt wird.
