  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: de
  text: So ist das Gesetz unser Erzieher[a] bis zum Messias[b] geworden, damit wir aus Glauben gerechtfertigt würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Betreuer“; traditionell auch „Zuchtmeister“. Das griechische Wort bezeichnet eine Person im Haushalt, die ein minderjähriges Kind begleitete, beaufsichtigte und erzog, nicht in erster Linie einen Lehrer.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf den Messias hin“ oder „zum Messias hin“. „Bis zum Messias“ gibt die im Zusammenhang naheliegende zeitliche Bedeutung wieder; die Wendung kann auch eine auf den Messias ausgerichtete oder zu ihm führende Funktion bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Somit
  rationale: ὥστε zieht hier eine Folgerung aus dem vorausgehenden Gedankengang; „Somit“ gibt diese schlussfolgernde Funktion knapp und natürlich wieder.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Der bestimmte Ausdruck bezeichnet im Kontext das mosaische Gesetz als bekannte Größe.
- source_word: παιδαγωγὸς
  choice: Aufseher
  rationale: Ein παιδαγωγός war im griechisch-römischen Haushalt vor allem für die Beaufsichtigung und Führung eines Minderjährigen zuständig, nicht in erster Linie für dessen Unterricht. „Aufseher“ wahrt diese Rollenbeschreibung, ohne ihn als modernen Lehrer darzustellen.
- source_word: ἡμῶν
  choice: unser
  rationale: Der Genitiv bezeichnet die Zuordnung des Aufsehers zu der mit „wir“ bezeichneten Gruppe.
- source_word: γέγονεν
  choice: ist … geworden
  rationale: Das Perfekt bezeichnet einen in der Vergangenheit eingetretenen Zustand mit fortwirkendem Ergebnis; das deutsche Perfekt gibt dies angemessen wieder.
- source_word: εἰς Χριστόν
  choice: bis zum Messias
  rationale: Im Zusammenhang bezeichnet εἰς den Messias als Ziel beziehungsweise zeitlichen Endpunkt der Aufseherfunktion des Gesetzes. Die direktionale Deutung bleibt in einer Fußnote erhalten.
- source_word: Χριστόν
  choice: Messias
  rationale: Χριστός wird als Titel wiedergegeben; „Messias“ macht dessen Bedeutung im Deutschen transparent.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet hier den Zweck ein; „damit“ ist die natürliche deutsche Entsprechung.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: Die Formulierung wahrt die Präposition ἐκ und den paulinischen Ausdruck, ohne näher festzulegen, ob Glaube hier vor allem als Mittel oder Grundlage zu verstehen ist.
- source_word: δικαιωθῶμεν
  choice: wir … gerechtfertigt würden
  rationale: Die passive Form und der durch ἵνα bestimmte Zwecksinn bleiben erhalten; „gerechtfertigt“ bewahrt die rechtlich-theologische Bildsprache.
theological_decisions:
- issue: Bedeutung von εἰς Χριστόν für die Aufgabe des Gesetzes
  choice: „bis zum Messias“ bezeichnet den Messias als Ziel beziehungsweise Endpunkt der zeitlich begrenzten Aufseherfunktion.
  alternative: „zum Messias hin“ kann eine führende oder auf ein Ziel ausgerichtete Funktion des Gesetzes ausdrücken.
  rationale: Der folgende Kontext betont die Zeit vor dem Kommen des Glaubens und die veränderte Lage danach. Dennoch kann εἰς auch eine Richtung auf den Messias hin bezeichnen; diese echte Mehrdeutigkeit wird in der Fußnote offengehalten.
- issue: Wiedergabe von δικαιόω
  choice: „gerechtfertigt werden“ bewahrt die forensische und relationale Spannung des Verbs.
  alternative: „für gerecht erklärt werden“ verdeutlicht die rechtliche Dimension, legt die Metapher jedoch stärker aus.
  rationale: Die traditionelle, im modernen theologischen Deutsch weiterhin verständliche Formulierung bleibt näher an der griechischen Ausdrucksweise und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. „Aufseher“ vermeidet das heute irreführende Bild eines Klassenlehrers; „aus Glauben“ erhält bewusst die knappe paulinische Ausdrucksweise. Die Stellung von „bis zum Messias“ macht den zeitlichen Hauptsinn lesbar, während die Fußnote die mögliche Zielrichtung offenhält.
