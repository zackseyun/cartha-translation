  naturalness: Die Überarbeitung bietet modernes Standarddeutsch und macht deutlich, dass sich »viele/einen« auf den Bezug des Wortlauts beziehen. Die Stellung von »aber« bleibt als zurückhaltende Wiedergabe von δέ erhalten.
  terminology: »Verheißungen«, »Nachkomme« und »der Messias« sind angemessen. Die Fußnote erläutert präzise, dass σπέρμα im Singular ein Kollektivwort sein kann, während Paulus mit der ausdrücklich pluralischen Form kontrastiert. »Christus« ist als alternative Wiedergabe von Χριστός korrekt angegeben.
