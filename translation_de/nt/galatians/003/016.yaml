source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: de
  text: 'Die Verheißungen wurden aber Abraham und seinem Nachkommen[a] zugesagt. Es heißt nicht: »Und den Nachkommen«, als bezöge es sich auf viele, sondern als bezöge es sich auf einen: »Und deinem Nachkommen« – dieser ist der Messias.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Same«. Das griechische Wort steht hier im Singular und kann kollektiv »Nachkommenschaft« bedeuten. Paulus kontrastiert diese Singularform mit der ausdrücklich pluralischen Form »Samen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Christus«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: wurden zugesprochen
  rationale: Die Passivform wird natürlich wiedergegeben und bezeichnet, dass die Verheißungen an Abraham und seinen Nachkommen gerichtet wurden.
- source_word: ἐπαγγελίαι
  choice: Verheißungen
  rationale: Der im biblisch-theologischen Zusammenhang geläufige Ausdruck bewahrt den Sinn göttlicher Zusagen und einen würdigen Sprachton.
- source_word: σπέρμα / σπέρματι
  choice: Nachkomme / Nachkommen
  rationale: Das deutsche Wort hat im Singular und Plural dieselbe Form. Es kann kollektiv gebraucht werden und erlaubt es, die Spannung in Paulus’ Argument zu bewahren; eine Fußnote erläutert die im Griechischen sichtbare Numerusunterscheidung.
- source_word: τοῖς σπέρμασιν
  choice: den Nachkommen
  rationale: Gemeint ist ausdrücklich die griechische Pluralform. Da die deutsche Form äußerlich nicht vom Singular zu unterscheiden ist, wird der Kontrast im Begleitsatz und in der Fußnote kenntlich gemacht.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: als wären viele gemeint / sondern als wäre einer gemeint
  rationale: Die parallele Formulierung gibt den erklärenden Bezug idiomatisch wieder und erhält Paulus’ Gegensatz zwischen vielen und einem.
- source_word: Χριστός
  choice: der Messias
  rationale: Χριστός ist hier als Titel des verheißenen Gesalbten aktiv; »Messias« macht diese Bedeutung im Deutschen deutlich.
theological_decisions:
- issue: Paulus’ Deutung des singularischen σπέρμα
  choice: Die Identifikation mit einem Einzelnen wird im Haupttext bewahrt, ohne die kollektive Bedeutung des Wortes zu leugnen.
  alternative: »Samen« durchgehend verwenden, um die grammatische Argumentation formaler abzubilden.
  rationale: Das griechische σπέρμα ist ein singularisches Kollektivum und kann Nachkommenschaft bezeichnen. »Nachkomme« ist verständlicher, während die Fußnote die für das Argument zentrale sprachliche Form offenlegt.
- issue: Wiedergabe von Χριστός in der Identifikationsaussage
  choice: der Messias
  alternative: Christus
  rationale: Die Aussage identifiziert den verheißenen Nachkommen mit dem gesalbten Heilsträger; die Titelbedeutung ist daher hervorgehoben, ohne eine zusätzliche dogmatische Präzisierung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Argumentation mit Einzahl und Mehrzahl wird nicht geglättet; wegen der im Deutschen gleichlautenden Formen »Nachkomme/Nachkommen« erläutert eine Fußnote den griechischen Wortlaut.
