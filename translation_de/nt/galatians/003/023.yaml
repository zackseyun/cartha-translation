source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: de
  text: Doch bevor der Glaube kam,[a][d] wurden wir unter dem Gesetz bewacht[b] und eingeschlossen,[c] bis der Glaube offenbart werden sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bestimmte Artikel kann darauf hinweisen, dass Paulus vom Glauben als der mit Christus anbrechenden heilsgeschichtlichen Wirklichkeit spricht.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in Gewahrsam gehalten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eingesperrt“ oder „eingeschlossen gehalten“.'
    reason: lexical_alternative
  - marker: d
    text: Das griechische Wort πίστις kann auch „Treue“ oder „Vertrauen“ bedeuten; im Zusammenhang passt „Glaube“ am besten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: bevor ... kam
  rationale: Die Konstruktion mit πρό und substantiviertem Infinitiv ist temporal. Die deutsche Formulierung ist natürlich und gibt die Vorzeitigkeit klar wieder.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen leichten Gegensatz zum vorausgehenden Gedankengang; „Doch“ bildet diesen Übergang angemessen ab.
- source_word: τὴν πίστιν
  choice: der Glaube
  rationale: Der bestimmte Artikel wird bewahrt. Die Formulierung lässt sowohl den Glauben als solchen als auch die heilsgeschichtlich mit Christus anbrechende Wirklichkeit des Glaubens anklingen.
- source_word: ὑπὸ νόμον
  choice: unter dem Gesetz
  rationale: Die feste paulinische Wendung bezeichnet den Herrschafts- oder Geltungsbereich des Gesetzes; „unter dem Gesetz“ ist im Deutschen klar und etabliert.
- source_word: ἐφρουρούμεθα
  choice: wurden ... bewacht
  rationale: Das Imperfekt Passiv bezeichnet einen fortdauernden Zustand in der Vergangenheit. „Bewacht“ erhält das Bild des Schützens beziehungsweise Bewachens, ohne bereits ausschließlich Haft auszudrücken.
- source_word: συγκλειόμενοι
  choice: eingeschlossen
  rationale: Das Partizip verstärkt den Gedanken räumlicher oder bildlicher Begrenzung. „Eingeschlossen“ bewahrt diese restriktive Aussage, ohne sie unnötig zu verschärfen.
- source_word: εἰς
  choice: bis zu
  rationale: Im Zusammenhang bezeichnet εἰς die zeitliche und zielgerichtete Ausrichtung auf die bevorstehende Offenbarung des Glaubens. „Bis zu“ gibt diesen Übergang natürlich wieder.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: dem Glauben, der offenbart werden sollte
  rationale: Die Formulierung bewahrt den Zukunftsbezug von μέλλουσαν und das Passiv von ἀποκαλυφθῆναι, ohne näher festzulegen, wie unmittelbar die Offenbarung bevorstand.
theological_decisions:
- issue: Ob πίστις den persönlichen Glauben oder eine mit Christus anbrechende heilsgeschichtliche Wirklichkeit bezeichnet
  choice: „der Glaube“, mit bewahrtem bestimmten Artikel
  alternative: „Glaube“ ohne Artikel; „die Glaubenswirklichkeit“; „Treue“
  rationale: Der Kontext von Galater 3 stellt die Zeit unter dem Gesetz der mit Christus gekommenen Glaubenswirklichkeit gegenüber. Die schlichte Wiedergabe „der Glaube“ wahrt diese heilsgeschichtliche Dimension, ohne πίστις auf eine einzige theologische Deutung einzuengen.
- issue: Ob die Tätigkeit des Gesetzes vorwiegend schützend oder gefangen haltend zu verstehen ist
  choice: „bewacht“ im Haupttext, gefolgt von „eingeschlossen“
  alternative: „in Gewahrsam gehalten“ beziehungsweise „eingesperrt“
  rationale: φρουρέω kann Schutz und Bewachung beziehungsweise Gewahrsam bezeichnen; συγκλείω trägt deutlich die einschränkende Seite bei. Die Kombination bewahrt die Spannung beider Bilder.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, vermeidet aber unnötig starre Wortfolge. Die wiederholte Formulierung „der Glaube“ erhält die begriffliche und heilsgeschichtliche Spannung des Ausgangstextes.
