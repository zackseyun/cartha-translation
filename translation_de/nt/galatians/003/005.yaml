  naturalness: Die rhetorische Frage ist verständlich und im angemessen würdigen modernen Standarddeutsch gehalten. Eine Gliederung mit Doppelpunkt nach dem vorangestellten substantivierten Partizip erleichtert die Lesbarkeit gegenüber der Konstruktion „Der … – tut er das?“ und bewahrt die Hervorhebung des griechischen Satzbaus.
