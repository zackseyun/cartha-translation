id: GAL.3.5
reference: Galatians 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: de
  text: 'Der euch nun den Geist reichlich gibt und Wunder unter euch[a] wirkt: Tut er dies aufgrund von Werken des Gesetzes oder aufgrund des Hörens im Glauben[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in euch“.'
    reason: ἐν ὑμῖν kann sowohl gemeinschaftlich als auch stärker innerlich verstanden werden.
  - marker: b
    text: 'Wörtlich: „aus dem Hören des Glaubens“. Möglich auch: „aufgrund der Glaubensbotschaft“ oder „aufgrund der Botschaft, die im Glauben gehört wird“.'
    reason: Die Genitivverbindung ἀκοῆς πίστεως ist syntaktisch knapp und lässt mehrere eng verwandte Deutungen zu.
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: reichlich gibt
  rationale: Das Partizip bezeichnet ein fortdauerndes Gewähren bzw. Bereitstellen; „reichlich gibt“ bringt die großzügige Nuance des Verbs natürlich zum Ausdruck, ohne den Satz unnötig auszubauen.
- source_word: τὸ πνεῦμα
  choice: den Geist
  rationale: Der bestimmte Artikel und der paulinische Zusammenhang weisen auf Gottes Geist. „Den Geist“ bleibt näher am griechischen Text als die ausdrückliche Erweiterung „den Heiligen Geist“.
- source_word: ἐνεργῶν δυνάμεις
  choice: Wunder wirkt
  rationale: δυνάμεις bezeichnet hier machtvolle übernatürliche Taten. Die feste deutsche Verbindung „Wunder wirkt“ ist klar, würdevoll und kontextgemäß.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Bei wahrnehmbaren Wundertaten in den galatischen Gemeinden ist der gemeinschaftliche Sinn wahrscheinlich. Die ebenfalls mögliche Bedeutung „in euch“ wird in derselben Fußnote zusammen mit der syntaktischen Alternative vermerkt.
- source_word: ἐξ ἔργων νόμου
  choice: aufgrund von Werken des Gesetzes
  rationale: ἐκ bezeichnet hier die Grundlage bzw. Quelle. „Aufgrund von“ stellt den rhetorischen Gegensatz im Deutschen deutlich dar; „Werke des Gesetzes“ bewahrt die paulinische Formulierung.
- source_word: νόμου
  choice: des Gesetzes
  rationale: Obwohl im Griechischen kein Artikel steht, verweist die Wendung im Argumentationszusammenhang auf das mosaische Gesetz; im Deutschen ist der bestimmte Artikel idiomatisch.
- source_word: ἀκοῆς πίστεως
  choice: des Hörens im Glauben
  rationale: Die knappe Genitivverbindung bleibt mehrdeutig. „Hören im Glauben“ gibt gut verständlich ein Hören wieder, das mit Glauben verbunden ist, ohne die Wendung eindeutig als gehörte Botschaft festzulegen.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glaube“ entspricht hier dem naheliegenden Sinn von πίστις und passt zum Gegensatz zu den Werken des Gesetzes.
theological_decisions:
- issue: Die Genitivverbindung ἀκοῆς πίστεως lässt mehrere eng verwandte Deutungen zu.
  choice: aufgrund des Hörens im Glauben
  alternative: aufgrund der Glaubensbotschaft; aufgrund des Hörens, das zum Glauben führt
  rationale: Die Hauptfassung bewahrt die Verbindung von Hören und Glauben, ohne die syntaktische Beziehung völlig festzulegen. Die Fußnote nennt plausible Alternativen, damit die theologische Spannung nicht stillschweigend aufgelöst wird.
- issue: ἐν ὑμῖν kann gemeinschaftlich „unter euch“ oder stärker innerlich „in euch“ bedeuten.
  choice: unter euch
  alternative: in euch
  rationale: Der Zusammenhang mit Wundertaten spricht eher für Geschehnisse innerhalb der Gemeinden; die räumlich-innerliche Lesart bleibt jedoch sprachlich möglich und wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Frage und der Gegensatz zwischen Gesetzeswerken und glaubendem Hören bleiben erhalten. Der Gedankenstrich verdeutlicht im Deutschen, dass das Subjekt der Frage zunächst durch zwei Partizipialbestimmungen entfaltet wird.
