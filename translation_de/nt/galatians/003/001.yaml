source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: de
  text: Ihr unverständigen Galater! Wer hat euch verhext[a] – euch, denen Jesus, der Messias[b], als Gekreuzigter öffentlich vor Augen gestellt wurde[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »getäuscht«. Das griechische Verb weckt wörtlich die Vorstellung, jemanden zu behexen oder mit einem bösen Blick zu schädigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: »Jesus Christus«; »Messias« gibt die Bedeutung des Titels Christus wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »deutlich dargestellt« beziehungsweise »öffentlich bekannt gemacht«. Das griechische Verb kann an eine für alle sichtbare Bekanntmachung oder einen öffentlichen Anschlag denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: unverständigen
  rationale: Bezeichnet mangelndes Begreifen oder Urteilsvermögen und gibt den scharfen Tadel wieder, ohne eine weitergehende moralische Verurteilung einzutragen.
- source_word: Γαλάται
  choice: Galater
  rationale: Die im Deutschen übliche Bezeichnung für die angesprochene Bevölkerungsgruppe bzw. die Gemeinden in Galatien.
- source_word: ἐβάσκανεν
  choice: verhext
  rationale: Bewahrt das eindringliche Bild eines schädlichen, gleichsam magischen Einflusses; das neutralere »getäuscht« würde die rhetorische Schärfe abschwächen.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: euch, denen … vor Augen
  rationale: Gibt den relationalen Dativ und die Wendung κατ’ ὀφθαλμούς in natürlichem Deutsch wieder und hebt die anschauliche Gegenwärtigkeit der Verkündigung hervor.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Gibt Χριστός als bedeutungsvollen Titel wieder und behandelt ihn nicht wie einen bloßen Namensbestandteil.
- source_word: προεγράφη
  choice: öffentlich vor Augen gestellt wurde
  rationale: Gibt das offene, anschauliche Darstellen oder Bekanntmachen wieder. Die Formulierung vermeidet die im Deutschen missverständliche wörtliche Wiedergabe »vorher geschrieben«.
- source_word: ἐσταυρωμένος
  choice: als Gekreuzigter
  rationale: Das Perfektpartizip bezeichnet Jesus in seinem durch die Kreuzigung bestimmten Zustand und steht prädikativ zu προεγράφη.
theological_decisions:
- issue: Wiedergabe von Χριστός in Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung macht den Titelgehalt von Χριστός hörbar. Die traditionelle Form wird in einer Fußnote genannt, ohne den Titel im Haupttext zu einem Familiennamen abzuflachen.
- issue: Darstellung Jesu als ἐσταυρωμένος
  choice: als Gekreuzigter
  alternative: als gekreuzigt
  rationale: »Als Gekreuzigter« bewahrt die Zustandsbedeutung des Perfektpartizips und lässt offen, auf welche konkrete Weise Paulus die anschauliche Darstellung in der Verkündigung versteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält den griechischen Zusammenhang zwischen der Frage und dem Relativsatz, ohne eine schwer verständliche deutsche Satzfügung zu erzwingen. »Unverständig« ist ein deutlicher, aber nicht unnötig beleidigender Tadel; »verhext« bewahrt das lebhafte Bild des Ausgangstextes.
