id: GAL.3.22
reference: Galatians 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: de
  text: Doch die Schrift hat alles[a] unter die Sünde eingeschlossen, damit die Verheißung durch den Glauben an Jesus, den Messias,[b] denen gegeben werde, die glauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: alle Dinge.'
    reason: Lexikalische Alternative, welche die formale Mehrzahl von τὰ πάντα sichtbar macht.
  - marker: b
    text: 'Oder: durch die Treue Jesu, des Messias.'
    reason: Alternative Deutung des Genitivs πίστεως Ἰησοῦ Χριστοῦ als subjektiver Genitiv.
lexical_decisions:
- source_word: συνέκλεισεν
  choice: hat … eingeschlossen
  rationale: Das Verb bezeichnet ein vollständiges Einschließen beziehungsweise Festhalten. „Eingeschlossen“ bewahrt dieses Bild, ohne die Art der Gefangenschaft näher auszudeuten.
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Der Singular mit Artikel stellt die Schrift als handelndes, einheitliches Zeugnis dar; die deutsche Form gibt diese Personifikation unmittelbar wieder.
- source_word: τὰ πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural hat einen umfassenden Sinn. „Alles“ ist im Deutschen natürlich und beschränkt die Aussage nicht ausdrücklich auf Menschen.
- source_word: ὑπὸ ἁμαρτίαν
  choice: unter der Sünde
  rationale: Die knappe Formulierung erhält das paulinische Bild der Unterstellung unter die Sünde, ohne deutend „Macht“ oder „Herrschaft“ in den Haupttext einzufügen.
- source_word: ἡ ἐπαγγελία
  choice: die Verheißung
  rationale: „Verheißung“ gibt den religiös geprägten Sinn von ἐπαγγελία präzise und in würdigem, verständlichem Deutsch wieder.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: durch den Glauben an Jesus, den Messias
  rationale: 'Der Haupttext versteht den Genitiv objektiv: Glaube, der auf Jesus, den Messias, gerichtet ist. Die ebenso mögliche subjektive Deutung wird in einer Fußnote bewahrt.'
- source_word: Χριστοῦ
  choice: den Messias
  rationale: Χριστός wird hier zusammen mit Jesus als Titel gebraucht; „Messias“ macht diesen Titelcharakter im Deutschen deutlich.
- source_word: δοθῇ
  choice: gegeben würde
  rationale: Der passive Konjunktiv im ἵνα-Satz wird als Ziel beziehungsweise Zweck der vorherigen Handlung wiedergegeben.
- source_word: τοῖς πιστεύουσιν
  choice: denen …, die glauben
  rationale: Die Formulierung bewahrt den verbalen Charakter des Partizips und beschreibt die Glaubenden durch ihr Glauben, statt nur eine Gruppenbezeichnung zu verwenden.
theological_decisions:
- issue: Genitivkonstruktion πίστεως Ἰησοῦ Χριστοῦ
  choice: 'objektiver Genitiv: „Glaube an Jesus, den Messias“'
  alternative: 'subjektiver Genitiv: „Treue Jesu, des Messias“'
  rationale: Die grammatische Konstruktion ist tatsächlich mehrdeutig und theologisch umstritten. Der Haupttext verwendet die verbreitete objektive Deutung; die subjektive Deutung bleibt in der Fußnote ausdrücklich sichtbar.
- issue: Umfang von τὰ πάντα
  choice: „alles“
  alternative: „alle Dinge“
  rationale: Der neutrale Plural ist umfassend und darf nicht ohne Weiteres auf alle Menschen verengt werden. „Alles“ erhält diesen offenen Umfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper paulinischer Bildsprache. Die ungewöhnlich dichte Wendung „unter der Sünde eingeschlossen“ bleibt erhalten, damit weder „Sünde“ vorschnell zu „Herrschaft der Sünde“ erweitert noch das Bild des Einschließens abgeschwächt wird.
