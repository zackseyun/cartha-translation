  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des griechischen Textes insgesamt zuverlässig wieder: συνέκλεισεν als „eingeschlossen“, ἡ γραφή als handelnde „Schrift“, τὰ πάντα als offenes „alles“, ἡ ἐπαγγελία als „Verheißung“ sowie die Empfänger als „die glauben“. Die umstrittene Genitivverbindung πίστεως Ἰησοῦ Χριστοῦ wird im Haupttext als objektiver Genitiv wiedergegeben und die subjektive Lesart sachgerecht in der Fußnote erhalten.'
  naturalness: „Unter der Sünde eingeschlossen“ ist verständlich, aber „unter die Sünde eingeschlossen“ bildet die griechische Präpositionalfügung im Deutschen unmittelbarer und idiomatischer ab. Im Zwecksatz ist „gegeben werde“ der reguläre deutsche Konjunktiv für das beabsichtigte Ergebnis; „gegeben würde“ wirkt hier unnötig konditional bzw. vergangenheitsbezogen.
  terminology: „Schrift“, „Sünde“, „Verheißung“, „Glaube“ und „Messias“ sind terminologisch angemessen. Die Fußnote zur alternativen Deutung als „Treue Jesu, des Messias“ wahrt die grammatische und theologische Mehrdeutigkeit, ohne sie im Haupttext aufzulösen.
