  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: de
  text: 'Erkennt also: Diejenigen, die aus Glauben leben – sie sind Abrahams Söhne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: Erkennt
  rationale: Der wahrscheinlich indikativische Imperativsinn wird als nachdrückliche Aufforderung wiedergegeben; „erkennt“ ist würdig und im heutigen Standarddeutsch verständlich.
- source_word: οἱ ἐκ πίστεως
  choice: die aus Glauben
  rationale: Die knappe Herkunfts- bzw. Zugehörigkeitsformel ἐκ πίστεως bleibt bewusst eng am Griechischen und wird nicht deutend zu „die glauben“ oder „die aufgrund des Glaubens leben“ erweitert.
- source_word: οὗτοι
  choice: die
  rationale: Die Wiederaufnahme durch οὗτοι wird in der natürlichen deutschen Hervorhebung „die sind“ bewahrt, statt sie syntaktisch einzuebnen.
- source_word: υἱοί
  choice: Söhne
  rationale: Das konkrete Verwandtschaftsbild und die im Kontext relevante Abstammungssprache werden erhalten; eine inklusive Verallgemeinerung zu „Kinder“ würde die griechische Form weniger genau abbilden.
theological_decisions:
- issue: Zugehörigkeit zu Abraham aufgrund des Glaubens
  choice: „Die aus Glauben sind, die sind Abrahams Söhne“
  alternative: „Wer glaubt, gehört zu den Kindern Abrahams“
  rationale: Die Übersetzung bewahrt sowohl die prägnante Formel ἐκ πίστεως als auch die emphatische Identifikation durch οὗτοι, ohne Art oder Gegenstand des Glaubens in diesem Vers ergänzend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schriftsprachlichem „Erkennt“. Der Doppelpunkt bildet die folgernde Feststellung nach ἄρα klar ab; „die sind“ erhält die griechische Hervorhebung.
