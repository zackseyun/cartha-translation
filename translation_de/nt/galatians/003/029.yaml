id: GAL.3.29
reference: Galatians 3:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: de
  text: Wenn ihr aber dem Messias gehört, dann seid ihr Abrahams Nachkommenschaft[a], Erben gemäß der Verheißung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Nachkommen«. Wörtlich »Same«; das griechische Wort steht im Singular und greift Paulus’ frühere Formulierung in diesem Kapitel auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: dem Messias gehört
  rationale: Der Genitiv bezeichnet Zugehörigkeit. Die idiomatische deutsche Wendung gibt dies klar wieder; »Messias« bewahrt den Titelcharakter von Χριστός.
- source_word: σπέρμα
  choice: Same
  rationale: Der kollektive Singular und die bewusste Wortverbindung zu Paulus’ vorausgehendem Argument über Abrahams »Samen« in Galater 3 bleiben erhalten.
- source_word: κληρονόμοι
  choice: Erben
  rationale: »Erben« ist im familiären und verheißungsgeschichtlichen Zusammenhang die natürliche deutsche Entsprechung.
- source_word: κατ’ ἐπαγγελίαν
  choice: gemäß der Verheißung
  rationale: Die Formulierung bewahrt die Offenheit von κατά hinsichtlich Maßstab, Grundlage oder Entsprechung. Der im Deutschen zur natürlichen Bestimmtheit nötige Artikel verweist auf die im Kontext genannte Verheißung.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Wenn ihr aber ... dann
  rationale: Diese Wiedergabe erhält sowohl den leichten weiterführenden beziehungsweise kontrastierenden Anschluss durch δέ als auch die Folgerungsstruktur der Bedingung.
theological_decisions:
- issue: Soll σπέρμα mit einem modernen Sammelbegriff wiedergegeben oder als Singular bewahrt werden?
  choice: Same
  alternative: Nachkommen
  rationale: »Same« hält die lexikalische und theologische Verbindung zu Galater 3,16 sichtbar, ohne den kollektiven Sinn aufzulösen.
- issue: Soll Χριστοῦ als Titel oder in der eingebürgerten Namensform erscheinen?
  choice: dem Messias gehört
  alternative: Christus gehört / Christi seid
  rationale: »Messias« macht den Titelcharakter deutlich; die Zugehörigkeitswendung gibt den griechischen Genitiv natürlich wieder, ohne zusätzliche theologische Bestimmung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Same« ist bewusst traditionsnah und kontextuell präzise; die Fußnote erklärt den kollektiven Sinn.
