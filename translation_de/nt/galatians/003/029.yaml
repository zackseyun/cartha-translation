review_pass:
  verdict: revise
  source_fidelity: Die Bedingungs- und Folgerungsstruktur (εἰ δέ … ἄρα), die Zugehörigkeit zum Messias, die Abraham-Beziehung und κληρονόμοι sind zutreffend wiedergegeben. »Gemäß der Verheißung« gibt κατ’ ἐπαγγελίαν angemessen wieder, ohne die genaue Nuance von κατά unzulässig festzulegen.
  naturalness: »Dem Messias gehören« und »Erben gemäß der Verheißung« sind modernes, gut verständliches Standarddeutsch. »Abrahams Same« ist zwar traditionssprachlich und etymologisch möglich, bezeichnet im heutigen allgemeinen Deutsch jedoch vorrangig Sperma und wirkt daher hier unnatürlich bzw. missverständlich. »Nachkommenschaft« ist ein natürlicher kollektiver Singular.
  terminology: »Messias« wahrt den Titelcharakter von Χριστός. »Nachkommenschaft« gibt σπέρμα als kollektiven Singular wieder; die Fußnote muss den wörtlichen Ausdruck »Same« sowie den literarischen Rückbezug ausdrücklich erhalten. »Erben« und »Verheißung« sind passend.
