review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf trifft die rhetorische Frage, die entschiedene Zurückweisung, den Plural »Verheißungen« sowie die Aussage, dass Gerechtigkeit nicht aus dem Gesetz hervorgehen kann, grundsätzlich gut. Im irrealen Bedingungssatz sollte jedoch die Folgerung ebenfalls als vergangenheitsbezogene Irrealis wiedergegeben werden: ἦν korrespondiert hier mit der hypothetisch als gegeben angenommenen Gesetzgebung.'
  naturalness: »Auf keinen Fall!« und »im Widerspruch zu« sind modernes, klares Standarddeutsch. »Leben geben« ist für ζῳοποιῆσαι idiomatischer und präziser als das ohne Objekt etwas offene »lebendig machen«. Die Abfolge »wäre ... gegeben worden ..., dann wäre ...« ist im Deutschen die natürliche und eindeutige Form der kontrafaktischen Vergangenheit.
  terminology: »Gesetz«, »Verheißungen« und »Gerechtigkeit« sind angemessen. Die Fußnote sollte den semantischen Spielraum von δικαιοσύνη als mögliche Nuance von »Recht/Gerechtigkeit« benennen, statt die Aussage bereits auf »Gerechtsein vor Gott« einzugrenzen.
  issues:
