id: GAL.3.21
reference: Galatians 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: de
  text: Steht das Gesetz nun im Widerspruch zu den Verheißungen Gottes? Auf keinen Fall! Denn wenn ein Gesetz gegeben worden wäre, das Leben geben könnte, dann wäre die Gerechtigkeit[a] tatsächlich aus dem Gesetz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch die Nuance von Recht oder Gerechtigkeit im umfassenderen Sinn haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Gesetz
  rationale: Die artikellose hypothetische Formulierung »ein Gesetz« im zweiten Satz bezeichnet Gesetz als Kategorie; zugleich bleibt durch den Kontext der Bezug zum mosaischen Gesetz erhalten. Im ersten und letzten Vorkommen ist im Deutschen der bestimmte Artikel für einen natürlichen Ausdruck erforderlich.
- source_word: κατὰ
  choice: im Widerspruch zu
  rationale: κατά mit Genitiv bezeichnet hier Gegnerschaft oder Unvereinbarkeit. »Im Widerspruch zu« gibt die rhetorische Frage im modernen Deutschen klar und präzise wieder.
- source_word: ἐπαγγελιῶν
  choice: Verheißungen
  rationale: Der ausdrückliche Plural wird bewahrt und verweist auf die zuvor behandelten göttlichen Verheißungen.
- source_word: μὴ γένοιτο
  choice: Auf keinen Fall!
  rationale: Die idiomatische deutsche Zurückweisung bewahrt die starke Kraft der paulinischen Formel, ohne das im Deutschen unnatürliche »Es möge niemals geschehen« zu verwenden.
- source_word: ἐδόθη
  choice: gegeben worden wäre
  rationale: Der Aorist Passiv steht in einer irrealen Bedingung. Der deutsche Konjunktiv II macht den hypothetischen Charakter deutlich.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: das lebendig machen könnte
  rationale: 'Die Formulierung bewahrt sowohl die Fähigkeit, die das Gesetz besitzen müsste, als auch den kausativen Sinn von ζῳοποιέω: Leben zu schaffen beziehungsweise lebendig zu machen.'
- source_word: ὄντως
  choice: tatsächlich
  rationale: Das Adverb verstärkt die Folgerung und wird in natürlichem, allgemein verständlichem Deutsch wiedergegeben.
- source_word: ἐκ νόμου
  choice: aus dem Gesetz
  rationale: »Aus« bewahrt die Herkunfts- beziehungsweise Ursprungsnuance von ἐκ und lässt offen, auf welche Weise das Gesetz die Gerechtigkeit hervorbringen würde.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« ist die direkte und im paulinischen Zusammenhang etablierte deutsche Entsprechung; sie kann sowohl das Gerechtsein vor Gott als auch den umfassenderen Gerechtigkeitsbegriff tragen.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη im paulinischen Argument
  choice: Gerechtigkeit
  alternative: Gerechtsein vor Gott; recht-schaffende Gerechtigkeit
  rationale: Der deutsche Ausdruck »Gerechtigkeit« lässt die im griechischen Begriff vorhandene Spannung stehen. Eine engere Umschreibung im Haupttext würde die Aussage vorschnell auf einen einzelnen theologischen Aspekt festlegen.
- issue: Verhältnis von Gesetz und göttlichen Verheißungen
  choice: im Widerspruch zu
  alternative: gegen
  rationale: Die Frage betrifft nicht bloß feindliches Handeln, sondern eine mögliche Unvereinbarkeit zwischen Gesetz und Verheißungen. Die Formulierung gibt diese Spannung wieder, während die nachfolgende starke Verneinung erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die nachdrückliche Zurückweisung bleiben deutlich. Der Konjunktiv II bildet die irreale Bedingung natürlich ab; Fachsprache und konfessionell festgelegte Umschreibungen werden vermieden.
