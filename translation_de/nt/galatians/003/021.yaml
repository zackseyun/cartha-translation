    issue: Die Apodosis »dann käme die Gerechtigkeit ...« steht im Präsens-Kontext des Konjunktivs II.
    rationale: Der griechische irrealer Bedingungssatz (εἰ ἐδόθη ... ἦν) betrachtet sowohl die angenommene Gesetzgebung als auch die daraus folgende Gerechtigkeit kontrafaktisch. »Dann wäre die Gerechtigkeit tatsächlich aus dem Gesetz« gibt diese geschlossene hypothetische Aussage genauer wieder.
  - severity: low
