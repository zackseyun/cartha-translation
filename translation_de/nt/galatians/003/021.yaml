    rationale: Diese Deutung kann im paulinischen Kontext einschlägig sein, ist aber nicht als alleinige lexikalische Alternative aus dem Einzelvers abzuleiten. Eine offenere Formulierung erhält die Bedeutungsweite ohne konfessionelle Vorentscheidung.
