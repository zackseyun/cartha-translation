  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: de
  text: Habt ihr so viel vergeblich erlitten? – Wenn es denn wirklich vergeblich war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Habt ihr so viel vergeblich erfahren?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: so viel
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet umfassend all das, was die Galater durchgemacht haben; im Deutschen gibt „so viel“ dies natürlicher wieder als „so viele Dinge“.
- source_word: ἐπάθετε
  choice: habt ihr … erlitten
  rationale: πάσχω kann „leiden/erleiden“ oder allgemeiner „erfahren“ bedeuten. „Erlitten“ bewahrt die wahrscheinlich negative Bedeutung, ohne die weitere Möglichkeit zu verschweigen.
- source_word: εἰκῇ
  choice: vergeblich
  rationale: „Vergeblich“ gibt die Vorstellung von Zwecklosigkeit oder ausbleibendem Ergebnis prägnant wieder und wird wegen der rhetorischen Wiederholung an beiden Stellen beibehalten.
- source_word: εἴ γε
  choice: wenn es denn
  rationale: Die Wendung führt eine einschränkende, rhetorisch hoffnungsvolle Bedingung ein; „wenn es denn“ wahrt diesen Vorbehalt in natürlichem Deutsch.
- source_word: καὶ
  choice: wirklich
  rationale: καί verstärkt hier im Zusammenhang mit der Bedingung die Aussage; „wirklich“ vermittelt idiomatisch den Sinn von „tatsächlich“.
theological_decisions:
- issue: Ob Paulus endgültig feststellt, dass das Erlittene nutzlos war
  choice: Die zweite Satzhälfte bleibt als vorsichtige Bedingung formuliert.
  alternative: Eine endgültige Feststellung, dass alles vergeblich gewesen sei.
  rationale: εἴ γε καὶ lässt Paulus seine Frage qualifizieren und hält die Möglichkeit offen, dass es doch nicht vergeblich war.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Perfekt entspricht natürlichem gegenwärtigem Sprachgebrauch; der Gedankenstrich bildet die zugespitzte nachträgliche Einschränkung ab.
