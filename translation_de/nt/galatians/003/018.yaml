  rationale: Die Revision klärt Gott als handelndes Subjekt und Abraham als Empfänger, ohne die Betonung des Kontrasts, die Perfektbedeutung oder die gnädige Nuance von κεχάρισται zu verändern. Eine Fußnote ist nicht erforderlich; die im englischen Audit Trail verzeichnete Alternative betrifft keine im Deutschen notwendige oder strittige Übersetzungsentscheidung.
