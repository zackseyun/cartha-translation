id: GAL.3.18
reference: Galatians 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: de
  text: Denn wenn das Erbe aus dem Gesetz stammt, stammt es nicht mehr aus einer Verheißung; Gott aber hat es Abraham durch eine Verheißung aus Gnade geschenkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: das Erbe
  rationale: „Erbe“ ist im Deutschen die natürliche paulinische Bezeichnung für das, was einem als Erben zugesprochen wird, und bewahrt den Gegensatz zwischen Gesetz und Verheißung.
- source_word: ἐκ νόμου
  choice: aus dem Gesetz
  rationale: Die Formulierung erhält den Herkunfts- beziehungsweise Grundgedanken von ἐκ und spiegelt den parallelen Gegensatz zu ἐξ ἐπαγγελίας.
- source_word: ἐξ ἐπαγγελίας
  choice: aus einer Verheißung
  rationale: Die anarthrische Form lässt sich im Deutschen natürlich so wiedergeben; zugleich bleibt der Bezug auf Gottes Verheißung an Abraham im Zusammenhang erkennbar.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: 'Dies gibt den ausschließenden Gedankengang klar wieder: Beruht das Erbe auf dem Gesetz, beruht es nicht länger auf einer Verheißung.'
- source_word: τῷ δὲ Ἀβραὰμ
  choice: Abraham aber
  rationale: Der vorangestellte Dativ wird durch die hervorgehobene Stellung von „Abraham“ und das später aufgenommene „es“ natürlich wiedergegeben.
- source_word: δι’ ἐπαγγελίας
  choice: durch eine Verheißung
  rationale: „Durch“ bewahrt die instrumentale Bedeutung von διά und hält den Gegensatz zum Gesetz deutlich.
- source_word: κεχάρισται
  choice: hat … aus Gnade geschenkt
  rationale: Das Perfekt wird mit „hat … geschenkt“ wiedergegeben; „aus Gnade“ macht die im Verb χαρίζομαι enthaltene unverdiente, gnädige Zuwendung sichtbar, ohne eine zusätzliche Lehrthese einzutragen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Die ausdrückliche Nennung des handelnden Subjekts wird beibehalten.
theological_decisions:
- issue: Soll der Gnadenton von χαρίζομαι ausdrücklich wiedergegeben werden?
  choice: „hat … aus Gnade geschenkt“
  alternative: „hat … gewährt“ oder schlicht „hat … geschenkt“
  rationale: χαρίζομαι bezeichnet hier nicht nur ein neutrales Geben, sondern ein gnädiges Schenken. Die ausdrückliche Wiedergabe stützt den im Vers angelegten Gegensatz von Gesetz und Verheißung, ohne ihn konfessionell auszudeuten.
- issue: Bezeichnet νόμος hier das mosaische Gesetz oder allgemein Gesetz als Prinzip?
  choice: „das Gesetz“
  alternative: „Gesetz“
  rationale: Der unmittelbare Argumentationszusammenhang legt das mosaische Gesetz nahe. Der bestimmte Artikel ist im Deutschen idiomatisch und lässt zugleich die von Paulus mitgedachte Wirkweise des Gesetzes erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wendungen „aus dem Gesetz“ und „aus einer Verheißung“ bewahren die argumentative Struktur des Griechischen. Das vorangestellte „Abraham aber“ erhält dessen Hervorhebung, ohne einen schwerfälligen Satzbau zu erzeugen. Die englische Fußnote wurde nicht übernommen, da sie offenbar falsch platziert ist und keine für die deutsche Fassung notwendige Bedeutungsalternative bietet.
