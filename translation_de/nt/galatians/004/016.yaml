  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: de
  text: Bin ich also euer Feind geworden, indem ich euch die Wahrheit sage?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem ich wahrheitsgemäß zu euch rede“. Das griechische Partizip kann bedeuten, die Wahrheit zu sagen oder wahrheitsgemäß zu reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: also
  rationale: Die folgernde Konjunktion zieht eine rhetorische Schlussfolgerung aus dem vorher Gesagten; „also“ ist im Deutschen knapp und natürlich.
- source_word: ἐχθρὸς ὑμῶν
  choice: euer Feind
  rationale: Das prädikativ beziehungsweise substantivisch gebrauchte ἐχθρός bezeichnet jemanden, der als Feind angesehen wird; der Genitiv wird idiomatisch possessiv wiedergegeben.
- source_word: γέγονα
  choice: bin ich … geworden
  rationale: Das Perfekt von γίνομαι bezeichnet einen eingetretenen Zustand mit gegenwärtiger Auswirkung; das deutsche Perfekt bewahrt diesen Sinn.
- source_word: ἀληθεύων ὑμῖν
  choice: weil ich euch die Wahrheit sage
  rationale: Das Partizip bezeichnet hier wahrheitsgemäßes Reden gegenüber den Galatern. „Weil“ gibt den wahrscheinlich kausalen Bezug zur Feindschaft idiomatisch wieder, während die Fußnote die lexikalische Breite festhält.
theological_decisions:
- issue: Sinn von ἀληθεύων in der rhetorischen Frage
  choice: Paulus fragt, ob sein wahrheitsgemäßes Reden zu den Galatern dazu geführt hat, dass sie ihn als Feind betrachten.
  alternative: Paulus fragt, ob seine allgemeine Wahrhaftigkeit ihnen gegenüber ihn zu ihrem Feind gemacht hat.
  rationale: Der Zusammenhang betrifft Paulus’ offene Zurechtweisung und seinen eindringlichen Appell. Die Übersetzung bleibt bei der kommunikativen Bedeutung, ohne zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die rhetorische Frage und der resultative Sinn des griechischen Perfekts bleiben erhalten.
