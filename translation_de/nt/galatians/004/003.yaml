source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: de
  text: Ebenso waren auch wir, als wir unmündig waren, unter den Grundprinzipien der Welt versklavt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Elementarmächten der Welt“; der griechische Ausdruck kann Grundprinzipien oder Grundelemente, aber auch kosmische geistliche Mächte bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Ebenso … auch
  rationale: Kennzeichnet die Entsprechung zum vorangehenden Vergleich mit dem unmündigen Erben und gibt die vergleichende Kraft knapp und natürlich wieder.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten; „auch“ hebt die Einbeziehung der Sprechergruppe in den Vergleich hervor.
- source_word: ὅτε ἦμεν νήπιοι
  choice: als wir unmündig waren
  rationale: „Unmündig“ nimmt im Kontext den rechtlichen und entwicklungsbezogenen Status des noch nicht selbstständigen Erben auf, ohne den Ausdruck auf Kleinkinder zu verengen.
- source_word: ὑπὸ
  choice: unter
  rationale: Bewahrt das Bild der Unterordnung und entspricht dem wiederkehrenden Sprachgebrauch des Abschnitts.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: die Grundprinzipien der Welt
  rationale: στοιχεῖα kann Grundelemente beziehungsweise Grundprinzipien, möglicherweise aber auch kosmische Mächte bezeichnen. Die Haupttextfassung bleibt zunächst sachlich, während die personale Deutung in der Fußnote erhalten wird.
- source_word: ἤμεθα δεδουλωμένοι
  choice: waren … versklavt
  rationale: Gibt die periphrastische Passivkonstruktion klar wieder und bewahrt die starke Sprache tatsächlicher Unterworfenheit.
theological_decisions:
- issue: Bedeutung von τὰ στοιχεῖα τοῦ κόσμου
  choice: Im Haupttext nichtpersonal als „die Grundprinzipien der Welt“ wiedergegeben
  alternative: „die Elementarmächte der Welt“ oder „die Grundelemente der Welt“
  rationale: Der Ausdruck ist in Galater und Kolosser umstritten. Der Zusammenhang mit der Unmündigkeit unter Aufsicht lässt eine nichtpersonale Wiedergabe zu; zugleich kann die Formulierung kosmische geistliche Mächte anklingen lassen. Die Fußnote bewahrt diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unmündig“ hält die Verbindung zum Erbenvergleich aufrecht; „versklavt“ bewahrt die Schärfe des griechischen Ausdrucks. Die umstrittene Bedeutung von στοιχεῖα wird im Haupttext nicht übermäßig festgelegt und in der Fußnote erläutert.
