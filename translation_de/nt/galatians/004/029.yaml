revisions:
- from: Doch wie damals der, der dem Fleisch entsprechend geboren war, den verfolgte, der dem Geist entsprechend geboren war,[a][b] so ist es auch jetzt.
  to: Doch wie damals der nach dem Fleisch[a] Geborene den nach dem Geist[b] Geborenen verfolgte, so ist es auch jetzt.
  rationale: Die Revision ersetzt die syntaktisch sperrige Formulierung „dem ... entsprechend geboren“ durch die im Deutschen natürliche und in der paulinischen Sprache etablierte Wendung „nach dem ... geboren“. Sie erhält die Ambiguität von κατά sowie den Gegensatz von Fleisch und Geist. Die Fußnoten erläutern weiterhin sowohl die nichtmoralische Lesemöglichkeit von „Fleisch“ als auch die im zweiten Satzglied ergänzte Partizipialform; ihre Anker sind an die jeweiligen Begriffe versetzt.
