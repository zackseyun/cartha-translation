  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: de
  text: Doch wie damals der nach dem Fleisch[a] Geborene den nach dem Geist[b] Geborenen verfolgte, so ist es auch jetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der auf gewöhnliche menschliche Weise Geborene“; wörtlich: „der nach dem Fleisch Geborene“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den nach dem Geist [Seienden]“; „Geborenen“ ist aus dem ersten Satzglied ergänzt, um die Parallele im Deutschen deutlich zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorangehenden Gedankengang knapp und in gehobenem, modernem Deutsch.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: wie damals ... so ist es auch jetzt
  rationale: Bewahrt die korrelative Vergleichsstruktur und ergänzt im Deutschen idiomatisch „ist es“ zur griechischen Ellipse.
- source_word: ὁ ... γεννηθεὶς
  choice: der, der ... geboren war
  rationale: Gibt das substantivierte Aorist-Passiv-Partizip natürlich wieder; das Plusquamperfekt ordnet die Geburt zeitlich vor der Verfolgung ein.
- source_word: κατὰ σάρκα
  choice: dem Fleisch entsprechend
  rationale: Erhält Paulus’ Begriff „Fleisch“ und den formalen Gegensatz zum Geist, ohne ihn vorschnell als sündige Natur oder bloß als biologisches Mittel auszulegen.
- source_word: ἐδίωκε
  choice: verfolgte
  rationale: Gibt die feindselige Bedrängung im historischen Vergleich angemessen wieder; der Imperfekt bezeichnet hier das damalige Geschehen.
- source_word: τὸν κατὰ πνεῦμα
  choice: der dem Geist entsprechend geboren war
  rationale: „Geboren war“ wird aus dem ersten Satzglied ergänzt, um die Parallele im Deutschen klarzumachen; eine Fußnote weist auf die Ellipse hin.
- source_word: πνεῦμα
  choice: Geist
  rationale: Der Zusammenhang von Verheißung und Geist in Galater 4 legt den Heiligen Geist nahe; die Großschreibung bildet diese Deutung ab.
- source_word: νῦν
  choice: jetzt
  rationale: Gibt den zeitlichen Übergang von der damaligen Geschichte zur gegenwärtigen Lage der Adressaten schlicht wieder.
theological_decisions:
- issue: Bedeutung von κατὰ σάρκα im Gegensatz zwischen Ismael und Isaak
  choice: „dem Fleisch entsprechend“ im Haupttext, mit Erklärung als natürliche menschliche Zeugung in der Fußnote
  alternative: „auf gewöhnliche menschliche Weise geboren“
  rationale: Der unmittelbare Zusammenhang stellt natürliche menschliche Zeugung der Geburt aufgrund der Verheißung beziehungsweise dem Geist entsprechend gegenüber. Die formnahe Wiedergabe bewahrt zugleich Paulus’ sprachliche und theologische Spannung.
- issue: Bezug von πνεῦμα
  choice: Heiliger Geist, durch Großschreibung „Geist“ kenntlich gemacht
  alternative: menschlicher Geist oder ein allgemeines geistliches Prinzip
  rationale: Im Kontext des Galaterbriefs und der Verbindung mit der Verheißung bezeichnet πνεῦμα am wahrscheinlichsten Gottes Geist; die Präposition κατά bleibt dennoch mit „entsprechend“ bewusst offen und wird nicht auf reine Verursachung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Formulierung erhält Paulus’ Gegensatz zwischen Fleisch und Geist; die etwas markierte Wendung „dem ... entsprechend“ wird zugunsten der Nähe zum griechischen κατά und der theologischen Offenheit beibehalten.
