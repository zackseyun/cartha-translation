  source_fidelity: Der Entwurf gibt die Vergleichsstruktur, den Gegensatz κατὰ σάρκα/κατὰ πνεῦμα, das Imperfekt ἐδίωκε und den Gegenwartsbezug νῦν sachgerecht wieder. Die Ergänzung von „geboren“ im zweiten Glied ist im Deutschen zur Verdeutlichung der im Griechischen elliptischen Parallele vertretbar.
  naturalness: „Dem Fleisch/Geist entsprechend geboren“ ist zwar verständlich, klingt im modernen Standarddeutsch jedoch unnötig konstruiert. „Nach dem Fleisch/Geist geboren“ ist eine etablierte, würdige und zugleich klarere Wiedergabe der paulinischen Gegenüberstellung.
  terminology: „Fleisch“ und der großgeschriebene „Geist“ bewahren die paulinische Terminologie. „Nach“ gibt κατά hier idiomatischer wieder, ohne die Wendung einseitig als bloßes Mittel oder als moralische Aussage festzulegen.
