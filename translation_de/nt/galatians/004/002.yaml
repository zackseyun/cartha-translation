  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: de
  text: sondern er steht unter Vormündern und Verwaltern[a] bis zu dem vom Vater festgesetzten Zeitpunkt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gutsverwaltern“; das griechische Wort bezeichnet Personen, die einen Haushalt oder Besitz verwalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bis zum festgesetzten Zeitpunkt des Vaters“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Die Konjunktion setzt der Aussage des vorigen Verses entgegen, dass der unmündige Erbe praktisch nicht frei ist. Nach der vorausgehenden Verneinung ist „sondern“ im Deutschen idiomatisch.
- source_word: ὑπὸ
  choice: unter
  rationale: Mit dem Akkusativ bezeichnet die Präposition hier die Unterstellung unter Aufsicht und Autorität; „unter“ bewahrt dieses Bild knapp und natürlich.
- source_word: ἐπιτρόπους
  choice: Vormündern
  rationale: Gemeint sind Personen, denen die persönliche Aufsicht über einen Minderjährigen anvertraut ist. „Vormünder“ unterscheidet diese Aufgabe von der Verwaltung des Besitzes.
- source_word: ἐστὶ
  choice: er steht
  rationale: Das im Deutschen nötige Pronomen nimmt den Erben aus dem vorigen Vers auf. „steht unter“ ist die natürliche Verbindung mit den folgenden Aufsichtspersonen.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet schlicht die beiden Gruppen von Aufsichtspersonen.
- source_word: οἰκονόμους
  choice: Verwaltern
  rationale: Der Ausdruck bezeichnet Personen, die einen Haushalt oder Besitz verwalten. „Verwalter“ ist im heutigen Deutsch verständlich und erhält den sachlichen Unterschied zu den Vormündern.
- source_word: ἄχρι
  choice: bis zu
  rationale: Die Präposition markiert die zeitliche Grenze der Unterstellung.
- source_word: τῆς προθεσμίας
  choice: dem festgesetzten Zeitpunkt
  rationale: Das Substantiv bezeichnet einen vorher bestimmten Termin oder Zeitpunkt; die Formulierung ist präzise und modernes Standarddeutsch.
- source_word: τοῦ πατρός
  choice: vom Vater
  rationale: Der Genitiv lässt sich im Kontext am natürlichsten so verstehen, dass der Vater den Zeitpunkt festsetzt. Der bestimmte Artikel des Griechischen bleibt mit „dem Vater“ sachlich gewahrt, ohne ausdrücklich ein Possessivpronomen einzuführen.
theological_decisions:
- issue: Deutung des Genitivs in τοῦ πατρός
  choice: 'Der Vater wird als derjenige verstanden, der den Zeitpunkt festsetzt: „vom Vater festgesetzten“.'
  alternative: Wörtlicher und offener wäre „bis zum festgesetzten Zeitpunkt des Vaters“.
  rationale: Im Bild vom unmündigen Erben liegt nahe, dass der Vater den Termin bestimmt. Die Fußnote bewahrt die formal mögliche, weniger explizite Genitivwiedergabe, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vormünder“ und „Verwalter“ geben die unterschiedlichen Funktionen knapp wieder; die Satzstruktur bleibt nahe am griechischen Kontrast und ist zugleich idiomatisch.
