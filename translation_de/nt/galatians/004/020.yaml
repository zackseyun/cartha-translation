id: GAL.4.20
reference: Galatians 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: de
  text: Doch ich wünschte, ich könnte jetzt bei euch sein und meinen Ton ändern[a], denn ich bin euretwegen ratlos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Stimme ändern“. Wörtlich steht im Griechischen „meine Stimme ändern“; gemeint ist hier wahrscheinlich der Ton oder die Art seines Redens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: ich wünschte, ich könnte
  rationale: Der Imperfekt kann hier einen gegenwärtigen, nicht verwirklichten Wunsch höflich oder zurückhaltend ausdrücken. Die deutsche Formulierung gibt diesen Wunsch im Zusammenhang mit dem Infinitiv παρεῖναι natürlich wieder.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen milden Gegensatz beziehungsweise Übergang. „Doch“ verbindet den Wunsch des Paulus passend mit dem vorangehenden dringlichen Appell.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: bei euch sein
  rationale: παρεῖναι bezeichnet persönliche Anwesenheit; πρὸς ὑμᾶς stellt die Beziehung zu den Adressaten heraus. „Bei euch sein“ ist im modernen Deutsch natürlich und präzise.
- source_word: ἄρτι
  choice: jetzt
  rationale: ἄρτι betont den gegenwärtigen Zeitpunkt. Im Zusammenhang vermittelt „jetzt“ die gebotene Unmittelbarkeit, ohne umgangssprachlich zu wirken.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: meinen Ton ändern
  rationale: φωνή bedeutet wörtlich „Stimme“, bezeichnet hier im Zusammenhang aber wahrscheinlich die Art und den Ton des Redens. Die Alternative wird in einer Fußnote bewahrt.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt den Grund für den vorausgehenden Wunsch ein. „Denn“ stellt diesen begründenden Zusammenhang in würdigem, natürlichem Deutsch her.
- source_word: ἀποροῦμαι
  choice: ich bin ratlos
  rationale: Das Verb bezeichnet Unsicherheit, Verlegenheit oder den Zustand, keinen Ausweg zu wissen. „Ratlos“ bewahrt sowohl die gedankliche Unsicherheit als auch die emotionale Sorge.
- source_word: ἐν ὑμῖν
  choice: euretwegen
  rationale: ἐν mit Personen kann nach ἀπορέω den Bezug oder Anlass der Ratlosigkeit bezeichnen. „Euretwegen“ ist idiomatisch, kann jedoch leicht kausal klingen; die Aussage bleibt auf die Lage der Galater bezogen.
theological_decisions:
- issue: Bedeutung von φωνή im Zusammenhang
  choice: Paulus möchte seinen Ton beziehungsweise seine Redeweise ändern.
  alternative: Paulus meint eine Veränderung seiner hörbaren Stimme.
  rationale: Der Zusammenhang von Mahnung und pastoraler Sorge legt die Art seines Redens nahe. Da φωνή wörtlich „Stimme“ heißt, bleibt diese echte lexikalische Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ und „denn“ erhalten den argumentativen Fluss; „ich wünschte, ich könnte“ bringt den nicht verwirklichten Wunsch idiomatisch zum Ausdruck. Die Fußnote bewahrt die wörtliche Bedeutung von φωνή.
