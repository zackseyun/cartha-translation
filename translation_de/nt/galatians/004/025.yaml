  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: de
  text: Hagar aber ist der Berg Sinai in Arabien[a] und entspricht dem jetzigen Jerusalem; denn es ist mit seinen Kindern in Sklaverei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Das Hagar aber ist der Berg Sinai in Arabien.“ Im Griechischen steht vor „Hagar“ ein sächlicher Artikel; die Konstruktion ist syntaktisch schwierig und wird unterschiedlich verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Hagar aber
  rationale: δέ wird als milder fortführender bzw. kontrastierender Anschluss mit „aber“ wiedergegeben. Der ungewöhnliche Artikel τὸ vor dem Namen lässt sich im Deutschen nicht natürlich abbilden und wird in einer Fußnote erläutert.
- source_word: Σινᾶ ὄρος
  choice: der Berg Sinai
  rationale: Dies ist die übliche deutsche Wortstellung und bewahrt die direkte Gleichsetzung in der allegorischen Argumentation.
- source_word: ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: ist … in Arabien
  rationale: Die knappe Ortsangabe wird ohne eine über den Text hinausgehende nähere Bestimmung der antiken Region wiedergegeben.
- source_word: συστοιχεῖ
  choice: entspricht
  rationale: Das Verb bezeichnet hier eine Zuordnung zur gleichen Reihe oder Seite der allegorischen Gegenüberstellung; „entspricht“ ist verständlich und präzise.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: dem jetzigen Jerusalem
  rationale: „jetzig“ gibt νῦν zeitlich wieder und unterscheidet dieses irdische Jerusalem vom „Jerusalem oben“ im folgenden Vers.
- source_word: δουλεύει
  choice: lebt … in Sklaverei
  rationale: Die Formulierung macht den Zustand der Versklavung deutlich und bewahrt den für den Abschnitt zentralen Gegensatz von Sklaverei und Freiheit.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: mit seinen Kindern
  rationale: μετά mit Genitiv bezeichnet die Gemeinschaft dieses Zustands. Das Pronomen bezieht sich im Deutschen grammatisch auf das sächliche „Jerusalem“, daher „seinen“.
theological_decisions:
- issue: Paulus’ allegorische Gleichsetzung Hagars mit Sinai und ihre Zuordnung zum jetzigen Jerusalem
  choice: 'Die direkte Aussage wird beibehalten: „Hagar aber ist der Berg Sinai … und entspricht dem jetzigen Jerusalem.“'
  alternative: 'Deutender: „Hagar steht für den Berg Sinai“'
  rationale: Das Griechische verwendet zunächst eine direkte Gleichsetzung und danach das Verb der Entsprechung. Die Übersetzung bewahrt diese rhetorische Spannung, ohne die Allegorie erklärend abzuschwächen.
- issue: Bezugswort des Subjekts in δουλεύει μετὰ τῶν τέκνων αὐτῆς
  choice: „es lebt mit seinen Kindern in Sklaverei“, bezogen auf Jerusalem
  alternative: „sie ist mit ihren Kindern versklavt“, mit Hagar als sprachlich naheliegendem Bezug
  rationale: Das unmittelbar vorausgehende τῇ νῦν Ἰερουσαλήμ und das feminine αὐτῆς im Griechischen erlauben den Bezug auf Jerusalem; im Deutschen verlangt das grammatisch sächliche „Jerusalem“ die Form „es/seinen“. So bleibt die Aussage auf das jetzige Jerusalem und dessen Kinder fokussiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hagar aber“ bewahrt den Diskursanschluss, ohne ein zeitliches „nun“ einzuführen. Das Semikolon gliedert Begründung und Hauptaussage klar.
