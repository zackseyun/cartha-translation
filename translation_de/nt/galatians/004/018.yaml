id: GAL.4.18
reference: Galatians 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: de
  text: Doch es ist gut, jederzeit in guter Absicht eifrig umworben zu werden[a][b] – und nicht nur dann, wenn ich bei euch bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eifrig zu sein“ beziehungsweise „Eifer zu zeigen“. Der griechische Infinitiv kann unterschiedlich verstanden werden; für die passive Bedeutung spricht der unmittelbare Gegensatz zu denen, die sich im vorigen Vers eifrig um die Galater bemühen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „im Guten“. Gemeint sein kann, dass das Werben aus guten Beweggründen oder für einen guten Zweck geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: es ist gut
  rationale: Das prädikative Adjektiv steht beim Infinitiv; im Deutschen ergibt die unpersönliche Wendung „es ist gut“ einen natürlichen und genauen Satz.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel setzt Vers 18 in einen Gegensatz zu den unlauteren Absichten der in Vers 17 genannten Personen.
- source_word: ζηλοῦσθαι
  choice: eifrig umworben zu werden
  rationale: Der passive Infinitiv wird im Zusammenhang mit Vers 17 am besten als Gegenstand intensiven Bemühens verstanden. „Umworben“ gibt dieses Werben idiomatisch wieder, während „eifrig“ den Bedeutungsanteil des Eifers ausdrücklich bewahrt.
- source_word: ἐν καλῷ
  choice: in guter Absicht
  rationale: Wörtlich bezeichnet die Wendung den Bereich des Guten; im Zusammenhang geht es wahrscheinlich um die gute Zielsetzung beziehungsweise Lauterkeit des Werbens. Die Formulierung vermeidet das im Deutschen sachfremd klingende „in einer guten Sache“.
- source_word: πάντοτε
  choice: jederzeit
  rationale: „Jederzeit“ bildet einen klaren zeitlichen Gegensatz zu „nicht nur dann“.
- source_word: καὶ μὴ μόνον
  choice: und nicht nur dann
  rationale: Die Ergänzung „dann“ stellt im Deutschen natürlich den Bezug zum folgenden Zeitsatz her.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: wenn ich bei euch bin
  rationale: Die Präposition mit dem substantivierten Infinitiv hat zeitliche Bedeutung. Die gewählte Formulierung ist gegenwärtiges, natürliches Deutsch.
theological_decisions:
- issue: Diathese und Bezug von ζηλοῦσθαι
  choice: 'Passiv: eifrig umworben zu werden'
  alternative: Eifrig zu sein beziehungsweise Eifer zu zeigen
  rationale: Die passive Lesart hält den sprachlichen Anschluss an Vers 17 fest, wo andere eifrig um die Galater werben. Die mögliche mediale beziehungsweise allgemein aktive Deutung wird jedoch in einer Fußnote offengehalten.
- issue: Sinn von ἐν καλῷ
  choice: in guter Absicht
  alternative: im Guten; für einen guten Zweck; in einer guten Sache
  rationale: Die unmittelbare Gegenüberstellung zu den fragwürdigen Motiven in Vers 17 legt eine Aussage über die lautere Absicht nahe. Da die griechische Wendung knapper und weiter ist, dokumentiert die Fußnote ihre wörtlichere Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich verdeutlicht die nachgetragene zeitliche Einschränkung, ohne den griechischen Gedankengang auszubauen. „Umworben“ ist idiomatisch, wird aber durch „eifrig“ semantisch präzisiert und durch die Fußnote gegen eine unnötig enge romantische Deutung abgesichert.
