source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: de
  text: 'Dies wird allegorisch gedeutet[a]; denn diese Frauen sind zwei Bünde: Einer stammt vom Berg Sinai und gebiert Kinder in die Sklaverei[b]; das ist Hagar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies wird allegorisch dargestellt“; auch möglich: „Dies ist allegorisch zu verstehen.“ Der griechische Ausdruck zeigt, dass Paulus die vorausgehende Erzählung allegorisch verwendet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Sklaverei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Dies
  rationale: Das neutrale Pluralpronomen verweist zusammenfassend auf die zuvor erzählte Geschichte von Hagar und Sara. Im Deutschen gibt „Dies“ diesen Rückverweis natürlicher wieder als das schwerfällige „welche Dinge“.
- source_word: ἀλληγορούμενα
  choice: wird allegorisch gedeutet
  rationale: Die passivische Verlaufsform bezeichnet die allegorische Auslegung beziehungsweise Verwendung der Erzählung. Die Formulierung behauptet nicht, die geschichtlichen Personen seien unwirklich.
- source_word: αὗται
  choice: diese Frauen
  rationale: Das feminine Demonstrativpronomen verweist auf die beiden zuvor genannten Frauen. Die Ergänzung „Frauen“ macht den Bezug im Deutschen eindeutig.
- source_word: διαθῆκαι
  choice: Bünde
  rationale: Im Zusammenhang mit Sinai bezeichnet διαθήκη einen Bund, nicht primär ein Testament oder eine gewöhnliche Vereinbarung.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: geht vom Berg Sinai aus
  rationale: Die Wendung gibt Herkunft und Ausgangspunkt des Bundes idiomatisch wieder.
- source_word: γεννῶσα
  choice: bringt Kinder hervor
  rationale: Das feminine Partizip führt das mütterliche Bild der Hagar-Erzählung fort und wird im Deutschen natürlich ausgedrückt.
- source_word: εἰς δουλείαν
  choice: zur Sklaverei
  rationale: Die Präposition εἰς bezeichnet hier Ziel oder Ergebnis; „zur Sklaverei“ bewahrt diese Ausrichtung und die Schärfe von δουλεία.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: das ist Hagar
  rationale: Die neutrale Identifikationsformel vermeidet die durch das unterschiedliche grammatische Geschlecht von „Bund“ und „Hagar“ entstehende Härte, ohne die allegorische Gleichsetzung abzuschwächen.
theological_decisions:
- issue: Art von Paulus’ Umgang mit der Hagar-Sara-Erzählung
  choice: Die Erzählung wird allegorisch gedeutet beziehungsweise verwendet.
  alternative: Die Erzählung sei ihrem Wesen nach lediglich eine Allegorie und ohne geschichtlichen Bezug.
  rationale: Das passive Partizip ἀλληγορούμενα beschreibt eine Weise der Deutung oder Darstellung. Die Übersetzung wahrt dies, ohne über die Historizität der Genesis-Erzählung zu entscheiden.
- issue: Bedeutung von δουλεία
  choice: Sklaverei
  alternative: Knechtschaft oder Dienstbarkeit
  rationale: Im Gegensatz der beiden Bünde ist der Zustand tatsächlicher Unfreiheit hervorgehoben. „Sklaverei“ gibt die Aussagekraft des griechischen Wortes unmittelbar wieder.
- issue: Identifikation der Frauen mit den Bünden
  choice: „diese Frauen sind zwei Bünde“
  alternative: „diese Frauen stehen für zwei Bünde“
  rationale: Die direkte Identifikationssprache des griechischen Textes bleibt erhalten; eine erklärende Abschwächung zu „stehen für“ wird nicht in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Allegorisch“ bleibt wegen seiner sachlichen Genauigkeit stehen und wird durch die Fußnote erläutert. Die auffällige Gleichsetzung „diese Frauen sind zwei Bünde“ bewahrt bewusst die Bildsprache und Spannung des Ausgangstextes.
