  source_fidelity: Der Entwurf gibt die allegorische Deutung, die zwei Bünde, den Ursprung am Sinai und die Ausrichtung auf Sklaverei grundsätzlich zutreffend wieder. „Dies“ kann im Deutschen den zusammenfassenden Rückverweis von ἅτινά idiomatisch abbilden. Für εἰς δουλείαν ist jedoch „in die Sklaverei“ zielgerichteter als das leicht final klingende „zur Sklaverei“.
  naturalness: „Einer stammt vom Berg Sinai“ ist im Deutschen unmittelbarer und weniger umschreibend als „Der eine geht vom Berg Sinai aus“. „Kinder in die Sklaverei gebiert“ erhält zugleich das im griechischen Partizip enthaltene Geburtsbild und die Resultatsrichtung. Die abschließende Formel „das ist Hagar“ bleibt als idiomatische, bewusst markierte Identifikation erhalten.
  terminology: „Bünde“ ist für διαθῆκαι im paulinischen Sinai-Kontext angemessen; „Sklaverei“ gibt δουλεία klar wieder. „Allegorisch gedeutet“ wahrt, dass Paulus die vorausgehende Erzählung in dieser Weise auslegt, ohne ihre Geschichtlichkeit zu bestreiten.
