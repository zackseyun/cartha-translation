  source_fidelity: Der Text gibt den Temporalsatz, das Bild von der „Fülle der Zeit“, Gottes Aussendung seines Sohnes sowie die beiden parallel gebauten Partizipialausdrücke sachgerecht wieder. „Geboren von einer Frau“ ist im Deutschen eine idiomatische Wiedergabe von γενόμενον ἐκ γυναικός; „geboren unter dem Gesetz“ bewahrt die knappe paulinische Formulierung für γενόμενον ὑπὸ νόμον.
  naturalness: Die Übersetzung ist modernes, würdevolles Standarddeutsch. „Als aber die Fülle der Zeit gekommen war“ hat bewusst einen leicht traditionellen biblischen Klang, bleibt aber klar und natürlich. Die Wiederholung von „geboren“ macht die griechische Parallelität gut hörbar.
  terminology: „Gott“, „seinen Sohn“ und „das Gesetz“ sind angemessen. Die Fußnote zu „dem Gesetz“ erklärt den im Galaterbrief naheliegenden mosaischen Bezug, ohne diesen Zusatz in den Haupttext einzutragen oder ihn konfessionell zu überdeuten. Die Anker sind vollständig und zutreffend platziert.
