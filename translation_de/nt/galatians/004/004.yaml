id: GAL.4.4
reference: Galatians 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: de
  text: Als aber die Fülle der Zeit gekommen war[a], sandte Gott seinen Sohn aus[b], geboren von einer Frau[c], geboren unter dem Gesetz[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als die Zeit erfüllt war“ beziehungsweise „als die festgesetzte Zeit vollendet war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder einfach: „sandte“. Das griechische Verb ist eine zusammengesetzte Form mit dem Sinn „aussenden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „aus einer Frau“. Die Wendung hebt die wirkliche menschliche Geburt des Sohnes hervor.'
    reason: lexical_alternative
  - marker: d
    text: Gemeint ist im Zusammenhang die Herrschafts- und Verpflichtungsordnung des mosaischen Gesetzes.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als aber
  rationale: Gibt die Zeitangabe ὅτε und den milden Übergang beziehungsweise Kontrast durch δέ in natürlichem Deutsch wieder.
- source_word: ἦλθεν
  choice: gekommen war
  rationale: Das Plusquamperfekt fügt sich im deutschen Temporalsatz natürlich zur nachfolgenden Haupthandlung und bewahrt das Bild vom Eintreten des entscheidenden Zeitpunkts.
- source_word: τὸ πλήρωμα τοῦ χρόνου
  choice: die Fülle der Zeit
  rationale: Bewahrt die prägnante griechische Wendung und lässt sowohl den Gedanken der vollständigen Zeitspanne als auch den des erreichten bestimmten Zeitpunkts anklingen.
- source_word: ἐξαπέστειλεν
  choice: sandte … aus
  rationale: Das trennbare Verb „aussenden“ entspricht dem zusammengesetzten griechischen Verb und bezeichnet die Beauftragung und Sendung des Sohnes, ohne die Formulierung unnötig auszudeuten.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Natürliche deutsche Wiedergabe des Akkusativobjekts mit Possessivpronomen; „Sohn“ bezeichnet im Kontext eindeutig Gottes Sohn.
- source_word: γενόμενον ἐκ γυναικός
  choice: geboren von einer Frau
  rationale: In dieser Verbindung bezeichnet γίνομαι das Geborenwerden. Die Formulierung ist idiomatisch und bewahrt den Herkunftssinn von ἐκ.
- source_word: γενόμενον ὑπὸ νόμον
  choice: geboren unter dem Gesetz
  rationale: Die Wiederholung von „geboren“ bildet die parallelen Partizipien des Griechischen ab; „unter dem Gesetz“ bewahrt die knappe paulinische Ausdrucksweise.
theological_decisions:
- issue: Wahre Menschlichkeit des Sohnes in γενόμενον ἐκ γυναικός
  choice: „geboren von einer Frau“ als Aussage einer wirklichen menschlichen Geburt
  alternative: „aus einer Frau hervorgegangen“ oder wörtlicher „von einer Frau geworden“
  rationale: „Geboren“ gibt die idiomatische Bedeutung im Zusammenhang klar wieder. Zugleich bleibt die Spannung zur vorausgehenden Aussage erhalten, dass Gott seinen bereits als Sohn bezeichneten Sohn aussandte.
- issue: Bezug von νόμος in ὑπὸ νόμον
  choice: Im Haupttext „unter dem Gesetz“, im Kontext auf das mosaische Gesetz bezogen
  alternative: „unter Gesetz“ im allgemeineren Sinn
  rationale: Der Galaterbrief weist stark auf die Rechts- und Bundesordnung des mosaischen Gesetzes. Die knappe Übersetzung vermeidet jedoch, „mosaisch“ erläuternd in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und zugleich verständliche Wendung „Fülle der Zeit“ erhält das Bild des Ausgangstextes. Die beiden parallelen Partizipialformulierungen „geboren …, geboren …“ wurden bewusst beibehalten, um Rhythmus und gedankliche Spannung des Griechischen zu wahren.
