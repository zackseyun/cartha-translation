  variant: modern standard German
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: de
  text: 'Werdet wie ich, denn auch ich bin wie ihr[a], Brüder und Schwestern[b]. Ich bitte euch: Ihr habt mir kein Unrecht getan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn auch ich bin wie ihr geworden“. Im Griechischen steht in diesem Satzteil kein ausdrückliches Verb.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Brüder“. Die Anrede gilt hier wahrscheinlich der ganzen Glaubensgemeinschaft, Männern wie Frauen.'
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε
  choice: Werdet
  rationale: Der Imperativ Präsens von γίνομαι fordert dazu auf, einen Zustand oder eine Haltung anzunehmen; „Werdet“ bildet diese dynamische Bedeutung natürlicher ab als das rein statische „Seid“.
- source_word: ὡς ἐγώ
  choice: wie ich
  rationale: Die knappe Vergleichsformulierung bewahrt die Ellipse des Griechischen, ohne unnötig „bin“ oder „es bin“ zu ergänzen.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier den vorausgehenden Appell. „Denn“ gibt diesen Zusammenhang in gehobenem, aber gegenwärtigem Deutsch flüssig wieder.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: auch ich bin wie ihr
  rationale: Im Griechischen fehlt ein ausdrückliches Verb. „Bin“ ist die zurückhaltendste notwendige Ergänzung im Deutschen; die kontextuell mögliche Ergänzung „geworden bin“ wird in einer Fußnote festgehalten.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural bezeichnet in dieser Anrede sehr wahrscheinlich die gesamte glaubende Gemeinschaft. „Brüder und Schwestern“ macht den gemeinten Adressatenkreis im heutigen Deutsch klar; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: δέομαι ὑμῶν
  choice: Ich bitte euch
  rationale: δέομαι bezeichnet eine eindringliche persönliche Bitte. „Ich bitte euch“ ist natürlich und würdevoll; die Eindringlichkeit ergibt sich hier aus der direkten, eigenständigen Formulierung.
- source_word: οὐδέν με ἠδικήσατε
  choice: Ihr habt mir kein Unrecht getan
  rationale: Die Wendung gibt οὐδέν in idiomatischem Deutsch mit „kein Unrecht“ wieder und bewahrt με als „mir“. Das Perfekt ist im Deutschen für ein vergangenes Handeln mit Gegenwartsbezug natürlicher als das Präteritum.
theological_decisions:
- issue: Verbellipse in κἀγὼ ὡς ὑμεῖς
  choice: „auch ich bin wie ihr“ im Haupttext
  alternative: „auch ich bin wie ihr geworden“
  rationale: Der griechische Text lässt das Verb unausgesprochen. Das ergänzte „bin“ greift am wenigsten interpretierend ein; „geworden bin“ passt ebenfalls zum Kontext von Paulus’ Angleichung an die nichtjüdischen Galater und bleibt deshalb als echte Alternative in der Fußnote erhalten.
- issue: Inklusiver Adressatenkreis von ἀδελφοί
  choice: „Brüder und Schwestern“
  alternative: „Brüder“
  rationale: Die grammatisch maskuline Anrede dürfte hier Männer und Frauen der Gemeinden umfassen. Die inklusive Wiedergabe vermeidet im heutigen Deutsch den falschen Eindruck, Paulus rede nur Männer an, während die Form des Ausgangstextes in der Fußnote kenntlich bleibt.
- issue: Verhältnis des abschließenden Satzes zum Appell
  choice: 'Als eigener Satz: „Ihr habt mir kein Unrecht getan.“'
  alternative: Engere Verbindung mit der Bitte durch Komma oder Gedankenstrich
  rationale: Die Aussage kann als Übergang zur Erinnerung an die frühere Beziehung verstanden werden. Die Satztrennung wahrt den abrupten Charakter und legt nicht fest, dass „Tut mir kein Unrecht“ der unausgesprochene Inhalt der Bitte sei.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die knappe Aufforderung und der persönliche Appell bleiben erhalten. Die griechische Verbellipse wird im Haupttext möglichst zurückhaltend ergänzt und in der Fußnote offengelegt.
