id: GAL.4.10
reference: Galatians 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/010.yaml
  text: You are carefully observing days and months and seasons and years.
translation:
  language: de
  text: Ihr haltet Tage und Monate und bestimmte Zeiten und Jahre genau ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr beachtet Tage und Monate und Zeiten und Jahre.« Gemeint sind kalendarische Beobachtungen; »Zeiten« oder »festgesetzte Zeiten« sind ebenfalls mögliche Wiedergaben von καιρούς.'
    reason: Lexikalische Alternative und Hinweis auf den kalendarischen Zusammenhang.
lexical_decisions:
- source_word: ἡμέρας
  choice: Tage
  rationale: Die schlichte Wiedergabe bewahrt den unbestimmten Wortlaut; der Zusammenhang zeigt, dass kalendarische Beobachtungen gemeint sind.
- source_word: παρατηρεῖσθε
  choice: haltet … genau ein
  rationale: Das Präsens bezeichnet eine fortdauernde Praxis. »Genau einhalten« gibt in diesem Zusammenhang den Gedanken sorgfältiger Beachtung wieder, ohne die Art der Vorschriften näher festzulegen.
- source_word: μῆνας
  choice: Monate
  rationale: Direkte Wiedergabe des kalendarischen Begriffs.
- source_word: καιρούς
  choice: bestimmte Zeiten
  rationale: καιρός kann einen festgesetzten oder besonderen Zeitpunkt beziehungsweise Zeitraum bezeichnen. »Bestimmte Zeiten« wahrt diese Bedeutung, ohne ausdrücklich »Feste« einzutragen.
- source_word: ἐνιαυτούς
  choice: Jahre
  rationale: Direkte Wiedergabe; das Wort schließt die Reihe kalendarischer Zeitabschnitte ab.
- source_word: καὶ
  choice: und
  rationale: Die wiederholte Konjunktion wird beibehalten, um den kumulativen Rhythmus der Aufzählung wiederzugeben.
theological_decisions:
- issue: Ob die Zeitangaben ausdrücklich als jüdische oder religiöse Kalenderordnungen bezeichnet werden sollen
  choice: Die Zeitbegriffe bleiben im Haupttext ohne Zusätze wie »heilig«, »religiös« oder »jüdisch«.
  alternative: Ihr haltet besondere/religiöse Tage, Monate, Festzeiten und Jahre ein.
  rationale: Der griechische Wortlaut nennt nur die Zeitkategorien. Ihr religiös-kalendarischer Bezug ergibt sich aus dem Zusammenhang, sollte aber nicht durch konfessionell oder historisch stärker festlegende Zusätze in den Vers hineingetragen werden.
- issue: Stärke von παρατηρεῖσθε
  choice: »haltet … genau ein«
  alternative: »beachtet« oder »haltet … ein«
  rationale: Die gewählte Formulierung bringt die sorgfältige, fortgesetzte Beobachtung zum Ausdruck, lässt aber offen, welche einzelnen Praktiken damit verbunden waren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederholten »und« bewahren den Nachdruck der griechischen Aufzählung; »genau einhalten« klingt im Deutschen natürlicher als »sorgfältig beobachten« für religiöse Kalenderordnungen.
