id: GAL.4.28
reference: Galatians 4:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: de
  text: Ihr aber, Brüder[a], seid wie Isaak Kinder der Verheißung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ steht hier in der maskulinen Pluralform als Anrede der Gemeinde und schließt wahrscheinlich Männer und Frauen ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen der zweiten Person Plural wird beibehalten und trägt im Deutschen die Hervorhebung natürlich mit.
- source_word: δέ
  choice: aber
  rationale: Die Partikel markiert hier einen milden Gegensatz beziehungsweise Übergang von der zuvor beschriebenen Magd und ihrem Sohn zu den Angeredeten; „aber“ gibt diese Beziehung knapp wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ Plural wird formnah wiedergegeben. Dass die Anrede in diesem Zusammenhang wahrscheinlich die ganze Gemeinde einschließlich der Frauen umfasst, wird in der Fußnote erläutert.
- source_word: κατὰ Ἰσαὰκ
  choice: wie Isaak
  rationale: κατά bezeichnet hier Isaak als Vergleichs- und Entsprechungsmuster. „Wie Isaak“ ist im modernen Deutschen natürlich und wahrt die Analogie.
- source_word: ἐπαγγελίας
  choice: der Verheißung
  rationale: Der Genitiv wird in der paulinischen Wendung „Kinder der Verheißung“ bewahrt; „Verheißung“ bringt den feierlichen und heilsgeschichtlichen Sinn von ἐπαγγελία angemessen zum Ausdruck.
- source_word: τέκνα
  choice: Kinder
  rationale: Das geschlechtsneutrale Pluralwort bezeichnet die Zugehörigkeit beziehungsweise den kindlichen Status und wird direkt und idiomatisch wiedergegeben.
- source_word: ἐστέ
  choice: seid
  rationale: Die zweite Person Plural Präsens von εἰμί verbindet die Angeredeten mit dem Prädikatsnomen „Kinder der Verheißung“.
theological_decisions:
- issue: Zuordnung der Angeredeten zu Isaak innerhalb von Paulus’ allegorischer Argumentation
  choice: „wie Isaak Kinder der Verheißung“
  alternative: „wie Isaak verheißene Kinder“
  rationale: Die gewählte Fassung lässt Isaak das Vergleichsmuster sein und bewahrt zugleich „Kinder der Verheißung“ als eigenständige Prädikatswendung. So bleibt die bundestheologische Aussage erhalten, ohne „Verheißung“ auf ein bloßes Adjektiv zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt die Hervorhebung von „ihr“ und den Kontrast durch „aber“, ohne unnatürlich zu wirken. Die traditionelle, aber weiterhin verständliche Wendung „Kinder der Verheißung“ erhält die prägnante Bildsprache des griechischen Textes.
