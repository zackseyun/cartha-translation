  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: de
  text: Das Jerusalem oben dagegen ist frei, und es ist unsere Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das unsere Mutter ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: dagegen
  rationale: Kennzeichnet den Gegensatz zum gegenwärtigen Jerusalem im vorhergehenden Vers; im Deutschen gibt „dagegen“ die adversative Funktion natürlich wieder.
- source_word: ἄνω
  choice: oben
  rationale: Bewahrt die räumliche Metapher und den Gegensatz zum gegenwärtigen, irdischen Jerusalem, ohne sie vorschnell als „himmlisch“ auszudeuten.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Entspricht der etablierten deutschen Form des Eigennamens.
- source_word: ἐλευθέρα
  choice: frei
  rationale: Das prädikative Adjektiv bezeichnet den Status Jerusalems und erhält den Zusammenhang mit dem Gegensatz zwischen Sklaverei und Freiheit.
- source_word: ἥτις
  choice: und es
  rationale: Gibt den anschließenden Relativsatz in natürlichem Deutsch wieder. Das grammatisch sächliche Pronomen richtet sich nach „Jerusalem“; die mütterliche Personifikation bleibt durch das Prädikat ausdrücklich erhalten.
- source_word: μήτηρ
  choice: Mutter
  rationale: Bewahrt unverändert die für die Argumentation zentrale mütterliche Metapher.
- source_word: ἡμῶν
  choice: unsere
  rationale: Idiomatiche Wiedergabe des Genitivs als Possessivbegleiter.
theological_decisions:
- issue: Bezug und Personifikation des „Jerusalem oben“
  choice: „und es ist unsere Mutter“
  alternative: „das unsere Mutter ist“ oder personifizierend „und sie ist unsere Mutter“
  rationale: Die Übersetzung erhält die mütterliche Personifikation, folgt beim Pronomen jedoch dem deutschen grammatischen Geschlecht von „Jerusalem“. Die Fußnote bietet die formalere relative Fassung, ohne die genaue Nuance von ἥτις dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das Jerusalem oben“ bewahrt die Bildsprache des griechischen Textes; „dagegen“ macht den Kontextgegensatz deutlich. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die alternative Formulierung bezieht.
