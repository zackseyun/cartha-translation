  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: de
  text: um die unter dem Gesetz freizukaufen, damit wir die Annahme als Söhne[a] empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Ausdruck bezeichnet die rechtliche Annahme in die Stellung von Söhnen und kann die damit verbundenen Erbrechte einschließen. Gemeint sind alle Glaubenden, Frauen wie Männer. Auch möglich: „Adoption“.'
    reason: Erläutert die wörtliche Sohn- und Statussprache von υἱοθεσία sowie ihren inklusiven Bezug; nennt eine knappe lexikalische Alternative.
lexical_decisions:
- source_word: ἵνα
  choice: um … zu / damit
  rationale: Beide Vorkommen leiten einen Zweck ein. Im ersten Satzglied ist die deutsche Infinitivkonstruktion natürlich, im zweiten bewahrt „damit“ die neue Subjektsetzung und den parallelen Zweckgedanken.
- source_word: τοὺς ὑπὸ νόμον
  choice: die unter dem Gesetz
  rationale: Die substantivierte Wendung bezeichnet Menschen, die unter der Herrschaft beziehungsweise Verpflichtung des Gesetzes stehen. Der Kontext in Galater 4 weist vor allem auf das mosaische Gesetz.
- source_word: ἐξαγοράσῃ
  choice: freizukaufen
  rationale: Das Verb verbindet den Gedanken des Loskaufs mit Befreiung. „Freikaufen“ gibt beides in verständlichem, gegenwärtigem Deutsch wieder.
- source_word: τὴν υἱοθεσίαν
  choice: die Sohnschaft
  rationale: Der Ausdruck bezeichnet die rechtliche Einsetzung in den Status von Söhnen und die damit verbundenen Erbrechte. „Sohnschaft“ bewahrt diese männlich geprägte Statussprache; der Bezug umfasst hier Frauen und Männer.
- source_word: ἀπολάβωμεν
  choice: wir … empfingen
  rationale: Das Verb bezeichnet hier das Erlangen beziehungsweise Empfangen der Sohnschaft. Der Konjunktiv „empfingen“ fügt sich würdig und präzise in den mit „damit“ eingeleiteten Zwecksatz.
theological_decisions:
- issue: Geschlechtsspezifische Bedeutung von υἱοθεσία
  choice: Sohnschaft
  alternative: Annahme als Kinder / Adoption
  rationale: Paulus spricht mit einem rechtlich und erbrechtlich geprägten Ausdruck vom vollen Status als Söhne. Diese Formulierung schließt im Kontext alle Glaubenden ein; eine Fußnote verhindert ein exklusiv männliches Missverständnis, ohne die Bild- und Statussprache einzuebnen.
- issue: Bezug von „unter dem Gesetz“
  choice: Im Text offen formuliert, kontextuell vor allem auf Menschen unter dem mosaischen Gesetz bezogen
  alternative: Allgemeine Unterworfenheit unter Gesetz überhaupt
  rationale: Der unmittelbare Zusammenhang mit dem unter Gesetz geborenen Sohn spricht primär für die Tora, doch die knappe griechische Wendung wird nicht durch eine erklärende Ergänzung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Zweckangaben werden durch „um … zu“ und „damit“ natürlich wiedergegeben. „Freikaufen“ ist anschaulich und bewahrt den Befreiungsaspekt; „Sohnschaft“ hält die theologisch relevante Status- und Erbsprache offen.
