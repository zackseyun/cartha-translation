source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: de
  text: Ich fürchte um euch, dass ich mich vielleicht vergeblich um euch bemüht habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: Ich fürchte um euch
  rationale: Das Präsens bezeichnet Paulus’ gegenwärtige Sorge. Die Verbindung mit dem Akkusativ meint hier nicht Furcht vor den Galatern, sondern Sorge um ihren geistlichen Zustand.
- source_word: μή πως
  choice: dass … vielleicht
  rationale: Die Wendung leitet den Inhalt der Befürchtung ein und bewahrt mit „vielleicht“ den Gedanken einer besorgten Möglichkeit.
- source_word: εἰκῇ
  choice: vergeblich
  rationale: Das Adverb bezeichnet eine Mühe, die ohne den erhofften Erfolg geblieben sein könnte.
- source_word: κεκοπίακα
  choice: ich mich … bemüht habe
  rationale: Das Perfekt beschreibt bereits geleistete, anstrengende Arbeit mit Bedeutung für die Gegenwart. „Sich bemühen“ ist im Deutschen natürlich und gibt den Einsatz wieder.
- source_word: εἰς ὑμᾶς
  choice: um euch
  rationale: Die Präposition bezeichnet die auf die Galater gerichtete Arbeit; zusammen mit „sich bemühen“ ist „um euch“ eine natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Art von Paulus’ Sorge
  choice: Paulus befürchtet, dass seine auf die Galater gerichtete Arbeit ohne bleibende Frucht geblieben sein könnte.
  alternative: Die Aussage könnte lediglich als allgemeine persönliche Besorgnis verstanden werden.
  rationale: φοβοῦμαι mit μή πως und εἰκῇ verbindet seine Sorge ausdrücklich mit der möglichen Vergeblichkeit seiner bereits geleisteten Arbeit, ohne abschließend festzustellen, dass sie tatsächlich vergeblich war.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form bewahrt die pastorale Sorge und die Spannung zwischen bereits geleisteter Arbeit und ihrem noch unsicheren Ergebnis.
