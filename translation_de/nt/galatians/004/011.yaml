  source_fidelity: „Ich fürchte um euch“ gibt φοβοῦμαι ὑμᾶς zutreffend als Sorge um die Adressaten wieder. Der dass-Satz mit „vielleicht“ vermittelt die durch μή πως ausgedrückte besorgte Möglichkeit. „vergeblich“ entspricht εἰκῇ, und „bemüht habe“ bildet das Perfekt κεκοπίακα als bereits geleistete, für die Gegenwart relevante Arbeit angemessen ab. Die Wiederaufnahme „um euch“ gibt die auf die Galater gerichtete Ausrichtung von εἰς ὑμᾶς natürlich wieder.
