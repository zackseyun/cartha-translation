base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: de
  text: Daher bist du nicht mehr Sklave, sondern Sohn[a]; wenn du aber Sohn bist, dann auch Erbe durch Gott.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kind“. Das griechische Wort bedeutet hier wörtlich „Sohn“ und bewahrt den Zusammenhang von Sohnschaft und Erbrecht; dieser Status gilt nach dem Zusammenhang allen Glaubenden, Frauen wie Männern.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen: „Erbe Gottes durch Christus“ beziehungsweise „durch den Messias“ statt „Erbe durch Gott“.'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Daher
  rationale: Kennzeichnet die Schlussfolgerung aus der vorangehenden Argumentation und bewahrt den folgernden Zusammenhang in natürlichem Deutsch.
- source_word: οὐκέτι εἶ
  choice: bist du nicht mehr
  rationale: Gibt die zweite Person Singular und die zeitliche Verneinung direkt wieder; sie bezeichnet den eingetretenen Statuswechsel.
- source_word: δοῦλος
  choice: Sklave
  rationale: Bewahrt den rechtlich-sozialen Gegensatz zwischen Unfreiheit und Sohnschaft samt Erbberechtigung deutlicher als das schwächere „Diener“.
- source_word: ἀλλὰ υἱός
  choice: sondern Sohn
  rationale: „Sondern“ drückt den scharfen Gegensatz aus. „Sohn“ erhält die im Kontext wichtige Verbindung von Sohnschaft, Annahme und Erbrecht.
- source_word: εἰ δὲ υἱός
  choice: wenn aber Sohn
  rationale: Bewahrt die knappe Ellipse des Griechischen und führt den nächsten Folgeschritt der Argumentation ein.
- source_word: καὶ κληρονόμος
  choice: dann auch Erbe
  rationale: „Auch“ fügt zur Sohnschaft den daraus folgenden Erbenstatus hinzu; „dann“ macht die Folgerung im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: διὰ θεοῦ
  choice: durch Gott
  rationale: Folgt der Lesart des SBLGNT und gibt die Präposition διά möglichst unmittelbar wieder, ohne die offenbleibende Art des göttlichen Wirkens näher festzulegen.
theological_decisions:
- issue: Geschlechtsspezifische Sohnes- und Erbensprache
  choice: Sohn
  alternative: Kind
  rationale: Das griechische υἱός steht im Singular Maskulinum und trägt im Zusammenhang die rechtliche Logik von Sohnschaft und Erbe. Die Formulierung gilt im Kontext allen Glaubenden; dies wird in einer Fußnote klargestellt, statt die Bild- und Rechtslogik im Haupttext einzuebnen.
- issue: Textlesart am Versende
  choice: durch Gott
  alternative: Erbe Gottes durch Christus beziehungsweise durch den Messias
  rationale: Der vorgegebene griechische Ausgangstext liest διὰ θεοῦ. Die Hauptübersetzung folgt dieser Lesart; abweichende Handschriften werden in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, argumentativer Satzführung. Die elliptische Wiederholung „wenn aber Sohn“ spiegelt bewusst die Dichte des griechischen Textes. „Sklave“ wahrt die Stärke des Statusgegensatzes; „Sohn“ erhält die antike Adoptions- und Erbrechtslogik, ohne die Anwendung auf alle Glaubenden einzuschränken.
