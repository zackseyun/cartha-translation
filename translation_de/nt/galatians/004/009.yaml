id: GAL.4.9
reference: Galatians 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: de
  text: 'Jetzt aber, da ihr Gott erkannt habt – vielmehr: von Gott erkannt worden seid –, wie könnt ihr euch wieder den schwachen und armseligen Elementen[a] zuwenden, denen ihr von Neuem als Sklaven dienen wollt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: elementaren Mächten; Grundprinzipien; Grundelementen.'
    reason: στοιχεῖα ist mehrdeutig und kann elementare Bestandteile oder Prinzipien sowie kosmische Mächte bezeichnen.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: da ihr Gott erkannt habt
  rationale: Die temporale Wiedergabe des Aoristpartizips ist im Deutschen natürlich und bezeichnet hier das Eintreten in die Erkenntnis Gottes.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: 'vielmehr: von Gott erkannt worden seid'
  rationale: „Vielmehr“ bewahrt die korrigierende Zuspitzung; das Passiv und Gott als Handelnder bleiben ausdrücklich erhalten.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: wie könnt ihr euch wieder … zuwenden
  rationale: „Wie könnt ihr“ vermittelt den ungläubigen, vorwurfsvollen Ton der rhetorischen Frage; „wieder“ gibt πάλιν wieder.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: die schwachen und armseligen Elemente
  rationale: „Elemente“ hält die umstrittene Bedeutung von στοιχεῖα offen, während „schwach“ und „armselig“ die abwertende Kraft der beiden Adjektive verständlich wiedergeben.
- source_word: πάλιν ἄνωθεν
  choice: von Neuem
  rationale: Die Wendung bezeichnet einen erneuten Anfang beziehungsweise eine vollständige Wiederholung; zusammen mit dem vorherigen „wieder“ bleibt die nachdrückliche Wiederholung des Griechischen hörbar.
- source_word: δουλεύειν θέλετε
  choice: als Sklaven dienen wollt
  rationale: Die Formulierung bewahrt sowohl den Sklavereigedanken von δουλεύω als auch das Moment des Wollens in θέλω.
theological_decisions:
- issue: Bedeutung von στοιχεῖα
  choice: Elemente
  alternative: elementare Mächte; Grundprinzipien; Grundelemente
  rationale: Der Ausdruck kann Grundbestandteile beziehungsweise religiöse Grundprinzipien oder kosmische Mächte bezeichnen. Der Haupttext entscheidet diese Spannung nicht; die Fußnote nennt die wesentlichen Deutungsmöglichkeiten.
- issue: Gewicht von „von Gott erkannt“
  choice: Als ausdrückliche Korrektur und Vertiefung von „Gott erkannt“ wiedergegeben
  alternative: Lediglich parallele relationale Aussage ohne korrigierende Zuspitzung
  rationale: μᾶλλον δέ markiert eine echte Korrektur. Die Übersetzung stellt Gottes Handeln in den Vordergrund, ohne darüber hinaus ein theologisches System in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich mit Doppelpunkt kennzeichnet Paulus’ Selbstkorrektur klar; die Sklavereimetaphorik bleibt deutlich, ohne altertümliche Ausdrucksweise.
