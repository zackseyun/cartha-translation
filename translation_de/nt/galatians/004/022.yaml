  source_fidelity: Der deutsche Text gibt γέγραπται als etablierte Schriftformel „es steht geschrieben“ angemessen wieder und bewahrt mit „denn“ die begründende Verbindung. „Abraham zwei Söhne hatte“ entspricht dem griechischen Wortlaut; die parallele Struktur „einen … und einen“ bleibt erhalten. „von der Sklavin“ und „von der freien Frau“ geben ἐκ sowie den gezielten sozialen Gegensatz παιδίσκη/ἐλευθέρα treffend wieder.
  naturalness: Modernes, klares Standarddeutsch mit würdigem biblischem Register. Die Formulierung ist idiomatisch und gut lesbar; die Wiederholung von „einen“ ist hier zur Wahrung der griechischen Parallelität sinnvoll.
  terminology: „Sklavin“ gegenüber „freie Frau“ ist terminologisch präzise und macht den für den unmittelbaren Kontext wesentlichen Statusgegensatz sichtbar, ohne ihn auszudeuten. Die Fußnote nennt mit „Dienerin“ eine mögliche weniger statusmarkierte Alternative und erläutert zutreffend, weshalb der Kontext Unfreiheit voraussetzt.
