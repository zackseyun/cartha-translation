id: GAL.4.22
reference: Galatians 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: de
  text: Denn es steht geschrieben, dass Abraham zwei Söhne hatte, einen von der Sklavin[a] und einen von der freien Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerin“. Das griechische Wort bezeichnet eine weibliche Dienstperson, die in diesem Zusammenhang unfrei war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die etablierte deutsche Schriftformel gibt das griechische Perfekt idiomatisch wieder und bewahrt den Hinweis auf die bleibende Geltung des Geschriebenen.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt die begründende Verbindung zum vorausgehenden Gedankengang knapp und natürlich.
- source_word: ὅτι
  choice: dass
  rationale: Leitet im Deutschen sachgerecht den Inhalt dessen ein, was geschrieben steht.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: δύο υἱοὺς
  choice: zwei Söhne
  rationale: υἱούς bezeichnet hier ausdrücklich Söhne, nicht allgemein Kinder.
- source_word: ἔσχεν
  choice: hatte
  rationale: Gibt die Aussage über Abrahams Vaterschaft natürlich wieder, ohne sie durch „zeugte“ unnötig enger zu bestimmen.
- source_word: ἕνα ... καὶ ἕνα
  choice: einen ... und einen
  rationale: Erhält die ausgewogene Parallelstruktur des griechischen Satzes.
- source_word: ἐκ
  choice: von
  rationale: „Einen Sohn von einer Frau haben“ ist im Deutschen eine natürliche genealogische Ausdrucksweise und bleibt näher am griechischen Herkunftsausdruck als eine stärker deutende Formulierung.
- source_word: παιδίσκης
  choice: Sklavin
  rationale: Bezeichnet eine weibliche Person in unfreier Dienststellung; „Sklavin“ macht den für den Kontext wesentlichen Gegensatz zur freien Frau deutlich.
- source_word: ἐλευθέρας
  choice: freie Frau
  rationale: Das substantivierte Adjektiv bezeichnet eine Frau mit freiem sozialen Status; die Wiedergabe wahrt den direkten Gegensatz zur Sklavin.
theological_decisions:
- issue: Für die Argumentation zentraler Gegensatz zwischen Unfreiheit und Freiheit
  choice: παιδίσκη/ἐλευθέρα als „Sklavin“/„freie Frau“ wiedergeben
  alternative: „Magd“/„freie Frau“
  rationale: Paulus baut den folgenden Gedankengang auf dem Statusgegensatz von Sklaverei und Freiheit auf. „Sklavin“ macht diesen Gegensatz deutlich, ohne über den sozialen Sinn des Ausgangstextes hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Formel „es steht geschrieben“ bewahrt den Schriftbezug; die parallele Satzstruktur und der Gegensatz „Sklavin/freie Frau“ bleiben klar erkennbar.
