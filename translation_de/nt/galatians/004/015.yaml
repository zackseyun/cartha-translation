source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: de
  text: 'Wo ist nun eure Seligpreisung geblieben?[a] Denn ich bezeuge euch: Wenn es möglich gewesen wäre, hättet ihr euch die Augen ausgerissen und sie mir gegeben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ist nun aus eurem Glücklichpreisen geworden?“ Das griechische Wort kann sowohl das Selig- beziehungsweise Glücklichpreisen als auch den Zustand bezeichnen, als gesegnet zu gelten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich und drastisch: „eure Augen herausgegraben“. Das Bild beschreibt wahrscheinlich überspitzt ihre frühere Hingabe; manche sehen darin zugleich einen Hinweis auf ein körperliches Leiden des Paulus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Wo ist nun … geblieben?
  rationale: Die idiomatische rhetorische Frage fragt danach, was aus der früheren Haltung der Galater geworden ist; „nun“ bewahrt die folgernde beziehungsweise wiederaufnehmende Kraft von οὖν.
- source_word: μακαρισμὸς ὑμῶν
  choice: eure Seligpreisung
  rationale: μακαρισμός kann die Erklärung beziehungsweise Einschätzung als glücklich oder gesegnet bezeichnen. „Seligpreisung“ bewahrt diesen Aspekt besser als bloße „Freude“, bleibt aber erklärungsbedürftig und wird deshalb in einer Fußnote erläutert.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Denn ich bezeuge euch
  rationale: Bewahrt den feierlichen, zeugnishaften Ton des Verbs μαρτυρέω und ist in gehobenem modernem Deutsch verständlich.
- source_word: ὅτι
  choice: Doppelpunkt nach „euch“
  rationale: ὅτι leitet den Inhalt des Zeugnisses ein; im Deutschen gibt ein Doppelpunkt diese Funktion natürlich wieder.
- source_word: εἰ δυνατὸν
  choice: Wenn es möglich gewesen wäre
  rationale: Die Formulierung macht den im Zusammenhang irrealen Sinn natürlich deutsch deutlich, ohne den Grund der Unmöglichkeit festzulegen.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: hättet ihr euch die Augen ausgerissen
  rationale: Die drastische, konkrete Bildsprache von ἐξορύσσω wird beibehalten; „euch“ ist im Deutschen idiomatisch beim Entfernen eines eigenen Körperteils.
- source_word: ἐδώκατέ μοι
  choice: und sie mir gegeben
  rationale: Gibt das aoristische Hauptverb schlicht wieder; „sie“ nimmt eindeutig „die Augen“ auf.
theological_decisions:
- issue: Ob die Aussage über die Augen verallgemeinert oder auf eine bestimmte Krankheit des Paulus bezogen werden soll
  choice: Das konkrete Bild „die Augen ausgerissen“ bleibt im Haupttext erhalten.
  alternative: „Ihr hättet mir alles gegeben“ oder eine ausdrückliche Deutung als Hinweis auf ein Augenleiden des Paulus.
  rationale: Der griechische Text nennt ausdrücklich die Augen und verwendet ein starkes Verb. Die Aussage kann eine hyperbolische Beschreibung ihrer früheren Hingabe sein und möglicherweise auf den körperlichen Zustand des Paulus anspielen; der Text entscheidet dies jedoch nicht.
- issue: Bedeutung von μακαρισμός
  choice: „Seligpreisung“ mit erläuternder Fußnote
  alternative: „Glück“, „Freude“, „Gefühl, gesegnet zu sein“ oder „Segnung“
  rationale: Der Ausdruck kann sowohl das Glücklich- beziehungsweise Seligpreisen als auch den damit bezeichneten gesegneten Zustand meinen. Die Übersetzung soll diese Spannung nicht vorschnell auf eine bloße Emotion reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird idiomatisch formuliert, während die feierliche Zeugensprache und das drastische Augenbild des griechischen Textes erhalten bleiben.
