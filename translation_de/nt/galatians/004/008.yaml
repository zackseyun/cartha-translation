source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: de
  text: Doch damals, als ihr Gott nicht kanntet, wart ihr denen versklavt, die von Natur aus keine Götter sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorhergehenden Gedankengang und klingt im Deutschen natürlich und würdig.
- source_word: τότε μὲν
  choice: damals
  rationale: Verweist auf die frühere Lebensphase der Galater; μέν bereitet zugleich den Gegensatz in Vers 9 vor, ohne hier eigens wiedergegeben werden zu müssen.
- source_word: οὐκ εἰδότες θεὸν
  choice: als ihr Gott nicht kanntet
  rationale: Gibt das Partizip in diesem Zusammenhang temporal wieder und bewahrt den paulinischen Gedanken fehlender Gotteserkenntnis.
- source_word: ἐδουλεύσατε
  choice: wart ihr … versklavt
  rationale: Bewahrt stärker als „dientet“ das für Galater zentrale Motiv von Knechtschaft und Freiheit.
- source_word: τοῖς … οὖσι θεοῖς
  choice: denen, die … keine Götter sind
  rationale: Lässt offen, ob konkrete Götzen oder dahinter gedachte Mächte gemeint sind, da der griechische Text dies nicht näher bestimmt.
- source_word: φύσει μὴ
  choice: von Natur aus keine
  rationale: Drückt die Aussage über das tatsächliche Wesen der betreffenden Größen aus und erhält die ontologische Verneinung.
- source_word: θεοῖς
  choice: Götter
  rationale: Die direkte Wiedergabe des pluralischen Substantivs erhält den Kontrast zu „Gott“.
theological_decisions:
- issue: Wesen der früher verehrten Größen
  choice: „die von Natur aus keine Götter sind“
  alternative: „die in Wirklichkeit keine Götter sind“
  rationale: Die Hauptfassung bildet φύσει ausdrücklich mit „von Natur aus“ ab und lässt die Identität dieser Größen offen, statt sie als Götzen oder Dämonen festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Versklavt“ bewahrt das starke Bild der Unfreiheit; die Satzstellung bleibt natürlich, ohne die Spannung des griechischen Textes aufzulösen.
