  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: de
  text: Ihr wisst aber, dass ich euch zuerst wegen einer körperlichen Schwäche[a] die gute Nachricht verkündet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen einer körperlichen Krankheit“. Wörtlich: „wegen einer Schwäche/Krankheit des Fleisches“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: ihr wisst
  rationale: Das Perfekt οἶδα hat präsentische Bedeutung; die Wendung greift auf das eigene Wissen der Galater zurück.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise einen Übergang zum persönlichen Rückblick.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: wegen einer Krankheit des Körpers
  rationale: διά mit Akkusativ bezeichnet hier am natürlichsten den Grund. ἀσθένεια kann Krankheit oder Schwäche bedeuten; zusammen mit σάρξ ist eine körperliche Beeinträchtigung wahrscheinlich. Die Fußnote bewahrt die lexikalische Alternative.
- source_word: εὐηγγελισάμην
  choice: die gute Nachricht verkündet habe
  rationale: Die Form bezeichnet das Verkünden der Heilsbotschaft; diese Wiedergabe ist verständlich, gegenwärtig und erhält den verbalen Charakter.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger der Verkündigung.
- source_word: τὸ πρότερον
  choice: beim ersten Mal
  rationale: Die substantivierte Wendung verweist wahrscheinlich auf die erste Gelegenheit beziehungsweise den früheren Besuch, bei dem Paulus den Galatern die Botschaft verkündete.
theological_decisions:
- issue: Bedeutung von σάρξ in ἀσθένειαν τῆς σαρκὸς
  choice: 'körperlicher Sinn: „Krankheit des Körpers“'
  alternative: körperliche Schwäche; allgemeine Schwachheit; ethischer Sinn von „Fleisch“
  rationale: Der Zusammenhang beschreibt die äußeren Umstände von Paulus’ früherer Verkündigung. Ein körperlicher Zustand ist daher wahrscheinlich; eine moralische Bedeutung im Sinn sündiger Natur wäre hier unbegründet.
- issue: Verhältnis der Krankheit zur Verkündigung
  choice: 'kausale Wiedergabe: „wegen“'
  alternative: „in körperlicher Schwäche“ als Beschreibung der Begleitumstände
  rationale: διά mit Akkusativ drückt gewöhnlich einen Grund aus. Die Übersetzung lässt offen, auf welche Weise die Krankheit zu Paulus’ Aufenthalt oder seiner Verkündigung führte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Körper“ vermeidet hier das mögliche Missverständnis, „Fleisch“ sei ethisch gemeint; die wörtlichere Form und die Bedeutungsspanne stehen in der Fußnote. „Beim ersten Mal“ gibt τὸ πρότερον idiomatisch wieder, ohne Einzelheiten über Anzahl oder Art der Besuche festzulegen.
