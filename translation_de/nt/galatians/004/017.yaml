id: GAL.4.17
reference: Galatians 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: de
  text: Sie bemühen sich eifrig um euch[a], aber nicht in guter Absicht. Vielmehr wollen sie euch ausschließen[b], damit ihr euch eifrig um sie bemüht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie werben eifrig um euch«. Das griechische Verb kann eifriges Bemühen, starkes Verlangen oder das Werben um die Zuwendung eines anderen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich bzw. auch: »hinausschließen«. Wovon sie die Galater ausschließen wollen, wird nicht ausdrücklich gesagt; im Zusammenhang ist wahrscheinlich die Gemeinschaft mit Paulus und seinen Mitarbeitern gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε
  choice: sich eifrig um jemanden bemühen
  rationale: ζηλόω kann hier ein intensives Werben um Zuwendung oder Gefolgschaft bezeichnen. Die gleiche Wendung an beiden Stellen bewahrt die rhetorische Spiegelung des griechischen Textes, ohne einen romantischen Sinn festzulegen.
- source_word: οὐ καλῶς
  choice: nicht in guter Absicht
  rationale: καλῶς bewertet hier das Werben als moralisch verfehlt. Im Zusammenhang erklärt der folgende Zwecksatz besonders das eigennützige Motiv; die Formulierung ist natürlich und lässt dennoch offen, ob zugleich auch die Art des Vorgehens kritisiert wird.
- source_word: ἀλλά
  choice: Vielmehr
  rationale: Kennzeichnet den scharfen Gegensatz und leitet die Erklärung ein, worin das verwerfliche Werben besteht.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: euch ausschließen
  rationale: ἐκκλείω bedeutet hinaus- oder ausschließen. Das nicht genannte Bezugsfeld wird in der Übersetzung bewusst nicht ergänzt.
- source_word: θέλουσιν
  choice: wollen sie
  rationale: Gibt den gewöhnlichen voluntativen Sinn des Verbs direkt und idiomatisch wieder.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den beabsichtigten Zweck des Ausschließens klar wieder.
theological_decisions:
- issue: Wovon die Gegner die Galater ausschließen wollen
  choice: Das Bezugsfeld bleibt im Haupttext unausgesprochen.
  alternative: Sie wollen die Galater ausdrücklich von Paulus und seinem Wirkungskreis, von der Gemeinde oder von Gottes Segen ausschließen.
  rationale: Das griechische Verb nennt nicht ausdrücklich, wovon ausgeschlossen werden soll. Der unmittelbare Zusammenhang legt eine Trennung von Paulus und eine Umlenkung der Loyalität nahe, doch diese Deutung sollte nicht als ausdrücklicher Wortlaut ausgegeben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung »sich eifrig um … bemühen« erhält das Wortspiel und die Umkehrung zwischen ζηλοῦσιν und ζηλοῦτε. »Nicht in guter Absicht« macht die eigennützige Motivation verständlich, ohne die Aussage konfessionell zuzuspitzen.
