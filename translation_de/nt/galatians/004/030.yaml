id: GAL.4.30
reference: Galatians 4:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: de
  text: Doch was sagt die Schrift? »Vertreibe die Sklavin und ihren Sohn[a], denn der Sohn der Sklavin wird keinesfalls zusammen mit dem Sohn der Freien erben[b].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zitat greift 1. Mose 21,10 auf.
    reason: cross_reference
  - marker: b
    text: 'Das Griechische verneint nachdrücklich: »wird keinesfalls erben«, auch möglich: »wird ganz gewiss nicht erben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorhergehenden Gedankengang knapp und natürlich.
- source_word: τί λέγει ἡ γραφή
  choice: was sagt die Schrift?
  rationale: Bewahrt das Präsens und die personifizierende Schriftformel.
- source_word: Ἔκβαλε
  choice: Vertreibe
  rationale: Gibt den nachdrücklichen Imperativ und den Sinn gewaltsamer beziehungsweise entschiedener Entfernung wieder; „Schick fort“ wäre schwächer.
- source_word: παιδίσκην
  choice: Sklavin
  rationale: Bezeichnet hier eine unfreie Frau; diese Wortwahl erhält den für den Zusammenhang zentralen Gegensatz zwischen Sklaverei und Freiheit.
- source_word: υἱὸν αὐτῆς
  choice: ihren Sohn
  rationale: Entspricht der schlichten griechischen Possessivkonstruktion.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: denn ... wird keinesfalls ... erben
  rationale: „Keinesfalls“ bringt die nachdrückliche Verneinung οὐ μή mit Futur in gegenwärtigem Deutsch deutlich zum Ausdruck.
- source_word: μετὰ τοῦ υἱοῦ
  choice: zusammen mit dem Sohn
  rationale: Macht die gemeinsame Teilhabe am Erbe, die μετά mit Genitiv bezeichnet, klar.
- source_word: τῆς ἐλευθέρας
  choice: der Freien
  rationale: Gibt das substantivierte Adjektiv knapp wieder und bewahrt den unmittelbaren Gegensatz zur Sklavin.
theological_decisions:
- issue: Wiedergabe von παιδίσκη in der Sara-Hagar-Auslegung
  choice: Sklavin
  alternative: Magd; leibeigene Frau
  rationale: Paulus stellt im Zusammenhang Sklaverei und Freiheit einander gegenüber. „Sklavin“ macht den rechtlich unfreien Status sichtbar, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Stärke der Verneinung in οὐ γὰρ μὴ κληρονομήσει
  choice: wird keinesfalls ... erben
  alternative: wird gewiss nicht ... erben; wird niemals ... erben
  rationale: Die kategorische Verneinung des griechischen Textes bleibt erhalten; „niemals“ könnte stärker zeitlich verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sklavin“ und „die Freie“ halten den Leitgegensatz des Abschnitts deutlich fest; „Vertreibe“ bewahrt die Schärfe des Schriftzitats.
