source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: de
  text: 'Denn es steht geschrieben: »Freue dich, du Unfruchtbare, die keine Kinder gebiert! Brich in Jubel aus und rufe laut, du, die keine Wehen hat! Denn die Kinder der verlassenen Frau sind zahlreicher als die Kinder der Frau, die einen Ehemann hat.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Jesaja 54,1.
    reason: cross_reference
lexical_decisions:
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die feste Einleitungsformel für ein Schriftzitat gibt den perfektischen Aspekt und die fortdauernde Geltung des Geschriebenen angemessen wieder.
- source_word: Εὐφράνθητι
  choice: Freue dich
  rationale: Der Imperativ bezeichnet Freude und bewahrt zugleich den gehobenen Ton des prophetischen Zitats.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: du Unfruchtbare, die keine Kinder gebiert
  rationale: Das substantivisch gebrauchte Adjektiv wird als direkte Anrede wiedergegeben; der folgende Ausdruck hält das fortdauernde Nichtgebären ausdrücklich fest.
- source_word: ῥῆξον καὶ βόησον
  choice: Brich in Jubel aus und rufe laut
  rationale: Die idiomatische Wendung bezeichnet einen plötzlich hervorbrechenden lauten Ausruf; die Übersetzung ist im Deutschen natürlich und erhält die poetische Steigerung.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: du, die keine Wehen hat
  rationale: ὠδίνω verweist konkret auf Geburtswehen. Die Formulierung bewahrt das Bild, ohne altertümlich zu klingen.
- source_word: τῆς ἐρήμου
  choice: der verlassenen Frau
  rationale: ἔρημος kann in diesem bildhaften Zusammenhang eine verlassene, vereinsamte oder verödete Frau bezeichnen. »Verlassen« stellt den persönlichen Gegensatz zur Frau mit einem Mann klar heraus.
- source_word: πολλὰ ... μᾶλλον ἢ
  choice: sind zahlreicher als
  rationale: Die vergleichende Aussage über die Zahl der Kinder wird in idiomatischem Deutsch ausdrücklich formuliert.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: der Frau, die einen Mann hat
  rationale: Die relativ wörtliche Wiedergabe erhält den auffälligen Gegensatz des Ausgangstextes und legt nicht enger auf »verheiratet« oder »Ehemann« fest, als es die Formulierung verlangt.
theological_decisions:
- issue: Alttestamentliches Zitat im allegorischen Zusammenhang von Galater 4
  choice: Das Zitat aus Jesaja 54,1 wird in seiner eigenen prophetischen Bildsprache wiedergegeben.
  alternative: Die Formulierung könnte die Identifikation mit Sara oder dem Jerusalem oben bereits ausdrücklich vorwegnehmen.
  rationale: Paulus führt den Text ausdrücklich als Schriftzitat an. Seine Deutung ergibt sich aus dem Zusammenhang und sollte nicht in den Wortlaut des Zitats eingetragen werden.
- issue: Bedeutung von τῆς ἐρήμου
  choice: »der verlassenen Frau«
  alternative: »der einsamen Frau«, »der verödeten Frau« oder »der Unfruchtbaren«
  rationale: »Verlassen« bewahrt die mögliche Spannung von Einsamkeit und fehlender ehelicher Gemeinschaft, ohne die Frau einfach mit der zuvor genannten Unfruchtbaren gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem poetischen Rhythmus eines prophetischen Schriftzitats. Die direkte Anrede und die parallelen Satzglieder bleiben erhalten; altertümliche Wörter wie »gebäre« oder »kreißen« werden vermieden.
