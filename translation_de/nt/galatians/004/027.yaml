  to: 'Denn es steht geschrieben: »Freue dich, du Unfruchtbare, die keine Kinder gebiert! Brich in Jubel aus und rufe laut, du, die keine Wehen hat! Denn die Kinder der verlassenen Frau sind zahlreicher als die Kinder der Frau, die einen Ehemann hat.«[a]'
