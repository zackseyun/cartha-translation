id: GAL.4.6
reference: Galatians 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: de
  text: 'Und weil ihr Söhne[a] seid, hat Gott den Geist seines Sohnes in unsere Herzen[b] gesandt, der ruft: »Abba[c], Vater!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Söhne« bewahrt hier Paulus’ Sprache von Sohnschaft und Erbberechtigung; gemeint sind alle Glaubenden, nicht nur Männer.
    reason: cultural_note
  - marker: b
    text: Einige Handschriften haben »eure Herzen« statt »unsere Herzen«.
    reason: textual_variant
  - marker: c
    text: Abba ist eine aramäische Anrede für »Vater«, die hier wegen ihrer ursprünglichen Ausdruckskraft und Vertrautheit beibehalten wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Und weil
  rationale: ὅτι gibt den Grund für Gottes Handeln an; δέ verbindet den Satz zugleich leicht mit dem vorausgehenden Gedankengang.
- source_word: ἐστε
  choice: ihr … seid
  rationale: Der Präsens Indikativ bezeichnet den gegenwärtigen Stand der Angesprochenen.
- source_word: υἱοί
  choice: Söhne
  rationale: Die ausdrücklich männliche Bezeichnung gehört hier zu Paulus’ Bild von Sohnschaft und Erbberechtigung. Sie schließt in diesem Zusammenhang alle Glaubenden ein, ohne die rechtliche Bildsprache zu verallgemeinern.
- source_word: ἐξαπέστειλεν
  choice: hat … gesandt
  rationale: Das Perfekt ist im modernen Deutsch eine natürliche Wiedergabe der abgeschlossenen, für die Gegenwart bedeutsamen Handlung des griechischen Aorists.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: den Geist seines Sohnes
  rationale: Die Genitivverbindung wird eng und ohne zusätzliche theologische Deutung wiedergegeben.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: in unsere Herzen
  rationale: Die Formulierung bewahrt sowohl die räumliche Metapher als auch den biblisch-anthropologischen Begriff »Herz«.
- source_word: κρᾶζον
  choice: der ruft
  rationale: Das Partizip stimmt grammatisch mit »Geist« überein. Ein Relativsatz klingt im Deutschen natürlich und lässt den Geist ausdrücklich als den Rufenden erkennen.
- source_word: Αββα
  choice: Abba
  rationale: Die im griechischen Text bewahrte aramäische Anrede wird transliteriert, damit ihre besondere Form und Betonung erhalten bleiben.
- source_word: ὁ πατήρ
  choice: Vater
  rationale: Der Artikel gehört zur griechischen Form der erläuternden Anrede; idiomatisches Deutsch verwendet hier den bloßen Vokativ »Vater«.
theological_decisions:
- issue: Wiedergabe von υἱοί im Zusammenhang von Sohnschaft und Erbe
  choice: Söhne
  alternative: Kinder
  rationale: »Söhne« erhält Paulus’ rechtliche Bildsprache von Sohnschaft, Annahme und Erbberechtigung. Eine Fußnote stellt klar, dass die Aussage nicht auf Männer beschränkt ist.
- issue: Textvariante beim Possessivpronomen zu »Herzen«
  choice: unsere Herzen
  alternative: eure Herzen
  rationale: Der vorgelegte SBLGNT-Text liest ἡμῶν (»unsere«). Die verbreitete Variante ὑμῶν (»eure«) wird transparent in einer Fußnote genannt.
- issue: Subjekt des Rufens
  choice: Der Geist ruft
  alternative: Die Glaubenden rufen durch den Geist
  rationale: Das neutrale Singularpartizip κρᾶζον stimmt unmittelbar mit τὸ πνεῦμα überein. Daher wird der Geist grammatisch als Rufender dargestellt, ohne die Beteiligung der Glaubenden weiter auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, während der Relativsatz das Partizip idiomatisch wiedergibt. Die Anrede wird mit deutschen Anführungszeichen und Ausrufezeichen als lebendiger Ruf gestaltet.
