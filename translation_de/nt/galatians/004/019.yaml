base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: de
  text: Meine Kinder, für die ich erneut in Geburtswehen liege[a], bis der Messias[b] in euch[c] Gestalt annimmt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für die ich erneut Geburtswehen leide«; auch: »für die ich erneut in Wehen liege«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Christus«. »Messias« gibt den Titel Χριστός wieder; »Christus« ist die vertraute alternative Form.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »unter euch«; damit träte der mögliche gemeinschaftliche Sinn stärker hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Meine Kinder
  rationale: Die liebevolle Anrede wird direkt und natürlich wiedergegeben; »meine kleinen Kinder« würde eine Verkleinerung hinzufügen, die im griechischen Ausdruck nicht ausdrücklich enthalten ist.
- source_word: οὓς
  choice: um die
  rationale: Der Akkusativ des Relativpronomens wird passend zum deutschen Bild von den Geburtswehen mit »um die« wiedergegeben.
- source_word: πάλιν
  choice: noch einmal
  rationale: Die Formulierung macht die Wiederholung idiomatisch und deutlich.
- source_word: ὠδίνω
  choice: Geburtswehen leide
  rationale: Die anschauliche mütterliche Metapher des griechischen Verbs bleibt erhalten.
- source_word: μέχρις οὗ
  choice: bis
  rationale: »Bis« gibt die zeitliche Grenze beziehungsweise das Ziel knapp und genau wieder.
- source_word: μορφωθῇ
  choice: Gestalt annimmt
  rationale: Die idiomatische Wendung bewahrt den Gedanken des Geformtwerdens, ohne die Metapher in eine dogmatische Erklärung aufzulösen.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als Titel wiedergegeben; der bestimmte Artikel ist im Deutschen bei »Messias« idiomatisch erforderlich.
- source_word: ἐν ὑμῖν
  choice: in euch
  rationale: Die Wendung bezeichnet am unmittelbarsten die Formung im Inneren der angesprochenen Gläubigen; wegen des Plurals bleibt zugleich ein gemeinschaftlicher Bezug möglich.
theological_decisions:
- issue: Bedeutung von »der Messias nimmt in euch Gestalt an«
  choice: Die Metapher der Gestaltwerdung in den galatischen Gläubigen bleibt ohne nähere dogmatische Festlegung stehen.
  alternative: Die Wendung kann stärker gemeinschaftlich als »unter euch« verstanden oder vor allem auf Bekehrung beziehungsweise Neugeburt bezogen werden.
  rationale: Der griechische Wortlaut lässt individuelle und gemeinschaftliche Nuancen zu. Die Übersetzung wahrt diese Spannung und macht daraus keinen theologischen Fachausdruck.
- issue: Χριστός als Titel oder vertraute Namensform
  choice: der Messias
  alternative: Christus
  rationale: Die Wiedergabe als »Messias« macht die Titelfunktion sichtbar; die geläufige Form »Christus« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Geburtsmetapher des Ausgangstextes wird bewusst nicht geglättet. Das Ausrufezeichen entspricht dem leidenschaftlichen Anredecharakter; der griechische Text schließt syntaktisch mit einem Hochpunkt.
