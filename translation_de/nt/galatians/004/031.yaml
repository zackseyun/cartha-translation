  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: de
  text: Darum, Brüder[a], sind wir nicht Kinder der Sklavin[b], sondern der Freien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; der griechische Ausdruck kann hier Männer und Frauen gemeinsam anreden.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet eine weibliche Sklavin; gemeint ist Hagar im Gegensatz zu Sara, der freien Frau (Galater 4,21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden allegorischen Argumentation und gibt die Schlussfolgerung knapp und natürlich wieder.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann hier die gemischte Gemeinde insgesamt anreden; die inklusive Wiedergabe macht den gemeinten Adressatenkreis im heutigen Deutsch unmittelbar verständlich.
- source_word: οὐκ ἐσμὲν
  choice: sind wir nicht
  rationale: Gibt die einfache präsentische Verneinung ohne einen im Griechischen nicht ausgedrückten zeitlichen Zusatz wieder.
- source_word: παιδίσκης
  choice: der Sklavin
  rationale: Der Ausdruck bezeichnet eine weibliche Sklavin beziehungsweise unfreie Dienerin; „Sklavin“ bewahrt den für Paulus entscheidenden Gegensatz zwischen Sklaverei und Freiheit.
- source_word: τέκνα
  choice: Kinder
  rationale: Das Wort ist geschlechtsübergreifend und bezeichnet Kinder beziehungsweise Nachkommen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung bildet „sondern“ im Deutschen den direkten und idiomatischen Gegensatz.
- source_word: τῆς ἐλευθέρας
  choice: der Freien
  rationale: Das substantivierte feminine Adjektiv verweist auf die zuvor genannte freie Frau, Sara; „der Freien“ bewahrt die knappe Form des griechischen Ausdrucks und den Parallelismus mit „der Sklavin“.
theological_decisions:
- issue: Paulus’ allegorischer Gegensatz zwischen Hagar und Sara
  choice: „der Sklavin … der Freien“
  alternative: „der Magd … der freien Frau“
  rationale: Der Zusammenhang in Galater 4,21–31 stellt Unfreiheit und Freiheit einander gegenüber. „Sklavin“ erhält diese Schärfe, ohne über die Aussage des Textes hinauszugehen.
- issue: Anrede ἀδελφοί an die Gemeinde
  choice: „Brüder und Schwestern“ im Haupttext
  alternative: „Brüder“ mit einer erklärenden Fußnote zur repräsentativen Verwendung
  rationale: Im heutigen Standarddeutsch gibt „Brüder und Schwestern“ den wahrscheinlich gemischten Adressatenkreis transparent wieder, während die Fußnote die wörtliche Form des Griechischen dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Schlussfolgerung und der Parallelismus des griechischen Satzes bleiben erhalten; „sondern“ ist nach der Verneinung idiomatischer als ein schlichtes „aber“.
