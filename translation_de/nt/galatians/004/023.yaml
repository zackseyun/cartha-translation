  source_fidelity: Die Übersetzung gibt den Kontrast von μὲν … δέ, παιδίσκη gegenüber ἐλευθέρα sowie κατὰ σάρκα gegenüber δι’ ἐπαγγελίας zuverlässig wieder. Die Ergänzung von „Sohn“ ist durch den unmittelbaren Kontext gedeckt. Das deutsche Perfekt „ist … geboren“ ist eine vertretbare idiomatische Wiedergabe von γεγέννηται.
  naturalness: „Doch der Sohn von der Sklavin ist dem Fleisch nach geboren, der Sohn von der Freien dagegen durch Verheißung“ ist verständliches, modernes Standarddeutsch mit einem angemessen würdevollen Register. Die knappe, leicht elliptische zweite Satzhälfte entspricht der pointierten Gegenüberstellung des griechischen Textes.
  terminology: „Sklavin“ wahrt den entscheidenden Statusgegensatz zu „der Freien“. „Dem Fleisch nach“ bewahrt den paulinischen Schlüsselbegriff ohne die unzutreffende Implikation, körperliche Geburt sei sündig. „Durch Verheißung“ gibt die anarthrische präpositionale Wendung sachgerecht wieder. Die Fußnote erläutert beide Ausdrücke kontextgerecht und ohne konfessionelle Überdeutung.
