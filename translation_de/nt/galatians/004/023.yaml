source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: de
  text: Doch der Sohn von der Sklavin ist dem Fleisch nach geboren, der Sohn von der Freien dagegen durch Verheißung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Dem Fleisch nach“ bedeutet hier: auf gewöhnlich-menschlichem Weg. „Durch Verheißung“ weist darauf hin, dass die Geburt des Sohnes der Freien auf Gottes Verheißung beruhte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: Sklavin
  rationale: Der rechtliche und gesellschaftliche Gegensatz zur freien Frau ist für Paulus’ Argument wesentlich; „Sklavin“ bewahrt ihn deutlicher als weichere Bezeichnungen wie „Magd“.
- source_word: κατὰ σάρκα
  choice: dem Fleisch nach
  rationale: Die feste paulinische Wendung bleibt erhalten. Im Kontext bezeichnet sie die Geburt auf gewöhnlich-menschlichem Weg, nicht eine an sich sündige körperliche Geburt.
- source_word: γεγέννηται
  choice: ist ... geboren
  rationale: Das deutsche Perfekt gibt das griechische Perfekt natürlich wieder und passt zur fortdauernden Bedeutung der beiden Söhne in Paulus’ Argument.
- source_word: ἐλευθέρα
  choice: die Freie
  rationale: Das substantivierte Adjektiv wird im Deutschen entsprechend substantiviert und bildet einen prägnanten sozialen Gegensatz zu „Sklavin“.
- source_word: δι’ ἐπαγγελίας
  choice: durch Verheißung
  rationale: 'Die artikellose Form und der instrumentale beziehungsweise vermittelnde Sinn werden bewahrt: Die Geburt geschah aufgrund und kraft der göttlichen Verheißung.'
- source_word: ὁ μὲν ... ὁ δὲ
  choice: der Sohn ... der Sohn ... dagegen
  rationale: „Sohn“ wird als im Kontext eindeutig mitgemeinter Bezug ergänzt; „dagegen“ bildet die griechische Gegenüberstellung natürlich ab.
theological_decisions:
- issue: Gegensatz zwischen κατὰ σάρκα und δι’ ἐπαγγελίας
  choice: „dem Fleisch nach“ steht „durch Verheißung“ gegenüber; gemeint ist gewöhnliche menschliche Zeugung im Gegensatz zu einer Geburt, die auf Gottes Verheißung beruht.
  alternative: Dynamischer könnte man „auf gewöhnlich-menschlichem Weg“ und „aufgrund der Verheißung“ übersetzen.
  rationale: Die wörtlichere Haupttextfassung bewahrt Paulus’ Schlüsselbegriff „Fleisch“ und die theologische Spannung, ohne körperliche Geburt als solche für sündig zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung des Griechischen bleibt erhalten; „Sklavin“ und „die Freie“ bewahren den für den Zusammenhang entscheidenden Statusunterschied.
