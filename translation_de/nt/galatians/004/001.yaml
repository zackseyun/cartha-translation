  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: de
  text: 'Ich sage aber: Solange der Erbe ein Kind ist[a], unterscheidet er sich in nichts von einem Sklaven, obwohl er Herr über alles ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „minderjährig“ oder „unmündig“. Das griechische Wort kann ein Kind bezeichnen und hat in diesem Zusammenhang den Sinn von jemandem, der noch nicht volljährig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ich meine aber
  rationale: λέγω führt die folgende Erläuterung ein; δέ markiert einen leichten Übergang oder Gegensatz. „Ich meine aber“ ist im Deutschen natürlich und gibt beide Elemente wieder, ohne ein zeitliches „nun“ einzuführen.
- source_word: ἐφ’ ὅσον χρόνον
  choice: solange
  rationale: Die Wendung bezeichnet eine begrenzte Zeitdauer; „solange“ ist knapp und idiomatisch.
- source_word: ὁ κληρονόμος
  choice: der Erbe
  rationale: κληρονόμος bezeichnet den Empfänger eines Erbes; „Erbe“ ist die übliche deutsche Entsprechung.
- source_word: νήπιός
  choice: noch minderjährig
  rationale: νήπιος kann ein kleines oder unmündiges Kind bezeichnen. Im rechtlichen Erbvergleich steht der noch nicht erreichte volle Status im Vordergrund; „noch minderjährig“ macht diesen kontextuellen Sinn verständlich, ohne ein bestimmtes Kindesalter festzulegen.
- source_word: οὐδὲν διαφέρει
  choice: unterscheidet er sich in nichts
  rationale: Die Formulierung bewahrt die nachdrückliche Aussage des Griechischen und bleibt in gehobenem modernem Deutsch verständlich.
- source_word: δούλου
  choice: einem Sklaven
  rationale: δοῦλος bezeichnet hier einen rechtlich unfreien Menschen. „Sklave“ erhält die Schärfe des Vergleichs besser als „Diener“.
- source_word: κύριος πάντων ὤν
  choice: obwohl er Herr über alles ist
  rationale: κύριος bezeichnet hier Besitz- beziehungsweise Verfügungsgewalt, nicht einen göttlichen Titel. „Obwohl“ gibt den im Partizip liegenden konzessiven Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Erbvergleich
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Paulus vergleicht den noch nicht verfügungsberechtigten Erben mit einem unfreien Menschen. „Sklave“ bewahrt den rechtlichen und rhetorischen Gegensatz, ohne ihn konfessionell auszudeuten.
- issue: Status des Erben bei νήπιος
  choice: noch minderjährig
  alternative: ein Kind; unmündig
  rationale: Der Kontext hebt nicht bloß das Lebensalter, sondern die vorläufig fehlende selbstständige Verfügungsgewalt hervor. Die Fußnote bewahrt die breitere lexikalische Möglichkeit „Kind“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nahe an der Struktur des griechischen Arguments, verwendet aber idiomatische deutsche Übergänge. „Herr über alles“ bewahrt die zugespitzte Ironie des Originals; „noch minderjährig“ erschließt den rechtlichen Kontext.
