id: GAL.4.14
reference: Galatians 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: de
  text: Und obwohl mein körperlicher Zustand für euch eine Prüfung war[a], habt ihr mich weder verachtet noch voller Abscheu zurückgewiesen[b], sondern mich aufgenommen wie einen Engel Gottes, wie den Messias Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Prüfung in meinem Fleisch«. Der griechische Wortlaut ist textlich und syntaktisch schwierig.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »ausgespuckt«; gemeint ist eine von Abscheu geprägte Zurückweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου
  choice: obwohl mein körperlicher Zustand für euch eine Prüfung war
  rationale: Die schwierige griechische Fügung verbindet die Prüfung der Galater mit Paulus’ körperlichem Zustand. Die Wiedergabe macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne die textliche und syntaktische Unsicherheit zu verschweigen.
- source_word: ἐξουθενήσατε
  choice: verachtet
  rationale: Das Verb bezeichnet geringschätzige Behandlung oder Verachtung; „verachtet“ ist knapp, würdig und im Deutschen natürlich.
- source_word: ἐξεπτύσατε
  choice: voller Abscheu zurückgewiesen
  rationale: Das Verb bedeutet wörtlich „ausspucken“ und bezeichnet hier bildhaft angewiderte Zurückweisung. Die Übersetzung gibt die idiomatische Aussage wieder; das konkrete Bild bleibt in der Fußnote erhalten.
- source_word: ἐδέξασθέ
  choice: aufgenommen
  rationale: Das Verb bezeichnet persönliche Annahme und gastliche Aufnahme. „Aufgenommen“ bewahrt gegenüber „willkommen geheißen“ die Nähe zum griechischen Ausdruck.
- source_word: ἄγγελον θεοῦ
  choice: einen Engel Gottes
  rationale: ἄγγελος kann „Bote“ oder „Engel“ bedeuten. Die gesteigerte Parallele zu „dem Messias Jesus“ lässt hier „Engel“ naheliegen.
- source_word: Χριστὸν Ἰησοῦν
  choice: den Messias Jesus
  rationale: Χριστός hat hier titularen Sinn. „Messias“ macht diesen Titel für heutige Leser ausdrücklich sichtbar.
theological_decisions:
- issue: Bedeutung des Vergleichs „wie einen Engel Gottes, wie den Messias Jesus“
  choice: Die beiden mit ὡς eingeleiteten Wendungen beschreiben, mit welcher Ehrerbietung die Galater Paulus aufnahmen.
  alternative: Die zweite Wendung könnte ausschließlich als rhetorische Steigerung der ersten hervorgehoben werden.
  rationale: Die Übersetzung lässt beide parallelen Vergleiche stehen und identifiziert Paulus weder ontologisch mit einem Engel noch mit Jesus.
- issue: Bedeutung von σάρξ
  choice: körperlicher Zustand
  alternative: Fleisch; sündige Natur
  rationale: Im unmittelbaren Zusammenhang bezeichnet σάρξ Paulus’ körperliche Schwäche oder Erkrankung. Eine moralisch-theologische Bedeutung ist hier nicht angezeigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwierige Anfangskonstruktion wird verständlich wiedergegeben, während die alternative, formal nähere Lesart in einer Fußnote erhalten bleibt. „Messias Jesus“ bewahrt den Titelcharakter von Χριστός.
