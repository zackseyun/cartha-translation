  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: de
  text: 'Sagt mir: Ihr, die ihr unter dem Gesetz sein wollt – hört ihr nicht auf das Gesetz?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört ihr das Gesetz nicht?“ Das griechische Verb kann sowohl „hören“ als auch „auf etwas hören“ bedeuten. Mit „dem Gesetz“ ist hier wahrscheinlich das mosaische Gesetz gemeint, besonders der Schriftbericht, den Paulus im Folgenden anführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Sagt mir
  rationale: Der Imperativ im Plural leitet eine direkte, rhetorische Aufforderung ein. „Sagt mir“ ist im Deutschen natürlich und bewahrt die auffordernde Kraft.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: ihr, die ihr unter dem Gesetz sein wollt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet die Angesprochenen anhand ihres Willens. „Unter dem Gesetz“ bewahrt Paulus’ rechtlich-bundestheologische Ausdrucksweise.
- source_word: νόμον / τὸν νόμον
  choice: dem Gesetz / das Gesetz
  rationale: 'Die gleiche deutsche Wortwahl erhält das Wortspiel: Die Angesprochenen wollen unter dem Gesetz sein, beachten aber nicht, was das Gesetz selbst sagt. Der Kontext weist auf das mosaische Gesetz und zugleich auf dessen Schrifttext.'
- source_word: οὐκ ἀκούετε
  choice: hört ihr nicht auf
  rationale: ἀκούω kann sowohl „hören“ als auch „zuhören/auf etwas hören“ bedeuten. „Auf das Gesetz hören“ vermittelt hier passend das aufmerksame Beachten, ohne die Grundbedeutung des Hörens aufzugeben.
theological_decisions:
- issue: Bedeutung von „Gesetz“
  choice: „Gesetz“ bezeichnet offen sowohl den Ordnungsbereich, unter dem die Adressaten stehen wollen, als auch den mosaischen Schrifttext, den Paulus anschließend anführt.
  alternative: Die zweite Nennung ausdrücklich als „Tora“ oder „Schrift“ wiederzugeben.
  rationale: Paulus verwendet an beiden Stellen νόμος und baut seine rhetorische Frage auf dieser Bedeutungsverbindung auf. Eine terminologische Differenzierung im Haupttext würde das Wortspiel abschwächen.
- issue: Bedeutung von ἀκούω
  choice: „auf das Gesetz hören“ im Sinn von aufmerksam hören und beachten
  alternative: „das Gesetz hören“ als stärker formale Wiedergabe
  rationale: Der Zusammenhang zielt darauf, den Inhalt des Gesetzes wahrzunehmen; zugleich bleibt „hören“ als lexikalischer Kern erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und der Gedankenstrich bilden die direkte rhetorische Anrede natürlich ab. Die wiederholte Bezeichnung „Gesetz“ bewahrt die Mehrdeutigkeit und den argumentativen Zusammenhang.
