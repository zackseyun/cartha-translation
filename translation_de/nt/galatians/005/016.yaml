review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Λέγω δέ als rhetorische Weiterführung, den Imperativ περιπατεῖτε, πνεύματι im sachlich gut begründeten Bezug auf den Heiligen Geist sowie die betonte Verneinung οὐ μὴ τελέσητε. „Ganz gewiss nicht“ vermittelt die Emphase angemessen. „Das Begehren des Fleisches“ bewahrt die paulinische Terminologie und engt ἐπιθυμία nicht unnötig auf sexuelle Begierde ein.'
  naturalness: '„Ich sage aber: Lebt durch den Geist, dann werdet ihr das Begehren des Fleisches ganz gewiss nicht ausführen“ ist modernes, verständliches Standarddeutsch. Die Formulierung ist zugleich ausreichend würdig und nicht künstlich wörtlich. „Dann“ verdeutlicht die im Kontext naheliegende Folge, ohne den Sinn unzulässig zu verändern.'
  terminology: „Geist“ ist im Kontext zu Recht großgeschrieben. „Fleisch“ erhält den zentralen Gegensatz von πνεῦμα und σάρξ, ohne ihn in der Hauptübersetzung dogmatisch zu einer einzelnen Deutung aufzulösen. Die Fußnote kennzeichnet „sündige Natur“ zutreffend als stärker auslegende Alternative.
