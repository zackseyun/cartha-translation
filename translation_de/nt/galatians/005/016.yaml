id: GAL.5.16
reference: Galatians 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: de
  text: 'Ich sage aber: Lebt durch den Geist, dann werdet ihr das Begehren des Fleisches[a] ganz gewiss nicht ausführen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sündigen Natur“. Das griechische Wort bedeutet wörtlich „Fleisch“ und kann bei Paulus die gefallene menschliche Natur in ihrem Gegensatz zum Geist bezeichnen.'
    reason: Alternative, stärker auslegende Wiedergabe von σάρξ.
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ich sage aber
  rationale: δέ markiert hier eine leichte Gegenüberstellung beziehungsweise rhetorische Weiterführung. „Ich sage aber“ gibt beides knapp und natürlich wieder.
- source_word: πνεύματι
  choice: durch den Geist
  rationale: Der Dativ kann Mittel oder Lebenssphäre bezeichnen. „Durch den Geist“ ist im Deutschen idiomatisch und lässt die leitende Wirksamkeit des Heiligen Geistes erkennen, auf den der Zusammenhang verweist.
- source_word: περιπατεῖτε
  choice: Lebt
  rationale: Das griechische Bild bedeutet im paulinischen Sprachgebrauch, sein Leben zu führen. „Lebt“ vermittelt dies heutigen Lesern unmittelbar; das wörtliche „geht“ wäre hier im Deutschen leicht missverständlich.
- source_word: ἐπιθυμίαν
  choice: das Begehren
  rationale: ἐπιθυμία bezeichnet ein Verlangen, das erst durch den Zusammenhang negativ bestimmt wird. „Begehren“ bewahrt die Breite des Begriffs besser als das enger sexuell gefärbte „Begierde“.
- source_word: σαρκὸς
  choice: des Fleisches
  rationale: Die wörtliche Wiedergabe bewahrt Paulus’ theologisch spannungsreiche Gegenüberstellung von Fleisch und Geist, statt sie durch „sündige Natur“ bereits auszulegen.
- source_word: οὐ μὴ τελέσητε
  choice: werdet ihr … ganz gewiss nicht ausführen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ gibt diese Emphase wieder; „ausführen“ bezeichnet hier die Verwirklichung des Begehrens.
theological_decisions:
- issue: Referent von πνεύματι
  choice: der Heilige Geist („der Geist“)
  alternative: der menschliche Geist oder ein allgemeines geistliches Prinzip
  rationale: Der unmittelbare Zusammenhang in Galater 5 stellt den Geist als Gegenüber des Fleisches und als wirksame Leitung des christlichen Lebens dar. Die Großschreibung signalisiert diesen kontextuell gut begründeten Bezug, ohne den Text auszubauen.
- issue: Bedeutung von σάρξ
  choice: das Fleisch
  alternative: die sündige Natur
  rationale: Obwohl σάρξ hier moralisch negativ gebraucht wird, erhält „Fleisch“ Paulus’ eigene Kategorie und die Spannung der Gegenüberstellung. Die auslegende Alternative wird in der Fußnote genannt.
- issue: Verhältnis von Imperativ und emphatischer Verneinung
  choice: Aufforderung mit nachdrücklich zugesagter Folge
  alternative: zweiter Imperativ im Sinn von „führt keinesfalls aus“
  rationale: περιπατεῖτε ist Imperativ, während οὐ μὴ τελέσητε formal eine starke Verneinung mit Aorist Konjunktiv bildet. Die deutsche Futurform gibt die zugesagte Folge wieder, ohne sie als bloßen zweiten Befehl zu behandeln.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Lebt“ vermeidet das im Deutschen unnatürliche metaphorische „wandelt“, während „Fleisch“ als zentraler paulinischer Begriff erhalten bleibt. Die Stellung von „ganz gewiss nicht“ macht die starke griechische Verneinung deutlich.
