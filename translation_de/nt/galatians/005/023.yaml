  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: de
  text: Sanftmut, Selbstbeherrschung; gegen solche Dinge gibt es kein Gesetz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegen solche Menschen gibt es kein Gesetz.“ Das griechische Wort kann sich auf die genannten Eigenschaften oder auf Menschen beziehen, die sie zeigen; im Zusammenhang sind wahrscheinlich die Eigenschaften gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: Sanftmut
  rationale: Das Wort bezeichnet in diesem Tugendkatalog eine milde, demütige und nicht harte Haltung. „Sanftmut“ ist im Deutschen eine geläufige, würdige Bezeichnung dieser Tugend.
- source_word: ἐγκράτεια
  choice: Selbstbeherrschung
  rationale: Der Ausdruck meint die Herrschaft über die eigenen Wünsche und Impulse. „Selbstbeherrschung“ gibt diesen ethischen Sinn im modernen Deutsch klar wieder.
- source_word: κατὰ τῶν τοιούτων
  choice: gegen solche Dinge
  rationale: Das substantivierte τοιούτων kann grammatisch auf Menschen oder Dinge bezogen sein. Im Zusammenhang verweist es am ehesten auf die zuvor genannten Eigenschaften als Frucht des Geistes.
- source_word: νόμος
  choice: Gesetz
  rationale: Da νόμος ohne Artikel steht, bewahrt „Gesetz“ die allgemein formulierte Aussage und legt sie nicht ausschließlich auf das mosaische Gesetz fest.
theological_decisions:
- issue: Reichweite von νόμος in der Aussage des Paulus
  choice: Allgemein mit „Gesetz“ wiedergegeben
  alternative: „das Gesetz“ als besondere Bezeichnung für das mosaische Gesetz
  rationale: Der Galaterbrief behandelt zwar das mosaische Gesetz, doch die artikellose Formulierung hat hier zugleich sprichwortartige Weite. Die Übersetzung bewahrt diese Spannung, ohne den mosaischen Hintergrund auszuschließen.
- issue: Bezug von τοιούτων
  choice: Auf die aufgezählten Eigenschaften bezogen
  alternative: Auf Menschen, die solche Eigenschaften zeigen
  rationale: Beides ist grammatisch möglich; der unmittelbare Rückbezug auf die Frucht des Geistes macht den sachlichen Bezug wahrscheinlicher. Die Alternative wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Die knappe Reihung des griechischen Tugendkatalogs bleibt erhalten; „Gesetz“ wird bewusst ohne bestimmten Artikel wiedergegeben.
