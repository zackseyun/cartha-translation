  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: de
  text: Ihr lieft gut. Wer hat euch daran gehindert, der Wahrheit zu gehorchen[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch von der Wahrheit überzeugen zu lassen“. Das griechische Verb kann sowohl „gehorchen“ als auch „sich überzeugen lassen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Ihr wart unterwegs
  rationale: Das Imperfekt bezeichnet einen fortdauernden Vorgang in der Vergangenheit. „Unterwegs sein“ gibt das Bild des Laufens idiomatisch wieder, ohne den im Griechischen nicht ausdrücklich genannten „Wettlauf“ einzufügen.
- source_word: καλῶς
  choice: gut
  rationale: Das Adverb bestimmt Ἐτρέχετε näher und bezeichnet den bisherigen guten Verlauf.
- source_word: τίς
  choice: Wer
  rationale: Das Fragepronomen fragt hier nach der Person oder Personengruppe, die den Fortgang störte.
- source_word: ἐνέκοψεν
  choice: hat euch daran gehindert
  rationale: Das Verb bezeichnet ein Unterbrechen oder Hemmen und kann im Zusammenhang das Bild eines behinderten Läufers anklingen lassen.
- source_word: τῇ ἀληθείᾳ
  choice: der Wahrheit
  rationale: Der Dativ gehört zu πείθεσθαι; der bestimmte Ausdruck verweist im Kontext auf die bereits verkündete Wahrheit des Evangeliums.
- source_word: μὴ πείθεσθαι
  choice: nicht … zu gehorchen
  rationale: πείθομαι kann hier die praktische Zustimmung im Sinn von Gehorsam bezeichnen. Die ebenfalls mögliche Bedeutung „sich überzeugen lassen“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von πείθεσθαι mit τῇ ἀληθείᾳ
  choice: der Wahrheit gehorchen
  alternative: sich von der Wahrheit überzeugen lassen
  rationale: Der Zusammenhang betrifft die Abkehr der Galater von ihrer bisherigen Reaktion auf das Evangelium; „gehorchen“ gibt diese verbindliche Reaktion wieder. Da das Verb zugleich den Gedanken des Überzeugtwerdens tragen kann, bleibt diese Spannung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt knapp und rhetorisch. „Unterwegs“ ist idiomatisch, schwächt jedoch das ausdrückliche Laufbild leicht ab; der Sinn des fortschreitenden Laufens bleibt im Kontext erhalten.
