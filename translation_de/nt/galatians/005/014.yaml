id: GAL.5.14
reference: Galatians 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: de
  text: Denn das ganze Gesetz ist in einem einzigen Ausspruch erfüllt:[a][b] »Du sollst deinen Nächsten lieben wie dich selbst.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »in einem einzigen Wort«; gemeint ist hier ein einzelner Ausspruch oder Gebotssatz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ist zur Erfüllung gebracht«; sinngemäß auch: »ist zusammengefasst«. Das griechische Verb bedeutet in erster Linie »erfüllen« und kann zugleich ausdrücken, dass die Absicht des Gesetzes in diesem Gebot ihr Ziel erreicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Denn
  rationale: γάρ begründet die vorhergehende Ermahnung; »Denn« ist im Deutschen der natürliche knappe Anschluss.
- source_word: πᾶς νόμος
  choice: das ganze Gesetz
  rationale: Die Formulierung bezeichnet das Gesetz in seiner Gesamtheit und lässt die im Griechischen fehlende Einschränkung auf einzelne Teile bewusst aus.
- source_word: ἐν ἑνὶ λόγῳ
  choice: in einem einzigen Ausspruch
  rationale: λόγος meint hier nicht ein einzelnes Wort im lexikalischen Sinn, sondern den einen anschließend zitierten Satz beziehungsweise Gebotsspruch. »Ausspruch« ist verständlich und wahrt den Bezug auf eine konkrete Schriftstelle.
- source_word: πεπλήρωται
  choice: ist erfüllt
  rationale: Das Perfekt Passiv bezeichnet einen durch Erfüllung bestehenden Zustand. »Ist erfüllt« bewahrt die stärkere Aussage von πληρόω, ohne sie auf bloßes Zusammenfassen zu reduzieren.
- source_word: Ἀγαπήσεις
  choice: Du sollst lieben
  rationale: Das Futur in der angeführten Gebotsformel aus 3. Mose 19,18 wird im Deutschen idiomatisch und würdig mit »Du sollst« wiedergegeben.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: »Dein Nächster« ist die sachlich genaue und im biblischen Gebotszusammenhang etablierte deutsche Wiedergabe.
- source_word: ὡς σεαυτόν
  choice: wie dich selbst
  rationale: Die Formulierung gibt den Vergleich knapp und genau wieder.
theological_decisions:
- issue: Verhältnis des ganzen Gesetzes zum Liebesgebot
  choice: Das ganze Gesetz ist in diesem Gebot erfüllt.
  alternative: Das ganze Gesetz ist in diesem Gebot zusammengefasst.
  rationale: πληρόω bezeichnet vorrangig Erfüllung und kann dabei einschließen, dass die Absicht des Gesetzes in diesem Gebot zur Geltung kommt. Die Übersetzung bewahrt diese Spannung und schränkt »Gesetz« nicht eigenmächtig auf ethische Einzelbestimmungen ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. »Ausspruch« vermeidet das im Deutschen mögliche Missverständnis, die folgende mehrgliedrige Aussage sei buchstäblich nur ein einzelnes Wort. Die traditionelle Gebotsform »Du sollst« bleibt wegen des ZitatCharakters erhalten.
