id: GAL.5.22
reference: Galatians 5:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: de
  text: Doch die Frucht des Geistes ist Liebe, Freude, Frieden, Geduld, Freundlichkeit, Güte und Glaube[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Treue“. Das griechische Wort πίστις kann Glaube, Vertrauen oder Treue bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zu den zuvor genannten Werken des Fleisches und klingt im modernen Deutschen natürlich.
- source_word: καρπὸς
  choice: Frucht
  rationale: Bewahrt das paulinische Bild und den Singular, der die folgenden Eigenschaften als zusammengehörige Wirkung darstellt.
- source_word: τοῦ πνεύματός
  choice: des Geistes
  rationale: Der Zusammenhang des Galaterbriefs spricht hier für Gottes Heiligen Geist im Gegensatz zum Fleisch.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die natürliche und umfassende deutsche Entsprechung für ἀγάπη.
- source_word: χαρά
  choice: Freude
  rationale: Prägnante und geläufige Wiedergabe innerhalb der Tugendliste.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Bewahrt die mögliche innere wie zwischenmenschliche Bedeutung, ohne sie einzuengen.
- source_word: μακροθυμία
  choice: Geduld
  rationale: Eine verständliche moderne Wiedergabe der standhaften Nachsicht gegenüber anderen.
- source_word: χρηστότης
  choice: Freundlichkeit
  rationale: Gibt die wohlwollende, gütige Haltung in heutigem Deutsch natürlich wieder.
- source_word: ἀγαθωσύνη
  choice: Güte
  rationale: Bezeichnet hier die umfassende sittliche Qualität des Gutseins und vermeidet die schwerfällige Form „Gutheit“.
- source_word: πίστις
  choice: Glaube
  rationale: Bewahrt die zentrale und traditionelle Bedeutung von πίστις; im Kontext einer Tugendliste ist jedoch auch „Treue“ möglich und wird daher in einer Fußnote genannt.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: Heiliger Geist
  alternative: menschlicher Geist
  rationale: Der unmittelbare Gegensatz zum Fleisch und der weitere Zusammenhang in Galater 5 sprechen für Gottes Geist als den Urheber dieser Frucht.
- issue: Bedeutung von πίστις in der Tugendliste
  choice: Glaube
  alternative: Treue
  rationale: πίστις kann Glaube, Vertrauen oder Treue bezeichnen. „Glaube“ bleibt im Haupttext stehen, während die im Tugendkontext sehr plausible Bedeutung „Treue“ in der Fußnote erhalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Singular „Frucht“ und die knappe Reihung des griechischen Textes bleiben erhalten; vor dem letzten Glied steht zur natürlichen deutschen Koordination „und“.
