  terminology: „Frucht des Geistes“, „Liebe“, „Freude“, „Frieden“, „Geduld“, „Freundlichkeit“ und „Güte“ sind treffende, registergerechte Wiedergaben. Die Fußnote zu πίστις wahrt die semantische Offenheit ohne eine theologische Deutung vorzuschreiben.
