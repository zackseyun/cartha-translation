id: GAL.5.11
reference: Galatians 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: de
  text: Ich aber, Brüder[a], wenn ich noch die Beschneidung verkünde, warum werde ich dann noch verfolgt? Dann ist das Ärgernis[b] des Kreuzes beseitigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Brüder“ kann in einer solchen Anrede auch Brüder und Schwestern gemeinsam bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: der Anstoß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Vokativ wird direkt wiedergegeben. Im damaligen Briefgebrauch kann die Anrede die gesamte, auch aus Frauen bestehende Gemeinde einschließen; darauf weist die Fußnote hin.
- source_word: περιτομήν
  choice: Beschneidung
  rationale: Die direkte und etablierte Entsprechung bezeichnet hier zugleich die von manchen geforderte religiöse Praxis.
- source_word: ἔτι
  choice: noch
  rationale: 'Das zweimalige ἔτι wird in beiden Satzteilen beibehalten und trägt Paulus’ Argument: Würde er die Beschneidung weiterhin verkünden, wäre seine fortdauernde Verfolgung unerklärlich.'
- source_word: κηρύσσω
  choice: verkünde
  rationale: Das Präsens bezeichnet fortgesetzte öffentliche Verkündigung; „verkünden“ gibt den heroldartigen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: διώκομαι
  choice: werde … verfolgt
  rationale: Die passive Form und die feindselige Verfolgung werden ausdrücklich bewahrt.
- source_word: ἄρα
  choice: Dann
  rationale: Die Folgerung aus der vorausgehenden hypothetischen Aussage wird knapp und natürlich ausgedrückt.
- source_word: κατήργηται
  choice: ist … beseitigt
  rationale: 'Das Perfekt Passiv bezeichnet einen herbeigeführten Zustand: Das Ärgernis wäre aus dem Weg geschafft beziehungsweise unwirksam gemacht.'
- source_word: σκάνδαλον
  choice: Ärgernis
  rationale: „Ärgernis“ bewahrt die Bedeutung eines Anstoßes, der Ablehnung hervorruft. Die konkretere Alternative „Anstoß“ wird in einer Fußnote genannt.
- source_word: σταυροῦ
  choice: Kreuz
  rationale: Die übliche und unmittelbare Wiedergabe wahrt die zentrale paulinische Bezeichnung ohne zusätzliche Auslegung.
theological_decisions:
- issue: Anrede ἀδελφοί an eine wahrscheinlich gemischte Gemeinde
  choice: Brüder
  alternative: Brüder und Schwestern
  rationale: Die grammatisch maskuline Ausgangsform bleibt im Haupttext sichtbar. Eine Fußnote erklärt, dass sie im griechischen Briefgebrauch auch Frauen einschließen kann, ohne die historische Form der Anrede zu verdecken.
- issue: Bedeutung von σκάνδαλον τοῦ σταυροῦ
  choice: das Ärgernis des Kreuzes
  alternative: der Anstoß des Kreuzes
  rationale: Die Formulierung lässt die theologische Spannung bestehen, dass gerade das Kreuz Ablehnung hervorruft. „Ärgernis“ gibt diese provozierende Wirkung wieder; „Anstoß“ macht das Bild des Stolperhindernisses deutlicher.
- issue: Aussageform der Schlussfolgerung trotz hypothetischem Vordersatz
  choice: Dann ist … beseitigt
  alternative: Dann wäre … beseitigt
  rationale: Der griechische Text verwendet nach εἰ mit Indikativ eine indikativische Folgerung (κατήργηται). Die deutsche Fassung erhält diese zugespitzte rhetorische Feststellung, statt sie durch einen Konjunktiv ausdrücklich zu irrealisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Briefstil. Die Wiederholung von „noch“ und die knappe Folgerung „Dann“ bilden den argumentativen Nachdruck des griechischen Textes ab. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
