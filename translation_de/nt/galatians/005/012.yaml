translation:
  language: de
  text: Wenn sich doch die, die euch in Unruhe versetzen, sogar verstümmeln würden![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sich abschneiden«. Im Zusammenhang mit der Beschneidung meint Paulus wahrscheinlich, sie sollten beim Schneiden noch weiter gehen und sich selbst entmannen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die euch verwirren« beziehungsweise »die euch aufwühlen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Wenn sich doch … würden!
  rationale: Die deutsche Wunschform mit »wenn doch« gibt den unerfüllten, scharf formulierten Wunsch idiomatisch und ohne archaische Wendung wieder.
- source_word: καὶ
  choice: gleich ganz
  rationale: 'καί steigert hier im Zusammenhang der Beschneidungsdebatte die Aussage: Die Unruhestifter sollen beim Schneiden noch weiter gehen. »gleich ganz« vermittelt diese rhetorische Zuspitzung natürlich.'
- source_word: ἀποκόψονται
  choice: sich … verstümmeln
  rationale: Das Verb bezeichnet wörtlich ein Ab- oder Abschneiden. Im Kontext ist sehr wahrscheinlich eine drastische Anspielung auf Selbstentmannung beziehungsweise Kastration gemeint; »sich verstümmeln« bewahrt die Schärfe, ohne den möglichen Bezug enger festzulegen, als das Verb allein verlangt.
- source_word: οἱ ἀναστατοῦντες
  choice: die, die euch aufwühlen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Unruhe und Verwirrung verursachen. »aufwühlen« ist gegenwärtig, verständlich und stärker als ein bloßes »beunruhigen«.
- source_word: ὑμᾶς
  choice: euch
  rationale: Die zweite Person Plural richtet sich kollektiv an die galatischen Gläubigen und wird im Deutschen eindeutig mit »euch« wiedergegeben.
theological_decisions:
- issue: Paulus’ zugespitzter Wunsch im Zusammenhang mit der Beschneidung
  choice: Der Haupttext gibt die wahrscheinlich gemeinte Selbstverstümmelung als ironisch-hyperbolische Steigerung der Beschneidung wieder.
  alternative: Paulus könnte wünschen, dass die Unruhestifter sich aus der Gemeinschaft ausschließen beziehungsweise »abschneiden« lassen.
  rationale: Der unmittelbare Kontext behandelt die Beschneidung. Daher liegt ein Wortspiel mit einem weitergehenden Abschneiden bis hin zur Entmannung am nächsten. Eine Fußnote erhält jedoch die wörtlichere und gemeinschaftsbezogene Deutungsmöglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst scharfer Rhetorik. Die Satzstellung bildet einen natürlichen deutschen Wunschsatz; »gleich ganz« macht die Steigerung deutlich, ohne zusätzliche Lehrinhalte einzutragen.
