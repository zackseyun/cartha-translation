id: GAL.5.2
reference: Galatians 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: de
  text: 'Seht: Ich, Paulus, sage euch: Wenn ihr euch beschneiden lasst[a], wird euch der Messias[b] nichts nützen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr beschnitten werdet“ oder „wenn ihr die Beschneidung annehmt“.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Christos, „Gesalbter“; hier als Titel „der Messias“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Seht:'
  rationale: Das Wort dient hier als nachdrücklicher Aufmerksamkeitsruf. „Seht“ bewahrt diesen rhetorischen Nachdruck und passt zur Anrede an mehrere Personen.
- source_word: ἐγὼ Παῦλος
  choice: Ich, Paulus,
  rationale: Das ausdrücklich gesetzte Pronomen ist zusammen mit dem Namen betont. Die Apposition erhält Paulus’ pointierte persönliche Selbstbezeichnung.
- source_word: λέγω ὑμῖν
  choice: sage euch
  rationale: Eine direkte, formnahe und im Deutschen verständliche Wiedergabe von λέγω mit dem Dativpronomen.
- source_word: ἐὰν περιτέμνησθε
  choice: wenn ihr euch beschneiden lasst
  rationale: Die Form bezeichnet, dass die Angesprochenen die Beschneidung an sich vollziehen lassen. Die deutsche Wendung gibt den passiven Sinn natürlich wieder, ohne über den griechischen Wortlaut hinauszugehen.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός bezeichnet hier Jesus in seiner messianischen Stellung und hat erkennbaren Titelcharakter. „Der Messias“ macht diesen Sinn im modernen Deutschen deutlich.
- source_word: οὐδὲν ὠφελήσει
  choice: wird euch nichts nützen
  rationale: Die Wendung drückt einen vollständigen Mangel an Nutzen aus. „Wird euch nichts nützen“ ist klar, gegenwärtig und entspricht der zukünftigen Aussage des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: An dieser Stelle bleibt der Titelcharakter theologisch bedeutsam. „Der Messias“ gibt Χριστός daher als Titel wieder, statt es wie einen bloßen Eigennamen zu behandeln.
- issue: Reichweite der Warnung vor der Beschneidung
  choice: Die Aussage bleibt auf das Sich-beschneiden-Lassen im argumentativen Zusammenhang des Galaterbriefs bezogen.
  alternative: Eine ausdrückliche Verurteilung jeder medizinischen, ethnischen oder sonstigen Beschneidung
  rationale: Der Vers warnt im unmittelbaren Zusammenhang vor der Annahme der Beschneidung als verpflichtendem Bundes- beziehungsweise Gesetzeszeichen. Die Übersetzung erweitert diese Warnung nicht zu einer pauschalen Aussage über jede Form der Beschneidung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der doppelte Doppelpunkt bildet den eindringlichen Aufmerksamkeitsruf und die anschließende direkte Warnung ab; die leicht markierte Formulierung „Ich, Paulus“ erhält die ausdrückliche Betonung des griechischen Pronomens.
