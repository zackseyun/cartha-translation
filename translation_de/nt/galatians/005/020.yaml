lexical_decisions:
- source_word: εἰδωλολατρία
  choice: Götzendienst
  rationale: Die übliche, präzise deutsche Bezeichnung für die Verehrung oder den Dienst an Götzen; sie bewahrt den religiös-moralischen Gehalt des Ausdrucks.
- source_word: φαρμακεία
  choice: Zauberei
  rationale: Im Zusammenhang dieser Lasterliste bezeichnet das Wort okkulte magische Praktiken, nicht Arzneikunde im Allgemeinen. »Zauberei« ist im heutigen Deutsch klar und ausreichend weit.
- source_word: ἔχθραι
  choice: Feindschaften
  rationale: Der Plural bezeichnet feindselige Beziehungen oder Haltungen. »Feindschaften« gibt sowohl den andauernden als auch den zwischenmenschlichen Charakter wieder.
- source_word: ἔρις
  choice: Streit
  rationale: Das Wort bezeichnet streitsüchtigen Konflikt. »Streit« ist knapp, natürlich und für eine Lasterliste passend.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im negativen Kontext der Lasterliste ist nicht positiver Eifer, sondern eifersüchtige Rivalität gemeint. »Eifersucht« wahrt diese kontextuelle Bedeutung.
- source_word: θυμοί
  choice: Wutausbrüche
  rationale: Der Plural weist auf wiederholte, heftige Ausbrüche des Zorns hin. »Wutausbrüche« bringt diesen episodischen Charakter deutlich zum Ausdruck.
- source_word: ἐριθεῖαι
  choice: selbstsüchtiges Streben
  rationale: Der Ausdruck bezeichnet eigennütziges, rivalisierendes Streben nach dem eigenen Vorteil. Die Wiedergabe erfasst sowohl die Haltung als auch das daraus folgende Verhalten.
- source_word: διχοστασίαι
  choice: Spaltungen
  rationale: Gemeint ist das Auseinandertreten in gegnerische Gruppen. »Spaltungen« ist verständlich und passt zum gemeinschaftlichen Zusammenhang.
- source_word: αἱρέσεις
  choice: Parteiungen
  rationale: Hier stehen trennende Gruppenbildungen oder Parteien im Vordergrund. »Parteiungen« bewahrt diesen sozialen Sinn, ohne die spätere kirchliche Fachbedeutung »Häresien« vorschnell einzutragen.
theological_decisions:
- issue: Wiedergabe von αἱρέσεις
  choice: Parteiungen
  alternative: 'Sekten; in späterem kirchlichem Sprachgebrauch: Häresien'
  rationale: Der unmittelbare Zusammenhang nennt Sünden, die Beziehungen und Gemeinschaft zerstören. Daher ist hier die Bedeutung trennender Parteien oder Gruppierungen vorrangig; »Häresien« würde leicht eine spätere dogmatische Fachbedeutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Listenform. Die Substantive folgen der grammatischen Gestalt und dem Rhythmus des griechischen Textes. Die Schlussinterpunktion bleibt als Komma erhalten, da der Vers syntaktisch in die fortlaufende Aufzählung eingebettet ist.
