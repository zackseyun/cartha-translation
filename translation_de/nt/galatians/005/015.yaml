source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: de
  text: Wenn ihr aber einander beißt und verschlingt, dann gebt acht, dass ihr nicht voneinander aufgezehrt werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Wenn ... aber
  rationale: εἰ leitet die Bedingung ein, δέ markiert einen leichten Gegensatz beziehungsweise eine Weiterführung. Die deutsche Satzstellung mit »aber« nach dem Subjekt ist natürlich und bewahrt diese Funktion.
- source_word: ἀλλήλους
  choice: einander
  rationale: Das reziproke Pronomen bezeichnet das gegenseitige Handeln innerhalb der Gemeinschaft; »einander« gibt dies knapp und idiomatisch wieder.
- source_word: δάκνετε
  choice: beißt
  rationale: Die wörtliche Bedeutung bewahrt das bewusst drastische Bild. Das deutsche Präsens kann wie das griechische Präsens fortgesetztes oder kennzeichnendes Verhalten bezeichnen, ohne den Aspekt ausdrücklich zu überladen.
- source_word: κατεσθίετε
  choice: verschlingt
  rationale: Das Verb steigert das Bild des Fressens. »Verschlingen« ist im Deutschen anschaulich, gewaltsam und verbindet sich natürlich mit »beißen«.
- source_word: βλέπετε
  choice: passt auf
  rationale: Der Imperativ fordert nachdrücklich zu Wachsamkeit auf. »Passt auf« ist modernes, klares Standarddeutsch und trägt den Warncharakter.
- source_word: μὴ
  choice: dass ... nicht
  rationale: μή leitet mit dem Konjunktiv eine Warnung vor einem möglichen Ergebnis ein. Nach »passt auf« ist »dass ... nicht« die natürliche deutsche Konstruktion.
- source_word: ὑπ’ ἀλλήλων
  choice: voneinander
  rationale: ὑπό mit Genitiv bezeichnet beim Passiv die handelnde Ursache. »Voneinander« erhält sowohl die passive Urheberschaft als auch die Gegenseitigkeit.
- source_word: ἀναλωθῆτε
  choice: aufgezehrt werdet
  rationale: Das Passiv setzt das Bild des gegenseitigen Fressens fort und kann zugleich völligen Ruin bezeichnen. »Aufgezehrt« wahrt die Metapher und unterscheidet sich sprachlich von »verschlingt«.
theological_decisions:
- issue: Bildhafte Gewalt innerhalb der christlichen Gemeinschaft
  choice: Die Tier- und Fressmetaphorik wird mit »beißt«, »verschlingt« und »aufgezehrt« beibehalten.
  alternative: Die Aussage allgemein als gegenseitiges Verletzen und Zerstören wiederzugeben.
  rationale: Paulus formuliert absichtlich drastisch und warnt vor gegenseitiger Selbstzerstörung. Eine abstrakte Wiedergabe würde die rhetorische und moralische Dringlichkeit abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit unmittelbar verständlicher Warnsprache. Die drastische Metapher und die gegenseitige Ausrichtung aller Handlungen bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
