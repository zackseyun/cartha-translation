source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: de
  text: Ich bin im Herrn zuversichtlich im Blick auf euch, dass ihr keine andere Auffassung vertreten werdet.[a] Wer euch aber in Unruhe versetzt, wird das Urteil zu tragen haben, wer immer er sein mag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass ihr nichts anderes denken werdet“. Das griechische Verb kann allgemeines Denken, eine innere Haltung oder eine bestimmte Auffassung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wer es auch ist“ oder „ganz gleich, wer es ist“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: Ich bin zuversichtlich
  rationale: Das Perfekt bezeichnet idiomatisch einen gefestigten Zustand des Vertrauens; die deutsche Gegenwartsform gibt diesen Sinn natürlich wieder.
- source_word: εἰς ὑμᾶς
  choice: was euch betrifft
  rationale: Die Wendung bezeichnet hier die Personen, auf deren Reaktion sich Paulus’ Zuversicht richtet, ohne sie zu einem eigenständigen Vertrauensgrund zu machen.
- source_word: ἐν κυρίῳ
  choice: im Herrn
  rationale: Die geläufige paulinische Formulierung bewahrt die mögliche Bedeutungssphäre und Grundlage der Zuversicht.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: dass ihr zu keiner anderen Auffassung kommen werdet
  rationale: φρονέω kann das Denken, die innere Haltung oder eine vertretene Auffassung bezeichnen. Im Kontext klingt die auf eine Auffassung bezogene Wiedergabe im Deutschen natürlicher als das wörtliche „nichts anderes denken“.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Wer euch aber in Unruhe versetzt
  rationale: Das substantivierte Präsenspartizip bezeichnet den gegenwärtig Unruhe stiftenden Menschen; die Wiedergabe lässt offen, ob Paulus eine bestimmte bekannte Person oder einen typischen Verursacher meint.
- source_word: βαστάσει
  choice: wird … tragen
  rationale: Die Grundbedeutung „tragen“ erhält das Bild und legt nicht vorschnell fest, ob vor allem Urteilsspruch, Strafe oder Folgen gemeint sind.
- source_word: τὸ κρίμα
  choice: das Urteil
  rationale: „Urteil“ bewahrt die richterliche Bedeutung, ohne die Aussage ausdrücklich auf ewige Verdammnis oder eine bestimmte Strafe festzulegen.
- source_word: ὅστις ἐὰν ᾖ
  choice: wer immer es auch sein mag
  rationale: Die unbestimmte Relativkonstruktion betont, dass Identität oder Ansehen des Unruhestifters am angekündigten Urteil nichts ändern.
theological_decisions:
- issue: Grund und Tragweite von Paulus’ Zuversicht
  choice: Paulus ist hinsichtlich der künftigen Haltung der Galater zuversichtlich, und diese Zuversicht steht ausdrücklich „im Herrn“.
  alternative: Absolute Garantie für das Beharren aller Galater oder bloß menschlicher Optimismus.
  rationale: Der Text verbindet persönliche Zuversicht mit ihrer Verankerung „im Herrn“ und einer Zukunftsaussage, ohne das Verhältnis zwischen göttlichem Wirken und menschlicher Reaktion weiter zu erklären.
- issue: Art des κρίμα
  choice: Ein gewichtiges richterliches Urteil, dessen genaue Gestalt offenbleibt.
  alternative: Ausdrücklich ewige Verdammnis oder lediglich kirchliche beziehungsweise soziale Folgen.
  rationale: κρίμα kann Urteil, Richterspruch oder die daraus folgende Strafe bezeichnen; der Vers bestimmt den Umfang nicht näher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu keiner anderen Auffassung kommen“ ist gegenüber dem formalen „nichts anderes denken“ idiomatischer, während Fußnote [a] die Struktur und Bedeutungsbreite des Griechischen sichtbar hält. Die Satzstellung „im Herrn zuversichtlich, was euch betrifft“ bewahrt sowohl den theologischen Bezug als auch natürliches Deutsch.
