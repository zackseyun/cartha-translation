  to: Ich bin im Herrn zuversichtlich im Blick auf euch, dass ihr keine andere Auffassung vertreten werdet.[a] Wer euch aber in Unruhe versetzt, wird das Urteil zu tragen haben, wer immer er sein mag.[b]
  rationale: Die Überarbeitung beseitigt eine unnötige prozesshafte Nuance bei φρονέω, ersetzt eine im Deutschen wenig natürliche Verbindung durch eine idiomatische, aber weiterhin semantisch offene Formulierung und verdeutlicht den personalen Bezug der unbestimmten Relativkonstruktion. Das Urteil bleibt ausdrücklich in seiner genauen Art und Reichweite offen.
