base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: de
  text: Ein wenig Sauerteig durchsäuert den ganzen Teig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit einer heute geläufigeren, aber engeren Bezeichnung: »Ein wenig Hefe durchwirkt den ganzen Teig.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὰ
  choice: ein wenig
  rationale: Das Adjektiv bezeichnet hier idiomatisch eine kleine Menge. »Ein wenig« gibt die knappe sprichwörtliche Form natürlich wieder.
- source_word: ζύμη
  choice: Sauerteig
  rationale: Gemeint ist ein Gärmittel für Teig. »Sauerteig« entspricht dem antiken Bild besser als die enger gefasste moderne Bezeichnung »Hefe« und bewahrt die biblische Bildsprache.
- source_word: ὅλον
  choice: den ganzen
  rationale: Die Formulierung bringt die vollständige Wirkung auf die gesamte Teigmenge klar und idiomatisch zum Ausdruck.
- source_word: φύραμα
  choice: Teig
  rationale: Das Wort bezeichnet eine durchmischte beziehungsweise geknetete Teigmasse. »Teig« ist im modernen Deutschen klarer und natürlicher als »Teigklumpen«.
- source_word: ζυμοῖ
  choice: durchsäuert
  rationale: Das Verb bezeichnet das Durchwirken des Teigs mit Sauerteig. »Durchsäuert« bewahrt sowohl die konkrete Tätigkeit als auch die knappe, sprichwörtliche Wirkung des griechischen Satzes.
theological_decisions:
- issue: Bildhafte Aussage des Sprichworts
  choice: Das konkrete Bild von Sauerteig und Teig bleibt ohne ausdrückliche Deutung stehen.
  alternative: Schon ein geringer schädlicher Einfluss erfasst die ganze Gemeinschaft.
  rationale: Der Vers formuliert selbst ein Sprichwort und benennt dessen Anwendung nicht ausdrücklich. Eine ausformulierte Deutung würde die kontextuelle Warnung in den Vers hineintragen und seine bildhafte Offenheit einschränken.
translation_notes:
  register: Knappe, einprägsame Sprichwortform in modernem Standarddeutsch. »Sauerteig« und »durchsäuert« bewahren die konkrete antike Bildwelt und den würdigen biblischen Sprachklang, ohne die Aussage erklärend auszudeuten.
