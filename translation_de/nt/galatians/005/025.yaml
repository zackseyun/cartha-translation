  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: de
  text: Wenn wir durch den Geist leben, lasst uns auch im Gleichschritt mit dem Geist gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn wir im Geist leben, lasst uns auch im Geist Schritt halten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Wenn
  rationale: Bewahrt die konditionale Form des griechischen Satzes. Ein begründendes „Da“ oder „Weil“ wäre im Zusammenhang möglich, würde die Aussage jedoch stärker auslegen.
- source_word: ζῶμεν
  choice: wir … leben
  rationale: Gibt das Präsens von ζάω natürlich wieder; im Zusammenhang ist das vom Geist bewirkte beziehungsweise getragene Leben gemeint.
- source_word: πνεύματι
  choice: durch den Geist / mit dem Geist
  rationale: Beim ersten Vorkommen bringt „durch“ die instrumentale beziehungsweise ursächliche Nuance des Dativs zur Geltung. Beim zweiten entspricht „mit“ der durch στοιχέω ausgedrückten Ausrichtung an einem gemeinsamen Schrittmaß.
- source_word: καὶ
  choice: auch
  rationale: Hebt hervor, dass die Lebensführung der genannten Lebenswirklichkeit entsprechen soll.
- source_word: στοιχῶμεν
  choice: lasst uns … im Gleichschritt … gehen
  rationale: Der hortative Konjunktiv wird mit „lasst uns“ wiedergegeben. στοιχέω bezeichnet das Gehen in einer Reihe beziehungsweise nach einem vorgegebenen Takt; „im Gleichschritt gehen“ erhält diese präzisere Bildsprache.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: der Heilige Geist
  alternative: der menschliche Geist
  rationale: Der unmittelbare Gegensatz zwischen Fleisch und Geist in Galater 5 spricht deutlich für den Heiligen Geist. Die Großschreibung „Geist“ kennzeichnet diese kontextuell begründete Deutung.
- issue: Logische Kraft von εἰ
  choice: 'echte konditionale Form: „Wenn“'
  alternative: 'begründende Wiedergabe: „Da/Weil“'
  rationale: Die Übersetzung bewahrt die grammatische Bedingungsform, ohne damit Zweifel an der Wirklichkeit des Lebens durch den Geist zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Gleichschritt gehen“ macht das Ordnungs- und Schrittmaßbild von στοιχέω deutlicher als das im Deutschen weniger natürliche ethische „wandeln“; die Fußnote hält eine weniger bildhafte Alternative fest.
