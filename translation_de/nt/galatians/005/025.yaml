  source_fidelity: Die Hauptübersetzung gibt die konditionale Satzstruktur, das zweimalige πνεύματι und den hortativen Konjunktiv sachgerecht wieder. „Durch den Geist leben“ und „im Gleichschritt mit dem Geist gehen“ machen die unterschiedlichen, im Kontext naheliegenden Nuancen des Dativs verständlich, ohne den Bezug auf den Heiligen Geist über die Großschreibung hinaus zu überdeuten.
  naturalness: Der Satz ist modernes, würdiges Deutsch. Das eingefügte „dann“ ist zwar nicht sinnverändernd, aber für die knappe griechische Parataxe entbehrlich. Die Fußnotenformulierung „nach dem Geist ausgerichtet gehen“ ist im Deutschen weniger idiomatisch und sollte nicht als wörtliche Alternative bezeichnet werden.
  terminology: „Geist“ ist angesichts des unmittelbaren Kontextes angemessen großgeschrieben. „Im Gleichschritt“ gibt die besondere Bildnuance von στοιχέω gut wieder; die Fußnote kann die mögliche Wiedergabe mit „im Geist“ sowie „Schritt halten“ dokumentieren.
