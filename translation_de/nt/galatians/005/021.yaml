base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: de
  text: 'Neid, Trunkenheit, ausschweifende Feiern[a] und Ähnliches, vor denen ich euch warne, wie ich euch schon früher gewarnt habe: Wer solche Dinge tut, wird das Reich Gottes nicht erben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zügellose Gelage“ bzw. „wilde Feiern“. Das griechische Wort bezeichnet ausgelassenes, maßloses Feiern, häufig in Verbindung mit Alkohol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: Neid
  rationale: Der Plural bezeichnet missgünstiges Verlangen angesichts des Guten, das andere besitzen. Im Deutschen ist der abstrakte Sammelbegriff „Neid“ in einem Lasterkatalog natürlich.
- source_word: μέθαι
  choice: Trunkenheit
  rationale: Bezeichnet Trunkenheit beziehungsweise wiederholte Rauschzustände; „Trunkenheit“ ist klar, würdig und lexikalisch direkt.
- source_word: κῶμοι
  choice: ausschweifende Feiern
  rationale: Das Wort bezeichnet ausgelassene, maßlose Festgelage, oft in Verbindung mit Alkohol. Die Wiedergabe vermeidet die heute zu enge sexuelle Bedeutung von „Orgien“.
- source_word: τὰ ὅμοια τούτοις
  choice: und Ähnliches
  rationale: Gibt die offene Erweiterung des Lasterkatalogs knapp und idiomatisch wieder.
- source_word: ἃ προλέγω ὑμῖν
  choice: Davor warne ich euch
  rationale: προλέγω kann „vorhersagen/vorher sagen“ oder kontextuell „vorwarnen“ bedeuten. Hier trägt das Verb deutlich mahnende Kraft.
- source_word: καθὼς προεῖπον
  choice: wie ich euch schon früher gewarnt habe
  rationale: Nimmt die wiederholte Warnung auf und bewahrt den zeitlichen Rückverweis des Aorists.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: Wer so etwas praktiziert
  rationale: Das substantivierte Präsenspartizip mit πράσσω beschreibt am ehesten charakteristisches beziehungsweise fortgesetztes Handeln; „praktiziert“ bringt dies zum Ausdruck, ohne eine starre Häufigkeitsangabe einzutragen.
- source_word: βασιλείαν θεοῦ
  choice: das Reich Gottes
  rationale: Eingebürgerte und sachlich genaue deutsche Wiedergabe der neutestamentlichen Wendung.
- source_word: οὐ κληρονομήσουσιν
  choice: wird … nicht erben
  rationale: Bewahrt das Bild des Erbens und die zukünftige, eschatologische Aussage.
theological_decisions:
- issue: Bezieht sich die Warnung auf einzelne Verfehlungen oder auf eine kennzeichnende Lebenspraxis?
  choice: „Wer so etwas praktiziert“ als Hinweis auf charakteristisches oder fortgesetztes Verhalten
  alternative: „Wer so etwas tut“ beziehungsweise „wer immer wieder so etwas tut“
  rationale: Das Präsenspartizip πράσσοντες legt eine Praxis nahe. Die Formulierung wahrt den Ernst der Warnung, ohne eine weitergehende Lehraussage über jeden einzelnen Fehltritt in den Text hineinzulesen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die Satzgrenze nach der offenen Listenformel entlastet die im Griechischen dichte Syntax, ohne den Gedankengang zu verändern. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
