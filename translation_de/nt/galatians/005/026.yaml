  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: de
  text: Lasst uns nicht eitel werden, einander herausfordernd und einander beneidend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Lasst uns nicht … werden
  rationale: μή mit dem Konjunktiv Präsens in der ersten Person Plural bildet eine verneinte Aufforderung. „Lasst uns nicht … werden“ bewahrt sowohl den hortativen Charakter als auch die mögliche Bedeutung einer eintretenden Entwicklung.
- source_word: κενόδοξοι
  choice: selbstgefällig
  rationale: κενόδοξος bezeichnet ein Streben nach leerem Ruhm beziehungsweise eine unbegründete Selbstüberschätzung. „Selbstgefällig“ ist im heutigen Deutsch natürlich und bringt die auf das eigene Ansehen gerichtete Haltung zum Ausdruck.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: einander
  rationale: „Einander“ gibt das wechselseitige Verhältnis beider griechischen Reziprokpronomen knapp und idiomatisch wieder.
- source_word: προκαλούμενοι
  choice: herausfordern
  rationale: Das Verb bezeichnet hier ein provozierendes Herausfordern zum Wettstreit. „Herausfordern“ erhält diese Rivalitätskomponente, ohne die Bedeutung auf bloßes Verärgern zu verengen.
- source_word: φθονοῦντες
  choice: beneiden
  rationale: φθονέω bedeutet, gegenüber anderen Neid zu empfinden. „Beneiden“ ist die direkte und geläufige deutsche Entsprechung.
theological_decisions:
- issue: Verhältnis der Partizipien zur Hauptaufforderung
  choice: Die Partizipien werden mit „indem“ als begleitende beziehungsweise konkretisierende Verhaltensweisen an die Warnung vor Selbstgefälligkeit angeschlossen.
  alternative: „Lasst uns nicht selbstgefällig werden, einander herausfordernd und einander beneidend“ oder eine Beiordnung wie „und lasst uns einander nicht herausfordern und beneiden“.
  rationale: Die griechische Konstruktion lässt die genaue logische Beziehung der Partizipien zur Hauptaussage offen. „Indem“ ergibt natürliches Deutsch und stellt einen engen Zusammenhang her, ohne daraus eigenständige Verbote zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bewahrt die parallele Wiederholung von „einander“. Keine Fußnote ist nötig, da „selbstgefällig“ die kontextuelle Bedeutung verständlich wiedergibt.
