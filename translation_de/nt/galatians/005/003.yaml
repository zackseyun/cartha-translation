  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Elemente des griechischen Textes zutreffend wieder: die erneute feierliche Bekräftigung, die distributive Anrede, den Vorgang der Beschneidung sowie die Verpflichtung zum gesamten Gesetz. »Erfüllen« kann bei »Gesetz« im Deutschen jedoch auch den theologisch geprägten Sinn eines abschließenden oder vollendenden Erfüllens nahelegen und bildet ποιῆσαι hier weniger präzise ab als »befolgen« bzw. »halten«.'
  naturalness: »Und ich bezeuge noch einmal jedem Menschen« ist verständlich und im würdevollen Register natürlich. »Das ganze Gesetz zu befolgen« ist modernes Standarddeutsch und im gegebenen Kontext idiomatischer sowie semantisch eindeutiger als »zu erfüllen«.
  terminology: »Gesetz« für νόμος und »verpflichtet« für ὀφειλέτης sind angemessen. Die Formulierung »der sich beschneiden lässt« wahrt den kontextuell naheliegenden Vorgangscharakter von περιτεμνομένῳ, ohne ein Motiv in den Text einzutragen. Die Fußnote zur wörtlichen Bedeutung von ὀφειλέτης bleibt sinnvoll, sollte aber die deutsche wörtliche Wiedergabe grammatisch klarer formulieren.
