base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: de
  text: Und ich bezeuge noch einmal jedem Menschen, der sich beschneiden lässt,[a] dass er verpflichtet ist, das ganze Gesetz zu befolgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der beschnitten wird«. Die griechische Form kann sowohl den Vorgang als auch das Erleiden der Beschneidung ausdrücken; im Zusammenhang geht es um jemanden, der sich ihr unterzieht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »ein Schuldner, das ganze Gesetz zu tun«; gemeint ist, dass er zur Befolgung des ganzen Gesetzes verpflichtet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: ich bezeuge
  rationale: Die Form bezeichnet hier eine nachdrückliche persönliche Bekräftigung. »Ich bezeuge« bewahrt den feierlichen Ton, ohne die Aussage zum bloßen Warnruf umzudeuten.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet die Aussage locker mit dem vorigen Vers; »und« gibt diese Fortführung ohne unnötig starken Gegensatz wieder.
- source_word: πάλιν
  choice: noch einmal
  rationale: Die Wendung bringt Wiederholung beziehungsweise erneute nachdrückliche Bekräftigung natürlich zum Ausdruck.
- source_word: παντὶ ἀνθρώπῳ
  choice: jedem Menschen
  rationale: ἄνθρωπος bezeichnet hier generisch jeden einzelnen Menschen. Das moderne Deutsche gibt diesen Sinn mit »jedem Menschen« präzise wieder.
- source_word: περιτεμνομένῳ
  choice: der sich beschneiden lässt
  rationale: Das Präsenspartizip bezeichnet im Zusammenhang jemanden, der sich der Beschneidung unterzieht. Die Formulierung wahrt den Vorgangscharakter und behauptet kein ausdrücklich genanntes Motiv.
- source_word: ὀφειλέτης ἐστίν
  choice: ist verpflichtet
  rationale: Wörtlich ist die Person ein »Schuldner«; gemeint ist hier, dass sie unter einer umfassenden Verpflichtung steht. Die gewählte Formulierung ist im Deutschen klar und idiomatisch.
- source_word: ὅλον τὸν νόμον
  choice: das ganze Gesetz
  rationale: Die Formulierung erhält die Betonung der Gesamtheit des Gesetzes.
- source_word: ποιῆσαι
  choice: zu erfüllen
  rationale: ποιέω bedeutet wörtlich »tun«. In Verbindung mit dem Gesetz bezeichnet es dessen vollständige Befolgung; »erfüllen« ist hier natürlich, lässt aber den umfassenden Anspruch bestehen.
theological_decisions:
- issue: Reichweite der Aussage über Beschneidung und Verpflichtung gegenüber dem Gesetz
  choice: Die Aussage richtet sich im Zusammenhang an jeden, der sich der Beschneidung unterzieht, und erklärt ihn für verpflichtet, das ganze Gesetz zu erfüllen.
  alternative: Sie könnte allgemein auf jeden bereits beschnittenen Mann bezogen werden, einschließlich der als Kinder beschnittenen Juden.
  rationale: Das Partizip περιτεμνομένῳ steht im Zusammenhang mit Galater 5,2 und der erwogenen Beschneidung. »Der sich beschneiden lässt« gibt diese kontextuelle Stoßrichtung wieder, ohne einen im griechischen Satz nicht ausdrücklich genannten Beweggrund hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die distributive Einzahl und der feierlich-nachdrückliche Ton bleiben erhalten; schwer verständliche Wörtlichkeit wird in den Fußnoten transparent gemacht.
