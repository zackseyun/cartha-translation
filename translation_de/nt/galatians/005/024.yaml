  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: de
  text: Diejenigen aber, die dem Messias[a] gehören, haben das Fleisch[b] samt seinen Leidenschaften und Begierden gekreuzigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Christus«.'
    reason: alternative_reading
  - marker: b
    text: Das »Fleisch« bezeichnet hier die gefallene menschliche Natur im Gegensatz zum Geist; manche Übersetzungen geben den Ausdruck mit »die sündige Natur« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: Die aber dem Messias gehören
  rationale: Die substantivierte Genitivkonstruktion bezeichnet Menschen, die dem Messias zugehören. »Dem Messias gehören« ist im Deutschen natürlich und bewahrt den relationalen Sinn; δέ wird durch das zurückhaltend kontrastierende »aber« wiedergegeben.
- source_word: σάρκα
  choice: das Fleisch
  rationale: σάρξ bezeichnet hier im paulinischen Gegensatz zum Geist die von der Sünde geprägte menschliche Natur. »Fleisch« bewahrt jedoch bewusst den theologischen Begriff und dessen Spannung, statt ihn im Haupttext deutend aufzulösen.
- source_word: ἐσταύρωσαν
  choice: haben … gekreuzigt
  rationale: Das deutsche Perfekt gibt die entschiedene vergangene Handlung mit ihrer fortdauernden Bedeutung natürlich wieder. »Gekreuzigt« erhält den ausdrücklichen Bezug auf das Kreuz.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: samt seinen Leidenschaften und Begierden
  rationale: »Samt« drückt die durch σύν bezeichnete Verbindung knapp und würdig aus. πάθημα meint in diesem ethischen Zusammenhang Leidenschaften beziehungsweise innere Regungen, nicht Leiden; ἐπιθυμία bezeichnet starke, hier negativ verstandene Begierden.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός kann hier als messianischer Titel verstanden werden; »Messias« macht diesen Titelcharakter sichtbar. Da die Verwendung zugleich namensähnlich aufgefasst werden kann, wird »Christus« als Alternative in einer Fußnote genannt.
- issue: Wiedergabe von σάρξ im ethischen Gegensatz zum Geist
  choice: Fleisch
  alternative: sündige Natur
  rationale: »Fleisch« erhält Paulus’ Bildsprache und die theologische Spannung des Ausdrucks. Die stärker deutende Wiedergabe »sündige Natur« wird nicht in den Haupttext aufgenommen, sondern in der Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Wortstellung hält den milden Kontrast von δέ fest, ohne ihn zu überbetonen; »samt« vermeidet eine schwerfällige Wiederholung und bezieht Leidenschaften und Begierden klar auf das Fleisch.
