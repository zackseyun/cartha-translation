source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: de
  text: Denn in Christus Jesus[a] zählt weder Beschneidung noch Unbeschnittensein etwas, sondern Glaube[b], der durch Liebe wirksam ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Messias Jesus“. Das griechische Χριστός bedeutet als Titel „Messias“ beziehungsweise „Gesalbter“.'
    reason: alternative_reading
  - marker: b
    text: Das griechische πίστις kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „der sich durch Liebe auswirkt“, „der durch Liebe tätig ist“ oder „der durch Liebe wirksam gemacht wird“. Die griechische Form lässt eine mittlere oder passive Nuance zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: Die Präposition „in“ bewahrt die paulinische Rede von der Verbundenheit mit Christus. „Christus Jesus“ gibt die feste griechische Wortfolge würdig und im Deutschen geläufig wieder; der Titelcharakter von Χριστός wird in der Fußnote erläutert.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet beziehungsweise erläutert die vorausgehende Aussage; „Denn“ ist dafür der knappe, natürliche deutsche Anschluss.
- source_word: περιτομή
  choice: Beschneidung
  rationale: Die übliche deutsche Entsprechung bewahrt sowohl den wörtlichen Sinn als auch die Funktion als Bundes- und Identitätsmerkmal.
- source_word: τι ἰσχύει
  choice: kommt es … an
  rationale: Die Wendung bezeichnet hier Bedeutung oder maßgebliches Gewicht, nicht bloß körperliche Kraft. Die deutsche Konstruktion „auf etwas kommt es an“ gibt dies idiomatisch wieder und lässt sich parallel auf beide Statusbezeichnungen und auf den Glauben beziehen.
- source_word: ἀκροβυστία
  choice: Unbeschnittensein
  rationale: Die substantivierte Form wahrt den parallelen Gegensatz zu „Beschneidung“ und bezeichnet den entsprechenden Status, ohne Personen abwertend zu benennen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten Gegenüberstellung ist „sondern“ im Deutschen die präzise und natürliche Kontrastpartikel.
- source_word: πίστις
  choice: Glauben
  rationale: „Glauben“ ist hier wegen der von „auf“ verlangten Kasusform gewählt und entspricht dem üblichen Sinn von πίστις; die möglichen Nuancen „Vertrauen“ und „Treue“ bleiben in einer Fußnote sichtbar.
- source_word: δι’ ἀγάπης
  choice: durch Liebe
  rationale: διά mit Genitiv bezeichnet hier das Mittel beziehungsweise den Wirkungsraum. „Durch Liebe“ bewahrt diese Beziehung, ohne sie enger kausal auszudeuten.
- source_word: ἐνεργουμένη
  choice: wirksam ist
  rationale: Die Form bezeichnet Glauben als tätig oder wirksam. Die Übersetzung bleibt nahe am verbalen Sinn und legt die formal mögliche mittlere beziehungsweise passive Nuance nicht endgültig fest; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: „Christus Jesus“ ist im modernen deutschen Bibel- und Allgemeingebrauch eine geläufige, würdevolle Wiedergabe der festen paulinischen Formel. Da Χριστός seinem Sinn nach ein Titel ist, wird „Messias“ ausdrücklich als Alternative erläutert.
- issue: Bedeutungsumfang von πίστις
  choice: Glaube
  alternative: Vertrauen oder Treue
  rationale: Der Haupttext verwendet die breite, traditionelle und kontextuell passende Entsprechung „Glaube“. Die lexikalisch möglichen Nuancen werden nicht ausgeschlossen, sondern in der Fußnote bewahrt.
- issue: Diathese von ἐνεργουμένη
  choice: der durch Liebe wirksam ist
  alternative: der sich durch Liebe auswirkt; der durch Liebe wirksam gemacht wird
  rationale: Das griechische Partizip kann in diesem Zusammenhang mittel oder passiv verstanden werden. Der Haupttext gibt die Wirksamkeit des Glaubens wieder, ohne den theologischen Zusammenhang von Glaube und Liebe auf eine einzige Diathese festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Konstruktion „auf etwas kommt es an“ ist idiomatisch und bildet den griechischen Gegensatz klar ab. Fachsprachliche oder konfessionell geprägte Zusätze wurden vermieden.
