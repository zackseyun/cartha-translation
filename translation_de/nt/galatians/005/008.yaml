  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: de
  text: Diese Überredung kommt nicht von dem, der euch ruft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser Einfluss kommt nicht von dem, der euch ruft.“'
    reason: Lexikalische Alternative für πεισμονή, das sowohl den Vorgang beziehungsweise die Wirkung des Überredens als auch den daraus entstehenden Einfluss bezeichnen kann.
lexical_decisions:
- source_word: πεισμονὴ
  choice: Überredung
  rationale: Das seltene Substantiv bezeichnet das Überreden beziehungsweise dessen Wirkung. „Überredung“ bewahrt die abstrakte Form und passt dazu, dass die Galater sich von einer fremden Botschaft beeinflussen lassen.
- source_word: ἐκ
  choice: kommt von
  rationale: ἐκ bezeichnet hier Ursprung oder Herkunft. Die idiomatische Formulierung „kommt von“ gibt diesen Sinn im Deutschen klar wieder.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: dem, der euch ruft
  rationale: Das substantivierte Präsenspartizip wird als Relativsatz wiedergegeben. So bleibt der fortdauernde verbale Charakter erhalten, ohne den Gemeinten ausdrücklich als Gott zu benennen.
- source_word: οὐκ
  choice: nicht
  rationale: Die direkte Verneinung bewahrt die klare Zurückweisung durch Paulus.
theological_decisions:
- issue: Identität dessen, „der euch ruft“
  choice: Die partizipiale Umschreibung wird als „dem, der euch ruft“ beibehalten.
  alternative: „Gott, der euch ruft“
  rationale: Der Zusammenhang legt Gott als Bezug nahe, doch der griechische Text nennt ihn hier nicht ausdrücklich. Die Übersetzung bewahrt daher die Formulierung und lässt den Bezug aus dem Kontext erschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Überredung“ ist bewusst etwas markiert, da auch das griechische πεισμονή selten ist; die Fußnote bietet die natürlichere kontextuelle Alternative „Einfluss“.
