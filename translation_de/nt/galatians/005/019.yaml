source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: de
  text: 'Die Werke des Fleisches[a] aber sind offenkundig: sexuelle Unmoral, Unreinheit, Zügellosigkeit,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der sündigen menschlichen Natur. Das griechische Wort bedeutet wörtlich „Fleisch“; Paulus gebraucht es hier bildlich für die von sündigen Begierden bestimmte menschliche Ausrichtung.'
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: offenkundig
  rationale: Das Adjektiv bezeichnet etwas klar Erkennbares oder offen Zutagetretendes. „Offenkundig“ ist in modernem Deutsch verständlich und bewahrt den nachdrücklichen Sinn.
- source_word: δέ
  choice: aber
  rationale: δέ markiert hier einen leichten Übergang mit kontrastierendem Bezug auf den vorangehenden Gegensatz zwischen Fleisch und Geist. Das nachgestellte „aber“ gibt diese Funktion wieder, ohne den Kontrast zu überzeichnen.
- source_word: τὰ ἔργα
  choice: die Werke
  rationale: „Werke“ bewahrt die paulinische Ausdrucksweise und den unmittelbaren Kontrast zwischen den „Werken des Fleisches“ und der „Frucht des Geistes“.
- source_word: τῆς σαρκός
  choice: des Fleisches
  rationale: Die wörtliche Metapher bleibt erhalten, damit der theologisch gewichtige Gegensatz von Fleisch und Geist nicht auf eine einzige Deutung verengt wird. Eine erklärende Alternative steht in der Fußnote.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Der Doppelpunkt leitet die folgende Aufzählung im Deutschen natürlich ein und gibt die erläuternde Funktion des griechischen Relativsatzes knapp wieder.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: πορνεία bezeichnet in diesem Zusammenhang unerlaubtes sexuelles Verhalten in einem breiten Sinn. „Sexuelle Unmoral“ ist gegenwärtig, verständlich und weniger verengt als „Unzucht“.
- source_word: ἀκαθαρσία
  choice: Unreinheit
  rationale: Der Ausdruck bezeichnet hier sittliche, besonders sexuelle Unreinheit. „Unreinheit“ erhält die Bildsprache und ist im Deutschen geläufig.
- source_word: ἀσέλγεια
  choice: Zügellosigkeit
  rationale: Das Wort bezeichnet schamlose, hemmungslose Selbsthingabe an Begierden, häufig mit sexuellem Bezug. „Zügellosigkeit“ wahrt diese Breite besser als eine ausschließlich sexuelle Formulierung.
theological_decisions:
- issue: Wiedergabe von σάρξ im paulinischen ethischen Zusammenhang
  choice: Fleisch
  alternative: sündige menschliche Natur
  rationale: „Fleisch“ bewahrt Paulus’ Metapher und die Spannung im Gegensatz zum Geist. „Sündige menschliche Natur“ erläutert eine mögliche Bedeutung, legt den Ausdruck jedoch stärker aus und wird deshalb nur als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung mit nachgestelltem „aber“ wirkt natürlich und lässt den milden Übergang erkennen. Der Vers endet mit einem Komma, da die Aufzählung im folgenden Vers weitergeht.
