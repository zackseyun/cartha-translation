  source_fidelity: Die Übersetzung gibt φανερὰ ... τὰ ἔργα τῆς σαρκός präzise als „Die Werke des Fleisches ... sind offenkundig“ wieder. Das nachgestellte „aber“ bildet δέ als milden Übergang beziehungsweise Kontrast angemessen ab. Der Doppelpunkt gibt die erläuternd-aufzählende Funktion von ἅτινά ἐστιν idiomatisch wieder. Die drei aufgeführten Begriffe sind semantisch treffend; das abschließende Komma bewahrt die fortlaufende Aufzählung.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Die Werke des Fleisches aber sind offenkundig“ ist eine natürliche, leicht gehobene Satzstellung und passt zum Register des Paulus.
  terminology: „Fleisch“ erhält die paulinische Metapher und den Zusammenhang mit dem folgenden Gegensatz zum Geist. „Sexuelle Unmoral“, „Unreinheit“ und „Zügellosigkeit“ sind sachgerecht und vermeiden sowohl unnötige Verengung als auch veraltete Ausdrucksweise. Die Fußnote kennzeichnet „sündige menschliche Natur“ klar als erläuternde Alternative, nicht als Ersatz im Haupttext.
