source:
  edition: SBLGNT
  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: de
  text: Denn wir erwarten durch den Geist und aus Glauben sehnsüchtig die Hoffnung der Gerechtigkeit.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Geist“. Der Dativ kann das Mittel oder den Wirkungsbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus Glauben“; πίστις kann je nach Zusammenhang auch „Vertrauen“ oder „Treue“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „Hoffnung der Gerechtigkeit“ kann auch im Sinn von „die erhoffte Gerechtigkeit“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Zusammenhang einen gewissen Nachdruck; „wir“ gibt dies im Deutschen natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und wahrt den argumentativen Zusammenhang.
- source_word: πνεύματι
  choice: durch den Geist
  rationale: Der Dativ kann Mittel oder Wirkungsbereich bezeichnen. Im Kontext von Galater 5 ist sehr wahrscheinlich der Heilige Geist gemeint; „durch den Geist“ gibt die instrumentale Lesart natürlich wieder.
- source_word: ἐκ πίστεως
  choice: aus Glauben
  rationale: ἐκ bezeichnet Herkunft oder Grundlage. Die bewusst knappe Wendung bewahrt die Präposition und lässt die paulinische Spannung des Begriffs πίστις bestehen.
- source_word: ἐλπίδα
  choice: die Hoffnung
  rationale: Als Objekt von ἀπεκδεχόμεθα wird das artikellose Substantiv in dieser deutschen Genitivverbindung idiomatisch mit Artikel wiedergegeben.
- source_word: δικαιοσύνης
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ ist hier die übliche und kontextuell passende Wiedergabe; die Genitivverbindung bleibt wie im Griechischen deutungsoffen.
- source_word: ἀπεκδεχόμεθα
  choice: erwarten sehnsüchtig
  rationale: Das Verb bezeichnet ein ausdauerndes, gespanntes Erwarten. Die Formulierung bringt den verstärkten Erwartungscharakter zum Ausdruck.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: der Heilige Geist
  alternative: der menschliche Geist; im Geist als Wirkungsbereich
  rationale: Der unmittelbare Gegensatz von Geist, Fleisch und Gesetz in Galater 5 spricht deutlich für den Heiligen Geist. Die instrumentale und die lokale beziehungsweise sphärische Funktion des Dativs bleiben jedoch beide grammatisch möglich.
- issue: Sinn von ἐλπίδα δικαιοσύνης
  choice: die Hoffnung der Gerechtigkeit
  alternative: die erhoffte Gerechtigkeit; die von Gerechtigkeit hervorgebrachte Hoffnung
  rationale: Die enge Genitivkonstruktion erhält die Ambiguität des Griechischen und legt nicht fest, ob Gerechtigkeit selbst der erhoffte endzeitliche Inhalt oder anders auf die Hoffnung bezogen ist.
- issue: Sinn von πίστις
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: „Glaube“ ist im Zusammenhang die naheliegende Wiedergabe, ohne andere mögliche Nuancen des griechischen Begriffs grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Verbindung „aus Glauben“ wahrt die Kraft von ἐκ; die Genitivformulierung erhält die theologische Offenheit des Ausgangstextes.
