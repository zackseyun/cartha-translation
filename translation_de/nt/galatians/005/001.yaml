  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: de
  text: Zur Freiheit hat uns der Messias befreit.[a] Steht also fest und lasst euch nicht wieder ein Joch der Sklaverei auferlegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In der Freiheit hat uns der Messias befreit.“ Die knappe Dativformulierung am Satzanfang lässt mehrere eng verwandte Deutungen zu.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „unterwerft euch nicht wieder einem Joch der Sklaverei“ oder „lasst euch nicht wieder von einem Joch der Sklaverei festhalten“. Das griechische Verb kann ausdrücken, dass jemand einer Sache unterworfen oder von ihr gebunden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Zur Freiheit
  rationale: Der vorangestellte Dativ kann Zweck oder Ergebnis ausdrücken. „Zur Freiheit“ wahrt die knappe, betonte Formulierung und das Wortspiel mit „befreit“.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Χριστός wird hier als bedeutungstragender Titel wiedergegeben. „Der Messias“ bewahrt den jüdisch-messianischen Bezug und ist im Deutschen idiomatisch.
- source_word: ἠλευθέρωσεν
  choice: hat … befreit
  rationale: Das Verb bezeichnet das Freimachen. „Befreit“ bildet zusammen mit „Freiheit“ die Wortverwandtschaft des griechischen Ausdrucks nach.
- source_word: στήκετε
  choice: Steht … fest
  rationale: Der Präsensimperativ fordert zu anhaltender Standhaftigkeit auf. „Feststehen“ ist gegenwärtiges, klares Deutsch mit entsprechender Bildkraft.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet die Folgerung aus der vorausgehenden Aussage; „also“ gibt diesen Zusammenhang natürlich und deutlich wieder.
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet die Rückkehr in einen früheren Zustand.
- source_word: ζυγῷ δουλείας
  choice: unter ein Joch der Sklaverei
  rationale: „Joch“ erhält das konkrete Bild der Unterwerfung; „Sklaverei“ gibt die Härte von δουλεία deutlicher wieder als das abstraktere „Knechtschaft“.
- source_word: ἐνέχεσθε
  choice: lasst euch … bringen
  rationale: In Verbindung mit „unter ein Joch“ drückt die Form verständlich aus, dass man erneut dessen bindender Herrschaft unterworfen wird, ohne ausschließlich freiwillige Unterwerfung zu unterstellen.
theological_decisions:
- issue: Χριστός als Titel oder eingebürgerte Namensform
  choice: der Messias
  alternative: Christus
  rationale: Die Übersetzung als Titel macht die Bedeutung von Χριστός sichtbar und bewahrt den messianischen Zusammenhang, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
- issue: Stärke der Wiedergabe von δουλεία
  choice: Sklaverei
  alternative: Knechtschaft
  rationale: Der Vers stellt Freiheit ihrem schärfsten Gegenbegriff gegenüber. „Sklaverei“ bewahrt das Gewicht des griechischen Ausdrucks.
- issue: Art der erneuten Unterwerfung in ἐνέχεσθε
  choice: lasst euch nicht wieder unter … bringen
  alternative: unterwerft euch nicht wieder
  rationale: Die gewählte Formulierung lässt offen, ob vor allem eigenes Nachgeben oder ein von außen ausgehender Zwang im Blick ist, und wahrt so die Spannung der medial-passiven Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Verbindung von „Freiheit“ und „befreit“ sowie das Bild des Jochs bleiben erhalten; die Imperative sind unmittelbar und allgemein verständlich.
