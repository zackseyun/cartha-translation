id: GAL.5.18
reference: Galatians 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: de
  text: Wenn ihr aber vom Geist geführt werdet,[a] steht ihr nicht unter dem Gesetz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn ihr fortwährend vom Geist geführt werdet«.'
    reason: Das griechische Präsens Passiv kann den andauernden Vorgang des Geführtwerdens stärker hervortreten lassen.
  - marker: b
    text: '»Unter dem Gesetz« bedeutet hier: unter seiner Autorität oder seinem Herrschaftsbereich; vergleiche Galater 5,23.'
    reason: Erläutert die räumlich-rechtliche Metapher und nennt den sachlich nahen Querverweis.
lexical_decisions:
- source_word: εἰ
  choice: wenn
  rationale: Leitet einen real formulierten Bedingungssatz ein; »wenn« gibt die Aussage natürlich und ohne zusätzliche Festlegung wieder.
- source_word: δὲ
  choice: aber
  rationale: Markiert den milden Gegensatz zur Herrschaft des Fleisches im unmittelbaren Zusammenhang.
- source_word: πνεύματι
  choice: vom Geist
  rationale: Der Dativ bezeichnet hier den Handelnden beim passivischen Verb. Im Kontext von Galater 5 ist Gottes Geist gemeint; die Großschreibung macht diesen Bezug im Deutschen deutlich.
- source_word: ἄγεσθε
  choice: euch führen lasst
  rationale: Gibt das Präsens Passiv idiomatisch wieder und bewahrt, anders als »folgt«, die führende Initiative des Geistes. Die Verlaufsbedeutung bleibt als Fußnotenalternative sichtbar.
- source_word: οὐκ ἐστὲ
  choice: steht ihr nicht
  rationale: Mit »unter dem Gesetz stehen« ergibt sich im Deutschen eine natürliche Wiedergabe der negierten Kopulakonstruktion.
- source_word: ὑπὸ νόμον
  choice: unter dem Gesetz
  rationale: Bewahrt die paulinische räumlich-rechtliche Metapher einer Unterstellung unter das Gesetz, ohne sie im Haupttext lehrhaft auszudeuten.
theological_decisions:
- issue: Bezug von πνεύματι
  choice: Gottes Geist, wiedergegeben als »Geist«
  alternative: der menschliche Geist
  rationale: Der unmittelbare Abschnitt Galater 5,16–25 stellt das Fleisch dem Geist als göttlich wirkender Kraft und handelndem Gegenüber entgegen. Der Text wird nicht über die kontextuell begründete Identifikation hinaus erweitert.
- issue: Sinn von ὑπὸ νόμον
  choice: nicht unter der Autorität beziehungsweise dem Herrschaftsbereich des Gesetzes
  alternative: nicht unter Gesetz im allgemeinen Sinn
  rationale: In Galater bezeichnet die Wendung das Gesetz als bestimmenden Herrschaftsbereich. Die knappe Formulierung des Ausgangstextes bleibt im Haupttext erhalten; die Fußnote erläutert die Metapher zurückhaltend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sich führen lassen« ist allgemein verständlich und idiomatisch; die Satzstellung bewahrt den Gegensatz und die knappe Aussageform des griechischen Textes.
