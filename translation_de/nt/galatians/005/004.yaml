base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: de
  text: Ihr, die ihr durch das Gesetz gerechtfertigt werden wollt, seid von Christus getrennt worden[a]; ihr seid aus der Gnade gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formnäher: „Ihr, die ihr im Gesetz gerechtfertigt werdet, seid von Christus getrennt worden.“ Im Zusammenhang sind diejenigen gemeint, die ihre Rechtfertigung im Gesetz suchen. Statt „getrennt worden“ kann auch „von Christus losgelöst“ oder „von Christus abgeschnitten“ übersetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: seid … getrennt worden
  rationale: Mit ἀπὸ Χριστοῦ bezeichnet das Passiv hier eine Trennung von Christus. Die Formulierung bewahrt die scharfe relationale Aussage, ohne durch „abgeschnitten“ die mögliche Endgültigkeit zusätzlich zu verstärken.
- source_word: ἀπὸ Χριστοῦ
  choice: von Christus
  rationale: ἀπό bezeichnet die Trennung. Im Deutschen ist „Christus“ die natürliche und zugleich titelhaltige Wiedergabe von Χριστός; „vom Messias“ wäre ebenfalls möglich, wirkt hier jedoch markierter.
- source_word: οἵτινες
  choice: Ihr, die ihr
  rationale: Die Formulierung kennzeichnet direkt die angesprochene Gruppe innerhalb der galatischen Gemeinden und gibt den Bezug zur zweiten Person natürlich wieder.
- source_word: ἐν νόμῳ
  choice: durch das Gesetz
  rationale: Die Präpositionalphrase bezeichnet hier die Grundlage beziehungsweise das Mittel der angestrebten Rechtfertigung. Im paulinischen Zusammenhang ist „das Gesetz“ im Deutschen klarer und idiomatischer als das artikellose „Gesetz“.
- source_word: δικαιοῦσθε
  choice: gerechtfertigt werden wollt
  rationale: Das griechische Präsens Passiv lautet formal „gerechtfertigt werdet“. Im Zusammenhang bezeichnet Paulus jedoch Menschen, die ihre Rechtfertigung im Gesetz suchen beziehungsweise darauf gründen wollen. Die Wiedergabe macht diesen argumentativen Sinn verständlich, ohne zu behaupten, das Gesetz rechtfertige sie tatsächlich.
- source_word: τῆς χάριτος
  choice: aus der Gnade
  rationale: Der Genitiv bei ἐκπίπτω bezeichnet das, woraus jemand herausfällt. „Aus der Gnade fallen“ ist im Deutschen idiomatisch und erhält das Bild.
- source_word: ἐξεπέσατε
  choice: ihr seid … gefallen
  rationale: Der Aorist wird als eingetretenes, ernstes Ergebnis wiedergegeben. Zusammen mit „aus der Gnade“ bleibt die starke Bildsprache des griechischen Textes erhalten.
theological_decisions:
- issue: Ob die Aussage lehrsystematisch als endgültiger Verlust des Heils oder lediglich als Abkehr vom Grundsatz der Gnade festgelegt werden soll
  choice: 'Die direkte Warnung bleibt stehen: „seid von Christus getrennt worden; ihr seid aus der Gnade gefallen“.'
  alternative: Abschwächend „Christus ist für euch wirkungslos geworden“ oder deutend „ihr habt den Weg der Gnade verlassen“.
  rationale: Der griechische Text spricht scharf von Trennung und Herausfallen, erläutert in diesem Vers aber nicht abschließend deren dogmatische Reichweite. Die Übersetzung bewahrt diese Spannung.
- issue: Ob δικαιοῦσθε als tatsächlich stattfindende Rechtfertigung durch das Gesetz verstanden werden soll
  choice: „gerechtfertigt werden wollt“
  alternative: „durch das Gesetz gerechtfertigt werdet“
  rationale: Die formalere Alternative könnte auf Deutsch wie eine Bestätigung wirken, dass Rechtfertigung durch das Gesetz tatsächlich gelingt, was dem unmittelbaren Argument widerspricht. Die gewählte Form gibt das Bestreben der Angesprochenen wieder; die formale Möglichkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Ihr, die ihr“ erhält die direkte Anrede. „Gerechtfertigt“ bewahrt den zentralen paulinischen Rechts- und Beziehungsbegriff; die Fußnote dokumentiert die formalere Fassung und die wichtigsten Bedeutungsalternativen.
