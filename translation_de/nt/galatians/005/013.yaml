reference: Galatians 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: de
  text: Denn ihr wurdet zur Freiheit berufen, Brüder und Schwestern[a]. Nur benutzt die Freiheit nicht als Gelegenheit für das Fleisch[b][c], sondern dient einander durch die Liebe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort ist grammatisch die Mehrzahl von „Bruder“, bezeichnet in dieser Anrede jedoch die ganze Glaubensgemeinschaft, Frauen eingeschlossen. Wörtlich: „Brüder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Benutzt die Freiheit nicht als Ausgangspunkt für das Fleisch“. Das griechische Wort kann eine Gelegenheit, einen Anlass oder eine Ausgangsbasis bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „Das Fleisch“ meint hier nicht nur den menschlichen Körper, sondern den Menschen in seiner von Sünde geprägten, selbstbezogenen Ausrichtung. Manche Übersetzungen geben den Ausdruck mit „die sündige Natur“ wieder.
    reason: alternative_reading
  - marker: d
    text: Das mit „dient“ wiedergegebene Verb gehört zur Wortfamilie von „Sklave“ und bezeichnet eigentlich den Dienst eines Sklaven. Dadurch entsteht ein bewusster Gegensatz zur zuvor genannten Freiheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς γὰρ
  choice: Denn ihr
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine leichte Betonung; „Denn ihr“ bewahrt zugleich den erklärenden Anschluss von γάρ an den vorausgehenden Gedankengang.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: zur Freiheit
  rationale: Die Wendung bezeichnet hier Ziel beziehungsweise Bestimmung der Berufung. „Zur Freiheit“ ist im Deutschen natürlich und hält diese Zielrichtung offen.
- source_word: ἐκλήθητε
  choice: seid ... berufen
  rationale: Das Passiv von καλέω bezeichnet bei Paulus häufig Gottes Berufung. Das Perfekt „seid berufen“ gibt im Deutschen den vergangenen Ruf mit seiner fortdauernden Geltung idiomatisch wieder, ohne ein bestimmtes theologisches System vorauszusetzen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die grammatisch maskuline Pluralform dient hier als Anrede der gesamten glaubenden Gemeinschaft. „Brüder und Schwestern“ macht den im Kontext eingeschlossenen Personenkreis im heutigen Deutsch eindeutig; die Form des griechischen Ausdrucks wird in einer Fußnote dokumentiert.
- source_word: μόνον
  choice: Nur
  rationale: Das Wort leitet eine nachdrückliche Einschränkung der zuvor ausgesprochenen Freiheit ein.
- source_word: μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί
  choice: macht die Freiheit nicht zu einer Gelegenheit für das Fleisch
  rationale: Im Griechischen ist das zu ergänzende Verb ausgelassen. Die deutsche Formulierung ergänzt „macht“ und bewahrt ἀφορμή als „Gelegenheit“, ohne den bildhaften Ausdruck „Fleisch“ im Haupttext auszudeuten.
- source_word: σάρξ
  choice: das Fleisch
  rationale: Der theologisch vielschichtige paulinische Begriff meint hier nicht bloß den Körper, sondern den Menschen in seiner von Sünde bestimmten Ausrichtung. „Fleisch“ erhält die Bildsprache und ihre Spannung; eine Fußnote erläutert den Kontext.
- source_word: διὰ τῆς ἀγάπης
  choice: durch die Liebe
  rationale: '„Durch“ bewahrt den instrumentalen Sinn von διά mit dem Genitiv: Die Liebe ist das Mittel beziehungsweise die wirksame Weise des gegenseitigen Dienens.'
- source_word: δουλεύετε
  choice: dient
  rationale: Das Verb bezeichnet Dienst in der Stellung eines Sklaven. „Dient“ ist im deutschen Mahnsatz natürlich; die stärkere Sklavendienst-Metaphorik wird in einer Fußnote kenntlich gemacht.
- source_word: ἀλλήλοις
  choice: einander
  rationale: „Einander“ gibt das reziproke Verhältnis knapp und idiomatisch wieder.
theological_decisions:
- issue: Inklusive Bedeutung der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder; Geschwister
  rationale: Obwohl die griechische Form grammatisch maskulin ist, richtet sich die Anrede im Briefkontext an die gesamte Gemeinde einschließlich der Frauen. Die gewählte Form wahrt im modernen Deutsch sowohl das familiäre Bild als auch den tatsächlichen Adressatenkreis; die formale Besonderheit wird nicht verschwiegen, sondern in der Fußnote genannt.
- issue: Bedeutung von σάρξ im ethischen Zusammenhang
  choice: das Fleisch
  alternative: die sündige Natur; selbstbezogene sündige Begierden
  rationale: Paulus verwendet einen bildhaften und theologisch gespannten Begriff, der weder auf den physischen Körper beschränkt noch vollständig mit einer abstrakten „Natur“ gleichgesetzt werden sollte. Der Haupttext bewahrt den Ausdruck, die Fußnote erläutert seine kontextuelle Reichweite.
- issue: Stärke der Sklavendienst-Metaphorik in δουλεύετε
  choice: dient einander
  alternative: macht euch zu Sklaven füreinander
  rationale: Der unmittelbare Gegensatz zwischen Freiheit und δουλεύειν ist rhetorisch bedeutsam. Im Haupttext vermeidet „dient“ eine im Deutschen leicht missverständliche wörtliche Formulierung; die Fußnote erhält ausdrücklich den Zusammenhang mit Sklavendienst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Satzführung. Die paulinischen Schlüsselbegriffe „Freiheit“, „Fleisch“, „Liebe“ und „dienen“ bleiben sichtbar. Die leicht ungewohnte Wendung „durch die Liebe“ wurde beibehalten, um den instrumentalen Charakter des griechischen Ausdrucks nicht in ein bloßes „liebevoll“ aufzulösen.
