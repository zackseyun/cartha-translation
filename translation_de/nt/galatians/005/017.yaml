id: GAL.5.17
reference: Galatians 5:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: de
  text: Denn das Fleisch begehrt gegen den Geist auf, der Geist aber gegen das Fleisch; denn diese stehen einander entgegen, sodass ihr nicht das tut, was ihr wollt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὰρξ
  choice: das Fleisch
  rationale: Bewahrt die paulinische Metapher und verengt den ethischen Sinn nicht vorschnell auf die deutende Umschreibung „sündige Natur“.
- source_word: ἐπιθυμεῖ κατὰ
  choice: begehrt gegen … auf
  rationale: Gibt sowohl das starke Verlangen als auch die feindliche Ausrichtung von κατά mit Genitiv in natürlichem Deutsch wieder.
- source_word: πνεῦμα
  choice: der Geist
  rationale: Der Zusammenhang von Galater 5 spricht wahrscheinlich vom Heiligen Geist; die mögliche Deutung als menschlicher Geist wird in der Fußnote offengehalten.
- source_word: ἀλλήλοις ἀντίκειται
  choice: stehen einander entgegen
  rationale: Drückt die wechselseitige Gegnerschaft knapp und idiomatisch aus.
- source_word: ἵνα μὴ
  choice: sodass … nicht
  rationale: Lässt die im Kontext mögliche Zweck- beziehungsweise Folgewirkung der griechischen Konstruktion angemessen offen.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: ihr nicht das tut, was ihr wollt
  rationale: Gibt die indefinite Relativkonstruktion verständlich wieder, ohne dem schlichten ποιεῖν eine zusätzliche Bedeutungsnuance zu geben.
theological_decisions:
- issue: Bedeutung von σάρξ im ethischen Kontext des Paulus
  choice: Im Haupttext steht „Fleisch“.
  alternative: „sündige Natur“
  rationale: „Fleisch“ erhält die theologische Bildsprache und die Spannung des Textes; die Alternative erklärt den hier wahrscheinlichen ethischen Sinn, ist aber bereits stärker auslegend.
- issue: Bezug von πνεῦμα
  choice: „Geist“ als wahrscheinlicher Bezug auf den Heiligen Geist
  alternative: der menschliche Geist
  rationale: Der unmittelbare Zusammenhang stellt das Fleisch dem Wirken und der Führung des Geistes gegenüber. Da das griechische πνεῦμα selbst nicht zwischen Groß- und Kleinschreibung unterscheidet, wird die andere Deutung in der Fußnote genannt.
- issue: Nuance von ἵνα μή
  choice: „sodass … nicht“
  alternative: „damit … nicht“
  rationale: Die Formulierung gibt vor allem die praktische Folge des gegenseitigen Widerstreits wieder, ohne eine ausdrückliche Absicht als einzige Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Fleisch“ bleibt als prägende paulinische Metapher erhalten; „begehrt gegen … auf“ macht die gegnerische Ausrichtung verständlich. Der Satzbau folgt der Parallelität des griechischen Textes, ohne unnatürlich wörtlich zu wirken.
