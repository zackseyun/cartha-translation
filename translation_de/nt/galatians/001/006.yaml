  verdict: revise
  source_fidelity: Die Grundstruktur gibt die gegenwärtige Abkehr (μετατίθεσθε) sowohl von dem Berufenden als auch hin zu einem anderen εὐαγγέλιον zutreffend wieder. „Andersartige“ legt jedoch einen spezifisch qualitativen Sinn von ἕτερον stärker fest, als der Wortlaut hier allein erfordert. Außerdem ist „Evangelium“ im heutigen deutschen Bibelregister die angemessene und transparente Entsprechung von εὐαγγέλιον.
  naturalness: Die Satzführung mit „sich von ... abwenden und sich ... zuwenden“ ist natürliches modernes Standarddeutsch. „Evangelium“ ist hier idiomatischer und registergerechter als „gute Botschaft“.
  terminology: „Messias“ wahrt den Titelcharakter von Χριστός. „Evangelium“ erhält den im christlichen Sprachgebrauch etablierten theologischen Terminus und greift der Qualifikation in Vers 7 nicht vor. Die Umschreibung „der euch ... berufen hat“ lässt die Identität des Berufenden wie im Griechischen offen.
  issues:
