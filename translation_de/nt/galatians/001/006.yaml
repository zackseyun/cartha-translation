    rationale: „Andersartig“ kann einen qualitativen Gegensatz stärker behaupten als ἕτερον in diesem Vers zwingend verlangt; „gute Botschaft“ ersetzt zudem den etablierten Terminus εὐαγγέλιον unnötig. „einem anderen Evangelium“ ist quellentreuer, natürlich und lässt die weitere Präzisierung in Vers 7 stehen.
  revised_text: Ich wundere mich, dass ihr euch so schnell von dem abwendet, der euch in der Gnade des Messias[a] berufen hat, und euch einem anderen Evangelium zuwendet[b].
