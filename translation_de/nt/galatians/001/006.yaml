id: GAL.1.6
reference: Galatians 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: de
  text: Ich wundere mich, dass ihr euch so schnell von dem abwendet, der euch in der Gnade des Messias[a] berufen hat, und euch einem anderen Evangelium zuwendet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Gnade des Messias“. Die Präposition kann den Bereich oder das Mittel der Berufung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zu einem anderen Evangelium“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Ich wundere mich
  rationale: Gibt Paulus’ bestürztes Erstaunen in natürlichem, gegenwärtigem Deutsch wieder, ohne einen bloß neutralen Staunensausdruck zu wählen.
- source_word: οὕτως ταχέως
  choice: so schnell
  rationale: Bewahrt die Betonung des überraschend raschen Wechsels und klingt im Deutschen idiomatisch.
- source_word: μετατίθεσθε
  choice: ihr wendet euch … ab … und … zu
  rationale: Das mediale Verb bezeichnet hier einen gegenwärtigen Wechsel beziehungsweise Abfall. Die zweiteilige deutsche Form macht sowohl die Abkehr von dem Berufenden als auch die Hinwendung zur anderen Botschaft deutlich.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: der euch … berufen hat
  rationale: Bewahrt den vergangenen Ruf und lässt dessen Urheber wie im Griechischen unausgesprochen.
- source_word: ἐν χάριτι Χριστοῦ
  choice: in der Gnade des Messias
  rationale: Die örtlich-sphärische Wiedergabe mit „in“ lässt offen, ob ἐν stärker den Bereich oder das Mittel der Berufung bezeichnet; der Genitiv bleibt ebenfalls transparent.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt den Titelgehalt von Χριστός wieder, statt ihn lediglich als eingedeutschte Namensform zu behandeln.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: einer andersartigen guten Botschaft zuwendet
  rationale: „Andersartig“ bringt den qualitativen Unterschied von ἕτερον zur Geltung; „gute Botschaft“ gibt die lexikalische Bedeutung von εὐαγγέλιον verständlich wieder.
theological_decisions:
- issue: Identität dessen, der die Galater berufen hat
  choice: 'Im Haupttext bleibt sie unausgesprochen: „der euch … berufen hat“.'
  alternative: „Gott, der euch berufen hat“ oder „der Messias, der euch berufen hat“
  rationale: Der griechische Text nennt das Subjekt hier nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung und entscheidet die theologische Bezugnahme nicht stillschweigend.
- issue: Bedeutung von ἐν in ἐν χάριτι Χριστοῦ
  choice: „in der Gnade des Messias“
  alternative: „durch die Gnade des Messias“
  rationale: „In“ bewahrt den möglichen Sphärenbezug; die instrumentale Deutung bleibt in einer Fußnote sichtbar.
- issue: Status der anderen Botschaft als „Evangelium“
  choice: Die Formulierung des Verses wird als „andersartige gute Botschaft“ wiedergegeben.
  alternative: „ein anderes Evangelium“
  rationale: Vers 6 nennt sie zunächst εὐαγγέλιον, während Vers 7 die Bezeichnung qualifiziert. Die Übersetzung nimmt diese Spannung nicht vorweg.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, allgemein verständlichem Ton. „Messias“ bewahrt den Titelcharakter von Χριστός. Die etwas markierte Formulierung „andersartige gute Botschaft“ hält den qualitativen Gegensatz fest, der im folgenden Vers entfaltet wird.
