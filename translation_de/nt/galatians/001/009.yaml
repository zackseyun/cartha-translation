id: GAL.1.9
reference: Galatians 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: de
  text: 'Wie wir schon zuvor gesagt haben, so sage ich auch jetzt wieder: Wenn euch jemand ein Evangelium verkündet, das von dem abweicht, was ihr empfangen habt,[a] sei er verflucht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das über das hinausgeht, was ihr empfangen habt“. Die griechische Wendung kann eine Abweichung von der empfangenen Botschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „soll unter einem Fluch stehen“; griechisch: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Wie wir schon zuvor gesagt haben
  rationale: Das Perfekt verweist auf eine frühere Aussage, deren Geltung fortbesteht. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Rückbezug.
- source_word: ἄρτι πάλιν λέγω
  choice: so sage ich auch jetzt wieder
  rationale: „Jetzt“ gibt ἄρτι wieder, „wieder“ die Wiederholung durch πάλιν; „auch“ und „so“ bewahren den anschließenden, bekräftigenden Charakter.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Wenn euch jemand ein Evangelium verkündet
  rationale: Das Verb bezeichnet die Verkündigung einer guten Botschaft. „Ein Evangelium verkündet“ erhält den sprachlichen Bezug zum Evangelium und den polemischen Kontrast des Zusammenhangs.
- source_word: παρ’ ὃ
  choice: das von dem abweicht, was
  rationale: παρά mit dem Relativpronomen bezeichnet hier eine Abweichung von der empfangenen Botschaft. „Abweicht“ wahrt die Stoßrichtung, ohne die mögliche Nuance „über … hinaus“ auszuschließen.
- source_word: παρελάβετε
  choice: ihr empfangen habt
  rationale: „Empfangen“ ist die sachlich passende Wiedergabe für die Aufnahme einer übermittelten Botschaft oder Tradition.
- source_word: ἀνάθεμα ἔστω
  choice: soll er verflucht sein
  rationale: Die Wendung bezeichnet eine Person, die dem Fluch verfallen ist. „Verflucht sein“ bewahrt die ernste, urteilende Kraft, ohne über den griechischen Wortlaut hinaus ausdrücklich den Urheber des Fluches zu benennen.
theological_decisions:
- issue: Tragweite der Verurteilung in ἀνάθεμα ἔστω
  choice: soll er verflucht sein
  alternative: soll unter einem Fluch stehen
  rationale: Die Hauptfassung erhält die Schärfe der Warnung, legt jedoch weder die genaue Vollzugsweise noch weitere dogmatische Einzelheiten fest.
- issue: Verhältnis des verkündeten Evangeliums zur empfangenen Botschaft in παρ’ ὃ
  choice: das von dem abweicht, was ihr empfangen habt
  alternative: das über das hinausgeht, was ihr empfangen habt
  rationale: Im Kontext steht die Abweichung von der apostolisch empfangenen Botschaft im Vordergrund. Die alternative räumliche Nuance von παρά bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die feierliche Wiederholung und die Schärfe der Warnung, bleibt aber für heutige Leser unmittelbar verständlich. Das generische „jemand“ gibt τις ohne unnötige Geschlechtsfestlegung wieder.
