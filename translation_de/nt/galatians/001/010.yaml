source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: de
  text: Versuche ich denn jetzt, Menschen zu überzeugen, oder Gott? Oder suche ich Menschen zu gefallen? Wenn ich noch Menschen gefiele, wäre ich nicht Sklave des Messias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »Diener des Christus.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: jetzt
  rationale: Gibt den gegenwärtigen Bezug in Paulus’ rhetorischer Frage knapp und natürlich wieder.
- source_word: πείθω
  choice: überzeugen
  rationale: Entspricht der Grundbedeutung des Verbs und bewahrt die auffällige, bewusst offene Formulierung »Menschen … oder Gott überzeugen«; die mögliche Nuance des Gewinnens von Zustimmung steht in der Fußnote.
- source_word: ἀνθρώπους
  choice: Menschen
  rationale: Bezeichnet hier Menschen allgemein und nicht ausschließlich Männer.
- source_word: ζητῶ
  choice: suche ich
  rationale: Bildet das Präsens und das bewusste Streben in der zweiten rhetorischen Frage eng am Griechischen ab.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: zu gefallen / gefiele
  rationale: »Gefallen« ist die direkte deutsche Entsprechung; der Konjunktiv »gefiele« gibt die irreale Bedingung mit οὐκ ἂν ἤμην prägnant wieder.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Bewahrt den Titelsinn von Χριστός in der Zugehörigkeitsformel.
- source_word: δοῦλος
  choice: Sklave
  rationale: Bringt die starke Aussage völliger Zugehörigkeit und Bindung deutlicher zum Ausdruck als das mildere »Diener«.
theological_decisions:
- issue: Bedeutung von πείθω in der Gegenüberstellung von Menschen und Gott
  choice: Menschen überzeugen oder Gott
  alternative: die Zustimmung von Menschen oder von Gott suchen
  rationale: Die Hauptfassung wahrt die unmittelbare lexikalische Bedeutung und die Spannung der ungewöhnlichen Frage; die idiomatischere Deutung wird als echte Alternative in der Fußnote genannt.
- issue: Wiedergabe von Χριστοῦ δοῦλος
  choice: Sklave des Messias
  alternative: Diener des Christus
  rationale: »Sklave« erhält den Gedanken ausschließlicher Zugehörigkeit, während »Messias« den Titelsinn von Χριστός sichtbar macht. Die traditionellere, semantisch mildere Wiedergabe bleibt in der Fußnote zugänglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen bleiben knapp; der bewusst starke Ausdruck »Sklave des Messias« bewahrt die Aussage umfassender Zugehörigkeit.
