  text: καὶ ἐδόξαζον ἐν ἐμοὶ τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: de
  text: Und sie priesen Gott wegen mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in mir“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss führt die Erzählung schlicht fort.
- source_word: ἐδόξαζον
  choice: priesen
  rationale: δοξάζω bezeichnet hier, Gott Ehre zu geben. Das deutsche Präteritum gibt den erzählenden Zusammenhang natürlich wieder; der Imperfekt kann zugleich einen andauernden oder wiederholten Vorgang bezeichnen.
- source_word: ἐν ἐμοὶ
  choice: wegen mir
  rationale: 'Im Zusammenhang bezeichnet die Wendung am ehesten den Anlass ihres Gotteslobs: Was sie über Paulus hörten, bewog sie dazu. Die wörtlichere und möglicherweise stärker assoziative Fassung wird in der Fußnote bewahrt.'
- source_word: τὸν θεόν
  choice: Gott
  rationale: Direktes Objekt von ἐδόξαζον; die übliche deutsche Wiedergabe ist eindeutig und sachgerecht.
theological_decisions:
- issue: Bedeutung von ἐν ἐμοὶ
  choice: 'kausal/assoziativ: „wegen mir“'
  alternative: 'wörtlicher: „in mir“'
  rationale: Der unmittelbare Zusammenhang beschreibt die Reaktion der Gemeinden auf die Nachricht von Paulus’ Wandel. „Wegen mir“ ist im heutigen Deutsch verständlich und lässt Gott als den Empfänger des Lobes hervortreten; „in mir“ bewahrt jedoch eine echte sprachliche Möglichkeit und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Priesen“ klingt im biblischen Zusammenhang natürlich, ohne unnötig altertümlich zu sein. Der Fußnotenmarker steht unmittelbar nach dem Satz.
