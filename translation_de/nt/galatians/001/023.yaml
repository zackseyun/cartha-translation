  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: de
  text: 'Sie hörten nur immer wieder: „Derjenige, der uns früher verfolgte, verkündet jetzt den Glauben[a], den er einst zu vernichten suchte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Evangelium“. Griechisch: „den Glauben“; hier wahrscheinlich die christliche Glaubensbotschaft beziehungsweise der christliche Glaube, den Paulus zuvor bekämpfte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: nur
  rationale: 'Kennzeichnet die Einschränkung: Die Gemeinden kannten Paulus nicht persönlich, sondern hatten lediglich diese Nachricht über ihn gehört.'
- source_word: ἀκούοντες ἦσαν
  choice: hörten … immer wieder
  rationale: Die periphrastische Imperfektform bezeichnet ein fortdauerndes oder wiederholtes Hören; die idiomatische deutsche Wiedergabe macht diesen Aspekt deutlich.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: derjenige, der uns früher verfolgte
  rationale: Das substantivierte Partizip mit ποτέ identifiziert Paulus anhand seines früheren, fortgesetzten Vorgehens gegen die Christen.
- source_word: νῦν εὐαγγελίζεται
  choice: verkündet jetzt
  rationale: Das Verb bezeichnet die öffentliche Verkündigung der guten Botschaft; „verkündet“ ist natürlich und vermeidet eine unnötige Ergänzung vor dem ausdrücklichen Objekt „den Glauben“.
- source_word: τὴν πίστιν
  choice: den Glauben
  rationale: Der Artikel und der Zusammenhang sprechen hier für den Glauben im objektiven Sinn, also für die christliche Glaubensbotschaft, nicht primär für den persönlichen Glaubensakt.
- source_word: ἣν ποτε ἐπόρθει
  choice: den er einst zu vernichten suchte
  rationale: πορθέω bedeutet verwüsten oder vernichten. „Zu vernichten suchte“ gibt die aggressive Absicht idiomatisch wieder, ohne zu behaupten, dass Paulus sein Ziel erreicht habe.
theological_decisions:
- issue: Bedeutung von τὴν πίστιν
  choice: „den Glauben“ als die christliche Glaubensbotschaft, die Paulus nun verkündet
  alternative: „die gute Botschaft“ oder „das Evangelium“; ferner „Glauben“ als persönlicher Glaubensakt
  rationale: Der Gegensatz zwischen früherer Verfolgung und jetziger Verkündigung sowie der bestimmte Artikel legen den objektiven Sinn nahe. Die Übersetzung bewahrt dennoch den griechischen Ausdruck „Glaube“, statt ihn interpretierend durch „Evangelium“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Immer wieder“ bildet den durativen beziehungsweise iterativen Charakter der Verbform natürlich ab; „zu vernichten suchte“ wahrt die starke Bedeutung von πορθέω und zugleich den Unterschied zwischen Absicht und erreichtem Ergebnis.
