  text: ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: de
  text: Danach kam ich in die Gebiete Syriens und Kilikiens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Gegenden Syriens und Kilikiens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Danach
  rationale: Kennzeichnet die zeitliche Abfolge in Paulus’ Bericht und klingt im modernen Deutschen natürlich.
- source_word: ἦλθον
  choice: ging ich
  rationale: Obwohl ἔρχομαι häufig mit „kommen“ wiedergegeben wird, beschreibt das Verb hier aus der Erzählperspektive eine Weiterreise; „ging ich“ ist im Deutschen idiomatisch.
- source_word: εἰς
  choice: in
  rationale: Bewahrt zusammen mit dem Akkusativ die Richtungsbedeutung („in … hinein“), ohne im Deutschen schwerfällig zu wirken.
- source_word: κλίματα
  choice: Gebiete
  rationale: Bezeichnet geografische Gegenden oder Landstriche; „Gebiete“ ist verständlich und umfasst die gemeinte regionale Ausdehnung.
- source_word: Συρίας
  choice: Syrien
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: Κιλικίας
  choice: Kilikien
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebiete“ gibt den Plural κλίματα natürlich wieder; die Alternative „Gegenden“ dokumentiert die mögliche geografische Nuance. Eine eigene Fußnote zur Wiedergabe von εἰς mit „nach“ ist nicht nötig, da „in“ dessen Richtungsbedeutung angemessen bewahrt.
