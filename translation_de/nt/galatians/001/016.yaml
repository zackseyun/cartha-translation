source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: de
  text: seinen Sohn in mir[a] zu offenbaren, damit ich ihn unter den Nichtjuden verkündige, beriet ich mich nicht sofort mit Fleisch und Blut[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir“ oder „durch mich“.'
    reason: alternative_reading
  - marker: b
    text: „Fleisch und Blut“ ist eine feste Wendung für einen Menschen oder für Menschen allgemein.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: zu offenbaren
  rationale: Das Verb bezeichnet göttliches Enthüllen bzw. Offenbaren. „Offenbaren“ ist im Deutschen klar, würdig und bewahrt diesen Sinn.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Die natürliche deutsche Wortstellung bewahrt den christologischen Titel ohne erklärende Erweiterung.
- source_word: ἐν ἐμοὶ
  choice: in mir
  rationale: Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit zwischen innerer Offenbarung sowie einer Offenbarung an oder durch Paulus; Alternativen stehen in der Fußnote.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: damit ich ihn … verkündige
  rationale: Das Verb bezeichnet die Verkündigung der guten Botschaft. Das Pronomen αὐτόν steht direkt als Objekt; „ihn verkündige“ bewahrt diese auffällige persönliche Zuspitzung.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: ἔθνη kann die nichtjüdischen Völker bezeichnen. „Unter den Völkern“ wahrt den grundlegenden Wortsinn und lässt den paulinischen Bezug auf Nichtjuden im Kontext erkennbar.
- source_word: εὐθέως
  choice: sogleich
  rationale: „Sogleich“ ist eine präzise, flüssige und stilistisch würdige Entsprechung für die unmittelbare zeitliche Folge.
- source_word: οὐ προσανεθέμην
  choice: da beriet ich mich nicht
  rationale: Das Medium bezeichnet hier das Sichberaten bzw. Rücksprachehalten mit anderen. Die Verbzweitstellung mit „da“ verbindet den Satz natürlich mit dem vorangehenden Infinitivgefüge aus Vers 15.
- source_word: σαρκὶ καὶ αἵματι
  choice: mit Fleisch und Blut
  rationale: Die bildhafte semitische Wendung wird erhalten; ihre Bedeutung als Bezeichnung für Menschen wird in einer Fußnote erklärt.
theological_decisions:
- issue: Bedeutung von ἐν ἐμοὶ bei der Offenbarung des Sohnes
  choice: Die wörtliche und mehrdeutige Formulierung „in mir“ bleibt im Haupttext erhalten.
  alternative: „mir“ oder „durch mich“
  rationale: Der Ausdruck kann eine innere Offenbarung, eine Offenbarung an Paulus oder eine Offenbarung durch Paulus bezeichnen. Der Haupttext entscheidet diese Spannung nicht.
- issue: Wiedergabe von ἔθνη
  choice: „Völker“
  alternative: „Nichtjuden“
  rationale: Im paulinischen Zusammenhang sind die nichtjüdischen Völker gemeint; die formnähere Wiedergabe „Völker“ vermeidet jedoch, die lexikalische und heilsgeschichtliche Spannweite unnötig einzuengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit formnaher Bewahrung der paulinischen Bildsprache und Mehrdeutigkeit. Das einleitende „da“ stellt innerhalb des versübergreifenden deutschen Satzes einen natürlichen Anschluss her.
