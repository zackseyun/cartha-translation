  naturalness: „Beriet ich mich nicht sogleich mit Fleisch und Blut“ ist verständlich, aber ohne „da“ flüssiger und näher am schlichten Anschluss des griechischen Textes. „sofort“ ist modernes Standarddeutsch und passend für εὐθέως.
