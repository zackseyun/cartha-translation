review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt γάρ („Denn“), die gemeindeweite Anrede ἀδελφοί („Geschwister“ mit erläuternder Fußnote), εὐαγγέλιον und die auf menschliche Herkunft zielende Deutung von οὐκ ἔστιν κατὰ ἄνθρωπον sachgerecht wieder. Die Wiedergabe „nicht menschlichen Ursprungs“ ist im Licht von V. 12 gut begründet; die relevante alternative Nuance bleibt in Fußnote b erhalten.
  naturalness: „Ich lasse euch wissen“ ist im heutigen Standarddeutsch als finite Mitteilungsform unidiomatisch bzw. deutlich weniger natürlich als „ich teile euch mit“. Eine dass-Konstruktion bildet zudem die griechische ὅτι-Konstruktion klar und flüssig nach.
  terminology: „Evangelium“, „verkündet“ und „Geschwister“ sind im gegebenen Register passend. Die Fußnote zu „Geschwister“ dokumentiert transparent die wörtliche maskuline Form „Brüder“, ohne die mutmaßliche Reichweite der Anrede dogmatisch festzulegen.
  issues:
  - severity: medium
    issue: Unnatürliche Wiedergabe von Γνωρίζω ὑμῖν
    rationale: „Ich lasse euch wissen“ ist im modernen Standarddeutsch keine geläufige selbstständige Formulierung. „Ich teile euch mit“ ist idiomatisch, bewahrt den mitteilenden Nachdruck und fügt keine inhaltliche Komponente wie „ich möchte“ hinzu.
  - severity: low
    issue: Satzbau kann die griechische ὅτι-Aussage direkter abbilden
    rationale: Die Doppelpunktkonstruktion ist verständlich, doch „dass das von mir verkündete Evangelium … ist“ entspricht dem Aufbau des Ausgangstextes unmittelbar und liest sich im Deutschen geschlossen.
