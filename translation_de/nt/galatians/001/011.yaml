source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: de
  text: Denn ich teile euch mit, Geschwister[a], dass das von mir verkündete Evangelium nicht menschlichen Ursprungs ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Brüder; die Anrede kann die gesamte Gemeinde, also Männer und Frauen, umfassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: nicht nach einem Menschen; die Wendung kann auch „nicht nach menschlichen Maßstäben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: ich lasse euch wissen
  rationale: Die Wendung bedeutet wörtlich etwa „ich mache euch bekannt“, dient hier aber als natürliche Ankündigung einer wichtigen Klarstellung. „Ich lasse euch wissen“ bewahrt diese Funktion in gegenwärtigem, würdigem Deutsch.
- source_word: γὰρ
  choice: Denn
  rationale: Die Partikel verbindet die Aussage begründend beziehungsweise erläuternd mit dem vorausgehenden Gedankengang.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Obwohl die griechische Form grammatisch männlich ist, bezeichnet sie in der paulinischen Anrede regelmäßig die gesamte Glaubensgemeinschaft. „Geschwister“ gibt diese gemeinte Gruppe im modernen Deutschen natürlich wieder; die wörtliche Form wird in der Fußnote genannt.
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: „Evangelium“ ist hier der etablierte deutsche Ausdruck und bewahrt den prägnanten paulinischen Sinn.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: das ich verkündet habe
  rationale: Die Form bezeichnet das von Paulus öffentlich bekannt gemachte Evangelium. Die aktive deutsche Formulierung ist klar und gibt den Urheber der Verkündigung genau wieder.
- source_word: οὐκ ἔστιν κατὰ ἄνθρωπον
  choice: ist nicht menschlichen Ursprungs
  rationale: Im unmittelbaren Zusammenhang wird die Wendung durch die Aussage erläutert, Paulus habe das Evangelium nicht von einem Menschen empfangen oder gelernt (Gal 1,12). Daher ist die Herkunftsdeutung im Haupttext am besten begründet; die mögliche Bedeutung „nach menschlichen Maßstäben“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bezeichnet κατὰ ἄνθρωπον die menschliche Herkunft oder menschliche Maßstäbe?
  choice: nicht menschlichen Ursprungs
  alternative: nicht nach menschlichen Maßstäben
  rationale: Vers 12 stellt ausdrücklich den Empfang und die Unterweisung durch Menschen in Abrede und stützt damit die Herkunftsdeutung. Da die griechische Wendung auch eine Norm oder einen Maßstab bezeichnen kann, wird diese echte Alternative nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
- issue: Umfasst ἀδελφοί nur Männer oder die ganze Gemeinde?
  choice: Geschwister
  alternative: Brüder
  rationale: Die grammatisch männliche Anrede kann im damaligen Sprachgebrauch eine gemischte Gemeinschaft einschließen. Im modernen Deutschen macht „Geschwister“ diesen gemeinschaftlichen Bezug verständlich, ohne eine zusätzliche Personengruppe in den Inhalt einzuführen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Satzbau. Der Doppelpunkt nach der Anrede macht die angekündigte Klarstellung natürlich lesbar. Die Herkunftsdeutung steht aufgrund des unmittelbaren Kontexts im Haupttext, während die formale Nähe und die Bedeutungsalternative in der Fußnote erhalten bleiben.
