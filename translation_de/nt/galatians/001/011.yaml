- from: 'Denn ich lasse euch wissen, Geschwister[a]: Das Evangelium, das ich verkündet habe, ist nicht menschlichen Ursprungs.[b]'
  to: Denn ich teile euch mit, Geschwister[a], dass das von mir verkündete Evangelium nicht menschlichen Ursprungs ist.[b]
  rationale: Die Revision beschränkt sich auf eine idiomatische und zugleich quellennähere Wiedergabe der einleitenden Mitteilungsform sowie auf einen Satzbau mit „dass“. Die kontextuell starke, aber nicht exklusiv erzwungene Herkunftsdeutung von κατὰ ἄνθρωπον bleibt im Haupttext; ihre alternative Deutung bleibt vermerkt.
