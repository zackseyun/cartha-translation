  text: to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Ihm sei die Herrlichkeit für immer und ewig. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Ihm
  rationale: Das Dativpronomen bezieht sich auf den unmittelbar zuvor genannten »Gott und Vater«. Im Deutschen eröffnet »Ihm« die Doxologie natürlich und eindeutig.
- source_word: δόξα
  choice: die Herrlichkeit
  rationale: »Herrlichkeit« ist im doxologischen Zusammenhang die geläufige und sachlich umfassende Wiedergabe; sie bewahrt den biblischen Klang, ohne auf »Lob« oder »Ehre« zu verengen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die feste griechische Wendung bezeichnet unbegrenzte Dauer. »Für immer und ewig« gibt ihre verstärkende Wirkung in natürlichem modernem Deutsch wieder.
- source_word: ἀμήν
  choice: Amen
  rationale: Das eingebürgerte Lehnwort bewahrt die feierliche Bekräftigung am Ende der Doxologie.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Verb in der Doxologie
  choice: Ihm gebührt die Herrlichkeit
  alternative: Ihm sei die Herrlichkeit
  rationale: Der griechische Nominalsatz lässt offen, ob die Aussage eher als Zuschreibung oder als feierlicher Wunsch formuliert ist. »Gebührt« ergibt im Deutschen eine natürliche doxologische Aussage, ohne einen zusätzlichen theologischen Gedanken einzuführen; die alternative Wunschform bleibt grammatisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter doxologischer Formulierung. Keine Fußnote ist nötig, da die griechische Idiomatik klar und die deutsche Wiedergabe unmittelbar verständlich ist.
