  source_fidelity: Der Bezug von ᾧ auf den unmittelbar vorher genannten „unseren Gott und Vater“ ist mit „Ihm“ korrekt. δόξα ist treffend als „Herrlichkeit“ wiedergegeben, und „für immer und ewig“ gibt die verstärkende Dauerformel εἰς τοὺς αἰῶνας τῶν αἰώνων idiomatisch wieder. Das griechische Prädikat ist elliptisch; die deutsche Verbwahl sollte diese doxologische Offenheit möglichst unmittelbar abbilden.
  naturalness: Der Entwurf ist gut verständlich und würdig. In einer deutschen Doxologie ist „Ihm sei die Herrlichkeit“ jedoch die nähere und ebenso natürliche Entsprechung zur griechischen prädikatlosen Zuschreibung als „Ihm gebührt die Herrlichkeit“.
  terminology: „Herrlichkeit“ und „Amen“ sind für den biblisch-doxologischen Register angemessen. Keine Fußnote ist erforderlich.
