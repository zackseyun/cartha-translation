  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: de
  text: Den Gemeinden in Judäa, die im Messias[b] sind, war ich jedoch persönlich unbekannt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Sehen her unbekannt“; wörtlich: „dem Angesicht nach unbekannt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: δὲ kennzeichnet hier einen leichten Übergang beziehungsweise Gegensatz; „Doch“ gibt diese Bewegung im Deutschen natürlich wieder.
- source_word: ἤμην … ἀγνοούμενος
  choice: war ich … unbekannt
  rationale: Die periphrastische Konstruktion bezeichnet einen fortdauernden Zustand des Unbekanntseins; die deutsche Formulierung gibt diesen schlicht und idiomatisch wieder.
- source_word: τῷ προσώπῳ
  choice: persönlich
  rationale: Der Dativ mit πρόσωπον meint hier fehlende Bekanntschaft oder Wiedererkennbarkeit von Angesicht zu Angesicht. „Persönlich“ vermittelt den idiomatischen Sinn ohne die im Deutschen missverständliche Formulierung „dem Gesicht nach“.
- source_word: ἐκκλησίαις
  choice: Gemeinden
  rationale: Im paulinischen Zusammenhang sind örtliche Gemeinschaften von Glaubenden gemeint; „Gemeinden“ ist dafür im modernen Standarddeutsch klar und geläufig.
- source_word: τῆς Ἰουδαίας
  choice: Judäas
  rationale: Der Genitiv bezeichnet die Gemeinden der Region Judäa; der traditionelle deutsche Ortsname bleibt präzise und knapp.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός trägt hier Titelcharakter. „Messias“ bewahrt die Bedeutung „der Gesalbte“, während „in“ die markante paulinische Beziehungsformel nicht auf eine einzige Deutung festlegt.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: „Messias“ lässt den Titelcharakter von Χριστός hörbar werden. Die wörtlich beibehaltene Präposition „in“ bewahrt die theologisch dichte und mehrdeutige paulinische Wendung, statt sie etwa als bloße Zugehörigkeit auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt wie der griechische Text den Zustand des persönlichen Unbekanntseins heraus; „im Messias“ bleibt bewusst als paulinisch geprägte Wendung stehen.
