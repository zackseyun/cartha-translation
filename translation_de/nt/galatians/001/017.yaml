id: GAL.1.17
reference: Galatians 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: de
  text: Ich ging auch nicht nach Jerusalem hinauf zu denen, die vor mir Apostel waren, sondern nach Arabien und kehrte wieder nach Damaskus zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Auch ging ich nicht
  rationale: Führt die Verneinung aus dem vorherigen Zusammenhang fort und verbindet den Satz eng mit der vorausgehenden Aussage; im modernen Deutsch natürlich.
- source_word: ἀνῆλθον
  choice: ging ... hinauf
  rationale: Bewahrt die übliche Richtungsangabe bei einer Reise nach Jerusalem, ohne das gehobene und hier unnatürliche „stieg hinauf“ zu verwenden.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: zu denen, die vor mir Apostel waren
  rationale: Gibt sowohl πρός als auch den zeitlichen Sinn von πρὸ ἐμοῦ wieder und vermeidet die mögliche Rangbedeutung von „die Apostel über mir“.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach einer verneinten Aussage bezeichnet „sondern“ im Deutschen den direkten Gegensatz natürlicher und genauer als „aber“.
- source_word: ἀπῆλθον
  choice: ging
  rationale: Im Zusammenhang bezeichnet das Verb das Weggehen zu einem anderen Ziel. Ein zusätzliches „weg“ wäre möglich, klänge vor „nach Arabien“ jedoch schwerfälliger.
- source_word: Ἀραβίαν
  choice: Arabien
  rationale: Übliche deutsche Bezeichnung der Region; ihre historische Ausdehnung wird im Vers nicht näher bestimmt.
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die erneute beziehungsweise rückläufige Bewegung idiomatisch wieder.
- source_word: ὑπέστρεψα
  choice: kehrte ... zurück
  rationale: Präzise und natürliche Wiedergabe des Verbs im Reisekontext.
- source_word: Δαμασκόν
  choice: Damaskus
  rationale: Übliche deutsche Form des Stadtnamens.
theological_decisions:
- issue: Bedeutung von „vor mir“ in Bezug auf die Apostel
  choice: 'Zeitlicher Vorrang: Menschen, die schon vor Paulus Apostel waren'
  alternative: Apostel, die Paulus im Rang überlegen waren
  rationale: πρὸ ἐμοῦ bezeichnet hier am natürlichsten zeitliche Priorität. Die Formulierung macht dies verständlich, ohne eine Aussage über Rang oder Autorität einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Kontrast zwischen dem nicht erfolgten Gang nach Jerusalem und der Reise nach Arabien; zugleich ist die Formulierung für heutige Leser flüssig.
