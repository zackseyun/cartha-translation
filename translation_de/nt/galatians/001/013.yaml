id: GAL.1.13
reference: Galatians 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: de
  text: 'Denn ihr habt von meinem früheren Lebenswandel[a] im Judentum[b] gehört: Ich verfolgte die Gemeinde Gottes über alle Maßen[c] und verwüstete[d] sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „meiner früheren Lebensführung“ oder „meinem früheren Verhalten“.
    reason: lexical_alternative
  - marker: b
    text: Oder „in der jüdischen Religion“.
    reason: lexical_alternative
  - marker: c
    text: Oder „maßlos“ oder „in außergewöhnlichem Ausmaß“.
    reason: lexical_alternative
  - marker: d
    text: Oder „zerstörte sie“; möglicherweise „suchte sie zu vernichten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: früheren Lebenswandel
  rationale: Die Verbindung bezeichnet die frühere Lebensführung des Paulus. „Lebenswandel“ erfasst Verhalten und Lebensweise und verbindet sich im Deutschen natürlich mit der Zeitangabe „früheren“.
- source_word: Ἰουδαϊσμῷ
  choice: Judentum
  rationale: Der etablierte deutsche Ausdruck bezeichnet hier die jüdische religiöse Identität und Lebensordnung, in der Paulus damals lebte.
- source_word: καθ’ ὑπερβολὴν
  choice: über alle Maßen
  rationale: Die Wendung bewahrt die starke Steigerung des Griechischen und klingt zugleich verständlich und rhetorisch gewichtig.
- source_word: ἐδίωκον
  choice: verfolgte
  rationale: Das Verb bezeichnet hier anhaltende Verfolgung in der Vergangenheit. Das deutsche Präteritum ist im Zusammenhang idiomatisch; die wiederholte beziehungsweise fortdauernde Handlung ergibt sich aus dem Kontext.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: die Gemeinde Gottes
  rationale: „Gemeinde“ bezeichnet im neutestamentlichen Kontext natürlich die Gemeinschaft der an Christus Glaubenden, ohne das Wort auf eine Institution oder ein Gebäude einzuengen.
- source_word: ἐπόρθουν
  choice: verwüstete
  rationale: Das starke Verb beschreibt zerstörerisches Vorgehen und geht über bloße Gegnerschaft hinaus. „Verwüstete“ erhält dieses drastische Bild, ohne die mögliche Nuance eines versuchten Vernichtens im Haupttext festzulegen.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία als „Gemeinde“ oder „Versammlung/Kirche“
  choice: die Gemeinde Gottes
  alternative: die Versammlung Gottes; die Kirche Gottes
  rationale: Gemeint ist die von Paulus verfolgte Gemeinschaft der Christusgläubigen. „Gemeinde“ ist im modernen deutschen Bibelsprachgebrauch klar und vermeidet sowohl eine rein situative Versammlung als auch eine unnötig institutionelle Färbung.
- issue: Erfolg oder Absicht des zerstörerischen Vorgehens bei ἐπόρθουν
  choice: verwüstete sie
  alternative: suchte sie zu vernichten
  rationale: Das griechische Imperfekt kann das fortgesetzte zerstörerische Handeln schildern und je nach Kontext auch einen versuchten Vorgang nahelegen. Der Haupttext bewahrt das kräftige Bild; die Fußnote hält die alternative Deutung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gibt den erläuternden ὅτι-Satz natürlich wieder. „Lebenswandel“ ist leicht bibelsprachlich, aber weiterhin allgemein verständlich; „verwüstete“ bewahrt bewusst die Härte und Bildkraft des Ausgangstextes.
