  source_fidelity: 'Der Text gibt die griechische Syntax und Aussage zuverlässig wieder: γάρ ist mit „Denn“ erfasst, ἀναστροφήν ποτε mit „früheren Lebenswandel“, ἐν τῷ Ἰουδαϊσμῷ mit „im Judentum“ und die intensive Verfolgung samt zerstörerischem Vorgehen angemessen. Das deutsche Präteritum kann die imperfektische Hintergrund- bzw. Verlaufsdarstellung idiomatisch wiedergeben.'
  naturalness: „Denn ihr habt von meinem früheren Lebenswandel im Judentum gehört“ ist verständliches, würdiges modernes Standarddeutsch. Der Doppelpunkt leitet den ὅτι-Inhaltssatz natürlich ein. „Über alle Maßen“ und „verwüstete sie“ sind bewusst gehoben, aber klar und dem paulinischen Register angemessen.
  terminology: „Judentum“ ist die etablierte und sachgerechte Wiedergabe von Ἰουδαϊσμός. „Gemeinde Gottes“ ist für ἐκκλησία τοῦ θεοῦ kontextgerecht und vermeidet unnötige institutionelle Festlegungen. „Verwüstete“ gibt die außergewöhnlich starke Gewalt von ἐπόρθουν wieder; die Fußnote hält die mögliche Nuance eines auf Vernichtung zielenden Handelns offen.
