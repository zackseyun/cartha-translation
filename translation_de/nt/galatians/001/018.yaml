source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: de
  text: Dann, nach drei Jahren, ging ich nach Jerusalem hinauf, um Kephas[a] kennenzulernen, und blieb fünfzehn Tage bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kephas ist der aramäische Name des Petrus.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔπειτα
  choice: Dann
  rationale: Kennzeichnet natürlich den nächsten Schritt in der zeitlichen Abfolge des Berichts.
- source_word: μετὰ ἔτη τρία
  choice: nach drei Jahren
  rationale: Gibt die Zeitangabe eng am Griechischen und in idiomatischem Deutsch wieder.
- source_word: ἀνῆλθον
  choice: ging ... hinauf
  rationale: Bewahrt die im Verb enthaltene Aufwärtsbewegung, die bei einer Reise nach Jerusalem üblich ist.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Entspricht der üblichen deutschen Wiedergabe des Ortsnamens und der Bewegungsrichtung.
- source_word: ἱστορῆσαι
  choice: um ... kennenzulernen
  rationale: Das seltene Verb bezeichnet hier eine persönliche Begegnung, durch die man jemanden kennenlernt; die Wiedergabe wahrt diese Nuance besser als ein bloßes »besuchen«.
- source_word: Κηφᾶν
  choice: Kephas
  rationale: Bewahrt die von Paulus verwendete aramäische Namensform, statt sie mit Petrus zu harmonisieren.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: blieb ... bei ihm
  rationale: Natürliche deutsche Wiedergabe des fortdauernden Aufenthalts bei Kephas.
- source_word: ἡμέρας δεκαπέντε
  choice: fünfzehn Tage
  rationale: Der Akkusativ bezeichnet die Dauer; im Deutschen ist sie mit »blieb« auch ohne zusätzliche Präposition eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Ablauf, ohne unnatürlich zu wirken. »Kennenlernen« bewahrt die besondere Bedeutung von ἱστορῆσαι; »Kephas« erhält die konkrete Namensform des Ausgangstextes.
