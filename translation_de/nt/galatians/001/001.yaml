id: GAL.1.1
reference: Galatians 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: de
  text: Paulus, Apostel – nicht von Menschen her und auch nicht durch einen Menschen, sondern durch Jesus, den Messias,[a] und Gott, den Vater, der ihn von den Toten auferweckt hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“.'
    reason: 'Lexikalische Alternative für Χριστός: traditionell „Christus“, hier im Haupttext zur Verdeutlichung des Titelgehalts „Messias“.'
lexical_decisions:
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Der etablierte Sendungstitel bewahrt sowohl die formale Beauftragung als auch ihr theologisches Gewicht; „Bote“ wäre hier zu allgemein.
- source_word: ἀπ’ ἀνθρώπων
  choice: von Menschen her
  rationale: ἀπό mit Genitiv bezeichnet Herkunft oder Ursprung. „Von Menschen her“ macht diese Bedeutung im Deutschen deutlich und erhält den Gegensatz zum folgenden Singular.
- source_word: δι’ ἀνθρώπου
  choice: durch einen Menschen
  rationale: διά mit Genitiv bezeichnet hier Vermittlung oder Wirkursache. Der Singular bleibt erhalten und wird mit dem im Deutschen notwendigen unbestimmten Artikel natürlich wiedergegeben.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: Das wiederholte διά erhält die rhetorische Gegenüberstellung menschlicher und göttlicher Beauftragung. Χριστός wird als Titel „Messias“ wiedergegeben; die Apposition ist im modernen Deutschen idiomatisch.
- source_word: θεοῦ πατρὸς
  choice: Gott, den Vater
  rationale: Die Apposition gibt die griechische Titelverbindung im Deutschen klar wieder und passt grammatisch zur Präposition „durch“.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: der ihn von den Toten auferweckt hat
  rationale: Das substantivierte Partizip bezieht sich auf Gott, den Vater. „Von den Toten auferweckt“ ist die geläufige und genaue deutsche Wiedergabe der Auferstehungsaussage.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  alternative: Jesus Christus
  rationale: Χριστός kann hier weiterhin als Titel verstanden werden. „Messias“ macht diesen Titelgehalt sichtbar, während die Fußnote die im Deutschen traditionelle, stärker namenähnliche Wiedergabe dokumentiert.
- issue: Bezug von τοῦ ἐγείραντος
  choice: auf Gott, den Vater
  alternative: auf Jesus, den Messias, und Gott, den Vater gemeinsam
  rationale: Das maskuline Genitiv-Singular-Partizip schließt unmittelbar an θεοῦ πατρός an und bestimmt daher Gott, den Vater, als denjenigen, der Jesus auferweckt hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, noch nicht abgeschlossene Satzform und das Schlusskomma werden beibehalten, weil der griechische Grußsatz im folgenden Vers weitergeht. Die Gegenüberstellung von Plural („Menschen“) und Singular („einen Menschen“) bleibt ausdrücklich erhalten.
