  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: de
  text: Doch selbst wenn wir oder ein Engel vom Himmel euch eine gute Botschaft verkünden würde, die von dem abweicht, was wir euch verkündet haben[a], soll er verflucht sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… die dem widerspricht, was wir euch als gute Botschaft verkündet haben“; auch möglich: „… die über das hinausgeht, was wir euch verkündet haben“. Das griechische Verb bedeutet „gute Botschaft verkünden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „soll er dem Bann verfallen sein“ beziehungsweise „auf ihm soll ein Fluch liegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Doch selbst wenn
  rationale: Gibt den starken Gegensatz von ἀλλά, die Hervorhebung durch καί und die Bedingung mit ἐάν in natürlichem Deutsch wieder.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: wir oder ein Engel vom Himmel
  rationale: Bewahrt die betonte Selbsteinbeziehung des Paulus und den gesteigerten Gegensatz zu einem himmlischen Boten.
- source_word: εὐαγγελίζηται
  choice: eine gute Botschaft verkünden sollte
  rationale: Gibt das griechische Verb transparent wieder, ohne an dieser Stelle das Substantiv „Evangelium“ einzusetzen.
- source_word: παρ’ ὃ
  choice: eine andere ... als die
  rationale: Bezeichnet hier eine Abweichung von der zuvor verkündeten Botschaft; die Formulierung ist idiomatisch und lässt neben dem Gegensatz auch die Nuance „abweichend von“ erkennen.
- source_word: εὐηγγελισάμεθα
  choice: wir euch verkündet haben
  rationale: Hält die Wortverbindung zum ersten Verb aufrecht und vermeidet zugleich eine schwerfällige vollständige Wiederholung.
- source_word: ἀνάθεμα ἔστω
  choice: soll er verflucht sein
  rationale: Bewahrt die feierliche und gerichtliche Schärfe der Fluchformel in verständlichem modernem Deutsch.
theological_decisions:
- issue: Bedeutung der Fluchformel ἀνάθεμα ἔστω
  choice: soll er verflucht sein
  alternative: soll er dem Bann verfallen sein; auf ihm soll ein Fluch liegen
  rationale: Die Formulierung gibt ein wirkliches Fluchurteil wieder, ohne den Ausdruck auf einen späteren kirchenrechtlichen Begriff der Exkommunikation festzulegen.
- issue: Bedeutungsumfang von παρ’ ὃ
  choice: eine andere gute Botschaft ... als die
  alternative: eine gute Botschaft im Widerspruch zu dem; über das hinaus, was
  rationale: Im polemischen Zusammenhang steht die Abweichung von der apostolischen Verkündigung im Vordergrund. Eine Fußnote bewahrt die echte Bedeutungsbreite der Präposition.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gute Botschaft verkünden“ bildet das griechische Verb quellentransparent ab; „verflucht“ erhält die ernste, zugängliche Sprache des Satzes. Alle Fußnotenmarker stehen im Haupttext.
