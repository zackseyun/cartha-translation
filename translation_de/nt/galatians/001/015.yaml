id: GAL.1.15
reference: Galatians 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: de
  text: Als es aber dem gefiel, der mich vom Mutterleib an ausgesondert und durch seine Gnade berufen hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Geburt an“; vergleiche die Sprache prophetischer Berufung in Jeremia 1,5 und Jesaja 49,1.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Als es aber
  rationale: Bewahrt sowohl den zeitlichen Sinn von ὅτε als auch die leicht kontrastierende beziehungsweise weiterführende Funktion von δέ und lässt den im folgenden Vers fortgesetzten Satz offen.
- source_word: εὐδόκησεν
  choice: dem gefiel
  rationale: Gibt das göttliche Wohlgefallen wieder, ohne den Ausdruck auf einen bloßen Entschluss oder Willensakt zu reduzieren.
- source_word: ὁ ἀφορίσας με
  choice: der mich … ausgesondert hat
  rationale: Das substantivierte Partizip wird natürlich als Relativsatz wiedergegeben. „Ausgesondert“ bewahrt den Gedanken einer besonderen Bestimmung, ohne ausdrücklich eine bestimmte Lehre von Erwählung oder Vorherbestimmung einzutragen.
- source_word: ἐκ κοιλίας μητρός μου
  choice: vom Mutterleib an
  rationale: Bewahrt das konkrete biblische Bild und gibt ἐκ idiomatisch wieder; der zeitliche Anfangspunkt bleibt offen zwischen vorgeburtlicher Aussonderung und Aussonderung von Geburt an.
- source_word: καλέσας
  choice: berufen hat
  rationale: „Berufen“ entspricht im Deutschen dem paulinischen und auftragsbezogenen Gewicht von καλέω besser als das allgemeinere „gerufen“.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: durch seine Gnade
  rationale: Gibt διά mit Genitiv als vermittelndes Mittel wieder und hält die Gnade als Grundlage beziehungsweise Wirkmittel der Berufung fest.
theological_decisions:
- issue: Ob ἀφορίσας mit einer ausdrücklichen Lehre von Erwählung oder Vorherbestimmung wiederzugeben ist
  choice: ausgesondert
  alternative: erwählt; bestimmt
  rationale: Der griechische Ausdruck trägt die Vorstellung göttlicher Absonderung für einen Auftrag, vermutlich in prophetischer Berufungssprache, verlangt aber keine systematisch-dogmatische Präzisierung.
- issue: Ob ἐκ κοιλίας μητρός μου eindeutig vorgeburtlich oder als „von Geburt an“ zu verstehen ist
  choice: vom Mutterleib an
  alternative: noch im Mutterleib; von Geburt an
  rationale: Die bildhafte Formulierung lässt die zeitliche Nuance offen. Die Übersetzung wahrt diese Spannung, statt sie einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bewusst unvollständig, da der Gedanke in Vers 16 fortgesetzt wird. „Dem … der“ vermeidet eine zusätzliche Gottesbezeichnung, die im griechischen Text an dieser Stelle nur aus dem Zusammenhang erschlossen wird.
