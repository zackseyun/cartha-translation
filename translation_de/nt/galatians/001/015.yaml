review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die zeitliche und leicht weiterführende Funktion von ὅτε δέ wieder und bewahrt die unvollständige Satzperiode für den Anschluss in V. 16. „dem gefiel, der …“ entspricht εὐδόκησεν mit dem substantivierten Partizip ὁ ἀφορίσας angemessen. „vom Mutterleib an“ gibt ἐκ κοιλίας μητρός μου idiomatisch und ohne unzulässige dogmatische Präzisierung wieder. „durch seine Gnade berufen hat“ bildet καλέσας διὰ τῆς χάριτος αὐτοῦ treffend ab.
  naturalness: Der Satz ist bewusst gehoben, aber im modernen würdigen Bibeldeutsch verständlich und grammatisch korrekt. Die Konstruktion „Als es aber dem gefiel, der …“ ist formell, jedoch nicht künstlich; sie lässt den folgenden Infinitivsatz in V. 16 erwartbar offen.
  terminology: „Ausgesondert“ wahrt den Sinn von ἀφορίζω, ohne „erwählt“ oder „vorherbestimmt“ einzutragen. „Berufen“ ist für Paulus und den Kontext einer göttlichen Berufung sachgerecht. Die Fußnote gibt die mögliche idiomatische Wiedergabe wieder und verweist passend auf die einschlägige prophetische Berufungssprache.
