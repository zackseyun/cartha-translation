  text: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί, ταῖς ἐκκλησίαις τῆς Γαλατίας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/002.yaml
  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: de
  text: 'und alle Brüder, die bei mir sind,[a] an die Gemeinden Galatiens:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Brüder und Schwestern, die bei mir sind«. Im Griechischen steht »Brüder«; das Wort kann hier Glaubende beider Geschlechter einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet diesen Mitabsenderhinweis mit Paulus in Vers 1; die Kleinschreibung wahrt den fortlaufenden Satzbau.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: alle Brüder, die bei mir sind
  rationale: Die Formulierung gibt sowohl πάντες als auch σὺν ἐμοὶ ausdrücklich wieder. ἀδελφοί ist grammatisch maskulin und wird im Haupttext formal als »Brüder« übersetzt; möglicherweise sind Glaubensgeschwister beider Geschlechter gemeint, was die Fußnote ausweist.
- source_word: ἐκκλησίαις
  choice: Gemeinden
  rationale: Im paulinischen Briefgruß bezeichnet ἐκκλησίαις die örtlichen christlichen Gemeinschaften; »Gemeinden« ist dafür im modernen Standarddeutsch die natürliche und etablierte Entsprechung.
- source_word: τῆς Γαλατίας
  choice: Galatiens
  rationale: Der Genitiv wird entsprechend der griechischen Konstruktion als deutscher Genitiv wiedergegeben und lässt die geografische Zuordnung in ihrer knappen Form bestehen.
theological_decisions:
- issue: Möglicherweise geschlechtsübergreifende Bedeutung von ἀδελφοί
  choice: Im Haupttext »Brüder«, mit inklusiver Alternative in der Fußnote
  alternative: »Brüder und Schwestern« beziehungsweise »Glaubensgeschwister« im Haupttext
  rationale: Die gewählte Fassung bildet die grammatisch maskuline Ausgangsform sichtbar ab, ohne auszuschließen, dass Paulus Männer und Frauen gemeinsam meint.
translation_notes:
  register: Moderner, würdiger Briefstil. Der Vers bleibt als Fortsetzung von Vers 1 kleingeschrieben und endet entsprechend der Anredeformel mit einem Doppelpunkt.
