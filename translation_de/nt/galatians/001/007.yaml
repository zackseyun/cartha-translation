revisions:
- from: Dabei gibt es gar kein anderes Evangelium. Es gibt nur einige, die euch in Verwirrung bringen und das Evangelium des Messias[a] verdrehen[b] wollen.
  to: Das ist jedoch kein anderes Evangelium; vielmehr gibt es einige, die euch verwirren und das Evangelium des Messias[a] verdrehen[b] wollen.
  rationale: Die Revision stellt den Rückbezug von ὃ auf das zuvor genannte Evangelium mit „Das ist“ ausdrücklich her und gibt die durch εἰ μή eingeleitete Erklärung mit einem natürlichen, kontrastiven Anschluss wieder. Sie vermeidet eine nicht notwendige Verstärkung durch „gar“, erhält die moderne Sprache und bewahrt die bestehenden, korrekt verankerten lexikalischen Fußnoten.
