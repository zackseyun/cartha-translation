  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: de
  text: Das ist jedoch kein anderes Evangelium; vielmehr gibt es einige, die euch verwirren und das Evangelium des Messias[a] verdrehen[b] wollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Christus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verfälschen“ beziehungsweise „ins Gegenteil verkehren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ οὐκ ἔστιν ἄλλο
  choice: Dabei gibt es gar kein anderes Evangelium
  rationale: Das Relativpronomen knüpft an das in Vers 6 genannte Evangelium an. „Evangelium“ wird zur Verständlichkeit ergänzt; „gar kein anderes“ gibt die nachdrückliche Verneinung wieder.
- source_word: εἰ μή
  choice: Es gibt nur
  rationale: Die Wendung leitet hier keine gewöhnliche Bedingung ein, sondern erklärt die tatsächliche Lage im Gegensatz zu einem weiteren Evangelium. Die deutsche Formulierung bildet diesen Gedankengang natürlich ab.
- source_word: ταράσσοντες
  choice: die euch in Verwirrung bringen
  rationale: Die Wendung erfasst sowohl die Beunruhigung als auch die geistige Verwirrung, die das Verb in diesem Zusammenhang ausdrücken kann.
- source_word: θέλοντες
  choice: wollen
  rationale: „Wollen“ gibt die Absicht der betreffenden Personen knapp und idiomatisch wieder.
- source_word: μεταστρέψαι
  choice: verdrehen
  rationale: Das Verb bezeichnet eine entstellende Veränderung ins Gegenteil oder in eine verfälschte Form. „Verdrehen“ ist gegenwärtig, verständlich und bewahrt die Schärfe.
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: „Evangelium“ ist im Deutschen der etablierte paulinische Begriff und bewahrt hier den fachsprachlichen und theologischen Gehalt.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός hat in dieser Genitivverbindung weiterhin titelhaften Charakter. „Messias“ hält den jüdisch-messianischen Bezugsrahmen sichtbar; „Christus“ bleibt eine mögliche traditionelle Wiedergabe.
theological_decisions:
- issue: Χριστοῦ als Titel oder nameähnliche Bezeichnung
  choice: des Messias
  alternative: des Christus
  rationale: Die Formulierung kann das Evangelium bezeichnen, das dem Messias zugehört, von ihm ausgeht oder ihn zum Inhalt hat. Der Genitiv wird nicht näher festgelegt, und die titelbezogene Wiedergabe „Messias“ bewahrt diese Offenheit.
- issue: Verhältnis zu einem vermeintlich anderen Evangelium
  choice: gar kein anderes Evangelium
  alternative: kein anderes
  rationale: Paulus erkennt die konkurrierende Botschaft nicht als zweites echtes Evangelium an. „Gar“ verdeutlicht die im Griechischen vorhandene nachdrückliche Verneinung, ohne die folgende Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei kurzen Hauptsätze machen Paulus’ Korrektur verständlich, ohne den Gegensatz zwischen „kein anderes“ und den tatsächlich auftretenden Verwirrern einzuebnen. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
