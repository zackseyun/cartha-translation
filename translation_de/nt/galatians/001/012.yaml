id: GAL.1.12
reference: Galatians 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: de
  text: Denn ich habe es weder von einem Menschen empfangen noch bin ich darin unterwiesen worden, sondern durch eine Offenbarung Jesu, des Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung kann eine Offenbarung meinen, die von Jesus, dem Messias, kommt, oder eine Offenbarung über ihn.
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: von einem Menschen
  rationale: Der Singular ist allgemein gebraucht und bezeichnet einen menschlichen Ursprung beziehungsweise Vermittler, ohne eine bestimmte Person zu meinen.
- source_word: παρέλαβον
  choice: habe … empfangen
  rationale: „Empfangen“ gibt den üblichen Sinn bei der Weitergabe einer Botschaft oder Überlieferung wieder.
- source_word: ἐδιδάχθην
  choice: wurde … darin unterwiesen
  rationale: Die passive Form bezeichnet erhaltene Unterweisung. „Darin“ nimmt den Inhalt des zuvor genannten „es“ auf, ohne einen Lehrer hinzuzufügen.
- source_word: δι’ ἀποκαλύψεως
  choice: durch eine Offenbarung
  rationale: „Durch“ gibt διά als Mittel wieder; der unbestimmte Artikel lässt die Offenbarung als konkretes Geschehen erkennen.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu, des Messias
  rationale: Die deutsche Genitivfügung bleibt wie das Griechische offen dafür, ob Jesus der Urheber oder der Inhalt der Offenbarung ist. Χριστός wird als Titel mit „Messias“ wiedergegeben.
theological_decisions:
- issue: Bedeutung des Genitivs in ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: Die mehrdeutige Genitivfügung „eine Offenbarung Jesu, des Messias“ bleibt im Haupttext erhalten.
  alternative: „eine Offenbarung von Jesus, dem Messias“ oder „eine Offenbarung über Jesus, den Messias“
  rationale: Der Zusammenhang legt eine von Jesus ausgehende Offenbarung nahe, doch die Grammatik erlaubt ebenso eine Offenbarung über ihn. Der Haupttext entscheidet diese echte Mehrdeutigkeit nicht stillschweigend; die Fußnote erläutert beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weder-noch-Struktur wahrt den Nachdruck des griechischen Satzes; „darin unterwiesen“ ist natürlich und vermeidet eine unnötige Ergänzung eines menschlichen Lehrers.
