  source_fidelity: 'Die Übersetzung gibt die Partizipialkonstruktion in ihrem fortlaufenden Satzkontext angemessen wieder. „Sich selbst ... hingegeben hat“ trifft τοῦ δόντος ἑαυτόν idiomatisch; „für unsere Sünden“ bewahrt die offene, soteriologisch gewichtige Funktion von ὑπέρ. Der Finalsatz „um uns ... herauszuretten“ entspricht ὅπως mit Konjunktiv und ἐξέληται. „Aus dem gegenwärtigen bösen Zeitalter“ gibt ἐκ ... αἰῶνος τοῦ ἐνεστῶτος πονηροῦ präzise wieder. Die abschließende Wortgruppe bezeichnet, wie im Griechischen, eine einzige Bezugsperson: Gott, der zugleich unser Vater ist.'
