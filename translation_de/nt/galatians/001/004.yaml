id: GAL.1.4
reference: Galatians 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: de
  text: der sich selbst für unsere Sünden hingegeben hat, um uns aus dem gegenwärtigen bösen Zeitalter[a] herauszuretten, nach dem Willen unseres Gottes und Vaters,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der gegenwärtigen bösen Welt“.'
    reason: Lexikalische Alternative für αἰών; „Welt“ ist traditionell geläufig, aber weniger genau als „Zeitalter“.
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: der sich selbst … hingegeben hat
  rationale: Die Formulierung gibt die freiwillige Selbsthingabe natürlich und würdevoll wieder. „Gab“ wäre formal möglich, klingt im Deutschen in dieser Verbindung jedoch weniger idiomatisch.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  rationale: „Für“ bewahrt den sühne- und erlösungsbezogenen Sinn, ohne eine bestimmte Theorie der Sühne in den Wortlaut einzutragen.
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: um uns … herauszuretten
  rationale: „Herausretten“ bildet sowohl die Befreiung aus einer beherrschenden Lage als auch die im Verb enthaltene Herausbewegung ab. Der Zwecksatz wird im Deutschen idiomatisch mit „um … zu“ wiedergegeben.
- source_word: ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: aus dem gegenwärtigen bösen Zeitalter
  rationale: „Zeitalter“ wahrt den zeitlich-kosmischen Sinn von αἰών genauer als „Welt“; „gegenwärtig“ und „böse“ entsprechen den beiden attributiven Bestimmungen.
- source_word: κατὰ τὸ θέλημα
  choice: nach dem Willen
  rationale: Die geläufige deutsche Wendung drückt die Übereinstimmung mit Gottes Absicht präzise aus.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: unseres Gottes und Vaters
  rationale: Die Formulierung bewahrt die gemeinsame Bezugsperson und die enge Verbindung beider Bezeichnungen.
theological_decisions:
- issue: Bedeutungsumfang von ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: für unsere Sünden
  alternative: wegen unserer Sünden; zugunsten von uns hinsichtlich unserer Sünden
  rationale: Der griechische Ausdruck trägt erlösende und stellvertretende Bedeutung, legt hier aber keine vollständig ausgearbeitete Sühnetheorie fest. Die knappe Wiedergabe erhält diese Offenheit.
- issue: Wiedergabe von αἰών
  choice: Zeitalter
  alternative: Welt
  rationale: αἰών bezeichnet vorrangig die gegenwärtige zeitlich-kosmische Ordnung. „Zeitalter“ hält diesen Gedanken sichtbar, während „Welt“ räumlich oder auf die Schöpfung bezogen missverstanden werden könnte.
- issue: Finalität von ὅπως mit Konjunktiv
  choice: um uns … herauszuretten
  alternative: damit er uns … herausrette
  rationale: Beide Wiedergaben drücken den Zweck aus. Die Infinitivkonstruktion ist im modernen Deutsch natürlicher und behält Jesus Christus als handelndes Subjekt aus dem Kontext bei.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit verständlicher Satzführung. Der Relativanschluss „der“ sowie das abschließende Komma setzen den fortlaufenden Satz aus Galater 1,3–5 voraus. „Hingegeben“ und „herauszuretten“ vermitteln freiwillige Selbsthingabe und wirksame Befreiung, ohne konfessionelle Zusatzdeutungen.
