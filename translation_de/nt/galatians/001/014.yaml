  source_fidelity: 'Der Haupttext gibt den griechischen Satz zuverlässig wieder: Das Imperfekt προέκοπτον ist als andauernder Fortschritt formuliert, der Vergleich zu πολλοὺς συνηλικιώτας bleibt erhalten, und ἐν τῷ γένει μου wird angemessen als Zugehörigkeit zum eigenen Volk wiedergegeben. „Weit eifriger“ trifft die verstärkende Vergleichsform περισσοτέρως. „Überlieferungen meiner Vorfahren“ gibt τῶν πατρικῶν μου παραδόσεων idiomatisch und sachlich angemessen wieder.'
  naturalness: Der Satz ist modernes, gut lesbares Standarddeutsch und wahrt einen würdigen Registerton. Die Satzverbindung mit „und war“ ist gegenüber einer partizipialen Nachbildung natürlich. „Altersgenossen“ ist präzise und unauffällig.
