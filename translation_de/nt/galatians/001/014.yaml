  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: de
  text: Und ich machte im Judentum[a] größere Fortschritte als viele Altersgenossen in meinem Volk und war weit eifriger für die Überlieferungen meiner Vorfahren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der jüdischen Religion“ beziehungsweise „in der jüdischen Lebensweise“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für meine von den Vätern stammenden Überlieferungen“; gemeint sind die von den Vorfahren überlieferten Traditionen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: machte … größere Fortschritte
  rationale: Das Imperfekt bezeichnet einen fortdauernden Vorgang in der Vergangenheit. Die deutsche Wendung bewahrt sowohl den Gedanken des Fortschreitens als auch den durch ὑπέρ ausgedrückten Vergleich.
- source_word: Ἰουδαϊσμῷ
  choice: im Judentum
  rationale: „Judentum“ ist die knappe, geläufige Bezeichnung und lässt offen, ob hier besonders die Religion oder umfassender die jüdische Lebensweise gemeint ist.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: größere Fortschritte als viele Altersgenossen
  rationale: ὑπέρ hat hier vergleichende Bedeutung; συνηλικιώτας bezeichnet Menschen gleichen Alters. „Altersgenossen“ gibt diesen Bezug präzise und natürlich wieder.
- source_word: ἐν τῷ γένει μου
  choice: in meinem Volk
  rationale: γένος bezeichnet hier die ethnische beziehungsweise gemeinschaftliche Zugehörigkeit. „In meinem Volk“ ist im heutigen Deutsch klarer und weniger missverständlich als „in meinem Geschlecht“.
- source_word: περισσοτέρως
  choice: weit eifriger
  rationale: Das Adverb verstärkt den vergleichenden Gedanken. „Weit eifriger“ gibt diese Steigerung idiomatisch wieder.
- source_word: ζηλωτὴς ὑπάρχων
  choice: war … eifriger für
  rationale: Die Formulierung gibt die partizipiale Zustandsbeschreibung in natürlichem Deutsch wieder, ohne ζηλωτής politisch oder technisch als „Zelot“ einzuengen.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: für die Überlieferungen meiner Vorfahren
  rationale: πατρικός verweist auf das von den Vätern beziehungsweise Vorfahren Ererbte; παραδόσεις sind weitergegebene Überlieferungen. Die Formulierung ist verständlich und wahrt den Herkunftsbezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem Gedankengang des griechischen Textes, wird aber für einen natürlichen deutschen Lesefluss leicht gegliedert. Die Wiedergabe vermeidet sowohl das heute missverständliche „Geschlecht“ für γένος als auch eine politische Verengung von ζηλωτής.
