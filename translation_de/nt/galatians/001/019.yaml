  source_fidelity: 'Der deutsche Haupttext gibt die griechische Konstruktion sachgerecht wieder: ἕτερον τῶν ἀποστόλων wird mit „von den anderen Aposteln ... keinen“ partitiv erfasst, οὐκ εἶδον als vergangene Verneinung und εἰ μὴ als Ausnahme mit „außer“. „Jakobus, dem Bruder des Herrn“ entspricht dem Akkusativ mit Apposition im Deutschen. Die durch die Syntax mögliche, aber weniger naheliegende Frage nach Jakobus’ apostolischer Einordnung wird nicht in den Haupttext eingetragen.'
