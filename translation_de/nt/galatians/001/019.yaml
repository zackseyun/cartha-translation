id: GAL.1.19
reference: Galatians 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: de
  text: Von den anderen Aposteln sah ich aber keinen außer Jakobus[a], dem Bruder des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einen anderen Apostel sah ich aber nicht – nur Jakobus, den Bruder des Herrn.« Manche verstehen diese Formulierung so, dass Jakobus damit nicht zu den Aposteln gerechnet wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: von den anderen … keinen
  rationale: In der partitiven Verbindung mit τῶν ἀποστόλων bezeichnet ἕτερον einen anderen aus dieser Gruppe. Die deutsche Formulierung gibt diese Zugehörigkeit natürlich wieder.
- source_word: δέ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise eine Weiterführung gegenüber dem vorangehenden Satz.
- source_word: ἀποστόλων
  choice: Aposteln
  rationale: Im paulinischen Zusammenhang ist »Apostel« der etablierte und klare Begriff.
- source_word: οὐκ εἶδον
  choice: sah ich … keinen
  rationale: Die Formulierung gibt die Vergangenheitsform und die Verneinung direkt und idiomatisch wieder.
- source_word: εἰ μὴ
  choice: außer
  rationale: εἰ μή leitet hier idiomatisch eine Ausnahme und keine Bedingung ein.
- source_word: Ἰάκωβον
  choice: Jakobus
  rationale: »Jakobus« ist die im Deutschen etablierte Namensform.
- source_word: ἀδελφὸν
  choice: Bruder
  rationale: Die gewöhnliche und unmittelbarste Bedeutung ist »Bruder«; der Kontext verlangt keine Abschwächung zu einer allgemeineren Verwandtschaftsbezeichnung.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Die Genitivverbindung wird natürlich wiedergegeben und der Titel κύριος entsprechend dem üblichen deutschen Bibelgebrauch als »Herr« übersetzt.
theological_decisions:
- issue: Ob Jakobus in dieser Konstruktion zu den Aposteln gerechnet wird
  choice: 'Der Haupttext gibt den naheliegendsten syntaktischen Sinn wieder: Paulus sah keinen anderen Apostel außer Jakobus; damit erscheint Jakobus als die genannte Ausnahme innerhalb der Gruppe.'
  alternative: Manche verstehen den Satz so, dass Paulus außer Petrus keinen weiteren Apostel sah, wohl aber zusätzlich Jakobus, ohne ihn damit unbedingt als Apostel einzuordnen.
  rationale: εἰ μή führt am natürlichsten eine Ausnahme zu »keinen von den anderen Aposteln« ein. Da die Konstruktion jedoch anders gedeutet worden ist, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von »Von den anderen Aposteln« bewahrt die partitive Struktur des Griechischen, ohne unnatürlich zu wirken; die echte syntaktisch-theologische Spannung wird durch die Fußnote offengehalten.
