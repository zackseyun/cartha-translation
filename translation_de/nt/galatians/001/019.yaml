  terminology: „Apostel“, „Jakobus“, „Bruder“ und „Herr“ sind etablierte deutsche Bibeltermini und übersetzen die maßgeblichen griechischen Ausdrücke unmittelbar. Die Fußnote verwendet eine verständliche alternative Formulierung und stellt die Auslegungsfrage ohne konfessionelle Festlegung dar.
