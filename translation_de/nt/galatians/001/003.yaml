  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: de
  text: Gnade und Frieden seien mit euch von Gott, dem Vater, und unserem Herrn[b] Jesus, dem Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus“.'
    reason: Alternative Wiedergabe von Χριστός in seiner traditionell nameähnlichen Form.
  - marker: b
    text: Einige Handschriften lassen „und unserem Herrn“ aus.
    reason: Die Wortgruppe καὶ κυρίου ἡμῶν ist im SBLGNT textkritisch als unsicher gekennzeichnet.
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der etablierte deutsche Ausdruck bewahrt sowohl den Charakter des Grußes als auch die theologische Bedeutung des Wortes bei Paulus.
- source_word: ὑμῖν
  choice: seien mit euch
  rationale: Die griechische Grußformel ist elliptisch; diese idiomatische deutsche Segensformel gibt den Dativ natürlich wieder.
- source_word: εἰρήνη
  choice: Frieden
  rationale: „Frieden“ bewahrt den jüdischen Grußhintergrund und die umfassende theologische Bedeutung.
- source_word: ἀπό
  choice: von
  rationale: Die Präposition bezeichnet Gott und den Herrn Jesus als Quelle von Gnade und Frieden.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Diese Wiedergabe folgt der unmittelbar vorliegenden Wortgruppe, ohne das nachgestellte ἡμῶν stillschweigend auf πατρός zu beziehen.
- source_word: κυρίου ἡμῶν
  choice: unserem Herrn
  rationale: Das nachgestellte ἡμῶν steht syntaktisch am nächsten bei κυρίου und wird daher im Haupttext darauf bezogen; die verbreitete alternative Zuordnung wird in einer Fußnote genannt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, dem Messias
  rationale: Χριστός hat hier weiterhin Titelfunktion. Die Apposition mit Artikel ist im Deutschen natürlich und macht „Messias“ als Titel verständlich.
theological_decisions:
- issue: Zuordnung des nachgestellten ἡμῶν
  choice: „Gott, dem Vater, und unserem Herrn“
  alternative: „Gott, unserem Vater, und dem Herrn“
  rationale: Die Stellung von ἡμῶν nach κυρίου spricht unmittelbar für die Zuordnung zu „Herrn“; aufgrund der möglichen beziehungsweise traditionell verbreiteten Zuordnung zu „Vater“ bleibt die Alternative ausdrücklich erhalten.
- issue: Wiedergabe von Χριστοῦ als Titel oder als traditionell nameähnliche Form
  choice: „dem Messias“
  alternative: „Christus“
  rationale: In der Grußformel bezeichnet Χριστός Jesus weiterhin mit seinem messianischen Titel. Die traditionelle Form wird als Alternative in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Segensformel vermeidet eine unnatürliche wörtliche Nachbildung der griechischen Ellipse; „Messias“ bleibt als verständlicher Titel erkennbar.
