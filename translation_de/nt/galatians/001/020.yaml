  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: de
  text: 'Was ich euch aber schreibe – seht: Vor Gott lüge ich nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ
  choice: Was
  rationale: Das neutrale relative Pluralpronomen bezeichnet idiomatisch den Inhalt dessen, was Paulus schreibt; im Deutschen gibt „was“ dies natürlich wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen leichten Übergang mit möglichem Kontrast. „Aber“ ist knapp und entspricht dem griechischen Diskurspartikel, ohne einen nicht vorhandenen Zeitbegriff einzuführen.
- source_word: γράφω ὑμῖν
  choice: ich euch schreibe
  rationale: Das Präsens und der Dativ der Empfänger werden im Deutschen idiomatisch und unmittelbar wiedergegeben.
- source_word: ἰδοὺ
  choice: seht
  rationale: Die aufmerksamkeitslenkende, feierlich verstärkende Partikel wird mit dem gegenwärtigen und dennoch würdevollen „seht“ sichtbar ausgedrückt.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die feste Wendung bewahrt die Vorstellung göttlicher Gegenwart und Rechenschaft sowie den feierlichen, beinahe eidlichen Charakter.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet den Inhalt der feierlichen Bekräftigung ein; ein Doppelpunkt gibt diese Funktion im Deutschen natürlich wieder.
- source_word: οὐ ψεύδομαι
  choice: Ich lüge nicht
  rationale: Die direkte Präsensverneinung erhält Paulus’ nachdrückliche Wahrheitsbeteuerung.
theological_decisions:
- issue: Charakter der Berufung auf Gott
  choice: '„vor Gott: Ich lüge nicht“ als feierliche, Gott zum Zeugen nehmende Wahrheitsbekräftigung'
  alternative: Die Wendung lediglich als allgemeine Verstärkung zu verstehen oder zu einem ausdrücklichen Schwur auszubauen
  rationale: ἐνώπιον τοῦ θεοῦ stellt Paulus’ Aussage unter Gottes Gegenwart und Urteil, enthält aber keine ausdrücklich formulierte Schwurformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ wahrt die feierliche Hervorhebung von ἰδού, ohne das altertümlichere „siehe“ zu verwenden. Der Gedankenstrich und der Doppelpunkt bilden die zugespitzte Bekräftigung des griechischen Satzes ab.
