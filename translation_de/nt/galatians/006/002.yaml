base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: de
  text: Tragt einander die Lasten, und so werdet ihr das Gesetz des Messias[a] erfüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christi“.'
    reason: Alternative traditionelle Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: ἀλλήλων
  choice: einander
  rationale: Das reziproke Pronomen bezeichnet die gegenseitige Verantwortung innerhalb der Gemeinschaft; „einander“ gibt diese Wechselseitigkeit knapp und natürlich wieder.
- source_word: τὰ βάρη
  choice: die Lasten
  rationale: βάρη bezeichnet wörtlich Gewichte oder Lasten und hier bildlich Belastungen, die Menschen zu tragen haben. „Lasten“ bewahrt das Bild und passt zum Verb „tragen“.
- source_word: βαστάζετε
  choice: Tragt
  rationale: Der Imperativ Präsens im Plural fordert die Adressierten zu einer fortdauernden gemeinschaftlichen Praxis auf. „Tragt“ ist direkt, verständlich und wahrt das Lastenbild.
- source_word: οὕτως
  choice: so
  rationale: 'Das Adverb bezeichnet die Art und Weise beziehungsweise die daraus folgende Verwirklichung: Indem sie einander die Lasten tragen, erfüllen sie das genannte Gesetz.'
- source_word: ἀναπληρώσετε
  choice: werdet ihr … erfüllen
  rationale: Der Futur Indikativ wird formal als Zukunftsform wiedergegeben und beschreibt die Folge des vorangehenden Gebots. „Ein Gesetz erfüllen“ ist im Deutschen idiomatisch und bewahrt den paulinischen Ausdruck.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: νόμος bedeutet hier „Gesetz“; diese Wiedergabe erhält sowohl die ethische Verbindlichkeit als auch die theologische Spannung des Ausdrucks.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist der griechische Titel für den Gesalbten beziehungsweise Messias. Im Genitiv bezeichnet die Wendung das Gesetz, das dem Messias zugehört oder von ihm geprägt ist, ohne diese Beziehung enger festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: des Christus
  rationale: Die Übersetzung „Messias“ macht den Titelgehalt von Χριστός und seinen jüdisch-messianischen Hintergrund sichtbar. Die traditionelle deutsche Wiedergabe „Christus“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- issue: Beziehung zwischen Gesetz und Messias
  choice: Gesetz des Messias
  alternative: vom Messias gegebenes Gesetz / Gesetz, das der Messias verkörpert
  rationale: Der griechische Genitiv lässt offen, ob Zugehörigkeit, Urheberschaft oder inhaltliche Prägung im Vordergrund steht. Die knappe Genitivkonstruktion bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gebotsstil. Die Wortstellung „Tragt einander die Lasten“ ist natürlich und erhält das konkrete Bild des gegenseitigen Tragens. Der Fußnotenmarker steht unmittelbar bei der betroffenen Benennung.
