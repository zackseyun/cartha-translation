source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: de
  text: Und über alle, die sich nach diesem Maßstab richten[a], komme Frieden und Erbarmen – und über das Israel Gottes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „alle, die diesem Maßstab folgen“. Das Verb bezeichnet ein geordnetes Gehen in Übereinstimmung mit einer Norm; die Vorstellung des Gehens „in einer Reihe“ schwingt mit.'
    reason: lexical_alternative
  - marker: b
    text: '„Das Israel Gottes“ ist umstritten: Gemeint sein können jüdische Christusgläubige, die gesamte Gemeinde oder Gottes Volk in einem umfassenderen Sinn. Auch das vorausgehende „und“ kann entweder eine weitere Gruppe hinzufügen oder dieselbe Gruppe näher bezeichnen. Der griechische Wortlaut lässt dies offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: alle, die
  rationale: Gibt den umfassenden, unbestimmten Bezug des Relativpronomens im heutigen Deutsch natürlich wieder.
- source_word: κανόνι
  choice: Maßstab
  rationale: Bezeichnet hier eine Norm, an der das Leben ausgerichtet wird; „Maßstab“ ist verständlich und weniger gesetzlich gefärbt als „Regel“.
- source_word: στοιχήσουσιν
  choice: sich richten nach
  rationale: Gibt das geordnete Gehen in Übereinstimmung mit einer Norm idiomatisch wieder; die zugrunde liegende Vorstellung des In-der-Reihe-Gehens wird in der Fußnote erläutert.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Entspricht der üblichen Bedeutung und bewahrt den Segenscharakter.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Gängige, würdevolle Wiedergabe im Zusammenhang eines Segenswunsches.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: über sie ... und über
  rationale: Bewahrt die wiederholte Präposition und den feierlichen Segensklang des Griechischen.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: das Israel Gottes
  rationale: Bildet die Genitivkonstruktion transparent ab und lässt den umstrittenen Bezug der Wendung offen.
theological_decisions:
- issue: Bezug von „das Israel Gottes“
  choice: Die Wendung wird wörtlich wiedergegeben, ohne ihre Bezugsgruppe festzulegen.
  alternative: Gemeint sein könnten insbesondere jüdische Christusgläubige, die gesamte Gemeinde oder Gottes Volk in einem umfassenderen Sinn.
  rationale: Der griechische Wortlaut entscheidet die theologisch umstrittene Frage nicht eindeutig; die Übersetzung soll diese Spannung bewahren.
- issue: Bedeutung des letzten καί
  choice: Wiedergabe mit „und“, sodass eine zusätzliche oder eine erläuternd gleichgesetzte Gruppe möglich bleibt.
  alternative: „nämlich/ja über das Israel Gottes“ als ausdrückliche Gleichsetzung oder eine klar additive Formulierung als zweite Gruppe.
  rationale: καί kann hier additiv oder möglicherweise erläuternd/appositionell verstanden werden. Das einfache „und“ legt keine der beiden Deutungen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt lässt den anschließenden Segenswunsch klar hervortreten; der Gedankenstrich vor dem letzten Satzglied erhält dessen Eigengewicht, ohne die syntaktische und theologische Beziehung festzulegen.
