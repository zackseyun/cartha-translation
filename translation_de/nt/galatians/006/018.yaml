base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: de
  text: Die Gnade unseres Herrn Jesus Christus sei mit eurem Geist, Brüder[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort lautet wörtlich „Brüder“ (grammatisch männlich); im Gemeindekontext kann es die ganze Glaubensgemeinschaft, Männer wie Frauen, ansprechen. Alternativ: „Brüder und Schwestern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Der vertraute paulinische Segensbegriff bewahrt sowohl das unverdiente göttliche Wohlwollen als auch das theologische Gewicht der Schlussformel.
- source_word: κυρίου
  choice: Herrn
  rationale: Die übliche und sachlich angemessene Wiedergabe von κύριος entspricht hier dem frühchristlichen Bekenntnisgebrauch.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Christus
  rationale: Im modernen Deutschen ist „Jesus Christus“ die natürliche, würdevolle und allgemein verständliche Form; „Christus“ bleibt zugleich als messianischer Titel erkennbar.
- source_word: μετὰ τοῦ πνεύματος ὑμῶν
  choice: sei mit eurem Geist
  rationale: Das im Griechischen verblos formulierte Segenswort verlangt im Deutschen die Ergänzung „sei“. Der Singular „Geist“ bei pluralischem „eurem“ wird beibehalten und bewahrt die gemeinschaftlich angesprochene Form.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline griechische Plural kann eine gemischte Glaubensgemeinschaft einschließen. Die ausgeschriebene inklusive Wiedergabe vermittelt diese gemeinte Anrede im heutigen Deutsch eindeutig.
- source_word: ἀμήν
  choice: Amen
  rationale: Die traditionelle Übernahme bewahrt die liturgische Schlussformel.
theological_decisions:
- issue: Wiedergabe von Χριστός in der paulinischen Schlusssegnung
  choice: Christus
  alternative: Messias
  rationale: Χριστός trägt den Sinn „Messias/Gesalbter“, ist in der festen deutschen Verbindung „Jesus Christus“ jedoch weiterhin als Titel tradiert und vermeidet in dieser knappen Segensformel eine unnatürliche Ausdrucksweise. Die Bedeutung wird nicht in eine besondere konfessionelle Auslegung aufgelöst.
- issue: Anrede ἀδελφοί an die galatische Gemeinde
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die grammatisch maskuline Form bezeichnet im Kontext wahrscheinlich die gesamte Gemeinde. Die inklusive deutsche Anrede gibt den Referenzumfang wieder, während die Fußnote die Form des griechischen Ausdrucks offenlegt.
- issue: Bedeutung von πνεύματος ὑμῶν
  choice: eurem Geist
  alternative: euch
  rationale: Die konkrete Rede vom „Geist“ wird nicht zu einem allgemeinen Personalpronomen verflacht. So bleibt offen, ob Paulus den inneren Menschen jedes Einzelnen oder die Gemeinde in ihrer gemeinsamen geistlichen Existenz anspricht.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Segenscharakter. Die vertraute Formel „Jesus Christus“ und der Konjunktiv „sei“ entsprechen natürlichem kirchlichem Deutsch, ohne altertümlich zu wirken. Der im Ausgangstext auffällige Singular „Geist“ bleibt erhalten.
