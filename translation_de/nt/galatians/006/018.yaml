  terminology: „Gnade“, „Herr“, „Jesus Christus“, „Geist“ und „Amen“ sind terminologisch stimmig. „Christus“ ist in der festen deutschen Namens- und Titelform angemessen. Die englische Audit-Fußnote a ist in sich widersprüchlich (sie ist bei „spirit“ verankert, erklärt aber Christus/Messiah); dies begründet keine Übernahme einer entsprechenden deutschen Fußnote.
