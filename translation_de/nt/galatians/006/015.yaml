id: GAL.6.15
reference: Galatians 6:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: de
  text: Denn weder Beschneidung noch Unbeschnittensein gilt etwas, sondern eine neue Schöpfung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein neues Geschöpf“.'
    reason: Lexikalisch kann κτίσις sowohl die Schöpfung als auch ein geschaffenes Wesen bezeichnen; im Zusammenhang ist „neue Schöpfung“ wahrscheinlicher.
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Denn weder
  rationale: „Denn“ gibt den begründenden Anschluss durch γάρ wieder; „weder“ eröffnet die οὔτε–οὔτε-Konstruktion.
- source_word: περιτομή
  choice: Beschneidung
  rationale: Die übliche und sachlich genaue Wiedergabe; sie bewahrt sowohl den konkreten Ritus als auch die damit bezeichnete religiös-ethnische Zugehörigkeit.
- source_word: τί ἐστιν
  choice: gilt etwas
  rationale: Die knappe idiomatische Wendung bezeichnet hier Bedeutung oder maßgeblichen Wert. „Gilt etwas“ klingt im Deutschen natürlich und fügt keine nähere Art dieses Wertes hinzu.
- source_word: οὔτε ἀκροβυστία
  choice: noch Unbeschnittensein
  rationale: Gemeint ist der unbeschnittene Status als Gegenbegriff zur Beschneidung. „Unbeschnittensein“ ist im heutigen Deutsch klarer und natürlicher als das substantivierte „Unbeschnittenheit“.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der doppelten Verneinung stellt „sondern“ den scharfen Gegensatz des griechischen ἀλλά idiomatisch dar.
- source_word: καινὴ κτίσις
  choice: eine neue Schöpfung
  rationale: κτίσις kann „Schöpfung“ oder „Geschöpf“ bedeuten. „Neue Schöpfung“ bewahrt hier die umfassendere paulinische Aussage und die Spannung zwischen persönlicher Erneuerung und erneuerter Wirklichkeit.
theological_decisions:
- issue: Bedeutung des Gegensatzes zwischen Beschneidung, Unbeschnittensein und neuer Schöpfung
  choice: Beide religiös-ethnischen Statusmerkmale werden gegenüber der neuen Schöpfung als nicht maßgeblich bezeichnet.
  alternative: Der Satz bezieht sich ausschließlich auf gesellschaftliche Identitätsmerkmale oder erklärt beide Statusformen zu gleichwertigen Heilswegen.
  rationale: Der griechische Text spricht beiden Statusmerkmalen Bedeutung ab und stellt ihnen die neue Schöpfung gegenüber. Die Übersetzung wahrt diesen Gegensatz, ohne seine dogmatische Reichweite über den Wortlaut hinaus festzulegen.
- issue: Reichweite von καινὴ κτίσις
  choice: „eine neue Schöpfung“
  alternative: „ein neues Geschöpf“
  rationale: Beides ist lexikalisch möglich. Der Kontext und der paulinische Sprachgebrauch begünstigen die umfassendere Lesart „Schöpfung“, ohne eine persönliche Anwendung auszuschließen.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem biblischem Ton. „Gilt etwas“ bewahrt die pointierte Kürze des Griechischen; „Unbeschnittensein“ vermeidet unnötig fachsprachliche oder körperlich missverständliche Formulierungen.
