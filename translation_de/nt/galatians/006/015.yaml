  source_fidelity: 'Der Text gibt die Struktur und den Sinn des griechischen Satzes zuverlässig wieder: γάρ als begründendes „Denn“, die doppelte οὔτε-Konstruktion durch „weder … noch“, τί ἐστιν idiomatisch durch „gilt etwas“ und den Kontrast mit ἀλλά durch „sondern“. „Eine neue Schöpfung“ bildet καινὴ κτίσις angemessen ab, ohne die Aussage auf eine bloß individuelle Neuschöpfung einzuengen.'
  naturalness: „Denn weder Beschneidung noch Unbeschnittensein gilt etwas, sondern eine neue Schöpfung“ ist knapp, idiomatisch und in modernem Standarddeutsch gut verständlich. Die Ellipse nach „sondern“ entspricht der pointierten, verblosen Gegenüberstellung des Griechischen und ist im Deutschen stilistisch tragfähig.
