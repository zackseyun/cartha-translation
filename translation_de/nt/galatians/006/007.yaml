  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: de
  text: 'Lasst euch nicht täuschen: Gott lässt sich nicht verspotten. Denn was ein Mensch sät, das wird er auch ernten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Täuscht euch nicht
  rationale: Der verneinte Imperativ im Präsens warnt die angesprochenen Personen direkt davor, sich täuschen beziehungsweise irreführen zu lassen. Die idiomatische deutsche Wendung bewahrt sowohl den warnenden Ton als auch die mögliche passive Nuance.
- source_word: θεὸς
  choice: Gott
  rationale: Die übliche und kontextgemäße Wiedergabe von θεός.
- source_word: οὐ μυκτηρίζεται
  choice: lässt sich nicht verspotten
  rationale: μυκτηρίζω bezeichnet spöttische Verachtung oder Hohn. Die deutsche Konstruktion mit „lässt sich nicht“ gibt die passive Form natürlich wieder und erhält die prägnante, sprichwortartige Aussage.
- source_word: ὃ γὰρ ἐὰν
  choice: Denn was
  rationale: Die indefinite Relativkonstruktion formuliert eine allgemeingültige Bedingung. „Denn was“ ist im Deutschen knapp und idiomatisch.
- source_word: σπείρῃ
  choice: sät
  rationale: Die landwirtschaftliche Metapher wird wörtlich bewahrt und mit „ernten“ verbunden.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier im repräsentativen Singular einen Menschen allgemein. „Ein Mensch“ ist im Deutschen zugleich lexikalisch genau und ohne unnötige geschlechtliche Verengung verständlich.
- source_word: τοῦτο καὶ θερίσει
  choice: das wird er auch ernten
  rationale: Das Demonstrativpronomen „das“ nimmt exakt das Gesäte wieder auf; „auch“ bewahrt das korrelative καί und damit den Nachdruck auf der Entsprechung von Saat und Ernte.
theological_decisions:
- issue: Allgemeine Bedeutung von ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann
  rationale: Im Zusammenhang formuliert der maskuline Singular ein allgemeines Prinzip für jeden Menschen. Das deutsche „Mensch“ bildet sowohl die Wortbedeutung als auch den generischen Geltungsbereich ab, ohne die Aussage auf Männer zu beschränken.
- issue: Unabwendbarkeit der göttlichen Ordnung von Saat und Ernte
  choice: Gott lässt sich nicht verspotten
  alternative: Gott wird nicht verspottet
  rationale: Die gewählte idiomatische Form wahrt den Passivsinn, ohne zu behaupten, dass Menschen niemals versuchen, Gott zu verhöhnen. Der Zusammenhang betont vielmehr, dass solche Verachtung Gott nicht täuscht und die entsprechenden Folgen nicht außer Kraft setzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Satzführung. Die traditionelle Bildsprache von Säen und Ernten bleibt erhalten. Die englische Fußnote zum generischen Ausdruck ist im Deutschen nicht erforderlich, weil „ein Mensch“ Bedeutung und Reichweite von ἄνθρωπος unmittelbar wiedergibt.
