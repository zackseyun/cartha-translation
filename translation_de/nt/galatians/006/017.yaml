  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Textes zuverlässig wieder: Τοῦ λοιποῦ ist treffend als „Von nun an“ gefasst; die prohibitive Aufforderung κόπους μοι μηδεὶς παρεχέτω wird idiomatisch als „soll mir niemand mehr Mühe bereiten“ wiedergegeben; und βαστάζω τὰ στίγματα τοῦ Ἰησοῦ bleibt mit „ich trage die Male Jesu“ offen genug für die im Ausdruck liegenden Deutungsmöglichkeiten. „an meinem Körper“ ist für sichtbare körperliche Male eine angemessene deutsche Wiedergabe von ἐν τῷ σώματί μου.'
  naturalness: Modernes Standarddeutsch mit würdigem, paulinischem Register. „Mühe bereiten“ ist hier natürlich und entspricht dem idiomatischen Sinn von κόπους παρέχειν. Die Stellung von „mehr“ ist im Deutschen flüssig und verdeutlicht die zukunftsbezogene Abgrenzung, ohne den Grundtext unangemessen einzuengen.
  terminology: „Male Jesu“ bewahrt den nicht näher bestimmten Genitiv und vermeidet sowohl die Überfestlegung auf Narben als auch auf tatsächliche Brandmarkung. Die Fußnote bietet „Brandmale“ als legitime lexikalische Alternative und erklärt die mögliche Kennzeichnung von Besitz oder Zugehörigkeit sachlich und ohne konfessionelle Festlegung. Name und theologisch relevante Terminologie sind korrekt.
