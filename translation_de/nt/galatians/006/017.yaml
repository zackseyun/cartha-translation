id: GAL.6.17
reference: Galatians 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: de
  text: Von nun an soll mir niemand mehr Mühe bereiten; denn ich trage die Male[a] Jesu an meinem Körper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brandmale“. Das Wort kann körperliche Zeichen bezeichnen, die Besitz oder Zugehörigkeit kenntlich machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Von nun an
  rationale: Die Wendung hat hier zeitliche Bedeutung und leitet die abschließende Aufforderung idiomatisch ein.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: soll mir niemand mehr Mühe bereiten
  rationale: κόπους παρέχειν ist eine feste Verbindung im Sinn von Mühe oder Schwierigkeiten verursachen. Die deutsche Formulierung gibt das Verbot natürlich wieder; „mehr“ unterstreicht zusammen mit „von nun an“, dass dies künftig aufhören soll.
- source_word: τὰ στίγματα
  choice: die Male
  rationale: „Male“ bezeichnet körperliche Zeichen, ohne sie vorschnell ausschließlich als Narben oder Brandmale festzulegen. Die mögliche Bedeutung als Besitz- oder Zugehörigkeitszeichen wird in der Fußnote bewahrt.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Der Genitiv wird knapp und formal bewahrt. Dadurch bleibt offen, ob die Male von Leiden um Jesu willen stammen, die Zugehörigkeit zu Jesus anzeigen oder beides ausdrücken.
- source_word: ἐν τῷ σώματί μου
  choice: an meinem Körper
  rationale: Bei sichtbaren Malen ist „an meinem Körper“ im Deutschen natürlicher als das wörtliche „in meinem Körper“.
- source_word: βαστάζω
  choice: ich trage
  rationale: „Tragen“ entspricht dem Bedeutungsumfang des Verbs und bewahrt den feierlichen Ton der Aussage.
theological_decisions:
- issue: Art und Bedeutung der στίγματα des Paulus
  choice: Neutral als „die Male Jesu“ wiedergegeben
  alternative: „die Narben Jesu“, „die Brandmale Jesu“ oder ausdrücklich „Zeichen meiner Zugehörigkeit zu Jesus“
  rationale: Der Ausdruck kann körperliche Spuren erlittener Verfolgung bezeichnen und zugleich Zugehörigkeit zu Jesus ausdrücken. Der Vers legt sich nicht eindeutig auf nur eine dieser Nuancen fest; deshalb bleibt diese Spannung im Haupttext erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, während „Mühe bereiten“ und „an meinem Körper“ natürliches heutiges Deutsch bieten.
