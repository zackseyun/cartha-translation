review_pass:
  verdict: revise
  source_fidelity: Die Anrede und die Singular-/Pluralführung sind im Wesentlichen treffend. Die Fassung „von irgendeiner Verfehlung überrascht wird“ verschiebt jedoch die griechische Verbindung ἐν τινι παραπτώματι („in/bei einer Verfehlung“) dahin, dass die Verfehlung selbst als überraschend handelnde Größe erscheint. προλημφθῇ ist semantisch umstritten und kann ein Ertapptwerden ebenso wie ein Übereilt- bzw. Überwältigtwerden bezeichnen; die Hauptfassung sollte diese Mehrdeutigkeit nicht einseitig festlegen.
  naturalness: „Wieder zurechtbringen“ ist verständlich, doch „sollt“ gibt den imperativischen Charakter von καταρτίζετε abgeschwächt wieder. „Dann bringt ... wieder zurecht“ ist im Deutschen unmittelbar und natürlich. „Im Geist der Sanftmut“ ist gegenüber „in einem Geist der Sanftmut“ idiomatischer und zugleich formnah.
  terminology: „Brüder und Schwestern“ ist als moderne kommunikative Anrede mit der vorhandenen Fußnote vertretbar. „geistlich“, „Sanftmut“ und „versucht“ geben die entscheidenden Begriffe angemessen wieder. „Diese Person“ vermeidet nach dem generischen ἄνθρωπος eine unnötige geschlechtliche Festlegung und bewahrt den Singular.
  issues:
  - severity: medium
    issue: Die Präpositionalverbindung bei προλημφθῇ wird inhaltlich verschoben.
    rationale: „Von einer Verfehlung überrascht“ macht die Verfehlung zur Ursache des Überraschtwerdens, während ἐν τινι παραπτώματι die Situation bzw. den Bereich der Verfehlung bezeichnet. Eine Formulierung mit „in ... geraten“ bewahrt dies besser; die Fußnote kann die weiteren Deutungen dokumentieren.
  - severity: low
    issue: Der Imperativ καταρτίζετε ist durch „sollt“ abgeschwächt.
    rationale: Ein deutscher Imperativ gibt die direkte paränetische Kraft des griechischen Präsensimperativs besser wieder.
  - severity: low
    issue: „in einem Geist der Sanftmut“ ist weniger idiomatisch.
    rationale: „Im Geist der Sanftmut“ ist modernes, würdiges Standarddeutsch und lässt offen, ob πνεῦμα menschliche Haltung oder geistgewirkte Prägung bezeichnet.
  revised_text: Brüder und Schwestern,[a] wenn jemand in irgendeine Verfehlung geraten ist,[b] dann bringt ihr, die ihr geistlich seid, diese Person im Geist der Sanftmut wieder zurecht. Dabei achte du auf dich selbst, damit nicht auch du versucht wirst.
