reference: Galatians 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: de
  text: Brüder und Schwestern,[a] wenn jemand in irgendeine Verfehlung geraten ist,[b] dann bringt ihr, die ihr geistlich seid, diese Person im Geist der Sanftmut wieder zurecht. Dabei achte du auf dich selbst, damit nicht auch du versucht wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“. Die maskuline Pluralform kann hier die ganze Gemeinschaft der Glaubenden, also Brüder und Schwestern, anreden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei irgendeiner Verfehlung ertappt wird“, „von irgendeiner Verfehlung überrascht wird“ oder „von irgendeiner Verfehlung überwältigt wird“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural ist eine übliche Anrede an die Glaubensgemeinschaft und kann Männer und Frauen einschließen. Die ausgeschriebene Paarform gibt die gemeinte Adressatengruppe im heutigen Deutsch natürlich wieder; eine Fußnote weist auf die griechische Form hin.
- source_word: ἐὰν καὶ
  choice: selbst wenn
  rationale: Gibt den konditionalen Ausdruck mit seiner konzessiven Färbung prägnant wieder.
- source_word: προλημφθῇ
  choice: von … überrascht wird
  rationale: Das Passiv kann ausdrücken, dass die Verfehlung den Menschen ereilt oder überrascht. Diese Wiedergabe wahrt diesen möglichen Sinn; die Alternative „ertappt wird“ wird in einer Fußnote genannt.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier generisch eine menschliche Person; „Mensch“ bildet Numerus und allgemeinen Bezug genau und idiomatisch ab.
- source_word: ἔν τινι παραπτώματι
  choice: von irgendeiner Verfehlung
  rationale: παράπτωμα bezeichnet einen Fehltritt beziehungsweise eine Übertretung. „Verfehlung“ bewahrt den moralischen Ernst, ohne unnötig fachsprachlich zu wirken; τινι wird mit „irgendeiner“ wiedergegeben.
- source_word: οἱ πνευματικοὶ
  choice: ihr, die ihr geistlich seid
  rationale: Die substantivierte Adjektivform bezeichnet Menschen, die geistlich beziehungsweise vom Geist geprägt sind, ohne die genaue Nuance näher festzulegen.
- source_word: καταρτίζετε
  choice: sollt … wieder zurechtbringen
  rationale: Der Imperativ fordert dazu auf, die betroffene Person wieder in einen richtigen Zustand zu bringen. „Wieder zurechtbringen“ vermittelt Wiederherstellung statt bloßer Zurechtweisung.
- source_word: τὸν τοιοῦτον
  choice: ihn
  rationale: Das Pronomen nimmt den zuvor genannten „Menschen“ singularisch auf. Im Deutschen ist diese Wiederaufnahme natürlicher als „einen solchen“.
- source_word: ἐν πνεύματι πραΰτητος
  choice: in einem Geist der Sanftmut
  rationale: Die relativ formnahe Wendung bewahrt die mögliche Spannung zwischen menschlicher Haltung und einer vom Heiligen Geist geprägten Sanftmut.
- source_word: σκοπῶν σεαυτόν
  choice: Achte dabei auf dich selbst
  rationale: Der Singular des Partizips richtet die Warnung persönlich an jedes einzelne Mitglied der angesprochenen Gruppe. Ein eigener Imperativsatz bildet diese Funktion im Deutschen klar ab.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: damit nicht auch du versucht wirst
  rationale: Im moralischen Zusammenhang liegt „versucht werden“ näher als das ebenfalls mögliche „geprüft werden“. „Auch du“ wahrt die Betonung der gemeinsamen Anfälligkeit.
theological_decisions:
- issue: Reichweite der Anrede Ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die grammatisch maskuline griechische Anrede kann die gesamte Gemeinde umfassen. Die Paarform macht diesen wahrscheinlichen kommunikativen Bezug im modernen Deutsch sichtbar, während die Fußnote die Form des Ausgangstextes offenlegt.
- issue: Nuance von προλημφθῇ
  choice: von einer Verfehlung überrascht wird
  alternative: bei einer Verfehlung ertappt wird; von einer Verfehlung überwältigt wird
  rationale: Das Verb lässt offen, ob jemand von der Verfehlung ereilt oder bei ihr entdeckt wird. Die Hauptfassung bildet das Moment des Zuvorkommens ab, ohne die anderen Möglichkeiten zu verschweigen.
- issue: Bedeutung von πνεῦμα in ἐν πνεύματι πραΰτητος
  choice: Geist der Sanftmut
  alternative: sanftmütige Haltung; vom Geist gewirkte Sanftmut
  rationale: Die Übersetzung legt nicht fest, ob primär die menschliche innere Haltung oder deren Prägung durch Gottes Geist gemeint ist.
- issue: Bedeutung von πειρασθῇς
  choice: versucht wirst
  alternative: geprüft wirst
  rationale: Der Kontext einer Verfehlung und der eigenen Gefährdung spricht für Versuchung zum Sündigen; die breitere Bedeutung des Verbs wird jedoch als mögliche Alternative anerkannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Anrede ist inklusiv und gemeindenah; „Geist der Sanftmut“ bleibt bewusst etwas formnäher, um die Mehrdeutigkeit des griechischen Ausdrucks zu bewahren. Der Wechsel vom Plural zum Singular in der persönlichen Selbstwarnung wird deutlich wiedergegeben.
