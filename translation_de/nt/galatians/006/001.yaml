revisions:
- from: Brüder und Schwestern,[a] selbst wenn ein Mensch von irgendeiner Verfehlung überrascht wird,[b] sollt ihr, die ihr geistlich seid, ihn in einem Geist der Sanftmut wieder zurechtbringen. Achte dabei auf dich selbst, damit nicht auch du versucht wirst.
  to: Brüder und Schwestern,[a] wenn jemand in irgendeine Verfehlung geraten ist,[b] dann bringt ihr, die ihr geistlich seid, diese Person im Geist der Sanftmut wieder zurecht. Dabei achte du auf dich selbst, damit nicht auch du versucht wirst.
  rationale: Die Überarbeitung stellt die Verbindung von προλημφθῇ mit ἐν τινι παραπτώματι natürlicher dar, ohne die umstrittene genaue Nuance des Verbs zu entscheiden. Sie gibt den Imperativ von καταρτίζετε direkt wieder, glättet die deutsche Idiomatik und erhält die persönliche Warnung im Singular sowie die möglichen Bedeutungsnuancen in den Fußnoten.
  reviewer_model: gpt-5.6-terra
