  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: de
  text: Denn wenn jemand meint, etwas zu sein, obwohl er nichts ist, täuscht er sich selbst[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: macht sich selbst etwas vor.'
    reason: Lexikalische Alternative für φρεναπατᾷ mit stärker idiomatischer Wiedergabe der Selbsttäuschung.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Denn wenn
  rationale: Die Verbindung bewahrt sowohl die begründende Funktion von γάρ als auch den Bedingungssinn von εἰ und knüpft natürlich an die vorausgehende Ermahnung an.
- source_word: δοκεῖ
  choice: meint
  rationale: Das Verb bezeichnet hier die eigene Einschätzung, nicht den äußeren Anschein. „Meint“ ist im Deutschen klar und idiomatisch.
- source_word: τις
  choice: jemand
  rationale: Das unbestimmte Pronomen ist allgemein und repräsentativ gebraucht; „jemand“ gibt dies natürlich wieder.
- source_word: εἶναί τι
  choice: etwas zu sein
  rationale: Die knappe Wendung bezeichnet den Anspruch, Bedeutung oder Ansehen zu besitzen. Die relativ formnahe Wiedergabe erhält den pointierten Gegensatz zu „nichts“.
- source_word: μηδὲν ὤν
  choice: obwohl er nichts ist
  rationale: Das prädikative μηδέν mit dem Partizip ὤν wird im Kontext sinnvoll als zugestandener Gegensatz wiedergegeben. „Obwohl“ macht die Beziehung im Deutschen verständlich, ohne „nichts“ abzuschwächen.
- source_word: φρεναπατᾷ
  choice: täuscht
  rationale: Das Verb bezeichnet eine Täuschung oder Irreführung des eigenen Denkens. „Täuscht“ ist die klare standardsprachliche Entsprechung; die idiomatischere Alternative wird in der Fußnote genannt.
- source_word: ἑαυτόν
  choice: sich selbst
  rationale: Das Reflexivpronomen verweist auf das generisch gebrauchte singularische Subjekt zurück und wird im Deutschen natürlich mit „sich selbst“ wiedergegeben.
theological_decisions:
- issue: Generisch maskuline Einzelperson
  choice: jemand … er … sich selbst
  alternative: wer … derjenige täuscht sich selbst / Pluralform
  rationale: Der griechische Text spricht im Singular von einer repräsentativen Person. Das Deutsche kann nach „jemand“ mit dem singularischen Pronomen „er“ fortfahren, ohne den allgemeinen Geltungsbereich einzuschränken.
- issue: Aussage, jemand sei „nichts“
  choice: nichts ist
  alternative: unbedeutend ist
  rationale: Die wörtlich zugespitzte Gegenüberstellung von „etwas“ und „nichts“ bleibt erhalten. Eine Abschwächung zu „unbedeutend“ würde die rhetorische und theologische Spannung des Textes vorzeitig erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze antithetische Formulierung „etwas … nichts“ bleibt erhalten; „meint“ und „täuscht sich selbst“ sind allgemein verständlich, ohne den Ton umgangssprachlich werden zu lassen.
