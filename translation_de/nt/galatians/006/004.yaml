  terminology: „Tun“, „prüfen“ und „Grund zum Rühmen“ sind angemessen und bewahren die Breite sowie die theologische Offenheit des griechischen Textes. „Der andere“ sollte wegen des bestimmten griechischen Ausdrucks beibehalten werden; die Fußnote kann den Personenbezug erläutern.
