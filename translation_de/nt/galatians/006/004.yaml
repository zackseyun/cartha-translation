  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: de
  text: Doch jeder soll sein eigenes Tun prüfen. Dann wird er Grund zum Rühmen[a] haben, aber nur im Blick auf sich selbst und nicht im Blick auf den anderen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Ruhm“ oder einfach „sein Rühmen“. Das griechische Wort kann sowohl das Rühmen selbst als auch dessen Anlass oder Grundlage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den anderen“; gemeint ist eine andere Person im Gegensatz zu einem selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔργον ἑαυτοῦ
  choice: sein eigenes Tun
  rationale: „Tun“ bezeichnet hier natürlich und umfassend das eigene Handeln beziehungsweise Verhalten; es verengt den Ausdruck nicht auf eine einzelne Tat.
- source_word: δοκιμαζέτω
  choice: soll … prüfen
  rationale: Der Imperativ fordert dazu auf, das eigene Tun auf seine Beschaffenheit hin zu untersuchen, ohne ein positives Ergebnis vorwegzunehmen.
- source_word: ἕκαστος
  choice: jeder
  rationale: „Jeder“ bewahrt die distributive Kraft und den singularischen Bezug der folgenden Pronomen und Verben.
- source_word: καύχημα
  choice: Grund zum Rühmen
  rationale: Die Formulierung kann sowohl den Anlass beziehungsweise Gegenstand des Rühmens als auch das Rühmen selbst bezeichnen. Im Kontext gibt „Grund zum Rühmen“ den möglichen sachlichen Bezug klar wieder, ohne ihn als modernen „Stolz“ zu deuten.
- source_word: εἰς ἑαυτὸν μόνον
  choice: allein bei sich selbst
  rationale: 'Die idiomatische deutsche Wendung erhält den reflexiven Bezug und die Einschränkung durch μόνον: Maßstab ist das eigene geprüfte Tun, nicht der Vergleich mit jemand anderem.'
- source_word: τὸν ἕτερον
  choice: einem anderen Menschen
  rationale: Gemeint ist eine andere Person im Gegensatz zu einem selbst. Die ausdrückliche Ergänzung „Menschen“ macht diesen Personenbezug im Deutschen klar.
- source_word: δέ
  choice: Doch
  rationale: „Doch“ markiert den milden Kontrast beziehungsweise Übergang von der vorangehenden Warnung zur Aufforderung, das eigene Tun zu prüfen.
theological_decisions:
- issue: Bedeutung von καύχημα im paulinischen Zusammenhang
  choice: Grund zum Rühmen
  alternative: Ruhm; Rühmen; Grund, sich etwas zugutezuhalten
  rationale: Die Übersetzung lässt offen, ob dieses Rühmen positiv zu bewerten ist. Sie vermeidet es, einen modernen Begriff von Selbststolz oder eine bestimmte dogmatische Deutung einzutragen.
- issue: Vergleich mit dem anderen Menschen
  choice: allein bei sich selbst … nicht bei einem anderen Menschen
  alternative: nur im Blick auf sich selbst … nicht im Blick auf den anderen
  rationale: Die Formulierung bewahrt den Gegensatz zwischen der Prüfung des eigenen Tuns und einem vergleichenden Sich-Rühmen gegenüber anderen, ohne näher zu bestimmen, vor wem oder unter welchen Bedingungen das Rühmen geschieht.
- issue: Generisches grammatisches Maskulinum
  choice: jeder … sein … er
  alternative: alle … ihr; jeder Mensch … der eigene
  rationale: Der griechische Text verwendet einen singularischen generischen Personenbezug. Die deutsche Fassung spiegelt diesen mit dem herkömmlich generischen „jeder“ und den dazugehörigen singularischen Pronomen wider.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sein eigenes Tun prüfen“ ist allgemein verständlich und behält den ethischen Umfang des griechischen Ausdrucks. „Allein bei sich selbst“ gibt den Gedanken ohne unnötig schwerfällige Präpositionalwendung wieder. Die Fußnotenmarker stehen bei den Ausdrücken, auf die sich die jeweiligen lexikalischen Hinweise tatsächlich beziehen.
