id: GAL.6.12
reference: Galatians 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: de
  text: Alle, die im Fleisch einen guten Eindruck machen wollen[a], zwingen euch, euch beschneiden zu lassen. Das tun sie nur, damit sie nicht wegen des Kreuzes des Messias verfolgt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach außen hin gut dastehen wollen“. Gemeint ist hier wahrscheinlich eine vorteilhafte Wirkung durch äußerlich-körperliche Merkmale, besonders durch die Beschneidung.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „wegen des Kreuzes Christi“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅσοι
  choice: Alle, die
  rationale: Gibt die umfassende Bezeichnung einer Personengruppe im modernen Deutschen natürlich wieder.
- source_word: θέλουσιν εὐπροσωπῆσαι
  choice: einen guten Eindruck machen wollen
  rationale: Drückt sowohl die Absicht als auch die auf vorteilhafte äußere Selbstdarstellung zielende Bedeutung des seltenen Verbs verständlich aus.
- source_word: ἐν σαρκί
  choice: im Fleisch
  rationale: Bewahrt den paulinisch geprägten Ausdruck und seine mögliche körperliche, äußerliche und theologische Spannung; die Fußnote erläutert den Kontext.
- source_word: οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι
  choice: zwingen euch, euch beschneiden zu lassen
  rationale: Erhält die Betonung der handelnden Personen im Kontext und gibt den anhaltenden Zwang sowie die passive Bedeutung des Infinitivs idiomatisch wieder.
- source_word: μόνον ἵνα
  choice: Das tun sie nur, damit
  rationale: Macht den von Paulus unterstellten alleinigen Zweck in einem natürlichen deutschen Satz klar.
- source_word: τῷ σταυρῷ τοῦ Χριστοῦ
  choice: wegen des Kreuzes des Messias
  rationale: Versteht den Dativ als kausal beziehungsweise als Bezug der Verfolgung und gibt Χριστός hier als Titel wieder.
- source_word: μὴ διώκωνται
  choice: sie nicht … verfolgt werden
  rationale: Bewahrt Passiv und Zwecknuance des Aoristkonjunktivs nach ἵνα.
theological_decisions:
- issue: Bedeutung von ἐν σαρκί
  choice: im Fleisch
  alternative: äußerlich einen guten Eindruck machen
  rationale: Die wörtlichere Formulierung bewahrt die für Paulus wichtige Mehrdeutigkeit von σάρξ, während die Fußnote die naheliegende kontextuelle Bedeutung erklärt.
- issue: Wiedergabe von Χριστοῦ
  choice: des Messias
  alternative: Christi
  rationale: Χριστός ist in dieser Genitivverbindung als Titel semantisch wirksam; „Messias“ macht diesen Titel für heutige Leser transparent, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Funktion des Dativs τῷ σταυρῷ
  choice: wegen des Kreuzes
  alternative: für das Kreuz
  rationale: Der Dativ bezeichnet hier wahrscheinlich den Grund beziehungsweise Bezug der Verfolgung. „Wegen“ ist im Deutschen klar und natürlich, ohne die Aussage inhaltlich weiter auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzteilung vermeidet eine schwerfällige griechische Periodenstruktur. „Im Fleisch“ bleibt bewusst im Haupttext, um die paulinische Begriffsspannung nicht auf eine rein äußerliche Bedeutung zu verengen.
