id: GAL.6.9
reference: Galatians 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: de
  text: Lasst uns nicht müde werden, Gutes zu tun[a]; denn zur rechten Zeit[b] werden wir ernten, wenn wir nicht nachlassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gute zu tun“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu der dafür bestimmten Zeit“; wörtlicher: „zur eigenen Zeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wenn wir nicht erschlaffen“ bzw. „ohne aufzugeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: Gutes zu tun
  rationale: Die Verbindung aus substantiviertem Adjektiv und ποιέω bezeichnet idiomatisch das Tun dessen, was gut oder edel ist. „Gutes zu tun“ ist natürlich und bewahrt den ethischen Sinn.
- source_word: μὴ ἐγκακῶμεν
  choice: Lasst uns nicht müde werden
  rationale: Das Verb bezeichnet das Ermüden, Mutloswerden oder Nachlassen im Tun. Diese Wiedergabe passt zum fortdauernden guten Handeln und zur Erntemetapher.
- source_word: καιρῷ ... ἰδίῳ
  choice: zur rechten Zeit
  rationale: καιρός bezeichnet den passenden oder bestimmten Zeitpunkt; ἴδιος unterstreicht die diesem Geschehen eigene, angemessene Zeit.
- source_word: θερίσομεν
  choice: werden wir ernten
  rationale: Die Zukunftsform setzt die landwirtschaftliche Metapher des Zusammenhangs fort.
- source_word: μὴ ἐκλυόμενοι
  choice: wenn wir nicht nachlassen
  rationale: Das Partizip kann körperliches oder inneres Erschlaffen und Aufgeben ausdrücken. Die konditionale Wiedergabe ist im Deutschen natürlich und unterscheidet die Wendung vom vorherigen ἐγκακῶμεν.
theological_decisions:
- issue: Verhältnis der beiden Ausdrücke für Ausdauer (ἐγκακῶμεν / ἐκλυόμενοι)
  choice: „nicht müde werden“ und „nicht nachlassen“ werden als verwandte, aber unterschiedliche Wendungen wiedergegeben.
  alternative: „nicht den Mut verlieren“ und „nicht erschlaffen“
  rationale: Paulus verwendet zwei verwandte, jedoch nicht identische Ausdrücke. Die differenzierte Wiedergabe erhält die rhetorische Bewegung, ohne die Aussage über das Beharren dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem exhortativem Ton. Die beiden Ausdrücke für Ermüdung beziehungsweise Nachlassen bleiben unterscheidbar; die Erntemetapher wird bewahrt.
