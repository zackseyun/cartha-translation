  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: de
  text: Denn jeder wird seine eigene Last tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische φορτίον kann „Last“ oder „Traglast“ bedeuten; in Vers 2 steht dagegen βάρη („Lasten“, „Bürden“).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder
  rationale: Das distributive Singularpronomen hebt die einzelne Person hervor; „jeder“ gibt dies im modernen Standarddeutsch natürlich und präzise wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang, ohne diesen näher auszudeuten.
- source_word: τὸ ἴδιον
  choice: seine eigene
  rationale: Die Form bezeichnet das, was jeweils der betreffenden Person selbst zugehört. In Verbindung mit dem grammatisch maskulinen Singular „jeder“ ist „seine eigene“ im Deutschen grammatisch folgerichtig.
- source_word: φορτίον
  choice: Last
  rationale: Das Wort bezeichnet etwas, das getragen wird. „Last“ ist im Deutschen anschaulich und lässt sich durch die Fußnote gegenüber βάρη in Vers 2 lexikalisch einordnen, ohne eine bestimmte theologische Harmonisierung festzuschreiben.
- source_word: βαστάσει
  choice: wird … tragen
  rationale: Der Futur Indikativ Aktiv wird unmittelbar wiedergegeben. „tragen“ entspricht dem konkreten Bild des griechischen Verbs und bildet eine natürliche Verbindung mit „Last“.
theological_decisions:
- issue: Verhältnis von Galater 6,5 zu Galater 6,2
  choice: Die Aussage bleibt als individuelle Verpflichtung beziehungsweise Zurechnung formuliert, während die unterschiedliche griechische Wortwahl in einer Fußnote kenntlich gemacht wird.
  alternative: Beide griechischen Substantive ohne Hinweis gleich wiedergeben oder Vers 5 ausdrücklich als endzeitliche Rechenschaft deuten.
  rationale: Der unmittelbare Kontext fordert sowohl gegenseitiges Tragen als auch das Tragen der jeweils eigenen Last. Die Übersetzung bewahrt diese Spannung und legt weder einen Widerspruch noch eine bestimmte dogmatische Auflösung in den Wortlaut hinein.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzstruktur des griechischen Ausgangstextes bleibt erhalten; „Denn“ wahrt den erklärenden Anschluss an den Kontext.
