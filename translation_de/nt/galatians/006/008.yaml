id: GAL.6.8
reference: Galatians 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: de
  text: Denn wer auf sein eigenes Fleisch[a] sät, wird aus dem Fleisch Verderben[b] ernten; wer aber auf den Geist[c] sät, wird aus dem Geist ewiges Leben ernten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf seine eigene sündige menschliche Natur“. Das griechische Wort σάρξ kann wörtlich „Fleisch“ bedeuten, bezeichnet bei Paulus in ethischen Gegenüberstellungen aber auch die gefallene, dem Geist widerstrebende menschliche Ausrichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Zerstörung“ oder „Verfall“. Das griechische Wort kann Verderben, Zerstörung oder Verfall bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist wahrscheinlich der Heilige Geist. Der griechische Ausdruck kann sprachlich auch „Geist“ in anderem Sinn bedeuten, doch im Galaterbrief bezeichnet dieser Gegensatz gewöhnlich Gottes Geist.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Ermahnung; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: ὁ σπείρων
  choice: wer … sät
  rationale: Das substantivierte Präsenspartizip hat allgemeinen, sprichwortartigen Sinn. Die deutsche Konstruktion mit „wer“ ist natürlich und bewahrt diesen generischen Charakter.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: für sein eigenes Fleisch
  rationale: Bei σπείρω bezeichnet εἰς die Ausrichtung des Säens. „Für“ ist idiomatisches Deutsch; „sein eigenes“ bewahrt die reflexive Betonung von ἑαυτοῦ. „Fleisch“ erhält zugleich Paulus’ bewusst spannungsreiche Begrifflichkeit.
- source_word: ἐκ τῆς σαρκὸς
  choice: vom Fleisch
  rationale: ἐκ bezeichnet hier Quelle oder Ursprung. „Vom Fleisch“ ist knapp und wahrt die Parallele zu „vom Geist“.
- source_word: θερίσει
  choice: wird … ernten
  rationale: „Ernten“ führt das landwirtschaftliche Bild des Säens direkt und natürlich fort.
- source_word: φθοράν
  choice: Verderben
  rationale: „Verderben“ umfasst ruinösen Ausgang und Vergänglichkeit, ohne den Ausdruck ausschließlich auf Vernichtung oder körperlichen Verfall festzulegen.
- source_word: ὁ δὲ σπείρων
  choice: wer aber … sät
  rationale: „Aber“ kennzeichnet den Gegensatz; die wiederholte Wer-Konstruktion erhält den ausgewogenen Parallelismus.
- source_word: εἰς τὸ πνεῦμα
  choice: für den Geist
  rationale: Der Zusammenhang im Galaterbrief legt Gottes Geist nahe. „Geist“ bewahrt jedoch die Ausdrucksweise des griechischen Textes, während „für“ die Ausrichtung des Säens bezeichnet.
- source_word: ἐκ τοῦ πνεύματος
  choice: vom Geist
  rationale: Die Formulierung gibt den Ursprung des Ertrags wieder und steht bewusst parallel zu „vom Fleisch“.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die natürliche und etablierte deutsche Wiedergabe des Ausdrucks und umfasst sowohl die kommende als auch die bleibende Dimension des Lebens.
theological_decisions:
- issue: Wiedergabe von σάρξ im ethischen Gegensatz bei Paulus
  choice: Fleisch
  alternative: sündige menschliche Natur
  rationale: Obwohl σάρξ hier die von Gott abgewandte menschliche Ausrichtung bezeichnen kann, wahrt „Fleisch“ Paulus’ eigene Begrifflichkeit und lässt die Spannung zwischen leiblicher und ethisch-theologischer Bedeutung bestehen.
- issue: Bezug von πνεῦμα
  choice: der Geist
  alternative: der menschliche Geist
  rationale: Der Gegensatz von Fleisch und Geist im Galaterbrief weist am ehesten auf Gottes Heiligen Geist. Da deutsche Substantive ohnehin großgeschrieben werden und der griechische Text nicht ausdrücklich „heilig“ oder „Gottes“ sagt, bleibt die knappe Form „der Geist“ im Haupttext stehen; die Fußnote erläutert den wahrscheinlichen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, sprichwortartiger Satzstruktur. Das Bild von Säen und Ernten sowie der parallele Gegensatz zwischen Fleisch und Geist bleiben erhalten. „Für … säen“ wurde als verständliche deutsche Wiedergabe der Zielausrichtung gewählt; die Fachbegriffe „Fleisch“, „Geist“ und „ewiges Leben“ werden nicht paraphrastisch aufgelöst.
