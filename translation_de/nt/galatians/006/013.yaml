source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: de
  text: Denn selbst die, die sich beschneiden lassen, halten das Gesetz nicht. Sie wollen aber, dass ihr euch beschneiden lasst, damit sie sich eures Fleisches rühmen können.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit sie sich in eurem Fleisch rühmen“. Gemeint ist das sichtbare körperliche Zeichen der Beschneidung.'
    reason: Die Fußnote bewahrt die griechische Präpositionalformulierung ἐν τῇ ὑμετέρᾳ σαρκὶ und erläutert den in diesem Zusammenhang konkreten Sinn von „Fleisch“.
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Denn selbst ... nicht
  rationale: „Denn“ bewahrt den begründenden Anschluss von γάρ; „selbst ... nicht“ gibt die nachdrückliche Verneinung οὐδέ in natürlichem Deutsch wieder.
- source_word: οἱ περιτεμνόμενοι
  choice: die, die sich beschneiden lassen
  rationale: Das substantivierte Präsenspartizip bezeichnet die betreffende Gruppe anhand der Beschneidung. Die Formulierung wahrt zudem den Vorgangsaspekt, ohne sie ausdrücklich als bloße Befürworter der Beschneidung zu deuten.
- source_word: αὐτοὶ
  choice: selbst
  rationale: Das betonte Pronomen hebt hervor, dass gerade diese Menschen das Gesetz nicht halten.
- source_word: νόμον φυλάσσουσιν
  choice: halten das Gesetz
  rationale: „Das Gesetz halten“ ist die übliche und verständliche deutsche Wendung für die Befolgung des Gesetzes.
- source_word: ἀλλὰ θέλουσιν
  choice: Sie wollen aber
  rationale: Die Satzstellung klingt im Deutschen natürlich und bewahrt den Gegensatz sowie den Willensaspekt.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: dass ihr euch beschneiden lasst
  rationale: Diese idiomatische deutsche Konstruktion gibt den griechischen Infinitiv und den Umstand wieder, dass die Beschneidung an den Angesprochenen vorgenommen wird.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ drückt den Zweck knapp und eindeutig aus.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: eures Fleisches
  rationale: Im Deutschen verbindet sich „sich einer Sache rühmen“ idiomatisch mit dem Genitiv. „Fleisch“ hält die konkrete körperliche Bedeutung im Zusammenhang mit der Beschneidung fest; die Fußnote erläutert die griechische Konstruktion wörtlicher.
- source_word: καυχήσωνται
  choice: sich ... rühmen können
  rationale: „Sich rühmen“ entspricht dem paulinischen Sprachgebrauch und wahrt hier den kritischen Unterton; „können“ fügt sich natürlich in den deutschen Zwecksatz ein.
theological_decisions:
- issue: Bedeutung von σάρξ in diesem Zusammenhang
  choice: konkretes körperliches „Fleisch“ als Ort des Beschneidungszeichens
  alternative: metaphorische „sündige Natur“
  rationale: Der unmittelbare Zusammenhang handelt von der Beschneidung. Daher bezeichnet σάρξ hier den Körper beziehungsweise das körperliche Zeichen und nicht eine sündige Natur.
- issue: Bedeutung des Partizips περιτεμνόμενοι
  choice: „die, die sich beschneiden lassen“ als beschreibende Bezeichnung
  alternative: „die Beschnittenen“ oder „die Befürworter der Beschneidung“
  rationale: Das Partizip identifiziert die Gruppe durch die Beschneidung, ohne die Formulierung auf eine bloße Befürwortung zu verengen. Die gewählte Wiedergabe bewahrt den Präsensaspekt besser als „die Beschnittenen“.
- issue: Bezug von ἐν τῇ ὑμετέρᾳ σαρκὶ zu καυχήσωνται
  choice: idiomatisch „sich eures Fleisches rühmen“
  alternative: wörtlicher „sich in eurem Fleisch rühmen“
  rationale: Die Genitivkonstruktion ist in modernem Deutsch natürlich und gibt den Gegenstand beziehungsweise Anlass des Rühmens wieder, ohne die körperliche Referenz aufzulösen. Die formale Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der argumentative Anschluss und die Betonung werden gewahrt; unnötig kirchensprachliche oder konfessionell geprägte Formulierungen werden vermieden.
