source:
  edition: SBLGNT
  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: de
  text: Wer im Wort unterrichtet wird, soll den, der ihn unterrichtet, an allem Guten teilhaben lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll alles Gute mit dem teilen, der ihn unterrichtet“; wahrscheinlich ist materielle Unterstützung mitgemeint.'
    reason: Lexikalische und syntaktische Alternative; die Wendung bezeichnet breites praktisches Teilen, ohne es ausdrücklich auf materielle Güter zu beschränken.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: soll … teilhaben lassen
  rationale: Der Imperativ Präsens fordert zu einer fortdauernden Praxis des Teilens auf. Mit dem Akkusativ der Sache und dem Dativ der Person bezeichnet κοινωνέω hier am ehesten, den Unterrichtenden an den eigenen Gütern teilhaben zu lassen.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ markiert hier einen leichten Übergang. Im Deutschen ist kein ausdrückliches Bindewort nötig; „aber“ würde einen zu starken Gegensatz ausdrücken.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: wer im Wort unterrichtet wird
  rationale: Das Partizip Präsens Passiv bezeichnet den Empfänger fortlaufender Unterweisung. „Im Wort“ bewahrt die paulinische Ausdrucksweise, ohne λόγος vorschnell auf „Lehre“ oder „Botschaft“ einzuengen.
- source_word: τῷ κατηχοῦντι
  choice: den, der ihn unterrichtet
  rationale: Das Partizip Präsens Aktiv bezeichnet die unterweisende Person. Das ergänzte „ihn“ stellt im Deutschen die Beziehung zum zuvor genannten Unterrichteten klar.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: an allem Guten
  rationale: Die Formulierung bleibt weit und kann materielle sowie andere praktische Güter umfassen. In Verbindung mit „teilhaben lassen“ ist sie natürliches Deutsch und entspricht der griechischen Konstruktion.
theological_decisions:
- issue: Art des gebotenen Teilens
  choice: Der Unterrichtete soll den Unterrichtenden an allem Guten teilhaben lassen; materielle Unterstützung ist wahrscheinlich eingeschlossen, aber nicht ausdrücklich als einziger Sinn festgelegt.
  alternative: Die Aussage bezeichne ausschließlich geistliche Gemeinschaft oder ausschließlich finanzielle Entlohnung.
  rationale: κοινωνέω mit einer Person im Dativ und „allem Guten“ legt praktische, wohl auch materielle Beteiligung nahe. Die breite Formulierung des Ausgangstextes soll jedoch nicht auf Geld allein verengt und ebenso wenig rein vergeistigt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Unterrichtet“ gibt κατηχέω ohne den späteren kirchlichen Fachbegriff „Katechumene“ wieder; „im Wort“ erhält die knappe paulinische Formulierung.
