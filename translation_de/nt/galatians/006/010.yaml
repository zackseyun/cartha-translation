reference: Galatians 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: de
  text: Lasst uns also, solange wir Gelegenheit dazu haben,[a] allen Menschen Gutes tun, besonders aber denen, die zur Familie des Glaubens gehören.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solange wir Zeit haben“. Das griechische Wort bezeichnet besonders einen passenden oder günstigen Zeitpunkt beziehungsweise eine Gelegenheit, nicht nur Zeit im Allgemeinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zu den Hausgenossen des Glaubens“. Gemeint sind Menschen, die zur durch den Glauben verbundenen Gemeinschaft gehören.'
    reason: lexical_alternative
  - marker: c
    text: „Glaube“ kann hier auch im Sinn von „der Glaube“, also des gemeinsamen christlichen Bekenntnisses, verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: also
  rationale: Die beiden Folgerungspartikeln leiten eine Schlussfolgerung aus dem Vorhergehenden ein. „Also“ gibt diese Funktion im modernen Deutschen natürlich und knapp wieder.
- source_word: ὡς καιρὸν ἔχομεν
  choice: solange wir Gelegenheit dazu haben
  rationale: καιρός bezeichnet hier die passende oder verfügbare Gelegenheit zum Handeln, nicht bloß Zeit im chronologischen Sinn. „Solange“ bewahrt zugleich den zeitlichen Horizont der Aussage.
- source_word: ἐργαζώμεθα
  choice: Lasst uns … tun
  rationale: Der Präsens Konjunktiv ist auffordernd und auf fortgesetztes Handeln gerichtet. Mit τὸ ἀγαθόν ist „Gutes tun“ die natürliche deutsche Wendung.
- source_word: τὸ ἀγαθὸν
  choice: Gutes
  rationale: Das substantivierte Adjektiv bezeichnet das moralisch Gute beziehungsweise gute Handlungen. „Gutes“ ist klar, idiomatisch und nah an der griechischen Form.
- source_word: πρὸς πάντας
  choice: allen Menschen
  rationale: πρός bezeichnet die Ausrichtung des Handelns auf alle. „Allen Menschen Gutes tun“ ist im Deutschen idiomatischer als das formale „gegenüber allen“, ohne den universalen Umfang einzuschränken.
- source_word: μάλιστα δὲ
  choice: besonders aber
  rationale: μάλιστα setzt innerhalb des umfassenden Auftrags eine besondere Priorität; δέ markiert den weiterführenden Gegensatz beziehungsweise Akzent. „Besonders aber“ bewahrt beides.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: denen, die zur Familie des Glaubens gehören
  rationale: οἰκεῖοι bezeichnet Angehörige eines Hauses oder Haushalts. „Familie“ bewahrt die Gemeinschafts- und Zugehörigkeitsmetapher in verständlichem Deutsch, ohne eine bestimmte kirchliche Organisationsform vorauszusetzen.
- source_word: πίστεως
  choice: Glaubens
  rationale: πίστις wird als „Glaube“ wiedergegeben. Der Genitiv kennzeichnet die Gemeinschaft durch den Glauben, lässt aber offen, ob stärker der persönliche Glaube oder „der Glaube“ als gemeinsames Bekenntnis gemeint ist.
theological_decisions:
- issue: Umfang und Priorität des Gutestuns
  choice: Der Auftrag gilt allen Menschen, wobei den Glaubensgeschwistern besondere Aufmerksamkeit zukommt.
  alternative: Der Auftrag gelte nur Glaubenden; oder die besondere Verantwortung für Glaubende werde aufgehoben.
  rationale: πρὸς πάντας nennt ausdrücklich den universalen Umfang, während μάλιστα eine besondere Priorität innerhalb dieses Umfangs setzt. Die Übersetzung wahrt beide Seiten.
- issue: Bedeutung von τῆς πίστεως
  choice: „des Glaubens“ bleibt als offene Kennzeichnung der Gemeinschaft stehen.
  alternative: „der Glaubenden“ als eindeutige Bezeichnung einzelner Gläubiger oder „des christlichen Bekenntnisses“ als ausdrücklich konfessioneller Sinn.
  rationale: Der griechische Ausdruck kann die Gemeinschaft durch Glauben oder durch den gemeinsam bekannten Glauben bestimmen. Eine engere Festlegung ist im Haupttext nicht erforderlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, aufforderndem Ton. Die Formulierung „Familie des Glaubens“ erhält das familiäre Bild, während die Fußnote den wörtlichen Haushaltsbezug sichtbar macht. Die universale Ausrichtung und die besondere Priorität werden sprachlich klar voneinander unterschieden.
