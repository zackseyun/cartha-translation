  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: de
  text: Seht, mit was für großen Buchstaben ich euch eigenhändig geschrieben habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seht, was für einen langen Brief ich euch eigenhändig geschrieben habe.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: Seht
  rationale: Der Aoristimperativ Plural dient als direkte Aufforderung zur Aufmerksamkeit. „Seht“ ist knapp, würdig und bewahrt die Bildlichkeit des griechischen Verbs.
- source_word: πηλίκοις
  choice: mit was für großen
  rationale: πηλίκος bezeichnet hier am natürlichsten die auffällige Größe. Die deutsche Wendung „mit was für großen“ gibt den ausrufenden Charakter der Konstruktion idiomatisch wieder.
- source_word: γράμμασιν
  choice: Buchstaben
  rationale: γράμματα meint in Verbindung mit der Größenangabe wahrscheinlich Schriftzeichen beziehungsweise Buchstaben, nicht zwingend einen Brief als Ganzes.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Adressaten des Schreibens; „euch“ ist im Deutschen die natürliche Wiedergabe.
- source_word: ἔγραψα
  choice: ich ... geschrieben habe
  rationale: Das Perfekt klingt im Deutschen für das nun vorliegende Geschriebene natürlich und hält den Bezug auf den Brief gegenwärtig, ohne dem griechischen Aorist eine besondere Aktionsart aufzuzwingen.
- source_word: τῇ ἐμῇ χειρί
  choice: eigenhändig
  rationale: Die instrumentale Dativphrase betont, dass Paulus selbst schreibt. „Eigenhändig“ gibt ἐμῇ prägnant und idiomatisch wieder.
theological_decisions:
- issue: Deutung von πηλίκοις γράμμασιν
  choice: Größe der geschriebenen Buchstaben
  alternative: Länge des von Paulus eigenhändig geschriebenen Briefes
  rationale: γράμματα bezeichnet gewöhnlich Buchstaben oder Schriftzeichen, und der Hinweis auf die eigene Hand stützt den Bezug auf das Schriftbild. Da die Konstruktion auch auf den Umfang des Schreibens bezogen werden kann, bleibt diese echte Deutungsmöglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. „Eigenhändig“ vermeidet die im Deutschen schwerfälligere Formulierung „mit meiner eigenen Hand“.
