id: GAL.6.14
reference: Galatians 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: de
  text: Für mich aber kommt es nicht in Frage, mich zu rühmen außer des Kreuzes unseres Herrn Jesus, des Messias,[a] durch das[b] die Welt für mich gekreuzigt ist und ich für die Welt gekreuzigt bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch „Jesus Christus“. Χριστός bedeutet „Messias“ und wird hier als Titel wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch den“, wenn sich das Relativpronomen auf den Herrn Jesus, den Messias, und nicht auf das Kreuz bezieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: für mich … ist es ausgeschlossen
  rationale: Gibt die nachdrückliche, persönlich zugespitzte Zurückweisung des griechischen Optativs in natürlichem modernem Deutsch wieder.
- source_word: καυχᾶσθαι
  choice: sich rühmen
  rationale: Bewahrt den paulinischen Leitbegriff und den Kontrast zum Rühmen äußerer oder fleischlicher Vorzüge im Kontext.
- source_word: εἰ μὴ
  choice: als
  rationale: In der deutschen Vergleichskonstruktion „keiner anderen Sache … als“ bezeichnet es klar die einzige Ausnahme.
- source_word: σταυρῷ
  choice: Kreuz
  rationale: Ist die etablierte und sachlich angemessene Wiedergabe im Zusammenhang mit Jesu Hinrichtung und ihrer paulinischen Deutung.
- source_word: κυρίου
  choice: Herrn
  rationale: Entspricht dem üblichen neutestamentlichen Titel und passt zum christologischen Zusammenhang.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt den Bedeutungsgehalt des Titels Χριστός wieder; die Apposition mit Artikel ist im Deutschen idiomatisch.
- source_word: δι’ οὗ
  choice: durch das
  rationale: Bezieht das Relativpronomen primär auf „das Kreuz“ und gibt διά instrumental wieder; der mögliche Personenbezug bleibt in einer Fußnote erhalten.
- source_word: κόσμος
  choice: die Welt
  rationale: Bewahrt die breite, kontextuell theologisch gefüllte Bedeutung, ohne sie durch „Weltordnung“ interpretierend einzuengen.
- source_word: ἐσταύρωται
  choice: gekreuzigt ist
  rationale: Gibt das Perfekt als vollzogenen Zustand wieder und bewahrt zugleich das Kreuzigungsbild.
- source_word: κἀγὼ κόσμῳ
  choice: und ich für die Welt
  rationale: Behält die knappe griechische Ellipse bei; „gekreuzigt ist“ wird aus dem parallelen ersten Satzglied ohne Verständnisschwierigkeit ergänzt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Χριστός wird hier als Titel semantisch transparent mit „Messias“ wiedergegeben, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bezugswort von δι’ οὗ
  choice: 'Das Kreuz als Bezugswort: „durch das“'
  alternative: 'Jesus Christus als Bezugswort: „durch den“'
  rationale: Der unmittelbare Gedankengang legt das Kreuz als Mittel nahe. Da die griechische Form οὗ selbst den Bezug nicht eindeutig entscheidet und auch ein Personenbezug möglich ist, wird die Alternative ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Formulierung bewahrt die starke persönliche Zurückweisung, ohne auf das heute altertümlich wirkende „Es sei ferne von mir“ zurückzugreifen. Der Schluss behält die knappe Parallelstruktur und die theologische Spannung des griechischen Textes bei.
