revisions:
- from: Für mich jedoch ist es ausgeschlossen, mich einer anderen Sache zu rühmen als des Kreuzes unseres Herrn Jesus, des Messias,[a] durch das[b] die Welt für mich gekreuzigt ist und ich für die Welt.
  to: Für mich aber kommt es nicht in Frage, mich zu rühmen außer des Kreuzes unseres Herrn Jesus, des Messias,[a] durch das[b] die Welt für mich gekreuzigt ist und ich für die Welt gekreuzigt bin.
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext genannte „andere Sache“, gibt die persönliche Abwehrformel natürlicher wieder und ergänzt im zweiten Glied das im Deutschen notwendige „gekreuzigt bin“. Die bevorzugte instrumentale Bezugnahme von „durch das“ auf das Kreuz sowie die alternative Lesart in der Fußnote bleiben erhalten.
