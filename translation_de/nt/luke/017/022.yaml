reference: Luke 17:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: de
  text: 'Dann sagte er zu den Jüngern: „Es werden Tage kommen, an denen ihr euch danach sehnen werdet, einen der Tage des Menschensohnes[a] zu sehen, und ihr werdet ihn nicht sehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Tage des Menschensohnes“ können die Zeit seiner Gegenwart und seines Wirkens oder, enger gefasst, seine künftige Offenbarung bezeichnen. Der griechische Wortlaut lässt den Bezug offen.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Dann sagte er
  rationale: δέ ist hier ein schwaches, den Erzählgang fortführendes Bindewort. „Dann“ klingt im Deutschen natürlich, ohne einen starken Gegensatz auszudrücken.
- source_word: πρὸς τοὺς μαθητάς
  choice: zu den Jüngern
  rationale: Der griechische Text enthält den bestimmten Artikel, aber kein ausdrückliches Possessivpronomen; daher wird kein „seinen“ ergänzt.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Es werden Tage kommen
  rationale: Die deutsche Zukunftsform bewahrt die prophetisch klingende Ankündigung und gibt die griechische Wendung natürlich wieder.
- source_word: ὅτε
  choice: an denen
  rationale: Die relativisch-temporale Formulierung bezieht sich im Deutschen klar auf die angekündigten Tage.
- source_word: ἐπιθυμήσετε
  choice: ihr werdet euch danach sehnen
  rationale: „Sich sehnen“ bringt das starke Verlangen des Verbs zum Ausdruck und ist in modernem Deutsch idiomatisch.
- source_word: μίαν τῶν ἡμερῶν
  choice: einen der Tage
  rationale: 'Diese Formulierung gibt den partitiven Genitiv präzise wieder: einen einzelnen Tag aus einer Mehrzahl von Tagen.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Die traditionelle, wörtlich geprägte Wiedergabe bewahrt Jesu Selbstbezeichnung sowie ihre biblischen und theologischen Bezüge.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: Der schlichte Infinitiv ist klar und bildet die Ergänzung zu „sich danach sehnen“.
- source_word: καὶ οὐκ ὄψεσθε
  choice: und ihr werdet ihn nicht sehen
  rationale: „Und“ bewahrt καί, ohne einen stärkeren Gegensatz einzutragen. Das Pronomen „ihn“ nimmt im Deutschen den zuvor genannten einzelnen Tag auf.
theological_decisions:
- issue: Bedeutung der „Tage des Menschensohnes“
  choice: Die zeitlich und eschatologisch gewichtige Wendung bleibt in ihrem Umfang offen.
  alternative: Sie ausschließlich auf Jesu irdische Gegenwart oder ausschließlich auf seine künftige Offenbarung und sein Gericht zu beziehen.
  rationale: Der griechische Ausdruck kann im Zusammenhang sowohl die ersehnte Gegenwart und Wirksamkeit Jesu als auch die künftige Offenbarung des Menschensohnes anklingen lassen. Die wörtlich-nahe Formulierung entscheidet diese Spannung nicht vorzeitig.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe an der griechischen Struktur, ohne im Deutschen steif zu wirken.
