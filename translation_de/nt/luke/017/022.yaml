  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes präzise wieder: die narrative Fortführung durch δέ, die Anrede an „die Jünger“, die zukünftige Ankündigung, das starke Verlangen, den partitiven Ausdruck „einen der Tage“, den Titel „Menschensohn“ sowie die anschließende Verneinung. Das maskuline „ihn“ kann sich grammatisch auf „einen [Tag]“ beziehen und macht keine zusätzliche inhaltliche Festlegung.'
  naturalness: „Dann sagte er zu den Jüngern“ und der anschließende Satz sind modernes, gut lesbares Standarddeutsch. Die Verbindung „einen der Tage des Menschensohnes zu sehen“ ist zwar bewusst bibelnah, aber idiomatisch und angemessen im Register.
