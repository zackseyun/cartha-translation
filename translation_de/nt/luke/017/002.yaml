source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: de
  text: Es wäre besser für ihn, wenn ihm ein Mühlstein um den Hals gehängt und er ins Meer geworfen würde, als dass er einen von diesen Kleinen zu Fall brächte.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: »ein schwerer Mühlstein«. Der griechische Ausdruck kann einen größeren, schweren Mahlstein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zur Sünde verführt«. Das griechische Verb kann bedeuten, jemanden zur Sünde zu verführen oder geistlich ins Verderben zu führen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: es wäre besser für ihn
  rationale: Die idiomatische Wendung bezeichnet, dass das folgende Schicksal für ihn vergleichsweise vorzuziehen wäre. Der deutsche Konjunktiv passt zur irrealen Vergleichssituation.
- source_word: λίθος μυλικὸς
  choice: Mühlstein
  rationale: Dies ist die knappe und geläufige deutsche Entsprechung. Dass möglicherweise ein besonders schwerer Mühlstein gemeint ist, wird in einer Fußnote vermerkt.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: ihm ... um den Hals gelegt
  rationale: Die Form beschreibt den Zustand eines um den Hals befindlichen Steins; im Deutschen gibt die passive Formulierung die vorgestellte Handlung natürlich wieder.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: er ins Meer geworfen würde
  rationale: Die Passivform und das Ziel der Handlung werden direkt wiedergegeben; zusammen mit dem ersten Verb entsteht eine natürliche irreale Konstruktion.
- source_word: σκανδαλίσῃ
  choice: zu Fall bringt
  rationale: Die Formulierung bewahrt das Bild des Fallens und kann zugleich das Verleiten zur Sünde oder den geistlichen Schaden bezeichnen, ohne die Mehrdeutigkeit vorschnell aufzulösen.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: einen von diesen Kleinen
  rationale: Die Wendung bleibt bewusst allgemein und legt nicht fest, ob ausschließlich Kinder oder auch gering geachtete beziehungsweise schutzbedürftige Glaubende gemeint sind.
- source_word: ἢ ἵνα
  choice: als dass
  rationale: Die deutsche Vergleichskonstruktion gibt natürlich wieder, dass das zuvor genannte Schicksal gegenüber dem Ärgernisgeben als vorzuziehen bezeichnet wird.
theological_decisions:
- issue: Bezug von »diesen Kleinen«
  choice: diese Kleinen
  alternative: diese Kinder; diese gering geachteten Glaubenden oder Jünger
  rationale: Der griechische Wortlaut bestimmt die Gruppe nicht ausdrücklich näher. Die Übersetzung wahrt daher die interpretative Offenheit.
- issue: Bedeutung von σκανδαλίζω
  choice: zu Fall bringen
  alternative: zur Sünde verführen; geistlich zugrunde richten
  rationale: Das griechische Verb umfasst in diesem Zusammenhang mehr als bloßes Beleidigen oder Anstoß-Erregen. Die bildhafte Wiedergabe lässt sowohl Verführung zur Sünde als auch schweren geistlichen Schaden anklingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem zugespitzten Vergleich des griechischen Textes, ohne die metaphorische und theologische Offenheit von »zu Fall bringen« und »diesen Kleinen« einzuengen.
