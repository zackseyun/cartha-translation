id: LUK.17.11
reference: Luke 17:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: de
  text: Und es geschah, als er nach Jerusalem unterwegs war, dass er durch das Gebiet zwischen Samarien und Galiläa[a] zog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er mitten durch Samarien und Galiläa zog.“ Die griechische Wendung kann eine Bewegung durch das Gebiet zwischen den beiden Regionen bezeichnen, aber auch als Bewegung mitten durch sie verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt die für Lukas typische erzählerische Einleitungsformel in würdigem, weiterhin verständlichem Deutsch.
- source_word: ἐν τῷ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: als er nach Jerusalem unterwegs war
  rationale: Gibt die Gleichzeitigkeit des substantivierten Infinitivs und den fortdauernden Charakter der Reise natürlich wieder.
- source_word: αὐτός
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen bezeichnet Jesus; eine Wiedergabe mit „er selbst“ würde die leichte griechische Hervorhebung im Deutschen überbetonen.
- source_word: διήρχετο
  choice: zog
  rationale: Das Imperfekt beschreibt eine andauernde Bewegung; zusammen mit „war“ ergibt sich im Deutschen ein natürlicher fortlaufender Erzählzusammenhang.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: durch das Grenzgebiet von Samarien und Galiläa
  rationale: Die Wendung ist geografisch mehrdeutig und kann ein Gebiet zwischen beziehungsweise an der Grenze beider Regionen oder eine Bewegung mitten durch sie bezeichnen. „Grenzgebiet“ bietet eine verständliche Hauptlesart, während die Fußnote die Alternative bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Erzählformel bleibt erkennbar; die schwierige geografische Wendung wird lesbar wiedergegeben, ohne ihre echte Mehrdeutigkeit zu verschweigen.
