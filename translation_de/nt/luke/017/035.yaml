  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: de
  text: Zwei Frauen werden zusammen mahlen[a]; die eine wird mitgenommen, die andere aber zurückgelassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am selben Ort“. Die griechische Wendung kann „zusammen“ oder „am selben Ort“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Wird mitgenommen“ sagt für sich allein nicht, ob das Mitnehmen zur Rettung oder zum Gericht geschieht; der weitere Zusammenhang wird unterschiedlich gedeutet.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο … ἀλήθουσαι
  choice: Zwei Frauen werden … mahlen
  rationale: Das feminine Partizip weist die beiden Personen als Frauen aus. Die deutsche Zukunftsform gibt den futurischen Szenenaufbau natürlich wieder.
- source_word: ἀλήθουσαι
  choice: mahlen
  rationale: Das Verb bezeichnet das Mahlen, typischerweise von Getreide. Das Objekt ist impliziert und muss im Haupttext nicht ergänzt werden.
- source_word: ἐπὶ τὸ αὐτό
  choice: zusammen
  rationale: Die Wendung kann Gemeinschaft bei der Tätigkeit oder das Befinden am selben Ort ausdrücken. „Zusammen“ ist hier knapp und idiomatisch; die örtliche Alternative steht in der Fußnote.
- source_word: ἡ μία
  choice: die eine
  rationale: Die Verbindung aus Artikel und Zahlwort hebt die erste der beiden Frauen im Kontrast zur anderen hervor.
- source_word: παραλημφθήσεται
  choice: wird mitgenommen werden
  rationale: Das Futur Passiv von παραλαμβάνω bezeichnet hier das Nehmen beziehungsweise Mitnehmen einer Person, ohne für sich allein zu bestimmen, ob dies Rettung oder Gericht bedeutet.
- source_word: ἡ δὲ ἑτέρα
  choice: die andere aber
  rationale: δέ markiert den Gegensatz, während ἑτέρα die zweite der beiden Frauen bezeichnet.
- source_word: ἀφεθήσεται
  choice: wird zurückgelassen werden
  rationale: Das Futur Passiv von ἀφίημι bedeutet in diesem Gegenüber, dass die andere Person gelassen beziehungsweise zurückgelassen wird. Die Wiedergabe bewahrt den Gegensatz zum Mitnehmen.
theological_decisions:
- issue: Ob das Mitnehmen beziehungsweise Zurücklassen Rettung oder Gericht bedeutet
  choice: Die eine wird mitgenommen, die andere zurückgelassen, ohne die jeweilige heilsgeschichtliche Bedeutung festzulegen.
  alternative: Das Mitnehmen ausdrücklich als Rettung und das Zurücklassen als Gericht deuten – oder umgekehrt das Mitnehmen als Gericht und das Zurücklassen als Verschonung.
  rationale: Der griechische Wortlaut beschreibt die Trennung, legt aber in diesem Vers nicht ausdrücklich fest, welchem Ausgang das Mitnehmen und welchem das Zurücklassen entspricht. Die Übersetzung bewahrt daher die theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das explizite „Frauen“ ergibt sich aus der femininen Form des griechischen Partizips. Die parallelen Passivformen und der Kontrast der beiden Personen bleiben erhalten.
