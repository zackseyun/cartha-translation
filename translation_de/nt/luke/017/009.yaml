base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: de
  text: Dankt er etwa dem Sklaven dafür, dass er getan hat, was ihm befohlen wurde?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Diener“ beziehungsweise „dem Knecht“; das griechische Wort δοῦλος bezeichnet hier einen Sklaven.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: etwa ...?
  rationale: μή mit dem Indikativ leitet hier eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird. Das deutsche „etwa“ gibt diese Erwartung natürlich wieder.
- source_word: ἔχει χάριν
  choice: dankte
  rationale: Die Wendung ἔχειν χάριν τινί bedeutet in diesem Zusammenhang, jemandem dankbar zu sein beziehungsweise ihm zu danken. „Dankte“ ist knapp und idiomatisch.
- source_word: τῷ δούλῳ
  choice: dem Sklaven
  rationale: δοῦλος bezeichnet hier einen Menschen in rechtlich und sozial gebundener Unterordnung. Da die Verpflichtung zum Gehorsam die Logik des Gleichnisses trägt, bewahrt „Sklave“ die historische und rhetorische Schärfe.
- source_word: ὅτι
  choice: dafür, dass
  rationale: ὅτι nennt den Grund für den angenommenen Dank. Im Deutschen verbindet „dafür, dass“ das Verb „danken“ idiomatisch mit diesem Grund.
- source_word: ἐποίησεν
  choice: tat
  rationale: ποιέω bezeichnet hier schlicht die Ausführung des Aufgetragenen; „tat“ ist natürlich und präzise.
- source_word: τὰ διαταχθέντα
  choice: was ihm befohlen worden war
  rationale: Das substantivierte passive Partizip bezeichnet das Befohlene. Die deutsche Formulierung bewahrt den passiven Sinn; „ihm“ verdeutlicht lediglich den im Satz vorausgesetzten Empfänger des Befehls.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Verhältnis zwischen Herr und Sklave
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Die Argumentation setzt nicht bloß einen freiwilligen Dienst, sondern eine verpflichtende Unterordnung voraus. „Sklave“ erhält diese soziale Asymmetrie, ohne die Aussage des Gleichnisses darüber hinaus dogmatisch auszudeuten.
- issue: Erwartete Antwort der rhetorischen Frage
  choice: durch „etwa“ als verneinend erwartete Antwort markiert
  alternative: eine formal neutrale Frage ohne Modalpartikel
  rationale: μή signalisiert im Griechischen eine erwartete Verneinung. „Etwa“ macht diese pragmatische Funktion sichtbar, ohne die Antwort ausdrücklich in den Text einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Frage bleibt erhalten; „etwa“ bildet ihre im Griechischen erwartete negative Antwort ab. Das historische Machtgefälle wird durch „Sklave“ nicht abgeschwächt.
