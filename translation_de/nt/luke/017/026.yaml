  source_fidelity: Die Übersetzung gibt die Vergleichsstruktur καὶ καθὼς … οὕτως sowie die Zukunftsaussage ἔσται präzise wieder. „Wie … so“ entspricht dem Griechischen idiomatisch; „auch“ bildet das zweite καί angemessen ab. „Es“ bleibt wie im Ausgangstext offen und ergänzt keinen konkreten Bezug.
  naturalness: „Und wie es in den Tagen Noahs geschah, so wird es auch in den Tagen des Menschensohnes sein“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht formelhafte Wendung „in den Tagen“ und der Titel „Menschensohn“ sind im biblischen Register etabliert und angemessen.
  terminology: „Noah“ ist korrekt wiedergegeben. „Menschensohn“ bewahrt die etablierte deutsche Titelform und die mögliche Anspielungs- bzw. Resonanzebene, ohne sie ausdeutend festzulegen. Eine alternative Übertragung wie „der Menschliche“ sollte hier nicht in den Text treten.
