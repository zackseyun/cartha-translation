id: LUK.17.26
reference: Luke 17:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: de
  text: Und wie es in den Tagen Noahs geschah, so wird es auch in den Tagen des Menschensohnes sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet den Vergleich idiomatisch ein; zusammen mit „so“ bildet es im Deutschen die natürliche Vergleichsstruktur „wie … so“.
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt den ereignishaften Sinn von γίνομαι und klingt in diesem feierlich-eschatologischen Zusammenhang würdig, ohne unverständlich zu sein.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: in den Tagen Noahs
  rationale: Entspricht eng der griechischen Zeitangabe und ist eine etablierte, verständliche deutsche Wendung.
- source_word: οὕτως
  choice: so
  rationale: Kennzeichnet den zweiten Teil des Vergleichs knapp und natürlich.
- source_word: ἔσται
  choice: wird es … sein
  rationale: Gibt die Futurform und den offenen Bezug des griechischen Ausdrucks wieder, ohne „geschehen“ interpretierend zu wiederholen.
- source_word: καὶ
  choice: auch
  rationale: Erhält im zweiten Vergleichsteil die ausdrücklich markierte Entsprechung.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  rationale: Die im Deutschen etablierte Wiedergabe bewahrt die sprachliche Form sowie die mögliche Anspielung auf Daniel 7 und ihre messianisch-apokalyptische Spannung.
theological_decisions:
- issue: Wiedergabe des Titels τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: des Menschensohnes
  alternative: des Menschlichen / des Menschen
  rationale: „Menschensohn“ ist die etablierte deutsche Titelwiedergabe und erhält sowohl die eigentümliche Ausdrucksform als auch den möglichen Daniel-Hintergrund, ohne die Wendung auf eine rein generische Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur „wie … so“ folgt dem griechischen Vergleich. Die Formulierung bleibt bewusst knapp und lässt offen, worin genau die Entsprechung zwischen Noahs Tagen und den Tagen des Menschensohnes besteht.
