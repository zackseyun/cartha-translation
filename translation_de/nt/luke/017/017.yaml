  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: de
  text: 'Da antwortete Jesus: »Sind nicht die zehn rein geworden? Wo aber sind die neun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Da sagte Jesus
  rationale: Die griechische Antwortformel lässt sich im Deutschen natürlich mit »Da sagte Jesus« wiedergeben. »Antwortete« wäre möglich, doch hier geht keine ausdrückliche Frage voraus; »da« nimmt den Erzählfaden auf.
- source_word: Οὐχὶ
  choice: Sind nicht
  rationale: οὐχί leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. »Sind nicht« bewahrt diese Erwartung.
- source_word: οἱ δέκα
  choice: die zehn
  rationale: Artikel und Zahl bezeichnen die aus dem Zusammenhang bekannte Gruppe; eine zusätzliche Verstärkung durch »alle« steht nicht ausdrücklich im Griechischen.
- source_word: ἐκαθαρίσθησαν
  choice: rein geworden
  rationale: Das Passiv von καθαρίζω bezeichnet das Reinwerden beziehungsweise Reinigen. Im Zusammenhang mit Aussatz umfasst es körperliche Wiederherstellung und kultische Reinheit; »rein geworden« bewahrt diese Bedeutungsbreite und klingt im modernen Deutschen natürlicher als »gereinigt worden«.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Wo aber sind die neun?
  rationale: δέ hebt die neun gegenüber dem einen Zurückgekehrten kontrastiv hervor. Die deutsche Wortstellung mit »aber« gibt diesen Gegensatz knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutung von καθαρίζω bei Aussatz
  choice: rein geworden
  alternative: geheilt; gereinigt worden
  rationale: »Geheilt« würde die Aussage auf körperliche Genesung verengen. »Rein geworden« erhält sowohl die körperliche als auch die kultische Dimension, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappen rhetorischen Fragen und der Gegensatz zwischen den zehn und den neun bleiben erhalten; keine Fußnote ist erforderlich.
