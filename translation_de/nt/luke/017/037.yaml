source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: de
  text: 'Sie antworteten ihm: »Wo, Herr?« Er sagte zu ihnen: »Wo der Körper[b] ist, da werden sich auch die Geier[a] sammeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Adler“. Das griechische Wort kann Adler bezeichnen; im Zusammenhang mit Vögeln, die sich um einen Körper sammeln, liegt jedoch „Geier“ näher.
    reason: lexical_alternative
  - marker: b
    text: Auch „Leichnam“. Diese Wiedergabe würde das Bild von Aasvögeln deutlicher machen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες … λέγουσιν
  choice: Da fragten sie
  rationale: Die Verbindung aus Antwortpartizip und Redeverb leitet hier die als Reaktion gestellte Frage ein. Die idiomatische deutsche Form vermeidet das schwerfällige „Antwortend sagen sie“, ohne den responsiven Charakter zu verlieren.
- source_word: Ποῦ
  choice: Wo
  rationale: Das Adverb fragt knapp nach dem Ort.
- source_word: κύριε
  choice: Herr
  rationale: Die direkte Anrede an Jesus wird mit dem üblichen und kontextgemäßen Titel „Herr“ wiedergegeben.
- source_word: Ὅπου
  choice: Wo
  rationale: Die Formulierung bewahrt den sprichwortartigen Aufbau „Wo …, da …“, ohne die Aussage durch „wo immer“ stärker zu verallgemeinern.
- source_word: σῶμα
  choice: Körper
  rationale: „Körper“ entspricht der Grundbedeutung von σῶμα. Dass ein toter Körper gemeint sein dürfte, ergibt sich aus dem Bild; die deutlichere Alternative „Leichnam“ wird in einer Fußnote genannt.
- source_word: ἀετοὶ
  choice: Geier
  rationale: Das Wort kann Adler bezeichnen, doch bei Vögeln, die sich um einen Körper sammeln, vermittelt „Geier“ den wahrscheinlich gemeinten Aasvogel im heutigen Deutsch klarer. „Adler“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: ἐπισυναχθήσονται
  choice: werden sich … sammeln
  rationale: Die natürliche deutsche Zukunftsform gibt das Zusammenkommen der Vögel wieder. Sie vermeidet das unidiomatische doppelte Passiv „werden versammelt werden“, ohne einen ausdrücklich handelnden Verursacher einzuführen.
theological_decisions:
- issue: Deutung des Bildwortes als Gerichtsaussage
  choice: Das Bild von Körper und Aasvögeln wird ohne nähere Identifizierung seines Bezuges wiedergegeben.
  alternative: Das Bild ausdrücklich auf das Endgericht, römische Heere oder ein allgemeines Prinzip unausweichlicher Offenbarung und Vergeltung beziehen.
  rationale: Der griechische Text nennt den konkreten Bezug nicht. Eine eindeutige Auslegung in die Übersetzung aufzunehmen würde die echte metaphorische und eschatologische Spannung unzulässig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Sprichwortton. Die Erzählverben stehen im deutschen Präteritum; die wörtlich schwerfällige griechische Konstruktion aus Partizip und historischem Präsens wird idiomatisch wiedergegeben. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
