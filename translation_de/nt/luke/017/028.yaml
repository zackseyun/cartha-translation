  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: de
  text: 'Ebenso war es in den Tagen Lots: Die Menschen aßen und tranken, kauften und verkauften, pflanzten und bauten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως καθὼς ἐγένετο
  choice: Ebenso war es
  rationale: Die Kombination leitet eine entsprechende Parallele zum vorangehenden Beispiel ein. Die knappe deutsche Wendung gibt den Vergleich natürlich wieder, ohne das schwerfällige „ebenso, wie es geschah“ zu verwenden.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: in den Tagen Lots
  rationale: Die traditionelle, weiterhin verständliche Zeitangabe bewahrt das biblische Idiom und bezeichnet die mit Lot verbundene Epoche.
- source_word: ἤσθιον, ἔπινον
  choice: Die Menschen aßen und tranken
  rationale: Die imperfektischen Formen schildern fortlaufende beziehungsweise gewöhnliche Alltagstätigkeiten. Das deutsche Präteritum trägt diesen Hintergrundcharakter im Erzählzusammenhang natürlich; das ergänzte Subjekt macht die unbestimmte dritte Person Plural verständlich.
- source_word: ἠγόραζον, ἐπώλουν
  choice: kauften und verkauften
  rationale: Die beiden imperfektischen Verben bezeichnen gewöhnliche Handelstätigkeit und werden als enges, idiomatisches Wortpaar wiedergegeben.
- source_word: ἐφύτευον, ᾠκοδόμουν
  choice: pflanzten und bauten
  rationale: Beide Verben sind wörtlich und bezeichnen normale landwirtschaftliche und bauliche Tätigkeit. Die parallele Präteritumsform erhält den rhythmischen Katalog.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rhythmische Katalog alltäglicher Tätigkeiten bleibt erhalten. „Die Menschen“ verdeutlicht das im Griechischen nur durch die Verbformen ausgedrückte unbestimmte Subjekt, ohne eine bestimmte Gruppe einzuführen.
