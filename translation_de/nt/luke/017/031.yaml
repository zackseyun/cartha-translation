review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Szenenfolge und die beiden Verbote grundsätzlich zutreffend wieder. εἰς τὰ ὀπίσω ist jedoch eine idiomatische Richtungsangabe („zurück“, „nach hinten“); „zu dem, was hinter ihm liegt“ wirkt im Deutschen unnötig gegenständlich und kann einen räumlich hinter ihm befindlichen Gegenstand nahelegen. „nicht zurückkehren“ gibt die Wendung idiomatisch wieder, ohne das Ziel auf Besitz festzulegen.
  naturalness: „dessen Sachen“ und die Schlussformulierung sind etwas schwerfällig. „wer … ist und seine Sachen im Haus hat“ ist modernes Standarddeutsch; die parallele Formulierung mit „darf … nicht“ bringt den prohibitivischen Nachdruck klar zum Ausdruck.
  terminology: „Dach“ mit kulturgeschichtlicher Fußnote ist ausreichend und natürlicher als „Flachdach“ im Haupttext. Die Fußnote erläutert zutreffend die mit δῶμα gemeinte begehbare, in der Regel flache Dachfläche. „Sachen“ bleibt als weite Wiedergabe von σκεύη angemessen.
  issues:
  - severity: medium
    issue: „zu dem, was hinter ihm liegt“ für εἰς τὰ ὀπίσω
    rationale: Die Formulierung ist im Deutschen markiert und verschiebt die idiomatische Richtungsangabe in Richtung eines konkreten, räumlich hinter der Person liegenden Referenten. Der griechische Ausdruck verlangt keine ausdrückliche Benennung zurückgelassener Dinge.
  - severity: low
    issue: „dessen Sachen“
    rationale: Grammatisch möglich, aber im modernen Standarddeutsch weniger flüssig als „seine Sachen“.
