revisions:
- from: An jenem Tag soll der, der auf dem Flachdach[a] ist und dessen Sachen im Haus sind, nicht hinuntersteigen, um sie zu holen. Ebenso soll der, der auf dem Feld ist, nicht umkehren zu dem, was hinter ihm liegt.[b]
  to: An jenem Tag darf, wer auf dem Dach[a] ist und seine Sachen im Haus hat, nicht hinuntersteigen, um sie zu holen. Ebenso darf, wer auf dem Feld ist, nicht zurückkehren.
  rationale: Die Revision glättet die deutsche Syntax und gibt εἰς τὰ ὀπίσω idiomatisch durch „zurückkehren“ wieder. Damit bleibt offen, ob an einen Ort, zu zurückgelassenen Gegenständen oder allgemein in die frühere Situation zurückgekehrt würde. Die kulturelle Erläuterung zum Dach bleibt als Fußnote erhalten; eine lexikalische Alternativfußnote zum gestrichenen, unidiomatischen Schluss ist nicht mehr erforderlich.
  reviewer_model: gpt-5.6-terra
