  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: de
  text: An jenem Tag darf, wer auf dem Dach[a] ist und seine Sachen im Haus hat, nicht hinuntersteigen, um sie zu holen. Ebenso darf, wer auf dem Feld ist, nicht zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das damals übliche flache, zugängliche und als Aufenthaltsfläche nutzbare Hausdach.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: An jenem Tag
  rationale: Gibt die zeitliche Wendung natürlich wieder und bewahrt den Nachdruck des Demonstrativpronomens.
- source_word: ὃς ἔσται
  choice: der, der ... ist
  rationale: Die allgemeine, stellvertretende Aussage wird im Deutschen idiomatisch wiedergegeben, ohne die im Kontext selbstverständliche Zukunft unnötig hervorzuheben.
- source_word: ἐπὶ τοῦ δώματος
  choice: auf dem Flachdach
  rationale: δώμα bezeichnet hier das zugängliche, flache Dach eines Hauses; „Flachdach“ macht den kulturell wichtigen Sachverhalt im Haupttext verständlich.
- source_word: τὰ σκεύη αὐτοῦ
  choice: dessen Sachen
  rationale: σκεύη kann Geräte, Gegenstände oder Besitz bezeichnen. „Sachen“ ist breit, natürlich und vermeidet eine unnötige Festlegung auf wertvollen Besitz.
- source_word: μὴ καταβάτω
  choice: soll ... nicht hinuntersteigen
  rationale: Der verneinte Imperativ der dritten Person wird als nachdrückliches Verbot wiedergegeben.
- source_word: ἆραι αὐτά
  choice: um sie zu holen
  rationale: Im Zusammenhang bedeutet αἴρω, die im Haus befindlichen Sachen aufzunehmen beziehungsweise mitzunehmen; „holen“ drückt die beabsichtigte Rückbewegung natürlich aus.
- source_word: ὁ ἐν ἀγρῷ
  choice: der, der auf dem Feld ist
  rationale: Bewahrt die Parallelität der beiden beispielhaften Personen und gibt ἀγρός kontextgerecht wieder.
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Stellt knapp und klar die Parallele zum ersten Verbot her.
- source_word: μὴ ἐπιστρεψάτω
  choice: soll ... nicht umkehren
  rationale: ἐπιστρέφω bezeichnet hier das Zurückkehren beziehungsweise Umwenden und trägt zur Dringlichkeit der Szene bei.
- source_word: εἰς τὰ ὀπίσω
  choice: zu dem, was hinter ihm liegt
  rationale: Die substantivische Wendung wird verständlich wiedergegeben, ohne sie bloß zu „zurück“ zu verkürzen; zugleich bleibt offen, ob primär Orte, Dinge oder allgemein das Zurückgelassene gemeint sind.
theological_decisions:
- issue: Eschatologische Dringlichkeit der Bildsprache
  choice: Die konkreten Verbote des Hinuntersteigens und Umkehrens bleiben als situative Anweisungen erhalten.
  alternative: Als allgemeine Aufforderung paraphrasieren, nicht am Besitz zu hängen.
  rationale: Der griechische Text zeichnet eine konkrete Fluchtsituation „an jenem Tag“. Die konkrete Sprache bewahrt die Dringlichkeit und vermeidet eine moralisierende Ausweitung.
- issue: Bezug von εἰς τὰ ὀπίσω
  choice: „zu dem, was hinter ihm liegt“ bewahrt die gegenständliche und räumliche Offenheit.
  alternative: „um das Zurückgelassene zu holen“ oder lediglich „zurückkehren“.
  rationale: Der Text benennt nicht ausdrücklich Besitz als Ziel der zweiten Person. Die Übersetzung soll die mögliche Verbindung zu Zurückgelassenem erkennen lassen, sie aber nicht dogmatisch festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Verbote sind parallel gestaltet. „Flachdach“ erleichtert das kulturelle Verständnis; „Sachen“ bleibt bewusst alltagssprachlich und semantisch weit. Die etwas markante Schlussformulierung erhält die Offenheit des griechischen εἰς τὰ ὀπίσω; eine flüssigere Alternative steht in der Fußnote.
