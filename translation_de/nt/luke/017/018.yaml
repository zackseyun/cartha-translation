  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: de
  text: Hat sich niemand gefunden, der zurückkehrte, um Gott die Ehre zu geben, außer diesem Fremden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesem Mann aus einem anderen Volk“ oder „diesem Ausländer“. Das griechische Wort bezeichnet einen Fremden, einen Angehörigen eines anderen Volkes; im Zusammenhang ist er ein Außenstehender gegenüber Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: hat sich sonst niemand gefunden
  rationale: Die rhetorische Frage wird im Deutschen idiomatisch mit einer unpersönlich-reflexiven Wendung wiedergegeben. „Sonst niemand“ macht die durch εἰ μή ausgedrückte Ausnahme natürlich verständlich, ohne den Sinn zu verändern.
- source_word: ὑποστρέψαντες
  choice: der zurückkehrte
  rationale: Das Partizip bezeichnet die Rückkehr als die Handlung, die dem Geben der Ehre an Gott vorausgeht. Der Relativsatz ist in modernem Deutsch natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: δοῦναι δόξαν
  choice: um Gott die Ehre zu geben
  rationale: Die feste Wendung bewahrt das Bild des griechischen Ausdrucks und klingt zugleich würdig und geläufig. Der Finalsatz gibt die Beziehung des Infinitivs zur Rückkehr klar wieder.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Im Deutschen steht der Gottesname in dieser Wendung ohne Artikel; der Dativ wird durch die feste Konstruktion „jemandem die Ehre geben“ ausgedrückt.
- source_word: εἰ μὴ
  choice: außer
  rationale: In dieser ausschließenden Konstruktion entspricht „außer“ knapp und idiomatisch dem griechischen εἰ μή.
- source_word: ἀλλογενής
  choice: Fremden
  rationale: Das Wort bezeichnet einen Angehörigen eines anderen Volkes und markiert hier den Mann als Außenstehenden gegenüber Israel. „Fremder“ bewahrt diese Bedeutung, ohne eine abwertende moderne Verwaltungsbezeichnung zu verwenden.
- source_word: οὗτος
  choice: diesem
  rationale: Das Demonstrativpronomen wird erhalten und hebt gerade diesen Außenstehenden hervor.
theological_decisions:
- issue: Ethnische und religiöse Außenseiterstellung des Geheilten
  choice: diesem Fremden
  alternative: diesem Mann aus einem anderen Volk; diesem Ausländer
  rationale: Die Formulierung erhält die Ironie, dass allein der Außenstehende zurückkehrte, um Gott zu ehren. Sie identifiziert ihn nicht über den unmittelbaren Wortlaut hinaus ausdrücklich als Samariter, auch wenn der Zusammenhang dies erkennen lässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage bleibt erhalten; „die Ehre geben“ bewahrt die traditionelle und quellennah formulierte Wendung.
