source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: de
  text: Doch an dem Tag, als Lot aus Sodom hinausging, regneten Feuer und Schwefel vom Himmel herab und vernichteten sie alle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Doch an dem Tag, als
  rationale: Die Dativkonstruktion ist temporal. „Doch“ gibt den leichten Kontrast beziehungsweise die Fortführung durch δέ wieder; „als“ verbindet den zeitlichen Nebensatz natürlich mit dem Hauptsatz.
- source_word: ἐξῆλθεν
  choice: hinausging
  rationale: Die konkrete Bewegung von ἐξέρχομαι bleibt erhalten. „Hinausging“ ist im Deutschen natürlicher als das formellere „fortging“ und etwas quellennäher als bloßes „verließ“.
- source_word: Λὼτ
  choice: Lot
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: ἀπὸ Σοδόμων
  choice: aus Sodom
  rationale: Die Präposition bezeichnet die Bewegung von einem Ort weg. Der Ortsname wird gemäß dem etablierten deutschen Gebrauch im Singular wiedergegeben.
- source_word: ἔβρεξεν
  choice: regnete es
  rationale: Das Verb ist hier unpersönlich gebraucht. Die deutsche Konstruktion „es regnete“ bewahrt dieses Bild, ohne ein im Griechischen nicht genanntes handelndes Subjekt hinzuzufügen.
- source_word: πῦρ καὶ θεῖον
  choice: Feuer und Schwefel
  rationale: θεῖον bezeichnet Schwefel. Diese Wiedergabe ist modern, unmittelbar verständlich und bewahrt das Gerichtsmotiv.
- source_word: ἀπ’ οὐρανοῦ
  choice: vom Himmel
  rationale: „Himmel“ bewahrt den biblischen Sprachgebrauch und den Bezug auf Genesis 19, ohne die Bedeutung auf den sichtbaren Luftraum einzuengen.
- source_word: ἀπώλεσεν πάντας
  choice: vernichtete sie alle
  rationale: ἀπόλλυμι bezeichnet hier vollständige Vernichtung. „Sie alle“ macht den im maskulinen Plural implizierten menschlichen Bezug idiomatisch deutlich.
theological_decisions:
- issue: Wiedergabe von θεῖον im Zusammenhang des Gerichts
  choice: Schwefel
  alternative: Schwefel und Feuer in traditionell geprägter Wortstellung beziehungsweise eine altertümliche Bezeichnung für Schwefel
  rationale: „Schwefel“ gibt den lexikalischen Sinn klar und modern wieder, ohne das Gerichtsmotiv abzuschwächen oder konfessionell auszudeuten.
- issue: Wiedergabe von οὐρανός
  choice: Himmel
  alternative: Luftraum
  rationale: „Himmel“ erhält die biblische Ausdrucksweise und die Anspielung auf Genesis 19. Es lässt die räumliche und theologische Spannung des Ausdrucks bestehen, statt ihn rein meteorologisch festzulegen.
- issue: Nicht genanntes Subjekt von ἔβρεξεν und ἀπώλεσεν
  choice: Kein ausdrückliches göttliches Subjekt ergänzt
  alternative: Gott ließ ... regnen und vernichtete
  rationale: Der griechische Satz nennt Gott nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Zurückhaltung und lässt zugleich den Kontext göttlichen Gerichts erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Verlauf, klingt aber natürlich. Keine altertümlichen oder konfessionell geprägten Formulierungen; für diesen Vers ist keine Fußnote erforderlich.
