- from: Doch an dem Tag, als Lot aus Sodom hinausging, regnete es Feuer und Schwefel vom Himmel und vernichtete sie alle.
  to: Doch an dem Tag, als Lot aus Sodom hinausging, regneten Feuer und Schwefel vom Himmel herab und vernichteten sie alle.
  rationale: Die einzige Änderung behebt die fehlerhafte beziehungsweise missverständliche deutsche Satzverknüpfung. „Herabregnen“ gibt die Bewegung vom Himmel natürlich wieder; die Pluralverben beziehen sich eindeutig auf „Feuer und Schwefel“. Inhalt, Register und die Zurückhaltung hinsichtlich eines nicht ausdrücklich genannten göttlichen Subjekts bleiben erhalten.
