  terminology: „Priestern“ entspricht τοῖς ἱερεῦσιν. „Rein“ bewahrt die körperliche wie kultische Dimension von καθαρίζω, ohne diese in der Hauptübersetzung einseitig festzulegen. Die Fußnote erläutert diese Spannweite sachgerecht.
