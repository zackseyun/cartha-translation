  source_fidelity: 'Die Übersetzung gibt den griechischen Ablauf und die Aussagen zuverlässig wieder: Das Aoristpartizip ἰδών wird idiomatisch als „Als er sie sah“ gefasst; die imperativische Verbindung Πορευθέντες … ἐπιδείξατε als „Geht und zeigt euch“; und ἐκαθαρίσθησαν als „wurden sie rein“. „Während sie hingingen“ bildet die Gleichzeitigkeit von ἐν τῷ ὑπάγειν αὐτούς treffend ab. Das einleitende ἐγένετο muss im modernen Deutschen nicht formelhaft wiedergegeben werden.'
