id: LUK.17.14
reference: Luke 17:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: de
  text: 'Als er sie sah, sagte er zu ihnen: „Geht und zeigt euch den Priestern.[a]“ Und während sie hingingen, wurden sie rein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aufforderung, sich den Priestern zu zeigen, verweist auf die vorgeschriebene priesterliche Untersuchung nach der Heilung von einer Hautkrankheit; siehe 3. Mose 14.
    reason: cross_reference
  - marker: b
    text: 'Oder: „wurden sie gereinigt“. Das griechische Verb kann sowohl körperliche als auch kultische Reinigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Als er sie sah
  rationale: Das Aoristpartizip von ὁράω wird als natürlicher deutscher Temporalsatz wiedergegeben. Das Objekt „sie“ ergibt sich aus dem Kontext und dem folgenden αὐτοῖς.
- source_word: Πορευθέντες
  choice: Geht
  rationale: Das Partizip steht hier in Verbindung mit dem folgenden Imperativ und wird im Deutschen idiomatisch als Aufforderung wiedergegeben.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: zeigt euch
  rationale: Die direkte Formulierung bewahrt den Gedanken, dass die Betroffenen sich den Priestern zur Begutachtung zeigen sollten.
- source_word: τοῖς ἱερεῦσιν
  choice: den Priestern
  rationale: Der bestimmte Artikel und der Plural werden beibehalten; gemeint sind die für die vorgeschriebene Untersuchung zuständigen Priester.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: während sie hingingen
  rationale: Die Konstruktion bezeichnet Gleichzeitigkeit und macht deutlich, dass die Reinigung auf dem Weg geschah. Das einleitende ἐγένετο wird im Deutschen nicht eigens mit „es geschah“ ausgedrückt, da dies hier unnötig schwerfällig wäre.
- source_word: ἐκαθαρίσθησαν
  choice: wurden sie rein
  rationale: Die passive Form von καθαρίζω bezeichnet in diesem Zusammenhang sowohl die körperliche Beseitigung der Krankheit als auch den damit verbundenen Zustand kultischer Reinheit. „Rein werden“ erhält diese Bedeutungsbreite besser als das eindeutigere „geheilt werden“.
theological_decisions:
- issue: Reinigungssprache im Zusammenhang mit einer Hautkrankheit
  choice: wurden sie rein
  alternative: wurden sie geheilt / wurden sie gereinigt
  rationale: Die Übersetzung bewahrt die Spannung zwischen körperlicher Wiederherstellung und kultischer Reinheit, ohne den griechischen Ausdruck auf bloße Heilung zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber natürlich formuliert. Die Fußnotenmarker stehen jeweils direkt bei der Aussage, die sie erläutern.
