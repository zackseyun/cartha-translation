id: LUK.17.33
reference: Luke 17:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: de
  text: Wer sein Leben zu bewahren sucht, wird es verlieren; wer es aber verliert, wird es am Leben erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Leben« kann das griechische Wort auch »Seele« bedeuten; hier ist wahrscheinlich das eigene Leben oder Selbst gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: zu ... sucht
  rationale: Die Wendung bezeichnet ein zielgerichtetes Streben und wird durch die natürliche deutsche Konstruktion „zu bewahren sucht“ wiedergegeben.
- source_word: ψυχὴν
  choice: Leben
  rationale: Im Zusammenhang bezeichnet ψυχή das eigene Leben beziehungsweise Selbst, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: περιποιήσασθαι
  choice: zu bewahren
  rationale: Das Medium trägt hier den Sinn, das eigene Leben für sich zu sichern oder zu erhalten; „bewahren“ erhält diese selbstschützende Nuance.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: wird ... verlieren / verliert
  rationale: „Verlieren“ bewahrt die pointierte Wiederholung und das Paradox des griechischen Wortlauts, ohne die Art des Verlustes näher festzulegen.
- source_word: ζῳογονήσει
  choice: wird ... am Leben erhalten
  rationale: Das Verb bedeutet hier wörtlich, lebendig zu erhalten; die Formulierung hebt sich sachgerecht vom üblichen Verb für „retten“ ab.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Wer ...; wer aber
  rationale: Die generisch-konditionale Konstruktion wird knapp und idiomatisch wiedergegeben; „aber“ markiert den Gegensatz.
theological_decisions:
- issue: Bedeutung von ψυχή
  choice: Leben
  alternative: Seele
  rationale: Der Kontext handelt vom Festhalten am eigenen Leben und dessen Verlust. „Leben“ vermeidet eine nicht ausdrücklich vorausgesetzte Leib-Seele-Trennung, während die mögliche weitere Bedeutung in einer Fußnote genannt wird.
- issue: Wiedergabe von ζῳογονήσει
  choice: am Leben erhalten
  alternative: retten; lebendig machen
  rationale: Die gewählte Fassung bildet die besondere Bedeutung des Verbs transparent ab und bewahrt die Spannung zwischen Verlieren und Lebendigerhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzform und das Paradox des Ausgangstextes bleiben erhalten; das generische „Wer“ ist im Deutschen geschlechtsübergreifend.
