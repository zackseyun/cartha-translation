  naturalness: '»Und die Apostel sagten zum Herrn: »Vermehre unseren Glauben!«« ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Der Ausruf passt zur griechischen Imperativbitte, ohne zusätzlichen Inhalt einzutragen.'
