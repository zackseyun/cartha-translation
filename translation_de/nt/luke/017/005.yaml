  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: de
  text: 'Und die Apostel sagten zum Herrn: »Vermehre unseren Glauben!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine im Griechischen nicht ausdrücklich markierte zeitliche Nuance hinzuzufügen.
- source_word: εἶπαν
  choice: sagten
  rationale: Der Aorist wird im deutschen Erzählstil natürlich als einfaches Präteritum wiedergegeben.
- source_word: οἱ ἀπόστολοι
  choice: die Apostel
  rationale: »Apostel« ist in Lukas–Apostelgeschichte die geläufige und sachgemäße Bezeichnung für den beauftragten Kreis um Jesus.
- source_word: τῷ κυρίῳ
  choice: zum Herrn
  rationale: »Herr« bewahrt sowohl die Anrede als auch das christologische Gewicht von κύριος; die Verbindung »sagten zum Herrn« ist idiomatisches Deutsch.
- source_word: Πρόσθες
  choice: Stärke
  rationale: προστίθημι bedeutet wörtlich »hinzufügen«; zusammen mit πίστις bezeichnet es hier idiomatisch eine Vermehrung beziehungsweise Stärkung des Glaubens. »Stärke« klingt im Deutschen natürlicher als »vermehre« und bewahrt die Bitte um größeren Glauben.
- source_word: ἡμῖν
  choice: unseren
  rationale: Der griechische Dativ »uns« wird mit dem deutschen Verb »stärken« natürlich durch das possessive Objekt »unseren Glauben« wiedergegeben.
- source_word: πίστιν
  choice: Glauben
  rationale: Hier bezeichnet πίστις am ehesten Glauben beziehungsweise Vertrauen; »Glauben« ist die etablierte und kontextuell passende Hauptwiedergabe.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« erhält neben der respektvollen Anrede auch die christologische Tragweite des Titels; »Meister« würde diese Resonanz abschwächen.
- issue: Wiedergabe von πίστις
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Die Bitte zielt hier am wahrscheinlichsten auf den Glauben beziehungsweise das Vertrauen der Apostel. »Treue« gehört zwar zum Bedeutungsfeld, ist in diesem Zusammenhang aber weniger wahrscheinlich.
- issue: Bedeutung von προστίθημι in Verbindung mit πίστις
  choice: Stärke unseren Glauben
  alternative: Füge uns Glauben hinzu; Vermehre unseren Glauben
  rationale: Die wörtliche Vorstellung des Hinzufügens wird im Deutschen idiomatisch als Stärkung oder Vermehrung ausgedrückt. Die Fußnote bewahrt die formale Nähe und die mögliche Nuance der Bitte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; »Stärke unseren Glauben« vermeidet das heute schwerfällige »Mehre uns den Glauben«, während die Fußnote den wörtlichen Wortlaut und die semantische Spannweite festhält.
