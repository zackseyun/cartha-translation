id: LUK.17.24
reference: Luke 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: de
  text: Denn wie der Blitz, wenn er aufleuchtet, von einem Ende des Himmels bis zum anderen strahlt,[a] so wird der Menschensohn an seinem Tag sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher wiedergegeben: „von dem Bereich unter dem Himmel bis zu dem Bereich unter dem Himmel“. Der griechische Ausdruck wiederholt „unter dem Himmel“ in beiden Hälften.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in seinem Tag“. Gemeint ist die mit dem Menschensohn verbundene Zeit; die Formulierung legt nicht näher fest, in welcher Hinsicht es sein Tag ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ, während „wie“ den mit ὥσπερ eröffneten Vergleich natürlich einleitet.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: der Blitz, wenn er aufleuchtet
  rationale: „Blitz“ ist die übliche Bedeutung von ἀστραπή. Der Temporalsatz gibt das Partizip ἀστράπτουσα anschaulich und in natürlichem Deutsch wieder.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: von einem Ende des Himmels bis zum anderen
  rationale: Die idiomatische deutsche Wendung vermittelt die räumliche Ausdehnung des elliptischen griechischen Ausdrucks. Eine Fußnote weist auf die wörtlichere Wiederholung von „unter dem Himmel“ hin.
- source_word: λάμπει
  choice: strahlt
  rationale: „Strahlt“ unterscheidet λάμπει vom vorhergehenden ἀστράπτουσα („aufleuchtet“) und bewahrt so die beiden verwandten, aber unterschiedlichen Verben.
- source_word: οὕτως ἔσται
  choice: so wird … sein
  rationale: Die schlichte Zukunftsform und die Vergleichsstruktur werden unmittelbar erhalten.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Dies ist die etablierte und transparente deutsche Wiedergabe der Selbstbezeichnung Jesu.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: an seinem Tag
  rationale: Die Formulierung wahrt den Bezug des Tages auf den Menschensohn, ohne ihn deutend mit seinem Kommen oder dem Gericht gleichzusetzen.
theological_decisions:
- issue: Bedeutung von „der Menschensohn an seinem Tag“ im endzeitlichen Zusammenhang
  choice: Die offene Formulierung „an seinem Tag“ bleibt stehen.
  alternative: „bei seiner Wiederkunft“ oder „am Tag des Gerichts“
  rationale: Der Zusammenhang ist endzeitlich, doch der griechische Text nennt hier lediglich „seinen Tag“. Eine genauere Festlegung würde eine Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Blitzmetapher bleibt anschaulich; die griechische Partizipialkonstruktion wird für einen natürlichen deutschen Satz als Temporalsatz wiedergegeben. Die eschatologische Aussage wird nicht interpretierend erweitert.
