id: LUK.17.12
reference: Luke 17:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: de
  text: Als er in ein Dorf hineinging, kamen ihm zehn Männer mit Aussatz[a] entgegen. Sie blieben in der Ferne[b] stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der antike Ausdruck „Aussatz“ bezeichnet verschiedene auffällige Hautkrankheiten und ist nicht ohne Weiteres mit der heutigen medizinischen Diagnose Lepra gleichzusetzen.
    reason: lexical_clarification
  - marker: b
    text: 'Wörtlich auch: „von fern“ oder „weit entfernt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Als er … hineinging
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig ablaufende Handlung. Die Formulierung bewahrt diesen Verlaufssinn.
- source_word: εἴς τινα κώμην
  choice: in ein Dorf
  rationale: τινα bezeichnet das nicht näher bestimmte Dorf. Im modernen Deutschen gibt der unbestimmte Artikel dies natürlich wieder; „in ein bestimmtes Dorf“ könnte fälschlich ein bereits identifiziertes Dorf nahelegen.
- source_word: ἀπήντησαν
  choice: kamen ihm … entgegen
  rationale: ἀπαντάω kann sowohl das Zusammentreffen als auch die Bewegung auf jemanden zu bezeichnen. „Entgegenkommen“ ist hier idiomatisch und bewahrt diese Nuance.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: zehn Männer mit Aussatz
  rationale: Die personbezogene Formulierung ist im heutigen Deutsch natürlich und würdevoll. „Aussatz“ wahrt zugleich die historische Krankheitskategorie, ohne sie mit einer modernen medizinischen Diagnose gleichzusetzen.
- source_word: οἳ ἔστησαν
  choice: Sie blieben … stehen
  rationale: Die deutsche Satzteilung liest sich natürlicher als ein langer Relativsatz. „Stehen bleiben“ gibt in diesem Zusammenhang die eingenommene beziehungsweise beibehaltene Stellung wieder.
- source_word: πόρρωθεν
  choice: in der Ferne
  rationale: Die Wendung drückt die räumliche Distanz klar und idiomatisch aus, ohne deren genaue Größe festzulegen.
theological_decisions:
- issue: Krankheitsbezeichnung λεπροί
  choice: Männer mit Aussatz
  alternative: aussätzige Männer; Männer mit Lepra
  rationale: Der antike Ausdruck umfasst eine damalige Kategorie auffälliger Hautkrankheiten und darf nicht ohne Weiteres auf die heutige Diagnose Lepra beziehungsweise Hansen-Krankheit verengt werden. Die gewählte Form wahrt diese historische Offenheit und vermeidet zugleich eine unnötig etikettierende Personenbezeichnung.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne den Zusammenhang des griechischen Relativsatzes aufzulösen. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
