  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: den gleichzeitig verlaufenden Eintritt Jesu, ein nicht näher bestimmtes Dorf, das Entgegenkommen von zehn Männern, die mit dem antiken Krankheitsbegriff bezeichnet werden, und ihr Stehenbleiben in räumlichem Abstand. „In ein Dorf“ bildet die Indefinitheit von τινα angemessen ab; ein deutsches Äquivalent zu „ein gewisses Dorf“ wäre hier weniger natürlich und nicht zwingend genauer.'
  naturalness: Der deutsche Text ist flüssig, modernes Standarddeutsch und im erzählerischen Register angemessen. Die Aufteilung des griechischen Relativsatzes in einen neuen Hauptsatz ist natürlich und erhält den Zusammenhang. „Kamen ihm … entgegen“ und „blieben in der Ferne stehen“ sind idiomatisch.
  terminology: „Männer mit Aussatz“ wahrt die historische und semantisch offene Kategorie von λεπροί besser als die medizinisch verengende Bezeichnung „Lepra“. Die Fußnote erklärt dies sachlich und ohne eine moderne Diagnose in den antiken Text einzutragen. Die Distanzangabe und ihre Fußnote sind ebenfalls angemessen.
