  variant: modern standard German
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: de
  text: Doch einer von ihnen kehrte, als er sah, dass er geheilt war, zurück und verherrlichte[a] Gott mit lauter Stimme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lobte Gott«. Das griechische Verb kann »verherrlichen«, »Ehre geben« oder »loben« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Doch einer von ihnen
  rationale: Die partitive Wendung bedeutet eindeutig »einer von ihnen«. »Doch« gibt den milden Gegensatz von δέ zu den übrigen Geheilten im Zusammenhang natürlich wieder.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: als er sah, dass er geheilt war
  rationale: Die temporale Wiedergabe des Aoristpartizips wahrt den Zusammenhang mit der Rückkehr. »Geheilt war« bezeichnet die bereits eingetretene, von ihm wahrgenommene Heilung.
- source_word: ὑπέστρεψεν
  choice: kehrte … zurück
  rationale: ὑποστρέφω bezeichnet hier die Rückkehr; die deutsche Verbklammer ist idiomatisch und inhaltlich präzise.
- source_word: μετὰ φωνῆς μεγάλης
  choice: mit lauter Stimme
  rationale: Die griechische Wendung bezeichnet hörbares, lautes Sprechen oder Rufen. »Mit lauter Stimme« ist im modernen Standarddeutsch natürlich.
- source_word: δοξάζων τὸν θεόν
  choice: verherrlichte Gott
  rationale: »Verherrlichte« bewahrt den Bedeutungsbezug von δοξάζω auf Ehre und Herrlichkeit; je nach Zusammenhang kann das Verb auch als »lobte« wiedergegeben werden.
theological_decisions:
- issue: Wiedergabe von τὸν θεόν
  choice: Gott
  alternative: keine sachlich erforderliche Erweiterung
  rationale: Der Text sagt schlicht, dass der Geheilte Gott verherrlichte. Eine christologische oder anderweitige dogmatische Präzisierung wäre an dieser Stelle nicht im griechischen Wortlaut enthalten.
- issue: Bedeutung von δοξάζω
  choice: verherrlichte
  alternative: lobte
  rationale: »Verherrlichte« erhält die theologisch bedeutsame Sprache von Ehre und Herrlichkeit, ohne auszuschließen, dass sich dies hier als lautes Gotteslob äußert. Die lexikalische Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählfluss, wird jedoch durch einen idiomatischen Temporalsatz geglättet. Der Gegensatz zu den übrigen neun wird mit »Doch« angedeutet, ohne ihn stärker auszulegen, als δέ erlaubt.
