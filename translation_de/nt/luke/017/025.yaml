id: LUK.17.25
reference: Luke 17:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: de
  text: Doch vorher muss er vieles erleiden und von dieser Generation verworfen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: vorher
  rationale: Das adverbiale πρῶτον bezeichnet hier die zeitliche Priorität gegenüber den zuvor angekündigten Ereignissen. „Vorher“ stellt diesen Zusammenhang im Deutschen natürlich und präzise her.
- source_word: δὲ
  choice: Doch
  rationale: δὲ markiert hier einen leichten Gegensatz beziehungsweise Übergang. „Doch“ bewahrt diesen adversativen Zug in würdigem, modernem Deutsch.
- source_word: δεῖ
  choice: muss
  rationale: „Muss“ gibt die von δεῖ ausgedrückte Notwendigkeit knapp und deutlich wieder, ohne deren göttlichen beziehungsweise heilsgeschichtlichen Hintergrund ausdrücklich auszudeuten.
- source_word: αὐτὸν
  choice: er
  rationale: Das Akkusativsubjekt der griechischen Infinitivkonstruktion wird in der idiomatischen deutschen Konstruktion mit „muss“ als Nominativ wiedergegeben.
- source_word: πολλὰ
  choice: vieles
  rationale: Das substantivierte Neutrum Plural bezeichnet eine Vielzahl von Leidenserfahrungen. „Vieles“ bewahrt die Breite des Ausdrucks und klingt natürlicher als „viele Dinge“.
- source_word: παθεῖν
  choice: erleiden
  rationale: „Erleiden“ gibt πάσχω in diesem Kontext direkt und idiomatisch wieder und lässt den Gegenstand des Leidens durch „vieles“ offen, wie im Griechischen.
- source_word: ἀποδοκιμασθῆναι
  choice: verworfen werden
  rationale: Das Verb bezeichnet die ablehnende Zurückweisung nach Beurteilung. „Verworfen werden“ bewahrt die starke, feierliche Aussage und ist im Kontext einer Leidensankündigung verständlich.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: von dieser Generation
  rationale: Bei der Passivform bezeichnet ἀπό die Instanz, von der die Zurückweisung ausgeht. „Von dieser Generation“ erhält sowohl diese Funktion als auch den zeitgenössischen Bezug von γενεά.
theological_decisions:
- issue: Bedeutung der durch δεῖ bezeichneten Notwendigkeit
  choice: „muss“ ohne erläuternden Zusatz
  alternative: „es ist notwendig“ oder eine ausdrückliche Deutung als Erfüllung von Gottes Plan
  rationale: Bei Lukas kann δεῖ auf Gottes Heilsplan hinweisen. Die Übersetzung lässt dieses Gewicht mitschwingen, legt die Ursache der Notwendigkeit aber nicht ausdrücklich fest, da der Vers selbst sie nicht benennt.
- issue: Referenz des Pronomens αὐτόν
  choice: „er“ ohne ergänzende Identifikation
  alternative: „der Menschensohn“ aus dem unmittelbaren Kontext wiederholen
  rationale: Das griechische Pronomen verweist auf den zuvor genannten Menschensohn. Die pronominale Form wird beibehalten, damit die Übersetzung den Vers nicht erklärend erweitert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Doch vorher“ bildet Kontrast und zeitliche Abfolge natürlich ab; „verworfen“ bewahrt die Schwere der Zurückweisung, ohne zusätzliche Auslegung einzutragen.
