  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: de
  text: 'Und sie riefen laut[a]: „Jesus, Meister[b], hab Erbarmen mit uns!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie erhoben ihre Stimme.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet hier eine Person mit Autorität; es ist nicht das übliche Wort für „Herr“ (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verbindung entspricht dem griechischen Erzählfluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das ausdrücklich gesetzte Pronomen bezeichnet dieselbe Gruppe; eine verstärkende Wiedergabe mit „sie selbst“ wäre im Deutschen hier unnötig und unnatürlich.
- source_word: ἦραν φωνὴν
  choice: riefen laut
  rationale: Die Wendung bedeutet, die Stimme zu erheben und hörbar zu rufen. „Riefen laut“ gibt dies in natürlichem modernem Deutsch wieder; die wörtlichere Bildsprache wird in der Fußnote bewahrt.
- source_word: λέγοντες
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das begleitende Partizip „sagend“ wird im Deutschen nach „riefen laut“ am natürlichsten durch die unmittelbar angeschlossene direkte Rede wiedergegeben.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Vokativ des Personennamens; die übliche deutsche Namensform ist angemessen.
- source_word: ἐπιστάτα
  choice: Meister
  rationale: Die Anrede bezeichnet einen Menschen mit Autorität und Leitungsgewalt. „Meister“ ist im Kontext eine natürliche respektvolle Anrede und unterscheidet den Ausdruck von κύριος („Herr“).
- source_word: ἐλέησον
  choice: hab Erbarmen
  rationale: Der Aoristimperativ formuliert eine dringende Bitte um mitleidiges Eingreifen. „Hab Erbarmen“ ist prägnant, würdevoll und im heutigen Deutsch verständlich.
- source_word: ἡμᾶς
  choice: mit uns
  rationale: Die feste deutsche Verbindung lautet „Erbarmen mit jemandem haben“ und gibt das griechische Objekt idiomatisch wieder.
theological_decisions:
- issue: Anrede ἐπιστάτα für Jesus
  choice: Meister
  alternative: Herr
  rationale: Im Ausgangstext steht ἐπιστάτης, nicht κύριος. „Herr“ würde die lexikalische Unterscheidung verwischen und möglicherweise stärkere christologische Konnotationen eintragen, als dieses Wort für sich genommen ausdrückt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Rede bewahrt die Dringlichkeit des gemeinsamen Hilferufs; „Meister“ erhält die lexikalische Abgrenzung gegenüber „Herr“.
