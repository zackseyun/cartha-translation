source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: de
  text: Gebt auf euch selbst acht! Wenn dein Bruder[b] sündigt[a], weise ihn zurecht; und wenn er umkehrt, vergib ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Wenn dein Bruder gegen dich sündigt, weise ihn zurecht.“'
    reason: textual_variant
  - marker: b
    text: „Bruder“ steht im Griechischen im maskulinen Singular und kann hier weiter gefasst einen anderen Jünger bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Achtet auf euch selbst
  rationale: Der Imperativ fordert zu anhaltender Wachsamkeit auf. Die reflexive Formulierung bewahrt sowohl den persönlichen als auch den gemeinschaftlichen Bezug.
- source_word: ἁμάρτῃ
  choice: sündigt
  rationale: Der SBLGNT-Text nennt kein ausdrückliches Objekt wie „gegen dich“. „Sündigt“ gibt daher die kürzere und weiter gefasste Lesart wieder.
- source_word: ὁ ἀδελφός σου
  choice: dein Bruder
  rationale: Dies entspricht dem grammatisch maskulinen Singular des griechischen Ausdrucks. Dass im Zusammenhang allgemein ein Mitglied der Jüngergemeinschaft gemeint sein kann, wird in einer Fußnote erläutert.
- source_word: ἐπιτίμησον αὐτῷ
  choice: weise ihn zurecht
  rationale: Die Wendung bezeichnet eine direkte, nachdrückliche Korrektur. „Weise ihn zurecht“ ist im modernen Deutsch klar und bewahrt den auffordernden Ernst.
- source_word: μετανοήσῃ
  choice: umkehrt
  rationale: „Umkehrt“ bringt im ethischen und zwischenmenschlichen Zusammenhang eine innere Neuausrichtung mit entsprechender Abkehr vom Fehlverhalten zum Ausdruck.
- source_word: ἄφες αὐτῷ
  choice: vergib ihm
  rationale: Im zwischenmenschlichen Zusammenhang ist „vergeben“ die klare und übliche Wiedergabe von ἀφίημι.
theological_decisions:
- issue: Ob nach „sündigt“ die Worte „gegen dich“ aufgenommen werden sollen
  choice: Im Haupttext steht nur „sündigt“.
  alternative: „Wenn dein Bruder gegen dich sündigt, weise ihn zurecht …“
  rationale: Der vorgelegte SBLGNT-Text enthält weder εἰς σέ noch eine entsprechende Ergänzung. Die weitere Aussage bleibt deshalb im Haupttext erhalten; die längere Lesart wird als Textvariante dokumentiert.
- issue: Geschlechtsspezifische Wiedergabe von ἀδελφός
  choice: „dein Bruder“
  alternative: „dein Bruder oder deine Schwester“ beziehungsweise „ein anderer Jünger“
  rationale: Die Übersetzung folgt der grammatisch maskulinen Singularform, ohne den möglichen weiteren Bezug innerhalb der Jüngergemeinschaft zu verschweigen.
- issue: Bedeutung von μετανοέω im Zusammenhang mit Vergebung
  choice: „umkehrt“
  alternative: „bereut“
  rationale: „Umkehrt“ lässt sowohl die innere Sinnesänderung als auch die Abkehr von der Sünde anklingen und vermeidet eine Verengung auf ein bloßes Gefühl des Bedauerns.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der einleitende Ausruf bewahrt die Warn- und Mahnwirkung; das Semikolon macht den engen Zusammenhang zwischen Zurechtweisung, Umkehr und Vergebung sichtbar.
