  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: de
  text: Zwei[a] werden auf dem Feld sein; der eine wird mitgenommen, der andere wird zurückgelassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er steht jedoch in der westlichen Texttradition, etwa im Codex Bezae aus dem 5. Jahrhundert, in der byzantinischen Mehrheitstradition und in der lateinischen Vulgata. Wahrscheinlich wurde er später zur Angleichung an Matthäus 24,40 eingefügt.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: Zwei
  rationale: Das substantivisch gebrauchte Zahlwort bezeichnet zwei Personen. Das Deutsche kann das Geschlecht ebenso offenlassen wie der griechische Text.
- source_word: παραληφθήσεται
  choice: wird mitgenommen
  rationale: Das Futur Passiv von παραλαμβάνω bezeichnet hier, im Gegensatz zu ἀφίημι, das Mitnehmen bzw. Zu-sich-Nehmen einer Person. „Mitgenommen“ bildet diesen Gegensatz natürlich ab, ohne das Ziel oder die heilsgeschichtliche Bedeutung ausdrücklich festzulegen.
- source_word: ἀφεθήσεται
  choice: wird zurückgelassen werden
  rationale: Das Futur Passiv von ἀφίημι bedeutet in diesem Gegensatz, dass die andere Person am Ort verbleibt bzw. zurückgelassen wird.
- source_word: ὁ ἕτερος
  choice: der andere
  rationale: Die Wendung bezeichnet den zweiten der zuvor genannten zwei Menschen; „der andere“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung des Mitgenommen- und Zurückgelassenwerdens
  choice: Die Übersetzung benennt nur den im Griechischen ausgedrückten Gegensatz und legt nicht fest, welches Schicksal Rettung oder Gericht bedeutet.
  alternative: Durch Zusätze oder stärker deutende Verben das Mitgenommenwerden ausdrücklich als Rettung oder Gericht kennzeichnen.
  rationale: Der einzelne Vers bestimmt die theologische Wertung der beiden Vorgänge nicht eindeutig; diese Spannung soll nicht durch die Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten. „Zwei“ vermeidet die im Ausgangstext nicht ausdrücklich enthaltene Ergänzung „Männer“; „auf dem Feld“ ist die natürliche deutsche Wiedergabe von ἐν τῷ ἀγρῷ.
