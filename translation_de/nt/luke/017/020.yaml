source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: de
  text: 'Als er von den Pharisäern gefragt wurde, wann das Reich Gottes komme, antwortete er ihnen und sagte: »Das Reich Gottes kommt nicht so, dass man es beobachten könnte[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kommt nicht mit sichtbaren Anzeichen«; auch möglich: »kommt nicht mit Beobachtung« oder »nicht unter sorgfältigem Ausschauhalten«.'
    reason: Lexikalische Alternativen für μετὰ παρατηρήσεως. Der Ausdruck kann eine beobachtbare Weise des Kommens, sichtbare Kennzeichen oder sorgfältiges Beobachten beziehungsweise Ausschauhalten meinen; eine kausale Wiedergabe wie »aufgrund« wird vermieden.
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Als er von den Pharisäern gefragt wurde
  rationale: Der temporale Nebensatz gibt das passive Aoristpartizip und die handelnde Personengruppe natürlich wieder. δέ markiert nur einen leichten Übergang und muss im Deutschen hier nicht eigens ausgedrückt werden.
- source_word: πότε ἔρχεται
  choice: wann … komme
  rationale: Der Konjunktiv I ist im deutschen indirekten Fragesatz idiomatisch und bewahrt die auf die Ankunft gerichtete Gegenwartsform des Griechischen, ohne den Zeitpunkt näher festzulegen.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die geläufige, transparente und theologisch offene deutsche Wiedergabe.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: antwortete er ihnen und sagte
  rationale: Die beiden griechischen Verben werden trotz ihrer leichten inhaltlichen Überschneidung beibehalten.
- source_word: Οὐκ ἔρχεται
  choice: kommt nicht
  rationale: Die Präsensform formuliert eine Aussage über die Art und Weise des Kommens.
- source_word: μετὰ παρατηρήσεως
  choice: nicht so, dass man es beobachten könnte
  rationale: Die Formulierung gibt den Gedanken eines durch Beobachtung feststellbaren Kommens verständlich wieder, ohne παρατήρησις eindeutig auf Zeichen, bloßes Wahrnehmen oder angestrengtes Beobachten festzulegen.
theological_decisions:
- issue: Worin die Verneinung beim Kommen des Reiches Gottes besteht
  choice: Jesus verneint ein Kommen, das sich auf beobachtbare Weise feststellen lässt.
  alternative: Jesus verneint sichtbare Vorzeichen oder erklärt sorgfältiges Beobachten für untauglich.
  rationale: μετὰ παρατηρήσεως ist mehrdeutig. Die Übersetzung wahrt diese Spannung und behauptet weder, dass grundsätzlich keinerlei Wahrnehmung möglich sei, noch, dass alle endzeitlichen Zeichen ausgeschlossen seien.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der indirekte Fragesatz verwendet den geläufigen Konjunktiv I; die leichte Doppelung »antwortete … und sagte« spiegelt bewusst die griechische Erzählweise.
