base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: de
  text: 'Und sie werden euch sagen: »Seht, dort!«, oder: »Seht, hier!« Geht nicht hin und lauft nicht hinterher.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Geht nicht weg und verfolgt nicht.« Im Griechischen bleibt das Objekt von »verfolgt« unausgesprochen.'
    reason: lexikalische Alternative und bewahrte Mehrdeutigkeit
lexical_decisions:
- source_word: ἐροῦσιν
  choice: sie werden sagen
  rationale: Das Futur von λέγω wird direkt und natürlich wiedergegeben und leitet die folgende wörtliche Rede ein.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Der aufmerksamkeitslenkende Ausruf wird modern und knapp wiedergegeben; das altertümlich wirkende »Siehe« ist nicht erforderlich.
- source_word: ἐκεῖ / ὧδε
  choice: dort / hier
  rationale: Die gegensätzlichen Ortsangaben werden ebenso knapp wie im Griechischen wiedergegeben.
- source_word: μὴ ἀπέλθητε
  choice: Geht nicht hin
  rationale: ἀπέρχομαι bezeichnet hier eine Bewegung als Reaktion auf die genannten Ortsangaben. »Hingehen« ist im Deutschen kontextgerecht, ohne ein bestimmtes Ziel hinzuzufügen.
- source_word: μηδὲ διώξητε
  choice: und lauft nicht hinterher
  rationale: διώκω kann »verfolgen«, »nachjagen« oder »hinterherlaufen« bedeuten. Die objektlose Formulierung ist im Deutschen idiomatisch und bewahrt, dass im Griechischen kein Objekt genannt wird.
theological_decisions:
- issue: Das nicht genannte Objekt von διώξητε
  choice: 'Objektlos: »lauft nicht hinterher«'
  alternative: »lauft ihnen nicht hinterher« oder »verfolgt es nicht«
  rationale: Der griechische Text lässt offen, wem oder was man nicht nachlaufen soll. Die deutsche Formulierung bleibt natürlich, ohne die möglichen Bezugsgrößen auf Personen, Meldungen oder Erscheinungen festzulegen.
- issue: Die beiden deiktischen Ausrufe
  choice: '»Sieh, dort!«, oder: »Sieh, hier!«'
  alternative: »Siehe dort! Siehe hier!«
  rationale: Die knappe, unmittelbare Warnung bleibt erhalten. »Oder« macht die im Zusammenhang naheliegende Alternative verständlich, ohne eine bestimmte endzeitliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die objektlose Wendung »hinterherlaufen« bewahrt die Offenheit des Ausgangstextes.
