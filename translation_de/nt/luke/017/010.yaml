  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: de
  text: 'So sollt auch ihr, wenn ihr alles getan habt, was euch befohlen wurde, sagen: »Wir sind unnütze Sklaven[a]; wir haben getan, wozu wir verpflichtet waren[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbrauchbare Sklaven“ oder „Sklaven, die keinen Nutzen bringen“. Im Zusammenhang kann die Aussage ausdrücken, dass die Erfüllung der Pflicht keinen Anspruch auf besondere Anerkennung oder Lohn begründet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was zu tun unsere Pflicht war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So sollt auch ihr
  rationale: οὕτως καὶ ὑμεῖς überträgt die vorausgehende Veranschaulichung auf die Jünger. Die Formulierung gibt diesen folgernden und anweisenden Zusammenhang in natürlichem Deutsch wieder.
- source_word: ὅταν ποιήσητε
  choice: wenn ihr ... getan habt
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier den Fall, dass die Handlung abgeschlossen ist, bevor die Aufforderung zum Sprechen gilt.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: alles ..., was euch befohlen wurde
  rationale: διατάσσω bezeichnet eine verbindliche Anordnung. „Befohlen“ bewahrt die Autorität des Auftrags und ist im Deutschen idiomatisch.
- source_word: λέγετε
  choice: sagen
  rationale: Der Präsensimperativ wird im Anschluss an „sollt“ als Infinitiv wiedergegeben; die schlichte Form wahrt den auffordernden Sinn.
- source_word: Δοῦλοι
  choice: Sklaven
  rationale: Im unmittelbaren Kontext ist das Verhältnis zwischen Herr und Sklave ausdrücklich vorausgesetzt. „Sklaven“ bewahrt den rechtlich-sozialen Status deutlicher als „Diener“.
- source_word: ἀχρεῖοί
  choice: ohne Anspruch
  rationale: ἀχρεῖος kann „unnütz“ oder „unbrauchbar“ bedeuten. Im Kontext liegt der Akzent darauf, dass pflichtgemäßer Gehorsam keinen Anspruch auf besondere Anerkennung begründet. „Ohne Anspruch“ gibt diese Funktion wieder, ohne den Sklaven einen absoluten Unwert zuzuschreiben; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: wozu wir verpflichtet waren
  rationale: ὀφείλω bezeichnet ein Geschuldetsein beziehungsweise eine Verpflichtung. Die Formulierung ist gegenwärtiges, klares Deutsch und bewahrt den Gedanken der Pflicht.
- source_word: πεποιήκαμεν
  choice: wir haben getan
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtiger Relevanz; das deutsche Perfekt entspricht dem hier natürlich.
theological_decisions:
- issue: Wiedergabe von δοῦλοι im Gleichniszusammenhang
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Die soziale Gebundenheit ist für das Bild vom Herrn und seinen Sklaven wesentlich. Die Übersetzung darf diese Spannung nicht durch ein allgemeines Dienstverhältnis abschwächen.
- issue: Sinn von ἀχρεῖοι
  choice: ohne Anspruch
  alternative: unnütz; unbrauchbar; unwürdig
  rationale: Die Aussage verneint im Zusammenhang einen aus dem Gehorsam entstehenden Anspruch, nicht notwendig jeden Wert oder jede Brauchbarkeit der Jünger. Da das griechische Wort jedoch schärfer und mehrdeutig ist, werden die formnäheren Wiedergaben in einer Fußnote offengehalten.
- issue: Bedeutung von ὀφείλομεν
  choice: verpflichtet waren
  alternative: schuldig waren zu tun; tun mussten
  rationale: Die Formulierung erhält den Gedanken des Geschuldeten, ohne eine zusätzliche Lehre über Verdienst oder Heil in den Vers hineinzulesen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. „Sklaven“ ist bewusst direkt und historisch präzise; „ohne Anspruch“ vermeidet die im heutigen Deutschen leicht missverständliche Behauptung völliger Wertlosigkeit. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
