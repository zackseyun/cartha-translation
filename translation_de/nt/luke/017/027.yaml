- from: Sie aßen, sie tranken, sie heirateten, und sie wurden verheiratet[a] – bis zu dem Tag, an dem Noah in die Arche ging. Da kam die Flut und vernichtete sie alle.
  to: Sie aßen, tranken, heirateten und wurden zur Ehe gegeben[a], bis zu dem Tag, an dem Noah in die Arche ging. Da kam die Flut und vernichtete sie alle.
  rationale: Die Revision beschränkt sich auf die passive Eheform und die dazugehörige Fußnote. Sie bewahrt die im Griechischen bestehende aktive-passive Gegenüberstellung, vermeidet die semantisch unzutreffende reflexive Alternative und lässt den übrigen natürlichen Erzählstil unverändert.
