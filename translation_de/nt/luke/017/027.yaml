review_pass:
  verdict: revise
  source_fidelity: Die Abfolge der vier Imperfekte, die zeitliche Grenze bis zu Noahs Eintritt in die Arche sowie das umfassende Verderben durch die Flut sind im Wesentlichen zutreffend wiedergegeben. Die zweite Eheform sollte jedoch deutlicher als passives „zur Ehe gegeben werden“ formuliert werden, damit sie nicht mit dem bloßen Heiraten zusammenfällt.
  naturalness: Das Präteritum ist für die imperfektische Reihung im modernen Standarddeutsch natürlich. „Wurden verheiratet“ ist zwar verständlich, kann aber wie ein bloßer formeller Vollzug einer Trauung klingen; „wurden zur Ehe gegeben“ ist hier die präzisere, noch verständliche Formulierung.
  terminology: „Arche“, „Flut“ und „vernichtete sie alle“ sind angemessen. Die Fußnotenalternative „ließen sich heiraten“ ist nicht quellentreu, weil sie eine reflexive, freiwillige Bedeutung nahelegt, die der griechische Passivform nicht entspricht.
  issues:
  - severity: medium
    issue: Die Wiedergabe und Fußnotenalternative zum passiven ἐγαμίζοντο sind missverständlich.
    rationale: „Sie wurden verheiratet“ kann im Deutschen einfach bedeuten, dass eine Eheschließung vollzogen wurde; „ließen sich heiraten“ verändert das Passiv zudem in eine reflexive Konstruktion. „Sie wurden zur Ehe gegeben“ erhält die passive Gegenüberstellung zu „sie heirateten“ ohne eine zusätzliche Aussage über Zustimmung oder Zwang.
  revised_text: Sie aßen, tranken, heirateten und wurden zur Ehe gegeben[a], bis zu dem Tag, an dem Noah in die Arche ging. Da kam die Flut und vernichtete sie alle.
