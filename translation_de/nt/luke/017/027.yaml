source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: de
  text: Sie aßen, tranken, heirateten und wurden zur Ehe gegeben[a], bis zu dem Tag, an dem Noah in die Arche ging. Da kam die Flut und vernichtete sie alle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen hier zwei verschiedene griechische Verben: eines im Aktiv („sie heirateten“) und eines im Passiv („sie wurden zur Ehe gegeben“). Die Formulierung bewahrt die Unterscheidung der beiden Verben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: sie aßen, sie tranken
  rationale: Die Imperfektformen schildern fortdauernde beziehungsweise gewohnheitsmäßige Tätigkeiten. Das deutsche Präteritum gibt die vergangene Szene natürlich wieder; die Reihung bewahrt ihren fortlaufenden Charakter.
- source_word: ἐγάμουν
  choice: sie heirateten
  rationale: Die aktive Imperfektform bezeichnet das Eingehen einer Ehe. Die allgemein formulierte Wiedergabe vermeidet eine unnötige Festlegung auf ein Geschlecht.
- source_word: ἐγαμίζοντο
  choice: sie wurden verheiratet
  rationale: Die passive Form wird von ἐγάμουν unterschieden und bewahrt den Gedanken, dass Menschen in die Ehe gegeben beziehungsweise verheiratet wurden.
- source_word: ἄχρι ἧς ἡμέρας
  choice: bis zu dem Tag, an dem
  rationale: Die Formulierung kennzeichnet die zeitliche Grenze der zuvor beschriebenen Tätigkeiten und gibt den Relativsatz ausdrücklich wieder.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noah in die Arche ging
  rationale: Im Zusammenhang mit Noah bezeichnet κιβωτός die Arche. „In die Arche ging“ ist im Deutschen natürlicher als „in die Arche eintrat“ und gibt die vollendete Erzählhandlung wieder.
- source_word: ὁ κατακλυσμός
  choice: die Flut
  rationale: „Die Flut“ ist die klare, geläufige Bezeichnung für die in Genesis geschilderte Flut.
- source_word: ἀπώλεσεν πάντας
  choice: vernichtete sie alle
  rationale: Die Wiedergabe macht den im maskulinen Plural πάντας vorausgesetzten menschlichen Bezug deutlich und bewahrt die umfassende Aussage.
theological_decisions:
- issue: Unterscheidung der beiden Verben für die Eheschließung
  choice: sie heirateten, und sie wurden verheiratet
  alternative: sie heirateten und ließen sich heiraten
  rationale: Der griechische Text verwendet zwei verschiedene Verben, eines aktiv und eines passiv. Die getrennte Wiedergabe bewahrt diese Spannung, ohne den gewöhnlichen gesellschaftlichen Vorgängen vor dem Gericht eine zusätzliche theologische Bedeutung zu geben.
- issue: Aspekt der einleitenden Verbfolge
  choice: 'Reihung im Präteritum: „sie aßen, sie tranken …“'
  alternative: „sie waren am Essen und Trinken …“
  rationale: Die griechischen Imperfektformen zeichnen andauernde oder gewohnheitsmäßige Vorgänge. Eine progressive Umschreibung wäre im modernen Standarddeutsch schwerfällig; Reihung und Kontext vermitteln den fortlaufenden Charakter natürlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „sie“ bildet die eindringliche griechische Reihung ab; der Gedankenstrich markiert den plötzlichen Umschlag vom gewöhnlichen Leben zum Eintreffen der Flut.
