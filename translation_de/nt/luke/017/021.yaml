  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: de
  text: 'Man wird auch nicht sagen: »Seht, hier!« oder: »Dort!« Denn seht: Das Reich Gottes ist mitten unter euch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Reich Gottes ist in euch.« Die griechische Wendung kann sowohl einen inneren Sinn als auch einen gemeinschaftlichen Sinn wie »unter euch / mitten unter euch« haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Auch wird man nicht sagen
  rationale: Führt die Verneinung aus dem vorherigen Zusammenhang natürlich fort. Das unbestimmte deutsche „man“ gibt die generische dritte Person Plural idiomatisch wieder.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: '»Sieh, hier!«, oder: »Dort!«'
  rationale: „Sieh“ bewahrt den aufmerksamkeitslenkenden Charakter von ἰδού; „hier“ und „dort“ geben die parallelen Ortsadverbien direkt wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung der vorangehenden Aussage.
- source_word: ἰδοὺ
  choice: seht
  rationale: Der Imperativ im Plural spricht die angesprochene Gruppe direkt an und bewahrt den deiktischen Nachdruck, ohne archaisches „siehe“.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte, transparente deutsche Wiedergabe lässt sowohl königliche Herrschaft als auch Reichssphäre anklingen.
- source_word: ἐντὸς ὑμῶν
  choice: mitten unter euch
  rationale: Bei der pluralischen Anrede und im Zusammenhang der Frage nach lokalisierbaren Zeichen ist die gemeinschaftliche Bedeutung wahrscheinlich; die mögliche innere Bedeutung wird in der Fußnote erhalten.
- source_word: ἐστιν
  choice: ist
  rationale: Gibt das schlichte Präsens von εἰμί unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von ἐντὸς ὑμῶν
  choice: Das Reich Gottes ist mitten unter euch
  alternative: Das Reich Gottes ist in euch
  rationale: Die griechische Wendung ist umstritten. Die pluralische Anrede und der Kontext räumlichen Zeigens sprechen für „mitten unter euch“, doch die lexikalisch mögliche innere Lesart darf nicht ausgeschlossen werden und erscheint daher in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ vermeidet das archaische „siehe“, erhält aber den Nachdruck von ἰδού. Die direkte Rede folgt natürlicher deutscher Zeichensetzung.
