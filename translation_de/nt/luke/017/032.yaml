base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: de
  text: Denkt an Lots Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Anspielung auf 1. Mose 19,26: Lots Frau blickte während der Vernichtung Sodoms zurück.'
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Denkt an
  rationale: Das Präsens Aktiv Imperativ, 2. Person Plural, fordert die Angesprochenen unmittelbar auf, sich Lots Frau als warnendes Beispiel vor Augen zu halten. „Denkt an“ ist im heutigen Deutsch natürlicher als „Erinnert euch an“ und bewahrt die knappe Eindringlichkeit.
- source_word: τῆς γυναικὸς
  choice: Lots Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; der Genitiv Λώτ bezeichnet hier die eheliche Beziehung. Die deutsche Genitivkonstruktion „Lots Frau“ gibt „die Frau Lots“ natürlich und knapp wieder.
- source_word: Λώτ
  choice: Lot
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form „Lot“ wiedergegeben.
theological_decisions:
- issue: Form der Warnung und Anspielung
  choice: „Denkt an Lots Frau.“ als knapper direkter Imperativ
  alternative: „Erinnert euch an die Frau Lots.“
  rationale: Die kurze Aufforderung bewahrt Jesu warnenden Rückbezug auf Genesis 19,26, ohne die Bedeutung der Anspielung im Haupttext auszudeuten. Die natürliche deutsche Form lässt die eindringliche Offenheit des Originals bestehen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die außergewöhnliche Kürze und der mahnende Ton des griechischen Satzes bleiben erhalten.
