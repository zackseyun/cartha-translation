id: LUK.17.4
reference: Luke 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: de
  text: 'Und wenn er siebenmal am Tag gegen dich sündigt und siebenmal zu dir zurückkehrt[a] und sagt: »Ich kehre um«, sollst du ihm vergeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich dir wieder zuwendet«.'
    reason: ἐπιστρέφω kann in diesem Zusammenhang sowohl »zurückkehren« als auch »sich wieder zuwenden« bedeuten.
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: siebenmal am Tag
  rationale: Die Wendung bezeichnet die Häufigkeit innerhalb eines Tages. »Am Tag« ist im modernen Deutsch natürlich und gibt den zeitlichen Genitiv sachgerecht wieder, ohne das nicht ausdrücklich vorhandene Zahlwort »einem« einzufügen.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: gegen dich sündigt
  rationale: ἁμαρτάνω mit εἰς σέ bezeichnet hier eine gegen die angesprochene Person gerichtete Verfehlung. »Gegen dich sündigen« ist präzise und im Deutschen verständlich.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: zu dir zurückkehrt
  rationale: ἐπιστρέφω kann sowohl ein Zurückkehren als auch ein Sich-Zuwenden ausdrücken. Im Zusammenhang mit wiederholter Verfehlung und anschließender Bitte liegt »zurückkehrt« nahe; die mögliche Alternative wird in der Fußnote bewahrt.
- source_word: λέγων
  choice: und sagt
  rationale: Das begleitende Partizip wird im Deutschen idiomatisch als koordinierter Satz wiedergegeben. Dadurch bleibt der enge Zusammenhang zwischen Rückkehr und Bekenntnis erhalten.
- source_word: Μετανοῶ
  choice: Ich kehre um
  rationale: μετανοέω bezeichnet hier eine erklärende Abkehr von der Verfehlung und Neuorientierung. »Ich kehre um« ist in modernem Deutsch verständlich und bewahrt mehr als bloßes Bedauern oder eine Entschuldigung.
- source_word: ἀφήσεις αὐτῷ
  choice: sollst du ihm vergeben
  rationale: Der griechische Futur Indikativ hat im lehrhaften Zusammenhang auffordernde beziehungsweise verpflichtende Kraft. »Sollst du ihm vergeben« vermittelt diese Weisung natürlich, ohne sie als bloße Vorhersage wiederzugeben.
theological_decisions:
- issue: Aussagekraft von Μετανοῶ
  choice: »Ich kehre um«
  alternative: »Es tut mir leid«; »Ich bereue es«
  rationale: Der Ausdruck bezeichnet nicht nur ein Gefühl des Bedauerns, sondern eine erklärte Umkehr. Die Übersetzung wahrt dieses ethische und geistliche Gewicht, ohne eine bestimmte konfessionelle Bußlehre einzutragen.
- issue: Kraft des Futur Indikativs ἀφήσεις
  choice: 'als Weisung: »sollst du ihm vergeben«'
  alternative: 'als Vorhersage: »wirst du ihm vergeben«; als schärfer formulierte Verpflichtung: »musst du ihm vergeben«'
  rationale: Im unmittelbaren Unterweisungskontext trägt die Futurform imperativische Kraft. »Sollst« wahrt den verbindlichen Charakter und vermeidet zugleich eine unnötige Verstärkung.
- issue: Bedingung von Umkehr und Vergebung
  choice: Die ausgesprochene Umkehr und die gebotene Vergebung werden in der vom Text gegebenen Folge wiedergegeben.
  alternative: Die Aussage als umfassende systematische Regel über sämtliche Bedingungen der Vergebung auszuformulieren.
  rationale: Der Vers verbindet die Rückkehr mit dem Bekenntnis »Ich kehre um« und der Weisung zu vergeben. Die Übersetzung belässt diese Spannung im konkreten Aussagezusammenhang und ergänzt keine weitergehende Lehrdefinition.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Bedingungssatz, während »und sagt« statt einer wörtlichen Partizipialkonstruktion natürliches Deutsch bietet. Die direkte Rede ist knapp und alltagstauglich, behält aber das Gewicht echter Umkehr.
