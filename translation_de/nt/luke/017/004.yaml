  source_fidelity: 'Der Entwurf gibt die Struktur und den Sinn des griechischen Bedingungssatzes zuverlässig wieder: die siebenfache Verfehlung gegen die angesprochene Person, die siebenfache Rückkehr bzw. Zuwendung, das Umkehrbekenntnis und die direktiv gebrauchte Zukunftsform ἀφήσεις. »Am Tag« ist eine natürliche deutsche Wiedergabe des temporalen Genitivs und fügt keine sachlich relevante Bestimmung hinzu.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Koordination »und sagt« ist für das griechische Partizip λέγων idiomatisch. »Ich kehre um« ist knapp und im biblisch-ethischen Register gut verständlich; es ist stärker und genauer als eine bloße Entschuldigung.
  terminology: »Gegen dich sündigt«, »zu dir zurückkehrt«, »Ich kehre um« und »sollst du ihm vergeben« sind terminologisch tragfähig. Die Fußnote bewahrt die im Kontext mögliche Nuance von ἐπιστρέφω als erneute Zuwendung, ohne den Haupttext zu überladen. Die Wiedergabe von ἀφήσεις als Weisung entspricht dem Kontext und dem englischen Audit Trail.
