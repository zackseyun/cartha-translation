  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: de
  text: 'Dann sagte er zu seinen Jüngern: »Es ist unmöglich, dass keine Anlässe zum Straucheln kommen.[a] Doch wehe dem, durch den sie kommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass keine Fallstricke kommen«, »dass keine Ärgernisse kommen« oder »dass keine Ursachen zur Sünde kommen«. Das griechische Wort σκάνδαλα bezeichnet Dinge, die Menschen moralisch oder geistlich zum Straucheln und zu Fall bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Dann sagte er
  rationale: δέ verbindet den Satz locker mit dem Vorhergehenden. »Dann« gibt den erzählerischen Fortgang im Deutschen natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Das Possessivpronomen αὐτοῦ wird ausdrücklich wiedergegeben; »Jünger« ist die etablierte und verständliche Wiedergabe von μαθηταί.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Es ist unmöglich
  rationale: Die Formulierung bewahrt die Aussageform des Griechischen; der folgende verneinte Infinitiv macht deutlich, dass das Ausbleiben solcher Anstöße unmöglich ist.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: dass keine Anstöße zum Straucheln kommen
  rationale: Der deutsche dass-Satz gibt die substantivierte Infinitivkonstruktion idiomatisch wieder. »Keine« bewahrt die Verneinung, ohne die Aussage auf bloße Wahrscheinlichkeit abzuschwächen.
- source_word: σκάνδαλα
  choice: Anstöße zum Straucheln
  rationale: Die Wendung hält das Bild eines Hindernisses fest, das jemanden moralisch oder geistlich zu Fall bringt. Sie ist breiter als »Verführungen zur Sünde« und weniger missverständlich als das alleinstehende moderne Wort »Ärgernisse«.
- source_word: πλὴν οὐαὶ
  choice: Doch wehe
  rationale: 'πλήν leitet die scharfe Einschränkung ein: Solche Anstöße sind unvermeidlich, doch der dafür verantwortliche Mensch bleibt dem Weheruf unterstellt.'
- source_word: δι’ οὗ ἔρχεται
  choice: dem, durch den sie kommen
  rationale: Die maskuline Einzahl bezeichnet einen verantwortlichen Menschen; »durch den« bewahrt zugleich die vermittelnde Bedeutung von διά. Das deutsche Pluralpronomen »sie« nimmt die mehreren Anstöße natürlich wieder auf.
theological_decisions:
- issue: Bedeutungsbreite von σκάνδαλα in der ethischen Lehre
  choice: Im Haupttext steht »Anstöße zum Straucheln«.
  alternative: »Ärgernisse«, »Verführungen zur Sünde«, »Fallstricke« oder »Ursachen des Abfalls«
  rationale: σκάνδαλα bezeichnet nicht bloß subjektiv empfundene Kränkungen, sondern Gegebenheiten, die Menschen moralisch oder geistlich zu Fall bringen können. Die gewählte Bildsprache lässt offen, ob Versuchung, Verführung, Anstoß oder Falle jeweils im Vordergrund steht.
- issue: Verhältnis von Unvermeidlichkeit und persönlicher Verantwortung
  choice: Die Unmöglichkeit ihres Ausbleibens und der Weheruf über den Verantwortlichen werden ohne erklärenden Ausgleich nebeneinandergestellt.
  alternative: Die erste Aussage als bloße Wahrscheinlichkeit abschwächen oder den Weheruf durch eine eingefügte Erklärung harmonisieren.
  rationale: Der griechische Text hält die theologische Spannung zwischen der Unvermeidlichkeit solcher Anstöße und der Schuld dessen, durch den sie kommen, ausdrücklich aufrecht.
- issue: Personale Einzahl in δι’ οὗ
  choice: »dem, durch den«
  alternative: »der Person, durch die«
  rationale: Die Formulierung bewahrt die repräsentative personale Einzahl und entspricht im Deutschen der grammatisch maskulinen Form des griechischen Relativpronomens, ohne über den Text hinaus eine besondere Aussage über Männer zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Ausdruck »Anstöße zum Straucheln« wird trotz leichter Ungewöhnlichkeit gewählt, um die konkrete Metapher und die inhaltliche Breite von σκάνδαλα zu erhalten. Der abschließende Weheruf ist mit einem Ausrufezeichen als feierliche Warnung markiert.
