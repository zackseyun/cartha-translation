source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: de
  text: 'Wird er nicht vielmehr zu ihm sagen: »Bereite mir etwas zu essen zu, gürte dich[a] und bediene mich, bis ich gegessen und getrunken habe[b]; danach wirst du essen und trinken«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „gürte dich“: Gemeint ist, das lange Gewand zur Arbeit mit einem Gürtel hochzubinden.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „bis ich esse und trinke“. Die gewählte Formulierung hebt hervor, dass der Sprecher zuerst mit Essen und Trinken fertig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Wird er nicht vielmehr
  rationale: Die Verbindung leitet eine kontrastierende rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird. „Vielmehr“ gibt den Gegensatz natürlich wieder.
- source_word: ἐρεῖ αὐτῷ
  choice: wird er ... zu ihm sagen
  rationale: Bewahrt das Futur, den indirekten Bezug αὐτῷ und die Einleitung der direkten Rede.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Bereite mir das Abendessen
  rationale: δίπνησον/δειπνήσω bezieht sich auf die Haupt- beziehungsweise Abendmahlzeit; die idiomatische deutsche Formulierung gibt wieder, dass die Mahlzeit für den Sprecher zubereitet werden soll.
- source_word: περιζωσάμενος
  choice: gürte dich
  rationale: Bewahrt das konkrete antike Bild des Hochbindens langer Kleidung zur Arbeit; die Fußnote erläutert es für heutige Leser.
- source_word: διακόνει μοι
  choice: bediene mich
  rationale: Im Zusammenhang bezeichnet διακονέω den persönlichen Dienst, besonders bei Tisch. „Bediene mich“ ist hier präziser als das allgemeinere „diene mir“.
- source_word: ἕως φάγω καὶ πίω
  choice: bis ich gegessen und getrunken habe
  rationale: Das Perfekt bringt im Deutschen den erreichten Abschluss zum Ausdruck, bevor der andere essen und trinken darf.
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Natürliche und genaue Wiedergabe der zeitlichen Abfolge.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: wirst du essen und trinken
  rationale: Gibt die Futurformen direkt wieder. Die Stellung nach „danach“ lässt die durch σύ betonte Reihenfolge auch im Deutschen klar hervortreten.
theological_decisions:
- issue: Bezeichnung der sozialen Rolle im Gleichnis
  choice: Kein Substantiv wie „Knecht“, „Diener“ oder „Sklave“ wird in diesen Vers eingefügt.
  alternative: Den im vorigen Vers genannten δοῦλος zur Verdeutlichung ausdrücklich wiederholen.
  rationale: Der griechische Text dieses Verses verwendet nur Pronomen und Befehlsformen. Die soziale Rangordnung bleibt durch die Befehle deutlich, ohne ein hier nicht stehendes Nomen zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; das konkrete Bild des Gürtens wird im Text bewahrt und in einer knappen kulturgeschichtlichen Fußnote erklärt.
