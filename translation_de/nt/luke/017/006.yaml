  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: de
  text: 'Der Herr aber sagte: „Wenn ihr Glauben wie ein Senfkorn hättet, würdet ihr zu diesem Maulbeerbaum sagen: ‚Werde entwurzelt und ins Meer gepflanzt!‘ und er würde euch gehorchen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Gibt den in Lukas als Erzähl- und Hoheitstitel gebrauchten Ausdruck natürlich und traditionsübergreifend wieder.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Zusammenhang bezeichnet πίστις das auf Gott gerichtete Vertrauen, ohne den Ausdruck auf bloße Zuversicht oder auf Treue einzuengen.
- source_word: ὡς κόκκον σινάπεως
  choice: wie ein Senfkorn
  rationale: Bewahrt den offenen Vergleich des griechischen ὡς, statt ihn ausdrücklich nur auf die geringe Größe des Senfkorns festzulegen.
- source_word: συκαμίνῳ
  choice: Maulbeerbaum
  rationale: Die griechische Baumbezeichnung meint hier einen Maulbeerbaum; die verständliche deutsche Sachbezeichnung vermeidet die Verwechslung mit der Maulbeerfeige beziehungsweise Sykomore.
- source_word: ἐλέγετε ἂν
  choice: würdet ihr … sagen
  rationale: Der deutsche Konjunktiv II gibt die hypothetische beziehungsweise potenzielle Aussage der Verbform mit ἄν idiomatisch wieder.
- source_word: Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: Werde entwurzelt und ins Meer gepflanzt!
  rationale: Bewahrt beide passiven Imperative und das bewusst paradoxe Bild des Pflanzens im Meer.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: er würde euch gehorchen
  rationale: „Gehorchen“ entspricht der Befehlsvorstellung des Satzes; das maskuline Pronomen nimmt das grammatische Geschlecht von „Maulbeerbaum“ auf.
theological_decisions:
- issue: Bedeutung von πίστις in einem Wunderwort
  choice: Glauben
  alternative: Vertrauen; Treue
  rationale: Der Kontext spricht von einem auf Gott gerichteten Vertrauen angesichts des Unmöglichen. „Glauben“ bewahrt zugleich den breiteren theologischen Ausdruck, ohne hier eine Lehre über menschliche Leistung oder eine bestimmte Wundermechanik einzutragen.
- issue: Aussagewert des Vergleichs mit dem Senfkorn
  choice: 'offener Vergleich: „wie ein Senfkorn“'
  alternative: „so klein wie ein Senfkorn“
  rationale: Der griechische Text nennt die Kleinheit nicht ausdrücklich. Die Übersetzung lässt daher offen, ob der Vergleich allein die geringe Größe oder auch andere Eigenschaften des Samenkorns hervorhebt.
- issue: Kraft der Bedingung
  choice: 'hypothetischer Konjunktiv II: „Wenn ihr … hättet“'
  alternative: „Wenn ihr … habt“
  rationale: Die Nachsätze mit ἄν legen im Deutschen eine hypothetische Formulierung nahe. Damit wird die rhetorische Spannung erhalten, ohne abschließend festzulegen, ob Jesus den Jüngern jeglichen Glauben abspricht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die passive, bildhafte Befehlsform bleibt erhalten; unnötige Fach- und Traditionsbegriffe werden vermieden.
