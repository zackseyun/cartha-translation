id: LUK.17.30
reference: Luke 17:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: de
  text: Genauso[a] wird es an dem Tag sein, an dem der Menschensohn offenbart wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ebenso« oder »Auf dieselbe Weise«. Die griechische Wendung verweist auf die vorausgehenden Beispiele zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Genauso
  rationale: Die griechische Wendung verweist vergleichend auf die unmittelbar vorausgehenden Beispiele zurück. »Genauso« gibt diesen Rückbezug in natürlichem, heutigem Deutsch knapp wieder.
- source_word: ἔσται
  choice: wird es … sein
  rationale: Die Futurform von εἰμί wird mit dem deutschen Futur wiedergegeben und bewahrt so die Zukunftsausrichtung der Aussage.
- source_word: ᾗ ἡμέρᾳ
  choice: an dem Tag, an dem
  rationale: Der Dativ hat hier temporale Bedeutung. Diese Formulierung ist idiomatisches Deutsch und erhält die zeitliche Bestimmtheit.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die traditionelle deutsche Wiedergabe bewahrt Jesu charakteristische Selbstbezeichnung sowie ihre apokalyptischen Anklänge an Daniel 7.
- source_word: ἀποκαλύπτεται
  choice: offenbart wird
  rationale: Die passive Form und der Gedanke des Enthüllens bzw. öffentlichen Sichtbarwerdens bleiben erhalten, ohne das Verb auf ein bloßes Kommen oder Erscheinen zu reduzieren.
theological_decisions:
- issue: Wiedergabe des eschatologischen Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: »Menschensohn« ist im Deutschen als Evangelientitel erkennbar und bewahrt die Verbindung zu Daniel 7. Deutende Alternativen würden diese messianisch-apokalyptische Resonanz abschwächen.
- issue: Bedeutung von ἀποκαλύπτεται im eschatologischen Zusammenhang
  choice: offenbart wird
  alternative: kommt / erscheint
  rationale: Das Verb bezeichnet eine Offenbarung oder Enthüllung. Obwohl der Zusammenhang das zukünftige Kommen des Menschensohnes betrifft, würde »kommt« einen anderen, im griechischen Verb nicht ausdrücklich enthaltenen Begriff einsetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, klingt aber natürlich; traditionelle theologisch bedeutsame Begrifflichkeit wird beibehalten.
