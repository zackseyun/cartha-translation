source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: de
  text: 'Wer aber von euch, der einen Sklaven hat, pflügt oder eine Herde hütet, wird ihm, wenn er vom Feld hereinkommt, sagen: »Komm sofort her und leg dich zu Tisch[b]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Beim Essen lag man in der Antike häufig auf Liegen zu Tisch. Sinngemäß: »Setz dich zum Essen hin.«'
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: Sklaven
  rationale: Das Wort bezeichnet hier einen rechtlich und sozial gebundenen Hausarbeiter, nicht einen entlohnten Arbeiter. »Sklave« bewahrt das für das Gleichnis wesentliche Machtgefälle deutlicher als »Diener« oder »Knecht«.
- source_word: ἀροτριῶντα
  choice: pflügt
  rationale: Das Partizip bezeichnet konkret die landwirtschaftliche Tätigkeit des Pflügens; die finite Form ist im deutschen Relativsatz natürlich.
- source_word: ποιμαίνοντα
  choice: eine Herde hütet
  rationale: Das Verb bezeichnet die Tätigkeit eines Hirten. »Eine Herde hütet« gibt das Bild natürlich wieder, ohne die Tierart festzulegen.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: wenn er vom Feld hereinkommt
  rationale: Das dativische Partizip ist temporal auf den Sklaven bezogen. Die Formulierung bewahrt sowohl die Bewegung vom Feld ins Haus als auch den Zeitpunkt der anschließenden Rede.
- source_word: ἐρεῖ αὐτῷ
  choice: wird zu ihm … sagen
  rationale: Die einfache Zukunft von λέγω wird direkt wiedergegeben; die durch den temporalen Einschub getrennte Wortstellung ist im Deutschen verständlich.
- source_word: Εὐθέως
  choice: sofort
  rationale: Das Adverb drückt unmittelbares Handeln aus; »sofort« ist modern, klar und direkt.
- source_word: παρελθὼν
  choice: Komm
  rationale: Das Partizip begleitet idiomatisch die Aufforderung, den Platz beim Mahl einzunehmen. »Komm« bewahrt die angedeutete Bewegung in natürlichem Deutsch.
- source_word: ἀνάπεσε
  choice: leg dich zu Tisch
  rationale: Das Verb bezeichnet das Niederlegen beziehungsweise Zurücklehnen zum Mahl nach antiker Sitte. Die Formulierung erhält das historische Bild und wird durch eine Kulturfußnote erläutert.
theological_decisions:
- issue: Wiedergabe von δοῦλος im häuslichen Gleichniskontext
  choice: Sklave
  alternative: Diener oder Knecht
  rationale: Die Aussage setzt ein stark asymmetrisches Herrschaftsverhältnis voraus. »Sklave« erhält diese soziale und rhetorische Schärfe, ohne daraus eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der rhetorische Fragesatz und das soziale Gefälle des antiken Haushalts bleiben erhalten; die historisch ungewohnte Esshaltung wird nicht geglättet, sondern erläutert.
