  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: de
  text: Und er fiel vor seinen Füßen mit dem Gesicht zu Boden und dankte ihm. Und er war ein Samariter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: fiel
  rationale: Der Aorist von πίπτω bezeichnet hier knapp die vollzogene Bewegung; die folgende Wendung macht deutlich, dass es sich um eine ehrfürchtige Niederwerfung handelt.
- source_word: ἐπὶ πρόσωπον
  choice: auf sein Angesicht
  rationale: Die Wendung beschreibt anschaulich die Haltung völliger Niederwerfung. „Angesicht“ ist in diesem würdevollen Erzählstil verständlich und bewahrt das konkrete Bild.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: vor seinen Füßen
  rationale: παρά kann räumlich „bei/neben“ bedeuten; im Zusammenhang der Niederwerfung gibt „vor seinen Füßen“ die ehrfürchtige Stellung im Deutschen natürlich wieder, ohne die Person ausdrücklich zu identifizieren.
- source_word: εὐχαριστῶν αὐτῷ
  choice: dankte ihm
  rationale: Das Präsenspartizip bezeichnet eine begleitende Handlung. Eine koordinierte finite Form klingt im modernen Deutschen natürlich und erhält den direkten Bezug auf den, dem gedankt wird.
- source_word: Σαμαρίτης
  choice: Samariter
  rationale: Dies ist die etablierte deutsche Bezeichnung der ethnisch-religiösen Zugehörigkeit und bewahrt deren soziale und erzählerische Bedeutung.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Und er war ein Samariter
  rationale: Die schlichte Formulierung bewahrt die nachgetragene, überraschende Hervorhebung seiner Identität, ohne sie interpretierend zu verstärken.
theological_decisions:
- issue: Erzählerische Hervorhebung der Identität des Geheilten
  choice: „Und er war ein Samariter“ als schlichte Feststellung beibehalten.
  alternative: „Dabei war er ein Samariter“ oder „Dieser Mann war ein Samariter“.
  rationale: Die soziale und theologische Spannung entsteht gerade durch die zurückhaltende Mitteilung, dass der Dankbare zu einer häufig als außenstehend betrachteten Gruppe gehörte. Eine erklärende Ergänzung würde diese Spannung vorwegnehmen.
- issue: Bezug der Pronomen auf Jesus
  choice: Die Pronomen „seinen“ und „ihm“ ohne Namenswiederholung beibehalten.
  alternative: „vor Jesu Füßen … dankte Jesus“.
  rationale: Der griechische Text verwendet ebenfalls Pronomen. Der Zusammenhang bestimmt den Bezug, während die Übersetzung keine zusätzliche Auslegung in den Haupttext einträgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ formnaher Bildsprache. Die Satzfolge des Griechischen bleibt erhalten; das Partizip wird für natürlichen deutschen Erzählfluss als finite Verbform wiedergegeben.
