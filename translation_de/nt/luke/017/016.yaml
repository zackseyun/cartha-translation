revisions:
- from: Und er fiel vor seinen Füßen auf sein Angesicht und dankte ihm. Und er war ein Samariter.
  to: Und er fiel vor seinen Füßen mit dem Gesicht zu Boden und dankte ihm. Und er war ein Samariter.
  rationale: Die Änderung betrifft nur die deutsche Idiomatik und Wortstellung. „Vor seinen Füßen“ gibt die im Kontext ehrerbietige räumliche Relation von παρὰ τοὺς πόδας αὐτοῦ wieder; „mit dem Gesicht zu Boden“ entfaltet ἐπὶ πρόσωπον ohne die überhöhte oder heute weniger geläufige Wendung „auf sein Angesicht“. Die knappe Identifikation als Samariter bleibt unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:48:32Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Grundbedeutungen von ἔπεσεν, εὐχαριστῶν und Σαμαρίτης zutreffend wieder. Die räumlich-körperliche Verbindung von ἐπὶ πρόσωπον und παρὰ τοὺς πόδας αὐτοῦ ist im Entwurf jedoch im Deutschen schwer verständlich und stilistisch unglücklich angeordnet.
  naturalness: „vor seinen Füßen auf sein Angesicht“ ist in modernem Standarddeutsch keine natürliche Wortverbindung. „mit dem Gesicht zu Boden“ vermittelt die Prostrationshaltung klar und idiomatisch, während „vor seinen Füßen“ die ehrfürchtige räumliche Stellung bewahrt.
  terminology: „Samariter“ ist die etablierte und sachgerechte deutsche Wiedergabe von Σαμαρίτης. Die zurückhaltende Schlussaussage bewahrt die Hervorhebung durch αὐτός, ohne sie ausdeutend zu verstärken.
  issues:
  - severity: medium
    issue: Unnatürliche Stellung und Verbindung der Orts- und Haltungsangaben
    rationale: Die Formulierung „fiel vor seinen Füßen auf sein Angesicht“ ist zwar annähernd entschlüsselbar, klingt aber im modernen Deutsch sperrig und kann die körperliche Haltung unnötig verdunkeln. Die griechische Aussage beschreibt zugleich die Lage vor Jesu Füßen und das Niederfallen mit dem Gesicht zum Boden.
  revised_text: Und er fiel vor seinen Füßen mit dem Gesicht zu Boden und dankte ihm. Und er war ein Samariter.
  revised_footnotes: []
