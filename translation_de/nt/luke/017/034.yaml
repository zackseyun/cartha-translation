  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: de
  text: 'Ich sage euch: In jener Nacht werden zwei in einem Bett liegen; der eine wird mitgenommen[a], der andere wird zurückgelassen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird zu sich genommen“. Das griechische Verb sagt hier nicht ausdrücklich, ob das Mitnehmen Rettung oder Gericht bedeutet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird gelassen“. Das griechische Verb bezeichnet im Gegensatz zum Mitnehmen das Gelassenwerden; welche theologische Bedeutung dies hat, wird durch das Verb allein nicht festgelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Gibt die direkte und betonte Anrede in natürlichem, würdigem Deutsch wieder.
- source_word: ταύτῃ τῇ νυκτί
  choice: in jener Nacht
  rationale: Die temporale Dativverbindung bezeichnet die bestimmte, im Zusammenhang vorausgesetzte Nacht.
- source_word: ἔσονται δύο ἐπὶ κλίνης μιᾶς
  choice: werden zwei in einem Bett liegen
  rationale: Das im Deutschen ergänzte „liegen“ macht die durch κλίνη und den nächtlichen Kontext nahegelegte Situation idiomatisch deutlich, ohne die Aussage inhaltlich zu erweitern.
- source_word: ὁ εἷς
  choice: der eine
  rationale: Entspricht der substantivischen Verbindung aus Artikel und Zahlwort und bildet mit „der andere“ ein natürliches deutsches Gegensatzpaar.
- source_word: παραλημφθήσεται
  choice: wird mitgenommen
  rationale: παραλαμβάνω bezeichnet hier das Mit- oder An-sich-Nehmen. „Mitgenommen“ wahrt die Unbestimmtheit darüber, ob dies Rettung oder Gericht bedeutet.
- source_word: ὁ ἕτερος
  choice: der andere
  rationale: Gibt den Kontrast zwischen den beiden Personen natürlich und genau wieder.
- source_word: ἀφεθήσεται
  choice: wird zurückgelassen
  rationale: Im Gegensatz zu παραλημφθήσεται bedeutet ἀφίημι hier „zurücklassen“. Die Formulierung benennt keine spätere eschatologische Deutung, sondern nur den dargestellten Gegensatz.
theological_decisions:
- issue: Ob der Mitgenommene gerettet und der Zurückgelassene gerichtet wird oder umgekehrt
  choice: 'Der Haupttext bleibt neutral: Der eine wird mitgenommen, der andere zurückgelassen.'
  alternative: Explizit deuten, dass das Mitnehmen Rettung bezeichnet, oder ausdrücklich sagen, dass es Gericht bezeichnet.
  rationale: Die beiden griechischen Verben entscheiden in diesem Vers für sich genommen nicht, welches Schicksal jeweils positiv oder negativ ist. Diese theologische Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Satzbau. „In jener Nacht“ erhält den feierlich-eschatologischen Bezug, während „in einem Bett liegen“ im Deutschen natürlicher ist als eine wörtliche Kopula-Konstruktion.
