  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: de
  text: 'Und er sagte zu ihm: »Steh auf und geh! Dein Glaube[a] hat dich gerettet.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Vertrauen«. Das griechische Wort kann auch »Treue« bedeuten; hier ist »Glaube« die naheliegende Wiedergabe.
    reason: lexical_alternative
  - marker: b
    text: Oder »hat dich gesund gemacht« oder »hat dich geheilt«. Das griechische Verb kann Rettung, Heilung oder Bewahrung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: er sagte zu ihm
  rationale: Eine natürliche und zugleich eng am griechischen Erzählstil orientierte Wiedergabe; das Dativpronomen verweist auf den zuvor genannten Mann.
- source_word: Ἀναστὰς πορεύου
  choice: Steh auf und geh!
  rationale: Das Aoristpartizip Ἀναστάς ist hier mit dem folgenden Imperativ verbunden und hat auffordernde Kraft. »Steh auf« ist im modernen Deutsch würdig und natürlicher als das gehobenere »Erhebe dich«.
- source_word: πίστις
  choice: Glaube
  rationale: »Glaube« ist hier die übliche und sachlich offene Wiedergabe. Im Zusammenhang bezeichnet das Wort das vertrauende Antworten des Mannes; »Vertrauen« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: σέσωκέν σε
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω bezeichnet eine vollzogene Handlung mit fortdauernder Wirkung. »Gerettet« bewahrt die mögliche umfassendere Bedeutung, ohne den Ausdruck auf körperliche Heilung zu beschränken.
theological_decisions:
- issue: Bedeutung von σέσωκέν σε im Zusammenhang einer Heilung
  choice: hat dich gerettet
  alternative: hat dich gesund gemacht; hat dich geheilt
  rationale: σῴζω kann Rettung wie auch Heilung bezeichnen. Da bereits alle zehn Aussätzigen körperlich rein geworden waren, kann Jesu Wort an den zurückgekehrten Mann über die körperliche Heilung hinausweisen. Die Hauptübersetzung bewahrt diese Spannung; die engeren medizinischen Bedeutungen werden in der Fußnote genannt.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen; Treue
  rationale: Im unmittelbaren Zusammenhang ist das Vertrauen des Mannes wahrscheinlich gemeint. Das griechische Wort kann jedoch auch »Treue« bezeichnen; deshalb wird diese Bedeutungsbreite nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger direkter Rede. Die Satzstruktur bleibt nahe am griechischen Text, ohne unnatürlich zu wirken.
