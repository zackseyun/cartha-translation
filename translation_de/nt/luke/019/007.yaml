  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Das aoristische Partizip wird sinnvoll temporal entfaltet, πάντες bezeichnet die gesamte beobachtende Menge, διεγόγγυζον den anhaltenden missbilligenden Protest, und die direkte Rede gibt Eintritt und beabsichtigten Aufenthalt wieder. Die Umstellung von πάντες verbessert jedoch die eindeutige Zuordnung: Im Griechischen sind es alle, die dies sehen und darauf murren.'
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. „Bei einem sündigen Mann ist er eingekehrt, um dort zu bleiben“ ist verständlich, doch die Stellung von „alle“ ist weniger eng an das Sehen gebunden. Außerdem wird der Bezug des Aufenthalts durch „bei ihm“ klarer als durch das räumlich allgemeinere „dort“.
  terminology: „murrten“ trifft den negativen, biblisch geläufigen Ton von διεγόγγυζον. „Sündiger Mann“ bewahrt sowohl ἁμαρτωλῷ als auch ἀνδρί und gibt das abwertende Urteil der Menge wieder, ohne es zu kommentieren. „Eingekehrt“ ist für εἰσῆλθεν καταλῦσαι idiomatisch und angemessen.
