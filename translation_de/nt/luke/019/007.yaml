    issue: Stellung von „alle“
    rationale: „Als sie das sahen, murrten sie alle“ kann im Deutschen den Umfang primär mit dem Murren verbinden. „Als alle das sahen“ bildet die griechische Verbindung ἰδόντες πάντες unmittelbarer ab.
  - severity: low
    issue: Bezug von „dort“
    rationale: „Dort“ ist zwar kontextuell verständlich, aber „bei ihm“ stellt den in παρὰ ἁμαρτωλῷ ἀνδρί ausgedrückten persönlichen Aufenthalt ausdrücklich her.
