  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: de
  text: 'Als alle das sahen, murrten sie und sagten: »Bei einem sündigen Mann ist er eingekehrt, um bei ihm zu bleiben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Als sie das sahen
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben. »Das« nimmt aus dem Zusammenhang Jesu Hinwendung zu Zachäus und sein Einkehren bei ihm auf.
- source_word: πάντες
  choice: sie alle
  rationale: Bewahrt den umfassenden Charakter der Reaktion und klingt im Deutschen natürlich.
- source_word: διεγόγγυζον
  choice: murrten
  rationale: Das Imperfekt bezeichnet die einsetzende beziehungsweise andauernde missbilligende Reaktion. »Murrten« bewahrt den deutlich negativen Ton und den biblischen Sprachzusammenhang, ohne veraltet zu wirken.
- source_word: λέγοντες
  choice: und sagten
  rationale: Leitet im Deutschen auf natürliche Weise den Inhalt des Murrens ein.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: bei einem sündigen Mann
  rationale: παρά mit Dativ bezeichnet hier den Aufenthalt bei jemandem; die Wiedergabe bewahrt sowohl das Adjektiv ἁμαρτωλός als auch das ausdrücklich männliche Substantiv ἀνήρ.
- source_word: εἰσῆλθεν
  choice: ist er eingekehrt
  rationale: Im Zusammenhang eines Hauses bezeichnet εἰσέρχομαι das Hineingehen; »einkehren« verbindet idiomatisch das Eintreten mit dem folgenden Aufenthalt und passt zur vorwurfsvollen direkten Rede.
- source_word: καταλῦσαι
  choice: um dort zu bleiben
  rationale: Das Infinitivverb bezeichnet hier das Verweilen beziehungsweise den Aufenthalt als Gast. »Dort zu bleiben« ist klares modernes Deutsch und vermeidet die mögliche Überdeutung, dass zwingend eine Übernachtung gemeint sei.
theological_decisions:
- issue: Charakterisierung des Zachäus durch die Menge
  choice: bei einem sündigen Mann
  alternative: bei einem Sünder
  rationale: Die gewählte Fassung erhält die griechische Verbindung aus Adjektiv und ausdrücklich männlichem Substantiv, ohne das Urteil der Menge abzuschwächen oder zusätzliche theologische Aussagen hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Murrten« erhält den klagend-missbilligenden Ton; die direkte Rede bleibt knapp und zugänglich. Keine Fußnote ist nötig, da die Bedeutung von καταλῦσαι im Haupttext hinreichend genau wiedergegeben wird.
