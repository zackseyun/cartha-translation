id: LUK.19.37
reference: Luke 19:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: de
  text: Als er sich bereits dem Abhang des Ölbergs näherte, begann die ganze Schar der Jünger voller Freude, Gott mit lauter Stimme für all die Machttaten[a] zu loben, die sie gesehen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunder“ oder „machtvollen Taten“. Das griechische Wort bezeichnet hier Taten, in denen sich Macht erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Als er sich bereits … näherte
  rationale: Der Genitivus absolutus bildet den zeitlichen Hintergrund; „sich näherte“ bewahrt die Bewegung und „bereits“ gibt ἤδη wieder.
- source_word: πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: dem Abhang des Ölbergs
  rationale: „Abhang“ bezeichnet natürlich den abwärts führenden Hang; „Ölberg“ ist die etablierte deutsche Ortsbezeichnung.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: die ganze Schar der Jünger
  rationale: „Schar“ vermittelt eine größere zusammengehörige Gruppe und klingt im modernen Deutschen natürlicher als „Menge“, ohne sie als beliebige Volksmenge erscheinen zu lassen.
- source_word: ἤρξαντο … χαίροντες αἰνεῖν τὸν θεὸν
  choice: begann … voller Freude, Gott … zu loben
  rationale: „Begann … zu loben“ bildet die Konstruktion mit ἤρξαντο und Infinitiv ab; „voller Freude“ gibt das begleitende Partizip χαίροντες idiomatisch wieder.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die konkrete griechische Wendung wird in natürlichem und zugleich würdigem Deutsch bewahrt.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: für all die Machttaten, die sie gesehen hatten
  rationale: „Machttaten“ bewahrt den Bezug von δυνάμεις zu wirksamer Kraft, ohne den Ausdruck vorschnell auf einen technischen Wunderbegriff zu verengen; das Plusquamperfekt ordnet das Gesehene zeitlich vor dem Lob ein.
theological_decisions:
- issue: Wiedergabe von δύναμις im Zusammenhang übernatürlicher Taten
  choice: Machttaten
  alternative: Wunder; machtvolle Taten
  rationale: Der Ausdruck kann Kraftwirkungen, machtvolle Taten oder Wunder bezeichnen. „Machttaten“ erhält den Akzent auf sichtbar gewordener Macht und lässt die begriffliche Weite des griechischen Wortes bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Schar“ vermeidet die schwerfällige Formulierung „die ganze Menge der Jünger“; „voller Freude“ gibt die begleitende Handlung natürlich wieder.
