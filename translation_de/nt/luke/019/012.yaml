id: LUK.19.12
reference: Luke 19:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: de
  text: 'Da sagte er: »Ein Mann von vornehmer Herkunft zog in ein fernes Land, um für sich die Königsherrschaft[a] zu empfangen und zurückzukehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Königreich“, „das Königtum“ oder „die königliche Macht“. Das griechische Wort kann sowohl das Reich selbst als auch königliche Herrschaft oder Vollmacht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Da
  rationale: Kennzeichnet die folgernde beziehungsweise erzählerische Fortführung. „Da“ klingt im modernen Deutschen natürlich, ohne die Verbindung zum vorherigen Zusammenhang zu überzeichnen.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: Ein Mann von vornehmer Herkunft
  rationale: τις führt eine unbestimmte Person ein; εὐγενής bezeichnet hier hohe beziehungsweise vornehme Herkunft. Die Formulierung ist präziser und heute verständlicher als das mögliche, aber sozialhistorisch weniger eindeutige „ein Adliger“.
- source_word: ἐπορεύθη
  choice: zog
  rationale: Gibt die Reisebewegung in einem erzählenden, würdigen Register idiomatisch wieder.
- source_word: εἰς χώραν μακρὰν
  choice: in ein fernes Land
  rationale: Bewahrt sowohl den räumlichen Zielbezug als auch die betonte Entfernung.
- source_word: λαβεῖν ἑαυτῷ
  choice: um für sich … zu empfangen
  rationale: Der finale Infinitiv und der reflexive Dativ werden ausdrücklich wiedergegeben. „Empfangen“ lässt erkennen, dass die Herrschaft verliehen oder anerkannt wird, statt gewaltsam ergriffen zu werden.
- source_word: βασιλείαν
  choice: die Königsherrschaft
  rationale: Im politischen Zusammenhang bezeichnet das Wort besonders die einem Herrscher übertragene königliche Stellung oder Gewalt. Zugleich kann es auch das beherrschte Reich meinen; diese echte Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: ὑποστρέψαι
  choice: zurückzukehren
  rationale: Der zweite mit καί verbundene Infinitiv wird ohne einen im Griechischen nicht ausdrücklich vorhandenen zusätzlichen Zeitkonnektor wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von βασιλείαν im politisch geprägten Gleichnis
  choice: Königsherrschaft
  alternative: Königreich; Königtum; königliche Macht
  rationale: Die Szene handelt wahrscheinlich vom Empfang anerkannter königlicher Herrschaft, doch βασιλεία kann sowohl Herrschaft beziehungsweise Königtum als auch das Reich selbst bezeichnen. Die Übersetzung hebt den politischen Vorgang hervor, während die Fußnote die sachlich relevante Alternative bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Konstruktion bleibt nah am griechischen Satzbau, vermeidet jedoch unnatürliche Wörtlichkeit.
