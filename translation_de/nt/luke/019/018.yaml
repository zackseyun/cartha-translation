  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: de
  text: 'Dann kam der zweite und sagte: »Deine Mine, Herr, hat fünf Minen eingebracht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: der zweite
  rationale: Gibt die Reihenfolge des zweiten Dieners knapp und unmittelbar wieder.
- source_word: μνᾶ
  choice: Mine
  rationale: Bezeichnet die antike griechische Gewichts- und Geldeinheit präzise; die Wiederholung bleibt wie im Ausgangstext erhalten.
- source_word: κύριε
  choice: Herr
  rationale: Natürliche respektvolle Anrede an den Herrn der Diener im Gleichnis, ohne darüber hinaus eine christologische Deutung einzutragen.
- source_word: ἐποίησεν
  choice: hat … eingebracht
  rationale: Im wirtschaftlichen Zusammenhang bedeutet das Verb, dass die anvertraute Mine einen Ertrag von fünf Minen erzielt hat; »eingebracht« klingt im Deutschen natürlicher als das wörtliche »gemacht«.
theological_decisions:
- issue: Bedeutung der Anrede κύριε
  choice: Herr
  alternative: mein Herr
  rationale: »Herr« bewahrt die übliche und kontextgerechte Anrede; ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist natürlich formuliert, während die antike Geldeinheit »Mine« zur historischen Genauigkeit beibehalten wird.
