  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: de
  text: 'Dann rief er zehn seiner eigenen Sklaven[a] zu sich, gab ihnen zehn Minen[b] und sagte zu ihnen: »Treibt Handel, bis ich komme.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort doulos kann je nach Zusammenhang einen Sklaven oder einen Diener bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Eine Mine war eine antike Geldeinheit.
    reason: cultural_note
  - marker: c
    text: 'Oder: »Macht Geschäfte, bis ich komme.«; »Handelt damit, bis ich komme.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Dann rief er … zu sich
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Übergabe vorausgeht. Die koordinierte deutsche Formulierung gibt die zeitliche Abfolge natürlich wieder.
- source_word: δούλους
  choice: Sklaven
  rationale: Im Gleichnis besteht ein Besitz- und Abhängigkeitsverhältnis zu einem Herrn; »Sklaven« bildet diese antike soziale Wirklichkeit deutlicher ab als das weiter gefasste »Diener«.
- source_word: ἑαυτοῦ
  choice: seiner eigenen
  rationale: Das Reflexivpronomen betont die Zugehörigkeit; »seiner eigenen« bewahrt diesen Nachdruck.
- source_word: μνᾶς
  choice: Minen
  rationale: Die Transliteration erhält die historische Währungseinheit und vermeidet eine irreführende Gleichsetzung mit einer modernen Währung.
- source_word: Πραγματεύσασθε
  choice: Treibt Handel
  rationale: Der Imperativ fordert zu geschäftlicher Tätigkeit mit dem anvertrauten Geld auf, ohne eine bestimmte Form des Handels oder der Geldanlage festzulegen.
- source_word: ἐν ᾧ ἔρχομαι
  choice: bis ich komme
  rationale: Die Wendung hat hier zeitlichen Sinn. Die Übersetzung ist idiomatisch und fügt das im Griechischen nicht ausdrücklich stehende »zurück« nicht in den Haupttext ein.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Herren-Sklaven-Rahmen des Gleichnisses
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Der Kontext betont, dass die Personen dem Herrn gehören und über sein Vermögen verfügen sollen. »Sklaven« wahrt dieses historisch-soziale Verhältnis, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
- issue: Zeitliche Aussage von ἐν ᾧ ἔρχομαι
  choice: bis ich komme
  alternative: bis ich zurückkomme; während ich fort bin
  rationale: »Bis ich komme« bewahrt die knappe Form und die Perspektive des griechischen Wortlauts. »Zurückkomme« wäre im Kontext verständlich, aber expliziter als die Vorlage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Treibt Handel« ist knapp und für den geschäftlichen Auftrag passend; die historisch erklärungsbedürftigen Begriffe werden in Fußnoten erläutert.
