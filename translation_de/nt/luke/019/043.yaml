id: LUK.19.43
reference: Luke 19:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: de
  text: Denn es werden Tage über dich kommen, da deine Feinde einen Belagerungswall gegen dich errichten[a], dich umzingeln und von allen Seiten bedrängen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Palisade gegen dich errichten.'
    reason: 'Lexikalische Alternative: χάραξ kann eine aus Pfählen errichtete Befestigung beziehungsweise Palisade, im Belagerungskontext aber auch allgemeiner einen Belagerungswall bezeichnen.'
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise nähere Entfaltung der vorausgehenden Klage Jesu ein und bewahrt den kausalen Zusammenhang.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: es werden Tage über dich kommen
  rationale: Bewahrt die prophetische Zeitformel und gibt ἐπὶ σὲ als ein über Jerusalem hereinbrechendes Geschehen wieder.
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: einen Belagerungswall gegen dich errichten
  rationale: Die Wortverbindung bezeichnet im Kontext den Bau einer gegen die Stadt gerichteten Belagerungsanlage. „Belagerungswall“ ist im heutigen Deutsch klar, ohne die Bauart unnötig festzulegen.
- source_word: οἱ ἐχθροί σου
  choice: deine Feinde
  rationale: Direkte und natürliche Wiedergabe der possessiven Wendung.
- source_word: περικυκλώσουσίν σε
  choice: dich umzingeln
  rationale: Gibt das vollständige militärische Einschließen knapp und idiomatisch wieder.
- source_word: συνέξουσίν σε πάντοθεν
  choice: dich von allen Seiten bedrängen
  rationale: Drückt sowohl die räumliche Einschließung als auch den zunehmenden Druck der Belagerung aus, ohne das Verb auf bloßes Umgeben zu reduzieren.
theological_decisions:
- issue: Bezug der Pronomen in der Anrede Jesu an Jerusalem
  choice: Die singularische Anrede „dich/deine“ bleibt erhalten und richtet sich an das personifizierte Jerusalem.
  alternative: Die Anrede könnte ausdrücklich auf die Bewohner der Stadt bezogen und pluralisch wiedergegeben werden.
  rationale: Die griechischen Singularformen führen die unmittelbare Anrede Jerusalems fort. Eine Auflösung in die Einwohner würde die poetisch-prophetische Personifikation interpretierend abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Ton. Die militärischen Ausdrücke sind allgemein verständlich; die seltenere konkrete Deutung von χάραξ wird in der Fußnote erhalten.
