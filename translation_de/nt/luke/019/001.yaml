  edition: SBLGNT
  text: Καὶ εἰσελθὼν διήρχετο τὴν Ἰεριχώ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: de
  text: Und er kam nach Jericho hinein und zog durch die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und nachdem er hineingekommen war, zog er durch Jericho.“'
    reason: Die Fußnote macht die partizipiale Satzstruktur und die zweimalige Beziehung auf Jericho sichtbar, die im flüssigen Haupttext idiomatisch entfaltet wird.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der schlichte erzählerische Anschluss wird bewahrt, ohne durch „Dann“ eine stärkere zeitliche Deutung einzutragen.
- source_word: εἰσελθὼν
  choice: er kam nach Jericho hinein
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die sachlich vor bzw. beim Einsetzen der durch das Hauptverb beschriebenen Bewegung liegt. Die finite Wiedergabe ist im Deutschen natürlich und vermeidet die schwerfällige Form „hineingekommen seiend“.
- source_word: διήρχετο
  choice: zog durch die Stadt
  rationale: Das Imperfekt beschreibt den Verlauf der Bewegung. „zog durch“ ist idiomatisch und lässt erkennen, dass Jesus sich durch Jericho hindurchbewegte; „die Stadt“ macht den im Deutschen sonst unbeholfenen Wechsel von „hineinkommen“ zu „durchziehen“ klar.
- source_word: τὴν Ἰεριχώ
  choice: nach Jericho … durch die Stadt
  rationale: Der Ortsname bezeichnet sowohl das Ziel des Hineinkommens als auch den durchquerten Ort. Die Wiederaufnahme mit „die Stadt“ ist eine natürliche deutsche Entfaltung, ohne einen neuen Sachinhalt einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzähldeutsch. Die Verlaufsbedeutung des griechischen Imperfekts wird durch den Bewegungsausdruck „zog durch“ gewahrt; die syntaktische Verdichtung des griechischen Partizips wird im Haupttext natürlich aufgelöst.
