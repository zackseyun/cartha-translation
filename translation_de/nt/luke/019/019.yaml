  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: de
  text: 'Zu diesem sagte er ebenfalls: »Und du sollst über fünf Städte gestellt werden[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über fünf Städte herrschen«; oder: »für fünf Städte zuständig sein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: Auch zu diesem sagte er
  rationale: δέ verbindet hier locker mit dem vorherigen Geschehen, während καί bei τούτῳ den weiteren Diener in die parallele Abfolge einbezieht. Die demonstrative Bedeutung von τούτῳ bleibt mit „diesem“ erhalten.
- source_word: Καὶ σὺ
  choice: Und du
  rationale: Die ausdrückliche Anrede bewahrt die Betonung des zweiten Dieners und die Parallele zur vorausgehenden Beauftragung.
- source_word: ἐπάνω γίνου
  choice: sollst … herrschen
  rationale: Die Verbindung aus γίνου und ἐπάνω bezeichnet hier die Übertragung einer leitenden Vollmacht. „Herrschen“ gibt diese Funktion im Deutschen natürlich und im Kontext des Königs und seiner Städte verständlich wieder; die modal formulierte Anweisung entspricht idiomatischem Deutsch.
- source_word: πέντε πόλεων
  choice: über fünf Städte
  rationale: πόλις bezeichnet gewöhnlich eine Stadt; der Genitiv hängt von ἐπάνω ab und benennt den Bereich der übertragenen Vollmacht.
theological_decisions:
- issue: Art der übertragenen Vollmacht
  choice: herrschen
  alternative: über fünf Städte eingesetzt sein; die Aufsicht über fünf Städte haben
  rationale: Der Text spricht von einer Autoritätsstellung, legt aber deren genaue administrative Form nicht fest. Die Übersetzung lässt daher offen, wie diese Herrschaft konkret ausgeübt wird; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe direkte Rede und die betonte Anrede „Und du“ folgen der Struktur des griechischen Textes.
