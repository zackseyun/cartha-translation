id: LUK.19.9
reference: Luke 19:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: de
  text: 'Jesus sagte zu ihm: „Heute ist diesem Haus[a] Rettung zuteilgeworden, weil auch er ein Sohn Abrahams ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Hausgemeinschaft“. Das griechische Wort kann sowohl das Haus selbst als auch die dazugehörige Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: δέ ist hier ein schwaches narratives Bindewort und muss im natürlichen Deutschen nicht eigens wiedergegeben werden. Das ausdrückliche Pronomen αὐτόν bleibt mit „ihm“ erhalten.
- source_word: Σήμερον
  choice: Heute
  rationale: Die Voranstellung bewahrt die zeitliche Hervorhebung des griechischen Satzes.
- source_word: σωτηρία
  choice: Rettung
  rationale: „Rettung“ ist ein natürliches, gewichtiges deutsches Äquivalent, das im lukanischen Zusammenhang sowohl konkrete als auch umfassende heilsgeschichtliche Bedeutung tragen kann, ohne diese näher festzulegen.
- source_word: τῷ οἴκῳ τούτῳ
  choice: diesem Haus
  rationale: οἶκος kann sowohl das Haus als Ort als auch die zugehörige Hausgemeinschaft bezeichnen. „Diesem Haus“ bewahrt das Bild und bleibt im Deutschen für beide Bezüge offen.
- source_word: ἐγένετο
  choice: ist ... zuteilgeworden
  rationale: Die Wendung gibt das Eintreten bzw. Zukommen der Rettung idiomatisch wieder und berücksichtigt den Dativ τῷ οἴκῳ, ohne ein im Griechischen nicht vorhandenes Bewegungsverb vorauszusetzen.
- source_word: καθότι
  choice: weil
  rationale: Die Konjunktion führt hier die Begründung für Jesu Aussage ein.
- source_word: καὶ αὐτὸς
  choice: auch er
  rationale: Die Formulierung bewahrt die Betonung seiner Einbeziehung.
- source_word: υἱὸς Ἀβραάμ
  choice: ein Sohn Abrahams
  rationale: Die wörtliche Beziehungsbezeichnung erhält ihre rhetorische und bundestheologische Resonanz und verengt sie nicht auf eine einzige Deutung.
theological_decisions:
- issue: Bedeutung von „Sohn Abrahams“
  choice: Die Wendung bleibt unverändert als Identitäts- und Zugehörigkeitsbezeichnung stehen.
  alternative: „ein Nachkomme Abrahams“ oder „ein Angehöriger der Glaubensfamilie Abrahams“
  rationale: Der Vers entscheidet nicht ausdrücklich, ob ethnische Abstammung, Zugehörigkeit aufgrund des Glaubens oder beides gemeint ist. Die idiomatische Form bewahrt diese Spannung.
- issue: Reichweite der Rettung
  choice: „diesem Haus“ bleibt offen für Zachäus’ Wohnort und seine Hausgemeinschaft.
  alternative: ausschließlich „diesem Haushalt“
  rationale: οἶκος kann beide Bedeutungsbereiche umfassen; eine Festlegung würde die echte lexikalische Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Zuteilgeworden“ ist gegenüber Alltagssprache leicht gehoben, bildet hier jedoch das Eintreten der Rettung präzise und natürlich ab.
