id: LUK.19.47
reference: Luke 19:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: de
  text: Und er lehrte Tag für Tag im Tempel. Die führenden Priester aber, die Schriftgelehrten und die führenden Männer des Volkes suchten ihn umzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: er lehrte
  rationale: Die periphrastische Imperfektform bezeichnet eine fortdauernde beziehungsweise wiederholte Tätigkeit in der Vergangenheit; zusammen mit »Tag für Tag« gibt das deutsche Imperfekt diesen Sinn natürlich wieder.
- source_word: τὸ καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die Wendung bewahrt den distributiven Sinn und betont, dass Jesus regelmäßig an den einzelnen Tagen lehrte.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbezirk, nicht nur das innere Heiligtum. »Im Tempel« ist die übliche knappe deutsche Wiedergabe und kann den Gesamtkomplex einschließen.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die priesterliche Führungsschicht. »Führende Priester« ist im heutigen Deutsch verständlich und vermeidet das missverständliche »Hohepriester«, das mehrere gleichzeitig amtierende höchste Priester nahelegen könnte.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Dies ist die etablierte und sachlich genaue Bezeichnung für die in den heiligen Schriften und ihrer Auslegung kundigen Fachleute.
- source_word: ἐζήτουν
  choice: suchten
  rationale: Das Imperfekt beschreibt ein anhaltendes Bestreben. Im Zusammenhang bedeutet »suchten ihn umzubringen«, dass sie fortgesetzt auf dieses Ziel hinarbeiteten.
- source_word: αὐτὸν ἀπολέσαι
  choice: ihn umzubringen
  rationale: ἀπόλλυμι kann »vernichten« oder, auf eine Person bezogen, »töten/umbringen« bedeuten. Der Kontext macht die beabsichtigte Tötung Jesu deutlich; »umbringen« ist natürlich und wahrt die feindselige Zielrichtung.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: die führenden Männer des Volkes
  rationale: πρῶτοι bedeutet wörtlich die »Ersten« und bezeichnet hier angesehene oder einflussreiche Personen. Die Wiedergabe erhält sowohl ihren führenden gesellschaftlichen Rang als auch den maskulinen Bezug.
theological_decisions:
- issue: Reichweite und Art der gegen Jesus gerichteten Absicht in ἀπολέσαι
  choice: ihn umzubringen
  alternative: ihn zu vernichten
  rationale: Die personale Konstruktion und der erzählerische Zusammenhang weisen auf die beabsichtigte Tötung Jesu. Die Übersetzung legt jedoch weder ein bestimmtes Vorgehen noch eine rechtliche Form der Hinrichtung fest.
- issue: Geschlechtlicher Bezug von οἱ πρῶτοι τοῦ λαοῦ
  choice: die führenden Männer des Volkes
  alternative: die führenden Leute des Volkes / die Führenden des Volkes
  rationale: Der grammatisch maskuline Ausdruck bezeichnet im historischen Zusammenhang wahrscheinlich männliche Notabeln. »Männer« macht diesen naheliegenden Bezug sichtbar, ohne ihre genaue amtliche Stellung näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Das einleitende »Und« bildet Καί ab; »aber« erhält den Kontrast von δέ. Die drei Gruppen bleiben syntaktisch gleichgeordnet. Keine Fußnote ist erforderlich, da die möglichen Bedeutungsnuancen im Haupttext hinreichend genau und verständlich wiedergegeben werden.
