  source_fidelity: Der Genitivus absolutus wird mit „Während er weiterzog“ treffend als begleitende, andauernde Handlung wiedergegeben. Das Imperfekt ὑπεστρώννυον kommt durch „breiteten … aus“ angemessen zur Geltung. „Ihre Obergewänder“ gibt τὰ ἱμάτια ἑαυτῶν im Prozessionskontext sachgerecht wieder; die Fußnote bewahrt die weitere Bedeutung „Kleider“. „Auf der Straße“ entspricht ἐν τῇ ὁδῷ idiomatisch und kontextgerecht.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt einen würdevollen erzählerischen Registerton. Die Wortstellung ist natürlich; „Während“ und das Präteritum bilden den laufenden Vorgang klar ab.
