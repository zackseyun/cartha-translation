  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: de
  text: Während er weiterzog, breiteten sie ihre Obergewänder[a] auf der Straße aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kleider“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Während er weiterzog
  rationale: Der Genitivus absolutus mit dem Präsenspartizip bezeichnet eine gleichzeitig andauernde Handlung. „Während er weiterzog“ gibt dies natürlich wieder; δέ fungiert hier nur als schwacher Erzählanschluss und muss im Deutschen nicht eigens übersetzt werden.
- source_word: ὑπεστρώννυον
  choice: breiteten … aus
  rationale: Das Imperfekt schildert die fortlaufende beziehungsweise wiederholte Handlung der Menschen entlang des Weges. Im Zusammenhang mit Kleidungsstücken auf einer Straße ist „ausbreiten“ idiomatisch.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: ihre Obergewänder
  rationale: ἱμάτια bezeichnet allgemein Kleidungsstücke, häufig besonders die äußeren Gewänder. „Obergewänder“ ist hier konkret und historisch angemessen, ohne moderne Mäntel vorauszusetzen.
- source_word: ἐν τῇ ὁδῷ
  choice: auf der Straße
  rationale: Die Präpositionalphrase bezeichnet den Ort. „Auf der Straße“ ist im Deutschen für dort ausgebreitete Kleidungsstücke natürlich und vermeidet die mögliche metaphorische Lesart von „auf dem Weg“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortlaufende Handlung bleibt erkennbar, ohne die knappe Erzählweise unnötig auszubauen.
