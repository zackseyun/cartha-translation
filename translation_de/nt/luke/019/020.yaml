  source_fidelity: 'Die Wiedergabe trifft die zentralen Elemente gut: ὁ ἕτερος als „der andere“, die Anrede Κύριε als „Herr“, ἰδού als vorzeigendes „sieh, hier ist“, μνᾶ als „Mine“ und σουδάριον als „Tuch“. Die deutsche Plusquamperfektform „Ich hatte sie … verwahrt“ legt jedoch eher eine bereits abgeschlossene, vorzeitige Handlung nahe. Das Imperfekt εἶχον mit dem Partizip ἀποκειμένην beschreibt den anhaltenden Zustand, dass die Mine verwahrt dalag bzw. gehalten wurde.'
