  terminology: „Herr“ ist als Anrede für Κύριε angemessen und wahrt die mögliche Resonanz des Gleichnisses ohne zusätzliche Deutung. „Mine“ ist die etablierte Bezeichnung der antiken Geldeinheit. „Tuch“ ist für σουδάριον bewusst allgemein und die Fußnote bietet passende spezifischere Möglichkeiten.
