  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: de
  text: 'Und der andere kam und sagte: »Herr, sieh, hier ist deine Mine, die ich in einem Tuch[a] aufbewahrte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einem Schweißtuch« beziehungsweise »in einem Taschentuch«. Das griechische Wort bezeichnet ein kleines Tuch, das unter anderem zum Abwischen von Gesicht oder Schweiß verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: der andere
  rationale: Die bestimmte Form bezeichnet den anderen beziehungsweise noch verbleibenden Diener und bewahrt den Kontrast zu den zuvor genannten Dienern.
- source_word: ἦλθεν λέγων
  choice: kam und sagte
  rationale: Die Verbindung aus finitem Verb und Partizip wird im Deutschen natürlich als koordinierte Erzählfolge wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede passt zum Herrn der Diener und lässt zugleich mögliche weitergehende Resonanzen des Gleichnisses offen.
- source_word: ἰδοὺ
  choice: sieh, hier ist
  rationale: Die Formulierung gibt sowohl den Aufmerksamkeitsruf als auch das Vorzeigen der Mine in heutigem Deutsch wieder.
- source_word: ἡ μνᾶ σου
  choice: deine Mine
  rationale: „Mine“ ist die etablierte deutsche Bezeichnung der antiken Gewichts- und Geldeinheit und vermeidet eine irreführende Umrechnung in modernes Geld.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: Ich hatte sie … verwahrt
  rationale: Die Formulierung drückt den fortdauernden Zustand des Aufbewahrens aus und ergibt zugleich einen natürlichen deutschen Satz.
- source_word: ἐν σουδαρίῳ
  choice: in einem Tuch
  rationale: σουδάριον bezeichnet ein kleines Tuch, insbesondere ein Schweiß- oder Gesichtstuch. Der allgemeinere Ausdruck „Tuch“ vermeidet eine zu moderne Festlegung; die genauere Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede innerhalb des Gleichnisses
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist im Verhältnis eines Dieners zu seinem Herrn idiomatisch, entspricht der üblichen Wiedergabe von κύριος und hält mögliche theologische Resonanzen offen, ohne sie ausdrücklich festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „sieh, hier ist“ bewahrt die vorzeigende Funktion von ἰδού.
