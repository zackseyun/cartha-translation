  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: de
  text: 'Denn ich hatte Angst vor dir, weil du ein harter Mann bist[a]: Du nimmst, was du nicht hingelegt hast[b], und erntest, was du nicht gesät hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein strenger“ beziehungsweise „ein unerbittlicher Mann“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „was du nicht hingelegt hast“. Auch: „was du nicht abgelegt hast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: ich hatte Angst
  rationale: Das Imperfekt bezeichnet die in der Vergangenheit andauernde Furcht des Dieners; „ich hatte Angst“ ist dafür natürliches modernes Deutsch.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ wahrt den begründenden Anschluss an die vorherige Aussage.
- source_word: αὐστηρός
  choice: hart
  rationale: Das Wort bezeichnet einen strengen, unerbittlichen oder harten Menschen. „Hart“ erhält den vorwurfsvollen Ton der Aussage des Dieners, ohne über dessen Behauptung hinauszugehen.
- source_word: αἴρεις
  choice: du nimmst an dich
  rationale: Die Wendung gibt das Aufnehmen oder Wegnehmen wieder und bleibt allgemein genug, um die wirtschaftliche Bildsprache nicht unnötig auf das Abheben von Geld festzulegen.
- source_word: ὃ οὐκ ἔθηκας
  choice: was du nicht hingelegt hast
  rationale: Die konkrete Grundbedeutung von τίθημι („legen, hinstellen“) bleibt erhalten; eine spezifischere Deutung wie „einzahlen“ wird nicht in den Haupttext eingetragen.
- source_word: θερίζεις
  choice: du erntest
  rationale: „Ernten“ gibt die landwirtschaftliche Metapher idiomatisch wieder und erhält die Verbindung mit dem Säen.
- source_word: ὃ οὐκ ἔσπειρας
  choice: was du nicht gesät hast
  rationale: Die direkte Metapher und das vertraute Wortpaar „säen–ernten“ bleiben erhalten.
- source_word: ἄνθρωπος
  choice: Mann
  rationale: Gemeint ist die konkrete männliche Figur des Gleichnisses, nicht der Mensch im allgemeinen Sinn.
theological_decisions:
- issue: Soll die Beschreibung des Herrn durch den Diener abgeschwächt werden?
  choice: Der vorwurfsvolle Ausdruck „ein harter Mann“ bleibt erhalten.
  alternative: Eine mildere Wiedergabe wie „ein strenger Mann“ oder „ein anspruchsvoller Mann“.
  rationale: Der Vers berichtet die eigene Anklage des Dieners. Die Übersetzung soll deren Schärfe bewahren, ohne vorwegzunehmen, ob sie den Herrn zutreffend beschreibt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der parallele Satzbau und die Bildfolge vom Nehmen sowie vom Ernten und Säen werden bewahrt; die Rede des Dieners bleibt bewusst scharf.
