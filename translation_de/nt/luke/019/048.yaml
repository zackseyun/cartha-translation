    issue: „Doch“ für καί
    rationale: Das griechische καί verbindet hier schlicht mit dem Vorhergehenden; ein adversatives „Doch“ setzt einen Kontrast, den der Wortlaut nicht markiert.
  - severity: medium
    issue: „etwas gegen ihn zu unternehmen“
    rationale: Die Ergänzung „gegen ihn“ ist zwar kontextuell naheliegend, wird aber durch τὸ τί ποιήσωσιν nicht ausdrücklich gesagt. Die Übersetzung sollte die offene Formulierung des griechischen Textes bewahren.
  - severity: low
    issue: „begierige Aufmerksamkeit“ in der Fußnote
    rationale: „Begierig“ kann im heutigen Deutsch unerwünschte Nebenbedeutungen haben. „Gespannte, aufmerksame Aufmerksamkeit“ erklärt das Idiom klarer und neutraler.
