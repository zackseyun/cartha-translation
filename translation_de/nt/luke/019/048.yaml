  verdict: revise
  source_fidelity: Die Wiedergabe des anhaltenden erfolglosen Suchens und der begründenden Aufmerksamkeit des Volkes ist grundsätzlich zutreffend. „Doch“ gibt καί jedoch unnötig adversativ wieder, und „etwas gegen ihn zu unternehmen“ ergänzt eine im griechischen Wortlaut nicht ausgedrückte Zielrichtung.
  naturalness: „An seinen Lippen hängen und ihm zuhören“ ist eine natürliche, idiomatische deutsche Wiedergabe der intensiven Aufmerksamkeit. „Sie fanden nicht heraus, was sie tun sollten“ ist modernes Standarddeutsch und gibt den deliberativen Inhalt ohne die zusätzliche Deutung wieder.
  terminology: „Das ganze Volk“ gibt ὁ λαὸς ἅπας angemessen wieder. Die Fußnote sollte die idiomatische Bedeutung sachlich als „gespannte, aufmerksame“ statt „begierige“ Aufmerksamkeit erläutern.
  issues:
