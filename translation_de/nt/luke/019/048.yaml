  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: de
  text: Und sie fanden nicht heraus, was sie tun sollten, denn das ganze Volk hing an seinen Lippen und hörte ihm zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn das ganze Volk hing an ihm und hörte zu.“ Die griechische Wendung bezeichnet gespannte, aufmerksame Zuwendung zu Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: sie fanden keinen Weg
  rationale: Der negierte Imperfekt beschreibt ihr fortdauerndes, erfolgloses Suchen nach einer Möglichkeit; die Formulierung gibt diesen praktischen Sinn in natürlichem Deutsch wieder.
- source_word: τὸ τί ποιήσωσιν
  choice: etwas gegen ihn zu unternehmen
  rationale: Die Konstruktion bezeichnet den gesuchten Handlungsweg. Aus dem unmittelbaren Zusammenhang ergibt sich, dass die Verantwortlichen gegen Jesus vorgehen wollten; „unternehmen“ bewahrt dabei die Unbestimmtheit der konkreten Maßnahme.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: denn das ganze Volk
  rationale: γάρ begründet ihr erfolgloses Suchen; λαός und ἅπας werden umfassend und quellennah mit „das ganze Volk“ wiedergegeben.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: hing an seinen Lippen
  rationale: Die geläufige deutsche Wendung vermittelt die intensive, gebannte Aufmerksamkeit des griechischen Idioms, ohne ein körperliches Festhalten nahezulegen.
- source_word: ἀκούων
  choice: und hörte ihm zu
  rationale: Das präsentische Partizip beschreibt die gleichzeitig andauernde Weise der Aufmerksamkeit. Der Singular entspricht dem grammatisch singularischen Kollektiv „Volk“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „An seinen Lippen hängen“ ist idiomatisch, während die Fußnote die formnähere Wiedergabe und die im Griechischen ausdrücklich auf Jesus bezogene Formulierung bewahrt.
