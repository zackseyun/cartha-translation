  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: de
  text: Da beeilte er sich, stieg herunter und nahm ihn voller Freude bei sich auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er beeilte sich, stieg hinab und nahm ihn freudig auf.“'
    reason: Lexikalisch und syntaktisch mögliche, formnähere Wiedergabe von σπεύσας, κατέβη und χαίρων.
lexical_decisions:
- source_word: σπεύσας
  choice: schnell
  rationale: Das aoristische Partizip bezeichnet unverzügliches, eiliges Handeln. Zusammen mit „stieg … herunter“ gibt „schnell“ dies in natürlichem modernem Deutsch wieder.
- source_word: κατέβη
  choice: stieg … herunter
  rationale: Die Form bezeichnet die abwärts gerichtete Bewegung; im Kontext steigt Zachäus vom Baum herunter.
- source_word: ὑπεδέξατο
  choice: nahm … bei sich auf
  rationale: Das Medium von ὑποδέχομαι bezeichnet hier ein gastliches Aufnehmen. „Bei sich aufnehmen“ bewahrt diesen Sinn deutlicher als das allgemeinere „empfangen“.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus.
- source_word: χαίρων
  choice: voller Freude
  rationale: Das präsentische Partizip beschreibt die begleitende innere Haltung. „Voller Freude“ ist idiomatisch und wahrt den deutlichen Bezug zu χαίρω.
- source_word: καὶ … καὶ
  choice: Da … und
  rationale: Die Konjunktionen verbinden die Handlungen in schlichter erzählerischer Folge. Das einleitende „Da“ stellt im Deutschen natürlich den unmittelbaren Anschluss an Jesu Aufforderung her, ohne eine zusätzliche Ursache einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gastliche Nuance von ὑπεδέξατο wird durch „bei sich aufnehmen“ erhalten; der Satz bleibt knapp und erzählerisch.
