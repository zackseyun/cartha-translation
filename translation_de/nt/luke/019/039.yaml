source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: de
  text: 'Und einige von den Pharisäern aus der Menge sagten zu ihm: „Lehrer, weise deine Jünger zurecht!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: einige von den Pharisäern
  rationale: τινες mit partitivem Genitiv bezeichnet eine nicht näher bestimmte Teilgruppe der Pharisäer. Die Formulierung ist im modernen Deutsch natürlich und bildet die partitive Beziehung klar ab.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: aus der Menge
  rationale: 'ἀπό bezeichnet hier Herkunft beziehungsweise Zugehörigkeit: Die betreffenden Pharisäer kommen aus der versammelten Menge. „Aus der Menge“ gibt dies knapp und idiomatisch wieder.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: sagten … zu ihm
  rationale: Die gewöhnliche griechische Redeeinleitung mit λέγω und πρός plus Akkusativ wird im Deutschen natürlich mit „zu jemandem sagen“ wiedergegeben.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Der Vokativ von διδάσκαλος bezeichnet Jesus hier in seiner Rolle als Lehrer. „Lehrer“ ist verständlich und vermeidet eine stärkere Autoritäts- oder Bekenntnisaussage, als das Wort selbst verlangt.
- source_word: ἐπιτίμησον
  choice: weise … zurecht
  rationale: Der Aoristimperativ fordert ein entschiedenes Eingreifen durch tadelnde Zurechtweisung. „Zurechtweisen“ bewahrt diese Kraft, ohne wie „zum Schweigen bringen“ bereits das beabsichtigte Ergebnis in das Verb hineinzulesen.
- source_word: τοῖς μαθηταῖς σου
  choice: deine Jünger
  rationale: μαθητής wird im Evangelienkontext als „Jünger“ wiedergegeben und bewahrt die etablierte Lehrer-Schüler-Beziehung. Der griechische Dativ wird von der deutschen Konstruktion „jemanden zurechtweisen“ idiomatisch als Akkusativ ausgedrückt.
theological_decisions:
- issue: Διδάσκαλε als Anrede für Jesus
  choice: Lehrer
  alternative: Meister
  rationale: Die Anrede hebt hier zunächst Jesu Lehrfunktion hervor und ist nicht notwendig als christologisches Bekenntnis zu verstehen. „Lehrer“ wahrt diese Zurückhaltung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzanfangsform „Da“ führt die Reaktion im Erzählfluss natürlich fort. Der Imperativ mit Ausrufezeichen gibt die Dringlichkeit der direkten Aufforderung wieder.
