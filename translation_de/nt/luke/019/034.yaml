base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: de
  text: 'Sie sagten: »Der Herr braucht es.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Besitzer braucht es«, wenn κύριος hier im Sinn von Besitzer oder Eigentümer des Fohlens und nicht als Titel für Jesus verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie
  rationale: Der substantivierte Artikel bezeichnet die zuvor genannten Sprecher. Das schwache Anschlusswort δέ muss im natürlichen deutschen Erzählfluss hier nicht eigens wiedergegeben werden.
- source_word: εἶπαν
  choice: sagten
  rationale: Der Aorist von λέγω wird schlicht mit »sagten« wiedergegeben; »antworteten« wäre kontextuell möglich, fügte aber eine im Verb nicht ausdrücklich enthaltene Nuance hinzu.
- source_word: ὅτι
  choice: durch Doppelpunkt und Anführungszeichen wiedergegeben
  rationale: ὅτι leitet hier direkte Rede ein; im Deutschen übernehmen Zeichensetzung und Anführungszeichen diese Funktion idiomatisch.
- source_word: Ὁ κύριος
  choice: Der Herr
  rationale: κύριος bezeichnet im lukanischen Zusammenhang wahrscheinlich Jesus und wird daher als Titel mit »der Herr« wiedergegeben. Die ebenfalls mögliche Bedeutung »Besitzer/Herr« bleibt in der Fußnote erhalten.
- source_word: αὐτοῦ
  choice: es
  rationale: Das Genitivpronomen bezieht sich am natürlichsten auf das zuvor erwähnte Fohlen. Beim deutschen Verb »brauchen« steht das Bezugswort idiomatisch als Akkusativobjekt.
- source_word: χρείαν ἔχει
  choice: braucht
  rationale: Die griechische Wendung bedeutet wörtlich »hat Bedarf an«. Das einfache deutsche »braucht« gibt sie klar, natürlich und vollständig wieder.
theological_decisions:
- issue: Bezug und Bedeutung von κύριος in der Antwort der Jünger
  choice: »Der Herr«, im Kontext wahrscheinlich auf Jesus bezogen
  alternative: »Der Besitzer braucht es«, falls κύριος den Herrn beziehungsweise Besitzer des Fohlens bezeichnet
  rationale: Lukas gebraucht κύριος häufig als Bezeichnung für Jesus, und hier wiederholen die Jünger die von Jesus vorgegebene Antwort. Da κύριος zugleich »Herr«, »Gebieter« oder im Kontext »Besitzer« bedeuten kann, wird die echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte, idiomatische Formulierung »braucht es« vermeidet das heute steife »hat es nötig«, ohne den Sinn abzuschwächen.
