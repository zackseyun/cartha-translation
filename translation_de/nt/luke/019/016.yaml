  variant: modern standard German
source:
  edition: SBLGNT
  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: de
  text: 'Da kam der Erste und sagte: »Herr,[a] deine Mine hat zehn Minen dazugewonnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebieter«. Das griechische κύριε kann als respektvolle Anrede für einen Vorgesetzten gebraucht werden, ebenso aber »Herr« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: kam
  rationale: παραγίνομαι bezeichnet hier im erzählerischen Zusammenhang das Herankommen bzw. Erscheinen vor dem Herrn; „kam“ ist natürlich und prägnant.
- source_word: δὲ
  choice: Da
  rationale: δέ führt den nächsten Schritt der Erzählung ein; „Da“ gibt diesen Fortgang in idiomatischem Deutsch wieder.
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Die substantivierte Ordnungszahl bezeichnet den ersten der Diener, der Bericht erstattet.
- source_word: λέγων
  choice: und sagte
  rationale: Das gleichzeitige Partizip wird im natürlichen deutschen Erzählstil als beigeordnete finite Verbform wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: κύριε ist die respektvolle Anrede an den ranghöheren Mann der Parabel. „Herr“ bewahrt die übliche Entsprechung, ohne hier zwingend einen christologischen Titel anzunehmen.
- source_word: ἡ μνᾶ σου
  choice: deine Mine
  rationale: μνᾶ bezeichnet eine antike Geld- bzw. Gewichtseinheit. Die etablierte deutsche Form „Mine“ erhält den historischen Bezug; σου betont, dass das Ausgangskapital dem Herrn gehört.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: hat zehn Minen dazugewonnen
  rationale: προσεργάζομαι bezeichnet einen zusätzlich erarbeiteten Ertrag. „dazugewonnen“ macht deutlich, dass zu der anvertrauten Mine zehn weitere Minen hinzukamen, ohne die Mine selbst als handelndes Wesen unnötig stark zu personifizieren.
theological_decisions:
- issue: Wiedergabe von κύριε als Anrede innerhalb der Parabel
  choice: Herr
  alternative: Gebieter
  rationale: Im Kontext ist eine respektvolle Anrede an einen Vorgesetzten gemeint; „Herr“ bleibt jedoch semantisch passend und wahrt die traditionelle Offenheit des Titels. Die kontextuelle Alternative wird in der Fußnote genannt.
translation_notes:
  register: Moderner, würdiger Erzählstil. „Mine“ bleibt als historische Geldeinheit unmodernisiert. Die Formulierung „zehn Minen dazugewonnen“ bewahrt den additiven Sinn von προσεργάζομαι.
