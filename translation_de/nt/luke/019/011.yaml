reference: Luke 19:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: de
  text: Während sie dies hörten, fuhr er fort und erzählte ein Gleichnis, weil er nahe bei Jerusalem war und sie meinten, das Reich Gottes werde augenblicklich sichtbar werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde augenblicklich offenbart werden“. Das Verb kann bedeuten, dass etwas sichtbar oder offenbar wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Während sie das hörten
  rationale: Der Genitivus absolutus mit präsentischem Partizip bezeichnet eine gleichzeitig andauernde Handlung. Die Formulierung ist im Deutschen natürlich und bewahrt diesen zeitlichen Zusammenhang.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: erzählte er noch ein Gleichnis
  rationale: Die Verbindung bezeichnet eine Fortsetzung beziehungsweise Ergänzung des Gesagten. „Noch“ gibt den Zusatz idiomatisch wieder; „erzählte … ein Gleichnis“ entspricht natürlichem deutschem Sprachgebrauch.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: weil er nahe bei Jerusalem war
  rationale: διά mit substantiviertem Infinitiv ist kausal. Das Akkusativsubjekt αὐτόν bezieht sich auf Jesus; daher ist er, nicht Jerusalem, als nahe bezeichnet.
- source_word: δοκεῖν αὐτοὺς
  choice: sie meinten
  rationale: Die Formulierung gibt eine Annahme oder Erwartung wieder, ohne ihr Gewissheit zuzuschreiben.
- source_word: παραχρῆμα
  choice: augenblicklich
  rationale: Das Adverb betont das unmittelbare Eintreten. „Augenblicklich“ ist klar, würdig und vermeidet ein zusätzliches, im Griechischen nicht ausdrücklich vorhandenes „nun“.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: werde ... sichtbar werden
  rationale: μέλλω mit Infinitiv bezeichnet hier das erwartete bevorstehende Geschehen; ἀναφαίνεσθαι kann das Sichtbar- oder Offenbarwerden ausdrücken. Der deutsche Konjunktiv kennzeichnet die berichtete Erwartung.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die etablierte, präzise deutsche Wiedergabe und wahrt die begriffliche Kontinuität im Lukasevangelium.
theological_decisions:
- issue: Art des erwarteten Erscheinens des Reiches Gottes
  choice: Die Erwartung wird als augenblickliches Sichtbarwerden des Reiches wiedergegeben, ohne die Form dieses Geschehens festzulegen.
  alternative: Das Reich werde politisch errichtet oder in endzeitlicher Vollendung offenbart.
  rationale: Der Vers beschreibt eine Erwartung unmittelbarer Manifestation, bestimmt aber nicht, ob diese politisch, apokalyptisch oder geistlich verstanden wurde. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstruktur bleibt nah am griechischen Kausalzusammenhang, ohne unnatürliche wörtliche Wendungen.
