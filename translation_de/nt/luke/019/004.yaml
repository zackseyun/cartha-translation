source:
  edition: SBLGNT
  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: de
  text: Da lief er voraus und kletterte auf einen Maulbeerfeigenbaum[a], um ihn zu sehen; denn er sollte dort vorbeikommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet einen Maulbeerfeigenbaum (Ficus sycomorus), auch Echte Sykomore genannt.
    reason: Die Fußnote erläutert die botanisch präzise Bezeichnung und bietet eine geläufige Benennungsvariante.
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: lief er voraus
  rationale: Das Partizip und die verstärkende Richtungsangabe bezeichnen zusammen, dass Zachäus laufend eine Stelle vor der Menge erreichte. „Lief er voraus“ gibt dies natürlich und ohne Dopplung wieder.
- source_word: ἀνέβη ἐπὶ
  choice: kletterte auf
  rationale: Bei einem Baum bezeichnet ἀναβαίνω mit ἐπί das Hinaufsteigen; „kletterte auf“ ist im Deutschen anschaulich und idiomatisch.
- source_word: συκομορέαν
  choice: Maulbeerfeigenbaum
  rationale: Das griechische Wort bezeichnet botanisch Ficus sycomorus, die Maulbeerfeige. Diese präzise deutsche Bezeichnung vermeidet eine Verwechslung mit dem in Europa und Nordamerika so genannten Ahorngewächs „Sykomore“.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: um ihn sehen zu können
  rationale: Die Infinitivkonstruktion gibt den mit ἵνα und Konjunktiv ausgedrückten Zweck in natürlichem modernem Deutsch wieder.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt hier die Begründung für die Wahl des Baumes beziehungsweise Ortes ein. „Denn“ verbindet die beiden Aussagen im Deutschen flüssig.
- source_word: ἐκείνης
  choice: dort
  rationale: Die feminine Genitivform verweist elliptisch auf einen mitgedachten Weg oder Ort. „Dort“ bewahrt die Unbestimmtheit, ohne ein im Griechischen nicht ausdrücklich genanntes Substantiv einzufügen.
- source_word: ἤμελλεν διέρχεσθαι
  choice: musste er vorbeikommen
  rationale: μέλλω mit Infinitiv bezeichnet hier den bevorstehenden, aufgrund der Route zu erwartenden Vorgang. „Musste … vorbeikommen“ ist idiomatisch und drückt die vorgesehene Wegführung aus, ohne eine theologische Notwendigkeit zu behaupten.
theological_decisions: []
translation_notes:
  register: Moderner, erzählerisch flüssiger und würdevoller Standard. Das vorangestellte „Da“ bindet die Handlung an den vorherigen Vers an. Das Semikolon hält Zweck und Begründung eng zusammen.
