id: LUK.19.40
reference: Luke 19:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: de
  text: 'Er antwortete: »Ich sage euch: Wenn diese schweigen[a], werden die Steine schreien.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verstummen; still bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus dem Partizip »antwortend« und dem finiten Verb »sagte« wird im Deutschen natürlich mit »Er antwortete« wiedergegeben; sowohl der Bezug auf die vorausgehende Aufforderung als auch der Sprechakt bleiben erhalten.
- source_word: Λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die geläufige, nachdrückliche Redeformel wird direkt und würdevoll wiedergegeben.
- source_word: οὗτοι
  choice: diese
  rationale: Das Demonstrativpronomen verweist im Kontext auf die Jünger beziehungsweise die Rufenden, ohne diese Deutung ausdrücklich in den Text einzutragen.
- source_word: σιωπήσουσιν
  choice: schweigen
  rationale: Das Verb bezeichnet das Schweigen beziehungsweise Verstummen. Im Bedingungssatz gibt »schweigen« den Sinn im modernen Deutschen knapp und natürlich wieder; mögliche ingressive oder andauernde Nuancen werden in einer Fußnote bewahrt.
- source_word: οἱ λίθοι
  choice: die Steine
  rationale: Die konkrete, bildhafte Formulierung des griechischen Textes einschließlich des Artikels bleibt erhalten.
- source_word: κράξουσιν
  choice: werden schreien
  rationale: κράζω bezeichnet lautes Rufen oder Schreien. »Schreien« bewahrt die kräftige, eindringliche Wirkung des Bildes.
theological_decisions:
- issue: Ob das Schreien der Steine im Haupttext als Metapher, prophetisches Bild oder Wunder erklärt werden soll
  choice: Das wörtliche Bild »die Steine werden schreien« bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Steine würden sinnbildlich Zeugnis ablegen; die Schöpfung selbst würde Gott loben.
  rationale: Der griechische Text deutet das Bild nicht aus. Die offene Spannung zwischen rhetorischer Übertreibung, prophetischer Bildsprache und realer Möglichkeit soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller direkter Rede. Die griechische Konstruktion aus Partizip und finitem Sprechverb wird idiomatisch verdichtet, ohne den Antwortcharakter zu verlieren.
