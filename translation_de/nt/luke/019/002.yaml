source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: de
  text: 'Und sieh: Da war ein Mann namens Zachäus; er war ein Oberzöllner und reich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Der aufmerksamkeitslenkende Erzählmarker wird bewahrt; „sieh“ klingt im modernen Deutschen würdevoll und weniger altertümlich als „siehe“.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Das maskuline Substantiv bezeichnet hier ausdrücklich einen einzelnen Mann.
- source_word: ὀνόματι καλούμενος
  choice: namens
  rationale: Die griechische Wendung bedeutet idiomatisch „genannt/namens“. „Namens“ ist knappes, natürliches Deutsch und vermeidet eine schwerfällige wörtliche Wiedergabe.
- source_word: Ζακχαῖος
  choice: Zachäus
  rationale: Verwendet wird die im Deutschen etablierte Form des Personennamens.
- source_word: αὐτὸς ἦν
  choice: er war
  rationale: Das Pronomen nimmt den Mann als Subjekt wieder auf und kann leicht hervorhebend wirken; „er war“ gibt dies im Deutschen natürlich wieder, ohne die Betonung durch „selbst“ zu überzeichnen.
- source_word: ἀρχιτελώνης
  choice: Oberzöllner
  rationale: Das Kompositum bezeichnet einen ranghohen beziehungsweise leitenden Zolleinnehmer. „Oberzöllner“ erhält sowohl die Hierarchie als auch den historischen Zusammenhang.
- source_word: αὐτὸς πλούσιος
  choice: reich
  rationale: πλούσιος bedeutet „reich/wohlhabend“. Nach „er war ein Oberzöllner“ lässt sich das zweite Prädikat im Deutschen natürlich mit „und reich“ anschließen; die erneute leichte Hervorhebung durch αὐτός verlangt kein unidiomatisches „er selbst“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt nach „sieh“ bildet die aufmerksamkeitslenkende Funktion von ἰδοὺ ab; das Semikolon erhält die lockere Reihung des griechischen Satzes. „Da war“ dient als natürliche deutsche Präsentationskonstruktion und behauptet keinen zusätzlichen Aufenthaltsort.
