  source_fidelity: 'Der Entwurf gibt die Satzglieder zuverlässig wieder: καὶ ἰδού wird als aufmerksamkeitslenkende Einleitung erhalten, ἀνήρ bleibt ausdrücklich „ein Mann“, ὀνόματι καλούμενος idiomatisch „namens“, und die beiden Prädikate als „Oberzöllner“ und „reich“. „Da war“ ist hier eine deutsche Präsentationskonstruktion zu „sieh“ und fügt keinen eigenständigen Ortsbezug hinzu. Die leichte Nachdrücklichkeit der beiden Vorkommen von αὐτός wird angemessen nicht überzeichnet.'
