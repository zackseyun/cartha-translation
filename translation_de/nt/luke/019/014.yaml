  source_fidelity: 'Der Entwurf gibt die zentralen Elemente des griechischen Textes zuverlässig wieder: die feindselige Haltung der Bürger, die Entsendung einer offiziellen Vertretung nach dem Mann sowie die entschiedene Ablehnung seiner Königsherrschaft. „Mitbürger“, „hassten“, „Gesandtschaft“ und „als König über uns herrscht“ sind sachgerecht. Die Umformung von λέγοντες zu „Sie ließen sagen“ ist jedoch etwas indirekter als der griechische Anschluss an die übermittelte Botschaft und kann unnötig den Vorgang des Beauftragens hervorheben.'
