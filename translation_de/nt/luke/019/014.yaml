  terminology: Die politische Terminologie ist angemessen. „Gesandtschaft“ wahrt den offiziellen Charakter von πρεσβεία, und „als König ... herrscht“ erhält die königliche Nuance von βασιλεῦσαι, ohne eine weitergehende Deutung einzutragen. Die Fußnote bietet mit „Abordnung“ eine brauchbare lexikalische Alternative.
