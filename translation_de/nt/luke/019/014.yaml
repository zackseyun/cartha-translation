source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: de
  text: 'Doch seine Mitbürger hassten ihn und schickten eine Gesandtschaft[a] hinter ihm her mit der Botschaft: »Wir wollen nicht, dass dieser Mann als König über uns herrscht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Abordnung“. Das griechische Wort bezeichnet eine Gruppe von Vertretern, die mit einem offiziellen Auftrag entsandt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: Mitbürger
  rationale: „Mitbürger“ bewahrt den bürgerlich-politischen Sinn und vermeidet „Untertanen“, was die von ihnen gerade abgelehnte Königsherrschaft bereits voraussetzen würde.
- source_word: ἐμίσουν
  choice: hassten
  rationale: Das Imperfekt bezeichnet eine anhaltende oder charakteristische Feindschaft; das deutsche Präteritum gibt dies im Erzählzusammenhang natürlich wieder.
- source_word: ἀπέστειλαν
  choice: schickten
  rationale: Das schlichte Erzählverb gibt den Aorist klar und idiomatisch wieder, ohne unnötig amtlichen Ton hinzuzufügen.
- source_word: πρεσβείαν
  choice: eine Gesandtschaft
  rationale: Der Ausdruck bezeichnet eine offiziell entsandte Vertretung. „Gesandtschaft“ erhält den politischen Charakter und ist im Deutschen präzise.
- source_word: ὀπίσω αὐτοῦ
  choice: hinter ihm her
  rationale: Die Wendung bezeichnet hier eine Sendung, die seiner Abreise folgt; „hinter ihm her“ ist anschaulich und idiomatisch.
- source_word: λέγοντες
  choice: Sie ließen sagen
  rationale: Das Partizip führt die von der Gesandtschaft übermittelte Botschaft ein. Die eigenständige deutsche Satzform vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: Οὐ θέλομεν
  choice: Wir wollen nicht
  rationale: Die Formulierung gibt den Willen beziehungsweise die ausdrückliche Weigerung unmittelbar und in modernem Deutsch wieder.
- source_word: τοῦτον
  choice: dieser Mann
  rationale: Die Formulierung erhält die distanzierende, möglicherweise geringschätzige Färbung des Demonstrativpronomens, ohne sie zu überzeichnen.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: als König über uns herrscht
  rationale: Die Wiedergabe bewahrt sowohl die königliche Bedeutung von βασιλεύω als auch den Gedanken der Herrschaft über die Sprecher.
theological_decisions:
- issue: Politisch-königliche Bildsprache des Gleichnisses
  choice: „als König über uns herrscht“
  alternative: „über uns regiert“ oder „unser König wird“
  rationale: Die ausdrückliche Königssprache bleibt erhalten und wird nicht zu allgemeiner Machtausübung verflacht. Zugleich legt die Übersetzung keine allegorische Deutung fest, die über den Wortlaut hinausgeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt entschieden und leicht distanzierend. Der Fußnotenmarker steht unmittelbar bei dem tatsächlich erläuterten Ausdruck „Gesandtschaft“.
