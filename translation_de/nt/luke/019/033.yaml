id: LUK.19.33
reference: Luke 19:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: de
  text: 'Während sie das Fohlen losbanden, sagten seine Besitzer[a] zu ihnen: »Warum bindet ihr das Fohlen los?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: seine Herren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων
  choice: während sie … losbanden
  rationale: Das präsentische Partizip im Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. »Losbinden« passt konkret zu einem angebundenen Tier und wahrt die Wortwiederholung mit λύετε.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt hier die Erzählung lediglich leicht weiter. Im Deutschen sorgt bereits der anschließende Temporalsatz für einen natürlichen Fortgang; ein zusätzliches »und« oder »aber« wäre schwerfällig beziehungsweise zu kontrastiv.
- source_word: αὐτῶν
  choice: sie
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang auf die beiden zuvor genannten Jünger. »Sie« gibt diesen Rückbezug wieder, ohne die Bezeichnung erklärend in den Vers einzutragen.
- source_word: πῶλον
  choice: Fohlen
  rationale: πῶλος bezeichnet ein junges Tier; aus dem vorausgehenden Zusammenhang ist ersichtlich, dass es sich hier um ein Eselsfohlen handelt. »Fohlen« erhält die knappe Ausdrucksweise des Verses.
- source_word: εἶπαν
  choice: sagten
  rationale: Die Grundbedeutung von λέγω wird direkt wiedergegeben. Dass die folgende Äußerung eine Frage ist, zeigt der Fragesatz selbst.
- source_word: οἱ κύριοι αὐτοῦ
  choice: seine Besitzer
  rationale: κύριοι bezeichnet hier nicht einen göttlichen Titel, sondern die menschlichen Verfügungsberechtigten des Tieres. »Besitzer« ist im modernen Deutsch natürlich und kontextuell eindeutig.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: Die Richtungsangabe mit πρός nach einem Verb des Sprechens wird formal und idiomatisch als »zu ihnen« wiedergegeben.
- source_word: Τί
  choice: Warum
  rationale: τί fragt in dieser Verbindung idiomatisch nach dem Grund beziehungsweise Zweck der Handlung. »Warum« gibt die Funktion der Frage im Deutschen klar wieder.
- source_word: λύετε
  choice: bindet ihr … los
  rationale: Das Präsens bezeichnet die gerade stattfindende Handlung. Die erneute Verwendung von »losbinden« bewahrt die im Griechischen erkennbare Wiederholung desselben Verbs.
theological_decisions:
- issue: Wiedergabe von κύριοι in einem nichttheologischen Besitzkontext
  choice: Besitzer
  alternative: Herren
  rationale: Obwohl κύριος häufig »Herr« bedeutet und als Titel theologisch bedeutsam sein kann, sind hier die Menschen gemeint, denen das Fohlen zugeordnet ist. »Besitzer« vermeidet einen unangebrachten theologischen Anklang. Die wörtlichere Alternative wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zweimalige Verwendung von λύω wird durch die entsprechende Wiederholung von »losbinden« sichtbar gehalten.
