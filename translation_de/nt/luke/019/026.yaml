reference: Luke 19:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: de
  text: 'Ich sage euch: Jedem, der hat, wird gegeben werden[a]; wer aber nicht hat, dem wird selbst das, was er hat, weggenommen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit sinngemäßer Ergänzung: „wird noch mehr gegeben werden“. Das Griechische sagt wörtlich nur „wird gegeben werden“; eine Mehrung ist im Zusammenhang jedoch naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die wörtliche und im modernen Deutschen natürliche Einleitung bewahrt den präsentischen, nachdrücklichen Charakter der Aussage.
- source_word: παντὶ τῷ ἔχοντι
  choice: Jedem, der hat
  rationale: Das substantivierte Partizip mit πᾶς bezeichnet allgemein jeden, der etwas hat; die knappe Form erhält die sprichwortartige Offenheit des griechischen Textes.
- source_word: δοθήσεται
  choice: wird gegeben werden
  rationale: Das Futur Passiv wird ohne ein im Griechischen nicht ausdrücklich vorhandenes Objekt wiedergegeben. Die im Zusammenhang naheliegende Bedeutung einer Mehrung bleibt erkennbar, wird aber nicht in den Haupttext eingetragen.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: wer aber nicht hat, dem
  rationale: Die deutsche Umformung bildet den Gegensatz mit δέ natürlich ab und bringt die durch ἀπό bezeichnete Entziehung idiomatisch zusammen mit dem folgenden Verb zum Ausdruck.
- source_word: καὶ ὃ ἔχει
  choice: selbst das, was er hat
  rationale: καί hat hier steigernde Bedeutung und wird mit „selbst“ wiedergegeben. Das generische „er“ entspricht dem grammatischen Singular, ohne den Personenkreis sachlich einzuschränken.
- source_word: ἀρθήσεται
  choice: wird weggenommen werden
  rationale: Das Futur Passiv von αἴρω bezeichnet hier Entzug beziehungsweise Entfernung; „weggenommen werden“ ist klar und kontextgerecht.
theological_decisions:
- issue: Reichweite des Spruches als Grundsatz von Mehrung und Verlust
  choice: Die Aussage bleibt knapp und allgemein formuliert, ohne den Gegenstand des Habens oder Gebens näher zu bestimmen.
  alternative: Den Spruch ausdrücklich auf treue Verwaltung, Heil, Verdienst oder eine bestimmte Lehre vom Reich Gottes beziehen.
  rationale: Der unmittelbare Gleichniskontext legt Anwendungen nahe, doch der Vers selbst benennt keinen dogmatischen Mechanismus. Die Übersetzung bewahrt daher seine Offenheit und Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem und knappem, sprichwortartigem Satzbau. Die Wiederholung von „hat“ bleibt erhalten, weil sie die zugespitzte Form des Originals trägt.
