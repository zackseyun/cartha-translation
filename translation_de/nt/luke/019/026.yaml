review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: die allgemeine Aussage über „jeden, der hat“, das zukünftige Passiv „wird gegeben werden“, den adversativen Gegensatz und den Entzug selbst dessen, was der Nicht-Habende hat. Die im Griechischen offene Frage, was genau jemand „hat“, bleibt offen. Die Wiedergabe von καί mit „selbst“ trifft die intensive Nuance angemessen.'
  naturalness: „Ich sage euch“ sowie der knappe, sprichwortartige Bau sind modernes, verständliches Standarddeutsch. „Jedem, der hat, wird gegeben werden“ ist bewusst elliptisch, aber idiomatisch und entspricht der prägnanten Form des Ausgangstextes. Die Umstellung „wer aber nicht hat, dem ...“ ist im Deutschen besonders natürlich und bewahrt den Gegensatz.
  terminology: Es werden keine konfessionell vorgeprägten Begriffe oder interpretierenden Zusätze eingeführt. „weggenommen werden“ ist für ἀρθήσεται klar und angemessen. Das generische Singularpronomen in „was er hat“ ist im Kontext sprachlich unauffällig und schränkt den Referenzkreis nicht sachlich ein.
