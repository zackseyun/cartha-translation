reference: Luke 19:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: de
  text: 'und sagte: »Wenn doch auch du an diesem Tag erkannt hättest, was zum Frieden führt![a][b] Doch nun ist es vor deinen Augen verborgen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satz bricht nach dem Bedingungssatz ab; sinngemäß auch: »Wenn auch du an diesem Tag erkannt hättest …!«'
    reason: Die unvollständige Satzform trägt den Charakter eines Klagerufs. »Doch« ist im Deutschen sinngemäß, steht aber nicht als eigenes Wort im griechischen Bedingungssatz.
  - marker: b
    text: 'Wörtlich: »das zum Frieden Gehörende« oder »die Dinge, die auf Frieden zielen«.'
    reason: Die griechische Wendung τὰ πρὸς εἰρήνην kann bezeichnen, was dem Frieden dient, zu ihm gehört oder zu ihm führt.
  - marker: c
    text: 'Das griechische Verb steht im Singular; möglich ist auch die sinngemäße Wiedergabe: »Doch nun sind die Dinge, die zum Frieden führen, vor deinen Augen verborgen.«'
    reason: Die vorausgehende neutrale Mehrzahl kann im Griechischen als begriffliche Einheit mit einem Verb im Singular verbunden beziehungsweise wiederaufgenommen werden.
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Präsenspartizip knüpft an den vorausgehenden Erzählzusammenhang an. Im natürlichen Deutschen wird diese begleitende Rede am klarsten als koordinierter finiter Satz wiedergegeben.
- source_word: Εἰ ἔγνως
  choice: Wenn doch … erkannt hättest
  rationale: Der unerfüllte Bedingungssatz bleibt ohne ausgesprochenen Folgesatz und wirkt dadurch wie ein abgebrochener Klageruf. »Wenn doch« gibt diese im Griechischen durch Konstruktion und Kontext vermittelte Sehnsucht idiomatisch wieder.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: an diesem Tag
  rationale: Dies ist die natürliche deutsche Zeitangabe und wahrt den Bezug auf den gegenwärtigen, entscheidenden Tag.
- source_word: καὶ σὺ
  choice: auch du
  rationale: Die Stellung hebt die angeredete Stadt nachdrücklich hervor. »Auch du« bewahrt diesen persönlichen und klagenden Akzent, ohne einen zusätzlichen Gegensatz festzulegen.
- source_word: τὰ πρὸς εἰρήνην
  choice: was zum Frieden führt
  rationale: Die substantivierte Wendung bezeichnet das, was auf Frieden ausgerichtet ist, ihm dient oder zu ihm führt. Die deutsche Formulierung ist verständlich und lässt den reichen Sinn von εἰρήνη als Frieden und Wohlergehen bestehen.
- source_word: νῦν δὲ
  choice: Doch nun
  rationale: Die Wendung markiert den scharfen Gegensatz zwischen der verpassten Erkenntnis und der gegenwärtigen Verborgenheit.
- source_word: ἐκρύβη
  choice: ist es … verborgen
  rationale: Der griechische Aorist Passiv bezeichnet hier einen eingetretenen Zustand mit gegenwärtigem Ergebnis. Das singularische »es« nimmt die vorausgehende, im Deutschen singularisch formulierte Gesamtheit dessen auf, was zum Frieden führt.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: vor deinen Augen
  rationale: Die feste deutsche Wendung bewahrt das biblische Bild für Wahrnehmung und Erkenntnis und entspricht idiomatisch der griechischen Präpositionalphrase.
theological_decisions:
- issue: Klagende beziehungsweise irreale Kraft des unvollständigen Bedingungssatzes
  choice: »Wenn doch … erkannt hättest« mit Ausrufezeichen und ohne ergänzten Folgesatz
  alternative: »Wenn … erkannt hättest« oder ein ergänzter Folgesatz wie »dann wäre dir Frieden zuteilgeworden«
  rationale: Im Griechischen fehlt der Folgesatz. Die Übersetzung bewahrt dieses ergreifende Abbrechen und ergänzt keine theologische Aussage darüber, was genau daraus gefolgt wäre. Das deutsche »doch« macht die im Kontext liegende Klage hörbar.
- issue: Bedeutungsumfang von εἰρήνη
  choice: »Frieden«
  alternative: »Wohlergehen« oder »Rettung«
  rationale: »Frieden« ist die direkte und kontextuell umfassende Entsprechung. Sie lässt sowohl umfassendes Heil und Wohlergehen als auch die Abwendung des bevorstehenden Gerichts anklingen, ohne den Sinn auf eine einzelne theologische Deutung zu verengen.
- issue: Bezug und Numerus von ἐκρύβη
  choice: Das Verborgene wird als die Gesamtheit dessen verstanden, »was zum Frieden führt«, und im Deutschen mit »es« aufgenommen.
  alternative: »Doch nun sind diese Dinge vor deinen Augen verborgen.«
  rationale: Das griechische Verb steht im Singular, obwohl die vorausgehende Wendung formal ein Neutrum Plural ist. Die singularische deutsche Wiederaufnahme wahrt diese konzeptuelle Zusammenfassung und bleibt natürlich; die sachliche Verbindung zur vorausgehenden Wendung bleibt eindeutig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält durch den abgebrochenen Bedingungssatz und das Ausrufezeichen den Ton einer eindringlichen Klage. »Was zum Frieden führt« ist allgemein verständlich, ohne den umfassenden biblischen Friedensbegriff einzuengen.
