  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: de
  text: Und als er näher kam und die Stadt sah, weinte er über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: als er näher kam
  rationale: ἐγγίζω bezeichnet das Näherkommen. Die Formulierung ist natürliches modernes Deutsch und lässt wie der griechische Text das Ziel unausgesprochen, da es aus dem Zusammenhang hervorgeht.
- source_word: ἰδὼν
  choice: und die Stadt sah
  rationale: Das Aoristpartizip bezeichnet hier eine zur Haupthandlung zeitgleiche oder ihr unmittelbar vorausgehende Wahrnehmung. Die koordinierte deutsche Formulierung gibt den engen erzählerischen Zusammenhang natürlich wieder.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: πόλις bedeutet schlicht „Stadt“. Jerusalem ist aus dem Kontext eindeutig, sodass keine erklärende Ergänzung nötig ist.
- source_word: ἔκλαυσεν
  choice: weinte er
  rationale: κλαίω bedeutet weinen oder klagen. „weinte“ bewahrt das emotionale Gewicht, ohne eine im Verb nicht ausdrücklich bezeichnete Intensität hinzuzufügen.
- source_word: ἐπ’ αὐτήν
  choice: über sie
  rationale: ἐπί mit Akkusativ bezeichnet bei κλαίω den Gegenstand der Klage. „über sie“ ist idiomatisches Deutsch; zugleich stimmt das feminine Pronomen mit „die Stadt“ überein und kann die mögliche Personifizierung Jerusalems mitschwingen lassen.
theological_decisions:
- issue: Ob das feminine Pronomen zu πόλις in der Übersetzung bewahrt werden soll
  choice: „über sie“
  alternative: „über die Stadt“ oder „um sie“
  rationale: Anders als im Englischen ist das feminine Pronomen im Deutschen die reguläre grammatische Wiederaufnahme von „die Stadt“. Es bewahrt daher die Form des Griechischen, ohne notwendig eine stärkere Personifizierung festzulegen; eine solche kann im Zusammenhang dennoch mitschwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzfügung vermeidet ein schwerfälliges Partizip und erhält den fließenden Erzählrhythmus.
