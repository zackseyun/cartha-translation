  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: de
  text: Nachdem er das gesagt hatte, ging er voraus und zog hinauf nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Nachdem
  rationale: Die griechische Satzverknüpfung wird zusammen mit dem Aoristpartizip εἰπών in eine natürliche deutsche temporale Einleitung gefasst; die erzählerische Abfolge bleibt erhalten.
- source_word: εἰπὼν ταῦτα
  choice: er das gesagt hatte
  rationale: Das Aoristpartizip bezeichnet eine dem Hauptverb vorausgehende Handlung. „Das“ verweist im heutigen Deutsch natürlich und ohne unnötige Einengung auf das zuvor Gesagte zurück.
- source_word: ἐπορεύετο
  choice: ging
  rationale: Das Imperfekt schildert Jesu fortgesetzte Bewegung. Im Deutschen trägt der Zusammenhang den Verlaufssinn, ohne dass eine schwerfällige Verlaufsform nötig ist.
- source_word: ἔμπροσθεν
  choice: voraus
  rationale: Das Adverb bezeichnet die Bewegung an der Spitze beziehungsweise vor den anderen; „voraus“ gibt dies knapp und idiomatisch wieder.
- source_word: ἀναβαίνων
  choice: zog hinauf
  rationale: Das Präsenspartizip bezeichnet die begleitende Bewegung hinauf nach Jerusalem. „zog hinauf“ bewahrt die Aufstiegssprache und klingt in einer Reiseerzählung natürlich.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: εἰς bezeichnet hier die Richtung beziehungsweise das Ziel, nicht notwendig bereits den Eintritt in die Stadt.
theological_decisions:
- issue: Bewahrung der Aufstiegssprache für den Weg nach Jerusalem
  choice: „zog hinauf nach Jerusalem“
  alternative: „reiste nach Jerusalem“ / „war auf dem Weg nach Jerusalem“
  rationale: Die Formulierung wahrt sowohl den geografischen Aufstieg als auch die mögliche erzählerisch-theologische Resonanz, ohne diese ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verbindung „ging er voraus und zog hinauf“ bildet Hauptverb und begleitendes Partizip erkennbar ab, ohne unnatürlich wörtlich zu klingen.
