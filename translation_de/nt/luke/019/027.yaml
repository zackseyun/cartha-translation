review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft den adversativen Übergang, die hervorgehobenen Feinde, ihre Ablehnung der Königsherrschaft sowie die drastische Gewalt von κατασφάξατε gut. „Vor meinen Augen“ ist jedoch gegenüber ἔμπροσθέν μου enger und deutet ausdrücklich ein Zuschauen an; „vor mir“ bildet die räumlich-persönliche Wendung unmittelbarer ab.
  naturalness: Der Satz ist in modernem Standarddeutsch klar und angemessen direkt. „Diese meine Feinde“ bewahrt die demonstrative Hervorhebung und ist in diesem feierlich-dramatischen Register natürlich. Der Gedankenstrich funktioniert als Übergang zum Befehl.
  terminology: „Als König über sie herrsche“ gibt βασιλεῦσαι ἐπ’ αὐτούς treffend wieder. „Abschlachten“ wahrt die besondere Härte von κατασφάζω, ohne eine rechtliche Hinrichtung zu unterstellen.
  issues:
