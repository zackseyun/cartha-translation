source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: de
  text: Doch diese meine Feinde, die nicht wollten, dass ich als König über sie herrsche[a] – bringt sie her und schlachtet sie vor mir ab![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass ich über sie König sei«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor meinen Augen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Leitet den abschließenden, scharf kontrastierenden Punkt in der Rede des vornehmen Mannes knapp und natürlich ein.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: diese meine Feinde
  rationale: Bewahrt sowohl das Possessivverhältnis als auch die hervorhebende, konkretisierende Wirkung von τούτους.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: die nicht wollten, dass ich als König über sie herrsche
  rationale: Gibt die substantivierte Partizipialkonstruktion als natürlichen Relativsatz wieder. „Als König herrschen“ erhält den verbalen und königlichen Sinn von βασιλεύω.
- source_word: ἀγάγετε ὧδε
  choice: bringt sie her
  rationale: Ist im Deutschen die natürliche Wiedergabe des Befehls mit Zielangabe; „führt sie hierher“ wäre ebenfalls möglich, klingt aber weniger idiomatisch.
- source_word: κατασφάξατε
  choice: schlachtet sie … ab
  rationale: Das starke, drastische Verb bezeichnet mehr als ein neutrales Töten. „Abschlachten“ bewahrt diese Härte, ohne eine im Griechischen nicht ausdrücklich enthaltene gerichtliche Hinrichtung vorauszusetzen.
- source_word: ἔμπροσθέν μου
  choice: vor meinen Augen
  rationale: Drückt die unmittelbare Gegenwart des Sprechers anschaulich und in natürlichem modernem Deutsch aus.
theological_decisions:
- issue: Bezug des Sprechers innerhalb des Gleichnisses
  choice: Der Befehl des vornehmen Mannes wird direkt und ohne Abschwächung wiedergegeben.
  alternative: Die Aussage durch einen ausdrücklichen Zusatz stärker von Jesus distanzieren oder ihre Gewalt sprachlich mildern.
  rationale: Der griechische Text gibt die Rede der Figur im Gleichnis unmittelbar wieder. Die Übersetzung wahrt diese Erzählform und ihre theologische Spannung, ohne den Befehl ausdrücklich als direkten, außerhalb des Gleichnisses erteilten Befehl Jesu zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer Wortwahl entsprechend dem griechischen κατασφάζω. Der Gedankenstrich markiert den Übergang von der näheren Bestimmung der Feinde zum Befehl.
