    issue: „ließen Jesus aufsteigen“ für ἐπεβίβασαν
    rationale: 'Das Verb ist kausativ: Sie veranlassten bzw. halfen Jesus, auf das Tier zu gelangen. „Ließen ... aufsteigen“ kann im heutigen Deutsch primär permissiv verstanden werden. „Setzten Jesus darauf“ wahrt den Kausativ und ist idiomatisch.'
  - severity: low
    issue: Fußnote bestimmt πῶλος zu stark als jungen Esel
    rationale: Die griechische Vokabel bezeichnet ein Jungtier und kann je nach Kontext besonders ein Eselsfohlen meinen. Die Fußnote sollte diese Möglichkeit erläutern, statt sie als im Vers eindeutig festgelegt darzustellen.
