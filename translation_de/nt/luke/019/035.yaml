source:
  edition: SBLGNT
  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: de
  text: Sie brachten das Fohlen zu Jesus, legten ihre Mäntel darauf und setzten Jesus darauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann ein Jungtier, besonders einen jungen Esel, bezeichnen; vgl. den vorausgehenden Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον αὐτὸν
  choice: Sie brachten das Fohlen
  rationale: Das maskuline Pronomen αὐτόν verweist auf πῶλος im vorausgehenden Zusammenhang. Die Wiederaufnahme mit „das Fohlen“ ist im Deutschen klarer und natürlicher als ein mehrdeutiges Pronomen.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: zu Jesus
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf eine Person zu.
- source_word: ἐπιρίψαντες
  choice: legten
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die koordinierte deutsche Satzfolge gibt diese Abfolge natürlich wieder; „legten“ vermeidet die unnötig heftige Konnotation von „warfen“.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: ihre Mäntel
  rationale: ἱμάτια bezeichnet hier die Obergewänder der Jünger; „Mäntel“ ist anschaulich und in modernem Deutsch geläufig.
- source_word: ἐπὶ τὸν πῶλον
  choice: darauf
  rationale: ἐπί mit Akkusativ bezeichnet das Auflegen auf das Fohlen. „darauf“ nimmt den ausdrücklich genannten Referenten knapp und eindeutig wieder auf.
- source_word: πῶλον
  choice: Fohlen
  rationale: πῶλος bezeichnet ein junges Reit- oder Lasttier. „Fohlen“ bewahrt die lexikalische Offenheit des Verses; aus dem Kontext geht hervor, dass ein junger Esel gemeint ist.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: ließen Jesus aufsteigen
  rationale: Das Verb ist kausativ und bedeutet, jemanden auf ein Tier steigen zu lassen bzw. hinaufzuhelfen. Die Formulierung ist idiomatisch und lässt offen, wie viel körperliche Hilfe dabei geleistet wurde.
theological_decisions:
- issue: Bestimmung der Tierart bei πῶλος
  choice: Im Haupttext steht das allgemeinere „Fohlen“; eine Fußnote erläutert den Kontext.
  alternative: „Eselsfohlen“ unmittelbar im Haupttext
  rationale: Der unmittelbare Vers nennt mit πῶλος nur ein Jungtier, während der vorausgehende Kontext erkennen lässt, dass es sich um einen jungen Esel handelt. Die Übersetzung bewahrt sowohl den Wortlaut als auch die kontextuelle Klarheit.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die parataktische Satzform bildet die griechische Handlungsfolge natürlich ab. Der Fußnotenmarker steht im Haupttext.
