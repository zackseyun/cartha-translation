  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Das Fohlen wird zu Jesus gebracht, die Mäntel werden daraufgelegt, und Jesus wird daraufgesetzt. „ließen Jesus aufsteigen“ schwächt jedoch den kausativen Sinn von ἐπεβίβασαν ab und kann im Deutschen auch bloße Erlaubnis nahelegen.'
  naturalness: Der Satz ist gut verständlich und dem Register angemessen. „setzten Jesus darauf“ ist ebenso natürlich und gibt die Handlung präziser wieder.
  terminology: „Mäntel“ ist für ἱμάτια passend. „Fohlen“ gibt πῶλον sinnvoll wieder und bewahrt dessen allgemeine Bedeutung. Die vorhandene Fußnote legt mit „ist ... gemeint“ jedoch eine bestimmte Tierart als gesichert fest, obwohl πῶλος selbst allgemein ein Jungtier bezeichnet; der Kontext kann einen jungen Esel nahelegen, sollte aber nicht als eindeutige lexikalische Festlegung formuliert werden.
  issues:
