  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: de
  text: 'Und zu den Umstehenden sagte er: »Nehmt ihm die Mine[a] weg und gebt sie dem, der die zehn Minen hat!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Pfund«. Das griechische Wort bezeichnet eine antike Gewichts- und Geldeinheit, eine Mine.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: zu den Umstehenden
  rationale: Das substantivierte Partizip bezeichnet die in der Nähe Anwesenden. »Die Umstehenden« bewahrt die konkrete Szene und klingt im Deutschen natürlich.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Nehmt ihm ... weg
  rationale: αἴρω mit ἀπό bezeichnet hier das Wegnehmen. Die deutsche Konstruktion »jemandem etwas wegnehmen« gibt Trennung und Aufforderung idiomatisch wieder.
- source_word: τὴν μνᾶν
  choice: die Mine
  rationale: »Mine« ist die etablierte deutsche Bezeichnung der antiken Gewichts- und Geldeinheit μνᾶ und vermeidet eine irreführende Gleichsetzung mit einer modernen Währung.
- source_word: δότε
  choice: gebt
  rationale: Der Aoristimperativ von δίδωμι verlangt schlicht die Übergabe; »gebt« ist direkt und angemessen.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: dem, der die zehn Minen hat
  rationale: Das substantivierte Partizip wird ohne ergänzte Geschlechtsbezeichnung wiedergegeben. Der Artikel vor »zehn Minen« verweist auf den bereits bekannten Betrag.
theological_decisions:
- issue: Wiedergabe der antiken Geldeinheit μνᾶ
  choice: Mine
  alternative: Pfund
  rationale: »Mine« erhält den historischen Begriff des griechischen Textes. »Pfund« ist zwar traditionell, kann aber eine moderne Währungs- oder Gewichtseinheit nahelegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt knapp und befehlend; »Umstehende« veranschaulicht die Szene, ohne zusätzliche Personenrollen einzuführen.
