source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: de
  text: und sie werden dich und deine Kinder in dir dem Erdboden gleichmachen. Sie werden in dir keinen Stein auf dem anderen lassen, weil du die Zeit deiner Heimsuchung[a] nicht erkannt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Überprüfung“. Das griechische Wort kann einen Besuch oder eine Überprüfung bezeichnen, besonders ein göttliches Aufsuchen, das Gnade oder Gericht bringen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: werden … dem Erdboden gleichmachen
  rationale: Das Verb bezeichnet ein Niederreißen oder Verwüsten bis auf den Boden. Die deutsche Wendung gibt die vollständige Zerstörung kraftvoll und natürlich wieder.
- source_word: σε
  choice: dich
  rationale: Jerusalem wird als Person angeredet. Das Pronomen bewahrt diese rhetorische Personifikation, statt sie erklärend durch „deine Stadt“ zu ersetzen.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: deine Kinder in dir
  rationale: „Kinder“ bewahrt das Bild Jerusalems als Mutterstadt; „in dir“ bezeichnet die Menschen innerhalb der Stadt, ohne das Bild zu „Einwohner“ zu verflachen.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: Sie werden in dir keinen Stein auf dem anderen lassen
  rationale: Die geläufige deutsche Wendung vermittelt die angekündigte restlose Zerstörung und gibt ἐν σοί ausdrücklich wieder.
- source_word: ἀνθ’ ὧν
  choice: weil
  rationale: Die Wendung nennt hier den Grund des angekündigten Gerichts; „weil“ drückt diesen kausalen Zusammenhang klar aus.
- source_word: ἔγνως
  choice: nicht erkannt hast
  rationale: γινώσκω meint hier nicht bloß sachliches Wissen, sondern das Wahrnehmen und Anerkennen der entscheidenden Zeit.
- source_word: καιρὸν
  choice: Zeit
  rationale: καιρός bezeichnet einen bedeutsamen oder bestimmten Zeitpunkt. „Zeit“ bleibt knapp und lässt dessen besondere Bedeutung durch den folgenden Genitiv hervortreten.
- source_word: τῆς ἐπισκοπῆς σου
  choice: deiner Heimsuchung
  rationale: „Heimsuchung“ kann wie ἐπισκοπή einen göttlichen Besuch bezeichnen, der Gnade oder Gericht mit sich bringt. Die Formulierung bewahrt den Bezug auf Jerusalem durch „deiner“, ohne Gott ausdrücklich als Subjekt einzufügen.
theological_decisions:
- issue: Bedeutung von ἐπισκοπή im Zusammenhang des Gerichts
  choice: „Heimsuchung“, wobei der göttliche Bezug unausgesprochen bleibt
  alternative: „Überprüfung“ oder „die Zeit, in der Gott dich aufsuchte“
  rationale: Das Wort kann einen göttlichen Besuch zur Rettung oder zum Gericht bezeichnen. Der Zusammenhang legt göttliches Handeln nahe, doch der griechische Ausdruck legt dessen Charakter nicht ausdrücklich fest. „Heimsuchung“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das Bild Jerusalems mit seinen „Kindern“ bleiben erhalten. „Heimsuchung“ ist bewusst biblisch geprägt; die Fußnote erläutert seine heute weniger geläufige Bedeutungsbreite.
