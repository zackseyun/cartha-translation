source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: de
  text: 'Er sagte zu ihm: »Aus deinem eigenen Mund[a] werde ich dich richten, du böser Sklave.[b] Du wusstest, dass ich ein harter Mann bin und nehme, was ich nicht hingelegt habe[c], und ernte, was ich nicht gesät habe?«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach deinen eigenen Worten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du böser Diener“. Das griechische Wort δοῦλος bezeichnet einen Sklaven; in diesem Gleichnis ist sein Abhängigkeitsverhältnis zum Herrn deutlich.'
    reason: alternative_reading
  - marker: c
    text: 'Im finanziellen Zusammenhang auch: „was ich nicht hinterlegt (oder: eingezahlt) habe“.'
    reason: lexical_alternative
  - marker: d
    text: Der griechische Text lautet wörtlich „erntet, was ich nicht gesät habe“, nicht „erntet, wo ich nicht gesät habe“.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Er sagte zu ihm
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: Ἐκ τοῦ στόματός σου
  choice: Aus deinem eigenen Mund
  rationale: Die bildhafte Wendung bleibt erhalten; „eigenen“ verdeutlicht im Deutschen, dass die eigenen Aussagen des Sklaven als Grundlage des Urteils dienen.
- source_word: κρίνω σε
  choice: werde ich dich richten
  rationale: Das futurische Verständnis passt zum angekündigten Urteil. „Richten“ bewahrt den weiteren Bedeutungsumfang von κρίνω, ohne vorschnell auf „verurteilen“ einzuengen.
- source_word: πονηρὲ δοῦλε
  choice: du böser Sklave
  rationale: „Böse“ bringt den moralischen Tadel zum Ausdruck. Im parabolischen Herr-Sklave-Verhältnis ist der unfreie Status von δοῦλος kontextuell deutlich, weshalb „Sklave“ präziser als „Diener“ ist.
- source_word: ᾔδεις
  choice: Du wusstest
  rationale: οἶδα bezeichnet hier vorhandenes Wissen; die deutsche Vergangenheitsform ist idiomatisch und lässt die rhetorische Verwendung der Behauptung des Sklaven bestehen.
- source_word: αὐστηρός
  choice: hart
  rationale: „Hart“ gibt die negative Charakterisierung natürlich und gegenwärtig wieder; „streng“ wäre neutraler, „unnachgiebig“ stärker ausdeutend.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: der an sich nimmt, was er nicht hingelegt hat
  rationale: Die breite Bedeutung von αἴρω und τίθημι sowie die parallele Was-Konstruktion werden bewahrt, ohne die Wendung eindeutig als technische Geldanlage zu deuten.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: und erntet, was er nicht gesät hat
  rationale: Die landwirtschaftliche Metapher und das Akkusativobjekt „was“ werden eng am griechischen Wortlaut wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δοῦλος im parabolischen Herr-Sklave-Verhältnis
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Der soziale Abhängigkeits- und Besitzstatus ist in der Handlung bedeutsam. „Diener“ schwächt ihn ab, während „Knecht“ heute altertümlich wirkt und den Status weniger eindeutig bezeichnet.
- issue: Status der Selbstbeschreibung des Herrn als „hart“
  choice: Die direkte rhetorische Form des Griechischen bleibt ohne erklärenden Zusatz erhalten.
  alternative: „Du behauptest, ich sei ein harter Mann“; „Wenn du wusstest, dass ich ein harter Mann bin“
  rationale: Der Herr greift offenbar die eigenen Worte des Sklaven auf. Die Übersetzung entscheidet nicht zusätzlich, ob die Charakterisierung als objektive Selbstaussage bestätigt oder nur argumentativ gegen den Sklaven gewendet wird.
- issue: Frage oder Feststellung im Schlussteil
  choice: Rhetorische Frage entsprechend dem griechischen Fragezeichen
  alternative: Feststellung mit Punkt
  rationale: Die Interpunktion der angegebenen SBLGNT-Quelle kennzeichnet den Satz als Frage. Diese Form erhält die Spannung zwischen der Behauptung des Sklaven und dem Urteil des Herrn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Das historische Präsens wird erzählerisch im Präteritum wiedergegeben. Die ungewöhnlichen Bilder „aus deinem eigenen Mund“ und „was er nicht hingelegt hat“ bleiben bewusst sichtbar; Fußnoten bieten jeweils idiomatischere oder kontextuell stärker eingeengte Alternativen.
