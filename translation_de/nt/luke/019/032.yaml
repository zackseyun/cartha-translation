  verdict: revise
  source_fidelity: Der Entwurf gibt den narrativen Ablauf und die Entsprechung zu Jesu vorausgehender Aussage grundsätzlich zutreffend wieder. »Alles« erweitert jedoch das im Griechischen bei εὗρον nicht ausgedrückte Objekt zu einer Gesamtheit von Umständen. Außerdem ist »gingen hin« für ἀπελθόντες weniger genau als eine Formulierung, die das Aufbrechen/Fortgehen ausdrückt.
  naturalness: Der Satz ist gut verständlich. »Die beiden, die ausgesandt worden waren« und »machten sich auf den Weg« sind modernes Standarddeutsch und bewahren zugleich die im Ausgangstext enthaltene Sendungs- und Aufbruchsnuance.
  terminology: Die passive Bezeichnung der Gesandten wird ohne unnötige Einfügung des Namens Jesus wiedergegeben. Die Objektellipse wird mit dem neutralen »es« nur idiomatisch aufgenommen, ohne den Bezug auf bestimmte Einzelheiten oder auf den jungen Esel festzulegen.
