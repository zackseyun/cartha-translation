  text: ἀπελθόντες δὲ οἱ ἀπεσταλμένοι εὗρον καθὼς εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: de
  text: Die beiden, die ausgesandt worden waren, machten sich auf den Weg und fanden es so vor, wie er es ihnen gesagt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch steht bei »fanden« kein Objekt; was sie fanden, ergibt sich aus dem Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: gingen hin
  rationale: Das Aoristpartizip von ἀπέρχομαι bezeichnet ihr Fortgehen beziehungsweise Sich-auf-den-Weg-Machen; »gingen hin« ist im Deutschen natürlich und passt zur vorausgehenden Ortsangabe.
- source_word: δὲ
  choice: unübersetzt im Satzfluss
  rationale: δέ führt hier die Erzählung weiter. Eine eigene Wiedergabe mit »da«, »nun« oder »also« ist im natürlichen deutschen Satz nicht erforderlich.
- source_word: οἱ ἀπεσταλμένοι
  choice: die beiden, die Jesus losgeschickt hatte
  rationale: Das substantivierte Perfekt-Passiv-Partizip bedeutet wörtlich »die Gesandten«. »Die beiden« nimmt die ausdrücklich genannten zwei Jünger aus Vers 29 auf; »losgeschickt hatte« bewahrt den passiven Sendungsbezug. Der Name Jesus verdeutlicht den im Kontext eindeutigen Handelnden, ohne eine neue Referenz einzuführen.
- source_word: εὗρον
  choice: fanden alles
  rationale: Im Griechischen steht εὗρον ohne ausdrückliches Objekt. »Alles« lässt das Objekt weiterhin kontextabhängig und stellt natürlich die Übereinstimmung der vorgefundenen Umstände mit Jesu Ankündigung heraus; die Ergänzung wird in einer Fußnote kenntlich gemacht.
- source_word: καθὼς
  choice: so, wie
  rationale: καθώς bezeichnet die Übereinstimmung zwischen dem Vorgefundenen und dem zuvor Gesagten; »so, wie« gibt dies idiomatisch wieder.
- source_word: εἶπεν αὐτοῖς
  choice: er es ihnen gesagt hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Jesu Aussage dem Finden vorausging; »gesagt« bleibt nahe am Grundverb λέγω.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die explizite Wiederaufnahme »Jesus« und »die beiden« sorgt für Klarheit; die im Griechischen vorhandene Objektellipse bei εὗρον wird durch eine Fußnote transparent gehalten.
