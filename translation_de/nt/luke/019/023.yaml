  source_fidelity: Die finanzielle Deutung von ἐπὶ τράπεζαν als Anlage bei einer Bank und τόκος als Zinsen ist zutreffend. Das im Entwurf ergänzte „dann“ in der Frage hat jedoch keine ausdrückliche Entsprechung im griechischen Text. „Einfordern“ ist für αὐτὸ ἔπραξα möglich, klingt gegenüber einer Bank aber weniger idiomatisch als die gemeinte Rückerlangung des hinterlegten Geldes.
  naturalness: „Bei meiner Rückkehr hätte ich es mit Zinsen abheben können“ ist modernes, klares Standarddeutsch und bewahrt die irreale Folge. Die Streichung von „dann“ macht die Frage unmittelbarer und genauer.
  terminology: „Geld“, „Bank“ und „Zinsen“ geben ἀργύριον, τράπεζα und τόκος im wirtschaftlichen Kontext angemessen wieder. Die Fußnote dokumentiert die wörtlichere und institutionell weniger festgelegte Lesemöglichkeit von τράπεζα.
