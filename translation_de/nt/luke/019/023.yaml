source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: de
  text: Warum hast du mein Geld nicht bei einer Bank[a] angelegt? Bei meiner Rückkehr hätte ich es mit Zinsen abheben können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei Bankiers hinterlegen“; wörtlich: „mein Geld auf einen Tisch geben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Warum
  rationale: Die knappe Frage gibt den vorwurfsvollen Ton der griechischen Wendung natürlich wieder.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: bei einer Bank angelegt
  rationale: τράπεζα bezeichnet hier im finanziellen Zusammenhang den Tisch eines Geldwechslers beziehungsweise eine Bank; „angelegt“ vermittelt die beabsichtigte verzinsliche Hinterlegung in heutigem Deutsch.
- source_word: μου τὸ ἀργύριον
  choice: mein Geld
  rationale: ἀργύριον kann wörtlich Silber bezeichnen, meint hier aber eindeutig Geld.
- source_word: κἀγὼ ἐλθὼν
  choice: Bei meiner Rückkehr
  rationale: Das temporale Partizip wird idiomatisch wiedergegeben, ohne die zeitliche Beziehung zu verändern.
- source_word: σὺν τόκῳ
  choice: samt Zinsen
  rationale: τόκος bezeichnet hier den Ertrag einer verzinslichen Geldanlage; „Zinsen“ ist die klare moderne Entsprechung.
- source_word: αὐτὸ ἔπραξα
  choice: hätte ich es ... einfordern können
  rationale: πράσσω hat hier den geschäftlichen Sinn, einen geschuldeten Betrag einzuziehen beziehungsweise einzufordern; die irreale Möglichkeit wird durch die deutsche Konjunktivkonstruktion ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bankmetapher wird funktional und ohne unnötig wörtliches „auf einen Tisch“ wiedergegeben; der vorwurfsvolle Fragesatz und die irreale Folge bleiben erhalten.
