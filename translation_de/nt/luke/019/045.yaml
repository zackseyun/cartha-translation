  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: de
  text: Und als er den Tempelbezirk[a] betreten hatte, begann er, die Verkäufer hinauszutreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tempel“ beziehungsweise „Tempelvorhöfe“. Das griechische Wort bezeichnet die gesamte Tempelanlage, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: als er ... betreten hatte
  rationale: Das vorangestellte Aoristpartizip bezeichnet hier natürlich eine Handlung, die dem Beginn des Hinaustreibens vorausgeht. Die deutsche Nebensatzkonstruktion gibt diese Abfolge idiomatisch wieder.
- source_word: ἱερὸν
  choice: Tempelbezirk
  rationale: ἱερόν bezeichnet den gesamten Tempelkomplex und nicht speziell das innere Heiligtum (ναός). „Tempelbezirk“ macht diese räumliche Bedeutung im Haupttext deutlich.
- source_word: ἤρξατο
  choice: begann
  rationale: ἄρχομαι mit Infinitiv bezeichnet den Beginn der folgenden Handlung.
- source_word: ἐκβάλλειν
  choice: hinauszutreiben
  rationale: Das Verb drückt ein entschiedenes Entfernen aus; „hinaustreiben“ ist kraftvoll, natürlich und entspricht der räumlichen Bewegung nach draußen.
- source_word: τοὺς πωλοῦντας
  choice: die Verkäufer
  rationale: Das substantivierte Präsenspartizip bezeichnet die dort mit dem Verkaufen beschäftigten Personen. „Die Verkäufer“ ist im Deutschen knapp und natürlich, ohne den nicht genannten Gegenstand ihres Handels hinzuzufügen.
theological_decisions:
- issue: Räumlicher Umfang von ἱερόν bei Jesu Vorgehen im Tempel
  choice: Tempelbezirk
  alternative: Tempel; Tempelvorhöfe; Heiligtum
  rationale: Der griechische Ausdruck meint gewöhnlich die gesamte Tempelanlage. „Tempelbezirk“ verhindert eine Verengung auf das innere Heiligtum, ohne eine bestimmte theologische Deutung der Handlung einzutragen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Satzstellung bewahrt den erzählerischen Ablauf und die Kraft des Verbs ἐκβάλλω.
