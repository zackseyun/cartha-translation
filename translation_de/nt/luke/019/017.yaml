  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Gut gemacht, guter Diener[a]! Weil du in einer sehr kleinen Sache treu gewesen bist, sollst du Vollmacht über zehn Städte haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklave“. Das griechische Wort doulos kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Gut gemacht
  rationale: Eine natürliche deutsche Anerkennungsformel, die den zustimmenden Ausruf wiedergibt.
- source_word: ἀγαθὲ δοῦλε
  choice: du guter Diener
  rationale: Die direkte Anrede bleibt erhalten. „Diener“ klingt im heutigen Deutsch natürlich und wahrt das Unterordnungsverhältnis; die stärkere Alternative „Sklave“ wird in der Fußnote genannt.
- source_word: ἐν ἐλαχίστῳ
  choice: im Geringsten
  rationale: Die knappe Formulierung bildet den substantivierten Superlativ ab und bezeichnet eine äußerst geringe Angelegenheit.
- source_word: πιστὸς ἐγένου
  choice: treu gewesen bist
  rationale: Gibt den erreichten beziehungsweise erwiesenen Zustand ohne die zusätzliche Ausdeutung „dich bewährt“ wieder.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: sollst du Vollmacht … haben
  rationale: Die periphrastische Imperativkonstruktion bezeichnet die verliehene und fortdauernde Befugnis; im Deutschen drückt „sollst du … haben“ dies idiomatisch aus.
- source_word: ἐπάνω δέκα πόλεων
  choice: über zehn Städte
  rationale: Bewahrt sowohl die Zahl als auch das Herrschafts- beziehungsweise Verwaltungsverhältnis.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Diener
  alternative: Sklave
  rationale: Im Kontext der Verwaltung im Auftrag eines Herrn ist „Diener“ gut verständlich und hält die Herr-Untergebener-Beziehung fest. Da δοῦλος auch einen rechtlich unfreien Sklaven bezeichnen kann, wird diese Möglichkeit nicht verschwiegen, sondern in einer Fußnote bewahrt.
- issue: Art der verliehenen ἐξουσία
  choice: Vollmacht
  alternative: Gewalt / Befugnis
  rationale: „Vollmacht“ bezeichnet hier sachgerecht eine vom Herrn verliehene Herrschafts- oder Verwaltungsbefugnis, ohne ihre genaue politische Ausgestaltung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und knapp gehalten; die etwas gehobene Wendung „im Geringsten“ bewahrt die Prägnanz des griechischen Ausdrucks.
