  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: de
  text: Denn der Menschensohn ist gekommen, um zu suchen und zu retten, was verloren ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Verlorene“. Die griechische Form steht im Singular und kann allgemein oder zusammenfassend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: ist gekommen
  rationale: Das deutsche Perfekt ist in heutiger Standardsprache natürlich und gibt hier Jesu gekommen-sein und Auftrag treffend wieder, ohne die Aussage auf ein bloß vergangenes Ereignis zu beschränken.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt den begründenden Anschluss an die vorherige Aussage knapp und würdevoll.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält Jesu Selbstbezeichnung sowie ihre biblischen und theologischen Bezüge.
- source_word: ζητῆσαι
  choice: um zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck seines Kommens; die Konstruktion „um zu“ macht dies im Deutschen deutlich.
- source_word: σῶσαι
  choice: zu retten
  rationale: „Retten“ bewahrt die umfassende heilvolle Bedeutung von σῴζω und passt zum unmittelbaren Kontext von „Rettung/Heil“ in Lukas 19,9.
- source_word: τὸ ἀπολωλός
  choice: was verloren ist
  rationale: Die substantivierte Partizipialform ist Neutrum Singular und kann generisch verstanden werden. „Was verloren ist“ erhält sowohl die grammatische Form als auch die offene, umfassende Referenz.
theological_decisions:
- issue: Umfang und Bedeutung von τὸ ἀπολωλός
  choice: was verloren ist
  alternative: die Verlorenen; der Verlorene
  rationale: Die neutrale Singularform kann generisch oder kollektiv gebraucht sein. Die gewählte Formulierung lässt den unmittelbaren Bezug auf Zachäus und den weiteren Horizont von Jesu Sendung nebeneinander bestehen, ohne die Aussage auf eine einzelne männliche Person oder ausdrücklich auf eine Mehrzahl festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschensohn“ bleibt als vertrauter biblischer Titel erhalten; „was verloren ist“ klingt natürlich und wahrt die grammatische sowie theologische Offenheit des griechischen Ausdrucks.
