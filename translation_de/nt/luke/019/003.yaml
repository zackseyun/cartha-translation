  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: de
  text: Er versuchte, Jesus zu sehen, um herauszufinden, wer er war. Doch wegen der Menschenmenge gelang ihm das nicht, denn er war klein gewachsen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er war klein von Statur« oder »er war klein an Körpergröße«. Das griechische Wort kann auch das Alter bezeichnen; wegen der Menschenmenge ist hier die Körpergröße gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: versuchte
  rationale: Das Imperfekt bezeichnet ein anhaltendes Bemühen; »versuchte« gibt dies im modernen Deutsch natürlich wieder.
- source_word: ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν
  choice: herauszufinden, wer Jesus war
  rationale: Wörtliches »Jesus zu sehen, wer er ist« ist im Deutschen unnatürlich. Die Formulierung bewahrt sowohl das Sehenwollen als auch die auf Jesu Identität oder Person gerichtete Frage, ohne diese näher festzulegen.
- source_word: οὐκ ἠδύνατο
  choice: gelang ihm das nicht
  rationale: Die idiomatische Wendung drückt im Zusammenhang aus, dass sein Bemühen erfolglos blieb.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: wegen der Menschenmenge
  rationale: ἀπό bezeichnet hier die Menschenmenge als hindernden Grund.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: er war klein gewachsen
  rationale: ἡλικία kann Alter oder Körpergröße bezeichnen; dass die Menge seine Sicht versperrt, weist hier eindeutig auf geringe Körpergröße. »Klein gewachsen« ist präzise und würdevoll.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das zweimalige griechische καί wird durch »doch« und ein Semikolon idiomatisch strukturiert; die doppelte Begründung bleibt erhalten.
