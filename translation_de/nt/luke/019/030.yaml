id: LUK.19.30
reference: Luke 19:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: de
  text: 'Er sagte: „Geht in das Dorf, das euch gegenüberliegt. Wenn ihr hineingeht, werdet ihr dort ein angebundenes Fohlen finden, auf dem noch nie ein Mensch gesessen hat. Bindet es los und bringt es her.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμη
  choice: Dorf
  rationale: Die übliche und kontextgerechte Bedeutung von κώμη ist eine kleinere Ortschaft, also „Dorf“.
- source_word: πῶλον
  choice: Fohlen
  rationale: πῶλος bezeichnet ein junges Tier, im Kontext ein junges Reittier. „Fohlen“ wahrt die im Vers selbst noch nicht ausdrücklich spezifizierte Tierart.
- source_word: δεδεμένον / λύσαντες
  choice: angebundenes / Bindet es los
  rationale: Die aufeinander bezogenen Verben werden im Deutschen natürlich und anschaulich wiedergegeben.
- source_word: ἀγάγετε
  choice: bringt es her
  rationale: Der Imperativ bedeutet „führt/bringt es“; „her“ macht die auf Jesus und die Jünger gerichtete Bewegung im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Tierart des πῶλος
  choice: Fohlen
  alternative: Eselsfohlen
  rationale: Der griechische Ausdruck in diesem Vers nennt die Tierart nicht ausdrücklich. Die Übersetzung bewahrt diese lexikalische Offenheit, statt die nähere Bestimmung aus dem Kontext vorwegzunehmen.
- issue: οὐδεὶς πώποτε ἀνθρώπων
  choice: auf dem noch nie ein Mensch gesessen hat
  alternative: auf dem noch niemand gesessen hat
  rationale: Die ausdrückliche Bezugnahme auf Menschen wird bewahrt, ohne im Deutschen unnötig schwerfällig zu klingen.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Die Satzstruktur wurde gegenüber dem Griechischen leicht geglättet; die Abfolge von Auftrag, Auffinden, Losbinden und Herbringen bleibt erhalten.
