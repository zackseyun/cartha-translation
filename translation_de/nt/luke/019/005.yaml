id: LUK.19.5
reference: Luke 19:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: de
  text: 'Als Jesus an die Stelle kam, blickte er hinauf und sagte zu ihm: „Zachäus, beeil dich und komm herunter! Denn heute muss[a] ich in deinem Haus[b] bleiben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „muss“ kann eine Notwendigkeit bezeichnen, die mit Jesu Sendung oder Gottes Plan verbunden ist.
    reason: theological_ambiguity
  - marker: b
    text: 'Oder: „bei dir zu Hause“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: In der erzählenden Abfolge leitet ὡς einen temporalen Nebensatz ein; „als“ ist hier die natürliche deutsche Entsprechung.
- source_word: ἐπὶ τὸν τόπον
  choice: an die Stelle
  rationale: Die Wendung bezeichnet den konkreten Ort, an dem Zachäus sich befand. „An die Stelle“ bewahrt den bestimmten, örtlichen Bezug.
- source_word: ἀναβλέψας
  choice: blickte er hinauf
  rationale: Das Partizip beschreibt, wie Jesus den Blick nach oben zu Zachäus richtet. Die finite Form fügt sich natürlich in den deutschen Erzählstil ein.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sagte zu ihm
  rationale: Dies ist die klare und übliche deutsche Wiedergabe der griechischen Redeformel.
- source_word: Ζακχαῖε
  choice: Zachäus
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: σπεύσας κατάβηθι
  choice: beeil dich und komm herunter
  rationale: Die Verbindung von Aoristpartizip und Imperativ drückt Dringlichkeit aus. Zwei koordinierte Aufforderungen geben dies im Deutschen natürlich wieder.
- source_word: σήμερον γὰρ
  choice: Denn heute
  rationale: γάρ begründet die vorausgehende Aufforderung; „denn“ bewahrt diesen Zusammenhang, ohne ihn stärker auszudeuten.
- source_word: δεῖ με
  choice: muss ich
  rationale: δεῖ bezeichnet eine starke Notwendigkeit. „Muss ich“ bewahrt diese Kraft und lässt offen, ob hier besonders die göttliche Bestimmung beziehungsweise Jesu Sendung im Blick ist.
- source_word: ἐν τῷ οἴκῳ σου
  choice: in deinem Haus
  rationale: οἶκος kann das Gebäude, das Zuhause oder den häuslichen Bereich bezeichnen. „In deinem Haus“ ist konkret und wahrt die lexikalische Breite.
- source_word: μεῖναι
  choice: bleiben
  rationale: μένω bezeichnet hier das Verweilen bei Zachäus. „Bleiben“ ist präzise und legt nicht unnötig fest, ob auch eine Übernachtung gemeint ist.
theological_decisions:
- issue: Bedeutungsstärke von δεῖ im Lukasevangelium
  choice: „muss ich“
  alternative: „soll ich“ oder „ist es für mich notwendig“
  rationale: Im Lukasevangelium kann δεῖ eine Notwendigkeit im Rahmen von Jesu Sendung und Gottes Plan bezeichnen. „Muss ich“ erhält diese starke Notwendigkeit, ohne ihre theologische Ursache im Haupttext ausdrücklich festzulegen.
translation_notes:
  register: Moderner, würdiger Erzählstil mit direkter und verständlicher Rede. „Komm herunter“ entspricht dem räumlichen Kontext und klingt etwas gehobener als „komm runter“, ohne altertümlich zu wirken.
