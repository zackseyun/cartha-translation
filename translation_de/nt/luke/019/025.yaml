lexical_decisions:
- source_word: καὶ
  choice: Da
  rationale: Im erzählenden Zusammenhang leitet καί die unmittelbare Reaktion ein; »Da« gibt diesen Anschluss im Deutschen natürlich wieder, ohne einen Gegensatz einzutragen.
- source_word: εἶπαν
  choice: sagten sie
  rationale: Der Aorist wird im deutschen Erzählstil schlicht mit dem Präteritum wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten und verweist auf den Herrn beziehungsweise König der Erzählung.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος bezeichnet hier eine ehrerbietige Anrede an die Autoritätsfigur im Gleichnis. »Herr« bewahrt den lexikalischen Wert und lässt die mögliche weitere Resonanz offen.
- source_word: ἔχει
  choice: er hat doch schon
  rationale: Wörtlich bedeutet ἔχει »er hat«. Die deutschen Modal- und Fokuswörter »doch schon« machen den aus dem Kontext erkennbaren Einwand idiomatisch deutlich, ohne den sachlichen Inhalt zu verändern.
- source_word: δέκα
  choice: zehn
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: μνᾶς
  choice: Minen
  rationale: Die historische Währungseinheit wird als »Mine« wiedergegeben, statt sie durch eine irreführende moderne Geldbezeichnung zu ersetzen.
theological_decisions:
- issue: Wiedergabe von κύριος als direkte Anrede innerhalb des Gleichnisses
  choice: Herr
  alternative: Gebieter; mein Herr
  rationale: »Herr« wahrt sowohl die gewöhnliche ehrerbietige Anrede als auch die Autoritätsnuance. Der Vers wird dadurch nicht zu einem ausdrücklichen christologischen Bekenntnis vereindeutigt.
translation_notes:
  register: Natürliches, modernes Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich des griechischen Editionssatzes wird als Ausruf wiedergegeben, da der Satz einen spontanen Einwand ausdrückt; die Anrede und die historische Währung bleiben transparent.
