  source_fidelity: Die Wiedergabe von εἶπαν, αὐτῷ, Κύριε, δέκα und μνᾶς ist grundsätzlich zutreffend. Jedoch enthalten »doch schon« zusätzliche Fokus- und Einwandnuancen, die im griechischen ἔχει nicht ausgedrückt sind. Der abschließende Gedankenstrich der SBLGNT-Ausgabe sollte erhalten bleiben.
  naturalness: »Und sagten sie zu ihm« ist im modernen deutschen Erzählstil klar und natürlich. Der direkte Ausruf mit Gedankenstrich bildet den abgebrochenen bzw. weiterführenden Redeeinsatz des Editionssatzes angemessener ab als ein abschließendes Ausrufezeichen.
  terminology: »Herr« ist für Κύριε angemessen und wahrt die Ambiguität der respektvollen Anrede im Gleichnis. »Minen« ist als Bezeichnung der antiken Geldeinheit sachgerecht. Die Fußnoten sind inhaltlich brauchbar.
