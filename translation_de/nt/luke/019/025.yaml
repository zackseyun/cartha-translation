  text: 'Und sie sagten zu ihm: »Herr[a], er hat zehn Minen[b]—«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebieter« beziehungsweise »mein Herr«.'
