  - severity: low
    issue: »Da« für καί
    rationale: »Da« ist möglich, kann aber eine zeitliche Unmittelbarkeit stärker hervorheben. »Und« bildet die schlichte narrative Koordination von καί genauer ab und bleibt zugleich idiomatisch.
