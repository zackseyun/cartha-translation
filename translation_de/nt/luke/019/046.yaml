id: LUK.19.46
reference: Luke 19:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: de
  text: 'Dabei sagte er zu ihnen: „Es steht geschrieben: ‚Und mein Haus[a] wird ein Haus des Gebets sein‘; ihr aber habt es zu einer Räuberhöhle[b] gemacht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „mein Haus“ ist hier der Tempel gemeint; die Formulierung greift Jesaja 56,7 auf.
    reason: lexical_alternative
  - marker: b
    text: „Räuberhöhle“ greift Jeremia 7,11 auf. Das griechische Wort für „Räuber“ kann auch „Banditen“ bedeuten.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Dabei sagte er zu ihnen
  rationale: Das Präsenspartizip knüpft an die vorausgehende Handlung an. Die finite deutsche Form mit „dabei“ gibt diesen begleitenden Zusammenhang natürlicher wieder als „zu ihnen sagend“.
- source_word: Γέγραπται
  choice: Es steht geschrieben
  rationale: Die etablierte deutsche Schriftformel bewahrt den perfektischen Sinn eines verbindlich niedergelegten Textes.
- source_word: Καὶ ἔσται
  choice: Und ... wird ... sein
  rationale: Bewahrt sowohl das einleitende καί als auch den Zukunftsbezug der Schriftzitierung in natürlichem modernem Deutsch.
- source_word: ὁ οἶκός μου
  choice: mein Haus
  rationale: οἶκος bedeutet wörtlich „Haus“. Diese Wiedergabe erhält den Wortlaut und den Bezug auf Jesaja 56,7, ohne den Tempelbezug ausdrücklich in den Haupttext einzutragen.
- source_word: οἶκος προσευχῆς
  choice: ein Haus des Gebets
  rationale: Die Genitivverbindung wird natürlich und zugleich traditionsnah wiedergegeben.
- source_word: ὑμεῖς δὲ
  choice: ihr aber
  rationale: Die Wortstellung hebt wie im Griechischen das ausdrücklich gesetzte Pronomen hervor und wahrt den scharfen Gegensatz.
- source_word: ἐποιήσατε
  choice: habt ... gemacht
  rationale: Das deutsche Perfekt bezeichnet idiomatisch die vollzogene Handlung mit ihrem fortdauernden Ergebnis.
- source_word: σπήλαιον
  choice: Höhle
  rationale: Die Grundbedeutung ist „Höhle“; im Ausdruck „Räuberhöhle“ bezeichnet das Wort zugleich einen Zufluchts- oder Unterschlupfort und bewahrt das Bild aus Jeremia 7,11.
- source_word: λῃστῶν
  choice: Räuber
  rationale: λῃστής kann Räuber oder Bandit bezeichnen. „Räuber“ erhält die bekannte prophetische Wendung, ohne eine politische Bedeutung festzulegen.
theological_decisions:
- issue: Wiedergabe des Tempelzitats mit „Haus“ statt „Tempel“
  choice: mein Haus ... ein Haus des Gebets
  alternative: mein Tempel ... ein Haus des Gebets
  rationale: Der griechische Text verwendet οἶκος und zitiert damit Jesaja 56,7. „Haus“ erhält die intertextuelle und theologische Bildsprache, während der Kontext den Bezug auf den Tempel erkennen lässt.
- issue: Bedeutungsbreite von λῃστῶν
  choice: Räuber
  alternative: Banditen
  rationale: „Räuber“ passt zur Anspielung auf Jeremia 7,11 und vermeidet es, die mögliche Bedeutung „Banditen“ oder „Aufständische“ zur alleinigen Deutung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schriftformel und die prophetischen Bildworte bleiben erkennbar, ohne unnötig altertümlich zu klingen. Die Fußnotenmarker stehen unmittelbar nach dem vollständigen Vers, da sie die beiden Schriftanklänge innerhalb des Zitats erläutern.
