source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: de
  text: 'Zachäus aber stellte sich hin und sagte zum Herrn: »Sieh, Herr, die Hälfte meines Besitzes gebe ich den Armen; und wenn ich irgendjemanden um etwas erpresst habe[a], erstatte ich es vierfach[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »betrogen« beziehungsweise »durch falsche Beschuldigung geschädigt«. Das griechische Verb kann Erpressung, Ausbeutung oder betrügerische Schädigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechischen Präsensformen können hier auch einen sofort gefassten Entschluss ausdrücken: »werde ich geben« und »werde ich erstatten«.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: trat vor
  rationale: Das intransitiv gebrauchte Partizip von ἵστημι bezeichnet, dass Zachäus sich hinstellt bzw. eine feste Position einnimmt. „Trat vor“ gibt die erzählerische Handlung im Deutschen natürlich wieder, ohne sicher festzulegen, ob er zuvor saß.
- source_word: κύριον / κύριε
  choice: Herrn / Herr
  rationale: „Herr“ bewahrt sowohl die respektvolle Anrede als auch das in Lukas mögliche stärkere Gewicht des Titels.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeit heischende und emphatische Funktion wird in würdigem, verständlichem Deutsch bewahrt.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: die Hälfte meines Besitzes
  rationale: Die substantivierten ὑπάρχοντα bezeichnen hier Eigentum bzw. Besitz; die deutsche Formulierung gibt den partitiven Sinn knapp und idiomatisch wieder.
- source_word: τοῖς πτωχοῖς
  choice: den Armen
  rationale: Die substantivische Verwendung von πτωχός bezeichnet arme Menschen und wird im Deutschen natürlich so wiedergegeben.
- source_word: δίδωμι
  choice: gebe ich
  rationale: Der griechische Präsensindikativ wird formal als Präsens wiedergegeben. So bleibt offen, ob Zachäus gegenwärtige Praxis oder einen sofort gefassten Entschluss beschreibt.
- source_word: εἴ τινός τι
  choice: wenn ich irgendjemanden um etwas
  rationale: Die beiden indefiniten Elemente werden in natürlicher deutscher Wortfolge vollständig wiedergegeben.
- source_word: ἐσυκοφάντησα
  choice: erpresst habe
  rationale: Das Verb kann Erpressung, Ausbeutung oder betrügerische Schädigung, teils durch falsche Beschuldigung, bezeichnen. „Erpresst“ passt zum Machtmissbrauch im Umfeld des Steuerwesens; die weitere Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: ἀποδίδωμι
  choice: erstatte ich es
  rationale: ἀποδίδωμι bedeutet zurückgeben oder erstatten. Das Pronomen „es“ macht den deutschen Bezug auf das unrechtmäßig Erlangte klar.
- source_word: τετραπλοῦν
  choice: vierfach
  rationale: Die knappe adverbiale Wiedergabe bezeichnet präzise eine Erstattung in vierfacher Höhe.
theological_decisions:
- issue: Aussagekraft der Präsensformen δίδωμι und ἀποδίδωμι
  choice: 'Präsens: „gebe ich … erstatte ich“'
  alternative: 'Futurisch bzw. als unmittelbarer Entschluss: „werde ich geben … werde ich erstatten“'
  rationale: Die griechischen Formen sind Präsensindikative. Das deutsche Präsens bewahrt die Spannung zwischen einer Beschreibung bisheriger Praxis und einer unmittelbar gefassten Absicht, ohne eine theologische Aussage über frühere Gerechtigkeit oder neu einsetzende Umkehr vorwegzunehmen.
- issue: Bedeutungsumfang von κύριος in der Anrede Jesu
  choice: „Herr“
  alternative: „mein Herr“ oder „Herr im höflichen Sinn“
  rationale: „Herr“ lässt sowohl respektvolle Anrede als auch christologische Bedeutung zu und verengt den Titel nicht auf bloße Höflichkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt emphatisch, aber nicht archaisch; die umstrittene zeitliche Aussage der Präsensformen wird nicht im Haupttext entschieden.
