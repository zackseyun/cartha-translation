  verdict: revise
  source_fidelity: Die Wiedergabe von Καὶ ἐγένετο, ὡς, ἤγγισεν, den Ortsnamen, dem Bergnamen und ἀπέστειλεν ist im Wesentlichen zutreffend. „bei dem Berg“ schwächt jedoch πρὸς („auf/in Richtung zu“) zu einer statischen Ortsangabe ab. Die Richtungsrelation sollte erhalten bleiben.
  naturalness: „Und es geschah“ ist als bewusst erzählnaher, würdiger Stil möglich. „Zwei der Jünger“ ist im modernen Standarddeutsch idiomatischer als „zwei von den Jüngern“.
  terminology: „Betfage“, „Betanien“, „Ölberg“ und „Jünger“ sind etablierte deutsche biblische Formen. Die Wiedergabe „Ölberg“ ist für τὸ καλούμενον Ἐλαιῶν sachgerecht.
