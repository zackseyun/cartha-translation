  - severity: low
    issue: „zwei von den Jüngern“ ist stilistisch weniger standardsprachlich als nötig.
    rationale: Die partitive Konstruktion δύο τῶν μαθητῶν wird mit „zwei der Jünger“ knapp, natürlich und präzise wiedergegeben.
