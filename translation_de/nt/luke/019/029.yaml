  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: de
  text: Und es geschah, als er sich Betfage und Betanien näherte, in Richtung des Berges, der Ölberg genannt wird, da sandte er zwei der Jünger
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Und es geschah
  rationale: Die lukanische Erzählformel bleibt erkennbar erhalten; die Wendung ist im Deutschen würdevoll und verständlich, ohne das verbindende καί auszulassen.
- source_word: ὡς
  choice: als
  rationale: ὡς leitet hier einen temporalen Nebensatz ein. „Als“ ist im Deutschen natürlicher als „wie“ und legt keine weitergehende zeitliche Nuance fest.
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: er sich Betfage und Betanien näherte
  rationale: ἐγγίζω bezeichnet das Herankommen; die idiomatische deutsche Konstruktion „sich … nähern“ gibt dies präzise wieder. Die Präposition εἰς wird dabei nicht separat abgebildet, da „sich nähern“ im Deutschen den Dativ verlangt.
- source_word: πρὸς τὸ ὄρος
  choice: bei dem Berg
  rationale: πρός kann im Kontext eine örtliche Beziehung bezeichnen. „Bei“ ergibt zusammen mit den Ortsangaben einen natürlichen deutschen Satz und vermeidet die missverständliche Vorstellung, Jesus bewege sich erst noch in Richtung des bereits erreichten Gebietes.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: der Ölberg genannt wird
  rationale: Das griechische Ἐλαιῶν ist formal ein Genitiv Plural („der Oliven“), fungiert aber als überlieferter Bergname. „Ölberg“ ist dessen etablierte, transparente deutsche Form.
- source_word: ἀπέστειλεν
  choice: da sandte er
  rationale: „Sandte“ gibt den narrativen Aorist schlicht wieder; „da“ nimmt nach dem vorangestellten Temporalsatz idiomatisch den Hauptsatz auf.
- source_word: δύο τῶν μαθητῶν
  choice: zwei von den Jüngern
  rationale: Die partitive Genitivkonstruktion wird direkt wiedergegeben. Ein possessives „seinen“ wird nicht ergänzt, obwohl aus dem Kontext Jesu Jünger gemeint sind.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer Nähe zur lukanischen Erzählweise. Die Ortsnamen folgen den im Deutschen gebräuchlichen biblischen Formen „Betfage“, „Betanien“ und „Ölberg“. Der Vers bleibt entsprechend der griechischen Satzführung ohne abschließenden Punkt, da der Satz im folgenden Vers inhaltlich weitergeführt wird.
