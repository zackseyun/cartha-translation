  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: de
  text: Und es geschah, als er zurückkehrte, nachdem er die Königsherrschaft[a] empfangen hatte, ließ er jene Sklaven[b], denen er das Geld gegeben hatte, zu sich rufen, um zu erfahren, was sie durch Handel erwirtschaftet hatten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Königreich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Diener. Das griechische Wort bezeichnet Personen in einem unfreien Abhängigkeitsverhältnis, kann aber je nach Zusammenhang auch mit „Diener“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: welchen Gewinn sie erzielt hatten; auch: welche Geschäfte sie gemacht hatten. Das griechische Verb bezeichnet geschäftliches Handeln und kann dessen Ergebnis mit einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt die für Lukas typische erzählerische Übergangsformel, ohne das heute deutlich altertümlichere „es begab sich“ zu verwenden.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: als er zurückkehrte
  rationale: Der artikulierte Infinitiv mit ἐν hat hier temporale Bedeutung; die deutsche Nebensatzform ist natürlich und präzise.
- source_word: λαβόντα τὴν βασιλείαν
  choice: nachdem er die Königsherrschaft empfangen hatte
  rationale: Das Partizip bezeichnet einen der Rückkehr vorausgehenden Vorgang. „Königsherrschaft“ gibt in diesem politischen Gleichniskontext den Empfang königlicher Gewalt genauer wieder als ein rein räumlich verstandenes „Königreich“.
- source_word: φωνηθῆναι αὐτῷ
  choice: ließ ... zu sich rufen
  rationale: Die deutsche Konstruktion gibt den veranlassten Ruf bzw. die Vorladung idiomatisch wieder.
- source_word: δούλους
  choice: Sklaven
  rationale: Das Wort bezeichnet rechtlich und sozial Unfreie. Im Gleichnis stehen diese Personen unter der umfassenden Verfügungsgewalt des vornehmen Mannes; „Sklaven“ wahrt diese historische Realität deutlicher als „Diener“.
- source_word: δεδώκει τὸ ἀργύριον
  choice: denen er das Geld gegeben hatte
  rationale: Das Plusquamperfekt wahrt die Vorzeitigkeit; ἀργύριον bezeichnet hier das zuvor ausgehändigte Geld, nicht eigens die Maßeinheit.
- source_word: ἵνα γνοῖ
  choice: um zu erfahren
  rationale: Gibt den Zweck der Einberufung in natürlichem Deutsch wieder; „erfahren“ passt zur beabsichtigten Feststellung des Geschäftsergebnisses.
- source_word: τί διεπραγματεύσαντο
  choice: was sie durch Handel erwirtschaftet hatten
  rationale: Die Formulierung hält sowohl die geschäftliche Tätigkeit als auch deren Ergebnis fest, ohne τί vorschnell ausschließlich als eine bestimmte Gewinnsumme zu deuten.
theological_decisions:
- issue: Wiedergabe von δοῦλος im sozialgeschichtlichen und parabolischen Kontext
  choice: Sklaven
  alternative: Diener
  rationale: „Sklaven“ bildet den unfreien Status und die starke Autoritätsbeziehung im erzählten Geschehen ab. Die Übersetzung macht daraus keine Aussage über eine besondere geistliche Amts- oder Heilslehre; die geläufigere Alternative wird in der Fußnote genannt.
- issue: Bedeutung von βασιλεία im politischen Gleichniskontext
  choice: Königsherrschaft
  alternative: Königreich
  rationale: Gemeint ist hier besonders die empfangene königliche Herrschaftsgewalt. Die Alternative „Königreich“ bleibt lexikalisch möglich und wird deshalb ausgewiesen.
- issue: Ergebnis des Handels in τί διεπραγματεύσαντο
  choice: was sie durch Handel erwirtschaftet hatten
  alternative: welchen Gewinn sie erzielt hatten
  rationale: Der griechische Ausdruck umfasst Geschäftstätigkeit und Ergebnis. Die gewählte Formulierung lässt die genaue Art oder Höhe des Ergebnisses offen und vermeidet eine unnötige Festlegung allein auf Nettogewinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Erzählformel bleibt erkennbar; „es begab sich“ wird als unnötig altertümlich vermieden. Die Satzstruktur folgt dem griechischen zeitlichen Ablauf, wird aber durch Doppelpunkt und idiomatische Verbformen lesbar gehalten.
