id: LUK.19.38
reference: Luke 19:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: de
  text: 'und sie riefen: „Gesegnet ist der König, der im Namen des Herrn kommt![a] Frieden im Himmel und Herrlichkeit in den höchsten Höhen!“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anders als die aus Psalm 118,26 vertraute kürzere Formulierung nennt Lukas ausdrücklich „den König“.
    reason: alternative_reading
  - marker: b
    text: 'Dies erinnert an Lukas 2,14, nennt den Ort des Friedens aber umgekehrt: dort „auf Erden“, hier „im Himmel“.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: und sie riefen
  rationale: Das präsentische Partizip knüpft an den vorhergehenden Vers an. Im Zusammenhang des lauten Jubels gibt „riefen“ die Sprechhandlung natürlich wieder; „und“ macht die syntaktische Verbindung im Deutschen deutlich.
- source_word: Εὐλογημένος
  choice: Gesegnet
  rationale: Bewahrt die Form der Segensakklamation und den Anklang an Psalm 118,26, ohne sie auf „gepriesen“ oder „gelobt“ zu verengen.
- source_word: ὁ ἐρχόμενος βασιλεὺς
  choice: der König, der … kommt
  rationale: Das ausdrücklich vorhandene βασιλεύς wird beibehalten. Der Relativsatz gibt das substantivierte Partizip idiomatisch wieder und lässt die königliche Akklamation klar hervortreten.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die etablierte deutsche Wendung bewahrt sowohl den semitischen Hintergrund als auch die Bedeutung des Kommens unter der Vollmacht des Herrn.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Frieden im Himmel
  rationale: Die knappe, verblose Akklamation bleibt erhalten. „Im Himmel“ folgt dem griechischen Text und wird nicht an Lukas 2,14 angeglichen.
- source_word: δόξα ἐν ὑψίστοις
  choice: Herrlichkeit in den höchsten Höhen
  rationale: Die Formulierung gibt den räumlichen Plural ὑψίστοις verständlich und feierlich wieder und bewahrt zugleich den Anklang an Lukas 2,14.
theological_decisions:
- issue: Königliche, messianisch geprägte Akklamation
  choice: „der König“ ausdrücklich wiedergeben
  alternative: „der kommt“ ohne Königstitel
  rationale: βασιλεύς steht ausdrücklich im griechischen Text. Seine Wiedergabe wahrt den königlichen Nachdruck des Lukas, ohne zusätzliche christologische Deutung in den Vers einzutragen.
- issue: Beziehung zu Lukas 2,14
  choice: „Frieden im Himmel“
  alternative: „Frieden auf Erden“
  rationale: Der Ausgangstext lautet eindeutig ἐν οὐρανῷ. Die auffällige Spannung zum Lobgesang in Lukas 2,14 darf nicht durch Harmonisierung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Rhythmus. „Riefen“ entspricht dem jubelnden Kontext; „höchste Höhen“ vermeidet das im heutigen Deutsch missverständliche substantivierte „in der Höhe“ und erhält den poetischen Parallelismus.
