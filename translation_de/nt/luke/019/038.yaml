  source_fidelity: 'Die Übersetzung bewahrt alle wesentlichen Elemente des griechischen Textes: die Akklamation, den ausdrücklich genannten König, das Kommen „im Namen des Herrn“, „Frieden im Himmel“ sowie „Herrlichkeit in den höchsten Höhen“. Insbesondere wird οὐρανῷ nicht mit Lukas 2,14 zu „Erden“ harmonisiert.'
