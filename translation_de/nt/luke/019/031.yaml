id: LUK.19.31
reference: Luke 19:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: de
  text: 'Und wenn euch jemand fragt: »Warum bindet ihr es los?«, dann sollt ihr sagen: »Der Herr[a] braucht es.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Meister«.'
    reason: κύριος kann hier als Titel »Herr« verstanden werden, möglicherweise aber auch im praktischen Sinn »Meister«.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: fragt
  rationale: Das gewöhnliche deutsche Verb für eine Frage; es passt natürlich zur folgenden direkten Rede.
- source_word: Διὰ τί
  choice: Warum
  rationale: Die idiomatische und genaue deutsche Wiedergabe der Frage nach dem Grund.
- source_word: λύετε
  choice: bindet ihr es los
  rationale: Im Zusammenhang wird das angebundene Füllen losgebunden. Das im Griechischen unausgesprochene Objekt wird im Deutschen zur Klarheit mit »es« wiedergegeben.
- source_word: οὕτως ἐρεῖτε
  choice: dann sollt ihr sagen
  rationale: »Dann« gibt die situationsbezogene Anweisung natürlich wieder; »sollt« bewahrt den auffordernden Sinn des Futurs.
- source_word: κύριος
  choice: Herr
  rationale: »Herr« bewahrt sowohl die übliche Bedeutung als Titel als auch den möglichen theologischen Anklang bei Lukas.
- source_word: αὐτοῦ
  choice: es
  rationale: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf das Füllen. Im Deutschen richtet sich das Pronomen nach dem grammatisch sächlichen »Füllen«.
- source_word: χρείαν ἔχει
  choice: braucht
  rationale: Die natürliche moderne deutsche Wiedergabe der Wendung »Bedarf haben an«; sie drückt ihren Sinn klar und würdig aus.
theological_decisions:
- issue: Bedeutung und Bezug von Ὁ κύριος
  choice: »Der Herr«, wahrscheinlich auf Jesus bezogen und mit möglichem titular-theologischem Klang
  alternative: »Der Besitzer« beziehungsweise »der Herr des Tieres«
  rationale: Der lukanische Erzählzusammenhang legt Jesus als Bezug nahe, während κύριος sprachlich auch einen Herrn oder Besitzer bezeichnen kann. Der Haupttext bewahrt mit »Herr« diese Spannung; die Fußnote nennt die sachlich mögliche alternative Bedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; die Satzstellung bleibt natürlich, ohne die knappe Anweisungsstruktur des Griechischen zu verwischen.
