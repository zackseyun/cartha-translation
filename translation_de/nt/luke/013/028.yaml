  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: de
  text: Dort wird Weinen und Zähneknirschen sein, wenn ihr Abraham, Isaak und Jakob und alle Propheten im Reich Gottes seht, während ihr selbst hinausgeworfen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „während ihr selbst nach draußen geworfen werdet“. Das griechische ἐκβαλλομένους ἔξω betont den gewaltsamen Ausschluss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf den Ort der Ausgrenzung beziehungsweise des Gerichts; „dort“ ist direkt und natürlich.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: Weinen und Zähneknirschen
  rationale: Die geläufige deutsche Wendung gibt die konkrete Darstellung von Schmerz und Verzweiflung prägnant wieder.
- source_word: ὅταν ὄψησθε
  choice: wenn ihr … seht
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier eine zukünftige Situation; im Deutschen ist das Präsens nach „wenn“ idiomatisch.
- source_word: πάντας τοὺς προφήτας
  choice: alle Propheten
  rationale: Die umfassende Aussage von πάντας bleibt ausdrücklich erhalten.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Dies ist die vertraute, sachlich genaue deutsche Wiedergabe des zentralen biblischen Ausdrucks.
- source_word: ὑμᾶς δὲ
  choice: euch selbst aber
  rationale: „aber“ wahrt den scharfen Gegensatz; „euch selbst“ bringt die Hervorhebung des ausdrücklichen Pronomens zur Geltung.
- source_word: ἐκβαλλομένους ἔξω
  choice: hinausgeworfen
  rationale: Das Passivpartizip von ἐκβάλλω zusammen mit ἔξω bezeichnet eine nachdrückliche, von außen bewirkte Ausgrenzung; „hinausgeworfen“ bewahrt diese Kraft knapp und idiomatisch.
theological_decisions:
- issue: Art der Gerichtsbildsprache
  choice: Die konkreten Bilder von Ausgrenzung, Weinen und Zähneknirschen bleiben ohne Abschwächung stehen.
  alternative: Deutende Umschreibungen wie „tiefe Trauer“ oder „endgültige Verdammnis“.
  rationale: Der Vers schildert den Ausschluss aus dem Reich Gottes und die damit verbundene Qual, entfaltet aber an dieser Stelle keine vollständige Lehre über das Endgericht.
- issue: Zeitlicher beziehungsweise aspektueller Wert von ἐκβαλλομένους
  choice: 'Partizipial und ohne zusätzliches deutsches Hilfsverb: „euch selbst aber hinausgeworfen“.'
  alternative: „während ihr selbst hinausgeworfen werdet“ oder „aber ihr selbst werdet hinausgeworfen“.
  rationale: Die knappe Konstruktion bewahrt die syntaktische Gegenüberstellung des Sehens mit dem eigenen Ausgeschlossensein, ohne den griechischen Aspekt unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und verständliche Wendung „Weinen und Zähneknirschen“ bleibt erhalten. Die Schlusskonstruktion ist bewusst knapp, um die griechische partizipiale Gegenüberstellung und ihre Härte zu bewahren.
