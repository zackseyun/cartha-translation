lexical_decisions:
- source_word: ἀμπελουργόν
  choice: Weinberggärtner
  rationale: Bezeichnet den Arbeiter, der einen Weinberg pflegt; die Wiedergabe bewahrt den konkreten Schauplatz und ist im modernen Deutschen verständlich.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Lenkt nachdrücklich die Aufmerksamkeit auf den folgenden Sachverhalt, ohne archaisch zu klingen.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: seit drei Jahren
  rationale: Gibt die vom vergangenen Ausgangspunkt bis in die Gegenwart reichende Zeitspanne idiomatisch wieder.
- source_word: ἔρχομαι ζητῶν
  choice: komme ich und suche
  rationale: Bewahrt das griechische Präsens und lässt im Zusammenhang die wiederholte Suche während der drei Jahre erkennen.
- source_word: καρπὸν
  choice: Frucht
  rationale: Entspricht dem wörtlichen landwirtschaftlichen Bild des Gleichnisses, ohne dessen Deutung vorwegzunehmen.
- source_word: συκῇ
  choice: Feigenbaum
  rationale: Die übliche und eindeutige deutsche Bezeichnung.
- source_word: οὐχ εὑρίσκω
  choice: finde aber keine
  rationale: Gibt das griechische Präsens direkt wieder; „keine“ nimmt die feminine Singularform „Frucht“ auf.
- source_word: ἔκκοψον
  choice: Hau ihn um
  rationale: Ein natürlicher, bestimmter Befehl zum Fällen eines Baumes; kräftig, aber nicht unnötig technisch.
- source_word: ἱνατί
  choice: Warum
  rationale: Die schlichte deutsche Frageform entspricht der direkten rhetorischen Frage.
- source_word: καὶ
  choice: auch noch
  rationale: 'Bringt die steigernde Kraft zum Ausdruck: Der Baum bleibt nicht nur fruchtlos, sondern beeinträchtigt darüber hinaus den Boden.'
- source_word: γῆν
  choice: den Boden
  rationale: Passt im landwirtschaftlichen Zusammenhang sowohl zur Erde als Anbaugrund als auch zu ihrer Ertragsfähigkeit.
- source_word: καταργεῖ
  choice: unbrauchbar machen
  rationale: Bewahrt den stärkeren möglichen Sinn des Verbs, wonach der Baum den Boden wirkungslos beziehungsweise unproduktiv macht, statt lediglich Platz einzunehmen.
theological_decisions:
- issue: Bildsprache des Gleichnisses gegenüber ausdrücklicher theologischer Deutung
  choice: Die landwirtschaftliche Bildsprache wird ohne eingefügte geistliche Auslegung beibehalten.
  alternative: Die Fruchtlosigkeit ausdrücklich auf geistliche oder ethische Fruchtlosigkeit beziehen.
  rationale: Der Ausgangstext formuliert innerhalb des Gleichnisses konkret; seine theologische Anwendung soll aus dem Zusammenhang hervorgehen und nicht in den Vers hineingetragen werden.
- issue: Bedeutung von καταργεῖ
  choice: „den Boden unbrauchbar machen“ im Haupttext, mit der räumlich-ressourcenbezogenen Alternative in der Fußnote
  alternative: „den Boden beanspruchen“ oder „den Boden ausnutzen“ im Haupttext
  rationale: Das Verb kann hier sowohl das Unwirksammachen des Bodens als auch seine nutzlose Beanspruchung bezeichnen. Die gewählte Fassung bewahrt den stärkeren lexikalischen Sinn, während die Fußnote die kontextuell naheliegende Alternative offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt natürlich und bestimmt. „Weinberggärtner“ wahrt den konkreten Weinbergskontext; „Hau ihn um“ entspricht dem knappen Imperativ, ohne altertümlich zu wirken. Die Fußnote erhält die echte Bedeutungsbreite von καταργεῖ.
