  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: de
  text: 'Da sagte er zu dem Weinberggärtner: »Sieh, seit drei Jahren komme ich, um an diesem Feigenbaum Frucht zu suchen, und finde keine. Fäll ihn! Warum soll er auch noch den Boden unbrauchbar machen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
