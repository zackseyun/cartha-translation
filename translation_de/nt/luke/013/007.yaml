    text: 'Oder: »Warum soll er auch noch den Boden beanspruchen?« Das griechische Verb kann sowohl bedeuten, den Boden unbrauchbar beziehungsweise unproduktiv zu machen, als auch, ihn nutzlos in Anspruch zu nehmen.'
