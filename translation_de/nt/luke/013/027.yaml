review_pass:
  verdict: approve
  source_fidelity: Der Text gibt die griechische Redeeinleitung ἐρεῖ λέγων idiomatisch mit „wird euch sagen“ wieder; die im Griechischen redundante Partizipialkonstruktion muss im Deutschen nicht doppelt abgebildet werden. „Ich weiß nicht, woher ihr kommt“ trifft οὐκ οἶδα πόθεν ἐστέ sachgerecht und wahrt die mögliche implizite Distanzierung, ohne sie auszudeuten. „Geht weg von mir“ gibt den nachdrücklichen Imperativ ἀπόστητε ἀπ’ ἐμοῦ zuverlässig wieder. „ihr alle, die ihr Unrecht tut“ überträgt die Anrede πάντες ἐργάται ἀδικίας verständlich und ohne die engere Bedeutung „Gesetzlosigkeit“ einzutragen.
  naturalness: Modernes Standarddeutsch, klar und im Ton eines Gerichtswortes angemessen. Die Anrede „ihr alle, die ihr Unrecht tut“ ist natürlich und bewahrt die nachdrückliche direkte Ansprache.
  terminology: „Unrecht“ ist für ἀδικία eine tragfähige breite Wiedergabe. Die Fußnote nennt „Ungerechtigkeit“ sowie eine substantivische Formulierung als echte Alternativen. Namen oder theologisch belastete Fachbegriffe sind nicht betroffen.
