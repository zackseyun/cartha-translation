id: LUK.13.27
reference: Luke 13:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: de
  text: 'Und er wird euch sagen: »Ich weiß nicht, woher ihr kommt.[a] Geht weg von mir, ihr alle, die ihr Unrecht[b] tut!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »woher ihr seid«.'
    reason: formal_source_wording
  - marker: b
    text: 'Oder: »Ungerechtigkeit«; die ganze Wendung lässt sich auch mit »ihr Täter des Unrechts« wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: er wird euch sagen
  rationale: Die im Griechischen pleonastische Verbindung aus finitem Verb und Partizip wird im natürlichen Deutschen zu einer einzigen Redeeinleitung zusammengezogen; ὑμῖν wird als Dativobjekt »euch« wiedergegeben.
- source_word: οἶδα
  choice: ich weiß nicht
  rationale: οἶδα bedeutet hier zunächst »wissen/kennen«. Die direkte Wiedergabe wahrt die im Kontext mitschwingende Distanzierung, ohne sie durch »anerkennen« oder »erkennen« ausdrücklich auszudeuten.
- source_word: πόθεν ἐστέ
  choice: woher ihr kommt
  rationale: πόθεν bezeichnet Herkunft oder Ursprung. »Woher ihr kommt« ist im modernen Deutschen idiomatischer als das formal nähere »woher ihr seid«.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Geht weg von mir
  rationale: Der Aoristimperativ fordert entschieden zur Trennung auf. »Geht weg von mir« ist klar, nachdrücklich und weniger altertümlich als »Weicht von mir«.
- source_word: πάντες ἐργάται ἀδικίας
  choice: ihr alle, die ihr Unrecht tut
  rationale: Die substantivische Wendung wird als natürliche deutsche Anrede mit Relativsatz formuliert. »Unrecht« gibt ἀδικία breit moralisch wieder, ohne die speziellere Bedeutung »Gesetzlosigkeit« einzutragen.
theological_decisions:
- issue: Bedeutung von ἀδικίας im Gerichtswort
  choice: Unrecht
  alternative: Ungerechtigkeit; böses Handeln
  rationale: ἀδικία bezeichnet Ungerechtigkeit, Unrecht oder verwerfliches Tun. »Unrecht« bewahrt die breite moralische Aussage und vermeidet, den Begriff auf Gesetzlosigkeit im engeren Sinn festzulegen.
- issue: Aussage »Ich weiß nicht, woher ihr kommt«
  choice: wörtliche Wissensformulierung beibehalten
  alternative: Ich erkenne euch nicht an
  rationale: Im Zusammenhang kann die Aussage eine Verweigerung von Beziehung oder Anerkennung ausdrücken. Die Übersetzung lässt diese theologische Spannung bestehen, statt die pragmatische Bedeutung ausdrücklich in den Haupttext einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem und nachdrücklichem Ton. Die direkte Rede bleibt knapp; unnötig altertümliche Formulierungen werden vermieden.
