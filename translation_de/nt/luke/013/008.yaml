  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: de
  text: 'Er aber antwortete ihm: »Herr, lass ihn auch dieses Jahr noch stehen,[a] bis ich um ihn herum grabe und Dünger ausbringe.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verschone ihn auch dieses Jahr noch«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Mist/Dung ausbringe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: antwortete ihm
  rationale: Die im Griechischen übliche Verbindung aus Partizip und historischem Präsens wird im natürlichen deutschen Erzählstil knapp mit »antwortete ihm« wiedergegeben; ein zusätzliches »und sagte« wäre schwerfällig.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« entspricht der respektvollen Anrede an den Weinbergbesitzer und bewahrt zugleich die übliche Wiedergabe von κύριος, ohne die parabolische Szene übermäßig zu deuten.
- source_word: ἄφες αὐτὴν
  choice: lass ihn … stehen
  rationale: Gemeint ist, dass der Feigenbaum vorerst an seinem Platz bleiben soll. Das maskuline Pronomen folgt im Deutschen dem vorausgesetzten »Feigenbaum«; »verschone ihn« würde die beabsichtigte Schonfrist deutlicher interpretieren, als das Verb selbst verlangt.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: auch dieses Jahr noch
  rationale: Die Formulierung gibt die zusätzliche Frist idiomatisch wieder und hält zugleich am ausdrücklichen »dieses Jahr« des griechischen Textes fest.
- source_word: ἕως ὅτου
  choice: bis
  rationale: »Bis« ist die natürliche deutsche Entsprechung für die zeitliche Grenze, innerhalb deren der Weingärtner die genannten Arbeiten ausführen will.
- source_word: σκάψω περὶ αὐτὴν
  choice: um ihn herum gegraben
  rationale: Die konkrete Tätigkeit des Grabens um den Baum bleibt erhalten; die deutsche Perfektkonstruktion nach »bis« stellt die Durchführung der beiden Maßnahmen als Ziel der gewährten Frist dar.
- source_word: βάλω κόπρια
  choice: Dünger ausgebracht
  rationale: κόπρια bezeichnet Mist beziehungsweise Dung als Dünger. »Dünger ausbringen« ist verständliches, sachgerechtes Deutsch; eine Fußnote bewahrt die konkretere Bedeutung »Mist«.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede innerhalb des Gleichnisses
  choice: Herr
  alternative: Besitzer; mein Herr
  rationale: Der Ausdruck ist hier zunächst eine respektvolle Anrede an den Weinbergbesitzer. »Herr« wahrt die lexikalische und kanonische Mehrdeutigkeit, ohne ausdrücklich festzulegen, ob die Gestalt allegorisch auf Gott bezogen werden soll.
- issue: Implizite Schonfrist in ἄφες αὐτὴν
  choice: lass ihn … stehen
  alternative: verschone ihn
  rationale: Die bevorstehende Beseitigung des Baumes lässt eine Schonung mitschwingen, doch »stehen lassen« gibt den unmittelbaren Sinn wieder, ohne diese Implikation zur ausdrücklichen Aussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt anschaulich und landwirtschaftlich konkret, ohne unnötig altertümliche Wendungen. Das im Kontext vorausgesetzte Bezugswort ist der Feigenbaum, daher steht im Deutschen »ihn«.
