id: LUK.13.2
reference: Luke 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: de
  text: 'Da antwortete er ihnen: »Meint ihr, diese Galiläer seien größere Sünder gewesen als alle anderen Galiläer, weil sie das erlitten haben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Da antwortete er ihnen
  rationale: Die griechische Verbindung aus Partizip und finitem Verb wird in natürlichem Deutsch als einfache Antwortformel wiedergegeben.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: seien größere Sünder gewesen als alle anderen Galiläer
  rationale: παρά mit dem Akkusativ bezeichnet hier den Vergleich. ἐγένοντο ist in diesem prädikativen Zusammenhang idiomatisch mit »gewesen« wiederzugeben; »wurden« oder »seien ... geworden« könnte fälschlich nahelegen, das Leiden habe sie erst zu Sündern gemacht.
- source_word: ταῦτα πεπόνθασιν
  choice: weil sie das erlitten haben
  rationale: Das Perfekt πεπόνθασιν bezeichnet das eingetretene Leiden mit fortwirkender Bedeutung; »das« fasst die zuvor berichteten Ereignisse natürlich zusammen.
theological_decisions:
- issue: Zusammenhang zwischen außergewöhnlichem Leid und außergewöhnlicher Sündhaftigkeit
  choice: Die Frage lässt offen, bevor der folgende Vers antwortet, ob das Leiden eine überdurchschnittliche Sündhaftigkeit beweise.
  alternative: Die Frage bereits ausdrücklich als verneinende Aussage formulieren.
  rationale: Die rhetorische Frage und damit die Spannung des griechischen Textes werden bewahrt; Jesu ausdrückliche Verneinung folgt erst in Vers 3.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die indirekte Frage nach »Meint ihr« steht idiomatisch im Konjunktiv I; die direkte Rede und die rhetorische Spannung bleiben erhalten.
