  rationale: Die Revision beschränkt sich auf eine sichere Präzisierung der Richtungs- und Einbettungsangabe εἰς sowie auf eine modern eindeutige Erklärung des Sauerteigbegriffs in der Fußnote. Die auffällige, aber im Griechischen begründete Formulierung „verbarg“ bleibt bestehen, und keine theologische Deutung wird ergänzt.
