    issue: „unter drei Maß Mehl“
    rationale: Die Wendung kann räumlich als „unterhalb von drei Maß Mehl“ verstanden werden und bildet εἰς („in, hinein in“) nicht so genau ab. „in drei Maß Mehl“ ist sowohl quellennäher als auch idiomatischer.
  - severity: low
    issue: 'Fußnote a: „Triebmittel“'
    rationale: „Triebmittel“ ist im heutigen Deutsch häufig ein Oberbegriff, der auch Backpulver umfasst. Für ζύμη ist eine Erklärung mit „Sauerteig“ oder „Hefemittel“ sachnäher.
