  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: de
  text: Es ist wie Sauerteig[a], den eine Frau nahm und in drei Maß Mehl[b] verbarg[c], bis alles durchsäuert war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hefe“. Gemeint ist ein zum Durchsäuern von Teig verwendetes Hefemittel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „drei Sata Mehl“. Das war eine sehr große Menge Mehl.'
    reason: cultural_note
  - marker: c
    text: 'Oder dem Sinn nach: „untermischte“. Das griechische Verb bedeutet wörtlich „verbarg“ oder „versteckte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: wie
  rationale: Das prädikative Adjektiv leitet einen Vergleich ein; „Es ist wie“ ist im Deutschen natürlich und bewahrt die knappe Gleichnisform.
- source_word: ζύμῃ
  choice: Sauerteig
  rationale: „Sauerteig“ bezeichnet verständlich ein Gär- beziehungsweise Triebmittel und bewahrt zugleich die traditionelle biblische Bildsprache, ohne an moderne industrielle Hefe denken zu lassen.
- source_word: λαβοῦσα γυνὴ
  choice: den eine Frau nahm
  rationale: Das vorzeitige Aoristpartizip wird als natürliche deutsche Folge zweier Handlungen wiedergegeben; γυνή ist in diesem Gleichnis unbestimmt als „eine Frau“ zu übersetzen.
- source_word: ἔκρυψεν
  choice: verbarg
  rationale: Die Wiedergabe folgt der Grundbedeutung „verbergen“ und bewahrt die auffällige Bildsprache des griechischen Textes; die sachlich naheliegende Bedeutung „untermischen“ wird in einer Fußnote genannt.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: unter drei Maß Mehl
  rationale: „unter“ entspricht im Deutschen dem Einbringen in die Mehlmenge; „drei Maß“ hält die antike Maßeinheit im Haupttext allgemein verständlich und erklärt sie in der Fußnote genauer.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die einfache temporale Konjunktion gibt den griechischen Ausdruck idiomatisch und vollständig wieder.
- source_word: ἐζυμώθη ὅλον
  choice: bis alles durchsäuert war
  rationale: Das Passiv und der umfassende Sinn von ὅλον werden knapp bewahrt. „Durchsäuert“ beschreibt, dass die ganze Menge vom Sauerteig erfasst wurde, ohne ausdrücklich einen im Griechischen nicht genannten „Teig“ einzufügen.
theological_decisions:
- issue: Symbolische Bedeutung des Sauerteigs
  choice: Das Bild wird neutral als „Sauerteig“ wiedergegeben, ohne seine Bedeutung ausdrücklich positiv oder negativ zu deuten.
  alternative: Den Sauerteig aufgrund anderer Bibelstellen negativ deuten oder ihn ausdrücklich als positives Bild für das Wachstum beziehungsweise die Durchdringungskraft des Reiches Gottes erklären.
  rationale: Der Vers selbst formuliert ein Gleichnis und lässt die Bildwirkung sprechen. Die Übersetzung soll keine über den Wortlaut hinausgehende theologische Wertung eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, knappem Gleichnisstil. Die ungewöhnliche Formulierung „verbarg“ bleibt wegen ihrer Nähe zum griechischen Wortlaut erhalten; die idiomatische Backbedeutung wird in der Fußnote erläutert.
