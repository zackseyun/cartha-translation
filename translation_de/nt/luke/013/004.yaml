source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: de
  text: 'Oder jene achtzehn, auf die der Turm in Siloah fiel und sie tötete: Meint ihr, dass sie schuldiger waren als alle anderen Menschen, die in Jerusalem wohnen?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schuldner“. Gemeint sind hier wahrscheinlich Menschen, die moralische Schuld auf sich geladen haben; sinngemäß auch: „schuldigere Menschen“ oder „schlimmere Sünder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet im fortlaufenden Argument ein weiteres Beispiel ein und bewahrt den rhetorischen Anschluss.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: jene achtzehn
  rationale: Gibt Demonstrativpronomen, Artikel und Zahl natürlich wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Substantiv hinzuzufügen.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: der Turm in Siloah fiel
  rationale: Bewahrt das einfache Verb ‚fallen‘ und gibt den Ortsnamen in der im Deutschen gebräuchlichen Form wieder.
- source_word: ἀπέκτεινεν αὐτούς
  choice: sie tötete
  rationale: Das feminine Pronomen nimmt grammatisch korrekt auf ‚der Turm‘ als Subjekt des koordinierten Verbs Bezug; ‚tötete‘ ist schlicht und nicht justiziell gefärbt.
- source_word: δοκεῖτε ὅτι
  choice: Meint ihr, dass
  rationale: Natürliche moderne Wiedergabe der direkten rhetorischen Frage.
- source_word: ὀφειλέται
  choice: Schuldner
  rationale: Bewahrt die von Lukas gewählte Schuldmetapher und unterscheidet sie von der ausdrücklichen Bezeichnung als ‚Sünder‘ im vorhergehenden Vers.
- source_word: ἐγένοντο
  choice: waren
  rationale: Im Deutschen ist bei der vergleichenden Zuschreibung ‚waren‘ idiomatischer als das missverständliche ‚wurden‘; der Sinn von γίνομαι wird hier kontextgemäß wiedergegeben.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: größere Schuldner ... als alle anderen Menschen
  rationale: Macht den durch παρά ausgedrückten Vergleich idiomatisch deutlich; ‚andere‘ ist im Deutschen für die Vergleichsgruppe sachlich vorausgesetzt.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: die in Jerusalem wohnen
  rationale: Gibt das präsentische Partizip verständlich und mit seinem fortdauernden Bewohnersinn wieder.
theological_decisions:
- issue: Bedeutung von ὀφειλέται im Kontext
  choice: größere Schuldner
  alternative: schuldigere Menschen; schlimmere Sünder
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich moralische Schuld vor Gott. Die Hauptfassung erhält dennoch Lukas’ eigenständige Schuldner-Metapher, statt sie mit dem Wort ‚Sünder‘ aus Vers 2 gleichzusetzen; die Fußnote erläutert den Sinn.
- issue: Generischer Bezug von ἀνθρώπους
  choice: Menschen
  alternative: Leute; Männer
  rationale: Der Ausdruck umfasst hier allgemein die Einwohner Jerusalems; ‚Menschen‘ gibt diesen generischen Bezug ohne unbegründete Beschränkung auf männliche Personen wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewohnte, aber theologisch bedeutsame Schuldner-Metapher bleibt erhalten und wird durch eine knappe Fußnote erschlossen. Die Satzstellung folgt dem rhetorischen Charakter der Frage, ohne griechische Strukturen unnatürlich nachzuahmen.
