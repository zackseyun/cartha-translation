  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: de
  text: Jerusalem, Jerusalem, die du die Propheten tötest und die steinigst, die zu dir gesandt sind[a] – wie oft wollte ich deine Kinder sammeln, wie eine Henne ihre Küken unter ihren Flügeln sammelt[b], doch ihr habt nicht gewollt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Jerusalem, Jerusalem, die die Propheten tötet und die zu ihr Gesandten steinigt.“ Die griechischen Präsenspartizipien beschreiben Jerusalem durch seinen charakteristischen Umgang mit den Gesandten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Vogel seine Brut unter seinen Flügeln sammelt“. Das griechische Wort ὄρνις kann allgemeiner „Vogel“ bedeuten; das mütterliche Bild macht „Henne“ hier jedoch besonders naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: Die Wiederholung des Ortsnamens bleibt als eindringliche, klagende Anrede erhalten.
- source_word: ἡ ἀποκτείνουσα … καὶ λιθοβολοῦσα
  choice: die du … tötest und … steinigst
  rationale: Die substantivierten Präsenspartizipien kennzeichnen Jerusalem durch sein wiederholtes beziehungsweise charakteristisches Handeln. Eine Relativkonstruktion ist im Deutschen natürlicher und bewahrt die direkte Anrede.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: die zu dir gesandt sind
  rationale: Die Form ist ein passives Perfektpartizip. Die deutsche Wiedergabe erhält sowohl den passiven Sinn als auch den Bezug auf das direkt angeredete Jerusalem.
- source_word: ποσάκις ἠθέλησα ἐπισυνάξαι
  choice: wie oft wollte ich … sammeln
  rationale: Die Formulierung gibt Häufigkeit, persönlichen Willen und die sammelnde Bewegung klar und idiomatisch wieder.
- source_word: τὰ τέκνα σου
  choice: deine Kinder
  rationale: Die bildhafte Rede von Jerusalem als Mutterstadt bleibt bestehen, ohne den Kreis der Gemeinten interpretierend einzuengen.
- source_word: ὄρνις
  choice: eine Henne
  rationale: Das Wort kann allgemein einen Vogel bezeichnen; im Bild eines Muttertiers, das seine Jungen unter den Flügeln sammelt, ist „Henne“ die naheliegende und anschauliche Wiedergabe.
- source_word: τὴν ἑαυτῆς νοσσιὰν
  choice: ihre Küken
  rationale: νοσσιά bezeichnet hier die Brut beziehungsweise die jungen Vögel. „Küken“ passt im Deutschen natürlich zum gewählten Bild der Henne.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: doch ihr habt nicht gewollt
  rationale: Der Plural des griechischen Verbs wird ausdrücklich bewahrt. „Doch“ bringt den schmerzlichen Gegensatz zum Willen Jesu natürlich zum Ausdruck.
theological_decisions:
- issue: Bezug von „deine Kinder“
  choice: Die metaphorische Formulierung „deine Kinder“ bleibt ohne nähere Bestimmung erhalten.
  alternative: „deine Einwohner“ oder eine ausdrückliche Gleichsetzung mit dem Volk Israel
  rationale: Der griechische Text personifiziert Jerusalem als Mutterstadt. Eine Konkretisierung würde eine Auslegungsentscheidung in den Text eintragen.
- issue: Wechsel von der singularischen Anrede Jerusalems zum pluralischen „ihr“
  choice: „zu dir / deine“ und anschließend „ihr habt nicht gewollt“
  alternative: Den gesamten Satz grammatisch an eine einheitliche singularische oder pluralische Anrede angleichen
  rationale: Der auffällige Numeruswechsel steht im griechischen Text selbst und lässt Jerusalem als Stadt sowie die angesprochenen Menschen zugleich hervortreten. Diese Spannung soll nicht geglättet werden.
- issue: Willensgegensatz in ἠθέλησα / ἠθελήσατε
  choice: „wollte ich … ihr habt nicht gewollt“
  alternative: „ich sehnte mich danach … ihr habt euch geweigert“ oder eine dogmatisch ausgeweitete Paraphrase
  rationale: Die parallele Willenssprache wird bewahrt, ohne daraus über den Vers hinausgehende Aussagen über göttlichen und menschlichen Willen abzuleiten.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, klagendem Ton. Der Gedankenstrich markiert die emotionale Wendung vom Vorwurf zur sehnsüchtigen Klage. Die direkte Anrede klingt im Deutschen natürlich, während der bedeutungsvolle Wechsel vom Singular zum Plural erhalten bleibt.
