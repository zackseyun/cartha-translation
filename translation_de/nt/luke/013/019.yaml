  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: de
  text: Es gleicht einem Senfkorn, das ein Mann nahm und in seinen Garten warf. Es wuchs und wurde zu einem Baum[a], und die Vögel des Himmels[b] ließen sich in seinen Zweigen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurde zu einem Baum“. Damit bleibt das stark vergrößerte Wachstumsbild des Gleichnisses erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist der sichtbare Himmel; traditionell: „die Vögel der Luft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Es gleicht
  rationale: Die knappe deutsche Vergleichsformel ist natürlich und gibt die im Kontext auf das Reich Gottes bezogene feminine Form ohne unnötige Ergänzung wieder.
- source_word: κόκκῳ σινάπεως
  choice: einem Senfkorn
  rationale: „Senfkorn“ ist die übliche und genaue deutsche Bezeichnung für den kleinen Samen.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: das ein Mann nahm
  rationale: Die männliche Einzelfigur des Gleichnisses bleibt erhalten; das Partizip wird idiomatisch als finites Verb wiedergegeben.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: in seinen Garten warf
  rationale: „Warf“ bewahrt die Anschaulichkeit von βάλλω; „Garten“ gibt κῆπος genauer wieder als „Feld“. „Säte“ wäre eine erklärende Deutung.
- source_word: ηὔξησεν
  choice: Es wuchs
  rationale: Dies ist die schlichte und natürliche Wiedergabe des Wachstums.
- source_word: ἐγένετο εἰς δένδρον
  choice: wurde zu einem Baum
  rationale: Die Formulierung erhält das ausdrücklich genannte und auffällig vergrößerte Bild des griechischen Textes.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Die Wendung bildet τοῦ οὐρανοῦ eng ab und ist in würdigem modernem Deutsch verständlich; gemeint ist hier der sichtbare Himmel.
- source_word: κατεσκήνωσεν
  choice: nisteten
  rationale: Im Zusammenhang mit Vögeln und Zweigen bringt „nisteten“ das Sich-Niederlassen beziehungsweise Lagern anschaulich und idiomatisch zum Ausdruck.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: in seinen Zweigen
  rationale: „Zweige“ gibt κλάδοις natürlich wieder; das Possessivpronomen bezieht sich auf den Baum.
theological_decisions:
- issue: Geschlechtliche Wiedergabe von ἄνθρωπος
  choice: ein Mann
  alternative: jemand / ein Mensch
  rationale: Der Text zeichnet eine einzelne männliche Gleichnisfigur; die Übersetzung neutralisiert diese konkrete Darstellung nicht.
- issue: Bild von δένδρον im Senfkorngleichnis
  choice: Baum
  alternative: große Pflanze / Strauch
  rationale: δένδρον bedeutet ausdrücklich „Baum“. Die möglicherweise übersteigerte Bildsprache wird bewahrt und nicht botanisch geglättet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gleichnisstil. Die Satzfolge bewahrt die fortschreitende Bewegung des griechischen Textes; ein Punkt nach „warf“ verhindert im Deutschen eine schwerfällige Kette, ohne den Gedankengang zu verändern.
