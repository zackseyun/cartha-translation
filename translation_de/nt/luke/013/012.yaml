source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: de
  text: 'Als Jesus sie aber sah, sprach er sie an und sagte zu ihr: »Frau, du bist von deiner Schwäche befreit[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bist von deinem Leiden befreit worden.«'
    reason: Die Alternative macht sowohl den vollzogenen passiven Vorgang von ἀπολέλυσαι als auch die im Kontext mögliche Bedeutung »Leiden« von ἀσθένεια deutlicher.
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Als Jesus sie aber sah
  rationale: Das Aoristpartizip ἰδών wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben. δέ erscheint als zurückhaltendes »aber«, das die Fortführung mit leichter Gegenüberstellung markiert.
- source_word: προσεφώνησεν
  choice: rief er sie zu sich
  rationale: προσφωνέω bezeichnet hier das direkte Anrufen beziehungsweise Herbeirufen der Frau. »Rief er sie zu sich« gibt Jesu Initiative im Kontext natürlich wieder, ohne dem Verb einen schärferen Ton zu verleihen.
- source_word: εἶπεν αὐτῇ
  choice: und sagte zu ihr
  rationale: Die ausdrückliche Wiedergabe des Dativobjekts bewahrt die Struktur des griechischen Satzes und klingt im Deutschen trotz des vorausgehenden Herbeirufens natürlich.
- source_word: Γύναι
  choice: Frau
  rationale: Der Vokativ ist eine direkte und in diesem Zusammenhang respektvolle Anrede. »Frau« bleibt nah am griechischen Wortlaut, ohne zusätzliche Vertraulichkeit oder einen besonderen gesellschaftlichen Rang einzutragen.
- source_word: ἀπολέλυσαι
  choice: du bist … befreit
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Befreiung mit gegenwärtigem Ergebnis. Die deutsche Zustandsform »du bist befreit« bringt besonders den nun bestehenden Zustand idiomatisch zum Ausdruck.
- source_word: τῆς ἀσθενείας σου
  choice: von deiner Schwäche
  rationale: ἀσθένεια kann Schwäche, Krankheit oder Gebrechen bezeichnen. »Schwäche« erhält die Breite des Ausdrucks und vermeidet eine moderne medizinische Festlegung.
theological_decisions:
- issue: Art des Leidens der Frau bei ἀσθένεια
  choice: Schwäche
  alternative: Leiden, Krankheit oder Gebrechen
  rationale: Der Zusammenhang zeigt ein körperliches Leiden, doch das griechische Wort legt keine genaue medizinische Diagnose fest. Die breite Wiedergabe bewahrt diese Offenheit.
- issue: Zeitlicher Aspekt von ἀπολέλυσαι
  choice: du bist … befreit
  alternative: du bist … befreit worden
  rationale: Beide Wiedergaben können das griechische Perfekt Passiv vertreten. Die Hauptfassung hebt den gegenwärtigen Ergebniszustand hervor; die Alternative betont stärker den vollzogenen Vorgang.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Anrede bleibt knapp und feierlich; diagnostische oder konfessionell geprägte Zusätze werden vermieden.
