review_pass:
  verdict: revise
  source_fidelity: 'Die vier Himmelsrichtungen, das Futur von ἥκω und »Reich Gottes« sind zutreffend wiedergegeben. Das Mahlbild von ἀνακλιθήσονται soll erhalten bleiben. »Sich zum Mahl niederlegen« ist jedoch im heutigen Deutsch missverständlich: Es bezeichnet eher das Hinlegen zum Ruhen als die antike Tischhaltung.'
  naturalness: Die Richtungsangaben und die Satzführung sind flüssig. »Sich zu Tisch legen« ist als bewusst historisch-konkrete Formulierung für das Liegen bei Tisch verständlicher und idiomatischer als »sich zum Mahl niederlegen«; die Fußnote erklärt die kulturelle Bedeutung.
  terminology: »Reich Gottes« ist die etablierte, sachgerechte Wiedergabe von βασιλεία τοῦ θεοῦ. Die Fußnote wahrt das konkrete Bankettbild und bietet »bei Tisch Platz nehmen« nur als sinngemäße, nicht gleich präzise Alternative.
  issues:
