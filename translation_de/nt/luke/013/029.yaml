id: LUK.13.29
reference: Luke 13:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: de
  text: Und sie werden von Osten und Westen, von Norden und Süden kommen und sich im Reich Gottes zu Tisch legen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist das in der Antike übliche Liegen zu Tisch bei einem Festmahl; sinngemäß auch: »bei Tisch Platz nehmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: sie werden kommen
  rationale: Das Futur von ἥκω bezeichnet hier das Kommen beziehungsweise Eintreffen; »kommen« passt natürlich zu den anschließenden Herkunftsangaben.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: von Osten und Westen
  rationale: Die Pluralformen bezeichnen wörtlich Aufgänge und Untergänge und dienen idiomatisch als Himmelsrichtungen. Die artikellose deutsche Wendung ist natürlich und präzise.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: von Norden und Süden
  rationale: Die beiden weiteren Himmelsrichtungen vervollständigen den umfassenden geografischen Horizont, ohne eine bestimmte Volksgruppe ausdrücklich zu benennen.
- source_word: ἀνακλιθήσονται
  choice: sie werden sich zum Mahl niederlegen
  rationale: Das Verb bezeichnet im Kontext eines Mahls das damals übliche Niederlegen beziehungsweise Liegen zu Tisch. Die Formulierung bewahrt das konkrete Festmahlbild und die Fußnote erklärt den kulturellen Hintergrund.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Dies ist die geläufige und transparente deutsche Wiedergabe, die den theologischen und eschatologischen Gehalt von βασιλεία τοῦ θεοῦ ohne Zusatz bewahrt.
theological_decisions:
- issue: Festmahlbild im eschatologischen Reich
  choice: Das Niederlegen zum Mahl wird ausdrücklich beibehalten.
  alternative: »Platz nehmen« oder lediglich »im Reich Gottes sein«
  rationale: Der griechische Ausdruck zeichnet ein konkretes Bild der Teilnahme am Festmahl. Eine allgemeinere Formulierung würde dieses Bild abschwächen; weitere dogmatische Einzelheiten werden nicht ergänzt.
- issue: Umfassender geografischer Horizont
  choice: Die vier Himmelsrichtungen werden unverändert wiedergegeben.
  alternative: Die Kommenden ausdrücklich als Menschen aus allen Völkern oder als Nichtjuden bestimmen
  rationale: Die Formulierung signalisiert eine Sammlung aus allen Richtungen, benennt im Vers selbst jedoch keine ethnische Gruppe. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung lässt das gemeinsame Prädikat »kommen« nach den vier Himmelsrichtungen folgen und klingt dadurch im Deutschen flüssig. »Zum Mahl niederlegen« ist bewusst konkreter als »Platz nehmen«; die Fußnote erschließt das antike Tischbild.
