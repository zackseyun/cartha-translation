    text: 'Gemeint ist das in der Antike übliche Liegen zu Tisch bei einem Festmahl; sinngemäß auch: »bei Tisch Platz nehmen«.'
    reason: lexical_alternative
  revision_rationale: Die Revision beschränkt sich auf die Wiedergabe von ἀνακλιθήσονται und deren Erläuterung. Sie vermeidet die moderne Fehlassoziation von »niederlegen«, erhält aber das konkrete Bild des eschatologischen Festmahls, ohne es weiter auszudeuten.
