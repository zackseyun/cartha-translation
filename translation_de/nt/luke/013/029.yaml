    issue: Missverständliche Wiedergabe von ἀνακλιθήσονται
    rationale: »Sich zum Mahl niederlegen« klingt im modernen Standarddeutsch nach Hinlegen zum Ausruhen oder Schlafen und bezeichnet nicht klar das Liegen bei Tisch. »Sich zu Tisch legen« bewahrt die antike Mahlpraxis präziser.
  revised_text: Und sie werden von Osten und Westen, von Norden und Süden kommen und sich im Reich Gottes zu Tisch legen[a].
