id: LUK.13.33
reference: Luke 13:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: de
  text: Doch ich muss heute und morgen und am folgenden Tag[a] meinen Weg weitergehen; denn es kann nicht sein[b], dass ein Prophet außerhalb Jerusalems umkommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »heute und morgen und am folgenden Tag« kann idiomatisch einen kurzen, festgesetzten Ablauf bezeichnen und muss nicht genau drei Kalendertage meinen.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »es ist nicht möglich« oder »es ist undenkbar«. Die Aussage kann rhetorisch und ironisch gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert den nachdrücklichen Gegensatz beziehungsweise die Einschränkung gegenüber dem Vorhergehenden und klingt im modernen Deutschen natürlich.
- source_word: δεῖ με
  choice: ich muss
  rationale: Gibt die von δεῖ ausgedrückte Notwendigkeit knapp und idiomatisch wieder, ohne deren Ursprung ausdrücklich festzulegen.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: heute und morgen und am folgenden Tag
  rationale: Bewahrt die dreigliedrige zeitliche Abfolge des Griechischen; eine mögliche idiomatische Verwendung wird in der Fußnote offengehalten.
- source_word: πορεύεσθαι
  choice: meinen Weg weitergehen
  rationale: Bringt sowohl das Gehen als auch die im Kontext erkennbare Fortsetzung des Weges zum Ausdruck.
- source_word: ὅτι
  choice: denn
  rationale: Leitet im Deutschen flüssig die Begründung für die zuvor genannte Notwendigkeit ein.
- source_word: οὐκ ἐνδέχεται
  choice: es kann nicht sein
  rationale: Bewahrt die Aussage von Unmöglichkeit beziehungsweise Ungehörigkeit und lässt zugleich den wahrscheinlich ironisch-proverbialen Ton offen.
- source_word: προφήτην
  choice: ein Prophet
  rationale: Der artikellose Singular ist generisch zu verstehen und erhält so den sprichwortartigen Charakter.
- source_word: ἀπολέσθαι
  choice: umkommt
  rationale: Bezeichnet hier den Tod beziehungsweise das Verderben eines Propheten, ohne die genaue Todesursache stärker festzulegen als der griechische Ausdruck.
- source_word: ἔξω Ἰερουσαλήμ
  choice: außerhalb Jerusalems
  rationale: Gibt die räumliche Aussage direkt und präzise wieder.
theological_decisions:
- issue: Sinn der Aussage, ein Prophet könne nicht außerhalb Jerusalems umkommen
  choice: Als Aussage »es kann nicht sein« wiedergegeben, die Unmöglichkeit beziehungsweise Ungehörigkeit ausdrückt, ohne sie als absolute metaphysische Behauptung festzulegen.
  alternative: '»Es ist undenkbar« oder stärker ironisch: »Ein Prophet kann doch nicht außerhalb Jerusalems umkommen.«'
  rationale: οὐκ ἐνδέχεται kann sachliche Unmöglichkeit, Ungehörigkeit oder rhetorische Undenkbarkeit bezeichnen. Die Formulierung wahrt diese Spannung und lässt die prophetische Ironie hörbar, ohne sie zur alleinigen Deutung zu machen.
- issue: Zeitangabe »heute und morgen und am folgenden Tag«
  choice: Die dreigliedrige Folge bleibt im Haupttext ausdrücklich erhalten.
  alternative: Als unbestimmte kurze Frist oder festgesetzten Weg sinngemäß zusammenzufassen.
  rationale: Die Wendung kann idiomatisch sein, doch der griechische Text nennt die drei Zeitstufen ausdrücklich. Die mögliche idiomatische Funktion wird deshalb nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Gedankengang; das Semikolon macht die Begründungsstruktur gut lesbar. »Meinen Weg weitergehen« vermeidet ein bloßes, kontextarmes »gehen«, während »umkommt« den tödlichen Ausgang klar bezeichnet, ohne ausdrücklich »getötet wird« zu setzen.
