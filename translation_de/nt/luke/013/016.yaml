id: LUK.13.16
reference: Luke 13:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: de
  text: Musste da nicht diese Frau, die doch eine Tochter Abrahams ist und die der Satan – seht! – seit achtzehn Jahren gebunden hält, am Sabbat von dieser Fessel befreit werden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: eine Tochter Abrahams
  rationale: Die wörtliche und im Deutschen verständliche Wendung bewahrt die Zugehörigkeit der Frau zum Bundesvolk sowie Jesu Hervorhebung ihrer Würde.
- source_word: ἰδού
  choice: seht!
  rationale: Der ausdrücklich vorhandene Aufmerksamkeitsruf wird bewahrt und natürlich als eingeschobener Ausruf wiedergegeben.
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: achtzehn Jahre lang
  rationale: Gibt Zahl und Zeitdauer idiomatisch und vollständig wieder.
- source_word: λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου
  choice: von dieser Fessel befreit werden
  rationale: Bewahrt das Bild von Binden und Lösen; „Fessel“ bezeichnet hier den bedrückenden Zustand, nicht notwendig einen materiellen Strick.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: am Sabbat
  rationale: Natürliches modernes Deutsch; der Zeitbezug bleibt vollständig erhalten.
theological_decisions:
- issue: Satans Verursachung des Leidens
  choice: die der Satan … gebunden hatte
  alternative: die Satan … gefesselt hielt
  rationale: Die aktive Zuschreibung des griechischen Textes wird ohne Abschwächung oder zusätzliche Erklärung bewahrt.
- issue: Rhetorische Notwendigkeit der Befreiung am Sabbat
  choice: Musste da nicht … befreit werden?
  alternative: Sollte sie da nicht … befreit werden?
  rationale: οὐκ ἔδει drückt eine erwartete, moralisch angemessene Notwendigkeit aus. „Musste … nicht“ wahrt die Kraft der rhetorischen Frage, ohne eine konfessionelle Deutung einzuführen.
- issue: Bedeutung von „Tochter Abrahams“
  choice: unverändert als „Tochter Abrahams“
  alternative: Angehörige des Volkes Abrahams
  rationale: Die bildhafte und theologisch gewichtige Formulierung bleibt offen genug, um ihre möglichen Dimensionen von Abstammung, Bundeszugehörigkeit und Würde nicht vorschnell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hebt wie der griechische Satz „diese Frau“ und ihre Stellung als Tochter Abrahams hervor. Gedankenstriche markieren den parenthetischen Aufmerksamkeitsruf, ohne den langen Fragesatz unverständlich zu machen.
