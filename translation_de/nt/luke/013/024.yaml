source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: de
  text: Ringt darum, durch die enge Tür[a] hineinzugehen! Denn viele, sage ich euch, werden versuchen hineinzugehen und es nicht können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das enge Tor“. Im griechischen Text des Lukas steht „Tür“ (θύρα), während die Parallele bei Matthäus „Tor“ verwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Ringt darum
  rationale: Der Imperativ bezeichnet ernsthaften, entschlossenen Einsatz. „Ringt darum“ bewahrt die Kraft des griechischen Ausdrucks, ohne die Aussage als Verdienstlehre auszudeuten.
- source_word: εἰσελθεῖν
  choice: hineinzugehen
  rationale: Der Infinitiv von εἰσέρχομαι wird in beiden Vorkommen sinngleich wiedergegeben. „Hineingehen“ ist im Deutschen natürlich und passt zum Bild einer Tür.
- source_word: διὰ τῆς στενῆς θύρας
  choice: durch die enge Tür
  rationale: θύρα bedeutet gewöhnlich „Tür“, während στενή ihre Enge bezeichnet. Die Wiedergabe folgt bewusst dem Wortlaut des Lukas und nicht dem in Matthäus verwendeten Ausdruck für „Tor“.
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι leitet hier die Begründung der Aufforderung ein. „Denn“ gibt diesen Zusammenhang in würdigem, natürlichem Deutsch wieder.
- source_word: πολλοί
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird direkt und verständlich mit „viele“ wiedergegeben.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Die eingeschobene Wortfolge bewahrt die Hervorhebung des griechischen Redeeinschubs und klingt im Deutschen natürlich.
- source_word: ζητήσουσιν
  choice: werden versuchen
  rationale: ζητέω bedeutet grundsätzlich „suchen“, bezeichnet in dieser Konstruktion mit einem Infinitiv jedoch das Bestreben oder den Versuch, etwas zu tun. „Werden versuchen“ ist hier klares modernes Deutsch und bleibt schwächer als das eindringliche „Ringt darum“.
- source_word: οὐκ ἰσχύσουσιν
  choice: es nicht können
  rationale: ἰσχύω bezeichnet hier die Fähigkeit oder Kraft, das angestrebte Ziel zu erreichen. „Es nicht können“ gibt dies knapp wieder, ohne den Grund ihres Unvermögens näher festzulegen.
theological_decisions:
- issue: Menschliches Ringen und das Hineingehen
  choice: Die nachdrückliche Aufforderung „Ringt darum“ bleibt stehen, ohne sie durch eine Erklärung über Verdienst, Werke oder Heilsordnung abzuschwächen.
  alternative: „Bemüht euch“ oder „Versucht“ wären weniger eindringlich und könnten den Gegensatz zum späteren bloßen Versuch verwischen.
  rationale: Der Vers verbindet eine ernsthafte Aufforderung mit der Warnung, dass viele zwar den Eintritt versuchen, ihn aber nicht vermögen. Diese Spannung wird bewahrt, ohne Fragen nach menschlicher Verantwortung, göttlichem Handeln oder Verdienst systematisch zu entscheiden.
- issue: Grund des späteren Unvermögens
  choice: „es nicht können“ lässt offen, weshalb die Vielen nicht hineingehen können.
  alternative: „es nicht schaffen“ könnte stärker bloßes Scheitern betonen; „nicht stark genug sein“ würde die körperliche Kraftmetapher überzeichnen.
  rationale: Der griechische Text stellt das Unvermögen fest, erläutert an dieser Stelle aber nicht dessen genaue Ursache. Die Übersetzung soll diese Offenheit erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Ringt darum“ trägt die Dringlichkeit des Imperativs; die übrige Satzführung bleibt klar und ohne unnötige Archaismen.
