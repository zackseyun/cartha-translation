  source_fidelity: Die Übersetzung gibt den gegenwärtigen Imperativ Ἀγωνίζεσθε mit „Ringt darum“ nachdrücklich wieder und bewahrt den Zweckinfinitiv „durch die enge Tür hineinzugehen“. „Denn“ gibt die begründende Funktion von ὅτι treffend wieder. „Viele, sage ich euch“ entspricht dem Einschub πολλοί, λέγω ὑμῖν. „werden versuchen hineinzugehen und es nicht können“ gibt ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν sachgemäß wieder; insbesondere bleibt der Grund des Unvermögens offen.
  naturalness: Das Deutsch ist modernes Standarddeutsch und trotz des würdigen Tons klar. „Ringt darum“ ist als eindringliche Aufforderung idiomatisch; die Wiederaufnahme „es nicht können“ ist verständlich und vermeidet eine überdeutende Umschreibung wie „nicht Erfolg haben“.
  terminology: „Tür“ entspricht θύρα und wird zu Recht nicht im Haupttext durch „Tor“ ersetzt. Die Fußnote dokumentiert die mögliche deutsche Alternative sowie den lexikalischen Unterschied zur matthäischen Parallele präzise. „Enge Tür“ und „hineingehen“ sind für das Bildfeld stimmig.
