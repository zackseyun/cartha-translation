  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: de
  text: Nein, sage ich euch; aber wenn ihr nicht umkehrt, werdet ihr alle ebenso[a] umkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ähnliche Weise“. „Ebenso“ kann ein vergleichbares, plötzliches Gericht meinen, ohne unbedingt dieselbe Todesart zu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Nein
  rationale: Gibt die nachdrückliche Verneinung der vorausgesetzten Annahme natürlich und ohne zusätzliche Verstärkung wieder.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Bewahrt die direkte Anrede und die im Lukasevangelium häufige emphatische Redeformel in natürlichem Deutsch.
- source_word: ἀλλ’
  choice: sondern
  rationale: Nach der ausdrücklichen Verneinung markiert „sondern“ den scharfen Gegensatz im Deutschen genauer als ein bloßes „aber“.
- source_word: ἐὰν μὴ
  choice: wenn ihr nicht
  rationale: Gibt die negative Bedingung transparent wieder; „es sei denn, dass“ wäre schwerfälliger.
- source_word: μετανοῆτε
  choice: umkehrt
  rationale: Bezeichnet hier eine grundlegende Sinnes- und Lebenswendung vor Gott, nicht nur eine intellektuelle Meinungsänderung. „Umkehrt“ ist verständlich, würdig und bewahrt den biblischen Handlungscharakter.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt den umfassenden Bezug auf sämtliche Angesprochenen.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Erhält den Vergleich mit dem zuvor geschilderten Geschehen, ohne vorschnell eine völlig identische Todesart festzulegen.
- source_word: ἀπολεῖσθε
  choice: werdet … umkommen
  rationale: Bewahrt die Bedeutung des drohenden Verderbens beziehungsweise Untergangs, ohne sie ausschließlich auf den körperlichen Tod oder ausdrücklich auf ewige Verdammnis einzuengen.
theological_decisions:
- issue: Bedeutungsumfang von μετανοέω
  choice: „umkehrt“
  alternative: „euer Denken ändert“ / „Buße tut“
  rationale: Der Kontext meint mehr als bloße gedankliche Revision; zugleich vermeidet „umkehrt“ kirchlichen Fachjargon und lässt die umfassende Hinwendung zu Gott erkennen.
- issue: Bedeutungsumfang von ἀπολεῖσθε
  choice: „werdet … umkommen“
  alternative: „werdet sterben“ / „werdet vernichtet werden“ / „werdet ewig verdammt werden“
  rationale: Das griechische Verb warnt vor kommendem Gericht, bestimmt hier aber dessen genaue Art und Reichweite nicht vollständig. Die Übersetzung bewahrt diese Spannung.
- issue: Art des durch ὁμοίως ausgedrückten Vergleichs
  choice: „ebenso“ mit Fußnote
  alternative: „auf dieselbe Weise“
  rationale: Der Vergleich kann ein entsprechendes Gericht oder einen ähnlich unvermittelten Untergang bezeichnen, ohne zwingend eine identische Todesweise zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. „Umkehrt“ vermeidet sowohl eine rein intellektuelle Verengung als auch unnötigen theologischen Fachwortschatz. Die Wortstellung hält „alle“ eng beim angesprochenen Personenkreis und bewahrt den eindringlichen Warncharakter.
