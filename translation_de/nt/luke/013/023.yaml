  text: εἶπεν δέ τις αὐτῷ· Κύριε, εἰ ὀλίγοι οἱ σῳζόμενοι; ὁ δὲ εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: de
  text: 'Da sagte jemand zu ihm: „Herr[a], sind es nur wenige, die gerettet werden?“[b] Er aber sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Anrede „Herr“ kann hier auch als höflich-respektvolle Anrede verstanden werden; wie gewichtig der Titel gemeint ist, lässt der griechische Wortlaut offen.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Sind wenige diejenigen, die gerettet werden?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Da / aber
  rationale: Das erste δέ führt die Erzählung unaufdringlich weiter und wird idiomatisch mit „Da“ wiedergegeben; das zweite markiert den Übergang zu Jesu Antwort und erscheint als „aber“.
- source_word: τις
  choice: jemand
  rationale: Das Indefinitpronomen bezeichnet eine nicht näher bestimmte Person; „jemand“ ist die natürliche deutsche Entsprechung.
- source_word: εἶπεν … αὐτῷ
  choice: fragte ihn
  rationale: Da die direkte Rede eine Frage ist, gibt „fragte ihn“ den Sprechakt im Deutschen natürlicher wieder als das formalere „sagte zu ihm“.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ wahrt sowohl die Möglichkeit einer respektvollen Anrede als auch eine stärkere, christologisch bedeutsame Titelfunktion.
- source_word: εἰ ὀλίγοι
  choice: sind es nur wenige
  rationale: εἰ leitet hier eine Entscheidungsfrage ein. „Nur wenige“ bringt den in der Frage liegenden Gedanken einer begrenzten Zahl natürlich zum Ausdruck.
- source_word: οἱ σῳζόμενοι
  choice: die gerettet werden
  rationale: Die substantivierte Präsens-Passiv-Partizipialform wird als Relativsatz wiedergegeben. So bleiben der passive Sinn und die prozessuale beziehungsweise gegenwärtige Perspektive erhalten.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: 'Die Pluralform wird ausdrücklich beibehalten: Jesus richtet seine Antwort nicht nur an den einzelnen Fragesteller, sondern an eine Mehrzahl Anwesender.'
theological_decisions:
- issue: Bedeutungsumfang der Anrede κύριε
  choice: Herr
  alternative: mein Herr; Herr im Sinn von „mein Herr/Sir“
  rationale: Der griechische Ausdruck kann eine höfliche Anrede oder einen theologisch gewichtigen Titel darstellen. „Herr“ lässt diese Spannung offen, ohne die Anrede auf bloße Höflichkeit zu reduzieren.
- issue: Aspekt und Passiv von οἱ σῳζόμενοι
  choice: die gerettet werden
  alternative: die gerettet sind; die Rettung finden
  rationale: Die gewählte Form bewahrt das Passiv und vermeidet es, den gegenwärtigen Aspekt als ausschließlich abgeschlossenen Zustand oder als bestimmtes theologisches Rettungsmodell festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Frage wird idiomatisch mit „fragte“ eingeleitet; die abschließende Formulierung bleibt offen, weil Jesu Antwort erst im folgenden Vers beginnt.
