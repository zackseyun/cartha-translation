lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: lehrte er
  rationale: Die Verbindung aus Imperfekt von εἰμί und Partizip Präsens bildet eine periphrastische Imperfektform und beschreibt eine andauernde Tätigkeit in der Vergangenheit. Das schlichte deutsche Imperfekt „lehrte“ gibt dies natürlich wieder. δέ markiert hier lediglich den Fortgang der Erzählung und braucht im Deutschen kein eigenes Wort.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: in einer der Synagogen
  rationale: Die partitive Wendung bedeutet wörtlich „in einer der Synagogen“. „Synagoge“ bewahrt die konkrete jüdische Einrichtung als Schauplatz.
- source_word: ἐν τοῖς σάββασιν
  choice: an einem Sabbat
  rationale: Obwohl σάββασιν formal im Plural steht, kann die Form idiomatisch einen einzelnen Sabbat bezeichnen. Der unbestimmte Singular passt hier natürlich zum erzählerischen Zusammenhang; die formale Pluralmöglichkeit wird in der Fußnote bewahrt.
