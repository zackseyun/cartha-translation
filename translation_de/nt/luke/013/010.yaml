  language: de
  text: An einem Sabbat lehrte er in einer der Synagogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Sabbaten“; im Griechischen steht eine Pluralform, die häufig idiomatisch für den einzelnen Sabbat gebraucht wird.'
