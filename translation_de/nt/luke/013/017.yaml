- from: Während er dies sagte, wurden alle, die sich ihm widersetzten,[a] beschämt; und die ganze Menge freute sich über all die herrlichen Taten,[b] die er vollbrachte.
  to: Während er dies sagte, wurden alle, die sich ihm widersetzten,[a] beschämt; und die ganze Menge freute sich über all die herrlichen Dinge,[b] die er tat.
  rationale: Die einzige inhaltliche Anpassung ersetzt die einengende Wiedergabe „herrliche Taten“ durch „herrliche Dinge“. Dadurch bleibt der breite Bezug von τοῖς ἐνδόξοις erhalten, ohne den Kontext einer Heilung auszublenden oder eine bestimmte Kategorie von Handlungen einzutragen. „Die er tat“ gibt die durch ὑπ’ αὐτοῦ ausgedrückte unmittelbare Urheberschaft idiomatisch wieder.
