  naturalness: Die Formulierung ist insgesamt modernes, natürliches Standarddeutsch. „Während er dies sagte“ und „wurden ... beschämt“ sind gut verständlich und dem erzählerischen Register angemessen. Die revidierte Schlussformulierung bleibt flüssig.
