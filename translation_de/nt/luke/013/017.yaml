source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: de
  text: Während er dies sagte, wurden alle, die sich ihm widersetzten,[a] beschämt; und die ganze Menge freute sich über all die herrlichen Dinge,[b] die er tat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle seine Gegner“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „all die großartigen Dinge“ oder „all die wunderbaren Dinge“. Der griechische Ausdruck kann machtvolle Taten einschließen, legt sich aber nicht ausdrücklich auf Wunder fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Während er dies sagte
  rationale: Der Genitivus absolutus mit präsentischem Partizip bezeichnet eine gleichzeitig ablaufende Handlung. „Während“ erhält diesen durativen Zusammenhang.
- source_word: κατῃσχύνοντο
  choice: wurden … beschämt
  rationale: Die passive Wiedergabe bewahrt sowohl die öffentliche Bloßstellung als auch den imperfektischen Verlauf bzw. eintretenden Zustand.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: alle, die sich ihm widersetzten
  rationale: Die verbale Form gibt die aktive und fortdauernde Gegnerschaft deutlicher wieder als das knappe Substantiv „Gegner“.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menge
  rationale: Dies ist eine natürliche deutsche Wiedergabe des singularischen Kollektivausdrucks und bezeichnet die Menge als Ganzes.
- source_word: ἔχαιρεν
  choice: freute sich
  rationale: Das Imperfekt bezeichnet hier anhaltende Freude; im Deutschen kann dies idiomatisch durch das Präteritum ausgedrückt werden.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: über all die herrlichen Taten
  rationale: „Über“ gibt den Anlass bzw. Gegenstand der Freude wieder. „Herrlich“ bewahrt den Bedeutungsgehalt von ἔνδοξος; „Taten“ ist im Kontext natürlicher als „Dinge“, ohne die Aussage ausdrücklich auf Wunder einzuengen.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: die er vollbrachte
  rationale: Die aktive deutsche Formulierung gibt die durch ὑπό bezeichnete Urheberschaft Jesu klar und idiomatisch wieder. Sie vermeidet das schwerfällige „die von ihm getan wurden“.
theological_decisions:
- issue: Art der „herrlichen“ Geschehnisse
  choice: „herrliche Taten“ statt einer ausdrücklichen Festlegung auf Wunder
  alternative: „wunderbare Dinge“ oder „Wundertaten“
  rationale: Der Zusammenhang schließt eine Heilung ein, doch ἔνδοξος bezeichnet allgemein Herrliches, Glanzvolles oder Ruhmwürdiges. Die gewählte Fassung lässt den Umfang der Aussage offen.
- issue: Urheberschaft in ὑπ’ αὐτοῦ
  choice: „die er vollbrachte“
  alternative: „die durch ihn geschahen“
  rationale: Ὑπό mit dem Genitiv kennzeichnet hier Jesus unmittelbar als Handelnden. Die Übersetzung wahrt diese Aussage, ohne eine bloß mittelbare Urheberschaft nahezulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das Semikolon macht den Kontrast zwischen der Beschämung der Gegner und der Freude der Menge deutlich. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
