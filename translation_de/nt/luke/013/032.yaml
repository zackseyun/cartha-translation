source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Geht und sagt diesem Fuchs: ›Sieh, ich treibe heute und morgen Dämonen aus und vollbringe Heilungen, und am dritten Tag werde ich ans Ziel gebracht.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werde ich vollendet«, »erreiche ich mein Ziel« oder »vollende ich meinen Weg«. Das griechische Wort kann ausdrücken, dass etwas zum Ziel oder zur Vollendung gebracht wird; wahrscheinlich ist die Vollendung des Jesus aufgetragenen Weges gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: Fuchs
  rationale: Das konkrete Tierbild bleibt erhalten; „diesem Fuchs“ gibt auch das Demonstrativ ταύτῃ und den geringschätzigen Ton wieder, ohne die Metapher als „schlau“ auszudeuten.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: „Sieh“ ist ein knapper, würdiger Aufmerksamkeitsruf und bewahrt die hinweisende Funktion des griechischen Ausdrucks.
- source_word: ἐκβάλλω δαιμόνια
  choice: ich treibe Dämonen aus
  rationale: Dies ist im modernen Deutschen die natürliche und in den Evangelien geläufige Wendung für Exorzismen; die Kraft von ἐκβάλλω bleibt erhalten.
- source_word: ἰάσεις ἀποτελῶ
  choice: ich vollbringe Heilungen
  rationale: „Heilungen“ gibt ἰάσεις konkret wieder; „vollbringe“ bewahrt gegenüber dem vorherigen „treibe … aus“ die eigene verbale Aussage von ἀποτελῶ und klingt natürlicher als „vollende Heilungen“.
- source_word: σήμερον καὶ αὔριον
  choice: heute und morgen
  rationale: Die wörtliche Zeitfolge bleibt bestehen und lässt zugleich die mögliche idiomatische Bedeutung einer kurzen, bestimmten Frist offen.
- source_word: τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Die Ergänzung „Tag“ ist im Deutschen die klare idiomatische Wiedergabe des temporal gebrauchten Ordinals.
- source_word: τελειοῦμαι
  choice: werde ich ans Ziel gebracht
  rationale: Die Formulierung bewahrt sowohl das Passiv als auch den Gedanken des Vollendens beziehungsweise Zielerreichens, ohne die Aussage ausdrücklich auf Tod, Auferstehung oder moralische Vervollkommnung festzulegen.
theological_decisions:
- issue: Bedeutung von τελειοῦμαι im Blick auf Jesu Sendung und einen möglichen Hinweis auf Tod und Auferstehung
  choice: werde ich ans Ziel gebracht
  alternative: werde ich vollendet; erreiche ich mein Ziel; vollende ich meinen Weg
  rationale: Das griechische Passiv kann Vollendung oder das Erreichen des Ziels bezeichnen. Die gewählte Fassung hält den Bezug auf die Vollendung von Jesu bestimmtem Auftrag offen und legt nicht ausdrücklich fest, ob hier besonders Tod, Auferstehung oder Verherrlichung gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das Tierbild und die dreigliedrige Zeitangabe bleiben nah am Griechischen; die Schlussformulierung wahrt bewusst dessen Mehrdeutigkeit.
