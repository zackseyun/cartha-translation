id: LUK.13.11
reference: Luke 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: de
  text: Und siehe, da war eine Frau, die seit achtzehn Jahren einen Geist der Schwäche[a] hatte. Sie war gebeugt und konnte sich nicht vollständig aufrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „einen krankmachenden Geist“ oder „einen Geist der Krankheit“. Im Griechischen steht ausdrücklich „Geist“; dies kann auf eine geistliche Einwirkung bei ihrem Leiden hinweisen.'
    reason: Die Alternativen verdeutlichen die mögliche Beziehung zwischen „Geist“ und „Schwäche“, ohne die im Griechischen bestehende Offenheit einseitig aufzulösen.
lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Die Aufmerksamkeitspartikel wird mit dem im biblischen Erzählstil weiterhin verständlichen „siehe“ wiedergegeben; so bleibt die lebhafte Einführung erhalten, ohne dem Satz ein bloß umgangssprachliches „schau“ zu geben.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Die Frau wird an dieser Stelle neu und unbestimmt in die Erzählung eingeführt.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: einen Geist der Krankheit hatte
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf einen „Geist“ und gibt ἀσθένεια im körperlichen Zusammenhang natürlich als „Krankheit“ wieder, ohne die Art geistlicher Einwirkung näher festzulegen.
- source_word: ἔτη δεκαοκτώ
  choice: seit achtzehn Jahren
  rationale: „Seit“ drückt im Deutschen natürlich aus, dass der Zustand achtzehn Jahre zuvor begonnen hatte und bis zum erzählten Zeitpunkt andauerte.
- source_word: συγκύπτουσα
  choice: gebeugt
  rationale: Das Wort bezeichnet ihre anhaltend nach vorn gebeugte Körperhaltung; „gebeugt“ ist klar und vermeidet die stärkere Ausdeutung „zusammengekrümmt“.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: konnte sich nicht aufrichten
  rationale: Die Wiedergabe drückt sowohl das Unvermögen als auch die Rückkehr in eine aufrechte Haltung aus.
- source_word: εἰς τὸ παντελές
  choice: vollständig
  rationale: Das adverbiale Gefüge verstärkt die Aussage über ihr Unvermögen und wird präzise mit „vollständig“ wiedergegeben.
theological_decisions:
- issue: Ob πνεῦμα ἀσθενείας so wiedergegeben werden soll, dass der geistliche Aspekt der Erkrankung entfällt
  choice: Den ausdrücklichen Bezug auf „einen Geist“ im Haupttext beibehalten
  alternative: „an einer Krankheit litt“ oder deutender „einen krank machenden Geist hatte“
  rationale: Der griechische Text nennt ausdrücklich πνεῦμα. „Geist der Krankheit“ bewahrt diese Aussage, legt aber weder förmliche Besessenheit noch eine bestimmte Art dämonischer Verursachung fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Siehe“ erhält die hervorhebende Wirkung von ἰδοὺ; die übrige Syntax ist bewusst schlicht und gegenwärtig.
