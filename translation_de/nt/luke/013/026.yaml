  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: de
  text: 'Dann werdet ihr anfangen zu sagen: »Wir haben in deiner Gegenwart gegessen und getrunken, und auf unseren Straßen[a] hast du gelehrt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf unseren öffentlichen Plätzen«; das griechische Wort kann breite Straßen oder offene öffentliche Plätze innerhalb einer Ortschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die Abfolge im Geschehen; „Dann“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: ἄρξεσθε λέγειν
  choice: werdet ihr anfangen zu sagen
  rationale: Die Verbindung aus dem Futur von ἄρχομαι und dem ergänzenden Infinitiv λέγειν wird ingressiv wiedergegeben; so bleibt der Aspekt des Einsetzens der Rede erhalten.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Wir haben ... gegessen und getrunken
  rationale: Das Perfekt ist in direkter Rede idiomatisches modernes Deutsch für die erinnerte gemeinsame Mahlzeit und gibt die beiden Aoristformen einheitlich wieder.
- source_word: ἐνώπιόν σου
  choice: vor deinen Augen
  rationale: Die Wendung bezeichnet Anwesenheit und persönliche Nähe, ohne eine von Jesus anerkannte Gemeinschaft zu unterstellen. „Vor deinen Augen“ ist verständlich und bewahrt den appellativen Ton.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: auf unseren Straßen
  rationale: πλατεῖαι kann breite Straßen, öffentliche Verkehrswege oder offene Plätze einer Stadt bezeichnen. „Auf unseren Straßen“ ist natürlich und hält die örtlich-öffentliche Bedeutung hinreichend offen; die Alternative wird in einer Fußnote genannt.
- source_word: ἐδίδαξας
  choice: hast du gelehrt
  rationale: Das deutsche Perfekt gibt in der direkten Rede den zurückliegenden Vorgang natürlich wieder und wahrt die Aussage, dass dort öffentlich gelehrt wurde.
theological_decisions:
- issue: Charakter der Berufung auf die Nähe zu Jesus
  choice: 'Die Sprecher berufen sich auf äußere Nähe: Sie aßen und tranken vor seinen Augen, und er lehrte öffentlich an ihrem Ort.'
  alternative: Eine freiere Wiedergabe könnte eine von Jesus anerkannte Tischgemeinschaft oder rettende Beziehung nahelegen.
  rationale: Der griechische Text berichtet die Behauptung der Sprecher, ohne ihre Folgerung zu bestätigen. Die Übersetzung bewahrt diese Spannung und vermeidet es, aus räumlich-sozialer Nähe eine anerkannte Heilsbeziehung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne umgangssprachlich zu wirken. Das Perfekt entspricht dem natürlichen deutschen Erzählgebrauch innerhalb direkter Rede.
