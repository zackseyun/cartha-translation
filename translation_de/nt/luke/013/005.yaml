  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: de
  text: Nein, ich sage euch; aber wenn ihr nicht umkehrt, werdet ihr alle ebenso umkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dieselbe Weise umkommen“. Das griechische Wort für „ebenso“ kann im Licht der vorhergehenden Beispiele auf eine vergleichbare Art des Gerichts hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Nein
  rationale: Direkte, nachdrückliche Verneinung der im vorangehenden Zusammenhang vorausgesetzten Frage; im modernen Deutsch natürlich und prägnant.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Bewahrt die geläufige lukanische Formel in natürlichem, würdigem Deutsch.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: 'vielmehr: Wenn … nicht'
  rationale: Gibt sowohl den scharfen Gegensatz von ἀλλά als auch die negative Bedingung wieder; die Doppelpunktkonstruktion klingt im Deutschen natürlicher als eine wörtlichere Fassung.
- source_word: μετανοῆτε
  choice: umkehrt
  rationale: Bezeichnet hier die Umkehr zu Gott und vermeidet eine Verengung auf bloßes Bedauern oder eine rein gedankliche Meinungsänderung.
- source_word: πάντες
  choice: alle
  rationale: Bezieht die Warnung ausdrücklich und umfassend auf sämtliche Angesprochenen.
- source_word: ὡσαύτως
  choice: ebenso
  rationale: Bewahrt die Vergleichsaussage, ohne festzulegen, ob vor allem Art, Gewissheit oder Gericht gemeint ist.
- source_word: ἀπολεῖσθε
  choice: umkommen
  rationale: Gibt die ernste Bedeutung von Untergang und Verderben wieder, ohne sie auf den bloßen körperlichen Tod zu reduzieren.
theological_decisions:
- issue: Bedeutung der Umkehr in Jesu Warnung
  choice: μετανοῆτε mit „umkehrt“ wiedergeben
  alternative: bereut; ändert eure Gesinnung
  rationale: „Umkehrt“ trägt den biblischen Sinn einer Neuausrichtung auf Gott, ohne den Ausdruck auf Gefühle, Gedanken oder eine ausgearbeitete Bekehrungslehre zu beschränken.
- issue: Aussage von ὡσαύτως ἀπολεῖσθε
  choice: „ebenso umkommen“
  alternative: „auf dieselbe Weise umkommen“
  rationale: Die Fassung erhält die offene Vergleichsbeziehung zu den vorherigen Beispielen und entscheidet nicht vorschnell, worin genau die Entsprechung besteht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, direktem Warnruf. „Umkehrt“ ist allgemein verständlich und theologisch gehaltvoll; „umkommen“ bewahrt die Schwere der Aussage. Der Fußnotenmarker steht unmittelbar nach dem Satz.
