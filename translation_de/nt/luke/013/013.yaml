  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: de
  text: Und er legte ihr die Hände auf, und sofort wurde sie aufgerichtet[a], und sie verherrlichte Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie richtete sich auf“; auch: „sie wurde geradegerichtet“.'
    reason: Lexikalische und grammatische Alternativen für das Passiv ἀνωρθώθη.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: legte ihr die Hände auf
  rationale: Die feste deutsche Wendung gibt die konkrete Handlung und den Dativ αὐτῇ natürlich wieder. Der bestimmte Artikel ist im Deutschen bei dieser Konstruktion idiomatisch; ein ergänztes „seine“ ist nicht nötig.
- source_word: παραχρῆμα
  choice: sofort
  rationale: „Sofort“ bewahrt die zeitliche Unmittelbarkeit und klingt in modernem Deutsch natürlich.
- source_word: ἀνωρθώθη
  choice: richtete sie sich auf
  rationale: Das Verb bezeichnet im Kontext die Wiederherstellung der zuvor gebeugten Frau in eine aufrechte Haltung. Die deutsche reflexive Form ist idiomatisch, ohne daraus eine Heilung aus eigener Kraft abzuleiten; das griechische Passiv bleibt in der Fußnote sichtbar.
- source_word: ἐδόξαζεν
  choice: pries
  rationale: „Pries Gott“ ist eine natürliche und würdige deutsche Wiedergabe von δοξάζω. Der Imperfekt beschreibt ihre einsetzende beziehungsweise fortdauernde Reaktion; im deutschen Erzählstil genügt hier das Präteritum.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Standardmäßige Wiedergabe des direkten Objekts.
theological_decisions:
- issue: Art der durch ἀνωρθώθη beschriebenen Wiederherstellung
  choice: „richtete sie sich auf“ als körperliche Wiederherstellung in eine aufrechte Haltung
  alternative: „wurde aufgerichtet“ oder „wurde gerade“
  rationale: Der unmittelbare Zusammenhang handelt von der gebeugten Frau. Die Formulierung bezeichnet die sichtbare körperliche Wiederherstellung, ohne den griechischen Passiv über seine grammatische Aussage hinaus ausdrücklich als göttliches Passiv auszulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die kurzen Hauptsätze spiegeln die rasche Abfolge des griechischen Textes; „pries Gott“ wahrt den biblisch-theologischen Gehalt, ohne altertümlich zu wirken.
