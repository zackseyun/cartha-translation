source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: de
  text: 'Nun erzählte er dieses Gleichnis: »Jemand hatte einen Feigenbaum, der in seinem Weinberg gepflanzt war. Er kam und suchte an ihm Frucht, fand aber keine.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: erzählte
  rationale: Der Imperfekt eröffnet hier die Gleichniserzählung. Das deutsche Präteritum ist in erzählender Prosa natürlich; »erzählen« passt idiomatisch zu einem Gleichnis.
- source_word: δὲ
  choice: Dann
  rationale: δέ ist ein schwaches Bindewort. »Dann« markiert den Fortgang des Diskurses, ohne einen starken zeitlichen Schluss aufzuzwingen.
- source_word: παραβολήν
  choice: Gleichnis
  rationale: »Gleichnis« ist die etablierte und sachlich genaue deutsche Bezeichnung für eine solche bildhafte Lehrgeschichte.
- source_word: Συκῆν
  choice: einen Feigenbaum
  rationale: Das Substantiv bezeichnet eindeutig einen Feigenbaum.
- source_word: εἶχέν τις
  choice: Jemand hatte
  rationale: τις ist ein unbestimmtes Pronomen. »Jemand« gibt seine Offenheit unmittelbar wieder und vermeidet eine unnötige Festlegung auf »ein Mann«.
- source_word: πεφυτευμένην
  choice: gepflanzt
  rationale: Das Perfekt Passiv beschreibt den Feigenbaum als gepflanzt und weiterhin dort stehend. Im Deutschen lässt sich dies natürlich mit »hatte … gepflanzt« ausdrücken.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: in seinem Weinberg
  rationale: ἀμπελών bedeutet »Weinberg«; αὐτοῦ bezeichnet ihn als Eigentum des unbestimmten Besitzers.
- source_word: ἦλθεν ζητῶν
  choice: Er kam und suchte
  rationale: Die Verbindung von Aorist und präsentischem Partizip bezeichnet das Kommen samt begleitender beziehungsweise zielgerichteter Suche. Die deutsche Reihung ist klar und natürlich.
- source_word: καρπὸν
  choice: Frucht
  rationale: Der Singular »Frucht« entspricht dem griechischen Kollektivgebrauch und bewahrt die mögliche bildhafte Resonanz.
- source_word: ἐν αὐτῇ
  choice: an ihm
  rationale: Obwohl ἐν wörtlich »in« bedeutet, sagt man im Deutschen idiomatisch, dass Frucht »an« einem Baum wächst oder gesucht wird.
- source_word: οὐχ εὗρεν
  choice: fand aber keine
  rationale: »Keine« nimmt »Frucht« grammatisch und inhaltlich wieder auf. »Aber« macht den im Griechischen durch καί verbundenen negativen Ergebnissatz im Deutschen natürlich verständlich.
theological_decisions:
- issue: Unbestimmtes Subjekt τις im Gleichnis
  choice: Jemand
  alternative: Ein Mann
  rationale: Das Griechische bestimmt weder Geschlecht noch gesellschaftliche Rolle der Figur ausdrücklich. »Jemand« bewahrt diese Unbestimmtheit, ohne theologische Identifikation einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; der parabolische Charakter bleibt schlicht und unkommentiert.
