  verdict: revise
  source_fidelity: 'Die aktive Formulierung »Jemand hatte ... einen Feigenbaum gepflanzt« gibt das perfektische Passiv πεφυτευμένην nicht angemessen wieder: Sie besagt, dass die Person den Baum selbst gepflanzt hatte. Der griechische Text beschreibt dagegen einen Feigenbaum als bereits in seinem Weinberg gepflanzt. Die Revision gibt diesen bestehenden passiven Zustand wieder. »Nun« ist als schwacher diskursiver Anschluss für δέ weniger zeitlich-stark als »Dann«.'
  naturalness: Die revidierte Fassung ist modernes, klares Standarddeutsch. Der Relativsatz ist hier die natürlichste Weise, den passiven Zustandscharakter ohne unidiomatische Partizipialfügung auszudrücken.
  terminology: »Gleichnis«, »Feigenbaum«, »Weinberg« und »Frucht« sind sachlich und im biblischen Register etabliert. »Jemand« bewahrt die geschlechtlich unbestimmte Referenz von τις.
