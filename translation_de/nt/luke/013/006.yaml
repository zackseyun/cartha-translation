    rationale: »Jemand hatte ... einen Feigenbaum gepflanzt« macht den unbestimmten Besitzer zum Ausführenden des Pflanzens. πεφυτευμένην ist ein perfektes Passiv und kennzeichnet den Baum als gepflanzt; eine Verursachung oder eigene Pflanzhandlung des Besitzers wird nicht behauptet.
  - severity: low
    issue: »Dann« für δέ
    rationale: »Dann« kann einen deutlicheren zeitlich-sequenziellen Anschluss nahelegen, als das schwache griechische Bindewort δέ verlangt. »Nun« fungiert im Deutschen natürlicher als bloßer Erzählanschluss.
