id: LUK.13.15
reference: Luke 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: de
  text: 'Doch der Herr antwortete ihm: »Ihr Heuchler! Bindet nicht jeder von euch am Sabbat seinen Ochsen oder Esel von der Futterkrippe[a] los, führt ihn weg und tränkt ihn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Futtertrog«. Das griechische Wort φάτνη kann einen Futterplatz oder Futtertrog bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: der Herr
  rationale: Bewahrt den lukanischen Erzähltitel für Jesus und dessen christologisches Gewicht, ohne ihn erläuternd zu erweitern.
- source_word: Ὑποκριταί
  choice: Ihr Heuchler!
  rationale: Gibt den scharfen pluralischen Vokativ als direkte, im Deutschen natürliche Anrede wieder.
- source_word: ἕκαστος ὑμῶν
  choice: jeder von euch
  rationale: Erhält die distributive Aussage über jeden einzelnen Angesprochenen.
- source_word: τῷ σαββάτῳ
  choice: am Sabbat
  rationale: Ist die übliche und knappe deutsche Wiedergabe des temporalen Dativs.
- source_word: λύει
  choice: bindet … los
  rationale: Passt konkret zu einem angebundenen Tier und ist im modernen Deutsch anschaulich.
- source_word: βοῦν … ἢ τὸν ὄνον
  choice: Ochsen oder Esel
  rationale: Bewahrt die beiden landwirtschaftlichen Tierbezeichnungen in ihrer herkömmlichen, verständlichen Form.
- source_word: φάτνης
  choice: Futterkrippe
  rationale: Bezeichnet hier natürlich den Futterplatz beziehungsweise Trog, von dem das Tier losgebunden wird.
- source_word: ἀπαγαγὼν
  choice: führt ihn weg
  rationale: Gibt das vorgeordnete Partizip als koordinierte Handlung wieder und bewahrt die Abfolge.
- source_word: ποτίζει
  choice: tränkt ihn
  rationale: Ist die präzise und natürliche deutsche Bezeichnung dafür, einem Tier Wasser zu geben.
theological_decisions:
- issue: Erzähltitel κύριος für Jesus
  choice: der Herr
  alternative: der Meister
  rationale: „Der Herr“ bewahrt den Titelcharakter und die mögliche christologische Tragweite in Lukas; „der Meister“ würde den Sinn unnötig auf eine soziale Rolle verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der scharfe Tadel bleiben erhalten. Das einleitende καὶ εἶπεν wird nicht zusätzlich mit „und sagte“ wiederholt, weil „antwortete“ im Deutschen die anschließende direkte Rede natürlich einführt; der Aussagegehalt bleibt gewahrt.
