source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: de
  text: 'Sobald der Hausherr aufgestanden ist und die Tür geschlossen hat, werdet ihr anfangen, draußen zu stehen und an die Tür zu klopfen und zu sagen: »Herr[a], mach uns die Tür auf!« Dann wird er euch antworten: »Ich kenne euch nicht; ich weiß nicht, woher ihr kommt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch κύριε; im Rahmen des Gleichnisses kann die Anrede auch im Sinn von »Hausherr« oder »mein Herr« verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Wenn … erst
  rationale: Die unbestimmte Zeitkonstruktion bezeichnet den Zeitpunkt, nach dessen Eintreten das Folgende gilt. „Wenn … erst“ klingt im Deutschen natürlich und hebt zugleich den dann nicht mehr rückgängig zu machenden Wendepunkt hervor.
- source_word: ἐγερθῇ
  choice: aufgestanden ist
  rationale: Gemeint ist hier das Aufstehen des Hausherrn, nicht eine Auferstehung. Das Perfekt fügt sich natürlich in den deutschen Temporalsatz ein.
- source_word: οἰκοδεσπότης
  choice: Hausherr
  rationale: „Hausherr“ gibt sowohl den Bezug zum Haus als auch die Autoritätsstellung knapp und in gegenwärtigem Standarddeutsch wieder.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: die Tür geschlossen hat
  rationale: ἀποκλείω bezeichnet das Schließen beziehungsweise Absperren. „Geschlossen“ wahrt den Bildvorgang, ohne ausdrücklich ein Abschließen mit einem Schlüssel hinzuzufügen.
- source_word: ἄρξησθε ἔξω ἑστάναι καὶ κρούειν
  choice: ihr dann draußen steht und … klopft
  rationale: Das einsetzende Verhalten nach dem Schließen wird durch „dann“ und die koordinierten Verben idiomatisch ausgedrückt. Ein wörtliches „anfangt, draußen zu stehen“ wäre im Deutschen schwerfällig.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche Entsprechung und bewahrt sowohl die Anrede innerhalb des Gleichnisses als auch einen möglichen weitergehenden lukanischen Anklang.
- source_word: ἄνοιξον ἡμῖν
  choice: mach uns auf
  rationale: Diese feste deutsche Wendung bedeutet in diesem Zusammenhang eindeutig, die Tür für die Wartenden zu öffnen, und erhält den knappen, dringlichen Ton der Bitte.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: wird er euch antworten
  rationale: Die griechische Verbindung aus Partizip und finitem Verb wird im Deutschen natürlich mit einem einzigen Verb wiedergegeben.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Ich weiß nicht, woher ihr seid
  rationale: Die Formulierung gibt den gesamten griechischen Satz in natürlichem Deutsch wieder. Die syntaktisch mögliche stärkere Absetzung von „euch“ wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung der Anrede κύριε im Gleichnis
  choice: Herr
  alternative: Hausherr; mein Herr
  rationale: „Herr“ vermeidet eine vorschnelle Festlegung darauf, ob die Anrede nur höflich beziehungsweise sozial oder zugleich theologisch mitschwingend zu verstehen ist.
- issue: Syntaktische Reichweite von οὐκ οἶδα in οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Ich weiß nicht, woher ihr seid
  alternative: Ich kenne euch nicht – woher ihr seid
  rationale: Die gewählte Fassung versteht ὑμᾶς zusammen mit πόθεν ἐστέ als Inhalt des Nichtwissens und ist idiomatisches Deutsch. Da die griechische Wortfolge auch die Zurückweisung „Ich kenne euch nicht“ stärker hervortreten lassen kann, wird diese Spannung nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich; „mach uns auf“ ist idiomatisch, ohne salopp zu wirken. Die Satzführung erhält die sich steigernde Abfolge von Aufstehen, Schließen, Draußenstehen, Klopfen und Zurückweisung.
