  naturalness: „Sobald ... werdet ihr anfangen“ ist modernes, gut lesbares Standarddeutsch und gibt die Folge der Handlungen klar wieder. „Mach uns die Tür auf!“ ist als direkte, dringliche Bitte idiomatischer und eindeutiger als „Mach uns auf!“.
  terminology: „Hausherr“ und „Herr“ sind angemessen. Bei οὐκ οἶδα ὑμᾶς πόθεν ἐστέ macht „Ich kenne euch nicht; ich weiß nicht, woher ihr kommt“ die explizite Anrede und die Herkunftsfrage verständlich, ohne eine dogmatische Deutung festzulegen.
