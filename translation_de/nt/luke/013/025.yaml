- from: 'Wenn der Hausherr erst aufgestanden ist und die Tür geschlossen hat und ihr dann draußen steht und an die Tür klopft und sagt: »Herr[a], mach uns auf!«, wird er euch antworten: »Ich weiß nicht, woher ihr seid.«[b]'
  to: 'Sobald der Hausherr aufgestanden ist und die Tür geschlossen hat, werdet ihr anfangen, draußen zu stehen und an die Tür zu klopfen und zu sagen: »Herr[a], mach uns die Tür auf!« Dann wird er euch antworten: »Ich kenne euch nicht; ich weiß nicht, woher ihr kommt.«'
  rationale: Die Revision stellt den durch ἄρξησθε bezeichneten Beginn der vergeblichen Reaktion wieder her, macht die direkte Bitte im Deutschen vollständig und gibt sowohl das explizite „euch“ als auch die Frage nach der Herkunft in der Zurückweisung wieder. Die Fußnote zur mehrdeutigen Anrede bleibt erhalten; eine Fußnote zur zuvor ausgelassenen Anrede ist nach der Revision nicht mehr erforderlich.
