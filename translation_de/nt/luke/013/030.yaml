  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: de
  text: 'Und seht: Es gibt Letzte, die Erste sein werden, und es gibt Erste, die Letzte sein werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: seht
  rationale: Das moderne Aufmerksamkeitssignal gibt die hinweisende Diskursfunktion von ἰδού natürlich wieder; das traditionellere „siehe“ wäre im heutigen Deutsch weniger geläufig.
- source_word: ἔσχατοι
  choice: Letzte
  rationale: „Letzte“ bewahrt die knappe Aussage über Stellung oder Rang und den unmittelbaren Gegensatz zu πρῶτοι, ohne daraus ausdrücklich eine moralische Wertung zu machen.
- source_word: πρῶτοι
  choice: Erste
  rationale: „Erste“ ist das direkte, idiomatische Gegenstück zu „Letzte“ und erhält die prägnante Umkehrung.
- source_word: οἳ ἔσονται
  choice: die … sein werden
  rationale: Der Relativsatz mit dem Futur von εἰμί wird klar und unmittelbar als zukünftige Zuschreibung wiedergegeben.
- source_word: εἰσὶν
  choice: es gibt
  rationale: Die deutsche Existenzformel entspricht der griechischen Aussage und lässt die substantivierten Adjektive „Letzte“ und „Erste“ stehen, ohne ausdrücklich ein zusätzliches „manche“ einzufügen.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion wird am Satzanfang und zwischen den beiden parallelen Gliedern beibehalten.
theological_decisions:
- issue: Reichweite der Umkehraussage
  choice: Die Aussage bleibt allgemein und spricht lediglich von der Umkehrung zwischen Letzten und Ersten.
  alternative: Die Letzten und Ersten ausdrücklich als Heiden und Juden, Demütige und Stolze oder bestimmte Ranggruppen im Endgericht bestimmen.
  rationale: Der Kontext betrifft den Eintritt in Gottes Reich und lässt mehrere Bezüge zu; der griechische Wortlaut selbst legt jedoch keine einzelne Gruppe ausdrücklich fest.
translation_notes:
  register: Knapper, würdevoller und zugleich gegenwärtiger Bibelstil. Der Doppelpunkt macht die hinweisende Funktion von „seht“ sichtbar und wahrt den aphoristischen Parallelismus.
