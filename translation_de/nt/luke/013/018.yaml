  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: de
  text: 'Daraufhin sagte er: „Womit ist das Reich Gottes[a] vergleichbar, und womit soll ich es vergleichen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Herrschaft Gottes“; damit wird stärker betont, dass Gott regiert.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sagte er
  rationale: Der griechische Imperfekt kann fortlaufendes oder wiederholtes Reden bezeichnen; im Deutschen ist hier das narrative Präteritum idiomatischer, ohne dass der Kontext einen ausdrücklichen Verlaufsaspekt verlangt.
- source_word: οὖν
  choice: Daraufhin
  rationale: Der Ausdruck kennzeichnet die Fortführung beziehungsweise Folgerung aus dem vorhergehenden Zusammenhang. „Daraufhin“ bewahrt diesen Anschluss in natürlichem Deutsch.
- source_word: Τίνι ... ὁμοία ἐστὶν
  choice: Womit ist ... vergleichbar
  rationale: Die Formulierung gibt die griechische Vergleichsfrage präzise und idiomatisch wieder.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte deutsche Wiedergabe und kann sowohl Gottes Herrschaft als auch deren Wirkungsbereich bezeichnen.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden parallelen Fragen.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: womit soll ich es vergleichen
  rationale: Das Futur hat hier deliberativ-rhetorische Kraft. „Soll ich“ ist dafür im modernen Deutschen natürlicher als eine wörtliche Zukunftsform.
theological_decisions:
- issue: Wiedergabe von βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  alternative: die Herrschaft Gottes
  rationale: Der griechische Ausdruck kann sowohl die dynamische Herrschaft Gottes als auch das Reich als Wirkungsbereich bezeichnen. Die traditionelle Formulierung „Reich Gottes“ hält dieses Bedeutungsfeld offen; eine Fußnote weist auf den dynamischen Sinn hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur der beiden rhetorischen Fragen bleibt erhalten; das Pronomen „es“ entspricht dem grammatischen Geschlecht von „Reich“ im Deutschen.
