  source_fidelity: Der Vers ist im Wesentlichen quellentreu. „Womit ist das Reich Gottes vergleichbar?“ gibt Τίνι ὁμοία ἐστὶν angemessen wieder; „womit soll ich es vergleichen?“ bildet die deliberative Frage τίνι ὁμοιώσω αὐτήν natürlich ab. Das narrative Präteritum „sagte“ kann den griechischen Imperfekt ἔλεγεν im Deutschen idiomatisch wiedergeben. „Daraufhin“ ist als Anschluss für οὖν vertretbar, wenn auch etwas stärker zeitlich als rein folgernd.
