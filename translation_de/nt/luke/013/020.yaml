  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: de
  text: 'Und wieder sagte er: »Womit soll ich das Reich Gottes vergleichen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt die schlichte Verknüpfung mit dem vorausgehenden Ausspruch, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung direkt und idiomatisch im modernen Deutschen wieder.
- source_word: εἶπεν
  choice: sagte er
  rationale: Die narrative Aoristform von λέγω leitet hier direkte Rede ein; »sagte er« ist natürlich und präzise.
- source_word: Τίνι
  choice: Womit
  rationale: Der interrogative Dativ fragt im Zusammenhang mit ὁμοιόω nach dem Gegenstand beziehungsweise Bild des Vergleichs; »Womit« ist im Deutschen idiomatischer als »Mit was«.
- source_word: ὁμοιώσω
  choice: soll ich … vergleichen
  rationale: Die Futurform hat in dieser rhetorischen Frage deliberativen Sinn. »Soll ich« bildet diesen natürlicher ab als ein wörtliches »werde ich«.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte deutsche Wendung bewahrt die Bedeutungsbreite von βασιλεία als Gottes Königsherrschaft und Herrschaftsbereich.
theological_decisions:
- issue: Wiedergabe von βασιλεία in einer Aussage über Gottes Herrschaft
  choice: das Reich Gottes
  alternative: die Herrschaft Gottes
  rationale: »Reich Gottes« bewahrt den vertrauten biblischen Schlüsselbegriff und dessen Breite; »Herrschaft Gottes« würde den dynamischen Aspekt deutlicher machen, könnte den Begriff hier aber unnötig verengen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe rhetorische Frage und ihre Verbindung zum vorherigen Gleichniswort bleiben erhalten.
