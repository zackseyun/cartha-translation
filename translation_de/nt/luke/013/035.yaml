  terminology: „Haus“, „im Namen des Herrn“ und „Gesegnet“ sind terminologisch sachgerecht. „Wird euch überlassen“ wahrt das Passiv und kann die ernste, möglicherweise gerichtliche Nuance tragen, ohne sie im Haupttext auszudeuten. Die Fußnoten behandeln die naheliegenden Referenz- und Deutungsfragen zurückhaltend und zutreffend.
