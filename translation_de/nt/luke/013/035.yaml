  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: ἰδού als eindringliches „Seht“, das Passiv ἀφίεται mit dem Dativ ὑμῖν in „wird euch überlassen“, die starke Zukunftsverneinung οὐ μή sowie die offene zeitliche Grenze bis zum Bekenntnis aus Psalm 118,26. Sie ergänzt weder „Tempel“ noch „Jerusalem“ im Haupttext und bewahrt damit die im Ausgangstext vorhandene Offenheit.'
