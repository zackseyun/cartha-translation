id: LUK.13.35
reference: Luke 13:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: de
  text: 'Seht, euer Haus wird euch überlassen.[a][b] Und ich sage euch: Ihr werdet mich ganz gewiss nicht sehen, bis die Zeit kommt, in der ihr sagt:[c] »Gesegnet ist, der im Namen des Herrn kommt!«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wird verlassen“ oder „wird preisgegeben“. Das griechische Passiv kann den Sinn einer gerichtlichen Preisgabe haben.'
    reason: lexical_alternative
  - marker: b
    text: Mit „euer Haus“ ist wahrscheinlich Jerusalem, besonders der Tempel, gemeint; im Griechischen steht jedoch nur „euer Haus“.
    reason: alternative_reading
  - marker: c
    text: Manche beziehen diese Worte auf Jesu Einzug in Jerusalem, andere auf eine künftige Anerkennung Jesu. Der griechische Wortlaut legt keinen bestimmten Zeitpunkt eindeutig fest.
    reason: alternative_reading
  - marker: d
    text: Der Ausspruch greift Psalm 118,26 auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Seht
  rationale: Die pluralische Aufforderung ist im heutigen Deutsch ein natürlicher, eindringlicher Aufmerksamkeitshinweis und bewahrt die feierliche deiktische Funktion.
- source_word: ἀφίεται ὑμῖν
  choice: wird euch überlassen
  rationale: Die Formulierung bewahrt Passiv und Dativ und legt nicht abschließend fest, ob das Verlassen, Preisgeben oder eine gerichtliche Überlassung im Vordergrund steht.
- source_word: ὁ οἶκος ὑμῶν
  choice: euer Haus
  rationale: Dies gibt den griechischen Ausdruck direkt wieder, ohne den wahrscheinlich korporativen Bezug im Haupttext auf Jerusalem oder den Tempel einzuengen.
- source_word: λέγω δὲ ὑμῖν
  choice: Und ich sage euch
  rationale: „Und“ gibt δέ hier als milden Übergang wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: οὐ μὴ ἴδητέ με
  choice: Ihr werdet mich ganz gewiss nicht sehen
  rationale: „Ganz gewiss nicht“ vermittelt die nachdrückliche zukünftige Verneinung von οὐ μή mit Aorist Konjunktiv in natürlichem Deutsch.
- source_word: ἕως ἥξει ὅτε εἴπητε
  choice: bis die Zeit kommt, in der ihr sagt
  rationale: Die idiomatische deutsche Wendung bildet die zeitliche Konstruktion klar ab, ohne den Zeitpunkt oder heilsgeschichtlichen Bezug näher festzulegen.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Gesegnet ist, der … kommt
  rationale: Die Formulierung wahrt den Segensspruch und den substantivierten Partizipialausdruck, ohne ihn ausdrücklich als besonderen Titel auszulegen.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die vertraute biblische Formel entspricht dem Griechischen und bewahrt den Schriftklang.
theological_decisions:
- issue: Bezug von „euer Haus“
  choice: Im Haupttext bleibt die wörtlich weitere Formulierung „euer Haus“ stehen.
  alternative: Jerusalem, der Tempel oder das Haus Israel ausdrücklich nennen
  rationale: Der Zusammenhang legt Jerusalem und besonders den Tempel nahe; der griechische Wortlaut benennt jedoch nur „euer Haus“. Eine genauere Festlegung würde die Auslegung in den Haupttext eintragen.
- issue: Zeitlicher Bezug des abschließenden Ausspruchs
  choice: Die Aussage bleibt als offene zukünftige Grenze formuliert.
  alternative: Sie ausdrücklich auf den Einzug in Jerusalem oder auf eine künftige beziehungsweise endzeitliche Anerkennung Jesu beziehen
  rationale: Der griechische Wortlaut entscheidet nicht eindeutig zwischen diesen Deutungshorizonten. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutungsstärke von ἀφίεται
  choice: „wird euch überlassen“
  alternative: „wird verlassen“ oder „wird preisgegeben“
  rationale: Die gewählte Fassung hält die gerichtliche Nuance offen, ohne sie abzuschwächen oder durch eine stärkere deutsche Deutung verbindlich zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem biblischem Ton. Die Anredeformen im Plural und die emphatische Verneinung bleiben deutlich; interpretative Präzisierungen werden in die Fußnoten verwiesen.
