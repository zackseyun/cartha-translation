  variant: modern standard German
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: de
  text: Und wenn er künftig[a] Frucht bringt – gut. Wenn aber nicht, wirst du ihn fällen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Zusammenhang auch als „im nächsten Jahr“ verstanden; die griechische Wendung lautet wörtlich etwa „für die kommende Zeit“ bzw. „künftig“.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: Und wenn
  rationale: κἄν verbindet καί mit ἐάν und leitet die erste Hälfte einer Gegenüberstellung mit μέν … δέ ein. „Und wenn“ gibt Anschluss und Bedingung natürlich wieder.
- source_word: ποιήσῃ καρπὸν
  choice: er … Frucht bringt
  rationale: ποιέω bedeutet zusammen mit καρπός idiomatisch „Frucht bringen“. Das maskuline Pronomen folgt im Deutschen dem Bezugswort „Feigenbaum“ aus dem Kontext.
- source_word: εἰς τὸ μέλλον
  choice: künftig
  rationale: Die Wendung bezeichnet wörtlich das Kommende beziehungsweise die künftige Zeit. „Künftig“ bewahrt diese zeitliche Offenheit, ohne ausdrücklich „im nächsten Jahr“ einzutragen.
- source_word: εἰ δὲ μήγε
  choice: Wenn aber nicht
  rationale: Die Formulierung gibt den durch δέ markierten Gegensatz und die Verneinung der zuvor genannten Möglichkeit knapp und idiomatisch wieder.
- source_word: ἐκκόψεις αὐτήν
  choice: wirst du ihn fällen
  rationale: ἐκκόπτω bezeichnet hier das Abhauen beziehungsweise Fällen eines Baumes. Das Futur der zweiten Person Singular bleibt erhalten; „ihn“ bezieht sich natürlich auf den Feigenbaum.
theological_decisions:
- issue: Zeitlicher Rahmen des aufgeschobenen Gerichts
  choice: Die offene Zeitangabe wird mit „künftig“ wiedergegeben.
  alternative: „im nächsten Jahr“
  rationale: Der unmittelbare griechische Wortlaut sagt nicht ausdrücklich „im nächsten Jahr“, sondern spricht allgemeiner von der kommenden Zeit. So bleibt die bedingte Frist innerhalb des Gleichnisses erhalten, ohne sie unnötig zu präzisieren.
- issue: Unausgesprochene Folge im ersten Bedingungssatz
  choice: Das knappe „– gut“ macht die im Griechischen ausgesparte positive Folge verständlich und lässt den abgebrochenen Charakter des Satzes erkennen.
  alternative: 'Die Folge vollständig ergänzen, etwa: „dann darf er stehen bleiben“'
  rationale: Der griechische Text nennt keine ausdrückliche Folge zur ersten Bedingung. Eine ausführlichere Ergänzung würde mehr festlegen, als der Wortlaut sagt.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Gleichnissprache. „Frucht bringen“ erhält das landwirtschaftliche Bild; „fällen“ ist für einen Baum präzise und allgemein verständlich. Der Gedankenstrich spiegelt die knappe, im Griechischen nicht ausdrücklich ausgeführte positive Folge.
