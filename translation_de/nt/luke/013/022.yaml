reference: Luke 13:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: de
  text: Jesus zog durch Städte und Dörfer, lehrte dort und setzte seinen Weg nach Jerusalem fort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Jerusalem zu“.'
    reason: Lexikalische Alternative für εἰς; sie hebt die noch andauernde Bewegung in Richtung Jerusalem hervor.
lexical_decisions:
- source_word: διεπορεύετο
  choice: zog durch
  rationale: Der Imperfekt beschreibt eine fortdauernde Reisebewegung. Im Deutschen gibt „zog durch“ diese Bewegung knapp und natürlich wieder.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: durch Städte und Dörfer
  rationale: κατά mit Akkusativ bezeichnet hier die verteilte Bewegung durch mehrere größere und kleinere Orte. „Städte und Dörfer“ bewahrt diese Unterscheidung.
- source_word: διδάσκων
  choice: lehrte dort
  rationale: Das Präsenspartizip bezeichnet die begleitende Tätigkeit während der Reise. „Dort“ macht im Deutschen natürlich deutlich, dass Jesus an den durchreisten Orten lehrte, ohne zusätzliche inhaltliche Angaben einzuführen.
- source_word: πορείαν ποιούμενος
  choice: setzte seinen Weg … fort
  rationale: Die idiomatische Wendung bezeichnet zielgerichtetes Unterwegssein. „Setzte seinen Weg fort“ vermeidet die stilistisch schwerfällige Wiederholung von „reisen“ und gibt den fortlaufenden Charakter wieder.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: εἰς bezeichnet die Richtung beziehungsweise das Ziel der Reise. Das übliche deutsche „nach Jerusalem“ lässt im Kontext offen, ob das unmittelbare Eintreffen oder die fortlaufende Bewegung auf dieses Ziel hin gemeint ist.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Die im Deutschen etablierte Form des Ortsnamens.
theological_decisions:
- issue: Erzählrichtung von Jesu Reise nach Jerusalem
  choice: nach Jerusalem
  alternative: auf Jerusalem zu
  rationale: „Nach Jerusalem“ bezeichnet das Reiseziel, ohne eine bereits erfolgte Ankunft zu behaupten. Die Fußnote hält die stärker direktionale Wiedergabe ausdrücklich offen und bewahrt so die Spannung des lukanischen Reiseberichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Name „Jesus“ wird eingesetzt, weil das im Deutschen sonst missverständliche bloße Pronomen „er“ ohne den vorausgehenden Kontext weniger selbstständig verständlich wäre. Die Satzstruktur bleibt knapp und erzählerisch.
