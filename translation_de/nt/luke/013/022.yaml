  source_fidelity: 'Der Entwurf gibt alle Bestandteile des griechischen Textes zuverlässig wieder: das imperfektische Durchziehen durch verschiedene Orte (διεπορεύετο), die Unterscheidung von Städten und Dörfern, das begleitende Lehren sowie die auf Jerusalem gerichtete Reisebewegung. „Setzte seinen Weg nach Jerusalem fort“ ist für πορείαν ποιούμενος εἰς Ἱεροσόλυμα eine idiomatische, kontextuell passende Wiedergabe und behauptet keine Ankunft.'
  naturalness: Der Satz ist knapp, flüssig und modernes Standarddeutsch. Die Reihung „zog …, lehrte dort und setzte … fort“ ist erzählerisch natürlich. Das ergänzende „dort“ erläutert lediglich die naheliegende räumliche Bezugsgröße der durchquerten Orte und fügt keinen eigenständigen Sachgehalt hinzu.
  terminology: „Städte und Dörfer“ bewahrt die im Ausgangstext vorliegende Ortsunterscheidung. „Jerusalem“ ist die etablierte deutsche Namensform. Die Fußnote bietet mit „auf Jerusalem zu“ eine sachgerechte direktionale Alternative zu „nach Jerusalem“, ohne die Übersetzung unnötig zu dogmatisieren oder eine Ankunft vorwegzunehmen.
