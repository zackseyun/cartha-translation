id: LUK.13.1
reference: Luke 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: de
  text: Zu eben dieser Zeit waren einige Leute da, die ihm von den Galiläern berichteten, deren Blut Pilatus mit ihren Opfern vermischt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vermengt hatte.'
    reason: Lexikalische Alternative für ἔμιξεν; „vermengt“ ist möglich, klingt im heutigen Deutsch jedoch etwas gehobener.
lexical_decisions:
- source_word: Παρῆσαν
  choice: waren ... da
  rationale: Der Imperfekt von πάρειμι bezeichnet hier am natürlichsten die Anwesenheit einiger Personen, ohne ihre Ankunft hervorzuheben.
- source_word: δέ
  choice: nicht eigens wiedergegeben
  rationale: Die schwache weiterführende Funktion wird im Deutschen durch den Beginn des neuen Satzes und die Zeitangabe ausreichend getragen; ein ausdrückliches „aber“ würde einen stärkeren Gegensatz nahelegen.
- source_word: τινες
  choice: einige Leute
  rationale: Die unbestimmte Mehrzahl wird in verständlichem modernem Deutsch wiedergegeben; „Leute“ verdeutlicht den Personenbezug.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: zu eben dieser Zeit
  rationale: „Eben dieser“ bewahrt die nachdrückliche Bezugnahme auf den konkreten Zeitpunkt des vorausgehenden Zusammenhangs.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: die ihm ... berichteten
  rationale: Das Partizip bezeichnet das Überbringen einer Nachricht; ein Relativsatz ist im Deutschen flüssig und erhält den berichtenden Sinn.
- source_word: περὶ τῶν Γαλιλαίων
  choice: von den Galiläern
  rationale: περί mit Genitiv bezeichnet das Thema des Berichts; „von“ ist hier natürliches Gegenwartsdeutsch.
- source_word: ὧν τὸ αἷμα
  choice: deren Blut
  rationale: Die possessive Relativkonstruktion gibt die griechische Wendung knapp und genau wieder.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: ἔμιξεν
  choice: vermischt hatte
  rationale: μίγνυμι bedeutet „mischen/vermischen“. Das Plusquamperfekt kennzeichnet die Tat als dem Bericht vorausgehend, ohne zusätzliche Umstände einzutragen.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: mit ihren Opfern
  rationale: Die Formulierung bewahrt sowohl die Bedeutung von μετά als auch den Bezug von αὐτῶν und lässt wie der griechische Text offen, ob die Opfer gerade dargebracht wurden.
theological_decisions:
- issue: Historische und moralische Tragweite der Tat des Pilatus
  choice: Die erschütternde Aussage wird ohne erklärende Erweiterung als Vermischung des Blutes der Galiläer mit ihren Opfern wiedergegeben.
  alternative: 'Deutend erweitern: „die Pilatus beim Darbringen ihrer Opfer hatte töten lassen“.'
  rationale: Der Vers erklärt weder den genauen Ablauf noch die theologische Bedeutung des Ereignisses. Die knappe, drastische Formulierung bewahrt diese Offenheit und Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird aber durch einen Relativsatz idiomatisch gestaltet. Keine Deutung der Opferhandlung oder des Tötungsvorgangs wird ergänzt.
