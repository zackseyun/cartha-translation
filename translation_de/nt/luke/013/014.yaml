  source_fidelity: 'Eine behutsame Korrektur ist angezeigt: Das einleitende ἀποκριθείς bezeichnet ausdrücklich eine Erwiderung/Reaktion. „Sagte“ allein gibt dies nicht ausreichend wieder. Die übrigen Satzglieder, einschließlich der kausalen Begründung, der Aufforderung an die Menge und des Gegensatzes zum Sabbat, sind sachgerecht wiedergegeben.'
  naturalness: „Da erwiderte der Synagogenvorsteher empört“ ist modernes, idiomatisches Standarddeutsch und verbindet die griechischen Partizipien flüssig. „Man arbeiten muss“ ist natürlicher als eine stärker formelhafte Konstruktion und bewahrt den normativen Nachdruck.
  terminology: „Synagogenvorsteher“, „Sabbat“ und „heilen lassen“ sind passende, verständliche und registergerechte Wiedergaben. „Muss“ gibt δεῖ genauer wieder als das etwas abschwächende „soll“.
