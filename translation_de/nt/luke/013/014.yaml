source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: de
  text: 'Da erwiderte der Synagogenvorsteher empört, weil Jesus am Sabbat geheilt hatte, der Menge: „Es gibt sechs Tage, an denen man arbeiten muss. Kommt also an diesen Tagen und lasst euch heilen, nicht aber am Sabbattag.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Doch … sagte
  rationale: Das Partizip ἀποκριθείς führt hier die Reaktion auf das Geschehen ein; im Deutschen gibt „sagte“ die Redefunktion natürlicher wieder als das missverständliche „antwortete“, während „doch“ den durch δέ markierten Gegensatz ausdrückt.
- source_word: ἀρχισυνάγωγος
  choice: Synagogenvorsteher
  rationale: Bezeichnet den für die Angelegenheiten beziehungsweise den Gottesdienst einer Synagoge verantwortlichen Leiter; der etablierte deutsche Ausdruck vermeidet den Eindruck staatlicher Herrschaft.
- source_word: ἀγανακτῶν
  choice: war empört
  rationale: Das Partizip bezeichnet starken, als berechtigt empfundenen Unwillen; „empört“ bewahrt diese wertende Färbung.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: weil Jesus am Sabbat geheilt hatte
  rationale: ὅτι ist kausal; das Plusquamperfekt kennzeichnet die Heilung natürlich als das der Rede vorausgehende Geschehen.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: sagte zu der Menge
  rationale: Der Imperfekt kann den Verlauf der Äußerung darstellen, verlangt hier aber keine künstlich durative Übersetzung. „Sagte“ ist im Deutschen die natürliche Erzählform; ὄχλος wird als „Menge“ wiedergegeben.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Es gibt sechs Tage, an denen gearbeitet werden soll
  rationale: Die unpersönliche Form bewahrt sowohl die allgemeine Aussage als auch den normativen Gehalt von δεῖ, ohne sie unnötig mit „notwendig“ zu überladen.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Kommt also an diesen Tagen und lasst euch heilen
  rationale: Die Partizipialkonstruktion wird in natürliches deutsches Imperativgefüge überführt. Das Passiv „lasst euch heilen“ erhält die Aufforderung an die Kranken.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: nicht aber am Sabbattag
  rationale: Die knappe Gegenüberstellung wird bewahrt; „aber“ macht den Kontrast im Deutschen deutlich, ohne zusätzliche Deutung einzuführen.
theological_decisions:
- issue: Status der Aussage über Arbeit und Heilung am Sabbat
  choice: Die Worte werden als normative Behauptung des Synagogenvorstehers wiedergegeben, ohne sie als göttliche Billigung zu kennzeichnen.
  alternative: Die Aussage durch eine wertende Paraphrase ausdrücklich als Heuchelei oder Fehlinterpretation kennzeichnen.
  rationale: Der Vers berichtet zunächst seine empörte Einwendung. Ihre Beurteilung ergibt sich aus dem folgenden Kontext und soll nicht vorwegnehmend in die Übersetzung eingetragen werden.
- issue: Verhältnis von Heilen und Arbeiten
  choice: Die Formulierung lässt stehen, dass der Synagogenvorsteher das Heilen unter die zu verrichtende Arbeit einordnet.
  alternative: „An denen ihr geheilt werden dürft“, wodurch der Akzent von der Arbeit des Heilenden auf eine Erlaubnis für die Kranken verschoben würde.
  rationale: Die Spannung der Rede liegt gerade darin, dass die Heilung als Sabbatarbeit behandelt wird; diese implizite Zuordnung darf weder erklärt noch abgeschwächt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau ist gegenüber dem Griechischen behutsam geglättet, die argumentative Folge und der scharfe Gegensatz zwischen den sechs Arbeitstagen und dem Sabbat bleiben erhalten.
