id: LUK.13.31
reference: Luke 13:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: de
  text: 'Zu eben dieser Stunde[a] kamen einige Pharisäer zu ihm und sagten: »Geh weg und zieh fort von hier[b], denn Herodes will dich töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zu derselben Stunde.«'
    reason: Die Zeitangabe kann den Bezug auf dieselbe, zuvor genannte Stunde betonen; „eben“ hebt im Haupttext die konkrete Zeitreferenz hervor.
  - marker: b
    text: 'Wörtlicher: »Geh hinaus und zieh fort von hier.«'
    reason: Die Fußnote macht die zwei griechischen Bewegungsverben sichtbar; »hinausgehen« kann im Deutschen jedoch stärker als im Zusammenhang nötig an ein konkretes Gebäude oder einen umgrenzten Raum denken lassen.
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Genau zu dieser Stunde
  rationale: Die Formulierung bewahrt den betonten, konkreten Zeitbezug von αὐτῇ; sie kann sowohl Unmittelbarkeit als auch den Bezug auf dieselbe Stunde ausdrücken.
- source_word: προσῆλθάν
  choice: kamen … zu ihm
  rationale: προσέρχομαι bezeichnet das Herantreten oder Näherkommen; die deutsche Wendung ist natürlich und hält Jesus als Ziel der Bewegung ausdrücklich fest.
- source_word: τινες Φαρισαῖοι
  choice: einige Pharisäer
  rationale: τινες bezeichnet eine unbestimmte Teilgruppe, ohne sie näher zu identifizieren.
- source_word: λέγοντες αὐτῷ
  choice: und sagten
  rationale: Das gleichzeitige Partizip wird für flüssiges modernes Deutsch als beigeordnetes finites Verb wiedergegeben; der Bezug auf Jesus ist bereits durch »zu ihm« eindeutig.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Geh weg und zieh fort von hier
  rationale: Die zwei Imperative bleiben als zwei Aufforderungen erkennbar. »Zieh fort« gibt die Bewegung von diesem Ort würdevoll und verständlich wieder, ohne die Aussage zu einer einzigen Aufforderung zu glätten.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt hier den Grund für die Warnung ein; »denn« klingt in direkter Rede natürlich und bewahrt die begründende Funktion.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Dies ist die etablierte deutsche Namensform.
- source_word: θέλει σε ἀποκτεῖναι
  choice: will dich töten
  rationale: Die Wiedergabe entspricht unmittelbar dem Wunsch oder Willen, Jesus zu töten, ohne durch »beabsichtigt« einen stärker ausgearbeiteten Plan vorauszusetzen.
theological_decisions:
- issue: Absicht der warnenden Pharisäer
  choice: Ihre Worte werden ohne Bewertung ihrer Beweggründe als direkte Warnung wiedergegeben.
  alternative: Die Pharisäer könnten Jesus aufrichtig gewarnt oder ihn zum Weggehen gedrängt haben, möglicherweise im Interesse des Herodes.
  rationale: Der griechische Text nennt ihre Motivation nicht. Die Übersetzung lässt diese narrative und theologische Offenheit bestehen.
- issue: Stärke von θέλει
  choice: »will«
  alternative: »hat vor« oder »beabsichtigt«
  rationale: »Will« bewahrt den Grundsinn des Wollens, ohne den Wunsch des Herodes ausdrücklich als bereits feststehenden Plan zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich, ohne umgangssprachlich zu werden. Die leichte Doppelung der beiden Aufforderungen spiegelt die griechische Ausdrucksweise, während die Motive der Pharisäer bewusst offenbleiben.
