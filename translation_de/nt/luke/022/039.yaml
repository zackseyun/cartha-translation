id: LUK.22.39
reference: Luke 22:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: de
  text: Dann ging er hinaus und begab sich wie gewohnt[a] zum Ölberg. Auch die Jünger folgten ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß der Gewohnheit“.'
    reason: Die Fußnote macht die knappere griechische Form sichtbar, die kein ausdrückliches Possessivpronomen enthält.
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ging er hinaus
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht. Die finite deutsche Form ist natürlich und wahrt die zeitliche Abfolge.
- source_word: ἐπορεύθη
  choice: begab sich
  rationale: „Begab sich“ gibt das erzählende πορεύομαι idiomatisch wieder und vermeidet unmittelbar nach „ging hinaus“ eine schwerfällige Wiederholung von „gehen“.
- source_word: κατὰ τὸ ἔθος
  choice: wie gewohnt
  rationale: Die Wendung bezeichnet ein übliches Verhalten. „Wie gewohnt“ ist modernes, knappes Deutsch und macht kein Possessivpronomen ausdrücklich, das im Griechischen nicht steht.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: zum Ölberg
  rationale: „Ölberg“ ist die etablierte deutsche Bezeichnung für diesen geografischen Ort.
- source_word: ἠκολούθησαν … αὐτῷ
  choice: folgten ihm
  rationale: Die Grundbedeutung von ἀκολουθέω passt sowohl zur tatsächlichen Bewegung als auch zur Beziehung der Jünger zu Jesus.
- source_word: καὶ οἱ μαθηταί
  choice: Auch die Jünger
  rationale: Das zweite καί hat additive Bedeutung; „auch“ bringt hervor, dass die Jünger ihm ebenfalls folgten. Der bestimmte Artikel wird beibehalten, ohne das im Griechischen nicht ausdrückliche „seine“ hinzuzufügen.
- source_word: Καὶ … δὲ
  choice: Dann … Auch
  rationale: Die Konjunktionen führen die Erzählung ohne starken Gegensatz weiter. Die deutsche Satzverknüpfung gibt diesen fortschreitenden Charakter natürlich wieder.
theological_decisions:
- issue: Ob Jesus ausdrücklich als Träger der Gewohnheit bezeichnet werden soll
  choice: „wie gewohnt“ ohne ausdrückliches Possessivpronomen
  alternative: „wie es seine Gewohnheit war“
  rationale: Aus dem Zusammenhang ist Jesus als handelnde Person klar, doch κατὰ τὸ ἔθος enthält kein ausdrückliches „seine“. Die gewählte Form wahrt diese Knappheit, ohne unnatürlich zu klingen.
translation_notes:
  register: Modernes, würdiges Erzählregister. Zwei kurze Sätze vermeiden eine überladene Koordination; „begab sich“ ist gehoben genug für den biblischen Erzählton, bleibt aber allgemein verständlich.
