review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die Abfolge des aoristischen Partizips ἐξελθών und des Hauptverbs ἐπορεύθη idiomatisch wieder. „Wie gewohnt“ trifft κατὰ τὸ ἔθος knapp und ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzuführen. „Zum Ölberg“ ist die etablierte deutsche Ortsbezeichnung. Die additive Nuance von καί bei den Jüngern wird mit „Auch“ angemessen wiedergegeben.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch in einem passenden, würdigen Erzählregister. Die Aufteilung in zwei Sätze ist natürlich und verändert weder Ablauf noch Gewichtung des griechischen Satzes. „Sich begab“ vermeidet die ansonsten unschöne unmittelbare Wiederholung von „ging“.
  terminology: „Ölberg“ und „Jünger“ entsprechen dem üblichen deutschen Bibelwortschatz und sind zugleich allgemein verständlich. Es werden keine konfessionell geprägten Zusätze eingeführt.
