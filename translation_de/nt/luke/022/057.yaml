source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: de
  text: 'Doch er bestritt es und sagte: »Frau, ich kenne ihn nicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: bestritt es
  rationale: Das Verb bezeichnet hier das Bestreiten der unmittelbar zuvor erhobenen Behauptung. Das im Griechischen unausgesprochene Objekt wird im Deutschen idiomatisch mit »es« ergänzt, ohne Jesus selbst ausdrücklich zum Objekt des Verbs zu machen.
- source_word: λέγων
  choice: und sagte
  rationale: Die koordinierte Wiedergabe klingt im modernen Deutschen natürlicher als »indem er sagte« und gibt die Funktion des Partizips wieder, das den Inhalt des Bestreitens einführt.
- source_word: Οὐκ οἶδα
  choice: ich kenne … nicht
  rationale: Bei einer Person wird οἶδα im Deutschen idiomatisch mit »kennen« wiedergegeben; die Verneinung bleibt schlicht und nachdrücklich.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist unmittelbar auf Jesus. Eine Erweiterung wie »diesen Mann« wäre im griechischen Text nicht ausdrücklich vorhanden.
- source_word: γύναι
  choice: Frau
  rationale: Der Vokativ ist eine direkte Anrede an die weibliche Sprecherin. »Frau« wahrt diese Form, ohne durch »meine Dame« oder Ähnliches zusätzliche Höflichkeit einzutragen.
theological_decisions:
- issue: Unausgesprochenes Objekt von ἠρνήσατο
  choice: '»bestritt es«: Das ergänzte »es« bezieht sich auf die erhobene Behauptung.'
  alternative: »verleugnete ihn« oder formal »bestritt und sagte«
  rationale: Der griechische Satz nennt kein Objekt. »Ihn verleugnete er« würde Jesus ausdrücklich zum grammatischen Objekt machen und damit die unmittelbare Aussage stärker festlegen, als es der Wortlaut tut. Die Ergänzung »es« ermöglicht natürliches Deutsch und erhält den Bezug auf die Anschuldigung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Anrede »Frau« bleibt bewusst knapp und ungeschönt; sie soll weder abwertend verschärft noch höflich gemildert werden.
