id: LUK.22.45
reference: Luke 22:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: de
  text: Nachdem er vom Gebet aufgestanden war, ging er zu den Jüngern und fand sie vor Traurigkeit schlafend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Nachdem er vom Gebet aufgestanden war
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Kommen zu den Jüngern vorausgeht. „Vom Gebet aufstehen“ bewahrt die räumlich-bildhafte Formulierung des Griechischen und klingt zugleich natürlich.
- source_word: ἐλθὼν πρὸς τοὺς μαθητάς
  choice: ging er zu den Jüngern
  rationale: Das Partizip mit πρός bezeichnet die Bewegung zu den Jüngern hin. Im Deutschen gibt ein finites Verb die Handlungsfolge klar und idiomatisch wieder.
- source_word: μαθητάς
  choice: Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Wiedergabe von μαθητής.
- source_word: εὗρεν
  choice: fand
  rationale: „Fand“ gibt εὑρίσκω direkt wieder und bezeichnet hier den Zustand, in dem Jesus die Jünger antraf.
- source_word: κοιμωμένους αὐτούς
  choice: fand sie … schlafend
  rationale: Das Präsenspartizip stellt ihr Schlafen als den angetroffenen Zustand beziehungsweise fortdauernden Vorgang dar. „Schlafend“ bewahrt diesen verbalen Aspekt besser als „eingeschlafen“.
- source_word: ἀπὸ τῆς λύπης
  choice: vor Traurigkeit
  rationale: ἀπό bezeichnet hier am natürlichsten die Ursache. Die deutsche Wendung „vor Traurigkeit“ ist knapp, verständlich und bewahrt den kausalen Zusammenhang, ohne eine zusätzliche psychologische Erklärung einzutragen.
theological_decisions:
- issue: Ursache des Schlafens der Jünger
  choice: Das Schlafen wird als Folge ihrer Traurigkeit dargestellt.
  alternative: Die Jünger schliefen lediglich in einem Zustand der Traurigkeit, ohne deutliche kausale Aussage.
  rationale: ἀπὸ τῆς λύπης drückt in diesem Zusammenhang am ehesten Ursache aus. Die Übersetzung bleibt bei dieser Aussage und erklärt nicht weiter, auf welche psychische oder körperliche Weise die Traurigkeit zum Schlaf führte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge ist flüssig, bleibt aber eng an der griechischen Abfolge. „Vor Traurigkeit schlafend“ ist leicht literarisch, bewahrt dafür prägnant sowohl den fortdauernden Charakter von κοιμωμένους als auch die kausale Kraft von ἀπό.
