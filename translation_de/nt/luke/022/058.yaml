  source_fidelity: Der Text gibt μετὰ βραχύ idiomatisch als »Kurze Zeit später« wieder und bewahrt die Abfolge aus Wahrnehmung und Aussage. »Auch du gehörst zu ihnen« trifft die hier gemeinte Gruppenzugehörigkeit von ἐξ αὐτῶν. Petrus’ knappe Antwort »ich bin es nicht« gibt die elliptische Form οὐκ εἰμί in natürlichem Deutsch wieder, ohne die im Griechischen unausgesprochene Ergänzung in den Haupttext einzutragen.
  naturalness: Die Formulierung ist modernes, gut lesbares Standarddeutsch. »Mensch« funktioniert hier als knappe, abweisende Anrede und passt zum erzählerischen Register; »Petrus aber sagte« bildet den griechischen Kontrast angemessen ab.
