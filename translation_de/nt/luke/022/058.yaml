id: LUK.22.58
reference: Luke 22:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: de
  text: 'Kurze Zeit später sah ihn ein anderer und sagte: »Auch du gehörst zu ihnen.« Petrus aber sagte: »Mensch, ich bin es nicht[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich bin nicht.« Gemeint sein kann: »Ich bin keiner von ihnen.« Das Griechische lässt die Ergänzung aus, weil sie aus dem vorherigen Vorwurf hervorgeht.'
    reason: Die griechische Antwort ist elliptisch; die Fußnote macht sowohl den Wortlaut als auch die im Zusammenhang naheliegende Ergänzung sichtbar.
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: kurze Zeit später
  rationale: Die zeitliche Wendung bezeichnet einen kurzen Abstand zum vorherigen Geschehen; die gewählte Formulierung ist im modernen Deutschen natürlich und präzise.
- source_word: ἕτερος
  choice: ein anderer
  rationale: Das substantivisch gebrauchte maskuline Singularwort bezeichnet eine weitere männliche Person. Im Deutschen macht »ein anderer« dies ohne unnötigen Zusatz deutlich.
- source_word: ἰδὼν αὐτόν
  choice: sah ihn
  rationale: Das Aoristpartizip beschreibt die Wahrnehmung, die der Aussage vorausgeht beziehungsweise sie begleitet. Die finite Reihung ist im Deutschen flüssiger als eine wörtliche Partizipialkonstruktion.
- source_word: ἔφη
  choice: sagte
  rationale: φημί dient hier als schlichte Redeeinleitung; »sagte« entspricht dem natürlichen deutschen Erzählstil.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Auch du gehörst zu ihnen
  rationale: ἐξ αὐτῶν bezeichnet hier die Zugehörigkeit zur Gruppe um Jesus. »gehörst zu ihnen« gibt diesen Sinn idiomatisch wieder, ohne eine bloße Herkunft auszudrücken.
- source_word: Ἄνθρωπε
  choice: Mensch
  rationale: Der Vokativ ist eine unmittelbare, knappe Anrede. »Mensch« bewahrt den abrupten und abwehrenden Ton besser als das höflichere »mein Herr«.
- source_word: οὐκ εἰμί
  choice: ich bin es nicht
  rationale: Im Griechischen steht verkürzt nur »ich bin nicht«; das Prädikativ ist aus dem Vorwurf zu ergänzen. Das deutsche »es« ermöglicht eine natürliche, ebenso knappe Antwort, ohne »einer von ihnen« ausdrücklich in den Haupttext einzusetzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit knappen, direkten Äußerungen. Die Ellipse in Petrus’ Antwort wird im Haupttext natürlich wiedergegeben und in der Fußnote offengelegt.
