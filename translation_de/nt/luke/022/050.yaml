id: LUK.22.50
reference: Luke 22:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: de
  text: Und einer von ihnen schlug den Sklaven[a] des Hohepriesters und hieb ihm das rechte Ohr ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener.'
    reason: δοῦλος kann je nach sozialem Kontext mit „Sklave“ oder „Diener“ wiedergegeben werden.
lexical_decisions:
- source_word: ἐπάταξεν
  choice: schlug
  rationale: Das Verb bezeichnet hier einen kräftigen Schlag. „Schlug“ ist im modernen Deutsch klar und wahrt die konkrete Handlung ohne altertümlichen Ton.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: einer von ihnen
  rationale: Die indefinite Wendung bleibt idiomatisch und bewahrt, dass Lukas die handelnde Person nicht namentlich nennt.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: den Sklaven des Hohepriesters
  rationale: δοῦλος bezeichnet einen sozial Unfreien beziehungsweise Abhängigen. „Sklave“ gibt diesen konkreten gesellschaftlichen Status deutlicher wieder als das weiter gefasste „Diener“.
- source_word: ἀφεῖλεν
  choice: hieb … ab
  rationale: ἀφαιρέω bedeutet grundsätzlich „wegnehmen/entfernen“; im Zusammenhang der Gewalttat und mit dem Ohr als Objekt bezeichnet es ein Abtrennen. „Hieb … ab“ ist präzise und natürlich.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: ihm das rechte Ohr
  rationale: Die deutsche Konstruktion mit Dativ und bestimmtem Artikel ist idiomatisch und bewahrt die ausdrückliche Angabe der rechten Seite.
theological_decisions:
- issue: Wiedergabe von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Der Ausdruck wird hier im wörtlichen sozialen Sinn gebraucht. „Sklave“ wahrt den Status der Unfreiheit; da „Diener“ je nach Einschätzung des Kontextes ebenfalls möglich ist, wird diese Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. „Hohepriester“ folgt dem üblichen deutschen biblischen Sprachgebrauch; „hieb … ab“ vermittelt die gewaltsame, abgeschlossene Handlung ohne unnötige Ausmalung.
