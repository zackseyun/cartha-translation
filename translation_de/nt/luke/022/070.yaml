id: LUK.22.70
reference: Luke 22:70
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: de
  text: 'Da sagten sie alle: „Du bist also der Sohn Gottes?“ Er sagte zu ihnen: „Ihr sagt, dass ich es bin.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Ihr sagt es“ oder „Es ist, wie ihr sagt.“ Jesu Worte dienen im Zusammenhang als bejahende Antwort; wörtlicher heißt es jedoch: „Ihr sagt, dass ich es bin.“'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: sie alle
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet die gesamte Gruppe; „sie alle“ bewahrt die kollektive Betonung in natürlichem Deutsch.
- source_word: οὖν
  choice: also
  rationale: In der Frage kennzeichnet οὖν eine Schlussfolgerung aus dem vorausgehenden Gespräch; „also“ gibt diese folgernde Funktion idiomatisch wieder.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die bestimmte Form und das Gewicht des christologischen Titels werden direkt bewahrt.
- source_word: ἔφη
  choice: sagte
  rationale: Das schlichte „sagte“ entspricht dem Verb im Kontext, ohne eine nicht ausdrücklich markierte Nuance wie „erklärte“ hinzuzufügen.
- source_word: Ὑμεῖς λέγετε
  choice: Ihr sagt
  rationale: Das ausdrücklich gesetzte Pluralpronomen wird wiedergegeben. Ein zusätzliches „selbst“ wäre im Deutschen stärker markiert und ist zur Wahrung der Betonung nicht erforderlich.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier am natürlichsten den Inhalt ihrer Aussage ein.
- source_word: ἐγώ εἰμι
  choice: ich es bin
  rationale: Im Deutschen verlangt der Rückbezug auf „der Sohn Gottes“ idiomatisch ein prädikatives „es“. Die knappe Aussage und ihre Zurückhaltung bleiben erhalten.
theological_decisions:
- issue: Ob Jesu Antwort als ausdrückliche Bestätigung oder als indirekte, qualifizierte Antwort wiederzugeben ist
  choice: „Ihr sagt, dass ich es bin“
  alternative: „Ja, ich bin es“; „Es ist, wie ihr sagt“; „Ihr sagt es“
  rationale: Die gewählte Form folgt der griechischen Syntax eng und bewahrt die Spannung zwischen einer im Kontext bejahenden Antwort und Jesu Rückverweis auf die Formulierung seiner Gesprächspartner. Eine eindeutige Paraphrase würde diese Spannung auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Da“ führt die Reaktion im Erzählfluss natürlich fort; „also“ wahrt den folgernden Charakter der Frage. Die Antwort bleibt bewusst näher an der ungewöhnlichen griechischen Formulierung als an einer glättenden deutschen Paraphrase.
