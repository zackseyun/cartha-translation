id: LUK.22.64
reference: Luke 22:64
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: de
  text: 'Nachdem sie ihn verhüllt hatten[a], fragten sie ihn immer wieder: »Prophezeie! Wer hat dich geschlagen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihm die Augen verbunden hatten«.'
    reason: 'Lexikalische Alternative: Der Zusammenhang erlaubt diese konkretere Wiedergabe, während das griechische Verb selbst allgemeiner »bedecken, verhüllen« bedeutet.'
lexical_decisions:
- source_word: περικαλύψαντες
  choice: Nachdem sie ihn verhüllt hatten
  rationale: Das Verb bezeichnet ein Bedecken oder Verhüllen. Die Formulierung bleibt nahe am griechischen Wortlaut, ohne ausdrücklich festzulegen, womit oder welcher Körperteil bedeckt wurde; aus dem Zusammenhang ergibt sich, dass Jesus den Täter nicht sehen sollte.
- source_word: ἐπηρώτων
  choice: fragten sie ihn immer wieder
  rationale: Das Imperfekt legt eine fortgesetzte oder wiederholte Handlung nahe. »Immer wieder« gibt diesen Aspekt im Deutschen natürlich wieder.
- source_word: λέγοντες
  choice: Einleitung der direkten Rede durch einen Doppelpunkt
  rationale: Das Partizip führt den Inhalt der wiederholten Fragen ein. Im natürlichen Deutschen genügt dafür die direkte Rede nach einem Doppelpunkt; ein zusätzliches »und sagten« wäre schwerfällig.
- source_word: Προφήτευσον
  choice: Prophezeie!
  rationale: Der Aoristimperativ wird als knapper, spöttischer Befehl wiedergegeben und bewahrt die gegen Jesu prophetischen Anspruch gerichtete Ironie.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Wer hat dich geschlagen?
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der Jesus geschlagen hat. Die idiomatische deutsche Frage bewahrt den Sinn, ohne die im Deutschen unnötig schwere Form »Wer ist der, der dich geschlagen hat?« zu verwenden.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass Jesus die Augen verbunden wurden
  choice: Im Haupttext die allgemeinere Formulierung »ihn verhüllt« beibehalten
  alternative: »ihm die Augen verbunden«
  rationale: Der Zusammenhang setzt voraus, dass Jesus den Schlagenden nicht sehen konnte, doch das griechische Verb selbst bedeutet allgemein »bedecken, verhüllen«. Die Hauptfassung vermeidet daher zusätzliche Präzisierung; die naheliegende Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verspottung wird durch »immer wieder« ausgedrückt; die direkte Rede bleibt knapp und scharf.
