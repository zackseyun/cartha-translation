id: LUK.22.30
reference: Luke 22:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: de
  text: damit ihr in meinem Reich an meinem Tisch esst und trinkt, und ihr werdet auf Thronen sitzen und die zwölf Stämme Israels richten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: über die zwölf Stämme Israels herrschen oder sie regieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck beziehungsweise die Folge der vorausgehenden Verheißung ein und bewahrt die finale Nuance natürlich im Deutschen.
- source_word: ἔσθητε καὶ πίνητε
  choice: ihr ... esst und trinkt
  rationale: Die Konjunktive unter ἵνα werden im deutschen damit-Satz idiomatisch mit Präsens wiedergegeben.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: an meinem Tisch
  rationale: Natürliche deutsche Wendung für Tischgemeinschaft; sie vermeidet das räumlich unpassende wörtliche „auf meinem Tisch“.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: in meinem Reich
  rationale: Der Zusammenhang von Mahlgemeinschaft und Thronen legt hier den Bereich königlicher Herrschaft nahe; „Reich“ bewahrt zugleich den Bezug zur Königsherrschaft.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: ihr werdet auf Thronen sitzen
  rationale: Gibt das Futur direkt wieder und erhält das königliche sowie richterliche Bild.
- source_word: κρίνοντες
  choice: richten
  rationale: Die direkteste Wiedergabe von κρίνω; sie wahrt die richterliche Bedeutung, ohne mögliche Aspekte des Regierens auszuschließen.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: die zwölf Stämme Israels
  rationale: Transparente und im Deutschen geläufige Wiedergabe des Bundesvolkbezugs.
theological_decisions:
- issue: Art der künftigen Aufgabe der Jünger gegenüber den zwölf Stämmen Israels
  choice: richten
  alternative: über die zwölf Stämme Israels herrschen oder sie regieren
  rationale: κρίνω kann richterliche und herrschaftliche Aspekte umfassen. „Richten“ wahrt den unmittelbarsten Wortsinn und legt weder bloße Verurteilung noch ausschließlich administrative Herrschaft fest; die weiteren Möglichkeiten stehen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss mit „damit“ bleibt bewusst erhalten, da der Vers syntaktisch an die vorausgehende Verheißung anschließt. Das Semikolon macht die beiden eng verbundenen Zukunftsaussagen gut lesbar.
