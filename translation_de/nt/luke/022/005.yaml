  text: καὶ ἐχάρησαν καὶ συνέθεντο αὐτῷ ἀργύριον δοῦναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: de
  text: Und sie freuten sich und vereinbarten, ihm Geld[a] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Silber“. Das griechische Wort kann wörtlich Silber oder allgemeiner Geld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: sie freuten sich
  rationale: Das Aoristverb von χαίρω bezeichnet hier ihre freudige Reaktion. „Sie freuten sich“ ist im modernen Deutsch natürlich und bewahrt die moralisch auffällige Freude im Zusammenhang.
- source_word: συνέθεντο
  choice: vereinbarten
  rationale: Die mediale Form von συντίθημι bedeutet hier, eine Vereinbarung zu treffen. „Vereinbarten“ gibt dies knapp wieder, ohne die stärkere Deutung „versprachen“ einzutragen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet den Empfänger des vereinbarten Gebens und wird im Deutschen idiomatisch mit „ihm“ wiedergegeben.
- source_word: ἀργύριον
  choice: Geld
  rationale: ἀργύριον bezeichnet wörtlich Silber, wird in einem geschäftlichen Zusammenhang jedoch gewöhnlich im Sinn von Geld gebraucht. Die wörtliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: δοῦναι
  choice: zu geben
  rationale: Der Infinitiv benennt den Inhalt der Vereinbarung. „Zu geben“ entspricht dem griechischen Ausdruck unmittelbar; „zu bezahlen“ wäre eine kontextuelle Präzisierung.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, knappem Satzbau. Die Wiederholung von καί wird durch zweimaliges „und“ bewahrt; die Infinitivkonstruktion bleibt nahe an der griechischen Struktur.
