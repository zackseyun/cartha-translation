  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Der zuvor genannte Mann wird den Jüngern einen großen Raum im Obergeschoss zeigen; dort sollen sie die Vorbereitungen treffen. „Hergerichtet“ gibt ἐστρωμένον angemessen als bereits eingerichteten bzw. für die Mahlzeit vorbereiteten Zustand wieder, ohne eine bestimmte Ausstattung zwingend festzulegen.'
