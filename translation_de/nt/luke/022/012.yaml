base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: de
  text: Und er wird euch einen großen, hergerichteten Raum im Obergeschoss[a] zeigen. Dort bereitet alles vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen großen, bereits vorbereiteten Raum im Obergeschoss“; möglicherweise waren dort Polster oder Speiseliegen ausgelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Und er
  rationale: Die Verbindung aus καί und ἐκεῖνος führt die Anweisung fort und verweist auf den zuvor genannten Hausherrn; „Und er“ klingt im Deutschen natürlich.
- source_word: δείξει ὑμῖν
  choice: wird euch … zeigen
  rationale: Die Futurform von δείκνυμι mit dem Dativ ὑμῖν wird direkt und idiomatisch wiedergegeben.
- source_word: ἀνάγαιον
  choice: Raum im Obergeschoss
  rationale: Das Wort bezeichnet einen Raum in einem oberen Stockwerk. Diese Formulierung ist im heutigen Deutsch verständlicher und natürlicher als „Obergemach“.
- source_word: μέγα
  choice: großen
  rationale: μέγα beschreibt hier die räumliche Größe des Raumes.
- source_word: ἐστρωμένον
  choice: hergerichteten
  rationale: Das Perfektpartizip von στρώννυμι bezeichnet einen bereits eingerichteten beziehungsweise mit den nötigen Liege- oder Essplätzen ausgestatteten Zustand, ohne genau festzulegen, was ausgelegt wurde.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Direkte und idiomatische Wiedergabe des Ortsadverbs.
- source_word: ἑτοιμάσατε
  choice: bereitet alles vor
  rationale: Der Aoristimperativ Plural fordert die Jünger auf, dort die erforderlichen Vorbereitungen zu treffen. Das ergänzte „alles“ macht den absoluten Gebrauch von „vorbereiten“ im Deutschen natürlich, ohne den Gegenstand näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. „Raum im Obergeschoss“ vermeidet das veraltete „Obergemach“; die Fußnote bewahrt die Bedeutungsbreite von ἐστρωμένον.
