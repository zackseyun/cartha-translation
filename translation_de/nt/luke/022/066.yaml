source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: de
  text: Und als es Tag wurde[a], versammelte sich der Ältestenrat des Volkes – Hohepriester und Schriftgelehrte. Dann führten sie ihn vor ihren Rat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als der Tag anbrach“ oder „bei Tagesanbruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihre Ratsversammlung“ beziehungsweise „in ihren Versammlungsort“. Das griechische Wort kann den Rat selbst, seine förmliche Sitzung oder den Ort der Zusammenkunft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: als es Tag wurde
  rationale: Die deutsche Wendung bildet die zeitliche Konstruktion mit ἐγένετο eng und zugleich natürlich ab; „bei Tagesanbruch“ wäre idiomatischer verdichtet.
- source_word: συνήχθη
  choice: versammelte sich
  rationale: Die mediale deutsche Form gibt das passive griechische Verb idiomatisch wieder, ohne ausdrücklich einen Einberufenden vorauszusetzen.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: der Ältestenrat des Volkes
  rationale: πρεσβυτέριον bezeichnet hier das aus Ältesten bestehende Gremium. „Ältestenrat“ ist verständlich und bewahrt den institutionellen Sinn.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: Hohepriester und Schriftgelehrte
  rationale: Die beiden Gruppen erläutern die Zusammensetzung des zuvor genannten Gremiums. Im Deutschen genügt die koordinierende Verbindung mit „und“.
- source_word: ἀπήγαγον
  choice: führten sie ihn
  rationale: ἀπάγω bezeichnet das Weg- beziehungsweise Hinführen. Im Kontext ist das Ziel ausdrücklich genannt, sodass „führten“ die Bewegung natürlich ausdrückt.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: vor ihren Rat
  rationale: συνέδριον kann das Ratsgremium, dessen Sitzung oder den Versammlungsort bezeichnen. „Vor ihren Rat“ gibt im gerichtlichen Zusammenhang die Zielrichtung idiomatisch wieder, ohne einen bestimmten Raum zu behaupten; die Mehrdeutigkeit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Bezeichnung und räumliche Deutung des jüdischen Führungsgremiums
  choice: πρεσβυτέριον als „Ältestenrat“ und συνέδριον als „Rat“ wiedergeben; die mögliche Bedeutung „Ratsversammlung/Versammlungsort“ in einer Fußnote bewahren
  alternative: συνέδριον mit „Hoher Rat“, „Synedrium“ oder „Ratssaal“ wiedergeben
  rationale: Der griechische Text verwendet zwei verwandte, aber verschiedene Wörter. Die gewählte Fassung bleibt allgemein verständlich und legt weder einen technischen Eigennamen noch ausschließlich einen physischen Raum fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die institutionellen Begriffe bleiben transparent; technische Fremdwörter werden vermieden. Die Aufteilung in zwei deutsche Sätze entlastet die lange griechische Satzfolge, ohne ihren Gedankengang zu verändern.
