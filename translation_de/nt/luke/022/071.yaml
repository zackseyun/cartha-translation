source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: de
  text: 'Da sagten sie: „Wozu brauchen wir noch Zeugenaussagen?[a] Wir haben es doch selbst aus seinem Mund gehört.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was brauchen wir noch an Zeugnis?“'
    reason: Lexikalische Alternative zu τί ἔτι ἔχομεν μαρτυρίας χρείαν; sie bildet die griechische Konstruktion enger ab.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Da sagten sie
  rationale: δέ führt die Erzählung hier mit einem leichten Anschluss weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder, ohne einen starken Gegensatz einzutragen.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Wozu brauchen wir noch eine Zeugenaussage?
  rationale: Die rhetorische Frage wird im modernen Deutsch idiomatisch mit „Wozu ... noch?“ wiedergegeben. χρείαν ἔχειν bedeutet „brauchen“, und μαρτυρία bezeichnet im gerichtlichen Zusammenhang eine Zeugenaussage bzw. ein Zeugnis.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: Wir haben es doch selbst gehört
  rationale: „selbst“ bewahrt die Hervorhebung durch αὐτοί. „doch“ vermittelt die begründende Funktion von γάρ innerhalb der direkten Rede natürlich. Das unbestimmte „es“ lässt offen, was genau gehört wurde.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund
  rationale: Die deutsche Wendung bezeichnet ebenso wie der griechische Ausdruck eine unmittelbar von der betreffenden Person gehörte Aussage; ein zusätzliches „eigenen“ ist wegen „selbst“ nicht nötig.
theological_decisions:
- issue: Ob das Gehörte ausdrücklich als Jesu Aussage, Anspruch oder belastendes Zeugnis bezeichnet werden soll
  choice: Das Objekt bleibt mit „es“ inhaltlich unbestimmt.
  alternative: „Wir haben seine Aussage selbst aus seinem Mund gehört.“
  rationale: Im Griechischen steht nach ἠκούσαμεν kein ausdrückliches Objekt. Die knappe Form bewahrt die gerichtliche Zuspitzung, ohne die Art oder rechtliche Bewertung des Gehörten erläuternd festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die rhetorische Frage ist idiomatisch formuliert; der gerichtliche Kontext bleibt durch „Zeugenaussage“ erkennbar.
