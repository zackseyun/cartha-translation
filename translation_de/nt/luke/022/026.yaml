id: LUK.22.26
reference: Luke 22:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: de
  text: Bei euch aber soll es nicht so sein.[a] Vielmehr soll der Größere unter euch wie der Jüngere werden[b] und wer führt, wie einer, der dient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bei euch aber nicht so.« Der griechische Ausdruck ist knapp und elliptisch; er hebt den scharfen Gegensatz zu dem unmittelbar zuvor beschriebenen Streben nach Rang und Macht hervor.'
    reason: alternative_reading
  - marker: b
    text: »Der Jüngere« meint im damaligen sozialen Zusammenhang den rangniedrigeren Menschen, nicht nur jemanden mit geringerem Lebensalter.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Bei euch aber soll es nicht so sein
  rationale: Gibt den betonten Gegensatz und die im Griechischen knappe, elliptische Form als natürliche deutsche Weisung wieder; der Bezug auf das zuvor beschriebene Machtstreben bleibt erhalten.
- source_word: ἀλλ’
  choice: Vielmehr
  rationale: Markiert den starken Gegensatz und leitet Jesu positive Gegenweisung in gehobenem, aktuellem Deutsch ein.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: der Größere unter euch
  rationale: Bewahrt den Komparativ und bezeichnet eine Person mit höherem Rang oder Ansehen innerhalb der Gemeinschaft, ohne daraus den Superlativ zu machen.
- source_word: γινέσθω
  choice: soll ... werden
  rationale: 'Bewahrt sowohl den Aufforderungscharakter als auch den dynamischen Sinn von γίνομαι: Es geht darum, eine andere Haltung und Rolle anzunehmen.'
- source_word: ὡς ὁ νεώτερος
  choice: wie der Jüngere
  rationale: Gibt den Komparativ formal wieder. Eine Fußnote erläutert, dass im damaligen sozialen Zusammenhang nicht allein das Lebensalter, sondern auch der niedrigere Rang mitschwingt.
- source_word: ὁ ἡγούμενος
  choice: wer führt
  rationale: Gibt das substantivierte Partizip verbal und idiomatisch wieder, ohne ein späteres kirchliches Amt oder ein hartes Herrschaftsverständnis einzutragen.
- source_word: ὡς ὁ διακονῶν
  choice: wie einer, der dient
  rationale: Erhält den aktiven, verbalen Sinn des Dienens und vermeidet eine unnötig institutionelle Deutung.
theological_decisions:
- issue: Jesu Weisung zu Rang und Leitung
  choice: 'Als Umkehr gesellschaftlicher Rangvorstellungen innerhalb der Jüngergemeinschaft formuliert: Größe und Leitung sollen die Gestalt niedrigen Ranges und tätigen Dienens annehmen.'
  alternative: Stärker institutionell von Amt, Herrschaft oder festgelegter Hierarchie sprechen.
  rationale: Der griechische Text stellt den Größeren und den Führenden dem Jüngeren und Dienenden gegenüber. Die Übersetzung bewahrt diese Spannung, ohne spätere kirchliche Strukturen einzutragen oder Leitung an sich aufzuheben.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Parallelstruktur wird bewahrt; »der Größere« und »der Jüngere« erhalten bewusst die Komparativform des griechischen Textes.
