source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: de
  text: 'Jesus aber sagte zu den führenden Priestern, den Befehlshabern der Tempelwache und den Ältesten, die gegen ihn gekommen waren: »Seid ihr mit Schwertern und Knüppeln ausgezogen wie gegen einen Räuber[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Banditen« oder »einen aufständischen Gesetzlosen«. Das griechische Wort λῃστής kann einen Räuber, einen Banditen oder einen aufständischen Gesetzlosen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier einen leichten Gegensatz beziehungsweise den Übergang von der Festnahmehandlung zu Jesu Reaktion.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: die gegen ihn gekommen waren
  rationale: ἐπί mit Akkusativ bezeichnet in diesem Festnahmekontext eine gegen Jesus gerichtete Bewegung; die Formulierung wahrt die feindliche Ausrichtung.
- source_word: ἀρχιερεῖς
  choice: führende Priester
  rationale: Der Plural bezeichnet die maßgeblichen priesterlichen Autoritäten und nicht mehrere gleichzeitig amtierende Hohepriester; die moderne Formulierung ist verständlich und sachlich.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: Befehlshaber der Tempelwache
  rationale: Gemeint sind leitende Amtsträger des für den Tempel zuständigen Sicherheitsdienstes, nicht gewöhnliche Tempelbedienstete.
- source_word: πρεσβυτέρους
  choice: Ältesten
  rationale: Das Wort bezeichnet hier anerkannte jüdische Führungspersonen, nicht lediglich ältere Männer.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: wie gegen einen Räuber
  rationale: Die Wendung beschreibt das bewaffnete Vorgehen, als richte es sich gegen einen gefährlichen Gesetzesbrecher. »Räuber« gibt den üblichen Sinn wieder, während die Fußnote die weitere Bedeutungsbreite wahrt.
- source_word: ἐξήλθατε
  choice: Seid ihr ... ausgezogen
  rationale: »Ausziehen« bildet die Bewegung zum Ort der Festnahme und den unmittelbar vorausliegenden Aorist natürlich ab.
- source_word: μαχαιρῶν
  choice: Schwertern
  rationale: Im Zusammenhang einer bewaffneten Festnahme ist dies die gewöhnliche und angemessene Wiedergabe.
- source_word: ξύλων
  choice: Knüppeln
  rationale: Obwohl das Wort grundsätzlich Holz beziehungsweise hölzerne Gegenstände bezeichnet, meint es hier als Waffen verwendete Schlagstöcke.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die feindliche Stoßrichtung des Kommens werden beibehalten. »Führende Priester« vermeidet das im Deutschen potenziell missverständliche »Hohepriester« im Plural; »Befehlshaber der Tempelwache« macht die amtliche Sicherheitsfunktion transparent.
