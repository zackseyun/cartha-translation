  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: de
  text: Als die Stunde kam, ließ er sich zu Tisch nieder[a], und die Apostel mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die damals übliche liegende beziehungsweise zurückgelehnte Haltung beim Essen.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Als die Stunde gekommen war
  rationale: Die Wendung gibt den Eintritt des bestimmten, erwarteten Zeitpunkts natürlich wieder und bewahrt mit „die Stunde“ die narrative und mögliche theologische Prägnanz von ἡ ὥρα.
- source_word: ἀνέπεσεν
  choice: legte er sich zu Tisch
  rationale: ἀναπίπτω bezeichnet hier das Niederlegen beziehungsweise Zurücklehnen zur Mahlzeit. „Sich zu Tisch legen“ bewahrt die historisch konkrete Essenshaltung und ist verständlicher als das isolierte „sich niederlegen“.
- source_word: οἱ ἀπόστολοι
  choice: die Apostel
  rationale: Die direkte Wiedergabe des bestimmten Ausdrucks bezeichnet die bereits bekannte Gruppe, ohne das im Griechischen nicht ausdrücklich stehende Possessivpronomen „seine“ hinzuzufügen.
- source_word: σὺν αὐτῷ
  choice: mit ihm
  rationale: Die knappe Präpositionalphrase wird ebenso knapp und idiomatisch wiedergegeben. Das im Griechischen elliptische Prädikat lässt sich auch im Deutschen natürlich aus dem ersten Satzteil ergänzen.
- source_word: Καὶ
  choice: nicht eigens wiedergegeben
  rationale: Das einleitende καί verbindet den Vers schlicht mit dem vorherigen Geschehen. Im modernen deutschen Erzählstil stellt „Als“ diese Verbindung bereits natürlich her; ein zusätzliches „Und“ wäre möglich, aber schwerfälliger.
theological_decisions:
- issue: Bestimmtheit und mögliche heilsgeschichtliche Färbung von ἡ ὥρα
  choice: die Stunde
  alternative: die Zeit / der Zeitpunkt
  rationale: „Die Stunde“ hält die konkrete Formulierung des griechischen Textes und ihre mögliche weitergehende Resonanz offen, ohne sie ausdrücklich theologisch auszudeuten.
- issue: Körperhaltung beim Mahl
  choice: legte er sich zu Tisch
  alternative: setzte er sich zu Tisch
  rationale: Die historisch spezifische Bedeutung des Verbs wird nicht an moderne Tischsitten angeglichen. Die Übersetzung trifft damit eine sprachlich-kulturelle, keine konfessionelle Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die knappe Erzählweise und die Ellipse „und die Apostel mit ihm“. Die kulturgeschichtlich ungewohnte Formulierung wird durch eine kurze Fußnote erläutert.
