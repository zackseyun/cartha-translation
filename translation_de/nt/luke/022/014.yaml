  source_fidelity: Die Übersetzung gibt ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν sowie οἱ ἀπόστολοι σὺν αὐτῷ inhaltlich zutreffend wieder. Die bestimmte „Stunde“ bleibt erhalten, und die Fußnote erklärt die für heutige Leser ungewohnte Mahlhaltung angemessen.
  naturalness: „Sich zu Tisch legen“ ist verständlich, wirkt im modernen Standarddeutsch jedoch deutlich bibelsprachlich und kann ohne Erklärung zunächst missverständlich sein. „Sich zu Tisch niederlassen“ ist natürlicher; die Fußnote bewahrt dabei die konkret historische Bedeutung des griechischen Verbs.
  terminology: „Die Apostel“ ist korrekt und ohne interpretativ ergänztes Possessivpronomen wiedergegeben. Die kulturelle Erläuterung ist sachlich, nicht konfessionell und passend am Verb verankert.
