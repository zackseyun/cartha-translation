  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: de
  text: 'Denn ich sage euch: Ich werde es ganz gewiss nicht essen, bis es im Reich Gottes erfüllt ist.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde es nie wieder essen, bis es im Reich Gottes erfüllt ist.“ Das Griechische verneint ein künftiges Essen nachdrücklich. Manche Übersetzungen ergänzen aufgrund des Zusammenhangs „wieder“; im griechischen Text steht dieses Wort jedoch nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: „Es“ bezieht sich auf das im vorherigen Vers erwähnte Passa.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die geläufige Redeformel wird direkt wiedergegeben; „denn“ bewahrt den begründenden Anschluss an den vorherigen Vers.
- source_word: ὅτι
  choice: ':'
  rationale: Im Deutschen leitet ein Doppelpunkt nach der Redeformel den Inhalt natürlicher ein als ein ausdrücklich wiedergegebenes „dass“, ohne dessen Funktion zu verlieren.
- source_word: οὐ μὴ φάγω
  choice: Ich werde ... ganz gewiss nicht essen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung mit Zukunftsbezug. „ganz gewiss nicht“ gibt die Verstärkung in natürlichem modernem Deutsch wieder.
- source_word: αὐτό
  choice: es
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang auf das zuvor genannte Passa, ohne den Bezug im Haupttext näher festzulegen.
- source_word: ἕως ὅτου
  choice: bis
  rationale: „bis“ gibt die zeitliche Grenze knapp und idiomatisch wieder.
- source_word: πληρωθῇ
  choice: erfüllt ist
  rationale: Die Passivform und der Gedanke der Erfüllung bleiben erhalten; zugleich wird nicht festgelegt, worin diese Erfüllung genau besteht.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Die etablierte Wendung bewahrt sowohl den Gedanken der Herrschaft als auch den des Herrschaftsbereichs Gottes.
theological_decisions:
- issue: Bezug von αὐτό („es“)
  choice: Das Pronomen bleibt als „es“ stehen und verweist kontextuell auf das zuvor genannte Passa.
  alternative: „dieses Passamahl“ oder ein breiterer Bezug auf die Passafeier
  rationale: Der unmittelbare Kontext legt das Passa als Bezug nahe, doch die knappe pronominale Form des Griechischen soll im Haupttext nicht unnötig präzisiert werden.
- issue: Bedeutung von „im Reich Gottes erfüllt“
  choice: Die eschatologische Erfüllungssprache bleibt ohne nähere Erklärung erhalten.
  alternative: Erfüllung durch das Kommen des Reiches Gottes oder beim messianischen Festmahl
  rationale: Der griechische Text benennt weder den genauen Vorgang noch das konkrete Ereignis der Erfüllung; die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Verneinung wird verständlich ausgedrückt; die knappe Bezugnahme und die theologische Offenheit der Erfüllungsaussage bleiben gewahrt.
