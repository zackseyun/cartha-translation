  verdict: approve
  source_fidelity: Der Text gibt λέγω γὰρ ὑμῖν angemessen als „Denn ich sage euch“ wieder und bewahrt mit „ganz gewiss nicht“ die nachdrückliche Zukunftsverneinung οὐ μή φάγω. Das knappe αὐτό bleibt zutreffend als „es“ stehen. „bis es im Reich Gottes erfüllt ist“ entspricht ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ, einschließlich des Passivs und der offenen eschatologischen Aussage.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch und wahrt einen würdevollen biblischen Registerton. Der Doppelpunkt nach „ich sage euch“ ist idiomatisch. „im Reich Gottes erfüllt ist“ ist im Kontext verständlich und vermeidet eine interpretierende Umschreibung.
  terminology: „Reich Gottes“ ist die etablierte und sachgerechte Wiedergabe von βασιλεία τοῦ θεοῦ. Das Fußnotenvokabular „Passa“ ist fachlich korrekt; es legt den Referenten nicht enger als der griechische Kontext fest. Die Fußnote zu „nie wieder“ macht korrekt deutlich, dass „wieder“ nicht im griechischen Wortlaut steht.
