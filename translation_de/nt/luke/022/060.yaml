id: LUK.22.60
reference: Luke 22:60
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: de
  text: 'Petrus aber sagte: »Mensch, ich weiß nicht, was du sagst!« Und sofort, noch während er redete, krähte ein Hahn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Markiert den Kontrast zur unmittelbar vorausgehenden Beschuldigung und führt zugleich die Erzählung natürlich weiter.
- source_word: Ἄνθρωπε
  choice: Mensch
  rationale: Gibt die direkte vokativische Anrede an einen Mann knapp und unverblümt wieder, ohne sie durch das höflichere »mein Herr« interpretierend abzuschwächen.
- source_word: οὐκ οἶδα
  choice: ich weiß nicht
  rationale: Entspricht dem präsentischen Sinn von οἶδα mit Negation und ist im modernen Deutschen direkt und natürlich.
- source_word: ὃ λέγεις
  choice: was du sagst
  rationale: Bewahrt den unmittelbaren Wortlaut der Leugnung; »was du meinst« oder »wovon du redest« wären stärker deutend.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Drückt das Eintreten ohne jede Verzögerung klar und idiomatisch aus.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: noch während er redete
  rationale: Gibt den Genitivus absolutus und die durch ἔτι betonte zeitliche Überschneidung natürlich wieder.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: krähte ein Hahn
  rationale: Ist die übliche deutsche Ausdrucksweise für den Ruf eines Hahns und entspricht der unbestimmten Nominalphrase.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, schroffe Anrede und die zeitliche Unmittelbarkeit des Hahnenschreis bleiben erhalten. Keine Fußnote erforderlich; »Hahn« ist sowohl traditionell als auch gegenwärtig eindeutig.
