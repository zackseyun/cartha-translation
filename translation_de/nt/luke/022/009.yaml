  verdict: revise
  source_fidelity: 'Der Satz gibt die Sprecher, die Anrede Jesu, die Ortsfrage und die von θέλεις abhängige Aufforderung treffend wieder. Das ergänzte »es« ist durch den unmittelbaren Kontext (V. 8: das Passahmahl) gedeckt. Das einleitende »Da« kann δέ zwar aufnehmen, legt aber einen stärker zeitlich-konsekutiven Anschluss nahe, als der leichte griechische Anschluss erfordert.'
  naturalness: '»Sie sagten zu ihm: ›Wo willst du, dass wir es vorbereiten?‹« ist modernes, klares Standarddeutsch. Die direkte Wiedergabe von εἶπαν mit »sagten« ist trotz der Frage idiomatisch und wahrt die Nähe zum Ausgangstext.'
