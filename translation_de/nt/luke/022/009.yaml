  text: οἱ δὲ εἶπαν αὐτῷ· Ποῦ θέλεις ⸀ἑτοιμάσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: de
  text: 'Sie sagten zu ihm: »Wo willst du, dass wir es vorbereiten?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das im Griechischen nicht ausdrücklich genannte Objekt bezieht sich nach dem vorhergehenden Zusammenhang auf das Passahmahl.
    reason: contextual clarification
lexical_decisions:
- source_word: οἱ δὲ
  choice: Da … sie
  rationale: Der substantivierte Artikel bezeichnet im Zusammenhang die Jünger. δέ ist leicht weiterführend; »Da« gibt den Anschluss im Deutschen natürlich wieder, ohne einen starken Gegensatz einzuführen.
- source_word: εἶπαν αὐτῷ
  choice: sagten sie zu ihm
  rationale: Die Formulierung bildet das griechische »sie sagten zu ihm« genau und zugleich idiomatisch ab. Obwohl die direkte Rede eine Frage ist, muss εἶπαν nicht ausdrücklich mit »fragten« wiedergegeben werden.
- source_word: Ποῦ
  choice: Wo
  rationale: Das Frageadverb bezeichnet den Ort und wird unmittelbar mit »Wo« wiedergegeben.
- source_word: θέλεις
  choice: willst du
  rationale: θέλω bezeichnet hier Wollen bzw. Absicht. »Willst du« ist modernes, direktes und kontextgerechtes Deutsch.
- source_word: ἑτοιμάσωμεν
  choice: dass wir es vorbereiten
  rationale: Der Konjunktiv der ersten Person Plural nach θέλεις lässt sich im Deutschen natürlich durch einen dass-Satz wiedergeben. Das Objekt »es« ist im Griechischen unausgesprochen und wird aus Vers 8, dem Passahmahl, ergänzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Dialogform des griechischen Textes bleibt erhalten; das im Zusammenhang vorausgesetzte Objekt wird zur natürlichen deutschen Verständlichkeit als »es« ergänzt.
