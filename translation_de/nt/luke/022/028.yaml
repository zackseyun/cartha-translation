  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: de
  text: Ihr aber seid es, die in meinen Prüfungen[a] bei mir geblieben sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Versuchungen“ oder „Erprobungen“. Das griechische Wort kann Versuchung oder Prüfung bezeichnen; hier sind wahrscheinlich die schweren Erfahrungen gemeint, die Jesus durchstand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Ihr
  rationale: Das vorangestellte Personalpronomen trägt Nachdruck; zusammen mit „seid es, die“ wird diese Hervorhebung im Deutschen natürlich wiedergegeben.
- source_word: δέ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zum unmittelbar vorausgehenden Zusammenhang.
- source_word: οἱ διαμεμενηκότες
  choice: seid es, die … geblieben sind
  rationale: Die substantivierte Perfektpartizipialform bezeichnet eine bestimmte Gruppe, deren beständiges Ausharren bis zum gegenwärtigen Zeitpunkt reicht. Das deutsche Perfekt bewahrt diesen Gegenwartsbezug.
- source_word: μετ’ ἐμοῦ
  choice: bei mir
  rationale: Gibt die hier gemeinte persönliche Verbundenheit und Begleitung idiomatisch wieder; „mit mir“ wäre ebenfalls möglich, klingt in dieser Verbindung aber weniger natürlich.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: in meinen Prüfungen
  rationale: πειρασμός kann Prüfung, Versuchung oder Bedrängnis bezeichnen. „Prüfungen“ bewahrt die Mehrdeutigkeit besser als „Versuchungen“ und passt zu den während Jesu Wirken erduldeten Belastungen und Widerständen.
theological_decisions:
- issue: Bedeutung von πειρασμοῖς in Bezug auf Jesus
  choice: Prüfungen, die Jesus erlebte
  alternative: Versuchungen oder Bedrängnisse Jesu
  rationale: Der Kontext hebt das treue Verbleiben der Jünger bei Jesus während seiner schweren Erfahrungen hervor. „Prüfungen“ lässt sowohl äußere Erprobungen als auch die lexikalisch mögliche Versuchungsdimension offen, ohne eine bestimmte christologische Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „Ihr aber seid es, die …“ erhält den Nachdruck des vorangestellten Ὑμεῖς; „bei mir geblieben“ ist natürlich und relational klar.
