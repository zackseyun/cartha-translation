review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den betonten Gegensatz von Ὑμεῖς δέ mit „Ihr aber“ angemessen wieder. „seid es, die … geblieben sind“ bildet die substantivierte Perfektpartizipialform οἱ διαμεμενηκότες treffend ab; das Perfekt wahrt die bis zur Sprechsituation reichende Dauer. „bei mir“ gibt μετ’ ἐμοῦ in diesem relationalen Zusammenhang idiomatisch und sinnentsprechend wieder. „in meinen Prüfungen“ ist eine tragfähige, kontextuell passende Wiedergabe von ἐν τοῖς πειρασμοῖς μου und wird durch die Anmerkung sinnvoll lexikalisch geöffnet.
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. Die Hervorhebung „Ihr aber seid es, die …“ ist leicht gehoben, aber klar und für den Jesu zugeschriebenen Ausspruch passend. Die Stellung „in meinen Prüfungen bei mir“ ist verständlich und natürlich.
  terminology: „Prüfungen“ bewahrt gegenüber „Versuchungen“ die im griechischen πειρασμός bestehende Bedeutungsweite und passt zum erzählerischen Kontext. Die Fußnote nennt die wesentlichen Alternativen und legt die schwierige Stelle nicht dogmatisch fest. Der Fußnotenanker steht unmittelbar beim betreffenden Ausdruck.
