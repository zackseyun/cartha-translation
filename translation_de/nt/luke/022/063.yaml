  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: de
  text: Und die Männer, die ihn festhielten, verspotteten ihn, während sie ihn schlugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihn in Gewahrsam hielten“.'
    reason: Lexikalische Alternative für συνέχοντες; sie betont den Aspekt des In-Gewahrsam-Haltens gegenüber dem konkreteren „festhielten“.
lexical_decisions:
- source_word: Καί
  choice: Und
  rationale: Der schlichte Anschluss bewahrt den fortlaufenden Erzählfluss des griechischen Textes.
- source_word: οἱ ἄνδρες
  choice: die Männer
  rationale: Das Griechische bezeichnet sie ausdrücklich als Männer und nicht näher als Wachen oder Soldaten.
- source_word: οἱ συνέχοντες αὐτόν
  choice: die ihn festhielten
  rationale: συνέχω bezeichnet hier das körperliche Festhalten beziehungsweise Gewahrsamhalten Jesu. „Festhielten“ ist natürlich und konkret, ohne einen formellen Haftstatus einzutragen.
- source_word: ἐνέπαιζον αὐτῷ
  choice: verspotteten ihn
  rationale: ἐμπαίζω bezeichnet feindseliges Verhöhnen oder Verspotten; im Deutschen steht das Objekt idiomatisch im Akkusativ.
- source_word: δέροντες
  choice: und schlugen ihn
  rationale: Das Partizip bezeichnet begleitende körperliche Schläge. Die Beiordnung ist im Deutschen natürlich und erhält den durativen Zusammenhang, ohne das unspezifische Verb als „auspeitschen“ zu verengen.
theological_decisions:
- issue: Identität der Männer, die Jesus misshandelten
  choice: die Männer, die ihn festhielten
  alternative: die Wachen, die ihn festhielten
  rationale: Der Vers selbst verwendet das allgemeine ἄνδρες. Obwohl der Zusammenhang auf Bewacher schließen lässt, wird ihre Funktion nicht an die Stelle der ausdrücklichen Bezeichnung gesetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung bleibt nah an der griechischen Syntax, wird aber durch die natürliche deutsche Beiordnung von „verspotteten“ und „schlugen“ geglättet.
