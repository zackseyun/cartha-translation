  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: de
  text: Sie zündeten mitten im Hof ein Feuer an und setzten sich zusammen. Petrus saß mitten unter ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Petrus saß in ihrer Mitte.« Das griechische Imperfekt kann schlicht mit »saß« wiedergegeben werden; es beschreibt Petrus als dort sitzend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: Sie zündeten … ein Feuer an
  rationale: Der Aoristpartizip bezeichnet die dem Sitzen vorausgehende Handlung. Die finite Wiedergabe in einem eigenen deutschen Hauptsatz ist natürlich und wahrt die zeitliche Abfolge.
- source_word: πῦρ
  choice: ein Feuer
  rationale: Im Deutschen verlangt das konkrete, hier entzündete Feuer idiomatisch den unbestimmten Artikel.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: mitten im Hof
  rationale: Die Formulierung gibt die konkrete räumliche Lage knapp und natürlich wieder; αὐλή bezeichnet hier den Innenhof des Anwesens.
- source_word: συγκαθισάντων
  choice: setzten sich zusammen
  rationale: Der Aoristpartizip steht parallel zu περιαψάντων; die Vorsilbe συν- bezeichnet das gemeinsame Sitzen.
- source_word: ἐκάθητο
  choice: saß
  rationale: Das deutsche Präteritum ist hier idiomatisch und kann den im Hintergrund andauernden Zustand des griechischen Imperfekts ausdrücken.
- source_word: μέσος αὐτῶν
  choice: mitten unter ihnen
  rationale: Die prädikative Verbindung mit dem Genitiv lokalisiert Petrus innerhalb der Gruppe und wird im Deutschen anschaulich und natürlich wiedergegeben.
- source_word: δὲ
  choice: unmarkierter Erzählanschluss
  rationale: Das schwach weiterführende δέ muss im Deutschen nicht eigens mit »und« oder »aber« markiert werden; die Satzfolge trägt den narrativen Anschluss.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Zwei Hauptsätze vermeiden eine schwerfällige deutsche Partizipialkonstruktion; »mitten« nimmt die zweimalige räumliche Mitte des griechischen Textes auf.
