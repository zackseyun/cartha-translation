id: LUK.22.59
reference: Luke 22:59
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: de
  text: 'Und als etwa eine Stunde vergangen war, behauptete ein anderer nachdrücklich: »Dieser war wirklich auch bei ihm; er ist ja ebenfalls ein Galiläer.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: als etwa eine Stunde vergangen war
  rationale: Der Genitivus absolutus bezeichnet den Ablauf einer ungefähren Zeitspanne; die deutsche Formulierung ist natürlich und gibt sowohl den zeitlichen Bezug als auch ὡσεὶ wieder.
- source_word: ἄλλος τις
  choice: ein anderer
  rationale: Die indefinite Wendung bezeichnet einen weiteren Sprecher. Das maskuline »ein anderer« passt zum grammatischen und erzählerischen Zusammenhang, ohne das unbestimmte τις unnötig zu präzisieren.
- source_word: διϊσχυρίζετο
  choice: behauptete nachdrücklich
  rationale: Die Form bezeichnet eine nachdrückliche Versicherung; das Imperfekt wird im deutschen Erzählstil idiomatisch mit dem Präteritum wiedergegeben.
- source_word: Ἐπ’ ἀληθείας
  choice: wirklich
  rationale: Das Adverb gibt die bekräftigende Wahrheitsbehauptung in natürlichem modernem Deutsch wieder.
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist pointiert und möglicherweise anklagend auf Petrus; »Dieser« bewahrt diese deiktische Kraft.
- source_word: μετ’ αὐτοῦ ἦν
  choice: war … bei ihm
  rationale: Die Formulierung gibt die behauptete Gemeinschaft direkt wieder, ohne daraus ausdrücklich eine Jüngerschaft abzuleiten.
- source_word: καὶ γὰρ
  choice: ja ebenfalls
  rationale: »Ja« führt die begründende Bestätigung durch γάρ ein, während »ebenfalls« die additive Bedeutung von καί bewahrt.
- source_word: Γαλιλαῖός ἐστιν
  choice: er ist … ein Galiläer
  rationale: Die prädikative Bezeichnung identifiziert Petrus unmittelbar nach seiner regionalen Herkunft.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt nachdrücklich und bewahrt durch »Dieser« den zeigenden, anklagenden Charakter. Keine Fußnote ist nötig, da »ein anderer« die Unbestimmtheit von ἄλλος τις im Deutschen hinreichend erhält.
