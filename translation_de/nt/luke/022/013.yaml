  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: de
  text: Sie gingen hin und fanden es so vor, wie er es ihnen gesagt hatte, und sie bereiteten das Passafest[a] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Passamahl“ oder „das Passalamm“. Das griechische Wort kann das Passafest insgesamt oder genauer das Mahl beziehungsweise das Opferlamm bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: Sie gingen hin und
  rationale: Das Aoristpartizip bezeichnet die dem Finden vorausgehende Handlung; eine finite Verbfolge klingt im Deutschen natürlich. δέ führt die Erzählung ohne starken Gegensatz weiter und wird durch den Satzanschluss hinreichend wiedergegeben.
- source_word: εὗρον
  choice: fanden alles
  rationale: Das griechische Verb hat kein ausdrücklich genanntes Objekt. „Alles“ nimmt idiomatisch die zuvor beschriebenen Umstände auf, ohne einen bestimmten Einzelgegenstand zu behaupten.
- source_word: καθὼς
  choice: so, wie
  rationale: Die Wendung drückt die genaue Übereinstimmung zwischen Jesu vorheriger Aussage und dem Vorgefundenen aus.
- source_word: εἰρήκει αὐτοῖς
  choice: er es ihnen gesagt hatte
  rationale: Der Plusquamperfekt gibt die zeitlich vorausliegende Äußerung wieder. „gesagt hatte“ bleibt näher am allgemeineren λέγω als das stärker auf Anweisungen festgelegte „aufgetragen hatte“.
- source_word: ἡτοίμασαν
  choice: sie bereiteten … vor
  rationale: Die trennbare deutsche Verbform gibt die Bedeutung „vorbereiten, bereitmachen“ natürlich und präzise wieder.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: πάσχα kann das Passafest als Ganzes sowie in engerem Sinn das Passamahl oder Passalamm bezeichnen. „Passafest“ bewahrt im Haupttext den weiteren Bezug; die möglichen engeren Bedeutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von πάσχα im Kontext
  choice: das Passafest
  alternative: das Passamahl; das Passalamm
  rationale: Der unmittelbare Zusammenhang betrifft die Vorbereitung zum Essen des Passa, doch der griechische Ausdruck legt nicht eindeutig fest, ob Fest, Mahl oder Opferlamm gemeint ist. Die weitere Wiedergabe wahrt diese Offenheit.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die finite Verbfolge vermeidet eine schwerfällige Partizipialkonstruktion; „Passafest“ ist allgemein verständlich und lässt die Bedeutungsbreite des griechischen Ausdrucks bestehen.
