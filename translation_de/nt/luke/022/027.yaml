id: LUK.22.27
reference: Luke 22:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: de
  text: 'Denn wer ist größer: der, der zu Tisch liegt,[a] oder der, der bedient? Ist es nicht der, der zu Tisch liegt? Ich aber bin unter euch wie einer, der bedient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Damals lagen die Gäste bei einem Festmahl gewöhnlich auf Polstern, während andere sie bedienten.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Denn wer ist größer
  rationale: „Denn“ wahrt die begründende Verbindung zum vorherigen Zusammenhang; „größer“ erhält den offenen Vergleich von Rang oder Bedeutung, ohne ihn enger auszulegen.
- source_word: ὁ ἀνακείμενος
  choice: der, der zu Tisch liegt
  rationale: Das Verb bezeichnet im antiken Mahlkontext das Liegen beim Essen. Die Formulierung bildet die damalige Tischsitte verständlich und relativ formal ab.
- source_word: ὁ διακονῶν
  choice: der, der bedient
  rationale: Das Partizip beschreibt hier die Tätigkeit des Aufwartens beim Mahl. „Bedient“ bewahrt den unmittelbaren Gegensatz zum Tischgast und vermeidet eine unnötige kirchenamtliche Färbung.
- source_word: οὐχὶ
  choice: Ist es nicht
  rationale: Die rhetorische Frage erwartet Zustimmung; diese deutsche Wendung gibt das klar wieder.
- source_word: ἐγὼ δὲ
  choice: Ich aber
  rationale: Die Wortstellung hebt Jesus hervor, während „aber“ den Gegensatz zur üblichen Rangordnung markiert.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: bin unter euch
  rationale: „Unter euch“ ist eine natürliche, würdige deutsche Entsprechung für die Gegenwart innerhalb der Gruppe.
- source_word: ὡς ὁ διακονῶν
  choice: wie einer, der bedient
  rationale: „Wie“ erhält den vergleichenden beziehungsweise rollenbeschreibenden Charakter von ὡς; die verbale Formulierung vermeidet die stärkere Festlegung auf die Personenbezeichnung „Diener“.
theological_decisions:
- issue: Jesu Selbstbeschreibung durch die Sprache des Dienens
  choice: Ich aber bin unter euch wie einer, der bedient.
  alternative: Ich aber bin unter euch wie ein Diener.
  rationale: Der griechische Text verwendet das Partizip διακονῶν und nicht ein Substantiv für einen Diener oder Sklaven. Die gewählte Fassung bewahrt die konkrete Tätigkeit im Mahlkontext und Jesu Umkehrung üblicher Rangvorstellungen, ohne einen stärkeren Statusbegriff einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Zu Tisch liegt“ bewahrt bewusst das historische Bild; die Fußnote erklärt die antike Mahlpraxis. Die Wiederholung von „der, der“ folgt der parallelen Struktur des griechischen Textes.
