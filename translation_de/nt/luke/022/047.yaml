  to: Während er noch redete, siehe, da kam eine Menschenmenge. Einer namens Judas, einer der Zwölf, ging ihnen voraus und näherte sich Jesus, um ihn zu küssen.[a]
  rationale: Die notwendige Korrektur ersetzt die grammatisch fehlerhafte Wiedergabe „Der Judas genannt wurde“ durch das natürliche und wertungsfreie „Einer namens Judas“. Damit bleibt die identifizierende Aussage des griechischen ὁ λεγόμενος Ἰούδας erhalten, ohne die abwertende oder zweifelnde Konnotation von „der sogenannte“ einzutragen. Der restliche Vers und die Fußnote bleiben inhaltlich bestehen.
