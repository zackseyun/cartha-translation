reference: Luke 22:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: de
  text: Während er noch redete, siehe, da kam eine Menschenmenge. Einer namens Judas, einer der Zwölf, ging ihnen voraus und näherte sich Jesus, um ihn zu küssen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »führte sie an« / »ging vor ihnen her«.'
    reason: 'Lexikalische Alternative: προήρχετο kann sowohl das Vorausgehen als auch, dem Zusammenhang nach, das Anführen der Gruppe ausdrücken.'
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Während er noch redete
  rationale: Der Genitivus absolutus bezeichnet eine noch andauernde Handlung, die gleichzeitig mit dem Folgenden geschieht. Die Formulierung ist natürlich und bewahrt die zeitliche Kraft von ἔτι.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Die Wendung erhält den aufmerksamkeitslenkenden, die Erzählung belebenden Charakter von ἰδοὺ, ohne das nicht ausdrücklich im Ausgangstext stehende »plötzlich« einzufügen.
- source_word: ὄχλος
  choice: da kam eine Menschenmenge
  rationale: ὄχλος bezeichnet eine Menschenmenge. Das im Griechischen nicht ausgedrückte Verb »kam« wird für einen vollständigen und natürlichen deutschen Satz aus dem erzählerischen Zusammenhang ergänzt.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Der Judas genannt wurde
  rationale: Diese Wiedergabe folgt der identifizierenden Partizipialkonstruktion eng und vermeidet den im Deutschen abwertend oder zweifelnd klingenden Ausdruck »der sogenannte Judas«.
- source_word: εἷς τῶν δώδεκα
  choice: einer der Zwölf
  rationale: Die übliche deutsche Wendung bewahrt sowohl die Identifizierung als auch die erzählerische Spannung, dass Judas zum Kreis der Zwölf gehört.
- source_word: προήρχετο αὐτούς
  choice: ging ihnen voraus
  rationale: Die Formulierung gibt die räumliche Grundbedeutung und den imperfektischen Verlauf wieder, ohne eindeutig festzulegen, ob Judas die Gruppe förmlich anführte.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: näherte sich Jesus
  rationale: Dies ist eine knappe, natürliche Wiedergabe der Annäherung, die ἐγγίζω mit dem Dativ ausdrückt.
- source_word: φιλῆσαι αὐτόν
  choice: um ihn zu küssen
  rationale: Der finale Infinitiv wird ausdrücklich als Absicht wiedergegeben. »Küssen« bewahrt den schlichten Wortsinn, ohne die Funktion des Kusses erklärend in den Haupttext einzutragen.
theological_decisions:
- issue: Erzählerische Darstellung von Judas’ Handlung
  choice: Annäherung und beabsichtigten Kuss ohne deutende Ergänzung wiedergeben
  alternative: »um ihn mit einem Kuss zu verraten«
  rationale: Der Verrat ist aus dem Zusammenhang deutlich, doch der Vers selbst beschreibt hier Judas’ Annäherung und seine Absicht zu küssen. Die Übersetzung soll die moralische und theologische Deutung nicht über den griechischen Wortlaut hinaus in diesen Satz einfügen.
- issue: Rolle des Judas gegenüber der Menschenmenge
  choice: »ging ihnen voraus«
  alternative: »führte sie an«
  rationale: Das Verb kann im Zusammenhang ein Anführen nahelegen, bezeichnet zunächst aber das Vorausgehen. Der Haupttext bewahrt diese Offenheit; die mögliche Führungsnuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« ist bewusst als markierter erzählerischer Aufmerksamkeitsruf beibehalten. Die Satzstruktur wurde gegenüber dem langen griechischen Satz leicht gegliedert, um gute Verständlichkeit zu gewährleisten; die inhaltlichen Beziehungen bleiben erhalten.
