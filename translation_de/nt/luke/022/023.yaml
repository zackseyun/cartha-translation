id: LUK.22.23
reference: Luke 22:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: de
  text: Und sie begannen, miteinander darüber zu sprechen, wer von ihnen es wohl sein könnte, der im Begriff war, dies zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer es wohl unter ihnen sein könnte, der im Begriff war, dies zu tun“. Mit „dies“ ist der im vorhergehenden Vers angekündigte Verrat gemeint.'
    reason: Alternative Wortstellung und Erläuterung des kontextuellen Bezugs von „dies“.
lexical_decisions:
- source_word: ἤρξαντο
  choice: begannen
  rationale: Der ingressiv gebrauchte Aorist mit Infinitiv bezeichnet den Beginn der Handlung; „begannen“ gibt dies natürlich wieder.
- source_word: συζητεῖν
  choice: darüber zu sprechen
  rationale: Das Verb bezeichnet gemeinsames Erörtern oder Diskutieren. „Darüber zu sprechen“ passt zum suchenden Austausch, ohne einen Streit zu unterstellen.
- source_word: πρὸς ἑαυτούς
  choice: miteinander
  rationale: Die Wendung bezeichnet die wechselseitige Kommunikation innerhalb der Gruppe; „miteinander“ ist im Deutschen natürlich und präzise.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: wer von ihnen es wohl sein könnte
  rationale: Die indirekte Frage wird im Deutschen idiomatisch ohne Wiedergabe des nominalisierenden Artikels formuliert. „wohl“ bewahrt die erwägende Kraft von ἄρα, „sein könnte“ die Unsicherheit des Optativs εἴη.
- source_word: ὁ τοῦτο μέλλων πράσσειν
  choice: der dies tun würde
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet denjenigen, der die angekündigte Tat vollziehen sollte. Im Deutschen ist „der dies tun würde“ natürlicher als das schwerfällige „der im Begriff war, dies zu tun“; die bevorstehende Handlung ergibt sich aus dem Kontext.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf die zuvor angekündigte Tat, ohne sie in diesem Vers ausdrücklich als Verrat zu benennen.
theological_decisions:
- issue: Soll die angekündigte Tat ausdrücklich als Verrat bezeichnet werden?
  choice: Die allgemeinere Formulierung „dies tun“ bleibt im Haupttext erhalten.
  alternative: „der ihn verraten würde“
  rationale: Obwohl der Zusammenhang eindeutig vom Verrat spricht, steht im griechischen Vers nur τοῦτο („dies“). Die Übersetzung macht nicht ausdrücklich, was der Ausgangstext hier implizit lässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung wahrt die erwägende Unsicherheit der indirekten Frage und lässt den Verrat im Haupttext ebenso implizit wie der griechische Ausgangstext.
