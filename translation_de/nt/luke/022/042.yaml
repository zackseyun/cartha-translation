  source_fidelity: 'Die Übersetzung gibt alle maßgeblichen Elemente des griechischen Textes angemessen wieder: die Anrede »Vater«, die bedingte Bitte »wenn du willst«, den Imperativ hinsichtlich des »Kelchs«, den concessiven Übergang und die Gegenüberstellung von Jesu Willen und dem Willen des Vaters. »und sagte« ist als natürliche deutsche Einbindung des Partizips λέγων im Erzählzusammenhang vertretbar.'
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. »Nimm diesen Kelch von mir« und »Doch nicht mein Wille, sondern deiner soll geschehen« sind idiomatisch und bewahren den feierlichen Gebetsregister ohne unnötige Archaisierung.
  terminology: »Kelch« erhält die bildhafte und biblisch resonante Terminologie des griechischen ποτήριον. Die Gegenüberstellung von »mein Wille« und »deiner« bewahrt die nominale Form des Ausgangstextes und löst die theologische Spannung nicht interpretierend auf.
