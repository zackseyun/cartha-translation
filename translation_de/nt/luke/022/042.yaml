id: LUK.22.42
reference: Luke 22:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: de
  text: 'und sagte: »Vater, wenn du willst, nimm diesen Kelch[a] von mir. Doch nicht mein Wille, sondern deiner soll geschehen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Kelch« ist in der Bibel ein Bild für das einem Menschen zugemessene Los, besonders für Leiden oder Gericht.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: »Doch nicht, was ich will, sondern was du willst, soll geschehen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Präsenspartizip leitet den Inhalt des Gebets ein. Im Deutschen gibt eine finite Form die Verknüpfung im fortlaufenden Erzählzusammenhang natürlicher wieder.
- source_word: Πάτερ
  choice: Vater
  rationale: Die direkte Anrede Gottes wird schlicht und ohne altertümlichen Anredepartikel wiedergegeben.
- source_word: εἰ βούλει
  choice: wenn du willst
  rationale: βούλομαι bezeichnet hier Wollen oder Bereitsein; die Formulierung ist im modernen Deutsch natürlich und bewahrt die Bedingung.
- source_word: παρένεγκε … ἀπ’ ἐμοῦ
  choice: nimm … von mir
  rationale: Der Aoristimperativ von παραφέρω bittet im Zusammenhang darum, den Kelch von Jesus wegzunehmen. Die deutsche Wendung ist klar und idiomatisch.
- source_word: τοῦτο τὸ ποτήριον
  choice: diesen Kelch
  rationale: Das Bild des Kelches bleibt erhalten, da es im biblischen Sprachgebrauch eine zugeteilte Erfahrung, besonders Leiden oder Gericht, bezeichnen kann und intertextuell bedeutsam ist.
- source_word: πλὴν
  choice: Doch
  rationale: Die Konjunktion markiert den entschiedenen Übergang von der Bitte zur Unterordnung; „Doch“ gibt diesen Gegensatz knapp und würdig wieder.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: nicht mein Wille, sondern deiner
  rationale: Die nominale Gegenüberstellung des griechischen Textes bleibt erhalten. Bei „deiner“ ist „Wille“ im Deutschen eindeutig mitzudenken.
- source_word: γινέσθω
  choice: soll geschehen
  rationale: Der Imperativ der dritten Person bringt den Wunsch zum Ausdruck, dass der Wille des Vaters Wirklichkeit werde. „Soll geschehen“ ist natürlich und wahrt den imperativischen Sinn.
theological_decisions:
- issue: Verhältnis zwischen Jesu Willen und dem Willen des Vaters
  choice: nicht mein Wille, sondern deiner soll geschehen
  alternative: nicht, was ich will, sondern was du willst, soll geschehen
  rationale: Die Übersetzung bewahrt die ausdrückliche Unterscheidung der beiden Willensäußerungen und Jesu Unterordnung unter den Vater, ohne die theologische Spannung durch eine spätere dogmatische Erklärung aufzulösen.
- issue: Bildhafte Bedeutung des Kelches
  choice: Kelch im Haupttext beibehalten
  alternative: dieses Leiden / diese Prüfung
  rationale: Eine ausdeutende Wiedergabe würde das biblische Bild auf nur eine Bedeutung festlegen und seine Bezüge zu zugemessenem Leiden und Gericht abschwächen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die traditionelle Bildsprache „Kelch“ und die knappe Gegenüberstellung der Willen bleiben erhalten; altertümliche Formen werden vermieden.
