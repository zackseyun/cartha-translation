id: LUK.22.67
reference: Luke 22:67
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: de
  text: 'und sagten: „Wenn du der Messias[a] bist, dann sag es uns!“ Er aber sagte zu ihnen: „Wenn ich es euch sage, werdet ihr es ganz gewiss nicht glauben;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: Alternative traditionelle Wiedergabe des Titels ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip führt die direkte Rede ein und knüpft an den vorausgehenden Satz an; die finite Form ist im modernen Deutschen natürlicher.
- source_word: Εἰ σὺ εἶ
  choice: Wenn du … bist
  rationale: Bewahrt ausdrücklich die bedingte Form des Griechischen, statt sie zu einer direkten Frage zu glätten.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier ein Titel im Rahmen jüdischer messianischer Erwartungen; „Messias“ gibt diesen Sinn im Deutschen unmittelbar wieder.
- source_word: εἰπὸν ἡμῖν
  choice: dann sag es uns
  rationale: Die Ergänzung „es“ macht die deutsche Form idiomatisch; „dann“ verdeutlicht die Folgerung des bedingten Aufforderungssatzes, ohne dessen Sinn zu verändern.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Er aber sagte zu ihnen
  rationale: „aber“ gibt den milden Gegensatz beziehungsweise Übergang von δέ wieder und wahrt einen würdevollen Erzählstil.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Wenn ich es euch sage
  rationale: Die natürliche deutsche Bedingungsform bewahrt die konditionale Aussage des Aorist-Konjunktivs.
- source_word: οὐ μὴ πιστεύσητε
  choice: werdet ihr es ganz gewiss nicht glauben
  rationale: „ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή klar und gegenwärtig zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Im Verhörkontext bezeichnet der Ausdruck den erwarteten Gesalbten. „Messias“ erhält diesen jüdischen Erwartungshorizont; die traditionelle Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die konditionale Herausforderung und die emphatische Verneinung bleiben erhalten; das abschließende Semikolon signalisiert den Satzfortgang in Vers 68.
