source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: de
  text: 'Nachdem er einen Becher[a] entgegengenommen und gedankt hatte, sagte er: »Nehmt diesen und teilt ihn unter euch[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Kelch«. Im Griechischen steht das Wort ohne Artikel; der Mahlkontext kann dennoch einen bestimmten Becher meinen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verteilt ihn unter euch«. Das Verb kann je nach Zusammenhang »teilen« oder »verteilen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: nachdem er … entgegengenommen … hatte
  rationale: Der Aoristpartizip bezeichnet eine Handlung, die dem Hauptverb vorausgeht. Die Konstruktion mit »nachdem« gibt diese zeitliche Abfolge in natürlichem Deutsch wieder; »entgegengenommen« wahrt den rezeptiven Sinn von δέχομαι.
- source_word: ποτήριον
  choice: einen Kelch
  rationale: Das griechische Substantiv steht ohne Artikel. »Einen Kelch« bildet dies ab und passt zum festlichen Mahlkontext; »Becher« wäre ebenfalls möglich, klingt hier jedoch weniger würdevoll.
- source_word: εὐχαριστήσας
  choice: gedankt hatte
  rationale: Die einfache verbale Form gibt den Dank wieder, ohne einen im Griechischen unausgesprochenen Empfänger hinzuzufügen oder einen späteren eucharistischen Fachbegriff einzutragen.
- source_word: εἶπεν
  choice: sagte er
  rationale: Das Griechische nennt keinen ausdrücklichen indirekten Empfänger. Daher wird »zu ihnen« nicht ergänzt.
- source_word: Λάβετε
  choice: Nehmt
  rationale: Der Aoristimperativ von λαμβάνω bezeichnet hier die konkrete Aufforderung, den Kelch zu nehmen.
- source_word: τοῦτο
  choice: diesen
  rationale: Das Demonstrativpronomen verweist auf den zuvor genannten Kelch. Wegen des grammatischen Geschlechts im Deutschen ist »diesen« die natürliche Entsprechung, ohne das Substantiv zu wiederholen.
- source_word: διαμερίσατε
  choice: teilt
  rationale: Das Verb kann sowohl »teilen« als auch »verteilen« bedeuten. »Teilt … unter euch« bleibt nahe an der Grundbedeutung und ist im Zusammenhang verständlich.
- source_word: εἰς ἑαυτούς
  choice: unter euch
  rationale: Die Wendung bezeichnet hier die Verteilung innerhalb der Gruppe. »Unter euch« gibt den wechselseitigen Bezug idiomatisch wieder.
theological_decisions:
- issue: Ob spätere eucharistische oder liturgische Fachsprache verwendet werden soll
  choice: 'Schlichte Erzählsprache: »einen Kelch« und »gedankt hatte«'
  alternative: »den Kelch« oder ausdrücklich sakramental geprägte Formulierungen
  rationale: Der griechische Text schildert Jesu Handeln beim Mahl, ohne an dieser Stelle spätere kirchliche Terminologie ausdrücklich zu verwenden. Die Übersetzung wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorzeitige Partizipialkomplex wird für gute Verständlichkeit als Nebensatz wiedergegeben. Die Formulierung vermeidet sowohl unnötig altertümliche Sprache als auch eine konfessionell festgelegte Deutung.
