  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: de
  text: 'Und er sandte Petrus und Johannes und sagte: »Geht und bereitet für uns das Passamahl[a] vor, damit wir es essen können.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Passa«. Das griechische Wort kann das Passa auch umfassender bezeichnen; hier weist der Zusammenhang von Vorbereiten und Essen besonders auf das Mahl hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Das schlichte narrative »sandte« gibt den Aorist von ἀποστέλλω präzise und in würdigem, modernem Deutsch wieder.
- source_word: εἰπών
  choice: und sagte
  rationale: Das griechische Partizip leitet die direkte Rede ein. Im Deutschen ist die koordinierte Form natürlicher als das schwerfällige »indem er sagte«.
- source_word: Πορευθέντες
  choice: Geht
  rationale: Das Aoristpartizip hat zusammen mit dem folgenden Imperativ auffordernde Begleitumstandsfunktion; »Geht« bildet diese Kraft idiomatisch ab.
- source_word: ἑτοιμάσατε
  choice: bereitet … vor
  rationale: Die trennbare Verbform »vorbereiten« bezeichnet klar die erforderlichen praktischen Vorbereitungen.
- source_word: ἡμῖν
  choice: für uns
  rationale: Der Dativ bezeichnet hier den Nutzen beziehungsweise die Begünstigten, ohne ein zusätzliches »alle« auszudrücken.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: »Passafest« bewahrt die mögliche Bedeutungsbreite von πάσχα. Der Zusammenhang mit dem Essen legt besonders das Passamahl nahe, ohne dass der Haupttext den Ausdruck darauf verengt.
- source_word: ἵνα φάγωμεν
  choice: damit wir es essen können
  rationale: »Damit« gibt den Zwecksinn von ἵνα mit Konjunktiv wieder; »es« macht das im Deutschen aus dem Zusammenhang erschlossene Objekt deutlich.
theological_decisions:
- issue: Bedeutungsumfang von τὸ πάσχα
  choice: das Passafest
  alternative: das Passamahl; das Passalamm
  rationale: Vorbereitung und Essen weisen im unmittelbaren Zusammenhang auf das Mahl. Der griechische Ausdruck kann jedoch auch das Passa umfassender oder ein damit verbundenes Opfer bezeichnen; die Hauptübersetzung bewahrt diese Offenheit, während die Fußnote den kontextuell naheliegenden Mahlsinn nennt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzverknüpfung folgt dem schlichten Erzählstil des Griechischen; die direkte Rede bleibt natürlich und prägnant.
