review_pass:
  verdict: revise
  source_fidelity: Die Personen, der Sendungsakt, die Aufforderung zum Gehen und Vorbereiten sowie der Zwecksatz sind korrekt wiedergegeben. »Passafest« ist im Deutschen jedoch keine tragfähige Wiedergabe an einer Stelle, an der das Bezugsobjekt ausdrücklich gegessen wird. Im Kontext bezeichnet τὸ πάσχα am natürlichsten das Passamahl; die weiter gefasste lexikalische Möglichkeit kann die Fußnote erhalten.
  naturalness: Der Satzbau und die direkte Rede sind modernes, klares Standarddeutsch. Die Verbindung »das Passafest … essen« wirkt jedoch semantisch unnatürlich, weil ein Fest nicht gegessen wird. »das Passamahl« beseitigt dieses Problem.
  terminology: »Passamahl« ist hier der sachgerechte deutsche Ausdruck. Die Fußnote wahrt, dass πάσχα je nach Zusammenhang auch das Passa umfassender bezeichnen kann, ohne die unmittelbare Mahlzeitreferenz im Haupttext zu verschleiern.
  issues:
  - severity: medium
    issue: »Passafest« wird als Gegenstand von »essen« verwendet.
    rationale: Das griechische τὸ πάσχα kann zwar einen weiteren Passabezug haben, doch die Kombination aus Zubereiten und Essen bezieht sich hier kontextuell auf die Mahlzeit. Im modernen Deutschen ist ein »Passafest« nicht etwas, das man isst; »Passamahl« ist daher sowohl idiomatischer als auch kontexttreuer.
