  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: de
  text: Und er entfernte sich etwa einen Steinwurf von ihnen[a], kniete nieder[b] und war am Beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ungefähr so weit, wie man einen Stein werfen kann“.'
