  - marker: b
    text: 'Wörtlich: „setzte die Knie“, das heißt: Er kniete nieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: entfernte sich
  rationale: Die formal passive Form bezeichnet hier idiomatisch, dass Jesus sich von den Jüngern absonderte. „Entfernte sich“ klingt im Deutschen natürlich, ohne eine äußere Einwirkung anzudeuten.
- source_word: ὡσεὶ λίθου βολήν
  choice: etwa einen Steinwurf weit
  rationale: Die geläufige deutsche Entfernungsangabe bewahrt sowohl das Bild des Steinwurfs als auch die durch ὡσεὶ ausgedrückte Ungefährheit.
- source_word: θεὶς τὰ γόνατα
  choice: kniete nieder
  rationale: Die wörtliche Wendung „die Knie setzend“ ist ein Idiom für das Niederknien. Die gewählte Form gibt Körperhaltung und Handlung klar und würdig wieder.
- source_word: προσηύχετο
  choice: betete
  rationale: Das Imperfekt stellt das Beten als andauernden Vorgang dar. Im natürlichen deutschen Erzählstil kann das Präteritum diesen Verlauf ausdrücken, ohne einen Beginn hinzuzufügen.
- source_word: αὐτὸς
  choice: er
  rationale: Das Pronomen trägt eine leichte Hervorhebung, doch „er selbst“ wäre im deutschen Zusammenhang unnötig schwer; das ausdrücklich gesetzte „er“ wahrt den Subjektbezug.
- source_word: καὶ
  choice: Und
  rationale: „Und“ erhält die schlichte narrative Verknüpfung des griechischen Textes, ohne eine zusätzliche zeitliche oder folgernde Deutung einzutragen.
theological_decisions:
- issue: Gebetshaltung und christologische Darstellung
  choice: Jesu räumliches Sich-Entfernen, sein Niederknien und sein Beten werden ohne weitere Ausdeutung wiedergegeben.
  alternative: Die Szene durch eine zusätzliche Aussage über Andacht, Unterwerfung oder die Person Christi theologisch auszulegen.
  rationale: Der Vers berichtet nüchtern Jesu Handlung und Gebetshaltung. Die Übersetzung bewahrt die Ernsthaftigkeit der Szene, ohne eine konfessionelle oder dogmatische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatischen Wendungen werden natürlich wiedergegeben; die Fußnoten machen die zugrunde liegenden griechischen Bilder sichtbar.
