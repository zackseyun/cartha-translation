  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: de
  text: Da erschien ihm ein Engel vom Himmel und stärkte ihn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen die Verse 43–44 aus.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Der Aorist Passiv von ὁράω wird in Erscheinungsformeln idiomatisch mit „erschien“ wiedergegeben; „wurde gesehen“ wäre im Deutschen missverständlich und unnötig mechanisch.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter. „Da“ bezeichnet natürlich das anschließende Geschehen, ohne einen starken Gegensatz einzutragen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bei ὤφθη bezeichnet die Person, der die Erscheinung zuteilwird; „ihm erschien“ ist die natürliche deutsche Konstruktion.
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Der himmlische Ursprung macht deutlich, dass hier ein Engel und nicht allgemein ein menschlicher Bote gemeint ist.
- source_word: ἀπ’ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Wendung gibt die Herkunft des Engels knapp und idiomatisch wieder.
- source_word: ἐνισχύων
  choice: und stärkte
  rationale: Das präsentische Partizip beschreibt die mit der Erscheinung verbundene Handlung. Die finite Koordination klingt im Deutschen natürlicher und bewahrt den Sinn von ἐνισχύω als Stärkung, ohne ihn auf bloße Ermutigung zu verengen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus und ist unmittelbar mit „ihn“ wiederzugeben.
theological_decisions:
- issue: Textstatus von Lukas 22,43
  choice: Der Vers steht entsprechend dem vorgegebenen SBLGNT-Text im Haupttext.
  alternative: Einige Handschriften lassen die Verse 43–44 aus.
  rationale: Die bereitgestellte griechische Quelle enthält den Vers. Die bedeutende textkritische Variante wird in einer Fußnote offengelegt, statt den Vers stillschweigend auszulassen oder seine Echtheit abschließend zu entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung ist knapp und natürlich; die Partizipialkonstruktion wird ohne inhaltliche Erweiterung als finite Folgehandlung wiedergegeben.
