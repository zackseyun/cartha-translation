id: LUK.22.48
reference: Luke 22:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: de
  text: 'Jesus[a] aber sagte zu ihm: „Judas, verrätst du den Menschensohn mit einem Kuss?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen „Jesus aber“ aus.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „lieferst du den Menschensohn mit einem Kuss aus?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Die schwach adversative Konjunktion markiert hier Jesu entgegenhaltende Reaktion und wird im Deutschen natürlich mit „aber“ wiedergegeben.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Das ausdrückliche Dativpronomen αὐτῷ wird bewahrt; die Formulierung ist zugleich natürliches modernes Deutsch.
- source_word: Ἰούδα
  choice: Judas
  rationale: Der Vokativ des Eigennamens wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: φιλήματι
  choice: mit einem Kuss
  rationale: Der Dativ bezeichnet das Mittel; „mit einem Kuss“ bewahrt die konkrete Handlung und klingt idiomatisch.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe bewahrt Jesu Selbstbezeichnung und deren biblische, insbesondere danielische, Resonanz.
- source_word: παραδίδως
  choice: verrätst du
  rationale: Im unmittelbaren feindlichen Kontext bezeichnet das Präsens die gerade vollzogene Auslieferung; „verraten“ gibt den kontextuellen Sinn natürlich wieder, während die wörtlichere Bedeutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe von τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  alternative: den Sohn des Menschen
  rationale: „Menschensohn“ ist die geläufige deutsche Form der christologischen Selbstbezeichnung und wahrt ihren Titelcharakter sowie ihren intertextuellen Gehalt, ohne sie zu einer rein allgemeinen Bezeichnung umzudeuten.
- issue: Bedeutungsumfang von παραδίδως
  choice: verrätst du
  alternative: lieferst du aus
  rationale: „Verraten“ entspricht der schuldhaften Handlung im Kontext, kann aber den konkreten Übergabeaspekt abschwächen; deshalb wird die formal nähere Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Frage behält ihre Schärfe; traditionelle biblische Fachsprache wird nur bei der etablierten Selbstbezeichnung „Menschensohn“ verwendet.
