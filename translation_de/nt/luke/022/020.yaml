reference: Luke 22:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: de
  text: 'Ebenso nahm er nach dem Mahl den Becher und sagte: »Dieser Becher ist der neue Bund in meinem Blut, das für euch vergossen wird.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Teil der Überlieferung lässt den längeren Wortlaut über den neuen Bund und das für euch vergossene Blut weg.
    reason: textual_variant
  - marker: b
    text: Wörtlicher steht die Wendung »das für euch vergossen wird« am Ende des ganzen Satzes und stimmt grammatisch mit »Becher« überein. Gemeint ist dabei am natürlichsten der Inhalt des Bechers, also Jesu Blut.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: Becher
  rationale: Die natürliche Bezeichnung für das Trinkgefäß; »Kelch« wäre stärker liturgisch geprägt, als es das griechische Wort selbst verlangt.
- source_word: ὡσαύτως
  choice: ebenso
  rationale: Bewahrt knapp und idiomatisch den Rückbezug auf Jesu vorherige Handlung mit dem Brot.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: nach dem Mahl
  rationale: Gibt die zeitliche Abfolge natürlich wieder, ohne das Mahl unnötig als modernes Abendessen festzulegen.
- source_word: λέγων
  choice: und sagte
  rationale: Überführt das griechische Partizip in einen natürlichen deutschen Hauptsatz.
- source_word: καινὴ διαθήκη
  choice: der neue Bund
  rationale: »Bund« entspricht dem biblisch-jüdischen Hintergrund der Bundesstiftung durch Blut besser als »Testament«.
- source_word: ἐν τῷ αἵματί μου
  choice: in meinem Blut
  rationale: Bleibt nahe an der Präposition ἐν und bewahrt die offene sakramentale und bundesbezogene Ausdrucksweise.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: das für euch vergossen wird
  rationale: Gibt den sachlich naheliegenden Bezug auf Jesu Blut wieder; »für euch« bewahrt die stellvertretende beziehungsweise zugunsten der Angesprochenen gemeinte Weite von ὑπέρ, ohne sie dogmatisch enger festzulegen.
theological_decisions:
- issue: Wiedergabe von διαθήκη im Zusammenhang des Mahls
  choice: neuer Bund
  alternative: neues Testament
  rationale: Die Formulierung erinnert an alttestamentliche Bundesschlüsse und an Blut als Bundeszeichen. »Bund« gibt diesen Hintergrund im heutigen Deutsch klarer wieder.
- issue: Bezug von τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: sinngemäßer Bezug auf »mein Blut«
  alternative: grammatisch-formaler Bezug auf »dieser Becher« beziehungsweise metonymisch auf dessen Inhalt
  rationale: Das griechische neutrale Partizip stimmt formal mit »Becher« überein, während »Blut« im Dativ steht. Sachlich wird jedoch nicht das Gefäß, sondern Jesu Blut für die Jünger vergossen. Der Haupttext gibt diesen Sinn natürlich wieder; die Fußnote bewahrt die auffällige griechische Satzfügung.
- issue: Textkritischer Status des Verses
  choice: Übersetzung im Haupttext mit Hinweis
  alternative: Auslassung des Verses entsprechend einigen Textzeugen
  rationale: Der SBLGNT führt den Abschnitt im Text, kennzeichnet jedoch eine bedeutende Überlieferungsvariante. Daher steht er im Haupttext, während die Fußnote die Auslassung in einigen Handschriften dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Becher« vermeidet eine unnötig liturgische Festlegung; »nach dem Mahl« klingt natürlich und bleibt gegenüber der Art des Essens offen. Das im Deutschen ergänzte »nahm er« erschließt die im Griechischen elliptisch aus dem vorherigen Vers fortgesetzte Handlung.
