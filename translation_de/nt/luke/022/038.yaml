  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: de
  text: 'Da sagten sie: „Herr, sieh, hier sind zwei Schwerter.“ Er sagte zu ihnen: „Es ist genug.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das genügt.“ Möglicherweise meint Jesus, dass das Gespräch beendet werden soll, und nicht, dass zwei Schwerter ausreichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Da sagten sie
  rationale: δέ ist hier ein leichter erzählerischer Anschluss. „Da“ gibt den Fortgang natürlich wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ entspricht der direkten Anrede an Jesus und bewahrt zugleich den im Neuen Testament etablierten Titelgebrauch.
- source_word: ἰδοὺ
  choice: sieh
  rationale: „Sieh“ gibt den aufmerksamkeitslenkenden und hinweisenden Charakter von ἰδού in natürlicher, würdiger Gegenwartssprache wieder.
- source_word: μάχαιραι
  choice: Schwerter
  rationale: „Schwerter“ ist die herkömmliche, hinreichend offene Wiedergabe für die bezeichneten Klingenwaffen; „Kurzschwerter“ oder „Dolche“ wären spezifischer als der Kontext verlangt.
- source_word: ὧδε δύο
  choice: hier sind zwei
  rationale: Die Formulierung gibt Ortsadverb und Zahl in natürlicher deutscher Wortstellung wieder.
- source_word: Ἱκανόν ἐστιν
  choice: Es ist genug
  rationale: Die knappe Formulierung bewahrt die Mehrdeutigkeit, ob Jesus zwei Schwerter als ausreichend bezeichnet oder das Gespräch beendet.
theological_decisions:
- issue: Mehrdeutigkeit von Jesu Antwort Ἱκανόν ἐστιν
  choice: Es ist genug
  alternative: Genug davon / Das genügt
  rationale: Der griechische Wortlaut kann sich auf die Zahl der Schwerter beziehen oder als Abbruch der Unterhaltung verstanden werden. Der Haupttext entscheidet diese Spannung nicht; die Fußnote nennt die mögliche pragmatische Bedeutung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Ton. Die direkte Rede bleibt knapp, und die echte interpretative Offenheit des griechischen Schlusssatzes wird erhalten.
