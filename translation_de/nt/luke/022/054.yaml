source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: de
  text: Sie nahmen ihn fest, führten ihn ab und brachten ihn in das Haus des Hohepriesters. Petrus aber folgte aus der Ferne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Sie nahmen ihn fest
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den Hauptverben vorausgeht. „Festnehmen“ gibt im Zusammenhang die gewaltsame Ingewahrsamnahme natürlich und präzise wieder.
- source_word: ἤγαγον
  choice: führten ihn ab
  rationale: ἄγω bedeutet „führen“ oder „bringen“; „abführen“ entspricht hier der Bewegung eines Gefangenen und unterscheidet sich klar vom folgenden Hineinbringen.
- source_word: εἰσήγαγον
  choice: brachten ihn in
  rationale: εἰσάγω bezeichnet ausdrücklich das Hineinführen oder Hineinbringen. Die Formulierung wahrt diese Richtungsangabe und vermeidet eine unmittelbare Wiederholung von „führen“.
- source_word: οἰκίαν
  choice: Haus
  rationale: οἰκία bezeichnet hier den konkreten Ort. „Haus“ ist direkter und allgemeinverständlicher als „Residenz“ und weniger auf den privaten Lebensbereich zugespitzt als „Zuhause“.
- source_word: ἀρχιερέως
  choice: Hohen Priesters
  rationale: „Hoher Priester“ ist die etablierte und sachlich passende deutsche Wiedergabe von ἀρχιερεύς.
- source_word: ἠκολούθει
  choice: folgte
  rationale: Das deutsche Präteritum kann den im Imperfekt ausgedrückten fortdauernden Vorgang im Erzählzusammenhang natürlich wiedergeben; eine schwerfällige Verlaufsform ist nicht nötig.
- source_word: μακρόθεν
  choice: in einiger Entfernung
  rationale: Die Wendung gibt die räumliche Distanz idiomatisch wieder, ohne das Ausmaß stärker festzulegen, als es der griechische Ausdruck verlangt.
- source_word: δὲ
  choice: aber
  rationale: Das zweite δέ markiert einen leichten Kontrast zwischen Jesu Abführung und dem distanzierten Folgen des Petrus.
theological_decisions:
- issue: Erzählerische Darstellung von Petrus’ Verhältnis zu Jesus während der Festnahme
  choice: „Petrus aber folgte in einiger Entfernung“ ohne Bewertung seines Beweggrundes
  alternative: „Petrus folgte ihm heimlich/ängstlich“ oder „Petrus folgte von ferne“
  rationale: Der Vers beschreibt räumliche Distanz und fortdauerndes Folgen, deutet Petrus’ Motivation jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am griechischen Erzählgang; „nahmen ihn fest“, „führten ihn ab“ und „brachten ihn in das Haus“ bilden eine klare Bewegungsabfolge. Keine Fußnote ist erforderlich, da „in einiger Entfernung“ die lexikalische Spannweite von μακρόθεν angemessen abbildet.
