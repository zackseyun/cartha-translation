id: LUK.22.3
reference: Luke 22:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: de
  text: Da fuhr Satan in Judas, der Iskariot genannt wurde und zu den Zwölf gehörte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der aus der Zahl der zwölf war“; auch: „einer von den Zwölf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Da fuhr
  rationale: δέ führt die Erzählung weiter; zusammen mit εἰσῆλθεν gibt „Da fuhr“ den plötzlichen Fortgang und das Eintreten in eine Person natürlich und deutlich wieder.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Die im Deutschen etablierte Wiedergabe des Namens beziehungsweise Titels.
- source_word: εἰς Ἰούδαν
  choice: in Judas
  rationale: Die Präposition εἰς wird ausdrücklich abgebildet; der Text beschreibt ein Eintreten in Judas und nicht lediglich eine Einflussnahme.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: der Iskariot genannt wurde
  rationale: Die attributive Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben, ohne die identifizierende Funktion abzuschwächen.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: und zu den Zwölf gehörte
  rationale: Die Zugehörigkeit zum zahlenmäßig bestimmten Kreis wird in idiomatischem Deutsch ausgedrückt; „die Zwölf“ bezeichnet hier die anerkannte Gruppe.
theological_decisions:
- issue: Art des Wirkens Satans an Judas
  choice: „Satan fuhr in Judas“
  alternative: „Satan beeinflusste/ergriff Judas“
  rationale: Die starke Formulierung εἰσῆλθεν … εἰς wird bewahrt und nicht auf bloße Einflussnahme abgeschwächt. Zugleich macht die Übersetzung keine zusätzliche Aussage über Besessenheit oder über das Verhältnis von satanischem Wirken und menschlicher Verantwortung.
- issue: Bezeichnung des Jüngerkreises
  choice: „die Zwölf“
  alternative: „die zwölf“ beziehungsweise wörtlicher „zur Zahl der zwölf“
  rationale: Die Großschreibung kennzeichnet im Deutschen die feste Gruppe, ohne über den griechischen Text hinaus eine Amtslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da fuhr Satan in Judas“ ist kräftig, aber in biblisch-religiösem Kontext weiterhin allgemein verständlich. Die Satzstruktur bleibt flüssig; die Fußnote bewahrt die formale Nuance von ἐκ τοῦ ἀριθμοῦ.
