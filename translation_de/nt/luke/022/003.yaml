review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν angemessen stark als „Da fuhr Satan in Judas“ wieder. Die identifizierende Bezeichnung „der Iskariot genannt wurde“ entspricht τὸν καλούμενον Ἰσκαριώτην. „Zu den Zwölf gehörte“ gibt ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα idiomatisch und sachlich korrekt wieder; die Fußnote hält die formellere Wendung des Griechischen fest.
  naturalness: Der Satz ist flüssiges, würdiges Standarddeutsch. „In jemanden fahren“ ist in diesem religiös-biblischen Zusammenhang eine etablierte und verständliche Formulierung; sie bewahrt die Bildlichkeit und Stärke des Ausgangstextes besser als eine bloße Aussage über Einflussnahme.
  terminology: „Satan“, „Iskariot“ und „die Zwölf“ sind die im modernen deutschen Bibeldeutsch üblichen Bezeichnungen. Die Großschreibung von „Zwölf“ kennzeichnet die bekannte Jüngergruppe und verändert den Sinn nicht.
