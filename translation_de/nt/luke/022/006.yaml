  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: Judas stimmt zu (ἐξωμολόγησεν), sucht fortlaufend nach einer günstigen Gelegenheit (ἐζήτει εὐκαιρίαν), Jesus ihnen auszuliefern (τοῦ παραδοῦναι αὐτὸν αὐτοῖς), und zwar ohne Anwesenheit der Menge (ἄτερ ὄχλου). Die Wiedergabe des Imperfekts mit „suchte“ wahrt den Verlauf, ohne einen inchoativen Sinn unnötig festzulegen.'
  naturalness: „Und er stimmte zu und suchte nach einer günstigen Gelegenheit, ihn ihnen ohne Beisein der Menge auszuliefern“ ist idiomatisches modernes Standarddeutsch und bewahrt einen angemessen sachlichen Erzählton. „Ohne Beisein der Menge“ ist etwas gehobener, aber klar und passend.
  terminology: „Auszuliefern“ ist für παραδοῦναι eine quellennahe und im Zusammenhang natürliche Wahl. Die Fußnote nennt „verraten“ korrekt als kontextuell mögliche, stärker interpretierende Alternative. „Menge“ gibt ὄχλος passend wieder.
