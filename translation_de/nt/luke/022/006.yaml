id: LUK.22.6
reference: Luke 22:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: de
  text: Und er stimmte zu und suchte nach einer günstigen Gelegenheit, ihn ihnen ohne Beisein der Menge auszuliefern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu verraten“. Das griechische Verb bedeutet wörtlich „übergeben“ oder „ausliefern“; im Zusammenhang mit Judas kann es sinngemäß auch mit „verraten“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: stimmte zu
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb Judas’ Zustimmung zu dem zuvor besprochenen Vorhaben; „stimmte zu“ gibt diesen idiomatischen Sinn im Deutschen natürlich wieder.
- source_word: ἐζήτει
  choice: suchte
  rationale: Das Imperfekt bezeichnet eine fortdauernde Suche. Das deutsche Präteritum lässt diesen Verlauf im erzählenden Zusammenhang erkennen, ohne den möglichen inchoativen Aspekt mit „begann“ unnötig festzulegen.
- source_word: εὐκαιρίαν
  choice: eine günstige Gelegenheit
  rationale: Die Wendung gibt sowohl den zeitlichen als auch den für das Vorhaben geeigneten Charakter der gesuchten Gelegenheit wieder.
- source_word: τοῦ παραδοῦναι
  choice: auszuliefern
  rationale: „Ausliefern“ wahrt die Grundbedeutung des Übergebens an andere und passt natürlich zur Verhaftungssituation, ohne die Handlung bereits ausschließlich mit dem deutenden Begriff „verraten“ zu benennen.
- source_word: ἄτερ ὄχλου
  choice: ohne Beisein der Menge
  rationale: Diese Formulierung macht deutlich, dass die Übergabe in Abwesenheit der Volksmenge geschehen sollte; sie vermeidet die mögliche Fehlauffassung, es gehe lediglich darum, keine eigene Menschenmenge mitzubringen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Empfänger der Auslieferung, also die im vorherigen Zusammenhang genannten führenden Priester und Hauptleute.
theological_decisions:
- issue: Charakterisierung von Judas’ Handlung
  choice: auszuliefern
  alternative: zu verraten
  rationale: Der griechische Ausdruck benennt zunächst das Übergeben beziehungsweise Ausliefern. „Verraten“ ist im Kontext sachlich möglich, legt aber die wertende Deutung stärker fest; diese wird deshalb als Fußnotenalternative erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Ablauf, klingt aber idiomatisch; die echte lexikalische Spannung zwischen „ausliefern“ und „verraten“ wird in der Fußnote bewahrt.
