review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt die Abfolge und Aussage des griechischen Satzes zuverlässig wieder: Die Dienerin bemerkt Petrus beim Licht, sieht ihn gezielt an und identifiziert ihn als jemanden, der bei Jesus war. »Am Licht« wahrt die räumliche Offenheit von πρὸς τὸ φῶς, ohne ein Feuer ausdrücklich einzutragen.'
  naturalness: Flüssiges, modernes und zugleich würdiges Standarddeutsch. Die Auflösung der griechischen Partizipien in finite Verben ist idiomatisch. »Unverwandt anblicken« ist leicht gehoben, aber verständlich und passend für den fokussierten Blick von ἀτενίσασα.
  terminology: »Dienerin« ist für παιδίσκη kontextgerecht und vermeidet eine ungesicherte Zuspitzung auf rechtlichen Sklavenstatus. »Auch dieser« bewahrt die markierte demonstrative Identifizierung von Καὶ οὗτος; »bei ihm« lässt die Art der Zugehörigkeit wie σὺν αὐτῷ offen.
