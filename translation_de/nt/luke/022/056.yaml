id: LUK.22.56
reference: Luke 22:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: de
  text: 'Da sah ihn eine Dienerin am Licht sitzen, blickte ihn unverwandt an und sagte: »Auch dieser war bei ihm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοῦσα δὲ
  choice: Da sah
  rationale: Das Aoristpartizip mit δέ führt den nächsten Handlungsschritt ein. Die finite Formulierung ist im Deutschen natürlich und wahrt den erzählerischen Ablauf.
- source_word: παιδίσκη τις
  choice: eine Dienerin
  rationale: παιδίσκη bezeichnet hier eine junge weibliche Hausbedienstete, möglicherweise eine Sklavin. »Dienerin« ist kontextgerecht und natürlich; τις bleibt durch den unbestimmten Artikel ausgedrückt.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: am Licht sitzen
  rationale: πρός mit τὸ φῶς beschreibt seine Lage beim beziehungsweise im Bereich der Lichtquelle. »Am Licht« bewahrt diese räumliche Offenheit, ohne ausdrücklich ein Feuer in den Vers einzutragen.
- source_word: ἀτενίσασα αὐτῷ
  choice: blickte ihn unverwandt an
  rationale: ἀτενίζω bezeichnet einen festen, aufmerksamen Blick. »Unverwandt anblicken« gibt die Intensität in würdigem, verständlichem Deutsch wieder.
- source_word: Καὶ οὗτος
  choice: Auch dieser
  rationale: Die demonstrative, identifizierende Aussage bleibt erhalten; καί hat hier die Bedeutung »auch«.
- source_word: σὺν αὐτῷ ἦν
  choice: war bei ihm
  rationale: Die Wendung bezeichnet Zugehörigkeit oder Begleitung. »War bei ihm« ist direkt und lässt das genaue Verhältnis offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkette wurde für natürlichen deutschen Erzählfluss in finite Verben aufgelöst. Die etwas markierte Identifizierung »Auch dieser« bewahrt die Pointierung des griechischen Demonstrativpronomens.
