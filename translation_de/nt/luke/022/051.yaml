source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: de
  text: 'Jesus aber entgegnete: »Genug davon!« Dann berührte er das Ohr des Mannes und heilte ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Genug davon!
  rationale: Die idiomatische Wendung signalisiert hier ein entschiedenes Ende des gewaltsamen Handelns. Die knappe deutsche Form bewahrt Nachdruck und kontextuelle Offenheit, ohne die schwer wörtlich wiederzugebende Konstruktion mechanisch abzubilden.
- source_word: τοῦ ὠτίου
  choice: das Ohr des Mannes
  rationale: ὠτίον bezeichnet das Ohr. Das ergänzte »des Mannes« klärt den pronominalen Bezug auf den zuvor genannten Knecht, ohne zusätzliche inhaltliche Festlegung.
- source_word: ἰάσατο αὐτόν
  choice: heilte ihn
  rationale: Die Wiedergabe erhält den Personenbezug des Akkusativpronomens αὐτόν und gibt das Verb ἰάομαι natürlich und präzise wieder.
theological_decisions:
- issue: Reichweite von Jesu Aufforderung Ἐᾶτε ἕως τούτου
  choice: Genug davon!
  alternative: Lasst ab! Bis hierher!
  rationale: Die gewählte Fassung lässt offen, ob Jesus unmittelbar die Jünger, die Festnehmenden oder die gesamte gewaltsame Situation anspricht. Sie vermeidet daher eine unnötige theologische oder erzählerische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Entgegnete« gibt ἀποκριθείς natürlich wieder; »Dann« bildet καί im erzählerischen Fortgang ab. Keine Fußnoten erforderlich.
