review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die Satzstruktur und den Sinn der griechischen Vorlage insgesamt: Die emphatische Konstruktion Ἐπιθυμίᾳ ἐπεθύμησα wird angemessen verstärkt, μεθ’ ὑμῶν korrekt als „mit euch“ wiedergegeben, und πρὸ τοῦ με παθεῖν zutreffend als zeitliches „bevor ich leide“. Bei τοῦτο τὸ πάσχα legt das direkt folgende φαγεῖν jedoch konkret die Bedeutung des Passahmahls nahe.'
  naturalness: „Dieses Passah mit euch zu essen“ ist im modernen Standarddeutsch nicht idiomatisch, da „Passah“ gewöhnlich das Fest bezeichnet. „Dieses Passahmahl mit euch zu essen“ ist klar, natürlich und entspricht dem durch „essen“ bestimmten Kontext.
  terminology: „Passah“ und „leide“ sind in diesem Kontext etablierte und sachgerechte biblische Begriffe. „Passahmahl“ erläutert nicht über das Griechische hinaus, sondern gibt die hier kontextuell erforderliche Mahlbedeutung von πάσχα wieder. Die englische Auditspur bestätigt sowohl die Intensität der Sehnsucht als auch die kontextuelle Mahlbedeutung.
  issues:
  - severity: medium
    issue: „dieses Passah … zu essen“
    rationale: Die Formulierung ist im heutigen Deutsch semantisch und idiomatisch unerquicklich, weil ein Fest nicht gewöhnlich „gegessen“ wird. Das griechische πάσχα kann zwar Fest oder Mahl meinen, doch das Verb φαγεῖν macht hier das Mahl als Referenten deutlich.
  revised_text: 'Und er sagte zu ihnen: „Ich habe mich sehr danach gesehnt, dieses Passahmahl mit euch zu essen, bevor ich leide.“'
  revised_footnotes: []
