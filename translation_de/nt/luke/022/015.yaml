  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Ich habe mich sehr danach gesehnt, dieses Passahmahl mit euch zu essen, bevor ich leide.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: er sagte zu ihnen
  rationale: Die übliche Erzählformel wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: ich habe mich sehr danach gesehnt
  rationale: Die figura etymologica aus Substantiv und Verb verstärkt das Verlangen. Die deutsche Formulierung bewahrt diese Intensität, ohne die griechische Konstruktion unnatürlich nachzubilden.
- source_word: τοῦτο τὸ πάσχα
  choice: dieses Passah
  rationale: πάσχα kann das Fest oder das Passahmahl bezeichnen. Wegen φαγεῖν ist hier das Mahl im Blick; die knappe Wiedergabe bewahrt dennoch die lexikalische Offenheit des Ausdrucks.
- source_word: φαγεῖν
  choice: zu essen
  rationale: Der Infinitiv wird schlicht und unmittelbar wiedergegeben.
- source_word: μεθ’ ὑμῶν
  choice: mit euch
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Begleitung.
- source_word: πρὸ τοῦ με παθεῖν
  choice: bevor ich leide
  rationale: Die Konstruktion bezeichnet Vorzeitigkeit. Die aktive Form bewahrt die knappe Aussage des griechischen Textes, ohne Jesu bevorstehendes Leiden näher auszudeuten.
theological_decisions:
- issue: Bedeutung von πάσχα im Zusammenhang
  choice: Passah bleibt im Haupttext stehen; eine Fußnote weist auf das Passahmahl hin.
  alternative: dieses Passahmahl
  rationale: Das Verb „essen“ macht deutlich, dass konkret das Mahl gemeint ist. Die Wiedergabe „Passah“ vermeidet jedoch eine unnötige Festlegung im Haupttext und entspricht der Ausdrucksweise der Vorlage.
- issue: Stärke von Ἐπιθυμίᾳ ἐπεθύμησα
  choice: ich habe mich sehr danach gesehnt
  alternative: sehnlichst habe ich mich danach gesehnt / mit Sehnsucht habe ich mich danach gesehnt
  rationale: Die Formulierung vermittelt Jesu starkes persönliches Verlangen in natürlichem Deutsch, ohne darüber hinausgehende theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Passah“ folgt der etablierten biblischen Schreibweise; „sehr danach gesehnt“ gibt die emphatische griechische Konstruktion natürlich wieder.
