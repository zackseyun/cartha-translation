revisions:
- from: Ich aber habe für dich gebetet, dass dein Glaube nicht aufhört; und wenn du dich wieder zugewandt hast,[a] stärke deine Brüder.
  to: Ich aber habe für dich gebetet, dass dein Glaube nicht versagt. Und du, wenn du zurückgekehrt bist,[a] stärke deine Brüder.
  rationale: Die Revision ersetzt die im Deutschen ergänzungsbedürftige Wendung „dich wieder zugewandt hast“ durch das idiomatische, richtungsoffene „zurückgekehrt bist“. Die Fußnote bewahrt die Umkehrnuance von ἐπιστρέψας, ohne sie im Haupttext zu erzwingen. „Nicht versagt“ gibt ἐκλίπῃ präziser und natürlich wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:36Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen Begriffe sind zutreffend wiedergegeben. ἐκλίπῃ wird mit „nicht aufhört“ semantisch möglich, aber „nicht versagt“ trifft in Verbindung mit „Glaube“ die bildliche und kontextuelle Aussage unmittelbarer. ἐπιστρέψας ist eine Rückkehr-/Umkehrbewegung; die Formulierung „dich wieder zugewandt hast“ ist ohne genanntes Ziel im Deutschen unvollständig bzw. missverständlich.
  naturalness: „Wenn du dich wieder zugewandt hast“ ist im modernen Standarddeutsch nicht idiomatisch, weil „sich zuwenden“ normalerweise ein explizites oder klar erschließbares Objekt verlangt. „Wenn du zurückgekehrt bist“ ist natürlich und wahrt die offene Richtung der griechischen Formulierung. Die Aufteilung in zwei Sätze macht den betonten Übergang zu Petrus’ Auftrag klar und flüssig.
  terminology: „Glaube“, „stärke“ und „Brüder“ sind passend. „Brüder“ ist im unmittelbaren Kreis der männlichen Jünger kontextgerecht. Die Fußnote soll bei ἐπιστρέψας die möglichen Nuancen Rückkehr und Umkehr anbieten, ohne die Wiederherstellung als alleinige lexikalische Bedeutung festzuschreiben.
  issues:
  - severity: medium
    issue: Unidiomatische und semantisch unvollständige Wiedergabe von ἐπιστρέψας
    rationale: „Sich wieder zuwenden“ verlangt im Deutschen gewöhnlich eine Ergänzung (etwa „zu jemandem“). Der griechische Ausdruck steht absolut und lässt das Ziel unausgesprochen; „zurückkehren“ gibt dies idiomatisch wieder.
  - severity: low
    issue: „nicht aufhört“ ist weniger treffend als „nicht versagt“
    rationale: Beide Wiedergaben sind möglich, doch „dein Glaube nicht versagt“ entspricht ἐκλίπῃ in diesem Zusammenhang genauer und ist eine natürliche deutsche Verbindung.
