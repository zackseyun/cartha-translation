id: LUK.22.32
reference: Luke 22:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: de
  text: Ich aber habe für dich gebetet, dass dein Glaube nicht versagt. Und du, wenn du zurückgekehrt bist,[a] stärke deine Brüder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du umgekehrt bist“ oder „wenn du wieder zurückkehrst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: habe gebetet
  rationale: Das Verb bezeichnet eine eindringliche Bitte. Das deutsche Perfekt gibt die abgeschlossene Fürbitte Jesu mit ihrer fortdauernden Bedeutung natürlich wieder.
- source_word: περὶ σοῦ
  choice: für dich
  rationale: Bei einem Verb des Betens bezeichnet περί mit Genitiv die Person, für die Fürbitte geleistet wird.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: dass ... nicht aufhört
  rationale: ἐκλείπω kann ‚aufhören‘, ‚versagen‘ oder ‚ausgehen‘ bedeuten. ‚Nicht aufhört‘ bewahrt das Bild eines möglichen Erlöschens, ohne zu behaupten, Petrus werde überhaupt nicht versagen.
- source_word: πίστις
  choice: Glaube
  rationale: ‚Glaube‘ wahrt die Bedeutungsbreite von πίστις und ist hier natürlicher als ‚Glaubenstreue‘; Vertrauen und Treue schwingen mit.
- source_word: ποτε
  choice: wenn
  rationale: ποτε weist hier auf einen künftig eintretenden Zeitpunkt hin; zusammen mit dem Partizip lässt es sich idiomatisch durch ‚wenn‘ ausdrücken.
- source_word: ἐπιστρέψας
  choice: wenn du dich wieder zugewandt hast
  rationale: ἐπιστρέφω bezeichnet ein Umkehren oder Zurückkehren. Die Formulierung bewahrt die Richtungsmetapher und den Anklang an Wiederherstellung, ohne ausdrücklich den engeren theologischen Begriff ‚Buße tun‘ einzusetzen.
- source_word: στήρισον
  choice: stärke
  rationale: Der Imperativ fordert Petrus auf, die anderen fest und standhaft zu machen; ‚stärke‘ ist dafür klar und idiomatisch.
- source_word: ἀδελφούς
  choice: Brüder
  rationale: Im unmittelbaren Zusammenhang sind Jesu männliche Jünger gemeint; daher wird der grammatisch maskuline Ausdruck konkret mit ‚Brüder‘ wiedergegeben.
theological_decisions:
- issue: Bedeutung von πίστις zwischen Glaube, Vertrauen und Treue
  choice: Glaube
  alternative: Vertrauen; Glaubenstreue
  rationale: ‚Glaube‘ erhält die theologische und semantische Weite des griechischen Wortes. Eine Fußnote ist nicht nötig, da die deutschen Alternativen hier eher Bedeutungsnuancen als klar abgrenzbare Lesarten darstellen.
- issue: Sinn von ἐπιστρέψας im Blick auf das bevorstehende Versagen des Petrus
  choice: wenn du dich wieder zugewandt hast
  alternative: wenn du zurückgekehrt bist; wenn du umgekehrt bist
  rationale: Die gewählte Fassung lässt sowohl Rückkehr als auch Umkehr anklingen und deutet die Wiederherstellung nach dem Versagen an, ohne eine vollständige Abkehr vom Glauben oder einen technischen Bekehrungsbegriff vorauszusetzen.
- issue: Referenz von ἀδελφούς
  choice: Brüder
  alternative: Geschwister; Mitglaubende
  rationale: Der unmittelbare Adressatenkreis besteht aus den männlichen Jüngern; eine inklusive Verallgemeinerung würde die konkrete Szene weniger genau wiedergeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Gegensatz zwischen Jesu Fürbitte und dem künftigen Auftrag an Petrus. ‚Nicht aufhört‘ ist bewusst gewählt, weil es das mögliche Versagen des Glaubens ausdrückt, ohne Petrus’ bevorstehende Verleugnung mit einem völligen Verlust des Glaubens gleichzusetzen.
