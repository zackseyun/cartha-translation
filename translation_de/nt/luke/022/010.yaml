  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Seht: Wenn ihr in die Stadt hineinkommt, wird euch ein Mann begegnen, der einen Wasserkrug[a] trägt. Folgt ihm in das Haus, das er betritt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort kann genauer ein Tongefäß bezeichnen; daher auch: »einen Tonkrug mit Wasser«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: unübersetzt in einer natürlichen deutschen Satzkonstruktion
  rationale: Ἰδοὺ dient hier als Aufmerksamkeitssignal. Ein ausdrückliches »Siehe« wäre formaler, wirkt im modernen Deutschen jedoch markiert; die unmittelbar folgende Anweisung trägt die aufmerksamkeitslenkende Funktion bereits natürlich mit.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: Wenn ihr in die Stadt hineinkommt
  rationale: Der Genitivus absolutus wird temporal wiedergegeben. »Hineinkommt« bewahrt die durch εἰς ausgedrückte Bewegung in die Stadt hinein und klingt natürlich.
- source_word: συναντήσει ὑμῖν
  choice: wird euch ... begegnen
  rationale: Das Verb mit Dativ bezeichnet hier ein Zusammentreffen. »Euch begegnen« ist im Deutschen idiomatischer als »euch treffen« und lässt offen, ob das Zusammentreffen verabredet ist.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Die maskuline Form bezeichnet in diesem konkreten Zusammenhang einen Mann; eine geschlechtsneutrale Wiedergabe wäre weniger genau.
- source_word: κεράμιον ὕδατος
  choice: einen Wasserkrug
  rationale: »Wasserkrug« gibt Gefäß und Inhalt knapp und idiomatisch wieder. Das mögliche Material Ton wird nicht ausdrücklich genannt, weil κεράμιον hier vor allem das Gefäß bezeichnet und eine Materialspezifikation den Haupttext unnötig verengen könnte.
- source_word: βαστάζων
  choice: der ... trägt
  rationale: Der attributive Relativsatz gibt die fortdauernde Handlung des Partizips in natürlichem Deutsch wieder.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Folgt ihm
  rationale: Der Aoristimperativ wird als klare direkte Aufforderung wiedergegeben.
- source_word: οἰκίαν
  choice: Haus
  rationale: »Haus« entspricht dem konkreten räumlichen Bezug und passt zur Bewegung hinein.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: in das er hineingeht
  rationale: Die Wiedergabe erhält sowohl den Bezug auf das bestimmte Haus als auch die gerichtete Bewegung des griechischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und handlungsorientiert; auf das heute markierte »Siehe« wird zugunsten eines natürlichen Erzählflusses verzichtet.
