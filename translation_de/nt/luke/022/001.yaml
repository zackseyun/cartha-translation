id: LUK.22.1
reference: Luke 22:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: de
  text: Das Fest der ungesäuerten Brote[a], das Passafest genannt wird, rückte näher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Passafest und das Fest der ungesäuerten Brote waren eng miteinander verbundene Feiern. Im jüdischen Sprachgebrauch konnten die Bezeichnungen gemeinsam oder mit überschneidender Bedeutung verwendet werden.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: rückte näher
  rationale: Das Imperfekt bezeichnet das fortschreitende Herannahen des Festes. „Rückte näher“ gibt diesen Aspekt natürlich und prägnant wieder.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ markiert hier einen leichten Übergang im Erzählfluss. Im Deutschen ist kein ausdrückliches Bindewort nötig; ein vorangestelltes „Nun“ würde stärker wirken als der Ausgangstext.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: das Fest der ungesäuerten Brote
  rationale: ἑορτή bezeichnet ein religiöses Fest; τὰ ἄζυμα meint hier die ungesäuerten Brote und dient als etablierte Festbezeichnung.
- source_word: ἡ λεγομένη
  choice: das … genannt wird
  rationale: Die partizipiale Wendung erläutert, unter welchem Namen das Fest bezeichnet wird, ohne die Beziehung der Bezeichnungen weiter zu präzisieren.
- source_word: Πάσχα
  choice: Passafest
  rationale: „Passafest“ ist im modernen Deutschen eine klare und gebräuchliche Wiedergabe des jüdischen Festnamens und passt syntaktisch zu „genannt wird“.
theological_decisions:
- issue: Verhältnis zwischen dem Fest der ungesäuerten Brote und dem Passafest
  choice: 'Beide Bezeichnungen gemäß Lukas erklärend aufeinander beziehen: „das Fest der ungesäuerten Brote, das Passafest genannt wird“'
  alternative: Passa und das Fest der ungesäuerten Brote als strikt getrennte Feste wiedergeben
  rationale: Lukas stellt die Bezeichnungen in einer erklärenden Beziehung dar. Die Übersetzung bewahrt diese Formulierung und legt weder eine streng technische Unterscheidung noch eine weitergehende Harmonisierung in den Text hinein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist allgemein verständlich; der traditionelle Festname bleibt erhalten, während unnötig bibelsprachliche Satzanfänge vermieden werden.
