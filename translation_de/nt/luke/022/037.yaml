id: LUK.22.37
reference: Luke 22:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: de
  text: 'Denn ich sage euch: Dieses Schriftwort muss sich an mir erfüllen: »Und er wurde zu den Gesetzlosen gerechnet.«[a] Denn auch das, was mich betrifft, kommt zur Vollendung.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: »Und er wurde zu den Übertretern gerechnet«; auch: »unter die Verbrecher gezählt« (Jesaja 53,12).'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »Denn auch das, was mich betrifft, hat ein Ende« oder »geht seiner Erfüllung entgegen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Bewahrt den erklärenden Anschluss durch γάρ und gibt λέγω ὑμῖν in natürlichem, zugleich würdigem Deutsch wieder.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: dieses Schriftwort
  rationale: Bezeichnet knapp und idiomatisch das Geschriebene, ohne den Ausdruck unnötig zu paraphrasieren; der unmittelbare Kontext macht den Schriftbezug deutlich.
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: muss sich an mir erfüllen
  rationale: δεῖ behält den Sinn der Notwendigkeit; bei einem prophetischen Schriftwort ist τελεσθῆναι natürlich mit »sich erfüllen« wiedergegeben. »An mir« drückt ἐν ἐμοί im Deutschen idiomatisch aus.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: Und er wurde zu den Gesetzlosen gerechnet
  rationale: »Gesetzlose« entspricht ἀνόμων unmittelbar; »zu … gerechnet« bildet ἐλογίσθη präzise und natürlich ab.
- source_word: καὶ γὰρ τὸ περὶ ἐμοῦ τέλος ἔχει
  choice: Denn auch das, was mich betrifft, kommt zur Vollendung
  rationale: Gibt καὶ γάρ als verstärkenden erklärenden Anschluss wieder. »Kommt zur Vollendung« bewahrt bei τέλος ἔχει die Spannung zwischen Abschluss und Erfüllung, ohne sie einseitig aufzulösen.
theological_decisions:
- issue: Wiedergabe des Zitats aus Jesaja 53,12
  choice: Und er wurde zu den Gesetzlosen gerechnet
  alternative: Und er wurde zu den Übertretern gerechnet / unter die Verbrecher gezählt
  rationale: Die Hauptfassung folgt ἀνόμων möglichst unmittelbar. Vertrautere traditionelle oder stärker kontextualisierende Wiedergaben werden als Alternative genannt, aber nicht in den Text eingeführt.
- issue: Bedeutung von τέλος ἔχει
  choice: kommt zur Vollendung
  alternative: hat ein Ende / geht seiner Erfüllung entgegen
  rationale: Der griechische Ausdruck kann Abschluss, Ende oder Erfüllung anklingen lassen. Die gewählte Formulierung wahrt diese theologische und lexikalische Spannung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Bibelregister. Das Zitat ist erkennbar markiert; die Schlussklausel bleibt bewusst offen zwischen Ende, Abschluss und Erfüllung.
