id: LUK.22.35
reference: Luke 22:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Als ich euch ohne Geldbeutel, Reisebeutel[a] und Sandalen aussandte, hat euch da etwas gefehlt?“ Sie antworteten: „Nichts.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Proviantbeutel“ beziehungsweise „Ranzen“.'
    reason: Das griechische πήρα bezeichnet einen Beutel, der auf Reisen insbesondere für Vorräte verwendet wurde; die genaue Form lässt sich nicht näher bestimmen.
lexical_decisions:
- source_word: ἄτερ
  choice: ohne
  rationale: Die Präposition bezeichnet das Fehlen der genannten Ausrüstung; „ohne“ ist dafür die klare und natürliche deutsche Entsprechung.
- source_word: βαλλαντίου
  choice: Geldbeutel
  rationale: Das Wort bezeichnet einen Beutel zur Aufbewahrung von Geld. „Geldbeutel“ ist konkret und im modernen Standarddeutsch gut verständlich.
- source_word: πήρας
  choice: Reisebeutel
  rationale: Gemeint ist ein Beutel für Vorräte oder persönliche Dinge unterwegs. „Reisebeutel“ gibt die Funktion wieder, ohne eine bestimmte moderne Taschenform vorauszusetzen.
- source_word: ὑποδημάτων
  choice: Sandalen
  rationale: Im kulturellen und erzählerischen Zusammenhang der Evangelien ist „Sandalen“ die passende konkrete Wiedergabe.
- source_word: ἀπέστειλα
  choice: aussandte
  rationale: Das Verb bezeichnet hier die Beauftragung und Entsendung der Jünger; „aussandte“ bewahrt diesen missionarischen Zusammenhang knapp und würdig.
- source_word: μή τινος ὑστερήσατε
  choice: hat euch da etwas gefehlt?
  rationale: ὑστερέω bezeichnet hier einen Mangel. Die Fragepartikel μή lässt eine verneinende Antwort erwarten; die deutsche Frage bleibt dennoch offen formuliert, während „da“ natürlich auf die damalige Aussendung zurückverweist.
- source_word: Οὐθενός
  choice: Nichts.
  rationale: Die knappe Antwort gibt den substantivisch gebrauchten Genitiv idiomatisch wieder und bewahrt die Kürze des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „aussandte“ trägt den Sendungscharakter des griechischen Verbs, ohne zusätzliche theologische Deutung einzuführen.
