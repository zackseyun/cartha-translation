  text: ἐὰν ⸀δὲ ἐρωτήσω, οὐ μὴ ⸀ἀποκριθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/068.yaml
  text: But if I ask[a], you will certainly not answer.
translation:
  language: de
  text: Wenn ich euch aber frage, werdet ihr ganz gewiss nicht antworten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: wenn
  rationale: Leitet mit dem Aorist Konjunktiv eine auf die Zukunft bezogene Bedingung ein; „wenn“ ist im modernen Deutsch natürlich und präzise.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zur vorausgehenden Aussage und entspricht hier idiomatisch der adversativen Funktion.
- source_word: ἐρωτήσω
  choice: ich euch frage
  rationale: Gibt das breite Bedeutungsspektrum von ἐρωτάω wieder, ohne eine feindselige Verhörsituation stärker auszumalen, als der griechische Wortlaut verlangt. Das Objekt „euch“ ist aus dem pluralischen Verb der Antwort erschlossen und im Deutschen zur natürlichen Verständlichkeit ergänzt.
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: Bewahrt die nachdrückliche Verneinung der griechischen Konstruktion in natürlichem, würdigem Gegenwartsdeutsch.
- source_word: ἀποκριθῆτε
  choice: werdet ihr antworten
  rationale: Das formal passive, semantisch jedoch aktive Verb bedeutet hier „antworten“; die deutsche Futurform vermittelt die zukunftsbezogene Aussage der emphatischen Negation.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die griechische Satzstellung wird zugunsten eines natürlichen deutschen Bedingungssatzes angepasst; die starke Verneinung bleibt ausdrücklich erhalten.
