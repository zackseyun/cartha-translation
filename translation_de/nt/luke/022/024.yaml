id: LUK.22.24
reference: Luke 22:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: de
  text: Unter ihnen entstand auch ein Streit darüber, wer von ihnen als größer galt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer von ihnen größer zu sein schien“. Das griechische Verb kann „scheinen“ oder „gelten/angesehen werden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: entstand
  rationale: Das Verb bezeichnet hier das Aufkommen einer Situation; „entstand“ gibt den Beginn des Streits natürlich wieder.
- source_word: δὲ καὶ
  choice: auch
  rationale: δέ führt die Erzählung weiter, ohne dass im Deutschen zwingend ein eigener Konnektor nötig ist; καί wird mit „auch“ ausdrücklich wiedergegeben.
- source_word: φιλονεικία
  choice: Streit
  rationale: Das Wort bezeichnet eine von Konkurrenzdenken geprägte Auseinandersetzung; „Streit“ ist klar, natürlich und dem Kontext angemessen.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Die Wendung beschreibt eine Auseinandersetzung innerhalb der Gruppe.
- source_word: τὸ τίς αὐτῶν
  choice: darüber, wer von ihnen
  rationale: Der Artikel nominalisiert die indirekte Frage und bezeichnet so den Gegenstand des Streits.
- source_word: δοκεῖ
  choice: als … galt
  rationale: δοκέω kann sowohl „scheinen“ als auch „gelten/angesehen werden“ bedeuten. Im Zusammenhang einer Rangfrage gibt „galt“ die soziale Einschätzung idiomatisch wieder, während die Alternative in der Fußnote erhalten bleibt.
- source_word: εἶναι μείζων
  choice: größer
  rationale: Der Komparativ wird als Komparativ bewahrt und nicht zum Superlativ „der Größte“ verstärkt.
theological_decisions:
- issue: Rangbezeichnung unter den Jüngern
  choice: größer
  alternative: der Größte; bedeutender
  rationale: Der griechische Text verwendet den Komparativ μείζων. Die Übersetzung bewahrt diese Form und löst die offene Vergleichsbeziehung nicht durch einen Superlativ auf.
- issue: Bedeutung von δοκεῖ
  choice: als größer galt
  alternative: größer zu sein schien
  rationale: Im Streit um Rang und Ansehen liegt die Bedeutung „gelten/angesehen werden“ nahe; da „scheinen“ lexikalisch ebenfalls möglich ist, wird diese echte Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Formulierung bleibt nahe an der griechischen Syntax, klingt aber natürlich; die lexikalische Mehrdeutigkeit von δοκεῖ wird nicht stillschweigend beseitigt.
