  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: de
  text: Doch von nun an wird der Menschensohn zur Rechten der Macht Gottes sitzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: von nun an
  rationale: Die geläufige deutsche Wendung bezeichnet den Zeitpunkt, von dem an das angekündigte Geschehen gilt, und bewahrt die in die Zukunft gerichtete Aussage.
- source_word: δὲ
  choice: Doch
  rationale: Die Konjunktion markiert hier im Zusammenhang eine kontrastierende Wendung in Jesu Antwort; „Doch“ gibt diese adversative Nuance natürlich wieder.
- source_word: ἔσται … καθήμενος
  choice: wird … sitzen
  rationale: Die Verbindung aus dem Futur von εἰμί und dem Partizip bezeichnet den künftigen Zustand des Sitzens. Das deutsche Futur „wird sitzen“ ist natürlich und bewahrt zugleich das Bild der Thronstellung.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte biblische Bezeichnung bewahrt Jesu Selbstbezeichnung sowie ihre Anklänge an Daniel und ihre absichtliche Deutungsoffenheit.
- source_word: ἐκ δεξιῶν
  choice: zur Rechten
  rationale: Die traditionelle, weiterhin verständliche biblische Wendung bezeichnet den Ehren- und Autoritätsplatz und erhält den Anklang an Psalm 110.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: der Macht Gottes
  rationale: „Macht“ gibt δύναμις in diesem Herrschafts- und Erhöhungskontext treffend wieder; der Genitiv „Gottes“ macht den Bezug entsprechend dem griechischen Text ausdrücklich.
theological_decisions:
- issue: Wiedergabe der Erhöhungsformel und des Anspruchs auf göttlich verliehene Autorität
  choice: der Menschensohn wird zur Rechten der Macht Gottes sitzen
  alternative: der Menschensohn wird zur Rechten der Macht sitzen
  rationale: Die Formulierung bewahrt die starke Aussage von Erhöhung und Autorität sowie die Resonanz von Psalm 110 und Daniel 7, ohne sie erklärend aufzulösen. Zugleich bleibt „Gottes“ ausdrücklich stehen, wie es der griechische Text bietet; die mögliche ehrfürchtige Verwendung von „Macht“ als Gottesumschreibung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschensohn“ und „zur Rechten“ bleiben wegen ihrer festen biblischen Prägung und intertextuellen Bedeutung erhalten; der übrige Satzbau ist knapp und gegenwärtig.
