  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: de
  text: Und ich übertrage euch ein Reich[a], so wie mein Vater mir eines übertragen hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit Bundesnuance: „Und ich sichere euch ein Reich durch einen Bund zu.“ Das griechische Verb kann sowohl Übertragen oder Verfügen als auch Bundesschließen bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Die Stellung von „ein Reich“ am Ende, als Ergänzung zu beiden Verben, lässt sich im Deutschen etwa so nachbilden: „Und ich übertrage euch – so wie mein Vater mir – ein Reich.“'
    reason: source_structure
lexical_decisions:
- source_word: κἀγὼ
  choice: Und ich
  rationale: Die Verschmelzung von καί und ἐγώ verbindet den Satz mit dem Vorhergehenden und hebt zugleich Jesus als Handelnden hervor.
- source_word: διατίθεμαι / διέθετό
  choice: übertrage / übertragen hat
  rationale: „Übertragen“ gibt die Verfügung beziehungsweise Verleihung wieder, ist im Deutschen mit „Reich“ idiomatisch und bewahrt durch dieselbe Wortwurzel die Parallelität zwischen Jesu Handeln und dem Handeln des Vaters.
- source_word: ὑμῖν / μοι
  choice: euch / mir
  rationale: Die Dative bezeichnen jeweils die Empfänger der Übertragung und können im Deutschen direkt wiedergegeben werden.
- source_word: καθὼς
  choice: so wie
  rationale: „So wie“ kennzeichnet klar die Entsprechung zwischen Jesu Handeln und dem vorausgehenden Handeln seines Vaters.
- source_word: ὁ πατήρ μου
  choice: mein Vater
  rationale: Dies ist die natürliche deutsche Wiedergabe und bewahrt die ausdrücklich personale Vater-Sohn-Beziehung.
- source_word: βασιλείαν
  choice: ein Reich
  rationale: Das artikellose Substantiv bezeichnet hier im Zusammenhang mit Tischgemeinschaft und Thronen am ehesten ein übertragenes königliches Reich beziehungsweise Herrschaftsgebiet; „ein Reich“ ist zugleich verständlich und traditionsfähig.
theological_decisions:
- issue: Bundessprachliche Bedeutung von διατίθεμαι
  choice: übertrage
  alternative: vermache; sage aufgrund eines Bundes zu
  rationale: Das Verb kann eine bundeshafte oder verfügende Nuance tragen. Der Haupttext verwendet deshalb den weiteren Begriff „übertragen“, ohne die mögliche Bundesbedeutung auszuschließen; die Alternative wird in der Fußnote offengelegt.
- issue: Bedeutungsumfang von βασιλεία
  choice: ein Reich
  alternative: Königsherrschaft; Herrschaft
  rationale: Der folgende Kontext mit Tisch und Thronen stützt die Vorstellung eines verliehenen königlichen Reiches, doch das griechische Wort kann zugleich die Ausübung der Königsherrschaft bezeichnen. Diese Bedeutungsbreite wird nicht dogmatisch verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Übertragen“ vermeidet die heute stark testamentarische Verengung von „vermachen“, während „ein Reich“ verständlicher und natürlicher bleibt als das fachsprachlichere „eine Königsherrschaft“.
