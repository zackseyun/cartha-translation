  source_fidelity: Der Entwurf gibt die Syntax und den Sinn des griechischen Textes im Wesentlichen zuverlässig wieder. »in Versuchung geraten« ist eine idiomatische Wiedergabe von εἰσελθεῖν εἰς πειρασμόν und wahrt das Bild eines Hineingeratens, ohne es unzulässig zu konkretisieren.
  naturalness: »Als er an den Ort gekommen war« ist korrekt, wirkt im modernen Standarddeutsch jedoch unnötig schwerfällig und setzt gegenüber dem griechischen Aoristpartizip ein stärkeres Vorzeitigkeitsverhältnis. »Als er an den Ort kam« ist ebenso präzise und natürlicher.
  terminology: »Versuchung« ist als Haupttext für πειρασμός im Kontext gut vertretbar. Die Fußnote bewahrt angemessen die weiteren Möglichkeiten »Prüfung« und »Erprobung«. Der Ausdruck »Bewährungsprobe« in der Erläuterung kann jedoch eine positive bzw. bewältigbare Nuance nahelegen, die im griechischen Wort nicht liegt; »Zeit der Prüfung« ist neutraler.
