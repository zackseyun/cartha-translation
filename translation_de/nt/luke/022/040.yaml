base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: de
  text: 'Als er an den Ort kam, sagte er zu ihnen: »Betet, damit ihr nicht in Versuchung[a] geratet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Prüfung« oder »Erprobung«. Das griechische Wort kann sowohl eine Versuchung im moralischen Sinn als auch eine Zeit der Prüfung im weiteren Sinn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Als er an den Ort gekommen war
  rationale: Die temporale Nebensatzkonstruktion gibt das Aoristpartizip natürlich wieder und bezeichnet seine Ankunft an dem aus dem Zusammenhang bekannten Ort; δέ fungiert hier als leichter narrativer Anschluss.
- source_word: εἶπεν αὐτοῖς
  choice: sagte er zu ihnen
  rationale: Die Formulierung entspricht dem schlichten Aussageverb λέγω, ohne eine stärkere Befehlsnuance in das Verb selbst einzutragen.
- source_word: Προσεύχεσθε
  choice: Betet
  rationale: Der deutsche Imperativ ist natürlich und gibt die Aufforderung des griechischen Präsens wieder; dessen mögliche fortdauernde Nuance muss hier nicht durch »Betet weiter« ausdrücklich gemacht werden.
- source_word: μὴ εἰσελθεῖν εἰς πειρασμόν
  choice: damit ihr nicht in Versuchung geratet
  rationale: »Damit« bringt den Inhalt beziehungsweise Zweck des Gebets klar zum Ausdruck. Die idiomatische deutsche Wendung »in Versuchung geraten« entspricht dem griechischen Bild des Hineinkommens, ohne die Aussage unnötig auszudeuten.
- source_word: πειρασμόν
  choice: Versuchung
  rationale: Im unmittelbaren Zusammenhang mit der drohenden geistlichen Bewährungsprobe und dem möglichen Versagen der Jünger ist »Versuchung« die naheliegende Hauptbedeutung. Die weiter gefassten Bedeutungen »Prüfung« und »Erprobung« bleiben in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von πειρασμός in Jesu Warnung
  choice: Versuchung
  alternative: Prüfung oder Erprobung
  rationale: Der Zusammenhang legt eine Gefahr geistlichen Versagens nahe, erlaubt aber zugleich das breitere Verständnis einer Prüfung. Die Hauptübersetzung entscheidet sich für die im Deutschen naheliegende Lesart, während die Fußnote die echte Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Formulierung ist idiomatisch, bleibt aber eng an der griechischen Satzstruktur und bewahrt die Bedeutungsbreite von πειρασμός durch die Fußnote.
