source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: de
  text: 'Als die, die bei Jesus waren, sahen, was bevorstand, sagten sie: »Herr, sollen wir mit dem Schwert zuschlagen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Als ... sahen
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und in seiner zeitlichen Beziehung zum Hauptverb bewahrt.
- source_word: οἱ περὶ αὐτὸν
  choice: die, die bei Jesus waren
  rationale: Die Wendung bezeichnet die Personen in Jesu unmittelbarer Umgebung. Der Name vermeidet im Deutschen einen möglichen unklaren Pronomenbezug, ohne die Gruppe enger als der griechische Text zu bestimmen.
- source_word: τὸ ἐσόμενον
  choice: was geschehen würde
  rationale: Das substantivierte Futurpartizip bezeichnet das unmittelbar bevorstehende Geschehen. Die Formulierung ist natürlich und lässt offen, welchen genauen Umfang das erwartete Ereignis hat.
- source_word: εἶπαν
  choice: sagten sie
  rationale: Die Grundbedeutung von λέγω bleibt erhalten; die direkte Rede ist ihrer Form nach eine Frage.
- source_word: Κύριε
  choice: Herr
  rationale: Die direkte Anrede bewahrt sowohl den respektvollen Titel als auch dessen möglichen theologischen Nachklang.
- source_word: εἰ πατάξομεν
  choice: sollen wir ... zuschlagen?
  rationale: εἰ mit dem Futur leitet hier eine Erwägungsfrage ein. Im Deutschen gibt »sollen wir« diese Funktion idiomatisch wieder; »zuschlagen« passt zum gewaltsamen Hieb mit einer Waffe.
- source_word: ἐν μαχαίρῃ
  choice: mit dem Schwert
  rationale: ἐν ist instrumental gebraucht. μάχαιρα bezeichnet eine Klingenwaffe, je nach Kontext ein Schwert, Kurzschwert oder einen Dolch; »Schwert« ist hier die natürliche, traditionsfähige Oberbezeichnung.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: »Herr« entspricht der üblichen Bedeutung der Anrede und erhält deren Gewicht, ohne festzulegen, wie umfassend die Sprecher den Titel theologisch verstehen.
- issue: Bestimmtheit bei ἐν μαχαίρῃ
  choice: mit dem Schwert
  alternative: mit einem Schwert
  rationale: Der artikellose griechische Ausdruck legt im Deutschen den Artikel nicht eindeutig fest. »Mit dem Schwert« bezeichnet idiomatisch die Art des Waffeneinsatzes und passt zu den bereits im Zusammenhang erwähnten Schwertern.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die doppelte Relativkonstruktion »die, die« ist verständlich und bewahrt die unbestimmte Gruppenbezeichnung; »bei Jesus« klärt den Bezug. Keine Fußnote ist nötig: Die mögliche Bedeutungsbreite von μάχαιρα lässt sich hier mit »Schwert« angemessen abdecken, und die englische Fußnote vermischt offenbar die Artikelalternative mit der Waffenart.'
