  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. Die doppelte Konstruktion »die, die« ist zwar nicht elegant, aber klar und angemessen. »Was bevorstand« ist idiomatischer und zugleich präziser als »was geschehen würde«.
  terminology: »Herr« ist für Κύριε angemessen. »Mit dem Schwert zuschlagen« gibt πατάξομεν ἐν μαχαίρῃ natürlich und ohne unzulässige Spezifizierung wieder. Eine Fußnote zur möglichen Bedeutungsspanne von μάχαιρα ist im Deutschen nicht erforderlich, da »Schwert« hier eine tragfähige allgemeine Wiedergabe ist.
