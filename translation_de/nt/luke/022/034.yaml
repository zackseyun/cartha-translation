  verdict: approve
  source_fidelity: 'Der griechische Satz wird vollständig und sachgerecht wiedergegeben: Die direkte Anrede an Petrus, der heutige Zeitpunkt, das Krähen des Hahns, die dreifache Verleugnung und εἰδέναι („mich zu kennen“) sind erhalten. „Bevor“ ist nach dem verneinten Hauptsatz eine idiomatische deutsche Wiedergabe von ἕως und wahrt die zeitliche Grenze.'
  naturalness: „Er aber sagte“ und „Ich sage dir“ haben einen angemessen zurückhaltenden biblisch-literarischen Ton und bleiben im modernen Standarddeutsch verständlich. „Heute wird kein Hahn krähen“ sowie „geleugnet hast, mich zu kennen“ sind natürlich und klar.
  terminology: „Petrus“ ist die etablierte deutsche Namensform. „Hahn krähen“ trifft φωνήσει mit ἀλέκτωρ idiomatisch. „Leugnen, jemanden zu kennen“ bildet die inhaltliche Ergänzung εἰδέναι präzise ab, ohne sie zu einer allgemeineren Absage an Jesus auszuweiten.
