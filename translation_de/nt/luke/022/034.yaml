id: LUK.22.34
reference: Luke 22:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: de
  text: 'Er aber sagte: „Ich sage dir, Petrus: Heute wird kein Hahn krähen, bevor du dreimal geleugnet hast, mich zu kennen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Er aber sagte
  rationale: δέ markiert hier den leicht kontrastierenden Fortgang des Gesprächs; die Wortstellung ist im Deutschen würdevoll und natürlich.
- source_word: Λέγω σοι
  choice: Ich sage dir
  rationale: Bewahrt die direkte, feierliche Aussageformel und das Präsens von λέγω.
- source_word: Πέτρε
  choice: Petrus
  rationale: Die im Deutschen etablierte biblische Namensform.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: Heute wird kein Hahn krähen
  rationale: Mit ἀλέκτωρ bezeichnet φωνέω idiomatisch das Krähen. Im Deutschen gibt „kein Hahn“ die Negation des artikellosen Subjekts natürlich wieder.
- source_word: ἕως
  choice: bevor
  rationale: Nach einem verneinten Hauptsatz bezeichnet ἕως die zeitliche Grenze. „Bevor“ ergibt im Deutschen eine klare und idiomatische Aussage, ohne eine zusätzliche Reihenfolge nach der dritten Verleugnung zu behaupten.
- source_word: τρίς
  choice: dreimal
  rationale: Direkte, moderne Entsprechung des Adverbs.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: du dreimal geleugnet hast, mich zu kennen
  rationale: 'εἰδέναι wird ausdrücklich wiedergegeben und bestimmt den Inhalt der Verleugnung: Petrus wird leugnen, Jesus zu kennen. Das Perfekt ist nach „bevor“ im Deutschen idiomatisch und stellt den Abschluss bis zum genannten Zeitpunkt dar.'
theological_decisions:
- issue: Gegenstand der angekündigten Verleugnung
  choice: „geleugnet hast, mich zu kennen“
  alternative: „mich dreimal verleugnet hast“
  rationale: Die Übersetzung bewahrt εἰδέναι und beschränkt die Aussage daher nicht bloß auf eine allgemeinere Lossagung von Jesus, sondern auf das Leugnen, ihn zu kennen.
- issue: Zeitliches Verhältnis von Hahnenschrei und dreifacher Verleugnung
  choice: „bevor du dreimal geleugnet hast“
  alternative: „bis du dreimal geleugnet hast“
  rationale: Beide Formulierungen können ἕως nach der Negation wiedergeben. „Bevor“ ist hier im Deutschen natürlicher und hält die Aussage auf die vorausgesagte Grenze zugespitzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und eindringlich; unnötig altertümliche Formen werden vermieden.
