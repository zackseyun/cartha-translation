id: LUK.22.31
reference: Luke 22:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: de
  text: 'Simon, Simon, sieh: Satan hat euch alle für sich gefordert, um euch wie Weizen zu sieben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und gegenwärtig wieder; die Anrede gilt Simon im Singular.
- source_word: ἐξῃτήσατο
  choice: hat ... für sich gefordert
  rationale: Die mediale Form bezeichnet ein nachdrückliches Verlangen zugunsten der eigenen Person. Die Wiedergabe wahrt diese Nuance, ohne ausdrücklich eine Erlaubnis oder deren Urheber in den Text einzutragen.
- source_word: ὑμᾶς
  choice: euch alle
  rationale: Das griechische Pronomen ist Plural, obwohl Simon unmittelbar im Singular angesprochen wird. „Alle“ macht diesen im Deutschen leicht übersehbaren Numeruswechsel deutlich.
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: um euch wie Weizen zu sieben
  rationale: Bewahrt das Bild und gibt die Infinitivkonstruktion idiomatisch als Absicht bzw. Ziel des Forderns wieder.
theological_decisions:
- issue: Ob Satans Forderung ausdrücklich als Bitte um Erlaubnis zu verstehen ist
  choice: „für sich gefordert“ ohne Nennung einer Erlaubnis
  alternative: „verlangt, euch sieben zu dürfen“ oder „sich von Gott erbeten“
  rationale: Der griechische Text nennt weder Gott noch ausdrücklich eine erteilte Erlaubnis. Die Übersetzung lässt den möglichen Hintergrund offen und fügt keine theologische Erklärung in den Vers ein.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung „Simon, Simon“ und der Wechsel vom Singular „sieh“ zum Plural „euch alle“ bleiben deutlich erhalten.
