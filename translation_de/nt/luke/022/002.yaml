source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: de
  text: Und die Hohenpriester und die Schriftgelehrten suchten nach einer Möglichkeit, ihn zu töten[a]; denn sie fürchteten das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn zu Tode zu bringen“.'
    reason: Lexikalische Alternative für ἀνέλωσιν; sie wahrt ebenfalls die tödliche Bedeutung, klingt jedoch etwas formeller.
lexical_decisions:
- source_word: ἐζήτουν
  choice: suchten nach einer Möglichkeit
  rationale: Das Imperfekt bezeichnet ein andauerndes Bemühen. Zusammen mit τὸ πῶς wird dies im Deutschen natürlich als Suche nach einer Möglichkeit ausgedrückt.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet die Jerusalemer priesterliche Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. Die Formulierung ist verständlich und vermeidet diese mögliche Irreführung.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Dies ist die etablierte und in diesem jüdischen Kontext sachgerechte deutsche Bezeichnung für die mit der Auslegung der heiligen Schriften und des Gesetzes befassten Fachleute.
- source_word: τὸ πῶς
  choice: nach einer Möglichkeit
  rationale: Die substantivierte Wendung bedeutet idiomatisch, auf welche Weise etwas geschehen könne. Die gewählte Form gibt die Überlegung natürlich wieder, ohne ein konkretes Verfahren vorwegzunehmen.
- source_word: ἀνέλωσιν
  choice: ihn zu töten
  rationale: ἀναιρέω bezeichnet hier klar die Tötung. Die direkte Wiedergabe bewahrt die Schärfe der Absicht und legt noch kein förmliches Hinrichtungsverfahren fest.
- source_word: ἐφοβοῦντο
  choice: sie fürchteten
  rationale: Das Imperfekt beschreibt den fortdauernden Grund ihres zögernden Vorgehens. Das deutsche Präteritum ist im Erzählstil natürlich und kann diesen Zustand ausdrücken.
- source_word: τὸν λαόν
  choice: das Volk
  rationale: λαός bezeichnet bei Lukas kollektiv das Volk und ist weiter als eine gerade versammelte Menschenmenge.
theological_decisions:
- issue: Stärke von ἀνέλωσιν und Absicht der Führung
  choice: „ihn zu töten“
  alternative: „ihn aus dem Weg zu schaffen“ oder „ihn hinrichten zu lassen“
  rationale: Die Übersetzung benennt die tödliche Absicht ungeschmälert, ohne bereits ein rechtliches Verfahren oder eine bestimmte Todesart in den Text einzutragen.
- issue: Bezugsumfang von λαός
  choice: „das Volk“
  alternative: „die Menschenmenge“
  rationale: Die kollektive, potenziell breitere Referenz bleibt erhalten; zugleich wird die erzählerische Spannung zwischen den Führenden und der öffentlichen Reaktion nicht verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung und der begründende Nachsatz folgen der knappen griechischen Erzählweise; „suchten nach einer Möglichkeit“ ist gegenüber einer wörtlicheren, aber schwerfälligen Wiedergabe von τὸ πῶς idiomatisch.
