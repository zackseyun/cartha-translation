- source_word: ἔκλαυσεν
  choice: weinte
  rationale: Gibt κλαίω im feierlich-ernsten Erzählzusammenhang präzise und allgemein verständlich wieder.
- source_word: πικρῶς
  choice: bitterlich
  rationale: Die feste deutsche Verbindung »bitterlich weinen« gibt die intensive, schmerzvolle Art des Weinens idiomatisch wieder.
