id: LUK.22.61
reference: Luke 22:61
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: de
  text: 'Da wandte sich der Herr um und sah Petrus an[a]. Und Petrus erinnerte sich an das Wort des Herrn, wie er zu ihm gesagt hatte: »Noch bevor heute ein Hahn kräht, wirst du mich dreimal verleugnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »blickte Petrus fest an«; das griechische Verb kann einen direkten oder eindringlichen Blick bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: wandte sich … um
  rationale: Das Aoristpartizip bezeichnet die dem Blick vorausgehende Wendung des Herrn. Die finite deutsche Form gibt die Abfolge natürlich wieder.
- source_word: κύριος
  choice: Herr
  rationale: Der Titel bezeichnet hier Jesus und bewahrt sowohl den üblichen neutestamentlichen Sprachgebrauch als auch sein christologisches Gewicht.
- source_word: ἐνέβλεψεν
  choice: sah … an
  rationale: Die Wendung ist klares, natürliches Deutsch. Das Verb kann einen direkten oder eindringlichen Blick bezeichnen; diese mögliche stärkere Nuance wird in der Fußnote bewahrt.
- source_word: ὑπεμνήσθη
  choice: erinnerte sich
  rationale: Die Form kann auch im Sinn von »wurde erinnert« verstanden werden; im Kontext steht jedoch das Wiedererinnern des Petrus im Vordergrund. »Erinnerte sich« ist idiomatisch und wahrt die Aussage.
- source_word: λόγου
  choice: Wort
  rationale: λόγος bezeichnet hier die konkrete Äußerung Jesu. »Das Wort des Herrn« ist eine natürliche und etablierte Wiedergabe.
- source_word: ὡς
  choice: wie
  rationale: 'ὡς leitet hier den Inhalt beziehungsweise die Art dessen ein, woran Petrus sich erinnerte: wie der Herr es zu ihm gesagt hatte.'
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Noch bevor … ein Hahn kräht
  rationale: πρίν mit Infinitiv bezeichnet Vorzeitigkeit. Das artikellose ἀλέκτορα wird im Deutschen natürlich unbestimmt wiedergegeben; »noch bevor« bildet die zeitliche Zuspitzung idiomatisch ab.
- source_word: σήμερον
  choice: heute
  rationale: Die Wiedergabe entspricht der unmittelbaren Zeitangabe des griechischen Textes.
- source_word: ἀπαρνήσῃ
  choice: wirst du mich … verleugnen
  rationale: »Verleugnen« ist im Passionsbericht die präzise und geläufige Wiedergabe für das Abstreiten der Beziehung zu Jesus.
- source_word: τρίς
  choice: dreimal
  rationale: »Dreimal« ist die klare, moderne deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« bewahrt die übliche neutestamentliche Titulatur und deren christologisches Gewicht, ohne den Sinn auf die Lehrer-Schüler-Beziehung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parataktische Satzführung folgt dem erzählerischen Nachdruck des griechischen Textes; die direkte Rede ist klar und gegenwärtig formuliert.
