  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: de
  text: '[a] Und als er in schwere Angst geriet, betete er noch eindringlicher; und sein Schweiß wurde wie Blutstropfen,[b] die auf die Erde fielen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen Lukas 22,43–44 aus, andere enthalten diese Verse. Der SBLGNT kennzeichnet sie durch Klammern als textlich unsicher.
    reason: textual_variant
  - marker: b
    text: Das griechische Wort kann „Tropfen“ oder „Klumpen/Gerinnsel“ bedeuten. Das Vergleichswort „wie“ bezeichnet Ähnlichkeit und sagt nicht ausdrücklich, dass der Schweiß selbst Blut war.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: als er in Todesangst geriet
  rationale: Die Wendung beschreibt das Eintreten in einen Zustand äußerster innerer Bedrängnis. „Todesangst“ gibt die Schwere von ἀγωνία in diesem Zusammenhang natürlich und prägnant wieder, ohne einen körperlichen Todeskampf zu behaupten.
- source_word: ἐκτενέστερον
  choice: noch eindringlicher
  rationale: Der Komparativ bezeichnet eine gesteigerte Intensität. „Noch eindringlicher“ bewahrt diese Steigerung und klingt im Zusammenhang mit Beten natürlich.
- source_word: προσηύχετο
  choice: betete er
  rationale: Das deutsche Präteritum ist die natürliche Erzählform; die fortdauernde Handlung ergibt sich aus dem Zusammenhang und der Intensivierung durch „noch eindringlicher“.
- source_word: ἐγένετο
  choice: wurde
  rationale: „Wurde“ bewahrt den resultativen beziehungsweise verändernden Sinn des Verbs, ohne die Formulierung unnötig zu beschweren.
- source_word: ὡσεὶ
  choice: wie
  rationale: Das Vergleichswort wird ausdrücklich wiedergegeben und lässt offen, worin genau die Ähnlichkeit bestand; es setzt Schweiß und Blut nicht schlicht gleich.
- source_word: θρόμβοι αἵματος
  choice: Blutstropfen
  rationale: „Blutstropfen“ ist im Deutschen idiomatisch und passt zur beschriebenen Abwärtsbewegung. θρόμβοι kann auch dicke Tropfen oder Klumpen beziehungsweise Gerinnsel bezeichnen; diese Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: die auf die Erde fielen
  rationale: Die Formulierung gibt die Abwärtsbewegung anschaulich und in natürlichem Deutsch wieder.
theological_decisions:
- issue: Art des Vergleichs zwischen Schweiß und Blut
  choice: Der Schweiß wurde „wie Blutstropfen“; der Vergleich bleibt ausdrücklich erhalten.
  alternative: Der Schweiß war tatsächlich Blut.
  rationale: ὡσεὶ kennzeichnet grammatisch eine Ähnlichkeit. Die Übersetzung sollte daher weder eine medizinische Erklärung noch die Identität von Schweiß und Blut festlegen.
- issue: Textkritischer Status des Verses
  choice: Der Vers wird gemäß dem vorgegebenen SBLGNT-Text übersetzt und mit einem textkritischen Hinweis versehen.
  alternative: Lukas 22,43–44 aus dem Haupttext auslassen.
  rationale: Die Handschriftenüberlieferung ist geteilt; einige Zeugen lassen beide Verse aus, andere enthalten sie. Der gewählte Ausgangstext druckt sie unter Kennzeichnung der Unsicherheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. „Todesangst“ vermittelt die äußerste Bedrängnis anschaulich; „noch eindringlicher“ wahrt den Komparativ. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Aussage.
