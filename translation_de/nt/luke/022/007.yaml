  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: de
  text: Dann kam der Tag der ungesäuerten Brote, an dem das Passah[a] geopfert werden musste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Passahlamm“ beziehungsweise „das Passahopfer“. Das griechische Wort kann das Passahfest oder, wie hier im Zusammenhang mit dem Opfern, dessen Opfertier bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι bezeichnet hier idiomatisch das Eintreffen eines bestimmten Tages. „Kam“ ist im Deutschen natürlich und bewahrt das Zeitbild des griechischen Ausdrucks.
- source_word: δὲ
  choice: Dann
  rationale: δέ führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge im Deutschen klar wieder, ohne den Übergang überzubetonen.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: der Tag der ungesäuerten Brote
  rationale: Die Genitivverbindung bezeichnet den betreffenden Festtag. Der Singular „Tag“ folgt dem griechischen Text; „ungesäuerte Brote“ ist die geläufige und sachlich genaue Bezeichnung.
- source_word: ᾗ
  choice: an dem
  rationale: Das Dativ-Relativpronomen bezieht sich auf „Tag“ und hat zeitliche Bedeutung. „An dem“ bewahrt die Relativkonstruktion natürlich.
- source_word: ἔδει
  choice: musste
  rationale: Das Imperfekt des unpersönlichen δεῖ drückt eine bestehende Notwendigkeit oder Vorschrift aus. „Musste“ ist knapp, idiomatisch und lässt offen, ob vor allem kultische Vorschrift oder kalendarische Notwendigkeit gemeint ist.
- source_word: θύεσθαι
  choice: geopfert werden
  rationale: θύω bezeichnet in diesem kultischen Zusammenhang das Schlachten als Opferhandlung. „Geopfert werden“ macht den rituellen Sinn deutlich; „geschlachtet werden“ wäre ebenfalls möglich, betonte aber stärker den Vorgang als dessen Opfercharakter.
- source_word: τὸ πάσχα
  choice: das Passah
  rationale: πάσχα kann das Passahfest, das Passahmahl oder das Passahopfer beziehungsweise dessen Opfertier bezeichnen. Zusammen mit θύεσθαι ist konkret das Passahopfer gemeint; die knappe Wiedergabe „das Passah“ bewahrt jedoch die Bedeutungsbreite des griechischen Ausdrucks.
theological_decisions:
- issue: Bezugsbedeutung von τὸ πάσχα im Opferkontext
  choice: Im Haupttext steht „das Passah“; der Opferbezug wird durch „geopfert werden“ erkennbar.
  alternative: „das Passahlamm“ oder „das Passahopfer“
  rationale: Der griechische Ausdruck benennt das Opfertier nicht ausdrücklich als Lamm und besitzt eine breitere Bedeutungsweite. Eine Präzisierung im Haupttext würde die kontextuell wahrscheinliche Bedeutung festlegen; die Fußnote macht diese Deutung transparent, ohne die sprachliche Offenheit des Originals zu beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Passah“ folgt der im Deutschen etablierten Form; die Satzstruktur bleibt nah am Griechischen, ohne unnatürlich zu wirken.
