  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: de
  text: 'Doch seht: Die Hand dessen, der mich ausliefert, ist mit mir auf dem Tisch.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert den starken Gegensatz zum unmittelbar Vorangehenden natürlich und knapp.
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Imperativ und spricht die anwesende Gruppe angemessen an.
- source_word: τοῦ παραδιδόντος με
  choice: dessen, der mich ausliefert
  rationale: Gibt das substantivierte Präsenspartizip wieder, ohne durch „Verräter“ zusätzliche Festlegung einzutragen; „ausliefern“ entspricht dem Bedeutungsbereich von παραδίδωμι im Passionszusammenhang.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: mit mir auf dem Tisch
  rationale: Folgt der auffälligen räumlichen Formulierung des Griechischen und bewahrt das gemeinsame Mahl als Bild.
theological_decisions:
- issue: Bezeichnung der ausliefernden Person
  choice: dessen, der mich ausliefert
  alternative: meines Verräters
  rationale: Die gewählte Fassung erhält die verbale, gegenwärtige Beschreibung des griechischen Partizips und vermeidet eine stärker deutende Substantivierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Bild; „seht“ ist als Anrede an die Tischgemeinschaft im Plural formuliert.
