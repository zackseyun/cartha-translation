source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: de
  text: 'Und er nahm Brot, dankte, brach es und gab es ihnen mit den Worten: „Das ist mein Leib[c], der für euch gegeben wird[b]. Tut dies immer wieder in Erinnerung an mich.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen die Worte „der für euch gegeben wird. Tut dies immer wieder in Erinnerung an mich“ aus.
    reason: textual_variant
  - marker: b
    text: 'Oder: „der gerade für euch gegeben wird“.'
    reason: lexical_alternative
  - marker: c
    text: „Das ist mein Leib“ ist dem griechischen Wortlaut entsprechend übersetzt. Manche deuten die Aussage im Sinn von „Das steht für meinen Leib“; im griechischen Text steht jedoch „ist“.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: er nahm Brot
  rationale: Das vorangestellte Partizip wird im Deutschen natürlich als koordiniertes Verb wiedergegeben. „Brot“ entspricht dem artikellosen ἄρτον in diesem Mahlkontext, ohne unnötig „ein Brot“ oder „das Brot“ festzulegen.
- source_word: εὐχαριστήσας
  choice: dankte
  rationale: Die knappe Wiedergabe bewahrt die vorausgehende Danksagung, ohne einen im Griechischen nicht ausdrücklich genannten Adressaten oder eine bestimmte liturgische Formel einzufügen.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: brach es und gab es ihnen
  rationale: Das im Deutschen erforderliche Pronomen „es“ nimmt „Brot“ auf; die Handlungsschritte bleiben in ihrer griechischen Reihenfolge erhalten.
- source_word: λέγων
  choice: mit den Worten
  rationale: Diese idiomatische deutsche Verbindung leitet die direkte Rede würdig und flüssig ein, ohne den Sinn des begleitenden Partizips zu verändern.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Das ist mein Leib
  rationale: „Ist“ gibt die Kopula unmittelbar wieder und vermeidet eine deutende Auflösung durch „bedeutet“ oder „stellt dar“. „Leib“ ist im Abendmahlskontext die natürliche, traditionsübergreifend verständliche Wiedergabe von σῶμα.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: der für euch gegeben wird
  rationale: Die artikulierte Partizipialfügung wird als Relativsatz wiedergegeben. „Für euch“ lässt die genaue benefaktive beziehungsweise stellvertretende Nuance von ὑπέρ offen; „gegeben wird“ bewahrt Form und Zeitbezug des Präsenspartizips.
- source_word: τοῦτο ποιεῖτε
  choice: Tut dies immer wieder
  rationale: Der Präsensimperativ kann in diesem Stiftungskontext eine fortgesetzte oder wiederholte Praxis bezeichnen. „Immer wieder“ macht diese Kraft in natürlichem Deutsch sichtbar, ohne eine Häufigkeit festzulegen.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: in Erinnerung an mich
  rationale: Die Formulierung bezeichnet verständlich den auf Jesus bezogenen Akt des Erinnerns beziehungsweise Gedenkens und vermeidet den im heutigen Deutsch leicht dinglich oder ausschließlich funerär klingenden Ausdruck „zu meinem Gedächtnis“.
theological_decisions:
- issue: Bedeutung von „Das ist mein Leib“ im Abendmahlskontext
  choice: Die direkte Aussage „Das ist mein Leib“ bleibt unverändert stehen.
  alternative: „Das bedeutet meinen Leib“ oder „Das stellt meinen Leib dar“
  rationale: Das Griechische verwendet ausdrücklich ἐστιν („ist“). Die Übersetzung soll die umstrittene sakramentale Deutung nicht vorentscheiden, sondern Wortlaut und theologische Spannung bewahren.
- issue: Textkritischer Status des längeren Wortlauts in Lukas 22,19
  choice: Der im SBLGNT gekennzeichnete längere Wortlaut wird in den Haupttext aufgenommen und seine Auslassung in einigen Handschriften in einer Fußnote genannt.
  alternative: Der Vers endet im Haupttext nach „Das ist mein Leib“.
  rationale: Die vorgelegte griechische Ausgabe führt den längeren Wortlaut als Arbeitstext, kennzeichnet ihn jedoch als textkritisch umstritten. Haupttext und Fußnote bilden beide Befundseiten transparent ab.
- issue: Zeitbezug von διδόμενον
  choice: „der für euch gegeben wird“
  alternative: „der für euch hingegeben wird“ oder „der für euch gegeben ist“
  rationale: Das Präsenspassiv bleibt sichtbar, ohne durch „hingegeben“ die Opferkonnotation stärker auszudeuten oder durch ein resultatives Perfekt den zeitlichen Aspekt zu verschieben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Kurze koordinierte Verben folgen dem Erzählfluss. „Leib“ wahrt den vertrauten sakramentalen Sprachgebrauch, während die Fußnoten textkritische und auslegungsbezogene Offenheit sichern.
