id: LUK.22.53
reference: Luke 22:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: de
  text: Tag für Tag war ich bei euch im Tempel, und ihr habt nicht Hand an mich gelegt. Aber dies ist eure Stunde und die Macht der Finsternis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vollmacht der Finsternis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung bezeichnet ein täglich wiederkehrendes Geschehen; „Tag für Tag“ gibt diesen fortlaufenden Sinn natürlich wieder.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: war ich bei euch
  rationale: Der Genitivus absolutus wird als temporaler Begleitumstand wiedergegeben und eng mit „Tag für Tag“ verbunden.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempelbereich, nicht nur das innere Heiligtum; „im Tempel“ ist die übliche, verständliche Wiedergabe.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: ihr habt nicht Hand an mich gelegt
  rationale: Die deutsche Redewendung bewahrt das Bild des Ausstreckens der Hände und bezeichnet im Zusammenhang treffend das feindliche Ergreifen beziehungsweise Verhaften.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Aber dies ist eure Stunde
  rationale: „Eure Stunde“ bewahrt den feierlichen Sinn eines ihnen zukommenden beziehungsweise eingeräumten Zeitpunkts, ohne ihn weiter auszudeuten.
- source_word: ἐξουσία
  choice: Macht
  rationale: ἐξουσία kann Vollmacht, Befugnis oder Herrschaftsmacht bezeichnen. Im idiomatischen Ausdruck „Macht der Finsternis“ bleibt sowohl wirksame Gewalt als auch Herrschaft im Blick.
- source_word: τοῦ σκότους
  choice: der Finsternis
  rationale: „Finsternis“ erhält die personifizierende und theologisch gewichtige Metapher, ohne sie ausdrücklich mit Satan oder dem Bösen gleichzusetzen.
theological_decisions:
- issue: Ob „die Macht der Finsternis“ ausdrücklich als Satans Macht oder als Herrschaft des Bösen erklärt werden soll
  choice: Die metaphorische Formulierung „die Macht der Finsternis“ bleibt im Haupttext stehen.
  alternative: „die Vollmacht der Finsternis“, „Satans Macht“ oder „die Herrschaft des Bösen“
  rationale: Der griechische Text nennt ausdrücklich die Finsternis und lässt den genauen persönlichen beziehungsweise kosmischen Bezug unausgesprochen. Die Metapher bewahrt diese theologische Spannung.
- issue: Semantische Breite von ἐξουσία
  choice: Macht
  alternative: Vollmacht
  rationale: „Macht“ ist im Deutschen in Verbindung mit „Finsternis“ natürlich und schließt wirksame Herrschaft ein; „Vollmacht“ betont stärker verliehene oder rechtmäßige Befugnis und wird deshalb als mögliche Alternative vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstellung bleibt klar und mündlich sprechbar. „Hand an jemanden legen“ ist eine heute verständliche Wendung für feindliches Ergreifen; „eure Stunde“ und „Finsternis“ bewahren den feierlichen, bildhaften Charakter des Ausgangstextes.
