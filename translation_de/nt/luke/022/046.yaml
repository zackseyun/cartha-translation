  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Warum schlaft ihr? Steht auf und betet, damit ihr nicht in Versuchung geratet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: schlaft ihr
  rationale: Gibt das Präsens direkt und natürlich wieder.
- source_word: ἀναστάντες
  choice: Steht auf
  rationale: Das partizipiale ἀναστάντες wird im Deutschen idiomatisch als Aufforderung wiedergegeben; »steht auf« bewahrt die körperliche Bewegung und den imperativischen Sinn.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Direkte und geläufige Wiedergabe des Präsensimperativs.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: in Versuchung geratet
  rationale: Die idiomatische deutsche Wendung bewahrt das Bild des Hineinkommens in eine Prüfung oder Versuchung, ohne den möglichen Ausgang bereits vorwegzunehmen.
theological_decisions:
- issue: Bedeutungsumfang von πειρασμός
  choice: Versuchung
  alternative: Prüfung
  rationale: Im unmittelbaren Zusammenhang bezeichnet »Versuchung« verständlich die gefährliche Bewährungssituation; das griechische Wort kann zugleich »Prüfung« bedeuten, weshalb diese Bedeutungsbreite nicht durch eine weitergehende Deutung eingeengt wird.
- issue: Zweck- oder Folgesinn von ἵνα μή
  choice: damit ihr nicht
  alternative: sodass ihr nicht
  rationale: Die Aufforderung zum Gebet ist hier am natürlichsten als auf ein Ziel ausgerichtet zu verstehen; »damit« gibt dies wieder, ohne eine bestimmte Lehre über Versuchung oder Bewahrung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, mündlich natürlicher Rede. Keine Fußnoten erforderlich.
