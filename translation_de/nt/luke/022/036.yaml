reference: Luke 22:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: de
  text: Doch jetzt soll jeder, der einen Geldbeutel hat, ihn mitnehmen und ebenso einen Reisebeutel. Und wer kein Schwert hat,[a] soll seinen Mantel verkaufen und eines kaufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht nur: „wer nicht hat“; das Objekt bleibt im Griechischen unausgesprochen. „Schwert“ ist aus der folgenden Aufforderung ergänzt.'
    reason: textual_ambiguity
  - marker: b
    text: Das griechische Wort μάχαιρα kann auch eine kürzere Klingenwaffe bezeichnen, etwa einen Dolch oder ein Kurzschwert.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Doch jetzt
  rationale: Kennzeichnet den deutlichen Gegensatz zu den vorherigen Anweisungen und bewahrt zugleich den zeitlichen Bezug von νῦν.
- source_word: βαλλάντιον
  choice: Geldbeutel
  rationale: Bezeichnet einen Beutel zum Aufbewahren und Mitführen von Geld; „Geldbeutel“ ist im modernen Deutsch eindeutig und natürlich.
- source_word: ἀράτω
  choice: soll … mitnehmen
  rationale: αἴρω bedeutet hier im Zusammenhang der Reisevorbereitung, etwas an sich zu nehmen beziehungsweise mitzuführen.
- source_word: ὁμοίως καὶ πήραν
  choice: ebenso eine Reisetasche
  rationale: πήρα bezeichnet den Beutel eines Reisenden; „Reisetasche“ gibt dessen Funktion verständlich wieder, ohne eine bestimmte Form festzulegen.
- source_word: ὁ μὴ ἔχων
  choice: wer kein Schwert hat
  rationale: Das griechische Partizip nennt sein Objekt nicht ausdrücklich. Aus der unmittelbar folgenden Aufforderung, ein Schwert zu kaufen, wird „Schwert“ für einen natürlichen deutschen Satz ergänzt; die Ellipse wird in einer Fußnote offengelegt.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: seinen Mantel
  rationale: ἱμάτιον bezeichnet hier das äußere Kleidungsstück; „Mantel“ ist eine klare, geläufige Wiedergabe.
- source_word: πωλησάτω … καὶ ἀγορασάτω
  choice: soll … verkaufen und … kaufen
  rationale: Die Konstruktion mit „soll“ gibt die beiden Imperative im modernen Deutsch deutlich und würdig wieder.
- source_word: μάχαιραν
  choice: ein Schwert
  rationale: μάχαιρα kann ein Schwert beziehungsweise eine kürzere Klingenwaffe bezeichnen. „Schwert“ ist die übliche, nicht übermäßig präzise Wiedergabe.
theological_decisions:
- issue: Ob die Aufforderung zum Kauf eines Schwertes in der Übersetzung abgeschwächt oder bildlich erklärt werden soll
  choice: Die direkte Aufforderung wird als „soll … ein Schwert kaufen“ wiedergegeben.
  alternative: Die Aussage als bloß bildliche Vorbereitung auf Gefahr umschreiben oder allgemein „Waffe“ sagen.
  rationale: Der griechische Text verwendet μάχαιρα und direkte Imperative. Die Übersetzung bewahrt diese Spannung und entscheidet nicht, wie die Aufforderung im größeren theologischen Zusammenhang auszulegen ist.
- issue: Das im Ausdruck ὁ μὴ ἔχων fehlende Objekt
  choice: Im Haupttext wird aus dem Folgesatz „Schwert“ ergänzt und die Ergänzung durch eine Fußnote kenntlich gemacht.
  alternative: „wer nichts hat“ oder „wer keines hat“
  rationale: Die Alternativen bilden die Ellipse formaler ab, können im Deutschen jedoch den Besitz überhaupt oder die unmittelbar zuvor genannte Reisetasche meinen. Die gewählte Fassung ist verständlich, ohne die sprachliche Offenheit zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Satzbau. Die generische Form „jeder, der“ vermeidet unnötige Altertümlichkeit; die direkte Rede bleibt knapp und nachdrücklich.
