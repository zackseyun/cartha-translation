reference: Luke 22:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: de
  text: Und er ging fort und besprach mit den Hohepriestern und den Befehlshabern[a], wie er ihn an sie ausliefern könnte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind wahrscheinlich die Befehlshaber der Tempelwache beziehungsweise Amtsträger der Tempelbehörde, nicht römische Soldaten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wie er ihn an sie verraten könnte“. Das griechische Verb kann „übergeben“, „ausliefern“ oder in diesem Zusammenhang „verraten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθὼν
  choice: er ging fort
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende bzw. mit ihr eng verbundene Bewegung. Die koordinierte deutsche Form ist natürlich und wahrt den knappen Erzählfluss.
- source_word: συνελάλησεν
  choice: besprach mit
  rationale: Das Verb bezeichnet gemeinsames Reden oder Beraten. „Besprechen mit“ gibt den beratenden Charakter in modernem Deutsch wieder.
- source_word: ἀρχιερεῦσιν
  choice: führenden Priestern
  rationale: Der Plural bezeichnet die leitenden priesterlichen Autoritäten, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ ist verständlich und sachlich präzise.
- source_word: στρατηγοῖς
  choice: Befehlshabern
  rationale: Der Ausdruck bezeichnet hier Amtsträger mit Befehlsgewalt im Umfeld des Tempels. Die kontextuelle Eingrenzung auf die Tempelwache wird in der Fußnote erläutert.
- source_word: τὸ πῶς
  choice: wie
  rationale: Die substantivierte Frageformel führt den Inhalt der Besprechung ein und wird im Deutschen idiomatisch mit „wie“ wiedergegeben.
- source_word: παραδῷ
  choice: ausliefern könnte
  rationale: παραδίδωμι bezeichnet das Übergeben oder Ausliefern; im Zusammenhang ist die Handlung zugleich Verrat. „Ausliefern“ bewahrt den konkreten Sinn, ohne die kontextuelle Wertung zu verdecken.
- source_word: αὐτοῖς ... αὐτόν
  choice: ihn an sie
  rationale: 'Die beiden Pronomen bleiben klar unterschieden: Jesus ist der Ausgelieferte, die genannten Autoritäten sind die Empfänger.'
theological_decisions:
- issue: Wiedergabe von παραδῷ bei Judas’ Handeln
  choice: ihn an sie ausliefern
  alternative: ihn an sie verraten / ihnen übergeben
  rationale: Der Zusammenhang beschreibt Verrat, doch das griechische Verb hat den weiteren Grundsinn des Übergebens oder Auslieferns. Der Haupttext bewahrt diesen Sinn; die Fußnote nennt die kontextuell mögliche Wiedergabe „verraten“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem Erzählfluss. „Führende Priester“ vermeidet das missverständliche „Hohepriester“ im Plural; die beiden erklärungsbedürftigen Begriffe werden durch unmittelbar gesetzte Fußnotenmarker erläutert.
