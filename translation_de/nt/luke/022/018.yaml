id: LUK.22.18
reference: Luke 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: de
  text: 'Denn ich sage euch: Von jetzt an werde ich keinesfalls mehr von der Frucht des Weinstocks trinken, bis das Reich Gottes kommt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die geläufige Anredeformel wird natürlich und zugleich quellennah wiedergegeben; „denn“ bewahrt den erklärenden Anschluss von γάρ an den vorherigen Vers.
- source_word: οὐ μὴ πίω
  choice: werde ich keinesfalls mehr … trinken
  rationale: οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung mit Zukunftsbezug. „Keinesfalls“ erhält die Verstärkung; „mehr“ ergibt sich im Deutschen natürlich aus ἀπὸ τοῦ νῦν und der zeitlichen Grenze mit „bis“.
- source_word: ἀπὸ τοῦ νῦν
  choice: Von jetzt an
  rationale: Die Wendung bezeichnet den gegenwärtigen Zeitpunkt als Beginn des angekündigten Nichttrinkens und wird idiomatisch wiedergegeben.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: von der Frucht des Weinstocks
  rationale: γένημα bezeichnet das Erzeugnis bzw. die Frucht. Die Formulierung wahrt den weiteren und feierlicheren griechischen Ausdruck, ohne ihn vorschnell auf „Wein“ zu verengen.
- source_word: ἕως οὗ
  choice: bis
  rationale: Die Konjunktion markiert knapp und eindeutig die zeitliche Grenze der Verneinung.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist im Deutschen die etablierte synoptische Wiedergabe und lässt sowohl den Herrschafts- als auch den Reichsaspekt anklingen.
- source_word: ἔλθῃ
  choice: kommt
  rationale: Der Aorist Konjunktiv nach ἕως οὗ bezeichnet ein zukünftiges Geschehen; im deutschen Temporalsatz ist das Präsens „kommt“ natürlich und genau.
theological_decisions:
- issue: Wiedergabe von γενήματος τῆς ἀμπέλου als „Wein“ oder als „Frucht des Weinstocks“
  choice: Frucht des Weinstocks
  alternative: Wein
  rationale: Der griechische Wortlaut nennt nicht ausdrücklich οἶνος („Wein“), sondern verwendet einen weiteren Ausdruck. Die Übersetzung bewahrt diese Formulierung und ihre Mahlkontext-Resonanz, ohne den Inhalt des Bechers enger festzulegen als die Quelle.
- issue: Art oder Stadium des Kommens des Reiches Gottes
  choice: bis das Reich Gottes kommt
  alternative: bis das Reich Gottes vollständig gekommen ist
  rationale: Der Text setzt eine zukünftige zeitliche Grenze, bestimmt aber weder die genaue Weise noch ein bestimmtes Stadium des Kommens. Die schlichte Formulierung erhält diese theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an Satzbau und Nachdruck des griechischen Textes. Die traditionelle, aber weiterhin gut verständliche Wendung „Frucht des Weinstocks“ bewahrt die Bildsprache. Kein Fußnotenmarker ist erforderlich, da die quellennähere Lesart direkt im Haupttext steht und „Wein“ keine notwendige textkritische oder semantische Ergänzung darstellt.
