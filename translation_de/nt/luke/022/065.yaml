  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: de
  text: Und sie sagten noch viele andere Schmähungen gegen ihn[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „noch viele andere Lästerungen“ oder „noch viele andere Beleidigungen“. Das griechische Wort kann schmähende, verleumderische oder beleidigende Rede bezeichnen; „Schmähungen“ gibt den starken, feindseligen Sinn wieder, ohne ihn auf einen technischen Sinn von Gotteslästerung einzuengen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „zu ihm“. In diesem Zusammenhang gibt „gegen ihn“ die feindselige Ausrichtung der Worte deutlicher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verbindung führt die unmittelbar zuvor geschilderten Misshandlungen weiter.
- source_word: ἕτερα πολλὰ
  choice: noch vieles andere
  rationale: Die Wendung bezeichnet zahlreiche weitere Äußerungen zusätzlich zu dem bereits Berichteten; „noch vieles andere“ ist im Deutschen natürlich.
- source_word: βλασφημοῦντες
  choice: Lästerliche
  rationale: Das substantivierte Adjektiv gibt das begleitende Partizip idiomatisch wieder und bewahrt die starke Bedeutung von βλασφημέω, ohne den möglichen weiteren Sinn von Schmähung oder Beschimpfung auszuschließen.
- source_word: ἔλεγον
  choice: sie sagten
  rationale: Das Präteritum ist in deutscher Erzählprosa die natürliche Wiedergabe des Imperfekts; der Zusammenhang mit „noch vieles andere“ lässt die fortgesetzte beziehungsweise wiederholte Rede erkennen.
- source_word: εἰς αὐτόν
  choice: gegen ihn
  rationale: Bei feindseliger Rede bringt „gegen ihn“ die adversative Richtung der Äußerungen klar zum Ausdruck; das wörtlichere „zu ihm“ bleibt als mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsstärke von βλασφημοῦντες
  choice: „Lästerliche“ mit dem starken Sinn von Lästerung beibehalten
  alternative: „Beleidigendes“, „Schmähendes“ oder „Beschimpfungen“
  rationale: βλασφημέω kann allgemein verleumderische oder schmähende Rede bezeichnen, trägt hier aber eine starke Bedeutung. „Lästerliche“ wahrt dieses Gewicht, während die Fußnote die breitere lexikalische Spannweite offenhält und nicht allein aufgrund der Identität Jesu eine engere technische Bedeutung erzwingt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung ist knapp und folgt der griechischen Satzstruktur, ohne im Deutschen unnatürlich zu wirken. Die Großschreibung von „Lästerliche“ beruht auf der Substantivierung.
