source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: de
  text: 'Und ihr sollt zu dem Hausherrn sagen: »Der Lehrer sagt dir: Wo ist das Gästezimmer[a], in dem ich mit meinen Jüngern das Passamahl essen kann?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unterkunft«. Das griechische Wort bezeichnet einen Ort zum Übernachten oder einen Gästeraum, hier jedoch nicht speziell eine Herberge. Dass es sich um einen Raum im Obergeschoss handelt, wird erst im folgenden Vers gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: dem Hausherrn
  rationale: οἰκοδεσπότης bezeichnet das Oberhaupt beziehungsweise den Verantwortlichen eines Hauses. »Hausherr« ist im Deutschen natürlich und gibt die Autoritätsnuance samt dem im Griechischen ausdrücklich genannten Haus knapp wieder.
- source_word: ὁ διδάσκαλος
  choice: Der Lehrer
  rationale: διδάσκαλος ist hier eine erkennbare Selbstbezeichnung Jesu. »Lehrer« übersetzt den Titel unmittelbar, ohne die weitergehenden Bedeutungen von »Meister« einzutragen.
- source_word: κατάλυμα
  choice: Gästezimmer
  rationale: κατάλυμα bezeichnet einen Unterkunfts- oder Gästeraum. Im häuslichen Zusammenhang passt »Gästezimmer« am besten; »Herberge« wäre irreführend und »Obergemach« wird erst durch den folgenden Vers nahegelegt.
- source_word: τὸ πάσχα
  choice: das Passamahl
  rationale: πάσχα kann das Fest oder das zugehörige Mahl bezeichnen. Wegen φάγω (»essen«) steht hier das Mahl im Vordergrund; »Passamahl« macht dies im Deutschen idiomatisch deutlich.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: mit meinen Jüngern
  rationale: μαθητής bezeichnet in den Evangelien einen Schüler und verbindlichen Nachfolger. »Jünger« ist dafür die etablierte und semantisch passende deutsche Wiedergabe.
- source_word: φάγω
  choice: essen kann
  rationale: Der Aorist Konjunktiv in der mit ὅπου eingeleiteten indirekten Frage bezeichnet die vorgesehene beziehungsweise mögliche Handlung. »essen kann« ist natürliches modernes Deutsch und bewahrt diese Nuance.
- source_word: ἐρεῖτε
  choice: ihr sollt ... sagen
  rationale: Das Futur hat im Kontext anweisende Funktion. Das deutsche »sollt ... sagen« macht diese pragmatische Funktion natürlicher deutlich als ein bloßes »werdet sagen«.
- source_word: Λέγει σοι
  choice: lässt dir sagen
  rationale: Wörtlich steht »sagt dir«. Im Deutschen ist »lässt dir sagen« bei einer durch Boten übermittelten Nachricht idiomatisch und bildet die Kommunikationssituation klar ab.
theological_decisions:
- issue: Jesu Selbstbezeichnung mit dem Titel διδάσκαλος
  choice: Der Lehrer
  alternative: Der Meister
  rationale: Die direkte Übersetzung »Lehrer« bewahrt die Bedeutung des griechischen Titels und vermeidet zusätzliche traditionelle oder herrschaftliche Konnotationen von »Meister«.
- issue: Bedeutungsumfang von πάσχα
  choice: das Passamahl
  alternative: das Passa
  rationale: Im Zusammenhang mit »essen« ist konkret das Mahl gemeint. Die Wahl verdeutlicht diesen kontextuellen Bezug, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich gestaltet; »Passamahl« und »Jünger« bewahren den biblisch-jüdischen beziehungsweise evangelischen Sachbezug. Der Fußnotenmarker [a] steht unmittelbar bei dem erläuterten Ausdruck.
