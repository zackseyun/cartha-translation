id: LUK.22.22
reference: Luke 22:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: de
  text: Denn der Menschensohn geht zwar seinen Weg, wie es bestimmt ist; doch wehe jenem Menschen, durch den er ausgeliefert wird![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den er verraten wird“. Das griechische Verb kann sowohl „ausliefern/übergeben“ als auch im Zusammenhang eines Treuebruchs „verraten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung der vorausgehenden Aussage ein und entspricht dem griechischen Diskurszusammenhang natürlich.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt die etablierte Selbstbezeichnung Jesu und ihre biblischen Bezüge.
- source_word: μέν … πλὴν
  choice: zwar … doch
  rationale: Gibt die griechische Gegenüberstellung idiomatisch wieder und hält Gottes Bestimmung und die Verantwortung des handelnden Menschen nebeneinander.
- source_word: κατὰ τὸ ὡρισμένον
  choice: wie es bestimmt ist
  rationale: Bewahrt die Aussage einer vorausliegenden Bestimmung, ohne den im Passiv unausgesprochenen Urheber ausdrücklich zu ergänzen.
- source_word: πορεύεται
  choice: geht seinen Weg
  rationale: Das Verb bezeichnet hier Jesu Weg zu seinem bevorstehenden Leiden und Tod; die deutsche Wendung ist natürlich und lässt das Ziel wie der griechische Text unausgesprochen.
- source_word: οὐαὶ
  choice: wehe
  rationale: Bewahrt die prophetische Kraft des Wehe-Rufs, der sowohl Klage als auch drohendes Unheil ausdrücken kann.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: jenem Menschen
  rationale: Bezeichnet den bestimmten männlichen Täter, ohne seinen Namen in den Vers einzutragen.
- source_word: δι’ οὗ
  choice: durch den
  rationale: Gibt διά mit Genitiv als vermittelte Urheberschaft wieder.
- source_word: παραδίδοται
  choice: ausgeliefert wird
  rationale: Bewahrt den konkreten Sinn des Übergebens bzw. Auslieferns und lässt zugleich im Kontext den verräterischen Charakter der Tat erkennen; die mögliche Wiedergabe mit „verraten“ wird in der Fußnote genannt.
theological_decisions:
- issue: Verhältnis von göttlicher Bestimmung und menschlicher Verantwortung
  choice: Der Menschensohn geht, wie es bestimmt ist; zugleich gilt dem an seiner Auslieferung beteiligten Menschen der Wehe-Ruf.
  alternative: Eine Wiedergabe, die entweder die vorausliegende Bestimmung oder die Verantwortung des Verräters abschwächt.
  rationale: Der griechische Text stellt beide Aussagen ausdrücklich nebeneinander. Die Übersetzung wahrt diese Spannung, ohne sie zugunsten eines theologischen Systems aufzulösen.
- issue: Unausgesprochener Urheber der Bestimmung
  choice: Passivisch „wie es bestimmt ist“ ohne ausdrückliche Nennung Gottes.
  alternative: „wie Gott es bestimmt hat“
  rationale: Der Zusammenhang legt göttliche Bestimmung nahe, doch der griechische Wortlaut nennt den Urheber nicht ausdrücklich; deshalb wird er nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zwar … doch“ bildet den Kontrast klar ab; „geht seinen Weg“ ist verständlich und trägt den im Kontext auf Leiden und Tod gerichteten Gebrauch von πορεύεται, ohne das Ziel ausdrücklich hinzuzufügen.
