id: LUK.22.25
reference: Luke 22:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Die Könige der Völker[a] herrschen über sie, und diejenigen, die Macht über sie ausüben, werden Wohltäter[b] genannt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nichtjuden“; gemeint sein können die nichtjüdischen Völker.'
    reason: lexical_alternative
  - marker: b
    text: „Wohltäter“ war ein Ehrentitel für Herrscher oder einflussreiche Förderer, die als Unterstützer des Gemeinwohls galten.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: Könige
  rationale: Das Substantiv bezeichnet ausdrücklich Könige und nicht lediglich Herrschende im Allgemeinen.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: Die Wiedergabe bleibt nah am griechischen Ausdruck und bewahrt zugleich dessen mögliche Bedeutung als Bezeichnung der nichtjüdischen Völker.
- source_word: κυριεύουσιν
  choice: herrschen über
  rationale: Die Formulierung gibt die Ausübung von Herrschaft wieder; der Zusammenhang lässt dabei den kritischen Unterton erkennen, ohne ihn durch eine stärker wertende Umschreibung zu überzeichnen.
- source_word: ἐξουσιάζοντες
  choice: die Macht … ausüben
  rationale: 'Die verbale Wiedergabe erhält den aktiven Sinn des Partizips: Gemeint sind Menschen, die ihre Macht tatsächlich ausüben.'
- source_word: εὐεργέται
  choice: Wohltäter
  rationale: „Wohltäter“ gibt sowohl die gewöhnliche Wortbedeutung als auch den damaligen Ehrentitel für Herrscher und einflussreiche Förderer knapp wieder.
- source_word: καλοῦνται
  choice: werden … genannt
  rationale: Die passive Form bezeichnet den Namen beziehungsweise Ehrentitel, der diesen Machthabern gegeben wird.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ macht den leichten Gegensatz zum vorausgehenden Streit der Jünger natürlich sichtbar.
theological_decisions:
- issue: Bedeutung von ἐθνῶν im Zusammenhang
  choice: Völker
  alternative: Nichtjuden
  rationale: „Völker“ entspricht dem griechischen Ausdruck unmittelbar und lässt offen, ob allgemein politische Völker oder besonders die nichtjüdischen Völker gemeint sind. Die im lukanischen Sprachgebrauch häufige zweite Bedeutung wird in der Fußnote kenntlich gemacht, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die parallelen Wendungen „herrschen über sie“ und „Macht über sie ausüben“ spiegeln die Struktur des griechischen Satzes, ohne unnötig altertümlich zu klingen.
