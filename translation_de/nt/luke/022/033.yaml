id: LUK.22.33
reference: Luke 22:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: de
  text: 'Er aber sagte zu ihm: »Herr, ich bin bereit, mit dir sowohl ins Gefängnis als auch in den Tod zu gehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Er aber
  rationale: Der Artikel steht pronominal und verweist im Zusammenhang auf Petrus; δέ markiert den leichten Gegensatz zu Jesu vorausgehender Aussage.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Die Formulierung gibt Verb und indirektes Objekt genau wieder, ohne den im Kontext eindeutigen Bezug im Haupttext ausdrücklich zu ergänzen.
- source_word: Κύριε
  choice: Herr
  rationale: Die direkte Anrede bewahrt sowohl den respektvollen Titel als auch dessen christologische Bedeutung.
- source_word: μετὰ σοῦ
  choice: mit dir
  rationale: μετά mit Genitiv bezeichnet Begleitung; »mit dir« ist die natürliche deutsche Entsprechung.
- source_word: ἕτοιμός εἰμι
  choice: ich bin bereit
  rationale: Die Wendung drückt Bereitschaft und Entschlossenheit aus und lässt zugleich die Selbstsicherheit der Aussage erkennen.
- source_word: καὶ ... καὶ
  choice: sowohl ... als auch
  rationale: Die paarige Konstruktion verbindet und betont die beiden parallelen Ziele.
- source_word: εἰς φυλακὴν
  choice: ins Gefängnis
  rationale: φυλακή bezeichnet hier Haft oder Gefängnis; die Formulierung bewahrt die Richtungsangabe von εἰς.
- source_word: εἰς θάνατον
  choice: in den Tod
  rationale: Die Wendung bezeichnet die Bereitschaft, Jesus bis zum Tod zu begleiten, und wahrt den Parallelismus mit »ins Gefängnis«.
- source_word: πορεύεσθαι
  choice: zu gehen
  rationale: Als Ergänzung zu »bereit sein« bezeichnet das Verb hier das Mitgehen beziehungsweise den Weg in Haft und Tod; »gehen« ist präzise und natürlich.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« wahrt die übliche Titelbedeutung und ihre christologische Resonanz, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung »Er aber« erhält den leichten Kontrast des Griechischen; die parallele Formulierung »sowohl ... als auch« bildet Petrus’ nachdrückliche Zusicherung ab.
