  source_fidelity: Der Entwurf gibt den griechischen Satz vollständig und sachgerecht wieder. »Er aber« bildet ὁ δέ angemessen ab; »sagte zu ihm«, »Herr«, »ich bin bereit«, »mit dir«, »ins Gefängnis« und »in den Tod zu gehen« entsprechen dem Wortlaut und der syntaktischen Parallelität. Die doppelte καί-Verbindung wird mit »sowohl ... als auch« treffend wiedergegeben.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. Die Stellung »Er aber« ist leicht literarisch, in einer Bibelübersetzung jedoch natürlich und zur Wiedergabe von δέ passend. Die Verbindung »mit dir sowohl ins Gefängnis als auch in den Tod zu gehen« ist idiomatisch.
  terminology: »Herr« ist für Κύριε konsistent und bewahrt die direkte Anrede sowie die titelartige Bedeutung. »Gefängnis« und »Tod« sind klare, registergerechte Wiedergaben von φυλακή und θάνατος. Es sind keine Fußnoten erforderlich.
