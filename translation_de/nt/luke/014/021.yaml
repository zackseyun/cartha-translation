source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: de
  text: 'Als der Diener[a] zurückkam, berichtete er seinem Herrn alles. Da wurde der Hausherr zornig und sagte zu seinem Diener: »Geh schnell hinaus auf die breiten Straßen und in die Gassen der Stadt und bring die Armen, die Menschen mit Behinderungen[b], die Blinden und die Lahmen hierher!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklave“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Verstümmelten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: zurückkam
  rationale: Das Verb bezeichnet das Eintreffen; aus dem Erzählzusammenhang ergibt sich, dass der Diener nach Erledigung seines Auftrags zurückkommt. »Zurückkam« gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: δοῦλος
  choice: Diener
  rationale: Im Vordergrund steht hier die Aufgabe innerhalb des Haushalts. »Diener« ist im Deutschen verständlich und idiomatisch; die mögliche soziale Bedeutung »Sklave« wird in einer Fußnote offengehalten.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet hier die Mitteilung an einen Vorgesetzten und passt zum Ablauf der Erzählung.
- source_word: κυρίῳ
  choice: Herrn
  rationale: κύριος bezeichnet hier den menschlichen Herrn des Dieners, nicht unmittelbar Gott. »seinem Herrn« bewahrt das Verhältnis, ohne einen göttlichen Titel anzudeuten.
- source_word: ὀργισθεὶς
  choice: wurde ... zornig
  rationale: Die Form beschreibt die einsetzende Reaktion des Hausherrn. Die deutsche Wendung bewahrt diesen dynamischen Sinn.
- source_word: οἰκοδεσπότης
  choice: Hausherr
  rationale: Das Wort bezeichnet den Herrn beziehungsweise Leiter eines Hauses. »Hausherr« ist präzise und natürlich.
- source_word: πλατείας
  choice: breiten Straßen
  rationale: πλατεῖαι sind breite, offene Straßen oder Plätze. Die Wiedergabe erhält den Gegensatz zu den engeren Gassen.
- source_word: ῥύμας
  choice: Gassen
  rationale: Das Wort bezeichnet kleinere oder engere Straßen; »Gassen« bildet im Deutschen einen klaren Gegensatz zu den breiten Straßen.
- source_word: ἀναπείρους
  choice: Menschen mit Behinderungen
  rationale: Die respektvolle moderne Formulierung gibt die Bezeichnung körperlich beeinträchtigter Menschen wieder, ohne das heute abwertend wirkende »Verkrüppelte« zu verwenden. Die engere Möglichkeit »Verstümmelte« bleibt in der Fußnote sichtbar.
- source_word: χωλούς
  choice: Lahmen
  rationale: Die traditionelle, knappe Bezeichnung gibt Menschen wieder, deren Gehfähigkeit beeinträchtigt ist, und erhält die parallele Aufzählung.
theological_decisions:
- issue: Sozialer Status des δοῦλος
  choice: Diener
  alternative: Sklave
  rationale: Der Vers betont die Haushaltsfunktion und den Auftrag. Da δοῦλος jedoch auch einen versklavten Menschen bezeichnen kann, wird diese Bedeutung nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: κύριος mit menschlichem Bezug
  choice: Herr
  alternative: Gebieter
  rationale: Der Bezug gilt innerhalb des Gleichnisses dem menschlichen Vorgesetzten des Dieners. Daher wird kein besonderer göttlicher Titel signalisiert; »Herr« bleibt zugleich lexikalisch nah am griechischen Ausdruck.
- issue: Umfang von ἀνάπηρος
  choice: Menschen mit Behinderungen
  alternative: Verstümmelte
  rationale: Der griechische Ausdruck kann allgemein körperlich behinderte oder enger verstümmelte Menschen bezeichnen. Die Hauptübersetzung verwendet eine heutige respektvolle Bezeichnung, während die engere Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist dringlich und knapp. Personenbezeichnungen folgen der griechischen Aufzählung, wobei bei ἀνάπηρος eine heute respektvolle Formulierung gewählt wurde.
