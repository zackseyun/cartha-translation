  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: de
  text: 'Und zur Zeit des Abendessens schickte er seinen Diener, um den Eingeladenen zu sagen: »Kommt, denn jetzt ist alles bereit.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: Das Aoristverb wird im erzählenden Zusammenhang natürlich mit dem deutschen Präteritum wiedergegeben.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: seinen Diener
  rationale: Im parabolischen Haushalt ist die Funktion als Diener und Bote vorrangig. »Sklave« wäre lexikalisch möglich, würde im heutigen Deutsch jedoch den rechtlichen Status stärker hervorheben, als es der Zusammenhang verlangt.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: als die Zeit für das Abendessen gekommen war
  rationale: Die Formulierung gibt den festgesetzten Zeitpunkt der Mahlzeit idiomatisch und präzise wieder. »Abendessen« entspricht δείπνον, ohne das stärker deutende »Festmahl« einzuführen.
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: zu den Eingeladenen und ließ ihnen sagen
  rationale: Der Zweckinfinitiv nach »schickte« wird im Deutschen natürlich mit »ließ ihnen sagen« wiedergegeben; das Perfektpassivpartizip bezeichnet Menschen, die bereits eingeladen worden waren.
- source_word: Ἔρχεσθε
  choice: Kommt
  rationale: Der Imperativ ist eine unmittelbare Aufforderung und wird knapp und idiomatisch wiedergegeben.
- source_word: ὅτι ἤδη ἕτοιμά ἐστιν
  choice: denn jetzt ist alles bereit
  rationale: Das substantivisch gebrauchte neutrale Plural ἕτοιμα mit singularischem Verb hat kollektiven Sinn. »Alles ist bereit« macht das im Deutschen notwendige Subjekt idiomatisch sichtbar; ἤδη bezeichnet, dass der vorbereitete Zustand nun eingetreten ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und einladend; unnötig formelle Wendungen wie »zur Stunde des Mahles« werden vermieden.
