review_pass:
  verdict: revise
  source_fidelity: Die Zeitangabe, der Diener, die zuvor Eingeladenen und die abschließende Einladung sind zutreffend erfasst. Die Verbindung „schickte er seinen Diener zu den Eingeladenen und ließ ihnen sagen“ gibt den griechischen Zweckinfinitiv εἰπεῖν jedoch nicht präzise wieder und kann nahelegen, dass der Diener die Botschaft nicht selbst überbringen sollte. „Als ... gekommen war“ ist zudem eine unnötige Vorvergangenheit gegenüber der einfachen erzählenden Zeitangabe τῇ ὥρᾳ.
  naturalness: Der Entwurf ist insgesamt gut verständliches modernes Standarddeutsch. Die direkte Wiedergabe des Zwecks mit „um ... zu sagen“ ist ebenso natürlich und klarer.
  terminology: „Diener“ ist im parabolischen Haushaltskontext eine vertretbare Wiedergabe von δοῦλος. „Eingeladenen“ gibt das perfektische Passivpartizip angemessen wieder. „Alles ist bereit“ gibt den kollektiven Sinn von ἕτοιμα ἐστιν idiomatisch wieder, ohne eine unzulässige Einzelreferenz festzulegen.
  issues:
  - severity: medium
    issue: Der Zweckinfinitiv wird durch „ließ ihnen sagen“ ersetzt.
    rationale: 'εἰπεῖν bezeichnet den Zweck, zu dem der Diener gesandt wird: Er selbst soll den Eingeladenen die Aufforderung sagen. Die gewählte deutsche Konstruktion ist weniger direkt und kann eine andere ausführende Person implizieren.'
  - severity: low
    issue: „als die Zeit ... gekommen war“ verwendet eine unnötige Vorvergangenheit.
    rationale: τῇ ὥρᾳ τοῦ δείπνου ist schlicht „zur Zeit des Abendessens“ bzw. „als es Zeit zum Abendessen war“; die Plusquamperfektform fügt eine zeitliche Vorstufe hinzu, die der griechische Text nicht ausdrückt.
  revised_text: 'Und zur Zeit des Abendessens schickte er seinen Diener, um den Eingeladenen zu sagen: »Kommt, denn jetzt ist alles bereit.«'
  revised_footnotes: []
