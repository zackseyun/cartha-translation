  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: de
  text: Wenn aber nicht, schickt er, solange der andere noch weit entfernt ist, eine Gesandtschaft und bittet um Friedensbedingungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Dinge, die zum Frieden führen“; gemeint sind Bedingungen für einen Friedensschluss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Wenn nicht
  rationale: Die adversativ-konditionale Wendung führt die Alternative zum zuvor erwogenen erfolgreichen Kriegszug ein. Im Deutschen gibt „Wenn nicht“ die griechische Struktur knapp und natürlich wieder.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: solange der andere noch weit entfernt ist
  rationale: Der Genitivus absolutus bezeichnet einen gleichzeitig bestehenden Umstand. „Der andere“ macht deutlich, dass αὐτοῦ den gegnerischen König bezeichnet, ohne den Text unnötig auszudeuten.
- source_word: πρεσβείαν
  choice: eine Gesandtschaft
  rationale: πρεσβεία bezeichnet hier eine Abordnung beziehungsweise Gruppe von Gesandten. „Gesandtschaft“ ist im politischen und königlichen Kontext idiomatisch und würdevoll.
- source_word: ἀποστείλας
  choice: schickt er
  rationale: Das Aoristpartizip wird als finite, dem Hauptverb zugeordnete Handlung wiedergegeben; dies ergibt im Deutschen einen natürlichen Satz und bewahrt die Handlungsfolge.
- source_word: ἐρωτᾷ
  choice: bittet um
  rationale: ἐρωτάω bedeutet hier nicht bloß „fragen“, sondern „ersuchen“ oder „bitten“. Die Verbindung „um … bitten“ passt idiomatisch zum folgenden Gegenstand.
- source_word: τὰ πρὸς εἰρήνην
  choice: Friedensbedingungen
  rationale: Wörtlich bezeichnet die Wendung „die Dinge, die zum Frieden führen/gehören“. Im militärisch-politischen Zusammenhang sind damit Bedingungen gemeint, unter denen Frieden geschlossen werden kann.
