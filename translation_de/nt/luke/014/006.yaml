  text: And they were not able to reply to these things[a].
translation:
  language: de
  text: Und sie konnten darauf nichts erwidern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf diese Dinge“; auch: „darauf antworten“. Im Griechischen steht ein Ausdruck in der Mehrzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache koordinierende Konjunktion bewahrt den Anschluss an den vorangehenden Austausch, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: οὐκ ἴσχυσαν
  choice: sie konnten … nichts
  rationale: ἰσχύω bezeichnet hier idiomatisch die Fähigkeit; die deutsche Verbindung „konnten … nichts“ gibt die verneinte Möglichkeit natürlich und klar wieder.
- source_word: ἀνταποκριθῆναι
  choice: erwidern
  rationale: Das Verb bezeichnet eine Antwort als Reaktion auf das zuvor Gesagte. „Erwidern“ bewahrt diesen rückbezüglichen Sinn, ohne den unnötig konfrontativen Beiklang von „Widerworte geben“.
- source_word: πρὸς ταῦτα
  choice: darauf
  rationale: „Darauf“ ist die natürliche moderne deutsche Wiedergabe für „als Antwort darauf“; die im Griechischen formal vorhandene Mehrzahl wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
