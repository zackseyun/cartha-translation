source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: de
  text: 'Als er bemerkte, wie die Eingeladenen die Ehrenplätze[a] auswählten, erzählte er ihnen ein Gleichnis und sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die besten Plätze“ oder „die ersten Plätze“. Gemeint sind die angesehensten Plätze bei einem Festmahl.'
    reason: Die Anmerkung erläutert πρωτοκλισίας als bevorzugte Plätze in der antiken Tischordnung, ohne eine ungenaue Scheinlinearität zu behaupten.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: er erzählte
  rationale: Das Imperfekt schildert eine einsetzende bzw. im Verlauf befindliche Redehandlung. Im Deutschen führt das Präteritum die anschließende Rede natürlich ein.
- source_word: δὲ
  choice: unmarkiert
  rationale: δέ ist hier ein schwacher erzählerischer Übergang. Ein ausdrückliches „nun“, „aber“ oder „und“ wäre im modernen Deutschen unnötig und könnte zeitliche oder gegensätzliche Nuancen überbetonen.
- source_word: τοὺς κεκλημένους
  choice: den Eingeladenen
  rationale: Das substantivierte Perfektpartizip bezeichnet diejenigen, die eingeladen worden waren und sich nun in diesem Status befinden.
- source_word: παραβολήν
  choice: ein Gleichnis
  rationale: „Gleichnis“ ist die etablierte und sachlich passende Wiedergabe des lukanischen Begriffs παραβολή.
- source_word: ἐπέχων
  choice: weil er beobachtete
  rationale: Das Partizip bezeichnet seine aufmerksame Wahrnehmung der Situation. Die kausale Satzverknüpfung macht im Deutschen natürlich verständlich, wodurch das Gleichnis veranlasst wurde, ohne einen strengen Kausalwert zu behaupten.
- source_word: πῶς
  choice: wie
  rationale: „Wie“ gibt die Art und Weise ihres Verhaltens direkt wieder.
- source_word: τὰς πρωτοκλισίας
  choice: die Ehrenplätze
  rationale: Gemeint sind die ranghöchsten Liege- bzw. Sitzplätze bei einem Mahl. „Ehrenplätze“ vermittelt ihre gesellschaftliche Bedeutung verständlich.
- source_word: ἐξελέγοντο
  choice: sie sich … aussuchten
  rationale: Die Form ist Imperfekt Medium. „Sich aussuchten“ bewahrt sowohl den andauernden bzw. wiederholten Vorgang als auch den reflexiven Zug.
- source_word: λέγων πρὸς αὐτούς
  choice: Er sagte zu ihnen
  rationale: Die finite deutsche Form vermeidet eine schwerfällige Partizipialkonstruktion und leitet die folgende direkte Rede klar ein.
theological_decisions: []
