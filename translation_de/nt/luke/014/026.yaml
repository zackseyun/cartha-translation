  source_fidelity: 'Der Haupttext gibt die Satzstruktur und die wesentlichen Ausdrücke des griechischen Textes zuverlässig wieder: „zu mir kommt“ für ἔρχεται πρός με, die bewusst harte Formulierung „hasst“ für μισεῖ, die vollständige Familienaufzählung, „ja sogar“ für die steigernde Schlusswendung ἔτι τε καὶ sowie „kann ... nicht ... sein“ für οὐ δύναται εἶναι. „Sein eigenes Leben“ ist für ψυχὴν ἑαυτοῦ im Kontext gut begründet und die Alternative „Seele“ wird korrekt notiert.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und trotz der langen Aufzählung klar lesbar. Die Stellung von „kann er nicht mein Jünger sein“ ist idiomatisch. Die Wiederholung der Possessivartikel macht die Familienbeziehungen im Deutschen verständlich, ohne den Sinn zu verändern.
  terminology: „Jünger“ entspricht μαθητής in diesem Kontext; „Frau“ entspricht der kontextuell naheliegenden Bedeutung von γυνή. Die Fußnoten bewahren sowohl die mögliche vergleichende Kontextfunktion von μισεῖ als auch die Bedeutungsbreite von ψυχή, ohne die scharfe Formulierung des Haupttextes einseitig aufzulösen.
