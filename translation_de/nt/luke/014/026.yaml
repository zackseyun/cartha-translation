id: LUK.14.26
reference: Luke 14:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: de
  text: Wenn jemand zu mir kommt und nicht seinen eigenen Vater und seine Mutter, seine Frau und seine Kinder, seine Brüder und seine Schwestern hasst, ja sogar sein eigenes Leben, kann er nicht mein Jünger sein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht weniger liebt“. Wörtlich steht hier „hasst“. In diesem Zusammenhang fordert das Wort, dass die Treue zu Jesus selbst den engsten familiären Bindungen vorangeht; vergleiche Matthäus 10,37.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine eigene Seele“. Im Zusammenhang mit den Kosten der Jüngerschaft gibt „Leben“ hier wahrscheinlich den Sinn von ψυχή wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: hasst
  rationale: Die Grundbedeutung des Verbs ist „hassen“. Die bewusst anstößige Schärfe der Aussage bleibt im Haupttext erhalten; die in diesem Zusammenhang mögliche vergleichende Bedeutung wird in einer Fußnote erläutert.
- source_word: ἔρχεται πρός με
  choice: zu mir kommt
  rationale: Dies gibt die Bewegung und Beziehung mit πρός unmittelbar wieder, ohne die nicht ausdrücklich verwendete Wendung „mir nachfolgt“ einzutragen.
- source_word: πατέρα ἑαυτοῦ
  choice: seinen eigenen Vater
  rationale: „Eigenen“ bildet die persönliche Betonung des Reflexivpronomens ἑαυτοῦ ab.
- source_word: γυναῖκα
  choice: seine Frau
  rationale: In der Aufzählung engster Familienbeziehungen bezeichnet γυνή hier natürlich die Ehefrau.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: seine Brüder und seine Schwestern
  rationale: Beide im Griechischen ausdrücklich genannten Geschlechter werden wiedergegeben.
- source_word: ἔτι τε καὶ
  choice: ja sogar
  rationale: Die Wendung steigert die Aufzählung und hebt das eigene Leben als abschließenden, äußersten Anspruch hervor.
- source_word: ψυχὴν ἑαυτοῦ
  choice: sein eigenes Leben
  rationale: Im Zusammenhang mit den Kosten der Jüngerschaft bezeichnet ψυχή am ehesten das eigene Leben beziehungsweise Selbst, nicht ausschließlich eine vom Körper unterschiedene Seele.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kann er nicht mein Jünger sein
  rationale: Die Formulierung bewahrt die Aussage der Unmöglichkeit beziehungsweise Unvereinbarkeit in natürlichem Deutsch.
theological_decisions:
- issue: Ob Jesu Forderung durch eine vergleichende Wiedergabe von μισεῖ im Haupttext abgemildert werden soll
  choice: „hasst“ im Haupttext beibehalten und die mögliche Bedeutung „weniger liebt“ in einer Fußnote erklären
  alternative: Im Haupttext „weniger liebt“ schreiben
  rationale: Der griechische Wortlaut ist bewusst scharf. Eine unmittelbar vergleichende Wiedergabe würde die Aussage bereits auslegen und ihre Spannung mindern; die Fußnote macht den wahrscheinlichen Vorranganspruch Jesu transparent.
- issue: Bedeutung von ψυχή in diesem Vers
  choice: „Leben“
  alternative: „Seele“ oder „sich selbst“
  rationale: Der Kontext behandelt den äußersten Preis der Jüngerschaft und den Vorrang der Bindung an Jesus sogar vor dem eigenen Leben. „Leben“ vermittelt dies im heutigen Deutsch, ohne eine engere anthropologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harte Formulierung „hasst“ bleibt zur Wahrung der sprachlichen und theologischen Spannung stehen. Die Aufzählung ist rhythmisch und ohne unnötig altertümliche Wendungen gestaltet.
