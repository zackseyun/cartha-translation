base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: de
  text: Wenn dich jemand zu einem Hochzeitsfest[a] einlädt, nimm nicht den Ehrenplatz[b] ein, sonst könnte von ihm jemand eingeladen worden sein, der angesehener ist als du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer Hochzeit“. Der griechische Plural kann die Hochzeitsfeierlichkeiten bezeichnen, besonders das Festmahl.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der ranghöchste Platz bei Tisch. Bei festlichen Mahlzeiten lag man in der Antike gewöhnlich zu Tisch, statt aufrecht zu sitzen.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Wenn dich jemand … einlädt
  rationale: Die Wendung beschreibt allgemein den Fall einer Einladung; im Festkontext bedeutet καλέω natürlich „einladen“. Das indefinite τινος wird mit „jemand“ wiedergegeben.
- source_word: εἰς γάμους
  choice: zu einem Hochzeitsfest
  rationale: Der griechische Plural kann die Hochzeitsfeierlichkeiten und besonders das Festmahl bezeichnen. „Hochzeitsfest“ passt zum folgenden Hinweis auf die Tischordnung.
- source_word: μὴ κατακλιθῇς
  choice: nimm nicht … ein
  rationale: κατακλίνω bezeichnet hier das Sich-Niederlegen zum Mahl. Im Deutschen klingt „sich auf den Ehrenplatz legen“ missverständlich; „den Platz einnehmen“ vermittelt die gemeinte Handlung natürlich, während die antike Tischsitte in der Fußnote erklärt wird.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: den Ehrenplatz
  rationale: πρωτοκλισία ist der vornehmste, ranghöchste Platz beim Mahl. „Ehrenplatz“ ist präzise und idiomatisch.
- source_word: μήποτε … ᾖ κεκλημένος
  choice: denn es könnte jemand eingeladen sein
  rationale: μήποτε mit dem Konjunktiv führt den möglichen unerwünschten Fall ein. „Es könnte“ bewahrt diese Warnungs- und Möglichkeitsnuance; „eingeladen sein“ gibt den resultativen Zustand der perfektischen Umschreibung wieder.
- source_word: ἐντιμότερός σου
  choice: der angesehener ist als du
  rationale: Der Komparativ bezeichnet höheren Rang beziehungsweise größere gesellschaftliche Wertschätzung. „Angesehener“ ist im Deutschen natürlicher als „mehr geehrt“.
- source_word: ὑπ’ αὐτοῦ
  choice: eingeladen
  rationale: Der Handelnde ist derselbe Gastgeber wie im ersten Satzteil und im Deutschen aus dem Kontext eindeutig. Eine Wiederholung wie „von ihm“ wäre zwar formal möglich, aber stilistisch schwerfällig und wegen des Rückbezugs potenziell weniger klar.
