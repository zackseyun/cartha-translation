translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete antike Liegesitte wird nicht unnatürlich in den Haupttext gezwungen, sondern zusammen mit der Bedeutung des Ehrenplatzes in Fußnote b erläutert.
