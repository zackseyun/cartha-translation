id: LUK.14.15
reference: Luke 14:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: de
  text: 'Als einer von denen, die mit ihm zu Tisch lagen, das hörte, sagte er zu ihm: „Selig ist, wer im Reich Gottes Brot essen wird.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brot essen“ kann im Griechischen allgemein bedeuten, an einer Mahlzeit teilzunehmen; hier bleibt das wörtliche Bild erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: als … das hörte
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben; „das“ verweist im Deutschen idiomatisch auf die vorausgehenden Worte.
- source_word: δέ
  choice: nicht eigens wiedergegeben
  rationale: Die milde narrative Weiterführung ist durch den deutschen Satzanschluss ausreichend erkennbar; „aber“ würde hier einen stärkeren Gegensatz nahelegen, als der Kontext verlangt.
- source_word: τις τῶν συνανακειμένων
  choice: einer von denen, die mit ihm zu Tisch lagen
  rationale: Die Formulierung bewahrt sowohl die unbestimmte Einzelperson als auch die antike Tischhaltung und macht die gemeinsame Mahlzeit verständlich.
- source_word: εἶπεν αὐτῷ
  choice: sagte er zu ihm
  rationale: Direkte und ungekürzte Wiedergabe der griechischen Redeformel.
- source_word: Μακάριος
  choice: Glückselig
  rationale: Das Wort bezeichnet mehr als subjektives Glück und trägt hier den feierlichen, eschatologischen Klang eines Segensspruchs.
- source_word: ὅστις
  choice: wer
  rationale: Das deutsche indefinite Relativpronomen gibt den allgemeinen, offenen Bezug natürlich wieder.
- source_word: φάγεται
  choice: essen wird
  rationale: Das Futur bleibt erhalten und weist im Zusammenhang auf die künftige Teilhabe am Reich Gottes.
- source_word: ἄρτον
  choice: Brot
  rationale: Die konkrete Bildsprache wird bewahrt, obwohl „Brot essen“ im Griechischen auch allgemein die Teilnahme an einer Mahlzeit bezeichnen kann.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Formnahe und im Deutschen geläufige Wiedergabe, ohne ein ausdrücklich nicht genanntes Festmahl in den Haupttext einzutragen.
theological_decisions:
- issue: Bedeutung von Μακάριος im eschatologischen Mahlwort
  choice: Glückselig ist, wer …
  alternative: Glücklich ist, wer …
  rationale: „Glückselig“ bewahrt den Charakter eines Segensspruchs und die Vorstellung göttlicher Begünstigung, ohne die Aussage auf ein subjektives Glücksgefühl zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historische Tischhaltung wird sichtbar gehalten, während Satzbau und Redeformel natürlich deutsch bleiben.
