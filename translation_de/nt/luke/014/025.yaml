  text: Συνεπορεύοντο δὲ αὐτῷ ὄχλοι πολλοί, καὶ στραφεὶς εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: de
  text: 'Große Scharen von Menschen zogen mit ihm, und er wandte sich um und sagte zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: zogen mit
  rationale: Das Imperfekt bezeichnet eine andauernde Begleitung auf dem Weg. „zogen mit“ ist im Deutschen natürlich und bewahrt den Reisecharakter.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die Partikel markiert hier lediglich einen leichten Fortgang der Erzählung; ein ausdrückliches „nun“ oder „aber“ würde den Übergang im Deutschen unnötig hervorheben.
- source_word: αὐτῷ
  choice: mit ihm
  rationale: Der Dativ bezeichnet die Begleitung; das Pronomen bleibt wie im Griechischen erhalten.
- source_word: ὄχλοι πολλοί
  choice: viele Menschen
  rationale: Wörtlich steht „viele Volksmengen“. Die gewählte Formulierung gibt die große Zahl der Jesus begleitenden Menschen in natürlichem modernem Deutsch wieder, auch wenn die Mehrzahl einzelner Menschenansammlungen dabei weniger ausdrücklich erscheint.
- source_word: καὶ
  choice: und
  rationale: Der einfache Anschluss verbindet die Begleitung durch die Menschen mit Jesu anschließender Handlung.
- source_word: στραφεὶς
  choice: er wandte sich um
  rationale: Das Aoristpartizip bezeichnet die der Rede vorausgehende Wendung. Als finite Verbform klingt es im Deutschen natürlich und gibt die Abfolge klar wieder.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche und genaue deutsche Wiedergabe des erzählenden Aorists von λέγω.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet nach einem Redeverb die Angesprochenen; das Pronomen verweist eindeutig auf die zuvor genannten Menschen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Der Satzfluss ist bewusst idiomatisch deutsch; der Doppelanschluss mit „und“ bewahrt die schlichte parataktische Struktur des griechischen Textes.
