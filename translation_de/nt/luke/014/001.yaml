id: LUK.14.1
reference: Luke 14:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: de
  text: Als er an einem Sabbat in das Haus eines führenden Pharisäers ging, um eine Mahlzeit einzunehmen,[a] beobachteten sie ihn genau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Brot zu essen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „behielten sie ihn genau im Auge“; das griechische Wort kann argwöhnisches oder feindseliges Beobachten andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nicht eigens wiedergegeben
  rationale: Die lukanische Erzählformel eröffnet das Geschehen. Im modernen Deutschen wird ihre Funktion durch den einleitenden temporalen Satz natürlich aufgenommen; „es geschah“ wäre hier unnötig schwerfällig.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: Als er … ging
  rationale: Der artikulierte Infinitiv mit ἐν ist temporal. „Als er … ging“ gibt diese Beziehung idiomatisch und klar wieder.
- source_word: οἶκόν
  choice: Haus
  rationale: Direkte und im Zusammenhang natürliche Entsprechung für den Ort der bewirteten Mahlzeit.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: eines führenden Pharisäers
  rationale: Die partitiven Genitive bezeichnen einen aus dem Kreis der führenden Personen unter den Pharisäern. Die Formulierung ist natürlich und vermeidet das im Deutschen möglicherweise amtlich klingende „Obersten der Pharisäer“.
- source_word: σαββάτῳ
  choice: an einem Sabbat
  rationale: Der Dativ bezeichnet den Zeitpunkt. Da der griechische Ausdruck keinen Artikel hat und eine konkrete Sabbatbegebenheit einführt, bewahrt „an einem Sabbat“ diese Offenheit.
- source_word: φαγεῖν ἄρτον
  choice: um eine Mahlzeit einzunehmen
  rationale: Wörtlich steht „Brot zu essen“, doch die Wendung bezeichnet idiomatisch die Einnahme einer Mahlzeit. Die gewählte Form ist verständlich und dem gesellschaftlichen Rahmen angemessen; die wörtliche Ausdrucksweise wird in der Fußnote genannt.
- source_word: παρατηρούμενοι
  choice: beobachteten … genau
  rationale: Das Verb bezeichnet aufmerksames Beobachten und kann einen argwöhnischen oder feindseligen Unterton haben. „genau beobachten“ erhält die Spannung, ohne die Absicht ausdrücklich festzulegen.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das betonte Pronomen verweist im Zusammenhang auf die anwesenden Pharisäer beziehungsweise Gäste. Eine Wiedergabe als „sie selbst“ wäre im Deutschen unnötig markiert.
theological_decisions:
- issue: Mögliche feindselige Absicht beim Beobachten Jesu
  choice: beobachteten sie ihn genau
  alternative: sie belauerten ihn
  rationale: παρατηρέω kann argwöhnische oder feindselige Überwachung andeuten, nennt das Motiv hier aber nicht ausdrücklich. Die Hauptfassung bewahrt daher die erzählerische Spannung, ohne eine Schuldabsicht vorwegzunehmen.
- issue: Stellung des Gastgebers unter den Pharisäern
  choice: eines führenden Pharisäers
  alternative: eines Obersten der Pharisäer
  rationale: ἀρχόντων weist auf Leitungsrang oder gesellschaftlichen Einfluss hin, ohne dass der genaue Charakter eines Amtes festgelegt wird. „führend“ lässt diese institutionelle Unschärfe bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist gegenüber der langen griechischen Periode geglättet. „Eine Mahlzeit einnehmen“ wahrt den gesellschaftlichen Rahmen, während die Fußnote das konkrete Bild „Brot essen“ erhält. Sämtliche Fußnotenmarker stehen im Haupttext.
