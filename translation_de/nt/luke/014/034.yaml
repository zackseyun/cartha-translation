base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: de
  text: Gut ist also das Salz. Wenn aber selbst das Salz fade wird,[a] womit soll es gewürzt werden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb kann wörtlich „töricht werden“ bedeuten; in Bezug auf Salz meint es, dass das Salz fade oder geschmacklos wird. Auch möglich: „seinen Geschmack verliert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: Gut
  rationale: Die allgemeine positive Bewertung wird direkt und natürlich wiedergegeben, ohne sie auf Nützlichkeit oder Schönheit einzuengen.
- source_word: οὖν
  choice: also
  rationale: „Also“ bewahrt den folgernden Anschluss an die vorausgehende Lehre und klingt im modernen Deutschen natürlich.
- source_word: ἅλας
  choice: Salz
  rationale: Das konkrete, sprichwörtlich gebrauchte Bild wird unverändert beibehalten.
- source_word: ἐὰν δὲ καὶ
  choice: Wenn aber selbst
  rationale: '„Aber“ gibt den Gegensatz wieder, „selbst“ die hervorhebende Kraft von καί: Sogar Salz kann seine kennzeichnende Eigenschaft verlieren.'
- source_word: μωρανθῇ
  choice: fade wird
  rationale: Das Verb kann wörtlich „töricht werden“ bedeuten, bezeichnet bei Salz jedoch idiomatisch das Sch ذal- oder Geschmackloswerden. „Fade wird“ ist knapp, verständlich und erhält den inchoativen Sinn.
- source_word: ἐν τίνι
  choice: womit
  rationale: Die instrumentale Frage wird im Deutschen idiomatisch mit „womit“ ausgedrückt.
- source_word: ἀρτυθήσεται
  choice: soll es gewürzt werden
  rationale: „Würzen“ bewahrt das kulinarische Bild. Die Formulierung mit „soll“ gibt die rhetorische Zukunftsfrage im Deutschen natürlich wieder, ohne sie als bloße Wiederherstellung auszudeuten.
theological_decisions:
- issue: Bildhafte Bedeutung des Salzspruchs
  choice: Das Salzbild bleibt im Haupttext unausgelegt.
  alternative: Die Aussage ausdrücklich auf Jünger und den Verlust ihrer besonderen Wirkung beziehen.
  rationale: Der Vers formuliert ein Sprichwort, dessen Anwendung aus dem Zusammenhang hervorgeht. Eine erklärende Erweiterung würde die bildhafte und theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Anfangsstellung „Gut ist also das Salz“ spiegelt den Nachdruck des griechischen Καλὸν, bleibt aber gut verständlich. Das wörtliche Salzbild und die rhetorische Frage werden bewahrt.
