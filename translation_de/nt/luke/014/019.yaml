  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: de
  text: 'Und ein anderer sagte: »Ich habe fünf Ochsengespanne[a] gekauft und gehe sie prüfen. Ich bitte dich: Betrachte mich als entschuldigt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fünf Paar Ochsen«; wörtlich etwa: »fünf Joch Ochsen«. Gemeint sind fünf Gespanne mit jeweils zwei Ochsen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Halte mich für entschuldigt« oder »Lass mich als entschuldigt gelten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: ein anderer
  rationale: Bezeichnet in der Reihe der Eingeladenen eine weitere Person und ist im Deutschen knapp und natürlich.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: fünf Ochsengespanne
  rationale: ζεῦγος bezeichnet hier jeweils ein zusammengehöriges Arbeitspaar von Ochsen. „Ochsengespanne“ bewahrt das landwirtschaftliche Bild und klingt im modernen Deutschen natürlicher als „fünf Joch Ochsen“.
- source_word: ἠγόρασα
  choice: ich habe ... gekauft
  rationale: Das Perfekt gibt den abgeschlossenen Kauf mit seiner unmittelbaren Bedeutung für die gegenwärtige Entschuldigung im heutigen Standarddeutsch passend wieder.
- source_word: πορεύομαι
  choice: ich bin auf dem Weg
  rationale: Die Form kann gegenwärtige Bewegung oder unmittelbar bevorstehendes Aufbrechen ausdrücken. „Bin auf dem Weg“ lässt die Dringlichkeit erkennen, ohne den Satz unnötig zu erklären.
- source_word: δοκιμάσαι
  choice: zu prüfen
  rationale: δοκιμάζω meint hier, die neu gekauften Tiere praktisch zu testen beziehungsweise ihre Tauglichkeit festzustellen. „Prüfen“ ist würdig und allgemein verständlich.
- source_word: ἐρωτῶ σε
  choice: ich bitte dich
  rationale: Im Kontext einer höflichen Bitte ist „ich bitte dich“ idiomatischer als das wörtlichere „ich frage dich“, ohne die Bitte zu einer inständigen Beschwörung zu verstärken.
- source_word: ἔχε με παρῃτημένον
  choice: Betrachte mich als entschuldigt
  rationale: 'Die Verbindung von ἔχω mit dem perfekt-passiven Partizip beschreibt einen bestehenden Zustand: Der Gastgeber soll ihn als bereits entschuldigt gelten lassen. Diese Wiedergabe bewahrt die ungewöhnlich bestimmte Form der Bitte.'
theological_decisions: []
