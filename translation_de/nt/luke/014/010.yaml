reference: Luke 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: de
  text: 'Sondern wenn du eingeladen bist, geh hin und lass dich auf dem untersten Platz nieder[a], damit der, der dich eingeladen hat, wenn er kommt, zu dir sagt: »Freund, rücke weiter hinauf.« Dann wird dir vor allen, die mit dir zu Tisch liegen, Ehre zuteilwerden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet das Niederliegen zu Tisch; im dargestellten antiken Mahlkontext nahm man die Mahlzeit liegend ein.
    reason: Kulturelle und lexikalische Erläuterung zu ἀνάπεσε.
lexical_decisions:
- source_word: κληθῇς
  choice: eingeladen bist
  rationale: Im Zusammenhang eines Gastmahls bezeichnet καλέω eine Einladung, nicht lediglich einen Ruf.
- source_word: πορευθεὶς ἀνάπεσε
  choice: geh hin und lass dich … nieder
  rationale: Das vorangestellte Partizip begleitet den Imperativ und wird im Deutschen natürlich als koordinierte Aufforderung wiedergegeben. ἀνάκειμαι bezeichnet dabei das Niederliegen zu Tisch.
- source_word: εἰς τὸν ἔσχατον τόπον
  choice: auf dem untersten Platz
  rationale: ἔσχατος meint hier den sozial niedrigsten beziehungsweise am wenigsten angesehenen Platz, nicht nur den räumlich letzten.
- source_word: ὁ κεκληκώς σε
  choice: der dich eingeladen hat
  rationale: Die substantivierte Perfektpartizipialform bezeichnet transparent den Einladenden; das interpretierendere „Gastgeber“ wird vermieden.
- source_word: Φίλε
  choice: Freund
  rationale: Die direkte Anrede bewahrt den höflichen, persönlichen Ton, ohne ein im Griechischen nicht vorhandenes Possessivpronomen hinzuzufügen.
- source_word: προσανάβηθι ἀνώτερον
  choice: rück weiter nach oben
  rationale: Die Wendung beschreibt den Wechsel auf einen höher angesehenen Platz und erhält zugleich das räumliche Bild des Hinaufrückens.
- source_word: δόξα
  choice: Ehre
  rationale: Im gesellschaftlichen Zusammenhang bezeichnet δόξα öffentlich sichtbare Ehre beziehungsweise Ansehen, nicht vorrangig göttliche Herrlichkeit.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: vor allen, die mit dir zu Tisch liegen
  rationale: Die Formulierung bewahrt sowohl den öffentlichen Charakter als auch das konkrete antike Bild der gemeinsam zu Tisch Liegenden.
theological_decisions:
- issue: Charakter der Aufforderung
  choice: Die Aussage bleibt eine praktische Anweisung im Rahmen der Lehre über Demut und Ehre.
  alternative: Sie entweder auf bloße Tischsitte zu beschränken oder ausschließlich als endzeitliche Verheißung auszulegen.
  rationale: Das Gastmahlbild trägt eine weitergehende Aussage über Demut und die Umkehrung von Rang, doch der Vers selbst legt weder eine rein gesellschaftliche noch eine ausschließlich eschatologische Deutung fest.
- issue: Bedeutungsnuance von ἵνα mit Futur
  choice: „Wenn dann …, soll er … sagen“ gibt die beabsichtigte Folge der Wahl des untersten Platzes wieder.
  alternative: „damit … wird er … sagen“ oder eine rein sichere Vorhersage ohne Zwecknuance.
  rationale: ἵνα bewahrt eine Ziel- beziehungsweise Erwartungsnuance; das deutsche „soll“ ist hier nicht als Gebot an den Gastgeber gemeint, sondern als erwartetes Ergebnis der geschilderten Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „eingeladen“ folgt der griechischen Ausdrucksweise. „Mit dir zu Tisch liegen“ erhält bewusst das historische Mahlbild; die Fußnote erklärt es, ohne den Haupttext unnötig zu beschweren.
