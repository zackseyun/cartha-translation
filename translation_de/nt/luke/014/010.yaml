review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Einladung, untersten Rangplatz, öffentliches Ehrenmotiv und das Mahlbild insgesamt treffend wieder. Die Wiedergabe von ἀνάπεσε als „lass dich ... nieder“ ist im Haupttext verständlich und wird angemessen erläutert. Die Formulierung „soll er ... sagen“ ist jedoch im Deutschen missverständlich, weil sie wie eine Aufforderung an den Einladenden klingt; sie gibt die mit ἵνα ausgedrückte erwartete/beabsichtigte Folge nicht idiomatisch wieder.
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind überwiegend gelungen. „Damit der, der dich eingeladen hat, wenn er kommt, zu dir sagt“ ist klarer und natürlicher als „Wenn dann ... soll er ... sagen“. „Rücke weiter hinauf“ ist eine geläufige, knappe Wiedergabe der Bewegung zu einem höheren Ehrenplatz.
  terminology: „eingeladen“, „unterster Platz“, „Freund“, „Ehre“ und „mit dir zu Tisch liegen“ sind sachgerecht. Die Fußnote soll das historische Liegen zu Tisch knapp als Bedeutung des Verbs erklären, ohne eine zu pauschale Aussage über sämtliche Gastmähler zu machen.
  issues:
  - severity: medium
    issue: „soll er zu dir sagen“
    rationale: Diese Konstruktion kann als normatives „soll“ verstanden werden, also als Anweisung an den Gastgeber. Im griechischen Satz ist es die erwartete bzw. beabsichtigte Folge des Einnehmens des letzten Platzes. Eine „damit ... sagt“-Konstruktion bewahrt die ἵνα-Nuance ohne diese Fehlassoziation.
  - severity: low
    issue: Pauschalierung in der Fußnote
    rationale: „Bei einem Gastmahl lag man üblicherweise zu Tisch“ ist als allgemeine historische Aussage zu weit. Die Fußnote kann sich auf die lexikalische Bedeutung im dargestellten antiken Mahlkontext beschränken.
