source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: de
  text: 'Da wird der, der dich und ihn eingeladen hat, kommen und zu dir sagen: »Mach diesem Mann Platz!« Dann wirst du beschämt anfangen, den letzten Platz[a] einzunehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den niedrigsten Platz«. Der griechische Ausdruck kann den letzten Platz in einer Reihenfolge und damit bei diesem Festmahl den Platz mit dem niedrigsten Ehrenrang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας
  choice: Dann wird der, der dich und ihn eingeladen hat, kommen
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet den Einladenden. Das Aoristpartizip ἐλθών wird zusammen mit dem futurischen ἐρεῖ als zeitlich vorausgehende Handlung natürlich mit einer deutschen Futurform wiedergegeben.
- source_word: ἐρεῖ σοι
  choice: zu dir sagen
  rationale: Die Formulierung gibt den schlichten Redeeinleitungsausdruck eng und idiomatisch wieder.
- source_word: Δὸς τούτῳ τόπον
  choice: Mach diesem Mann Platz!
  rationale: Die deutsche Wendung ist natürlich und drückt im Zusammenhang aus, dass der Angesprochene seinen Platz zugunsten des anderen räumen soll, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: μετὰ αἰσχύνης
  choice: beschämt
  rationale: Das Adverb gibt die begleitende Scham beziehungsweise soziale Demütigung knapp und in modernem Deutsch wieder.
- source_word: ἄρξῃ … κατέχειν
  choice: wirst du … anfangen, … einzunehmen
  rationale: Die Konstruktion bewahrt das ausdrücklich formulierte Beginnen und gibt κατέχειν im Zusammenhang eines Sitzplatzes als »einnehmen« wieder.
- source_word: τὸν ἔσχατον τόπον
  choice: den letzten Platz
  rationale: »Letzten« wahrt die Grundbedeutung von ἔσχατος; im Festmahlkontext bezeichnet dies zugleich den niedrigsten Rangplatz.
theological_decisions: []
