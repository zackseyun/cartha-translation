id: LUK.14.24
reference: Luke 14:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: de
  text: 'Denn ich sage euch: Keiner von jenen Männern, die eingeladen waren, wird von meinem Festmahl[a] kosten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abendessen“; traditionell: „Abendmahl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Die Wendung bewahrt γάρ als begründenden Anschluss und gibt die direkte Anrede ὑμῖν natürlich und würdig wieder.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: Keiner von jenen Männern
  rationale: „Keiner von“ bildet die partitive Konstruktion genau ab; „Männern“ wahrt die konkrete maskuline Bezeichnung ἀνδρῶν, und „jenen“ entspricht dem rückverweisenden ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: die eingeladen waren
  rationale: Im Kontext des Gastmahls bedeutet καλέω, jemanden einzuladen. Die Formulierung gibt den resultativen Sinn des Perfektpartizips verständlich wieder, ohne das missverständliche „berufen“ einzutragen.
- source_word: γεύσεταί
  choice: wird … kosten
  rationale: „Kosten“ bewahrt das Bild des Schmeckens und zugleich die kontextuelle Bedeutung, an der Mahlzeit teilzunehmen.
- source_word: μου τοῦ δείπνου
  choice: von meinem Festmahl
  rationale: δεῖπνον bezeichnet hier aufgrund des Gleichniskontexts nicht bloß eine alltägliche Mahlzeit, sondern das ausgerichtete große Essen. „Festmahl“ ist im modernen Deutsch natürlich; „Abendessen“ und das traditionelle „Abendmahl“ bleiben mögliche lexikalische Wiedergaben, wobei Letzteres im Deutschen leicht sakramental verstanden wird.
theological_decisions:
- issue: Aussage des Gastgebers und mögliche allegorische Deutung
  choice: Die erste Person „mein Festmahl“ bleibt als Rede des Gastgebers stehen, ohne die Aussage ausdrücklich zu allegorisieren.
  alternative: Die Mahlzeit ausdrücklich als Gottes Reich oder endzeitliches Heilsmahl bezeichnen.
  rationale: Der griechische Text belässt die Aussage innerhalb der Gleichniserzählung. Eine theologische Identifikation im Haupttext würde die Deutung stärker festlegen als die Formulierung selbst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Festmahl“ passt zum unmittelbaren Kontext des großen Gastmahls; die Fußnote dokumentiert wörtlichere beziehungsweise traditionelle Alternativen und vermeidet zugleich eine unmarkierte sakramentale Festlegung.
