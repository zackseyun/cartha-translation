    rationale: „Ebenso“ kann οὕτως zu stark als bloßen Vergleich ausdrücken. „So kann also“ bewahrt den Schlusscharakter von οὖν und den Rückbezug von οὕτως, während die umgestellte Relativkonstruktion natürlicher klingt.
  - severity: low
    issue: Unidiomatische Formulierung in Fußnote a
    rationale: Im Deutschen heißt es „Anspruch auf den eigenen Besitz“, nicht „Anspruch am eigenen Besitz“.
