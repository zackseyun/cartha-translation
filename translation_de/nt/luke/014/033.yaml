  source_fidelity: Die Satzstruktur und die Aussage der Unmöglichkeit sind zutreffend wiedergegeben. Die negative deutsche Konstruktion ist grundsätzlich äquivalent zu πᾶς ἐξ ὑμῶν ὃς οὐκ … οὐ δύναται, doch eine Umstellung macht den Bezug und die individuelle Zuspitzung idiomatischer deutlich. οὕτως οὖν ist mit „So kann also“ angemessener als „Ebenso kann also“ wiedergegeben.
  naturalness: „So kann also niemand von euch mein Jünger sein, der nicht …“ ist im modernen Standarddeutsch flüssiger als die vorangestellte Relativkonstruktion. Die Fußnotenformulierung „Anspruch am eigenen Besitz“ ist nicht idiomatisch; „Anspruch auf den eigenen Besitz“ ist korrekt.
  terminology: „Besitz“, „verzichten“ und „Jünger“ sind passende, registergerechte Entsprechungen. „Verzichten“ wahrt gegenüber einer zwingenden Aussage über äußerliche Veräußerung die im Verb angelegte semantische Offenheit. Die generische maskuline Einzahl kann mit der vorhandenen Anmerkung erläutert werden.
