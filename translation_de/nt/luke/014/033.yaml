  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: de
  text: So kann also niemand von euch mein Jünger sein, der nicht auf seinen ganzen Besitz verzichtet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich von allem lossagt, was er besitzt“. Das griechische Verb kann wörtlich „Abschied nehmen“ bedeuten und bezeichnet hier den Verzicht auf den Anspruch auf den eigenen Besitz.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen eine männliche Einzahl; sie ist allgemein gemeint und gilt für jeden Menschen, der Jesu Jünger sein will.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Ebenso … also
  rationale: Bewahrt sowohl den Rückbezug von οὕτως auf die vorausgehenden Beispiele als auch die folgernde Kraft von οὖν in natürlichem Deutsch.
- source_word: πᾶς ἐξ ὑμῶν
  choice: niemand von euch, der nicht …
  rationale: Die durch πᾶς ausgedrückte ausnahmslose Geltung wird im Deutschen idiomatisch durch die negative Konstruktion „niemand von euch, der nicht“ wiedergegeben.
- source_word: ἀποτάσσεται
  choice: verzichtet
  rationale: Das Verb kann „Abschied nehmen“ bedeuten und bezeichnet hier eine entschiedene Lossagung vom eigenen Besitzanspruch. „Verzichten“ wahrt die Schärfe, ohne eine bestimmte Form äußerer Veräußerung festzuschreiben.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: auf seinen ganzen Besitz
  rationale: ὑπάρχουσιν bezeichnet in dieser substantivischen Wendung das, was jemand besitzt; „ganzer Besitz“ ist präzise und in modernem Deutsch natürlich.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kann … nicht mein Jünger sein
  rationale: Gibt die Aussage von Unmöglichkeit bzw. Unfähigkeit direkt und idiomatisch wieder.
- source_word: μαθητής
  choice: Jünger
  rationale: Der im Evangelienkontext etablierte Ausdruck umfasst Lernen, Bindung und Nachfolge.
theological_decisions:
- issue: Art der Forderung im Blick auf den Besitz
  choice: „auf seinen ganzen Besitz verzichtet“
  alternative: „seinen ganzen Besitz aufgibt“ oder „sich von seinem ganzen Besitz trennt“
  rationale: Die Formulierung bringt die radikale Preisgabe des Anspruchs auf den gesamten Besitz zum Ausdruck, legt aber nicht über den griechischen Wortlaut hinaus fest, dass in jedem Fall eine vollständige äußere Veräußerung gemeint sein muss. Die Spannung der Aussage bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und knapp; „Jünger“ bewahrt den vertrauten biblischen Begriff. Die generische männliche Einzahl wird im Haupttext erhalten und in einer Fußnote erläutert.
