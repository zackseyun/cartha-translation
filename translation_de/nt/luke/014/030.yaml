  language: de
  text: 'und sagen: »Dieser Mann fing an zu bauen und konnte es nicht vollenden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'und sagen:'
  rationale: Das Präsenspartizip setzt die Handlung des vorigen Verses fort und bezeichnet, was die Spottenden sagen. Im Deutschen verbindet »und sagen« den Satz natürlich mit dem vorausgehenden Kontext; der Doppelpunkt gibt ὅτι idiomatisch als Einleitung direkter Rede wieder.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Dieser Mann
  rationale: Die Formulierung bewahrt sowohl das Demonstrativpronomen als auch das maskuline Substantiv und passt zum öffentlich-spöttischen Ton, ohne ihn zu verstärken.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: fing an zu bauen
  rationale: Die Verbindung von ἄρχομαι mit Infinitiv bezeichnet den Beginn einer Handlung. »Fing an zu bauen« ist im modernen Deutschen natürlich und bedeutungsnah.
- source_word: οὐκ ἴσχυσεν
  choice: konnte … nicht
  rationale: ἰσχύω bezeichnet hier im Zusammenhang die fehlende Fähigkeit oder ausreichende Kraft, das Bauvorhaben zu Ende zu bringen. »Konnte nicht« bewahrt diesen Sinn idiomatisch, ohne ihn auf körperliche Stärke einzuengen.
- source_word: ἐκτελέσαι
  choice: es … vollenden
  rationale: ἐκτελέω bedeutet, etwas bis zum Abschluss auszuführen. »Vollenden« gibt diesen Abschlussgedanken würdig und präzise wieder; »es« nimmt im Deutschen natürlich das begonnene Bauvorhaben auf.
