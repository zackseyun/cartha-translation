source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: de
  text: Doch wenn du ein Festmahl[a] gibst, lade Arme, Menschen mit körperlichen Behinderungen[b], Gehbehinderte und Blinde ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Fest“ beziehungsweise „einen Empfang“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Menschen mit körperlichen Beeinträchtigungen und kann auch Menschen mit verstümmelten oder geschädigten Gliedmaßen meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Die adversative Konjunktion stellt die Anweisung der vorangehenden Aufforderung gegenüber. „Doch“ gibt diesen Kontrast im Deutschen knapp und natürlich wieder.
- source_word: ὅταν
  choice: wenn
  rationale: ὅταν mit Konjunktiv bezeichnet hier einen unbestimmten, grundsätzlich wiederholbaren Anlass. Das generische deutsche „wenn“ trägt diesen Sinn im Zusammenhang natürlich; „wann immer“ wäre nachdrücklicher, aber stilistisch schwerer.
- source_word: δοχὴν ποιῇς
  choice: du ein Festmahl gibst
  rationale: Die Wendung bedeutet, einen Empfang beziehungsweise ein festliches Mahl auszurichten. „Ein Festmahl geben“ ist verständlich und bewahrt den gastgeberischen Charakter.
- source_word: κάλει
  choice: lade … ein
  rationale: καλέω bedeutet im Zusammenhang eines Mahls, Gäste einzuladen. Die deutsche trennbare Verbform umfasst die ganze Aufzählung.
- source_word: πτωχούς
  choice: Arme
  rationale: Das substantivierte Adjektiv bezeichnet arme Menschen. „Arme“ ist knapp, geläufig und erhält die Listenform.
- source_word: ἀναπείρους
  choice: Menschen mit körperlichen Behinderungen
  rationale: Der Ausdruck bezeichnet Menschen mit körperlichen Beeinträchtigungen und kann auch Verstümmelte oder Menschen mit geschädigten Gliedmaßen einschließen. Die personenbezogene Formulierung ist modern und vermeidet das heute abwertend wirkende „Verkrüppelte“.
- source_word: χωλούς
  choice: Gehbehinderte
  rationale: χωλός bezeichnet Menschen, deren Gehen beeinträchtigt ist. „Gehbehinderte“ unterscheidet diese Gruppe von der allgemeineren vorhergehenden Bezeichnung, ohne das veraltete „Lahme“ zu verwenden.
- source_word: τυφλούς
  choice: Blinde
  rationale: Das substantivierte Adjektiv bezeichnet blinde Menschen. „Blinde“ ist im Deutschen eine klare und übliche Gruppenbezeichnung.
theological_decisions:
- issue: Wiedergabe der körperbezogenen Gruppenbezeichnungen
  choice: Die griechische Viererliste bleibt vollständig erhalten; ἀναπείρους wird allgemein als „Menschen mit körperlichen Behinderungen“ und χωλούς spezifischer als „Gehbehinderte“ wiedergegeben.
  alternative: Traditionellere Wiedergabe als „Arme, Verkrüppelte, Lahme und Blinde“ oder durchgehend personenbezogene Umschreibung aller vier Gruppen.
  rationale: Die Anweisung richtet die Gastfreundschaft auf gesellschaftlich benachteiligte Menschen. Die gewählte Fassung wahrt sowohl die Unterscheidung der griechischen Begriffe als auch eine heutige, respektvolle Sprache, ohne die Kategorien theologisch umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählung des griechischen Textes bleibt weitgehend erhalten; bei ἀναπείρους dient eine personenbezogene Formulierung der Klarheit und vermeidet eine heute abwertende Bezeichnung.
