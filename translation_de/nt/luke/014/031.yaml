id: LUK.14.31
reference: Luke 14:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: de
  text: Oder welcher König, der auszieht, um gegen einen anderen König Krieg zu führen, setzt sich nicht zuerst hin und überlegt, ob er mit zehntausend Mann dem entgegentreten kann, der mit zwanzigtausend gegen ihn anrückt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Oder
  rationale: Leitet das zweite Vergleichsbeispiel ein und bewahrt den rhetorischen Anschluss.
- source_word: τίς βασιλεὺς
  choice: welcher König
  rationale: Gibt die allgemeine rhetorische Frage im Deutschen natürlich wieder.
- source_word: πορευόμενος
  choice: der auszieht
  rationale: Bezeichnet zielgerichtetes Aufbrechen; im militärischen Zusammenhang ist »auszieht« präzise und idiomatisch.
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: um gegen einen anderen König Krieg zu führen
  rationale: Gibt das Zusammentreffen zum bewaffneten Konflikt klar und natürlich wieder, ohne einen einzelnen Schlachtverlauf hinzuzufügen.
- source_word: καθίσας πρῶτον βουλεύσεται
  choice: setzt sich nicht zuerst hin und überlegt
  rationale: Bewahrt sowohl das konkrete Sichsetzen als auch die anschließende wohlüberlegte Prüfung.
- source_word: εἰ δυνατός ἐστιν
  choice: ob er ... kann
  rationale: Drückt die zu prüfende Fähigkeit in modernem, natürlichem Deutsch aus.
- source_word: ἐν δέκα χιλιάσιν
  choice: mit zehntausend Mann
  rationale: Das Zahlwort bezeichnet im militärischen Kontext eine Truppenstärke; »Mann« macht dies für heutige Leser eindeutig.
- source_word: ὑπαντῆσαι
  choice: entgegentreten
  rationale: Bewahrt die Grundvorstellung des entgegengehenden Begegnens und zugleich die feindliche Bedeutung im Kontext.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: dem ..., der mit zwanzigtausend gegen ihn anrückt
  rationale: »anrückt« bildet die Bewegung einer feindlichen Streitmacht prägnant ab; »gegen ihn« wahrt die feindliche Richtung von ἐπ’ αὐτόν.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; militärische Ausdrücke sind klar, aber nicht unnötig technisch. Keine Fußnote erforderlich, da »entgegentreten« sowohl die Begegnung als auch den Widerstand im Kontext angemessen wiedergibt.
