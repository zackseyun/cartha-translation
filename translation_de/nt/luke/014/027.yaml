  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Satzelemente des griechischen Textes angemessen wieder: die allgemeine Bedingung (ὅστις), das Tragen des eigenen Kreuzes (βαστάζει τὸν σταυρὸν ἑαυτοῦ), das Hinter-Jesus-Herkommen (ἔρχεται ὀπίσω μου) sowie die als Unfähigkeit formulierte Folgerung (οὐ δύναται εἶναί μου μαθητής). Die mit καί verbundene Doppelbedingung bleibt erhalten.'
  naturalness: „Wer nicht sein eigenes Kreuz trägt und hinter mir herkommt, kann nicht mein Jünger sein“ ist flüssiges modernes Standarddeutsch und bewahrt einen angemessen würdigen biblischen Registerton. „Hinter mir herkommt“ ist idiomatisch und erhält zugleich das räumliche Bild des Ausgangstextes.
  terminology: „Kreuz“ und „Jünger“ sind die im deutschen Evangelienwortschatz etablierten und sachlich passenden Begriffe. „Sein eigenes“ wahrt die reflexive Hervorhebung, ohne die generische Wer-Konstruktion auf Männer zu beschränken. Die Fußnoten bieten vertretbare lexikalische beziehungsweise idiomatische Alternativen, und ihre Anker stehen an den jeweiligen Bezugsausdrücken.
