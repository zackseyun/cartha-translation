id: LUK.14.27
reference: Luke 14:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: de
  text: Wer nicht sein eigenes Kreuz trägt[a] und hinter mir herkommt[b], kann nicht mein Jünger sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf sich nimmt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mir nachfolgt“; wörtlich: „hinter mir kommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Wer
  rationale: Das indefinite Relativpronomen leitet eine allgemein geltende Bedingung ein. „Wer“ gibt diese universale, personenbezogene Aussage im Deutschen knapp und natürlich wieder.
- source_word: βαστάζει
  choice: trägt
  rationale: Das Verb bedeutet „tragen“ oder „auf sich nehmen“. „Trägt“ bewahrt das konkrete Bild des Kreuztragens und zugleich dessen übertragene Bedeutung für die Kosten der Nachfolge.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: sein eigenes Kreuz
  rationale: „Kreuz“ ist die etablierte Entsprechung für σταυρός und bewahrt den Bezug zum Hinrichtungsinstrument sowie zu Schande und Leid. „Sein eigenes“ erhält die reflexive Betonung des griechischen Singulars.
- source_word: ἔρχεται ὀπίσω μου
  choice: hinter mir herkommt
  rationale: Die Formulierung bildet das räumliche Bild „hinter mir kommen“ ab und lässt zugleich den geläufigen Sinn der Nachfolge erkennen, ohne ihn nur als Auslegung wiederzugeben.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: kann nicht mein Jünger sein
  rationale: Die Konstruktion bezeichnet Unfähigkeit beziehungsweise Unvereinbarkeit, nicht lediglich ein Verbot. Die deutsche Formulierung ist idiomatisch und erhält diese Aussagekraft.
- source_word: μαθητής
  choice: Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte Bezeichnung für einen Menschen, der sich einem Lehrer verbindlich anschließt; „Lernender“ wäre hier zu schwach und unnatürlich.
theological_decisions:
- issue: Generische Aussage bei maskulinem Singular und reflexivem Pronomen
  choice: „Wer … sein eigenes Kreuz“ im generischen Singular
  alternative: „Alle, die … ihr eigenes Kreuz“
  rationale: Der griechische Text steht im Singular und verwendet ein grammatisch maskulines Reflexivpronomen mit allgemeiner Reichweite. Die deutsche Wer-Konstruktion bewahrt Singular und Reflexivität, ohne die Aussage auf Männer zu beschränken.
- issue: Verhältnis von Kreuztragen und Nachfolge
  choice: Beide durch „und“ verbundenen Bedingungen unverändert stehen lassen
  alternative: Die zweite Bedingung erklärend als bloße Umschreibung der ersten wiedergeben
  rationale: Der griechische Satz nennt Kreuztragen und Hinter-Jesus-Herkommen ausdrücklich nebeneinander. Die Übersetzung wahrt diese Spannung und verschmilzt die Aussagen nicht miteinander.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. „Hinter mir herkommt“ bewahrt das Bewegungsbild und ist zugleich allgemein verständlich; „Jünger“ erhält den etablierten Evangelienwortschatz.
