  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπός τις ⸀ἐποίει δεῖπνον μέγα, καὶ ἐκάλεσεν πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: de
  text: 'Doch er sagte zu ihm: „Ein Mann bereitete ein großes Festmahl[a] vor und lud viele dazu ein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein großes Mahl“ beziehungsweise „ein großes Abendessen“. Das griechische Wort δεῖπνον bezeichnet die Hauptmahlzeit; hier geht es um ein förmliches Mahl mit eingeladenen Gästen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Doch er sagte zu ihm
  rationale: δέ markiert hier einen milden Übergang beziehungsweise eine Erwiderung. „Doch“ macht den Anschluss an die Aussage des vorherigen Sprechers deutlich, ohne einen starken Gegensatz zu behaupten.
- source_word: Ἄνθρωπός τις
  choice: Ein Mann
  rationale: Die Verbindung von ἄνθρωπος mit dem indefiniten τις führt eine nicht näher bestimmte männliche Person ein. Im natürlichen modernen Deutsch gibt „Ein Mann“ diese parabeltypische Wendung angemessen wieder; „ein gewisser Mann“ klänge unnötig steif.
- source_word: ἐποίει
  choice: bereitete … vor
  rationale: Das Imperfekt beschreibt die im Gang befindliche Vorbereitung. Im Zusammenhang mit einem Gastmahl ist „bereitete … vor“ idiomatischer als das wörtliche „machte“ und legt noch nicht nahe, dass das Mahl bereits begonnen hatte.
- source_word: δεῖπνον μέγα
  choice: ein großes Festmahl
  rationale: δεῖπνον bezeichnet die Hauptmahlzeit, häufig am Abend; μέγα kennzeichnet sie als groß beziehungsweise bedeutend. „Festmahl“ entspricht dem formellen Einladungskontext, während „großes“ μέγα ausdrücklich wiedergibt.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: und lud viele dazu ein
  rationale: καλέω bedeutet im Kontext einer bewirteten Mahlzeit „einladen“. „Dazu“ stellt im Deutschen den natürlichen Bezug zum Festmahl her; „viele“ bewahrt die knappe substantivische Form von πολλούς.
