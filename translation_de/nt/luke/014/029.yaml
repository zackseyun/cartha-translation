  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: de
  text: Sonst könnte es geschehen, dass alle, die es sehen, anfangen, ihn zu verspotten, nachdem er das Fundament gelegt hat und nicht in der Lage ist, das Vorhaben zu vollenden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: Sonst könnte es geschehen, dass
  rationale: Die Wendung führt im Zusammenhang die unerwünschte mögliche Folge ein. Diese deutsche Formulierung gibt sowohl den warnenden als auch den möglichen Charakter natürlich wieder.
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: er das Fundament legt
  rationale: Der Genitivus absolutus bezeichnet eine Handlung, die dem Nichtvollenden sachlich vorausgeht. Im Deutschen lässt sich die Abfolge innerhalb des dass-Satzes klar und flüssig ausdrücken; der bestimmte Artikel ist beim Fundament eines konkreten Bauvorhabens idiomatisch.
- source_word: μὴ ἰσχύοντος
  choice: aber nicht stark genug ist
  rationale: ἰσχύω kann Fähigkeit oder ausreichende Kraft bezeichnen. Die Wiedergabe bewahrt das Kraftmotiv des griechischen Ausdrucks, ohne ihn auf rein körperliche Stärke festzulegen.
- source_word: ἐκτελέσαι
  choice: den Bau zu vollenden
  rationale: Das Verb bezeichnet das vollständige Zu-Ende-Führen. „Den Bau“ macht im Deutschen den aus dem Kontext erschließbaren Gegenstand verständlich und verhindert, dass „das Fundament vollenden“ gemeint zu sein scheint.
- source_word: πάντες οἱ θεωροῦντες
  choice: alle, die es sehen
  rationale: θεωρέω bezeichnet hier das Wahrnehmen oder Beobachten der sichtbaren, unvollendeten Baumaßnahme. „Es“ nimmt die gesamte Situation auf.
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: würden … anfangen, ihn zu verspotten
  rationale: Der Subjunktiv gehört zur Konstruktion der befürchteten möglichen Folge. „Verspotten“ ist würdig und gibt die abwertende Bedeutung von ἐμπαίζω klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Möglichkeit der unerwünschten Folge wird bewahrt; die etwas ungewöhnliche Wiederholung von ἰσχύω aus Vers 28 bleibt durch „stark genug“ erkennbar.
