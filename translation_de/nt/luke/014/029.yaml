  - severity: low
    issue: „nicht stark genug“ ist semantisch zu eng
    rationale: ἰσχύω bezeichnet hier das Vermögen bzw. die Fähigkeit, ein Vorhaben zu Ende zu bringen, nicht vorrangig körperliche Kraft. „Nicht in der Lage“ ist idiomatischer und weiter.
  revised_text: Sonst könnte es geschehen, dass alle, die es sehen, anfangen, ihn zu verspotten, nachdem er das Fundament gelegt hat und nicht in der Lage ist, das Vorhaben zu vollenden.
