review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung ist getroffen. Der Genitivus absolutus bezeichnet jedoch eine bereits erfolgte Grundlegung; „er das Fundament legt“ verwischt diese Vorzeitigkeit. „Nicht stark genug“ kann im Deutschen unnötig körperliche Stärke nahelegen, während ἰσχύω hier allgemein die Fähigkeit bzw. die Mittel zum Vollenden meint.
  naturalness: Der Entwurf ist verständlich, aber die Abfolge mit „Sonst könnte es geschehen ... Dann würden“ ist schwerfälliger als nötig. Eine direkte Konstruktion mit „nachdem“ bildet den griechischen Zusammenhang natürlich und klar ab.
  terminology: „Fundament“ und „verspotten“ sind angemessen. „Bau“ ist als kontextbedingt erschlossener Gegenstand vertretbar, sollte aber nicht als ausdrückliches griechisches Objekt erscheinen; „das Vorhaben zu vollenden“ hält den impliziten Bezug allgemeiner.
