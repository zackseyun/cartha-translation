id: LUK.14.14
reference: Luke 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: de
  text: Und du wirst glücklich sein, weil sie es dir nicht vergelten können; denn es wird dir bei der Auferstehung der Gerechten vergolten werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: glücklich zu preisen
  rationale: Die in Seligpreisungen geprägte Wendung bewahrt den objektiven Zuspruch und das eschatologische Gewicht besser als das vorwiegend gefühlsbezogene „glücklich“ allein; „gesegnet“ wäre möglich, könnte hier aber stärker eine ausdrücklich vollzogene Segenshandlung nahelegen.
- source_word: ἔσῃ
  choice: du wirst … sein
  rationale: Die Zukunftsform von εἰμί wird direkt wiedergegeben und mit dem prädikativen μακάριος verbunden.
- source_word: ὅτι
  choice: weil
  rationale: Die Konjunktion nennt hier den Grund dafür, dass der Angesprochene glücklich zu preisen sein wird.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: sie es dir nicht vergelten können
  rationale: Die Konstruktion bedeutet wörtlich, dass sie nicht haben beziehungsweise nicht in der Lage sind, Gegenleistung zu erbringen. „Nicht vergelten können“ gibt diese Unfähigkeit natürlich wieder, ohne fälschlich fehlende Verpflichtung auszudrücken.
- source_word: ἀνταποδοθήσεται … σοι
  choice: es wird dir … vergolten werden
  rationale: Das Passiv und die lexikalische Entsprechung zum vorherigen ἀνταποδοῦναί bleiben sichtbar. Das unpersönliche „es“ bezieht sich natürlich auf die zuvor beschriebene Wohltat beziehungsweise deren Gegenwert.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ wahrt die begründend-erklärende Funktion und den Zusammenhang mit dem vorangehenden Satzteil.
- source_word: ἐν τῇ ἀναστάσει
  choice: bei der Auferstehung
  rationale: „Bei“ gibt den temporalen Gebrauch von ἐν im heutigen Deutsch natürlich wieder, ohne die Aussage näher zu bestimmen.
- source_word: τῶν δικαίων
  choice: der Gerechten
  rationale: Der substantivierte Ausdruck ist im Deutschen knapp, verständlich und bewahrt den moralisch-theologischen Gehalt von δίκαιος.
theological_decisions:
- issue: Bedeutung der „Auferstehung der Gerechten“
  choice: Die Formulierung wird unverändert als „bei der Auferstehung der Gerechten“ wiedergegeben.
  alternative: Allgemeine Auferstehung mit besonderem Blick auf die Gerechten oder eine von anderen unterschiedene Auferstehung der Gerechten.
  rationale: Der Vers verbindet die künftige göttliche Vergeltung mit der Auferstehung der Gerechten, legt aber keine detaillierte zeitliche oder eschatologische Ordnung fest. Die Übersetzung lässt diese Frage bewusst offen.
- issue: Träger der künftigen Vergeltung
  choice: Das theologische Passiv „es wird dir … vergolten werden“ bleibt ohne ausdrücklich genanntes Subjekt stehen.
  alternative: „Gott wird es dir vergelten.“
  rationale: Gott ist im Zusammenhang als Handelnder naheliegend, wird im griechischen Text jedoch nicht ausdrücklich genannt. Das Passiv vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität von „vergelten“ und „vergolten werden“ spiegelt die griechische Wortwiederholung. Keine Fußnoten nötig, da die wesentlichen Nuancen im Haupttext natürlich erhalten bleiben.
