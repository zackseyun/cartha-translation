  source_fidelity: 'Der Entwurf trifft δοῦλος („Diener“), die Anrede Κύριε („Herr“), ἔτι („noch“) und τόπος im Mahlkontext („Platz“) zutreffend. „Was du befohlen hast, ist geschehen“ ist jedoch im Deutschen missverständlich: Es kann besagen, dass der Befehl selbst stattgefunden habe, statt dass er ausgeführt wurde. Die passive Formulierung stellt die vom griechischen Perfekt γέγονεν ausgedrückte vollzogene Erfüllung klar dar.'
