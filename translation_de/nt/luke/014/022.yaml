  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: de
  text: 'Und der Diener[a] sagte: »Herr[b], was du befohlen hast, ist ausgeführt worden, und es ist noch Platz.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklave“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gebieter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: Diener
  rationale: „Diener“ gibt die Rolle im Haushalt in natürlichem modernem Deutsch wieder. Da δοῦλος zugleich einen rechtlich unfreien Sklaven bezeichnen kann, bleibt diese Bedeutungsnuance in der Fußnote sichtbar.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet die Anrede an den Hausherrn. „Herr“ ist idiomatisch, bewahrt das Autoritätsverhältnis und lässt offen, ob der Ausdruck hier lediglich eine höfliche beziehungsweise soziale Anrede ist.
- source_word: γέγονεν
  choice: ist geschehen
  rationale: Das Perfekt meldet die abgeschlossene Ausführung mit fortbestehendem Ergebnis. „Ist geschehen“ bewahrt diese resultative Aussage und passt unmittelbar zu „was du befohlen hast“.
- source_word: ὃ ἐπέταξας
  choice: was du befohlen hast
  rationale: Die Formulierung gibt den Inhalt der vorherigen Anweisung wieder und bewahrt mit „befohlen“ die autoritative Kraft von ἐπιτάσσω.
- source_word: ἔτι
  choice: noch
  rationale: „Noch“ drückt natürlich aus, dass nach Ausführung des Befehls weiterhin Kapazität vorhanden ist.
- source_word: τόπος
  choice: Platz
  rationale: Im Zusammenhang des Gastmahls bezeichnet τόπος verfügbaren Raum beziehungsweise weitere Kapazität. „Platz“ ist dafür die natürliche deutsche Wendung.
theological_decisions:
- issue: Bedeutung der Anrede Κύριε innerhalb des Gleichnisses
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ wahrt die mögliche weiterreichende Resonanz des Wortes, ohne die Anrede im unmittelbaren Erzählzusammenhang ausdrücklich christologisch zu deuten. „Gebieter“ wäre kontextuell möglich, würde die Herrschaftsbeziehung aber stärker auslegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Die Satzfolge bleibt nah am Griechischen; „ist geschehen“ erhält den feierlich-resultativen Ton, ohne altertümlich zu wirken.
