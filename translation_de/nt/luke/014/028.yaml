id: LUK.14.28
reference: Luke 14:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: de
  text: Denn wer von euch, der einen Turm bauen will, setzt sich nicht zuerst hin und berechnet die Kosten, ob er genug hat, um ihn fertigzustellen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ob er für die Fertigstellung [genug] hat“; gemeint ist, ob seine Mittel ausreichen, das Vorhaben zu vollenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Denn wer von euch
  rationale: Die Wendung eröffnet eine rhetorische Frage an die Zuhörenden; „Denn“ gibt γάρ wieder und stellt den Zusammenhang mit dem vorausgehenden Gedanken her.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: der einen Turm bauen will
  rationale: Die Relativkonstruktion ist im Deutschen natürlich und bewahrt sowohl die Absicht des Partizips θέλων als auch das konkrete Bild des Turmbaus.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: setzt sich nicht zuerst hin
  rationale: Die Frage erwartet Zustimmung. Die deutsche Formulierung gibt die vorangehende Handlung des Sichhinsetzens klar und idiomatisch wieder.
- source_word: ψηφίζει τὴν δαπάνην
  choice: berechnet die Kosten
  rationale: ψηφίζω bezeichnet hier ein planendes Berechnen; δαπάνη meint die für das Bauvorhaben erforderlichen Aufwendungen.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: ob er genug hat, um ihn fertigzustellen
  rationale: '„Genug“ ist im griechischen Satz sinngemäß enthalten: Geprüft wird, ob die vorhandenen Mittel bis zur Vollendung reichen. Das Pronomen „ihn“ nimmt den Turm auf.'
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und das konkrete Bild des Turmbaus bleiben erhalten.
