source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: de
  text: 'Und er sagte zu ihnen[a]: »Wer von euch wird, wenn sein Sohn oder Ochse in einen Brunnen fällt, ihn nicht sofort am Sabbat herausziehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben »Esel« statt »Sohn«.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Wer von euch
  rationale: Die idiomatische deutsche Frageform gibt die rhetorische Wendung natürlich und genau wieder.
- source_word: υἱὸς
  choice: seinen Sohn
  rationale: Das griechische Wort bezeichnet ausdrücklich einen Sohn; das Possessivpronomen macht die im Genitiv Τίνος liegende Zugehörigkeit im Deutschen klar.
- source_word: βοῦς
  choice: seinen Ochsen
  rationale: »Ochse« ist die übliche konkrete Wiedergabe für das einzelne Rind beziehungsweise Arbeitstier in diesem Beispiel.
- source_word: φρέαρ
  choice: Brunnen
  rationale: Das Wort bezeichnet hier am natürlichsten einen Brunnen; die Wiedergabe vermeidet eine Angleichung an Parallelstellen mit »Grube«.
- source_word: πεσεῖται
  choice: fällt
  rationale: Das futurische Verb steht in einem angenommenen Fall; im modernen Deutschen ist im wenn-Satz das Präsens idiomatisch.
- source_word: εὐθέως
  choice: sofort
  rationale: »Sofort« bewahrt die zeitliche Dringlichkeit des griechischen Ausdrucks.
- source_word: ἀνασπάσει
  choice: herausziehen
  rationale: Das Verb beschreibt das Herauf- beziehungsweise Herausziehen aus der Tiefe und passt natürlich zum Brunnenbild.
- source_word: αὐτὸν
  choice: implizit in »seinen Sohn oder seinen Ochsen … herausziehen«
  rationale: Die deutsche Satzstellung lässt das maskuline Singularobjekt eindeutig auf beide genannten Möglichkeiten zurückbezogen sein, ohne ein schwerfälliges zusätzliches Pronomen.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: auch am Sabbat
  rationale: »Am Sabbat« ist die natürliche deutsche Wiedergabe; »auch« verdeutlicht im Kontext die rhetorische Spannung, ohne den Inhalt zu verändern.
theological_decisions:
- issue: Textvariante beim ersten Gegenstand des Beispiels
  choice: Sohn oder Ochse
  alternative: Esel oder Ochse
  rationale: Der vorgegebene SBLGNT-Text liest υἱός (»Sohn«). Die abweichende Lesart wird nicht in den Haupttext übernommen, sondern transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird durch natürliche deutsche Satzstellung und einen Gedankenstrich klar gegliedert; »auch am Sabbat« erhält den zugespitzten Sinn.
