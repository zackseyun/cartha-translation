  - severity: low
    issue: „auch am Sabbat“
    rationale: Das Griechische nennt den Sabbat als Zeitpunkt („am Sabbat“), ohne ein eigenes Wort für „auch“ zu enthalten. Die rhetorische Zuspitzung bleibt ohne diesen Zusatz erhalten.
