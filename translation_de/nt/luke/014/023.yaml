review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Rollen im Gleichnis (κύριος als „Hausherr“, δοῦλος als „Sklave“), die Auswärtsbewegung, die Ortsangaben, die starke Aufforderung ἀνάγκασον sowie den Zweck des Satzes insgesamt zuverlässig wieder. Das im Deutschen erforderliche Objekt zu ἀνάγκασον sollte jedoch als rückverweisendes „sie“ stehen, nicht als ergänzendes „die Menschen“, da der griechische Text kein Substantiv nennt.
  naturalness: „Nötige die Menschen hereinzukommen“ ist ohne Komma nicht regelgerecht und mit dem expliziten Nomen weniger nah am griechischen Ausdruck. „Nötige sie, hereinzukommen“ ist idiomatisch, grammatisch und präzise. Dieselbe Kommasetzung ist in der Fußnotenalternative nötig.
  terminology: „Hausherr“ ist im Gleichniskontext eine angemessene Wiedergabe von κύριος; „Sklave“ erhält die soziale Bedeutung von δοῦλος. „Nötige“ bewahrt die Stärke von ἀνάγκασον, ohne die im Kontext offene Frage nach physischer Gewalt im Haupttext zu entscheiden. Die Fußnote erläutert dies ausgewogen.
  issues:
  - severity: medium
    issue: Infinitivkonstruktion bei „nötige“
    rationale: Bei „jemanden nötigen, etwas zu tun“ ist das Komma vor der zu-Infinitivgruppe erforderlich. Außerdem fügt „die Menschen“ ein Nomen ein, das im griechischen Text nur implizit ist; „sie“ bildet das implizite Objekt genauer ab.
  - severity: low
    issue: Komma in der Fußnotenalternative
    rationale: Auch „Dränge sie mit Nachdruck, hereinzukommen“ benötigt vor der erweiterten Infinitivgruppe ein Komma.
