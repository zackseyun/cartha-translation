  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: de
  text: 'Und der Hausherr sagte zu dem Sklaven: »Geh hinaus auf die Wege und an die Zäune und nötige sie, hereinzukommen[a], damit mein Haus voll wird.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dränge sie mit Nachdruck, hereinzukommen.« Das griechische Verb ist stark und kann »nötigen« oder »zwingen« bedeuten; im Zusammenhang dieses Gleichnisses muss damit jedoch keine körperliche Gewalt gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Hausherr
  rationale: Im Handlungsrahmen des Gleichnisses bezeichnet κύριος den Herrn beziehungsweise Besitzer des Hauses. »Hausherr« macht diese Rolle deutlich, ohne das Wort vorschnell als unmittelbaren Gottestitel wiederzugeben.
- source_word: δοῦλον
  choice: Sklaven
  rationale: δοῦλος bezeichnet hier einen unfreien Hausangehörigen. »Sklave« bewahrt diesen sozialen Status deutlicher als das weichere »Diener« oder »Knecht«.
- source_word: Ἔξελθε
  choice: Geh hinaus
  rationale: Die Richtungsangabe des Verbs ἐξέρχομαι wird ausdrücklich wiedergegeben.
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: auf die Wege und an die Zäune
  rationale: ὁδοί sind hier Verkehrs- oder Reisewege außerhalb des unmittelbaren Hauses; φραγμοί bezeichnet Abgrenzungen wie Zäune oder Hecken. Die Präpositionen ergeben im Deutschen eine natürliche räumliche Formulierung.
- source_word: ἀνάγκασον
  choice: nötige
  rationale: Das starke Verb bedeutet »nötigen, drängen, zwingen«. »Nötige« erhält seine Intensität, ohne im Haupttext ausdrücklich körperliche Gewalt festzulegen.
- source_word: εἰσελθεῖν
  choice: hereinzukommen
  rationale: Der Infinitiv bezeichnet das Eintreten in das Haus; »hereinzukommen« ist in der direkten Rede natürlich und bewahrt die räumliche Perspektive.
- source_word: ἵνα γεμισθῇ μου ὁ οἶκος
  choice: damit mein Haus voll wird
  rationale: Die ἵνα-Konstruktion gibt Ziel beziehungsweise beabsichtigtes Ergebnis an. »Voll wird« ist natürliches Deutsch und entspricht dem Passiv von γεμίζω sinngemäß.
theological_decisions:
- issue: κύριος innerhalb des Gleichnisses
  choice: Hausherr
  alternative: Herr
  rationale: Das Wort bezeichnet zunächst die menschliche Gestalt innerhalb der erzählten Welt. »Hausherr« verhindert eine voreilige Gleichsetzung mit einem direkten göttlichen Titel, ohne die weitergehende theologische Bedeutung des Gleichnisses auszuschließen.
- issue: Stärke von ἀνάγκασον
  choice: nötige die Menschen hereinzukommen
  alternative: dränge sie mit Nachdruck hereinzukommen; zwinge sie hereinzukommen
  rationale: Die starke Aufforderung des griechischen Verbs bleibt erhalten. Zugleich wird durch die Anmerkung offengehalten, ob hier zwingender Nachdruck oder tatsächlicher Zwang gemeint ist; körperliche Gewalt wird nicht in den Text hineingelesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hausherr« klärt die erzählte soziale Rolle; »Sklave« bewahrt den historischen Status. »Nötige« ist bewusst kräftig gewählt und wird wegen seines möglichen Zwangssinns durch eine Fußnote erläutert.
