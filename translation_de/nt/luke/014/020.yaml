  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: de
  text: 'Und ein anderer sagte: »Ich habe eine Frau geheiratet, deshalb kann ich nicht kommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἕτερος
  choice: Und ein anderer
  rationale: Die Wendung führt in der Abfolge der Entschuldigungen einen weiteren Sprecher ein. „Und ein anderer“ gibt sowohl die Verknüpfung als auch den Wechsel der Person klar und natürlich wieder.
- source_word: Γυναῖκα ἔγημα
  choice: Ich habe eine Frau geheiratet
  rationale: γυνή bezeichnet hier aufgrund des Verbs γαμέω eine Frau im ehelichen Sinn. Das deutsche Perfekt eignet sich für die im direkten Gespräch genannte abgeschlossene Handlung mit gegenwärtiger Bedeutung; das ausdrückliche Objekt bewahrt die Formulierung des griechischen Textes.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: „Deshalb“ drückt den kausalen Zusammenhang im modernen Deutschen knapp und eindeutig aus.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: ich kann nicht kommen
  rationale: Die Formulierung gibt δύναμαι mit Infinitiv unmittelbar und idiomatisch als behauptete Unmöglichkeit wieder.
