id: LUK.14.11
reference: Luke 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: de
  text: Denn jeder, der sich selbst erhöht, wird erniedrigt werden, und wer sich selbst erniedrigt, wird erhöht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι begründet hier die vorausgehende Aufforderung. „Denn“ gibt diese erklärende Funktion im Deutschen natürlich und prägnant wieder.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: jeder, der sich selbst erhöht
  rationale: Das substantivierte Partizip mit πᾶς formuliert eine allgemeingültige Aussage. Die gewählte Fassung bewahrt sowohl den universalen Sinn als auch die Einzahl und den reflexiven Ausdruck.
- source_word: ὑψῶν / ὑψωθήσεται
  choice: erhöht / wird erhöht werden
  rationale: „Erhöhen“ bildet im Deutschen den metaphorischen Sinn sowie den gezielten Gegensatz zu „erniedrigen“ ab. Aktiv und Passiv bleiben entsprechend dem griechischen Parallelismus erkennbar.
- source_word: ταπεινωθήσεται / ταπεινῶν
  choice: wird erniedrigt werden / sich selbst erniedrigt
  rationale: „Erniedrigen“ bewahrt die lexikalische und rhetorische Gegenüberstellung zu „erhöhen“. Beim aktiven Ausdruck bezeichnet es die freiwillige Selbsterniedrigung; beim Passiv das Erniedrigtwerden durch einen nicht ausdrücklich genannten Handelnden.
- source_word: καί
  choice: und
  rationale: „Und“ entspricht der koordinierenden Funktion des griechischen Bindeworts; der Gegensatz ergibt sich bereits deutlich aus den beiden parallel gebauten Satzhälften.
theological_decisions:
- issue: Nicht genannter Handelnder bei den beiden Futurpassiven
  choice: Die Passivformen bleiben ohne Ergänzung eines Handelnden stehen.
  alternative: „wird von Gott erniedrigt werden“ beziehungsweise „wird von Gott erhöht werden“
  rationale: Ein göttliches Handeln liegt im biblischen Zusammenhang nahe, wird im griechischen Wortlaut jedoch nicht ausdrücklich genannt. Die Übersetzung macht diese Deutung deshalb nicht zum Bestandteil des Haupttextes.
- issue: Generisches Maskulinum in der allgemeinen Aussage
  choice: „jeder, der sich selbst erhöht“
  alternative: „alle, die sich selbst erhöhen“ oder „jeder Mensch, der sich selbst erhöht“
  rationale: Die griechischen Formen stehen im Singular Maskulinum und sind generisch gebraucht. Die deutsche Form bewahrt Einzahl, Allgemeingültigkeit und den ausgewogenen Aufbau des Spruchs, ohne den Bezug auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem sprichwörtlichem Parallelismus. Die doppelten Futurformen „wird … werden“ sind grammatisch erforderlich, um das griechische Futurpassiv genau wiederzugeben, und bleiben trotz ihrer formalen Wirkung gut verständlich.
