id: LUK.14.35
reference: Luke 14:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: de
  text: Es eignet sich weder für den Boden noch für den Misthaufen; man wirft es hinaus. Wer Ohren hat zu hören, der höre!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆν
  choice: den Boden
  rationale: Im landwirtschaftlichen Bild bezeichnet γῆ den Erdboden, nicht die Erde im kosmischen Sinn. „Boden“ ist natürlich und lässt die im Griechischen vorhandene allgemeine Formulierung bestehen.
- source_word: κοπρίαν
  choice: den Misthaufen
  rationale: κοπρία bezeichnet hier Mist beziehungsweise einen Ort, an dem Mist gesammelt wird. „Misthaufen“ gibt das konkrete landwirtschaftliche Bild in heutigem Deutsch knapp wieder.
- source_word: εὔθετόν
  choice: eignet sich
  rationale: εὔθετος bedeutet „geeignet“ oder „brauchbar“. Die Wendung „es eignet sich für“ entspricht der Konstruktion mit εἰς und klingt im Deutschen natürlich.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: man wirft es hinaus
  rationale: Der griechische Plural hat ein unbestimmtes Subjekt. Das deutsche „man“ bewahrt diesen unpersönlichen, zugleich aktiven Charakter besser als ein sachlich schwer zuzuordnendes „sie“.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Wer Ohren hat zu hören, der höre!
  rationale: Die sprichwortartige Mahnformel wird eng an der griechischen Struktur wiedergegeben. Der Konjunktiv „höre“ bewahrt die auffordernde Kraft des Imperativs ἀκουέτω in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Generische Personenbezeichnung in der abschließenden Mahnung
  choice: Wer Ohren hat zu hören, der höre!
  alternative: Wer Ohren hat zu hören, soll hören!
  rationale: Das griechische maskuline Singularpartizip ist generisch. Die deutsche „Wer …, der …“-Konstruktion bewahrt die Einzahl und die formelhafte Gestalt, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Misthaufen“ erhält die konkrete, erdverbundene Bildsprache; „der höre“ klingt bewusst feierlich, ist aber als feste Mahnformel allgemein verständlich.
