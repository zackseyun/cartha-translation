  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: de
  text: Und siehe, da war ein Mann vor ihm, der an Wassersucht litt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wassersucht bezeichnet eine krankhafte Ansammlung von Flüssigkeit im Körper, heute meist Ödem genannt.
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine ausdrücklich zeitliche Nuance hinzuzufügen.
- source_word: ἰδοὺ
  choice: siehe
  rationale: Gibt den aufmerksamkeitslenkenden Diskursmarker wieder und bewahrt die erzählerische Anschaulichkeit; die leicht gehobene Form passt zum würdevollen Bibelregister.
- source_word: ἄνθρωπός τις
  choice: ein Mann
  rationale: Im Deutschen bezeichnet der unbestimmte Artikel einen bestimmten, aber nicht näher benannten Mann natürlich; „ein gewisser Mann“ wäre möglich, klänge hier jedoch unnötig markiert.
- source_word: ἦν
  choice: da war
  rationale: Gibt das Imperfekt von εἰμί in Verbindung mit dem einführenden ἰδού idiomatisch wieder.
- source_word: ὑδρωπικὸς
  choice: der an Wassersucht litt
  rationale: Bezeichnet einen von krankhafter Flüssigkeitsansammlung betroffenen Menschen. „Wassersucht“ ist die im Deutschen verständliche traditionelle Krankheitsbezeichnung; „litt“ macht den Krankheitszustand natürlich deutlich.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: vor ihm
  rationale: Bewahrt sowohl die räumliche Bedeutung „vor ihm“ als auch den weiteren Sinn „in seiner Gegenwart“, ohne sich unnötig festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit leicht gehobenem biblischem Erzählton. „Siehe“ bewahrt die Aufmerksamkeit lenkende Funktion von ἰδού; die Satzstellung bleibt natürlich und erhält zugleich die räumliche Offenheit von „vor ihm“.
