  source_fidelity: Der Entwurf gibt die Anrede an den Einladenden, die beiden Mahlzeiten, die vier genannten sozialen Gruppen und die Warnung vor wechselseitiger Einladung insgesamt zuverlässig wieder. Die deutsche Gegenwartsform „damit ist es dir vergolten“ verschiebt jedoch γένηται („es werde/werde ...“) zu einer bereits eingetretenen Vergeltung. Die künftige Folge sollte auch im Deutschen erkennbar bleiben.
  naturalness: Der Text ist weitgehend natürliches modernes Standarddeutsch. „wieder einladen“ kann ohne Ergänzung allerdings auch bloß eine erneute Einladung statt einer Gegeneinladung bezeichnen. „als Gegenleistung einladen“ macht den reziproken Sinn von ἀντικαλέω klar und bleibt idiomatisch.
  terminology: „Mittag- oder Abendessen“, „Brüder“, „Verwandte“ und „reiche Nachbarn“ sind angemessen. „Vergolten“ wahrt den offenen Gegenleistungscharakter von ἀνταπόδομα, ohne eine bestimmte theologische Vergeltungsebene einzutragen.
