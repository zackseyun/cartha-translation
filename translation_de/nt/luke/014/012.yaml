  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: de
  text: 'Er sagte aber auch zu dem, der ihn eingeladen hatte: »Wenn du ein Mittag- oder Abendessen gibst, dann lade nicht deine Freunde ein, auch nicht deine Brüder, deine Verwandten oder deine reichen Nachbarn. Sonst laden auch sie dich womöglich als Gegenleistung ein, und damit wird es dir vergolten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und es wird dir zur Gegenleistung«. Gemeint ist, dass die Einladung durch eine Gegeneinladung erwidert wird.'
    reason: Die ungewöhnliche substantivische Wendung ἀνταπόδομά σοι wird im Haupttext idiomatisch wiedergegeben; die Fußnote macht ihre wörtlichere Gestalt und den unmittelbaren Zusammenhang sichtbar.
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Er sagte aber auch
  rationale: Das Imperfekt steht im fortlaufenden Erzählzusammenhang und wird im natürlichen deutschen Erzählstil mit Präteritum wiedergegeben; δὲ und καὶ erscheinen als „aber auch“.
- source_word: τῷ κεκληκότι αὐτόν
  choice: zu dem, der ihn eingeladen hatte
  rationale: Die Formulierung bildet das Perfektpartizip transparent ab, ohne den deutenderen Begriff „Gastgeber“ einzuführen.
- source_word: Ὅταν ποιῇς ἄριστον ἢ δεῖπνον
  choice: Wenn du ein Mittag- oder Abendessen gibst
  rationale: ποιέω bezeichnet hier idiomatisch das Ausrichten eines Essens. ἄριστον ist die frühere, häufig mittägliche Mahlzeit, δεῖπνον die spätere Hauptmahlzeit.
- source_word: μὴ φώνει
  choice: dann lade nicht … ein
  rationale: Im Zusammenhang einer Mahlzeit bedeutet φωνέω, jemanden einzuladen; „einladen“ ist im Deutschen sachgerecht und natürlich.
- source_word: τοὺς ἀδελφούς σου
  choice: deine Brüder
  rationale: Die grammatisch maskuline Pluralform wird bewahrt, statt sie ohne eindeutigen textlichen Anlass zu neutralisieren.
- source_word: τοὺς συγγενεῖς σου
  choice: deine Verwandten
  rationale: „Verwandte“ ist die klare, heutige Entsprechung für συγγενεῖς.
- source_word: γείτονας πλουσίους
  choice: deine reichen Nachbarn
  rationale: Die direkte Zuordnung des Adjektivs πλουσίους zu γείτονας bleibt erhalten.
- source_word: μήποτε καὶ αὐτοὶ ἀντικαλέσωσίν σε
  choice: Sonst laden sie dich womöglich ebenfalls wieder ein
  rationale: „womöglich“ bewahrt die warnende Möglichkeit von μήποτε; „wieder einladen“ gibt die Gegenseitigkeit des Kompositums ἀντικαλέω idiomatisch wieder.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: und damit ist es dir vergolten
  rationale: Die Formulierung erhält den Gedanken einer erfolgten Gegenleistung, ohne ihn als moralische oder endzeitliche Vergeltung näher festzulegen.
theological_decisions:
- issue: Art der Vergeltung in ἀνταπόδομά σοι
  choice: „damit ist es dir vergolten“ ohne nähere Bestimmung
  alternative: „so erhältst du deinen Lohn“ oder „so wirst du dafür entschädigt“
  rationale: Der Vers beschreibt zunächst gesellschaftliche Gegenseitigkeit. Eine ausdrückliche Festlegung auf irdischen oder göttlichen Lohn würde mehr sagen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarweise Formulierung „Mittag- oder Abendessen“ ist für gewöhnliche Leser verständlich; „womöglich“ bewahrt den warnenden, nicht strikt kausalen Ton. Alle im Haupttext verwendeten Fußnotenmarker sind vorhanden.
