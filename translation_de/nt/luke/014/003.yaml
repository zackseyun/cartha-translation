  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: de
  text: 'Und Jesus antwortete den Gesetzeslehrern[a] und Pharisäern: »Ist es erlaubt, am Sabbat zu heilen, oder nicht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gesetzeskundigen«. Das griechische Wort bezeichnet Fachleute für das jüdische Gesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: wandte sich ... und sagte
  rationale: Die griechische Doppelwendung leitet Jesu Reaktion auf die Situation ein. Eine wörtliche Wiedergabe mit »antwortete und sagte« wäre im modernen Deutschen schwerfällig; »wandte sich ... und sagte« bewahrt sowohl den reaktiven Charakter als auch die ausdrückliche Redeeinleitung.
- source_word: νομικοὺς
  choice: Gesetzeslehrer
  rationale: Gemeint sind Fachkundige des jüdischen Gesetzes, nicht Anwälte im heutigen Sinn. »Gesetzeslehrer« ist verständlich und grenzt die Funktion sachgerecht ein; die Fußnote nennt eine mögliche Alternative.
- source_word: Φαρισαίους
  choice: Pharisäer
  rationale: Eingebürgerte deutsche Bezeichnung der religiösen Gruppierung.
- source_word: Ἔξεστιν
  choice: Ist es erlaubt
  rationale: Die Formulierung gibt die Frage nach dem gemäß dem Gesetz Zulässigen natürlich wieder. »Ist es gesetzlich zulässig« wäre präziser, aber weniger mündlich und deutlich schwerfälliger.
- source_word: τῷ σαββάτῳ
  choice: am Sabbat
  rationale: Der Dativ hat temporale Bedeutung; »am Sabbat« ist die natürliche deutsche Wiedergabe.
- source_word: θεραπεῦσαι
  choice: zu heilen
  rationale: Im Kontext der Evangelien bezeichnet θεραπεύω die Heilung eines Kranken; »heilen« ist die etablierte und sachlich passende Wiedergabe.
- source_word: ἢ οὔ
  choice: oder nicht
  rationale: Bewahrt die knappe, zugespitzte Alternative der griechischen Frage.
theological_decisions:
- issue: Wiedergabe der sabbatrechtlichen Frage ohne Vorwegnahme ihrer Antwort
  choice: Ist es erlaubt, am Sabbat zu heilen, oder nicht?
  alternative: Ist es gesetzlich zulässig, am Sabbat zu heilen, oder nicht?
  rationale: Die Übersetzung erhält die rechtlich-theologische Spannung der Frage, ohne Jesu Schlussfolgerung oder zusätzliche Begründungen zu ergänzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Gesetzeslehrer« vermeidet die irreführende moderne Vorstellung von Rechtsanwälten. Die griechische Doppelwendung »antwortete und sagte« wird idiomatisch wiedergegeben, ohne den reaktiven Charakter von Jesu Äußerung aufzugeben.
