base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: de
  text: 'Doch begannen sie alle einmütig, sich zu entschuldigen.[a] Der Erste sagte zu ihm: »Ich habe einen Acker gekauft und muss hinausgehen und ihn ansehen. Ich bitte dich, betrachte mich als entschuldigt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abzusagen« beziehungsweise »Ausflüchte vorzubringen«. Das griechische Verb kann bedeuten, eine Einladung unter Angabe eines Entschuldigungsgrundes abzulehnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: Die Konjunktion verbindet den Satz mit der vorausgehenden Einladung, leitet hier aber eine deutliche Gegenwendung ein; »Doch« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: sie fingen alle ... an, sich zu entschuldigen
  rationale: Die Konstruktion bezeichnet den Beginn einer gemeinsamen Ablehnung, die durch Entschuldigungsgründe ausgedrückt wird. Die reflexive Form bewahrt die mittlere Bedeutung und passt zu den folgenden Aussagen.
- source_word: ἀπὸ μιᾶς
  choice: wie aus einem Mund
  rationale: Die Wendung bezeichnet ein einhelliges beziehungsweise gemeinsames Handeln. Das deutsche Idiom gibt diese kollektive Kraft verständlich wieder, ohne Gleichzeitigkeit ausdrücklich zu behaupten.
- source_word: Ἀγρόν
  choice: einen Acker
  rationale: ἀγρός bezeichnet hier ein Feld oder Grundstück. »Acker« ist eine direkte, geläufige Wiedergabe, ohne daraus einen ganzen Bauernhof zu machen.
- source_word: ἠγόρασα
  choice: ich habe ... gekauft
  rationale: Das Perfekt ist im modernen Deutsch die natürliche Erzählform für den abgeschlossenen Kauf mit gegenwärtiger Relevanz.
- source_word: ἔχω ἀνάγκην
  choice: muss
  rationale: Die idiomatische Wendung drückt Notwendigkeit aus; »muss« ist knapp, klar und bewahrt ihren Nachdruck.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: hinausgehen und ihn ansehen
  rationale: Die Verbindung von Partizip und Infinitiv beschreibt die zusammengehörenden Handlungen. »Ansehen« bleibt näher am einfachen ἰδεῖν als das stärkere »begutachten«.
- source_word: ἐρωτῶ σε
  choice: Ich bitte dich
  rationale: ἐρωτάω bezeichnet hier eine höfliche Bitte. Die Wiedergabe erhält die ausdrückliche Anrede und ist im Deutschen natürlicher als »Ich frage dich«.
- source_word: ἔχε με παρῃτημένον
  choice: betrachte mich als entschuldigt
  rationale: Die idiomatische Bitte verlangt, dass der Gastgeber die Absage beziehungsweise Entschuldigung als angenommen gelten lässt. Die Formulierung bildet den resultativen Sinn des Perfektpartizips ab.
- source_word: ὁ πρῶτος
  choice: Der Erste
  rationale: Direkte substantivische Wiedergabe des Ordinalzahlworts, das den ersten Entschuldigungsgrund einführt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wie aus einem Mund« macht die idiomatische Wendung ἀπὸ μιᾶς verständlich; der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Formulierung. Die überlieferten Angaben der englischen Fußnoten scheinen bei Fußnote b nicht zum Marker im englischen Haupttext zu passen; deshalb wurde die Idiombedeutung direkt im Text wiedergegeben und keine sachlich unpassende zweite Fußnote übernommen.
