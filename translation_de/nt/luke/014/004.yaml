  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: de
  text: Doch sie schwiegen.[a] Da fasste er ihn an, heilte ihn und ließ ihn gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch sie sagten nichts.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schickte ihn fort“ oder „entließ ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Doch sie
  rationale: Das substantivisch gebrauchte οἱ verweist auf die zuvor Angesprochenen; δέ markiert hier den Gegensatz zwischen Jesu Frage und ihrer ausbleibenden Antwort.
- source_word: ἡσύχασαν
  choice: sie schwiegen
  rationale: Der Aorist von ἡσυχάζω bezeichnet im Kontext, dass sie auf Jesu Frage nichts erwiderten. „Sie schwiegen“ ist natürlich und bewahrt den knappen Erzählstil.
- source_word: ἐπιλαβόμενος
  choice: Da fasste er ihn an
  rationale: ἐπιλαμβάνομαι bezeichnet ein körperliches Ergreifen oder Anfassen. „Anfassen“ wahrt die Körperlichkeit, ohne unnötig ein kräftiges Zupacken zu unterstellen; „Da“ gibt die vorzeitige bzw. begleitende Funktion des Partizips natürlich wieder.
- source_word: ἰάσατο
  choice: heilte ihn
  rationale: ἰάομαι bezeichnet hier eindeutig die körperliche Heilung des erkrankten Mannes.
- source_word: ἀπέλυσεν
  choice: ließ ihn gehen
  rationale: ἀπολύω kann „freilassen“, „entlassen“ oder „wegschicken“ bedeuten. „Ließ ihn gehen“ ist in dieser Szene idiomatisch und bewahrt die semantische Offenheit besser als eine Formulierung, die Gefangenschaft oder eine förmliche Entlassung nahelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem Erzählrhythmus. Die Satzverknüpfung „Da“ vermeidet eine schwerfällige Partizipialkonstruktion; die Fußnoten erhalten die lexikalischen Alternativen, ohne den Haupttext zu überladen.
