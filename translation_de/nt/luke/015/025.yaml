source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: de
  text: Sein älterer Sohn war auf dem Feld; als er kam und sich dem Haus näherte, hörte er Musik und Tanz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Instrumentalmusik und Tänzer.“ Die griechischen Wörter können genauer musikalische Darbietung und eine Gruppe von Tanzenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: war
  rationale: δέ kennzeichnet hier einen erzählerischen Übergang; im Deutschen genügt der neue Satz ohne einen ausdrücklich wiedergegebenen Konnektor.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: sein älterer Sohn
  rationale: πρεσβύτερος ist komparativisch und bezeichnet den älteren, nicht zwingend den ältesten Sohn.
- source_word: ἐν ἀγρῷ
  choice: auf dem Feld
  rationale: ἀγρός bezeichnet hier Feld beziehungsweise landwirtschaftlich genutztes Gelände; „auf dem Feld“ ist die natürliche deutsche Entsprechung.
- source_word: ὡς ἐρχόμενος
  choice: als er zurückkam
  rationale: Die Wendung beschreibt sein Kommen im Erzählverlauf. „Zurückkam“ ergibt sich natürlich aus der Bewegung vom Feld zum Haus, ohne das Ziel vorwegzunehmen.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: sich dem Haus näherte
  rationale: ἐγγίζω mit Dativ bedeutet, sich etwas zu nähern; die deutsche Formulierung bildet dies unmittelbar ab.
- source_word: ἤκουσεν
  choice: hörte
  rationale: Der narrative Aorist wird schlicht und ohne zusätzliche ingressive Nuance wiedergegeben.
- source_word: συμφωνίας
  choice: Musik
  rationale: συμφωνία bezeichnet hier Musik oder musikalischen Klang, möglicherweise besonders Instrumentalmusik. „Musik“ ist verständlich und vermeidet den anachronistischen Eindruck von „Sinfonie“.
- source_word: χορῶν
  choice: Tanz
  rationale: χορός kann Tanz, Tänzer oder eine Tanzgruppe bezeichnen. Zusammen mit „Musik“ ist „Tanz“ idiomatisch, während die sachliche Mehrdeutigkeit in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählweise. Die semantische Spannweite von συμφωνία und χορός wird im Haupttext idiomatisch und in der Fußnote genauer wiedergegeben.
