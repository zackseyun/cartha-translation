id: LUK.15.30
reference: Luke 15:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: de
  text: Aber als dieser Sohn von dir kam, der dein Vermögen mit Prostituierten aufgefressen hatte[a], hast du für ihn das gemästete Kalb geschlachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Lebensgrundlage aufgezehrt hatte“. Das griechische Verb ist bildhaft und bedeutet wörtlich „aufessen“ oder „verschlingen“; das Substantiv kann Lebensunterhalt, Besitz oder Vermögen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Aber als
  rationale: Gibt sowohl den zeitlichen Sinn von ὅτε als auch den leicht gegensätzlichen Anschluss durch δέ im vorwurfsvollen Kontext wieder.
- source_word: ὁ υἱός σου οὗτος
  choice: dieser Sohn von dir
  rationale: Bewahrt die demonstrative, emotional distanzierende Ausdrucksweise; der ältere Sohn sagt bewusst nicht „mein Bruder“.
- source_word: ὁ καταφαγών
  choice: aufgefressen hatte
  rationale: Das kräftige Bild des griechischen Verbs („aufessen, verschlingen“) bleibt erhalten. „Verprasst“ wäre idiomatisch, würde das Bild aber interpretierend ersetzen.
- source_word: σου τὸν βίον
  choice: dein Vermögen
  rationale: βίος bezeichnet hier nicht das biologische Leben, sondern Besitz beziehungsweise die wirtschaftliche Lebensgrundlage des Vaters. „Vermögen“ ist im Erzählzusammenhang natürlich und verständlich.
- source_word: μετὰ πορνῶν
  choice: mit Prostituierten
  rationale: Direkte, heutige und sachlich genaue Wiedergabe der Anschuldigung.
- source_word: ἦλθεν
  choice: kam
  rationale: Folgt dem schlichten griechischen Verb, ohne das kontextuell naheliegende, aber nicht ausdrücklich enthaltene „zurückkam“ einzufügen.
- source_word: ἔθυσας
  choice: hast du ... geschlachtet
  rationale: Bezeichnet hier das Schlachten eines Tieres für das Festmahl; vermeidet die unpassende kultische Konnotation von „geopfert“.
- source_word: τὸν σιτευτὸν μόσχον
  choice: das gemästete Kalb
  rationale: Natürliche und genaue Bezeichnung eines eigens für ein Fest gemästeten Kalbes.
- source_word: αὐτῷ
  choice: für ihn
  rationale: 'Der Dativ bezeichnet hier den Begünstigten: Das Kalb wurde ihm zu Ehren beziehungsweise für sein Fest geschlachtet.'
theological_decisions:
- issue: Status der Anschuldigung des älteren Sohnes
  choice: Die Anschuldigung steht ohne abschwächenden Zusatz direkt in seiner Rede.
  alternative: „der dein Vermögen angeblich mit Prostituierten aufgefressen hatte“
  rationale: Der griechische Text gibt die Worte des älteren Sohnes wieder, bestätigt sie aber nicht eigens durch den Erzähler. Eine direkte Übersetzung bewahrt diese narrative Spannung, ohne die Behauptung entweder zu beglaubigen oder abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser Sohn von dir“ klingt bewusst distanziert und vorwurfsvoll; „aufgefressen“ bewahrt die scharfe Bildsprache des älteren Sohnes.
