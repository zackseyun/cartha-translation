  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Nuancen des griechischen Textes zuverlässig wieder: δέ ist mit „Aber“ kontrastiv aufgenommen, οὗτος wahrt die demonstrative Distanzierung in „dieser Sohn von dir“, und ἦλθεν bleibt zutreffend bei „kam“. „Mit Prostituierten“ gibt μετά πορνῶν direkt wieder, ohne die Anschuldigung erzählerisch zu bestätigen oder abzuschwächen. „Für ihn“ trifft die begünstigende Funktion von αὐτῷ.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem erzählerischem Register. „Dieser Sohn von dir“ wirkt im Deutschen bewusst abweisend und vorwurfsvoll. „Dein Vermögen ... aufgefressen“ ist scharf und bildhaft, aber im Kontext der empörten Rede natürlich genug.
  terminology: „Vermögen“ ist für βίος im Kontext sachgerecht; die Fußnote nennt mit „Lebensgrundlage“, „Besitz“ und „Vermögen“ die relevante Bedeutungsbreite. „Prostituierten“, „gemästete Kalb“ und „geschlachtet“ sind präzise, gegenwartsverständliche Wiedergaben. Die Fußnote ist korrekt verankert und erläutert die Metaphorik von καταφαγών angemessen.
