base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: de
  text: Alle Zöllner und Sünder kamen zu ihm, um ihn zu hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „näherten sich ihm, um ihn zu hören“. Die griechische Form beschreibt einen andauernden Vorgang und kann auch wiederholtes Näherkommen nahelegen.'
    reason: Aspektuelle und lexikalische Alternative
lexical_decisions:
- source_word: Ἦσαν δὲ … ἐγγίζοντες
  choice: kamen immer wieder
  rationale: Die periphrastische Konstruktion aus Imperfekt und Präsenspartizip beschreibt einen andauernden oder wiederholten Vorgang. „Kamen immer wieder“ gibt diesen Aspekt in natürlichem Deutsch wieder; δέ bleibt als leichter Erzählübergang unausgedrückt.
- source_word: αὐτῷ ἐγγίζοντες
  choice: kamen … zu ihm
  rationale: ἐγγίζω bezeichnet das Näherkommen. Die idiomatische Formulierung bewahrt die Bewegung auf Jesus zu, ohne das im Deutschen hier steif wirkende „sich ihm nähern“ zu verlangen.
- source_word: πάντες
  choice: alle
  rationale: πάντες bezieht sich auf beide genannten Gruppen und betont deren umfassende Beteiligung.
- source_word: οἱ τελῶναι
  choice: Zolleinnehmer
  rationale: τελώνης bezeichnet Personen, die Abgaben beziehungsweise Zölle einzogen. „Zolleinnehmer“ ist im historischen Kontext präziser als der moderne Verwaltungsbegriff „Steuerbeamte“.
- source_word: οἱ ἁμαρτωλοὶ
  choice: Sünder
  rationale: Das substantivierte Adjektiv benennt Menschen, die als sündig galten, ohne die Kategorie im Text näher auszulegen.
- source_word: ἀκούειν αὐτοῦ
  choice: um ihm zuzuhören
  rationale: Der Infinitiv gibt den Zweck des Kommens an. Bei einer Person als Objekt bedeutet ἀκούω hier natürlich „zuhören“; der Dativ entspricht idiomatischem Deutsch.
theological_decisions:
- issue: Sozial-religiöse Bedeutung von „Zolleinnehmer und Sünder“
  choice: Die beiden Gruppenbezeichnungen bleiben ohne erklärende Erweiterung stehen.
  alternative: „Zolleinnehmer und andere Ausgestoßene“ oder „Zolleinnehmer und berüchtigte Sünder“
  rationale: Der griechische Text nennt die Gruppen, erklärt oder bewertet ihren sozialen Status an dieser Stelle aber nicht weiter. Die knappe Wiedergabe erhält die erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches und würdevolles Standarddeutsch. „Kamen immer wieder“ ist natürlicher als eine formnahe periphrastische Konstruktion und macht den imperfektiven Aspekt sichtbar. „Zolleinnehmer“ hält den antiken Einnahmekontext präsent.
