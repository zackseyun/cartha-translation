  naturalness: „Alle Zöllner und Sünder kamen zu ihm, um ihn zu hören“ ist modernes, klares Standarddeutsch. „Zöllner“ ist die im deutschen Bibelgebrauch etablierte und für τελῶναι angemessene Bezeichnung.
