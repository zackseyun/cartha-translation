id: LUK.15.10
reference: Luke 15:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: de
  text: 'Ebenso sage ich euch: Vor den Engeln Gottes herrscht Freude über einen einzigen Sünder, der umkehrt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung lautet wörtlich: „vor den Engeln Gottes“. Sie sagt nicht ausdrücklich, dass die Engel selbst diejenigen sind, die sich freuen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Ebenso
  rationale: Leitet die Anwendung der vorangehenden Parabel ein und bewahrt deren vergleichende Kraft in natürlichem Deutsch.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Gibt die direkte, nachdrückliche Redeformel knapp und idiomatisch wieder.
- source_word: γίνεται χαρά
  choice: herrscht ... Freude
  rationale: Drückt das Entstehen beziehungsweise Vorhandensein von Freude natürlich aus, ohne einen menschlichen Handlungsträger hinzuzufügen.
- source_word: ἐνώπιον
  choice: vor
  rationale: Bewahrt die räumlich-sphärische Aussage des Griechischen und legt nicht fest, dass ausdrücklich die Engel selbst die sich Freuenden sind.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: den Engeln Gottes
  rationale: Gibt die Genitivverbindung unmittelbar und in würdigem, verständlichem Deutsch wieder.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: über einen einzigen Sünder
  rationale: Kennzeichnet den Anlass der Freude; „einzigen“ hebt das griechische Zahlwort ἑνί angemessen hervor.
- source_word: μετανοοῦντι
  choice: der umkehrt
  rationale: Gibt das Partizip als natürlichen Relativsatz wieder. „Umkehrt“ bewahrt den biblisch-theologischen Sinn von Sinnesänderung und Neuausrichtung, ohne ihn dogmatisch auszuweiten.
theological_decisions:
- issue: Bedeutung der Umkehrsprache
  choice: der umkehrt
  alternative: der Buße tut; der seine Gesinnung ändert
  rationale: Der Vers definiert μετάνοια nicht vollständig. „Umkehrt“ ist verständlich und bewahrt die theologische Breite, ohne bloß eine gedankliche Meinungsänderung oder eine bestimmte Bußlehre festzuschreiben.
- issue: Ort beziehungsweise Träger der Freude
  choice: vor den Engeln Gottes
  alternative: bei den Engeln Gottes; die Engel Gottes freuen sich
  rationale: Das Griechische verortet die Freude ausdrücklich „vor“ den Engeln, benennt aber nicht eindeutig die Engel als deren Träger. Die Übersetzung erhält diese echte Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Satzstellung wahrt Jesu nachdrückliche Redeformel; die Fußnote macht die im Haupttext bereits formal bewahrte Mehrdeutigkeit ausdrücklich.
