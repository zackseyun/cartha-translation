  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: de
  text: 'Dann sagte er: »Ein Mann[a] hatte zwei Söhne.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein gewisser Mann hatte zwei Söhne.« Das griechische τις kann die unbestimmte Person etwas stärker hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Dann sagte er
  rationale: Das Aoristverb Εἶπεν führt zusammen mit dem milden Übergangspartikel δέ den nächsten Teil der Rede Jesu ein. „Dann sagte er“ gibt den Fortgang im Deutschen natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: Ἄνθρωπός τις
  choice: Ein Mann
  rationale: τις kennzeichnet die Person als unbestimmt. Im modernen Deutschen gibt „ein Mann“ die parabeltypische Einführung natürlicher wieder als das auffälligere „ein gewisser Mann“; die Alternative wird in der Fußnote bewahrt.
- source_word: εἶχεν
  choice: hatte
  rationale: Das Imperfekt von ἔχω beschreibt die Ausgangssituation der Erzählung; das deutsche Präteritum „hatte“ ist dafür idiomatisch.
- source_word: δύο
  choice: zwei
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: υἱούς
  choice: Söhne
  rationale: υἱούς bezeichnet ausdrücklich männliche Nachkommen. „Söhne“ erhält dieses für das Gleichnis wichtige familiäre Detail.
theological_decisions:
- issue: Unbestimmte oder leicht individualisierende Bedeutung von Ἄνθρωπός τις
  choice: Ein Mann
  alternative: Ein gewisser Mann
  rationale: Die Wendung führt eine nicht näher bezeichnete männliche Figur des Gleichnisses ein. Natürliches modernes Deutsch drückt diese Unbestimmtheit bereits mit „ein Mann“ aus; „ein gewisser Mann“ bildet τις formaler ab, klingt jedoch markierter. Keine der Fassungen legt eine zusätzliche allegorische Identifikation nahe.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede steht in deutschen Anführungszeichen; die knappe parabolische Einleitung bleibt erhalten.
