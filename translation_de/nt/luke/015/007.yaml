id: LUK.15.7
reference: Luke 15:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: de
  text: 'Ich sage euch: Ebenso[a] wird im Himmel mehr Freude sein über einen einzigen Sünder, der umkehrt, als über neunundneunzig Gerechte[b], die keine Umkehr nötig haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So“ beziehungsweise „Auf diese Weise“. Der Ausdruck verbindet die Freude im Himmel mit der Pointe des vorangehenden Gleichnisses.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „Gerechte“. Im Zusammenhang kann die Bezeichnung unmittelbar oder ironisch verstanden werden; die Übersetzung entscheidet diese Frage nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Gibt die direkte, nachdrückliche Einleitungsformel natürlich und nah am griechischen Wortlaut wieder.
- source_word: οὕτως
  choice: ebenso
  rationale: Verknüpft die Aussage ausdrücklich mit dem Geschehen und der Pointe des vorangehenden Gleichnisses.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: wird im Himmel mehr Freude sein
  rationale: Bewahrt Zukunft und Ortsangabe. „Mehr“ macht im Deutschen den durch ἢ ausgedrückten Vergleich verständlich, ohne die Träger der Freude näher zu bestimmen.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: über einen einzigen Sünder
  rationale: Bei χαρά bezeichnet ἐπί den Anlass der Freude. „Einen einzigen“ hebt den Kontrast zu den neunundneunzig hervor, der im griechischen Zahlwort ἑνί liegt.
- source_word: μετανοοῦντι
  choice: der umkehrt
  rationale: „Umkehren“ gibt μετανοέω in diesem Zusammenhang als innere und praktische Neuausrichtung idiomatisch wieder; der Relativsatz entspricht dem präsentischen Partizip.
- source_word: ἢ
  choice: als
  rationale: Kennzeichnet zusammen mit dem im Deutschen erforderlichen „mehr“ den Vergleich zwischen der Freude über den einen und über die neunundneunzig.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: neunundneunzig Gerechte
  rationale: Das substantivisch gebrauchte Adjektiv wird im Deutschen ebenso substantivisch wiedergegeben und weder ironisch markiert noch deutend umschrieben.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: die keine Umkehr nötig haben
  rationale: Gibt die beschreibende Relativkonstruktion und die nominale Formulierung mit μετανοίας knapp und natürlich wieder.
theological_decisions:
- issue: Ob die „Gerechten“ tatsächlich gerecht oder im Kontext ironisch beziehungsweise als selbstgerecht bezeichnet sind
  choice: „Gerechte“ ohne interpretierende Kennzeichnung
  alternative: „Menschen, die sich für gerecht halten“ oder Anführungszeichen um „Gerechte“
  rationale: Der griechische Text bezeichnet sie ausdrücklich als δικαίοις und markiert keine Ironie. Die Übersetzung bewahrt deshalb die mögliche Spannung, statt sie aufzulösen.
- issue: Wer sich im Himmel freut
  choice: 'Nur den Ort der Freude nennen: „im Himmel“'
  alternative: Gott oder die Engel ausdrücklich als die sich Freuenden einsetzen
  rationale: Der Vers nennt mit ἐν τῷ οὐρανῷ den Ort, aber nicht ausdrücklich die Handelnden. Eine nähere Bestimmung würde über den Wortlaut hinausgehen.
- issue: Vergleichsverhältnis der Freude
  choice: Den durch ἢ angezeigten Vergleich mit „mehr … als“ ausdrücken
  alternative: „Freude … über den einen Sünder oder über die neunundneunzig Gerechten“
  rationale: Im Zusammenhang der Gleichnispointe bezeichnet ἢ den zweiten Teil eines Vergleichs. „Mehr“ ist im natürlichen Deutschen nötig, um dieses Verhältnis eindeutig wiederzugeben, ohne zu behaupten, dass über die neunundneunzig überhaupt keine Freude besteht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Umkehr“ und „umkehren“ sind verständlich und bewahren den religiös-ethischen Gehalt, ohne eine konfessionell geprägte Sonderdeutung einzutragen.
