id: LUK.15.8
reference: Luke 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: de
  text: Oder welche Frau, die zehn Drachmen[a] hat, zündet nicht, wenn sie eine davon verliert, eine Lampe an, fegt das Haus und sucht sorgfältig, bis sie sie findet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Drachme war eine griechische Silbermünze.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Oder
  rationale: Leitet das zweite, zum vorherigen Gleichnis parallele Beispiel ein und bewahrt die verbindende Funktion.
- source_word: τίς γυνὴ
  choice: welche Frau
  rationale: Gibt die rhetorische Frage natürlich wieder, ohne das im Griechischen nicht vorhandene »unter euch« hinzuzufügen.
- source_word: δραχμὰς
  choice: Drachmen
  rationale: Bewahrt die historisch konkrete Bezeichnung der griechischen Silbermünze; eine Fußnote erklärt den Begriff.
- source_word: ἔχουσα δέκα
  choice: die zehn Drachmen hat
  rationale: Löst das Partizip in einen natürlichen deutschen Relativsatz auf.
- source_word: ἐὰν ἀπολέσῃ δραχμὴν μίαν
  choice: und eine davon verliert
  rationale: Der hypothetische Fall bleibt im rhetorischen Satz erkennbar; »davon« vermeidet eine schwerfällige Wiederholung und erhält die Betonung der einen Münze.
- source_word: οὐχὶ
  choice: zündet nicht
  rationale: Formuliert die rhetorische Frage so, dass sie wie im Griechischen eine bejahende Antwort erwartet.
- source_word: ἅπτει λύχνον
  choice: zündet nicht eine Lampe an
  rationale: ἅπτω bezeichnet hier das Entzünden; der unbestimmte Ausdruck entspricht dem artikellosen λύχνον.
- source_word: σαροῖ τὴν οἰκίαν
  choice: fegt das Haus
  rationale: Gibt die konkrete häusliche Handlung knapp und anschaulich wieder.
- source_word: ζητεῖ ἐπιμελῶς
  choice: sucht sorgfältig
  rationale: Bewahrt den Sinn von ἐπιμελῶς als gewissenhaftes, genaues beziehungsweise eifriges Suchen.
- source_word: ἕως οὗ εὕρῃ
  choice: bis sie sie findet
  rationale: Kennzeichnet den Endpunkt der Suche; das zweite Pronomen nimmt im Deutschen eindeutig die feminine Drachme auf.
theological_decisions: []
