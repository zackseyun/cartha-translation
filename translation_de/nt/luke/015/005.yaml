  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: de
  text: Und wenn er es[a] gefunden hat, legt er es voller Freude auf seine Schultern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das verlorene Schaf aus dem vorhergehenden Vers.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: wenn er es gefunden hat
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Ein temporaler Nebensatz klingt im modernen Deutsch natürlich. Das Objekt „es“ wird aus dem unmittelbaren Zusammenhang ergänzt und bezeichnet das verlorene Schaf.
- source_word: ἐπιτίθησιν
  choice: legt er es
  rationale: Das Präsens gibt die anschaulich erzählte Haupthandlung wieder. „legen“ passt idiomatisch zur Bewegung auf die Schultern; das im Griechischen unausgesprochene Objekt wird im Deutschen zur Klarheit erneut aufgenommen.
- source_word: ἐπὶ τοὺς ὤμους
  choice: auf seine Schultern
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung beziehungsweise das Platzieren auf etwas; der Plural von ὤμους bleibt erhalten.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Genitivpronomen bezieht sich auf den Hirten und wird im Deutschen natürlich als Possessivartikel wiedergegeben.
- source_word: χαίρων
  choice: voller Freude
  rationale: Das Präsenspartizip beschreibt den begleitenden Gemütszustand. „voller Freude“ bewahrt diesen Sinn in natürlichem Deutsch, ohne einen zusätzlichen Grund oder eine zeitliche Abfolge einzutragen.
theological_decisions:
- issue: Ergänzung des unausgesprochenen direkten Objekts
  choice: „es“ wird nach „gefunden“ und zur natürlichen deutschen Satzbildung auch nach „legt“ ergänzt; gemeint ist das verlorene Schaf.
  alternative: Eine formal engere Wiedergabe ohne ausdrücklich genanntes Objekt wäre im Deutschen unvollständig oder unnatürlich.
  rationale: Das Griechische lässt das aus dem Kontext eindeutige Objekt unausgesprochen. Seine Ergänzung macht den Bezug verständlich, ohne die theologische Aussage der Parabel auszulegen oder zu erweitern.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die anschauliche Erzählweise des griechischen Präsens bleibt erhalten; „voller Freude“ gibt das begleitende Partizip idiomatisch wieder.
