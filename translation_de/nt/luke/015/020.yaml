  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: de
  text: Da stand er auf und ging zu seinem Vater. Als er aber noch weit entfernt war[a], sah ihn sein Vater und wurde von tiefem Mitgefühl ergriffen. Er lief zu ihm, fiel ihm um den Hals und küsste ihn innig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „noch weit weg war“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann besondere Herzlichkeit und möglicherweise wiederholtes Küssen ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand er auf
  rationale: Das Aoristpartizip bezeichnet den entschlossenen ersten Schritt des Sohnes und wahrt die Abfolge von Aufstehen und Gehen.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: ging zu seinem Vater
  rationale: ἔρχομαι kann je nach Erzählperspektive „kommen“ oder „gehen“ bedeuten. Im Deutschen ist „ging zu seinem Vater“ aus der Perspektive des Sohnes natürlich; das reflexive ἑαυτοῦ wird idiomatisch mit „seinem“ wiedergegeben.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: Als er aber noch weit entfernt war
  rationale: Die Genitivus-abs​​olutus-Konstruktion bezeichnet einen gleichzeitig bestehenden Umstand. Die Formulierung ist klar und bewahrt sowohl „noch“ als auch die räumliche Distanz.
- source_word: ἐσπλαγχνίσθη
  choice: wurde von tiefem Mitgefühl ergriffen
  rationale: Das Verb bezeichnet ein starkes, innerlich bewegendes Erbarmen. Die Wiedergabe erhält diese emotionale Intensität, ohne sie theologisch auszudeuten.
- source_word: δραμὼν
  choice: lief zu ihm
  rationale: Das Partizip bezeichnet das Laufen des Vaters; „zu ihm“ macht im Deutschen das im Zusammenhang eindeutige Ziel idiomatisch sichtbar.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: fiel ihm um den Hals
  rationale: Die geläufige deutsche Wendung bewahrt das lebhafte Bild der griechischen Formulierung „fiel auf seinen Hals“, ohne die ausdrückliche Ergänzung von Armen oder einer Umarmung.
- source_word: κατεφίλησεν
  choice: küsste ihn innig
  rationale: Das zusammengesetzte Verb kann nachdrückliches, herzliches und möglicherweise wiederholtes Küssen ausdrücken. „innig“ bewahrt die Zuneigung, ohne Wiederholung als sicher festzulegen.
theological_decisions:
- issue: Darstellung des Mitgefühls des Vaters im Gleichnis
  choice: Die Reaktion des Vaters wird emotional kraftvoll, aber ohne allegorische Ausdeutung wiedergegeben.
  alternative: Die Gefühlsintensität abschwächen oder den Vater ausdrücklich mit Gott gleichsetzen.
  rationale: Die starken Erzählverben des Verses stellen die mitfühlende Initiative des Vaters heraus. Die Übersetzung bewahrt diese Kraft, ohne eine über den Wortlaut hinausgehende Lehraussage einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählbewegung. Die idiomatische Wendung „fiel ihm um den Hals“ erhält das konkrete Bild; „innig“ lässt offen, ob die Verbintensivierung Herzlichkeit, Wiederholung oder beides bezeichnet. Die Fußnotenmarker wurden an den jeweils sachlich zugehörigen Ausdrücken gesetzt.
