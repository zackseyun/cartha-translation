  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: de
  text: 'Als er aber zu sich kam[a], sagte er: »Wie viele Lohnarbeiter meines Vaters haben Brot im Überfluss[b], und ich gehe hier vor Hunger zugrunde[c]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als er zur Besinnung kam.« Wörtlich: »Als er zu sich selbst kam.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »haben mehr als genug Brot« oder »haben Brot übrig«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »und ich sterbe hier vor Hunger« beziehungsweise »ich verhungere hier«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: Da kam er zu sich selbst
  rationale: Bewahrt das griechische Bild einer Rückkehr zu sich selbst; die idiomatischere Deutung „zur Besinnung kommen“ wird in der Fußnote genannt.
- source_word: ἔφη
  choice: und sagte
  rationale: Der Aorist wird im deutschen Erzählstil natürlich als Präteritum wiedergegeben.
- source_word: μίσθιοι
  choice: Tagelöhner
  rationale: Bezeichnet entlohnte Arbeitskräfte im Unterschied zu Sklaven; „Tagelöhner“ ist im ländlichen Kontext prägnant und verständlich.
- source_word: περισσεύονται ἄρτων
  choice: haben Brot im Überfluss
  rationale: Gibt die vorhandene Fülle beziehungsweise den Überschuss wieder, ohne ἄρτων zu „Nahrung“ zu verallgemeinern.
- source_word: ἄρτων
  choice: Brot
  rationale: Bewahrt den konkreten Ausdruck des griechischen Textes.
- source_word: λιμῷ
  choice: vor Hunger
  rationale: Im Zusammenhang bezeichnet λιμός den Hunger beziehungsweise das Verhungern; „vor Hunger“ ist mit „zugrunde gehen“ idiomatisches Deutsch.
- source_word: ὧδε
  choice: hier
  rationale: Markiert seine gegenwärtige elende Lage und verstärkt den Gegensatz zur Versorgung der Tagelöhner.
- source_word: ἀπόλλυμαι
  choice: ich gehe ... zugrunde
  rationale: Bewahrt den durativen und starken Sinn des Präsens, ohne ausschließlich auf den unmittelbar bevorstehenden leiblichen Tod festgelegt zu sein.
