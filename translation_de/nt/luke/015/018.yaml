id: LUK.15.18
reference: Luke 15:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: de
  text: 'Ich werde aufstehen und zu meinem Vater gehen und zu ihm sagen: »Vater, ich habe gegen den Himmel[a] und vor dir[b] gesündigt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Himmel« ist hier wahrscheinlich in ehrfürchtiger Weise Gott gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in deinen Augen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Ich werde aufstehen
  rationale: Das vor dem futurischen Hauptverb stehende Aoristpartizip bezeichnet den ersten Schritt des gefassten Entschlusses. Im Deutschen wird die Abfolge natürlich durch zwei mit »und« verbundene Futurformen wiedergegeben.
- source_word: πορεύσομαι
  choice: gehen
  rationale: Das Verb bezeichnet hier die Bewegung zum Vater. »Gehen« ist im Kontext klar und natürlich, ohne die zusätzliche Nuance von »aufbrechen« einzutragen.
- source_word: πρὸς τὸν πατέρα μου
  choice: zu meinem Vater
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu; »zu meinem Vater« ist die idiomatische deutsche Entsprechung.
- source_word: ἐρῶ αὐτῷ
  choice: zu ihm sagen
  rationale: Die Zukunftsform von λέγω mit einem Dativobjekt wird quellennah und idiomatisch als »zu ihm sagen« wiedergegeben.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ ist eine direkte Anrede. »Vater« bewahrt sie, ohne ein im griechischen Wortlaut nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: ἥμαρτον
  choice: ich habe … gesündigt
  rationale: Der Aorist bezeichnet die begangene Sünde. Das deutsche Perfekt klingt in einem persönlichen Bekenntnis natürlich und bringt zugleich deren gegenwärtige Bedeutung zum Ausdruck.
- source_word: εἰς τὸν οὐρανὸν
  choice: gegen den Himmel
  rationale: Die Präposition εἰς hat mit ἁμαρτάνω hier die Bedeutung »gegen«. »Himmel« bleibt als ehrfürchtige Umschreibung für Gott im Haupttext erhalten, statt interpretierend durch »Gott« ersetzt zu werden.
- source_word: ἐνώπιόν σου
  choice: vor dir
  rationale: ἐνώπιον mit Genitiv bedeutet »vor, in Gegenwart von, in den Augen von«. »Vor dir« ist knapp, natürlich und wahrt den Unterschied zur vorangehenden Formulierung »gegen den Himmel«.
theological_decisions:
- issue: Ob »Himmel« im Haupttext ausdrücklich als »Gott« wiederzugeben ist
  choice: '»Himmel« wird beibehalten: »gegen den Himmel«'
  alternative: »gegen Gott«
  rationale: οὐρανός ist hier wahrscheinlich eine ehrfürchtige Umschreibung für Gott. Da der griechische Text jedoch »Himmel« sagt, bewahrt die Übersetzung den Ausdruck und seine theologische Spannung, statt ihn stillschweigend aufzulösen.
- issue: Ob ἐνώπιόν σου an die Bedeutung »gegen dich« angeglichen werden soll
  choice: »vor dir«
  alternative: »gegen dich« oder »in deinen Augen«
  rationale: Die Formulierung bezeichnet wörtlich die Stellung vor den Augen beziehungsweise in der Gegenwart des Vaters. »Gegen dich« wäre im Zusammenhang verständlich, würde aber den Unterschied zwischen εἰς und ἐνώπιον einebnen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt schlicht und eindringlich. Die Satzstellung ist dem Deutschen angepasst, während die Abfolge des Entschlusses und die beiden unterschiedlichen Wendungen des Sündenbekenntnisses erhalten bleiben.
