id: LUK.15.22
reference: Luke 15:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: de
  text: 'Doch der Vater sagte zu seinen Sklaven[a]: »Schnell, holt das beste Gewand[b] heraus und zieht es ihm an! Steckt ihm einen Ring[c] an die Hand und zieht ihm Sandalen an die Füße!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dienern«. Das griechische Wort bezeichnet hier unfreie Haushaltsangehörige beziehungsweise Sklaven.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »das erste Gewand«; gemeint ist wahrscheinlich das beste oder vornehmste Gewand.'
    reason: lexical_alternative
  - marker: c
    text: Im Griechischen steht lediglich »einen Ring«. Ob damit ein Siegelring als Zeichen wiederhergestellten Ranges gemeint ist, bleibt unausgesprochen.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: Sklaven
  rationale: δοῦλος bezeichnet hier unfreie Angehörige des Haushalts. »Sklaven« bewahrt diese soziale Wirklichkeit genauer als das allgemeinere »Diener«.
- source_word: Ταχὺ
  choice: Schnell
  rationale: Das adverbial gebrauchte Wort drückt die Dringlichkeit des väterlichen Befehls knapp und natürlich aus.
- source_word: ἐξενέγκατε
  choice: holt ... heraus
  rationale: Die Form ist ein Imperativ im Plural und bezeichnet das Herausholen des Gewands, etwa aus dem Haus oder aus der Aufbewahrung.
- source_word: στολὴν τὴν πρώτην
  choice: das beste Gewand
  rationale: πρώτην bedeutet wörtlich »erste«, bezeichnet hier aber wahrscheinlich das vornehmste oder beste Gewand. Die idiomatische Wiedergabe wahrt den kontextuellen Sinn.
- source_word: ἐνδύσατε αὐτόν
  choice: zieht es ihm an
  rationale: Die Wendung bezeichnet das Bekleiden einer Person; mit dem zuvor genannten Gewand ist diese Formulierung im Deutschen konkret und natürlich.
- source_word: δακτύλιον
  choice: einen Ring
  rationale: Das Substantiv bezeichnet allgemein einen Ring. Ob ein Siegelring gemeint ist, wird im griechischen Wortlaut nicht ausdrücklich gesagt.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: an die Hand
  rationale: Bei einem Ring ist »an die Hand stecken« eine natürliche deutsche Wiedergabe der räumlichen Wendung, ohne einen im Text nicht genannten Finger einzuführen.
- source_word: ὑποδήματα
  choice: Sandalen
  rationale: Das Wort bezeichnet Fußbekleidung und ist für den antiken mediterranen Kontext mit »Sandalen« kulturgeschichtlich präzise wiedergegeben.
- source_word: εἰς τοὺς πόδας
  choice: an die Füße
  rationale: In Verbindung mit dem Anziehen von Sandalen entspricht dies natürlichem modernem Deutsch.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier den erzählerischen Übergang und einen milden Gegensatz zwischen den Worten des Sohnes und der unmittelbaren Reaktion des Vaters.
theological_decisions:
- issue: Wiedergabe von δούλους als »Sklaven« oder »Diener«
  choice: Sklaven
  alternative: Diener
  rationale: Die Bezeichnung bewahrt den unfreien Status der betreffenden Haushaltsangehörigen, ohne daraus eine über den Text hinausgehende theologische Aussage abzuleiten.
- issue: Wiedergabe von πρώτην in στολὴν τὴν πρώτην
  choice: das beste Gewand
  alternative: das erste Gewand
  rationale: Im Kontext bezeichnet die Formulierung wahrscheinlich das ranghöchste oder beste Gewand und nicht bloß das zeitlich oder räumlich erste. Die wörtliche Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Mögliche Präzisierung von δακτύλιον als Siegelring
  choice: einen Ring
  alternative: einen Siegelring
  rationale: Ein Siegelring und die damit verbundene Wiederherstellung von Rang oder Vollmacht mögen mitgemeint sein, werden vom griechischen Substantiv selbst jedoch nicht ausdrücklich bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit lebendigen Imperativen. »Gewand« hält den antiken Kontext besser fest als »Kleid«, während die idiomatische Syntax verständlich bleibt. Die Fußnoten markieren echte lexikalische Alternativen und vermeiden eine Festlegung auf symbolische Deutungen.
