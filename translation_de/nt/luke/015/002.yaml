id: LUK.15.2
reference: Luke 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: de
  text: 'Und sowohl die Pharisäer als auch die Schriftgelehrten murrten und sagten: „Dieser da nimmt Sünder auf und isst mit ihnen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: murrten
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Murren; „murrten“ bewahrt den negativen, halblauten Unterton des Verbs.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: sowohl die Pharisäer als auch die Schriftgelehrten
  rationale: „Sowohl … als auch“ gibt die korrelative Verbindung τε … καί wieder; „Schriftgelehrte“ ist im Evangelienkontext die geläufige Bezeichnung.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das gleichzeitige Partizip wird in natürlichem Deutsch als beigeordnete Handlung wiedergegeben.
- source_word: Οὗτος
  choice: Dieser da
  rationale: Die Formulierung bewahrt die demonstrative und wahrscheinlich distanzierende beziehungsweise geringschätzige Färbung, ohne sie unnötig zu verstärken.
- source_word: ἁμαρτωλοὺς
  choice: Sünder
  rationale: Die substantivierte Bezeichnung wird knapp und idiomatisch wiedergegeben und wahrt die soziale wie religiöse Kategorisierung im Vorwurf.
- source_word: προσδέχεται
  choice: nimmt … auf
  rationale: „Aufnehmen“ bezeichnet hier die bereitwillige Annahme und Gemeinschaft, bleibt aber näher an der lexikalischen Breite als das stärker deutende „willkommen heißen“.
- source_word: συνεσθίει αὐτοῖς
  choice: isst mit ihnen
  rationale: Die direkte Wendung gibt die Tischgemeinschaft klar wieder, ohne ihre soziale Bedeutung durch eine erklärende Paraphrase vorwegzunehmen.
theological_decisions:
- issue: Soziale und theologische Tragweite von Jesu Gemeinschaft mit Sündern
  choice: Der Vorwurf wird unverblümt als Aufnahme von Sündern und gemeinsames Essen wiedergegeben.
  alternative: „Dieser heißt Sünder willkommen und hält Tischgemeinschaft mit ihnen.“
  rationale: Die Übersetzung bewahrt den Anstoß, der in Jesu Annahme und Tischgemeinschaft liegt, ohne den Ausdruck durch zusätzliche theologische Deutung zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser da“ trägt den distanzierenden Ton des Demonstrativpronomens; „murrten“ ist verständlich und bewahrt den charakteristischen negativen Klang des griechischen Verbs.
