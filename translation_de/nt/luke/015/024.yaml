id: LUK.15.24
reference: Luke 15:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: de
  text: Denn dieser mein Sohn war tot und ist wieder lebendig geworden[a]; er war verloren und ist gefunden worden[b]. Und sie fingen an zu feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde wieder lebendig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurde gefunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung des Vaters ein und schließt im Deutschen natürlich an den vorausgehenden Aufruf zum Feiern an.
- source_word: οὗτος ὁ υἱός μου
  choice: dieser mein Sohn
  rationale: Bewahrt die Hervorhebung durch οὗτος und gibt zugleich die persönliche Beziehung des Vaters in würdigem, verständlichem Deutsch wieder.
- source_word: νεκρὸς ἦν
  choice: war tot
  rationale: Gibt den vergangenen Zustand direkt wieder und bewahrt die starke Bildsprache von Tod und Leben, ohne sie deutend abzuschwächen.
- source_word: ἀνέζησεν
  choice: ist wieder lebendig geworden
  rationale: Drückt das erneute Lebendigwerden idiomatisch aus; das deutsche Perfekt hebt zugleich den nun bestehenden Zustand hervor.
- source_word: ἦν ἀπολωλὼς
  choice: er war verloren
  rationale: Bewahrt das Leitmotiv von verloren und gefunden in Lukas 15 und gibt den andauernden früheren Zustand natürlich wieder.
- source_word: εὑρέθη
  choice: ist gefunden worden
  rationale: Bewahrt das Passiv und lässt den Handelnden wie im Griechischen ungenannt; das Perfekt betont das gegenwärtige Ergebnis.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: sie fingen an zu feiern
  rationale: Bewahrt den Beginn der Handlung und gibt die festliche Freude im Zusammenhang des Festmahls in modernem Deutsch wieder.
theological_decisions:
- issue: Bildhafte Bedeutung von „tot“ und „wieder lebendig geworden“
  choice: Die ausdrückliche Tod-Leben-Sprache bleibt unverändert erhalten.
  alternative: Deutende Wiedergabe wie „war für mich wie tot und ist geistlich oder gesellschaftlich wiederhergestellt“.
  rationale: Innerhalb des Gleichnisses beschreibt die Sprache die Wiederherstellung aus der Entfremdung, doch der Text formuliert bewusst zugespitzt mit Tod und Leben. Eine erklärende Paraphrase würde diese theologische und bildhafte Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser mein Sohn“ ist bewusst leicht feierlich, um die demonstrative und persönliche Hervorhebung des griechischen Ausdrucks zu bewahren. „Feiern“ ist im Festmahlkontext natürlicher als das allgemeinere „sich freuen“.
