  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. Der Satzfluss bleibt erzählerisch natürlich; „doch“ verdeutlicht den im Kontext adversativen Anschluss, ohne die Aussage auszudeuten.
