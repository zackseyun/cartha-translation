id: LUK.15.16
reference: Luke 15:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: de
  text: Und er sehnte sich danach, seinen Bauch mit den Johannisbrot­schoten zu füllen, die die Schweine fraßen[a]; doch niemand gab ihm etwas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Schoten, die die Schweine fraßen“. Gemeint sind die Schoten des Johannisbrotbaums, die auch als Tierfutter dienten.'
    reason: Die Fußnote bewahrt die wörtlichere Wiedergabe der Präposition ἀπό und erläutert den heute nicht überall geläufigen Sachbezug von κεράτια.
lexical_decisions:
- source_word: ἐπεθύμει
  choice: sehnte sich danach
  rationale: Das Imperfekt bezeichnet ein anhaltendes starkes Verlangen; „sehnte sich danach“ gibt dies in natürlichem Deutsch wieder.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: seinen Bauch … zu füllen
  rationale: Die konkrete körperliche Bildsprache bleibt erhalten. „Bauch“ entspricht κοιλία hier natürlicher und unmittelbarer als das medizinisch klingende „Magen“.
- source_word: ἀπὸ τῶν κερατίων
  choice: mit den Johannisbrot­schoten
  rationale: Bei „füllen“ wird ἀπό im Deutschen idiomatisch mit „mit“ wiedergegeben; κεράτια bezeichnet die Schoten des Johannisbrotbaums.
- source_word: ὧν ἤσθιον οἱ χοῖροι
  choice: die die Schweine fraßen
  rationale: „Schweine“ ist die geläufige moderne Entsprechung für χοῖροι. Das Imperfekt beschreibt die fortdauernde bzw. szenische Handlung; im Deutschen kann das Präteritum dies natürlich ausdrücken.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: doch niemand gab ihm etwas
  rationale: Das adversative καί wird im Zusammenhang natürlich mit „doch“ wiedergegeben. „Etwas“ ergänzt das im Griechischen unausgesprochene Objekt idiomatisch, ohne seinen Bezug näher festzulegen.
theological_decisions: []
