id: LUK.15.9
reference: Luke 15:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: de
  text: 'Und nachdem sie sie gefunden hat, ruft sie ihre Freundinnen und Nachbarn zusammen und sagt: »Freut euch mit mir, denn ich habe die Drachme[a] gefunden, die ich verloren hatte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Drachme war eine griechische Silbermünze und entsprach in vielen Zusammenhängen ungefähr dem Tageslohn eines Arbeiters.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: als sie sie gefunden hat
  rationale: Das feminine Pronomen nimmt die Drachme aus dem Kontext auf; der temporale Nebensatz gibt das vorzeitige Aoristpartizip im Deutschen natürlich wieder.
- source_word: συγκαλεῖ
  choice: ruft sie ... zusammen
  rationale: Bewahrt den zusammengesetzten Sinn des Zu-sich-Rufens und die lebendige Präsensform der Erzählung.
- source_word: φίλας καὶ γείτονας
  choice: ihre Freundinnen und Nachbarinnen
  rationale: φίλας ist ausdrücklich feminin; die koordinierten Personenbezeichnungen beziehen sich hier natürlich auf Frauen. Das Possessivpronomen ist im Deutschen idiomatisch, ohne den Sinn zu verändern.
- source_word: Συγχάρητέ μοι
  choice: Freut euch mit mir
  rationale: Direkte, natürliche Wiedergabe des pluralischen Imperativs von συγχαίρω, der zum gemeinsamen Freuen auffordert.
- source_word: ὅτι
  choice: denn
  rationale: Leitet den Grund für die Freude ein und klingt in der direkten Rede würdig und natürlich; „weil“ wäre ebenfalls möglich.
- source_word: εὗρον
  choice: ich habe ... gefunden
  rationale: Das deutsche Perfekt ist in gegenwärtiger direkter Rede die natürliche Entsprechung des griechischen Aorists.
- source_word: δραχμὴν
  choice: Drachme
  rationale: Der konkrete Münzname bleibt erhalten; eine Fußnote erläutert seinen kulturellen Wert.
- source_word: ἣν ἀπώλεσα
  choice: die ich verloren hatte
  rationale: Das Plusquamperfekt macht im Deutschen die dem Finden vorausgehende Handlung natürlich deutlich, ohne eine zusätzliche Aussage einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens von συγκαλεῖ und λέγουσα bleibt als „ruft ... zusammen und sagt“ erhalten; die direkte Rede verwendet idiomatisches deutsches Perfekt.
