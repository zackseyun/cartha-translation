id: LUK.15.21
reference: Luke 15:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: de
  text: 'Doch der Sohn sagte zu ihm: »Vater, ich habe gegen den Himmel[a] und vor dir gesündigt. Ich bin nicht mehr würdig, dein Sohn genannt zu werden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung »gegen den Himmel« gebraucht »Himmel« als ehrfürchtige Umschreibung für Gott; manche Übersetzungen geben sie daher deutend mit »gegen Gott« wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften setzen die Rede des Sohnes sinngemäß mit den Worten fort: »Mach mich zu einem deiner Tagelöhner«, in Übereinstimmung mit Vers 19. Der hier zugrunde gelegte SBLGNT-Text beendet den Satz bei »dein Sohn genannt zu werden«.'
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Doch … sagte
  rationale: δέ ist ein schwaches Bindewort. »Doch« markiert hier natürlich den Übergang zur Antwort des Sohnes und lässt zugleich einen leichten Kontrast zur vorausgehenden Handlung des Vaters erkennen.
- source_word: ὁ υἱὸς αὐτῷ
  choice: der Sohn sagte zu ihm
  rationale: Der Artikel bei υἱός wird im Erzählzusammenhang natürlich mit »der Sohn« wiedergegeben; αὐτῷ bleibt als »zu ihm« erhalten.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ wird direkt wiedergegeben; ein zusätzliches »mein« steht nicht ausdrücklich im Griechischen.
- source_word: ἥμαρτον
  choice: ich habe … gesündigt
  rationale: Das griechische Aoristverb bezeichnet die begangene Sünde; das deutsche Perfekt ist in einem persönlichen Schuldbekenntnis natürlich und bringt ihre fortdauernde Bedeutung zum Ausdruck.
- source_word: εἰς τὸν οὐρανὸν
  choice: gegen den Himmel
  rationale: Die Formulierung wird eng am griechischen Wortlaut bewahrt. »Himmel« ist hier eine ehrfürchtige Umschreibung für Gott, ohne dass diese Deutung in den Haupttext eingesetzt wird.
- source_word: καὶ ἐνώπιόν σου
  choice: und vor dir
  rationale: ἐνώπιον bedeutet wörtlich »vor, in Gegenwart von«. »Vor dir« erhält diese Beziehungs- und Gegenwartsnuance und vermeidet die interpretierende Angleichung an »gegen dich«.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Dies ist die natürliche heutige deutsche Entsprechung.
- source_word: ἄξιος
  choice: würdig
  rationale: »Würdig« bewahrt den moralischen und relationalen Sinn des Schuldbekenntnisses.
- source_word: κληθῆναι
  choice: genannt zu werden
  rationale: Der passive Infinitiv von καλέω wird formal und idiomatisch wiedergegeben.
- source_word: υἱός σου
  choice: dein Sohn
  rationale: Die Verbindung aus Prädikatsnomen und Possessivpronomen bezeichnet hier natürlich die Sohnschaft, deren Bezeichnung der Sprecher sich nicht mehr für würdig hält.
theological_decisions:
- issue: Bedeutung von »Himmel« im Schuldbekenntnis
  choice: »gegen den Himmel« als ehrfürchtige Umschreibung für eine Sünde gegen Gott verstehen, aber wörtlich übersetzen
  alternative: Deutend mit »gegen Gott« wiedergeben
  rationale: Der griechische Text nennt den »Himmel«. Die Übersetzung bewahrt diese Ausdrucksweise und erläutert ihre wahrscheinliche Bedeutung in einer Fußnote, statt sie im Haupttext theologisch aufzulösen.
- issue: Umfang der Rede des Sohnes in diesem Vers
  choice: Die Rede entsprechend dem SBLGNT-Text bei »dein Sohn genannt zu werden« beenden
  alternative: Die aus Vers 19 bekannte Fortsetzung »Mach mich zu einem deiner Tagelöhner« aufnehmen
  rationale: Der vorgelegte Ausgangstext endet an dieser Stelle. Die längere Lesart wird deshalb nicht in den Haupttext aufgenommen, sondern als Textvariante dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text, ohne unnatürlich zu wirken. »Gegen den Himmel und vor dir« erhält bewusst die unterschiedliche Präpositionierung und damit die Spannung des Ausgangstextes.
