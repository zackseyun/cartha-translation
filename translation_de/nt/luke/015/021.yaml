  source_fidelity: 'Der deutsche Text gibt den SBLGNT-Wortlaut vollständig und präzise wieder: δέ wird angemessen als leichter erzählerischer Kontrast mit »Doch« aufgenommen, »der Sohn sagte zu ihm« erhält die Referenzstruktur, und die Bekenntnisformel bleibt in ihren unterschiedlichen Beziehungen erhalten: »gegen den Himmel und vor dir«. Die Auslassung der längeren Fortsetzung entspricht dem vorgegebenen SBLGNT-Text.'
  naturalness: Modernes, würdiges Standarddeutsch. »Ich habe … gesündigt« und »Ich bin nicht mehr würdig, dein Sohn genannt zu werden« sind idiomatisch, klar und dem erzählerischen Register angemessen. Die Stellung von »gesündigt« am Ende bündelt die beiden Präpositionalgruppen natürlich.
  terminology: »Himmel« bewahrt die griechische ehrfürchtige Umschreibung, ohne sie im Haupttext unzulässig zu »Gott« aufzulösen. »Würdig« und »genannt zu werden« entsprechen dem Sinn und Register von ἄξιος und κληθῆναι. Die Fußnoten erläutern sowohl die idiomatische Umschreibung als auch die textkritische längere Lesart sachgerecht.
