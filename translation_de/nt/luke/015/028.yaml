  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: de
  text: Doch er wurde zornig und wollte nicht hineingehen.[a] Da kam sein Vater heraus und redete ihm immer wieder gut zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weigerte sich hineinzugehen«; wörtlicher: »wollte nicht hineingehen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »redete … gut zu« wiedergegebene Verb kann auch »bat ihn eindringlich« oder »drang auf ihn ein« bedeuten. Die griechische Zeitform kann auf einen andauernden oder wiederholten Appell hinweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: wurde zornig
  rationale: Der Aorist von ὀργίζομαι kann hier den Eintritt des Zorns bezeichnen. »Wurde zornig« gibt diesen ingessiven Sinn wieder, ohne die stärkere Bedeutung »geriet außer sich« einzutragen.
- source_word: δὲ
  choice: Doch
  rationale: Das erste δέ markiert den Gegensatz zwischen dem Fest und der Reaktion des älteren Sohnes. »Doch« drückt diesen milden Kontrast im Deutschen natürlich aus.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: wollte nicht hineingehen
  rationale: θέλω mit Infinitiv bezeichnet den Willen beziehungsweise die Bereitschaft. Die Formulierung bewahrt den volitionalen Sinn, ohne ihn zu einer ausdrücklich erklärten Weigerung zu verstärken.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Da … sein Vater
  rationale: Das zweite δέ führt die Reaktion des Vaters in der Erzählfolge ein. »Da« stellt den Zusammenhang idiomatisch her, ohne einen stärkeren Gegensatz zu behaupten.
- source_word: ἐξελθὼν
  choice: kam … heraus
  rationale: Das Partizip von ἐξέρχομαι bezeichnet die Bewegung aus dem Haus hinaus. »Kam heraus« ist in dieser Szene natürlich und anschaulich.
- source_word: παρεκάλει
  choice: redete ihm immer wieder gut zu
  rationale: παρακαλέω bezeichnet hier einen eindringlichen, persönlichen Appell. Das Imperfekt lässt einen fortdauernden oder wiederholten Zuspruch erkennen; »immer wieder« macht diesen Aspekt verständlich, ohne den Inhalt der Bitte zu ergänzen.
- source_word: αὐτόν
  choice: ihm
  rationale: Das Pronomen bezieht sich eindeutig auf den älteren Sohn; die Dativform wird durch die deutsche Wendung »jemandem gut zureden« verlangt.
theological_decisions:
- issue: Ton des väterlichen Appells im Gleichnis
  choice: »redete ihm immer wieder gut zu«
  alternative: »bat ihn eindringlich« oder »drang in ihn«
  rationale: Die Übersetzung bewahrt die zugewandte und beharrliche Initiative des Vaters, ohne daraus eine weitergehende dogmatische Aussage abzuleiten. Zugleich bleibt offen, ob παρακαλέω stärker als Bitte, Ermunterung oder dringendes Zureden verstanden wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Gut zureden« wahrt die persönliche Wärme der Szene; »immer wieder« bildet den möglichen durativen beziehungsweise iterativen Wert des Imperfekts ab. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
