  text: εἶπεν δὲ πρὸς αὐτοὺς τὴν παραβολὴν ταύτην λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/003.yaml
  text: 'So he told them this parable[a], saying:'
translation:
  language: de
  text: 'Da erzählte er ihnen dieses Gleichnis:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: erzählte
  rationale: Der Aorist von λέγω bezeichnet hier den einleitenden Sprechakt. Mit »Gleichnis« als Objekt ist »erzählte« im Deutschen idiomatisch und gibt den erzählerischen Charakter der folgenden Rede wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ ist ein milder Anschlussmarker. »Da« verbindet Jesu Antwort natürlich mit dem vorausgehenden Murren, ohne einen stärkeren Gegensatz einzutragen.
- source_word: πρὸς αὐτοὺς
  choice: ihnen
  rationale: πρός mit Akkusativ bezeichnet die Adressaten; der deutsche Dativ bei »jemandem etwas erzählen« gibt dies natürlich wieder.
- source_word: τὴν παραβολὴν ταύτην
  choice: dieses Gleichnis
  rationale: παραβολή bezeichnet im synoptischen Kontext ein Gleichnis; ταύτην wird durch »dieses« wiedergegeben.
- source_word: λέγων
  choice: ':'
  rationale: Das Partizip führt den Inhalt der anschließenden Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion; ein zusätzliches »und sagte« wäre unnötig schwerfällig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die griechische Einleitungsformel wurde idiomatisch verdichtet, ohne ihren Aussagegehalt zu verändern.
