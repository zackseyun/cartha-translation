source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Dein Bruder ist gekommen, und dein Vater hat das Mastkalb geschlachtet, weil er ihn gesund und wohlbehalten[a] zurückbekommen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gesund“. Das griechische Partizip ὑγιαίνοντα kann „gesund“ oder im Zusammenhang umfassender „gesund und wohlbehalten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: ist gekommen
  rationale: 'Das Verb bezeichnet hier die erfolgte Ankunft mit gegenwärtigem Ergebnis: Der Bruder ist nun da.'
- source_word: ἔθυσεν
  choice: hat … geschlachtet
  rationale: Im Zusammenhang des Festmahls bezeichnet θύω das Schlachten des Tieres; „geopfert“ würde unnötig einen kultischen Vorgang nahelegen.
- source_word: μόσχον τὸν σιτευτόν
  choice: das Mastkalb
  rationale: „Mastkalb“ ist die natürliche deutsche Bezeichnung für ein eigens gemästetes Kalb, das für einen besonderen Anlass vorgesehen ist.
- source_word: ὑγιαίνοντα
  choice: gesund und wohlbehalten
  rationale: Das Partizip bedeutet zunächst „gesund“ beziehungsweise „unversehrt“; die geläufige Wendung gibt im Zusammenhang der Heimkehr zugleich das Wohlergehen und die unversehrte Rückkehr wieder.
- source_word: ἀπέλαβεν
  choice: zurückbekommen hat
  rationale: ἀπολαμβάνω trägt hier den Gedanken des Wiedererlangens beziehungsweise Zurückerhaltens; die Formulierung ist im Deutschen natürlich und bewahrt diesen restaurativen Sinn.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'Er sagte zu ihm:'
  rationale: δέ ist hier nur leicht weiterführend und verlangt kein ausdrückliches „aber“. ὅτι leitet die direkte Rede ein, die im Deutschen natürlich durch Doppelpunkt und Anführungszeichen wiedergegeben wird.
