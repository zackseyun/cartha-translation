  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: de
  text: Und bringt das gemästete Kalb her, schlachtet es und lasst uns essen und feiern!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρετε
  choice: holt
  rationale: Der Imperativ Plural bezeichnet das Herbeibringen. Im Deutschen ist »holt« in diesem häuslichen Kontext natürlicher als das steifere »bringt«.
- source_word: μόσχον τὸν σιτευτόν
  choice: das gemästete Kalb
  rationale: μόσχος bezeichnet ein Kalb beziehungsweise junges Rind; σιτευτός ein eigens gefüttertes und gemästetes Tier. Die gewählte Wendung ist idiomatisch und bewahrt den festlichen Kontext.
- source_word: θύσατε
  choice: schlachtet es
  rationale: θύω kann das Schlachten eines Tieres, auch als Opfer, bezeichnen. Hier steht die Vorbereitung des Festmahls im Vordergrund; »schlachtet es« gibt den unmittelbaren Sinn wieder, ohne mögliche kultische Bezüge zum alleinigen Sinn zu machen.
- source_word: φαγόντες
  choice: lasst uns essen
  rationale: Das Aoristpartizip ist mit dem folgenden hortativen Konjunktiv verbunden. Die koordinierte Wiedergabe als Aufforderung entspricht natürlichem Deutsch und wahrt den Handlungsablauf.
- source_word: εὐφρανθῶμεν
  choice: feiern
  rationale: Der hortative Konjunktiv bezeichnet gemeinsames Frohsein beziehungsweise Feiern. »feiern« passt konkret zum Festmahl und ist in modernem Deutsch natürlich.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die wiederholte Konjunktion verbindet die Anweisungen mit der gemeinsamen Aufforderung und erhält deren fortschreitenden Rhythmus.
theological_decisions:
- issue: Möglicher Opferbeiklang von θύσατε
  choice: Im Haupttext als »schlachtet es« wiedergegeben; die mögliche Opferbedeutung wird in einer Fußnote bewahrt.
  alternative: »opfert es«
  rationale: Der Erzählzusammenhang legt die Zubereitung eines Tieres für das gemeinsame Festmahl nahe. »Opfert es« würde einen kultischen Vorgang ausdrücklich behaupten, den der Kontext nicht verlangt; die Fußnote erhält jedoch die semantische und mögliche theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, lebendigem Erzählton. Die Satzfolge bleibt nah an der kumulativen Struktur des Griechischen; das Ausrufezeichen verdeutlicht den auffordernden, freudigen Ton, ohne den Inhalt zu erweitern.
