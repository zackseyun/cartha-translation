  source_fidelity: 'Die Grundstruktur der rhetorischen Frage ist zutreffend wiedergegeben. Eine sichere Präzisierung ist jedoch angezeigt: Das aoristische ἀπολέσας bezeichnet den Verlust als der anschließenden Suche vorausgehend; „verloren hat“ bildet dies besser ab als das präsentische „verliert“. τὸ ἀπολωλός bezieht sich eindeutig auf das Schaf und kann im Deutschen ausdrücklich so bezeichnet werden.'
  naturalness: „Wer von euch“ ist im modernen Standarddeutsch für diese rhetorische Frage idiomatischer als „Welcher Mensch unter euch“. „Dem verlorenen Schaf nachgeht“ ist klarer und natürlicher als das ohne Kontext potenziell personenbezogene „dem verlorenen nachgeht“.
  terminology: „Schaf“ macht den Bezug des substantivierten neutralen Partizips deutlich, ohne eine theologische Deutung hinzuzufügen. „Im offenen Gelände“ gibt ἐν τῇ ἐρήμῳ im Hirtenkontext gut wieder; die bewusst weite Bedeutungsoption wird in der Fußnote bewahrt.
