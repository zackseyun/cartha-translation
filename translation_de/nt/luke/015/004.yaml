source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: de
  text: Wer von euch, der hundert Schafe hat und eines von ihnen verloren hat, lässt nicht die neunundneunzig im offenen Gelände[a] zurück und geht dem verlorenen Schaf nach, bis er es findet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Wüste“. Das griechische Wort kann offenes Land, Weideland oder einen menschenleeren Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Welcher Mensch unter euch
  rationale: Die Formulierung gibt die rhetorische Frage und den repräsentativen Singular unmittelbar wieder. „Mensch“ entspricht ἄνθρωπος, ohne den beispielhaften Charakter auf Männer zu beschränken.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: der hundert Schafe hat
  rationale: Ein deutscher Relativsatz gibt das griechische Präsenspartizip natürlich und verständlich wieder.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: und eines von ihnen verliert
  rationale: Im Zusammenhang bezeichnet ἀπόλλυμι das Verlorengehen eines Schafes, nicht dessen Vernichtung. Die präsentische Wiedergabe ist in einer allgemeinen Beispielhandlung idiomatisch.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: lässt nicht die neunundneunzig … zurück
  rationale: Die Verneinung bewahrt die Form der rhetorischen Frage, die eine zustimmende Antwort erwartet.
- source_word: ἐν τῇ ἐρήμῳ
  choice: im offenen Land
  rationale: ἔρημος kann unbewohntes, unbebautes oder offenes Land bezeichnen. Im Hirtenkontext ist „offenes Land“ natürlich, während die mögliche Wiedergabe „Wüste“ in der Fußnote erhalten bleibt.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλός
  choice: geht dem verlorenen nach
  rationale: Die Wendung drückt die zielgerichtete Suche nach dem Schaf aus. Das substantivierte Adjektiv wahrt die knappe Form des griechischen substantivierten Partizips.
- source_word: ἕως εὕρῃ αὐτό
  choice: bis er es findet
  rationale: Die Übersetzung gibt die zeitliche Grenze der Suche klar wieder; „es“ bezieht sich eindeutig auf das verlorene Schaf.
theological_decisions:
- issue: Repräsentativer Singular in der Gleichnisfrage
  choice: „Welcher Mensch unter euch“
  alternative: „Welcher Mann von euch“
  rationale: Das griechische ἄνθρωπος steht im maskulinen Singular, bezeichnet hier aber einen beispielhaft vorgestellten Menschen. „Mensch“ erhält den Singular und gibt den allgemeinen Geltungsbereich wieder, ohne eine ausschließlich männliche Aussage einzutragen.
- issue: Zustand des verlorenen Schafes
  choice: „dem verlorenen“
  alternative: „dem verlorengegangenen Schaf“
  rationale: Die knappe substantivische Form entspricht τὸ ἀπολωλός und lässt den im Kontext eindeutigen Bezug auf das Schaf bestehen; sie fügt keine weitergehende geistliche Deutung ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, mündlich gut erfassbarem Satzbau. Die rhetorische Frage und ihre erwartete Zustimmung bleiben erhalten.
