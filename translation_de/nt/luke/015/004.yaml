    rationale: „… eines von ihnen verliert“ kann in einer allgemeinen Beispielhandlung funktionieren, verdeckt aber, dass ἀπολέσας als Aoristpartizip den bereits eingetretenen Verlust vor der Handlung des Zurücklassens und Suchens darstellt. „… eines von ihnen verloren hat“ ist genauer und weiterhin idiomatisch.
  - severity: low
    issue: „dem verlorenen“ ist im Deutschen unnötig mehrdeutig und stilistisch weniger klar.
    rationale: Obwohl der Kontext das Schaf nahelegt, kann die Form auch auf einen verlorenen Menschen bezogen werden. „dem verlorenen Schaf“ stellt den vom griechischen Neutrum und Kontext gegebenen Bezug natürlich klar.
