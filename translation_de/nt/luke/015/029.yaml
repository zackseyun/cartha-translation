source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: de
  text: 'Er aber antwortete seinem Vater: »Sieh doch, so viele Jahre diene ich dir schon, und niemals habe ich eines deiner Gebote übertreten. Doch mir hast du niemals auch nur eine junge Ziege gegeben, damit ich mit meinen Freunden feiern könnte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: Er aber antwortete seinem Vater
  rationale: Die idiomatische Verbindung ἀποκριθεὶς εἶπεν wird im Deutschen natürlich mit „antwortete“ wiedergegeben; der Dativ bewahrt den Adressaten.
- source_word: Ἰδοὺ
  choice: Sieh doch
  rationale: Der aufmerksamkeitslenkende und nachdrückliche Gesprächsmarker wird modern und mit dem gereizten Ton der Rede wiedergegeben.
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: so viele Jahre diene ich dir schon
  rationale: Das Präsens bezeichnet einen bis zur Gegenwart andauernden Dienst. δουλεύω kann stärkere Unterordnung bis hin zum Sklavendienst ausdrücken; „diene“ bleibt im Deutschen natürlich, während der klagende Kontext die Härte erkennen lässt.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: niemals habe ich eines deiner Gebote übertreten
  rationale: παρέρχομαι bezeichnet zusammen mit ἐντολή das Überschreiten bzw. Verletzen eines Gebots; „übertreten“ wahrt Bild und Sinn.
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: mir hast du niemals auch nur einen jungen Ziegenbock gegeben
  rationale: Die Voranstellung von ἐμοὶ wird durch „mir“ am Satzanfang betont. ἔριφος bezeichnet einen jungen Ziegenbock; „auch nur“ macht die im Vorwurf liegende Geringfügigkeit deutlich.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: damit ich mit meinen Freunden feiern könnte
  rationale: Der ἵνα-Satz drückt den beabsichtigten, aber nicht verwirklichten Zweck aus. εὐφραίνω hat hier im Festkontext den Sinn „feiern/sich vergnügen“.
theological_decisions:
- issue: Stärke von δουλεύω in der Selbstbeschreibung des älteren Sohnes
  choice: diene ich dir
  alternative: schufte ich für dich / leiste ich dir Sklavendienst
  rationale: Das Wort gehört zur Wortfamilie des Sklavendienstes und lässt die verbitterte Selbstwahrnehmung des Sohnes anklingen. Eine ausdrückliche Sklaverei-Aussage wäre im modernen Deutschen jedoch stärker und eindeutiger als der Kontext verlangt; „dienen“ erhält die lexikalische Offenheit, während Wortstellung und Redezusammenhang den Vorwurf tragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache in direkter Rede. „Sieh doch“ und „auch nur“ bewahren den nachdrücklichen, bitteren Ton, ohne umgangssprachlich zu wirken. Keine Fußnote nötig; die Bedeutungsbreite von δουλεύω wird im Haupttext bewusst nicht einseitig festgelegt.
