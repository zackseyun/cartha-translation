source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: de
  text: Nachdem er aber alles ausgegeben hatte, kam über jenes ganze Land eine schwere Hungersnot, und er selbst begann Mangel zu leiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er begann, in Not zu geraten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: Nachdem er ... alles ausgegeben hatte
  rationale: Der Genitivus absolutus mit Aoristpartizip wird als vorzeitiger Temporalsatz wiedergegeben. »Ausgegeben« entspricht δαπανάω, ohne die wertende Bedeutung »verschwendet« aus dem weiteren Kontext in diesen Vers einzutragen.
- source_word: δέ
  choice: aber
  rationale: δέ kennzeichnet hier die erzählerische Wende vom Aufbrauchen der Mittel zur einsetzenden Not.
- source_word: ἐγένετο
  choice: kam
  rationale: Mit λιμός bezeichnet γίνομαι idiomatisch das Eintreten der Hungersnot; »kam« ist im Deutschen natürlich und prägnant.
- source_word: λιμὸς ἰσχυρά
  choice: eine schwere Hungersnot
  rationale: ἰσχυρά verstärkt λιμός. »Schwere Hungersnot« ist eine idiomatische und sachlich genaue deutsche Wiedergabe.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: über jenes ganze Land
  rationale: κατά mit Akkusativ kann die räumliche Ausdehnung bezeichnen. »Über ... ganze Land« bringt zum Ausdruck, dass die Hungersnot das betreffende Gebiet erfasste; χώρα kann je nach Kontext auch »Gebiet« oder »Region« bedeuten.
- source_word: καὶ αὐτὸς
  choice: und auch er
  rationale: 'Das ausdrückliche αὐτός erhält durch »auch« seine kontrastierende Betonung: Nicht nur das Land war betroffen, sondern nun geriet er selbst in Not.'
- source_word: ἤρξατο ὑστερεῖσθαι
  choice: begann Not zu leiden
  rationale: Die Verbindung aus ἤρξατο und Infinitiv bezeichnet den Beginn eines Zustands; ὑστερεῖσθαι meint hier Mangel beziehungsweise Bedürftigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. »Jenes ganze Land« bewahrt die räumliche Reichweite von κατά, während die Fußnote die konkrete Mangelsituation als mögliche Wiedergabe von ὑστερεῖσθαι nennt.
