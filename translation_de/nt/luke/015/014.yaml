  rationale: Die Revision ersetzt die additive Nuance von »auch« durch die im Deutschen passende Hervorhebung »er selbst« und präzisiert die Fußnote als semantisch offene, natürliche Alternative zu ὑστερεῖσθαι. Der übrige Satz bleibt in Bedeutung und Erzählregister erhalten.
