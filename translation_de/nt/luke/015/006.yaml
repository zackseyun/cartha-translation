source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: de
  text: 'Und wenn er ins Haus kommt[a], ruft er seine Freunde und Nachbarn zusammen und sagt zu ihnen: »Freut euch mit mir[b], denn ich habe mein Schaf gefunden, das verloren war[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »nach Hause kommt«. Wörtlich steht im Griechischen: »ins Haus kommt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Feiert mit mir.« Das griechische Verb bezeichnet die gemeinsame Freude mit jemandem.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder knapper: »mein verlorenes Schaf«. Wörtlich etwa: »mein Schaf, das verloren war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: wenn er ins Haus kommt
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. »Ins Haus« wahrt die konkrete griechische Formulierung; das idiomatischere »nach Hause« bleibt als Alternative in der Fußnote erhalten.
- source_word: συγκαλεῖ
  choice: ruft ... zusammen
  rationale: Die Wiedergabe bildet die Bedeutung des gemeinsamen Einberufens direkt ab, ohne den im festlichen Zusammenhang zu strengen Klang von »zusammenrufen« oder »versammeln lassen«.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: seine Freunde und Nachbarn
  rationale: Direkte und im Deutschen natürliche Wiedergabe der beiden Personengruppen; das Possessivpronomen ergibt sich idiomatisch aus dem Bezug auf den Handelnden.
- source_word: λέγων αὐτοῖς
  choice: und sagt zu ihnen
  rationale: Die finite Form ist im Deutschen flüssiger als eine Nachbildung mit »indem er zu ihnen sagt« und bewahrt den engen Anschluss an das Zusammenrufen.
- source_word: Συγχάρητέ μοι
  choice: Freut euch mit mir
  rationale: Der Imperativ von συγχαίρω fordert dazu auf, die Freude gemeinsam mit dem Sprecher zu teilen. Die direkte Formulierung bewahrt dieses Motiv besser als eine freiere Umschreibung.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt hier den Grund für die Aufforderung an. »Denn« klingt in direkter deutscher Rede natürlich und gibt den begründenden Zusammenhang klar wieder.
- source_word: εὗρον
  choice: ich habe ... gefunden
  rationale: Das deutsche Perfekt bezeichnet in der direkten Rede natürlich die abgeschlossene Suche mit ihrem gegenwärtigen Ergebnis.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: mein Schaf ..., das verloren war
  rationale: Die Relativkonstruktion bildet die griechische Folge »mein Schaf, das verlorene« transparent ab und bewahrt die Zustandsbedeutung des Perfektpartizips, ohne sie interpretierend auszubauen.
theological_decisions:
- issue: Bildsprache vom Wiederfinden des Verlorenen
  choice: Das konkrete Bild »mein Schaf ..., das verloren war« bleibt stehen.
  alternative: »mein verlorenes Schaf« oder eine ausdrückliche Deutung auf Sünder und Rettung
  rationale: Der Vers erzählt weiterhin auf der Bildebene des Gleichnisses. Seine theologische Anwendung soll nicht vorweggenommen werden; zugleich bleibt die hervorgehobene Beschreibung des zuvor verlorenen Schafes erkennbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Ablauf, wird aber durch finite deutsche Formen natürlich gestaltet. Die direkte Rede erhält einen lebendigen, nicht überhöhten Klang.
