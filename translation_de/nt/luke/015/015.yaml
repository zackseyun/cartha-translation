id: LUK.15.15
reference: Luke 15:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: de
  text: Da ging er hin und hängte sich an einen Bürger jenes Landes[a]. Der schickte ihn auf seine Felder, damit er Schweine hütete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schloss sich einem Bürger jenes Landes an“; das griechische Verb bezeichnet ein enges Sich-Anschließen und kann hier auch Abhängigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: ging er hin
  rationale: Das adverbiale Aoristpartizip bezeichnet die dem Hauptgeschehen vorausgehende Bewegung; die Formulierung ist natürlich und bewahrt die Abfolge.
- source_word: ἐκολλήθη
  choice: hängte sich an
  rationale: κολλάομαι bezeichnet ein enges Sich-Anschließen und kann hier Abhängigkeit anklingen lassen. „Sich an jemanden hängen“ gibt diese Bildlichkeit und soziale Bedürftigkeit im Deutschen gut wieder.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: an einen Bürger
  rationale: πολίτης bezeichnet einen Bürger beziehungsweise Angehörigen des betreffenden Gemeinwesens; „Bürger“ ist die direkte und im Kontext verständliche Wiedergabe.
- source_word: τῆς χώρας ἐκείνης
  choice: jenes Landes
  rationale: χώρα kann Land, Gegend oder Gebiet bedeuten. „Jenes Land“ stellt den Bezug zum zuvor erwähnten fernen Land her, ohne die geografische Bedeutung unnötig einzuengen.
- source_word: ἔπεμψεν αὐτόν
  choice: Der schickte ihn
  rationale: Das Demonstrativpronomen „Der“ macht im Deutschen auf natürliche Weise deutlich, dass der eben genannte Bürger das Subjekt ist.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: auf seine Felder
  rationale: ἀγρός bezeichnet Feld oder landwirtschaftlich genutztes Gelände. Im Deutschen ist „auf seine Felder schicken“ idiomatischer als „in seine Felder“ und bewahrt den Plural.
- source_word: βόσκειν χοίρους
  choice: damit er Schweine hütete
  rationale: βόσκω kann füttern, weiden lassen oder hüten bedeuten. „Schweine hüten“ ist im deutschen Erzählkontext natürlich und umfasst die Tätigkeit, ohne sie auf bloßes Füttern zu reduzieren.
