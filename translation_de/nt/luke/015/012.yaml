reference: Luke 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: de
  text: 'Und der Jüngere von ihnen sagte zu seinem Vater: »Vater, gib mir den Anteil am Vermögen, der mir zusteht.« Darauf teilte er seinen Besitz[a] unter ihnen auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch βίον, wörtlich »Leben«; gemeint sind hier der Besitz des Vaters beziehungsweise die Mittel, von denen er lebte.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: der jüngere von ihnen
  rationale: Der substantivisch gebrauchte Komparativ bezeichnet wörtlich den Jüngeren; dass es sich um einen Sohn handelt, ergibt sich aus dem Zusammenhang, wird hier aber nicht eigens ergänzt.
- source_word: δός μοι
  choice: gib mir
  rationale: Die knappe Imperativform wird direkt und idiomatisch wiedergegeben.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: den Anteil …, der mir zusteht
  rationale: Die Formulierung bezeichnet den Anteil, der jemandem zufällt beziehungsweise zukommt; »zusteht« ist in diesem familiären Vermögenskontext natürlich.
- source_word: οὐσία
  choice: Vermögen
  rationale: οὐσία bezeichnet hier den Besitz beziehungsweise die Vermögenswerte des Vaters. »Vermögen« passt zum Kontext, ohne bereits eine rechtlich abgeschlossene Erbschaft vorauszusetzen.
- source_word: διεῖλεν
  choice: teilte … auf
  rationale: Das Verb bezeichnet das Teilen oder Verteilen und wird im Deutschen idiomatisch mit »aufteilen« wiedergegeben.
- source_word: αὐτοῖς
  choice: unter ihnen
  rationale: 'Der Dativ Plural bezeichnet die Empfänger der Aufteilung. »Unter ihnen« lässt offen, was der Kontext klärt: dass beide Söhne gemeint sind.'
- source_word: βίον
  choice: seinen Lebensunterhalt
  rationale: βίος kann die Mittel bezeichnen, von denen jemand lebt. Die Wiedergabe bewahrt stärker als ein bloßes »Vermögen« die konkrete Vorstellung der Lebensgrundlage des Vaters.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Rede bleibt knapp und bestimmt. »Der Vater« wird im zweiten Satz zur eindeutigen Subjektbezeichnung verwendet, da ein bloßes Pronomen nach der direkten Rede im Deutschen weniger klar wäre.
