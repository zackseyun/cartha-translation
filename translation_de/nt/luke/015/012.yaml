  verdict: revise
  source_fidelity: 'Die wesentlichen griechischen Ausdrücke sind zutreffend erfasst: νεώτερος bleibt ohne ergänztes »Sohn«, τὸ ἐπιβάλλον μέρος wird angemessen als zustehender Anteil wiedergegeben, und αὐτοῖς bezeichnet die mehreren Empfänger. βίον meint in diesem Kontext jedoch vorrangig den Besitz bzw. die wirtschaftlichen Lebensmittel des Vaters; »Lebensunterhalt« klingt im Deutschen zu sehr nach einem fortlaufenden Einkommen oder einer Unterhaltsleistung.'
  naturalness: »Seinen Lebensunterhalt unter ihnen aufteilen« ist zwar verständlich, aber in modernem Standarddeutsch unidiomatisch. »Seinen Besitz unter ihnen aufteilen« ist natürlich und lässt sich durch eine Fußnote für die weitergehende Bedeutung von βίον präzisieren.
  terminology: »Vermögen« für οὐσία und »Besitz« für βίον unterscheiden die beiden Begriffe sinnvoll, ohne eine technische erbrechtliche Aussage einzutragen. Die Anrede »Vater« und der sachlich-würdevolle Erzählton sind passend.
