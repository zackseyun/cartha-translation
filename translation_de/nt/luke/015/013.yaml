  source_fidelity: Die Übersetzung gibt die zeitliche Angabe μετ’ οὐ πολλὰς ἡμέρας idiomatisch wieder. »brachte ... alles zusammen« entspricht συναγαγὼν πάντα, »zog in ein fernes Land« gibt ἀπεδήμησεν εἰς χώραν μακράν angemessen wieder, und »verschleuderte sein Vermögen« trifft die kontextuelle Bedeutung von διεσκόρπισεν τὴν οὐσίαν αὐτοῦ. »lebte verschwenderisch« wahrt für ζῶν ἀσώτως die im Vers offene, nicht auf bestimmte Verfehlungen eingeengte Kennzeichnung der Lebensweise.
  naturalness: Flüssiges modernes Standarddeutsch mit einem passenden erzählerischen Ton. Die Aufteilung in zwei Sätze ist natürlich und beeinträchtigt weder den Zusammenhang noch die Abfolge der griechischen Handlung.
  terminology: »Vermögen« ist für οὐσία in diesem Kontext treffend und ausreichend weit. »Verschleuderte« ist für die bildhafte Verwendung von διεσκόρπισεν besonders passend. Die Fußnote erläutert die semantische Breite von ἀσώτως, ohne konkrete Sünden in den Text einzutragen.
