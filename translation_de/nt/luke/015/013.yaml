id: LUK.15.13
reference: Luke 15:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: de
  text: Wenige Tage später brachte der jüngere Sohn alles zusammen und zog in ein fernes Land. Dort verschleuderte er sein Vermögen und lebte verschwenderisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »haltlos« oder »verantwortungslos«. Das griechische Wort bezeichnet hier eine verschwenderische, ungeordnete Lebensweise, ohne bestimmte Verfehlungen zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Wenige Tage später
  rationale: Gibt die wörtlich verneinte Zeitangabe »nach nicht vielen Tagen« in natürlichem, modernem Deutsch wieder, ohne ihren zeitlichen Umfang zu verändern.
- source_word: συναγαγὼν πάντα
  choice: brachte ... alles zusammen
  rationale: Bewahrt sowohl die umfassende Bedeutung von πάντα als auch den sammelnden Sinn von συνάγω. Die Formulierung lässt offen, ob der Sohn seinen Besitz zusammentrug oder teilweise zu Geld machte.
- source_word: ὁ νεώτερος υἱός
  choice: der jüngere Sohn
  rationale: Natürliche und genaue Wiedergabe des Komparativs im Zusammenhang der beiden Söhne.
- source_word: ἀπεδήμησεν
  choice: zog
  rationale: Bezeichnet hier das Fortgehen an einen entfernten Ort; zusammen mit »in ein fernes Land« ist »zog« knapp und idiomatisch.
- source_word: εἰς χώραν μακράν
  choice: in ein fernes Land
  rationale: Entspricht der räumlichen Distanz von μακράν und gibt χώρα im Erzählzusammenhang natürlich als »Land« wieder.
- source_word: διεσκόρπισεν
  choice: verschleuderte
  rationale: Überträgt die bildliche Bedeutung des eigentlich mit »zerstreuen« verbundenen Verbs für den verschwenderischen Verbrauch von Besitz.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: sein Vermögen
  rationale: οὐσία bezeichnet hier den ihm gehörenden Besitz beziehungsweise seine materiellen Mittel; »Vermögen« ist breit genug und im Deutschen idiomatisch.
- source_word: ζῶν ἀσώτως
  choice: lebte verschwenderisch
  rationale: Gibt die Art seines Lebens und damit zugleich die Weise des Verschleuderns wieder, ohne bestimmte, im Vers nicht ausdrücklich genannte Verfehlungen hinzuzufügen.
theological_decisions:
- issue: Inhalt von ἀσώτως
  choice: verschwenderisch
  alternative: zügellos / ausschweifend
  rationale: Der Vers kennzeichnet die Lebensweise als verantwortungslos und verschwenderisch, nennt aber keine bestimmten sexuellen oder sonstigen Einzelsünden. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die beiden Hauptsätze vermeiden eine überladene Satzstruktur; die Formulierungen bleiben nah an der Reihenfolge und den Bedeutungsnuancen des griechischen Textes.
