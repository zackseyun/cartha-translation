  text: καὶ προσκαλεσάμενος ἕνα τῶν παίδων ἐπυνθάνετο τί ⸀ἂν εἴη ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: de
  text: Da rief er einen der Diener zu sich und fragte ihn, was das alles zu bedeuten habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Das Aoristpartizip von προσκαλέομαι bezeichnet, dass er den Diener zunächst zu sich rief; die deutsche Verbfolge gibt diesen Ablauf natürlich wieder.
- source_word: παίδων
  choice: Diener
  rationale: παῖς kann »Kind« oder »Diener« bedeuten. Im Zusammenhang des Haushalts und der Auskunft über das Fest ist »Diener« die naheliegende Bedeutung.
- source_word: ἐπυνθάνετο
  choice: fragte
  rationale: Das Imperfekt von πυνθάνομαι bezeichnet ein Erkundigen oder Nachfragen. »fragte« ist hier idiomatisch; ein ausdrücklich fortdauernder Vorgang steht nicht im Vordergrund.
- source_word: τί ἂν εἴη ταῦτα
  choice: was das alles zu bedeuten habe
  rationale: Die indirekte Frage erkundigt sich angesichts von Musik und Tanz nach der Bedeutung des Geschehens. Der Konjunktiv »habe« wahrt im Deutschen die indirekte Rede; »das alles« gibt den Plural ταῦτα natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die partizipiale Konstruktion wurde in eine natürliche deutsche Verbfolge aufgelöst.
