  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: de
  text: Ich bin nicht mehr würdig, dein Sohn genannt zu werden. Mach mich wie einen deiner Lohnarbeiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet einen gegen Lohn beschäftigten Arbeiter. Es unterscheidet sich damit von der Bezeichnung für einen Haussklaven; „wie“ gibt die ausdrücklich vergleichende Formulierung des Griechischen wieder.
    reason: Lexikalische Erläuterung zu μίσθιος und Sicherung der Vergleichsbedeutung von ὡς.
lexical_decisions:
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die geläufige deutsche Zeitverneinung bezeichnet den Verlust eines früheren Zustands.
- source_word: ἄξιος
  choice: würdig
  rationale: Bewahrt den moralischen und sozialen Sinn, einer Stellung nicht mehr zu entsprechen bzw. sie nicht zu verdienen.
- source_word: κληθῆναι
  choice: genannt zu werden
  rationale: Gibt den passiven Infinitiv direkt wieder und lässt sowohl Benennung als auch Anerkennung in dieser Stellung anklingen.
- source_word: υἱός
  choice: Sohn
  rationale: Das griechische Wort ist hier ausdrücklich männlich und bezeichnet die konkrete familiäre Beziehung in der Erzählung.
- source_word: ποίησόν με
  choice: Mach mich zu
  rationale: Die idiomatische deutsche Konstruktion gibt die Aufforderung wieder, ihm eine andere Stellung zuzuweisen.
- source_word: ὡς ἕνα τῶν μισθίων σου
  choice: zu einem deiner Tagelöhner
  rationale: Im Deutschen verlangt „machen“ hier idiomatisch „zu“. „Tagelöhner“ bezeichnet einen gegen Lohn beschäftigten Arbeiter und unterscheidet ihn von einem unfreien Haussklaven; die Vergleichspartikel ὡς wird in der natürlichen Zielkonstruktion nicht separat abgebildet.
theological_decisions:
- issue: Statussprache im Bekenntnis des Sohnes
  choice: „würdig“ und „Sohn“ bleiben ausdrücklich erhalten.
  alternative: „Ich verdiene es nicht mehr, dein Kind zu heißen.“
  rationale: Die gewählte Fassung bewahrt die familiäre Beziehung sowie die soziale und ehrbezogene Spannung des griechischen Textes, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
- issue: Stellung des μίσθιος im Haushalt
  choice: „Tagelöhner“ als bezahlter Arbeiter
  alternative: „Knecht“ oder „Diener“
  rationale: Der Ausdruck bezeichnet einen Lohnarbeiter, nicht ausdrücklich einen Haussklaven. So bleibt der vom Sohn angestrebte Statuswechsel erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tagelöhner“ ist prägnant und sozialgeschichtlich verständlich; die Fußnote erläutert die Lohnarbeiter-Nuance und dokumentiert die formal nähere Vergleichskonstruktion.
