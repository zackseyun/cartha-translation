  source_fidelity: 'Der Text gibt alle Satzelemente des griechischen Originals zutreffend wieder: δέ als mild kontrastierendes »aber«, die zärtliche Anrede τέκνον als »Kind«, πάντοτε als »immer«, μετ’ ἐμοῦ als »bei mir« sowie die umfassende Besitzformel »alles, was mein ist, ist dein«. Die knappe possessive Gegenüberstellung bleibt erhalten.'
