id: LUK.15.31
reference: Luke 15:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: de
  text: 'Er aber sagte zu ihm: »Kind[a], du bist immer bei mir, und alles, was mein ist, ist dein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sohn«. Das griechische Wort bedeutet wörtlich »Kind« und dient hier als liebevolle familiäre Anrede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Kind
  rationale: Der Vokativ bezeichnet liebevoll ein Kind innerhalb einer familiären Beziehung. »Kind« bewahrt die Zärtlichkeit und vermeidet es, das im Griechischen nicht ausdrücklich verwendete männliche »Sohn« in den Haupttext aufzunehmen.
- source_word: πάντοτε
  choice: immer
  rationale: »Immer« ist die direkte und natürliche moderne Entsprechung und bezeichnet die fortdauernde Gemeinschaft mit dem Vater.
- source_word: μετ’ ἐμοῦ
  choice: bei mir
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft oder Begleitung. Im Deutschen gibt »bei mir« die persönliche Nähe hier natürlicher wieder als das ebenfalls mögliche »mit mir«.
- source_word: πάντα τὰ ἐμὰ
  choice: alles, was mein ist
  rationale: Die Formulierung bewahrt den umfassenden Bezug auf den gesamten Besitz des Vaters und folgt zugleich dem Gegensatz von »mein« und »dein«.
- source_word: σά ἐστιν
  choice: ist dein
  rationale: Die knappe Wiedergabe entspricht der griechischen Prädikatskonstruktion und lässt offen, ob die Aussage vor allem rechtlich, wirtschaftlich oder relational verstanden wird.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Er aber sagte zu ihm
  rationale: »Aber« gibt den milden Gegensatz zwischen der Klage des älteren Sohnes und der Antwort des Vaters wieder, ohne ihn unnötig zu verstärken.
theological_decisions:
- issue: Familiäre Anrede in der Antwort des Vaters
  choice: τέκνον mit »Kind« wiedergeben
  alternative: »Sohn« oder »mein Sohn«
  rationale: Die Anrede ist zärtlich und betont die familiäre Beziehung, verwendet aber nicht das ausdrücklich männliche Wort υἱός. »Kind« hält diese Nuance offen; die idiomatischere Alternative »Sohn« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Parallelformulierung »alles, was mein ist, ist dein« bewahrt die Prägnanz und den Gegensatz des griechischen Satzes; »Kind« klingt im Deutschen markiert, ist aber quellennah und wird durch die Fußnote erläutert.
