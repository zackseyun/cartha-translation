  terminology: Die Wahl von »Kind« wahrt die gegenüber »Sohn« weitere Bedeutung von τέκνον und vermeidet eine im griechischen Wortlaut nicht enthaltene ausdrückliche Geschlechtsmarkierung. Die Fußnote nennt »Sohn« korrekt als kontextuell naheliegende Alternative und erläutert die liebevolle familiäre Funktion der Anrede ohne theologische Überdeutung.
