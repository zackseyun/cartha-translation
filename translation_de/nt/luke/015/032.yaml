  naturalness: Der Satz ist grundsätzlich idiomatisch, doch die Verbindung zweier Hauptsätze durch ein bloßes Komma ist hier weniger klar als ein Semikolon. „Dieser dein Bruder“ ist bewusst gehoben, aber im Gleichniston verständlich und bewahrt die emphatische Wortstellung.
  terminology: „feiern und sich freuen“, „tot“, „wieder lebendig geworden“, „verloren“ und „gefunden worden“ geben die griechischen Ausdrücke sowie die parallele Struktur angemessen wieder. Die Fußnote zu ἔζησεν sollte „lebte“ ausdrücklich als nähere Wortlautalternative, nicht als unqualifiziert „wörtlicher“, kennzeichnen.
