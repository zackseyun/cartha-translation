source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: de
  text: Aber es war nötig, zu feiern und sich zu freuen[a]; denn dieser dein Bruder war tot und ist wieder lebendig geworden[b]; er war verloren und ist gefunden worden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aber man musste feiern und sich freuen“; auch: „es war angebracht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Näher am Wortlaut: „und lebte“. Im Gleichnis bezeichnet die Wendung die Wiederherstellung des Bruders.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wurde gefunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: feiern
  rationale: Im Zusammenhang des Festmahls gibt „feiern“ den festlichen Sinn natürlich und prägnant wieder.
- source_word: χαρῆναι
  choice: uns freuen
  rationale: Bewahrt neben „feiern“ den zweiten, nahezu synonymen Ausdruck der Freude und klingt im modernen Deutschen natürlich.
- source_word: ἔδει
  choice: wir mussten
  rationale: Das unpersönliche ἔδει bezeichnet eine situative oder moralische Notwendigkeit. Im Deutschen ergänzt „wir“ idiomatisch die am Fest Beteiligten; die Alternative „es war nötig“ bleibt möglich.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: dieser dein Bruder
  rationale: Bewahrt sowohl das Demonstrativpronomen als auch den pointierten Hinweis des Vaters auf die brüderliche Beziehung. Die leicht gehobene Wortstellung ist verständlich und würdevoll.
- source_word: νεκρὸς ἦν
  choice: war tot
  rationale: Gibt die wörtliche Todesmetaphorik unverändert wieder, ohne ihre Bedeutung innerhalb des Gleichnisses vorweg auszulegen.
- source_word: ἔζησεν
  choice: ist wieder lebendig geworden
  rationale: Im Gegensatz zu „war tot“ bezeichnet das Verb das Wieder-ins-Leben-Kommen. „Wieder“ macht die im Gegensatz enthaltene Wiederherstellung im Deutschen natürlich deutlich.
- source_word: ἀπολωλὼς
  choice: war verloren
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand des Verlorenseins; „verloren“ passt zum Leitmotiv des Kapitels.
- source_word: εὑρέθη
  choice: ist gefunden worden
  rationale: Das Passiv wird bewahrt; das deutsche Perfekt hebt die gegenwärtige Folge des Findens hervor.
theological_decisions:
- issue: Bildhafte oder körperliche Bedeutung von νεκρὸς ἦν καὶ ἔζησεν
  choice: „war tot und ist wieder lebendig geworden“
  alternative: „war tot und lebte“
  rationale: Die konkrete Tod-Leben-Sprache bleibt stehen, während der Gleichniskontext ihre bildhafte Beziehung zur Wiederherstellung erkennen lässt. Die Übersetzung macht daraus weder ausdrücklich eine Bekehrungsformel noch eine Aussage über körperliche Auferstehung.
- issue: Stärke der durch ἔδει bezeichneten Notwendigkeit
  choice: „wir mussten“
  alternative: „es war angebracht“
  rationale: „Mussten“ wahrt die stärkere Notwendigkeit des griechischen Ausdrucks, ohne deren genaue moralische oder situative Grundlage dogmatisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die parallelen Gegensatzpaare „tot/lebendig“ und „verloren/gefunden“ sowie die betonte Beziehung „dieser dein Bruder“ werden bewahrt.
