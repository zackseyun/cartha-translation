revisions:
- from: Aber wir mussten feiern und uns freuen[a]; denn dieser dein Bruder war tot und ist wieder lebendig geworden[b], er war verloren und ist gefunden worden[c].
  to: Aber es war nötig, zu feiern und sich zu freuen[a]; denn dieser dein Bruder war tot und ist wieder lebendig geworden[b]; er war verloren und ist gefunden worden[c].
  rationale: Die Revision entfernt das ergänzte „wir“ und gibt die unpersönliche Konstruktion mit ἔδει direkt wieder. Sie bewahrt die doppelte Freudenformel, die betonte Bruderbeziehung und die Tod-Leben- sowie Verloren-Gefunden-Parallelismen. Die Zeichensetzung verbessert die Lesbarkeit; die Fußnoten bleiben an den betreffenden Wörtern verankert und erläutern nur sichere Übersetzungsalternativen bzw. den Gleichniskontext.
