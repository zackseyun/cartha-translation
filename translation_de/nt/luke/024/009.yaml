  source_fidelity: 'Der Text gibt die Struktur und den Sinn des Griechischen zuverlässig wieder: Die Rückkehr vom Grab, die Mitteilung von „dies alles“ sowie die beiden Adressatengruppen („den Elf“ und „allen Übrigen“) sind vollständig erhalten. Die koordinierende deutsche Wiedergabe von Partizip und Hauptverb ist bei gleicher zeitlicher Abfolge idiomatisch und sachlich angemessen.'
