  terminology: „Grab“ ist im Kontext von μνημεῖον treffend; „berichteten“ entspricht ἀπήγγειλαν gut. „Den Elf“ erweitert den griechischen Text nicht um „Apostel“, und „allen Übrigen“ bewahrt die Unterscheidung zur weiteren Gruppe. Das Pronomen „sie“ verweist kontextgemäß auf die zuvor genannten Frauen, ohne eine zusätzliche Benennung einzuführen.
