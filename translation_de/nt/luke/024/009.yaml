id: LUK.24.9
reference: Luke 24:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: de
  text: Und sie kehrten vom Grab zurück und berichteten dies alles den Elf und allen Übrigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: sie kehrten … zurück
  rationale: Das feminine Aoristpartizip bezieht sich auf die Frauen aus dem vorhergehenden Zusammenhang. Im natürlichen Deutschen wird die untergeordnete Handlung als koordinierter Satz wiedergegeben.
- source_word: μνημείου
  choice: Grab
  rationale: Im Auferstehungsbericht bezeichnet μνημεῖον Jesu Begräbnisstätte; „Grab“ ist dafür die geläufige und präzise deutsche Entsprechung.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet das Übermitteln einer Nachricht. „Berichteten“ wahrt den erzählerischen Ton, ohne eine öffentliche Verkündigung anzudeuten.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: Die Formulierung gibt sowohl den rückverweisenden Charakter von ταῦτα als auch die umfassende Bedeutung von πάντα idiomatisch wieder.
- source_word: τοῖς ἕνδεκα
  choice: den Elf
  rationale: Die konventionelle Gruppenbezeichnung wird ohne den im Griechischen nicht vorhandenen Zusatz „Aposteln“ wiedergegeben.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: allen Übrigen
  rationale: Die Wiedergabe erhält die Unterscheidung zwischen den Elf und der weiteren anwesenden Gruppe.
theological_decisions:
- issue: Bezug des femininen Partizips und des pluralischen Verbs
  choice: Das ausdrücklich gesetzte Pronomen „sie“ bezeichnet die Frauen, die nach dem vorhergehenden Zusammenhang zum Grab gekommen waren.
  alternative: Die Frauen ausdrücklich als Subjekt benennen.
  rationale: Das Griechische kennzeichnet das Subjekt als feminin und pluralisch, nennt hier aber kein Substantiv. „Sie“ wahrt den Kontextbezug, ohne erklärend zu erweitern.
- issue: Bezeichnung des apostolischen Kreises
  choice: „den Elf“ ohne erläuternden Zusatz
  alternative: „den elf Aposteln“
  rationale: Der Ausgangstext verwendet nur die feste Bezeichnung „die Elf“; die Ergänzung „Apostel“ wäre sachlich verständlich, aber nicht ausdrücklich vorhanden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Koordination „sie kehrten … zurück und berichteten“ klingt natürlicher als eine schwerfällige partizipiale Konstruktion und bewahrt die zeitliche Abfolge. „Den Elf“ wird als substantivierte Zahl großgeschrieben.
