lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das Zeitadverb markiert die Abfolge der Erzählung; „Dann“ ist im modernen Deutsch knapp und natürlich.
- source_word: διήνοιξεν
  choice: öffnete
  rationale: Die konkrete Metapher von διανοίγω bleibt erhalten und wird nicht deutend zu „befähigte“ oder „erklärte“ abgeschwächt.
- source_word: αὐτῶν τὸν νοῦν
  choice: ihnen den Verstand
  rationale: νοῦς bezeichnet hier das Denk- und Erkenntnisvermögen. Der deutsche Dativ „ihnen“ gibt den griechischen Possessivbezug idiomatisch wieder, während „den Verstand öffnen“ das Bild des Ausgangstextes bewahrt.
- source_word: τοῦ συνιέναι
  choice: damit sie … verstanden
  rationale: Der artikulierte Infinitiv kann Zweck beziehungsweise Folge ausdrücken. Der deutsche Finalsatz macht den beabsichtigten Zusammenhang natürlich verständlich, ohne die mögliche Ergebnisnuance zu verschweigen.
- source_word: τὰς γραφάς
  choice: die Schriften
  rationale: Im Zusammenhang sind die als heilig anerkannten Schriften Israels gemeint; „die Schriften“ ist dafür die etablierte und kontextgerechte Wiedergabe.
theological_decisions:
- issue: Art der Handlung Jesu beim Öffnen des Verständnisses
  choice: Die direkte Metapher „öffnete er ihnen den Verstand“ bleibt stehen.
  alternative: „Er befähigte sie zum Verständnis“ oder „Er erklärte ihnen die Schriften“.
  rationale: Der griechische Text schreibt Jesus ein unmittelbares Öffnen ihres νοῦς zu. Die Übersetzung erklärt dies weder durch eine spätere Lehre von Erleuchtung noch reduziert sie es auf bloße Unterweisung.
- issue: Zweck oder Ergebnis des Öffnens
  choice: „damit sie die Schriften verstanden“ als natürliche Wiedergabe mit vorrangiger Zwecknuance.
  alternative: „sodass sie die Schriften verstanden“ oder „um die Schriften zu verstehen“.
  rationale: τοῦ mit Infinitiv kann hier Zweck oder Ergebnis bezeichnen. Der Haupttext wählt die im Kontext naheliegende Zweckformulierung; die Fußnote bewahrt die Ergebnisnuance.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Formulierung vermeidet unnötig kirchliche Fachsprache, bewahrt aber die Öffnungsmetapher und die Bezeichnung „die Schriften“.
