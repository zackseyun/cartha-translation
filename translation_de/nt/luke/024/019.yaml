    rationale: Die Formulierung ist im Deutschen ungewohnt und kann Dinge in Jesu Umfeld statt Sachverhalte betreffend Jesus bezeichnen. „Was Jesus ... betrifft“ ist die natürliche kollektive Entsprechung.
