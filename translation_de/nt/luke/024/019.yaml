source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: de
  text: 'Und er fragte sie: »Welche Dinge?« Sie antworteten ihm: »Was Jesus, den Nazarener[a], betrifft: Er war ein Mann und ein Prophet[b], mächtig in Tat und Wort vor Gott und dem ganzen Volk,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus von Nazaret“; griechisch: „Jesus, der Nazarener“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der ein Mann, ein Prophet, wurde“. Das Verb kann in diesem Zusammenhang idiomatisch mit „war“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Was für Dinge?
  rationale: Die Form ist ein substantiviertes neutrales Pluralwort. „Was für Dinge?“ bewahrt den Plural und klingt im Deutschen als Rückfrage natürlich.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Die Dinge um Jesus
  rationale: Die Wendung gibt den Artikel mit der περί-Fügung knapp wieder, ohne ausdrücklich ein Geschehen hinzuzufügen, das im Griechischen nicht genannt wird.
- source_word: Ναζαρηνοῦ
  choice: den Nazarener
  rationale: „Nazarener“ entspricht der adjektivischen Herkunftsbezeichnung im Griechischen; die geläufige Alternative „Jesus von Nazaret“ wird in einer Fußnote genannt.
- source_word: ἐγένετο
  choice: war
  rationale: γίνομαι kann wörtlich „werden“ bedeuten, dient hier aber in der rückblickenden Beschreibung idiomatisch zur Kennzeichnung dessen, als was Jesus auftrat beziehungsweise sich erwies. Das deutsche „wurde ein Mann“ wäre missverständlich.
- source_word: ἀνὴρ προφήτης
  choice: ein Prophet
  rationale: ἀνήρ steht hier mit προφήτης in einer appositionellen Personenbeschreibung. Im natürlichen Deutschen trägt „Mann“ in „ein Mann, ein Prophet“ kaum zusätzlichen Sinn und würde zusammen mit „wurde“ eine irreführende Aussage erzeugen; die wörtlichere Form bleibt in der Fußnote sichtbar.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: mächtig in Tat und Wort
  rationale: Die feste Paarung „in Tat und Wort“ ist präzise, würdig und im modernen Deutschen gut verständlich; „mächtig“ erhält die Stärke von δυνατός.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: vor Gott und dem ganzen Volk
  rationale: „Vor“ gibt hier die Bedeutung „im Angesicht beziehungsweise in den Augen von“ knapp wieder und wahrt die Verbindung von göttlichem und öffentlichem Zeugnis.
theological_decisions:
- issue: Die Verbindung ἐγένετο ἀνὴρ προφήτης in der Beschreibung Jesu
  choice: der ein Prophet war
  alternative: der ein Mann, ein Prophet, wurde / der sich als ein Mann und Prophet erwies
  rationale: Eine mechanische Wiedergabe mit „wurde“ könnte im Deutschen nahelegen, Jesus sei erst zu einem Mann oder erst zu einem Propheten geworden. Die idiomatische Haupttextfassung vermeidet diese unbeabsichtigte christologische Festlegung; die ungewöhnliche griechische Form und ihre wörtlichere Möglichkeit werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „mächtig in Tat und Wort“ bewahrt den biblischen Parallelismus. Die Wiederholung „sagte … antworteten“ vermeidet im Deutschen eine unnötig monotone Verdopplung, ohne den Aussagegehalt zu verändern.
