  naturalness: „Was für Dinge?“ und besonders „Die Dinge um Jesus“ wirken im modernen Standarddeutsch unidiomatisch. „Welche Dinge?“ und „Was Jesus ... betrifft“ sind natürlich und bewahren die Rückfrage beziehungsweise den Bezug auf Jesus.
  terminology: „Nazarener“ ist als formnahe Wiedergabe von Ναζαρηνός möglich. „Mann und Prophet“ gibt die beiden griechischen Substantive ohne dogmatische Zuspitzung wieder. „Mächtig in Tat und Wort vor Gott und dem ganzen Volk“ ist treffend und registergerecht.
