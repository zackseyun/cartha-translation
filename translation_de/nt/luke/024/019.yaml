revisions:
- from: 'Und er sagte zu ihnen: »Was für Dinge?« Sie antworteten ihm: »Die Dinge um Jesus, den Nazarener[a], der ein Prophet war[b], mächtig in Tat und Wort vor Gott und dem ganzen Volk,«'
  to: 'Und er fragte sie: »Welche Dinge?« Sie antworteten ihm: »Was Jesus, den Nazarener[a], betrifft: Er war ein Mann und ein Prophet[b], mächtig in Tat und Wort vor Gott und dem ganzen Volk,«'
  rationale: Die Revision stellt die im Griechischen ausdrücklich genannte Bezeichnung Jesu als „Mann und Prophet“ im Haupttext wieder her, ohne die missverständliche deutsche Form „wurde ein Mann“ zu erzwingen. Die Fußnote dokumentiert weiterhin den wörtlicheren Wert von ἐγένετο. Zugleich werden die beiden unnatürlichen deutschen Wendungen durch idiomatische, dem Sinn und der grammatischen Zahl entsprechende Formulierungen ersetzt. Die Satzstruktur mit abschließendem Komma bleibt erhalten, da der Vers im griechischen Satzgefüge fortgesetzt wird.
