    rationale: Der Entwurf übersetzt ἐγένετο ἀνὴρ προφήτης nur mit „der ein Prophet war“. Die Fußnote kann das im griechischen Ausgangstext ausdrücklich vorhandene ἀνήρ nicht vollständig ersetzen.
