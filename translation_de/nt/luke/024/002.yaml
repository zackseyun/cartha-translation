lexical_decisions:
- source_word: εὗρον
  choice: sie fanden
  rationale: Der Aorist Aktiv Indikativ in der 3. Person Plural führt das Subjekt aus dem vorherigen Vers fort, nämlich die Frauen. „Sie fanden“ ist im Deutschen natürlich und gibt die Form präzise wieder.
- source_word: δὲ
  choice: Und
  rationale: δέ ist hier ein schwaches Bindewort, das die Erzählung fortführt, nicht ein starker Gegensatz. „Und“ bewahrt diesen fließenden Anschluss.
- source_word: τὸν λίθον
  choice: den Stein
  rationale: Im Bestattungskontext bezeichnet λίθος den Stein, der das Grab verschloss. „Den Stein“ ist die übliche und genaue Wiedergabe.
- source_word: ἀποκεκυλισμένον
  choice: weggerollt
  rationale: Das Perfekt Passiv Partizip beschreibt den Stein in dem Zustand, der durch das Wegrollen entstanden ist. Die deutsche Konstruktion „fanden … weggerollt“ gibt sowohl den Vorgang als auch dessen fortbestehendes Ergebnis knapp wieder.
- source_word: ἀπὸ τοῦ μνημείου
  choice: vom Grab
  rationale: μνημεῖον bezeichnet hier die Grabstätte; ἀπό drückt die Entfernung von ihr aus. Zusammen mit „weggerollt“ ist „vom Grab“ idiomatisch und vollständig.
theological_decisions:
- issue: Im griechischen Satz nicht eigens wiederholtes Subjekt
  choice: Und sie fanden den Stein vom Grab weggerollt.
  alternative: Und fanden den Stein vom Grab weggerollt.
  rationale: Die Verbform verweist eindeutig auf die Frauen aus dem vorherigen Vers. Das im Deutschen eingesetzte Pronomen macht den Satz natürlich und fügt keinen theologischen Gehalt hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählbewegung des griechischen Textes bleibt erhalten; die resultative Bedeutung des Perfektpartizips wird durch „weggerollt“ natürlich ausgedrückt.
