id: LUK.24.27
reference: Luke 24:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: de
  text: Und er begann bei Mose und allen Propheten[a] und legte ihnen in allen Schriften aus[b], was sich auf ihn bezog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mose und alle Propheten“ bezeichnet die mit Mose verbundenen Schriften und die prophetischen Bücher.
    reason: cultural_note
  - marker: b
    text: 'Oder: „erklärte“. Das griechische Verb kann eine eingehende Deutung oder Auslegung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: er begann bei Mose
  rationale: Das aoristische Partizip wird im Deutschen durch eine koordinierte finite Verbform natürlich wiedergegeben. „Bei Mose beginnen“ bezeichnet Mose als Ausgangspunkt der Schriftauslegung, ohne ausschließlich auf seine Person festgelegt zu sein.
- source_word: πάντων τῶν προφητῶν
  choice: allen Propheten
  rationale: Im Zusammenhang mit Mose und den Schriften bezeichnet die Wendung die prophetischen Schriften beziehungsweise den anerkannten Schriftbereich der Propheten.
- source_word: διερμήνευσεν
  choice: legte … aus
  rationale: Das Verb bezeichnet ein erklärendes Deuten. „Auslegen“ gibt im Kontext der Schrift den exegetischen Sinn präzise und idiomatisch wieder.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird direkt und ohne unnötige Erweiterung wiedergegeben.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: in allen Schriften
  rationale: γραφή bezeichnet hier die heiligen Schriften. Die Formulierung bewahrt die Breite von πάσαις, ohne zu behaupten, jeder einzelne Vers sei unmittelbar gemeint.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: was sich auf ihn bezog
  rationale: Die neutrale Formulierung umfasst Aussagen, Zusammenhänge oder Themen, die Jesus betreffen, ohne sie ausschließlich als direkte Vorhersagen festzulegen.
theological_decisions:
- issue: Umfang der Schriftauslegung Jesu
  choice: Jesus legt aus den Schriften das aus, was sich auf ihn bezieht, ohne die Art dieser Bezüge näher festzulegen.
  alternative: Nur direkte messianische Vorhersagen sind gemeint; oder jeder einzelne Abschnitt sämtlicher Schriften bezieht sich unmittelbar auf Jesus.
  rationale: Der griechische Wortlaut trägt eine breite christologische Aussage, legt aber weder eine einzige hermeneutische Kategorie fest noch fordert er die Behauptung, jede einzelne Schriftstelle handle direkt von Jesus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Gedankengang des griechischen Textes, vermeidet jedoch ein im Deutschen schwerfälliges Partizip. „Auslegen“ ist im Schriftkontext geläufig und für ein allgemeines Publikum verständlich.
