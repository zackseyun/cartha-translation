  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Aussagen des griechischen Textes zuverlässig wieder: Petrus steht auf, läuft zum Grab, beugt sich vor, sieht allein die Leinentücher und geht verwundert fort. Das historische Präsens βλέπει ist im deutschen Erzählpräteritum idiomatisch wiedergegeben. „bei sich selbst“ bewahrt die reflexive und in ihrer genauen Nuance nicht ganz eindeutige Wendung πρὸς αὑτόν, ohne sie zu einer bestimmten Ortsangabe wie „nach Hause“ zu verengen.'
  naturalness: Modernes, klares und würdiges Deutsch. „Er beugte sich vor und sah“ vermittelt den Blick in das Grab ausreichend, ohne ein Hineingehen zu behaupten. Die Satzfolge ist gut lesbar.
  terminology: „Grab“ für μνημεῖον und „Leinentücher“ für ὀθόνια sind im Kontext treffend. „wunderte sich“ gibt θαυμάζων offen wieder und trägt keine über den Text hinausgehende Deutung von Petrus’ Reaktion ein.
