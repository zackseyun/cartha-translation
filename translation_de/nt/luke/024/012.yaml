id: LUK.24.12
reference: Luke 24:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: de
  text: Petrus aber stand auf und lief zum Grab. Er beugte sich vor und sah nur die Leinentücher. Dann ging er weg und wunderte sich bei sich selbst über das, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημεῖον
  choice: Grab
  rationale: Im Kontext bezeichnet das Wort die Grabanlage; „Grab“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: παρακύψας
  choice: Er beugte sich vor
  rationale: Das Partizip beschreibt das Vorbeugen, um in das Grab hineinzusehen, ohne ausdrücklich zu sagen, dass Petrus hineinging.
- source_word: βλέπει
  choice: sah
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben; die Lebendigkeit der Szene bleibt durch die knappe Satzfolge erhalten.
- source_word: ὀθόνια μόνα
  choice: nur die Leinentücher
  rationale: 'μόνα bezieht sich auf die Leinentücher: Diese lagen allein beziehungsweise ohne den Leichnam da. „Nur die Leinentücher“ gibt dies idiomatisch wieder.'
- source_word: πρὸς αὑτὸν
  choice: bei sich selbst
  rationale: Die Wendung wird in ihrer wahrscheinlichen reflexiven Bedeutung bewahrt und nicht vorschnell als bloßes „nach Hause“ aufgelöst.
- source_word: θαυμάζων
  choice: wunderte sich
  rationale: Das Verb bezeichnet erstauntes Verwundern; „wunderte sich“ wahrt die Offenheit, ohne bereits Glauben oder Unglauben festzulegen.
theological_decisions:
- issue: Petrus’ Reaktion auf das leere Grab
  choice: „wunderte sich … über das, was geschehen war“
  alternative: „glaubte“ oder „zweifelte“
  rationale: Der griechische Text beschreibt Verwunderung, legt Petrus’ theologisches Urteil aber nicht fest. Diese Spannung bleibt erhalten.
- issue: Bedeutung von πρὸς αὑτόν
  choice: „bei sich selbst“
  alternative: „nach Hause“
  rationale: Die reflexive Form in der vorliegenden SBLGNT-Lesart begünstigt eine auf Petrus’ innere Reaktion bezogene Wiedergabe; die Übersetzung vermeidet eine unbelegte Zielangabe.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählfolge. Das griechische historische Präsens wird entsprechend üblichem deutschem Erzählstil im Präteritum wiedergegeben. Keine Fußnoten erforderlich.
