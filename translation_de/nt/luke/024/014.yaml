  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: de
  text: Und sie sprachen miteinander über all das, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzuführen.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das ausdrückliche Pronomen wird im Deutschen natürlich als Subjekt wiedergegeben; eine betonte Form wie „sie selbst“ wäre hier unnötig.
- source_word: ὡμίλουν
  choice: sprachen
  rationale: Bezeichnet hier ein Gespräch. Das deutsche Präteritum ist in erzählender Prosa idiomatisch und lässt den fortlaufenden Gesprächscharakter aus dem Zusammenhang erkennen.
- source_word: πρὸς ἀλλήλους
  choice: miteinander
  rationale: Gibt die Gegenseitigkeit des Gesprächs knapp und natürlich wieder.
- source_word: περὶ πάντων
  choice: über alles
  rationale: Drückt das Thema und den umfassenden Umfang des Gesprächs in geläufigem Deutsch aus.
- source_word: τῶν συμβεβηκότων τούτων
  choice: was geschehen war
  rationale: Gibt die vorausliegende, abgeschlossene Ereignisfolge mit fortdauernder Bedeutung im erzählten Augenblick natürlich wieder; „alles“ nimmt τούτων im Deutschen ausreichend auf.
