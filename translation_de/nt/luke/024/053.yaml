  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: καὶ als „Und“, das durative ἦσαν mit „waren“, διὰ παντός mit „ständig“, ἐν τῷ ἱερῷ als „im Tempel“ sowie εὐλογοῦντες τὸν θεόν als „segneten Gott“. „Tempel“ ist als knappe Wiedergabe von ἱερόν tragfähig und legt sich nicht fälschlich auf das innere Heiligtum fest.'
  naturalness: Der Satz ist klares, würdevolles modernes Standarddeutsch. „Gott segnen“ ist im gegenwärtigen Alltagsdeutsch weniger üblich als „Gott loben“, ist jedoch als bewusst bibelsprachliche und semantisch nahe Formulierung verständlich; die Fußnote unterstützt dies sinnvoll.
  terminology: „Segneten Gott“ bewahrt die Wortwahl von εὐλογέω, ohne die idiomatisch mögliche Bedeutung „lobten“ zu verschweigen. Die Fußnote ist sachlich, knapp und korrekt am Verb verankert.
