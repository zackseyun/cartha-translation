  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: de
  text: Und sie waren ständig im Tempel und segneten[a] Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lobten“. Das griechische Verb bedeutet wörtlich „segnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verknüpfung führt die abschließende Aussage unmittelbar aus dem vorherigen Geschehen fort.
- source_word: ἦσαν
  choice: sie waren
  rationale: Das Imperfekt bezeichnet einen andauernden Zustand; dessen Dauer wird zusammen mit „ständig“ natürlich wiedergegeben.
- source_word: διὰ παντός
  choice: ständig
  rationale: Die feste Wendung bedeutet „fortwährend“ beziehungsweise „allezeit“. „Ständig“ ist gegenwärtiges, gut verständliches Deutsch und bezeichnet hier ihr regelmäßiges, anhaltendes Verweilen.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet die Tempelanlage und nicht speziell das innere Heiligtum. Das übliche deutsche „Tempel“ lässt diesen Umfang offen.
- source_word: εὐλογοῦντες
  choice: segneten
  rationale: Die Wiedergabe bewahrt die Grundbedeutung von εὐλογέω („segnen“, „Gutes sagen“). Da die Wendung mit Gott als Objekt im heutigen Deutsch ungewohnt sein kann, nennt eine Fußnote die kontextuell natürliche Alternative „lobten“.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Gott ist das direkte Objekt des Partizips εὐλογοῦντες; die schlichte Wiedergabe ist eindeutig und sachgerecht.
theological_decisions:
- issue: Wiedergabe der an Gott gerichteten Verehrung in εὐλογοῦντες τὸν θεόν
  choice: segneten Gott
  alternative: lobten Gott
  rationale: „Segneten“ bleibt bei dem tatsächlich verwendeten griechischen Verb εὐλογέω und bewahrt die biblische Spannung, dass Menschen Gott segnen. „Lobten“ gibt die Funktion der Wendung in natürlicherem Deutsch wieder, ist aber lexikalisch weniger direkt; deshalb steht es als Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Satzform. Die etwas ungewohnte Wendung „Gott segnen“ wurde bewusst beibehalten und durch eine verständliche Alternative erläutert. Der Fußnotenmarker steht unmittelbar beim betreffenden Verb.
