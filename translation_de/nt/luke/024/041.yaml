id: LUK.24.41
reference: Luke 24:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: de
  text: 'Während sie aber vor Freude noch immer nicht glaubten und staunten[a], sagte er zu ihnen: »Habt ihr hier etwas zu essen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sich wunderten«.'
    reason: Lexikalische Alternative für θαυμαζόντων; die Formulierung kann sowohl staunende Verwunderung als auch Erstaunen ausdrücken.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Während sie aber … noch immer
  rationale: ἔτι bezeichnet den fortdauernden Zustand („noch immer“); δέ ist ein schwacher Anschluss, der hier natürlich mit „aber“ wiedergegeben wird. Die Genitiv-Partizipialkonstruktion wird im Deutschen als temporaler Nebensatz formuliert.
- source_word: ἀπιστούντων
  choice: nicht glaubten
  rationale: Die Wiedergabe wahrt den fortdauernden, situationsbezogenen Unglauben, ohne daraus eine feste Haltung oder ausdrückliche Unfähigkeit zu machen.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: vor Freude
  rationale: ἀπό bezeichnet hier Ursache oder Ursprung. „Vor Freude“ ist im Deutschen eine natürliche kausale Wendung und bewahrt das Paradox, dass gerade die Freude das Glauben erschwert.
- source_word: θαυμαζόντων
  choice: staunten
  rationale: Das Verb bezeichnet erstauntes, verwundertes Reagieren. „Staunten“ ist natürlich und bleibt eng am Sinn; die Alternative „sich wunderten“ wird in der Fußnote genannt.
- source_word: Ἔχετέ τι
  choice: Habt ihr … etwas
  rationale: Die direkte Frage wird im Deutschen idiomatisch mit „Habt ihr … etwas?“ ausgedrückt; τι erhält im Fragesatz den offenen Sinn „etwas“.
- source_word: βρώσιμον
  choice: zu essen
  rationale: βρώσιμον bedeutet etwas Essbares beziehungsweise zum Essen Geeignetes. „Etwas zu essen“ ist die natürliche deutsche Formulierung.
- source_word: ἐνθάδε
  choice: hier
  rationale: Das Ortsadverb wird knapp und genau mit „hier“ wiedergegeben.
theological_decisions:
- issue: Art der Reaktion der Jünger auf den auferstandenen Jesus
  choice: Ihr noch andauerndes Nichtglauben wird ausdrücklich mit ihrer Freude verbunden und steht neben ihrem Staunen.
  alternative: Die Aussage könnte als bloße Skepsis oder mit „sie konnten es vor Freude nicht glauben“ als ausdrückliche Unfähigkeit formuliert werden.
  rationale: Der griechische Text hält Nichtglauben, Freude und Staunen zugleich fest. Die Übersetzung bewahrt diese Spannung, ohne das Nichtglauben zu verhärten oder durch ein nicht ausdrücklich vorhandenes „konnten“ zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Vor Freude“ gibt die ungewöhnliche kausale Verbindung idiomatisch wieder; „noch immer nicht glaubten“ hält die Spannung des Ausgangstextes offen.
