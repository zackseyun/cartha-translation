  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: de
  text: Musste der Messias[a] nicht dies alles erleiden und in seine Herrlichkeit eingehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: nicht …?
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Konstruktion mit „nicht“ gibt dies natürlich wieder.
- source_word: ταῦτα
  choice: dies alles
  rationale: Der substantivische neutrale Plural verweist zusammenfassend auf die zuvor angesprochenen Leiden; „dies alles“ ist im Deutschen idiomatischer als das wörtlichere „diese Dinge“.
- source_word: ἔδει
  choice: musste
  rationale: Das Imperfekt von δεῖ bezeichnet hier die im göttlichen Plan und in der Schrift begründete Notwendigkeit. „Musste“ ist knapp und natürlich, ohne die Art dieser Notwendigkeit im Haupttext weiter auszudeuten.
- source_word: παθεῖν
  choice: erleiden
  rationale: „Erleiden“ gibt πάσχω in diesem Zusammenhang idiomatisch wieder und nimmt „dies alles“ als natürliches Objekt auf.
- source_word: τὸν χριστὸν
  choice: der Messias
  rationale: Χριστός ist hier ein Titel im Zusammenhang der Schrifterfüllung. „Messias“ bewahrt seine Bedeutung als der Gesalbte und klingt im modernen Deutschen natürlich.
- source_word: καὶ
  choice: und
  rationale: Die einfache Koordination der beiden Infinitive bleibt erhalten; eine zeitliche Ergänzung wie „dann“ wäre stärker als der griechische Wortlaut.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: in seine Herrlichkeit eingehen
  rationale: Die Formulierung bewahrt sowohl die Vorstellung des Eintretens als auch das Possessivpronomen und entspricht würdigem, verständlichem Standarddeutsch.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und kontextuell passende Wiedergabe von δόξα im Zusammenhang von Auferstehung und Erhöhung.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Genitivattribut wird direkt wiedergegeben, ohne näher festzulegen, ob die Herrlichkeit als ihm eigen oder für ihn bestimmt zu verstehen ist.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck fungiert hier als Titel in einem Kontext der Schrifterfüllung. „Messias“ macht den Titelcharakter deutlich; die geläufige Alternative „Christus“ wird in der Fußnote genannt.
- issue: Bedeutung von ἔδει
  choice: musste
  alternative: war es nicht notwendig, dass
  rationale: „Musste“ bringt die göttlich beziehungsweise schriftgemäß begründete Notwendigkeit prägnant zum Ausdruck, ohne sie als bloßen äußeren Zwang oder als reine Unvermeidlichkeit festzulegen.
- issue: Bezug von αὐτοῦ in „seine Herrlichkeit“
  choice: Possessivform unverändert bewahren
  alternative: in die für ihn bestimmte Herrlichkeit
  rationale: Der griechische Genitiv lässt die genaue Nuance offen. Eine erläuternde Umschreibung würde diese Offenheit unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp und mündlich verständlich; „eingehen in“ wahrt zugleich den biblischen Ton, ohne altertümlich zu wirken.
