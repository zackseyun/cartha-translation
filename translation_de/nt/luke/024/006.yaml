id: LUK.24.6
reference: Luke 24:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: de
  text: Er ist nicht hier, sondern ist auferweckt worden.[a] Erinnert euch daran, wie er zu euch gesprochen hat, als er noch in Galiläa war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist auferstanden“. Das griechische Verb steht im Passiv („ist auferweckt worden“), kann bei der Aussage über die Auferstehung aber auch intransitiv wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Er ist nicht hier
  rationale: 'Das griechische Subjekt bleibt unausgesprochen, bezieht sich im Zusammenhang jedoch eindeutig auf Jesus. Im Deutschen wird es zur natürlichen und klaren Wiedergabe ergänzt; ὧδε bezeichnet den Ort: „hier“.'
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung „nicht hier“ drückt „sondern“ den direkten Gegensatz im Deutschen präziser und natürlicher aus als „aber“.
- source_word: ἠγέρθη
  choice: ist auferweckt worden
  rationale: Die Form ist Aorist Passiv von ἐγείρω. Das deutsche Perfekt Passiv bewahrt sowohl die vollendete Auferweckung als auch die passive Form und lässt die im Kontext naheliegende göttliche Urheberschaft unausgesprochen.
- source_word: μνήσθητε
  choice: Erinnert euch daran
  rationale: Der Aorist-Medium-Imperativ verlangt eine direkte Aufforderung. „Erinnert euch daran“ ist im modernen Deutsch idiomatisch und leitet den folgenden Inhalt natürlich ein.
- source_word: ὡς
  choice: wie
  rationale: ὡς führt hier das Erinnerte ein und wird seinem Wortlaut entsprechend mit „wie“ wiedergegeben, ohne den Inhalt bereits durch „was“ enger festzulegen.
- source_word: ἐλάλησεν ὑμῖν
  choice: er zu euch gesprochen hat
  rationale: Diese Wiedergabe bewahrt den allgemeinen Sinn von λαλέω („sprechen“) und gibt das Dativpronomen natürlich mit „zu euch“ wieder.
- source_word: ἔτι ὢν
  choice: als er noch … war
  rationale: Die Partizipialkonstruktion wird als natürliche deutsche Temporalkonstruktion wiedergegeben; „noch“ bewahrt die Bedeutung von ἔτι.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: in Galiläa
  rationale: Schlichte örtliche Wiedergabe des griechischen Ausdrucks mit der etablierten deutschen Form des Ortsnamens.
theological_decisions:
- issue: Wiedergabe des Auferstehungsverbs ἠγέρθη
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Die Hauptfassung bewahrt das grammatische Passiv und damit die mögliche Andeutung göttlichen Handelns, ohne den Handelnden ausdrücklich zu benennen. Die geläufige intransitive Wiedergabe „ist auferstanden“ bezeichnet dasselbe Ereignis, bildet die griechische Verbform jedoch weniger formal ab und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erinnert euch daran“ ist allgemeinverständlich; die passive Form „ist auferweckt worden“ erhält bewusst die sprachliche und theologische Spannung des griechischen Textes. Das abschließende Komma folgt dem vorgelegten Verssegment, dessen Satz im nächsten Vers weitergeführt wird.
