id: LUK.24.50
reference: Luke 24:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: de
  text: Dann führte er sie hinaus bis in die Nähe von Betanien[a]. Er erhob seine Hände und segnete sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „bis nach Betanien“ beziehungsweise „bis in Richtung Betanien“; die griechische Wendung lautet sinngemäß „bis hin auf Betanien zu“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: führte … hinaus
  rationale: Das Verb ἐξάγω bezeichnet das Hinausführen oder Hinausbringen. „Führte … hinaus“ bewahrt sowohl die persönliche Führung als auch die Richtungsangabe.
- source_word: δὲ
  choice: Dann
  rationale: δέ kennzeichnet hier vor allem den Fortgang der Erzählung, nicht einen deutlichen Gegensatz. „Dann“ gibt diesen Übergang im modernen Deutschen natürlich wieder.
- source_word: ἕως πρὸς Βηθανίαν
  choice: bis in die Nähe von Betanien
  rationale: Die ungewöhnlich volle Verbindung ἕως πρός beschreibt die räumliche Ausdehnung in Richtung Betanien, ohne eindeutig festzulegen, ob Jesus und die Jünger den Ort selbst betraten. Die gewählte Formulierung ist verständlich und erhält diese räumliche Offenheit; Alternativen werden in der Fußnote genannt.
- source_word: Βηθανίαν
  choice: Betanien
  rationale: „Betanien“ ist die im Deutschen etablierte Form des Ortsnamens.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: Er erhob seine Hände
  rationale: 'Das vorzeitige Aoristpartizip ἐπάρας wird als eigener deutscher Satz wiedergegeben. Dadurch bleibt die Abfolge klar: Jesus erhebt die Hände und segnet anschließend. Der Plural „Hände“ bewahrt die konkrete Segensgebärde.'
- source_word: εὐλόγησεν αὐτούς
  choice: segnete sie
  rationale: εὐλογέω bezeichnet hier den Vollzug eines Segens an den Jüngern. „Segnete sie“ ist präzise, würdig und vermeidet eine unnötige interpretierende Erweiterung.
theological_decisions:
- issue: Art der Segenshandlung Jesu
  choice: „segnete sie“ ohne nähere liturgische Bestimmung
  alternative: „sprach ihnen einen Segen zu“ oder „sprach einen Segen über sie“
  rationale: Der Text schildert eine wirkliche Segenshandlung Jesu mit erhobenen Händen, bestimmt sie aber nicht näher als priesterliche oder liturgische Formel. Die schlichte Wiedergabe wahrt diese Aussage und vermeidet spätere konfessionelle Einordnungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Partizipialkonstruktion, ohne die zeitliche Abfolge zu verändern.
