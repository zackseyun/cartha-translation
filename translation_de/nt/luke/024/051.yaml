  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: de
  text: 'Und es geschah: Während er sie segnete, entfernte er sich von ihnen und wurde in den Himmel emporgehoben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen die Worte „und wurde in den Himmel emporgehoben“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Die geläufige lukanische Erzählformel wird würdig und knapp wiedergegeben; die anschließende Satzstruktur wird im modernen Deutschen durch einen Doppelpunkt natürlich verbunden.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: während er sie segnete
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet eine gleichzeitig andauernde Handlung; „während“ gibt dies klar wieder.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: entfernte er sich von ihnen
  rationale: Die Formulierung bewahrt den Sinn räumlicher Trennung beziehungsweise des Weggehens, ohne die Art oder Ursache näher festzulegen.
- source_word: ἀνεφέρετο
  choice: wurde emporgehoben
  rationale: Die passive Form und die Aufwärtsbewegung werden ausdrücklich bewahrt, ohne den Handelnden zu benennen.
- source_word: εἰς τὸν οὐρανόν
  choice: in den Himmel
  rationale: Im Kontext bezeichnet οὐρανός den Himmel; „in den Himmel“ gibt zudem die durch εἰς ausgedrückte Bewegung natürlich wieder.
theological_decisions:
- issue: Textkritisch unsichere Klausel καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Im Haupttext aufgenommen und mit einer textkritischen Fußnote gekennzeichnet
  alternative: 'Die Klausel auslassen: „Während er sie segnete, entfernte er sich von ihnen.“'
  rationale: Der SBLGNT setzt die Klausel in doppelte eckige Klammern und signalisiert damit erhebliche textkritische Unsicherheit. Ihre Aufnahme folgt dem bereitgestellten Text, während die Fußnote die alternative Überlieferung offenlegt und die Frage nicht stillschweigend entscheidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt vermeidet eine schwerfällige Nachbildung der griechischen Erzählformel. „Emporgehoben“ wahrt sowohl die Aufwärtsrichtung als auch die passive Aussage.
