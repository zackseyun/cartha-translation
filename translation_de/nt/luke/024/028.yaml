id: LUK.24.28
reference: Luke 24:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: de
  text: Sie näherten sich dem Dorf, zu dem sie unterwegs waren, und er tat so, als wolle er weitergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: sie sich … näherten
  rationale: Das Aoristverb bezeichnet die Annäherung an einen Ort; die deutsche Formulierung ist natürlich und bewahrt den Bewegungssinn.
- source_word: κώμην
  choice: Dorf
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere Ansiedlung, nicht eine Stadt.
- source_word: οὗ ἐπορεύοντο
  choice: zu dem sie unterwegs waren
  rationale: Das Relativadverb bezeichnet hier zusammen mit dem Imperfekt von πορεύομαι das Ziel ihrer noch andauernden Reise.
- source_word: προσεποιήσατο
  choice: tat er so, als
  rationale: Die Wendung gibt wieder, dass Jesus den Anschein erweckte, weiterzugehen, ohne durch das stärkere Wort „vortäuschen“ die Frage nach einer Täuschungsabsicht vorzuentscheiden.
- source_word: πορρώτερον
  choice: weiter
  rationale: Der Komparativ bezeichnet in diesem Reisekontext eine Fortsetzung über den erreichten Ort hinaus.
- source_word: πορεύεσθαι
  choice: wolle er … gehen
  rationale: Der Infinitiv ergänzt προσεποιήσατο; im Deutschen gibt die Konstruktion „tat so, als wolle er“ den beabsichtigten Anschein idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von προσεποιήσατο im Blick auf Jesu Handeln
  choice: tat er so, als wolle er weitergehen
  alternative: gab er vor, weiterzugehen / erweckte er den Anschein, weiterzugehen
  rationale: 'Die Formulierung bewahrt die erzählerische Spannung: Jesus verhält sich so, als werde er seinen Weg fortsetzen. Sie legt jedoch nicht stärker als der griechische Text eine moralisch wertende Täuschungsabsicht nahe.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählfluss, während „zu dem sie unterwegs waren“ und „tat er so, als wolle er“ für heutige Leser idiomatisch formuliert sind.
