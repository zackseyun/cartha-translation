  - severity: low
    issue: Etwas schwerfällige Wortstellung im ersten Teilsatz
    rationale: Die Formulierung ist grammatisch möglich, aber »Sie näherten sich dem Dorf, zu dem sie unterwegs waren« ist flüssiger und bewahrt die Zielrelation von οὗ ἐπορεύοντο klar.
