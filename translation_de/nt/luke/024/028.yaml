review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Die beiden nähern sich einer κώμη (»Dorf«), die ihr Reiseziel ist, und Jesus erweckt den Anschein, über diesen Ort hinaus weiterzugehen. »Weitergehen« gibt πορρώτερον πορεύεσθαι in diesem Kontext angemessen wieder. Die temporale Einleitung »Als« macht das griechische καί jedoch unnötig zu einer untergeordneten Zeitangabe.'
  naturalness: »Als sie sich dem Dorf näherten, zu dem sie unterwegs waren« ist verständlich, wirkt aber durch die Kombination aus einleitendem »Als« und der anschließenden Relativbestimmung etwas schwerfällig. Ein einfacher koordinierter Erzählsatz ist im modernen Standarddeutsch natürlicher und näher am griechischen Erzählfluss.
  terminology: »Dorf« ist für κώμη passend. »Tat so, als wolle er weitergehen« ist idiomatisch und bewahrt gegenüber »gab vor« oder »täuschte vor« die nicht weiter moralisch zugespitzte Formulierung des griechischen προσεποιήσατο.
