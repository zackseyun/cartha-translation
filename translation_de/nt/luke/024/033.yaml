  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Nachdruck des griechischen Textes zuverlässig wieder: das Aufstehen, die Rückkehr noch in derselben Stunde, Jerusalem sowie das Auffinden der versammelten Gruppe. „Versammelt“ bezieht sich natürlich auf „die Elf und die, die bei ihnen waren“ und bewahrt den durch das Perfektpartizip bezeichneten bereits bestehenden Zustand.'
  naturalness: Modernes, flüssiges und angemessen würdiges Standarddeutsch. Die Aufteilung in zwei Sätze ist idiomatisch und verändert weder den zeitlichen noch den logischen Zusammenhang. „Noch in derselben Stunde“ ist eine treffende deutsche Entsprechung für αὐτῇ τῇ ὥρᾳ.
  terminology: „Die Elf“ bewahrt die im Griechischen verwendete Gruppenbezeichnung ohne erläuternden Zusatz. „Jerusalem“, „kehrten ... zurück“ und „versammelt“ sind terminologisch und stilistisch passend. Die Fußnote ist korrekt verankert und erklärt die lexikalische Alternative sowie den resultativen Charakter des Partizips sachgerecht.
