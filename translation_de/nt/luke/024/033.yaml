id: LUK.24.33
reference: Luke 24:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: de
  text: Noch in derselben Stunde standen sie auf und kehrten nach Jerusalem zurück. Dort fanden sie die Elf und die, die bei ihnen waren, versammelt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zusammengekommen. Das griechische Partizip beschreibt sie als bereits versammelt, als die beiden sie fanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: standen sie auf
  rationale: Das Aoristpartizip von ἀνίστημι bezeichnet hier die dem Zurückkehren vorausgehende körperliche Handlung. „Standen sie auf“ gibt diese direkt und in natürlichem Deutsch wieder.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: noch in derselben Stunde
  rationale: Die Wendung verweist betont auf genau die soeben genannte Stunde und drückt zugleich unverzügliches Handeln aus, ohne sie lediglich mit „sofort“ zu umschreiben.
- source_word: ὑπέστρεψαν
  choice: kehrten … zurück
  rationale: Im Reisebericht bezeichnet ὑποστρέφω die Rückkehr an einen zuvor verlassenen Ort.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: εὗρον
  choice: fanden
  rationale: Direkte und im erzählenden Zusammenhang natürliche Wiedergabe von εὑρίσκω.
- source_word: ἠθροισμένους
  choice: versammelt
  rationale: Das Perfektpartizip Passiv beschreibt den bereits bestehenden Zustand der ganzen nachfolgenden Personengruppe, als die beiden sie fanden.
- source_word: τοὺς ἕνδεκα
  choice: die Elf
  rationale: Bewahrt die feste Gruppenbezeichnung des griechischen Textes, ohne „Apostel“ ergänzend einzutragen.
- source_word: τοὺς σὺν αὐτοῖς
  choice: die, die bei ihnen waren
  rationale: Gibt die unbestimmte Bezeichnung weiterer Anwesender wieder, ohne ihre Identität oder Funktion näher festzulegen.
theological_decisions:
- issue: Bezeichnung „die Elf“ trotz der möglichen Abwesenheit einzelner Mitglieder
  choice: Die feste Gruppenbezeichnung „die Elf“ wird unverändert beibehalten.
  alternative: die elf Apostel; die übrigen Jünger
  rationale: Lukas verwendet τοὺς ἕνδεκα als Gruppenbezeichnung. Eine Präzisierung der tatsächlichen Anwesenheit oder eine harmonisierende Umschreibung würde über den Wortlaut hinausgehen.
- issue: Bezugsbereich von ἠθροισμένους
  choice: „versammelt“ bezieht sich auf „die Elf“ und auf „die, die bei ihnen waren“.
  alternative: Nur die Elf waren versammelt; die anderen waren lediglich bei ihnen.
  rationale: Kasus, Numerus und Satzstellung legen nahe, dass das Partizip die gesamte koordinierte Gruppe beschreibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Partizipialkonstruktion; „noch in derselben Stunde“ bewahrt Zeitbezug und Nachdruck. Der Fußnotenmarker steht unmittelbar bei „versammelt“, dessen Bedeutung die Fußnote erläutert.
