source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: de
  text: 'Seht meine Hände und meine Füße an: Ich bin es selbst.[a] Fasst mich an[b] und seht: Ein Geist[c] hat kein Fleisch und keine Knochen, wie ihr an mir seht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „…, denn ich bin es selbst.“ Der griechische Ausdruck ist nachdrücklich: „Ich selbst bin es.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Betastet mich.“ Das griechische Verb kann ein prüfendes Berühren oder Abtasten bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Gespenst“. Im Griechischen steht „Geist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Seht … an / seht
  rationale: Der Aoristimperativ im Plural fordert zur unmittelbaren visuellen Prüfung auf. Beim ersten Vorkommen ist „seht … an“ im Deutschen natürlich; beim zweiten genügt „seht“.
- source_word: χεῖράς … πόδας
  choice: Hände … Füße
  rationale: Die konkreten Körperteile werden direkt wiedergegeben; sie dienen hier der Feststellung der persönlichen und körperlichen Identität Jesu.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: – ich bin es selbst
  rationale: ἐγώ und αὐτός heben gemeinsam die persönliche Identität nachdrücklich hervor. Der Gedankenstrich gibt den Zusammenhang natürlich wieder, ohne ὅτι eindeutig nur als Inhalts- oder Begründungspartikel festzulegen.
- source_word: ψηλαφήσατέ
  choice: Fasst mich an
  rationale: Das Verb bezeichnet Berühren beziehungsweise tastendes Prüfen. „Fasst mich an“ ist gegenwärtiges, verständliches Deutsch und vermittelt die körperliche Nachprüfung besser als das schwächere „berührt mich“.
- source_word: πνεῦμα
  choice: ein Geist
  rationale: „Geist“ ist die direkte lexikalische Entsprechung und bewahrt die sprachliche Verbindung zum breiteren neutestamentlichen Gebrauch; im Kontext ist ein körperloses Geistwesen gemeint.
- source_word: σάρκα καὶ ὀστέα
  choice: Fleisch und Knochen
  rationale: Die körperlichen Begriffe sind hier wörtlich gebraucht und werden ohne Abschwächung beibehalten.
- source_word: καθὼς
  choice: wie
  rationale: „Wie“ führt die im griechischen Text ausgedrückte Vergleichsbeziehung knapp und idiomatisch ein.
- source_word: θεωρεῖτε
  choice: ihr seht
  rationale: Das Verb kann ein aufmerksames Betrachten bezeichnen; „seht“ ist im Zusammenhang natürlich und bewahrt den empirischen Nachdruck.
- source_word: ἔχοντα
  choice: dass ich sie habe
  rationale: Das auf ἐμέ bezogene Partizip wird im Deutschen als Nebensatz wiedergegeben. Das Pronomen „sie“ nimmt Fleisch und Knochen gemeinsam auf.
theological_decisions:
- issue: Jesu leibliche Wirklichkeit nach der Auferstehung
  choice: Die konkrete Aussage „Fleisch und Knochen“ sowie die Aufforderungen zum Sehen und Anfassen bleiben ausdrücklich erhalten.
  alternative: Eine verallgemeinernde oder abschwächende Wiedergabe, die nur von Jesu Wirklichkeit oder Gegenwart spricht.
  rationale: Der griechische Text stellt die tastbare Körperlichkeit Jesu einem körperlosen Geist gegenüber. Die Übersetzung bewahrt diese Aussage, ohne über den Vers hinaus eine dogmatische Erklärung hinzuzufügen.
- issue: Bedeutung von πνεῦμα im unmittelbaren Kontext
  choice: Geist
  alternative: Gespenst
  rationale: „Geist“ ist die formale Entsprechung und lässt die genaue Vorstellung offen. „Gespenst“ wäre kontextuell möglich, würde aber stärker eine moderne kulturelle Vorstellung eintragen.
- issue: Verhältnis des ersten ὅτι zum vorausgehenden Sehen
  choice: 'Durch Gedankenstrich offen wiedergegeben: „– ich bin es selbst“'
  alternative: „damit ihr erkennt, dass ich es selbst bin“ oder „denn ich bin es selbst“
  rationale: ὅτι kann hier den zu erkennenden Inhalt einführen oder begründend verstanden werden. Die Hauptfassung erhält die Identitätsaussage, ohne diese syntaktische Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative erhalten die unmittelbare, eindringliche Redeweise. „Fasst mich an“ ist alltagssprachlich verständlich, ohne salopp zu wirken; „Fleisch und Knochen“ bewahrt die konkrete körperliche Sprache des Ausgangstextes.
