  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: de
  text: Und nachdem sie ihn angebetet hatten,[a] kehrten sie mit großer Freude nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen „nachdem sie ihn angebetet hatten“ aus. Das griechische Wort kann auch bedeuten: „nachdem sie sich vor ihm niedergeworfen hatten“ oder „nachdem sie ihm gehuldigt hatten“.'
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine stärkere zeitliche Folgerung einzutragen.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das ausdrücklich gesetzte Pronomen wird natürlich wiedergegeben; „sie selbst“ wäre im modernen Deutschen unnötig markiert.
- source_word: προσκυνήσαντες αὐτόν
  choice: nachdem sie ihn angebetet hatten
  rationale: Der Aoristpartizip bezeichnet hier am natürlichsten eine der Rückkehr vorausgehende Handlung. „Anbeten“ entspricht im Kontext des auferstandenen und erhöhten Jesus wahrscheinlich der beabsichtigten Bedeutung, während die mögliche körperliche Geste in der Fußnote berücksichtigt wird.
- source_word: ὑπέστρεψαν
  choice: kehrten ... zurück
  rationale: Gibt die Grundbedeutung präzise und in natürlichem deutschem Erzählstil wieder.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ die idiomatische deutsche Richtungsangabe.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: mit großer Freude
  rationale: Bewahrt sowohl das Substantiv χαρά als auch die Verstärkung durch μεγάλη in klarem, würdigem Deutsch.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber dem auferstandenen Jesus
  choice: ihn angebetet
  alternative: sich vor ihm niedergeworfen / ihm gehuldigt
  rationale: Im Zusammenhang von Auferstehung und Erhöhung ist „anbeten“ eine kontextuell gut begründete Wiedergabe, ohne die christologische Aussage abzuschwächen. Da προσκυνέω zugleich Niederwerfen oder Huldigen bezeichnen kann, bleibt diese echte lexikalische Spannweite in der Fußnote sichtbar.
- issue: Textkritisch unsichere Wendung προσκυνήσαντες αὐτόν
  choice: im Haupttext aufgenommen und mit Fußnote gekennzeichnet
  alternative: weggelassen
  rationale: Die Wendung steht in der vorgelegten SBLGNT-Quelle, ist dort jedoch als textkritisch unsicher markiert. Daher wird sie übersetzt und die abweichende Überlieferung transparent dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält die vorausgehende Handlung des Partizips klar fest; die textkritische und lexikalische Mehrdeutigkeit wird nicht im Haupttext überladen, sondern in einer unmittelbar zugeordneten Fußnote offengelegt.
