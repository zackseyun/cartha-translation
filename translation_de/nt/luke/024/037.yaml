id: LUK.24.37
reference: Luke 24:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: de
  text: Doch sie erschraken und bekamen Angst; sie meinten, einen Geist[a] zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Gespenst«. Das griechische Wort πνεῦμα bedeutet wörtlicher »Geist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: sie erschraken
  rationale: Das Verb bezeichnet eine plötzliche Bestürzung. »Sie erschraken« gibt diese unmittelbare Reaktion im modernen Deutsch natürlich wieder, ohne den nachfolgenden ausdrücklichen Hinweis auf Angst vorwegzunehmen.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier den Gegensatz zwischen Jesu Erscheinen und der erschrockenen Reaktion der Jünger. »Doch« bewahrt diese leichte kontrastive Wendung.
- source_word: ἔμφοβοι γενόμενοι
  choice: bekamen Angst
  rationale: Die Verbindung aus Adjektiv und γενόμενοι bezeichnet den Eintritt in einen Zustand der Furcht. »Bekamen Angst« gibt diesen ingressiven Sinn klar und idiomatisch wieder.
- source_word: ἐδόκουν
  choice: sie meinten
  rationale: Das Imperfekt von δοκέω beschreibt ihre damalige, sich fortsetzende Annahme. »Meinten« ist im Deutschen natürlich und lässt erkennen, dass ihre Wahrnehmung irrig war.
- source_word: πνεῦμα
  choice: einen Geist
  rationale: »Geist« ist die direkte deutsche Entsprechung zu πνεῦμα und bewahrt die Aussage, ohne sie durch volkstümliche Vorstellungen eines Gespenstes stärker auszudeuten.
- source_word: θεωρεῖν
  choice: zu sehen
  rationale: Der Präsensinfinitiv bezeichnet das von ihnen vermeintlich wahrgenommene Sehen. Nach »meinten« ist »zu sehen« die natürliche deutsche Form; eine progressive Umschreibung wäre unidiomatisch.
theological_decisions:
- issue: Wiedergabe von πνεῦμα im Zusammenhang mit der Erscheinung des Auferstandenen
  choice: einen Geist
  alternative: ein Gespenst
  rationale: '»Geist« bleibt näher am griechischen Wortlaut und bewahrt die Spannung der Erzählung: Die Jünger deuten Jesus zunächst als nichtleibliche Erscheinung, während die folgenden Verse diese Deutung korrigieren. »Gespenst« ist als mögliche kontextuelle Wiedergabe in der Fußnote genannt, wird aber nicht in den Haupttext eingetragen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der parallele Reaktionsablauf des griechischen Satzes bleibt erhalten; das Semikolon verhindert eine schwerfällige Häufung von »und«.
