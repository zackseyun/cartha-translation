  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: de
  text: Doch auch einige Frauen aus unserem Kreis haben uns in Erstaunen versetzt[a]; sie waren früh am Morgen zum Grab gegangen[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »haben uns verwirrt« oder »bestürzt«. Das griechische Verb kann starke Überraschung oder Verunsicherung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei Tagesanbruch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Doch auch
  rationale: Bewahrt sowohl den Gegensatz zur zuvor geäußerten Enttäuschung als auch den ergänzenden, überraschenden Gedanken.
- source_word: γυναῖκές τινες
  choice: einige Frauen
  rationale: Gibt die unbestimmte Mehrzahl in natürlichem modernem Deutsch wieder.
- source_word: ἐξ ἡμῶν
  choice: aus unserem Kreis
  rationale: Macht deutlich, dass die Frauen zur Gemeinschaft der Jünger gehörten.
- source_word: ἐξέστησαν ἡμᾶς
  choice: haben uns in Erstaunen versetzt
  rationale: Drückt starke Überraschung aus, ohne festzulegen, ob die Reaktion vor allem Staunen, Verwirrung oder Bestürzung war.
- source_word: γενόμεναι ὀρθριναὶ
  choice: sie waren früh am Morgen … gegangen
  rationale: Gibt die idiomatische Partizipialkonstruktion in natürlichem Deutsch wieder und macht den im Zusammenhang naheliegenden Gang zum Grab ausdrücklich.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: zum Grab
  rationale: ἐπί mit Akkusativ legt hier eine Bewegung auf das Grab zu nahe; „Grab“ ist im Deutschen die natürliche Bezeichnung.
theological_decisions:
- issue: Bedeutungsumfang von ἐξέστησαν im Bericht über die Auferstehung
  choice: in Erstaunen versetzt
  alternative: verwirrt / bestürzt
  rationale: 'Die Formulierung wahrt die erzählerische Spannung: Sie bezeichnet eine starke Reaktion, ohne den Jüngern bereits Glauben oder entschiedenen Unglauben zuzuschreiben.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolonanschluss erhält den engen Zusammenhang der griechischen Partizipialkonstruktion, ohne im Deutschen schwerfällig zu wirken.
