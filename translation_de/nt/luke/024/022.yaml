  source_fidelity: Die Übersetzung gibt ἀλλὰ καί mit „Doch auch“ angemessen adversativ und additiv wieder. „Einige Frauen aus unserem Kreis“ trifft γυναῖκές τινες ἐξ ἡμῶν idiomatisch und bewahrt die Zugehörigkeit zur Jüngergruppe. „Haben uns in Erstaunen versetzt“ gibt ἐξέστησαν ἡμᾶς treffend wieder, ohne die Reaktion einseitig als Glauben, Unglauben oder bloße Verwirrung festzulegen. Die Umschreibung „sie waren früh am Morgen zum Grab gegangen“ ist eine natürliche deutsche Entfaltung von γενόμεναι ὀρθριναὶ ἐπὶ τὸ μνημεῖον und wahrt die zeitlich vorausliegende Handlung sowie die Bewegungsrichtung von ἐπί mit Akkusativ.
