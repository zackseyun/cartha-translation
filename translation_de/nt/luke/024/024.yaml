  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: de
  text: Und einige von denen, die bei uns waren, gingen zum Grab und fanden es so vor, wie es auch die Frauen gesagt hatten; ihn aber sahen sie nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: gingen
  rationale: Das Aoristverb beschreibt hier schlicht den Weg zum Grab. „Gingen“ ist natürlich und hebt nicht unnötig den Aufbruch hervor.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: einige von denen, die bei uns waren
  rationale: Diese Wiedergabe bewahrt die offene Gruppenbezeichnung und bleibt näher an der griechischen Struktur als das stärker deutende „einige unserer Gefährten“.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet in diesem Zusammenhang die Grabstätte Jesu; „Grab“ ist im Deutschen die übliche und präzise Bezeichnung.
- source_word: εὗρον οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: fanden es so, wie auch die Frauen gesagt hatten
  rationale: Die Formulierung gibt die bestätigte Übereinstimmung mit dem Bericht der Frauen wieder. „Auch“ bildet καί ausdrücklich ab, während das Plusquamperfekt die zeitliche Abfolge im Deutschen verdeutlicht.
- source_word: αὐτὸν δὲ οὐκ εἶδον
  choice: ihn aber sahen sie nicht
  rationale: 'Die vorangestellte Pronomenform und „aber“ bewahren den Kontrast: Der Bericht über das Grab wurde bestätigt, Jesus selbst wurde jedoch nicht gesehen. „Sahen“ entspricht ὁράω und darf nicht zu „fanden“ umgedeutet werden.'
theological_decisions:
- issue: Wortlaut des Auferstehungsberichts
  choice: Die Besucher bestätigen den Bericht der Frauen über das Grab, sehen Jesus selbst jedoch nicht.
  alternative: Den Vers durch Einzelheiten aus parallelen Berichten zu erläutern oder zu harmonisieren.
  rationale: Die Übersetzung erhält die erzählerische Unterscheidung und Spannung des griechischen Textes, ohne zusätzliche Angaben aus anderen Berichten einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die leicht markierte Wortstellung „ihn aber sahen sie nicht“ spiegelt den griechischen Kontrast und bleibt idiomatisch.
