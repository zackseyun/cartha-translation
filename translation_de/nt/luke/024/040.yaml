lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Ein schlichter Anschluss, der den Erzählfluss wahrt, ohne eine stärkere zeitliche Bedeutung einzutragen.
- source_word: τοῦτο εἰπὼν
  choice: nachdem er dies gesagt hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der des Hauptverbs vorausgeht; die gewählte Formulierung gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: ἔδειξεν
  choice: zeigte
  rationale: δείκνυμι bedeutet hier, etwas sichtbar zu zeigen; „zeigte“ ist direkt und idiomatisch.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Personen, denen Jesus seine Hände und Füße zeigte.
- source_word: τὰς χεῖρας
  choice: seine Hände
  rationale: Der griechische Artikel wird im Deutschen bei eigenen Körperteilen kontextgemäß durch das Possessivpronomen wiedergegeben.
- source_word: τοὺς πόδας
  choice: seine Füße
  rationale: Wie bei „seine Hände“ entspricht das Possessivpronomen dem natürlichen deutschen Ausdruck für eigene Körperteile.
theological_decisions:
- issue: Textkritischer Status des gesamten Verses
  choice: Im Haupttext aufgenommen und mit einer textkritischen Fußnote versehen
  alternative: Den gesamten Satz aus dem Haupttext auslassen
  rationale: Der SBLGNT setzt den gesamten Vers in doppelte eckige Klammern und kennzeichnet damit erhebliche Zweifel an seiner Ursprünglichkeit. Da die vorgelegte Ausgangsausgabe den Satz enthält, wird er übersetzt; die abweichende Überlieferung wird transparent in der Fußnote dokumentiert.
