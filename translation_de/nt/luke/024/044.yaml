id: LUK.24.44
reference: Luke 24:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: de
  text: 'Dann sagte er zu ihnen: „Das sind meine Worte, die ich zu euch gesprochen habe, als ich noch bei euch war: Alles, was im Gesetz des Mose, in den Propheten und in den Psalmen über mich geschrieben steht, muss erfüllt werden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Gesetz des Mose, die Propheten und die Psalmen“ bezeichnet wahrscheinlich die großen Bereiche der Schriften Israels. Mit den „Psalmen“ kann entweder der Psalter selbst oder umfassender der dritte Schriftbereich, die „Schriften“, gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Dann sagte er zu ihnen
  rationale: δέ führt die Erzählung leicht weiter; „Dann“ gibt diesen Übergang im modernen Deutschen natürlich wieder. πρός mit Personen nach einem Verb des Sprechens wird mit „zu ihnen“ übersetzt.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Das sind meine Worte
  rationale: Die demonstrative Konstruktion wird idiomatisch wiedergegeben; λόγοι bleibt mit „Worte“ nah am Ausgangstext.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: die ich zu euch gesprochen habe
  rationale: λαλέω bedeutet hier „sprechen“; das Perfekt ist im Deutschen in direkter Rede natürlich und bewahrt den Bezug auf Jesu frühere Äußerungen.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: als ich noch bei euch war
  rationale: Die Partizipialkonstruktion hat zeitlichen Sinn. „noch“ gibt ἔτι wieder, „bei euch“ das σύν mit Dativ.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet den Inhalt der zuvor genannten Worte ein. Im Deutschen markiert ein Doppelpunkt diesen Übergang klarer und natürlicher als ein isoliertes „dass“ nach „Das sind meine Worte“.
- source_word: δεῖ πληρωθῆναι
  choice: muss erfüllt werden
  rationale: Die Formulierung bewahrt sowohl die Notwendigkeit von δεῖ als auch den schriftbezogenen Erfüllungssinn von πληρόω.
- source_word: πάντα τὰ γεγραμμένα
  choice: Alles, was … geschrieben steht
  rationale: „Alles“ erhält die umfassende Kraft von πάντα; „geschrieben steht“ gibt den fortdauernden Geltungsaspekt des griechischen Perfekts idiomatisch wieder.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: im Gesetz des Mose, in den Propheten und in den Psalmen
  rationale: Die Bezeichnungen werden als Namen anerkannter Schriftbereiche großgeschrieben. Die dreifache Präposition ist im Deutschen zur syntaktischen Klarheit ergänzt.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: περί mit Genitiv bezeichnet hier den Gegenstand oder Bezug; „über mich“ ist die klare, natürliche deutsche Entsprechung.
theological_decisions:
- issue: Tragweite der schriftgemäßen Notwendigkeit
  choice: „muss erfüllt werden“
  alternative: „sollte erfüllt werden“ oder „musste sich bewahrheiten“
  rationale: Die Übersetzung erhält die starke Notwendigkeit von δεῖ, ohne eine bestimmte Theorie darüber einzutragen, wie Schrift erfüllt wird.
- issue: Bedeutung von „Gesetz des Mose, Propheten und Psalmen“
  choice: Als benannte Schriftbereiche übersetzen und die genaue Reichweite in einer Fußnote offenhalten
  alternative: „Psalmen“ ausdrücklich als Sammelbezeichnung für alle Schriften deuten
  rationale: Der Wortlaut legt größere Bereiche der Schriften Israels nahe, entscheidet aber nicht eindeutig, ob „Psalmen“ nur den Psalter oder stellvertretend den dritten Kanonteil bezeichnet.
- issue: Bezug von περὶ ἐμοῦ
  choice: „über mich“ unmittelbar mit „geschrieben steht“ verbinden
  alternative: „was mich betrifft“
  rationale: Die gewählte Stellung entspricht dem Sinn des griechischen Satzes, ohne näher festzulegen, auf welche Weise einzelne Schrifttexte auf Jesus bezogen sind.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Syntax bleibt nahe am Griechischen, wird aber durch den Doppelpunkt und die wiederholte Präposition natürlich deutsch gestaltet. Der Fußnotenmarker [a] steht im Haupttext und erläutert eine echte historische und kanongeschichtliche Mehrdeutigkeit.
