lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche koordinierende Konjunktion bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἐμνήσθησαν
  choice: sie erinnerten sich
  rationale: Die aoristische deponente Form wird ihrem Sinn entsprechend aktiv wiedergegeben. „Sich erinnern“ ist im modernen Standarddeutsch natürlich und unmittelbar.
- source_word: τῶν ῥημάτων
  choice: an seine Worte
  rationale: ῥῆμα bezeichnet hier Gesprochenes. „Worte“ ist eine knappe, natürliche Wiedergabe; möglich sind auch „Aussprüche“ oder „das, was er gesagt hatte“.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Genitivpronomen bezieht sich im Kontext auf Jesus. Die pronominale Ausdrucksweise des Griechischen bleibt erhalten, statt den Namen erläuternd einzusetzen.
theological_decisions: []
translation_notes:
