  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: de
  text: 'Und es geschah, während sie darüber ratlos waren: Siehe, zwei Männer traten zu ihnen in Kleidung, die blendend hell leuchtete.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in Kleidung, die wie ein Blitz aufleuchtete«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: geschah es
  rationale: Bewahrt die für Lukas typische ereigniseinleitende Wendung, ohne auf das altertümlichere »es begab sich« zurückzugreifen.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: während sie darüber ratlos waren
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv ist temporal. »Ratlos« gibt wieder, dass die Frauen keinen Ausweg beziehungsweise keine Erklärung wussten, nicht bloß, dass sie sich wunderten.
- source_word: περὶ τούτου
  choice: darüber
  rationale: Die knappe deutsche Pronominalform verweist natürlich auf den unmittelbar zuvor geschilderten Sachverhalt.
- source_word: ἰδοὺ
  choice: Siehe
  rationale: Das Aufmerksamkeitssignal bleibt ausdrücklich erhalten und hebt die überraschende neue Erscheinung hervor. »Plötzlich« wäre stärker deutend.
- source_word: ἄνδρες δύο
  choice: zwei Männer
  rationale: Entspricht der unmittelbaren Darstellung des Verses und greift der später aus dem Zusammenhang erkennbaren Identität als himmlische Boten nicht vor.
- source_word: ἐπέστησαν αὐταῖς
  choice: standen bei ihnen
  rationale: Bewahrt den räumlichen Sinn des plötzlichen Dabeistehens, ohne das stärker interpretierende »erschienen ihnen« zu verwenden.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: in blendend heller Kleidung
  rationale: Gibt die außergewöhnliche, blitzartige Helligkeit in natürlichem Deutsch wieder; das konkrete Blitzbild wird in der Fußnote bewahrt.
theological_decisions:
- issue: Identität der beiden Gestalten
  choice: »zwei Männer«
  alternative: »zwei Engel«
  rationale: Der griechische Text dieses Verses nennt sie Männer. Ihre Identität als himmlische Boten erschließt sich aus dem weiteren Zusammenhang und wird nicht vorzeitig in den Vers eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Siehe« erhält die markierte Aufmerksamkeitspartikel des griechischen Erzählstils; die übrige Formulierung vermeidet altertümliche Wendungen. Der Fußnotenmarker steht unmittelbar nach der Wendung, auf die sich die Anmerkung bezieht.
