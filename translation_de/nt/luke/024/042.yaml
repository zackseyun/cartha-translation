  text: And they gave him a piece of broiled fish[a].
translation:
  language: de
  text: Da gaben sie ihm ein Stück gebratenen Fisch[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige spätere Handschriften fügen hinzu: „und von einer Honigwabe“.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: Da sie
  rationale: οἱ wird substantivisch als „sie“ verstanden und verweist auf die versammelten Jünger; δέ ist ein leichter Anschluss. Die Wortfolge „Da gaben sie“ stellt im Deutschen einen natürlichen erzählerischen Fortgang her, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐπέδωκαν
  choice: gaben
  rationale: Der Aorist Aktiv Indikativ von ἐπιδίδωμι bezeichnet hier das Geben beziehungsweise Überreichen. „gaben“ ist im Kontext direkt und idiomatisch.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet den indirekten Empfänger und wird im Deutschen natürlich mit „ihm“ wiedergegeben.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: ein Stück gebratenen Fisch
  rationale: μέρος ist das Bezugswort „Stück“; der Genitiv ἰχθύος ὀπτοῦ gibt an, woraus es bestand. „gebratener Fisch“ ist eine natürliche moderne Wiedergabe für Fisch, der durch direkte Hitze gegart wurde.
- source_word: ὀπτοῦ
  choice: gebratenen
  rationale: ὀπτός bezeichnet durch Rösten oder Braten gegarte Speise. „gebraten“ ist im heutigen Standarddeutsch verständlich und kulinarisch natürlicher als das enger oder altertümlicher wirkende „geröstet“.
theological_decisions:
- issue: Textgestalt von Lukas 24,42
  choice: 'Nur den SBLGNT-Text übersetzen: „ein Stück gebratenen Fisch“'
  alternative: Einige spätere Handschriften ergänzen „und von einer Honigwabe“.
  rationale: Der vorgegebene griechische Text endet mit μέρος und enthält die längere Lesart nicht. Die Übersetzung folgt dem kritischen Ausgangstext; die spätere Ergänzung wird aus Gründen der Texttransparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der knappe erzählerische Stil des griechischen Verses bleibt erhalten; der leichte Anschluss durch δέ wird idiomatisch mit „Da“ wiedergegeben.
