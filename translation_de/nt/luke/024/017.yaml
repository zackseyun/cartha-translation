source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Was sind das für Worte, die ihr im Gehen miteinander austauscht?“ Da blieben sie traurig stehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da blieben sie mit niedergeschlagener Miene stehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Da sagte er zu ihnen
  rationale: λέγω wird mit dem gewöhnlichen „sagen“ wiedergegeben; δέ führt die Erzählung leicht weiter und wird im Deutschen natürlich durch „Da“ ausgedrückt.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Was sind das für Worte
  rationale: Die Wiedergabe bewahrt das konkrete λόγοι („Worte“), bezeichnet im Zusammenhang aber die gerade geführte Unterhaltung.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: die ihr miteinander wechselt
  rationale: ἀντιβάλλω bezeichnet hier den wechselseitigen Austausch von Worten; „miteinander wechseln“ erhält diese reziproke Bedeutung.
- source_word: περιπατοῦντες
  choice: im Gehen
  rationale: Das gleichzeitige Partizip bezeichnet, dass ihr Gespräch während des Weges stattfindet; „im Gehen“ ist knapp und natürlich.
- source_word: ἐστάθησαν
  choice: blieben ... stehen
  rationale: Die Form von ἵστημι beschreibt hier das Anhalten beziehungsweise Zum-Stillstand-Kommen.
- source_word: σκυθρωποί
  choice: traurig
  rationale: Das Adjektiv bezeichnet einen sichtbar traurigen oder niedergeschlagenen Gesichtsausdruck; im Deutschen vermittelt „traurig“ dies natürlich, ohne zusätzliche Deutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relativ formale Wendung „Worte ... miteinander wechselt“ bewahrt das Bild des griechischen Textes; die Fußnote verdeutlicht die auf den Gesichtsausdruck bezogene Nuance von σκυθρωποί.
