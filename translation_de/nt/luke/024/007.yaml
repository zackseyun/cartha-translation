  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: de
  text: 'Er sagte: »Der Menschensohn muss in die Hände sündiger Menschen ausgeliefert[a] und gekreuzigt werden und am dritten Tag auferstehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »übergeben« bzw. »in die Hände sündiger Menschen übergeben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wieder auferstehen«; im Griechischen steht hier eine aktive, keine passive Form (anders als bei »auferweckt werden«).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Er sagte
  rationale: Das präsentische Partizip führt den erinnerten Ausspruch Jesu ein. Im Deutschen gibt ein finiter Einleitungssatz mit Doppelpunkt den Zusammenhang natürlich und klar wieder.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte Wiedergabe bewahrt den Charakter als Selbstbezeichnung sowie die Bezüge zu Daniel und zum übrigen Evangeliengebrauch.
- source_word: ὅτι δεῖ
  choice: muss
  rationale: δεῖ bezeichnet hier Notwendigkeit, im lukanischen Zusammenhang insbesondere die Notwendigkeit innerhalb von Gottes Heilsplan, nicht nur eine Vorhersage.
- source_word: παραδοθῆναι
  choice: ausgeliefert werden
  rationale: Das passive Verb bezeichnet die Übergabe in die Gewalt anderer. »Ausgeliefert werden« ist im Deutschen präzise und umfasst mehr als allein den Verrat durch Judas.
- source_word: εἰς χεῖρας
  choice: in die Hände
  rationale: Die natürliche deutsche Entsprechung bewahrt das Bild der Übergabe in die Macht anderer.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: sündiger Menschen
  rationale: Die Wiedergabe entspricht der allgemeinen Personenbezeichnung ἀνθρώπων und dem attributiven ἁμαρτωλῶν, ohne die handelnden Personen unnötig enger zu bestimmen.
- source_word: σταυρωθῆναι
  choice: gekreuzigt werden
  rationale: Dies ist die genaue und geläufige Wiedergabe des passiven Infinitivs.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Der temporale Dativ wird im modernen Deutschen idiomatisch mit »am« wiedergegeben.
- source_word: ἀναστῆναι
  choice: auferstehen
  rationale: Der griechische Infinitiv ist aktiv. »Auferstehen« ist im Deutschen die geläufige aktive Bezeichnung für die Rückkehr vom Tod zum Leben.
theological_decisions:
- issue: Bedeutung von δεῖ in der Leidensankündigung
  choice: muss, als Ausdruck göttlicher Notwendigkeit
  alternative: würde, als bloße Vorhersage
  rationale: Im Lukasevangelium kennzeichnet δεῖ regelmäßig die Notwendigkeit der Erfüllung von Gottes Heilsplan. »Muss« bewahrt dieses Gewicht, ohne die Aussage weiter auszudeuten.
- issue: Aktive Form von ἀναστῆναι
  choice: auferstehen
  alternative: auferweckt werden
  rationale: Der Ausgangstext verwendet einen aktiven Infinitiv. Die aktive Wiedergabe bewahrt diese grammatische Perspektive, ohne andere neutestamentliche Aussagen über Gottes Auferweckung Jesu auszuschließen.
- issue: Referenz von ἀνθρώπων ἁμαρτωλῶν
  choice: sündige Menschen
  alternative: sündige Männer
  rationale: ἀνθρώπων ist zwar morphologisch maskulin, bezeichnet im Griechischen jedoch Menschen bzw. Personen. Der Vers selbst hebt das biologische Geschlecht der Handelnden nicht ausdrücklich als Aussageinhalt hervor; »Menschen« bewahrt daher den lexikalischen Umfang.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Ton. Die direkte Rede macht die Funktion von λέγων im Deutschen deutlich. Die parallelen Infinitive werden durch »ausgeliefert und gekreuzigt werden … und … auferstehen« knapp und natürlich verbunden.
