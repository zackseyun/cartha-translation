  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: de
  text: 'Und sieh da: Zwei von ihnen waren an eben diesem Tag unterwegs zu einem Dorf, das sechzig Stadien[a] von Jerusalem entfernt war und Emmaus hieß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war ein antikes Längenmaß. Sechzig Stadien entsprechen ungefähr elf Kilometern.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Und sieh da
  rationale: Bewahrt den aufmerksamkeitslenkenden Erzählmarker des Lukas in einer geläufigen, würdevollen deutschen Wendung.
- source_word: δύο ἐξ αὐτῶν
  choice: zwei von ihnen
  rationale: Gibt den partitiven Ausdruck natürlich wieder, ohne die größere Gruppe näher zu bestimmen, als es der griechische Text tut.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: noch an eben diesem Tag
  rationale: „Eben diesem“ wahrt die Betonung der Identität des Tages; „noch“ stellt im Deutschen natürlich den zeitlichen Anschluss an das zuvor Erzählte her.
- source_word: ἦσαν πορευόμενοι
  choice: waren unterwegs
  rationale: Gibt die andauernde Bewegung der periphrastischen Imperfektform idiomatisch und ohne unnötige Präzisierung wieder.
- source_word: εἰς κώμην
  choice: zu einem Dorf
  rationale: κώμη bezeichnet ein Dorf; „zu“ ist bei „unterwegs sein“ die natürliche Richtungsangabe.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: das sechzig Stadien von Jerusalem entfernt war
  rationale: Bewahrt das antike Entfernungsmaß im Haupttext und gibt die attributive Partizipialkonstruktion in natürlichem Deutsch wieder.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: und Emmaus hieß
  rationale: Gibt die Namensformel knapp und idiomatisch wieder; „dessen Name Emmaus war“ wäre zwar formnäher, klänge im heutigen Deutsch jedoch schwerfällig.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Und sieh da“ erhält den markanten lukanischen Aufmerksamkeitsruf, während die übrige Syntax zugunsten natürlicher deutscher Lesbarkeit behutsam geglättet wird.
