source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: de
  text: 'Als die Frauen erschraken und ihre Gesichter zur Erde neigten, sagten die beiden Männer zu ihnen: »Was sucht ihr den Lebenden bei den Toten?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Warum sucht ihr den Lebenden unter den Toten?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων δὲ γενομένων αὐτῶν
  choice: Als die Frauen erschraken
  rationale: Der Genitivus absolutus bezeichnet den begleitenden Umstand vor dem Hauptverb. »erschraken« gibt die eintretende Furcht natürlich wieder; »die Frauen« klärt im Deutschen den Bezug des griechischen Pronomens aus dem Kontext.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: und ihre Gesichter zur Erde neigten
  rationale: Die Wendung bewahrt das konkrete Bild des Beugens beziehungsweise Senkens zur Erde und lässt sowohl Furcht als auch ehrfürchtige Reaktion erkennen, ohne sie ausdrücklich zu deuten.
- source_word: εἶπαν πρὸς αὐτάς
  choice: sagten sie zu ihnen
  rationale: 'Die Pronomenstruktur des Griechischen bleibt erhalten: Die Männer beziehungsweise Engel sprechen zu den Frauen.'
- source_word: Τί ζητεῖτε
  choice: Was sucht ihr
  rationale: τί bedeutet unmittelbar »was«. Anders als im Englischen ist »Was sucht ihr ...?« im Deutschen natürlich und bewahrt die Form und die leicht offene Stoßrichtung der Frage.
- source_word: τὸν ζῶντα
  choice: den Lebenden
  rationale: Das substantivierte Partizip ist maskulin, singularisch und persönlich. »den Lebenden« bezeichnet Jesus als den, der lebt, im Gegensatz zu den Toten.
- source_word: μετὰ τῶν νεκρῶν
  choice: bei den Toten
  rationale: μετά mit Genitiv bedeutet »mit/bei«. »bei den Toten« ist idiomatisches Deutsch und bewahrt zugleich mehr von der griechischen Präposition als eine stärker deutende Formulierung.
theological_decisions:
- issue: Auferstehungsbezug von τὸν ζῶντα
  choice: den Lebenden
  alternative: den, der lebt
  rationale: Die substantivische Form wahrt den pointierten Gegensatz zwischen Jesus als Lebendem und den Toten, ohne eine erklärende Aussage über die Auferstehung in den Wortlaut einzufügen.
- issue: Sinn von Τί ζητεῖτε im Kontext
  choice: Was sucht ihr
  alternative: Warum sucht ihr
  rationale: Die Übersetzung erhält den unmittelbaren Fragewortlaut des Griechischen. Der Kontext lässt zugleich die tadelnde Sinnrichtung »Warum sucht ihr ...?« erkennen; diese wird in der Fußnote kenntlich gemacht, aber nicht im Haupttext festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frauen werden am Anfang ausdrücklich genannt, um die im Deutschen sonst schwer verständliche Folge weiblicher und männlicher Pronomen zu klären. Die Frage bleibt knapp und pointiert; die Fußnote bewahrt die mögliche sinngemäße Wiedergabe mit »Warum« beziehungsweise »unter«.
