source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: de
  text: 'Da geschah Folgendes: Als er mit ihnen zu Tisch lag[a], nahm er das Brot, sprach den Segen darüber, brach es und begann, es ihnen zu geben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihnen zum Essen niedergelassen hatte“. Das griechische Wort bezeichnet hier genauer das Liegen bei Tisch, wie es in der Antike üblich war.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gab es ihnen“ beziehungsweise „teilte es ihnen aus“. Der griechische Imperfekt kann den fortdauernden Vorgang oder dessen Beginn hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Da geschah es
  rationale: Die lukanische Erzählformel bleibt als Übergangssignal erhalten, klingt aber weniger altertümlich als „Und es begab sich“.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: Als er mit ihnen zu Tisch lag
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv ist temporal. κατακλίνω bezeichnet im Zusammenhang einer Mahlzeit das antike Liegen bei Tisch; die knappe deutsche Form bewahrt diesen kulturellen Hintergrund.
- source_word: λαβὼν τὸν ἄρτον
  choice: nahm er das Brot
  rationale: Das Partizip wird für einen natürlichen deutschen Satz als finites Verb wiedergegeben; der bestimmte Artikel bezeichnet das bei der Mahlzeit vorhandene Brot.
- source_word: εὐλόγησεν
  choice: sprach den Segen darüber
  rationale: Im Mahlkontext bezeichnet εὐλογέω das Sprechen eines Segens über dem Brot. Diese Formulierung ist im Deutschen natürlicher als „segnete es“ und unterscheidet das Verb von εὐχαριστέω, ohne den Vorgang theologisch auszuweiten.
- source_word: κλάσας
  choice: brach es
  rationale: Das aoristische Partizip bezeichnet das dem Austeilen vorausgehende Brechen. Die koordinierte deutsche Verbfolge gibt die zeitliche Abfolge klar und idiomatisch wieder.
- source_word: ἐπεδίδου
  choice: begann, es ihnen zu geben
  rationale: Der Imperfekt kann den einsetzenden oder fortdauernden Vorgang des Austeilens hervorheben. Die gewählte Fassung bildet den Beginn der Handlung im Erzählzusammenhang ab; die durative Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Mögliche eucharistische beziehungsweise sakramentale Anklänge der Mahlhandlungen
  choice: Die gewöhnlichen Mahlhandlungen werden ohne sakramentale Deutung wiedergegeben.
  alternative: Eine Formulierung, die ausdrücklich oder verstärkt an das Abendmahl erinnert.
  rationale: Die Folge von Nehmen, Segnen, Brechen und Geben kann frühere Speisungserzählungen und das Abendmahl anklingen lassen. Der Vers selbst bezeichnet die Handlung jedoch nicht ausdrücklich als Sakrament; daher bleibt die Übersetzung bei der erzählten Tischhandlung und wahrt die mögliche theologische Resonanz ohne konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu Tisch lag“ bewahrt knapp die antike Speisepraxis; die Fußnote erklärt die heute ungewohnte Ausdrucksweise. Die Erzählformel und die Abfolge der Handlungen bleiben sichtbar, ohne archaische oder konfessionell geprägte Erweiterungen.
