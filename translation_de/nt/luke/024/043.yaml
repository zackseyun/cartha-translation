  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: de
  text: Und er nahm es[a] und aß es vor ihren Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen nur „genommen“ und „aß“; das Objekt ist aus dem vorherigen Vers zu ergänzen: das Stück Fisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Der einfache Anschluss führt die Handlung aus dem vorherigen Vers fort, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: λαβὼν
  choice: er nahm es
  rationale: Das adverbiale Aoristpartizip bezeichnet die der Haupthandlung vorausgehende Handlung. Im natürlichen Deutschen lässt sich die Abfolge passend durch zwei finite Verben wiedergeben; das Objekt „es“ wird aus Vers 42 ergänzt.
- source_word: ἐνώπιον αὐτῶν
  choice: vor ihren Augen
  rationale: Die Wendung bezeichnet eine Handlung in ihrer sichtbaren Gegenwart. „Vor ihren Augen“ klingt im modernen Deutsch natürlich und erhält den Zeugnischarakter der Szene.
- source_word: ἔφαγεν
  choice: aß es
  rationale: Der Aorist erzählt die abgeschlossene Handlung. Das im Griechischen ausgelassene, aus dem vorherigen Vers erschließbare Objekt wird im Deutschen ausdrücklich aufgenommen.
theological_decisions:
- issue: Soll das im Griechischen nur implizite Objekt ausdrücklich genannt werden?
  choice: Das Objekt wird bei beiden Verben mit „es“ ergänzt.
  alternative: „Und nachdem er genommen hatte, aß er vor ihren Augen.“
  rationale: Im Griechischen ist das Objekt aus dem vorherigen Vers, dem Stück Fisch, eindeutig erschließbar. Die Ergänzung sorgt für natürliches und klares Deutsch, ohne den Inhalt theologisch auszudeuten.
- issue: Wie soll ἐνώπιον αὐτῶν wiedergegeben werden?
  choice: „vor ihren Augen“
  alternative: „in ihrer Gegenwart“
  rationale: „Vor ihren Augen“ bewahrt die sinnlich wahrnehmbare Dimension der Szene, ohne eine Erklärung über die leibliche Auferstehung in den Vers hineinzutragen.
translation_notes:
  register: Modernes, klares und würdevolles Erzähldeutsch. Die griechische Partizipialkonstruktion wird idiomatisch als Folge zweier finiter Verben wiedergegeben; die Fußnote macht die Ergänzung des unausgesprochenen Objekts transparent.
