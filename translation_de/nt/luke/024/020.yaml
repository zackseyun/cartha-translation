  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: de
  text: und wie unsere Hohenpriester und führenden Männer ihn zur Verurteilung zum Tod auslieferten und ihn kreuzigten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließen ihn kreuzigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: und wie
  rationale: ὅπως führt hier den weiteren Inhalt des Berichts ein; τε verbindet ihn mit dem Vorangehenden. „Und wie“ gibt den Erzählfluss natürlich wieder.
- source_word: παρέδωκαν
  choice: auslieferten
  rationale: παραδίδωμι bezeichnet hier die Übergabe Jesu an das gerichtliche Verfahren und die Hinrichtung. „Auslieferten“ ist im Deutschen natürlich und bewahrt die Verantwortungszuweisung, ohne den engeren Sinn „verrieten“ einzutragen.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die hohepriesterliche Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ ist für heutige Leser verständlich und sachlich präzise.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: unsere Obersten
  rationale: ἄρχοντες meint die maßgeblichen jüdischen Führungspersonen. „Obersten“ bewahrt den formell-politischen Klang und das ausdrücklich vorhandene „unsere“.
- source_word: εἰς κρίμα θανάτου
  choice: dem Todesurteil
  rationale: κρίμα bezeichnet hier Urteil beziehungsweise Verurteilung; θανάτου bestimmt es als Todesurteil. Mit „jemanden dem Todesurteil ausliefern“ wird der gerichtliche Sinn im Deutschen knapp und idiomatisch ausgedrückt.
- source_word: ἐσταύρωσαν
  choice: kreuzigten
  rationale: Das aktive Verb schreibt den zuvor genannten Führenden die Tat unmittelbar zu. Die direkte Wiedergabe bewahrt die rhetorische und moralische Verantwortungszuweisung des griechischen Textes.
theological_decisions:
- issue: Verantwortung für Jesu Hinrichtung
  choice: „sie … kreuzigten ihn“ mit direkter grammatischer Handlungszuschreibung
  alternative: „sie ließen ihn kreuzigen“
  rationale: Im Griechischen steht ein aktives Verb mit den führenden Priestern und Obersten als Subjekt. Die direkte Form wahrt diese Verantwortungszuschreibung; die Alternative würde die historische Ausführung durch römische Organe verdeutlichen, zugleich aber eine im Wortlaut nicht ausdrücklich markierte Kausativkonstruktion eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Priester“ vermeidet das mögliche Missverständnis mehrerer amtierender Hohepriester; „Obersten“ erhält den formellen Ton des gerichtlichen Zusammenhangs.
