  text: ⸂εἰσελθοῦσαι δὲ⸃ οὐχ εὗρον τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: de
  text: Doch als sie hineingingen, fanden sie den Leib nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: »den Leib des Herrn Jesus«.'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: als sie hineingingen
  rationale: Das feminine Partizip im Aorist bezieht sich auf die Frauen und wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben.
- source_word: δὲ
  choice: Doch
  rationale: 'Die Partikel führt die Erzählung mit einem leichten Gegensatz weiter: Die Frauen gehen hinein, finden dort jedoch nicht, was sie erwarten.'
- source_word: οὐχ εὗρον
  choice: fanden sie … nicht
  rationale: Die schlichte Verneinung des Aorist wird idiomatisch und ohne zusätzliche Deutung wiedergegeben.
- source_word: τὸ σῶμα
  choice: den Leichnam
  rationale: Im Grabkontext bezeichnet σῶμα den toten Körper. „Leichnam“ ist im modernen Deutschen natürlich und würdevoll, ohne die Identität ausdrücklich zu ergänzen.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, wessen Leichnam gemeint ist
  choice: den Leichnam
  alternative: den Leichnam des Herrn Jesus
  rationale: Der vorgelegte SBLGNT-Text bietet nur τὸ σῶμα. Die längere Lesart wird daher nicht in den Haupttext aufgenommen, sondern als Textvariante in einer Fußnote genannt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Erzählregister. „Doch“ bildet den milden Kontrast ab; „hineingingen“ macht den räumlichen Bezug auf das Grab natürlich deutlich.
