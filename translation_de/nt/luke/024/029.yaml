source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: de
  text: 'Und sie drängten ihn eindringlich und sagten: »Bleib bei uns, denn es geht auf den Abend zu, und der Tag hat sich schon geneigt.« Und er ging hinein, um bei ihnen zu bleiben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: sie drängten ihn
  rationale: Das Verb bezeichnet hier nachdrückliches, beharrliches Bitten, nicht körperlichen Zwang. »Sie drängten ihn« bewahrt die Intensität und klingt im modernen Deutsch natürlich.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Bleib bei uns
  rationale: Der Imperativ von μένω bezeichnet in diesem gastfreundschaftlichen Zusammenhang das Bleiben über den Abend; μετά mit Genitiv drückt Begleitung beziehungsweise Gemeinschaft aus.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: denn es geht auf den Abend zu
  rationale: Die Formulierung gibt die Annäherung an den Abend wieder und vermeidet die stärkere Aussage, der Abend sei bereits vollständig angebrochen.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: der Tag hat sich schon geneigt
  rationale: Die Wiedergabe erhält das Bild des sich neigenden Tages und entspricht dem perfektischen Aspekt, ohne altertümlich zu wirken.
- source_word: εἰσῆλθεν
  choice: ging er hinein
  rationale: Die Wendung ist im deutschen Erzählstil natürlich und gibt den Eintritt in die nicht näher bezeichnete Unterkunft wieder.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: um bei ihnen zu bleiben
  rationale: Der artikulierte Infinitiv wird hier sinnvoll als Zweckangabe verstanden; σύν bezeichnet die Gemeinschaft mit ihnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bildhafter, aber verständlicher Ausdrucksweise. Die Wiederholung von »bleiben« spiegelt die Wiederaufnahme von μένω im griechischen Text. Das abschließende καί wird narrativ natürlich mit »Da« wiedergegeben, ohne einen ausdrücklich kausalen Zusammenhang hinzuzufügen.
