  to: 'Und sie drängten ihn eindringlich und sagten: »Bleib bei uns, denn es geht auf den Abend zu, und der Tag hat sich schon geneigt.« Und er ging hinein, um bei ihnen zu bleiben.'
  rationale: Die Revision beschränkt sich auf eine quellentreuere Wiedergabe der beiden narrativen καί-Verknüpfungen und präzisiert die Intensität von παρεβιάσαντο mit »eindringlich«. Aussagegehalt, zeitliche Nuance und das bildhafte Perfekt von κέκλικεν bleiben erhalten.
