  - severity: low
    issue: »Da« im Schlusssatz
    rationale: »Da« ist möglich, kann aber einen zeitlich-folgernden Akzent setzen. Das explizite »Und« bildet die einfache Verknüpfung von καί unmittelbarer ab.
