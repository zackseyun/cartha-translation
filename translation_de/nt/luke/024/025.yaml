  naturalness: „Wie schwerfällig im Herzen“ ist verständlich, wirkt im modernen Standarddeutsch jedoch etwas holprig und lässt das ausgelassene „ihr seid“ stärker hervortreten als nötig. „So schwerfällig im Herzen, alles zu glauben“ ist flüssiger und bewahrt die bildhafte, würdige Sprache.
  terminology: „unverständig“, „Herzen“, „glauben“ und „Propheten“ sind angemessen. „Schwerfällig“ kann βραδεῖς wiedergeben; die Revision betrifft nur Stellung und Anschluss der Wortgruppe.
