id: LUK.24.25
reference: Luke 24:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: de
  text: 'Da sagte er zu ihnen: »Wie unverständig ihr seid und wie schwerfällig im Herzen, alles zu glauben, was die Propheten gesagt haben!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Da sagte er zu ihnen
  rationale: „Da“ führt die Reaktion im Deutschen natürlich fort; αὐτός wird ohne künstliche Hervorhebung durch „er“ wiedergegeben.
- source_word: Ὦ ἀνόητοι
  choice: Wie unverständig ihr seid
  rationale: Die deutsche Ausrufekonstruktion bewahrt Anrede und Tadel, klingt aber natürlicher als „O ihr Unverständigen“. „Unverständig“ bezeichnet hier mangelndes Begreifen, ohne den Ausdruck auf bloße Intelligenz oder moralische Verwerflichkeit zu verengen.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: wie schwerfällig im Herzen
  rationale: Bewahrt das Bild des Herzens als innerer Person und gibt βραδύς als innere Trägheit wieder, statt ausschließlich intellektuelles Unverständnis auszudrücken.
- source_word: τοῦ πιστεύειν
  choice: zu glauben
  rationale: Der Infinitiv bezeichnet, worin ihre Schwerfälligkeit besteht; „zu glauben“ ist im Deutschen idiomatisch und erhält den Aspekt des Vertrauens.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: all dem
  rationale: 'Bewahrt den umfassenden Geltungsbereich: Nicht nur ausgewählten Aussagen, sondern dem gesamten hier gemeinten prophetischen Zeugnis sollen sie glauben.'
- source_word: ἐλάλησαν οἱ προφῆται
  choice: was die Propheten gesagt haben
  rationale: Das Perfekt stellt die früher ergangenen prophetischen Aussagen als weiterhin maßgeblich dar. „Gesagt“ ist natürliches modernes Deutsch und gibt λαλέω im Kontext angemessen wieder.
theological_decisions:
- issue: Art des Tadels Jesu
  choice: Der Tadel betrifft sowohl mangelndes Verstehen als auch die innere Trägheit, dem gesamten prophetischen Zeugnis zu vertrauen.
  alternative: Den Tadel entweder nur als moralische Verurteilung oder nur als intellektuelles Missverständnis wiederzugeben.
  rationale: Die Verbindung von ἀνόητοι, „im Herzen“ und „glauben“ umfasst Verständnis und Vertrauen. Die Übersetzung erhält diese Spannung und bekräftigt zugleich die Verlässlichkeit des prophetischen Zeugnisses, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Ausrufekonstruktion „Wie … und wie …“ vermittelt die emotionale und feierliche Kraft von Ὦ, ohne das im heutigen Deutsch leicht altertümlich wirkende „O“ zu verwenden. Das biblische Herzbild bleibt bewusst erhalten.
