id: LUK.24.47
reference: Luke 24:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: de
  text: und dass in seinem Namen allen Völkern[b] Umkehr zur Vergebung der Sünden[a] verkündet werden soll, ausgehend von Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Umkehr und Vergebung der Sünden«; die griechische Formulierung kann als zwei miteinander verbundene Inhalte der Verkündigung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort für »Völker« kann je nach Zusammenhang auch »Nichtjuden« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: verkündet werden soll
  rationale: Der Aorist Passiv Infinitiv steht im Zusammenhang mit der Erfüllung der Schrift. »Verkündet« gibt den öffentlichen Bekanntmachungscharakter wieder, ohne ihn auf eine formelle Predigtsituation zu beschränken.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: in seinem Namen
  rationale: Die im Deutschen geläufige Wendung bewahrt den Bezug auf Jesu Person und Vollmacht, ohne die mögliche Nuance der Grundlage ausdrücklich festzulegen.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: »Umkehr« bezeichnet eine grundlegende Neuausrichtung und ist im heutigen Deutsch verständlicher und umfassender als eine bloße »Sinnesänderung«.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: Vergebung der Sünden
  rationale: ἄφεσις kann Freilassung, Erlass oder Vergebung bedeuten; in Verbindung mit Sünden ist »Vergebung« die natürliche und sachlich präzise Wiedergabe.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: allen Völkern
  rationale: Die Formulierung gibt die weltweite Zielrichtung idiomatisch wieder. ἔθνη wird als »Völker« wiedergegeben, ohne es auf Nichtjuden zu verengen.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: angefangen von Jerusalem aus
  rationale: Die Formulierung kennzeichnet Jerusalem als Ausgangspunkt und bewahrt die Richtungsnuance von ἀπό.
theological_decisions:
- issue: Verhältnis von Umkehr und Sündenvergebung
  choice: »Umkehr zur Vergebung der Sünden«
  alternative: »Umkehr und Vergebung der Sünden«
  rationale: Die Hauptfassung bringt die enge Beziehung beider Begriffe zum Ausdruck, ohne eine ausgearbeitete Heilsordnung in den Vers hineinzulesen. Da die beiden Akkusative auch als koordinierte Inhalte der Verkündigung verstanden werden können, wird diese Möglichkeit in einer Fußnote bewahrt.
- issue: Bedeutung von ἔθνη
  choice: »allen Völkern«
  alternative: »allen Nichtjuden«
  rationale: Der Auferstehungsauftrag hat weltweite Reichweite. »Völker« bewahrt diese Weite und schließt Nichtjuden ein, ohne den Ausdruck ausschließlich auf sie zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Umkehr« ist verständlich und theologisch nicht konfessionell verengt. Der Gedankenstrich macht den nachgestellten Ausgangspunkt der Verkündigung lesbar, ohne die knappe Struktur des griechischen Satzes unnötig aufzulösen.
