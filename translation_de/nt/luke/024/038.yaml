id: LUK.24.38
reference: Luke 24:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Warum seid ihr so verstört, und warum steigen Zweifel[a] in euren Herzen auf?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gedanken« oder »Überlegungen«.'
    reason: Lexikalische Alternative zu διαλογισμοί; das Wort ist weiter als »Zweifel« und kann allgemein innere Gedanken oder Erwägungen bezeichnen.
lexical_decisions:
- source_word: Τί
  choice: Warum
  rationale: In der Verbindung mit dem prädikativen Partizip und εἰμί fragt τί idiomatisch nach dem Grund; »Warum« gibt dies im Deutschen natürlich wieder.
- source_word: τεταραγμένοι
  choice: verstört
  rationale: Das Perfektpartizip von ταράσσω bezeichnet den gegenwärtigen Zustand innerer Erschütterung. »Verstört« bewahrt diese emotionale Stärke, ohne einen bloß vorübergehenden Schrecken festzulegen.
- source_word: διαλογισμοὶ
  choice: Zweifel
  rationale: Das Substantiv kann Gedanken oder Überlegungen bezeichnen, hat hier angesichts der Reaktion der Jünger jedoch den negativen Sinn innerer Zweifel oder Einwände. Die Fußnote erhält die weitere Bedeutungsbreite.
- source_word: ἀναβαίνουσιν
  choice: steigen … auf
  rationale: Die Grundbewegung »hinaufsteigen« wird als Bild für aufkommende innere Vorgänge beibehalten und ist im Deutschen verständlich.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: in euren Herzen
  rationale: Der griechische Singular καρδίᾳ mit dem pluralischen Possessivpronomen ist distributiv. Der deutsche Plural ist für die angesprochene Gruppe natürlich und gibt den Bezug auf jeden Einzelnen klar wieder.
- source_word: καρδία
  choice: Herzen
  rationale: »Herz« bewahrt die biblisch-anthropologische Bedeutung des inneren Menschen, die Denken und Haltung einschließt; »Verstand« wäre zu eng.
theological_decisions:
- issue: Anthropologischer Begriff καρδία
  choice: Herzen
  alternative: Verstand; Inneres
  rationale: Die Formulierung lässt das Herz als Ort des Denkens und Zweifelns stehen und bewahrt damit die biblische Spannung zwischen Denken, Empfinden und innerer Haltung.
- issue: Bedeutung von διαλογισμοί
  choice: Zweifel
  alternative: Gedanken; Überlegungen
  rationale: Der Zusammenhang legt zweifelnde innere Erwägungen nahe, doch die lexikalisch weitere Bedeutung wird nicht verschwiegen, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Doppel-Fragesatz; »steigen … auf« erhält dessen anschauliche Metapher. Der Fußnotenmarker steht unmittelbar bei dem erläuterten Wort.
