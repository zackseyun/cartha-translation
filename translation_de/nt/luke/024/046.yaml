source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „So steht geschrieben, dass der Messias[a] leiden und am dritten Tag von den Toten[b] auferstehen würde.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Χριστός bezeichnet hier den Titel des Gesalbten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „aus den Toten“, das heißt aus der Mitte der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: steht es geschrieben
  rationale: Das griechische Perfekt bezeichnet in der üblichen Schriftformel das, was geschrieben wurde und weiterhin als Schriftwort gilt. „Steht es geschrieben“ bewahrt diesen fortdauernden Sinn in natürlichem Deutsch.
- source_word: παθεῖν
  choice: wird leiden
  rationale: Der Infinitiv gibt den Inhalt des Geschriebenen wieder. Das Futur ist nach dem Doppelpunkt im Deutschen natürlich und führt keine ausdrückliche Notwendigkeit ein, die in diesem Satzteil nicht eigens markiert ist.
- source_word: τὸν χριστόν
  choice: der Messias
  rationale: Mit Artikel fungiert Χριστός hier klar als Titel. „Messias“ erhält den jüdisch-schriftbezogenen Hintergrund des Gesalbten.
- source_word: ἀναστῆναι
  choice: auferstehen
  rationale: Der aktive Infinitiv wird intransitiv wiedergegeben. So bleibt die aktive Form des griechischen Verbs erhalten, ohne sie in ein Passiv („auferweckt werden“) umzudeuten.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die geläufige und verständliche deutsche Wiedergabe der griechischen Auferstehungsformel; wörtlicher wäre „aus den Toten“ beziehungsweise sinngemäß „aus der Mitte der Toten“.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Der Dativ hat temporale Funktion; „am dritten Tag“ ist die natürliche deutsche Form.
- source_word: οὕτως
  choice: So
  rationale: „So“ leitet knapp und würdig den Inhalt dessen ein, was in der Schrift steht.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt führt im Deutschen den Inhalt des Geschriebenen natürlich ein. Die folgende Hauptsatzform bewahrt den Sinn der griechischen Inhaltseinleitung, ohne schwerfällige Syntax.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Zusammenfassung von Leiden und Auferstehung
  choice: der Messias
  alternative: der Christus
  rationale: Der bestimmte Artikel kennzeichnet den Ausdruck hier als Titel. „Messias“ bewahrt den Bezug auf den in der Schrift erwarteten Gesalbten; die traditionelle Alternative wird in einer Fußnote genannt.
- issue: Genus Verbi von ἀναστῆναι
  choice: auferstehen
  alternative: auferweckt werden
  rationale: Die griechische Form ist aktiv. Der Haupttext wahrt daher die Aussage, dass der Messias aufersteht, statt an dieser Stelle ein grammatisches Passiv einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftton. Der Doppelpunkt vermeidet eine schwerfällige dass-Konstruktion; die parallelen Zukunftsaussagen geben die beiden griechischen Infinitive klar wieder.
