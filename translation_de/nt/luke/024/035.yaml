  source_fidelity: Die Übersetzung gibt die Satzglieder und den Sinn des griechischen Textes zuverlässig wieder. „Sie selbst“ trägt die Betonung von αὐτοὶ. „Was unterwegs geschehen war“ entfaltet die elliptische Wendung τὰ ἐν τῇ ὁδῷ idiomatisch, ohne sachlich etwas hinzuzufügen. „Wie er ihnen ... bekannt geworden war“ bewahrt gegenüber einer rein aktiven Formulierung die Offenheit der passivischen Form ἐγνώσθη und passt zum Kontext.
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem dem erzählenden Evangelienstil angemessenen würdigen Register. Die Plusquamperfektformen sind im Rahmen der berichteten, bereits geschehenen Ereignisse natürlich. „Beim Brechen des Brotes“ ist idiomatisch und kontextgerecht.
  terminology: „Brot“ und „Brechen des Brotes“ sind sachgemäß und bewahren die bestimmte, konkrete Mahlhandlung. Die Fußnote bietet mit „erkannt worden war“ eine legitime alternative Akzentuierung, ohne die grammatische und semantische Offenheit des griechischen Passivs dogmatisch aufzulösen.
