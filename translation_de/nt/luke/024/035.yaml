id: LUK.24.35
reference: Luke 24:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: de
  text: Und sie selbst erzählten, was unterwegs geschehen war, und wie er ihnen beim Brechen des Brotes bekannt geworden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie er von ihnen beim Brechen des Brotes erkannt worden war.“ Die griechische Passivform kann sowohl ihr Erkennen als auch sein Bekanntwerden hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont und hebt die beiden Jünger als nun selbst Berichtende hervor.
- source_word: ἐξηγοῦντο
  choice: erzählten
  rationale: Das Imperfekt bezeichnet ihr fortlaufendes Berichten; „erzählten“ ist im modernen Deutsch natürlich und bewahrt den narrativen Sinn.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: was unterwegs geschehen war
  rationale: Die griechische Wendung ist elliptisch. Die Ergänzung „geschehen war“ gibt den im Kontext klar vorausgesetzten Sinn idiomatisch wieder.
- source_word: ὁδῷ
  choice: unterwegs
  rationale: Im Zusammenhang der Reise nach Emmaus ist „unterwegs“ natürlicher als das wörtlichere „auf dem Weg“ und meint weiterhin die Ereignisse während des Weges.
- source_word: ὡς
  choice: wie
  rationale: ὡς führt hier den Inhalt beziehungsweise die Weise des Bekanntwerdens ein; „wie“ bildet diese Offenheit natürlich ab.
- source_word: ἐγνώσθη
  choice: ihnen ... bekannt geworden war
  rationale: Die passive Form bleibt erhalten und lässt offen, ob der Schwerpunkt auf ihrem Erkennen oder auf seinem Offenbarwerden liegt.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: beim Brechen des Brotes
  rationale: Die Formulierung gibt die substantivische Wendung und den bestimmten Artikel wieder und verweist im Kontext auf das konkrete Mahl.
- source_word: ἄρτου
  choice: Brot
  rationale: „Brot“ ist die übliche und hier sachlich angemessene Wiedergabe von ἄρτος.
theological_decisions:
- issue: Ob ἐγνώσθη als bloß menschliches Wiedererkennen oder als passiv formuliertes Bekanntwerden wiederzugeben ist
  choice: „ihnen ... bekannt geworden war“
  alternative: „sie ihn erkannt hatten“ oder „er von ihnen erkannt worden war“
  rationale: Die passive griechische Form und damit die Spannung zwischen menschlichem Erkennen und ermöglichtem Offenbarwerden bleiben gewahrt, ohne eine bestimmte theologische Erklärung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während die elliptische Wendung τὰ ἐν τῇ ὁδῷ für gewöhnliche Leser idiomatisch entfaltet wird.
