reference: Luke 24:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: de
  text: Wir aber hatten gehofft, dass er es ist, der Israel erlösen würde.[a][b] Doch zu alledem ist heute schon der dritte Tag, seit dies geschehen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „dass er es war, der Israel erlösen würde“. Im Griechischen steht innerhalb des Inhalts ihrer vergangenen Hoffnung die Gegenwartsform „ist“.'
    reason: alternative_reading
  - marker: b
    text: „Israel erlösen“ kann allgemein die erhoffte messianische Befreiung bezeichnen. Der Text legt nicht fest, ob politische Befreiung, geistliche Rettung oder beides gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Wir aber
  rationale: Gibt sowohl den Kontrast durch δέ als auch die Betonung des ausdrücklich gesetzten Pronomens ἡμεῖς knapp und würdig wieder.
- source_word: ἠλπίζομεν
  choice: hatten gehofft
  rationale: Das deutsche Plusquamperfekt bezeichnet hier natürlich die bis zu den berichteten Ereignissen bestehende, nun enttäuschte Hoffnung; der durative Zug des griechischen Imperfekts ergibt sich aus dem Zusammenhang.
- source_word: ὅτι αὐτός ἐστιν
  choice: dass er es ist
  rationale: Bewahrt das griechische Präsens ἐστιν innerhalb des Inhalts der vergangenen Hoffnung und bildet αὐτός betont mit „er es“ ab.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: der … erlösen soll
  rationale: „Soll“ gibt die erwartete beziehungsweise bevorstehende Aufgabe des substantivierten μέλλων mit Infinitiv in natürlichem Deutsch wieder, ohne sie als bloße Absicht festzulegen.
- source_word: λυτροῦσθαι
  choice: erlösen
  rationale: Bewahrt gegenüber „befreien“ die Breite sowie die bundestheologischen und messianischen Anklänge des Verbs.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Direkte Wiedergabe des Kollektivs für das Bundesvolk, ohne erläuternden Zusatz.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Doch zu alledem
  rationale: Drückt den verstärkten Gegensatz und den hinzukommenden, entmutigenden Umstand idiomatisch aus.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: ist heute schon der dritte Tag
  rationale: Gibt die idiomatische Zeitangabe mit ἄγει verständlich wieder; „schon“ vermittelt die kumulative Kraft des Zusammenhangs.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: seit dies geschehen ist
  rationale: Gibt den Ausgangspunkt der Zeitrechnung und das zusammenfassende ταῦτα natürlich wieder.
theological_decisions:
- issue: Messianische Erwartung in „Israel erlösen“
  choice: „Israel erlösen“ ohne nähere Festlegung
  alternative: „Israel politisch befreien“ oder „Israel geistlich retten“
  rationale: Der Wortlaut lässt Art und Umfang der erhofften messianischen Erlösung offen und kann nationale, geistliche oder miteinander verbundene Erwartungen umfassen.
- issue: Zeitbezug von ἐστιν nach ἠλπίζομεν
  choice: Das Präsens in „dass er es ist“ beibehalten
  alternative: „dass er es war“
  rationale: Das Präsens steht ausdrücklich im griechischen Inhalt der vergangenen Hoffnung. Seine Beibehaltung erhält die sprachliche Spannung, statt sie durch deutsche Zeitenfolge aufzulösen.
- issue: Bedeutung von μέλλων
  choice: „der … erlösen soll“
  alternative: „der … erlösen wird“, „der im Begriff ist, … zu erlösen“ oder „der … erlösen sollte“
  rationale: Die gewählte Formulierung lässt Erwartung, Bestimmung und bevorstehendes Handeln anklingen, ohne einen dieser Aspekte allein festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche Spannung zwischen vergangener Hoffnung und gegenwärtigem „ist“ bleibt bewusst erhalten. Beide Fußnotenmarker stehen im Haupttext; Fußnote [b] bezieht sich inhaltlich auf „Israel erlösen“, steht jedoch aus Gründen des Leseflusses am Versende.
