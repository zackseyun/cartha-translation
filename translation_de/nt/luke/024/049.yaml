id: LUK.24.49
reference: Luke 24:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: de
  text: 'Und seht: Ich sende die Verheißung meines Vaters auf euch. Ihr aber bleibt in der Stadt, bis ihr mit Kraft aus der Höhe bekleidet werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: seht
  rationale: Die aufmerksamkeitslenkende Partikel wird als würdige, gegenwärtig verständliche Aufforderung wiedergegeben.
- source_word: ἐξαποστέλλω
  choice: ich sende
  rationale: Das Präsens und der Sendegedanke werden direkt bewahrt; im Zusammenhang kann die Aussage ein unmittelbar bevorstehendes Handeln bezeichnen.
- source_word: ἐπαγγελία
  choice: Verheißung
  rationale: Der Ausdruck bezeichnet hier sowohl die göttliche Zusage als auch metonymisch das Verheißene; »Verheißung« erhält diese Spannung.
- source_word: καθίσατε
  choice: bleibt
  rationale: Obwohl das Verb wörtlich »setzt euch« heißen kann, bedeutet es hier idiomatisch, an einem Ort zu verweilen.
- source_word: ἐνδύσησθε
  choice: bekleidet werdet
  rationale: Die Bekleidungsmetapher und die passive Form des griechischen Textes bleiben erhalten.
- source_word: ἐξ ὕψους δύναμιν
  choice: mit Kraft aus der Höhe
  rationale: Die Herkunftsangabe »aus der Höhe« und die bewusst offene Bezeichnung der Kraft werden nicht weiter ausgedeutet.
theological_decisions:
- issue: Bedeutung von »die Verheißung meines Vaters«
  choice: Die Formulierung bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Verheißung ausdrücklich als den Heiligen Geist bezeichnen.
  rationale: Der nähere Kontext legt diese Identifikation nahe, doch der Vers selbst verwendet die metonymisch offene Wendung »die Verheißung«; eine Explizierung würde interpretierend ergänzen.
- issue: Bild der Bekleidung mit Kraft
  choice: Die Metapher »mit Kraft ... bekleidet werden« wird bewahrt.
  alternative: »Kraft empfangen« oder »mit Kraft erfüllt werden«.
  rationale: Die Bildsprache des griechischen Textes beschreibt die kommende Befähigung, ohne sie auf eine bestimmte dogmatische Formel zu verengen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. Der Doppelpunkt nach »seht« gibt die aufmerksamkeitslenkende Funktion von ἰδού natürlich wieder. Die Satzstellung »Ihr aber« bildet den griechischen Kontrast deutlich ab.
