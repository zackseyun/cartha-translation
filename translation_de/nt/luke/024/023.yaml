source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: de
  text: Und als sie seinen Leichnam nicht fanden, kamen sie und berichteten, sie hätten auch eine Vision von Engeln gesehen, die sagen, dass er lebt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ
  choice: als sie seinen Leichnam nicht fanden
  rationale: Das feminine Pluralpartizip bezieht sich auf die Frauen und wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben. Im Grabeszusammenhang bezeichnet »Leichnam« den gesuchten Körper des Verstorbenen präziser als das allgemeinere »Körper«.
- source_word: ἦλθον λέγουσαι
  choice: kamen sie zurück und sagten
  rationale: ἦλθον bedeutet wörtlich »sie kamen«; aus dem Zusammenhang ist die Rückkehr vom Grab gemeint. »kamen zurück und sagten« gibt den erzählerischen Ablauf in natürlichem Deutsch wieder.
- source_word: καὶ ὀπτασίαν ἀγγέλων
  choice: auch eine Erscheinung von Engeln
  rationale: καί fügt gegenüber dem nicht gefundenen Leichnam einen weiteren außergewöhnlichen Bericht hinzu. ὀπτασία kann eine übernatürliche Vision oder Erscheinung bezeichnen; »Erscheinung« vermeidet die mögliche moderne Nebenbedeutung einer bloß inneren Vorstellung.
- source_word: ἑωρακέναι
  choice: sie hätten … gesehen
  rationale: Der Perfektinfinitiv steht in indirekter Rede. Der deutsche Konjunktiv I gibt den berichteten Inhalt idiomatisch wieder; die Vorzeitigkeit wird durch »hätten gesehen« ausgedrückt.
- source_word: οἳ λέγουσιν αὐτὸν ζῆν
  choice: die sagen, dass er lebt
  rationale: Das maskuline Relativpronomen bezieht sich am natürlichsten auf die Engel. Das Präsens λέγουσιν und der Inhalt αὐτὸν ζῆν werden direkt mit »sagen, dass er lebt« wiedergegeben.
theological_decisions:
- issue: Bezugswort von οἳ λέγουσιν
  choice: 'Das Relativpronomen bezieht sich auf die Engel: »Engeln …, die sagen, dass er lebt«.'
  alternative: Weniger wahrscheinlich kann die Aussage auf die Frauen bezogen beziehungsweise als weiterer Inhalt ihres Berichts gegliedert werden.
  rationale: ἀγγέλων ist das nächstliegende maskuline Bezugswort, und die Engel als Sprecher entsprechen dem unmittelbaren Erzählzusammenhang. Die weniger wahrscheinliche syntaktische Möglichkeit bleibt in einer Fußnote erhalten.
- issue: Wiedergabe von αὐτὸν ζῆν
  choice: dass er lebt
  alternative: dass er am Leben ist
  rationale: »Er lebt« bewahrt die knappe, gegenwärtige Aussage des griechischen Infinitivs, ohne den theologischen Gehalt über den Wortlaut hinaus auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz schließt mit »und« an den vorausgehenden Zusammenhang an. Indirekte Rede wird idiomatisch im Konjunktiv wiedergegeben; der Präsenswechsel bei der Botschaft der Engel bleibt erhalten.
