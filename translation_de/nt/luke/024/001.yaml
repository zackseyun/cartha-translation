source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: de
  text: Am ersten Tag der Woche[a] aber kamen sie in aller Frühe zum Grab und brachten die Duftstoffe mit, die sie vorbereitet hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »am ersten der Sabbate«; dies ist eine idiomatische Bezeichnung für den ersten Tag der Woche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Am ersten Tag der Woche aber
  rationale: Die griechische Wendung ist eine geläufige semitisch-koineische Zeitangabe für den ersten Wochentag. Die idiomatische deutsche Wiedergabe vermittelt den Sinn klar; „aber“ bildet δέ ab und verbindet den Vers mit dem vorausgehenden Bericht.
- source_word: ὄρθρου βαθέως
  choice: in aller Frühe
  rationale: Die Verbindung bezeichnet die sehr frühe Morgendämmerung. „In aller Frühe“ gibt die verstärkende Wirkung von βαθέως natürlich und prägnant wieder, ohne das im Deutschen ungewöhnliche Bild einer „tiefen Morgendämmerung“ zu erzwingen.
- source_word: ἐπὶ τὸ μνῆμα ἦλθον
  choice: kamen sie … zum Grab
  rationale: Bei einem Bewegungsverb bezeichnet ἐπί mit Akkusativ die Bewegung zum Ziel. „Zum Grab kommen“ ist im Deutschen die natürliche Wiedergabe; μνῆμα meint hier die Grabstätte Jesu.
- source_word: φέρουσαι
  choice: und brachten … mit
  rationale: Das Partizip beschreibt eine gleichzeitig mit dem Kommen vollzogene Handlung. Eine koordinierte deutsche Verbform liest sich natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: die wohlriechenden Öle, die sie vorbereitet hatten
  rationale: ἀρώματα bezeichnet duftende Stoffe für die Bestattung, wahrscheinlich eine Mischung aus Gewürzen und Ölen. „Wohlriechende Öle“ ist im modernen Deutschen in diesem Bestattungskontext anschaulicher als das leicht missverständliche „Gewürze“; das Plusquamperfekt gibt die vorausliegende Vorbereitung wieder.
theological_decisions:
- issue: Zeitangabe τῇ μιᾷ τῶν σαββάτων im Auferstehungsbericht
  choice: am ersten Tag der Woche
  alternative: am ersten der Sabbate
  rationale: Die idiomatische Bedeutung wird im Haupttext wiedergegeben. Die formal wörtlichere Gestalt wird in der Fußnote genannt, ohne daraus eine besondere kalendarische oder konfessionelle Deutung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt erzählerisch flüssig; „in aller Frühe“ ist natürlich und bewahrt die zeitliche Intensivierung des griechischen Ausdrucks.
