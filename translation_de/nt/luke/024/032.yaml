  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die rhetorische, Zustimmung erwartende Frage (Οὐχί), den Singular „unser Herz“, die fortlaufende rückblickende Handlung der beiden Imperfekte sowie die metaphorische Aussage vom Erschließen der Schriften. „In uns“ ist eine enge Wiedergabe von ἐν ἡμῖν; „unterwegs“ gibt ἐν τῇ ὁδῷ im Kontext natürlich wieder.'
  naturalness: „Und sie sagten zueinander“ sowie die direkte Frage sind modernes, würdiges Standarddeutsch. Der Singular „unser Herz“ ist zwar markiert, aber idiomatisch möglich und quellengetreu. „Die Schriften erschloss“ ist in diesem biblisch-literarischen Register natürlich und verständlich.
  terminology: „Herz“, „Schriften“ und „erschloss“ sind terminologisch angemessen. Besonders „erschloss“ bewahrt die Bildlichkeit von διανοίγω, ohne sie im Haupttext zu einer bestimmten Auslegungsweise einzuengen. Es werden keine konfessionellen Deutungen hinzugefügt.
