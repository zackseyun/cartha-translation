id: LUK.24.32
reference: Luke 24:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: de
  text: 'Und sie sagten zueinander: „Brannte nicht unser Herz in uns, als er unterwegs zu uns sprach, als er uns die Schriften erschloss?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: zueinander
  rationale: Die idiomatische deutsche Entsprechung bewahrt den wechselseitigen Charakter des Gesprächs.
- source_word: Οὐχὶ
  choice: Brannte nicht …?
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung; diese Satzform bewahrt ihre bekräftigende Wirkung.
- source_word: ἡ καρδία ἡμῶν
  choice: unser Herz
  rationale: Der griechische Text verwendet den Singular. Auch im Deutschen kann der Singular ihre gemeinsame innere Erfahrung ausdrücken, ohne ihn stillschweigend in den Plural umzuwandeln.
- source_word: καιομένη ἦν ἐν ἡμῖν
  choice: brannte … in uns
  rationale: Die direkte, verständliche Metapher bleibt erhalten und wird weder ausschließlich emotional noch ausschließlich geistlich gedeutet.
- source_word: ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ
  choice: als er unterwegs zu uns sprach
  rationale: „Unterwegs“ gibt die konkrete Wegsituation natürlich wieder; „sprach“ wahrt die Richtung von ἡμῖν („zu uns“). Der mit „als“ eingeleitete Nebensatz vermittelt den begleitenden Verlauf des Imperfekts.
- source_word: ὡς διήνοιγεν ἡμῖν τὰς γραφάς
  choice: als er uns die Schriften erschloss
  rationale: „Erschloss“ bewahrt im Deutschen die Öffnungsmetapher und bezeichnet zugleich natürlich das Zugänglichmachen ihres Sinnes. Die Wiederholung von „als“ entspricht den beiden parallelen ὡς-Sätzen.
- source_word: τὰς γραφάς
  choice: die Schriften
  rationale: Im Kontext sind die als heilig anerkannten Schriften Israels gemeint; „die Schriften“ ist präzise und vermeidet eine unnötige Ausweitung.
theological_decisions:
- issue: Bedeutung des brennenden Herzens
  choice: Die Metapher „unser Herz … brannte“ bleibt ohne nähere Deutung stehen.
  alternative: „Wir waren tief bewegt“ oder „uns ging ein Licht auf“.
  rationale: Der Text legt nicht eindeutig fest, ob das Brennen vor allem emotionale Ergriffenheit, geistliche Erfahrung oder wachsendes Verstehen bezeichnet. Die Übersetzung bewahrt diese Spannung.
- issue: Das Erschließen der Schriften
  choice: Die Öffnungsmetapher wird mit „erschloss“ bewahrt.
  alternative: „erklärte“ oder „legte aus“.
  rationale: „Erklärte“ und „legte aus“ benennen zwar den gemeinten Vorgang, würden das Bild von διανοίγω jedoch zugunsten einer eindeutigen Interpretation aufgeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gemeinsame Singular „unser Herz“ und die Wiederholung von „als“ sind bewusst quellennahe Formulierungen; „erschloss“ verbindet natürliche deutsche Ausdrucksweise mit der griechischen Öffnungsmetapher.
