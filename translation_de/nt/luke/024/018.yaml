source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: de
  text: 'Da antwortete ihm einer von ihnen namens Kleopas: »Bist du der Einzige, der sich als Fremder in Jerusalem aufhält[a] und nicht erfahren hat, was dort in diesen Tagen geschehen ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bist du der einzige Fremde in Jerusalem, der …?« Das griechische Verb bezeichnet einen Aufenthalt als Ortsfremder oder zeitweiliger Bewohner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Da antwortete
  rationale: Das Partizip wird dem natürlichen deutschen Erzählstil entsprechend als finites Verb wiedergegeben; δέ markiert hier eine milde Fortführung.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: der eine von ihnen, Kleopas mit Namen
  rationale: „Von ihnen“ ergibt sich aus dem Kontext der zwei Jünger. Die leicht gehobene Wendung „mit Namen“ bildet ὀνόματι klar und würdig ab.
- source_word: εἶπεν πρὸς αὐτόν
  choice: '[in „antwortete“ aufgenommen]'
  rationale: Im Deutschen wäre „antwortete und sagte zu ihm“ unnötig doppelt; der Adressat ist aus dem Kontext eindeutig.
- source_word: Σὺ μόνος
  choice: Bist du der Einzige
  rationale: Die Formulierung bewahrt die hervorgehobene Ausschließlichkeit von μόνος und ergibt eine natürliche deutsche Frage.
- source_word: παροικεῖς
  choice: der sich als Fremder in Jerusalem aufhält
  rationale: παροικέω bezeichnet den Aufenthalt als Ortsfremder oder zeitweiliger Bewohner. Diese Wiedergabe bewahrt den Außenseiter- und Aufenthaltsaspekt besser als das allgemeinere „besuchen“.
- source_word: οὐκ ἔγνως
  choice: nicht erfahren hat
  rationale: Der Aorist bezeichnet hier das Nicht-zur-Kenntnis-Gelangtsein hinsichtlich der jüngsten Ereignisse. „Nicht erfahren hat“ ist im Deutschen idiomatisch und wahrt den Vergangenheitsbezug.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: was dort ... geschehen ist
  rationale: Die substantivierte Partizipialform wird natürlich mit „was ... geschehen ist“ wiedergegeben; „dort“ verweist idiomatisch auf Jerusalem zurück.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: in diesen Tagen
  rationale: Die nahe, formale Entsprechung ist auch im modernen Deutschen verständlich und bezeichnet die unmittelbar zurückliegenden Tage.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Zuspitzung der Frage und die Bedeutung von παροικεῖς als Aufenthalt eines Ortsfremden bleiben erhalten.
