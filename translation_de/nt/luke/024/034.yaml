  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: de
  text: 'die sagten: »Der Herr ist wirklich auferweckt worden[a] und ist Simon erschienen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist wirklich auferstanden« oder: »wurde wirklich auferweckt«. Das griechische Adverb und Verb lassen mehrere eng verwandte Wiedergaben zu; der Haupttext bewahrt die Passivform des griechischen Verbs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: die sagten
  rationale: Das präsentische Partizip im Akkusativ Plural knüpft an die Personen im vorausgehenden Satz an. Der Relativsatz bewahrt diese syntaktische Verbindung im natürlichen Deutschen, ohne im Einzelvers ein zusätzliches Subjekt festzulegen.
- source_word: ὅτι
  choice: Doppelpunkt und direkte Rede
  rationale: ὅτι leitet hier den Inhalt der Aussage ein. Im Deutschen gibt die direkte Rede nach einem Doppelpunkt den Sinn idiomatisch wieder.
- source_word: ὄντως
  choice: wirklich
  rationale: Das Adverb bekräftigt die tatsächliche Wirklichkeit des berichteten Geschehens; „wirklich“ ist gegenwärtig, klar und nachdrücklich.
- source_word: ἠγέρθη
  choice: ist auferweckt worden
  rationale: Die Form ist Aorist Passiv von ἐγείρω. Das deutsche Perfektpassiv bewahrt die Passivform und bezeichnet zugleich ein vergangenes Ereignis mit gegenwärtiger Bedeutung.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: κύριος dient hier als christologischer Titel für Jesus; „Herr“ bewahrt sein Gewicht und ist die etablierte deutsche Entsprechung.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die Auferweckungsaussage mit der Erscheinung vor Simon.
- source_word: ὤφθη
  choice: ist … erschienen
  rationale: Obwohl ὤφθη formal passiv ist, wird die Form bei Erscheinungsberichten idiomatisch im Sinn von „erschien“ gebraucht. „Ist Simon erschienen“ ist im Deutschen natürlich und erhält Simon als Dativ.
- source_word: Σίμωνι
  choice: Simon
  rationale: Der Dativ des Namens wird als „Simon“ wiedergegeben. Der Ausgangstext ergänzt „Petrus“ nicht.
theological_decisions:
- issue: Genus Verbi der Auferweckungsaussage
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Der griechische Text verwendet bei ἠγέρθη eine Passivform. Die Hauptfassung bewahrt sie, ohne ausdrücklich zu benennen, wer Christus auferweckt hat.
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Meister
  rationale: In diesem Auferstehungskontext ist κύριος ein Titel Jesu. „Herr“ erhält die christologische Tragweite, während „Meister“ den Ausdruck unnötig verengt.
- issue: Subjekt von λέγοντας
  choice: die sagten
  alternative: und sie sagten
  rationale: Das Partizip ist grammatisch an den vorausgehenden Satz gebunden. Der Relativsatz wahrt diese Bindung und vermeidet eine vorschnelle Festlegung, welche zuvor genannte Gruppe spricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auferweckt worden“ ist bewusst etwas formeller, um die griechische Passivform zu erhalten; „wirklich“ vermeidet einen unnötig altertümlichen Ton. Die Anführungszeichen entsprechen der üblichen deutschen Typografie.
