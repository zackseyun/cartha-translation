  source_fidelity: Die Übersetzung gibt λέγοντας als an den vorherigen Kontext gebundene Relativsatzfortsetzung angemessen wieder. »wirklich« trifft ὄντως, »ist auferweckt worden« bewahrt bei ἠγέρθη sachgerecht das Passiv, und »ist Simon erschienen« gibt die in Erscheinungsberichten idiomatische Bedeutung von ὤφθη natürlich wieder. »Simon« ergänzt den im Griechischen nicht vorhandenen Beinamen nicht.
  naturalness: Der Satz ist als Fortsetzung des vorhergehenden Verses idiomatisches, würdiges modernes Standarddeutsch. Das Perfektpassiv »ist auferweckt worden« ist etwas gehoben, aber hier verständlich und für die formale Entsprechung sinnvoll. Die direkte Rede und deutsche Anführungszeichen sind stimmig.
  terminology: »Der Herr« ist die etablierte und kontextgerecht christologische Wiedergabe von ὁ κύριος. »auferweckt« gegenüber »auferstanden« erhält die sprachliche Unterscheidung des griechischen Passivs, ohne eine zusätzliche theologische Aussage einzutragen. Die Fußnote bietet die naheliegenden Alternativen ausgewogen an.
