  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: de
  text: Ihr seid Zeugen dieser Dinge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder schlicht: „Ihr seid Zeugen hiervon.“ Das griechische Demonstrativpronomen verweist auf das zurück, wovon Jesus unmittelbar zuvor gesprochen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen bezeichnet die angesprochenen Jünger im Plural und trägt eine leichte Betonung; im Deutschen wird diese durch das ausdrücklich vorangestellte „ihr“ natürlich wiedergegeben.
- source_word: ἐστε
  choice: seid
  rationale: Präsens Indikativ von εἰμί, in Übereinstimmung mit dem Subjekt der zweiten Person Plural.
- source_word: μάρτυρες
  choice: Zeugen
  rationale: Bezeichnet hier Menschen, die von den zuvor genannten Ereignissen Zeugnis geben können. „Zeugen“ ist die natürliche deutsche Entsprechung und vermeidet, spätere Assoziationen mit dem Märtyrertod in den unmittelbaren Kontext einzutragen.
- source_word: τούτων
  choice: dieser Dinge
  rationale: Der substantivisch gebrauchte Genitiv Plural des Demonstrativpronomens verweist auf das zuvor Gesagte beziehungsweise auf die zuvor genannten Ereignisse. „Dieser Dinge“ bewahrt die knappe und leicht offene Rückverweisung des Griechischen.
theological_decisions:
- issue: Bedeutung der Rolle als μάρτυρες
  choice: Die Angesprochenen werden als Zeugen der zuvor genannten Ereignisse bezeichnet.
  alternative: Das Wort könnte mit der späteren christlichen Bedeutung des Märtyrers verbunden werden.
  rationale: Im unmittelbaren Zusammenhang geht es um das Leiden und die Auferstehung des Christus sowie um die Verkündigung in seinem Namen. Daher steht die Zeugenschaft im Sinn des Bezeugens im Vordergrund, ohne mögliche spätere Resonanzen zum Märtyrertum in die Übersetzung einzubauen.
- issue: Bezugsbereich von τούτων
  choice: Die Formulierung bleibt als allgemeine Rückverweisung auf „diese Dinge“ stehen.
  alternative: Die Übersetzung könnte den Bezug ausdrücklich als „diese Ereignisse“ oder als Leiden, Auferstehung und Verkündigung ausformulieren.
  rationale: Das griechische Demonstrativpronomen nennt den Bezug nicht eigens, sondern verweist auf den vorangehenden Kontext. Die Übersetzung bewahrt diese Offenheit; die Fußnote erläutert den wahrscheinlichen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und präzise Wendung „Zeugen dieser Dinge“ ist gut verständlich und bildet den Genitiv des griechischen Textes knapp ab.
