id: LUK.24.10
reference: Luke 24:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: de
  text: Es waren Maria aus Magdala, Johanna, Maria, die Mutter des Jakobus,[a] und die übrigen Frauen mit ihnen; sie berichteten den Aposteln all das.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Maria des Jakobus«. Gemeint ist wahrscheinlich die Mutter des Jakobus; möglich ist auch die Frau des Jakobus.'
    reason: Die knappe griechische Genitivverbindung lässt die genaue familiäre Beziehung offen.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Es waren
  rationale: Das Imperfekt führt die zuvor erwähnten Frauen näher aus. δέ wirkt hier als schwacher Fortführungs- bzw. Übergangsmarker und braucht im natürlichen Deutschen keine eigene Wiedergabe.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Maria aus Magdala
  rationale: Die Herkunftsbezeichnung wird transparent und in geläufiger deutscher Namensform wiedergegeben.
- source_word: Ἰωάννα
  choice: Johanna
  rationale: Übliche deutsche Form des Personennamens.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Maria, die Mutter des Jakobus
  rationale: Die elliptische Genitivverbindung bezeichnet wahrscheinlich eine familiäre Beziehung; nach dem Zusammenhang ist die Mutterschaft die naheliegendste Ergänzung. Die im Griechischen verbleibende Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: die übrigen Frauen bei ihnen
  rationale: Das feminine Pluraladjektiv bezeichnet weitere Frauen; das im Griechischen vorausgesetzte Substantiv wird im Deutschen ergänzt.
- source_word: ἔλεγον
  choice: berichteten
  rationale: Das Imperfekt beschreibt ihr fortgesetztes Mitteilen. „Berichteten“ gibt den Vorgang in diesem Kontext natürlicher wieder als das blassere „sagten“.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: den Aposteln
  rationale: Der Dativ nach „berichten“ gibt die Adressaten idiomatisch wieder; „Apostel“ ist der etablierte und sachlich passende Ausdruck.
- source_word: ταῦτα
  choice: davon
  rationale: Das Pronomen verweist auf die zuvor geschilderten Ereignisse und die Botschaft. „Davon“ ist im Deutschen idiomatisch, ohne den Rückbezug einzuengen.
theological_decisions:
- issue: Identität und Beziehung bei Μαρία ἡ Ἰακώβου
  choice: Maria, die Mutter des Jakobus
  alternative: Maria des Jakobus; Maria, die Frau des Jakobus
  rationale: Der griechische Genitiv nennt die Beziehung nicht ausdrücklich. Die Deutung als Mutter ist im erzählerischen und onomastischen Zusammenhang am wahrscheinlichsten, darf aber nicht als sprachlich eindeutig dargestellt werden; deshalb nennt die Fußnote auch die mögliche Deutung als Ehefrau.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei griechischen Hauptsätze bleiben als zwei deutsche Sätze erkennbar; dies vermeidet eine schwerfällige Konstruktion und bewahrt zugleich den fortlaufenden Berichtston.
