base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: de
  text: Und diese Worte kamen ihnen wie unsinniges Gerede vor,[a] und sie glaubten den Frauen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie leeres Geschwätz“ oder „wie wirres Gerede“. Das griechische Wort bezeichnet eine Äußerung, die als sinnlos oder absurd angesehen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: kamen … vor
  rationale: In der wertenden Konstruktion mit ὡσεὶ λῆρος bezeichnet das Verb den Eindruck bzw. das Urteil der Betroffenen; „kamen ihnen … vor“ ist dafür im Deutschen natürlich.
- source_word: ἐνώπιον αὐτῶν
  choice: ihnen
  rationale: Wörtlich „vor ihnen“; zusammen mit „vorkommen“ wird die Perspektive idiomatisch durch den Dativ „ihnen“ wiedergegeben.
- source_word: ὡσεὶ λῆρος
  choice: wie unsinniges Gerede
  rationale: λῆρος bezeichnet als sinnlos, töricht oder absurd angesehenes Reden. „Unsinniges Gerede“ bewahrt den Redecharakter und die vergleichende Partikel ὡσεὶ, ohne die Aussage medizinisch auf „Fieberwahn“ festzulegen.
- source_word: τὰ ῥήματα ταῦτα
  choice: diese Worte
  rationale: Direkte und im Deutschen natürliche Wiedergabe der demonstrativen Wortgruppe.
- source_word: ἠπίστουν
  choice: sie glaubten … nicht
  rationale: Gibt den Unglauben klar wieder, ohne mit „weigerten sich zu glauben“ eine vom Verb nicht ausdrücklich bezeichnete Willensentscheidung hinzuzufügen.
- source_word: αὐταῖς
  choice: den Frauen
  rationale: Das feminine Pluralpronomen verweist im unmittelbaren Kontext auf die Frauen. Die ausdrückliche Wiedergabe beseitigt im Deutschen eine mögliche Mehrdeutigkeit, ohne einen neuen Referenten einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ markiert den Gegensatz zur vorausgehenden Botschaft der Frauen; „unsinniges Gerede“ ist deutlich, aber nicht unnötig umgangssprachlich.
