id: LUK.24.31
reference: Luke 24:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: de
  text: Da wurden ihnen die Augen geöffnet, und sie erkannten ihn; und er wurde für sie unsichtbar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er verschwand vor ihnen«; auch: »Er entschwand ihren Blicken«.'
    reason: Lexikalische Alternativen für ἄφαντος ἐγένετο ἀπ’ αὐτῶν, die denselben Wahrnehmungswechsel idiomatischer, aber dynamischer ausdrücken.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: wurden geöffnet
  rationale: Der Aorist Passiv wird direkt wiedergegeben. Die Formulierung lässt offen, wer oder was ihnen die Wahrnehmung eröffnete, und bewahrt damit die im Passiv liegende Zurückhaltung.
- source_word: οἱ ὀφθαλμοὶ
  choice: ihnen die Augen
  rationale: 'Die griechische Verbindung aus Genitivpronomen und Substantiv wird in natürlichem Deutsch mit Dativ und bestimmtem Artikel ausgedrückt: »ihnen die Augen«.'
- source_word: ἐπέγνωσαν
  choice: erkannten
  rationale: Im Emmauszusammenhang bezeichnet das Verb das Erkennen einer Person, deren Identität ihnen zuvor verborgen war.
- source_word: ἄφαντος
  choice: unsichtbar
  rationale: Das Adjektiv bezeichnet, dass jemand nicht sichtbar ist. »Unsichtbar« bleibt näher an der griechischen Zustandsbeschreibung als das dynamischere »verschwunden« und legt den Vorgang nicht näher fest.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: wurde für sie
  rationale: Die relationale Aussage wird in idiomatischem Deutsch mit »für sie« ausgedrückt. Zusammen mit »unsichtbar« besagt sie, dass sie ihn nicht mehr sehen konnten, ohne den Mechanismus zu erklären.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier den nächsten Erzählschritt ein. »Da« stellt in diesem Zusammenhang einen natürlichen zeitlich-narrativen Anschluss her.
theological_decisions:
- issue: Art des Entschwindens Jesu
  choice: er wurde für sie unsichtbar
  alternative: er verschwand vor ihnen / er entschwand ihren Blicken
  rationale: Die Wiedergabe folgt ἄφαντος ἐγένετο möglichst eng als Zustandsveränderung und beschreibt lediglich, dass Jesus für die beiden nicht mehr sichtbar war. Sie legt nicht fest, auf welche Weise dies geschah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der leicht markierte zweite Anschluss mit »und« bewahrt die schlichte griechische Satzfolge; das Semikolon erhält den engen Zusammenhang beider Vorgänge.
