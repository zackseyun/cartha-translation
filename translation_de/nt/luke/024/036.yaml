    issue: „trat ... in ihre Mitte“
    rationale: „Treten“ bezeichnet ein Hinzutreten bzw. eine Bewegung in die Gruppe. Das griechische ἔστη bezeichnet hier unmittelbar das Stehen/Stand-nehmen und enthält keine explizite Bewegungsangabe. Die Formulierung sollte daher ohne diese Zusatznuance wiedergegeben werden.
