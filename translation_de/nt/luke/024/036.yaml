  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: de
  text: Während sie noch darüber redeten, stand er selbst in ihrer Mitte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: »Und er sagte zu ihnen: ›Friede sei mit euch!‹«'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα δὲ αὐτῶν λαλούντων
  choice: Während sie noch darüber sprachen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung. »Während« gibt diesen zeitlichen Zusammenhang natürlich wieder; »darüber« verweist im Deutschen idiomatisch auf die zuvor berichteten Dinge, und »noch« verdeutlicht das Fortdauern, ohne den Sinn zu verändern.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont. »Er selbst« bewahrt diesen Nachdruck.
- source_word: ἔστη
  choice: trat
  rationale: Der Aorist von ἵστημι bezeichnet hier, dass Jesus eine stehende Position in der Gruppe einnimmt. In Verbindung mit »in ihre Mitte« ist »trat« natürliches modernes Deutsch, ohne das Geschehen als bloßes Erscheinen zu deuten.
- source_word: ἐν μέσῳ αὐτῶν
  choice: in ihre Mitte
  rationale: Die Wendung bezeichnet seine Gegenwart mitten in der versammelten Gruppe. »In ihre Mitte« ist verständlich, würdevoll und erhält stärker als »unter ihnen« das räumliche Bild des griechischen Ausdrucks.
theological_decisions:
- issue: Ob die längere byzantinische Lesart mit dem Friedensgruß in den Haupttext aufgenommen wird
  choice: Im Haupttext ausgelassen, entsprechend dem vorgegebenen SBLGNT-Text.
  alternative: '»und sagte zu ihnen: ›Friede sei mit euch!‹«'
  rationale: Die bereitgestellte griechische Textgrundlage endet mit αὐτῶν und enthält den Gruß nicht. Die bedeutsame abweichende Lesart wird in einer Fußnote dokumentiert, statt den Haupttext an vertraute Überlieferungen anzugleichen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Formulierung bewahrt den laufenden Charakter des Gesprächs, die Betonung von αὐτός und das räumliche Bild der Mitte.
