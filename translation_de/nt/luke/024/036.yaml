  source_fidelity: Die Wiedergabe des Genitivus absolutus („Während sie noch darüber redeten“) trifft die gleichzeitig andauernde Rede gut; „er selbst“ gibt die Betonung von αὐτός wieder. „trat ... in ihre Mitte“ fügt jedoch eine Bewegung hinzu, die ἔστη („stand [da]“) nicht ausdrücklich bezeichnet.
  naturalness: „Während sie noch darüber redeten, stand er selbst in ihrer Mitte“ ist natürliches modernes Standarddeutsch und bewahrt zugleich den leicht feierlichen Erzählton.
  terminology: „in ihrer Mitte“ gibt ἐν μέσῳ αὐτῶν räumlich und idiomatisch wieder. Die Fußnote kennzeichnet die ausgelassene längere Lesart angemessen; der historische Präteritumsgebrauch in der deutschen Fußnote ist idiomatisch.
  issues:
