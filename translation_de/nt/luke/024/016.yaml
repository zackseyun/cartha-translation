id: LUK.24.16
reference: Luke 24:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: de
  text: Doch ihre Augen wurden daran gehindert, ihn zu erkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Augen wurden zurückgehalten, sodass sie ihn nicht erkannten.“ Das Griechische lässt offen, wer oder was ihr Erkennen verhinderte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: 'δέ markiert hier eine leichte Gegenüberstellung: Jesus kam zu ihnen, doch sie erkannten ihn nicht. „Doch“ gibt diesen erzählerischen Kontrast natürlich wieder.'
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ihre Augen
  rationale: Die konkrete Bildsprache des griechischen Textes bleibt erhalten, statt sie zu „sie konnten nicht“ zu abstrahieren.
- source_word: ἐκρατοῦντο
  choice: wurden davon abgehalten
  rationale: Die passive Form bezeichnet ein Festhalten beziehungsweise Hindern, ohne den Handelnden zu nennen. Die deutsche Formulierung bewahrt sowohl das Passiv als auch die Nichtnennung des Urhebers.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: ihn zu erkennen
  rationale: ἐπιγινώσκω bedeutet in diesem Zusammenhang, Jesus als den Anwesenden zu identifizieren. Die Infinitivkonstruktion bezeichnet, woran ihre Augen gehindert wurden.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich im Zusammenhang eindeutig auf Jesus.
theological_decisions:
- issue: Wer das Erkennen verhinderte
  choice: 'Der Urheber bleibt ungenannt: „ihre Augen wurden davon abgehalten“'
  alternative: „Gott hinderte sie daran, ihn zu erkennen“ oder „sie konnten ihn nicht erkennen“
  rationale: Das griechische Passiv nennt keinen Handelnden. Die Übersetzung fügt daher weder ausdrücklich göttliches Handeln ein noch löst sie das Passiv in eine bloße Unfähigkeit der Jünger auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die konkrete Rede von den „Augen“ sowie das unpersönliche Passiv des Ausgangstextes bleiben gewahrt.
