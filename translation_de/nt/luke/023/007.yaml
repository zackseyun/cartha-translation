source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: de
  text: Als er erfuhr, dass Jesus in den Zuständigkeitsbereich des Herodes fiel[a], schickte er ihn zu Herodes, der sich in diesen Tagen ebenfalls in Jerusalem aufhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Herrschaftsgewalt des Herodes unterstand“. Der griechische Ausdruck kann sowohl dessen Herrschaftsgebiet als auch dessen rechtliche Zuständigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Als er erfuhr
  rationale: Das Aoristpartizip bezeichnet eine Erkenntnis, die der Haupthandlung vorausgeht. Die temporale Wiedergabe ist im Deutschen natürlich und wahrt die zeitliche Abfolge.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: dass Jesus in den Zuständigkeitsbereich des Herodes fiel
  rationale: Die Wendung bezeichnet hier den politisch-rechtlichen Herrschafts- und Zuständigkeitsbereich des Herodes. „Zuständigkeitsbereich“ gibt den administrativen Sinn wieder, ohne ἐξουσία auf bloße Macht zu verengen. Der Name „Jesus“ verdeutlicht im Deutschen den Bezug des griechischen Pronomens und verhindert eine Verwechslung mit dem Subjekt des Satzes.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: schickte er ihn zu Herodes
  rationale: ἀναπέμπω kann in diesem gerichtlichen Zusammenhang das Weiterleiten eines Beschuldigten bezeichnen. Die schlichte Formulierung bleibt nah am Wortlaut; der rechtliche Kontext wird bereits durch „Zuständigkeitsbereich“ deutlich.
- source_word: ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις
  choice: der sich ebenfalls in Jerusalem aufhielt
  rationale: Das Partizip bezieht sich auf Herodes; καὶ αὐτόν hebt hervor, dass auch er damals in Jerusalem war. „sich aufhielt“ ist für die vorübergehende Anwesenheit idiomatischer als ein bloßes „war“.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: in diesen Tagen
  rationale: Die Wiedergabe bewahrt die deiktische Nähe des griechischen ταύταις und ist auch in deutscher Erzählsprache natürlich.
theological_decisions:
- issue: Politisch-rechtliche Bedeutung von ἐξουσία in Bezug auf Herodes
  choice: Zuständigkeitsbereich
  alternative: Herrschaftsbereich; Gerichtsbarkeit; Vollmacht
  rationale: Im Zusammenhang geht es um die regionale beziehungsweise rechtliche Zuständigkeit des Herodes Antipas. „Zuständigkeitsbereich“ hält die administrative und juristische Dimension zusammen, ohne dem Begriff hier eine theologische Bedeutung zu geben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt übersichtlich; „ebenfalls“ bewahrt die Hervorhebung von καὶ αὐτόν. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
