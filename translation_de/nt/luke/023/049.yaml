  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: de
  text: Aber alle, die ihn kannten,[a] standen in einiger Entfernung, ebenso die Frauen, die ihm von Galiläa her gefolgt waren und dies beobachteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle seine Bekannten“. Das griechische Wort kann Menschen bezeichnen, die jemandem bekannt sind, also Bekannte oder Angehörige seines weiteren Umfelds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: standen
  rationale: Das Plusquamperfekt von ἵστημι beschreibt hier einen bereits bestehenden, andauernden Zustand. Im Deutschen gibt „standen“ diesen szenischen Hintergrund natürlich wieder; „hatten gestanden“ wäre missverständlich.
- source_word: δὲ
  choice: Aber
  rationale: δέ markiert einen leichten Kontrast beziehungsweise Szenenwechsel von den unmittelbar zuvor geschilderten Ereignissen zu den abseits stehenden Beobachtenden.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: alle, die ihn kannten
  rationale: γνωστοί bezeichnet Personen, die jemandem bekannt sind, also Bekannte oder Angehörige seines weiteren Umfelds. Die Formulierung bewahrt die relationale Bedeutung, ohne eine engere Freundschaft vorauszusetzen.
- source_word: μακρόθεν
  choice: in einiger Entfernung
  rationale: Das Adverb bezeichnet räumliche Distanz. Diese Formulierung ist in modernem Deutsch natürlich und vermeidet den altertümlichen Klang von „von ferne“.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: die Frauen, die ihm … gefolgt waren
  rationale: Artikel und Partizip kennzeichnen eine bestimmte, im Erzählzusammenhang identifizierbare Frauengruppe. Das Plusquamperfekt gibt ihre vorausgehende Begleitung bis zu dieser Szene idiomatisch wieder.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: von Galiläa an
  rationale: ἀπό kann hier den Ausgangspunkt der Begleitung bezeichnen. „Von Galiläa an“ macht deutlich, dass die Frauen Jesus seit seinem Weg aus Galiläa begleitet hatten, statt lediglich ihre Herkunft anzugeben.
- source_word: ὁρῶσαι ταῦτα
  choice: sahen dies alles mit an
  rationale: Das präsentische Partizip bezeichnet ihr fortdauerndes Augenzeugnis. „Mit ansehen“ ist idiomatisch und bringt die beobachtende Teilnahme zum Ausdruck; „dies alles“ gibt den pluralischen Rückverweis ταῦτα natürlich wieder.
