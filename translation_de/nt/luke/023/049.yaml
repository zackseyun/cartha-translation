    rationale: ὁρῶσαι ist feminin plural und bezieht sich unmittelbar auf γυναῖκες; der griechische Text kennzeichnet ausdrücklich die Frauen als die Beobachtenden.
  - severity: low
    issue: „dies alles“ verstärkt den Umfang des Demonstrativums.
    rationale: ταῦτα bedeutet „dies/diese Dinge“; ein zusätzliches „alles“ ist nicht erforderlich.
  - severity: low
    issue: „von Galiläa an“ kann stärker zeitlich („seit“) als räumlich-quellbezogen verstanden werden.
    rationale: ἀπὸ τῆς Γαλιλαίας bezeichnet hier den Ausgangspunkt der Begleitung; „von Galiläa her“ bildet dies klar und idiomatisch ab.
