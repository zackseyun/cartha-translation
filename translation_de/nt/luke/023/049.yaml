translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht gegliedert, damit beide Gruppen und ihre gemeinsame Beobachtung klar erkennbar bleiben. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wendung.
