  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Handlungsablauf des griechischen Textes zuverlässig wieder: die versammelten Menschen, das Sehen des Geschehenen, die Rückkehr und das begleitende Sich-an-die-Brust-Schlagen. Die Satzteilung mit „Dann“ stellt die vom Aoristpartizip ausgedrückte Vorzeitigkeit verständlich dar; „dabei“ wahrt die Gleichzeitigkeit der Geste mit dem Zurückkehren. „All die Menschen“ ist eine natürliche deutsche Wiedergabe des pluralischen ὄχλοι, ohne fälschlich die gesamte Menschheit zu meinen.'
  naturalness: Modernes, gut verständliches und angemessen würdevolles Deutsch. „Zu diesem Schauspiel zusammengekommen“ ist idiomatisch; die Alternative „Anblick“ ist sinnvoll vermerkt. Die Formulierung „schlugen sich dabei an die Brust“ ist natürlich und anschaulich.
  terminology: „Schauspiel“ trifft den öffentlichen Betrachtungscharakter von θεωρία; die Fußnote bewahrt mit „Anblick“ die weniger konnotierte lexikalische Möglichkeit. Die Geste τύπτοντες τὰ στήθη wird körperlich beschrieben, ohne Reue oder eine sonstige innere Haltung festzulegen. Die kulturgeschichtliche Fußnote erläutert mögliche Ausdruckswerte vorsichtig und nicht exklusiv.
