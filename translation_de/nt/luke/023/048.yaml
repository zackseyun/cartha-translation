id: LUK.23.48
reference: Luke 23:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: de
  text: Und all die Menschen, die zu diesem Schauspiel[a] zusammengekommen waren, sahen, was geschehen war. Dann kehrten sie zurück und schlugen sich dabei an die Brust.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu diesem Anblick“.'
    reason: lexical_alternative
  - marker: b
    text: Das Sich-an-die-Brust-Schlagen war eine Geste der Trauer, der Klage oder der Bestürzung.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: zusammengekommen waren
  rationale: Das Partizip bezeichnet Menschen, die gemeinsam an den Ort gekommen waren. Das Plusquamperfekt gibt die Vorzeitigkeit gegenüber dem Sehen und Zurückkehren natürlich wieder.
- source_word: ὄχλοι
  choice: all die Menschen
  rationale: Der griechische Plural bezeichnet die versammelten Menschenmengen. „All die Menschen“ ist im modernen Deutschen natürlicher als „alle Menschenmengen“ oder „alle Scharen“ und bewahrt den umfassenden Bezug von πάντες.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: zu diesem Schauspiel
  rationale: θεωρία bezeichnet hier einen Anblick beziehungsweise ein öffentlich betrachtetes Geschehen. „Schauspiel“ bewahrt diesen Aspekt, ohne das Ereignis als bloße Unterhaltung zu deuten; „Anblick“ wird als lexikalische Alternative in der Fußnote genannt.
- source_word: θεωρήσαντες
  choice: sahen
  rationale: Das Aoristpartizip bezeichnet eine dem Zurückkehren vorausgehende Wahrnehmung. Die Aufteilung in zwei deutsche Sätze macht die zeitliche Folge klar und vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: τὰ γενόμενα
  choice: was geschehen war
  rationale: Diese idiomatische Formulierung gibt das substantivierte Partizip und die Vorzeitigkeit des Geschehens klar wieder.
- source_word: τύπτοντες τὰ στήθη
  choice: schlugen sich dabei an die Brust
  rationale: Die Wendung beschreibt eine körperliche Geste der Trauer, Bestürzung oder Klage. „Dabei“ macht deutlich, dass die Handlung das Zurückkehren begleitete.
- source_word: ὑπέστρεφον
  choice: kehrten sie zurück
  rationale: „Zurückkehren“ entspricht der Grundbedeutung. In Verbindung mit „dabei“ bleibt der szenische, andauernde Charakter des Imperfekts erkennbar.
theological_decisions:
- issue: Emotionale und geistliche Bedeutung der Reaktion der Menge
  choice: 'Die Übersetzung beschreibt nur die Geste: Sie schlugen sich an die Brust.'
  alternative: Die Menge bereute ihre Schuld oder bekannte sich schuldig.
  rationale: Der griechische Text nennt die körperliche Reaktion, deutet ihren inneren oder geistlichen Gehalt aber nicht ausdrücklich. Die Übersetzung lässt daher offen, ob Trauer, Entsetzen, Schuldgefühl, Reue oder eine Verbindung dieser Regungen gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Deutsch. Die Satzteilung dient der Klarheit und erhält die Abfolge der griechischen Partizipialkonstruktion. Die Wendung „all die Menschen“ vermeidet das unnatürliche „alle Menschenmengen“, ohne den umfassenden Sinn des griechischen Plurals aufzugeben.
