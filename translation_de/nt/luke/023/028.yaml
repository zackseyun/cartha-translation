  naturalness: „Ihr Töchter Jerusalems“ wirkt im modernen Standarddeutsch unnötig archaisch und weniger idiomatisch. „Töchter Jerusalems“ ist als bewusst bibelsprachliche Anrede verständlich und zugleich natürlicher. Satzzeichen mit Semikolon und Punkt bilden die zusammengehörige Gegenüberstellung angemessener ab als zwei Ausrufezeichen.
