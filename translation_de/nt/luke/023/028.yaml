  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: de
  text: 'Jesus wandte sich zu ihnen und sagte: „Töchter Jerusalems,[a] weint nicht über mich; weint vielmehr über euch selbst und eure Kinder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frauen von Jerusalem.“ Die griechische Anrede lautet wörtlich „Töchter Jerusalems“ und steht im Stil prophetischer Schriften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Jesus wandte sich zu ihnen um
  rationale: Das finite „wandte sich … um“ gibt das Aoristpartizip im natürlichen deutschen Erzählstil wieder; „zu ihnen“ bewahrt die durch πρός bezeichnete Ausrichtung. δέ wird nicht eigens übersetzt, weil der Übergang im Deutschen ohne ein zusätzliches „aber“ natürlicher wirkt.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Ihr Töchter Jerusalems
  rationale: Die wörtliche Anrede bewahrt den prophetisch-biblischen Klang und die korporative Bildsprache; „ihr“ kennzeichnet im Deutschen eindeutig den Vokativ.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: weint nicht über mich
  rationale: „Über jemanden weinen“ ist idiomatisches Deutsch und bildet die Verbindung von κλαίω mit ἐπί angemessen ab. Die Formulierung lässt offen, ob die laufende Handlung beendet oder allgemein untersagt werden soll.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: Weint vielmehr über euch selbst
  rationale: „Vielmehr“ drückt die korrigierende Gegenüberstellung aus. Die Wiederholung von „weint über“ erhält den Parallelismus des griechischen Textes.
- source_word: τὰ τέκνα ὑμῶν
  choice: eure Kinder
  rationale: „Kinder“ ist die schlichte und kontextgerechte Entsprechung von τέκνα.
theological_decisions:
- issue: Anrede Θυγατέρες Ἰερουσαλήμ
  choice: Ihr Töchter Jerusalems
  alternative: Ihr Frauen von Jerusalem
  rationale: Die Hauptfassung erhält die alttestamentlich-prophetische Ausdrucksweise und ihre mögliche korporative Resonanz, ohne sie auf eine bloße demografische Bezeichnung zu reduzieren. Die verständlichere sachliche Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vokativ wird durch „ihr“ verdeutlicht; die Ausrufezeichen entsprechen dem imperativischen Nachdruck, ohne zusätzliche inhaltliche Deutung.
