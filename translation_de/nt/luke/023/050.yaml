  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: de
  text: Und siehe, da war ein Mann namens Josef, ein Mitglied des Rates, ein guter und gerechter Mann—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Und siehe
  rationale: Bewahrt den lukanischen Aufmerksamkeitsruf und den Anschluss an die vorherige Erzählung. Die leicht feierliche Formulierung ist im biblischen Erzählstil verständlich und gibt ἰδού deutlicher wieder als eine bloße Glättung.
- source_word: ἀνὴρ
  choice: ein Mann
  rationale: Bezeichnet hier ausdrücklich einen erwachsenen Mann und wird daher nicht verallgemeinernd wiedergegeben.
- source_word: ὀνόματι Ἰωσὴφ
  choice: namens Josef
  rationale: Natürliche moderne Wiedergabe der dativischen Namensformel; die im Deutschen geläufige Namensform Josef wird verwendet.
- source_word: βουλευτὴς ὑπάρχων
  choice: da war … ein Mitglied des Rates
  rationale: βουλευτής bezeichnet ein Ratsmitglied, im Kontext wahrscheinlich ein Mitglied des jüdischen Rates. Die Konstruktion mit ὑπάρχων wird als natürliche deutsche Existenz- und Zustandsaussage wiedergegeben.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: ein guter und gerechter Mann
  rationale: Die Wiederholung von ἀνήρ bleibt als beschreibende Apposition erhalten. ἀγαθός wird mit „gut“, δίκαιος mit dem im Deutschen zugleich ethisch und biblisch anschlussfähigen „gerecht“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δίκαιος als Charakterisierung Josefs
  choice: gerecht
  alternative: rechtschaffen; ein Mann, der gut und recht handelte
  rationale: „Gerecht“ wahrt die ethische und religiöse Bedeutungsweite von δίκαιος, ohne daraus einen technischen Lehrbegriff zu machen. „Rechtschaffen“ wäre idiomatisch, würde aber den biblischen Wortklang und einen Teil der Bedeutungsbreite abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem lukanischem Erzählruf. Der Gedankenstrich bleibt erhalten, da der griechische Satz in Vers 50 inhaltlich in den folgenden Vers weiterführt. Keine Fußnote ist nötig, weil „gerecht“ die Bedeutungsbreite im Deutschen angemessen trägt.
