revisions:
- from: Dann nahm er ihn vom Kreuz herab, wickelte ihn in ein Leinentuch und legte ihn in ein in den Fels gehauenes Grab, in dem noch niemand gelegen hatte.
  to: Nachdem er ihn herabgenommen hatte, wickelte er ihn in ein Leinentuch und legte ihn in ein aus dem Fels gehauenes Grab, in dem noch niemand gelegen hatte.
  rationale: Die Revision entfernt die nicht ausdrücklich im Vers enthaltene Ergänzung „vom Kreuz“ und gibt zugleich die Vorzeitigkeit von καθελὼν gegenüber den folgenden Verben klar wieder. Alle übrigen Formulierungen bleiben nah am griechischen Text und natürlich im modernen Standarddeutsch.
