review_pass:
  verdict: revise
  source_fidelity: Die Aussagefolge und die zentralen Begriffe sind im Wesentlichen zutreffend wiedergegeben. „Vom Kreuz“ ist jedoch im griechischen Wortlaut dieses Verses nicht ausgedrückt, auch wenn es aus dem unmittelbaren Kontext hervorgeht. Es sollte daher im Übersetzungstext nicht ergänzt werden. Die vorzeitige Handlung des Aoristpartizips kann im Deutschen gut mit „nachdem“ wiedergegeben werden.
  naturalness: Der Entwurf ist flüssiges, würdiges modernes Standarddeutsch. „Nachdem er ihn herabgenommen hatte“ bildet die griechische Partizipialkonstruktion präzise und natürlich ab. „In dem noch niemand gelegen hatte“ ist idiomatisch und bewahrt die nicht näher spezifizierte Aussage von κείμενος, ohne unnötig auf „bestattet“ einzuengen.
  terminology: „Leinentuch“, „aus dem Fels gehauenes Grab“ und „legte ihn“ treffen σινδών, λαξευτός, μνῆμα und ἔθηκεν sachgerecht. Für die unbenutzte Grabstätte ist keine Fußnote erforderlich; die englischen Fußnotenmarker sind dort zudem offenbar vertauscht und stellen keinen Anlass dar, im deutschen Text eine alternative Bedeutung zu behaupten.
  issues:
  - severity: medium
    issue: Die Ergänzung „vom Kreuz“ steht nicht im griechischen Text von Lukas 23,53.
    rationale: καθελὼν bedeutet „nachdem er ihn herabgenommen hatte“; das Objekt bzw. der Ort, von dem herabgenommen wird, wird in diesem Vers nicht genannt. Der Kontext macht das Kreuz deutlich, doch die Übersetzung sollte die ausdrückliche Formulierung des Ausgangstextes wahren.
  - severity: low
    issue: „Dann“ ist als Wiedergabe von καί etwas stärker zeitlich-sequenzierend als nötig.
    rationale: καί verbindet hier schlicht die Handlungskette. Die Konstruktion mit „Nachdem“ gibt die Vorzeitigkeit des Partizips bereits wieder; ein zusätzliches „Dann“ ist entbehrlich.
  revised_text: Nachdem er ihn herabgenommen hatte, wickelte er ihn in ein Leinentuch und legte ihn in ein aus dem Fels gehauenes Grab, in dem noch niemand gelegen hatte.
