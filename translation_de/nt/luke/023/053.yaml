source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: de
  text: Nachdem er ihn herabgenommen hatte, wickelte er ihn in ein Leinentuch und legte ihn in ein aus dem Fels gehauenes Grab, in dem noch niemand gelegen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθελὼν
  choice: nahm er ihn vom Kreuz herab
  rationale: Das Aoristpartizip bezeichnet hier das Herabnehmen des Leichnams Jesu; „vom Kreuz“ ist im unmittelbaren Hinrichtungskontext eindeutig mitgemeint und macht den deutschen Satz natürlich verständlich.
- source_word: ἐνετύλιξεν
  choice: wickelte ihn
  rationale: Das Verb bezeichnet das Einwickeln in Stoff und wird ohne zusätzliche, im Griechischen nicht ausdrücklich genannte Bestattungsdetails wiedergegeben.
- source_word: σινδόνι
  choice: in ein Leinentuch
  rationale: σινδών bezeichnet ein Tuch aus Leinen, hier als Bestattungstuch; „Leinentuch“ ist präzise und allgemein verständlich.
- source_word: ἔθηκεν
  choice: legte ihn
  rationale: τίθημι bedeutet hier, den Leichnam in das Grab zu legen; „legte“ ist im Deutschen für diesen Bestattungsvorgang natürlich und würdevoll.
- source_word: μνήματι
  choice: in ein … Grab
  rationale: μνῆμα bezeichnet eine Grabstätte beziehungsweise ein Grab; „Grab“ passt zur antiken Felsgrabanlage, ohne eine moderne Erdgrube vorauszusetzen.
- source_word: λαξευτῷ
  choice: in den Fels gehauenes
  rationale: Das Adjektiv bezeichnet etwas aus Stein oder Fels Herausgehauenes. Die Formulierung gibt die Bauart des Grabes idiomatisch wieder.
- source_word: οὗ
  choice: in dem
  rationale: Das Relativadverb bezieht sich auf das Grab; im Deutschen ist „in dem“ hier eindeutiger und flüssiger als ein bloßes „wo“.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: noch niemand gelegen hatte
  rationale: Die Wortfolge betont, dass bis dahin niemand dort gelegen hatte. Die aktive Zustandsbeschreibung bewahrt κείμενος genauer als die interpretierende Passivform „beigesetzt worden war“.
theological_decisions:
- issue: Beschreibung der Bestattung und des Grabes
  choice: Josef legt Jesus in ein aus dem Fels gehauenes, bis dahin unbenutztes Grab.
  alternative: Josef legt Jesus in ein steinernes Grab, in dem noch nie jemand bestattet worden war.
  rationale: Die Übersetzung bleibt bei den historischen Angaben des Verses, ohne Einzelheiten aus den Parallelberichten oder weitergehende theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der griechischen Handlungskette, wird aber durch „Dann“ und finite Verben natürlich gestaltet. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext klar wiedergegeben werden.
