source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: de
  text: Auch Herodes behandelte ihn zusammen mit seinen Soldaten verächtlich und verspottete ihn. Er legte ihm ein prächtiges Gewand[a] an und schickte ihn zu Pilatus zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein glänzendes Gewand«. Das griechische Wort kann sowohl »prächtig« als auch »glänzend« oder »hell« bedeuten. Das Gewand dient im Zusammenhang wahrscheinlich dazu, Jesus durch eine vorgetäuschte Ehrung zu verspotten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: behandelte ihn verächtlich
  rationale: Das Verb bezeichnet, jemanden für nichts zu achten beziehungsweise ihm mit Verachtung zu begegnen. Die Formulierung gibt in natürlichem Deutsch sowohl die Geringschätzung als auch die öffentliche Erniedrigung wieder.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: zusammen mit seinen Soldaten
  rationale: στράτευμα kann Truppen oder Soldaten bezeichnen. Im erzählerischen Zusammenhang ist »Soldaten« konkret und allgemein verständlich.
- source_word: ἐμπαίξας
  choice: verspottete ihn
  rationale: »Verspotten« ist eine klare, würdige und kontextgerechte Wiedergabe des gezielten Lächerlichmachens.
- source_word: περιβαλὼν
  choice: legte ihm … an
  rationale: Das Partizip beschreibt das Anlegen oder Umlegen eines Kleidungsstücks. Die aktive Form wahrt die grammatische Zuordnung zu Herodes, ohne eine nicht ausdrücklich genannte Anweisung einzufügen.
- source_word: ἐσθῆτα λαμπρὰν
  choice: ein prächtiges Gewand
  rationale: ἐσθής bezeichnet ein Kleidungsstück oder Gewand; λαμπρός kann »glänzend«, »hell« oder »prächtig« bedeuten. »Prächtiges Gewand« lässt die ironische Zurschaustellung von Ehre erkennen, ohne das Kleidungsstück ausdrücklich als Königsrobe festzulegen.
- source_word: ἀνέπεμψεν
  choice: schickte ihn … zurück
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb die Rücksendung an die zuvor zuständige Autorität.
- source_word: τῷ Πιλάτῳ
  choice: zu Pilatus
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung des Gewandes innerhalb der Verspottung
  choice: Das Gewand als »prächtig« bezeichnen und dadurch den möglichen Spott durch vorgetäuschte Ehrung offenlassen.
  alternative: Das Kleidungsstück ausdrücklich als königliches Gewand oder als Zeichen des Wahnsinns deuten.
  rationale: Der unmittelbare Zusammenhang nennt Verachtung und Verspottung, doch der griechische Text beschreibt lediglich ein helles beziehungsweise prächtiges Kleidungsstück. Eine genauere Symboldeutung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. »Gewand« bewahrt den erzählerisch-feierlichen Ton, ohne altertümlich zu wirken. Die Stellung von »auch« gibt καὶ ὁ Ἡρῴδης wieder.
