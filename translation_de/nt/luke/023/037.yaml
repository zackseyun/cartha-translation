  source_fidelity: Der Entwurf gibt die koordinierende Anbindung, die herausfordernde Kondition („Wenn“), den bestimmten Königstitel und den Imperativ mit reflexivem Objekt sachgerecht wieder. Die finite Vergangenheitsform „sagten“ ist im Deutschen eine natürliche Wiedergabe des an den vorigen Vers angeschlossenen Partizips und fügt keine Spottbedeutung in λέγοντες ein.
