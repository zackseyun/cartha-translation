  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: de
  text: 'und sagten: „Wenn du der König der Juden[a] bist, dann rette dich selbst!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der König der Judäer“. Das griechische Wort Ἰουδαίων kann je nach Zusammenhang Juden oder Judäer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die übliche koordinierende Konjunktion verbindet die Äußerung mit der Handlung des vorausgehenden Verses.
- source_word: λέγοντες
  choice: sagten
  rationale: Das präsentische Partizip bezieht sich auf die Mehrzahl des Subjekts im vorausgehenden Kontext. Im natürlichen deutschen Erzählstil wird es als finites Verb wiedergegeben; eine Bedeutung wie „spotteten“ wird nicht in das Verb hineingelesen.
- source_word: Εἰ
  choice: wenn
  rationale: Leitet eine herausfordernde Bedingung ein und bewahrt den höhnischen Zweifel, ohne die Behauptung als anerkannt darzustellen.
- source_word: σὺ εἶ
  choice: du ... bist
  rationale: Die ausdrückliche Setzung von σύ hebt das Gegenüber hervor. Das deutsche Pronomen „du“ gibt diese direkte Zuspitzung natürlich wieder.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Der Artikel kennzeichnet hier den bestimmten, Jesus entgegengehaltenen Königstitel.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Im Passionsbericht ist dies der etablierte politisch-messianische Titel in Anklage und Spott. „Judäer“ bleibt als mögliche regionale bzw. ethnische Wiedergabe in der Fußnote erhalten.
- source_word: σῶσον
  choice: rette
  rationale: Der Aorist-Imperativ fordert eine konkrete Rettungstat. „Rette“ ist im Deutschen idiomatisch und bewahrt den Zusammenhang mit dem weiteren Gebrauch von σῴζω bei Lukas.
- source_word: σεαυτόν
  choice: dich selbst
  rationale: Gibt das reflexive Objekt direkt wieder; „selbst“ trägt die ausdrückliche Selbstbezüglichkeit des griechischen Pronomens.
theological_decisions:
- issue: Wiedergabe des spöttisch gebrauchten Königstitels βασιλεὺς τῶν Ἰουδαίων
  choice: der König der Juden
  alternative: der König der Judäer
  rationale: „König der Juden“ entspricht im Passionszusammenhang der geläufigen politischen und messianischen Titulierung. Da Ἰουδαῖοι je nach Kontext auch regional als „Judäer“ verstanden werden kann, wird diese echte lexikalische Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die finite Form „sagten“ vermeidet eine schwerfällige deutsche Partizipialkonstruktion. „Dann“ macht die Folgerung der konditionalen Herausforderung idiomatisch deutlich, ohne zusätzliche Sachinformation einzuführen.
