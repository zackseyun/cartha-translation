id: LUK.23.8
reference: Luke 23:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: de
  text: Als Herodes Jesus sah, freute er sich sehr; denn schon seit langer Zeit wollte er ihn sehen, weil er immer wieder von ihm gehört hatte, und er hoffte, Jesus irgendein Zeichen tun zu sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus irgendein Wunder tun zu sehen“. Das griechische Wort bedeutet wörtlich „Zeichen“ und kann eine Wundertat bezeichnen, die als bedeutsames Zeichen verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης
  choice: Herodes
  rationale: δέ führt die Erzählung weiter, braucht im natürlichen Deutschen hier aber keine eigene Wiedergabe; der Anschluss wird durch den temporalen Nebensatz deutlich.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: Als Herodes Jesus sah
  rationale: Das Aoristpartizip bezeichnet hier am natürlichsten den zeitlichen Umstand vor beziehungsweise beim Einsetzen der Freude.
- source_word: ἐχάρη λίαν
  choice: freute er sich sehr
  rationale: Die idiomatische deutsche Wendung gibt sowohl χαίρω als auch die Verstärkung durch λίαν klar und würdig wieder.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: schon seit langer Zeit wollte er ihn sehen
  rationale: Die periphrastische Konstruktion bezeichnet einen über längere Zeit anhaltenden Wunsch; „seit langer Zeit“ vermeidet eine unbegründete Festlegung auf Jahre.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: weil er immer wieder von ihm gehört hatte
  rationale: διά mit dem substantivierten Infinitiv bezeichnet den Grund. „Immer wieder“ lässt den durativen beziehungsweise wiederholten Aspekt des Präsensinfinitivs erkennen, ohne das Deutsche unnötig zu belasten.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: er hoffte, irgendein Zeichen zu sehen
  rationale: „Zeichen“ bewahrt den weiteren Bedeutungsumfang von σημεῖον und engt den Ausdruck nicht vorschnell auf „Wunder“ ein.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: das Jesus vollbringen würde
  rationale: Die Relativkonstruktion ist im Deutschen natürlich und gibt die von ὑπό markierte Urheberschaft wieder. Der Name „Jesus“ vermeidet einen im Deutschen möglichen unklaren Pronomenbezug.
theological_decisions:
- issue: Bedeutungsumfang von σημεῖον
  choice: Zeichen
  alternative: Wunder
  rationale: Der Zusammenhang legt zwar eine außergewöhnliche Tat nahe, doch „Zeichen“ bewahrt die mögliche Bedeutung einer bedeutsamen oder bestätigenden Handlung und löst die Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzgliederung durch Semikolon und neuen Satz verhindert einen überladenen Periodenbau. „Immer wieder gehört hatte“ macht den möglichen fortlaufenden beziehungsweise wiederholten Charakter der Berichte idiomatisch sichtbar.
