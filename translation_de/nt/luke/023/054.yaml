  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: de
  text: Es war der Rüsttag, und der Sabbat brach an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Sabbat dämmerte herauf.“ Gemeint ist der Beginn des Sabbats am Abend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: Rüsttag
  rationale: „Rüsttag“ ist die eingebürgerte deutsche Bezeichnung für den Vorbereitungstag vor dem Sabbat. Sie bewahrt den jüdisch-griechischen Tagesnamen, ohne ihn mit dem kontextuell möglichen, aber stärker deutenden „Freitag“ zu ersetzen.
- source_word: σάββατον
  choice: der Sabbat
  rationale: Obwohl im Griechischen kein Artikel steht, ist der wöchentliche Sabbat im Zusammenhang eindeutig bestimmt; im Deutschen ist daher der bestimmte Artikel natürlich.
- source_word: ἐπέφωσκεν
  choice: brach an
  rationale: Das Verb bezeichnet wörtlich das Heraufdämmern, kann hier jedoch den Beginn des Sabbats am Abend ausdrücken. „brach an“ gibt diesen zeitlichen Sinn natürlich wieder, ohne irrtümlich Morgendämmerung nahezulegen; die wörtlichere Bildsprache bleibt in der Fußnote erhalten.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Es war der Rüsttag
  rationale: Die knappe deutsche Formulierung gibt die genitivische griechische Wendung idiomatisch wieder und erhält „Rüsttag“ als erkennbare Tagesbezeichnung.
- source_word: καὶ
  choice: und
  rationale: Die Verknüpfung der beiden Aussagen wird entsprechend der erzählenden Koordination des griechischen Textes beibehalten.
theological_decisions:
- issue: Bedeutung von ἐπέφωσκεν beim Beginn des Sabbats
  choice: Der Sabbat brach an, das heißt, er begann am Abend.
  alternative: Der Sabbat dämmerte herauf.
  rationale: Im jüdischen Tagesverständnis begann der Sabbat am Abend. Die Übersetzung darf daher nicht den Eindruck erwecken, die Beisetzung habe am Morgen stattgefunden. Zugleich wird die ungewöhnliche Bildsprache des griechischen Verbs in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rüsttag“ ist ein etablierter biblischer Begriff; die leicht erklärungsbedürftige Bezeichnung vermeidet die interpretierende Ersetzung durch „Freitag“. „brach an“ ist idiomatisch und wahrt den Aspekt des beginnenden Sabbats.
