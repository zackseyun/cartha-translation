  source_fidelity: Die Übersetzung gibt den einsetzenden Charakter von ἤρξαντο, den forensischen Sinn von κατηγορεῖν, die drei gegen Jesus erhobenen Vorwürfe sowie die Titel χριστός und βασιλεύς insgesamt treffend wieder. „Von sich behauptet“ ist jedoch gegenüber dem neutralen λέγοντα leicht wertend; „sagt“ wahrt besser, dass dies die Darstellung der Ankläger ist, ohne deren Wertung zusätzlich zu verstärken.
  naturalness: Das Deutsch ist modernes, gut verständliches Standarddeutsch und die direkte Rede ist idiomatisch. Die geringfügige Anpassung zu „und sagt, er sei“ ist ebenso natürlich und syntaktisch klar.
  terminology: „Messias“ ist für χριστός in diesem titulären, politisch aufgeladenen Kontext angemessen. „Kaiser“ für Καίσαρ und „Steuern“ mit der Erläuterung zu φόροι sind passend. „Ein König“ erhält die zusätzliche königliche Prädikation, ohne die beiden Begriffe zu einem einzigen festen Titel zusammenzuziehen.
