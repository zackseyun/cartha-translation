id: LUK.23.2
reference: Luke 23:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: de
  text: 'Und sie begannen, ihn anzuklagen. Sie sagten: »Wir haben festgestellt, dass dieser Mann unser Volk in die Irre führt[a], uns verbietet, dem Kaiser Steuern[b] zu zahlen, und sagt, er sei der Messias, ein König[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unser Volk aufwiegelt« beziehungsweise »unser Volk vom rechten Weg abbringt«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Steuern oder Tribut, die dem römischen Herrscher zu entrichten waren.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »er sei Christus und König«; im Griechischen stehen »Messias/Christus« und »König« unmittelbar nebeneinander.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Und sie begannen, ihn anzuklagen
  rationale: Bewahrt den einsetzenden Aspekt von ἤρξαντο und den forensischen Sinn von κατηγορεῖν; die deutsche Akkusativkonstruktion ist natürlich.
- source_word: Τοῦτον
  choice: dieser Mann
  rationale: Gibt das deiktische und im Anklagekontext möglicherweise geringschätzige Demonstrativpronomen idiomatisch wieder.
- source_word: εὕραμεν
  choice: wir haben festgestellt
  rationale: Passt im Deutschen besser als das wörtliche „wir haben gefunden“ zu einer vorgetragenen Feststellung beziehungsweise Beschuldigung.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: unser Volk in die Irre führt
  rationale: διαστρέφω kann Irreführung, Verderbung oder Aufwiegelung bezeichnen. „In die Irre führen“ bleibt verständlich und legt die politische Tragweite nicht enger fest als der griechische Ausdruck.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: uns verbietet, dem Kaiser Steuern zu zahlen
  rationale: Das aus ἡμῶν naheliegende Subjekt des Infinitivs wird im Deutschen ausdrücklich gemacht; φόροι bezeichnet hier die an die römische Herrschaft zu entrichtende Steuer beziehungsweise den Tribut.
- source_word: λέγοντα αὑτὸν
  choice: von sich behauptet, er sei
  rationale: „Behauptet“ ist in einer Anklagerede idiomatisch und gibt die auf die eigene Person bezogene Aussage mit indirekter Rede wieder; der Konjunktiv markiert die berichtete Behauptung.
- source_word: χριστὸν βασιλέα
  choice: der Messias, ein König
  rationale: „Messias“ bewahrt den titularen jüdischen Sinn von χριστός; „ein König“ hält βασιλέα als zusätzliche königliche Bestimmung fest, ohne beide Begriffe zu einem feststehenden Titel zu verschmelzen.
theological_decisions:
- issue: Titularer Sinn von χριστός in der politischen Anklage
  choice: Messias
  alternative: Christus
  rationale: Hier bezeichnet χριστός den beanspruchten Gesalbten und königlichen Retter, nicht einen bereits namenartig gebrauchten Beinamen. „Messias“ macht diesen Titelcharakter im Deutschen deutlich.
- issue: Verhältnis von χριστόν und βασιλέα
  choice: der Messias, ein König
  alternative: der Messias und König; ein gesalbter König
  rationale: Die appositionale Wiedergabe erhält beide Akkusativprädikate und die Spannung zwischen messianischem und politisch-königlichem Anspruch, ohne sie interpretierend gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anklage wird in natürlicher direkter Rede wiedergegeben; „Kaiser“ ist die geläufige historische Bezeichnung für Caesar. Die Formulierung vermeidet konfessionelle Zusätze und wahrt die Mehrdeutigkeit von διαστρέφω sowie das syntaktisch-theologische Verhältnis von χριστός und βασιλεύς.
