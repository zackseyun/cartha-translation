source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: de
  text: 'Pilatus aber sagte zu den führenden Priestern und den Volksmengen: »Ich finde keinen Grund für eine Anklage gegen diesen Menschen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich finde keine Schuld an diesem Menschen.« Das griechische Wort αἴτιον kann »Schuld« oder »Vergehen« bedeuten; hier bezeichnet es im gerichtlichen Zusammenhang einen Grund für eine Anklage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ ist ein schwaches Bindewort; hier lässt »aber« den Gegensatz zwischen der Anklage und Pilatus’ Urteil erkennen, ohne ihn zu überzeichnen.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Die im Deutschen übliche Namensform.
- source_word: εἶπεν πρὸς
  choice: sagte zu
  rationale: Gibt die gewöhnliche Bedeutung der Verbindung von λέγω mit πρός natürlich und genau wieder.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet die ranghohe priesterliche Führung und nicht mehrere gleichzeitige Amtsinhaber des Hohenpriesteramts.
- source_word: ὄχλους
  choice: der Menge
  rationale: Obwohl der griechische Text den Plural hat, ist im Deutschen in dieser Szene der kollektive Singular idiomatischer; die anwesende Volksmenge bleibt klar bezeichnet.
- source_word: Οὐδὲν εὑρίσκω
  choice: Ich finde keinen
  rationale: Bewahrt das Präsens und gibt die verneinte Feststellung in natürlichem Deutsch wieder.
- source_word: αἴτιον
  choice: Grund für eine Anklage
  rationale: Im gerichtlichen Zusammenhang bezeichnet αἴτιον einen belastbaren Anklagegrund; die Formulierung macht diesen forensischen Sinn verständlich.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: gegen diesen Menschen
  rationale: Das wörtliche »in diesem Menschen« wäre im Deutschen unidiomatisch; zusammen mit dem gerichtlichen αἴτιον entspricht »gegen diesen Menschen« dem Sinn.
theological_decisions: []
