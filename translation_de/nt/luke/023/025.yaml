id: LUK.23.25
reference: Luke 23:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: de
  text: Darauf ließ er den Mann frei, der wegen Aufruhrs und Mordes ins Gefängnis geworfen worden war und den sie verlangten; Jesus aber lieferte er ihrem Willen aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: ließ … frei
  rationale: Bezeichnet hier die Freilassung eines Gefangenen und ist im Deutschen präzise und idiomatisch.
- source_word: διὰ στάσιν καὶ φόνον
  choice: wegen Aufruhrs und Mordes
  rationale: διά mit Akkusativ bezeichnet den Grund; στάσις meint im politischen Zusammenhang einen gewaltsamen Aufruhr, nicht bloß einen Streit.
- source_word: βεβλημένον εἰς φυλακήν
  choice: ins Gefängnis geworfen worden war
  rationale: Die Formulierung bewahrt das anschauliche βάλλω („werfen“) und gibt mit dem Plusquamperfekt den vorausliegenden, fortbestehenden Zustand wieder.
- source_word: ὃν ᾐτοῦντο
  choice: den sie verlangten
  rationale: Das Imperfekt bezeichnet ihr anhaltendes Verlangen. „Verlangten“ passt zum angespannten Kontext, ohne die Bitte ausdrücklich als förmliche Forderung auszudeuten.
- source_word: παρέδωκεν
  choice: lieferte … aus
  rationale: Bewahrt den für die Passionsgeschichte wichtigen Sinn des Übergebens und klingt im Zusammenhang einer Auslieferung natürlich.
- source_word: τῷ θελήματι αὐτῶν
  choice: ihrem Willen
  rationale: Gibt θέλημα knapp und formal entsprechend wieder und erhält das Gewicht ihrer bewussten Absicht.
- source_word: δὲ … δὲ
  choice: Darauf … aber
  rationale: Das erste δέ führt die Erzählung weiter, das zweite markiert den deutlichen Gegensatz zwischen dem freigelassenen Mann und Jesus.
theological_decisions:
- issue: Kontrast zwischen dem freigelassenen Aufrührer und Jesus
  choice: Der erzählerische Gegensatz bleibt ausdrücklich erhalten, ohne ihn theologisch auszudeuten.
  alternative: Ergänzungen wie „anstelle von Jesus“ oder eine ausdrückliche Deutung als Stellvertretung.
  rationale: Der Vers stellt Pilatus’ gegensätzliche Handlungen dar, formuliert aber selbst keine ausdrückliche Lehre über Stellvertretung.
- issue: Auslieferung Jesu an den Willen der Menge
  choice: „lieferte er ihrem Willen aus“ bewahrt sowohl den Übergabevorgang als auch die Willenskomponente.
  alternative: „tat er, was sie wollten“ oder „überließ er ihnen Jesus“.
  rationale: Die Alternativen glätten jeweils entweder παρέδωκεν oder θέλημα; die gewählte Fassung lässt die Spannung der griechischen Formulierung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur erhält den scharfen Kontrast des griechischen Textes; „ins Gefängnis geworfen“ bewahrt dessen anschauliche Ausdrucksweise.
