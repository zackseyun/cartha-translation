  terminology: »Berge«, »Hügel«, »Fallt auf uns« und »Bedeckt uns« sind treffende und registergerechte Entsprechungen. Die Fußnoten geben die Hosea-Anspielung und die mögliche kontextuelle Nuance von καλύπτω wieder, ohne den Haupttext auslegend zu überfrachten.
