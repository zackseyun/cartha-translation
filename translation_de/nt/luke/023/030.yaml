  source_fidelity: 'Der griechische Wortlaut wird präzise wiedergegeben: τότε als »Dann«, ἄρξονται λέγειν mit der ingressiven Nuance »werden sie anfangen, ... zu sagen«, die Anrede an Berge und Hügel, die beiden pluralischen Imperative sowie ἐφ’ ἡμᾶς als »auf uns«. Der Unterschied zwischen ὄρη und βουνοί bleibt mit »Bergen« und »Hügeln« erhalten.'
