id: LUK.23.30
reference: Luke 23:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: de
  text: 'Dann werden sie anfangen, zu den Bergen[a] zu sagen: »Fallt auf uns!«, und zu den Hügeln[b]: »Bedeckt uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Formulierung greift prophetische Gerichtssprache auf, besonders Hosea 10,8.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Verbergt uns!« Das Verb bedeutet wörtlich »bedecken«, bezeichnet hier aber zugleich das Verbergen vor dem kommenden Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die zeitliche Folge; »Dann« ist knapp, natürlich und bewahrt den Zukunftsbezug.
- source_word: ἄρξονται λέγειν
  choice: werden sie anfangen, … zu sagen
  rationale: Die Verbindung aus Futur und ergänzendem Infinitiv wird ausdrücklich wiedergegeben, sodass der einsetzende Vorgang nicht zu einem bloßen »sie werden sagen« verkürzt wird.
- source_word: τοῖς ὄρεσιν
  choice: zu den Bergen
  rationale: »Berge« gibt ὄρη wieder und erhält den Unterschied zum nachfolgenden βουνοῖς (»Hügel«).
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Fallt auf uns!
  rationale: Der Aoristimperativ im Plural wird als unmittelbare Aufforderung wiedergegeben; ἐπί mit Akkusativ bezeichnet hier die Bewegung auf die Sprecher zu beziehungsweise auf sie herab.
- source_word: τοῖς βουνοῖς
  choice: zu den Hügeln
  rationale: »Hügel« entspricht βουνοῖς und bewahrt den lexikalischen Kontrast zu den Bergen.
- source_word: Καλύψατε ἡμᾶς
  choice: Bedeckt uns!
  rationale: Die wörtliche Bedeutung »bedecken« bleibt erhalten; im Kontext schwingt das Verbergen vor dem kommenden Gericht mit.
theological_decisions:
- issue: Prophetische Gerichtssprache und Anspielung auf Hosea 10,8
  choice: Der konkrete Ruf an Berge und Hügel bleibt ohne deutende Erweiterung im Haupttext stehen.
  alternative: Den Ruf sinngemäß als Bitte wiedergeben, vor dem Gericht verborgen zu werden.
  rationale: Die wörtliche Bildsprache erhält die prophetische Anspielung und lässt ihre Gerichtsbedeutung hervortreten, ohne sie im Vers erklärend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist eindringlich formuliert; »Berge« und »Hügel« bleiben als unterschiedene Bildbegriffe erhalten.
