source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: de
  text: 'Doch auch Herodes hat ihn nicht für schuldig befunden; denn er hat ihn zu uns zurückgeschickt. Und siehe: Es ist von ihm nichts getan worden, was den Tod verdient.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und siehe: An ihm ist nichts geschehen, was den Tod verdient.“ Der Dativ αὐτῷ kann sich auf den Handelnden („von ihm“) oder relational auf Jesus („an ihm“) beziehen.'
    reason: Bewahrt die diskutierte Deutung des Dativs, ohne mit „festgestellt“ einen im griechischen Text nicht ausgedrückten gerichtlichen Vorgang hinzuzufügen.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Aber auch Herodes nicht
  rationale: 'Die knappe Ellipse des Griechischen wird bewahrt und nimmt das vorangehende Urteil des Pilatus auf: Auch Herodes stellte keine todeswürdige Schuld fest.'
- source_word: ἀνέπεμψεν
  choice: hat ... zurückgeschickt
  rationale: Im Erzählzusammenhang bezeichnet das Verb die Rücksendung Jesu von Herodes zu Pilatus; „zurückgeschickt“ gibt Richtung und Situation natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb Pilatus sich auf Herodes beruft.
- source_word: πρὸς ἡμᾶς
  choice: zu uns
  rationale: Entspricht der Richtungsangabe des griechischen Textes; Pilatus spricht dabei von sich und seinem Umfeld.
- source_word: καὶ ἰδοὺ
  choice: Und seht
  rationale: Der Aufmerksamkeitsruf wird in gegenwärtigem, würdigem Deutsch wiedergegeben, ohne das altertümliche „siehe“ zu verwenden.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: nichts ..., was den Tod verdient
  rationale: 'Gibt den juristischen Sinn wieder: Es liegt keine Tat vor, die mit dem Tod zu bestrafen wäre.'
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: Er hat ... getan
  rationale: Die aktive deutsche Formulierung gibt die im Kontext naheliegende Zuordnung der Tat zu Jesus klar und idiomatisch wieder; die Perfektbedeutung bleibt erhalten.
theological_decisions:
- issue: Bezug von αὐτῷ bei πεπραγμένον
  choice: 'Jesus als Handelnder: „Er hat nichts getan“'
  alternative: Aussage über das, was „an ihm“ festgestellt worden ist
  rationale: Der gerichtliche Zusammenhang spricht dafür, dass Pilatus Jesu Handlungen beurteilt und ihm keine todeswürdige Tat zuschreibt. Da die Dativkonstruktion auch relational verstanden werden kann, wird diese Möglichkeit in der Fußnote offengehalten.
- issue: Ergänzung der Ellipse nach „auch Herodes nicht“
  choice: Die Ellipse bleibt im Haupttext erhalten
  alternative: „Auch Herodes hat ihn nicht für schuldig befunden“
  rationale: Das Griechische nennt an dieser Stelle kein ausdrückliches Verb. Die knappe Form ist im Zusammenhang verständlich und vermeidet, eine bestimmte richterliche Formulierung in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem gerichtlichem Ton. Die griechische Ellipse wird bewusst nicht durch eine ausführliche Schuldformel aufgelöst; „seht“ bewahrt den auffordernden Charakter von ἰδού.
