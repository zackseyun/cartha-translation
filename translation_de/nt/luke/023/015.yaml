- from: 'Aber auch Herodes nicht; denn er hat ihn zu uns zurückgeschickt. Und seht: Er hat nichts getan, was den Tod verdient.[a]'
  to: 'Doch auch Herodes hat ihn nicht für schuldig befunden; denn er hat ihn zu uns zurückgeschickt. Und siehe: Es ist von ihm nichts getan worden, was den Tod verdient.[a]'
  rationale: Die Revision wahrt die gerichtliche Aussage und verbessert die Lesbarkeit der anfänglichen Ellipse. Sie gibt die passiv-perfektische Wendung ἐστὶν πεπραγμένον genauer wieder und formuliert die Fußnote textnäher. Die Ergänzung „hat ihn nicht für schuldig befunden“ ist aus dem unmittelbar vorangehenden Urteil des Pilatus getragen und macht die im Griechischen ausgelassene Prädikation für modernes Deutsch explizit.
