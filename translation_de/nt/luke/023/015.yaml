review_pass:
  verdict: revise
  source_fidelity: 'Die Hauptaussage ist zutreffend: Herodes hat Jesus zu Pilatus zurückgesandt, und Jesus hat keine todeswürdige Tat begangen. Die deutsche Fassung sollte jedoch die griechische Satzverknüpfung und die präsentische Feststellung „ist ... getan worden“ genauer wahren. Die Fußnote führt mit „festgestellt worden“ eine nicht im griechischen Wortlaut enthaltene forensische Nuance ein und ist als Alternative für αὐτῷ nicht ausreichend eng am Text.'
  naturalness: „Aber auch Herodes nicht“ ist als bewusste Ellipse verständlich, wirkt im modernen Standarddeutsch jedoch abgerissen. „Doch auch Herodes nicht“ mit einem ergänzten „hat ...“ ist natürlich und macht die vom Kontext getragene Ellipse klar. „Und seht“ ist verständlich, aber „Und siehe“ ist hier als knapper Aufmerksamkeitsmarker idiomatischer und näher an ἰδού.
  terminology: „Herodes“, „zurückgeschickt“ und „was den Tod verdient“ sind angemessen. Für πεπραγμένον αὐτῷ ist die passive, unpersönliche Form „ist von ihm getan worden“ die formal nähere Wiedergabe; zugleich bleibt in einer Fußnote die im Deutschen mögliche relationale Deutung des Dativs transparent.
  issues:
  - severity: medium
    issue: Die deutsche Hauptfassung verändert die griechische Konstruktion von „οὐδὲν ... ἐστὶν πεπραγμένον αὐτῷ“ zu „Er hat nichts getan“.
    rationale: Die aktive Umschreibung trifft den Kontext, gibt aber die passive perfektische Feststellung nicht wieder. „Es ist von ihm nichts getan worden“ bewahrt die Form und lässt die begründete Auslegung des Dativs als Handelnden erkennen.
  - severity: medium
    issue: Die Fußnote paraphrasiert die mögliche relationale Deutung mit „an ihm ist ... festgestellt worden“.
    rationale: „Festgestellt worden“ steht nicht im Ausgangstext und verschiebt die Aussage in Richtung eines ausdrücklichen richterlichen Befunds. Eine Alternative sollte die grammatische Mehrdeutigkeit benennen, ohne zusätzlichen Inhalt einzutragen.
  - severity: low
    issue: „Aber auch Herodes nicht“ ist ohne verbale Ergänzung im modernen Deutsch unnötig holprig.
    rationale: Das Griechische ist elliptisch, aber eine knappe Ergänzung wie „hat ihn nicht für schuldig befunden“ macht die vorausgesetzte Aussage explizit und bleibt im unmittelbaren Kontext von Pilatus’ Unschuldsfeststellung.
