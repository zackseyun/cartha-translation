base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: de
  text: 'Über ihm befand sich auch eine Inschrift[a][b]: „Dies ist der König der Juden.“[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Schild“, „eine Bekanntmachung“ oder „eine schriftliche Anklage“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „oberhalb von ihm“.'
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Formulierung lautet wörtlich: „Der König der Juden – dieser.“'
    reason: lexical_alternative
  - marker: d
    text: „Juden“ könnte in manchen Zusammenhängen auch mit „Judäer“ wiedergegeben werden; in diesem Kreuzigungstitel ist „Juden“ jedoch die traditionelle und kontextuell passende Übersetzung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: Inschrift
  rationale: Bezeichnet hier den schriftlich angebrachten Text. „Inschrift“ ist im Deutschen präzise und lässt offen, ob der Text vor allem als Schild, Bekanntmachung oder Anklageschrift verstanden wird.
- source_word: ἐπ’ αὐτῷ
  choice: über ihm
  rationale: ἐπί mit Dativ bezeichnet hier die räumliche Lage relativ zu Jesus; im Kreuzigungskontext ist „über ihm“ natürlich und sachlich.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Dies ist der König der Juden
  rationale: Die griechische Formulierung ist ohne ausdrückliches Verb und hebt mit οὗτος die bezeichnete Person hervor. Das im Deutschen ergänzte „ist“ ergibt einen klaren, natürlichen Satz, ohne die Aussage auszudeuten.
- source_word: Ἰουδαίων
  choice: Juden
  rationale: Im feststehenden Kreuzigungstitel ist „König der Juden“ die traditionelle und kontextuell passende Wiedergabe; „Judäer“ kann andernorts möglich sein, ist hier jedoch weniger treffend.
- source_word: δὲ καὶ
  choice: auch
  rationale: Die Partikelverbindung fügt im Erzählfluss ein weiteres Detail hinzu. Die deutsche Satzstellung mit „auch“ gibt diese additive Funktion natürlich wieder.
theological_decisions:
- issue: Charakter und Aussage der Kreuzigungsinschrift
  choice: Die Inschrift wird ohne interpretierenden Zusatz als Bezeichnung Jesu als „König der Juden“ wiedergegeben.
  alternative: Sie ausdrücklich als juristische Anklage, politischen Spott oder messianisches Bekenntnis kennzeichnen.
  rationale: Der Vers berichtet lediglich vom Vorhandensein und Wortlaut der Inschrift. Ob und wie sie ironisch, rechtlich oder theologisch zu verstehen ist, soll die Übersetzung nicht vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung ist knapp und erzählerisch natürlich. „Angebracht“ macht die Existenz der Inschrift im Deutschen idiomatisch deutlich, ohne ihre materielle Form oder juristische Funktion festzulegen.
