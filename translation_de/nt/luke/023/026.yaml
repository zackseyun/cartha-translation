id: LUK.23.26
reference: Luke 23:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: de
  text: Als sie Jesus abführten, ergriffen sie einen gewissen Simon aus Kyrene, der vom Land hereinkam,[a] und legten ihm das Kreuz[b] auf, um es hinter Jesus her zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vom Feld kam“. Das griechische Wort kann ein bestimmtes Feld oder allgemeiner das Land außerhalb der Stadt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen „das Kreuz“ hier genauer als „den Querbalken“. Im griechischen Text steht jedoch lediglich „das Kreuz“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: sie Jesus abführten
  rationale: „Abführen“ gibt das Wegführen unter Bewachung knapp und idiomatisch wieder. Der Name „Jesus“ macht den deutschen Satz nach dem vorausgehenden Kontext eindeutig, ohne den Sinn zu verändern.
- source_word: ἐπιλαβόμενοι
  choice: ergriffen sie
  rationale: Das Verb bezeichnet hier ein körperliches Zugreifen. „Ergriffen“ wahrt den Zwang der Handlung, ohne unnötig umgangssprachlich zu klingen.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: einen gewissen Simon aus Kyrene
  rationale: „Einen gewissen“ bildet das unbestimmte τινα ab; „aus Kyrene“ gibt die Herkunftsbezeichnung Κυρηναῖον in natürlichem Deutsch wieder.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: der vom Land hereinkam
  rationale: ἀγρός kann ein bestimmtes Feld oder allgemeiner das Land außerhalb der Stadt bezeichnen. „Vom Land hereinkam“ bewahrt diese räumliche Vorstellung und klingt im Deutschen natürlich.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: legten ihm das Kreuz auf
  rationale: Die Formulierung bildet sowohl das Auflegen als auch die auferlegte Last idiomatisch ab.
- source_word: τὸν σταυρὸν
  choice: das Kreuz
  rationale: σταυρός bezeichnet im Text das Kreuz; eine Spezifizierung als „Querbalken“ wäre historisch möglich, steht aber nicht ausdrücklich im griechischen Wortlaut.
- source_word: φέρειν ὄπισθεν τοῦ Ἰησοῦ
  choice: damit er es hinter Jesus hertrug
  rationale: Die finale Konstruktion gibt den Infinitiv φέρειν wieder. „Hinter Jesus her“ bewahrt die vorrangig räumliche Bedeutung von ὄπισθεν.
theological_decisions:
- issue: Ob σταυρός im Passionsbericht spezifisch als „Querbalken“ wiederzugeben ist
  choice: das Kreuz
  alternative: der Querbalken
  rationale: Der griechische Text verwendet den allgemeinen Ausdruck σταυρός und keinen ausdrücklich auf einen einzelnen Balken beschränkten Begriff. Die Übersetzung vermeidet daher eine nicht im Vers festgelegte historische Rekonstruktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einen gewissen“ bewahrt die leichte Distanz der griechischen Einführung; „hinter Jesus hertrug“ stellt die räumliche Anordnung des Zuges klar dar. Die Fußnotenmarker wurden unmittelbar an die jeweils erklärten Ausdrücke gesetzt.
