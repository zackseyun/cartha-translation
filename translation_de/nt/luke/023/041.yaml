  source_fidelity: Die Aussage über die verdiente gegenwärtige Bestrafung und Jesu fehlendes Unrecht wird grundsätzlich zutreffend wiedergegeben. Die Ergänzung „hier“ in „wir sind zu Recht hier“ verschiebt den ausdrücklichen Sinn jedoch auf den Aufenthaltsort, während δικαίως die gerechtfertigte Bestrafung qualifiziert. Eine explizite Benennung der aus dem Kontext und der Aussage klar erschließbaren Bestrafung ist im Deutschen genauer.
