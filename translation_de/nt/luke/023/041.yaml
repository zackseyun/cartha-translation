id: LUK.23.41
reference: Luke 23:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: de
  text: Und wir werden zu Recht bestraft; wir bekommen nämlich, was unsere Taten verdienen. Dieser aber hat nichts Unrechtes getan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίως
  choice: zu Recht
  rationale: Die geläufige deutsche Wendung bewahrt den Sinn, dass die Strafe gerecht und verdient ist.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν
  choice: denn wir bekommen, was unsere Taten verdienen
  rationale: Diese natürliche deutsche Formulierung gibt die Verhältnismäßigkeit zwischen den begangenen Taten und ihren gegenwärtig empfangenen Folgen wieder.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen erhält den ausdrücklichen Gegensatz zwischen den beiden Verbrechern und Jesus.
- source_word: οὐδὲν ἄτοπον
  choice: nichts Unrechtes
  rationale: Die Formulierung bezeichnet im gerichtlichen Zusammenhang klar ein Fehlverhalten, ohne die Aussage auf einen rein technischen Straftatbestand zu verengen.
- source_word: ἔπραξεν
  choice: hat ... getan
  rationale: Das deutsche Perfekt bezeichnet idiomatisch Jesu Handeln bis zu diesem Zeitpunkt.
theological_decisions:
- issue: Aussage des Verbrechers über Jesu Unschuld
  choice: dieser aber hat nichts Unrechtes getan
  alternative: dieser aber hat nichts Ungehöriges getan
  rationale: Die Übersetzung bewahrt das klare menschliche Zeugnis für Jesu Unschuld im unmittelbaren gerichtlichen Kontext, ohne weitergehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die einleitende Ellipse des Griechischen wird durch „sind ... hier“ natürlich ergänzt; der unmittelbare Kreuzigungskontext macht den Bezug deutlich.
