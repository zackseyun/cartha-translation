  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Amen, ich sage dir: Heute wirst du mit mir im Paradies sein.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: „Amen, ich sage dir heute: Du wirst mit mir im Paradies sein.“ Der griechische Text hatte ursprünglich keine moderne Zeichensetzung. Bei dieser Lesart gehört „heute“ zu „ich sage dir“ statt zu „wirst du … sein“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Amen
  rationale: In den Jesusworten leitet ἀμήν eine feierliche, autoritative Aussage ein. Das im Deutschen geläufige „Amen, ich sage dir“ bewahrt sowohl den semitischen Klang als auch die besondere Formel.
- source_word: σοι λέγω
  choice: ich sage dir
  rationale: Die wörtliche und im Deutschen etablierte Wiedergabe klingt natürlich und wahrt die feierliche Redeform.
- source_word: σήμερον
  choice: Heute
  rationale: Das Adverb wird in der Hauptlesart mit „wirst du … sein“ verbunden. Diese syntaktisch naheliegende Deutung bezieht die Zusage auf denselben Tag; die andere mögliche Zuordnung wird in der Fußnote bewahrt.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: Die direkte Wiedergabe bewahrt den persönlichen Gemeinschaftsaspekt des griechischen Ausdrucks.
- source_word: ἔσῃ
  choice: wirst du … sein
  rationale: Die Futurform von εἰμί wird mit dem natürlichen deutschen Futur wiedergegeben.
- source_word: παραδείσῳ
  choice: Paradies
  rationale: „Paradies“ ist die etablierte und sachlich passende deutsche Entsprechung in diesem eschatologischen Zusammenhang, ohne den Zustand oder Ort näher zu bestimmen, als es der Text tut.
theological_decisions:
- issue: Zuordnung von σήμερον („heute“) in einer ohne ursprüngliche moderne Zeichensetzung überlieferten Aussage mit Folgen für das Verständnis des Zwischenzustands
  choice: „Heute“ wird mit „wirst du mit mir im Paradies sein“ verbunden.
  alternative: '„Amen, ich sage dir heute: Du wirst mit mir im Paradies sein.“'
  rationale: Wortstellung, Redezusammenhang und der sonst wenig informative Zusatz „ich sage dir heute“ sprechen eher dafür, σήμερον auf die Erfüllung der Zusage zu beziehen. Da die ältesten griechischen Texte keine moderne Interpunktion hatten und die alternative Zuordnung grammatisch möglich ist, wird sie ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Formel „Amen, ich sage dir“ bleibt wegen ihrer Prägnanz und ihrer Verankerung im deutschen Bibelstil erhalten. Die Zeichensetzung macht die bevorzugte Lesart klar, während die echte syntaktische Alternative in der Fußnote sichtbar bleibt.
