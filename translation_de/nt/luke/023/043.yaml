  naturalness: '„Und er sagte zu ihm: ‚Amen, ich sage dir: Heute wirst du mit mir im Paradies sein.‘“ ist verständliches, würdevolles modernes Standarddeutsch. Die Formel „Amen, ich sage dir“ hat bewusst bibelsprachlichen Charakter, ist aber weiterhin geläufig und angemessen.'
