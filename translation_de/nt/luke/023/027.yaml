source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: de
  text: Eine große Menschenmenge folgte ihm, darunter Frauen, die sich an die Brust schlugen und um ihn klagten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt beschreibt das andauernde Mitgehen im Erzählverlauf; das deutsche Präteritum gibt dies in narrativer Prosa natürlich wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel führt die Erzählung weiter, ohne dass im Deutschen zwingend ein einleitendes „und“ oder „aber“ nötig ist.
- source_word: αὐτῷ
  choice: ihm
  rationale: Bei ἀκολουθέω bezeichnet der Dativ die Person, der man folgt; „ihm folgen“ ist die natürliche deutsche Konstruktion.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: eine große Menschenmenge
  rationale: Die Genitivverbindung bezeichnet eine große Menge aus dem Volk beziehungsweise aus Menschen. „Menschenmenge“ ist klar und idiomatisch, ohne die griechische Konstruktion mechanisch nachzubilden.
- source_word: καὶ γυναικῶν
  choice: darunter Frauen
  rationale: Die Frauen gehören zur folgenden Menge; „darunter“ macht diese Teilbeziehung deutlich und bereitet den eindeutig femininen Relativsatz vor.
- source_word: αἳ
  choice: die
  rationale: Das feminine Relativpronomen bezieht sich ausdrücklich auf die Frauen, nicht auf die gesamte Menge.
- source_word: ἐκόπτοντο
  choice: sich an die Brust schlugen
  rationale: Im Trauerzusammenhang bezeichnet das Medium ein körperliches Zeichen der Klage. Die idiomatische deutsche Wendung macht die Handlung verständlich, ohne sie auf bloßes Weinen zu reduzieren.
- source_word: ἐθρήνουν
  choice: klagten
  rationale: Das Verb bezeichnet hörbare Toten- oder Trauerklage. „klagten“ ist gegenwärtig, würdig und wahrt diesen aktiven Ausdruck der Trauer.
- source_word: αὐτόν
  choice: um ihn
  rationale: Bei „klagen“ bezeichnet „um ihn“ im Deutschen idiomatisch die Person, der die Trauer gilt.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die Formulierung bindet den Relativsatz entsprechend dem femininen griechischen Pronomen eindeutig an die Frauen und bewahrt durch „sich an die Brust schlugen“ sowie „klagten“ die beiden unterscheidbaren Trauerhandlungen.
