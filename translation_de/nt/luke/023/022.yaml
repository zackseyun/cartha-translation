source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: de
  text: 'Da sagte er zum dritten Mal zu ihnen: »Was hat dieser Mann denn Böses getan?[a] Ich habe an ihm nichts gefunden, was den Tod verdient.[b] Darum werde ich ihn erst bestrafen und dann freilassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit einem verkürzten einleitenden Protest: »Warum denn? Was hat dieser Mann Böses getan?« Das einleitende Τί kann so verstanden werden; es kann aber auch unmittelbar zu »was Böses« gehören.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »nichts Todeswürdiges«; auch: »keinen Grund für ein Todesurteil«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: zum dritten Mal
  rationale: Der adverbiale Akkusativ bezeichnet die dritte Wiederholung; »zum dritten Mal« ist im Deutschen natürlich und bewahrt den erzählerischen Nachdruck.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Warum denn? Was hat dieser Mann Böses getan?
  rationale: Τί kann hier als verkürzter, einleitender Protest verstanden werden, während γάρ den Einwand aufgreift. Die zweigliedrige Wiedergabe erhält den abrupten Gesprächsfluss; »Böses« wahrt die moralische Stärke von κακόν.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: nichts, was den Tod verdient
  rationale: 'Die Formulierung gibt den rechtlichen Sinn von αἴτιον θανάτου verständlich wieder: Pilatus findet nichts, das ein Todesurteil rechtfertigt, ohne den griechischen Ausdruck unnötig auszubauen.'
- source_word: εὗρον ἐν αὐτῷ
  choice: habe an ihm … gefunden
  rationale: Das Perfekt ist im Deutschen wegen der gegenwärtigen Bedeutung des Urteils idiomatisch. »An ihm« bildet ἐν αὐτῷ natürlich ab und vermeidet das stärker deutende »gegen ihn«.
- source_word: παιδεύσας
  choice: werde ich ihn bestrafen lassen
  rationale: Im Zusammenhang bezeichnet παιδεύω eine Strafmaßnahme unterhalb der Hinrichtung. »Bestrafen lassen« entspricht der richterlichen Rolle des Pilatus und legt die genaue Art der Strafe nicht fest.
- source_word: ἀπολύσω
  choice: freilassen
  rationale: ἀπολύω bezeichnet hier im gerichtlichen Zusammenhang die Freilassung; das deutsche Wort ist klar und idiomatisch.
theological_decisions:
- issue: Art der von Pilatus vorgeschlagenen Maßnahme (παιδεύσας)
  choice: Allgemein als »bestrafen lassen« wiedergeben, ohne die konkrete Strafe festzulegen.
  alternative: »züchtigen lassen« oder spezifischer »auspeitschen lassen«
  rationale: Der Vers hält die Spannung aufrecht, dass Pilatus Jesus nicht des Todes schuldig findet und dennoch eine geringere Strafe ankündigt. Das Verb selbst bestimmt die Form dieser Strafe nicht eindeutig; deshalb bleibt der Haupttext allgemein und nennt die engeren Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt mündlich und eindringlich, während die rechtliche Aussage verständlich formuliert ist. Die Passivveranlassung in »bestrafen lassen« entspricht natürlich der Stellung des Pilatus, ohne einen nicht ausdrücklich genannten Vollstrecker hervorzuheben.
