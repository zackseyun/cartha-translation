  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen des griechischen Textes zuverlässig wieder: Josefs zuvor bestehende Nichtzustimmung (ἦν συγκατατεθειμένος), die Paarung von βουλή und πρᾶξις, seine Herkunft aus Arimathäa sowie sein fortdauerndes Erwarten des Reiches Gottes. „Stadt der Juden“ bildet πόλεως τῶν Ἰουδαίων eng ab und vermeidet eine nicht ausdrücklich entschiedene Einengung auf eine rein geografische oder ethnische Deutung.'
  naturalness: Der Satz ist klares, würdevolles modernes Standarddeutsch. „Dieser hatte … nicht zugestimmt“ ist als betonte Wiederaufnahme der zuvor genannten Person im biblisch-narrativen Register natürlich. Der Gedankenstrich strukturiert die erklärende Fortführung verständlich.
  terminology: „Beschluss und … Vorgehen“ wahrt die Unterscheidung von βουλή und πρᾶξις; die Fußnote bietet mit „Plan und Handeln“ eine sinnvolle lexikalische Alternative. „Reich Gottes“ ist für βασιλεία τοῦ θεοῦ etabliert, verständlich und terminologisch konsistent. Arimathäa ist korrekt geschrieben.
