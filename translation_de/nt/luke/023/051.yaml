id: LUK.23.51
reference: Luke 23:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: de
  text: Dieser hatte ihrem Beschluss und ihrem Vorgehen nicht zugestimmt[a] – er stammte aus Arimathäa, einer Stadt der Juden, und wartete auf das Reich Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrem Plan und ihrem Handeln nicht zugestimmt“.'
    reason: Lexikalische Alternativen für βουλή und πρᾶξις; die Hauptfassung betont Beschluss und ausgeführtes Vorgehen, während die Alternative Absicht und Tun stärker hervorhebt.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: hatte … nicht zugestimmt
  rationale: Die Verbindung des Perfektpartizips mit ἦν bezeichnet eine bereits feststehende Haltung der Nichtzustimmung. Das deutsche Plusquamperfekt gibt diesen zeitlichen Bezug natürlich wieder.
- source_word: βουλῇ
  choice: Beschluss
  rationale: Im Zusammenhang bezeichnet βουλή eher das Ergebnis der Beratung beziehungsweise die gefasste Absicht als den Rat als Institution. „Beschluss“ vermeidet diese institutionelle Fehldeutung.
- source_word: πράξει
  choice: Vorgehen
  rationale: πρᾶξις bezeichnet neben dem Beschluss das tatsächliche Tun. „Vorgehen“ ist idiomatisch und wahrt die Unterscheidung zwischen Entscheidung und Ausführung.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: aus Arimathäa, einer Stadt der Juden
  rationale: Die Wiedergabe folgt der appositionellen Struktur des Griechischen und lässt die Wendung τῶν Ἰουδαίων bewusst offen, statt sie eindeutig ethnisch oder geografisch als „jüdisch“ beziehungsweise „in Judäa“ festzulegen.
- source_word: προσεδέχετο
  choice: wartete auf
  rationale: Der Imperfekt beschreibt eine fortdauernde, erwartungsvolle Haltung. „Wartete auf“ ist im modernen Deutsch natürlich und impliziert keine aktive Suche.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte, verständliche Wiedergabe und bewahrt das theologische Gewicht der lukanischen Wendung, ohne sie auf Herrschaftsausübung allein zu verengen.
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen greift Josef aus dem vorherigen Vers betont wieder auf. „Dieser“ erhält diese Markierung knapper und natürlicher als „Dieser Mann“.
theological_decisions:
- issue: Art von Josefs Distanzierung vom Vorgehen des Hohen Rates
  choice: Josef hatte ihrem Beschluss und ihrem Vorgehen nicht zugestimmt.
  alternative: Josef hatte nicht für ihren Beschluss gestimmt oder ihre Tat gebilligt.
  rationale: Der griechische Text bezeugt seine Nichtzustimmung zu βουλή und πρᾶξις, nennt aber weder ein förmliches Abstimmungsverfahren noch nähere Einzelheiten seiner Beteiligung. Die Übersetzung macht seine Distanzierung deutlich, ohne eine historische Rekonstruktion einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet den griechischen Einschub beziehungsweise die erläuternde Fortführung ab. Die ungewöhnliche Wendung „einer Stadt der Juden“ bleibt erhalten, um die Mehrdeutigkeit zwischen ethnischer und geografischer Zuordnung nicht stillschweigend aufzulösen.
