base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: de
  text: Aber auch zwei weitere, Verbrecher, wurden mit ihm geführt, um getötet zu werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Übeltäter“ oder „Straftäter“. Das griechische Wort bezeichnet Menschen, die schweres Unrecht begangen haben und hier als strafrechtlich Verurteilte dargestellt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um hingerichtet zu werden“. Das griechische Verb bedeutet hier „getötet werden“ und nennt selbst nicht die Art der Tötung; erst der Zusammenhang macht die Kreuzigung deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: wurden … abgeführt
  rationale: Der Imperfekt Passiv beschreibt das im Gang befindliche Abführen. Im Deutschen gibt das Präteritum Passiv den erzählerischen Verlauf natürlich wieder; „abgeführt“ passt zum Weg zur Vollstreckung.
- source_word: δὲ
  choice: Auch …
  rationale: δέ führt die Erzählung mit einem schwachen Anschluss weiter. Ein eigenes „und“ wäre zusammen mit dem einschließenden καί im Deutschen schwerfällig; der fortführende Zusammenhang ergibt sich natürlich aus der Satzfolge.
- source_word: καὶ
  choice: auch
  rationale: καί schließt die beiden anderen in das Geschehen mit Jesus ein. „Auch“ macht diese zusätzliche Beteiligung ausdrücklich.
- source_word: ἕτεροι
  choice: andere Männer
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet weitere männliche Personen neben Jesus. „Männer“ ist im Deutschen eine natürliche Explizierung des grammatischen Geschlechts.
- source_word: κακοῦργοι δύο
  choice: zwei Verbrecher
  rationale: κακοῦργοι bezeichnet Menschen, die schweres Unrecht begangen haben beziehungsweise als Straftäter verurteilt sind; „Verbrecher“ ist gegenwärtig, verständlich und dem Hinrichtungskontext angemessen. Die Apposition identifiziert die beiden anderen, ohne Jesus mit dieser Bezeichnung zu versehen.
- source_word: σὺν αὐτῷ
  choice: zusammen mit ihm
  rationale: σύν mit Dativ bezeichnet Begleitung. „Zusammen mit ihm“ gibt diese Beziehung klar wieder.
- source_word: ἀναιρεθῆναι
  choice: um getötet zu werden
  rationale: Der Aorist Passiv Infinitiv bezeichnet hier das Töten im Rahmen eines obrigkeitlichen Todesurteils, nennt aber für sich genommen nicht die Methode. Die Formulierung wahrt diesen weiteren Bedeutungsumfang.
theological_decisions:
- issue: Ob ἀναιρεθῆναι ausdrücklich als Kreuzigung wiederzugeben ist
  choice: „um getötet zu werden“
  alternative: „um gekreuzigt zu werden“ oder „um hingerichtet zu werden“
  rationale: Der Zusammenhang zeigt, dass die Tötung durch Kreuzigung geschieht; das Verb selbst bezeichnet jedoch allgemein das Zu-Tode-Bringen. Die Übersetzung legt deshalb die Hinrichtungsart an dieser Stelle nicht in das Verb hinein.
- issue: Ob „andere“ Jesus grammatisch als einen weiteren Verbrecher einordnet
  choice: „zwei andere Männer, zwei Verbrecher“ als erklärende Apposition
  alternative: „zwei andere Verbrecher“
  rationale: Die griechische Wortstellung unterscheidet ἕτεροι und κακοῦργοι δύο. Die Apposition bewahrt diese Differenz und vermeidet die unnötige Aussage, Jesus gehöre zur Kategorie der Verbrecher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist erzählerisch flüssig; die doppelte Bezeichnung „zwei andere Männer, zwei Verbrecher“ bildet die griechische Apposition verständlich ab. Die Passivkonstruktion und die allgemeine Tötungsbezeichnung bleiben erhalten.
