source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: de
  text: 'Jesus aber sagte immer wieder: „Vater, vergib ihnen, denn sie wissen nicht, was sie tun.“[a] Sie verteilten seine Gewänder und warfen Lose.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lassen den Satz aus: „Vater, vergib ihnen, denn sie wissen nicht, was sie tun.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte immer wieder
  rationale: Der Imperfekt bezeichnet hier ein andauerndes oder wiederholtes Sprechen. Die Formulierung macht diesen Aspekt in natürlichem Deutsch deutlich.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ ist eine direkte Anrede; ein Possessivpronomen steht im Griechischen nicht.
- source_word: ἄφες
  choice: vergib
  rationale: Im Gebet zu Gott für Menschen, die schuldig werden, gibt „vergib“ den kontextuellen Sinn von ἀφίημι treffend wieder.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Pronomen lässt offen, welche Personen genau gemeint sind; „ihnen“ bewahrt diese Unbestimmtheit.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: denn sie wissen nicht, was sie tun
  rationale: Die direkte Wiedergabe mit „wissen“ vermeidet die interpretierende Erweiterung „verstehen“.
- source_word: διαμεριζόμενοι
  choice: verteilten ... unter sich
  rationale: Im Zusammenhang mit mehreren Kleidungsstücken und dem anschließenden Losverfahren bezeichnet das Partizip deren Aufteilung; die deutsche Wendung ist natürlich und präzise.
- source_word: ἱμάτια
  choice: Gewänder
  rationale: „Gewänder“ bezeichnet die Kleidungsstücke in einem verständlichen, würdevollen Erzählregister.
- source_word: ἔβαλον κλήρους
  choice: warfen das Los darum
  rationale: Die idiomatische Wendung beschreibt das antike Losverfahren; der Singular ist im Deutschen für die Entscheidung durch das Los üblich.
- source_word: δὲ
  choice: aber / dann
  rationale: Das erste δέ markiert einen leichten Kontrast, das zweite führt die Erzählung weiter. Die kontextabhängige Wiedergabe ergibt flüssiges Deutsch.
theological_decisions:
- issue: Textzugehörigkeit des Gebets „Vater, vergib ihnen ...“
  choice: Das Gebet steht im Haupttext.
  alternative: Einige Handschriften lassen das gesamte Gebet aus.
  rationale: Der vorgegebene SBLGNT-Text druckt die Passage als Text, kennzeichnet sie jedoch als bedeutende textkritische Variante. Der Haupttext folgt dieser Edition; die Fußnote wahrt die Überlieferungslage, ohne sie theologisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sagte immer wieder“ bildet den imperfektiven Aspekt ausdrücklich ab. Die genaue Bezugsgruppe von „ihnen“ bleibt wie im Griechischen offen.
