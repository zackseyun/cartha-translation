  rationale: Die Revision bewahrt die ausdrückliche Imperfektwiedergabe und den würdevollen Registerton. Sie ersetzt die semantisch engere und zusätzlich konkretisierende Formulierung „warfen das Los darum“ durch die dem griechischen Plural entsprechende, natürliche Formulierung „warfen Lose“ und verschiebt den Variantenanker an das Ende des betroffenen Satzes.
