  verdict: revise
  source_fidelity: 'Die Wiedergabe des Gebets ist quellennah; „sagte immer wieder“ gibt den imperfektiven Charakter von ἔλεγεν vertretbar wieder. Im zweiten Satz gibt „warfen das Los darum“ jedoch ἔβαλον κλήρους nicht präzise wieder: Das griechische κλήρους steht im Plural, und „darum“ fügt eine im Wortlaut nicht ausgedrückte Bezugnahme hinzu.'
  naturalness: Der Text ist insgesamt natürliches, würdevolles modernes Standarddeutsch. „Sie verteilten seine Gewänder und warfen Lose“ ist sowohl idiomatisch als auch näher am griechischen Satzbau. Das Fußnotenzeichen sollte beim tatsächlich varianten Satz stehen, nicht nach der einleitenden Redeformel.
  terminology: „Vater“, „vergib“, „Gewänder“ und „Lose werfen“ sind angemessen. Die unbestimmte Bezugsgruppe von „ihnen“ bleibt erhalten. Die Fußnote gibt die relevante textkritische Auslassung sachgerecht wieder.
