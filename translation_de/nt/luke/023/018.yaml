source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: de
  text: 'Doch sie schrien alle zusammen: „Weg mit diesem Mann! Gib uns Barabbas frei!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: sie schrien
  rationale: Das Verb bezeichnet einen lauten, nachdrücklichen Aufschrei; „schrien“ gibt diese Intensität im modernen Deutschen natürlich wieder.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel markiert hier den Gegensatz zur vorausgehenden Handlung des Pilatus; „Doch“ bildet diesen Umschwung knapp ab.
- source_word: παμπληθεὶ
  choice: alle zusammen
  rationale: Das Adverb bezeichnet die Menge in ihrer Gesamtheit beziehungsweise ihr gemeinsames Handeln, ohne zwingend völlige innere Einstimmigkeit zu behaupten.
- source_word: λέγοντες
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das griechische Partizip führt den Inhalt des Rufes ein. Im Deutschen ist die direkte Rede nach einem Verb des Rufens ohne ein zusätzliches „und sagten“ natürlicher.
- source_word: Αἶρε
  choice: Weg mit
  rationale: In diesem Kontext fordert der Imperativ die Beseitigung Jesu. „Weg mit“ bewahrt die knappe, heftige Form des griechischen Befehls und lässt dessen konkrete letzte Konsequenz, die sich aus dem Kontext ergibt, unausgesprochen.
- source_word: τοῦτον
  choice: diesem Mann
  rationale: Das Demonstrativpronomen weist unmittelbar auf Jesus. „Diesem Mann“ ist im deutschen Ausruf idiomatisch und bewahrt die distanzierende Zeigefunktion.
- source_word: ἀπόλυσον
  choice: Lass … frei
  rationale: Der Imperativ bedeutet, jemanden aus dem Gewahrsam zu entlassen; „freilassen“ passt klar und natürlich in den gerichtlichen Zusammenhang.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Begünstigten der Freilassung und wird in der deutschen Konstruktion „jemandem jemanden freilassen“ direkt wiedergegeben.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Der Personenname wird gemäß der im Deutschen etablierten Form wiedergegeben.
theological_decisions:
- issue: Reichweite der Forderung Αἶρε τοῦτον
  choice: „Weg mit diesem Mann!“
  alternative: „Schaff diesen Mann fort!“ beziehungsweise ausdrücklich „Lass ihn hinrichten!“
  rationale: Der Wortlaut fordert Jesu Beseitigung, während die Hinrichtung als gemeinte Folge aus dem Passionskontext hervorgeht. Die Übersetzung bewahrt diese Spannung, statt die konkrete Vollzugsart in den Vers hineinzuschreiben.
translation_notes:
  register: Modernes, würdiges und zugleich dramatisch unmittelbares Standarddeutsch. Die zwei kurzen Imperative bewahren die Wucht des kollektiven Rufes; ein zusätzliches „und sagten“ wurde aus idiomatischen Gründen vermieden.
