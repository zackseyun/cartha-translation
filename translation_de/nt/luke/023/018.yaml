  naturalness: „Doch sie schrien alle zusammen“ und „Weg mit diesem Mann!“ sind natürliches, dramatisch angemessenes modernes Standarddeutsch. „Gib uns Barabbas frei!“ ist die idiomatische, unmissverständliche Formulierung für die gerichtliche Freilassung.
