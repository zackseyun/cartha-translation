  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: de
  text: Dieser war wegen eines Aufstands[a], der sich in der Stadt ereignet hatte, und wegen Mordes ins Gefängnis geworfen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Aufruhrs“. Das griechische Wort kann einen Aufstand, Aufruhr oder eine Revolte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Dieser
  rationale: Das Relativpronomen bezieht sich auf den zuvor genannten Barabbas. Da der Vers im Deutschen als eigenständiger Satz wiedergegeben wird, stellt „Dieser“ den Rückbezug klar und natürlich her.
- source_word: διὰ
  choice: wegen
  rationale: Mit dem Akkusativ bezeichnet διά hier den Grund seiner Inhaftierung. „Wegen“ gibt diesen kausalen Sinn knapp wieder und lässt sich natürlich auf Aufstand und Mord beziehen.
- source_word: στάσιν τινὰ
  choice: eines Aufstands
  rationale: στάσις bezeichnet hier eine gewaltsame Erhebung oder Revolte. „Aufstand“ ist im heutigen Deutsch verständlich und bewahrt den politischen Sinn. Das unbestimmte τινά wird durch den unbestimmten Artikel ausreichend wiedergegeben; „eines gewissen Aufstands“ klänge unnötig steif.
- source_word: γενομένην ἐν τῇ πόλει
  choice: der sich in der Stadt ereignet hatte
  rationale: Die attributive Partizipialkonstruktion wird als natürlicher Relativsatz wiedergegeben. Die Stadt wird nicht als Jerusalem identifiziert, da der griechische Text sie nicht ausdrücklich nennt.
- source_word: φόνον
  choice: Mordes
  rationale: φόνος bezeichnet in diesem gerichtlichen Zusammenhang Mord beziehungsweise vorsätzliche Tötung, nicht lediglich ein beliebiges Töten.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: ins Gefängnis geworfen worden
  rationale: Die passive Partizipialform von βάλλω wird mit „geworfen worden“ kraftvoll und zugleich idiomatisch wiedergegeben; φυλακή bezeichnet hier das Gefängnis.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält die beiden Haftgründe parallel zusammen. Der Fußnotenmarker steht unmittelbar nach der näheren Bestimmung des Aufstands.
