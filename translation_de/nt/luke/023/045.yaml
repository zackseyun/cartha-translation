    text: 'Wörtlicher: „riss in der Mitte“; auch: „riss mitten durch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: Die Sonne verlor ihr Licht
  rationale: Der Genitivus absolutus wird als natürliche deutsche Umstandsangabe wiedergegeben. ἐκλείπω bezeichnet hier das Ausbleiben beziehungsweise Versagen des Sonnenlichts, ohne zwingend einen astronomischen Mechanismus wie eine Sonnenfinsternis festzulegen.
- source_word: ἐσχίσθη
  choice: riss
  rationale: Das Passiv lässt sich im Deutschen bei einem Stoffgegenstand idiomatisch durch das intransitive „riss“ ausdrücken; das Geschehen bleibt ohne genannten Verursacher.
- source_word: δὲ
  choice: und
  rationale: δέ ist hier eine schwache fortführende Verknüpfung und wird natürlich mit „und“ wiedergegeben.
- source_word: τὸ καταπέτασμα
  choice: der Vorhang
  rationale: „Vorhang“ ist die verständliche moderne Bezeichnung für die textile Abtrennung; das traditionelle „Schleier“ wäre im heutigen Deutsch weniger sachgerecht.
- source_word: τοῦ ναοῦ
  choice: im Tempel
  rationale: ναός bezeichnet genauer das Tempelheiligtum. „Im Tempel“ ist im Haupttext flüssig; die genauere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: μέσον
  choice: mitten entzwei
  rationale: Die Formulierung bewahrt sowohl die Angabe der Mitte als auch den im Zusammenhang naheliegenden Ausgang des Zerreißens. Wörtlicher ist „in der Mitte“.
theological_decisions:
- issue: Bedeutung von ἐκλιπόντος in Bezug auf die Sonne
  choice: Die Sonne verlor ihr Licht
  alternative: Die Sonne verfinsterte sich; die Sonne wurde verfinstert; die Sonne erlosch; es gab eine Sonnenfinsternis
  rationale: Die Wiedergabe beschreibt die kosmische Verfinsterung, ohne den griechischen Ausdruck technisch als Sonnenfinsternis zu bestimmen oder ein vollständiges Erlöschen der Sonne zu behaupten.
- issue: Bezeichnung des καταπέτασμα
  choice: Vorhang
  alternative: Schleier
  rationale: „Vorhang“ bezeichnet die Abtrennung im Tempel verständlich und ohne konfessionell geprägte Zusatzdeutung.
- issue: Umfang von ναός
  choice: im Tempel
  alternative: im Tempelheiligtum
  rationale: Die allgemein verständliche Form bleibt im Haupttext; eine Fußnote weist darauf hin, dass das griechische Wort enger das Heiligtum bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig, bewahrt aber die knappe Verknüpfung der beiden Ereignisse. Astronomische Überbestimmung und konfessionelle Deutung werden vermieden.
