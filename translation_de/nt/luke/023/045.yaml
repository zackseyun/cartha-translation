  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: de
  text: Die Sonne verlor ihr Licht[a], und der Vorhang des Tempels[b] riss mitten entzwei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Sonne verfinsterte sich.“ Der griechische Ausdruck legt nicht fest, dass es sich um eine Sonnenfinsternis handelte.'
    reason: alternative_reading
  - marker: b
    text: 'Oder genauer: „der Vorhang des Tempelheiligtums“.'
    reason: lexical_alternative
