source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: de
  text: An eben diesem Tag wurden Herodes und Pilatus Freunde[a]; denn zuvor waren sie miteinander verfeindet gewesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wurden einander freundschaftlich gesinnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: wurden
  rationale: Der Aorist von γίνομαι bezeichnet hier den Eintritt in einen neuen Beziehungszustand; „wurden“ gibt diesen Wechsel knapp und natürlich wieder.
- source_word: φίλοι
  choice: Freunde
  rationale: Das prädikative φίλοι bezeichnet Freundschaft beziehungsweise ein freundschaftliches Verhältnis; „Freunde“ ist die direkte und idiomatische Wiedergabe, ohne die Art oder Tiefe dieser Beziehung näher festzulegen.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Herodes und Pilatus
  rationale: Die korrelative Konstruktion verbindet beide Beteiligten; im Deutschen genügt die natürliche Verbindung mit „und“.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: an eben diesem Tag
  rationale: „Eben diesem“ bewahrt die Hervorhebung durch αὐτῇ und den wiederholten Artikel.
- source_word: μετ’ ἀλλήλων
  choice: miteinander (im Ausdruck „miteinander verfeindet“)
  rationale: Der gegenseitige Charakter der Beziehung wird im Deutschen idiomatisch durch „miteinander“ ausgedrückt; bei „Freunde wurden“ ist die Gegenseitigkeit bereits in der Nennung beider Personen enthalten.
- source_word: προϋπῆρχον
  choice: zuvor … gewesen
  rationale: Das Imperfekt bezeichnet einen bereits vorher bestehenden und andauernden Zustand; das Plusquamperfekt mit „zuvor“ stellt den zeitlichen Gegensatz klar heraus.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: waren sie miteinander verfeindet gewesen
  rationale: Diese idiomatische deutsche Formulierung gibt den Zustand gegenseitiger Feindschaft wieder, ohne zusätzliche Motive oder Handlungen einzutragen.
theological_decisions:
- issue: Art der neuen Beziehung zwischen Herodes und Pilatus
  choice: Sie „wurden Freunde“
  alternative: Sie „wurden einander freundschaftlich gesinnt“ beziehungsweise nahmen freundschaftliche Beziehungen auf.
  rationale: Der Text berichtet einen Wechsel von gegenseitiger Feindschaft zu Freundschaft oder freundschaftlichem Einvernehmen, bestimmt aber weder dessen Tiefe noch dessen politische oder theologische Bedeutung näher. Die Fußnote bewahrt die mögliche schwächere Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An eben diesem Tag“ erhält die griechische Hervorhebung; „miteinander verfeindet“ ist gegenüber einer wörtlichen Wendung wie „in Feindschaft zueinander“ natürlicher, ohne den Sinn abzuschwächen.
