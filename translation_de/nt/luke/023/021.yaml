  text: οἱ δὲ ἐπεφώνουν λέγοντες· ⸂Σταύρου σταύρου⸃ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: de
  text: 'Doch sie schrien immer weiter: »Kreuzige ihn! Kreuzige ihn!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: »Richte ihn am Kreuz hin! Richte ihn am Kreuz hin!«'
    reason: Lexikalische Alternative, die die konkrete Hinrichtungsart ausdrücklich umschreibt.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Doch sie
  rationale: Das substantivierte οἱ verweist im Zusammenhang auf die zuvor genannte Menge; δέ kennzeichnet hier den Gegensatz zur vorangehenden Äußerung des Pilatus.
- source_word: ἐπεφώνουν
  choice: schrien immer weiter
  rationale: Das Imperfekt bezeichnet den anhaltenden beziehungsweise wiederholten Ruf; ἐπιφωνέω bringt dessen Lautstärke und Nachdruck zum Ausdruck.
- source_word: λέγοντες
  choice: nicht gesondert wiedergegeben
  rationale: Das begleitende Partizip führt den Inhalt des Rufens ein. Im Deutschen gibt die direkte Rede nach dem Doppelpunkt diese Funktion natürlicher wieder als ein zusätzliches »und sagten«.
- source_word: Σταύρου σταύρου
  choice: Kreuzige ihn! Kreuzige ihn!
  rationale: Der zweimalige Imperativ wird zur Wahrung von Dringlichkeit und Nachdruck wiederholt. Das im Griechischen nach beiden Imperativen stehende Objektpronomen wird im natürlichen Deutschen bei jedem Ruf ergänzt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen ist das direkte Objekt des wiederholten Imperativs und bezeichnet Jesus.
theological_decisions:
- issue: Wiedergabe der Hinrichtungsforderung σταύρου
  choice: Kreuzige ihn!
  alternative: Richte ihn am Kreuz hin!
  rationale: σταυρόω bezeichnet hier ausdrücklich die Hinrichtung durch Kreuzigung. »Kreuzigen« ist im Deutschen präzise, geläufig und fügt keine über den Wortsinn hinausgehende Deutung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, unmittelbarem Erzählton. Die idiomatische direkte Rede bewahrt die eindringliche Wiederholung des griechischen Befehls.
