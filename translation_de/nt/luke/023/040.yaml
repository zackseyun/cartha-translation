  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: de
  text: 'Der andere aber antwortete ihm und wies ihn zurecht: »Fürchtest nicht einmal du Gott, weil du unter demselben Urteil stehst?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter derselben Verurteilung« oder »im selben Urteil«. Das griechische Wort kann Gerichtsurteil, Verurteilung oder Strafurteil bezeichnen; hier steht die gemeinsame strafrechtliche Lage im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Der andere aber … sagte
  rationale: Die Konstruktion leitet seine Reaktion und direkte Rede ein. Im Deutschen wäre „antwortete … und sagte“ unnötig schwerfällig; „aber“ bewahrt den Kontrast.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: wies ihn zurecht
  rationale: Das präsentische Partizip bezeichnet die begleitende Art seines Sprechens; „zurechtweisen“ gibt den tadelnden Ton in natürlichem modernem Deutsch wieder.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Fürchtest nicht einmal du Gott
  rationale: „Nicht einmal“ wahrt die emphatische Kraft von οὐδέ, während das ausdrücklich gesetzte „du“ die Hervorhebung des griechischen σὺ erkennen lässt. „Gott fürchten“ bewahrt das gewichtige biblische Ausdrucksfeld.
- source_word: ὅτι
  choice: obwohl
  rationale: 'Im Kontext hat der Umstand, dass beide demselben Urteil unterliegen, konzessiv-rhetorische Kraft: Gerade in dieser Lage wäre Gottesfurcht zu erwarten. „Obwohl“ bildet diesen Zusammenhang im Deutschen klar ab, ohne den sachlichen Bezug zu verändern.'
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: du unter demselben Urteil stehst
  rationale: κρίμα kann Gericht, Urteil, Verurteilung oder Strafurteil bezeichnen. „Unter einem Urteil stehen“ ist idiomatisch und lässt die genaue Bedeutungsbreite eher offen als das engere „Strafe“.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: „Gott fürchten“
  alternative: „Gott Ehrfurcht erweisen“
  rationale: Die direkte Formulierung bewahrt sowohl Ehrfurcht als auch das Bewusstsein göttlicher Rechenschaft, ohne den Ausdruck abzuschwächen oder dogmatisch auszudeuten.
- issue: Bedeutung von κρίμα in der gemeinsamen Hinrichtungslage
  choice: „unter demselben Urteil“
  alternative: „unter derselben Verurteilung“ / „im selben Gericht“
  rationale: „Urteil“ passt zum rechtlich-strafenden Kontext, legt aber weniger eng als „Verurteilung“ fest, ob vor allem richterlicher Spruch, Verdammung oder dessen Straffolge gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stellung „nicht einmal du“ bewahrt die griechische Hervorhebung, ohne typografische Betonung einzuführen. Die Fußnotenmarkierung steht unmittelbar bei der mehrdeutigen Wendung.
