  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Das aoristische Partizip Ἰδών ist idiomatisch als Temporalsatz gefasst, τὸ γενόμενον als „was geschehen war“, und das Imperfekt ἐδόξαζεν wird mit dem im Deutschen natürlichen erzählenden Präteritum „pries“ wiedergegeben. „Gott preisen“ trifft δοξάζω in diesem Kontext angemessen. Die Aussage δίκαιος ἦν bleibt mit „war wirklich gerecht“ offen genug und wird nicht zu einer weitergehenden Aussage ausgeweitet.'
