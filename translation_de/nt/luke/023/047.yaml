id: LUK.23.47
reference: Luke 23:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: de
  text: 'Als der Hauptmann sah, was geschehen war, pries er Gott und sagte: »Dieser Mensch war wirklich gerecht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unschuldig« beziehungsweise »rechtschaffen«. Das griechische Wort kann hier sowohl moralische Gerechtigkeit als auch rechtliche Unschuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Als ... sah
  rationale: Das Aoristpartizip von ὁράω wird als natürlicher deutscher Temporalsatz wiedergegeben und bleibt eng auf das Hauptverb bezogen.
- source_word: δὲ
  choice: unmarkiert
  rationale: Die schwache fortführende Partikel muss im Deutschen hier nicht eigens ausgedrückt werden; ein einleitendes »nun« würde den Erzählfluss unnötig markieren.
- source_word: ἑκατοντάρχης
  choice: Hauptmann
  rationale: Die im deutschen Bibelstil geläufige und allgemein verständliche Bezeichnung für den römischen Zenturio; der Kontext macht die militärische Funktion deutlich.
- source_word: τὸ γενόμενον
  choice: was geschehen war
  rationale: Die substantivierte Partizipialform bezeichnet das zuvor eingetretene Geschehen; das Plusquamperfekt stellt dessen Vorzeitigkeit natürlich dar.
- source_word: ἐδόξαζεν
  choice: pries
  rationale: Das Imperfekt bezeichnet die Handlung im Erzählverlauf. »Gott preisen« gibt δοξάζω natürlich und mit seinem religiösen Gewicht wieder, ohne durch »begann zu« eine nicht zwingende inchoative Nuance festzulegen.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Partizip wird in idiomatischem Deutsch als koordinierte Redeeinleitung wiedergegeben.
- source_word: Ὄντως
  choice: wirklich
  rationale: Das Adverb drückt eine nachdrückliche Bestätigung aus; »wirklich« ist gegenwärtig, klar und würdig.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: dieser Mensch
  rationale: Die Formulierung bildet ἄνθρωπος ausdrücklich ab und klingt im Deutschen in diesem feierlichen Urteil natürlich.
- source_word: δίκαιος
  choice: gerecht
  rationale: »Gerecht« bewahrt die moralische und theologische Weite des griechischen Wortes. Die im Prozesskontext mögliche Bedeutung »unschuldig« wird in der Fußnote offengehalten.
- source_word: ἦν
  choice: war
  rationale: Das Imperfekt von εἰμί wird im deutschen Rückblick schlicht mit dem Präteritum wiedergegeben.
theological_decisions:
- issue: Bedeutung von δίκαιος im Urteil des Hauptmanns
  choice: gerecht
  alternative: unschuldig; rechtschaffen
  rationale: »Gerecht« wahrt die moralisch-theologische Aussage, ohne sie auf einen bloßen juristischen Freispruch zu verengen. Zugleich legt der lukanische Passionskontext »unschuldig« nahe; diese echte Bedeutungsweite wird daher in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bibelsprachlicher Prägung. Der Satzbau ist klar und mündlich verständlich; die Redeeinleitung wird idiomatisch koordiniert. Die Fußnotenmarke steht unmittelbar bei dem mehrdeutigen Ausdruck.
