source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Ihr habt mir diesen Menschen vorgeführt mit der Beschuldigung, er führe das Volk irre.[a] Seht, ich habe ihn in eurer Gegenwart verhört und bei diesem Menschen keinen Grund für die Vorwürfe gefunden, die ihr gegen ihn erhebt.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er wende das Volk ab“. Das griechische Verb kann „abwenden“ oder „irreführen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich habe bei diesem Menschen hinsichtlich dessen, was ihr ihm vorwerft, keine Schuld gefunden.“'
    reason: alternative_rendering
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Ihr habt mir … vorgeführt
  rationale: Die Form bezeichnet das abgeschlossene Vorführen vor Pilatus; „vorführen“ passt natürlich zum gerichtlichen Rahmen.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: diesen Menschen
  rationale: „Mensch“ bildet ἄνθρωπος direkt ab und wahrt Pilatus’ distanzierte Bezeichnung Jesu.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: mit der Beschuldigung, er bringe das Volk vom rechten Weg ab
  rationale: Die Formulierung gibt ὡς als vorgebrachte Anschuldigung wieder. „Vom rechten Weg abbringen“ bewahrt den Gedanken des Abwendens beziehungsweise Irreführens, ohne das stärkere „aufwiegeln“ einzutragen.
- source_word: ἰδοὺ
  choice: Nun
  rationale: Als aufmerksamkeitslenkender Diskursmarker wird ἰδού in modernem, würdigem Deutsch idiomatisch mit „Nun“ wiedergegeben.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: ich habe ihn in eurer Gegenwart verhört
  rationale: ἀνακρίνω hat hier gerichtlichen Sinn; „verhört“ ist präzise, während „in eurer Gegenwart“ die Öffentlichkeit der Untersuchung betont.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: bei diesem Menschen keinen Grund … gefunden
  rationale: Die Wendung bewahrt die auffällige griechische Konstruktion und gibt αἴτιον im forensischen Sinn als Grund beziehungsweise Grundlage einer Beschuldigung wieder.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: für das, was ihr ihm vorwerft
  rationale: Die Formulierung gibt den Inhalt der Anklage idiomatisch wieder und erhält den gerichtlichen Ton.
theological_decisions:
- issue: Reichweite von Pilatus’ Feststellung
  choice: gerichtliche Feststellung, dass sich kein Grund für die erhobenen Vorwürfe finden ließ
  alternative: 'umfassende Aussage: „Ich finde keine Schuld an diesem Menschen“'
  rationale: ἀνακρίνω, αἴτιον und κατηγορέω bilden einen klar forensischen Zusammenhang. Die Übersetzung beschränkt Pilatus’ Aussage daher auf die vorgebrachten Anschuldigungen, ohne daraus ausdrücklich ein umfassendes moralisches Urteil zu machen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Gerichtsregister. Der Konjunktiv „er bringe“ kennzeichnet die Aussage als Beschuldigung, nicht als vom Erzähler bestätigte Tatsache. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
