  to: 'Er sagte zu ihnen: „Ihr habt mir diesen Menschen vorgeführt mit der Beschuldigung, er führe das Volk irre.[a] Seht, ich habe ihn in eurer Gegenwart verhört und bei diesem Menschen keinen Grund für die Vorwürfe gefunden, die ihr gegen ihn erhebt.[b]“'
