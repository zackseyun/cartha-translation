  text: ⸀ἐνέπαιξαν δὲ αὐτῷ καὶ οἱ στρατιῶται προσερχόμενοι, ⸀ὄξος προσφέροντες αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: de
  text: Auch die Soldaten verspotteten ihn; sie traten heran und boten ihm sauren Wein[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Essig. Das griechische Wort bezeichnet sauren Wein; traditionell wird es oft mit „Essig“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: verspotteten
  rationale: Das Verb bezeichnet feindseliges Verhöhnen oder Verspotten. „Verspotteten“ ist im modernen Deutschen natürlich und bewahrt den verächtlichen Charakter der Handlung.
- source_word: δὲ … καὶ
  choice: auch
  rationale: δέ führt die Erzählung weiter, während καί die Soldaten zu den zuvor Spottenden hinzufügt. „Auch“ gibt diese gemeinsame Aussagewirkung knapp und idiomatisch wieder.
- source_word: οἱ στρατιῶται
  choice: die Soldaten
  rationale: Die übliche und im Zusammenhang der römischen Hinrichtung eindeutige Wiedergabe.
- source_word: προσερχόμενοι
  choice: sie traten heran
  rationale: Das Partizip beschreibt, wie sich die Soldaten Jesus nähern. Die finite Form ergibt einen natürlichen deutschen Erzählfluss, ohne die Handlung näher zu deuten.
- source_word: ὄξος
  choice: sauren Wein
  rationale: ὄξος bezeichnet hier sauren, billigen Wein beziehungsweise ein säuerliches Weingetränk. „Saurer Wein“ ist für heutige Leser verständlicher als „Essig“, das leicht nur an ein Würzmittel denken lässt.
- source_word: προσφέροντες
  choice: boten … an
  rationale: Das Partizip bezeichnet das Darreichen oder Anbieten des Getränks. „Anbieten“ gibt die Handlung klar wieder und lässt ihr Motiv offen.
theological_decisions:
- issue: Charakter des Anbietens von ὄξος
  choice: Die Handlung wird innerhalb der Spott-Szene neutral beschrieben, ohne ihr ausdrücklich Mitleid oder zusätzliche Grausamkeit zuzuschreiben.
  alternative: Das Getränk wird entweder als kleine Barmherzigkeit oder ausschließlich als weiterer Hohn gedeutet.
  rationale: Der unmittelbare Zusammenhang ordnet das Verhalten der Soldaten dem Spott zu; der Vers erklärt jedoch ihr besonderes Motiv beim Anbieten des Getränks nicht ausdrücklich. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satz bewahrt den engen Zusammenhang der Handlungen, vermeidet aber die stärkere kausale Festlegung, dass das Anbieten selbst ausdrücklich das Mittel des Spottes gewesen sei. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
