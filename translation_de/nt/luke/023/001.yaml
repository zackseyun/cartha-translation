id: LUK.23.1
reference: Luke 23:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: de
  text: Da erhob sich ihre ganze Versammlung und führte ihn zu Pilatus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre ganze Menschenmenge«.'
    reason: Lexikalische Alternative für πλῆθος, das sowohl eine versammelte Gruppe als auch eine größere Menschenmenge bezeichnen kann.
lexical_decisions:
- source_word: Καὶ
  choice: Da
  rationale: Leitet den nächsten Vorgang in der Erzählfolge natürlich ein, ohne eine stärkere zeitliche Folgerung hinzuzufügen.
- source_word: ἀναστὰν
  choice: erhob sich
  rationale: Gibt das vorzeitige Aufstehen der Gruppe idiomatisch wieder; im Deutschen kann die Partizipialkonstruktion natürlich als koordinierte Verbhandlung erscheinen.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: ihre ganze Versammlung
  rationale: πλῆθος bezeichnet die gesamte versammelte Gruppe; „Versammlung“ passt zum vorausgehenden gerichtlichen Zusammenhang, ohne eine bestimmte Institution zu benennen. αὐτῶν wird durch „ihre“ bewahrt.
- source_word: ἤγαγον
  choice: führte
  rationale: ἄγω bezeichnet hier das Führen beziehungsweise Geleiten Jesu zu einem Ziel. Wegen des kollektiven Singulars „Versammlung“ steht das Verb im Deutschen im Singular.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen verweist unmittelbar auf Jesus als Objekt der Handlung.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: zu Pilatus
  rationale: ἐπί mit Akkusativ nach einem Bewegungsverb bezeichnet die Bewegung zu einer Person hin; „zu Pilatus“ ist direkt und natürlich.
- source_word: Πιλᾶτον
  choice: Pilatus
  rationale: Verwendet die im Deutschen etablierte Namensform.
theological_decisions:
- issue: Wiedergabe des kollektiven Subjekts im gerichtlichen Zusammenhang
  choice: ihre ganze Versammlung
  alternative: ihre ganze Menschenmenge
  rationale: „Versammlung“ macht deutlich, dass es sich um die zusammengetretene Gruppe handelt, ohne πλῆθος als förmliche Amtsbezeichnung zu überdeuten. Die mögliche allgemeinere Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der kollektive Ausdruck wird idiomatisch im Singular konstruiert; die Fußnote bewahrt die breitere lexikalische Möglichkeit.
