  text: Ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: de
  text: Er war aber verpflichtet,[a] ihnen zum Fest einen Gefangenen freizulassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser ganze Satz fehlt in mehreren der ältesten griechischen Handschriften, darunter Papyrus 75 aus dem 3. Jahrhundert und der Codex Vaticanus aus dem 4. Jahrhundert, sowie in einigen frühen koptischen Übersetzungen. Er ist jedoch in Teilen der lateinischen Überlieferung und in der späteren byzantinischen Mehrheit bezeugt. Viele Textkritiker beurteilen ihn als eine spätere Angleichung des Lukasberichts an den in Matthäus 27,15 und Markus 15,6 erwähnten Brauch der Freilassung. Einige Handschriften setzen diesen Satz nach Vers 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: war … verpflichtet
  rationale: Die griechische Wendung bedeutet, unter einer Notwendigkeit oder Verpflichtung zu stehen. Die deutsche Formulierung ist natürlich und lässt offen, ob diese Verpflichtung rechtlich oder durch einen Brauch begründet war.
- source_word: ἀπολύειν
  choice: freizulassen
  rationale: Im Zusammenhang mit Pilatus bezeichnet das Verb die Entlassung aus dem Gewahrsam. Das ergänzte „einen Gefangenen“ macht den im Kontext vorausgesetzten Bezug idiomatisch deutlich.
- source_word: κατὰ ἑορτήν
  choice: zum Fest
  rationale: Die Wendung bezeichnet das wiederkehrende Geschehen anlässlich des Festes; im Kontext ist das Passafest gemeint, ohne dass es in diesem Vers ausdrücklich genannt wird.
- source_word: ἕνα
  choice: einen Gefangenen
  rationale: Wörtlich steht „einen“. Das Bezugswort ist aus dem Zusammenhang zu ergänzen; „Gefangenen“ gibt den strafrechtlichen Kontext verständlich wieder.
- source_word: δέ
  choice: aber
  rationale: Der schwache griechische Übergangsmarker wird mit „aber“ wiedergegeben, ohne ihm einen zeitlichen Sinn wie „nun“ beizulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zum Fest“ ist im Deutschen natürlicher als „bei jedem Fest“ und bewahrt den konkreten Bezug des griechischen Singulars. Die Ergänzung „Gefangenen“ macht das elliptische ἕνα verständlich.
