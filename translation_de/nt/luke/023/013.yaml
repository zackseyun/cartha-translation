source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: de
  text: Pilatus aber rief die obersten Priester, die führenden Männer und das Volk zusammen
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Übergang und zugleich die Rückkehr der Erzählung zu Pilatus; »aber« bewahrt diese verbindende, leicht kontrastierende Funktion.
- source_word: συγκαλεσάμενος
  choice: rief … zusammen
  rationale: Das Aoristpartizip bezeichnet das Zusammenrufen der genannten Gruppen. Im natürlichen Deutschen wird die zeitliche Unterordnung idiomatisch durch ein finites Verb wiedergegeben; die folgende direkte Rede in Vers 14 schließt daran an.
- source_word: ἀρχιερεῖς
  choice: obersten Priester
  rationale: Der Plural bezeichnet die führenden Angehörigen der Priesterschaft und nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: ἄρχοντας
  choice: führenden Männer
  rationale: Bezeichnet die maßgeblichen Männer beziehungsweise Autoritäten des Volkes. Diese Formulierung ist im Kontext natürlicher als »Herrscher«, ohne den offiziellen Führungsrang zu verlieren.
- source_word: λαὸν
  choice: das Volk
  rationale: Gibt den kollektiven Sinn von λαός direkt wieder und verengt den Bezug nicht auf eine bloße Menschenmenge.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt entsprechend dem griechischen Text und der Fortsetzung in Vers 14 syntaktisch offen; auf ein abschließendes Satzzeichen wird daher verzichtet.
