  verdict: approve
  source_fidelity: Der Text gibt Πιλᾶτος, die erzählerische Weiterführung durch δέ, das Zusammenrufen (συγκαλεσάμενος) sowie die drei Gruppen ἀρχιερεῖς, ἄρχοντας und τὸν λαόν vollständig und in derselben Reihenfolge wieder. Die finite deutsche Form „rief … zusammen“ ist eine idiomatische Wiedergabe des griechischen Aoristpartizips im satzübergreifenden Zusammenhang mit V. 14.
  naturalness: „Pilatus aber rief die obersten Priester, die führenden Männer und das Volk zusammen“ ist natürliches, würdiges modernes Standarddeutsch. Das fehlende Schlusssatzzeichen ist sachgerecht, da der griechische Satz erst im folgenden Vers fortgesetzt wird.
  terminology: „Pilatus“ ist die etablierte deutsche Namensform. „Obersten Priester“ gibt die plurale Führungsgruppe der ἀρχιερεῖς treffend wieder, ohne fälschlich mehrere amtierende Hohepriester zu suggerieren. „Führende Männer“ wahrt für ἄρχοντας die soziale beziehungsweise amtliche Leitungsfunktion; „das Volk“ erhält den weiten Kollektivbezug von λαός.
