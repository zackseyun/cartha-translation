  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: de
  text: Und Pilatus entschied, dass ihre Forderung erfüllt werden sollte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder förmlicher: »Pilatus fällte das Urteil, dass geschehen sollte, was sie verlangten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss führt die Erzählung ohne eine zusätzliche zeitliche oder folgernde Nuance fort.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: ἐπέκρινεν
  choice: entschied
  rationale: Das Verb bezeichnet hier eine richterliche Entscheidung. „Entschied“ ist gegenwärtig und verständlich; die förmlichere rechtliche Nuance wird in der Fußnote sichtbar gemacht.
- source_word: γενέσθαι
  choice: erfüllt werden sollte
  rationale: Der ergänzende Infinitiv besagt, dass das verlangte Ergebnis eintreten beziehungsweise ausgeführt werden sollte. Zusammen mit „Forderung“ ist „erfüllt werden“ idiomatisches Deutsch.
- source_word: τὸ αἴτημα αὐτῶν
  choice: ihre Forderung
  rationale: αἴτημα kann Bitte, Antrag oder Forderung bedeuten. Im Kontext des nachdrücklichen Verlangens der Menge gibt „Forderung“ die Kraft des Ausdrucks wieder, ohne über seinen Bedeutungsumfang hinauszugehen.
theological_decisions:
- issue: Rechtliche Nuance von Pilatus’ Handlung
  choice: Pilatus entschied, dass ihre Forderung erfüllt werden sollte
  alternative: Pilatus fällte das Urteil, dass ihr Verlangen ausgeführt werden sollte
  rationale: Die Übersetzung bewahrt Pilatus’ richterliche Entscheidung in gut verständlichem Deutsch, ohne durch „verurteilte“ eine engere strafrechtliche Aussage in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung ist flüssig und klar; die Fußnote erhält die förmlichere juristische Ausdrucksweise des seltenen Verbs ἐπικρίνω.
