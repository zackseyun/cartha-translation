  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: de
  text: Denn wenn sie das schon mit dem grünen Holz tun, was wird dann mit dem trockenen geschehen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild führt offenbar vom geringeren zum größeren Fall: Wenn schon mit grünem, schwer brennbarem Holz so verfahren wird, was wird dann erst mit trockenem Holz geschehen? Wen das grüne und das trockene Holz jeweils genau bezeichnet, lässt der Text offen.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Klage und Warnung und bewahrt ihre kausale Kraft.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: mit dem grünen Holz
  rationale: Die Formulierung hält das sprichwörtliche Bild fest. „Grünes Holz“ bezeichnet natürlich frisches, noch feuchtes und daher schwer brennbares Holz.
- source_word: ταῦτα ποιοῦσιν
  choice: sie das schon ... tun
  rationale: „Sie“ wahrt das im Griechischen nicht näher bestimmte Subjekt. Das idiomatische „das“ fasst die gegenwärtigen Vorgänge zusammen; „schon“ verdeutlicht im Deutschen den im Kontrast angelegten Schluss vom geringeren zum größeren Fall, ohne dessen konkrete Deutung festzulegen.
- source_word: ἐν τῷ ξηρῷ
  choice: mit dem trockenen
  rationale: Die parallele Präpositionalfügung wird ebenso wiedergegeben; das substantivierte Adjektiv verweist eindeutig auf das zuvor genannte Holz.
- source_word: τί γένηται
  choice: was wird dann ... geschehen?
  rationale: Die rhetorische Frage blickt auf eine erwartete Folge. „Geschehen“ entspricht dem offenen Ereignischarakter von γίνομαι; „dann“ macht die Folgerelation natürlich verständlich.
theological_decisions:
- issue: Bild vom grünen und trockenen Holz
  choice: Das Bild bleibt im Haupttext erhalten und seine konkreten Bezugsgrößen werden nicht erklärt.
  alternative: Jesus ausdrücklich mit dem grünen Holz und Jerusalem beziehungsweise dessen Bevölkerung mit dem trockenen Holz gleichsetzen.
  rationale: Der Ausspruch legt einen Schluss vom geringeren zum größeren Fall und eine drohende Zuspitzung nahe; die genauen Referenten nennt der griechische Text jedoch nicht. Eine explizite Identifizierung würde eine Auslegung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache bleibt knapp und sprichwörtlich; die Satzstellung mit „schon“ und „dann“ macht den Kontrast für heutige Leser verständlich, ohne ihn theologisch aufzulösen.
