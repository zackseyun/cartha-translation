  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: de
  text: Dieser ging zu Pilatus und bat um den Leichnam Jesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist auf Josef von Arimathäa im vorherigen Vers. „Dieser“ bewahrt diesen Rückverweis knapp und natürlich.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: ging zu Pilatus
  rationale: Das vorzeitige Aoristpartizip bezeichnet die dem Bitten vorausgehende Handlung. Die finite Wiedergabe „ging zu“ ist im Deutschen idiomatisch und gibt die Annäherung an Pilatus treffend wieder.
- source_word: ᾐτήσατο
  choice: bat um
  rationale: αἰτέω mit dem erbetenen Gegenstand bedeutet hier „um etwas bitten“. Die Formulierung ist natürlich und wahrt den respektvollen narrativen Ton.
- source_word: τὸ σῶμα
  choice: den Leichnam
  rationale: σῶμα bedeutet grundsätzlich „Körper/Leib“; da Jesus gestorben ist und Josef um die Herausgabe zur Bestattung bittet, ist „Leichnam“ im Deutschen die natürliche, sachliche Bezeichnung, ohne die gröbere Wirkung von „Leiche“.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Der Genitiv wird mit dem im gehobenen modernen Deutsch weiterhin gebräuchlichen Namensgenitiv „Jesu“ knapp und eindeutig wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und gut verständliche Erzählsprache. Der knappe Satzbau des Griechischen bleibt erhalten; das Partizip wird idiomatisch als finite Handlung wiedergegeben.
