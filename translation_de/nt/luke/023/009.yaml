  text: ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: de
  text: Da stellte er ihm ausführlich Fragen[a]; doch Jesus antwortete ihm nichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit vielen Worten“; möglich ist auch: „stellte ihm viele Fragen“. Die griechische Wendung betont ein längeres, ausgedehntes Befragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: stellte … Fragen
  rationale: Das Imperfekt bezeichnet ein fortgesetztes oder wiederholtes Fragen. Zusammen mit „ausführlich“ wird der anhaltende Vorgang in natürlichem Deutsch wiedergegeben.
- source_word: δὲ
  choice: Da / doch
  rationale: Das erste δέ führt die Erzählung locker weiter; „Da“ passt zum deutschen Erzählfluss. Das zweite δέ setzt Jesu Schweigen kontrastierend dem ausführlichen Fragen gegenüber und wird daher mit „doch“ wiedergegeben.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: ausführlich Fragen
  rationale: Wörtlich spricht die Wendung von „vielen/zahlreichen Worten“. Im Zusammenhang bezeichnet sie ausgedehntes verbales Befragen; die idiomatische Wiedergabe bewahrt dessen Dauer und Umfang.
- source_word: αὐτὸς
  choice: Jesus
  rationale: Das betonte Pronomen bildet den Gegensatz zum fragenden Herodes. Der Name macht den Bezug im isoliert gelesenen Vers eindeutig, ohne eine zusätzliche theologische Deutung einzuführen.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: antwortete ihm nichts
  rationale: Die Formulierung folgt der griechischen Aussage eng und bewahrt den starken Gedanken, dass Jesus auf nichts eine Antwort gab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausführlich Fragen stellen“ ist natürlich und vermittelt die im Imperfekt und in ἐν λόγοις ἱκανοῖς liegende Dauer, während die Fußnote die wörtlichere und die enger interpretierende Möglichkeit dokumentiert.
