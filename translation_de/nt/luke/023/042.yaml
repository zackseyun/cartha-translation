id: LUK.23.42
reference: Luke 23:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: de
  text: 'Und er sagte: »Jesus, denk an mich, wenn du in deinem Reich kommst.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn du mit deinem Reich kommst«. Einige Handschriften lesen ausdrücklich: »wenn du in dein Reich kommst«; im SBLGNT steht »in deinem Reich«.'
    reason: Die Präpositionalphrase ist deutungsoffen, und es besteht eine bedeutsame handschriftliche Variante zwischen ἐν („in“) und εἰς („in … hinein“).
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Folgerung einzutragen.
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das Imperfekt kann wörtlich fortlaufend verstanden werden; im deutschen Erzählstil gibt das Präteritum die Redeeinleitung natürlich wieder.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Vokativ des Eigennamens wird in der üblichen deutschen Namensform wiedergegeben.
- source_word: μνήσθητί μου
  choice: denk an mich
  rationale: Dies ist eine natürliche deutsche Bitte. Der mögliche Beiklang eines wohlwollenden, handelnden Erinnerns bleibt erhalten, ohne im Haupttext ausdrücklich ergänzt zu werden.
- source_word: ὅταν ἔλθῃς
  choice: wenn du … kommst
  rationale: ὅταν mit Konjunktiv bezeichnet hier ein zukünftiges Eintreten; „wenn“ ist im Deutschen idiomatisch und legt keinen genaueren Zeitpunkt fest.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: in deinem Reich
  rationale: Gibt die Präposition ἐν formal als „in“ wieder und bewahrt die Mehrdeutigkeit, ob Jesu Kommen innerhalb beziehungsweise in königlicher Macht oder als Kommen in sein Reich gemeint ist.
- source_word: βασιλείᾳ
  choice: Reich
  rationale: „Reich“ ist die geläufige, würdige deutsche Wiedergabe und lässt sowohl den Herrschaftsbereich als auch die Königsherrschaft anklingen.
theological_decisions:
- issue: Eschatologische Bedeutung der Bitte an Jesus
  choice: Die Bitte bezieht sich auf Jesu zukünftiges Kommen in seinem Reich, ohne dessen Zeitpunkt oder Ablauf näher zu bestimmen.
  alternative: Die Bitte kann als Bezug auf Jesu Kommen in königlicher Macht oder auf sein Eingehen in das vollendete Reich verstanden werden.
  rationale: Der Vers verbindet Jesus mit einem zukünftigen Reich, entfaltet aber kein umfassendes eschatologisches Schema. Die Formulierung lässt diese Spannung bestehen.
- issue: Richtung oder Sphäre bei ἐν τῇ βασιλείᾳ σου
  choice: „in deinem Reich“
  alternative: „in dein Reich“ beziehungsweise „mit deinem Reich“
  rationale: Der SBLGNT-Text hat ἐν, nicht das ausdrücklich richtungsanzeigende εἰς. Daher steht die formnähere Wiedergabe im Haupttext; mögliche andere Deutungen und die abweichende Lesart werden in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Denk an mich“ ist natürlicher als „erinnere dich an mich“, während „Reich“ die vertraute biblische Ausdrucksweise ohne konfessionelle Zusatzdeutung wahrt.
