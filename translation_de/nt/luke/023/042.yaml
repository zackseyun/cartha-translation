  source_fidelity: Der Haupttext gibt καὶ ἔλεγεν idiomatisch als „Und er sagte“ wieder und bewahrt die direkte Anrede sowie den Imperativ μνήσθητί μου treffend mit „denk an mich“. „Wenn du in deinem Reich kommst“ entspricht der SBLGNT-Lesart ἐν τῇ βασιλείᾳ σου, ohne die abweichende Richtungslesart εἰς in den Haupttext zu übernehmen.
  naturalness: Modernes, verständliches Standarddeutsch mit einem dem Kontext angemessenen würdigen Ton. „Denk an mich“ ist eine natürliche deutsche Bitte; die Stellung von „in deinem Reich“ bewahrt zwar die griechische Offenheit, bleibt aber verständlich.
  terminology: „Jesus“ und „Reich“ sind etablierte und sachgerechte Wiedergaben. „Reich“ lässt sowohl den Bereich als auch die königliche Herrschaft anklingen, ohne eine weitergehende eschatologische Deutung festzulegen.
