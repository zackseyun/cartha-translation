  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: de
  text: Doch sie drängten mit lauten Stimmen darauf, dass er gekreuzigt werde, und ihre Stimmen setzten sich durch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέκειντο
  choice: sie setzten ihm … zu
  rationale: Das Imperfekt bezeichnet anhaltenden, nachdrücklichen Druck. Die deutsche Wendung gibt sowohl die Dauer als auch die aggressive Beharrlichkeit im Zusammenhang wieder.
- source_word: φωναῖς μεγάλαις
  choice: mit lautem Geschrei
  rationale: φωνή kann Stimme, Ruf oder Geschrei bezeichnen. Im Kontext einer lautstark drängenden Menge ist „lautes Geschrei“ natürlich und bewahrt den akustischen Nachdruck.
- source_word: αἰτούμενοι
  choice: und verlangten
  rationale: αἰτέω bedeutet grundsätzlich bitten oder fordern. Wegen des nachdrücklichen Auftretens und des Inhalts der Forderung trifft „verlangten“ hier den Zusammenhang, ohne dem Verb allein die ganze Gewalt der Szene aufzubürden.
- source_word: αὐτὸν σταυρωθῆναι
  choice: dass er gekreuzigt werde
  rationale: Der Akkusativ mit passivem Infinitiv wird idiomatisch als Inhaltssatz wiedergegeben; das Passiv bleibt erhalten.
- source_word: κατίσχυον
  choice: setzte sich durch
  rationale: Das Imperfekt beschreibt, wie ihr Geschrei die Oberhand gewann. „Setzte sich durch“ ist im Deutschen natürlich und gibt das tatsächliche Überwiegen im Verfahren wieder.
- source_word: αἱ φωναὶ αὐτῶν
  choice: ihr Geschrei
  rationale: Die Wiederholung von φωνή wird durch die Wiederholung von „Geschrei“ sichtbar gehalten und verbindet ihr lautstarkes Drängen mit dessen Erfolg.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von φωνή wurde bewusst als „Geschrei“ beibehalten; der griechische Satzfluss wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
