revisions:
- from: Doch sie setzten ihm mit lautem Geschrei zu und verlangten, dass er gekreuzigt werde. Und ihr Geschrei setzte sich durch.
  to: Doch sie drängten mit lauten Stimmen darauf, dass er gekreuzigt werde, und ihre Stimmen setzten sich durch.
  rationale: Die Revision wahrt die fortgesetzte, laut vorgetragene Forderung und das Passiv der Kreuzigung. Sie entfernt ein nicht explizites und potenziell missverständliches Objekt und bewahrt durch die Wiederholung von „Stimmen“ die stilistische Wiederholung des griechischen φωνή.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:53Z'
review_pass:
  verdict: revise
  source_fidelity: Die Aussage wird im Wesentlichen getroffen, doch „sie setzten ihm … zu“ fügt ein im Griechischen nicht ausdrücklich genanntes persönliches Objekt ein und kann im Deutschen zudem missverständlich auf Jesus bezogen werden. „Darauf drängten“ gibt die anhaltende, nachdrückliche Forderung von ἐπέκειντο mit αἰτούμενοι ohne diese Einengung wieder. Die Wiederaufnahme von φωναί durch „Stimmen“ sollte sichtbar bleiben.
  naturalness: Der Entwurf ist gut verständlich und würdevoll. Die revidierte Fassung ist noch unmittelbarer und vermeidet die potenziell unklare Pronominalreferenz von „ihm“.
  terminology: „Gekreuzigt werde“ bewahrt das Passiv von σταυρωθῆναι. „Laute Stimmen“ und „ihre Stimmen“ erhalten die bewusste Wiederholung von φωνή; „setzten sich durch“ ist eine natürliche Wiedergabe von κατίσχυον. „Darauf drängten“ gibt den fordernden Kontext wieder, ohne αἰτέω unnötig als bloßes „Bitten“ abzuschwächen oder als isoliertes „Verlangen“ zu übersteuern.
  issues:
  - severity: medium
    issue: Das hinzugefügte „ihm“ in „sie setzten ihm … zu“ ist referenziell missverständlich.
    rationale: Das griechische ἐπέκειντο steht hier mit φωναῖς μεγάλαις und nennt kein persönliches Objekt. Im Deutschen kann „ihm“ ohne den vorangehenden Kontext leicht Jesus statt Pilatus zugeordnet werden.
  - severity: low
    issue: „Geschrei“ ist als Kontextbedeutung möglich, verdeckt aber die lexikalische Wiederholung von φωνή stärker als nötig.
    rationale: Da φωναί in beiden Teilsätzen wiederholt wird, erhält „Stimmen“ diese Verbindung formnäher und bleibt im Deutschen idiomatisch.
  revised_text: Doch sie drängten mit lauten Stimmen darauf, dass er gekreuzigt werde, und ihre Stimmen setzten sich durch.
  revised_footnotes: []
  revision_rationale: Die Revision wahrt die fortgesetzte, laut vorgetragene Forderung und das Passiv der Kreuzigung. Sie entfernt ein nicht explizites und potenziell missverständliches Objekt und bewahrt durch die Wiederholung von „Stimmen“ die stilistische Wiederholung des griechischen φωνή.
