  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: de
  text: 'Denn seht, es kommen Tage, an denen man sagen wird: »Glücklich sind die unfruchtbaren Frauen, die Mutterleiber, die nie ein Kind geboren haben, und die Brüste, die nie gestillt haben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: seht
  rationale: Der Aufmerksamkeit weckende Imperativ wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: μακάριαι
  choice: glücklich
  rationale: Bezeichnet hier den als beneidenswert beziehungsweise gut gestellten Zustand angesichts des kommenden Leids; »glücklich« wahrt den schockierenden Gegensatz, ohne eine besondere Segensformel einzutragen.
- source_word: αἱ στεῖραι
  choice: die unfruchtbaren Frauen
  rationale: Das substantivierte feminine Adjektiv bezeichnet Frauen, die keine Kinder bekommen können; die Ergänzung »Frauen« macht dies im Deutschen eindeutig.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: die Leiber, die nie geboren haben
  rationale: κοιλία bezeichnet hier den gebärenden Unterleib beziehungsweise Leib. »Leiber« bewahrt die körperliche Bildsprache und den Parallelismus; »nie« gibt die zusammenfassende Negation idiomatisch wieder.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: die Brüste, die nie gestillt haben
  rationale: τρέφω bedeutet grundsätzlich nähren; im Zusammenhang mit Brüsten ist »stillen« die natürliche und sachlich genaue deutsche Wiedergabe.
theological_decisions:
- issue: Aussage »Glücklich sind die Unfruchtbaren«
  choice: Als wörtliche zukünftige Aussage in der kommenden Not stehen lassen
  alternative: Als allgemeine Seligpreisung der Kinderlosigkeit formulieren
  rationale: Der Vers beschreibt eine durch kommendes Leid hervorgerufene Umkehr gewöhnlicher Wertungen. Der Text begründet keine allgemeine Lehre über Kinderlosigkeit.
- issue: Zeitbezug von ἔρχονται ἡμέραι
  choice: »es kommen Tage«
  alternative: »die Zeit wird kommen«
  rationale: Die konkrete semitisch geprägte Wendung des griechischen Textes bleibt erhalten, ohne den genauen historischen oder endzeitlichen Bezug über den Vers hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige körperliche Bildfolge und ihr erschütternder Kontrast werden bewahrt; keine Fußnote ist erforderlich.
