  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: de
  text: 'Und das Volk stand da und sah zu. Aber auch die führenden Männer verhöhnten ihn und sagten: »Andere hat er gerettet; er soll sich selbst retten, wenn dieser der Messias Gottes ist, der Auserwählte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: stand da
  rationale: Die Form bezeichnet hier einen andauernden Zustand und eröffnet die Szene. »Stand da« gibt Haltung und situative Präsenz in natürlichem Deutsch wieder.
- source_word: θεωρῶν
  choice: sah zu
  rationale: Das Partizip beschreibt das fortdauernde Zuschauen des Volkes. »Sah zu« ist idiomatisch und lässt offen, mit welcher inneren Haltung es zusieht.
- source_word: ἐξεμυκτήριζον
  choice: verhöhnten ihn
  rationale: Das Verb bezeichnet spöttische, verächtliche Verspottung. »Verhöhnten« passt zum würdigen Erzählregister; das Objekt »ihn« wird aus dem Zusammenhang ergänzt.
- source_word: ἄρχοντες
  choice: die führenden Männer
  rationale: Gemeint sind in diesem Kontext die führenden Autoritäten. Die Wiedergabe ist verständlicher als das im heutigen Deutsch leicht missverständliche »Herrscher« und legt die genaue institutionelle Funktion nicht unnötig fest.
- source_word: Ἄλλους ἔσωσεν
  choice: Andere hat er gerettet
  rationale: »Gerettet« bewahrt die Wiederholung von σῴζω und damit die Ironie des Spotts.
- source_word: σωσάτω ἑαυτόν
  choice: nun soll er sich selbst retten
  rationale: Die Aufforderung wird im Deutschen natürlich mit »soll« wiedergegeben. »Nun« verdeutlicht die im Spott liegende Herausforderung, ohne eine zusätzliche sachliche Aussage einzuführen.
- source_word: εἰ οὗτός ἐστιν
  choice: wenn er … ist
  rationale: Im Deutschen ist »wenn er … ist« in dieser direkten Rede natürlicher; der verächtliche Ton wird bereits durch den gesamten Spottzusammenhang getragen.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: der Messias Gottes
  rationale: Χριστός ist hier ein Titel und wird daher als »Messias« wiedergegeben. Der Genitiv »Gottes« bewahrt die kompakte und feierliche Form des Ausgangstextes.
- source_word: ὁ ἐκλεκτός
  choice: der Auserwählte
  rationale: Der substantivierte Ausdruck hat hier Titelcharakter. »Der Auserwählte« ist im Deutschen geläufig, würdig und theologisch offen.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck steht eindeutig als messianischer Titel. »Messias« macht diese Funktion unmittelbar erkennbar, ohne ihn wie einen Eigennamen zu behandeln.
- issue: Titelcharakter von ὁ ἐκλεκτός
  choice: der Auserwählte
  alternative: der Erwählte
  rationale: Beide sind möglich; »der Auserwählte« gibt den Titel verständlich und gewichtig wieder, ohne seine christologische Bedeutung weiter auszudeuten.
- issue: Beziehung der beiden Titel
  choice: der Messias Gottes, der Auserwählte
  alternative: der Messias, der Auserwählte Gottes
  rationale: Die gewählte Zeichensetzung folgt der SBLGNT-Lesart τοῦ θεοῦ, ὁ ἐκλεκτός und bezieht »Gottes« auf »Messias«. Die alternative Textstellung würde den Genitiv eher mit »der Auserwählte« verbinden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Die Wiederholung von »retten« und die Spannung zwischen den spöttisch ausgesprochenen Titeln und der Passionserzählung bleiben erhalten. Für die zugrunde gelegte SBLGNT-Lesart ist keine Fußnote erforderlich.
