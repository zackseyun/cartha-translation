  variant: modern standard German
source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: de
  text: Als Pilatus das hörte, fragte er, ob der Mann ein Galiläer sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Die im Deutschen eingebürgerte Form des Namens.
- source_word: δὲ
  choice: Als
  rationale: Die leichte narrative Weiterführung wird zusammen mit dem temporalen Sinn des Partizips in einem natürlichen deutschen Satz wiedergegeben; ein ausdrückliches „aber“ ist hier nicht erforderlich.
- source_word: ἀκούσας
  choice: das hörte
  rationale: Das Aoristpartizip bezeichnet die der Frage vorausgehende Wahrnehmung. „Das“ nimmt idiomatisch den Inhalt des unmittelbar zuvor Gesagten auf.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Eine direkte und im modernen Deutschen natürliche Entsprechung für das Fragen beziehungsweise Nachfragen.
- source_word: εἰ
  choice: ob
  rationale: Leitet nach „fragte“ idiomatisch eine indirekte Entscheidungsfrage ein.
- source_word: ὁ ἄνθρωπος
  choice: der Mann
  rationale: Bewahrt die konkrete griechische Bezeichnung, ohne den Namen Jesus oder ein Demonstrativ hinzuzufügen.
- source_word: Γαλιλαῖός
  choice: ein Galiläer
  rationale: Gibt die prädikative Bezeichnung der regionalen Herkunft beziehungsweise Zugehörigkeit knapp und genau wieder.
- source_word: ἐστιν
  choice: sei
  rationale: Der Konjunktiv I kennzeichnet im Deutschen die indirekte Frage und bewahrt zugleich den präsentischen Gehalt des griechischen ἐστιν besser als ein rückverschobenes „gewesen sei“.
theological_decisions: []
