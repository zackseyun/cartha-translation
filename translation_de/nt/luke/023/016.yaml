  source_fidelity: Das Aoristpartizip παιδεύσας bezeichnet eine der Freilassung vorausgehende Strafmaßnahme. „Bestrafen“ trifft im gerichtlichen Kontext den breiten strafenden Sinn, ohne die Maßnahme unzulässig auf Auspeitschung einzuengen. Die kausative Fassung „bestrafen lassen“ ist zwar kontextuell denkbar, wird vom griechischen Aktiv aber nicht ausdrücklich verlangt.
  naturalness: „Darum werde ich ihn bestrafen lassen und freilassen“ ist verständlich, lässt die im Partizip ausgedrückte zeitliche Vorordnung jedoch weniger klar erkennen. „Nachdem ich ihn bestraft habe, werde ich ihn freilassen“ ist modernes, natürliches Standarddeutsch und bildet die Abfolge deutlich ab.
  terminology: „Bestrafen“ ist hier ein angemessener gerichtlicher Ausdruck. Die Fußnote bewahrt die mögliche Nuance von „züchtigen“ beziehungsweise einer korrigierenden Bestrafung und stellt klar, dass „auspeitschen“ eine mögliche, aber nicht lexikalisch erforderliche Präzisierung wäre.
