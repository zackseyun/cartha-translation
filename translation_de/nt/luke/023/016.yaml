  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: de
  text: Darum werde ich ihn, nachdem ich ihn bestraft habe[a], freilassen.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gezüchtigt habe«. Das griechische Verb kann eine erzieherische oder korrigierende Bestrafung bezeichnen. Manche verstehen es hier genauer als »auspeitschen«; das Verb selbst ist jedoch weiter gefasst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: bestrafen lassen
  rationale: Das Aoristpartizip bezeichnet hier eine der Freilassung vorausgehende Maßnahme. Im gerichtlichen Zusammenhang ist παιδεύω strafend zu verstehen; die kausative Formulierung passt dazu, dass Pilatus die Strafe nicht selbst vollstreckt, ohne die Art der Strafe enger als der griechische Ausdruck festzulegen.
- source_word: οὖν
  choice: darum
  rationale: οὖν kennzeichnet die Folgerung in Pilatus’ Rede. „Darum“ gibt diese logische Verbindung natürlich und klar wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus.
- source_word: ἀπολύσω
  choice: werde ich … freilassen
  rationale: ἀπολύω bedeutet im rechtlich-amtlichen Zusammenhang, einen Gefangenen freizulassen. Das Futur gibt Pilatus’ angekündigte Absicht wieder.
theological_decisions:
- issue: Bedeutungsumfang von παιδεύω in Pilatus’ Vorschlag
  choice: Im gerichtlichen Sinn als „bestrafen lassen“ wiedergegeben.
  alternative: „züchtigen lassen“, „disziplinieren“, spezifischer „auspeitschen lassen“
  rationale: Der Prozesskontext verlangt eine Strafmaßnahme, doch das Verb selbst benennt deren genaue Form nicht. Die Übersetzung wahrt diese Unbestimmtheit und vermeidet, eine Auspeitschung ausdrücklich in den Wortlaut hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bestrafen lassen“ ist im Kontext natürlicher als „disziplinieren“ und lässt die konkrete Strafart offen. Das Schlusszeichen setzt die im Zusammenhang fortlaufende direkte Rede voraus.
