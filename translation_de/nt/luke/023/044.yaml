  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: de
  text: Es war schon etwa die sechste Stunde[a], und über das ganze Land[b] kam Finsternis bis zur neunten Stunde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: etwa um zwölf Uhr mittags.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »über die ganze Erde«. Das griechische Wort γῆ kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: alternative_reading
  - marker: c
    text: 'Das heißt: etwa bis drei Uhr nachmittags.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: schon
  rationale: Gibt natürlich wieder, dass dieser Zeitpunkt in der Erzählung bereits erreicht war.
- source_word: ὡσεὶ
  choice: etwa
  rationale: Bewahrt die ungefähre, nicht minutengenaue Zeitangabe.
- source_word: ὥρα ἕκτη
  choice: die sechste Stunde
  rationale: Erhält die antike Zählweise und die Ausdrucksform des griechischen Textes; die moderne Entsprechung wird in der Fußnote erklärt.
- source_word: σκότος
  choice: Finsternis
  rationale: Eine würdevolle und im biblischen Erzählstil natürliche Wiedergabe von σκότος, ohne über die bloße Dunkelheit hinaus eine bestimmte Deutung festzulegen.
- source_word: ἐγένετο
  choice: kam
  rationale: Gibt den ereignishaften Charakter von γίνομαι idiomatisch wieder.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: über das ganze Land
  rationale: γῆ kann Land oder Erde bedeuten. »Land« lässt den räumlichen Umfang offen, ohne ihn zwingend global zu verstehen; die weitere Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἕως ὥρας ἐνάτης
  choice: bis zur neunten Stunde
  rationale: Bewahrt parallel zur sechsten Stunde die Zeitangabe des Ausgangstextes; die heutige Uhrzeit steht in der Fußnote.
theological_decisions:
- issue: Räumlicher Umfang von γῆ bei der Finsternis
  choice: Land
  alternative: Erde
  rationale: Das griechische Wort lässt sowohl eine regionale als auch eine weltweite Lesart zu. Der Haupttext wählt die zurückhaltendere Wiedergabe, während die mögliche kosmische Reichweite durch die Fußnote ausdrücklich offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antiken Stundenangaben bleiben im Haupttext erhalten und werden für heutige Leser in den Fußnoten erläutert. »Finsternis« trägt dem ernsten Erzählton Rechnung; »das ganze Land« bewahrt die echte Bedeutungsbreite von γῆ.
