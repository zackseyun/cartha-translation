source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: de
  text: 'Einer der Verbrecher, die dort hingen, beschimpfte ihn und sagte: „Bist du nicht der Messias?[a] Rette dich selbst und uns!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Griechisch: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Einer
  rationale: δέ kennzeichnet hier nur eine leichte Weiterführung beziehungsweise einen Kontrast. Im natürlichen deutschen Erzählfluss muss dies nicht eigens mit „aber“ oder „nun“ wiedergegeben werden.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: der Verbrecher, die dort hingen
  rationale: κακοῦργοι bezeichnet Verbrecher oder Übeltäter; „Verbrecher“ ist gegenwärtig und verständlich. „die dort hingen“ gibt κρεμασθέντων im Kreuzigungskontext wieder, ohne einen spezifischeren Vollzugsbegriff in den Text einzutragen.
- source_word: ἐβλασφήμει αὐτόν
  choice: verhöhnte ihn
  rationale: Das Verb bezeichnet hier fortgesetzte beleidigende beziehungsweise lästernde Rede gegen Jesus. „verhöhnte“ passt zum spöttischen Wortlaut und vermeidet die im Deutschen oft enger religiöse Bedeutung von „lästern“.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Partizip wird im Deutschen natürlich als koordinierte Redeeinleitung wiedergegeben.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: Bist du nicht der Messias?
  rationale: οὐχί lässt eine bejahende Antwort erwarten und trägt hier zugleich spöttische Schärfe. „Messias“ bewahrt den Titelcharakter von ὁ χριστός und seinen jüdischen Kontext.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Rette dich selbst und uns!
  rationale: „Rette“ bezeichnet die verlangte Befreiung vom unmittelbar drohenden Tod und bewahrt zugleich die weitere heilsgeschichtliche Bedeutungsbreite des Verbs.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: Messias
  alternative: Christus
  rationale: Mit Artikel und Prädikatsfunktion ist ὁ χριστός hier eindeutig ein Titel. „Messias“ macht dessen Bedeutung und jüdischen Erwartungshorizont sichtbar; die geläufige kirchliche Form „Christus“ wird als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortdauernde Handlung des griechischen Imperfekts ergibt sich im Deutschen aus der narrativen Verbform und dem Kontext; eine schwerfällige Umschreibung wie „fuhr fort, ihn zu verhöhnen“ wurde vermieden. Der Fußnotenmarker steht unmittelbar beim strittigen Titel.
