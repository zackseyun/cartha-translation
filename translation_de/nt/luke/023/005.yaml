id: LUK.23.5
reference: Luke 23:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: de
  text: 'Doch sie beharrten darauf und sagten: »Er wiegelt das Volk auf[a], indem er in ganz Judäa[b] lehrt – von Galiläa angefangen bis hierher[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er bringt das Volk in Unruhe« beziehungsweise »Er hetzt das Volk auf«. Das griechische Verb bezeichnet hier ein aufstachelndes oder Unruhe stiftendes Handeln.'
    reason: lexical_alternative
  - marker: b
    text: »Judäa« kann den Landesteil Judäa im engeren Sinn oder, je nach Zusammenhang, das jüdische Gebiet in einem weiteren Sinn bezeichnen. Hier betont die Formulierung vor allem die große Ausdehnung seines Wirkens.
    reason: cultural_note
  - marker: c
    text: 'Oder: »bis an diesen Ort«. Gemeint ist die Strecke vom Ausgangspunkt Galiläa bis zum gegenwärtigen Ort vor Pilatus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: beharrten darauf
  rationale: Das Imperfekt bezeichnet anhaltendes, nachdrückliches Bestehen auf der Anklage. »Beharrten darauf« gibt diesen fortdauernden Druck in natürlichem Deutsch wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt den Inhalt ihres nachdrücklichen Beharrens ein; die finite Formulierung ist im Deutschen klar und idiomatisch.
- source_word: Ἀνασείει
  choice: wiegelt ... auf
  rationale: Das Verb bezeichnet ein aufrührerisches Aufstacheln oder In-Unruhe-Versetzen. »Aufwiegeln« bewahrt den belastenden Charakter der Anklage, ohne bereits einen technisch bestimmten Straftatbestand zu benennen.
- source_word: τὸν λαὸν
  choice: das Volk
  rationale: λαός meint hier die Bevölkerung insgesamt, nicht nur eine gerade versammelte Menschenmenge.
- source_word: διδάσκων
  choice: indem er ... lehrt
  rationale: Die Konstruktion gibt das gleichzeitige Lehren als Umstand beziehungsweise behauptetes Mittel des Aufwiegelns wieder, ohne zusätzlichen Inhalt in Jesu Lehre einzutragen.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: in ganz Judäa
  rationale: κατά mit dem Genitiv beschreibt hier die räumliche Ausdehnung über das gesamte genannte Gebiet.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: von Galiläa angefangen
  rationale: Die Formulierung bewahrt Galiläa ausdrücklich als Ausgangspunkt der behaupteten Tätigkeit.
- source_word: ἕως ὧδε
  choice: bis hierher
  rationale: Die Wendung bezeichnet die Ausdehnung bis zum gegenwärtigen Ort vor Pilatus und erhält den deiktischen Bezug von ὧδε.
theological_decisions:
- issue: Art der gegen Jesus erhobenen Anklage
  choice: »Er wiegelt das Volk auf«
  alternative: »Er bringt das Volk in Unruhe« / »Er hetzt das Volk auf«
  rationale: Die Ankläger stellen Jesu Wirken als gesellschaftlich gefährliche Agitation dar. »Aufwiegeln« bildet diese feindselige Zuspitzung ab, legt aber nicht eigenmächtig einen technisch definierten Aufstands- oder Hochverratstatbestand fest.
- issue: Geografischer Umfang von Ἰουδαία
  choice: »ganz Judäa« mit erklärender Fußnote
  alternative: »im ganzen jüdischen Land«
  rationale: Der überlieferte Gebietsname bleibt erhalten. Zugleich wird die mögliche weitere Verwendung für das jüdische Gebiet nicht stillschweigend auf den engeren Landesteil verengt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt anklagend und nachdrücklich; geografische und lexikalische Mehrdeutigkeiten werden nicht im Haupttext übererklärt, sondern knapp in den Fußnoten offengehalten.
