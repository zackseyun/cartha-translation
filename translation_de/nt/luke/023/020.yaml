  edition: SBLGNT
  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: de
  text: Doch Pilatus wandte sich noch einmal an sie[a], weil er Jesus freilassen wollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rief ihnen noch einmal zu“.'
    reason: 'Lexikalische Alternative: προσφωνέω kann sowohl das Anreden als auch ein hörbares Zurufen bezeichnen.'
lexical_decisions:
- source_word: πάλιν
  choice: noch einmal
  rationale: Gibt die Wiederholung idiomatisch und präzise wieder.
- source_word: δὲ
  choice: Doch
  rationale: Markiert den milden Gegensatz zwischen der Forderung der Menge und Pilatus’ erneutem Eingreifen.
- source_word: ὁ Πιλᾶτος
  choice: Pilatus
  rationale: Im Deutschen gebräuchliche Namensform; der griechische Artikel wird nicht wiedergegeben.
- source_word: προσεφώνησεν
  choice: wandte sich … an sie
  rationale: προσφωνέω bezeichnet hier das direkte Anreden der Menge; die Ergänzung „sie“ ergibt sich aus dem Kontext und macht den deutschen Satz natürlich.
- source_word: θέλων
  choice: weil er … wollte
  rationale: Gibt das begleitende Motiv des Partizips in klarem modernem Deutsch wieder, ohne Pilatus’ Absicht stärker als im Griechischen zu bewerten.
- source_word: ἀπολῦσαι
  choice: freilassen
  rationale: Passt zum rechtlich-gewahrsamsbezogenen Kontext und klingt im Deutschen natürlicher als „entlassen“.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Gebräuchliche deutsche Namensform; der Artikel wird entsprechend deutscher Namenssyntax ausgelassen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung vermeidet das möglicherweise zu dramatische „rief … zu“, bewahrt diese öffentliche, lautere Nuance aber in der Fußnote.
