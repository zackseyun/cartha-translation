source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: de
  text: 'Und Jesus rief mit lauter Stimme: „Vater, in deine Hände übergebe ich meinen Geist[a].“[b] Nachdem er das gesagt hatte, atmete er zum letzten Mal aus.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vertraue ich meinen Geist an“. Das Verb bezeichnet, dass man etwas der Obhut eines anderen anvertraut.'
    reason: lexical_alternative
  - marker: b
    text: 'Dieser Ausspruch greift Psalm 31,6 auf (nach der griechischen Zählung Psalm 30,6): „In deine Hände vertraue ich meinen Geist.“'
    reason: cross_reference
  - marker: c
    text: 'Oder: „starb er“. Das griechische Verb bedeutet wörtlich „ausatmen“ und bezeichnet hier den Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: rief mit lauter Stimme
  rationale: Die Verbindung bezeichnet ein vernehmbares, kraftvolles Rufen. Die deutsche Formulierung ist natürlich und bewahrt den feierlichen Nachdruck.
- source_word: Πάτερ
  choice: Vater
  rationale: Der Vokativ ist eine direkte Anrede; ein im Griechischen nicht vorhandenes „mein“ wird nicht ergänzt.
- source_word: εἰς χεῖράς σου
  choice: in deine Hände
  rationale: Die Mehrzahl „Hände“ entspricht dem griechischen Text und bewahrt den Anklang an Psalm 31,6 nach der griechischen Zählung Psalm 30,6.
- source_word: παρατίθεμαι
  choice: vertraue ich … an
  rationale: Das Präsens Medium bezeichnet hier die bewusste Übergabe in die Obhut eines anderen. „Anvertrauen“ gibt diesen Sinn im heutigen Deutsch klar und würdig wieder.
- source_word: τὸ πνεῦμά μου
  choice: meinen Geist
  rationale: πνεῦμα kann Geist, Atem oder Lebenskraft bezeichnen. In der an den Vater gerichteten vertrauensvollen Aussage wahrt „Geist“ die Bedeutungsweite und das theologische Gewicht am besten.
- source_word: τοῦτο δὲ εἰπών
  choice: Nachdem er das gesagt hatte
  rationale: Die Partizipialkonstruktion stellt das Sprechen als der Haupthandlung vorausgehend dar; der Nebensatz ist im modernen Deutsch flüssig und eindeutig.
- source_word: ἐξέπνευσεν
  choice: atmete er zum letzten Mal aus
  rationale: Die Wiedergabe macht sowohl das Bild des Aushauchens als auch die idiomatische Bedeutung des Sterbens verständlich, ohne auf das bloße „starb“ zu verkürzen.
theological_decisions:
- issue: Bedeutung von τὸ πνεῦμά μου im letzten Ausspruch Jesu
  choice: meinen Geist
  alternative: meinen Atem
  rationale: Der Gebetscharakter und das bewusste Anvertrauen an den Vater sprechen für „Geist“, während die Fußnote die grundsätzliche Bedeutungsnähe zu Atem und Lebenskraft nicht unnötig dogmatisch festlegt.
- issue: Zeitform und Handlungscharakter von παρατίθεμαι
  choice: vertraue ich … an
  alternative: werde ich … anvertrauen / übergebe ich
  rationale: Das griechische Präsens lässt sich hier als vollziehende Erklärung verstehen. Das deutsche Präsens bewahrt diesen unmittelbaren Akt des Vertrauens.
- issue: Darstellung des Todes durch ἐξέπνευσεν
  choice: atmete er zum letzten Mal aus
  alternative: starb er
  rationale: Die gewählte Formulierung wahrt das Atembild des Verbs und benennt dennoch unmissverständlich den Tod, ohne daraus eine zusätzliche Aussage über die Trennung von Geist und Körper abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, feierlichem Ton. Die Satzstellung ist natürlich; traditionelle biblische Schlüsselbegriffe wie „Vater“, „Hände“ und „Geist“ bleiben erhalten, ohne altertümliche Wendungen zu verwenden.
