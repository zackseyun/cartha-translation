review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur und die wesentlichen Bezüge entsprechen dem griechischen Text. Allerdings ergänzt „hineingelegt“ einen Richtungsbezug („in das Grab“), den der griechische Wortlaut in diesem Vers nicht ausdrücklich wiederholt; ἐτέθη bedeutet hier schlicht „wurde hingelegt/gelegt“.
  naturalness: „Gingen hinterher“ ist verständlich, klingt im modernen Standarddeutsch jedoch eher umgangssprachlich und weniger würdevoll als die knappe erzählerische Form „folgten“. Ein absolut gebrauchtes „folgten“ lässt das im griechischen Text nicht ausgedrückte Bezugsobjekt offen.
  terminology: „Grab“ gibt μνημεῖον im Kontext angemessen wieder; „Leichnam“ ist für σῶμα im Bestattungszusammenhang würdig und präzise. Die Fußnote bietet eine sachgerechte lexikalische Alternative für συνεληλυθυῖαι … αὐτῷ.
  issues:
  - severity: medium
    issue: „hineingelegt“ ergänzt einen nicht expliziten Zielbezug.
    rationale: Das Objekt von ἐτέθη ist „sein Leichnam“; der Vers sagt nicht nochmals ausdrücklich „in das Grab“. Zwar legt der Kontext dies nahe, doch die Übersetzung sollte diese Ergänzung nicht als Wortlaut ausgeben.
  - severity: low
    issue: „gingen hinterher“ ist stilistisch schwächer als „folgten“.
    rationale: Die Formulierung wirkt umgangssprachlicher und kann eine bloße räumliche Nachfolge betonen. „Folgten“ ist im erzählerisch-würdigen Register natürlicher und wahrt bei absolutem Gebrauch die syntaktische Offenheit des Griechischen.
  revised_text: Die Frauen aber, die mit ihm aus Galiläa gekommen waren[a], folgten und sahen das Grab und wie sein Leichnam hingelegt wurde.
