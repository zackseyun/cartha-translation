id: LUK.23.55
reference: Luke 23:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: de
  text: Die Frauen aber, die mit ihm aus Galiläa gekommen waren[a], folgten und sahen das Grab und wie sein Leichnam hingelegt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihn von Galiläa an begleitet hatten“.'
    reason: Lexikalische Alternative für die Konstruktion συνεληλυθυῖαι … αὐτῷ, die sowohl gemeinsames Kommen als auch Begleitung ausdrücken kann.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: gingen hinterher
  rationale: Das Aoristpartizip bezeichnet, dass die Frauen dem Geschehen beziehungsweise dem Leichenzug folgten. „Gingen hinterher“ ist im Deutschen natürlich und lässt wie der griechische Text unausgesprochen, wem genau sie folgten.
- source_word: δέ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten erzählerischen Übergang. „Aber“ gibt den Anschluss knapp wieder, ohne einen ausdrücklich zeitlichen Sinn einzutragen.
- source_word: αἱ γυναῖκες, αἵτινες
  choice: die Frauen, die
  rationale: Der Artikel verweist auf die aus dem Zusammenhang bekannte Frauengruppe; der Relativsatz bestimmt sie näher.
- source_word: ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: die mit ihm aus Galiläa gekommen waren
  rationale: Die periphrastische Konstruktion bezeichnet eine bereits zuvor erfolgte gemeinsame Reise. Die Formulierung bewahrt sowohl die Herkunft aus Galiläa als auch die Gemeinschaft mit Jesus.
- source_word: ἐθεάσαντο
  choice: sahen
  rationale: Das Verb kann ein bewusstes, aufmerksames Sehen bezeichnen. „Sahen“ ist hier idiomatisch; die folgenden Objekte verdeutlichen, was die Frauen wahrnahmen.
- source_word: τὸ μνημεῖον
  choice: das Grab
  rationale: Im Bestattungskontext bezeichnet μνημεῖον die Grabanlage beziehungsweise Grabstätte; „Grab“ ist die geläufige und präzise Wiedergabe.
- source_word: ὡς ἐτέθη
  choice: wie … hineingelegt wurde
  rationale: ὡς führt die Art und Weise der Niederlegung ein. „Hineingelegt“ macht im Deutschen natürlich deutlich, dass der Leichnam in das zuvor genannte Grab gelegt wurde.
- source_word: τὸ σῶμα αὐτοῦ
  choice: sein Leichnam
  rationale: „Leichnam“ bezeichnet in diesem Bestattungskontext eindeutig und würdig den toten Körper Jesu.
theological_decisions:
- issue: Erzählfolge des Partizips κατακολουθήσασαι und des Hauptverbs ἐθεάσαντο
  choice: 'Als aufeinanderfolgende Handlungen wiedergegeben: „gingen hinterher und sahen“'
  alternative: 'Formaler: „Nachdem sie hinterhergegangen waren, sahen sie …“'
  rationale: Die koordinierte Form ist natürliches modernes Deutsch und bewahrt die erzählerische Abfolge, ohne aus dem Partizip eine stärker markierte zeitliche Beziehung abzuleiten.
- issue: Unausgesprochenes Bezugsobjekt bei κατακολουθήσασαι
  choice: 'Kein Bezugsobjekt ergänzt: „gingen hinterher“'
  alternative: „folgten ihm“ oder „folgten ihnen“
  rationale: Der griechische Vers nennt nicht ausdrücklich, wem die Frauen folgten. Die Übersetzung wahrt diese Offenheit und vermeidet eine stillschweigende Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählfluss; „gingen hinterher“ vermeidet ein im Deutschen erforderliches, im Ausgangstext jedoch nicht genanntes Objekt.
