revisions:
- from: Die Frauen aber, die mit ihm aus Galiläa gekommen waren[a], gingen hinterher und sahen das Grab und wie sein Leichnam hineingelegt wurde.
  to: Die Frauen aber, die mit ihm aus Galiläa gekommen waren[a], folgten und sahen das Grab und wie sein Leichnam hingelegt wurde.
  rationale: Die Revision entfernt die in „hineingelegt“ enthaltene, im Vers nicht ausdrücklich wiederholte Zielangabe und ersetzt die umgangssprachlichere Wendung „gingen hinterher“ durch „folgten“. Damit bleiben die narrative Abfolge und das nicht ausdrücklich benannte Bezugsobjekt von κατακολουθήσασαι erhalten.
