  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: de
  text: Die führenden Priester und die Schriftgelehrten standen dort und klagten ihn heftig an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: standen dabei
  rationale: 'Die Form bezeichnet einen anhaltenden Zustand in der Vergangenheit: Sie standen dort beziehungsweise waren anwesend. „Standen dabei“ ist im Deutschen natürlich und lässt ihre aktive Beteiligung an der Szene erkennen.'
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die Erzählung mit einem schwachen Anschluss weiter und muss nicht als deutlicher Gegensatz wiedergegeben werden.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führung, nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ gibt die Funktion in verständlichem modernem Deutsch wieder.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die etablierte und hinreichend direkte deutsche Bezeichnung für die mit Auslegung und Anwendung der heiligen Schriften befassten Fachleute.
- source_word: εὐτόνως
  choice: heftig
  rationale: Das Adverb bezeichnet Nachdruck und Intensität. Im Zusammenhang mit der Anklage bringt „heftig“ die energische, feindselige Art knapp und natürlich zum Ausdruck.
- source_word: κατηγοροῦντες
  choice: klagten … an
  rationale: Das Partizip beschreibt eine gleichzeitig andauernde Handlung. Die finite deutsche Form mit „und“ bildet dies idiomatisch ab und bewahrt den rechtlichen Beiklang des Verbs.
- source_word: αὐτοῦ
  choice: ihn
  rationale: Der Genitiv ist vom Verb κατηγορέω abhängig und bezeichnet die angeklagte Person; im Deutschen verlangt „anklagen“ den Akkusativ.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die partizipiale Konstruktion wurde zur natürlichen deutschen Satzverbindung mit zwei koordinierten Verben umgeformt. Keine Fußnote ist nötig, da die Bedeutungsnuance von εὐτόνως mit „heftig“ im Haupttext angemessen wiedergegeben wird.
