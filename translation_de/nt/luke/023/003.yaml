  verdict: approve
  source_fidelity: 'Die Übersetzung gibt den griechischen Satzgehalt zuverlässig wieder: Pilatus stellt die Frage nach dem Königstitel; Jesu knappe, auf Pilatus'' Formulierung zurückverweisende Antwort bleibt erhalten. Das schwache δέ und das redeeinleitende λέγων dürfen im idiomatischen Deutschen ohne Bedeutungsverlust unmarkiert bleiben. „Er antwortete ihm“ deckt ἀποκριθεὶς αὐτῷ ἔφη natürlich und ausreichend präzise ab.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede und die knappe Satzfolge sind idiomatisch. „Du sagst es“ ist eine geläufige, knappe Wiedergabe und bewahrt die beabsichtigte Zurückhaltung besser als eine explizite Bejahung.
  terminology: „König der Juden“ ist für den hier verhandelten Titel die etablierte und kontextgerechte Wiedergabe von βασιλεὺς τῶν Ἰουδαίων. Die Fußnote bewahrt sachgerecht die lexikalische Alternative „Judäer“. Die Anmerkung zu „Du sagst es“ erläutert mögliche Nuancen, ohne eine dogmatisch festgelegte Deutung vorzuschreiben.
