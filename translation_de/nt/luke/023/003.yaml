id: LUK.23.3
reference: Luke 23:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: de
  text: 'Pilatus fragte ihn: „Bist du der König der Juden[a]?“ Er antwortete ihm: „Du sagst es.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“. Das griechische Wort kann je nach Zusammenhang Juden oder Bewohner Judäas bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Das sagst du“ oder sinngemäß: „Ja, so ist es, wie du sagst.“ Die knappe griechische Antwort kann als zurückhaltende Bestätigung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Das schwache δέ führt die Erzählung weiter. Im Deutschen stellt bereits die Satzfolge den Anschluss natürlich her; „darauf“ würde die zeitliche Abfolge stärker markieren als der griechische Text.
- source_word: ἠρώτησεν
  choice: fragte
  rationale: Die Aoristform von ἐρωτάω bezeichnet hier schlicht das Stellen der folgenden direkten Frage.
- source_word: λέγων
  choice: durch direkte Rede wiedergegeben
  rationale: Das griechische Rede einleitende Partizip ist im Deutschen neben „fragte“ redundant. Seine Funktion wird durch den Doppelpunkt und die direkte Rede vollständig ausgedrückt.
- source_word: Σὺ εἶ
  choice: Bist du
  rationale: Die Wortfolge ist im Zusammenhang eindeutig als Frage zu verstehen; die deutsche Inversion gibt sie idiomatisch wieder. Das betonte Pronomen bleibt durch „du“ erhalten.
- source_word: βασιλεὺς
  choice: König
  rationale: βασιλεύς bezeichnet hier den Königstitel, der Gegenstand von Pilatus’ Verhör ist; „Herrscher“ wäre weniger präzise.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Im Kontext der Anklage ist „König der Juden“ die etablierte und sachlich passende Wiedergabe. Die mögliche regional-ethnische Bedeutung „Judäer“ wird in einer Fußnote bewahrt.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Er antwortete ihm
  rationale: Diese natürliche deutsche Formulierung gibt sowohl das responsive Partizip als auch den Dativ αὐτῷ und das Sprechverb wieder, ohne die griechische Konstruktion hölzern nachzubilden.
- source_word: Σὺ λέγεις
  choice: Du sagst es
  rationale: 'Die knappe Antwort bleibt indirekt: Jesus weist den Titel nicht zurück, formuliert aber auch kein ausdrückliches „Ja“. Die deutsche Wendung erhält diese Spannung besser als eine eindeutige Zustimmung.'
theological_decisions:
- issue: Aussagekraft der Antwort Σὺ λέγεις
  choice: „Du sagst es“ als knappe, qualifizierte Bestätigung
  alternative: „Ja, so ist es, wie du sagst“ oder distanzierter „Das sagst du“
  rationale: Der griechische Ausdruck kann zustimmend verstanden werden, bleibt jedoch auffallend indirekt. Die Hauptübersetzung vermeidet sowohl eine uneingeschränkte Bekräftigung als auch eine Verneinung und bewahrt damit die rhetorische und christologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Redeformeln werden idiomatisch gestrafft, während Titel, Pronomenbetonung und die Mehrdeutigkeit von Jesu Antwort erhalten bleiben.
