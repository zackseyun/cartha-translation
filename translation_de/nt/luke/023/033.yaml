id: LUK.23.33
reference: Luke 23:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: de
  text: Und als sie zu dem Ort kamen, der Schädel[a] genannt wird, kreuzigten sie ihn dort und die Verbrecher, den einen zur Rechten und den anderen zur Linken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Schädel genannt wird“. Κρανίον bedeutet „Schädel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den einen von rechts, den anderen von links“. Wessen rechte und linke Seite gemeint ist, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: sie zu dem Ort kamen
  rationale: Bei einem Bewegungsverb gibt ἐπί mit Akkusativ die Richtung zum Ort an. „Zu dem Ort kamen“ ist im Deutschen natürlich und bewahrt den erzählerischen Ablauf.
- source_word: τὸν καλούμενον Κρανίον
  choice: der Schädel genannt wird
  rationale: Κρανίον bedeutet wörtlich „Schädel“. Die Übersetzung erhält den semantischen Gehalt der Ortsbezeichnung, statt sie zu transliterieren.
- source_word: ἐσταύρωσαν
  choice: kreuzigten sie
  rationale: „Kreuzigen“ ist die präzise und übliche deutsche Wiedergabe von σταυρόω, ohne zusätzliche Einzelheiten in den Text einzutragen.
- source_word: κακούργους
  choice: die Verbrecher
  rationale: κακοῦργος bezeichnet einen Verbrecher bzw. Übeltäter. „Verbrecher“ ist modern und klar und vermeidet eine Harmonisierung mit abweichenden Bezeichnungen in anderen Evangelientexten.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: den einen zur Rechten und den anderen zur Linken
  rationale: Die korrelative Konstruktion verteilt die beiden Verbrecher auf die rechte und linke Seite. Die traditionelle Richtungsformel ist im Deutschen würdig und verständlich; ein ausdrückliches „von ihm“ wird nicht ergänzt, da es im Griechischen nur kontextuell vorausgesetzt ist.
theological_decisions:
- issue: Wiedergabe von Κρανίον
  choice: Schädel
  alternative: Schädelstätte; Golgota
  rationale: Lukas verwendet die griechische Ortsbezeichnung Κρανίον, deren Bedeutung „Schädel“ ist. „Schädel“ bewahrt diese Bedeutung und trägt weder die ausführlichere traditionelle Bildung „Schädelstätte“ noch die aus anderen Evangelien bekannte semitische Namensform „Golgota“ ein.
- issue: Bezeichnung der mit Jesus Gekreuzigten
  choice: Verbrecher
  alternative: Übeltäter; Räuber
  rationale: Das lukanische κακοῦργοι ist allgemein und legt weder „Räuber“ noch „Aufständische“ fest. „Verbrecher“ wahrt diese Breite und vermeidet eine Harmonisierung mit anderen Evangelien.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Zur Rechten/zur Linken“ erhält die knappe, ausgewogene Parallelstruktur des griechischen Satzes. Sämtliche Fußnotenmarker stehen im Haupttext.
