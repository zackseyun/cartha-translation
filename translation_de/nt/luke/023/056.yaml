id: LUK.23.56
reference: Luke 23:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: de
  text: Nachdem sie zurückgekehrt waren, bereiteten sie wohlriechende Gewürze und Salböle[a] vor. Den Sabbat über ruhten sie gemäß dem Gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Duftöle“ beziehungsweise „duftende Salben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Nachdem sie zurückgekehrt waren
  rationale: Das vorzeitige aoristische Partizip bezeichnet die Rückkehr der Frauen als Handlung, die der Vorbereitung vorausging; der deutsche Nebensatz gibt diese zeitliche Abfolge natürlich und genau wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel dient hier vor allem der leichten Fortführung der Erzählung. Die deutsche Satzfolge vermittelt diesen Anschluss bereits, ohne ein schwerfälliges „aber“ oder ein unnötiges „dann“ einzufügen.
- source_word: ἡτοίμασαν
  choice: bereiteten … vor
  rationale: Die übliche und im Bestattungskontext natürliche Wiedergabe von ἑτοιμάζω.
- source_word: ἀρώματα
  choice: wohlriechende Gewürze
  rationale: Gemeint sind aromatische Stoffe, die für die Behandlung des Leichnams bestimmt waren. „Wohlriechende Gewürze“ ist verständlich und unterscheidet den Ausdruck von μύρα.
- source_word: μύρα
  choice: Salböle
  rationale: μύρον bezeichnet wohlriechendes Öl beziehungsweise eine duftende Salbe. „Salböle“ passt zum Bestattungskontext, ohne den Stoff unnötig auf Myrrhe festzulegen.
- source_word: τὸ μὲν σάββατον
  choice: Den Sabbat über
  rationale: Die Formulierung gibt den zeitlichen Bezug idiomatisch wieder. μέν deutet einen Kontrast zum folgenden Geschehen an, der innerhalb dieses Einzelverses im Deutschen nicht ausdrücklich ergänzt werden muss.
- source_word: ἡσύχασαν
  choice: ruhten sie
  rationale: Im Zusammenhang mit dem Sabbat bezeichnet das Verb das Einstellen der Tätigkeit beziehungsweise die Sabbatruhe.
- source_word: κατὰ τὴν ἐντολήν
  choice: gemäß dem Gebot
  rationale: Die Wiedergabe bewahrt den bestimmten Artikel und den Singular und drückt die Übereinstimmung mit dem betreffenden Gebot knapp aus.
theological_decisions:
- issue: Bezug von „dem Gebot“
  choice: Die Formulierung bleibt im Haupttext unentfaltet und verweist im Kontext auf das Sabbatgebot.
  alternative: Ausdrückliche Erweiterung zu „gemäß dem Sabbatgebot“ oder allgemeinere Wiedergabe als „nach göttlicher Weisung“.
  rationale: Der Kontext legt das Sabbatgebot der Tora nahe, doch der griechische Text sagt lediglich „dem Gebot“. Die knappe Wiedergabe bewahrt diese Form und vermeidet eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorzeitige Partizipialsatz wird als natürlicher temporaler Nebensatz wiedergegeben. „Salböle“ ist im Bestattungskontext verständlich; die Fußnote bewahrt die weitere Bedeutungsbreite von μύρα.
