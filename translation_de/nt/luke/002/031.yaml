id: LUK.2.31
reference: Luke 2:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: de
  text: das du vor den Augen aller Völker[a][b] bereitet hast,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor allen Völkern«; die griechische Wendung kann bezeichnen, dass etwas allen sichtbar vor Augen gestellt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aller Nationen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: das
  rationale: Neutrales Relativpronomen im Akkusativ Singular; es bezieht sich auf das neutrale »Heil« im vorhergehenden Vers.
- source_word: ἡτοίμασας
  choice: du bereitet hast
  rationale: Der Aorist Aktiv, 2. Person Singular, ist an Gott gerichtet. Das deutsche Perfekt klingt im Satzfluss natürlich und gibt die abgeschlossene Vorbereitung wieder.
- source_word: κατὰ πρόσωπον
  choice: vor den Augen
  rationale: Die Wendung bezeichnet etwas, das öffentlich vor anderen beziehungsweise in ihrer Sicht bereitgestellt wird. »Vor den Augen« bewahrt das Bild und ist im Deutschen idiomatisch.
- source_word: πάντων
  choice: aller
  rationale: Gibt den umfassenden Geltungsbereich des Genitivs Plural direkt wieder.
- source_word: τῶν λαῶν
  choice: Völker
  rationale: Der Plural wird bewahrt und bezeichnet mehrere Völker beziehungsweise Volksgruppen; die folgende Aussage kann die Heidenvölker und Israel näher bestimmen.
theological_decisions:
- issue: Bedeutungsumfang von λαῶν im Verhältnis zum folgenden Vers
  choice: aller Völker
  alternative: aller Nationen; aller Menschen
  rationale: »Völker« wahrt den griechischen Plural und lässt offen, wie Vers 32 die Gruppen näher bestimmt. »Menschen« würde die kollektive Mehrzahl einebnen, »Nationen« könnte den Ausdruck vorschnell auf die nichtjüdischen Völker verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vor den Augen« erhält das anschauliche griechische Idiom, ohne die im Deutschen schwerfällige Formulierung »vor dem Angesicht« zu verwenden.
