id: LUK.2.19
reference: Luke 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: de
  text: Maria aber bewahrte all diese Worte und erwog sie in ihrem Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »indem sie sie in ihrem Herzen zusammenbrachte«; gemeint sein kann, dass Maria die Worte miteinander verglich, abwog und bedachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Markiert einen milden Gegensatz zwischen der öffentlichen Reaktion der anderen und Marias innerer Reaktion; im Deutschen wirkt die Nachstellung natürlich und würdevoll.
- source_word: συνετήρει
  choice: bewahrte
  rationale: Das Imperfekt bezeichnet ein anhaltendes Geschehen. »Bewahrte« vermittelt das sorgfältige Festhalten, ohne bereits vollständiges Verstehen auszudrücken.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: alle diese Worte
  rationale: ῥήματα bezieht sich im Kontext besonders auf das Gesagte und Berichtete. Die umfassende Bedeutung von πάντα bleibt durch »alle« erhalten.
- source_word: συμβάλλουσα
  choice: dachte immer wieder über sie nach
  rationale: Das Partizip bezeichnet ein inneres Zusammenbringen, Abwägen und Bedenken. Die Formulierung gibt diesen fortdauernden Reflexionsvorgang in natürlichem modernem Deutsch wieder.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: in ihrem Herzen
  rationale: Bewahrt die biblische Metapher für Marias inneres Denken und Empfinden, ohne sie psychologisch einzuengen.
- source_word: Μαρία
  choice: Maria
  rationale: Entspricht der etablierten deutschen Namensform.
theological_decisions:
- issue: Art und Reichweite von Marias Reaktion
  choice: Maria hält die berichteten Worte sorgfältig fest und setzt sich fortdauernd innerlich mit ihnen auseinander.
  alternative: Maria verstand die Bedeutung der Ereignisse bereits vollständig oder erinnerte sich lediglich an sie.
  rationale: Die beiden Verben bezeichnen Bewahren und reflektierendes Zusammenbringen, behaupten jedoch weder bloße Erinnerung noch vollständiges Verständnis.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Herzmetapher bleibt erhalten; die etwas unübliche Grundbedeutung von συμβάλλουσα wird in einer Fußnote transparent gemacht.
