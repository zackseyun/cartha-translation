  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die griechischen Partizipialkonstruktionen werden idiomatisch als Nebensatz und koordinierter Hauptsatz wiedergegeben, ohne den Handlungsablauf zu verändern.
