source:
  edition: SBLGNT
  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: de
  text: Als sie ihn nicht fanden, kehrten sie nach Jerusalem zurück und suchten nach ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Als …, … und
  rationale: Der griechische Anschluss führt die Erzählung schlicht weiter. Im natürlichen Deutschen wird καὶ hier nicht eigens mit „und“ am Satzanfang wiedergegeben; die Verknüpfung bleibt durch die Satzfolge und das spätere „und“ erkennbar.
- source_word: μὴ εὑρόντες
  choice: Als sie ihn nicht fanden
  rationale: Das verneinte Aoristpartizip wird als zeitlich-umständlicher Nebensatz wiedergegeben. Diese Formulierung ist natürlich und bewahrt den Sinn, dass die erfolglose Suche der Rückkehr vorausging.
- source_word: ὑπέστρεψαν
  choice: kehrten sie … zurück
  rationale: Die übliche, stilistisch angemessene Wiedergabe von ὑποστρέφω in diesem erzählenden Zusammenhang.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei Städtenamen ist „nach“ die idiomatische deutsche Entsprechung für die Bewegungsrichtung.
- source_word: ἀναζητοῦντες
  choice: und suchten nach ihm
  rationale: Das Präsenspartizip bezeichnet die begleitende beziehungsweise fortgesetzte Suche. Ein koordinierter deutscher Hauptsatz gibt dies klar und natürlich wieder; „nach ihm suchen“ vermittelt die gezielte, intensive Suche.
- source_word: αὐτόν
  choice: ihn / ihm
  rationale: Das Pronomen bezieht sich eindeutig auf Jesus; der Kasus wechselt im Deutschen aufgrund der jeweiligen Verbkonstruktion.
theological_decisions: []
