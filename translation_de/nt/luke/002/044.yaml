id: LUK.2.44
reference: Luke 2:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: de
  text: Doch weil sie annahmen, er sei in der Reisegruppe[a], gingen sie eine Tagesreise weit. Dann suchten sie ihn unter ihren Verwandten und Bekannten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reisegesellschaft“; das griechische Wort bezeichnet eine Gruppe, die gemeinsam unterwegs ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Imperfekt hebt die andauernde Suche hervor; auch möglich: „begannen sie, ihn … zu suchen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: weil sie annahmen
  rationale: Das Aoristpartizip bezeichnet die Annahme, aufgrund deren Maria und Josef weiterzogen; die kausale Wiedergabe ist im Deutschen natürlich und bewahrt den vorläufigen Charakter.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier eine leichte Gegenbewegung zur vorherigen Aussage und leitet die folgenschwere Annahme ein.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: er sei in der Reisegruppe
  rationale: Der Konjunktiv der indirekten Rede gibt ihre Annahme angemessen wieder; συνοδία bezeichnet eine gemeinsam reisende Gruppe.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: gingen sie eine Tagesreise weit
  rationale: Die griechische Wendung bezeichnet die an einem Tag zurückgelegte Reisestrecke; diese Formulierung ist klar und idiomatisch.
- source_word: ἀνεζήτουν
  choice: suchten sie ihn
  rationale: Das Imperfekt stellt die Suche als anhaltenden Vorgang dar. Der Folgesatz mit „Dann“ macht ihren Einsatz nach der Tagesreise deutlich, ohne den inchoativen Sinn zwingend festzulegen.
- source_word: συγγενεῦσιν
  choice: Verwandten
  rationale: Der Ausdruck bezeichnet Familienangehörige allgemein und ist im modernen Deutschen präzise und inklusiv.
- source_word: γνωστοῖς
  choice: Bekannten
  rationale: γνωστοί bezeichnet Personen aus dem Bekanntenkreis, ohne die engere Bedeutung von „Freunden“ vorauszusetzen.
theological_decisions: []
