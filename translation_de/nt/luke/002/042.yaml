  source_fidelity: Der Entwurf gibt καὶ ὅτε, die idiomatische Altersangabe ἐγένετο ἐτῶν δώδεκα, die genitivus-absolute-Konstruktion ἀναβαινόντων αὐτῶν sowie κατὰ τὸ ἔθος τῆς ἑορτῆς zuverlässig wieder. „Hinaufzogen“ wahrt die Aufwärtsbewegung, ohne das im griechischen Text dieses Verses nicht erneut genannte Ziel Jerusalem zu ergänzen. Die satzabschließende Offenheit entspricht dem griechischen Anschluss an den folgenden Vers.
  naturalness: „Und als er zwölf Jahre alt war und sie nach dem Brauch des Festes hinaufzogen,“ ist verständliches modernes Standarddeutsch und besitzt einen angemessen leicht gehobenen Erzählton. Die unvollständige Satzperiode ist hier absichtlich und versübergreifend.
  terminology: „Brauch des Festes“ entspricht dem etablierten religiösen Sprachgebrauch und ist für τὸ ἔθος τῆς ἑορτῆς passend. Die Fußnote identifiziert das in V. 41 genannte Passahfest, ohne es unberechtigt in den Haupttext einzutragen.
