  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: de
  text: Und als er zwölf Jahre alt war und sie nach dem Brauch des Festes[a] hinaufzogen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das Passahfest, das im vorherigen Vers genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: er zwölf Jahre alt war
  rationale: Die griechische Altersangabe mit γίνομαι und Genitiv bezeichnet das Erreichen beziehungsweise Haben eines Alters. Die gewählte Formulierung ist im modernen Deutschen natürlich und eindeutig.
- source_word: ἀναβαινόντων αὐτῶν
  choice: sie … hinaufzogen
  rationale: Das Präsenspartizip bezeichnet eine begleitende Handlung; im deutschen Erzählzusammenhang gibt „sie … hinaufzogen“ dies idiomatisch wieder. Das Ziel Jerusalem wird aus dem vorherigen Vers verstanden, aber hier nicht ergänzt.
- source_word: κατὰ τὸ ἔθος
  choice: nach dem Brauch
  rationale: Die Formulierung gibt die Übereinstimmung mit einer feststehenden Gewohnheit knapp und quellennah wieder.
- source_word: τῆς ἑορτῆς
  choice: des Festes
  rationale: ἑορτή bezeichnet hier das religiöse Fest. „Fest“ ist würdig und allgemein verständlich; dass das Passahfest gemeint ist, ergibt sich aus Vers 41 und wird in der Fußnote erläutert.
- source_word: καὶ ὅτε
  choice: Und als
  rationale: „Und“ führt die Erzählung weiter, während „als“ den einmaligen zeitlichen Rahmen der folgenden Handlung eröffnet.
