source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: de
  text: Und sie eilten hin und fanden Maria und Josef und das Kind, das in der Futterkrippe lag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Futtertrog“. Das griechische Wort kann eine Futterkrippe oder einen Futtertrog bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν σπεύσαντες
  choice: sie eilten hin
  rationale: Die Verbindung aus finitem Verb und modalem Partizip beschreibt eine eilige Bewegung zum angekündigten Ort. „Sie eilten hin“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: ἀνεῦραν
  choice: fanden
  rationale: Das Verb bezeichnet hier das erfolgreiche Auffinden; „fanden“ ist im Erzählzusammenhang die natürliche Wiedergabe.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Maria und Josef
  rationale: Die Eigennamen folgen der üblichen deutschen Form; τε und καί verbinden beide Personen zu einer Aufzählung.
- source_word: τὸ βρέφος
  choice: das Kind
  rationale: βρέφος bezeichnet ein sehr junges, hier neugeborenes Kind. „Das Kind“ ist würdig und im deutschen Weihnachtserzählungsregister natürlich, während „Baby“ umgangssprachlicher wirkt.
- source_word: κείμενον
  choice: das ... lag
  rationale: Das Partizip beschreibt den Zustand beziehungsweise die Lage des Kindes, nicht den Vorgang des Hineinlegens.
- source_word: ἐν τῇ φάτνῃ
  choice: in der Futterkrippe
  rationale: φάτνη bezeichnet eine Krippe beziehungsweise einen Futtertrog. „Futterkrippe“ ist klar, natürlich und bewahrt den konkreten Sinn.
- source_word: καὶ ... καὶ ... καὶ
  choice: und ... und ... und
  rationale: Die wiederholte Koordination bewahrt den schlichten, additiven Erzählfluss des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit schlichtem, würdigem Erzählton. Die traditionelle Krippensprache wird durch das konkrete „Futterkrippe“ verständlich gehalten; die mögliche Wiedergabe „Futtertrog“ bleibt in der Fußnote erhalten.
