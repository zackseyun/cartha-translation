source:
  edition: SBLGNT
  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: de
  text: (Diese Erfassung fand als erste statt, während Quirinius Syrien regierte.[a][b])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diese Erfassung fand statt, bevor Quirinius Syrien regierte.« Manche verstehen πρώτη hier in einem vergleichend-temporalen Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Volkszählung« statt »Erfassung«. Das griechische Wort bezeichnet eine amtliche Registrierung, die häufig mit Besteuerung verbunden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die unmittelbar zuvor erwähnte Erfassung und wird im Deutschen natürlich attributiv wiedergegeben.
- source_word: ἀπογραφή
  choice: Erfassung
  rationale: Das Wort bezeichnet eine amtliche Registrierung beziehungsweise Aufnahme, häufig im Zusammenhang mit Besteuerung oder einer Volkszählung. »Erfassung« bewahrt den administrativen Sinn, ohne den Zweck zu eng festzulegen.
- source_word: πρώτη
  choice: als erste
  rationale: Dies gibt den naheliegenden ordinalen Sinn wieder und lässt erkennen, dass diese Erfassung als die erste bezeichnet wird. Die umstrittene temporale Deutung »bevor« wird in einer Fußnote bewahrt.
- source_word: ἐγένετο
  choice: fand ... statt
  rationale: Eine natürliche deutsche Wiedergabe für das Eintreten beziehungsweise Stattfinden eines Ereignisses.
- source_word: ἡγεμονεύοντος
  choice: während ... regierte
  rationale: Der Genitivus absolutus bezeichnet hier einen gleichzeitigen Umstand. »Regierte« wahrt die verbale Aussage, ohne Quirinius einen im Griechischen nicht ausdrücklich genannten Amtstitel zuzuschreiben.
- source_word: τῆς Συρίας
  choice: Syrien
  rationale: Übliche deutsche Bezeichnung des geografisch-politischen Gebiets.
- source_word: Κυρηνίου
  choice: Quirinius
  rationale: Eingebürgerte deutsche Namensform.
theological_decisions:
- issue: Deutung von πρώτη in einer historisch und syntaktisch umstrittenen Aussage
  choice: Im Haupttext wird πρώτη in seinem gewöhnlichen ordinalen Sinn mit »als erste« wiedergegeben.
  alternative: »Diese Erfassung fand statt, bevor Quirinius Syrien regierte.«
  rationale: Der ordinale Sinn ist sprachlich am unmittelbarsten. Da eine vergleichend-temporale Deutung als »bevor« vertreten wird, die Frage aber nicht stillschweigend entschieden werden soll, erscheint sie als Übersetzungsalternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erfassung« ist verständlich und administrativ präzise; »während ... regierte« klingt natürlicher als eine substantivische Amtsformel. Die Klammern des vorgelegten griechischen Textes wurden beibehalten.
