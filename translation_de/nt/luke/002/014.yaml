  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: de
  text: Ehre sei Gott in den höchsten Höhen, und auf der Erde Friede unter den Menschen, an denen er Wohlgefallen hat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „unter Menschen des Wohlgefallens“; gemeint sein kann auch: „unter Menschen, denen seine Gunst gilt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften lesen statt des Genitivs „Wohlgefallen“ im Nominativ: „und auf der Erde Friede, Wohlgefallen unter den Menschen“.'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Ehre sei
  rationale: Die nominale Ausrufung wird im Deutschen natürlich als feierlicher Zuspruch wiedergegeben. „Ehre sei“ bewahrt den liturgischen Klang und die auf Gott gerichtete Verherrlichung, ohne den Satz zu einer bloßen Aufforderung zum Loben zu verengen.
- source_word: ἐν ὑψίστοις
  choice: in den höchsten Höhen
  rationale: Die Wendung bezeichnet den höchsten himmlischen Bereich. Die deutsche Form wahrt den räumlichen Gegensatz zu „auf der Erde“ und bleibt zugleich feierlich und verständlich.
- source_word: θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger der zugeschriebenen Ehre; die Konstruktion „Ehre sei Gott“ gibt dies im Deutschen idiomatisch wieder.
- source_word: ἐπὶ γῆς
  choice: auf der Erde
  rationale: Die räumliche Angabe wird direkt und in bewusstem Gegensatz zu den höchsten Höhen wiedergegeben.
- source_word: εἰρήνη
  choice: Friede
  rationale: „Friede“ bewahrt die breite biblische Bedeutung des griechischen Begriffs und passt zum gehobenen Register der Verkündigung.
- source_word: ἐν ἀνθρώποις
  choice: unter den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein. Die inklusive deutsche Wiedergabe entspricht dem generischen Sinn und ist natürlicher als eine Beschränkung auf männliche Personen.
- source_word: εὐδοκίας
  choice: an denen er Wohlgefallen hat
  rationale: Der Genitiv kennzeichnet die Menschen als Gegenstand des Wohlgefallens beziehungsweise der Gunst. Die relative Formulierung ist im heutigen Deutsch verständlicher als das formale „Menschen des Wohlgefallens“; das aus dem Zusammenhang erschlossene „er“ bezieht sich auf Gott.
theological_decisions:
- issue: Bedeutung und syntaktische Funktion des Genitivs εὐδοκίας
  choice: Der Friede gilt Menschen, an denen Gott Wohlgefallen hat.
  alternative: „Friede, Wohlgefallen unter den Menschen“ nach der Lesart εὐδοκία im Nominativ; formaler auch „Friede unter Menschen des Wohlgefallens“.
  rationale: Der SBLGNT-Haupttext bietet εὐδοκίας im Genitiv. Daher gehört „Wohlgefallen“ als nähere Bestimmung zu den Menschen und bildet nicht als Nominativ ein drittes Glied der Verkündigung. Die Übersetzung macht die Beziehung verständlich, ohne eine weitergehende Lehre darüber festzulegen, welche Menschen gemeint sind oder auf welcher Grundlage Gottes Wohlgefallen beruht.
translation_notes:
  register: Feierlich-liturgisches, aber modernes Standarddeutsch. „Ehre sei Gott“ greift eine im Deutschen weithin verständliche biblische Ausdrucksweise auf. „Menschen“ gibt den generischen Sinn von ἄνθρωποι ohne unnötige geschlechtliche Markierung wieder.
