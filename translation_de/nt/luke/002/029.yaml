  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: de
  text: Nun entlässt du deinen Sklaven[a], Gebieter, nach deinem Wort in Frieden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Diener“. Das griechische Wort kann sowohl „Sklave“ als auch „Diener“ bedeuten; zusammen mit „Gebieter“ tritt hier das Verhältnis der Zugehörigkeit und des Dienstes besonders hervor.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wohl, dass Simeon nun bereit ist, in Frieden aus diesem Leben zu scheiden. Wörtlicher spricht der griechische Text jedoch davon, dass Gott ihn „entlässt“ oder „freigibt“.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Nun
  rationale: Markiert den gegenwärtigen Zeitpunkt der Erfüllung und passt zum gehobenen, aber verständlichen Gebetsregister.
- source_word: ἀπολύεις
  choice: entlässt
  rationale: Bewahrt das Bild des Freigebens beziehungsweise Entlassens, ohne den im Kontext naheliegenden Tod ausdrücklich in den Wortlaut einzutragen.
- source_word: τὸν δοῦλόν σου
  choice: deinen Sklaven
  rationale: δοῦλος bezeichnet einen Sklaven oder Diener. Zusammen mit der Anrede δέσποτα tritt hier das Verhältnis von Eigentümer und Sklave deutlich hervor.
- source_word: δέσποτα
  choice: Gebieter
  rationale: Gibt die persönliche Anrede an den Herrn mit umfassender Verfügungsgewalt wieder und korrespondiert mit δοῦλος, ohne die deutsche Anrede mit „Meister“ missverständlich wirken zu lassen.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: nach deinem Wort
  rationale: Gibt die Übereinstimmung mit Gottes gesprochenem Wort beziehungsweise seiner Zusage knapp und idiomatisch wieder.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Bewahrt die präpositionale Wendung und ihren biblischen Klang.
theological_decisions:
- issue: Ob Simeons Aussage ausdrücklich als Hinweis auf seinen Tod wiederzugeben ist
  choice: Das Bild des Entlassens bleibt im Haupttext erhalten.
  alternative: Nun lässt du deinen Diener in Frieden sterben.
  rationale: Der Zusammenhang legt Simeons bevorstehenden Tod nahe, doch ἀπολύω bedeutet nicht ausdrücklich „sterben lassen“. Die bildhafte Offenheit des griechischen Textes bleibt daher gewahrt.
- issue: Wiedergabe des Herrschaftsverhältnisses zwischen δοῦλος und δεσπότης
  choice: „Sklave“ und „Gebieter“
  alternative: „Diener“ und „Herr“
  rationale: Die gewählte Paarung bewahrt die im Griechischen besonders hervortretende Beziehung von Unterordnung und Verfügungsgewalt, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Gebetsklang. „Nun“ und „in Frieden“ bewahren die knappe poetische Form; „Gebieter“ ist markiert, aber allgemein verständlich und bildet die Beziehung zu „Sklave“ genauer ab als „Meister“.
