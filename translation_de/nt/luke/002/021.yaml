  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: de
  text: Als die acht Tage für seine Beschneidung erfüllt waren, gab man ihm den Namen Jesus, den der Engel genannt hatte, bevor er im Mutterleib empfangen wurde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „als acht Tage erfüllt waren, um ihn zu beschneiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und sein Name wurde Jesus genannt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: als acht Tage erfüllt waren
  rationale: Bewahrt die für Lukas charakteristische kom وpletive Ausdrucksweise, ohne im Deutschen unverständlich zu werden.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: und er beschnitten werden sollte
  rationale: Gibt den Bezug beziehungsweise Zweck des artikulierten Infinitivs natürlich wieder; die Beschneidung steht nach Ablauf der acht Tage an.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: gab man ihm den Namen Jesus
  rationale: Natürliches deutsches Passiväquivalent der griechischen Namensformel; das ausdrückliche ὄνομα bleibt durch „Namen“ erhalten.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: So hatte ihn der Engel genannt
  rationale: Bezieht das substantivierte Partizip sinngemäß auf den Namen Jesus und wahrt das wiederholte Verb καλέω, ohne eine schwerfällige deutsche Wiederholung zu erzeugen.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: bevor er im Mutterleib empfangen wurde
  rationale: „Empfangen“ ist im Deutschen die präzise und übliche Bezeichnung für die menschliche Empfängnis; „Mutterleib“ gibt κοιλία im Kontext natürlich wieder.
theological_decisions:
- issue: Aussage über Jesu Empfängnis
  choice: bevor er im Mutterleib empfangen wurde
  alternative: vor seiner Empfängnis im Mutterleib
  rationale: Die Übersetzung benennt nüchtern Jesu menschliche Empfängnis und fügt keine christologische Deutung hinzu, die über den griechischen Text hinausgeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Wendung „acht Tage erfüllt“ bleibt erhalten; die Namensformel wird zugunsten natürlicher Verständlichkeit idiomatisch wiedergegeben.
