  terminology: „Beschneidung“, „Jesus“, „Engel“, „Mutterleib“ und „empfangen“ sind sachgerecht. „Gab man ihm den Namen Jesus“ ist eine idiomatische deutsche Namensformel und gibt die passive griechische Konstruktion angemessen wieder.
