  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: de
  text: Seine Eltern gingen jedes Jahr zum Passafest nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: gingen
  rationale: Der Imperfekt bezeichnet hier zusammen mit κατ’ ἔτος eine regelmäßig wiederholte Handlung in der Vergangenheit. Das deutsche Präteritum »gingen« gibt dies mit »jedes Jahr« natürlich wieder.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seine Eltern
  rationale: γονεῖς bedeutet schlicht »Eltern«. Die Formulierung bewahrt den unmittelbaren Erzählsinn, ohne die in Lukas bezeugte jungfräuliche Empfängnis umzudeuten.
- source_word: κατ’ ἔτος
  choice: jedes Jahr
  rationale: Die Wendung bezeichnet eine jährlich wiederkehrende Handlung. »Jedes Jahr« ist im modernen Deutschen natürlicher als »Jahr für Jahr«, ohne den distributiven Sinn zu verlieren.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei einer Bewegung zu einer Stadt wird εἰς im Deutschen idiomatisch mit »nach« wiedergegeben; »Jerusalem« ist die etablierte Namensform.
- source_word: τῇ ἑορτῇ τοῦ πάσχα
  choice: zum Passafest
  rationale: Der Dativ nennt im Zusammenhang der Reise den Anlass beziehungsweise das Ziel der Festteilnahme. »Zum Passafest« ist präzise, knapp und im Deutschen natürlich.
theological_decisions:
- issue: Bezeichnung von Jesu Familienangehörigen
  choice: seine Eltern
  alternative: sein Vater und seine Mutter
  rationale: Der griechische Text verwendet den gewöhnlichen Ausdruck für »Eltern«. Diese Wiedergabe wahrt die Spannung zum Bericht von der jungfräulichen Empfängnis, ohne sie hier erklärend aufzulösen oder zu bestreiten.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Satzstellung stellt den jährlich wiederkehrenden Brauch klar heraus; keine Fußnote ist erforderlich.
