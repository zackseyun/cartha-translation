id: LUK.2.51
reference: Luke 2:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: de
  text: Und er ging mit ihnen hinab und kam nach Nazareth. Und er ordnete sich ihnen unter[a]. Seine Mutter bewahrte alle diese Worte[b] in ihrem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Form bezeichnet hier eine andauernde Unterordnung oder fortgesetzten Gehorsam.
    reason: Aspekt und Bedeutungsumfang der griechischen Verbalkonstruktion.
  - marker: b
    text: 'Oder: alle diese Dinge; das griechische Wort kann Worte, Aussagen oder die damit bezeichneten Geschehnisse meinen.'
    reason: Lexikalische Mehrdeutigkeit von ῥήματα.
lexical_decisions:
- source_word: κατέβη
  choice: ging … hinab
  rationale: Bewahrt die topografische Bewegung von Jerusalem hinab, ohne das gehobenere „stieg hinab“ zu erzwingen.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: Gibt die schlichte Begleitung direkt und natürlich wieder.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: kam nach Nazareth
  rationale: Im Deutschen ist bei Ortsnamen „nach Nazareth kommen“ die natürliche Entsprechung; die Erzählperspektive erlaubt „kam“.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: Er ordnete sich ihnen unter
  rationale: Gibt die persönliche, aktive Unterordnung wieder. Eine Fußnote weist darauf hin, dass die griechische Verlaufsform einen andauernden Zustand beziehungsweise ein fortgesetztes Verhalten bezeichnet.
- source_word: διετήρει
  choice: bewahrte
  rationale: Drückt sorgfältiges Behalten und inneres Festhalten aus, ohne das stärker deutende „hütete wie einen Schatz“ in den Haupttext einzutragen.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: alle diese Worte
  rationale: „Worte“ bildet ῥήματα transparent ab; da der Ausdruck im Zusammenhang auch die bezeichneten Vorgänge oder Geschehnisse umfassen kann, wird diese Möglichkeit in einer Fußnote erhalten.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: in ihrem Herzen
  rationale: Bewahrt die verständliche biblische Redeweise für inneres Erinnern und Nachsinnen.
theological_decisions:
- issue: Jesu Verhältnis zu Maria und Josef
  choice: Er ordnete sich ihnen unter
  alternative: Er war ihnen gehorsam / Er war ihnen untertan
  rationale: Die Formulierung hält Jesu tatsächliche und fortdauernde Unterordnung unter seine irdischen Eltern fest, ohne sie dogmatisch zu erklären oder durch eine statische beziehungsweise enger auf Gehorsam begrenzte Wiedergabe vollständig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dann“ sorgt für einen natürlichen Erzählanschluss; „aber“ markiert den leichten Themenwechsel zur Mutter. Die Satzteilung vermeidet eine schwerfällige Reihung und wahrt dennoch die Abfolge des griechischen Textes.
