id: LUK.2.35
reference: Luke 2:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: de
  text: Und auch durch deine eigene Seele wird ein Schwert hindurchdringen, damit die Gedanken aus vielen Herzen offenbar werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοῦ δὲ αὐτῆς
  choice: auch deine eigene
  rationale: Das Genitivpronomen mit dem intensivierenden αὐτῆς hebt Maria persönlich hervor. Die Stellung von „auch“ gibt δέ im Zusammenhang natürlich wieder.
- source_word: ψυχή
  choice: Seele
  rationale: Hier bezeichnet ψυχή den inneren Menschen als Ort tiefen Leids. „Seele“ wahrt das Bild und dessen geistlich-emotionales Gewicht.
- source_word: διελεύσεται
  choice: wird … dringen
  rationale: Das Verb bedeutet wörtlich „hindurchgehen“. Zusammen mit einem Schwert ist „durch … dringen“ im Deutschen natürlich und bewahrt sowohl die Bewegungsrichtung als auch das Bild des Durchbohrens.
- source_word: ῥομφαία
  choice: Schwert
  rationale: ῥομφαία kann ein großes, schweres Schwert bezeichnen; „Schwert“ ist hier präzise genug und vermeidet eine unnötige Spezifizierung.
- source_word: ὅπως ἂν
  choice: damit
  rationale: Die Konjunktion bezeichnet Zweck oder beabsichtigte Folge; „damit“ erhält diese bewusst nicht weiter aufgelöste Beziehung.
- source_word: ἀποκαλυφθῶσιν
  choice: offenbar werden
  rationale: Die passive Form bezeichnet ein Enthüllt- oder Sichtbarwerden. „Offenbar werden“ ist würdig, verständlich und bewahrt den passiven Sinn.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: die Gedanken aus vielen Herzen
  rationale: ἐκ bezeichnet die Herkunft aus dem Inneren der Herzen. „Gedanken“ lässt offen, ob es sich um Überlegungen, Absichten oder zweifelnde beziehungsweise feindselige Erwägungen handelt.
theological_decisions:
- issue: Bedeutung des Schwertes für Maria
  choice: Das Bild bleibt als nicht näher bestimmtes tiefes persönliches Leiden Marias stehen.
  alternative: Das Schwert ausdrücklich auf Marias Schmerz bei der Kreuzigung oder allgemein auf die trennende Wirkung von Jesu Wirken beziehen.
  rationale: Der griechische Text redet Maria direkt an, legt jedoch die genaue geschichtliche Gestalt ihres Leidens nicht ausdrücklich fest.
- issue: Beziehung zwischen dem Schwert und der Offenbarung der Gedanken
  choice: „damit“ bewahrt die im Text ausgedrückte Zweck- beziehungsweise Ergebnisbeziehung.
  alternative: Die Aussage nur als zeitliche oder lose begleitende Folge wiedergeben.
  rationale: ὅπως ἂν verbindet das vorausgehende Geschehen eng mit der Offenbarung dessen, was in vielen Herzen verborgen ist, ohne die genaue theologische Kausalität auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht bildhafte Wortstellung erhält die Eindringlichkeit der prophetischen Anrede, ohne die Metapher konfessionell oder historisch zu verengen.
