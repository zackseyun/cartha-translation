    issue: Satzverknüpfung nach »Tempel«
    rationale: Das griechische καί verbindet die zweite Satzphase unmittelbar mit der ersten; das Semikolon wahrt im Deutschen den Zusammenhang und den versübergreifend offenen Satz besser als ein Punkt.
  - severity: low
    issue: Stellung des implizierten Objekts bei »tun«
    rationale: Das griechische τοῦ ποιῆσαι bezeichnet eine konkrete, auf Jesus bezogene Handlung. Das ergänzte »das« macht die deutsche Infinitivgruppe flüssiger, ohne Bedeutung hinzuzufügen.
