- from: Und er kam im Geist[a] in den Tempel. Als die Eltern[b] das Kind Jesus hereinbrachten, um für ihn zu tun, was nach dem Gesetz üblich war,
  to: Und er kam im Geist[a] in den Tempel; als die Eltern[b] das Kind Jesus hereinbrachten, um für ihn das zu tun, was nach dem Gesetz üblich war,
  rationale: 'Die Revision beschränkt sich auf zwei stilistisch-syntaktische Verbesserungen: Das Semikolon erhält die enge Verknüpfung der beiden griechischen Satzteile und den offenen Anschluss an den Folgevers. »Um für ihn das zu tun« ist im modernen Deutsch klarer, gibt aber weiterhin nur die im Ausgangstext implizierte konkrete Handlung wieder. Fußnoten, Marker und ihre Anker bleiben unverändert.'
