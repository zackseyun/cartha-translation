  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: de
  text: Und er kam im Geist[a] in den Tempel; als die Eltern[b] das Kind Jesus hereinbrachten, um für ihn das zu tun, was nach dem Gesetz üblich war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch den Geist«. Die griechische Wendung lässt beide Wiedergaben zu; »im Geist« folgt ihrer Form genauer und entspricht dem wiederholten Hinweis auf den Heiligen Geist in diesem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Eltern«. Lukas gebraucht hier für Maria und Josef die gewöhnliche Sprache des Familienlebens und ihrer Fürsorge für Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: im Geist
  rationale: Der Artikel und der unmittelbare Zusammenhang in Lukas 2,25–27 sprechen für den Heiligen Geist. »Im Geist« bewahrt zugleich die griechische Präposition und die mögliche Nuance eines Wirkens in der Sphäre beziehungsweise unter dem Einfluss des Geistes.
- source_word: ἱερόν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbereich, nicht speziell das innere Heiligtum (ναός). »Tempel« ist im Deutschen die natürliche und hinreichend genaue Wiedergabe.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: Als … hereinbrachten
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv hat zeitliche Bedeutung. Der Nebensatz gibt dies in natürlichem Deutsch wieder.
- source_word: γονεῖς
  choice: die Eltern
  rationale: Dies ist die schlichte lexikalische Bedeutung und entspricht der erzählerischen Bezeichnung von Maria und Josef in ihrer familiären Fürsorge für Jesus.
- source_word: παιδίον Ἰησοῦν
  choice: das Kind Jesus
  rationale: παιδίον bezeichnet hier das kleine Kind; die Namensfügung bleibt knapp und natürlich.
- source_word: τοῦ ποιῆσαι αὐτοὺς … περὶ αὐτοῦ
  choice: um für ihn zu tun
  rationale: Der substantivierte Infinitiv bezeichnet den Zweck; αὐτούς meint als Subjekt die Eltern, während περὶ αὐτοῦ die Handlung auf Jesus bezieht. Die deutsche Umformung macht diese Beziehungen verständlich.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: was nach dem Gesetz üblich war
  rationale: εἰθισμένον bezeichnet das Übliche beziehungsweise Herkömmliche. Diese Formulierung vermeidet die im Deutschen schwerfällige Wendung »nach dem Brauch des Gesetzes« und bewahrt den Bezug auf die gesetzlich bestimmte Praxis.
theological_decisions:
- issue: Bezug von πνεῦμα bei Simeons Gang zum Tempel
  choice: der Heilige Geist
  alternative: Simeons eigener Geist oder seine innere Haltung
  rationale: Die wiederholte ausdrückliche Erwähnung des Heiligen Geistes im unmittelbaren Zusammenhang stützt diesen Bezug. Die Formulierung »im Geist« bewahrt dennoch die Präpositionsstruktur des Ausgangstextes.
- issue: Bezeichnung Marias und Josefs als γονεῖς
  choice: die Eltern
  alternative: die Sorgeberechtigten; Josef und Maria
  rationale: Die gewöhnliche familiäre Ausdrucksweise des Textes wird unverändert wiedergegeben. Sie ist eine erzählerische Bezeichnung und entscheidet nicht gegen die zuvor von Lukas berichtete jungfräuliche Empfängnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanschluss bleibt mit einem Komma offen, da der Vers syntaktisch in den folgenden Zusammenhang eingebettet ist. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
