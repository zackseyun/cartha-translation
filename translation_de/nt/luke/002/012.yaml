  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: de
  text: 'Und dies wird für euch das Zeichen sein: Ihr werdet ein Baby finden, das in Wickeltücher gewickelt ist[a] und in einer Futterkrippe liegt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Tücher gewickelt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einer Krippe“ oder „in einem Futtertrog“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: Das Wort bezeichnet hier ein Erkennungszeichen, an dem die Hirten das Kind erkennen werden. „Zeichen“ ist sachlich, etabliert und legt nicht fest, ob darüber hinaus ein Wunderzeichen gemeint ist.
- source_word: εὑρήσετε
  choice: ihr werdet finden
  rationale: Die Form ist ein Futur in der zweiten Person Plural. Die Wiedergabe entspricht der Vorhersage des Engels unmittelbar und idiomatisch.
- source_word: βρέφος
  choice: Baby
  rationale: βρέφος bezeichnet ein sehr junges Kind beziehungsweise einen Säugling. „Baby“ ist im heutigen Standarddeutsch natürlich und allgemein verständlich.
- source_word: ἐσπαργανωμένον
  choice: in Windeln gewickelt
  rationale: Das Partizip bezeichnet das Einwickeln eines Säuglings in Stoffbahnen oder Wickeltücher. Die Formulierung ist anschaulich, natürlich und bewahrt den konkreten Vorgang.
- source_word: κείμενον
  choice: liegend
  rationale: Das Partizip beschreibt den gegenwärtigen Zustand beziehungsweise die Lage des Kindes. „Liegend“ vermeidet die zusätzliche Vorstellung einer zuvor vollzogenen Handlung, die „gelegt“ nahelegen könnte.
- source_word: φάτνῃ
  choice: Futterkrippe
  rationale: φάτνη bezeichnet eine Krippe beziehungsweise einen Futtertrog. „Futterkrippe“ macht die sachliche Bedeutung für heutige Leser unmittelbar deutlich; die traditionelle Kurzform „Krippe“ wird als Alternative bewahrt.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: dies wird für euch das Zeichen sein
  rationale: Die griechische Nominalklausel ist elliptisch. Im Deutschen wird die Kopula ergänzt; das Futur fügt sich in den vorausweisenden Erzählzusammenhang ein und führt das folgende Erkennungszeichen natürlich ein.
theological_decisions:
- issue: Art des den Hirten gegebenen Zeichens
  choice: Der Vers beschreibt zunächst ein konkretes Erkennungszeichen.
  alternative: Das Zeichen kann zugleich als weitergehende göttliche Bestätigung verstanden werden.
  rationale: Die Übersetzung bleibt beim offenen Wort „Zeichen“ und erläutert es nicht als Wunder oder Beweis. So bleibt die erzählerische Funktion klar, während eine weitergehende theologische Bedeutung nicht ausgeschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Baby“ ist bewusst alltagssprachlich verständlich, ohne salopp zu wirken. „Futterkrippe“ verdeutlicht den Gegenstand; die traditionsnahe Form „Krippe“ steht in der Fußnote.
