  source_fidelity: 'Die Grundstruktur und der Sinn des griechischen Textes sind zutreffend wiedergegeben. „Zeichen“, das Zukunftsverb εὑρήσετε und die Zustandsbeschreibung durch die Partizipien werden angemessen erfasst. „In Windeln gewickelt“ ist jedoch keine sichere Wiedergabe von ἐσπαργανωμένον: Gemeint sind Wickel- bzw. Stofftücher zum Pucken, nicht moderne Windeln.'
  naturalness: Die vorgeschlagene Satzgestaltung ist verständlich, doch „in Tücher gewickelt“ ist im heutigen Standarddeutsch natürlicher und sachlich genauer als „in Windeln gewickelt“. Die Relativsatzform vermeidet eine etwas gedrängte Partizipialreihe.
  terminology: „Baby“, „Zeichen“ und „Futterkrippe“ sind vertretbar. „Futterkrippe“ gibt φάτνη konkret wieder; „Krippe“ und „Futtertrog“ sind geeignete Alternativen. Die Fußnote zu den Wickeltüchern soll die spezifischere Bedeutung des griechischen Verbs nennen.
