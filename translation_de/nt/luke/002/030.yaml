  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: de
  text: denn meine Augen haben dein Heil gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „deinen Retter“. Im Griechischen steht „dein Heil“; im Zusammenhang ist Gottes Heil in der Person Jesu gegenwärtig.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier Simeons vorausgehende Aussage. Das natürliche und würdige deutsche „denn“ macht diesen Zusammenhang klar.
- source_word: εἶδον
  choice: haben … gesehen
  rationale: Der griechische Aorist bezeichnet das vollzogene Sehen; das deutsche Perfekt gibt in direkter Rede die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung idiomatisch wieder.
- source_word: οἱ ὀφθαλμοί μου
  choice: meine Augen
  rationale: Die ausdrückliche, anschauliche Körpermetapher des Griechischen wird bewahrt und nicht zum bloßen „ich“ verkürzt.
- source_word: τὸ σωτήριόν σου
  choice: dein Heil
  rationale: σωτήριον bezeichnet hier Gottes Heil beziehungsweise Rettung, nicht unmittelbar die Personbezeichnung „Retter“. „Dein Heil“ ist im Deutschen prägnant, traditionsfähig und bewahrt zugleich, dass dieses Heil im Kind sichtbar gegenwärtig ist.
theological_decisions:
- issue: Soll τὸ σωτήριόν σου abstrakt als Gottes Heil oder im Blick auf das anwesende Kind personal als „deinen Retter“ wiedergegeben werden?
  choice: dein Heil
  alternative: deinen Retter
  rationale: 'Der griechische Ausdruck verwendet σωτήριον und nicht das personale σωτήρ. „Dein Heil“ folgt daher der sprachlichen Form und lässt die kontextuelle Spannung bestehen: Simeon sieht Gottes Heil in der Person Jesu, ohne dass die Übersetzung das Substantiv ausdrücklich personalisiert.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. „Heil“ ist etwas gehobener als „Rettung“, passt aber zu Gottes umfassendem rettendem Handeln und vermeidet die mögliche Verengung auf eine einzelne Rettungstat.
