source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: de
  text: 'und um ein Opfer darzubringen, wie es im Gesetz des Herrn heißt: ein Paar Turteltauben oder zwei junge Tauben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. 3. Mose 12,8.
    reason: Die Formulierung greift die Opferbestimmung für die Reinigung nach einer Geburt auf; die Quellenangabe macht den gesetzlichen Zusammenhang kenntlich.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: um ein Opfer darzubringen
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck. In Verbindung mit θυσίαν gibt „ein Opfer darbringen“ den Sinn idiomatisch und zugleich nah am griechischen Ausdruck wieder.
- source_word: κατὰ τὸ εἰρημένον
  choice: wie es … gesagt ist
  rationale: Das Perfektpartizip bezeichnet das in der Schrift Gesagte als weiterhin gültige Aussage. Das deutsche Präsens wahrt diesen resultativen Sinn natürlicher als ein Plusquamperfekt.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: im Gesetz des Herrn
  rationale: „Gesetz“ bezeichnet hier das mosaische Gesetz als maßgebliche Schrift; κύριος wird entsprechend dem neutestamentlichen Wortlaut mit „Herr“ wiedergegeben.
- source_word: ζεῦγος τρυγόνων
  choice: ein Paar Turteltauben
  rationale: ζεῦγος meint in diesem Zusammenhang ein Paar, und τρυγών bezeichnet spezifisch die Turteltaube.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: zwei junge Tauben
  rationale: νοσσός bezeichnet einen Jungvogel. Das natürliche deutsche „junge Tauben“ gibt die Opferterminologie verständlich wieder, ohne eine biologisch nicht eindeutig geforderte Unterscheidung zwischen Taube und Felsentaube einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριος in der Formel für das göttliche Gesetz
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text hat κύριος. „Herr“ bewahrt den neutestamentlichen Wortlaut, ohne durch „HERR“ ausdrücklich eine Rückübersetzung zum Gottesnamen vorzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung des vorangehenden Satzes mit „und um“ verbunden. „Darbringen“ bewahrt den kultischen Ton, ohne unnötig altertümlich zu wirken.
