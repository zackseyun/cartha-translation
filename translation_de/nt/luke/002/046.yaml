id: LUK.2.46
reference: Luke 2:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: de
  text: Und nach drei Tagen fanden sie ihn im Tempel[a]. Er saß mitten unter den Lehrern, hörte ihnen zu und stellte ihnen Fragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die gesamte Tempelanlage beziehungsweise die Tempelbereiche, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „befragte sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Und
  rationale: Die lukanische Erzählungsformel wird im modernen Deutschen am natürlichsten durch den fortführenden Satzanschluss wiedergegeben; ein ausdrückliches „es geschah“ wäre hier unnötig schwerfällig.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: nach drei Tagen
  rationale: Gibt die zeitliche Bedeutung von μετά mit Akkusativ eng und idiomatisch wieder.
- source_word: εὗρον αὐτόν
  choice: fanden sie ihn
  rationale: Schlichte, genaue Wiedergabe des narrativen Aorists und seines Objekts.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: „Tempel“ ist die geläufige deutsche Bezeichnung; ἱερόν meint hier jedoch die Tempelanlage und nicht ausschließlich das innere Heiligtum, was die Fußnote erläutert.
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: Er saß mitten unter den Lehrern
  rationale: Gibt Haltung und Position anschaulich wieder. „Lehrer“ bleibt bei der ausdrücklichen Bezeichnung des griechischen Textes, ohne „Gesetzeslehrer“ hinzuzufügen.
- source_word: ἀκούοντα αὐτῶν
  choice: hörte ihnen zu
  rationale: Bezeichnet in diesem Gesprächszusammenhang aufmerksames Zuhören natürlicher als bloßes „hörte sie“.
- source_word: ἐπερωτῶντα αὐτούς
  choice: stellte ihnen Fragen
  rationale: Gibt den fortdauernden fragenden Austausch idiomatisch wieder, ohne eine feindselige Befragung oder Herausforderung anzudeuten.
theological_decisions:
- issue: Art der Begegnung Jesu mit den Lehrern
  choice: „hörte ihnen zu und stellte ihnen Fragen“
  alternative: „befragte sie“ oder „stellte sie zur Rede“
  rationale: Die Formulierung bewahrt Jesus als aufmerksam und aktiv Beteiligten, ohne seine Weisheit abzuschwächen oder dem griechischen Verb eine konfrontative Haltung aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzkette ist zur besseren Verständlichkeit in zwei Sätze gegliedert; der fortlaufende Charakter der Szene bleibt erhalten.
