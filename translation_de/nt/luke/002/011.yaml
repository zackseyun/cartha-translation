id: LUK.2.11
reference: Luke 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: de
  text: Denn heute ist für euch in der Stadt Davids ein Retter geboren worden. Er ist der Messias, der Herr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Christus, der Herr“. Im Griechischen stehen die Titel χριστὸς κύριος, wörtlich etwa „Messias, Herr“; gewöhnlich werden sie als „der Messias, der Herr“ verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise den Inhalt der vorausgehenden Freudenbotschaft ein und klingt im modernen Deutschen natürlich.
- source_word: ἐτέχθη
  choice: ist … geboren worden
  rationale: Gibt den Aorist Passiv von τίκτω idiomatisch wieder; das Perfekt passt zu einer aktuellen mündlichen Bekanntgabe über ein soeben eingetretenes Ereignis.
- source_word: ὑμῖν
  choice: für euch
  rationale: 'Bringt den Dativ des Vorteils zum Ausdruck: Die Geburt geschieht zum Heil der Angesprochenen.'
- source_word: σήμερον
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: σωτήρ
  choice: Retter
  rationale: Bewahrt den Gedanken konkreter Rettung und ist im heutigen Standarddeutsch klarer als das traditionellere „Heiland“.
- source_word: ὅς ἐστιν
  choice: Er ist
  rationale: Die Aufteilung in einen zweiten Satz gibt die identifizierende Aussage der Relativkonstruktion klar und würdig wieder, ohne ihren Inhalt zu verändern.
- source_word: χριστός
  choice: Messias
  rationale: Das Wort fungiert hier als Titel des erwarteten davidischen Gesalbten, nicht als Eigenname.
- source_word: κύριος
  choice: Herr
  rationale: Entspricht dem Titel κύριος und bewahrt dessen Autoritätsanspruch sowie sein theologisches Gewicht.
- source_word: ἐν πόλει Δαυίδ
  choice: in der Stadt Davids
  rationale: Formale und zugleich geläufige Wiedergabe, die den davidischen Bezug bewahrt, ohne Bethlehem erläuternd in den Text einzusetzen.
theological_decisions:
- issue: Wiedergabe von χριστὸς κύριος
  choice: der Messias, der Herr
  alternative: Christus, der Herr; der Messias des Herrn
  rationale: Die beiden Nominative werden als auf „Retter“ bezogene Titel verstanden. „Messias“ macht die Titelfunktion von χριστός sichtbar; „Herr“ bewahrt κύριος. Die Apposition vermeidet es, die weniger naheliegende Deutung „Messias des Herrn“ in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Retter“ ist allgemein verständlich; die traditionelle Formulierung „Heiland“ wurde vermieden. Die Zweiteilung in zwei Sätze verhindert eine schwerfällige deutsche Relativkonstruktion und hebt die beiden Titel klar hervor.
