source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: de
  text: Und alle, die ihm zuhörten, staunten über sein Verständnis und seine Antworten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren außer sich vor Staunen“. Das griechische Verb bezeichnet eine starke Verwunderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: staunten
  rationale: Das Imperfekt beschreibt die anhaltende Reaktion der Zuhörenden. „Staunten“ gibt die starke Verwunderung natürlich wieder, ohne das im Deutschen missverständliche wörtliche Bild „außer sich sein“ zu verwenden.
- source_word: δὲ
  choice: Und
  rationale: δέ ist hier ein schwaches Bindewort im Erzählfluss. „Und“ verbindet den Satz unaufdringlich mit dem vorhergehenden Geschehen.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: alle, die ihm zuhörten
  rationale: Die substantivierte Präsenspartizipialkonstruktion bezeichnet die gerade Zuhörenden. Der Dativ bei „zuhören“ ist idiomatisches modernes Deutsch.
- source_word: ἐπὶ τῇ συνέσει
  choice: über sein Verständnis
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass des Staunens. σύνεσις meint Verständnis beziehungsweise Einsicht; „Verständnis“ ist klar, zugänglich und wertet weniger stark als „Intelligenz“.
- source_word: καὶ ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: und seine Antworten
  rationale: ἀπόκρισις bezeichnet im dialogischen Zusammenhang eine Antwort. Die Wiederholung des Possessivbezugs wird im Deutschen natürlich beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Zuhörten“ bildet den fortdauernden Charakter des griechischen Partizips ab; „staunten“ ist kräftig, aber natürlich.
