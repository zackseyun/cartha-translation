  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: de
  text: und war eine Witwe im Alter von vierundachtzig Jahren.[a] Sie wich nicht vom Tempel[b] und diente Gott Nacht und Tag mit Fasten und Bittgebeten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und war vierundachtzig Jahre lang Witwe“. Das Griechische kann entweder Hannas Lebensalter oder die Dauer ihres Witwenstands bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort bezeichnet hier die Tempelanlage mit ihren Höfen, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: c
    text: 'Oder: „flehentlichen Gebeten“ beziehungsweise „Bitten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: Witwe
  rationale: Die übliche Bezeichnung für eine Frau, deren Ehemann gestorben ist; hier setzt das Wort die Beschreibung von Hannas Leben nach ihrer siebenjährigen Ehe fort.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: bis sie vierundachtzig Jahre alt war
  rationale: Die knappe griechische Wendung kann Hannas Lebensalter oder die Dauer ihres Witwenstands angeben. Im Haupttext wird sie als Altersangabe wiedergegeben; die andere mögliche Deutung bleibt in einer Fußnote erhalten.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: verließ den Tempel nicht
  rationale: Der Imperfekt bezeichnet hier ein fortdauerndes beziehungsweise regelmäßiges Verhalten. Die Formulierung ist im Deutschen natürlich, ohne notwendig einen ausnahmslos ununterbrochenen Aufenthalt zu behaupten.
- source_word: ἱεροῦ
  choice: Tempel
  rationale: ἱερόν bezeichnet die gesamte Tempelanlage beziehungsweise ihre Höfe, nicht speziell das innere Heiligtum. Die geläufige Übersetzung „Tempel“ wird im Haupttext verwendet und in einer Fußnote präzisiert.
- source_word: νηστείαις
  choice: mit Fasten
  rationale: Der Dativ Plural beschreibt die wiederholte Praxis, die ihren Gottesdienst begleitete. Das deutsche Kollektiv „Fasten“ gibt dies natürlicher wieder als der ungebräuchliche Plural „Fastenzeiten“ oder „Fastenübungen“.
- source_word: δεήσεσιν
  choice: Bittgebeten
  rationale: δέησις bezeichnet besonders flehentliche Bitten oder Fürbitten. „Bittgebete“ wahrt diesen spezifischen Sinn und klingt zugleich in modernem Deutsch natürlich.
- source_word: λατρεύουσα
  choice: diente Gott
  rationale: Das Partizip bezeichnet religiösen Dienst beziehungsweise Verehrung. „Diente Gott“ bringt den kultisch-andächtigen Sinn idiomatisch zum Ausdruck; Gott ist als Empfänger dieses Dienstes aus dem religiösen Kontext erschlossen.
- source_word: νύκτα καὶ ἡμέραν
  choice: Nacht und Tag
  rationale: Die feste Wendung bezeichnet anhaltende, hingebungsvolle Praxis und bewahrt zugleich die griechische Reihenfolge.
theological_decisions:
- issue: Hannas Lebensalter oder Dauer ihres Witwenstands
  choice: Der Haupttext versteht die Wendung als Angabe, dass Hanna vierundachtzig Jahre alt war.
  alternative: Die Wendung kann bedeuten, dass Hanna vierundachtzig Jahre lang Witwe gewesen war.
  rationale: Die griechische Syntax lässt in Verbindung mit dem vorhergehenden Vers beide Deutungen zu. Da keine Lehrfrage die Entscheidung erzwingt, wird die alternative Lesart ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung des vorhergehenden Verses erkennbar. „Bittgebete“ wahrt die besondere Nuance von δεήσεις; die Tempelbezeichnung und die syntaktische Mehrdeutigkeit der Altersangabe werden durch Fußnoten präzisiert.
