revisions:
- from: und war dann Witwe, bis sie vierundachtzig Jahre alt war.[a] Sie verließ den Tempel[b] nicht, sondern diente Gott Nacht und Tag mit Fasten und Bittgebeten.[c]
  to: und war eine Witwe im Alter von vierundachtzig Jahren.[a] Sie wich nicht vom Tempel[b] und diente Gott Nacht und Tag mit Fasten und Bittgebeten.[c]
  rationale: Die Revision beseitigt den nicht im Griechischen ausgedrückten Gegensatz und formuliert die Alterslesart im modernen Deutsch eindeutig, ohne die syntaktisch mögliche Deutung einer 84-jährigen Witwenschaft zu unterschlagen. „Wich nicht vom Tempel“ bildet die andauernde Aussage von ἀφίστατο treffend ab.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:21:48Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird überwiegend getroffen, einschließlich der wichtigen Mehrdeutigkeit von Hannas Alter beziehungsweise der Dauer ihres Witwenstands. Doch „sondern“ macht aus dem griechischen mitlaufenden Partizip einen ausdrücklichen Gegensatz, der im Ausgangstext nicht vorliegt. „bis sie ... alt war“ klingt im Deutschen zudem so, als ende ihr Witwenstand mit dem 84. Lebensjahr.
  naturalness: Die Formulierung „und war dann Witwe“ ist als Versfortsetzung verständlich, aber wenig idiomatisch. „Sie wich nicht vom Tempel“ gibt den fortlaufenden bzw. gewohnheitsmäßigen Charakter des Imperfekts natürlicher wieder als „verließ den Tempel nicht“.
  terminology: „Tempel“ mit der Präzisierung zur Tempelanlage, „Fasten“ und „Bittgebete“ sind angemessen. „diente Gott“ ist für λατρεύουσα im Kontext eine tragfähige idiomatische Wiedergabe.
  issues:
  - severity: medium
    issue: Unbegründeter Gegensatz durch „sondern“
    rationale: λατρεύουσα ist ein prädikatives Partizip und beschreibt Hannas gleichzeitigen bzw. fortgesetzten Dienst. Es setzt nicht kontrastiv gegen das Nichtweichen vom Tempel ab.
  - severity: medium
    issue: Missverständliche zeitliche Formulierung der Altersangabe
    rationale: „bis sie vierundachtzig Jahre alt war“ kann im Deutschen nahelegen, sie sei nur bis zu diesem Alter Witwe gewesen. Die Hauptlesart soll ihr Alter bezeichnen; die alternative Dauerlesart bleibt in der Fußnote.
  revised_text: und war eine Witwe im Alter von vierundachtzig Jahren.[a] Sie wich nicht vom Tempel[b] und diente Gott Nacht und Tag mit Fasten und Bittgebeten.[c]
