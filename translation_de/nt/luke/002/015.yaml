  naturalness: „Von ihnen fort in den Himmel gegangen waren“ wirkt in modernem Standarddeutsch holprig. „Von ihnen fortgegangen und in den Himmel gegangen waren“ ist klarer, ohne einen im Griechischen nicht ausdrücklich formulierten Gedanken wie „zurückgekehrt“ hinzuzufügen. „Uns ansehen, was geschehen ist“ ist für den Zweck der Hirten natürlich und bewahrt die Aussage des griechischen ἴδωμεν.
  terminology: „Engel“, „Hirten“, „Himmel“ und „der Herr“ sind angemessen. „Der Herr“ wahrt die im Text bestehende referenzielle Offenheit. Die Fußnote soll als lexikalische Alternative an der Formulierung für ῥῆμα stehen und nicht durch die unnatürliche Haupttextformulierung „Geschehen“ erzwungen werden.
