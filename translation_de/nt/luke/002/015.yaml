source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: de
  text: 'Und es geschah: Als die Engel von ihnen fortgegangen und in den Himmel gegangen waren, sagten die Hirten zueinander: „Lasst uns nun bis nach Bethlehem gehen und uns ansehen, was geschehen ist[a], was der Herr uns bekannt gemacht hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Sache, die geschehen ist“; das griechische Wort ῥῆμα kann „Wort“, „Sache“ oder „Ereignis“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Und es geschah
  rationale: Bewahrt die für Lukas typische Erzählformel, ohne die altertümlichere Wendung „es begab sich“ zu verwenden.
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: Als die Engel von ihnen fort in den Himmel gegangen waren
  rationale: „Als“ gibt die zeitliche Funktion von ὡς wieder; das Plusquamperfekt kennzeichnet den Weggang als der Rede der Hirten vorausgehend. „Himmel“ bezeichnet hier im Kontext den himmlischen Bereich.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: sagten die Hirten zueinander
  rationale: Im Anschluss an die direkte Rede ist „sagten … zueinander“ die natürliche deutsche Wiedergabe; der Imperfekt muss hier nicht ausdrücklich durativ übersetzt werden.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Lasst uns nun bis nach Bethlehem gehen
  rationale: Der hortative Konjunktiv wird idiomatisch mit „Lasst uns“ wiedergegeben. „Nun“ vermittelt die antreibende Kraft von δὴ, und „bis nach Bethlehem“ bewahrt ἕως in natürlichem Deutsch.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: dieses Geschehen
  rationale: Im Zusammenhang verweist ῥῆμα auf das angekündigte Ereignis; „Geschehen“ gibt diesen Sinn knapp und natürlich wieder. Eine Fußnote bewahrt die weitere Bedeutungsbreite von ῥῆμα und die wörtlichere Ausdrucksweise.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: das der Herr uns bekannt gemacht hat
  rationale: „Bekannt gemacht“ entspricht ἐγνώρισεν, ohne den Ausdruck durch „offenbart“ theologischer zuzuspitzen. „Herr“ bewahrt die übliche und kontextuell offene Wiedergabe von κύριος.
theological_decisions:
- issue: Bezug von ὁ κύριος
  choice: der Herr
  alternative: Gott ausdrücklich als Referenten nennen
  rationale: Im unmittelbaren Zusammenhang ist Gott die Quelle der durch die Engel übermittelten Mitteilung. Die Wiedergabe „der Herr“ folgt jedoch dem griechischen Wortlaut und legt nicht enger fest, als der Text selbst es tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lukanische Erzählformel bleibt erkennbar; archaische Wendungen werden vermieden. Der Doppelpunkt gliedert die im Deutschen sonst schwerfällige Konstruktion, ohne die zeitliche Abfolge zu verändern.
