  source_fidelity: Der Entwurf gibt καὶ αὐτοὶ οὐ συνῆκαν sachgemäß als „Und sie verstanden nicht“ wieder. Die Relativkonstruktion „was er ihnen gesagt hatte“ bezieht sich klar auf τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς und bewahrt die Aussage, dass Jesu Eltern seine konkrete Äußerung nicht verstanden. Das deutsche Plusquamperfekt ist in diesem erzählerischen Zusammenhang idiomatisch und verändert den aoristischen Sinn nicht.
  naturalness: „Und sie verstanden nicht, was er ihnen gesagt hatte“ ist flüssiges, modernes Standarddeutsch und hat einen angemessen schlichten biblisch-erzählenden Registerton.
