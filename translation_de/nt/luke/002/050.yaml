  edition: SBLGNT
  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: de
  text: Und sie verstanden nicht, was er ihnen gesagt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sie verstanden das Wort nicht, das er zu ihnen gesprochen hatte.“ Das griechische Wort kann auch „Ausspruch“, „Aussage“ oder „Sache“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Anschluss wahrt den Erzählfluss, ohne einen im Griechischen nicht ausdrücklich markierten Gegensatz hinzuzufügen.
- source_word: αὐτοὶ
  choice: sie
  rationale: Das ausdrückliche Pronomen bezieht sich im Kontext auf Jesu Eltern. Eine Wiedergabe als „sie selbst“ wäre im modernen Deutschen unnötig betont.
- source_word: οὐ συνῆκαν
  choice: verstanden nicht
  rationale: συνίημι bezeichnet hier das Verstehen oder Begreifen. Die schlichte Formulierung gibt die Aussage direkt wieder, ohne sie zu „nicht völlig verstehen“ abzuschwächen.
- source_word: τὸ ῥῆμα
  choice: was
  rationale: ῥῆμα kann ein Wort, einen Ausspruch oder eine Sache bezeichnen. Die substantivierte Relativform „was er ihnen gesagt hatte“ klingt im Deutschen natürlich und bezieht sich eindeutig auf Jesu unmittelbar vorausgehende Äußerung; eine Fußnote bewahrt die lexikalische Spannweite.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: was er ihnen gesagt hatte
  rationale: λαλέω bedeutet „reden“ oder „sagen“. Das Plusquamperfekt macht im deutschen Erzählzusammenhang natürlich deutlich, dass Jesu Aussage dem Nichtverstehen vorausging, ohne den Sinn des griechischen Aorists zu verändern.
theological_decisions:
- issue: Reaktion der Eltern Jesu
  choice: Die Eltern verstanden Jesu Äußerung nicht.
  alternative: 'Sie verstanden sie nicht völlig; oder: Sie nahmen sie nicht an.'
  rationale: Der griechische Text spricht schlicht von fehlendem Verständnis, weder nur von unvollständigem Verständnis noch von Ablehnung. So bleibt die Spannung hinsichtlich Jesu Identität und Auftrag bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die natürliche Relativkonstruktion vermeidet das im Deutschen schwerfällige „die Aussage, die er zu ihnen gesprochen hatte“, während die Fußnote die Form und Bedeutungsbreite des griechischen Ausdrucks sichtbar hält.
