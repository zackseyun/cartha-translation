  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: de
  text: Und alle, die es hörten, staunten[a] über das, was ihnen von den Hirten gesagt worden war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: waren erstaunt.'
    reason: Lexikalische Alternative für ἐθαύμασαν.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die einfache erzählerische Verknüpfung mit dem vorhergehenden Vers.
- source_word: πάντες οἱ ἀκούσαντες
  choice: alle, die es hörten
  rationale: Das substantivierte Partizip bezeichnet sämtliche Hörenden. Das im Deutschen idiomatisch nötige Objekt „es“ nimmt den Bericht der Hirten aus dem Zusammenhang auf, ohne dessen Inhalt näher festzulegen.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: Gibt die Reaktion des Erstaunens natürlich und prägnant wieder, ohne Glauben, Unglauben oder bloße Neugier zu unterstellen.
- source_word: περὶ τῶν λαληθέντων
  choice: über das, was … gesagt worden war
  rationale: „Über“ gibt περί mit dem Genitiv als Bezugspunkt der Reaktion wieder; die passive Form und die Vorzeitigkeit des Gesagten bleiben erhalten.
- source_word: ὑπὸ τῶν ποιμένων
  choice: von den Hirten
  rationale: „Von“ bezeichnet in der deutschen Passivkonstruktion klar die im Griechischen durch ὑπό markierten Handelnden.
- source_word: πρὸς αὐτούς
  choice: ihnen
  rationale: Das Dativpronomen ist die natürliche deutsche Wiedergabe der Zielrichtung des Sprechens und lässt den Bezug wie im Griechischen bei den zuvor genannten Hörenden.
theological_decisions:
- issue: Art der durch ἐθαύμασαν bezeichneten Reaktion
  choice: „staunten“ bezeichnet eine offene Reaktion des Erstaunens.
  alternative: Die Hörenden kamen zum Glauben; oder sie reagierten lediglich neugierig.
  rationale: Der griechische Text beschreibt die Reaktion, sagt aber nicht, ob daraus Glaube entstand. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzschlussinterpunktion bleibt als Komma erhalten, weil der griechische Satz im folgenden Vers mit dem Gegensatz zu Maria weitergeführt wird.
