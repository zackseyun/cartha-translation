base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: de
  text: Und alle gingen, um sich registrieren zu lassen[a], jeder in seine eigene Stadt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um sich eintragen zu lassen“. Gemeint ist eine amtliche Erfassung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen die maskuline Einzahl: „jeder in seine eigene Stadt“. Im Deutschen ist auch möglich: „alle jeweils in ihre eigene Stadt“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: machten sich auf den Weg
  rationale: Das Imperfekt bezeichnet die im Gang befindliche Bewegung vieler Einzelner. Die idiomatische Wendung gibt diesen erzählerischen Verlauf natürlicher wieder als ein schlichtes „gingen“.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ entspricht dem substantivisch gebrauchten Plural direkt und lässt sich im Deutschen natürlich mit dem pluralischen Verb verbinden.
- source_word: ἀπογράφεσθαι
  choice: sich registrieren zu lassen
  rationale: Der Infinitiv bezeichnet im Zusammenhang der Erfassung eine amtliche Registrierung. Die Formulierung wahrt, dass die Personen registriert werden, ohne den Vorgang unnötig als bloßes Zählen festzulegen.
- source_word: ἕκαστος
  choice: jeder
  rationale: „Jeder“ bewahrt die distributive Einzahl und hebt hervor, dass die allgemeine Bewegung für jede einzelne Person galt.
- source_word: ἑαυτοῦ
  choice: seine eigene
  rationale: Das Reflexivpronomen bezieht sich auf das maskuline Singularwort „jeder“. „Seine eigene“ bildet sowohl diesen Bezug als auch die verstärkende Eigenzuordnung ab.
- source_word: πόλιν
  choice: Stadt
  rationale: „Stadt“ ist die direkte, übliche Entsprechung von πόλις. „Heimatstadt“ oder „Stadt seiner Vorfahren“ würde eine im Vers nicht ausdrücklich genannte Deutung hinzufügen.
theological_decisions:
- issue: Maskuliner distributiver Ausdruck ἕκαστος … ἑαυτοῦ
  choice: „jeder in seine eigene Stadt“
  alternative: „alle jeweils in ihre eigene Stadt“
  rationale: Die gewählte Fassung erhält die grammatische Einzahl und den maskulinen Bezug des griechischen Ausdrucks. Die Alternative wäre im heutigen Deutsch ebenfalls möglich, würde aber die Singularstruktur einebnen.
- issue: Bedeutung von πόλις im Zusammenhang der Registrierung
  choice: „Stadt“ ohne nähere Bestimmung
  alternative: „Heimatstadt“ oder „Stadt seiner Vorfahren“
  rationale: Der griechische Text nennt lediglich die jeweils eigene Stadt. Welche Art von Zugehörigkeit damit gemeint ist, ergibt sich aus dem weiteren Erzählzusammenhang und soll hier nicht vorwegnehmend festgelegt werden.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. „Sich auf den Weg machen“ bildet den fortlaufenden Charakter des Imperfekts idiomatisch ab; „registrieren“ ist im amtlichen Zusammenhang klarer als das heute missverständliche „sich einschreiben“.
