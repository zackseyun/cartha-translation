  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: de
  text: 'wie im Gesetz des Herrn geschrieben steht: »Jedes männliche Kind, das den Mutterleib öffnet, soll dem Herrn heilig genannt werden«[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung bezeichnet den männlichen Erstgeborenen, der als dem Herrn heilig beziehungsweise für ihn ausgesondert gilt (vgl. 2. Mose 13,2.12).
    reason: idiom_explanation_and_cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: wie … geschrieben steht
  rationale: Die geläufige deutsche Schriftzitat-Formel gibt den bleibenden Geltungsanspruch des griechischen Perfekts natürlich wieder.
- source_word: ἐν νόμῳ κυρίου
  choice: im Gesetz des Herrn
  rationale: Bezeichnet das mosaische Gesetz als schriftliche Autorität; »Herr« folgt dem griechischen κύριος.
- source_word: ὅτι
  choice: ':'
  rationale: Ein Doppelpunkt leitet das folgende Zitat im modernen Deutschen natürlicher ein als ein ausdrücklich wiedergegebenes »dass«.
- source_word: Πᾶν ἄρσεν διανοῖγον μήτραν
  choice: Jede männliche Erstgeburt
  rationale: Die griechische Wendung bezeichnet idiomatisch das männliche Kind, das als erstes den Mutterschoß öffnet. »Männliche Erstgeburt« ist knapp, verständlich und sachlich genau; die bildhafte Form bleibt in der Fußnote sichtbar.
- source_word: ἅγιον τῷ κυρίῳ
  choice: dem Herrn heilig
  rationale: Bewahrt ausdrücklich die Heiligkeitssprache und gibt den Dativ der Zuordnung beziehungsweise Weihe wieder, ohne ihn durch »geweiht« zu ersetzen.
- source_word: κληθήσεται
  choice: soll … genannt werden
  rationale: Gibt das Futur Passiv innerhalb einer gesetzlichen Schriftanführung würdig und idiomatisch wieder, ohne das Benennen als bloßes Sein aufzulösen.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Zitat aus dem Gesetz Israels
  choice: Herr
  alternative: HERR
  rationale: Der unmittelbare Ausgangstext ist griechisch und hat κύριος. »Herr« bewahrt diese Textgestalt, auch wenn der alttestamentliche Hintergrund mit dem Gottesnamen verbunden ist.
- issue: Heiligkeit oder deutende Weihesprache
  choice: dem Herrn heilig genannt werden
  alternative: dem Herrn geweiht sein
  rationale: ἅγιον und κληθήσεται werden ausdrücklich wiedergegeben. So bleibt offen sichtbar, dass der Text vom Heiliggenanntwerden spricht, während die sachliche Bedeutung der Aussonderung für Gott nicht an die Stelle des Wortlauts tritt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt markiert die Schriftanführung klar. »Erstgeburt« vermeidet die im Deutschen schwerfällige wörtliche Wendung im Haupttext; diese wird in der Fußnote dokumentiert. Das Satzschlusszeichen folgt der Einbettung in den fortlaufenden Satz von Lukas 2.
