id: LUK.2.20
reference: Luke 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: de
  text: Und die Hirten kehrten zurück und verherrlichten und lobten Gott für alles, was sie gehört und gesehen hatten, genauso wie es ihnen gesagt worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: kehrten zurück
  rationale: Das Verb bezeichnet hier die Rückkehr der Hirten von ihrem Besuch; „kehrten zurück“ ist natürlich und gibt den Aorist erzählerisch wieder.
- source_word: οἱ ποιμένες
  choice: die Hirten
  rationale: Die übliche und kontextuell eindeutige Wiedergabe der bereits zuvor eingeführten Personen.
- source_word: δοξάζοντες
  choice: verherrlichten
  rationale: Das begleitende Partizip bezeichnet eine während der Rückkehr fortdauernde Handlung und bewahrt die Verbindung zum Begriff der Herrlichkeit.
- source_word: αἰνοῦντες
  choice: lobten
  rationale: „Lobten“ gibt das zweite Partizip knapp und idiomatisch wieder, ohne es mit „verherrlichten“ zusammenzuziehen.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Direktes Objekt beider Partizipien; im Deutschen steht der Gottesname hier natürlich ohne Artikel.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: für alles, was
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise Grund ihres Lobes; „für alles, was“ ist im Deutschen natürlich und lässt die leichte semantische Weite der Präposition bestehen.
- source_word: ἤκουσαν καὶ εἶδον
  choice: sie gehört und gesehen hatten
  rationale: Das Plusquamperfekt macht im Deutschen die zeitliche Vorordnung gegenüber Rückkehr und Lob deutlich, ohne den Sinn der griechischen Aoriste zu verändern.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: genauso wie es ihnen gesagt worden war
  rationale: Die unpersönliche Passivform lässt den Sprecher wie im Griechischen unausgesprochen; „genauso wie“ bewahrt den Vergleichssinn von καθώς.
theological_decisions:
- issue: Ob der Sprecher der vorherigen Botschaft ausdrücklich als Engel benannt werden soll
  choice: Die Passivform „wie es ihnen gesagt worden war“ lässt den Handelnden unausgesprochen.
  alternative: „wie der Engel es ihnen gesagt hatte“
  rationale: Obwohl der Zusammenhang auf die Engelsbotschaft verweist, nennt der griechische Satz den Sprecher nicht ausdrücklich. Die Übersetzung vermeidet daher eine verdeutlichende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Ausdrücke „verherrlichten“ und „lobten“ bleiben als bewusstes Begriffspaar erhalten. Keine Fußnote ist nötig, da die wesentlichen Nuancen im Haupttext natürlich und quellennah wiedergegeben werden.
