  source_fidelity: Die Übersetzung gibt den narrativen Aorist von ὑπέστρεψαν, die beiden begleitenden Partizipien δοξάζοντες und αἰνοῦντες sowie den Anlass des Gotteslobes zutreffend wieder. Das Plusquamperfekt bei „gehört und gesehen hatten“ ist eine im Deutschen natürliche narrative Einordnung und legt keine unzulässige zusätzliche Aussage fest. Die unpersönliche Passivform in „wie es ihnen gesagt worden war“ bewahrt angemessen, dass der Sprecher bei ἐλαλήθη πρὸς αὐτούς nicht genannt wird.
  naturalness: Modernes, verständliches und würdevolles Standarddeutsch. „Verherrlichten und lobten Gott“ ist als bewusst zweigliedrige Wiedergabe idiomatisch und dem Register angemessen. Der Satz ist flüssig und korrekt gebaut.
  terminology: „Hirten“, „Gott“, „verherrlichten“ und „lobten“ sind kontextgerecht und halten die beiden griechischen Lobbegriffe unterscheidbar. Es werden weder Engel noch sonstige implizite Akteure ergänzend in den Text eingetragen.
