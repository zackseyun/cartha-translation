id: LUK.2.1
reference: Luke 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: de
  text: In jenen Tagen geschah es, dass von Kaiser Augustus ein Erlass ausging, wonach die ganze bewohnte Welt[a] registriert werden sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze römische Welt“ oder „das ganze Reich“. Der griechische Ausdruck bezeichnet häufig die bewohnte Welt, wie sie im Rahmen des Römischen Reiches verstanden wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es
  rationale: Die erzählerische Übergangsformel wird in natürlichem, würdigem Deutsch wiedergegeben. δὲ bleibt als schwacher Fortgangsmarker unübersetzt, da der Zusammenhang den Übergang trägt.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: in jenen Tagen
  rationale: Entspricht der griechischen Zeitangabe eng und ist im Deutschen idiomatisch.
- source_word: ἐξῆλθεν δόγμα
  choice: ein Erlass … ausging
  rationale: Bewahrt sowohl den amtlichen Sinn von δόγμα als auch die Bewegungsmetapher von ἐξῆλθεν, ohne altertümlich zu klingen.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: von Kaiser Augustus
  rationale: παρά mit Genitiv bezeichnet hier die Quelle beziehungsweise den Urheber des Erlasses.
- source_word: ἀπογράφεσθαι
  choice: solle registriert werden
  rationale: Bezeichnet eine amtliche Erfassung; „registriert“ vermeidet es, bereits im Haupttext eine Volkszählung oder Besteuerung als genaueren Zweck festzulegen.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: die ganze bewohnte Welt
  rationale: Gibt den Grundsinn von οἰκουμένη wieder und bewahrt zugleich die mögliche kontextuelle Begrenzung auf die römische Welt für die Fußnote.
theological_decisions:
- issue: Umfang von οἰκουμένη
  choice: die ganze bewohnte Welt
  alternative: die ganze römische Welt; das ganze Reich
  rationale: Die Formulierung wahrt den lexikalischen Grundsinn, ohne den historisch-römischen Bezugsrahmen im Haupttext zwingend festzuschreiben. Die kontextuell naheliegenden engeren Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Erlass“ und „registriert“ sind allgemein verständlich und zugleich für den amtlichen Zusammenhang passend; unnötig altertümliche Wendungen wurden vermieden.
