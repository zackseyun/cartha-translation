id: LUK.2.33
reference: Luke 2:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: de
  text: Und sein Vater und seine Mutter staunten über das, was über ihn gesagt wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „sein Vater“. Gemeint ist Josef im gewöhnlichen familiären und rechtlichen Sinn. Manche Übersetzungen lesen „Josef und seine Mutter“, um angesichts der zuvor berichteten jungfräulichen Empfängnis Jesu ein Missverständnis zu vermeiden.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: sein Vater
  rationale: Die griechische Formulierung bezeichnet Joseph im gewöhnlichen familiären und rechtlichen Sinn als Jesu Vater. Sie wird nicht harmonisierend durch „Josef“ ersetzt.
- source_word: μήτηρ
  choice: seine Mutter
  rationale: Natürliche und genaue Wiedergabe von μήτηρ innerhalb des verbundenen Ausdrucks „sein Vater und seine Mutter“.
- source_word: ἦν … θαυμάζοντες
  choice: staunten
  rationale: Die periphrastische Imperfektkonstruktion beschreibt ihr anhaltendes Staunen in der erzählten Vergangenheit. Das deutsche Präteritum gibt dies hier natürlich wieder.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: über das, was … gesagt wurde
  rationale: Die substantivierte passive Partizipialkonstruktion bezeichnet den Inhalt der Äußerungen. „Über das, was gesagt wurde“ ist im Deutschen natürlich und bewahrt das Passiv.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: Kontextgemäße Wiedergabe von περί mit Genitiv; sie bezeichnet Jesus als Gegenstand der Äußerungen.
theological_decisions:
- issue: Bezeichnung Josefs als „sein Vater“ trotz der zuvor berichteten jungfräulichen Empfängnis Jesu
  choice: Die griechische Lesart wird im Haupttext direkt mit „sein Vater“ wiedergegeben und in einer Fußnote erläutert.
  alternative: „Josef und seine Mutter“ oder eine erklärende Erweiterung im Haupttext
  rationale: Die Übersetzung soll die echte Formulierung und Spannung des griechischen Textes bewahren. Im erzählerischen Zusammenhang kann Josef im gewöhnlichen familiären und rechtlichen Sinn als Jesu Vater bezeichnet werden, ohne die zuvor berichtete jungfräuliche Empfängnis zu verneinen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Staunten“ ist natürlicher als „verwunderten sich“, während die Wortstellung und die passive Aussage eng am griechischen Text bleiben.
