source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: de
  text: 'Und plötzlich war zusammen mit dem Engel eine große Schar des himmlischen Heeres[a]; sie lobten Gott und sprachen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Schar des Heeres des Himmels“ oder „eine große Schar von Himmels Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: plötzlich
  rationale: Gibt die unvermittelte Wendung und den Überraschungseffekt der Erzählung natürlich und genau wieder.
- source_word: ἐγένετο
  choice: war
  rationale: In dieser existenziellen Konstruktion bezeichnet γίνομαι das Eintreten beziehungsweise Vorhandensein der Schar, ohne ausdrücklich festzulegen, dass sie sichtbar erschien.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: bei dem Engel
  rationale: Gibt die durch σύν bezeichnete Begleitung in natürlichem modernem Deutsch wieder; „zusammen mit dem Engel“ wäre ebenfalls möglich, aber schwerfälliger.
- source_word: πλῆθος
  choice: eine große Schar
  rationale: Bringt die große Anzahl zum Ausdruck und passt zugleich zu einer geordneten himmlischen Versammlung; „Menge“ wäre wörtlicher, klingt hier aber weniger würdevoll und weniger natürlich.
- source_word: στρατιᾶς οὐρανίου
  choice: des himmlischen Heeres
  rationale: Bewahrt sowohl den himmlischen Bezug als auch die militärische Bildsprache von στρατιά, ohne die Gruppe lediglich als Engelmenge zu verallgemeinern.
- source_word: αἰνούντων τὸν θεόν
  choice: sie lobten Gott
  rationale: Gibt das gegenwärtige Partizip als begleitende Handlung wieder. Das pluralische „sie“ entspricht den griechischen Pluralpartizipien und bezieht sich sinngemäß auf die vielen Angehörigen der Schar.
- source_word: καὶ λεγόντων
  choice: und sprachen
  rationale: Leitet die im folgenden Vers wiedergegebenen Worte ein und wahrt parallel zu „lobten“ den pluralischen Bezug.
theological_decisions:
- issue: Wiedergabe von στρατιᾶς οὐρανίου
  choice: des himmlischen Heeres
  alternative: der Armee des Himmels
  rationale: „Himmlisches Heer“ erhält die Vorstellung einer geordneten, Gott dienenden Streitmacht, ohne den Kontext des Gotteslobs unnötig kämpferisch auszudeuten.
- issue: Numerus bei αἰνούντων und λεγόντων
  choice: sie lobten Gott und sprachen
  alternative: die Gott lobte und sprach
  rationale: Obwohl „Schar“ im Deutschen grammatisch Singular ist, stehen beide griechischen Partizipien im Plural und beziehen sich auf die vielen Angehörigen des himmlischen Heeres. Ein neuer Satzanschluss mit pluralischem „sie“ bewahrt diese Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Himmlisches Heer“ bewahrt die traditionelle biblische Bildsprache, bleibt aber allgemein verständlich. Der Doppelpunkt bereitet die folgende direkte Rede vor.
