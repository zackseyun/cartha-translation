    issue: Textkritisch unsichere Wortgruppe nicht markiert
    rationale: πληρούμενον σοφίᾳ ist im bereitgestellten SBLGNT-Text eingeklammert. Diese editorische Unsicherheit soll nicht im unkommentierten deutschen Text unsichtbar werden.
  - severity: low
    issue: »ruhte auf ihm« ergänzt ein im Griechischen nicht ausgedrücktes Bild
    rationale: ἦν ἐπ’ αὐτό lautet wörtlich »war auf ihm«. »Ruhte« ist als Deutung möglich, aber weniger formnah als die einfache Aussage des Grundtexts.
  revised_text: Das Kind aber wuchs heran und wurde stark, erfüllt mit Weisheit[a], und Gottes Gnade war auf ihm.
