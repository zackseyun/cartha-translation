  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: de
  text: Das Kind aber wuchs heran und wurde stark, erfüllt mit Weisheit[a], und Gottes Gnade war auf ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter »erfüllt mit Weisheit« stehen im griechischen Text der SBLGNT-Ausgabe in eckigen Klammern und sind textkritisch unsicher.
    reason: textual_uncertainty
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Das Kind aber
  rationale: παιδίον bezeichnet hier im Zusammenhang der Kindheitsgeschichte das Kind; δέ setzt den Bericht leicht fort und wird natürlich mit »aber« wiedergegeben.
- source_word: ηὔξανεν
  choice: wuchs heran
  rationale: Der Imperfekt beschreibt das fortschreitende körperliche Heranwachsen; »wuchs heran« ist im Deutschen natürlich und wahrt den Verlauf.
- source_word: ἐκραταιοῦτο
  choice: wurde stark
  rationale: Die Imperfektform bezeichnet eine fortschreitende Stärkung. »Wurde stark« gibt diese Entwicklung knapp und verständlich wieder, ohne festzulegen, ob ausschließlich körperliche Stärke gemeint ist.
- source_word: πληρούμενον σοφίᾳ
  choice: erfüllt mit Weisheit
  rationale: Das Präsenspartizip beschreibt einen das Heranwachsen begleitenden Vorgang beziehungsweise Zustand; σοφίᾳ bezeichnet den Inhalt der Erfüllung. Die knappe deutsche Partizipialfügung bewahrt diesen Zusammenhang.
- source_word: χάρις θεοῦ
  choice: Gottes Gnade
  rationale: χάρις kann Gnade, Gunst oder Wohlwollen bedeuten. »Gottes Gnade« ist im Deutschen an dieser Stelle idiomatisch, würdevoll und lässt die volle Bedeutungsbreite eher offen als das enger wirkende »Gunst«.
- source_word: ἦν ἐπ’ αὐτό
  choice: ruhte auf ihm
  rationale: Die Wendung bezeichnet Gottes bleibende gnädige Zuwendung zu dem Kind. »Ruhte auf ihm« gibt das Bild im natürlichen biblischen Deutsch wieder, auch wenn das Verb »ruhen« im Griechischen nicht ausdrücklich steht.
theological_decisions:
- issue: χάρις θεοῦ im Zusammenhang mit dem Heranwachsen Jesu
  choice: Gottes Gnade ruhte auf ihm
  alternative: Gottes Gunst war auf ihm
  rationale: Die Übersetzung wahrt die Aussage von Gottes gnädiger Zuwendung, ohne aus dem Vers Folgerungen über ein vermeintliches Defizit Jesu abzuleiten. Das mehrdeutige χάρις wird nicht christologisch verengt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Reihung des griechischen Satzes bleibt erhalten; unnötige theologische Explikation wird vermieden.
