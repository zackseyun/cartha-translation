  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: de
  text: um sich mit Maria registrieren zu lassen, die mit ihm verlobt[a] war und schwanger[b] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein formelles Verlöbnis, das rechtlich und sozial verbindlicher war als eine heutige Verlobung.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ein Kind erwartete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: sich registrieren zu lassen
  rationale: Der Infinitiv bezeichnet im Zusammenhang der Erfassung den Zweck der Reise. Die Formulierung ist im modernen Verwaltungsdeutsch natürlich und gibt den medialen Sinn angemessen wieder.
- source_word: σὺν
  choice: zusammen mit
  rationale: Gibt die Begleitung ausdrücklich und idiomatisch wieder.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: die mit ihm verlobt war
  rationale: Das Perfektpartizip bezeichnet ein bereits bestehendes, formell begründetes Verlöbnis. „Verlobt“ ist im Deutschen verständlich; die Fußnote erläutert, dass die damalige Bindung rechtlich und sozial stärker war als eine heutige Verlobung.
- source_word: οὔσῃ ἐγκύῳ
  choice: und schwanger war
  rationale: Gibt Marias damaligen Zustand klar, natürlich und ohne altertümliche Ausdrucksweise wieder.
theological_decisions:
- issue: Marias Beziehungsstatus gegenüber Josef
  choice: mit ihm verlobt
  alternative: seine Frau
  rationale: Der griechische Text nennt ausdrücklich ein formelles Verlöbnis. „Seine Frau“ würde einen stärkeren beziehungsweise anders bezeichneten Ehestatus in diesen Satz hineintragen, während „verlobt“ mit erläuternder Fußnote die historische Spannung wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform schließt als Zweckangabe an den vorhergehenden Vers an. „Sich registrieren zu lassen“ ist verständlicher als das mögliche, aber weniger idiomatische „sich einschreiben zu lassen“.
