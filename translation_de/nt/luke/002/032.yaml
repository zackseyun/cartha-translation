  variant: modern standard German
source:
  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: de
  text: ein Licht zur Offenbarung für die Völker[a] und zur Herrlichkeit deines Volkes Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Nichtjuden“. Das griechische Wort bedeutet allgemein „Völker“, bezeichnet hier im Gegenüber zu Israel aber wahrscheinlich die nichtjüdischen Völker.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: φῶς
  choice: ein Licht
  rationale: Die artikellose griechische Nominalphrase wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben und setzt die poetische Beschreibung des Kindes fort.
- source_word: εἰς ἀποκάλυψιν
  choice: zur Offenbarung
  rationale: Die Wendung bewahrt knapp den Ziel- bzw. Ergebnissinn von εἰς und den Gedanken des Sichtbar- oder Bekanntmachens in ἀποκάλυψις.
- source_word: ἐθνῶν
  choice: für die Völker
  rationale: „Völker“ gibt die Grundbedeutung des griechischen Wortes wieder. Im Gegenüber zu Israel sind hier besonders die nichtjüdischen Völker gemeint; die Fußnote macht diese kontextuelle Bedeutung ausdrücklich.
- source_word: καὶ δόξαν
  choice: und zur Herrlichkeit
  rationale: Die Ergänzung von „zur“ bildet den Parallelismus mit „zur Offenbarung“ im Deutschen deutlich ab. „Herrlichkeit“ bewahrt sowohl den Gedanken von Ehre als auch den biblischen Klang von δόξα.
- source_word: λαοῦ σου Ἰσραήλ
  choice: deines Volkes Israel
  rationale: 'Die Formulierung gibt die Genitivverbindung und die appositionelle Bestimmung wieder: Israel ist Gottes Volk.'
theological_decisions:
- issue: Bedeutung von ἐθνῶν im Gegenüber zu Israel
  choice: die Völker
  alternative: die Nichtjuden
  rationale: Der Ausgangstext bezeichnet grundsätzlich Völker bzw. Nationen, während der unmittelbare Kontrast mit Israel die nichtjüdischen Völker in den Blick rückt. Der Haupttext bewahrt die lexikalische Weite; die Fußnote erläutert die kontextuelle Zuspitzung.
- issue: Bezug von Herrlichkeit auf Israel
  choice: zur Herrlichkeit deines Volkes Israel
  alternative: als Herrlichkeit für dein Volk Israel
  rationale: Die knappe Genitivkonstruktion des Griechischen bleibt erhalten, ohne genauer festzulegen, auf welche Weise das Kind Israels Herrlichkeit ist oder bringt.
translation_notes:
  register: Poetisch, knapp und würdevoll; als Fortsetzung des Satzes aus dem vorangehenden Vers beginnt der Text kleingeschrieben. Der Parallelismus der beiden mit εἰς verbundenen Glieder wird durch „zur … und zur …“ hörbar gemacht.
