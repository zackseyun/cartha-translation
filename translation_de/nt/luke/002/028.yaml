  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: de
  text: 'Und er nahm ihn in seine Arme, pries Gott und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: nahm
  rationale: δέχομαι bedeutet grundsätzlich „empfangen“ oder „aufnehmen“. Zusammen mit εἰς τὰς ἀγκάλας bezeichnet es hier natürlich den körperlichen Vorgang, das Kind auf die Arme zu nehmen.
- source_word: αὐτό
  choice: es
  rationale: Das Neutrum bezieht sich auf das ebenfalls grammatisch neutrale „Kind“ (παιδίον) im Kontext. Anders als im Englischen ist der neutrale Rückbezug im Deutschen natürlich und nicht entpersonalisierend.
- source_word: εἰς τὰς ἀγκάλας
  choice: auf die Arme
  rationale: Die Wendung bezeichnet die Arme als Ort des Haltens oder Umarmens. „Auf die Arme nehmen“ ist im modernen Deutschen idiomatisch; ein Possessivpronomen ist nicht nötig.
- source_word: εὐλόγησεν τὸν θεόν
  choice: pries Gott
  rationale: Wenn εὐλογέω Gott zum Objekt hat, meint es, ihn lobend zu preisen. „Segnete Gott“ wäre zwar formnäher, klingt im heutigen Deutschen jedoch leicht so, als würde ein Mensch Gott Segen zusprechen.
- source_word: καὶ εἶπεν
  choice: 'und sagte:'
  rationale: Die schlichte Fortführung der Erzählung wird direkt wiedergegeben; der Doppelpunkt leitet die folgende Rede ein.
- source_word: αὐτός
  choice: er
  rationale: Das selbständige Pronomen bezeichnet Simeon als handelndes Subjekt. „Er selbst“ würde die leichte Hervorhebung im Deutschen unnötig verstärken.
theological_decisions:
- issue: Bezug des neutralen Pronomens αὐτό
  choice: „es“ als grammatisch natürlicher Rückbezug auf „das Kind“
  alternative: „ihn“ als ausdrücklich personale Wiedergabe mit Bezug auf Jesus
  rationale: Im Deutschen kann ein Kind aufgrund des grammatischen Geschlechts natürlich mit „es“ wiederaufgenommen werden, ohne seine Personalität zu bestreiten. So bleibt zugleich die Form des griechischen Pronomens gewahrt.
- issue: Wiedergabe von εὐλογέω mit Gott als Objekt
  choice: „pries Gott“
  alternative: „segnete Gott“
  rationale: „Pries Gott“ gibt die Handlung im Deutschen eindeutig als Lobpreis wieder und vermeidet die mögliche Vorstellung, Simeon habe Gott Segen verliehen. Die theologische Aussage bleibt, dass Simeon Gott lobend anredet.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die idiomatische Verbindung „auf die Arme nehmen“ und „Gott preisen“ vermeidet unnatürliche Bibelsprache, bleibt aber eng am griechischen Satz.
