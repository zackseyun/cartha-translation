  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: de
  text: Und sie gebar ihren erstgeborenen Sohn, wickelte ihn in Tücher[a] und legte ihn in eine Futterkrippe[b], weil im Gästezimmer[c] kein Platz für sie war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wickelte ihn in Windeln“. Das griechische Verb bezeichnet das Einwickeln eines Säuglings in Tücher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Krippe“ beziehungsweise „Futtertrog“. Das griechische Wort bezeichnet einen Futterplatz oder Futtertrog für Tiere.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „Herberge“. Das griechische κατάλυμα kann ein Gästezimmer oder einen Unterkunftsraum bezeichnen; für ein kommerzielles Gasthaus verwendet Lukas in Lukas 10,34 ein anderes Wort.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: gebar
  rationale: „Gebar“ ist die präzise und im Deutschen weiterhin natürliche Bezeichnung für das Zur-Welt-Bringen eines Kindes.
- source_word: πρωτότοκον
  choice: erstgeborenen
  rationale: Gibt die Geburtsreihenfolge wieder, ohne über den unmittelbaren Erzählzusammenhang hinausgehende theologische Folgerungen einzutragen.
- source_word: ἐσπαργάνωσεν
  choice: wickelte ihn in Windeln
  rationale: Das Verb bezeichnet das Einwickeln eines Säuglings in Tücher; „in Windeln wickeln“ ist im modernen Deutsch klar und idiomatisch.
- source_word: ἀνέκλινεν
  choice: legte ihn
  rationale: Im Zusammenhang mit einem Säugling bezeichnet das Verb ein Niederlegen; „legte“ ist natürlich und präzise.
- source_word: φάτνῃ
  choice: Futterkrippe
  rationale: Das Wort bezeichnet einen Futterplatz beziehungsweise Futtertrog für Tiere. „Futterkrippe“ macht diesen konkreten Sinn deutlich und bewahrt zugleich die vertraute Bildsprache.
- source_word: τόπος
  choice: Platz
  rationale: „Platz“ gibt die räumliche Bedeutung hier idiomatisch wieder.
- source_word: καταλύματι
  choice: Gästezimmer
  rationale: κατάλυμα kann einen Unterkunfts- oder Gästeraum bezeichnen. Lukas verwendet für ein kommerzielles Gasthaus in Lukas 10,34 ein anderes Wort und gebraucht κατάλυμα in Lukas 22,11 für ein Gästezimmer.
theological_decisions:
- issue: Ob κατάλυμα traditionell als „Herberge“ oder als Gästeraum wiederzugeben ist
  choice: Gästezimmer
  alternative: Herberge; Unterkunft
  rationale: Der griechische Ausdruck verlangt kein kommerzielles Gasthaus. „Gästezimmer“ entspricht dem lukanischen Sprachgebrauch und vermeidet es, eine vom Text nicht geforderte traditionelle Szenerie festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die vertrauten Begriffe „Windeln“ und „Krippe“ bleiben erkennbar, während „Futterkrippe“ den konkreten Sachbezug verdeutlicht. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
