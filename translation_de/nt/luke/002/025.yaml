  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: de
  text: Und siehe, in Jerusalem war ein Mann namens Simeon. Dieser Mann war gerecht und gottesfürchtig; er wartete auf den Trost Israels[a], und der Heilige Geist war auf ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Israels erhoffter Trost durch Gott und damit seine Wiederherstellung.
    reason: lexical_clarification
  - marker: b
    text: Das Griechische hat hier keinen Artikel vor „heiliger Geist“; daher ist auch eine Wiedergabe wie „ein heiliger Geist“ formal möglich. Im Zusammenhang bei Lukas ist jedoch am ehesten der Heilige Geist gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Das einleitende „siehe“ bewahrt Lukas’ Signal für eine bedeutsame neue Szene. Es ist gehoben, aber im heutigen biblischen Erzählstil weiterhin verständlich.
- source_word: ἄνθρωπος
  choice: Mann
  rationale: Da ausdrücklich der männliche Einzelne Simeon gemeint ist, gibt „Mann“ den Bezug präzise wieder.
- source_word: ᾧ ὄνομα Συμεών
  choice: namens Simeon
  rationale: Die knappe deutsche Wendung gibt die griechische Namensangabe natürlich und vollständig wieder.
- source_word: δίκαιος
  choice: gerecht
  rationale: „Gerecht“ wahrt sowohl die moralische als auch die biblisch-bundestheologische Bedeutungsbreite.
- source_word: εὐλαβής
  choice: gottesfürchtig
  rationale: Das Wort bezeichnet ehrfürchtige, gewissenhafte Frömmigkeit. „Gottesfürchtig“ ist im Kontext klarer und gehaltvoller als das heute teils missverständliche „fromm“.
- source_word: προσδεχόμενος
  choice: er wartete auf
  rationale: Das Partizip beschreibt Simeons anhaltendes, erwartungsvolles Warten. Ein finites Verb ergibt einen natürlichen deutschen Satz.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: den Trost Israels
  rationale: „Trost“ bewahrt den Anklang an Israels erhofften göttlichen Trost und seine Wiederherstellung, ohne den Ausdruck auf bloßes persönliches Getröstetwerden zu verengen.
- source_word: πνεῦμα ἅγιον
  choice: der Heilige Geist
  rationale: Obwohl im Griechischen kein Artikel steht, bezeichnet die Wendung im unmittelbaren lukanischen Zusammenhang am natürlichsten den Heiligen Geist.
- source_word: ἐπ’ αὐτόν
  choice: ruhte auf ihm
  rationale: Diese idiomatische deutsche Formulierung gibt die bleibende Gegenwart des Geistes wieder. Das wörtlichere „war auf ihm“ wäre im modernen Deutsch unnatürlich.
theological_decisions:
- issue: Bezug von πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: der Heilige Geist ruhte auf ihm
  alternative: ein heiliger Geist war auf ihm
  rationale: Der fehlende griechische Artikel lässt isoliert eine unbestimmte Wiedergabe formal zu. Lukas’ Sprachgebrauch und der unmittelbare Kontext in den Versen 26–27 sprechen jedoch deutlich für den Heiligen Geist; die alternative grammatische Möglichkeit wird in einer Fußnote offengelegt.
- issue: Bedeutung von παράκλησις τοῦ Ἰσραήλ
  choice: der Trost Israels
  alternative: die Tröstung Israels
  rationale: „Trost Israels“ lässt offen, wie genau der verheißene göttliche Trost und die Wiederherstellung verwirklicht werden, und wahrt so die heilsgeschichtliche Spannung des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Erzählton. „Und siehe“ bewahrt den markanten Szenenauftakt; ansonsten sind Syntax und Wortwahl bewusst natürlich und allgemein verständlich.
