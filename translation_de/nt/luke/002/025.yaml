  rationale: Die einzige Änderung im Vers ersetzt „ruhte auf ihm“ durch „war auf ihm“, um das einfache griechische Prädikat ἦν ohne zusätzliche Bedeutungsnuance wiederzugeben. Die Fußnote zum Heiligen Geist wird vorsichtiger formuliert, damit die anarthrose griechische Form weder überinterpretiert noch die im Kontext naheliegende Lesart verschleiert wird.
