id: LUK.2.34
reference: Luke 2:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: de
  text: 'Und Simeon segnete sie und sagte zu Maria, seiner Mutter: »Sieh, dieser ist zum Fall und zum Aufstehen vieler in Israel bestimmt und zu einem Zeichen, dem widersprochen wird.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gegen das gesprochen wird.'
    reason: Die Alternative macht die wörtliche Sprachkomponente von ἀντιλέγω sichtbar; gemeint ist aktiver Widerspruch gegen das Zeichen.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: segnete
  rationale: Die übliche und hier kontextgerechte Wiedergabe von εὐλογέω; das Objekt αὐτούς wird mit »sie« bewahrt.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Eine natürliche moderne Aufforderung, aufmerksam zu werden; weniger altertümlich als »Siehe«.
- source_word: οὗτος
  choice: dieser
  rationale: Bewahrt den demonstrativen Verweis Simeons auf das Kind, ohne den Namen erklärend einzusetzen.
- source_word: κεῖται εἰς
  choice: ist … bestimmt
  rationale: κεῖμαι mit εἰς bezeichnet hier, wozu dieser eingesetzt beziehungsweise bestimmt ist. Die Formulierung gibt den Sinn natürlich wieder, ohne ausdrücklich festzulegen, wer ihn bestimmt hat.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: zum Fall und zum Aufstehen
  rationale: Bewahrt die markante Gegenüberstellung und lässt offen, ob dieselben oder unterschiedliche Menschen gemeint sind.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: ein Zeichen, dem widersprochen wird
  rationale: 'Gibt das passive Partizip fortlaufend und unmittelbar wieder: Das Zeichen erfährt Widerspruch und Anfechtung.'
theological_decisions:
- issue: Bezug von »Fall und Aufstehen«
  choice: Die substantivische Parallelform »zum Fall und zum Aufstehen vieler« bleibt erhalten.
  alternative: »damit viele fallen und wieder aufstehen« oder »zum Fall der einen und zur Auferstehung der anderen«
  rationale: Der griechische Text sagt weder ausdrücklich, dass dieselben Menschen erst fallen und dann aufstehen, noch teilt er sie in zwei Gruppen. Die Übersetzung bewahrt diese theologische Mehrdeutigkeit.
- issue: Bedeutung von ἀνάστασις
  choice: Aufstehen
  alternative: Auferstehung
  rationale: »Aufstehen« erhält sowohl die mögliche bildliche Wiederaufrichtung als auch einen möglichen Anklang an Auferstehung, ohne den Kontext vorschnell auf die leibliche Auferstehung einzuengen.
- issue: Ungenannter Handelnder bei κεῖται
  choice: »ist … bestimmt« ohne Nennung des Bestimmenden
  alternative: »Gott hat ihn dazu bestimmt«
  rationale: Das Passiv beziehungsweise der zuständliche Ausdruck kann göttliche Bestimmung nahelegen, nennt Gott hier jedoch nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« vermeidet den altertümlichen Klang von »Siehe«. Die knappe, parallele Satzstruktur folgt der feierlichen Aussage Simeons und bewahrt die Mehrdeutigkeit des griechischen Textes.
