  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: de
  text: Während sie dort waren, erfüllten sich die Tage bis zu ihrer Geburt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… ging die Zeit bis zu ihrer Geburt zu Ende.“'
    reason: Lexikalische Alternative zur Wiedergabe von ἐπλήσθησαν αἱ ἡμέραι; sie gibt den Vollendungsaspekt idiomatischer wieder, ohne den möglichen Erfüllungsanklang der Hauptfassung festzulegen.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Während …
  rationale: Die griechische Wendung führt den nächsten Erzählabschnitt ein; im Deutschen wird ihre verbindende Funktion natürlich durch den anschließenden Temporalsatz wiedergegeben, ohne das schwerfällige „Und es geschah“.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: Während sie dort waren
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet Gleichzeitigkeit. „Während sie dort waren“ ist natürlich und bewahrt den zeitlichen Verlauf.
- source_word: ἐπλήσθησαν
  choice: erfüllten sich
  rationale: Die Form bezeichnet das Erreichen der Fülle bzw. Vollendung. „Erfüllten sich“ hält sich eng an Lukas’ Ausdrucksweise und vermeidet die Verflachung zu „die Zeit kam“.
- source_word: αἱ ἡμέραι
  choice: die Tage
  rationale: Das ausdrücklich genannte Bild der „Tage“ bleibt erhalten und ist im Zusammenhang als die zum Gebären bestimmte Zeit verständlich.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: da sie gebären sollte
  rationale: Die Wendung gibt den Bezug der vollendeten Tage auf Marias bevorstehendes Gebären in idiomatischem, würdigem Deutsch wieder; „sollte“ bezeichnet hier den bevorstehenden Zeitpunkt, nicht eine menschliche Verpflichtung.
theological_decisions:
- issue: Möglicher Anklang an erfüllte oder bestimmte Zeit in ἐπλήσθησαν αἱ ἡμέραι
  choice: „erfüllten sich die Tage“
  alternative: „kam für sie die Zeit zu gebären“
  rationale: Die gewählte Fassung bewahrt sowohl den natürlichen Bezug auf das Ende der Schwangerschaft als auch einen möglichen lukanischen Erfüllungsanklang, ohne daraus ausdrücklich eine zusätzliche Lehraussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht biblische Wendung „die Tage erfüllten sich“ ist bewusst beibehalten, bleibt aber allgemein verständlich; die Fußnote dokumentiert die formnähere Alternative.
