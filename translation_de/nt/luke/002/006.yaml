  source_fidelity: Der Temporalsatz „Während sie dort waren“ gibt ἐν τῷ εἶναι αὐτοὺς ἐκεῖ treffend wieder. „Erfüllten sich die Tage“ bewahrt die pluralische χρονologische Bildsprache von αἱ ἡμέραι und den Vollendungsaspekt von ἐπλήσθησαν. Die Formulierung „bis zu ihrer Geburt“ macht den Bezug von τοῦ τεκεῖν αὐτήν im heutigen Deutsch klar, ohne eine zusätzliche Deutung einzutragen.
  naturalness: „Die Tage, da sie gebären sollte“ ist verständlich, wirkt aber im modernen Standarddeutsch literarisch-archaisch; außerdem klingt „da“ hier leicht wie ein bloßer Zeitpunkt. „Die Tage bis zu ihrer Geburt“ ist klarer und idiomatischer. Die vorhandene Fußnotenalternative mit „dass sie gebären sollte“ ist im heutigen Deutsch syntaktisch und stilistisch nicht gelungen.
  terminology: Keine problematischen Namen oder theologischen Fachbegriffe. „Erfüllten sich“ ist als bewusst leicht bibelsprachliche, aber weiterhin natürliche Wiedergabe angemessen und bewahrt den möglichen lukanischen Anklang, ohne ihn auszudeuten.
