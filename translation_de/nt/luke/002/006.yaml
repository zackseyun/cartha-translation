    rationale: τοῦ τεκεῖν αὐτήν bezeichnet die auf die Geburt hin vollendete Zeit. „Bis zu ihrer Geburt“ vermittelt dies im modernen Deutsch direkt und ohne die bei „sollte“ mögliche Nuance einer Verpflichtung.
  - severity: medium
    issue: Die Fußnote „waren die Tage vollendet, dass sie gebären sollte“ ist im modernen Deutsch keine gut gebildete oder natürliche Alternative.
    rationale: Die Konstruktion „vollendet, dass“ stellt den griechischen Bezug nicht idiomatisch dar. Die Fußnote sollte eine sprachlich tragfähige lexikalische Alternative bieten.
