  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: de
  text: Und da war Hanna, eine Prophetin, Tochter Phanuëls, aus dem Stamm Ascher. Sie war hochbetagt[a] und hatte sieben Jahre lang mit ihrem Mann gelebt, seit ihrer Jungfrauenzeit[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in vielen Tagen vorgerückt“; eine griechische Redewendung für ein hohes Alter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von ihrer Jungfrauenzeit an“. Im Zusammenhang bezeichnet dies wahrscheinlich die sieben Jahre ihrer Ehe, gerechnet ab dem Ende ihrer Jungfrauenzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: Prophetin
  rationale: Die ausdrücklich feminine Bezeichnung wird im Deutschen knapp und eindeutig mit „Prophetin“ wiedergegeben.
- source_word: θυγάτηρ Φανουήλ
  choice: eine Tochter Phanuëls
  rationale: Die unbestimmte Form folgt der griechischen Apposition und klingt im genealogischen Zusammenhang natürlich.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: aus dem Stamm Ascher
  rationale: ἐκ bezeichnet hier Herkunft beziehungsweise Stammeszugehörigkeit; „aus dem Stamm“ ist die geläufige deutsche Form.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: hochbetagt
  rationale: Die griechische Wendung lautet wörtlich „in vielen Tagen vorgerückt“, ist aber ein Idiom für ein hohes Alter. „hochbetagt“ gibt den Sinn würdig und natürlich wieder; die Bildsprache wird in der Fußnote offengelegt.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: mit ihrem Mann gelebt
  rationale: ἀνήρ bezeichnet in diesem Zusammenhang den Ehemann. Das possessive „ihrem“ macht die eheliche Beziehung im Deutschen natürlich deutlich, ohne zusätzlichen Inhalt einzutragen.
- source_word: ἔτη ἑπτὰ
  choice: sieben Jahre
  rationale: Direkte Wiedergabe der Zeitangabe.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: nach ihrer Jungfrauenzeit
  rationale: Die Formulierung bezeichnet den Ausgangspunkt der siebenjährigen Ehezeit. „Nach ihrer Jungfrauenzeit“ ist im Deutschen verständlich, während die ungewöhnliche griechische Ausdrucksweise in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezeichnung Hannas als προφῆτις
  choice: Hanna wird ausdrücklich als „Prophetin“ bezeichnet.
  alternative: Den Ausdruck als bloßen Ehrentitel oder allgemein als fromme Frau wiederzugeben.
  rationale: Das griechische Substantiv ist die feminine Form der gewöhnlichen Bezeichnung für einen Propheten; die Übersetzung sollte diese Aussage weder abschwächen noch konfessionell umdeuten.
- issue: Beschreibung von Hannas Alter
  choice: Das Altersidiom wird im Haupttext sinngemäß mit „hochbetagt“ wiedergegeben.
  alternative: Die Wendung wörtlich als „in vielen Tagen vorgerückt“ wiederzugeben oder aus dem Folgevers ein bestimmtes Alter einzutragen.
  rationale: Die wörtliche Form wäre im modernen Deutsch unnatürlich, während eine genaue Altersberechnung über den Wortlaut dieses Verses hinausginge. Die Fußnote bewahrt das Bild des griechischen Ausdrucks.
- issue: Zeitlicher Bezug von ἀπὸ τῆς παρθενίας αὐτῆς
  choice: Die sieben Jahre werden als Ehezeit nach Hannas Jungfrauenzeit verstanden, ohne eine weitergehende Chronologie festzulegen.
  alternative: „Von ihrer Jungfrauenzeit an“ streng formal wiederzugeben.
  rationale: Der Zusammenhang mit „mit ihrem Mann gelebt“ zeigt den Übergang von der Jungfrauenzeit zur Ehe; die griechische Ausgangspunktkonstruktion bleibt jedoch erklärungsbedürftig und wird deshalb in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt wegen des im nächsten Vers fortgesetzten griechischen Satzes mit einem Komma offen. „Hanna“ und „Ascher“ folgen den im Deutschen geläufigen biblischen Namensformen; „Phanuël“ markiert die getrennte Aussprache.
