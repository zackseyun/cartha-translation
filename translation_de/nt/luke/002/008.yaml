  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: de
  text: Und in derselben Gegend waren Hirten, die draußen auf den Feldern übernachteten[a] und in der Nacht Wache über ihre Herde hielten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die im Freien lebten“ beziehungsweise „unter freiem Himmel lagerten“. Das griechische Verb betont, dass die Hirten die Nacht draußen auf den Feldern verbrachten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wachen der Nacht über ihre Herde hielten“. Das kann darauf hindeuten, dass sie sich bei der Nachtwache abwechselten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: Hirten
  rationale: Die übliche und im Zusammenhang präzise Bezeichnung für Menschen, die eine Schafherde hüten.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: in derselben Gegend
  rationale: χώρα bezeichnet hier die Gegend beziehungsweise das Umland des zuvor genannten Ortes; „Gegend“ ist natürlich und wahrt den räumlichen Bezug.
- source_word: ἀγραυλοῦντες
  choice: draußen auf den Feldern übernachteten
  rationale: Das Verb bezeichnet das Verbringen der Nacht im Freien, besonders auf dem Feld; die Wiedergabe macht sowohl den Ort als auch den nächtlichen Aufenthalt deutlich.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: in der Nacht Wache ... hielten
  rationale: Die figura etymologica bezeichnet das Halten nächtlicher Wachen. Die natürliche deutsche Formulierung bewahrt den Gedanken der nächtlichen Bewachung; mögliche Wachschichten werden in der Fußnote ausgewiesen.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: über ihre Herde
  rationale: ποίμνη ist die kollektiv verstandene Herde unter ihrer Obhut; zusammen mit „Wache halten über“ ergibt sich eine idiomatische deutsche Wendung.
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt Lukas’ schlichte narrative Verknüpfung mit dem vorhergehenden Geschehen.
- source_word: ἦσαν
  choice: waren
  rationale: Im Deutschen führt „in derselben Gegend waren Hirten“ die neue Personengruppe natürlich ein, ohne die griechische Existenzkonstruktion unnötig nachzuahmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählen; „übernachteten“ bringt die im griechischen Partizip enthaltene nächtliche Bedeutung ausdrücklich zur Geltung. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
