  terminology: „Weisheit“, „Gunst“, „bei Gott“ und „Menschen“ sind treffend. „Größe“ gibt die körperliche Lesart von ἡλικία natürlich wieder, ohne die alternative Bedeutung Lebensalter auszuschließen; diese wird in der Fußnote genannt.
