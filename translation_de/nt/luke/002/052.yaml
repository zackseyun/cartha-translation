  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: de
  text: Und Jesus nahm weiter zu an Weisheit und Größe[a] sowie an Gunst bei Gott und Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alter“ oder „Reife“. Das griechische Wort kann Lebensalter, körperliche Größe oder Reife bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: nahm weiter zu
  rationale: Das Imperfekt bezeichnet einen fortdauernden Entwicklungsprozess; „nahm weiter zu“ gibt diesen Verlauf in natürlichem Deutsch wieder.
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: Die übliche und sachlich passende Wiedergabe für umfassendes Verständnis und Urteilsvermögen.
- source_word: ἡλικίᾳ
  choice: Alter
  rationale: ἡλικία kann Alter, Lebensalter oder Körpergröße bezeichnen. „Alter“ ist im Deutschen in der Verbindung „an Weisheit und Alter zunehmen“ natürlich; die mögliche Bedeutung „Körpergröße“ bleibt in einer Fußnote erhalten.
- source_word: χάριτι
  choice: Gunst
  rationale: Im Verhältnis zu Gott und Menschen bezeichnet χάρις hier am ehesten Wohlwollen beziehungsweise Anerkennung, nicht „Gnade“ als theologischen Fachbegriff.
- source_word: παρὰ θεῷ
  choice: bei Gott
  rationale: παρά mit dem Dativ bezeichnet hier die Stellung oder das Ansehen bei jemandem; „bei Gott“ bildet zudem die Parallele zu „bei den Menschen“ natürlich ab.
- source_word: ἀνθρώποις
  choice: den Menschen
  rationale: Der Plural bezeichnet Menschen allgemein. Das deutsche „Menschen“ gibt diese umfassende Bedeutung genau und ohne eine mögliche Beschränkung auf Männer wieder.
theological_decisions:
- issue: Jesu menschliche Entwicklung und christologische Spannung
  choice: Der Vers beschreibt uneingeschränkt, dass Jesus tatsächlich an Weisheit, Alter und Gunst zunahm.
  alternative: Die Aussage über Jesu Entwicklung abschwächen oder so umformulieren, dass eine Zunahme an Weisheit vermieden wird.
  rationale: Der griechische Text spricht ausdrücklich von fortschreitender Entwicklung. Diese Aussage über Jesu wirkliche Menschlichkeit wird bewahrt und nicht zugunsten einer theologischen Harmonisierung abgeschwächt.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während „nahm weiter zu“ den durativen Aspekt idiomatisch ausdrückt. Die lexikalische Mehrdeutigkeit von ἡλικία wird durch die Fußnote bewahrt.
