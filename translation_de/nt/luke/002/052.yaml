  source_fidelity: 'Die Wiedergabe trifft προέκοπτεν als fortlaufende Entwicklung sowie Weisheit, Gunst und die Beziehung zu Gott und Menschen grundsätzlich gut. Für ἡλικία ist jedoch „Alter“ in dieser deutschen Konstruktion nicht die angemessene Hauptwiedergabe: Es kann zwar lexikalisch „Lebensalter“ bedeuten, doch die Formulierung „an Alter zunehmen“ ist unidiomatisch und verdeckt die naheliegende Bedeutung körperlicher Größe. Die Mehrdeutigkeit soll in der Fußnote stehen bleiben.'
