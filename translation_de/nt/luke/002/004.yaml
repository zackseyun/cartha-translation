  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: de
  text: Auch Josef zog von Galiläa, aus der Stadt Nazaret, hinauf nach Judäa in die Stadt Davids, die Bethlehem heißt, weil er aus dem Haus und Geschlecht Davids stammte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέβη
  choice: zog … hinauf
  rationale: Bewahrt die im Griechischen bezeichnete Aufwärtsbewegung und klingt bei einer Reise im Deutschen natürlich.
- source_word: δὲ καὶ
  choice: Auch
  rationale: Gibt den leichten Erzählanschluss und die einschließende Bedeutung von καί knapp und idiomatisch wieder.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: von Galiläa, aus der Stadt Nazaret
  rationale: Erhält sowohl die größere Herkunftsregion als auch den konkreten Herkunftsort.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: nach Judäa
  rationale: Verwendet die übliche deutsche Bezeichnung für die damalige Region.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: in die Stadt Davids, die Bethlehem heißt
  rationale: Bewahrt die davidische Bezeichnung und die erklärende Relativkonstruktion des griechischen Textes.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: weil er … stammte
  rationale: Gibt den begründenden articularen Infinitiv als natürlichen deutschen Kausalsatz wieder; „stammte“ macht den Abstammungsbezug im Zusammenhang ausdrücklich, ohne ihn zu erweitern.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: aus dem Haus und der Sippe Davids
  rationale: Bewahrt die beiden verwandten, aber nicht identischen Abstammungsbegriffe und formuliert zugleich verständlich und würdevoll.
theological_decisions:
- issue: Davidische Abstammungsbezeichnungen
  choice: aus dem Haus und der Sippe Davids
  alternative: aus dem Haus und Geschlecht Davids
  rationale: Die Übersetzung lässt beide griechischen Begriffe οἶκος und πατριά stehen, statt sie zu einem einzigen Abstammungsbegriff zu verschmelzen. Sie unterstreicht Josefs davidische Zugehörigkeit, ohne weitergehende lehrmäßige Folgerungen in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Zog … hinauf“ erhält die geografische Bewegung; „Haus und Sippe“ wahrt die doppelte Abstammungsterminologie ohne unnötig altertümlich zu wirken.
