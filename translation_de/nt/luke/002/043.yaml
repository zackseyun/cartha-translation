  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: de
  text: Als die Festtage zu Ende waren und sie sich auf den Rückweg machten, blieb der Junge Jesus in Jerusalem zurück. Seine Eltern[a] wussten nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung „seine Eltern“ entspricht dem griechischen Text. Lukas verwendet hier die gewöhnliche familiäre Bezeichnung; damit wird die zuvor im Evangelium berichtete jungfräuliche Empfängnis nicht verneint.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: als die Festtage zu Ende waren
  rationale: Der Genitivus absolutus bezeichnet einen abgeschlossenen Umstand vor der Haupthandlung. „Festtage“ macht den aus dem unmittelbaren Zusammenhang klaren Bezug auf das Passafest verständlich, ohne eine genauere Dauer hinzuzufügen.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: und sie sich auf den Rückweg machten
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet hier eine gleichzeitig einsetzende beziehungsweise andauernde Handlung. Die Formulierung gibt den Beginn der Heimreise natürlich wieder.
- source_word: ὑπέμεινεν
  choice: blieb … zurück
  rationale: ὑπομένω bedeutet in diesem Zusammenhang, an einem Ort zurückzubleiben. „Blieb zurück“ ist im Deutschen natürlicher und genauer als das bloße „blieb“.
- source_word: ὁ παῖς
  choice: der Junge
  rationale: παῖς kann „Kind“, „Junge“ oder „junger Mensch“ bedeuten. Da Jesus nach dem unmittelbaren Kontext zwölf Jahre alt ist, ist „der Junge“ eine natürliche, altersgemäße Wiedergabe, ohne das Alter in den Vers einzutragen.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe mit ἐν.
- source_word: οὐκ ἔγνωσαν
  choice: bemerkten es nicht
  rationale: γινώσκω bezeichnet hier das Erkennen beziehungsweise Bemerken eines Sachverhalts. Das im Deutschen notwendige „es“ bezieht sich darauf, dass Jesus zurückgeblieben war.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seine Eltern
  rationale: γονεῖς bedeutet unmittelbar „Eltern“. Die schlichte familiäre Bezeichnung des griechischen Textes wird beibehalten.
theological_decisions:
- issue: Bezeichnung Marias und Josefs als Jesu γονεῖς
  choice: seine Eltern
  alternative: seine Mutter und Josef
  rationale: Der griechische Text nennt sie ausdrücklich „seine Eltern“. Diese gewöhnliche familiäre Ausdrucksweise wird nicht harmonisierend umformuliert und hebt die zuvor im Evangelium berichtete jungfräuliche Empfängnis nicht auf.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzähldeutsch. „Festtage“ erschließt den kontextuell eindeutigen Bezug, „auf den Rückweg machten“ und „blieb … zurück“ bilden den Handlungsablauf idiomatisch ab. Die theologische Spannung der Bezeichnung „seine Eltern“ bleibt erhalten.
