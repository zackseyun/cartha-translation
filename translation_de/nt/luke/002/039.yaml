id: LUK.2.39
reference: Luke 2:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: de
  text: Und als sie alles nach dem Gesetz des Herrn[a] vollendet hatten, kehrten sie nach Galiläa zurück, in ihre eigene Stadt[b] Nazaret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles erfüllt hatten, was das Gesetz des Herrn verlangte“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann sowohl eine Stadt als auch eine kleinere Ortschaft bezeichnen; Nazaret war eine kleine Siedlung.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: als
  rationale: In Verbindung mit dem Aorist leitet ὡς einen temporalen Nebensatz ein. „Als“ gibt die zeitliche Abfolge natürlich wieder, ohne eine besondere Unmittelbarkeit auszudrücken.
- source_word: ἐτέλεσαν
  choice: vollendet hatten
  rationale: τελέω bezeichnet hier das vollständige Ausführen der vorgeschriebenen Handlungen. Das Plusquamperfekt macht im Deutschen deutlich, dass dies der Rückkehr vorausging; „vollendet“ bleibt nah am griechischen Ausdruck, ohne prophetische Erfüllung anzudeuten.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: alles nach dem Gesetz des Herrn
  rationale: Die Formulierung bewahrt die Weite und Struktur des Griechischen. Gemeint sein kann alles, was dem Gesetz entsprach beziehungsweise von ihm vorgeschrieben war; diese leichte Offenheit wird nicht im Haupttext aufgelöst.
- source_word: νόμον κυρίου
  choice: dem Gesetz des Herrn
  rationale: Der Genitiv wird mit der geläufigen biblischen Wendung „Gesetz des Herrn“ wiedergegeben.
- source_word: κυρίου
  choice: Herrn
  rationale: κύριος bezeichnet hier Gott als den Urheber des Gesetzes. „Herr“ entspricht dem griechischen Wortlaut, ohne im Druckbild ausdrücklich das Tetragramm zu unterstellen.
- source_word: ἐπέστρεψαν
  choice: kehrten ... zurück
  rationale: ἐπιστρέφω bedeutet im vorliegenden Reisekontext „zurückkehren“; die deutsche Verbklammer ist natürlich und erzählerisch angemessen.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei geografischen Zielangaben ohne Artikel ist „nach“ im Deutschen die idiomatische Entsprechung von εἰς.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: in ihre eigene Stadt
  rationale: πόλις wird zunächst formal mit „Stadt“ wiedergegeben; ἑαυτῶν erhält durch „ihre eigene“ seinen rückbezüglichen Nachdruck. Eine Fußnote erläutert, dass das griechische Wort auch eine kleinere Ortschaft bezeichnen kann.
- source_word: Ναζαρέθ
  choice: Nazaret
  rationale: „Nazaret“ ist eine etablierte moderne deutsche Schreibweise des Ortsnamens.
theological_decisions:
- issue: Bezug von „Herr“ in „Gesetz des Herrn“
  choice: „Herr“ bezeichnet Gott als den Geber des in der Schrift überlieferten Gesetzes.
  alternative: Keine kontextuell wahrscheinliche Alternative mit erheblicher theologischer Folge.
  rationale: Die Wendung ist ein jüdisch-schriftsprachlicher Ausdruck. Die schlichte Wiedergabe wahrt den Akzent auf der Befolgung des Gesetzes, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Verhältnis zu den zuvor geschilderten Ereignissen und zur Rückkehr nach Nazaret
  choice: Der Vers wird in seiner zusammenfassenden Erzählform wiedergegeben, ohne eine nicht ausdrücklich genannte Reiseroute oder Chronologie zu ergänzen.
  alternative: Eine harmonisierende Ergänzung weiterer Aufenthalte oder Reisen.
  rationale: Der griechische Text nennt hier nur den Abschluss der gesetzlich vorgeschriebenen Handlungen und die Rückkehr. Zusätzliche chronologische Einzelheiten wären nicht Übersetzung, sondern Auslegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht biblischem Klang. „Gesetz des Herrn“ bleibt als vertraute schriftsprachliche Wendung erhalten. „Stadt“ bildet πόλις formal ab; die historische Größenordnung Nazarets wird in der Fußnote erläutert.
