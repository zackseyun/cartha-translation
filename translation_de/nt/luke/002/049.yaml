  source_fidelity: Der Haupttext gibt die beiden Fragen, die rhetorische Verneinung und die Notwendigkeit durch δεῖ zuverlässig wieder. „im Haus meines Vaters“ ist im Tempelkontext eine vertretbare kontextuelle Entfaltung der elliptischen Wendung ἐν τοῖς τοῦ πατρός μου, sofern die Fußnote die nichtörtliche Lesart klar wahrt. Für das imperfektische ἐζητεῖτε ist „habt ihr nach mir gesucht“ idiomatischer und näher an der konkreten Suche nach einer Person.
  naturalness: „Nach jemandem suchen“ ist im modernen Standarddeutsch die reguläre und hier flüssigere Verbindung. Die bisherige Fußnotenformulierung „bei dem sein, was meines Vaters ist“ ist zwar verständlich, aber stilistisch schwerfällig und bildet die griechische Ellipse nicht besonders transparent ab.
  terminology: „meines Vaters“ und „muss“ sind angemessen. Die deutsche Substantivgroßschreibung bei „Vaters“ ist rein orthographisch. Die Fußnote soll weder „Haus“ noch „Angelegenheiten“ als alleinige Bedeutung festlegen.
