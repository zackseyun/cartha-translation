source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Warum habt ihr nach mir gesucht? Wusstet ihr nicht, dass ich im Haus meines Vaters sein muss?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich bei den Dingen meines Vaters sein muss.“ Die griechische Wendung ist elliptisch und kann sowohl das Haus des Vaters als auch das, was ihn betrifft, etwa seine Angelegenheiten, bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Warum
  rationale: Die idiomatische Verbindung fragt nach dem Grund. „Warum“ ist im modernen Deutschen natürlich und bewahrt die Kraft der Frage.
- source_word: ἐζητεῖτέ
  choice: habt ihr mich gesucht
  rationale: ζητέω bezeichnet hier die konkrete Suche der Eltern nach Jesus. Das Perfekt ist im heutigen Standarddeutsch die natürliche Erzählform in direkter Rede.
- source_word: οὐκ ᾔδειτε
  choice: Wusstet ihr nicht
  rationale: οἶδα bezeichnet Wissen oder Bewusstsein; die Formulierung erhält die rhetorische Frage unmittelbar.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: im Haus meines Vaters
  rationale: Die griechische Wendung ist elliptisch, wörtlich etwa „in dem, was meinem Vater gehört“. Wegen des unmittelbaren Tempelkontexts ist „im Haus meines Vaters“ die wahrscheinlichste kontextuelle Wiedergabe; die weiter gefasste Bedeutung wird in der Fußnote bewahrt.
- source_word: δεῖ
  choice: muss
  rationale: δεῖ drückt eine zwingende, im lukanischen Zusammenhang auch göttliche Notwendigkeit aus. „muss“ gibt dies knapp und gewichtig wieder.
- source_word: εἶναί με
  choice: ich … sein muss
  rationale: Der Akkusativ mit Infinitiv nach δεῖ wird im Deutschen natürlich als persönlicher dass-Satz wiedergegeben.
- source_word: πατρός μου
  choice: meines Vaters
  rationale: „Vater“ bezeichnet hier im Tempelkontext Gott. Die Großschreibung entspricht ohnehin der deutschen Substantivschreibung und fügt keine zusätzliche Auslegung hinzu.
theological_decisions:
- issue: Elliptische Wendung ἐν τοῖς τοῦ πατρός μου
  choice: 'Im Haupttext: „im Haus meines Vaters“'
  alternative: „bei dem sein, was meines Vaters ist“ beziehungsweise „mit den Angelegenheiten meines Vaters befasst sein“
  rationale: Der Tempelkontext stützt die örtliche Deutung, doch das substantivierte Neutrum Plural bleibt sprachlich offen und kann auch die Angelegenheiten oder Belange des Vaters meinen. Die Fußnote erhält diese echte Mehrdeutigkeit.
- issue: Bezug von „meines Vaters“
  choice: Als Bezug auf Gott bewahrt, ohne erklärenden Zusatz
  alternative: Bezug auf Josef
  rationale: Jesus unterscheidet durch diese Aussage seinen Vater im Tempelkontext von seinen anwesenden Eltern. Die Übersetzung lässt den christologischen Anspruch des Textes stehen, ohne ihn auszubauen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; die im Griechischen angelegte Mehrdeutigkeit wird nicht im Haupttext überladen, sondern transparent in der Fußnote erhalten.
