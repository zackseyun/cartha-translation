    rationale: „bei dem sein, was meines Vaters ist“ klingt im Deutschen unidiomatisch. Eine Formulierung mit „bei den Dingen meines Vaters“ lässt die elliptische Grundstruktur besser erkennen; die sachbezogene Deutung kann anschließend als mögliche Bedeutung erläutert werden.
