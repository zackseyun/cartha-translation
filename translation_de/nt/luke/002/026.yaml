id: LUK.2.26
reference: Luke 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: de
  text: Und ihm war vom Heiligen Geist offenbart worden, dass er den Tod nicht sehen werde, bevor er den Messias des Herrn[a] gesehen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „den Christus des Herrn“; wörtlicher: „den Gesalbten des Herrn“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: war offenbart worden
  rationale: Das passive Partizip bezeichnet hier eine göttliche Mitteilung. „Offenbart“ ist im Deutschen natürlich und wird durch die ausdrückliche Nennung des Heiligen Geistes als Handelnden gestützt.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: vom Heiligen Geist
  rationale: ὑπό mit Genitiv kennzeichnet den Handelnden; „vom Heiligen Geist“ gibt diese persönliche Urheberschaft knapp und genau wieder.
- source_word: μὴ ἰδεῖν θάνατον
  choice: den Tod nicht sehen werde
  rationale: Die deutsche Wendung bewahrt das Bild des griechischen Ausdrucks und bleibt verständlich; „nicht sterben werde“ wäre erklärender, aber weniger formal.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: bevor er … gesehen habe
  rationale: Die Konstruktion bezeichnet ein künftig vorausgesetztes Ereignis, das seinem Tod vorausgehen muss. Der Konjunktiv Perfekt fügt sich natürlich in die indirekte Rede ein und verdeutlicht die zeitliche Abfolge.
- source_word: τὸν χριστὸν κυρίου
  choice: den Messias des Herrn
  rationale: χριστός ist hier ein messianischer Titel. „Messias“ macht diesen Titel im Deutschen unmittelbar erkennbar; „des Herrn“ bildet den Genitiv κυρίου ab, ohne sein Verhältnis zum Messias enger festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστός als messianischem Titel
  choice: Messias
  alternative: Christus / Gesalbter
  rationale: In dieser Wortgruppe fungiert χριστός als Titel. „Messias“ bewahrt den jüdisch-messianischen Zusammenhang; die traditionelle Wiedergabe „Christus des Herrn“ wird in der Fußnote genannt.
- issue: Verhältnis des Genitivs κυρίου zu χριστός
  choice: des Herrn
  alternative: der Messias, der dem Herrn gehört / vom Herrn gesandt ist
  rationale: Der knappe Genitiv bleibt bewusst offen und legt nicht ausdrücklich fest, ob vor allem Zugehörigkeit, Beauftragung oder Herkunft gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Bildsprache „den Tod sehen“ bleibt erhalten; Satzbau und indirekte Rede sind idiomatisch deutsch.
