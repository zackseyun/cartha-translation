source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: de
  text: Als sie es gesehen hatten, machten sie bekannt, was ihnen über dieses Kind gesagt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „das Wort“ oder „die Aussage, die ihnen über dieses Kind gesagt worden war“.'
    reason: Lexikalische Alternative zu ῥῆμα und transparentere Wiedergabe der griechischen Substantivkonstruktion.
lexical_decisions:
- source_word: ἰδόντες
  choice: Als sie es gesehen hatten
  rationale: Das Aoristpartizip bezeichnet hier eine der Haupthandlung vorausgehende Wahrnehmung. „Als sie es gesehen hatten“ gibt die zeitliche Abfolge natürlich wieder; „es“ ergänzt im Deutschen das im Griechischen unausgedrückte Objekt aus dem Zusammenhang.
- source_word: δὲ
  choice: unübersetzt im Anschluss mit „Als“
  rationale: δέ führt die Erzählung mild weiter und markiert keinen starken Gegensatz. Ein zusätzliches „und“ wäre vor dem deutschen temporalen Nebensatz schwerfällig; der Fortgang bleibt durch die Satzfolge erkennbar.
- source_word: ἐγνώρισαν
  choice: machten sie bekannt
  rationale: γνωρίζω bedeutet hier „bekannt machen, mitteilen“. Die Formulierung bleibt nah am griechischen Verb, ohne eine förmliche Verkündigung hineinzulesen.
- source_word: περὶ τοῦ ῥήματος
  choice: was … gesagt worden war
  rationale: ῥῆμα kann Wort, Ausspruch, Mitteilung oder Sache bezeichnen. Die deutsche Relativkonstruktion gibt hier idiomatisch den Inhalt der zuvor ergangenen Mitteilung wieder, ohne ein zusätzliches Substantiv wie „Botschaft“ festzulegen.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: was ihnen … gesagt worden war
  rationale: Die Formulierung bewahrt das Passiv und macht deutlich, dass das Gesagte zeitlich vor dem Bekanntmachen lag.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: über dieses Kind
  rationale: παιδίον bezeichnet hier das neugeborene Kind. „Dieses Kind“ ist präzise, natürlich und stilistisch unmarkiert.
theological_decisions:
- issue: Bedeutungsbreite von ῥῆμα im Bezug auf die Engelsbotschaft
  choice: was ihnen … gesagt worden war
  alternative: die Botschaft / das Wort, das ihnen gesagt worden war
  rationale: Die gewählte Konstruktion bezeichnet den Inhalt der Mitteilung klar, ohne ῥῆμα unnötig auf den theologischen Fachbegriff „Wort“ oder ausschließlich auf „Botschaft“ festzulegen. Die lexikalische Mehrdeutigkeit wird in der Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist natürlich deutsch; das griechische Passiv und die zeitliche Abfolge bleiben erhalten.
