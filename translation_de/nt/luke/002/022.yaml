source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: de
  text: Und als die Tage ihrer Reinigung nach dem Gesetz des Mose erfüllt waren,[a] brachten sie ihn hinauf nach Jerusalem, um ihn dem Herrn darzustellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen αὐτῆς („ihrer“, auf Maria bezogen) statt αὐτῶν („ihrer“, auf mehrere Personen bezogen).
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: erfüllt waren
  rationale: Die passive Form bezeichnet hier idiomatisch, dass eine festgelegte Zeitspanne ihr volles Maß erreicht hatte. „Erfüllt waren“ bewahrt die formale und zeitliche Nuance.
- source_word: καθαρισμοῦ
  choice: Reinigung
  rationale: Im Zusammenhang mit dem Gesetz des Mose bezeichnet das Wort die rituelle Reinigung nach einer Geburt. „Reinigung“ ist im Deutschen klar und für diesen kultisch-rechtlichen Kontext angemessen.
- source_word: αὐτῶν
  choice: ihrer
  rationale: Der vorgegebene griechische Text hat das Pluralpronomen αὐτῶν. Die Übersetzung gibt diese Lesart im Haupttext wieder, ohne sie an den levitischen Hintergrund anzugleichen.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: nach dem Gesetz des Mose
  rationale: Die Wendung bezeichnet die Übereinstimmung mit der mosaischen Vorschrift. „Nach dem Gesetz des Mose“ ist natürlich, präzise und wahrt den rechtlichen Ton.
- source_word: ἀνήγαγον
  choice: brachten sie ihn hinauf
  rationale: Das Verb enthält eine Aufwärtsbewegung und passt zum Hinaufziehen nach Jerusalem. Die deutsche Formulierung bewahrt diese räumliche Nuance.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: παραστῆσαι
  choice: um ihn ... darzustellen
  rationale: In diesem kultisch-rechtlichen Zusammenhang bedeutet das Verb, jemanden vor Gott zu stellen beziehungsweise ihm zu präsentieren. „Darstellen“ ist eine etablierte, würdevolle und quellennah formulierte Wiedergabe.
- source_word: κυρίῳ
  choice: dem Herrn
  rationale: κύριος bezeichnet hier Gott in ehrfürchtigem und bundesbezogenem Sinn. Der deutsche Dativ entspricht der griechischen Konstruktion.
theological_decisions:
- issue: Numerus in „die Tage ihrer Reinigung“
  choice: Die Plurallesart „ihrer Reinigung“ bleibt im Haupttext erhalten.
  alternative: „die Tage ihrer Reinigung“ mit singularischem Bezug auf Maria beziehungsweise ausdrücklich „ihrer [Marias] Reinigung“
  rationale: Der angegebene SBLGNT-Text liest αὐτῶν („ihrer“, Plural). Diese sprachlich und sachlich spannungsreiche Lesart wird nicht stillschweigend an 3. Mose 12 angeglichen; die abweichende Singularlesart wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formaler Satzführung. „Erfüllt waren“ und „darzustellen“ halten die kultisch-rechtliche Prägung des Ausgangstextes fest; „hinauf nach Jerusalem“ bewahrt die Richtungsangabe.
