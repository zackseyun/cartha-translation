  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: de
  text: Da trat ein Engel des Herrn zu ihnen[a], und die Herrlichkeit des Herrn umstrahlte sie. Da bekamen sie große Angst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da stand plötzlich ein Engel des Herrn bei ihnen.“ Das griechische Verb kann sowohl das plötzliche Herantreten als auch das Dastehen bei jemandem bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Und sie fürchteten sich mit großer Furcht.“ Diese griechische Ausdrucksweise bezeichnet heftige Angst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: ein Engel des Herrn
  rationale: Im erzählerischen Zusammenhang bezeichnet ἄγγελος ein himmlisches Wesen. Die artikellose Form wird im Deutschen natürlich unbestimmt wiedergegeben; κύριος erscheint als „Herr“.
- source_word: ἐπέστη αὐτοῖς
  choice: trat … zu ihnen
  rationale: ἐφίστημι kann das plötzliche Herantreten beziehungsweise Dastehen bei jemandem ausdrücken. „Trat … zu ihnen“ bewahrt die konkrete, unvermittelte Gegenwart, ohne nur allgemein „erschien“ zu sagen.
- source_word: δόξα κυρίου
  choice: die Herrlichkeit des Herrn
  rationale: „Herrlichkeit“ bewahrt die religiöse und theologische Tragweite von δόξα; im Zusammenhang ist zugleich sichtbarer göttlicher Lichtglanz gemeint.
- source_word: περιέλαμψεν αὐτούς
  choice: umstrahlte sie
  rationale: Das Verb περιλάμπω bezeichnet ein ringsum scheinendes beziehungsweise einhüllendes Licht. „Umstrahlte“ gibt dies knapp und idiomatisch wieder.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: Da bekamen sie große Angst
  rationale: Der verwandte Akkusativ verstärkt das Verb und drückt heftige Furcht aus. Die deutsche Formulierung gibt diese Intensität natürlich wieder; die wörtliche Struktur wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe von κύριος in ἄγγελος κυρίου und δόξα κυρίου
  choice: Herr
  alternative: Gebieter
  rationale: Der Bezug ist hier göttlich. „Herr“ entspricht dem etablierten biblischen Sprachgebrauch und bewahrt die theologische Offenheit der Bezeichnung.
- issue: Bedeutungsumfang von δόξα
  choice: Herrlichkeit
  alternative: Lichtglanz
  rationale: „Herrlichkeit“ wahrt die umfassendere theologische Bedeutung, während der folgende Ausdruck „umstrahlte“ ihre sichtbare Lichtwirkung im Geschehen erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Trat … zu ihnen“ klingt natürlich und erhält den Gedanken der plötzlichen Nähe. Der Satzschluss vermeidet eine unnatürliche Nachbildung des griechischen verwandten Akkusativs, macht sie aber in der Fußnote transparent.
