id: LUK.2.38
reference: Luke 2:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: de
  text: Und in eben dieser Stunde trat sie hinzu und dankte Gott. Zugleich sprach sie über ihn[a] zu allen, die auf die Erlösung Jerusalems warteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »ihn« ist im Zusammenhang am ehesten das Kind Jesus gemeint; da im Griechischen unmittelbar zuvor Gott genannt wird, ist der Bezug grammatisch jedoch nicht völlig eindeutig.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: in eben dieser Stunde
  rationale: Die temporale Dativfügung bezeichnet den Zeitpunkt; »eben dieser« gibt die hervorhebende Kraft von αὐτῇ wieder und betont das unmittelbare Zusammentreffen.
- source_word: ἐπιστᾶσα
  choice: trat sie hinzu
  rationale: Das Aoristpartizip bezeichnet hier Annas Hinzukommen zur Szene. »trat hinzu« ist natürlich und würdevoll, ohne die Art der Annäherung unnötig auszumalen.
- source_word: ἀνθωμολογεῖτο τῷ θεῷ
  choice: dankte Gott
  rationale: Das Verb kann Dank oder anerkennendes Lob ausdrücken. Mit dem Dativ τῷ θεῷ ist »Gott danken« eine direkte und idiomatische Wiedergabe; ein im Griechischen nicht ausdrücklich vorhandenes »begann« wird nicht ergänzt.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: sprach sie über ihn
  rationale: Der Imperfekt beschreibt fortdauerndes beziehungsweise wiederholtes Reden. Das Pronomen bleibt erhalten, sodass sein Bezug nicht stillschweigend festgelegt wird.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: zu allen, die auf … warteten
  rationale: προσδέχομαι bezeichnet hier erwartungsvolles Warten; die Formulierung ist verständlich und bewahrt diesen Hoffnungshorizont.
- source_word: λύτρωσιν Ἰερουσαλήμ
  choice: die Erlösung Jerusalems
  rationale: »Erlösung« bewahrt das Gewicht von λύτρωσις sowie die mögliche heilsgeschichtliche Weite. Der Genitiv bleibt offen für die im Griechischen angelegte Beziehung Jerusalems zur Erlösung.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in »sprach sie über ihn«
  choice: Das männliche Pronomen »ihn« wird im Haupttext beibehalten und nicht durch »Jesus« oder »das Kind« ersetzt.
  alternative: Im Kontext ist am ehesten das Kind Jesus gemeint; grammatisch kann wegen des unmittelbar vorausgehenden »Gott« auch Gott als Bezug verstanden werden.
  rationale: Die griechische Formulierung lässt den Bezug unausgesprochen. Eine Fußnote erläutert die Spannung, statt sie im Haupttext konfessionell oder exegetisch festzulegen.
- issue: Bedeutung von »Erlösung Jerusalems«
  choice: Die Wendung wird wörtlich-offen als »Erlösung Jerusalems« wiedergegeben.
  alternative: Möglich wäre »Befreiung Jerusalems«, wobei dies leichter auf politische Befreiung verengt werden könnte.
  rationale: Die gewählte Fassung lässt gemeinschaftliche, heilsgeschichtliche und eschatologische Bedeutungsanteile bestehen, ohne einen davon exklusiv festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Kurze Hauptsätze vermeiden syntaktische Überladung; »Zugleich« macht die parallelen Imperfekthandlungen verständlich, ohne eine zusätzliche zeitliche Abfolge zu behaupten.
