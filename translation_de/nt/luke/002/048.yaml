source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: de
  text: 'Als sie ihn sahen, waren sie erstaunt. Seine Mutter sagte zu ihm: »Kind, warum hast du uns das angetan? Sieh doch, dein Vater und ich haben dich voller Sorge gesucht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Als sie ihn sahen
  rationale: Das Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben und wahrt die zeitliche Abfolge.
- source_word: ἐξεπλάγησαν
  choice: waren sie außer sich vor Staunen
  rationale: Die Form bezeichnet starkes Erstaunen oder Bestürzung; die Wendung gibt die Intensität in natürlichem Deutsch wieder.
- source_word: Τέκνον
  choice: Kind
  rationale: Die liebevolle Anrede ist lexikalisch nicht ausdrücklich männlich; »Kind« übersetzt sie ohne den Zusatz »mein«.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: warum hast du uns das angetan?
  rationale: Die idiomatische Frage bringt den Vorwurf und die Betroffenheit der Sprechenden zum Ausdruck; ἡμῖν bleibt durch »uns« erhalten.
- source_word: ἰδοὺ
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende und nachdrückliche Funktion wird modern und sprechsprachlich natürlich wiedergegeben.
- source_word: ὁ πατήρ σου
  choice: dein Vater
  rationale: Die schlichte Bezeichnung des griechischen Textes bleibt ohne deutenden Zusatz erhalten.
- source_word: ὀδυνώμενοι
  choice: voller Sorge
  rationale: Das Partizip bezeichnet schmerzliche innere Bedrängnis. »Voller Sorge« ist im familiären Zusammenhang natürlich, bewahrt aber mehr emotionale Stärke als das bloße Adverb »besorgt«.
- source_word: ἐζητοῦμέν σε
  choice: haben dich … gesucht
  rationale: Das deutsche Perfekt erfasst die bis zum Augenblick des Sprechens andauernde Suche; die Dauer ergibt sich zusammen mit dem Kontext und der Zustandsangabe.
theological_decisions:
- issue: Bezeichnung Josefs als Vater Jesu im Verhältnis zu Jesu göttlicher Sohnschaft
  choice: »dein Vater« ohne erläuternden Zusatz
  alternative: »dein irdischer Vater«
  rationale: Maria sagt im griechischen Text schlicht »dein Vater«. Ein Zusatz wie »irdischer« würde die erzählerische und theologische Spannung vorwegnehmend auflösen, statt sie zu bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt familiär und emotional, ohne umgangssprachlich oder altertümlich zu werden. Keine Fußnote ist nötig, da »voller Sorge« die emotionale Schmerzkomponente von ὀδυνώμενοι im Haupttext hinreichend wiedergibt.
