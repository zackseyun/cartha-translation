  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: de
  text: 'Und der Engel sagte zu ihnen: „Fürchtet euch nicht! Denn seht: Ich verkünde euch eine große Freude, die dem ganzen Volk zuteilwerden wird.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die allen Menschen zuteilwerden wird“. Wörtlicher: „die für das ganze Volk sein wird“. Der bestimmte Ausdruck bezeichnet im unmittelbaren Zusammenhang wahrscheinlich Israel; „Volk“ kann je nach Kontext jedoch auch weiter verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Der Artikel verweist auf den bereits im Zusammenhang eingeführten Engel.
- source_word: Μὴ φοβεῖσθε
  choice: Fürchtet euch nicht!
  rationale: Die geläufige deutsche Wendung gibt das Verbot prägnant und in würdigem, weiterhin verständlichem Stil wieder.
- source_word: ἰδοὺ γὰρ
  choice: 'Denn seht:'
  rationale: „Denn“ wahrt die begründende Funktion von γάρ; „seht“ markiert entsprechend ἰδού nachdrücklich die folgende Botschaft, ohne das altertümlichere „siehe“ zu verwenden.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: Ich verkünde euch
  rationale: Das Verb bezeichnet das Verkünden einer guten Botschaft. Da „Freude“ grammatisch als Akkusativobjekt folgt, ist „eine große Freude verkünden“ im Deutschen klar und vermeidet eine unnötige Verdopplung mit „Freudenbotschaft“.
- source_word: χαρὰν μεγάλην
  choice: eine große Freude
  rationale: Die Formulierung bildet den Akkusativ und die Intensität des griechischen Ausdrucks unmittelbar und natürlich ab.
- source_word: ἥτις ἔσται
  choice: die … bestimmt sein wird
  rationale: Die qualitative Relativkonstruktion wird flüssig wiedergegeben; „bestimmt sein“ macht die Zugehörigkeit der angekündigten Freude idiomatisch verständlich, ohne ihren Inhalt näher festzulegen.
- source_word: παντὶ τῷ λαῷ
  choice: für das ganze Volk
  rationale: „Das ganze Volk“ wahrt sowohl πᾶς als auch den bestimmten Artikel und lässt im unmittelbaren lukanischen Zusammenhang den wahrscheinlichen Bezug auf Israel bestehen.
theological_decisions:
- issue: Reichweite von παντὶ τῷ λαῷ
  choice: für das ganze Volk
  alternative: für alle Menschen
  rationale: Der bestimmte griechische Ausdruck bezeichnet im unmittelbaren Erzählzusammenhang am ehesten das ganze, konkrete Volk, wahrscheinlich Israel. Die Übersetzung universalisiert die Aussage daher nicht vorzeitig, schließt die weitere heilsgeschichtliche Ausweitung im Lukasevangelium aber auch nicht aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fürchtet euch nicht“ bewahrt den vertrauten biblischen Ton; „seht“ gibt den Aufmerksamkeitsruf ἰδού verständlich und weniger altertümlich als „siehe“ wieder. Der Fußnotenmarker steht unmittelbar nach dem Satz, dessen Reichweite erläutert wird.
