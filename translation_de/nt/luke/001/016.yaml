id: LUK.1.16
reference: Luke 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: de
  text: Und viele von den Söhnen Israels wird er zum Herrn, ihrem Gott, zurückführen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Kindern Israels“ oder „von den Israeliten“. Wörtlich steht im Griechischen „Söhne Israels“, ein traditioneller Bundesausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche Satzanschluss bewahrt den fortlaufenden Zusammenhang mit dem vorherigen Vers.
- source_word: πολλοὺς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird im Deutschen knapp und natürlich mit „viele“ wiedergegeben.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: von den Söhnen Israels
  rationale: Die Formulierung folgt dem ausdrücklich männlichen griechischen Ausdruck und bewahrt zugleich den traditionellen biblischen Bundesausdruck; idiomatischere Alternativen werden in der Fußnote genannt.
- source_word: ἐπιστρέψει
  choice: wird … zurückführen
  rationale: Das aktive Verb beschreibt Johannes als den Handelnden, durch den viele sich wieder Gott zuwenden. „Zurückführen“ wahrt diese kausative Kraft besser als das intransitive „zurückkehren“ und vermeidet das stärker deutende „bekehren“.
- source_word: ἐπὶ
  choice: zu
  rationale: In Verbindung mit ἐπιστρέφω und dem Akkusativ bezeichnet die Präposition die Ausrichtung auf ein Ziel; im Deutschen ist „zu“ hier natürlich.
- source_word: κύριον
  choice: Herrn
  rationale: Im Zusammenhang bezeichnet κύριος den Gott Israels und nicht einen menschlichen Herrn.
- source_word: τὸν θεὸν αὐτῶν
  choice: ihrem Gott
  rationale: Die Apposition zu „Herrn“ wird in natürlichem Deutsch mit dem Possessivartikel wiedergegeben und bewahrt den Bundesbezug.
theological_decisions:
- issue: Wiedergabe des Bundesausdrucks τῶν υἱῶν Ἰσραὴλ
  choice: von den Söhnen Israels
  alternative: von den Kindern Israels; von den Israeliten
  rationale: Die Hauptfassung bewahrt die konkrete Form des griechischen Ausdrucks und seinen schriftsprachlich-biblischen Anklang, ohne die idiomatischen Alternativen als unzulässig auszuschließen.
- issue: Referent von κύριον τὸν θεὸν αὐτῶν
  choice: zum Herrn, ihrem Gott
  alternative: zu dem Herrn, ihrem Gott
  rationale: Die Apposition identifiziert den Herrn ausdrücklich als den Gott Israels; das Komma macht diese Beziehung im Deutschen klar.
- issue: Bedeutung von ἐπιστρέψει
  choice: wird … zurückführen
  alternative: wird … hinwenden; wird … bekehren
  rationale: „Zurückführen“ erhält sowohl die aktive Verursachung durch Johannes als auch den Gedanken der erneuten Hinwendung zu Israels Gott, ohne den Vorgang durch einen konfessionell geprägten Fachausdruck festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem biblischem Bundesklang. Die Satzstellung hebt „viele“ hervor und bleibt trotz der formnahen Wendung gut verständlich.
