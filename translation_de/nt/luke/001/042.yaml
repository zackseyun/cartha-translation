id: LUK.1.42
reference: Luke 1:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: de
  text: 'Und sie rief mit lauter Stimme: „Gesegnet bist du unter den Frauen, und gesegnet ist die Frucht deines Leibes.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν κραυγῇ μεγάλῃ καὶ εἶπεν
  choice: sie rief mit lauter Stimme
  rationale: ἀναφωνέω bezeichnet lautes Ausrufen; die Wendung κραυγῇ μεγάλῃ verstärkt die hörbare Intensität. Im Deutschen gibt „rief mit lauter Stimme“ dies natürlich wieder, während der Doppelbegriff „und sagte“ ohne Bedeutungsverlust in die folgende direkte Rede überführt werden kann.
- source_word: Εὐλογημένη σὺ
  choice: Gesegnet bist du
  rationale: Das perfekt-passive Partizip hat prädikative Funktion. Die vorangestellte Formulierung bewahrt den feierlichen Ausruf und den Parallelismus des griechischen Satzes.
- source_word: ἐν γυναιξίν
  choice: unter den Frauen
  rationale: Die Wendung hebt Maria im Kreis der Frauen hervor. „Allen“ wird nicht ergänzt, da es im griechischen Text nicht ausdrücklich steht.
- source_word: εὐλογημένος
  choice: gesegnet ist
  rationale: Die gleiche Wiedergabe wie beim ersten εὐλογημένη erhält den bewussten Parallelismus zwischen Maria und ihrem ungeborenen Kind.
- source_word: ὁ καρπὸς τῆς κοιλίας σου
  choice: die Frucht deines Leibes
  rationale: Die traditionelle, im Deutschen verständliche Metapher bewahrt καρπός und gibt κοιλία im Zusammenhang der Schwangerschaft als „Leib“ wieder. Dadurch bleibt die körperlich-mütterliche Bildsprache erhalten.
theological_decisions:
- issue: Segensformel an Maria
  choice: Gesegnet bist du unter den Frauen
  alternative: Du bist unter den Frauen gesegnet
  rationale: Die gewählte Wortstellung bewahrt den ausrufenden, feierlichen Charakter und sagt weder weniger noch mehr über Marias Stellung aus, als der Text selbst.
- issue: Bezeichnung des ungeborenen Kindes
  choice: die Frucht deines Leibes
  alternative: das Kind in deinem Leib
  rationale: Die Metapher des Ausgangstextes bleibt erhalten, ohne die klare Bezugnahme auf das ungeborene Kind umzudeuten oder theologischen Zusatz einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die Formulierung bleibt gut verständlich und wahrt den Parallelismus der beiden Segensaussagen.
