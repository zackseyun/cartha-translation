id: LUK.1.48
reference: Luke 1:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: de
  text: weil er auf die Niedrigkeit[a] seiner Sklavin[b] geblickt hat. Denn siehe, von nun an werden mich alle Generationen glücklich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Erniedrigung“ oder „niedrigen Stand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dienerin“; traditionell „Magd“. Das griechische Wort bezeichnet wörtlich eine Sklavin.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: hat auf … geblickt
  rationale: Die Wendung bezeichnet Gottes aufmerksame, hier gnädige Zuwendung. Das deutsche Perfekt gibt die fortdauernde Bedeutung seines Handelns für Marias gegenwärtigen Lobpreis natürlich wieder.
- source_word: ταπείνωσιν
  choice: Niedrigkeit
  rationale: Das Wort kann einen niedrigen Stand, Erniedrigung oder Demütigung bezeichnen. „Niedrigkeit“ bewahrt die Mehrdeutigkeit und verweist hier eher auf Marias geringe gesellschaftliche Stellung als ausschließlich auf eine innere Tugend.
- source_word: δούλης
  choice: Sklavin
  rationale: Die feminine Form von δοῦλος bezeichnet grundsätzlich eine versklavte beziehungsweise einem Herrn gehörende Frau. Zusammen mit „seiner“ tritt Marias völlige Zugehörigkeit zu Gott hervor; die Fußnote nennt die im Deutschen kontextuell mögliche mildere Wiedergabe.
- source_word: ἰδοὺ
  choice: siehe
  rationale: „Siehe“ erhält den hinweisenden und nachdrücklichen Charakter des Ausdrucks und passt zum gehobenen poetischen Register des Lobgesangs.
- source_word: ἀπὸ τοῦ νῦν
  choice: von nun an
  rationale: Dies ist die natürliche moderne deutsche Entsprechung und bewahrt die in die Zukunft gerichtete Zeitangabe.
- source_word: μακαριοῦσίν με
  choice: werden mich … glücklich preisen
  rationale: Das Verb bedeutet, jemanden als glücklich beziehungsweise gesegnet zu bezeichnen oder zu rühmen. „Glücklich preisen“ ist verständlich und erhält den öffentlichen anerkennenden Sinn, ohne das Ergebnis auf bloßes Benennen zu reduzieren.
- source_word: πᾶσαι αἱ γενεαί
  choice: alle Generationen
  rationale: Die Formulierung bezeichnet die aufeinanderfolgenden Generationen. „Alle Generationen“ ist prägnant; dass die künftigen gemeint sind, ergibt sich bereits aus „von nun an“.
theological_decisions:
- issue: Marias Selbstbezeichnung δούλη
  choice: seine Sklavin
  alternative: seine Dienerin / Magd
  rationale: „Sklavin“ lässt die starke Aussage völliger Zugehörigkeit zu Gott stehen, ohne daraus spätere mariologische Lehren abzuleiten. Geläufigere, aber abschwächende Alternativen werden in der Fußnote offengelegt.
- issue: Bedeutung von ταπείνωσις
  choice: Niedrigkeit
  alternative: Erniedrigung / niedriger Stand
  rationale: Die Wiedergabe hält offen, ob vor allem Marias geringe Stellung oder eine erfahrene Erniedrigung bezeichnet wird, und verengt den Ausdruck nicht auf persönliche Demut.
- issue: Bedeutung von μακαρίζω
  choice: glücklich preisen
  alternative: seligpreisen / glücklich nennen
  rationale: Die Formulierung bezeichnet die künftige öffentliche Anerkennung ihres von Gott geschenkten Glücks, ohne „selig“ mit späteren fachtheologischen Bedeutungen zu belasten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem poetischem Ton. „Denn siehe“ bewahrt den Nachdruck des Lobgesangs; „Sklavin“ ist bewusst quellennah und wird durch eine erklärende Fußnote ergänzt.
