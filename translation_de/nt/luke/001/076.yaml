id: LUK.1.76
reference: Luke 1:76
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: de
  text: Und auch du, Kind, wirst Prophet des Höchsten genannt werden; denn du wirst dem Herrn[a] vorangehen, um seine Wege vorzubereiten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Gegenwart des Herrn“. Die Präposition kann sowohl „vor“ als auch „in der Gegenwart von“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung erinnert an prophetische Verheißungen über die Bereitung des Weges vor dem Herrn (vgl. Jesaja 40,3; Maleachi 3,1). Im Bericht des Lukas erfüllt sich dies im Wirken des Johannes vor Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Und auch du
  rationale: Die Wendung leitet betont zur Anrede des Kindes über. „Auch“ gibt die additive Nuance in natürlichem Deutsch wieder.
- source_word: παιδίον
  choice: Kind
  rationale: Die direkte Anrede gilt dem neugeborenen Johannes. „Kind“ ist präzise und im Deutschen natürlich.
- source_word: προφήτης Ὑψίστου
  choice: Prophet des Höchsten
  rationale: Die Genitivverbindung und der ehrfürchtige Gottestitel bleiben in einer geläufigen deutschen Form erhalten.
- source_word: κληθήσῃ
  choice: wirst … genannt werden
  rationale: Das Futur Passiv bezeichnet hier Benennung beziehungsweise Anerkennung; die gewählte Form bleibt nah am Griechischen und ist idiomatisch.
- source_word: προπορεύσῃ
  choice: wirst … hergehen
  rationale: Das Verb bezeichnet das Vorausgehen vor jemandem. In Verbindung mit „vor dem Herrn“ bringt „hergehen“ die Wegbereiterfunktion klar zum Ausdruck.
- source_word: ἐνώπιον κυρίου
  choice: vor dem Herrn
  rationale: ἐνώπιον kann sowohl ein Vorausgehen vor jemandem als auch ein Handeln in dessen Gegenwart bezeichnen. „Vor dem Herrn“ bewahrt diese Offenheit am besten.
- source_word: ἑτοιμάσαι
  choice: um … vorzubereiten
  rationale: Der Infinitiv drückt den Zweck des Vorausgehens aus; die deutsche Konstruktion mit „um“ macht diese Beziehung eindeutig.
- source_word: ὁδοὺς αὐτοῦ
  choice: seine Wege
  rationale: Der Plural des griechischen Textes bleibt erhalten und lässt zugleich den Anklang an die prophetischen Verheißungen erkennen.
theological_decisions:
- issue: Bezug von „der Herr“ in der Wegbereiterverheißung
  choice: „der Herr“ ohne nähere Festlegung des Bezuges
  alternative: ausdrückliche Deutung entweder auf Gott im alttestamentlichen Hintergrund oder auf Jesus in der lukanischen Erfüllung
  rationale: Die Formulierung greift prophetische Texte über die Bereitung des Weges vor dem Herrn auf, während Lukas Johannes als Wegbereiter Jesu darstellt. Die Übersetzung wahrt diese theologische Spannung, statt sie im Wortlaut aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die Satzstruktur bleibt nahe am griechischen Gedankengang, ohne im Deutschen steif zu wirken. Die Fußnotenmarkierung [a] steht bei der tatsächlich erläuterten Wendung „vor dem Herrn“.
