  rationale: Die Revision beschränkt sich auf eine sichere idiomatische und semantische Verbesserung von προπορεύσῃ sowie auf die dazu passende Präzisierung der lexikalischen Fußnote. Alle übrigen Übersetzungsentscheidungen, einschließlich der bewusst offenen Wiedergabe von κύριος als „der Herr“, bleiben erhalten.
