    rationale: „Hergehen“ bedeutet im heutigen Deutsch nicht verlässlich „vorausgehen“ und kann eine sprecherbezogene Bewegungsrichtung nahelegen. „dem Herrn vorangehen“ gibt die forerunner-Bedeutung präzise und idiomatisch wieder.
  - severity: low
    issue: Formulierung der lexikalischen Fußnote
    rationale: Die mögliche Bedeutung „in der Gegenwart“ betrifft primär ἐνώπιον. In der konkreten Verbindung mit προπορεύσῃ ist das Vorausgehen der klare Satzsinn. Eine enger gefasste Fußnote bewahrt die lexikalische Information ohne den Kontext zu verwischen.
  revised_text: Und auch du, Kind, wirst Prophet des Höchsten genannt werden; denn du wirst dem Herrn[a] vorangehen, um seine Wege vorzubereiten[b].
