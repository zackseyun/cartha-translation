id: LUK.1.13
reference: Luke 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: de
  text: 'Doch der Engel sagte zu ihm: „Fürchte dich nicht, Zacharias, denn dein Gebet[a] ist erhört worden. Deine Frau Elisabet wird dir einen Sohn gebären, und du sollst ihm den Namen Johannes geben.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Bitte; auch: dein Flehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Du sollst seinen Namen Johannes nennen.'
    reason: literal_rendering
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Doch ... sagte
  rationale: δέ markiert hier einen leichten Übergang mit einem schwachen Gegensatz zu Zacharias’ Erschrecken; „doch“ gibt dies natürlich wieder, ohne den Kontrast zu überzeichnen.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Im Erzählzusammenhang bezeichnet ἄγγελος einen himmlischen Boten; „Engel“ ist die klare und etablierte deutsche Wiedergabe.
- source_word: Μὴ φοβοῦ
  choice: Fürchte dich nicht
  rationale: Die geläufige, würdige deutsche Formulierung entspricht dem Verbot und passt zu Zacharias’ unmittelbar zuvor geschilderter Angst.
- source_word: Ζαχαρία
  choice: Zacharias
  rationale: „Zacharias“ ist die im Deutschen eingebürgerte biblische Namensform.
- source_word: διότι
  choice: denn
  rationale: διότι führt den Grund an, weshalb Zacharias sich nicht fürchten soll; „denn“ verbindet die Aussagen idiomatisch und bewahrt den begründenden Sinn.
- source_word: εἰσηκούσθη
  choice: ist erhört worden
  rationale: 'Bei einem an Gott gerichteten Gebet meint das Passiv mehr als bloßes akustisches Hören: Die Bitte hat Gehör gefunden. Das Passiv lässt den Handelnden wie im Griechischen unausgesprochen.'
- source_word: ἡ δέησίς σου
  choice: dein Gebet
  rationale: δέησις bezeichnet eine dringliche Bitte, besonders im Gebet. „Gebet“ ist im Kontext natürlich; die speziellere Bedeutung „Bitte“ wird in einer Fußnote genannt.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: deine Frau Elisabet
  rationale: Mit dem Possessivpronomen und im familiären Zusammenhang bedeutet γυνή eindeutig „Frau“ im Sinn von Ehefrau. „Elisabet“ ist die gebräuchliche deutsche biblische Namensform.
- source_word: γεννήσει υἱόν σοι
  choice: wird dir einen Sohn gebären
  rationale: Bei weiblichem Subjekt bedeutet γεννάω „gebären“. Der Dativ σοι wird mit „dir“ bewahrt und bezeichnet die persönliche Zuwendung der Verheißung.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: du sollst ihm den Namen Johannes geben
  rationale: Die griechische Benennungsformel wird in natürlichem modernem Deutsch wiedergegeben. Das Futur hat im Zusammenhang der Engelsankündigung zugleich anweisenden Charakter, den „sollst“ angemessen ausdrückt.
- source_word: Ἰωάννην
  choice: Johannes
  rationale: „Johannes“ ist die etablierte deutsche Form des griechischen Namens Ἰωάννης.
theological_decisions:
- issue: Ungenannter Handelnder beim Passiv „ist erhört worden“
  choice: Das Passiv bleibt erhalten und lässt erkennen, dass Gott das Gebet erhört hat, ohne ihn ausdrücklich als Subjekt einzufügen.
  alternative: „Gott hat dein Gebet erhört.“
  rationale: Im jüdischen Gebetskontext ist Gott der natürliche Handelnde. Da der griechische Text ihn jedoch nicht nennt, bewahrt die Übersetzung das sogenannte göttliche Passiv und vermeidet eine ausdrückliche Ergänzung.
- issue: Zukunftsaussage oder Anweisung bei καλέσεις
  choice: „du sollst ihm den Namen Johannes geben“
  alternative: „du wirst ihm den Namen Johannes geben“
  rationale: Das Futur steht in einer Engelsankündigung und bezeichnet nicht nur das künftige Geschehen, sondern trägt auch anweisenden Charakter. „Sollst“ hält diesen Ton fest, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Eingebürgerte biblische Namensformen werden verwendet. Die Formulierung bleibt nah an der griechischen Struktur, wo dies im Deutschen natürlich klingt, und glättet lediglich die semitisch geprägte Benennungsformel im Haupttext.
