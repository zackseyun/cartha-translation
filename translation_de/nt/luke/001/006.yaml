id: LUK.1.6
reference: Luke 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: de
  text: Beide waren vor Gott gerecht und lebten untadelig nach allen Geboten und Satzungen des Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: gerecht
  rationale: „Gerecht“ bewahrt den moralischen und bundestheologischen Gehalt des Ausdrucks, ohne ihn auf bloße Rechtschaffenheit zu verengen.
- source_word: ἀμφότεροι
  choice: beide
  rationale: Das Wort betont, dass die Aussage gleichermaßen für Zacharias und Elisabet gilt.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung bewahrt den Gedanken, dass ihr Leben Gottes Urteil und Blick ausgesetzt war.
- source_word: πορευόμενοι
  choice: lebten
  rationale: Das Partizip bezeichnet hier bildhaft die Lebensführung; „lebten“ gibt diesen ethischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: hielten sich an alle Gebote
  rationale: Diese Formulierung gibt den Gedanken einer umfassenden Lebensführung gemäß den Geboten idiomatisch wieder.
- source_word: δικαιώμασιν
  choice: Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet festgesetzte göttliche Satzungen und bleibt von „Geboten“ unterscheidbar.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Die traditionelle und sachgerechte Wiedergabe bezeichnet hier den Gott Israels.
- source_word: ἄμεμπτοι
  choice: untadelig
  rationale: Das prädikative Adjektiv beschreibt ihre Lebensführung als ohne berechtigten Tadel; die deutsche Satzstellung verbindet es natürlich mit dem Halten der Gebote und Bestimmungen.
- source_word: ἦσαν δὲ
  choice: lebten
  rationale: δέ ist ein schwacher erzählerischer Anschluss, der im Deutschen nicht eigens ausgedrückt werden muss; ἦσαν wird zusammen mit dem Partizip als fortdauernde Lebensführung wiedergegeben.
theological_decisions:
- issue: Ob ἄμεμπτοι absolute Sündlosigkeit bezeichnet
  choice: Die Übersetzung beschreibt eine untadelige Lebensführung vor Gott, ohne den Begriff abzuschwächen.
  alternative: Den Ausdruck ausdrücklich als bloß menschliche oder relative Unbescholtenheit erklären.
  rationale: Der Text macht eine starke positive Aussage über ihre Treue zu Gottes Geboten, behauptet aber nicht ausdrücklich metaphysische oder absolute Sündlosigkeit. Die Spannung bleibt daher unaufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ethische Metapher des „Wandelns“ wird zugunsten des allgemein verständlichen „lebten“ semantisch wiedergegeben. Keine Fußnote ist erforderlich, da die wesentlichen Bedeutungsnuancen im Haupttext erhalten bleiben.
