  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: de
  text: Und selig ist diejenige, die geglaubt hat, dass das, was ihr vom Herrn gesagt worden ist, in Erfüllung gehen wird[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil das, was ihr vom Herrn gesagt worden ist, in Erfüllung gehen wird“. Das griechische Bindewort kann auch eine Begründung einleiten; hier ist die Bedeutung „dass“ jedoch wahrscheinlicher.'
    reason: alternative_reading
  - marker: b
    text: Für „in Erfüllung gehen“ sind auch „vollendet werden“ oder „zur Ausführung kommen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: selig
  rationale: „Selig“ bewahrt in diesem Segensspruch das religiöse Gewicht von μακάριος besser als das stärker gefühlsbezogene „glücklich“.
- source_word: ἡ πιστεύσασα
  choice: die, die geglaubt hat
  rationale: Das substantivierte Aoristpartizip bezeichnet Maria als diejenige, die geglaubt hat; die Formulierung ist im modernen Deutsch klar und erhält den vollzogenen Glaubensakt.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier am natürlichsten den Inhalt ihres Glaubens ein. Die mögliche kausale Lesart „weil“ wird in einer Fußnote bewahrt.
- source_word: τελείωσις
  choice: sich erfüllen wird
  rationale: Die verbale deutsche Wendung gibt das Zu-Ende-Bringen beziehungsweise Eintreffen der göttlichen Zusage natürlich wieder.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: was ihr gesagt worden ist
  rationale: Die Formulierung gibt das substantivierte Perfektpassiv als vorausgegangene, weiterhin maßgebliche Rede wieder, ohne im Deutschen unnötig schwerfällig zu klingen.
- source_word: παρὰ κυρίου
  choice: vom Herrn
  rationale: παρά mit Genitiv bezeichnet hier bei einer Mitteilung deren Ursprung; „vom Herrn“ ist im Deutschen natürlich und lässt zugleich Quelle und mittelbare Sprechhandlung offen.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ entspricht dem lukanischen Gebrauch von κύριος und bezeichnet hier Gott als Ursprung der Zusage.
theological_decisions:
- issue: Verhältnis von Marias Seligpreisung, ihrem Glauben und der verheißenen Erfüllung
  choice: Maria wird als selig bezeichnet, weil sie glaubte, dass das ihr vom Herrn Gesagte erfüllt werden wird.
  alternative: Maria ist selig, weil sich erfüllen wird, was ihr vom Herrn gesagt wurde.
  rationale: Die Syntax legt am ehesten nahe, ὅτι als Inhaltssatz zu πιστεύσασα zu verstehen. Die kausale Deutung bleibt möglich und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Selig“ erhält den Charakter eines biblischen Segensspruchs; die übrige Syntax ist bewusst klar und gegenwärtig gehalten.
