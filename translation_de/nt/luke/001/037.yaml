  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: de
  text: Denn kein Wort von Gott wird unmöglich sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn bei Gott wird nichts unmöglich sein.“'
    reason: Alternative grammatisch und traditionsgeschichtlich gut belegte Deutung von παρὰ τοῦ θεοῦ πᾶν ῥῆμα.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet Gabriels vorangehende Aussage. „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: οὐκ ἀδυνατήσει
  choice: wird unmöglich sein
  rationale: Das Futur von ἀδυνατέω bezeichnet hier, dass etwas unmöglich ist bzw. sich als unmöglich erweist. Die gewählte Form bewahrt Futur und Negation.
- source_word: παρὰ τοῦ θεοῦ
  choice: von Gott
  rationale: παρά mit Genitiv kann die Herkunft bezeichnen. In Verbindung mit ῥῆμα lässt „von Gott“ das Wort als von Gott ausgehend erkennen, ohne die ebenfalls mögliche Lesart „bei Gott“ zu verschweigen.
- source_word: πᾶν
  choice: kein
  rationale: Das formal universale πᾶν wird zusammen mit der Verbnegation idiomatisch als „kein … wird unmöglich sein“ wiedergegeben; der umfassende Sinn bleibt erhalten.
- source_word: ῥῆμα
  choice: Wort
  rationale: „Wort“ bewahrt den ausdrücklichen Bezug auf eine Äußerung und passt zum unmittelbar zuvor verkündeten Gotteswort. „Sache“ wäre weiter, „Verheißung“ stärker deutend.
theological_decisions:
- issue: Sinn von παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Kein Wort von Gott wird unmöglich sein.
  alternative: Denn bei Gott wird nichts unmöglich sein.
  rationale: Der Haupttext bewahrt das ausdrücklich vorhandene ῥῆμα („Wort“) und versteht παρά mit Genitiv als Herkunftsangabe. Die traditionelle, grammatisch und kontextuell mögliche Wiedergabe mit „bei Gott“ und „nichts“ bleibt in der Fußnote erhalten, sodass die Spannung nicht aufgelöst wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzgestalt folgt dem griechischen Aussagesatz; „Denn“ stellt den begründenden Anschluss an den Kontext her.
