  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: de
  text: Rettung vor unseren Feinden und aus der Hand aller, die uns hassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heil vor unseren Feinden und aus der Gewalt aller, die uns hassen.“'
    reason: Lexikalische Alternative für σωτηρία und idiomatische Wiedergabe von ἐκ χειρός.
lexical_decisions:
- source_word: σωτηρίαν
  choice: Rettung
  rationale: Das Substantiv bezeichnet hier angesichts der ausdrücklich genannten Feinde konkrete Rettung, ohne den umfassenderen heilsgeschichtlichen Sinn im Lobgesang auszuschließen. „Heil“ wäre ebenfalls möglich, klingt im heutigen Deutsch jedoch stärker ausschließlich theologisch.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: vor unseren Feinden
  rationale: Bei „Rettung“ ist „vor unseren Feinden“ idiomatisches modernes Deutsch und gibt die durch ἐξ bezeichnete Befreiung beziehungsweise Trennung wieder. Das im Griechischen nicht ausdrücklich stehende „Macht“ wird nicht ergänzt.
- source_word: ἐκ χειρὸς
  choice: aus der Hand
  rationale: Die wörtliche Wiedergabe bewahrt das verständliche biblische Bild für Macht und Gewalt sowie dessen Anklänge an die Sprache der Septuaginta.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: aller, die uns hassen
  rationale: Das substantivierte Präsenspartizip wird natürlich wiedergegeben und behält den charakteristischen beziehungsweise andauernden Sinn des Hassens.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Wendungen schlicht miteinander; „und“ ist genau und deutungsarm.
theological_decisions:
- issue: Art der verheißenen Rettung in der Prophetie des Zacharias
  choice: „Rettung“ bewahrt den konkreten Bezug auf feindliche Bedrohung und bleibt zugleich für den weiteren heilsgeschichtlichen Sinn in Lukas 1 offen.
  alternative: „Heil“ könnte das größere theologische Bedeutungsfeld stärker hervorheben; „Befreiung“ könnte den politisch-konkreten Aspekt stärker betonen.
  rationale: Der Vers nennt Feinde und Hassende ausdrücklich, während der Zusammenhang des Lobgesangs die Rettung in Gottes umfassendes Erlösungshandeln einordnet. Die Übersetzung soll weder auf rein politische Befreiung noch auf ausschließlich geistliches Heil verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „aus der Hand“ erhält das biblische Bild; die Fußnote erschließt dessen Bedeutung „aus der Gewalt“. Der Satz ist als Fortsetzung des vorhergehenden Verses formuliert.
