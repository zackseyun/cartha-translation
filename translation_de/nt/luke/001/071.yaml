  source_fidelity: Der Haupttext gibt σωτηρίαν angemessen mit „Rettung“ wieder und lässt sowohl konkrete Befreiung als auch den weiteren soteriologischen Horizont offen. „vor unseren Feinden“ ist bei „Rettung“ idiomatisch und überträgt die Befreiung von den Feinden hinreichend. „aus der Hand aller“ bewahrt das griechische und biblische Machtbild von ἐκ χειρός. Die koordinierte Struktur sowie das substantivierte Partizip („aller, die uns hassen“) sind vollständig abgebildet.
  naturalness: 'Der Haupttext ist natürliches, würdiges modernes Standarddeutsch und als Satzfortsetzung gut verwendbar. Die bisherige Fußnotenformulierung „Heil von unseren Feinden“ ist jedoch semantisch missverständlich: Sie kann im Deutschen auch ausdrücken, dass das Heil von den Feinden herkommt. Daher ist eine kleine, sichere Korrektur der Fußnote erforderlich.'
  terminology: „Rettung“ ist hier eine treffende, nicht einengende Wahl für σωτηρία. Das Bild „aus der Hand“ ist im Deutschen verständlich und bibelsprachlich angemessen; „aus der Gewalt“ erläutert es als sinnvolle Alternative. „Heil“ bleibt als lexikalische Alternative möglich, sollte aber mit „vor“ statt „von“ verbunden werden.
