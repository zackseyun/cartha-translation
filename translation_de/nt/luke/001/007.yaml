source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: de
  text: Und sie hatten kein Kind, weil Elisabet unfruchtbar war; und beide waren bereits hochbetagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihren Tagen weit vorgerückt“.'
    reason: Die Fußnote bewahrt das konkrete Bild der griechischen Alterswendung, während der Haupttext deren natürliche deutsche Bedeutung wiedergibt.
lexical_decisions:
- source_word: τέκνον
  choice: Kind
  rationale: Der Singular wird mit „Kind“ wiedergegeben; „Kinder“ würde den Numerus unnötig verändern, „Nachkommen“ klänge hier distanzierter.
- source_word: καθότι
  choice: weil
  rationale: Die Konjunktion gibt den Grund für ihre Kinderlosigkeit an; „weil“ ist die klare und natürliche kausale Entsprechung.
- source_word: στεῖρα
  choice: unfruchtbar
  rationale: Das Wort bezeichnet hier ausdrücklich Elisabets Unfähigkeit, Kinder zu bekommen. „Kinderlos“ würde nur das bereits genannte Ergebnis wiederholen und die Ursache verwischen.
- source_word: ἀμφότεροι
  choice: beide
  rationale: „Beide“ bezieht die Aussage ausdrücklich auf Elisabet und Zacharias und entspricht dem griechischen Ausdruck knapp und natürlich.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: hochbetagt
  rationale: Die griechische Wendung besagt respektvoll, dass beide in hohem Alter waren. „Hochbetagt“ ist im modernen Deutschen prägnant und würdevoll; die bildhafte Formulierung wird in der Fußnote dokumentiert.
- source_word: οὐκ ἦν αὐτοῖς
  choice: sie hatten kein
  rationale: Die griechische Konstruktion bedeutet wörtlich etwa „ihnen war kein [Kind]“ und wird im Deutschen idiomatisch als Besitzkonstruktion wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das zweimalige „und“ bildet die fortlaufende griechische Satzverknüpfung ab; das Semikolon macht die beiden Begründungselemente im Deutschen übersichtlich.
