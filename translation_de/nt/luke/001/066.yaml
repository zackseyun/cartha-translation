source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: de
  text: 'Und alle, die davon hörten, bewahrten es in ihren Herzen und sagten: »Was wird wohl aus diesem Kind werden?«[a] Denn die Hand des Herrn war mit ihm.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was wird dieses Kind sein?« Gemeint ist die Frage nach seiner künftigen Entwicklung, Identität oder Aufgabe.'
    reason: lexical_alternative
  - marker: b
    text: »Die Hand des Herrn« ist eine biblische Bildrede für Gottes wirksame Macht, Gunst oder Führung.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: nahmen es sich zu Herzen
  rationale: Die natürliche deutsche Wendung bewahrt das Herzmotiv und drückt aus, dass die Hörenden das Geschehen innerlich festhielten und weiterbedachten.
- source_word: πάντες οἱ ἀκούσαντες
  choice: alle, die davon hörten
  rationale: „Davon“ nimmt die zuvor berichteten Ereignisse auf, ohne im Deutschen ein unbestimmtes Objekt stehen zu lassen.
- source_word: Τί ἄρα
  choice: Was wird wohl
  rationale: Das Modalwort „wohl“ gibt hier die folgernde und zugleich fragende Nuance von ἄρα idiomatisch wieder.
- source_word: τὸ παιδίον τοῦτο
  choice: diesem Kind
  rationale: „Kind“ ist eine natürliche, altersgemäße Wiedergabe, die nicht unnötig weiter bestimmt.
- source_word: ἔσται
  choice: aus ... werden
  rationale: Wörtlich bedeutet das Verb „sein“; im Zusammenhang fragt die Wendung nach der künftigen Entwicklung, Identität oder Aufgabe des Kindes. Die deutsche Redensart „Was wird aus ... werden?“ vermittelt dies natürlich.
- source_word: καὶ γὰρ
  choice: Denn
  rationale: Die Partikelverbindung begründet die vorangehende Frage. „Denn“ bildet diese Funktion im Deutschen knapp und klar ab.
- source_word: χεὶρ κυρίου
  choice: die Hand des Herrn
  rationale: Die biblische Metapher bleibt erhalten und wird nicht auf eine einzige Bedeutung wie Hilfe, Macht oder Gunst verengt.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: Die Präposition μετά mit Genitiv bedeutet „mit“; das Pronomen verweist natürlich auf das Kind zurück.
theological_decisions:
- issue: Bedeutung der Aussage „die Hand des Herrn war mit ihm“
  choice: Die Metapher als offene Aussage über Gottes wirksame Gegenwart, Macht oder Gunst bewahren.
  alternative: „Der Herr half ihm“ oder „Gottes Kraft ruhte auf ihm“.
  rationale: Der griechische Text legt nicht fest, ob vor allem Schutz, Beistand, Gunst, Führung oder Befähigung gemeint ist. Die bildhafte Formulierung wahrt diese theologische Weite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die feste Wendung „sich etwas zu Herzen nehmen“ und die idiomatische Frage „Was wird aus diesem Kind werden?“ sorgen für Natürlichkeit; die Gottesmetapher bleibt bewusst formal erhalten.
