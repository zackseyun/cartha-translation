  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: de
  text: um seinem Volk Erkenntnis des Heils in der Vergebung ihrer Sünden zu geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Vergebung ihrer Sünden“; auch möglich: „aufgrund der Vergebung ihrer Sünden“.'
    reason: Lexikalisch-syntaktische Alternative für ἐν mit dem Dativ.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: um … zu geben
  rationale: Der artikulierte Infinitiv drückt hier, abhängig vom vorhergehenden Vers, den Zweck aus. Die deutsche Konstruktion „um … zu geben“ gibt diese Funktion natürlich und direkt wieder.
- source_word: γνῶσιν
  choice: Erkenntnis
  rationale: „Erkenntnis“ entspricht γνῶσις in diesem Zusammenhang präzise und bewahrt den Gedanken eines vermittelten Wissens, ohne dessen Art näher festzulegen.
- source_word: σωτηρίας
  choice: des Heils
  rationale: Der Genitiv wird formal als „des Heils“ wiedergegeben. „Heil“ ist im lukanischen Zusammenhang angemessen und als biblisch-theologischer Ausdruck im modernen Standarddeutsch verständlich.
- source_word: τῷ λαῷ αὐτοῦ
  choice: seinem Volk
  rationale: Der Dativ bezeichnet die Empfänger der Erkenntnis; „seinem Volk“ gibt zugleich die possessive und bundestheologische Färbung knapp wieder.
- source_word: ἐν ἀφέσει
  choice: in der Vergebung
  rationale: Die Wiedergabe mit „in“ bewahrt die mögliche Bedeutung von Bereich oder Art und Weise, ohne die Beziehung zwischen Heil und Vergebung vorschnell instrumental oder kausal festzulegen.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: ihrer Sünden
  rationale: Der Plural des griechischen Textes wird bewahrt; das Pronomen bezieht sich natürlich auf das Volk.
theological_decisions:
- issue: Verhältnis von Heil und Vergebung
  choice: „in der Vergebung ihrer Sünden“
  alternative: „durch die Vergebung ihrer Sünden“ oder „aufgrund der Vergebung ihrer Sünden“
  rationale: ἐν mit dem Dativ erlaubt hier eng verwandte Deutungen als Bereich, Art und Weise oder Mittel. „In der Vergebung“ hält die enge Verbindung fest, ohne sie ausschließlich instrumental oder kausal zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erkenntnis des Heils“ und „Vergebung ihrer Sünden“ bewahren die prägnante biblische Ausdrucksweise; der Vers bleibt als abhängige Zweckangabe syntaktisch an den vorhergehenden Kontext angeschlossen.
