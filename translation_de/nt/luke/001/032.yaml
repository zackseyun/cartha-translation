id: LUK.1.32
reference: Luke 1:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: de
  text: Er wird groß sein und Sohn des Höchsten genannt werden, und Gott, der Herr, wird ihm den Thron seines Vaters David geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sein Vater“ bezeichnet David als königlichen Vorfahren Jesu in der davidischen Linie.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Er
  rationale: Das Demonstrativpronomen verweist auf das zuvor angekündigte Kind; im natürlichen Deutschen ist das Personalpronomen hier angemessener als das steife „Dieser“.
- source_word: ἔσται μέγας
  choice: wird groß sein
  rationale: Die einfache Zukunft und die weite Bedeutung von μέγας werden unmittelbar und ohne unnötige Einengung wiedergegeben.
- source_word: υἱὸς Ὑψίστου
  choice: Sohn des Höchsten
  rationale: Die artikellose Prädikatsbezeichnung ist im Deutschen natürlich als Titel ohne unbestimmten Artikel wiederzugeben; „der Höchste“ bewahrt den biblischen Gottesnamen.
- source_word: κληθήσεται
  choice: genannt werden
  rationale: Das Futur Passiv von καλέω bezeichnet hier die Benennung beziehungsweise Anerkennung unter einem Titel.
- source_word: κύριος ὁ θεὸς
  choice: Gott, der Herr
  rationale: Diese geläufige deutsche Formulierung bewahrt beide griechischen Bezeichnungen und macht κύριος nicht unberechtigt zum Ersatz für das Tetragramm.
- source_word: δώσει αὐτῷ
  choice: wird ihm … geben
  rationale: Die schlichte Bedeutung des Verbs und der Dativbezug werden idiomatisch bewahrt.
- source_word: τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ
  choice: den Thron seines Vaters David
  rationale: Die deutsche Genitivfügung gibt die Beziehung klar wieder und erhält πατήρ als „Vater“, statt den dynastischen Sinn bereits interpretierend mit „Vorfahre“ aufzulösen.
theological_decisions:
- issue: Christologischer Titel υἱὸς Ὑψίστου
  choice: Sohn des Höchsten
  alternative: ein Sohn des Höchsten
  rationale: Die Wendung fungiert im Kontext als Titel. Die Übersetzung wahrt ihre starke Sohnschaftsaussage, ohne spätere dogmatische Formulierungen in den Text einzutragen.
- issue: Wiedergabe von κύριος ὁ θεὸς
  choice: Gott, der Herr
  alternative: der Herr, Gott; der HERR, Gott
  rationale: „Gott, der Herr“ ist würdiges, verständliches Deutsch und bewahrt κύριος als „Herr“. Kapitälchen würden ein im griechischen Text nicht ausdrücklich vorhandenes Tetragramm voraussetzen.
- issue: David als πατήρ Jesu
  choice: seines Vaters David
  alternative: seines Vorfahren David
  rationale: „Vater“ bleibt eng am Wortlaut und erhält zugleich die königlich-dynastische Spannung. Eine Fußnote erklärt, dass hier die davidische Abstammungslinie gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wortstellung „den Thron seines Vaters David“ ist natürlicher als „den Thron Davids, seines Vaters“ und bewahrt dennoch den engen Bezug des griechischen Genitivs.
