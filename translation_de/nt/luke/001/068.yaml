  naturalness: Modernes, würdiges Standarddeutsch. Die Ausrufsform passt zur benediktionalen Lobpreisformel. Die Satzverbindung und das Pronomen „ihm“ sind klar und nicht schwerfällig.
  terminology: „Herr“, „Gott Israels“ und „Erlösung“ sind sachgerecht und schriftsprachlich etabliert. „Besucht“ bewahrt die biblische Bildsprache von ἐπεσκέψατο, ohne deren Bedeutung einseitig auf eine Deutung zu reduzieren.
