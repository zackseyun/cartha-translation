id: LUK.1.68
reference: Luke 1:68
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: de
  text: Gepriesen sei der Herr, der Gott Israels! Denn er hat sein Volk besucht[a] und ihm Erlösung gebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist seinem Volk zu Hilfe gekommen«. Das griechische Wort für »besuchen« bezeichnet hier Gottes aufmerksames und rettendes Eingreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Gepriesen sei
  rationale: Die prädikative Segensformel wird als würdevoller, im Deutschen natürlicher Lobpreis wiedergegeben.
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: der Herr, der Gott Israels
  rationale: Bewahrt den göttlichen Titel und die appositionelle, alttestamentlich geprägte Bezeichnung.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet idiomatisch den Grund für den vorausgehenden Lobpreis ein.
- source_word: ἐπεσκέψατο
  choice: hat ... besucht
  rationale: Bewahrt die biblische Metapher vom aufmerksamen, rettenden Eingreifen Gottes, ohne sie auf eine einzelne Deutung zu verengen.
- source_word: ἐποίησεν λύτρωσιν
  choice: Erlösung gebracht
  rationale: Gibt die griechische Wendung natürlich wieder und erhält das theologisch gewichtige Erlösungsmotiv.
- source_word: τῷ λαῷ αὐτοῦ
  choice: seinem Volk / ihm
  rationale: Der Dativ bezeichnet hier den Empfänger beziehungsweise Begünstigten; das Pronomen verhindert im Deutschen eine schwerfällige Wiederholung.
theological_decisions:
- issue: Bildsprache des göttlichen Besuchs
  choice: hat sein Volk besucht
  alternative: ist seinem Volk zu Hilfe gekommen
  rationale: Die Formulierung erhält die schriftgeprägte Rede von Gottes Heimsuchung beziehungsweise zugewandtem Eingreifen und erklärt sie nicht vorschnell aus.
- issue: Bedeutungsumfang von λύτρωσις
  choice: Erlösung
  alternative: Befreiung
  rationale: „Erlösung“ wahrt sowohl den Gedanken rettender Befreiung als auch den möglichen Loskaufklang des griechischen Wortes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schriftsprachlichem Klang. Der Ausruf markiert die Segens- und Lobpreisformel; die Fußnote erläutert die heute erklärungsbedürftige biblische Besuchsmetapher.
