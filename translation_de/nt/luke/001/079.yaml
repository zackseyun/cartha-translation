  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: de
  text: um denen zu leuchten, die in Finsternis und im Schatten des Todes sitzen[a], und unsere Füße auf den Weg des Friedens zu lenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Todesschatten“; manche verstehen die Wendung weiter gefasst als „in tiefer Finsternis“, doch im Griechischen wird der Tod ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: Licht zu bringen
  rationale: Die Wiedergabe bewahrt das Bild des aufstrahlenden Lichts und ist im Deutschen mit dem Dativ der Personen natürlich. Gegenüber „zu erscheinen“ tritt die Lichtmetaphorik deutlicher hervor.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: denen, die in Finsternis ... sitzen
  rationale: „Sitzen“ gibt καθημένοις konkret wieder und erhält den poetischen sowie jesajanischen Bildklang, ohne ihn zu „leben“ oder „wohnen“ abzuschwächen.
- source_word: σκότει
  choice: Finsternis
  rationale: „Finsternis“ ist eine würdige und verständliche Wiedergabe, die sowohl die bildliche als auch eine mögliche konkrete Bedeutung offenhält.
- source_word: σκιᾷ θανάτου
  choice: im Schatten des Todes
  rationale: Die Formulierung gibt den ausdrücklichen Genitiv θανάτου wieder und bewahrt den biblischen Bildzusammenhang. Eine Auflösung zu „tiefer Finsternis“ würde den Tod aus dem Haupttext entfernen.
- source_word: τοῦ κατευθῦναι
  choice: zu lenken
  rationale: „Lenken“ passt natürlich zur Metapher der Füße und drückt zielgerichtete Führung aus, ohne das Verb übermäßig wörtlich als „gerade machen“ wiederzugeben.
- source_word: τοὺς πόδας ἡμῶν
  choice: unsere Füße
  rationale: Die konkrete Körpermetapher bleibt erhalten und wird nicht zum abstrakten „uns“ verflacht.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: auf den Weg des Friedens
  rationale: Bei einem Weg ist „auf“ im Deutschen idiomatischer als das formale „in“. „Weg des Friedens“ wahrt die qualitative Offenheit der artikellosen griechischen Wendung und ihre poetische Kraft.
theological_decisions:
- issue: Bildhafte Sprache gegenüber deutender Auflösung
  choice: Die Bilder von Finsternis, Todesschatten, Füßen und Friedensweg bleiben im Haupttext erhalten.
  alternative: Die Bilder als geistliche Unwissenheit, Todesgefahr oder einen Frieden hervorbringenden Lebenswandel auszudeuten.
  rationale: Der poetische und anspielungsreiche Wortlaut legt keine einzige Ausdeutung fest. Die Übersetzung soll diese theologische Spannung nicht durch Paraphrase auflösen.
- issue: Bedeutung von σκιᾷ θανάτου
  choice: „Schatten des Todes“ mit ausdrücklicher Nennung des Todes.
  alternative: „tiefe Finsternis“ oder „Todesschatten“.
  rationale: Obwohl der zugrunde liegende biblische Ausdruck auch besonders tiefe Dunkelheit bezeichnen kann, nennt der griechische Text ausdrücklich θάνατος. Die traditionelle Bildstruktur soll daher erhalten bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die Satzstruktur bleibt als Zwecksatz an den vorausgehenden Kontext anschließbar; die konkreten biblischen Bilder werden nicht erklärend aufgelöst.
