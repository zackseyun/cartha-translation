id: LUK.1.17
reference: Luke 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: de
  text: Und er wird vor ihm hergehen im Geist und in der Kraft Elia[c], um die Herzen der Väter den Kindern zuzuwenden[a] und die Ungehorsamen zur Einsicht der Gerechten zu führen[b], um dem Herrn ein Volk zu bereiten, das vorbereitet ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den Kindern entgegenzuwenden“. Die Formulierung greift Maleachi 3,24 (in anderer Zählung 4,6) auf und kann die Wiederherstellung familiärer Beziehungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „zur Gesinnung der Gerechten“ oder „zur Besonnenheit der Gerechten“.'
    reason: lexical_alternative
  - marker: c
    text: „Im Geist und in der Kraft Elia“ bezeichnet einen Elia entsprechenden prophetischen Dienst und eine entsprechende Bevollmächtigung; die Wendung sagt nicht ausdrücklich, dass Elia persönlich zurückkehrt.
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: wird vor ihm hergehen
  rationale: Die Wendung bewahrt sowohl den räumlichen Sinn des Vorausgehens als auch den Gedanken eines vorangehenden Auftrags, ohne den Bezug von „ihm“ ausdrücklich aufzulösen.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: im Geist und in der Kraft Elias
  rationale: Die transparente Wiedergabe bezeichnet eine Elia entsprechende prophetische Bevollmächtigung und wahrt zugleich die Formulierung des griechischen Textes.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: um die Herzen der Väter den Kindern zuzuwenden
  rationale: „Zuwenden“ gibt die Richtungsbedeutung von ἐπί natürlich wieder und erhält den Anklang an Maleachi.
- source_word: ἀπειθεῖς
  choice: die Ungehorsamen
  rationale: Das Wort bezeichnet Menschen, die sich nicht überzeugen lassen und daher ungehorsam oder widerspenstig sind; „Ungehorsamen“ wahrt die ethische Breite.
- source_word: ἐν φρονήσει δικαίων
  choice: zur Einsicht der Gerechten
  rationale: φρόνησις meint verständige, praktisch-moralische Einsicht. Die Richtungsangabe „zur“ macht den von ἐπιστρέψαι abhängigen Sinn im Deutschen verständlich.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: um dem Herrn ein Volk zu bereiten, das bereit ist
  rationale: Die Formulierung erhält den zweiten Zweckinfinitiv sowie den durch das Perfektpartizip bezeichneten Zustand des Bereitseins; der Dativ κυρίῳ wird mit „dem Herrn“ wiedergegeben.
theological_decisions:
- issue: Identität und Rolle in der Elia-Aussage
  choice: Johannes geht „im Geist und in der Kraft Elias“; der Haupttext behauptet nicht, er sei Elia persönlich.
  alternative: Die Aussage als buchstäbliche persönliche Wiederkehr Elias zu verstehen.
  rationale: Der griechische Text spricht ausdrücklich von Geist und Kraft Elias und beschreibt damit prophetische Kontinuität und Bevollmächtigung, ohne die Personen gleichzusetzen.
- issue: Bezug von „ihm“ und „dem Herrn“
  choice: 'Die knappe Ausdrucksweise des griechischen Textes bleibt erhalten: Er geht „vor ihm“ her und bereitet dem „Herrn“ ein Volk.'
  alternative: „Ihm“ im Haupttext ausdrücklich durch „Jesus“ oder „den Messias“ zu ersetzen.
  rationale: Der Zusammenhang erschließt den Bezug, doch der Vers selbst verwendet ein Pronomen und den Titel κύριος. Eine ausdrückliche Ergänzung würde die im Wortlaut vorhandene Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor ihm hergehen“ und „dem Herrn“ bewahren die knappe biblische Ausdrucksweise; „Einsicht“ und der Relativsatz „das bereit ist“ vermeiden unnötig altertümliche Wörter wie „Klugheit“ im älteren Sinn oder „zugerüstet“.
