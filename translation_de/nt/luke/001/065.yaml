  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: de
  text: Und Furcht[a] kam über alle Menschen, die in ihrer Nähe wohnten, und im ganzen Bergland von Judäa sprach man über all diese Dinge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Furcht“ kann hier auch ehrfürchtiges Erschauern angesichts von Gottes erkennbarem Wirken einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all diese Worte“ beziehungsweise „all diese Begebenheiten“. Das griechische Wort kann sowohl Gesagtes als auch die Ereignisse bezeichnen, von denen gesprochen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: Furcht kam über alle
  rationale: Die deutsche Wendung gibt den Eintritt der Furcht und die Konstruktion mit ἐπί angemessen wieder, ohne das ereignishafte ἐγένετο hölzern mit „es geschah“ zu übersetzen.
- source_word: φόβος
  choice: Furcht
  rationale: „Furcht“ ist die direkte, im Kontext tragfähige Wiedergabe; das Wort kann hier zugleich ehrfürchtiges Erschauern angesichts von Gottes Wirken einschließen.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: die in ihrer Umgebung wohnten
  rationale: Dies bildet das Wohnen ringsum bzw. in der Nähe transparent ab. Das Pronomen αὐτούς wird mit „ihrer“ natürlich auf die im Kontext betroffenen Personen bezogen.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: im ganzen Bergland von Judäa
  rationale: „Bergland“ bezeichnet die judäische Hochlandregion idiomatisch und geografisch passend; „im ganzen“ bewahrt die umfassende Aussage.
- source_word: διελαλεῖτο
  choice: wurde ... gesprochen
  rationale: Das Imperfekt Passiv beschreibt ein fortdauerndes öffentliches Reden und Weitererzählen. Die Formulierung ist natürlich und lässt den Verlauf erkennen.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: all diese Dinge
  rationale: ῥήματα kann Worte, Aussagen oder die berichteten Vorgänge und Angelegenheiten bezeichnen. Im narrativen Zusammenhang ist „Dinge“ idiomatisch, während eine Fußnote die echte Bedeutungsbreite wahrt.
theological_decisions:
- issue: Bedeutungsnuance von φόβος als Reaktion auf erkennbares göttliches Wirken
  choice: Furcht
  alternative: Ehrfurcht; ehrfürchtiges Erschauern
  rationale: Die direkte Wiedergabe lässt offen, in welchem Maß gewöhnliche Angst und ehrfürchtiges Staunen ineinandergreifen, und löst die theologische Spannung nicht interpretierend auf.
- issue: Referenzumfang von πάντα τὰ ῥήματα ταῦτα
  choice: all diese Dinge
  alternative: all diese Worte; all diese Begebenheiten
  rationale: Der Ausdruck kann sowohl Gesagtes als auch die Ereignisse bezeichnen, von denen gesprochen wurde. Der Haupttext folgt dem narrativen Sinn, während die Fußnote die Mehrdeutigkeit ausdrücklich erhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt dem griechischen Verlauf nahe, ohne unnatürlich zu wirken; lexikalische und theologische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
