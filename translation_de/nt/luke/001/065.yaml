  naturalness: '„Alle, die in ihrer Umgebung wohnten“ ist im Deutschen unnötig mehrdeutig: „ihrer“ kann sich nahegelegt auf „alle“ statt auf die zuvor im Kontext genannten Personen beziehen. Außerdem klingt „wurde über all diese Dinge gesprochen“ zwar möglich, bildet den andauernden Umlauf von διελαλεῖτο aber weniger idiomatisch ab als „sprach man ... über“.'
  terminology: „Furcht“, „Bergland von Judäa“ und „all diese Dinge“ sind sachgerecht und im modernen Standarddeutsch verständlich. Die Fußnote zu „Furcht“ erläutert eine mögliche Nuance, ohne den Haupttext dogmatisch festzulegen.
