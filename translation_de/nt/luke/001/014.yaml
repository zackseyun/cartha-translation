  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: de
  text: Du wirst Freude und Jubel erleben, und viele werden sich über seine Geburt freuen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei seiner Geburt“. Die griechische Wendung kann die Geburt als Anlass oder als Grund der Freude bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται … σοι
  choice: du wirst … erleben
  rationale: Die griechische Verbindung bezeichnet, dass Freude und Jubel dem Angeredeten zuteilwerden. Die persönliche Formulierung ist im modernen Deutschen natürlicher als „es wird dir … sein“.
- source_word: χαρά
  choice: Freude
  rationale: Die übliche und klare Wiedergabe des Substantivs.
- source_word: ἀγαλλίασις
  choice: Jubel
  rationale: Bewahrt gegenüber „Freude“ den gesteigerten, feierlichen Sinn und vermeidet eine bloße Wiederholung.
- source_word: πολλοὶ
  choice: viele
  rationale: Die substantivisch gebrauchte Mengenangabe lässt sich im Deutschen ebenso knapp und natürlich wiedergeben.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: über seine Geburt
  rationale: Bei einem Verb der Freude gibt „über“ den Anlass beziehungsweise Grund idiomatisch wieder; die mögliche zeitlich-situative Nuance bleibt in der Fußnote sichtbar.
- source_word: χαρήσονται
  choice: werden sich freuen
  rationale: Natürliche deutsche Wiedergabe des Futurs von χαίρω; zugleich bleibt die Wortverbindung zu χαρά erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Freude und Jubel“ erhält die Steigerung der beiden griechischen Substantive; „du wirst … erleben“ gibt die Dativkonstruktion idiomatisch wieder.
