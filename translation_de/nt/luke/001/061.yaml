  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: de
  text: 'Da sagten sie zu ihr: »Niemand aus deiner Verwandtschaft heißt so.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν πρὸς αὐτὴν
  choice: Da sagten sie zu ihr
  rationale: Das erzählende καί wird im Deutschen natürlich mit »Da« wiedergegeben; πρός mit dem Akkusativ bezeichnet bei einem Verb des Sprechens die angesprochene Person.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Niemand aus deiner Verwandtschaft
  rationale: Die Formulierung bildet die partitive Konstruktion mit ἐκ klar und idiomatisch ab. »Verwandtschaft« bezeichnet hier den Kreis der Verwandten, ohne ihn auf den engeren Haushalt zu beschränken.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: heißt so
  rationale: Im Zusammenhang der Namensgebung ist »so heißen« die natürliche moderne deutsche Entsprechung für καλεῖται τῷ ὀνόματι τούτῳ und bewahrt den Bezug auf den unmittelbar zuvor genannten Namen.
