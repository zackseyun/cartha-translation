  source_fidelity: Die Übersetzung trifft Maria, den Engel, die kausale Begründung und die verhüllende Bedeutung von οὐ γινώσκω ἄνδρα insgesamt zuverlässig. „Wie soll das geschehen“ kann jedoch im Deutschen eine Sollens- bzw. Zwecknuance nahelegen, die ἔσται als einfacher Futur von „sein/werden“ nicht ausdrückt. „Wie wird das geschehen“ gibt die zukunftsbezogene Frage ohne diese Nebenbedeutung genauer wieder.
  naturalness: Der gehobene, biblisch etablierte Ausdruck „einen Mann erkennen“ ist als bewusst beibehaltenes Idiom vertretbar; die Fußnote macht seine heute nicht ohne Weiteres erkennbare Bedeutung klar. „Wie wird das geschehen?“ ist im modernen Standarddeutsch zudem unmittelbarer und idiomatischer als „Wie soll das geschehen?“.
  terminology: „Maria“ und „Engel“ sind die üblichen deutschen Bezeichnungen. „Mann“ bewahrt die im griechischen Idiom offene Referenz, ohne unzulässig auf „Ehemann“ einzuengen. Die Fußnote erklärt die sexuelle Bedeutung sachlich und ohne zusätzliche theologische Auslegung.
