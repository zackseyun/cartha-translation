base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: de
  text: 'Maria aber sagte zu dem Engel: „Wie wird das geschehen, da ich keinen Mann erkenne[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Einen Mann erkennen“ ist eine zurückhaltende Ausdrucksweise für Geschlechtsverkehr; sinngemäß: „da ich mit keinem Mann geschlechtlich verkehre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet die leichte Kontrast- und Antwortbewegung zwischen der Ankündigung des Engels und Marias Frage, ohne einen starken Gegensatz auszudrücken.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Die im Deutschen etablierte Namensform.
- source_word: πρὸς τὸν ἄγγελον
  choice: zu dem Engel
  rationale: ἄγγελος kann allgemein „Bote“ bedeuten; im Kontext bezeichnet es eindeutig ein himmlisches Wesen, daher „Engel“.
- source_word: Πῶς ἔσται τοῦτο
  choice: Wie soll das geschehen
  rationale: Gibt die Frage nach dem Zustandekommen der angekündigten Empfängnis in natürlichem Deutsch wieder. „Soll“ entspricht hier idiomatisch der zukunftsbezogenen Frage und bezeichnet nicht notwendig eine Verpflichtung.
- source_word: ἐπεὶ
  choice: da
  rationale: Leitet den Grund für Marias Frage knapp und natürlich ein.
- source_word: ἄνδρα
  choice: einen Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. In der Wendung mit γινώσκω geht es um Geschlechtsverkehr mit einem Mann; „einen Mann“ bewahrt die Ausdrucksweise, ohne sie auf den Familienstand zu verengen.
- source_word: οὐ γινώσκω
  choice: ich keinen Mann erkenne
  rationale: Bewahrt die verhüllende biblische Redeweise „einen Mann erkennen“, die hier Geschlechtsverkehr bezeichnet. Die Fußnote erläutert den Sinn für heutige Leser.
theological_decisions:
- issue: Marias Aussage und die jungfräuliche Empfängnis Jesu
  choice: Die verhüllende Wendung „ich keinen Mann erkenne“ bleibt im Haupttext erhalten.
  alternative: „ich mit keinem Mann geschlechtlich verkehre“ oder „ich Jungfrau bin“
  rationale: Der griechische Text verwendet die idiomatische Wendung οὐ γινώσκω ἄνδρα und nennt Maria hier nicht ausdrücklich „Jungfrau“. Die Übersetzung bewahrt diese Quellennähe und macht den sexuellen Sinn in einer Fußnote deutlich, ohne mehr auszusagen als der Vers selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „einen Mann erkennen“ erhält die Bildsprache des griechischen Textes; ihre heute nicht mehr unmittelbar verständliche Bedeutung wird in der Fußnote erklärt.
