id: LUK.1.22
reference: Luke 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: de
  text: Als er aber herauskam, konnte er nicht zu ihnen sprechen. Da erkannten sie, dass er im Heiligtum[a] eine Vision gesehen hatte. Er gab ihnen immer wieder Zeichen und blieb stumm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel“. Das griechische Wort bezeichnet hier genauer das eigentliche Heiligtum und nicht den gesamten Tempelbezirk.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „taub“ bedeuten und in manchen Zusammenhängen sowohl fehlendes Hörvermögen als auch fehlendes Sprechvermögen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν δὲ
  choice: Als er aber herauskam
  rationale: Das vorangestellte Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben; δέ markiert den erzählerischen Fortgang beziehungsweise Kontrast.
- source_word: οὐκ ἐδύνατο λαλῆσαι αὐτοῖς
  choice: konnte er nicht zu ihnen sprechen
  rationale: Die Formulierung bewahrt die durch δύναμαι mit Infinitiv ausgedrückte Unfähigkeit und gibt αὐτοῖς mit dem im Deutschen idiomatischen „zu ihnen“ wieder.
- source_word: ἐπέγνωσαν
  choice: Da erkannten sie
  rationale: Das Verb bezeichnet hier das aus den sichtbaren Umständen gewonnene klare Erfassen; „erkannten“ ist präzise und erzählerisch natürlich.
- source_word: ὀπτασίαν
  choice: eine Erscheinung
  rationale: ὀπτασία kann eine übernatürliche Erscheinung oder Vision bezeichnen. „Erscheinung“ lässt offen, ob der Akzent auf dem Gesehenen oder auf der visionären Erfahrung liegt.
- source_word: ἐν τῷ ναῷ
  choice: im Heiligtum
  rationale: ναός bezeichnet hier genauer den inneren Tempelbau beziehungsweise das eigentliche Heiligtum, nicht allgemein den gesamten Tempelbezirk.
- source_word: ἦν διανεύων αὐτοῖς
  choice: Er gab ihnen immer wieder Zeichen
  rationale: Die periphrastische Imperfektkonstruktion bezeichnet fortdauerndes Gestikulieren; „immer wieder“ macht diesen Verlauf in natürlichem Deutsch deutlich.
- source_word: διέμενεν κωφός
  choice: blieb stumm
  rationale: διαμένω bezeichnet den anhaltenden Zustand. Im unmittelbaren Kontext hebt κωφός die Unfähigkeit zu sprechen hervor; „stumm“ ist knapp, natürlich und vermeidet eine unnötige Wiederholung.
theological_decisions:
- issue: Bedeutungsumfang von κωφός bei der Strafe des Zacharias
  choice: Im Haupttext als „stumm“ wiedergegeben
  alternative: „taub“ oder „taubstumm“
  rationale: Der Vers nennt ausdrücklich seine Unfähigkeit zu sprechen und sein Zeichengeben. Da κωφός jedoch auch Taubheit bezeichnen kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote offengehalten.
- issue: Art der ὀπτασία
  choice: „Erscheinung“
  alternative: „Vision“
  rationale: Beide Wiedergaben sind möglich. „Erscheinung“ bewahrt die Offenheit des griechischen Ausdrucks, ohne die übernatürliche Dimension abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze vermeiden syntaktische Schwere; „Heiligtum“ wahrt die sachliche Unterscheidung innerhalb des Tempelkomplexes.
