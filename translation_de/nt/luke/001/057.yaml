  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: de
  text: Für Elisabet war die Zeit erfüllt, zu gebären[a], und sie brachte einen Sohn zur Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „Für Elisabet war die Zeit der Geburt gekommen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel markiert hier lediglich den milden Fortgang der Erzählung. Im Deutschen wird dieser Zusammenhang durch die Satzfolge ausreichend deutlich; ein vorangestelltes „Nun“ könnte fälschlich als ausdrückliche Zeitangabe verstanden werden.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: erfüllte sich die Zeit
  rationale: Die Formulierung bewahrt das Bild des griechischen Ausdrucks („die Zeit wurde erfüllt“) in natürlichem, würdigem Deutsch und bezeichnet das Vollendetsein der Schwangerschaftszeit.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: in der sie gebären sollte
  rationale: Der artikulierte Infinitiv bezeichnet hier die für Elisabet bestimmte Zeit des Gebärens. Die Formulierung ist verständlich und schließt natürlich an „die Zeit“ an.
- source_word: ἐγέννησεν
  choice: sie brachte … zur Welt
  rationale: Das Verb berichtet als abgeschlossene Erzählhandlung von der Geburt. „Zur Welt bringen“ ist im modernen Deutschen idiomatisch und verbindet sich natürlich mit „einen Sohn“.
- source_word: υἱόν
  choice: einen Sohn
  rationale: Das Substantiv bezeichnet ausdrücklich einen Sohn und wird daher geschlechtsspezifisch wiedergegeben.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch verbreitete Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte Wendung „die Zeit erfüllte sich“ bleibt erhalten; die Fußnote bietet eine stärker idiomatische Alternative. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wendung.
