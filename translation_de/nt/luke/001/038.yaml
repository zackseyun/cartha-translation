id: LUK.1.38
reference: Luke 1:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: de
  text: 'Da sagte Maria: »Sieh, ich bin die Dienerin des Herrn.[a] Mir geschehe nach deinem Wort.«[b] Und der Engel ging von ihr fort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sieh, ich bin die Sklavin des Herrn.« Das griechische Wort δούλη kann eine Sklavin oder eine Dienerin bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »Es soll mir nach deinem Wort geschehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: Die schwache narrative Verknüpfung wird im Deutschen natürlich wiedergegeben, ohne eine scharf bestimmte zeitliche Abfolge zu behaupten.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Bewahrt den markierten, feierlichen Hinweischarakter, klingt aber im modernen Deutschen verständlicher als »Siehe«.
- source_word: δούλη
  choice: Dienerin
  rationale: Die feminine Bezeichnung kann eine Sklavin oder Dienerin meinen. Hier steht Marias demütige Zugehörigkeit und Bereitschaft gegenüber dem Herrn im Vordergrund; die stärkere soziale Bedeutung wird in der Fußnote offengehalten.
- source_word: κυρίου
  choice: des Herrn
  rationale: Gibt den göttlichen Titel κύριος und das Abhängigkeitsverhältnis formal und idiomatisch wieder.
- source_word: γένοιτό μοι
  choice: Mir geschehe
  rationale: Der Optativ drückt zustimmenden Wunsch aus. Die knappe, gehobene Form ist im Deutschen verständlich und entspricht dem feierlichen Charakter der Antwort.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: nach deinem Wort
  rationale: Bewahrt sowohl den Gedanken der Übereinstimmung als auch die konkrete gesprochene Ankündigung; »Wort« lässt die traditionelle und semantische Weite von ῥῆμα stehen.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: ging von ihr fort
  rationale: Gibt das Weggehen schlicht und natürlich wieder, ohne den Vorgang auszuschmücken.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Im Kontext bezeichnet ἄγγελος eindeutig ein himmlisches Wesen, nicht lediglich einen menschlichen Boten.
theological_decisions:
- issue: Marias Selbstbezeichnung δούλη
  choice: Dienerin des Herrn
  alternative: Sklavin des Herrn
  rationale: »Dienerin« stellt im Kontext die demütige Hingabe an Gott heraus, ohne die mögliche stärkere Bedeutung des griechischen Begriffs zu verschweigen; diese bleibt in der Fußnote sichtbar.
- issue: Aussagekraft von γένοιτό μοι
  choice: Mir geschehe nach deinem Wort
  alternative: Es soll mir nach deinem Wort geschehen
  rationale: Die gewählte Form bewahrt den Optativ als bereitwilligen Wunsch beziehungsweise Zustimmung und macht daraus weder eine bloße Zukunftsaussage noch einen Befehl.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlichem Ton. »Sieh« vermeidet das altertümlichere »Siehe«, während »Mir geschehe« die prägnante und gehobene Zustimmung Marias bewahrt. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Formulierungen.
