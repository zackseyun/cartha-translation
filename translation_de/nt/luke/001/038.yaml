  source_fidelity: 'Der Text gibt alle Elemente des griechischen Satzes zuverlässig wieder: Maria als Sprecherin, die hervorgehobene Selbstvorstellung (ἰδού), δούλη κυρίου, der zustimmende Optativ γένοιτό μοι, die Übereinstimmung mit dem gesprochenen Wort sowie das Weggehen des Engels. »Mir geschehe nach deinem Wort« bewahrt die Wunsch- und Einwilligungsnuance des Optativs gut.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem, leicht gehobenem Erzählton. »Sieh« ist gegenüber »Siehe« modernisiert, ohne die markierte Aufmerksamkeitssignalfunktion von ἰδού aufzugeben. »Ging von ihr fort« ist idiomatisch und sachlich.
