  naturalness: »Und er kam zu ihr herein« ist modernes, würdiges Standarddeutsch und gibt die vorzeitige Bewegung des Partizips εἰσελθών natürlich wieder. Der feierliche Gruß »Sei gegrüßt« ist im Kontext einer Engelsansprache angemessen und verständlich.
