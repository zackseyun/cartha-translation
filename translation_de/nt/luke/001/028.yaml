base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: de
  text: 'Und er kam zu ihr herein und sagte: »Sei gegrüßt[a], du Begnadete[b]! Der Herr ist mit dir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freue dich«; traditionell auch: »Gegrüßt seist du«. Das griechische Wort bedeutet der Form nach »freue dich«, wird hier aber als Gruß gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du mit Gnade Beschenkte« oder »du hoch Begünstigte«; traditionell: »voll der Gnade«. Das griechische Wort bezeichnet eine Frau, der Gnade oder Gunst erwiesen worden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: er trat bei ihr ein
  rationale: Das Partizip bezeichnet das Eintreten beziehungsweise Herantreten vor dem Sprechen. Die deutsche Formulierung gibt die Bewegung in ihre Gegenwart natürlich wieder, ohne ein im griechischen Vers nicht ausdrücklich genanntes Subjekt wie „der Engel“ einzufügen.
- source_word: Χαῖρε
  choice: Sei gegrüßt
  rationale: Die Form ist wörtlich ein Imperativ mit der Bedeutung „Freue dich“, dient hier jedoch idiomatisch als Gruß. „Sei gegrüßt“ wahrt den feierlichen Ton und ist im modernen Deutsch verständlich; die wörtliche Nuance bleibt in der Fußnote erhalten.
- source_word: κεχαριτωμένη
  choice: du Begnadete
  rationale: Das Perfekt Passiv von χαριτόω bezeichnet eine Frau, der Gnade beziehungsweise Gunst erwiesen worden ist. „Begnadete“ bewahrt den passiven Sinn und die Verbindung zur Gnade, ohne die Wendung als Aussage über eine in Maria selbst liegende Fülle auszulegen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die etablierte Gottesbezeichnung „der Herr“ wahrt den biblischen Sprachgebrauch und den ehrfürchtigen Ton.
- source_word: μετὰ σοῦ
  choice: ist mit dir
  rationale: μετά mit Genitiv bedeutet „mit“. Das im Griechischen ausgelassene Kopulaverb wird im Deutschen idiomatisch als „ist“ ergänzt.
theological_decisions:
- issue: Wiedergabe von κεχαριτωμένη in einer theologisch sensiblen marianischen Aussage
  choice: du Begnadete
  alternative: 'du mit Gnade Beschenkte; du hoch Begünstigte; traditionell: voll der Gnade'
  rationale: 'Die Übersetzung folgt der passiven Aussage des griechischen Partizips: Maria hat Gnade beziehungsweise Gunst empfangen. Sie wahrt damit die starke Aussage göttlicher Zuwendung, ohne spätere dogmatische Deutungen in den Wortlaut einzutragen. Die traditionsreiche Alternative wird in der Fußnote dokumentiert.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sei gegrüßt“ klingt feierlich, bleibt aber allgemein verständlich. „Begnadete“ erhält die knappe Anredeform und den Gnadenbezug des griechischen Partizips.
