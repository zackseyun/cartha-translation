  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zutreffend wieder: ῥυσθέντας als vorausgehende passive Rettung („gerettet“), ἐκ χειρὸς ἐχθρῶν mit erhaltener Bildsprache („aus der Hand unserer Feinde“), ἀφόβως als Bestimmung zu λατρεύειν („ihm ohne Furcht dienen“) und αὐτῷ als Bezug auf Gott. Das ergänzte „unserer“ ist im unmittelbaren Kontext von Lukas 1,71 und der Wir-Perspektive gut begründet, obwohl es in diesem Halbvers nicht ausdrücklich steht.'
