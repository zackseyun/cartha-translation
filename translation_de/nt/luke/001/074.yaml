  terminology: „Dienen“ ist für λατρεύειν die beste offene Wiedergabe und vermeidet eine unangemessene Einengung auf kultische Anbetung. Die Fußnote zu „dienen“ nennt die möglichen kultischeren Nuancen sachgerecht. „Aus der Hand“ bewahrt die biblische Metapher; ihre idiomatische Bedeutung wird zutreffend erläutert.
