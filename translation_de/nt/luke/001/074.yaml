id: LUK.1.74
reference: Luke 1:74
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: de
  text: dass wir, aus der Hand unserer Feinde[b] gerettet, ihm ohne Furcht[a] dienen[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „furchtlos“.'
    reason: lexical_alternative
  - marker: b
    text: '„Aus der Hand“ bedeutet hier: aus der Gewalt oder Macht unserer Feinde.'
    reason: idiom_explanation
  - marker: c
    text: Das Verb kann bei einem auf Gott gerichteten Dienst auch „anbeten“ oder „Gottesdienst erweisen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: ohne Furcht
  rationale: Das Adverb bezeichnet ein furchtloses Dienen. „Ohne Furcht“ klingt im Deutschen natürlich und bewahrt zugleich den Bezug zum folgenden Infinitiv.
- source_word: ἐκ χειρός
  choice: aus der Hand
  rationale: Die bildhafte Wendung bezeichnet die Befreiung aus der Gewalt oder Herrschaft eines anderen. Das deutsche Bild ist verständlich und entspricht der Ausdrucksweise des Ausgangstextes.
- source_word: ἐχθρῶν
  choice: unserer Feinde
  rationale: Im Griechischen steht kein ausdrückliches Possessivpronomen; der Zusammenhang der Prophetie und das in der Konstruktion vorausgesetzte „wir“ machen den Bezug auf die Feinde des redenden Volkes deutlich.
- source_word: ῥυσθέντας
  choice: gerettet
  rationale: Das passive Aoristpartizip bezeichnet die Rettung als Voraussetzung für das Dienen. Die knappe Partizipialkonstruktion gibt diese zeitlich-sachliche Beziehung wieder.
- source_word: λατρεύειν
  choice: dienen
  rationale: Das Verb bezeichnet einen auf Gott gerichteten Dienst, der auch gottesdienstliche Verehrung einschließt. „Dienen“ bewahrt die größere Bedeutungsbreite.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich im vorangehenden Zusammenhang auf Gott; „ihm dienen“ ist die natürliche deutsche Konstruktion.
theological_decisions:
- issue: Bedeutungsumfang von λατρεύειν im Blick auf Gott
  choice: ihm dienen
  alternative: ihn anbeten / ihm Gottesdienst erweisen
  rationale: „Dienen“ umfasst hingebungsvollen Gehorsam und gottesdienstliche Verehrung, ohne die Aussage auf kultische Anbetung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Bildsprache „aus der Hand“ bleibt erhalten; die Satzstellung macht deutlich, dass „ohne Furcht“ das Dienen bestimmt. Der Vers ist als syntaktischer Teil des längeren Satzes in Lukas 1,73–75 formuliert.
