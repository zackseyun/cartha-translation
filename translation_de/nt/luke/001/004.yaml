  text: damit du die Zuverlässigkeit dessen erkennst, worüber du unterwiesen wurdest[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gewissheit“; das griechische Substantiv kann Gewissheit, Sicherheit oder Zuverlässigkeit bezeichnen.'
