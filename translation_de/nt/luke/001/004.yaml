  source_fidelity: 'Der Entwurf gibt den Zwecksatz und die passive Unterweisung grundsätzlich zutreffend wieder. Die Formulierung „wie verlässlich das ist, worin du unterwiesen wurdest“ verschiebt jedoch die Konstruktion: τὴν ἀσφάλειαν bezieht sich auf die λόγοι bzw. den Inhalt der Unterweisung, nicht allgemein auf ein unbestimmtes „das“, und „worin“ ist hierfür weniger präzise als eine auf den Gegenstand der Unterweisung bezogene Formulierung.'
