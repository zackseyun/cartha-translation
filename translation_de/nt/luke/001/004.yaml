lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zwecksatz natürlich und mit klarer finaler Bedeutung ein.
- source_word: ἐπιγνῷς
  choice: du erkennst
  rationale: Gibt den Aorist Konjunktiv von ἐπιγινώσκω im Zwecksatz idiomatisch wieder, ohne die mögliche verstärkende Bedeutung durch „vollständig“ zu überzeichnen.
- source_word: περὶ ὧν … λόγων
  choice: das …, worin
  rationale: Fasst den Inhalt der empfangenen Unterweisung in natürlichem Deutsch zusammen. Das pluralische λόγων bezeichnet hier die Aussagen, Inhalte oder Lehren, nicht bloß einzelne Wörter.
- source_word: κατηχήθης
  choice: du unterwiesen wurdest
  rationale: Bewahrt den Gedanken empfangener, wohl auch mündlicher Unterweisung, ohne den späteren kirchlichen Fachausdruck „katechisiert“ in den Haupttext einzutragen.
- source_word: τὴν ἀσφάλειαν
  choice: wie verlässlich
  rationale: Gibt die Sicherheit beziehungsweise Zuverlässigkeit der vermittelten Inhalte idiomatisch wieder. Eine Fußnote hält die ebenfalls mögliche Nuance persönlicher Gewissheit offen.
theological_decisions:
- issue: Art der von Lukas beabsichtigten Erkenntnis
  choice: Die Formulierung „wie verlässlich“ hebt die Tragfähigkeit der empfangenen Unterweisung hervor, ohne persönliche Gewissheit auszuschließen.
  alternative: „damit du Gewissheit über das erlangst“
  rationale: ἀσφάλεια kann objektive Zuverlässigkeit und subjektive Gewissheit bezeichnen. Haupttext und Fußnote bewahren gemeinsam diese erkenntnistheologische Spannweite.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die unpersönliche Wendung „das, worin“ vermeidet eine unnötige Festlegung von λόγων auf einzelne Wörter, Berichte oder formale Lehrsätze.
