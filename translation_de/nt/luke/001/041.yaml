  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: de
  text: 'Und es geschah: Als Elisabet Marias Gruß[a] hörte, hüpfte das Kind in ihrem Mutterleib, und Elisabet wurde mit dem Heiligen Geist erfüllt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Begrüßung.'
    reason: Lexikalische Alternative für ἀσπασμός.
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt die für Lukas typische Erzählformel in würdigem, weiterhin verständlichem Deutsch, ohne das Geschehen zusätzlich auszudeuten.
- source_word: ὡς
  choice: als
  rationale: Gibt in Verbindung mit dem Aorist das zeitliche Verhältnis natürlich wieder.
- source_word: ἀσπασμός
  choice: Gruß
  rationale: Bezeichnet hier Marias gesprochenen Gruß; „Gruß“ ist knapp, natürlich und stilistisch angemessen.
- source_word: Μαρίας
  choice: Marias
  rationale: Der griechische Genitiv wird als deutscher Namensgenitiv wiedergegeben.
- source_word: ἐσκίρτησεν
  choice: hüpfte
  rationale: Gibt die plötzliche, lebhafte Bewegung anschaulich wieder und passt idiomatisch zu einem Kind im Mutterleib.
- source_word: βρέφος
  choice: das Kind
  rationale: Bezeichnet hier den ungeborenen Johannes. „Kind“ ist im Deutschen natürlich und würdig; „Baby“ wäre umgangssprachlicher.
- source_word: κοιλία
  choice: Mutterleib
  rationale: Der Kontext bezeichnet eindeutig den Ort der Schwangerschaft; „Mutterleib“ ist präziser als das allgemeinere „Leib“ oder „Bauch“.
- source_word: ἐπλήσθη
  choice: wurde erfüllt
  rationale: Bewahrt die Passivform und damit die im Text nur angedeutete göttliche Einwirkung, ohne sie erklärend auszubauen.
- source_word: πνεύματος ἁγίου
  choice: mit dem Heiligen Geist
  rationale: Die bestimmte Form und Großschreibung entsprechen dem natürlichen deutschen Ausdruck für Gottes Geist in diesem lukanischen Zusammenhang.
theological_decisions:
- issue: Bezug von πνεύματος ἁγίου
  choice: der Heilige Geist als Gottes Geist
  alternative: ein heiliger Geist
  rationale: In Lukas–Apostelgeschichte bezeichnet die Wendung in solchen Erfüllungsszenen regelmäßig Gottes Geist und steht hier im Zusammenhang prophetischer Inspiration. Die Übersetzung macht diesen Bezug deutlich, ohne weitere Lehrsätze einzutragen.
- issue: Bezeichnung des ungeborenen Johannes mit βρέφος
  choice: Kind
  alternative: Baby; Säugling
  rationale: Das Wort bezeichnet ein sehr junges Kind und bezieht sich hier ausdrücklich auf Johannes im Mutterleib. „Kind“ wahrt den konkreten Personenbezug in natürlichem, würdigem Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Erzählformel „Und es geschah“ bleibt erhalten; der Doppelpunkt gliedert den langen Satz natürlich. Eigennamen folgen den Formen „Elisabet“ und „Maria“.
