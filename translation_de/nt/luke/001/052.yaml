  source_fidelity: Der Text gibt die beiden griechischen Aoriste angemessen als deutsches Perfekt wieder und bewahrt die parallele Struktur. „Mächtige von Thronen gestürzt“ trifft δυνάστας ἀπὸ θρόνων, ohne ein nicht vorhandenes Possessivpronomen zu ergänzen. „Niedrige erhöht“ gibt ταπεινούς in seiner sozial geprägten, aber nicht auf diese Bedeutung reduzierten Offenheit wieder.
