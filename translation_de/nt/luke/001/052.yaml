  variant: modern standard German
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: de
  text: Er hat Mächtige von Thronen gestürzt und Niedrige erhöht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Machthaber“. Das griechische Wort kann mächtige Menschen allgemein oder Herrscher bezeichnen; die Thron-Metapher legt hier einen herrschaftlichen Bezug nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Demütige“. Das griechische Wort kann Menschen von niedrigem gesellschaftlichem Stand und/oder demütige Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: hat ... gestürzt
  rationale: Das Verb bezeichnet ein Herabbringen oder Entheben. Im Zusammenhang mit Thronen gibt „gestürzt“ die entschiedene Umkehr von Machtverhältnissen natürlich und prägnant wieder, ohne das politische Bild durch eine abstrakte Umschreibung abzuschwächen.
- source_word: δυνάστας
  choice: Mächtige
  rationale: Das Substantiv kann Herrscher oder allgemein mächtige Personen bezeichnen. „Mächtige“ bewahrt diese Bedeutungsbreite; die Wendung „von Thronen“ lässt zugleich den herrschaftlichen Bezug deutlich hervortreten.
- source_word: ἀπὸ θρόνων
  choice: von Thronen
  rationale: Die Formulierung erhält das konkrete Bild des griechischen Textes. Ein Possessivpronomen wie „ihren“ wird nicht ergänzt.
- source_word: ὕψωσεν
  choice: erhöht
  rationale: „Erhöht“ entspricht dem Verb formal und bildet im Deutschen einen klaren Gegensatz zu „gestürzt“, wobei sowohl gesellschaftliche als auch theologische Resonanzen offenbleiben.
- source_word: ταπεινούς
  choice: Niedrige
  rationale: Das Adjektiv kann Menschen in niedriger sozialer Stellung wie auch demütige Menschen bezeichnen. „Niedrige“ hebt im Kontext der Umkehrung zunächst den niedrigen Stand hervor, ohne die mögliche innere Haltung auszuschließen.
theological_decisions:
- issue: Zeitbezug der Aoriste im Magnifikat
  choice: Deutsches Perfekt („hat ... gestürzt und ... erhöht“)
  alternative: Präteritum („stürzte ... und erhöhte“) oder eine präsentische Wiedergabe
  rationale: Das Perfekt gibt die Handlungen als vollzogen und gegenwärtig bedeutsam wieder, ohne festzulegen, ob sie rückblickend, prophetisch vorwegnehmend oder als zusammenfassendes Gotteslob gemeint sind.
- issue: Soziale Stellung oder innere Demut bei ταπεινούς
  choice: „Niedrige“ im Haupttext, mit Hinweis auf „Demütige“
  alternative: „Demütige“ im Haupttext
  rationale: Der Kontrast zu den Mächtigen auf Thronen legt eine soziale Umkehrung nahe; zugleich wird die ethische beziehungsweise geistliche Bedeutung nicht ausgeschlossen und in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die konkrete Thron-Metapher und die Mehrdeutigkeit der Personenbezeichnungen bleiben erhalten.
