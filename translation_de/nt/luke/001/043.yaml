  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: de
  text: Wie wird mir diese Ehre zuteil[a], dass die Mutter meines Herrn zu mir kommt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und woher [kommt] mir dies …?« Die elliptische Wendung drückt erstauntes Fragen über eine unerwartete Ehre aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: Wie komme ich zu dieser Ehre
  rationale: Die wörtliche Wendung »Woher ist mir dies?« ist im modernen Deutschen unklar. Die gewählte idiomatische Wiedergabe bewahrt Elisabeths erstaunte Frage angesichts einer unerwarteten Auszeichnung; »Ehre« macht den im Zusammenhang erschlossenen Sinn ausdrücklich.
- source_word: ἵνα ἔλθῃ
  choice: dass … kommt
  rationale: ἵνα bezeichnet hier den Inhalt des erstaunlichen Geschehens. Der deutsche Indikativ klingt in dieser indirekten Inhaltsangabe natürlich und gibt den Aorist-Konjunktiv kontextgerecht wieder.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Direkte und natürliche Entsprechung.
- source_word: τοῦ κυρίου μου
  choice: meines Herrn
  rationale: Bewahrt den ehrfürchtigen Titel κύριος und den persönlichen Bezug von μου, ohne spätere dogmatische Formulierungen in den Vers einzutragen.
- source_word: πρὸς ἐμέ
  choice: zu mir
  rationale: Gibt die auf Elisabeth gerichtete Bewegung natürlich wieder, ohne den im Griechischen nicht genannten Ort »mein Haus« hinzuzufügen.
theological_decisions:
- issue: Bedeutung von κύριος in »die Mutter meines Herrn«
  choice: meines Herrn
  alternative: meines Gebieters
  rationale: »Herr« wahrt die christologische Tragweite des Titels, lässt deren genaue Reichweite jedoch so offen wie der Vers selbst.
- issue: Grad der Explizierung des idiomatischen πόθεν μοι τοῦτο
  choice: Wie komme ich zu dieser Ehre
  alternative: Woher wird mir dies zuteil
  rationale: Die Hauptfassung vermittelt die Verwunderung und das Empfinden einer unverdienten Auszeichnung in natürlichem Gegenwartsdeutsch. Die Fußnote bewahrt die ungewöhnliche Bildstruktur des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage bleibt knapp und staunend; die Wiederholung »zu mir« entspricht dem griechischen Zielausdruck.
