  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: de
  text: Nach dem Brauch des Priesterdienstes fiel ihm durch das Los die Aufgabe zu, Räucherwerk darzubringen, als er in das Heiligtum des Herrn[a] eintrat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tempel des Herrn“. Das griechische Wort ναός bezeichnet hier wahrscheinlich das eigentliche Tempelheiligtum und nicht den gesamten Tempelbezirk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: Nach dem Brauch des Priesterdienstes
  rationale: κατά mit Akkusativ bezeichnet die Übereinstimmung mit einem feststehenden Brauch; ἱερατεία meint den priesterlichen Dienst beziehungsweise das Priesteramt. Die Formulierung ist institutionell präzise und im Deutschen natürlich.
- source_word: ἔλαχε
  choice: fiel ihm durch das Los die Aufgabe zu
  rationale: λαγχάνω bezeichnet hier das Erlangen beziehungsweise Zuteilen durch das Los. Die deutsche Wendung macht sowohl das Losverfahren als auch das Ergebnis klar.
- source_word: τοῦ θυμιᾶσαι
  choice: Räucherwerk darzubringen
  rationale: Der artifizielle Infinitiv bezeichnet den Inhalt der zugelosten Aufgabe. θυμιάω meint das Verbrennen beziehungsweise kultische Darbringen von Räucherwerk; „darbringen“ passt zum priesterlichen Kontext.
- source_word: εἰσελθὼν εἰς τὸν ναὸν
  choice: in das Heiligtum … zu gehen
  rationale: Das aoristische Partizip bezeichnet den mit der Aufgabe verbundenen Eintritt. ναός meint hier angesichts des Räucheropfers sehr wahrscheinlich das eigentliche Tempelheiligtum und nicht den gesamten Tempelbezirk.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος bezeichnet hier Gott. „Herr“ gibt den griechischen Wortlaut wieder, ohne durch die Schreibung „HERR“ ausdrücklich den Gottesnamen vorauszusetzen.
theological_decisions:
- issue: Wiedergabe von ναός im Kontext des Tempelkults
  choice: Heiligtum
  alternative: Tempel
  rationale: ναός bezeichnet im Unterschied zum weiteren Tempelbezirk häufig das eigentliche Tempelgebäude beziehungsweise Heiligtum. Da Zacharias zum Räucheropfer hineingeht, ist die engere Bedeutung kontextuell angemessen. Die geläufigere Alternative „Tempel“ bleibt in der Fußnote sichtbar.
- issue: Verhältnis von Losentscheid und priesterlicher Handlung
  choice: fiel ihm durch das Los die Aufgabe zu
  alternative: er wurde durch das Los ausgewählt
  rationale: Die gewählte Formulierung bewahrt den Sinn von λαγχάνω, ohne näher zu bestimmen, ob Personen oder Aufgaben ausgelost wurden; im Kontext wird ihm die konkrete Aufgabe des Räucheropfers zugeteilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Priesterdienst“ und „Räucherwerk darbringen“ bewahren den kultischen Kontext, bleiben aber für heutige Leser verständlich.
