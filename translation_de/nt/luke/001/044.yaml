source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: de
  text: 'Denn sieh: Als der Klang deines Grußes an meine Ohren drang, hüpfte das Kind in meinem Mutterleib vor Freude.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hüpfte das Kind in meinem Mutterleib jubelnd«.'
    reason: Lexikalische Alternative für ἐν ἀγαλλιάσει, das Freude beziehungsweise Jubel bezeichnet und unterschiedlich eng mit der Bewegung verbunden werden kann.
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, anschauliche Funktion des griechischen Diskursmarkers in natürlichem modernem Deutsch.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet den erklärenden Anschluss an die vorausgehende Aussage.
- source_word: ὡς ἐγένετο
  choice: sobald … drang
  rationale: Gibt den zeitlichen Eintritt des Ereignisses idiomatisch wieder; der unmittelbare Zusammenhang legt hier »sobald« nahe, ohne eine zusätzliche Kausalität einzutragen.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: der Klang deines Grußes
  rationale: »Klang« hebt wie der Kontext das hörbare Eintreffen des gesprochenen Grußes hervor; »Gruß« ist die natürliche moderne Entsprechung für ἀσπασμός.
- source_word: εἰς τὰ ὦτά μου
  choice: an meine Ohren drang
  rationale: Bewahrt die gerichtete Bewegung des Hörbaren zu den Ohren in idiomatischem Deutsch.
- source_word: ἐσκίρτησεν
  choice: hüpfte
  rationale: Bezeichnet eine plötzliche lebhafte Bewegung und passt natürlich zu einem Kind im Mutterleib.
- source_word: ἐν ἀγαλλιάσει
  choice: vor Freude
  rationale: Gibt die freudige, jubelnde Art beziehungsweise Begleitung der Bewegung klar und natürlich wieder.
- source_word: τὸ βρέφος
  choice: das Kind
  rationale: βρέφος bezeichnet hier das ungeborene Kind; »Kind« ist würdig und natürlich, ohne über die Aussage des Textes hinauszugehen.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: in meinem Mutterleib
  rationale: Gibt im gegebenen Zusammenhang die konkrete Bedeutung von κοιλία präzise wieder.
theological_decisions:
- issue: Bezeichnung des ungeborenen Johannes mit βρέφος
  choice: das Kind
  alternative: das Baby / der Säugling
  rationale: »Das Kind« erhält den personalen und konkreten Bezug des griechischen Ausdrucks, ist im Deutschen für ein ungeborenes Kind idiomatisch und fügt keine über den Text hinausgehende lehrmäßige Aussage hinzu.
- issue: Bedeutung von ἐν ἀγαλλιάσει
  choice: vor Freude
  alternative: in Jubel / jubelnd
  rationale: Die Formulierung bewahrt die ausdrücklich freudige Deutung der Bewegung, ohne entscheiden zu müssen, ob die Präpositionalphrase streng als Ursache, Art und Weise oder begleitender Zustand einzuordnen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach »sieh« lässt den Diskursmarker natürlich hervortreten; »Mutterleib« wahrt die konkrete körperliche Bildsprache.
