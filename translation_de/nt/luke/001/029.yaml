id: LUK.1.29
reference: Luke 1:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: de
  text: Doch sie wurde über diese Botschaft tief beunruhigt[a] und überlegte immer wieder[b], was für ein Gruß das wohl sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über dieses Wort“ oder „wegen dieser Aussage“. Das griechische Wort λόγος kann „Wort“, „Aussage“ oder „Botschaft“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dachte darüber nach“ oder „fragte sich fortwährend“. Die griechische Imperfektform bezeichnet hier ein andauerndes inneres Erwägen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den leichten Gegensatz zwischen dem Gruß des Engels und Marias Reaktion und führt zugleich die Erzählung weiter.
- source_word: ἐπὶ τῷ λόγῳ
  choice: über diese Botschaft
  rationale: λόγος bezeichnet hier das soeben Gesagte als inhaltliche Mitteilung; „Botschaft“ ist im modernen Deutschen natürlicher als das wörtliche „Wort“. Die Präposition ἐπί mit Dativ bezeichnet den Anlass ihrer Beunruhigung.
- source_word: διεταράχθη
  choice: wurde … tief beunruhigt
  rationale: Die verstärkte Verbform beschreibt eine starke innere Erschütterung, ohne Marias Reaktion als Unglauben oder moralisches Versagen zu deuten.
- source_word: διελογίζετο
  choice: überlegte immer wieder
  rationale: Das Imperfekt stellt ihre innere Erwägung als fortdauernden Vorgang dar; „immer wieder“ macht diesen Aspekt im Deutschen erkennbar.
- source_word: ποταπὸς
  choice: was für ein
  rationale: Die Wendung fragt nach Art oder Bedeutung des Grußes und ist idiomatisches modernes Deutsch.
- source_word: εἴη
  choice: wohl sei
  rationale: Der Optativ in der abhängigen Frage trägt einen abwägenden, indirekten Ton; „wohl“ und der Konjunktiv geben diese Zurückhaltung natürlich wieder.
- source_word: ἀσπασμὸς οὗτος
  choice: dieser Gruß
  rationale: Bezeichnet ausdrücklich den soeben ausgesprochenen Gruß des Engels.
theological_decisions:
- issue: Art von Marias Reaktion
  choice: Maria ist über die Botschaft des Engels tief beunruhigt und denkt fortdauernd über die Bedeutung des Grußes nach.
  alternative: Ihre Reaktion gilt als Angst vor der Erscheinung oder als Ausdruck von Unglauben.
  rationale: Der griechische Text verknüpft ihre Beunruhigung ausdrücklich mit dem Gesagten und beschreibt anschließendes Nachdenken, ohne ihre Reaktion moralisch oder theologisch zu bewerten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung wahrt sowohl die Stärke von Marias Beunruhigung als auch den offenen, abwägenden Charakter ihres Nachdenkens.
