  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: δέ wird als leichter erzählerischer Kontrast mit „Doch“ angemessen erfasst; ἐπὶ τῷ λόγῳ bezeichnet den Anlass ihrer Beunruhigung; διεταράχθη wird mit der nötigen Intensität übersetzt; und das imperfektische διελογίζετο als fortdauerndes Erwägen. „was für ein Gruß das wohl sei“ bewahrt die offene Frage nach der Art des konkreten Grußes und gibt den zurückhaltenden Charakter des Optativs εἴη idiomatisch wieder.'
  naturalness: Das Deutsch ist modernes, flüssiges Standarddeutsch mit passendem würdig-erzählendem Register. „tief beunruhigt“ und „überlegte immer wieder“ sind natürlich und verständlich. Die Stellung von „das wohl sei“ ist idiomatisch in einer indirekten Frage.
  terminology: „Botschaft“ ist für λόγος in diesem Kontext eine tragfähige, natürliche Wahl; die Fußnote wahrt die möglichen engeren Wiedergaben „Wort“ und „Aussage“. „Gruß“ gibt ἀσπασμός präzise und zeitgemäß wieder. Die Formulierung legt weder den Anlass von Marias Reaktion über den Text hinaus auf die Erscheinung des Engels fest noch deutet sie ihre Reaktion theologisch aus.
