id: LUK.1.33
reference: Luke 1:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: de
  text: Und er wird über das Haus Jakob herrschen in Ewigkeit[a], und sein Reich wird kein Ende haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für die Zeitalter“. Die griechische Wendung εἰς τοὺς αἰῶνας bezeichnet hier unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: wird … herrschen
  rationale: Das Futur von βασιλεύω bezeichnet die Ausübung königlicher Herrschaft. „Herrschen“ ist im Deutschen natürlich; der königliche Sinn wird durch „sein Reich“ im zweiten Satzteil deutlich.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: über das Haus Jakob
  rationale: ἐπί mit Akkusativ bezeichnet hier den Herrschaftsbereich. „Haus Jakob“ bewahrt die biblische, korporative Bundesbezeichnung, ohne sie deutend durch „Israel“ oder „Gottes Volk“ zu ersetzen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die idiomatische Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ ist würdig, verständlich und entspricht dem biblischen Sprachregister, ohne unnötig wörtlich „für die Zeitalter“ zu formulieren.
- source_word: βασιλείας
  choice: Reich
  rationale: βασιλεία kann Herrschaft, Königtum oder Reich bezeichnen. Im Zusammenhang mit „kein Ende haben“ ist „Reich“ idiomatisch und bewahrt zugleich die königliche Dimension.
- source_word: οὐκ ἔσται τέλος
  choice: wird kein Ende haben
  rationale: Die deutsche Formulierung gibt die nachdrückliche Verneinung und den Zukunftsbezug natürlich wieder; das vorangestellte „sein Reich“ entspricht dem griechischen Genitivanschluss sinngemäß.
theological_decisions:
- issue: Bedeutungsumfang von „Haus Jakob“
  choice: Die traditionelle Bezeichnung „das Haus Jakob“ bleibt unverändert stehen.
  alternative: „das Volk Israel“ oder „Gottes Volk“
  rationale: Der Text selbst verwendet eine bundestheologisch geprägte korporative Bezeichnung. Eine Ausweitung oder erklärende Gleichsetzung würde eine theologische Deutung in den Haupttext eintragen.
- issue: Dauer der Herrschaft
  choice: εἰς τοὺς αἰῶνας wird mit „in Ewigkeit“ wiedergegeben; ergänzend heißt es, sein Reich werde kein Ende haben.
  alternative: „für die Zeitalter“ oder „auf immer“
  rationale: Die beiden parallelen Aussagen stellen die Herrschaft und das Reich als unendlich dar. Die gewählte Formulierung vermittelt diese Aussage klar, ohne die griechische Zeitidiomatik hölzern nachzubilden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Jakob“ bewahrt bewusst die biblische Bundesformel; „in Ewigkeit“ ist geläufig und passt zum feierlichen Charakter der Engelsankündigung.
