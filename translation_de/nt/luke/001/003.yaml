  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: de
  text: So hielt auch ich es für gut, nachdem ich allem von Anfang an sorgfältig nachgegangen bin[a], es dir der Reihe nach aufzuschreiben[b], hochgeehrter Theophilus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem ich alles von Anfang an sorgfältig untersucht habe“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Reihe nach“ kann eine geordnete Darstellung bezeichnen und muss nicht in jedem Fall eine streng chronologische Abfolge meinen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε κἀμοὶ
  choice: Darum hielt auch ich es für gut
  rationale: Die Wendung bezeichnet ein erwogenes Urteil bzw. einen Entschluss; „auch ich“ bewahrt den Anschluss an die zuvor genannten Verfasser. „Darum“ macht den im Deutschen nötigen Bezug zum vorausgehenden Satz deutlich.
- source_word: παρηκολουθηκότι
  choice: nachdem ich … nachgegangen bin
  rationale: παρακολουθέω kann genaues Verfolgen, Nachgehen oder Untersuchen bezeichnen. „Sorgfältig nachgehen“ gibt den historiografischen Untersuchungssinn natürlich wieder, ohne ihn unnötig zu verengen.
- source_word: ἄνωθεν
  choice: von Anfang an
  rationale: Im Kontext des Berichts über Ereignisse bezeichnet ἄνωθεν am wahrscheinlichsten deren Ursprung bzw. Anfang; „von oben“ passt hier weniger gut.
- source_word: πᾶσιν ἀκριβῶς
  choice: allem … sorgfältig
  rationale: Der substantivisch gebrauchte Plural πᾶσιν umfasst alle betreffenden Vorgänge und Überlieferungen; ἀκριβῶς betont Genauigkeit und Sorgfalt.
- source_word: καθεξῆς
  choice: der Reihe nach
  rationale: Die Formulierung bezeichnet eine geordnete Folge, ohne zwingend eine ausnahmslos strenge Chronologie zu behaupten.
- source_word: σοι γράψαι
  choice: es dir … aufzuschreiben
  rationale: Der Dativ bezeichnet den Empfänger. Das ergänzte „es“ greift im Deutschen den gesamten zuvor genannten Stoff auf.
- source_word: κράτιστε
  choice: hochgeehrter
  rationale: κράτιστε ist eine förmliche ehrende Anrede. „Hochgeehrter“ klingt im modernen Deutschen würdevoll und adressatenbezogen, ohne einen nicht ausdrücklich genannten Amtstitel einzuführen.
- source_word: Θεόφιλε
  choice: Theophilus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von καθεξῆς für die Anordnung des Berichts
  choice: der Reihe nach
  alternative: in streng chronologischer Reihenfolge; in geordneter Darstellung
  rationale: καθεξῆς kann eine Abfolge oder eine sachgemäße Ordnung bezeichnen. Die Übersetzung wahrt diese Offenheit und schreibt Lukas keine stärkere Behauptung strenger Chronologie zu, als der griechische Ausdruck verlangt.
translation_notes:
  register: Gehobener, aber allgemein verständlicher Stil entsprechend dem formellen Vorwort. Die Satzstruktur bleibt nah am Griechischen, wird jedoch durch idiomatische deutsche Wendungen geglättet. Sämtliche Fußnotenmarker stehen im Haupttext.
