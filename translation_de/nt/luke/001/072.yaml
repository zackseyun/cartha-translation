lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: Barmherzigkeit zu erweisen
  rationale: Die feste Verbindung bedeutet sinngemäß, jemandem Barmherzigkeit zu erweisen. Diese Formulierung ist im Deutschen natürlich und bewahrt den Zweckcharakter des Infinitivs.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: unseren Vätern
  rationale: Obwohl μετά mit Genitiv wörtlich „mit“ heißt, bezeichnet die Wendung hier die Personen, denen gegenüber Barmherzigkeit erwiesen wird. „Unseren Vätern“ bewahrt zugleich den patriarchalisch-biblischen Klang.
- source_word: μνησθῆναι
  choice: zu denken
  rationale: In der Verbindung „an … denken“ gibt die Form das Erinnern Gottes idiomatisch wieder, ohne die damit verbundene treue Erfüllung bereits ausdrücklich in den Haupttext einzutragen.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: an seinen heiligen Bund
  rationale: διαθήκη bezeichnet hier Gottes Bund; ἁγίας wird direkt mit „heiligen“ und αὐτοῦ mit „seinen“ wiedergegeben.
theological_decisions:
- issue: Gottes Erinnern als Handeln in Bundestreue
  choice: an seinen heiligen Bund zu denken
  alternative: seinen heiligen Bund zu erfüllen
  rationale: Biblisches Reden davon, dass Gott an seinen Bund denkt, schließt häufig entsprechendes treues Handeln ein. Der Haupttext bewahrt jedoch die offene Bildsprache des Griechischen und löst sie nicht in „erfüllen“ auf.
- issue: Bedeutung von πατέρων ἡμῶν
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Die maskuline Bezeichnung verweist im Zusammenhang auf Israels Väter beziehungsweise Vorväter. „Väter“ erhält diese sprachliche und heilsgeschichtliche Resonanz; die umfassendere Bedeutungsangabe steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versabschnitt bleibt als abhängige Infinitivkonstruktion formuliert und endet daher mit einem Komma. „Barmherzigkeit erweisen“ und „heiliger Bund“ bewahren den biblischen Klang, ohne altertümlich zu wirken.
