  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Israels Vorväter. Wörtlich kann die griechische Wendung auch mit „mit unseren Vätern“ wiedergegeben werden; sie bezeichnet hier Barmherzigkeit im Verhältnis zu ihnen.
