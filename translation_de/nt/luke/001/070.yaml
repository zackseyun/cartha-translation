id: LUK.1.70
reference: Luke 1:70
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: de
  text: wie er von alters her durch den Mund seiner heiligen Propheten geredet hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seit uralten Zeiten«. Die Wendung kann eine weit zurückliegende Vergangenheit bezeichnen. Manche verstehen sie stärker als »von Ewigkeit her«; der Bezug auf die Propheten spricht hier jedoch eher für »von alters her«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet die Entsprechung zur vorhergehenden Aussage ein; im Deutschen gibt „wie“ den Zusammenhang natürlich und präzise wieder.
- source_word: ἐλάλησεν
  choice: geredet hat
  rationale: Das Perfekt ist im modernen Deutschen für den rückblickenden Aorist natürlich; „reden“ harmoniert mit dem folgenden Bild vom Mund.
- source_word: διὰ στόματος
  choice: durch den Mund
  rationale: Bewahrt das konkrete biblische Bild der durch Propheten vermittelten Rede Gottes.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: seiner heiligen Propheten
  rationale: ἁγίων bestimmt προφητῶν attributiv; „heilige Propheten“ ist klar und wahrt den Gedanken ihrer Zugehörigkeit und Aussonderung für Gott.
- source_word: ἀπ’ αἰῶνος
  choice: von alters her
  rationale: Bezeichnet hier angesichts der Propheten am ehesten weit zurückliegende Zeit; die Wendung ist würdig, verständlich und lässt die zeitliche Tiefe erkennen.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Das Pronomen bezieht sich im Kontext am natürlichsten auf Gott und bezeichnet die Propheten als die Seinen.
theological_decisions:
- issue: Zeitlicher Umfang von ἀπ’ αἰῶνος
  choice: „von alters her“ im Sinn ferner Vergangenheit innerhalb der Heilsgeschichte
  alternative: „von Ewigkeit her“
  rationale: Der unmittelbare Bezug auf die Propheten spricht für alte Zeiten beziehungsweise lang zurückliegende Geschichte, nicht zwingend für eine metaphysische Ewigkeit. Die Fußnote hält die stärkere mögliche Deutung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, weiterhin verständliche Wendung „von alters her“ bewahrt die zeitliche Tiefe des Griechischen; „durch den Mund“ erhält bewusst das konkrete prophetische Sprachbild.
