  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: de
  text: Denn der Mächtige hat Großes an mir getan, und heilig ist sein Name.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für Marias Lobpreis im vorhergehenden Vers ein. „Denn“ bewahrt den kausalen Zusammenhang und fügt sich natürlich in den fortlaufenden deutschen Satz ein.
- source_word: ἐποίησέν μοι
  choice: hat … an mir getan
  rationale: Das Perfekt gibt die vollendete Tat mit ihrer gegenwärtigen Bedeutung im Lobpreis idiomatisch wieder. „An mir“ lässt offen, dass Gottes Handeln Maria gilt und an ihr wirksam geworden ist.
- source_word: μεγάλα
  choice: Großes
  rationale: Das substantivierte Neutrum Plural bezeichnet große Taten oder Dinge umfassend. Das deutsche substantivierte Singularkollektiv „Großes“ ist die natürliche, traditionsnahe Entsprechung.
- source_word: ὁ δυνατός
  choice: der Mächtige
  rationale: Der Artikel substantiviert das Adjektiv und macht es zu einer Bezeichnung Gottes. „Der Mächtige“ wahrt diese titelartige, ehrfürchtige Form ohne zusätzliche Deutung.
- source_word: ἅγιον
  choice: heilig
  rationale: Gibt das prädikative Adjektiv in seiner üblichen biblischen Bedeutung wieder und bewahrt die vorangestellte, betonte Stellung.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: sein Name
  rationale: Ist die direkte und idiomatische deutsche Wiedergabe; die im biblischen Begriff „Name“ mitschwingende Bedeutung von offenbartem Wesen und Ansehen wird nicht paraphrasierend eingeengt.
theological_decisions:
- issue: Wiedergabe von ὁ δυνατός als Gottesbezeichnung
  choice: der Mächtige
  alternative: der, der mächtig ist
  rationale: Das substantivierte Adjektiv mit Artikel fungiert als ehrfürchtige Gottesbezeichnung. Die knappe deutsche Form erhält diesen Charakter, ohne eine weitergehende Lehrentscheidung einzutragen.
- issue: Wortstellung in καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: und heilig ist sein Name
  alternative: und sein Name ist heilig
  rationale: Die gewählte Stellung bewahrt die Hervorhebung von „heilig“ im Griechischen und bleibt zugleich verständliches, würdevolles Deutsch.
- issue: Deutung des Dativs μοι
  choice: an mir
  alternative: für mich
  rationale: „An mir“ entspricht im Kontext natürlichem biblischem Deutsch und kann sowohl das Maria zugutekommende als auch das an ihr vollzogene Handeln Gottes umfassen; damit wird die Beziehung nicht unnötig auf einen rein benefaktiven Sinn verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Lobpreisregister. Die griechische Hervorhebung von „heilig“ bleibt durch die Wortstellung erhalten; es sind keine Fußnoten erforderlich.
