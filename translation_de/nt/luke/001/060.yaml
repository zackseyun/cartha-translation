  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: de
  text: 'Seine Mutter aber antwortete: „Nein, sondern er wird Johannes heißen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: widersprach
  rationale: Das Aoristpartizip führt ihre Antwort ein. Da sie den vorgeschlagenen Namen ausdrücklich zurückweist, gibt „widersprach“ die kontextuelle Funktion im Deutschen natürlicher wieder als das formelhafte „antwortete“.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: seine Mutter
  rationale: Natürliche deutsche Wiedergabe des bestimmten griechischen Nominalausdrucks mit Possessivpronomen.
- source_word: Οὐχί
  choice: Nein
  rationale: Die betonte Verneinung wird im unmittelbaren Dialog knapp und idiomatisch mit „Nein“ wiedergegeben.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der ausdrücklichen Verneinung markiert ἀλλά eine Korrektur; die deutsche Konstruktion „nicht/nein, sondern“ bildet diese Funktion präzise ab.
- source_word: κληθήσεται
  choice: soll … heißen
  rationale: Das Futur Passiv von καλέω bezeichnet hier die Namensgebung. „Er soll Johannes heißen“ ist im heutigen Deutsch natürlich und bewahrt gegenüber einem bloßen Futur den im Kontext erkennbaren entschiedenen Namenswillen, ohne eine göttliche Anordnung ausdrücklich hinzuzufügen.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Eingebürgerte deutsche Form des biblischen Personennamens.
