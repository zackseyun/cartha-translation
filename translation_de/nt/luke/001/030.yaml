  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: de
  text: 'Und der Engel sagte zu ihr: »Hab keine Angst, Maria, denn du hast Gunst[a] bei Gott gefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gnade«; das griechische Wort χάρις kann sowohl »Gunst« als auch »Gnade« bedeuten. In der Wendung »Gunst bei Gott finden« entspricht »Gunst« hier am besten dem griechischen Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Der narrative Aorist von λέγω wird in natürlichem modernem Deutsch mit dem Präteritum »sagte« wiedergegeben.
- source_word: ἄγγελος
  choice: Engel
  rationale: Im Kontext der lukanischen Kindheitsgeschichte bezeichnet das Wort ein himmlisches Wesen; »Engel« ist daher genauer als das allgemeinere »Bote«.
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Die verneinte Imperativform wird idiomatisch und unmittelbar wiedergegeben; sie kann sowohl eine gegenwärtige Furcht als auch die Aufforderung, sich nicht zu fürchten, ausdrücken.
- source_word: Μαριάμ
  choice: Maria
  rationale: Der Personenname folgt der etablierten deutschen Namensform.
- source_word: εὗρες
  choice: du hast … gefunden
  rationale: Das deutsche Perfekt gibt die abgeschlossene Handlung mit ihrer für die Gegenwart fortbestehenden Bedeutung in der Ankündigung natürlich wieder.
- source_word: χάριν
  choice: Gunst
  rationale: In der festen Wendung εὑρίσκω χάριν παρά bezeichnet χάρις die wohlwollende Zuwendung einer Person; »Gunst finden« bewahrt das Idiom und vermeidet eine vorschnelle dogmatische Festlegung.
- source_word: παρὰ τῷ θεῷ
  choice: bei Gott
  rationale: 'Nach »Gunst finden« entspricht »bei Gott« dem Sinn von παρά mit Dativ: in Gottes Augen beziehungsweise bei ihm.'
theological_decisions:
- issue: Wiedergabe von χάριν im marianischen Kontext
  choice: Gunst
  alternative: Gnade
  rationale: Die griechische Verbindung »Gunst finden bei« ist idiomatisch und hebt Gottes wohlwollende Zuwendung hervor. »Gnade« bleibt lexikalisch möglich, würde hier jedoch die feste Wendung weniger natürlich wiedergeben und könnte spätere lehrmäßige Bedeutungen in den Vers hineintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »Hab keine Angst« klingt natürlich und tröstlich; »Gunst bei Gott gefunden« bewahrt die biblische Ausdrucksweise, ohne unverständlich oder konfessionell festgelegt zu wirken.
