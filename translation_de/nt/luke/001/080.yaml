source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: de
  text: Das Kind aber wuchs heran und wurde stark im Geist[a]. Es war in den Einöden[b] bis zu dem Tag, an dem es öffentlich vor Israel auftrat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „innerlich stark“. Gemeint sein kann allgemein innere oder geistliche Stärke, möglicherweise aber auch eine Stärkung durch den Heiligen Geist.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht im Griechischen der Plural: „in den Einöden“ beziehungsweise „in den unbewohnten Gegenden“. Gemeint ist nicht zwingend eine Sandwüste.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bis zum Tag seines Offenbarwerdens vor Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: das Kind
  rationale: Die Bezeichnung verweist auf Johannes in seiner Kindheit beziehungsweise Jugend, ohne sein Alter näher festzulegen. „Das Kind“ ist im Deutschen natürlich und hinreichend weit.
- source_word: ηὔξανε
  choice: wuchs heran
  rationale: Das Imperfekt bezeichnet eine fortdauernde Entwicklung. „Wuchs heran“ gibt diesen Verlauf idiomatisch wieder.
- source_word: ἐκραταιοῦτο
  choice: wurde stark
  rationale: Die Form beschreibt einen fortschreitenden Vorgang und lässt offen, ob sie eher passiv oder intransitiv zu verstehen ist. „Wurde stark“ bewahrt diese Offenheit weitgehend.
- source_word: πνεύματι
  choice: im Geist
  rationale: Der artikellose Dativ bezeichnet den Bereich oder die Hinsicht des Erstarkens. „Im Geist“ lässt sowohl innere beziehungsweise geistliche Kraft als auch einen Bezug zum Heiligen Geist zu.
- source_word: ἐν ταῖς ἐρήμοις
  choice: in den Einöden
  rationale: Der Plural des Griechischen wird bewahrt. „Einöden“ bezeichnet unbewohnte, abgelegene Gegenden, ohne die Landschaft unnötig auf Sandwüsten einzuengen.
- source_word: ἀναδείξεως
  choice: öffentlich auftrat
  rationale: Das Substantiv bezeichnet das Sichtbarwerden oder öffentliche Hervortreten. Die verbale Wiedergabe ist in modernem Deutsch klar und natürlich.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: vor Israel
  rationale: Im Zusammenhang mit dem öffentlichen Auftreten bezeichnet πρός Israel als das Volk, vor dem beziehungsweise dem gegenüber Johannes hervortrat.
theological_decisions:
- issue: Bedeutung von πνεύματι bei der Entwicklung des Johannes
  choice: im Geist
  alternative: innerlich stark; durch den Geist gestärkt
  rationale: Der griechische Text nennt den Heiligen Geist hier nicht ausdrücklich. Die Formulierung „im Geist“ bewahrt die Spannung zwischen allgemeiner innerer beziehungsweise geistlicher Stärke und einem möglichen Bezug zum Heiligen Geist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden griechischen Imperfekte werden als fortschreitende Entwicklung wiedergegeben. Der Plural bei ἐρήμοις bleibt erhalten; die Mehrdeutigkeit von πνεύματι wird nicht dogmatisch aufgelöst.
