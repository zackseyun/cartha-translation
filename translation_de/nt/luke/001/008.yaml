base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: de
  text: Während er nun vor Gott als Priester Dienst tat, als seine Abteilung an der Reihe war, geschah es, dass
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es
  rationale: Die griechische Erzählformel leitet zusammen mit dem folgenden Temporalsatz einen neuen Vorgang ein. Die Endstellung ist im Deutschen natürlich, weil der Satz in Vers 9 weitergeführt wird; δέ wird durch „nun“ im Temporalsatz als milder narrativer Übergang wiedergegeben.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: während er … als Priester Dienst tat
  rationale: Die Konstruktion aus ἐν und substantiviertem Infinitiv ist temporal; ἱερατεύω bezeichnet ausdrücklich priesterlichen Dienst.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: als seine Abteilung an der Reihe war
  rationale: τάξις bezeichnet hier die festgelegte Ordnung, ἐφημερία die turnusmäßig dienende Priesterabteilung. Die Formulierung macht den Dienstturnus verständlich, ohne die institutionelle Bedeutung von „Abteilung“ aufzugeben.
- source_word: ἔναντι τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Wendung bewahrt den Sinn des Dienstes in Gottes Gegenwart und entspricht würdigem, geläufigem Deutsch.
theological_decisions:
- issue: Kultische Bezeichnung für den Tempeldienst des Zacharias
  choice: vor Gott als Priester Dienst tat, als seine Abteilung an der Reihe war
  alternative: vor Gott Priesterdienst verrichtete, gemäß der Ordnung seiner Dienstabteilung
  rationale: Die gewählte Fassung bewahrt den historischen priesterlichen Dienst und den geregelten Turnus, ohne spätere kirchliche Amtsvorstellungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt absichtlich syntaktisch offen und endet mit „dass“, weil Ἐγένετο mit dem Inhalt in Vers 9 fortgeführt wird; ein Punkt würde die griechische Satzstruktur künstlich abschließen.
