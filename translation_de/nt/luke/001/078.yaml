id: LUK.1.78
reference: Luke 1:78
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: de
  text: wegen des tiefen Erbarmens unseres Gottes, durch das uns der Aufgang aus der Höhe[a] besuchen wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Morgendämmerung«; das griechische Wort kann auch an den messianischen Titel »der Spross« in der griechischen Übersetzung des Alten Testaments anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ σπλάγχνα ἐλέους
  choice: wegen des tiefen Erbarmens
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Die wörtliche Wendung »Eingeweide des Erbarmens« ist im Deutschen unidiomatisch; »tiefes Erbarmen« gibt die innige, aus dem Innersten kommende Barmherzigkeit natürlich und würdig wieder.
- source_word: θεοῦ ἡμῶν
  choice: unseres Gottes
  rationale: Gibt den possessiven Genitiv unmittelbar und in natürlicher deutscher Wortstellung wieder.
- source_word: ἐν οἷς
  choice: durch das
  rationale: Der Relativausdruck greift das Erbarmen auf und kann den Bereich oder das Mittel bezeichnen, in beziehungsweise durch das Gottes rettender Besuch geschieht. »Durch das« ist im Deutschen flüssig und bewahrt den instrumentalen Sinn.
- source_word: ἐπισκέψεται
  choice: wird … besuchen
  rationale: Bewahrt das Futur und die Grundbedeutung von ἐπισκέπτομαι. Der biblische Beiklang eines gnädigen, helfenden Eingreifens bleibt dem Kontext überlassen.
- source_word: ἀνατολὴ
  choice: der Aufgang
  rationale: ἀνατολή bezeichnet das Aufgehen beziehungsweise den Morgenanbruch und kann zugleich an den messianischen Titel »Spross« in der Septuaginta erinnern. »Aufgang« erhält diese Mehrdeutigkeit besser als das eindeutigere »Sonnenaufgang«.
- source_word: ἐξ ὕψους
  choice: aus der Höhe
  rationale: Nahe Wiedergabe des griechischen Ausdrucks für den himmlischen Bereich, ohne ihn im Haupttext ausdrücklich zu »Himmel« auszudeuten.
theological_decisions:
- issue: Messianische Bedeutung von ἀνατολή
  choice: »der Aufgang« im Haupttext
  alternative: »die Morgendämmerung«, »der Sonnenaufgang« oder »der Spross«
  rationale: Der Lichtzusammenhang in Vers 79 legt Morgenanbruch beziehungsweise Sonnenaufgang nahe. Zugleich kann das Wort die messianische Spross-Terminologie der griechischen Schriften Israels anklingen lassen. Die offenere Wiedergabe im Haupttext und eine Fußnote bewahren beide Resonanzen, ohne eine davon als allein sicher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Teilsatz mit Komma gestaltet, entsprechend dem gelieferten Einzelvers und seinem Zusammenhang. »Tiefes Erbarmen« vermeidet eine unverständliche anatomische Wörtlichkeit; »Aufgang« hält die bildhafte und messianische Mehrdeutigkeit offen.
