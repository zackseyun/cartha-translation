id: LUK.1.19
reference: Luke 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: de
  text: 'Da antwortete ihm der Engel: »Ich bin Gabriel, der vor Gott steht. Ich wurde gesandt, um mit dir zu reden und dir diese gute Nachricht zu verkünden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und dir diese Dinge als gute Nachricht zu verkünden«; »diese Dinge« meint die Botschaft, die Gabriel angekündigt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Da antwortete
  rationale: Das Aoristpartizip leitet die direkte Rede ein; eine finite Form ist im Deutschen natürlich und bewahrt den erzählerischen Anschluss.
- source_word: ἄγγελος
  choice: der Engel
  rationale: Im Kontext bezeichnet das Wort eindeutig ein himmlisches Wesen, das sich als Gabriel zu erkennen gibt.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Ich bin Gabriel
  rationale: Die schlichte Wiedergabe erhält die ausdrückliche, nachdrückliche Selbstvorstellung.
- source_word: ὁ παρεστηκὼς
  choice: der vor Gott steht
  rationale: Das Perfektpartizip beschreibt Gabriels fortdauernde Stellung beziehungsweise seinen Dienst in Gottes Gegenwart.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe deutsche Wendung gibt sowohl die räumlich-bildhafte Nähe als auch den höfischen Dienstcharakter natürlich wieder.
- source_word: ἀπεστάλην
  choice: Ich wurde gesandt
  rationale: Die Passivform bewahrt den Gedanken göttlicher Beauftragung, ohne den im Satz nicht ausdrücklich genannten Handelnden hinzuzufügen.
- source_word: λαλῆσαι πρὸς σὲ
  choice: um mit dir zu reden
  rationale: Die Zweckangabe wird natürlich wiedergegeben; »mit dir reden« bewahrt die personale Ausrichtung von πρὸς σέ.
- source_word: εὐαγγελίσασθαί σοι ταῦτα
  choice: dir diese gute Nachricht zu verkünden
  rationale: Die Formulierung gibt die Bedeutung von εὐαγγελίζω als Verkündigung guter Nachricht wieder und bezieht ταῦτα idiomatisch auf die soeben angekündigte Botschaft.
theological_decisions:
- issue: Wiedergabe von εὐαγγελίζω in der Engelsankündigung
  choice: gute Nachricht verkünden
  alternative: das Evangelium verkünden
  rationale: »Gute Nachricht« erhält die Grundbedeutung, ohne an dieser Stelle vorschnell einen späteren christlichen Fachbegriff einzutragen.
- issue: Der nicht ausdrücklich genannte Absender bei ἀπεστάλην
  choice: 'Passiv ohne Ergänzung: »Ich wurde gesandt«'
  alternative: »Gott hat mich gesandt«
  rationale: Der Zusammenhang legt Gott als Absender nahe, doch der griechische Satz nennt ihn in dieser Aussage nicht ausdrücklich; das Passiv bewahrt diese formale Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da antwortete« trägt den Erzählfluss; »vor Gott steht« ist bewusst knapper und natürlicher als »in der Gegenwart Gottes steht«. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
