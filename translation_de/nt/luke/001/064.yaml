  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: de
  text: Sofort wurden sein Mund und auch seine Zunge geöffnet[a], und er begann zu reden[b] und pries Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen nur: „und seine Zunge“. Manche Übersetzungen ergänzen: „seine Zunge wurde gelöst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er redete“. Der griechische Imperfekt kann das andauernde Reden betonen, nicht nur dessen Beginn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: wurde geöffnet
  rationale: Das Passiv gibt die Form des griechischen Aoristpassivs wieder und beschreibt die plötzliche Wiederherstellung der Sprechfähigkeit, ohne den Handelnden ausdrücklich zu benennen.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier die Erzählung mit einer leichten Verknüpfung weiter; „und“ ist im Deutschen natürlich und legt keinen unnötigen Gegensatz nahe.
- source_word: στόμα
  choice: Mund
  rationale: Direkte und kontextgemäße Wiedergabe des anatomischen Ausdrucks.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Gibt die unmittelbare zeitliche Abfolge und Plötzlichkeit prägnant wieder.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: und ebenso seine Zunge
  rationale: Bewahrt die ausdrückliche Nennung von Mund und Zunge sowie die elliptische Verknüpfung des griechischen Satzes, ohne das nicht ausdrücklich vorhandene „wurde gelöst“ einzufügen.
- source_word: ἐλάλει
  choice: begann zu reden
  rationale: Der Imperfekt kann fortdauerndes Reden bezeichnen; nach der vorausgegangenen Stummheit legt der Erzählzusammenhang zugleich den Beginn des Redens nahe. Die verbleibende Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: εὐλογῶν
  choice: pries
  rationale: Bei Gott als Objekt bezeichnet εὐλογέω hier ehrendes, lobendes Reden. „Pries“ ist im modernen Deutschen natürlicher und eindeutiger als „segnete Gott“.
- source_word: τὸν θεόν
  choice: Gott
  rationale: Standardmäßige Wiedergabe des direkten Objekts im Deutschen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnlich knappe Erwähnung der Zunge wird im Haupttext bewahrt und in der Fußnote erläutert; die aspektuelle Offenheit von ἐλάλει wird nicht verschwiegen.
