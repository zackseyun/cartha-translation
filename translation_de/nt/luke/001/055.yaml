source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: de
  text: wie er zu unseren Vätern[a] geredet hat, zu Abraham und zu seiner Nachkommenschaft[b] in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu unseren Vorfahren“. Wörtlich steht im Griechischen „zu unseren Vätern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu seinem Samen“ beziehungsweise „zu seinen Nachkommen“. Das griechische Wort steht im Singular und kann kollektiv „Same“, „Nachkommenschaft“ oder „Nachkommen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet die Übereinstimmung mit der vorausgehenden Aussage ein; im Deutschen gibt „wie“ den Zusammenhang natürlich und präzise wieder.
- source_word: ἐλάλησεν
  choice: geredet hat
  rationale: Das Perfekt ist in modernem Standarddeutsch als Erzählform natürlich und bewahrt den Bezug auf das frühere Reden Gottes.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: zu unseren Vätern
  rationale: Bewahrt die ausdrücklich männliche Form des Griechischen sowie den patriarchalisch-bundestheologischen Anklang; die inklusivere Bedeutung „Vorfahren“ wird in der Fußnote genannt.
- source_word: τῷ Ἀβραὰμ
  choice: zu Abraham
  rationale: Der Dativ wird als Fortführung der von πρὸς bestimmten Beziehung verstanden und bildet zusammen mit dem folgenden Ausdruck eine Apposition zu „unseren Vätern“.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: zu seiner Nachkommenschaft
  rationale: „Nachkommenschaft“ kann wie das griechische Singularwort kollektiv verstanden werden und klingt im Deutschen natürlicher als „Samen“, ohne die kollektive Einheit in eine ausdrückliche Mehrzahl aufzulösen.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Gängige, würdige deutsche Wiedergabe der idiomatischen Wendung für unbegrenzte Dauer.
theological_decisions:
- issue: Wiedergabe von πατέρας ἡμῶν
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Formulierung erhält die maskuline und bundestheologisch geprägte Sprache des Ausgangstextes; die mögliche repräsentative Bedeutung wird nicht ausgeschlossen und in einer Fußnote ausgewiesen.
- issue: Wiedergabe von σπέρματι αὐτοῦ im Zusammenhang der Abrahamverheißung
  choice: seine Nachkommenschaft
  alternative: sein Same; seine Nachkommen
  rationale: Die gewählte kollektive Singularform bewahrt die Mehrdeutigkeit zwischen einem Kollektiv und dessen einheitlicher Bezeichnung besser als die ausdrückliche Mehrzahl „Nachkommen“. „Same“ ist formal näher, im heutigen Deutsch jedoch missverständlich, und wird deshalb als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ formaler biblischer Diktion. „Geredet hat“ ist gegenwärtig verständlich; „in Ewigkeit“ erhält den feierlichen Ton des Lobgesangs. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
