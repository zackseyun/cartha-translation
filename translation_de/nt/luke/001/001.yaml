  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: de
  text: Da viele es unternommen haben, einen Bericht über die Ereignisse zusammenzustellen, die sich unter uns erfüllt haben,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die unter uns vollbracht worden sind“; möglicherweise auch: „die unter uns völlig bestätigt worden sind“.'
    reason: Lexikalische Alternative für πεπληροφορημένων; der Ausdruck kann Erfüllung beziehungsweise Vollendung, möglicherweise aber auch volle Bestätigung bezeichnen.
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Da
  rationale: Leitet den gehobenen Prolog mit einer begründenden Hintergrundangabe ein. „Da“ ist im modernen Deutsch natürlich; die verstärkende Nuance von -περ ergibt sich vor allem aus dem formellen Satzbau.
- source_word: πολλοὶ
  choice: viele
  rationale: Gibt die schlichte Mengenangabe wieder, ohne das im Griechischen nicht ausdrücklich vorhandene „andere“ hinzuzufügen.
- source_word: ἐπεχείρησαν
  choice: haben … unternommen
  rationale: Bezeichnet das Beginnen eines Vorhabens und unterstellt im Unterschied zu „versucht“ nicht, dass es gescheitert sei.
- source_word: ἀνατάξασθαι
  choice: zusammenzustellen
  rationale: Bezeichnet das Abfassen beziehungsweise geordnete Zusammenstellen einer Darstellung und klingt im heutigen Deutsch natürlich.
- source_word: διήγησιν
  choice: einen Bericht
  rationale: Bewahrt den erzählerisch-historiografischen Charakter; „Darstellung“ oder „Erzählung“ wären ebenfalls möglich.
- source_word: περὶ
  choice: über
  rationale: Ist die natürliche moderne Entsprechung und wahrt den Bezug auf den Gegenstand des Berichts.
- source_word: τῶν πεπληροφορημένων
  choice: die sich … erfüllt haben
  rationale: Gibt den Perfektcharakter und den im Zusammenhang wahrscheinlichen Sinn von Erfüllung beziehungsweise Vollendung wieder. Die medial klingende deutsche Form ist idiomatisch, obwohl das griechische Partizip formal passiv ist.
- source_word: ἐν ἡμῖν
  choice: unter uns
  rationale: Lässt den Kreis, auf den sich „uns“ bezieht, ebenso offen wie der griechische Text und bezeichnet Geschehen innerhalb ihrer Gemeinschaft beziehungsweise Lebenswelt.
- source_word: πραγμάτων
  choice: Geschehnisse
  rationale: Passt zu konkreten erzählten Vorgängen und ist im Deutschen natürlicher als „Dinge“ oder das abstraktere „Angelegenheiten“.
theological_decisions:
- issue: Bedeutung von πεπληροφορημένων im Prolog
  choice: erfüllt
  alternative: vollbracht; unter uns völlig bestätigt
  rationale: Mit πραγμάτων liegt der Sinn erfüllter beziehungsweise vollendeter Geschehnisse nahe und entspricht zugleich einem Motiv des Lukasevangeliums. Da das Verb auch den Gedanken völliger Gewissheit oder Bestätigung tragen kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Der Vers bleibt als Auftakt des langen, kunstvoll gebauten Prologs syntaktisch offen; das abschließende Komma signalisiert die Fortsetzung in Vers 2.
