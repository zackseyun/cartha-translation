  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: de
  text: 'Nach diesen Tagen wurde seine Frau Elisabet schwanger. Sie hielt sich fünf Monate lang verborgen und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Nach diesen Tagen
  rationale: μετά mit Akkusativ bezeichnet die zeitliche Folge. Das leicht weiterführende δέ muss im natürlichen Deutschen nicht eigens wiedergegeben werden; ταύτας wird als „diesen“ bewahrt.
- source_word: συνέλαβεν
  choice: wurde schwanger
  rationale: Im Kontext bezeichnet συλλαμβάνω die Empfängnis beziehungsweise den Eintritt der Schwangerschaft. „Wurde schwanger“ ist im heutigen Deutsch natürlicher und eindeutiger als das alleinstehende „empfing“.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Gebräuchliche deutsche Form des Personennamens in modernen Bibelausgaben.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: seine Frau
  rationale: γυνή bedeutet mit dem Possessivpronomen in diesem Zusammenhang eindeutig „Ehefrau“; die deutsche Wortstellung verlangt die Voranstellung vor dem Namen.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: Sie hielt sich ... verborgen
  rationale: Die reflexive Form und das Imperfekt bezeichnen einen über längere Zeit andauernden Rückzug beziehungsweise Zustand des Verborgenseins.
- source_word: μῆνας πέντε
  choice: fünf Monate lang
  rationale: Der Akkusativ bezeichnet die Zeitdauer; „lang“ macht diese Funktion im Deutschen idiomatisch deutlich.
- source_word: λέγουσα
  choice: 'und sagte:'
  rationale: Das Partizip leitet die im folgenden Vers wiedergegebene Rede ein. Die finite deutsche Form ergibt eine natürliche Satzverknüpfung, während der Doppelpunkt die Fortsetzung anzeigt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der griechische Satz wurde in zwei deutsche Hauptsätze gegliedert, um eine schwerfällige Verschachtelung zu vermeiden. Keine Fußnote ist nötig, da die möglichen Nuancen im Deutschen ohne sachlichen Verlust im Haupttext wiedergegeben werden.
