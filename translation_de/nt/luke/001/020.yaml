source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: de
  text: 'Und sieh: du wirst schweigen und nicht sprechen können bis zu dem Tag, an dem dies alles geschieht, weil du meinen Worten nicht geglaubt hast, die zu ihrer bestimmten Zeit in Erfüllung gehen werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt das aufmerksamkeitslenkende Signal und den feierlichen Ton, ohne im modernen Deutschen altertümlich zu wirken.
- source_word: ἔσῃ σιωπῶν
  choice: du wirst schweigen
  rationale: Gibt die resultierende, andauernde Lage wieder; zusammen mit dem folgenden Unvermögen wird deutlich, dass das Schweigen nicht freiwillig ist.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: nicht sprechen können
  rationale: Bewahrt ausdrücklich den Gedanken tatsächlicher Unfähigkeit zu sprechen.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: bis zu dem Tag, an dem dies geschieht
  rationale: Eine natürliche deutsche Wiedergabe der zeitlichen Grenze und des Eintretens der angekündigten Ereignisse.
- source_word: ἀνθ’ ὧν
  choice: weil
  rationale: Drückt in diesem Zusammenhang die Ursache beziehungsweise den Grund der auferlegten Sprachlosigkeit klar aus.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: du meinen Worten nicht geglaubt hast
  rationale: Bewahrt sowohl das Verb des Glaubens als auch den Bezug auf die gesprochenen Worte des Engels.
- source_word: οἵτινες πληρωθήσονται
  choice: Sie werden in Erfüllung gehen
  rationale: Das eigenständige Pronomen bezieht sich eindeutig auf die Worte und bewahrt den Gedanken ihrer zukünftigen Verwirklichung.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: zu ihrer bestimmten Zeit
  rationale: καιρός bezeichnet hier nicht bloß einen Zeitpunkt, sondern die dafür bestimmte beziehungsweise angemessene Zeit.
theological_decisions:
- issue: Art von Zacharias’ Schweigen
  choice: Eine auferlegte Unfähigkeit zu sprechen
  alternative: Eine freiwillige Verpflichtung zum Schweigen
  rationale: Die Verbindung von σιωπῶν mit μὴ δυνάμενος λαλῆσαι bezeichnet nicht nur Stille, sondern ausdrücklich fehlendes Sprechvermögen.
- issue: Zeitpunkt der Erfüllung
  choice: Die Worte erfüllen sich zu ihrer bestimmten Zeit
  alternative: Die Worte erfüllen sich lediglich irgendwann in der Zukunft
  rationale: καιρός trägt den Sinn einer passenden oder bestimmten Zeit; die Übersetzung wahrt dies, ohne ausdrücklich festzulegen, wer sie bestimmt hat.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Sieh“ erhält den griechischen Aufmerksamkeitsruf; die Doppelung „schweigen und nicht sprechen können“ bewahrt die nachdrückliche Aussage des Ausgangstextes.
