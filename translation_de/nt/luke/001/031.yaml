    issue: „du sollst ihm den Namen Jesus geben“
    rationale: καλέσεις ist formal ein Futur Indikativ und steht parallel zu „du wirst schwanger werden“ und „[du wirst] ... zur Welt bringen“. Der Kontext schließt einen Auftrag nicht aus, aber der griechische Wortlaut markiert hier keine imperativische Modalität. Die Übersetzung sollte daher die Zukunftsaussage bewahren.
  - severity: low
    issue: Fußnote zur Modalität
    rationale: Die Fußnote stellt die vorhersagende Lesart nur als Alternative zu einer im Haupttext gewählten Anweisung dar. Nach der Korrektur zur Zukunftsaussage ist sie entbehrlich; eine textkritische oder semantische Ungewissheit, die eine Fußnote erforderte, liegt nicht vor.
