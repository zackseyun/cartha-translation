source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: de
  text: 'Und siehe: Du wirst schwanger werden und einen Sohn zur Welt bringen, und du wirst ihm den Namen Jesus geben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Die Aufmerksamkeitspartikel wird direkt und verständlich wiedergegeben; „siehe“ wäre feierlicher, wirkt im modernen Standarddeutsch jedoch stärker altertümlich.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: du wirst schwanger werden
  rationale: Die griechische Wendung bezeichnet idiomatisch das Empfangen beziehungsweise Schwangerwerden. Eine wörtliche Wiedergabe mit „im Mutterleib empfangen“ wäre im Deutschen unnatürlich und potenziell missverständlich.
- source_word: τέξῃ υἱόν
  choice: einen Sohn zur Welt bringen
  rationale: Gibt den Geburtsvorgang und die geschlechtsspezifische Bedeutung von υἱός präzise und in natürlichem modernem Deutsch wieder.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: du sollst ihm den Namen … geben
  rationale: Bewahrt die biblische Namengebungsformel erkennbar, ist aber idiomatischer als das im Deutschen schwerfällige „du wirst seinen Namen … nennen“. Das griechische Futur hat im Auftrag des Engels zugleich anweisenden Charakter.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Verwendet die im deutschen Neuen Testament etablierte Form des Personennamens.
theological_decisions:
- issue: Modalität von καλέσεις in der Namengebung
  choice: du sollst ihm den Namen Jesus geben
  alternative: du wirst ihm den Namen Jesus geben
  rationale: Im Kontext der Engelsankündigung kann das Futur sowohl vorhersagend als auch anweisend wirken. „Du sollst“ macht den Auftrag natürlich verständlich, ohne die angekündigte Gewissheit auszuschließen; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält den aufmerksamkeitslenkenden und feierlichen Ton von ἰδού, ohne das stärker altertümliche „siehe“. Die Satzstruktur bleibt eng am griechischen Ablauf, während idiomatische deutsche Wendungen für Schwangerschaft, Geburt und Namengebung verwendet werden.
