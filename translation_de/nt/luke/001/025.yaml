source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: de
  text: „Denn so hat der Herr an mir gehandelt in den Tagen, in denen er auf mich sah, um meine Schmach[a] unter den Menschen wegzunehmen.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Schande“ beziehungsweise „meine Entehrung“. Das griechische Wort bezeichnet besonders gesellschaftliche Schmach oder Entehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nicht eigens wiedergegeben; durch die eröffnete direkte Rede ausgedrückt
  rationale: Nach λέγουσα in Vers 24 leitet ὅτι den Inhalt von Elisabets Äußerung ein. Im natürlichen Deutschen genügt dafür die direkte Rede; ein vorangestelltes „denn“ würde einen kausalen Zusammenhang stärker festlegen.
- source_word: Οὕτως
  choice: So
  rationale: Gibt die hervorgehobene Art und Weise knapp, natürlich und quellennah wieder.
- source_word: μοι … πεποίηκεν
  choice: hat … an mir gehandelt
  rationale: Die Verbindung aus ποιέω und dem Dativ bezeichnet hier das persönliche Handeln des Herrn an Elisabet. Die Formulierung ist im Deutschen idiomatisch, ohne die Wirkung dieses Handelns vorwegzunehmen.
- source_word: κύριος
  choice: der Herr
  rationale: Bewahrt den Gottes­titel und entspricht dem unmittelbaren Kontext, in dem Elisabet Gottes Handeln an ihr beschreibt.
- source_word: ἐν ἡμέραις αἷς
  choice: in den Tagen, als
  rationale: Erhält die zeitliche Wendung des Griechischen in verständlichem modernem Deutsch.
- source_word: ἐπεῖδεν
  choice: er auf mich sah
  rationale: Bewahrt das Bild des Hinsehens und bringt zugleich die zugewandte Beachtung zum Ausdruck. Das im Griechischen nicht ausdrücklich genannte Objekt ergibt sich aus μοι und dem Kontext.
- source_word: ἀφελεῖν
  choice: um … wegzunehmen
  rationale: Gibt den Infinitiv als Zweck des gnädigen Hinsehens wieder; eine Ergebnisnuance bleibt dabei ebenfalls möglich.
- source_word: ὄνειδός μου
  choice: meine Schmach
  rationale: „Schmach“ bezeichnet äußere Entehrung und gesellschaftlichen Tadel deutlicher als das stärker innerlich empfundene „Scham“.
- source_word: ἐν ἀνθρώποις
  choice: unter den Menschen
  rationale: Kennzeichnet den gesellschaftlichen Bereich, in dem Elisabet die Schmach erfuhr, und gibt ἄνθρωποι geschlechtsübergreifend wieder.
theological_decisions:
- issue: Bezug von κύριος
  choice: „der Herr“ bezeichnet hier Gott.
  alternative: Eine engere christologische Zuordnung des Titels
  rationale: Der unmittelbare Zusammenhang handelt davon, dass Gott Elisabets Kinderlosigkeit beendet. Die Übersetzung bewahrt den Titel, ohne eine über den Kontext hinausgehende Zuordnung einzutragen.
- issue: Soziale Bedeutung von ὄνειδος
  choice: „Schmach“ mit Schwerpunkt auf öffentlicher Entehrung
  alternative: „Schande“ oder „Scham“
  rationale: Der Zusatz „unter den Menschen“ zeigt, dass die gesellschaftliche Herabsetzung im Vordergrund steht. „Schmach“ bewahrt diese äußere Dimension, ohne Elisabets innere Empfindungen auszuschließen.
- issue: Verhältnis von ἐπεῖδεν und ἀφελεῖν
  choice: 'Zweckbeziehung: „um … wegzunehmen“'
  alternative: 'Ergebnisbeziehung: „sodass er … wegnahm“'
  rationale: Der Infinitiv kann Zweck oder Ergebnis ausdrücken. Die Zweckformulierung ist syntaktisch naheliegend und lässt die enge Verbindung zwischen Gottes Hinsehen und der Beseitigung der Schmach bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schmach“ ist etwas gehobener, aber allgemein verständlich und trägt die öffentliche Ehr-Schande-Dimension präziser als „Scham“. Die Satzgestalt bleibt nahe am griechischen Aufbau, ohne unnatürlich zu wirken.
