revisions:
- from: „So hat der Herr an mir gehandelt in den Tagen, als er auf mich sah, um meine Schmach[a] unter den Menschen wegzunehmen.“
  to: „Denn so hat der Herr an mir gehandelt in den Tagen, in denen er auf mich sah, um meine Schmach[a] unter den Menschen wegzunehmen.“
  rationale: Die Revision ergänzt „Denn“ für ὅτι, glättet die temporale Relativkonstruktion und präzisiert die lexikalische Fußnote. „Schmach“, „der Herr“, „an mir gehandelt“ und die zweckbezogene Wiedergabe von ἀφελεῖν bleiben erhalten, da sie den griechischen Sinn und das angemessene Register gut wiedergeben.
