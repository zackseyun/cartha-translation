id: LUK.1.46
reference: Luke 1:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: de
  text: 'Und Maria sagte: »Meine Seele erhebt den Herrn[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verkündet die Größe des Herrn«; auch: »preist den Herrn als groß«.'
    reason: Lexikalische Alternative zu μεγαλύνει, dessen Bildgehalt im Deutschen sowohl mit »erheben« als auch expliziter mit dem Verkünden beziehungsweise Preisen der Größe ausgedrückt werden kann.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Die einfache verbindende Konjunktion bewahrt den griechischen Erzählfluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: εἶπεν
  choice: sagte
  rationale: Die erzählerische Aoristform von λέγω wird im modernen Standarddeutsch natürlich mit »sagte« wiedergegeben.
- source_word: Μαριάμ
  choice: Maria
  rationale: Der Personenname wird entsprechend der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: Μεγαλύνει
  choice: erhebt
  rationale: »Erhebt« bewahrt den poetischen Gedanken, den Herrn als groß zu rühmen, und klingt im Deutschen würdig und verständlich. Die im Griechischen angelegte Bedeutung des Großpreisens wird in der Fußnote ausdrücklich verdeutlicht.
- source_word: ἡ ψυχή μου
  choice: Meine Seele
  rationale: Die Wiedergabe erhält die semitisch-poetische Ausdrucksweise und reduziert ψυχή weder auf ein bloßes »ich« noch auf eine moderne psychologische Kategorie.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος fungiert hier als ehrfurchtsvoller Gottesname beziehungsweise göttlicher Titel; »Herr« bewahrt den schriftgeprägten und hymnischen Klang.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: den Herrn
  alternative: den Gebieter
  rationale: Im hymnischen, auf Gott bezogenen Kontext trägt »Herr« das schriftgeprägte theologische Gewicht des Titels. »Gebieter« wäre lexikalisch möglich, würde dessen Bedeutung hier aber unnötig verengen.
- issue: Anthropologische Ausdrucksweise in ἡ ψυχή μου
  choice: Meine Seele
  alternative: Ich / Mein Innerstes
  rationale: Die konkrete poetische Redeweise des Ausgangstextes bleibt erhalten, ohne sie auf ein Pronomen zu verflachen oder durch eine psychologisierende Deutung festzulegen.
- issue: Bedeutung von μεγαλύνει
  choice: erhebt
  alternative: verkündet die Größe von / preist als groß
  rationale: Das Verb beschreibt hier nicht, dass Maria Gott tatsächlich größer macht, sondern dass sie seine Größe rühmend anerkennt und verkündet. »Erhebt« hält die poetische Spannung offen; die Fußnote nennt die explizitere Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Klang. Die Satzstruktur bleibt knapp und entspricht dem Beginn eines Loblieds; die traditionelle Wendung »Meine Seele« wird wegen ihrer Verständlichkeit und Nähe zum griechischen Ausdruck beibehalten.
