  source_fidelity: Der Entwurf gibt die beiden substantivischen Partizipien πεινῶντας und πλουτοῦντας treffend als „die Hungrigen“ und „die Reichen“ wieder und bewahrt ihren konkreten sozialen Gegensatz. „Hat ... erfüllt“ entspricht ἐνέπλησεν angemessen; „mit Gutem“ gibt den genitivischen Inhalt ἀγαθῶν idiomatisch und ohne die nicht ausdrücklich genannte Nuance von „Gaben“ wieder. „Leer fortgeschickt“ bildet ἐξαπέστειλεν κενούς knapp und sachlich ab.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch mit einem angemessen würdigen, poetisch-parallelen Register. Die Voranstellung von „Die Hungrigen“ und „die Reichen“ ist im Deutschen möglich und trägt den Kontrast des griechischen Satzes. „Leer fortgeschickt“ ist etwas gehoben, aber klar und für den Lobgesang stilistisch passend.
  terminology: Die gewählten Bezeichnungen sind konsistent und vermeiden eine Spiritualisierung der sozialen Begriffe. „Gutem“ ist als substantivierte, zusammenfassende Wiedergabe von ἀγαθῶν vertretbar. Die Fußnote kennzeichnet „mit leeren Händen“ zutreffend als idiomatischere, aber bildlich stärker explizierte Alternative.
