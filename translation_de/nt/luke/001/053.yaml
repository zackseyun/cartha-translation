id: LUK.1.53
reference: Luke 1:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: de
  text: Die Hungrigen hat er mit Gutem erfüllt, und die Reichen hat er leer fortgeschickt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit leeren Händen fortgeschickt“.'
    reason: Lexikalische Alternative für κενούς; die Wendung ist idiomatisch, fügt jedoch das Bild der Hände ausdrücklich hinzu.
lexical_decisions:
- source_word: πεινῶντας
  choice: die Hungrigen
  rationale: Das substantivisch gebrauchte Präsenspartizip bezeichnet konkret hungernde Menschen. „Die Hungrigen“ ist im Deutschen natürlich und bewahrt den sozialen Gegensatz, ohne die Intensität zu „Verhungernden“ zu steigern.
- source_word: ἐνέπλησεν
  choice: hat er erfüllt
  rationale: Das Verb bezeichnet hier das Füllen mit etwas; das deutsche Perfekt gibt den rückblickend als vollzogen besungenen göttlichen Eingriff natürlich wieder. Zusammen mit „mit Gutem“ ist „erfüllt“ würdevoll und verständlich.
- source_word: ἀγαθῶν
  choice: mit Gutem
  rationale: Der Genitiv bezeichnet den Inhalt der Füllung. Die substantivierte Singularform „Gutem“ gibt die unbestimmte Mehrzahl guter Dinge idiomatisch wieder, ohne ausdrücklich „Gaben“ hinzuzufügen.
- source_word: πλουτοῦντας
  choice: die Reichen
  rationale: Das substantivisch gebrauchte Präsenspartizip benennt Menschen, die reich sind. „Die Reichen“ bildet den knappen, konkreten Gegenpol zu „den Hungrigen“.
- source_word: ἐξαπέστειλεν
  choice: hat er fortgeschickt
  rationale: Das Kompositum bezeichnet ein Weg- oder Fortschicken. „Fortgeschickt“ bewahrt diese Richtungskomponente und vermeidet den möglicherweise amtlichen Klang von „entlassen“.
- source_word: κενούς
  choice: leer
  rationale: Das prädikative Adjektiv beschreibt den Zustand der Reichen beim Fortgeschicktwerden. „Leer“ ist die formal nächste Wiedergabe und lässt offen, woran es ihnen fehlt; „mit leeren Händen“ wäre anschaulicher, aber interpretierend erweitert.
theological_decisions:
- issue: Sozial-theologische Umkehrung in Marias Lobgesang
  choice: Der konkrete Gegensatz zwischen den Hungrigen und den Reichen bleibt erhalten.
  alternative: Die Hungrigen als geistlich Bedürftige und die Reichen als Selbstzufriedene oder Stolze deuten.
  rationale: Der griechische Text nennt reale hungernde und reiche Menschen und steht im lukanischen Motiv göttlicher Umkehrung. Mögliche geistliche Anwendungen werden nicht in die Übersetzung selbst eingetragen.
- issue: Zeitliche Perspektive der Aoristformen
  choice: Deutsches Perfekt („hat … erfüllt“, „hat … fortgeschickt“)
  alternative: Präteritum („erfüllte“, „schickte … fort“) oder präsentische Wiedergabe
  rationale: Im prophetisch-preisenden Zusammenhang beschreibt Maria Gottes Handeln als vollzogen. Das Perfekt ist in modernem Standarddeutsch natürlich und erhält diese Perspektive, ohne den zeitlichen Bezug näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem Parallelismus. Die Wortstellung hebt wie der griechische Text zuerst „die Hungrigen“ und dann „die Reichen“ hervor. Der konkrete soziale Gegensatz wird nicht spiritualisiert.
