    rationale: Das deutsche „wie er das Kind nennen lassen wolle“ ist verständlich, gibt τί („was“) aber weniger genau wieder und kann „wie“ als Modalfrage nahelegen. Eine Formulierung mit „welchen Namen“ ist semantisch klarer.
