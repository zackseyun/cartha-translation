  text: ἐνένευον δὲ τῷ πατρὶ αὐτοῦ τὸ τί ἂν θέλοι καλεῖσθαι ⸀αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/062.yaml
  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: de
  text: Da machten sie seinem Vater Zeichen, welchen Namen er für das Kind wünsche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „was er wolle, dass das Kind genannt werde“.'
    reason: Die Fußnote hält die passive Konstruktion von καλεῖσθαι sowie die wörtlichere Form der indirekten Frage fest.
lexical_decisions:
- source_word: ἐνένευον
  choice: machten … Zeichen
  rationale: Das Verb bezeichnet eine Verständigung durch Zeichen oder Gesten; die Wendung ist im Deutschen natürlich und wahrt die nonverbale Handlung.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit einem leichten Anschluss weiter; „Da“ gibt hier die narrative Folge idiomatisch wieder.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: seinem Vater
  rationale: Der Dativ bezeichnet den Adressaten der Zeichen. Im Deutschen genügt bei „jemandem Zeichen machen“ der Dativ ohne Präposition.
- source_word: τὸ τί ἂν θέλοι
  choice: wie er … wolle
  rationale: Die substantivierte indirekte Frage gibt den Inhalt der Zeichen an. Der Konjunktiv „wolle“ bewahrt den indirekten, nicht ausdrücklich als Tatsache behaupteten Wunsch, ohne das griechische ἄν überzubestimmen.
- source_word: καλεῖσθαι αὐτό
  choice: das Kind nennen lassen
  rationale: Der passive Infinitiv wird mit „nennen lassen“ wiedergegeben; „das Kind“ macht den Bezug von αὐτό im Deutschen eindeutig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der griechischen Satzstruktur, vermeidet aber ein im Deutschen unnatürliches „was er wolle, dass es genannt werde“ im Haupttext.
