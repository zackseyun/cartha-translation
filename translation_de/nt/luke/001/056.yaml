  terminology: „Maria“ entspricht der üblichen deutschen biblischen Namensform. „Bei ihr“, „etwa drei Monate“ und „in ihr Zuhause zurück“ treffen die jeweiligen griechischen Ausdrücke angemessen. Es sind keine theologischen Fachbegriffe oder strittigen Deutungen betroffen.
