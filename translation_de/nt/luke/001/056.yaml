  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: de
  text: Maria blieb etwa drei Monate bei ihr und kehrte dann in ihr Zuhause zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: blieb
  rationale: Das Aoristverb μένω bezeichnet hier den Aufenthalt über einen bestimmten Zeitraum; „blieb“ ist natürlich und präzise.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort. Der deutsche Satzanschluss ist auch ohne ein zusätzliches „und“ flüssig; „dann“ bei der Rückkehr macht die zeitliche Folge deutlich, ohne einen Gegensatz einzutragen.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: σὺν αὐτῇ
  choice: bei ihr
  rationale: σύν mit Dativ bezeichnet Begleitung beziehungsweise Zusammensein. Im Zusammenhang eines längeren Aufenthalts ist „bei ihr“ im Deutschen natürlicher als „mit ihr“; das Pronomen bezieht sich im Kontext auf Elisabet.
- source_word: ὡς μῆνας τρεῖς
  choice: etwa drei Monate
  rationale: ὡς vor einer Zeitangabe kennzeichnet hier eine ungefähre Dauer; „etwa“ gibt diese Näherung knapp und idiomatisch wieder.
- source_word: ὑπέστρεψεν
  choice: kehrte dann … zurück
  rationale: ὑποστρέφω bezeichnet die Rückkehr an einen früheren Ort. „kehrte … zurück“ entspricht dem gehobenen, aber heutigen Erzählregister; „dann“ verdeutlicht natürlich die Abfolge.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: in ihr Zuhause
  rationale: οἶκος bezeichnet hier das eigene Haus beziehungsweise Heim als Ziel einer Bewegung. „Zuhause“ ist persönlicher und natürlicher als „Haus“ und vermeidet die unpassende Bedeutung „Haushalt“.
