  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: de
  text: 'Und er bat um eine Schreibtafel und schrieb: »Johannes ist sein Name.« Da wunderten sich alle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: er bat um
  rationale: Das vorzeitige Aoristpartizip bezeichnet die Bitte, die dem Schreiben vorausgeht. Die Beiordnung ist im Deutschen natürlich und lässt die Handlungsfolge klar erkennen.
- source_word: πινακίδιον
  choice: Schreibtafel
  rationale: Das Diminutiv bezeichnet eine kleine, zum Schreiben bestimmte Tafel; „Schreibtafel“ ist eindeutig und vermeidet die heute mögliche technische Bedeutung von „Tablet“.
- source_word: ἔγραψεν λέγων
  choice: schrieb
  rationale: Im Deutschen führt „schrieb“ den folgenden Wortlaut bereits natürlich ein. Eine wörtliche Wiedergabe von λέγων als „indem er sagte“ wäre bei einer schriftlichen Äußerung unnötig schwerfällig.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Johannes ist sein Name
  rationale: Die vorangestellte Namensform wird beibehalten und unterstreicht Sacharjas entschiedene Bestätigung des bereits von Gott bestimmten Namens. Der Präsens entspricht ἐστίν.
- source_word: ἐθαύμασαν πάντες
  choice: Da wunderten sich alle
  rationale: „Sich wundern“ gibt θαυμάζω in diesem Zusammenhang natürlich wieder; „alle“ bewahrt die ausdrückliche kollektive Betonung von πάντες.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die betonte griechische Wortstellung der Namensaussage bleibt erhalten, während das redundante Partizip λέγων idiomatisch in die deutsche Schreibformel eingeht.
