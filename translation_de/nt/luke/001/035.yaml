reference: Luke 1:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: de
  text: 'Der Engel antwortete ihr: »Der Heilige Geist wird über dich kommen, und die Kraft des Höchsten wird dich überschatten. Deshalb wird auch das Heilige, das geboren wird,[a] Sohn Gottes genannt werden.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »das, was geboren wird, wird heilig genannt werden«. Die griechische Satzfügung lässt offen, ob »heilig« unmittelbar das Geborene näher bestimmt oder zu »genannt werden« gehört.'
    reason: syntactic_ambiguity
  - marker: b
    text: Wörtlich steht im Griechischen »Sohn Gottes« ohne Artikel. Im Zusammenhang ist dies eine Bezeichnung beziehungsweise ein Titel, nicht die unbestimmte Aussage »ein Sohn Gottes«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Der Engel antwortete ihr
  rationale: Die partizipiale griechische Wendung wird im Deutschen natürlich als finites Verb wiedergegeben; ἀποκρίνομαι hat hier aktivischen Sinn.
- source_word: Πνεῦμα ἅγιον
  choice: der Heilige Geist
  rationale: Die Wortgruppe bezeichnet in diesem Zusammenhang Gottes Geist als handelnden göttlichen Akteur; Artikel und Großschreibung entsprechen dem deutschen Sprachgebrauch.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: wird über dich kommen
  rationale: Die Formulierung bewahrt die Bewegung und das machtvolle Einwirken der griechischen Wendung, ohne die Art des Geschehens weiter auszudeuten.
- source_word: δύναμις Ὑψίστου
  choice: die Kraft des Höchsten
  rationale: Der Genitiv wird direkt wiedergegeben; »der Höchste« bleibt als Gottesbezeichnung erkennbar.
- source_word: ἐπισκιάσει σοι
  choice: wird dich überschatten
  rationale: »Überschatten« erhält das Bild göttlicher Gegenwart und Wirkung und vermeidet eine biologisierende oder sexualisierte Ausdeutung.
- source_word: διὸ καὶ
  choice: Deshalb wird auch
  rationale: »Deshalb« gibt die Folgerung, »auch« die additive beziehungsweise hervorhebende Kraft von καί wieder.
- source_word: τὸ γεννώμενον ἅγιον
  choice: das Heilige, das geboren wird
  rationale: Die neutrale substantivische Form des Griechischen und die Heiligkeitsaussage bleiben sichtbar. Die bewusst etwas feierliche Formulierung vermeidet, »Kind« ohne Kennzeichnung in den Text einzutragen.
- source_word: κληθήσεται
  choice: wird … genannt werden
  rationale: Die Passivform bewahrt sowohl den Sinn des Benennens als auch den einer anerkannten Identität.
- source_word: υἱὸς θεοῦ
  choice: Sohn Gottes
  rationale: Im Deutschen ist die artikellose Form nach »genannt werden« die natürliche titulare Wiedergabe; sie ist nicht unbestimmt im Sinn von »ein Sohn Gottes«.
theological_decisions:
- issue: Persönlicher göttlicher Bezug von Πνεῦμα ἅγιον
  choice: der Heilige Geist
  alternative: heiliger Geist
  rationale: Lukas stellt Gottes Geist als handelnden Urheber dar. Die Übersetzung wahrt diesen Bezug, ohne über die Aussage des Verses hinauszugehen.
- issue: Verhältnis von ἅγιον zu τὸ γεννώμενον und κληθήσεται
  choice: das Heilige, das geboren wird
  alternative: das, was geboren wird, wird heilig genannt werden
  rationale: Die Hauptfassung folgt der naheliegenden Verbindung von ἅγιον mit dem Geborenen; eine mögliche prädikative Zuordnung zu »genannt werden« wird in der Fußnote offengehalten.
- issue: Titularer Sinn von υἱὸς θεοῦ trotz fehlenden Artikels
  choice: Sohn Gottes
  alternative: ein Sohn Gottes
  rationale: Der griechische Ausdruck ist im Kontext qualitativ und titular, nicht unbestimmt. Die deutsche Syntax benötigt hier keinen bestimmten Artikel.
- issue: Zurückhaltende Wiedergabe göttlicher Einwirkung
  choice: wird dich überschatten
  alternative: wird dich umhüllen
  rationale: Das Quellbild wird bewahrt, ohne einen biologischen Mechanismus in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. »Überschatten« und »das Heilige« bewahren die Bildsprache und die feierliche Dichte des griechischen Textes; die schwierigere Syntax wird durch eine Fußnote transparent gemacht.
