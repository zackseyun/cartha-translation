  text: ἀντελάβετο Ἰσραὴλ παιδὸς αὐτοῦ, μνησθῆναι ἐλέους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: de
  text: Er hat sich Israels, seines Dieners,[a] angenommen und gedachte des Erbarmens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines Kindes“. Das griechische Wort kann sowohl „Diener“ als auch „Kind“ bedeuten; hier ist „Diener“ wegen des alttestamentlichen Sprachmusters bevorzugt, in dem Israel Gottes Diener genannt wird.'
    reason: lexical_alternative
  - marker: b
    text: „Erbarmen“ kann hier auch die mitfühlende Treue Gottes zu seinem Bund anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: hat sich … angenommen
  rationale: Das deutsche Verb „sich annehmen“ gibt das helfende und stützende Ergreifen idiomatisch wieder und bewahrt durch den Genitiv eine gehobene, aber verständliche Ausdrucksweise.
- source_word: Ἰσραὴλ
  choice: Israel
  rationale: Der Eigenname wird in der üblichen deutschen Form beibehalten und bezeichnet hier kollektiv das Volk Israel.
- source_word: παιδὸς
  choice: Diener
  rationale: παῖς kann „Diener“ oder „Kind“ bedeuten. „Diener“ passt hier besonders zum alttestamentlichen Sprachmuster, in dem Israel Gottes Diener heißt; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: αὐτοῦ
  choice: seines
  rationale: Das Possessivpronomen bezieht sich auf Gott und kennzeichnet Israel als den ihm zugehörigen Diener.
- source_word: μνησθῆναι
  choice: im Gedenken an
  rationale: Die Wendung bildet den adverbialen Infinitiv kompakt ab, ohne eindeutig zwischen Zweck, Folge und begleitendem Umstand zu entscheiden.
- source_word: ἐλέους
  choice: Erbarmen
  rationale: „Erbarmen“ gibt ἔλεος unmittelbar wieder und lässt die im Kontext mögliche Bedeutung von bundestreuer, mitfühlender Zuwendung offen.
theological_decisions:
- issue: Bedeutung von παῖς in Bezug auf Israel
  choice: Israel, sein Diener
  alternative: Israel, sein Kind
  rationale: „Diener“ bewahrt den wahrscheinlichen Anklang an die alttestamentliche Rede von Israel als Gottes Diener. Da παῖς auch „Kind“ heißen kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Sinn von μνησθῆναι ἐλέους
  choice: im Gedenken an Erbarmen
  alternative: um an sein Erbarmen zu denken / indem er sich an sein Erbarmen erinnerte
  rationale: Die gewählte Fassung wahrt die knappe griechische Formulierung und legt das Verhältnis zum vorhergehenden Verb nicht vorschnell allein als Zweck oder Begleitumstand fest. Auch wird kein im Griechischen ausdrücklich fehlendes Possessivpronomen ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivkonstruktion „sich Israels annehmen“ ist leicht gehoben, aber geläufig und bildet die griechische Satzstruktur knapp ab. „Im Gedenken an Erbarmen“ bewahrt bewusst die ungewöhnliche Dichte und die fehlende ausdrückliche Besitzangabe des Ausgangstextes.
