  terminology: „Diener“ ist im Kontext die vorzugswürdige Wiedergabe von παῖς und bewahrt den Schriftanklang. „Erbarmen“ ist für ἔλεος treffend. Die Anmerkung zur möglichen Bundesdimension ist als mögliche Konnotation vorsichtig formuliert.
