  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: de
  text: Als Zacharias ihn sah, erschrak er, und Furcht überfiel ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: erschrak
  rationale: Das Aoristpassiv von ταράσσω bezeichnet hier eine plötzlich eintretende innere Erschütterung oder Beunruhigung. „Erschrak“ ist im Deutschen natürlich und lässt die anschließend ausdrücklich genannte Furcht als eigene Aussage stehen.
- source_word: Ζαχαρίας
  choice: Zacharias
  rationale: „Zacharias“ ist die im Deutschen gebräuchliche biblische Namensform.
- source_word: ἰδών
  choice: als … ihn sah
  rationale: Das Aoristpartizip hat im Zusammenhang temporale Bedeutung. Das Objekt „ihn“ ergibt sich aus dem zuvor genannten Engel und ist für natürliches Deutsch sinnvoll.
- source_word: φόβος
  choice: Furcht
  rationale: „Furcht“ gibt φόβος direkt wieder, ohne die Aussage durch „Entsetzen“ oder „Todesangst“ zu verstärken.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: überfiel ihn
  rationale: „Überfiel ihn“ bewahrt das kraftvolle Bild des griechischen Ausdrucks und ist zugleich eine natürliche deutsche Verbindung mit „Furcht“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Satzfolge wurde leicht umgestellt, damit der temporale Zusammenhang natürlich klingt; die Wiederholung des Subjekts wurde vermieden.
