source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: de
  text: Als die Tage seines Dienstes[a] beendet waren, ging er nach Hause.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Dienst“ ist Sacharjas festgelegter priesterlicher Dienst im Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in sein Haus“. Das griechische Wort kann das Gebäude selbst oder weiter gefasst das Zuhause beziehungsweise den Haushalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nicht eigens wiedergegeben
  rationale: Die lukanische Erzählformel καὶ ἐγένετο lässt sich im modernen Deutschen hier am natürlichsten durch den einsetzenden Temporalsatz wiedergeben; ein ausdrückliches „und es geschah“ wäre unnötig schwerfällig.
- source_word: ὡς
  choice: als
  rationale: ὡς leitet hier einen temporalen Nebensatz ein; „als“ ist für das einmalige vergangene Geschehen idiomatisch.
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: die Tage … beendet waren
  rationale: Die Formulierung bezeichnet, dass die festgesetzte Dienstzeit vollständig abgelaufen war. Die deutsche Wiedergabe bewahrt das Bild der vollendeten Tage, ohne unnatürlich zu klingen.
- source_word: λειτουργίας
  choice: Dienstes
  rationale: Im Kontext ist Sacharjas festgelegter priesterlicher Tempeldienst gemeint. „Dienst“ ist knapp und lässt die nähere kultische Bestimmung dem Kontext und der Fußnote.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Das einfache Bewegungsverb wird in natürlichem Deutsch mit „ging“ wiedergegeben; „ging fort“ wäre möglich, aber hier nicht erforderlich.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nach Hause
  rationale: Die feste deutsche Wendung bezeichnet natürlich die Rückkehr an den eigenen Wohnort. Da οἶκος auch das Haus beziehungsweise den Haushalt bezeichnen kann, wird die Alternative in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Erzählformel wird nicht wörtlich nachgebildet, sondern in einen flüssigen deutschen Temporalsatz überführt. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärungsbedürftigen Wendung.
