lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging in
  rationale: Das Verb bezeichnet das Hineingehen oder Eintreten. „Ging in“ ist im Deutschen natürlich und gibt die gerichtete Bewegung mit εἰς klar wieder.
- source_word: οἶκον
  choice: Haus
  rationale: Im Zusammenhang mit εἰς ist vor allem das Gebäude als Ziel der Bewegung gemeint; „Haus“ entspricht dem griechischen Ausdruck direkt.
- source_word: Ζαχαρίου
  choice: Zacharias
  rationale: „Zacharias“ ist die im Deutschen gebräuchliche biblische Namensform.
- source_word: ἠσπάσατο
  choice: begrüßte
  rationale: ἀσπάζομαι bezeichnet hier eine Begrüßung. „Begrüßte“ ist präzise und natürlich, ohne zusätzliche Herzlichkeit oder Förmlichkeit einzutragen.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: „Elisabet“ ist eine etablierte moderne deutsche Form des biblischen Namens und liegt nahe an der griechischen Form.
- source_word: καὶ
  choice: und
  rationale: Beide Vorkommen verbinden die aufeinanderfolgenden Handlungen schlicht miteinander; „und“ bewahrt den parataktischen Erzählstil.
