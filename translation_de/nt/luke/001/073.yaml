  text: ὅρκον ὃν ὤμοσεν πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν, τοῦ δοῦναι ἡμῖν
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: de
  text: den Eid, den er Abraham, unserem Vater,[a] geschworen hat, uns zu gewähren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserem Vorfahren“. Wörtlich steht im Griechischen „unserem Vater“; so bleibt die Bundessprache über Abraham erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: den Eid
  rationale: Der Akkusativ setzt die Syntax des vorhergehenden Verses fort; der bestimmte Artikel bezeichnet den bereits in den Blick genommenen konkreten Eid.
- source_word: ὃν ὤμοσεν
  choice: den er … geschworen hat
  rationale: Das Relativpronomen bezieht sich auf „Eid“; das Perfekt ist im Deutschen eine natürliche Erzählform für den griechischen Aorist und bewahrt die Wortverbindung zwischen „Eid“ und „schwören“.
- source_word: πρὸς Ἀβραὰμ
  choice: Abraham … geschworen
  rationale: Bei einem Schwur bezeichnet πρός die Person, der gegenüber der Eid geleistet wird. Im Deutschen steht diese Person idiomatisch ohne Präposition im Dativ.
- source_word: τὸν πατέρα ἡμῶν
  choice: unserem Vater
  rationale: Die wörtliche familiäre und bundestheologische Bezeichnung des Griechischen bleibt erhalten; „unserem Vorfahren“ wäre sachlich möglich, aber weniger bildkräftig.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: uns zu gewähren
  rationale: Der artikulierte Infinitiv führt Zweck beziehungsweise Inhalt und Folge des Eides weiter. „Gewähren“ entspricht dem gehobenen Ton des Lobgesangs; die Ergänzung folgt im nächsten Vers.
theological_decisions:
- issue: Bezeichnung Abrahams in der Bundessprache
  choice: unserem Vater
  alternative: unserem Vorfahren
  rationale: „Vater“ bewahrt die ausdrückliche familiäre und gemeinschaftliche Bundessprache des griechischen Textes, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Verhältnis des Infinitivs zum Eid
  choice: uns zu gewähren
  alternative: um uns zu gewähren / indem er uns gewährt
  rationale: Die knappe Infinitivkonstruktion lässt offen, ob stärker Zweck, Inhalt oder Ergebnis hervorgehoben ist, und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktisch unvollständiger Teil des fortlaufenden Satzes gestaltet und endet daher mit einem Komma.
