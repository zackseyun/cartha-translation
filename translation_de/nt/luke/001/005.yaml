id: LUK.1.5
reference: Luke 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: de
  text: Zur Zeit des Herodes, des Königs von Judäa, gab es einen Priester namens Zacharias aus der Priesterabteilung Abija[a]. Er hatte eine Frau aus dem Geschlecht Aarons[b], die Elisabet hieß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Priesterabteilung Abija« war eine der Dienstgruppen, die abwechselnd den Tempeldienst versahen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »aus den Töchtern Aarons«. Die Formulierung bezeichnet ihre Abstammung von Aaron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Zur Zeit … lebte
  rationale: Die erzählerische Einleitungsformel wird in natürlichem Deutsch wiedergegeben; „lebte“ führt den Priester als Person ein, ohne das schwerfällige „es geschah … ein Priester“.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: des Herodes, des Königs von Judäa
  rationale: Die Genitivkonstruktion und Herodes’ Herrschaftsgebiet werden präzise wiedergegeben.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: ein Priester namens Zacharias
  rationale: τις führt eine bislang unbestimmte Person ein; der deutsche unbestimmte Artikel trägt diese Funktion natürlich.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: aus der Priesterabteilung Abija
  rationale: ἐφημερία bezeichnet hier eine organisierte priesterliche Dienstgruppe; „Priesterabteilung“ ist verständlich und sachlich präzise.
- source_word: γυνὴ αὐτῷ
  choice: Seine Frau
  rationale: Der possessive Dativ wird idiomatisch als Zugehörigkeitsverhältnis ausgedrückt.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: stammte von den Töchtern Aarons ab
  rationale: Die konkrete familiäre Ausdrucksweise des Griechischen bleibt erhalten, während „stammte … ab“ ihre genealogische Funktion im Deutschen deutlich macht.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: sie hieß Elisabet
  rationale: Dies ist die natürliche deutsche Entsprechung der Namensformel.
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: Zacharias / Elisabet / Abija / Aaron
  rationale: Die Namensformen folgen geläufigen modernen deutschen Bibelkonventionen.
theological_decisions:
- issue: Genealogische Bezeichnung von Elisabets Herkunft
  choice: von den Töchtern Aarons
  alternative: von den Nachkommen Aarons
  rationale: Die gewählte Fassung bewahrt das konkrete Bild des griechischen Wortlauts und damit die Betonung ihrer priesterlichen Abstammung; die idiomatische Bedeutung wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzfolge wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Beide Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Ausdrücken.
