  source_fidelity: 'Die wesentlichen Angaben des griechischen Textes werden zutreffend erfasst: die zeitliche Einordnung unter Herodes, seine Bezeichnung als König von Judäa, Zacharias als Priester aus der Abteilung Abija sowie Elisabets aaronitische Abstammung und ihr Name. »Lebte ein Priester« ist jedoch als Wiedergabe der einführenden Existenzformel Ἐγένετο weniger präzise als »gab es einen Priester«. Die Formulierung »von den Töchtern Aarons abstammte« ist im Deutschen zudem unidiomatisch; der genealogische Sinn sollte im Text natürlich wiedergegeben und die wörtliche griechische Bildsprache in der Anmerkung gesichert werden.'
