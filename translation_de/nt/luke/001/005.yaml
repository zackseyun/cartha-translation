  terminology: »Priesterabteilung« gibt ἐφημερία angemessen wieder. Die Namen Zacharias, Abija, Aaron und Elisabet sind im deutschen Bibelgebrauch geläufig. »Geschlecht Aarons« vermittelt die priesterliche Abstammung, ohne über den Text hinausgehende theologische Aussagen einzutragen; die Fußnote hält fest, dass der griechische Wortlaut konkret von den »Töchtern Aarons« spricht.
