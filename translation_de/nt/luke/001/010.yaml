id: LUK.1.10
reference: Luke 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: de
  text: Und die ganze Menge des Volkes betete draußen zur Stunde des Räucheropfers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Zeit, als das Räucherwerk verbrannt wurde«.'
    reason: 'Lexikalische Alternative: θυμίαμα kann das Räucherwerk selbst oder kontextuell dessen rituelle Darbringung bezeichnen.'
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Menge
  rationale: Die Formulierung bewahrt den kollektiven Singular und betont, dass die gesamte versammelte Menge gemeint ist.
- source_word: τοῦ λαοῦ
  choice: des Volkes
  rationale: Die Wiedergabe lässt den Tempelkontext erkennen, fügt aber die im Griechischen nicht ausdrücklich genannte Bestimmung »Israel« nicht hinzu.
- source_word: ἦν … προσευχόμενον
  choice: betete
  rationale: Die periphrastische Konstruktion bezeichnet ein andauerndes Geschehen; das deutsche Präteritum gibt dies im erzählenden Kontext natürlich wieder.
- source_word: ἔξω
  choice: draußen
  rationale: »Draußen« entspricht der räumlichen Angabe, ohne den Ort genauer als »außerhalb des Heiligtums« festzulegen.
- source_word: τῇ ὥρᾳ
  choice: zur Stunde
  rationale: Die Wendung bewahrt den Gedanken eines festgesetzten gottesdienstlichen Zeitpunkts und klingt im Deutschen würdig und idiomatisch.
- source_word: τοῦ θυμιάματος
  choice: des Räucheropfers
  rationale: Im Tempelkontext bezeichnet θυμίαμα den Weihrauch beziehungsweise dessen rituelle Darbringung; »Räucheropfer« bringt diesen kultischen Sinn knapp zum Ausdruck.
theological_decisions:
- issue: Kultische Bedeutung von θυμίαμα
  choice: Räucheropfer
  alternative: Verbrennen des Räucherwerks
  rationale: »Räucheropfer« wahrt den Bezug zur priesterlichen Tempelhandlung, ohne weitergehende theologische Aussagen einzutragen; die alternative, stärker handlungsbezogene Deutung wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Die ganze Menge des Volkes« erhält die leicht feierliche kollektive Ausdrucksweise des Ausgangstextes; »draußen« bleibt bewusst unspezifisch.
