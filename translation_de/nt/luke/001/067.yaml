  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: de
  text: 'Und sein Vater Zacharias wurde mit dem Heiligen Geist erfüllt und prophezeite:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den erzählerischen Anschluss an den vorhergehenden Zusammenhang und klingt im Deutschen natürlich.
- source_word: Ζαχαρίας ὁ πατὴρ αὐτοῦ
  choice: sein Vater Zacharias
  rationale: Die im Deutschen natürliche Wortstellung wahrt sowohl die Identifikation des Zacharias als auch seinen Bezug zu Johannes.
- source_word: ἐπλήσθη
  choice: wurde erfüllt
  rationale: Gibt den Aorist Passiv ereignishaft wieder und vermeidet eine unnötige Umschreibung.
- source_word: πνεύματος ἁγίου
  choice: mit dem Heiligen Geist
  rationale: Der Genitiv nach πίμπλημι wird idiomatisch mit „mit“ wiedergegeben; im lukanischen Kontext bezeichnet der Ausdruck Gottes Heiligen Geist.
- source_word: ἐπροφήτευσεν
  choice: weissagte
  rationale: Gibt das prophetische, von Gottes Geist gewirkte Reden prägnant und traditionsverständlich wieder.
- source_word: λέγων
  choice: :[a]
  rationale: Das folgende Doppelpunktzeichen leitet den Inhalt des prophetischen Redens im Deutschen natürlich ein; die Fußnote weist auf das im Griechischen ausdrücklich vorhandene Partizip „sagend“ hin.
theological_decisions:
- issue: Referent von πνεύματος ἁγίου
  choice: dem Heiligen Geist
  alternative: heiligem Geist / einem heiligen Geist
  rationale: Im Kontext von Lukas bezeichnet die Wendung bei göttlich gewirkter prophetischer Rede den Heiligen Geist. Der bestimmte Artikel ist im Deutschen idiomatisch erforderlich, auch wenn das Griechische hier artikellos ist.
- issue: Bedeutungsumfang von ἐπροφήτευσεν
  choice: weissagte
  alternative: redete prophetisch
  rationale: „Weissagte“ bewahrt den direkten prophetischen Anspruch des Verbs, ohne die folgende Rede ausschließlich als Zukunftsvoraussage zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weissagte“ ist bibelsprachlich geläufig, bleibt aber verständlich; der Satzbau ist gegenüber der griechischen Reihenfolge leicht idiomatisiert.
