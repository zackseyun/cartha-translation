id: LUK.1.36
reference: Luke 1:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: de
  text: 'Und sieh: Auch Elisabet, deine Verwandte, hat in ihrem hohen Alter einen Sohn empfangen, und sie, die als unfruchtbar galt, ist jetzt im sechsten Monat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter des griechischen Ausdrucks in knapper, würdiger Form.
- source_word: συγγενίς
  choice: Verwandte
  rationale: Der Ausdruck bezeichnet allgemein eine weibliche Verwandte; ein genauer Verwandtschaftsgrad wird nicht genannt.
- source_word: συνείληφεν υἱόν
  choice: hat ... einen Sohn empfangen
  rationale: Gibt die Empfängnis und das ausdrücklich männliche Kind wieder, ohne den Satz unnötig zu erklären.
- source_word: ἐν γήρει αὐτῆς
  choice: in ihrem hohen Alter
  rationale: Natürliches modernes Deutsch für das griechische 'in ihrem Alter', das hier fortgeschrittenes Alter meint.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: die als unfruchtbar galt
  rationale: Gibt die gesellschaftliche Bezeichnung idiomatisch wieder und vermeidet den unnatürlichen Eindruck, dies sei ihr eigentlicher Name.
theological_decisions:
- issue: Elisabets Verhältnis zu Maria
  choice: Verwandte
  alternative: Cousine
  rationale: Das Griechische nennt keinen bestimmten Verwandtschaftsgrad; 'Cousine' wäre eine nicht belegte Präzisierung.
- issue: Beschreibung als unfruchtbar
  choice: die als unfruchtbar galt
  alternative: die unfruchtbar genannt wurde
  rationale: Die Formulierung bewahrt den passiven, zugeschriebenen Charakter, ohne endgültig über ihre Identität oder ihren Wert zu urteilen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung wurde für natürliche Lesbarkeit leicht geglättet; die Aussage des griechischen Textes bleibt vollständig erhalten.
