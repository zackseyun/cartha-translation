id: LUK.1.27
reference: Luke 1:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: de
  text: zu einer Jungfrau, die mit einem Mann namens Josef verlobt war. Er stammte aus dem Haus Davids. Die Jungfrau hieß Maria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name lautet Mariam.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: Jungfrau
  rationale: Dies ist hier die klare Standardsbedeutung; die Wiederholung im Vers wird beibehalten.
- source_word: ἐμνηστευμένην
  choice: verlobt war
  rationale: Das Perfektpartizip bezeichnet einen bestehenden, rechtlich und gesellschaftlich verbindlichen Verlobungsstand. „Verlobt“ ist im heutigen Deutsch natürlich; die Fußnote erläutert den stärkeren damaligen Rechtscharakter.
- source_word: ἀνδρὶ
  choice: mit einem Mann
  rationale: „Mann“ wahrt die lexikalische Offenheit, ohne Josef an dieser Stelle ausdrücklich als Ehemann zu bezeichnen.
- source_word: ᾧ ὄνομα Ἰωσήφ
  choice: namens Josef
  rationale: Natürliche deutsche Wiedergabe der griechischen Namensformel.
- source_word: ἐξ οἴκου Δαυίδ
  choice: Er stammte aus dem Haus Davids
  rationale: „Haus Davids“ erhält die dynastische und biblische Ausdrucksweise. Das maskuline Bezugswort ἀνδρί macht Josef zum natürlichen Bezug von ἐξ οἴκου Δαυίδ.
- source_word: Μαριάμ
  choice: Maria
  rationale: „Maria“ ist die im Deutschen etablierte Namensform; „Mariam“ wird als quellennahe Alternative in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von παρθένος im Zusammenhang der lukanischen Kindheitsgeschichte
  choice: Jungfrau
  alternative: junge Frau
  rationale: „Jungfrau“ entspricht hier dem üblichen Wortsinn und der unmittelbaren Erzählabsicht, ohne über den Vers hinauszugehen.
- issue: Bezug von ἐξ οἴκου Δαυίδ
  choice: auf Josef bezogen
  alternative: syntaktisch missverständliche Zuordnung zu Maria
  rationale: Der unmittelbar vorausgehende maskuline Dativ ἀνδρί mit der Relativkonstruktion bezeichnet Josef; die Aufteilung in zwei Sätze macht diesen Bezug im Deutschen deutlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzteilung vermeidet eine im Deutschen mögliche falsche Zuordnung von „aus dem Haus Davids“ zu Maria. „Verlobt“ ist idiomatisch; der historisch verbindlichere Charakter der damaligen Verlobung bleibt durch die Formulierung eines bestehenden Zustands erkennbar.
