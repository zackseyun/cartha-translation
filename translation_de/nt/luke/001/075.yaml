  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: de
  text: in Heiligkeit und Gerechtigkeit vor ihm an allen unseren Tagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν
  choice: in
  rationale: Die Präposition bezeichnet den Bereich beziehungsweise die Art und Weise des im Zusammenhang genannten Dienens; „in“ bewahrt die griechische Struktur und klingt im Deutschen natürlich.
- source_word: ὁσιότητι
  choice: Heiligkeit
  rationale: ὁσιότης bezeichnet eine auf Gott bezogene heilige, ehrfürchtige Lebenshaltung. „Heiligkeit“ ist würdig und hält den Begriff von δικαιοσύνη unterscheidbar.
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion verbindet die beiden gleichgeordneten Dative.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ gibt die ethische Rechtschaffenheit vor Gott wieder und kann im Deutschen zugleich den Aspekt gerechten Handelns einschließen.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Die Wendung bedeutet „in seiner Gegenwart“ beziehungsweise „in seinen Augen“. „Vor ihm“ ist knapp, idiomatisch und bewahrt sowohl den relationalen als auch den bewertenden Sinn.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: alle unsere Tage
  rationale: Die Formulierung bezeichnet die gesamte Lebenszeit. Die wörtlich nahe Wiedergabe ist verständlich und fügt das im Griechischen nicht ausdrücklich stehende Wort „Leben“ nicht ein.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im nichtpaulinischen ethischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; gerechtes Handeln
  rationale: Im Paar mit ὁσιότης beschreibt der Ausdruck ein vor Gott rechtes Leben. Das deutsche „Gerechtigkeit“ bewahrt die theologische Weite und umfasst, anders als das englische Begriffspaar „righteousness/justice“, sowohl persönliche Rechtschaffenheit als auch gerechtes Handeln; deshalb ist keine einengende Fußnote nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzteil bleibt bewusst eng an der knappen, parallelen Form des griechischen Textes angeschlossen und ist syntaktisch als Fortsetzung von Lukas 1,74 zu lesen.
