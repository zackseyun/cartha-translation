source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: de
  text: 'Und Zacharias sagte zum Engel: »Woran werde ich das erkennen? Denn ich bin ein alter Mann, und meine Frau ist hochbetagt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Das übliche und natürliche deutsche Erzählverb für die Einleitung direkter Rede.
- source_word: πρὸς τὸν ἄγγελον
  choice: zu dem Engel
  rationale: Bei einem Verb des Sprechens bezeichnet πρός den Adressaten; »zu dem Engel« ist idiomatisch und genau.
- source_word: Κατὰ τί
  choice: Woran
  rationale: Die Wendung fragt hier nach dem Anzeichen beziehungsweise der Grundlage, an der Zacharias die angekündigte Sache erkennen kann. »Woran« gibt diesen Sinn im Deutschen genauer wieder als das allgemeinere »Wie«.
- source_word: γνώσομαι
  choice: werde ich … erkennen
  rationale: Das Futur bezeichnet das künftige Erkennen beziehungsweise Gewisswerden und wird ohne Verschiebung zu einer bloßen Fähigkeitsfrage wiedergegeben.
- source_word: τοῦτο
  choice: das
  rationale: Das Demonstrativpronomen verweist schlicht auf die Ankündigung des Engels; »das« ist im Deutschen natürlich.
- source_word: πρεσβύτης
  choice: ein alter Mann
  rationale: Das Substantiv bezeichnet hier einen Mann hohen Alters, nicht einen Amtsträger.
- source_word: γυνή
  choice: Frau
  rationale: Mit dem Possessivpronomen ist eindeutig die Ehefrau gemeint; »meine Frau« ist modernes Standarddeutsch.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: ist schon hochbetagt
  rationale: Die wörtliche Wendung »in ihren Tagen fortgeschritten« ist im Deutschen unnatürlich. »Schon hochbetagt« vermittelt das Idiom für hohes Alter würdig und verständlich; »schon« nimmt den resultativen Sinn des Perfektpartizips auf.
theological_decisions:
- issue: Wiedergabe von ἄγγελος
  choice: Engel
  alternative: Bote
  rationale: Obwohl ἄγγελος allgemein »Bote« heißen kann, weist der unmittelbare Kontext auf Gabriel als himmlischen Boten; »Engel« ist daher kontextgemäß, ohne den Text lehrmäßig auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt natürlich und bewahrt Zacharias’ Bitte um Gewissheit. Das griechische Altersidiom wird zugunsten unmittelbarer Verständlichkeit idiomatisch wiedergegeben; eine Fußnote ist nicht nötig, da keine für die Auslegung erhebliche Mehrdeutigkeit verloren geht.
