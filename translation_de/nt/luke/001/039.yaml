source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: de
  text: In diesen Tagen machte sich Maria auf und ging eilig ins Bergland, in eine Stadt in Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einen Ort in Juda“, „in eine Stadt in Judäa“ oder „in eine judäische Stadt“. Das griechische Wort πόλις kann sowohl eine Stadt als auch einen kleineren Ort bezeichnen. Ἰούδα kann sich auf Juda beziehungsweise Judäa als Region oder Stammesgebiet beziehen; möglicherweise ist auch eine Stadt namens Juda gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα δὲ
  choice: machte sich Maria auf
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende bzw. sie begleitende Handlung. „Sich aufmachen“ gibt den Reisebeginn natürlich wieder; δέ wirkt als leichter Erzählübergang und muss im Deutschen nicht eigens mit „aber“ oder „nun“ ausgedrückt werden.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: in diesen Tagen
  rationale: Die Wendung wird zeitlich und mit der nahdeiktischen Bedeutung von ταύταις wiedergegeben.
- source_word: ἐπορεύθη
  choice: ging
  rationale: πορεύομαι bezeichnet hier schlicht das Gehen bzw. Reisen; „ging“ ist natürlich und ausreichend weit.
- source_word: εἰς τὴν ὀρεινὴν
  choice: in das Bergland
  rationale: Das substantivierte ὀρεινή bezeichnet eine gebirgige oder hügelige Region; „Bergland“ ist im Deutschen knapp und idiomatisch.
- source_word: μετὰ σπουδῆς
  choice: eilig
  rationale: σπουδή kann Eifer, Ernst oder Eile ausdrücken. Im Zusammenhang des Aufbruchs und der Reise liegt die adverbiale Bedeutung „eilig“ nahe, ohne die mögliche Entschlossenheit völlig auszuschließen.
- source_word: εἰς πόλιν Ἰούδα
  choice: in eine Stadt Judas
  rationale: πόλις kann eine Stadt oder kleinere Ortschaft bezeichnen. Der Genitiv Ἰούδα wird formal als „Judas“ wiedergegeben; wahrscheinlich bezeichnet er die Region bzw. das Stammesgebiet Juda, doch die griechische Form lässt mehrere geografische Deutungen zu.
theological_decisions:
- issue: Geografische Bestimmung von Ἰούδα
  choice: „Judas“ als formnahe Wiedergabe einer wahrscheinlich regionalen bzw. stammesbezogenen Bezeichnung
  alternative: „in eine Stadt in Juda“, „in eine judäische Stadt“ oder eine Stadt namens Juda
  rationale: Die Konstruktion εἰς πόλιν Ἰούδα ist ungewöhnlich und mehrdeutig. Eine formnahe Haupttextfassung bewahrt diese Spannung; die Fußnote erläutert die wahrscheinlich regionale Deutung, ohne eine Stadt namens Juda kategorisch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch knapp. „Machte sich auf“ vermeidet das heute steife wörtliche „stand auf“, während „Stadt Judas“ im Haupttext die auffällige und echte Mehrdeutigkeit der griechischen Ortsangabe erhält.
