id: LUK.1.15
reference: Luke 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: de
  text: Denn er wird groß sein vor dem Herrn. Wein und berauschendes Getränk wird er keinesfalls trinken,[a][b] und schon vom Mutterleib an wird er mit dem Heiligen Geist erfüllt sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er darf niemals Wein oder berauschendes Getränk trinken.“ Die griechische Formulierung verneint das Trinken mit besonderem Nachdruck und kann im Zusammenhang seiner geweihten Berufung auch als Verpflichtung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Damit ist ein berauschendes Getränk außer Wein gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „noch im Mutterleib seiner Mutter“. Die griechische Wendung kann auch ausdrücklich auf die Zeit vor seiner Geburt bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: groß
  rationale: Die direkte und im Deutschen geläufige Entsprechung bewahrt die Aussage über seine herausragende Bedeutung, ohne sie näher festzulegen.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: vor dem Herrn
  rationale: Die knappe, natürliche Formulierung bewahrt den Gedanken des Ansehens und der Beurteilung in Gottes Gegenwart.
- source_word: οἶνον καὶ σίκερα
  choice: Wein und berauschende Getränke
  rationale: σίκера bezeichnet andere alkoholische beziehungsweise berauschende Getränke als Wein; der Plural klingt im heutigen Deutsch natürlicher als das veraltete „starkes Getränk“.
- source_word: οὐ μὴ πίῃ
  choice: wird er keinesfalls trinken
  rationale: Die Verbindung οὐ μή mit dem Aoristkonjunktiv ist eine nachdrückliche Verneinung. Die Wiedergabe bleibt als prophetische Zukunftsaussage formuliert und macht zugleich deren emphatische Kraft deutlich.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: wird er mit dem Heiligen Geist erfüllt sein
  rationale: Das Futur Passiv wird bewahrt; der bestimmte Artikel entspricht dem deutschen Sprachgebrauch für den in Lukas gemeinten göttlichen Geist.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: schon vom Mutterleib an
  rationale: Die Wendung gibt den außergewöhnlich frühen Ausgangspunkt wieder, ohne genauer festzulegen, ob die Erfüllung vor der Geburt oder unmittelbar von Geburt an gemeint ist.
theological_decisions:
- issue: Kraft der emphatischen Verneinung οὐ μὴ πίῃ
  choice: prophetische Zukunftsaussage mit „keinesfalls“
  alternative: 'verpflichtende Formulierung: „darf er niemals trinken“'
  rationale: Die grammatische Form ist unmittelbar eine nachdrücklich verneinte Zukunftsaussage. Der Zusammenhang legt eine geweihte Berufung nahe, doch diese wird nicht durch eine ausdrückliche Verbotsform in den Text eingetragen.
- issue: Referent von πνεύματος ἁγίου
  choice: „der Heilige Geist“ als göttlicher personaler Referent
  alternative: „heiliger Geist“ als unpersönliche Kraft oder Befähigung
  rationale: Der lukanische Zusammenhang spricht für Gottes Heiligen Geist; Artikel und Großschreibung sind im modernen Deutschen dafür idiomatisch.
- issue: Zeitliche Reichweite von ἔτι ἐκ κοιλίας
  choice: „schon vom Mutterleib an“ mit bewahrter zeitlicher Offenheit
  alternative: „noch im Mutterleib“ als eindeutige pränatale Festlegung
  rationale: Die griechische Wendung kann einen Ausgangspunkt vom Mutterleib an oder die Zeit noch im Mutterleib hervorheben; die Hauptfassung vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Berauschende Getränke“ ist verständlicher und sachlich genauer als das heute missverständliche „starkes Getränk“. Die Satzteilung vermeidet eine schwerfällige Reihung, ohne die logischen Verbindungen des griechischen Textes aufzulösen.
