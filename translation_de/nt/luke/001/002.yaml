id: LUK.1.2
reference: Luke 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: de
  text: so wie diejenigen, die von Anfang an Augenzeugen waren und Diener des Wortes[a] wurden, sie uns überliefert haben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der Botschaft“. Das griechische λόγος kann „Wort“, „Botschaft“ oder „Bericht“ bedeuten; hier ist wahrscheinlich die verkündigte Botschaft über Jesus gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: so wie
  rationale: Leitet die Entsprechung zum vorausgehenden Vers ein und gibt den vergleichenden Anschluss in natürlichem modernem Deutsch wieder.
- source_word: παρέδοσαν
  choice: überliefert haben
  rationale: Bezeichnet hier die Weitergabe von bezeugten Ereignissen bzw. Berichten; „überliefern“ bewahrt den Gedanken verlässlicher Traditionsvermittlung.
- source_word: ἡμῖν
  choice: uns
  rationale: Gibt den Dativ als Empfänger der Überlieferung direkt wieder.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: jene …, die von Anfang an
  rationale: Das substantivierte Satzglied bezeichnet eine bestimmte Personengruppe, die von Beginn an beteiligt war; „jene …, die“ ermöglicht zugleich eine natürliche deutsche Satzstellung.
- source_word: αὐτόπται
  choice: Augenzeugen
  rationale: Präzise und allgemein verständliche Wiedergabe für Personen, die das Geschehen selbst gesehen haben.
- source_word: ὑπηρέται
  choice: Diener
  rationale: Bewahrt den Dienstgedanken, ohne ein bestimmtes kirchliches Amt zu unterstellen.
- source_word: γενόμενοι
  choice: wurden
  rationale: Gibt den Übergang zum Dienst ausdrücklich wieder und bewahrt damit die Spannung zwischen dem anfänglichen Augenzeugesein und dem späteren Dienst am Wort.
- source_word: τοῦ λόγου
  choice: des Wortes
  rationale: Bewahrt die lexikalische Weite von λόγος; im Zusammenhang ist wahrscheinlich die verkündigte Botschaft über Jesus gemeint, was die Fußnote erläutert.
theological_decisions:
- issue: Bezug von τοῦ λόγου
  choice: „des Wortes“ im Haupttext, wahrscheinlich im Sinn der verkündigten Botschaft über Jesus
  alternative: „der Botschaft“ oder „des Berichts“
  rationale: Der Ausdruck ist hier wahrscheinlich keine ausdrückliche Verwendung von „Logos“ als christologischem Titel. Die formnahe Wiedergabe „Wort“ erhält jedoch die Mehrdeutigkeit, ohne den Bezug vorschnell festzulegen.
- issue: Zeitliches Verhältnis von Augenzeugenschaft und Dienst
  choice: „Augenzeugen waren und Diener … wurden“
  alternative: „Augenzeugen und Diener … waren“
  rationale: Die gewählte Formulierung lässt γενόμενοι als Werden hervortreten und folgt der griechischen Aussage genauer, ohne zu behaupten, die beiden Rollen hätten völlig getrennte Zeiträume gebildet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jene sie“ unterscheidet das Subjekt (die Augenzeugen) vom im Kontext vorausgesetzten pluralischen Objekt aus Vers 1 und hält dabei die aktive Satzform des Griechischen aufrecht.
