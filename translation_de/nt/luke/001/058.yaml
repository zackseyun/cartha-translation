id: LUK.1.58
reference: Luke 1:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: de
  text: Und ihre Nachbarn und Verwandten hörten, dass der Herr ihr große Barmherzigkeit erwiesen hatte, und freuten sich mit ihr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: Nachbarn
  rationale: Bezeichnet die Menschen, die in ihrer Umgebung wohnten; »Nachbarn« ist die natürliche und sozial passende deutsche Entsprechung.
- source_word: συγγενεῖς
  choice: Verwandte
  rationale: Gibt die Angehörigen ihrer Verwandtschaft klar und ohne altertümliche Färbung wieder.
- source_word: ἐμεγάλυνεν
  choice: große … erwiesen hatte
  rationale: Das wörtliche »groß machen/verherrlichen« bildet mit ἔλεος und μετ’ αὐτῆς eine semitisch geprägte Wendung. Im Deutschen gibt »große Barmherzigkeit erweisen« deren Sinn natürlich und präzise wieder.
- source_word: κύριος
  choice: der Herr
  rationale: Der artikellose griechische Ausdruck bezeichnet hier eindeutig Gott und wird als fester göttlicher Titel mit »der Herr« wiedergegeben.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Bewahrt den zentralen biblisch-theologischen Begriff und passt zum Sprachgebrauch des lukanischen Kindheitsevangeliums.
- source_word: μετ’ αὐτῆς
  choice: ihr … erwiesen
  rationale: Das wörtliche »mit ihr« gehört zur idiomatischen Gesamtwendung; der deutsche Dativ gibt die auf Elisabet gerichtete Barmherzigkeit verständlich wieder.
- source_word: συνέχαιρον αὐτῇ
  choice: freuten sich mit ihr
  rationale: Gibt das gemeinsame Freuen unmittelbar wieder, ohne es auf Gratulation oder bloße Anteilnahme zu verengen.
theological_decisions:
- issue: Wiedergabe von ἐμεγάλυνεν … τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: der Herr ihr große Barmherzigkeit erwiesen hatte
  alternative: der Herr seine Barmherzigkeit an ihr groß gemacht hatte
  rationale: Die gewählte Fassung wahrt den Gedanken der außergewöhnlich großen göttlichen Barmherzigkeit, vermeidet aber eine im modernen Deutschen schwer verständliche Lehnkonstruktion. Sie legt weder Art noch Reichweite dieser Barmherzigkeit über den Kontext hinaus fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Ablauf, bleibt aber natürlich; »Barmherzigkeit« erhält die biblische Klangfarbe, während »erwiesen« die griechische Gesamtwendung idiomatisch vermittelt.
