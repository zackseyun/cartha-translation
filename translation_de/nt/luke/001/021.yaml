source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: de
  text: Und das Volk wartete auf Zacharias und wunderte sich, dass er so lange im Heiligtum[a] blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel“. Das griechische Wort bezeichnet hier genauer das eigentliche Tempelheiligtum und nicht den gesamten Tempelbezirk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: das Volk
  rationale: Der kollektive Singular bezeichnet die versammelten Menschen; „das Volk“ entspricht der Form und ist im biblischen Kontext natürlich.
- source_word: προσδοκῶν
  choice: wartete auf
  rationale: Zusammen mit ἦν bezeichnet das Partizip eine fortdauernde Handlung; „wartete auf“ gibt diesen durativen Sinn idiomatisch wieder.
- source_word: Ζαχαρίαν
  choice: Zacharias
  rationale: „Zacharias“ ist die im Deutschen etablierte Namensform für diese Gestalt.
- source_word: ἐθαύμαζον
  choice: wunderte sich
  rationale: Das Imperfekt beschreibt die anhaltende verwunderte Reaktion des Volkes; die deutsche Kollektivkonstruktion verlangt den Singular.
- source_word: ἐν τῷ χρονίζειν
  choice: dass er so lange … blieb
  rationale: 'Der substantivierte Infinitiv bezeichnet hier den Anlass der Verwunderung: Zacharias brauchte länger als erwartet. Die Wiedergabe ist natürlich, ohne den Grund für die Verzögerung zu erklären.'
- source_word: ναῷ
  choice: im Heiligtum
  rationale: ναός bezeichnet hier genauer das eigentliche Tempelheiligtum und nicht den gesamten Tempelbezirk.
- source_word: αὐτόν
  choice: er
  rationale: Das Akkusativpronomen fungiert als Subjekt des Infinitivs und wird im deutschen Nebensatz nominativisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „So lange blieb“ drückt die unerwartete Dauer natürlich aus; „Heiligtum“ wahrt die räumliche Präzision von ναός.
