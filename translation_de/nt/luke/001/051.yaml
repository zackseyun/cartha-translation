  source_fidelity: Die Hauptfassung gibt die beiden Aoriste angemessen mit Perfekt wieder, wahrt das Bild von Gottes Arm und trifft διεσκόρπισεν sowie ὑπερηφάνους. Bei διανοίᾳ καρδίας αὐτῶν ist jedoch die deutsche Singularform „ihres Herzens“ bei pluralischem αὐτῶν unnötig einengend; „ihrer Herzen“ bildet den griechischen Plural ab und erhält die idiomatische biblische Wendung.
  naturalness: „Er hat mit seinem Arm Macht erwiesen“ ist verständlich und würdig, aber „mit seinem Arm seine Macht erwiesen“ ist im modernen Standarddeutsch syntaktisch und semantisch klarer. „in den Gedanken ihrer Herzen“ bleibt bewusst bibelnah, ist jedoch verständlich und durch die Fußnote erläutert.
  terminology: '„Macht“, „Arm“, „die Hochmütigen“ und „zerstreut“ sind treffend. Die Fußnote zu a sollte nicht „Macht getan“ als bloß wörtliche Formulierung ausgeben: κράτος ist hier eher „Macht/Stärke“ und ἐποίησεν κράτος eine idiomatische Wendung wie „Macht erwiesen/entfaltet“.'
