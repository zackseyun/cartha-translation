base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: de
  text: Er hat mit seinem Arm seine Macht erwiesen[a]; er hat die Hochmütigen in den Gedanken ihrer Herzen zerstreut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat mit seinem Arm Stärke entfaltet“ beziehungsweise „machtvolle Taten vollbracht“. Wörtlich steht: „Er hat Macht/Stärke gemacht“, eine griechische Wendung dafür, Macht zu erweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er hat die Hochmütigen durch die Absichten ihrer Herzen zerstreut“ oder: „in der Einbildung ihrer Herzen“. Die griechische Formulierung lässt offen, ob ihre innere Haltung als Bereich, Mittel oder Grund des Zerstreuens gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: hat … Macht erwiesen
  rationale: Die wörtliche Verbindung „Macht tun/machen“ ist im Deutschen unidiomatisch. „Macht erweisen“ gibt die ausgeübte beziehungsweise sichtbar gewordene Kraft natürlich wieder und bewahrt die abgeschlossene Aussageform des Aorists.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: mit seinem Arm
  rationale: ἐν ist hier instrumental zu verstehen. Die Formulierung bewahrt das biblische, anthropomorphe Bild vom machtvollen Arm Gottes.
- source_word: διεσκόρπισεν
  choice: hat … zerstreut
  rationale: „Zerstreuen“ entspricht der Grundbedeutung des Verbs und hält den poetischen Gleichlauf mit dem ersten Teilsatz aufrecht.
- source_word: ὑπερηφάνους
  choice: die Hochmütigen
  rationale: Das substantivierte Adjektiv bezeichnet hochmütige oder überhebliche Menschen. „Die Hochmütigen“ ist prägnant, verständlich und moralisch charakterisierend.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: in den Gedanken ihres Herzens
  rationale: Die Wiedergabe erhält die ungewöhnliche Verbindung von Denken und Herz sowie die mögliche lokale beziehungsweise sphärische Bedeutung von διανοίᾳ, ohne sie auf eine eindeutige psychologische Deutung zu verengen.
theological_decisions:
- issue: Zeitform der Aoriste im Magnifikat
  choice: Deutsches Perfekt („hat … erwiesen“, „hat … zerstreut“)
  alternative: Präteritum („erwies“, „zerstreute“) oder Präsens als Aussage über Gottes beständiges Handeln
  rationale: Das Perfekt bezeichnet Gottes Handeln als vollzogen und gegenwärtig bedeutsam. Zugleich legt es nicht abschließend fest, ob die Aoriste rückblickend, zusammenfassend oder prophetisch gebraucht sind.
- issue: Bezug von διανοίᾳ καρδίας αὐτῶν
  choice: „in den Gedanken ihres Herzens“ als bewusst quellennah gehaltene Formulierung
  alternative: „durch die Absichten ihres Herzens“ oder „in der Einbildung ihres Herzens“
  rationale: Die griechische Konstruktion kann den Bereich, die innere Haltung oder mittelbar den Grund beziehungsweise das Mittel ihres Hochmuts bezeichnen. Die Hauptfassung bewahrt diese Spannung; die Fußnote nennt verständliche Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Das vertraute biblische Bild vom Arm Gottes bleibt erhalten. Die leicht ungewöhnliche Wendung „Gedanken ihres Herzens“ ist bewusst quellennah und wird durch eine Fußnote erschlossen.
