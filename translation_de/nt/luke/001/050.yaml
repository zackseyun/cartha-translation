  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: de
  text: Und seine Barmherzigkeit gilt denen, die ihn fürchten,[a] von Generation zu Generation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit „ihn fürchten“ ist hier ehrfürchtige Gottesfurcht gemeint; auch: „die ihn verehren“ oder „die Ehrfurcht vor ihm haben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „für Generationen und Generationen“; gemeint ist die fortdauernde Barmherzigkeit über immer neue Generationen hinweg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Das Wort bezeichnet erbarmende Güte gegenüber Bedürftigen. „Barmherzigkeit“ ist hier die direkte, im biblischen Lobpreis vertraute und zugleich verständliche Wiedergabe.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: von Generation zu Generation
  rationale: Die Wendung beschreibt Gottes fortdauernde Barmherzigkeit über aufeinanderfolgende Generationen hinweg. Die deutsche Formulierung ist idiomatisch und bewahrt diesen zeitlichen Sinn, auch wenn das griechische εἰς wörtlicher eine Erstreckung „bis in Generationen“ ausdrückt.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: denen, die ihn fürchten
  rationale: Der Dativ bezeichnet die Empfänger beziehungsweise Nutznießer der Barmherzigkeit. „Ihn fürchten“ bewahrt die gewichtige biblische Ausdrucksweise; im Bezug auf Gott schließt sie ehrfürchtige Hinwendung ein und meint nicht bloßes Erschrecken.
- source_word: καί
  choice: Und
  rationale: Die Konjunktion verbindet den Vers mit den vorausgehenden Aussagen im Lobgesang und erhält dessen fortschreitenden poetischen Aufbau.
- source_word: αὐτοῦ / αὐτόν
  choice: seine / ihn
  rationale: Beide Pronomen beziehen sich im unmittelbaren Zusammenhang auf Gott; die gewöhnlichen deutschen Pronomen geben dies ohne erklärenden Zusatz wieder.
theological_decisions:
- issue: Bedeutung der Furcht Gottes
  choice: „die ihn fürchten“
  alternative: „die ihn verehren“ / „die Ehrfurcht vor ihm haben“
  rationale: φοβέομαι kann bei Gott als Objekt ehrfürchtige, fromme Gottesfurcht bezeichnen. „Fürchten“ erhält jedoch die biblische Spannung und engt den Ausdruck nicht auf bloße Verehrung oder auf Angst ein.
- issue: Dauer und Empfänger der Barmherzigkeit
  choice: Die Empfänger werden zuerst genannt, die zeitliche Erstreckung folgt am Satzende.
  alternative: „Von Generation zu Generation gilt seine Barmherzigkeit denen, die ihn fürchten.“
  rationale: Beide Satzglieder bestimmen die Barmherzigkeit. Die gewählte Reihenfolge ist im Deutschen flüssig und macht klar, dass „denen, die ihn fürchten“ die Empfänger bezeichnet, ohne die zeitliche Aussage abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Barmherzigkeit“ und „Gott fürchten“ bewahren die biblisch-theologische Ausdruckskraft; die Satzstellung bleibt zugleich natürlich und gut verständlich.
