id: LUK.1.26
reference: Luke 1:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: de
  text: Im sechsten Monat[a] wurde der Engel Gabriel von Gott in eine Stadt Galiläas namens Nazaret[b] gesandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der sechste Monat von Elisabets Schwangerschaft; siehe Lukas 1,24.36.
    reason: cross_reference
  - marker: b
    text: 'Oder: „in eine Stadt in Galiläa, die Nazaret hieß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Im sechsten Monat
  rationale: Die Präposition ἐν mit Dativ bezeichnet hier den Zeitpunkt. Das schwache Bindewort δέ muss im Deutschen nicht eigens wiedergegeben werden; der Anschluss bleibt durch die fortlaufende Erzählung erkennbar.
- source_word: ἀπεστάλη
  choice: wurde … gesandt
  rationale: Der Aorist Passiv wird als Passiv wiedergegeben. „Gesandt“ bewahrt neben dem Vorgang des Sendens auch den in diesem Zusammenhang naheliegenden Auftragston, ohne ihn auszuweiten.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Im Erzählzusammenhang bezeichnet ἄγγελος eindeutig ein himmlisches Wesen; „Engel“ ist dafür die natürliche deutsche Entsprechung.
- source_word: Γαβριὴλ
  choice: Gabriel
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: ἀπό mit Genitiv bezeichnet hier Herkunft beziehungsweise Ausgangspunkt. „Von Gott“ erhält diese Bedeutung und lässt zugleich die im Passivsatz mögliche Vorstellung Gottes als Sendenden bestehen.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: in eine Stadt Galiläas
  rationale: εἰς bezeichnet das Ziel und wird idiomatisch mit „in eine Stadt“ wiedergegeben. Der Genitiv „Galiläas“ folgt der griechischen Form eng und ist im gehobenen modernen Deutsch verständlich.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: namens Nazaret
  rationale: Die wörtliche Konstruktion „deren Name Nazaret [war]“ wird knapp und natürlich mit „namens Nazaret“ wiedergegeben.
theological_decisions:
- issue: Bezug von „im sechsten Monat“
  choice: Im Haupttext bleibt der Bezug unausgeführt; die Fußnote erklärt ihn als sechsten Monat von Elisabets Schwangerschaft.
  alternative: Der sechste Monat eines Kalenderjahres.
  rationale: Der unmittelbare Zusammenhang in Lukas 1,24 und 1,36 weist auf Elisabets Schwangerschaft. Da der griechische Vers selbst den Bezug nicht wiederholt, wird er nicht erläuternd in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt das griechische Passiv und hebt Gabriel als den Gesandten hervor. „Nazaret“ folgt der heute verbreiteten deutschen Schreibung.
