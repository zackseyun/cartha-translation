  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: de
  text: Am achten Tag kamen sie, um das Kind zu beschneiden, und nannten es nach seinem Vater Zacharias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie waren dabei, es nach seinem Vater Zacharias zu nennen.“ Das griechische Imperfekt kann einen begonnenen, andauernden oder versuchten Vorgang bezeichnen; im folgenden Vers wird diese Benennung zurückgewiesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Am achten Tag
  rationale: Die lukanische Erzählungsformel leitet das Geschehen ein. Im heutigen Deutschen kann sie natürlich in die Zeitangabe integriert werden, ohne inhaltlichen Verlust oder eine altertümliche Wendung wie „Und es geschah“.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: am achten Tag
  rationale: Natürliche deutsche Wiedergabe der präzisen Zeitangabe.
- source_word: ἦλθον
  choice: kamen sie
  rationale: Bewahrt das im Griechischen nicht näher bestimmte Subjekt im Plural, ohne eine Personengruppe hinzuzufügen.
- source_word: περιτεμεῖν
  choice: um … zu beschneiden
  rationale: Gibt den finalen Infinitiv unmittelbar und idiomatisch wieder.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: Direkte, kontextgemäße Wiedergabe von παιδίον; „Baby“ wäre möglich, aber stärker interpretierend.
- source_word: ἐκάλουν
  choice: sie wollten … nennen
  rationale: Bringt den imperfektischen, hier wohl versuchten beziehungsweise noch nicht abgeschlossenen Namensgebungsakt in natürliches Deutsch und passt zur Zurückweisung im folgenden Vers.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: nach seinem Vater
  rationale: Idiomatiche Wiedergabe des Benennens nach einer Person. Der Bezug auf den Namen ist im Deutschen durch „nennen“ bereits enthalten.
- source_word: Ζαχαρίαν
  choice: Zacharias
  rationale: Im modernen deutschen Bibelgebrauch übliche Form des Namens für die lukanische Gestalt.
theological_decisions:
- issue: Aspekt und Ergebnis der Namensgebung
  choice: Sie wollten es … nennen
  alternative: Sie nannten es / Sie waren dabei, es … zu nennen
  rationale: Der Imperfekt ἐκάλουν lässt offen, ob die Benennung im Gang oder lediglich beabsichtigt war. Die gewählte Form bewahrt den nicht abgeschlossenen Charakter und vermeidet den Eindruck, der Name sei bereits endgültig vergeben worden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Die unbestimmte Mehrzahl („sie“) und die erzählerische Spannung vor der Korrektur in Vers 60 bleiben erhalten.
