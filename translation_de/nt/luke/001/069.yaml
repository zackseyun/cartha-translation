  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: de
  text: und hat uns im Haus Davids, seines Dieners, ein Horn der Rettung aufgerichtet,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen mächtigen Retter“. Wörtlich: „ein Horn der Rettung“; ein biblisches Bild für kraftvolle Rettung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: hat … aufgerichtet
  rationale: Das Perfekt passt im Deutschen zum Lobpreis-Kontext, in dem Gottes rettendes Handeln als bereits wirksam gefeiert wird. „Aufgerichtet“ bewahrt zudem die konkrete Bildsprache des Horns.
- source_word: κέρας σωτηρίας
  choice: ein Horn der Rettung
  rationale: Die wörtliche biblische Metapher bezeichnet kraftvolle, siegreiche Rettungsmacht und bewahrt die alttestamentlichen Bezüge. Die ungewohnte Wendung wird in einer Fußnote erläutert.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ des Vorteils wird natürlich mit „uns“ beim Verb „aufrichten“ wiedergegeben und bezeichnet die Begünstigten des rettenden Handelns.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: im Haus Davids
  rationale: „Haus“ bezeichnet hier Geschlecht beziehungsweise Dynastie. Die traditionelle, im Deutschen verständliche Formulierung erhält den davidischen Bundesbezug und gibt ἐν formal mit „in“ wieder.
- source_word: παιδὸς αὐτοῦ
  choice: seines Dieners
  rationale: παῖς bezeichnet David in der biblischen Bundessprache als Gottes Diener, nicht als minderjähriges Kind.
theological_decisions:
- issue: Soll die Metapher „Horn der Rettung“ bewahrt oder als Titel „mächtiger Retter“ gedeutet werden?
  choice: Die Metapher „ein Horn der Rettung“ bleibt im Haupttext erhalten.
  alternative: einen mächtigen Retter
  rationale: Der griechische Text verwendet ein konkretes biblisches Bild für königliche Kraft und siegreiche Rettung. Seine Beibehaltung erhält literarische und theologische Bezüge, ohne die Metapher vorschnell auf einen Titel zu reduzieren; die sinngemäße Wiedergabe steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante biblische Metapher bleibt trotz ihrer heutigen Ungewöhnlichkeit stehen und wird knapp erläutert. Die Satzstellung hält „im Haus Davids“ nahe bei Gottes Aufrichten, ohne den Bezug von „seines Dieners“ auf David unklar werden zu lassen.
