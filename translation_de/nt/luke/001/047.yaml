    issue: Tempus von ἠγαλλίασεν
    rationale: »Jubelt« steht im Präsens, während ἠγαλλίασεν ein Aorist ist. Im deutschen Lied- bzw. Erzählkontext ist »hat gejubelt« eine natürliche Wiedergabe, die den abgeschlossenen Vorgang besser wahrt. Die bisherige Fußnote behandelt die quellennähere Form fälschlich nur als bloße Alternative.
