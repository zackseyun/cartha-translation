  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: de
  text: und mein Geist hat über Gott, meinen Retter, gejubelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion verbindet den Vers mit der parallelen Aussage des vorhergehenden Verses.
- source_word: ἠγαλλίασεν
  choice: jubelt
  rationale: Das Verb bezeichnet überschwängliche Freude. Das deutsche Präsens ist im poetischen Parallelismus mit dem vorhergehenden Vers natürlich und kann den griechischen Aorist im Liedkontext idiomatisch wiedergeben; »hat gejubelt« bleibt als formnähere Alternative in der Fußnote erhalten.
- source_word: τὸ πνεῦμά μου
  choice: mein Geist
  rationale: Die Wiedergabe bewahrt den eigenen Ausdruck πνεῦμα sowie den poetischen Parallelismus zu »meine Seele«, ohne beide Begriffe gleichzusetzen oder daraus eine bestimmte Anthropologie abzuleiten.
- source_word: ἐπὶ τῷ θεῷ
  choice: über Gott
  rationale: ἐπί mit Dativ bezeichnet bei diesem Verb den Grund beziehungsweise Gegenstand der Freude. »Über Gott jubeln« ist verständliches Deutsch und hält diesen Bezug deutlicher fest als das im Deutschen potenziell missverständliche »in Gott«.
- source_word: τῷ σωτῆρί μου
  choice: Gott, meinen Retter
  rationale: σωτήρ wird direkt und idiomatisch mit »Retter« wiedergegeben. Die Apposition identifiziert Gott ausdrücklich als den Retter der Sprecherin.
theological_decisions:
- issue: Gott wird als persönlicher Retter Marias bezeichnet
  choice: Gott, meinen Retter
  alternative: Gott, meinen Befreier
  rationale: Der griechische Text nennt Gott unmittelbar σωτήρ der Sprecherin. »Retter« bewahrt diese Aussage, ohne zusätzliche dogmatische Folgerungen einzutragen.
- issue: Verhältnis von »Geist« zu »Seele« im umgebenden Parallelismus
  choice: Den eigenständigen Ausdruck »mein Geist« beibehalten
  alternative: Als »mein Innerstes« wiedergeben und damit die Begriffe angleichen
  rationale: Die Parallelität legt eine enge Bedeutungsbeziehung nahe, doch der griechische Text verwendet verschiedene Wörter. Die Übersetzung wahrt diese literarische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. »Jubelt« bringt die intensive Freude von ἀγαλλιάω natürlich zum Ausdruck; die Fußnote dokumentiert die formnähere Vergangenheitswiedergabe.
