id: LUK.1.11
reference: Luke 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: de
  text: Da erschien ihm ein Engel des Herrn; er stand rechts vom Räucheraltar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Der Aorist Passiv von ὁράω wird in diesem erzählerischen Zusammenhang intransitiv gebraucht. „Erschien“ gibt die sichtbare Manifestation natürlich und präzise wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter. „Da“ markiert im Deutschen passend das nun eintretende Ereignis, ohne einen Gegensatz zu unterstellen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet die Person, der der Engel erscheint; die natürliche deutsche Verbindung lautet „ihm erschien“.
- source_word: ἄγγελος
  choice: ein Engel
  rationale: Im Zusammenhang einer Erscheinung im Tempel ist ein himmlisches Wesen gemeint, weshalb „Engel“ sachgerechter ist als das allgemeinere „Bote“.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird in der geläufigen und inhaltlich offenen Wendung „ein Engel des Herrn“ wiedergegeben.
- source_word: ἑστὼς
  choice: er stand
  rationale: Das Perfektpartizip beschreibt Haltung und Standort des Engels beim Erscheinen. Ein eigener Satzteil mit „er stand“ klingt im modernen Deutsch natürlicher als eine schwere Partizipialfügung.
- source_word: ἐκ δεξιῶν
  choice: rechts von
  rationale: Die Wendung bezeichnet eine Position auf der rechten Seite. Zusammen mit dem Altar ist „rechts vom“ knapp, eindeutig und idiomatisch.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: vom Räucheraltar
  rationale: Der Genitiv τοῦ θυμιάματος bestimmt, um welchen Altar es sich handelt. Das etablierte deutsche Kompositum „Räucheraltar“ gibt die Wendung präzise und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in ἄγγελος κυρίου
  choice: des Herrn
  alternative: des Herrschers / des Herrn ohne bestimmten Artikel
  rationale: „Ein Engel des Herrn“ ist die natürliche deutsche Entsprechung und wahrt den biblischen Hoheitstitel, ohne die genaue Identität des Engels oder die Art seiner Beauftragung näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolonanschluss vermeidet eine missverständliche Zuordnung des Partizips und hält zugleich Erscheinung, Haltung und Standort eng zusammen.
