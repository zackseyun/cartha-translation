source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: de
  text: wie er in das Haus Gottes ging, die Brote der Gegenwart[a] nahm und aß und denen, die bei ihm waren, davon gab – die nur die Priester essen dürfen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schaubrote“; wörtlich: „die Brote der Darlegung“. Gemeint sind die geweihten Brote, die vor Gott ausgelegt wurden.'
    reason: Erläutert den kultischen Ausdruck ἄρτους τῆς προθέσεως, bietet die traditionelle deutsche Bezeichnung und unterscheidet sie von der wörtlicheren Wiedergabe.
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet im Zusammenhang die Schilderung dessen ein, was David tat, und entspricht der indirekten Frageform.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: in das Haus Gottes ging
  rationale: Bewahrt οἶκος als „Haus“ und gibt die durch εἰς bezeichnete Bewegung in natürlichem Deutsch wieder, ohne den Ausdruck deutend durch „Tempel“ zu ersetzen.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: die Schaubrote
  rationale: „Schaubrote“ ist die etablierte deutsche Bezeichnung für die heiligen Brote, die vor Gott ausgelegt wurden; die Fußnote erläutert den weniger geläufigen Kultbegriff und seine wörtlichere Bedeutung.
- source_word: λαβὼν ἔφαγεν
  choice: nahm und aß
  rationale: Das vorzeitige Partizip und das finite Verb werden als natürliche deutsche Handlungsfolge wiedergegeben.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: denen, die bei ihm waren, davon gab
  rationale: Gibt τοῖς μετ’ αὐτοῦ eng und ohne die zusätzliche Deutung „Begleiter“ wieder; „davon“ stellt im Deutschen den Bezug zu den Broten her.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: obwohl … sie essen dürfen
  rationale: „Dürfen“ drückt die gesetzlich-kultische Erlaubnis idiomatisch aus; „obwohl“ bindet den griechischen Relativsatz im Deutschen klar an Davids Handlung an.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: nur die Priester
  rationale: Bewahrt die durch εἰ μή und μόνους doppelt hervorgehobene Ausschließlichkeit in knapper, natürlicher Form.
theological_decisions:
- issue: Gesetzlich-kultische Beschränkung beim Essen der heiligen Brote
  choice: „nur die Priester sie essen dürfen“
  alternative: „es niemandem außer den Priestern erlaubt ist, sie zu essen“
  rationale: Die Formulierung wahrt den Bezug auf eine verbindliche kultische Vorschrift, ohne näher auszulegen, wie Jesu Berufung auf Davids Handeln theologisch zu lösen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Fortsetzung der vorausgehenden Frage erkennbar. Der Gedankenstrich macht den erläuternden Gegensatz des griechischen Relativsatzes lesbar, ohne die Spannung zwischen Davids Handlung und der kultischen Vorschrift aufzulösen.
