id: LUK.6.5
reference: Luke 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Der Menschensohn ist Herr des Sabbats.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Menschensohn ist Herr über den Sabbat.«'
    reason: 'Lexikalisch-syntaktische Alternative: Der Genitiv τοῦ σαββάτου nach κύριος kann im Deutschen formal mit »des Sabbats« oder expliziter als Herrschaftsbeziehung mit »über den Sabbat« wiedergegeben werden.'
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzuführen.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Der griechische Imperfekt stellt das Sprechen im Erzählverlauf dar. Im natürlichen modernen Deutsch gibt das Präteritum »sagte« dies angemessen wieder; eine Umschreibung wie »war dabei zu sagen« wäre hier unidiomatisch und würde den Aspekt überbetonen.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Entspricht dem Dativ Plural und lässt die im Zusammenhang erkennbaren Gesprächspartner ohne unnötige Präzisierung stehen.
- source_word: Κύριος
  choice: Herr
  rationale: Bezeichnet hier nicht bloß eine höfliche Anrede, sondern die maßgebliche Autorität des Menschensohnes und bewahrt die christologische Aussagekraft.
- source_word: τοῦ σαββάτου
  choice: des Sabbats
  rationale: Gibt den Genitiv knapp und formal entsprechend wieder. Die mögliche explizitere Wiedergabe »über den Sabbat« wird in der Fußnote genannt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den titelartigen, semitisch geprägten Ausdruck und seine mögliche Verbindung zu Daniel 7.
theological_decisions:
- issue: Christologische Tragweite der Aussage über den Sabbat
  choice: »Der Menschensohn ist Herr des Sabbats«
  alternative: »Der Menschensohn ist Herr über den Sabbat«
  rationale: Die Übersetzung wahrt die direkte Behauptung der Autorität des Menschensohnes in Bezug auf den Sabbat. Sie fügt weder »sogar« noch eine andere interpretierende Verstärkung hinzu, die im griechischen Wortlaut nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und weiterhin verständliche Bezeichnung »Menschensohn« bleibt erhalten. »Herr des Sabbats« bewahrt die knappe Struktur des griechischen Satzes; die natürlichere explizite Alternative steht in der Fußnote.
