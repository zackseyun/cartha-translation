source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: de
  text: 'Er gleicht einem Menschen, der ein Haus baut: Er grub tief und legte das Fundament auf den Felsen. Als aber Hochwasser kam, brach der Fluss gegen jenes Haus los, konnte es jedoch nicht erschüttern, weil es gut gebaut worden war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: Er gleicht einem Mann
  rationale: Die gebräuchliche deutsche Vergleichsformel gibt den direkten Vergleich natürlich wieder; ἀνθρώπῳ bezeichnet hier die männliche Einzelfigur des Gleichnisses.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: der ein Haus baute
  rationale: Das Partizip beschreibt die im Vergleich handelnde Person; das Präteritum fügt sich natürlich in die anschließende Erzählung ein.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: Er grub tief hinunter
  rationale: Die Formulierung bündelt die beiden koordinierten Verben idiomatisch und bewahrt die Betonung einer tiefen Ausschachtung.
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: legte das Fundament auf den Felsen
  rationale: Dies entspricht der deutschen Bauformulierung und bewahrt den bestimmten Artikel sowie das konkrete Felsbild.
- source_word: πλημμύρης δὲ γενομένης
  choice: Als aber Hochwasser kam
  rationale: Der Genitivus absolutus wird als zeitlicher Umstand wiedergegeben; „Hochwasser“ ist im Zusammenhang mit dem anschwellenden Fluss natürlich und prägnant.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: prallte der Fluss gegen jenes Haus
  rationale: „Prallte … gegen“ vermittelt den heftigen Aufprall des Verbs προσρήγνυμι, während „jenes Haus“ die demonstrative Rückverweisung bewahrt.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: konnte es jedoch nicht erschüttern
  rationale: Die Konstruktion bezeichnet Unvermögen; „erschüttern“ gibt sowohl das physische Wanken als auch die drohende Destabilisierung des Hauses wieder.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: weil es gut gebaut worden war
  rationale: Die kausale Konstruktion und der passive Infinitiv werden ausdrücklich bewahrt; das Plusquamperfekt entspricht dem vorher abgeschlossenen Bau.
theological_decisions:
- issue: Geschlechtliche Wiedergabe von ἀνθρώπῳ in der repräsentativen Vergleichsfigur
  choice: einem Mann
  alternative: einem Menschen
  rationale: Die konkrete Figur wird im griechischen Text maskulin und singularisch vorgestellt. „Mann“ bewahrt diese Erzählgestalt, ohne die allgemeine Anwendung des Vergleichs einzuschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Bau- und Flutbilder bleiben konkret; „Hochwasser“ und „prallte … gegen“ vermitteln die natürliche Situation und ihre Wucht ohne zusätzliche Auslegung.
