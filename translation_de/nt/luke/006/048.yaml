review_pass:
  verdict: revise
  source_fidelity: 'Eine Revision ist angezeigt: ἀνθρώπῳ bezeichnet primär einen Menschen bzw. eine Person, nicht ausdrücklich einen Mann. Die maskuline grammatische Form macht die Vergleichsfigur nicht semantisch männlich. Die übrigen Bildelemente und der Kausalgrund sind im Entwurf im Wesentlichen zutreffend wiedergegeben.'
  naturalness: „Der Fluss prallte gegen jenes Haus“ ist im Deutschen weniger idiomatisch, da ein Fluss bei Hochwasser gegen ein Haus eher „losbricht“ oder „anstürmt“. Eine leicht geglättete, dennoch konkrete Formulierung verbessert den Erzählfluss.
  terminology: „Mensch“ gibt ἄνθρωπος in diesem allgemeinen Vergleich ohne unangemessene geschlechtliche Spezifizierung wieder. „Felsen“, „Fundament“, „Hochwasser“ und „erschüttern“ sind sachgerecht. Die Fußnote entfällt, weil die Übersetzung die lexikalisch naheliegende allgemeine Bedeutung bereits ausdrückt.
  issues:
  - severity: medium
    issue: „einem Mann“ für ἀνθρώπῳ
    rationale: ἄνθρωπος kann einen männlichen Einzelnen meinen, bezeichnet aber hier ohne weiteren Kontext allgemein einen Menschen. Die Übersetzung „Mann“ fügt eine semantische Geschlechtsspezifizierung hinzu, die das griechische Wort selbst nicht verlangt. Die englische Audit-Entscheidung ändert diesen Befund nicht.
  - severity: low
    issue: „prallte der Fluss gegen jenes Haus“
    rationale: Die Formulierung ist verständlich, aber für einen anschwellenden Fluss im modernen Standarddeutsch weniger natürlich. „Der Fluss brach gegen jenes Haus los“ bewahrt die Gewalt von προσέρηξεν und klingt idiomatischer.
  - severity: low
    issue: Fußnote zur angeblich männlichen Einzelfigur
    rationale: Die Fußnote stützt die unnötige semantische Einengung von ἄνθρωπος und sollte daher nicht beibehalten werden.
