  to: 'Er gleicht einem Menschen, der ein Haus baut: Er grub tief und legte das Fundament auf den Felsen. Als aber Hochwasser kam, brach der Fluss gegen jenes Haus los, konnte es jedoch nicht erschüttern, weil es gut gebaut worden war.'
