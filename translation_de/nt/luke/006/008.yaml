    rationale: „Dorthin“ ist aus der vorausgehenden Anweisung erschließbar, wird im griechischen Satz jedoch nicht ausdrücklich wiederholt. „Stellte sich in die Mitte“ ist klarer und bildet die räumliche Zielangabe ohne zusätzlichen Verweis ab.
