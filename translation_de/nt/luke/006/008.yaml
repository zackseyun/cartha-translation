source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: de
  text: 'Er aber wusste ihre Gedanken[a] und sagte zu dem Mann mit der verdorrten Hand[b]: »Steh auf und stell dich in die Mitte.« Da stand er auf und stellte sich in die Mitte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Überlegungen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der verkümmerten Hand«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: kannte
  rationale: Die Form von οἶδα hat hier präsentische Bedeutung; im deutschen Erzählzusammenhang gibt »kannte« den Sachverhalt natürlich wieder.
- source_word: διαλογισμοὺς
  choice: Gedanken
  rationale: Das Wort kann Gedanken, Überlegungen oder innere Erwägungen bezeichnen. »Gedanken« ist verständlich und legt die genaue Art des inneren Vorgangs nicht unnötig fest.
- source_word: ἀνδρὶ
  choice: Mann
  rationale: ἀνήρ bezeichnet hier ausdrücklich einen erwachsenen männlichen Menschen.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: verdorrte Hand
  rationale: ξηρός bezeichnet bei einem Körperteil einen ausgetrockneten, geschrumpften beziehungsweise funktionsunfähigen Zustand; »verdorrt« ist im Deutschen anschaulich und etabliert.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der erste Imperativ fordert den Mann auf, sich von seinem Platz zu erheben; die Wendung ist modernes, natürliches Deutsch.
- source_word: στῆθι
  choice: stell dich
  rationale: Die Wiedergabe als »stell dich« hält den zweiten Imperativ von »Steh auf« unterscheidbar und verbindet ihn idiomatisch mit der Ortsangabe.
- source_word: εἰς τὸ μέσον
  choice: in die Mitte
  rationale: Die Richtungsangabe εἰς bezeichnet die Bewegung in die Mitte der versammelten Gruppe.
- source_word: ἀναστὰς ἔστη
  choice: Da stand er auf und stellte sich dorthin
  rationale: Die Formulierung bewahrt die Abfolge von Aufstehen und anschließendem Einnehmen des angewiesenen Platzes.
theological_decisions:
- issue: Jesu Kenntnis der inneren Gedanken anderer
  choice: Die Aussage wird schlicht als »kannte ihre Gedanken« wiedergegeben.
  alternative: »erkannte ihre Absichten« oder »wusste durch übernatürliche Einsicht, was sie überlegten«
  rationale: Der Text behauptet Jesu Kenntnis, erklärt aber nicht, auf welche Weise er sie erlangte. Die Übersetzung fügt daher weder einen Mechanismus noch eine engere Deutung der Gedanken hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Imperative und die entsprechenden zwei Reaktionshandlungen bleiben erkennbar; »in die Mitte« bewahrt zudem die räumliche Bewegungsrichtung des griechischen Ausdrucks.
