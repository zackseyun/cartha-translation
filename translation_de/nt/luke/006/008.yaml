  source_fidelity: 'Die wesentlichen Elemente des griechischen Textes sind getroffen: Jesu Kenntnis ihrer inneren Gedanken, der Mann mit der beeinträchtigten Hand, die zweigliedrige Aufforderung und die zweigliedrige Reaktion. „Kannte ihre Gedanken“ ist jedoch im modernen Deutschen weniger idiomatisch und kann eine bereits bestehende persönliche Vertrautheit nahelegen; für ᾔδει (Form von οἶδα mit der Bedeutung „wusste“) ist „wusste“ genauer. „Dorthin“ ist als Ortsverweis verständlich, fügt aber einen im griechischen Antwortsatz nicht erneut ausgedrückten deiktischen Bezug hinzu; die Wiederholung von „in die Mitte“ bleibt klar und eng am Kontext.'
  naturalness: Mit „wusste ihre Gedanken“ sowie „stellte sich in die Mitte“ ist der Satz natürliches modernes Standarddeutsch. Die Befehlsfolge „Steh auf und stell dich in die Mitte“ bewahrt die zwei griechischen Imperative idiomatisch.
  terminology: „Gedanken“, „Mann“ und „verdorrte Hand“ sind sachgerecht. „Verdorrt“ ist bei einer Hand bildhaft, aber im biblischen und modernen medizinisch-deskriptiven Sprachgebrauch ausreichend verständlich; die Fußnote bietet die mögliche Alternative „verkümmert“.
