review_pass:
  verdict: revise
  source_fidelity: Das Plusquamperfekt „gekommen waren“ geht über den griechischen Aorist ἦλθον hinaus. Im Deutschen gibt „kamen“ den erzählenden Aorist unmittelbar wieder, ohne eine zeitliche Vorstufe festzulegen. Die übrigen zentralen Wiedergaben – Zweckinfinitive, passive Heilung, „unreine Geister“ und „geplagt“ – entsprechen dem griechischen Text angemessen. Das Imperfekt ἐθεραπεύοντο kann idiomatisch mit „wurden geheilt“ wiedergegeben werden; eine ausdrückliche Verlaufsumschreibung ist nicht erforderlich.
  naturalness: Der revidierte Relativsatz ist modernes, flüssiges Standarddeutsch und bleibt, wie im Ausgangstext, sinnvoll an den vorherigen Vers angeschlossen. Das Weglassen von „auch“ vermeidet eine nicht eigens markierte zusätzliche Hervorhebung.
  terminology: „Krankheiten“, „geheilt“, „unreine Geister“ und „geplagt“ sind sachgerecht und registerangemessen. „Unreine Geister“ bewahrt die etablierte neutestamentliche Terminologie, ohne die Bezeichnung zu interpretierend zu „Dämonen“ zu erweitern.
  issues:
  - severity: medium
    issue: „gekommen waren“ für ἦλθον
    rationale: Das deutsche Plusquamperfekt fügt gegenüber dem einfachen griechischen Aorist eine Vorzeitigkeit hinzu. Der Kontext kann ein vorausliegendes Kommen nahelegen, zwingt es aber nicht; „kamen“ bewahrt die offenere griechische Erzählform.
  - severity: low
    issue: Zusatz „auch“
    rationale: καί verbindet die beiden Gruppen, markiert hier jedoch nicht ausdrücklich ein deutsches hervorgehobenes „auch“. Die einfache Koordination ist genauer und stilistisch schlanker.
