  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: de
  text: die kamen, um ihn zu hören und von ihren Krankheiten geheilt zu werden; und die von unreinen Geistern geplagt wurden, wurden geheilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: die gekommen waren
  rationale: Das Relativpronomen knüpft an die Menschenmenge im vorhergehenden Vers an. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass sie bereits zu Jesus gekommen waren.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: um ihn zu hören
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens. „Ihn zu hören“ ist direkt, verständlich und wahrt die Formulierung des Griechischen.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: von ihren Krankheiten geheilt zu werden
  rationale: Die passive Heilungsaussage und ἀπό als Ausdruck der Befreiung beziehungsweise Trennung werden mit der im Deutschen natürlichen Verbindung „von Krankheiten geheilt werden“ wiedergegeben.
- source_word: οἱ ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: die, die von unreinen Geistern geplagt wurden
  rationale: ἐνοχλέω bezeichnet ein Bedrängen oder Plagen, ohne zwingend die stärkere Bedeutung „quälen“ zu verlangen. „Unreine Geister“ bewahrt die feste neutestamentliche Ausdrucksweise.
- source_word: ἐθεραπεύοντο
  choice: wurden geheilt
  rationale: Der Imperfekt beschreibt den fortlaufenden beziehungsweise wiederholten Heilungsvorgang in dieser Szene. Im Deutschen lässt sich dies hier idiomatisch durch das Präteritum ausdrücken; der Zusammenhang trägt den durativen Sinn.
theological_decisions:
- issue: Bezeichnung der πνεύματα ἀκάθαρτα
  choice: unreine Geister
  alternative: böse Geister / Dämonen
  rationale: „Unreine Geister“ übersetzt die griechische Bezeichnung unmittelbar und bewahrt ihre biblisch-theologische Spannung, ohne sie interpretierend durch „Dämonen“ zu ersetzen.
- issue: Bedeutungsstärke von ἐνοχλούμενοι
  choice: geplagt
  alternative: bedrängt / gequält
  rationale: „Geplagt“ vermittelt eine reale belastende Einwirkung, legt aber nicht mehr Intensität fest, als das Verb selbst in diesem Zusammenhang eindeutig ausdrückt.
- issue: Aspekt von ἐθεραπεύοντο
  choice: wurden geheilt
  alternative: wurden fortlaufend geheilt
  rationale: Der griechische Imperfekt bleibt bei der Auslegung als fortlaufende oder wiederholte Handlung relevant. Eine ausdrückliche deutsche Aspektumschreibung wäre jedoch schwerfällig; der szenische Zusammenhang ermöglicht die natürliche Präteritumsform.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Erzählstil. Der Satz bleibt als Relativsatz bewusst an Vers 17 angeschlossen. Das zusätzliche „auch“ macht die koordinierende Fortführung im Deutschen klar, ohne eine neue inhaltliche Aussage einzuführen.
