id: LUK.6.33
reference: Luke 6:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: de
  text: Und wenn ihr denen Gutes tut, die euch Gutes tun, welche Anerkennung gebührt euch dafür?[a] Auch die Sünder tun dasselbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was für ein Dank kommt euch dafür zu?“ Das griechische Wort kann „Gnade“, „Gunst“, „Dank“ oder „Anerkennung“ bedeuten; hier geht es um die Anerkennung für erwiderte Güte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: Gutes tut / Gutes tun
  rationale: Die wiederholte Wendung bewahrt den gleichen Wortstamm des griechischen Verbs und bezeichnet gutes, anderen nützendes Handeln.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: welche Anerkennung gebührt euch dafür?
  rationale: Im Zusammenhang fragt χάρις nach Anerkennung oder positivem Ansehen für ein Verhalten. Die Formulierung ist im Deutschen natürlich und vermeidet hier eine missverständliche soteriologische Deutung von „Gnade“.
- source_word: ἁμαρτωλοὶ
  choice: die Sünder
  rationale: Dies ist die direkte, in Lukas geläufige Wiedergabe der sozialen und religiösen Bezeichnung.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: tun dasselbe
  rationale: Die knappe deutsche Wendung entspricht der griechischen Aussage unmittelbar.
- source_word: καὶ
  choice: Und / Auch
  rationale: 'Das erste καί verbindet den Vers mit der Reihe paralleler Aussagen; das zweite hat hier einschließende beziehungsweise steigernde Kraft: Auch Sünder handeln so.'
theological_decisions:
- issue: Bedeutung von χάρις im ethischen Kontext
  choice: Anerkennung
  alternative: Gnade; Dank; Verdienst
  rationale: Die rhetorische Frage betrifft die Anerkennung für bloß erwiderte Wohltätigkeit, nicht ausdrücklich die rettende Gnade. Eine Fußnote erhält die lexikalische Spannweite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Parallelität von „Gutes tun“ bleibt erhalten; „Anerkennung gebührt“ gibt die rhetorische Frage idiomatisch wieder, ohne χάρις unnötig theologisch festzulegen.
