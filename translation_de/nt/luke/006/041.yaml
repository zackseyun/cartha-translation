id: LUK.6.41
reference: Luke 6:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: de
  text: Doch warum siehst du den Splitter[a] im Auge deines Bruders[b], bemerkst aber den Balken[c] in deinem eigenen Auge nicht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Hälmchen“ beziehungsweise „Stäubchen“. Das griechische Wort κάρφος bezeichnet ein winziges trockenes Teilchen und steht im starken Gegensatz zum Balken.
    reason: lexical_alternative
  - marker: b
    text: „Bruder“ gibt die maskuline Singularform des griechischen Wortes wieder; die Lehre gilt nicht nur für einen leiblichen männlichen Bruder.
    reason: cultural_note
  - marker: c
    text: Das griechische Wort δοκός bezeichnet einen großen Holzbalken; sinngemäß auch „Baumstamm“ oder „Bohle“.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: warum
  rationale: In der rhetorischen Verbindung τί … βλέπεις hat τί hier herausfordernd-kausale Kraft. „Warum“ gibt den vorwurfsvollen Sinn im Deutschen natürlich wieder.
- source_word: δὲ
  choice: doch / aber
  rationale: Das erste δέ führt mit leichtem Gegensatz zum vorherigen Zusammenhang weiter („Doch“); das zweite stellt das Nichtbemerken pointiert dem Sehen gegenüber („aber“).
- source_word: βλέπεις
  choice: siehst du
  rationale: Die gewöhnliche Bedeutung „sehen“ bewahrt das konkrete Bild vom Auge.
- source_word: κάρφος
  choice: Splitter
  rationale: κάρφος bezeichnet ein kleines trockenes Teilchen, etwa einen Halm, Spreu oder einen Splitter. „Splitter“ ist im Deutschen anschaulich und passt natürlich zum Auge sowie zum Größenkontrast mit dem Balken.
- source_word: ἀδελφοῦ
  choice: deines Bruders
  rationale: Die maskuline Singularform wird entsprechend der konkreten Bildrede als „deines Bruders“ wiedergegeben, ohne ihre mögliche repräsentative Anwendung im Text einzuengen.
- source_word: δοκόν
  choice: Balken
  rationale: δοκός bezeichnet einen großen tragenden Holzbalken. „Balken“ erhält die absichtliche Übertreibung und den starken Gegensatz zum Splitter.
- source_word: ἰδίῳ
  choice: deinem eigenen
  rationale: „Eigenen“ bewahrt die durch ἴδιος betonte Zugehörigkeit und den Kontrast zum Auge des Bruders.
- source_word: κατανοεῖς
  choice: bemerkst … nicht
  rationale: κατανοέω kann sorgfältiges Wahrnehmen oder Erkennen bezeichnen. „Bemerkst … nicht“ bringt die ironische Blindheit in klarem, heutigem Deutsch zum Ausdruck.
theological_decisions:
- issue: Geschlechtsspezifische Beziehungsbezeichnung ἀδελφοῦ
  choice: Bruder
  alternative: Bruder oder Schwester; Mitmensch
  rationale: Der griechische Text verwendet in der moralischen Bildrede ein maskulines Substantiv im Singular. Die Übersetzung wahrt diese Form; eine Fußnote weist darauf hin, dass die Lehre nicht auf einen leiblichen männlichen Bruder beschränkt ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die konkrete Augenmetapher, der übersteigerte Größenkontrast und die rhetorische Zurechtweisung bleiben erhalten.
