  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: de
  text: Und richtet nicht, und ihr werdet keinesfalls gerichtet werden; und verurteilt nicht, und ihr werdet keinesfalls verurteilt werden. Vergebt[a], und euch wird vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: „Lasst frei, und ihr werdet freigelassen werden.“ Das griechische Verb kann „freilassen“, „losgeben“ oder, wie in diesem Zusammenhang, „vergeben“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: κρίνετε / κριθῆτε
  choice: richtet / gerichtet werden
  rationale: „Richten“ bewahrt die knappe Entsprechung zwischen Aktiv und Passiv und bleibt weiter gefasst als das folgende, stärkere „verurteilen“.
- source_word: οὐ μὴ
  choice: auf keinen Fall
  rationale: Die Verbindung οὐ μή drückt eine nachdrückliche Verneinung aus. „Auf keinen Fall“ gibt diese Verstärkung in heutigem Deutsch natürlich wieder.
- source_word: καταδικάζετε / καταδικασθῆτε
  choice: verurteilt / verurteilt werden
  rationale: καταδικάζω bezeichnet ein nachteiliges Urteil beziehungsweise einen Schuldspruch und steigert damit die Aussage gegenüber κρίνω.
- source_word: ἀπολύετε / ἀπολυθήσεσθε
  choice: lasst frei / werdet freigelassen werden
  rationale: 'Die Wiedergabe erhält die aktive und passive Wortentsprechung sowie die breite Bedeutung von ἀπολύω: freilassen, losgeben oder von einem Anspruch entbinden. Die im Kontext mögliche engere Deutung „vergeben“ steht in der Fußnote.'
- source_word: καί
  choice: und
  rationale: Das wiederholte „und“ bewahrt die parallele, eindringliche Struktur des griechischen Satzes, ohne eine ausdrücklich zeitliche oder folgernde Beziehung einzutragen.
theological_decisions:
- issue: Ist ἀπολύετε eng als Vergebungsaufforderung oder weiter als Freilassung zu verstehen?
  choice: Im Haupttext „Lasst frei“
  alternative: „Vergebt, und euch wird vergeben werden“
  rationale: ἀπολύω hat ein breiteres Bedeutungsspektrum als „vergeben“ und kann im Zusammenhang mit Richten und Verurteilen auch Freilassung oder Lossprechung bezeichnen. Der Haupttext bewahrt diese Offenheit; die vertraute und kontextuell plausible Vergebungsdeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholungen und aktiven/passiven Entsprechungen des griechischen Parallelismus bleiben bewusst erhalten; „auf keinen Fall“ vermittelt die emphatische Verneinung.
