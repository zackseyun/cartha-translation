id: LUK.6.45
reference: Luke 6:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: de
  text: Der gute Mensch bringt aus dem guten Schatz seines Herzens das Gute hervor, und der böse Mensch bringt aus dem bösen Schatz das Böse hervor; denn wovon das Herz überfließt, davon spricht sein Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Denn aus dem Überfluss seines Herzens spricht sein Mund.“'
    reason: Bewahrt die Bildsprache von ἐκ περισσεύματος καρδίας und verdeutlicht die Zugehörigkeit mit „seines“.
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: der gute Mensch
  rationale: „Mensch“ gibt ἄνθρωπος im Deutschen natürlich und repräsentativ wieder; das grammatische Maskulinum bleibt erhalten, ohne die Aussage unnötig auf Männer zu beschränken.
- source_word: θησαυροῦ
  choice: Schatz
  rationale: „Schatz“ bewahrt das Bild eines im Inneren angesammelten Vorrats, aus dem das Gute oder Böse hervorgeholt wird.
- source_word: τῆς καρδίας
  choice: seines Herzens
  rationale: „Herz“ ist die geläufige und bildkräftige Bezeichnung für das innere Denken, Wollen und Empfinden des Menschen.
- source_word: προφέρει
  choice: bringt … hervor
  rationale: Die Formulierung wahrt die Vorstellung, dass etwas aus einem inneren Vorrat nach außen tritt, und lässt sich in beiden Gegenüberstellungen parallel verwenden.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: böse / bösen / das Böse
  rationale: Die einheitliche Wiedergabe bewahrt den klaren moralischen Gegensatz zu ἀγαθός und ist gewichtiger als „schlecht“.
- source_word: ἐκ … περισσεύματος καρδίας
  choice: wovon das Herz überfließt
  rationale: Die idiomatische deutsche Wendung erfasst den Gedanken einer inneren Fülle, die nach außen dringt, ohne die zugrunde liegende Bildsprache aufzugeben.
- source_word: λαλεῖ τὸ στόμα αὐτοῦ
  choice: davon spricht sein Mund
  rationale: „Spricht“ entspricht dem würdigen Ton; „sein Mund“ bleibt ausdrücklich stehen, weil der griechische Text die äußere Rede dem Herzen gegenüberstellt.
theological_decisions:
- issue: Moralischer Gegensatz zwischen ἀγαθός und πονηρός
  choice: „gut“ und „böse“ als moralische Kategorien beibehalten
  alternative: „gut“ und „schlecht“ oder funktionale Kategorien
  rationale: Jesu Aussage betrifft den moralischen Charakter und dessen sichtbare Frucht; „böse“ erhält die ethische Schärfe des griechischen πονηρός.
- issue: Verhältnis von Herz und Rede
  choice: Die Rede als Ausdruck dessen wiedergeben, wovon das Herz erfüllt ist
  alternative: Die Aussage kausal oder psychologisch stärker ausdeuten
  rationale: Der Text verbindet inneren Vorrat und äußere Rede bildhaft, ohne eine umfassende Lehre über menschliche Motivation auszuformulieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwortartigem Ton. Die parallele Satzstruktur und die Bilder von Schatz, Herz und Mund bleiben erhalten.
