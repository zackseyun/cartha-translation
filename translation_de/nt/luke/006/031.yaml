id: LUK.6.31
reference: Luke 6:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: de
  text: Und wie ihr wollt, dass die Menschen euch gegenüber handeln, so handelt auch ihr ihnen gegenüber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: wie
  rationale: Leitet den Vergleichsmaßstab ein; zusammen mit „so“ bildet es im Deutschen eine natürliche und präzise Entsprechung.
- source_word: θέλετε
  choice: ihr wollt
  rationale: Gibt den gewöhnlichen Wunsch oder Willen direkt und in heutigem Deutsch wieder.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: dass … euch tun
  rationale: Nach „wollen“ gibt der dass-Satz den Inhalt des Gewünschten wieder. Das allgemeine „tun“ bewahrt die Weite und die Wiederholung von ποιέω.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: Der Ausdruck bezeichnet Menschen allgemein und ist nicht auf Männer beschränkt.
- source_word: ποιεῖτε αὐτοῖς
  choice: tut … ihnen
  rationale: Bewahrt das wiederholte Verb und die wechselseitige Satzstruktur; der Dativ entspricht der griechischen Konstruktion.
- source_word: ὁμοίως
  choice: so … auch
  rationale: Drückt die entsprechende, gleichartige Handlung idiomatisch aus und nimmt das einleitende „wie“ auf.
theological_decisions:
- issue: Generische Bedeutung von οἱ ἄνθρωποι
  choice: die Menschen
  alternative: die Männer
  rationale: Der griechische Ausdruck ist hier allgemein auf andere Menschen bezogen; eine männlich exklusive Wiedergabe wäre sachlich zu eng.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korrelative Formulierung „wie … so“ erhält den Vergleich und die knappe, einprägsame Gestalt des Ausspruchs; die Wiederholung von „tun“ spiegelt bewusst das Griechische.
