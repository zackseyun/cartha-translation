  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: de
  text: An einem anderen Sabbat geschah es, dass er die Synagoge betrat und lehrte. Dort war ein Mann, dessen rechte Hand verdorrt[a] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „trocken“ oder „ausgedörrt“. Gemeint ist hier eine geschädigte oder verkümmerte rechte Hand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es
  rationale: Gibt die für Lukas typische erzählerische Einleitung idiomatisch wieder; δέ wirkt hier als leichter Übergang und verlangt im Deutschen kein eigenes vorangestelltes Wort.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: an einem anderen Sabbat
  rationale: Bezeichnet einen weiteren Sabbat bei einer anderen Gelegenheit und klingt im modernen Standarddeutsch natürlich.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: dass er in die Synagoge ging
  rationale: Die griechische Infinitivkonstruktion nach ἐγένετο wird als natürlicher deutscher Nebensatz wiedergegeben. „ging“ vermeidet das im Deutschen hier etwas steife „eintrat“, ohne die Bewegung in die Synagoge zu verlieren.
- source_word: καὶ διδάσκειν
  choice: und lehrte
  rationale: Der Präsensinfinitiv stellt das Lehren als Tätigkeit dar. Im Zusammenhang der deutschen Erzählung ist das Präteritum „lehrte“ idiomatisch und lässt den Verlauf offen, ohne einen punktuellen Abschluss zu betonen.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Dort war ein Mann
  rationale: Eine knappe, natürliche Wiedergabe der Existenz- und Ortsangabe; ἄνθρωπος bezeichnet hier einen männlichen Menschen.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: dessen rechte Hand
  rationale: Die Umformung als Relativsatz ist im Deutschen flüssig und bewahrt die ausdrückliche Bestimmung der rechten Hand.
- source_word: ξηρά
  choice: verdorrt
  rationale: Das Adjektiv bedeutet wörtlich „trocken“ beziehungsweise „verdorrt“ und bezeichnet hier eine geschädigte, funktionsunfähige Hand. „Verdorrt“ bewahrt das konkrete Bild, ohne eine medizinische Diagnose wie „gelähmt“ in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzstruktur. Der traditionelle Ausdruck „verdorrte Hand“ bleibt wegen seiner Nähe zum griechischen Bild erhalten und wird durch eine verständliche Fußnote erläutert. Der Fußnotenmarker steht unmittelbar bei dem Wort, auf das sich die Anmerkung bezieht.
