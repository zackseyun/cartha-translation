lexical_decisions:
- source_word: Ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorausgehenden Abschnitt und klingt im modernen Deutschen zugleich natürlich und würdig.
- source_word: ὑμῖν λέγω
  choice: euch … sage ich
  rationale: Bewahrt die direkte Anrede und die Aussageformel; die deutsche Wortstellung verbindet sie natürlich mit der näheren Bestimmung der Angesprochenen.
- source_word: τοῖς ἀκούουσιν
  choice: die ihr zuhört
  rationale: Das substantivierte Präsenspartizip bezeichnet die angesprochenen Hörenden. „Zuhört“ bringt im Kontext die aktive, fortdauernde Aufmerksamkeit idiomatisch zum Ausdruck.
- source_word: ἀγαπᾶτε
  choice: Liebt
  rationale: Gibt den Imperativ direkt wieder und bewahrt den zentralen Begriff der Liebe ohne erklärende Eingrenzung.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: eure Feinde
  rationale: Direkte und natürliche Wiedergabe des Objekts mit Possessivpronomen.
- source_word: καλῶς ποιεῖτε
  choice: tut … Gutes
  rationale: Gibt die idiomatische Verbindung im Deutschen knapp und verständlich wieder, ohne sie auf bloße Freundlichkeit abzuschwächen.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: denen …, die euch hassen
  rationale: Bewahrt den Dativbezug und gibt μισέω mit dem ungeschwächten deutschen Ausdruck „hassen“ wieder.
theological_decisions:
- issue: Ethische Gebote gegenüber Gegnern
  choice: Die Aufforderungen werden ohne Einschränkung als direkte Gebote wiedergegeben.
  alternative: Die Feindesliebe auf persönliche Feinde beschränken oder als rhetorische Übertreibung kennzeichnen.
  rationale: Der griechische Text enthält Imperative in der zweiten Person Plural und nennt in diesem Vers keine solche Einschränkung. Die radikale ethische Spannung bleibt daher bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Semikolon trennt die beiden parallelen Imperative klar, ohne ihre enge Verbindung aufzulösen.
