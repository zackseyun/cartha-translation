id: LUK.6.25
reference: Luke 6:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: de
  text: Wehe euch, die ihr jetzt satt seid, denn ihr werdet hungern. Wehe euch, die ihr jetzt lacht, denn ihr werdet trauern und weinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: Bewahrt den prophetischen Klang einer ernsten Gerichtsankündigung; „Ach“ würde eher bloßes Bedauern ausdrücken.
- source_word: ἐμπεπλησμένοι
  choice: satt seid
  rationale: Das Perfektpartizip bezeichnet den gegenwärtigen Zustand als Ergebnis des Sattwerdens. „Satt seid“ ist im Deutschen natürlich und erhält den konkreten Gegensatz zum künftigen Hungern.
- source_word: νῦν
  choice: jetzt
  rationale: Erhält den für den Spruch zentralen zeitlichen Gegensatz zwischen gegenwärtiger Lage und künftiger Umkehrung.
- source_word: πεινάσετε
  choice: werdet hungern
  rationale: Gibt den Futur Indikativ knapp und idiomatisch wieder und wahrt den direkten Gegensatz zu „satt“.
- source_word: γελῶντες
  choice: die ihr jetzt lacht
  rationale: Gibt das gegenwärtige Lachen konkret wieder, ohne es weitergehend als Freude oder sorglose Haltung auszulegen.
- source_word: πενθήσετε
  choice: werdet trauern
  rationale: Bewahrt den gewichtigen Sinn von Klage und Trauer und bleibt vom folgenden „weinen“ unterschieden.
- source_word: κλαύσετε
  choice: weinen
  rationale: Erhält neben „trauern“ die sicht- oder hörbare Äußerung des Leids und damit die rhetorische Steigerung.
- source_word: ὅτι
  choice: denn
  rationale: Leitet in gehobenem, aber modernem Deutsch natürlich den Grund für den Weheruf ein.
theological_decisions:
- issue: Charakter des Weherufs
  choice: Prophetische Warnung vor einer kommenden Umkehrung und Gericht
  alternative: Bloße soziologische Feststellung wechselnder Lebensumstände
  rationale: Die wiederholten Weherufe, die Zukunftsformen und der Zusammenhang mit den vorausgehenden Seligpreisungen weisen auf eine ernste kommende Umkehrung hin. Die Übersetzung benennt deren genaue Art nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und der Kontrast zwischen „jetzt“ und der künftigen Lage bleiben deutlich. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext natürlich wiedergegeben werden.
