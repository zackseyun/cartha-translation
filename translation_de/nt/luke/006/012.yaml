  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: de
  text: In diesen Tagen geschah es, dass er auf den Berg hinausging, um zu beten, und die ganze Nacht[a] im Gebet zu Gott verbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er blieb die Nacht hindurch im Gebet zu Gott.«'
    reason: Lexikalische Alternative für ἦν διανυκτερεύων, welche die fortdauernde Handlung stärker hervorhebt.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: geschah es
  rationale: Die lukanische Erzählungsformel wird in natürlichem, würdigem Deutsch wiedergegeben. δέ markiert hier vor allem den Fortgang der Erzählung und braucht keine betonte Übersetzung.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: in diesen Tagen
  rationale: Die Wendung bewahrt den zeitlichen Rückbezug und gibt das Demonstrativpronomen ταύταις direkt wieder.
- source_word: ἐξελθεῖν αὐτὸν
  choice: dass er hinaus … ging
  rationale: Der Akkusativ mit Infinitiv nach ἐγένετο wird idiomatisch als dass-Satz wiedergegeben; „hinaus“ erhält die Bewegungsrichtung von ἐξέρχομαι.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: Dies ist die natürliche deutsche Wiedergabe der Bewegung zu einem erhöhten Ort; der bestimmte Artikel bleibt erhalten, ohne den Ort näher zu bestimmen.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Infinitiv bezeichnet hier den Zweck des Hinausgehens.
- source_word: ἦν διανυκτερεύων
  choice: Er verbrachte die ganze Nacht
  rationale: Die Umschreibung aus Imperfekt und Partizip bezeichnet eine andauernde Handlung über die Nacht hinweg. Die deutsche Formulierung ist idiomatisch und bewahrt den durativen Sinn.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: im Gebet zu Gott
  rationale: Der Genitiv τοῦ θεοῦ bezeichnet in diesem Zusammenhang das Ziel beziehungsweise den Adressaten des Gebets. „Zu Gott“ verhindert das Missverständnis, es handle sich um ein Gebet, das Gott selbst spricht.
theological_decisions:
- issue: Beziehung von τοῦ θεοῦ zum Gebet Jesu
  choice: im Gebet zu Gott
  alternative: im Gebet Gottes / in Gottes Gebet
  rationale: Der Kontext beschreibt Jesus als den Betenden und Gott als den Adressaten. Die Übersetzung macht diese grammatisch naheliegende Beziehung verständlich, ohne eine weitergehende christologische Erklärung in den Vers einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einem schlichten, würdigen Erzählstil. Die zwei deutschen Sätze vermeiden eine schwerfällige Satzverbindung, ohne den inhaltlichen Zusammenhang des griechischen Satzes aufzulösen.
