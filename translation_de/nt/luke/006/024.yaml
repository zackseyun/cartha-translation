  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: de
  text: Doch wehe euch, die ihr reich seid! Denn ihr habt euren Trost schon empfangen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ihr habt euren Trost vollständig erhalten.“ Das Verb kann den vollständigen Empfang dessen bezeichnen, was jemandem zusteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet den scharfen Gegensatz zu den vorangehenden Seligpreisungen und klingt im modernen Deutschen natürlich.
- source_word: οὐαὶ ὑμῖν
  choice: wehe euch
  rationale: Bewahrt die feierliche prophetische Warn- und Gerichtsformel sowie die direkte Anrede.
- source_word: τοῖς πλουσίοις
  choice: die ihr reich seid
  rationale: Gibt das substantivierte Adjektiv in direkter Anrede klar und idiomatisch wieder, ohne die Aussage abzuschwächen oder näher zu bestimmen.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet den Grund für den Weheruf ein und bewahrt dabei einen würdigen, gut verständlichen Stil.
- source_word: ἀπέχετε
  choice: habt … schon empfangen
  rationale: Das Verb steht im Präsens, kann aber idiomatisch den vollständigen Empfang einer zustehenden Leistung bezeichnen. Die deutsche Perfektform mit „schon“ vermittelt den gegenwärtigen Besitz als Ergebnis des Empfangens; die Bedeutung „vollständig erhalten“ wird in der Fußnote offengehalten.
- source_word: παράκλησιν
  choice: Trost
  rationale: „Trost“ ist die direkte, allgemein verständliche Wiedergabe im Kontext der gegenwärtigen Erleichterung beziehungsweise zukünftigen Umkehrung.
- source_word: ὑμῶν
  choice: euren
  rationale: Gibt das Possessivpronomen ohne unnötige Erweiterung wieder.
theological_decisions:
- issue: Reichweite des Weherufs gegen die Reichen
  choice: Die Reichen werden unmittelbar und ohne einschränkenden Zusatz angesprochen.
  alternative: „die ihr auf Reichtum vertraut“ oder „die ihr in dieser Welt reich seid“
  rationale: Der griechische Text nennt schlicht „die Reichen“. Eine nähere moralische oder zeitliche Bestimmung würde eine Auslegung in den Vers eintragen.
- issue: Bedeutung und Zeitbezug von ἀπέχετε
  choice: „habt … schon empfangen“ bezeichnet einen bereits erlangten und gegenwärtig vorhandenen Trost.
  alternative: „empfangt euren Trost“ oder „habt euren Trost vollständig erhalten“
  rationale: Die Form ist ein Präsens, das Verb kann jedoch als Ausdruck für den quittierten beziehungsweise vollständigen Empfang gebraucht werden. Haupttext und Fußnote bewahren diese Spannung, ohne sie einseitig aufzulösen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Der Ausruf bewahrt die Schärfe des prophetischen Weherufs; erläuternde Zusätze zur Art des Reichtums wurden vermieden.
