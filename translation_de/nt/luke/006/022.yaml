id: LUK.6.22
reference: Luke 6:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: de
  text: Selig seid ihr, wenn die Menschen euch hassen, wenn sie euch ausschließen, euch beschimpfen und euren Namen als böse verwerfen wegen des Menschensohnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοί
  choice: Glücklich zu preisen
  rationale: Bewahrt den feierlichen Charakter der Seligpreisung und bezeichnet nicht bloß ein subjektives Glücksgefühl.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: Gibt den generischen Bezug wieder, ohne ihn auf Männer zu beschränken.
- source_word: ἀφορίσωσιν
  choice: aus ihrer Gemeinschaft ausschließen
  rationale: Macht im Verfolgungskontext den sozialen Sinn des Absonderns verständlich, ohne ihn auf eine bestimmte Institution einzuengen.
- source_word: ὀνειδίσωσιν
  choice: beschimpfen
  rationale: Gibt den verbalen Angriff in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: euren Namen als böse verwerfen
  rationale: Bewahrt das konkrete Element „Name“, während „verwerfen“ die idiomatische öffentliche Zurückweisung verständlich ausdrückt.
- source_word: ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: weil ihr zum Menschensohn gehört
  rationale: Drückt den kausalen Zusammenhang idiomatisch aus; die Ergänzung „ihr ... gehört“ macht deutlich, dass die Anfeindung aufgrund ihrer Verbindung mit dem Menschensohn erfolgt.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: dem Menschensohn
  rationale: Bewahrt die etablierte Selbstbezeichnung Jesu und ihre biblischen Bezüge.
theological_decisions:
- issue: Bedeutung der Seligpreisung Μακάριοί
  choice: Glücklich zu preisen seid ihr
  alternative: Selig seid ihr
  rationale: Die gewählte Form ist modern verständlich und bewahrt zugleich den objektiven Zuspruch; sie reduziert die Aussage nicht auf ein Gefühl.
- issue: Idiom ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: euren Namen als böse verwerfen
  alternative: euren Ruf als schlecht hinstellen
  rationale: Die Formulierung erhält die griechische Rede vom „Namen“ und lässt offen, ob besonders Rufschädigung, öffentliche Ächtung oder formelle Zurückweisung gemeint ist.
- issue: Kausalangabe ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: weil ihr zum Menschensohn gehört
  alternative: um des Menschensohnes willen
  rationale: Die idiomatische Form bezeichnet die Verfolgung wegen der Beziehung zu Jesus, ohne den Menschensohn als Handelnden oder Urheber der Verfolgung erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzrhythmus folgt der viergliedrigen Steigerung des Griechischen. „Glücklich zu preisen“ hält den Ton einer Seligpreisung, ohne archaisch zu wirken.
