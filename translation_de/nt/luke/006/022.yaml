revisions:
- from: Glücklich zu preisen seid ihr, wenn die Menschen euch hassen, euch aus ihrer Gemeinschaft ausschließen, euch beschimpfen und euren Namen als böse verwerfen, weil ihr zum Menschensohn gehört.[a]
  to: Selig seid ihr, wenn die Menschen euch hassen, wenn sie euch ausschließen, euch beschimpfen und euren Namen als böse verwerfen wegen des Menschensohnes.
  rationale: Die Revision beseitigt die interpretierende Ergänzung bei ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου und die zusätzliche Bestimmung „aus ihrer Gemeinschaft“. Sie erhält die Reihung der Verfolgungshandlungen, die Rede vom „Namen“ und den traditionellen, quellentreuen Titel „Menschensohn“. Eine Fußnote ist nicht erforderlich, da „wegen des Menschensohnes“ die griechische Kausalangabe unmittelbar abbildet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:22:57Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe der vier Anfeindungen ist im Wesentlichen quellentreu. Die Ergänzung „weil ihr zum Menschensohn gehört“ legt jedoch eine Beziehungsdeutung explizit aus, die der griechische Ausdruck ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου nicht näher bestimmt. „Wegen des Menschensohnes“ bewahrt die knappe Kausalangabe und ihre Offenheit.
  naturalness: „Selig seid ihr“ ist im Deutschen eine fest etablierte, weiterhin verständliche Form der Seligpreisung. „Die Menschen euch aus ihrer Gemeinschaft ausschließen“ fügt mit „ihrer Gemeinschaft“ einen im Ausgangstext nicht bezeichneten Bezug hinzu; „euch ausschließen“ ist natürlich und ausreichend. Die Wiedergabe des Namensidioms bleibt zwangsläufig etwas markiert, ist aber verständlich und wahrt die konkrete Bildlichkeit.
  terminology: „Menschensohn“ ist als etablierte Übersetzung des Titels beizubehalten. „Selig“ bewahrt Register und Gewicht von μακάριοι besser als die umständliche Formulierung „glücklich zu preisen“.
  issues:
  - severity: medium
    issue: Die Kausalangabe wird in der Hauptfassung ausgelegt.
    rationale: „weil ihr zum Menschensohn gehört“ ergänzt eine Zugehörigkeitsbeziehung. Das Griechische sagt lediglich „wegen des Menschensohnes“ und lässt den genauen Bezugsmodus offen.
  - severity: low
    issue: „aus ihrer Gemeinschaft“ ergänzt einen nicht ausdrücklich genannten sozialen Bezugsraum.
    rationale: ἀφορίσωσιν bezeichnet Ausschluss bzw. Absonderung; eine konkrete „Gemeinschaft“ wird nicht benannt.
  revised_text: Selig seid ihr, wenn die Menschen euch hassen, wenn sie euch ausschließen, euch beschimpfen und euren Namen als böse verwerfen wegen des Menschensohnes.
  revised_footnotes: []
