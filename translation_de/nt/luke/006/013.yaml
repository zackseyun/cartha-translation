  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: de
  text: Als es Tag wurde, rief Jesus seine Jünger zu sich und wählte zwölf von ihnen aus, die er auch Apostel nannte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Als es Tag wurde
  rationale: Gibt die temporale Wendung natürlich und zugleich eng am griechischen Wortlaut wieder; gegenüber „als der Morgen kam“ bleibt der allgemeinere Bezug auf den Tagesanbruch erhalten.
- source_word: προσεφώνησεν
  choice: rief ... zu sich
  rationale: Im Zusammenhang ruft Jesus seine Jünger offenbar herbei, um aus ihnen zwölf auszuwählen. „Zu sich rufen“ bringt diese kontextuelle Bedeutung im Deutschen klar zum Ausdruck.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist die etablierte, verständliche Wiedergabe von μαθητής im Evangelienkontext und bewahrt den Gedanken der Schüler- und Nachfolgebeziehung.
- source_word: ἐκλεξάμενος
  choice: wählte ... aus
  rationale: „Auswählen“ entspricht dem Sinn des Partizips und verbindet sich idiomatisch mit ἀπ’ αὐτῶν.
- source_word: ἀπ’ αὐτῶν
  choice: aus ihnen
  rationale: Macht deutlich, dass die Zwölf aus dem größeren Kreis der Jünger genommen wurden, ohne unnötige Erläuterung in den Text einzufügen.
- source_word: δώδεκα
  choice: zwölf
  rationale: Direkte Wiedergabe der Zahl; der griechische Text setzt hier kein Substantiv hinzu.
- source_word: ἀποστόλους
  choice: Apostel
  rationale: Der Ausdruck ist hier eine von Jesus verliehene Bezeichnung und hat im lukanischen Erzählzusammenhang bereits einen spezifischen Sinn. Das etablierte „Apostel“ bewahrt diesen besser als das allgemeinere „Gesandte“ oder „Boten“.
- source_word: ὠνόμασεν
  choice: nannte
  rationale: Bezeichnet die Benennung beziehungsweise Verleihung einer Bezeichnung. „Nannte“ ist im Deutschen natürlich und bleibt vom vorausgehenden „rief ... zu sich“ klar unterschieden.
theological_decisions:
- issue: Wiedergabe von ἀποστόλους als Funktionsbeschreibung oder etablierte Bezeichnung
  choice: Apostel
  alternative: Gesandte / Boten
  rationale: Im Vers benennt Jesus die ausgewählten Zwölf mit dieser Bezeichnung; es geht nicht bloß allgemein um Menschen, die eine Botschaft überbringen. „Apostel“ erhält die im Text entstehende besondere Benennung, ohne zusätzliche Aussagen über Amt oder Vollmacht einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jesus“ wurde als eindeutiges Subjekt aus dem unmittelbaren Erzählzusammenhang eingesetzt, da ein bloßes „er“ als isolierter Vers im Deutschen weniger klar wäre. Der Satzbau folgt dem Handlungsablauf des griechischen Textes und bleibt gut vorlesbar.
