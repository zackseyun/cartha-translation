  verdict: revise
  source_fidelity: Die Wiedergabe von Jesu Antwort und der rhetorischen Frage ist insgesamt treffend. Die Schlusswendung »als er und seine Begleiter Hunger hatten« nivelliert jedoch den Singular von ἐπείνασεν, dessen ausdrücklich genanntes Subjekt zunächst David ist; anschließend fügt der griechische Text »er und die bei ihm waren« an.
  naturalness: »Hunger hatte« und »die bei ihm waren« sind modernes, verständliches Standarddeutsch. Die nachgestellte Apposition bildet die leicht spannungsvolle, emphatische griechische Formulierung angemessen nach, ohne künstlich zu wirken.
  terminology: »David« ist die übliche deutsche Namensform. »Nicht einmal gelesen« gibt die Emphase von οὐδὲ gut wieder. »Die bei ihm waren« ist gegenüber »seine Begleiter« näher am nicht weiter spezifizierten griechischen Ausdruck.
