source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: de
  text: 'Jesus antwortete ihnen: »Habt ihr nicht einmal gelesen, was David tat, als er Hunger hatte, er und die, die bei ihm waren?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν
  choice: Jesus antwortete ihnen
  rationale: Die Partizip-plus-Verb-Verbindung ist eine geläufige griechische Ausdrucksweise für eine Antwort. Im Deutschen gibt »antwortete ihnen« den Sinn natürlich und ohne unnötige Doppelung wieder.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Habt ihr nicht einmal gelesen
  rationale: »Nicht einmal« bewahrt die zugespitzte Kraft von οὐδέ. Das Perfekt ist in einer deutschen rhetorischen Frage nach der Schriftkenntnis idiomatisch.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: was David tat
  rationale: Die natürliche deutsche Relativkonstruktion entspricht dem griechischen Wortlaut und leitet das Schriftbeispiel ein.
- source_word: ὁπότε ἐπείνασεν
  choice: als … Hunger hatten
  rationale: »Als« markiert ein einmaliges vergangenes Geschehen; »Hunger hatten« ist eine natürliche Wiedergabe von πεινάω im Erzählzusammenhang.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: er und seine Begleiter
  rationale: Die kompakte Formulierung gibt sowohl David selbst als auch die bei ihm befindlichen Personen wieder. »Begleiter« bezeichnet hier ohne weitergehende Festlegung diejenigen, die mit ihm waren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt durch »nicht einmal« erhalten; die abschließende Zusammenfassung vermeidet eine im Deutschen schwerfällige Wiederholung.
