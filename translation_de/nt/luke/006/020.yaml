source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: de
  text: 'Und er hob den Blick zu seinen Jüngern und sagte: „Selig seid ihr Armen[a], denn euch gehört das Reich Gottes.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher in der Form: „Selig sind die Armen.“ Das folgende „euch“ zeigt jedoch, dass Jesus die Jünger direkt anspricht. Lukas sagt „die Armen“, nicht „die Armen im Geist“ (vgl. Matthäus 5,3).'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς
  choice: richtete seinen Blick auf
  rationale: Die Wendung gibt das konkrete Aufheben und Hinwenden der Augen in natürlichem modernem Deutsch wieder, ohne die Blickrichtung abzuschwächen.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt leitet hier Jesu Rede ein. Das idiomatische deutsche Präteritum ist natürlicher als „war am Sagen“ und behauptet keinen ausdrücklich markierten Redeanfang.
- source_word: Μακάριοι
  choice: Glücklich zu preisen
  rationale: Die Wendung bezeichnet einen von Gott her begünstigten, beneidenswerten Zustand; sie ist im Deutschen verständlicher als das mehrdeutige „selig“ und tiefer als bloßes „glücklich“.
- source_word: οἱ πτωχοί
  choice: ihr Armen
  rationale: Die substantivierte Adjektivform lautet formal „die Armen“, doch ὑμετέρα richtet die Aussage unmittelbar an die Jünger. „Ihr Armen“ bewahrt sowohl die Gruppenbezeichnung als auch die direkte Anrede.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ führt im deutschen Makarismus natürlich die Begründung an und erhält die kausale Beziehung.
- source_word: ὑμετέρα ἐστὶν
  choice: euch gehört
  rationale: Die prädikative Possessivform bedeutet „ist euer“. „Euch gehört“ ist klares, gegenwärtiges Deutsch und bewahrt die betonte Zuordnung zu den Angeredeten.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die traditionelle und weiterhin verständliche Wiedergabe lässt die Bedeutungsbreite zwischen Gottes Herrschaft und ihrem Bereich offen.
theological_decisions:
- issue: Materielle oder geistliche Deutung von πτωχοί
  choice: Armen
  alternative: Armen im Geist
  rationale: Lukas schreibt lediglich „die Armen“. Die Übersetzung ergänzt nicht die Formulierung aus Matthäus 5,3 und lässt die lukanische Zuspitzung bestehen.
- issue: Dritte Person oder direkte Anrede im Makarismus
  choice: ihr Armen
  alternative: die Armen
  rationale: οἱ πτωχοί ist formal dritte Person, während ὑμετέρα die Jünger unmittelbar in der zweiten Person anspricht. Die gewählte Form macht diesen im Satz selbst angelegten Wechsel transparent, ohne „arm“ umzudeuten.
- issue: Zeitlicher Status des Reiches Gottes
  choice: euch gehört das Reich Gottes
  alternative: euch wird das Reich Gottes gehören
  rationale: Das griechische ἐστίν steht im Präsens. Die Übersetzung bewahrt diese gegenwärtige Aussage und verschiebt sie nicht ausschließlich in die Zukunft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und gut vorlesbar; „Glücklich zu preisen“ bewahrt den feierlichen Charakter der Seligpreisung ohne altertümliches „selig“. Der Fußnotenmarker [a] steht unmittelbar bei der auslegungsrelevanten Wiedergabe.
