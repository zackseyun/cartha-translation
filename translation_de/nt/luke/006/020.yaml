  source_fidelity: Die direkte Anrede in „ihr Armen“ gibt den durch ὑμετέρα („euch gehört“) erkennbaren Adressatenbezug gut wieder; „euch gehört das Reich Gottes“ bewahrt das Präsens von ἐστίν. Allerdings lässt „richtete seinen Blick auf“ das konkrete Aufheben der Augen (ἐπάρας τοὺς ὀφθαλμούς) weitgehend verschwinden.
  naturalness: „Selig seid ihr Armen“ ist im Deutschen eine etablierte, verständliche und würdige Formulierung für einen Makarismus. „Glücklich zu preisen seid ihr Armen“ ist zwar verständlich, wirkt jedoch unnötig umständlich und weniger idiomatisch.
  terminology: „Selig“ ist im Kontext der Seligpreisungen der angemessene deutsche Schlüsselbegriff und wahrt die über bloßes momentanes Glück hinausgehende Bedeutung von μακάριοι. „Reich Gottes“ ist passend und etabliert. Die Fußnote erhält die wichtige Abgrenzung gegenüber Matthäus 5,3.
