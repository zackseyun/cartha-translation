id: LUK.6.44
reference: Luke 6:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: de
  text: Denn jeder Baum wird an seiner eigenen Frucht erkannt. Von Dornen sammelt man ja keine Feigen, und von einem Dornstrauch liest man keine Trauben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: jeder Baum
  rationale: Die Verbindung mit dem Singular hat distributiven Sinn; „jeder Baum“ ist natürlich und bewahrt die individualisierende Aussage.
- source_word: γὰρ
  choice: denn / ja
  rationale: Das erste γάρ leitet die Begründung ein; das zweite wird idiomatisch mit „ja“ wiedergegeben und hält den erklärenden Zusammenhang aufrecht, ohne im Deutschen schwerfällig zweimal „denn“ zu setzen.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: an seiner eigenen Frucht
  rationale: Bei γινώσκεται bezeichnet ἐκ die Grundlage des Erkennens. „An ... erkannt“ ist idiomatisches Deutsch; „eigenen“ bewahrt ἰδίου und betont die Zuordnung von Baum und Frucht.
- source_word: γινώσκεται
  choice: wird ... erkannt
  rationale: Das Präsens Passiv beschreibt eine allgemeingültige, charakteristische Erkennbarkeit.
- source_word: ἀκανθῶν
  choice: Dornen
  rationale: Der Plural bezeichnet allgemein dornige Gewächse. „Dornen“ ist knapp, geläufig und lässt die botanische Bestimmung offen.
- source_word: συλλέγουσιν
  choice: sammelt man
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben; „sammeln“ passt zur Ernte von Feigen.
- source_word: σῦκα
  choice: Feigen
  rationale: Direkte und geläufige Wiedergabe des griechischen Plurals.
- source_word: βάτου
  choice: Dornstrauch
  rationale: βάτος meint einen dornigen, brombeerartigen Strauch. „Dornstrauch“ ist verständlich, ohne eine bestimmte Art festzulegen.
- source_word: σταφυλήν
  choice: Trauben
  rationale: Obwohl das griechische Wort im Singular steht, bezeichnet der deutsche Plural idiomatisch die geernteten Weintrauben.
- source_word: τρυγῶσιν
  choice: liest man
  rationale: „Trauben lesen“ ist die traditionelle und weiterhin verständliche deutsche Bezeichnung für das Ernten reifer Trauben und bewahrt die lexikalische Unterscheidung zu συλλέγουσιν.
theological_decisions:
- issue: Bildhafte Bedeutung der Frucht
  choice: Das landwirtschaftliche Sprichwort bleibt ohne ausdrückliche Deutung stehen.
  alternative: Die Frucht ausdrücklich als Charakter, Taten oder moralisches Verhalten erklären.
  rationale: Der griechische Text nennt an dieser Stelle nur das Bild. Seine Anwendung ergibt sich aus dem Kontext; eine Ausdeutung im Vers würde die theologische Offenheit des Bildes unzulässig einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartiger Prägnanz. Der Wechsel zwischen „sammeln“ und „Trauben lesen“ spiegelt die beiden unterschiedlichen griechischen Ernteverben. Keine Fußnoten nötig, da „Dornen“ und „Dornstrauch“ den jeweiligen Ausdruck hinreichend wiedergeben.
