review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt die distributive Aussage von ἕκαστον ... δένδρον, die Erkenntnis „an/aus“ der jeweils eigenen Frucht sowie beide mit γάρ begründeten Sprichwortsätze zuverlässig wieder. „Dornen“ für ἀκάνθαι und „Dornstrauch“ für βάτος halten die im Griechischen vorhandene botanische Unterscheidung ohne unbegründete Spezifizierung aufrecht. Die Wiedergabe von τρυγῶσιν als „Trauben lesen“ ist sachgerecht.
  naturalness: „Denn jeder Baum wird an seiner eigenen Frucht erkannt“ ist idiomatisches, modernes und zugleich sprichworttaugliches Standarddeutsch. Auch „Von Dornen sammelt man ja keine Feigen, und von einem Dornstrauch liest man keine Trauben“ ist flüssig; „Trauben lesen“ bleibt im gegenwärtigen Standarddeutsch verständlich und passt zum landwirtschaftlichen Register.
  terminology: Die Begriffe sind konsistent und quellentreu. „Eigene Frucht“ bewahrt die Betonung von ἰδίου. Der Text deutet das Bild nicht über den Wortlaut hinaus aus und wahrt damit seine metaphorische Offenheit.
