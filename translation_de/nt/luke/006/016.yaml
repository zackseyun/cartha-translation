id: LUK.6.16
reference: Luke 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: de
  text: und Judas, Sohn des Jakobus,[a] und Judas Iskariot, der zum Verräter wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judas, Bruder des Jakobus“. Im Griechischen steht lediglich: „Judas des Jakobus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Judas, den Sohn des Jakobus
  rationale: Der Genitiv Ἰακώβου bezeichnet hier wahrscheinlich eine familiäre Zuordnung, lässt die genaue Beziehung aber unausgesprochen. Für natürliches Deutsch wird „Sohn des Jakobus“ ergänzt; die mögliche Deutung „Bruder des Jakobus“ wird in der Fußnote bewahrt.
- source_word: Ἰσκαριὼθ
  choice: Iskariot
  rationale: Die geläufige deutsche Form dieser Namensbezeichnung wird beibehalten.
- source_word: ὃς ἐγένετο
  choice: der … wurde
  rationale: Diese Wiedergabe erhält die dynamische Bedeutung von γίνομαι („werden“) und reduziert die Aussage nicht auf ein bloßes „war“.
- source_word: προδότης
  choice: Verräter
  rationale: „Verräter“ gibt die Personenbezeichnung prägnant und idiomatisch wieder.
- source_word: καὶ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die letzten Namen der Aufzählung; im Deutschen wird sie entsprechend wiedergegeben.
theological_decisions:
- issue: Die durch Ἰακώβου angedeutete Beziehung bei Judas
  choice: Im Haupttext „Sohn des Jakobus“
  alternative: „Bruder des Jakobus“ oder wörtlich „Judas des Jakobus“
  rationale: Der griechische Genitiv nennt die genaue verwandtschaftliche Beziehung nicht. „Sohn des Jakobus“ ist in einer Namensliste die wahrscheinlichste und natürlichste Ergänzung, ohne die alternative Deutung zu verschweigen; die echte Mehrdeutigkeit wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Akkusativform „den Sohn“ fügt sich in die fortlaufende Apostelliste ein. „zum Verräter wurde“ bewahrt sowohl die Aussage über Judas’ spätere Rolle als auch die verbale Dynamik des griechischen Ausdrucks.
