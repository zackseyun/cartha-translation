- from: An einem Sabbat ging Jesus durch die Getreidefelder. Seine Jünger pflückten Ähren, zerrieben sie mit den Händen und aßen die Körner.[a]
  to: An einem Sabbat ging Jesus durch die Getreidefelder. Seine Jünger pflückten Ähren und aßen sie, indem sie sie mit den Händen zerrieben.[a]
  rationale: Die Revision bewahrt das im Griechischen genannte Objekt „Ähren“ sowie die Verbindung der Handlungen. Die Fußnote erläutert knapp die kulturell-sachliche Voraussetzung, ohne den Haupttext interpretierend zu ersetzen.
