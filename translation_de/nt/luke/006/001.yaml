  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: de
  text: An einem Sabbat ging Jesus durch die Getreidefelder. Seine Jünger pflückten Ähren und aßen sie, indem sie sie mit den Händen zerrieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Reiben der Ähren mit den Händen löste die essbaren Körner.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: An einem Sabbat
  rationale: Die lukanische Ereignisformel dient hier vor allem als erzählerischer Übergang. Im Deutschen lässt sie sich natürlich in die Zeitangabe integrieren, ohne ein schwerfälliges „Es geschah aber“.
- source_word: ἐν σαββάτῳ
  choice: an einem Sabbat
  rationale: Der artikellose Dativ bezeichnet hier natürlich einen nicht näher bestimmten Sabbat.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: ging Jesus durch die Getreidefelder
  rationale: Der Infinitiv nach ἐγένετο wird als natürlicher deutscher Hauptsatz wiedergegeben. „Getreidefelder“ bezeichnet bestellte Felder, ohne die Getreideart festzulegen; der Name Jesus verdeutlicht im Einzelvers den Bezug des Pronomens.
- source_word: ἔτιλλον
  choice: pflückten
  rationale: Das Imperfekt beschreibt die fortlaufende Handlung; im deutschen Erzähltempus ist „pflückten“ natürlich.
- source_word: τοὺς στάχυας
  choice: Ähren
  rationale: „Ähren“ ist die genaue und im Deutschen geläufige Bezeichnung für στάχυας.
- source_word: ψώχοντες ταῖς χερσίν
  choice: zerrieben sie mit den Händen
  rationale: 'Die Formulierung bewahrt die konkrete Begleithandlung: Die Ähren wurden zwischen den Händen gerieben, um die essbaren Körner zu lösen.'
- source_word: καὶ ἤσθιον
  choice: und aßen die Körner
  rationale: Das im Griechischen transitive „aßen die Ähren“ meint sachlich die durch Reiben gelösten essbaren Körner. Diese natürliche deutsche Formulierung macht den Ablauf verständlich; die Fußnote weist auf die wörtlichere Syntax hin.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist gegenüber der griechischen Ereignisformel geglättet; die Abfolge Pflücken, Reiben und Essen bleibt klar erhalten.
