review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἐν σαββάτῳ als „an einem Sabbat“, von διὰ σπορίμων als „durch die Getreidefelder“ und von στάχυας als „Ähren“ ist zutreffend. Im Entwurf wird jedoch das direkte Objekt von ἤσθιον („die Ähren“) zu „die Körner“ umgedeutet und die griechische Gleichzeitigkeit von Pflücken, Essen und Reiben stärker zu einer zeitlichen Abfolge umgestellt. Die Erklärung, dass beim Reiben essbare Körner gelöst werden, gehört in die Anmerkung, nicht in den Haupttext.
  naturalness: „Ähren pflücken und essen“ ist im Deutschen trotz der sachlichen Verkürzung verständlich und näher am griechischen Ausdruck als „die Körner essen“. „indem sie sie mit den Händen zerrieben“ gibt die modale Partizipialkonstruktion klar und idiomatisch wieder.
  terminology: „Sabbat“, „Getreidefelder“ und „Ähren“ sind moderne standarddeutsche und sachlich angemessene Begriffe. Die Ergänzung „Jesus“ ist zur eindeutigen Referenz im isolierten Vers vertretbar.
  issues:
  - severity: medium
    issue: „aßen die Körner“ ersetzt das im griechischen Text genannte Objekt „die Ähren“.
    rationale: στάχυας ist ausdrücklich das Objekt von „pflückten“ und „aßen“. Zwar werden tatsächlich die essbaren Körner verzehrt, doch diese sachliche Auslegung sollte nicht den Wortlaut im Haupttext ersetzen.
  - severity: low
    issue: Die Abfolge „pflückten … zerrieben … und aßen“ macht die Handlungen stärker sukzessiv als der griechische Satz.
    rationale: ἔτιλλον und ἤσθιον sind koordinierte Imperfekte; ψώχοντες beschreibt begleitend, wie sie die Ähren zum Essen zerrieben.
  revised_text: An einem Sabbat ging Jesus durch die Getreidefelder. Seine Jünger pflückten Ähren und aßen sie, indem sie sie mit den Händen zerrieben.[a]
