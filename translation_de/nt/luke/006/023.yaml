id: LUK.6.23
reference: Luke 6:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: de
  text: 'Freut euch an jenem Tag und springt vor Freude! Denn seht: Euer Lohn ist groß im Himmel; denn genauso gingen ihre Vorfahren mit den Propheten um.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρητε
  choice: Freut euch
  rationale: Der Aoristimperativ Plural fordert unmittelbar zur Freude auf; „Freut euch“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Gibt die zeitliche Wendung knapp und idiomatisch wieder, ohne ihren eschatologischen Bezug näher festzulegen.
- source_word: σκιρτήσατε
  choice: springt vor Freude
  rationale: Bewahrt sowohl die körperliche Bewegung als auch ihren freudigen Sinn und klingt natürlicher als das bloße „springt“.
- source_word: ἰδοὺ
  choice: seht
  rationale: Markiert den nachfolgenden Begründungssatz als besonders beachtenswert; „seht“ ist gegenwärtiges, gehobenes Standarddeutsch.
- source_word: μισθὸς
  choice: Lohn
  rationale: „Lohn“ bildet den griechischen Begriff direkt ab und kann in diesem Zusammenhang die von Gott gewährte Vergeltung bezeichnen, ohne sie auf Arbeitsentgelt zu verengen.
- source_word: πολὺς
  choice: groß
  rationale: „Groß“ ist die natürliche prädikative Verbindung mit „Lohn“ und erhält die Betonung.
- source_word: ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Bewahrt die im Text genannte himmlische Sphäre, ohne sie theologisch auszuweiten.
- source_word: κατὰ τὰ αὐτά
  choice: genauso
  rationale: Gibt die idiomatische Bedeutung „auf dieselbe Weise“ prägnant und natürlich wieder.
- source_word: ἐποίουν
  choice: haben ... gemacht
  rationale: Die deutsche Wendung „es mit jemandem so machen“ gibt die komprimierte Konstruktion verständlich wieder; das Perfekt ist für erzählenden Rückblick im modernen Deutsch natürlich.
- source_word: τοῖς προφήταις
  choice: mit den Propheten
  rationale: Ergänzt die im Deutschen erforderliche idiomatische Konstruktion, während die feindselige Art der Behandlung weiterhin aus dem Kontext hervorgeht.
- source_word: οἱ πατέρες αὐτῶν
  choice: ihre Vorfahren
  rationale: πατέρες bezeichnet hier frühere Generationen. „Vorfahren“ ist im modernen Deutsch klarer als das missverständliche wörtliche „Väter“.
theological_decisions:
- issue: Art und Ort des verheißenen Lohns
  choice: Euer Lohn ist groß im Himmel
  alternative: Euer Lohn bei Gott im Himmel ist groß
  rationale: Die Übersetzung wahrt die Orts- beziehungsweise Sphärenangabe des griechischen Textes und fügt keine ausdrückliche Bestimmung „bei Gott“ hinzu.
- issue: Bezug von οἱ πατέρες αὐτῶν
  choice: ihre Vorfahren
  alternative: ihre Väter
  rationale: Gemeint sind wahrscheinlich die Vorfahren der Verfolger. „Vorfahren“ erhält den generationenübergreifenden Vorwurf und vermeidet im heutigen Deutsch eine Beschränkung auf unmittelbare leibliche Väter.
- issue: Art des Handelns an den Propheten
  choice: genauso haben ihre Vorfahren es mit den Propheten gemacht
  alternative: genauso haben ihre Vorfahren die Propheten behandelt
  rationale: Die gewählte Fassung bleibt näher bei ποιέω und lässt wie der griechische Text die konkrete feindselige Behandlung aus dem Zusammenhang erschließen; die Alternative wäre glatter, aber stärker ausdeutend.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Doppelpunkt nach „seht“ bildet dessen aufmerksamkeitslenkende Funktion ab. Die Ausrufeform bewahrt die Eindringlichkeit der beiden Imperative. Der einzige Fußnotenmarker [a] steht im Haupttext.
