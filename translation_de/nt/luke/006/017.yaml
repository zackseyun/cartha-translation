  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: de
  text: Er stieg mit ihnen hinab und blieb auf einer ebenen Stelle stehen. Dort waren eine große Schar seiner Jünger und eine große Menge des Volkes aus ganz Judäa und Jerusalem sowie aus dem Küstengebiet von Tyrus und Sidon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: stieg … hinab
  rationale: Das Aoristpartizip von καταβαίνω bezeichnet die der Haupthandlung vorausgehende Abwärtsbewegung. Die deutsche finite Reihung gibt den natürlichen Erzählfluss wieder und bewahrt die Richtung.
- source_word: ἔστη
  choice: blieb … stehen
  rationale: ἔστη bezeichnet hier das Einnehmen beziehungsweise Beibehalten einer stehenden Position. „Blieb stehen“ ist in diesem Bewegungszusammenhang natürlich und macht keine weitergehende Aussage über die Dauer.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: auf einer ebenen Stelle
  rationale: τόπος bedeutet „Ort/Stelle“, πεδινός „eben/flach“. Die Wiedergabe bleibt nahe am Wortlaut und legt sich nicht unnötig auf eine ausgedehnte Ebene als Landschaftsform fest.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: eine große Schar seiner Jünger
  rationale: ὄχλος bezeichnet eine Menschenansammlung; der Genitiv nennt ihre Zusammensetzung. „Schar“ unterscheidet diese Jüngergruppe stilistisch von der anschließend genannten großen Volksmenge.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: eine große Menschenmenge
  rationale: πλῆθος πολὺ hebt die sehr große Zahl hervor. Im Deutschen gibt „Menschenmenge“ den kollektiven Sinn von τοῦ λαοῦ natürlich wieder, ohne eine soziale Schicht zu unterstellen.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: aus ganz Judäa
  rationale: πάσης drückt die umfassende regionale Herkunft aus; „aus ganz Judäa“ ist präzise und idiomatisch.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: aus dem Küstengebiet von Tyrus und Sidon
  rationale: παράλιος bezeichnet das Gebiet am Meer. „Küstengebiet“ vermittelt den geografischen Sinn klar; die Genitive ordnen es Tyrus und Sidon zu.
theological_decisions:
- issue: Topografische Formulierung im Verhältnis zum Schauplatz der Rede
  choice: auf einer ebenen Stelle
  alternative: in einer Ebene
  rationale: Die Übersetzung folgt dem lexikalischen Sinn von ἐπὶ τόπου πεδινοῦ, ohne Lukas mit der Bergszene bei Matthäus zu harmonisieren oder einen Widerspruch zu verschärfen. Sie lässt offen, ob eine kleinere ebene Stelle oder eine größere Ebene gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Satzkette wurde für einen natürlichen deutschen Erzählfluss in zwei Sätze gegliedert. „Dort waren“ ergänzt keine neue Ortsangabe, sondern bindet die beiden im Griechischen elliptisch angeschlossenen Gruppen verständlich an Jesu Standort an.
