  to: Er stieg mit ihnen hinab und blieb auf einer ebenen Stelle stehen. Dort waren eine große Schar seiner Jünger und eine große Menge des Volkes aus ganz Judäa und Jerusalem sowie aus dem Küstengebiet von Tyrus und Sidon.
