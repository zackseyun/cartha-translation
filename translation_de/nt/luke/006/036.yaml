  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: de
  text: Seid barmherzig[a], wie euer Vater barmherzig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitfühlend“. Das griechische Adjektiv kann jemanden bezeichnen, der von Mitgefühl bewegt ist und Erbarmen zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Seid
  rationale: Der präsentische Imperativ fordert zu einer fortdauernden Haltung auf. Im natürlichen Deutschen gibt „Seid“ dies besser wieder als das schwerfälligere „Werdet“.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: barmherzig
  rationale: Das Adjektiv bezeichnet Menschen, die von Mitgefühl bewegt sind und Erbarmen zeigen. „Barmherzig“ ist eine direkte, verständliche Wiedergabe und bewahrt die Wiederholung desselben griechischen Wortstamms.
- source_word: καθὼς
  choice: wie auch
  rationale: 'καθώς kennzeichnet hier den vergleichenden Maßstab: Die Barmherzigkeit des Vaters ist das Vorbild für das Verhalten der Angesprochenen. „Wie auch“ gibt diesen Vergleich natürlich wieder.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: euer Vater
  rationale: Der Ausgangstext sagt schlicht „euer Vater“. Ein Zusatz wie „himmlischer“ wäre eine nicht ausdrücklich vorhandene Verdeutlichung.
theological_decisions:
- issue: Verhältnis des Gebots zum Wesen des Vaters
  choice: Die Barmherzigkeit des Vaters wird als Maßstab für das Handeln der Angesprochenen dargestellt.
  alternative: 'Die Aussage kausal zu verstehen: Seid barmherzig, weil euer Vater barmherzig ist.'
  rationale: καθώς hat hier am natürlichsten vergleichende Bedeutung („wie“), nicht kausale Bedeutung („weil“). Damit bleibt die ethische Vorbildfunktion erhalten, ohne zusätzliche theologische Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und die lexikalische Wiederholung des griechischen Textes wurden bewahrt.
