  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: den additiven Anschluss („auch“), die als negative Antwort erwartende erste Frage („Kann etwa ...?“), die substantivierten maskulinen Singularformen in ihrer sprichwörtlich-generischen Funktion, die Führungssituation sowie die zustimmungsheischende zweite Frage mit Futur und Zielangabe. „Grube“ ist für βόθυνος eine treffende, ausreichend weite Wiedergabe.'
  naturalness: „Er erzählte ihnen auch ein Gleichnis“ und die beiden Fragen sind flüssiges, modernes Standarddeutsch bei angemessen würdigem Bibelregister. „Ein Blinder einen Blinden führen“ ist idiomatisch und bewahrt die knappe Bildsprache.
