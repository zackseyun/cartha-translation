id: LUK.6.39
reference: Luke 6:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: de
  text: 'Er erzählte ihnen auch ein Gleichnis: „Kann etwa ein Blinder einen Blinden führen? Werden nicht beide in eine Grube fallen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einen Graben fallen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: auch
  rationale: Nach δὲ bewahrt „auch“ die additive Bedeutung des griechischen Anschlusses und klingt im Deutschen natürlich.
- source_word: παραβολὴν
  choice: Gleichnis
  rationale: „Gleichnis“ ist die geläufige und gattungsgerechte Wiedergabe für eine bildhafte Lehrrede im Evangelienkontext.
- source_word: Μήτι
  choice: Kann etwa
  rationale: Die mit μήτι eingeleitete Frage erwartet eine verneinende Antwort. „Etwa“ macht diese Erwartung im Deutschen kenntlich, ohne die Frage in eine Aussage umzuwandeln.
- source_word: δύναται
  choice: kann
  rationale: Die knappe deutsche Form gibt die bezeichnete Fähigkeit unmittelbar wieder.
- source_word: τυφλὸς ... τυφλὸν
  choice: ein Blinder ... einen Blinden
  rationale: Die substantivierten maskulinen Singularformen werden formnah und zugleich idiomatisch wiedergegeben; die Aussage hat sprichwörtlich-repräsentative Geltung.
- source_word: ὁδηγεῖν
  choice: führen
  rationale: „Führen“ ist im Deutschen die natürliche Bezeichnung dafür, jemanden auf einem Weg zu leiten, und passt zum Bild.
- source_word: οὐχὶ
  choice: Werden nicht
  rationale: Die Fragepartikel erwartet Zustimmung; die deutsche Negativfrage bewahrt diese rhetorische Kraft.
- source_word: ἀμφότεροι
  choice: beide
  rationale: „Beide“ gibt den Bezug auf genau die zwei genannten Personen präzise und knapp wieder.
- source_word: βόθυνον
  choice: Grube
  rationale: Das Wort bezeichnet eine Grube, Vertiefung oder einen Graben. „Grube“ bewahrt die Breite und Bildhaftigkeit des Ausdrucks.
- source_word: ἐμπεσοῦνται
  choice: werden ... fallen
  rationale: Die futurische Form wird im Deutschen als einfaches Futur wiedergegeben; mit εἰς ergibt sich idiomatisch „in eine Grube fallen“.
theological_decisions:
- issue: Generischer Gebrauch des substantivierten τυφλός
  choice: ein Blinder ... einen Blinden
  alternative: eine blinde Person ... eine blinde Person
  rationale: Der griechische Text verwendet maskuline Singularformen in allgemeiner, sprichwörtlicher Bedeutung. Die Übersetzung wahrt diese Form, ohne die allgemeine Geltung des Ausspruchs auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen und der knappe sprichwörtliche Charakter bleiben erhalten. „Er erzählte“ ist bei einem Gleichnis idiomatischer als das formal mögliche „Er sagte“.
