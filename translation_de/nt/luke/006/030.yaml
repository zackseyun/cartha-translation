  source_fidelity: 'Die Übersetzung gibt die griechischen Imperative treffend wieder: „Gib“ für δίδου, die umfassende Gruppe „jedem, der dich bittet“ für παντὶ αἰτοῦντί σε sowie das Verbot des Zurückforderns für μὴ ἀπαίτει. „Von dem, der dir nimmt, was dir gehört“ bewahrt die bewusst breite, nicht juristisch spezifizierte Bedeutung von ἀπὸ τοῦ αἴροντος τὰ σὰ.'
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und behält zugleich den knappen, parallel gebauten Lehrstil bei. Das anaphorische „es“ ist nach „was dir gehört“ natürlich und verständlich.
  terminology: „Bittet“, „nimmt“, „was dir gehört“ und „fordere es nicht zurück“ sind semantisch angemessen. Insbesondere vermeidet „nimmt“ eine nicht im griechischen Wortlaut festgelegte Einordnung als Diebstahl oder gewaltsame Wegnahme. Eine Fußnote ist nicht erforderlich; die im englischen Audit Trail vermerkte Umstellungsalternative schafft im Deutschen keine relevante Übersetzungsvariante.
