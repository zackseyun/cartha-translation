id: LUK.6.30
reference: Luke 6:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: de
  text: Gib jedem, der dich bittet, und von dem, der dir nimmt, was dir gehört, fordere es nicht zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: jedem, der dich bittet
  rationale: Die distributive Wendung bezeichnet ausnahmslos jeden Bittenden. „Bittet“ gibt αἰτέω natürlich wieder, ohne eine Notlage oder das Betteln vorauszusetzen.
- source_word: δίδου
  choice: Gib
  rationale: Der einfache deutsche Imperativ vermittelt das unmittelbare und grundsätzlich geltende Gebot idiomatisch.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: von dem, der dir nimmt
  rationale: Die Wendung mit αἴρω bezeichnet hier das Wegnehmen dessen, was jemandem gehört, ohne die Handlung rechtlich als Diebstahl näher festzulegen. Das ergänzte „dir“ macht im Deutschen die Beziehung zu „was dir gehört“ klar.
- source_word: τὰ σὰ
  choice: was dir gehört
  rationale: Die substantivierte sächliche Pluralform bedeutet wörtlich „die deinen Dinge“. Die gewählte Formulierung ist natürlich und bewahrt den weiten Bezug.
- source_word: μὴ ἀπαίτει
  choice: fordere es nicht zurück
  rationale: ἀπαιτέω bezeichnet das Zurückfordern oder Einfordern. „Fordere es nicht zurück“ bewahrt die stärkere Nuance gegenüber einem bloßen Bitten und ist idiomatisches Deutsch.
theological_decisions:
- issue: Reichweite und Verbindlichkeit der ethischen Aufforderungen Jesu
  choice: Die beiden Aufforderungen werden als direkte, weit gefasste Gebote wiedergegeben.
  alternative: Die Aussagen als Übertreibung kennzeichnen oder auf Almosen beziehungsweise bestimmte Fälle unrechtmäßiger Wegnahme beschränken.
  rationale: Der griechische Text verwendet direkte Imperative und die umfassende Bezeichnung „jedem“. Die Übersetzung soll die ethische Spannung bewahren und umstrittene Fragen der praktischen Anwendung nicht bereits im Wortlaut entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, knappem Lehrstil. Die Satzstellung bleibt nahe am griechischen Parallelismus, ohne unnatürlich zu wirken.
