  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: de
  text: Sie aber waren von Unvernunft erfüllt[a] und berieten miteinander, was sie mit Jesus tun könnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Torheit erfüllt“ oder „von Raserei erfüllt“. Das griechische Wort kann Unvernunft, Torheit oder einen Verlust vernünftigen Denkens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Sie aber
  rationale: Das betonte Pronomen und δέ setzen die Gegner in einen deutlichen Gegensatz zu Jesus und dem zuvor Geheilten. „Sie aber“ bildet diese Hervorhebung knapp und natürlich ab.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: waren von unvernünftiger Wut erfüllt
  rationale: Die Füllungsmetapher bleibt erhalten. ἄνοια bezeichnet Unverstand, Torheit oder vernunftwidrige Raserei; im feindseligen Kontext verbindet „unvernünftige Wut“ die irrationale und emotionale Seite, ohne einen modernen klinischen Zustand zu unterstellen.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: berieten miteinander
  rationale: Das Imperfekt beschreibt eine fortdauernde gegenseitige Beratung. „Berieten miteinander“ ist im Deutschen idiomatisch und gibt den abwägenden Charakter wieder.
- source_word: τί ἂν ποιήσαιεν
  choice: was sie … antun könnten
  rationale: ἄν mit Optativ drückt in der indirekten Überlegung eine offene Möglichkeit aus. „Könnten“ bewahrt diesen abwägenden Sinn; „antun“ macht im Deutschen die auf Jesus gerichtete, kontextuell feindliche Handlung natürlich verständlich.
- source_word: τῷ Ἰησοῦ
  choice: Jesus
  rationale: Der Dativ bezeichnet die Person, auf die sich das erwogene Handeln richtet. Zusammen mit „antun“ wird er im Deutschen ohne Präposition wiedergegeben.
theological_decisions:
- issue: Ob ἀνοίας als psychische „Raserei“, als moralische „Torheit“ oder als irrationaler Zorn wiederzugeben ist
  choice: unvernünftige Wut
  alternative: Torheit; Wahnsinn; Raserei
  rationale: Die Formulierung wahrt sowohl den Grundgedanken fehlender Vernunft als auch die im Kontext erkennbare heftige Feindseligkeit. Sie vermeidet zugleich eine klinisch-psychologische Festlegung.
- issue: Wie ausdrücklich die feindliche Absicht gegenüber Jesus formuliert werden soll
  choice: was sie Jesus antun könnten
  alternative: was sie mit Jesus tun könnten; was sie gegen Jesus unternehmen könnten
  rationale: Der Kontext zeigt Feindseligkeit, doch der griechische Wortlaut nennt noch keine konkrete Tat. „Antun“ vermittelt die negative Ausrichtung, ohne den Gegenstand ihrer Beratung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während „berieten miteinander“ und „Jesus antun könnten“ natürliches gegenwärtiges Deutsch bieten.
