id: LUK.6.43
reference: Luke 6:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: de
  text: Denn es gibt keinen guten Baum, der faule Früchte hervorbringt, und ebenso wenig einen faulen Baum, der gute Früchte hervorbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlechte Früchte“ / „ein schlechter Baum“. Das griechische Wort kann „verdorben“, „faul“ oder „schlecht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Denn es gibt keinen
  rationale: „Denn“ gibt die erklärende Funktion von γάρ wieder; „es gibt keinen“ bildet die verneinte Existenzaussage natürlich im Deutschen ab.
- source_word: δένδρον καλόν
  choice: guten Baum
  rationale: „Gut“ bewahrt sowohl die konkrete Qualität des Baumes als auch den moralischen Anklang des Bildes.
- source_word: ποιοῦν καρπόν
  choice: Früchte hervorbringt
  rationale: Bei einem Baum ist „Früchte hervorbringen“ idiomatisches Deutsch; der Plural ist als natürliche Kollektivwiedergabe des griechischen Singulars zu verstehen.
- source_word: σαπρόν
  choice: faul
  rationale: „Faul“ erhält das konkrete Bild verdorbener Früchte beziehungsweise eines geschädigten Baumes und lässt zugleich die übertragene negative Wertung erkennen.
- source_word: οὐδὲ πάλιν
  choice: und ebenso wenig
  rationale: Diese Wendung verbindet die zweite Verneinung natürlich mit der ersten und gibt πάλιν hier als entsprechende Gegenrichtung der Aussage wieder.
- source_word: καρπὸν καλόν
  choice: gute Früchte
  rationale: Die Formulierung wahrt den antithetischen Parallelismus zum ersten Satzteil.
theological_decisions:
- issue: Konkrete oder abstrakte Wiedergabe von σαπρός
  choice: „faul“ in beiden Satzhälften
  alternative: „schlecht“
  rationale: „Faul“ bewahrt zunächst das landwirtschaftliche Bild, ohne die moralische Anwendung vorwegnehmend abstrakt festzulegen. Die mögliche Bedeutung „schlecht“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Wiederholung von „hervorbringt“ erhält die ausgewogene Gegenüberstellung des griechischen Satzes; „ebenso wenig“ klingt natürlicher als ein wörtliches „auch wiederum nicht“.
