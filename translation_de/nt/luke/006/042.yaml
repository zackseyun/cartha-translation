id: LUK.6.42
reference: Luke 6:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: de
  text: 'Wie kannst du zu deinem Bruder sagen: »Bruder, lass mich den Splitter aus deinem Auge entfernen«, während du selbst den Balken in deinem eigenen Auge nicht siehst? Du Heuchler! Entferne zuerst den Balken aus deinem eigenen Auge; dann wirst du klar sehen, um den Splitter aus dem Auge deines Bruders zu entfernen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Wie kannst du ... sagen
  rationale: Gibt die rhetorische Frage natürlich und nah am griechischen Wortlaut wieder; sie stellt sowohl Fähigkeit als auch Berechtigung infrage.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: Bruder / Bruder / deines Bruders
  rationale: Bewahrt die maskuline Singularform und die wiederholte Verwandtschaftsbezeichnung des Ausgangstextes, ohne sie interpretierend zu verallgemeinern.
- source_word: ἄφες ἐκβάλω
  choice: lass mich ... entfernen
  rationale: ἄφες leitet hier idiomatisch eine Bitte um Erlaubnis ein; „lass mich“ ist im Deutschen natürlich. „Entfernen“ passt zur Handlung am Auge.
- source_word: κάρφος
  choice: Splitter
  rationale: Bezeichnet ein sehr kleines Stück trockenen Materials. „Splitter“ erzeugt ein anschauliches und verständliches Gegenbild zum großen Balken.
- source_word: δοκός
  choice: Balken
  rationale: Bezeichnet ein großes Bauholz; „Balken“ bildet die drastische Übertreibung und den Größenkontrast zu κάρφος präzise ab.
- source_word: αὐτός ... οὐ βλέπων
  choice: während du selbst ... nicht siehst
  rationale: „selbst“ erhält die emphatische Gegenüberstellung; der Nebensatz gibt das griechische Partizip in natürlichem Deutsch wieder.
- source_word: ὑποκριτά
  choice: Du Heuchler!
  rationale: Gibt den singularischen Vokativ als direkte, scharfe Anrede wieder; das ergänzte „Du“ ist im modernen Deutschen idiomatisch.
- source_word: διαβλέψεις
  choice: wirst du klar sehen
  rationale: Bewahrt gegenüber dem einfachen βλέπω die verstärkte Bedeutung eines deutlichen oder klaren Sehens.
- source_word: ἐκβάλω / ἔκβαλε / ἐκβαλεῖν
  choice: entfernen / entferne / zu entfernen
  rationale: Eine einheitliche, in der Augenmetapher natürliche Wiedergabe; das wörtlichere „hinauswerfen“ wäre hier im Deutschen unidiomatisch.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung ἀδελφός
  choice: Bruder
  alternative: Mitmensch; Bruder oder Schwester
  rationale: Der griechische Text spricht durchgehend im maskulinen Singular. Die Übersetzung bewahrt diese Form, ohne die mögliche weitere Anwendung der Lehre im Text selbst festzulegen.
- issue: Bildlicher Gegensatz zwischen κάρφος und δοκός
  choice: Splitter ... Balken
  alternative: Stäubchen ... Baumstamm; Span ... Balken
  rationale: „Splitter ... Balken“ erhält die absichtliche groteske Größensteigerung und bleibt zugleich anschaulich, würdig und in modernem Deutsch verständlich.
- issue: Bedeutung von διαβλέπω im abschließenden Satz
  choice: klar sehen
  alternative: richtig sehen; hindurchsehen
  rationale: Der Kontext legt wiedergewonnene deutliche Wahrnehmung nahe. Die Formulierung hält das konkrete Augenbild und seine ethische Bedeutung zusammen, ohne Letztere auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die Wiederholung von „Bruder“, „Auge“, „Splitter“ und „Balken“ bleibt als tragende Struktur des Spruchs erhalten. Keine Fußnoten sind nötig, da „Splitter“ und „Balken“ die griechischen Bilder hinreichend präzise und natürlich wiedergeben.
