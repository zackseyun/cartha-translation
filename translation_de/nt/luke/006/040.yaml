  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: de
  text: Ein Jünger[a] steht nicht über seinem Lehrer. Doch jeder wird, wenn er vollständig ausgebildet[b] ist, wie sein Lehrer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüler“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vollständig zugerüstet“ beziehungsweise „vorbereitet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: Jünger
  rationale: „Jünger“ bewahrt den persönlichen, prägenden Bezug eines Lernenden zu seinem Lehrer; „Schüler“ wäre möglich, klingt jedoch stärker nach einem schulischen Verhältnis.
- source_word: ὑπὲρ
  choice: über
  rationale: Mit dem Akkusativ bezeichnet ὑπέρ hier einen höheren Rang oder eine übergeordnete Stellung. „Über jemandem stehen“ gibt diesen Vergleich im Deutschen knapp und idiomatisch wieder.
- source_word: διδάσκαλος
  choice: Lehrer
  rationale: „Lehrer“ ist die naheliegende und verständliche Entsprechung und vermeidet zusätzliche Bedeutungsanteile, die „Meister“ mit sich bringen könnte.
- source_word: κατηρτισμένος
  choice: vollständig ausgebildet
  rationale: Das Perfektpartizip Passiv bezeichnet jemanden, der durch einen abgeschlossenen Vorgang zugerüstet bzw. ausgebildet worden ist. Im Zusammenhang von Jünger und Lehrer trifft „vollständig ausgebildet“ den pädagogischen Sinn, ohne die mögliche Bedeutung „zugerüstet“ zu verschweigen.
- source_word: πᾶς
  choice: jeder
  rationale: Das maskuline Singularwort wird in diesem allgemeinen Lehrsatz generisch gebraucht. „Jeder“ wahrt sowohl die Allgemeingültigkeit als auch die grammatische Einzahl.
- source_word: ὡς
  choice: wie
  rationale: ὡς leitet hier einen Vergleich ein; „wie“ ist dafür die natürliche deutsche Entsprechung.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Pronomen bezieht sich in der generisch maskulinen Einzahl auf „jeder“ zurück. „Sein Lehrer“ erhält diese formale Beziehung im Deutschen.
theological_decisions:
- issue: Aussage über das Verhältnis von Jünger und Lehrer
  choice: „steht nicht über seinem Lehrer“
  alternative: „ist nicht größer als sein Lehrer“
  rationale: Die räumlich-rangbezogene Formulierung lässt offen, ob vor allem Rang, Autorität oder Entwicklungsstand gemeint ist, und löst die Spannung des Spruchs nicht einseitig auf.
- issue: Generisches Maskulinum im Lehrspruch
  choice: „jeder … sein Lehrer“
  alternative: „alle … ihre Lehrkraft“
  rationale: Die gewählte Form bewahrt die griechische Einzahl und den unmittelbaren Rückbezug des Possessivpronomens, während „jeder“ im modernen Deutschen weiterhin allgemein verstanden werden kann.
- issue: Bedeutung von κατηρτισμένος
  choice: „vollständig ausgebildet“
  alternative: „vollständig zugerüstet“
  rationale: Der Zusammenhang mit Jünger und Lehrer legt Ausbildung nahe; eine Fußnote hält die breitere Bedeutung des Verbs sichtbar, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der sprichwortartige Parallelismus bleibt erhalten; die beiden kurzen Sätze erleichtern das Verständnis, ohne die logische Gegenüberstellung abzuschwächen.
