  source_fidelity: Die erste Aussage gibt οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον treffend wieder. In der zweiten Aussage verbindet der griechische Text den Zustand des Vollausgebildetseins mit dem zukünftigen Ergebnis (ἔσται). Die Umschreibung als Relativsatz („jeder, der ... ist, wird“) ist möglich, kann aber leichter eine bereits abgegrenzte Personengruppe nahelegen. Eine temporale Wiedergabe bildet den Sinn und die Satzbewegung genauer ab.
