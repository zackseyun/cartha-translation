  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: de
  text: 'Er sah sie alle an und sagte zu ihm: »Streck deine Hand aus!« Er tat es, und seine Hand wurde wiederhergestellt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde geheilt«. Das Griechische lautet wörtlich: »wurde wiederhergestellt« und betont die Rückkehr in einen angemessenen Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Nachdem er … ringsum angesehen hatte
  rationale: Das Partizip Aorist bezeichnet hier eine der Aufforderung vorausgehende Handlung. Die Formulierung gibt sowohl den zeitlichen Ablauf als auch den Rundblick natürlich wieder.
- source_word: πάντας αὐτούς
  choice: sie alle
  rationale: Bewahrt die Betonung, dass Jesu Blick sämtliche Anwesenden erfasste, ohne den Personenkreis über den griechischen Text hinaus näher zu bestimmen.
- source_word: εἶπεν αὐτῷ
  choice: sagte er zu ihm
  rationale: Eine direkte und sachliche Wiedergabe von λέγω mit Dativ; sie fügt der Art des Sprechakts keine zusätzliche Deutung hinzu.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Streck deine Hand aus!
  rationale: Der Imperativ wird als unmittelbare Aufforderung wiedergegeben; χείρ bedeutet in diesem Zusammenhang konkret „Hand“.
- source_word: ὁ δὲ ἐποίησεν
  choice: Er tat es
  rationale: ποιέω nimmt die unmittelbar zuvor verlangte Handlung auf. Das nur leicht weiterführende δέ braucht im natürlichen deutschen Erzählfluss keine eigene adversative Markierung.
- source_word: ἀπεκατεστάθη
  choice: wurde wiederhergestellt
  rationale: Das Passiv von ἀποκαθίστημι bezeichnet die Rückversetzung in den richtigen beziehungsweise früheren Zustand. „Wiederhergestellt“ bewahrt diesen Aspekt genauer als das deutendere „geheilt“.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: seine Hand
  rationale: Die Wiederholung von „Hand“ entspricht der ausdrücklichen Wiederaufnahme im Griechischen und hebt das Ergebnis des Geschehens hervor.
theological_decisions:
- issue: Art der Wunderbeschreibung in ἀπεκατεστάθη
  choice: 'Wiederherstellungssprache: „seine Hand wurde wiederhergestellt“'
  alternative: „seine Hand wurde geheilt“ oder „seine Hand wurde wieder gesund“
  rationale: Der griechische Ausdruck betont die Rückkehr zum richtigen Zustand, ohne ausdrücklich einen medizinischen Begriff zu verwenden. Die gewählte Fassung erhält diese Nuance und lässt die Heilungsbedeutung dennoch klar erkennen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am griechischen Ablauf; „ringsum angesehen“ ist idiomatisch und erhält das Bild des prüfenden Rundblicks.
