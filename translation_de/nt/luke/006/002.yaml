  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes sachgerecht wieder: die eingeschränkte Gruppe („Einige der Pharisäer“), den mild-kontrastierenden Anschluss δέ („aber“), den einfachen erzählenden Sprechakt und die vorwurfsvolle Frage. „Warum tut ihr“ ist eine idiomatisch angemessene Wiedergabe von Τί ποιεῖτε in diesem Kontext. „Am Sabbat“ gibt den idiomatischen griechischen Plural τοῖς σάββασιν korrekt im natürlichen deutschen Singular wieder.'
