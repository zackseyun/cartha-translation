source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: de
  text: 'Einige der Pharisäer aber sagten: »Warum tut ihr, was am Sabbat nicht erlaubt ist?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: Einige
  rationale: Bezeichnet unbestimmt einen Teil der Pharisäer, nicht die gesamte Gruppe.
- source_word: δὲ
  choice: aber
  rationale: Markiert den leichten Gegensatz beziehungsweise die konfrontative Wendung gegenüber dem vorherigen Geschehen.
- source_word: τῶν Φαρισαίων
  choice: der Pharisäer
  rationale: Die im Deutschen übliche Bezeichnung der jüdischen Gruppe.
- source_word: εἶπαν
  choice: sagten
  rationale: Der Aorist stellt den Sprechakt schlicht als Ereignis dar.
- source_word: Τί ποιεῖτε
  choice: Warum tut ihr
  rationale: Wörtlich steht »Was tut ihr«, doch im Zusammenhang leitet die Wendung eine vorwurfsvolle Frage nach dem Grund des Handelns ein; »Warum tut ihr« gibt ihre Funktion natürlich wieder.
- source_word: ὃ οὐκ ἔξεστιν
  choice: was … nicht erlaubt ist
  rationale: Bewahrt den Sinn dessen, was nach religiösem Gesetz oder anerkannter Ordnung nicht gestattet ist, in natürlichem modernem Deutsch.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist eine geläufige idiomatische Bezeichnung für den Sabbat. Im Deutschen ist der Singular »am Sabbat« die natürliche Entsprechung.
theological_decisions:
- issue: Wiedergabe der Sabbatformel
  choice: am Sabbat
  alternative: an den Sabbaten
  rationale: Obwohl τοῖς σάββασιν formal Plural ist, wird der Ausdruck idiomatisch für den Sabbattag beziehungsweise die Sabbatordnung gebraucht. Der deutsche Singular gibt diesen Sinn natürlich wieder, ohne eine Mehrzahl einzelner Sabbate eigens zu betonen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung »Einige der Pharisäer aber« erhält den milden Kontrast des griechischen δέ, ohne altertümlich zu wirken. Die direkte Rede ist als unmittelbar vorgebrachter Vorwurf formuliert.
