  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: de
  text: Die Schriftgelehrten und die Pharisäer beobachteten ihn genau[a], um zu sehen, ob er am Sabbat heilen würde, damit sie einen Anlass fänden, ihn anzuklagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „behielten ihn scharf im Auge“. Das griechische Verb kann ein genaues, hier aufgrund des Zusammenhangs feindseliges Beobachten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglich auch: „damit sie etwas fänden, um ihn anzuklagen“ oder: „damit sie ihn anklagen könnten“. Gemeint ist die Suche nach einem Anlass für eine Anklage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: beobachteten ihn genau
  rationale: Der Imperfekt bezeichnet ein fortdauerndes Beobachten; im Zusammenhang mit der beabsichtigten Anklage trägt das Verb den Beiklang angespannter, feindseliger Aufmerksamkeit. Das Objekt „ihn“ ergibt sich aus dem Kontext.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Dies ist die etablierte und sachlich passende deutsche Bezeichnung für die mit Auslegung und Anwendung der heiligen Schriften befasste Gruppe.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Die übliche deutsche Wiedergabe der Gruppenbezeichnung.
- source_word: εἰ
  choice: um zu sehen, ob
  rationale: Nach einem Verb des Beobachtens gibt diese Formulierung die indirekte Frage im Deutschen natürlich und präzise wieder.
- source_word: ἐν τῷ σαββάτῳ
  choice: am Sabbat
  rationale: „Am Sabbat“ ist die idiomatische deutsche Zeitangabe und bewahrt den Singular des griechischen Textes.
- source_word: θεραπεύει
  choice: heilen würde
  rationale: Das griechische Präsens steht in einer indirekten Frage; aus der Perspektive der vergangenen Erzählung ist der deutsche Konjunktiv II mit Zukunftsbezug natürlich.
- source_word: ἵνα εὕρωσιν
  choice: So wollten sie … finden
  rationale: Die Formulierung bringt die Zielabsicht der ἵνα-Konstruktion in gegenwärtigem, flüssigem Deutsch zum Ausdruck.
- source_word: κατηγορεῖν αὐτοῦ
  choice: einen Grund finden, ihn anzuklagen
  rationale: In Verbindung mit „finden“ bezeichnet der Ausdruck die Suche nach einem Anlass oder einer Grundlage für eine Anklage; die Wiedergabe macht diese im Griechischen angelegte Beziehung verständlich.
theological_decisions:
- issue: Absicht der Schriftgelehrten und Pharisäer
  choice: Ihr Beobachten wird als gezielte Suche nach einem Anklagegrund wiedergegeben.
  alternative: Eine neutralere Wiedergabe könnte lediglich sagen, sie hätten beobachtet, ob Jesus heile.
  rationale: Das Verb für genaues Beobachten erhält durch den ausdrücklichen Zwecksatz eine feindselige Ausrichtung. Die Übersetzung macht diese im Vers selbst erkennbare Absicht deutlich, ohne darüber hinausgehende Motive zuzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Schriftgelehrte“, „Pharisäer“ und „Sabbat“ bleiben als geläufige biblische Sachbezeichnungen erhalten. Der griechische Zweckzusammenhang wird zur besseren deutschen Lesbarkeit in einem zweiten Satz wiedergegeben.
