  terminology: „Maß“, „festgedrückt“, „gerüttelt“, „überfließend“ und „zugemessen“ bewahren die Bildsprache und das Wortspiel. „Im Gegenzug“ gibt die reziproke Nuance von ἀντι- wieder, ohne den nicht genannten Handelnden zu bestimmen.
