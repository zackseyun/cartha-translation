  variant: modern standard German
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: de
  text: 'Gebt, und euch wird gegeben werden: Man wird euch ein gutes Maß – festgedrückt, gerüttelt und überfließend – in euren Gewandbausch[a] geben. Denn mit dem Maß, mit dem ihr messt, wird euch im Gegenzug zugemessen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der „Gewandbausch“ war die nach vorn gezogene Falte des Obergewands, in die man eine abgemessene Menge schütten konnte; sinngemäß: „in euren Schoß“.'
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Gebt
  rationale: Der präsentische Imperativ Plural formuliert eine allgemeine, fortdauernd gültige Aufforderung. „Gebt“ ist im Deutschen natürlich, ohne den Aspekt durch „Gebt immer wieder“ übermäßig zu verdeutlichen.
- source_word: δοθήσεται ὑμῖν
  choice: dann wird euch gegeben werden
  rationale: Das Futur Passiv mit Dativ wird formal und verständlich wiedergegeben; „dann“ macht den im καί liegenden Folgezusammenhang natürlich deutlich.
- source_word: μέτρον καλὸν
  choice: ein gutes Maß
  rationale: „Maß“ bewahrt sowohl die gemessene Menge als auch das Bild des Messgefäßes. „Gut“ bleibt semantisch offen und fügt nicht ausdrücklich die Deutung „großzügig“ hinzu.
- source_word: πεπιεσμένον
  choice: festgedrückt
  rationale: Das Partizip beschreibt den Inhalt eines Gefäßes, der zusammengedrückt wird, damit möglichst viel hineinpasst.
- source_word: σεσαλευμένον
  choice: geschüttelt
  rationale: Gemeint ist das Schütteln des Gefäßes, durch das sich sein Inhalt setzt. Das knappe „geschüttelt“ erhält die anschauliche Reihung.
- source_word: ὑπερεκχυννόμενον
  choice: überfließend
  rationale: Das präsentische Partizip bezeichnet eine so große Füllung, dass der Inhalt über den Rand tritt.
- source_word: δώσουσιν
  choice: wird man ... geben
  rationale: Der unbestimmte Plural der dritten Person wird im Deutschen idiomatisch mit „man“ wiedergegeben, ohne den Handelnden festzulegen oder die Formulierung vollständig ins Passiv umzuwandeln.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: in den Gewandbausch
  rationale: κόλπος bezeichnet hier wahrscheinlich den durch das hochgenommene Obergewand gebildeten Bausch, in dem Waren aufgenommen werden konnten. „Gewandbausch“ bewahrt das historische Bild genauer als das moderne „Schoß“; eine Fußnote erläutert es.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Denn mit dem Maß, mit dem ihr messt
  rationale: Die Wiederholung von „Maß“ und „messt“ erhält das prägnante Wortspiel und die Metapher des Messens.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: wird euch im Gegenzug zugemessen werden
  rationale: „Im Gegenzug“ gibt die durch ἀντί bezeichnete Gegenseitigkeit ausdrücklich wieder; „zugemessen“ hält die Maß-Metapher aufrecht.
theological_decisions:
- issue: Ob die Aufforderung ausschließlich auf Geld oder Almosen zu beziehen ist
  choice: Die allgemeine Sprache des Gebens und des entsprechenden Zumessens bleibt erhalten.
  alternative: Die Aussage ausdrücklich als Verheißung materieller oder finanzieller Vergeltung wiedergeben.
  rationale: Der unmittelbare Zusammenhang umfasst Barmherzigkeit, Nichtverurteilen, Vergebung und Geben. Der griechische Text beschränkt das Geben nicht ausdrücklich auf Geld und rechtfertigt daher weder eine rein finanzielle noch eine Wohlstandsdeutung.
- issue: Wer das Gute zurückgibt
  choice: Der Handelnde bleibt mit „man“ unbestimmt.
  alternative: Gott ausdrücklich als Handelnden nennen oder den Satz vollständig passiv formulieren.
  rationale: δώσουσιν ist ein aktiver unbestimmter Plural. Die Übersetzung soll die mögliche theologische Implikation nicht dadurch auflösen, dass sie einen im Text nicht genannten Handelnden einsetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Maß-Metaphorik. Die Reihung „festgedrückt, geschüttelt und überfließend“ bleibt anschaulich und rhythmisch. Der unbestimmte griechische Plural wird idiomatisch durch „man“ ausgedrückt; der kulturell präzisere „Gewandbausch“ wird in einer Fußnote erläutert.
