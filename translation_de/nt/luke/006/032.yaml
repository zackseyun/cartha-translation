source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: de
  text: 'Und wenn ihr die liebt, die euch lieben: Was für eine Anerkennung ist das für euch?[a] Denn auch die Sünder lieben die, die sie lieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Welche Gnade ist das für euch?“ Das griechische Wort kann „Gnade“, „Gunst“, „Dank“ oder „Anerkennung“ bedeuten; hier geht es um den Vorzug oder die Anerkennung, die darin liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: liebt / lieben
  rationale: Die einheitliche Wiedergabe mit „lieben“ bewahrt die dreifache Wiederholung und damit die rhetorische Verbindung im griechischen Text.
- source_word: ποία
  choice: welche
  rationale: „Welche Anerkennung“ gibt die qualitative Frage idiomatisch wieder, ohne sie unnötig zu erweitern.
- source_word: χάρις
  choice: Anerkennung
  rationale: Im Zusammenhang bezeichnet χάρις das Lobenswerte beziehungsweise die dafür gebührende Anerkennung, nicht vorrangig die heilsgeschichtliche „Gnade“. Die Fußnote hält die lexikalische Weite offen.
- source_word: ἁμαρτωλοὶ
  choice: die Sünder
  rationale: Die substantivierte Bezeichnung wird direkt und in der neutestamentlich geläufigen Form wiedergegeben.
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „auch“ gibt das einschließende beziehungsweise steigernde καί natürlich wieder.
- source_word: ὑμῖν
  choice: ihr ... dafür
  rationale: Der Dativ wird in der deutschen Wendung „welche Anerkennung verdient ihr dafür?“ idiomatisch aufgenommen.
theological_decisions:
- issue: Bedeutung von χάρις in Jesu Aussage
  choice: Anerkennung im Sinn dessen, was lobenswert ist
  alternative: Gnade; Dank; Gunst
  rationale: Der unmittelbare Zusammenhang fragt danach, was daran besonders oder anerkennenswert ist, nur Menschen zu lieben, die diese Liebe erwidern. Zugleich wird die mögliche Wiedergabe „Gnade“ in der Fußnote bewahrt, damit die Bedeutungsbreite nicht verschwiegen wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Frage und die dreifache Wiederholung von „lieben“ bleiben erhalten.
