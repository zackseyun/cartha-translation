source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Ich frage euch: Ist es am Sabbat erlaubt, Gutes zu tun oder Böses zu tun[a], ein Leben[b] zu retten oder es zu vernichten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schaden zuzufügen“. Das griechische Wort steht im ethischen Gegensatz zu „Gutes tun“ und kann böses beziehungsweise schädigendes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Seele zu retten oder sie zu vernichten“. „Leben“ ist hier gewählt, weil der Zusammenhang die Rettung oder Vernichtung menschlichen Lebens betrifft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Markiert den leichten Gegensatz und den Übergang zu Jesu Reaktion, ohne den Zusammenhang zu überzeichnen.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Ich frage euch
  rationale: Gibt die direkte, herausfordernde Frage in natürlichem modernem Deutsch wieder.
- source_word: εἰ ἔξεστιν
  choice: Ist es ... erlaubt
  rationale: Bewahrt den rechtlich-ethischen Sinn dessen, was am Sabbat zulässig ist; im Deutschen klingt dies natürlicher als „ist es gesetzlich“.
- source_word: τῷ σαββάτῳ
  choice: am Sabbat
  rationale: Idiomatiche Wiedergabe des Dativs der Zeit und klare Bezeichnung des betreffenden Tages.
- source_word: ἀγαθοποιῆσαι
  choice: Gutes zu tun
  rationale: Bewahrt den ausdrücklichen ethischen Gegensatz zum folgenden κακοποιῆσαι.
- source_word: κακοποιῆσαι
  choice: Böses zu tun
  rationale: Gibt die ethische Polarität von ἀγαθοποιῆσαι und κακοποιῆσαι unmittelbar wieder; „Schaden zuzufügen“ wäre im Heilungskontext ebenfalls möglich.
- source_word: ψυχὴν
  choice: ein Leben
  rationale: Bezeichnet hier im Zusammenhang von Rettung und Vernichtung konkret das menschliche Leben, ohne eine Aussage über einen vom Körper getrennten Seelenteil einzutragen.
- source_word: σῶσαι
  choice: zu retten
  rationale: Bewahrt sowohl den konkreten Sinn der Lebensrettung als auch die breitere biblische Wortverbindung.
- source_word: ἀπολέσαι
  choice: es zu vernichten
  rationale: Spiegelt den starken Gegensatz zu „retten“ und bleibt weiter als das enger deutende „töten“.
theological_decisions:
- issue: Bedeutung von ψυχή in ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: „ein Leben zu retten oder es zu vernichten“
  alternative: „eine Seele zu retten oder sie zu vernichten“; „einen Menschen zu retten oder zu vernichten“
  rationale: Der unmittelbare Zusammenhang der Sabbatheilung betrifft die Bewahrung oder Schädigung menschlichen Lebens. „Leben“ erhält diese konkrete ethische Stoßrichtung, ohne eine besondere anthropologische Lehre festzulegen.
- issue: Ethische Reichweite von κακοποιῆσαι
  choice: „Böses zu tun“
  alternative: „Schaden zuzufügen“
  rationale: Die griechische Gegenüberstellung ist ausdrücklich ethisch und kann sowohl böses als auch konkret schädigendes Handeln bezeichnen. Der Haupttext wahrt die formale Polarität; die Fußnote nennt die kontextuell konkrete Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Infinitivpaare bilden die zugespitzte ethische Frage des griechischen Textes nach; „am Sabbat“ und „ist es erlaubt“ sind allgemein verständlich und kontextgerecht.
