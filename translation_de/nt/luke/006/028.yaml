  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: de
  text: Segnet die, die euch verfluchen; betet für die, die euch schlecht behandeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Segnet
  rationale: Der Imperativ Plural wird direkt und idiomatisch wiedergegeben. „Segnen“ bewahrt den bewussten Gegensatz zu „verfluchen“ und umfasst mehr als bloß wohlwollendes Reden.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: die, die euch verfluchen
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die Flüche gegen die Angesprochenen aussprechen. Die Relativkonstruktion ist im modernen Deutsch klar und erhält die aktive feindselige Handlung.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Der Imperativ Plural gibt die Aufforderung natürlich wieder. Der präsentische Aspekt kann eine fortdauernde Haltung nahelegen, muss im Deutschen aber nicht eigens ausgedrückt werden.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: für die, die euch misshandeln
  rationale: περί steht beim Beten im Sinn von „für“. ἐπηρεάζω kann feindselige Behandlung, Beschimpfung oder Missbrauch bezeichnen; „misshandeln“ gibt die breite feindselige Behandlung knapp wieder, ohne sie ausschließlich auf Worte zu beschränken.
theological_decisions:
- issue: Reichweite der Gebote zur Feindesliebe
  choice: Die beiden Aufforderungen werden ohne erklärende Einschränkung als direkte ethische Gebote wiedergegeben.
  alternative: Eine bestimmte Lehre über Grenzen, Motive oder praktische Anwendung der Gebote in den Text einzutragen.
  rationale: Der griechische Text formuliert knappe, spannungsvolle Imperative. Die Übersetzung soll diese Zumutung bewahren, ohne konfessionelle oder systematische Deutungen hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „Segnet …; betet …“ und der Gegensatz zwischen Segnen und Verfluchen bleiben deutlich erhalten.
