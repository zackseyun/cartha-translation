  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: de
  text: Simon, dem er auch den Namen Petrus gab, und dessen Bruder Andreas, Jakobus und Johannes, Philippus und Bartholomäus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Simon
  rationale: „Simon“ ist die im deutschen Neuen Testament eingebürgerte Form des Namens Σίμων für diesen Apostel.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: dem er auch den Namen Petrus gab
  rationale: Die Formulierung gibt den Benennungsakt von ὀνομάζω klar und in natürlichem Deutsch wieder; das καί wird als „auch“ bewahrt.
- source_word: Πέτρον
  choice: Petrus
  rationale: „Petrus“ ist die etablierte deutsche Namensform von Πέτρος.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: dessen Bruder Andreas
  rationale: Die Wendung bezeichnet Andreas als leiblichen Bruder Simons. „Dessen“ macht den Bezug auf Simon eindeutig und folgt natürlichem deutschen Ausdruck.
- source_word: Ἰάκωβον
  choice: Jakobus
  rationale: „Jakobus“ ist die traditionelle und weiterhin geläufige deutsche neutestamentliche Namensform.
- source_word: Ἰωάννην
  choice: Johannes
  rationale: „Johannes“ ist die etablierte deutsche Form von Ἰωάννης.
- source_word: Φίλιππον
  choice: Philippus
  rationale: „Philippus“ ist die etablierte deutsche biblische Namensform von Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Bartholomäus
  rationale: „Bartholomäus“ ist die etablierte deutsche Form von Βαρθολομαῖος.
- source_word: καὶ
  choice: und
  rationale: In der Aufzählung verbindet καί die Namen. Natürliches Deutsch benötigt nicht vor jedem einzelnen Namen ein wiederholtes „und“, ohne dass sich die inhaltliche Zuordnung ändert.
