id: LUK.6.49
reference: Luke 6:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: de
  text: Wer aber hört und nicht danach handelt, gleicht einem Mann, der ein Haus ohne Fundament auf den Erdboden baute. Der Fluss prallte dagegen, und sofort stürzte es ein. Der Einsturz jenes Hauses war gewaltig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Der Bruch jenes Hauses war groß.“ Das griechische Wort kann einen Bruch, Riss oder die aus dem Zusammenbrechen hervorgehende Zerstörung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Wer aber hört und nicht danach handelt
  rationale: Das substantivierte Partizip wird im Deutschen natürlich mit einem verallgemeinernden Relativsatz wiedergegeben. Das Präsens wahrt den sprichwortartigen Vergleich; „danach handelt“ macht den Bezug auf Jesu Worte verständlich, ohne das ausführlichere „sie in die Tat umsetzt“ einzutragen.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: gleicht einem Mann
  rationale: „Gleicht“ ist eine knappe, natürliche Vergleichsformel. „Mann“ bewahrt die maskuline Singularfigur des griechischen Beispiels.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: der ein Haus ohne Fundament auf den Erdboden baute
  rationale: „Erdboden“ bezeichnet hier die Baufläche, nicht die Welt als Ganze. Die Stellung von „ohne Fundament“ hebt den entscheidenden Mangel hervor.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Der Fluss prallte dagegen
  rationale: προσρήγνυμι bezeichnet ein heftiges Auftreffen. „Dagegen“ nimmt den Bezug des Relativpronomens auf das Haus natürlich auf.
- source_word: καὶ εὐθὺς συνέπεσεν
  choice: und sofort stürzte es ein
  rationale: συμπίπτω bezeichnet beim Haus den Einsturz; εὐθύς wird mit „sofort“ ausdrücklich bewahrt.
- source_word: καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: Der Einsturz jenes Hauses war gewaltig
  rationale: ῥῆγμα kann Bruch, Riss oder die durch das Zusammenbrechen entstandene Zerstörung bezeichnen. „Einsturz“ passt zum unmittelbaren Kontext, während „gewaltig“ das μέγα idiomatisch wiedergibt.
theological_decisions:
- issue: Repräsentative maskuline Sprache im Vergleich
  choice: einem Mann
  alternative: einem Menschen
  rationale: ἀνθρώπῳ kann allgemein „Mensch“ bedeuten, bezeichnet hier jedoch die einzelne Figur des Vergleichs. „Einem Mann“ bewahrt die maskuline Singulargestalt, ohne die allgemeine Anwendung des Gleichnisses einzuschränken.
- issue: Bezug des Nicht-Tuns
  choice: nicht danach handelt
  alternative: es nicht tut / Jesu Worte nicht in die Tat umsetzt
  rationale: Der unmittelbare Zusammenhang bezieht ποιέω auf Jesu Worte. „Danach handelt“ verdeutlicht diesen Bezug knapp, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, knappem Gleichnisstil. Die Satzfolge wurde gegenüber der langen griechischen Periode gegliedert, ohne die Abfolge von Bau, Aufprall und Einsturz zu verändern.
