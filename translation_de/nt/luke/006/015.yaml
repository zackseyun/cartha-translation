source:
  edition: SBLGNT
  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: de
  text: und Matthäus und Thomas, und Jakobus, den Sohn des Alphäus, und Simon, der Zelot[a] genannt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Eiferer“. Der griechische Beiname kann eine eifrige Person bezeichnen und setzt für sich genommen nicht voraus, dass Simon einer bestimmten politischen Gruppierung angehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die Namen des Apostelverzeichnisses. Im Deutschen wird sie dort beibehalten, wo sie den Aufzählungsstil natürlich wiedergibt.
- source_word: Μαθθαῖον
  choice: Matthäus
  rationale: Die im modernen Standarddeutsch übliche Form des Personennamens.
- source_word: Θωμᾶν
  choice: Thomas
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Jakobus, den Sohn des Alphäus
  rationale: Der Genitiv Ἁλφαίου bezeichnet in dieser Namensformel am wahrscheinlichsten die Abstammung. Die Ergänzung „Sohn“ macht die Beziehung in natürlichem Deutsch deutlich.
- source_word: Σίμωνα
  choice: Simon
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: τὸν καλούμενον
  choice: der … genannt wurde
  rationale: Der attributive passive Partizipialausdruck wird idiomatisch als Relativsatz wiedergegeben und kennzeichnet Simons Beinamen.
- source_word: Ζηλωτὴν
  choice: Zelot
  rationale: „Zelot“ gibt den identifizierenden Beinamen knapp und traditionsgemäß wieder. Eine Fußnote wahrt die Möglichkeit, dass das griechische Wort allgemeiner „Eiferer“ bedeutet.
theological_decisions:
- issue: Ob Ζηλωτής eine formale politische Zugehörigkeit oder lediglich einen beschreibenden Beinamen bezeichnet
  choice: „Zelot“ als Beiname, ohne weitere historische Festlegung
  alternative: „Eiferer“ als rein beschreibender Beiname
  rationale: Das griechische Wort lässt einen identifizierenden Beinamen erkennen, entscheidet aber für sich allein nicht, ob Simon einer bestimmten politischen Gruppierung angehörte. Die Fußnote hält diese Unschärfe offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bleibt knapp und katalogartig; unnötig schwerfällige Wiederholungen werden vermieden. Der Fußnotenmarker steht unmittelbar bei dem erklärten Beinamen.
