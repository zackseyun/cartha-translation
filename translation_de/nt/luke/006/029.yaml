source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: de
  text: Wer dich auf die Wange[a] schlägt, dem halte auch die andere hin; und wer dir den Mantel[b] wegnimmt, dem halte auch das Untergewand nicht zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Kiefer“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Mantel“ (ἱμάτιον) ist das äußere Kleidungsstück, das „Untergewand“ (χιτών) das darunter getragene.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: Wer dich … schlägt, dem
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein die handelnde Person. Die deutsche Wer-dem-Konstruktion gibt diesen Bezug natürlich und präzise wieder.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: auf die Wange
  rationale: σιαγών kann Wange oder Kiefer bedeuten. Im Zusammenhang eines Schlages ins Gesicht ist „Wange“ im Deutschen die natürliche Entsprechung; die anatomische Alternative bleibt in einer Fußnote erhalten.
- source_word: πάρεχε
  choice: halte … hin
  rationale: παρέχω bedeutet hier darbieten oder hinhalten. „Halte … hin“ bewahrt Lukas’ Aufforderung, die andere Wange darzubieten, ohne den Wortlaut des Matthäusevangeliums mit dessen Verb für „wenden“ zu übernehmen.
- source_word: καὶ τὴν ἄλλην
  choice: auch die andere
  rationale: Das ausgelassene Bezugswort „Wange“ ist aus dem ersten Satzteil eindeutig; „auch“ bildet καί ab und erhält die Parallelität.
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: wer dir den Mantel wegnimmt, dem
  rationale: αἴρω bezeichnet hier das Wegnehmen. Die deutsche Wer-dem-Konstruktion bildet den substantivierten Partizipialausdruck samt ἀπό idiomatisch ab.
- source_word: τὸ ἱμάτιον
  choice: den Mantel
  rationale: ἱμάτιον bezeichnet das äußere Kleidungsstück. „Mantel“ ist eine klare, geläufige deutsche Wiedergabe und hält den Unterschied zum inneren χιτών fest.
- source_word: τὸν χιτῶνα
  choice: das Untergewand
  rationale: χιτών bezeichnet das unter dem Mantel getragene Kleidungsstück. „Untergewand“ macht die sachliche Unterscheidung für heutige Leser unmittelbar verständlich und vermeidet das historisch markierte Fremdwort „Tunika“.
- source_word: μὴ κωλύσῃς
  choice: verweigere … nicht
  rationale: κωλύω bedeutet hindern oder abhalten. Im Kontext der Wegnahme von Kleidung drückt „nicht verweigern“ idiomatisch aus, dass auch das Untergewand nicht zurückgehalten werden soll.
theological_decisions:
- issue: Ob Lukas’ Formulierung an das bekanntere „die andere Wange hinhalten/auch hinhalten“ aus der matthäischen Überlieferung angeglichen werden soll
  choice: 'Lukas’ eigenes Verb als Aufforderung zum Darbieten wiedergeben: „dem halte auch die andere hin“'
  alternative: „dem wende auch die andere zu“ oder eine ausdrückliche Angleichung an Matthäus
  rationale: Der griechische Text hat πάρεχε („darbieten, hinhalten“), nicht ein Verb für „wenden“. Die Übersetzung bleibt deshalb bei Lukas’ eigener Formulierung.
- issue: Ob die Imperative durch Erklärungen zu Gewaltlosigkeit, Übertreibung oder rechtlicher Geltung eingeschränkt werden sollen
  choice: Die Aufforderungen unmittelbar und ohne einschränkende Zusätze wiedergeben
  alternative: Im Haupttext deutende Einschränkungen oder Qualifikationen ergänzen
  rationale: Der Ausgangstext formuliert direkte Imperative. Ihre ethische und theologische Spannung soll nicht bereits durch die Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Wer-dem-Konstruktionen vermeiden schwerfällige substantivierte Partizipien. „Hinhalten“ ist idiomatisch, bleibt aber näher an Lukas’ πάρεχε als eine Wiedergabe mit „zuwenden“. Alle Fußnotenmarker stehen unmittelbar bei ihrem Bezug im Haupttext.
