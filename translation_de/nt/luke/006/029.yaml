  source_fidelity: 'Der erste Satzteil gibt τῷ τύπτοντί ... πάρεχε καὶ τὴν ἄλλην treffend wieder: „auf die Wange“, „halte ... hin“ und „auch die andere“ bewahren Lukas’ vom matthäischen „wenden“ abweichende Formulierung. Im zweiten Satzteil ist „verweigere ... nicht“ zwar kontextuell verständlich, verschiebt μὴ κωλύσῃς jedoch von „nicht hindern/zurückhalten“ zu einem Akt des Verweigerns. „Halte ... nicht zurück“ bildet den griechischen Sinn genauer ab.'
  naturalness: Die Wer-dem-Konstruktionen und „die andere“ sind modernes, würdiges Standarddeutsch. „Halte ihm auch das Untergewand nicht zurück“ ist idiomatisch und macht klar, dass der Betroffene die Wegnahme nicht hindern soll.
  terminology: „Mantel“ für ἱμάτιον und „Untergewand“ für χιτών unterscheiden die beiden Kleidungsstücke sachgerecht. Die Fußnote erläutert diese Unterscheidung angemessen. „Wange“ ist die natürliche Hauptwiedergabe von σιαγών; „Kiefer“ bleibt als lexikalische Alternative vermerkt.
