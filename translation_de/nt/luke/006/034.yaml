source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: de
  text: Und wenn ihr denen leiht, von denen ihr erwartet, etwas zurückzubekommen, welche Anerkennung bringt euch das?[a] Auch Sünder leihen Sündern, um den gleichen Betrag zurückzuerhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Welchen Dank habt ihr davon?« Das griechische Wort χάρις kann hier auch »Dank« bedeuten; wahrscheinlich geht es in diesem Zusammenhang um Anerkennung oder günstige Beurteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: leiht / leihen
  rationale: Das Verb bezeichnet das Leihen von Geld oder Gütern. »Leihen« ist die natürliche deutsche Entsprechung und legt weder Zins noch Gewinn nahe.
- source_word: παρ’ ὧν
  choice: denen …, von denen
  rationale: 'Die Formulierung bildet im Deutschen idiomatisch beide Beziehungen ab: Man leiht jemandem etwas und erwartet die Rückgabe von dieser Person.'
- source_word: ἐλπίζετε λαβεῖν
  choice: erwartet, etwas zurückzubekommen
  rationale: ἐλπίζω kann »hoffen« oder »erwarten« bedeuten; im Zusammenhang einer vorausgesetzten Gegenleistung passt »erwarten« besser. »Zurückzubekommen« macht den durch den Kontext gegebenen Rückbezug verständlich, ohne die Art der Rückzahlung näher festzulegen.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: welche Anerkennung verdient ihr dafür?
  rationale: χάρις bezeichnet hier wahrscheinlich Anerkennung beziehungsweise günstige Beurteilung, nicht die rettende Gnade als theologischen Fachbegriff. Die rhetorische Frage wird in natürlichem Deutsch wiedergegeben; die mögliche Bedeutung »Dank« bleibt in der Fußnote erhalten.
- source_word: ἁμαρτωλοὶ
  choice: Sünder
  rationale: Das substantivierte Adjektiv bezeichnet Menschen unter der moralischen Kategorie »Sünder« und wird direkt und traditionsverständlich wiedergegeben.
- source_word: ἵνα ἀπολάβωσιν
  choice: um … zurückzuerhalten
  rationale: ἀπολαμβάνω hat hier den Sinn, etwas als Gegenleistung oder Rückgabe wiederzuerhalten.
- source_word: τὰ ἴσα
  choice: den gleichen Betrag
  rationale: Der Ausdruck bezeichnet eine gleichwertige Rückgabe. Im Kontext des Leihens ist »der gleiche Betrag« idiomatisch und vermeidet die unbelegte Annahme von Zinsen oder Gewinn.
theological_decisions:
- issue: Bedeutung von χάρις in Jesu rhetorischer Frage
  choice: Als verdiente Anerkennung wiedergegeben, nicht als rettende Gnade.
  alternative: »Welchen Dank habt ihr davon?« oder wörtlicher »Welche Gnade ist euch zuteil?«
  rationale: Der unmittelbare Zusammenhang fragt danach, was am Verhalten der Jünger gegenüber dem Verhalten von Sündern anerkennenswert anders ist. Da χάρις jedoch auch »Dank« bedeuten kann, wird diese echte lexikalische Alternative in einer Fußnote bewahrt.
- issue: Art der erwarteten Gegenleistung beim Leihen
  choice: Neutral als Rückgabe des gleichen Betrags wiedergegeben.
  alternative: Rückzahlung mit Zins oder Gewinn
  rationale: τὰ ἴσα bezeichnet Gleichwertigkeit und bietet keinen hinreichenden Grund, Zinsen, Wucher oder Gewinn in den Text einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Anrede im Plural bleibt durchgehend bei »ihr«. Die wirtschaftliche Sprache bleibt allgemein und wird nicht durch Begriffe wie »Kredit«, »Zins« oder »Gewinn« überpräzisiert.
