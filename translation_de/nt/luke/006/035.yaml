id: LUK.6.35
reference: Luke 6:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: de
  text: Doch liebt eure Feinde und tut Gutes und leiht, ohne etwas zurückzuerwarten[a]. Dann wird euer Lohn groß sein, und ihr werdet Söhne des Höchsten sein[b], denn er ist gütig zu den Undankbaren und Bösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »ohne an jemandem zu verzweifeln« oder »ohne je die Hoffnung aufzugeben«. Die griechische Wendung ist schwierig; hier wird sie im Zusammenhang des Leihens auf die erwartete Rückgabe bezogen.'
    reason: lexical_alternative
  - marker: b
    text: »Söhne« gibt den maskulinen Plural des griechischen Ausdrucks wieder und kann hier einen repräsentativen Sinn haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum zuvor beschriebenen wechselseitigen Verhalten und klingt im modernen Deutschen natürlich.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: liebt eure Feinde
  rationale: Gibt Imperativ und Objekt direkt wieder und bewahrt die herausfordernde Schärfe des Gebots.
- source_word: ἀγαθοποιεῖτε
  choice: tut Gutes
  rationale: Eine natürliche deutsche Wiedergabe, die das aktive Wohltun ausdrückt.
- source_word: δανίζετε
  choice: leiht
  rationale: Gibt das Verb ohne die im Griechischen nicht ausdrücklich genannte Einschränkung auf Geld wieder.
- source_word: μηδὲν ἀπελπίζοντες
  choice: ohne etwas zurückzuerwarten
  rationale: Im Zusammenhang des Leihens bezeichnet die schwierige Wendung am ehesten den Verzicht auf die Erwartung einer Rückgabe; eine abweichende Deutung wird in der Fußnote bewahrt.
- source_word: μισθὸς ... πολύς
  choice: Lohn ... groß
  rationale: Bewahrt den Gedanken einer Vergeltung beziehungsweise Belohnung in knapper, würdiger Sprache.
- source_word: υἱοὶ Ὑψίστου
  choice: Söhne des Höchsten
  rationale: Gibt den ausdrücklich maskulinen griechischen Plural und den traditionellen Gottesnamen formal genau wieder.
- source_word: χρηστός
  choice: gütig
  rationale: Drückt hier Gottes tätige Güte gegenüber Menschen aus, die sie nicht verdienen.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: den Undankbaren und Bösen
  rationale: Gibt beide substantivisch gebrauchten Adjektive klar und ohne Abschwächung wieder.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von υἱοὶ Ὑψίστου
  choice: Söhne des Höchsten
  alternative: Kinder des Höchsten
  rationale: Der Ausgangstext verwendet ausdrücklich das maskuline υἱοί. Die Hauptübersetzung bewahrt diese Form; die mögliche repräsentative Reichweite wird in einer Fußnote erläutert.
- issue: Deutung von μηδὲν ἀπελπίζοντες
  choice: ohne etwas zurückzuerwarten
  alternative: an niemandem verzweifelnd / niemals die Hoffnung aufgebend
  rationale: Der unmittelbare Kontext von Leihen und Gegenseitigkeit spricht für den Verzicht auf erwartete Rückgabe. Da die griechische Wendung schwierig ist, bleibt die andere Deutung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die koordinierte Folge der Imperative bleibt erhalten; das einleitende »Doch« markiert den Kontrast. Die genuine Mehrdeutigkeit der schwierigen Partizipialwendung wird nicht im Haupttext überladen, sondern durch Fußnote offengehalten.
