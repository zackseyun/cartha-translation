id: LUK.6.19
reference: Luke 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: de
  text: Und die ganze Menschenmenge versuchte, ihn zu berühren, denn Kraft ging von ihm aus und heilte sie alle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menschenmenge
  rationale: Die Verbindung aus πᾶς und dem kollektiven Singular ὄχλος bezeichnet die gesamte versammelte Menge. „Die ganze Menschenmenge“ ist im modernen Deutsch klar und bewahrt den kollektiven Sinn.
- source_word: ἐζήτουν
  choice: versuchte
  rationale: Das Imperfekt beschreibt ein andauerndes beziehungsweise wiederholtes Bemühen. Der Singular entspricht dem kollektiven Subjekt „Menschenmenge“; „versuchte“ gibt den kontextuellen Sinn natürlicher wieder als das wörtlichere „suchte“.
- source_word: ἅπτεσθαι
  choice: ihn zu berühren
  rationale: ἅπτομαι bezeichnet hier die körperliche Berührung Jesu in der Erwartung von Heilung. „Berühren“ ist präzise und idiomatisch.
- source_word: δύναμις
  choice: Kraft
  rationale: δύναμις bezeichnet hier wirksame, heilende Kraft. „Kraft“ bewahrt die knappe Ausdrucksweise des Griechischen, ohne das im Kontext erkennbare Wunderwirken ausdrücklich hinzuzufügen.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: ging von ihm aus
  rationale: Die deutsche Wendung „von jemandem ausgehen“ gibt das fortdauernde Hervorgehen der Kraft aus Jesus idiomatisch und anschaulich wieder.
- source_word: ἰᾶτο πάντας
  choice: heilte sie alle
  rationale: Das Imperfekt ἰᾶτο beschreibt das fortdauernde Heilen. „Sie alle“ nimmt den im Deutschen erforderlichen Bezug auf die Menschen in der Menge natürlich auf.
theological_decisions:
- issue: Art der von Jesus ausgehenden δύναμις
  choice: „Kraft ging von ihm aus“ ohne zusätzliche dogmatische Erläuterung
  alternative: „Wunderkraft ging von ihm aus“
  rationale: Der Text stellt Jesus unmittelbar als Quelle wirksamer Heilkraft dar. Die Übersetzung bewahrt diese Aussage, fügt aber das nur aus dem Zusammenhang erschlossene Attribut „Wunder-“ nicht in den Haupttext ein.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf; „ging von ihm aus“ ist gegenüber einem mechanischen „kam aus ihm heraus“ idiomatischer.
