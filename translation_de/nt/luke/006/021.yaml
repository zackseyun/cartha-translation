source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: de
  text: Selig seid ihr, die ihr jetzt hungert[a], denn ihr werdet satt werden[b]. Selig seid ihr, die ihr jetzt weint, denn ihr werdet lachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Selig sind, die jetzt hungern … Selig sind, die jetzt weinen.“ Im Griechischen stehen substantivierte Partizipien; die Verheißungen in der zweiten Person Plural und der unmittelbare Zusammenhang sprechen jedoch für eine direkte Anrede.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ihr werdet gesättigt werden.“ Das Verb kann das Sattwerden durch Nahrung und darüber hinaus umfassende Erfüllung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Selig
  rationale: „Selig“ bewahrt die prägnante Form und das theologische Gewicht der Seligpreisung. „Glücklich“ könnte zu sehr einen gegenwärtigen Gefühlszustand bezeichnen, „vom Glück begünstigt“ klänge zu weltlich.
- source_word: οἱ πεινῶντες
  choice: ihr, die ihr … hungert
  rationale: Der griechische Ausdruck besteht aus Artikel und Partizip („die Hungernden“). Die Verben der Verheißung stehen jedoch in der zweiten Person Plural; zusammen mit dem unmittelbaren Kontext legt dies eine direkte Anrede nahe.
- source_word: πεινῶντες
  choice: hungert
  rationale: Das Präsenspartizip bezeichnet einen anhaltenden Zustand. „Hungert“ ist knapp und natürlich, ohne die Stärke durch „verhungert“ oder „am Verhungern seid“ zu überzeichnen.
- source_word: νῦν
  choice: jetzt
  rationale: „Jetzt“ gibt den zeitlichen Gegensatz zwischen gegenwärtiger Not und künftiger Umkehr unmittelbar wieder.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier den Grund der Seligpreisung ein. „Denn“ ist in dieser feierlichen Aussage natürlich und bewahrt den begründenden Zusammenhang.
- source_word: χορτασθήσεσθε
  choice: ihr werdet satt werden
  rationale: Das Futur Passiv von χορτάζω bezeichnet besonders das Sattwerden durch Nahrung, kann aber auch umfassende Erfüllung ausdrücken. „Satt werden“ erhält das konkrete Bild und lässt den weiteren Sinn offen.
- source_word: οἱ κλαίοντες
  choice: ihr, die ihr … weint
  rationale: Wie bei οἱ πεινῶντες wird das substantivierte Partizip aufgrund der Verheißung in der zweiten Person und des Kontexts als direkte Anrede wiedergegeben.
- source_word: κλαίοντες
  choice: weint
  rationale: κλαίω bezeichnet Weinen oder Klagen. „Weint“ ist konkret und würdevoll; „trauert“ würde den Sinn unnötig auf Trauer um Verstorbene oder einen bestimmten Verlust verengen.
- source_word: γελάσετε
  choice: ihr werdet lachen
  rationale: γελάω bedeutet unmittelbar „lachen“. Die konkrete Formulierung bewahrt die anschauliche Umkehr; „euch freuen“ wäre deutender und weniger bildhaft.
theological_decisions:
- issue: Direkte Anrede oder allgemeine Seligpreisung in der dritten Person
  choice: 'Direkte Anrede: „Selig seid ihr, die ihr …“'
  alternative: „Selig sind, die jetzt hungern …“
  rationale: Die griechischen Subjekte sind zwar substantivierte Partizipien, doch die Verheißungen stehen in der zweiten Person Plural. Die direkte Anrede entspricht daher dem Satzbau und dem Kontext, ohne die mögliche formale Lesart zu verschweigen.
- issue: Art und Zeitpunkt der verheißenen Umkehr
  choice: Die konkreten Bilder „satt werden“ und „lachen“ bleiben ohne nähere zeitliche oder geistliche Festlegung stehen.
  alternative: Die Verheißungen ausdrücklich als geistliche Erfüllung oder ausschließlich als endzeitliche Umkehr auslegen.
  rationale: Der Vers verheißt eine Umkehr, bestimmt hier aber weder deren genaue Gestalt noch ihren Zeitpunkt. Die Übersetzung erhält diese theologische Offenheit.
- issue: Mögliches göttliches Handeln im Passiv χορτασθήσεσθε
  choice: „ihr werdet satt werden“
  alternative: „ihr werdet gesättigt werden“
  rationale: Die gewählte Formulierung lässt offen, wer die Sättigung bewirkt, und legt ein mögliches göttliches Passiv nicht ausdrücklich aus. Zugleich klingt sie im heutigen Deutsch natürlicher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten und prägnanten Seligpreisungsformel „Selig seid ihr“. Die konkreten Gegensätze „hungern/satt werden“ und „weinen/lachen“ bleiben erhalten; Deutungen über Zeitpunkt und Art der Erfüllung werden nicht in den Haupttext eingetragen.
