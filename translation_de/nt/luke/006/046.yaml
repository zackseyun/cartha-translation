id: LUK.6.46
reference: Luke 6:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: de
  text: Warum nennt ihr mich »Herr, Herr«[a] und tut nicht, was ich sage?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meister, Meister«. Griechisch: kýrie, kýrie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Warum
  rationale: Τί fragt in dieser Verbindung idiomatisch nach dem Grund. »Warum« gibt die vorwurfsvolle Frage im Deutschen natürlich wieder.
- source_word: δέ
  choice: —
  rationale: δέ ist hier ein schwaches Bindewort. Der Zusammenhang trägt seine weiterführende beziehungsweise leicht kontrastierende Funktion auch ohne ein ausdrückliches »aber« oder »und«.
- source_word: με
  choice: mich
  rationale: Direktes Objekt zu καλεῖτε; die Entsprechung ist eindeutig.
- source_word: καλεῖτε
  choice: nennt ihr
  rationale: Das Präsens Aktiv, zweite Person Plural, bezeichnet hier die Anrede beziehungsweise Benennung Jesu. »Nennt ihr mich« ist im Deutschen natürlicher als »ruft ihr mich«.
- source_word: Κύριε κύριε
  choice: Herr, Herr!
  rationale: Der doppelte Vokativ wird zur Wahrung von Nachdruck und rhetorischem Kontrast wiederholt. »Herr« bewahrt sowohl die Anrede als auch das mögliche christologische Gewicht.
- source_word: καὶ οὐ
  choice: und … nicht
  rationale: Die griechische Beiordnung wird bewahrt und stellt das Bekenntnis mit dem fehlenden Gehorsam kontrastierend zusammen.
- source_word: ποιεῖτε
  choice: tut
  rationale: ποιέω bezeichnet hier das Ausführen beziehungsweise Befolgen dessen, was Jesus sagt. »Tun, was jemand sagt« ist knapp, verständlich und quellennah.
- source_word: ἃ
  choice: was
  rationale: Das neutrale Relativpronomen im Plural bezieht sich gesammelt auf den Inhalt von Jesu Worten; idiomatisches Deutsch verwendet hier »was«.
- source_word: λέγω
  choice: ich sage
  rationale: Die schlichte Wiedergabe vermeidet den Zusatz eines im Griechischen nicht ausdrücklich vorhandenen indirekten Objekts wie in »euch sage«.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede und möglicher christologischer Titel
  choice: Herr
  alternative: Meister
  rationale: »Herr« ist die direkte traditionelle und semantisch breite Entsprechung, die respektvolle Anrede und christologisches Gewicht offenhält. »Meister« ist kontextuell möglich, würde das Bedeutungsspektrum jedoch stärker auf Autorität als Lehrer verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Der vorwurfsvolle rhetorische Charakter und die Wiederholung der Anrede bleiben erhalten; das Ausrufezeichen innerhalb der Anrede markiert deren eindringlichen Ruf, ohne die Gesamtfrage aufzulösen.
