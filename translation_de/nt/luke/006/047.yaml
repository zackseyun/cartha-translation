id: LUK.6.47
reference: Luke 6:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: de
  text: Jeder, der zu mir kommt, meine Worte hört und sie tut – ich will euch zeigen, wem er gleicht:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die maskuline Singularform „er“ steht hier allgemein für jeden Menschen, der zu Jesus kommt, seine Worte hört und sie tut.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Jeder, der zu mir kommt
  rationale: Die Verbindung aus πᾶς und substantiviertem Partizip bezeichnet allgemein jeden Menschen, auf den das Folgende zutrifft. „Zu mir kommt“ gibt die Bewegung auf Jesus hin natürlich wieder.
- source_word: ἀκούων μου τῶν λόγων
  choice: meine Worte hört
  rationale: μου τῶν λόγων wird im Zusammenhang am natürlichsten als „meine Worte“ verstanden. „Hört“ bewahrt die knappe Parallelität mit „tut“.
- source_word: ποιῶν αὐτούς
  choice: sie tut
  rationale: ποιεῖν bezeichnet hier das Tun beziehungsweise Befolgen der gehörten Worte. Die konkrete Formulierung „sie tut“ bleibt nahe am griechischen Ausdruck und bereitet das folgende Gleichnis vor.
- source_word: ὑποδείξω ὑμῖν
  choice: ich will euch zeigen
  rationale: Das Futur kündigt an, dass Jesus den Vergleich nun veranschaulichen wird. „Ich will euch zeigen“ ist im Deutschen natürlich und würdevoll.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: wem er gleicht
  rationale: Die Dativkonstruktion mit ὅμοιος wird im Deutschen direkt und idiomatisch mit „jemandem gleichen“ wiedergegeben; „wem er gleicht“ bewahrt zugleich die persönliche Vergleichsfigur.
theological_decisions:
- issue: Generisches Maskulinum im Singular
  choice: „Jeder, der …; wem er gleicht“
  alternative: „Alle, die …; wem sie gleichen“ oder „wer …; wem diese Person gleicht“
  rationale: Die griechischen Partizipien und ὅμοιος stehen im maskulinen Singular, beziehen sich jedoch allgemein auf jeden Menschen. Der deutsche repräsentative Singular erhält diese Form, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Wortfolge „kommt, … hört und … tut“ erhält die dreigliedrige Bewegung des griechischen Satzes; der Gedankenstrich markiert den Übergang zur angekündigten Veranschaulichung.
