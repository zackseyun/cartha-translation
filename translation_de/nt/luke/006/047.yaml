  source_fidelity: 'Der Entwurf gibt die generische Dreierfolge πᾶς ὁ ἐρχόμενος ... καὶ ἀκούων ... καὶ ποιῶν präzise wieder: „Jeder, der zu mir kommt, meine Worte hört und sie tut“. Das Futur ὑποδείξω ist mit „ich will euch zeigen“ zutreffend erfasst. „Wem er gleicht“ bildet τίνι ἐστὶν ὅμοιος als deutsche Vergleichskonstruktion genau und idiomatisch ab; die persönliche Vergleichsform wird durch den folgenden Vers bestätigt.'
  naturalness: Modernes, klares Standarddeutsch mit angemessen würdigem biblischem Register. Die Reihung „kommt, ... hört und ... tut“ ist verständlich und bewahrt bewusst die knappe Ausdrucksweise des Ausgangstextes. Der Gedankenstrich gliedert den Satz natürlich.
  terminology: „Worte“, „hört“, „tut“ und „gleicht“ sind konsistent, quellennah und im Kontext theologisch nicht überdeutet. Das generische „Jeder ... er“ gibt den maskulinen Singular des Griechischen als repräsentativen Singular wieder, ohne die Aussage sachlich auf Männer zu begrenzen.
