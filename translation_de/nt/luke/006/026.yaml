source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: de
  text: Wehe euch, wenn alle Menschen gut von euch reden! Denn genauso gingen ihre Vorfahren mit den falschen Propheten um.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihre Väter; gemeint sind frühere Generationen ihres Volkes.'
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Wehe euch
  rationale: „Wehe“ bewahrt den prophetischen Warn- und Gerichtscharakter. Das ergänzte „euch“ macht im Deutschen den bereits durch ὑμᾶς bezeichneten Adressaten natürlich deutlich.
- source_word: ὅταν
  choice: wenn
  rationale: „Wenn“ gibt die allgemeine, auf mögliche künftige Fälle bezogene Bedingung idiomatisch wieder.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: gut von euch reden
  rationale: Die Wendung bezeichnet anerkennendes oder positives Reden über jemanden. „Gut von euch reden“ ist im Deutschen natürlich und lässt offen, ob es sich um Lob, Zustimmung oder eine günstige Beurteilung handelt.
- source_word: πάντες οἱ ἄνθρωποι
  choice: alle Menschen
  rationale: Die Formulierung gibt den generischen Plural vollständig wieder und vermeidet eine männlich verengte Lesart.
- source_word: κατὰ τὰ αὐτά
  choice: genauso
  rationale: „Genauso“ bringt die Gleichartigkeit des Verhaltens knapp und idiomatisch zum Ausdruck.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende Verbindung zur vorangehenden Weheruf-Aussage.
- source_word: ἐποίουν
  choice: machten es
  rationale: In Verbindung mit „genauso“ ist „machten es“ die natürliche deutsche Wiedergabe. Der durative beziehungsweise wiederholte Charakter des Imperfekts ergibt sich aus dem Vergleich mit dem Verhalten früherer Generationen.
- source_word: τοῖς ψευδοπροφήταις
  choice: mit den falschen Propheten
  rationale: Beim deutschen Ausdruck „es genauso mit jemandem machen“ gibt „mit“ die auf diese Personen gerichtete Behandlung idiomatisch wieder.
- source_word: οἱ πατέρες αὐτῶν
  choice: ihre Vorfahren
  rationale: Gemeint sind frühere Generationen ihres Volkes. „Vorfahren“ ist im heutigen Deutsch klarer als das missverständliche wörtliche „Väter“; eine Fußnote erhält die konkrete griechische Ausdrucksweise.
theological_decisions:
- issue: Sinn des Vergleichs mit den falschen Propheten
  choice: Der Vers warnt davor, dass einhellige menschliche Anerkennung dem Muster entspricht, nach dem frühere Generationen falsche Propheten behandelten.
  alternative: Jede positive Äußerung anderer Menschen wird ohne Einschränkung verurteilt.
  rationale: γάρ und κατὰ τὰ αὐτά begründen den Weheruf durch einen geschichtlichen Vergleich. Die Übersetzung lässt dessen Warnkraft stehen, macht daraus aber kein ausdrückliches Verbot jeder Anerkennung.
translation_notes:
  register: Modernes, klares Standarddeutsch mit feierlichem Warncharakter. Der Ausrufesatz unterstreicht die Kraft des Weherufs, ohne den Wortlaut auszuschmücken.
