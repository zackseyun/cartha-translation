revisions:
- from: Wehe euch, wenn alle Menschen gut von euch reden! Denn genauso machten es ihre Vorfahren[a] mit den falschen Propheten.
  to: Wehe euch, wenn alle Menschen gut von euch reden! Denn genauso gingen ihre Vorfahren mit den falschen Propheten um.[a]
  rationale: Die Revision ersetzt allein die vage Wendung „machten es ... mit“ durch die idiomatische und klarere Formulierung „gingen ... mit ... um“. Der geschichtliche Vergleich, die Mehrdeutigkeit hinsichtlich der konkreten Art der positiven Behandlung und die Warnfunktion des Verses bleiben erhalten. Der Fußnotenanker wird an die Aussage über die Vorfahren gesetzt, auf die sich die Anmerkung bezieht.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:23:02Z'
review_pass:
  verdict: revise
  source_fidelity: Der Weheruf, die allgemeine Bedingung („wenn“), die universale Aussage („alle Menschen“), das positive Reden über die Angeredeten und der begründende Vergleich mit der Behandlung falscher Propheten sind zutreffend wiedergegeben. Die Aussage über die Väter/Vorfahren bleibt zu Recht als geschichtlicher Vergleich formuliert und wird nicht zu einer allgemeinen Verurteilung jeder Anerkennung ausgeweitet. „Machten es ... mit“ ist jedoch semantisch recht unbestimmt; eine klarere deutsche Wiedergabe des auf die falschen Propheten gerichteten Handelns ist vorzuziehen.
  naturalness: „Wehe euch“ und „gut von euch reden“ sind natürliches, zugleich angemessen feierliches Standarddeutsch. „Denn genauso machten es ihre Vorfahren mit den falschen Propheten“ ist zwar verständlich, wirkt aber elliptisch und umgangssprachlich-vage. „Gingen ... mit ... um“ ist idiomatischer und präziser.
  terminology: „Falsche Propheten“ ist die etablierte und genaue Wiedergabe von ψευδοπροφήταις. „Vorfahren“ ist als heutiges Deutsch verständlich; die Fußnote sichert die wörtliche Formulierung „ihre Väter“ ab, ohne den Text unnötig archaisch zu machen.
  issues:
  - severity: low
    issue: Unklare Wiedergabe von ἐποίουν ... τοῖς ψευδοπροφήταις
    rationale: Die Formulierung „machten es ... mit den falschen Propheten“ lässt offen, was genau getan wurde, und klingt im Deutschen weniger präzise. „Gingen ... mit den falschen Propheten um“ gibt das gegen diese Personen gerichtete Verhalten klar und idiomatisch wieder, ohne den Inhalt des Vergleichs auszudeuten.
  revised_text: Wehe euch, wenn alle Menschen gut von euch reden! Denn genauso gingen ihre Vorfahren mit den falschen Propheten um.[a]
