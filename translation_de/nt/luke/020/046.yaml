source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: de
  text: Hütet euch vor den Schriftgelehrten, die gern in langen Gewändern umhergehen und es lieben, auf den Marktplätzen ehrerbietig gegrüßt zu werden[a], sowie die Ehrenplätze in den Synagogen und bei Festessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Grüße auf den Marktplätzen lieben«; gemeint sind öffentliche, ehrenvolle Begrüßungen, die gesellschaftliche Anerkennung ausdrücken.'
    reason: cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Hütet euch vor
  rationale: Die idiomatische deutsche Warnformel bewahrt den Imperativ Plural und die abwehrende Bedeutung der griechischen Konstruktion.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Der etablierte deutsche Ausdruck bezeichnet im Evangelienkontext Fachleute für Auslegung und Anwendung der heiligen Schriften, ohne den Begriff unnötig auszuweiten.
- source_word: τῶν θελόντων περιπατεῖν ἐν στολαῖς
  choice: die gern in langen Gewändern umhergehen
  rationale: „Gern“ gibt die willentliche Vorliebe von θελόντων natürlich wieder; στολή bezeichnet hier ein langes, repräsentatives Gewand.
- source_word: φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: es lieben, auf den Marktplätzen ehrerbietig gegrüßt zu werden
  rationale: Die Grüße gelten den Schriftgelehrten und verleihen öffentlich Anerkennung. „Ehrerbietig“ macht diese kontextuelle Funktion deutlich, ohne einen bestimmten Grußwortlaut festzulegen.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: in den Synagogen die Ehrenplätze
  rationale: Der Ausdruck bezeichnet Sitze mit Vorrang und Ansehen, nicht lediglich räumlich günstige Plätze.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: bei Festessen die vornehmsten Plätze
  rationale: πρωτοκλισία meint besonders angesehene Liege- beziehungsweise Tischplätze. Die funktionale Wiedergabe ist für heutige Leser verständlich und vermeidet ein unpassendes antikes Möbelbild.
theological_decisions:
- issue: Umfang der Kritik an den Schriftgelehrten
  choice: Die Warnung nennt „die Schriftgelehrten“ und charakterisiert die Gemeinten unmittelbar durch ihr statusorientiertes Verhalten.
  alternative: Die Aussage ausdrücklich auf einige Schriftgelehrte beschränken oder pauschal jeden einzelnen Schriftgelehrten verurteilen.
  rationale: Der bestimmte griechische Ausdruck bleibt erhalten, während die folgenden Partizipien den Gegenstand der Kritik benennen. Die Übersetzung fügt weder eine Einschränkung auf „einige“ noch eine weitergehende Verurteilung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt weitgehend erhalten; bei den öffentlichen Grüßen wird die im Kontext vorausgesetzte Ehrbezeugung transparent gemacht. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
