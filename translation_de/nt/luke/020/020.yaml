source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: de
  text: Nachdem sie ihn genau beobachtet hatten, schickten sie Spitzel aus, die vorgaben, gerecht zu sein, um ihn bei einer Aussage zu fangen[a] und ihn so der Herrschaft und Vollmacht des Statthalters auszuliefern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „damit sie ein Wort von ihm ergreifen könnten“; gemeint ist, ihn aufgrund einer Äußerung zu fassen oder zu belangen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Regierungsgewalt und Vollmacht des Statthalters“. Die beiden Begriffe betonen zusammen dessen amtliche Zuständigkeit und Machtbefugnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: sie beobachteten ihn genau
  rationale: Das Partizip bezeichnet aufmerksame, hier feindselige Beobachtung. Im Deutschen verbindet die finite Form den Vorgang natürlich mit dem Aussenden der Spitzel.
- source_word: ἐγκαθέτους
  choice: Spitzel
  rationale: Das Wort bezeichnet heimlich eingesetzte Personen, die jemanden in eine Falle locken sollen. „Spitzel“ gibt den verdeckten und feindseligen Auftrag prägnant wieder.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: die sich den Anschein gaben, gerecht zu sein
  rationale: Die Formulierung bewahrt sowohl die bewusste Täuschung als auch das moralisch-religiöse Gewicht von δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: Sie sollten ihn bei einer Äußerung festhalten
  rationale: Die Wendung beschreibt den Versuch, Jesus aufgrund einer Aussage zu fassen beziehungsweise zu belangen. Die etwas bildhafte Formulierung hält die Nähe zum griechischen „ein Wort ergreifen“ aufrecht.
- source_word: ὥστε παραδοῦναι
  choice: um ihn so … auszuliefern
  rationale: „So“ drückt die beabsichtigte Folge der sprachlichen Falle aus; „ausliefern“ passt zum gerichtlichen und feindseligen Kontext.
- source_word: τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ
  choice: der Regierungsgewalt und der Vollmacht
  rationale: Die zweigliedrige Wiedergabe bewahrt die Unterscheidung und zugleich die Verstärkung zwischen Herrschaftsbereich und rechtlich wirksamer Befugnis.
- source_word: τοῦ ἡγεμόνος
  choice: des Statthalters
  rationale: Im römischen Provinzkontext bezeichnet ἡγεμών den zuständigen Statthalter; dieser Ausdruck ist im Deutschen präzise und geläufig.
theological_decisions:
- issue: Wiedergabe von δίκαιος bei vorgetäuschter moralischer Stellung
  choice: gerecht
  alternative: rechtschaffen
  rationale: „Gerecht“ bewahrt die moralisch-religiöse Bedeutung und die Verbindung zum neutestamentlichen Begriffsfeld, ohne die Aussage auf bloße Ehrbarkeit zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Spitzel“ ist klar und idiomatisch; „bei einer Äußerung festhalten“ bewahrt bewusst etwas von der Bildhaftigkeit des griechischen Ausdrucks. Beide Fußnotenmarker stehen an den jeweils erläuterten Stellen im Haupttext.
