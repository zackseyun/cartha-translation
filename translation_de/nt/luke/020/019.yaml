    issue: „wollten“ für ἐζήτησαν
    rationale: „Wollten“ bezeichnet überwiegend Absicht. ἐζήτησαν mit Infinitiv bringt hier zum Ausdruck, dass sie danach trachteten bzw. versuchten, Jesus zu ergreifen. „Suchten“ wahrt diese Handlungstendenz, ohne einen Erfolg zu behaupten.
  - severity: low
