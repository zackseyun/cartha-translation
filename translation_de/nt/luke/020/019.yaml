revisions:
- from: Und die Schriftgelehrten und die führenden Priester wollten noch in derselben Stunde Hand an ihn legen[a], doch sie fürchteten das Volk. Denn sie hatten erkannt, dass er dieses Gleichnis gegen sie[b] erzählt hatte.
  to: Und die Schriftgelehrten und die Hohen Priester suchten in eben dieser Stunde Hand an ihn zu legen[a], aber sie fürchteten das Volk. Denn sie erkannten, dass er dieses Gleichnis gegen sie[b] erzählt hatte.
  rationale: Die Revision stärkt die Wiedergabe des gezielten Vorgehens in ἐζήτησαν, ersetzt die erklärende Umschreibung von ἀρχιερεῖς durch den etablierten quellen- und kontextnahen Titel „Hohe Priester“ und glättet Zeitangabe sowie Erzählzeitform. Die konfrontative, kontextuell starke Bedeutung von πρὸς αὐτούς bleibt im Haupttext erhalten; die Fußnote bewahrt die formal weniger bestimmte Alternative.
