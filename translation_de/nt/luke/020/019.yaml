  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: de
  text: Und die Schriftgelehrten und die Hohen Priester suchten in eben dieser Stunde Hand an ihn zu legen[a], aber sie fürchteten das Volk. Denn sie erkannten, dass er dieses Gleichnis gegen sie[b] erzählt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn ergreifen“ oder „ihn festnehmen“; wörtlich: „die Hände auf ihn legen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu ihnen“ beziehungsweise „auf sie bezogen“. Der Zusammenhang legt nahe, dass das Gleichnis gegen sie gerichtet war.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: wollten
  rationale: Der Aorist bezeichnet hier ihr unmittelbar aufkommendes Vorhaben. „Wollten“ gibt die Absicht natürlich wieder, ohne zu behaupten, dass sie erfolgreich handelten.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Die geläufige und historisch passende Bezeichnung für die mit Auslegung und Anwendung der Schriften befasste Gruppe.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet im Evangelienkontext die führende priesterliche Schicht und nicht mehrere gleichzeitig amtierende Hohepriester. Die Wiedergabe ist für heutige Leser klar.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: Hand an ihn legen
  rationale: Die deutsche Wendung bewahrt das griechische Bild und vermittelt den feindseligen Zugriff, ohne ihn enger als förmliche Verhaftung festzulegen.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: noch in derselben Stunde
  rationale: Bewahrt die betonte Unmittelbarkeit des griechischen Ausdrucks und verbindet die beabsichtigte Handlung mit dem eben erzählten Gleichnis.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: sie fürchteten das Volk
  rationale: λαός meint hier die Bevölkerung beziehungsweise das Volk, nicht nur eine zufällig versammelte Menschenmenge.
- source_word: ἔγνωσαν
  choice: sie hatten erkannt
  rationale: Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass ihre Erkenntnis den Grund für ihr Vorhaben bildete; „erkannt“ gibt den Moment des Begreifens passend wieder.
- source_word: πρὸς αὐτούς
  choice: gegen sie
  rationale: Im unmittelbaren Kontext erkannten die Führenden sich als Ziel der verurteilenden Aussage. „Gegen sie“ gibt diese konfrontative Kraft wieder, während die Fußnote die formal mögliche offenere Wiedergabe nennt.
- source_word: παραβολήν
  choice: Gleichnis
  rationale: „Gleichnis“ ist die etablierte und sachlich passende deutsche Bezeichnung für παραβολή in den synoptischen Evangelien.
theological_decisions:
- issue: Bedeutung von πρὸς αὐτούς in Bezug auf das Gleichnis
  choice: Das Gleichnis war gegen die religiösen Führer gerichtet.
  alternative: Das Gleichnis wurde zu ihnen gesprochen beziehungsweise bezog sich auf sie.
  rationale: Ihre unmittelbare feindselige Reaktion zeigt, dass sie sich in den verurteilten Gestalten des vorangehenden Gleichnisses wiedererkannten. „Gegen sie“ wahrt die konfrontative Aussage des Kontextes; die Fußnote erhält die sprachlich offenere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „Hand an ihn legen“ bewahrt das Bild des Ausgangstextes; „führende Priester“ vermeidet das historische Missverständnis mehrerer gleichzeitig amtierender Hoherpriester. Fußnote [b] steht bei „gegen sie“, da sie diese Formulierung erläutert.
