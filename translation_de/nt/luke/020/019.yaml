  naturalness: Die Revision verwendet idiomatisches modernes Standarddeutsch. „In eben dieser Stunde“ gibt die hervorgehobene zeitliche Unmittelbarkeit präziser wieder als „noch in derselben Stunde“.
  terminology: „Schriftgelehrte“, „Hohe Priester“, „Volk“ und „Gleichnis“ sind sachgerecht und registerangemessen. Die Wendung „Hand an ihn zu legen“ bewahrt die Bildlichkeit des griechischen Idioms; die Fußnote nennt engere kontextuelle Deutungen.
