    rationale: Die Umschreibung ist verständlich, doch „Hohe Priester“ ist die etablierte, quellennahe deutsche Wiedergabe des festen pluralischen Amtstitels im Evangelienkontext. Der Plural muss nicht mehrere gleichzeitig amtierende oberste Hohepriester behaupten.
  - severity: low
