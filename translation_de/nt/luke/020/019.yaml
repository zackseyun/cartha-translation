    rationale: „In eben dieser Stunde“ gibt αὐτῇ τῇ ὥρᾳ unmittelbar und betont wieder. Präteritum („erkannten“) vermeidet ein nicht erforderliches Plusquamperfekt für ἔγνωσαν; das Erzählen des Gleichnisses liegt mit „erzählt hatte“ korrekt vorzeitig.
