source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: de
  text: 'Als die Weinbauern ihn aber sahen, berieten sie miteinander und sagten: »Das ist der Erbe. Lasst uns ihn töten, damit das Erbe unser wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεωργοὶ
  choice: Weinbauern
  rationale: Das Substantiv bezeichnet landwirtschaftlich Arbeitende; im unmittelbaren Kontext bewirtschaften sie einen Weinberg. »Weinbauern« gibt diesen konkreten Zusammenhang natürlich wieder, ohne die rechtliche Rolle als Pächter ausdrücklich in das Wort hineinzulesen.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: berieten sie miteinander
  rationale: Das Imperfekt bezeichnet eine fortlaufende wechselseitige Überlegung. »Sich miteinander beraten« vermittelt die gemeinsame, berechnende Erwägung idiomatischer als eine wörtliche Wiedergabe mit »überlegen«.
- source_word: κληρονόμος
  choice: Erbe
  rationale: »Erbe« ist die übliche knappe deutsche Entsprechung und bewahrt den rechtlichen sowie erzählerischen Sinn.
- source_word: ἀποκτείνωμεν
  choice: Lasst uns ihn töten
  rationale: Der Aorist Konjunktiv der ersten Person Plural ist hier auffordernd. »Lasst uns … töten« ist direkt und fügt anders als »ermorden« keine zusätzliche lexikalische Wertung hinzu.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: damit das Erbe uns gehört
  rationale: Die Formulierung bewahrt den Zweck der ἵνα-Konstruktion. Das griechische γένηται kann zwar ausdrücklich »werde« bedeuten, doch »damit das Erbe uns gehört« gibt das angestrebte Eintreten des Besitzverhältnisses in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier eine leichte Gegenüberstellung beziehungsweise die entscheidende Wendung der Erzählung; die nachgestellte deutsche Partikel klingt natürlich.
- source_word: ἰδόντες
  choice: Als … sahen
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben und bezeichnet das Sehen als Anlass der anschließenden Beratung.
theological_decisions:
- issue: Bezeichnung der γεωργοί im Gleichnis vom Weinberg
  choice: Weinbauern
  alternative: Pächter; Bauern
  rationale: »Weinbauern« folgt der lexikalischen Bedeutung im konkreten Weinbergkontext. Dass die Männer zugleich Pächter sind, ergibt sich aus dem weiteren Gleichnis, ist aber nicht die ausdrückliche Bedeutung des Substantivs in diesem Vers.
- issue: Zwecksatz über den Erwerb des Erbes
  choice: damit das Erbe uns gehört
  alternative: damit das Erbe unser wird
  rationale: Die gewählte Fassung erhält die Absicht der Weinbauern, ohne zu erklären, weshalb sie den Tod des Erben für einen Weg zum Erbe halten. So bleibt die erzählerische und rechtliche Spannung des Gleichnisses bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und entschlossen. Keine Fußnote ist nötig, da »Weinbauern« den Kontext eindeutig und ohne ungewöhnliche Fachsprache wiedergibt.
