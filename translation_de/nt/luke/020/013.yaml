  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: de
  text: 'Da sagte der Besitzer des Weinbergs[a]: »Was soll ich tun? Ich werde meinen geliebten Sohn schicken. Vielleicht werden sie ihn respektieren[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Herr des Weinbergs«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb kann auch bedeuten: »sich vor ihm schämen«, »sich vor ihm scheuen« oder »ihm Achtung erweisen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: Besitzer des Weinbergs
  rationale: Im unmittelbaren Gleichniskontext bezeichnet die Wortgruppe denjenigen, dem der Weinberg gehört. „Besitzer“ ist im modernen Deutschen natürlich und vermeidet, „Herr“ vorschnell als theologischen Titel zu verstehen.
- source_word: Τί ποιήσω;
  choice: Was soll ich tun?
  rationale: Die deliberative Frage wird so knapp und idiomatisch wiedergegeben.
- source_word: πέμψω
  choice: Ich werde ... schicken
  rationale: Der Futur Indikativ bezeichnet den nun gefassten Entschluss.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: meinen geliebten Sohn
  rationale: Diese natürliche deutsche Formulierung bewahrt sowohl die familiäre Bedeutung als auch den möglichen christologischen Anklang von ἀγαπητός.
- source_word: ἴσως
  choice: Vielleicht
  rationale: Gibt die im griechischen Text ausgedrückte Möglichkeit beziehungsweise Hoffnung ohne Gewissheit wieder.
- source_word: τοῦτον
  choice: vor ihm
  rationale: Das Demonstrativpronomen verweist betont auf den Sohn; im Deutschen ist hier das Personalpronomen natürlicher.
- source_word: ἐντραπήσονται
  choice: werden sie vor ihm Achtung haben
  rationale: Die Form kann bedeuten, sich vor jemandem zu scheuen, sich zu schämen oder ihm Achtung zu erweisen. Die gewählte Wendung wahrt den Bezug „vor ihm“ und klingt im Kontext verständlich.
theological_decisions:
- issue: κύριος als mögliche typologische Bezeichnung Gottes
  choice: Besitzer des Weinbergs
  alternative: Herr des Weinbergs
  rationale: Die Übersetzung gibt zunächst die erzählerische Rolle als Eigentümer wieder, ohne die mögliche Deutung der Gleichnisfigur als Gott auszuschließen oder durch eine Titelform zu erzwingen.
- issue: Christologischer Anklang von „der geliebte Sohn“
  choice: meinen geliebten Sohn
  alternative: meinen Sohn, den geliebten
  rationale: Die idiomatische Wortstellung bewahrt die markante Bezeichnung und damit ihre möglichen Bezüge zur Taufe und Verklärung Jesu, ohne diese im Vers auszudeuten.
- issue: Bedeutung von ἐντραπήσονται
  choice: vor ihm Achtung haben
  alternative: sich vor ihm schämen / ihn respektieren
  rationale: Die Übersetzung lässt die im Verb liegende Spannung zwischen Beschämung, Scheu und respektvoller Zurückhaltung anklingen; die Fußnote nennt die Bedeutungsbreite ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich, ohne umgangssprachlich zu wirken; die Fußnoten dokumentieren die wesentlichen lexikalischen Alternativen.
