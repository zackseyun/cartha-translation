source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: de
  text: Und es gelang ihnen nicht, ihn vor dem Volk bei einem Wort zu fassen.[a] Über seine Antwort verwundert, schwiegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Äußerung vor dem Volk aufzugreifen«; wörtlich etwa: »sich des Wortes vor dem Volk zu bemächtigen«.'
    reason: Die Verbindung ἐπιλαμβάνομαι mit ῥῆμα kann das bildhafte Ergreifen einer Äußerung bezeichnen; im Zusammenhang ist das Ziel, Jesus durch seine Worte angreifbar zu machen.
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: es gelang ihnen nicht
  rationale: Die Wendung bezeichnet hier fehlende Fähigkeit beziehungsweise den misslungenen Versuch; die deutsche Formulierung ist natürlich und wahrt den Handlungskontext.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: ihn bei einem Wort zu fassen
  rationale: Die Formulierung bewahrt das Bild des Ergreifens und gibt im Kontext idiomatisch das Vorhaben wieder, Jesus anhand einer Äußerung festzunageln, ohne bereits eine körperliche Festnahme auszudrücken.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: vor dem Volk
  rationale: Dies gibt sowohl die räumlich-öffentliche Bedeutung »in Gegenwart« als auch λαός mit dem lukanisch passenden »Volk« wieder.
- source_word: θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: Über seine Antwort verwundert
  rationale: Das Partizip bezeichnet ihre erstaunte Reaktion auf Jesu Antwort; »verwundert« ist gegenwärtiges, würdevolles Deutsch und legt weder Bewunderung noch Glauben nahe.
- source_word: ἐσίγησαν
  choice: schwiegen sie
  rationale: Der Aorist beschreibt ihr anschließendes Verstummen; im Zusammenhang vermittelt »schwiegen sie« den Übergang ausreichend klar und knapp.
