id: LUK.20.33
reference: Luke 20:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: de
  text: Wessen Frau wird sie nun bei der Auferstehung sein? Denn die sieben hatten sie zur Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: sie
  rationale: Das Pronomen nimmt die bereits im Zusammenhang genannte Frau natürlich auf und vermeidet die im Deutschen schwerfällige Wiederholung „Wessen Frau wird die Frau …?“.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet den folgernden Schritt in der Frage der Sadduzäer, ohne die logische Kraft überzubetonen.
- source_word: ἐν τῇ ἀναστάσει
  choice: bei der Auferstehung
  rationale: Diese im Deutschen idiomatische Wendung bezeichnet den angenommenen Zeitpunkt beziehungsweise Zusammenhang der Auferstehung und bewahrt die offene Formulierung des Griechischen.
- source_word: τίνος αὐτῶν … γυνή
  choice: wessen Frau
  rationale: Das genitivische Fragewort τίνος bezeichnet hier die eheliche Zuordnung. „Wessen Frau“ gibt die griechische Konstruktion knapp und unmittelbar wieder; „von welchem von ihnen“ wäre unnötig schwerfällig.
- source_word: γίνεται
  choice: wird … sein
  rationale: Im Deutschen drückt „wird … sein“ den aus der hypothetischen Auferstehung folgenden Status natürlicher aus als das missverständliche „wird … werden“ und bewahrt zugleich den Zukunfts- beziehungsweise Resultatsbezug.
- source_word: οἱ γὰρ ἑπτὰ
  choice: Denn die sieben
  rationale: Der bestimmte Artikel verweist auf die sieben zuvor genannten Brüder. Auf ein zusätzliches „alle“ wird verzichtet, da dafür im griechischen Text kein eigenes Wort steht.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: hatten sie zur Frau
  rationale: „Jemanden zur Frau haben“ bildet die griechische Wendung ἔχω mit doppeltem Akkusativ eng und im Deutschen verständlich ab, ohne sie auf den bloßen Akt der Eheschließung zu verengen.
theological_decisions:
- issue: Bedeutung der Auferstehungssprache in der Frage der Sadduzäer
  choice: ἀνάστασις wird ohne erklärenden Zusatz als „Auferstehung“ wiedergegeben.
  alternative: „Auferstehung der Toten“
  rationale: Der Vers selbst enthält nur ἀνάστασις. Die knappe Wiedergabe fügt keine aus dem weiteren Zusammenhang gewonnene Lehrformulierung ein und lässt die Spannung der hypothetischen Frage bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bewusst knapp und folgt dem argumentativen Charakter der Frage. Das erste γυνή wird pronominal aufgenommen, während der eheliche Sinn des zweiten γυνή ausdrücklich mit „Frau“ wiedergegeben wird.
