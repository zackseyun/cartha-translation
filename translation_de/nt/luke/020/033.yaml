review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zuverlässig wieder: „Wessen Frau“ entspricht τίνος … γυνή, „nun“ gibt οὖν angemessen wieder, und „Denn die sieben hatten sie zur Frau“ bewahrt die Aussage von οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα ohne die Beziehung auf den bloßen Heiratsakt zu verkürzen. „Bei der Auferstehung“ ist eine idiomatische deutsche Wiedergabe von ἐν τῇ ἀναστάσει und wahrt die im Ausgangstext offene, hypothetische Rahmung.'
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. Die pronominale Aufnahme „sie“ ist im Kontext klar und vermeidet eine unnatürliche Wiederholung von „Frau“. Die Wortstellung ist flüssig und dem fragenden Argumentationszug angemessen.
  terminology: „Auferstehung“ ist der sachgerechte, theologisch nicht überdeutete Terminus für ἀνάστασις. Die Unterscheidung zwischen der referierenden Frau („sie“) und ihrer ehelichen Zuordnung („Frau“) ist korrekt. „Zur Frau haben“ ist verständlich und gibt die griechische Eheformel hinreichend eng wieder.
  issues: []
  revised_text: ''
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Der deutsche Text ist quellentreu, idiomatisch und im Register angemessen. Die englische Audit-Fußnote zur möglichen Wiedergabe von ἐν τῇ ἀναστάσει als „at the resurrection“ verpflichtet nicht zu einer deutschen Fußnote, da „bei der Auferstehung“ diese mögliche zeitlich-kontextuelle Nuance bereits idiomatisch abbildet.
