base_translation:
  language: en
  yaml_path: translation/nt/luke/020/040.yaml
  text: For they no longer dared to ask him anything.
translation:
  language: de
  text: Denn sie wagten nicht mehr, ihn etwas zu fragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die natürliche deutsche Entsprechung bewahrt die zeitliche Bedeutung, dass dieses Fragen nun aufgehört hatte.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion stellt den erklärenden Bezug zum vorausgehenden Zusammenhang knapp und klar her.
- source_word: ἐτόλμων
  choice: wagten
  rationale: Das Imperfekt bezeichnet hier die in der Vergangenheit bestehende beziehungsweise ausbleibende Bereitschaft oder Kühnheit; zusammen mit „nicht mehr“ wird das Aufhören treffend ausgedrückt.
- source_word: ἐπερωτᾶν
  choice: zu fragen
  rationale: Im Zusammenhang öffentlicher Fragen an Jesus ist „fragen“ die natürliche und hinreichend genaue Wiedergabe; „befragen“ wäre unnötig formell, „verhören“ zu stark.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich als Objekt eindeutig auf Jesus.
- source_word: οὐδέν
  choice: etwas
  rationale: 'Nach der Verneinung „nicht mehr“ gibt das deutsche Indefinitpronomen „etwas“ die umfassende Aussage idiomatisch wieder: Sie wagten keinerlei weitere Frage.'
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wortstellung „ihn etwas zu fragen“ ist idiomatisch und bleibt nahe an der Struktur und Aussage des griechischen Textes.
