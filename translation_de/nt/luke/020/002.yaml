id: LUK.20.2
reference: Luke 20:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: de
  text: 'Und sie sagten zu ihm: »Sag uns: Mit welcher Vollmacht tust du das alles? Oder wer ist es, der dir diese Vollmacht gegeben hat?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den einfachen erzählerischen Anschluss an den vorhergehenden Zusammenhang, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: sie sagten zu ihm
  rationale: Gibt die im Deutschen unnötig schwerfällige Verbindung aus finitem Verb und gleichbedeutendem Partizip idiomatisch wieder und bewahrt die ausdrückliche Hinwendung zu Jesus.
- source_word: Εἰπὸν ἡμῖν
  choice: Sag uns
  rationale: Der Aoristimperativ von λέγω verlangt hier eine unmittelbare Auskunft; »Sag uns« ist natürlich und entspricht dem nachdrücklichen Ton der Aufforderung.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: Mit welcher Vollmacht
  rationale: ἐν bezeichnet hier die Grundlage beziehungsweise Befugnis des Handelns. »Mit welcher Vollmacht« ist im Deutschen idiomatisch und passt zur Frage nach legitimer Beauftragung.
- source_word: ταῦτα
  choice: das
  rationale: Obwohl das Griechische den Plural verwendet, verweist das deutsche idiomatische »das« kollektiv auf Jesu unmittelbar vorausgehendes Handeln; »diese Dinge« wäre in diesem Zusammenhang unnatürlich.
- source_word: ποιεῖς
  choice: tust du
  rationale: Das Präsens wird direkt bewahrt; »tust du das« klingt in der konfrontativen Frage natürlich und gegenwartsbezogen.
- source_word: ἢ
  choice: Oder
  rationale: 'Kennzeichnet die zweite Frage als eng verbundene alternative Formulierung: Gefragt wird entweder nach der Art der Vollmacht oder nach ihrem Geber.'
- source_word: τίς ἐστιν ὁ δούς
  choice: wer ist es, der … gegeben hat
  rationale: Bewahrt die ausdrückliche substantivische Struktur des artikulierten Partizips stärker als das verkürzte »wer gab«, bleibt dabei aber gutes modernes Deutsch.
- source_word: σοι
  choice: dir
  rationale: Gibt den Dativ ausdrücklich und idiomatisch wieder.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: diese Vollmacht
  rationale: »Vollmacht« bezeichnet hier nicht bloße Fähigkeit oder Kraft, sondern die verliehene Befugnis und Legitimation für Jesu Handeln.
theological_decisions:
- issue: Bedeutung von ἐξουσία in der Auseinandersetzung um Jesu Handeln im Tempel
  choice: Vollmacht
  alternative: Autorität; Macht; Befugnis
  rationale: Der Zusammenhang fragt nach Jesu legitimer Beauftragung und deren Ursprung. »Vollmacht« hält den Gedanken einer wirksamen, gegebenen Handlungsbefugnis fest, ohne die Frage bereits theologisch zu beantworten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und konfrontativ. »Vollmacht« wird in beiden Satzhälften konsistent verwendet; die griechische Pluralform ταῦτα wird idiomatisch kollektiv mit »das« wiedergegeben.
