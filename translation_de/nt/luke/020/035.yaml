review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt καταξιωθέντες zutreffend als passive Beurteilung wieder und wahrt mit „jenem Zeitalter“ den Demonstrativausdruck. „An ... teilzuhaben“ bildet τυχεῖν mit den koordinierten Genitiven sinnvoll ab; „Auferstehung aus den Toten“ entspricht der griechischen Wendung. Die unterschiedliche Form von γαμοῦσιν und γαμίζονται bleibt erhalten.
  naturalness: Der Satz ist fast durchweg modernes Standarddeutsch. Die Stellung von „weder noch“ ist jedoch in „heiraten weder noch werden sie verheiratet“ syntaktisch holprig und lässt die Verneinung nicht klar parallel auf beide Prädikate bezogen erscheinen. Die Wiederholung des Subjekts nach „weder“ schafft eine natürliche und eindeutige Paarung.
  terminology: „Zeitalter“, „Auferstehung aus den Toten“ und „für würdig erachtet“ sind angemessen und theologisch nicht überdeutend. „Verheiratet werden“ bewahrt als passive Form die historische, im Griechischen markierte Gegenüberstellung zu „heiraten“; es sollte nicht durch eine modernisierende Umschreibung nivelliert werden.
  issues:
  - severity: low
    issue: Unidiomatische Stellung der zweiteiligen Verneinung
    rationale: In der vorliegenden Form „heiraten weder noch werden sie verheiratet“ ist die Konstruktion im Deutschen schwerfällig. „Weder heiraten sie noch werden sie verheiratet“ ist idiomatisch und gibt die griechische οὔτε ... οὔτε-Parallele klar wieder.
  revised_text: Doch diejenigen, die für würdig erachtet werden[a], an jenem Zeitalter[b] und an der Auferstehung aus den Toten teilzuhaben, heiraten weder noch werden sie verheiratet.
  revised_footnotes:
  - marker: a
    text: 'Auch: „für würdig befunden“ oder „für würdig gehalten“. Im Griechischen steht eine passive Form: Sie werden als würdig beurteilt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „an der kommenden Weltzeit“. Wörtlich: „an jenem Zeitalter“.'
    reason: lexical_alternative
  revision_rationale: Die Satzstellung der Verneinung wird korrigiert, damit beide Verben klar und idiomatisch parallel verneint sind. Alle übrigen Formulierungen und Fußnoten können unverändert bleiben.
