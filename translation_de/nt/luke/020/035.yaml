source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: de
  text: Doch diejenigen, die für würdig erachtet werden[a], an jenem Zeitalter[b] und an der Auferstehung aus den Toten teilzuhaben, heiraten weder noch werden sie verheiratet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „für würdig befunden“ oder „für würdig gehalten“. Im Griechischen steht eine passive Form: Sie werden als würdig beurteilt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „an der kommenden Weltzeit“. Wörtlich: „an jenem Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: die für würdig erachtet werden
  rationale: Die passive Form bleibt erhalten und bezeichnet Menschen, die als würdig beurteilt werden, ohne zu behaupten, sie seien aus sich selbst würdig oder hätten sich dies verdient.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: an jenem Zeitalter
  rationale: „Jenes Zeitalter“ gibt den Demonstrativausdruck eng wieder und bewahrt den endzeitlichen Gegensatz zum gegenwärtigen Zeitalter, ohne ihn ausdrücklich auszudeuten.
- source_word: τυχεῖν
  choice: teilzuhaben
  rationale: In Verbindung mit dem Genitiv kann das Verb „erlangen“ oder „Anteil erhalten“ bedeuten. „Teilzuhaben“ ist im Deutschen mit beiden koordinierten Größen – dem Zeitalter und der Auferstehung – natürlich und treffend.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: der Auferstehung aus den Toten
  rationale: Die Formulierung bildet ἐκ νεκρῶν klar und relativ eng ab. „Aus den Toten“ wahrt dabei die mögliche Vorstellung des Hervorkommens aus der Gesamtheit der Toten.
- source_word: γαμοῦσιν
  choice: heiraten
  rationale: Das Verb bezeichnet hier das Eingehen einer Ehe. „Heiraten“ ist die klare und allgemein verständliche deutsche Entsprechung.
- source_word: γαμίζονται
  choice: werden sie verheiratet
  rationale: Die passive Form und die Unterscheidung vom vorangehenden aktiven „heiraten“ bleiben erhalten; zugleich wird die damalige gesellschaftliche Ausdrucksweise erkennbar.
theological_decisions:
- issue: Ob καταξιωθέντες ein verdienstliches Erlangen des Auferstehungslebens voraussetzt
  choice: Die passive Wendung „für würdig erachtet werden“ bewahrt den Gedanken eines Urteils über diese Menschen, ohne zu erklären, aufgrund wessen oder wodurch sie als würdig gelten.
  alternative: „die jenes Zeitalters würdig sind“ könnte als Aussage über eine ihnen innewohnende oder selbst erworbene Würdigkeit verstanden werden.
  rationale: Der griechische Text lässt die urteilende Instanz unausgesprochen. Die Übersetzung wahrt diese Offenheit und löst die Spannung zwischen Würdigkeit, Beurteilung und möglichem Verdienst nicht lehrmäßig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeitalter“ wahrt den biblisch-endzeitlichen Sinn von αἰών besser als das mehrdeutige „Welt“. Die Konstruktion „an … teilzuhaben“ vermeidet das im Deutschen unnatürliche „ein Zeitalter erlangen“ und kann zugleich beide griechischen Genitivobjekte aufnehmen.
