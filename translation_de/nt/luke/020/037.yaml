source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: de
  text: Dass aber die Toten auferweckt werden, hat auch Mose in dem Abschnitt über den Dornbusch[a] deutlich gemacht, wo er den Herrn[b] als »den Gott Abrahams und den Gott Isaaks und den Gott Jakobs« bezeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beim Dornbusch«. Die griechische Wendung kann entweder die Szene selbst oder, als übliche Stellenangabe, den Schriftabschnitt über den brennenden Dornbusch bezeichnen (2. Mose 3).'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: »den Herrn«. Dies entspricht der in der griechischen Übersetzung des Alten Testaments üblichen Wiedergabe des Gottesnamens in 2. Mose 3.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: auferweckt werden
  rationale: Das Präsens Passiv wird im Auferstehungskontext natürlich wiedergegeben und lässt Gottes Handeln als impliziten Urheber erkennen, ohne es ausdrücklich hinzuzufügen.
- source_word: οἱ νεκροὶ
  choice: die Toten
  rationale: Die substantivierte Form bewahrt den kollektiven Sinn und entspricht natürlichem, würdevollem Deutsch.
- source_word: ἐμήνυσεν
  choice: deutlich gemacht
  rationale: μηνύω bezeichnet ein Bekanntmachen oder Aufzeigen. Die Formulierung gibt den Belegcharakter von Moses Zeugnis wieder, ohne daraus eine förmliche Verkündigung zu machen.
- source_word: ἐπὶ τῆς βάτου
  choice: in dem Abschnitt über den Dornbusch
  rationale: Die Wendung kann idiomatisch auf den Schriftabschnitt über den brennenden Dornbusch verweisen; diese Wiedergabe ist für heutige Leser klar, während die örtliche Lesart in der Fußnote erhalten bleibt.
- source_word: ὡς λέγει
  choice: wo er … nennt
  rationale: λέγει führt hier die Bezeichnung des Herrn als Gott Abrahams, Isaaks und Jakobs ein. »nennt« bildet die Konstruktion idiomatisch ab.
- source_word: κύριον
  choice: den Herrn
  rationale: »Herr« ist die übliche Wiedergabe von κύριος und wahrt den göttlichen Titel in der Anspielung auf Exodus 3.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: den Gott Abrahams und den Gott Isaaks und den Gott Jakobs
  rationale: Die dreifache Wiederholung von θεόν wird beibehalten, weil sie die Betonung und den Rhythmus des griechischen Textes trägt.
theological_decisions:
- issue: Auferstehungssprache in Jesu Argument gegen die Sadduzäer
  choice: die Toten auferweckt werden
  alternative: die Toten auferstehen
  rationale: Die passive Form des Griechischen bleibt erhalten und deutet Gottes Wirken an, ohne über den Wortlaut hinauszugehen.
- issue: Wiedergabe von κύριος in der Anspielung auf Exodus 3
  choice: den Herrn
  alternative: den HERRN
  rationale: Der griechische Text bietet κύριον und nicht den hebräischen Gottesnamen. Daher steht im Haupttext »Herr«; der Bezug zur Wiedergabetradition des Gottesnamens wird in der Fußnote erläutert.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Satzstellung wahrt die argumentative Hervorhebung von »Dass aber die Toten auferweckt werden«. Die Wiederholung von »den Gott« erhält die feierliche Belegformel.
