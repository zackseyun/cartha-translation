review_pass:
  verdict: approve
  source_fidelity: „Ist es uns erlaubt“ gibt ἔξεστιν mit der im Kontext beabsichtigten Frage nach Zulässigkeit wieder, ohne jüdisches oder römisches Recht festzulegen. „uns“ entspricht dem expliziten ἡμᾶς. „dem Kaiser“ ist eine treffende, idiomatische Wiedergabe von Καίσαρι. „die Steuer ... zu zahlen“ gibt φόρον δοῦναι im Deutschen natürlich wieder; die Fußnote bewahrt die mögliche Nuance von Tribut bzw. Abgabe an eine Herrschaftsmacht. „oder nicht?“ entspricht ἢ οὔ vollständig.
  naturalness: Der Satz ist klares modernes Standarddeutsch und wahrt einen sachlich-würdigen biblischen Registerton. Die Verbindung „dem Kaiser die Steuer zu zahlen“ ist idiomatisch. Der bestimmte Singular „die Steuer“ kann die konkrete geschuldete Abgabe bezeichnen und ist daher hier angemessen.
  terminology: „Kaiser“ ist für Καίσαρ etabliert und historisch präzise. „Steuer“ ist als Haupttextwort verständlich; „Tribut“ in der Anmerkung macht die politische Unterwerfungsnuance von φόρος zugänglich, ohne sie in den Haupttext hineinzulesen. Die rechtlich-religiöse Offenheit von ἔξεστιν bleibt erhalten.
