  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: de
  text: Ist es uns erlaubt, dem Kaiser die Steuer[a] zu zahlen, oder nicht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Tribut. Das griechische Wort bezeichnet eine Abgabe an die herrschende Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: Ist es uns erlaubt
  rationale: Die Wendung fragt nach der rechtlichen oder religiösen Zulässigkeit, ohne den maßgeblichen Rechtsrahmen ausdrücklich festzulegen. „Erlaubt“ ist im modernen Deutsch natürlich und bewahrt diese Offenheit.
- source_word: ἡμᾶς
  choice: uns
  rationale: Das Akkusativsubjekt des Infinitivs wird knapp und genau mit „uns“ wiedergegeben; eine ausdrückliche Ergänzung wie „uns Juden“ steht nicht im griechischen Text.
- source_word: Καίσαρι
  choice: dem Kaiser
  rationale: Καῖσαρ bezeichnet hier den römischen Herrscher. „Kaiser“ ist die etablierte, historisch verständliche deutsche Wiedergabe.
- source_word: φόρον
  choice: die Steuer[a]
  rationale: φόρος bezeichnet eine an die herrschende Macht entrichtete Steuer beziehungsweise einen Tribut. „Steuer“ ist im Haupttext natürlich; die politische Nuance wird in der Fußnote kenntlich gemacht.
- source_word: δοῦναι
  choice: zu zahlen
  rationale: 'Obwohl δίδωμι wörtlich „geben“ bedeutet, lautet die idiomatische deutsche Verbindung mit „Steuer“: „Steuer zahlen“.'
- source_word: ἢ οὔ
  choice: oder nicht
  rationale: Dies ist die natürliche deutsche Wiedergabe der abschließenden Entscheidungsalternative.
theological_decisions:
- issue: Bezugsrahmen der Frage nach der Erlaubtheit
  choice: Die Frage bleibt allgemein als „Ist es uns erlaubt ...?“ formuliert.
  alternative: „Ist es nach römischem Recht erlaubt ...?“ oder „Ist es nach Gottes Gesetz erlaubt ...?“
  rationale: Der griechische Text legt nicht fest, ob römisches Recht, das Gesetz Gottes oder beides gemeint ist. Die Übersetzung bewahrt die politisch-religiöse Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung ist idiomatisch, ohne die im Ausgangstext bestehende rechtlich-theologische Mehrdeutigkeit aufzulösen.
