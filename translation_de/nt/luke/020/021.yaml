id: LUK.20.21
reference: Luke 20:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: de
  text: 'Da fragten sie ihn: »Lehrer, wir wissen, dass du richtig redest und lehrst und niemanden bevorzugst[a], sondern den Weg Gottes wahrheitsgemäß[b] lehrst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »du nimmst kein Gesicht an«; eine Redewendung dafür, niemanden aufgrund seiner Person, seines Ranges oder seines Ansehens zu bevorzugen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Wahrheit« beziehungsweise »wahrhaftig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: fragten
  rationale: Das Verb bezeichnet ein Fragen oder Befragen. »Fragten« ist im Deutschen natürlich und lässt die aus dem Kontext erkennbare Prüfungsabsicht bestehen, ohne sie in das Verb hineinzulesen.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede bezeichnet Jesus als Lehrenden; »Lehrer« ist die klare und gegenwärtige Entsprechung.
- source_word: ὀρθῶς
  choice: richtig
  rationale: »Richtig« kann sich natürlich auf beide folgenden Tätigkeiten, Reden und Lehren, beziehen und gibt den Sinn von Korrektheit beziehungsweise Angemessenheit wieder.
- source_word: λέγεις καὶ διδάσκεις
  choice: du redest und lehrst
  rationale: Beide koordinierten Verben werden bewahrt. »Reden und lehren« klingt im Deutschen idiomatisch und erhält die rhetorische Fülle der Aussage.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: du bevorzugst niemanden
  rationale: Die wörtliche Wendung »ein Gesicht annehmen« ist ein Idiom für Parteilichkeit oder Bevorzugung aufgrund der Person beziehungsweise ihres Ansehens. Die gewählte Form gibt diesen Sinn klar und natürlich wieder.
- source_word: ἐπ’ ἀληθείας
  choice: wahrheitsgemäß
  rationale: Das Adverb gibt wieder, dass Jesu Lehre der Wahrheit entspricht. Es lässt sich im Deutschen eng und verständlich auf »lehrst« beziehen.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: den Weg Gottes
  rationale: Die Formulierung bewahrt Bild, Genitivstruktur und theologischen Klang des griechischen Ausdrucks.
theological_decisions:
- issue: Idiom für Unparteilichkeit
  choice: »du bevorzugst niemanden«
  alternative: »du siehst die Person nicht an« / »du lässt dich nicht vom Ansehen eines Menschen beeinflussen«
  rationale: Die griechische Wendung bezeichnet, dass Jesus sein Urteil und seine Lehre nicht nach Rang, Ansehen oder äußerer Erscheinung richtet. Eine sinngemäße Übersetzung verhindert ein Missverständnis, ohne die Aussage konfessionell zu prägen.
- issue: Bezug und Wiedergabe von ἐπ’ ἀληθείας
  choice: »wahrheitsgemäß«
  alternative: »in Wahrheit« / »wahrhaftig«
  rationale: Die Präpositionalphrase beschreibt am ehesten die Art und Weise des Lehrens. »Wahrheitsgemäß« betont die Übereinstimmung mit der Wahrheit, während »in Wahrheit« auch stärker bekräftigend verstanden werden kann; die Alternative wird daher in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, aber nicht altertümlichem Ton. Die koordinierte Struktur des Griechischen bleibt erhalten; idiomatische Wendungen werden sinngemäß wiedergegeben und in den Fußnoten transparent gemacht.
