id: LUK.20.41
reference: Luke 20:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Wie können sie sagen, der Messias[a] sei Davids Sohn[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „ein Sohn Davids“ oder „der Sohn Davids“. Wörtlich steht im Griechischen: „Davids Sohn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: δέ markiert hier einen leichten erzählerischen Übergang. „Da“ ist im Deutschen natürlich und vermeidet einen zu starken Gegensatz.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: Die gewöhnliche deutsche Wiedergabe der griechischen Konstruktion bei einem Verb des Sagens.
- source_word: Πῶς λέγουσιν
  choice: Wie kann man sagen
  rationale: Das unbestimmte Subjekt der 3. Person Plural wird idiomatisch mit „man“ wiedergegeben; „Wie kann“ bringt den fragenden Einwand zum Ausdruck, ohne ihn inhaltlich aufzulösen.
- source_word: τὸν χριστόν
  choice: der Messias
  rationale: Χριστός ist hier ein Titel für den erwarteten davidischen Retter; „Messias“ macht diesen jüdischen Erwartungshorizont unmittelbar verständlich.
- source_word: εἶναι
  choice: sei
  rationale: Der griechische Infinitiv in der indirekten Aussage wird natürlich als deutscher Konjunktiv I wiedergegeben.
- source_word: Δαυὶδ υἱόν
  choice: Davids Sohn
  rationale: Die knappe Genitivverbindung wird eng am Griechischen wiedergegeben und lässt die Frage der Bestimmtheit offen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der Zusammenhang behandelt ausdrücklich den erwarteten davidischen König und Retter. „Messias“ stellt diesen titularen Sinn heraus; die Alternative bleibt in der Fußnote sichtbar.
- issue: Davidische Sohnschaft
  choice: Davids Sohn
  alternative: ein Sohn Davids / der Sohn Davids
  rationale: Die Formulierung bewahrt die wörtliche Abstammungssprache sowie die theologische Spannung, die Jesus in der folgenden Argumentation entfaltet, ohne einen bestimmten Artikel oder einen feststehenden Ehrentitel hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Konjunktiv I kennzeichnet die berichtete Aussage. Die unbestimmte griechische Pluralform λέγουσιν wird idiomatisch durch „man“ wiedergegeben.
