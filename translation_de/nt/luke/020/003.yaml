  text: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς· Ἐρωτήσω ὑμᾶς ⸀κἀγὼ λόγον, καὶ εἴπατέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: de
  text: 'Doch er erwiderte ihnen: „Auch ich will euch eine Frage[a] stellen. Sagt mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ein Wort“ oder „eine Sache“. Das griechische λόγον bezeichnet hier sinngemäß eine Frage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Doch er erwiderte ihnen
  rationale: Die Verbindung aus Antwortpartizip, δέ und dem Hauptverb εἶπεν wird in natürlichem Deutsch als einleitende Erwiderung wiedergegeben. „Doch“ trägt dem leichten Gegensatz im Gespräch Rechnung.
- source_word: Ἐρωτήσω ὑμᾶς
  choice: ich will euch … stellen
  rationale: Der griechische Futur bezeichnet hier Jesu unmittelbar angekündigte Gegenfrage. Die deutsche Wendung „eine Frage stellen“ ist idiomatisch und bewahrt „euch“ als pluralisches Objekt.
- source_word: κἀγὼ
  choice: Auch ich
  rationale: 'Die Zusammenziehung von καὶ ἐγώ betont die Entsprechung: Nachdem sie Jesus gefragt haben, fragt nun auch er sie.'
- source_word: λόγον
  choice: eine Frage
  rationale: λόγος bedeutet wörtlich unter anderem „Wort“ oder „Sache“, bezeichnet in Verbindung mit ἐρωτάω hier jedoch idiomatisch den Gegenstand des Fragens, also eine Frage.
- source_word: καὶ εἴπατέ μοι
  choice: Sagt mir
  rationale: Der Imperativ Plural und das Dativpronomen werden direkt und natürlich wiedergegeben. Der Doppelpunkt hält die Aussage für den Inhalt der folgenden Verse offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas schwerfällige wörtliche Konstruktion „antwortend sagte er“ wird idiomatisch mit „er erwiderte“ wiedergegeben; die direkte Herausforderung und der Übergang zur folgenden Frage bleiben erhalten.
