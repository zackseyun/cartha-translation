  source_fidelity: 'Die Grundbedeutung wird gut getroffen: gemeinsames Abwägen, die Bedingung „wenn wir sagen“, „vom Himmel“ und das Glauben an Johannes bzw. seinem Zeugnis. Zwei kleine explizierende Abweichungen sollten jedoch vermieden werden: ἐρεῖ heißt „wird sagen“, nicht spezifisch „wird fragen“, und „dann“ steht nicht im griechischen Text. Das einleitende δέ sollte mit „aber“ wiedergegeben werden.'
