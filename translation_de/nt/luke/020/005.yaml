source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: de
  text: 'Sie überlegten aber miteinander: „Wenn wir sagen: ‚Vom Himmel‘, wird er sagen: ‚Warum habt ihr ihm nicht geglaubt?‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: sie überlegten miteinander
  rationale: Die Verbindung bezeichnet gemeinsames Abwägen innerhalb der Gruppe. „Überlegten miteinander“ gibt sowohl den gedanklichen als auch den gemeinschaftlichen Charakter natürlich wieder.
- source_word: λέγοντες
  choice: durch den folgenden Doppelpunkt wiedergegeben
  rationale: Das begleitende Partizip führt den Inhalt ihrer Überlegung ein. Im Deutschen ist ein Doppelpunkt natürlicher als das schwerfällige „und sagten“.
- source_word: Ἐὰν εἴπωμεν
  choice: wenn wir sagen
  rationale: Die Formulierung gibt die bedingte Erwägung idiomatisch und ohne unnötige Abschwächung wieder.
- source_word: Ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die wörtliche Wendung bleibt erhalten und verweist im Kontext auf göttlichen Ursprung beziehungsweise göttliche Vollmacht, ohne „Gott“ ausdrücklich in den Text einzutragen.
- source_word: ἐρεῖ
  choice: wird er fragen
  rationale: λέγω bedeutet grundsätzlich „sagen“, doch da die unmittelbar folgende direkte Rede eine Frage ist, entspricht „fragen“ im Deutschen der konkreten Sprechhandlung und klingt natürlicher.
- source_word: Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ
  choice: warum habt ihr ihm dann nicht geglaubt?
  rationale: πιστεύω mit Dativ bedeutet hier, jemandem Glauben zu schenken. Das im Deutschen ergänzte „dann“ verdeutlicht die im griechischen Zusammenhang enthaltene Folgerung, ohne den Sinn zu verändern.
theological_decisions:
- issue: Bedeutung der Herkunft von Johannes’ Taufe in der Antwort „vom Himmel“
  choice: Die Wendung „vom Himmel“ wird beibehalten.
  alternative: „von Gott“
  rationale: Der Ausdruck impliziert göttlichen Ursprung und göttliche Autorisierung, nennt aber wörtlich den Himmel. Die Übersetzung bewahrt diese ehrerbietige Umschreibung und vermeidet eine interpretierende Explizierung.
- issue: Bedeutung von πιστεύω mit αὐτῷ
  choice: „ihm geglaubt“
  alternative: „ihm vertraut“ oder „an ihn geglaubt“
  rationale: Im unmittelbaren Zusammenhang geht es darum, der Botschaft beziehungsweise dem Zeugnis des Johannes Glauben zu schenken. „An ihn geglaubt“ könnte eine stärkere Aussage persönlichen Glaubens nahelegen, die diese Dativkonstruktion nicht verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede und das gemeinsame taktische Abwägen bleiben deutlich; auf Fußnoten wird verzichtet, da die relevanten Nuancen im Haupttext angemessen wiedergegeben werden.
