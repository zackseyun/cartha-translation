  terminology: „Vom Himmel“ bewahrt die bewusst indirekte Redeweise des griechischen Textes. „Ihm geglaubt“ gibt πιστεύω mit Dativ im vorliegenden Zusammenhang präzise wieder und vermeidet das stärker interpretierende „an ihn geglaubt“.
