  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: de
  text: 'Da traten einige der Sadduzäer zu ihm, die bestreiten, dass es eine Auferstehung gibt,[a] und fragten ihn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sagen, es gebe keine Auferstehung.“'
    reason: Lexikalisch und syntaktisch mögliche, etwas wörtlichere Wiedergabe der bestrittenen Aussage.
lexical_decisions:
- source_word: Προσελθόντες
  choice: kamen … zu ihm
  rationale: Das Aoristpartizip bezeichnet die Annäherung, die der Haupthandlung vorausgeht. Die deutsche Satzfügung gibt die Bewegung zum Gesprächspartner natürlich wieder; das Ziel wird durch „ihn“ im Hauptsatz deutlich.
- source_word: δέ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter, ohne einen starken Gegensatz auszudrücken. „Da“ ist in diesem Zusammenhang ein natürlicher, leicht erzählender Anschluss.
- source_word: τινες τῶν Σαδδουκαίων
  choice: einige von den Sadduzäern
  rationale: Die partitive Konstruktion wird transparent wiedergegeben und bezeichnet einige Angehörige dieser Gruppe.
- source_word: οἱ ἀντιλέγοντες
  choice: die bestreiten
  rationale: Im Zusammenhang bezeichnet das Partizip ihre ablehnende Haltung gegenüber der folgenden Aussage. „Bestreiten“ bewahrt den Sinn des Widersprechens und klingt im Deutschen idiomatisch.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: dass es eine Auferstehung gibt
  rationale: Die Infinitivkonstruktion gibt den Inhalt dessen an, was bestritten wird. Die deutsche dass-Konstruktion ist klar und wahrt die Aussage über die Existenz einer Auferstehung.
- source_word: ἐπηρώτησαν αὐτόν
  choice: fragten ihn
  rationale: ἐπερωτάω bedeutet hier, eine Frage an Jesus zu richten. „Fragten ihn“ ist natürlich und legt den herausfordernden Charakter der im Folgenden berichteten Frage nicht stärker fest als der Vers selbst.
theological_decisions:
- issue: Wiedergabe der Haltung der Sadduzäer zur Auferstehung
  choice: die bestreiten, dass es eine Auferstehung gibt
  alternative: die sagen, es gebe keine Auferstehung
  rationale: Die gewählte Fassung gibt ihre lehrmäßige Verneinung direkt wieder, ohne näher zu bestimmen, welche Art von Auferstehung gemeint ist oder spätere dogmatische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich und bleibt nahe an der griechischen Satzstruktur. Der Doppelpunkt bereitet die in den folgenden Versen unmittelbar wiedergegebene Frage vor.
