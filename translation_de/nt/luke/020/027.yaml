  source_fidelity: 'Eine sichere Korrektur ist nötig: Προσελθόντες bezeichnet das Herantreten zu Jesus. Der Entwurf gibt nur „kamen“ wieder; die Annäherung zu ihm sollte ausdrücklich erscheinen. Die übrigen Satzelemente, einschließlich der Kennzeichnung der Sadduzäer und ihres Bestreitens der Auferstehung, sind sachgerecht.'
  naturalness: „Einige der Sadduzäer“ und „traten zu ihm“ sind modernes, würdiges Standarddeutsch und flüssiger als „einige von den Sadduzäern“. Der Doppelpunkt ist angemessen, weil die Frage im unmittelbar folgenden Kontext folgt.
  terminology: „Sadduzäer“ und „Auferstehung“ sind etablierte und quellentreue Begriffe. „Bestreiten, dass es eine Auferstehung gibt“ gibt die durch οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι bezeichnete Haltung idiomatisch wieder, ohne den Umfang der bestrittenen Auferstehung dogmatisch einzugrenzen.
