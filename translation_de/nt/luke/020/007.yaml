  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: de
  text: Da antworteten sie, sie wüssten nicht, woher sie stamme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „woher“. Gemeint ist die Herkunft oder der Ursprung der Taufe des Johannes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Da
  rationale: Das anschließende καί führt hier die Reaktion im Erzählfluss weiter. „Da“ klingt im Deutschen natürlich und gibt den Zusammenhang wieder, ohne eine stärkere Folgerung zu behaupten.
- source_word: ἀπεκρίθησαν
  choice: antworteten sie
  rationale: Die Aoristform von ἀποκρίνομαι bezeichnet schlicht das Antworten; die gewählte Formulierung ist idiomatisch und erzählerisch angemessen.
- source_word: μὴ εἰδέναι
  choice: sie wüssten nicht
  rationale: Der Infinitiv mit μή steht nach dem Verb des Antwortens als indirekte Rede. Der deutsche Konjunktiv I gibt diese natürlich und präzise wieder.
- source_word: πόθεν
  choice: woher sie stamme
  rationale: πόθεν fragt nach Herkunft oder Ursprung. Das Pronomen bezieht sich aus dem Kontext auf die Taufe des Johannes; „stamme“ bewahrt den Herkunftssinn, ohne die Quelle näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die indirekte Rede wird idiomatisch mit Konjunktiv I wiedergegeben.
