  text: καὶ προσέθετο ⸂τρίτον πέμψαι⸃· οἱ δὲ καὶ τοῦτον τραυματίσαντες ἐξέβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: de
  text: Und er schickte noch einen dritten[a]. Doch auch ihn verwundeten sie und warfen ihn hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er fügte hinzu, einen dritten zu schicken“; eine griechische Wendung im Sinn von „er schickte noch einen dritten“ oder „er fuhr fort und schickte einen dritten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: schickte noch
  rationale: Die Verbindung προστίθημι mit Infinitiv bezeichnet die Fortsetzung beziehungsweise Wiederholung einer Handlung. „schickte noch“ gibt diesen iterativen Sinn im Deutschen natürlich wieder.
- source_word: τρίτον πέμψαι
  choice: einen dritten
  rationale: Das Bezugswort „Knecht“ ist aus dem vorherigen Zusammenhang erschließbar und bleibt wie im Griechischen unausgesprochen.
- source_word: οἱ δὲ
  choice: Doch … sie
  rationale: δέ markiert hier den Gegensatz zwischen dem Handeln des Besitzers und der Reaktion der Weingärtner; das Pronomen verweist eindeutig auf diese.
- source_word: καὶ τοῦτον
  choice: auch ihn
  rationale: καί hebt hervor, dass der dritte Gesandte ebenfalls misshandelt wurde. „auch ihn“ ist natürlich und erhält den wiederholenden Nachdruck.
- source_word: τραυματίσαντες
  choice: verwundeten
  rationale: τραυματίζω bezeichnet konkret das Zufügen einer Wunde und wird daher präziser mit „verwunden“ als mit dem allgemeineren „verletzen“ wiedergegeben.
- source_word: ἐξέβαλον
  choice: warfen ihn hinaus
  rationale: ἐκβάλλω bezeichnet hier ein gewaltsames Hinauswerfen. Die Formulierung ist anschaulich, gegenwartssprachlich und dem Kontext angemessen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise und das im Griechischen ausgelassene, aus dem Zusammenhang erkennbare Bezugswort „Knecht“ bleiben erhalten.
