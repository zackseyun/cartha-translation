source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: de
  text: 'Zeigt mir einen Denar.[a] Wessen Bild und Aufschrift trägt er? Sie antworteten: »Des Kaisers.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine römische Münze, die damals weithin gebräuchlich war. Die historische Münzbezeichnung bleibt erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Zeigt mir
  rationale: Der Aoristimperativ ist eine direkte Aufforderung; »Zeigt mir« ist natürlich und wahrt ihre Kraft.
- source_word: δηνάριον
  choice: einen Denar
  rationale: Die historische Münzbezeichnung bleibt erhalten, statt sie verallgemeinernd als römische Münze oder Silbermünze wiederzugeben.
- source_word: τίνος ἔχει
  choice: Wessen … trägt er?
  rationale: τίνος fragt nach der Zuordnung; mit Bezug auf eine Münze ist »Wessen … trägt er?« idiomatisches modernes Deutsch.
- source_word: εἰκόνα
  choice: Bild
  rationale: »Bild« gibt εἰκών breit und im Zusammenhang einer Münzprägung verständlich wieder, ohne es vorschnell auf ein Porträt einzuengen.
- source_word: ἐπιγραφήν
  choice: Aufschrift
  rationale: »Aufschrift« bezeichnet die schriftliche Prägung einer Münze präzise und allgemein verständlich.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Sie antworteten
  rationale: Die griechische Partizip-plus-Verb-Konstruktion wird flüssig durch ein finites Verb wiedergegeben; δέ setzt hier den Erzählgang fort.
- source_word: Καίσαρος
  choice: Des Kaisers
  rationale: Die knappe Genitivantwort des Griechischen bleibt als elliptische deutsche Antwort erhalten. »Kaiser« ist die im Deutschen eingebürgerte Wiedergabe des Herrschertitels Καῖσαρ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; die Ellipse »Des Kaisers« bewahrt die Prägnanz der griechischen Antwort.
