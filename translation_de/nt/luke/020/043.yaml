  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: de
  text: bis ich deine Feinde zum Fußschemel für deine Füße mache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis ich deine Feinde zum Fußschemel deiner Füße mache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: bis
  rationale: Die Verbindung bezeichnet den zukünftigen Endpunkt eines Geschehens; im Deutschen gibt „bis“ dies natürlich und präzise wieder.
- source_word: θῶ
  choice: ich … mache
  rationale: τίθημι bedeutet wörtlich „setzen/stellen/legen“. In Verbindung mit dem doppelten Akkusativ und dem Bild des Fußschemels gibt „zum … machen“ den resultativen Sinn idiomatisch wieder.
- source_word: τοὺς ἐχθρούς σου
  choice: deine Feinde
  rationale: Die direkte Akkusativverbindung mit Possessivpronomen wird ohne Abschwächung wiedergegeben.
- source_word: ὑποπόδιον
  choice: zum Schemel
  rationale: „Schemel“ bezeichnet hier den Fußschemel. Die knappe Form ist im Deutschen natürlich, während der folgende Ausdruck „für deine Füße“ die Funktion eindeutig macht.
- source_word: τῶν ποδῶν σου
  choice: für deine Füße
  rationale: Wörtlich steht „deiner Füße“. Die Wiedergabe mit „für“ entspricht der natürlichen deutschen Verbindung mit „Schemel“ und bewahrt das Bild, ohne es als „unter deine Füße“ auszudeuten.
theological_decisions:
- issue: Bild der Unterwerfung im Zitat aus Psalm 110,1
  choice: Das Bild bleibt als „deine Feinde zum Schemel für deine Füße machen“ erhalten.
  alternative: „deine Feinde unter deine Füße legen“
  rationale: Die Übersetzung bewahrt die königlich-messianische Metapher und erklärt sie nicht vorschnell als vollständige Niederlage oder Herrschaft. So bleibt die christologische Spannung des Zitats bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schemel“ ist leicht gehoben, aber im biblischen Bild verständlich; „Fußschemel“ wurde vermieden, da „für deine Füße“ sonst unnötig doppelt klänge.
