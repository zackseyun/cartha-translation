source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: de
  text: 'Dann begann er, dem Volk dieses Gleichnis zu erzählen: „Ein Mann pflanzte einen Weinberg, verpachtete ihn an Weinbauern und verreiste[a] für längere Zeit.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging für lange Zeit außer Landes“. Das Verb kann bedeuten, dass jemand seine Heimatregion verlässt, auch um ins Ausland zu reisen.'
    reason: Lexikalische Bedeutungsbreite von ἀποδημέω; die alternative Formulierung schließt zugleich die erhebliche Zeitdauer von χρόνους ἱκανούς ein.
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Dann begann er
  rationale: δέ führt die Erzählung weiter; zusammen mit dem ingressiven ἤρξατο ergibt sich im modernen Deutsch natürlich „Dann begann er“.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: dem Volk … zu erzählen
  rationale: πρός bezeichnet hier die angesprochene Zuhörerschaft. Mit παραβολή als Gegenstand ist „ein Gleichnis erzählen“ idiomatischer als „sagen“.
- source_word: τὴν παραβολὴν ταύτην
  choice: dieses Gleichnis
  rationale: „Gleichnis“ ist die etablierte und sachlich passende Wiedergabe von παραβολή im Evangelienkontext.
- source_word: Ἄνθρωπος
  choice: Ein Mann
  rationale: Das maskuline Singularwort führt eine konkrete männliche Gestalt der Erzählung ein; „ein Mensch“ klänge hier weniger natürlich und würde das Geschlecht unnötig verallgemeinern.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: pflanzte einen Weinberg
  rationale: Die direkte Wiedergabe bewahrt das anschauliche Bild und ist im Deutschen verständlich und idiomatisch.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: verpachtete ihn an Weinbauern
  rationale: ἐκδίδωμι bezeichnet hier die Überlassung gegen Pacht; γεωργοί sind die Bewirtschafter. „Weinbauern“ präzisiert ihre Tätigkeit aus dem ausdrücklich genannten Weinberg, ohne sie bloß als Pächter zu bezeichnen.
- source_word: ἀπεδήμησεν
  choice: verreiste
  rationale: Das Verb bezeichnet das Fortgehen vom Heimatort und kann eine Reise ins Ausland einschließen. „Verreiste“ bewahrt die räumliche Reichweite offen.
- source_word: χρόνους ἱκανούς
  choice: für längere Zeit
  rationale: Der idiomatische Plural bezeichnet eine beträchtliche Dauer; „für längere Zeit“ klingt natürlich, ohne die Dauer genauer festzulegen.
theological_decisions:
- issue: Geschlecht der einleitenden Gestalt (Ἄνθρωπος)
  choice: Ein Mann
  alternative: Ein Mensch
  rationale: Der Text führt eine einzelne männliche Figur ein. Die Übersetzung wahrt diese grammatisch und erzählerisch erkennbare Geschlechtsangabe, ohne darüber hinaus eine theologische Identifizierung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber durch „ein Gleichnis erzählen“ und „für längere Zeit“ natürlich deutsch gestaltet.
