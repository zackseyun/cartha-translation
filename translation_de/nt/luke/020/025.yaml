id: LUK.20.25
reference: Luke 20:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Dann gebt dem Kaiser zurück, was dem Kaiser gehört, und Gott, was Gott gehört.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann gebt dem Kaiser, was ihm zusteht, und Gott, was ihm zusteht.“ Das Verb kann „geben“, „entrichten“ oder „zurückgeben, was geschuldet ist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Er aber sagte zu ihnen
  rationale: δέ ist leicht adversativ oder fortführend; „aber“ passt zum Gesprächsverlauf, ohne einen starken Gegensatz zu erzwingen. πρὸς αὐτούς wird mit dem deutschen Redeidiom „zu ihnen“ wiedergegeben.
- source_word: Τοίνυν
  choice: Dann
  rationale: Τοίνυν leitet eine folgernde oder wiederaufnehmende Schlussfolgerung ein. „Dann“ bewahrt diese rhetorische Funktion in natürlichem modernem Deutsch.
- source_word: ἀπόδοτε
  choice: gebt … zurück
  rationale: ἀποδίδωμι kann bedeuten, etwas zu geben, zu entrichten oder als Geschuldetes zurückzugeben. „Zurückgeben“ macht den Rückgabe- bzw. Schuldcharakter sichtbar, ohne die Aussage auf Steuern zu verengen.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: dem Kaiser …, was dem Kaiser gehört
  rationale: Die substantivierte Wendung bezeichnet allgemein das, was dem Kaiser zugehört. Die deutsche Formulierung ist natürlich und bewahrt den weiten Umfang.
- source_word: Καίσαρος / Καίσαρι
  choice: dem Kaiser
  rationale: Καῖσαρ fungiert hier als kaiserlicher Titel. Das geläufige deutsche „Kaiser“ gibt die Referenz verständlich und sachgerecht wieder.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Gott, was Gott gehört
  rationale: Die Formulierung spiegelt den Parallelismus zum Kaisersatz und bewahrt die offene Reichweite dessen, was Gott zusteht.
theological_decisions:
- issue: Politische und theologische Reichweite des Ausspruchs
  choice: Die parallele Verpflichtung gegenüber dem Kaiser und gegenüber Gott bleibt bestehen, ohne die Grenzen beider Ansprüche näher festzulegen.
  alternative: Die Aussage ausschließlich auf Steuerzahlung zu beschränken, als strikte Trennung von Religion und Staat zu lesen oder als unbegrenzte Legitimation staatlicher Autorität wiederzugeben.
  rationale: Der griechische Text fordert, jedem das ihm Zugehörige zu geben, entwickelt jedoch keine vollständige politische Theorie. Die Übersetzung bewahrt daher Breite und Spannung der Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Satzform erhält die prägnante Gegenüberstellung des griechischen Textes; „was … gehört“ klingt natürlicher als „die Dinge des …“.
