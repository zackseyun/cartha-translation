  to: Zur rechten Zeit schickte er einen Sklaven[a] zu den Weinbauern, damit sie ihm etwas von den Früchten des Weinbergs geben sollten. Doch die Weinbauern schlugen ihn und schickten ihn mit leeren Händen fort.[b]
  rationale: Die Überarbeitung verbessert die idiomatische und grammatische Wiedergabe des Zeit- und Zwecksatzes und verwendet mit „Früchten“ die engere lexikalische Entsprechung zu καρπός. Die Aussage, die soziale Bezeichnung und die Reihenfolge der Handlungen bleiben unverändert.
