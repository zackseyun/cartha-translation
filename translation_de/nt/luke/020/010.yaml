source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: de
  text: Zur rechten Zeit schickte er einen Sklaven[a] zu den Weinbauern, damit sie ihm etwas von den Früchten des Weinbergs geben sollten. Doch die Weinbauern schlugen ihn und schickten ihn mit leeren Händen fort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Diener“. Das griechische Wort bezeichnet hier einen unfreien, seinem Herrn unterstellten Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „schickten ihn leer fort“, also ohne ihm etwas von den Früchten des Weinbergs zu geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: als die Zeit gekommen war
  rationale: Die Zeitangabe bezeichnet den passenden beziehungsweise bestimmten Zeitpunkt, ohne ausdrücklich die Erntezeit zu nennen. Die deutsche Formulierung ist natürlich und wahrt diese Offenheit.
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: Das einfache Verb „schicken“ gibt den Aorist von ἀποστέλλω in diesem Zusammenhang klar und idiomatisch wieder.
- source_word: γεωργούς
  choice: Weinbauern
  rationale: Im Zusammenhang mit einem Weinberg bezeichnet das Wort die dort arbeitenden Landwirte. „Weinbauern“ erhält die landwirtschaftliche Besonderheit, ohne den rechtlichen Status als Pächter ausdrücklich in das Wort hineinzulegen.
- source_word: δοῦλον
  choice: Sklaven
  rationale: δοῦλος bezeichnet hier eine unfreie, dem Besitzer unterstellte Person. „Sklave“ bewahrt diesen sozialen Status deutlicher als das mildere „Diener“.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: damit sie ihm ... gäben
  rationale: Die Konstruktion drückt den Zweck der Sendung aus. Der deutsche Konjunktiv im abhängigen Zwecksatz klingt würdig und verständlich.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: einen Teil vom Ertrag des Weinbergs
  rationale: ἀπό mit Genitiv hat hier einen partitiven Sinn. „Ertrag“ bezeichnet die hervorgebrachten Früchte natürlich, ohne eine bestimmte rechtliche Quote festzulegen.
- source_word: ἐξαπέστειλαν
  choice: schickten ihn ... fort
  rationale: Die Zusammensetzung bezeichnet ein Weg- beziehungsweise Fortschicken und wird durch „fortschicken“ präzise wiedergegeben.
- source_word: δείραντες
  choice: schlugen ihn
  rationale: δέρω bezeichnet hier körperliches Schlagen beziehungsweise Misshandeln, ohne zwingend eine bestimmte Form wie Auspeitschen festzulegen.
- source_word: κενόν
  choice: mit leeren Händen
  rationale: Wörtlich bedeutet κενός „leer“; die deutsche Wendung verdeutlicht idiomatisch, dass der Sklave nichts vom Ertrag erhielt.
