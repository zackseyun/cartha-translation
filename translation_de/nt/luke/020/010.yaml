  terminology: „Weinbauern“ ist eine vertretbare kontextuelle Wiedergabe von γεωργοί. „Sklave“ bewahrt die Bedeutung von δοῦλος; die Fußnote nennt angemessen „Diener“ als mögliche, aber weniger präzise Alternative. „Früchte des Weinbergs“ folgt καρπός genauer als „Ertrag“.
