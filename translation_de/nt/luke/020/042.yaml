source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: de
  text: 'Denn David selbst sagt im Buch der Psalmen: »Der Herr[a] sagte zu meinem Herrn: Setze dich zu meiner Rechten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem Hebräischen von Psalm 110,1: »Der HERR sagte zu meinem Herrn: Setze dich zu meiner Rechten.«'
    reason: Die griechische Fassung hat κύριος (»Herr«), während die hebräische Vorlage an der ersten Stelle den Gottesnamen JHWH verwendet.
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Denn David selbst
  rationale: γάρ leitet die Begründung ein und wird mit »denn« wiedergegeben; αὐτός hebt David hervor und entspricht natürlich »selbst«.
- source_word: Δαυὶδ
  choice: David
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens der Zitierformel bleibt als literarisches Präsens erhalten.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: im Buch der Psalmen
  rationale: Die Formulierung bildet βίβλος mit dem Genitiv Plural ψαλμῶν genau und idiomatisch ab.
- source_word: Εἶπεν
  choice: sagte
  rationale: Der Aorist im Psalmzitat wird mit dem deutschen Präteritum wiedergegeben.
- source_word: κύριος
  choice: der Herr
  rationale: Die griechische Vorlage hat κύριος; »der Herr« folgt ihr unmittelbar, ohne den hebräischen Gottesnamen stillschweigend in den Haupttext einzutragen.
- source_word: τῷ κυρίῳ μου
  choice: zu meinem Herrn
  rationale: Der Dativ bezeichnet den Adressaten; »meinem Herrn« bewahrt sowohl den Besitzbezug als auch die für das Argument wichtige Wiederholung von »Herr«.
- source_word: Κάθου
  choice: Setze dich
  rationale: Der Imperativ von κάθημαι wird im modernen Deutschen natürlich und würdig mit »Setze dich« wiedergegeben.
- source_word: ἐκ δεξιῶν μου
  choice: zu meiner Rechten
  rationale: Die feste deutsche Wendung gibt die idiomatische Bedeutung der Ehrenposition an der rechten Seite prägnant wieder.
theological_decisions:
- issue: Erstes κύριος im Zitat von Psalm 110,1, dessen hebräische Vorlage den Gottesnamen JHWH hat
  choice: der Herr
  alternative: der HERR
  rationale: Der Haupttext folgt der vorliegenden griechischen Form κύριος. Eine Fußnote macht transparent, dass im Hebräischen von Psalm 110,1 der Gottesname steht.
- issue: Zweites κύριος in dem christologisch bedeutsamen Zitat
  choice: meinem Herrn
  alternative: meinem Gebieter
  rationale: »Herr« bewahrt die Wiederholung des griechischen κύριος und die theologische Spannung, ohne die Identität des Angesprochenen über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und zugleich natürliche Wendung »zu meiner Rechten« bewahrt den biblischen Bildgehalt. Die direkte Rede wird mit deutschen Anführungszeichen und einem Doppelpunkt klar gegliedert.
