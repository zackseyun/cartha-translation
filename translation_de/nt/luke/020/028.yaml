  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: de
  text: 'Sie sagten: „Lehrer, Mose hat uns vorgeschrieben: Wenn jemandes Bruder stirbt, der eine Frau hat[a] und kinderlos ist, soll sein Bruder die Frau nehmen und seinem Bruder Nachkommen erwecken[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Frau hinterlässt“; wörtlich heißt es im Griechischen: „stirbt, während er eine Frau hat“.'
    reason: lexical_alternative
  - marker: b
    text: '„Nachkommen erwecken“ greift die Rechtssprache aus 5. Mose 25,5 auf: Dem verstorbenen Bruder sollen Nachkommen in seinem Namen gegeben werden; wörtlich: „Samen erwecken“.'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede Jesu wird schlicht und gegenwärtig wiedergegeben; „Meister“ könnte im heutigen Deutsch zusätzliche Bedeutungen anklingen lassen.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Mose hat für uns geschrieben
  rationale: Der Dativ ἡμῖν bezeichnet hier am ehesten die Geltung beziehungsweise den Nutzen der für Israel niedergeschriebenen Weisung, nicht die Empfänger eines Briefes.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: Wenn jemandes Bruder stirbt
  rationale: τινος ist unbestimmt und allgemein; „jemandes“ bewahrt diese generische Einzahl ohne unnötige Ausweitung.
- source_word: ἔχων γυναῖκα
  choice: der eine Frau hat
  rationale: Dies bildet das Partizip und seinen wörtlichen Sinn eng nach. Das idiomatischere „eine Frau hinterlässt“ ist kontextuell plausibel, aber stärker auslegend und wird deshalb in einer Fußnote genannt.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: und kinderlos ist
  rationale: οὗτος verweist auf den verstorbenen Bruder; „kinderlos“ gibt ἄτεκνος prägnant wieder, ohne die Art oder das Geschlecht möglicher Kinder näher zu bestimmen.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: soll sein Bruder die Frau nehmen
  rationale: Die Formulierung wahrt den rechtlichen Verpflichtungscharakter der angeführten Weisung und bleibt zugleich näher am griechischen „nehmen“ als die explizitere Wiedergabe „heiraten“.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: Nachkommen erwecken
  rationale: Die Wendung bewahrt das rechtlich-biblische Bild von ἐξαναστήσῃ, während „Nachkommen“ das heute missverständliche wörtliche „Samen“ verständlich wiedergibt.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: Der Dativ bezeichnet, wem die Nachkommenschaft zugerechnet beziehungsweise zu wessen Gunsten sie erweckt wird; die knappe deutsche Form wahrt diese Beziehung.
theological_decisions:
- issue: Wiedergabe der Rechtsformel zur Schwagerehe ohne spätere kulturelle oder konfessionelle Deutung
  choice: „soll sein Bruder die Frau nehmen und seinem Bruder Nachkommen erwecken“
  alternative: „muss sein Bruder die Witwe heiraten und für seinen Bruder Kinder zeugen“
  rationale: Die gewählte Fassung lässt den rechtlichen Charakter der Anspielung auf Deuteronomium 25,5 erkennen, ohne „Frau“ ausdrücklich zu „Witwe“ oder die bildhafte Wendung zu einer biologisch erklärenden Paraphrase auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erkennbarem rechtlichem Ton. Die Satzstruktur bleibt quellennah, ohne unnatürlich archaisch zu werden. Die echte Spannung zwischen dem wörtlichen „eine Frau haben“ und dem kontextuell naheliegenden „eine Frau hinterlassen“ wird durch die Fußnote offengehalten.
