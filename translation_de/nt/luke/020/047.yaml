  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: de
  text: die die Häuser der Witwen verschlingen und zum Schein[a] lange beten. Sie werden ein umso strengeres Urteil[b] empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unter einem Vorwand; oder: als Vorwand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: eine umso schwerere Verurteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: verschlingen
  rationale: Die bildhafte, scharf anklagende Sprache bezeichnet rücksichtslose Ausbeutung und wird im Deutschen anschaulich bewahrt.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: die Häuser der Witwen
  rationale: Die Übersetzung bleibt bei der konkreten Formulierung des Griechischen; „Häuser“ kann dabei metonymisch für Hausstand oder Besitz stehen.
- source_word: προφάσει
  choice: zum Schein
  rationale: Die knappe deutsche Wendung gibt den Gedanken eines vorgetäuschten frommen Anscheins natürlich wieder, ohne den genauen Zweck der langen Gebete weiter festzulegen.
- source_word: μακρὰ προσεύχονται
  choice: lange beten
  rationale: μακρά ist adverbial gebraucht und bezeichnet die Dauer des Betens; die einfache Formulierung entspricht dem Griechischen.
- source_word: λήμψονται
  choice: werden … empfangen
  rationale: Die Zukunftsform bezeichnet das Urteil, das ihnen als Folge ihres Handelns zuteilwerden wird; „empfangen“ wahrt den feierlichen Ton.
- source_word: περισσότερον κρίμα
  choice: ein umso strengeres Urteil
  rationale: Der Komparativ bezeichnet ein gesteigertes beziehungsweise schwereres Gerichtsurteil. „Urteil“ bewahrt die Bedeutungsbreite von κρίμα, während „strengeres“ den negativen Kontext deutlich macht.
theological_decisions:
- issue: Bedeutung von κρίμα im Zusammenhang
  choice: Urteil
  alternative: Verurteilung
  rationale: Der Zusammenhang macht klar, dass ein nachteiliges göttliches Urteil gemeint ist. „Urteil“ hält dennoch die lexikalische Weite des griechischen Wortes offen, statt sie vollständig auf „Verurteilung“ zu verengen.
- issue: Funktion von προφάσει
  choice: zum Schein
  alternative: unter einem Vorwand / als Vorwand
  rationale: Die Formulierung kennzeichnet die langen Gebete als unecht oder zur Schau gestellt, ohne zusätzlich festzulegen, welchem konkreten ausbeuterischen Zweck sie als Vorwand dienen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die eindringliche Metapher „Häuser … verschlingen“ und der Anschluss durch das einleitende Relativpronomen werden beibehalten.
