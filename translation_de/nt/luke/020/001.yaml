id: LUK.20.1
reference: Luke 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: de
  text: 'Und es geschah an einem dieser Tage: Während Jesus das Volk im Tempel[a] lehrte und die gute Botschaft verkündete[b], traten die führenden Priester und die Schriftgelehrten zusammen mit den Ältesten an ihn heran,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet hier das gesamte Tempelgelände, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „das Evangelium verkündete“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Und es geschah
  rationale: Bewahrt den für Lukas typischen erzählerischen Übergang in würdiger, noch gut verständlicher Form.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: an einem dieser Tage
  rationale: Gibt die unbestimmte Zeitangabe und ihren Bezug zum laufenden Geschehen natürlich wieder.
- source_word: διδάσκοντος αὐτοῦ
  choice: Während Jesus … lehrte
  rationale: Gibt den Genitivus absolutus als gleichzeitigen Umstand wieder; der Eigenname macht den deutschen Satzbezug eindeutig.
- source_word: τὸν λαὸν
  choice: das Volk
  rationale: λαός bezeichnet hier das Volk allgemein und nicht lediglich eine Menschenmenge.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: Die geläufige deutsche Kurzform ist im Haupttext natürlich; eine Fußnote erläutert, dass das gesamte Tempelgelände gemeint ist.
- source_word: εὐαγγελιζομένου
  choice: die gute Botschaft verkündete
  rationale: Bewahrt die verbale Bedeutung des öffentlichen Bekanntmachens guter Nachricht und vermeidet unnötig kirchliche Fachsprache.
- source_word: ἐπέστησαν
  choice: traten … an ihn heran
  rationale: Drückt das direkte Herankommen aus, ohne eine feindselige Konfrontation stärker zu behaupten, als das Verb selbst verlangt.
- source_word: ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die leitenden Angehörigen der damaligen Priesterschaft, nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Die etablierte historische Gruppenbezeichnung ist präzise und im Deutschen allgemein verständlich.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: zusammen mit den Ältesten
  rationale: Gibt die ausdrücklich bezeichnete Begleitung beziehungsweise das gemeinsame Auftreten der Führungsgruppen wieder.
theological_decisions:
- issue: Wiedergabe von εὐαγγελιζομένου im Bericht über Jesu öffentliches Wirken
  choice: die gute Botschaft verkündete
  alternative: das Evangelium predigte
  rationale: Die gewählte Formulierung erhält den Grundsinn des Verbs, ohne den Ausdruck vorschnell als späteren kirchlichen Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lukanische Erzählübergang bleibt sichtbar; die Partizipialkonstruktionen werden für einen natürlichen deutschen Satzbau als Temporalsatz wiedergegeben. Das abschließende Komma zeigt, dass der Satz in Vers 2 weitergeführt wird.
