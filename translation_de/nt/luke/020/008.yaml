base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihnen: »Auch ich sage euch nicht, mit welcher Vollmacht ich all dies tue.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Und Jesus sagte zu ihnen
  rationale: Die schlichte Erzählfortführung bewahrt καί und gibt εἶπεν mit dem Dativ αὐτοῖς natürlich und quellennah wieder.
- source_word: Οὐδὲ ἐγώ
  choice: Dann sage auch ich ... nicht
  rationale: Οὐδέ verbindet Jesu Antwort mit der vorausgehenden Weigerung der Gesprächspartner. Im Deutschen gibt »Dann ... auch ich ... nicht« die responsive Entsprechung idiomatisch wieder, ohne einen im Griechischen nicht ausdrücklich markierten Futur einzuführen.
- source_word: λέγω ὑμῖν
  choice: sage ... euch
  rationale: »Euch sagen« bildet λέγω mit dem Dativ direkt ab und ist in diesem Satz natürlich; »euch mitteilen« wäre ebenfalls möglich, aber stärker auslegend.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kraft welcher Vollmacht
  rationale: »Kraft« bezeichnet die Grundlage oder Berechtigung des Handelns; »Vollmacht« erfasst hier rechtmäßige beziehungsweise übertragene Autorität statt bloßer Macht.
- source_word: ταῦτα ποιῶ
  choice: ich dies tue
  rationale: Das deutsche Singularpronomen »dies« kann sich zusammenfassend auf die im Kontext strittigen Handlungen beziehen; »diese Dinge« wäre formaler, klingt im modernen Deutsch jedoch schwerfällig. Das Präsens von ποιῶ bleibt erhalten.
theological_decisions:
- issue: Jesu Weigerung, die Frage nach seiner Vollmacht zu beantworten
  choice: Als unmittelbare, zur vorausgehenden Weigerung korrespondierende Nichtauskunft wiedergeben
  alternative: Die Antwort ausdrücklich als Ausweichen oder als Gericht über den Unglauben der Fragenden deuten
  rationale: Der Vers nennt keine Begründung für Jesu Weigerung. Die Übersetzung bewahrt daher die rhetorische Spannung, ohne ein moralisches oder theologisches Urteil hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Kraft welcher Vollmacht« ist gehoben, aber allgemein verständlich und entspricht der pointierten Streitfrage. Keine Fußnote ist nötig, da die deutsche Formulierung die relevante Bedeutungsbreite hinreichend abdeckt.
