  to: 'Und Jesus sagte zu ihnen: »Auch ich sage euch nicht, mit welcher Vollmacht ich all dies tue.«'
  rationale: Die Revision vermeidet die über das Griechische hinausgehende Folgerungsmarkierung »Dann«, erhält mit »Auch ich ... nicht« die an die vorausgehende Weigerung anknüpfende rhetorische Entsprechung und macht den Plural von ταῦτα durch »all dies« sichtbar. Die idiomatische Wendung »mit welcher Vollmacht« bewahrt die Bedeutung von ἐν ποίᾳ ἐξουσίᾳ; die mögliche Nuance der Grundlage wird als Fußnotenalternative ausgewiesen.
