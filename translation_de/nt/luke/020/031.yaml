  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: de
  text: Und der dritte nahm sie zur Frau[a]. Ebenso hinterließen auch alle sieben keine Kinder und starben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nahm sie«. In diesem Zusammenhang ist damit gemeint, dass er sie zur Frau nahm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: der dritte
  rationale: Der griechische Text wiederholt »Bruder« nicht. Die Ellipse ist auch im Deutschen verständlich und wird daher bewahrt.
- source_word: ἔλαβεν αὐτήν
  choice: nahm sie zur Frau
  rationale: Im Zusammenhang der Leviratsehe bezeichnet das griechische »sie nehmen« die Aufnahme der Frau als Ehefrau. »Nahm sie zur Frau« bewahrt das Bild des Originals und ist im Deutschen eindeutig und natürlich.
- source_word: ὡσαύτως δὲ καὶ
  choice: ebenso … auch
  rationale: Die Formulierung führt die Reihe fort und betont, dass es bei den übrigen Brüdern genauso geschah.
- source_word: οἱ ἑπτὰ
  choice: alle sieben
  rationale: Gemeint ist die gesamte zuvor genannte Gruppe der sieben Brüder; »alle sieben« gibt diesen umfassenden Sinn idiomatisch wieder.
- source_word: οὐ κατέλιπον τέκνα
  choice: hinterließen … keine Kinder
  rationale: καταλείπω bezeichnet hier Kinder, die nach dem Tod zurückbleiben. »Hinterließen keine Kinder« wahrt diesen Bezug zum Sterben deutlicher als »hatten keine Kinder«.
- source_word: ἀπέθανον
  choice: starben
  rationale: Die direkte und schlichte Wiedergabe entspricht dem griechischen Verb.
theological_decisions: []
