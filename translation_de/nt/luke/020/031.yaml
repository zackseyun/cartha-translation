  register: Modernes, würdiges Standarddeutsch. Die im Griechischen vorhandene Auslassung von »Bruder« bleibt erhalten; das Ehe-Idiom wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert.
