  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: de
  text: 'Wenn wir aber sagen: ›Von Menschen‹, wird uns das ganze Volk steinigen; denn es ist überzeugt, dass Johannes ein Prophet ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass Johannes ein Prophet war“. Der griechische Infinitiv legt die Zeitstufe nicht ausdrücklich fest; „ist“ gibt den gegenwärtigen Bezug zur Überzeugung des Volkes wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Wenn wir aber sagen
  rationale: ἐάν mit Aorist Konjunktiv bezeichnet eine reale Möglichkeit; „wenn wir aber sagen“ ist im Deutschen natürlich und bewahrt die weiterführend-adversative Kraft von δέ.
- source_word: Ἐξ ἀνθρώπων
  choice: Von Menschen
  rationale: Die knappe, elliptische Wendung verweist auf den menschlichen Ursprung der Taufe beziehungsweise Vollmacht des Johannes und entspricht formal dem griechischen Ausdruck.
- source_word: ὁ λαὸς ἅπας
  choice: das ganze Volk
  rationale: λαός bezeichnet hier das Volk als Kollektiv; ἅπας unterstreicht dessen Gesamtheit. „Das ganze Volk“ ist idiomatisches Standarddeutsch.
- source_word: καταλιθάσει
  choice: wird uns steinigen
  rationale: Das Verb bezeichnet das Steinigen. Die Übersetzung fügt weder „zu Tode“ noch eine andere im Ausgangstext nicht ausdrücklich genannte Präzisierung hinzu.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: denn es ist überzeugt
  rationale: Das singularische Partizip mit ἐστιν stimmt mit dem kollektiv verstandenen Singular „das ganze Volk“ überein; deshalb ist auch im Deutschen der Singular passend.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: dass Johannes ein Prophet war
  rationale: Der Akkusativ mit Infinitiv wird im Deutschen als dass-Satz wiedergegeben. „War“ passt zur Erzählperspektive und zur bereits zurückliegenden Tätigkeit des Johannes; der Infinitiv εἶναι legt selbst keine zeitliche Einordnung fest.
theological_decisions:
- issue: Zeitliche Wiedergabe der Überzeugung über Johannes
  choice: dass Johannes ein Prophet war
  alternative: dass Johannes ein Prophet ist
  rationale: Der griechische Infinitiv εἶναι markiert hier nicht selbst eine Zeitstufe. „War“ ist mit Blick auf die zurückliegende Wirksamkeit des Johannes natürlich; „ist“ kann die zur Redezeit fortbestehende Überzeugung hervorheben. Die Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bildet die elliptische Form des Griechischen ab; „das ganze Volk“ wahrt den kollektiven Singular des Ausgangstextes.
