  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: de
  text: Es waren nun sieben Brüder. Der erste heiratete und starb kinderlos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτὰ
  choice: sieben
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: οὖν
  choice: also
  rationale: Gibt die folgernde beziehungsweise fortführende Funktion im Zusammenhang natürlich wieder, ohne daraus eine Zeitangabe zu machen.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Der männliche Plural bezeichnet im Kontext der Leviratsehe konkret Brüder.
- source_word: ὁ πρῶτος
  choice: der erste
  rationale: Bezeichnet den ersten Bruder in der Abfolge, nicht ausdrücklich den ältesten.
- source_word: λαβὼν γυναῖκα
  choice: nahm eine Frau
  rationale: Bewahrt die griechische Heiratswendung in einer im Deutschen verständlichen, biblisch angemessenen Form; im Kontext ist eindeutig gemeint, dass er sie heiratete.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Schlichte und direkte Wiedergabe des Aorists.
- source_word: ἄτεκνος
  choice: kinderlos
  rationale: Prägnante deutsche Wiedergabe des prädikativen Adjektivs mit seiner für den Zusammenhang wichtigen Bedeutung.
