source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: de
  text: Denn sie können auch nicht mehr sterben, weil sie den Engeln gleich sind und als Söhne der Auferstehung Söhne Gottes sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die maskuline Pluralform „Söhne“ bezeichnet hier Status und Zugehörigkeit; sie beschränkt die Aussage nicht auf Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται
  choice: Denn sie können auch nicht mehr sterben
  rationale: Die Wiedergabe erhält sowohl den erklärenden Anschluss durch γάρ als auch das additive οὐδέ („auch nicht“). δύνανται mit Infinitiv bezeichnet Unvermögen beziehungsweise fehlende Möglichkeit; ἔτι bedeutet hier „noch/mehr“ im Sinn des Endes der Sterblichkeit.
- source_word: ἰσάγγελοι
  choice: den Engeln gleich
  rationale: Das seltene Adjektiv bezeichnet Gleichheit beziehungsweise Vergleichbarkeit mit Engeln, nicht die Verwandlung in Engel. „Den Engeln gleich“ ist präzise, würdig und im Deutschen natürlich.
- source_word: υἱοί ... θεοῦ
  choice: Söhne Gottes
  rationale: Das ausdrücklich maskuline υἱοί wird beibehalten und bewahrt zugleich die Wiederholung mit „Söhne der Auferstehung“. Eine Fußnote erläutert, dass die Statusbezeichnung nicht nur Männer einschließt.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: da sie Söhne der Auferstehung sind
  rationale: Die Genitivmetapher wird formal bewahrt. „da“ gibt den naheliegenden begründenden Sinn des Partizips wieder, ohne eine weitergehende dogmatische Erklärung einzutragen.
- source_word: γάρ ... γάρ
  choice: Denn ... weil
  rationale: Das erste γάρ verbindet den Vers erklärend mit dem vorangehenden Satz; das zweite begründet die Aussage über das Nicht-mehr-Sterben. Die Variation vermeidet im Deutschen eine schwerfällige Wiederholung.
theological_decisions:
- issue: Filiale Sprache im Zusammenhang der Auferstehung
  choice: „Söhne Gottes“ und „Söhne der Auferstehung“ im Haupttext beibehalten
  alternative: „Kinder Gottes“ und „Kinder der Auferstehung“
  rationale: Die zweimalige Metapher mit υἱοί bezeichnet Zugehörigkeit, Status und Identität. Ihre Wiederholung ist rhetorisch bedeutsam. Die maskuline Form wird daher nicht eingeebnet; zugleich stellt die Fußnote klar, dass die Aussage nicht auf Männer beschränkt ist.
- issue: Art der Ähnlichkeit mit Engeln
  choice: „den Engeln gleich“
  alternative: „wie die Engel“
  rationale: ἰσάγγελοι sagt Gleichheit beziehungsweise Vergleichbarkeit in dem hier genannten Zusammenhang aus, nicht Identität mit Engeln. Die Übersetzung lässt den genauen Umfang dieser Gleichheit offen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau folgt dem griechischen Begründungsgang, ohne unnatürlich zu wirken. Die wiederholte Sohnesmetapher und ihre theologische Spannung bleiben erhalten.
