id: LUK.20.34
reference: Luke 20:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: de
  text: 'Und Jesus sagte zu ihnen: »Die Menschen dieser Weltzeit[a] heiraten und werden verheiratet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Söhne dieser Weltzeit«; eine männliche repräsentative Ausdrucksweise für die Menschen, die der gegenwärtigen Weltzeit angehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Gibt den Aorist von λέγω und den Dativ αὐτοῖς unmittelbar und natürlich wieder; der Kontext ist zwar eine Erwiderung, doch das Verb selbst bedeutet schlicht „sagen“.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Die Menschen dieser Weltzeit
  rationale: Das semitisch geprägte „Söhne dieser Weltzeit“ bezeichnet hier diejenigen, die der gegenwärtigen Weltzeit angehören. „Menschen“ macht den repräsentativen, nicht ausschließlich männlichen Bezug im heutigen Deutsch verständlich; „Weltzeit“ erhält den eschatologischen Gegensatz zur kommenden Weltzeit.
- source_word: γαμοῦσιν
  choice: heiraten
  rationale: Natürliche deutsche Wiedergabe des aktiven Verbs für das Eingehen einer Ehe.
- source_word: γαμίσκονται
  choice: werden verheiratet
  rationale: Bewahrt die passive Form und damit die im griechischen Wortpaar ausgedrückte Unterscheidung, ohne sie durch eine ausführliche Deutung aufzulösen.
theological_decisions:
- issue: Generisches Maskulinum in υἱοὶ
  choice: Die Menschen dieser Weltzeit
  alternative: Die Söhne dieser Weltzeit
  rationale: υἱοὶ ist grammatisch männlich, wird hier aber repräsentativ für die Angehörigen der gegenwärtigen Weltzeit gebraucht. Die Hauptfassung vermittelt den gemeinten Umfang natürlich; die Fußnote dokumentiert die wörtliche Form.
- issue: αἰών als eschatologische Kategorie
  choice: Weltzeit
  alternative: Zeitalter; Welt
  rationale: „Weltzeit“ bezeichnet die gegenwärtige Ordnung beziehungsweise Epoche und bewahrt den für den Zusammenhang wichtigen Gegensatz zur kommenden Weltzeit. „Welt“ könnte fälschlich vor allem räumlich verstanden werden.
- issue: Aktiv-passives Paar γαμοῦσιν / γαμίσκονται
  choice: heiraten und werden verheiratet
  alternative: heiraten
  rationale: Die Formulierung erhält die sprachliche Asymmetrie des Ausgangstextes und trägt den damaligen gesellschaftlichen Heiratskonventionen Rechnung, ohne daraus eine weitergehende Lehraussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weltzeit“ ist etwas gehobener, aber verständlich und im Kontext präziser als das räumlich missverständliche „Welt“. Die direkte Rede folgt deutscher Zeichensetzung.
