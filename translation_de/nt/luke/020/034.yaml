  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente wieder: die narrative Verknüpfung, Jesu Rede an die Angesprochenen, die Zugehörigkeit zur gegenwärtigen eschatologischen Weltzeit sowie das aktive/passive Verbpaar γαμοῦσιν / γαμίσκονται. „Menschen“ gibt die hier repräsentativ gebrauchten „Söhne“ sachgerecht wieder; die Fußnote dokumentiert die wörtliche Form.'
