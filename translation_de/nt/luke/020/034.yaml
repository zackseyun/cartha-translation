  terminology: „Weltzeit“ bewahrt αἰών als Bezeichnung der gegenwärtigen Ordnung bzw. Epoche. Die Fußnote erklärt zutreffend, dass „Söhne“ keine Beschränkung auf männliche Personen ausdrückt. Das aktiv-passive Heiratswortpaar wird ohne weitergehende gesellschaftliche oder lehrmäßige Deutung beibehalten.
