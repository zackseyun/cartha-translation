  text: Later[a], the woman also died.
translation:
  language: de
  text: Später starb auch die Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: Später
  rationale: Das Adverb bezeichnet einen späteren Zeitpunkt in der erzählten Abfolge. „Später“ ist im modernen Deutschen natürlich und legt nicht genauer fest, wie viel Zeit verging.
- source_word: καὶ
  choice: auch
  rationale: Hier hebt καί hervor, dass nach den Brüdern ebenso die Frau starb. „Auch“ gibt diese additive Bedeutung im Deutschen klar wieder.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. In der Geschichte war sie nacheinander mit mehreren Brüdern verheiratet; „die Frau“ bezeichnet sie eindeutig, ohne sie nur einem bestimmten Mann zuzuordnen.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Die Aoristform berichtet ihren Tod schlicht als vergangenes Ereignis. „Starb“ entspricht der direkten Ausdrucksweise des Griechischen.
theological_decisions: []
