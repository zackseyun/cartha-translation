id: LUK.20.15
reference: Luke 20:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: de
  text: Nachdem sie ihn aus dem Weinberg hinausgeworfen hatten, töteten sie ihn. Was wird nun der Besitzer des Weinbergs[a] mit ihnen tun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herr des Weinbergs« beziehungsweise »Eigentümer des Weinbergs«. Das griechische Wort kyrios wird als Titel häufig mit »Herr« wiedergegeben; hier bezeichnet es innerhalb des Gleichnisses den menschlichen Besitzer des Weinbergs.'
    reason: Lexikalische Alternative und kontextuelle Klärung von κύριος.
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Nachdem sie ihn … hinausgeworfen hatten
  rationale: Das vorangestellte Aoristpartizip bezeichnet hier eine Handlung, die dem Töten vorausgeht. Die Konstruktion mit „nachdem“ gibt diese Abfolge in natürlichem Deutsch wieder und bewahrt zugleich die gewaltsame Ausstoßung.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: aus dem Weinberg hinaus
  rationale: Die Wendung bezeichnet die Bewegung vom Inneren nach draußen. „Aus dem Weinberg hinaus“ macht diese Richtung im Deutschen ausdrücklich.
- source_word: ἀπέκτειναν
  choice: töteten sie ihn
  rationale: Das Verb bedeutet schlicht „töten“. „Ermordeten“ würde eine zusätzliche rechtlich-moralische Wertung ausdrücklich machen, die im Verb selbst nicht eigens kodiert ist.
- source_word: τί οὖν
  choice: Was wird nun
  rationale: „Nun“ gibt die folgernde Funktion von οὖν idiomatisch wieder und leitet die Konsequenz aus dem geschilderten Handeln ein.
- source_word: ποιήσει … αὐτοῖς
  choice: wird … mit ihnen tun
  rationale: Im Deutschen ist „Was wird er mit ihnen tun?“ die natürliche Wiedergabe der weit gefassten Frage nach dem Vorgehen gegenüber den Weingärtnern. Das Dativpronomen αὐτοῖς wird dabei idiomatisch durch „mit ihnen“ ausgedrückt.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: der Besitzer des Weinbergs
  rationale: κύριος bezeichnet innerhalb des Gleichnisses den menschlichen Verfügungsberechtigten des Weinbergs. „Besitzer“ vermittelt diese kontextuelle Funktion verständlich, während die lexikalisch mögliche Wiedergabe „Herr“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe von κύριος bei einem menschlichen Referenten im Gleichnis
  choice: Besitzer
  alternative: Herr des Weinbergs; Eigentümer des Weinbergs
  rationale: Der unmittelbare Referent ist die menschliche Autoritätsperson über den Weinberg innerhalb der erzählten Welt. „Besitzer“ verhindert, dass κύριος an dieser Stelle schon in der Erzählform ausdrücklich als göttlicher Titel erscheint, ohne die mögliche theologische Bedeutung des Gleichnisses festzulegen. „Herr“ bleibt als formnähere Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Temporalsatz stellt die im griechischen Partizip angelegte Handlungsfolge klar dar. „Hinausgeworfen“ bewahrt die gewaltsame Nuance; „mit ihnen tun“ ist eine natürliche deutsche Formulierung für ποιήσει αὐτοῖς.
