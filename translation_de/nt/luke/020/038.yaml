- from: Er ist aber nicht ein Gott der Toten, sondern der Lebenden; denn für ihn leben alle.[a]
  to: Er ist aber nicht ein Gott der Toten, sondern der Lebenden; denn für ihn sind alle lebendig.[a]
  rationale: Die Revision klärt die im Deutschen sonst naheliegende finale Lesart von „für ihn leben“, während sie die semantisch verdichtete dative Beziehung des griechischen αὐτῷ und die präsentische Aussage ζῶσιν sachgerecht wiedergibt. Die Fußnote bleibt als nicht-dogmatische Anzeige der möglichen perspektivischen Nuance erhalten und wird an die betreffende Schlussaussage gebunden.
