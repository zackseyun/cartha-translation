id: LUK.20.38
reference: Luke 20:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: de
  text: Er ist aber nicht ein Gott der Toten, sondern der Lebenden; denn für ihn sind alle lebendig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn vor ihm sind alle lebendig.“'
    reason: Der Dativ αὐτῷ kann relational („für ihn“) oder perspektivisch („vor ihm“, das heißt aus seiner Sicht bzw. in seiner Gegenwart) verstanden werden.
lexical_decisions:
- source_word: θεὸς
  choice: Gott
  rationale: Das artikellose θεός ist im jüdisch-monotheistischen Zusammenhang bestimmt gemeint. Im Deutschen verlangt die Verbindung idiomatisch den Ausdruck „ein Gott der Toten“, ohne damit mehrere Götter anzudeuten.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier im Zusammenhang der verneinenden Gegenüberstellung einen milden Kontrast; „aber“ gibt diesen natürlich wieder, ohne ein nicht vorhandenes zeitliches „nun“ einzuführen.
- source_word: νεκρῶν
  choice: der Toten
  rationale: Der substantivierte Genitiv Plural wird knapp und idiomatisch mit „der Toten“ wiedergegeben.
- source_word: ζώντων
  choice: der Lebenden
  rationale: Die substantivierte Partizipialform bildet den direkten Gegenpol zu „der Toten“ und wird entsprechend mit „der Lebenden“ übersetzt.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ bewahrt die knappe und hinsichtlich ihres Umfangs nicht weiter bestimmte Aussage des Griechischen.
- source_word: αὐτῷ
  choice: für ihn
  rationale: Der Dativ ist semantisch verdichtet. „Für ihn“ ist im Deutschen verständlich und lässt offen, ob vor allem die Beziehung zu Gott oder das Lebendigsein aus seiner Perspektive gemeint ist.
- source_word: ζῶσιν
  choice: leben
  rationale: Das Präsens Aktiv wird direkt mit „leben“ wiedergegeben; „sind lebendig“ wäre ebenfalls möglich, aber stärker zustandsbezogen.
theological_decisions:
- issue: Bedeutung von αὐτῷ in πάντες γὰρ αὐτῷ ζῶσιν
  choice: denn für ihn leben alle
  alternative: denn vor ihm sind alle lebendig
  rationale: Der griechische Dativ erlaubt mehrere Nuancen. Die Hauptfassung bleibt nah an der relationalen Formulierung und vermeidet es, Jesu Auferstehungsargument durch eine ausführlichere dogmatische Deutung festzulegen; die alternative Deutung wird in einer Fußnote sichtbar gehalten.
- issue: Geltungsumfang von πάντες
  choice: alle
  alternative: sie alle
  rationale: Die unbestimmte Weite des griechischen Ausdrucks bleibt erhalten. Eine Beschränkung allein auf die zuvor genannten Patriarchen würde den möglichen allgemeinen Charakter der Aussage unnötig einengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Struktur des griechischen Satzes bleibt erhalten. Das Semikolon bildet die argumentative Begründung klar ab; die Fußnote bewahrt die echte Mehrdeutigkeit des Dativs.
