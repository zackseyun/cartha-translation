  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: de
  text: Stammte die Taufe des Johannes vom Himmel oder von Menschen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott“. Wörtlich steht im Griechischen „vom Himmel“, eine ehrfürchtige Umschreibung für göttlichen Ursprung oder göttliche Vollmacht.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: Taufe
  rationale: Das Substantiv bezeichnet die mit Johannes verbundene Taufhandlung beziehungsweise Taufpraxis. „Taufe“ ist dafür die übliche und präzise deutsche Entsprechung.
- source_word: Ἰωάννου
  choice: des Johannes
  rationale: Der Genitiv bezeichnet die Johannes zugeordnete Taufe; „die Taufe des Johannes“ ist im Deutschen natürlich und eindeutig.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die wörtliche Wendung wird bewahrt. Sie bezeichnet in ehrfürchtiger jüdischer Redeweise göttlichen Ursprung oder göttliche Vollmacht, ohne „Gott“ ausdrücklich einzusetzen.
- source_word: ἐξ ἀνθρώπων
  choice: von Menschen
  rationale: Der generische Plural bezeichnet menschlichen Ursprung im Gegensatz zum himmlisch-göttlichen. „Menschen“ ist geschlechtsübergreifend und im modernen Deutschen idiomatisch.
- source_word: ἦν
  choice: stammte
  rationale: Die Kopula mit den Herkunftsangaben wird im Deutschen natürlich als Frage nach Ursprung beziehungsweise Vollmacht wiedergegeben. „Stammte“ macht diesen Bezug klar, ohne den Sinn auszuweiten.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion stellt die beiden Alternativen direkt gegenüber.
theological_decisions:
- issue: Bedeutung von „vom Himmel“ für die Taufe des Johannes
  choice: Die idiomatische Formulierung „vom Himmel“ bleibt im Haupttext erhalten.
  alternative: „von Gott“
  rationale: Die Wendung deutet auf göttlichen Ursprung oder göttliche Bevollmächtigung, doch der griechische Text nennt ausdrücklich den Himmel. Die Beibehaltung wahrt die ehrfürchtige Umschreibung und vermeidet eine stillschweigende Auslegung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Formulierung „die Taufe des Johannes“ folgt dem etablierten biblischen Sprachgebrauch; „von Menschen“ gibt den generischen Plural ohne männliche Verengung wieder.
