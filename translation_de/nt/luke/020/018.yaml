  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: de
  text: Jeder, der auf jenen Stein fällt, wird zerschmettert[a]; doch auf wen er fällt, den wird er zermalmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in Stücke gebrochen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird ihn zu Staub zermalmen“ beziehungsweise „wird ihn wie Spreu zerstreuen“; das griechische Verb kann ein Zermalmen und Zerstreuen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Jeder, der … fällt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden, auf den die Aussage zutrifft. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den umfassenden Sinn.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: auf jenen Stein
  rationale: ἐπί mit Akkusativ bezeichnet nach πίπτω die Bewegung auf den Stein hin. „Jenen“ gibt die demonstrative Kraft von ἐκεῖνον wieder.
- source_word: συνθλασθήσεται
  choice: wird zerschmettert werden
  rationale: Das Futur Passiv bezeichnet ein Zerbrechen beziehungsweise Zerschlagen in Stücke. „Zerschmettert“ bewahrt die Schärfe des Bildes, ohne den Vorgang unnötig auszudeuten.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: doch auf wen er fällt
  rationale: 'Relativpronomen, ἄν und Aorist Konjunktiv ergeben eine unbestimmte Bedingung: auf wen auch immer der Stein fällt. Die deutsche Formulierung ist knapp und erhält die Umkehrung des Bildes.'
- source_word: λικμήσει
  choice: wird … zermalmen
  rationale: λικμάω kann das Zerkleinern und anschließende Zerstreuen wie beim Worfeln bezeichnen. „Zermalmen“ vermittelt im Haupttext die gegenüber einem bloßen Aufprall verstärkte Zerstörungswirkung; die weitere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: αὐτόν
  choice: den
  rationale: Das maskuline Singularpronomen greift den generisch gebrauchten Bezug „wen“ auf. Die deutsche Korrelativkonstruktion „auf wen …, den …“ bildet den Quellenbezug präzise und idiomatisch ab.
theological_decisions:
- issue: Gerichtsbild des Steins
  choice: Der Stein bleibt Träger eines vernichtenden Gerichtsbildes; die starken Verben werden nicht abgeschwächt.
  alternative: Die Aussage lediglich als Stolpern oder leichte Verletzung wiederzugeben.
  rationale: Im Zusammenhang mit dem zuvor angeführten Steinwort bezeichnen συνθλασθήσεται und λικμήσει eine einschneidende, zerstörerische Folge. Die Übersetzung wahrt diese Spannung, ohne die Identität oder Wirkungsweise des Steins im Vers zusätzlich auszulegen.
- issue: Generischer maskuliner Bezug
  choice: Die Konstruktion „auf wen …, den …“ wird verwendet.
  alternative: Eine pluralische oder ausdrücklich geschlechtsneutrale Umformung.
  rationale: Der griechische Text steht im maskulinen Singular mit allgemeiner, repräsentativer Bedeutung. Die gewählte deutsche Konstruktion bewahrt sowohl Numerus als auch generische Reichweite.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Satzbau hält die bildhafte Gegenüberstellung fest: zuerst fällt ein Mensch auf den Stein, dann fällt der Stein auf einen Menschen. „Jenen Stein“ bewahrt den Rückverweis und den demonstrativen Nachdruck des griechischen Textes.'
