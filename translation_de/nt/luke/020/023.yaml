  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: de
  text: 'Doch erkannte er ihre Hinterlist[a] und sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verschlagenheit“, „Arglist“ oder „Täuschungsmanöver“. Das griechische Wort bezeichnet klug berechnendes, gewissenloses Vorgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: durchschaute
  rationale: Das Aoristpartizip bezeichnet Jesu vorhergehendes Erkennen ihrer Absicht. „Durchschaute“ gibt in diesem Zusammenhang sowohl die Wahrnehmung als auch das Erfassen des verborgenen Plans natürlich wieder.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier den Kontrast zwischen ihrem Vorgehen und Jesu Reaktion; „Doch“ bildet diesen narrativen Gegensatz knapp und idiomatisch ab.
- source_word: αὐτῶν
  choice: ihre
  rationale: Der Genitiv gehört zu πανουργίαν und wird im Deutschen natürlich durch das Possessivpronomen wiedergegeben.
- source_word: πανουργίαν
  choice: Hinterlist
  rationale: πανουργία bezeichnet schlaue, moralisch verwerfliche und auf Täuschung zielende Planung. „Hinterlist“ bewahrt sowohl das planvolle als auch das negative Moment.
- source_word: εἶπεν
  choice: sagte
  rationale: Die übliche, natürliche Wiedergabe des narrativen Aorists von λέγω.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: πρός mit Akkusativ bezeichnet nach einem Redeverb die Angesprochenen; „zu ihnen“ ist im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Durchschaute“ vermeidet eine schwerfällige Partizipialkonstruktion und macht die zeitliche Abfolge natürlich deutlich; der Doppelpunkt führt unmittelbar in die folgende Rede.
