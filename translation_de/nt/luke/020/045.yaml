base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: de
  text: 'Während das ganze Volk zuhörte, sagte er zu den Jüngern:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούοντος
  choice: Während … zuhörte
  rationale: Das präsentische Partizip im Genitivus absolutus bezeichnet eine gleichzeitig andauernde Begleitumstandshandlung; „während … zuhörte“ gibt dies im Deutschen natürlich wieder.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches fortführendes Bindewort. Der Zusammenhang wird im Deutschen ohne ein ausdrückliches „und“ oder „nun“ flüssiger und ohne Bedeutungsverlust wiedergegeben.
- source_word: παντὸς τοῦ λαοῦ
  choice: das ganze Volk
  rationale: πᾶς mit dem singularischen λαός bezeichnet das Volk als Gesamtheit. „Das ganze Volk“ bewahrt den kollektiven Sinn und ist gegenüber „die ganze Menschenmenge“ quellennäher.
- source_word: εἶπεν
  choice: sagte er
  rationale: Der Aorist von λέγω bezeichnet hier schlicht den punktuellen Sprechakt in der Erzählung.
- source_word: τοῖς μαθηταῖς
  choice: zu den Jüngern
  rationale: „Jünger“ ist die etablierte und sachgerechte Wiedergabe von μαθηταί. Ein Possessivpronomen wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
theological_decisions:
- issue: Unterscheidung der Zuhörerschaft
  choice: Jesus spricht zu den Jüngern, während das ganze Volk zuhört.
  alternative: Jesus richtet die Aussage unmittelbar an das ganze Volk oder spricht getrennt und privat zu den Jüngern.
  rationale: Der Genitivus absolutus beschreibt das ganze Volk als zuhörende Öffentlichkeit, während der Dativ τοῖς μαθηταῖς die Jünger als direkte Adressaten bezeichnet. Beide Ebenen bleiben erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wahrt den öffentlichen Rahmen und benennt die Jünger klar als unmittelbare Adressaten. Keine Fußnote ist nötig, da die griechische Konstruktion eindeutig und natürlich wiedergegeben werden kann.
