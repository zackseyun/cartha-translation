  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: de
  text: David nennt ihn also »Herr«. Wie kann er dann sein Sohn[a] sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sein Nachkomme. Im Griechischen steht »sein Sohn«; »Sohn« kann hier auch einen dynastischen Nachkommen bezeichnen. Der Haupttext bewahrt jedoch den ausdrücklichen Wortlaut des Arguments.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: David
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus dem unmittelbar zuvor angeführten Psalm und klingt in der rhetorischen Frage natürlich.
- source_word: αὐτὸν κύριον
  choice: ihn »Herr«
  rationale: Gibt die prädikative Konstruktion direkt wieder. »Herr« bewahrt hier sowohl den Wortlaut des Psalmzitats als auch das Gewicht der messianischen Argumentation.
- source_word: καλεῖ
  choice: nennt
  rationale: Entspricht dem schlichten Präsens und ist für die Bezeichnung einer Person als »Herr« idiomatisches Deutsch.
- source_word: καὶ πῶς
  choice: Wie kann … dann
  rationale: Das deutsche »dann« nimmt die folgernde Verbindung des griechischen καί im Zusammenhang natürlich auf; »wie« bewahrt die rhetorische Frage.
- source_word: αὐτοῦ υἱός
  choice: sein Sohn
  rationale: Bewahrt den ausdrücklichen Verwandtschaftsbegriff υἱός und damit die Spannung des Arguments; ein weiterer dynastischer Sinn wird nicht in den Haupttext eingetragen.
- source_word: ἐστιν
  choice: kann … sein
  rationale: Die modale deutsche Frageform gibt die rhetorische Schwierigkeit idiomatisch wieder, ohne die Aussage inhaltlich aufzulösen.
theological_decisions:
- issue: Wiedergabe von κύριος in der messianischen Argumentation
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist die natürliche und traditionsübergreifend verständliche Entsprechung. Sie bewahrt den Rangtitel und seine christologische Tragweite, ohne über den Wortlaut hinauszugehen.
- issue: Dynastische Reichweite von υἱός
  choice: sein Sohn
  alternative: sein Nachkomme
  rationale: Der griechische Text sagt ausdrücklich »Sohn«. Diese Formulierung trägt die rhetorische Spannung; »Nachkomme« ist als mögliche Sinnweite in der Fußnote angegeben, nicht stillschweigend in den Text eingesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Sätze erhalten die zugespitzte rhetorische Form. Deutsche Anführungszeichen kennzeichnen »Herr« als die David zugeschriebene Bezeichnung.
