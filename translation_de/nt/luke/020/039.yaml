base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: de
  text: 'Da antworteten einige der Schriftgelehrten: „Lehrer, das hast du gut gesagt.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lehrer, du hast richtig gesprochen“; auch: „Lehrer, das hast du treffend gesagt.“'
