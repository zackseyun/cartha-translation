lexical_decisions:
- source_word: ἀποκριθέντες δέ
  choice: Da antworteten
  rationale: Das aoristische Partizip führt zusammen mit δέ die Reaktion auf Jesu vorausgehende Aussage ein. Die finite Form ist im Deutschen natürlich; „Da“ gibt den leichten erzählerischen Übergang wieder, ohne einen starken Gegensatz zu behaupten.
- source_word: τινες τῶν γραμματέων
  choice: einige der Schriftgelehrten
  rationale: Die partitive Konstruktion bezeichnet ausdrücklich einen Teil der Schriftgelehrten, nicht die gesamte Gruppe.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die geläufige und sachlich passende Bezeichnung für die mit der Auslegung der heiligen Schriften und des Gesetzes befassten Fachleute im Evangelienkontext.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede gibt die Grundbedeutung von διδάσκαλος klar und ohne zusätzliche Rangvorstellung wieder.
- source_word: καλῶς εἶπας
  choice: das hast du gut gesagt
  rationale: Diese natürliche deutsche Wendung bewahrt die breite, anerkennende Bedeutung von καλῶς; sie kann sowohl die treffende Formulierung als auch die sachliche Richtigkeit loben.
