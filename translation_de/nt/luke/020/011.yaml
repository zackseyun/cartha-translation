id: LUK.20.11
reference: Luke 20:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: de
  text: Dann schickte er noch einen anderen Sklaven[a]. Doch auch ihn schlugen und entehrten sie und schickten ihn mit leeren Händen fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knecht“; das griechische Wort δοῦλος bezeichnet einen Menschen in einem rechtlich und sozial gebundenen Abhängigkeitsverhältnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: Dann schickte er noch
  rationale: Die Verbindung von προστίθημι mit einem Infinitiv bezeichnet hier die Fortsetzung des Handelns. „Dann … noch“ gibt den erzählerischen Zusammenhang im Deutschen natürlich wieder.
- source_word: ἕτερον
  choice: einen anderen
  rationale: Das Wort bezeichnet einen weiteren, vom ersten unterschiedenen Sklaven.
- source_word: δοῦλον
  choice: Sklaven
  rationale: „Sklave“ bewahrt den rechtlich und sozial gebundenen Status der Figur deutlicher als „Diener“ oder „Knecht“.
- source_word: κἀκεῖνον
  choice: auch ihn
  rationale: Die Zusammenziehung καὶ ἐκεῖνον stellt die parallele Behandlung dieses zweiten Sklaven heraus; „auch ihn“ ist die natürliche deutsche Entsprechung.
- source_word: δείραντες
  choice: schlugen
  rationale: Das Verb bezeichnet körperliches Schlagen, ohne hier zwingend eine bestimmte Form wie Auspeitschen festzulegen.
- source_word: ἀτιμάσαντες
  choice: entehrten
  rationale: „Entehrten“ bewahrt den Aspekt öffentlicher Herabsetzung und Schande, statt ihn auf bloße Beschimpfung zu verengen.
- source_word: ἐξαπέστειλαν
  choice: schickten … fort
  rationale: Das zusammengesetzte Verb drückt ein Wegschicken aus; die getrennte deutsche Verbform ist idiomatisch.
- source_word: κενόν
  choice: mit leeren Händen
  rationale: Das prädikativ gebrauchte Adjektiv besagt im Kontext, dass der Sklave nichts von der erwarteten Ernte erhielt; die deutsche Wendung gibt dies klar und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Gleichnis
  choice: Sklave
  alternative: Knecht; Diener
  rationale: Das Besitz- und Abhängigkeitsverhältnis zum Weinbergbesitzer ist in diesem Gleichnis relevant. „Sklave“ bildet diese soziale Wirklichkeit ab, ohne darüber hinaus eine theologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Dann … noch“ vermeidet die unnatürlich wörtliche Formulierung „er fügte hinzu, einen anderen zu senden“; die Wiederholung von „ihn“ hält den Satz klar und folgt der griechischen Parallelstruktur.
