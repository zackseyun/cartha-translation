  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Elemente des griechischen Textes zuverlässig wieder: προσέθετο … πέμψαι als fortgesetztes Handeln, ἕτερον als weiteren anderen Sklaven, κἀκεῖνον als paralleles „auch ihn“, δείραντες und ἀτιμάσαντες als körperliche Misshandlung und Entehrung sowie κενόν idiomatisch als „mit leeren Händen“. „Dann schickte er noch“ ist eine natürliche, im Kontext tragfähige Wiedergabe der griechischen Fortsetzungsformel.'
