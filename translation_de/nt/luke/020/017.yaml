  naturalness: Modernes Standarddeutsch und würdiges Register sind weitgehend gelungen. „Hauptstein der Ecke“ ist verständlich, aber etwas künstlich; als absichtlich transparente Wiedergabe vertretbar. „Was ist dann das, was geschrieben steht“ ist idiomatisch genug und näher am Ausgangstext als die Fassung mit „hier“.
  terminology: „Bauleute“, „verworfen“ und „Ecke“ sind treffend. Die Fußnote sollte die wörtliche Formulierung als „Kopf der Ecke“ wiedergeben, da „Haupt der Ecke“ im Deutschen missverständlich und weniger unmittelbar ist. Die Alternativen „Eckstein“ und „Schlussstein“ erhalten die Deutungsoffenheit.
