source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: de
  text: 'Er aber sah sie an und sagte: »Was ist dann das, was geschrieben steht: ›Der Stein, den die Bauleute verworfen haben, der ist zum Hauptstein der Ecke[a] geworden‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kopf der Ecke“; auch „Eckstein“ oder „Schlussstein“.'
    reason: Der griechische Ausdruck lässt offen, welche herausragende Funktion oder Lage des Steins im Bauwerk gemeint ist.
lexical_decisions:
- source_word: ἐμβλέψας
  choice: sah sie fest an
  rationale: Die Form bezeichnet einen gezielten, auf sie gerichteten Blick. „Sah sie fest an“ ist natürlich und gibt die bewusste Intensität wieder, ohne sie zu übersteigern.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Was ist dann das, was hier geschrieben steht
  rationale: Die Wiedergabe erhält die rhetorische Frage sowie den Bezug auf den bleibend geschriebenen Schrifttext. „Hier“ verdeutlicht idiomatisch das demonstrative τοῦτο, ohne bereits ausdrücklich eine Deutung einzuführen.
- source_word: Λίθον
  choice: Der Stein
  rationale: Obwohl das griechische Substantiv im Zitat artikellos ist, ist der bestimmte Artikel im Deutschen für den im Schriftwort identifizierten Stein idiomatisch.
- source_word: ἀπεδοκίμασαν
  choice: verworfen haben
  rationale: „Verwerfen“ bezeichnet treffend die prüfende Ablehnung und entspricht dem würdigen Register eines Schriftzitats.
- source_word: οἱ οἰκοδομοῦντες
  choice: die Bauleute
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die bauen. „Bauleute“ ist knapp, natürlich und bewahrt das architektonische Bild.
- source_word: οὗτος
  choice: der
  rationale: Das wiederaufnehmende „der“ bildet im deutschen Linksversetzungssatz die Hervorhebung des Demonstrativpronomens natürlich ab, ohne den Stein christologisch zu personalisieren.
- source_word: ἐγενήθη εἰς
  choice: ist … geworden
  rationale: Das deutsche Perfekt bewahrt den Eintritt in einen neuen Zustand und dessen fortdauerndes Ergebnis.
- source_word: κεφαλὴν γωνίας
  choice: Hauptstein der Ecke
  rationale: Diese bewusst transparente Formulierung hält das Element κεφαλή („Haupt“) und den Bezug zur Ecke fest, ohne die umstrittene Lage des Steins als Fundament- oder Abschlussstein endgültig festzulegen.
theological_decisions:
- issue: Architektonisches Bild im Zitat aus Psalm 118,22
  choice: Hauptstein der Ecke
  alternative: Eckstein; Schlussstein
  rationale: Die genaue architektonische Vorstellung von κεφαλὴ γωνίας ist umstritten. Der Haupttext bleibt nahe an den Bestandteilen des griechischen Ausdrucks; die geläufigen, aber stärker deutenden Möglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Gegensatz wird mit „Er aber“ sichtbar gehalten; das Schriftzitat ist gehoben, bleibt jedoch für heutige Leser verständlich. Die leichte Fremdheit von „Hauptstein der Ecke“ ist beabsichtigt, um die genuine Mehrdeutigkeit des griechischen Bildes nicht vorschnell aufzulösen.
