  source_fidelity: 'Der Text gibt die Satzfolge und die wesentlichen Bedeutungen des griechischen Originals zuverlässig wieder: das Kommen des Besitzers, die Vernichtung der συγκεκριμένων γεωργῶν, die Übergabe des Weinbergs an unbestimmte andere sowie die erschrockene, optativisch geprägte Zurückweisung der Hörenden. »Winzer« ist im Kontext eines Weinbergs eine vertretbare, natürliche Wiedergabe von γεωργοί; das im Gleichnis vorausgesetzte Pachtverhältnis muss in diesem einzelnen Vers nicht zusätzlich ausgedrückt werden.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die direkte Rede und Zeichensetzung sind klar. »Das darf niemals geschehen!« ist idiomatisch und transportiert die nachdrückliche Abwehr angemessen.
  terminology: »Weinberg« entspricht ἀμπελών präzise und erhält die Bildsprache. »Winzer« ist kontextgerecht, ohne die im griechischen Wort selbst nicht ausdrücklich kodierte rechtliche Stellung übermäßig zu spezifizieren. »anderen« bewahrt die Offenheit von ἄλλοις. Die Fußnote dokumentiert die wörtlichere optativische Nuance von Μὴ γένοιτο sinnvoll.
