id: LUK.20.16
reference: Luke 20:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: de
  text: 'Er wird kommen, diese Winzer vernichten und den Weinberg anderen geben.« Als sie das hörten, sagten sie: »Das darf niemals geschehen!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Auf keinen Fall!« Wörtlicher: »Möge das niemals geschehen!« Der griechische Ausdruck ist eine starke Zurückweisung.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Er wird kommen
  rationale: Gibt das Futur von ἔρχομαι schlicht wieder, ohne durch »zurückkommen« eine im Griechischen nicht ausdrücklich bezeichnete Nuance hinzuzufügen.
- source_word: ἀπολέσει
  choice: vernichten
  rationale: Bewahrt die Härte von ἀπόλλυμι und bleibt zugleich weiter als das kontextspezifisch mögliche »töten«.
- source_word: γεωργοὺς
  choice: Winzer
  rationale: Im Gleichnis bearbeiten sie einen fremden Weinberg; »Winzer« ist im Deutschen natürlich und bildet den landwirtschaftlichen Bezug zum Weinberg klar ab, auch wenn das Besitz- oder Pachtverhältnis erst aus dem Kontext hervorgeht.
- source_word: τούτους
  choice: diese
  rationale: Bewahrt den proximalen Demonstrativbezug auf die gerade beschriebenen Winzer.
- source_word: δώσει
  choice: geben
  rationale: Entspricht der lexikalischen Schlichtheit von δίδωμι und lässt die Art der Übertragung offen.
- source_word: τὸν ἀμπελῶνα
  choice: den Weinberg
  rationale: Die übliche und bildgetreue deutsche Entsprechung, die auch die biblischen Anklänge bewahrt.
- source_word: ἄλλοις
  choice: anderen
  rationale: Lässt wie der griechische Dativ Plural offen, wer die anderen sind.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: Als sie das hörten, sagten sie
  rationale: Gibt das temporale Verhältnis des Aoristpartizips in natürlichem modernem Deutsch wieder; δέ markiert hier einen narrativen Übergang beziehungsweise Kontrast.
- source_word: Μὴ γένοιτο
  choice: Das darf niemals geschehen!
  rationale: Gibt die starke, erschrockene Zurückweisung idiomatisch wieder und bewahrt zugleich den auf das Eintreten des angekündigten Geschehens gerichteten Wunschcharakter des Optativs.
theological_decisions:
- issue: Kraft der Reaktion Μὴ γένοιτο
  choice: Das darf niemals geschehen!
  alternative: Auf keinen Fall! / Möge das niemals geschehen!
  rationale: Die Formulierung ist eine emotionale, wunschhafte Zurückweisung des angekündigten Gerichts. Sie vermeidet sowohl eine bloß logische Verneinung als auch eine konfessionelle Deutung.
- issue: Identität der »anderen«
  choice: nicht näher bestimmt
  alternative: ausdrückliche Identifizierung mit einer bestimmten heilsgeschichtlichen Gruppe
  rationale: ἄλλοις benennt die Empfänger nicht. Die Übersetzung bewahrt diese Offenheit und löst die theologische Spannung nicht im Text auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzbewegung des griechischen Textes bleibt erhalten. »Winzer« ist alltagssprachlich verständlich und im Weinbergkontext präzise; die starke Reaktion der Hörenden wird idiomatisch, aber mit dokumentierter wörtlicherer Alternative wiedergegeben.
