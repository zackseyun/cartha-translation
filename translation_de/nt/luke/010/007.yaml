id: LUK.10.7
reference: Luke 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: de
  text: Bleibt in diesem Haus, esst und trinkt, was sie euch geben; denn der Arbeiter ist seines Lohnes wert. Zieht nicht von einem Haus zum anderen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: in eben diesem Haus
  rationale: Die Wendung verweist auf das zuvor genannte aufnehmende Haus; „eben diesem“ macht zugleich den Rückbezug und das Verbleiben an ein und demselben Ort deutlich.
- source_word: μένετε
  choice: Bleibt
  rationale: Der Präsensimperativ bezeichnet fortgesetztes Verbleiben; „Bleibt“ ist im modernen Deutsch natürlich und prägnant.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: esst und trinkt, was sie euch geben
  rationale: Die Partizipien bezeichnen die das Bleiben begleitende Tätigkeit. „Was sie euch geben“ gibt die idiomatische Bedeutung von τὰ παρ’ αὐτῶν klar wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: denn der Arbeiter ist seines Lohnes wert
  rationale: Die geläufige deutsche Fügung bewahrt sowohl ἄξιος als auch den wirtschaftlichen Sinn von μισθός und gibt das maskuline Singularpronomen in der Genitivkonstruktion wieder.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Zieht nicht von einem Haus zum anderen
  rationale: „Zieht“ bezeichnet hier idiomatisch den Wechsel der Unterkunft und bringt das Verbot eines Umziehens zwischen Haushalten natürlich zum Ausdruck.
theological_decisions:
- issue: Maskuliner Singular in τοῦ μισθοῦ αὐτοῦ
  choice: seines Lohnes
  alternative: des ihm zustehenden Lohnes; ihres Lohnes
  rationale: Das Griechische hat einen grammatisch maskulinen Singular mit ὁ ἐργάτης und αὐτοῦ. Die deutsche Form bewahrt dies, ohne die generische Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die vertraute Formulierung „seines Lohnes wert“ ist gehoben, aber weiterhin gut verständlich; keine textlich nicht markierten Ergänzungen oder konfessionellen Deutungen.
