id: LUK.10.4
reference: Luke 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: de
  text: Nehmt keinen Geldbeutel mit, keine Reisetasche[a] und keine Sandalen; und grüßt unterwegs niemanden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Reisetasche“ kann auch mit „Vorratstasche“ oder einfach mit „Tasche“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Wahrscheinlich ist damit kein Verbot gewöhnlicher Höflichkeit gemeint. Die Gesandten sollen sich vielmehr nicht durch die damals üblichen, mitunter zeitaufwendigen Begrüßungen von ihrem dringenden Auftrag aufhalten lassen.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: nehmt … mit
  rationale: Im Zusammenhang mit Reiseanweisungen gibt die deutsche Wendung natürlich wieder, dass die Genannten Dinge nicht als Ausrüstung mitgeführt werden sollen.
- source_word: βαλλάντιον
  choice: Geldbeutel
  rationale: Das Wort bezeichnet einen Beutel zur Aufbewahrung von Geld; „Geldbeutel“ ist im modernen Standarddeutsch klar und gebräuchlich.
- source_word: πήραν
  choice: Reisetasche
  rationale: Gemeint ist eine auf Reisen mitgeführte Tasche, besonders für Vorräte. „Reisetasche“ vermittelt die Funktion verständlich, ohne die Form des Behältnisses zu eng festzulegen.
- source_word: ὑποδήματα
  choice: Sandalen
  rationale: Das Wort bezeichnet Fußbekleidung und im antiken mediterranen Umfeld häufig Sandalen. Diese Wiedergabe bewahrt den historischen Kontext.
- source_word: μηδένα
  choice: niemanden
  rationale: Die direkte Verneinung des unbestimmten Personenbezugs wird im Deutschen idiomatisch mit „niemanden“ wiedergegeben.
- source_word: κατὰ τὴν ὁδόν
  choice: unterwegs
  rationale: Die Wendung bezeichnet das Geschehen auf dem Reiseweg. „Unterwegs“ ist eine natürliche, knappe deutsche Entsprechung.
- source_word: ἀσπάσησθε
  choice: grüßt
  rationale: ἀσπάζομαι bezeichnet das Begrüßen oder Willkommenheißen. „Grüßt“ bewahrt hier die direkte Form des Verbots.
theological_decisions:
- issue: Tragweite des Verbots, unterwegs jemanden zu grüßen
  choice: 'Das direkte Verbot bleibt im Haupttext ungemildert: „grüßt unterwegs niemanden“.'
  alternative: 'Sinngemäß erweitern: „Lasst euch unterwegs nicht durch lange Begrüßungen aufhalten.“'
  rationale: Der griechische Text formuliert ein unmittelbares Verbot. Die wahrscheinlich gemeinte Dringlichkeit und der kulturelle Hintergrund zeitaufwendiger Begrüßungen werden in einer Fußnote erläutert, statt in den Wortlaut hineingetragen zu werden.
- issue: Ob mit „Sandalen“ das Tragen an den Füßen oder das Mitführen gemeint ist
  choice: Durch das gemeinsame „Nehmt … mit“ wird das Mitführen als Reiseausrüstung ausgedrückt.
  alternative: „Tragt keine Sandalen“, was als Aufforderung zum Barfußgehen verstanden werden könnte.
  rationale: βαστάζετε regiert alle drei Gegenstände und bezeichnet ihr Mitführen. Die Formulierung vermeidet die unbeabsichtigte Festlegung, die Gesandten sollten barfuß gehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bildet die wiederholten griechischen Verneinungen knapp nach; das Semikolon markiert den Übergang von der Reiseausrüstung zum Verhalten unterwegs.
