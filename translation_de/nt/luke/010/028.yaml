  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Du hast richtig geantwortet. Tu das, und du wirst leben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im weiteren Zusammenhang geht es um das ewige Leben (siehe Lukas 10,25); im Griechischen steht hier jedoch schlicht: „Du wirst leben.“'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Da sagte er zu ihm
  rationale: Das einfache Aoristverb wird mit „sagte“ wiedergegeben. δέ ist ein schwaches Bindewort; „da“ führt den Erzählgang natürlich fort, ohne einen starken Gegensatz auszudrücken. αὐτῷ bezeichnet den Empfänger der Äußerung.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Du hast richtig geantwortet
  rationale: ὀρθῶς bedeutet „richtig“ oder „zutreffend“. Das deutsche Perfekt ist in direkter Rede natürlich und gibt die abgeschlossene Antwort mit ihrer gegenwärtigen Bewertung wieder.
- source_word: τοῦτο ποίει
  choice: Tu das
  rationale: τοῦτο verweist auf das zuvor angeführte Gebot zurück. Der Präsensimperativ ποίει kann fortgesetztes Handeln einschließen; die knappe deutsche Aufforderung „Tu das“ bleibt idiomatisch und legt die Aspektnuance nicht übermäßig fest.
- source_word: καὶ ζήσῃ
  choice: dann wirst du leben
  rationale: Das parataktische καί bezeichnet hier die Folge der Aufforderung und wird im Deutschen natürlich mit „dann“ ausgedrückt. ζήσῃ heißt schlicht „du wirst leben“; die Formulierung wird nicht zu „das ewige Leben erben“ erweitert.
theological_decisions:
- issue: Bedeutungsumfang von ζήσῃ im Zusammenhang mit dem ewigen Leben
  choice: „du wirst leben“ im Haupttext
  alternative: „du wirst das ewige Leben haben/erben“
  rationale: Vers 25 stellt die Frage nach dem Erben des ewigen Lebens, doch der griechische Wortlaut hier sagt nur „du wirst leben“. Die knappe Wiedergabe bewahrt sowohl den Kontextbezug als auch die sprachliche Offenheit und fügt keine im Satz fehlenden Begriffe ein.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. „Da sagte er“ bildet den milden narrativen Anschluss ab; „Tu das“ ist knapp und unmittelbar. Die Fußnote erläutert den Kontext, ohne ihn in den Haupttext einzutragen.
