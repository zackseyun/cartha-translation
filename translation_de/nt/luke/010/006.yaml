id: LUK.10.6
reference: Luke 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: de
  text: Und wenn dort ein Sohn des Friedens ist[a], wird euer Friede auf ihm ruhen; wenn aber nicht, wird er zu euch zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mensch des Friedens“ – also jemand, der für die Botschaft des Friedens empfänglich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: ein Sohn des Friedens
  rationale: Die semitisch geprägte Genitivverbindung bezeichnet einen Menschen, der vom Frieden geprägt oder für den überbrachten Friedensgruß empfänglich ist. Die Wiedergabe bewahrt das Bild und die maskuline Singularform des griechischen Textes; eine idiomatischere Erklärung steht in der Fußnote.
- source_word: ἐπαναπαήσεται
  choice: wird ... ruhen
  rationale: Das Verb bezeichnet hier, dass der zugesprochene Friede auf jemandem zur Ruhe kommt beziehungsweise bei ihm bleibt. „Ruhen“ erhält dieses Bild in natürlichem Deutsch.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: euer Friede
  rationale: Der direkte Possessivausdruck bleibt erhalten und kann sowohl den Friedensgruß als auch den damit zugesprochenen Frieden bezeichnen, ohne ihn vorschnell auf eine bloße Grußformel einzuengen.
- source_word: μήγε
  choice: wenn aber nicht
  rationale: Die verstärkte Verneinung der Bedingung wird in flüssigem Deutsch durch „wenn aber nicht“ wiedergegeben.
- source_word: ἀνακάμψει
  choice: wird ... zurückkehren
  rationale: Das Verb bedeutet „zurückkehren“ oder „umkehren“ und führt das Bild fort, dass der Friede keinen Ruheort findet und zu den Sendenden zurückkehrt.
- source_word: ἐφ’ ὑμᾶς
  choice: zu euch
  rationale: Beim deutschen Verb „zurückkehren“ ist „zu euch“ die natürliche Anschlussform und gibt die Richtung des griechischen Ausdrucks sachgemäß wieder.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Und wenn dort ... ist
  rationale: Die Formulierung bewahrt sowohl den Anschluss durch καί als auch die örtliche Hervorhebung durch ἐκεῖ.
theological_decisions:
- issue: Ob die maskuline Wendung υἱὸς εἰρήνης geschlechtsneutral wiederzugeben ist
  choice: „Sohn des Friedens“ im Haupttext beibehalten
  alternative: „ein Mensch des Friedens“ oder „ein friedfertiger Mensch“
  rationale: Der griechische Text verwendet eine maskuline Singularform und eine semitische Charakterisierungsformel. Die Hauptfassung bewahrt diese Quelltextstruktur; die Fußnote erschließt die idiomatische Bedeutung, ohne sie auf eine bestimmte dogmatische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Bildsprache und Satzstruktur des griechischen Textes. Das wiederholte Wort „Friede“ und das Bild des Ruhens beziehungsweise Zurückkehrens werden bewusst erhalten.
