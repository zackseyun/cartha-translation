  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: de
  text: Alles ist mir von meinem Vater übergeben worden.[a] Niemand weiß, wer der Sohn ist, außer dem Vater; und niemand weiß, wer der Vater ist, außer dem Sohn und derjenige, dem der Sohn ihn offenbaren will.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Mein Vater hat mir alles übergeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: derjenige, dem der Sohn ihn zu offenbaren wünscht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural hat umfassenden Sinn. „Alles“ ist im Deutschen natürlicher als „alle Dinge“ und bewahrt den weiten Bedeutungsumfang.
- source_word: παρεδόθη
  choice: ist … übergeben worden
  rationale: Die Passivform gibt den Grundsinn von παραδίδωμι wieder, ohne die engere Vorstellung einer bloßen treuhänderischen Anvertrauung einzutragen. Das deutsche Perfekt bezeichnet die vollzogene Übergabe mit fortbestehender Bedeutung.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: von meinem Vater
  rationale: ὑπό mit Genitiv bezeichnet bei einem Passiv den handelnden Urheber; „von meinem Vater“ bildet dies im Deutschen präzise ab.
- source_word: γινώσκει
  choice: weiß
  rationale: Bei den indirekten Fragesätzen „wer … ist“ ist „wissen“ im modernen Deutschen idiomatischer als „kennen“. Zusätze wie „vollständig“ würden die ausdrückliche Formulierung interpretierend verstärken.
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: wer der Sohn ist / wer der Vater ist
  rationale: Die Formulierung erhält den persönlichen und relationalen Charakter der Aussage, ohne „Identität“ oder „wirklich“ erklärend hinzuzusetzen.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: der Sohn / der Vater
  rationale: Die bestimmten Bezeichnungen werden im christologischen Zusammenhang als relationale Titel gebraucht. Die im Deutschen übliche Großschreibung der Substantive trägt keine zusätzliche Auslegung ein.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: dem, dem der Sohn ihn offenbaren will
  rationale: Die Wendung bezeichnet einen nicht näher bestimmten Empfänger, der vom Willen des Sohnes abhängt. Das Objekt „ihn“ bezieht sich aus dem vorangehenden Satz auf den Vater und macht den deutschen Satz grammatisch vollständig.
- source_word: βούληται
  choice: will
  rationale: „Will“ bringt die eigene, entscheidende Absicht des Sohnes knapp und natürlich zum Ausdruck; „möchte“ könnte die Aussage abschwächen.
- source_word: ἀποκαλύψαι
  choice: offenbaren
  rationale: „Offenbaren“ bewahrt sowohl den Grundgedanken des Enthüllens als auch die theologische Resonanz der göttlichen Selbstmitteilung.
theological_decisions:
- issue: Einzigartige gegenseitige Erkenntnis von Vater und Sohn
  choice: Die ausschließliche wechselseitige Erkenntnis wird unmittelbar wiedergegeben, ohne verstärkende Zusätze.
  alternative: „vollständig kennt“ oder „wirklich kennt“
  rationale: Die Satzstruktur selbst trägt das starke christologische Gewicht. Eine qualitative Ergänzung wäre zwar theologisch naheliegend, steht aber nicht ausdrücklich im griechischen Wortlaut.
- issue: Der Wille des Sohnes bei der Offenbarung des Vaters
  choice: βούληται wird mit „will“ wiedergegeben.
  alternative: „möchte“, „wünscht“ oder eine Umschreibung, die die Entscheidungsgewalt des Sohnes abschwächt
  rationale: Der griechische Text stellt den Sohn als denjenigen dar, von dessen Willen die Offenbarung abhängt. Diese Aussage bleibt bestehen, ohne sie systematisch weiter auszudeuten.
- issue: Implizites Objekt von ἀποκαλύψαι
  choice: Das im Deutschen erforderliche Objekt „ihn“ wird auf den Vater bezogen.
  alternative: Objektlose Wiedergabe „zu offenbaren“
  rationale: Aus dem unmittelbaren Parallelismus ist der Vater das unausgesprochene Objekt. Die Ergänzung macht nur explizit, was die griechische Syntax voraussetzt, und vermeidet eine unnatürliche deutsche Formulierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „niemand weiß“ in der zweiten Satzhälfte dient der Klarheit der langen Parallelkonstruktion; sie ist im Griechischen elliptisch mitgemeint. Semikolon und Wiederholung machen die wechselseitige Struktur für heutige Leser unmittelbar erfassbar.
