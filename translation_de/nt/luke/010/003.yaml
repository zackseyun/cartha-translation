  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: de
  text: Geht! Seht, ich sende euch wie Lämmer mitten unter Wölfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: Geht!
  rationale: Der Imperativ in der zweiten Person Plural ist als knapper Sendungsbefehl natürlich und präzise wiedergegeben.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel lenkt den Blick nachdrücklich auf das Folgende; „Seht“ ist würdig und im modernen Standarddeutsch verständlich.
- source_word: ἀποστέλλω ὑμᾶς
  choice: ich sende euch
  rationale: Bewahrt Präsens, Subjekt und pluralisches Objekt. „Senden“ trägt hier den missionarischen Zusammenhang, ohne ihn durch „beauftragen“ auszudeuten.
- source_word: ὡς ἄρνας
  choice: wie Lämmer
  rationale: ὡς kennzeichnet einen Vergleich, und ἄρνας bezeichnet ausdrücklich Lämmer, nicht allgemein Schafe.
- source_word: ἐν μέσῳ λύκων
  choice: mitten unter Wölfe
  rationale: Die idiomatische deutsche Wendung bewahrt sowohl die Bewegung in eine feindliche Umgebung als auch das Bild des Umgebenseins.
theological_decisions:
- issue: Tierbild für die ausgesandten Jünger
  choice: „wie Lämmer mitten unter Wölfe“
  alternative: „wie Schafe unter Wölfe“
  rationale: Der griechische Text nennt ausdrücklich Lämmer und hebt damit ihre Schutzlosigkeit hervor. Eine Angleichung an ähnliche Worte mit „Schafen“ würde die konkrete Bildwahl dieses Verses verwischen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Sendungston. Der Aufmerksamkeit Ruf „Seht“ vermeidet das heute altertümliche „siehe“; „mitten unter“ erhält die Intensität von ἐν μέσῳ.
