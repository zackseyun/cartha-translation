revisions:
- from: 'Und er wandte sich den Jüngern zu und sagte zu ihnen unter vier Augen[a]: »Glücklich zu preisen sind die Augen, die sehen, was ihr seht.«'
  to: 'Und er wandte sich den Jüngern zu und sagte zu ihnen, als sie unter sich waren: »Glücklich zu preisen sind die Augen, die sehen, was ihr seht.«'
  rationale: Die private, von anderen abgesonderte Ansprache wird mit »als sie unter sich waren« gruppenfähig und idiomatisch wiedergegeben. Die Fußnote bietet eine knappe lexikalische Alternative, ohne eine nicht im griechischen Ausdruck enthaltene Vertraulichkeit oder ein Zwiegespräch zu behaupten.
