source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: de
  text: 'Und er wandte sich den Jüngern zu und sagte zu ihnen, als sie unter sich waren: »Glücklich zu preisen sind die Augen, die sehen, was ihr seht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: er wandte sich … zu
  rationale: Das Aoristpartizip bezeichnet die dem Sprechen vorausgehende Hinwendung Jesu. Die finite deutsche Form ist natürlich und wahrt die zeitliche Abfolge.
- source_word: κατ’ ἰδίαν
  choice: unter vier Augen
  rationale: Die Wendung bezeichnet hier ein von anderen abgesondertes, vertrauliches Reden zu den Jüngern; die idiomatische Formulierung lässt dabei offen, dass mehrere Jünger angesprochen werden.
- source_word: μαθητάς
  choice: Jüngern
  rationale: „Jünger“ ist die etablierte und in diesem Kontext verständliche Wiedergabe für Jesu Lernende und Nachfolger.
- source_word: Μακάριοι
  choice: Glücklich zu preisen
  rationale: Die Formulierung gibt einen objektiven Glückwunsch beziehungsweise eine Seligpreisung wieder und vermeidet die Verengung auf ein bloß subjektives Glücksgefühl.
- source_word: ὀφθαλμοὶ οἱ βλέποντες
  choice: die Augen, die sehen
  rationale: Die ausdrückliche Metonymie des Griechischen bleibt erhalten, ebenso die beschreibende Kraft des Präsenspartizips.
- source_word: ἃ βλέπετε
  choice: was ihr seht
  rationale: Direkte und natürliche Wiedergabe des Relativpronomens mit dem Präsens; sie bewahrt den Bezug auf das, was die Jünger gegenwärtig wahrnehmen.
theological_decisions:
- issue: Aussagekraft der Seligpreisung
  choice: „Glücklich zu preisen“ als objektiver Zuspruch besonderer Begünstigung
  alternative: „Glücklich“ als Aussage über ein subjektives Gefühl
  rationale: μακάριοι spricht die Augen beziehungsweise metonymisch die sehenden Menschen selig. Die Übersetzung erhält dieses Gewicht, ohne den Grund der Begünstigung über den Text hinaus dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Rede von den Augen bleibt bewusst erhalten. „Unter vier Augen“ wird idiomatisch auch für ein vertrauliches Gespräch innerhalb eines abgegrenzten Kreises verwendet; die Fußnote verdeutlicht die griechische Wendung.
