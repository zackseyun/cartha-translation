review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die bildhafte Wiedergabe von »Augen« entsprechen dem griechischen Text. »Unter vier Augen« ist jedoch nicht quellentreu: Die feste deutsche Redewendung bezeichnet gewöhnlich ein Gespräch zwischen genau zwei Personen, während hier mehrere Jünger angesprochen werden können. Auch die Fußnote legt mit »im vertrauten Kreis« eine Vertraulichkeit nahe, die κατ’ ἰδίαν nicht ausdrückt.'
  naturalness: Die Satzführung ist grundsätzlich natürlich. »Als sie unter sich waren« ist für eine von anderen abgesonderte Ansprache an eine Gruppe idiomatisch und vermeidet die Zahlimplikation von »unter vier Augen«.
  terminology: »Jünger« ist passend. »Glücklich zu preisen« bildet den Charakter von μακάριοι als Seligpreisung angemessen ab, ohne es auf ein bloßes Gefühl zu reduzieren. Die Metonymie »die Augen, die sehen« soll erhalten bleiben.
  issues:
  - severity: medium
    issue: »unter vier Augen« bei einer Ansprache an die Jünger
    rationale: Die Redewendung bedeutet im heutigen Standarddeutsch üblicherweise ein vertrauliches Zwiegespräch. Das griechische κατ’ ἰδίαν besagt eine abgesonderte bzw. private Ansprache, begrenzt die Zahl der Angesprochenen aber nicht auf eine Person.
  - severity: medium
    issue: Fußnote »im vertrauten Kreis« und angebliche wörtliche Bedeutung
    rationale: »Im vertrauten Kreis« fügt den Aspekt persönlicher Vertrautheit hinzu. »Für sich, abgesondert« ist keine geeignete wörtliche Glosse; die Wendung bedeutet hier idiomatisch »privat/unter sich«.
  revised_text: 'Und er wandte sich den Jüngern zu und sagte zu ihnen, als sie unter sich waren: »Glücklich zu preisen sind die Augen, die sehen, was ihr seht.«'
  revised_footnotes:
  - marker: a
    text: 'Oder: »für sich«, das heißt: getrennt von den anderen.'
    reason: lexical_alternative
  revision_rationale: Die private, von anderen abgesonderte Ansprache wird mit »als sie unter sich waren« gruppenfähig und idiomatisch wiedergegeben. Die Fußnote bietet eine knappe lexikalische Alternative, ohne eine nicht im griechischen Ausdruck enthaltene Vertraulichkeit oder ein Zwiegespräch zu behaupten.
