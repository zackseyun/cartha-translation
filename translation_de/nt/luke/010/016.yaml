id: LUK.10.16
reference: Luke 10:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: de
  text: Wer euch hört, hört mich, und wer euch ablehnt[a], lehnt mich ab; wer aber mich ablehnt, lehnt den ab, der mich gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verwirft“, „missachtet“ oder „beiseitesetzt“ (griechisch ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Wer … hört
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, auf den die Aussage zutrifft. „Wer“ gibt diesen generischen Sinn im Deutschen natürlicher wieder als „Derjenige, der“.
- source_word: ὑμῶν / ἐμοῦ
  choice: euch / mich
  rationale: Der Genitiv bei ἀκούω bezeichnet hier die gehörte Person. Die direkte Wiedergabe bewahrt die persönliche Beziehung zwischen Jesus und seinen Gesandten, ohne „Botschaft“ in den Text einzufügen.
- source_word: ἀθετέω
  choice: ablehnen
  rationale: Das Verb kann je nach Zusammenhang „ablehnen“, „verwerfen“, „missachten“ oder „beiseitesetzen“ bedeuten. Bei Personen bringt „ablehnen“ die Zurückweisung klar und in modernem Deutsch natürlich zum Ausdruck; die Wiederholung bleibt durchgehend erhalten.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ kennzeichnet die leichte Gegenüberstellung beziehungsweise die steigernde Weiterführung zur abschließenden Aussage.
- source_word: τὸν ἀποστείλαντά με
  choice: den, der mich gesandt hat
  rationale: Die substantivierte Partizipialform wird als Relativsatz natürlich wiedergegeben. Der nicht ausdrücklich genannte Sender bleibt wie im Griechischen unausgesprochen.
theological_decisions:
- issue: Identifikation Jesu mit seinen beauftragten Gesandten
  choice: 'Die persönliche Kette bleibt erhalten: Wer die Jünger hört oder ablehnt, hört oder lehnt Jesus selbst ab.'
  alternative: Die Aussage auf das Hören oder Ablehnen ihrer Botschaft zu beschränken.
  rationale: Der griechische Text nennt ausdrücklich Personen („euch“, „mich“) und nicht abstrakt ihre Botschaft oder Lehre. Die Übersetzung bewahrt diese repräsentative Beziehung, ohne sie weiter auszudeuten.
- issue: Bezug von „der mich gesandt hat“
  choice: Der Sender wird nicht ausdrücklich benannt.
  alternative: „den Vater, der mich gesandt hat“
  rationale: Im Zusammenhang ist Gott als Jesu Sender gemeint, doch das Wort „Vater“ steht in diesem Vers nicht. Die implizite Formulierung wahrt die Textgestalt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Wer“ vermeidet die schwerfällige Form „Derjenige, der“. Die dreifache Wiederholung von „ablehnen“ bildet die rhetorische Kette des griechischen Textes ab; die Stellung „wer aber mich ablehnt“ hebt „mich“ entsprechend dem Ausgangstext hervor.
