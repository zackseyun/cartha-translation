source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: de
  text: 'Er antwortete: »Du sollst den Herrn, deinen Gott, mit deinem ganzen Herzen, mit deiner ganzen Seele, mit deiner ganzen Kraft und mit deinem ganzen Verstand lieben und deinen Nächsten wie dich selbst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb wird im natürlichen deutschen Erzählstil ohne Bedeutungsverlust als »Er antwortete« wiedergegeben.
- source_word: Ἀγαπήσεις
  choice: Du sollst … lieben
  rationale: Das Futur gibt hier ein zitiertes Gebot wieder. »Du sollst« bewahrt im Deutschen dessen verpflichtenden und schriftsprachlichen Klang.
- source_word: κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: »Herr« ist als Gottesbezeichnung in diesem Schriftzitat angemessen; die Apposition macht die Beziehung zwischen »Herrn« und »deinen Gott« klar.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: aus deinem ganzen Herzen
  rationale: »Aus« wahrt die von Lukas verwendete Präposition ἐξ und damit ihren Unterschied zu ἐν in den folgenden Wendungen. Die Formulierung bleibt verständlich, auch wenn im Deutschen traditionell oft »von ganzem Herzen« oder »mit deinem ganzen Herzen« steht.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: mit deiner ganzen Seele
  rationale: »Seele« bewahrt den traditionellen und lexikalischen Ausdruck, ohne ihn auf eine ausgearbeitete anthropologische Lehre festzulegen.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: mit deiner ganzen Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke; »Kraft« ist hier klar und idiomatisch.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: mit deinem ganzen Verstand
  rationale: διάνοια bezeichnet das Denk- und Erkenntnisvermögen. »Verstand« ist in diesem Zusammenhang präzise und natürlich.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: »Der Nächste« ist die etablierte und sachlich passende deutsche Wiedergabe der relationalen Bezeichnung πλησίον.
- source_word: ὡς σεαυτόν
  choice: wie dich selbst
  rationale: Die Wendung gibt die vergleichende Bedeutung von ὡς unmittelbar und idiomatisch wieder.
theological_decisions:
- issue: Gottesbezeichnung κύριος im Schriftzitat
  choice: Herr
  alternative: Gebieter
  rationale: In diesem Zusammenhang bezeichnet κύριος den Gott Israels. »Herr« bewahrt die theologische Tragweite und den biblischen Wiedererkennungswert, ohne eine zusätzliche Deutung einzutragen.
- issue: Vierfache Bezeichnung menschlicher Fähigkeiten
  choice: Herz, Seele, Kraft und Verstand als vier Ausdrücke beibehalten
  alternative: Zusammenfassend als »mit deinem ganzen Wesen« wiedergeben
  rationale: Die Reihung beschreibt umfassende Hingabe durch einander überlappende Begriffe. Ihre Beibehaltung wahrt die rhetorische Fülle, ohne daraus eine starre Lehre über Bestandteile des Menschen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung setzt »lieben« nach der vierfachen Aufzählung und entspricht damit natürlichem deutschen Sprachgebrauch. »Aus deinem ganzen Herzen« ist bewusst quellennäher als die üblichere Wendung »von ganzem Herzen«; die Fußnote erläutert diese leichte sprachliche Markiertheit.
