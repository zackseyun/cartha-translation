review_pass:
  verdict: revise
  source_fidelity: 'Die viergliedrige Aufzählung und die Wiedergaben »Herr«, »Gott«, »Seele«, »Kraft«, »Verstand«, »Nächsten« und »wie dich selbst« entsprechen dem griechischen Text gut. Die isolierte Wiedergabe von ἐξ mit »aus« ist hier jedoch nicht geboten: In dieser fest geprägten Gebotsformel bezeichnet die Präposition die umfassende Hingabe und wird im Deutschen idiomatisch mit »mit« wiedergegeben. Die unterschiedliche Präposition gegenüber den folgenden ἐν-Wendungen muss nicht durch eine im Deutschen semantisch irreführende Konstruktion nachgebildet werden.'
  naturalness: »Aus deinem ganzen Herzen lieben« ist im heutigen Standarddeutsch deutlich markiert und legt eher einen Ursprung oder Ausgangspunkt der Liebe nahe. »Mit deinem ganzen Herzen lieben« ist natürlich, würdevoll und in einem Schriftzitat fest etabliert.
  terminology: Die theologischen und anthropologischen Begriffe bleiben angemessen und ohne konfessionelle Zuspitzung erhalten. »Du sollst« gibt den gebotsartigen futurischen Wortlaut passend wieder.
  issues:
  - severity: medium
    issue: »aus deinem ganzen Herzen«
    rationale: Die Formulierung ist im Deutschen unidiomatisch und kann die Bedeutung verschieben. ἐξ ist in diesem idiomatischen Kontext nicht sinnvoll als räumlich-ablativisches »aus« auszuspielen; »mit deinem ganzen Herzen« gibt die geforderte Ganzhingabe angemessen wieder.
  - severity: low
    issue: Fußnote zur Präposition
    rationale: Die Fußnote stützt die problematische wörtliche Übertragung und erweckt den Eindruck, die Präpositionsdifferenz müsse im Deutschen mit »aus« abgebildet werden. Nach der idiomatischen Korrektur ist sie nicht erforderlich.
