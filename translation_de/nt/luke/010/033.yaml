  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: de
  text: Doch ein Samariter, der unterwegs war, kam an die Stelle, wo er lag. Als er ihn sah, wurde er von Mitleid ergriffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hatte Mitleid.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: ein Samariter
  rationale: „Samariter“ ist die etablierte deutsche Bezeichnung für die ethnisch-religiöse Identität und bewahrt die soziale und erzählerische Kontrastwirkung.
- source_word: δέ
  choice: Doch
  rationale: Die Konjunktion hebt hier den Gegensatz zum Priester und zum Leviten in den vorhergehenden Versen hervor.
- source_word: τις
  choice: ein
  rationale: Das indefinite Pronomen wird im natürlichen Deutschen durch den unbestimmten Artikel wiedergegeben; „ein gewisser“ wäre unnötig schwerfällig.
- source_word: ὁδεύων
  choice: der unterwegs war
  rationale: Die Formulierung gibt das Partizip als begleitende Hintergrundhandlung natürlich und mit fortdauerndem Sinn wieder.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: kam zu ihm
  rationale: κατά mit Akkusativ bezeichnet hier die Bewegung bis zum Aufenthaltsort des Verletzten; „kam zu ihm“ ist im Kontext klar und idiomatisch.
- source_word: ἰδών
  choice: Als er ihn sah
  rationale: Der temporale Nebensatz gibt das vorzeitige Partizip verständlich wieder und bewahrt die Abfolge von Wahrnehmen und Reaktion.
- source_word: ἐσπλαγχνίσθη
  choice: wurde er von tiefem Mitgefühl ergriffen
  rationale: Die Wendung bewahrt die starke, innerlich bewegende Bedeutung des Verbs, ohne die Reaktion über den griechischen Text hinaus theologisch auszudeuten.
theological_decisions:
- issue: Wiedergabe der mitfühlenden Reaktion des Samariters ohne spätere moralische oder dogmatische Deutung
  choice: wurde er von tiefem Mitgefühl ergriffen
  alternative: hatte er Mitleid mit ihm
  rationale: Die gewählte Fassung bringt die intensive innere Bewegung des griechischen Verbs zum Ausdruck, ohne zusätzliche Aussagen über Gnade, Barmherzigkeit oder Nächstenliebe in den Vers einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Aufteilung in zwei Sätze erleichtert das Lesen, ohne den gedanklichen Zusammenhang oder die zeitliche Abfolge des griechischen Satzes zu verändern.
