id: LUK.10.35
reference: Luke 10:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: de
  text: 'Am nächsten Tag holte er zwei Denare[a] hervor, gab sie dem Wirt und sagte: »Kümmere dich um ihn! Was du darüber hinaus ausgibst, werde ich dir erstatten, wenn ich zurückkomme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine verbreitete römische Silbermünze und entsprach ungefähr dem Tageslohn eines Arbeiters.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Am nächsten Tag
  rationale: Die Wendung bezeichnet idiomatisch den folgenden Tag; diese Formulierung ist im modernen Deutsch natürlich und wahrt die zeitliche Angabe.
- source_word: ἐκβαλών
  choice: holte … hervor
  rationale: Das Partizip bezeichnet hier das Hervorholen des Geldes aus dem eigenen Besitz und wird passend als vorangehende Begleithandlung wiedergegeben.
- source_word: δύο δηνάρια
  choice: zwei Denare
  rationale: Die historische Münzbezeichnung bleibt erhalten, statt ihren Wert deutend in Tageslöhne umzurechnen.
- source_word: πανδοχεῖ
  choice: Wirt
  rationale: Gemeint ist der Betreiber der Herberge. Im unmittelbaren Kontext ist »Wirt« natürlich und eindeutig.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Kümmere dich um ihn!
  rationale: Die Formulierung gibt den auffordernden Charakter des Imperativs und die verlangte fürsorgliche Aufmerksamkeit klar wieder.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Was du darüber hinaus ausgibst
  rationale: Die Wiedergabe bewahrt sowohl die unbestimmte Höhe als auch den Gedanken zusätzlicher Ausgaben.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: wenn ich zurückkomme
  rationale: Die artikulierte Infinitivkonstruktion mit ἐν hat zeitliche Bedeutung und wird idiomatisch wiedergegeben.
- source_word: ἀποδώσω σοι
  choice: werde ich dir erstatten
  rationale: Im finanziellen Zusammenhang bezeichnet das Verb die Rückzahlung der zusätzlich entstandenen Ausgaben; »erstatten« ist präzise und natürlich.
