id: LUK.10.10
reference: Luke 10:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: de
  text: 'Wenn ihr aber in eine Stadt kommt und man euch dort nicht aufnimmt, dann geht hinaus auf ihre Straßen[a] und sagt:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „breiten Straßen“ beziehungsweise „öffentlichen Plätze“. Das griechische Wort bezeichnet breite, offene Verkehrsflächen im öffentlichen Raum.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Wenn ihr aber in eine Stadt kommt
  rationale: Die relative Konstruktion mit ἄν beschreibt allgemein jeden entsprechenden Fall. Die deutsche Bedingungskonstruktion gibt diesen offenen Sinn natürlich wieder; „aber“ bildet δέ ab.
- source_word: εἰσέλθητε
  choice: kommt
  rationale: Im Zusammenhang mit „in eine Stadt“ bezeichnet das Verb das Hineingehen. „In eine Stadt kommt“ ist im modernen Deutsch natürlicher als das förmlichere „eine Stadt betretet“.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: man euch dort nicht aufnimmt
  rationale: δέχομαι bezeichnet hier die Aufnahme beziehungsweise gastliche Annahme der ausgesandten Boten. „Aufnimmt“ bewahrt diesen weiteren Sinn; „dort“ macht den Bezug auf die Bewohner der Stadt idiomatisch deutlich.
- source_word: ἐξελθόντες
  choice: dann geht hinaus
  rationale: Das Partizip bezeichnet die dem Sprechen vorausgehende Handlung. Als koordinierte Aufforderung mit „dann“ wird die Abfolge im Deutschen klar und natürlich wiedergegeben.
- source_word: τὰς πλατείας αὐτῆς
  choice: auf ihre Straßen[a]
  rationale: πλατεῖαι sind breite, offene und öffentliche Straßen oder Plätze. „Straßen“ passt zum städtischen Raum und lässt die im Griechischen mögliche Bedeutungsbreite in einer Fußnote sichtbar bleiben.
- source_word: εἴπατε
  choice: und sagt
  rationale: Der Aoristimperativ leitet die folgende direkte Rede ein; „sagt“ ist die schlichte und genaue deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung ist idiomatisch, bewahrt aber die Bedingung, die Handlungsabfolge und den Übergang zur folgenden direkten Rede.
