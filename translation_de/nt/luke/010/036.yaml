  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: de
  text: Wer von diesen dreien scheint dir dem, der unter die Räuber fiel, zum Nächsten geworden zu sein?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: Wer von diesen dreien
  rationale: Die Wendung bezeichnet eine Person aus einer klar bestimmten Dreiergruppe. „Wer von diesen dreien“ ist im modernen Deutschen natürlicher als „Welcher von diesen dreien“ und fügt kein im Griechischen unausgesprochenes Substantiv hinzu.
- source_word: δοκεῖ σοι
  choice: ist deiner Meinung nach
  rationale: Die Formulierung gibt die auf das Urteil des Angesprochenen zielende Bedeutung von δοκεῖ σοι in natürlichem Deutsch wieder. Die wörtlichere Wiedergabe „scheint dir“ wäre in Verbindung mit dem Perfektinfinitiv schwerfälliger.
- source_word: πλησίον
  choice: zum Nächsten
  rationale: πλησίον ist hier substantivisch beziehungsweise prädikativ gebraucht. Die feste deutsche Verbindung „jemandem zum Nächsten werden“ bewahrt sowohl den Beziehungsbegriff als auch die ethische Bewegung der Aussage.
- source_word: γεγονέναι
  choice: zum Nächsten geworden
  rationale: 'Der Perfektinfinitiv von γίνομαι bezeichnet ein Gewordensein und nicht bloß einen statischen Zustand. „Geworden“ erhält die Umkehrung der Ausgangsfrage: Entscheidend ist, wer sich dem Verwundeten als Nächster erwiesen hat.'
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: dem, der unter die Räuber fiel
  rationale: Das substantivierte Partizip wird ohne unnötige Ergänzung als „dem, der“ wiedergegeben. „Unter die Räuber fallen“ ist eine geläufige deutsche Entsprechung des griechischen Idioms und bezeichnet, in ihre Gewalt zu geraten.
theological_decisions:
- issue: Ethischer Schwerpunkt der Frage im Gleichnis vom barmherzigen Samariter
  choice: γίνομαι wird mit „zum Nächsten geworden“ wiedergegeben.
  alternative: 'Statischer: „Wer war der Nächste dessen …?“'
  rationale: Die gewählte Fassung bewahrt die Bewegung vom Bestimmen des eigenen Nächsten hin zum tätigen Nächstenwerden, ohne diese ethische Pointe durch zusätzliche Auslegung auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt trotz der mehrfachen Ergänzungen gut verständlich; „zum Nächsten geworden“ erhält bewusst die prägnante und theologisch bedeutsame Ausdrucksweise des Griechischen.
