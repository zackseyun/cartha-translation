  naturalness: „Wer von diesen dreien scheint dir dem, der unter die Räuber fiel, zum Nächsten geworden zu sein?“ ist modernes, verständliches Standarddeutsch. Die etwas gehobene Satzform entspricht dem würdigen Register der direkten Jesusrede, ohne unnatürlich zu wirken.
  terminology: „Nächster“ ist die etablierte und sachlich passende Wiedergabe von πλησίον. Die Verbindung „jemandem zum Nächsten geworden sein“ bewahrt die dynamische Aussage von γεγονέναι und vermeidet eine statische Umformulierung.
