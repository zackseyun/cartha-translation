id: LUK.10.12
reference: Luke 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: de
  text: 'Ich sage euch: Sodom wird es an jenem Tag[a] erträglicher[b] ergehen als jener Stadt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jener Tag“ bezeichnet den Tag des göttlichen Gerichts; in Parallelstellen wird dies ausdrücklich gesagt.
    reason: cross_reference
  - marker: b
    text: 'Oder: „leichter zu ertragen“. Das griechische Vergleichswort kann entsprechend wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die direkte, feierliche Aussage wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: Σοδόμοις
  choice: Sodom
  rationale: Der Ortsname steht wie im Griechischen metonymisch für die Stadt beziehungsweise ihre Bewohner; eine erklärende Erweiterung ist nicht nötig.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Zeitangabe und bewahrt die knappe Formulierung des Ausgangstextes.
- source_word: ἀνεκτότερον
  choice: erträglicher
  rationale: Der Komparativ bezeichnet, was leichter zu ertragen beziehungsweise eher hinnehmbar ist; „erträglicher“ ist gegenwärtig und verständlich.
- source_word: ἔσται
  choice: wird es … ergehen
  rationale: Die idiomatische deutsche Vergleichskonstruktion mit den Dativformen „Sodom“ und „jener Stadt“ gibt die Aussage des griechischen Futurs natürlich wieder.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: als jener Stadt
  rationale: „Stadt“ entspricht πόλις, und „jener“ bewahrt den rückverweisenden Demonstrativbezug.
theological_decisions:
- issue: Bedeutung von „jenem Tag“
  choice: Die Wendung bleibt im Haupttext ohne Ergänzung stehen.
  alternative: am Tag des Gerichts
  rationale: Der Zusammenhang weist auf den Tag des göttlichen Gerichts, doch der Vers selbst nennt das Gericht nicht ausdrücklich. Die knappe Form wahrt diese Abstufung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „jemandem wird es … ergehen“ ist idiomatisch und erhält den Vergleich zwischen Sodom und der zuvor genannten Stadt, ohne den Gerichtstag im Haupttext ausdrücklich auszudeuten.
