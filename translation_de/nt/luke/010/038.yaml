  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: de
  text: Als sie unterwegs waren, ging er in ein Dorf. Eine Frau namens Marta nahm ihn gastfreundlich auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hieß ihn willkommen. Das griechische Verb bezeichnet hier das gastfreundliche Empfangen eines Gastes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Als sie unterwegs waren
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv bezeichnet eine gleichzeitige Handlung. Das pluralische αὐτούς bezieht sich auf die Reisegruppe; δέ dient hier vor allem dem Erzählfluss und braucht im Deutschen kein eigenes einleitendes Wort.
- source_word: αὐτὸς
  choice: er
  rationale: Das Pronomen hebt Jesus gegenüber der zuvor genannten Gruppe hervor. Im deutschen Zusammenhang genügt „er“; die Einfügung des Namens „Jesus“ wäre erklärend.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ging er in ein Dorf
  rationale: κώμη bezeichnet ein Dorf. Das indefinite τινά führt einen nicht näher bezeichneten Ort ein; „ein Dorf“ ist im modernen Deutsch natürlicher als „ein gewisses Dorf“ und bewahrt die Unbestimmtheit.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: Eine Frau namens Marta
  rationale: Die Wendung führt eine neue Person ein und nennt sie unmittelbar beim Namen. „Eine Frau namens Marta“ gibt dies knapp und idiomatisch wieder.
- source_word: ὑπεδέξατο αὐτόν
  choice: nahm ihn gastfreundlich auf
  rationale: ὑποδέχομαι bezeichnet hier das gastliche Empfangen beziehungsweise Aufnehmen einer Person. „Gastfreundlich aufnehmen“ macht diese im Verb enthaltene Bedeutung deutlich, ohne ausdrücklich ein im Griechischen nicht genanntes Haus hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; die leichte Hervorhebung von αὐτός bleibt durch den Wechsel von der Gruppe zum singularischen „er“ im Zusammenhang erkennbar.
