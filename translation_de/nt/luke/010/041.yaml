id: LUK.10.41
reference: Luke 10:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: de
  text: 'Doch der Herr antwortete ihr: „Marta, Marta, du machst dir Sorgen und bist wegen vieler Dinge beunruhigt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Doch der Herr antwortete ihr
  rationale: Die geläufige griechische Verbindung aus Partizip und finitem Verb wird im Deutschen natürlich mit dem einfachen Verb „antwortete“ wiedergegeben. δέ markiert hier einen milden Gegensatz zu Martas vorausgehender Äußerung und wird mit „doch“ ausgedrückt.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: „Herr“ bewahrt sowohl die respektvolle als auch die christologische Bedeutung des lukanischen Erzähltitels.
- source_word: Μάρθα Μάρθα
  choice: Marta, Marta
  rationale: Die doppelte Anrede bleibt als Ausdruck von Nachdruck und persönlicher Zuwendung erhalten; verwendet wird die im modernen deutschen Bibelgebrauch übliche Namensform „Marta“.
- source_word: μεριμνᾷς
  choice: du machst dir Sorgen
  rationale: Die idiomatische Wendung gibt die innere Sorge oder Ängstlichkeit natürlich und verständlich wieder, ohne sie stärker zu pathologisieren.
- source_word: θορυβάζῃ
  choice: bist ... beunruhigt
  rationale: Das Wort bezeichnet Aufgewühltheit oder innere Unruhe. „Beunruhigt“ unterscheidet diesen Aspekt noch erkennbar vom Sich-Sorgen.
- source_word: περὶ πολλά
  choice: wegen vieler Dinge
  rationale: Die Formulierung gibt den weiten, nicht näher bestimmten Bezug der Sorgen und Unruhe knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von κύριος als Titel Jesu
  choice: der Herr
  alternative: der Meister
  rationale: Im lukanischen Erzählzusammenhang trägt κύριος neben respektvoller Anrede auch christologisches Gewicht. „Meister“ würde diese mögliche Resonanz unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Namens und die beiden unterschiedlichen Ausdrücke für Sorge und innere Unruhe werden bewahrt. Keine Fußnote ist erforderlich, da die lexikalische Spannweite im Haupttext angemessen wiedergegeben wird.
