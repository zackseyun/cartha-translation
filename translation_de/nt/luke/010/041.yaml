  source_fidelity: Der griechische Antwortausdruck ἀποκριθεὶς δὲ εἶπεν wird idiomatisch und vollständig durch „Doch der Herr antwortete ihr“ wiedergegeben. Die Wiederholung „Marta, Marta“ bleibt erhalten. „du machst dir Sorgen“ trifft μεριμνᾷς, und „bist wegen vieler Dinge beunruhigt“ gibt θορυβάζῃ περὶ πολλά angemessen wieder, einschließlich der Unterscheidung zwischen Sorge und innerer Unruhe.
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch und behält einen würdevollen biblischen Erzählton. „Doch“ ist als milde kontrastierende bzw. anschließende Wiedergabe von δέ in diesem Kontext gut möglich.
  terminology: „der Herr“ ist für ὁ κύριος konsequent und wahrt die erzählerische wie christologische Titelresonanz. „Marta“ entspricht der üblichen deutschen Namensform. Es werden keine konfessionell einengenden Deutungen eingeführt.
