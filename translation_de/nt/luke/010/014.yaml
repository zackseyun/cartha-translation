  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: de
  text: Doch für Tyrus und Sidon wird es im Gericht erträglicher sein als für euch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „besser zu ertragen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert knapp und natürlich den starken Gegensatz zur vorangehenden Gerichtsankündigung.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Tyrus und Sidon
  rationale: Die Dativformen bezeichnen beim Komparativ diejenigen, denen es im Gericht vergleichsweise erträglicher ergehen wird; die deutsche Konstruktion mit „ergehen“ bildet dies idiomatisch ab.
- source_word: ἀνεκτότερον
  choice: erträglicher
  rationale: Gibt den Komparativ präzise und in gegenwärtigem Standarddeutsch wieder; „weniger schlimm“ wäre verständlich, aber freier.
- source_word: ἔσται
  choice: wird es … ergehen
  rationale: Die idiomatische deutsche Wendung drückt die zukünftige Lage der verglichenen Städte aus, ohne das unpersönliche griechische Prädikat hölzern nachzubilden.
- source_word: ἐν τῇ κρίσει
  choice: im Gericht
  rationale: Bewahrt die bestimmte Formulierung und lässt den im Kontext naheliegenden endzeitlichen Bezug bestehen, ohne ihn erläuternd in den Haupttext einzutragen.
- source_word: ἢ ὑμῖν
  choice: als euch
  rationale: Schließt den Vergleich mit dem entsprechenden Dativ knapp und korrekt ab; der Bezug richtet sich an die zuvor angesprochenen Städte.
theological_decisions:
- issue: Bedeutung von κρίσις im Kontext
  choice: „im Gericht“ mit naheliegendem Bezug auf das endzeitliche Gericht
  alternative: Gericht in einem allgemeineren Sinn
  rationale: Der Vergleich reueloser Städte mit Tyrus und Sidon weist im Zusammenhang stark auf das endgültige göttliche Gericht. Die knappe Übersetzung wahrt jedoch den Wortlaut und fügt „letztes“ nicht ausdrücklich hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ ist prägnant, „im Gericht“ bewahrt den biblisch-theologischen Ernst, und die Wendung „wird es … ergehen“ vermeidet eine schwerfällige wörtliche Konstruktion.
