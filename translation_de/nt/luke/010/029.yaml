id: LUK.10.29
reference: Luke 10:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: de
  text: 'Doch er wollte sich selbst rechtfertigen und sagte zu Jesus: »Und wer ist mein Nächster?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und wer gilt als mein Nächster?«'
    reason: Die Alternative verdeutlicht, dass die Frage nach der Abgrenzung dessen fragen kann, wer unter den Begriff »Nächster« fällt.
lexical_decisions:
- source_word: θέλων
  choice: wollte
  rationale: Das Partizip bezeichnet die Absicht beziehungsweise das Motiv des Mannes. Die finite Wiedergabe mit »wollte« ist im modernen Deutschen natürlich und wahrt den Sinn.
- source_word: δικαιῶσαι ἑαυτόν
  choice: sich selbst rechtfertigen
  rationale: Die Wendung meint hier, dass der Mann sich als im Recht erweisen will. »Sich selbst rechtfertigen« bewahrt sowohl den lexikalischen Bezug zu δικαιόω als auch die erzählerische Spannung, ohne vorschnell einen paulinischen Fachgebrauch einzutragen.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: sagte zu Jesus
  rationale: Natürliche und genaue Wiedergabe der griechischen Redeformel; »Jesus« entspricht der üblichen deutschen Namensform.
- source_word: Καὶ
  choice: Und
  rationale: Die Konjunktion wird beibehalten, weil sie die anschließende Frage mit dem vorausgehenden Gespräch verbindet und im deutschen Dialog gut verständlich ist.
- source_word: τίς ἐστίν μου πλησίον
  choice: wer ist mein Nächster?
  rationale: πλησίον wird substantivisch gebraucht und nimmt den Sprachgebrauch des Toragebots auf. »Mein Nächster« ist die etablierte, prägnante deutsche Wiedergabe; die alternative Sinnentfaltung wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von δικαιῶσαι ἑαυτόν
  choice: Die Formulierung beschreibt den Versuch des Mannes, sich selbst als im Recht zu erweisen.
  alternative: Sich in einem allgemein moralischen Sinn zu rechtfertigen oder sich vor den Anwesenden zu verteidigen.
  rationale: Der unmittelbare Zusammenhang ist ein gesetzeskundiges und ethisches Gespräch. Die Übersetzung wahrt die mögliche erzählerische Ironie, ohne daraus ausdrücklich eine technische Lehre von der Rechtfertigung zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Doch« markiert den Gegensatz zum vorausgehenden Kontext; »mein Nächster« bewahrt den vertrauten Bezug zum Liebesgebot.
