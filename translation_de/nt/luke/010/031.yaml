id: LUK.10.31
reference: Luke 10:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: de
  text: Zufällig ging ein Priester jene Straße hinunter. Als er ihn sah, ging er auf der anderen Seite an ihm vorbei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ging er an ihm vorbei«. Das griechische Verb legt jedoch nahe, dass er auf der gegenüberliegenden Seite vorbeiging und ihm damit bewusst auswich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: zufällig
  rationale: Die Wendung bezeichnet ein zufälliges Zusammentreffen. »Zufällig« ist im Deutschen natürlich und macht keine weitergehende philosophische Aussage über den Zufall.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ führt die Erzählung hier nur leicht weiter. Im Deutschen genügt der neue Satz; ein ausdrückliches »aber« würde einen zu starken Gegensatz markieren.
- source_word: ἱερεύς τις
  choice: ein Priester
  rationale: τις kennzeichnet eine unbestimmte, nicht namentlich genannte Person. Das natürliche deutsche »ein Priester« gibt dies angemessen wieder; »ein gewisser Priester« klänge unnötig markiert.
- source_word: κατέβαινεν
  choice: ging … hinunter
  rationale: Das Imperfekt zeichnet die Bewegung als Hintergrundhandlung. Die deutsche Formulierung bleibt flüssig und bewahrt die Vorstellung des Hinabgehens.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: jene Straße
  rationale: Bei ὁδός bezeichnet ἐν idiomatisch die Bewegung auf beziehungsweise entlang einer Straße. Der deutsche Akkusativ in »jene Straße hinuntergehen« ist die natürliche Entsprechung.
- source_word: ἰδὼν αὐτὸν
  choice: Als er ihn sah
  rationale: 'Das Aoristpartizip wird hier sinnvoll temporal aufgelöst: Das Sehen geht der anschließenden Reaktion unmittelbar voraus.'
- source_word: ἀντιπαρῆλθεν
  choice: ging er auf der anderen Seite an ihm vorbei
  rationale: Das Verb bezeichnet nicht nur ein Vorbeigehen, sondern legt ein Vorbeigehen auf der gegenüberliegenden Seite und damit ein Ausweichen nahe. Die Formulierung bildet diese räumliche Nuance ab, ohne einen ausdrücklich nicht genannten Seitenwechsel hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Sätze bewahren den nüchternen Erzählton. Die unbenannte Person bleibt durch »ihn« an den vorherigen Kontext gebunden.
