    issue: „ihr Denken geändert“ für μετενόησαν
    rationale: Die Formulierung kann im heutigen Deutsch eine bloße Meinungs- oder Einstellungsänderung bezeichnen. Im vorliegenden Buß- und Gerichtsbild, verstärkt durch Sack und Asche, bezeichnet μετανοεῖν eine umfassende Umkehr. „Umgekehrt“ wahrt dies besser und bleibt semantisch offen genug.
  - severity: low
    issue: Stellung von „dasitzend“
    rationale: „In Sack und Asche sitzend“ bindet das Partizip im Deutschen flüssiger an die bildhafte Präpositionalphrase, ohne den griechischen Akzent zu verändern.
