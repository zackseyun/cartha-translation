  source_fidelity: 'Der irrealen Bedingungssatz ist zutreffend wiedergegeben: Die Machttaten, die tatsächlich bei den angeredeten Orten geschehen sind, werden kontrafaktisch nach Tyrus und Sidon verlegt. „Weh dir“, die Ortsnamen, „längst“ sowie das ausdrücklich genannte Sitzen in Sack und Asche geben den griechischen Text angemessen wieder. „Ihr Denken geändert“ ist für μετενόησαν in diesem prophetischen Gerichtskontext jedoch zu eng kognitiv und schwächt die geforderte umfassende Umkehr ab.'
  naturalness: Der Satzbau ist insgesamt idiomatisch und der gehobene Ton von „dasitzend“ ist vertretbar. „In Sack und Asche sitzend“ klingt etwas natürlicher als die Stellung „in Sack und Asche dasitzend“. „Umgekehrt“ ist im modernen bibelnahen Standarddeutsch klarer und kontextgerechter als „ihr Denken geändert“.
  terminology: „Machttaten“ ist als Wiedergabe von δυνάμεις sachgerecht und bewahrt gegenüber „Wunder“ die Macht- und Tatenkomponente. „Umkehren“ gibt μετανοεῖν im Kontext angemessen wieder, ohne eine konfessionell spezifizierte Bußtheologie einzutragen. Die Fußnote kann die Alternative „Buße tun“ nennen, sollte aber nicht die kognitive Grundbedeutung gegen die kontextuelle Bedeutung ausspielen.
