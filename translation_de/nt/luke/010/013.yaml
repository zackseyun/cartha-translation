  to: Weh dir, Chorazin! Weh dir, Betsaida! Denn wenn in Tyrus und Sidon die Machttaten[a] geschehen wären, die bei euch geschehen sind, hätten sie längst in Sack und Asche sitzend umgekehrt[b].
  rationale: Die Revision ersetzt die zu kognitiv verengende Wendung „ihr Denken geändert“ durch „umgekehrt“, das im Kontext von Sack und Asche die Bedeutung von μετανοέω zuverlässig wiedergibt. Die Fußnote dokumentiert die traditionelle Alternative, ohne die Hauptübersetzung dogmatisch zu überladen. Die leicht geänderte Stellung von „sitzend“ verbessert den deutschen Lesefluss bei gleicher Quellentreue.
