id: LUK.10.13
reference: Luke 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: de
  text: Weh dir, Chorazin! Weh dir, Betsaida! Denn wenn in Tyrus und Sidon die Machttaten[a] geschehen wären, die bei euch geschehen sind, hätten sie längst in Sack und Asche sitzend umgekehrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunder“; griechisch: machtvolle Taten oder Taten der Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hätten sie Buße getan“. Das griechische Verb bezeichnet hier eine grundlegende Umkehr.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Weh dir
  rationale: Bewahrt sowohl den prophetischen Weheruf als auch den direkten singularischen Bezug auf die jeweils angeredete Stadt.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Chorazin / Betsaida / Tyrus / Sidon
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufigen Namensformen.
- source_word: δυνάμεις
  choice: Machttaten
  rationale: Bezeichnet außergewöhnliche Taten, in denen sich Macht erweist, ohne den Ausdruck vorschnell auf den technischen Begriff „Wunder“ festzulegen.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: geschehen wären ... geschehen sind
  rationale: Gibt die wiederholten Formen von γίνομαι sowie den irrealen Bedingungssatz und das tatsächliche Geschehen bei den angesprochenen Städten wieder.
- source_word: ἐν ὑμῖν
  choice: bei euch
  rationale: Im Deutschen natürliche Wiedergabe des örtlich-sozialen Bereichs, in dem die Taten geschahen.
- source_word: πάλαι
  choice: längst
  rationale: Drückt knapp und idiomatisch aus, dass die Reaktion schon vor langer Zeit erfolgt wäre.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: in Sack und Asche
  rationale: Bewahrt die traditionelle konkrete Bildsprache von Trauer und Umkehr.
- source_word: καθήμενοι
  choice: dasitzend
  rationale: Erhält das im griechischen Partizip ausdrücklich genannte Sitzen, ohne einen zusätzlichen Hauptsatz zu bilden.
- source_word: μετενόησαν
  choice: ihr Denken geändert
  rationale: Gibt die Grundbedeutung von μετανοέω transparent wieder und lässt die im Kontext erkennbare moralisch-geistliche Umkehr bestehen.
theological_decisions:
- issue: Bedeutung von δυνάμεις im Wirken Jesu
  choice: Machttaten
  alternative: Wunder
  rationale: „Machttaten“ wahrt den Akzent auf machtvollen Taten; „Wunder“ ist eine geläufige, aber etwas stärker kategorisierende Deutung.
- issue: Bedeutung von μετανοέω
  choice: ihr Denken geändert
  alternative: umgekehrt / Buße getan
  rationale: Die gewählte Formulierung hält die lexikalische Komponente einer grundlegenden Sinnesänderung offen. Im Gerichtskontext umfasst sie mehr als eine bloße Meinungsänderung, was die Fußnote klarstellt.
- issue: Konkrete Gestalt der Reaktion
  choice: das Sitzen in Sack und Asche im Haupttext beibehalten
  alternative: abstrahierend als sichtbare Reue wiedergeben
  rationale: Das griechische Partizip und die konkrete prophetische Trauerbildsprache werden nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Schärfe von „Weh dir“ und die konkrete Bildsprache bleiben erhalten. „Dasitzend“ ist bewusst leicht gehoben, um das ausdrückliche Partizip καθήμενοι knapp abzubilden.
