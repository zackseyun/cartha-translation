id: LUK.10.18
reference: Luke 10:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Ich sah Satan wie einen Blitz vom Himmel fallen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich beobachtete, wie Satan wie ein Blitz vom Himmel fiel.“ Das griechische Imperfekt kann den andauernden oder sich entfaltenden Charakter des Sehens stärker hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Da sagte er zu ihnen
  rationale: Der Aorist εἶπεν wird als schlichtes Erzählpräteritum wiedergegeben; δέ markiert einen milden Anschluss, den „Da“ im Deutschen natürlich ausdrückt, ohne die Beziehung stärker festzulegen.
- source_word: Ἐθεώρουν
  choice: ich sah
  rationale: Das Imperfekt bezeichnet das Sehen als im Verlauf bzw. vor Augen stehend. Im natürlichen Deutschen kann „ich sah … fallen“ diesen Verlauf innerhalb der Wahrnehmung ausdrücken; eine ausdrücklich durative Alternative wird in der Fußnote genannt.
- source_word: τὸν Σατανᾶν
  choice: Satan
  rationale: Σατανᾶς steht hier als persönliche Bezeichnung und wird in der geläufigen deutschen Form wiedergegeben.
- source_word: ὡς ἀστραπὴν
  choice: wie einen Blitz
  rationale: ὡς führt einen Vergleich ein. Der Akkusativ „einen Blitz“ entspricht idiomatischem Deutsch nach „wie“ und bewahrt das eindringliche Bild.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: οὐρανός kann Himmel oder Luftraum bezeichnen; in diesem Zusammenhang wahrt „Himmel“ die kosmologische und theologische Offenheit.
- source_word: πεσόντα
  choice: fallen
  rationale: Das Aoristpartizip bezieht sich auf Satan als Objekt von θεωρέω. Die deutsche Konstruktion „jemanden fallen sehen“ ist natürlich und gibt das wahrgenommene Ereignis wieder.
theological_decisions:
- issue: Zeitliche und aspektuelle Einordnung des Falls Satans
  choice: Die Aussage wird als Wahrnehmung eines Fallgeschehens wiedergegeben, ohne dessen Zeitpunkt oder heilsgeschichtliche Einordnung festzulegen.
  alternative: „Ich beobachtete, wie Satan wie ein Blitz vom Himmel fiel.“
  rationale: Der griechische Wortlaut entscheidet nicht, ob ein urzeitlicher Fall, eine gegenwärtig im Wirken der Jünger sichtbar werdende Niederlage oder eine prophetische Schau gemeint ist. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzgestalt und das Blitzbild bleiben erhalten; die Fußnote macht den Aspekt des Imperfekts sichtbar, ohne den Haupttext unnötig schwerfällig zu formulieren.
