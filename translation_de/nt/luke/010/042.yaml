  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: de
  text: Doch nur weniges ist nötig – oder eines.[a] Denn Maria hat den guten Anteil[b] gewählt, der ihr nicht weggenommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nur eines ist nötig.“ Im Zusammenhang mit der Mahlzeit kann das Griechische auch konkreter verstanden werden: „Nur wenige Speisen sind nötig – oder nur eine.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „den guten Teil“. „Anteil“ kann sowohl einen Anteil an der Mahlzeit als auch bildlich einen Anteil an dem bezeichnen, was wirklich wertvoll ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Doch nur weniges ist nötig – oder eines.
  rationale: Die knappe Formulierung bewahrt den Gegensatz zwischen wenigen Dingen und einem einzigen, ohne festzulegen, ob Speisen oder das eine wirklich Notwendige gemeint sind. „Weniges“ und „eines“ geben die substantivisch gebrauchten Genitive im Deutschen möglichst direkt wieder.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Gebräuchliche deutsche Namensform.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: den guten Anteil
  rationale: „Anteil“ gibt μερίς natürlich wieder und lässt sowohl den möglichen Anklang an einen Essensanteil als auch die übertragene Bedeutung einer wertvollen Teilhabe offen. „Gut“ bildet ἀγαθή ab, ohne den nicht ausdrücklich vorhandenen Komparativ „besser“ einzuführen.
- source_word: ἐξελέξατο
  choice: hat … gewählt
  rationale: Das Perfekt ist im modernen Deutschen idiomatisch und hebt passend zur folgenden Zukunftsaussage das fortdauernde Ergebnis von Marias eigener Wahl hervor.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: der ihr nicht genommen werden wird
  rationale: Die Relativkonstruktion bezieht sich auf „Anteil“. Die passive Zukunftsaussage und der Gedanke dauerhaften Besitzes bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Bedeutung von „weniges … oder eines“ im Zusammenhang mit Martas Dienst und Marias Wahl
  choice: Die Aussage bleibt offen zwischen wenigen notwendigen Dingen und einem einzigen notwendigen Ding.
  alternative: 'Nur wenige Speisen, ja nur eine, sind nötig; oder: Nur eines ist notwendig.'
  rationale: Der griechische Wortlaut kann konkret auf die Mahlzeitvorbereitungen oder umfassender auf das eine Wesentliche bezogen werden. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Wendung „weniges … oder eines“ ist bewusst beibehalten, um die Mehrdeutigkeit des griechischen Textes zu wahren; die Fußnote erläutert die natürlichen deutschen Deutungsmöglichkeiten.
