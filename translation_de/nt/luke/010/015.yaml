id: LUK.10.15
reference: Luke 10:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: de
  text: Und du, Kafarnaum, wirst du etwa bis zum Himmel erhöht werden? Bis zum Hades[a] wirst du hinabgebracht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Totenreich“. Griechisch Hades, nicht Gehenna („Hölle“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Der Ortsname folgt der etablierten deutschen Transkription.
- source_word: μὴ ... ὑψωθήσῃ
  choice: wirst du etwa ... erhöht werden?
  rationale: μή leitet hier am besten eine rhetorische Frage ein, die eine verneinende Antwort erwartet. „etwa“ macht diese Erwartung im natürlichen Deutschen erkennbar, ohne die Frage in eine ausdrückliche Aussage umzuwandeln; „erhöht“ bewahrt zudem den möglichen übertragenen Sinn von ὑψόω.
- source_word: ἕως οὐρανοῦ
  choice: bis zum Himmel
  rationale: ἕως mit Genitiv bezeichnet die erreichte Höhe beziehungsweise Grenze. „bis zum Himmel“ erhält die räumliche Gegenüberstellung zum Hinabgebrachtwerden.
- source_word: ἕως τοῦ ᾅδου
  choice: bis zum Hades
  rationale: ᾅδης bezeichnet den Hades beziehungsweise das Totenreich und ist nicht mit Gehenna gleichzusetzen. „Hades“ wahrt diese begriffliche Unterscheidung; die verständlichere Alternative wird in der Fußnote genannt.
- source_word: καταβιβασθήσῃ
  choice: wirst du hinabgebracht werden
  rationale: Die Form ist passiv und bezeichnet ein verursachtes Hinabsteigen. „hinabgebracht werden“ bewahrt sowohl das Passiv als auch das vertikale Bild und den Gerichtston.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: „Hades“ erhält die lexikalische Unterscheidung zwischen ᾅδης und Gehenna und legt den Ausdruck nicht vorschnell als endgültigen Strafort aus. „Totenreich“ ist als erklärende Alternative möglich; „Hölle“ könnte dagegen eine weitergehende dogmatische Festlegung eintragen.
- issue: Deutung von μὴ ... ὑψωθήσῃ
  choice: rhetorische Frage mit erwarteter Verneinung
  alternative: 'ausdrückliche Aussage: „Du wirst nicht ... erhöht werden“'
  rationale: Die Frageform bewahrt die sprachliche Spannung des griechischen Textes. Das deutsche „etwa“ signalisiert die erwartete negative Antwort, ohne sie ausdrücklich vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „wirst du“ und die Gegenüberstellung „bis zum Himmel ... bis zum Hades“ bewahren den nachdrücklichen Parallelismus des griechischen Satzes. Der Fußnotenmarker steht unmittelbar bei „Hades“, auf den sich die Erklärung bezieht.
