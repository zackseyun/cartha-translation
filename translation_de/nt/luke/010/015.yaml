review_pass:
  verdict: approve
  source_fidelity: Der griechische Satzbau und die rhetorische Frage mit der erwarteten verneinenden Antwort werden zutreffend wiedergegeben. „erhöht werden“ gibt ὑψωθήσῃ angemessen wieder; „hinabgebracht werden“ wahrt beim futurischen Passiv καταβιβασθήσῃ sowohl die Verursachung als auch das Bild des erniedrigenden Abstiegs. Die korrespondierenden Ausdrücke „bis zum Himmel“ und „bis zum Hades“ erhalten die antithetische Höhen-/Tiefenbewegung. Die textkritisch unsichere Frageform der SBLGNT wird nicht durch eine glatte Negativ-Aussage ersetzt.
  naturalness: „Und du, Kafarnaum, wirst du etwa bis zum Himmel erhöht werden?“ ist modernes, verständliches und zugleich würdiges Standarddeutsch. Das vorangestellte „etwa“ markiert die rhetorische Erwartung idiomatisch. Die Wiederaufnahme von „wirst du“ im zweiten Satz ist für den nachdrücklichen Parallelismus angemessen.
  terminology: „Kafarnaum“ ist eine etablierte deutsche Namensform. „Hades“ bewahrt sachgerecht die Unterscheidung von ᾅδης gegenüber Gehenna; die Fußnote bietet mit „Totenreich“ eine verständliche lexikalische Alternative, ohne „Hölle“ als Haupttext festzulegen.
