source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: de
  text: 'Er antwortete: „Der, der ihm Barmherzigkeit erwiesen hat.“ Da sagte Jesus zu ihm: „Geh und handle auch du ebenso.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Der, der ihm Barmherzigkeit erwiesen hat
  rationale: Die Wendung ποιεῖν ἔλεος wird im Deutschen idiomatisch mit „Barmherzigkeit erweisen“ wiedergegeben; μετ’ αὐτοῦ bezeichnet hier die Person, an der barmherzig gehandelt wurde.
- source_word: Πορεύου
  choice: Geh
  rationale: Der Präsensimperativ wird als natürlicher deutscher Handlungsauftrag wiedergegeben.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: und handle du ebenso
  rationale: Das ausdrücklich gesetzte σὺ wird durch „du“ bewahrt; ποίει ὁμοίως meint nicht bloß eine einzelne Tat nachzuahmen, sondern entsprechend zu handeln.
- source_word: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς
  choice: Da sagte Jesus zu ihm
  rationale: δέ führt den nächsten Gesprächsschritt fort; „Da“ klingt im Deutschen natürlicher als ein wiederholtes „Und“, ohne einen starken Gegensatz einzutragen.
theological_decisions:
- issue: Nachdruck auf der persönlichen Aufforderung Jesu
  choice: „handle du ebenso“
  alternative: „tu ebenso“
  rationale: Das betonte σὺ bleibt ausdrücklich sichtbar. „Handle“ vermittelt den ethischen Handlungsauftrag idiomatisch, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und mündlich passend zum Dialog. Keine Fußnoten erforderlich.
