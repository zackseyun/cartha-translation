id: LUK.10.21
reference: Luke 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: de
  text: 'In derselben Stunde jubelte Jesus im Heiligen Geist und sagte: „Ich preise dich[a], Vater, Herr des Himmels und der Erde, weil du dies vor Weisen und Verständigen verborgen und es kleinen Kindern[b] offenbart hast. Ja, Vater, denn so hat es dir gefallen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich danke dir.“ Das griechische Verb kann in einem Gebet sowohl Dank als auch Lob ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „Säuglingen“. Der Ausdruck ist hier wahrscheinlich bildlich für Menschen, die demütig oder gesellschaftlich unbedeutend sind, nicht nur für kleine Kinder im wörtlichen Sinn.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „denn so war es gut in deinen Augen“ oder „denn dies war dein gnädiger Wille“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: In derselben Stunde
  rationale: Bewahrt die zeitliche Wendung samt demonstrativer Betonung in natürlichem modernem Deutsch.
- source_word: ἠγαλλιάσατο
  choice: jubelte Jesus
  rationale: Das Verb bezeichnet starke, freudige Ergriffenheit. „Jubelte“ gibt diese Intensität knapp und verständlich wieder; der im Kontext eindeutige Bezug wird mit „Jesus“ ausdrücklich gemacht.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die artikulierte Wortgruppe bezeichnet am natürlichsten den Heiligen Geist. „Im“ lässt die mögliche Nuance von Sphäre oder Wirksamkeit offen.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ich preise dich
  rationale: Im Gebetskontext kann das Verb Lob und Dank ausdrücken. „Ich preise dich“ wahrt den feierlichen Anredecharakter; „ich danke dir“ bleibt als Fußnotenalternative erhalten.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Vater, Herr des Himmels und der Erde
  rationale: Gibt die beiden Anreden unmittelbar wieder und bewahrt für κύριος die sachgerechte Gottesbezeichnung „Herr“.
- source_word: ἀπέκρυψας ... καὶ ἀπεκάλυψας
  choice: du ... verborgen und ... offenbart hast
  rationale: Die gegensätzlichen göttlichen Handlungen werden formal parallel und mit der theologischen Aussagekraft von „offenbart“ wiedergegeben.
- source_word: σοφῶν καὶ συνετῶν
  choice: Weisen und Verständigen
  rationale: Die substantivierten Adjektive bezeichnen Menschen, die als weise und einsichtig gelten, ohne zwingend formale Bildung vorauszusetzen.
- source_word: νηπίοις
  choice: Unmündigen
  rationale: Das Wort bedeutet wörtlich Säuglinge oder kleine Kinder, wird hier aber bildlich gebraucht. „Unmündige“ wahrt die Spannung zwischen kindlicher Abhängigkeit und gesellschaftlicher Unscheinbarkeit besser als eine rein altersbezogene Wiedergabe.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: denn so entsprach es deinem Wohlgefallen
  rationale: Gibt die schwerfällige griechische Wendung natürlich wieder, ohne εὐδοκία auf bloße Billigung oder ausschließlich auf „gnädigen Willen“ zu verengen.
theological_decisions:
- issue: Bezug von τῷ πνεύματι τῷ ἁγίῳ
  choice: der Heilige Geist als persönlicher göttlicher Referent
  alternative: „in seinem Geist“ beziehungsweise „im Geist“ als innere Gemütsbewegung
  rationale: Artikelstellung und Ausdrucksform sprechen deutlich für „der Heilige Geist“. Die Übersetzung vermeidet zugleich eine Festlegung darauf, ob der Dativ vor allem Sphäre oder Wirksamkeit bezeichnet.
- issue: Göttliches Verbergen und Offenbaren
  choice: Beide aktiven Verbformen mit Gott als handelndem Subjekt beibehalten
  alternative: Das Verbergen abschwächen, etwa als bloßes Nichtverstehen der Weisen
  rationale: Der griechische Text schreibt dem Vater sowohl das Verbergen als auch das Offenbaren unmittelbar zu. Diese theologische Spannung darf nicht erklärend beseitigt werden.
- issue: Bedeutung von εὐδοκία
  choice: „deinem Wohlgefallen“
  alternative: „deinem gnädigen Willen“ oder „gut in deinen Augen“
  rationale: „Wohlgefallen“ bewahrt sowohl den Aspekt des Gefallens als auch den des freien göttlichen Beschlusses, ohne die Aussage konfessionell auszuformen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gebet, wird jedoch durch deutsches Perfekt und idiomatische Wortstellung natürlich gestaltet. „Unmündige“ und „Wohlgefallen“ sind leicht gehoben, aber im biblisch-feierlichen Register allgemein verständlich.
