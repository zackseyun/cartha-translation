source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: de
  text: Und wenn ihr in eine Stadt kommt und man euch dort aufnimmt[a], dann esst, was euch vorgesetzt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „willkommen heißt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν εἰσέρχησθε
  choice: wenn ihr in eine Stadt kommt
  rationale: Die Verbindung aus Relativpronomen und ἄν bezeichnet einen unbestimmten allgemeinen Fall. Die deutsche Konditionalformulierung gibt diesen Sinn natürlich wieder; „in eine Stadt kommt“ bewahrt die durch εἰς ausgedrückte Bewegung hinein.
- source_word: δέχωνται ὑμᾶς
  choice: man euch dort aufnimmt
  rationale: δέχομαι bedeutet hier, jemanden aufzunehmen oder willkommen zu heißen. Das unpersönliche „man“ gibt das nicht ausdrücklich genannte Subjekt der dritten Person Plural idiomatisch wieder; „dort“ verdeutlicht lediglich den bereits genannten örtlichen Bezug.
- source_word: ἐσθίετε
  choice: esst
  rationale: Der Präsensimperativ erteilt eine unmittelbare Anweisung. Der einfache deutsche Imperativ ist hier präzise und natürlich.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: was euch vorgesetzt wird
  rationale: Das substantivierte Passivpartizip bezeichnet im Mahlkontext das, was den Jüngern zum Essen hingestellt oder serviert wird. „Was euch vorgesetzt wird“ bewahrt sowohl den passiven Sinn als auch die idiomatische Bildlichkeit.
theological_decisions:
- issue: Verhältnis der beiden mit καί verbundenen Satzteile zur Aufforderung
  choice: 'als allgemeine Bedingung wiedergegeben: „wenn … und …, dann“'
  alternative: 'formal koordinierend: „Und in welche Stadt ihr auch hineingeht und sie euch aufnehmen …“'
  rationale: Im Griechischen stehen beide Handlungen in einer unbestimmten Relativkonstruktion; im Deutschen macht die Konditionalform den syntaktischen Zusammenhang verständlich, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Anweisungston. „Vorgesetzt“ ist geläufig und liegt näher an der griechischen Formulierung als das stärker deutende „serviert“.
