  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: de
  text: 'Selbst den Staub aus eurer Stadt, der an unseren Füßen haftet,[a] wischen wir als Zeichen gegen euch ab.[b] Doch das sollt ihr wissen: Das Reich Gottes ist nahe gekommen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist gedrängt: Sie beschreibt den Staub aus der Stadt, der an den Füßen der Boten haftet.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bedeutet genauer „abwischen“. In ähnlichen Zusammenhängen wird häufig „abschütteln“ übersetzt. „Als Zeichen gegen euch“ macht die gegen die Adressaten gerichtete symbolische Handlung im Deutschen idiomatisch deutlich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ist herangekommen“. Das griechische Perfekt bezeichnet eine Nähe, die eingetreten ist und weiterhin Bedeutung hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: Staub
  rationale: Das Substantiv bezeichnet Staub, nicht allgemein Erde oder Schmutz, und bewahrt die symbolische Kraft der Handlung.
- source_word: κολληθέντα
  choice: haften geblieben ist
  rationale: Das Partizip bezeichnet festes Anhaften. Die Formulierung ist im Deutschen natürlich und gibt zugleich den resultativen Sinn wieder.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: aus eurer Stadt
  rationale: Die Wendung bezeichnet die Herkunft des Staubs und wird im Deutschen idiomatisch mit „aus“ wiedergegeben.
- source_word: εἰς τοὺς πόδας
  choice: an unseren Füßen
  rationale: Wörtlich steht „an/auf die Füße“; im Zusammenhang beschreibt die Wendung den Staub, der an den Füßen der Boten haftet.
- source_word: ἀπομασσόμεθα
  choice: wischen wir … ab
  rationale: Das Verb bedeutet genauer „abwischen“ und nicht das aus Parallelstellen vertraute „abschütteln“.
- source_word: ὑμῖν
  choice: gegen euch
  rationale: Der Dativ bezeichnet hier die auf die Adressaten gerichtete, konfrontative Bedeutung der symbolischen Handlung. Die ungewöhnliche, aber verständliche deutsche Fügung bewahrt diese Schärfe.
- source_word: πλήν
  choice: Doch
  rationale: Die Konjunktion markiert einen starken Gegensatz beziehungsweise einen dennoch bestehen bleibenden Sachverhalt.
- source_word: γινώσκετε
  choice: das sollt ihr wissen
  rationale: Der Imperativ fordert nachdrücklich zum Erkennen beziehungsweise Anerkennen auf; diese deutsche Formulierung klingt natürlich und bestimmt.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Das Perfekt bezeichnet eine eingetretene Nähe mit fortdauernder Bedeutung und lässt die eschatologische Spannung bestehen.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die geläufige, verständliche Wiedergabe und kann sowohl Gottes Herrschaft als auch deren Wirkungsbereich bezeichnen.
theological_decisions:
- issue: Bedeutung des Abwischens des Staubs
  choice: Eine symbolische, gegen die ablehnende Stadt gerichtete Handlung
  alternative: Eine bloß hygienische oder reisebedingte Handlung
  rationale: Der Dativ ὑμῖν und der Zusammenhang der Aussendung geben der Handlung eine konfrontative beziehungsweise zeugnishafte Funktion. „Gegen euch“ bewahrt diese Aussage, ohne sie dogmatisch auszubauen.
- issue: Bedeutung der Nähe des Reiches Gottes
  choice: Das Reich Gottes ist nahe gekommen und diese Nähe besteht fort, auch wenn die Botschaft abgelehnt wird
  alternative: Das Reich ist nur zukünftig unmittelbar bevorstehend oder bereits vollständig vollendet
  rationale: Das Perfekt ἤγγικεν verbindet eingetretene mit fortwirkender Nähe, ohne die endgültige Vollendung zu behaupten. So bleibt die eschatologische Spannung des Textes erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von „Selbst den Staub“ bewahrt den Nachdruck des griechischen Satzes. „Gegen euch abwischen“ ist bewusst markiert, um die konfrontative Richtung des Dativs nicht in eine bloße Ortsangabe abzuschwächen.
