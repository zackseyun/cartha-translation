  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: den aufmerksamkeitslenkenden Erzähleinschub Καὶ ἰδού, den unbestimmten νομικός τις, das Aufstehen, die prüfende Absicht gegenüber Jesus, die Anrede sowie die Verbindung von Tun und Erben in der Frage. »Um ewiges Leben zu erben« bewahrt die Metapher von κληρονομήσω angemessen.'
  naturalness: Modernes, gut verständliches Standarddeutsch. »Und sieh da« ist leicht gehoben, aber als erzählerischer Marker bewusst gewählt und im gegebenen würdigen Register idiomatisch. Die Auflösung der Partizipien durch finite Verben ist natürlich, ohne den Sinn zu verändern.
  terminology: »Gesetzesgelehrter« ist für νομικός im jüdisch-torarischen Kontext treffend und grenzt den Ausdruck sinnvoll von einem modernen Rechtsanwalt ab. »Lehrer«, »auf die Probe stellen« und »ewiges Leben« sind sachgerecht. Die Fußnote erläutert die historische Fachbedeutung knapp und zutreffend.
