id: LUK.10.25
reference: Luke 10:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: de
  text: 'Und sieh da: Ein Gesetzesgelehrter[a] stand auf, stellte ihn auf die Probe und fragte: »Lehrer, was muss ich tun, um ewiges Leben zu erben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: ein Fachmann für das jüdische Gesetz, besonders für die Tora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Und sieh da
  rationale: Bewahrt sowohl die weiterführende Funktion von καί als auch den aufmerksamkeitslenkenden, anschaulichen Erzählton von ἰδού, ohne altertümlich zu klingen.
- source_word: νομικός τις
  choice: ein Gesetzesgelehrter
  rationale: Bezeichnet hier einen Fachmann für das jüdische Gesetz, besonders die Tora, und vermeidet die moderne Assoziation eines Rechtsanwalts.
- source_word: ἀνέστη
  choice: stand auf
  rationale: Gibt die konkrete Erzählhandlung schlicht und unmittelbar wieder.
- source_word: ἐκπειράζων αὐτόν
  choice: stellte ihn auf die Probe
  rationale: Gibt den prüfenden, möglicherweise feindseligen Sinn von ἐκπειράζω wieder, ohne mit »versuchen« eindeutig eine Verleitung zur Sünde zu unterstellen.
- source_word: λέγων
  choice: und fragte
  rationale: Die griechische Partizipialkonstruktion wird in natürliches Deutsch überführt; da eine Frage folgt, ist »fragte« präziser und flüssiger als das wörtliche »sagte«.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Ist die direkte, gegenwärtig verständliche Wiedergabe der Anrede und vermeidet das altertümliche oder mehrdeutige »Meister«.
- source_word: τί ποιήσας
  choice: was muss ich tun
  rationale: Gibt die instrumentale beziehungsweise voraussetzende Beziehung des Aoristpartizips zum Futur idiomatisch wieder, ohne die auf menschliches Tun zugespitzte Frage abzuschwächen.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Ist die etablierte und sachlich angemessene Wiedergabe; sie bleibt im Deutschen natürlich und bewahrt den eschatologischen Gehalt.
- source_word: κληρονομήσω
  choice: erben
  rationale: Bewahrt die im griechischen Verb enthaltene Erbschaftsmetapher, statt sie zu »erlangen« oder »bekommen« zu verflachen.
theological_decisions:
- issue: Bedeutung von νομικός im jüdischen Kontext
  choice: Gesetzesgelehrter, das heißt ein Kenner des jüdischen Gesetzes
  alternative: Rechtsgelehrter; Schriftgelehrter
  rationale: Der Ausdruck bezeichnet hier keinen modernen weltlichen Juristen. »Gesetzesgelehrter« erhält den Bezug zur Tora und unterscheidet den griechischen Begriff zugleich von γραμματεύς, das gewöhnlich mit »Schriftgelehrter« wiedergegeben wird.
- issue: Aussagekraft von τί ποιήσας … κληρονομήσω
  choice: »Was muss ich tun, um ewiges Leben zu erben?«
  alternative: »Was soll ich getan haben, damit ich ewiges Leben erbe?«; »Was soll ich tun, um ewiges Leben zu erben?«
  rationale: Die idiomatische Form bewahrt die Spannung zwischen dem gefragten Tun und dem Bild des Erbens. Sie deutet weder vorweg, dass ewiges Leben verdient werde, noch löst sie die Frage bereits theologisch auf.
- issue: Absicht bei ἐκπειράζων
  choice: »stellte ihn auf die Probe«
  alternative: »versuchte ihn«; »wollte ihn prüfen«
  rationale: Die Formulierung lässt offen, ob vor allem ein prüfendes, herausforderndes oder feindseliges Motiv im Vordergrund steht, und vermeidet eine vorschnelle Festlegung auf Verführung zur Sünde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und sieh da« erhält die erzählerische Signalwirkung des griechischen Ausdrucks; der Doppelpunkt sorgt für einen natürlichen deutschen Anschluss. Die Partizipien werden als koordinierte Verben wiedergegeben, damit der Satz mündlich verständlich bleibt, ohne seinen Handlungsablauf zu verändern.
