  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: de
  text: Ebenso kam auch ein Levit an den Ort. Als er ihn sah, ging er auf der anderen Seite vorbei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder schlicht: „ging er vorbei“. Das zusammengesetzte Verb kann ein Vorbeigehen auf der gegenüberliegenden Seite und damit ein bewusstes Ausweichen nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Das Adverb stellt das Verhalten des Leviten dem zuvor geschilderten Verhalten des Priesters gleich und wird knapp und natürlich wiedergegeben.
- source_word: δὲ
  choice: —
  rationale: Die schwache weiterführende Verknüpfung wird im Deutschen durch den Satzanschluss ausreichend vermittelt; eine eigene Wiedergabe wäre unnötig schwerfällig.
- source_word: καὶ
  choice: auch
  rationale: Das Wort fügt den Leviten als weiteres paralleles Beispiel hinzu.
- source_word: Λευίτης
  choice: ein Levit
  rationale: Die etablierte historische Gruppenbezeichnung bleibt erhalten; der unbestimmte Artikel entspricht natürlichem deutschem Erzählstil.
- source_word: κατὰ τὸν τόπον
  choice: an die Stelle
  rationale: Die Wendung bezeichnet das Eintreffen an dem bereits bekannten Ort, ohne die räumliche Beziehung unnötig zu präzisieren.
- source_word: ἐλθὼν
  choice: kam
  rationale: Das vorzeitige Aoristpartizip wird als finite Erzählhandlung natürlich ins Deutsche übertragen.
- source_word: ἰδὼν
  choice: Als er ihn sah
  rationale: Die temporale Abfolge wird deutlich; das Objekt „ihn“ ist aus dem Kontext ergänzt.
- source_word: ἀντιπαρῆλθεν
  choice: ging er auf der anderen Seite vorbei
  rationale: Die Zusammensetzung des Verbs legt ein Vorbeigehen auf der gegenüberliegenden Seite und damit ein Ausweichen nahe; die Formulierung bewahrt diese Bildhaftigkeit, ohne das Motiv ausdrücklich festzulegen.
theological_decisions:
- issue: Sozial-religiöse Identität von Λευίτης
  choice: Levit
  alternative: Tempeldiener; Angehöriger des Stammes Levi
  rationale: Die überlieferte Gruppenbezeichnung wahrt die historische und erzählerische Besonderheit der Figur in der Parallele zum Priester, ohne zusätzliche Erklärung oder konfessionelle Deutung in den Haupttext einzutragen.
- issue: Absichtlichkeit des Vorbeigehens
  choice: auf der anderen Seite vorbei
  alternative: vorbei
  rationale: Die Übersetzung bildet den räumlichen Gehalt des zusammengesetzten Verbs ab, behauptet aber nicht ausdrücklich eine innere Absicht, die der Text nur nahelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Haupt- und Nebensätze lösen die griechischen Partizipien natürlich auf. Die historische Bezeichnung „Levit“ bleibt unverändert.
