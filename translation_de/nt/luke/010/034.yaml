id: LUK.10.34
reference: Luke 10:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: de
  text: Er ging zu ihm hin, verband seine Wunden und goss Öl und Wein darauf. Dann setzte er ihn auf sein eigenes Reittier, brachte ihn in eine Herberge und kümmerte sich um ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: Er ging zu ihm hin
  rationale: Das Aoristpartizip bezeichnet die Annäherung an den Verwundeten; die finite deutsche Form gibt den Handlungsablauf natürlich wieder.
- source_word: κατέδησεν
  choice: verband
  rationale: Das Verb bedeutet, Wunden zu verbinden; „verband seine Wunden“ ist im modernen Deutschen präzise und idiomatisch.
- source_word: τραύματα
  choice: Wunden
  rationale: Direkte und kontextgerechte Entsprechung für die Verletzungen des Überfallenen.
- source_word: ἐπιχέων
  choice: goss … darauf
  rationale: Das Präsenspartizip beschreibt die begleitende Art der Versorgung; die deutsche Koordination bewahrt den Zusammenhang in natürlicher Syntax.
- source_word: ἔλαιον
  choice: Öl
  rationale: „Öl“ entspricht dem griechischen Ausdruck eng; dass gewöhnlich Olivenöl gemeint ist, muss im Haupttext nicht ausdrücklich ergänzt werden.
- source_word: οἶνον
  choice: Wein
  rationale: Unmittelbare lexikalische Entsprechung, ohne eine medizinische Funktion ausdrücklich hinzuzufügen.
- source_word: ἐπιβιβάσας
  choice: setzte er ihn auf
  rationale: Gibt das Hinaufsetzen des Verletzten auf das Tier idiomatisch wieder.
- source_word: ἴδιον
  choice: sein eigenes
  rationale: Bewahrt die im griechischen ἴδιον liegende Betonung des persönlichen Besitzes.
- source_word: κτῆνος
  choice: Reittier
  rationale: Im Kontext trägt das Tier den Verletzten; „Reittier“ ist natürlicher und genauer als das sehr allgemeine „Tier“, ohne eine Tierart festzulegen.
- source_word: πανδοχεῖον
  choice: Herberge
  rationale: Geläufige, würdevolle Bezeichnung für eine Unterkunft, die Reisende aufnimmt.
- source_word: ἐπεμελήθη
  choice: kümmerte sich um ihn
  rationale: Gibt die persönliche Fürsorge des medialen Verbs in natürlichem modernem Deutsch wieder.
