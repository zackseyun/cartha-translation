id: LUK.10.2
reference: Luke 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Die Ernte ist groß, aber es gibt nur wenige Arbeiter. Bittet deshalb den Herrn der Ernte, Arbeiter in seine Ernte hinauszuschicken[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hinauszutreiben«. Das griechische Verb kann stärker sein als ein bloßes »schicken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das Imperfekt leitet hier idiomatisch eine Äußerung in der Erzählung ein; das deutsche Präteritum gibt dies natürlich wieder, ohne einen sicher fortdauernden Vorgang zu behaupten.
- source_word: δὲ
  choice: Und
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. »Und« wahrt den Erzählfluss, ohne einen unnötig starken Gegensatz einzuführen.
- source_word: θερισμός
  choice: Ernte
  rationale: Die übliche deutsche Entsprechung erhält das landwirtschaftliche Bild und dessen übertragene Bedeutung.
- source_word: πολύς
  choice: groß
  rationale: Bei »Ernte« bezeichnet πολύς deren großen Umfang. »Die Ernte ist groß« ist natürlich, klar und bildtreu.
- source_word: ἐργάται
  choice: Arbeiter
  rationale: Die moderne, allgemein verständliche Bezeichnung wahrt den Bezug auf Menschen, die bei der Ernte tätig sind.
- source_word: ὀλίγοι
  choice: nur wenige
  rationale: »Nur wenige« bringt den betonten Mangel im Kontrast zur großen Ernte idiomatisch zum Ausdruck.
- source_word: δεήθητε
  choice: Bittet
  rationale: Der Aoristimperativ fordert zu einer eindringlichen Bitte auf. Da die Bitte an den Herrn gerichtet ist, ist der Gebetsbezug deutlich, während »bittet« die lexikalische Bedeutung unmittelbar wiedergibt.
- source_word: οὖν
  choice: deshalb
  rationale: Das Wort kennzeichnet die Folgerung aus dem Missverhältnis zwischen Ernte und Arbeitern; »deshalb« ist in modernem Deutsch natürlich.
- source_word: κύριος
  choice: Herr
  rationale: »Herr« bewahrt sowohl den Gedanken der Verfügungsgewalt über die Ernte als auch die mögliche theologische Resonanz.
- source_word: ὅπως
  choice: implizit durch die Infinitivkonstruktion nach »bitten«
  rationale: Deutsch formuliert den Inhalt der Bitte idiomatisch mit »jemanden bitten, etwas zu tun«; die mit ὅπως eingeleitete Ziel- beziehungsweise Inhaltbeziehung bleibt so erhalten.
- source_word: ἐκβάλῃ
  choice: hinauszuschicken
  rationale: Die Form bezeichnet hier das Aussenden der Arbeiter in die Ernte. Das Präfix wird durch »hinaus-« gewahrt; die mögliche stärkere Nuance von »hinaustreiben« wird in der Fußnote kenntlich gemacht.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: in seine Ernte
  rationale: Die Formulierung erhält die Bewegungsrichtung und den Besitzbezug, ohne ein im Griechischen nicht ausdrücklich genanntes »Erntefeld« einzufügen.
theological_decisions:
- issue: Bezug und Aussagekraft der Bezeichnung »Herr der Ernte«
  choice: Die metaphorische Bezeichnung bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Herrn der Ernte ausdrücklich als Gott bezeichnen oder darin eine Aussage über Jesu göttliche Autorität sehen.
  rationale: Der Text stellt eine Autorität dar, der die Ernte gehört und die Arbeiter aussendet, erläutert den Bezug an dieser Stelle jedoch nicht ausdrücklich. Die offene theologische Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das vertraute Erntebild bleibt erhalten; unnötige kirchliche Fachsprache und interpretierende Zusätze werden vermieden.
