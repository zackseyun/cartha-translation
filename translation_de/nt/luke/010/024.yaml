id: LUK.10.24
reference: Luke 10:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: de
  text: 'Denn ich sage euch: Viele Propheten und Könige wollten[a] sehen, was ihr seht, und sahen es nicht, und hören, was ihr hört, und hörten es nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wünschten sich; oder: sehnten sich danach.'
    reason: Lexikalische Alternativen für ἠθέλησαν; der griechische Ausdruck kann einen Wunsch ausdrücken, ohne dessen emotionale Intensität genau festzulegen.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: „Ich sage euch“ gibt λέγω mit dem Dativ ὑμῖν unmittelbar und natürlich wieder. „Denn“ bewahrt die begründende Verbindung von γάρ zum vorausgehenden Segenswort.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: viele Propheten und Könige
  rationale: Die historischen Gruppenbezeichnungen werden direkt wiedergegeben; besonders βασιλεῖς wird nicht zum allgemeineren „Herrscher“ erweitert.
- source_word: ἠθέλησαν
  choice: wollten
  rationale: Das moderne „wollten“ gibt den Wunsch bzw. das Verlangen sachlich wieder, ohne dessen emotionale Stärke über den griechischen Ausdruck hinaus festzulegen.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: sehen, was ihr seht
  rationale: Die knappe relative Konstruktion und die Wiederholung des Sehens bleiben in natürlichem Deutsch erhalten.
- source_word: καὶ οὐκ εἶδαν
  choice: und sahen es nicht
  rationale: Der Aorist bezeichnet die historische Nichterfüllung des Wunsches. Das im Deutschen ergänzte „es“ nimmt den Inhalt des vorausgehenden Relativsatzes auf.
- source_word: καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: und hören, was ihr hört, und hörten es nicht
  rationale: Die syntaktische und rhetorische Parallelität zum Sehen wird gewahrt; „es“ macht den im Griechischen aus dem Relativsatz erschließbaren Gegenstand im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Identität der „Propheten und Könige“
  choice: Die historischen Bezeichnungen „Propheten und Könige“ ohne Deutung oder zeitlichen Zusatz beibehalten.
  alternative: „Propheten und Herrscher“ oder „Propheten und Könige der alten Zeit“
  rationale: Der Text stellt die Jünger bedeutenden Gestalten gegenüber, die diese Offenbarung sehen und hören wollten. Die Übersetzung bewahrt diese Spannung, ohne die Personen näher zu bestimmen oder den nicht ausdrücklich genannten Zusatz „der alten Zeit“ einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Verben „sehen“ und „hören“ sowie die ausgewogene Satzstruktur des griechischen Textes bleiben bewusst erhalten.
