  terminology: „Propheten“ und „Könige“ entsprechen den griechischen Bezeichnungen direkt; keine interpretierende Erweiterung wird eingeführt. „Wollten“ wahrt bei ἠθέλησαν die offene Bandbreite von wollen, wünschen und sich sehnen, ohne eine stärkere emotionale Nuance festzulegen. Die Fußnote bietet passende Alternativen.
