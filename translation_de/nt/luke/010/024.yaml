  source_fidelity: 'Die Übersetzung gibt die Syntax und den Sinn des griechischen Textes zuverlässig wieder: γάρ wird mit „Denn“ als Anschluss an den vorausgehenden Zusammenhang erhalten, πολλοὶ προφῆται καὶ βασιλεῖς mit „Viele Propheten und Könige“, und ἠθέλησαν sachlich mit „wollten“. Die beiden parallelen Infinitivgruppen („sehen ... / hören ...“) sowie die historische Nichterfüllung durch die Aoriste („sahen ... nicht / hörten ... nicht“) bleiben erkennbar. Das ergänzte „es“ ist im Deutschen idiomatisch und nimmt jeweils den Inhalt des Relativsatzes auf.'
