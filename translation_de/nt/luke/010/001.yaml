id: LUK.10.1
reference: Luke 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: de
  text: Danach bestimmte der Herr zweiundsiebzig weitere[a] und sandte sie zu zweit vor sich her in jede Stadt und jeden Ort, wohin er selbst kommen wollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier »siebzig« statt »zweiundsiebzig«.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang und den pluralischen Rückbezug idiomatisch und knapp wieder.
- source_word: ἀνέδειξεν
  choice: bestimmte
  rationale: Bezeichnet hier die Auswahl und Einsetzung für eine Aufgabe; „bestimmte“ ist modern und vermeidet einen unnötig amtlichen Beiklang.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Entspricht dem üblichen neutestamentlichen Titel κύριος und bezieht sich im Kontext auf Jesus.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: zweiundsiebzig weitere
  rationale: ἕτερος bezeichnet zusätzliche Personen; die SBLGNT-Lesart „zweiundsiebzig“ steht im Haupttext, während die bedeutsame Variante „siebzig“ in der Fußnote bewahrt wird.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Gibt die einfache Aussendung klar wieder, ohne zusätzliche amtliche oder apostolische Bedeutung einzutragen.
- source_word: ἀνὰ δύο δύο
  choice: zu zweit
  rationale: Natürliche moderne deutsche Wiedergabe des distributiven Ausdrucks „je zwei“.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: vor sich her
  rationale: Drückt idiomatisch aus, dass die Gesandten seiner eigenen Ankunft vorausgingen.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: in jede Stadt und jeden Ort
  rationale: Bewahrt beide griechischen Substantive und den umfassenden Sinn von πᾶς.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: wohin er selbst kommen wollte
  rationale: Bewahrt die Betonung durch αὐτός. „Kommen wollte“ erfasst im Kontext die bevorstehende beziehungsweise beabsichtigte Ankunft natürlicher als das steife „im Begriff war zu kommen“.
theological_decisions:
- issue: Textvariante bei der Zahl der Beauftragten
  choice: zweiundsiebzig
  alternative: siebzig
  rationale: Der vorgegebene SBLGNT-Haupttext liest ἑβδομήκοντα δύο. Die gut bezeugte alternative Lesart „siebzig“ wird als echte Textvariante in einer Fußnote genannt, ohne sie dogmatisch auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Satzfluss. Die Formulierung bleibt nahe an der griechischen Struktur, vermeidet jedoch unnötig steife Wendungen.
