  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: de
  text: 'In welches Haus ihr auch kommt, sagt zuerst: »Friede sei diesem Haus!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Friede diesem Haus!« oder »Friede komme über dieses Haus!« Das Griechische verwendet eine knappe Gruß- und Segensformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: Wenn ihr in ein Haus kommt
  rationale: Die indefinite Relativkonstruktion mit ἄν bezeichnet jeden entsprechenden Fall. Im Deutschen gibt »wenn … ein Haus« den allgemeinen, zukunftsbezogenen Sinn natürlicher wieder als das schwerfällige »In welches Haus auch immer«. »In« bewahrt zusammen mit »kommen« die gerichtete Bewegung.
- source_word: εἰσέλθητε
  choice: ihr … kommt
  rationale: Der Aorist Konjunktiv steht in einer indefiniten Relativkonstruktion. »In ein Haus kommen« ist im modernen Deutsch idiomatisch und gibt das Eintreten wieder, ohne den Vorgang auszuschmücken.
- source_word: οἰκίαν
  choice: Haus
  rationale: Gemeint ist zunächst das betretene Wohnhaus; »Haus« kann im Segenswort zugleich die dort lebende Hausgemeinschaft mit einschließen.
- source_word: πρῶτον
  choice: zuerst
  rationale: 'Das Wort kennzeichnet die zeitliche beziehungsweise sachliche Priorität: Dies soll ihre erste Äußerung beim Betreten sein.'
- source_word: λέγετε
  choice: sagt
  rationale: Der Präsensimperativ schreibt die wiederholt anzuwendende Äußerung vor. »Sagt« ist die direkte und natürliche deutsche Entsprechung.
- source_word: Εἰρήνη
  choice: Friede
  rationale: Der artikellose Nominativ gehört zu einer knappen Gruß- und Segensformel. »Friede« erhält deren biblisch-semitische Prägung.
- source_word: τῷ οἴκῳ τούτῳ
  choice: sei diesem Haus
  rationale: Der Dativ bezeichnet den Empfänger des Friedenswunsches. Das ergänzte »sei« macht die knappe griechische Segensformel im Deutschen verständlich, ohne ihren Gehalt auszudeuten.
theological_decisions:
- issue: Charakter der Friedensformel
  choice: 'Als wirksamen Gruß beziehungsweise Segenswunsch wiedergeben: »Friede sei diesem Haus!«'
  alternative: 'Wörtlich-knapp: »Friede diesem Haus!«; alternativ: »Friede komme über dieses Haus!«'
  rationale: Die Formulierung ist mehr als ein beiläufiges Hallo und spricht dem Haus Frieden zu. »Sei« wahrt den Wunsch- und Segenscharakter, ohne eine bestimmte liturgische oder konfessionelle Deutung einzutragen.
- issue: Bedeutungsumfang von οἶκος
  choice: »Haus« verwenden und die mögliche Mitbedeutung der Hausgemeinschaft offenhalten
  alternative: Explizit mit »Hausgemeinschaft« oder »Bewohner dieses Hauses« übersetzen
  rationale: Der konkrete Ort und seine Bewohner können im Kontext zusammengehören. Die Übersetzung soll diese Mehrschichtigkeit nicht einseitig auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Konditionalkonstruktion ist idiomatischer als eine formale Nachbildung des griechischen indefiniten Relativsatzes; die direkte Rede bewahrt den knappen Segenscharakter.
