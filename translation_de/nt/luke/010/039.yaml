  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: de
  text: Und sie hatte eine Schwester namens Maria, die sich ebenfalls zu den Füßen Jesu[a] setzte und seinem Wort zuhörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier »des Herrn« statt »Jesu«.
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: sie
  rationale: Das Demonstrativpronomen bezieht sich im Zusammenhang auf Marta; im modernen Deutschen ist das Personalpronomen die natürliche Wiedergabe.
- source_word: ἀδελφὴ καλουμένη Μαριάμ
  choice: eine Schwester namens Maria
  rationale: Gibt die Verwandtschaftsbezeichnung und die Namensangabe präzise und idiomatisch wieder.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: sich zu den Füßen … setzte
  rationale: Das Aoristpartizip bezeichnet das Einnehmen einer Sitzposition; die deutsche Formulierung bewahrt zugleich das Bild einer Schülerin zu Füßen ihres Lehrers.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Die vorgelegte SBLGNT-Quelle liest ausdrücklich Ἰησοῦ; daher steht im Haupttext der Eigenname.
- source_word: ἤκουεν
  choice: zuhörte
  rationale: Das Imperfekt schildert ein andauerndes Zuhören; im Satzgefüge gibt das deutsche Präteritum dies natürlich wieder.
- source_word: τὸν λόγον αὐτοῦ
  choice: seinem Wort
  rationale: Die nahe Wiedergabe bewahrt die Bedeutungsbreite von λόγος und legt es nicht vorschnell auf »Lehre« oder »Botschaft« fest.
theological_decisions:
- issue: Textvariante beim Namen beziehungsweise Titel dessen, zu dessen Füßen Maria saß
  choice: Jesus
  alternative: der Herr
  rationale: Der Haupttext folgt der angegebenen SBLGNT-Lesart Ἰησοῦ. Die bedeutungsvolle Variante κυρίου wird in der Fußnote bewahrt, ohne den Titel in den Ausgangstext hineinzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstruktur bleibt nah am Griechischen, ohne unnatürlich zu wirken; das Imperfekt wird kontextgerecht durch »zuhörte« wiedergegeben.
