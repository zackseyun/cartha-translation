  source_fidelity: Der deutsche Text gibt die adversative Korrektur von πλὴν, die wiederholte Imperativstruktur μὴ χαίρετε … χαίρετε δέ, die unspezifische Bezeichnung τὰ πνεύματα sowie den resultativen Sinn von ἐγγέγραπται sachgerecht wieder. „In den Himmeln“ erhält den griechischen Plural von ἐν τοῖς οὐρανοῖς.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Sich darüber freuen, dass …“ ist idiomatisch; die Wiederholung von „freut euch“ ist rhetorisch angemessen. „In den Himmeln“ ist im Deutschen bewusst markiert, aber durch die Fußnote transparent gemacht und als formnahe Übersetzung vertretbar.
  terminology: „Die Geister“ wahrt die im griechischen Wortlaut vorhandene Offenheit und vermeidet die interpretierende Einengung auf „Dämonen“. „Eingeschrieben sind“ ist für den bleibenden Registereintrag und den resultativen Perfektsinn passend. Die Fußnote bietet mit „im Himmel“ die geläufigere deutsche Alternative an, ohne den Haupttext zu nivellieren.
