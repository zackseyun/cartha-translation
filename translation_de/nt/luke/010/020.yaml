id: LUK.10.20
reference: Luke 10:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: de
  text: Doch freut euch nicht darüber, dass die Geister sich euch unterordnen, sondern freut euch darüber, dass eure Namen in den Himmeln eingeschrieben sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditioneller und im Deutschen geläufiger: „im Himmel“. Im Griechischen steht der Plural: „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den nachdrücklichen korrigierenden Gegensatz zur vorherigen Freude der Jünger.
- source_word: ἐν τούτῳ
  choice: darüber
  rationale: Im Deutschen ist „sich darüber freuen, dass …“ die natürliche Entsprechung und bewahrt den demonstrativen Bezug.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: freut euch nicht ... sondern freut euch
  rationale: Die Wiederholung desselben Verbs erhält den rhetorischen Gegensatz und die lexikalische Wiederholung von χαίρω.
- source_word: τὰ πνεύματα
  choice: die Geister
  rationale: Bewahrt die allgemeine Bezeichnung des Griechischen; der Zusammenhang weist auf feindliche Geistwesen, ohne dass der Vers selbst ausdrücklich „Dämonen“ sagt.
- source_word: ὑμῖν ὑποτάσσεται
  choice: sich euch unterordnen
  rationale: Gibt die gegenwärtige Unterstellung unter die Autorität der Jünger verständlich wieder und lässt die mediale beziehungsweise passive Nuance offen.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: eure Namen
  rationale: Natürliche deutsche Wiedergabe der Genitivkonstruktion.
- source_word: ἐγγέγραπται
  choice: eingeschrieben sind
  rationale: Drückt den resultativen Zustand des griechischen Perfekts aus und entspricht dem Bild eines bleibenden Eintrags besser als das allgemeinere „geschrieben stehen“.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Erhält bewusst den Plural des griechischen Ausdrucks, auch wenn im Deutschen traditionell häufig der Singular steht.
theological_decisions:
- issue: Ort des himmlischen Eintrags
  choice: in den Himmeln
  alternative: im Himmel
  rationale: Der Plural οὐρανοῖς wird nicht stillschweigend zum traditionellen deutschen Singular vereinheitlicht; die Fußnote nennt die idiomatische Alternative.
- issue: Wesen der Geister
  choice: die Geister
  alternative: die Dämonen / die bösen Geister
  rationale: Der Kontext bezeichnet feindliche geistliche Mächte, doch πνεύματα bleibt in diesem Vers lexikalisch unspezifisch. Die Übersetzung engt den Ausdruck daher nicht konfessionell oder interpretierend ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Formulierung „freut euch“ bewahrt die eindringliche Parallelstruktur. „In den Himmeln“ klingt markierter als der traditionelle Singular, folgt jedoch bewusst der griechischen Form; die Fußnote unterstützt das Verständnis.
