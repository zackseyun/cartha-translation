review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen. „Meine Schwester mich allein bedienen lässt“ verschiebt jedoch die Konstruktion: Das Griechische sagt, dass die Schwester Marta allein zurückgelassen hat, damit Marta bedient, nicht dass sie Marta bedienen lässt. Die explizite Ergänzung „zu Jesus“ bei ἐπιστᾶσα ist aus dem Kontext verständlich, aber im griechischen Wortlaut nicht ausgedrückt.'
  naturalness: „Bedienung“ und besonders „jemanden bedienen lassen“ klingen im heutigen Deutsch mehrdeutig bzw. unnatürlich für die häusliche Bewirtung. „Bewirtung“ sowie „mich bei der Bewirtung allein gelassen hat“ sind idiomatisch und bewahren den Sinn.
  terminology: „Herr“ ist für Κύριε angemessen. „Bewirtung“ bezeichnet hier die praktische häusliche διακονία, ohne sie zu einem kirchlichen Dienst zu machen. Die Wiederholung mit „bei der Bewirtung“ stellt die Verbindung zum folgenden διακονεῖν klarer her.
  issues:
  - severity: medium
    issue: „meine Schwester mich allein bedienen lässt“ gibt μόνην με κατέλειπεν διακονεῖν nicht präzise wieder.
    rationale: κατέλειπεν bedeutet „ließ mich zurück/zurückgelassen“; der Infinitiv bezeichnet Martas Tätigkeit. Die deutsche Formulierung kann bedeuten, Maria veranlasse Marta, sie zu bedienen.
  - severity: low
    issue: „Bedienung“ ist im modernen Deutsch für häusliche Gastbewirtung semantisch weniger klar.
    rationale: Es kann auch einen Bedienvorgang oder technisches Bedienen bezeichnen. „Bewirtung“ ist in diesem Kontext natürlicher.
  - severity: low
    issue: „zu Jesus“ ist eine kontextuelle Explizierung.
    rationale: ἐπιστᾶσα bezeichnet das Herantreten, ohne das Ziel im Vers ausdrücklich zu nennen; „Sie trat hinzu“ wahrt den Wortlaut besser.
  revised_text: 'Marta aber war von der vielen Bewirtung ganz in Anspruch genommen. Sie trat hinzu und sagte: „Herr, kümmert es dich nicht, dass meine Schwester mich bei der Bewirtung allein gelassen hat? Sag ihr also, dass sie mir helfen soll!“'
