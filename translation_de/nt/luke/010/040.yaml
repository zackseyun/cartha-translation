source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: de
  text: 'Marta aber war von der vielen Bewirtung ganz in Anspruch genommen. Sie trat hinzu und sagte: „Herr, kümmert es dich nicht, dass meine Schwester mich bei der Bewirtung allein gelassen hat? Sag ihr also, dass sie mir helfen soll!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: war … ganz in Anspruch genommen
  rationale: Das Imperfekt beschreibt einen anhaltenden Zustand; das Verb bezeichnet hier, dass Marta durch ihre Aufgaben stark beansprucht und dadurch abgelenkt war. Die Formulierung ist natürlich und lässt den Bezugspunkt ihrer Ablenkung im Kontext offen.
- source_word: περὶ πολλὴν διακονίαν
  choice: von der vielen Bedienung
  rationale: Im häuslichen Zusammenhang bezeichnet διακονία die praktische Bewirtung beziehungsweise Bedienung, nicht ein kirchliches Amt. „Bedienung“ wahrt den konkreten Dienstcharakter, ohne ihn auf bloße Vorbereitungen einzuengen.
- source_word: ἐπιστᾶσα
  choice: Sie trat zu Jesus
  rationale: Das Partizip bezeichnet hier das Herantreten. Das im Griechischen durch den Zusammenhang gegebene Ziel wird im Deutschen mit „zu Jesus“ natürlich ausgedrückt.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche und kontextgerechte Wiedergabe der respektvollen Anrede Jesu.
- source_word: οὐ μέλει σοι
  choice: kümmert es dich nicht
  rationale: Die Wendung fragt direkt, ob die Lage Jesus ein Anliegen ist. „Kümmert es dich nicht“ gibt den vorwurfsvollen Ton idiomatisch wieder, ohne eine darüber hinausgehende emotionale Aussage einzutragen.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: meine Schwester mich allein bedienen lässt
  rationale: Die Formulierung bewahrt sowohl μόνην („allein“) als auch den komplementären Infinitiv διακονεῖν. Das deutsche Präsens entspricht in dieser direkten Beschwerde natürlich dem fortdauernden Ergebnis des griechischen Aorists.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Sag ihr doch
  rationale: Der Imperativ bleibt direkt; „doch“ gibt in diesem Zusammenhang die folgernde und drängende Kraft von οὖν idiomatisch wieder.
- source_word: συναντιλάβηται
  choice: sie soll mir helfen
  rationale: Das Verb bezeichnet gemeinsames Zupacken beziehungsweise unterstützendes Mithelfen. „Mir helfen“ ist klares, modernes Deutsch; der gemeinsame Einsatz ergibt sich aus dem Kontext.
theological_decisions:
- issue: Wiedergabe von κύριος in Martas Anrede an Jesus
  choice: Herr
  alternative: Meister
  rationale: „Herr“ wahrt die respektvolle Anrede und entspricht zugleich dem breiteren lukanischen Gebrauch für Jesus, ohne die mögliche christologische Bedeutung abzuschwächen oder eigens festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird aber für flüssige direkte Rede idiomatisch gestaltet. „Ganz in Anspruch genommen“ vermeidet das missverständliche Bild eines bloßen räumlichen Wegziehens; „Bedienung/bedienen“ hält die lexikalische Verbindung zwischen διακονία und διακονεῖν sichtbar.
