  to: 'Marta aber war von der vielen Bewirtung ganz in Anspruch genommen. Sie trat hinzu und sagte: „Herr, kümmert es dich nicht, dass meine Schwester mich bei der Bewirtung allein gelassen hat? Sag ihr also, dass sie mir helfen soll!“'
