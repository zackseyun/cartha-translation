id: LUK.10.17
reference: Luke 10:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: de
  text: 'Da kehrten die zweiundsiebzig[a] voller Freude zurück und sagten: »Herr, sogar die Dämonen unterwerfen sich uns in deinem Namen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »die siebzig« statt »die zweiundsiebzig«.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: kehrten … zurück
  rationale: Der Aorist von ὑποστρέφω bezeichnet die Rückkehr vom zuvor erteilten Auftrag; die deutsche Verbklammer ist natürlich und präzise.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung weiter. »Da« stellt im Deutschen einen flüssigen narrativen Anschluss her, ohne einen starken Gegensatz auszudrücken.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: die zweiundsiebzig
  rationale: Der vorgegebene SBLGNT-Text liest »zweiundsiebzig«. Die bedeutende Variante »siebzig« wird in der Fußnote bewahrt.
- source_word: μετὰ χαρᾶς
  choice: voller Freude
  rationale: Die Wendung gibt den begleitenden Gemütszustand idiomatisch wieder und bewahrt das Substantiv »Freude«.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet die direkte Rede ein. Eine finite, koordinierte Form klingt im modernen Deutschen natürlicher als »sagend«.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ κύριε ist die direkte Anrede an Jesus und wird entsprechend dem üblichen neutestamentlichen Sprachgebrauch mit »Herr« wiedergegeben.
- source_word: καὶ
  choice: sogar
  rationale: καί hat hier steigernde Bedeutung und hebt das Erstaunen darüber hervor, dass selbst die Dämonen gehorchen.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: »Dämonen« ist die direkte und im Neuen Testament übliche Wiedergabe für feindliche Geistwesen; der Artikel bleibt erhalten.
- source_word: ὑποτάσσεται
  choice: unterwerfen sich
  rationale: Die mediale/passive Form beschreibt ihre Unterordnung. Das deutsche Präsens bewahrt den berichteten, als gegenwärtig erfahrenen Sachverhalt; »sich unterwerfen« ist natürlicher als »untertan sein«.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bei ὑποτάσσω bezeichnet diejenigen, denen sich die Dämonen unterordnen, und wird im Deutschen direkt als Dativ wiedergegeben.
- source_word: ἐν τῷ ὀνόματί σου
  choice: in deinem Namen
  rationale: Die traditionelle und transparente Wendung bezeichnet Handeln aufgrund der mit Jesu Namen verbundenen Vollmacht, ohne die genaue Beziehung auf eine einzige Nuance festzulegen.
theological_decisions:
- issue: Textvariante bei der Zahl der ausgesandten Jünger
  choice: die zweiundsiebzig
  alternative: die siebzig
  rationale: Der vorgegebene SBLGNT-Haupttext bietet δύο (»zwei«) und damit »zweiundsiebzig«. Die gut bezeugte und bekannte Lesart »siebzig« wird nicht stillschweigend verworfen, sondern in einer Fußnote genannt.
- issue: Bedeutung von »in deinem Namen«
  choice: in deinem Namen
  alternative: durch deinen Namen / kraft deines Namens
  rationale: Die wörtlich-naheliegende deutsche Wendung lässt offen, ob besonders Beauftragung, Repräsentation oder wirksame Vollmacht betont ist, und vermeidet eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und mündlich, ohne umgangssprachlich zu wirken. »Voller Freude« und die finite Wiedergabe des Partizips sorgen für einen natürlichen Erzählfluss.
