  source_fidelity: 'Der Entwurf folgt dem SBLGNT zuverlässig: Ὑπέστρεψαν ist idiomatisch als „kehrten … zurück“ wiedergegeben, οἱ ἑβδομήκοντα δύο als „die zweiundsiebzig“, und die steigernde Funktion von καί wird treffend durch „sogar“ erfasst. „Die Dämonen unterwerfen sich uns in deinem Namen“ gibt ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου ohne unzulässige Ausdeutung wieder.'
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. „Da“ ist ein angemessener erzählerischer Anschluss für δέ; „voller Freude“ und die finite Form „sagten“ sind idiomatisch und bewahren den Sinn.
  terminology: „Herr“, „Dämonen“ und „in deinem Namen“ sind terminologisch konsistent, sachgerecht und theologisch nicht überbestimmt. Die textkritische Alternative zu „zweiundsiebzig“ ist korrekt und klar an der betreffenden Stelle verankert.
