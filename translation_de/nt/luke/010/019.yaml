id: LUK.10.19
reference: Luke 10:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: de
  text: Seht, ich habe euch Vollmacht über Schlangen und Skorpione gegeben, auf sie zu treten, und über die ganze Macht des Feindes; und nichts wird euch jemals Schaden zufügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nichts wird euch keinesfalls schaden.“ Im Griechischen steht eine besonders nachdrückliche Verneinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Seht
  rationale: Bewahrt den aufmerksamkeitslenkenden und nachdrücklichen Charakter des Diskursmarkers in natürlichem, würdigem Deutsch.
- source_word: δέδωκα
  choice: ich habe ... gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit fortdauernder Wirkung.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Bezeichnet verliehene Autorität und hält den begrifflichen Unterschied zu δύναμις („Macht“) im selben Vers aufrecht.
- source_word: τοῦ πατεῖν
  choice: zu treten
  rationale: Gibt den Inhalt beziehungsweise Zweck der verliehenen Vollmacht wieder und wahrt das konkrete Bild, ohne es durch „zertreten“ zu verstärken.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: auf Schlangen und Skorpione
  rationale: Eine unmittelbare, natürliche Wiedergabe des räumlichen Bildes; die mögliche symbolische Bedeutung bleibt offen.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: über die ganze Macht
  rationale: Drückt die Überordnung gegenüber der Macht des Feindes aus und folgt zugleich der Koordination des griechischen Satzes.
- source_word: δύναμιν
  choice: Macht
  rationale: Bewahrt den Unterschied zur zuvor genannten „Vollmacht“ (ἐξουσία).
- source_word: τοῦ ἐχθροῦ
  choice: des Feindes
  rationale: Erhält die substantivische, singularische Bezeichnung, ohne den im Kontext naheliegenden Bezug auf Satan ausdrücklich in den Text einzutragen.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: nichts wird euch jemals Schaden zufügen
  rationale: „Jemals“ vermittelt die starke Verneinung mit οὐ μή; „Schaden zufügen“ gibt ἀδικέω im Kontext idiomatisch wieder.
theological_decisions:
- issue: Bezug von „der Feind“
  choice: Die allgemeine Bezeichnung „der Feind“ bleibt im Haupttext stehen.
  alternative: Ausdrückliche Identifizierung als Satan oder Teufel.
  rationale: Der Zusammenhang legt satanische Gegnerschaft nahe, doch der griechische Wortlaut nennt nur „den Feind“. Die Übersetzung lässt diese Identifizierung daher unausgesprochen.
- issue: Wörtliche oder symbolische Bedeutung von Schlangen und Skorpionen
  choice: Das konkrete Bild wird unverändert wiedergegeben.
  alternative: Deutende Wiedergabe als dämonische oder feindliche Mächte.
  rationale: Die Wörter bezeichnen unmittelbar Schlangen und Skorpione, während der Kontext zugleich eine symbolische Dimension nahelegen kann. Diese Spannung wird nicht aufgelöst.
- issue: Umfang der Verheißung, dass nichts Schaden zufügen wird
  choice: Die nachdrückliche Zusage wird ohne einschränkenden Zusatz übersetzt.
  alternative: Deutende Einschränkung auf geistlichen oder endgültigen Schaden.
  rationale: Der Vers selbst formuliert uneingeschränkt und emphatisch. Eine nähere Bestimmung der Art des Schadens wäre Interpretation und gehört nicht in den Haupttext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit leicht gehobenem biblischem Ton. „Seht“ ist würdig, aber weniger altertümlich als „Siehe“. „Vollmacht“ und „Macht“ bilden den griechischen Gegensatz zwischen ἐξουσία und δύναμις ab.
