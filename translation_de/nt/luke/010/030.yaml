source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: de
  text: 'Jesus erwiderte: »Ein Mann ging von Jerusalem nach Jericho hinab und fiel Räubern in die Hände. Die zogen ihn aus, schlugen ihn und gingen fort; sie ließen ihn halb tot liegen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβών
  choice: erwiderte
  rationale: Das Partizip bezeichnet hier Jesu Antwort auf die vorausgehende Frage; »erwiderte« gibt die Gesprächssituation natürlich und präzise wieder.
- source_word: Ἄνθρωπός τις
  choice: Ein Mann
  rationale: Die unbestimmte Figur wird im Deutschen idiomatisch mit »Ein Mann« eingeführt; ein steifes »ein gewisser Mann« ist nicht erforderlich.
- source_word: κατέβαινεν
  choice: ging … hinab
  rationale: Bewahrt die topografisch zutreffende Abwärtsbewegung von Jerusalem nach Jericho.
- source_word: λῃσταῖς περιέπεσεν
  choice: fiel Räubern in die Hände
  rationale: Eine natürliche deutsche Wendung, die das unvermutete Geraten unter gewalttätige Räuber ausdrückt.
- source_word: ἐκδύσαντες
  choice: zogen ihn aus
  rationale: Gibt ausdrücklich wieder, dass die Räuber ihm die Kleidung abnahmen.
- source_word: πληγὰς ἐπιθέντες
  choice: schlugen ihn nieder
  rationale: Drückt die gewaltsame Misshandlung idiomatisch aus, ohne Art oder Zahl der Verletzungen über den griechischen Text hinaus festzulegen.
- source_word: ἡμιθανῆ
  choice: halb tot
  rationale: Direkte und im Deutschen geläufige Entsprechung; der lebensbedrohliche Zustand bleibt klar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit flüssiger Erzählweise. Die Bildhaftigkeit und die Abfolge der Handlungen bleiben erhalten; der zusätzliche Sinn von καί vor ἐκδύσαντες wird durch die fortlaufende Reihung wiedergegeben, ohne ein im Deutschen schwerfälliges »auch« zu erzwingen.
