id: LUK.10.9
reference: Luke 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: de
  text: 'Heilt die Kranken dort und sagt ihnen: »Das Reich Gottes ist euch nahegekommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: Heilt
  rationale: Der Präsensimperativ fordert zu fortgesetztem Handeln auf. »Heilt« gibt im Zusammenhang mit den Kranken die naheliegende Bedeutung klar und natürlich wieder.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: die Kranken dort
  rationale: ἀσθενεῖς bezeichnet hier wegen θεραπεύετε körperlich Kranke. Das natürliche deutsche »dort« nimmt den in Vers 8 genannten Ort auf, auf den sich αὐτῇ bezieht.
- source_word: λέγετε αὐτοῖς
  choice: sagt ihnen
  rationale: Die schlichte und direkte Formulierung entspricht dem Imperativ λέγετε und klingt in modernem Deutsch natürlich.
- source_word: Ἤγγικεν
  choice: ist … nahegekommen
  rationale: Das Perfekt bezeichnet ein erfolgtes Näherkommen mit gegenwärtiger Relevanz. »Ist nahegekommen« bewahrt sowohl den Vorgang als auch seinen fortbestehenden Bezug zur Gegenwart.
- source_word: ἐφ’ ὑμᾶς
  choice: euch
  rationale: Bei ἐγγίζω bezeichnet ἐπί mit Akkusativ das Näherkommen in Bezug auf die Angesprochenen. Die Verbindung »euch nahegekommen« ist präzise und idiomatisch.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: »Das Reich Gottes« ist die geläufige, verständliche Wiedergabe und lässt sowohl den Herrschaftscharakter als auch die umfassendere biblische Bedeutungsbreite des Ausdrucks offen.
theological_decisions:
- issue: Sinn der Ankündigung vom Reich Gottes
  choice: Die Aussage verkündet, dass Gottes Reich den Angesprochenen nahegekommen ist, ohne festzulegen, es sei bereits vollständig verwirklicht oder lediglich künftig.
  alternative: »Gottes Herrschaft ist jetzt vollständig gegenwärtig« oder »Gottes Reich steht nur unmittelbar bevor«
  rationale: Das Perfekt ἤγγικεν drückt erfolgtes Näherkommen mit gegenwärtiger Bedeutung aus; der Vers entscheidet jedoch nicht abschließend über das Verhältnis von gegenwärtiger und zukünftiger Vollendung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Dort« vermeidet das im Deutschen unnatürliche »in ihr« beim Rückbezug auf die zuvor genannte Stadt. Die Satzstruktur bleibt knapp und unmittelbar.
