id: LUK.10.26
reference: Luke 10:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: de
  text: 'Er sagte zu ihm: „Was steht im Gesetz geschrieben? Wie liest du es?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie verstehst du es?“ Wörtlicher: „Wie liest du?“ Die griechische Formulierung kann auch das Verständnis oder die Auslegung des Gelesenen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Er
  rationale: Der Artikel steht pronominal für das erschlossene Subjekt. δέ ist hier ein schwaches erzählerisches Bindewort; im natürlichen Deutschen muss es nicht eigens wiedergegeben werden.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sagte zu ihm
  rationale: Dies gibt λέγω mit πρός und Akkusativ als schlichte Anrede wieder, ohne eine zusätzliche Bedeutung wie „antwortete“ einzutragen.
- source_word: Ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: νόμος bezeichnet hier die anerkannte heilige Gesetzesschrift Israels. „Gesetz“ ist im Deutschen verständlich und lässt den Bezug auf die Tora erkennen, ohne im Haupttext eine Transliteration einzuführen.
- source_word: τί γέγραπται
  choice: Was steht ... geschrieben?
  rationale: 'Die feste deutsche Wendung bewahrt den resultativen Sinn des Perfekts: Es wurde geschrieben und steht weiterhin als maßgeblicher Text da.'
- source_word: πῶς ἀναγινώσκεις
  choice: Wie liest du es?
  rationale: ἀναγινώσκω bedeutet zunächst „lesen“. Das ergänzte „es“ nimmt im Deutschen natürlich auf das Gesetz beziehungsweise das dort Geschriebene Bezug; die offene Frage kann zugleich die Art des Verständnisses einschließen.
theological_decisions:
- issue: Bedeutung von νόμος
  choice: „Gesetz“ als die anerkannte Gesetzesschrift Israels
  alternative: „Tora“ oder Gesetz im allgemeinen Sinn
  rationale: Der Zusammenhang mit einem Gesetzesgelehrten verweist auf die jüdische heilige Schrift. „Gesetz“ bewahrt diesen Bezug, ohne ihn konfessionell oder terminologisch enger festzulegen.
- issue: Deutung von πῶς ἀναγινώσκεις
  choice: Die wörtliche Lesemetapher „Wie liest du es?“ bleibt im Haupttext erhalten.
  alternative: „Wie verstehst/deutest du es?“
  rationale: Die Frage kann auf Verständnis und Auslegung zielen, doch das griechische Verb bezeichnet ausdrücklich das Lesen. Die wörtliche Form wahrt die rhetorische und theologische Offenheit.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Formulierung „steht ... geschrieben“ ist geläufig und trägt den fortdauernden Geltungsanspruch des griechischen Perfekts. Die direkte Frage bleibt knapp und rhetorisch offen.
