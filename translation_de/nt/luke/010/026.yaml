  source_fidelity: Der Text gibt ὁ δὲ εἶπεν πρὸς αὐτόν sachgerecht als „Er sagte zu ihm“ wieder. „Was steht im Gesetz geschrieben?“ entspricht Ἐν τῷ νόμῳ τί γέγραπται idiomatisch und bewahrt den Bezug auf die schriftlich vorliegende Gesetzesschrift. „Wie liest du es?“ gibt πῶς ἀναγινώσκεις präzise wieder; das im Deutschen ergänzte Objekt ist aus dem Kontext eindeutig und keine sachliche Einengung.
