source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: de
  text: 'Und noch ein anderer sagte: „Ich will dir folgen, Herr; doch erlaube mir, zuerst von den Menschen bei mir zu Hause[a] Abschied zu nehmen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denen in mein Haus“; die ungewöhnliche Wendung meint Menschen, die bei ihm zu Hause sind oder zu seinem häuslichen Umfeld gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: Und noch ein anderer
  rationale: 'Bewahrt sowohl die Verknüpfung mit dem vorherigen Gespräch als auch den additiven Sinn: Eine weitere Person tritt hinzu.'
- source_word: Ἀκολουθήσω σοι
  choice: Ich will dir folgen
  rationale: Das Futur bezeichnet hier die erklärte Absicht des Sprechers; „ich will“ gibt diesen voluntativen Zug im Deutschen natürlich wieder.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ wahrt die respektvolle Anrede und zugleich das mögliche theologische Gewicht, ohne die Anrede auf bloßes „mein Herr“ oder „Meister“ festzulegen.
- source_word: πρῶτον
  choice: zuerst
  rationale: Gibt die zeitliche beziehungsweise sachliche Priorität klar und idiomatisch wieder.
- source_word: ἐπίτρεψόν μοι
  choice: erlaube mir
  rationale: Der Aoristimperativ formuliert eine Bitte um Erlaubnis; „erlaube mir“ ist würdig, verständlich und weniger steif als „gestatte mir“.
- source_word: ἀποτάξασθαι
  choice: Abschied zu nehmen
  rationale: Das mediale Verb bedeutet in diesem Zusammenhang, sich von Menschen zu verabschieden beziehungsweise von ihnen Abschied zu nehmen.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: von den Menschen bei mir zu Hause
  rationale: Die ungewöhnliche Präpositionalwendung bezeichnet die Menschen, die sich im Haus des Sprechers befinden oder zu seinem häuslichen Umfeld gehören. Die Ergänzung „Menschen“ macht den substantivierten Ausdruck im Deutschen verständlich, ohne ihn enger als „Familie“ oder „Hausgemeinschaft“ zu bestimmen.
theological_decisions:
- issue: Anrede κύριε an Jesus
  choice: Herr
  alternative: Meister; mein Herr
  rationale: „Herr“ erhält die Spannweite zwischen respektvoller Anrede und christologisch gewichtiger Bezeichnung, statt sie in eine Richtung aufzulösen.
- issue: Umfang von τοῖς εἰς τὸν οἶκόν μου
  choice: die Menschen bei mir zu Hause
  alternative: meine Hausgemeinschaft; die in meinem Haus
  rationale: Der griechische Ausdruck nennt weder ausdrücklich nur die Familie noch eine fest umrissene Hausgemeinschaft. Die gewählte Formulierung bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ bildet den Vorbehalt deutlich ab; „bei mir zu Hause“ klingt natürlicher als „in meinem Haus“, während die Fußnote die auffällige griechische Wendung dokumentiert.
