review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt Zeitbezug, Ziel Jerusalem und die entschlossene Ausrichtung im Wesentlichen zutreffend wieder. „in denen er aufgenommen werden sollte“ macht aus dem Genitiv τῆς ἀναλήμψεως jedoch einen Relativsatz mit zusätzlichem futurisch-modalem „sollte“ und bildet den offenen Nominalausdruck „seiner Aufnahme/seines Aufgenommenwerdens“ weniger genau ab.
  naturalness: Der Satz ist verständlich und im gewählten würdigen Register gut lesbar. „sein Angesicht fest darauf richten“ ist möglich, klingt aber mit der Stellung von „fest“ etwas schwerfällig; „sein Angesicht entschlossen darauf richten“ ist im heutigen gehobenen Standarddeutsch flüssiger.
  terminology: „Aufnahme“ bewahrt die Offenheit von ἀνάλημψις besser als eine Festlegung auf „Himmelfahrt“. „Angesicht“ ist als bewusst biblisch-gehobene, aber verständliche Wiedergabe von πρόσωπον vertretbar. Die Fußnote zur Himmelfahrt sollte die Alternative unmittelbar nennen, nicht die zeitliche Umschreibung „bis zu“ einführen.
  issues:
  - severity: medium
    issue: „in denen er aufgenommen werden sollte“ ersetzt „seiner Aufnahme“ durch einen futurisch-modal gefärbten Relativsatz.
    rationale: Das griechische τῆς ἀναλήμψεως αὐτοῦ ist ein Genitivnomen („seiner Aufnahme/seines Aufgenommenwerdens“). Die vorgeschlagene Fassung fügt mit „sollte“ eine Nuance hinzu und schwächt zugleich die im Grundtext bewahrte Offenheit des Bezugs ab.
  - severity: low
    issue: Die Formulierung „sein Angesicht fest darauf richten“ ist stilistisch unnötig schwer.
    rationale: Die Metapher kann erhalten bleiben, während „entschlossen“ die idiomatische Entschlussnuance klarer und natürlicher ausdrückt.
  - severity: low
    issue: Die Fußnote „bis zu seiner Himmelfahrt“ ist keine präzise alternative Übersetzung des Nomens.
    rationale: „seiner Himmelfahrt“ entspricht der traditionellen, möglichen Engführung; „bis zu“ fügt dagegen eine zeitliche Struktur hinzu, die nicht ausdrücklich im Nomen selbst liegt.
  revised_text: Als die Tage seiner Aufnahme sich erfüllten[a], richtete er selbst sein Angesicht entschlossen darauf[b], nach Jerusalem zu gehen.
