source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: de
  text: Als die Tage seiner Aufnahme sich erfüllten[a], richtete er selbst sein Angesicht entschlossen darauf[b], nach Jerusalem zu gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Himmelfahrt“. Wörtlich steht im Griechischen: „seines Aufgenommenwerdens“.'
    reason: alternative_reading
  - marker: b
    text: Die Wendung „sein Angesicht entschlossen darauf richten“ drückt einen festen Entschluss aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι
  choice: Als sich … erfüllten
  rationale: Die erzählerische Übergangsformel und die temporale Infinitivkonstruktion werden in einem natürlichen deutschen Temporalsatz zusammengeführt. Das reflexive „sich erfüllen“ bewahrt den Vorgangssinn des griechischen Präsens, ohne die altertümliche Formel „Und es geschah“ zu erzwingen.
- source_word: τὰς ἡμέρας
  choice: die Tage
  rationale: Die konkrete Zeitangabe des griechischen Textes bleibt erhalten; das allgemeinere „die Zeit“ wäre idiomatischer, aber weniger textnah.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: in denen er aufgenommen werden sollte
  rationale: Die passive Wendung gibt den Grundsinn „sein Aufgenommenwerden“ wieder und lässt offen, ob vor allem die Himmelfahrt oder umfassender Jesu Weg durch Tod, Auferstehung und Erhöhung gemeint ist.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: richtete er sein Angesicht fest darauf
  rationale: Die bildhafte, semitisch geprägte Wendung und ihr Ausdruck festen Entschlusses bleiben erhalten. „Angesicht“ ist hier bewusst gehobener als „Gesicht“ und passt zur prophetisch geprägten Sprachgestalt.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: nach Jerusalem zu gehen
  rationale: Der Infinitiv wird als Ziel beziehungsweise Absicht der festen Ausrichtung wiedergegeben; „nach“ ist bei Städten die natürliche deutsche Richtungsangabe.
theological_decisions:
- issue: Bedeutungsumfang von ἀνάλημψις
  choice: aufgenommen werden
  alternative: in den Himmel aufgenommen werden / Himmelfahrt
  rationale: Der griechische Ausdruck bezeichnet wörtlich ein Aufgenommenwerden. Die Hauptfassung legt nicht vorschnell fest, dass ausschließlich die Himmelfahrt gemeint ist, sondern bewahrt den möglichen weiteren Bezug auf Jesu bevorstehenden Weg zur Erhöhung.
- issue: Bildhafte Wendung τὸ πρόσωπον ἐστήρισεν
  choice: richtete er sein Angesicht fest darauf
  alternative: fasste er den festen Entschluss
  rationale: Die konkrete Metapher wird bewahrt, während „fest“ ihre idiomatische Bedeutung als entschlossene Ausrichtung erkennen lässt. So bleibt auch die mögliche Resonanz prophetischer Sprache erhalten, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die Satzform ist gegenüber einer wörtlichen Wiedergabe von Ἐγένετο δὲ gestrafft; „Angesicht“ markiert dagegen gezielt den gehobenen, prophetisch anklingenden Ausdruck.
