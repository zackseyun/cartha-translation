  revision_rationale: Die Revision gibt τῆς ἀναλήμψεως αὐτοῦ als offenen Nominalausdruck wieder und vermeidet das im Grundtext nicht enthaltene „sollte“. Die bildhafte Wendung für τὸ πρόσωπον ἐστήρισεν bleibt erhalten, wird aber in natürlicherem modernem Deutsch formuliert. „er selbst“ macht die Betonung von αὐτός sichtbar, ohne den Satz zu überladen. Die Himmelfahrt bleibt als plausible, aber nicht erzwungene Alternative in der Fußnote ausgewiesen.
