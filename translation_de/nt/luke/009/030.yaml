  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: de
  text: 'Und sieh: Zwei Männer redeten mit ihm; es waren Mose und Elia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den Aufmerksamkeit weckenden, verlebendigenden Erzählmarker, ohne auf das heute altertümlich wirkende „siehe“ zurückzugreifen.
- source_word: ἄνδρες δύο
  choice: zwei Männer
  rationale: Gibt die konkrete Bezeichnung zweier männlicher Personen natürlich und genau wieder.
- source_word: συνελάλουν
  choice: redeten
  rationale: Das Präteritum passt zur deutschen Erzählweise; der Kontext und die Verbwahl vermitteln das andauernde Gespräch des griechischen Imperfekts.
- source_word: αὐτῷ
  choice: mit ihm
  rationale: Beim Verb συλλαλέω bezeichnet der Dativ den Gesprächspartner und drückt ein wechselseitiges Gespräch aus.
- source_word: οἵτινες ἦσαν
  choice: es waren
  rationale: Die selbstständige deutsche Satzfügung identifiziert die beiden Männer klar und natürlich, ohne dem Pronomen eine sachlich nicht erforderliche Verstärkung zu geben.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Verwendet die im modernen Deutschen übliche biblische Namensform.
- source_word: Ἠλίας
  choice: Elia
  rationale: Verwendet die im modernen Deutschen übliche Namensform des Propheten.
theological_decisions:
- issue: Identität der beiden Gestalten bei der Verklärung
  choice: Die beiden Männer werden unmittelbar als Mose und Elia identifiziert.
  alternative: Eine deutende Ergänzung zu ihrer symbolischen oder endzeitlichen Bedeutung.
  rationale: Der Vers selbst nimmt nur die Identifikation vor. Die Übersetzung fügt keine theologische Erklärung hinzu und lässt die Bedeutung im weiteren Zusammenhang entfalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält den lebhaften lukanischen Aufmerksamkeitsruf; der Doppelpunkt und der folgende selbstständige Satz vermeiden eine schwerfällige Relativkonstruktion.
