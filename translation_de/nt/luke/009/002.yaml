  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: de
  text: Und er sandte sie aus, das Reich Gottes[a] zu verkünden und die Kranken zu heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Herrschaft Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte ... aus
  rationale: Das Verb bezeichnet das Aussenden mit einem Auftrag; die trennbare deutsche Formulierung gibt diesen Sendungscharakter im Kontext natürlich wieder.
- source_word: κηρύσσειν
  choice: zu verkünden
  rationale: Das Verb meint öffentliches Bekanntmachen oder Ausrufen. „Verkünden“ bewahrt diesen Sinn und ist weniger auf eine kirchliche Predigtform eingeengt als „predigen“.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die traditionelle und verständliche Wendung bewahrt die Bedeutungsbreite von βασιλεία, das sowohl Gottes Herrschaft als auch den Bereich seiner Herrschaft bezeichnen kann.
- source_word: ἰᾶσθαι
  choice: zu heilen
  rationale: Das Verb bezeichnet hier die Wiederherstellung von Kranken; „heilen“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: τοὺς ἀσθενεῖς
  choice: die Kranken
  rationale: ἀσθενής kann allgemein „schwach“ bedeuten, bezeichnet in Verbindung mit „heilen“ jedoch Menschen, die krank sind.
theological_decisions:
- issue: Bedeutungsumfang von βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  alternative: die Herrschaft Gottes
  rationale: „Reich Gottes“ ist die etablierte Wendung und lässt sowohl den dynamischen Aspekt des Herrschens als auch den Bereich der Herrschaft offen. Die Alternative wird in einer Fußnote genannt, damit die im Griechischen vorhandene Bedeutungsbreite sichtbar bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die parallelen Infinitive des griechischen Satzes werden beibehalten; „verkünden“ vermeidet eine unnötige Verengung auf eine kirchliche Predigt.
