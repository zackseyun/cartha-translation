  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: de
  text: Und ich bat deine Jünger inständig, ihn auszutreiben,[a] doch sie konnten es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen bezieht sich wahrscheinlich auf den Geist; es kann jedoch auch auf den Jungen bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: bat … inständig
  rationale: δέομαι bezeichnet hier eine dringliche Bitte. „Bat … inständig“ gibt die Not und Eindringlichkeit des Vaters natürlich und würdevoll wieder, ohne das im Deutschen stärker unterwürfig klingende „anflehen“ zu erzwingen.
- source_word: τῶν μαθητῶν σου
  choice: deine Jünger
  rationale: „Jünger“ ist im Evangelienkontext die geläufige und sachlich passende Wiedergabe von μαθητής und bewahrt die Lehrer-Schüler-Beziehung.
- source_word: ἵνα ἐκβάλωσιν
  choice: ihn auszutreiben
  rationale: Der Infinitiv gibt die mit ἵνα und Konjunktiv ausgedrückte Zielrichtung der Bitte im Deutschen idiomatisch wieder. „Austreiben“ ist der etablierte und kontextgerechte Ausdruck für ἐκβάλλω bei einem Geist.
- source_word: αὐτό
  choice: ihn
  rationale: Das griechische Neutrum bezieht sich wahrscheinlich auf πνεῦμα („Geist“). Da „Geist“ im Deutschen maskulin ist, verlangt der wahrscheinliche Bezug das Pronomen „ihn“. Dieselbe Form könnte im Deutschen jedoch auch auf den Jungen verweisen; die sachliche Mehrdeutigkeit wird daher in einer Fußnote erläutert.
- source_word: οὐκ ἠδυνήθησαν
  choice: doch sie konnten es nicht
  rationale: „Sie konnten es nicht“ gibt die fehlende Fähigkeit knapp und in natürlichem modernem Deutsch wieder. „Doch“ bildet den Gegensatz zur dringlichen Bitte ab.
theological_decisions:
- issue: Bezugswort von αὐτό im Zusammenhang der Austreibung
  choice: Das Pronomen wird als Bezug auf den Geist verstanden; wegen des grammatischen Geschlechts von „Geist“ lautet es im Deutschen „ihn“.
  alternative: Das Pronomen kann auf den Jungen bezogen werden.
  rationale: Im Kontext von Dämonenaustreibungen ist der Geist gewöhnlich das Objekt von ἐκβάλλω; zudem passt das griechische Neutrum zu πνεῦμα. Da das deutsche „ihn“ zugleich den Jungen bezeichnen könnte, wird die verbleibende Bezugsambiguität nicht stillschweigend aufgelöst, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung bleibt natürlich; „inständig“ bewahrt die Dringlichkeit der Bitte. Die Fußnote macht die im Griechischen mögliche Referenzalternative sichtbar, die sich im Deutschen wegen des maskulinen Pronomens nicht allein an der Form erkennen lässt.
