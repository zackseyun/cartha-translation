  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: de
  text: 'Doch er sagte zu ihnen: „Gebt ihr ihnen etwas zu essen!“[a] Sie aber sagten: „Wir haben nicht mehr als fünf Brote und zwei Fische – es sei denn, wir gehen selbst los und kaufen Essen für diese ganze Menschenmenge.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit stärkerer Hervorhebung: „Gebt ihr selbst ihnen etwas zu essen!“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für dieses ganze Volk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Gebt ihr ihnen zu essen!
  rationale: Die deutsche Fügung ist natürlich und bewahrt durch das ausdrücklich gesetzte „ihr“ die Hervorhebung des griechischen Pronomens ὑμεῖς, ohne ein Objekt wie „etwas“ zwingend ergänzen zu müssen.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: Wir haben nicht mehr als
  rationale: Die Formulierung gibt die durch die Verneinung ausgedrückte Begrenzung klar und idiomatisch wieder.
- source_word: ἄρτοι πέντε
  choice: fünf Brote
  rationale: ἄρτοι bezeichnet hier einzelne Brote; „fünf Brote“ ist im Deutschen die natürliche Zählform.
- source_word: ἰχθύες δύο
  choice: zwei Fische
  rationale: Direkte und im Kontext natürliche Wiedergabe des Plurals.
- source_word: εἰ μήτι
  choice: es sei denn
  rationale: Die Wendung führt eine aus Sicht der Sprecher kaum praktikable Ausnahme ein; „es sei denn“ wahrt diese Funktion, während die leichte tentative Nuance im Kontext mitschwingt.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: wir gehen selbst los und kaufen
  rationale: Das Partizip wird im natürlichen Deutsch beigeordnet. „selbst“ nimmt das ausdrückliche ἡμεῖς auf, und „losgehen“ bildet die notwendige Bewegung ab.
- source_word: εἰς πάντα τὸν λαὸν τοῦτον βρώματα
  choice: Essen für dieses ganze Volk
  rationale: „Essen“ ist eine gegenwärtige, idiomatische Wiedergabe von βρώματα. „Dieses ganze Volk“ erhält die kollektive Bedeutung von λαός sowie Demonstrativ und Totalitätsausdruck.
theological_decisions:
- issue: Ton von Jesu Aufforderung und der Antwort der Jünger
  choice: Die Aufforderung direkt und mit der im Griechischen angelegten Betonung von „ihr“ wiedergeben, ohne zusätzlichen Tadel oder Ironie.
  alternative: „Gebt ihnen selbst etwas zu essen!“ oder eine hörbar gereizte Antwort der Jünger.
  rationale: Der griechische Text enthält eine klare Aufforderung und einen praktischen Einwand, kennzeichnet aber keine weitergehende emotionale Haltung ausdrücklich.
- issue: Bezug des betonten ἡμεῖς in der Antwort
  choice: Mit „selbst“ kenntlich machen, dass die Jünger davon sprechen, persönlich loszugehen und einzukaufen.
  alternative: Das Pronomen unmarkiert nur als „wir“ wiedergeben.
  rationale: Das ausdrücklich gesetzte ἡμεῖς kann kontrastiv wirken; „selbst“ erhält diese Hervorhebung, ohne den Sinn dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ und „Sie aber“ bilden die wiederholten griechischen Kontrastpartikeln ab, ohne schwerfällig zu wirken. Die direkte Rede bleibt knapp; „Volk“ bewahrt die formale Nähe zu λαός, während eine kontextuell stärker deutende Alternative in der Fußnote steht.
