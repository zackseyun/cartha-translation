source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: de
  text: Als der Junge noch näher kam, warf ihn der Dämon zu Boden und versetzte ihn in heftige Krämpfe. Jesus aber wies den unreinen Geist zurecht, heilte den Jungen und gab ihn seinem Vater zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: brachte ihn zu seinem Vater zurück.'
    reason: Lexikalische Alternative für ἀπέδωκεν („gab zurück“, „stellte wieder her“).
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Doch noch während er näher kam
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Annäherung. „Noch während“ gibt ἔτι und die Verlaufsbedeutung des Präsenspartizips wieder; „doch“ markiert den milden narrativen Übergang durch δέ, ohne einen starken Gegensatz zu erzwingen.
- source_word: ἔρρηξεν αὐτὸν
  choice: warf ihn zu Boden
  rationale: ῥήγνυμι bezeichnet hier das gewaltsame Niederwerfen des Jungen. Die deutsche Formulierung ist klar und vermeidet das in diesem Zusammenhang missverständliche wörtliche „zerriss ihn“.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: δαιμόνιον bezeichnet im Text einen persönlichen dämonischen Akteur. Die direkte Wiedergabe unterscheidet zugleich diesen Ausdruck von πνεῦμα τὸ ἀκάθαρτον im folgenden Satzteil.
- source_word: συνεσπάραξεν
  choice: versetzte ihn in heftige Krämpfe
  rationale: Das Verb beschreibt ein gewaltsames krampfartiges Zucken. Die Formulierung ist in modernem Deutsch natürlich und bewahrt die verursachende Bedeutung.
- source_word: ἐπετίμησεν
  choice: wies ... zurecht
  rationale: ἐπιτιμάω bezeichnet hier Jesu autoritatives Entgegentreten gegen den Geist. „Zurechtweisen“ ist im Deutschen verständlich und lässt den verbalen beziehungsweise gebietenden Charakter offen.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: den unreinen Geist
  rationale: „Unrein“ bewahrt die moralisch-kultische Bedeutungsbreite von ἀκάθαρτος und entspricht der etablierten, weiterhin verständlichen biblischen Ausdrucksweise.
- source_word: ἰάσατο τὸν παῖδα
  choice: heilte den Jungen
  rationale: ἰάομαι bedeutet in diesem Wunderbericht „heilen“. παῖς bezeichnet im Kontext einen männlichen jungen Menschen; „Junge“ ist genauer als das allgemeinere „Kind“, ohne ausdrücklich „Sohn“ in den Text einzutragen.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: gab ihn seinem Vater zurück
  rationale: ἀποδίδωμι kann hier sowohl das Zurückgeben als auch die Wiederherstellung zur Obhut des Vaters ausdrücken. Die idiomatische Formulierung bewahrt diesen Wiederherstellungsaspekt.
theological_decisions:
- issue: Darstellung der dämonischen Bedrängnis
  choice: δαιμόνιον und πνεῦμα ἀκάθαρτον werden als „Dämon“ und „unreiner Geist“ wiedergegeben.
  alternative: Die Ausdrücke als unpersönliche böse Kraft oder ausschließlich als Krankheit wiederzugeben.
  rationale: Der griechische Text stellt einen handelnden dämonischen Akteur dar und bezeichnet ihn anschließend als unreinen Geist. Zugleich wird ausdrücklich gesagt, dass Jesus den Jungen heilte. Die Übersetzung bewahrt daher sowohl die exorzistische als auch die heilende Dimension, ohne sie gegeneinander auszuspielen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem griechischen Handlungsablauf, ohne unnatürliche griechische Syntax nachzuahmen. Das Pronomen in „während er näher kam“ bewahrt die knappe Ausdrucksweise des Ausgangstextes und setzt den Kontext als Bezugshilfe voraus.
