  source_fidelity: 'Der Entwurf gibt die griechische Aussage zuverlässig wieder: οἳ ὀφθέντες ἐν δόξῃ ist idiomatisch als „Sie erschienen in Herrlichkeit“ umgesetzt; das imperfektische ἔλεγον wird mit „sprachen“ angemessen wiedergegeben. „seinen Ausgang“ bewahrt bei ἔξοδος die offene Bedeutung zwischen Tod, Weggang und möglichem Exodus-Anklang. „den er in Jerusalem erfüllen sollte“ bildet ἣν ἤμελλεν πληροῦν sachgerecht als bevorstehende bzw. bestimmte Erfüllung ab, ohne eine engere dogmatische Deutung einzutragen.'
