id: LUK.9.31
reference: Luke 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: de
  text: Sie erschienen in Herrlichkeit und sprachen über seinen Ausgang[a], den er in Jerusalem erfüllen sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Abschied; Fortgang. Das griechische Wort lautet exodos („Auszug“) und kann hier Jesu bevorstehenden Tod und sein Weggehen aus dieser Welt bezeichnen; möglicherweise klingt zugleich der Auszug Israels aus Ägypten an.'
    reason: Die deutsche Wiedergabe „Ausgang“ ist erklärungsbedürftig, bewahrt aber die semantische und mögliche intertextuelle Mehrdeutigkeit des griechischen ἔξοδος.
lexical_decisions:
- source_word: οἳ ὀφθέντες ἐν δόξῃ
  choice: Sie erschienen in Herrlichkeit
  rationale: Gibt die Partizipialkonstruktion natürlich wieder und bewahrt δόξα als den biblisch geprägten Begriff „Herrlichkeit“.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: über seinen Ausgang
  rationale: „Ausgang“ bewahrt die bewusste Mehrdeutigkeit von ἔξοδος zwischen Fortgang/Tod und dem möglichen Exodus-Anklang; „Abschied“ oder „Tod“ wäre eindeutiger als der griechische Text.
- source_word: ἣν ἤμελλεν πληροῦν
  choice: den er … erfüllen sollte
  rationale: „Erfüllen“ entspricht πληροῦν und erhält den ungewöhnlichen Gedanken, dass Jesus diesen „Ausgang“ zur Vollendung bringt. „Sollte“ gibt die bevorstehende, im Zusammenhang bestimmte Handlung idiomatisch wieder.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Bedeutungsumfang von ἔξοδος
  choice: Ausgang
  alternative: Abschied; Tod; Fortgang
  rationale: Der Text kann Jesu Tod beziehungsweise sein umfassenderes Weggehen meinen und zugleich an den Exodus erinnern. Die Übersetzung soll diese theologische Spannung nicht auf eine einzige Deutung verengen.
- issue: Bedeutung von πληροῦν
  choice: erfüllen
  alternative: vollenden; vollbringen
  rationale: „Erfüllen“ bewahrt die für Lukas auffällige Formulierung und ihren möglichen heilsgeschichtlichen Gehalt, ohne ihn ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem griechischen Relativanschluss verselbstständigt, da Vers 31 im Deutschen als eigenständiger Satz vorliegt. „Ausgang“ ist bewusst bibelnah und wird deshalb durch eine Fußnote erläutert.
