  terminology: „Herrlichkeit“ für δόξα und „erfüllen“ für πληροῦν sind treffend und im lukanisch-biblischen Register konsistent. Die Fußnote erklärt die Bedeutungsspanne von ἔξοδος sowie den möglichen Exodus-Anklang vorsichtig und ohne diesen als zwingende Auslegung auszugeben.
