  rationale: Die Revision bewahrt das ungenannte Passiv und die Wiederholung von ῥῆμα, gibt aber ἵνα μή mit einem deutschen Zwecksatz wieder. Dadurch wird weder eine göttliche noch eine andere Urheberschaft behauptet. Fußnote b erläutert präzise die im Text bestehende Ambiguität.
