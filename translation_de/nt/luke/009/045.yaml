    rationale: 'Die Formulierung „Im Griechischen steht: ‚Sie war vor ihnen verborgen, sodass sie sie nicht erfassten‘“ ist keine genaue Wiedergabe des griechischen Wortlauts und übernimmt zudem die zu revidierende Folgesatzdeutung. Die Fußnote sollte sich auf die relevante Beobachtung beschränken: Der Urheber des Verbergens wird nicht genannt.'
