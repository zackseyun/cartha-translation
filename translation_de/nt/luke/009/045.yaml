  source_fidelity: 'Die Wiedergabe trifft den Sinn des Verses weitgehend: Das Unverständnis der Jünger, das ungenannte passive Verborgensein und ihre Furcht zu fragen bleiben erhalten. „Sodass … nicht erfassen konnten“ schwächt jedoch die durch ἵνα μή ausgedrückte Zwecksatznuance zu einer bloßen Folge ab und fügt mit „konnten“ eine Modalität hinzu, die im Griechischen nicht ausdrücklich steht.'
  naturalness: „Aussage“, „verborgen“ und „sich fürchten, ihn … zu fragen“ sind modernes, natürliches Standarddeutsch. Die Wiederholung von „diese Aussage“ ist angemessen. Die revidierte Satzverbindung ist flüssiger und genauer.
  terminology: ῥῆμα kann hier gut mit „Aussage“ wiedergegeben werden. Für αἰσθάνομαι ist „erfassen“ in diesem Zusammenhang möglich; ohne „konnten“ wahrt es die Unterscheidung zu „verstanden“ besser. Das Passiv darf keinen Urheber des Verbergens benennen.
