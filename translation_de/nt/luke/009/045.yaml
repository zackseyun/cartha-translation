id: LUK.9.45
reference: Luke 9:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: de
  text: Doch sie verstanden diese Aussage[a] nicht; sie war vor ihnen verborgen, damit sie sie nicht erfassten[b], und sie fürchteten sich, ihn nach dieser Aussage zu fragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dieses Wort“, „diesen Ausspruch“ oder „diese Sache“ (ῥῆμα).
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen wird nicht gesagt, wer die Aussage vor ihnen verbarg.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἠγνόουν
  choice: verstanden … nicht
  rationale: Im Zusammenhang bezeichnet das Verb das fehlende Verständnis für Jesu vorausgehende Aussage. Die Formulierung ist in modernem Deutsch natürlich.
- source_word: ῥῆμα
  choice: Aussage
  rationale: Das Wort bezieht sich hier auf das konkret von Jesus Gesagte. „Aussage“ ist verständlich und wahrt den Bezug auf seine Äußerung; mögliche Alternativen werden in der Fußnote genannt.
- source_word: παρακεκαλυμμένον
  choice: war … verborgen
  rationale: Die Umschreibung mit ἦν und dem Perfektpartizip beschreibt einen bestehenden Zustand. Das Passiv bleibt erhalten, ohne einen Handelnden zu benennen.
- source_word: ἀπ’ αὐτῶν
  choice: vor ihnen
  rationale: Im Deutschen ist „vor ihnen verborgen“ die idiomatische Entsprechung für etwas, das ihrem Erkennen entzogen ist.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: sodass sie sie nicht erfassen konnten
  rationale: „Erfassen“ gibt die Wahrnehmungs- und Verständnisdimension von αἰσθάνομαι wieder und unterscheidet sich zugleich sprachlich vom vorherigen „verstanden … nicht“. „Sodass“ lässt im Deutschen die kontextuelle Ziel- beziehungsweise Folgenuance offen.
- source_word: ἐφοβοῦντο
  choice: sie fürchteten sich
  rationale: Die Formulierung gibt die anhaltende Furcht des Imperfekts in würdigem, geläufigem Deutsch wieder.
- source_word: ἐρωτῆσαι
  choice: zu fragen
  rationale: Gemeint ist, Jesus um Aufklärung über seine Aussage zu bitten; „fragen“ ist hierfür die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Urheber des Verbergens
  choice: Die passive Formulierung „Sie war vor ihnen verborgen“ nennt keinen Urheber.
  alternative: Gott verbarg die Aussage vor ihnen; oder die Aussage blieb ihnen ohne ausdrücklich göttliches Handeln unverständlich.
  rationale: Der griechische Passivsatz lässt offen, wer oder was das Verbergen bewirkte. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Ziel- oder Folgesinn von ἵνα μή
  choice: „sodass sie sie nicht erfassen konnten“
  alternative: „damit sie sie nicht erfassten“
  rationale: ἵνα μή kann hier zielgerichtet klingen, doch ohne genannten Urheber würde „damit“ im Deutschen leicht eine ausdrücklich handelnde Instanz nahelegen. „Sodass“ bewahrt den engen Zusammenhang mit dem Verborgensein, ohne dessen Ursache festzulegen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Wiederholung von „diese Aussage“ folgt bewusst der Wiederholung im griechischen Text. Das feminine Pronomen „sie“ bezieht sich jeweils auf „Aussage“.
