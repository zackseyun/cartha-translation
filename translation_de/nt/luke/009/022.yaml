id: LUK.9.22
reference: Luke 9:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: de
  text: 'und sagte: „Der Menschensohn muss vieles erleiden und von den Ältesten, den Hohepriestern und den Schriftgelehrten verworfen und getötet werden und am dritten Tag auferweckt werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὼν
  choice: und sagte
  rationale: Das Aoristpartizip führt den Inhalt der Rede ein und knüpft an den vorausgehenden Erzählzusammenhang an. Im modernen Deutschen gibt ein finites „und sagte“ diese Verbindung natürlicher wieder als „sagend“.
- source_word: Δεῖ
  choice: muss
  rationale: Das unpersönliche Verb bezeichnet hier eine Notwendigkeit, die den gesamten folgenden Ablauf umfasst. „Muss“ ist im Deutschen klar und natürlich, ohne den im Text nicht ausdrücklich genannten Urheber dieser Notwendigkeit zu ergänzen.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt die Form der Selbstbezeichnung sowie ihre biblischen und apokalyptischen Bezüge.
- source_word: πολλὰ παθεῖν
  choice: vieles erleiden
  rationale: „Vieles“ bildet den substantivisch gebrauchten Neutrumplural πολλὰ ab und bewahrt die offene Breite der angekündigten Leiden.
- source_word: ἀποδοκιμασθῆναι
  choice: verworfen werden
  rationale: „Verwerfen“ bezeichnet eine entschiedene Zurückweisung und passt zur offiziellen Ablehnung durch die genannten Führungsgruppen.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: von den Ältesten, den führenden Priestern und den Schriftgelehrten
  rationale: ἀπό kennzeichnet beim Passiv die handelnden beziehungsweise verantwortlichen Gruppen. „Führende Priester“ bezeichnet die priesterliche Führungsschicht, ohne mehrere gleichzeitig amtierende Hohepriester nahezulegen.
- source_word: ἀποκτανθῆναι
  choice: getötet werden
  rationale: Die direkte passive Form gibt die Tötung klar wieder, ohne ihr eine im griechischen Ausdruck nicht zwingend enthaltene juristische Färbung zu verleihen.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: am dritten Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe des temporalen Dativs und bewahrt die feste Zeitangabe.
- source_word: ἐγερθῆναι
  choice: auferweckt werden
  rationale: Die passive Form bleibt erhalten und lässt den Handelnden wie im griechischen Text unausgesprochen. „Auferweckt“ ist im Kontext eindeutig und vermeidet den Wechsel zum aktiven „auferstehen“.
theological_decisions:
- issue: Passivform der Auferweckungsaussage
  choice: auferweckt werden
  alternative: auferstehen
  rationale: Das griechische Passiv wird bewahrt. Dadurch bleibt Gottes Handeln angedeutet, ohne dass ein im Vers nicht ausdrücklich genanntes Subjekt ergänzt oder die Aussage in eine aktive Form umgedeutet wird.
- issue: Reichweite und Gehalt von Δεῖ
  choice: Der Menschensohn muss …
  alternative: Es ist notwendig, dass der Menschensohn …
  rationale: „Muss“ bewahrt die Notwendigkeit des gesamten angekündigten Geschehens in Gottes Heilsplan, formuliert sie aber in idiomatischem Deutsch. Die genaue Ursache oder Art dieser Notwendigkeit wird nicht weiter festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung folgt eng der griechischen Satzstruktur, bleibt aber durch die finite Einleitung „und sagte“ und die gemeinsame Passivkonstruktion flüssig lesbar. Fachsprachlich-konfessionelle Zusätze werden vermieden.
