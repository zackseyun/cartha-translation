review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Abfolge der Infinitive, die Passivformen bei Verwerfung, Tötung und Auferweckung sowie die Zeitangabe „am dritten Tag“ zuverlässig wieder. „Muss“ gibt δεῖ angemessen wieder, ohne den Grund der Notwendigkeit zu spezifizieren.
  naturalness: Der Satz ist grundsätzlich idiomatisch. Die Bezeichnung „führende Priester“ ist jedoch als Gruppenbezeichnung weniger etabliert und weniger präzise als „Hohepriester“; die letztere ist im modernen deutschen Bibelgebrauch klar verständlich und bezeichnet im Plural die priesterliche Führungsschicht.
  terminology: „Menschensohn“, „Älteste“, „Schriftgelehrte“ und „auferweckt werden“ sind treffend. Für ἀρχιερεῖς ist „Hohepriester“ die übliche fachlich genaue Wiedergabe; der Plural behauptet dabei nicht, dass mehrere Personen gleichzeitig das singuläre Amt des Hohenpriesters innehatten.
  issues:
  - severity: low
    issue: „führenden Priestern“ für ἀρχιερέων
    rationale: Die Formulierung ist verständlich, aber keine etablierte, präzise Wiedergabe der im Evangelium wiederkehrenden Gruppe der ἀρχιερεῖς. „Hohepriester“ bewahrt den institutionellen Terminus und kann im Plural die führende priesterliche Gruppe bezeichnen.
  revised_text: 'und sagte: „Der Menschensohn muss vieles erleiden und von den Ältesten, den Hohepriestern und den Schriftgelehrten verworfen und getötet werden und am dritten Tag auferweckt werden.“'
