id: LUK.9.16
reference: Luke 9:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: de
  text: Dann nahm er die fünf Brote und die zwei Fische, blickte zum Himmel auf, segnete sie[a], brach sie und gab sie immer weiter den Jüngern, damit sie sie der Menge vorlegten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: dankte dafür. Im Griechischen steht hier das Verb „segnen“; manche Parallelberichte verwenden „danken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Dann nahm er
  rationale: Das Aoristpartizip mit δέ führt den nächsten Handlungsschritt ein. Die finite Form ist im modernen Deutschen natürlicher und bewahrt die zeitliche Abfolge.
- source_word: τοὺς πέντε ἄρτους
  choice: die fünf Brote
  rationale: Ἄρτοι bezeichnet hier einzelne Brote und nicht Brot als Stoff oder abstrakte Speise.
- source_word: τοὺς δύο ἰχθύας
  choice: die zwei Fische
  rationale: Die konkrete Pluralform entspricht dem Speisungskontext und ist im Deutschen idiomatisch.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: blickte zum Himmel auf
  rationale: Die Wendung gibt sowohl die aufwärtsgerichtete Blickbewegung als auch den im Gebetszusammenhang gemeinten Himmel natürlich wieder.
- source_word: εὐλόγησεν αὐτοὺς
  choice: segnete sie
  rationale: Die Übersetzung folgt dem Verb εὐλογέω und dem maskulinen Pluralpronomen αὐτούς, das sich auf Brote und Fische zusammen bezieht.
- source_word: κατέκλασεν
  choice: brach sie
  rationale: Das Verb bezeichnet das Brechen der Speisen zur Verteilung; das Pronomen wird im Deutschen zur Klarheit ergänzt.
- source_word: ἐδίδου
  choice: gab sie immer weiter
  rationale: Der Imperfekt beschreibt eine fortlaufende beziehungsweise wiederholte Ausgabe an die Jünger.
- source_word: τοῖς μαθηταῖς
  choice: den Jüngern
  rationale: Der Artikel wird im Deutschen in der Verschmelzung von Präposition und Artikel ausgedrückt; ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: damit sie sie der Menge vorlegten
  rationale: Der Infinitiv bezeichnet den Zweck der Übergabe. »Vorlegen« wahrt den konkreten Sinn, während »servieren« stärker deutet.
theological_decisions:
- issue: Bedeutung von οὐρανός im Gebetszusammenhang
  choice: Himmel
  alternative: Himmelsraum / Himmel im Sinn von sichtbarem Firmament
  rationale: Der aufwärtsgerichtete Blick begleitet den Segen und weist im Zusammenhang auf Gott; »Himmel« bewahrt diese Dimension, ohne sie auszudeuten.
- issue: Wiedergabe von εὐλόγησεν
  choice: segnete sie
  alternative: dankte dafür
  rationale: Lukas verwendet εὐλογέω (»segnen«), nicht εὐχαριστέω (»danken«). Die Formulierung bewahrt den spezifischen Wortlaut und vermeidet eine Harmonisierung mit Parallelberichten.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die finite Satzreihe vermeidet einen schwerfälligen Partizipialbau. »Immer weiter« macht den fortlaufenden Aspekt des Imperfekts verständlich, ohne einen ausdrücklichen Hinweis auf die Vermehrung in den Text einzutragen.
