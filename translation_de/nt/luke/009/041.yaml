reference: Luke 9:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: de
  text: 'Jesus antwortete: »Was für eine ungläubige und verdrehte Generation! Wie lange soll ich noch bei euch sein und euch ertragen? Bring deinen Sohn hierher!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη
  choice: Was für eine ungläubige und verdrehte Generation!
  rationale: Die griechische Anrede mit Ὦ drückt hier einen starken Ausruf aus; „was für eine“ gibt diesen im natürlichen Deutschen wieder. ἄπιστος bedeutet „ungläubig/ohne Glauben“, διεστραμμένη wörtlich „verdreht“ und bezeichnet eine moralisch oder geistlich verkehrte Ausrichtung.
- source_word: ἕως πότε ἔσομαι πρὸς ὑμᾶς
  choice: Wie lange soll ich noch bei euch sein
  rationale: πρὸς ὑμᾶς bezeichnet das Zusammensein mit den Angesprochenen. Das deutsche „noch“ ist in der idiomatischen Frage „wie lange …?“ implizit angelegt und vermittelt den griechischen Klagecharakter.
- source_word: ἀνέξομαι ὑμῶν
  choice: euch ertragen
  rationale: ἀνέχομαι mit Genitiv bedeutet hier „jemanden ertragen/aushalten“. „Ertragen“ bewahrt die Schärfe der Aussage ohne unnötige Umgangssprachlichkeit.
- source_word: προσάγαγε ὧδε τὸν υἱόν σου
  choice: Bring deinen Sohn hierher!
  rationale: Der Imperativ προσάγαγε fordert dazu auf, den Sohn zu Jesus herzubringen; „hierher“ entspricht ὧδε.
theological_decisions:
- issue: Bezug der Bezeichnung „ungläubige und verdrehte Generation“
  choice: Der Adressatenkreis bleibt unbestimmt und wird nicht durch eine erklärende Ergänzung eingeschränkt.
  alternative: Die Worte ausdrücklich nur auf die Jünger, den Vater oder die gesamte Volksmenge beziehen.
  rationale: Der griechische Text nennt lediglich „Generation“ und lässt im unmittelbaren Ausspruch offen, welche Anwesenden in welchem Umfang eingeschlossen sind.
- issue: Wiedergabe von ἄπιστος
  choice: ungläubig
  alternative: treulos
  rationale: Beide Bedeutungsnuancen sind möglich, doch im Kontext des mangelnden Glaubens und der erfolglosen Heilung ist „ungläubig“ die unmittelbarere deutsche Entsprechung. Die mögliche Nuance der Untreue wird nicht durch eine konfessionelle Deutung festgelegt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, eindringlichem Ton. Der Ausruf wird im Deutschen idiomatisch wiedergegeben; die rhetorische Frage und der abschließende Imperativ bleiben deutlich und scharf.
