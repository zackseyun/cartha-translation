  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: de
  text: 'Denn es waren etwa fünftausend Männer[a]. Da sagte er zu seinen Jüngern: »Lasst sie sich in Gruppen zu je etwa fünfzig zum Essen lagern.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet Männer, genauer erwachsene Männer, nicht Menschen allgemein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Lasst sie sich in Gruppen zu je etwa fünfzig niederlegen.« Das griechische Verb bezeichnet besonders das Lagern zu einer Mahlzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: etwa
  rationale: Kennzeichnet in beiden Vorkommen eine ungefähre Zahl; »etwa« ist im modernen Deutschen natürlich und präzise.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier spezifisch Männer, nicht Menschen allgemein; die geschlechtsspezifische Angabe des Ausgangstextes bleibt erhalten.
- source_word: πεντακισχίλιοι
  choice: fünftausend
  rationale: Direkte Wiedergabe der Kardinalzahl, die sich auf »Männer« bezieht.
- source_word: Κατακλίνατε
  choice: Lasst sie sich ... zum Essen niederlegen
  rationale: Das Verb bezeichnet das Veranlassen, sich insbesondere zu einer Mahlzeit niederzulegen. Die Formulierung bewahrt diese kulturelle Bedeutung und bleibt verständlich.
- source_word: κλισίας
  choice: in Gruppen
  rationale: Der Plural bezeichnet geordnete Gruppen beziehungsweise Tischgemeinschaften; »in Gruppen« ist idiomatisch, während der Mahlzeitbezug durch den verbalen Ausdruck deutlich wird.
- source_word: ἀνὰ πεντήκοντα
  choice: von jeweils etwa fünfzig
  rationale: ἀνά mit einer Zahl hat distributive Bedeutung; »jeweils« macht diese Verteilung ausdrücklich.
- source_word: γὰρ ... δὲ
  choice: Denn ... Da
  rationale: »Denn« erhält die begründende Funktion von γάρ. »Da« führt im deutschen Erzählstil natürlich zu Jesu anschließender Anweisung über.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Gibt sowohl die Präpositionalverbindung als auch das ausdrücklich vorhandene Possessivpronomen wieder.
