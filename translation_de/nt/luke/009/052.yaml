source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: de
  text: Und er sandte Boten vor sich her. Sie machten sich auf den Weg und kamen in ein Dorf der Samariter, um für ihn Vorbereitungen zu treffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Der Aorist von ἀποστέλλω bezeichnet hier schlicht das Aussenden von Beauftragten; „sandte“ ist präzise und in erzählender Sprache natürlich.
- source_word: ἀγγέλους
  choice: Boten
  rationale: Der Zusammenhang zeigt, dass menschliche Abgesandte gemeint sind, nicht Engel.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: vor sich her
  rationale: Die wörtliche Wendung „vor seinem Angesicht“ bedeutet in diesem Bewegungskontext idiomatisch, dass die Boten ihm vorausgingen. „Vor sich her“ bewahrt Perspektive und Bildgehalt in natürlichem Deutsch.
- source_word: πορευθέντες
  choice: Sie machten sich auf den Weg
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine dem Eintreten vorausgehende Bewegung. Ein eigener deutscher Hauptsatz gibt den Ablauf natürlich wieder.
- source_word: εἰσῆλθον
  choice: kamen in
  rationale: Bei einem Dorf klingt „in ein Dorf kamen“ im Deutschen natürlicher als das formellere „in ein Dorf eintraten“ und gibt εἰσέρχομαι sachgerecht wieder.
- source_word: κώμην Σαμαριτῶν
  choice: ein Dorf der Samariter
  rationale: Diese Formulierung bildet den griechischen Genitiv pluralisch und ohne unnötige Festlegung ab; gemeint ist ein von Samaritern bewohntes beziehungsweise ihnen zugehöriges Dorf.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: um alles für ihn vorzubereiten
  rationale: ὡς mit Infinitiv drückt hier den Zweck aus. Das ergänzte „alles“ macht im Deutschen natürlich deutlich, dass die nötigen Vorbereitungen gemeint sind, ohne deren Art festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Die Satzfolge wahrt den Handlungsablauf des griechischen Textes; „Dorf der Samariter“ erhält dessen Ausdrucksweise.
