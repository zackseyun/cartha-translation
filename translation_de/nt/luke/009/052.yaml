    issue: „alles“ ergänzt den impliziten Gegenstand der Vorbereitung.
    rationale: ἑτοιμάσαι αὐτῷ nennt keinen Gegenstand und verlangt keine Aussage, dass sämtliche Vorbereitungen getroffen werden sollten. Die idiomatische deutsche Formulierung „Vorbereitungen zu treffen“ gibt den Sinn ohne diese zusätzliche Festlegung wieder.
