- from: Und er sandte Boten vor sich her. Sie machten sich auf den Weg und kamen in ein Dorf der Samariter, um alles für ihn vorzubereiten.
  to: Und er sandte Boten vor sich her. Sie machten sich auf den Weg und kamen in ein Dorf der Samariter, um für ihn Vorbereitungen zu treffen.
  rationale: Die einzige sichere Änderung entfernt die semantisch nicht erforderliche Ergänzung „alles“. Die revidierte Fassung bewahrt Zweck, Bezug auf Jesus und die im Griechischen offene Art der Vorbereitung in natürlichem modernem Deutsch.
