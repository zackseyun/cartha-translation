id: LUK.9.58
reference: Luke 9:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihm: »Die Füchse haben Baue, und die Vögel des Himmels haben Nester; aber der Menschensohn[a] hat keinen Ort, an dem er seinen Kopf hinlegen kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Menschensohn« ist Jesu Selbstbezeichnung und kann auf Daniel 7,13–14 anspielen.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: die Füchse
  rationale: Die direkte und im Kontext eindeutige Bezeichnung des Tieres.
- source_word: φωλεούς
  choice: Höhlen
  rationale: Bezeichnet Schlupfwinkel oder Baue von Tieren; »Höhlen« ist verständlich und bewahrt das konkrete Bild.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Gibt den griechischen Genitiv eng und in würdigem, geläufigem Deutsch wieder; gemeint sind die Vögel am Himmel.
- source_word: κατασκηνώσεις
  choice: Nester
  rationale: Wörtlich handelt es sich um Aufenthalts- oder Ruheplätze; im Zusammenhang mit Vögeln ist »Nester« die natürliche deutsche Entsprechung.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt Jesu etablierte Selbstbezeichnung und ihre mögliche Anspielung auf Daniel 7, ohne sie im Haupttext auszudeuten.
- source_word: οὐκ ἔχει ποῦ
  choice: hat keinen Ort, wo
  rationale: Gibt die verneinte griechische Wendung natürlich wieder und hält zugleich das räumliche Bild ausdrücklich fest.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: sein Haupt niederlegen kann
  rationale: Bewahrt das konkrete Bild des Neigens beziehungsweise Niederlegens des Kopfes und entspricht einem würdigen deutschen Bibelregister.
- source_word: δὲ
  choice: aber
  rationale: Macht den deutlichen Gegensatz zwischen den Unterkünften der Tiere und der Heimatlosigkeit des Menschensohns sichtbar.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jesus sagte zu ihm
  rationale: Direkte, natürliche Wiedergabe der griechischen Erzähleinleitung.
theological_decisions:
- issue: Wiedergabe der Selbstbezeichnung υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der menschliche Eine
  rationale: »Menschensohn« ist die etablierte deutsche Wiedergabe und erhält sowohl die semitische Ausdrucksweise als auch eine mögliche messianisch-apokalyptische Resonanz. Eine deutende Paraphrase würde die Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Klang. »Haupt niederlegen« ist bewusst etwas gehobener als »Kopf hinlegen«, bleibt aber allgemein verständlich. Die im englischen Beratungstext fehlerhaft zugeordneten Fußnoten wurden nicht übernommen; nur die sachlich relevante Erläuterung zu »Menschensohn« erscheint mit korrekt gesetztem Marker.
