source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: de
  text: 'Jesus aber sagte: »Niemand, der die Hand an den Pflug gelegt hat[a] und zurückblickt, ist für das Reich Gottes geeignet[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der seine Hand an den Pflug gelegt hat«. Das Bild beschreibt jemanden, der mit dem Pflügen begonnen hat und dann nach hinten blickt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »passend« beziehungsweise »brauchbar« für das Reich Gottes.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Das Bindewort markiert hier einen leichten Gegensatz beziehungsweise eine erwidernde Fortführung und wird im Deutschen natürlich mit »aber« wiedergegeben.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: die Hand an den Pflug gelegt hat
  rationale: Das Aoristpartizip bezeichnet den begonnenen, dem Zurückblicken vorausgehenden Vorgang. Die deutsche Formulierung bewahrt das konkrete landwirtschaftliche Bild und klingt zugleich idiomatisch.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: zurückblickt
  rationale: Das Präsenspartizip beschreibt ein fortdauerndes oder charakteristisches Zurückschauen. »Zurückblickt« erhält sowohl die wörtliche Bildhälfte als auch den Gedanken geteilter Ausrichtung.
- source_word: εὔθετός
  choice: geeignet
  rationale: Das Adjektiv bezeichnet Eignung oder Brauchbarkeit für einen Zweck. »Geeignet« ist verständlich und vermeidet die zusätzliche Behauptung moralischer Würdigkeit.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: für das Reich Gottes
  rationale: Der Dativ hängt von εὔθετος ab und wird natürlich mit »für« wiedergegeben. »Reich Gottes« ist die geläufige, kontextgerechte Wiedergabe, ohne die Bedeutung einseitig auf Herrschaftsausübung oder einen räumlichen Bereich festzulegen.
- source_word: Οὐδεὶς
  choice: Niemand
  rationale: Die uneingeschränkte Verneinung bezieht sich allgemein auf jede Person; »niemand« gibt dies im modernen Deutschen knapp und ohne unnötige Geschlechtsmarkierung wieder.
theological_decisions:
- issue: Bedeutung von εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: als Eignung für das Reich Gottes formuliert
  alternative: »ist es nicht wert, in das Reich Gottes einzugehen« oder »ist für den Dienst am Reich Gottes nicht brauchbar«
  rationale: Der griechische Wortlaut spricht von Eignung beziehungsweise Brauchbarkeit, legt aber weder ausdrücklich die endgültige Errettung noch ausschließlich eine bestimmte Dienstaufgabe fest. Die Übersetzung bewahrt daher die Schärfe und zugleich die theologische Offenheit der Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Das konkrete Bild vom Pflügen bleibt erhalten; die Formulierung erklärt die Metapher nicht im Haupttext und wahrt die Mehrdeutigkeit von »geeignet«.
