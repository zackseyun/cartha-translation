id: LUK.9.27
reference: Luke 9:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: de
  text: 'Doch ich sage euch in Wahrheit: Einige von denen, die hier stehen, werden ganz gewiss nicht den Tod schmecken[a], bis sie das Reich Gottes sehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Den Tod schmecken“ bedeutet: den Tod erfahren oder sterben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Doch ich sage euch in Wahrheit
  rationale: „Doch“ gibt den weiterführenden, leicht kontrastierenden Diskursmarker δέ wieder; „in Wahrheit“ bildet ἀληθῶς adverbial und in natürlichem, würdigem Deutsch ab.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: Einige von denen, die hier stehen
  rationale: Die partitive Genitivkonstruktion wird im Deutschen transparent mit „einige von denen“ wiedergegeben. „Hier“ bringt den deiktischen Sinn der bei Jesus anwesenden Personen natürlich zum Ausdruck.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: werden ganz gewiss nicht den Tod schmecken
  rationale: „Ganz gewiss nicht“ bewahrt die nachdrückliche Verneinung οὐ μή. Das Bild „den Tod schmecken“ bleibt erhalten, während eine Fußnote die idiomatische Bedeutung erläutert.
- source_word: ἕως ἂν ἴδωσιν
  choice: bis sie … sehen
  rationale: Diese Formulierung gibt die zukunftsbezogene Konstruktion mit ἕως ἄν und Aorist Konjunktiv präzise und idiomatisch wieder.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte deutsche Wiedergabe und lässt sowohl Gottes Herrschaft als auch deren Wirkungsbereich mitschwingen, ohne den Ausdruck einseitig auszulegen.
theological_decisions:
- issue: Worauf sich „das Reich Gottes sehen“ bezieht
  choice: Die Wendung bleibt ohne interpretierende Ergänzung stehen.
  alternative: Ausdrückliche Zuordnung zur Verklärung, zu Auferstehung und Himmelfahrt, zur Zerstörung Jerusalems oder zur Ausbreitung der Kirche.
  rationale: Der griechische Text benennt den Bezug nicht ausdrücklich. Die offene Formulierung bewahrt die verschiedenen kontextuell und auslegungsgeschichtlich vertretenen Möglichkeiten, statt eine bestimmte eschatologische Deutung in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die markante Todesmetapher und die emphatische Verneinung bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
