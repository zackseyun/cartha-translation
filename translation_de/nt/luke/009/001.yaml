id: LUK.9.1
reference: Luke 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: de
  text: Er rief die Zwölf zusammen und gab ihnen Kraft und Vollmacht über alle Dämonen[a] und dazu, Krankheiten zu heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: über jeden Dämon.'
    reason: Die griechische Wendung mit πᾶς kann hier sowohl kollektiv („alle Dämonen“) als auch distributiv („jeden Dämon“) wiedergegeben werden.
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: Er rief … zusammen
  rationale: Die finite Satzverbindung ist im Deutschen natürlicher als eine schwerfällige Partizipialkonstruktion. „Zusammen“ gibt die συν-Komponente wieder; der vorangestellte Aoristpartizip bezeichnet die dem Geben vorausgehende Begleithandlung.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier den Erzählgang locker und drückt keinen deutlichen Gegensatz aus.
- source_word: τοὺς δώδεκα
  choice: die Zwölf
  rationale: Die Bezeichnung wird ohne die im Griechischen nicht ausdrücklich genannten Zusätze „Jünger“ oder „Apostel“ wiedergegeben.
- source_word: δύναμιν καὶ ἐξουσίαν
  choice: Kraft und Vollmacht
  rationale: „Kraft“ bezeichnet die wirksame Befähigung, „Vollmacht“ die verliehene Berechtigung; die begriffliche Paarung bleibt erhalten.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: über alle Dämonen
  rationale: ἐπί mit Akkusativ bezeichnet hier den Herrschafts- beziehungsweise Vollmachtsbereich. „Dämonen“ entspricht dem ausdrücklich verwendeten δαιμόνια.
- source_word: νόσους θεραπεύειν
  choice: dazu, Krankheiten zu heilen
  rationale: Die Infinitivkonstruktion bezeichnet, wozu Jesus sie befähigte und bevollmächtigte. „Dazu“ macht den syntaktischen Anschluss im modernen Deutschen verständlich, ohne ein zusätzliches Tun wie das Austreiben ausdrücklich einzutragen.
theological_decisions:
- issue: Unterscheidung zwischen δύναμις und ἐξουσία
  choice: „Kraft und Vollmacht“ als zwei verschiedene Begriffe
  alternative: beide Begriffe zusammenfassend als „Macht“
  rationale: Der Ausgangstext nennt sowohl wirksame Befähigung als auch verliehene Autorität. Eine Zusammenfassung würde diese Spannung einebnen.
- issue: Bezeichnung der Zwölf
  choice: „die Zwölf“ ohne erläuternden Zusatz
  alternative: „die zwölf Jünger“ oder „die zwölf Apostel“
  rationale: Der Vers selbst enthält weder μαθηταί noch ἀπόστολοι; die knappe Bezeichnung des Ausgangstextes bleibt daher bestehen.
- issue: Verhältnis von Vollmacht über Dämonen und Heilung von Krankheiten
  choice: die asymmetrische Formulierung des Griechischen bleibt erkennbar
  alternative: „Vollmacht, alle Dämonen auszutreiben und Krankheiten zu heilen“
  rationale: „Austreiben“ wäre zwar aus dem Zusammenhang verständlich, steht aber in diesem Vers nicht ausdrücklich. Die Übersetzung ergänzt diese Handlung daher nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Vollmacht“ ist als etablierter, weiterhin gut verständlicher Ausdruck für verliehene Autorität beibehalten; unnötige kirchliche Zusätze wurden vermieden.
