  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: de
  text: 'Er sagte zu allen: „Wenn jemand mir nachkommen will, soll er sich selbst verleugnen, täglich sein Kreuz auf sich nehmen und mir folgen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt beschreibt hier Jesu an die ganze Gruppe gerichtetes Reden. Das natürliche deutsche Präteritum „sagte“ kann diesen fortlaufenden Hintergrund ausdrücken; „sagte immer wieder“ wäre ohne eindeutigen Kontext zu stark.
- source_word: πρὸς πάντας
  choice: zu allen
  rationale: Die Wendung bewahrt knapp und unmittelbar den umfassenden Adressatenkreis.
- source_word: Εἴ τις θέλει
  choice: Wenn jemand … will
  rationale: „Jemand“ gibt das generische indefinite Singular τις wieder; „will“ ist die natürliche Entsprechung zu θέλει.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: mir nachkommen
  rationale: „Nachkommen“ bewahrt sowohl die Bewegungsmetapher als auch den Jüngerschaftssinn und nimmt das spätere „folgen“ nicht vorweg.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: soll er sich selbst verleugnen
  rationale: Die Konstruktion gibt den Imperativ der dritten Person idiomatisch als „soll“ wieder. „Sich selbst verleugnen“ wahrt den starken, aber nicht weiter ausgedeuteten Ausdruck.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: sein Kreuz auf sich nehmen
  rationale: Diese feste deutsche Wendung gibt das Aufnehmen des eigenen Kreuzes natürlich wieder, ohne „Kreuz“ als bloße Last oder allgemeines Leiden zu paraphrasieren.
- source_word: καθ’ ἡμέραν
  choice: täglich
  rationale: „Täglich“ ist eine knappe und genaue Wiedergabe von „jeden Tag“ und erhält Lukas’ ausdrückliche Betonung der fortgesetzten Jüngerschaft.
- source_word: ἀκολουθείτω μοι
  choice: und mir folgen
  rationale: Nach dem einleitenden „soll er“ trägt der koordinierte Infinitiv im Deutschen die imperative Kraft natürlich weiter.
theological_decisions:
- issue: Bedeutung der Kreuzesmetapher
  choice: Das konkrete Wort „Kreuz“ bleibt stehen.
  alternative: „seine Last“, „sein Leiden“ oder „sein Opfer“
  rationale: σταυρός bezeichnet konkret das Kreuz. Seine theologischen und metaphorischen Bezüge zu Leiden, Tod und Jüngerschaft sollen nicht durch eine erklärende Paraphrase verengt werden.
- issue: Generischer Singular und grammatisches Geschlecht
  choice: „Wenn jemand … soll er sich selbst … sein Kreuz“
  alternative: „Wer … will, soll sich selbst verleugnen, täglich das eigene Kreuz …“
  rationale: Der generische Singular des Griechischen bleibt sichtbar. Das deutsche „jemand“ ist inklusiv; die anschließenden maskulinen Pronomen folgen der grammatischen Kongruenz und bezeichnen keine ausschließlich männliche Gruppe.
- issue: Aspekt von Ἔλεγεν
  choice: „sagte“
  alternative: „sprach immer wieder“ oder „war dabei, zu sagen“
  rationale: Das griechische Imperfekt kann fortlaufendes oder wiederholtes Reden anzeigen, doch der Einzelvers legt keine Wiederholung zwingend fest. Natürliches Deutsch bewahrt die narrative Funktion besser mit dem Präteritum, ohne einen zusätzlichen Wiederholungsakzent einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist bewusst klar und mündlich verständlich gehalten. Die traditionelle, aber weiterhin geläufige Wendung „sich selbst verleugnen“ bewahrt die begriffliche Spannung des Ausgangstextes; „sein Kreuz auf sich nehmen“ bleibt als konkrete und bildhafte Formulierung erhalten.
