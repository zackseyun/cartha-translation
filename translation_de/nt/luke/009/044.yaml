source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: de
  text: 'Nehmt euch diese Worte zu Herzen: Denn der Menschensohn wird in die Hände von Menschen ausgeliefert werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in die Hände von Menschen übergeben werden“; je nach Zusammenhang kann das griechische Verb auch „verraten werden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Nehmt euch … zu Herzen
  rationale: Die wörtliche Wendung „legt … in eure Ohren“ ist im Deutschen unüblich. Die gewählte idiomatische Form bewahrt den nachdrücklichen Aufruf, Jesu Worte bewusst aufzunehmen und festzuhalten; das ausdrücklich gesetzte ὑμεῖς wird durch „euch“ und den direkten Imperativ hinreichend wiedergegeben.
- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die Wendung verweist auf die unmittelbar folgende Ankündigung; „Worte“ gibt λόγους direkt und natürlich wieder.
- source_word: ὁ γὰρ
  choice: Denn
  rationale: γάρ begründet, weshalb die Jünger besonders aufmerksam zuhören sollen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die traditionelle deutsche Wiedergabe erhält Jesu Selbstbezeichnung sowie ihre Mehrdeutigkeit und den möglichen Bezug zu Daniel 7.
- source_word: μέλλει παραδίδοσθαι
  choice: wird … ausgeliefert werden
  rationale: Die futurische Form gibt das bevorstehende Geschehen im Deutschen natürlich wieder. „Ausgeliefert“ bezeichnet die Übergabe in fremde Gewalt, ohne die Bedeutung vorschnell auf Verrat zu verengen.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: in die Hände von Menschen
  rationale: Die deutsche Redewendung bewahrt das Bild der Übergabe in menschliche Gewalt. ἄνθρωποι bezeichnet hier Menschen allgemein; „Menschen“ erhält zudem den hörbaren Gegensatz zum „Menschensohn“.
theological_decisions:
- issue: Wiedergabe des Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Menschensohn“ ist die etablierte, formal nahe Wiedergabe und bewahrt die christologische sowie Daniel betreffende Resonanz, ohne sie auszudeuten.
- issue: Bedeutungsumfang von παραδίδοσθαι
  choice: ausgeliefert werden
  alternative: verraten werden
  rationale: Das Passiv umfasst hier allgemein die Übergabe Jesu in die Gewalt anderer. „Verraten“ würde den Vorgang enger auf den Verrat als solchen beziehen.
- issue: Wiedergabe von ἀνθρώπων
  choice: Menschen
  alternative: Männern
  rationale: ἄνθρωπος kann geschlechtsübergreifend „Mensch“ bedeuten. „Menschen“ ist im modernen Deutschen sachgerecht und bewahrt zugleich das Wortspiel beziehungsweise den Kontrast mit „Menschensohn“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Ohren-Idiom wurde zugunsten einer natürlichen deutschen Aufforderung funktional wiedergegeben; das Bild „in die Hände“ und der Titel „Menschensohn“ bleiben erhalten.
