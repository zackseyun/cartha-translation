source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: de
  text: 'Doch Jesus sagte zu ihm: »Hindert ihn nicht[a], denn wer nicht gegen euch ist, ist für euch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Haltet ihn nicht davon ab; oder: Verbietet es ihm nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Doch Jesus sagte zu ihm
  rationale: δέ knüpft an den Einwand des Johannes an und hat hier einen leicht gegensätzlichen Ton; »doch« gibt ihn natürlich wieder. Das Pronomen αὐτόν bleibt als »ihm« erhalten, statt den Namen Johannes einzusetzen.
- source_word: Μὴ κωλύετε
  choice: Hindert ihn nicht
  rationale: κωλύω kann »hindern«, »abhalten« oder »verbieten« bedeuten. Aus dem unmittelbaren Zusammenhang ergibt sich als ergänztes Objekt der zuvor erwähnte Mann. Die Pluralform des Imperativs wird im Deutschen durch die Form »hindert« bewahrt.
- source_word: ὃς γὰρ
  choice: denn wer
  rationale: γάρ begründet Jesu Anweisung; das relative ὅς kann vom konkreten Fall ausgehend zugleich einen allgemeinen Grundsatz ausdrücken. »Wer« bewahrt diese Offenheit.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: nicht gegen euch ist
  rationale: κατά mit dem Genitiv bezeichnet hier Gegnerschaft. »Euch« gibt den Plural der zweiten Person ausdrücklich wieder.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: ist für euch
  rationale: ὑπέρ bezeichnet hier unterstützende Zugehörigkeit oder Ausrichtung. »Für euch« erhält die knappe Gegenüberstellung zu »gegen euch«.
theological_decisions:
- issue: Reichweite des Ausspruchs Jesu
  choice: Die Formulierung »wer nicht gegen euch ist« wird als allgemeiner Grundsatz wiedergegeben.
  alternative: »Derjenige, der nicht gegen euch ist« könnte den Satz enger auf den unmittelbar erwähnten Mann beziehen.
  rationale: Das Relativpronomen kann sowohl auf den konkreten Fall zurückweisen als auch einen allgemeineren Grundsatz formulieren. »Wer« wahrt beide Bezüge, ohne die Aussage lehrmäßig auszuweiten oder einzuengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. »Doch« markiert den leichten Gegensatz zum vorausgehenden Einwand, ohne ihn zu überzeichnen. Die Anrede im Plural ist durch »hindert« und »euch« eindeutig.
