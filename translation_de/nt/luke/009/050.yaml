  source_fidelity: 'Der Text gibt den griechischen Wortlaut zuverlässig wieder: δέ ist mit dem leicht kontrastierenden „Doch“ angemessen erfasst, πρὸς αὐτόν bleibt korrekt als „zu ihm“, und der Plural von Μὴ κωλύετε ist durch „Hindert“ sowie das folgende „euch“ klar. „Wer nicht gegen euch ist, ist für euch“ bewahrt sowohl die allgemeine Formulierung als auch die antithetische Struktur von καθ’ ὑμῶν und ὑπὲρ ὑμῶν.'
