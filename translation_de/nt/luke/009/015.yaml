  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: de
  text: Und sie taten es so und ließen alle Platz nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »lagerten alle zum Mahl« oder »ließen alle sich niederlegen«. Das griechische Verb bezeichnet das Anordnen der Menschen zu einer Mahlzeit, bei der man damals gewöhnlich liegend aß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche koordinierende Konjunktion verbindet die Ausführung mit der vorausgehenden Anweisung.
- source_word: ἐποίησαν οὕτως
  choice: sie machten es so
  rationale: 'Die Wendung verweist knapp und natürlich auf Jesu vorherigen Auftrag zurück und bewahrt den Sinn von οὕτως: »auf diese Weise«.'
- source_word: καὶ
  choice: und
  rationale: Die zweite Handlung wird schlicht mit der ersten verbunden, ohne eine stärkere zeitliche oder folgernde Beziehung einzutragen.
- source_word: κατέκλιναν
  choice: ließen … Platz nehmen
  rationale: Das Verb bezeichnet hier das Veranlassen, sich für eine Mahlzeit niederzulassen, in der damaligen Kultur häufig in liegender Haltung. »Platz nehmen« klingt im heutigen Deutsch natürlich und bewahrt durch »ließen« den kausativen Sinn.
- source_word: ἅπαντας
  choice: alle
  rationale: Die Übersetzung gibt die umfassende Bedeutung des Akkusativs wieder und bezeichnet die gesamte versammelte Menge.
