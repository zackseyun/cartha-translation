  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: de
  text: 'Und es geschah, während er für sich allein[a] betete und die Jünger bei ihm waren, da fragte er sie: »Für wen halten mich die Menschenmengen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abseits« oder »für sich«. Die griechische Wendung κατὰ μόνας kann einen Rückzug oder eine private Absonderung bezeichnen, ohne die völlige Abwesenheit anderer vorauszusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt die für Lukas typische narrative Übergangsformel in einer würdigen, noch verständlichen deutschen Wendung.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: als er … betete
  rationale: Der artikulierte Infinitiv mit ἐν bezeichnet einen gleichzeitigen Umstand; die deutsche Temporalkonstruktion gibt ihn natürlich wieder.
- source_word: κατὰ μόνας
  choice: für sich allein
  rationale: Die Wendung kann sowohl das Alleinsein als auch den Rückzug zum ungestörten Gebet bezeichnen. Die Fußnote wahrt die Bedeutungsbreite.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: die Jünger bei ihm waren
  rationale: Gibt die schlichte Aussage ihrer Anwesenheit wieder, ohne das Verhältnis zu Jesu zurückgezogenem Gebet erklärend aufzulösen.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: da fragte er sie
  rationale: Im Deutschen ist das im Griechischen übliche zusätzliche Partizip λέγων hier entbehrlich; die direkte Rede wird natürlich eingeleitet.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Für wen halten mich die Menschenmengen?
  rationale: Eine idiomatische deutsche Wiedergabe der prädikativen indirekten Aussage; sie bewahrt die Frage nach Jesu zugeschriebener Identität.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Bezeichnet die größeren Gruppen bzw. Massen und ist genauer als das allgemeinere »die Leute«.
theological_decisions:
- issue: Spannung zwischen Jesu Gebet »für sich allein« und der Anwesenheit der Jünger
  choice: 'Beide Aussagen werden unmittelbar nebeneinandergestellt: Er betete für sich allein, während die Jünger bei ihm waren.'
  alternative: κατὰ μόνας ausschließlich als »abseits/im Stillen« deuten oder ergänzen, dass die Jünger nur in der Nähe waren.
  rationale: Der griechische Text lässt Art und räumliches Verhältnis des Alleinseins offen. Die Übersetzung bewahrt diese Spannung, statt sie durch eine erklärende Paraphrase aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Erzählton. »Es geschah« erhält den lukanischen Diskursmarker; die übrige Syntax ist für heutige Leser geglättet. Der Fußnotenmarker [a] steht unmittelbar an der mehrdeutigen Wendung.
