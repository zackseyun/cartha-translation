  text: στραφεὶς δὲ ἐπετίμησεν ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/055.yaml
  text: But he turned and rebuked them[a].
translation:
  language: de
  text: Doch er wandte sich um und wies sie zurecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige spätere Handschriften fügen hinzu: „… und sagte: ‚Ihr wisst nicht, von welcher Art Geist ihr seid; denn der Menschensohn ist nicht gekommen, um Menschenleben zu vernichten, sondern um sie zu retten.‘“'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: wandte sich um
  rationale: Das Aoristpartizip von στρέφω bezeichnet hier Jesu körperliche Hinwendung zu den Jüngern. Die finite, beigeordnete Form ist im modernen deutschen Erzählstil natürlich und bewahrt die zeitliche Abfolge.
- source_word: δὲ
  choice: Doch
  rationale: δέ markiert hier einen milden Gegensatz zur unmittelbar vorausgehenden Bitte der Jünger. „Doch“ gibt diesen Kontrast knapp und idiomatisch wieder.
- source_word: ἐπετίμησεν
  choice: wies … zurecht
  rationale: ἐπιτιμάω bezeichnet eine deutliche tadelnde Zurechtweisung. „zurechtweisen“ ist im heutigen Standarddeutsch natürlich und gibt die verbale Korrektur wieder, ohne zusätzliche Schärfe einzutragen.
- source_word: αὐτοῖς
  choice: sie
  rationale: Das Dativpronomen im Griechischen bezieht sich im Kontext auf die angesprochenen Jünger. Das deutsche Verb „zurechtweisen“ verlangt idiomatisch den Akkusativ.
theological_decisions:
- issue: Längere Texterweiterung in späteren Handschriften
  choice: Im Haupttext wird ausschließlich der kurze SBLGNT-Text übersetzt.
  alternative: '„Doch er wandte sich um, wies sie zurecht und sagte: ‚Ihr wisst nicht, von welcher Art Geist ihr seid; denn der Menschensohn ist nicht gekommen, um Menschenleben zu vernichten, sondern um sie zu retten.‘“'
  rationale: Die vorgegebene griechische Ausgangsausgabe enthält nur die kürzere Lesart. Die umfangreiche und traditionsgeschichtlich bekannte Erweiterung wird daher nicht in den Haupttext aufgenommen, sondern als Textvariante in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ wahrt den erzählerischen Gegensatz; „wandte sich um“ und „wies sie zurecht“ sind klar und ohne unnötig kirchensprachliche Färbung.
