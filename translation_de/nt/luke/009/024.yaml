  verdict: approve
  source_fidelity: Der deutsche Text gibt die allgemeine Bedingung von ὃς ἂν mit „wer“ treffend wieder, bewahrt γάρ („Denn“) und den Kontrast δέ („aber“). „sein Leben retten / wird es verlieren“ sowie „sein Leben um meinetwillen verliert / wird es retten“ bilden die Wiederholung von ψυχή, σῴζω und ἀπόλλυμι sachgerecht und rhetorisch klar ab. Das korrelative „wer …, der …“ gibt die Hervorhebung durch οὗτος idiomatisch wieder.
  naturalness: Modernes, gut lesbares Standarddeutsch. Das Semikolon unterstützt die antithetische Parallelität. „Um meinetwillen“ ist leicht gehoben, aber im biblisch-würdigen Register natürlich und verständlich.
  terminology: „Leben“ ist im Kontext die naheliegende Wiedergabe von ψυχή und vermeidet eine unzulässige Einengung auf „Seele“. Die Fußnote hält die relevanten lexikalischen Alternativen offen. „Retten“ und „verlieren“ bewahren die beabsichtigte verbale und paradoxe Verknüpfung.
