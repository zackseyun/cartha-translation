  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: de
  text: Denn wer sein Leben retten will, wird es verlieren[a]; wer aber sein Leben um meinetwillen verliert, der wird es retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Seele“ oder „sich selbst“. Das griechische Wort kann je nach Zusammenhang Leben, Seele oder Selbst bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Denn wer … will
  rationale: Die Verbindung aus Relativpronomen, ἄν und Konjunktiv formuliert eine allgemeine Bedingung; im Deutschen ist „wer“ dafür natürlich. γάρ bleibt als „denn“ erhalten und stellt den erklärenden Bezug zum vorausgehenden Wort her.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή kann je nach Zusammenhang „Leben“, „Seele“ oder „Selbst“ bezeichnen. Im Paradox vom Retten und Verlieren bezeichnet „Leben“ am unmittelbarsten die eigene Existenz, ohne den Ausdruck auf die immaterielle Seele einzuengen.
- source_word: σῶσαι / σώσει
  choice: retten / wird … retten
  rationale: Die einheitliche Wiedergabe von σῴζω mit „retten“ bewahrt die Wortwiederholung und damit die paradoxe Zuspitzung des Satzes; „bewahren“ wäre möglich, aber weniger prägnant.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: wird … verlieren / verliert
  rationale: ἀπόλλυμι bedeutet hier „verlieren“. Dieselbe deutsche Wortwahl in beiden Satzhälften erhält die rhetorische Entsprechung.
- source_word: ἕνεκεν ἐμοῦ
  choice: um meinetwillen
  rationale: Die Präposition bezeichnet Grund oder Beweggrund. „Um meinetwillen“ ist eine natürliche, würdevolle Wiedergabe und hält den persönlichen Bezug auf Jesus fest.
- source_word: οὗτος
  choice: der
  rationale: Das demonstrative οὗτος hebt die zuvor beschriebene Person hervor. Das deutsche Korrelat „der“ in „wer …, der …“ bewahrt diese Hervorhebung natürlicher als „dieser“.
theological_decisions:
- issue: Bedeutungsumfang von ψυχή
  choice: Leben
  alternative: Seele; Selbst
  rationale: Der Zusammenhang von Nachfolge, Selbstverleugnung sowie dem Verlieren und Retten der eigenen Existenz spricht für „Leben“. Die Fußnote hält den weiteren Bedeutungsumfang offen und vermeidet eine einseitige anthropologische Festlegung.
- issue: Allgemeiner Personenbezug im grammatischen Maskulinum
  choice: wer … sein Leben …, der
  alternative: wer … das eigene Leben …; alle, die … ihr Leben
  rationale: Die deutsche singularische „wer … der“-Konstruktion entspricht der allgemeinen Bedingung des Griechischen und bewahrt Zahl und rhetorische Form, ohne den Satz unnötig zu pluralisieren.
- issue: Hervorhebung durch οὗτος
  choice: Korrelatives „der“ ausdrücklich wiedergegeben
  alternative: bloßes „er“ oder Auslassung der Hervorhebung
  rationale: „Wer …, der …“ bildet die griechische Hervorhebung idiomatisch ab, ohne das unnatürlich schwere „dieser“ zu verwenden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die parallelen Verben „retten“ und „verlieren“ erhalten die knappe paradoxe Form; „um meinetwillen“ wahrt den persönlichen und feierlichen Ton.
