  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: de
  text: Doch als die Menschenmengen davon erfuhren, folgten sie ihm. Er hieß sie willkommen und sprach zu ihnen über das Reich Gottes, und er heilte diejenigen, die Heilung nötig hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er heilte diejenigen, die Behandlung oder Pflege nötig hatten.“ Das griechische Wort θεραπεία kann „Heilung“, „Behandlung“ oder „Pflege“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Doch … die Menschenmengen
  rationale: δέ markiert hier einen milden Gegensatz zu Jesu Rückzug im vorherigen Kontext; der Plural ὄχλοι wird als „Menschenmengen“ bewahrt.
- source_word: γνόντες
  choice: als … davon erfuhren
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben; „davon“ verweist offen auf Jesu Aufenthaltsort beziehungsweise Rückzug.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten sie ihm
  rationale: Die übliche, zugleich erzählerisch offene Wiedergabe von ἀκολουθέω mit Dativ.
- source_word: ἀποδεξάμενος αὐτούς
  choice: Er hieß sie willkommen
  rationale: ἀποδέχομαι bezeichnet eine freundliche, bereitwillige Aufnahme und ist stärker als ein neutrales „empfangen“.
- source_word: ἐλάλει αὐτοῖς
  choice: sprach zu ihnen
  rationale: Der Imperfekt bezeichnet den fortdauernden Vorgang; im natürlichen deutschen Erzählstil muss dies nicht durch eine Verlaufsumschreibung ausgedrückt werden.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: über das Reich Gottes
  rationale: Bewahrt den etablierten biblischen Schlüsselbegriff und lässt sowohl Gottes Herrschaft als auch deren Bereich mitschwingen.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: alle, die Heilung nötig hatten
  rationale: θεραπεία kann Heilung, Behandlung oder Pflege bezeichnen; im Zusammenhang mit ἰᾶτο steht der Heilungsbedarf im Vordergrund. „Alle“ macht die substantivierte Personenbezeichnung idiomatisch, ohne eine neue Einschränkung einzuführen.
- source_word: ἰᾶτο
  choice: heilte er
  rationale: Der Imperfekt beschreibt Jesu fortlaufendes Heilen; die deutsche Verbform gibt den Vorgang in flüssigem Erzählstil wieder.
theological_decisions:
- issue: Wiedergabe von βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  alternative: die Herrschaft Gottes
  rationale: „Reich Gottes“ ist die etablierte und hinreichend offene Wiedergabe. Sie sollte nicht auf einen bloß räumlichen Bereich verengt werden, kann aber Gottes wirksame Herrschaft einschließen.
- issue: Bedeutungsumfang von θεραπείας
  choice: Heilung
  alternative: Behandlung oder Pflege
  rationale: Das unmittelbar folgende ἰᾶτο legt hier „Heilung“ nahe; die weiter reichende lexikalische Möglichkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut verständlich, bewahrt aber den milden Gegensatz am Anfang, die freundliche Aufnahme der Menschen und die parallelen fortdauernden Tätigkeiten Jesu.
