id: LUK.9.36
reference: Luke 9:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: de
  text: Als die Stimme erklungen war, war Jesus allein zu sehen.[a] Sie aber schwiegen und erzählten in jenen Tagen niemandem etwas von dem, was sie gesehen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jesus wurde allein gefunden.“ Möglich auch: „Nur Jesus blieb zurück“ oder „Nur Jesus war zu sehen.“'
    reason: Die wörtliche deutsche Wiedergabe von εὑρέθη klingt nach einer Suche; die Fußnote bewahrt die griechische Form und nennt die naheliegenden Sinnmöglichkeiten.
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Als die Stimme erklungen war
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv bezeichnet hier den Zeitpunkt. „Erklungen war“ gibt das Eintreten der himmlischen Stimme natürlich wieder, ohne φωνή zu einem bloßen Geräusch abzuschwächen.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: war Jesus allein zu sehen
  rationale: Das passive εὑρέθη bedeutet wörtlich „wurde gefunden“. Im Deutschen wäre dies hier missverständlich, als hätte man nach Jesus gesucht. „War … zu sehen“ bewahrt den feststellenden Charakter und die Aussage, dass nur Jesus sichtbar zurückblieb; die wörtlichere Form steht in der Fußnote.
- source_word: ἐσίγησαν
  choice: schwiegen
  rationale: Das schlichte Präteritum gibt das erzählerische Aorist angemessen wieder. Der folgende Satzteil verdeutlicht, dass sie ihr Schweigen tatsächlich wahrten.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: erzählten … niemandem
  rationale: ἀπαγγέλλω bezeichnet hier das Mitteilen oder Berichten des Erlebten. „Erzählten niemandem“ ist gegenwärtiges, natürliches Deutsch und passt zum narrativen Zusammenhang.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Die Wendung wird formal und idiomatisch als zeitliche Begrenzung wiedergegeben.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: etwas von dem, was sie gesehen hatten
  rationale: Unter der Negation „niemandem“ ist „etwas“ im Deutschen idiomatisch. „Von dem, was“ wahrt den partitiv-relativen Aufbau; das Plusquamperfekt markiert das zuvor Gesehene.
theological_decisions:
- issue: Erzählerische Bedeutung der alleinigen Gegenwart Jesu nach der himmlischen Stimme
  choice: Deskriptiv wiedergeben, dass Jesus allein zu sehen war
  alternative: „Nur Jesus blieb zurück“ oder „Sie sahen nur noch Jesus“
  rationale: Der Text berichtet den Ausgang der Szene, ohne ihn ausdrücklich theologisch auszudeuten. Die Übersetzung wahrt diese Zurückhaltung und vermeidet es, ein bewusstes Zurückbleiben oder die Wahrnehmung der Jünger stärker zu betonen, als der griechische Wortlaut es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am griechischen Erzählgang; unnötig kirchensprachliche oder konfessionell geprägte Formulierungen werden vermieden.
