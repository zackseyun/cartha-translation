  source_fidelity: Die Übersetzung gibt den temporalen Anschluss von ἐν τῷ γενέσθαι τὴν φωνήν angemessen wieder. „Die Stimme“ entspricht φωνή im Kontext der himmlischen Rede. „Jesus allein zu sehen“ ist eine natürliche, kontextgerechte Wiedergabe von εὑρέθη Ἰησοῦς μόνος, ohne eine Suche nach Jesus zu insinuieren; die Fußnote dokumentiert die wörtlichere Struktur. Das Schweigen und das Nichtweitererzählen werden vollständig erfasst, ebenso die zeitliche Wendung und der Bezug auf das zuvor Gesehene.
  naturalness: Modernes Standarddeutsch mit würdig-narrativem Register. „Als die Stimme erklungen war“ und „in jenen Tagen“ sind idiomatisch. Die Formulierung „war Jesus allein zu sehen“ ist im Deutschen flüssiger als ein wörtliches „wurde Jesus allein gefunden“ und wahrt die erzählerische Zurückhaltung.
  terminology: „Stimme“, „Jesus“, „schwiegen“ und „erzählten“ sind sachgerecht. Es werden keine konfessionellen oder interpretierenden theologischen Zusätze eingebracht. Die Fußnote kennzeichnet die möglichen Umformulierungen ausdrücklich als Möglichkeiten und bewahrt die wörtliche griechische Form.
