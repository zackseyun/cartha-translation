source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: de
  text: 'Als sie von ihm weggingen, sagte Petrus zu Jesus: »Meister, es ist gut, dass wir hier sind. Wir wollen drei Hütten[a] machen: eine für dich, eine für Mose und eine für Elia.« Er wusste nicht, was er sagte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zelte« beziehungsweise »Laubhütten«; traditionell auch »Hütten«. Das griechische Wort bezeichnet vorübergehende Unterkünfte und kann an biblische Festmotive erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Als sie sich von ihm trennten
  rationale: Die lukanische Erzählformel ἐγένετο ἐν τῷ mit Infinitiv wird im Deutschen natürlich als gleichzeitiger Temporalsatz wiedergegeben. Das reflexive »sich trennen« bewahrt den Trennungsvorgang und ἀπό die Beziehung auf Jesus; das Subjekt sind im Zusammenhang Mose und Elia.
- source_word: Ἐπιστάτα
  choice: Meister
  rationale: Das für Lukas charakteristische ἐπιστάτης ist eine respektvolle Anrede, die Jesu Autorität ausdrückt. »Meister« unterscheidet sie angemessen vom gewöhnlichen »Lehrer« für διδάσκαλος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: es ist gut, dass wir hier sind
  rationale: Diese idiomatische deutsche Form gibt die positive Bewertung durch καλόν und den Inhalt der Infinitivkonstruktion klar wieder.
- source_word: ποιήσωμεν
  choice: Wir wollen … machen
  rationale: Der hortative Aorist-Konjunktiv formuliert einen Vorschlag. »Wir wollen« klingt im modernen Deutschen natürlicher als »Lasst uns«, während »machen« die lexikalische Offenheit von ποιέω wahrt.
- source_word: σκηνὰς
  choice: Hütten
  rationale: σκηνή bezeichnet hier eine vorübergehende Unterkunft. »Hütten« ist verständlich, traditionsnah und lässt mögliche Anklänge an das Laubhüttenfest offen, ohne sie im Haupttext festzuschreiben.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Er wusste nämlich nicht, was er sagte
  rationale: Der erklärende Partizipialsatz wird als eigenständiger deutscher Satz wiedergegeben. »Wusste nicht« bleibt näher an οἶδα als das stärker deutende »verstand nicht«; das griechische historische Präsens λέγει wird im deutschen Erzählzusammenhang natürlich als Präteritum formuliert.
theological_decisions:
- issue: Mögliche Fest- oder Stiftshüttenanklänge von σκηνάς im Zusammenhang der Verklärung
  choice: Hütten
  alternative: Zelte; Laubhütten; Wohnstätten
  rationale: Der Vers benennt weder ausdrücklich das Laubhüttenfest noch die Stiftshütte. »Hütten« bewahrt die zeitweilige Art der Unterkünfte und den möglichen biblischen Anklang, ohne eine bestimmte symbolische Deutung zur einzig möglichen zu machen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Erzählformel wird idiomatisch statt wörtlich wiedergegeben; die Schlussbemerkung bleibt sachlich und deutet Petrus’ Unwissen nicht weiter aus.
