source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: de
  text: 'Doch er sagte zu ihm: „Lass die Toten[a] ihre eigenen Toten begraben. Du aber geh und verkünde das Reich Gottes!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wahrscheinlich bezeichnet das erste „Toten“ Menschen, die geistlich nicht ansprechbar sind, und das zweite körperlich Verstorbene. Im Griechischen steht an beiden Stellen dasselbe Wort; die Übersetzung bewahrt daher die auffällige Spannung.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Lass
  rationale: Der Aoristimperativ von ἀφίημι fordert hier knapp und nachdrücklich dazu auf, die genannte Aufgabe anderen zu überlassen. „Lass“ ist im Deutschen natürlich und bewahrt die Konstruktion mit Infinitiv.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: die Toten ... ihre eigenen Toten
  rationale: Die Wiederholung desselben griechischen Wortes wird beibehalten, damit das schroffe Paradox und die Mehrdeutigkeit zwischen vermutlich übertragenem und wörtlichem Sinn erhalten bleiben.
- source_word: θάψαι
  choice: begraben
  rationale: Der Infinitiv bezeichnet die Tätigkeit, welche die Toten ausführen sollen; „begraben“ ist die direkte und übliche Entsprechung.
- source_word: ἑαυτῶν
  choice: ihre eigenen
  rationale: Das reflexive Pronomen trägt eine hervorhebende Bedeutung, die durch „eigenen“ deutlicher wiedergegeben wird als allein durch „ihre“.
- source_word: ἀπελθὼν
  choice: geh
  rationale: Das vorangestellte Aoristpartizip wird idiomatisch als Teil einer deutschen Aufforderungsfolge wiedergegeben. „Geh und verkünde“ bewahrt die Bewegung vor beziehungsweise hin zur Verkündigung, ohne die im Deutschen schwerfällige Form „nachdem du weggegangen bist“.
- source_word: διάγγελλε
  choice: verkünde
  rationale: Der Präsensimperativ bezeichnet öffentliches beziehungsweise fortgesetztes Bekanntmachen. „Verkünde“ passt natürlich zum Reich Gottes und wahrt den Heroldston.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte und verständliche deutsche Wiedergabe; sie lässt sowohl den Herrschaftsbereich als auch Gottes königliches Wirken anklingen.
theological_decisions:
- issue: Bedeutung von „die Toten“ in den beiden Vorkommen
  choice: In beiden Fällen steht im Haupttext „die Toten“, ohne den ersten Ausdruck ausdrücklich zu vergeistlichen.
  alternative: „Lass die geistlich Toten ihre eigenen Toten begraben.“
  rationale: Wahrscheinlich ist das erste Vorkommen übertragen und das zweite körperlich gemeint. Da der griechische Text jedoch beide Male νεκρούς verwendet, darf die Übersetzung die auffällige Spannung nicht durch einen erklärenden Zusatz auflösen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. Die adversative Hervorhebung σὺ δέ wird mit einem neuen Satz und „Du aber“ markiert; so bleibt der Kontrast natürlich und deutlich.
