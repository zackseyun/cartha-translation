  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. Die Formulierung „lässt ihn unter Schäumen krampfen“ ist idiomatischer und genauer als „zerrt ihn unter Schäumen hin und her“.
  terminology: „Geist“ bewahrt die im griechischen Text vorliegende Unbestimmtheit und die Fußnote erläutert den Kontext angemessen, ohne die Hauptübersetzung zu überladen. „Zugrunde richtet“ gibt die schwere, fortgesetzte Schädigung von συντρίβον verständlicher wieder als „misshandelt“, ohne eine konkrete Verletzungsart festzulegen.
