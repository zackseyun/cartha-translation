    rationale: Das griechische Verb bezeichnet hier das Herbeiführen heftiger Krämpfe bzw. Konvulsionen. Deutsches „hin und her zerren“ legt eher ein äußeres Schleifen oder Ziehen nahe und erfasst das krampfhafte Geschehen weniger präzise.
  - severity: medium
    issue: συντρίβον als „schwer misshandelt“
    rationale: „Misshandeln“ ist semantisch weiter und kann gezielte menschliche Gewalt assoziieren. Das Partizip betont das Zermalmen bzw. Zugrunderichten des Jungen; eine entsprechend schädigende, aber nicht medizinisch überpräzisierte Formulierung ist vorzuziehen.
