id: LUK.9.39
reference: Luke 9:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: de
  text: 'Und sieh: Ein Geist ergreift ihn, und plötzlich schreit er auf. Er lässt ihn unter Schäumen krampfen und weicht kaum von ihm, während er ihn zugrunde richtet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ bezeichnet hier dem Zusammenhang nach ein feindliches übernatürliches Wesen; der griechische Text sagt an dieser Stelle jedoch nur „Geist“, nicht ausdrücklich „böser Geist“ oder „Dämon“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh nur
  rationale: Bewahrt als natürlicher deutscher Diskursmarker die lebendige, eindringliche Schilderung des Vaters, ohne das altertümliche „siehe“ zu verwenden.
- source_word: πνεῦμα
  choice: ein Geist
  rationale: Der griechische Text bezeichnet das Wesen nur als πνεῦμα und nennt es hier weder ausdrücklich böse noch einen Dämon; die weniger bestimmte Bezeichnung bleibt daher im Haupttext erhalten.
- source_word: λαμβάνει
  choice: ergreift
  rationale: Gibt die plötzliche, überwältigende Gewalt im Kontext treffend wieder und ist stärker als das zu allgemeine „nimmt“.
- source_word: ἐξαίφνης
  choice: plötzlich
  rationale: Natürliche und genaue Wiedergabe des unvermittelten Einsetzens.
- source_word: κράζει
  choice: schreit er auf
  rationale: Lässt wie im Griechischen den Jungen als naheliegendes Subjekt stehen und gibt den abrupten Vorgang idiomatisch wieder, ohne ausdrücklich hinzuzufügen, der Geist bringe ihn zum Schreien.
- source_word: σπαράσσει
  choice: zerrt ihn hin und her
  rationale: Bringt die gewaltsamen krampfartigen Bewegungen in allgemein verständlichem Deutsch zum Ausdruck; das Verb kann heftiges Zerren oder Konvulsionen bezeichnen.
- source_word: μετὰ ἀφροῦ
  choice: unter Schäumen
  rationale: Verbindet das Schäumen knapp und natürlich mit dem gewaltsamen Zerren, ohne eine Ursache näher festzulegen.
- source_word: μόγις
  choice: kaum
  rationale: Bewahrt die mögliche Spannung zwischen seltenem und nur widerwilligem beziehungsweise mühsamem Weichen, statt sie ausdrücklich auf eine dieser Deutungen festzulegen.
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: weicht kaum von ihm
  rationale: „Von ihm weichen“ passt natürlich zu einem feindlichen Geist und erhält die räumliche Grundbedeutung des Ausdrucks.
- source_word: συντρῖβον αὐτόν
  choice: wobei er ihn schwer misshandelt
  rationale: Gibt die schwere schädigende Einwirkung wieder, ohne eine bestimmte Verletzungsart wie Quetschen oder Zerschmettern festzuschreiben; das maskuline Pronomen folgt dem deutschen Genus von „Geist“.
theological_decisions:
- issue: Ob πνεῦμα im Haupttext ausdrücklich als böser Geist oder Dämon bezeichnet werden soll
  choice: ein Geist
  alternative: ein böser Geist; ein Dämon
  rationale: Der Zusammenhang zeigt ein feindliches übernatürliches Wesen, doch der Vers selbst verwendet nur die allgemeinere Bezeichnung πνεῦμα. Die Übersetzung wahrt diese lexikalische Unbestimmtheit.
- issue: Wie die fortdauernde Schädigung durch συντρῖβον zeitlich auf das Weichen des Geistes zu beziehen ist
  choice: wobei er ihn schwer misshandelt
  alternative: nachdem er ihn schwer misshandelt hat; und lässt ihn dabei völlig zerschlagen zurück
  rationale: Das präsentische Partizip beschreibt begleitende beziehungsweise fortdauernde Schädigung, ohne den genauen zeitlichen Ablauf eindeutig festzulegen. „Wobei“ hält diese Beziehung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh nur“ erhält die mündliche Eindringlichkeit; „unter Schäumen“ und „schwer misshandelt“ vermitteln die Gewalt der Schilderung verständlich, ohne medizinisch oder dämonologisch stärker zu präzisieren als der griechische Wortlaut.
