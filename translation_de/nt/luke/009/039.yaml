  to: 'Und sieh: Ein Geist ergreift ihn, und plötzlich schreit er auf. Er lässt ihn unter Schäumen krampfen und weicht kaum von ihm, während er ihn zugrunde richtet.[a]'
  rationale: Die Revision bewahrt die lebendige Einleitung, die knappe Benennung „Geist“ und die offene Nuance von μόγις. Sie gibt σπαράσσει mit einem im heutigen Deutsch klaren Ausdruck für das Auslösen von Krämpfen wieder und ersetzt das zu allgemein gefärbte „misshandelt“ durch „zugrunde richtet“, das die anhaltend zerstörerische Wirkung von συντρίβον ausdrückt, ohne eine bestimmte medizinische Diagnose oder Verletzung zu behaupten.
