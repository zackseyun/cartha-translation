id: LUK.9.28
reference: Luke 9:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: de
  text: Etwa acht Tage nach diesen Worten[a] nahm er Petrus, Johannes und Jakobus mit und stieg auf den Berg, um zu beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach diesen Aussprüchen“. Das griechische Wort kann hier sowohl „Worte“ als auch zusammenhängende „Aussprüche“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Wendung dient hier vor allem als erzählerischer Übergang. Ein ausdrückliches „Nun“ oder das schwerfällige „Und es geschah“ würde im modernen Deutschen mehr Gewicht tragen als im Griechischen.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: nach diesen Worten
  rationale: λόγοι bezeichnet hier die unmittelbar vorausgehenden Äußerungen Jesu. „Worte“ ist im Deutschen natürlich, würdig und verweist klar auf das Gesagte.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: etwa acht Tage
  rationale: ὡσεὶ kennzeichnet die Zeitangabe ausdrücklich als ungefähr; „etwa“ bewahrt diese Unschärfe.
- source_word: παραλαβὼν
  choice: nahm ... mit
  rationale: Das Partizip bezeichnet, dass Jesus die drei als Begleiter mitnahm. Die finite Form ergibt einen natürlichen deutschen Satz.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petrus, Johannes und Jakobus
  rationale: Die geläufigen deutschen Namensformen werden verwendet; die wiederholte Konjunktion wird als natürliche deutsche Aufzählung wiedergegeben.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: stieg auf den Berg
  rationale: „Stieg“ bewahrt die in ἀνέβη enthaltene Aufwärtsbewegung; „auf den Berg“ gibt das Bewegungsziel idiomatisch wieder.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Infinitiv bezeichnet den Zweck des Hinaufsteigens; die deutsche Konstruktion mit „um zu“ macht dies klar und natürlich.
theological_decisions:
- issue: Ungefähre Zeitangabe im Verhältnis zu den Parallelberichten
  choice: etwa acht Tage
  alternative: acht Tage; ungefähr eine Woche
  rationale: Lukas verwendet ὡσεὶ und kennzeichnet die Angabe damit als annähernd. Die Übersetzung erhält diese Spannung, ohne die Formulierung an die Parallelberichte anzugleichen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die griechische Satzstruktur wird behutsam geglättet, während Zeitnähe, Begleitung, Aufwärtsbewegung und Gebetsabsicht erhalten bleiben.
