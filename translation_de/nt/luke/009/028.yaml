  source_fidelity: „Etwa acht Tage“ gibt ὡσεὶ ἡμέραι ὀκτώ korrekt als ungefähre Zeitangabe wieder. „Nach diesen Worten“ entspricht μετὰ τοὺς λόγους τούτους; „nahm … mit“ bildet παραλαβών angemessen ab. „stieg auf den Berg“ bewahrt die Aufwärtsbewegung von ἀνέβη εἰς τὸ ὄρος, und „um zu beten“ gibt den Zweck des Infinitivs προσεύξασθαι klar wieder. Die nicht eigens übersetzte narrative Übergangsformel Ἐγένετο δέ ist im modernen Deutschen vertretbar.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und hat einen angemessen würdigen Erzählton. Die deutsche Aufzählung mit Kommas ist idiomatisch.
  terminology: Die etablierten deutschen Namensformen Petrus, Johannes und Jakobus sind korrekt. „Worte“ ist für λόγοι in diesem Kontext passend; die Fußnote wahrt die mögliche Nuance „Aussprüche“, ohne eine Auslegung aufzuzwingen.
