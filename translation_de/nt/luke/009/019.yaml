id: LUK.9.19
reference: Luke 9:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: de
  text: 'Sie antworteten: „Johannes der Täufer“; andere aber: „Elia“; und wieder andere: „Einer der Propheten aus alter Zeit ist auferstanden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „Ein Prophet aus alter Zeit ist wieder aufgetreten.“ Das griechische Verb kann „aufstehen“, „sich erheben“ oder im entsprechenden Zusammenhang „auferstehen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Sie antworteten
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine geläufige, semitisch beeinflusste Ausdrucksweise. „Sie antworteten“ gibt sie im Deutschen natürlich und ohne unnötige Doppelung wieder.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Johannes der Täufer
  rationale: Dies ist die geläufige deutsche Bezeichnung und gibt den identifizierenden Titel βαπτιστής genau wieder.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: andere aber ... und wieder andere
  rationale: Die wiederholte Gegenüberstellung bleibt erhalten; „wieder andere“ klingt in einer deutschen Aufzählung natürlich.
- source_word: Ἠλίαν
  choice: Elia
  rationale: Geläufige deutsche Namensform des Propheten.
- source_word: ὅτι
  choice: Einer ... ist
  rationale: ὅτι leitet den Inhalt der dritten Antwort ein. Im Deutschen lässt sich dieser Inhalt innerhalb der direkten Rede natürlicher als vollständiger Satz wiedergeben.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: einer der Propheten aus alter Zeit
  rationale: τις bezeichnet eine unbestimmte Person; der Genitiv τῶν ἀρχαίων wird hier am natürlichsten partitiv verstanden und auf die Propheten der alten Zeit bezogen.
- source_word: ἀνέστη
  choice: ist auferstanden
  rationale: Im Zusammenhang mit einer Gestalt aus früherer Zeit liegt die Bedeutung „auferstanden“ nahe. Die Formulierung bewahrt den möglichen Bezug auf Auferstehung, ohne die Identität des Propheten näher festzulegen.
theological_decisions:
- issue: Ob ἀνέστη ausdrücklich als Auferstehungsaussage wiederzugeben ist
  choice: ist auferstanden
  alternative: ist wieder aufgetreten / hat sich erhoben
  rationale: Das Verb kann allgemein „aufstehen“ oder „sich erheben“ bedeuten und in entsprechenden Zusammenhängen auch die Auferstehung bezeichnen. Da hier ein Prophet aus alter Zeit erneut gegenwärtig sein soll, ist „auferstanden“ im Deutschen kontextgemäß; eine Fußnote hält die allgemeinere Deutungsmöglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Aufzählung des griechischen Textes bleibt durch die knappen Antworten erhalten; der letzte Teil wird zur besseren Verständlichkeit als vollständiger Satz formuliert.
