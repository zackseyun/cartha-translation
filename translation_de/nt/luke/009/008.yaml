  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: de
  text: von einigen aber, Elia sei erschienen, von anderen, ein Prophet aus alter Zeit[a] sei auferstanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: ein gewisser Prophet aus früherer Zeit.'
    reason: Die griechische Fügung προφήτης τις τῶν ἀρχαίων bezeichnet unbestimmt einen Propheten aus früherer Zeit; die Formulierung vermeidet das missverständliche „von den Alten“.
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: von einigen ... von anderen
  rationale: Die Präposition ὑπό mit Genitiv bezeichnet hier die Quelle der jeweiligen Aussage. Die elliptische Aufzählung aus dem vorangehenden Vers bleibt erhalten.
- source_word: δὲ ... δὲ
  choice: aber ... [unübersetzt]
  rationale: Das erste δέ führt eine weitere Meinung in der Aufzählung an; „aber“ gibt den milden Kontrast wieder. Beim zweiten Glied genügt im Deutschen die parallele Fügung „von anderen“.
- source_word: ὅτι ... ὅτι
  choice: 'Konjunktiv I mit indirekter Rede: „sei ... sei“'
  rationale: ὅτι leitet jeweils den Inhalt der berichteten Meinung ein. Im Deutschen gibt der Konjunktiv I die indirekte Rede natürlich und eindeutig wieder.
- source_word: Ἠλίας
  choice: Elia
  rationale: Gebräuchliche deutsche Namensform des alttestamentlichen Propheten.
- source_word: ἐφάνη
  choice: sei erschienen
  rationale: Der Aorist Passiv von φαίνω bedeutet hier „erschien“ beziehungsweise „wurde sichtbar“. „Sei erschienen“ passt zur indirekten Rede und unterscheidet die Aussage von der Auferstehungsaussage im folgenden Glied.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ein Prophet aus alter Zeit
  rationale: Die Wendung bezeichnet unbestimmt einen Propheten, der zu den Menschen früherer Zeit gehört. „Aus alter Zeit“ ist im heutigen Deutsch natürlicher als „von den Alten“ und wahrt die Unbestimmtheit.
- source_word: ἀνέστη
  choice: sei auferstanden
  rationale: ἀνίστημι bezeichnet in diesem Zusammenhang das Aufstehen von den Toten. „Auferstanden“ erhält diesen Sinn, ohne durch eine Passivform festzulegen, wer ihn auferweckt habe.
theological_decisions:
- issue: Art der Behauptung über den früheren Propheten
  choice: „sei auferstanden“
  alternative: „sei wieder erschienen“ oder „sei auferweckt worden“
  rationale: Der Zusammenhang und ἀνέστη weisen auf eine Rückkehr aus dem Tod. Die aktive Form „auferstanden“ bewahrt zugleich die grammatische Gestalt und vermeidet eine im griechischen Wortlaut nicht ausdrücklich genannte handelnde Instanz.
- issue: Status der berichteten Meinungen
  choice: indirekte Rede im Konjunktiv I
  alternative: indikativische Wiedergabe
  rationale: Der Konjunktiv kennzeichnet die Aussagen als umlaufende Meinungen, ohne sie zu bestätigen oder zu verwerfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als Fortsetzung der Satzkonstruktion aus Vers 7 kleingeschrieben und elliptisch; die indirekte Rede wird idiomatisch durch den Konjunktiv I markiert.
