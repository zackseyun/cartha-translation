id: LUK.9.6
reference: Luke 9:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: de
  text: Da zogen sie los und gingen von Dorf zu Dorf. Überall verkündeten sie die gute Nachricht und heilten Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: zogen sie los
  rationale: Das aoristische Partizip leitet nach der Beauftragung Jesu die folgende Handlung ein. „zogen sie los“ gibt das Aufbrechen natürlich und prägnant wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit leichter Folgewirkung fort. „Da“ verbindet den Aufbruch flüssig mit dem vorausgehenden Auftrag.
- source_word: διήρχοντο κατὰ τὰς κώμας
  choice: gingen von Dorf zu Dorf
  rationale: Das Imperfekt bezeichnet fortlaufende Bewegung, während κατά mit Akkusativ hier distributiv zu verstehen ist. Die Formulierung bildet beides idiomatisch ab.
- source_word: εὐαγγελιζόμενοι
  choice: verkündeten sie die gute Nachricht
  rationale: Die Wiedergabe bewahrt den Sinn öffentlicher Heilsverkündigung, bleibt aber für heutige Leser unmittelbar verständlich und vermeidet unnötige kirchliche Fachsprache.
- source_word: θεραπεύοντες
  choice: heilten Menschen
  rationale: θεραπεύω bezeichnet hier das Heilen im Rahmen des Auftrags der Jünger. Das ergänzte Objekt „Menschen“ ist im Deutschen natürlich und ergibt sich aus dem Zusammenhang, ohne die Art der Krankheiten näher festzulegen.
- source_word: πανταχοῦ
  choice: Überall
  rationale: Das Adverb betont die umfassende örtliche Ausbreitung beider Tätigkeiten und steht im Deutschen wirkungsvoll am Satzanfang.
theological_decisions:
- issue: Bedeutung von εὐαγγελιζόμενοι im Sendungsauftrag der Jünger
  choice: verkündeten sie die gute Nachricht
  alternative: predigten sie das Evangelium
  rationale: Die gewählte Formulierung gibt den evangelistischen Inhalt wieder, ohne dem Wort zwingend einen später ausgeprägten kirchlichen Fachsinn zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze macht die fortlaufende Reise und die überall ausgeübten beiden Dienste klar verständlich. „Von Dorf zu Dorf“ bewahrt den distributiven Sinn von κατὰ τὰς κώμας; eine Fußnote ist daher nicht erforderlich.
