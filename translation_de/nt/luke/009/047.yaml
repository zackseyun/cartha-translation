  verdict: approve
  source_fidelity: 'Die Übersetzung gibt den Sinn der griechischen Konstruktion zutreffend wieder: Jesu Kenntnis des inneren Gedankengangs, das Nehmen eines Kindes und dessen Aufstellen unmittelbar bei ihm. Der kollektive Singular in „ihrem Herzen“ entspricht dem Singular καρδίας bei pluralischem Bezug αὐτῶν und ist im Deutschen verständlich.'
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. Die Aufteilung der partizipialen Eingangskonstruktion in zwei Sätze ist idiomatisch und verändert weder Abfolge noch Sinn. „Stellte es neben sich“ ist für ἔστησεν … παρ’ ἑαυτῷ natürlich und anschaulich.
  terminology: „Wusste“, „überlegten“, „Herzen“, „Kind“ und „stellte“ sind angemessene, nicht überdeutende Wiedergaben. Die Formulierung erklärt nicht, auf welche Weise Jesus die inneren Überlegungen kannte, und bewahrt damit die im griechischen Text vorhandene Offenheit.
