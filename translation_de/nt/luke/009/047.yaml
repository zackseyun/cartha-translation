id: LUK.9.47
reference: Luke 9:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: de
  text: Jesus aber wusste, was sie in ihrem Herzen überlegten. Er nahm ein Kind und stellte es neben sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: wusste
  rationale: Das Partizip bezeichnet hier geistiges Wissen oder Erkennen. „Wusste“ ist natürlich und lässt offen, auf welche Weise Jesus ihre innere Überlegung kannte.
- source_word: διαλογισμὸν
  choice: was sie … überlegten
  rationale: Die verbale Wiedergabe drückt den inneren Gedankengang oder die Erwägung idiomatisch aus und bewahrt den Bezug zur vorausgehenden Rangfrage.
- source_word: τῆς καρδίας αὐτῶν
  choice: in ihrem Herzen
  rationale: Die Formulierung bewahrt den griechischen Singular καρδίας zusammen mit dem pluralischen Bezug αὐτῶν. „Herz“ bezeichnet hier das Innere als Ort des Denkens und Erwägens.
- source_word: ἐπιλαβόμενος
  choice: nahm
  rationale: Das Verb kann „ergreifen“ oder „bei der Hand nehmen“ bedeuten; ohne Angabe eines Körperteils ist „nahm“ im Deutschen konkret genug und vermeidet eine unbegründet starke Vorstellung des Zupackens.
- source_word: παιδίον
  choice: Kind
  rationale: „Kind“ gibt die gewöhnliche Bedeutung präzise wieder; „kleines Kind“ würde eine zusätzliche Hervorhebung eintragen.
- source_word: ἔστησεν
  choice: stellte
  rationale: Der kausative Aorist bedeutet, jemanden zum Stehen zu bringen beziehungsweise aufzustellen. „Stellte“ erhält diese Bildlichkeit in natürlichem Deutsch.
- source_word: παρ’ ἑαυτῷ
  choice: neben sich
  rationale: Die Wendung bezeichnet einen Platz unmittelbar bei Jesus. „Neben sich“ ist im Deutschen eindeutig und nah an der griechischen reflexiven Form.
theological_decisions:
- issue: Jesu Kenntnis der inneren Überlegung
  choice: Der Text sagt, dass Jesus ihre innere Überlegung wusste, ohne die Art dieses Wissens zu erklären.
  alternative: Das Wissen ausdrücklich als göttliche Allwissenheit oder als außergewöhnliche menschliche Wahrnehmung deuten.
  rationale: Lukas benennt Jesu Wissen, aber nicht dessen Mechanismus; die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die Partizipialkonstruktion natürlich lesbar, ohne den zeitlichen und logischen Zusammenhang zu verändern. Der kollektive Singular „in ihrem Herzen“ wurde bewusst erhalten.
