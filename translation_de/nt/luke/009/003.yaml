source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Nehmt nichts mit auf den Weg: weder einen Stab noch eine Tasche[a] noch Brot noch Geld[b]. Habt auch nicht je zwei Untergewänder[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reisetasche«; gemeint ist eine Tasche, in der Reisende Proviant mitführen konnten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Silber«; hier ist Silber als Zahlungsmittel gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische »je zwei« bezeichnet zwei Untergewänder pro Person. Ein Untergewand war ein direkt am Körper getragenes Kleidungsstück, ähnlich einer Tunika.
    reason: historical_clarification
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Nehmt nichts mit auf den Weg
  rationale: Die Formulierung gibt die Reiseanweisung idiomatisch und zugleich eng am griechischen Sinn wieder.
- source_word: ῥάβδον
  choice: Wanderstab
  rationale: Im Zusammenhang einer Reise bezeichnet das Wort wahrscheinlich einen Stab, den ein Reisender mitführte; »Wanderstab« macht diese Funktion deutlich.
- source_word: πήραν
  choice: Vorratstasche
  rationale: Das Wort bezeichnet eine Tasche zum Mitführen von Reiseproviant; die Wiedergabe ist genauer als das unspezifische »Tasche«.
- source_word: ἄρτον
  choice: Brot
  rationale: Die konkrete Bedeutung des griechischen Wortes kann ohne Verallgemeinerung beibehalten werden.
- source_word: ἀργύριον
  choice: Geld
  rationale: Wörtlich bedeutet das Wort »Silber«, bezeichnet hier aber Silber als Zahlungsmittel und damit Geld.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: Auch soll keiner von euch zwei Untergewänder haben
  rationale: ἀνά mit der Zahl hat verteilende Bedeutung. »Keiner von euch« bringt das natürliche deutsche Äquivalent zu »je zwei« zum Ausdruck, während »haben« die ungewöhnliche Konstruktion des Ausgangstextes wahrt.
- source_word: χιτῶνας
  choice: Untergewänder
  rationale: Ein χιτών war ein unmittelbar am Körper getragenes Kleidungsstück. »Untergewand« bewahrt den historischen Sachbezug besser als das moderne »Hemd«.
theological_decisions:
- issue: Reichweite der Reiseanweisung
  choice: Konkrete Anweisung Jesu an die Angesprochenen, ohne erläuternde Verallgemeinerung
  alternative: Als allgemeingültiges Armutsideal formulieren
  rationale: Der Vers richtet die Imperative ausdrücklich an »sie«. Die Übersetzung fügt keine Aussage darüber hinzu, ob und wie die Weisung über diese Sendung hinaus gilt.
- issue: 'ἔχειν: besitzen oder mitführen'
  choice: haben
  alternative: mitnehmen
  rationale: Der Infinitiv lautet wörtlich »haben«. Obwohl der Reisekontext »mitführen« nahelegen kann, bleibt mit »haben« die mögliche Spannung zwischen Besitz und Reiseausstattung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert die Reiseausrüstung klar. »Wanderstab«, »Vorratstasche« und »Untergewänder« sind verständlich, bewahren aber den historischen Kontext. Sämtliche Fußnotenmarker stehen unmittelbar bei dem erläuterten Ausdruck.
