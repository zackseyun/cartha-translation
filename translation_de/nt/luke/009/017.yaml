source:
  edition: SBLGNT
  text: καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες, καὶ ἤρθη τὸ περισσεῦσαν αὐτοῖς κλασμάτων κόφινοι δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: de
  text: 'Und sie aßen alle und wurden satt. Dann wurde aufgesammelt[a], was ihnen von den Stücken[b] übrig geblieben war: zwölf Körbe voll.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wurde aufgehoben“ (ἤρθη).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bruchstücken“ (κλασμάτων).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist berichtet das Geschehen schlicht; das deutsche Präteritum ist im Erzählzusammenhang natürlich.
- source_word: ἐχορτάσθησαν
  choice: wurden satt
  rationale: Die Wendung gibt die vollständige Sättigung idiomatisch und allgemein verständlich wieder.
- source_word: πάντες
  choice: sie … alle
  rationale: Die Stellung bewahrt die Betonung, dass ausnahmslos alle aßen und satt wurden.
- source_word: ἤρθη
  choice: wurde aufgesammelt
  rationale: Das Passiv von αἴρω bezeichnet hier im Kontext das Aufnehmen beziehungsweise Einsammeln der Reste; „aufgesammelt“ ist eindeutig und natürlich.
- source_word: τὸ περισσεῦσαν
  choice: was … übrig geblieben war
  rationale: Das substantivierte Partizip wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird bei dem Übriggebliebenen belassen; so bleibt die naheliegende Beziehung zu den Essenden erhalten, ohne ihn als Handelnde des Einsammelns festzulegen.
- source_word: κλασμάτων
  choice: von den Stücken
  rationale: „Stücke“ ist im Speisungskontext klar und vermeidet den im Deutschen leicht nach Trümmern klingenden Ausdruck „Bruchstücke“.
- source_word: κόφινοι δώδεκα
  choice: zwölf Körbe voll
  rationale: Die idiomatische Mengenangabe macht deutlich, dass die aufgesammelten Reste zwölf Körbe ergaben; „voll“ ist im Deutschen für diese Konstruktion erforderlich, auch wenn das Griechische es nicht eigens ausdrückt.
theological_decisions: []
