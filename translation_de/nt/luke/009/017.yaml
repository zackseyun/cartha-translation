  terminology: „Wurden satt“ trifft ἐχορτάσθησαν idiomatisch. „Stücke“ ist für κλασμάτων im Kontext tragfähig; die Fußnote bietet mit „Bruchstücken“ die präzisere formale Alternative. Die Fußnote zu ἤρθη kennzeichnet „aufgehoben“ zutreffend als wörtlichere Alternative. Die Anker sind korrekt gesetzt und eindeutig.
