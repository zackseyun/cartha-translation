  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: Alle essen und werden satt; die übrig gebliebenen Stücke werden aufgesammelt; die Menge beträgt zwölf Körbe. Das Passiv von ἤρθη ist mit „wurde aufgesammelt“ angemessen wiedergegeben. „Ihnen“ bewahrt die im griechischen Dativ αὐτοῖς angelegte Beziehung zu den Essenden, ohne eine nicht ausdrücklich bezeichnete handelnde Person einzutragen. „Zwölf Körbe voll“ ist eine im Deutschen idiomatische Wiedergabe der abschließenden Mengenangabe κόφινοι δώδεκα.'
