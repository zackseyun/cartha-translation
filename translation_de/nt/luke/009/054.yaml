  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: de
  text: 'Als die Jünger Jakobus und Johannes das sahen, sagten sie: »Herr, willst du, dass wir befehlen[a], Feuer solle vom Himmel herabkommen und sie verzehren?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Feuer vom Himmel herabrufen und sie vernichten«. Wörtlich heißt es im Griechischen: »sagen, dass Feuer vom Himmel herabkommen und sie verzehren soll«.'
    reason: Lexikalische und syntaktische Alternative zu εἴπωμεν und ἀναλῶσαι.
lexical_decisions:
- source_word: ἰδόντες
  choice: Als ... das sahen
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. »Das« nimmt den im vorherigen Vers berichteten Vorgang auf, ohne neue Information hinzuzufügen.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier einen leichten Fortgang der Erzählung; im Deutschen wird diese Funktion bereits durch den vorangestellten temporalen Nebensatz ausreichend vermittelt.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: die Jünger Jakobus und Johannes
  rationale: Die appositionelle Formulierung bezeichnet Jakobus und Johannes ausdrücklich als die betreffenden Jünger.
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche, kontextgemäße Anrede an Jesus.
- source_word: θέλεις
  choice: willst du
  rationale: θέλω bezeichnet hier Wunsch beziehungsweise Absicht; »willst du« ist direkt, modern und natürlich.
- source_word: εἴπωμεν
  choice: dass wir befehlen
  rationale: Wörtlich steht »dass wir sagen«; zusammen mit Feuer als gedachtem Subjekt des Infinitivs hat die Äußerung jedoch Aufforderungs- beziehungsweise Befehlscharakter. »Befehlen« gibt diese Konstruktion im Deutschen verständlich wieder.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: Feuer solle vom Himmel herabkommen
  rationale: Die indirekte Aufforderung mit »solle« bildet die syntaktische Abhängigkeit von εἴπωμεν ab und bewahrt zugleich das Bild des vom Himmel herabkommenden Feuers.
- source_word: ἀναλῶσαι
  choice: verzehren
  rationale: Das Verb kann »verzehren« oder allgemeiner »vernichten« bedeuten. »Verzehren« wahrt hier den unmittelbaren Bezug zum Feuer.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannten samaritanischen Dorfbewohner.
theological_decisions:
- issue: Nicht genanntes Objekt von ἰδόντες
  choice: »das sahen« mit Rückbezug auf die Ablehnung im vorherigen Vers
  alternative: »als ... sahen« ohne Objekt oder »angesichts dessen«
  rationale: Im Griechischen steht kein ausdrückliches Objekt. Das deutsche Demonstrativpronomen macht lediglich den aus dem Zusammenhang eindeutigen Rückbezug sprachlich natürlich.
- issue: Stärke von εἴπωμεν
  choice: »dass wir befehlen«
  alternative: »dass wir sagen« oder »dass wir Feuer vom Himmel herabrufen«
  rationale: Das Grundverb ist λέγω, doch die Konstruktion bedeutet, dass durch ihr Wort das Feuer herabkommen soll. »Befehlen« macht diesen pragmatischen Sinn verständlich, während die Fußnote die ungewöhnliche wörtliche Form offenlegt.
- issue: Bedeutung von ἀναλῶσαι
  choice: »verzehren«
  alternative: »vernichten«
  rationale: Beide Bedeutungen sind lexikalisch möglich. »Verzehren« erhält die konkrete Feuerbildlichkeit und lässt die Gerichtssprache ungemildert stehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; die ungewöhnliche griechische Konstruktion wird im Haupttext natürlich wiedergegeben und in der Fußnote transparent gemacht.
