source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: de
  text: Und wenn euch irgendwo Menschen nicht aufnehmen[a], dann schüttelt beim Verlassen jener Stadt[b] den Staub von euren Füßen ab, als Zeugnis gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch nicht willkommen heißen“. Das Verb kann sowohl das Aufnehmen als auch das Willkommenheißen der Boten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jenes Dorf“. Das griechische Wort πόλις kann je nach Zusammenhang eine Stadt oder eine kleinere Ortschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: wenn Menschen euch nicht aufnehmen
  rationale: ὅσοι mit ἄν verallgemeinert und erfasst alle, die so handeln. „Aufnehmen“ bewahrt bei δέχομαι sowohl den Gedanken des Empfangens als auch den des Willkommenheißens, ohne ihn auf Gastfreundschaft zu verengen.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: beim Verlassen jener Stadt
  rationale: Das Partizip bezeichnet eine Begleithandlung zum Imperativ. „Beim Verlassen“ gibt diesen zeitlichen Bezug knapp und natürlich wieder; „jener“ bildet ἐκείνης ausdrücklich ab.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: den Staub von euren Füßen
  rationale: κονιορτός bezeichnet losen Staub; die Präpositionalgruppe benennt, woher er abgeschüttelt wird. Die Formulierung ist im Deutschen klar und bildhaft.
- source_word: ἀποτινάσσετε
  choice: schüttelt … ab
  rationale: Der Imperativ fordert die bewusste, symbolische Entfernung des Staubes. Das trennbare Verb „abschütteln“ entspricht dem körperlichen Vorgang idiomatisch.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: als Zeugnis gegen sie
  rationale: „Als Zeugnis“ wahrt die Zweck- beziehungsweise Ergebnisnuance von εἰς μαρτύριον; „gegen sie“ gibt im Zusammenhang den adversativen, warnenden Charakter von ἐπ’ αὐτούς wieder.
theological_decisions:
- issue: Bedeutung des symbolischen Abschüttelns des Staubes
  choice: als Zeugnis gegen sie
  alternative: als Zeichen für sie; als ausdrückliche Verkündigung ihrer endgültigen Verurteilung
  rationale: Die Wendung trägt eine ernste, gegen die Ablehnenden gerichtete Zeugnis- und Warnfunktion. Der Vers selbst erklärt die Handlung jedoch nicht ausdrücklich zu einem Urteil über ihr endgültiges Geschick; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschen“ macht den allgemeinen Personenbezug von ὅσοι natürlich sichtbar; „jener Stadt“ wahrt die Distanzmarkierung des griechischen Demonstrativs. Der Satz bleibt als direkte Anweisung formuliert.
