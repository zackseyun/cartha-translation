source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: de
  text: 'Als sie unterwegs waren, sagte jemand zu ihm: »Ich werde dir folgen, wohin du auch gehst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένων αὐτῶν ἐν τῇ ὁδῷ
  choice: Als sie unterwegs waren
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Bewegung. »Unterwegs« gibt ἐν τῇ ὁδῷ natürlich wieder und bewahrt zugleich das konkrete Reisemotiv.
- source_word: εἶπέν τις πρὸς αὐτόν
  choice: sagte jemand zu ihm
  rationale: τις ist unbestimmt und nennt weder Geschlecht noch nähere Identität; die deutsche Wortfolge ist natürlich und quellennah.
- source_word: Ἀκολουθήσω σοι
  choice: Ich werde dir folgen
  rationale: Das Futur drückt eine erklärte Absicht oder Selbstverpflichtung aus. »folgen« bewahrt sowohl die räumliche als auch die im Kontext mitschwingende Bedeutung der Nachfolge.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: wohin du auch gehst
  rationale: ὅπου mit ἐάν und Konjunktiv hat einen unbestimmten verallgemeinernden Sinn. »wohin du auch gehst« bildet diesen im Deutschen idiomatisch ab; ἀπέρχομαι kann zwar »weggehen« bedeuten, doch hier genügt »gehen« ohne Bedeutungsverlust.
theological_decisions:
- issue: Nachfolgebedeutung von ἀκολουθέω
  choice: Wörtlich und offen als »folgen« wiedergegeben
  alternative: »dein Jünger werden«
  rationale: »folgen« wahrt zugleich die konkrete Bewegung und den theologischen Nachfolgeklang, ohne die Aussage durch eine erklärende Paraphrase festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede verwendet deutsche Anführungszeichen; keine geschlechtliche Festlegung der unbestimmten Person.
