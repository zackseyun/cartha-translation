source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: de
  text: Denn was nützt es einem Menschen, wenn er die ganze Welt gewinnt, sich selbst aber verliert oder einbüßt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Denn was nützt es
  rationale: Die rhetorische Frage und die begründende Funktion von γάρ werden in natürlichem Deutsch bewahrt; „nützen“ gibt ὠφελεῖται präzise wieder.
- source_word: ἄνθρωπος
  choice: einem Menschen
  rationale: ἄνθρωπος bezeichnet hier einen Menschen allgemein. Die deutsche Formulierung ist generisch, quellennah und idiomatisch.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: wenn er die ganze Welt gewinnt
  rationale: Der konditionale Nebensatz gibt den hypothetischen Sinn des Aoristpartizips verständlich wieder; „die ganze Welt“ entspricht der Wortfolge und Reichweite des Griechischen.
- source_word: ἑαυτόν
  choice: sich selbst
  rationale: Das reflexive Pronomen bezeichnet die eigene Person; die Wiedergabe vermeidet eine unbegründete Verengung auf „Seele“ oder „Leben“.
- source_word: ἀπολέσας
  choice: verliert
  rationale: „Verliert“ bildet den hier gemeinten Verlust der eigenen Person knapp und im Kontrast zu „gewinnt“ ab.
- source_word: ἢ ζημιωθείς
  choice: oder Schaden nimmt
  rationale: Das Passivpartizip bezeichnet das Erleiden von Verlust oder Schaden. „Schaden nimmt“ bewahrt gegenüber „verliert“ eine eigene Nuance, ohne den Sinn unnötig festzulegen.
theological_decisions:
- issue: Bedeutung von ἑαυτόν im Blick auf das menschliche Geschick
  choice: sich selbst
  alternative: sein Leben; seine Seele
  rationale: Der griechische Text verwendet das Reflexivpronomen und nicht ψυχή. „Sich selbst“ bewahrt daher die umfassende anthropologische Aussage und vermeidet eine Festlegung auf die leibliche Lebensdauer oder eine immaterielle Seele.
- issue: Verhältnis von ἀπολέσας und ζημιωθείς
  choice: verliert oder Schaden nimmt
  alternative: zugrunde richtet oder einbüßt
  rationale: Das disjunktive ἢ wird beibehalten, und beide Partizipien bleiben unterscheidbar. Die Formulierung legt nicht fest, ob zwei verschiedene Endzustände oder zwei Beschreibungen desselben Verlusts gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt der rhetorischen Zuspitzung des griechischen Textes nahe, ohne unnatürliche Partizipialkonstruktionen. Keine Fußnote ist nötig, weil „sich selbst“ die Lexik unmittelbar und klar wiedergibt.
