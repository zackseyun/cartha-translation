  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: de
  text: Doch Jesus wies sie scharf zurecht und befahl ihnen, dies niemandem zu sagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Jesus warnte sie eindringlich und befahl ihnen, dies niemandem zu sagen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: δὲ markiert hier den Kontrast zwischen dem Bekenntnis des Petrus und Jesu anschließender Reaktion; „Doch“ gibt diesen Übergang knapp und natürlich wieder.
- source_word: ἐπιτιμήσας
  choice: wies sie scharf zurecht
  rationale: Das Partizip von ἐπιτιμάω bezeichnet ein nachdrückliches Zurechtweisen oder strenges Warnen. „wies sie scharf zurecht“ bewahrt die verbale Schärfe, ohne die Wendung unnatürlich klingen zu lassen.
- source_word: παρήγγειλεν
  choice: befahl ihnen
  rationale: παραγγέλλω bezeichnet eine autoritative Anweisung. „befahl“ gibt deren Verbindlichkeit im heutigen Deutsch deutlich wieder; das indirekte Objekt wird aus αὐτοῖς natürlich ergänzt.
- source_word: μηδενὶ
  choice: niemandem
  rationale: Der Dativ von μηδείς bezeichnet hier den Adressaten des Sagens; „niemandem“ entspricht der griechischen Konstruktion unmittelbar.
- source_word: λέγειν
  choice: zu sagen
  rationale: λέγειν steht mit μηδενὶ und τοῦτο. „dies niemandem zu sagen“ ist idiomatisches Deutsch und bleibt näher an der gewöhnlichen Bedeutung von λέγω als eine stärker deutende Wiedergabe.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf das unmittelbar vorausgehende Bekenntnis, ohne seinen Inhalt im Vers nochmals auszudeuten.
theological_decisions:
- issue: Stärke des Verbots nach dem Bekenntnis des Petrus
  choice: Ein nachdrückliches Zurechtweisen, verbunden mit einem verbindlichen Verbot der Weitergabe
  alternative: Eine strenge Warnung, dies niemandem zu sagen
  rationale: Die Verbindung von ἐπιτιμήσας und παρήγγειλεν zeigt mehr als eine beiläufige Bitte. Die Übersetzung erhält die Spannung der Erzählung, ohne einen Grund für das Schweigegebot in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweifache Nachdrücklichkeit der griechischen Verben bleibt erkennbar; die Satzstellung ist für heutige Leser natürlich.
