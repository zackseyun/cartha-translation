id: LUK.9.9
reference: Luke 9:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: de
  text: 'Herodes aber sagte: „Johannes habe ich enthauptet. Doch wer ist dieser, von dem ich solche Dinge höre?“ Und er versuchte immer wieder, ihn zu sehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er bemühte sich fortwährend, ihn zu sehen.“ Das griechische Imperfekt kann eine andauernde oder wiederholte Handlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber / doch
  rationale: Das erste δέ führt Herodes’ Reaktion mit einem leichten Gegensatz zum vorherigen Bericht ein; das zweite markiert den Gegensatz zwischen dem von Herodes enthaupteten Johannes und der ihm unbekannten Person.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: Johannes habe ich enthauptet
  rationale: Die Voranstellung von „Johannes“ und das ausdrücklich gesetzte ἐγώ werden durch die markierte deutsche Wortstellung bewahrt. ἀποκεφαλίζω bezeichnet ausdrücklich das Enthaupten.
- source_word: τίς δέ ἐστιν οὗτος
  choice: Doch wer ist dieser
  rationale: Die direkte Frage und der distanzierende Demonstrativausdruck οὗτος bleiben erhalten, ohne „Mann“ ergänzend einzufügen.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: von dem ich solche Dinge höre
  rationale: Die Formulierung bewahrt die inhaltliche Offenheit von τοιαῦτα; „Berichte“ wäre bereits eine konkretisierende Deutung.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: er versuchte immer wieder, ihn zu sehen
  rationale: ζητέω mit dem Infinitiv bezeichnet hier das Bemühen, etwas zu erreichen. Das Imperfekt wird als fortdauernder oder wiederholter Versuch ausgedrückt; ἰδεῖν bleibt direkt mit „sehen“ wiedergegeben.
theological_decisions:
- issue: Herodes’ Frage nach der Identität Jesu
  choice: Die Aussage über Johannes und die Frage nach dem unbekannten Jesus werden ohne zusätzliche Erklärung wiedergegeben.
  alternative: Ausdrücklich ergänzen, Herodes habe befürchtet oder vermutet, Johannes sei auferstanden.
  rationale: Der unmittelbare Kontext berichtet zwar von Herodes’ Ratlosigkeit, doch dieser Vers selbst nennt weder Furcht noch eine eigene Auferstehungsvermutung. Die Übersetzung wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die betonte Wortstellung „Johannes habe ich enthauptet“ bildet die Hervorhebung im Griechischen natürlich ab. Die direkte Rede bleibt knapp und spannungsvoll.
