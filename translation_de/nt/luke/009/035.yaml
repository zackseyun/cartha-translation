  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: de
  text: 'Und eine Stimme kam aus der Wolke und sagte: »Dieser ist mein Sohn, der Erwählte[a]. Hört auf ihn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »mein geliebter Sohn« statt »mein Sohn, der Erwählte«.
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Da kam eine Stimme
  rationale: Die ereignishafte Wendung wird in natürlichem deutschem Erzählstil wiedergegeben; ein wörtliches »eine Stimme entstand« wäre unidiomatisch.
- source_word: ἐκ τῆς νεφέλης
  choice: aus der Wolke
  rationale: ἐκ bezeichnet hier den Ursprung der Stimme. »Aus der Wolke« ist im Deutschen natürlich und präzise.
- source_word: λέγουσα
  choice: die sagte
  rationale: Das Partizip führt den Inhalt der Stimme ein. Ein Relativsatz klingt im modernen Deutschen natürlicher als »sagend«.
- source_word: Οὗτός ἐστιν
  choice: Dieser ist
  rationale: »Dieser ist« bewahrt die hervorhebende, identifizierende Kraft des Demonstrativpronomens und passt zum feierlichen Ausspruch.
- source_word: ὁ υἱός μου
  choice: mein Sohn
  rationale: Die Verbindung aus Artikel, Substantiv und Possessivpronomen wird direkt und idiomatisch wiedergegeben.
- source_word: ὁ ἐκλελεγμένος
  choice: der Erwählte
  rationale: Das perfektisch-passive Partizip von ἐκλέγομαι bezeichnet denjenigen, der erwählt worden ist. »Der Erwählte« erhält den Titelcharakter und fügt kein zweites, im Griechischen nicht ausdrücklich stehendes Possessivpronomen hinzu.
- source_word: αὐτοῦ ἀκούετε
  choice: auf ihn sollt ihr hören
  rationale: Die vorangestellte Genitivform αὐτοῦ wird durch »auf ihn« hervorgehoben. Die Wendung bezeichnet nicht bloß akustisches Hören, sondern aufmerksames und folgebereites Hören; »sollt ihr« gibt den imperativischen Anspruch natürlich wieder.
theological_decisions:
- issue: Christologische Bezeichnung in der Himmelsstimme
  choice: ἐκλελεγμένος als »der Erwählte«
  alternative: ἀγαπητός als »der geliebte Sohn«
  rationale: Der Haupttext folgt dem vorgegebenen SBLGNT-Wortlaut und harmonisiert Lukas nicht mit der vertrauteren Lesart der synoptischen Parallelen. Sohnschaft und Erwählung bleiben als zwei eng verbundene Aussagen erhalten.
- issue: Possessivbezug bei ὁ ἐκλελεγμένος
  choice: »der Erwählte« ohne ergänztes »mein«
  alternative: »mein Erwählter«
  rationale: Der griechische Ausdruck besitzt an dieser Stelle kein eigenes Possessivpronomen. Die Apposition bezieht sich zwar auf »mein Sohn«, doch die Übersetzung vermeidet eine unnötige ausdrückliche Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Dieser ist« und »der Erwählte« bewahren den feierlichen Ton; »auf ihn sollt ihr hören« ist verständlich und bringt sowohl Hervorhebung als auch Aufforderungscharakter zum Ausdruck.
