id: LUK.9.48
reference: Luke 9:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Wer dieses Kind in meinem Namen[b] aufnimmt[a], nimmt mich auf; und wer mich aufnimmt, nimmt den auf, der mich gesandt hat. Denn wer unter euch allen der Geringste ist – der ist groß.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mehrfach mit „aufnehmen“ wiedergegebene griechische Verb kann auch „willkommen heißen“ oder „annehmen“ bedeuten und sowohl Annahme als auch Gastfreundschaft ausdrücken.
    reason: lexical_alternative
  - marker: b
    text: „In meinem Namen“ kann auch „aufgrund meines Namens“ oder „um meines Namens willen“ bedeuten; gemeint ist eine Aufnahme in Beziehung zu Jesus, seiner Vollmacht oder der Zugehörigkeit zu ihm.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: aufnimmt
  rationale: δέχομαι kann sowohl das Annehmen als auch das gastliche Willkommenheißen bezeichnen. „Aufnehmen“ bewahrt diese Bedeutungsbreite und zugleich die dreifache verbale Verknüpfung des Satzes.
- source_word: παιδίον
  choice: Kind
  rationale: „Kind“ gibt den gewöhnlichen Sinn von παιδίον klar wieder; eine ausdrückliche Wiedergabe als „kleines Kind“ ist lexikalisch nicht erforderlich.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die Wendung bezeichnet eine Aufnahme in Beziehung zu Jesu Namen, Vollmacht oder Zugehörigkeit. „In meinem Namen“ wahrt diese Breite, ohne sich auf nur eine Deutung festzulegen.
- source_word: τὸν ἀποστείλαντά με
  choice: den, der mich gesandt hat
  rationale: Das substantivierte Partizip wird als natürliche deutsche Relativkonstruktion wiedergegeben, ohne den im Griechischen nicht ausdrücklich genannten Vater oder Gott ergänzend einzusetzen.
- source_word: μικρότερος
  choice: der Geringste
  rationale: Der Komparativ bezeichnet hier am ehesten niedrigen Rang oder geringe soziale Geltung, nicht körperliche Größe oder zwingend das Lebensalter. Das Deutsche verwendet in dieser Gruppenrelation idiomatisch den Superlativ.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: unter euch allen
  rationale: Die Formulierung bezeichnet die Stellung innerhalb der gesamten angesprochenen Gruppe und wird im Deutschen idiomatisch mit „unter euch allen“ ausgedrückt.
- source_word: ὑπάρχων
  choice: ist
  rationale: Das Partizip wird zusammen mit μικρότερος als prädikative Aussage natürlich ins Deutsche übertragen.
- source_word: οὗτός ἐστιν μέγας
  choice: der ist groß
  rationale: Das wiederaufnehmende „der“ und der Gedankenstrich erhalten die demonstrative Hervorhebung von οὗτος, ohne eine schwerfällige Formulierung wie „dieser ist groß“ zu erzwingen.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Wer ... und wer
  rationale: Die unbestimmten Relativsätze mit ἄν formulieren eine allgemeingültige Bedingung; „Wer ...“ ist dafür die knappe, natürliche deutsche Entsprechung.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Und er sagte zu ihnen
  rationale: „Und“ bildet das einleitende καί ab, ohne eine zusätzliche zeitliche Folgerung wie „darauf“ einzutragen.
theological_decisions:
- issue: Bezug von „der mich gesandt hat“
  choice: Der implizite Bezug auf den Vater beziehungsweise Gott bleibt erhalten, ohne ihn im Haupttext ausdrücklich zu benennen.
  alternative: „den Vater, der mich gesandt hat“ oder „Gott, der mich gesandt hat“
  rationale: Der griechische Text verwendet ein substantiviertes Partizip und nennt den Sendenden hier nicht ausdrücklich. Die Übersetzung bewahrt Jesu Sendungsanspruch, ohne den Wortlaut erläuternd zu erweitern.
- issue: Bedeutung der Aufnahme eines Kindes „in meinem Namen“
  choice: Die Aufnahme geschieht in Beziehung zu Jesu Namen, Vollmacht und Repräsentation.
  alternative: „weil es zu mir gehört“ oder „um meinetwillen“
  rationale: Die knappe Wendung besitzt mehrere miteinander verbundene Nuancen. „In meinem Namen“ hält diese theologische Bedeutungsbreite offen und reduziert die Aussage nicht auf allgemeine Freundlichkeit.
- issue: Paradox der Größe
  choice: Jesu Umkehrung gesellschaftlicher Rangmaßstäbe bleibt als Gegenüberstellung des Geringsten und des Großen stehen.
  alternative: „der Jüngste unter euch allen ist groß“
  rationale: μικρότερος zielt im Kontext eher auf Rang und Geltung als ausschließlich auf Alter. Die Übersetzung bewahrt die Spannung, ohne sie zu einer späteren Lehrformel auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „aufnehmen“ bildet die rhetorische Kette des griechischen Textes ab. Der Gedankenstrich hebt die pointierte Umkehrung am Versende hervor; die Formulierung bleibt zugleich gut vorlesbar.
