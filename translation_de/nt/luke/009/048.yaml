  naturalness: Modernes, gut vorlesbares Standarddeutsch. Die Wiederholung von „aufnimmt“ ist stilistisch vertretbar und für die im Ausgangstext beabsichtigte rhetorische Verknüpfung sinnvoll. Der Gedankenstrich vor der abschließenden Pointe funktioniert natürlich.
