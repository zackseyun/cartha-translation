id: LUK.9.46
reference: Luke 9:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: de
  text: Da kam unter ihnen die Überlegung auf[a], wer von ihnen wohl der Größte sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Da entstand unter ihnen eine Diskussion; auch: ein Streit.'
    reason: Das griechische Wort kann sowohl einen inneren Gedankengang als auch eine Erörterung oder Auseinandersetzung bezeichnen.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: kam … auf
  rationale: Das Verb bedeutet wörtlich „trat ein“, bildet hier mit διαλογισμός jedoch eine Wendung, die im Deutschen natürlich mit „kam … auf“ wiedergegeben wird.
- source_word: δὲ
  choice: Da
  rationale: Der schwache erzählerische Anschluss führt das nächste Geschehen ein; „Da“ ist im Deutschen flüssig, ohne eine stärkere zeitliche Abfolge zu behaupten.
- source_word: διαλογισμὸς
  choice: Überlegung
  rationale: Das Wort kann einen inneren Gedankengang, eine Erörterung oder einen Streit bezeichnen. „Überlegung“ nimmt den Singular ernst und lässt angesichts von Vers 47 die innere Dimension offen, ohne einen ausdrücklich ausgetragenen Streit vorauszusetzen.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Die wörtliche Fassung „in ihnen“ könnte auf innere Gedanken jedes Einzelnen weisen, klingt im Deutschen hier jedoch unnatürlich. „Unter ihnen“ bezeichnet die Gruppe und lässt offen, ob die Überlegung ausgesprochen wurde.
- source_word: τὸ τίς ἂν εἴη
  choice: wer … wohl … sei
  rationale: Die substantivierte indirekte Frage gibt den Inhalt der Überlegung an. „wohl“ bewahrt die mögliche beziehungsweise erwägende Nuance von ἄν mit dem Optativ; der Konjunktiv „sei“ entspricht der indirekten Rede.
- source_word: μείζων
  choice: der Größte
  rationale: Der griechische Komparativ lautet formal „größer“, bezeichnet in einer begrenzten Gruppe idiomatisch jedoch den höchsten Rang. Im Deutschen ist dafür der Superlativ natürlich.
- source_word: αὐτῶν
  choice: von ihnen
  rationale: Der Genitiv bezeichnet die Vergleichsgruppe und wird direkt sowie idiomatisch mit „von ihnen“ wiedergegeben.
theological_decisions:
- issue: Art des Geschehens unter den Jüngern
  choice: Überlegung
  alternative: Streit oder Auseinandersetzung
  rationale: Der griechische Ausdruck kann inneres Nachdenken wie auch eine zwischenmenschliche Erörterung bezeichnen. Der folgende Vers spricht vom Gedanken ihres Herzens; deshalb sollte die Übersetzung nicht ohne Not einen offen ausgetragenen Streit festlegen. Die Fußnote bewahrt die andere mögliche Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „wer von ihnen wohl der Größte sei“ ist allgemein verständlich und bewahrt zugleich die Potentialität der griechischen Konstruktion. Die Hauptfassung hält die im Kontext erkennbare Spannung zwischen innerer Überlegung und offenem Gespräch bewusst offen.
