  source_fidelity: Die Hauptfassung gibt die Konstruktion εἰσῆλθεν ... διαλογισμός ἐν αὐτοῖς idiomatisch und ohne unzulässige Festlegung wieder. „Überlegung“ bewahrt die mögliche innere bzw. erwägende Dimension von διαλογισμός; „unter ihnen“ ist als natürliche deutsche Wiedergabe von ἐν αὐτοῖς vertretbar. „wer von ihnen wohl der Größte sei“ gibt die Inhaltsfrage einschließlich der potentialen Nuance von ἂν mit Optativ angemessen wieder. Der deutsche Superlativ ist für den griechischen Komparativ im Vergleich innerhalb der Gruppe idiomatisch.
  naturalness: „Da kam unter ihnen die Überlegung auf“ ist verständliches, würdiges modernes Standarddeutsch. Die Wortstellung und der Konjunktiv in der indirekten Frage sind natürlich. Die Fußnote bietet die stärker dialogische bzw. konfliktbezogene Lesart in gut verständlicher Form.
  terminology: „der Größte“ trifft die Rangfrage μείζων in diesem begrenzten Personenkreis. Es werden keine konfessionell geprägten oder überinterpretierenden Begriffe eingeführt. Die Alternative „Diskussion“ bzw. „Streit“ entspricht dem möglichen Bedeutungsspektrum von διαλογισμός und bleibt korrekt als Fußnotenoption markiert.
