  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: de
  text: Während er betete, veränderte sich das Aussehen seines Gesichts, und seine Kleidung wurde weiß und blitzte wie ein Blitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seine Kleidung wurde strahlend weiß“; das griechische Wort lässt an blitzartiges Aufleuchten denken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Während er betete
  rationale: Die lukanische Konstruktion bezeichnet ein Geschehen während einer Handlung. Die deutsche Wiedergabe bewahrt den zeitlichen Sinn natürlich, ohne das formelhafte ἐγένετο mit einem schwerfälligen „es geschah“ wiederzugeben.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον
  choice: veränderte sich das Aussehen seines Gesichts
  rationale: εἶδος bezeichnet hier die sichtbare Erscheinung, und ἕτερον bedeutet „anders/verschieden“. Die Formulierung gibt den sichtbaren Wandel wieder, ohne aus den synoptischen Parallelen ein Leuchten des Gesichts einzutragen.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: seine Kleidung
  rationale: ἱματισμός bezeichnet Kleidung oder Gewänder. „Kleidung“ ist im modernen Standarddeutsch natürlich und zugleich würdig.
- source_word: λευκὸς
  choice: weiß
  rationale: λευκός bedeutet unmittelbar „weiß“; die besondere Helligkeit und Dynamik wird durch das folgende Partizip ausgedrückt.
- source_word: ἐξαστράπτων
  choice: blitzte wie ein Blitz
  rationale: Das Partizip ruft ausdrücklich das Bild blitzartigen Aufleuchtens hervor. Die Wiedergabe bewahrt dieses lebendige Bild deutlicher als das allgemeinere „strahlte“ oder „glänzte“.
theological_decisions:
- issue: Beschreibung der Verklärung Jesu
  choice: Lukas’ zurückhaltende Beschreibung als sichtbare Veränderung des Gesichtsaussehens wiedergeben
  alternative: Sein Gesicht leuchtete / wurde verwandelt
  rationale: Der Text beschreibt eine wirkliche sichtbare Veränderung, sagt aber nicht ausdrücklich, dass das Gesicht leuchtete. Daher wird nicht mit Formulierungen aus den synoptischen Parallelberichten harmonisiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt flüssig; die auffällige Blitzmetaphorik des griechischen Partizips wird bewahrt.
