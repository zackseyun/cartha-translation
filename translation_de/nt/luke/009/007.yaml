  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: de
  text: Herodes, der Tetrarch, hörte von allem, was geschah, und war ratlos, weil einige sagten, Johannes sei von den Toten auferweckt worden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Johannes sei von den Toten auferstanden.“ Das griechische Verb steht im Passiv, wörtlich: „sei auferweckt worden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: hörte von
  rationale: Mit dem Gegenstand „allem, was geschah“ gibt „hörte von“ natürlich wieder, dass Herodes Berichte über die Ereignisse erhielt.
- source_word: δὲ
  choice: und
  rationale: δέ führt die Erzählung hier als schwache Verbindung weiter, ohne einen deutlichen Gegensatz auszudrücken.
- source_word: ὁ τετραάρχης
  choice: der Tetrarch
  rationale: Der historische Amtstitel bleibt präzise erhalten und wird nicht verallgemeinernd mit „König“ oder „Herrscher“ wiedergegeben.
- source_word: τὰ γινόμενα πάντα
  choice: von allem, was geschah
  rationale: Die Formulierung ist idiomatisches modernes Deutsch und bezeichnet umfassend die damaligen Ereignisse.
- source_word: διηπόρει
  choice: war ratlos
  rationale: διαπορέω bezeichnet anhaltende Unsicherheit beziehungsweise Ratlosigkeit; „war ratlos“ ist klar und natürlich.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: weil einige sagten
  rationale: Die kausale Bedeutung der Konstruktion und die unbestimmte Personengruppe werden bewahrt; die aktive deutsche Form ist natürlicher als eine schwerfällige Passivkonstruktion.
- source_word: ἠγέρθη
  choice: sei … auferweckt worden
  rationale: Das Passiv des griechischen Verbs wird im deutschen Konjunktiv der indirekten Rede ausdrücklich bewahrt.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die geläufige und sachlich genaue deutsche Wendung für die Auferweckung aus dem Bereich der Toten.
theological_decisions:
- issue: Auferstehungsformulierung im Bericht über Johannes
  choice: Johannes sei von den Toten auferweckt worden
  alternative: Johannes sei von den Toten auferstanden
  rationale: Die Hauptfassung bewahrt das grammatische Passiv ἠγέρθη und lässt offen, wer als Handelnder vorausgesetzt ist; die idiomatische aktive Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Der historische Titel „Tetrarch“ bleibt zur politischen Präzision erhalten; die indirekte Rede wird idiomatisch mit dem Konjunktiv wiedergegeben.
