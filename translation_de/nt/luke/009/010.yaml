id: LUK.9.10
reference: Luke 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: de
  text: Als die Apostel zurückkehrten, berichteten sie ihm alles, was sie getan hatten. Da nahm er sie mit und zog sich mit ihnen allein[a] in eine Stadt namens Betsaida zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abseits« oder »für sich«. Gemeint ist der Rückzug von der Öffentlichkeit, nicht, dass Jesus völlig allein war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: als … zurückkehrten
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben.
- source_word: οἱ ἀπόστολοι
  choice: die Apostel
  rationale: In diesem lukanischen Missionszusammenhang ist dies die etablierte Bezeichnung für die ausgesandten Zwölf.
- source_word: διηγήσαντο
  choice: berichteten
  rationale: Das Verb bezeichnet ein erzählendes Darlegen oder Berichten und passt zur Rückkehr vom Missionsauftrag.
- source_word: ὅσα ἐποίησαν
  choice: alles, was sie getan hatten
  rationale: ὅσα umfasst die Gesamtheit ihrer vorausgegangenen Taten; das Plusquamperfekt wahrt die zeitliche Abfolge.
- source_word: παραλαβὼν αὐτούς
  choice: da nahm er sie mit
  rationale: παραλαμβάνω bezeichnet hier, dass Jesus die Apostel als Begleiter mitnahm.
- source_word: ὑπεχώρησεν
  choice: zog sich … zurück
  rationale: Die Formulierung bewahrt den Gedanken des Rückzugs aus der Öffentlichkeit besser als ein neutrales »ging weg«.
- source_word: κατ’ ἰδίαν
  choice: mit ihnen allein
  rationale: Die Wendung meint ein abgesondertes, nicht öffentliches Beisammensein. Da die Apostel ausdrücklich mitgenommen werden, darf die Übersetzung nicht nahelegen, Jesus sei ohne Begleitung gewesen.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: in eine Stadt namens Betsaida
  rationale: πόλις wird formal als »Stadt« wiedergegeben; καλουμένην entspricht idiomatisch »namens«.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
theological_decisions:
- issue: Bedeutung von κατ’ ἰδίαν trotz der Begleitung durch die Apostel
  choice: mit ihnen allein
  alternative: für sich; im Stillen; abseits
  rationale: Der Kontext schließt absolute Einsamkeit Jesu aus. Gemeint ist die Absonderung Jesu und der Apostel von der Öffentlichkeit beziehungsweise der Menge; die Übersetzung erhält diese Spannung, ohne einen Widerspruch zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung mit »Da« gibt das zweite καί natürlich wieder. »Mit ihnen allein« verhindert das im Deutschen naheliegende Missverständnis, Jesus habe sich ohne die Apostel zurückgezogen.
