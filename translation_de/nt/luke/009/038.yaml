base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: de
  text: 'Und siehe, ein Mann aus der Menge rief laut: »Lehrer, ich flehe dich an, sieh meinen Sohn an, denn er ist mein einziges Kind.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein einziger Sohn«. Das griechische Wort bezeichnet hier den Einzigen beziehungsweise das einzige Kind; da zuvor bereits »Sohn« steht, sind beide Wiedergaben möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion des griechischen Erzählmarkers in einer heutigen, würdigen Form.
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: ein Mann aus der Menge
  rationale: Gibt Geschlecht und Zugehörigkeit zur versammelten Menge unmittelbar wieder.
- source_word: ἐβόησεν λέγων
  choice: rief laut
  rationale: Vermittelt die laute, dringliche Äußerung natürlich; das im Deutschen überflüssige »sagend« wird nicht eigens abgebildet.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Entspricht der Grundbedeutung der Anrede, ohne die zusätzliche Herrschaftsnuance von »Meister« einzutragen.
- source_word: δέομαί σου
  choice: ich flehe dich an
  rationale: Bringt den eindringlichen und verzweifelten Charakter der Bitte zum Ausdruck.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: kümmere dich um
  rationale: Die Wendung bezeichnet hier nicht nur ein visuelles Hinsehen, sondern bittet um aufmerksame, helfende Zuwendung.
- source_word: τὸν υἱόν μου
  choice: meinen Sohn
  rationale: Direkte und natürliche Wiedergabe.
- source_word: μονογενής μοί ἐστιν
  choice: er ist mein einziges Kind
  rationale: μονογενής bezeichnet hier den einzigen Nachkommen; der Kontext hat bereits klargestellt, dass es sich um einen Sohn handelt. Die mögliche Wiedergabe »mein einziger Sohn« bleibt in der Fußnote erhalten.
