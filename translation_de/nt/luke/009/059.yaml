  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Textes wieder: die Ansprache an „einen anderen“, den Imperativ „Folge mir“, die respektvolle Anrede „Herr“ sowie die Bitte, zunächst fortzugehen und den Vater zu begraben. „Zuerst wegzugehen“ bildet die durch ἀπελθόντι πρῶτον ausgedrückte Vorordnung angemessen ab, ohne die unklare konkrete Situation des Vaters auszudeuten.'
