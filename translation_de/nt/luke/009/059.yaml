id: LUK.9.59
reference: Luke 9:59
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: de
  text: 'Zu einem anderen sagte er: »Folge mir!« Der aber sagte: »Herr, erlaube mir, zuerst wegzugehen und meinen Vater zu begraben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: einem anderen
  rationale: ἕτερος bezeichnet hier eine weitere, von den zuvor genannten Personen unterschiedene Person; »einem anderen« ist im Deutschen natürlich und bleibt unbestimmt.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Der präsentische Imperativ wird idiomatisch als unmittelbarer Ruf in die Nachfolge wiedergegeben, ohne durch »folge mir weiterhin« einen bereits begonnenen Vorgang vorauszusetzen.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« bewahrt sowohl die respektvolle Anrede als auch die mögliche christologische Bedeutung des Titels.
- source_word: ἐπίτρεψόν μοι
  choice: erlaube mir
  rationale: Die Wendung bittet ausdrücklich um Erlaubnis; »erlaube mir« ist präzise, natürlich und dem respektvollen Ton angemessen.
- source_word: ἀπελθόντι πρῶτον
  choice: zuerst wegzugehen
  rationale: Das Partizip von ἀπέρχομαι zusammen mit πρῶτον bezeichnet das vorherige Weggehen. Die Formulierung bewahrt diese Abfolge, ohne zusätzliche Umstände einzutragen.
- source_word: θάψαι τὸν πατέρα μου
  choice: meinen Vater zu begraben
  rationale: Die direkte Wiedergabe entspricht der einfachen Aussage des griechischen Textes und legt nicht fest, ob der Vater bereits gestorben war oder ob eine weiter gefasste familiäre Verpflichtung gemeint ist.
theological_decisions:
- issue: Bedeutung von κύριος in der Anrede Jesu
  choice: Herr
  alternative: Meister; mein Herr
  rationale: »Herr« hält die Spannung zwischen höflich-respektvoller Anrede und theologisch gewichtigem Titel offen, statt sich auf nur eine Bedeutung festzulegen.
- issue: Situation des Vaters
  choice: Keine nähere Erklärung im Haupttext
  alternative: Den Vater als bereits verstorben oder die Aussage als Bitte um einen längeren Aufschub deuten
  rationale: Der Vers selbst sagt nicht ausdrücklich, ob der Vater bereits gestorben ist. Die Übersetzung bewahrt diese echte kontextuelle Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung »Zu einem anderen sagte er« vermeidet ein im Deutschen unnötig schweres »Dann«. »Wegzugehen« bildet ἀπέρχομαι ab und erhält den Gedanken, dass der Angesprochene zunächst fortgehen möchte.
