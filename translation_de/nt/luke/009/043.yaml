  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: de
  text: 'Alle waren außer sich vor Staunen über die Größe Gottes.[a] Doch während alle über alles staunten, was er tat, sagte er zu seinen Jüngern:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Majestät Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: waren außer sich vor Staunen
  rationale: Das Imperfekt bezeichnet die anhaltende, starke Bestürzung bzw. überwältigende Verwunderung aller. Die Formulierung gibt die stärkere Wirkung des Verbs wieder und unterscheidet es von θαυμάζω im folgenden Satzteil.
- source_word: πάντες
  choice: Alle
  rationale: Bewahrt die ausdrückliche Universalität der Reaktion.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: über die Größe Gottes
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass bzw. Gegenstand des Staunens. „Größe“ gibt μεγαλειότης verständlich und würdig wieder; „Majestät“ bleibt eine mögliche Alternative.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Doch während alle … staunten
  rationale: Der Genitivus absolutus wird als gleichzeitiger temporaler Nebensatz wiedergegeben. „staunten“ ist bewusst schwächer als die Wiedergabe von ἐξεπλήσσοντο.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: über alles …, was er tat
  rationale: Die Wendung bezeichnet den Gegenstand ihres Staunens. Das deutsche Präteritum ist im Erzählzusammenhang natürlich und kann den fortlaufenden Charakter des griechischen Imperfekts einschließen.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sagte er zu seinen Jüngern
  rationale: Natürliche und genaue Wiedergabe der narrativen Redeeinleitung und des possessiven Ausdrucks.
theological_decisions:
- issue: Bezug von „er“ in οἷς ἐποίει und als Subjekt von εἶπεν
  choice: „er“ bezieht sich auf Jesus
  alternative: Die vorherige Wendung „Größe Gottes“ könnte die göttliche Wirksamkeit besonders in den Vordergrund rücken.
  rationale: Jesus ist im unmittelbaren Erzählzusammenhang der Handelnde und Sprechende. Zugleich führt Lukas das offenbarte Wirken auf die Größe Gottes zurück; die Übersetzung erhält diese Spannung, ohne Gott und Jesus gleichzusetzen oder voneinander zu trennen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „alle“ und der Unterschied zwischen starkem Außer-sich-Sein und anschließendem Staunen bleiben erhalten.
