  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: de
  text: Während er dies sagte, erschien eine Wolke[b] und überschattete sie[a]. Als sie in die Wolke hineingingen, fürchteten sie sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begann, sie zu überschatten“. Die griechische Verbform kann den einsetzenden oder sich entfaltenden Vorgang hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Die Wolke erinnert wahrscheinlich an alttestamentliche Berichte von Gottes sichtbar erfahrbarer Gegenwart; ausdrücklich gesagt wird dies hier jedoch nicht.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Während er dies sagte
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung. „Dies“ gibt den Rückbezug im Deutschen natürlicher wieder als das wörtlichere, aber schwerfällige „diese Dinge“.
- source_word: ἐγένετο νεφέλη
  choice: erschien eine Wolke
  rationale: ἐγένετο führt hier das Auftreten der Wolke ein, ohne ihre Entstehungsweise näher zu bestimmen. „Erschien“ ist idiomatisch und bleibt darin zurückhaltend.
- source_word: ἐπεσκίαζεν αὐτούς
  choice: überschattete sie
  rationale: Das Imperfekt schildert die Wolke in ihrer einsetzenden beziehungsweise andauernden Wirkung. Die schlichte Formulierung vermeidet eine unnötige Festlegung auf einen ausdrücklich inchoativen Sinn und bewahrt zugleich die biblische Bildsprache von ἐπισκιάζω.
- source_word: ἐφοβήθησαν
  choice: fürchteten sie sich
  rationale: Die Form bezeichnet ihr Erschrecken beziehungsweise ihre Furcht. „Sie fürchteten sich“ ist natürlich, würdevoll und lässt offen, ob der Akzent auf dem Eintritt der Furcht oder auf ihrem Zustand liegt.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: Als sie in die Wolke hineingingen
  rationale: Die Konstruktion mit ἐν und dem artikulierten Infinitiv ist temporal. „Hineingingen“ bewahrt die von εἰς ausgedrückte Bewegung in die Wolke hinein; das Pronomen „sie“ erhält die im griechischen Zusammenhang bestehende Referenzoffenheit.
theological_decisions:
- issue: Wesen der Wolke
  choice: Die Wolke und ihr Überschatten werden im Haupttext rein beschreibend wiedergegeben.
  alternative: Die Wolke ausdrücklich als Erscheinung der Gegenwart oder Herrlichkeit Gottes bezeichnen.
  rationale: Der Zusammenhang erinnert stark an alttestamentliche Theophanien, doch der Vers selbst nimmt diese Deutung nicht ausdrücklich vor. Die Übersetzung bewahrt das Bild, ohne die theologische Folgerung in den Haupttext einzutragen.
- issue: Aspekt von ἐπεσκίαζεν
  choice: „überschattete sie“
  alternative: „begann, sie zu überschatten“ oder „überschattete sie fortwährend“
  rationale: Das Imperfekt kann einen beginnenden oder verlaufenden Vorgang darstellen, erzwingt aber keine dieser Ausdeutungen. Die einfache deutsche Vergangenheitsform lässt diese Aspektnuance offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Überschatten“ bewahrt die prägnante biblische Bildsprache; „hineingingen“ macht die räumliche Bewegung deutlich. Die Pronomen bleiben entsprechend dem griechischen Text ohne erklärende Auflösung.
