  source_fidelity: „Sie nahmen ihn nicht auf“ gibt ἐδέξαντο im Kontext verweigerter Aufnahme bzw. Gastfreundschaft treffend wieder. Der Kausalsatz gibt ὅτι korrekt wieder. „Weil er auf dem Weg nach Jerusalem war“ ist eine natürliche deutsche Entfaltung der ungewöhnlichen Formulierung τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ, ohne die mögliche Nuance entschlossener Ausrichtung im Haupttext zu überdeuten. Die Fußnote dokumentiert die Bildform und deren mögliche Tragweite.
  naturalness: Der Vers ist flüssiges modernes Standarddeutsch. „Doch“ stellt den erzählerischen Gegensatz verständlich heraus, und „auf dem Weg nach Jerusalem“ ist idiomatisch sowie im Zusammenhang klar.
  terminology: „Aufnehmen“ passt für δέχομαι und wahrt gegenüber „willkommen heißen“ die offenere lexikalische Grundbedeutung. „Gastliche Aufnahme“ in der Anmerkung präzisiert den Kontext, ohne den Haupttext unnötig einzuengen. Die Ortsbezeichnung „Jerusalem“ und die Formulierung „nach Jerusalem“ sind angemessen.
