id: LUK.9.53
reference: Luke 9:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: de
  text: Doch sie nahmen ihn nicht auf[a], weil er auf dem Weg nach Jerusalem war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie hießen ihn nicht willkommen“. Gemeint ist wahrscheinlich, dass sie ihm keine gastliche Aufnahme gewährten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „weil sein Gesicht nach Jerusalem unterwegs war“. Die bildhafte Wendung bezeichnet seine Ausrichtung auf Jerusalem und kann zugleich Entschlossenheit anklingen lassen.'
    reason: idiom_and_ambiguity
lexical_decisions:
- source_word: ἐδέξαντο
  choice: nahmen ihn nicht auf
  rationale: δέχομαι kann „aufnehmen“, „willkommen heißen“ oder „annehmen“ bedeuten. Im Zusammenhang der Reise bezeichnet „nicht aufnehmen“ natürlich und treffend die verweigerte gastliche Aufnahme.
- source_word: τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον
  choice: er war auf dem Weg
  rationale: Wörtlich heißt die ungewöhnliche, semitisch geprägte Wendung etwa „sein Gesicht war unterwegs“. Eine rein wörtliche Wiedergabe wäre im Deutschen missverständlich; „er war auf dem Weg“ bewahrt den Reisebezug, ohne die Formulierung mit „fest entschlossen“ stärker auszudeuten, als dieser Vers allein verlangt.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Bei einer Bewegung zu einer Stadt wird εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι nennt hier den Grund für die verweigerte Aufnahme; „weil“ ist der klare, natürliche deutsche Kausalsatzanschluss.
theological_decisions:
- issue: Bedeutung der Wendung mit „Gesicht“ und Jerusalem
  choice: Im Haupttext als Reiseorientierung wiedergeben und die bildhafte Form in einer Fußnote sichtbar halten.
  alternative: „weil sein Gesicht nach Jerusalem gerichtet war“ oder deutender „weil er fest entschlossen war, nach Jerusalem zu gehen“
  rationale: Die Wendung kann neben der Reiserichtung auch Entschlossenheit anklingen lassen. Der Haupttext vermeidet es, diesen Unterton festzuschreiben; die Fußnote bewahrt die markante Ausgangsform und ihre mögliche Nuance.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Aufnehmen“ passt zum Kontext verweigerter Gastfreundschaft; die schwer verständliche wörtliche Gesichts-Wendung wird im Haupttext natürlich formuliert und in der Fußnote dokumentiert.
