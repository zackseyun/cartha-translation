id: LUK.9.20
reference: Luke 9:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Ihr aber, für wen haltet ihr mich?“ Petrus antwortete: „Für den Messias[a] Gottes.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ihr
  rationale: Das im Griechischen ausdrücklich gesetzte Pronomen ist betont und bildet zusammen mit δέ den Kontrast zu den zuvor genannten Ansichten anderer; „Ihr aber“ bewahrt diese Hervorhebung.
- source_word: τίνα με λέγετε εἶναι
  choice: für wen haltet ihr mich
  rationale: Die griechische Konstruktion lautet wörtlich etwa „wer sagt ihr, dass ich sei“. Die idiomatische deutsche Frage „Für wen haltet ihr mich?“ gibt den gemeinten Identitätsanspruch natürlich und klar wieder, ohne eine schwerfällige Satzkonstruktion.
- source_word: ἀποκριθεὶς εἶπεν
  choice: antwortete
  rationale: Partizip und finites Verb bilden hier eine übliche griechische Redeformel, die im Deutschen sachgerecht mit einem einzigen finiten Verb wiedergegeben wird.
- source_word: χριστός
  choice: Messias
  rationale: Χριστός ist hier ein Titel und bezeichnet den von Gott gesalbten und erwarteten Retter. „Messias“ macht diese Titelfunktion im modernen Deutschen deutlicher als das vielfach wie ein Eigenname verstandene „Christus“.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird unmittelbar bewahrt. Die knappe Wendung lässt die genaue Beziehung zwischen Gott und seinem Messias offen, wie es auch der griechische Text tut.
- source_word: δέ
  choice: aber
  rationale: Beim einleitenden εἶπεν δὲ genügt im Deutschen der unmarkierte Satzanschluss; das zweite δέ wird als „aber“ wiedergegeben, weil es die Jünger deutlich den zuvor erwähnten Leuten gegenüberstellt.
theological_decisions:
- issue: Wiedergabe von χριστός im Bekenntnis des Petrus
  choice: Messias
  alternative: Christus
  rationale: Die Aussage verwendet χριστός als messianischen Titel innerhalb des jüdischen Erwartungshorizonts. „Messias“ übersetzt diese Funktion; die kirchlich vertraute Form „Christus“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- issue: Bedeutung des Genitivs τοῦ θεοῦ
  choice: Gottes
  alternative: der von Gott kommt / der Gott gehört
  rationale: Die formale Genitivwiedergabe vermeidet es, die Beziehung vorschnell als Herkunft, Zugehörigkeit oder Beauftragung festzulegen, und erhält so die Mehrdeutigkeit des Ausgangstextes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Rede bleibt natürlich; „Ihr aber“ erhält den griechischen Kontrast. Die Antwort „Für den Messias Gottes“ schließt grammatisch an die Frage „für wen“ an.
