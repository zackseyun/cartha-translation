  - severity: medium
    issue: Fußnote zu ἑτέραν ist redundant und unklar formuliert
    rationale: „Ein anderes, davon verschiedenes Dorf“ doppelt die Aussage und lässt „davon“ ohne klaren Bezug. Die relevante Alternative ist vor allem „ein weiteres Dorf“; eine mögliche Betonung des Andersseins kann knapp erläutert werden.
