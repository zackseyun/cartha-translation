  source_fidelity: 'Der griechische Satz wird im Wesentlichen treffend wiedergegeben: καί ist als „Und“ erhalten, ἐπορεύθησαν bezeichnet das Weitergehen bzw. Reisen, und εἰς ἑτέραν κώμην ist korrekt als Bewegung zu einem anderen Dorf erfasst. „Sie gingen weiter“ ist etwas unmittelbarer und moderner als „sie zogen weiter“, ohne zusätzliche Bedeutung einzutragen.'
  naturalness: Der vorgeschlagene Vers ist verständlich; die überarbeitete Form klingt im heutigen Standarddeutsch schlichter und natürlicher. Die vorhandene Fußnote ist dagegen stilistisch schwerfällig und erklärt die Alternative unnötig redundant.
  terminology: „Dorf“ entspricht κώμη präzise. „Ein anderes“ bildet ἑτέραν idiomatisch ab; als mögliche Nuance kann „ein weiteres“ in der Fußnote genannt werden. Die Fußnote wahrt damit die lexikalische Offenheit, ohne eine stärker qualitative Verschiedenheit zu behaupten.
