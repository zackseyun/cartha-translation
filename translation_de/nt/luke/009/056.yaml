  text: ⸀καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: de
  text: Und sie gingen weiter in ein anderes Dorf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein weiteres Dorf“. Das griechische Adjektiv kann einfach ein weiteres Dorf bezeichnen, aber auch dessen Anderssein betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἐπορεύθησαν
  choice: sie zogen weiter
  rationale: Das deponentische Aoristverb bezeichnet Gehen, Reisen oder Weiterziehen. „Zogen weiter“ gibt im Zusammenhang die Fortsetzung ihres Weges natürlich wieder.
- source_word: εἰς
  choice: in
  rationale: Bei einer Bewegungsrichtung bezeichnet εἰς das Ziel. Im Deutschen ist „in ein Dorf ziehen“ idiomatisch und lässt die Bewegung zum beziehungsweise in den Ort erkennen.
- source_word: ἑτέραν
  choice: ein anderes
  rationale: ἕτερος kann sowohl ein weiteres als auch ein andersartiges beziehungsweise anderes Element bezeichnen. „Ein anderes“ ist hier natürlich und wahrt diese Bedeutungsbreite.
- source_word: κώμην
  choice: Dorf
  rationale: κώμη bezeichnet gewöhnlich eine kleinere ländliche Siedlung, im Unterschied zu einer Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sie zogen weiter“ bildet die knappe Erzählbewegung natürlich ab; die Fußnote bewahrt die mögliche stärkere Nuance von ἑτέραν.
