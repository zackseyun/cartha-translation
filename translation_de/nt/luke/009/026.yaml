id: LUK.9.26
reference: Luke 9:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: de
  text: Denn wer sich meiner und meiner Worte schämt, dessen[a] wird sich der Menschensohn schämen, wenn er in seiner Herrlichkeit und der Herrlichkeit des Vaters und der heiligen Engel kommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dieses Menschen wird sich der Menschensohn schämen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Konstruktion kann auch so wiedergegeben werden: „wenn er in seiner Herrlichkeit und in der Herrlichkeit des Vaters und der heiligen Engel kommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Denn wer
  rationale: γάρ wird mit „denn“ wiedergegeben; die verallgemeinernde Relativkonstruktion ὃς … ἄν entspricht im Deutschen natürlich „wer“.
- source_word: ἐπαισχυνθῇ … ἐπαισχυνθήσεται
  choice: sich … schämt … wird sich … schämen
  rationale: Die gleiche deutsche Wendung an beiden Stellen bewahrt die beabsichtigte Gegenseitigkeit. Stärkere Deutungen wie „verleugnen“ oder „abweisen“ würden den lexikalischen Sinn überdehnen.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: meiner und meiner Worte
  rationale: Die Genitivobjekte sind idiomatisches Deutsch nach „sich schämen“; „Worte“ gibt λόγους unmittelbar wieder, ohne es als „das, was ich sage“ auszulegen.
- source_word: τοῦτον
  choice: dessen
  rationale: „Dessen“ nimmt das allgemeine „wer“ idiomatisch im Singular wieder auf und erhält die pointierte Entsprechung zwischen beiden Satzhälften.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Titel und seine möglichen Bezüge, insbesondere den danielischen Hintergrund.
- source_word: ὅταν ἔλθῃ
  choice: wenn er … kommt
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier ein zukünftiges Eintreten; „wenn er kommt“ ist die natürliche deutsche Entsprechung.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: in seiner Herrlichkeit und der Herrlichkeit des Vaters und der heiligen Engel
  rationale: Die Ergänzung von „Herrlichkeit“ macht die Genitivreihe im Deutschen verständlich und hält zugleich fest, dass die Herrlichkeit dem Menschensohn, dem Vater und den heiligen Engeln zugeordnet wird.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: der heiligen Engel
  rationale: Dies ist eine direkte, natürliche Wiedergabe des attributiven Ausdrucks.
theological_decisions:
- issue: Rückbezug auf die allgemein formulierte warnende Aussage
  choice: dessen wird sich der Menschensohn schämen
  alternative: dieses Menschen wird sich der Menschensohn schämen
  rationale: Die singularische Form des Ausgangstextes bleibt erhalten, ohne den allgemeinen Geltungsbereich der Warnung auf Männer zu beschränken.
- issue: Zuordnung der endzeitlichen Herrlichkeit
  choice: in seiner Herrlichkeit und der Herrlichkeit des Vaters und der heiligen Engel
  alternative: in seiner Herrlichkeit und in der Herrlichkeit des Vaters und der heiligen Engel
  rationale: Die gewählte Fassung bewahrt die knappe griechische Koordination und ihre theologische Spannung, ohne drei völlig getrennte Erscheinungsweisen der Herrlichkeit zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und intertextuell gewichtige Bezeichnung „Menschensohn“ bleibt erhalten; die Wiederholung von „sich schämen“ bildet die rhetorische Gegenseitigkeit des griechischen Textes ab.
