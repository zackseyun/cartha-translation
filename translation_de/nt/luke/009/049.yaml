- from: 'Da sagte Johannes: „Meister, wir haben gesehen, wie jemand in deinem Namen Dämonen austrieb, und wir versuchten, ihn daran zu hindern, weil er nicht mit uns nachfolgt.“'
  to: 'Johannes antwortete: „Meister, wir haben gesehen, wie jemand in deinem Namen Dämonen austrieb, und wir versuchten, ihn daran zu hindern, weil er Jesus nicht gemeinsam mit uns nachfolgt.“'
  rationale: Die Revision stellt den durch Ἀποκριθεὶς markierten Antwortcharakter wieder her und ersetzt die schwer verständliche Schlusswendung durch idiomatisches modernes Deutsch. „Gemeinsam mit uns“ gibt μεθ’ ἡμῶν ausdrücklich wieder und vermeidet damit die sachliche Verschiebung zu „uns nachfolgt“.
