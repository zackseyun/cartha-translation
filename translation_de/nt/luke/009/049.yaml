source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: de
  text: 'Johannes antwortete: „Meister, wir haben gesehen, wie jemand in deinem Namen Dämonen austrieb, und wir versuchten, ihn daran zu hindern, weil er Jesus nicht gemeinsam mit uns nachfolgt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Da sagte Johannes
  rationale: Die Verbindung ist eine übliche narrative Weiterführung. Im Deutschen gibt „Da sagte Johannes“ den Bezug auf das Vorangehende natürlich wieder; ein wörtliches „antwortete“ wäre möglich, obwohl keine ausdrückliche Frage vorausgeht.
- source_word: Ἐπιστάτα
  choice: Meister
  rationale: Der für Lukas charakteristische Titel bezeichnet Jesus als Autorität und Leiter; „Meister“ ist im Deutschen würdig, verständlich und weiter gefasst als „Lehrer“.
- source_word: εἴδομέν τινα
  choice: wir haben gesehen, wie jemand
  rationale: τινα bleibt unbestimmt. Die Konstruktion mit „wie“ gibt das Wahrnehmen der andauernden Handlung im natürlichen modernen Deutsch wieder.
- source_word: ἐν τῷ ὀνόματί σου
  choice: in deinem Namen
  rationale: Die geläufige Wendung bewahrt sowohl den Wortlaut als auch den Gedanken des Handelns unter Berufung auf Jesu Namen und Autorität.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: Dämonen austrieb
  rationale: „Dämonen austreiben“ ist die klare und etablierte deutsche Entsprechung im Exorzismuskontext.
- source_word: ἐκωλύομεν αὐτόν
  choice: wir versuchten, ihn daran zu hindern
  rationale: Der Imperfekt kann einen andauernden oder versuchten Vorgang bezeichnen. Diese Wiedergabe wahrt den Versuchsaspekt, ohne zu behaupten, die Jünger hätten ihn tatsächlich aufgehalten.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: weil er nicht mit uns nachfolgt
  rationale: „mit uns“ bildet μετά mit Genitiv ausdrücklich ab. „nachfolgt“ hält den Bezug zur Jüngerschaft fest und vermeidet die missverständliche Aussage, der Mann folge den Jüngern selbst als seinen Leitern.
theological_decisions:
- issue: Mehrdeutigkeit hinsichtlich der Zugehörigkeit des fremden Exorzisten
  choice: weil er nicht mit uns nachfolgt
  alternative: weil er uns nicht folgt
  rationale: Der griechische Text sagt ausdrücklich „mit uns“. Die gewählte Formulierung lässt offen, in welchem Verhältnis der Mann zu Jesus steht, und kennzeichnet als Beschwerde vor allem, dass er sich nicht der Gruppe der Jünger angeschlossen hat.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die leicht markierte Formulierung „mit uns nachfolgt“ ist bewusst beibehalten, weil sie die ungewöhnliche griechische Verbindung und ihre inhaltliche Spannung genauer wahrt als das idiomatischere, aber sachlich verschiebende „uns folgt“.
