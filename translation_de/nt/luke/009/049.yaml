review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Inhalte sind zutreffend wiedergegeben: Johannes spricht Jesus als „Meister“ an, ein unbestimmter Mensch treibt Dämonen in Jesu Namen aus, und die Jünger versuchten, ihn daran zu hindern. Der Imperfekt ἐκωλύομεν ist mit „versuchten“ angemessen erfasst. Allerdings sollte Ἀποκριθεὶς als antwortende Redehandlung kenntlich bleiben. Die Schlussformulierung „nicht mit uns nachfolgt“ ist zwar formal nahe am Griechischen, im heutigen Standarddeutsch jedoch syntaktisch und semantisch zu unklar.'
  naturalness: „Da sagte Johannes“ ist natürlich, lässt aber den responsiven Charakter von ἀποκριθεὶς entfallen. „Johannes antwortete“ ist ebenso idiomatisch. „Nicht mit uns nachfolgt“ wirkt im modernen Deutsch unvollständig, weil das Ziel der Nachfolge nicht genannt ist; „Jesus nicht gemeinsam mit uns nachfolgt“ ist klar, natürlich und bewahrt die Abgrenzung von der Jüngergruppe.
  terminology: „Meister“, „in deinem Namen“ und „Dämonen austrieb“ sind sachgerecht und registerlich passend. Die explizite Nennung Jesu in der Schlusswendung ist eine zur deutschen Grammatik erforderliche Klarstellung des im Kontext und in ἀκολουθεῖ absoluten mitgemeinten Bezugs; sie behauptet nicht, der Mann folge den Jüngern.
  issues:
  - severity: medium
    issue: Der Antwortcharakter von Ἀποκριθεὶς fehlt in „Da sagte Johannes“.
    rationale: Das Partizip bezeichnet hier die Erwiderung des Johannes auf den vorherigen Gesprächszusammenhang. „Antwortete“ bewahrt diese erzählerische Funktion ohne unnatürliche Wörtlichkeit.
  - severity: medium
    issue: „weil er nicht mit uns nachfolgt“ ist im modernen Standarddeutsch unidiomatisch und kann den Bezug der Nachfolge verschleiern.
    rationale: 'Das Griechische hebt mit μεθ’ ἡμῶν hervor, dass der Mann nicht gemeinsam mit der Jüngergruppe folgt. Deutsch benötigt für eine klare, natürliche Formulierung das Ziel der Nachfolge: Jesus.'
  revised_text: 'Johannes antwortete: „Meister, wir haben gesehen, wie jemand in deinem Namen Dämonen austrieb, und wir versuchten, ihn daran zu hindern, weil er Jesus nicht gemeinsam mit uns nachfolgt.“'
