  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: de
  text: Am folgenden Tag[a], als sie vom Berg herabgestiegen waren, kam ihm eine große Menschenmenge entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Am nächsten Tag.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[nicht eigenständig wiedergegeben]'
  rationale: Die Wendung dient hier als erzählerischer Übergang. Im natürlichen modernen Deutsch wird ihre verbindende Funktion durch den fortlaufenden Satz und die Zeitangabe ausreichend getragen; ein ausdrückliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Am folgenden Tag
  rationale: Der temporale Dativ bezeichnet den Zeitpunkt. „Am folgenden Tag“ ist idiomatisch, präzise und entspricht dem Sinn der griechischen Wendung.
- source_word: κατελθόντων αὐτῶν
  choice: als sie … herabgestiegen waren
  rationale: Der Genitivus absolutus liefert den zeitlichen Hintergrund. Das Plusquamperfekt gibt die gegenüber dem Hauptverb abgeschlossene Handlung angemessen wieder.
- source_word: ἀπὸ τοῦ ὄρους
  choice: vom Berg
  rationale: ὄρος bezeichnet hier den Berg, von dem Jesus und seine Begleiter herabkommen. „Vom Berg“ ist die natürliche deutsche Wiedergabe.
- source_word: συνήντησεν αὐτῷ
  choice: kam ihm … entgegen
  rationale: συναντάω kann sowohl das Zusammentreffen als auch das Entgegenkommen bezeichnen. „Kam ihm entgegen“ bildet die Bewegung und die griechische Dativkonstruktion natürlich ab, ohne eine besondere Absicht der Menge festzulegen.
- source_word: ὄχλος πολύς
  choice: eine große Menschenmenge
  rationale: Die Formulierung gibt sowohl ὄχλος als versammelte Menge als auch πολύς als Angabe ihrer Größe klar und in modernem Deutsch wieder.
