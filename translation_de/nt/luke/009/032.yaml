    issue: „vom Schlaf überwältigt“
    rationale: Die Formulierung kann ein völliges Unterliegen unter den Schlaf ausdrücken. Das griechische βεβαρημένοι bezeichnet hier das Beschwert- oder Belastetsein durch Schlaf; „vom Schlaf beschwert“ wahrt die Metapher genauer.
  - severity: low
    issue: „Als sie aber ganz wach geworden waren“
    rationale: Das Plusquamperfekt bezeichnet eine vor der Haupthandlung liegende Handlung; „nachdem“ ist dafür die idiomatischere und klarere deutsche Anbindung.
