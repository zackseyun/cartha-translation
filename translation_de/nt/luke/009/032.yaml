  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Petrus und die bei ihm Befindlichen sind durch Schlaf stark belastet; nach dem Wachwerden sehen sie Jesu Herrlichkeit und die zwei bei ihm stehenden Männer. „Vom Schlaf überwältigt“ ist jedoch stärker als βεβαρημένοι ὕπνῳ und kann nahelegen, dass sie bereits vom Schlaf besiegt waren. „Vom Schlaf beschwert“ gibt die bildhafte Belastung präziser wieder. Die Verbindung „Als … geworden waren“ ist mit dem Plusquamperfekt weniger idiomatisch als „Nachdem … geworden waren“ und bildet die vorzeitige Partiziphandlung klarer ab.'
  naturalness: Die Fassung ist insgesamt modernes, würdiges Standarddeutsch. „Nachdem sie aber ganz wach geworden waren“ ist im Deutschen flüssiger und zeitlich klarer als „Als sie aber ganz wach geworden waren“.
  terminology: „Herrlichkeit“ für δόξα, „die beiden Männer“ für τοὺς δύο ἄνδρας und „die bei ihm standen“ für τοὺς συνεστῶτας αὐτῷ sind angemessen. „Seine Begleiter“ ist möglich, doch „die bei ihm waren“ folgt οἱ σὺν αὐτῷ unmittelbarer und vermeidet eine zusätzliche Rollenbezeichnung.
  issues:
