  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: de
  text: Petrus und die bei ihm waren, waren vom Schlaf beschwert. Nachdem sie aber ganz wach geworden waren[a], sahen sie seine Herrlichkeit und die beiden Männer, die bei ihm standen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem sie aufgewacht waren“ oder „als sie völlig wach waren“. Das griechische Verb ist selten und kann das Erlangen voller Wachheit betonen, statt auszusagen, dass sie die ganze Zeit wach geblieben waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: vom Schlaf überwältigt
  rationale: Die Wendung bezeichnet einen durch Schlaf verursachten schweren, bedrängenden Zustand und ist stärker als schlicht „schläfrig“. „Vom Schlaf überwältigt“ gibt die Bildhaftigkeit in natürlichem Deutsch wieder.
- source_word: διαγρηγορήσαντες
  choice: als sie ganz wach geworden waren
  rationale: Das seltene Verb bezeichnet hier im Gegensatz zur vorherigen Schlafschwere am ehesten das Erlangen voller Wachheit. Die zeitliche Wiedergabe entspricht dem aoristischen Partizip, ohne zu behaupten, sie seien die ganze Zeit wach geblieben.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und kontextuell passende Wiedergabe von δόξα; sie umfasst den sichtbaren Glanz und bewahrt zugleich die biblisch-theologische Resonanz.
- source_word: τοὺς δύο ἄνδρας
  choice: die beiden Männer
  rationale: ἀνήρ bezeichnet hier die zwei erwachsenen Männer Mose und Elija; die Wiedergabe ist idiomatisch und genau.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: die bei ihm standen
  rationale: Das Partizip bezeichnet in diesem Zusammenhang das Dabeistehen beziehungsweise die Gegenwart bei Jesus. Die Formulierung erhält die anschauliche Körperhaltung.
- source_word: δέ … δέ
  choice: unübersetzt … aber
  rationale: Das erste δέ führt Petrus und seine Begleiter als neuen Fokus ein und muss im Deutschen nicht eigens markiert werden; das zweite δέ stellt den Gegensatz zwischen Schlafschwere und voller Wachheit heraus und wird mit „aber“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δόξα im Kontext der Verklärung
  choice: seine Herrlichkeit
  alternative: sein Glanz; seine Majestät
  rationale: „Herrlichkeit“ wahrt die sichtbare Dimension der Szene und ihre weiterreichende biblisch-theologische Bedeutung, ohne die Natur dieser Herrlichkeit im Vers erklärend festzulegen.
- issue: Deutung von διαγρηγορήσαντες
  choice: als sie ganz wach geworden waren
  alternative: nachdem sie aufgewacht waren; obwohl sie wach geblieben waren
  rationale: Die gewählte Fassung bringt den Übergang zur vollen Wachheit zum Ausdruck und vermeidet die kontextuell schwierigere Festlegung, die Jünger seien trotz ihrer Schlafschwere durchgehend wach geblieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Begleiter“ gibt οἱ σὺν αὐτῷ knapp und natürlich wieder. Der Punkt statt eines Semikolons gliedert den langen Satz lesefreundlich, ohne die logische Verbindung zu verändern.
