  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: de
  text: 'Der Tag begann sich dem Ende zuzuneigen. Da traten die Zwölf zu ihm und sagten: »Schick die Menschenmenge fort, damit sie in die umliegenden Dörfer und aufs Land gehen, dort Unterkunft und Verpflegung[a] finden; denn wir sind hier an einem einsamen Ort[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nahrung« beziehungsweise »Vorräte«. Das griechische Wort bezeichnet Verpflegung oder Lebensmittelvorräte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »an einem menschenleeren Ort«. Das griechische Wort kann ein unbewohntes oder nur dünn besiedeltes Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Der Tag neigte sich allmählich dem Ende zu
  rationale: Die griechische Wendung beschreibt idiomatisch den Übergang zum Abend. Die deutsche Formulierung bewahrt das Bild des sich neigenden Tages und gibt den einsetzenden Verlauf natürlich wieder.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: Da traten die Zwölf zu ihm
  rationale: προσέρχομαι bezeichnet das Herantreten oder Näherkommen. „Die Zwölf“ bleibt als feste Bezeichnung der Apostel erhalten; „da“ gibt den erzählerischen Anschluss durch δέ wieder.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Schick die Menschenmenge fort
  rationale: ἀπολύω bedeutet hier entlassen oder fortschicken. Diese Formulierung ist im modernen Deutschen klar und natürlich.
- source_word: ἵνα πορευθέντες
  choice: damit sie … gehen
  rationale: Das Partizip bezeichnet innerhalb des Zwecksatzes die vorausgehende Bewegung. Im Deutschen wird dies idiomatisch in die koordinierte Handlung eingebunden.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: in die umliegenden Dörfer und aufs Land
  rationale: κύκλῳ bedeutet „ringsum, umliegend“; κώμαι sind Dörfer. ἀγροί kann Felder, Gehöfte oder ländliche Gebiete bezeichnen; „aufs Land“ hält diese räumliche Breite offen.
- source_word: καταλύσωσιν
  choice: Unterkunft finden
  rationale: καταλύω bezeichnet hier das Unterkommen beziehungsweise Übernachten. „Unterkunft finden“ gibt den kontextuellen Sinn klar wieder.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: Verpflegung finden
  rationale: ἐπισιτισμός bezeichnet Nahrungsvorrat oder Verpflegung. „Verpflegung“ bewahrt den Versorgungsaspekt, ohne den Ausdruck auf eine einzelne Mahlzeit zu verengen.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: denn wir sind hier an einem abgelegenen Ort
  rationale: ἔρημος bezeichnet einen menschenleeren, unbewohnten oder abgelegenen Ort. „Abgelegen“ passt zum Kontext fehlender Unterkunft und Versorgung, ohne eine bestimmte Wüstenlandschaft vorauszusetzen; ὧδε wird mit „hier“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von ἔρημος
  choice: abgelegener Ort
  alternative: menschenleerer Ort / Einöde
  rationale: Der Ausdruck wird geografisch und lebenspraktisch verstanden, ohne eine besondere Wüsten- oder Exodus-Theologie in den Vers hineinzutragen. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch natürlichem Satzfluss. Die direkte Rede ist klar und alltagssprachlich verständlich, ohne umgangssprachlich zu wirken. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
