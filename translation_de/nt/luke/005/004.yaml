id: LUK.5.4
reference: Luke 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: de
  text: 'Als er aufgehört hatte zu reden, sagte er zu Simon: „Fahr hinaus ins tiefe Wasser[a] und lasst eure Netze zum Fang hinab.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Tiefe“; gemeint ist hier tiefes Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als
  rationale: Leitet den nächsten Vorgang mit einer zeitlichen Beziehung und leichter erzählerischer Fortführung ein, ohne δέ unnötig ausdrücklich wiederzugeben.
- source_word: ἐπαύσατο λαλῶν
  choice: er aufgehört hatte zu reden
  rationale: παύω mit dem Partizip bezeichnet das Beenden einer andauernden Handlung; die deutsche Vorzeitigkeit gibt die zeitliche Abfolge natürlich wieder.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: sagte er zu Simon
  rationale: Gibt die schlichte Redeeinleitung eng am griechischen Wortlaut wieder.
- source_word: Ἐπανάγαγε
  choice: Fahr hinaus
  rationale: Der Singular richtet sich an Simon und bezeichnet im Zusammenhang das Hinausfahren des Bootes vom Ufer; eine ausdrückliche Ergänzung wie „auf den See“ ist nicht nötig.
- source_word: εἰς τὸ βάθος
  choice: ins tiefe Wasser
  rationale: βάθος meint hier den tieferen Bereich des Gewässers. Die Wiedergabe ist im Deutschen natürlich; die wörtlichere Form bleibt in der Fußnote sichtbar.
- source_word: χαλάσατε
  choice: lasst … hinab
  rationale: Der Plural wird bewahrt und beschreibt passend das Hinablassen der Netze vom Boot.
- source_word: τὰ δίκτυα ὑμῶν
  choice: eure Netze
  rationale: Entspricht der natürlichen deutschen Wiedergabe des griechischen Possessivpronomens und bewahrt den Plural.
- source_word: εἰς ἄγραν
  choice: zum Fang
  rationale: ἄγρα bezeichnet hier den beabsichtigten Fischfang beziehungsweise Fang; „zum Fang“ gibt die Zielangabe knapp wieder.
theological_decisions:
- issue: Wechsel vom Singular zum Plural in den Aufforderungen
  choice: „Fahr“ im Singular, danach „lasst eure Netze“ im Plural
  alternative: Beide Aufforderungen einheitlich im Singular oder Plural wiedergeben
  rationale: Der griechische Text spricht mit Ἐπανάγαγε zunächst Simon allein an, bezieht mit χαλάσατε und ὑμῶν danach aber weitere Beteiligte ein. Dieser bedeutsame grammatische Wechsel wird nicht geglättet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die nautische Handlung wird ohne unnötige Fachsprache wiedergegeben; der Wechsel zwischen Singular und Plural bleibt erhalten.
