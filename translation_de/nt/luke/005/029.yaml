source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: de
  text: Und Levi veranstaltete für ihn in seinem Haus ein großes Festmahl. Und es war eine große Menge von Zolleinnehmern und anderen da, die mit ihnen zu Tisch lagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei festlichen Mahlzeiten lag man damals gewöhnlich auf Polstern zu Tisch.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: ein großes Festmahl
  rationale: δοχή bezeichnet hier ein ausgerichtetes Fest beziehungsweise Gastmahl. „Festmahl“ ist im modernen Deutschen natürlich, würdig und macht den Mahlcharakter deutlich.
- source_word: αὐτῷ
  choice: für ihn
  rationale: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf Jesus. Die Übersetzung behält wie der griechische Text das Pronomen bei.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: in seinem Haus
  rationale: Die Wendung gibt Ort und Besitzverhältnis direkt wieder, ohne das allgemeinere „bei sich“ einzusetzen.
- source_word: ὄχλος πολὺς
  choice: eine große Schar
  rationale: ὄχλος bezeichnet eine größere Menschenmenge. „Schar“ passt zu einer versammelten Gruppe von Gästen und vermeidet den Eindruck einer anonymen Menge außerhalb des Hauses.
- source_word: τελωνῶν
  choice: Zolleinnehmern
  rationale: τελώνης bezeichnet Personen, die Abgaben beziehungsweise Zölle einzogen. „Zolleinnehmer“ ist verständlich und trifft den historischen sozialen Personenkreis besser als der modern-staatliche Ausdruck „Steuerbeamte“.
- source_word: ἄλλων
  choice: anderen
  rationale: Der griechische Ausdruck bleibt unbestimmt; die Übersetzung spezifiziert die weiteren Gäste daher nicht.
- source_word: μετ’ αὐτῶν
  choice: mit ihnen
  rationale: Die Pluralform αὐτῶν wird formal bewahrt. Ihr genauer Bezug wird nicht stillschweigend auf eine einzelne Person verengt.
- source_word: κατακείμενοι
  choice: lag zu Tisch
  rationale: Das Verb bezeichnet das Liegen beziehungsweise Sich-Niederlegen beim Essen. „Zu Tisch liegen“ bewahrt die antike Tischsitte und ist im Zusammenhang verständlich.
theological_decisions:
- issue: Bezug des pluralischen Pronomens in μετ’ αὐτῶν
  choice: mit ihnen
  alternative: mit ihm
  rationale: Der überlieferte griechische Text hat ein pluralisches Pronomen. Die Übersetzung wahrt diese Form und damit die mögliche Beziehung auf die zuvor genannte Gruppe, statt sie zugunsten eines alleinigen Bezugs auf Jesus zu singularisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Veranstaltete“ gibt Levis Rolle als Gastgeber idiomatisch wieder; „lag zu Tisch“ hält zugleich die historische Körperhaltung sichtbar. Der Fußnotenmarker steht unmittelbar bei der kulturell erklärungsbedürftigen Wendung.
