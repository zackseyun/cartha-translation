  timestamp: '2026-07-14T21:22:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Elemente korrekt wieder: Levi richtet für Jesus ein großes Mahl in seinem Haus aus; zahlreiche Zolleinnehmer und weitere, nicht näher bestimmte Personen sind anwesend und liegen mit „ihnen“ zu Tisch. Der Plural von μετ’ αὐτῶν bleibt angemessen erhalten. Allerdings verwischt die Formulierung „Eine große Schar von Zolleinnehmern und anderen lag“ die griechische Konstruktion aus einer großen Menge und weiteren Personen, die zu Tisch liegen, und setzt durch das Singularverb einen weniger klaren Akzent.'
  naturalness: „Ein großes Festmahl“ und „Zolleinnehmer“ sind natürliches modernes Standarddeutsch. „Eine große Schar ... lag mit ihnen zu Tisch“ ist zwar grammatisch möglich, klingt jedoch wegen des Kollektivsingulars und des anschließenden Plurals „mit ihnen“ unnötig schwerfällig. Eine Konstruktion mit Relativsatz bildet den Satzbau und die Aussage klarer ab.
  terminology: „Zolleinnehmer“ ist für τελῶναι sachgerecht und im biblischen deutschen Sprachgebrauch gut verständlich. „Festmahl“ gibt δοχὴ μεγάλη gut wieder. Die kulturelle Fußnote zu „zu Tisch lagen“ ist passend und zurückhaltend.
  issues:
  - severity: medium
    issue: Die Satzstruktur verbindet die große Schar und die anderen Personen zu einem Kollektivsubjekt im Singular.
    rationale: Im Griechischen steht zunächst eine große Menge von Zolleinnehmern; „und andere“ werden anschließend genannt und durch den pluralischen Relativsatz als mit zu Tisch Liegende beschrieben. Die deutsche Fassung sollte diese Gliederung klarer erkennen lassen und zugleich das pluralische κατακείμενοι idiomatisch wiedergeben.
  revised_text: Und Levi veranstaltete für ihn in seinem Haus ein großes Festmahl. Und es war eine große Menge von Zolleinnehmern und anderen da, die mit ihnen zu Tisch lagen.[a]
