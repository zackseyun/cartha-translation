revisions:
- from: Und Levi veranstaltete für ihn in seinem Haus ein großes Festmahl. Eine große Schar von Zolleinnehmern und anderen lag mit ihnen zu Tisch.[a]
  to: Und Levi veranstaltete für ihn in seinem Haus ein großes Festmahl. Und es war eine große Menge von Zolleinnehmern und anderen da, die mit ihnen zu Tisch lagen.[a]
  rationale: Die Revision bewahrt alle lexikalischen Entscheidungen des Entwurfs, gibt aber die griechische Abfolge „große Menge von Zolleinnehmern und andere, die ... zu Tisch lagen“ deutlicher wieder. Der Relativsatz trägt den Plural der zu Tisch Liegenden, während „mit ihnen“ die im griechischen Text vorliegende pluralische, nicht weiter präzisierte Bezugnahme beibehält. Der Fußnotenanker bleibt direkt bei der kulturell erklärungsbedürftigen Wendung.
