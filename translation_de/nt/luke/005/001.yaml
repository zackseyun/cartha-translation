  terminology: „Menge“, „Wort Gottes“ und „See Gennesaret“ sind angemessenes modernes Standarddeutsch und quellennah. Die Fußnote zum Namen ist sachlich und nicht harmonisierend im Haupttext. In Fußnote a ist „sich an ihn drängte“ weniger idiomatisch; „ihn bedrängte“ bietet eine natürliche lexikalische Alternative.
