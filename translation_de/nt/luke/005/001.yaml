id: LUK.5.1
reference: Luke 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: de
  text: Es geschah aber, als die Menge sich um ihn drängte und das Wort Gottes hörte[a], stand er am See Gennesaret[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als die Menge ihn bedrängte und das Wort Gottes vernahm“.'
    reason: lexical_alternative
  - marker: b
    text: Der See Gennesaret ist auch als See von Galiläa bekannt.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Es geschah aber
  rationale: Die lukanische Erzählformel wird erkennbar bewahrt; „aber“ gibt δέ leicht wieder, ohne ein im Griechischen nicht vorhandenes zeitliches „nun“ einzuführen.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: als die Menge sich um ihn drängte und das Wort Gottes hörte
  rationale: Die Konstruktion mit ἐν und artikulierten Infinitiven ist temporal. Beide gleichgeordneten Handlungen bleiben ausdrücklich erhalten.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: sich um ihn drängte
  rationale: Die Formulierung vermittelt die körperliche Nähe und den Druck der Menge in natürlichem modernem Deutsch.
- source_word: ἀκούειν
  choice: hörte
  rationale: „Hören“ gibt das griechische Verb unmittelbar wieder und kann hier aufgrund des Gegenstands zugleich aufmerksames Zuhören bezeichnen.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die traditionelle, weiterhin verständliche Wendung erhält die theologische und intertextuelle Weite des griechischen Ausdrucks.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: während er ... stand
  rationale: Die umschreibende Verbform bezeichnet einen andauernden Zustand. Das zweite „während“ macht die Satzbeziehung im Deutschen klar, ohne αὐτός unnötig zu betonen.
- source_word: παρὰ τὴν λίμνην Γεννησαρέτ
  choice: am See Gennesaret
  rationale: „Am See“ ist die natürliche deutsche Wiedergabe der Lageangabe; der im Text gebrauchte Eigenname bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  alternative: Gottes Botschaft
  rationale: Die formalere Wiedergabe bewahrt sowohl den Sinn der verkündigten Botschaft als auch die breitere biblisch-theologische Resonanz, ohne diese einzuengen.
- issue: Bezeichnung des Gewässers Γεννησαρέτ
  choice: See Gennesaret
  alternative: See Genezareth / See von Galiläa
  rationale: Der griechische Eigenname wird in enger Transliteration wiedergegeben. Die bekannte Identifikation mit dem See von Galiläa wird nur erklärend in der Fußnote genannt und nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer lukanischer Erzählformel. Das abschließende Komma bleibt stehen, da der Vers syntaktisch in Vers 2 weitergeführt wird. Die Schreibweise „Gennesaret“ folgt bewusst der griechischen Namensform.
