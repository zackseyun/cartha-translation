  source_fidelity: Der Entwurf gibt die temporale Konstruktion, den physischen Druck der Menge, ihr Hören des Wortes Gottes sowie Jesu Standort am See insgesamt zutreffend wieder. Die Abfolge „als …, während er …“ verschiebt bzw. verdoppelt jedoch unnötig die zeitliche Verknüpfung; der griechische Satz koordiniert Jesu Stehen mit dem Geschehen um die Menge.
