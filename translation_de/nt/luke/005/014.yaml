source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: de
  text: 'Und er befahl ihm, niemandem etwas zu sagen, sondern: »Geh, zeig dich dem Priester und bring für deine Reinigung das Opfer dar, das Mose vorgeschrieben hat,[a] ihnen zum Zeugnis.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siehe 3. Mose 14 zu den von Mose vorgeschriebenen Opfern für die Reinigung.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: »ihnen zum Zeugnis«. Wer mit »ihnen« gemeint ist und ob das Zeugnis für oder gegen sie spricht, bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: befahl
  rationale: Gibt die verbindliche, autoritative Anweisung prägnant wieder, ohne zusätzliche Schärfe einzutragen.
- source_word: μηδενὶ εἰπεῖν
  choice: niemandem etwas zu sagen
  rationale: Natürliche deutsche Wiedergabe des Infinitivsatzes mit dem Dativ μηδενί; das ergänzte „etwas“ ist idiomatisch und verändert den Sinn nicht.
- source_word: ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: Geh, zeig dich dem Priester
  rationale: Der vorzeitige Aoristpartizip wird in natürlichem Deutsch als einleitender Imperativ wiedergegeben; „zeig dich“ bleibt nahe am griechischen Wortlaut.
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: bring für deine Reinigung das Opfer dar
  rationale: Der kultische Zusammenhang verlangt eine Opferdarbringung. „Das Opfer“ macht den im Deutschen nötigen Gegenstand explizit, der aus dem mosaischen Reinigungsritus hervorgeht.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: das Mose vorgeschrieben hat
  rationale: „Vorgeschrieben“ bezeichnet passend die im mosaischen Gesetz festgelegte Opferhandlung und vermeidet die im Deutschen schwerfällige Wiederholung von „befehlen“.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ihnen zum Zeugnis
  rationale: Die knappe, formnahe Wendung bewahrt sowohl den unbestimmten Bezug von αὐτοῖς als auch die mögliche positive, beweiskräftige oder konfrontative Nuance von μαρτύριον.
theological_decisions:
- issue: Bezug und Aussageabsicht von εἰς μαρτύριον αὐτοῖς
  choice: ihnen zum Zeugnis
  alternative: als Beweis gegen sie / den Priestern zum Zeugnis
  rationale: Der griechische Text bestimmt weder die Bezugsgruppe von „ihnen“ ausdrücklich noch, ob das Zeugnis für oder gegen sie wirkt. Die Übersetzung lässt diese Spannung offen.
- issue: Reinigung und Heilung im kultischen Zusammenhang
  choice: für deine Reinigung das Opfer darbringen
  alternative: für deine Reinigung eine Gabe bringen
  rationale: Die Formulierung wahrt den Bezug auf die gesetzlich vorgeschriebene kultische Reinigung, ohne körperliche Heilung und kultische Reinheit begrifflich gleichzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede verdeutlicht die Folge der Anweisungen. „Aussatz“ erscheint nur in der erklärenden Fußnote als traditioneller Sammelbegriff für die in 3. Mose 14 behandelten Hautkrankheiten.
