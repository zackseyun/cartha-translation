source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: de
  text: 'Da begannen die Schriftgelehrten und die Pharisäer zu überlegen[a]: »Wer ist dieser, der Gotteslästerungen ausspricht? Wer kann Sünden vergeben außer Gott allein?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl inneres Überlegen als auch ein Erörtern untereinander bezeichnen.
    reason: Die genaue Form des Erwägens bleibt im Ausgangstext offen; die Fußnote bewahrt diese echte Bedeutungsbreite.
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: begannen … zu überlegen
  rationale: ἄρχομαι mit Infinitiv bezeichnet den Beginn einer Handlung. διαλογίζομαι umfasst inneres Erwägen, Überlegen und beratendes Erörtern; „überlegen“ bewahrt diese Offenheit und passt in natürliches modernes Deutsch.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die etablierte deutsche Bezeichnung für die anerkannten Gesetzes- und Schriftexperten im Evangelienkontext.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Die übliche deutsche Form des Gruppennamens.
- source_word: λαλεῖ βλασφημίας
  choice: Gotteslästerungen ausspricht
  rationale: Im vorliegenden religiösen Kontext bezeichnet βλασφημία eine als gegen Gott gerichtet verstandene Lästerung. Der Plural wird mit „Gotteslästerungen“ bewahrt; „ausspricht“ gibt λαλεῖ würdig und idiomatisch wieder.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: Sünden vergeben
  rationale: ἀφίημι mit ἁμαρτίας ist die geläufige Wendung für das Vergeben von Sünden; die deutsche Entsprechung ist klar und idiomatisch.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: außer Gott allein
  rationale: Die Ausnahmeformel εἰ μή und die Ausschließlichkeit von μόνος werden beide erhalten.
- source_word: Τίς ἐστιν οὗτος
  choice: Wer ist dieser
  rationale: Die knappe, abweisend wirkende Frage wird ohne den im Griechischen nicht vorhandenen Zusatz „Mann“ wiedergegeben.
theological_decisions:
- issue: Jesu Vollmacht, Sünden zu vergeben
  choice: 'Der Einwand wird unverändert in seiner ausschließlichen Aussage wiedergegeben: Nur Gott kann Sünden vergeben.'
  alternative: Die Aussage abschwächen oder die christologische Folgerung ausdrücklich in den Vers einfügen.
  rationale: Der Vers lässt die Behauptung der Schriftgelehrten und Pharisäer mit ihrer theologischen Spannung stehen. Die Übersetzung darf weder ihre Ausschließlichkeit mindern noch die von Lukas erst erzählerisch entfaltete Folgerung vorwegnehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und konfrontativ; der Plural „Gotteslästerungen“ sowie die Exklusivität von „Gott allein“ werden bewahrt.
