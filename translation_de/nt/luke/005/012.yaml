reference: Luke 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: de
  text: 'Es geschah, als er in einer der Städte war: Da war ein Mann voller Aussatz.[a] Als er Jesus sah,[c] warf er sich mit dem Gesicht zu Boden und flehte ihn an: „Herr, wenn du willst, kannst du mich reinigen.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Aussatz“ können in der Bibel verschiedene schwere Hautkrankheiten gemeint sein, nicht nur die heute so genannte Hansen-Krankheit. Wörtlich steht hier „voller Aussatz“, was die Schwere seines Zustands betont.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kannst du mich rein machen“. Das Verb kann neben körperlicher Heilung auch kultische und soziale Wiederherstellung einschließen.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften lassen „als er Jesus sah“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Es geschah
  rationale: Bewahrt Lukas’ einleitende Erzählformel in verständlichem, würdigem Deutsch.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: als er … war
  rationale: Gibt die substantivierte Infinitivkonstruktion idiomatisch als temporalen Nebensatz wieder.
- source_word: μιᾷ τῶν πόλεων
  choice: in einer der Städte
  rationale: Entspricht πόλις, ohne Größe oder Bedeutung der Siedlung näher festzulegen.
- source_word: ἰδοὺ
  choice: Da war
  rationale: Vermittelt das plötzliche Auftreten des Mannes natürlich; die Hervorhebung wird zusätzlich durch den Doppelpunkt getragen.
- source_word: πλήρης λέπρας
  choice: voller Aussatz
  rationale: Bewahrt die ungewöhnlich starke Formulierung πλήρης und den traditionellen, im biblischen Zusammenhang geläufigen Ausdruck „Aussatz“.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: warf er sich mit dem Gesicht zu Boden
  rationale: Gibt die konkrete Körperhaltung sowie die Dringlichkeit und Demut der Bitte in natürlichem Deutsch wieder.
- source_word: ἐδεήθη αὐτοῦ
  choice: flehte ihn an
  rationale: Bringt die Eindringlichkeit von δέομαι stärker zum Ausdruck als das neutrale „bat ihn“.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt sowohl die respektvolle Anrede als auch den möglichen christologischen Nachklang, ohne diesen im Kontext festzuschreiben.
- source_word: ἐὰν θέλῃς
  choice: wenn du willst
  rationale: Gibt die Aussage über Jesu Willen direkt und in modernem Deutsch wieder.
- source_word: δύνασαί με καθαρίσαι
  choice: kannst du mich rein machen
  rationale: Bewahrt sowohl Jesu Fähigkeit als auch die körperlichen, kultischen und sozialen Bedeutungsanteile von καθαρίζω.
theological_decisions:
- issue: λέπρα und καθαρίζω im Zusammenhang der Heilung
  choice: „Aussatz“ und „rein machen“
  alternative: „Hautkrankheit“ und „heilen“
  rationale: Die antike λέπρα ist nicht ohne Weiteres mit der heutigen Hansen-Krankheit gleichzusetzen. Zugleich spricht der Text ausdrücklich vom Reinmachen und damit nicht nur von medizinischer Genesung, sondern auch von kultischer und sozialer Wiederherstellung.
- issue: κύριος als Anrede Jesu
  choice: „Herr“
  alternative: „Meister“ oder „mein Herr“
  rationale: „Herr“ erhält die respektvolle Anrede und ihre mögliche christologische Tragweite, ohne zu behaupten, dass der Mann bereits ein vollständiges Bekenntnis zur Identität Jesu ablegt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. „Es geschah“ und „voller Aussatz“ sind bewusst leicht markiert, um Lukas’ Erzählformel beziehungsweise die starke Ausdrucksweise des griechischen Textes zu bewahren; die übrige Syntax ist natürlich und gegenwärtig.
