  source_fidelity: Die Übersetzung gibt die Satzfolge, die Intensivform πλήρης λέπρας, die Prostration, die eindringliche Bitte und die Aussage über Jesu Fähigkeit grundsätzlich treffend wieder. „Rein machen“ ist jedoch für καθαρίσαι weniger präzise als „reinigen“ und klingt im heutigen Deutsch unnötig umgangssprachlich. Die im SBLGNT durch Klammern markierte Lesart ἰδὼν („als er Jesus sah“) sollte durch eine textkritische Anmerkung kenntlich gemacht werden.
  naturalness: „Es geschah“ ist als bewusst leicht markierte lukanische Erzählformel vertretbar. Die Konstruktion mit Doppelpunkt ist verständlich. „Da war ein Mann“ gibt ἰδού nur abgeschwächt wieder, ist aber im Gesamtton idiomatisch. „Reinigen“ ist in dieser Bitte zugleich natürlich und semantisch klarer als „rein machen“.
  terminology: „Aussatz“ ist mit der vorhandenen Erläuterung zur breiteren antiken Bedeutung angemessen. „Herr“ bewahrt die offene, respektvolle Anrede κύριε. „Reinigen“ erhält die körperlichen sowie kultisch-sozialen Konnotationen von καθαρίζω, ohne sie zu einer ausschließlich medizinischen Heilung einzuengen.
