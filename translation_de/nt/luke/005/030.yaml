  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: de
  text: 'Und die Pharisäer und ihre Schriftgelehrten murrten[a] bei seinen Jüngern und sagten: »Warum esst und trinkt ihr mit den Zolleinnehmern und Sündern?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: murmelten.'
    reason: Das griechische Verb kann eine leise oder halblaute, missmutige Beschwerde bezeichnen und nicht nur einen offen vorgebrachten Einwand.
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: murrten
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Klagen. »Murrten« bewahrt den Unterton einer missmutig gemurmelten Beschwerde.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Die geläufige historische Bezeichnung gibt den Ausdruck direkt wieder, ohne die Funktion der Gruppe erklärend auszudeuten.
- source_word: αὐτῶν
  choice: ihre
  rationale: Das Genitivpronomen bezieht die Schriftgelehrten in der naheliegenden syntaktischen Lesart auf die Pharisäer; die knappe Formulierung des Griechischen bleibt erhalten.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες
  choice: und sagten zu seinen Jüngern
  rationale: πρός mit Akkusativ bezeichnet hier die Richtung der Rede. Die deutsche Satzstellung verbindet die Adressaten natürlich mit dem Verb des Sagens.
- source_word: Διὰ τί
  choice: Warum
  rationale: Die unmittelbare und idiomatische deutsche Entsprechung der Frageformel.
- source_word: τελωνῶν
  choice: Zolleinnehmern
  rationale: Der Ausdruck bezeichnet Personen, die Zölle beziehungsweise Abgaben einnahmen, und bewahrt die historisch-soziale Gruppenbezeichnung.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Die direkte Wiedergabe erhält die moralisch und gesellschaftlich wertende Kategorie der Sprecher, ohne sie abzuschwächen oder zu erklären.
- source_word: ἐσθίετε καὶ πίνετε
  choice: esst und trinkt ihr
  rationale: Der Präsens wird als direkte Frage natürlich wiedergegeben; die konkreten Verben bleiben gegenüber einer deutenden Paraphrase wie »haltet Tischgemeinschaft« erhalten.
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss an den vorhergehenden Erzählgang wird beibehalten.
theological_decisions:
- issue: Sozial-religiöse Bedeutung des Essens und Trinkens mit »Zolleinnehmern und Sündern«
  choice: Der konkrete Vorwurf bleibt ohne erklärende Erweiterung stehen.
  alternative: Die beanstandete Tischgemeinschaft ausdrücklich als rituelles oder moralisches Vergehen deuten.
  rationale: Der Vers nennt die von den Sprechern abgegrenzten Gruppen und das gemeinsame Essen und Trinken, erläutert aber die genaue Art des Anstoßes nicht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Murrten« ist prägnant und bibelsprachlich vertraut, bleibt aber allgemein verständlich. Die direkte Rede ist natürlich formuliert; die historische Gruppenbezeichnung »Schriftgelehrte« wird beibehalten.
