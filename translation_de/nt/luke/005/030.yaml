  source_fidelity: Die Übersetzung gibt die Personengruppen, den fortlaufend-beschwerenden Charakter von ἐγόγγυζον, die Ausrichtung der Rede an Jesu Jünger sowie die Frage nach Essen und Trinken mit Zolleinnehmern und Sündern sachgerecht wieder. »Zolleinnehmer« ist für τελῶναι als historisch konkrete Gruppenbezeichnung vertretbar. Die Verbindung des Murrens mit den Jüngern sollte jedoch syntaktisch ausdrücklich markiert werden, da πρὸς τοὺς μαθητὰς αὐτοῦ auch zu ἐγόγγυζον gehört.
  naturalness: »Murrten« ist verständliches, würdiges modernes Standarddeutsch und trifft den missmutig-leisen Unterton gut. »Murrten bei seinen Jüngern« ist eine natürliche Formulierung für die an sie gerichtete Beschwerde. Die bisherige Fußnotenformulierung »beklagten sich murmelnd« klingt dagegen unnötig umschreibend und ist keine gleichrangige knappe Übersetzungsalternative.
  terminology: »Pharisäer«, »Schriftgelehrte«, »Zolleinnehmer« und »Sünder« sind etablierte und quellentreue Bezeichnungen. Die wertende Kategorie »Sünder« bleibt zutreffend als Sprecherkategorie erhalten, ohne den sozialen und religiösen Hintergrund über den Text hinaus auszudeuten.
