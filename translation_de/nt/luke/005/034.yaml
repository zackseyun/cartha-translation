source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Ihr könnt doch die Hochzeitsgäste nicht zum Fasten bringen, solange der Bräutigam bei ihnen ist, oder?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Ihr könnt doch … nicht …, oder?
  rationale: Die mit μή eingeleitete Frage erwartet eine verneinende Antwort. Die deutsche Formulierung mit „doch … nicht …, oder?“ gibt diese rhetorische Erwartung natürlich wieder.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: die Hochzeitsgäste
  rationale: Die wörtliche Wendung „Söhne des Hochzeitssaals/Brautgemachs“ ist ein Idiom für die zur Hochzeitsgesellschaft gehörenden Menschen, insbesondere die Gefährten des Bräutigams. „Hochzeitsgäste“ vermittelt den Sinn in verständlichem modernem Deutsch.
- source_word: νυμφίος
  choice: Bräutigam
  rationale: „Bräutigam“ ist die direkte und geläufige deutsche Entsprechung und bewahrt das für den Ausspruch wichtige Hochzeitsbild.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: bei ihnen ist
  rationale: Die Formulierung gibt die persönliche Anwesenheit des Bräutigams in ihrer Gesellschaft direkt und natürlich wieder.
- source_word: ποιῆσαι νηστεῦσαι
  choice: zum Fasten bringen
  rationale: ποιέω mit Infinitiv hat hier kausative Bedeutung. „Zum Fasten bringen“ bewahrt diese, ohne die Aussage so stark wie „zum Fasten zwingen“ auszulegen.
- source_word: ἐν ᾧ
  choice: solange
  rationale: Im Zusammenhang bezeichnet die Wendung den Zeitraum, während dessen der Bräutigam bei ihnen ist. „Solange“ ist dafür eine natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Bildhafte Identifizierung Jesu mit dem Bräutigam
  choice: Das Bild des Bräutigams bleibt ohne erklärenden Zusatz stehen.
  alternative: Im Text ausdrücklich erklären, dass Jesus sich selbst als Bräutigam bezeichnet.
  rationale: Der Vers legt die Verbindung im Kontext nahe, erläutert ihre theologische Bedeutung hier aber nicht. Die Übersetzung bewahrt deshalb das Bild und seine Spannung, ohne es interpretierend auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage klingt mündlich und klar; „zum Fasten bringen“ erhält den im Griechischen ausdrücklich vorhandenen kausativen Sinn.
