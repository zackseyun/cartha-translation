  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: de
  text: Denn Staunen hatte ihn und alle, die bei ihm waren, ergriffen über den Fang der Fische, die sie gefangen hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: Staunen
  rationale: Das Substantiv bezeichnet ein überwältigendes Erstaunen. „Staunen“ ist im modernen Deutsch verständlich und lässt offen, in welchem Maß sich damit Erschrecken oder Ehrfurcht verband.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet Simons Reaktion im vorhergehenden Vers und wird durch das erklärende „Denn“ knapp und genau wiedergegeben.
- source_word: περιέσχεν
  choice: hatte … ergriffen
  rationale: Das Verb hat hier bei einem Empfindungswort als Subjekt den Sinn „ergreifen, ganz in Beschlag nehmen“. Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass dieses Staunen Simons vorausgehender Reaktion zugrunde lag.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: alle, die bei ihm waren
  rationale: Die Formulierung bewahrt den umfassenden Bezug auf sämtliche anwesenden Begleiter Simons und klingt zugleich natürlich.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: über den Fang der Fische
  rationale: ἄγρα bezeichnet hier den erzielten Fang; ἐπί nennt den Anlass des Staunens. „Über“ gibt diese Reaktion idiomatisch wieder, ohne den Ausdruck auf die bloße Tätigkeit des Fischens zu verengen.
- source_word: ὧν συνέλαβον
  choice: die sie gefangen hatten
  rationale: Das Relativpronomen bezieht sich grammatisch auf die Fische, und der Plural des Verbs schließt die beteiligte Gruppe ein. Die Wiedergabe wahrt diesen Bezug und die Vorzeitigkeit im Deutschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die leichte Wiederholung „Fang … gefangen“ folgt bewusst dem griechischen Bezug und vermeidet eine erklärende Umschreibung wie „die Menge der Fische“.
