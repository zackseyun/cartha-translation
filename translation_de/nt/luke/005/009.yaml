    rationale: Im vorliegenden Kontext ist συνέλαβον die gewöhnliche Bezeichnung für „fangen“; ein ausdrückliches gemeinsames Fangen wird durch diese Form nicht zuverlässig als zusätzliche semantische Aussage markiert. Die Fußnote führt daher eine nicht hinreichend abgesicherte Nuance ein. Zudem wiederholt sie den Haupttext weitgehend, ohne eine notwendige Übersetzungsalternative zu bieten.
