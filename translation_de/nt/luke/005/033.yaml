source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: de
  text: 'Da sagten sie zu ihm: »Die Jünger des Johannes fasten oft und verrichten Gebete, ebenso auch die der Pharisäer[a]; deine dagegen essen und trinken.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die der Pharisäer“; aus dem vorhergehenden Satzglied ist „Jünger“ mitzudenken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Jünger“. Im Griechischen steht nur „deine“; „Jünger“ ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Da sagten sie zu ihm
  rationale: δέ ist hier ein milder erzählerischer Anschluss. „Da“ gibt den Fortgang der Szene natürlich wieder, ohne einen starken Gegensatz einzutragen.
- source_word: μαθηταὶ Ἰωάννου
  choice: die Jünger des Johannes
  rationale: Der Genitiv bezeichnet die Zuordnung zu Johannes; diese Formulierung ist im Deutschen klar und idiomatisch.
- source_word: νηστεύουσιν πυκνά
  choice: fasten oft
  rationale: πυκνά wird adverbial gebraucht und bezeichnet die Häufigkeit einer wiederholten Praxis.
- source_word: δεήσεις ποιοῦνται
  choice: sprechen Gebete
  rationale: Die Wendung enthält das Substantiv δεήσεις und bezeichnet vollzogene Gebete beziehungsweise Bitten. „Gebete sprechen“ bewahrt den nominalen Ausdruck und klingt im modernen Deutschen natürlicher als „Gebete machen“.
- source_word: ὁμοίως καὶ
  choice: ebenso auch
  rationale: Die Wiedergabe bildet sowohl ὁμοίως als auch das hinzufügende καί ab und bleibt zugleich flüssig.
- source_word: οἱ τῶν Φαρισαίων
  choice: die der Pharisäer
  rationale: Im Griechischen ist „Jünger“ aus dem vorhergehenden Satzglied zu ergänzen. Die deutsche Ellipse „die der Pharisäer“ erhält diese knappe Struktur verständlich.
- source_word: οἱ δὲ σοὶ
  choice: deine dagegen
  rationale: σοί steht substantiviert und elliptisch für die Jesus zugeordneten Jünger. „Deine“ bewahrt die Kürze; „dagegen“ macht den durch δέ markierten Kontrast deutlich.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: essen und trinken
  rationale: Die Präsensformen beschreiben hier eine charakteristische oder wiederkehrende Praxis; das einfache deutsche Präsens entspricht dem.
theological_decisions:
- issue: Ob das im Griechischen ausgelassene Wort „Jünger“ in den beiden Vergleichsgliedern ausdrücklich ergänzt werden soll
  choice: Die Ellipse wird im Haupttext mit „die der Pharisäer“ und „deine“ bewahrt.
  alternative: „die Jünger der Pharisäer“ und „deine Jünger“ ausdrücklich schreiben
  rationale: Beide Ergänzungen sind sachlich naheliegend, stehen aber nicht ausdrücklich im griechischen Text. Die gewählte Form bleibt im Deutschen verständlich und macht die knappe Struktur der Vorlage sichtbar, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechischen Ellipsen werden soweit möglich erhalten; die Fußnoten erläutern die jeweils mitgemeinten Jünger. Die Zeichensetzung gliedert den parallelen Vergleich und den abschließenden Gegensatz.
