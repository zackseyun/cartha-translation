  source_fidelity: Die Gegenüberstellung der beiden Infinitivgruppen ist vollständig wiedergegeben. »Deine Sünden sind dir vergeben« gibt die perfekte Passivform Ἀφέωνταί idiomatisch als bestehenden Zustand wieder, ohne die im Passiv nicht ausdrücklich genannte handelnde Instanz zu bestimmen. »Steh auf« entspricht Ἔγειρε präzise. Bei περιπάτει ist »geh« im Deutschen die natürlichere Wiedergabe des hier gemeinten tatsächlichen Gehens; »umher« fügt die Nuance des Umhergehens bzw. Herumgehens hinzu, die der Kontext nicht erfordert.
