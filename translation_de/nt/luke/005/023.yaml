  terminology: »Sünden« und »vergeben« sind die etablierten, verständlichen Begriffe. Der Dativ »dir« bewahrt die persönliche Anrede. Die Fußnote bietet eine mögliche stärker ereignisbezogene deutsche Umschreibung der griechischen Perfektform, ohne eine theologische Deutung festzulegen.
