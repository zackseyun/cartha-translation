id: LUK.5.23
reference: Luke 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: de
  text: 'Was ist leichter: zu sagen: »Deine Sünden sind dir vergeben[a]«, oder zu sagen: »Steh auf und geh«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Sünden sind dir vergeben worden.«'
    reason: Die Alternative gibt die abgeschlossene, für die Gegenwart wirksame Handlung der griechischen Perfektform stärker als Vorgang wieder, klingt im Deutschen jedoch schwerfälliger.
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Was ist leichter
  rationale: Die idiomatische Frage gibt den Vergleich des griechischen Komparativs εὐκοπώτερον natürlich und genau wieder.
- source_word: εἰπεῖν
  choice: zu sagen
  rationale: Der Infinitiv leitet jeweils den Inhalt der beiden einander gegenübergestellten Äußerungen ein.
- source_word: Ἀφέωνταί
  choice: sind vergeben
  rationale: Im Zusammenhang bezeichnet ἀφίημι die Vergebung von Sünden. Die Form drückt einen gegenwärtigen Zustand als Ergebnis einer vollzogenen Handlung aus; »sind vergeben« bewahrt dies idiomatisch, ohne die Zeitform übermäßig auszudeuten.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet die angesprochene Person und wird im Deutschen natürlich mit »dir« wiedergegeben.
- source_word: αἱ ἁμαρτίαι σου
  choice: deine Sünden
  rationale: Dies ist die direkte und idiomatische Wiedergabe der griechischen Possessivkonstruktion.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion stellt die beiden Aussagen einander gegenüber.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der Imperativ fordert den Gelähmten auf, sich zu erheben. »Steh auf« ist im modernen Deutschen natürlich und präzise.
- source_word: καὶ περιπάτει
  choice: und geh umher
  rationale: περιπατέω bezeichnet hier das tatsächliche Gehen. »Geh umher« bildet gegenüber bloßem »geh« die Bedeutung des griechischen Verbs etwas deutlicher ab, ohne metaphorischen Sinn einzutragen.
theological_decisions:
- issue: Wiedergabe der Vergebungsaussage ohne zusätzliche dogmatische Festlegung durch die griechische Perfekt-Passiv-Form
  choice: Deine Sünden sind dir vergeben
  alternative: Deine Sünden sind dir vergeben worden
  rationale: Die Formulierung bewahrt die deklarative Kraft und den bestehenden Zustand der Vergebung, ohne Zeitpunkt oder handelnde Instanz stärker festzulegen, als es die passive Form im Kontext tut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Struktur »zu sagen … oder zu sagen« bleibt zur Hervorhebung des Vergleichs erhalten.
