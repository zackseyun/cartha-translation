  to: Doch es werden Tage kommen, und wenn der Bräutigam von ihnen weggenommen wird, dann werden sie in jenen Tagen fasten.
  rationale: Die Übersetzung wird ausschließlich bei der Wiedergabe von ἀπαρθῇ angepasst. „Von ihnen weggenommen wird“ entspricht der passiven Trennung im griechischen Text, bleibt in der Deutung offen und ist im modernen Standarddeutsch idiomatisch. Alle übrigen Elemente der Vorlage, einschließlich der Wiederholung von „Tagen“, bleiben erhalten.
