id: LUK.5.35
reference: Luke 5:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: de
  text: Doch es werden Tage kommen, und wenn der Bräutigam von ihnen weggenommen wird, dann werden sie in jenen Tagen fasten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: es werden Tage kommen
  rationale: Die griechische Wendung wird eng und zugleich idiomatisch wiedergegeben; der fehlende Artikel bleibt durch „Tage“ ohne bestimmten Artikel erhalten.
- source_word: δὲ
  choice: Doch
  rationale: δέ setzt die künftige Lage mild kontrastierend von der gegenwärtigen Situation ab.
- source_word: ὅταν
  choice: wenn
  rationale: Mit dem Aorist Konjunktiv bezeichnet ὅταν hier ein erwartetes zukünftiges Geschehen; „wenn“ ist im Deutschen natürlich und wahrt den zeitlichen Bezug.
- source_word: ἀπαρθῇ
  choice: entrissen wird
  rationale: Das Passiv von ἀπαίρω bezeichnet hier nicht bloß ein Fortgehen, sondern eine von außen bewirkte Wegnahme. „Entrissen wird“ erhält die bedrohliche und gewaltsame Nuance.
- source_word: ἀπ’ αὐτῶν
  choice: ihnen
  rationale: Der Dativ bei „jemandem entrissen werden“ gibt die Trennung von den Jüngern im Deutschen natürlich wieder.
- source_word: ὁ νυμφίος
  choice: der Bräutigam
  rationale: „Bräutigam“ ist die präzise und etablierte deutsche Entsprechung für νυμφίος und bewahrt das Hochzeitsbild.
- source_word: τότε
  choice: dann
  rationale: „Dann“ kennzeichnet knapp die zeitliche Folge nach der Wegnahme des Bräutigams.
- source_word: νηστεύσουσιν
  choice: werden sie ... fasten
  rationale: νηστεύω bezeichnet religiöses Fasten; die deutsche Verbwahl bewahrt diesen Sinn.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Die Wiederaufnahme von „Tage“ wird entsprechend dem Griechischen beibehalten und durch „jenen“ deutlich auf die angekündigte Zeit bezogen.
theological_decisions:
- issue: Ob das Passiv ἀπαρθῇ zu einem neutralen Fortgehen abgeschwächt werden soll
  choice: „ihnen der Bräutigam entrissen wird“
  alternative: „der Bräutigam von ihnen fortgeht“ oder „sie verlässt“
  rationale: Die gewählte Formulierung bewahrt das Passiv und die unheilvolle Vorstellung einer von außen bewirkten Wegnahme, ohne die mögliche Vorausdeutung auf Jesu Tod ausdrücklich auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierende Struktur des Griechischen („und wenn …, dann …“) sowie die betonte Wiederholung von „Tage“ bleiben erhalten. „Entrissen“ ist stärker als „weggenommen“, entspricht aber der kontextuell bedrohlichen Nuance des Verbs und klingt in diesem Bild natürlich.
