review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur, Zukunftsbezug, das Passiv bei ἀπαρθῇ, die zeitliche Folge mit τότε und die abschließende Wiederaufnahme „in jenen Tagen“ sind zutreffend wiedergegeben. „Entrissen“ legt jedoch eine stärkere, ausdrücklich gewaltsame Nuance nahe, die das griechische ἀπαρθῇ hier nicht zwingend trägt. „Weggenommen wird“ bewahrt die passive, nicht bloß freiwillige Trennung, ohne die Aussage zu überzeichnen.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und gut verständlich. Die Formulierung „ihnen der Bräutigam entrissen wird“ ist zwar möglich, wirkt aber stilistisch und semantisch stärker als nötig. „Der Bräutigam von ihnen weggenommen wird“ ist natürlich und macht die im Griechischen ausgedrückte Trennung explizit.
  terminology: „Bräutigam“ und „fasten“ sind präzise und im biblischen Register angemessen. „Jenen Tagen“ gibt ἐν ἐκείναις ταῖς ἡμέραις gut wieder. Für ἀπαρθῇ ist „weggenommen wird“ die ausgewogenere deutsche Entsprechung; sie wahrt das Passiv und vermeidet eine nicht erforderliche Festlegung auf gewaltsames Entreissen.
