  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: de
  text: Da sie wegen der Menschenmenge keinen Weg fanden, ihn hineinzubringen,[a] stiegen sie auf das Dach und ließen ihn mitsamt seiner Matte durch die Dachziegel[b] hinunter in die Mitte, vor Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da sie wegen der Menschenmenge nicht herausfanden, wie sie ihn hineinbringen sollten.« Die griechische Wendung kann sowohl den Zugangsweg als auch die Art und Weise betonen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die Ziegel des Daches. Lukas beschreibt damit eine mit Ziegeln gedeckte Dachkonstruktion.
    reason: cultural_note
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: keinen Weg fanden, ihn hineinzubringen
  rationale: Die elliptische Wendung bezeichnet, auf welchem Weg oder auf welche Weise sie ihn hineinbringen könnten. Die deutsche Formulierung ist natürlich und lässt beide Nuancen anklingen.
- source_word: διὰ τὸν ὄχλον
  choice: wegen der Menschenmenge
  rationale: 'διά mit Akkusativ ist hier kausal: Die Menschenmenge verhindert den Zugang.'
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: stiegen sie auf das Dach
  rationale: δῶμα bezeichnet das Dach beziehungsweise die begehbare Dachfläche; die Formulierung gibt Bewegung und Ziel klar wieder.
- source_word: διὰ τῶν κεράμων
  choice: durch die Dachziegel
  rationale: κέραμοι sind hier die Ziegel der Dachkonstruktion. 'Dachziegel' macht den architektonischen Bezug im Deutschen unmittelbar deutlich.
- source_word: καθῆκαν
  choice: ließen ... hinunter
  rationale: Das Verb bezeichnet das Herablassen von oben. Die getrennte Verbform klingt im Deutschen in diesem Satz natürlicher als 'senkten'.
- source_word: σὺν τῷ κλινιδίῳ
  choice: mitsamt seiner Matte
  rationale: κλινίδιον bezeichnet ein kleines Bett, eine Liege oder Schlafmatte. 'Matte' ist verständlich und vermeidet die moderne medizinische Festlegung von 'Trage'; 'seiner' ergibt sich aus dem Kontext.
- source_word: εἰς τὸ μέσον
  choice: in die Mitte
  rationale: Die Wendung bezeichnet den mittleren Bereich der versammelten Menschen.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: direkt vor Jesus
  rationale: Die Wendung ist räumlich zu verstehen. 'Direkt' verdeutlicht im Deutschen idiomatisch die konkrete Platzierung vor Jesus, ohne eine theologische Zusatzbedeutung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzbewegung des griechischen Textes bleibt erhalten, wird aber durch deutsche Nebensatz- und Verbklammerstruktur natürlich wiedergegeben. 'Menschenmenge' ist präziser und weniger umgangssprachlich als 'Gedränge'; 'Matte' bleibt bewusst allgemein.
