  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: de
  text: Und er sah zwei Boote am See liegen; die Fischer aber waren aus ihnen ausgestiegen und wuschen die Netze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: sah
  rationale: Der Aorist von ὁράω wird im erzählenden Zusammenhang natürlich mit „sah“ wiedergegeben.
- source_word: δύο πλοῖα
  choice: zwei Boote
  rationale: Im Zusammenhang mit dem Fischfang auf dem See bezeichnet πλοῖον hier natürlich Boote, nicht größere Schiffe.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: am See liegen
  rationale: ἑστῶτα beschreibt die Boote in ruhender Position. Bei Booten ist „liegen“ im Deutschen idiomatischer als das wörtlichere „stehen“; „vor Anker liegen“ wäre zu spezifisch.
- source_word: οἱ δὲ ἁλιεῖς
  choice: die Fischer aber
  rationale: Die Stellung von „aber“ bewahrt den leichten Kontrast beziehungsweise Szenenwechsel, den δέ kennzeichnet.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: waren aus ihnen ausgestiegen
  rationale: Das vorzeitige Aoristpartizip bezeichnet das Aussteigen aus den Booten als bereits erfolgt. Das Plusquamperfekt gibt diese zeitliche Beziehung im Deutschen klar und natürlich wieder, ohne ausdrücklich ein Anlanden hinzuzufügen.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: wuschen die Netze
  rationale: Der Imperfekt stellt das Waschen als andauernde Hintergrundhandlung dar; im Deutschen kann das einfache Präteritum diesen narrativen Verlauf natürlich ausdrücken. Der bestimmte Artikel entspricht dem griechischen Text, ohne einen nicht ausdrücklich gesetzten Possessivartikel einzufügen.
