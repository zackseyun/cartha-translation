id: LUK.5.24
reference: Luke 5:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: de
  text: 'Damit ihr aber wisst, dass der Menschensohn[a] Vollmacht hat, auf der Erde Sünden zu vergeben – sagte er zu dem Gelähmten: »Dir sage ich: Steh auf, nimm deine Matte[b] und geh nach Hause!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Sohn des Menschen«. »Menschensohn« ist Jesu Selbstbezeichnung und erinnert besonders an Daniel 7.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »dein Bett« beziehungsweise »dein Lager«. Das griechische Wort bezeichnet eine kleine Liegestatt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Damit ihr aber wisst
  rationale: Die Formulierung bewahrt sowohl den durch δέ markierten Übergang als auch den Zweck- beziehungsweise Folgesinn von ἵνα; εἰδῆτε bezeichnet hier gesicherte Erkenntnis.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe erhält Jesu Selbstbezeichnung sowie ihre biblischen, besonders danielischen, Anklänge.
- source_word: ἐξουσίαν ἔχει
  choice: Vollmacht hat
  rationale: Vollmacht bezeichnet das rechtmäßige Verfügungsrecht und nicht bloß Fähigkeit oder Kraft; dies entspricht dem Streit um die Befugnis zur Sündenvergebung.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die räumliche Wendung wird direkt wiedergegeben, ohne den möglichen Gegensatz zwischen Himmel und Erde erklärend auszubauen.
- source_word: ἀφιέναι ἁμαρτίας
  choice: Sünden zu vergeben
  rationale: ἀφίημι bezeichnet in diesem Zusammenhang das Erlassen beziehungsweise Vergeben von Sünden.
- source_word: τῷ παραλελυμένῳ
  choice: zu dem Gelähmten
  rationale: Das substantivierte Partizip wird in natürlichem, respektvollem Deutsch wiedergegeben.
- source_word: Σοὶ λέγω
  choice: Dir sage ich
  rationale: Die Voranstellung von σοί wird durch das vorangestellte »Dir« bewahrt und hebt den unmittelbar Angesprochenen hervor.
- source_word: ἔγειρε
  choice: Steh auf
  rationale: Die Wendung ist ein natürlicher deutscher Imperativ für das sofortige Aufrichten des Gelähmten.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: nimm deine Matte
  rationale: Das partizipiale ἄρας ist in der deutschen Befehlsfolge idiomatisch als weiterer Imperativ wiedergegeben; κλινίδιον bezeichnet ein kleines Lager, eine Matte oder ein einfaches Bett.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: geh nach Hause
  rationale: Die idiomatische deutsche Wendung entspricht dem Zielausdruck »in dein Haus« und vermeidet unnatürliche Wörtlichkeit.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der menschliche Eine
  rationale: »Menschensohn« bewahrt die anerkannte christologische Selbstbezeichnung und ihre mögliche Resonanz mit Daniel 7, ohne die Spannung durch eine erklärende Paraphrase aufzulösen.
- issue: Bedeutungsnuance von ἐξουσία bei der Sündenvergebung
  choice: Vollmacht
  alternative: Macht
  rationale: Der Zusammenhang betrifft Jesu rechtmäßige Befugnis, Sünden zu vergeben, nicht nur seine Fähigkeit, ein Wunder zu vollbringen.
- issue: Bezug von ἐπὶ τῆς γῆς
  choice: auf der Erde
  alternative: im irdischen Bereich
  rationale: Die schlichte räumliche Formulierung lässt offen, wie der angedeutete Gegensatz zum Himmel genauer zu bestimmen ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist knapp und bestimmt; »Vollmacht« erhält die rechtliche und theologische Nuance des Ausgangstextes.
