id: LUK.5.17
reference: Luke 5:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: de
  text: 'Und es geschah an einem jener Tage: Jesus lehrte, und Pharisäer und Gesetzeslehrer saßen dabei. Sie waren aus allen Dörfern Galiläas und Judäas und aus Jerusalem gekommen. Und die Kraft des Herrn war da, damit er heilen konnte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „um sie zu heilen“ statt: „damit er heilen konnte“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: es geschah an einem jener Tage
  rationale: Die geläufige lukanische Erzählformel wird würdig und verständlich wiedergegeben; „jener Tage“ bewahrt den rückverweisenden Zusammenhang.
- source_word: αὐτὸς ἦν διδάσκων
  choice: Jesus lehrte
  rationale: Die periphrastische Imperfektform bezeichnet eine fortdauernde Tätigkeit. Der Eigenname macht den deutschen Satz eindeutig, ohne αὐτός künstlich durch „selbst“ zu betonen.
- source_word: καθήμενοι
  choice: saßen dabei
  rationale: Dies gibt sowohl ihre sitzende Haltung als auch ihre Anwesenheit in der Lehrsituation natürlich wieder.
- source_word: νομοδιδάσκαλοι
  choice: Gesetzeslehrer
  rationale: Der etablierte deutsche Ausdruck gibt die Tätigkeit dieser Lehrer des mosaischen Gesetzes präzise wieder.
- source_word: ἐκ πάσης κώμης
  choice: aus allen Dörfern
  rationale: κώμη bezeichnet ein Dorf beziehungsweise eine kleinere Ortschaft. Der idiomatische deutsche Plural gibt den distributiven Sinn von πάσης wieder, ohne zu behaupten, ausnahmslos jedes einzelne Dorf sei vertreten gewesen.
- source_word: δύναμις κυρίου
  choice: die Kraft des Herrn
  rationale: „Kraft“ bewahrt den theologischen Gehalt von δύναμις; „Herr“ ist die sachgemäße offene Wiedergabe von κύριος.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: war da, damit er heilte
  rationale: Die Formulierung gibt die Zweck- beziehungsweise Ergebnisrichtung von εἰς τό mit Infinitiv wieder und lässt den Singular αὐτόν als Bezug auf Jesus erkennen, ohne ein im Ausgangstext fehlendes Heilungsobjekt einzufügen.
theological_decisions:
- issue: Bezug und Sinn von δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Die Kraft des Herrn war da, damit Jesus heilte.
  alternative: Die Kraft des Herrn war da, um sie zu heilen.
  rationale: Der vorgelegte SBLGNT-Text liest αὐτόν, nicht αὐτούς. Daher wird im Haupttext kein pluralisches Objekt „sie“ ergänzt. Zugleich bleibt κύριος als „Herr“ offen und die göttliche Kraft in Jesu Heilungswirken klar erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in drei Sätze gegliedert. Der Marker [a] steht unmittelbar bei der textkritisch betroffenen Wendung.
