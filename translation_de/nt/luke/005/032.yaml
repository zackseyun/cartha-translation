  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: de
  text: Ich bin nicht gekommen, Gerechte zu rufen, sondern Sünder zur Umkehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Sinnesänderung“; auch: „zur Buße“. Die griechische Wendung bezeichnet das Ziel oder den Zweck des Rufens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Ich bin … gekommen
  rationale: Das Perfekt bezeichnet das vollzogene Kommen mit gegenwärtiger Bedeutung und ist in einer Aussage über Jesu Sendung im Deutschen idiomatisch so wiederzugeben.
- source_word: καλέσαι
  choice: zu rufen
  rationale: Der Aoristinfinitiv bezeichnet hier den Zweck des Kommens. „Rufen“ wahrt sowohl den Gedanken einer Einladung als auch den eines verbindlichen Rufes, ohne sich auf einen davon festzulegen.
- source_word: δικαίους
  choice: Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet „Gerechte“. Die unbestimmte Form klingt im Deutschen natürlich und lässt offen, ob tatsächlich Gerechte oder als gerecht Geltende gemeint sind.
- source_word: ἁμαρτωλούς
  choice: Sünder
  rationale: Die geläufige substantivische Wiedergabe bewahrt die moralische und gesellschaftliche Kategorie des griechischen Ausdrucks.
- source_word: εἰς μετάνοιαν
  choice: zur Umkehr
  rationale: εἰς bezeichnet Ziel oder Zweck; „zur Umkehr“ gibt μετάνοια im neutestamentlichen Kontext natürlich und umfassend wieder, ohne es auf einen bloßen Sinneswandel zu verengen.
theological_decisions:
- issue: Ob Jesus die Existenz wirklich Gerechter verneint oder von Menschen spricht, die als gerecht gelten
  choice: Die Kategorien „Gerechte“ und „Sünder“ bleiben ohne erklärenden Zusatz stehen.
  alternative: „die sich für gerecht halten“ oder „die als gerecht gelten“
  rationale: Im griechischen Satz fehlen ausdrückliche Ironie- oder Qualifikationsmerkmale. Eine Präzisierung würde die theologische Spannung interpretierend auflösen.
- issue: Bedeutungsumfang von μετάνοια
  choice: „Umkehr“
  alternative: „Sinnesänderung“ oder „Buße“
  rationale: „Umkehr“ bezeichnet im heutigen Deutschen verständlich die grundlegende Neuausrichtung, die μετάνοια hier meint. „Sinnesänderung“ kann zu rein innerlich-intellektuell wirken, während „Buße“ heute leicht als Strafleistung missverstanden wird.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Der knappe Parallelismus und der Gegensatz zwischen „Gerechte“ und „Sünder“ bleiben erhalten.
