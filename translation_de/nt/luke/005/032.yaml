  verdict: approve
  source_fidelity: „Ich bin nicht gekommen“ gibt das Perfekt οὐκ ἐλήλυθα idiomatisch und aspektuell angemessen wieder. „zu rufen“ entspricht dem finalen Infinitiv καλέσαι. Die Gegenüberstellung „Gerechte“ und „Sünder“ wahrt die substantivierten Pluralformen ohne unzulässige Auslegung. „zur Umkehr“ gibt εἰς μετάνοιαν als Ziel des Rufens treffend wieder.
  naturalness: Der Satz ist klares, modernes Standarddeutsch und bewahrt den knappen, antithetischen Stil der Vorlage. Wortstellung und Register sind für eine Bibelübersetzung natürlich.
  terminology: „Gerechte“, „Sünder“ und besonders „Umkehr“ sind im gegenwärtigen deutschen Bibelregister präzise und verständlich. „Umkehr“ ist gegenüber dem englischen „change of mind“ sachgerechter, da μετάνοια im Kontext nicht auf einen bloß intellektuellen Meinungswechsel eingeengt wird. Die Fußnote nennt mit „Sinnesänderung“ und „Buße“ vertretbare Alternativen, ohne eine konfessionelle Deutung festzulegen.
