  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: de
  text: Und sofort stand er vor ihnen auf, nahm das auf, worauf er gelegen hatte,[a] und ging in sein Haus; dabei verherrlichte er Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Matte, auf der er gelegen hatte“. Wörtlich: „das, worauf er gelegen hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: sofort
  rationale: Das Adverb bezeichnet ein Geschehen ohne Verzögerung; „sofort“ ist im modernen Deutschen natürlich und bewahrt den Akzent auf der unmittelbaren Heilung.
- source_word: ἀναστὰς
  choice: stand er … auf
  rationale: Das Aoristpartizip wird als finites Verb in einer natürlichen deutschen Handlungsfolge wiedergegeben.
- source_word: ἐνώπιον αὐτῶν
  choice: vor ihnen
  rationale: Die Wendung bezeichnet die öffentlich sichtbare Handlung in ihrer Gegenwart, ohne das stärker deutende „vor ihren Augen“ einzutragen.
- source_word: ἄρας
  choice: nahm
  rationale: αἴρω bezeichnet hier das Aufnehmen des Gegenstands, auf dem der Mann gelegen hatte. „Nahm“ ist knapp und wird durch den Kontext eindeutig.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: das, worauf er gelegen hatte
  rationale: Die substantivierte Relativkonstruktion des Griechischen wird bewahrt, da der Vers selbst weder „Matte“ noch „Bett“ ausdrücklich nennt.
- source_word: κατέκειτο
  choice: gelegen hatte
  rationale: Das Plusquamperfekt gibt aus der Perspektive der folgenden Handlung seinen zuvor andauernden Zustand idiomatisch wieder.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: ging in sein Haus
  rationale: Die Formulierung bewahrt sowohl die Wegbewegung von dort als auch den konkreten Ausdruck οἶκος, bleibt dabei aber verständliches modernes Deutsch.
- source_word: δοξάζων τὸν θεόν
  choice: dabei verherrlichte er Gott
  rationale: Die Beiordnung mit „dabei“ gibt das begleitende Partizip natürlich wieder; „verherrlichte“ bewahrt die auf Gottes Ehre gerichtete Bedeutung von δοξάζω.
theological_decisions:
- issue: Ob der getragene Gegenstand im Haupttext als „Matte“ oder „Bett“ bezeichnet werden soll
  choice: Die unbestimmte Relativformulierung „das, worauf er gelegen hatte“ bleibt im Haupttext erhalten.
  alternative: „die Matte, auf der er gelegen hatte“ oder „das Bett, auf dem er gelegen hatte“
  rationale: Der griechische Vers nennt an dieser Stelle keinen Gegenstand ausdrücklich. Die gewählte Fassung vermeidet eine nicht geforderte Festlegung; die anschaulichere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die Satzfolge bleibt eng am griechischen Text, während die Partizipien in idiomatische deutsche Verbformen überführt werden.
