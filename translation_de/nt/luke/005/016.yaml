  naturalness: 'Der Haupttext ist modernes, flüssiges Standarddeutsch. Die derzeitige Fußnote ist dagegen unnötig schwerfällig: „war dabei, sich … zurückzuziehen“ klingt im Deutschen nach einer gerade ablaufenden Einzelszene und ist als angeblich wörtlichere Wiedergabe nicht besonders hilfreich.'
