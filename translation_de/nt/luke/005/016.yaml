  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: de
  text: Er aber zog sich immer wieder in einsame Gegenden zurück und betete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er aber zog sich jeweils in einsame Gegenden zurück und betete.“ Im Griechischen steht eine Umschreibung aus Imperfekt und Partizipien, die fortdauerndes oder wiederholtes Handeln ausdrücken kann.'
    reason: Grammatische und lexikalische Alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen bezeichnet Jesus und trägt eine leichte Hervorhebung; im Deutschen wird diese zusammen mit dem vorangestellten „Er aber“ natürlich wiedergegeben.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier einen milden Gegensatz zur wachsenden öffentlichen Aufmerksamkeit im vorausgehenden Zusammenhang.
- source_word: ἦν ὑποχωρῶν
  choice: zog sich immer wieder … zurück
  rationale: Die Verbindung aus Imperfekt von εἰμί und Präsenspartizip beschreibt am ehesten eine fortdauernde beziehungsweise gewohnheitsmäßige Handlung in der Vergangenheit.
- source_word: ἐν ταῖς ἐρήμοις
  choice: in einsame Gegenden
  rationale: Der substantivisch gebrauchte Plural bezeichnet unbewohnte, abgelegene Orte. „Einsame Gegenden“ vermeidet die im Deutschen mögliche Verengung von „Wüste“ auf eine bestimmte Landschaftsform und wahrt mit „in“ die Präposition.
- source_word: καὶ
  choice: und
  rationale: Einfache Verknüpfung der beiden wiederholt ausgeübten Handlungen.
- source_word: προσευχόμενος
  choice: betete
  rationale: Das koordinierte Partizip bezeichnet das mit dem Rückzug verbundene, ebenfalls wiederkehrende Beten; das deutsche finite Verb gibt dies natürlich wieder.
theological_decisions:
- issue: Aspekt von Jesu Handeln
  choice: Der Vers beschreibt Jesu wiederholte beziehungsweise gewohnheitsmäßige Praxis, sich zum Gebet zurückzuziehen.
  alternative: Der Vers berichtet nur von einem einzelnen Rückzug zum Gebet.
  rationale: Die griechische Imperfektkonstruktion ἦν mit den Präsenspartizipien ὑποχωρῶν und προσευχόμενος legt eine andauernde oder wiederholte Handlung nahe. „Immer wieder“ macht diesen Aspekt deutlich, ohne weitergehende theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Einsame Gegenden“ gibt den pluralischen Ausdruck ohne unnötige Festlegung auf eine Wüstenlandschaft wieder; „immer wieder“ vermittelt den wahrscheinlich habitualen Aspekt.
