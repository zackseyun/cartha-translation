id: LUK.5.27
reference: Luke 5:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: de
  text: 'Danach ging er hinaus und sah[a] einen Zolleinnehmer namens Levi an der Zollstelle[b] sitzen. Er sagte zu ihm: »Folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bemerkte« oder »blickte aufmerksam an«; das griechische Verb kann ein bewusstes, eingehenderes Wahrnehmen als einen flüchtigen Blick bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »am Zollhaus«, »an der Mautstelle« oder »an der Abgabenstelle«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: Die knappe deutsche Erzählverknüpfung gibt die zeitliche Abfolge des griechischen Ausdrucks natürlich wieder; das pluralische ταῦτα muss im Deutschen nicht mit dem schwerfälligeren »nach diesen Dingen« nachgebildet werden.
- source_word: ἐξῆλθεν
  choice: ging er hinaus
  rationale: Die Übersetzung bewahrt die konkrete Bewegungsrichtung von ἐξέρχομαι, ohne sie zu einem bloßen »ging weg« abzuschwächen.
- source_word: ἐθεάσατο
  choice: sah
  rationale: »Sah« ist im Deutschen natürlich und textnah. Das Verb kann ein bewusstes oder aufmerksames Wahrnehmen bezeichnen; diese mögliche Nuance wird in einer Fußnote offengehalten.
- source_word: τελώνην
  choice: Zolleinnehmer
  rationale: Der Ausdruck bezeichnet einen Einnehmer von Abgaben, Zöllen oder Steuern. »Zolleinnehmer« vermittelt die historische Tätigkeit verständlicher als das heute leicht missverständliche bloße »Zöllner«.
- source_word: ὀνόματι Λευὶν
  choice: namens Levi
  rationale: Dies ist die knappe, idiomatische deutsche Wiedergabe der griechischen Namensangabe.
- source_word: καθήμενον
  choice: sitzen
  rationale: Der Infinitiv in der deutschen Wahrnehmungskonstruktion »sah … sitzen« gibt das präsentische Partizip natürlich und anschaulich wieder.
- source_word: ἐπὶ τὸ τελώνιον
  choice: an der Zollstelle
  rationale: τελώνιον bezeichnet den Ort, an dem Abgaben oder Zölle erhoben wurden. »Zollstelle« bleibt verständlich und legt die genaue bauliche Form nicht unnötig fest.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Der direkte Imperativ bewahrt sowohl den Wortlaut als auch die im Zusammenhang erkennbare Aufforderung zur Nachfolge, ohne sie erklärend auszubauen.
theological_decisions:
- issue: Die Aufforderung Jesu als Ruf in die Nachfolge
  choice: »Folge mir!« als unmittelbare Aufforderung
  alternative: »Werde mein Jünger!«
  rationale: Der Zusammenhang lässt einen Ruf in die Jüngerschaft erkennen, doch die Übersetzung bewahrt die konkrete Formulierung des griechischen Imperativs und fügt keine theologische Erläuterung in den Haupttext ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge ist gegenüber der langen griechischen Koordination leicht gegliedert, ohne Inhalt oder Reihenfolge zu verändern. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
