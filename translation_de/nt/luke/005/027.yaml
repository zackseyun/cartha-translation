  source_fidelity: 'Der deutsche Text gibt die Abfolge und den Inhalt des griechischen Satzes zuverlässig wieder: μετὰ ταῦτα als »Danach«, ἐξῆλθεν als »ging er hinaus«, ἐθεάσατο als »sah«, τελώνης als »Zolleinnehmer«, die Namensangabe, die Sitzposition an der τελώνιον und den direkten Imperativ Ἀκολούθει μοι als »Folge mir!«. Die leichte Satzgliederung ist im Deutschen idiomatisch und verändert weder Referenz noch Sinn.'
