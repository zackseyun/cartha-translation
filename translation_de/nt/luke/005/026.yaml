id: LUK.5.26
reference: Luke 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: de
  text: 'Da wurden sie alle von Staunen ergriffen. Sie priesen Gott und wurden von Furcht erfüllt. Sie sagten: »Heute haben wir außergewöhnliche Dinge[a] gesehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bemerkenswerte Dinge« oder »unerwartete Dinge«; das griechische Wort bezeichnet Dinge, die über das gewöhnlich Erwartete hinausgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: Staunen
  rationale: Bezeichnet hier überwältigtes Erstaunen, nicht Ekstase im heutigen mystischen Sinn. »Staunen« ist natürlich und würdevoll.
- source_word: ἔλαβεν ἅπαντας
  choice: wurden sie alle … ergriffen
  rationale: Die idiomatische Wendung wird bildhaft und im Deutschen natürlich wiedergegeben; ἅπαντας umfasst ausnahmslos alle Anwesenden.
- source_word: ἐδόξαζον τὸν θεόν
  choice: Sie priesen Gott
  rationale: »Gott preisen« gibt δοξάζω in diesem Kontext idiomatisch wieder. Das durative Imperfekt wird im deutschen Erzählstil durch den Zusammenhang hinreichend vermittelt.
- source_word: ἐπλήσθησαν φόβου
  choice: wurden von Furcht erfüllt
  rationale: Bewahrt die passive Form und übersetzt φόβος direkt, ohne die Spannung vorschnell zu »Ehrfurcht« abzumildern.
- source_word: λέγοντες
  choice: Sie sagten
  rationale: Der griechische Begleitumstand wird zur natürlichen deutschen Satzfolge aufgelöst.
- source_word: Εἴδομεν
  choice: haben wir … gesehen
  rationale: Das deutsche Perfekt bringt die unmittelbare Reaktion auf das soeben Erlebte idiomatisch zum Ausdruck.
- source_word: παράδοξα
  choice: außergewöhnliche Dinge
  rationale: Bezeichnet Geschehnisse jenseits gewöhnlicher Erwartung; »außergewöhnlich« vermeidet die potenziell negative Färbung von »seltsam«.
- source_word: σήμερον
  choice: Heute
  rationale: Direkte, natürliche Wiedergabe des Temporaladverbs mit Betonung der unmittelbaren Erfahrung.
theological_decisions:
- issue: Bedeutungsnuance von φόβος als Reaktion auf göttliches Handeln
  choice: Furcht
  alternative: Ehrfurcht
  rationale: »Furcht« erhält die Spannung zwischen Erschrecken und Gottesverehrung, statt sie interpretierend auf ehrfürchtiges Staunen zu verengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Die drei koordinierten griechischen Aussagen werden zur besseren deutschen Lesbarkeit in kurze Hauptsätze gegliedert; Reihenfolge und inhaltliche Spannung bleiben erhalten.
