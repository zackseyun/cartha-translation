id: LUK.5.8
reference: Luke 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: de
  text: 'Als Simon Petrus das sah, fiel er vor Jesus auf die Knie und sagte: „Geh weg von mir[a], denn ich bin ein sündiger Mann[b], Herr!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verlass mich.“'
    reason: Lexikalische Alternative für Ἔξελθε ἀπ’ ἐμοῦ; sie betont eher die Trennung als die räumliche Bewegung.
  - marker: b
    text: Im Griechischen steht ausdrücklich die männliche Bezeichnung „Mann“; Simon Petrus spricht von sich selbst.
    reason: Die Anmerkung erklärt, warum die konkrete Formulierung „sündiger Mann“ statt der allgemeineren Wiedergabe „sündiger Mensch“ gewählt wurde.
lexical_decisions:
- source_word: ἰδὼν
  choice: Als … das sah
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. „Das“ nimmt das im Kontext vorausgesetzte Geschehen, besonders den außergewöhnlichen Fischfang, auf, ohne es im Vers ausdrücklich auszudeuten.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel kennzeichnet hier vor allem den Fortgang der Erzählung mit leichter Gegenüberstellung. Die deutsche Satzfolge trägt diesen Übergang bereits; ein ausdrückliches „aber“ wäre möglich, wirkt hier jedoch unnötig schwer.
- source_word: Σίμων Πέτρος
  choice: Simon Petrus
  rationale: Beide im griechischen Text genannten Namen werden beibehalten.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: fiel er vor Jesus auf die Knie
  rationale: Die Formulierung gibt die plötzliche, ehrfürchtige Niederwerfung in natürlichem modernem Deutsch wieder. Das Griechische beschreibt wörtlicher eine Bewegung hin zu den Knien Jesu; die deutsche Fassung vermeidet eine unidiomatische Wendung, ohne die körperliche Haltung abzuschwächen.
- source_word: λέγων
  choice: und sagte
  rationale: Das begleitende Präsenspartizip wird in flüssigem deutschem Erzählstil als koordinierte finite Form wiedergegeben.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Geh weg von mir
  rationale: Der Aoristimperativ drückt die dringliche Bitte um Abstand aus. Die Wendung ist gegenwärtig und unmittelbar; „Weiche von mir“ wäre traditionell, aber heute gehoben bis altertümlich.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Simons Bitte ein. „Denn“ klingt in direkter Rede natürlicher als ein nachgestelltes „weil“ und bewahrt den begründenden Zusammenhang.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: ein sündiger Mann
  rationale: Die Übersetzung erhält sowohl das ausdrücklich männliche Substantiv ἀνήρ, das Simon auf sich selbst bezieht, als auch das prädikative Adjektiv ἁμαρτωλός. „Ein Sünder“ wäre idiomatischer, würde aber die Formulierung verkürzen.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ wahrt die respektvolle Anrede und ihre mögliche weitergehende christologische Bedeutung. „Mein Herr“ würde ein nicht ausdrücklich vorhandenes Possessivpronomen ergänzen; „Meister“ oder „Herr Lehrer“ wäre enger als das griechische Wort.
theological_decisions:
- issue: Bedeutungsweite der Anrede κύριε an Jesus
  choice: Herr
  alternative: mein Herr; Meister; Herr
  rationale: Die Szene verbindet Staunen, Furcht und Sündenbewusstsein. „Herr“ lässt offen, wie vollständig Simons Erkenntnis der Identität Jesu an dieser Stelle bereits ist, und bewahrt zugleich die im Kontext anklingende besondere Autorität Jesu.
- issue: Selbstbezeichnung ἀνὴρ ἁμαρτωλός
  choice: ein sündiger Mann
  alternative: ein Sünder; ein sündiger Mensch
  rationale: Die Formulierung bewahrt die konkrete männliche Selbstbezeichnung Simons und löst seine Aussage nicht in eine allgemeine Lehre über die Menschheit auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt emotional und knapp. Traditionelle, heute jedoch altertümlich wirkende Formulierungen wie „Weiche von mir“ werden vermieden; die Spannung zwischen ehrfürchtiger Anrede und dem noch offenen Erkenntnisstand Simons bleibt erhalten.
