  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Das temporale Aoristpartizip wird idiomatisch mit „Als … das sah“ aufgenommen, beide Namen stehen da, und die Handlung des Niederfallens bei Jesus wird mit „fiel er vor Jesus auf die Knie“ natürlich und sachgerecht ausgedrückt. „Geh weg von mir“ trifft Ἔξελθε ἀπ’ ἐμοῦ als dringliche Aufforderung zur Distanz. „Denn ich bin ein sündiger Mann“ bewahrt sowohl die Begründung als auch die ausdrücklich männliche Selbstbezeichnung ἀνήρ. Die Anrede „Herr“ ist quellentreu und lässt ihre kontextuelle Bedeutungsweite offen.'
