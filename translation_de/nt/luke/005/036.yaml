  to: 'Er erzählte ihnen auch ein Gleichnis: „Niemand reißt einen Flicken von einem neuen Kleidungsstück ab und bringt ihn auf einem alten Kleidungsstück an. Sonst zerreißt er auch das neue, und der Flicken von dem neuen passt nicht zu dem alten.“'
