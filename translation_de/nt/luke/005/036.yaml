id: LUK.5.36
reference: Luke 5:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: de
  text: 'Er erzählte ihnen auch ein Gleichnis: „Niemand reißt einen Flicken von einem neuen Kleidungsstück ab und bringt ihn auf einem alten Kleidungsstück an. Sonst zerreißt er auch das neue, und der Flicken von dem neuen passt nicht zu dem alten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Er erzählte … auch
  rationale: Der Imperfekt bezeichnet das fortlaufende Reden im Erzählzusammenhang; im natürlichen deutschen Erzählstil gibt das Präteritum „erzählte“ dies angemessen wieder. „Auch“ nimmt καί auf.
- source_word: παραβολὴν
  choice: ein Gleichnis
  rationale: „Gleichnis“ ist die etablierte, allgemein verständliche Bezeichnung für παραβολή und bewahrt die literarische Form.
- source_word: ἐπίβλημα
  choice: einen Flicken
  rationale: Im Zusammenhang mit Kleidung bezeichnet das Wort ein Stoffstück, das zum Ausbessern verwendet wird; „Flicken“ ist dafür die natürliche deutsche Entsprechung.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: von einem neuen Kleidungsstück
  rationale: ἱμάτιον kann allgemein ein Gewand oder Kleidungsstück bezeichnen. „Kleidungsstück“ bleibt sachlich breit und ist im modernen Deutsch verständlich.
- source_word: σχίσας
  choice: reißt … ab
  rationale: Das Aoristpartizip bezeichnet die der Hauptaktion vorausgehende Handlung. Die Beiordnung „reißt … ab und setzt“ ist im Deutschen natürlicher, ohne die Abfolge zu verwischen.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: setzt ihn auf ein altes
  rationale: „Setzt … auf“ gibt das allgemeine Aufbringen von ἐπιβάλλω wieder, ohne das im Griechischen nicht ausdrücklich genannte Annähen einzutragen.
- source_word: εἰ δὲ μήγε
  choice: Sonst
  rationale: Die knappe deutsche Folgeangabe bringt die negative Konsequenz der angenommenen Handlung idiomatisch zum Ausdruck.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: zerreißt er auch das neue
  rationale: Das aktive Futur hat weiterhin die handelnde Person als unausgesprochenes Subjekt. „Das neue“ bezieht sich eindeutig auf das neue Kleidungsstück und bewahrt das zusätzliche καί als „auch“.
- source_word: οὐ συμφωνήσει
  choice: passt nicht zu
  rationale: συμφωνέω bezeichnet hier fehlende Übereinstimmung oder Eignung. „Passt nicht zu“ bewahrt diese gewisse Bedeutungsbreite und klingt im Kleidungskontext natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kleidungsstück“ vermeidet das heute altertümlich wirkende „Gewand“, während „Gleichnis“ und „Flicken“ vertraut und präzise bleiben. Die Formulierung lässt offen, auf welche Weise der Flicken befestigt wird.
