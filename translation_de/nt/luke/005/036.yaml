    issue: Unidiomatische Wiedergabe von ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
    rationale: Die Formulierung „setzt ihn auf ein altes“ klingt im Deutschen unnatürlich und lässt das Bezugswort zu „altes“ zu stark aus. Eine idiomatische Formulierung sollte das Aufbringen eines Flickens auf einem Kleidungsstück ausdrücken, ohne „annähen“ einzutragen.
  revised_text: 'Er erzählte ihnen auch ein Gleichnis: „Niemand reißt einen Flicken von einem neuen Kleidungsstück ab und bringt ihn auf einem alten Kleidungsstück an. Sonst zerreißt er auch das neue, und der Flicken von dem neuen passt nicht zu dem alten.“'
