  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte Bedeutung von συνέκλεισαν bleibt durch „umschlossen“ erhalten; die im Deutschen natürliche Folgekonstruktion verdeutlicht den Zusammenhang, ohne den Sinn theologisch auszudeuten.
