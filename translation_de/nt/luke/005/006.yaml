  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: de
  text: Als sie dies getan hatten, schlossen sie eine große Menge Fische ein, und ihre Netze begannen zu reißen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihre Netze rissen immer weiter“. Das griechische Imperfekt stellt das Reißen als einen andauernden Vorgang dar; es sagt nicht unbedingt, dass die Netze vollständig zerrissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Als sie das getan hatten
  rationale: Das vorzeitige Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und bewahrt die Abfolge der Handlungen.
- source_word: συνέκλεισαν
  choice: umschlossen sie
  rationale: Die Wiedergabe erhält das Bild, dass die Fische von den Netzen eingeschlossen wurden; „fingen“ wäre idiomatischer, aber weniger bildhaft.
- source_word: πλῆθος ἰχθύων πολύ
  choice: eine so große Menge Fische
  rationale: Die Formulierung gibt die nachdrücklich bezeichnete große Zahl wieder und verbindet sie im Deutschen natürlich mit der folgenden Folge.
- source_word: διερρήσσετο
  choice: zu reißen begannen
  rationale: Der Imperfekt beschreibt einen im Gang befindlichen Vorgang, nicht zwingend ein vollständig eingetretenes Zerreißen.
- source_word: τὰ δίκτυα αὐτῶν
  choice: ihre Netze
  rationale: Die idiomatische deutsche Possessivkonstruktion bewahrt den ausdrücklich vorhandenen Plural.
theological_decisions: []
