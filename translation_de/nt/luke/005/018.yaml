id: LUK.5.18
reference: Luke 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: de
  text: Und siehe, Männer trugen auf einem Bett[a] einen Mann, der gelähmt war, und sie versuchten, ihn hineinzubringen und vor ihm[b] hinzulegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einer Trage“ oder „auf einer Liege“; das griechische Wort kann ein Bett oder eine Liege bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: vor Jesus.'
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh da
  rationale: Bewahrt die aufmerksamkeitslenkende und szenisch belebende Funktion der Partikel in einer verständlichen, leicht gehobenen deutschen Wendung.
- source_word: ἄνδρες
  choice: Männer
  rationale: Gibt die ausdrückliche Bezeichnung erwachsener männlicher Personen wieder, ohne sie zum allgemeineren „Menschen“ zu verallgemeinern.
- source_word: φέροντες
  choice: trugen
  rationale: Das durative Geschehen des Präsenspartizips wird im Deutschen durch den erzählerischen Zusammenhang und die fortlaufende Handlung ausreichend vermittelt.
- source_word: ἐπὶ κλίνης
  choice: auf einem Bett
  rationale: „Bett“ ist die direkte und unbestimmte Wiedergabe von κλίνη; je nach konkreter Ausführung kann auch eine Trage oder ein Liegepolster gemeint sein.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Im Zusammenhang ist eine männliche Einzelperson gemeint; „Mann“ ist natürlich und sachlich passend.
- source_word: παραλελυμένος
  choice: der gelähmt war
  rationale: Die Form bezeichnet einen durch Lähmung gekennzeichneten fortbestehenden Zustand, ohne dessen genaue medizinische Ausprägung festzulegen.
- source_word: ἐζήτουν
  choice: sie versuchten
  rationale: Gibt den andauernden, zunächst noch nicht erfolgreichen Versuch des Imperfekts in natürlichem modernem Deutsch wieder.
- source_word: εἰσενεγκεῖν
  choice: ihn hineinzubringen
  rationale: Bewahrt die Bewegungsrichtung nach innen; dass der Mann dabei getragen wurde, ergibt sich bereits aus dem vorherigen Satzteil.
- source_word: θεῖναι
  choice: hinzulegen
  rationale: Passt zur liegenden Beförderung auf einem Bett und gibt das Platzieren natürlich wieder, ohne eine zusätzliche Handlung einzuführen.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Folgt dem griechischen Pronomen und bewahrt dessen sprachliche Form, während der Kontext Jesus als Bezugsperson erkennen lässt.
theological_decisions:
- issue: Bezug von αὐτοῦ am Versende
  choice: vor ihm
  alternative: vor Jesus
  rationale: Der Erzählzusammenhang weist klar auf Jesus, doch der griechische Text nennt hier nicht seinen Namen, sondern verwendet ein Pronomen. Die Übersetzung wahrt diese Form und erläutert den Bezug in einer Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Sieh da“ erhält die narrative Aufmerksamkeitspartikel, ohne das altertümlichere „siehe“ zu verwenden. Die Aufteilung in zwei Sätze verbessert die Lesbarkeit, ohne den Handlungszusammenhang zu verändern.
