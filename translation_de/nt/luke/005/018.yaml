  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des griechischen Textes zutreffend wieder: erwachsene Männer tragen einen gelähmten Mann auf einer κλίνη und bemühen sich, ihn hineinzubringen und vor αὐτός zu platzieren. „Versuchten“ ist für das imperfektische ἐζήτουν idiomatisch und angemessen. Das Pronomen „ihm“ bewahrt die Form von αὐτοῦ; die Fußnote identifiziert den im Kontext eindeutigen Bezug, ohne den Wortlaut des Verses zu ersetzen.'
  naturalness: „Und sieh da:“ wirkt im heutigen Standarddeutsch als direkte Anrede beziehungsweise Ausruf weniger natürlich. „Und siehe,“ ist als leicht gehobene erzählerische Aufmerksamkeitspartikel klarer etabliert und bewahrt die Funktion von ἰδού. Die übrige Syntax ist flüssig und verständlich.
  terminology: „Bett“, „gelähmt“, „hineinzubringen“ und „vor ihm“ sind angemessene Wiedergaben. „Hinzulegen“ ist im Kontext eines getragenen Mannes auf einem Bett natürlich und für θεῖναι vertretbar. Die Fußnote zu κλίνη sollte die Erklärung idiomatischer und weniger redundant formulieren.
  issues:
  - severity: low
    issue: Unnatürliche Wiedergabe von ἰδού
    rationale: „Und sieh da:“ klingt im modernen schriftsprachlichen Erzählton weniger idiomatisch. „Und siehe,“ erhält die aufmerksamkeitslenkende Funktion der Partikel und ist in diesem Register geläufig.
  - severity: low
    issue: Redundante Formulierung in Fußnote a
    rationale: „bettartige Unterlage oder ein Ruhebett“ erklärt κλίνη nicht präzise genug und wiederholt sich semantisch. „Bett oder Liege“ ist klarer und entspricht den genannten Alternativen.
  revised_text: Und siehe, Männer trugen auf einem Bett[a] einen Mann, der gelähmt war, und sie versuchten, ihn hineinzubringen und vor ihm[b] hinzulegen.
