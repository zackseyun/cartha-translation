source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: de
  text: 'Jesus antwortete ihnen: »Nicht die Gesunden brauchen einen Arzt, sondern die Kranken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Jesus antwortete ihnen
  rationale: Die Verbindung aus Partizip und Redeverb ist eine übliche griechische Erzählformel. Die deutsche Wiedergabe bewahrt sowohl den antwortenden Charakter als auch die Adressaten, ohne das schwerfällige »antwortend sagte Jesus zu ihnen«.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: brauchen nicht
  rationale: Die idiomatische deutsche Verbform gibt die griechische Wendung »keinen Bedarf haben« knapp und natürlich wieder.
- source_word: οἱ ὑγιαίνοντες
  choice: die Gesunden
  rationale: Das substantivierte Partizip bezeichnet Menschen, die gesund sind; »die Gesunden« ist präzise, geläufig und erhält den sprichwortartigen Klang.
- source_word: ἰατροῦ
  choice: einen Arzt
  rationale: ἰατρός bezeichnet einen Arzt. Die moderne deutsche Standardbezeichnung ist klar und würdevoll.
- source_word: οἱ κακῶς ἔχοντες
  choice: die Kranken
  rationale: κακῶς ἔχειν ist hier eine feste Wendung für Kranksein. »Die Kranken« bildet zudem den prägnanten Gegensatz zu »die Gesunden«.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller und sprichwortartiger Satzstruktur. Die Metapher wird weder erklärt noch theologisch ausgeweitet.
