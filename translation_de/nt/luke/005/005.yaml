id: LUK.5.5
reference: Luke 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: de
  text: 'Und Simon antwortete: »Meister, wir haben uns die ganze Nacht abgemüht und nichts gefangen; aber auf dein Wort hin werde ich die Netze hinablassen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben hier den Singular: »das Netz«.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: antwortete
  rationale: Die griechische Verbindung aus Partizip und finitem Verb ist eine übliche Redeeinleitung; im natürlichen Deutschen genügt das finite »antwortete«.
- source_word: Ἐπιστάτα
  choice: Meister
  rationale: Die für Lukas charakteristische Anrede erkennt Jesu Autorität an, ohne sie mit dem in dieser Stelle nicht verwendeten κύριος (»Herr«) gleichzusetzen.
- source_word: δι’ ὅλης νυκτός
  choice: die ganze Nacht
  rationale: Die Wendung bezeichnet die gesamte Dauer der Nacht und wird so idiomatisch und vollständig wiedergegeben.
- source_word: κοπιάσαντες
  choice: haben uns … abgemüht
  rationale: »Sich abmühen« bringt die im Verb enthaltene anstrengende, erschöpfende Arbeit deutlicher zum Ausdruck als das allgemeinere »arbeiten«.
- source_word: οὐδὲν ἐλάβομεν
  choice: nichts gefangen
  rationale: Im Fischereikontext bezeichnet λαμβάνω das Fangen; das deutsche Verb erschließt den impliziten Bezug auf Fische ohne unnötige Ergänzung.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: aber auf dein Wort hin
  rationale: Die Formulierung bewahrt den Kontrast und gibt das Wort Jesu als Grundlage für Simons folgendes Handeln wieder, ohne die Beziehung einseitig als bloßen Zeitpunkt oder als ausdrückliche Ursache festzulegen.
- source_word: χαλάσω
  choice: werde ich … hinablassen
  rationale: Das Futur und das Absenken der Netze ins Wasser werden präzise wiedergegeben.
- source_word: τὰ δίκτυα
  choice: die Netze
  rationale: Der Plural der gewählten Ausgangsausgabe wird im Haupttext bewahrt.
theological_decisions:
- issue: Anrede Jesu mit Ἐπιστάτα
  choice: Meister
  alternative: Herr
  rationale: »Meister« wahrt die spezifische Wortwahl des Lukas sowie die anerkannte Autorität Jesu, ohne die Anrede mit κύριος zu verschmelzen.
- issue: Grundlage von Simons Handeln in ἐπὶ τῷ ῥήματί σου
  choice: auf dein Wort hin
  alternative: wegen deines Wortes / auf dein Wort
  rationale: Die gewählte Wendung lässt die semantische Spannung zwischen Grundlage, Anlass und vertrauensvoller Reaktion bestehen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Sich abmühen« vermittelt die anstrengende Arbeit idiomatisch; »auf dein Wort hin« ist leicht gehoben, aber geläufig und bewahrt die Bedeutungsbreite der griechischen Konstruktion.
