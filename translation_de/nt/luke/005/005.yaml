  terminology: „Meister“ wahrt den Unterschied zwischen Ἐπιστάτα und κύριος und entspricht zugleich dem englischen POB-Audit-Trail. „Netze“ bewahrt den Text des SBLGNT im Plural. Die Fußnote weist passend auf die abweichende Singularlesart hin, ohne den Haupttext zu relativieren.
