  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Textes wieder: Simon als Sprecher, die Anrede Ἐπιστάτα mit „Meister“, die durchwachte ganze Nacht, die mühevolle Arbeit, den erfolglosen Fang, den kontrastierenden Entschluss „auf dein Wort hin“ sowie das zukünftige Hinablassen der Netze im Plural. Die deutsche Redeeinleitung „Simon antwortete“ ist eine natürliche Wiedergabe von ἀποκριθεὶς εἶπεν.'
