  source_fidelity: 'Die Übersetzung gibt den Sinn und die syntaktischen Kernbezüge des griechischen Textes zuverlässig wieder: Das Wahrnehmen ihres Glaubens, der Plural in „ihren“, die direkte Anrede sowie die vollendete passive Vergebungsformel bleiben erhalten. „Sind dir vergeben“ bildet den gegenwärtigen Geltungszustand des griechischen Perfektpassivs idiomatisch ab, ohne dessen genaue zeitliche oder theologische Einordnung festzulegen.'
  naturalness: „Als er ihren Glauben sah, sagte er“ ist modernes, flüssiges Standarddeutsch. Auch „Mensch“ ist als bewusst unmittelbare, quellennah gehaltene Anrede möglich; es ist hier weder unverständlich noch unnötig umgangssprachlich. Die Vergebungsformel klingt im Deutschen natürlich.
  terminology: „Glauben“, „Sünden“ und „vergeben“ sind etablierte und sachgerechte Wiedergaben. Die Fußnote zu „Vertrauen“ wahrt eine mögliche lexikalische Nuance. Die Fußnote zum Perfektpassiv erläutert die relevante Formfunktion angemessen, ohne eine dogmatische Deutung festzuschreiben.
