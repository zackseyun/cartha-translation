  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: de
  text: 'Als er ihren Glauben[a] sah, sagte er: »Mensch, deine Sünden sind dir vergeben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Vertrauen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine Sünden sind dir vergeben worden«. Das griechische Perfekt Passiv kann den gegenwärtigen Zustand als Ergebnis einer vollendeten Handlung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als er … sah
  rationale: Das aoristische Partizip wird als natürlicher deutscher Temporalsatz wiedergegeben. So bleibt der enge zeitliche und sachliche Zusammenhang mit Jesu Ausspruch erhalten, ohne eine weitergehende Abfolge zu behaupten.
- source_word: πίστιν
  choice: Glauben
  rationale: „Glauben“ ist die übliche und kontextgemäße Wiedergabe. Gemeint ist hier das sichtbar gewordene Vertrauen; „Vertrauen“ bleibt als mögliche Bedeutungsnuance in der Fußnote erhalten.
- source_word: αὐτῶν
  choice: ihren
  rationale: Der Plural wird bewahrt und nicht darauf eingeengt, ob ausschließlich die Träger oder auch der Gelähmte gemeint sind.
- source_word: Ἄνθρωπε
  choice: Mensch
  rationale: Die direkte Anrede entspricht dem griechischen Vokativ formal und semantisch. „Freund“ würde eine im Ausgangstext nicht ausdrücklich bezeichnete Vertrautheit hinzufügen.
- source_word: ἀφέωνταί
  choice: sind … vergeben
  rationale: Das deutsche Zustandspassiv gibt den gegenwärtigen Zustand als Ergebnis vollzogener Vergebung idiomatisch wieder und lässt die genaue zeitliche Akzentuierung des griechischen Perfekts offen.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Direkte, etablierte Wiedergabe des moralisch-theologischen Begriffs.
- source_word: σοι … σου
  choice: deine … sind dir vergeben
  rationale: Sowohl der Genitiv σου als auch der Dativ σοι werden im Deutschen natürlich abgebildet. Die Formulierung ist idiomatisch und bewahrt die persönliche Ausrichtung der Zusage.
theological_decisions:
- issue: Bezugsumfang von „ihren Glauben“
  choice: Der Plural bleibt ohne nähere Bestimmung erhalten.
  alternative: Nur der Glaube der Männer, die den Gelähmten brachten; oder der gemeinsame Glaube des Gelähmten und seiner Begleiter.
  rationale: Das griechische αὐτῶν legt nicht eindeutig fest, welche Personen der Gruppe einbezogen sind. Die Übersetzung wahrt diese Spannung.
- issue: Aussagekraft der Vergebungsformel
  choice: „Deine Sünden sind dir vergeben“ als deklarative Passivform.
  alternative: Eine in diesem Augenblick wirksam werdende Vergebung; oder die Bekanntgabe einer bereits gewährten Vergebung.
  rationale: Das griechische Perfekt Passiv bezeichnet die bestehende Wirklichkeit der Vergebung, entscheidet aber nicht ausdrücklich zwischen diesen theologischen Deutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Temporalsatz ist natürlicher als ein deutsches Partizipialgefüge. Die wörtliche Anrede „Mensch“ bewahrt die Eigenart des Ausgangstextes, während „sind dir vergeben“ im Deutschen sowohl idiomatisch als auch quellennah ist.
