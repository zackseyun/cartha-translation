id: LUK.5.3
reference: Luke 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: de
  text: Da stieg er in eines der Boote, das Simon gehörte, und bat ihn, ein wenig vom Ufer wegzufahren. Dann setzte er sich und lehrte vom Boot aus die Menschenmengen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: stieg er … in … hinein
  rationale: Das Partizip bezeichnet das Einsteigen vor der Bitte; die finite deutsche Erzählform gibt die Abfolge natürlich wieder.
- source_word: πλοίων / πλοίου
  choice: Boote / Boot
  rationale: Im Zusammenhang sind kleinere Fischerboote auf dem See gemeint; Numerus und jeweilige Form des Griechischen bleiben erhalten.
- source_word: ὃ ἦν Σίμωνος
  choice: das Simon gehörte
  rationale: Der Genitiv drückt Besitz aus; diese Formulierung ist klar und gegenwärtig.
- source_word: ἠρώτησεν
  choice: bat
  rationale: ἐρωτάω bezeichnet hier eine an Simon gerichtete Bitte, nicht bloß eine Informationsfrage.
- source_word: ἐπαναγαγεῖν
  choice: wegzufahren
  rationale: Im nautischen Kontext bedeutet das Verb, das Boot vom Land beziehungsweise Ufer hinauszubewegen.
- source_word: ἀπὸ τῆς γῆς
  choice: vom Ufer
  rationale: Wörtlich steht »vom Land«; im konkreten Zusammenhang bezeichnet γῆ das trockene Land im Gegensatz zum Boot. »Vom Ufer« ist im Deutschen eindeutig und natürlich.
- source_word: ὀλίγον
  choice: ein wenig
  rationale: Gibt die geringe räumliche Entfernung knapp wieder.
- source_word: καθίσας
  choice: Dann setzte er sich
  rationale: Das vorzeitige Partizip wird als aufeinanderfolgende Handlung wiedergegeben und bewahrt die im Text genannte Sitzhaltung.
- source_word: ἐκ τοῦ πλοίου
  choice: vom Boot aus
  rationale: Die Wendung bezeichnet das Boot als Ausgangsort des Lehrens; die deutsche Formulierung ist idiomatisch.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt stellt die Lehrtätigkeit als andauernd dar. Im deutschen Erzählpräteritum wird dies natürlich durch »lehrte« ausgedrückt, ohne einen Abschluss hervorzuheben.
- source_word: τοὺς ὄχλους
  choice: die Menschenmengen
  rationale: Die Pluralform wird bewahrt; »Menschenmengen« ist verständlich und weniger altertümlich als »Volksscharen«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die griechische Satzfolge und der fortlaufende Charakter der Szene werden bewahrt, ohne unnatürliche Partizipialkonstruktionen. Keine Fußnote ist erforderlich, da »vom Ufer« die kontextuelle Bedeutung von ἀπὸ τῆς γῆς im Deutschen präzise wiedergibt.
