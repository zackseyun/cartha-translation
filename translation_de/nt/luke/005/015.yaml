id: LUK.5.15
reference: Luke 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: de
  text: Doch die Nachricht über ihn verbreitete sich umso mehr[a], und große Menschenmengen kamen zusammen, um ihn zu hören und von ihren Krankheiten geheilt zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wort über ihn«; auch: »die Kunde von ihm«.'
    reason: Lexikalische Spannweite von λόγος περὶ αὐτοῦ.
lexical_decisions:
- source_word: διήρχετο
  choice: verbreitete sich
  rationale: Das Imperfekt bezeichnet eine fortdauernde Ausbreitung; die idiomatische deutsche Formulierung bewahrt diesen Sinn.
- source_word: μᾶλλον
  choice: umso mehr
  rationale: Die Wendung gibt die steigernde beziehungsweise vergleichende Kraft von μᾶλλον im Anschluss an das Vorhergehende wieder.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: die Nachricht über ihn
  rationale: λόγος bezeichnet hier die umlaufende Nachricht über Jesus, nicht ausdrücklich ein theologisches »Wort«; die Fußnote bewahrt die lexikalische Alternative.
- source_word: συνήρχοντο ὄχλοι πολλοὶ
  choice: große Menschenmengen kamen zusammen
  rationale: Das Imperfekt vermittelt den fortdauernden Zulauf; »große Menschenmengen« ist im Deutschen natürlicher als das wörtliche »viele Menschenmengen«.
- source_word: ἀκούειν
  choice: um ihn zu hören
  rationale: Der Infinitiv bezeichnet den Zweck. Das im Griechischen implizite Objekt wird im Deutschen aus Gründen natürlicher Verständlichkeit als Jesus kenntlich gemacht.
- source_word: θεραπεύεσθαι
  choice: geheilt zu werden
  rationale: Die passive Form und der körperliche Heilungskontext werden unmittelbar wiedergegeben.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: von ihren Krankheiten
  rationale: ἀπό bezeichnet hier die Befreiung von körperlichen Leiden; »Krankheiten« ist klar und allgemein verständlich.
theological_decisions:
- issue: Art der Heilung
  choice: Die Formulierung bezeichnet konkret die Heilung von Krankheiten.
  alternative: Eine breitere Wiedergabe wie »heil gemacht werden«, die auch geistliche Wiederherstellung anklingen lassen könnte.
  rationale: Der unmittelbare Zusammenhang spricht von körperlichen Leiden; eine ausdrückliche geistliche Bedeutung soll nicht hinzugefügt werden.
- issue: Bedeutung von λόγος
  choice: Als umlaufende »Nachricht« verstanden.
  alternative: »Wort« mit möglichem Anklang an eine theologisch bestimmte Verkündigung.
  rationale: Der Erzählzusammenhang handelt vom Bekanntwerden Jesu. Die mögliche wörtlichere Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortdauernden Handlungen der griechischen Imperfekte werden durch »verbreitete sich« und »kamen zusammen« im Erzählzusammenhang vermittelt; die Satzstruktur bleibt klar und gut vorlesbar.
