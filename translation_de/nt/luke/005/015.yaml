  source_fidelity: Die Übersetzung gibt die fortlaufende Verbreitung der Nachricht (διήρχετο), die steigernde Nuance von μᾶλλον, das Zusammenkommen großer Menschenmengen sowie die beiden finalen Infinitive treffend wieder. „Um ihn zu hören“ macht das im Kontext eindeutige, im Griechischen unausgedrückte Objekt idiomatisch explizit, ohne den Sinn zu erweitern. Die körperliche Heilung „von ihren Krankheiten“ entspricht θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν.
