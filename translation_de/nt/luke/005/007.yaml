  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: de
  text: Sie gaben ihren Partnern im anderen Boot ein Zeichen, dass sie kommen und ihnen helfen sollten.[a] Sie kamen und füllten beide Boote, sodass die Boote zu sinken begannen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie winkten ihren Partnern im anderen Boot zu, sie sollten kommen und mit anpacken.“'
    reason: „Ein Zeichen geben“ gibt κατένευσαν allgemein wieder; „zuwinken“ und „mit anpacken“ sind kontextgerechte lexikalische Alternativen.
  - marker: b
    text: 'Oder: „sodass die Boote sanken.“'
    reason: Der griechische Ausdruck beschreibt den als Folge eintretenden Sinkvorgang; die Hauptfassung gibt dessen Beginn ausdrücklich wieder, die Alternative fasst ihn knapper.
lexical_decisions:
- source_word: κατένευσαν
  choice: gaben … ein Zeichen
  rationale: Das Verb bezeichnet ein Zeichen oder eine Geste, vermutlich über eine gewisse Entfernung hinweg. „Ein Zeichen geben“ ist im Deutschen natürlich und legt die genaue Art der Bewegung nicht unnötig fest.
- source_word: μετόχοις
  choice: Partnern
  rationale: Im Zusammenhang des Fischfangs bezeichnet das Wort Beteiligte oder Arbeitsgenossen. „Partner“ gibt diese praktische Zusammenarbeit prägnant wieder.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: im anderen Boot
  rationale: ἕτερος unterscheidet hier das zweite beteiligte Boot vom ersten; „im anderen Boot“ ist die natürliche deutsche Erzählweise.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: sie sollten kommen und ihnen helfen
  rationale: Die Konstruktion drückt den Zweck des Zeichens aus. συλλαμβάνομαι bedeutet hier, gemeinsam mit anzupacken beziehungsweise Hilfe zu leisten.
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: gemeinsam füllten sie beide Boote
  rationale: „Füllten“ bewahrt das Bild des griechischen Verbs; was die Boote füllte, ist aus dem Zusammenhang eindeutig. „Gemeinsam“ verdeutlicht idiomatisch das nun gemeinsame Handeln, ohne einen neuen Akteur einzuführen.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: sodass diese zu sinken begannen
  rationale: Der präsentische Infinitiv beschreibt das Sinken als eintretenden beziehungsweise fortschreitenden Vorgang. Die Formulierung vermeidet die Aussage, die Boote seien vollständig untergegangen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber durch die indirekte Aufforderung idiomatisch ins Deutsche übertragen. Die Pronomenreferenz wird mit „diese“ auf die Boote bezogen und dadurch eindeutig gemacht.
