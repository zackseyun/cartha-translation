revisions:
- from: Da gaben sie ihren Partnern im anderen Boot ein Zeichen, sie sollten kommen und ihnen helfen.[a] Sie kamen, und gemeinsam füllten sie beide Boote, sodass diese zu sinken begannen.[b]
  to: Sie gaben ihren Partnern im anderen Boot ein Zeichen, dass sie kommen und ihnen helfen sollten.[a] Sie kamen und füllten beide Boote, sodass die Boote zu sinken begannen.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text ausgedrückte Ergänzung „gemeinsam“, macht den Bezug von αὐτά eindeutig und präzisiert die Fußnotenbegründung. Sinn, Erzählton und die angemessene Wiedergabe der Beteiligten als „Partner“ bleiben erhalten.
