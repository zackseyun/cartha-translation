id: LUK.5.39
reference: Luke 5:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: de
  text: 'Und niemand, der alten Wein getrunken hat, will neuen Wein; denn er sagt: »Der alte ist gut.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: »Der alte ist besser.«'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: niemand
  rationale: Die generische Verneinung wird im modernen Deutschen natürlich und ohne unnötige Geschlechtsmarkierung mit »niemand« wiedergegeben.
- source_word: πιὼν
  choice: der … getrunken hat
  rationale: Das vorzeitige Aoristpartizip wird idiomatisch als Relativsatz im Perfekt wiedergegeben und wahrt die zeitliche Beziehung zum Hauptverb.
- source_word: παλαιὸν
  choice: alten Wein
  rationale: »Wein« ist im Griechischen aus dem unmittelbaren Zusammenhang zu ergänzen; die ausdrückliche Nennung sorgt im Deutschen für Klarheit.
- source_word: θέλει
  choice: will
  rationale: θέλω bezeichnet hier Wunsch beziehungsweise Vorliebe; »will« ist knapp, natürlich und passend zum sprichwortartigen Satz.
- source_word: νέον
  choice: neuen
  rationale: Das substantivierte Adjektiv meint »neuen Wein«. Nach der vorherigen ausdrücklichen Nennung von Wein ist die Ellipse im Deutschen klar und bildet die knappe Struktur des Griechischen ab.
- source_word: λέγει γάρ
  choice: denn er sagt
  rationale: γάρ begründet die vorangehende Aussage; »denn« bewahrt diese erklärende Funktion und leitet die direkte Rede natürlich ein.
- source_word: Ὁ παλαιὸς
  choice: Der alte
  rationale: »Wein« bleibt wie im griechischen Text unausgesprochen, ist aber aus dem Kontext eindeutig. Die knappe, sprichwortartige Form bleibt erhalten.
- source_word: χρηστός
  choice: gut
  rationale: χρηστός bedeutet hier allgemein »gut« beziehungsweise »angenehm«, nicht von sich aus den Komparativ »besser«. »Gut« wahrt den Wortlaut der gedruckten SBLGNT-Lesart.
theological_decisions:
- issue: Wiedergabe von χρηστός im Spruch über alten und neuen Wein
  choice: gut
  alternative: besser
  rationale: Die gedruckte griechische Lesart χρηστός ist positiv, aber nicht komparativ. Daher steht »gut« im Haupttext; die bekannte Lesart »besser« wird als textliche Variante in der Fußnote bewahrt, ohne eine theologische Deutung des Bildworts festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem und sprichwortartigem Ton. Die im Griechischen möglichen Ellipsen werden dort bewahrt, wo sie im Deutschen eindeutig bleiben.
