source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: de
  text: 'Jesus aber erkannte ihre Überlegungen und erwiderte ihnen: »Warum[a] hegt ihr solche Überlegungen in euren Herzen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was«.'
    reason: Das griechische τί bedeutet wörtlich »was«, kann in diesem Zusammenhang aber nach dem Grund fragen und daher mit »warum« wiedergegeben werden.
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: erkannte
  rationale: Das Aoristpartizip von ἐπιγινώσκω bezeichnet hier Jesu sicheres Erfassen ihrer inneren Überlegungen. »Erkannte« gibt dies wieder, ohne die Art seiner Erkenntnis näher zu bestimmen.
- source_word: δὲ
  choice: aber
  rationale: 'δέ markiert einen leichten Übergang mit kontrastierender Nuance: Auf ihre unausgesprochenen Einwände folgt Jesu Reaktion.'
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: ihre Überlegungen
  rationale: διαλογισμός meint hier innere Gedankengänge oder Erwägungen. »Überlegungen« bewahrt zudem die lexikalische Verbindung zum folgenden Verb διαλογίζεσθε.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: erwiderte ihnen
  rationale: Die griechische Doppelwendung »antwortete und sagte« ist eine geläufige Erzählformel. Das natürliche deutsche »erwiderte ihnen« gibt ihre kommunikative Funktion knapp und würdig wieder.
- source_word: Τί
  choice: Warum
  rationale: τί kann formal »was« bedeuten, fragt in dieser Verbindung jedoch wahrscheinlich nach dem Grund ihrer inneren Überlegungen. Die mögliche formnähere Wiedergabe wird in einer Fußnote bewahrt.
- source_word: διαλογίζεσθε
  choice: stellt ihr diese Überlegungen … an
  rationale: Die Wendung gibt den fortdauernden inneren Denkprozess wieder und bewahrt zugleich die Wortverbindung mit διαλογισμούς. »Diese« verweist im Deutschen natürlich auf die bereits genannten Überlegungen.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Die biblische Ausdrucksweise bezeichnet das innere Denken und Wollen des Menschen. Sie wird beibehalten, statt auf »in Gedanken« oder »bei euch selbst« verengt zu werden.
theological_decisions:
- issue: Art von Jesu Kenntnis der inneren Überlegungen anderer
  choice: Der Text sagt sachlich, dass Jesus ihre Überlegungen erkannte, ohne die Weise dieser Erkenntnis zu erklären.
  alternative: Eine ausdrücklich übernatürliche Deutung oder eine abschwächende Wiedergabe wie »erahnte« beziehungsweise »vermutete«.
  rationale: Der Vers bezeugt Jesu Kenntnis ihrer inneren Vorgänge, legt aber nicht ausdrücklich dar, wie er zu dieser Kenntnis gelangte. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Metapher »in euren Herzen« sowie die Wiederaufnahme von διαλογισμός/διαλογίζομαι durch »Überlegungen«/»Überlegungen anstellen« bleiben erhalten; die semitisch geprägte Doppelwendung »antwortete und sagte« wird idiomatisch zu »erwiderte« verdichtet.
