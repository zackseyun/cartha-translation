  rationale: Eine kleine stilistische Korrektur ersetzt die sperrige Konstruktion „Überlegungen … anstellen“ durch die idiomatischere Wendung „Überlegungen hegen“. Die inhaltliche Aussage, die biblische Redeweise von den Herzen und die mit der Fußnote dokumentierte Ambiguität von τί bleiben erhalten.
