  terminology: „Erkannte“, „Überlegungen“ und „in euren Herzen“ sind sachgerecht. Die Wiederholung von „Überlegungen“ bildet die griechische Wortverbindung sinnvoll ab. „Aber“ ist als Wiedergabe von δέ möglich.
