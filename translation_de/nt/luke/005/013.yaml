  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: de
  text: 'Und er streckte die Hand aus, berührte ihn und sagte: „Ich will. Werde rein!“ Und sofort wich die Lepra[a] von ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „eine Hautkrankheit“. Das griechische Wort λέπρα kann im biblischen Gebrauch verschiedene Hautkrankheiten bezeichnen und ist nicht ohne Weiteres mit der heute als Lepra bezeichneten Krankheit gleichzusetzen.'
    reason: Kultur- und Sachhinweis zum weiteren Bedeutungsumfang des antiken Krankheitsbegriffs.
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: streckte die Hand aus
  rationale: Gibt das vorzeitige Partizip und die konkrete körperliche Bewegung in natürlichem Deutsch wieder.
- source_word: ἥψατο αὐτοῦ
  choice: berührte ihn
  rationale: Die griechische Konstruktion mit Genitivobjekt wird im Deutschen idiomatisch mit einem Akkusativobjekt wiedergegeben.
- source_word: εἰπών
  choice: und sagte
  rationale: Eine finite Reihung klingt im modernen Deutschen natürlicher als eine wörtliche partizipiale Konstruktion und bewahrt den Ablauf.
- source_word: Θέλω
  choice: Ich will
  rationale: Bewahrt die knappe, nachdrückliche Antwort auf die zuvor geäußerte Bedingung und kann sowohl Willen als auch Bereitschaft ausdrücken.
- source_word: καθαρίσθητι
  choice: Werde rein!
  rationale: Bewahrt den Reinigungsbegriff und die Zustandsveränderung, statt die Aussage auf medizinische Heilung zu verengen.
- source_word: εὐθέως
  choice: sofort
  rationale: Klare und natürliche Wiedergabe der unmittelbaren zeitlichen Folge.
- source_word: ἡ λέπρα
  choice: der Aussatz
  rationale: Der traditionelle biblische Ausdruck bleibt im Erzählzusammenhang verständlich; eine Fußnote weist darauf hin, dass der griechische Begriff weiter gefasst sein kann als die moderne Lepra.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: wich ... von ihm
  rationale: Natürliches, zugleich anschauliches Deutsch für das vollständige und unmittelbare Verschwinden der Krankheit.
theological_decisions:
- issue: Wiedergabe von καθαρίσθητι bei der Heilung eines Aussätzigen
  choice: Werde rein!
  alternative: Werde geheilt! / Sei gereinigt!
  rationale: Die Übersetzung erhält die körperliche, kultische und soziale Dimension des griechischen Reinigungsbegriffs. „Werde geheilt“ wäre zu medizinisch verengt, „Sei gereinigt“ im heutigen Deutsch unnötig steif.
- issue: Bedeutungsumfang von θέλω
  choice: Ich will.
  alternative: Ich bin bereit. / Ich will es.
  rationale: Die knappe Form entspricht der griechischen Antwort und lässt die enge Verbindung von Willen und Bereitschaft bestehen, ohne sie erklärend festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die direkte Rede bleibt so prägnant wie im griechischen Text. Der Fußnotenmarker steht beim sachlich erläuterten Begriff „Aussatz“.
