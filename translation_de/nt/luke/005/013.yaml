  source_fidelity: 'Der Satz gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: das Ausstrecken der Hand, die Berührung, Jesu knappe Willensäußerung, den Reinigungsimperativ und das unmittelbare Verschwinden der Krankheit. „Werde rein!“ erhält καθαρίσθητι besser als eine bloß medizinische Heilungsformel.'
  naturalness: Die Satzfügung und die direkte Rede sind im modernen Standarddeutsch natürlich und prägnant. „Aussatz“ ist jedoch im gegenwärtigen allgemeinen Sprachgebrauch deutlich altertümlicher und kann stigmatisierend wirken; „Lepra“ ist die geläufigere moderne Bezeichnung, sofern die notwendige Bedeutungsweite in der Fußnote abgesichert wird.
  terminology: „Ich will“ und „Werde rein!“ sind treffend. Für λέπρα wird „Lepra“ mit einer kultur- und sachbezogenen Fußnote empfohlen. Die Fußnote soll keine unbelegte Einschränkung auf „schwere“ Hautkrankheiten behaupten, sondern den weiteren, nicht sicher mit moderner Lepra gleichzusetzenden antiken Begriff erläutern.
