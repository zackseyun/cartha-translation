    rationale: Für modernes Standarddeutsch ist „Lepra“ üblicher. Da λέπρα im biblischen Gebrauch nicht einfach der modernen Lepra entspricht, muss die Fußnote diese terminologische Differenz ausdrücklich bewahren.
  - severity: low
    issue: Die Fußnote spricht von „verschiedenen schweren Hautkrankheiten“.
    rationale: Der griechische Ausdruck ist weiter als die moderne medizinische Diagnose, doch „schwere“ ist im Vers selbst nicht spezifiziert. Eine neutralere Formulierung wahrt die historische und medizinische Unschärfe besser.
