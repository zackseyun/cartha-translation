  terminology: „Geschäftspartner“ ist im wirtschaftlichen Zusammenhang angemessen. „Hab keine Angst“ und „Von jetzt an“ sind natürliche moderne Formulierungen. Die Fußnote sollte die Bedeutung von ζωγρέω erläutern, ohne die Hauptübersetzung als bloße alternative Lesart zu bezeichnen.
