  to: 'Ebenso erging es auch Jakobus und Johannes, den Söhnen des Zebedäus, die Simons Geschäftspartner waren. Und Jesus sagte zu Simon: »Hab keine Angst! Von jetzt an wirst du Menschen lebendig fangen.«[a][b]'
