source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: de
  text: 'Ebenso erging es auch Jakobus und Johannes, den Söhnen des Zebedäus, die Simons Geschäftspartner waren. Und Jesus sagte zu Simon: »Hab keine Angst! Von jetzt an wirst du Menschen lebendig fangen.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet „lebendig fangen“ oder „lebend gefangen nehmen“ und bezeichnet ein Ergreifen, bei dem die Gefangenen am Leben bleiben.
    reason: lexical_alternative
  - marker: b
    text: 'Vgl. Matthäus 4,19 und Markus 1,17: Dort steht die Formulierung »Menschenfischer«. Lukas verwendet hier ein anderes Verb.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Ebenso ergriff es auch
  rationale: Die Wendung setzt die in Vers 9 genannte Bestürzung elliptisch fort. Im Deutschen wird das fehlende Verb aus dem vorausgehenden Zusammenhang natürlich ergänzt; »auch« bewahrt die additive Kraft.
- source_word: υἱοὺς Ζεβεδαίου
  choice: die Söhne des Zebedäus
  rationale: Die traditionelle und klare deutsche Genitivkonstruktion bewahrt die familiäre Zuordnung.
- source_word: κοινωνοὶ
  choice: Geschäftspartner
  rationale: Im Zusammenhang des gemeinsam betriebenen Fischfangs bezeichnet das Wort eine wirtschaftliche Partnerschaft. »Geschäftspartner« unterscheidet diese Beziehung von bloßer Gemeinschaft oder Freundschaft.
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst!
  rationale: Eine natürliche, gegenwärtige deutsche Aufforderung, die Jesu beruhigenden Zuspruch wiedergibt.
- source_word: ἀπὸ τοῦ νῦν
  choice: Von jetzt an
  rationale: Markiert idiomatisch den entscheidenden Beginn von Simons neuer Aufgabe.
- source_word: ἀνθρώπους
  choice: Menschen
  rationale: Das griechische Wort meint hier Menschen allgemein und nicht ausschließlich männliche Personen.
- source_word: ζωγρῶν
  choice: lebendig fangen
  rationale: Das Partizip von ζωγρέω bezeichnet das Fangen oder Ergreifen unter Bewahrung des Lebens. Die Formulierung erhält zugleich das Bild des Fischfangs und Lukas’ besondere Wortwahl.
- source_word: καὶ εἶπεν
  choice: Doch … sagte
  rationale: Das einfache καί führt Jesu Antwort weiter; im deutschen Erzählfluss macht »doch« den sinntragenden Gegensatz zwischen Simons Angst und Jesu Zuspruch deutlich, ohne einen starken adversativen Gegensatz zu behaupten.
theological_decisions:
- issue: Das Bild von ζωγρέω in Jesu Berufungswort
  choice: wirst du Menschen lebendig fangen
  alternative: wirst du Menschen fangen / wirst du Menschenfischer sein
  rationale: Lukas verwendet nicht die aus Matthäus 4,19 und Markus 1,17 bekannte Wendung »Menschenfischer«, sondern ζωγρέω, das ausdrücklich ein lebendiges Ergreifen bezeichnen kann. Die Übersetzung bewahrt diese Besonderheit und harmonisiert die Parallelstellen nicht.
- issue: Referenz von ἀνθρώπους
  choice: Menschen
  alternative: Männer
  rationale: Gemeint sind Menschen allgemein. »Menschen« gibt den Umfang des griechischen Ausdrucks im Kontext sachgerecht wieder.
- issue: Lebensbezogene Nuance des Fangbildes
  choice: Die ungewöhnliche Spannung von »Menschen lebendig fangen« bleibt stehen
  alternative: Die Metapher als »Menschen gewinnen« erklären
  rationale: Eine Deutung als Bekehrung, Rettung oder Gewinnung wäre bereits eine theologische Auslegung. Der Text wahrt stattdessen Lukas’ auffälliges Bild und seine Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ellipse am Versanfang wird aus Vers 9 mit »ergriff es« verständlich ergänzt. »Geschäftspartner« präzisiert den beruflichen Zusammenhang. Die direkte Rede ist natürlich formuliert; die markante lukanische Metapher bleibt bewusst ungeglättet.
