  text: But new wine must be put into fresh wineskins[a].
translation:
  language: de
  text: Sondern neuer Wein muss in frische Weinschläuche gefüllt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Neuer Wein muss in neue Weinschläuche gefüllt werden.“ Im Griechischen stehen zwei verschiedene Adjektive: νέος („neu“, besonders der Zeit nach) für den Wein und καινός („neu/frisch“, besonders hinsichtlich Beschaffenheit oder Zustand) für die Weinschläuche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sondern
  rationale: Die Konjunktion setzt der im vorigen Vers beschriebenen ungeeigneten Handlungsweise die richtige entgegen; im Deutschen gibt „sondern“ diesen korrigierenden Gegensatz natürlich wieder.
- source_word: οἶνον νέον
  choice: neuer Wein
  rationale: νέος bezeichnet hier zeitlich neuen, jungen beziehungsweise frisch erzeugten Wein. „Neuer Wein“ bleibt nah am griechischen Ausdruck und ist im Zusammenhang verständlich.
- source_word: εἰς
  choice: in
  rationale: Im Deutschen bezeichnet „in“ zusammen mit dem Akkusativ die Bewegung in einen Behälter und gibt damit die Richtung des griechischen εἰς idiomatisch wieder.
- source_word: ἀσκοὺς
  choice: Weinschläuche
  rationale: ἀσκός bezeichnet hier aus Tierhaut gefertigte Behälter für Wein; „Weinschläuche“ macht den Gegenstand für heutige Leser eindeutig.
- source_word: καινοὺς
  choice: frische
  rationale: καινός hebt hier den neuen beziehungsweise ungebrauchten und noch geeigneten Zustand der Schläuche hervor. „Frisch“ wahrt zumindest teilweise den Unterschied zu νέος beim Wein.
- source_word: βλητέον
  choice: muss … gefüllt werden
  rationale: Das Verbaladjektiv drückt unpersönliche Notwendigkeit aus. Bei Wein und Behältern ist „gefüllt werden“ im Deutschen natürlicher als das wörtlichere „hineingetan werden“.
theological_decisions:
- issue: Unterscheidung zwischen νέος und καινός
  choice: νέος mit „neu“ und καινός mit „frisch“ wiedergeben
  alternative: Beide Adjektive mit „neu“ wiedergeben
  rationale: Der griechische Text verwendet bewusst zwei verschiedene Adjektive. Die differenzierte Wiedergabe erhält die sprachliche Spannung, ohne dem Gleichnis eine bestimmte theologische Deutung aufzuzwingen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Weinschläuche“ bewahrt den historischen Sachbezug; die Fußnote dokumentiert die echte lexikalische Alternative.
