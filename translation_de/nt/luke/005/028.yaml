  verdict: approve
  source_fidelity: „Und er ließ alles zurück, stand auf und folgte ihm.“ gibt καὶ καταλιπὼν πάντα ἀναστὰς ἠκολούθει αὐτῷ zuverlässig wieder. Die deutsche finite Reihung ersetzt die griechischen Partizipien idiomatisch, bewahrt aber ihre sachliche und zeitliche Abfolge. „Alles“ erhält die umfassende, nicht weiter spezifizierte Aussage von πάντα. „Folgte“ ist für das Imperfekt in diesem knappen Erzählkontext eine angemessene, nicht überinterpretierende Wiedergabe.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und hat einen klaren, würdigen biblisch-erzählenden Ton. „ließ alles zurück“ und „stand auf“ sind natürlich und präzise.
  terminology: Die pronominale Wiedergabe „ihm“ entspricht αὐτῷ und wahrt den Anschluss an den unmittelbaren Kontext. Es werden keine zusätzlichen theologischen, zeitlichen oder psychologischen Aussagen eingetragen. Eine Fußnote ist nicht erforderlich; die englische alternative Partizipialform betrifft keine im Deutschen nötige Mehrdeutigkeit.
