  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: de
  text: Und er ließ alles zurück, stand auf und folgte ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte Verknüpfung mit der vorangehenden Berufungsszene, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
- source_word: καταλιπὼν
  choice: ließ ... zurück
  rationale: Das Aoristpartizip von καταλείπω bezeichnet hier eine dem Aufstehen und Folgen vorausgehende, entschiedene Handlung. Die finite deutsche Reihung ist natürlich und gibt die zeitliche Abfolge klar wieder.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural ist umfassend; „alles“ ist die natürliche deutsche Entsprechung, ohne näher festzulegen, was dazu gehörte.
- source_word: ἀναστὰς
  choice: stand auf
  rationale: Das Aoristpartizip von ἀνίστημι bezeichnet im erzählenden Zusammenhang das körperliche Aufstehen als Übergang zum Handeln.
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt beschreibt das einsetzende beziehungsweise fortdauernde Folgen. Das deutsche Präteritum „folgte“ lässt diesen Aspekt im Kontext offen und vermeidet die stärkere Festlegung „begann zu folgen“.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen verweist im unmittelbaren Zusammenhang auf Jesus; die pronominale Form bewahrt den Zusammenhalt des griechischen Textes.
theological_decisions:
- issue: Umfang von Levis Verzicht bei seiner Nachfolge
  choice: Die Übersetzung sagt uneingeschränkt, dass er „alles“ zurückließ und Jesus folgte.
  alternative: Die Aussage ausdrücklich als vorübergehendes Verlassen der Arbeit oder als dauerhaften Verzicht auf sämtlichen Besitz deuten.
  rationale: πάντα wird in seiner umfassenden Form bewahrt, doch der Vers selbst bestimmt weder die genaue Zusammensetzung des Zurückgelassenen noch die besitzethischen Folgen über diesen Erzählmoment hinaus.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die koordinierte finite Satzfolge klingt natürlicher als eine wörtliche Häufung deutscher Partizipialkonstruktionen und erhält zugleich die Handlungsabfolge.
