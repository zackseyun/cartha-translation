  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: de
  text: Und nachdem sie die Boote an Land gebracht hatten, ließen sie alles zurück und folgten ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: nachdem sie … gebracht hatten
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die der Haupthandlung vorausgeht. Der deutsche Temporalsatz gibt diese Abfolge natürlich und klar wieder.
- source_word: τὰ πλοῖα
  choice: die Boote
  rationale: πλοῖον kann ein Boot oder Schiff bezeichnen; im Zusammenhang des Fischfangs auf dem See Gennesaret ist „Boote“ die natürliche und sachlich passende Wiedergabe.
- source_word: ἐπὶ τὴν γῆν
  choice: an Land
  rationale: Die Wendung bedeutet wörtlich „auf das Land“. „An Land“ ist im Deutschen die idiomatische Formulierung für das Anlanden der Boote, ohne γῆ unnötig auf „Ufer“ einzuengen.
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Das Aoristpartizip von ἀφίημι bedeutet hier, etwas zurückzulassen. Die finite deutsche Verbform bildet zusammen mit „folgten“ einen natürlichen Satz und bewahrt die erzählte Handlungsfolge.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend die Gesamtheit dessen, was sie zurückließen. „Alles“ ist die natürliche deutsche Entsprechung.
- source_word: ἠκολούθησαν αὐτῷ
  choice: folgten ihm
  rationale: ἀκολουθέω bezeichnet sowohl das konkrete Nachfolgen als auch im Kontext die Jüngerschaft. „Folgten ihm“ bewahrt beide Bedeutungsebenen, ohne sie auszudeuten.
theological_decisions:
- issue: Reichweite des Verzichts in πάντα
  choice: ließen sie alles zurück
  alternative: ließen sie alles zurück, was sie hatten; gaben sie dauerhaft ihren gesamten Besitz auf
  rationale: Der Text betont umfassend, dass sie alles zurückließen, bestimmt aber nicht ausdrücklich die rechtliche oder dauerhafte Reichweite ihres Besitzverzichts. Die Übersetzung erhält diese Spannung und fügt keine weitergehende Lehraussage hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Temporalsatz macht die zeitliche Beziehung des ersten Partizips deutlich; „ließen … zurück“ gibt den Sinn des zweiten Partizips idiomatisch wieder. Keine Fußnote ist nötig, da die naheliegenden Alternativen keine für den deutschen Haupttext relevante Mehrdeutigkeit bewahren.
