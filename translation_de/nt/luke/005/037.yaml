  - severity: low
    issue: „die Schläuche werden unbrauchbar“
    rationale: ἀπολοῦνται bezeichnet hier ihr Zugrundegehen bzw. Zerstörtwerden. „Unbrauchbar“ trifft die praktische Folge, schwächt aber das dargestellte Verderben ab.
