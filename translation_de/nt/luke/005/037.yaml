source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: de
  text: Und niemand füllt neuen Wein in alte Weinschläuche. Sonst zerreißt der neue Wein die Schläuche, der Wein läuft aus, und die Schläuche werden zerstört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάλλει
  choice: füllt … in
  rationale: Das allgemeine Verb bedeutet hier, etwas in ein Gefäß hineinzutun. Bei Wein und Schläuchen ist „füllt … in“ im Deutschen natürlich, ohne den Vorgang unnötig als Gießen festzulegen.
- source_word: οἶνον νέον
  choice: jungen Wein
  rationale: „Junger Wein“ ist die natürliche deutsche Bezeichnung für neuen, noch gärenden Wein und bewahrt das Bild des Ausgangstextes.
- source_word: ἀσκοὺς παλαιούς
  choice: alte Weinschläuche
  rationale: ἀσκός bezeichnet einen aus Tierhaut gefertigten Flüssigkeitsbehälter. „Weinschläuche“ macht die im Kontext gemeinte Verwendung klar.
- source_word: εἰ δὲ μήγε
  choice: Sonst
  rationale: Die knappe deutsche Wendung gibt die angedrohte Folge des zuvor ausgeschlossenen Handelns idiomatisch wieder.
- source_word: ῥήξει
  choice: wird … zerreißen
  rationale: Das Verb bezeichnet das gewaltsame Aufreißen beziehungsweise Bersten der Schläuche. „Zerreißen“ bildet auch die Verursachung durch den jungen Wein klar ab.
- source_word: καὶ αὐτός
  choice: er
  rationale: Das betonte Pronomen bezieht sich auf den jungen Wein. Das deutsche Pronomen stellt diesen Bezug natürlich her; die Wiederaufnahme in einem eigenen Hauptsatz wahrt einen gewissen Nachdruck.
- source_word: ἐκχυθήσεται
  choice: wird auslaufen
  rationale: Der passive Aorist-Futur bezeichnet, dass der Wein infolge des Risses ausgegossen beziehungsweise verschüttet wird. „Auslaufen“ beschreibt die konkrete Folge im Deutschen am natürlichsten.
- source_word: ἀπολοῦνται
  choice: werden unbrauchbar
  rationale: Bei Behältern bezeichnet ἀπόλλυμι hier ihren Verlust beziehungsweise ihre Zerstörung. „Unbrauchbar werden“ vermittelt den praktischen Verlust, ohne eine unpassende personale Formulierung wie „umkommen“ zu verwenden.
- source_word: οὐδεὶς
  choice: niemand
  rationale: „Niemand“ ist die direkte und im sprichwortartigen Satz natürliche Entsprechung.
