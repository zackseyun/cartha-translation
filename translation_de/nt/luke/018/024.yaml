  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: de
  text: 'Als Jesus ihn sah, sagte er: „Wie schwer ist es doch für Menschen, die Reichtum besitzen, in das Reich Gottes zu kommen!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς εἶπεν
  choice: Als Jesus ihn sah, sagte er
  rationale: Das temporale „Als … sah“ gibt das Aoristpartizip ἰδών im natürlichen modernen Deutsch wieder. δέ ist hier ein leichter erzählerischer Anschluss und muss nicht eigens mit „aber“ oder „und“ markiert werden.
- source_word: Πῶς δυσκόλως
  choice: Wie schwer ist es doch
  rationale: Die Formulierung gibt den ausrufenden Grad des griechischen Ausdrucks wieder. „doch“ verstärkt hier idiomatisch den Ausruf, ohne die Aussage inhaltlich zu verschärfen.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: Menschen, die Reichtum besitzen
  rationale: Die Wiedergabe bewahrt die partizipiale Beschreibung und fasst χρήματα im Kontext als Vermögen beziehungsweise Reichtum auf, nicht lediglich als Bargeld.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: in das Reich Gottes zu kommen
  rationale: „In das Reich Gottes kommen“ ist im Deutschen eine natürliche Wiedergabe des Hineingehens; die Infinitivkonstruktion entspricht idiomatisch dem Zusammenhang mit „schwer“.
theological_decisions:
- issue: Aussage über Wohlhabende und den Eintritt in Gottes Reich
  choice: Eine allgemeine Aussage darüber, wie schwer es für Menschen mit Reichtum ist, in Gottes Reich zu kommen
  alternative: Eine ausdrückliche absolute Unmöglichkeit für Wohlhabende
  rationale: Der Vers bezeichnet den Eintritt als schwer, nicht ausdrücklich als unmöglich. Die Übersetzung bewahrt diese Spannung und greift der Erläuterung im folgenden Kontext nicht vor.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur ist natürlich deutsch, bleibt aber eng an der griechischen Aussage. Keine Fußnote ist erforderlich, da die Bedeutungsbreite von χρήματα im Haupttext angemessen mit „Reichtum“ erfasst wird.
