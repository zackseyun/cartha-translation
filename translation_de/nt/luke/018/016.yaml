id: LUK.18.16
reference: Luke 18:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: de
  text: 'Jesus aber rief sie zu sich und sagte: »Lasst die Kinder zu mir kommen und hindert sie nicht daran, denn solchen gehört das Reich Gottes[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn von solchen ist das Reich Gottes.«'
    reason: Die Fußnote macht die knappe griechische Genitivkonstruktion sichtbar, die im Haupttext idiomatisch mit »gehört« wiedergegeben wird.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: rief sie zu sich
  rationale: Das mediale Verb bezeichnet hier ein Herbeirufen zu sich; die deutsche Formulierung gibt sowohl den Rückbezug des Pronomens als auch die gerichtete Bewegung natürlich wieder.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Lasst die Kinder zu mir kommen
  rationale: Die direkte Aufforderung entspricht der Konstruktion mit ἄφετε und Infinitiv und klingt im modernen Deutsch natürlich.
- source_word: μὴ κωλύετε αὐτά
  choice: hindert sie nicht daran
  rationale: κωλύω bedeutet hindern oder abhalten. Das ergänzende »daran« nimmt im Deutschen idiomatisch auf das Kommen Bezug, ohne den Sinn einzuengen.
- source_word: τῶν ... τοιούτων
  choice: solchen
  rationale: 'Das substantivierte »solchen« bewahrt die repräsentative Offenheit des Griechischen: Gemeint sind nicht zwingend nur die anwesenden Kinder, doch die maßgebliche Ähnlichkeit wird in diesem Vers nicht erklärt.'
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die geläufige, sachlich genaue deutsche Wiedergabe der Herrschafts- und Reichsformulierung.
theological_decisions:
- issue: Reichweite von τῶν τοιούτων
  choice: »solchen« lässt die Aussage über die konkret anwesenden Kinder hinaus offen
  alternative: ausschließlich »diesen Kindern« oder erklärend »Menschen, die wie diese Kinder sind«
  rationale: Die griechische Wendung bezeichnet eine durch die Kinder repräsentierte Gruppe, legt aber hier nicht ausdrücklich fest, welche Eigenschaft den Vergleich bestimmt. Die knappe Form wahrt diese theologische Spannung.
- issue: Genitivische Beziehung in τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: »solchen gehört das Reich Gottes«
  alternative: 'wörtlicher: »denn von solchen ist das Reich Gottes«'
  rationale: »gehört« bildet die Zugehörigkeitsbeziehung idiomatisch ab, ohne zu erläutern, wie diese Zugehörigkeit theologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt schlicht und eindringlich; »solchen« erhält bewusst die Offenheit des Ausgangstextes.
