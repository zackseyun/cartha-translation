  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: de
  text: 'Und er rief laut: „Jesus, Sohn Davids[a], hab Erbarmen mit mir!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sohn Davids“ ist ein messianischer Titel und erinnert an den verheißenen König aus Davids Linie; allgemeiner könnte man auch „Nachkomme Davids“ übersetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: rief laut
  rationale: Das Verb bezeichnet einen lauten, dringlichen Ruf. „Rief laut“ gibt Lautstärke und Dringlichkeit natürlich wieder, ohne unnötig einen Schmerzensschrei anzudeuten.
- source_word: λέγων
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Das griechische Partizip leitet die direkte Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion; ein zusätzliches „und sagte“ wäre schwerfällig.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Die Vokativform des Eigennamens wird nach der üblichen deutschen Namensform wiedergegeben.
- source_word: υἱὲ Δαυίδ
  choice: Sohn Davids
  rationale: Die wörtliche und im Evangelienkontext titelartige Wiedergabe bewahrt den königlich-messianischen Anklang; „Nachkomme Davids“ bleibt als erklärende Alternative in der Fußnote erhalten.
- source_word: ἐλέησόν με
  choice: erbarme dich über mich
  rationale: Die feste deutsche Wendung gibt die direkte, dringliche Bitte um barmherziges Eingreifen wieder und bewahrt zugleich ihr biblisch-theologisches Gewicht.
theological_decisions:
- issue: Messianische Bedeutung der Anrede υἱὲ Δαυίδ
  choice: Als Titel „Sohn Davids“ wiedergegeben.
  alternative: 'Allgemeiner: „Nachkomme Davids“.'
  rationale: Im lukanischen Zusammenhang trägt die Anrede königlich-messianische Bedeutung. Die titelartige Form bewahrt diese Resonanz, ohne sie im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Doppelpunkt vermeidet eine im Deutschen unnötig schwere Nachbildung von λέγων; die direkte Rede behält durch Ausrufezeichen und Imperativ ihre Dringlichkeit.
