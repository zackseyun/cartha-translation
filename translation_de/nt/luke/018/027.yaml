source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: de
  text: 'Er aber sagte: »Was bei Menschen unmöglich ist, ist bei Gott möglich.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was für Menschen unmöglich ist, ist für Gott möglich.«'
    reason: Lexikalische Alternative für παρά mit Dativ; die Präposition kann den Bereich oder den Bezug ausdrücken.
lexical_decisions:
- source_word: ἀδύνατα
  choice: was … unmöglich ist
  rationale: Das substantivisch gebrauchte Neutrum Plural wird im Deutschen natürlich mit einem verallgemeinernden Relativsatz wiedergegeben. So bleibt die Aussage umfassend, ohne daraus einen abstrakten philosophischen Fachsatz zu machen.
- source_word: παρὰ ἀνθρώποις
  choice: bei Menschen
  rationale: παρά mit Dativ bezeichnet hier den menschlichen Bereich beziehungsweise den Bezugspunkt. „Bei Menschen“ ist idiomatisch und gibt ἀνθρώποις geschlechtsübergreifend korrekt wieder.
- source_word: δυνατὰ
  choice: möglich
  rationale: Das ebenfalls substantivisch gebrauchte Neutrum Plural bildet den direkten Gegensatz zu ἀδύνατα. „Möglich“ bewahrt diese klare Gegenüberstellung.
- source_word: παρὰ τῷ θεῷ
  choice: bei Gott
  rationale: Die parallele Wiedergabe von παρά mit Dativ erhält den Kontrast zwischen dem menschlichen Bereich und Gott. „Bei Gott“ ist im Deutschen natürlich und eng am griechischen Ausdruck.
- source_word: ὁ δὲ εἶπεν
  choice: Er aber sagte
  rationale: δέ hat hier eine leicht entgegensetzende beziehungsweise weiterführende Funktion. „Er aber sagte“ bewahrt diese Nuance in einem würdigen, verständlichen Erzählstil.
theological_decisions:
- issue: Reichweite der göttlichen Möglichkeit
  choice: Der Vers stellt dem im menschlichen Bereich Unmöglichen das bei Gott Mögliche gegenüber, ohne jede denkbare Handlung eigens zu erfassen.
  alternative: Die Aussage als uneingeschränkten philosophischen Lehrsatz über jede abstrakt vorstellbare Möglichkeit formulieren.
  rationale: Im Zusammenhang geht es um menschliche Unfähigkeit und Gottes Möglichkeit im Blick auf Rettung und den Eintritt in Gottes Reich. Die Übersetzung lässt die weitreichende Aussage stehen, trägt aber keine weitergehende philosophische Bestimmung in den Text ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Satzführung. Die parallelen Formulierungen „bei Menschen“ und „bei Gott“ bilden die Struktur des griechischen Satzes deutlich ab.
