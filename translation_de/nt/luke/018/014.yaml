    rationale: Die Formulierung zeigt zwar den erzählerischen Kontrast, bringt aber die vergleichende Relation der griechischen Konstruktion nicht ausreichend zum Ausdruck. „Eher gerechtfertigt ... als jener“ macht die relative Gegenüberstellung sichtbar, ohne die Aussage zu einer vollständigen expliziten Aussage über den Status des anderen auszuweiten.
