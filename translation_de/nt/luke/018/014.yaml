id: LUK.18.14
reference: Luke 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: de
  text: 'Ich sage euch: Dieser ging eher gerechtfertigt in sein Haus hinab als jener[a]. Denn jeder, der sich selbst erhöht, wird erniedrigt werden; wer sich aber selbst erniedrigt, wird erhöht werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser ging gerechtfertigt in sein Haus hinab – im Vergleich mit jenem.“ Die griechische Wendung stellt diesen Mann dem anderen Betenden vergleichend gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: gerechtfertigt
  rationale: Das Partizip Perfekt Passiv bezeichnet einen eingetretenen und fortbestehenden günstigen Rechtsspruch. „Gerechtfertigt“ bewahrt den forensischen Klang, ohne eine weitergehende systematisch-theologische Deutung einzutragen.
- source_word: παρ’ ἐκεῖνον
  choice: im Gegensatz zu jenem
  rationale: παρά mit Akkusativ trägt hier eine vergleichende beziehungsweise kontrastierende Bedeutung. Die Formulierung gibt den Gegensatz zum Pharisäer natürlich wieder; eine Fußnote bewahrt die mögliche stärker komparative Wiedergabe.
- source_word: κατέβη
  choice: ging … hinab
  rationale: Die konkrete Bewegung des καταβαίνω bleibt erhalten und passt zum Hinabgehen vom Tempelbereich.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: in sein Haus
  rationale: Die Wendung entspricht der räumlichen Form des Griechischen und ist im Deutschen verständlich; „nach Hause“ wäre idiomatischer, würde die Form jedoch stärker glätten.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: jeder, der sich selbst erhöht
  rationale: Das substantivierte Partizip formuliert eine allgemeine Regel. „Jeder, der“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Singular sowie den reflexiven Nachdruck.
- source_word: ταπεινωθήσεται
  choice: wird erniedrigt werden
  rationale: Das Futur Passiv bleibt erhalten; der Handelnde wird wie im Griechischen nicht ausdrücklich genannt.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: wer sich aber selbst erniedrigt
  rationale: „Wer“ setzt die allgemeine Aussage knapp fort, während „aber“ den durch δέ markierten Gegensatz ausdrückt.
- source_word: ὑψωθήσεται
  choice: wird erhöht werden
  rationale: Die passive Form und der sprachliche Gegensatz zu „sich selbst erhöht“ beziehungsweise „erniedrigt“ bleiben gewahrt.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet die Begründung des vorangehenden Urteils ein. „Denn“ verbindet den Merksatz im modernen Deutschen natürlich mit der Aussage davor.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen verweist pointiert auf den Zolleinnehmer und stellt ihn dem anderen Betenden gegenüber.
theological_decisions:
- issue: Bedeutung von δικαιόω am Schluss des Gleichnisses
  choice: „gerechtfertigt“ als günstiger göttlicher Rechtsspruch
  alternative: „als gerecht anerkannt“ oder „bestätigt“ in einem allgemeineren Sinn
  rationale: Der Zusammenhang betrifft die Stellung der beiden Betenden vor Gott. „Gerechtfertigt“ erhält das theologische und forensische Gewicht, ohne eine vollständige spätere Rechtfertigungslehre in den einzelnen Vers hineinzulesen.
- issue: Verhältnis der beiden Betenden in παρ’ ἐκεῖνον
  choice: Kontrast in der Hauptübersetzung, komparative Möglichkeit in der Fußnote
  alternative: „mehr als jener“ beziehungsweise „im Vergleich mit jenem“
  rationale: Die griechische Präposition kann einen Kontrast oder Vergleich bezeichnen. Die Übersetzung macht den erzählerischen Gegensatz deutlich, lässt aber die grammatisch mögliche komparative Nuance ausdrücklich offen.
- issue: Generisches Maskulinum der Sentenz
  choice: generischer Singular mit „jeder“ und „wer“
  alternative: Pluralische oder ausdrücklich geschlechtsneutrale Umformulierung
  rationale: Die griechischen maskulinen Singularformen dienen als allgemeine Personenbezeichnung. Die deutsche Formulierung hält den Singular und bezieht die Aussage erkennbar auf jeden Menschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „ging … hinab“ erhält das Bewegungsbild, ohne altertümlich zu wirken. Der Gedankenstrich hebt den Kontrast hervor; der parallele Aufbau der abschließenden Sentenz bleibt klar erkennbar.
