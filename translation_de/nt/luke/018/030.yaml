source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: de
  text: der ganz gewiss ein Vielfaches in dieser Zeit und im kommenden Zeitalter ewiges Leben empfangen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: nicht mit Sicherheit … wird
  rationale: Die Verbindung aus οὐχί und μή mit dem Aoristkonjunktiv bildet hier eine nachdrückliche rhetorische Frage, deren erwartete Antwort positiv ist. Die deutsche Formulierung bewahrt die Negation und die Gewissheit im syntaktischen Anschluss an den vorherigen Vers.
- source_word: ἀπολάβῃ
  choice: empfangen wird
  rationale: ἀπολαμβάνω kann „zurückerhalten“ oder allgemeiner „empfangen“ bedeuten. „Empfangen“ ist hier natürlich und lässt den Gedanken der Vergeltung aus dem Kontext hervorgehen, ohne die Vorsilbe zu überzeichnen.
- source_word: πολλαπλασίονα
  choice: ein Vielfaches
  rationale: Der substantivisch gebrauchte neutrale Plural bezeichnet einen vielfachen Ertrag beziehungsweise Ersatz. „Ein Vielfaches“ gibt dies knapp und idiomatisch wieder.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: in dieser Zeit
  rationale: καιρός bezeichnet hier die gegenwärtige Zeit im Kontrast zum kommenden Zeitalter. „In dieser Zeit“ wahrt diese zeitlich-eschatologische Gegenüberstellung.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: im kommenden Zeitalter
  rationale: „Im kommenden Zeitalter“ gibt die neutestamentliche Zwei-Zeitalter-Perspektive natürlich und deutlich wieder, ohne sie auf eine bloß unbestimmte Zukunft zu reduzieren.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: „Ewiges Leben“ ist die etablierte und kontextuell angemessene deutsche Wiedergabe und umfasst sowohl die eschatologische als auch die dauerhafte Dimension.
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen knüpft an die im vorherigen Vers beschriebene Person an. „Der“ bewahrt diesen Satzanschluss; der Vers ist für sich genommen deshalb bewusst ein Satzfragment.
theological_decisions:
- issue: Eschatologischer Ausdruck αἰῶνι τῷ ἐρχομένῳ
  choice: im kommenden Zeitalter
  alternative: in der kommenden Welt
  rationale: „Zeitalter“ bewahrt den Charakter von αἰών und den Gegensatz zwischen gegenwärtiger Zeit und kommender Heilsordnung. „Welt“ wäre geläufig, könnte die zeitlich-eschatologische Dimension jedoch stärker räumlich erscheinen lassen.
- issue: Gewissheit in der rhetorischen Negation οὐχὶ μὴ
  choice: der nicht mit Sicherheit … wird
  alternative: der ganz gewiss … empfangen wird
  rationale: Der griechische Wortlaut setzt die Aussage des vorherigen Verses als rhetorische Frage fort und erwartet entschieden die Antwort, dass niemand ohne vielfachen Empfang bleibt. Die Übersetzung erhält diese negative Form, statt sie stillschweigend in eine positive Aussage umzuwandeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wortlaut bleibt als Relativsatz an Lukas 18,29 angeschlossen. Die ungewöhnlich wirkende negative Form ist wegen der griechischen rhetorischen Konstruktion bewusst beibehalten.
