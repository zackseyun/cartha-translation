  source_fidelity: 'Die griechische Konstruktion οὐχὶ μὴ ἀπολάβῃ ist eine nachdrückliche Verneinung mit der Aussagewirkung einer festen Zusage: Keiner der in V. 29 beschriebenen Personen wird ohne den vielfachen Empfang bleiben. „Nicht mit Sicherheit“ verschiebt den Skopus jedoch in Richtung von Unsicherheit („nicht sicher“) und gibt die emphatische Gewissheit daher nicht zuverlässig wieder. Die positive deutsche Zusage gibt die beabsichtigte Aussagewirkung idiomatisch und genau wieder.'
