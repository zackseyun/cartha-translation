  terminology: „Ein Vielfaches“, „in dieser Zeit“, „im kommenden Zeitalter“ und „ewiges Leben“ sind quellentreu und terminologisch angemessen. „Kommendes Zeitalter“ bewahrt die eschatologische αἰών-Terminologie.
