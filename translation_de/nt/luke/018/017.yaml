id: LUK.18.17
reference: Luke 18:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: de
  text: 'Amen, ich sage euch: Wer das Reich Gottes nicht wie ein Kind annimmt[a], wird ganz gewiss nicht hineinkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein Kind“. Der Ausdruck kann kindliche Empfänglichkeit, Vertrauen, Demut oder Abhängigkeit hervorheben; der griechische Text legt die genaue Eigenschaft nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das einleitende ἀμήν ist eine feierliche Bekräftigungsformel Jesu. „Amen, ich sage euch“ ist im Deutschen verständlich, würdevoll und bewahrt die markante Form des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung gibt die direkte Anrede genau und in natürlichem, gehobenem Standarddeutsch wieder.
- source_word: ὃς ἂν
  choice: Wer
  rationale: Das Relativpronomen mit ἄν formuliert eine allgemeine, unbestimmte Bedingung; deutsches „Wer“ gibt sie knapp und idiomatisch wieder.
- source_word: μὴ δέξηται
  choice: nicht annimmt
  rationale: δέχομαι bezeichnet hier ein empfangendes Annehmen. „Annehmen“ passt im Deutschen natürlich zum Reich Gottes und wahrt sowohl Aufnahme als auch Zustimmung, ohne die Metapher näher auszulegen.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Das Reich Gottes“ ist die etablierte und transparente deutsche Wiedergabe. Sie lässt die Bedeutungsbreite zwischen Herrschaft und Herrschaftsbereich bestehen.
- source_word: ὡς παιδίον
  choice: wie ein Kind
  rationale: ὡς bezeichnet hier einen Vergleich oder die Art und Weise. „Wie ein Kind“ bewahrt das offene Bild, ohne festzulegen, welche kindliche Eigenschaft gemeint ist.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: wird ganz gewiss nicht hineinkommen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ bildet diese Stärke verständlich ab; „hineinkommen“ nimmt die räumliche Metapher des Eintritts idiomatisch auf.
- source_word: εἰς αὐτήν
  choice: hineinkommen
  rationale: Das Präfix „hinein-“ gibt εἰς wieder; der Bezug auf das zuvor genannte Reich ist im Deutschen eindeutig und braucht nicht wiederholt zu werden.
theological_decisions:
- issue: Bedeutung des Annehmens des Reiches Gottes „wie ein Kind“
  choice: Der Vergleich bleibt im Haupttext offen und wird nicht auf eine bestimmte kindliche Eigenschaft festgelegt.
  alternative: „mit kindlichem Vertrauen“, „in kindlicher Demut“ oder „als ein Kind“
  rationale: Der griechische Text nennt weder Vertrauen noch Demut, Abhängigkeit oder Empfänglichkeit ausdrücklich. Die offene Formulierung bewahrt daher die echte Auslegungsspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel „Amen, ich sage euch“ bewahrt den feierlichen Charakter; Satzbau und Wortwahl bleiben zugleich allgemein verständlich.
