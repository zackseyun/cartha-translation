  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: de
  text: 'In jener Stadt lebte auch eine Witwe. Sie kam immer wieder zu ihm und sagte: »Verschaffe mir Recht gegen meinen Prozessgegner!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verhilf mir zu meinem Recht gegen meinen Gegner!« Das griechische Verb meint hier, Recht zu verschaffen oder jemanden gerichtlich zu seinem Recht kommen zu lassen, nicht unbedingt persönliche Rache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: Witwe
  rationale: Die direkte und im Deutschen übliche Bezeichnung; zugleich bleibt die sozial verletzliche Stellung der Frau im Kontext der Erzählung erkennbar.
- source_word: δὲ
  choice: auch
  rationale: Die Partikel führt neben dem zuvor genannten Richter eine weitere Person der Erzählung ein. »Auch« verbindet natürlich, ohne einen starken Gegensatz zu behaupten.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: In jener Stadt lebte
  rationale: Das existenzielle ἦν wird im Deutschen bei einer Person idiomatisch mit »lebte« wiedergegeben; »jener Stadt« bewahrt den rückverweisenden Charakter von ἐκείνῃ.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: Sie kam immer wieder zu ihm
  rationale: Der Imperfekt bezeichnet im Zusammenhang ein wiederholtes, beharrliches Kommen; »immer wieder« macht diesen Aspekt natürlich verständlich.
- source_word: λέγουσα
  choice: und sagte
  rationale: Das Partizip bezeichnet die begleitende, bei ihren wiederholten Besuchen vorgebrachte Rede. Das deutsche Präteritum fügt sich natürlich in die Erzählung ein.
- source_word: Ἐκδίκησόν με
  choice: Verschaffe mir Recht
  rationale: Im gerichtlichen Kontext fordert die Witwe Rechtsschutz beziehungsweise einen Rechtsspruch, nicht persönliche Rache. Die Formulierung ist klar, gegenwärtig und wahrt den juristischen Sinn.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: gegenüber meinem Prozessgegner
  rationale: ἀντίδικος bezeichnet hier die Gegenpartei in einem Rechtsstreit. »Prozessgegner« macht den juristischen Kontext präzise; »gegenüber« lässt offen, ob Schutz vor ihm oder ein Urteil gegen ihn im Vordergrund steht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Handlung wird ausdrücklich wiedergegeben. »Prozessgegner« verdeutlicht die gerichtliche Situation, während die Fußnote die Bedeutungsbreite des griechischen Rechtsbegriffs bewahrt.
