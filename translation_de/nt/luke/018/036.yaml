  text: ἀκούσας δὲ ὄχλου διαπορευομένου ἐπυνθάνετο ⸀τί εἴη τοῦτο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: de
  text: Als er hörte, dass eine Menschenmenge vorbeizog, erkundigte er sich, was das sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „was dies sei“. Das Imperfekt kann ein fortgesetztes oder wiederholtes Nachfragen andeuten; der Optativ steht hier in einer indirekten Frage nach einem Verb der Vergangenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Als er hörte
  rationale: Das Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben und bezeichnet die Wahrnehmung, die zur Nachfrage führt.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die schwache narrative Verknüpfung ist im Deutschen durch den fortlaufenden Satzanschluss ausreichend erkennbar; ein zusätzliches „und“ oder „da“ wäre schwerfällig.
- source_word: ὄχλου διαπορευομένου
  choice: dass eine Menschenmenge vorbeizog
  rationale: Die Genitivkonstruktion bezeichnet den gehörten Vorgang. „Vorbeizog“ gibt die fortschreitende Bewegung idiomatisch wieder; der artikellose ὄχλος wird mit „eine Menschenmenge“ übersetzt.
- source_word: ἐπυνθάνετο
  choice: erkundigte er sich
  rationale: Das Imperfekt bezeichnet hier einen im Gang befindlichen beziehungsweise wiederholten Erkundigungsvorgang. Das deutsche Präteritum ist natürlich und legt weder einen einmaligen noch ausdrücklich wiederholten Akt fest.
- source_word: τί εἴη τοῦτο
  choice: was da los sei
  rationale: Die indirekte Frage mit Optativ nach einem Vergangenheitstempus wird im Deutschen idiomatisch mit Konjunktiv I wiedergegeben. „Was da los sei“ bewahrt den Bezug auf das wahrgenommene Geschehen natürlicher als das steife „was dies sei“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „was da los sei“ erklärt das Ereignis nicht näher und erhält die Offenheit der Frage.
