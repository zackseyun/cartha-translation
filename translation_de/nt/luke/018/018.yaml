source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: de
  text: 'Und ein führender Mann fragte ihn: »Guter Lehrer, was muss ich tun, um das ewige Leben zu erben?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher steht hier: »Was getan habend, werde ich ewiges Leben erben?« Das griechische Partizip bezeichnet die Handlung als Voraussetzung oder Mittel für das künftige Erben.'
    reason: Die Fußnote bildet das Aoristpartizip ποιήσας und das Futur κληρονομήσω korrekt ab, während der Haupttext den Sinn idiomatisch ausdrückt.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: fragte
  rationale: Das Verb bezeichnet hier schlicht das Stellen einer Frage; „fragte“ ist natürlich und gibt die Erzählweise präzise wieder.
- source_word: τις ἄρχων
  choice: ein führender Mann
  rationale: τις führt eine nicht näher bestimmte Person ein, während ἄρχων ihren gesellschaftlichen Rang beziehungsweise ihre Autoritätsstellung bezeichnet. „Ein führender Mann“ wahrt diese Breite, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: λέγων
  choice: durch den folgenden Doppelpunkt ausgedrückt
  rationale: Das griechische Partizip leitet den Wortlaut der Frage ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, sodass ein zusätzliches „und sagte“ unnötig wäre.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Guter Lehrer
  rationale: Die direkte Anrede gibt sowohl διδάσκαλος als „Lehrer“ als auch ἀγαθός als „gut“ unmittelbar wieder und bewahrt damit die Formulierung, auf die Jesus im nächsten Vers eingeht.
- source_word: τί ποιήσας
  choice: was muss ich tun
  rationale: Das Aoristpartizip bezeichnet in Verbindung mit dem Futur die als Voraussetzung gedachte Handlung. „Was muss ich tun“ ist im Deutschen idiomatisch und erhält die handlungsbezogene Fragestellung des Mannes.
- source_word: ζωὴν αἰώνιον
  choice: das ewige Leben
  rationale: „Ewiges Leben“ ist die treffende und eingebürgerte Wiedergabe; der bestimmte Artikel ist im Deutschen in dieser Konstruktion natürlich, obwohl das Griechische keinen Artikel setzt.
- source_word: κληρονομήσω
  choice: erben
  rationale: „Erben“ bewahrt die ausdrücklich verwendete Vorstellung vom Empfangen eines Erbes und schwächt sie nicht zu einem allgemeinen „erlangen“ ab.
theological_decisions:
- issue: Die Frage nach ewigem Leben im Verhältnis zum menschlichen Handeln
  choice: was muss ich tun, um das ewige Leben zu erben?
  alternative: Was soll ich getan haben, sodass ich ewiges Leben erben werde?
  rationale: Die Übersetzung bewahrt, dass der Mann selbst nach einer erforderlichen Handlung fragt, ohne diese Voraussetzung theologisch zu bestätigen oder durch eine spätere Lehrformulierung abzuschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist idiomatisch formuliert; die gesellschaftliche Stellung der Person bleibt bewusst allgemein, da ἄρχων kein bestimmtes Amt nennt.
