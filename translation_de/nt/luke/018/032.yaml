base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: de
  text: Denn er wird den Nichtjuden[a] ausgeliefert, verspottet, misshandelt[b] und angespuckt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Völkern. Im Kontext sind Nichtjuden gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: beleidigt oder schändlich behandelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: wird … ausgeliefert werden
  rationale: Das zukünftige Passiv wird bewahrt. „Ausliefern“ bezeichnet natürlich die Übergabe in fremde Gewalt, ohne den Vorgang vorschnell auf Verrat zu verengen.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ gibt die erklärende Verbindung zur vorangehenden Leidensankündigung knapp und angemessen wieder.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die Ausdrucksweise des griechischen Textes; im Kontext sind damit die nichtjüdischen Völker beziehungsweise Menschen gemeint.
- source_word: ἐμπαιχθήσεται
  choice: sie werden ihn verspotten
  rationale: „Verspotten“ trifft die öffentliche Verhöhnung. Die aktive Form mit dem zuvor genannten Handlungsträger ist im Deutschen natürlicher als eine Folge schwerfälliger Passivformen.
- source_word: ὑβρισθήσεται
  choice: schändlich behandeln
  rationale: ὑβρίζω umfasst entehrende, übergriffige Misshandlung und ist nicht auf eine bloß verbale Beleidigung beschränkt. „Schändlich behandeln“ bewahrt diese Bedeutungsbreite.
- source_word: ἐμπτυσθήσεται
  choice: anspucken
  rationale: „Anspucken“ ist die natürliche moderne deutsche Bezeichnung für die konkrete entehrende Handlung.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Passivverben
  choice: Mit „er“ auf den Menschensohn aus dem vorhergehenden Vers bezogen
  alternative: Die Passivformen ohne ausdrückliches Personalpronomen nachbilden
  rationale: Der griechische Text nennt in diesem Vers kein Subjekt, doch der Menschensohn ist aus Lukas 18,31 eindeutig vorausgesetzt. Das Pronomen ist für natürliches Deutsch erforderlich und fügt keinen neuen theologischen Gehalt hinzu.
- issue: Bedeutung von τοῖς ἔθνεσιν
  choice: „den Völkern“ mit erläuternder Fußnote zum nichtjüdischen Bezug
  alternative: „den Heiden“ oder „den Nichtjuden“ im Haupttext
  rationale: „Den Völkern“ bewahrt die lexikalische Grundbedeutung und die mögliche Spannung des Ausdrucks; der historische Bezug auf Nichtjuden wird in der Fußnote geklärt, ohne eine heute möglicherweise abwertend verstandene Bezeichnung zu verwenden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satzteil bewahrt das Passiv der Auslieferung; danach vermeidet eine aktive Reihung mit „sie“ drei schwerfällige Passivformen. Das Semikolon macht den Wechsel vom Empfänger der Auslieferung zum handelnden Täterkreis deutlich. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
