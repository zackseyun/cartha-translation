review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung aller vier Zukunftspassive ist getroffen. Die aktive Umformung „sie werden ihn …“ macht jedoch die zuvor nur als Empfänger der Auslieferung genannte Gruppe ausdrücklich zum Täter und gibt die einheitliche Passivstruktur der Vorlage nicht mehr wieder. „Nichtjuden“ gibt τοῖς ἔθνεσιν in diesem lukanischen Kontext präziser wieder als das im Deutschen missverständliche „Völkern“.
  naturalness: Die Reihung mit einem gemeinsamen abschließenden „werden“ ist modernes, gut lesbares Standarddeutsch und bewahrt zugleich die passive Perspektive des griechischen Textes. „Schändlich behandeln“ ist weniger idiomatisch als „misshandeln“.
  terminology: „Ausgeliefert“, „verspottet“ und „angespuckt“ sind treffend. „Misshandelt“ kann die entehrende bzw. übergriffige Behandlung von ὑβρισθήσεται umfassend wiedergeben; die Fußnote hält die enger verbale Alternative offen. „Nichtjuden“ ist hier die sachlich präzise und nicht abwertende kontextuelle Wiedergabe von ἔθνη.
  issues:
  - severity: medium
    issue: Aktive Umformung der folgenden Passivverben
    rationale: „Sie werden ihn verspotten“ setzt die Völker/Nichtjuden ausdrücklich als Handelnde ein, während der griechische Text alle vier Verben im Passiv formuliert. Eine passive deutsche Reihung ist ohne Unnatürlichkeit möglich und wahrt die Perspektive der Vorlage.
  - severity: medium
    issue: „den Völkern“ ist im deutschen Haupttext kontextuell unpräzise
    rationale: τοῖς ἔθνεσιν kann lexikalisch „den Völkern“ bedeuten, bezeichnet hier aber konkret Nichtjuden bzw. heidnische Machthaber. Die wörtliche Formulierung kann im Deutschen fälschlich abstrakte Nationen meinen; die wörtliche Alternative gehört besser in eine Fußnote.
  - severity: low
    issue: „schändlich behandeln“ ist stilistisch schwerfällig
    rationale: „Misshandeln“ ist im modernen Deutsch idiomatischer und deckt die erniedrigende, nicht lediglich verbale Behandlung ab. Die Fußnote sichert „beleidigen“ und „schändlich behandeln“ als mögliche Nuancen.
  revised_text: Denn er wird den Nichtjuden[a] ausgeliefert, verspottet, misshandelt[b] und angespuckt werden.
