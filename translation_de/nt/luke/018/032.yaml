revisions:
- from: Denn er wird den Völkern[a] ausgeliefert werden; sie werden ihn verspotten, schändlich behandeln[b] und anspucken.
  to: Denn er wird den Nichtjuden[a] ausgeliefert, verspottet, misshandelt[b] und angespuckt werden.
  rationale: Die Revision stellt die durchgehende passive Satzperspektive der griechischen Vorlage wieder her, verwendet für ἔθνη die im Kontext präzise deutsche Bezeichnung „Nichtjuden“ und verlegt die wörtlichere Alternative in die Fußnote. „Misshandelt“ ist eine natürliche umfassende Wiedergabe von ὑβρισθήσεται; die Fußnote bewahrt die möglichen engeren Bedeutungsnuancen.
