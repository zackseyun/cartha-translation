  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: de
  text: 'Da sagte man ihm: „Jesus, der Nazarener, geht gerade vorbei.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus aus Nazaret geht gerade vorbei.“ Wörtlicher steht im Griechischen: „Jesus, der Nazarener“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: sagte man
  rationale: Das Verb bezeichnet das Mitteilen oder Berichten. Das unpersönliche „man“ gibt den nicht näher bestimmten Plural im Deutschen natürlich wieder.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit einem milden Anschluss weiter; „Da“ stellt hier den natürlichen zeitlich-narrativen Zusammenhang her, ohne einen Gegensatz einzutragen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet den Empfänger der Mitteilung und wird im Deutschen unmittelbar mit „ihm“ wiedergegeben.
- source_word: ὅτι
  choice: direkte Rede
  rationale: ὅτι leitet den Inhalt der Mitteilung ein. Direkte Rede ist hier im Deutschen lebendig und inhaltlich gleichwertig.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: ὁ Ναζωραῖος
  choice: der Nazarener
  rationale: Die substantivische Bezeichnung wird formnah und zugleich idiomatisch wiedergegeben. Sie kennzeichnet Jesus durch seine Verbindung zu Nazaret.
- source_word: παρέρχεται
  choice: geht gerade vorbei
  rationale: Das Präsens bezeichnet im Kontext einen gegenwärtig ablaufenden Vorgang. „gerade“ macht diese unmittelbare Verlaufsbedeutung in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe der Bezeichnung Ναζωραῖος
  choice: der Nazarener
  alternative: Jesus aus Nazaret
  rationale: „Der Nazarener“ bewahrt die substantivische Form des griechischen Ausdrucks, ohne daraus einen weitergehenden christologischen Titel oder eine konfessionelle Deutung abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung ist natürlich; „der Nazarener“ erhält zugleich die Form der griechischen Bezeichnung.
