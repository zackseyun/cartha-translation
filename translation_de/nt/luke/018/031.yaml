reference: Luke 18:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: de
  text: 'Da nahm Jesus die Zwölf beiseite und sagte zu ihnen: »Seht, wir ziehen hinauf nach Jerusalem, und alles, was durch die Propheten über den Menschensohn geschrieben worden ist, wird sich erfüllen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, den Dativ stärker zielbezogen wiedergegeben: »… und alles, was durch die Propheten geschrieben worden ist, wird für den Menschensohn erfüllt werden.« Die Hauptübersetzung versteht den Dativ als Bezug: was über den Menschensohn geschrieben ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: nahm … zu sich
  rationale: Die Wendung gibt das Mit-sich-Nehmen der Zwölf natürlich wieder, ohne ein im Griechischen nicht ausdrücklich genanntes »beiseite« einzufügen.
- source_word: τοὺς δώδεκα
  choice: die Zwölf
  rationale: Die feste Bezeichnung der engsten Jüngergruppe bleibt ohne den erklärenden Zusatz »Jünger« erhalten.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf wird in gegenwärtigem, würdigem Deutsch wiedergegeben.
- source_word: ἀναβαίνομεν
  choice: wir ziehen hinauf
  rationale: »Hinaufziehen« bewahrt sowohl die geographische Bewegung nach Jerusalem als auch den biblischen Sprachgebrauch, ohne altertümlich zu wirken.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: τελεσθήσεται
  choice: wird sich erfüllen
  rationale: Das Futur Passiv bezeichnet hier die Verwirklichung dessen, was prophetisch geschrieben wurde; die deutsche Formulierung ist idiomatisch und bewahrt den Erfüllungsgedanken.
- source_word: πάντα τὰ γεγραμμένα
  choice: alles, was … geschrieben worden ist
  rationale: Die Formulierung erhält sowohl die umfassende Aussage von πάντα als auch den fortgeltenden Charakter des Geschriebenen.
- source_word: διὰ τῶν προφητῶν
  choice: durch die Propheten
  rationale: διά mit Genitiv bezeichnet die Propheten als Vermittler beziehungsweise Werkzeuge der schriftlichen Botschaft.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: über den Menschensohn
  rationale: Die Wiedergabe versteht den Dativ als Angabe des Bezugs oder Inhalts und ergibt natürliches Deutsch; die formal möglichen Lesarten »für« oder »am Menschensohn« werden in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des christologischen Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Sohn des Menschen
  rationale: »Menschensohn« ist im Deutschen die etablierte, weiterhin verständliche Titelbezeichnung und bewahrt die mögliche Anspielung auf Daniel, ohne sie auszudeuten.
- issue: Bezug des Dativs τῷ υἱῷ τοῦ ἀνθρώπου
  choice: was … über den Menschensohn geschrieben worden ist
  alternative: was … für den Menschensohn geschrieben worden ist / was sich am Menschensohn erfüllen wird
  rationale: Der Dativ kann den Bezug auf den Menschensohn bezeichnen, lässt formal aber auch eine stärker ziel- oder ereignisbezogene Deutung zu. Der Haupttext bietet die wahrscheinlichste natürliche Lesart; die Fußnote hält die grammatische Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jesus« wird als ausdrückliches Subjekt ergänzt, damit der deutsche Satz außerhalb des unmittelbaren Zusammenhangs eindeutig und flüssig ist. Die direkte Rede behält mit »Seht« und »hinaufziehen« ihren feierlichen, aber verständlichen biblischen Klang.
