revisions:
- from: 'Da nahm Jesus die Zwölf zu sich und sagte zu ihnen: »Seht, wir ziehen hinauf nach Jerusalem, und alles, was durch die Propheten über den Menschensohn geschrieben worden ist, wird sich erfüllen.[a]«'
  to: 'Da nahm Jesus die Zwölf beiseite und sagte zu ihnen: »Seht, wir ziehen hinauf nach Jerusalem, und alles, was durch die Propheten über den Menschensohn geschrieben worden ist, wird sich erfüllen.«[a]'
  rationale: Die Revision schärft die Wiedergabe von παραλαβών und ersetzt die sachlich irreführende Fußnote. Der Haupttext behält die wahrscheinlichste, im Deutschen natürliche Bezugslesart »über den Menschensohn« bei; die Fußnote bewahrt zugleich die grammatisch mögliche zielbezogene Nuance des Dativs, ohne eine bestimmte theologische Deutung festzulegen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:48:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Satzstruktur und die zentralen Begriffe des griechischen Textes insgesamt zutreffend wieder: die Zwölf, das Hinaufgehen nach Jerusalem, die Gesamtheit des Geschriebenen, die Propheten und den Menschensohn. »Beiseite« ist bei παραλαμβάνω in diesem erzählerischen Kontext eine vertretbare kontextuelle Präzisierung. Die vorhandene Fußnote ordnet jedoch den Dativ τῷ υἱῷ τοῦ ἀνθρώπου teilweise unzutreffend dem Partizip »geschrieben« zu und bietet mit »nach den Schriften« keine entsprechende Wiedergabe von διὰ τῶν προφητῶν.'
  naturalness: Der Satz ist flüssiges, modernes und zugleich würdiges Standarddeutsch. »Seht« und »hinauf« passen zum Register. »Nahm ... beiseite« ist idiomatischer und präziser als »nahm ... zu sich« für die hier erzählte private Unterweisung.
  terminology: »die Zwölf«, »Jerusalem«, »die Propheten« und besonders »der Menschensohn« sind angemessen und konsistent. »Menschensohn« wahrt den Charakter der etablierten Titelbezeichnung, ohne ihn auszudeuten.
  issues:
  - severity: medium
    issue: Die Fußnote behandelt »für den Menschensohn geschrieben worden ist« als wörtlichere Alternative.
    rationale: Der Dativ τῷ υἱῷ τοῦ ἀνθρώπου gehört syntaktisch am ehesten zu τελεσθήσεται, nicht zu γεγραμμένα. Eine Fußnote soll die mögliche dative Ziel-/Bezugskomponente am Prädikat erläutern, statt eine abweichende Verknüpfung als wörtliche Wiedergabe auszugeben.
  - severity: low
    issue: Die Fußnote führt »nach den Schriften der Propheten« ein.
    rationale: διὰ τῶν προφητῶν bedeutet »durch die Propheten« bzw. »von Seiten der Propheten«, nicht »nach den Schriften der Propheten«. Die Formulierung ist als erläuternde Paraphrase möglich, aber nicht als alternative Übersetzung dieser griechischen Wendung geeignet.
  - severity: low
    issue: »nahm die Zwölf zu sich« bleibt in der Bedeutung leicht unscharf.
    rationale: Die Wendung kann im Deutschen ein bloßes Heranrufen oder Aufnehmen bezeichnen. »Nahm die Zwölf beiseite« gibt die im Kontext naheliegende Absonderung zur Unterweisung klar und natürlich wieder.
