id: LUK.18.39
reference: Luke 18:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: de
  text: 'Und die, die vorausgingen, wiesen ihn scharf zurecht, damit er schweige. Er aber rief umso mehr: »Sohn Davids, hab Erbarmen mit mir!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: die, die vorausgingen
  rationale: Das substantivierte Präsenspartizip bezeichnet die Personen, die sich vor ihm befanden bzw. vorausgingen, ohne ihnen eine besondere Führungsrolle zuzuschreiben.
- source_word: ἐπετίμων
  choice: wiesen ihn scharf zurecht
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Zurechtweisen; die Formulierung bewahrt die Strenge von ἐπιτιμάω in natürlichem Deutsch.
- source_word: ἵνα σιγήσῃ
  choice: damit er schweige
  rationale: ἵνα mit Aorist Konjunktiv drückt hier den beabsichtigten Zweck aus. Der deutsche Konjunktiv bewahrt diese Abhängigkeit knapp und würdig.
- source_word: αὐτὸς δὲ
  choice: Er aber
  rationale: Die vorangestellte Wendung ist kontrastiv; »Er aber« gibt den Gegensatz prägnant wieder.
- source_word: πολλῷ μᾶλλον
  choice: umso mehr
  rationale: Die idiomatische Steigerung bleibt erhalten, ohne das nicht ausdrücklich genannte Adverb »lauter« hinzuzufügen.
- source_word: ἔκραζεν
  choice: rief
  rationale: Das Imperfekt steht in Verbindung mit »umso mehr« und schildert sein fortgesetztes Rufen; der deutsche Kontext vermittelt die Beharrlichkeit, ohne schwerfälliges »rief immer weiter«.
- source_word: Υἱὲ Δαυίδ
  choice: Sohn Davids
  rationale: Der Vokativ wird als davidisch-messianischer Titel direkt übersetzt und nicht erklärend erweitert.
- source_word: ἐλέησόν με
  choice: hab Erbarmen mit mir
  rationale: Die dringliche Bitte des Aoristimperativs wird in einer klaren, würdigen und im Deutschen vertrauten Form wiedergegeben.
theological_decisions:
- issue: Messianische Bedeutung von Υἱὲ Δαυίδ
  choice: Der Titel wird im Haupttext mit »Sohn Davids« wiedergegeben.
  alternative: Die Anrede als bloßen Ehrentitel auffassen oder erklärend mit »Messias« erweitern.
  rationale: Die direkte Übersetzung bewahrt die davidisch-messianische Bedeutung im lukanischen Zusammenhang, ohne sie abzuschwächen oder über den Wortlaut hinaus auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung »die, die« ist idiomatisch und bildet die substantivische Partizipialkonstruktion transparent ab; der Imperativ »hab« wirkt unmittelbar, ohne altertümlich zu sein.
