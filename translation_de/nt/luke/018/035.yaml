source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: de
  text: Als er sich Jericho näherte, saß ein Blinder am Straßenrand und bettelte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die Wendung dient hier vor allem als erzählerischer Übergang. Eine wörtliche Wiedergabe wie „Und es geschah“ wäre im modernen Deutschen unnötig schwerfällig.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Als er sich Jericho näherte
  rationale: Der artikulierte Infinitiv mit ἐν bezeichnet Gleichzeitigkeit; „als“ gibt den zeitlichen Zusammenhang natürlich wieder. „Sich Jericho nähern“ bewahrt zudem die auf die Stadt gerichtete Bewegung.
- source_word: τυφλός τις
  choice: ein Blinder
  rationale: τις kennzeichnet die Person als unbestimmt. Das deutsche „ein Blinder“ bringt dies idiomatisch zum Ausdruck; „ein gewisser Blinder“ wäre zwar formnäher, klingt hier jedoch unnatürlich und kann eine zu starke Individualisierung nahelegen.
- source_word: ἐκάθητο
  choice: saß
  rationale: Der deutsche Kontext stellt mit „saß“ den andauernden Hintergrund der Szene ausreichend dar; eine Umschreibung wie „war am Sitzen“ wäre unidiomatisch.
- source_word: παρὰ τὴν ὁδὸν
  choice: am Straßenrand
  rationale: Die Formulierung gibt die Lage neben der Straße in natürlichem modernem Deutsch präzise wieder.
- source_word: ἐπαιτῶν
  choice: und bettelte
  rationale: Das Partizip bezeichnet die gleichzeitig ausgeübte Tätigkeit. Eine koordinierte Verbform ist im Deutschen flüssiger als „bettelnd“ und bewahrt den zeitlichen Zusammenhang.
