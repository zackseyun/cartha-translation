  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: de
  text: Doch als er das hörte, wurde er tieftraurig[a], denn er war überaus reich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zutiefst bekümmert«; das griechische Wort bezeichnet starke Trauer oder Bedrängnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zwischen Jesu Aufforderung und der Reaktion des Mannes, ohne den Erzählfluss unnötig zu beschweren.
- source_word: ἀκούσας ταῦτα
  choice: als er das hörte
  rationale: Das Aoristpartizip hat hier temporale Bedeutung. Das deutsche Singularpronomen fasst die unmittelbar vorausgehende Äußerung Jesu natürlich zusammen, obwohl das Griechische formal den Plural »diese Dinge« verwendet.
- source_word: περίλυπος
  choice: tieftraurig
  rationale: Gibt die starke Trauer oder innere Bedrängnis des griechischen Adjektivs knapp und idiomatisch wieder.
- source_word: ἐγενήθη
  choice: wurde
  rationale: 'Bewahrt den ingressiven Sinn: Der Mann geriet als Reaktion auf das Gehörte in diesen Zustand.'
- source_word: πλούσιος σφόδρα
  choice: überaus reich
  rationale: »Reich« gibt πλούσιος direkt wieder; »überaus« bewahrt die starke Intensivierung durch σφόδρα.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung für seine tiefe Traurigkeit ein und entspricht dem erklärenden Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am griechischen Zusammenhang, während »das« im Deutschen die vorausgehenden Worte Jesu natürlich zusammenfasst.
