source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: de
  text: Zwei Männer gingen zum Tempel[a] hinauf, um zu beten; der eine war ein Pharisäer, der andere ein Zöllner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet den gesamten Tempelbezirk, nicht speziell das innere Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Zwei Männer
  rationale: Obwohl ἄνθρωποι allgemein „Menschen“ bedeuten kann, weist die anschließende maskuline Beschreibung der beiden konkreten Personen hier auf Männer hin.
- source_word: ἀνέβησαν
  choice: gingen ... hinauf
  rationale: Bewahrt die räumliche Vorstellung des Hinaufgehens nach Jerusalem beziehungsweise zum erhöht gelegenen Tempel und klingt im Deutschen natürlich.
- source_word: εἰς τὸ ἱερὸν
  choice: zum Tempel
  rationale: ἱερόν bezeichnet hier den gesamten Tempelbezirk, nicht speziell das innere Heiligtum. „Zum Tempel“ gibt εἰς in diesem Bewegungskontext idiomatisch wieder; die genauere Bedeutung wird in der Fußnote erläutert.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Aoristinfinitiv drückt den Zweck des Hinaufgehens aus; die deutsche Konstruktion „um zu“ gibt dies klar und natürlich wieder.
- source_word: ὁ εἷς ... καὶ ὁ ἕτερος
  choice: der eine ... der andere
  rationale: Die korrelative deutsche Wendung entspricht der Gegenüberstellung der beiden Personen.
- source_word: Φαρισαῖος
  choice: ein Pharisäer
  rationale: Die etablierte deutsche Bezeichnung für ein Mitglied dieser jüdischen Gruppierung.
- source_word: τελώνης
  choice: ein Zolleinnehmer
  rationale: τελώνης bezeichnet einen Einnehmer von Steuern oder Zöllen. „Zolleinnehmer“ ist präzise und verständlich und wahrt den historischen Zusammenhang des Abgabensystems.
theological_decisions:
- issue: Unterscheidung von ἱερόν und ναός
  choice: Tempel mit erläuternder Fußnote zum Tempelbezirk
  alternative: Tempelbezirk im Haupttext
  rationale: Der Ausdruck meint den weiteren Tempelkomplex und nicht ausschließlich das innere Heiligtum. Der geläufige Ausdruck „Tempel“ hält den Haupttext natürlich, während die Fußnote die lexikalische Präzision sichert.
- issue: Geschlechtsspezifische Wiedergabe von ἄνθρωποι
  choice: Männer
  alternative: Menschen
  rationale: Der unmittelbare Kontext beschreibt zwei konkrete männliche Personen; daher ist „Männer“ hier sachlich genauer als das allgemeinere „Menschen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung bleibt knapp und erzählerisch; „der eine war ...“ ergänzt das im Griechischen nominal ausgedrückte Verhältnis idiomatisch, ohne den Sinn zu verändern.
