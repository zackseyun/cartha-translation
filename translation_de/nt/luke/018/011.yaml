reference: Luke 18:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: de
  text: 'Der Pharisäer stand für sich allein und betete Folgendes[a]: »Gott, ich danke dir, dass ich nicht bin wie die übrigen Menschen – Räuber, Ungerechte, Ehebrecher – oder auch wie dieser Zolleinnehmer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Pharisäer stand da und betete dies zu sich selbst.« Die griechische Wendung kann entweder bedeuten, dass er abseits stand, oder dass sein Gebet an sich selbst gerichtet war.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: stand
  rationale: Das aoristische Partizip bezeichnet hier die eingenommene Körperhaltung; im Deutschen lässt es sich natürlich als finites Verb wiedergeben.
- source_word: πρὸς ἑαυτὸν
  choice: für sich
  rationale: Die Formulierung bewahrt möglichst weit die Spannung zwischen räumlichem Abseitsstehen und einem Beten bei beziehungsweise zu sich selbst; die alternative syntaktische Zuordnung wird in der Fußnote erläutert.
- source_word: ταῦτα
  choice: Folgendes
  rationale: Das Demonstrativpronomen weist auf den unmittelbar anschließenden Inhalt des Gebets; „Folgendes“ ist dafür im modernen Deutsch natürlicher als „diese Dinge“.
- source_word: προσηύχετο
  choice: betete
  rationale: Das Präteritum ist die natürliche deutsche Erzählform. Der durative Charakter des griechischen Imperfekts ergibt sich im Kontext ausreichend aus der Gebetsszene.
- source_word: εὐχαριστῶ σοι
  choice: ich danke dir
  rationale: Dies ist die direkte, idiomatische und bedeutungsgleiche deutsche Wiedergabe.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: wie die übrigen Menschen
  rationale: Die Wiedergabe erhält λοιποί als „die übrigen“ und versteht ἄνθρωποι entsprechend seinem generischen Bezug geschlechtsübergreifend.
- source_word: ἅρπαγες
  choice: Räuber
  rationale: ἅρπαξ bezeichnet Menschen, die sich fremdes Gut habgierig aneignen. „Räuber“ ist prägnant und lässt offen, ob Gewalt, Ausbeutung oder Erpressung gemeint ist.
- source_word: ἄδικοι
  choice: Ungerechte
  rationale: „Ungerechte“ bewahrt die moralische und relationale Breite von ἄδικοι, ohne sie pauschal zu „Bösen“ zu erweitern.
- source_word: μοιχοί
  choice: Ehebrecher
  rationale: Die substantivische Pluralform wird direkt und allgemein verständlich wiedergegeben.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: oder auch wie dieser Zolleinnehmer
  rationale: „Oder auch“ entspricht ἢ καί ohne die Steigerung durch ein nicht zwingend ausdrückliches „sogar“ zu überbetonen. „Zolleinnehmer“ bezeichnet die damalige Tätigkeit genauer als das moderne Amtswort „Zöllner“.
theological_decisions:
- issue: Bezug und Sinn von πρὸς ἑαυτόν
  choice: Im Haupttext räumlich beziehungsweise modal mit „für sich“ wiedergegeben
  alternative: „Er stand da und betete dies zu sich selbst“
  rationale: Die griechische Wortfolge lässt πρὸς ἑαυτόν sowohl mit σταθείς als auch mit προσηύχετο verbinden. Der Haupttext soll weder das Abseitsstehen noch die ironische Vorstellung eines letztlich an sich selbst gerichteten Gebets dogmatisch festlegen; die Fußnote hält die zweite Analyse ausdrücklich offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und scharf; die Gedankenstriche bilden die aufzählende Selbstabgrenzung des Pharisäers ab.
