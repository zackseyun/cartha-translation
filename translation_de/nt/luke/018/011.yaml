  source_fidelity: Der Satz gibt die Körperhaltung, die Gebetseinleitung, den Dank, die umfassende Abgrenzung von den „übrigen Menschen“, die dreigliedrige Lasterliste und die abwertende Zuspitzung auf den Zolleinnehmer grundsätzlich zutreffend wieder. πρὸς ἑαυτόν ist zu Recht mit einer Alternativdeutung vermerkt.
  naturalness: „stand für sich“ ist im heutigen Standarddeutsch als Beschreibung einer räumlichen Position nicht idiomatisch genug und kann eher „bestand eigenständig“ nahelegen. „stand für sich allein“ ist natürlich und gibt die im Haupttext gewählte räumliche Lesart präzise wieder.
  terminology: „Pharisäer“, „Gott“, „Ehebrecher“ und „Zolleinnehmer“ sind passend. „Räuber“ ist als breite Wiedergabe von ἅρπαγες vertretbar; die Fußnote sollte jedoch die alternative Zuordnung von πρὸς ἑαυτόν ohne die missverständliche Formulierung „bei ... sich selbst“ erläutern.
