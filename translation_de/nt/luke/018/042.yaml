  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihm: „Sieh wieder[a]! Dein Glaube hat dich gerettet[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Gewinne dein Augenlicht wieder.“ Das griechische Verb bezeichnet in einem Heilungszusammenhang die Wiederherstellung des Sehvermögens.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Dein Glaube hat dich geheilt“ oder „Dein Glaube hat dich gesund gemacht.“ Das griechische Verb kann sowohl körperliche Heilung als auch Rettung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache erzählerische Anschluss bleibt erhalten, ohne eine zusätzliche zeitliche oder folgernde Bedeutung einzutragen.
- source_word: ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jesus sagte zu ihm
  rationale: Natürliche und genaue Wiedergabe der Redeeinleitung mit dem indirekten Objekt.
- source_word: Ἀνάβλεψον
  choice: Du sollst wieder sehen
  rationale: Im Heilungszusammenhang bezeichnet das Verb die Wiederherstellung des Sehvermögens. Die deutsche Form gibt den gebietenden und zugleich wirksamen Zuspruch natürlich wieder.
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort das vertrauende Sich-Verlassen des Mannes auf Jesus. „Glaube“ bewahrt zugleich die in Lukas übliche theologische Tragweite.
- source_word: σέσωκέν σε
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω kann sowohl Rettung als auch Heilung bezeichnen. „Hat dich gerettet“ bewahrt die mögliche umfassendere Bedeutung, ohne den unmittelbaren Heilungszusammenhang auszuschließen.
theological_decisions:
- issue: Bedeutungsumfang von σῴζω in einer Heilungserzählung
  choice: hat dich gerettet
  alternative: hat dich geheilt / hat dich gesund gemacht
  rationale: Im Zusammenhang ist die körperliche Heilung eingeschlossen; zugleich kann Lukas mit σῴζω eine umfassendere Rettung meinen. Die gewählte Formulierung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede ist klar und knapp; die Mehrdeutigkeit zwischen Heilung und umfassender Rettung wird durch Haupttext und Fußnote bewahrt.
