  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: de
  text: 'Doch Jesus sagte zu ihm: »Warum nennst du mich gut? Niemand ist gut außer Gott allein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet knapp den leichten Kontrast und den korrigierenden Charakter von Jesu Erwiderung; auch »Und« wäre möglich, würde diesen Zug jedoch weniger deutlich wiedergeben.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Jesus sagte
  rationale: Gibt das einfache λέγω unmittelbar wieder. Der Zusammenhang ist zwar eine Erwiderung, doch »antwortete« wäre stärker interpretierend.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Bewahrt das ausdrückliche Pronomen, ohne den Bezug durch »zu dem Mann« erklärend auszuweiten.
- source_word: Τί
  choice: Warum
  rationale: In der Wendung τί με λέγεις ἀγαθόν fragt τί idiomatisch nach dem Grund; »Warum« ist daher im Deutschen natürlich und sinngenau.
- source_word: με λέγεις ἀγαθόν
  choice: nennst du mich gut
  rationale: »Jemanden gut nennen« gibt λέγειν mit prädikativem Adjektiv direkt und in natürlichem Deutsch wieder.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: gut
  rationale: Die beiden Vorkommen werden konsequent gleich übersetzt. Eine Ergänzung wie »moralisch gut« würde den griechischen Ausdruck unnötig einengen.
- source_word: οὐδεὶς
  choice: Niemand
  rationale: Eine natürliche und umfassende deutsche Wiedergabe der universalen Verneinung.
- source_word: εἰ μὴ εἷς
  choice: außer dem einen
  rationale: Bewahrt gegenüber dem bloßen »außer Gott« das ausdrücklich vorhandene εἷς und dessen Betonung, ohne das Deutsche unnatürlich werden zu lassen.
- source_word: ὁ θεός
  choice: Gott
  rationale: Bezeichnet den Referenten im Deutschen idiomatisch und eindeutig; zusammen mit »dem einen« bleibt die griechische Struktur erkennbar.
theological_decisions:
- issue: Christologische Bedeutung von Jesu Frage
  choice: Die Frage bleibt als offene, zugespitzte Rückfrage stehen und wird weder als Verneinung der eigenen Güte noch als ausdrückliche Selbstaussage über Jesu Göttlichkeit paraphrasiert.
  alternative: Die Aussage so umzuformulieren, dass Jesus entweder bestreitet, im absoluten Sinn gut zu sein, oder unmittelbar erklärt, Gott zu sein.
  rationale: Der griechische Wortlaut entfaltet die christologische Folgerung nicht ausdrücklich. Eine quellennahe Übersetzung soll diese theologische Spannung erhalten, statt sie durch eine erklärende Paraphrase aufzulösen.
- issue: Betonung der Einzigkeit Gottes in εἰ μὴ εἷς ὁ θεός
  choice: '»außer dem einen: Gott«'
  alternative: »außer Gott allein« oder schlicht »außer Gott«
  rationale: Die gewählte Fassung bildet das ausdrücklich gesetzte Zahlwort εἷς ab. Der Doppelpunkt macht Gott als den einen Gemeinten verständlich, ohne zusätzliche dogmatische Erläuterung einzutragen.
translation_notes:
  register: 'Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. »Doch« und »sagte« sind knapp und textnah; die Formulierung »außer dem einen: Gott« erhält die markierte griechische Einzigkeitsaussage.'
