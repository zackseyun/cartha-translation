review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur, die Rückfrage und die Wiederholung von ἀγαθός grundsätzlich treffend wieder. Die Fassung »außer dem einen: Gott« ist jedoch im modernen Deutschen syntaktisch und semantisch unnötig sperrig; sie kann den Eindruck erwecken, »der eine« sei eine von Gott getrennte Größe. Das Griechische εἰ μὴ εἷς ὁ θεός bezeichnet eindeutig Gott als den Einen.'
  naturalness: '»Doch Jesus sagte zu ihm« und »Warum nennst du mich gut?« sind natürliches Standarddeutsch. »Niemand ist gut außer dem einen: Gott« ist dagegen keine idiomatische deutsche Formulierung. »Niemand ist gut außer Gott allein« ist klar, natürlich und bewahrt die exklusive Aussage.'
  terminology: »Jesus«, »gut«, »niemand« und »Gott« sind sachgerecht. »Gott allein« gibt die durch εἷς hervorgehobene Einzigkeit idiomatisch wieder, ohne eine christologische Deutung der Frage vorwegzunehmen.
  issues:
  - severity: medium
    issue: Unnatürliche und potenziell missverständliche Wiedergabe von εἰ μὴ εἷς ὁ θεός
    rationale: 'Die Nominalphrase »dem einen: Gott« ist im Deutschen nicht geläufig und trennt durch den Doppelpunkt formal das Zahlwort von seinem Bezug. »Gott allein« bringt die Exklusivität von εἷς angemessen und eindeutig zum Ausdruck.'
  revised_text: 'Doch Jesus sagte zu ihm: »Warum nennst du mich gut? Niemand ist gut außer Gott allein.«'
