source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: de
  text: 'Der Zolleinnehmer aber stand weit entfernt und wollte nicht einmal seine Augen zum Himmel erheben, sondern schlug sich immer wieder an die Brust und sagte: »Gott, sei mir, dem Sünder, gnädig.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sei mir günstig« oder: »Sei mir gnädig gestimmt.« Das griechische Verb gehört zum Wortfeld von Sühne und Versöhnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: Zolleinnehmer
  rationale: „Zolleinnehmer“ ist eine klare, moderne Bezeichnung für einen damaligen Abgabenpächter beziehungsweise Zolleinnehmer und bewahrt im Kontext die gesellschaftliche Geringschätzung dieser Tätigkeit.
- source_word: μακρόθεν ἑστὼς
  choice: stand weit entfernt
  rationale: Die Formulierung gibt sowohl die räumliche Distanz als auch die stehende Haltung natürlich wieder, ohne die im Kontext mögliche Demut ausdrücklich in den Wortlaut hineinzudeuten.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: wollte nicht einmal
  rationale: Die Wiedergabe bewahrt den Willensaspekt von θέλω und die Steigerung durch οὐδέ.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: seine Augen zum Himmel erheben
  rationale: Dies entspricht der griechischen Wendung und klingt im Deutschen natürlich und würdevoll.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: schlug sich immer wieder an die Brust
  rationale: „Immer wieder“ macht den durativen beziehungsweise wiederholten Aspekt des Imperfekts sichtbar; die deutsche reflexive Wendung bezeichnet die Geste von Trauer und Reue idiomatisch.
- source_word: ἱλάσθητί μοι
  choice: sei mir gnädig
  rationale: Die Formulierung ist als Gebet an Gott gut verständlich und bewahrt den Ruf nach erbarmender Zuwendung; die zum Sühne- und Versöhnungswortfeld gehörende Nuance wird in der Fußnote offengehalten.
- source_word: τῷ ἁμαρτωλῷ
  choice: dem Sünder
  rationale: Der bestimmte Artikel wird erhalten und trägt den markierten, selbsterniedrigenden Ton des Gebets besser als „einem Sünder“.
theological_decisions:
- issue: Wiedergabe von ἱλάσθητί μοι als Bitte um göttliche Zuwendung mit möglichem Sühnebezug
  choice: sei mir gnädig
  alternative: lass dich mir gegenüber versöhnen; erbarme dich meiner
  rationale: „Sei mir gnädig“ ist natürlich und zugänglich, legt aber keine ausgearbeitete Sühnetheorie in den Haupttext. Weil das Verb zum Wortfeld von Sühne und Versöhnung gehört, wird diese echte Bedeutungsdimension in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die wiederholte Handlung des Imperfekts wird ausdrücklich wiedergegeben; der bestimmte Ausdruck „dem Sünder“ bleibt zur Wahrung der griechischen Markierung erhalten.
