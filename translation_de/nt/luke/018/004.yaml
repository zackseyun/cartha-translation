  text: καὶ οὐκ ⸀ἤθελεν ἐπὶ χρόνον, μετὰ ⸂ταῦτα δὲ⸃ εἶπεν ἐν ἑαυτῷ· Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι ⸂οὐδὲ ἄνθρωπον⸃ ἐντρέπομαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: de
  text: 'Eine Zeit lang wollte er nicht. Danach aber sagte er sich: ›Auch wenn ich Gott nicht fürchte und vor keinem Menschen Achtung habe,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: wollte er nicht
  rationale: Die durative Imperfektform bezeichnet seine über eine gewisse Zeit anhaltende Weigerung; die Formulierung bewahrt den Willensaspekt, ohne eine endgültige Ablehnung auszudrücken.
- source_word: ἐπὶ χρόνον
  choice: eine Zeit lang
  rationale: Die Wendung bezeichnet eine nicht näher bestimmte Zeitspanne und wird so natürlich und präzise wiedergegeben.
- source_word: μετὰ ταῦτα δὲ
  choice: Danach aber
  rationale: Dies wahrt sowohl die zeitliche Abfolge als auch den leichten Gegensatz.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: sagte er sich
  rationale: Die Formulierung gibt die innere, an sich selbst gerichtete Rede idiomatisch wieder, statt sie lediglich als Gedanken zusammenzufassen.
- source_word: Εἰ καὶ
  choice: Auch wenn
  rationale: Im Zusammenhang leitet die Konstruktion ein zugestandenes Faktum ein; im Deutschen drückt »auch wenn« diese konzessive Bedeutung natürlich aus.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: ich Gott nicht fürchte
  rationale: »Gott fürchten« bewahrt die etablierte biblische Ausdrucksweise und lässt deren Spektrum von Furcht bis Ehrfurcht bestehen.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: und vor keinem Menschen Achtung habe
  rationale: ἐντρέπομαι bezeichnet hier Rücksicht, Achtung oder respektvolle Scheu. »Vor keinem Menschen Achtung haben« gibt den generischen Singular idiomatisch wieder und erhält die Parallele zu Gott.
theological_decisions:
- issue: Bedeutung von Gottesfurcht
  choice: Gott nicht fürchten
  alternative: Gott nicht verehren
  rationale: Die wörtlichere Wendung erhält die mögliche Verbindung von Furcht, Ehrfurcht und moralischer Gottesachtung, ohne das Bedeutungsspektrum dogmatisch einzuengen.
- issue: Generischer Singular ἄνθρωπον
  choice: vor keinem Menschen
  alternative: vor niemandem
  rationale: »Mensch« bewahrt das lexikalische Gegenüber von Gott und Mensch; »keinem« macht zugleich unmissverständlich deutlich, dass Menschen allgemein gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als direkte Rede offen, da der Vers syntaktisch in Vers 5 weitergeführt wird. Keine Fußnote ist nötig, weil die relevanten Nuancen im Haupttext klar und ohne Überdeutung ausgedrückt werden.
