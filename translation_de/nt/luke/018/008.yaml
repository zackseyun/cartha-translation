id: LUK.18.8
reference: Luke 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: de
  text: 'Ich sage euch: Er wird ihnen schnell Recht verschaffen.[a] Doch wird der Menschensohn, wenn er kommt, wirklich den Glauben[b] auf der Erde finden?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird sie zu ihrem Recht bringen“ beziehungsweise „ihnen ohne Verzögerung Recht verschaffen“. Der griechische Ausdruck kann gerichtliche Rechtsverschaffung, gewährtes Recht oder auch Vergeltung bezeichnen; hier steht die Rechtshilfe für die Betroffenen im Vordergrund.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Vertrauen“ oder „die Treue“. Das griechische Wort kann Glaube, Vertrauen oder Treue bezeichnen; der Haupttext bewahrt mit „Glaube“ die größere Bedeutungsbreite.'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: er wird ihnen Recht verschaffen
  rationale: Die Wendung bezeichnet hier angesichts des Gleichnisses von der Witwe gerichtliche Abhilfe beziehungsweise Rechtfertigung. „Jemandem Recht verschaffen“ ist im modernen Deutschen idiomatisch und vermeidet, den möglichen Vergeltungssinn von ἐκδίκησις unnötig in den Vordergrund zu rücken.
- source_word: ἐν τάχει
  choice: schnell
  rationale: Die Wendung bezeichnet rasches Handeln beziehungsweise Handeln ohne Verzögerung. „Schnell“ wahrt diese Aussage, ohne sie eindeutig als kalendarische Vorhersage im Sinn von „bald“ festzulegen.
- source_word: πλὴν
  choice: doch
  rationale: „Doch“ gibt den starken gegensätzlichen Übergang von der Zusage zur abschließenden, eindringlichen Frage natürlich und würdevoll wieder.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Dies ist die etablierte deutsche Wiedergabe der Selbstbezeichnung Jesu und bewahrt ihre Bezüge, insbesondere zu Daniel 7.
- source_word: ἐλθὼν
  choice: wenn er kommt
  rationale: Das Aoristpartizip wird hier am natürlichsten temporal aufgelöst. Die Formulierung wahrt seinen Bezug zum Finden in der Hauptfrage.
- source_word: ἆρα
  choice: wirklich
  rationale: Das Fragepartikel verleiht der Frage einen prüfenden, nachdenklichen Ton. „Wirklich“ bringt diese rhetorische Nuance im Deutschen zum Ausdruck.
- source_word: τὴν πίστιν
  choice: den Glauben
  rationale: „Glaube“ bewahrt die Bedeutungsbreite von πίστις besser als eine einengende Festlegung auf Vertrauen oder Treue. Der bestimmte Artikel wird entsprechend wiedergegeben.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Formulierung gibt den naheliegenden umfassenden Sinn von γῆ in diesem endzeitlich geprägten Ausspruch wieder; „im Land“ wäre hier unnötig eng.
theological_decisions:
- issue: Bedeutung von πίστις zwischen Glaube, Vertrauen und Treue
  choice: den Glauben
  alternative: das Vertrauen; die Treue
  rationale: Der Haupttext belässt den Ausdruck in seiner theologischen und sprachlichen Breite. Im Zusammenhang kann besonders beharrlicher Glaube beziehungsweise anhaltendes Vertrauen gemeint sein, doch der griechische Ausdruck legt diese Eingrenzung nicht ausdrücklich fest.
- issue: Aussage von ἐν τάχει über den Zeitpunkt oder die Geschwindigkeit göttlichen Handelns
  choice: schnell
  alternative: bald; ohne Verzögerung
  rationale: „Schnell“ lässt die Spannung zwischen rascher Ausführung und zeitlicher Nähe bestehen, statt den Satz dogmatisch auf einen bestimmten endzeitlichen Zeitplan festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bleibt natürlich, während die eindringliche Schlussfrage und die echte Bedeutungsbreite der Schlüsselbegriffe gewahrt werden.
