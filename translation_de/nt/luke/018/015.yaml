source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: de
  text: Man brachte ihm sogar Säuglinge[a], damit er sie berührte.[b] Doch als die Jünger das sahen, wiesen sie die Menschen zurecht, die die Säuglinge brachten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Babys“. Das griechische Wort bezeichnet sehr junge Kinder, insbesondere Säuglinge.
    reason: lexical_alternative
  - marker: b
    text: In den Parallelberichten ist Jesu Berührung mit Segnen und Handauflegung verbunden (vgl. Matthäus 19,13; Markus 10,13.16).
    reason: cross_reference
  - marker: c
    text: Wörtlich steht im Griechischen nur „sie“; gemeint sind offenbar die Menschen, die die Säuglinge brachten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέφερον
  choice: Man brachte
  rationale: Das Imperfekt beschreibt eine fortlaufende oder wiederholte Handlung. Im natürlichen deutschen Erzählstil kann dies durch das Präteritum mit dem unbestimmten Subjekt „man“ wiedergegeben werden, ohne eine einmalige Handlung zu behaupten.
- source_word: δὲ … καὶ
  choice: sogar … Doch
  rationale: Das erste δὲ dient als leichter Erzählanschluss und muss im Deutschen nicht eigens wiedergegeben werden; καὶ erhält hier durch „sogar“ seine hervorhebende Kraft. Das zweite δὲ markiert den Gegensatz zur Reaktion der Jünger und wird mit „Doch“ wiedergegeben.
- source_word: τὰ βρέφη
  choice: Säuglinge
  rationale: βρέφη bezeichnet sehr junge Kinder, besonders Säuglinge. „Säuglinge“ ist präzise, gegenwärtig und weniger umgangssprachlich als „Babys“.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: damit er sie berührte
  rationale: ἵνα bezeichnet den Zweck, und ἅπτομαι bedeutet hier unmittelbar „berühren“. Eine Segnung mag im Zusammenhang gemeint sein, wird aber vom Verb selbst nicht ausdrücklich genannt.
- source_word: ἰδόντες
  choice: als … das sahen
  rationale: Das Aoristpartizip wird als temporaler Nebensatz natürlich und sinngenau wiedergegeben; „das“ bezieht sich auf das zuvor geschilderte Bringen der Säuglinge.
- source_word: ἐπετίμων
  choice: wiesen … zurecht
  rationale: ἐπιτιμάω bezeichnet ein ernstes Tadeln oder Zurechtweisen. „zurechtweisen“ bewahrt den deutlichen Ton, ohne unnötig altertümlich zu klingen.
- source_word: αὐτοῖς
  choice: sie
  rationale: Das Pronomen wird als Pronomen bewahrt. Wahrscheinlich sind die Menschen gemeint, die die Säuglinge brachten; der knappe griechische Wortlaut nennt den Bezug jedoch nicht ausdrücklich.
theological_decisions:
- issue: Art der Handlung Jesu an den Säuglingen
  choice: berührte
  alternative: segnete sie / legte ihnen die Hände auf
  rationale: Lukas verwendet hier ἅπτομαι, „berühren“. Die Parallelberichte verbinden die Berührung mit Segnung und Handauflegung, doch diese weitergehende Deutung wird nicht in den Haupttext eingetragen.
- issue: Bezug des abschließenden Pronomens
  choice: sie
  alternative: die Menschen, die die Säuglinge brachten
  rationale: Die wahrscheinlichste Bezugnahme gilt den Bringenden. Das griechische Pronomen bleibt jedoch knapp, weshalb die Übersetzung die pronominale Form wahrt und die wahrscheinliche Deutung in einer Fußnote nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die leichte Doppelung „wiesen sie sie“ ist grammatisch korrekt und bewahrt die pronominale, im Ausgangstext nicht ausdrücklich aufgelöste Bezugnahme.
