  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes vollständig und in angemessener Reihenfolge wieder: die feierliche Bekräftigung Ἀμήν, die universale Verneinung οὐδείς, das vollendete „verlassen hat“, die vollständige Angehörigen- und Besitzreihe sowie den Beweggrund „um des Reiches Gottes willen“. Die offene Satzstruktur mit Komma entspricht der Fortsetzung in V. 30. Die artikellose Reihung „Haus oder Frau“ ist im Deutschen idiomatisch und wahrt den im Griechischen vorliegenden indefiniten Sinn ohne unnötige Ergänzung.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Amen, ich sage euch“ ist als Jesuswort etabliert; „Niemand, der … verlassen hat,“ ist wegen der syntaktischen Fortsetzung im folgenden Vers korrekt und natürlich.
  terminology: „Reich Gottes“ ist die übliche, registergerechte Wiedergabe von βασιλεία τοῦ θεοῦ. „verlassen hat“ gibt ἀφῆκεν sachlich wieder, ohne über Dauer, rechtliche Trennung oder moralische Bewertung zu entscheiden. Die Familienbezeichnungen sind präzise und geläufig.
