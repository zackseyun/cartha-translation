  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Amen, ich sage euch: Niemand, der um des Reiches Gottes willen Haus oder Frau, Brüder oder Eltern oder Kinder verlassen hat,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμήν
  choice: Amen
  rationale: Bewahrt die feierliche Bekräftigungsformel Jesu und ist im Deutschen verständlich sowie bibelsprachlich etabliert.
- source_word: ἀφῆκεν
  choice: verlassen hat
  rationale: Gibt hier das Zurücklassen von Haus und Angehörigen natürlich und sachgerecht wieder, ohne eine endgültige Verstoßung zu unterstellen.
- source_word: οἰκίαν
  choice: Haus
  rationale: Die artikellose deutsche Reihung klingt natürlich und kann sowohl das Wohnhaus als auch den häuslichen Lebensbereich bezeichnen.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: um des Reiches Gottes willen
  rationale: Gibt den Grund beziehungsweise Beweggrund präzise und in würdigem, geläufigem Deutsch wieder.
theological_decisions:
- issue: Verlassen naher Angehöriger um des Reiches Gottes willen
  choice: Die Aussage wird ohne erklärende Einschränkung wiedergegeben.
  alternative: Durch Zusätze wie »zeitweise zurückgelassen« oder »aufgegeben« näher bestimmen.
  rationale: Der griechische Text legt Art und Dauer des Verlassens nicht fest; diese Spannung soll nicht durch eine konfessionelle oder ethische Deutung aufgelöst werden.
- issue: βασιλεία τοῦ θεοῦ
  choice: Reich Gottes
  alternative: Königsherrschaft Gottes
  rationale: »Reich Gottes« ist im Deutschen klar und etabliert; die mögliche dynamische Bedeutung von Gottes Herrschaft bleibt im Ausdruck mitenthalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bewusst offen, da der Vers syntaktisch in Lukas 18,30 fortgeführt wird. Keine Fußnoten erforderlich.
