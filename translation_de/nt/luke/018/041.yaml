id: LUK.18.41
reference: Luke 18:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: de
  text: '„Was möchtest du, dass ich für dich tue?“ Da sagte er: „Herr[a], dass ich wieder sehen kann[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch lediglich als respektvolle Anrede verstanden werden, etwa „mein Herr“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „dass ich mein Augenlicht wiedererlange“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Was
  rationale: Das Fragepronomen zielt auf den konkreten Wunsch des Mannes; eine kausale Wiedergabe wie „warum“ passt hier nicht.
- source_word: σοι
  choice: für dich
  rationale: Der Dativ bei ποιήσω hat hier begünstigende Bedeutung und wird im Deutschen natürlich mit „für dich“ wiedergegeben.
- source_word: θέλεις
  choice: möchtest du
  rationale: θέλω bezeichnet den Willen oder Wunsch. „Möchtest du“ klingt in der direkten Frage natürlich und etwas würdevoller als „willst du“, ohne den Sinn abzuschwächen.
- source_word: ποιήσω
  choice: dass ich … tue
  rationale: Der Aorist Konjunktiv wird nach θέλεις im Deutschen idiomatisch durch einen dass-Satz wiedergegeben.
- source_word: ὁ δὲ εἶπεν
  choice: Da sagte er
  rationale: δέ führt hier nicht zwingend einen Gegensatz ein, sondern setzt die Erzählung leicht weiter; „Da“ gibt diesen Fortgang natürlich wieder.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche Wiedergabe von κύριος und bewahrt sowohl den Charakter einer respektvollen Anrede als auch eine mögliche weitergehende Aussage über Jesus.
- source_word: ἵνα
  choice: dass
  rationale: ἵνα leitet hier den Inhalt des geäußerten Wunsches ein. Der elliptische dass-Satz entspricht der knappen Antwort des griechischen Textes.
- source_word: ἀναβλέψω
  choice: ich wieder sehen kann
  rationale: In einem Heilungszusammenhang bedeutet ἀναβλέπω gewöhnlich, das Sehvermögen wiederzuerlangen. „Wieder sehen“ ist klar, unmittelbar und lässt die Antwort natürlich klingen.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Jesu
  choice: Herr
  alternative: mein Herr; bloße respektvolle Anrede
  rationale: Das griechische κύριε kann eine höfliche Anrede sein, kann im Zusammenhang mit Jesus aber auch christologische Resonanz tragen. „Herr“ bewahrt diese Spannung, statt den Ausdruck auf reine Höflichkeit zu beschränken.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, direktem Gesprächston. Die knappe Antwort in Form eines dass-Satzes bewahrt die Struktur und Eindringlichkeit des griechischen Textes; sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
