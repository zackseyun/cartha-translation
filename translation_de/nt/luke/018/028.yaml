  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: de
  text: 'Da sagte Petrus: »Sieh, wir haben unser Eigenes[a] verlassen und sind dir gefolgt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was uns gehörte« oder »unseren eigenen Besitz«. Der griechische Ausdruck ist weit gefasst und sagt nicht genauer, was Petrus und die anderen verlassen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Da sagte Petrus
  rationale: δέ führt die Erzählung mit einer leichten Übergangs- oder Kontrastwirkung weiter. „Da“ gibt diesen Zusammenhang im Deutschen natürlich wieder; εἶπεν bezeichnet schlicht das Sagen.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Der Ausdruck lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ bewahrt diese Funktion in würdiger, noch verständlicher Gegenwartssprache.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt im Griechischen Nachdruck. Das deutsche „wir“ bleibt ausdrücklich stehen und wird durch die vorangestellte Aufforderung „Sieh“ zusätzlich hervorgehoben.
- source_word: ἀφέντες τὰ ἴδια
  choice: wir haben verlassen, was unser war
  rationale: Das Partizip wird im Deutschen idiomatisch mit dem finiten Verb koordiniert. τὰ ἴδια ist bewusst weit und bezeichnet das Eigene, ohne festzulegen, ob Besitz, Haus, Familie oder anderes gemeint ist. „Was unser war“ erhält diese Offenheit.
- source_word: ἠκολουθήσαμέν σοι
  choice: und sind dir gefolgt
  rationale: ἀκολουθέω mit Dativ ist der übliche Ausdruck für das Folgen, hier zugleich mit dem Jüngerschaftssinn. Die direkte Wiedergabe wahrt beides.
theological_decisions:
- issue: Umfang dessen, was die Jünger verlassen haben
  choice: was unser war
  alternative: unseren Besitz / unser Zuhause
  rationale: Der griechische Ausdruck τὰ ἴδια bestimmt nicht genauer, was verlassen wurde. Die Übersetzung vermeidet daher eine theologische oder biografische Verengung.
translation_notes:
  register: Moderne, würdige Standardsprache. „Sieh“ ist bewusst knapper und feierlicher als „Schau“, ohne das altertümliche „Siehe“ zu verwenden. Die Satzstellung bleibt natürlich und bewahrt zugleich den Nachdruck der Aussage.
