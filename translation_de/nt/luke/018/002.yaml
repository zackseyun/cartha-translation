  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: de
  text: 'Er sagte: »In einer Stadt lebte ein Richter, der Gott nicht fürchtete und keinen Menschen achtete[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und auf niemanden Rücksicht nahm.«'
    reason: Lexikalische Alternative für μὴ ἐντρεπόμενος; das Verb kann hier mangelnde Achtung, Scheu oder Rücksicht bezeichnen.
lexical_decisions:
- source_word: λέγων
  choice: Er sagte
  rationale: Das Präsenspartizip leitet den Inhalt des Gleichnisses ein und knüpft an den vorhergehenden Vers an. Im modernen Deutschen ist ein finiter Einleitungssatz natürlicher als die wörtliche Partizipialform „sagend“.
- source_word: Κριτής τις ἦν ἔν τινι πόλει
  choice: In einer Stadt lebte ein Richter
  rationale: Die beiden Vorkommen von τις führen unbestimmte, nicht namentlich genannte Größen ein. Die deutschen unbestimmten Artikel geben dies natürlich wieder; „ein gewisser“ wäre durch die Wiederholung schwerfällig. „lebte“ dient idiomatisch der Einführung einer Person in eine Erzählung.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: der Gott nicht fürchtete
  rationale: Die Relativsatzkonstruktion gibt die dauerhafte Haltung des Richters natürlich wieder. „Gott fürchten“ bewahrt den religiös-ethischen Gehalt von φοβέομαι.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: und keinen Menschen achtete
  rationale: Der generische Singular ἄνθρωπον bezeichnet hier jeden Mitmenschen. „keinen Menschen“ wahrt den Singular und ist im Deutschen geschlechtsübergreifend verständlich. „achtete“ bringt fehlenden Respekt beziehungsweise fehlende Rücksicht knapp zum Ausdruck.
theological_decisions:
- issue: Gegensatz zwischen Gottesfurcht und der Haltung gegenüber Menschen
  choice: Gott nicht fürchtete und keinen Menschen achtete
  alternative: Gott nicht fürchtete und auf niemanden Rücksicht nahm
  rationale: Die Formulierung erhält den pointierten Gegensatz der griechischen Parallelstruktur, ohne ἄνθρωπον auf Männer einzuengen. Die alternative Wiedergabe hebt stärker die praktische Rücksichtslosigkeit hervor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählungseinleitung ist idiomatisch formuliert; der knappe Parallelismus zwischen Gott und Mensch bleibt erhalten.
