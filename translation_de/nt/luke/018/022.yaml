source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: de
  text: 'Als Jesus das hörte, sagte er zu ihm: »Eines fehlt dir noch: Verkaufe alles, was du hast, und verteile es an die Armen. Dann wirst du einen Schatz im Himmel[a] haben. Und komm, folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen der Plural: »in den Himmeln«. Im Deutschen ist hier der Singular »im Himmel« üblich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Als Jesus das hörte
  rationale: Das aoristische Partizip mit δέ bezeichnet hier natürlich die zeitliche Abfolge. Der deutsche Nebensatz gibt diese idiomatisch wieder, ohne δέ unnötig mit »aber« zu überzeichnen.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Eines fehlt dir noch
  rationale: Die Formulierung bewahrt »eines« als grammatisches Subjekt von λείπει und gibt zugleich die griechische Dativkonstruktion in natürlichem Deutsch wieder.
- source_word: πάντα ὅσα ἔχεις
  choice: alles, was du hast
  rationale: Die Wendung bringt den umfassenden Sinn des Griechischen klar und idiomatisch zum Ausdruck.
- source_word: πώλησον
  choice: Verkaufe
  rationale: Der Aoristimperativ fordert eine entschiedene Handlung; der einfache deutsche Imperativ gibt dies angemessen wieder.
- source_word: διάδος πτωχοῖς
  choice: verteile es an die Armen
  rationale: διαδίδωμι bezeichnet das Verteilen beziehungsweise Austeilen. Das Pronomen »es« nimmt in natürlichem Deutsch den aus dem Verkauf verfügbaren Besitz beziehungsweise Erlös auf, ohne die Empfängergruppe abzuschwächen.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: Dann wirst du einen Schatz im Himmel haben
  rationale: »Dann« macht den im Zusammenhang ausgedrückten Folgebezug verständlich; θησαυρός wird mit »Schatz« wiedergegeben. Der idiomatische deutsche Singular »Himmel« steht für den griechischen Plural.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Und komm, folge mir!
  rationale: δεῦρο wirkt als Aufforderung, zu Jesus zu kommen; der Präsensimperativ ἀκολούθει bezeichnet die Nachfolge, deren fortdauernder Charakter im deutschen »folge mir« kontextuell enthalten ist.
theological_decisions:
- issue: Reichweite der Aufforderung zu Besitzverzicht und Nachfolge
  choice: Die konkreten Imperative werden als unmittelbare Aufforderung Jesu an diesen Mann wiedergegeben und münden unverändert in den Ruf zur Nachfolge.
  alternative: Die Aussage entweder als allgemeines Gebot vollständiger Besitzaufgabe für alle Glaubenden oder nur als sinnbildliche, wirtschaftlich unverbindliche Forderung auszulegen.
  rationale: Der griechische Text formuliert eine konkrete Forderung an den Gesprächspartner, bestimmt in diesem Vers aber nicht ausdrücklich ihre universale Reichweite. Die Übersetzung bewahrt daher die Schärfe und die theologische Spannung, ohne sie lehrmäßig auszuweiten oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative und die abschließende Aufforderung bleiben direkt und eindringlich; unnötige altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
