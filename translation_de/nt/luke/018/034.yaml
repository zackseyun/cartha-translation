  timestamp: '2026-07-14T21:48:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die dreigliedrige Aussage des griechischen Textes wird im Wesentlichen getroffen, und die ungenannte Instanz des Verbergens bleibt offen. Die Fußnote enthält jedoch einen sachlichen Fehler: ἀπ’ αὐτῶν bedeutet hier „vor ihnen/ihnen verborgen“ im Sinn von „vor ihnen verborgen gehalten“ bzw. idiomatisch „ihnen verborgen“, nicht wörtlich „vor ihnen verborgen“ als direkte deutsche Wiedergabe. Außerdem gibt „blieb“ eher ein Fortbestehen wieder, während die perfektische Passivkonstruktion den Zustand des Verborgen-Seins nach einem Verbergen ausdrückt.'
  naturalness: „Sie aber verstanden nichts von alledem“ und „war ihnen verborgen“ sind modernes, würdiges Standarddeutsch. „Was gesagt wurde“ ist natürlicher und weniger interpretierend als „was damit gesagt wurde“; das hinzugefügte „damit“ ist im griechischen Text nicht ausgedrückt.
  terminology: „Wort“ ist für ῥῆμα möglich und wahrt die Breite des Ausdrucks. Die Variation „verstanden“ / „erkannten“ kann die unterschiedlichen griechischen Verben wiedergeben, ohne den Sinn zu verändern.
  issues:
  - severity: medium
    issue: Die Fußnote bezeichnet „war vor ihnen verborgen“ als wörtliche Wiedergabe.
    rationale: Die Formulierung ist keine zutreffende wörtliche Erklärung der griechischen Konstruktion κεκρυμμένον ἀπ’ αὐτῶν. Die Fußnote sollte stattdessen das unpersönliche Passiv und den nicht genannten Urheber erläutern.
  - severity: low
    issue: „blieb ihnen verborgen“ kann einen fortdauernden Verlauf stärker nahelegen als der griechische Zustandspassivsatz.
    rationale: „War ihnen verborgen“ gibt den resultierenden Zustand der perfektischen passiven Umschreibung direkter wieder.
  - severity: low
    issue: „was damit gesagt wurde“ fügt durch „damit“ einen nicht ausdrücklich markierten Rückbezug hinzu.
    rationale: τὰ λεγόμενα bezeichnet schlicht das Gesagte bzw. die ausgesprochenen Dinge; „was gesagt wurde“ bewahrt dies ohne Zusatz.
  revised_text: Sie aber verstanden nichts von alledem. Dieses Wort war ihnen verborgen,[a] und sie erkannten nicht, was gesagt wurde.
  revised_footnotes:
  - marker: a
    text: Das griechische Passiv „war ihnen verborgen“ nennt nicht, wer oder was es ihnen verbarg.
    reason: Erläutert das ungenannte Agens des griechischen Passivs, ohne eine Ursache festzulegen.
  revision_rationale: Die Überarbeitung korrigiert die unzutreffende Fußnotenparaphrase, gibt den Zustand des Verborgen-Seins präziser wieder und entfernt den zusätzlichen Bezugsausdruck „damit“. Die dreifache Schilderung des Unverständnisses sowie die theologische Offenheit des ungenannten Passivs bleiben erhalten.
