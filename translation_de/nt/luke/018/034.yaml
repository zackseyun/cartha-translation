id: LUK.18.34
reference: Luke 18:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: de
  text: Sie aber verstanden nichts von alledem. Dieses Wort war ihnen verborgen,[a] und sie erkannten nicht, was gesagt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Passiv „war ihnen verborgen“ nennt nicht, wer oder was es ihnen verbarg.
    reason: Erläutert das ungenannte Agens des griechischen Passivs, ohne eine Ursache festzulegen.
lexical_decisions:
- source_word: συνῆκαν
  choice: verstanden
  rationale: συνίημι bezeichnet hier das gedankliche Erfassen der vorausgehenden Ankündigung Jesu; „verstanden“ ist natürlich und präzise.
- source_word: οὐδὲν τούτων
  choice: nichts davon
  rationale: Die Wendung verweist auf die zuvor genannten Aussagen zurück und wird im Deutschen idiomatisch knapp wiedergegeben.
- source_word: τὸ ῥῆμα τοῦτο
  choice: dieses Wort
  rationale: „Wort“ bewahrt die mögliche Bedeutungsbreite von ῥῆμα zwischen einzelner Äußerung und Botschaft, ohne sie vorschnell einzuengen.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: blieb ihnen verborgen
  rationale: Die Formulierung gibt den aus vorausgegangenem Verbergen resultierenden Zustand wieder und lässt wie das griechische Passiv offen, wer oder was dafür verantwortlich ist.
- source_word: ἐγίνωσκον
  choice: erkannten
  rationale: „Erkannten“ erhält eine gewisse lexikalische Unterscheidung zu συνῆκαν und bezeichnet hier das Erfassen des Sinnes.
- source_word: τὰ λεγόμενα
  choice: was damit gesagt wurde
  rationale: Die natürliche deutsche Formulierung bezeichnet den Inhalt des Gesagten; „damit“ macht den Rückbezug auf Jesu Aussage deutlich, ohne zusätzlichen Inhalt einzuführen.
theological_decisions:
- issue: Ursache des Nichtverstehens der Jünger
  choice: Das Verborgensein wird ohne genannten Urheber wiedergegeben.
  alternative: Das Verbergen ausdrücklich Gott oder ausschließlich der psychischen Verwirrung der Jünger zuschreiben.
  rationale: Der griechische Passivsatz nennt keinen Handelnden. Die Übersetzung bewahrt diese theologische und erzählerische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Beschreibung des mangelnden Verständnisses bleibt erhalten; durch „verstanden“, „verborgen“ und „erkannten“ wird unnötige monotone Wiederholung vermieden, ohne die Aussage abzuschwächen.
