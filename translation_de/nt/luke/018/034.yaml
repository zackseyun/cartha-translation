revisions:
- from: Doch sie verstanden nichts davon. Dieses Wort blieb ihnen verborgen,[a] und sie erkannten nicht, was damit gesagt wurde.
  to: Sie aber verstanden nichts von alledem. Dieses Wort war ihnen verborgen,[a] und sie erkannten nicht, was gesagt wurde.
  rationale: Die Überarbeitung korrigiert die unzutreffende Fußnotenparaphrase, gibt den Zustand des Verborgen-Seins präziser wieder und entfernt den zusätzlichen Bezugsausdruck „damit“. Die dreifache Schilderung des Unverständnisses sowie die theologische Offenheit des ungenannten Passivs bleiben erhalten.
