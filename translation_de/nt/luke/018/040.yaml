  source_fidelity: 'Der Text gibt die Abfolge und Aussage des griechischen Textes präzise wieder: Jesus hält an, ordnet an, dass der zuvor genannte Mann zu ihm gebracht wird, und fragt ihn nach dessen Annäherung. „Den Mann“ macht einen im Deutschen sonst potenziell unscharfen Pronomenbezug deutlich, ohne den Sinn zu erweitern.'
  naturalness: „Da blieb Jesus stehen“ sowie die anschließende Satzfolge sind natürliches modernes Standarddeutsch in angemessen würdigem Erzählregister. Die Wiederholung von „Jesus“ nach „Als er näher kam“ klärt den Bezug idiomatisch. Der Doppelpunkt bildet den Übergang zur folgenden direkten Rede korrekt ab.
  terminology: „Befahl“ trifft die Verbindlichkeit von ἐκέλευσεν. „Bringen“ ist für ἀχθῆναι kontextgerecht; die Fußnote nennt mit „führen“ eine tragfähige lexikalische Alternative. Die Namensform „Jesus“ entspricht deutschem Standardgebrauch.
