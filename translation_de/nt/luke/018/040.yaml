source:
  edition: SBLGNT
  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: de
  text: 'Da blieb Jesus stehen und befahl, den Mann zu ihm zu bringen[a]. Als er näher kam, fragte Jesus ihn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ihm zu führen“. Das griechische Verb kann sowohl „bringen“ als auch „führen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: blieb … stehen
  rationale: Das intransitiv gebrauchte Aoristpartizip von ἵστημι bezeichnet hier, dass Jesus anhielt. „Blieb stehen“ ist im modernen Deutschen natürlich und bewahrt das anschauliche Moment.
- source_word: δὲ
  choice: Da
  rationale: δέ ist ein schwaches Bindewort. „Da“ führt die Erzählung folgerichtig weiter, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: κελεύω bezeichnet eine verbindliche Anordnung. „Befahl“ gibt die autoritative Aussage knapp und idiomatisch wieder.
- source_word: αὐτὸν ἀχθῆναι πρὸς αὐτόν
  choice: den Mann zu ihm zu bringen
  rationale: Das passive Infinitivgefüge mit ἄγω bezeichnet, dass andere den zuvor genannten Blinden zu Jesus bringen beziehungsweise führen sollen. „Den Mann“ klärt den deutschen Bezug, ohne neue Sachinformation einzuführen.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Als er näher kam
  rationale: Der Genitivus absolutus hat temporale Funktion. „Als er näher kam“ gibt den Vorgang natürlich wieder; das Pronomen bezieht sich auf den blinden Mann.
- source_word: ἐπηρώτησεν αὐτόν
  choice: fragte Jesus ihn
  rationale: ἐπερωτάω bedeutet hier schlicht „fragen“. Die Wiederholung von „Jesus“ vermeidet im Deutschen die mögliche Fehlzuordnung des Subjekts nach „Als er näher kam“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge folgt dem griechischen Text, während die ausdrückliche Wiederaufnahme von „Jesus“ im zweiten Satz die Pronomenbezüge im Deutschen klärt. Der abschließende Doppelpunkt signalisiert die in Vers 41 folgende direkte Rede.
