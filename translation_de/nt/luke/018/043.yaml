  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: de
  text: Und sofort erlangte er sein Augenlicht[a], und er folgte ihm und verherrlichte Gott. Als das ganze Volk das sah, pries es Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „konnte wieder sehen“ oder „erhielt sein Augenlicht zurück“. Das griechische Verb kann das Wiedererlangen der Sehkraft bezeichnen, legt hier aber nicht ausdrücklich fest, ob der Mann früher schon sehen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: sofort
  rationale: Bezeichnet ein Geschehen ohne Verzögerung und ist im modernen Deutschen natürlich.
- source_word: ἀνέβλεψεν
  choice: konnte er sehen
  rationale: Im Heilungskontext bezeichnet das Verb das Erlangen oder Wiedererlangen der Sehkraft. Die Formulierung ist natürlich und legt nicht fest, ob der Mann früher schon sehen konnte.
- source_word: ἠκολούθει
  choice: er folgte ihm
  rationale: Das Imperfekt beschreibt die einsetzende und fortdauernde Begleitung; im deutschen Erzählstil gibt das Präteritum dies natürlich wieder.
- source_word: δοξάζων
  choice: verherrlichte
  rationale: Bewahrt den Unterschied zum späteren αἶνον und bezeichnet die Gott erwiesene Ehre.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Gibt die kollektive Singularform direkt und idiomatisch wieder; im Kontext ist die versammelte Volksmenge gemeint.
- source_word: ἰδών
  choice: als ... das sah
  rationale: Die temporale Wiedergabe ist im Deutschen flüssig; „das“ verweist auf die gerade geschilderte Heilung und Reaktion.
- source_word: ἔδωκεν αἶνον
  choice: pries
  rationale: Die wörtliche Wendung „gab Lob“ wäre im Deutschen unnatürlich; „pries“ gibt den Sinn idiomatisch wieder.
- source_word: θεόν / θεῷ
  choice: Gott
  rationale: Standardwiedergabe; die zweimalige Nennung bleibt erhalten.
theological_decisions:
- issue: Bedeutungsumfang von ἀναβλέπω
  choice: konnte er sehen
  alternative: er konnte wieder sehen / erhielt sein Augenlicht zurück
  rationale: Die gewählte Fassung wahrt die Heilungsaussage, ohne vorauszusetzen, dass der Mann früher sehend gewesen war.
- issue: Aspekt von ἠκολούθει
  choice: er folgte ihm
  alternative: er ging ihm weiter nach
  rationale: Das griechische Imperfekt kann fortdauerndes Handeln hervorheben. Das einfache deutsche Präteritum ist im Erzählzusammenhang natürlicher, während eine Fußnote hier nicht nötig ist.
- issue: Bezug von Jesusnachfolge und Gottesverherrlichung
  choice: er folgte ihm und verherrlichte Gott
  alternative: er folgte ihm, wobei er Gott verherrlichte
  rationale: Die koordinierte Form bewahrt beide gleichzeitigen Reaktionen, ohne zusätzliche theologische Beziehungen zwischen ihnen auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ablauf, vermeidet jedoch unnatürliche Wendungen wie „Lob geben“. Der Unterschied zwischen „verherrlichte“ und „pries“ bildet die unterschiedlichen griechischen Ausdrücke ab.
