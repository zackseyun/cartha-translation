id: LUK.18.25
reference: Luke 18:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: de
  text: Denn es ist leichter, dass ein Kamel durch ein Nadelöhr geht, als dass ein Reicher in das Reich Gottes hineinkommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Nadelöhr“ ist im griechischen Text die Öffnung einer Nadel gemeint. Erklärungen als Name eines engen Tores oder die Wiedergabe „Seil“ statt „Kamel“ sind durch den hier vorliegenden Wortlaut nicht gestützt.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: leichter
  rationale: Der Komparativ steht prädikativ mit ἐστιν; „es ist leichter“ ist die natürliche deutsche Wiedergabe.
- source_word: γάρ
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorherigen Zusammenhang.
- source_word: κάμηλον
  choice: ein Kamel
  rationale: κάμηλος bezeichnet regulär ein Kamel; für „Seil“ gibt es in diesem griechischen Text keinen Anhaltspunkt.
- source_word: διὰ τρήματος βελόνης
  choice: durch ein Nadelöhr
  rationale: Idiomatiche und genaue deutsche Wiedergabe von „durch die Öffnung einer Nadel“.
- source_word: εἰσελθεῖν
  choice: geht / hineinkommt
  rationale: Die beiden Vorkommen desselben Verbs werden dem jeweiligen deutschen Kontext entsprechend natürlich wiedergegeben; die Bewegungsrichtung bleibt erhalten.
- source_word: πλούσιον
  choice: ein Reicher
  rationale: Das maskuline substantivierte Adjektiv im repräsentativen Singular wird knapp und formgetreu wiedergegeben.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: in das Reich Gottes
  rationale: Bewahrt die gerichtete Bewegung von εἰς und die vertraute, transparente Wendung „Reich Gottes“.
theological_decisions:
- issue: Deutung des Bildes vom Kamel und Nadelöhr
  choice: Das wörtliche, zugespitzte Bild „ein Kamel durch ein Nadelöhr“ bleibt stehen.
  alternative: Deutung als enges Stadttor namens „Nadelöhr“ oder Ersetzung von „Kamel“ durch „Seil“.
  rationale: Der vorliegende griechische Text liest κάμηλον („Kamel“) und bezeichnet die Öffnung einer Nadel. Spätere harmonisierende Erklärungen dürfen nicht in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Hineinkommt“ vermeidet die im Deutschen weniger natürliche Wiederholung von „eingehen“ und bewahrt zugleich die räumliche Metaphorik.
