source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: de
  text: Doch weil diese Witwe mir ständig Mühe macht, werde ich ihr zu ihrem Recht verhelfen[a], damit sie mich nicht durch ihr unablässiges Kommen zermürbt[b].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Recht verschaffen“; je nach Zusammenhang kann das griechische Verb auch „rächen“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich kann das griechische Verb „unter das Auge schlagen“ bedeuten; hier bildlich auch: „aufreiben“ oder „fertigmachen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην
  choice: Doch weil diese Witwe mir ständig Mühe macht
  rationale: διά mit substantiviertem Infinitiv bezeichnet den Grund; γε hebt ihn hervor. Das Präsens παρέχειν lässt die fortdauernde Belästigung erkennen. „Jemandem Mühe machen“ gibt die Wendung natürlich und würdig wieder.
- source_word: ἐκδικήσω αὐτήν
  choice: werde ich ihr zu ihrem Recht verhelfen
  rationale: Im gerichtlichen Zusammenhang bezeichnet ἐκδικέω das Gewähren von Recht beziehungsweise Rechtsschutz, nicht notwendig persönliche Rache. Die deutsche Wendung bewahrt den juristischen Sinn und klingt natürlich.
- source_word: εἰς τέλος ἐρχομένη
  choice: durch ihr unablässiges Kommen
  rationale: Das Partizip beschreibt das wiederholte Kommen; εἰς τέλος verstärkt es im Sinn von fortwährend beziehungsweise bis zum Äußersten. „Unablässig“ vermittelt die vom Richter empfundene Beharrlichkeit, ohne eine zeitliche Endaussage festzulegen.
- source_word: ὑπωπιάζῃ με
  choice: mich … zermürbt
  rationale: Das Verb bedeutet wörtlich, unter das Auge zu schlagen, kann hier aber bildlich das Aufreiben oder Zermürben durch beharrliches Drängen ausdrücken. „Zermürbt“ erhält die Kraft des Bildes, ohne eine körperliche Drohung als eindeutig vorauszusetzen.
theological_decisions:
- issue: Bedeutung von ἐκδικέω im Gleichnis über Gebet und Gerechtigkeit
  choice: ihr zu ihrem Recht verhelfen
  alternative: sie rächen / ihr Recht verschaffen
  rationale: Die Szene handelt von gerichtlicher Abhilfe. Die gewählte Formulierung wahrt den Bezug zur Gerechtigkeit in den folgenden Versen, ohne einen ausschließlich vergeltenden Sinn einzutragen.
- issue: Bildlichkeit von ὑπωπιάζω
  choice: zermürben
  alternative: unter das Auge schlagen / fertigmachen
  rationale: Der Kontext erlaubt eine kräftige bildliche Aussage über die Wirkung ihres wiederholten Kommens. Die Übersetzung legt weder eine tatsächliche Gewaltdrohung noch eine abgeschwächte bloße Belästigung zwingend fest; die wörtliche Bildbasis wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ gibt den begründenden Umschwung wieder; „ständig“ und „unablässig“ lassen die fortdauernde Beharrlichkeit erkennen. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Formulierungen.
