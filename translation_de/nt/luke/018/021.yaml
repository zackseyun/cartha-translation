  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: de
  text: 'Er aber sagte: »Das alles habe ich von meiner Jugend an befolgt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Er aber sagte
  rationale: δέ ist ein leichter weiterführender oder kontrastierender Konnektor. Hier gibt »aber« die Reaktion auf Jesu Aufzählung natürlich wieder, ohne einen starken Gegensatz zu behaupten.
- source_word: Ταῦτα πάντα
  choice: das alles
  rationale: Die griechische Wendung nennt die Gebote nicht ausdrücklich. »Das alles« ist im Deutschen natürlich und bewahrt den impliziten Rückbezug auf die zuvor genannten Gebote.
- source_word: ἐφύλαξα
  choice: habe ich … befolgt
  rationale: φυλάσσω bezeichnet hier das Einhalten beziehungsweise Befolgen von Geboten. Das deutsche Perfekt gibt die Behauptung einer bis zur Gegenwart reichenden Lebenspraxis idiomatisch wieder.
- source_word: ἐκ νεότητος μου
  choice: von meiner Jugend an
  rationale: ἐκ mit Genitiv bezeichnet den zeitlichen Ausgangspunkt. »Von meiner Jugend an« ist eine natürliche und genaue deutsche Wiedergabe.
theological_decisions:
- issue: Umfang der behaupteten Gesetzestreue
  choice: Die Aussage wird ohne abschwächenden oder wertenden Zusatz wiedergegeben.
  alternative: Die Behauptung durch Formulierungen wie »meiner Meinung nach« relativieren oder ihre theologische Unzulänglichkeit ausdrücklich markieren.
  rationale: Der Vers berichtet zunächst die uneingeschränkte Selbstaussage des Mannes. Ihre Bewertung ergibt sich aus dem weiteren Kontext und soll nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Befolgt« passt idiomatisch zu den im Kontext genannten Geboten; »das alles« bewahrt zugleich die knappe Ausdrucksweise des Griechischen.
