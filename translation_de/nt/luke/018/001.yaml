  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Ἔλεγεν als erzählendes Präteritum, παραβολή als „Gleichnis“, die Adressaten mit „ihnen/sie“, die fortdauernde Ausrichtung von πάντοτε sowie ἐγκακεῖν idiomatisch als „nicht den Mut verlieren“. „Sollten“ gibt die in δεῖν liegende Notwendigkeit im deutschen indirekten Aussagesatz angemessen wieder, ohne sie unnötig zu verschärfen.'
  naturalness: „Er erzählte ihnen ein Gleichnis darüber, dass sie allezeit beten und nicht den Mut verlieren sollten“ ist flüssiges, verständliches Standarddeutsch. „Allezeit“ ist leicht gehoben, aber im biblischen Register geläufig und nicht unnatürlich.
