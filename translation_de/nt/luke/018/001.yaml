id: LUK.18.1
reference: Luke 18:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: de
  text: Er erzählte ihnen ein Gleichnis darüber, dass sie allezeit beten und nicht den Mut verlieren sollten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu zeigen, dass sie allezeit beten und nicht mutlos werden sollten.“'
    reason: Die Konstruktion πρὸς τὸ mit Infinitiv kann stärker als Zweckangabe verstanden werden; außerdem ist „mutlos werden“ eine mögliche Wiedergabe von ἐγκακεῖν.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Er erzählte
  rationale: Der Imperfekt setzt die Erzählung als fortlaufende beziehungsweise rahmende Handlung in der Vergangenheit; im natürlichen Deutschen kann dies idiomatisch mit dem Präteritum wiedergegeben werden.
- source_word: δὲ
  choice: unmarkiert
  rationale: δέ ist hier ein schwacher Übergangsmarker. Ein ausdrückliches „nun“ oder „aber“ wäre im Deutschen unnötig und könnte eine zeitliche oder gegensätzliche Nuance überbetonen.
- source_word: παραβολὴν
  choice: ein Gleichnis
  rationale: „Gleichnis“ ist die übliche und sachlich genaue Bezeichnung dieser synoptischen Lehrform.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Gibt das Dativobjekt und den angesprochenen Hörerkreis direkt wieder.
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: darüber, dass sie … sollten
  rationale: Die Konstruktion bezeichnet Bezug beziehungsweise Zweck und verbindet sich mit δεῖν, das eine Notwendigkeit ausdrückt. Die deutsche Fassung ist natürlich und wahrt den verpflichtenden Sinn.
- source_word: πάντοτε
  choice: allezeit
  rationale: „Allezeit“ gibt die beharrliche, fortdauernde Ausrichtung prägnant und in einem würdigen biblischen Register wieder, ohne zwingend ununterbrochenes Sprechen zu behaupten.
- source_word: προσεύχεσθαι
  choice: beten
  rationale: Direkte und etablierte Wiedergabe des Infinitivs.
- source_word: μὴ ἐγκακεῖν
  choice: nicht den Mut verlieren
  rationale: Die Wendung bezeichnet das Erlahmen oder Mutloswerden. „Nicht den Mut verlieren“ ist gegenwärtiges, verständliches Deutsch und passt zum Zusammenhang beharrlichen Gebets.
theological_decisions:
- issue: Verbindlichkeit und Beharrlichkeit des Gebets
  choice: „dass sie allezeit beten und nicht den Mut verlieren sollten“
  alternative: „um zu zeigen, dass sie allezeit beten müssen und nicht mutlos werden dürfen“
  rationale: δεῖν drückt Notwendigkeit aus. „Sollten“ wahrt den verpflichtenden Charakter, ohne eine bestimmte Lehre über die Wirksamkeit des Gebets einzutragen; die Spannung zwischen göttlicher Notwendigkeit und menschlicher Beharrlichkeit bleibt bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Allezeit“ ist leicht gehoben, aber geläufig; „den Mut verlieren“ ist natürlich und klar.
