id: LUK.18.7
reference: Luke 18:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: de
  text: Sollte Gott da nicht seinen Erwählten Recht verschaffen, die Tag und Nacht zu ihm schreien? Und sollte er sie lange warten lassen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „obwohl er Geduld mit ihnen hat“; auch möglich: „Und hat er Geduld mit ihnen?“ Die griechische Wendung kann Geduld oder Langmut bezeichnen statt einer Verzögerung.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: Recht verschaffen
  rationale: Im Zusammenhang mit dem ungerechten Richter bezeichnet das Wort gerichtliche Abhilfe und Rechtfertigung, nicht persönliche Rache.
- source_word: ἐκλεκτῶν
  choice: Erwählten
  rationale: Das substantivierte Adjektiv bezeichnet die von Gott Erwählten; die geläufige deutsche Formulierung bewahrt den theologischen Sinn, ohne ihn konfessionell einzuengen.
- source_word: βοώντων
  choice: die ... schreien
  rationale: Die Form bezeichnet ein eindringliches, anhaltendes Rufen und passt hier zum beharrlichen Gebet.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Die feste deutsche Wendung erhält die zeitliche Betonung des unablässigen Rufens.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: sollte er sie lange warten lassen?
  rationale: Im Kontext der raschen Rechtsverschaffung in Vers 8 lässt sich die schwierige Wendung als Frage nach einer Verzögerung von Gottes Eingreifen verstehen. Die mögliche Bedeutung von Geduld oder Langmut bleibt in der Fußnote erhalten.
- source_word: οὐ μὴ ποιήσῃ
  choice: Sollte ... nicht ... verschaffen
  rationale: Die starke Verneinung steht in einer rhetorischen Frage, die eine bejahende Antwort erwartet; diese deutsche Form gibt den Nachdruck natürlich wieder.
- source_word: θεὸς
  choice: Gott
  rationale: Entspricht der üblichen und sachgerechten Wiedergabe.
theological_decisions:
- issue: Bedeutung von μακροθυμεῖ ἐπ’ αὐτοῖς im Blick auf Gottes Handeln und Charakter
  choice: 'Als rhetorische Frage nach einer Verzögerung wiedergegeben: „Und sollte er sie lange warten lassen?“'
  alternative: „obwohl er Geduld mit ihnen hat“ oder „und hat er Geduld mit ihnen?“
  rationale: Die griechische Wendung kann Gottes Geduld beziehungsweise Langmut bezeichnen. Der unmittelbare Zusammenhang, besonders Vers 8, legt zugleich eine Frage nach verzögertem Eingreifen nahe. Der Haupttext folgt diesem Zusammenhang, während die Fußnote die echte Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei rhetorischen Fragen machen die erwartete bejahende Antwort deutlich. „Recht verschaffen“ wahrt den gerichtlichen Zusammenhang; die schwierige Schlusswendung wird im Haupttext verständlich wiedergegeben, ohne ihre alternative Deutung zu verschweigen.
