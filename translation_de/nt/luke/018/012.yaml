  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: de
  text: Ich faste zweimal pro Woche[a] und gebe den Zehnten von allem, was ich erwerbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zweimal des Sabbats“; die Wendung bedeutet „zweimal pro Woche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Ich faste
  rationale: Das Präsens beschreibt hier eine regelmäßige, vom Sprecher beanspruchte Praxis.
- source_word: δὶς τοῦ σαββάτου
  choice: zweimal in der Woche
  rationale: Die wörtlich auf den Sabbat bezogene Wendung ist ein griechisches Idiom für die Häufigkeit innerhalb einer Woche; die idiomatische deutsche Wiedergabe vermeidet ein Missverständnis als Fasten an Sabbattagen.
- source_word: ἀποδεκατῶ
  choice: ich gebe den Zehnten
  rationale: Das Verb bezeichnet das Abgeben eines Zehntels. Die Formulierung ist im modernen Deutsch klarer und natürlicher als das fachsprachliche „ich verzehnte“.
- source_word: πάντα ὅσα
  choice: von allem, was
  rationale: Die umfassende Bedeutung des Neutrum Plural und der Relativkonstruktion wird im Deutschen natürlich wiedergegeben.
- source_word: κτῶμαι
  choice: ich erwerbe
  rationale: Das Medium bezeichnet hier das Erwerben oder Gewinnen für sich, nicht bloß statischen Besitz.
theological_decisions:
- issue: Bedeutung von τοῦ σαββάτου in der Angabe zur Fastenhäufigkeit
  choice: idiomatische Zeitangabe „in der Woche“
  alternative: wörtlicher „des Sabbats“
  rationale: Die Wendung bezeichnet den Wochenzyklus und trifft keine theologische Aussage über Sabbatfasten. Die idiomatische Wiedergabe bewahrt den gemeinten zeitlichen Sinn.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die parallelen Behauptungen der Selbstbeschreibung bleiben knapp; „den Zehnten geben“ ist allgemein verständlich und vermeidet unnötige Fachsprache.
