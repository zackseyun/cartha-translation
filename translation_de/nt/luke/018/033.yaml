id: LUK.18.33
reference: Luke 18:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: de
  text: Und nachdem sie ihn ausgepeitscht haben, werden sie ihn töten, und am dritten Tag wird er auferstehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er auferweckt werden“. Das Griechische lautet unmittelbarer: „wird er auferstehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: nachdem sie ihn ausgepeitscht haben
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Töten vorausgeht. „Auspeitschen“ ist gegenwärtiges, allgemein verständliches Deutsch und gibt die gewaltsame Handlung präzise wieder.
- source_word: ἀποκτενοῦσιν
  choice: sie werden ihn töten
  rationale: Die schlichte Zukunftsform bewahrt den direkten Sinn des Verbs, ohne durch „ermorden“ eine zusätzliche rechtliche oder moralische Wertung einzutragen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Zusammenhang auf den Menschensohn beziehungsweise Jesus.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: am dritten Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der temporalen Dativkonstruktion und bewahrt die genaue Zeitangabe.
- source_word: ἀναστήσεται
  choice: wird er auferstehen
  rationale: Die zukünftige mediale Form von ἀνίστημι wird hier am unmittelbarsten intransitiv wiedergegeben. „Auferstehen“ ist im Deutschen natürlich und entspricht dem Auferstehungskontext, ohne ausdrücklich ein passives Handeln Gottes zu formulieren.
theological_decisions:
- issue: Formulierung der Auferstehung
  choice: wird er auferstehen
  alternative: wird er auferweckt werden
  rationale: Die griechische Form ist medial und wird hier direkt als intransitives „auferstehen“ verstanden. Die alternative passive Formulierung ist neutestamentlich an anderen Stellen belegt, würde jedoch in diesem Vers eine im Wortlaut nicht ausdrücklich genannte handelnde Instanz stärker hervorheben.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Auspeitschen“ ist zugänglicher als das gehobenere „geißeln“; „töten“ bleibt bewusst schlicht. Das Semikolon verdeutlicht die Abfolge und den Übergang zur Auferstehungsaussage.
