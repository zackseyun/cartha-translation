  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: de
  text: 'Und der Herr sagte: »Hört, was der ungerechte Richter sagt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Der Aorist von λέγω wird in der fortlaufenden Erzählung natürlich mit dem Präteritum wiedergegeben.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung weiter; »Da« ist im Deutschen ein natürlicher Anschluss, ohne eine starke zeitliche Abfolge zu behaupten.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Im lukanischen Erzählzusammenhang bezeichnet κύριος Jesus mit titularer Bedeutung; »der Herr« bewahrt dieses Gewicht.
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Der Aoristimperativ fordert die Zuhörenden nachdrücklich auf, dem folgenden Ausspruch Aufmerksamkeit zu schenken.
- source_word: τί
  choice: was
  rationale: τί bezeichnet hier den Inhalt dessen, was der Richter sagt.
- source_word: ὁ κριτὴς τῆς ἀδικίας
  choice: der ungerechte Richter
  rationale: Der qualitative Genitiv bedeutet wörtlich »der Richter der Ungerechtigkeit«; »der ungerechte Richter« ist idiomatisches Deutsch und bewahrt die moralische Bewertung.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens wird als anschauliches Präsens beibehalten und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Jesus
  choice: der Herr
  alternative: der Meister
  rationale: »Der Herr« bewahrt die im Lukasevangelium erkennbare titulare und christologische Bedeutung, ohne zusätzliche Lehraussagen einzutragen.
- issue: Qualitativer Genitiv τῆς ἀδικίας
  choice: der ungerechte Richter
  alternative: der Richter der Ungerechtigkeit
  rationale: Die idiomatische deutsche Form gibt die negative moralische Charakterisierung wieder. Die wörtliche Genitivkonstruktion wäre schwerfällig und inhaltlich nicht klarer.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Der knappe Imperativ und das anschauliche Präsens des griechischen Textes bleiben erhalten.
