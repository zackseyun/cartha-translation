  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: das erzählende εἶπαν durch „sagten“, den Fortschritt durch „Da“, das substantivierte Partizip οἱ ἀκούσαντες als diejenigen, die die vorausgehende Aussage gehört hatten, sowie die Frage nach der Möglichkeit, „gerettet“ zu werden. Das Plusquamperfekt „gehört hatten“ ist im Deutschen eine angemessene Wiedergabe der Vorzeitigkeit des Aoristpartizips gegenüber dem Hauptverb.'
  naturalness: „Da sagten die, die es gehört hatten“ ist modernes, verständliches Standarddeutsch. Die Wiederholung von „die“ ist etwas schlicht, aber idiomatisch und nicht störend. Die direkte Frage und die Zeichensetzung sind natürlich.
  terminology: „Gerettet werden“ trifft σωθῆναι im unmittelbaren lukanischen Zusammenhang angemessen und wahrt zugleich die passive, offen formulierte Ausdrucksweise des Griechischen. Es werden keine zusätzlichen theologischen Festlegungen eingetragen.
