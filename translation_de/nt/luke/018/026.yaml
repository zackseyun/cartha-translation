  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: de
  text: 'Da sagten die, die es gehört hatten: »Und wer kann gerettet werden?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: sagten
  rationale: Der Aorist wird im deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben.
- source_word: δὲ
  choice: Da
  rationale: Die Partikel markiert hier den Fortgang der Erzählung und die unmittelbare Reaktion; »Da« gibt dies idiomatisch wieder.
- source_word: οἱ ἀκούσαντες
  choice: die, die es gehört hatten
  rationale: Das substantivierte Aoristpartizip bezeichnet diejenigen, die Jesu vorherige Aussage gehört hatten. Das aus dem Kontext ergänzte »es« und das Plusquamperfekt verdeutlichen das zeitliche Verhältnis auf natürliche Weise.
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den anschließenden, von Bestürzung geprägten Charakter der Frage, ohne zusätzliche Folgerungsbedeutung einzutragen.
- source_word: τίς
  choice: wer
  rationale: Direkte und natürliche Wiedergabe des Fragepronomens.
- source_word: δύναται
  choice: kann
  rationale: Gibt die Bedeutung von Fähigkeit beziehungsweise Möglichkeit knapp und idiomatisch wieder.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Die Passivform bleibt erhalten; im Kontext von Gottes Reich ist die heilsgeschichtliche Bedeutung von »retten« maßgeblich.
theological_decisions:
- issue: Bedeutung von σωθῆναι im Kontext
  choice: gerettet werden
  alternative: befreit werden
  rationale: Der Zusammenhang handelt vom Eingehen in Gottes Reich und damit von Rettung im umfassenden theologischen Sinn. Die Übersetzung fügt jedoch nicht hinzu, wovor oder auf welche genaue Weise gerettet wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die koordinierende Frageform des Griechischen bleibt durch »Und« erhalten.
