reference: Luke 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: de
  text: Auch einigen, die im Vertrauen auf sich selbst davon überzeugt waren, gerecht zu sein, und die Übrigen verachteten, erzählte er dieses Gleichnis:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die anderen gering schätzten«; wörtlich im Sinn von: »die anderen für nichts hielten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: erzählte
  rationale: Da »dieses Gleichnis« das Objekt ist, entspricht »erzählte« natürlichem Deutsch und gibt λέγω im Kontext treffend wieder.
- source_word: δὲ καὶ
  choice: aber auch
  rationale: δέ führt den Bericht mit einem milden Anschluss weiter; καί kennzeichnet das Gleichnis als zusätzliche Lehre. »Aber auch« bewahrt beide Funktionen, ohne einen starken Gegensatz zu behaupten.
- source_word: πρός τινας
  choice: einigen
  rationale: πρός bezeichnet nach einem Verb des Sprechens die angesprochenen Personen; im Deutschen verlangt »erzählen« hier den Dativ.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: die im Vertrauen auf sich selbst davon überzeugt waren
  rationale: Das Perfektpartizip bezeichnet eine gefestigte Zuversicht; »im Vertrauen auf sich selbst« bewahrt ausdrücklich den Gedanken der Selbstbezogenheit, während »davon überzeugt waren« idiomatisch zum folgenden Inhaltssatz überleitet.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: gerecht zu sein
  rationale: »Gerecht« bewahrt den moralisch-religiösen Sinn von δίκαιοι. Die Kritik ergibt sich aus dem Zusammenhang und wird nicht in die Wortwahl hineingetragen.
- source_word: ἐξουθενοῦντας
  choice: verachteten
  rationale: Das Verb bezeichnet, andere geringzuachten oder als nichts anzusehen. »Verachteten« ist knapp, kräftig und in diesem Zusammenhang natürlich.
- source_word: τοὺς λοιπούς
  choice: die Übrigen
  rationale: Die substantivierte Form »die Übrigen« gibt den bestimmten Ausdruck τοὺς λοιπούς eng wieder, ohne ihn ausdrücklich zu »alle anderen« zu erweitern.
- source_word: τὴν παραβολὴν ταύτην
  choice: dieses Gleichnis
  rationale: »Gleichnis« ist die sachlich und gattungsgeschichtlich passende Wiedergabe von παραβολή; »dieses« entspricht dem Demonstrativpronomen.
theological_decisions:
- issue: Wiedergabe von δίκαιοι im Zusammenhang selbstbegründeter Gerechtigkeit
  choice: gerecht
  alternative: im Recht; rechtschaffen
  rationale: Der griechische Text verwendet das theologisch bedeutsame Wort δίκαιοι ohne abwertenden Zusatz. »Gerecht« erhält diesen Wortlaut und lässt die Selbsttäuschung durch den Kontext sichtbar werden.
- issue: Verhältnis von Selbstvertrauen und behaupteter Gerechtigkeit
  choice: im Vertrauen auf sich selbst davon überzeugt waren, gerecht zu sein
  alternative: auf sich selbst vertrauten, weil sie gerecht seien
  rationale: Die gewählte Fassung versteht ὅτι als Inhalt ihrer Überzeugung und bewahrt zugleich ἐφ’ ἑαυτοῖς als Grundlage ihres Vertrauens. Eine kausale Lesart von ὅτι ist sprachlich möglich, im Zusammenhang jedoch weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas gehobene Form »die Übrigen« hält sich eng an den bestimmten griechischen Ausdruck; die Satzstellung folgt natürlichem deutschem Erzählstil, ohne die theologische Spannung erklärend aufzulösen.
