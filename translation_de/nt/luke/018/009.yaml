  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Satzes wieder: die zusätzliche Redehandlung, den angesprochenen Personenkreis, das auf sich selbst gerichtete Vertrauen, den Inhalt der behaupteten Gerechtigkeit, die Verachtung der Übrigen und die Bezeichnung als Gleichnis. Die Satzstellung kann jedoch idiomatischer gestaltet werden, ohne die Zuordnung der Partizipien zu »einigen« zu verändern.'
  naturalness: »Er erzählte aber auch einigen ... dieses Gleichnis« ist zwar verständlich, wirkt im modernen Standarddeutsch aber durch die weit auseinandergezogenen Satzglieder etwas schwerfällig. Die Voranstellung des Dativs mit »Auch einigen ... erzählte er dieses Gleichnis« ist flüssiger. Das bloße »auch« gibt die additive Funktion von καί wieder; das deutsche »aber« ist für das nur schwach verbindende δέ nicht erforderlich.
  terminology: '»gerecht«, »verachteten«, »die Übrigen« und »Gleichnis« sind treffende, registergerechte Wiedergaben. Die Fußnotenalternative sollte orthographisch und syntaktisch klar als Verbgruppe formuliert werden: »die anderen gering schätzten«.'
