id: LUK.18.20
reference: Luke 18:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: de
  text: 'Du kennst die Gebote: Du sollst nicht die Ehe brechen, du sollst nicht morden, du sollst nicht stehlen, du sollst kein falsches Zeugnis ablegen; ehre deinen Vater und deine Mutter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: die Gebote
  rationale: Im Zusammenhang mit den angeführten Weisungen des Dekalogs ist „die Gebote“ die natürliche und intertextuell erkennbare Wiedergabe.
- source_word: οἶδας
  choice: du kennst
  rationale: οἶδα hat hier trotz seiner Perfektform präsentische Bedeutung. Im Deutschen ist „du kennst die Gebote“ idiomatischer als „du weißt die Gebote“.
- source_word: Μὴ μοιχεύσῃς
  choice: Du sollst nicht die Ehe brechen
  rationale: Die Formulierung gibt den spezifischen Sinn von μοιχεύω wieder und bewahrt zugleich den vertrauten Klang des Dekalogs.
- source_word: Μὴ φονεύσῃς
  choice: du sollst nicht morden
  rationale: φονεύω bezeichnet gezielt das Morden und nicht unterschiedslos jedes Töten.
- source_word: Μὴ κλέψῃς
  choice: du sollst nicht stehlen
  rationale: Direkte und natürliche Wiedergabe von κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: du sollst kein falsches Zeugnis ablegen
  rationale: Diese Formulierung erhält den Zeugen- und Gerichtssinn des Verbs und zugleich den Bezug zum Dekalog.
- source_word: Τίμα
  choice: ehre
  rationale: „Ehre“ gibt den ethischen und verbindlichen Sinn von τιμάω prägnant wieder und entspricht dem deutschen biblischen Sprachgebrauch.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: deinen Vater und deine Mutter
  rationale: Das wiederholte Possessivpronomen ist im Deutschen natürlich und bildet die ausdrückliche Nennung beider Elternteile klar ab.
theological_decisions:
- issue: Wiedergabe der Verbote aus dem Dekalog
  choice: Traditionelle deutsche Gebotsform mit „Du sollst nicht …“
  alternative: Moderne direkte Verbote mit „Brich nicht die Ehe; morde nicht …“
  rationale: Die griechischen prohibitivischen Aoristkonjunktive zitieren bekannte Dekaloggebote. Im modernen Standarddeutsch ist „Du sollst nicht …“ weiterhin verständlich, würdig und intertextuell deutlich; die Formulierung bezeichnet Verpflichtung, nicht bloß eine Zukunftsaussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit bewusst erhaltener Dekalog-Resonanz. Die Aufzählung bleibt knapp und feierlich; das abschließende positive Gebot wird durch ein Semikolon abgesetzt.
