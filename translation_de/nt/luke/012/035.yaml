  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: de
  text: Eure Hüften sollen gegürtet sein, und eure Lampen sollen brennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Haltet euch zum Handeln bereit.“ Gemeint ist das Bild, lange Gewänder hochzunehmen und mit einem Gürtel zu befestigen, damit man ungehindert handeln oder aufbrechen kann.'
    reason: Kulturelle Erläuterung des Bildes vom Gürten der Hüften.
lexical_decisions:
- source_word: Ἔστωσαν
  choice: sollen … sein / sollen brennen
  rationale: Der Imperativ der dritten Person wird im Deutschen natürlich mit „sollen“ wiedergegeben. Beim zweiten Satzglied wird das Hilfsverb sinngemäß wiederholt, damit die Formulierung klar und flüssig ist.
- source_word: ὑμῶν
  choice: eure
  rationale: Der Genitiv ist possessiv und bezieht sich auf beide koordinierten Satzglieder.
- source_word: ὀσφύες
  choice: Hüften
  rationale: Das Wort bezeichnet den Hüft- beziehungsweise Lendenbereich. „Hüften“ ist modernes, verständliches Deutsch; „Lenden“ wirkt heute altertümlich oder anatomisch.
- source_word: περιεζωσμέναι
  choice: gegürtet
  rationale: Das Perfektpartizip bezeichnet den fortbestehenden Zustand des Umgürtetseins. „Gegürtet“ bewahrt das konkrete Bild, ohne es bereits als bloße Handlungsbereitschaft auszudeuten.
- source_word: λύχνοι
  choice: Lampen
  rationale: Gemeint sind konkrete Öllampen, nicht Licht im abstrakten Sinn.
- source_word: καιόμενοι
  choice: brennen
  rationale: Das Präsenspartizip beschreibt einen andauernden Zustand. Das deutsche Verb „brennen“ gibt diesen fortlaufenden Sinn natürlich wieder.
theological_decisions:
- issue: Bildhafte Aufforderung zur Bereitschaft
  choice: Das konkrete Bild gegürteter Hüften bleibt im Haupttext erhalten.
  alternative: „Seid bereit zum Aufbruch“ oder „Haltet euch zum Handeln bereit“
  rationale: Der griechische Text nennt nicht nur die abstrakte Bereitschaft, sondern verwendet das kulturell geprägte Bild hochgenommener und mit einem Gürtel befestigter Kleidung. Die Fußnote erklärt dessen Bedeutung, ohne das Bild im Haupttext zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht bildhafte Wendung „Hüften … gegürtet“ ist bewusst beibehalten; die kulturelle Bedeutung wird in der Fußnote verständlich erklärt.
