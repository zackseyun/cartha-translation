id: LUK.12.8
reference: Luke 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: de
  text: 'Ich sage euch aber: Jeder, der sich vor den Menschen zu mir bekennt[a], zu dem wird sich auch der Menschensohn vor den Engeln Gottes bekennen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich vor den Menschen anerkennt“. Das griechische Verb bezeichnet hier ein offenes Bekennen oder Anerkennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Ich sage euch aber
  rationale: Die Wendung leitet eine nachdrückliche Aussage Jesu ein. δέ wird als leicht weiterführendes beziehungsweise kontrastierendes „aber“ wiedergegeben.
- source_word: πᾶς ὃς ἂν
  choice: Jeder, der
  rationale: Die Konstruktion bezeichnet allgemein und ohne Einschränkung jeden Menschen, auf den die folgende Bedingung zutrifft.
- source_word: ὁμολογήσῃ ἐν ἐμοὶ
  choice: sich zu mir bekennt
  rationale: ὁμολογέω bezeichnet hier ein offenes Anerkennen oder Bekennen. Die Verbindung mit ἐν wird im Deutschen idiomatisch durch „sich zu jemandem bekennen“ ausgedrückt, ohne das ungewöhnliche griechische „in mir“ wörtlich nachzubilden.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: „Vor“ wahrt den öffentlichen Charakter der Aussage; ἄνθρωποι bezeichnet hier Menschen allgemein, was das deutsche „Menschen“ präzise und natürlich wiedergibt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die feste Selbstbezeichnung Jesu bleibt als anerkannter Titel erhalten und bewahrt ihre biblisch-theologische Resonanz.
- source_word: ὁμολογήσει ἐν αὐτῷ
  choice: zu dem wird sich … bekennen
  rationale: Die Wiederholung desselben Verbs wird durch „bekennen“ gewahrt. Die deutsche Präpositionalfügung verlangt „zu dem“; zugleich tritt die Gegenseitigkeit des Bekennens klar hervor.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: vor den Engeln Gottes
  rationale: Die knappe Form entspricht dem griechischen Ausdruck und bewahrt die feierliche himmlische Öffentlichkeit der Aussage.
theological_decisions:
- issue: Die wechselseitige Bekenntnisformel mit ἐν und Dativ
  choice: Idiomatypisch „sich zu mir … zu dem … bekennen“
  alternative: Wörtlich „in mir … in ihm bekennen“ oder lexikalisch „mich/ihn anerkennen“
  rationale: Die wörtliche Präpositionskonstruktion wäre im Deutschen unverständlich oder irreführend. „Sich zu jemandem bekennen“ vermittelt den öffentlichen Bezug auf Jesus und die entsprechende Anerkennung durch den Menschensohn, ohne eine zusätzliche dogmatische Deutung einzutragen.
- issue: Bezeichnung ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Menschensohn
  alternative: Sohn des Menschen
  rationale: „Menschensohn“ ist im Deutschen die etablierte biblische Titelbezeichnung und bewahrt sowohl Jesu Selbstbezeichnung als auch ihre weiterführenden Schriftbezüge.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht die wechselseitige Entsprechung des Bekennens gut verständlich; „Menschen“ ist geschlechtsübergreifend und entspricht dem allgemeinen Bezug des griechischen Plurals.
