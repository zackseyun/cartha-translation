reference: Luke 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: de
  text: 'Ich will euch aber zeigen, wen ihr fürchten sollt: Fürchtet den, der, nachdem er getötet hat, die Vollmacht besitzt, in die Gehenna[a] zu werfen. Ja, ich sage euch: Diesen fürchtet!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hölle“. Das griechische Wort lautet Gehenna, ein Ausdruck für das Gericht, dessen Bildsprache im Tal Hinnom verwurzelt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: ich will zeigen
  rationale: Das Futur kündigt Jesu folgende Unterweisung an. „Zeigen“ gibt das Hinweisen klar und ohne zusätzliche Deutung wieder.
- source_word: τίνα φοβηθῆτε
  choice: wen ihr fürchten sollt
  rationale: Die indirekte Frage wird im modernen Deutsch natürlich mit „sollt“ formuliert und bewahrt den auffordernden Ernst.
- source_word: φοβήθητε
  choice: fürchtet
  rationale: Der Imperativ wird wiederholt und verlangt eine ebenso wiederholte, kräftige Wiedergabe. „Fürchten“ bewahrt den Zusammenhang besser als „Ehrfurcht haben“.
- source_word: τὸν
  choice: den
  rationale: Der substantivierte Artikel bezeichnet die betreffende Person knapp und idiomatisch, ohne sie ausdrücklich zu identifizieren.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: nachdem er getötet hat
  rationale: Die temporale Folge des artikulierten Infinitivs wird deutlich wiedergegeben. Das Subjekt bleibt, wie im Zusammenhang, dieselbe Person.
- source_word: ἀποκτεῖναι
  choice: getötet hat
  rationale: „Töten“ ist die direkte und gegenwärtige Entsprechung; „hinrichten“ würde einen engeren rechtlichen Sinn hinzufügen.
- source_word: ἔχοντα ἐξουσίαν
  choice: die Vollmacht besitzt
  rationale: ἐξουσία bezeichnet hier Befugnis beziehungsweise Autorität, nicht lediglich physische Macht. „Vollmacht“ trägt diesen Sinn in würdigem, verständlichem Deutsch.
- source_word: ἐμβαλεῖν εἰς
  choice: in … zu werfen
  rationale: Die Formulierung bewahrt die konkrete, starke Bildsprache des griechischen Verbs ohne das altertümlichere „hineinzustoßen“.
- source_word: γέενναν
  choice: Gehenna
  rationale: Die Transliteration wahrt den spezifischen jüdischen Gerichtsausdruck und vermeidet, ihn im Haupttext vollständig mit späteren Vorstellungen von „Hölle“ gleichzusetzen.
- source_word: ναί
  choice: Ja
  rationale: „Ja“ gibt die nachdrückliche Bekräftigung knapp und natürlich wieder.
- source_word: τοῦτον
  choice: Den
  rationale: Das vorangestellte Demonstrativpronomen bewahrt den Nachdruck des griechischen τοῦτον; eine Wiederholung von „diesen“ wäre im Deutschen weniger natürlich.
theological_decisions:
- issue: Wiedergabe von γέεννα im Gerichtskontext
  choice: Gehenna
  alternative: Hölle
  rationale: Der Haupttext bewahrt den griechischen, in jüdischer Gerichtssprache verankerten Ausdruck. „Hölle“ ist als geläufige funktionale Entsprechung in der Fußnote genannt, wird aber nicht in den Text eingesetzt, damit spätere theologische Vorstellungen nicht unbemerkt den spezifischen Quellbegriff ersetzen.
- issue: Identität dessen, der töten und in die Gehenna werfen kann
  choice: im Text nicht ausdrücklich benannt
  alternative: Gott ausdrücklich nennen
  rationale: Der griechische Text verwendet lediglich den substantivierten Artikel und ein Partizip. Obwohl der Kontext gewöhnlich auf Gott bezogen wird, soll die Übersetzung diese Auslegung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Aufforderung „fürchten“ und der Nachdruck des abschließenden Demonstrativpronomens bleiben erhalten. „Vollmacht“ unterscheidet autorisierte Befugnis von bloßer Kraft.
