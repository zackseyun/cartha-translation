  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: de
  text: Denn das Leben ist mehr als die Nahrung und der Körper mehr als die Kleidung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aufforderung ein, sich nicht zu sorgen, und wahrt den verbindenden Charakter des griechischen Partikels.
- source_word: ψυχή
  choice: Leben
  rationale: Im Zusammenhang mit Essen, Sorge und körperlicher Versorgung bezeichnet ψυχή hier das irdische Leben beziehungsweise die lebende Person, nicht spezifisch eine vom Körper getrennte Seele.
- source_word: πλεῖόν
  choice: mehr als
  rationale: Gibt den Vergleich mit Genitiv schlicht und ohne zusätzliche Deutung als Rang- oder Werturteil wieder.
- source_word: τροφή
  choice: Nahrung
  rationale: Ist ein natürliches, allgemein verständliches deutsches Wort und entspricht dem Bezug auf das, wovon das Leben erhalten wird.
- source_word: σῶμα
  choice: Körper
  rationale: Entspricht der gewöhnlichen Bedeutung und bildet mit Kleidung das konkrete zweite Vergleichspaar.
- source_word: ἔνδυμα
  choice: Kleidung
  rationale: Gibt den allgemeinen Sammelbegriff für das wieder, womit der Körper bekleidet wird.
theological_decisions:
- issue: Bedeutung von ψυχή in der Lehre über Sorge und Versorgung
  choice: „Leben“
  alternative: „Seele“ oder „Person“
  rationale: Die Parallelität von ψυχή und Nahrung sowie Körper und Kleidung spricht für das gegenwärtige menschliche Leben. Die Wiedergabe macht keine weitergehende Aussage über das Verhältnis von Leib und Seele.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten; im zweiten Satzglied wird die Kopula wie im Griechischen ausgelassen, während „mehr als“ zur deutschen Klarheit wiederholt wird.
