id: LUK.12.45
reference: Luke 12:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: de
  text: 'Wenn aber jener Sklave in seinem Herzen[a] sagt: »Mein Herr lässt mit seinem Kommen auf sich warten«, und anfängt, die Diener und Dienerinnen zu schlagen, zu essen und zu trinken und sich zu betrinken,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei sich selbst«.'
    reason: Die Wendung »in seinem Herzen« bezeichnet im Griechischen einen inneren Gedanken.
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Die gebundene und hierarchische Stellung innerhalb des Haushalts ist in diesem Gleichnis wesentlich; »Sklave« gibt sie deutlicher wieder als »Diener«.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in seinem Herzen
  rationale: Die bildhafte griechische Wendung wird transparent bewahrt und bezeichnet einen inneren, nicht ausgesprochenen Gedanken.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: lässt mit seinem Kommen auf sich warten
  rationale: Diese natürliche deutsche Wendung gibt die andauernde Verzögerung der erwarteten Ankunft wieder, ohne einen Grund dafür hinzuzufügen.
- source_word: κύριός μου
  choice: mein Herr
  rationale: »Herr« ist im deutschen Haushaltskontext eine natürliche Bezeichnung für den Vorgesetzten des Sklaven und bewahrt zugleich die im Gleichnis angelegte sprachliche Spannung.
- source_word: ἄρξηται τύπτειν
  choice: anfängt … zu schlagen
  rationale: Gibt den Beginn fortgesetzten missbräuchlichen Handelns klar und unmittelbar wieder.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: die Diener und Dienerinnen
  rationale: Die Wiedergabe erhält die ausdrücklich männlich-weibliche Paarung und unterscheidet diese Hausangehörigen vom zuvor genannten δοῦλος, ohne das altertümliche Paar »Knechte und Mägde« zu verwenden.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: zu essen und zu trinken und sich zu betrinken
  rationale: Die drei koordinierten Handlungen und ihre Steigerung bis zur Trunkenheit bleiben erhalten.
theological_decisions:
- issue: κύριος bezeichnet innerhalb des Gleichnisses zunächst den menschlichen Hausherrn, kann aber im weiteren Gleichnishorizont auf den Herrn verweisen.
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« passt zur sozialen Beziehung in der erzählten Welt und beseitigt nicht die mögliche übertragene Bedeutung des Gleichnisses.
- issue: Sozialer Status von δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Der Kontext betont Unterordnung, anvertraute Verantwortung und Rechenschaft; »Sklave« bildet die unfreie Stellung genauer ab.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Formulierung »lässt mit seinem Kommen auf sich warten« vermeidet steife Wörtlichkeit; »Diener und Dienerinnen« erhält die Geschlechterpaarung in heutiger Sprache.
