  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: de
  text: Denn von jetzt an werden fünf in einem Haus[a] entzweit sein, drei gegen zwei und zwei gegen drei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer Hausgemeinschaft“ bzw. „in einem Haushalt“. Das griechische Wort kann sowohl das Haus als auch die darin lebende Familie oder Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: werden … sein
  rationale: Das Futur von εἰμί wird im Deutschen mit „werden … sein“ wiedergegeben; zusammen mit dem prädikativen Partizip beschreibt es den künftigen Zustand der fünf Personen.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende bzw. erläuternde Verbindung zur vorausgehenden Aussage über Entzweiung.
- source_word: ἀπὸ τοῦ νῦν
  choice: von jetzt an
  rationale: Natürliche moderne Wiedergabe der zeitlichen Wendung mit vorwärtsgerichtetem Sinn.
- source_word: πέντε
  choice: fünf
  rationale: Die Zahl bezeichnet hier, wie der folgende Vers erkennen lässt, fünf Personen innerhalb des Hauses bzw. Haushalts.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: in einem Haus
  rationale: „Haus“ wahrt die konkrete Grundbedeutung von οἶκος; der Kontext schließt zugleich die Hausgemeinschaft bzw. Familie ein. Diese Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: διαμεμερισμένοι
  choice: entzweit
  rationale: Das Perfektpassiv-Partizip bezeichnet einen durch Trennung entstandenen und fortbestehenden Zustand. „Entzweit“ gibt im Kontext den zwischenmenschlichen Konflikt natürlich und prägnant wieder.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: drei gegen zwei
  rationale: ἐπί mit Dativ drückt hier Gegnerschaft aus; „gegen“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: und zwei gegen drei
  rationale: Die parallele Formulierung erhält die symmetrische Darstellung der gegeneinanderstehenden Gruppen.
theological_decisions:
- issue: Konkrete oder soziale Wiedergabe von οἶκος im Zusammenhang familiärer Entzweiung
  choice: Haus
  alternative: Hausgemeinschaft oder Haushalt
  rationale: Der folgende Vers zeigt, dass eine Familie bzw. Hausgemeinschaft gemeint ist. Dennoch bleibt „Haus“ näher an der griechischen Ausdrucksform und lässt deren konkrete wie soziale Bedeutungsdimension offen; die Alternative wird in einer Fußnote angegeben.
- issue: Zustand oder Vorgang bei διαμεμερισμένοι
  choice: entzweit sein
  alternative: sich entzweien oder getrennt werden
  rationale: Die Perfektform betont den eingetretenen, fortbestehenden Zustand und nicht lediglich den Vorgang. Daher wird die Spannung nicht als bloß zukünftiges Ereignis paraphrasiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entzweit“ ist gegenüber dem abstrakteren „geteilt“ im familiären Konflikt idiomatischer, ohne den griechischen Sinn zu überdeuten. Die Satzstruktur bewahrt die knappe Parallelität des Ausgangstextes.
