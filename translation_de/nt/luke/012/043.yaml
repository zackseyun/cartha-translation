  naturalness: Der revidierte Satz ist modernes, würdiges Standarddeutsch. Die Verbindung »jemanden so handeln finden wird« ist verständlich und bewahrt die knappe Rückverweisung von ποιοῦντα οὕτως.
  terminology: '»Diener« ist im Gleichniskontext vertretbar. »Herr« gibt κύριος natürlich wieder und wahrt die erzählerische wie die mögliche weitergehende Resonanz. Die Fußnote wird sachlicher formuliert: Die mögliche Anwendung ist keine lexikalische Bedeutung des Wortes selbst.'
