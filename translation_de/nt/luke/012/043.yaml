base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: de
  text: Selig ist jener Diener, den sein Herr[a], wenn er kommt, so handeln finden wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hausherr«. Das griechische Wort bezeichnet im Gleichnis den Herrn über den Diener; die Wiedergabe »Herr« lässt zugleich eine weitergehende Anwendung des Gleichnisses offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich
  rationale: Gibt die Seligpreisungsformel in natürlichem, modernem Deutsch wieder und bezeichnet den von Gott begünstigten Zustand, nicht nur ein vorübergehendes Gefühl.
- source_word: δοῦλος
  choice: Diener
  rationale: Passt zur Rolle im Gleichnis vom Haushalt und wahrt das Abhängigkeits- und Dienstverhältnis, ohne hier unnötig die rechtliche Kategorie »Sklave« in den Vordergrund zu rücken.
- source_word: ἐκεῖνος
  choice: jener
  rationale: Bewahrt die hervorhebende und rückverweisende Kraft des Demonstrativpronomens.
- source_word: κύριος
  choice: Herr
  rationale: »Herr« ist im Deutschen sowohl für den Hausherrn des Gleichnisses als auch für die mögliche weitergehende Beziehung auf Jesus geeignet und bewahrt dadurch die im Griechischen vorhandene Mehrdeutigkeit.
- source_word: ἐλθὼν
  choice: bei seiner Rückkehr
  rationale: Gibt das temporale Verhältnis des Aoristpartizips idiomatisch wieder; im Kontext geht es um die Wiederkunft des abwesenden Herrn.
- source_word: εὑρήσει
  choice: findet
  rationale: Das deutsche Präsens in der Konstruktion mit »den ... bei seiner Rückkehr ... findet« gibt das zukünftige Geschehen natürlich wieder.
- source_word: ποιοῦντα οὕτως
  choice: so handeln
  rationale: Verweist knapp und idiomatisch auf das zuvor beschriebene pflichtgetreue Verhalten zurück.
theological_decisions:
- issue: Möglicher christologischer Anklang von κύριος im Gleichnis über die Rückkehr eines Herrn
  choice: Herr
  alternative: Hausherr
  rationale: »Herr« bezeichnet natürlich den Vorgesetzten des Dieners und lässt zugleich die mögliche eschatologische Beziehung auf Jesus als den Herrn bestehen, ohne sie im Haupttext ausdrücklich festzulegen.
- issue: Bedeutungsnuance von μακάριος
  choice: Glücklich
  alternative: Selig
  rationale: »Glücklich« ist heutigen Lesern unmittelbar verständlich und kann in diesem formelhaften Satz den begünstigten Zustand ausdrücken; »selig« bewahrt den traditionellen religiösen Klang und wird deshalb als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzgestalt des griechischen Textes bleibt erhalten; »bei seiner Rückkehr« vermeidet eine schwerfällige Partizipialkonstruktion.
