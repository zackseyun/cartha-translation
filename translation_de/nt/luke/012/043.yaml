  - severity: low
    issue: Fußnote beschreibt Jesus als mögliche Wortbedeutung
    rationale: κύριος bedeutet nicht aufgrund seiner Lexik »Herr Jesus«. Die christologische bzw. eschatologische Resonanz entsteht aus der Anwendung des Gleichnisses; die Fußnote sollte diese Unterscheidung wahren.
