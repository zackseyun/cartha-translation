  naturalness: Der Relativsatz ist klar und idiomatisch. Die Schlussfrage des Entwurfs ist allerdings unvollständig und im heutigen Standarddeutsch nicht gut lesbar. „Wie viel mehr wird er euch kleiden“ stellt die rhetorische Folgerung klar und bewahrt den Sinn. Außerdem soll die lexikalische Fußnote zu χόρτος an „Gras“ statt an „Feld“ stehen.
  terminology: „Kleingläubigen“ ist als direkte, nicht übermäßig verschärfte Anrede für ὀλιγόπιστοι passend. „Ofen“ ist gegenüber „Feuerofen“ oder „Furnace“-artigen Wiedergaben sachgerecht; die kulturelle Erläuterung als Backofen ist hilfreich. Die Alternativen „Kraut“ und „Pflanzenwuchs“ sind als lexikalische Möglichkeiten vertretbar.
