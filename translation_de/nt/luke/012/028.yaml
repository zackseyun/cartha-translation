source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: de
  text: Wenn aber Gott das Gras[a] auf dem Feld, das heute da ist und morgen in den Ofen geworfen wird[b], so kleidet, wie viel mehr wird er euch kleiden, ihr Kleingläubigen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kraut“ beziehungsweise „den Pflanzenwuchs“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Backofen; getrocknetes Gras und anderer Feldbewuchs konnten als Brennstoff verwendet werden.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: Gras
  rationale: χόρτος bezeichnet Gras, Kraut oder allgemein niedrigen Pflanzenwuchs. „Gras“ ist hier natürlich und passt zum vergänglichen Feldbewuchs, der getrocknet als Brennstoff dienen konnte.
- source_word: ἐν ἀγρῷ
  choice: auf dem Feld
  rationale: Die Wendung bezeichnet den gewöhnlichen Standort des Grases im Freien. „Auf dem Feld“ ist im Deutschen idiomatisch und lässt den generischen Sinn bestehen.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: das heute da ist und morgen ... geworfen wird
  rationale: Die knappe griechische Partizipialkonstruktion wird für klares Deutsch entfaltet. „Da ist“ gibt das bloße gegenwärtige Vorhandensein wieder, ohne ausdrücklich „lebt“ einzutragen.
- source_word: κλίβανον
  choice: Ofen
  rationale: κλίβανος bezeichnet einen Backofen, häufig einen einfachen Lehmofen. „Ofen“ ist die sachlich passende moderne Wiedergabe; „Feuerofen“ wäre zu stark.
- source_word: ἀμφιέζει
  choice: kleidet
  rationale: Das Verb bedeutet „bekleiden“. „Kleidet“ bewahrt das Bild und den Bezug zur Sorge um Kleidung im Kontext.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr
  rationale: Die feste Vergleichsformel führt ein Schlussargument vom Geringeren zum Größeren ein und wird im Deutschen unmittelbar verständlich wiedergegeben.
- source_word: ὀλιγόπιστοι
  choice: ihr Kleingläubigen
  rationale: Das substantivierte Adjektiv ist eine direkte Anrede und ein milder Tadel wegen unzureichenden Vertrauens. „Ihr Kleingläubigen“ ist knapp, würdig und im biblischen Sprachgebrauch verständlich.
- source_word: εἰ δὲ
  choice: Wenn ... aber
  rationale: δέ setzt den Gedankengang mit einer leichten argumentativen Gegenüberstellung fort. Die deutsche Nachstellung von „aber“ klingt natürlich.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Das ausdrücklich genannte Subjekt wird ohne Erweiterung direkt wiedergegeben.
- source_word: οὕτως
  choice: so
  rationale: „So“ bezeichnet knapp die Art beziehungsweise das Ausmaß von Gottes Bekleiden und wahrt die Verbindung zum vorherigen Bild.
theological_decisions:
- issue: Aussageform des Schlusses bei πόσῳ μᾶλλον ὑμᾶς
  choice: 'Die im Griechischen elliptische Aussage bleibt ohne ergänztes Futurverb: „wie viel mehr euch“'
  alternative: „wie viel mehr wird er euch kleiden“
  rationale: Im Ausgangstext fehlt im Folgesatz ein ausdrückliches Verb; „kleiden“ ist aus dem vorherigen Satz mitzudenken. Die deutsche Ellipse ist verständlich und bewahrt die formale Offenheit, statt Tempus oder Modalität ausdrücklich festzulegen.
- issue: Kraft der Anrede ὀλιγόπιστοι
  choice: 'Direkter, aber nicht verschärfter Tadel: „ihr Kleingläubigen“'
  alternative: „ihr, die ihr wenig Glauben habt“ oder eine schärfere Verurteilung des Unglaubens
  rationale: Die Anrede beanstandet mangelndes Vertrauen auf Gottes Fürsorge, ohne eine technische Aussage über rettenden Glauben, Glaubensverlust oder Abfall zu machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Bildsprache des Bekleidens und die knappe Steigerung vom Gras zu den Angeredeten bleiben erhalten. „Kleingläubige“ ist leicht traditionell geprägt, gibt die direkte griechische Anrede jedoch prägnant wieder.
