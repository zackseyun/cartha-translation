  terminology: „Herr“ und „Sklave“ geben die parabolische Sozialbeziehung angemessen wieder. „Untreuen“ passt zum unmittelbaren Kontext, während die Fußnote „Ungläubigen“ die mögliche Bedeutung von ἀπίστων sachgerecht offenhält. Die harte Gewaltbildsprache wird nicht unnötig abgeschwächt.
