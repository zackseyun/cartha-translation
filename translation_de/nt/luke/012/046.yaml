  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: de
  text: Der Herr jenes Sklaven wird an einem Tag kommen, an dem er ihn nicht erwartet, und zu einer Stunde, die er nicht kennt; er wird ihn entzwei hauen[a] und ihm seinen Platz bei den Untreuen[b] zuweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird ihn in zwei Teile hauen«; manche verstehen den Ausdruck übertragen als: »wird ihn schwer bestrafen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei den Ungläubigen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Im Ausdruck »der Herr jenes Sklaven« bezeichnet das Wort den Hausherrn beziehungsweise Eigentümer innerhalb des Gleichnisses. »Herr« bildet die soziale Beziehung natürlich ab, ohne den Ausdruck ausdrücklich zu einem christologischen Titel zu machen.
- source_word: δοῦλος
  choice: Sklave
  rationale: Die im Kontext vorausgesetzte Abhängigkeit und Verfügungsgewalt wird durch »Sklave« genauer wiedergegeben als durch das mildere »Diener«.
- source_word: ἥξει
  choice: wird kommen
  rationale: Das Futur von ἥκω bezeichnet hier das Eintreffen des Herrn; »wird kommen« ist im Deutschen natürlich und wahrt die Warnwirkung.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: an einem Tag, an dem dieser ihn nicht erwartet
  rationale: προσδοκάω bedeutet »erwarten«. Das im Griechischen unausgesprochene Objekt wird aus dem Kontext als der Herr verstanden; »dieser« stellt eindeutig den Sklaven als Subjekt heraus.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: zu einer Stunde, die er nicht kennt
  rationale: Die Wiedergabe mit »kennt« bewahrt den Unterschied zwischen fehlender Erwartung im ersten und fehlender Kenntnis im zweiten Satzglied.
- source_word: διχοτομήσει
  choice: wird ihn entzweihauen
  rationale: Das Verb bezeichnet seinem Wortlaut nach das Zerteilen beziehungsweise Entzweihauen. Die drastische Bildsprache bleibt erhalten; eine idiomatische Deutung als schwere Bestrafung wird in der Fußnote genannt.
- source_word: τὸ μέρος αὐτοῦ
  choice: seinen Platz
  rationale: μέρος kann »Teil«, »Anteil« oder »Los« bedeuten. In Verbindung mit τίθημι und einer Personengruppe gibt »seinen Platz zuweisen« die Bestimmung seines Loses in natürlichem Deutsch wieder.
- source_word: ἀπίστων
  choice: Untreuen
  rationale: Im unmittelbaren Zusammenhang geht es um einen Sklaven, der sich als untreu erweist. Da ἄπιστος auch »ungläubig« bedeuten kann, bleibt diese Möglichkeit in einer Fußnote sichtbar.
- source_word: θήσει
  choice: zuweisen
  rationale: τίθημι bedeutet hier, jemandem einen bestimmten Platz oder ein bestimmtes Los innerhalb einer Gruppe zu geben. »Zuweisen« bringt den urteilenden Charakter der Handlung zum Ausdruck.
theological_decisions:
- issue: Ob die Strafandrohung wörtlich-bildhaft oder als idiomatische Bezeichnung einer schweren Bestrafung wiederzugeben ist
  choice: Die drastische Bildsprache »wird ihn entzweihauen« bleibt im Haupttext erhalten.
  alternative: »wird ihn schwer bestrafen«
  rationale: Der griechische Ausdruck benennt zunächst ein Entzweihauen. Eine Abschwächung im Haupttext würde die Schärfe der Warnung mindern; die mögliche idiomatische Deutung wird deshalb in der Fußnote dokumentiert.
- issue: Ob ἀπίστων als »Untreue« oder als »Ungläubige« wiederzugeben ist
  choice: Im Haupttext steht »Untreuen«.
  alternative: »Ungläubigen«
  rationale: Die Treue beziehungsweise Untreue des Sklaven bestimmt den unmittelbaren Erzählzusammenhang. Zugleich kann das Wort in einem Gerichtskontext mangelnden Glauben bezeichnen; die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sklave« wahrt die historische Härte der sozialen Beziehung; »entzweihauen« erhält die auffällige und erschreckende Bildsprache des griechischen Textes. Die Satzstruktur bleibt gut lesbar, ohne die parallelen Zeitangaben einzuebnen.
