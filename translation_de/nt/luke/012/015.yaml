source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: de
  text: 'Dann sagte er zu ihnen: „Seht euch vor und hütet euch vor jeder Art von Habgier[a]; denn das Leben eines Menschen besteht nicht darin, dass er Überfluss an Besitz hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor aller Begehrlichkeit“. Das griechische Wort kann Habgier, Begehrlichkeit oder das unersättliche Streben nach mehr bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε καὶ φυλάσσεσθε
  choice: Seht euch vor und hütet euch
  rationale: Die beiden Imperative werden als nachdrückliche, idiomatische Doppelwarnung wiedergegeben; „hütet euch“ bewahrt die reflexive Schutzkomponente von φυλάσσεσθε.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: vor jeder Art von Habgier
  rationale: πλεονεξία bezeichnet das Verlangen, immer mehr haben zu wollen; „Habgier“ ist im heutigen Deutsch klar und πάσης wird durch „jeder Art von“ umfassend wiedergegeben.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Warnung ein; „denn“ verbindet die beiden Aussagen in würdigem, natürlichem Deutsch.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: selbst wenn jemand Überfluss hat, besteht sein Leben nicht
  rationale: Die Formulierung macht den Zusammenhang zwischen dem Überfluss einer Person und der verneinten Grundlage ihres Lebens verständlich, ohne Leben mit bloßem Besitz gleichzusetzen.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: aus seinem Besitz
  rationale: Das substantivierte Partizip bezeichnet das, was jemandem gehört. „Besitz“ ist knapp, natürlich und wahrt mit „aus“ die Herkunfts- beziehungsweise Grundlagebeziehung von ἐκ.
theological_decisions:
- issue: Reichweite von πλεονεξία
  choice: jeder Art von Habgier
  alternative: aller Begehrlichkeit
  rationale: Die Warnung betrifft das umfassende Streben nach Mehr und wird nicht auf das Begehren fremden Eigentums oder auf eine besondere rechtliche Kategorie verengt.
- issue: Verhältnis von Leben und Besitz
  choice: selbst wenn jemand Überfluss hat, besteht sein Leben nicht aus seinem Besitz
  alternative: das Leben eines Menschen besteht nicht in der Fülle seiner Güter
  rationale: Die gewählte Fassung bewahrt die Spannung, dass materieller Überfluss vorhanden sein kann, aber weder Wesen noch tragenden Grund des Lebens ausmacht; sie deutet „Leben“ nicht zusätzlich als ausschließlich ewiges oder körperliches Leben.
- issue: Generische Personenbezeichnung
  choice: jemand … sein Leben … seinem Besitz
  alternative: das Leben eines Menschen … dessen Besitz
  rationale: Das griechische indefinite τινί und die maskulinen Pronomen sind generisch. Die deutsche Konstruktion ist natürlich und bezieht die Aussage allgemein auf jeden Menschen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Mahnklang. Die zwei Warnimperative bleiben erhalten; unnötig kirchliche oder veraltete Wörter werden vermieden.
