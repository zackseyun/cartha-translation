  source_fidelity: 'Die Doppelwarnung und die umfassende Reichweite von πάσης πλεονεξίας sind zutreffend wiedergegeben. Im Schlusssatz verschiebt „besteht sein Leben nicht aus seinem Besitz“ jedoch den Bezug: Der griechische Text verneint, dass das Leben in der Tatsache besteht, dass jemand Überfluss an seinen Gütern hat, nicht dass Leben allgemein aus Besitz bestehe.'
  naturalness: „Seht euch vor und hütet euch“ sowie „jede Art von Habgier“ sind idiomatisches modernes Standarddeutsch mit angemessenem Mahncharakter. „Überfluss an Besitz hat“ ist verständlich und bildet den griechischen Zusammenhang genauer ab als die vorliegende Schlussformulierung.
  terminology: „Habgier“ ist eine passende, nicht unnötig konfessionell gefärbte Wiedergabe von πλεονεξία. „Begehrlichkeit“ bleibt als lexikalische Alternative in der Fußnote sinnvoll. „Güter“ beziehungsweise „Besitz“ kann ὑπάρχοντα wiedergeben; hier ist „Besitz“ in der Verbindung „Überfluss an Besitz“ ausreichend klar.
  issues:
