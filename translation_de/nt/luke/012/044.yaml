review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Aussage im Wesentlichen zutreffend wieder: ἀληθῶς ist eine emphatische Bekräftigung, καταστήσει bezeichnet die künftige Einsetzung, und ἐπί mit Dativ die Zuständigkeit über den gesamten Besitz. Die Formulierung „alles, was er besitzt“ kann im Deutschen jedoch wegen der zwei männlichen Personen unnötig den Eindruck erwecken, der eingesetzte Knecht besitze das Anvertraute. Im Griechischen bezieht sich αὐτοῦ auf den Hausherrn.'
  naturalness: „Wahrlich“ ist verständlich, wirkt im modernen Standarddeutsch aber deutlich archaisierend. „Wahrlich, ich sage euch“ kann als bewusst gehobene Bibelsprache vertreten werden. Eine kleine Umstellung zu „über seinen gesamten Besitz einsetzen“ ist idiomatischer und vermeidet die Bezugsunschärfe.
  terminology: „Einsetzen“ trifft καταστήσει im Sinn einer Beauftragung bzw. Einsetzung in eine Zuständigkeit gut. „Seinen gesamten Besitz“ gibt πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ angemessen umfassend wieder, ohne eine bestimmte Besitzart festzulegen. Die maskuline Einzelfigur („ihn“) ist entsprechend dem griechischen Gleichniskontext beizubehalten.
  issues:
  - severity: low
    issue: Mögliche Bezugsunschärfe bei „alles, was er besitzt“
    rationale: Das Relativpronomen kann im Deutschen leicht auf „ihn“ statt auf den Hausherrn bezogen werden. Der griechische Genitiv αὐτοῦ bezeichnet hier den Hausherrn, dessen Besitz dem Knecht anvertraut wird.
  - severity: low
    issue: Stellung der Präpositionalgruppe
    rationale: „Ihn über alles einsetzen, was er besitzt“ ist verständlich, aber „ihn über seinen gesamten Besitz einsetzen“ ist flüssiger und präziser.
