- from: 'Wahrlich, ich sage euch: Er wird ihn über alles einsetzen, was er besitzt.[a]'
  to: 'Wahrlich, ich sage euch: Er wird ihn über seinen gesamten Besitz einsetzen.[a]'
  rationale: Die Revision bewahrt die feierliche Bekräftigung und die maskuline Einzelfigur des griechischen Textes. Sie ersetzt die potenziell mehrdeutige Relativkonstruktion durch „seinen gesamten Besitz“, das eindeutig den Besitz des Hausherrn als Bereich der anvertrauten Verantwortung bezeichnet. Die Fußnote bietet weiterhin nahe lexikalische Alternativen zu τοῖς ὑπάρχουσιν αὐτοῦ.
