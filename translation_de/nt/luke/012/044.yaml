base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: de
  text: 'Wahrlich, ich sage euch: Er wird ihn über seinen gesamten Besitz einsetzen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alles, was ihm gehört“; „über sein gesamtes Eigentum“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Wahrlich
  rationale: Das Adverb bekräftigt feierlich die Wahrheit der folgenden Aussage. „Wahrlich“ bewahrt diese nachdrückliche, für Jesu Rede charakteristische Formel und bleibt im biblischen Kontext gut verständlich.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte Wiedergabe erhält sowohl die Anrede im Plural als auch den autoritativen Charakter der Aussage.
- source_word: ὅτι
  choice: ':'
  rationale: Der Doppelpunkt leitet im natürlichen Deutschen den Inhalt der feierlichen Aussage ein; ein ausdrückliches „dass“ ist syntaktisch nicht erforderlich.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: über alles, was er besitzt
  rationale: ἐπί mit Dativ bezeichnet hier den Bereich anvertrauter Autorität. Die substantivierte Partizipialwendung umfasst den gesamten Besitz, ohne ihn auf eine bestimmte Art von Eigentum einzugrenzen.
- source_word: καταστήσει
  choice: wird ... einsetzen
  rationale: Das Futur von καθίστημι bezeichnet hier die Einsetzung in eine verantwortliche Stellung. „Einsetzen über“ ist präzise, würdig und im Deutschen idiomatisch.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf den zuvor genannten Verwalter beziehungsweise Knecht der Gleichniserzählung und wird entsprechend beibehalten.
theological_decisions:
- issue: Maskulines Singularpronomen im Gleichniskontext
  choice: „ihn“ beibehalten
  alternative: geschlechtsneutrale Wiedergabe wie „diese Person“
  rationale: Der griechische Text bezeichnet die männliche Figur des Gleichnisses im Singular. Die Übersetzung gibt diese Erzählgestalt wieder, ohne daraus eine Aussage über eine Beschränkung der Anwendung auf Männer abzuleiten.
- issue: Umfang des anvertrauten Besitzes
  choice: „alles, was er besitzt“
  alternative: „seinen ganzen Besitz“ oder „sein gesamtes Eigentum“
  rationale: Die breite Formulierung bewahrt den umfassenden Sinn von πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ und vermeidet eine unnötige Einengung auf rechtliches Eigentum oder bestimmte Sachgüter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wahrlich“ ist bewusst leicht gehoben, da es die feierliche Bekräftigung von ἀληθῶς trägt; der übrige Satzbau bleibt klar und gegenwärtig.
