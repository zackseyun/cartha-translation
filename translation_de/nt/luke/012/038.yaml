  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: de
  text: Und selbst wenn er in der zweiten Nachtwache oder selbst wenn er in der dritten kommt und sie so antrifft, sind jene Diener glücklich zu preisen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: in der zweiten oder dritten Wache der Nacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „glücklich zu preisen sind jene“. Gemeint sind die im unmittelbaren Zusammenhang genannten Diener.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: selbst wenn ... oder ...
  rationale: Die wiederholte Verbindung bezeichnet eine einräumende, unbestimmte Bedingung. Im Deutschen gibt „selbst wenn … oder …“ den Nachdruck natürlich wieder; „erst“ verdeutlicht bei den Nachtwachen idiomatisch das späte Kommen, ohne die Bedingung zu verändern.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: in der zweiten ... in der dritten Nachtwache
  rationale: φυλακή bezeichnet hier einen zeitlichen Abschnitt der Nacht. „Nachtwache“ ist im Deutschen eindeutig und vermeidet die mögliche Deutung von „Wache“ als Person oder Wachposten.
- source_word: ἔλθῃ
  choice: kommt
  rationale: Der Aorist Konjunktiv steht in einer unbestimmten Bedingung mit zukünftigem Bezug; das deutsche Präsens ist dafür natürlich und genau.
- source_word: εὕρῃ οὕτως
  choice: sie so antrifft
  rationale: οὕτως verweist auf den im vorigen Vers beschriebenen wachsamen Zustand. Das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang aufgenommen.
- source_word: μακάριοί
  choice: glücklich zu preisen
  rationale: Die Wendung bezeichnet nicht bloß ein subjektives Glücksgefühl, sondern erklärt die Betreffenden für begünstigt und beneidenswert. „Glücklich zu preisen“ bewahrt diesen Ausspruchscharakter in natürlichem Deutsch.
- source_word: ἐκεῖνοι
  choice: diese Diener
  rationale: Wörtlich steht „jene/diese“. Der Bezug auf die Diener des Herrn aus dem unmittelbaren Kontext wird zur Klarheit ausdrücklich genannt; die Fußnote macht die Ergänzung kenntlich.
theological_decisions:
- issue: Explizite Nennung des Bezugsworts zu ἐκεῖνοι
  choice: diese Diener
  alternative: jene / diese
  rationale: Das Griechische enthält nur ein Demonstrativpronomen. Sein Bezug auf die zuvor genannten Diener ist klar, doch die Ergänzung „Diener“ ist kontextuell und nicht ausdrücklich Bestandteil dieses Verses; deshalb wird sie transparent ausgewiesen.
- issue: Wiedergabe von μακάριοι
  choice: glücklich zu preisen
  alternative: selig / glücklich
  rationale: Die Formulierung bewahrt die objektive Seligpreisung, ohne den Ausdruck auf ein Gefühl zu reduzieren oder eine konfessionell geprägte Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachtwache“ macht den antiken Zeitabschnitt verständlich; „glücklich zu preisen“ gibt den Seligpreisungscharakter wieder. Sämtliche Fußnotenmarker stehen im Haupttext.
