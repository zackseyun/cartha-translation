  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: de
  text: Wer mich aber vor den Menschen verleugnet, wird vor den Engeln Gottes verleugnet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht anerkannt werden“. Das zweite griechische Verb ist mit „verleugnen“ verwandt; die Übersetzung bewahrt die Entsprechung „verleugnet … verleugnet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: Wer mich aber verleugnet
  rationale: Der substantivierte Aoristpartizip bezeichnet in diesem allgemeinen Ausspruch denjenigen, der Jesus verleugnet. Die deutsche Wer-Konstruktion ist natürlich und bewahrt zusammen mit dem Passiv im Hauptsatz die verbale Entsprechung.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: „Vor“ gibt die öffentliche Gegenwart knapp und idiomatisch wieder. „Menschen“ bezeichnet hier geschlechtsübergreifend menschliche Personen im Gegensatz zu den Engeln Gottes.
- source_word: ἀπαρνηθήσεται
  choice: wird … verleugnet werden
  rationale: Das Futur Passiv bleibt erhalten, ohne einen im Griechischen nicht genannten Handelnden einzusetzen. „Verleugnet“ wahrt zudem die Wortbeziehung zum ersten Verb; das Präfix kann eine stärkere Nuance tragen.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: vor den Engeln Gottes
  rationale: Die Formulierung bildet die griechische Genitivverbindung transparent und in würdigem, natürlichem Deutsch ab.
theological_decisions:
- issue: Nicht genannter Handelnder beim Passiv „wird verleugnet werden“
  choice: Das Passiv ohne ausdrücklichen Urheber beibehalten.
  alternative: „Den wird der Menschensohn verleugnen“ oder „den wird Gott verleugnen“.
  rationale: Der griechische Satz nennt den Handelnden nicht. Der Zusammenhang kann eine Deutung nahelegen, doch die Übersetzung soll die Offenheit des Verses nicht auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlich-knapper Satzstruktur. Die Wiederholung von „verleugnen“ ist bewusst beibehalten, ebenso das unpersönliche Passiv.
