  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: de
  text: 'Ich sage dir: du wirst von dort ganz gewiss nicht herauskommen, bis du auch noch den letzten Lepton bezahlt hast.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω σοι
  choice: Ich sage dir
  rationale: Die geläufige deutsche Wendung bewahrt die direkte Anrede und die Aussageform des griechischen Präsens.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: du wirst ganz gewiss nicht herauskommen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung mit Zukunftsbezug; „ganz gewiss nicht“ gibt diese Verstärkung natürlich wieder.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Das Adverb bezeichnet den Ausgangspunkt und bedeutet hier „von dort“ beziehungsweise „aus jenem Ort“.
- source_word: ἕως
  choice: bis
  rationale: Die Konjunktion markiert den zeitlichen Endpunkt des verneinten Geschehens.
- source_word: καὶ τὸ ἔσχατον
  choice: auch die letzte
  rationale: καί hebt hier die restlose Vollständigkeit der Zahlung hervor; „auch die letzte“ bewahrt diese additive Betonung.
- source_word: λεπτόν
  choice: Leptonmünze
  rationale: Die Wiedergabe erhält die historische Bezeichnung der sehr kleinen Münze, während „-münze“ heutigen Lesern unmittelbar erkennen lässt, worum es sich handelt.
- source_word: ἀποδῷς
  choice: bezahlt hast
  rationale: Der Aorist Konjunktiv nach ἕως bezeichnet hier die vollständig geleistete Zahlung; das deutsche Perfekt bringt den Abschluss passend zum Schuld- und Rechtsbild zum Ausdruck.
theological_decisions:
- issue: Bedeutung des Schuldgefängnis-Bildes
  choice: Das Bild von Haft bis zur vollständigen Bezahlung bleibt ohne ausdrückliche Deutung stehen.
  alternative: Es ausdrücklich als irdische Rechtsfolge, göttliches Gericht oder Läuterungsstrafe deuten.
  rationale: Der Vers selbst bestimmt den Bezug des Bildes nicht. Eine nicht ausdeutende Übersetzung bewahrt die echte theologische Spannung und trägt keine spätere Lehrentscheidung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ganz gewiss nicht“ vermittelt die emphatische Verneinung ohne altertümliche Formulierung; „Leptonmünze“ verbindet historische Genauigkeit mit unmittelbarer Verständlichkeit.
