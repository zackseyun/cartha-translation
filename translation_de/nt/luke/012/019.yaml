id: LUK.12.19
reference: Luke 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: de
  text: 'Und ich werde zu meiner Seele[a] sagen: ›Seele, du hast viele Güter für viele Jahre eingelagert. Ruh dich aus, iss, trink, sei fröhlich!‹'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu mir selbst“. Das griechische Wort ψυχή kann je nach Zusammenhang auch das eigene Ich oder das Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: ich werde sagen
  rationale: Das Futur von λέγω wird direkt und im Deutschen natürlich wiedergegeben.
- source_word: τῇ ψυχῇ μου / Ψυχή
  choice: zu meiner Seele / Seele
  rationale: Die wörtliche Wiedergabe bewahrt die auffällige Selbstanrede und die Bedeutungsweite von ψυχή; im Kontext ist das eigene Ich bzw. Leben gemeint, ohne dass hier zwingend eine technische Anthropologie vorausgesetzt wird.
- source_word: πολλὰ ἀγαθὰ
  choice: viele Güter
  rationale: Im Kontext bezeichnet ἀγαθά die angesammelten materiellen Vorräte. „Güter“ ist knapp, würdig und sachlich passend.
- source_word: κείμενα
  choice: eingelagert
  rationale: Das Partizip bezeichnet hier bereitliegende beziehungsweise aufbewahrte Vorräte. „Eingelagert“ macht den Bezug zu den Scheunen des Kontextes natürlich deutlich.
- source_word: εἰς ἔτη πολλά
  choice: für viele Jahre
  rationale: Die Wendung bezeichnet die erwartete Dauer des Vorrats und wird nah am Griechischen wiedergegeben.
- source_word: ἀναπαύου
  choice: ruh dich aus
  rationale: Der Imperativ fordert dazu auf, sich Ruhe und Bequemlichkeit zu gönnen; die reflexive Form ist idiomatisches modernes Deutsch.
- source_word: φάγε, πίε
  choice: iss, trink
  rationale: Die beiden Aoristimperative werden unmittelbar und prägnant wiedergegeben.
- source_word: εὐφραίνου
  choice: sei fröhlich
  rationale: Die Wendung bezeichnet hier vergnügtes, genussvolles Leben. „Sei fröhlich“ bewahrt den Imperativ und ist natürlicher als das stärker ereignisbezogene „feiere“.
theological_decisions:
- issue: Bedeutung von ψυχή in der Selbstanrede
  choice: Seele
  alternative: Ich; Leben
  rationale: „Seele“ erhält die rhetorische Wiederholung und die traditionelle, zugleich im Deutschen verständliche Bildsprache. Die Fußnote wahrt die kontextuell möglichen Bedeutungen, ohne eine bestimmte Lehre über die Zusammensetzung des Menschen in den Text hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Selbstanrede und die knappe Folge der Imperative bleiben erhalten.
