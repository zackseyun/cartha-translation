review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur wird weitgehend getroffen. „einander auf die Füße traten“ schwächt καταπατεῖν jedoch ab; das Verb bezeichnet hier das Nieder-/Zertreten im Gedränge. Außerdem fügt „ihre Heuchelei“ einen im Griechischen nicht ausdrücklich gesetzten possessiven Bezug hinzu.
  naturalness: „Da begann Jesus, zuerst zu seinen Jüngern zu sagen“ ist im Deutschen schwerfällig. „begann Jesus zuerst zu seinen Jüngern zu sprechen“ ist idiomatisch und bewahrt die inchoative Aussage. Die erläuternde Wiedergabe der Metapher kann knapp und natürlich erfolgen.
  terminology: „Sauerteig“, „Pharisäer“ und „Heuchelei“ sind angemessen und bewahren Bildsprache sowie Register. Die ungrammatische angeblich wörtliche Fußnote wird entfernt; die Erklärung gehört ausreichend klar in den Text.
