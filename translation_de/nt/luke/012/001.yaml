  to: 'Währenddessen hatten sich viele Tausende aus der Menge versammelt, sodass sie einander niedertraten. Da begann Jesus zuerst zu seinen Jüngern zu sprechen: „Nehmt euch in Acht vor dem Sauerteig der Pharisäer – das heißt: Heuchelei.“'
