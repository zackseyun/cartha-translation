  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: de
  text: 'Währenddessen hatten sich viele Tausende aus der Menge versammelt, sodass sie einander niedertraten. Da begann Jesus zuerst zu seinen Jüngern zu sprechen: „Nehmt euch in Acht vor dem Sauerteig der Pharisäer – das heißt: Heuchelei.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Währenddessen
  rationale: Die Wendung ist hier zeitlich und zugleich an den vorhergehenden Zusammenhang anknüpfend; „Währenddessen“ gibt diese Übergangsfunktion natürlich wieder.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: hatten sich viele Tausende Menschen versammelt
  rationale: Der Genitivus absolutus beschreibt die bereits eingetretene Ansammlung. μυριάδες bezeichnet wörtlich Zehntausende, kann aber allgemein eine riesige Menge meinen; „viele Tausende“ bewahrt diese Größenangabe ohne Überpräzision.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: sodass sie einander auf die Füße traten
  rationale: ὥστε mit Infinitiv bezeichnet die tatsächliche Folge. Die deutsche Wendung ist anschaulich und idiomatisch; sie schwächt das chaotische Gedränge nicht ab.
- source_word: ἤρξατο λέγειν
  choice: Da begann Jesus … zu sagen
  rationale: Die inchoative Konstruktion wird direkt wiedergegeben. Der Name „Jesus“ macht das im Deutschen sonst leicht unklare Pronomen aus dem Kontext eindeutig, ohne neue inhaltliche Information einzuführen.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: zuerst zu seinen Jüngern
  rationale: πρῶτον wird als Priorität der angesprochenen Gruppe verstanden; die Wortstellung lässt jedoch auch eine allgemeinere Gliederungsfunktion zu.
- source_word: Προσέχετε ἑαυτοῖς ἀπό
  choice: Nehmt euch in Acht vor
  rationale: Diese natürliche deutsche Warnformel gibt sowohl die Aufforderung zur Aufmerksamkeit als auch den reflexiven Dativ ἑαυτοῖς wieder.
- source_word: ζύμη
  choice: Sauerteig
  rationale: „Sauerteig“ bewahrt das konkrete Bild und seinen biblischen Wiedererkennungswert besser als eine deutende Wiedergabe wie „Einfluss“.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: damit ist ihre Heuchelei gemeint
  rationale: Die qualitative beziehungsweise erläuternde Aussage identifiziert die Bedeutung des Bildes. Das ergänzte „ihre“ stellt im Deutschen den Bezug zu den Pharisäern klar.
theological_decisions:
- issue: Bildfunktion von ζύμη
  choice: Das Bild „Sauerteig“ bleibt erhalten und wird entsprechend dem griechischen Text mit Heuchelei erklärt.
  alternative: Das Bild durch „Einfluss“ oder „Lehre“ ersetzen.
  rationale: Der Text selbst erklärt das Bild; eine Ersetzung würde die literarische und theologische Bildsprache unnötig verengen.
- issue: Bezug von πρῶτον
  choice: „zuerst zu seinen Jüngern“ bezeichnet vorrangig die zuerst angesprochene Zuhörergruppe.
  alternative: „Als Erstes sagte er zu seinen Jüngern“ als Gliederung der Rede.
  rationale: Die griechische Stellung ist nicht völlig eindeutig. Die Übersetzung gibt die wahrscheinlichere Zuordnung wieder, ohne eine ausdrückliche spätere Redefolge hinzuzufügen.
- issue: Charakterisierung der Pharisäer
  choice: Die Heuchelei wird als der mit den Pharisäern verbundene „Sauerteig“ bezeichnet.
  alternative: Eine pauschale Wesensdefinition aller Pharisäer formulieren.
  rationale: Die Übersetzung bleibt bei der konkreten Warnung Jesu und erweitert sie nicht zu einer undifferenzierten Aussage über jeden einzelnen Pharisäer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sauerteig“ erhält die biblische Metapher; „Nehmt euch in Acht“ ist gegenwärtig und gut verständlich. Die große Menschenmenge wird anschaulich, aber nicht umgangssprachlich beschrieben.
