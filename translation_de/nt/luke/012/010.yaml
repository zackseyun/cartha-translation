id: LUK.12.10
reference: Luke 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: de
  text: Und jedem, der ein Wort gegen den Menschensohn sagt, wird vergeben werden; wer aber gegen den Heiligen Geist lästert, dem wird nicht vergeben werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὃς
  choice: jedem, der
  rationale: Die distributive, allgemein geltende Aussage wird im Deutschen zusammen mit dem Dativ αὐτῷ natürlich durch „jedem, der“ wiedergegeben.
- source_word: ἐρεῖ λόγον
  choice: ein Wort sagt
  rationale: Die Wendung bewahrt λόγον ausdrücklich und klingt zugleich in modernem Deutsch natürlich.
- source_word: εἰς
  choice: gegen
  rationale: Im Zusammenhang feindseliger Rede und Lästerung bezeichnet εἰς die gegen jemanden gerichtete Rede.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe des Titels und bewahrt dessen semitischen und christologischen Hintergrund.
- source_word: ἀφεθήσεται αὐτῷ
  choice: wird vergeben werden
  rationale: Der Dativ ist bereits in „jedem“ aufgenommen; das Passiv lässt wie im Griechischen den Gegenstand der Vergebung unausgesprochen.
- source_word: τῷ ... βλασφημήσαντι
  choice: wer ... lästert
  rationale: Die substantivierte Partizipialkonstruktion wird als allgemeine Personenbezeichnung idiomatisch wiedergegeben. Das deutsche Präsens vermeidet eine unnötige Festlegung auf einen vorzeitigen Einzelakt.
- source_word: τὸ ἅγιον πνεῦμα
  choice: den Heiligen Geist
  rationale: Dies ist die übliche, gegenwärtige deutsche Bezeichnung.
- source_word: οὐκ ἀφεθήσεται
  choice: dem wird nicht vergeben werden
  rationale: Die Formulierung gibt das negierte Futurpassiv klar wieder und nimmt den Dativ der griechischen Konstruktion natürlich auf.
theological_decisions:
- issue: Kontrast zwischen der Rede gegen den Menschensohn und der Lästerung gegen den Heiligen Geist
  choice: Den im Text formulierten Unterschied unverändert stehen lassen, ohne die Art der Lästerung oder den Grund ihrer Unvergebbarkeit auszudeuten.
  alternative: Die erste Aussage als unwissentliches Vergehen und die zweite als endgültige Unbußfertigkeit erklärend in die Übersetzung einarbeiten.
  rationale: Der Vers selbst stellt den Gegensatz fest, erklärt ihn aber hier nicht. Eine erklärende Erweiterung würde eine umstrittene theologische Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Dativkonstruktion „jedem ... wird“ / „wer ... dem wird“ bildet die griechische Struktur verständlich ab; keine Fußnote ist für diese natürliche und quellengenaue Wiedergabe erforderlich.
