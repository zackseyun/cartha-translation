  source_fidelity: Die Übersetzung gibt die distributive Aussage πᾶς ὃς, die feindselige Bedeutung von εἰς („gegen“), den Titel „Menschensohn“, das unpersönliche Futurpassiv der Vergebung und den scharfen Kontrast zur Lästerung gegen den Heiligen Geist treffend wieder. Das nicht ausgedrückte Objekt der Vergebung bleibt wie im Griechischen offen.
