  naturalness: „Ich bin gekommen, um Feuer auf die Erde zu werfen“ ist natürliches, würdiges Standarddeutsch und bewahrt die Bildkraft. Der Gedankenstrich und „wie sehr wünsche ich, es wäre schon entzündet!“ geben den emphatischen Charakter verständlich wieder. Die Formulierung ist leicht gehoben, aber für den biblischen Register angemessen.
  terminology: „Feuer“, „Erde“, „werfen“ und „entzündet“ sind konsistent, modern und quellennah. Das Bild des Feuers bleibt bewusst offen; es wird weder als Gericht noch als Reinigung oder Geist festgelegt.
