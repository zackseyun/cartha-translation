  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: de
  text: Ich bin gekommen, um Feuer auf die Erde zu werfen – und wie sehr wünsche ich, es wäre schon entzündet![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Und was will ich, wenn es schon entzündet worden ist?“ Die griechische Wendung ist schwierig; der Haupttext versteht sie wahrscheinlich idiomatisch als Ausdruck eines starken Wunsches.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: Feuer
  rationale: Das artikellose Substantiv wird schlicht als „Feuer“ wiedergegeben. Das Bild bleibt unaufgelöst, statt es bereits als Gericht, Reinigung, Geist oder Entzweiung auszudeuten.
- source_word: ἦλθον
  choice: Ich bin gekommen
  rationale: Das deutsche Perfekt ist in einer Aussage über Auftrag und Sendung natürlich und gibt den griechischen Aorist angemessen wieder.
- source_word: βαλεῖν
  choice: zu werfen
  rationale: „Werfen“ bewahrt die konkrete und eindringliche Bildsprache von βάλλω; „bringen“ wäre interpretierender und weniger anschaulich.
- source_word: ἐπὶ τὴν γῆν
  choice: auf die Erde
  rationale: γῆ bezeichnet hier am natürlichsten die Erde; eine örtlich begrenzte Wiedergabe als „Land“ ist vom Zusammenhang nicht gefordert.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: und wie sehr wünsche ich, es wäre schon entzündet!
  rationale: Die schwierige griechische Wendung wird idiomatisch als starker Wunsch verstanden. Die Fußnote bewahrt die formnähere mögliche Wiedergabe und macht die Unsicherheit sichtbar.
- source_word: ἤδη
  choice: schon
  rationale: „Schon“ ist hier die natürliche moderne deutsche Entsprechung für ἤδη.
- source_word: ἀνήφθη
  choice: es wäre entzündet
  rationale: Die passive Form von ἀνάπτω wird als „entzündet sein“ wiedergegeben; der deutsche Konjunktiv II fügt sich natürlich in die als Wunsch verstandene Aussage ein.
theological_decisions:
- issue: Bedeutung des Feuers
  choice: Das Bild „Feuer“ bleibt ohne ausdrückliche Deutung stehen.
  alternative: Gericht, Reinigung, der Heilige Geist oder die durch Jesu Sendung ausgelöste Entzweiung ausdrücklich benennen.
  rationale: Der Vers selbst legt die genaue Bedeutung nicht eindeutig fest. Die Übersetzung bewahrt daher die möglichen Resonanzen und die theologische Spannung.
- issue: Sinn der Wendung τί θέλω εἰ ἤδη ἀνήφθη
  choice: Als Ausruf eines starken Wunsches wiedergeben.
  alternative: 'Formnah als Frage: „Und was will ich, wenn es schon entzündet worden ist?“'
  rationale: Die griechische Klausel ist schwierig. Die Wunschdeutung ergibt im Zusammenhang natürliches Deutsch, während die Fußnote die formnahe Alternative und damit die echte Mehrdeutigkeit dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Feuer auf die Erde zu werfen“ erhält die kräftige Bildsprache des Ausgangstextes; der Gedankenstrich trägt dem abrupten, emotionalen zweiten Satzteil Rechnung.
