id: LUK.12.36
reference: Luke 12:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: de
  text: Und ihr sollt Menschen gleichen, die auf ihren Herrn warten, wenn er vom Hochzeitsfest zurückkehrt, damit sie ihm, sobald er kommt und anklopft, sofort öffnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν κύριον ἑαυτῶν
  choice: ihren Herrn
  rationale: „Herrn“ bewahrt die übliche Bedeutung von κύριος und das Verhältnis der Wartenden zu ihrem eigenen Herrn; im Deutschen ist das Possessivpronomen für ἑαυτῶν erforderlich.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: wenn er vom Hochzeitsfest zurückkehrt
  rationale: ἀναλύω bezeichnet hier die Rückkehr beziehungsweise das Aufbrechen zur Heimkehr; γάμοι kann eine Hochzeit oder das dazugehörige Fest bezeichnen. „Hochzeitsfest“ ergibt im Kontext natürliches Deutsch.
- source_word: προσδεχομένοις
  choice: die ... warten
  rationale: Das Partizip bezeichnet erwartungsvolles Warten; „auf ihren Herrn warten“ gibt die Konstruktion idiomatisch wieder.
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die zeitliche Unmittelbarkeit präzise und in modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis
  choice: Herr
  alternative: Hausherr / Gebieter
  rationale: „Herr“ wahrt die lexikalische und mögliche theologische Resonanz, ohne die Gleichnisfigur ausdrücklich mit einer über den Text hinausgehenden Deutung zu identifizieren.
- issue: Numerus und Geschlecht von ἀνθρώποις
  choice: Menschen
  alternative: Männer / Diener
  rationale: ἄνθρωποι bedeutet allgemein „Menschen“. „Diener“ wäre zwar kontextuell naheliegend, steht hier aber nicht ausdrücklich im griechischen Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Vergleich, wird jedoch durch „sollt ... gleichen“ und den temporalen Nebensatz natürlich formuliert.
