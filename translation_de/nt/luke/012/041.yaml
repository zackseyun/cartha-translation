id: LUK.12.41
reference: Luke 12:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: de
  text: 'Da sagte Petrus: »Herr, erzählst du dieses Gleichnis uns oder auch allen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Da sagte
  rationale: δέ führt die Erzählung weiter; »Da« gibt den Übergang im modernen Deutschen natürlich wieder. Das Aoristverb λέγω bleibt mit »sagte« als Redeeinleitung erhalten.
- source_word: Κύριε
  choice: Herr
  rationale: Die Anrede »Herr« entspricht κύριε und bewahrt sowohl den respektvollen als auch den möglichen christologischen Klang.
- source_word: πρὸς ἡμᾶς
  choice: uns
  rationale: Nach dem deutschen Verb »erzählen« gibt der Dativ die Richtung der Rede idiomatisch wieder.
- source_word: τὴν παραβολὴν ταύτην
  choice: dieses Gleichnis
  rationale: »Gleichnis« ist die etablierte und sachlich passende Wiedergabe von παραβολή in den synoptischen Evangelien.
- source_word: λέγεις
  choice: erzählst du
  rationale: Bei einem Gleichnis ist »erzählen« im Deutschen natürlicher als das wörtlichere »sagen« und bewahrt den Sinn einer an bestimmte Hörer gerichteten Rede.
- source_word: ἢ καὶ πρὸς πάντας
  choice: oder auch allen
  rationale: »Oder auch« erhält sowohl den Gegensatz von ἤ als auch die hinzufügende Kraft von καί. »Allen« gibt πάντας im Kontext allgemein und nicht ausschließlich männlich wieder.
theological_decisions:
- issue: Anrede κύριος für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« ist lexikalisch angemessen und lässt die mögliche christologische Bedeutung offen, ohne sie über das im Vers Gesagte hinaus festzulegen.
- issue: Generisches Maskulinum πάντας
  choice: allen
  alternative: allen Menschen
  rationale: Der griechische Plural bezeichnet hier die breitere Hörerschaft allgemein. Das deutsche »allen« ist inklusiv verständlich und fügt keine unnötige Spezifizierung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht hervorgehobene Stellung von »uns« bildet den Kontrast »uns – allen« ab, ohne ein im Griechischen nicht ausdrücklich vorhandenes »nur« einzufügen.
