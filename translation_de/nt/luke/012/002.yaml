source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: de
  text: Doch nichts ist verhüllt, was nicht aufgedeckt werden wird,[a][c] und nichts ist verborgen, was nicht bekannt werden wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verdeckt … enthüllt“. Das Griechische verwendet das Bild von etwas, das bedeckt ist und später aufgedeckt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geheim“, statt „verborgen“.'
    reason: lexical_alternative
  - marker: c
    text: Die Aussage kann allgemein auf eine spätere Offenlegung bezogen werden, sei es schon in der Gegenwart oder beim Endgericht.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: nichts
  rationale: Das negative Indefinitpronomen hat uneingeschränkten Umfang; „nichts“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: δὲ
  choice: doch
  rationale: δέ führt den Gedanken mit leichter Gegenüberstellung weiter; „doch“ ist im Zusammenhang idiomatisch und weniger scharf als „aber“.
- source_word: συγκεκαλυμμένον
  choice: verhüllt
  rationale: Das Perfekt Passiv bezeichnet etwas, das sich im Zustand des Verhülltseins befindet. „Verhüllt“ bewahrt zudem das Bild des Bedeckens und bildet einen klaren Gegensatz zu „aufgedeckt“.
- source_word: ἀποκαλυφθήσεται
  choice: aufgedeckt werden wird
  rationale: Das Futur Passiv bezeichnet eine künftige Enthüllung. „Aufgedeckt“ wahrt das Bild und den Gegensatz zu „verhüllt“.
- source_word: κρυπτὸν
  choice: verborgen
  rationale: „Verborgen“ gibt das Adjektiv natürlich wieder und lässt offen, ob es sich um etwas absichtlich Geheimgehaltenes handelt.
- source_word: γνωσθήσεται
  choice: bekannt werden wird
  rationale: Das Futur Passiv von γινώσκω bezeichnet hier das künftige Bekanntwerden; die Formulierung bildet den griechischen Parallelismus deutlich ab.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: was nicht
  rationale: Das Relativpronomen leitet jeweils einen restriktiven Relativsatz ein; „was nicht“ ist im Deutschen bei substantivierten neutralen Ausdrücken natürlich.
theological_decisions:
- issue: Reichweite und Zeitpunkt der Offenlegung
  choice: 'Die Aussage bleibt ein allgemeiner Grundsatz: Was jetzt verhüllt oder verborgen ist, wird künftig aufgedeckt beziehungsweise bekannt werden.'
  alternative: Die Worte ausschließlich auf die Offenlegung beim Endgericht oder ausschließlich auf die gegenwärtige Entlarvung von Heuchelei beziehen.
  rationale: Die griechischen Futurformen sichern die künftige Offenlegung, bestimmen aber ihren Zeitpunkt nicht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Griechischen bleibt erkennbar; die wiederholte Zukunftsform ist bewusst beibehalten. Alle Fußnotenmarker stehen unmittelbar bei den einschlägigen Ausdrücken beziehungsweise Satzteilen.
