    issue: Der zweite Teil „oder nach dessen Willen handelte“ steht außerhalb der deutschen Negation.
    rationale: 'So kann der Satz besagen, der Sklave habe entweder versäumt, sich bereit zu machen, oder aber nach dem Willen seines Herrn gehandelt. Das Gegenteil ist gemeint: μὴ negiert sowohl ἑτοιμάσας als auch ποιήσας. Eine Konstruktion mit „weder … noch …“ macht den Sinn zuverlässig wieder.'
  - severity: low
    issue: Die Fußnote nennt „mit vielen [Schlägen] geschlagen werden“ als wörtliche Alternative.
    rationale: Das griechische πολλάς ist Akkusativ Plural und die Ellipse bezeichnet eher die Anzahl der Schläge als ein deutsches instrumentales „mit vielen Schlägen“. Eine Erklärung der ausgelassenen Substantivierung ist präziser.
