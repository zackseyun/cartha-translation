  verdict: revise
  source_fidelity: 'Die Fassung trifft die zentralen Begriffe grundsätzlich: δοῦλος ist zutreffend als „Sklave“, κύριος im Gleichnis als „Herr“, und δαρήσεται πολλάς als wiederholte körperliche Bestrafung wiedergegeben. Die Negation von μὴ erstreckt sich jedoch auf beide mit ἢ verbundenen Partizipien. Im Deutschen muss daher deutlich werden, dass der Sklave weder sich bereit machte noch dem Willen seines Herrn entsprechend handelte.'
  naturalness: „Viele Schläge erhalten“ ist modernes, verständliches Standarddeutsch und bildet das passive Futur würdiger ab als das etwas umgangssprachlichere „Schläge bekommen“. Die Konstruktion „weder … noch …“ ist hier trotz des griechischen ἢ die natürliche und semantisch eindeutige deutsche Wiedergabe unter der Negation.
  terminology: „Sklave“, „Herr“ und „Wille“ sind angemessen und konsistent mit dem Gleichniskontext. Die Fußnote sollte die griechische Ellipse ohne eine irreführend wörtliche deutsche Passivumschreibung erklären; das im Griechischen ausgelassene feminine Bezugswort kann etwa „Schläge“/„Hiebe“ sein.
  issues:
