source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: de
  text: Jener Sklave aber, der den Willen seines Herrn kannte und sich weder bereitgemacht noch nach seinem Willen gehandelt hatte, wird viele Schläge erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird viele [Schläge] erleiden“ oder „wird viele Male geschlagen werden“. Im Griechischen steht „viele“ ohne ein ausgedrücktes Bezugswort; „Schläge“ beziehungsweise „Hiebe“ ist zu ergänzen.'
    reason: Lexikalische Alternative und Erklärung der griechischen Ellipse
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Das Wort bezeichnet einen rechtlich und sozial gebundenen Untergebenen, nicht einen frei angestellten Diener. Im Gleichnis treten die Verfügungsgewalt des Herrn und die Bestrafung deutlich hervor.
- source_word: γνοὺς
  choice: der … kannte
  rationale: Das Aoristpartizip bezeichnet hier die vorausgesetzte Kenntnis vom Willen des Herrn. Ein deutscher Relativsatz gibt dies natürlich und klar wieder.
- source_word: θέλημα
  choice: Willen
  rationale: „Wille“ bezeichnet hier passend die Absicht beziehungsweise Anweisung des Herrn, ohne den Ausdruck enger auszulegen.
- source_word: κυρίου αὐτοῦ
  choice: seines Herrn
  rationale: κύριος bezeichnet innerhalb des Gleichnisses den Herrn des Sklaven. Das deutsche „Herr“ bewahrt sowohl das soziale Verhältnis als auch die mögliche weiterführende Bedeutung des Gleichnisses.
- source_word: μὴ ἑτοιμάσας
  choice: sich nicht bereit machte
  rationale: Die griechische Form lässt unausgesprochen, was vorbereitet werden sollte. Die reflexive deutsche Wendung erhält diese Offenheit und klingt natürlicher als ein transitives „nichts vorbereitete“.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: oder nach dessen Willen handelte
  rationale: Die Formulierung bewahrt die im Ausgangstext genannten zwei Versäumnisse und gibt ποιεῖν πρός idiomatisch als Handeln in Übereinstimmung mit dem Willen wieder.
- source_word: δαρήσεται πολλάς
  choice: wird viele Schläge bekommen
  rationale: Das Futur Passiv bezeichnet körperliche Schläge; πολλάς steht elliptisch, wobei ein feminines Substantiv wie „Schläge“ mitgedacht ist. Die deutsche Fassung macht das notwendige Bezugswort ausdrücklich, ohne die Art der Bestrafung näher festzulegen.
theological_decisions:
- issue: Wiedergabe von κύριος im Gleichnis vom Hausherrn
  choice: Herr
  alternative: Gebieter; Herr und Meister
  rationale: Im unmittelbaren Bild bezeichnet κύριος den Herrn des Sklaven. „Herr“ ist im Deutschen für dieses Verhältnis passend und lässt zugleich die übertragene Beziehung des Gleichnisses offen, ohne ausdrücklich einen göttlichen Titel einzusetzen.
- issue: Stärke der Wendung δαρήσεται πολλάς
  choice: wird viele Schläge bekommen
  alternative: wird oft geschlagen werden; wird schwer geschlagen werden
  rationale: Der griechische Ausdruck hebt die Vielzahl der Schläge hervor. „Schwer“ würde eher die Intensität deuten, während „viele Schläge“ das konkrete Bild und die grammatische Ellipse genauer bewahrt.
- issue: Verhältnis der beiden Versäumnisse mit ἢ
  choice: nicht … oder …
  alternative: weder … noch …
  rationale: Der griechische Text verbindet die beiden Partizipien mit ἢ („oder“). Die Übersetzung erhält diese Form, statt sie durch „weder … noch“ logisch zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sklave“ bildet die historische Abhängigkeit deutlich ab; „sich bereit machte“ und „Schläge bekommen“ sorgen für natürliche Verständlichkeit. Der Relativsatz löst das griechische Partizip idiomatisch auf, ohne den zeitlichen und sachlichen Zusammenhang zu verändern.
