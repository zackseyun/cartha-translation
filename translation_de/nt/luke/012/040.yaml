id: LUK.12.40
reference: Luke 12:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: de
  text: Auch ihr müsst bereit sein, denn der Menschensohn kommt zu einer Stunde, in der ihr es nicht erwartet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch ihr: Seid bereit.“'
    reason: lexical_alternative
  - marker: b
    text: „Menschensohn“ ist eine Selbstbezeichnung Jesu, wahrscheinlich mit Anklängen an Daniel 7,13–14.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Auch ihr
  rationale: 'Bewahrt die einschließende und zugleich betonte Anrede: Wie die zuvor genannten Diener sollen auch die Angesprochenen bereit sein.'
- source_word: γίνεσθε ἕτοιμοι
  choice: müsst bereit sein
  rationale: Die Wendung ist ein präsentischer Imperativ und fordert eine fortdauernde Bereitschaft. „Müsst bereit sein“ gibt Dringlichkeit und anhaltende Verpflichtung in natürlichem Deutsch wieder; wörtlicher wäre „Seid bereit“.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und passt zum würdigen, natürlichen Register.
- source_word: ᾗ ὥρᾳ
  choice: zu einer Stunde, in der
  rationale: Gibt die temporale Relativkonstruktion wieder und lässt die Unbestimmtheit des Zeitpunkts erkennen.
- source_word: οὐ δοκεῖτε
  choice: ihr es nicht erwartet
  rationale: δοκέω bedeutet grundsätzlich „meinen, denken, annehmen“; im Zusammenhang einer unerwarteten Ankunft bringt „nicht erwarten“ den pragmatischen Sinn klar zum Ausdruck.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält Jesu Selbstbezeichnung und ihre möglichen Anklänge an Daniel 7,13–14.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das griechische Präsens kann hier futurisch verstanden werden. Das deutsche Präsens wahrt die Form, die Unmittelbarkeit und den Warncharakter, ohne eine zusätzliche Zeitbestimmung einzutragen.
theological_decisions:
- issue: Wiedergabe des christologischen Titels ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der menschliche Eine
  rationale: „Menschensohn“ ist im Deutschen die erkennbare, traditionsübergreifende Titelbezeichnung und bewahrt den möglichen Daniel-Hintergrund, ohne ihn im Haupttext auszudeuten.
- issue: Zeitliche Aussage von ἔρχεται in der endzeitlichen Warnung
  choice: kommt
  alternative: wird kommen
  rationale: Das Präsens erhält die sprachliche Unmittelbarkeit des griechischen Textes. Es legt kein bestimmtes endzeitliches System fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Warn- und Aufforderungston. Die Wortstellung bleibt natürlich; „zu einer Stunde, in der“ bewahrt die zeitliche Bildsprache des Ausgangstextes.
