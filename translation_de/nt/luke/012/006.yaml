  source_fidelity: 'Der deutsche Text gibt den griechischen Wortlaut präzise wieder: die rhetorische Frage (οὐχί), die fünf Spatzen, den Preis von zwei Assaria, die hervorgehobene Verneinung hinsichtlich auch nur eines Vogels sowie ἐνώπιον τοῦ θεοῦ als „vor Gott“. Das Perfektpartizip ἐπιλελησμένον wird zutreffend als bestehender Zustand des Vergessenseins wiedergegeben.'
  naturalness: „Werden nicht fünf Spatzen für zwei Assaria verkauft?“ ist modernes, idiomatisches Standarddeutsch. „Und doch ist kein einziger von ihnen vor Gott vergessen“ ist knapp, würdig und verständlich; die Stellung von „vor Gott“ bewahrt den Bezug zum griechischen Ausdruck.
  terminology: „Spatzen“ ist im Kontext eine angemessene konkrete Wiedergabe von στρουθία. „Assaria“ erhält die spezifische antike Münzbezeichnung und wird sachgerecht erläutert. „Vergessen“ ist für ἐπιλελησμένον die engste natürliche Wiedergabe; die Fußnote bietet „übersehen“ korrekt als mögliche, etwas interpretativere Alternative an.
