id: LUK.12.6
reference: Luke 12:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: de
  text: Werden nicht fünf Spatzen für zwei Assaria[a] verkauft? Und doch ist kein einziger von ihnen vor Gott vergessen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für zwei Kupfermünzen“. Assaria waren kleine römische Kupfermünzen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „wird vor Gott nicht übersehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: Spatzen
  rationale: Der Ausdruck kann allgemein kleine Vögel bezeichnen, meint in diesem Zusammenhang aber sehr wahrscheinlich Spatzen; diese Wiedergabe ist konkret, natürlich und traditionsübergreifend verständlich.
- source_word: πωλοῦνται
  choice: werden … verkauft
  rationale: Die Passivform des griechischen Präsens wird im Deutschen formgetreu und idiomatisch wiedergegeben.
- source_word: ἀσσαρίων δύο
  choice: für zwei Assaria
  rationale: Die antike Münzbezeichnung bleibt erhalten, weil moderne Geldbezeichnungen einen ungenauen Wertvergleich nahelegen würden; eine Fußnote erläutert den Begriff.
- source_word: ἐπιλελησμένον
  choice: vergessen
  rationale: Das Perfektpartizip bezeichnet den bestehenden Zustand des Vergessenseins. „Vergessen“ gibt den lexikalischen Sinn unmittelbarer wieder als das schwächere „übersehen“.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die knappe Formulierung entspricht dem Griechischen und bewahrt die Aussage, dass jeder einzelne Vogel in Gottes Gegenwart beziehungsweise Wahrnehmung steht.
- source_word: οὐχὶ … ;
  choice: Werden nicht …?
  rationale: Die rhetorische Frage erwartet Zustimmung; die deutsche Fragestellung erhält diese Wirkung.
- source_word: καὶ ἓν ἐξ αὐτῶν οὐκ
  choice: Und doch ist kein einziger von ihnen
  rationale: „Kein einziger“ bringt die Hervorhebung des einen unter den fünf natürlich zum Ausdruck; „und doch“ macht den im Zusammenhang liegenden Kontrast deutlich, ohne die Aussage auszubauen.
theological_decisions:
- issue: Göttliches Erinnern und Gottes Fürsorge
  choice: kein einziger von ihnen [ist] vor Gott vergessen
  alternative: kein einziger von ihnen wird von Gott übersehen
  rationale: „Vergessen“ bleibt eng am Wortlaut und bezeugt Gottes aufmerksame Kenntnis selbst gering geachteter Geschöpfe, ohne daraus im Vers nicht ausdrücklich genannte Einzelheiten einer Vorsehungslehre abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die antike Münzbezeichnung wird aus Gründen historischer Genauigkeit im Haupttext bewahrt und in der Fußnote erklärt.
