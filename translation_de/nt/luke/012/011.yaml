id: LUK.12.11
reference: Luke 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: de
  text: Wenn sie euch aber vor die Synagogen, die Regierenden und die Behörden bringen,[a] dann macht euch keine Sorgen darüber, wie oder was ihr zu eurer Verteidigung vorbringen sollt oder was ihr sagen sollt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind religiöse und staatliche Instanzen, vor denen die Jünger verhört werden konnten.
    reason: cultural_note
  - marker: b
    text: Das Griechische unterscheidet zwischen der Art oder dem Inhalt der Verteidigung und dem, was sonst gesagt werden soll.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Wenn … aber
  rationale: ὅταν bezeichnet einen unbestimmten künftigen Fall; δέ wird als milder Übergang beziehungsweise Kontrast mit „aber“ wiedergegeben.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: sie euch … bringen
  rationale: Im Zusammenhang mit Verhör und Rechtfertigung bezeichnet das Verb das Vorführen vor religiöse und staatliche Instanzen.
- source_word: ἐπὶ τὰς συναγωγάς
  choice: vor die Synagogen
  rationale: Die wörtliche Bezeichnung bleibt erhalten; im Kontext sind die Synagogen zugleich als religiöse Versammlungs- und Gerichtsinstanzen gemeint.
- source_word: τὰς ἀρχὰς
  choice: die Amtsträger
  rationale: ἀρχαί bezeichnet hier Personen in leitender staatlicher Stellung. „Amtsträger“ ist im juristisch-politischen Kontext genauer als das allgemeinere „Herrscher“.
- source_word: τὰς ἐξουσίας
  choice: die Machthaber
  rationale: ἐξουσίαι bezeichnet mit Vollmacht ausgestattete Autoritäten. „Machthaber“ unterscheidet den Ausdruck verständlich von den zuvor genannten Amtsträgern.
- source_word: μὴ μεριμνήσητε
  choice: macht euch keine Sorgen
  rationale: Die Wendung warnt vor sorgenvoller gedanklicher Beschäftigung und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: πῶς ἢ τί
  choice: wie oder womit
  rationale: Beide Fragewörter werden bewahrt. Vor dem Verb „sich verteidigen“ gibt „womit“ das τί idiomatisch als Inhalt beziehungsweise Mittel der Verteidigung wieder.
- source_word: ἀπολογήσησθε
  choice: ihr euch verteidigen sollt
  rationale: Das Verb steht in einem forensischen Zusammenhang und bezeichnet die eigene Verteidigung beziehungsweise Rechtfertigung vor einer Instanz.
- source_word: ἢ τί εἴπητε
  choice: oder was ihr sagen sollt
  rationale: Die zweite Wendung nennt gesondert den Inhalt der zu sprechenden Worte und wahrt so die auffällige Zweiteilung des griechischen Satzes.
theological_decisions:
- issue: Verheißung göttlicher Hilfe und menschliche Vorbereitung
  choice: Das Verbot wird auf sorgengeprägtes Überlegen in der Verhörsituation bezogen, ohne eine allgemeine Lehre gegen jede Vorbereitung einzufügen.
  alternative: Als grundsätzliches Verbot jeder Vorbereitung auf Zeugnis oder Verteidigung verstehen.
  rationale: Der Vers spricht konkret vom Vorgeführtwerden und vom besorgten Überlegen, wie beziehungsweise was zur Verteidigung zu sagen sei; weitergehende Folgerungen stehen nicht ausdrücklich im Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Aufzählung und die doppelte Frage nach Verteidigung und Rede bleiben erhalten; juristische Fachsprache wird nur so weit verwendet, wie sie für den Kontext nötig ist.
