revisions:
- from: Wenn sie euch aber vor die Synagogen, die Amtsträger und die Machthaber bringen,[a] dann macht euch keine Sorgen darüber, wie oder womit ihr euch verteidigen oder was ihr sagen sollt.[b]
  to: Wenn sie euch aber vor die Synagogen, die Regierenden und die Behörden bringen,[a] dann macht euch keine Sorgen darüber, wie oder was ihr zu eurer Verteidigung vorbringen sollt oder was ihr sagen sollt.[b]
  rationale: Die Revision ersetzt die zu enge Wiedergabe „womit“ durch „was“, glättet die deutsche Satzkonstruktion und verwendet für ἀρχαί und ἐξουσίαι neutrale, moderne Bezeichnungen. Die auffällige griechische Abfolge „wie oder was … oder was“ bleibt dabei erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von εἰσφέρωσιν, dem gerichtlichen „vor“, der dreigliedrigen Reihe und μὴ μεριμνήσητε ist im Grundsatz zutreffend. Allerdings bedeutet τί in πῶς ἢ τί nicht spezifisch „womit“, sondern offen „was“. Die gegenwärtige Konstruktion „wie oder womit ihr euch verteidigen“ engt den griechischen Ausdruck ein und ist syntaktisch nicht glatt.
  naturalness: „Macht euch keine Sorgen“ ist natürliches modernes Standarddeutsch. „Amtsträger und Machthaber“ wirkt dagegen unnötig individualisierend; besonders „Machthaber“ kann pejorativ klingen. „Regierende und Behörden“ ist neutraler und besser für die breit gehaltenen Begriffe ἀρχαί und ἐξουσίαι geeignet.
  terminology: „Synagogen“ soll als formale Bezeichnung stehen bleiben; die Anmerkung kann die gemeinten religiösen und staatlichen Instanzen erläutern. Die forensische Bedeutung von ἀπολογήσησθε wird treffend durch „zu eurer Verteidigung vorbringen“ ausgedrückt, ohne die offenere Wiederholung von τί im griechischen Satz zu verwischen.
  issues:
  - severity: medium
    issue: „womit“ für τί
    rationale: τί bedeutet „was“ und bezeichnet nicht notwendig ein Mittel. Die Übersetzung sollte die offene Frage nach dem Inhalt der Verteidigung bewahren.
  - severity: medium
    issue: Unnatürliche und semantisch eingeschränkte Konstruktion bei ἀπολογήσησθε
    rationale: „wie oder womit ihr euch verteidigen sollt“ verbindet die beiden Fragewörter nicht idiomatisch mit „sich verteidigen“. Eine Formulierung mit „zu eurer Verteidigung vorbringen“ gibt den forensischen Sinn natürlicher wieder.
  - severity: low
    issue: „Machthaber“ ist tendenziell wertend
    rationale: ἐξουσίαι benennt hier neutral Autoritäten bzw. Behörden. „Machthaber“ kann im heutigen Deutsch eine negative Bewertung nahelegen.
