id: LUK.12.34
reference: Luke 12:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: de
  text: Denn wo euer Schatz ist, da wird auch euer Herz sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: wo
  rationale: Leitet den Ortssatz direkt ein und bildet zusammen mit „da“ die natürliche deutsche Entsprechung der griechischen Korrelation ὅπου … ἐκεῖ.
- source_word: γάρ
  choice: denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an die vorangehende Aufforderung.
- source_word: θησαυρός
  choice: Schatz
  rationale: Ist die direkte, idiomatische Wiedergabe und erhält im Kontext sowohl den konkreten Bezug auf Besitz als auch die übertragene Bedeutung des als wertvoll Erachteten.
- source_word: ἐκεῖ
  choice: da
  rationale: Entspricht in der deutschen Spruchform natürlich dem vorausgehenden „wo“ und bewahrt die räumliche Korrelation.
- source_word: καὶ
  choice: auch
  rationale: 'Gibt die additive Aussage wieder: Das Herz befindet sich ebenfalls dort, wo der Schatz ist.'
- source_word: καρδία
  choice: Herz
  rationale: Bewahrt den biblischen Ausdruck für das innere Zentrum von Wollen, Zuneigung und Ausrichtung, ohne ihn auf Gefühl, Verstand oder Begehren zu verengen.
- source_word: ἔσται
  choice: wird … sein
  rationale: Erhält den ausdrücklich gesetzten Futur und zugleich den Charakter einer sprichwörtlichen Gewissheit.
- source_word: ὑμῶν
  choice: euer
  rationale: Gibt den in beiden Fällen pluralischen Possessivbezug in modernem Standarddeutsch genau wieder.
theological_decisions:
- issue: Anthropologische Bedeutung von καρδία
  choice: „Herz“ als umfassenden biblischen Begriff beibehalten
  alternative: Deutender mit „Verlangen“, „Denken“ oder „inneres Wesen“ übersetzen
  rationale: Die Aussage betrifft die innere Ausrichtung des Menschen auf das, was er als wertvoll ansieht. „Herz“ bewahrt die literarische und theologische Weite des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe korrelative Satzform „wo … da“ erhält den sprichwörtlichen Charakter. Keine Fußnote nötig, da „wo“ die mögliche allgemeine Nuance von „wo immer“ im Deutschen kontextuell mittragen kann.
