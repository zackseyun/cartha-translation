  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: de
  text: 'Doch er sagte zu ihm: »Mensch, wer hat mich zum Richter oder Erbteiler über euch eingesetzt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Mensch
  rationale: Die direkte Anrede wird formal und knapp wiedergegeben; sie wirkt im Deutschen ebenso distanziert und leicht zurechtweisend.
- source_word: κατέστησεν
  choice: hat ... eingesetzt
  rationale: Gibt die Bedeutung der förmlichen Einsetzung oder Bestellung natürlich und präzise wieder.
- source_word: κριτὴν
  choice: Richter
  rationale: Die übliche und sachlich passende Entsprechung für jemanden, der einen Rechtsstreit entscheidet.
- source_word: μεριστὴν
  choice: Erbteiler
  rationale: Im Kontext des Erbstreits bezeichnet das seltene Wort jemanden, der einen Nachlass aufteilt. »Erbteiler« erhält die Unterscheidung zu »Richter« besser als »Schlichter«.
- source_word: ἐφ’ ὑμᾶς
  choice: über euch
  rationale: Bewahrt die konstruktive Bildsprache von Autorität über den beteiligten Parteien und die Pluralform.
theological_decisions:
- issue: Reichweite von Jesu Frage nach seiner Einsetzung
  choice: Die rhetorische Frage bleibt ohne erklärenden Zusatz stehen.
  alternative: Eine allgemeine Ablehnung jeder richterlichen Autorität Jesu ausdrücklich formulieren.
  rationale: Der Vers weist die verlangte Rolle in diesem konkreten Erbstreit zurück; weitergehende christologische Schlüsse werden vom Wortlaut weder ausdrücklich bestätigt noch ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, scharfe Form der Antwort und die sachrechtliche Wortwahl des griechischen Textes bleiben erhalten.
