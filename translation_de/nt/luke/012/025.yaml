  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: de
  text: Kann denn jemand von euch dadurch, dass er sich Sorgen macht, seiner Lebensdauer eine Elle hinzufügen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seiner Körpergröße eine Elle hinzufügen. Das griechische Wort kann sowohl Lebensalter oder Lebensdauer als auch Körpergröße bezeichnen.'
    reason: Bewahrt die bei ἡλικία bestehende, im Kontext nicht restlos auflösbare Bedeutungsalternative.
lexical_decisions:
- source_word: μεριμνῶν
  choice: dadurch, dass er sich Sorgen macht
  rationale: Gibt das Partizip natürlich wieder und bewahrt den Gedanken des besorgten Grübelns.
- source_word: ἡλικίαν
  choice: Lebenslänge
  rationale: Das Wort kann Lebensalter, Lebensdauer oder Körpergröße bezeichnen. Im Zusammenhang mit der Sorge um das Leben ist „Lebenslänge“ wahrscheinlich und bewahrt zusammen mit „Elle“ das räumliche Bild.
- source_word: πῆχυν
  choice: eine Elle
  rationale: Entspricht dem antiken Längenmaß und erhält die auffällige Metapher des griechischen Textes.
- source_word: προσθεῖναι
  choice: hinzufügen
  rationale: Formale und im Deutschen verständliche Wiedergabe des Infinitivs.
theological_decisions:
- issue: Bezug von ἡλικία auf Lebensdauer oder Körpergröße
  choice: Lebenslänge im Haupttext, Körpergröße als Alternative in der Fußnote
  alternative: seiner Körpergröße eine Elle hinzufügen
  rationale: Der unmittelbare Zusammenhang behandelt die Sorge um das Leben; zugleich ist die lexikalisch echte Alternative „Körpergröße“ nicht auszuschließen und wird daher ausdrücklich bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung macht die instrumentale Bedeutung des Partizips deutlich; das antike Maß und die bildhafte Spannung bleiben erhalten.
