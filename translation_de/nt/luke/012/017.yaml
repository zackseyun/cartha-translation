review_pass:
  verdict: approve
  source_fidelity: Der Text gibt διελογίζετο ἐν ἑαυτῷ λέγων treffend als inneres Überlegen wieder. Die deliberative Frage »Was soll ich tun?« entspricht Τί ποιήσω idiomatisch. »Denn ich habe keinen Platz, wo ich meine Ernte einlagern kann« vermittelt zutreffend den kausalen Sinn von ὅτι οὐκ ἔχω ποῦ sowie den landwirtschaftlich-kontextuellen Sinn von συνάξω τοὺς καρπούς μου. »Einlagern« ist gegenüber dem Grundsinn »sammeln/zusammenbringen« leicht konkretisierend, aber durch den unmittelbaren Kontext der Vorratshaltung gedeckt.
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen schlichtem Erzählton. »Bei sich überlegen« und die direkte Frage klingen natürlich. Die Formulierung »keinen Platz, wo« ist idiomatisch; »keinen Ort, an dem« wäre lediglich eine gleichwertige stilistische Alternative.
  terminology: »Ernte« ist für τοὺς καρπούς μου im agrarischen Kontext klar und präzise. Die Fußnote bewahrt die wörtliche Alternative »Früchte« und erläutert sachgerecht, dass der gesamte landwirtschaftliche Ertrag gemeint ist. Keine theologisch oder konfessionell gesteuerte Terminologie liegt vor.
