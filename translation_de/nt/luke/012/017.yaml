source:
  edition: SBLGNT
  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: de
  text: 'Und er überlegte bei sich: »Was soll ich tun? Denn ich habe keinen Platz, wo ich meine Ernte[a] einlagern kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine Früchte«; gemeint ist der gesamte landwirtschaftliche Ertrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζετο
  choice: überlegte
  rationale: Das Imperfekt bezeichnet einen andauernden inneren Überlegungsprozess. »Überlegte« gibt den abwägenden Sinn natürlicher und genauer wieder als das allgemeinere »dachte«.
- source_word: ἐν ἑαυτῷ λέγων
  choice: bei sich
  rationale: Die Wendung führt die innere Rede ein. Im Deutschen drückt »bei sich überlegen« diesen Sinn natürlich aus, ohne ein hörbares Selbstgespräch vorauszusetzen.
- source_word: Τί ποιήσω
  choice: Was soll ich tun?
  rationale: Der deliberative Aorist Konjunktiv wird im modernen Deutschen idiomatisch mit »soll« wiedergegeben und bleibt als echte Ratlosigkeitsfrage erhalten.
- source_word: ὅτι
  choice: Denn
  rationale: ὅτι nennt hier den Grund für die vorausgehende Frage. »Denn« bildet diesen kausalen Zusammenhang klar und würdig ab.
- source_word: οὐκ ἔχω ποῦ
  choice: ich habe keinen Platz, wo
  rationale: Diese idiomatische Wiedergabe entspricht dem Sinn »ich habe keinen Ort, an dem« und klingt im modernen Deutschen natürlich.
- source_word: συνάξω
  choice: einlagern kann
  rationale: συνάγω bedeutet grundsätzlich »zusammenbringen/sammeln«; im Zusammenhang mit der Ernte und den anschließend genannten Scheunen bezeichnet es das Einbringen zur Lagerung. »Einlagern« macht diesen konkreten Sinn verständlich.
- source_word: τοὺς καρπούς μου
  choice: meine Ernte
  rationale: καρποί bezeichnet hier den landwirtschaftlichen Ertrag insgesamt. »Ernte« ist im Kontext präziser und natürlicher als das im Deutschen missverständliche wörtliche »Früchte«.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die innere Überlegung wird knapp und natürlich wiedergegeben; die Bildwelt des landwirtschaftlichen Vorratshaltens bleibt erhalten.
