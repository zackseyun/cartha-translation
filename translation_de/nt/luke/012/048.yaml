  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: de
  text: Wer aber nicht wusste und tat, was Schläge verdient, wird wenige Schläge erleiden. Von jedem, dem viel gegeben wurde, wird viel verlangt werden; und wem man viel anvertraut hat, von dem wird man noch mehr fordern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Griechischen unbestimmte Pluralformen: „wem sie viel anvertraut haben, von dem werden sie noch mehr fordern“. Wer mit „sie“ gemeint ist, wird nicht ausdrücklich gesagt.'
    reason: Bewahrung der Mehrdeutigkeit beim Handlungsträger
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: wer es ... nicht wusste
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet denjenigen, dem das maßgebliche Wissen fehlte. „Nicht wusste“ bewahrt den Bezug auf Wissen, ohne Unverständnis oder schuldhafte Ignoranz zusätzlich einzutragen.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: tat, was Schläge verdient
  rationale: ἄξια mit dem Genitiv πληγῶν bezeichnet Handlungen, die Schläge als Strafe verdienen. Die Formulierung ist gegenwärtiges, natürliches Deutsch und erhält das konkrete Bild.
- source_word: δαρήσεται ὀλίγας
  choice: wird wenige Schläge bekommen
  rationale: Das Passiv von δέρω bezeichnet ausdrücklich das Geschlagenwerden; ὀλίγας nimmt die zuvor genannten πληγάς sinngemäß wieder auf. „Wenige Schläge bekommen“ ist klar und lässt das Bild weder verblassen noch unnötig spezifisch werden.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: von jedem, dem viel gegeben wurde
  rationale: Die deutsche Konstruktion bildet die allgemeine Rechenschaftsregel und den anschließenden Gedanken des Forderns von einer Person idiomatisch ab.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: wird viel verlangt werden
  rationale: ζητέω hat hier im Passiv den Sinn einer verbindlichen Forderung. „Verlangt“ gibt die Rechenschaftspflicht natürlich wieder; „von jedem“ bildet παρά mit Genitiv bereits ab.
- source_word: παρέθεντο
  choice: man viel anvertraut hat
  rationale: παρατίθημι bezeichnet hier das Übertragen eines Gutes oder einer Verantwortung in die Obhut eines anderen. Das unpersönliche „man“ entspricht funktional dem nicht näher bestimmten griechischen Plural.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: von dem wird man noch mehr fordern
  rationale: αἰτέω kann je nach Zusammenhang „bitten“, „verlangen“ oder „fordern“ bedeuten. Im Zusammenhang anvertrauter Verantwortung ist „fordern“ angemessen; „noch mehr“ gibt περισσότερον wieder.
theological_decisions:
- issue: Art des Strafbildes
  choice: Das konkrete Bild abgestufter Schläge bleibt erhalten.
  alternative: Eine abstrakte Wiedergabe als „Strafe“ oder eine Spezifizierung als „Peitschenhiebe“ beziehungsweise „Auspeitschen“.
  rationale: Der Vers spricht in einem Gleichnisbild von unterschiedlichem Strafmaß entsprechend Wissen und Verantwortung. Die Übersetzung soll dieses Bild bewahren, ohne daraus über den Wortlaut hinaus ein bestimmtes System des Gerichts abzuleiten.
- issue: Subjekt der unbestimmten Pluralformen παρέθεντο und αἰτήσουσιν
  choice: Wiedergabe durch das unpersönliche „man“, mit einer Fußnote zur wörtlichen Form.
  alternative: Ausdrückliche Identifizierung des Subjekts als Gott oder als Menschen; formal auch „sie“.
  rationale: Der griechische Text nennt kein ausdrückliches Subjekt. „Man“ wahrt im Deutschen die unbestimmte Aussage, ohne die handelnde Instanz theologisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchcharakter. Die Parallelität der beiden abschließenden Aussagen wird erhalten; konkrete Strafsprache bleibt bestehen, während die ungenannte Handlungsträgerschaft nicht aufgelöst wird.
