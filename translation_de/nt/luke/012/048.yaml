  terminology: „Schläge“, „gegeben“, „verlangt“, „anvertraut“ und „fordern“ sind angemessen. Das unpersönliche „man“ bewahrt die im Griechischen ungenannten Handelnden, ohne sie theologisch zu bestimmen. Die Fußnote erläutert diese Entscheidung sachgerecht.
