id: LUK.12.27
reference: Luke 12:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: de
  text: 'Achtet auf die Lilien[a], wie sie wachsen: Sie mühen sich nicht ab und spinnen nicht. Doch ich sage euch: Nicht einmal Salomo in all seiner Herrlichkeit war gekleidet wie eine von ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wildblumen“ oder „die Blumen“; im Griechischen steht wörtlich „die Lilien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Achtet auf
  rationale: Der Aoristimperativ fordert zu bewusster, aufmerksamer Betrachtung auf. „Achtet auf“ ist natürliches modernes Deutsch und geht über bloßes Hinsehen hinaus.
- source_word: τὰ κρίνα
  choice: die Lilien
  rationale: κρίνα bezeichnet hier am ehesten Lilien. Die spezifische Pflanzenbezeichnung des griechischen Textes bleibt erhalten; mögliche allgemeinere Wiedergaben werden in der Fußnote genannt.
- source_word: πῶς αὐξάνει
  choice: wie sie wachsen
  rationale: Das griechische Neutrum Plural steht mit einem Verb im Singular; idiomatisches Deutsch verwendet den Plural. πῶς wird als „wie“ wiedergegeben.
- source_word: οὐ κοπιᾷ
  choice: Sie mühen sich nicht ab
  rationale: κοπιάω bezeichnet anstrengende Arbeit oder Mühe. „Sich abmühen“ gibt diese Intensität in heutigem Deutsch treffend wieder.
- source_word: οὐδὲ νήθει
  choice: und spinnen nicht
  rationale: νήθω bezeichnet das Spinnen von Fasern beziehungsweise Garn. Die knappe Wiedergabe bewahrt den Bezug zur Herstellung von Kleidung.
- source_word: λέγω δὲ ὑμῖν
  choice: Doch ich sage euch
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise den Übergang zur nachdrücklichen Schlussfolgerung.
- source_word: οὐδὲ Σολομὼν
  choice: Nicht einmal Salomo
  rationale: 'οὐδέ verstärkt die Verneinung: Selbst der für königliche Pracht bekannte Salomo erreicht den Vergleich nicht.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: in all seiner Herrlichkeit
  rationale: δόξα bezeichnet in diesem Zusammenhang königliche Pracht. „Herrlichkeit“ bewahrt zugleich die breitere biblische Bedeutungsresonanz.
- source_word: περιεβάλετο
  choice: war gekleidet
  rationale: Die mediale Form wird idiomatisch als Zustandsbeschreibung wiedergegeben, ohne eine handelnde Person oder Selbstbekleidung festzulegen.
- source_word: ὡς ἓν τούτων
  choice: wie eine von ihnen
  rationale: Das griechische Neutrum „eines von diesen“ bezieht sich auf die Lilien. Im Deutschen verlangt das feminine Bezugswort „Lilie“ die Form „eine von ihnen“.
theological_decisions:
- issue: Bezug des Blumenbildes
  choice: Die spezifische Wiedergabe „Lilien“ wird beibehalten.
  alternative: Blumen; Wildblumen
  rationale: Der griechische Text nennt ausdrücklich κρίνα. Die Verallgemeinerung ist botanisch oder kontextuell möglich, aber nicht erforderlich und wird daher nur als Übersetzungsalternative vermerkt.
- issue: Wiedergabe von δόξα bei Salomo
  choice: Herrlichkeit
  alternative: Pracht; Glanz
  rationale: Im Kontext ist königliche Pracht gemeint. „Herrlichkeit“ bleibt verständlich und bewahrt zugleich die weitere semantische und biblische Resonanz von δόξα.
- issue: Diathese von περιεβάλετο
  choice: war gekleidet
  alternative: kleidete sich
  rationale: Die Form kann medial verstanden werden, doch die idiomatische Zustandsbeschreibung vermeidet es, die im Griechischen nicht hervorgehobene Handlung oder Urheberschaft unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der rhetorische Gegensatz bleiben klar. „Sich abmühen“ ist gegenwärtig und anschaulich; „Herrlichkeit“ wahrt den biblischen Ton, ohne altertümlich zu wirken.
