id: LUK.12.51
reference: Luke 12:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: de
  text: Meint ihr, ich sei gekommen, um Frieden auf die Erde zu bringen?[a] Nein, sage ich euch, sondern vielmehr Entzweiung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Frieden auf der Erde zu geben“. „Zu bringen“ ist hier die natürlichere deutsche Ausdrucksweise.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Spaltung“ beziehungsweise „Trennung“. Gemeint ist im folgenden Zusammenhang besonders die Entzweiung innerhalb von Familien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: Meint ihr
  rationale: Die Wendung leitet eine rhetorische Frage ein und stellt die Annahme der Angesprochenen direkt infrage. „Meint ihr“ ist im modernen Deutsch natürlich und prägnant.
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ bewahrt die breite Bedeutung des griechischen Wortes; im Zusammenhang steht besonders der gesellschaftliche und familiäre Frieden im Blick.
- source_word: παρεγενόμην
  choice: ich sei gekommen
  rationale: Nach „Meint ihr“ ist im Deutschen die indirekte Rede mit Konjunktiv idiomatisch. Das Kommen Jesu und seine damit verbundene Absicht bleiben deutlich.
- source_word: δοῦναι
  choice: zu bringen
  rationale: Das Verb bedeutet wörtlich „zu geben“. In Verbindung mit Frieden und „auf die Erde“ ist „bringen“ im Deutschen natürlicher und gibt die beabsichtigte Bedeutung treffend wieder.
- source_word: ἐν τῇ γῇ
  choice: auf die Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Der weitere, weltbezogene Sinn ist hier wahrscheinlicher; „auf die Erde“ ist zudem die natürliche deutsche Verbindung mit „bringen“.
- source_word: οὐχί
  choice: Nein
  rationale: Die betonte Verneinung beantwortet die rhetorische Frage knapp und entschieden.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Die Formulierung bewahrt die direkte Anrede und den Nachdruck der geläufigen Redeformel.
- source_word: ἀλλ’ ἢ
  choice: sondern vielmehr
  rationale: Die Verbindung markiert nach der Verneinung einen scharfen Gegensatz. „Sondern vielmehr“ bildet diese verstärkte Gegenüberstellung natürlich ab.
- source_word: διαμερισμόν
  choice: Entzweiung
  rationale: Das Wort bezeichnet Teilung, Trennung oder Zwietracht. „Entzweiung“ passt besonders zum unmittelbar folgenden Bild auseinanderbrechender Familien und benennt eine zwischenmenschliche Spaltung, ohne den Gedanken auf offenen Streit zu verengen.
theological_decisions:
- issue: Spannung zwischen Jesu Friedensauftrag und der hier angekündigten Entzweiung
  choice: Der scharfe Gegensatz zwischen Frieden und Entzweiung bleibt ungemildert stehen.
  alternative: Die Aussage als bloß unbeabsichtigte Nebenwirkung abschwächen oder „Entzweiung“ interpretierend durch „Konflikt“ ersetzen.
  rationale: Der griechische Text formuliert bewusst zugespitzt. Der folgende Zusammenhang beschreibt die spaltende Wirkung von Jesu Auftreten selbst in Familien, ohne damit alle anderen neutestamentlichen Aussagen über Frieden aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die rhetorische Direktheit und der harte Gegensatz des Ausgangstextes werden bewahrt; der Konjunktiv nach „Meint ihr“ entspricht natürlichem deutschem Sprachgebrauch.
