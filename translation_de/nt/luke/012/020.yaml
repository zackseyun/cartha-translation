id: LUK.12.20
reference: Luke 12:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: de
  text: 'Doch Gott sagte zu ihm: »Du Narr! Noch in dieser Nacht fordert man dein Leben[a] von dir. Wem wird dann gehören, was du bereitgelegt hast?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Seele«. Das griechische Wort kann je nach Zusammenhang »Leben« oder »Seele« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Du Narr!
  rationale: Die direkte Anrede bewahrt die Schärfe des griechischen Vokativs und klingt im Deutschen natürlich und würdevoll.
- source_word: ταύτῃ τῇ νυκτί
  choice: Noch in dieser Nacht
  rationale: Die Formulierung gibt die zeitliche Unmittelbarkeit und Dringlichkeit idiomatisch wieder.
- source_word: ψυχήν
  choice: Leben
  rationale: Im Zusammenhang mit dem unmittelbar bevorstehenden Tod bezeichnet ψυχή am ehesten das Leben; die mögliche Wiedergabe »Seele« bleibt in einer Fußnote erhalten.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: fordert man ... von dir
  rationale: Das unbestimmte Subjekt der dritten Person Plural wird mit dem deutschen unpersönlichen »man« bewahrt, ohne konkrete Handelnde einzuführen. »Fordern« gibt den Anspruch wieder, ohne das im Griechischen nicht eigens ausgedrückte »zurück« hinzuzufügen.
- source_word: ἃ δὲ ἡτοίμασας
  choice: was du bereitgelegt hast
  rationale: Die Wendung verweist im Kontext natürlich auf die angesammelten Vorräte und bewahrt zugleich den allgemeinen Ausdruck des Griechischen.
- source_word: τίνι ἔσται
  choice: Wem wird dann gehören ...?
  rationale: Der Dativ bezeichnet hier idiomatisch den künftigen Besitzer; die deutsche Frage erhält die rhetorische Wirkung.
theological_decisions:
- issue: Wiedergabe von ψυχή angesichts des bevorstehenden Todes
  choice: Leben
  alternative: Seele
  rationale: »Leben« passt zum unmittelbaren Kontext des Todes und legt keine engere anthropologische Aussage fest. »Seele« wird als echte lexikalische Möglichkeit in der Fußnote genannt.
- issue: Unbestimmtes Subjekt von ἀπαιτοῦσιν
  choice: unpersönliches »man«
  alternative: 'Passiv: »dein Leben wird von dir gefordert«'
  rationale: Das unbestimmte pluralische Subjekt bleibt offen; weder Gott noch Engel oder andere Mächte werden ausdrücklich als Handelnde identifiziert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, prägnantem Erzählton. Die direkte Rede bleibt scharf; die rhetorische Schlussfrage wird natürlich formuliert.
