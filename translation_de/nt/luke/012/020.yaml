  terminology: „Leben“ ist für ψυχή im Kontext des noch in derselben Nacht eintretenden Todes die naheliegende Wiedergabe. Die Fußnote nennt „Seele“ sachlich als lexikalische Alternative, ohne eine anthropologische oder konfessionelle Deutung festzulegen. „bereitgelegt“ passt zu ἡτοίμασας und zum Kontext angesammelter Güter.
