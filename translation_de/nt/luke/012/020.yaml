  source_fidelity: Die Übersetzung gibt die Anrede Ἄφρων treffend als „Du Narr!“ wieder, bewahrt die Dringlichkeit von ταύτῃ τῇ νυκτί mit „Noch in dieser Nacht“ und übersetzt ψυχή im vorliegenden Todeskontext angemessen mit „Leben“. Das unbestimmte Pluralsubjekt von ἀπαιτοῦσιν bleibt durch „man“ offen; es werden keine im griechischen Text nicht genannten Handelnden bestimmt. Die Schlussfrage gibt die Besitzfrage von τίνι ἔσται natürlich und sachgerecht wieder.
