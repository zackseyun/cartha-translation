  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: de
  text: 'Da sagte jemand aus der Menge zu ihm: „Lehrer, sag meinem Bruder, er soll das Erbe mit mir teilen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Da sagte
  rationale: δέ ist ein schwaches Bindewort; „Da“ führt die Erzählung natürlich weiter, ohne einen starken Gegensatz auszudrücken.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: jemand aus der Menge
  rationale: Die unbestimmte Person und ihre Zugehörigkeit zur versammelten Menge werden idiomatisch und genau wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Der Dativ bezeichnet den Adressaten, im Kontext Jesus.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die Anrede bezeichnet einen Lehrenden; „Lehrer“ gibt den schlichten Sinn in modernem Deutsch wieder, ohne zusätzliche Autoritätsnuancen einzutragen.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: sag meinem Bruder
  rationale: Der Imperativ von λέγω fordert Jesus auf, sich an den Bruder zu wenden; diese Konstruktion ist im Deutschen natürlich.
- source_word: μερίσασθαι μετ’ ἐμοῦ
  choice: er soll ... mit mir teilen
  rationale: Der Infinitiv bezeichnet das Aufteilen beziehungsweise Teilen unter Beteiligung des Sprechers. Die deutsche Konstruktion mit „soll“ gibt die vom Verb „sag“ abhängige Aufforderung klar wieder.
- source_word: τὴν κληρονομίαν
  choice: das Erbe
  rationale: „Erbe“ ist der natürliche, umfassende deutsche Ausdruck für den ererbten Besitz und legt die genaue rechtliche Lage nicht unnötig fest.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die Formulierung „mit mir teilen“ bewahrt die mögliche Bedeutung eines Aufteilens beziehungsweise Zuteilens, ohne die nicht genannte erbrechtliche Einzelkonstellation festzulegen.
