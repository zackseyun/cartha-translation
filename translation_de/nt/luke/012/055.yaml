  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: de
  text: 'Und wenn der Südwind weht, sagt ihr: »Es wird drückend heiß«, und so kommt es.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: Südwind
  rationale: νότος kann »Süden« oder »Südwind« bedeuten. Zusammen mit πνέοντα ist eindeutig der aus Süden wehende Wind gemeint; »Südwind« ist im Deutschen natürlich und präzise.
- source_word: πνέοντα
  choice: weht
  rationale: Das Partizip beschreibt den Wind in seiner gegenwärtigen Bewegung. Der deutsche finite Nebensatz »wenn der Südwind weht« gibt die Konstruktion idiomatisch und ohne den im Griechischen nicht vorhandenen Zusatz »ihr seht« wieder.
- source_word: λέγετε
  choice: sagt ihr
  rationale: Das Präsens bezeichnet das übliche Verhalten der Angesprochenen; das einfache deutsche Präsens bewahrt diesen allgemeinen, wiederholten Sinn.
- source_word: Καύσων
  choice: drückend heiß
  rationale: καύσων bezeichnet starke, sengende beziehungsweise belastende Hitze. Die prädikative Wendung »es wird drückend heiß« vermittelt die Intensität in natürlichem modernem Deutsch, ohne den modern-technischen Begriff »Hitzewelle« einzuführen.
- source_word: ἔσται
  choice: es wird
  rationale: Das Futur kündigt den bevorstehenden Hitzezustand an. »Es wird drückend heiß« ist die natürliche deutsche Wetterformulierung.
- source_word: γίνεται
  choice: so kommt es
  rationale: γίνεται bestätigt, dass die Vorhersage eintritt. »So kommt es« ist knapp, idiomatisch und stellt den Bezug zur vorausgesagten Wetterlage klar her.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Wetterbeispiel; ein Wahrnehmungsverb wie »sehen« wird nicht ergänzt.
