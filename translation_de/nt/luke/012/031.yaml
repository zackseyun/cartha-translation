  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: de
  text: Vielmehr sucht sein Reich[b][a], und dies wird euch hinzugefügt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gottes Reich«; im Griechischen steht »sein Reich«, wobei sich der Bezug aus dem Zusammenhang ergibt.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lesen »das Reich Gottes« statt »sein Reich«.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert knapp und natürlich den Gegensatz zur zuvor untersagten Sorge um die Lebensbedürfnisse.
- source_word: ζητεῖτε
  choice: sucht
  rationale: Der Präsensimperativ bezeichnet eine fortdauernde Ausrichtung; der deutsche Imperativ kann diese Bedeutung ohne den Zusatz »weiterhin« tragen.
- source_word: βασιλείαν
  choice: Reich
  rationale: »Reich« ist die geläufige Wiedergabe und lässt sowohl Gottes Herrschaft als auch ihren Wirkungsbereich anklingen.
- source_word: αὐτοῦ
  choice: sein
  rationale: Bewahrt die pronominale Form des griechischen Textes; aus dem Kontext ergibt sich Gott als Bezugsperson.
- source_word: ταῦτα
  choice: dies
  rationale: Verweist auf die zuvor genannten Lebensbedürfnisse und fügt nicht das im SBLGNT hier fehlende »alles« aus der matthäischen Parallele hinzu.
- source_word: προστεθήσεται
  choice: wird … hinzugefügt werden
  rationale: Gibt das Futur Passiv und das Bild des Hinzufügens formal wieder; idiomatischer wäre »wird … dazugegeben werden«.
- source_word: ὑμῖν
  choice: euch
  rationale: Gibt den Dativ in der deutschen Passivkonstruktion unmittelbar wieder.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: Das Pronomen wird als »sein« wiedergegeben und bezieht sich im Kontext auf Gott.
  alternative: »Gottes Reich« macht den Bezug ausdrücklich.
  rationale: Der Kontext nennt den Vater und Gottes Fürsorge. Die pronominale Wiedergabe bewahrt dennoch die Form und geringe Restimplizitheit des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Doch« hält den adversativen Anschluss knapp; die bewusst formnahe Wendung »hinzugefügt werden« bewahrt das griechische Bild. Die Fußnotenmarker stehen wie in der konsultierten POB-Schicht unmittelbar nach »Reich«.
