  - severity: low
    issue: »Doch« für πλὴν
    rationale: »Doch« ist nicht falsch, aber »Vielmehr« bringt den korrigierenden Kontrast zur unmittelbar vorausgehenden Aufforderung, nicht nach Nahrung und Kleidung zu suchen, genauer zur Geltung.
