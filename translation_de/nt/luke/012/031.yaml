  source_fidelity: 'Die Grundbedeutung ist zutreffend: Der Imperativ ζητεῖτε, »sein Reich«, ταῦτα ohne ergänztes »alles« und das Futurpassiv werden sachgerecht wiedergegeben. »Dann« fügt jedoch gegenüber dem bloß verbindenden καί eine zeitlich-konsekutive Nuance hinzu. πλὴν ist hier nach dem vorhergehenden Verbot sorgenvollen Strebens präziser mit »Vielmehr« wiedergegeben als mit dem schwächer adversativen »Doch«.'
  naturalness: »Vielmehr sucht sein Reich, und dies wird euch hinzugefügt werden« ist modernes, würdiges Standarddeutsch. Die Passivform bleibt bewusst nah am griechischen Bild des Hinzufügens und ist dabei verständlich.
