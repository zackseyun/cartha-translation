base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: de
  text: Denn der Heilige Geist wird euch in eben dieser Stunde lehren, was ihr sagen müsst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in derselben Stunde“. Der griechische Ausdruck hebt den genauen Zeitpunkt hervor, an dem die Hilfe nötig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Bewahrt die begründende Verbindung zur vorausgehenden Zusage und klingt im Deutschen natürlich.
- source_word: τὸ ἅγιον πνεῦμα
  choice: der Heilige Geist
  rationale: Die übliche moderne Wiedergabe der bestimmten griechischen Wortgruppe; der Geist erscheint hier als handelndes Subjekt.
- source_word: διδάξει
  choice: wird lehren
  rationale: Gibt das Futur Aktiv von διδάσκω direkt wieder und bewahrt den Charakter einer Zusage.
- source_word: ὑμᾶς
  choice: euch
  rationale: Kennzeichnet anders als das englische „you“ eindeutig die angesprochene Mehrzahl.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: in genau dieser Stunde
  rationale: „Genau“ bringt die durch αὐτῇ gesetzte Hervorhebung des entscheidenden Zeitpunkts natürlich zum Ausdruck; „dieser“ nimmt die im Zusammenhang erwartete Stunde auf.
- source_word: ἃ
  choice: was
  rationale: Natürliche deutsche Wiedergabe des substantivisch gebrauchten sächlichen Relativpronomens im Plural.
- source_word: δεῖ
  choice: müsst
  rationale: Drückt die vom griechischen unpersönlichen Verb bezeichnete Notwendigkeit klar aus, ohne deren genaue Quelle zusätzlich festzulegen.
- source_word: εἰπεῖν
  choice: sagen
  rationale: In der Verbindung mit δεῖ die idiomatische und genaue Wiedergabe dessen, was gesprochen werden soll.
theological_decisions:
- issue: Handlungsrolle des Heiligen Geistes
  choice: Der Heilige Geist wird als handelndes Subjekt bezeichnet, das die Jünger lehren wird.
  alternative: Der Ausdruck könnte als unpersönliche göttliche Einwirkung umschrieben werden.
  rationale: Das griechische Satzgefüge setzt „der Heilige Geist“ ausdrücklich als Subjekt des aktiven Verbs „wird lehren“; die Übersetzung bewahrt diese personale Ausdrucksweise, ohne spätere dogmatische Formulierungen hinzuzufügen.
- issue: Art der mit δεῖ bezeichneten Notwendigkeit
  choice: „was ihr sagen müsst“
  alternative: „was ihr sagen sollt“
  rationale: „Müsst“ gibt die Notwendigkeit von δεῖ unmittelbar wieder. Der Vers selbst lässt offen, ob dabei stärker an situative Erfordernis oder göttliche Bestimmung zu denken ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist eng am griechischen Satzbau orientiert, bleibt aber gut verständlich. „In genau dieser Stunde“ bewahrt die zeitliche Hervorhebung; die Fußnote nennt formal nähere Alternativen.
