id: LUK.12.30
reference: Luke 12:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: de
  text: Denn nach all dem streben die Völker der Welt[a]; euer Vater aber weiß, dass ihr das braucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Heiden der Welt«. Der griechische Ausdruck kann »Völker« oder »Heiden« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: all dem
  rationale: Die Formulierung verweist zusammenfassend auf die zuvor genannten Lebensbedürfnisse und klingt im Deutschen natürlich.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: die Völker der Welt
  rationale: ἔθνη kann sowohl »Völker« als auch »Heiden« bedeuten. »Völker der Welt« bewahrt die breite, wörtliche Bedeutung; die mögliche heilsgeschichtliche Nuance wird in der Fußnote genannt.
- source_word: ἐπιζητοῦσιν
  choice: streben ... nach
  rationale: Das Verb bezeichnet ein nachdrückliches Suchen oder Verfolgen. »Nach etwas streben« gibt die aktive Ausrichtung idiomatisch wieder.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: euer Vater
  rationale: Dies entspricht genau dem griechischen Text; »himmlischer« wird nicht aus der matthäischen Parallele ergänzt.
- source_word: οἶδεν
  choice: weiß
  rationale: Das formal perfektische οἶδα hat hier präsentische Bedeutung und wird im Deutschen natürlich mit »weiß« wiedergegeben.
- source_word: χρῄζετε
  choice: ihr ... braucht
  rationale: Die schlichte moderne Formulierung gibt die Bedeutung »nötig haben« klar wieder.
- source_word: τούτων
  choice: das
  rationale: Das deutsche Demonstrativpronomen nimmt »all dem« natürlich wieder auf, ohne den Bezug auf die genannten Bedürfnisse zu verlieren.
theological_decisions:
- issue: Gegensatz zwischen weltlichem Streben und dem Vertrauen der Jünger auf Gott als Vater
  choice: »die Völker der Welt« und »euer Vater« ohne deutende Ergänzung
  alternative: »die Heiden der Welt« beziehungsweise »euer himmlischer Vater«
  rationale: Die Übersetzung erhält den im Text gesetzten Gegensatz, ohne ἔθνη unnötig einzuengen oder »himmlisch« aus einer Parallelstelle einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Klang. Die Satzstellung hebt entsprechend dem Griechischen zunächst das Streben der Weltvölker und danach den Gegensatz zu »euer Vater« hervor.
