  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: de
  text: 'Und der Herr sagte: „Wer ist nun der treue und kluge Verwalter, den der Hausherr über seine Dienerschaft einsetzen wird, damit er ihr zur rechten Zeit die zugemessene Essensportion[a] gibt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die zugemessene Getreideration“, also den jedem Bediensteten zugeteilten Nahrungsteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Herr / Hausherr
  rationale: Beim erzählerischen Bezug auf Jesus ist „der Herr“ die natürliche Wiedergabe. Innerhalb des Bildwortes bezeichnet dasselbe griechische Wort den Herrn eines Hauses; „Hausherr“ macht diese Bezugsebene im Deutschen klar, ohne den Bedeutungsumfang zu verändern.
- source_word: πιστός
  choice: treu
  rationale: Das Wort bezeichnet hier Zuverlässigkeit in einer anvertrauten Aufgabe; „treu“ ist in diesem Zusammenhang klar und traditionsnah.
- source_word: φρόνιμος
  choice: klug
  rationale: Gemeint ist praktische Einsicht und umsichtiges Handeln. „Klug“ ist im heutigen Deutsch natürlicher als „verständig“ oder „besonnen“ und bewahrt den Weisheitsaspekt.
- source_word: οἰκονόμος
  choice: Verwalter
  rationale: Das Wort bezeichnet eine Person, der die Leitung eines Haushalts oder Besitzes anvertraut ist. „Verwalter“ bringt Verantwortung und Beauftragung prägnant zum Ausdruck.
- source_word: καταστήσει
  choice: einsetzen wird
  rationale: καθίστημι bezeichnet hier die Übertragung einer verantwortlichen Stellung. „Einsetzen“ ist idiomatisch und lässt offen, ob der Vorgang formal als Ernennung zu verstehen ist.
- source_word: θεραπεία
  choice: Dienerschaft
  rationale: Hier ist nicht abstrakt „Dienst“ oder „Pflege“ gemeint, sondern die Gesamtheit der Bediensteten eines Hauses. „Dienerschaft“ erhält diesen kollektiven Sinn.
- source_word: ἐν καιρῷ
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den passenden beziehungsweise vorgesehenen Zeitpunkt. „Zur rechten Zeit“ ist natürlich und würdevoll.
- source_word: σιτομέτριον
  choice: zugemessene Essensportion
  rationale: Das seltene Wort bezeichnet eine abgemessene, ursprünglich getreidebezogene Nahrungsration. Die Haupttextformulierung vermittelt Funktion und Zumessung verständlich; die konkrete Getreidebedeutung wird in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des zweimaligen κύριος auf zwei Erzählebenen
  choice: „der Herr“ für Jesus und „der Hausherr“ für die Gestalt innerhalb des Bildwortes
  alternative: An beiden Stellen „der Herr“
  rationale: Das Griechische verwendet dasselbe Wort, doch die kontextbezogene Differenzierung verhindert im Deutschen eine unnötige Verwechslung zwischen Jesus als Sprecher und dem Besitzer des Hauses im Bildwort. Die mögliche Verbindung zwischen beiden Ebenen wird dadurch nicht geleugnet.
- issue: Charakterisierung des Verwalters durch πιστός und φρόνιμος
  choice: „treu und klug“
  alternative: „zuverlässig und verständig“
  rationale: Die Formulierung wahrt sowohl die anvertraute Treue als auch die praktische Einsicht, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Dienerschaft“ bewahrt den historischen Haushaltsrahmen; „zugemessene Essensportion“ vermeidet das heute missverständliche „Lebensmittelzuteilung“ und erklärt zugleich den Verteilungsgedanken.
