  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: de
  text: Doch ich muss eine Taufe durchmachen[a][b], und wie sehr bin ich bedrängt[c], bis sie vollendet ist!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich habe eine Taufe, mit der ich getauft werden muss.« Das Griechische wiederholt den Wortstamm und hebt so das Taufbild hervor.'
    reason: lexical_alternative
  - marker: b
    text: Die »Taufe« ist hier bildlich zu verstehen und bezieht sich im Zusammenhang auf das überwältigende Leiden und Sterben, das Jesus bevorsteht.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »wie sehr stehe ich unter Druck« beziehungsweise »wie sehr bin ich eingeengt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: eine Taufe
  rationale: Die wörtliche Bildsprache bleibt erhalten. Das Wort bezeichnet hier metaphorisch ein überwältigendes Geschehen, soll aber nicht im Haupttext zu »Leiden« oder »Tod« aufgelöst werden.
- source_word: ἔχω βαπτισθῆναι
  choice: ich muss noch eine Taufe auf mich nehmen
  rationale: ἔχω mit Infinitiv bezeichnet hier etwas Bevorstehendes, dem Jesus sich unterziehen muss. Die deutsche Wendung ist natürlich und bewahrt das Taufbild, ohne die im Deutschen schwerfällige Wiederholung »mit einer Taufe getauft werden« in den Haupttext zu setzen.
- source_word: πῶς
  choice: wie sehr
  rationale: Das exklamative πῶς drückt den hohen Grad der folgenden inneren Bedrängnis aus; »wie sehr« entspricht natürlichem modernem Deutsch.
- source_word: συνέχομαι
  choice: bin ich bedrängt
  rationale: Die Form kann ein inneres Bedrängt-, Eingeengt- oder Unter-Druck-Stehen ausdrücken. »bedrängt« wahrt diese Bedeutungsbreite, ohne die Empfindung genauer festzulegen, als es der griechische Text tut.
- source_word: ἕως ὅτου
  choice: bis
  rationale: Die Verbindung bezeichnet den zeitlichen Endpunkt und wird im Deutschen knapp und idiomatisch mit »bis« wiedergegeben.
- source_word: τελεσθῇ
  choice: sie vollendet ist
  rationale: Das Passiv von τελέω bezeichnet das Zu-Ende-Bringen des angekündigten Geschehens. »vollendet« erhält sowohl den Abschluss- als auch den Zielgedanken, ohne die Formulierung aus Johannes 19,30 einzutragen.
theological_decisions:
- issue: Metaphorischer Bezug der »Taufe«
  choice: Das Taufbild bleibt im Haupttext stehen; eine Fußnote erläutert den wahrscheinlichen Bezug auf Jesu bevorstehendes Leiden und Sterben.
  alternative: Die Metapher unmittelbar als »Leiden« oder »Tod« wiederzugeben oder sie als wörtliche Wassertaufe zu verstehen.
  rationale: Der Zusammenhang weist auf Jesu bevorstehende Passion, doch der griechische Text spricht bewusst bildhaft von einer Taufe. Die Übersetzung bewahrt dieses Bild und löst die theologische und literarische Spannung nicht stillschweigend auf.
- issue: Bedeutungsbreite von συνέχομαι
  choice: »bin ich bedrängt«
  alternative: »stehe ich unter Druck« oder »bin ich eingeengt«
  rationale: Die gewählte Formulierung lässt offen, ob vor allem innere Not, äußerer Druck oder ein Gefühl des Eingeengtseins gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »auf mich nehmen« vermeidet eine unnatürliche deutsche Wortwiederholung, während »Taufe« die prägende Metapher ausdrücklich bewahrt. Das einleitende »Doch« gibt δέ als leichten Gegensatz beziehungsweise Übergang wieder; »noch« verdeutlicht idiomatisch den bevorstehenden Charakter der Aussage.
