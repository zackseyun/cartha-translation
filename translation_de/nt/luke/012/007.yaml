id: LUK.12.7
reference: Luke 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: de
  text: Doch sogar die Haare auf eurem Kopf sind alle gezählt. Fürchtet euch nicht! Ihr seid mehr wert als viele Spatzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Doch sogar
  rationale: Gibt sowohl den Gegensatz durch ἀλλά als auch die steigernde Kraft von καί natürlich wieder und knüpft an die vorausgehende Zusicherung an.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν
  choice: die Haare auf eurem Kopf
  rationale: Bewahrt das konkrete Bild der griechischen Genitivverbindung in natürlichem modernem Deutsch.
- source_word: πᾶσαι ἠρίθμηνται
  choice: sind alle gezählt
  rationale: Der Perfektpassiv bezeichnet eine vollzogene Zählung mit fortbestehendem Ergebnis. Die Formulierung ist knapp, gegenwärtig verständlich und vermittelt genaue Kenntnis.
- source_word: μὴ φοβεῖσθε
  choice: Fürchtet euch nicht!
  rationale: Direkte, idiomatische Wiedergabe des verneinten Präsensimperativs; die traditionelle Form ist im modernen Standarddeutsch weiterhin klar und würdig.
- source_word: πολλῶν στρουθίων
  choice: viele Spatzen
  rationale: Erhält die konkrete Vogelbezeichnung und den Zusammenhang mit den unmittelbar zuvor genannten Spatzen.
- source_word: διαφέρετε
  choice: ihr seid mehr wert als
  rationale: Im Kontext bezeichnet διαφέρω einen vergleichenden Wert. Diese Formulierung ist natürlich und macht den Schluss vom Geringeren auf das Größere deutlich.
theological_decisions:
- issue: Vergleichender Wert der Jünger gegenüber den Spatzen
  choice: Ihr seid mehr wert als viele Spatzen
  alternative: Ihr übertrefft viele Spatzen
  rationale: Die gewählte Fassung gibt den kontextuellen Wertvergleich klar wieder, ohne daraus eine umfassendere philosophische Aussage über menschlichen Wert abzuleiten.
- issue: Unausgesprochenes handelndes Subjekt beim Passiv ἠρίθμηνται
  choice: 'Passiv beibehalten: „sind alle gezählt“'
  alternative: Gott hat sie alle gezählt
  rationale: Der Zusammenhang legt Gottes Wissen nahe, doch der griechische Text nennt das handelnde Subjekt nicht ausdrücklich. Das Passiv bewahrt diese formale Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die vertraute Wendung „Fürchtet euch nicht“ bleibt natürlich; Satzbau und Wortwahl vermeiden sowohl Archaismen als auch unnötige Ausdeutung.
