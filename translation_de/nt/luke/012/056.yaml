source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: de
  text: Ihr Heuchler! Das Aussehen der Erde und des Himmels könnt ihr beurteilen. Wie könnt ihr dann diese Zeit[a] nicht beurteilen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese entscheidende Zeit“ beziehungsweise „diesen entscheidenden Zeitpunkt“. Das griechische Wort kann eine besonders bedeutsame oder günstige Zeit bezeichnen, nicht nur Zeit im Allgemeinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ihr Heuchler
  rationale: Der Vokativ ist eine direkte, scharfe Anrede. „Heuchler“ gibt hier den etablierten moralischen Sinn wieder, nicht den wörtlichen Bühnenschauspieler.
- source_word: τὸ πρόσωπον
  choice: das Aussehen
  rationale: Im Ausdruck vom „Angesicht“ der Erde und des Himmels bezeichnet πρόσωπον deren sichtbare Erscheinung. „Aussehen“ ist im modernen Deutschen natürlich und wahrt das Bild hinreichend.
- source_word: τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: der Erde und des Himmels
  rationale: Die Paarung bezeichnet den sichtbaren irdischen und himmlischen Bereich, besonders im Zusammenhang mit Wetterzeichen. „Himmel“ ist im Deutschen auch dafür die übliche Bezeichnung.
- source_word: οἴδατε δοκιμάζειν
  choice: könnt ihr beurteilen
  rationale: οἴδατε mit Infinitiv bezeichnet Wissen beziehungsweise Fähigkeit; δοκιμάζειν meint hier prüfend erkennen oder beurteilen. Die knappe Formulierung ist idiomatisch und erhält die Wiederholung.
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: diese Zeit
  rationale: καιρός kann eine bedeutsame, entscheidende oder günstige Zeit bezeichnen. „Diese Zeit“ folgt dem Griechischen eng, ohne die konkrete theologische Bedeutung vorwegzunehmen.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: Wie könnt ihr dann … nicht beurteilen?
  rationale: Die Formulierung bewahrt die empörte rhetorische Frage. „Dann“ gibt den kontrastierenden Anschluss durch δέ natürlich wieder.
theological_decisions:
- issue: Bedeutung von καιρός in Jesu Vorwurf
  choice: diese Zeit
  alternative: diese entscheidende Zeit / diesen entscheidenden Zeitpunkt
  rationale: Der Zusammenhang legt eine heilsgeschichtlich bedeutsame Zeit nahe, doch der Haupttext soll diese Bedeutung nicht enger festlegen als das griechische καιρός. Eine Fußnote hält die qualitative Nuance offen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdevoller, direkter Schärfe. Die parallele Wiederholung von „beurteilen“ bildet die rhetorische Gegenüberstellung des griechischen Textes ab.
