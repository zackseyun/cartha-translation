source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: de
  text: 'Doch das sollt ihr wissen: Wenn der Hausherr gewusst hätte, zu welcher Stunde der Dieb kommen würde, hätte er nicht zugelassen, dass in sein Haus eingebrochen würde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass sein Haus durchgraben würde“. Gemeint ist das Durchbrechen einer Hauswand, um einzudringen.'
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Doch das sollt ihr wissen
  rationale: Das präsentische Imperativ γινώσκετε richtet eine direkte Aufforderung an mehrere Personen. „Das sollt ihr wissen“ klingt im modernen Deutschen natürlich und nachdrücklich; „doch“ gibt den Übergang durch δέ wieder.
- source_word: οἰκοδεσπότης
  choice: der Hausherr
  rationale: „Hausherr“ bezeichnet verständlich den Verantwortlichen beziehungsweise Herrn des Hauses und bewahrt mehr vom sozialen Gehalt des griechischen Ausdrucks als „Hausbesitzer“.
- source_word: ποίᾳ ὥρᾳ
  choice: zu welcher Stunde
  rationale: Die Formulierung bewahrt die ausdrückliche Zeitangabe ὥρα und fügt sich in das Motiv der Wachsamkeit ein, ohne unnatürlich zu wirken.
- source_word: ὁ κλέπτης ἔρχεται
  choice: der Dieb kommt
  rationale: Das Präsens des griechischen ἔρχεται wird beibehalten. Im Deutschen kann das Präsens innerhalb der indirekten Frage ein erwartetes zukünftiges Eintreffen natürlich ausdrücken.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: hätte er nicht zugelassen
  rationale: Die Kombination aus ἄν und Aorist gibt die irreale Folge wieder; der deutsche Konjunktiv II der Vergangenheit drückt diesen kontrafaktischen Sinn klar aus.
- source_word: διορυχθῆναι τὸν οἶκον αὐτοῦ
  choice: dass in sein Haus eingebrochen wird
  rationale: Die idiomatische deutsche Wendung vermittelt den gemeinten gewaltsamen Einbruch verständlich. Das konkrete Bild des Durchgrabens einer Hauswand wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die kontrafaktische Satzstruktur bleibt klar erkennbar; das antike Bild hinter διορύσσω wird zugunsten unmittelbarer Verständlichkeit im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
