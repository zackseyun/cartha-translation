id: LUK.12.3
reference: Luke 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: de
  text: Darum wird alles, was ihr in der Dunkelheit gesagt habt, im Licht gehört werden; und was ihr in den inneren Räumen jemandem ins Ohr gesagt habt, wird auf den Hausdächern[a] verkündet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Hausdächern aus“. Gemeint ist die öffentliche Bekanntmachung von den flachen Hausdächern aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Darum
  rationale: Die Wendung zieht aus der Aussage des vorigen Verses eine Folgerung. „Darum“ gibt diese Schlussfolgerung knapp und natürlich wieder.
- source_word: ὅσα
  choice: alles, was
  rationale: Die Formulierung gibt den umfassenden, unbestimmten Relativsinn idiomatisch wieder.
- source_word: ἐν τῇ σκοτίᾳ
  choice: in der Dunkelheit
  rationale: So bleibt der bildhafte Gegensatz zu „im Licht“ sowie die mögliche Bedeutung verborgenen Redens erhalten.
- source_word: ἀκουσθήσεται
  choice: wird … gehört werden
  rationale: Das Futur Passiv wird direkt wiedergegeben und bewahrt das Motiv, dass Verborgenes öffentlich wahrnehmbar wird.
- source_word: πρὸς τὸ οὖς
  choice: jemandem ins Ohr
  rationale: Die anschauliche Redewendung für vertrauliches, nicht öffentliches Reden bleibt erhalten; „jemandem“ macht die deutsche Konstruktion natürlich, ohne den Sinn einzuengen.
- source_word: ἐν τοῖς ταμείοις
  choice: in den inneren Räumen
  rationale: ταμεῖον kann einen inneren, abgeschlossenen Raum, eine Kammer oder einen Vorratsraum bezeichnen. Im Zusammenhang steht die Abgeschiedenheit im Vordergrund.
- source_word: κηρυχθήσεται
  choice: wird … verkündet werden
  rationale: Das Wort bezeichnet öffentliches Ausrufen oder Bekanntmachen; „verkündet“ bewahrt diesen Sinn, ohne ihn auf eine Predigt zu verengen.
- source_word: ἐπὶ τῶν δωμάτων
  choice: auf den Hausdächern
  rationale: Die Übersetzung folgt der räumlichen Formulierung des Griechischen und bewahrt das Bild einer weithin hörbaren öffentlichen Bekanntmachung von flachen Dächern aus.
theological_decisions:
- issue: Art und Zeitpunkt der Offenlegung des Verborgenen
  choice: Die Aussage bleibt eine allgemeine Warnung, dass heimlich Gesagtes öffentlich werden wird.
  alternative: Die Offenlegung ausdrücklich entweder auf das Endgericht oder auf eine geschichtliche Entlarvung der Heuchelei beziehen.
  rationale: Der Zusammenhang handelt von der Aufdeckung des Verborgenen, doch der Vers legt weder Zeitpunkt noch Mittel dieser Offenlegung eindeutig fest. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallelen Gegensätze „Dunkelheit/Licht“ und „innere Räume/Hausdächer“ bleiben deutlich erhalten.
