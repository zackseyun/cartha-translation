  source_fidelity: 'Der Vers wird inhaltlich zuverlässig wiedergegeben: ἀνθ’ ὧν ist folgerichtig mit „Darum“ erfasst; die Gegensätze Dunkelheit/Licht und innerer Raum/Hausdach bleiben bestehen. „jemandem ins Ohr“ ist eine natürliche Entfaltung der griechischen Redewendung πρὸς τὸ οὖς und legt keine zusätzliche inhaltliche Bestimmung fest. Die Zukunftspassive und der öffentliche Charakter von κηρυχθήσεται sind gewahrt.'
