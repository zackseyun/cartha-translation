  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: de
  text: Wenn ihr also nicht einmal das Geringste tun könnt, warum macht ihr euch um das Übrige Sorgen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Wenn ihr also
  rationale: Bewahrt sowohl die Bedingung als auch den Folgerungszusammenhang mit dem vorausgehenden Argument.
- source_word: οὐδὲ ἐλάχιστον
  choice: nicht einmal das Geringste
  rationale: Das substantivisch gebrauchte Neutrum bezeichnet die geringste oder kleinste Sache; die Formulierung bleibt knapp und erhält den rhetorischen Vergleich.
- source_word: δύνασθε
  choice: tun könnt
  rationale: Gibt die Fähigkeit ausgedrückt durch δύναμαι idiomatisch wieder; „tun“ ergänzt das im Griechischen sinngemäß vorausgesetzte Tätigkeitswort.
- source_word: τί
  choice: warum
  rationale: Das Fragewort hat in dieser rhetorischen Konstruktion kausalen Sinn und fragt nach dem Grund.
- source_word: περὶ τῶν λοιπῶν
  choice: um das Übrige
  rationale: Bezeichnet die übrigen Angelegenheiten jenseits dessen, was zuvor als das Geringste bezeichnet wurde.
- source_word: μεριμνᾶτε
  choice: macht ihr euch … Sorgen
  rationale: Gibt die anhaltende Sorge oder Ängstlichkeit natürlich wieder, ohne jede vernünftige Fürsorge grundsätzlich auszuschließen.
theological_decisions:
- issue: Bedeutung von μεριμνάω in Jesu Lehre über das Vertrauen auf Gott
  choice: sich Sorgen machen
  alternative: besorgt sein; sich sorgen
  rationale: Die Formulierung bezeichnet belastende Sorge, ohne den Satz als Verbot jeder vorausschauenden oder verantwortlichen Fürsorge auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die rhetorische Logik und die Ellipse des griechischen Textes bleiben erkennbar; „tun“ wird nur zur natürlichen deutschen Syntax ergänzt.
