reference: Luke 12:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: de
  text: 'Dann sagte er zu seinen Jüngern: »Darum sage ich euch: Sorgt euch nicht um euer Leben[a], was ihr essen sollt, und auch nicht um euren Körper, was ihr anziehen sollt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Seele«; das griechische Wort bezeichnet hier wahrscheinlich das Leben im Sinn der irdischen Existenz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Dann sagte er
  rationale: δέ ist hier ein schwaches Bindewort. »Dann« gibt den erzählerischen Fortgang im modernen Deutsch natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: zu seinen Jüngern
  rationale: Das ausdrücklich gesetzte αὐτοῦ wird mit »seinen« wiedergegeben; »Jünger« ist in diesem Zusammenhang die übliche und verständliche Entsprechung für μαθηταί.
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung verweist auf das Vorangehende und zieht daraus eine Folgerung. »Darum« bewahrt diese rückbezügliche, folgernde Funktion knapp und idiomatisch.
- source_word: λέγω ὑμῖν
  choice: sage ich euch
  rationale: Die direkte Anrede und die schlichte Aussage des griechischen Ausdrucks bleiben erhalten.
- source_word: μὴ μεριμνᾶτε
  choice: Sorgt euch nicht
  rationale: μεριμνάω bezeichnet hier sorgenvolles, beunruhigtes Beschäftigtsein. Die reflexive Formulierung ist natürliches, würdiges Deutsch und unterscheidet sich von verantwortlicher Fürsorge.
- source_word: τῇ ψυχῇ
  choice: um euer Leben
  rationale: ψυχή bezeichnet hier angesichts der Zuordnung von Nahrung zum Leben die irdische Lebensexistenz, nicht eindeutig eine vom Körper unterschiedene Seele. Die traditionelle Alternative wird in der Fußnote offengelegt.
- source_word: τί φάγητε
  choice: was ihr essen sollt
  rationale: Der deliberative Konjunktiv wird im Deutschen idiomatisch mit »sollt« wiedergegeben und bezeichnet den Gegenstand der Sorge, ohne ein göttliches Gebot zu behaupten.
- source_word: μηδὲ τῷ σώματι
  choice: und auch nicht um euren Körper
  rationale: μηδέ verbindet das zweite Glied der verneinten Aufforderung mit dem ersten. »Und auch nicht« bildet die griechische Parallelstruktur im Deutschen klar ab.
- source_word: τί ἐνδύσησθε
  choice: was ihr anziehen sollt
  rationale: Das Medium von ἐνδύω bedeutet hier, Kleidung anzuziehen. Die Formulierung entspricht parallel dem vorangehenden »was ihr essen sollt«.
theological_decisions:
- issue: Bedeutung von ψυχή in diesem Zusammenhang
  choice: Leben
  alternative: Seele
  rationale: Die unmittelbare Gegenüberstellung ordnet der ψυχή die Nahrung und dem σώμα die Kleidung zu. Daher steht ψυχή hier am ehesten für das irdische Leben beziehungsweise die Lebensexistenz. Die Fußnote bewahrt die lexikalische Breite, ohne eine anthropologische Zweiteilung in den Text hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die paarige Struktur von Leben/Nahrung und Körper/Kleidung bleibt deutlich erhalten; unnötige Fachsprache und konfessionell geprägte Deutungen werden vermieden.
