  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: die narrative Fortführung, die ausdrückliche Bezugnahme auf seine Jünger, die begründende Folgerung („Darum“), das Verbot sorgenvollen Grübelns sowie die Parallelen Leben/Nahrung und Körper/Kleidung. „Leben“ ist für ψυχή in diesem Kontext die sachgerechte Hauptwiedergabe.'
