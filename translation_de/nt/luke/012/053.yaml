source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: de
  text: 'Sie werden entzweit sein[a]: der Vater gegen den Sohn und der Sohn gegen den Vater, die Mutter gegen die Tochter und die Tochter gegen die Mutter, die Schwiegermutter gegen ihre Schwiegertochter[b] und die Schwiegertochter gegen ihre Schwiegermutter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden gespalten sein.“ Das griechische Verb hebt die Entzweiung innerhalb einer Gemeinschaft oder eines Haushalts hervor.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann in anderen Zusammenhängen auch „Braut“ bedeuten; die Gegenüberstellung mit „Schwiegermutter“ spricht hier für „Schwiegertochter“.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: sie werden entzweit sein
  rationale: Das Futur Passiv beschreibt den eintretenden Zustand der Spaltung. „Entzweit sein“ bewahrt den resultativen Sinn und leitet die folgenden familiären Gegensätze natürlich ein.
- source_word: ἐπὶ
  choice: gegen
  rationale: In der wiederholten Verbindung mit Personen bezeichnet ἐπί hier eine oppositionelle Beziehung; „gegen“ gibt diese scharfe Gegenüberstellung knapp und idiomatisch wieder.
- source_word: πατήρ / υἱός
  choice: Vater / Sohn
  rationale: Die geschlechtsspezifischen Verwandtschaftsbezeichnungen und ihre wechselseitige Anordnung werden genau bewahrt.
- source_word: μήτηρ / θυγάτηρ
  choice: Mutter / Tochter
  rationale: Die geschlechtsspezifischen Verwandtschaftsbezeichnungen und ihre wechselseitige Anordnung werden genau bewahrt.
- source_word: πενθερά
  choice: Schwiegermutter
  rationale: Dies ist die klare moderne deutsche Entsprechung für die bezeichnete Verwandtschaftsbeziehung.
- source_word: νύμφη
  choice: Schwiegertochter
  rationale: νύμφη kann auch „Braut“ bedeuten; die wechselseitige Paarung mit πενθερά legt hier jedoch eindeutig die Bedeutung „Schwiegertochter“ nahe.
- source_word: αὐτῆς
  choice: ihre
  rationale: Das ausdrücklich gesetzte Pronomen wird in „ihre Schwiegertochter“ wiedergegeben. Im abschließenden Gegenstück wird „ihre“ aus natürlichem deutschem Sprachgebrauch ergänzt.
theological_decisions:
- issue: Art der beschriebenen Entzweiung
  choice: Die familiäre Gegnerschaft wird als Folge der im Kontext genannten Spaltung beschrieben, nicht als Billigung von Feindschaft in der Familie.
  alternative: Ein allgemeines Sprichwort über familiäre Spannungen.
  rationale: Die Übersetzung bewahrt die schonungslose wechselseitige Gegenüberstellung, ohne sie abzuschwächen oder eine moralische Zustimmung hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion „gegen“ erhält den eindringlichen Parallelismus des griechischen Textes. Der Doppelpunkt macht die anschließende Aufzählung als Entfaltung der angekündigten Entzweiung kenntlich.
