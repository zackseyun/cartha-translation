source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: de
  text: Hab keine Angst, du kleine Herde, denn euer Vater hat es für gut befunden, euch das Reich zu geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn euer Vater hat Gefallen daran gefunden, euch das Reich zu geben.“ „Reich“ kann hier auch Gottes Königsherrschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Der verneinte Imperativ wird im heutigen Standarddeutsch natürlich und unmittelbar wiedergegeben. „Fürchte dich nicht“ wäre formeller und traditioneller, klingt aber weniger gegenwärtig.
- source_word: τὸ μικρὸν ποίμνιον
  choice: du kleine Herde
  rationale: „Herde“ bewahrt das pastorale Bild; „kleine“ gibt μικρόν wieder. Das ergänzte „du“ kennzeichnet die Anrede im Deutschen natürlich.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier die Aufforderung, keine Angst zu haben. „Denn“ verbindet beide Satzteile idiomatisch, ohne die Kausalität abzuschwächen.
- source_word: εὐδόκησεν
  choice: hat beschlossen
  rationale: εὐδοκέω bezeichnet hier den wohlwollenden Willen bzw. Entschluss des Vaters. „Hat beschlossen“ ist verständlich und bewahrt die göttliche Initiative; die positive Nuance wird in einer Fußnote erläutert.
- source_word: ὁ πατὴρ ὑμῶν
  choice: euer Vater
  rationale: Die Übersetzung folgt dem griechischen Wortlaut, ohne „himmlischer“ hinzuzufügen.
- source_word: δοῦναι ὑμῖν
  choice: euch … zu geben
  rationale: Die Infinitivkonstruktion mit Dativ wird direkt und idiomatisch wiedergegeben.
- source_word: τὴν βασιλείαν
  choice: das Reich
  rationale: „Reich“ ist die natürliche biblische Wiedergabe von βασιλεία und lässt sowohl Gottes königliche Herrschaft als auch deren Wirkungsbereich anklingen.
theological_decisions:
- issue: Bedeutungsbreite von βασιλεία
  choice: das Reich
  alternative: die Königsherrschaft
  rationale: „Reich“ wahrt die vertraute biblische Ausdrucksweise und legt den Begriff weder ausschließlich räumlich noch ausschließlich als Herrschaftsausübung fest.
- issue: Nuance von εὐδόκησεν im Blick auf den göttlichen Willen
  choice: hat beschlossen
  alternative: hat Gefallen daran gefunden
  rationale: Die Formulierung vermittelt einen wirksamen, wohlwollenden Entschluss, ohne daraus einen technischen Lehrbegriff zu machen. Die Fußnote hält die Nuance des Gefallens ausdrücklich offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Singularanrede „du kleine Herde“ folgt auf den singularischen Imperativ, während „euer/euch“ wie im Griechischen die angesprochene Gemeinschaft im Plural bezeichnet.
