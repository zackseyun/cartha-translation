  verdict: revise
  source_fidelity: Die explizite Anrede ὑμεῖς, die dreifache Koordination und die Verbote werden grundsätzlich zutreffend erfasst. „Was ihr essen/trinken sollt“ ist jedoch im heutigen Deutsch leicht als normatives „was ihr essen/trinken müsstet“ zu verstehen und gibt die deliberativ-offene Frage des griechischen Aorist-Konjunktivs nicht angemessen wieder. „Lasst euch nicht beunruhigen“ legt zudem eher eine äußere Verursachung nahe; μετεωρίζεσθε bezeichnet den eigenen Zustand innerer Unruhe bzw. Unsicherheit.
  naturalness: Der Satzbau mit hervorgehobenem „Und ihr“ ist verständlich und angemessen. Die Wiederholung von „was ihr …“ bewahrt den griechischen Aufbau. „Was ihr essen und was ihr trinken werdet“ ist im Deutschen für die hier gemeinte Frage nach der künftigen Versorgung klarer als „sollt“.
  terminology: „Besorgt“ ist im Kontext der Sorgen um Versorgung eine natürliche und präzise Wiedergabe von μετεωρίζεσθε, ohne dessen mögliche Nuance des Schwankens bzw. der Ungewissheit zu verschweigen. Diese Nuance soll die Fußnote dokumentieren.
  issues:
  - severity: medium
    issue: „was ihr essen und was ihr trinken sollt“
    rationale: „Sollt“ wird im modernen Standarddeutsch gewöhnlich normativ verstanden. Der griechische Text fragt hier nach dem, was die Angeredeten künftig essen bzw. trinken werden, nicht nach einer Vorschrift darüber, was sie essen sollen.
  - severity: low
    issue: „lasst euch nicht beunruhigen“
    rationale: Die Formulierung kann eine äußere Person oder Ursache als Handelnde nahelegen. Das griechische Verb beschreibt vielmehr den inneren Zustand der Angeredeten; „seid nicht besorgt“ gibt dies direkter wieder.
