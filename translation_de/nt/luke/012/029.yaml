  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: de
  text: Und ihr, sucht nicht danach, was ihr essen und was ihr trinken werdet, und seid nicht besorgt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und seid nicht beunruhigt“ oder „und seid nicht in Unruhe“; wörtlicher möglicherweise: „und bleibt nicht in der Schwebe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen ist im Griechischen hervorgehoben. Die Voranstellung „Und ihr:“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: ζητεῖτε
  choice: sucht nicht danach
  rationale: ζητέω bedeutet hier „suchen“ beziehungsweise „nach etwas streben“. „Danach suchen“ bewahrt das Bild und bezeichnet im Zusammenhang die anhaltende Beschäftigung mit der Versorgung, ohne gewöhnliche Vorsorge ausdrücklich zu verurteilen.
- source_word: τί φάγητε
  choice: was ihr essen sollt
  rationale: Die indirekte Frage drückt eine offene, erwägende Sorge um die Nahrung aus. Das deutsche „sollt“ ist in dieser Konstruktion idiomatisch und muss nicht als göttliche Anweisung verstanden werden.
- source_word: τί πίητε
  choice: was ihr trinken sollt
  rationale: Die parallele Wiedergabe erhält Aufbau und Sinn der griechischen Formulierung.
- source_word: μετεωρίζεσθε
  choice: lasst euch nicht beunruhigen
  rationale: Das seltene Verb kann einen Zustand schwebender Ungewissheit und daraus entstehender innerer Unruhe bezeichnen. Die gewählte Formulierung ist verständlich, lässt aber die Bedeutungsbreite in einer Fußnote erkennen.
- source_word: καὶ ... καὶ ... καὶ
  choice: und ... und ... und
  rationale: Die wiederholte Verbindung mit „und“ bewahrt den kumulativen Rhythmus des griechischen Satzes.
theological_decisions:
- issue: Reichweite des Verbots hinsichtlich Nahrung und Versorgung
  choice: Verbot sorgenvoller, innerlich beunruhigender Suche nach Essen und Trinken
  alternative: Verbot jeder vernünftigen Planung für leibliche Bedürfnisse
  rationale: Der Zusammenhang handelt von Sorge und innerer Unruhe. Die Übersetzung hält den direkten Imperativ fest, macht daraus aber weder eine asketische Abwertung leiblicher Bedürfnisse noch ein ausdrückliches Verbot gewöhnlicher Vorsorge.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt nach „Und ihr“ bildet die griechische Hervorhebung des Pronomens ab. Die ungewöhnliche Bedeutungsweite von μετεωρίζεσθε wird nicht im Haupttext überladen, sondern in der Fußnote offengelegt.
