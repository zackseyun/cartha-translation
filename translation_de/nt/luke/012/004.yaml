id: LUK.12.4
reference: Luke 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: de
  text: 'Doch euch, meinen Freunden, sage ich: Fürchtet euch nicht vor denen, die den Körper töten und danach nichts weiter tun können.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Doch … sage ich
  rationale: δέ markiert hier einen leichten Übergang beziehungsweise Gegensatz. „Doch“ bewahrt diesen Diskurswechsel, ohne ihn zu stark zuzuspitzen; die deutsche Wortstellung klingt natürlich und würdevoll.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: euch, meinen Freunden
  rationale: 'Die Dativgruppe ist appositionell: Jesus bezeichnet die Angesprochenen ausdrücklich als seine Freunde. Die Wiedergabe erhält sowohl das Pronomen als auch die persönliche Anrede.'
- source_word: μὴ φοβηθῆτε ἀπὸ
  choice: Fürchtet euch nicht vor
  rationale: Der Aorist Konjunktiv mit μή formuliert ein Verbot beziehungsweise eine eindringliche Aufforderung. „Sich vor jemandem fürchten“ gibt zugleich die durch ἀπό bezeichnete Beziehung idiomatisch wieder.
- source_word: τῶν ἀποκτεινόντων τὸ σῶμα
  choice: denen, die den Körper töten
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein diejenigen, die töten; σῶμα meint hier den physischen Körper. Die Formulierung bleibt nah am griechischen Ausdruck.
- source_word: καὶ μετὰ ταῦτα
  choice: und danach
  rationale: Die Wendung ist temporal und bezeichnet die Zeit nach der Tötung des Körpers. „Danach“ ist im modernen Deutsch knapp und natürlich.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: nichts weiter tun können
  rationale: Die Wendung bringt die Begrenzung ihrer Handlungsmacht zum Ausdruck. „Nichts weiter tun können“ erfasst περισσότερόν τι und die idiomatische Bedeutung von μὴ ἐχόντων … ποιῆσαι, ohne den Text auszudeuten.
theological_decisions:
- issue: Reichweite menschlicher Macht nach dem körperlichen Tod
  choice: Die Aussage beschränkt sich darauf, dass Menschen den Körper töten, danach aber nichts weiter tun können.
  alternative: Ausdrücklich ergänzen, dass sie die Seele nicht töten können.
  rationale: Der Vers erwähnt die Seele nicht. Obwohl der folgende Vers die begrenzte menschliche Macht der weiterreichenden göttlichen Vollmacht gegenüberstellt, wird dieser Kontrast hier nicht vorwegnehmend in den Wortlaut eingefügt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. „Körper“ gibt σῶμα direkt und gegenwärtig wieder; „Leib“ wäre traditioneller, klänge hier jedoch stärker kirchensprachlich. Keine Fußnote nötig, da die zentrale griechische Aussage im Haupttext ohne sachlichen Verlust natürlich wiedergegeben werden kann.
