id: LUK.12.24
reference: Luke 12:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: de
  text: 'Betrachtet die Raben[a]: Sie säen nicht und ernten nicht; sie haben weder Vorratskammer noch Scheune[b], und Gott ernährt sie. Wie viel mehr seid ihr wert als die Vögel?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Denkt über die Raben nach.«'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen stehen hier zwei verschiedene Wörter für Aufbewahrungsorte.
    reason: lexical_distinction
  - marker: c
    text: 'Formnäher auch möglich: »Um wie viel mehr übertrefft ihr die Vögel?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Betrachtet ... genau
  rationale: Der Aoristimperativ fordert zu aufmerksamer Betrachtung und zum Nachdenken auf. Die Formulierung ist natürlich und gibt mehr als einen flüchtigen Blick wieder.
- source_word: κόρακας
  choice: Raben
  rationale: κόραξ bezeichnet konkret den Raben; das anschauliche Tierbild bleibt erhalten.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: Sie säen nicht und ernten nicht
  rationale: Die beiden parallelen landwirtschaftlichen Tätigkeiten werden knapp und unmittelbar wiedergegeben.
- source_word: ταμεῖον
  choice: Vorratskammer
  rationale: Das Wort bezeichnet hier einen inneren Aufbewahrungs- oder Vorratsraum und wird von ἀποθήκη unterschieden.
- source_word: ἀποθήκη
  choice: Scheune
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Wort einen Ort zur Lagerung von Erzeugnissen. »Scheune« bewahrt zusammen mit »Vorratskammer« die Zweigliedrigkeit des griechischen Ausdrucks.
- source_word: τρέφει
  choice: ernährt
  rationale: Das Präsens beschreibt Gottes fortdauernde Versorgung. »Ernährt« ist im Deutschen für Gottes Versorgung der Vögel idiomatisch und etwas umfassender als »füttert«.
- source_word: πόσῳ μᾶλλον
  choice: Wie viel mehr
  rationale: Dies ist die natürliche deutsche Form für den Schluss vom Geringeren auf das Größere.
- source_word: διαφέρετε
  choice: seid ... wert
  rationale: Im Kontext bezeichnet das Verb nicht nur Verschiedenheit, sondern ein Übertreffen an Wert oder Bedeutung. Die Formulierung gibt den vergleichenden Sinn verständlich wieder.
- source_word: τῶν πετεινῶν
  choice: als die Vögel
  rationale: πετεινόν ist die allgemeine Bezeichnung für Vögel beziehungsweise fliegende Tiere; nach den konkret genannten Raben weitet Jesus den Vergleich aus.
theological_decisions:
- issue: Göttliche Fürsorge als Grundlage des Vergleichs
  choice: und Gott ernährt sie
  alternative: und Gott versorgt sie
  rationale: Der griechische Text stellt Gottes aktives Ernähren der Tiere als Grundlage für Jesu Schluss auf den größeren Wert der Menschen dar. Die Übersetzung bewahrt diese Aussage, ohne sie dogmatisch auszuweiten.
- issue: Bedeutung von διαφέρετε
  choice: Wie viel mehr seid ihr wert als die Vögel!
  alternative: Um wie viel mehr übertrefft ihr die Vögel!
  rationale: Der Zusammenhang legt eine Überlegenheit an Wert nahe. Die Hauptfassung macht diesen Sinn natürlich verständlich; die Fußnote hält die formal offenere Bedeutung »übertreffen« sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Aufforderung und der knappe Parallelismus bleiben erhalten; das Ausrufezeichen gibt der rhetorischen Schlussfolgerung Nachdruck, ohne eine im Griechischen nicht markierte Frage zu erzwingen.
