source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: de
  text: 'Selig sind jene Sklaven[a], die der Herr[b] bei seiner Ankunft wach vorfindet. Amen, ich sage euch: Er wird sich zum Dienst gürten[c], sie am Tisch Platz nehmen lassen[d] und zu ihnen treten, um sie zu bedienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort bezeichnet hier Menschen, die einem Herrn als Sklaven unterstehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im unmittelbaren Gleichniszusammenhang auch: „Hausherr“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist, dass er seine Kleidung hochbindet und sich so für die Arbeit bereit macht.
    reason: cultural_note
  - marker: d
    text: 'Wörtlich: „sie lagern“; bei einem festlichen Mahl nahm man gewöhnlich liegend zu Tisch Platz.'
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Glückselig
  rationale: Bewahrt den feierlichen Charakter einer Seligpreisung und bezeichnet mehr als ein subjektives Glücksgefühl.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Im Haushaltsbild ist das rechtlich-soziale Verhältnis zum Herrn ausdrücklich relevant; „Diener“ bleibt als Alternative in der Fußnote erhalten.
- source_word: κύριος
  choice: Herr
  rationale: Entspricht dem üblichen Titel und lässt neben der Rolle im Gleichnis auch einen möglichen Bezug auf Jesus offen; „Hausherr“ ist im unmittelbaren Bild ebenfalls möglich.
- source_word: γρηγοροῦντας
  choice: wachend
  rationale: Gibt sowohl das Wachbleiben als auch die damit verbundene Wachsamkeit knapp wieder.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Bewahrt die markante, feierliche Einleitungsformel Jesu in formnaher und verständlicher Gestalt.
- source_word: περιζώσεται
  choice: wird sich zum Dienst gürten
  rationale: Erhält das konkrete antike Bild des Hochgürtens der Kleidung und verdeutlicht zugleich dessen Zweck.
- source_word: ἀνακλινεῖ αὐτούς
  choice: sie zu Tisch liegen lassen
  rationale: Bezeichnet die antike Haltung beim Mahl genauer als ein bloßes „Platz nehmen lassen“.
- source_word: παρελθὼν
  choice: herantreten
  rationale: Gibt im Zusammenhang des Bedienens die Bewegung des Herrn zu den am Tisch Liegenden natürlich wieder, ohne das Partizip zu überdeuten.
- source_word: διακονήσει αὐτοῖς
  choice: sie bedienen
  rationale: Der Kontext weist auf konkrete Bewirtung beziehungsweise Tischdienst; „bedienen“ ist hier natürlicher und präziser als das allgemeinere „dienen“.
theological_decisions:
- issue: κύριος im Gleichnis mit möglichem christologischem Nachklang
  choice: Herr
  alternative: Hausherr
  rationale: '„Herr“ wahrt die lexikalische und theologische Mehrdeutigkeit: Gemeint ist im Gleichnis der Herr der Sklaven, zugleich kann die Erzählung auf Jesus als den kommenden Herrn weisen.'
- issue: δοῦλος im hierarchischen Haushaltsbild
  choice: Sklaven
  alternative: Diener
  rationale: Der griechische Ausdruck bezeichnet hier Personen in einem ausdrücklichen Herr-Sklave-Verhältnis. Die Übersetzung soll diese historische Härte nicht abschwächen, ohne sie auf heutige Formen von Versklavung festzulegen.
- issue: Das überraschende Dienen des Herrn
  choice: Er wird sich zum Dienst gürten … und sie bedienen
  alternative: Er wird sich gürten … und ihnen dienen
  rationale: Die konkrete Tischdienst-Szene bleibt erhalten. Damit wird die überraschende Umkehr der üblichen Rollen sichtbar, ohne ihre christologische Bedeutung ausdrücklich festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst feierlicher Seligpreisungs- und Amen-Formel. Das historische Mahlbild und die überraschende Rollenumkehr werden anschaulich bewahrt; erklärungsbedürftige soziale und kulturelle Begriffe stehen in Fußnoten.
