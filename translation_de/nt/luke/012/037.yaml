revisions:
- from: 'Glückselig sind jene Sklaven[a], die der Herr[b] bei seiner Ankunft wachend findet. Amen, ich sage euch: Er wird sich zum Dienst gürten[c], sie zu Tisch liegen lassen und herantreten, um sie zu bedienen.'
  to: 'Selig sind jene Sklaven[a], die der Herr[b] bei seiner Ankunft wach vorfindet. Amen, ich sage euch: Er wird sich zum Dienst gürten[c], sie am Tisch Platz nehmen lassen[d] und zu ihnen treten, um sie zu bedienen.'
  rationale: Die Revision ersetzt zwei sprachlich problematische Stellen, ohne den Sinn zu verändern. „Selig“ ist modernes, würdiges und im Deutschen für μακάριοι etabliertes Seligpreisungsvokabular. Die klare Formulierung „sie am Tisch Platz nehmen lassen“ gibt das bewirkende Handeln wieder; die Fußnote sichert die im Griechischen ausdrücklich enthaltene antike Liegehaltung. „Zu ihnen treten“ wahrt die Bewegung von παρελθών im Kontext des anschließenden Bedienens, ohne deren genaue räumliche Nuance zu überschärfen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:47:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Aussagen des griechischen Textes grundsätzlich zutreffend wieder: die Sklaven werden bei der Ankunft des Herrn wach vorgefunden, und der Herr übernimmt überraschend den Tischdienst. Die Wendung „sie zu Tisch liegen lassen“ bedeutet im heutigen Deutsch jedoch leicht, dass er sie dort liegen lässt, und bildet ἀνακλινεῖ αὐτούς daher nicht klar als bewirkendes Handeln ab. „Am Tisch Platz nehmen lassen“ ist eindeutig; die spezifische Liegehaltung wird in einer Fußnote bewahrt.'
  naturalness: „Glückselig“ wirkt im modernen Standarddeutsch deutlich altertümlicher und weniger idiomatisch als die etablierte, zugleich feierliche Seligpreisungsformel „Selig“. „Wach vorfindet“ und „zu ihnen treten“ sind natürliche moderne Formulierungen. Die Überarbeitung erhält einen würdigen Registerton ohne unnötig archaisch zu wirken.
  terminology: „Sklaven“ gibt δοῦλοι im ausdrücklich hierarchischen Haushaltsbild angemessen wieder; „Diener“ bleibt als Alternative erläutert. „Herr“ bewahrt die Mehrdeutigkeit von κύριος zwischen der Gleichnisrolle und möglichem weiterem Resonanzraum. „Amen, ich sage euch“ ist eine vertretbare formnahe Wiedergabe. „Gürten“ und „bedienen“ treffen die konkrete Dienstszene.
  issues:
