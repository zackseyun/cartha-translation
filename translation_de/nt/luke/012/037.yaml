    issue: „sie zu Tisch liegen lassen“
    rationale: Die Formulierung ist im heutigen Deutsch missverständlich und kann „sie dort liegen lassen“ statt „sie zum Mahl lagern/reklinieren lassen“ bedeuten. Dadurch wird das transitive ἀνακλινεῖ αὐτούς nicht ausreichend klar wiedergegeben.
  - severity: low
    issue: „Glückselig“
    rationale: Die Wiedergabe ist nicht sachlich falsch, klingt im modernen Standarddeutsch aber unnötig altertümlich. „Selig“ ist die natürliche und traditionssprachlich gefestigte deutsche Form einer Seligpreisung.
