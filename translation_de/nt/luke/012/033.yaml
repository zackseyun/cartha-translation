source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: de
  text: Verkauft euren Besitz und gebt Almosen.[a] Macht euch Geldbeutel, die nicht verschleißen, und einen unerschöpflichen Schatz in den Himmeln,[b] wo kein Dieb sich nähert und keine Motte ihn zerstört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet barmherzige Gaben, besonders für Bedürftige.
    reason: lexical_alternative
  - marker: b
    text: 'Oder „im Himmel“. Im Griechischen steht die Mehrzahl: „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Verkauft
  rationale: Der Aoristimperativ im Plural fordert zu entschlossenem Handeln auf; „verkauft“ gibt dies schlicht wieder, ohne eine vollständige Veräußerung ausdrücklich hinzuzufügen.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: euren Besitz
  rationale: Die substantivierte Wendung bezeichnet das, was jemandem gehört; „Besitz“ ist im Deutschen natürlich und umfasst Hab und Gut.
- source_word: δότε ἐλεημοσύνην
  choice: gebt den Bedürftigen Almosen
  rationale: ἐλεημοσύνη bezeichnet eine aus Barmherzigkeit geleistete Gabe, besonders für Bedürftige. Die Formulierung bewahrt den konkreten Begriff „Almosen“ und macht zugleich den Empfängerkreis verständlich.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Macht euch
  rationale: Der reflexive Dativ bezeichnet ein Handeln zum eigenen Nutzen; „macht euch“ erhält sowohl den Imperativ als auch den reflexiven Sinn.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: Geldbeutel, die nicht verschleißen
  rationale: βαλλάντια sind Beutel zur Aufbewahrung von Geld; παλαιούμενα beschreibt ihr Alt- oder Abgenutztwerden. „Verschleißen“ gibt das Bild idiomatisch wieder.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: einen unerschöpflichen Schatz
  rationale: ἀνέκλειπτος bedeutet, dass etwas nicht ausgeht oder versagt. „Unerschöpflich“ ist prägnant und erhält die Schatzmetapher.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Die Übersetzung erhält bewusst den griechischen Plural und damit die jüdisch-neutestamentliche Ausdrucksweise.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: wo kein Dieb sich nähert
  rationale: ἐγγίζει bedeutet „sich nähern“ oder „nahe kommen“; die gewählte Fassung bewahrt das räumliche Bild.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: und keine Motte etwas zerstört
  rationale: διαφθείρει bezeichnet hier das Verderben oder Zerstören durch Fraß. Das ergänzte „etwas“ ergibt im Deutschen einen natürlichen Satz, ohne den Gegenstand näher festzulegen.
theological_decisions:
- issue: Bedeutung von ἐλεημοσύνη im Aufruf zum Umgang mit Besitz
  choice: gebt den Bedürftigen Almosen
  alternative: gebt Almosen; gebt den Armen
  rationale: Die Übersetzung lässt den konkreten Akt barmherziger materieller Hilfe erkennen, ohne daraus ein über den Vers hinausgehendes Wirtschaftsprogramm abzuleiten.
- issue: Wiedergabe von ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  alternative: im Himmel
  rationale: Der Plural des Ausgangstextes wird bewahrt. Die geläufigere Einzahl ist als idiomatische Alternative vermerkt, ohne einen theologischen Unterschied zu behaupten.
- issue: Verhältnis von Geldbeuteln und Schatz
  choice: Doppelpunkt vor „einen unerschöpflichen Schatz“
  alternative: Komma oder koordinierende Wiedergabe
  rationale: Der griechische Akkusativ „Schatz“ kann die nicht verschleißenden Geldbeutel bildhaft näher bestimmen. Der Doppelpunkt bewahrt diese spannungsreiche Apposition, ohne die Bilder vollständig gleichzusetzen oder aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Almosen“ bewahrt den präzisen historischen Begriff; „den Bedürftigen“ erschließt seine Bedeutung. Der Plural „Himmel“ wird quellennah als „Himmeln“ wiedergegeben.
