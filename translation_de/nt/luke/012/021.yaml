id: LUK.12.21
reference: Luke 12:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: de
  text: So geht es dem, der für sich selbst Schätze anhäuft und nicht reich ist vor Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reich auf Gott hin“.'
    reason: Lexikalische Alternative für εἰς θεόν, die dessen Richtungs- und Beziehungsnuance formaler wiedergibt.
lexical_decisions:
- source_word: οὕτως
  choice: So geht es dem
  rationale: οὕτως zieht die Anwendung aus dem vorangehenden Gleichnis. Die deutsche Wendung ist natürlich und bewahrt den sprichwortartigen Bezug auf den eben geschilderten Menschen.
- source_word: ὁ θησαυρίζων
  choice: der … Schätze anhäuft
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, dessen Handeln dadurch geprägt ist. „Schätze anhäufen“ bewahrt den Bezug zum Horten von Besitz.
- source_word: ἑαυτῷ
  choice: für sich selbst
  rationale: Der reflexive Dativ bezeichnet den eigenen Vorteil und betont die selbstbezogene Ausrichtung.
- source_word: καὶ μὴ
  choice: und nicht
  rationale: Die einfache Koordination des Griechischen bleibt erhalten, ohne den Gegensatz durch „aber“ stärker auszulegen.
- source_word: εἰς θεὸν
  choice: vor Gott
  rationale: Bei πλουτέω bezeichnet εἰς θεόν die Beziehung beziehungsweise Ausrichtung auf Gott. „Vor Gott“ ist im Deutschen idiomatisch und lässt sowohl relationale als auch wertende Nuancen offen; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: πλουτῶν
  choice: reich ist
  rationale: Das Partizip wird im Deutschen natürlich als prädikative Wendung wiedergegeben und wahrt den Gegensatz zum Anhäufen irdischer Schätze.
theological_decisions:
- issue: Generischer maskuliner Singular in einer moralischen Aussage
  choice: dem, der
  alternative: dem Menschen, der; wer
  rationale: Die Form bewahrt den generischen Singular und folgt der grammatisch maskulinen Gestalt des substantivierten Partizips, ohne die Aussage auf Männer zu beschränken.
- issue: Bedeutung von „reich … εἰς Gott“
  choice: reich vor Gott
  alternative: reich auf Gott hin; reich bei Gott; reich in dem, was Gott wichtig ist
  rationale: Die knappe relationale Formulierung bleibt ohne erklärende theologische Erweiterung erhalten. „Vor Gott“ klingt im Deutschen natürlich; „auf Gott hin“ bildet die Richtungsnuance formaler ab und erscheint deshalb als Alternative in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Lehrsatzcharakter. Die Spannung zwischen selbstbezogenem Ansammeln und Reichtum in Beziehung zu Gott wird nicht erklärend aufgelöst.
