  source_fidelity: Die Übersetzung gibt die elliptisch-anwendende Funktion von οὕτως mit „So geht es dem“ idiomatisch wieder. „der für sich selbst Schätze anhäuft“ trifft ὁ θησαυρίζων ἑαυτῷ, und „und nicht reich ist vor Gott“ bewahrt die koordinierte negative Gegenüberstellung. „Vor Gott“ ist für εἰς θεόν eine vertretbare, im Deutschen natürliche relationale Wiedergabe, ohne den Ausdruck erklärend einzuengen.
  naturalness: Modernes Standarddeutsch, flüssig und dem knappen, pointierten Schluss des Gleichnisses angemessen. Die Konstruktion „So geht es dem, der …“ ist in diesem Kontext vollständig und verständlich, weil sie die zuvor geschilderte Folge auf den beschriebenen Menschen bezieht.
  terminology: „Schätze anhäuft“ erhält die Wort- und Sachverbindung zum vorausgehenden Schatz-Motiv. „Reich … vor Gott“ lässt die theologisch offene Beziehungsdimension stehen und vermeidet eine auslegende Umschreibung. Die Fußnotenalternative dokumentiert die Richtungsnuance von εἰς θεόν, ohne sie als alleinige Bedeutung festzulegen.
