  variant: modern standard German
source:
  edition: SBLGNT
  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: de
  text: Warum urteilt ihr nicht auch selbst, was recht ist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was gerecht ist“ oder „das Richtige“.'
    reason: 'Lexikalische Alternative: τὸ δίκαιον kann das Rechte bzw. Gerechte bezeichnen.'
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Warum ... auch
  rationale: Die Partikelfolge führt die vorangehende Argumentation in einer nachdrücklichen rhetorischen Frage weiter. „Warum ... auch“ bewahrt den zusätzlichen und verbindenden Sinn, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἀφ’ ἑαυτῶν
  choice: von euch aus
  rationale: Die Wendung bezeichnet ein Urteil aus eigener Initiative beziehungsweise aufgrund eigener Einsicht. „Von euch aus“ gibt die Ausgangsbedeutung von ἀπό idiomatisch wieder und klingt im modernen Standarddeutsch natürlicher als „aus euch selbst“.
- source_word: οὐ κρίνετε
  choice: entscheidet ihr nicht
  rationale: κρίνω bezeichnet hier das prüfende Urteilen, das zu einer Entscheidung darüber führt, was richtig ist. „Entscheiden“ passt zum unmittelbaren Kontext der anschließenden Einigung mit einem Prozessgegner; „beurteilen“ wäre ebenfalls möglich, jedoch etwas abstrakter.
- source_word: τὸ δίκαιον
  choice: was richtig ist
  rationale: Das substantivierte neutrale Adjektiv bezeichnet das Richtige beziehungsweise Gerechte. „Was richtig ist“ bewahrt den breiten ethisch-praktischen Sinn, ohne ihn auf einen rein rechtlichen Begriff der Gerechtigkeit zu verengen.
theological_decisions:
- issue: Bedeutungsumfang von τὸ δίκαιον
  choice: was richtig ist
  alternative: was gerecht ist; das Richtige
  rationale: Die Formulierung lässt sowohl moralische Richtigkeit als auch gerechtes Handeln anklingen. Der Haupttext verwendet die natürliche, breite Wendung „was richtig ist“; die Fußnote hält die Gerechtigkeitsnuance ausdrücklich offen.
- issue: Eigenständiges Urteilen in ἀφ’ ἑαυτῶν
  choice: von euch aus
  alternative: aus euch selbst; selbstständig
  rationale: Die Aussage wird als Aufforderung zu eigener Einsicht wiedergegeben, nicht als theologische Behauptung über eine vom göttlichen Wirken unabhängige Erkenntnisfähigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Direktheit der zweiten Person Plural bleibt erhalten. „Von euch aus“ ist alltagssprachlich verständlich, ohne salopp zu sein; die Fußnote bewahrt die semantische Spannung zwischen Richtigkeit und Gerechtigkeit.
