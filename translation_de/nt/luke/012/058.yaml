id: LUK.12.58
reference: Luke 12:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: de
  text: Denn wenn du mit deinem Prozessgegner zu einem Amtsträger gehst, bemühe dich unterwegs, von ihm loszukommen[a], damit er dich nicht vor den Richter schleppt und der Richter dich dem Vollstreckungsbeamten übergibt und der Vollstreckungsbeamte dich ins Gefängnis wirft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dich mit ihm zu einigen. Wörtlich: von ihm befreit zu werden.'
    reason: Die Fußnote nennt sowohl die im Rechtskontext wahrscheinliche praktische Bedeutung als auch die wörtlichere Form des griechischen Ausdrucks.
lexical_decisions:
- source_word: ἀντιδίκου
  choice: Prozessgegner
  rationale: Das Wort bezeichnet hier die gegnerische Partei in einem Rechtsstreit. „Prozessgegner“ bewahrt den rechtlichen Sinn, ohne festzulegen, ob die Person ausschließlich als Ankläger oder als Anspruchsteller auftritt.
- source_word: ἄρχοντα
  choice: Amtsträger
  rationale: Ἄρχων bezeichnet hier eine obrigkeitliche beziehungsweise zivile Instanz. „Amtsträger“ ist im modernen Deutschen verständlich und vermeidet die unpassend enge Festlegung auf einen bestimmten historischen Gerichtsbeamten.
- source_word: δὸς ἐργασίαν
  choice: bemühe dich
  rationale: Die Wendung fordert zu ernsthaftem, aktivem Handeln auf. „Bemühe dich“ gibt den idiomatischen Sinn natürlich und knapp wieder.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: von ihm loszukommen
  rationale: Diese Wiedergabe bleibt nahe am Bild des Loskommens beziehungsweise Befreitwerdens und lässt offen, auf welche Weise der Rechtsstreit beigelegt wird. Die kontextuell wahrscheinliche Bedeutung „dich mit ihm zu einigen“ steht in der Fußnote.
- source_word: κατασύρῃ
  choice: vor den Richter schleppt
  rationale: „Schleppt“ bewahrt die kraftvolle, zwangsartige Bewegung des griechischen Verbs; „vor den Richter“ entspricht natürlichem deutschem Rechtsgebrauch.
- source_word: κριτήν / κριτής
  choice: Richter
  rationale: Dies ist die klare und übliche Wiedergabe der gerichtlichen Funktion.
- source_word: παραδώσει
  choice: übergibt
  rationale: „Übergibt“ bezeichnet natürlich die angeordnete Überstellung an den vollstreckenden Beamten.
- source_word: πράκτορι / πράκτωρ
  choice: Vollstreckungsbeamter
  rationale: Der Ausdruck bezeichnet einen Beamten, der das Urteil beziehungsweise die Forderung vollstreckt. „Vollstreckungsbeamter“ ist präziser als das zu allgemeine „Beamter“ und weniger an ein bestimmtes modernes Rechtssystem gebunden als „Gerichtsvollzieher“.
- source_word: βαλεῖ εἰς φυλακήν
  choice: ins Gefängnis wirft
  rationale: „Wirft“ erhält die anschauliche und harte Wirkung von βάλλω, statt sie zum neutraleren „bringt“ oder „steckt“ abzuflachen.
- source_word: ὡς γὰρ
  choice: Denn wenn
  rationale: Im Deutschen gibt „denn“ den begründenden Anschluss durch γάρ wieder; das konditional-temporale „wenn“ vermittelt die konkrete Vergleichssituation natürlicher als ein wörtliches „wie“.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: „Unterwegs“ ist idiomatisch, knapp und bewahrt sowohl den räumlichen Sinn als auch die zeitliche Dringlichkeit, vor dem Gerichtstermin zu handeln.
theological_decisions:
- issue: Deutung der rechtlichen Mahnung
  choice: Das Rechtsbild bleibt im Vers selbst unaufgelöst und wird nicht ausdrücklich auf Gott, das Endgericht oder eine bestimmte geistliche Wirklichkeit bezogen.
  alternative: Die Beteiligten und das Gefängnis ausdrücklich als Elemente eines endzeitlichen Gerichts deuten.
  rationale: Der griechische Wortlaut schildert unmittelbar einen Rechtsweg. Der größere Zusammenhang kann eine weitergehende, auch eschatologische Anwendung nahelegen, benennt diese Zuordnungen in diesem Vers jedoch nicht. Die Übersetzung bewahrt daher die theologische Spannung und vermeidet eine dogmatische Festlegung.
- issue: Art des Loskommens vom Prozessgegner
  choice: Im Haupttext steht die formal nähere, bewusst offene Formulierung „von ihm loszukommen“; die mögliche Einigung wird als Alternative angemerkt.
  alternative: Im Haupttext eindeutig „dich mit ihm zu einigen“ schreiben.
  rationale: Eine außergerichtliche Einigung ist im Kontext wahrscheinlich, doch ἀπηλλάχθαι bedeutet wörtlicher, von jemandem los- oder freizukommen. Die offene Haupttextfassung verhindert, dass eine plausible Folgerung zum einzigen lexikalischen Sinn erhoben wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarem Rechtsvokabular. Die Satzbewegung und die dreifache Eskalation vom Prozessgegner über den Richter und den Vollstreckungsbeamten bis zum Gefängnis bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
