  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: de
  text: 'Und er sagte: »So werde ich es machen: Ich werde meine Scheunen[a] abreißen und größere bauen. Dort werde ich das ganze Getreide[b] und meinen Besitz[c] sammeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorratshäuser« beziehungsweise »Speicher«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang auch speziell »Weizen« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »meine Güter« beziehungsweise »meine guten Dinge«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: So werde ich es machen
  rationale: Gibt die betonte, vorausblickende Ankündigung in natürlichem Deutsch wieder.
- source_word: καθελῶ
  choice: ich werde … abreißen
  rationale: Bezeichnet konkret das Niederreißen der vorhandenen Gebäude.
- source_word: ἀποθήκας
  choice: Scheunen
  rationale: Passt natürlich zum landwirtschaftlichen Zusammenhang; der griechische Ausdruck kann allgemeiner auch Vorrats- oder Speicherhäuser bezeichnen.
- source_word: μείζονας οἰκοδομήσω
  choice: größere bauen
  rationale: Ergänzt im Deutschen das aus »Scheunen« erschlossene Objekt und bewahrt den Vergleich.
- source_word: συνάξω ἐκεῖ
  choice: dort … unterbringen
  rationale: Gibt das Zusammentragen an einen Lagerort idiomatisch wieder, ohne ein zusätzliches Objekt wie »in ihnen« in den Text einzuführen.
- source_word: πάντα τὸν σῖτον
  choice: das ganze Getreide
  rationale: Bewahrt den bestimmten Artikel und vermeidet das im Griechischen hier nicht ausdrücklich stehende Possessivpronomen; σῖτος kann Getreide allgemein und kontextabhängig besonders Weizen meinen.
- source_word: τὰ ἀγαθά μου
  choice: meinen Besitz
  rationale: Gibt die materiellen Güter des Sprechers breit wieder, ohne den Ausdruck auf Geld oder einzelne Waren zu verengen.
