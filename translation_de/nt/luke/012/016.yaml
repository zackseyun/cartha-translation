  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: de
  text: 'Dann erzählte er ihnen ein Gleichnis: „Das Land eines reichen Mannes brachte eine reiche Ernte hervor.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Dann erzählte er
  rationale: δέ verbindet den Satz locker mit dem vorangehenden Zusammenhang; „dann“ gibt den Fortgang natürlich wieder. Da παραβολή das Objekt ist, entspricht „ein Gleichnis erzählen“ dem heutigen deutschen Sprachgebrauch besser als das wörtlichere „ein Gleichnis sagen“.
- source_word: παραβολὴν
  choice: ein Gleichnis
  rationale: „Gleichnis“ ist die etablierte und sachlich passende Bezeichnung für diese literarische Form in den Evangelien.
- source_word: πρὸς αὐτοὺς
  choice: ihnen
  rationale: Der Ausdruck bezeichnet die Adressaten und wird im Deutschen idiomatisch in „ihnen erzählen“ aufgenommen.
- source_word: λέγων
  choice: ':'
  rationale: Das Partizip führt den Inhalt des Gleichnisses ein. Ein Doppelpunkt gibt diese Funktion im Deutschen klar und ohne unnötige Wiederholung von „sagen“ wieder.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: eines reichen Mannes
  rationale: Der Genitiv bezeichnet den Besitzer des Landes. Das unbestimmte τις wird durch den unbestimmten Artikel ausreichend wiedergegeben; „eines gewissen reichen Mannes“ wäre im modernen Deutsch unnötig markiert.
- source_word: εὐφόρησεν
  choice: brachte eine reiche Ernte hervor
  rationale: Das Verb bezeichnet, dass Land gut beziehungsweise reichlich Ertrag bringt. Die Formulierung ist im landwirtschaftlichen Kontext natürlich und bewahrt den Gedanken außergewöhnlicher Fruchtbarkeit.
- source_word: ἡ χώρα
  choice: das Land
  rationale: χώρα bezeichnet hier den landwirtschaftlich genutzten Grundbesitz des Mannes, nicht ein politisches Gebiet. „Land“ wahrt den weiteren Umfang gegenüber dem engeren „Feld“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der Doppelpunkt bildet die griechische Redeeinleitung λέγων idiomatisch ab; die knappe Gleichnisform bleibt erhalten.
