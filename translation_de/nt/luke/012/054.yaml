id: LUK.12.54
reference: Luke 12:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: de
  text: 'Er sagte auch zu den Menschenmengen: „Wenn ihr im Westen eine Wolke aufsteigen seht, sagt ihr sofort: ‚Es kommt Regen[a]‘, und so geschieht es.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Regenguss kommt.“ Das griechische Wort kann Regen allgemein oder einen stärkeren Regen beziehungsweise Regenguss bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Er sagte
  rationale: Der Imperfekt stellt das Reden als fortlaufenden Erzählhintergrund dar; im natürlichen deutschen Erzählstil kann dies mit dem Präteritum wiedergegeben werden, ohne eine Wiederholung ausdrücklich zu behaupten.
- source_word: δὲ καὶ
  choice: auch
  rationale: καί trägt hier die additive Bedeutung; δέ führt den Gedanken weiter und muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: τοῖς ὄχλοις
  choice: zu den Menschenmengen
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Plural und ist im modernen Deutsch verständlicher und würdiger als „Volksmassen“.
- source_word: Ὅταν ἴδητε
  choice: Wenn ihr … seht
  rationale: Ὅταν mit Aorist Konjunktiv bezeichnet einen allgemein eintretenden Fall; „wenn“ gibt dies idiomatisch wieder.
- source_word: νεφέλην
  choice: eine Wolke
  rationale: Das Substantiv bezeichnet schlicht eine Wolke; ihre Regenbedeutung ergibt sich erst aus dem Zusammenhang.
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: im Westen … aufsteigen
  rationale: „Aufsteigen“ bewahrt das anschauliche Partizip, während „im Westen“ die beobachtete Himmelsrichtung natürlich ausdrückt.
- source_word: εὐθέως
  choice: sofort
  rationale: „Sofort“ erhält die zeitliche Unmittelbarkeit und klingt in direkter Rede natürlich.
- source_word: Ὄμβρος
  choice: Regen
  rationale: ὄμβρος kann Regen allgemein sowie stärkeren Regen oder einen Regenguss bezeichnen. Der Haupttext wahrt mit „Regen“ die lexikalische Breite; die spezifischere Möglichkeit wird in der Fußnote genannt.
- source_word: ἔρχεται
  choice: Es kommt
  rationale: Die deutsche Wetterformulierung „Es kommt Regen“ gibt den präsentischen, unmittelbar bevorstehenden Sinn natürlich wieder.
- source_word: καὶ γίνεται οὕτως
  choice: und so geschieht es
  rationale: Die relativ formnahe Wendung bewahrt die bestätigende Aussage, ohne sie auf bloßes Wettergeschehen zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Anrede steht entsprechend dem griechischen Plural im vertrauten „ihr“. Der Plural „Menschenmengen“ wurde trotz leichter Ungewöhnlichkeit beibehalten, um τοῖς ὄχλοις nicht zum Singular einzuebnen.
