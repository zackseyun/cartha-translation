id: LUK.8.12
reference: Luke 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: de
  text: Die am Weg sind, sind diejenigen, die gehört haben. Dann kommt der Teufel und nimmt das Wort aus ihren Herzen weg, damit sie nicht glauben und gerettet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: am Weg
  rationale: Die räumliche Wendung bewahrt das Bild des Gleichnisses und klingt im Deutschen natürlich.
- source_word: ἀκούσαντες
  choice: die gehört haben
  rationale: Das Partizip bezeichnet die Menschen als solche, die die Botschaft bereits gehört haben; das Perfekt gibt dies im Deutschen idiomatisch wieder.
- source_word: εἶτα
  choice: Dann
  rationale: Kennzeichnet schlicht die zeitliche Abfolge.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Hier ist der persönliche Widersacher gemeint; dies ist die klare, herkömmliche deutsche Entsprechung.
- source_word: αἴρει
  choice: nimmt ... weg
  rationale: Gibt das Entfernen oder Fortnehmen wieder, ohne eine gewaltsame Art des Vorgangs zusätzlich in den Text einzutragen.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Bewahrt den biblischen Sprachgebrauch; im Zusammenhang des Gleichnisses ist damit die verkündete Botschaft Gottes gemeint.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: aus ihren Herzen
  rationale: Bewahrt sowohl das biblische Bild des Herzens als Zentrum des inneren Menschen als auch den griechischen Plural.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: damit sie nicht glauben und gerettet werden
  rationale: Die Formulierung gibt die vom Handeln des Teufels angestrebte Verhinderung wieder und übersetzt das Partizip im Deutschen natürlich durch koordinierte Verben.
- source_word: πιστεύσαντες
  choice: glauben
  rationale: Direkte und kontextgemäße Entsprechung, ohne den Sinn auf bloße verstandesmäßige Zustimmung oder eine bestimmte dogmatische Deutung zu verengen.
- source_word: σωθῶσιν
  choice: gerettet werden
  rationale: Bezeichnet hier im lukanischen Zusammenhang die Rettung im umfassenden heilsgeschichtlichen Sinn.
theological_decisions:
- issue: Verhältnis von Glauben und Rettung
  choice: „damit sie nicht glauben und gerettet werden“
  alternative: Deutende Formulierungen, die eine bestimmte kausale oder konfessionelle Lehre über Glauben und Rettung festschreiben
  rationale: Der griechische Text verbindet Glauben und Gerettetwerden, erklärt ihr dogmatisches Verhältnis jedoch nicht weiter. Die Übersetzung wahrt diese Spannung.
- issue: Zweck oder Folge in ἵνα μή
  choice: „damit“ als Ausdruck der Zielrichtung des teuflischen Handelns
  alternative: „sodass“ als stärker resultative Wiedergabe
  rationale: Im Kontext ist die Absicht des Teufels deutlich im Blick; zugleich wird keine Aussage darüber hinzugefügt, ob sein Vorhaben in jedem Fall gelingt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzteilung vermeidet einen schwerfälligen deutschen Satzbau und erhält die klare Abfolge des griechischen Textes.
