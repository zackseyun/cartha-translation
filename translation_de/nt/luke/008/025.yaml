id: LUK.8.25
reference: Luke 8:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: de
  text: 'Er sagte zu ihnen: „Wo ist euer Glaube[a]?“ Sie aber fürchteten sich und staunten und sagten zueinander: „Wer ist denn dieser, dass er sogar den Winden und dem Wasser gebietet und sie ihm gehorchen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrauen“. Jesu Frage kann auch so verstanden werden: „Wo ist euer Vertrauen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Wo
  rationale: Bewahrt die direkte Orts- beziehungsweise Präsenzfrage des griechischen Adverbs, ohne sie deutend zu „Warum habt ihr keinen …?“ auszuweiten.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ ist die übliche, breite Wiedergabe; im Zusammenhang steht besonders das Vertrauen der Jünger in Jesus im Vordergrund, was die Fußnote festhält.
- source_word: φοβηθέντες
  choice: Da fürchteten sie sich
  rationale: Gibt das vorzeitige beziehungsweise begleitende Partizip in natürlichem modernem Deutsch wieder und erhält die Abfolge von Furcht und Staunen.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: „Staunten“ drückt ihre verwunderte Bewunderung idiomatisch und würdig aus, ohne die Intensität unnötig zu steigern.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Wer ist dieser nur
  rationale: Das Modalwort „nur“ gibt hier die folgernde und zugleich erstaunte Kraft von ἄρα in natürlichem Deutsch wieder.
- source_word: ἐπιτάσσει
  choice: gebietet
  rationale: „Gebietet“ bezeichnet ein autoritatives Befehlen und passt zum gehobenen, aber verständlichen Erzählregister; es übernimmt nicht das abweichende Verb „bedrohen“ aus dem vorherigen Vers.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: den Winden und dem Wasser
  rationale: Folgt Lukas' ausdrücklicher Wortwahl mit dem Plural „Winde“ und dem Singular „Wasser“, statt aus Parallelberichten „Wellen“ oder „Meer“ einzutragen.
- source_word: ὑπακούουσιν αὐτῷ
  choice: sie ihm gehorchen
  rationale: Gibt die personifizierte Unterordnung der Natur klar und unmittelbar wieder.
theological_decisions:
- issue: Bedeutungsumfang von πίστις im Zusammenhang der Seenot
  choice: Glaube
  alternative: Vertrauen
  rationale: „Glaube“ wahrt den umfassenden theologischen Begriff, während „Vertrauen“ die hier besonders hervortretende kontextuelle Nuance bezeichnet; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage „Wo ist euer Glaube?“ und Lukas' konkrete Bezeichnungen „Winde“ und „Wasser“ bleiben erhalten. Die griechische Partizipialfügung wird zugunsten natürlichen Deutschen als koordinierte Erzählfolge wiedergegeben.
