source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: de
  text: Denn nichts ist verborgen, das nicht offenbar werden wird; und nichts ist geheim, das nicht bekannt werden und ans Licht kommen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das keinesfalls bekannt wird und ans Licht kommt“. Die griechische Konstruktion betont nachdrücklich, dass nichts Geheimes unbekannt bleibt.'
    reason: grammatical_explanation
lexical_decisions:
- source_word: κρυπτόν
  choice: verborgen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet etwas Verborgenes oder Verdecktes; „verborgen“ bildet einen natürlichen Gegensatz zu „offenbar“.
- source_word: φανερὸν
  choice: offenbar
  rationale: „Offenbar“ bewahrt den Gegensatz zu κρυπτόν und bezeichnet hier den Zustand, in dem etwas offen erkennbar ist.
- source_word: γενήσεται
  choice: werden wird
  rationale: 'Die Form von γίνομαι bezeichnet einen Zustandswechsel: Das Verborgene wird offenbar werden.'
- source_word: ἀπόκρυφον
  choice: geheim
  rationale: „Geheim“ unterscheidet den Ausdruck leicht von κρυπτόν, ohne den engen Parallelismus der beiden Satzhälften aufzugeben.
- source_word: οὐ μὴ γνωσθῇ
  choice: nicht erkannt werden
  rationale: Im negativen Relativsatz gibt die starke griechische Verneinung den Sinn wieder, dass nichts Geheimes unerkannt bleiben wird. Die deutsche Doppelstruktur „nichts … das nicht“ drückt dies idiomatisch aus.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: ans Licht kommen
  rationale: Die geläufige deutsche Wendung gibt das öffentliche Sichtbarwerden natürlich und würdig wieder.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ erhält die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Ausspruch.
theological_decisions:
- issue: Reichweite der Aussage über die Offenlegung
  choice: Eine allgemein formulierte Aussage, dass Verborgenes und Geheimes offenbar werden wird.
  alternative: Eine ausschließlich endzeitliche Offenlegung beim letzten Gericht oder ausschließlich die Offenbarung der Lehre Jesu im unmittelbaren Zusammenhang.
  rationale: Der Vers nennt selbst weder Zeitpunkt noch genaue Anwendung. Die Übersetzung bewahrt daher die offene Reichweite und legt den Satz nicht auf eine einzige theologische Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Parallelismus der beiden Satzhälften bleibt erhalten; „offenbar“ und „ans Licht kommen“ bilden die wiederholte Offenlegungsmotivik natürlich ab.
