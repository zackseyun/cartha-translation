  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: de
  text: 'Jesus aber sagte: »Jemand hat mich berührt; denn ich habe erkannt, dass Kraft von mir ausgegangen ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Jemand hat mich berührt
  rationale: Gibt die unbestimmte Person und die vollendete Berührung natürlich und genau wieder.
- source_word: ἔγνων
  choice: ich habe bemerkt
  rationale: Im Kontext bezeichnet das Verb Jesu bewusstes Wahrnehmen dessen, was geschehen ist; „bemerkt“ ist im modernen Deutsch natürlich, ohne die Aussage auf bloßes körperliches Empfinden zu verengen.
- source_word: δύναμιν
  choice: Kraft
  rationale: Bewahrt den breiten Bedeutungsumfang von δύναμις und den Bezug auf wirksame Heilungsmacht, ohne eine zusätzliche Erklärung in den Text einzutragen.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: dass Kraft von mir ausgegangen ist
  rationale: Gibt die resultative Bedeutung des Perfektpartizips und den Ursprung bei Jesus eng am griechischen Satz wieder.
theological_decisions:
- issue: Art und Umfang von Jesu Wissen
  choice: ich habe bemerkt
  alternative: ich wusste / ich erkannte
  rationale: Die Formulierung bestätigt Jesu bewusstes Wissen um den Kraftausgang, legt aber nicht über den Vers hinaus fest, auf welche Weise er davon wusste.
- issue: Personifizierung der Kraft
  choice: Kraft von mir ausgegangen ist
  alternative: eine Kraftwirkung von mir ausging
  rationale: Die bildhafte und theologisch spannungsreiche Ausdrucksweise des Ausgangstextes bleibt erhalten, statt sie erklärend umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Jesus aber sagte“ bildet den griechischen Kontrast ab, ohne schwerfällig zu wirken; die direkte Rede verwendet deutsche typografische Anführungszeichen.
