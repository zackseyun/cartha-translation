  source_fidelity: Die Übersetzung gibt Satzstruktur, unbestimmtes τις, die Berührung und das Perfektpartizip ἐξεληλυθυῖαν sachgerecht wieder. „Ich habe bemerkt“ ist für ἔγνων jedoch enger und stärker wahrnehmungsbezogen als das griechische Verb, das hier Jesu Erkennen/Wissen ausdrückt. „Ich habe erkannt“ wahrt diese Aussage ohne die Art des Erkennens näher festzulegen.
  naturalness: Der Text ist idiomatisches, modernes Standarddeutsch; direkte Rede und Interpunktion sind klar und würdig. Die geringfügige Änderung zu „erkannt“ bleibt ebenso natürlich.
  terminology: „Kraft“ ist die angemessene, offene Wiedergabe von δύναμις. „Von mir ausgegangen ist“ gibt Ursprung und resultativen Aspekt des griechischen Perfektpartizips wieder. Die Formulierung entspricht zudem dem englischen Audit-Trail („I knew“), ohne eine dogmatische Deutung des Wissens Jesu einzutragen.
