id: LUK.8.34
reference: Luke 8:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: de
  text: Als die Schweinehirten sahen, was geschehen war, flohen sie und berichteten es in der Stadt und auf dem Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Feldern«; gemeint ist hier wohl das ländliche Gebiet ringsum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Als ... sahen
  rationale: Der adverbiale Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben und bleibt auf die folgenden Haupthandlungen bezogen.
- source_word: οἱ βόσκοντες
  choice: die Schweinehirten
  rationale: Das substantivierte Partizip bezeichnet im Kontext diejenigen, welche die Schweine hüteten. Die Ergänzung „Schweine-“ macht den Bezug eindeutig und vermeidet das im Deutschen meist mit Schafen verbundene bloße „Hirten“.
- source_word: τὸ γεγονός
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip bezeichnet das bereits eingetretene Geschehen; das Plusquamperfekt gibt diesen vorzeitigen, abgeschlossenen Sinn idiomatisch wieder.
- source_word: ἔφυγον
  choice: flohen sie
  rationale: „Flohen“ entspricht der Grundbedeutung von φεύγω und bewahrt die durch den Kontext nahegelegte Furchtreaktion, ohne die zusätzliche Nuance einer gelungenen Rettung einzutragen.
- source_word: ἀπήγγειλαν
  choice: berichteten es
  rationale: ἀπαγγέλλω bezeichnet das Überbringen oder Berichten einer Nachricht. Das Pronomen nimmt im Deutschen idiomatisch das zuvor genannte Geschehen auf.
- source_word: εἰς τὴν πόλιν
  choice: in der Stadt
  rationale: Obwohl εἰς formal eine Richtung bezeichnen kann, nennt die Wendung beim Verb des Berichtens idiomatisch den Bereich, in dem die Nachricht verbreitet wurde.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: und auf dem Land
  rationale: Der Plural ἀγρούς kann wörtlich „Felder“ bedeuten, bezeichnet im Gegensatz zur Stadt hier aber wahrscheinlich das umliegende ländliche Gebiet. „Auf dem Land“ ist dafür natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzähldeutsch. Die knappe Abfolge der griechischen Handlung bleibt erhalten; nur die partizipiale Einleitung wird in einen natürlichen temporalen Nebensatz umgeformt.
