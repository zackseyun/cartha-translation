source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: de
  text: Denn er hatte dem unreinen Geist befohlen, aus dem Menschen auszufahren. Denn schon oft[a] hatte dieser ihn gepackt, und der Mann wurde mit Ketten und Fußfesseln gefesselt und bewacht; er zerriss die Fesseln und wurde von dem Dämon in menschenleere Gegenden getrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: schon lange. Die griechische Wendung kann sowohl eine lange Zeitspanne als auch wiederholte Ereignisse bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: in die Einöden; auch übersetzbar: in menschenleere Gegenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: hatte … befohlen
  rationale: Das Plusquamperfekt gibt im Deutschen den durch γάρ erklärend nachgetragenen und gegenüber der Reaktion des Dämons vorausliegenden Befehl natürlich wieder.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: dem unreinen Geist
  rationale: Bewahrt die neutestamentliche Reinheitsbegrifflichkeit und bezeichnet den Geist ohne psychologisierende Abschwächung.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: aus dem Menschen auszufahren
  rationale: „Ausfahren“ ist im biblischen Exorzismuskontext verständlich und bewahrt die räumliche Aussage von ἀπό.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: schon oft
  rationale: Der Plural und der Zusammenhang mit wiederholtem Fesseln sprechen für wiederholte Anfälle; die mögliche durative Deutung wird in Fußnote [a] erhalten.
- source_word: συνηρπάκει αὐτόν
  choice: hatte dieser ihn gepackt
  rationale: „Gepackt“ vermittelt den gewaltsamen Zugriff; „dieser“ macht den Bezug auf den unreinen Geist eindeutig, ohne einen zusätzlichen Namen einzuführen.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: wurde der Mann mit Ketten und Fußfesseln gebunden
  rationale: Der Imperfekt bezeichnet wiederholtes Vorgehen. „Fußfesseln“ unterscheidet πέδαις konkret von den allgemeineren Ketten.
- source_word: φυλασσόμενος
  choice: und bewacht
  rationale: Gibt den begleitenden Umstand knapp und in natürlichem Deutsch wieder.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: doch er zerriss die Fesseln
  rationale: Die finite Form vermeidet eine schwerfällige deutsche Partizipialkonstruktion; „doch“ macht den im Zusammenhang klaren Gegensatz sichtbar, ohne den Ablauf zu verändern.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: wurde von dem Dämon … getrieben
  rationale: Bewahrt passive, gewaltsame Fremdbestimmung und die persönliche dämonische Handlungsmacht des griechischen Textes.
- source_word: εἰς τὰς ἐρήμους
  choice: in menschenleere Gegenden
  rationale: Der Plural wird erhalten; „menschenleer“ bezeichnet unbewohnte, verlassene Orte, ohne eine bestimmte Wüstenlandschaft vorauszusetzen.
theological_decisions:
- issue: Dämonische Begrifflichkeit
  choice: „unreiner Geist“ und „Dämon“ werden als personale Bezeichnungen direkt wiedergegeben.
  alternative: „böser Geist“ oder eine psychologisierende Umschreibung
  rationale: Der Text unterscheidet die beiden griechischen Bezeichnungen, stellt sie aber als denselben handelnden dämonischen Akteur dar. Die Übersetzung wahrt diese Erzählperspektive ohne systematische Zusatzdeutung.
- issue: Zeitwert von πολλοῖς χρόνοις
  choice: 'wiederholte Ereignisse: „schon oft“'
  alternative: 'andauernde Zeitspanne: „schon lange“'
  rationale: Das wiederholte Binden, Zerreißen und Getriebenwerden stützt die iterative Lesart; da die Formulierung auch Dauer bezeichnen kann, bleibt die Alternative in [a] ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für klare Referenzen leicht gegliedert. „Ausfahren“ bewahrt den vertrauten biblischen Exorzismusausdruck; „menschenleere Gegenden“ hält den griechischen Plural fest.
