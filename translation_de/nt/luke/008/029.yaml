  to: Denn er hatte dem unreinen Geist befohlen, aus dem Menschen auszufahren. Denn schon oft[a] hatte dieser ihn gepackt, und der Mann wurde mit Ketten und Fußfesseln gefesselt und bewacht; er zerriss die Fesseln und wurde von dem Dämon in menschenleere Gegenden getrieben.[b]
