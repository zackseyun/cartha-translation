  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: de
  text: 'Diejenigen aber auf dem Felsen sind die, die das Wort mit Freude aufnehmen, wenn sie es hören. Doch sie haben keine Wurzel: Eine Zeit lang glauben sie, und zur Zeit der Prüfung[a] fallen sie ab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Versuchung“ oder „Anfechtung“. Das griechische Wort kann je nach Zusammenhang Prüfung, Anfechtung oder Versuchung bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: auf dem Felsen
  rationale: Die konkrete Einzahl πέτρα und das Bild des Gleichnisses bleiben erhalten; „auf felsigem Boden“ wäre erklärender, als der griechische Wortlaut verlangt.
- source_word: ὅταν ἀκούσωσιν
  choice: wenn sie es hören
  rationale: Die allgemeine Zeitangabe wird im Deutschen idiomatisch mit Präsens wiedergegeben; das ergänzte „es“ bezieht sich eindeutig auf das unmittelbar folgende Wort.
- source_word: μετὰ χαρᾶς δέχονται τὸν λόγον
  choice: das Wort … mit Freude aufnehmen
  rationale: „Aufnehmen“ gibt δέχομαι natürlich wieder, während „das Wort“ die biblische Ausdrucksweise und den Bezug auf die verkündete Botschaft bewahrt.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: sie haben keine Wurzel
  rationale: Die Einzahl des griechischen Textes und die knappe Pflanzenmetapher werden direkt bewahrt.
- source_word: πρὸς καιρὸν πιστεύουσιν
  choice: Eine Zeit lang glauben sie
  rationale: Die Wendung bezeichnet eine begrenzte Dauer. „Glauben“ gibt πιστεύω neutral wieder, ohne die Art oder Echtheit dieses Glaubens dogmatisch festzulegen.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: in einer Zeit der Prüfung
  rationale: πειρασμός kann Prüfung, Bedrängnis oder Versuchung bezeichnen. „Prüfung“ wahrt hier die größere Bedeutungsbreite; Alternativen werden in der Fußnote genannt.
- source_word: ἀφίστανται
  choice: fallen sie ab
  rationale: „Abfallen“ bringt in diesem Zusammenhang das Abwenden vom zuvor bekannten Glauben klar zum Ausdruck, ohne den technischen Ausdruck „apostatisieren“ zu verwenden.
theological_decisions:
- issue: Ob πιστεύουσιν echten rettenden Glauben oder nur oberflächlichen Glauben bezeichnet
  choice: „Eine Zeit lang glauben sie“
  alternative: „Sie scheinen zu glauben“ / „sie glauben nur oberflächlich“
  rationale: Der Vers nennt ihr Glauben und ihr späteres Abfallen, entscheidet aber nicht ausdrücklich spätere Lehrfragen über rettenden Glauben, Beharren oder Abfall. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von πειρασμός
  choice: „Prüfung“ im Haupttext
  alternative: „Versuchung“ oder „Bedrängnis“
  rationale: Das griechische Wort kann sowohl eine äußere Erprobung als auch eine zur Sünde lockende Versuchung bezeichnen. Der Haupttext verwendet den breiteren Ausdruck; die Fußnote hält die Alternativen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist natürlich, bleibt aber nahe an der Bildsprache und gedanklichen Struktur des griechischen Textes. Der Doppelpunkt verbindet Wurzellosigkeit, zeitweiligen Glauben und späteres Abfallen als Erklärungseinheit.
