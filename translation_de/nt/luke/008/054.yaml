  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: de
  text: 'Er aber nahm sie bei der Hand und rief: „Kind[a], steh auf!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mädchen“. Das griechische Wort παῖς kann „Kind“ oder in diesem Zusammenhang „Mädchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Er aber
  rationale: δέ markiert hier eine leichte Gegenüberstellung beziehungsweise narrative Wendung; αὐτός wird durch das natürliche deutsche Pronomen wiedergegeben, ohne die Betonung mit „selbst“ zu überzeichnen.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: nahm sie bei der Hand
  rationale: Die Wendung gibt den konkreten körperlichen Kontakt idiomatisch und würdevoll wieder. Das vorzeitige Partizip wird als koordinierte Handlung ausgedrückt.
- source_word: ἐφώνησεν λέγων
  choice: rief
  rationale: φωνέω bezeichnet hier einen deutlich hörbaren Zuruf. Das redundante λέγων muss im natürlichen Deutschen vor der direkten Rede nicht eigens mit „und sagte“ wiedergegeben werden.
- source_word: Ἡ παῖς
  choice: Kind
  rationale: παῖς kann allgemein „Kind“ und im Kontext konkret „Mädchen“ bedeuten. „Kind“ bewahrt die lexikalische Weite und den persönlichen, zärtlichen Ton, ohne den Parallelberichten eine präzisere Formulierung zu entlehnen.
- source_word: ἔγειρε
  choice: steh auf
  rationale: Der Präsensimperativ von ἐγείρω ist hier ein unmittelbarer Befehl, sich zu erheben. „Steh auf“ ist in modernem Deutsch natürlich und bewahrt zugleich im Kontext die Spannung zwischen gewöhnlichem Aufstehen und der Wiederherstellung zum Leben.
theological_decisions:
- issue: Jesu Anrede an die Tochter des Jaïrus
  choice: Kind
  alternative: Mädchen
  rationale: Das grammatisch feminine παῖς bezeichnet im Kontext zwar ein Mädchen, kann lexikalisch aber allgemein „Kind“ bedeuten. Die Hauptfassung erhält diese Bedeutungsbreite; die Fußnote nennt die kontextuell eindeutige Alternative.
- issue: Wiedergabe des Befehls ἔγειρε
  choice: steh auf
  alternative: erhebe dich
  rationale: Die direkte, alltägliche Form entspricht dem griechischen Imperativ und vermeidet unnötig altertümliche Erhabenheit. Zugleich wird die Auferweckungsbedeutung des Verbs nicht erklärend in den Text hineingetragen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe direkte Rede bewahrt die Eindringlichkeit des griechischen Textes; „rief“ vermeidet die im Deutschen schwerfällige Doppelung „rief und sagte“.
