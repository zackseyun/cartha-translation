  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: de
  text: Und sie lachten ihn aus, weil sie wussten, dass sie gestorben war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: lachten ihn aus
  rationale: Das Imperfekt bezeichnet hier einen andauernden beziehungsweise wiederholten Vorgang. „Sie lachten ihn aus“ ist im modernen Deutschen idiomatisch und bewahrt den spöttischen Gehalt des Verbs.
- source_word: αὐτοῦ
  choice: ihn
  rationale: Der Genitiv hängt von καταγελάω ab und bezeichnet die verspottete Person. Im Deutschen verlangt die idiomatische Wendung „jemanden auslachen“ den Akkusativ.
- source_word: εἰδότες
  choice: weil sie wussten
  rationale: Das Partizip bezeichnet im Zusammenhang den Grund ihres Auslachens. Ein kausaler Nebensatz ist im Deutschen natürlicher als „wissend“ und gibt den Sinn klar wieder.
- source_word: ὅτι
  choice: dass
  rationale: 'ὅτι leitet den Inhalt ihres Wissens ein: Sie wussten, dass sie gestorben war.'
- source_word: ἀπέθανεν
  choice: gestorben war
  rationale: Der Aorist bezeichnet den eingetretenen Tod. Das Plusquamperfekt ordnet dieses Ereignis im Deutschen passend vor ihrem Wissen und ihrer Reaktion ein.
theological_decisions:
- issue: Ob die Identität des verstorbenen Mädchens ausdrücklich genannt werden soll
  choice: Das im Kontext eindeutige Pronomen „sie“ wird beibehalten.
  alternative: „das Kind war gestorben“ oder „das Mädchen war tot“
  rationale: Im Griechischen steht kein ausdrückliches Substantiv; das Subjekt der Verbform ergibt sich aus dem Kontext. „Sie war gestorben“ bewahrt die knappe Ausdrucksweise und fügt keine Bezeichnung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die idiomatische Wendung „ihn auslachen“ gibt die spöttische Reaktion prägnant wieder; der kausale Nebensatz sorgt für natürlichen deutschen Satzbau.
