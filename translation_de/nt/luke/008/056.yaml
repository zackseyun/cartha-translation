  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: de
  text: Und ihre Eltern waren außer sich vor Staunen. Er aber wies sie an, niemandem zu sagen, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστησαν
  choice: gerieten außer sich vor Staunen
  rationale: Die Form bezeichnet hier eine überwältigende Reaktion des Staunens. Die Wendung gibt die Stärke von ἐξίστημι wieder, ohne einen Verlust der Selbstbeherrschung als eigenständige Aussage festzulegen.
- source_word: γονεῖς
  choice: Eltern
  rationale: γονεῖς ist die gewöhnliche Bezeichnung für beide Elternteile und wird im Deutschen direkt und natürlich mit „Eltern“ wiedergegeben.
- source_word: ὁ δὲ
  choice: Er aber
  rationale: Das Pronomen greift Jesus als handelnde Person auf; δέ setzt seine Anweisung in einen leichten Kontrast zur Reaktion der Eltern.
- source_word: παρήγγειλεν
  choice: wies sie an
  rationale: παραγγέλλω bezeichnet eine verbindliche Anweisung oder einen Befehl. „wies sie an“ bewahrt die Direktive, ohne unnötig einen schroffen Ton einzutragen.
- source_word: μηδενὶ εἰπεῖν
  choice: niemandem zu sagen
  rationale: Der Dativ μηδενί bezeichnet den Empfänger der Mitteilung. Die deutsche Konstruktion entspricht der griechischen Aussage klar und idiomatisch.
- source_word: τὸ γεγονός
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip bezeichnet das eingetretene Geschehen. Der deutsche Nebensatz gibt sowohl den Ereignisbezug als auch dessen Vorzeitigkeit natürlich wieder.
theological_decisions:
- issue: Schweigegebot und sein Umfang
  choice: Die Anweisung wird schlicht als Verbot wiedergegeben, irgendjemandem von dem Geschehen zu erzählen.
  alternative: Die Aussage ausdrücklich als zeitlich begrenztes Schweigegebot oder als Teil eines umfassenden Motivs messianischer Verborgenheit deuten.
  rationale: Der Vers nennt weder den Grund noch die Dauer der Anweisung. Die Übersetzung lässt diese theologische Spannung deshalb offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Außer sich vor Staunen“ bewahrt die ungewöhnliche Stärke der elterlichen Reaktion; „wies sie an“ klingt natürlich und behält den verbindlichen Charakter der Anweisung bei.
