id: LUK.8.3
reference: Luke 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: de
  text: und Johanna, die Frau des Chusa, eines Verwalters des Herodes, und Susanna und viele andere, die ihnen[a] aus ihrem Besitz dienten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben „ihm“ statt „ihnen“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „aus ihren Mitteln“ oder „von dem, was ihnen gehörte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: die Frau des
  rationale: In der Verbindung mit dem Genitiv eines Personennamens bezeichnet γυνή hier am natürlichsten die Ehefrau; die Formulierung ist im Deutschen klar und würdevoll.
- source_word: ἐπιτρόπου
  choice: eines Verwalters
  rationale: ἐπίτροπος bezeichnet jemanden, dem die Aufsicht über Angelegenheiten oder Besitz anvertraut ist. „Verwalter“ passt zum höfischen beziehungsweise herrschaftlichen Umfeld, ohne die genaue Amtsstellung stärker festzulegen als der griechische Text.
- source_word: ἕτεραι πολλαί
  choice: viele andere
  rationale: Das feminine Pluralwort bezieht sich auf die zuvor genannten Frauen. Im Deutschen ist „viele andere“ in diesem Zusammenhang eindeutig und vermeidet eine unnötige Wiederholung.
- source_word: αἵτινες
  choice: die
  rationale: Das Relativpronomen leitet eine nähere Beschreibung der genannten Frauen ein; das schlichte deutsche Relativpronomen gibt dies natürlich wieder.
- source_word: διηκόνουν
  choice: dienten
  rationale: διακονέω bezeichnet allgemein das Dienen oder die praktische Unterstützung. „Dienten“ bewahrt diese Bedeutungsbreite und vermeidet eine vorschnelle Verengung auf eine kirchliche Amtsfunktion.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der vorgegebene SBLGNT-Text hat den Plural αὐτοῖς, der sich am ehesten auf Jesus und seine Begleiter bezieht.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: mit dem, was sie besaßen
  rationale: Die Wendung bezeichnet Unterstützung aus dem eigenen Besitz oder den eigenen Mitteln der Frauen. Diese Formulierung ist gegenwartsnah, verständlich und bleibt nahe am konkreten Besitzbezug.
theological_decisions:
- issue: Bezug und Numerus von αὐτοῖς
  choice: 'Plural: Die Frauen dienten Jesus und denen, die mit ihm unterwegs waren.'
  alternative: 'Singular: Die Frauen dienten ihm, also Jesus.'
  rationale: Der zugrunde gelegte SBLGNT-Text liest αὐτοῖς im Plural. Die Übersetzung folgt deshalb diesem Text, während die abweichende Singularlesart in einer Fußnote dokumentiert wird, ohne daraus eine lehrmäßige Folgerung abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur schließt unmittelbar an den vorausgehenden Vers an. „Dienten“ erhält die Breite des griechischen Verbs; die anschließende Wendung macht die materielle Grundlage dieses Dienstes deutlich. Die Fußnotenmarker stehen jeweils direkt an der betreffenden Übersetzungsstelle.
