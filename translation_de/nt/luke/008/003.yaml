review_pass:
  verdict: revise
  source_fidelity: 'Die Aufzählung, die Bezeichnung Johannas als Ehefrau des Chusa, die pluralische Lesart „ihnen“ und die materielle Grundlage ihres Dienstes geben den griechischen Text grundsätzlich zutreffend wieder. „Mit dem, was sie besaßen“ schwächt jedoch ἐκ („aus/von“) ab: Es kann bloß das eingesetzte Mittel bezeichnen, nicht ausdrücklich die Herkunft der Unterstützung aus ihrem Besitz.'
  naturalness: Der Satz ist gut verständliches modernes Standarddeutsch und wahrt den anschließenden Charakter des Verses. „Die ihnen aus ihrem Besitz dienten“ ist idiomatisch genug und stellt die im Griechischen ausgedrückte Herkunft klarer heraus.
  terminology: „Frau des Chusa“, „Verwalter des Herodes“ und „dienten“ sind sachgerecht. „Dienten“ erhält die offene Bedeutung von διηκόνουν, während „aus ihrem Besitz“ die durch den folgenden Ausdruck nahegelegte materielle Unterstützung verdeutlicht, ohne den Dienst auf eine einzelne Form festzulegen.
  issues:
  - severity: medium
    issue: Die Präposition „mit“ in „mit dem, was sie besaßen“ entspricht ἐκ nicht präzise.
    rationale: ἐκ τῶν ὑπαρχόντων αὐταῖς bezeichnet Unterstützung, die aus ihrem eigenen Besitz bzw. ihren verfügbaren Mitteln hervorging. „Mit“ kann im Deutschen lediglich das Instrument ausdrücken. Die Änderung zu „aus ihrem Besitz“ bewahrt die Herkunftsnuance.
  revised_text: und Johanna, die Frau des Chusa, eines Verwalters des Herodes, und Susanna und viele andere, die ihnen[a] aus ihrem Besitz dienten.[b]
