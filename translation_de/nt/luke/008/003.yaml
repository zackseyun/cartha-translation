revisions:
- from: und Johanna, die Frau des Chusa, eines Verwalters des Herodes, und Susanna und viele andere, die ihnen[a] mit dem dienten, was sie besaßen.[b]
  to: und Johanna, die Frau des Chusa, eines Verwalters des Herodes, und Susanna und viele andere, die ihnen[a] aus ihrem Besitz dienten.[b]
  rationale: Die einzige sichere Änderung ersetzt „mit dem, was sie besaßen“ durch „aus ihrem Besitz“, um die Präposition ἐκ und den Besitzbezug von τῶν ὑπαρχόντων αὐταῖς genauer wiederzugeben. Die Fußnote b wurde angepasst, damit sie nicht die nun im Haupttext stehende Formulierung als bloße Alternative wiederholt. Beide Fußnotenanker bleiben unmittelbar an den jeweils betroffenen Stellen.
