  source_fidelity: 'Die Handlungsabfolge und die Aussagen werden insgesamt zuverlässig wiedergegeben: Das vorausgehende Sehen, der Aufschrei, das Niederfallen, die laute Anrede und die dringliche Bitte entsprechen dem Griechischen. Die Formel »Was habe ich mit dir zu tun?« gibt Τί ἐμοὶ καὶ σοί idiomatisch wieder; die Fußnote hält die formnähere Alternative fest. Die Anrede υἱὲ τοῦ θεοῦ τοῦ ὑψίστου wird jedoch im Deutschen klarer und näher am etablierten Titelgebrauch als »Sohn des höchsten Gottes« wiedergegeben.'
