source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: de
  text: 'Als er Jesus sah, schrie er auf, warf sich vor ihm nieder und rief mit lauter Stimme: »Was habe ich mit dir zu tun, Jesus, Sohn des höchsten Gottes?[a] Ich flehe dich an: Quäle mich nicht!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was ist zwischen mir und dir?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ τὸν Ἰησοῦν
  choice: Als er Jesus sah
  rationale: Das Aoristpartizip bezeichnet den vorausgehenden Umstand; der deutsche Temporalsatz gibt ihn natürlich und präzise wieder. δέ markiert hier einen leichten narrativen Übergang und muss nicht eigens mit »aber« wiedergegeben werden.
- source_word: ἀνακράξας
  choice: schrie er auf
  rationale: Das Verb bezeichnet einen plötzlichen lauten Ausruf. »Schrie auf« unterscheidet diesen ersten Aufschrei von der anschließend ausdrücklich genannten lauten Rede.
- source_word: προσέπεσεν αὐτῷ
  choice: warf sich vor ihm nieder
  rationale: Die Wendung beschreibt ein Niederfallen vor einer Person. »Warf sich … nieder« ist im Deutschen anschaulich, ohne die Haltung vorschnell als Anbetung zu deuten.
- source_word: φωνῇ μεγάλῃ εἶπεν
  choice: rief mit lauter Stimme
  rationale: Die instrumentale beziehungsweise modale Wendung wird nahe am griechischen Ausdruck wiedergegeben; »rief« ist angesichts der Lautstärke natürlicher als das farblose »sagte«.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Was habe ich mit dir zu tun
  rationale: Die semitisch geprägte Formel drückt Abwehr und Distanzierung aus. Die gewählte deutsche Redewendung bewahrt diesen Sinn; eine formnähere Wiedergabe steht in der Fußnote.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Sohn Gottes, des Höchsten
  rationale: Die Wiedergabe lässt die grammatische Beziehung von τοῦ ὑψίστου zu θεοῦ sichtbar und klingt zugleich würdig. Sie identifiziert Gott als den Höchsten, ohne den Titel auszuweiten.
- source_word: δέομαί σου
  choice: Ich flehe dich an
  rationale: Die Form bezeichnet eine dringliche Bitte. »Ich flehe dich an« trifft ihre Intensität in natürlichem, gehobenem Standarddeutsch.
- source_word: μή με βασανίσῃς
  choice: Quäle mich nicht
  rationale: βασανίζω bezeichnet hier schwere Qual beziehungsweise Peinigung. »Quälen« wahrt die Breite des Ausdrucks und legt sich nicht unnötig auf körperliche Folter fest.
theological_decisions:
- issue: Bekenntnis der Identität Jesu durch den Dämon
  choice: Jesus, Sohn Gottes, des Höchsten
  alternative: Jesus, Sohn des höchsten Gottes
  rationale: Die Übersetzung erhält die volle christologische Anrede, ohne sie durch spätere dogmatische Formeln zu erweitern. Die gewählte Genitivfolge folgt zudem der griechischen Struktur enger als die alternative etablierte Titelform.
- issue: Bedeutung des Niederfallens
  choice: warf sich vor ihm nieder
  alternative: betete ihn an
  rationale: προσπίπτω beschreibt die äußere Handlung, bezeichnet aber nicht ausdrücklich Anbetung. Die Übersetzung bewahrt diese Offenheit und deutet das Verhalten nicht konfessionell oder dogmatisch aus.
translation_notes:
  register: Modernes, würdevolles Erzähl- und Rederegister. Die direkte Rede ist eindringlich, aber nicht altertümlich; die Wiederholung der Lautäußerungen im griechischen Text bleibt durch »schrie … auf« und »rief mit lauter Stimme« erkennbar.
