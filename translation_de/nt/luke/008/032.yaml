source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: de
  text: Dort weidete auf dem Berg eine große Schweineherde[a]. Und sie[b] baten ihn eindringlich, ihnen zu erlauben, in jene Schweine hineinzugehen. Da erlaubte er es ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine beträchtliche Herde von Schweinen“ beziehungsweise „viele Schweine“. Statt „auf dem Berg“ ist auch „am Berghang“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: „Sie“ bezieht sich im Zusammenhang auf die Dämonen beziehungsweise unreinen Geister.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: eine große Schweineherde
  rationale: ἱκανῶν bezeichnet hier idiomatisch eine beträchtliche Zahl beziehungsweise Größe; „große Schweineherde“ ist natürliches modernes Deutsch.
- source_word: βοσκομένη
  choice: weidete
  rationale: Das Partizip beschreibt die Nahrungsaufnahme der Herde. „weidete“ ist knapp und im Deutschen auch für eine Schweineherde verständlich.
- source_word: ἐν τῷ ὄρει
  choice: am Berg
  rationale: Die Wendung gibt die Lage am Berg wieder, ohne durch „auf dem Berg“ unnötig den Gipfel anzudeuten.
- source_word: παρεκάλεσαν
  choice: baten ihn eindringlich
  rationale: Das Verb bezeichnet hier eine dringende Bitte; diese Formulierung bewahrt die Intensität, ohne übermäßig altertümlich zu klingen.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: zu erlauben / erlaubte
  rationale: Die Wiederholung desselben deutschen Verbs spiegelt die lexikalische Entsprechung zwischen Bitte und Gewährung im Griechischen.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: in jene Schweine hineinzugehen
  rationale: „jene“ bildet das demonstrative ἐκείνους ab; „hineinzugehen“ gibt die gerichtete Bewegung von εἰς mit εἰσελθεῖν deutlich wieder.
- source_word: δὲ / καὶ
  choice: Dort … Und … Da
  rationale: Die deutschen Verknüpfungen gestalten den Erzählfortgang natürlich. Ein temporales „nun“ wird nicht eingeführt; „da“ im Schlusssatz markiert die unmittelbare Reaktion.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von παρεκάλεσαν
  choice: Das Pronomen „sie“ bleibt im Haupttext stehen; eine Fußnote nennt Dämonen beziehungsweise unreine Geister als Bezug.
  alternative: „Die Dämonen baten ihn eindringlich“
  rationale: Der Zusammenhang identifiziert die Sprecher, doch der griechische Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt diese Implizitheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch klar; unnötig altertümliche Wörter wie „Schweineherde weidete daselbst“ werden vermieden. Sämtliche Fußnotenmarker stehen im Haupttext.
