  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: de
  text: Was aber zwischen die Dornen fiel, das sind diejenigen, die gehört haben; während sie ihren Weg gehen, werden sie von den Sorgen[a], dem Reichtum und den Freuden des Lebens erstickt und bringen keine Frucht zur Reife[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ängsten“ beziehungsweise „Bekümmernissen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lassen keine Frucht ausreifen“ beziehungsweise „bringen die Frucht nicht zur Vollendung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: Was ... unter die Dornen fiel
  rationale: Die substantivierte sächliche Partizipialkonstruktion wird ohne Hinzufügung von „Samen“ wiedergegeben. „Unter die Dornen“ ist im Deutschen die natürliche räumliche Entsprechung und bewahrt das Bild des Gleichnisses.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: das sind diejenigen, die gehört haben
  rationale: Der Numeruswechsel vom sächlichen Singular zum menschlichen Plural bleibt erkennbar. Das Perfekt gibt die abgeschlossene Handlung des Aoristpartizips in diesem erklärenden Zusammenhang natürlich wieder; ein nicht ausdrücklich genanntes Objekt wird nicht ergänzt.
- source_word: ὑπὸ μεριμνῶν
  choice: von den Sorgen
  rationale: μέριμναι kann Sorgen, Bekümmernisse oder Ängste bezeichnen. „Sorgen“ ist im modernen Standarddeutsch breit verständlich und passt natürlich in die Dreierreihe.
- source_word: πλούτου
  choice: dem Reichtum
  rationale: „Reichtum“ gibt den Singular πλοῦτος präzise und idiomatisch wieder, ohne den Begriff auf Geldbesitz zu verengen.
- source_word: ἡδονῶν τοῦ βίου
  choice: den Freuden des Lebens
  rationale: Die Formulierung bewahrt die Genitivverbindung und gibt βίος als das gewöhnliche irdische Leben wieder. „Freuden“ ist würdig und verständlich; „Vergnügungen“ wäre stärker wertend.
- source_word: πορευόμενοι
  choice: während sie ihren Weg gehen
  rationale: Die Wendung bringt den durativen Charakter des Präsenspartizips und das Bewegungsbild zum Ausdruck, ohne es ausdrücklich als Gesamtmetapher für den Lebenslauf festzulegen.
- source_word: συμπνίγονται
  choice: werden ... erstickt
  rationale: Das Passiv und das kräftige Pflanzenbild werden unmittelbar bewahrt. „Verdrängt“ wäre abstrakter und würde die Bildsprache abschwächen.
- source_word: οὐ τελεσφοροῦσιν
  choice: bringen keine Frucht zur Reife
  rationale: Die Wiedergabe verbindet das Fruchtbild mit dem Bedeutungsaspekt des Vollendens beziehungsweise Ausreifens und vermeidet die zu schwache Aussage, sie trügen überhaupt keine Frucht.
theological_decisions:
- issue: Art des Scheiterns der Hörer auf dem dornenbewachsenen Boden
  choice: Die landwirtschaftliche Bildsprache des Erstickens und der nicht zur Reife gebrachten Frucht bleibt stehen.
  alternative: Die Hörer ausdrücklich als niemals wahrhaft Glaubende, als abgefallene Gläubige oder als lediglich unbelohnte Gläubige bestimmen.
  rationale: Der Vers beschreibt ihre Reaktion und Fruchtlosigkeit, entscheidet aber nicht ausdrücklich spätere Lehrfragen über Wiedergeburt, Abfall oder Beharren. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolonanschluss hält die Aussage als einen zusammenhängenden Satz lesbar. Die Metaphern von Weg, Ersticken und Fruchtreife werden bewahrt; nicht ausdrücklich genannte Begriffe wie „Samen“ oder „Wort“ werden nicht in den Haupttext eingefügt.
