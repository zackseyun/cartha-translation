  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: de
  text: 'Der Mann aber, aus dem die Dämonen ausgefahren waren, bat Jesus inständig, bei ihm sein zu dürfen. Doch Jesus schickte ihn fort und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: bat ihn inständig
  rationale: Das Imperfekt von δέομαι bezeichnet ein anhaltendes oder wiederholtes eindringliches Bitten. „Bat ihn inständig“ ist natürliches, würdiges Deutsch und bewahrt die Nachdrücklichkeit.
- source_word: ὁ ἀνὴρ
  choice: der Mann
  rationale: ἀνήρ bezeichnet hier den bereits erwähnten männlichen Menschen; „der Mann“ ist sachlich und idiomatisch.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: von dem die Dämonen ausgefahren waren
  rationale: Das Plusquamperfekt ἐξεληλύθει beschreibt ein zuvor abgeschlossenes Geschehen. „Ausgefahren“ bewahrt den in diesem Zusammenhang üblichen exorzistischen Sinn des Verbs.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: „Dämonen“ gibt δαιμόνια direkt wieder und wahrt die vom Text vorausgesetzte personale übernatürliche Wirklichkeit.
- source_word: εἶναι σὺν αὐτῷ
  choice: bei ihm bleiben zu dürfen
  rationale: Wörtlich steht „bei ihm zu sein“. Im Zusammenhang einer Bitte und der anschließenden Wegsendung drückt „bei ihm bleiben zu dürfen“ den Sinn im Deutschen natürlich aus, ohne ein Mitreisen ausdrücklich hinzuzufügen.
- source_word: ἀπέλυσεν
  choice: schickte ihn fort
  rationale: Im Kontext lehnt Jesus die Bitte ab und weist dem Mann einen anderen Weg. „Schickte ihn fort“ entspricht dem erzählerischen Sinn, ohne unnötige Härte einzutragen.
- source_word: λέγων
  choice: und sagte
  rationale: Das präsentische Partizip leitet die folgende direkte Rede ein. Die koordinierte Wiedergabe „und sagte“ ist im modernen Deutschen flüssiger als „indem er sagte“.
theological_decisions:
- issue: Wiedergabe von δαιμόνια im Exorzismusbericht
  choice: die Dämonen
  alternative: die bösen Geister
  rationale: Die direkte Wiedergabe „Dämonen“ bewahrt die personale und übernatürliche Darstellung des griechischen Textes und schwächt sie nicht zu einer unbestimmteren Kategorie ab.
- issue: Inhalt der Bitte εἶναι σὺν αὐτῷ
  choice: bei ihm bleiben zu dürfen
  alternative: mit ihm gehen zu dürfen
  rationale: Der griechische Ausdruck bedeutet zunächst „bei ihm sein“. Die Übersetzung vermeidet es, die mögliche Vorstellung einer dauerhaften Begleitung oder Jüngerschaft stärker festzulegen, als der Wortlaut erlaubt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Das nachgestellte δέ wird mit „aber“ beziehungsweise „doch“ als leichter Kontrast wiedergegeben. Der Vers endet mit einem Doppelpunkt, da λέγων die direkte Rede des folgenden Verses eröffnet.
