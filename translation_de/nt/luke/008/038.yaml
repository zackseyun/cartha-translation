    issue: „bei ihm bleiben zu dürfen“ ist enger als der griechische Wortlaut.
    rationale: εἶναι σὺν αὐτῷ bezeichnet „bei/mit ihm sein“ und enthält kein eigenes Verb für „bleiben“. Die Ergänzung kann zwar aus dem Kontext naheliegen, legt die Bitte aber stärker als der Text fest.
  - severity: low
    issue: Die Pronomenbezüge sind in der vorliegenden Form potenziell mehrdeutig.
    rationale: Nach „Der Mann ... bat ihn ... bei ihm“ stehen zwei männliche Bezugspersonen im Satz. Die explizite Nennung Jesu macht die Rollen ohne Bedeutungszuwachs klar.
  revised_text: 'Der Mann aber, aus dem die Dämonen ausgefahren waren, bat Jesus inständig, bei ihm sein zu dürfen. Doch Jesus schickte ihn fort und sagte:'
