id: LUK.8.49
reference: Luke 8:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: de
  text: 'Während er noch redete, kam jemand vom Synagogenvorsteher und sagte: „Deine Tochter ist gestorben. Bemühe den Lehrer nicht länger.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Während er noch redete
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung; „noch“ gibt ἔτι wieder.
- source_word: ἔρχεταί τις
  choice: kam jemand
  rationale: Das historische Präsens wird im deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben; τις bleibt unbestimmt.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: vom Synagogenvorsteher
  rationale: παρά mit Genitiv bezeichnet hier die Herkunft. „Synagogenvorsteher“ ist eine klare, etablierte Bezeichnung für den leitenden Amtsträger; die Formulierung lässt offen, ob der Bote unmittelbar von ihm oder aus seinem Umfeld kommt.
- source_word: λέγων
  choice: und sagte
  rationale: Die koordinierte finite Form gibt das begleitende Partizip in natürlichem modernem Deutsch wieder.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Deine Tochter ist gestorben
  rationale: Das Perfekt bezeichnet den eingetretenen Tod mit fortbestehendem Ergebnis. Das deutsche Perfekt ist hier idiomatisch und wahrt den Ereignisaspekt.
- source_word: μηκέτι σκύλλε
  choice: Bemühe … nicht länger
  rationale: μηκέτι fordert das Ende einer bereits als Mühe verstandenen Inanspruchnahme. „Bemühen“ gibt σκύλλω respektvoll und dem ernsten Kontext angemessen wieder.
- source_word: τὸν διδάσκαλον
  choice: den Lehrer
  rationale: „Lehrer“ entspricht der gewöhnlichen Bedeutung von διδάσκαλος, ohne den Titel interpretierend zu erhöhen.
theological_decisions:
- issue: Amtsbezeichnung ἀρχισυνάγωγος
  choice: Synagogenvorsteher
  alternative: Leiter der Synagoge
  rationale: Die gewählte Bezeichnung benennt die institutionelle Funktion präzise und führt keine späteren kirchlichen Amtsvorstellungen ein.
- issue: Anrede beziehungsweise Bezeichnung διδάσκαλος
  choice: der Lehrer
  alternative: der Meister
  rationale: Der griechische Text verwendet die gewöhnliche Bezeichnung für einen Lehrer. Die Übersetzung vermeidet eine christologische Steigerung, die in diesem Ausdruck selbst nicht ausdrücklich vorliegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und dringlich; das historische Präsens wird gemäß natürlichem deutschem Erzählstil als Präteritum wiedergegeben.
