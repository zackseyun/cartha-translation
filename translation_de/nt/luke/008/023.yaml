source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: de
  text: Während sie über den See fuhren, schlief er ein. Da kam ein Sturmwind auf den See herab, und ihr Boot lief voll Wasser[a]; sie waren in Gefahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sie wurden gefüllt“ oder „sie liefen voll“; gemeint ist offenbar, dass das Boot voll Wasser lief.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Während sie über den See fuhren
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig andauernde Handlung. „Über den See fuhren“ klingt im Deutschen natürlich; ein Segel wird im Ausgangstext nicht ausdrücklich erwähnt.
- source_word: ἀφύπνωσεν
  choice: schlief er ein
  rationale: Der Aorist bezeichnet hier am ehesten den Eintritt in den Schlaf. Das Subjekt Jesus ergibt sich aus dem Zusammenhang.
- source_word: κατέβη
  choice: kam … herab
  rationale: Die Wendung bewahrt die räumliche Vorstellung eines Sturms, der auf den See hinabkommt, ohne das Verb durch „brach los“ abzuschwächen.
- source_word: λαῖλαψ ἀνέμου
  choice: ein Sturmwind
  rationale: Die Verbindung bezeichnet einen heftigen, vom Wind geprägten Sturm. „Sturmwind“ ist knapp, verständlich und wahrt diesen Schwerpunkt.
- source_word: εἰς τὴν λίμνην
  choice: auf den See
  rationale: Bei einem Wetterereignis ist „auf den See“ die natürliche deutsche Wiedergabe der Richtung, die εἰς ausdrückt.
- source_word: συνεπληροῦντο
  choice: Ihr Boot lief voll Wasser
  rationale: Die griechische Pluralform lautet wörtlich etwa „sie wurden gefüllt“. Gemeint ist im Zusammenhang sehr wahrscheinlich das Boot beziehungsweise die Lage der Insassen im sich füllenden Boot; die Ergänzung macht den Vorgang im Deutschen verständlich, während die Fußnote die formale Mehrdeutigkeit offenlegt.
- source_word: ἐκινδύνευον
  choice: sie gerieten in Gefahr
  rationale: Die Form beschreibt die fortdauernde beziehungsweise sich entwickelnde Gefährdung. Die gewählte Wendung ist modern und ernst, ohne altertümlich zu klingen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Sätze bilden die rasche Zuspitzung der Gefahr ab; die nicht ausdrücklich genannte Bezeichnung „Boot“ wird zur natürlichen deutschen Verständlichkeit ergänzt und in der Fußnote transparent gemacht.
