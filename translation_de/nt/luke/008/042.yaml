  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: de
  text: denn er hatte eine einzige Tochter[a], etwa zwölf Jahre alt, und sie lag im Sterben. Während er unterwegs war, drängten ihn die Menschenmengen so dicht, dass sie ihn beinahe erdrückten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine einzige Tochter“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bezeichnet ein so dichtes Gedränge, dass jemand beinahe erdrückt wird oder kaum Luft bekommt.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: eine einzige Tochter
  rationale: In Verbindung mit θυγάτηρ bezeichnet das Wort die einzige beziehungsweise einzigartige Tochter; „eine einzige Tochter“ gibt den familiären Sinn natürlich wieder, ohne eine zeugungsbezogene Nebenbedeutung einzutragen.
- source_word: ὡς ἐτῶν δώδεκα
  choice: etwa zwölf Jahre alt
  rationale: ὡς bei einer Zahlenangabe kennzeichnet eine ungefähre Altersangabe; diese idiomatische deutsche Formulierung bewahrt die Annäherung.
- source_word: ἀπέθνῃσκεν
  choice: lag im Sterben
  rationale: Der Imperfekt beschreibt einen andauernden Sterbevorgang, nicht einen bereits eingetretenen Tod.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Während er hinging
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv bezeichnet eine gleichzeitig ablaufende Handlung. „hinging“ lässt das im Kontext erkennbare Ziel unausgesprochen, wie es auch der griechische Satz tut.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der Plural wird bewahrt; „Menschenmengen“ ist im heutigen Deutsch verständlicher und natürlicher als „Volksmengen“.
- source_word: συνέπνιγον
  choice: bedrängten ihn von allen Seiten
  rationale: Das Verb schildert ein enges Zusammendrängen, das jemanden beinahe erdrückt oder ihm die Luft nimmt. Die Wiedergabe vermittelt die körperliche Enge, ohne eine tatsächliche Erstickung zu behaupten.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion begründet die Dringlichkeit der Bitte aus dem vorausgehenden Vers; „denn“ fügt sich als versübergreifende Fortsetzung natürlich ein.
- source_word: αὐτῷ
  choice: er hatte
  rationale: Der possessive Dativ bei ἦν wird im Deutschen idiomatisch mit „haben“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt erkennbar an den vorherigen Vers angeschlossen. „lag im Sterben“ bildet den durativen Aspekt ab; „bedrängten ihn von allen Seiten“ macht die körperliche Enge des Gedränges verständlich.
