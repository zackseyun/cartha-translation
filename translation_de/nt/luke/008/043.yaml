source:
  edition: SBLGNT
  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: de
  text: Und eine Frau litt seit zwölf Jahren an Blutungen[a]. Sie hatte ihre gesamten Mittel zum Leben bei Ärzten aufgebraucht[b][c] und konnte von niemandem geheilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in einem Blutfluss war“; auch möglich: „an einem Blutfluss litt“ oder „einen Blutfluss hatte“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort βίος meint hier ihre Mittel zum Leben beziehungsweise ihren Besitz, nicht ihre Lebenszeit.
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften lassen die Worte „bei Ärzten aufgebraucht“ einschließlich „ihre gesamten Mittel zum Leben“ aus. Der SBLGNT-Text enthält sie.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: da war eine Frau, die … litt
  rationale: Die Partizipialkonstruktion wird als natürliche deutsche Einführung mit Relativsatz wiedergegeben und behält ihre hintergrundgebende Funktion im Erzählfluss.
- source_word: ἐν ῥύσει αἵματος
  choice: an Blutungen litt
  rationale: Die idiomatische Formulierung bezeichnet den anhaltenden krankhaften Blutfluss klar, ohne seine genaue medizinische Ursache festzulegen.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: seit zwölf Jahren
  rationale: Die Präposition ἀπό bezeichnet hier die bis zum erzählten Zeitpunkt andauernde Zeitspanne; „seit“ ist dafür im Deutschen idiomatisch.
- source_word: ἰατροῖς προσαναλώσασα
  choice: für Ärzte aufgebraucht hatte
  rationale: Das Verb bezeichnet das vollständige Aufwenden von Mitteln; der Dativ nennt, wofür beziehungsweise bei wem diese Mittel ausgegeben wurden.
- source_word: ὅλον τὸν βίον
  choice: ihren ganzen Lebensunterhalt
  rationale: βίος bezeichnet hier ihre Mittel zum Leben und nicht ihr biologisches Leben.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: doch niemand hatte sie heilen können
  rationale: Die aktive deutsche Form gibt die im Griechischen ausgedrückte Unfähigkeit und die Angabe „von niemandem“ natürlich wieder. „Heilen“ bewahrt die übliche Bedeutung von θεραπεύω.
theological_decisions:
- issue: Bedeutungsumfang von θεραπευθῆναι
  choice: heilen
  alternative: kurieren
  rationale: „Heilen“ lässt sowohl medizinische Genesung als auch den im lukanischen Zusammenhang möglichen umfassenderen Heilungsaspekt offen, ohne die Ursache oder Art der Heilung näher zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Satzperiode wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. „Blutungen“ ist natürlich und wahrt die medizinische Unbestimmtheit des griechischen Ausdrucks.
