review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Dauer der Blutung, das Aufbrauchen ihrer Mittel bei Ärzten und die Unmöglichkeit, geheilt zu werden, grundsätzlich zutreffend wieder. Das adversative „doch“ ist jedoch stärker als das griechische καί; die aktive Umschreibung „niemand hatte sie heilen können“ ist möglich, aber die passive Form entspricht θεραπευθῆναι unmittelbarer.
  naturalness: „An Blutungen litt“ ist natürliches modernes Standarddeutsch. Eine einheitliche Satzverbindung mit „und konnte von niemandem geheilt werden“ ist flüssig und bewahrt den Erzählton, ohne einen nicht ausdrücklich markierten Gegensatz einzuführen.
  terminology: „Blutungen“, „Ärzte“ und „heilen“ sind angemessen. „Ihre gesamten Mittel zum Leben“ gibt βίος genauer wieder als „Lebensunterhalt“, das im heutigen Deutsch auch lediglich laufendes Einkommen bezeichnen kann.
  issues:
  - severity: medium
    issue: Die textkritische Anmerkung ist unpräzise und nicht an den tatsächlich umstrittenen Wortlaut gebunden.
    rationale: Die in eckigen Klammern stehende Wortgruppe im SBLGNT betrifft das Aufbrauchen des gesamten βίος bei Ärzten. Die Anmerkung sollte diesen Wortlaut ausdrücklich nennen und sagen, dass manche Handschriften ihn auslassen, statt unspezifisch auf weitere Unterschiede hinzuweisen.
  - severity: low
    issue: „doch“ verstärkt die Verbindung adversativ.
    rationale: Der griechische Text verbindet hier mit καί. Zwar ist ein Kontrast sachlich naheliegend, aber „und“ wahrt die Verknüpfung genauer.
  - severity: low
    issue: „Lebensunterhalt“ kann zu eng sein.
    rationale: βίος bezeichnet hier ihre gesamten Mittel bzw. ihren Besitz zum Leben; „gesamte Mittel zum Leben“ macht den Umfang klarer.
