revisions:
- from: Und da war eine Frau, die seit zwölf Jahren an Blutungen litt[a]. Sie hatte ihren ganzen Lebensunterhalt für Ärzte aufgebraucht[b], doch niemand hatte sie heilen können.[c]
  to: Und eine Frau litt seit zwölf Jahren an Blutungen[a]. Sie hatte ihre gesamten Mittel zum Leben bei Ärzten aufgebraucht[b][c] und konnte von niemandem geheilt werden.
  rationale: Die Revision vermeidet den über den griechischen Wortlaut hinausgehenden Gegensatz, bildet den passiven Infinitiv θεραπευθῆναι unmittelbarer ab und präzisiert die Bedeutung von βίος. Die textkritische Fußnote benennt nun eindeutig die im SBLGNT eingeklammerte, in manchen Handschriften fehlende Wortgruppe; ihr Anker steht bei dieser Wortgruppe.
