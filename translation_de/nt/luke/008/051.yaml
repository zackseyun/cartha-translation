id: LUK.8.51
reference: Luke 8:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: de
  text: Als er in das Haus kam, ließ er niemanden mit sich hineingehen außer Petrus, Johannes und Jakobus sowie dem Vater und der Mutter des Mädchens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Als er in das Haus kam
  rationale: Das temporale Partizip wird in natürlichem Deutsch als Nebensatz wiedergegeben. δέ führt die Erzählung weiter und muss hier nicht eigens mit „aber“ übersetzt werden.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ
  choice: ließ er niemanden mit sich hineingehen
  rationale: ἀφίημι bedeutet hier „zulassen/erlauben“; die Konstruktion mit „ließ … hineingehen“ ist knapp und idiomatisch. τινα erhält unter der Verneinung den Sinn „niemanden“.
- source_word: εἰ μὴ
  choice: außer
  rationale: Nach der Verneinung bezeichnet die Wendung die ausgenommene Personengruppe.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Petrus, Johannes und Jakobus
  rationale: Die herkömmlichen deutschen Namensformen sind klar und natürlich; die wiederholten καί werden gemäß deutscher Aufzählungssyntax wiedergegeben.
- source_word: καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα
  choice: sowie dem Vater und der Mutter des Mädchens
  rationale: παῖς kann allgemein „Kind“ bedeuten, doch Genus und unmittelbarer Kontext bezeichnen hier ein Mädchen. „sowie“ gliedert die Eltern verständlich von den drei Jüngern ab.
theological_decisions:
- issue: Spezifität von παῖς im Kontext
  choice: des Mädchens
  alternative: des Kindes
  rationale: Das feminine Genus der Form παιδός ist allein nicht eindeutig, weil das Substantiv κοινόμορφ sein kann, doch der unmittelbare Kontext identifiziert das Kind als Tochter. Die spezifische Wiedergabe löst keine theologische Spannung auf, sondern entspricht der Erzählreferenz.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die Formulierung bleibt nah an der griechischen Satzfolge, ohne im Deutschen steif zu wirken. Keine Fußnote ist nötig, da „Mädchen“ im unmittelbaren Kontext eindeutig ist.
