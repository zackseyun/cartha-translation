  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: de
  text: Niemand zündet eine Lampe an und bedeckt sie mit einem Gefäß oder stellt sie unter ein Bett. Vielmehr stellt er sie auf einen Lampenständer, damit die hereinkommen, das Licht sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: eine Lampe
  rationale: Bezeichnet hier eine kleine Öllampe; „Lampe“ ist im modernen Deutsch natürlich und sachlich zutreffend.
- source_word: σκεύει
  choice: mit einem Gefäß
  rationale: Das allgemein gehaltene Wort bezeichnet einen Gegenstand bzw. Behälter. „Gefäß“ bewahrt diese Offenheit besser als eine Festlegung auf „Topf“ oder „Schüssel“.
- source_word: κλίνης
  choice: ein Bett
  rationale: „Bett“ ist die natürliche deutsche Entsprechung im häuslichen Bild; eine engere Festlegung auf eine Liege ist nicht erforderlich.
- source_word: λυχνίας
  choice: einen Leuchter
  rationale: Gemeint ist die Vorrichtung, auf die eine Lampe gestellt wird. „Leuchter“ ist knapp und im biblischen Kontext verständlich, ohne einen Kerzenleuchter ausdrücklich vorauszusetzen.
- source_word: οἱ εἰσπορευόμενοι
  choice: alle, die hereinkommen
  rationale: Die substantivierte Partizipialform bezeichnet die Hereinkommenden. „Alle“ ist im Deutschen eine natürliche Wiedergabe der generischen Mehrzahl, ohne den Aussageumfang sachlich einzuschränken.
theological_decisions:
- issue: Zweckangabe ἵνα mit Konjunktiv
  choice: damit ... das Licht sehen
  alternative: sodass ... das Licht sehen können
  rationale: „Damit“ gibt den Zweck der erhöhten Platzierung unmittelbar wieder. Ein zusätzliches „können“ steht nicht ausdrücklich im Ausgangstext und ist für verständliches Deutsch nicht nötig.
- issue: Bildsprache ohne explizite Auslegung
  choice: Das konkrete Bild von Lampe, Gefäß, Bett und Leuchter bleibt unkommentiert.
  alternative: Die Lampe oder das Licht ausdrücklich mit Verkündigung bzw. Offenbarung identifizieren.
  rationale: Der Vers selbst deutet die Bildelemente nicht ausdrücklich. Die Übersetzung soll die im Kontext zu erschließende theologische Bedeutung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Satzstruktur wurde für natürliches Deutsch in zwei Sätze gegliedert. Das einleitende δέ wird nicht eigens wiedergegeben, da es hier vor allem den Fortgang der Rede markiert; ein künstliches „Nun“ oder „Aber“ wäre missverständlich. „Vielmehr“ bildet den Gegensatz von ἀλλά klar ab.
