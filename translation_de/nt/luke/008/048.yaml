source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: de
  text: 'Doch er sagte zu ihr: „Tochter, dein Glaube hat dich gerettet.[a] Geh in Frieden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat dich gesund gemacht“ oder „hat dich geheilt“. Das griechische Verb kann sowohl Heilung als auch Rettung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Tochter
  rationale: Die wörtliche Anrede bewahrt den warmen, persönlichen und würdevollen Ton des griechischen Vokativs.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ gibt den im Kontext gemeinten vertrauenden Glauben an Jesus wieder und wahrt zugleich die theologische Tragweite des Begriffs.
- source_word: σέσωκέν
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω bezeichnet hier sicher die erfahrene Heilung, kann aber zugleich weiter gefasste Rettung ausdrücken. „Gerettet“ bewahrt diese Bedeutungsweite; die körperliche Bedeutung wird in der Fußnote erläutert.
- source_word: πορεύου
  choice: Geh
  rationale: Eine knappe und natürliche Wiedergabe des Imperativs im modernen Standarddeutsch.
- source_word: εἰς εἰρήνην
  choice: in Frieden
  rationale: Die übliche deutsche Wendung gibt das Fortgehen unter dem Zuspruch des Friedens natürlich und treffend wieder.
- source_word: δὲ
  choice: Doch
  rationale: „Doch“ markiert den milden Kontrast zwischen der vorherigen Furcht der Frau und Jesu beruhigender Antwort, ohne ihn zu überzeichnen.
theological_decisions:
- issue: Bedeutungsumfang von σῴζω im Heilungskontext
  choice: Im Haupttext mit „hat dich gerettet“ wiedergegeben
  alternative: „hat dich gesund gemacht“ oder „hat dich geheilt“
  rationale: Die Erzählung handelt unmittelbar von körperlicher Heilung, doch σῴζω kann sowohl Heilung als auch umfassendere Rettung bezeichnen. Der Haupttext wahrt diese theologische Spannung; die Fußnote nennt die engeren, im Kontext naheliegenden Bedeutungen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Anrede „Tochter“ und die feste Wendung „Geh in Frieden“ wurden wegen ihrer Natürlichkeit und Nähe zum griechischen Text beibehalten.
