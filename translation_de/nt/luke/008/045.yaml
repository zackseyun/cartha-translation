source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: de
  text: 'Da sagte Jesus: „Wer ist es, der mich berührt hat?“ Während aber alle es abstritten, sagte Petrus: „Meister, die Menschenmengen umringen dich und drängen sich an dich[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bedrängen dich von allen Seiten und drücken sich an dich.“'
    reason: Lexikalische Alternative für συνέχουσίν und ἀποθλίβουσιν; beide Verben schildern das dichte Gedränge, wobei das erste das Einschließen und das zweite den körperlichen Druck hervorhebt.
lexical_decisions:
- source_word: ἁψάμενός
  choice: berührt hat
  rationale: Das Verb bezeichnet hier den körperlichen Kontakt mit Jesus. „Berührt hat“ ist im Deutschen natürlich und gibt das Partizip im Zusammenhang der Frage treffend wieder.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Während es aber alle abstritten
  rationale: „Während“ bewahrt den durativen Charakter des Präsenspartizips; „es“ nimmt sinngemäß die in Jesu Frage vorausgesetzte Berührung auf.
- source_word: Ἐπιστάτα
  choice: Meister
  rationale: Die für Lukas charakteristische Anrede bezeichnet anerkannte Autorität. „Meister“ ist eine respektvolle, idiomatische Wiedergabe, ohne den stärkeren Titel „Herr“ einzutragen.
- source_word: ὄχλοι
  choice: die Menschenmengen
  rationale: Die Wiedergabe bewahrt den Plural und macht deutlich, dass zahlreiche Menschen Jesus umgeben.
- source_word: συνέχουσίν
  choice: umringen dich
  rationale: Das Verb beschreibt hier, dass Jesus von den Menschenmengen ringsum eingeschlossen und räumlich bedrängt wird.
- source_word: ἀποθλίβουσιν
  choice: drängen sich an dich
  rationale: Die Form bezeichnet verstärkten körperlichen Druck. Die Wendung ist natürliches Deutsch und unterscheidet diesen unmittelbaren Kontakt vom vorausgehenden Umringen.
theological_decisions:
- issue: Wiedergabe der Anrede Ἐπιστάτα
  choice: Meister
  alternative: Lehrer; Herr
  rationale: Im griechischen Text steht Ἐπιστάτα und nicht κύριε. „Meister“ bringt die respektvolle Anerkennung von Jesu Autorität zum Ausdruck, ohne einen im Wortlaut nicht ausdrücklich verwendeten stärkeren christologischen Titel einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ausführlichere Frage „Wer ist es, der …?“ bildet die griechische Konstruktion τίς ὁ ἁψάμενός μου ab, ohne unnatürlich zu wirken. Die beiden Verben des Gedränges bleiben in ihrer Bildlichkeit voneinander unterschieden.
