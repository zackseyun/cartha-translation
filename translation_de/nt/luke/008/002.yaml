  verdict: approve
  source_fidelity: Die Übersetzung gibt den periphrastischen Plusquamperfekt-Sinn von ἦσαν τεθεραπευμέναι und ἐξεληλύθει angemessen wieder. Sie bewahrt die im griechischen Text vorhandene Unterscheidung zwischen „bösen Geistern“ (πνεύματα πονηρά), Krankheiten (ἀσθένειαι) und Dämonen (δαιμόνια). „Aus der ... ausgefahren waren“ ist im deutschen biblischen Kontext eine treffende, verständliche Wiedergabe von ἀφ’ ἧς ... ἐξεληλύθει.
  naturalness: Der Satz ist als Fortsetzung des vorhergehenden Verses idiomatisch und in würdigem, modern verständlichem Standarddeutsch formuliert. Die Formulierung „genannt Magdalena“ und das abschließende Komma passen zur syntaktischen Fortsetzung.
  terminology: „Böse Geister“, „Krankheiten“ und „Dämonen“ sind terminologisch konsequent und quellennah. Der Eigenname „Maria ... Magdalena“ ist im Deutschen etabliert. Es wird keine theologische Deutung über den Wortlaut hinaus eingeführt.
