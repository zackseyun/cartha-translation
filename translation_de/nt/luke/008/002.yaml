id: LUK.8.2
reference: Luke 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: de
  text: 'und einige Frauen, die von bösen Geistern und Krankheiten geheilt worden waren: Maria, genannt Magdalena, aus der sieben Dämonen ausgefahren waren,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: einige Frauen
  rationale: τινες bezeichnet mit dem Plural eine unbestimmte Teilmenge; „einige Frauen“ ist im modernen Deutsch natürlich und präzise.
- source_word: ἦσαν τεθεραπευμέναι
  choice: geheilt worden waren
  rationale: Die Verbindung aus ἦσαν und dem Perfektpartizip Passiv bezeichnet eine vorausgegangene Heilung mit fortbestehendem Ergebnis und wird passend als Plusquamperfekt wiedergegeben.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: von bösen Geistern
  rationale: πονηρός bedeutet hier „böse“; der Text verwendet nicht ἀκάθαρτος („unrein“). „Von“ gibt ἀπό idiomatisch als Befreiung von einer Ursache oder Macht wieder.
- source_word: καὶ ἀσθενειῶν
  choice: und Krankheiten
  rationale: ἀσθένεια bezeichnet hier körperliche Krankheit oder Schwäche. „Krankheiten“ ist verständlich und wahrt die Unterscheidung von den bösen Geistern.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: genannt Magdalena
  rationale: Das Partizip καλουμένη führt die Bezeichnung ein, unter der Maria bekannt war; die knappe deutsche Form entspricht der griechischen Konstruktion.
- source_word: ἀφ’ ἧς
  choice: aus der
  rationale: Bei ausfahrenden Dämonen gibt „aus der“ die räumlich-separative Aussage von ἀπό im Deutschen natürlicher und anschaulicher wieder als „von der“.
- source_word: δαιμόνια ἑπτὰ
  choice: sieben Dämonen
  rationale: δαιμόνια bezeichnet ausdrücklich Dämonen und bleibt damit von dem allgemeineren πνεύματα im ersten Satzteil unterschieden.
- source_word: ἐξεληλύθει
  choice: ausgefahren waren
  rationale: Der Plusquamperfekt-Sinn bezeichnet ein bereits abgeschlossenes Verlassen. „Ausfahren“ ist im biblischen Zusammenhang idiomatisch und bewahrt den Bezug auf das Herausgehen aus einer Person.
theological_decisions:
- issue: Wiedergabe dämonischer Bedrängnis
  choice: Die personalen Begriffe „böse Geister“ und „Dämonen“ werden beibehalten.
  alternative: Die Wendungen metaphorisch als psychische oder körperliche Erkrankungen wiederzugeben.
  rationale: Der griechische Text unterscheidet πνεύματα πονηρά und δαιμόνια von ἀσθένειαι. Die Übersetzung wahrt diese Kategorien, ohne ihre Beziehung näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung des vorhergehenden Verses mit „und“ eröffnet und endet wegen des anschließenden Verskontexts mit Komma. Keine Fußnoten sind nötig, da die möglichen Alternativen keine für Sinn oder Auslegung wesentliche Ambiguität markieren.
