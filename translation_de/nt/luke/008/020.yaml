  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: de
  text: 'Da wurde ihm gemeldet: »Deine Mutter und deine Brüder[a] stehen draußen und wollen dich sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verwandte«, falls »Brüder« hier in einem weiteren verwandtschaftlichen Sinn gebraucht ist; das griechische Wort bedeutet gewöhnlich »Brüder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: wurde ihm gemeldet
  rationale: Der Aorist Passiv von ἀπαγγέλλω bezeichnet hier, dass Jesus eine Nachricht überbracht wurde. Die deutsche Formulierung bewahrt das Passiv und klingt natürlich.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit einem milden Anschluss weiter. »Da« gibt den narrativen Fortgang im Deutschen unaufdringlich wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ wird als indirektes Objekt ausdrücklich wiedergegeben.
- source_word: μήτηρ
  choice: Mutter
  rationale: »Mutter« ist die gewöhnliche und dem Erzählstil angemessene Wiedergabe.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Das maskuline Pluralwort bedeutet gewöhnlich »Brüder«. Die Übersetzung vermeidet eine interpretierende Ausweitung auf »Verwandte« oder »Geschwister«.
- source_word: ἑστήκασιν
  choice: stehen
  rationale: Das Perfekt von ἵστημι hat hier präsentische Zustandsbedeutung; »stehen« gibt den bestehenden Zustand idiomatisch wieder.
- source_word: ἔξω
  choice: draußen
  rationale: Das räumliche Adverb wird direkt wiedergegeben, ohne einen im Vers nicht ausdrücklich genannten Ort wie ein Haus hinzuzufügen.
- source_word: ἰδεῖν
  choice: sehen
  rationale: Der Infinitiv von ὁράω bedeutet zunächst »sehen«. Deutendere Formulierungen wie »sprechen« oder »treffen« gingen über den Wortlaut hinaus.
- source_word: θέλοντες
  choice: wollen
  rationale: Das präsentische Partizip beschreibt den gleichzeitig bestehenden Wunsch von Mutter und Brüdern. Ein koordinierter deutscher Satz mit »wollen« ist natürlich und inhaltlich genau.
theological_decisions:
- issue: Bezeichnung der Brüder Jesu
  choice: ἀδελφοί wird im Haupttext mit »Brüder« wiedergegeben.
  alternative: »Verwandte« oder »Geschwister«
  rationale: Der griechische Ausdruck bedeutet gewöhnlich »Brüder«. Da der Vers selbst die genaue verwandtschaftliche Einordnung nicht weiter erklärt, löst die Übersetzung die damit verbundenen theologischen Fragen nicht durch eine interpretierende Umschreibung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die direkte Rede ist knapp und natürlich; genuine lexikalische und theologische Offenheit wird in der Fußnote bewahrt.
