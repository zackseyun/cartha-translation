id: LUK.8.8
reference: Luke 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: de
  text: 'Und ein anderes Samenkorn fiel auf den guten Boden[a], wuchs heran und brachte hundertfach Frucht.[b] Während er das sagte, rief er laut: »Wer Ohren hat zu hören, der höre!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf die gute Erde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: brachte hundertfachen Ertrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: ein anderes Samenkorn
  rationale: Das substantivisch gebrauchte Neutrum bezeichnet im Zusammenhang ein weiteres Samenkorn. Das ergänzte »Samenkorn« macht den Bezug im modernen Deutschen unmittelbar verständlich.
- source_word: γῆν τὴν ἀγαθήν
  choice: auf den guten Boden
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet γῆ den für das Wachstum geeigneten Erdboden. »Boden« ist hier natürlicher und genauer als das allgemeinere »Land«.
- source_word: φυὲν
  choice: wuchs heran
  rationale: Das Aoristpartizip von φύω beschreibt das Wachstum, das dem Fruchtbringen vorausgeht. Die deutsche Reihung gibt diesen Ablauf knapp und natürlich wieder.
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: brachte hundertfach Frucht
  rationale: Die Wendung gibt das Hervorbringen eines außerordentlich hohen Ertrags idiomatisch wieder und bewahrt die bildhafte Rede von der Frucht.
- source_word: ταῦτα λέγων
  choice: Während er das sagte
  rationale: Das Präsenspartizip bezeichnet eine zur Haupthandlung gleichzeitige Handlung.
- source_word: ἐφώνει
  choice: rief er laut
  rationale: φωνέω bezeichnet hier ein vernehmliches, nachdrückliches Ausrufen; »laut« macht diese Stärke deutlich, ohne sie zu einem Schrei zu steigern.
- source_word: Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Wer Ohren hat zu hören, der höre!
  rationale: Die deutsche Wer-der-Konstruktion gibt den allgemein geltenden substantivischen Ausdruck und den Imperativ der dritten Person natürlich, feierlich und ohne unnötige männliche Festlegung wieder.
theological_decisions:
- issue: Allgemeingültige Personenbezeichnung in Jesu Aufforderung
  choice: Wer Ohren hat zu hören, der höre!
  alternative: Wer Ohren hat zu hören, soll hören!
  rationale: Der griechische Singular ist repräsentativ und nicht auf Männer beschränkt. Der deutsche Jussiv »der höre« bewahrt zugleich die feierliche Aufforderung und ihre grammatische Singularform.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht feierlichem Ton in der abschließenden Aufforderung. Die Satzfolge bleibt nah am griechischen Ablauf, ohne unnatürliche Partizipialkonstruktionen zu übernehmen.
