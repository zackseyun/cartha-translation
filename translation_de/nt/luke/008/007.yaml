  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: de
  text: Anderes fiel mitten unter die Dornen, und die Dornen wuchsen mit ihm auf und erstickten es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: Anderes
  rationale: Das substantivierte Neutrum wird im Deutschen natürlich mit „Anderes“ wiedergegeben; aus dem Zusammenhang ist weiterhin das Saatkorn beziehungsweise Saatgut gemeint, ohne dass der griechische Text das Substantiv ausdrücklich wiederholt.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Die einfache Erzählhandlung des Aorists wird direkt und idiomatisch wiedergegeben.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: mitten unter die Dornen
  rationale: „Mitten unter“ bildet ἐν μέσῳ genauer ab als bloßes „unter“ und passt trotz des griechischen ἐν idiomatisch zum deutschen Bewegungsverb „fiel“.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: die Dornen
  rationale: „Dornen“ bewahrt das traditionelle landwirtschaftliche Bild und kann wie im Griechischen die dornigen Pflanzen bezeichnen.
- source_word: συμφυεῖσαι
  choice: wuchsen mit ihm auf
  rationale: Die Form bezeichnet ein gemeinsames beziehungsweise gleichzeitiges Aufwachsen. „Mit ihm“ bezieht sich grammatisch auf das substantivierte neutrale „Anderes“.
- source_word: ἀπέπνιξαν
  choice: erstickten
  rationale: „Ersticken“ gibt die Wirkung des Verbs prägnant wieder und bewahrt die bildhafte Ausdrucksweise.
- source_word: αὐτό
  choice: es
  rationale: Das neutrale Pronomen entspricht dem substantivierten „Anderes“ und verweist im Kontext auf das Gefallene, also das Saatgut.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe parataktische Struktur des griechischen Verses bleibt erhalten. „Anderes“ vermeidet eine stärkere Explizierung durch „anderes Saatgut“, während der unmittelbare Gleichniskontext den Bezug verständlich macht.
