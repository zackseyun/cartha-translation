  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: de
  text: 'Das ist das Gleichnis: Der Same ist das Wort Gottes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist die Bedeutung des Gleichnisses.“ Im Griechischen steht wörtlicher: „Das ist das Gleichnis.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ist
  rationale: Die Kopula leitet unmittelbar die Deutung Jesu ein. „Ist“ bewahrt die Form des griechischen Textes; „bedeutet“ wäre stärker auslegend.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Übergang von der Erzählung zur Deutung. „Aber“ bildet diesen Anschluss knapp ab, ohne eine zeitliche Abfolge auszudrücken.
- source_word: αὕτη ἡ παραβολή
  choice: das ist das Gleichnis
  rationale: Die Wiedergabe bleibt nahe am griechischen Wortlaut. Im Zusammenhang ist die Deutung des Gleichnisses gemeint, doch ein entsprechendes Substantiv steht nicht ausdrücklich im Ausgangstext.
- source_word: σπόρος
  choice: Same
  rationale: Der Singular bezeichnet den Samen als Bildgröße des Gleichnisses. „Same“ ist in diesem Zusammenhang natürlich und bewahrt die singularische Form.
- source_word: λόγος
  choice: Wort
  rationale: λόγος bezeichnet hier Gottes mitgeteiltes Wort beziehungsweise seine Botschaft. „Wort“ bewahrt die biblische Ausdrucksweise und mögliche intertextuelle Bezüge.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der deutsche Genitiv gibt den griechischen Genitiv direkt und idiomatisch wieder, ohne ihn deutend als „von Gott“ aufzulösen.
theological_decisions:
- issue: Ob παραβολή kontextuell als „Gleichnis“ oder erweitert als „Bedeutung/Deutung des Gleichnisses“ wiederzugeben ist
  choice: Gleichnis
  alternative: Bedeutung des Gleichnisses; Deutung des Gleichnisses
  rationale: Obwohl Jesus nun das Gleichnis auslegt, lautet der griechische Text wörtlich „dies ist das Gleichnis“. Die Übersetzung bewahrt diese Formulierung und weist die kontextuelle Alternative in einer Fußnote aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die leicht ungewohnte Wendung „Das aber ist das Gleichnis“ bewahrt bewusst die Spannung des griechischen Wortlauts; die idiomatischere kontextuelle Deutung steht in der Fußnote.
