  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: de
  text: 'Er sagte: „Euch ist es gegeben, die Geheimnisse[a] des Reiches Gottes zu erkennen; den anderen aber rede ich in Gleichnissen, damit sie sehend nicht sehen und hörend nicht verstehen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mysterien“. Gemeint sind Wahrheiten über Gottes Reich, die verborgen sind und die Gott erschließt.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte klingen an Jesaja 6,9–10 an. „Damit“ kann hier göttliche Absicht, eine gerichtliche Folge oder beides ausdrücken.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: ist es gegeben
  rationale: Das Perfekt Passiv bezeichnet eine gewährte, fortbestehende Gegebenheit; der Geber bleibt wie im Griechischen unausgesprochen.
- source_word: γνῶναι
  choice: zu erkennen
  rationale: „Erkennen“ gibt γινώσκω unmittelbar wieder und hält den Ausdruck von συνίημι („verstehen“) am Versende auseinander.
- source_word: τὰ μυστήρια
  choice: die Geheimnisse
  rationale: Im heutigen Deutsch bezeichnet „Geheimnisse“ verborgene und von Gott erschlossene Wahrheiten natürlicher als „Mysterien“, ohne den Offenbarungscharakter aufzugeben.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: des Reiches Gottes
  rationale: Die vertraute Formulierung wahrt die mögliche Bedeutung sowohl von Gottes Herrschaft als auch von seinem Herrschaftsbereich.
- source_word: τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  choice: zu den Übrigen aber wird in Gleichnissen gesprochen
  rationale: Die griechische Wendung ist elliptisch. Das ergänzte „wird gesprochen“ ergibt einen natürlichen deutschen Satz, ohne „den Übrigen“ mit dem markinischen Ausdruck „denen draußen“ gleichzusetzen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ bewahrt die im Griechischen vorhandene Zweck-/Folgespannung und schwächt die an Jesaja anklingende Aussage nicht ab.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: sehend nicht sehen
  rationale: Die partizipiale Form und die auffällige Wiederholung von „sehen“ bleiben erhalten.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: hörend nicht verstehen
  rationale: Die parallele Struktur wird bewahrt; „verstehen“ gibt συνίημι im Unterschied zum bloßen Hören klar wieder.
theological_decisions:
- issue: Sinn von ἵνα im Anklang an Jesaja 6,9–10
  choice: damit
  alternative: sodass / mit dem Ergebnis, dass
  rationale: Die Übersetzung lässt offen, ob vor allem göttliche Absicht, gerichtliche Folge oder beides ausgedrückt wird, und bewahrt so die theologische Spannung des Ausgangstextes.
- issue: Bedeutung von μυστήρια
  choice: Geheimnisse
  alternative: Mysterien
  rationale: Gemeint sind zuvor verborgene, nun gewährte Erkenntnisse über Gottes Reich, nicht esoterische Rätsel oder eine konfessionell bestimmte Geheimlehre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse in τοῖς δὲ λοιποῖς ἐν παραβολαῖς wird für verständliches Deutsch behutsam ergänzt; die semitisch geprägten Parallelformen „sehend nicht sehen“ und „hörend nicht verstehen“ bleiben wegen ihres Schriftanklangs bewusst erhalten.
