  source_fidelity: 'Die zentralen Begriffe und die Spannung von ἵνα sind zutreffend wiedergegeben. „Zu den Übrigen aber wird in Gleichnissen gesprochen“ ist jedoch eine stärker umgestaltende Ergänzung der griechischen Ellipse: Sie macht aus der Gegenüberstellung ausdrücklich ein unpersönliches Sprechen. „Den anderen aber rede ich in Gleichnissen“ ergänzt zwar ebenfalls, bewahrt aber den im Kontext sprechenden Jesus und die Empfängergruppe unmittelbarer.'
  naturalness: Der Vers ist insgesamt würdiges modernes Standarddeutsch. „Den anderen“ ist im fortlaufenden Satz idiomatischer als das substantivierte „den Übrigen“, und die explizite Ergänzung „rede ich“ löst die Ellipse klar und flüssig.
  terminology: „Geheimnisse“, „Reich Gottes“, „Gleichnisse“, „erkennen“ und „verstehen“ sind angemessen. Die Fußnote zu „Geheimnisse“ sollte die Erklärung etwas knapper und unmittelbarer formulieren; „Mysterien“ bleibt als sinnvolle lexikalische Alternative bestehen.
