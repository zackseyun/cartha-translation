  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: de
  text: Als die Frau aber merkte, dass sie nicht unbemerkt geblieben war[a], kam sie zitternd herbei, fiel vor ihm nieder[b] und berichtete vor dem ganzen Volk, weshalb sie ihn berührt hatte und wie sie sofort geheilt worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „dass sie nicht verborgen geblieben war“; sinngemäß: „dass es nicht unbemerkt geblieben war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „warf sich vor ihm nieder“. Im Griechischen werden seine Füße nicht ausdrücklich erwähnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: als ... merkte
  rationale: Das aoristische Partizip führt den Umstand der folgenden Handlung ein. Im Kontext geht es nicht bloß um visuelles Sehen, sondern um ihre Erkenntnis, dass ihr Handeln entdeckt worden war.
- source_word: οὐκ ἔλαθεν
  choice: nicht unbemerkt geblieben war
  rationale: λανθάνω bezeichnet hier das Entgehen der Wahrnehmung beziehungsweise das Verborgenbleiben. Die Formulierung gibt das griechische Idiom natürlich wieder, ohne ausdrücklich eine bestimmte Person als Wahrnehmenden einzusetzen.
- source_word: τρέμουσα
  choice: zitternd
  rationale: Das präsentische Partizip beschreibt anschaulich ihren körperlichen und emotionalen Zustand, ohne ihn ausschließlich als Angst zu deuten.
- source_word: προσπεσοῦσα αὐτῷ
  choice: fiel vor ihm nieder
  rationale: προσπίπτω mit Dativ bezeichnet das Niederfallen vor jemandem, häufig in Bitte oder Ehrfurcht. Die Wiedergabe ergänzt nicht die im Griechischen unausgesprochenen Füße.
- source_word: δι’ ἣν αἰτίαν
  choice: weshalb
  rationale: Die Wendung bedeutet „aus welchem Grund“. „Weshalb“ ist knapp, gegenwärtig und dem berichtenden Ton angemessen.
- source_word: ἥψατο αὐτοῦ
  choice: sie ihn berührt hatte
  rationale: ἅπτομαι mit Genitiv bedeutet hier „berühren“. Das Plusquamperfekt verdeutlicht im Deutschen die zeitliche Vorordnung gegenüber ihrem Bericht.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet das Mitteilen oder Berichten. „Berichtete“ passt zum öffentlichen Erzählen, ohne den Ton unnötig zu feierlich zu machen.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: vor dem ganzen Volk
  rationale: Die Formulierung bleibt eng bei ἐνώπιον und παντὸς τοῦ λαοῦ. „Volk“ bewahrt die lexikalische Unterscheidung gegenüber einer bloßen „Menschenmenge“.
- source_word: ὡς ἰάθη
  choice: wie sie ... geheilt worden war
  rationale: ὡς führt den Inhalt beziehungsweise die Art und Weise ihrer Heilung ein. Die Passivform bewahrt die offene Urheberschaft des griechischen Passivs.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Das Adverb bezeichnet eine unverzügliche Wirkung. „Sofort“ ist im modernen Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung des Niederfallens und des öffentlichen Berichts
  choice: Die Handlung wird beschreibend als Niederfallen und Berichten wiedergegeben.
  alternative: Die Frau betete ihn an oder legte ausdrücklich ein Schuldbekenntnis ab.
  rationale: Der griechische Text kann Ehrfurcht oder flehentliche Unterwerfung nahelegen, nennt jedoch weder ausdrücklich Anbetung noch Buße. Diese mögliche Bedeutung wird daher nicht dogmatisch festgelegt.
- issue: Urheber der Heilung
  choice: „geheilt worden war“ bewahrt das Passiv ohne ausdrückliche Nennung des Handelnden.
  alternative: „wie Jesus sie geheilt hatte“
  rationale: Das griechische ἰάθη ist passiv und nennt an dieser Stelle den Urheber nicht ausdrücklich; die Übersetzung soll ihn nicht ergänzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge folgt dem griechischen Ablauf, während Partizipien idiomatisch in finite deutsche Formen überführt werden. Beide Fußnotenmarker erscheinen unmittelbar an den betreffenden Wendungen.
