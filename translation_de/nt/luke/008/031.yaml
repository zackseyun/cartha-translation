id: LUK.8.31
reference: Luke 8:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: de
  text: Und sie flehten ihn immer wieder an, ihnen nicht zu befehlen, in den Abgrund[a] zu gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tiefe“. Das griechische Wort kann eine große Tiefe bezeichnen; hier bezieht es sich wahrscheinlich auf den Abgrund als Ort der Verwahrung böser Geister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: flehten … immer wieder an
  rationale: Das Imperfekt bezeichnet ein anhaltendes oder wiederholtes dringliches Bitten. Die Formulierung gibt sowohl die Eindringlichkeit als auch den Verlauf der Handlung natürlich wieder.
- source_word: ἐπιτάξῃ
  choice: befehlen
  rationale: Das Verb bezeichnet eine autoritative Anweisung und bewahrt hier Jesu Vollmacht gegenüber den Dämonen.
- source_word: ἄβυσσον
  choice: Abgrund
  rationale: Ἄβυσσος bezeichnet eine unergründliche Tiefe und hat hier im Zusammenhang mit Dämonen offenbar eine übernatürliche Bedeutung. „Abgrund“ ist direkt und lässt die genaue Beschaffenheit des Ortes offen.
- source_word: ἀπελθεῖν
  choice: zu gehen
  rationale: Der Infinitiv der Bewegung wird im Deutschen zusammen mit der Zielangabe „in den Abgrund“ schlicht und idiomatisch als „zu gehen“ wiedergegeben.
- source_word: ἵνα μὴ
  choice: nicht zu
  rationale: Nach dem Verb des Bittens bezeichnet ἵνα mit dem Konjunktiv den Inhalt der Bitte. Die deutsche Infinitivkonstruktion ist natürlich und sachlich genau.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet diejenigen, denen der Befehl erteilt würde. „Ihnen … zu befehlen“ bildet diese Beziehung im Deutschen ausdrücklich ab.
theological_decisions:
- issue: Bedeutung von ἄβυσσος im Zusammenhang mit Dämonen
  choice: „Abgrund“ als übernatürlicher Ort, den die Dämonen fürchten
  alternative: „Tiefe“ in einem allgemeineren räumlichen Sinn
  rationale: Der unmittelbare Zusammenhang legt einen Ort der Verwahrung oder des Gerichts für böse Geister nahe. Die Übersetzung „Abgrund“ bewahrt diese kosmisch-geistliche Dimension, ohne den Begriff genauer festzulegen, als Lukas es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Flehten … immer wieder an“ macht den imperfektiven Aspekt verständlich, ohne altertümlich zu wirken; „Abgrund“ wahrt die theologische und räumliche Offenheit des griechischen Begriffs.
