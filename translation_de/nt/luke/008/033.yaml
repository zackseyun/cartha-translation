  rationale: Die Revision verstärkt „Abhang“ behutsam zu „Steilhang“, ordnet die Fußnote dem griechischen Geländeausdruck korrekt zu und ersetzt die irreführende, verbbezogene Fußnotenalternative. Die wiederholte Verbform verdeutlicht die aufeinanderfolgenden Bewegungen der Dämonen im natürlichen Deutschen.
