  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: de
  text: Da fuhren die Dämonen aus dem Mann aus und fuhren in die Schweine hinein. Die Herde stürmte den Steilhang[a] hinunter in den See und ertrank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abgrund“ oder „Klippe“; das griechische Wort bezeichnet einen steilen Abfall.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου
  choice: Da fuhren die Dämonen aus dem Mann aus
  rationale: Der vorangestellte Aoristpartizip bezeichnet die dem Hauptverb vorausgehende Handlung. Die finite Wiedergabe mit „Da“ bildet die Abfolge im natürlichen Deutschen ab; „ausfahren“ ist in diesem Zusammenhang idiomatisch und bewahrt die Vorstellung des Herausgehens.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: und in die Schweine hinein
  rationale: Das gemeinsame Verb „fuhren“ wird im Deutschen elliptisch weitergeführt. „In … hinein“ gibt die gerichtete Bewegung deutlich und natürlich wieder.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: Die Herde stürmte
  rationale: ὁρμάω bezeichnet eine plötzliche, heftige Bewegung. „Stürmte“ vermittelt deren Kraft und Schnelligkeit, ohne eine Absicht der Tiere zu behaupten.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: den Abhang hinunter
  rationale: Die Wendung bezeichnet eine Abwärtsbewegung an einem steilen Geländeabschnitt. „Abhang“ vermeidet die stärkere, nicht zwingend erforderliche Vorstellung einer senkrechten Klippe.
- source_word: εἰς τὴν λίμνην
  choice: in den See
  rationale: λίμνη bedeutet hier „See“; damit bleibt Lukas’ Wortwahl gegenüber θάλασσα erhalten.
- source_word: ἀπεπνίγη
  choice: ertrank
  rationale: Der Aorist Passiv von ἀποπνίγω bezeichnet im Wasserkontext das Ertrinken. Das deutsche intransitive „ertrank“ ist idiomatisch und entspricht dem Resultat, ohne einen äußeren Täter anzudeuten.
theological_decisions:
- issue: Bezeichnung der bösen Geistwesen
  choice: Dämonen
  alternative: unreine Geister
  rationale: Der griechische Text hat ausdrücklich δαιμόνια. „Dämonen“ bewahrt diese lexikalische Unterscheidung und ersetzt den Ausdruck nicht durch eine verwandte Bezeichnung.
- issue: Topografische Stärke von κρημνός
  choice: Abhang
  alternative: Klippe oder Steilhang
  rationale: κρημνός bezeichnet einen steilen Abfall, legt aber nicht eindeutig eine senkrechte Felsklippe fest. Die Übersetzung bewahrt diese Offenheit; die Fußnote nennt die stärkere mögliche Wiedergabe.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung verhindert eine schwerfällige Partizipialkonstruktion. „Ausfahren“ ist im Kontext geistlicher Mächte weiterhin allgemein verständlich; „Schweine“, „Herde“, „See“ und „ertrank“ sind natürliche Gegenwartswörter.
