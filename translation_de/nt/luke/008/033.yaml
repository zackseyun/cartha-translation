review_pass:
  verdict: revise
  source_fidelity: Die Abfolge der Handlungen, δαιμόνια als „Dämonen“, λίμνη als „See“ und das Ertrinken der Herde sind zutreffend wiedergegeben. κρημνός bezeichnet jedoch einen steilen Abfall; „Abhang“ allein ist etwas zu schwach. Die Fußnote darf zudem nicht den Bewegungsverb-Sinn „stürzte“ als bloße Alternative zu κρημνός ausgeben.
  naturalness: Der Entwurf ist überwiegend idiomatisches modernes Standarddeutsch. Die elliptische Verbindung „fuhren ... aus und in ... hinein“ ist verständlich, aber die Wiederholung von „fuhren“ macht die zwei entgegengesetzten Bewegungen klarer und flüssiger.
  terminology: „Dämonen“ gibt δαιμόνια präzise wieder. „Steilhang“ wahrt die topografische Stärke von κρημνός, ohne eine senkrechte Klippe zwingend zu behaupten.
  issues:
  - severity: medium
    issue: Die Wiedergabe „den Abhang hinunter“ schwächt κρημνός unnötig ab.
    rationale: Der griechische Begriff bezeichnet einen steilen Abfall bzw. Steilhang. „Steilhang“ ist im Deutschen natürlich und genauer, ohne die umstritten stärkere Vorstellung einer senkrechten Klippe festzulegen.
  - severity: medium
    issue: Die Fußnote bietet „stürzte den Steilhang hinunter“ als Alternative zu einem topografischen Ausdruck und steht beim falschen Satzteil.
    rationale: „Stürzte“ betrifft die Wiedergabe von ὥρμησεν, nicht von κρημνός. Die Anmerkung soll an „Steilhang“ stehen und eine tatsächliche lexikalische Alternative zum Geländeausdruck nennen.
  revised_text: Da fuhren die Dämonen aus dem Mann aus und fuhren in die Schweine hinein. Die Herde stürmte den Steilhang[a] hinunter in den See und ertrank.
