  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: de
  text: Der Sämann ging hinaus, um seinen Samen zu säen. Während er säte, fiel ein Teil neben den Weg; er wurde zertreten, und die Vögel des Himmels fraßen ihn auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: ging hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier schlicht das Hinausgehen; „ging hinaus“ ist natürliches modernes Deutsch.
- source_word: ὁ σπείρων
  choice: der Sämann
  rationale: Das substantivierte Partizip bezeichnet den Säenden; „der Sämann“ ist im Deutschen idiomatisch und für das Gleichnis passend.
- source_word: τοῦ σπεῖραι
  choice: um … zu säen
  rationale: Der Genitiv des substantivierten Infinitivs nach einem Bewegungsverb drückt den Zweck aus.
- source_word: τὸν σπόρον αὐτοῦ
  choice: seinen Samen
  rationale: σπόρος meint Saat bzw. Samen. „Seinen Samen“ gibt den Ausdruck knapp und ohne unnötige Präzisierung wieder.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: während er säte
  rationale: ἐν mit substantiviertem Infinitiv bezeichnet eine gleichzeitig stattfindende Handlung.
- source_word: ὃ μὲν
  choice: ein Teil
  rationale: Das Neutrum Singular verweist verteilend auf einen Teil der Saat und leitet die verschiedenen Bodenarten ein.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: fiel … an den Weg
  rationale: παρά mit Akkusativ bezeichnet hier den Bereich am bzw. entlang des Weges. „An den Weg“ lässt offen, ob der Samen unmittelbar daneben oder auf den festgetretenen Wegrand fiel.
- source_word: κατεπατήθη
  choice: wurde zertreten
  rationale: Das Passiv von καταπατέω bedeutet, dass etwas mit Füßen niedergetreten wird; „wurde zertreten“ ist knapp und geläufig.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Die Formulierung bewahrt das biblische Bild von οὐρανός, das sowohl „Himmel“ als auch „Luftraum“ bezeichnen kann, und ist im Deutschen verständlich.
- source_word: κατέφαγεν αὐτό
  choice: fraßen ihn auf
  rationale: Das zusammengesetzte Verb κατεσθίω bezeichnet vollständiges bzw. gieriges Aufessen. „Fraßen ihn auf“ ist im Deutschen bei Vögeln natürlich und gibt die verstärkende Bedeutung wieder.
