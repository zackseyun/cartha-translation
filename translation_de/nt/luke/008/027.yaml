source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: de
  text: Als er an Land ging[a], kam ihm ein Mann aus der Stadt entgegen, der Dämonen hatte[b]. Und seit geraumer Zeit hatte er keine Kleidung angezogen, und er hielt sich nicht in einem Haus auf, sondern in den Grabstätten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als er das Land betrat.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, idiomatischer: „der von Dämonen besessen war“. Wörtlich steht im Griechischen: „der Dämonen hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: Als er an Land ging
  rationale: Die temporale Partizipialkonstruktion bezeichnet Jesu Betreten des Landes nach der Überfahrt. „An Land gehen“ ist im Deutschen natürlich, ohne den Ort unnötig als Strand oder Ufer festzulegen.
- source_word: ὑπήντησεν
  choice: kam ihm ... entgegen
  rationale: Die Wendung gibt die zielgerichtete Begegnung im erzählerischen Zusammenhang natürlich und unmittelbar wieder.
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  choice: ein Mann aus der Stadt
  rationale: Das indefinite τις wird durch den unbestimmten Artikel hinreichend wiedergegeben; ἀνήρ bezeichnet ausdrücklich einen Mann.
- source_word: ἔχων δαιμόνια
  choice: der Dämonen hatte
  rationale: Diese Formulierung bleibt nahe bei der wörtlichen Aussage „Dämonen habend“ und vermeidet es, die stärker deutende feste Wendung „von Dämonen besessen“ in den Haupttext einzutragen.
- source_word: χρόνῳ ἱκανῷ
  choice: schon seit geraumer Zeit
  rationale: Die Wendung drückt eine beträchtliche Dauer aus. „Seit geraumer Zeit“ ist idiomatisches, würdiges Gegenwartsdeutsch.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: zog er keine Kleidung mehr an
  rationale: Das mediale ἐνδύω bezeichnet das Anziehen. Die deutsche Formulierung bewahrt diesen verbalen Aspekt und lässt im Zusammenhang erkennen, dass dieser Zustand bereits längere Zeit bestand.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: er hielt sich nicht in einem Haus auf
  rationale: μένω kann bleiben, sich aufhalten oder wohnen bedeuten. „Sich aufhalten“ bewahrt die Offenheit und passt zum iterativ-beschreibenden Imperfekt.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: sondern in den Grabstätten
  rationale: μνήματα sind Gräber beziehungsweise Grabstätten. „Grabstätten“ ist präzise, ohne eine bestimmte Bauform wie Grabhöhlen vorauszusetzen.
theological_decisions:
- issue: Wiedergabe von δαιμόνια
  choice: Dämonen
  alternative: unreine Geister
  rationale: Im griechischen Text steht ausdrücklich δαιμόνια, nicht πνεύματα ἀκάθαρτα. „Dämonen“ ist daher die direkte lexikalische Entsprechung.
- issue: Wiedergabe von ἔχων δαιμόνια
  choice: der Dämonen hatte
  alternative: der von Dämonen besessen war
  rationale: Der Haupttext bewahrt die ungewöhnliche, aber klare Ausdrucksweise des Griechischen und legt den Grad oder die Art der dämonischen Einwirkung nicht durch eine stärker deutende Besitzterminologie fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem erzählerischem Ton. Die Satzverknüpfung mit „und“ wahrt das griechische καί, ohne einen nicht ausgedrückten Kausalzusammenhang einzuführen.
