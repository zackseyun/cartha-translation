  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: de
  text: Als Jesus zurückkehrte, hieß ihn die Menschenmenge willkommen[a]; denn alle warteten auf ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm ihn die Menschenmenge auf“. Das griechische Verb kann sowohl „aufnehmen“ als auch „willkommen heißen“ bedeuten; hier legt der Zusammenhang eine freundliche Aufnahme nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn alle erwarteten ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Als … zurückkehrte
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv bezeichnet hier den Zeitpunkt. „Als … zurückkehrte“ ist im Deutschen natürlich und gibt den Vorgang im Erzählfluss präzise wieder. Das schwache narrative δέ muss dabei nicht eigens mit „aber“ übersetzt werden.
- source_word: ὑποστρέφειν
  choice: zurückkehrte
  rationale: ὑποστρέφω bedeutet hier „zurückkehren“. Die finite Vergangenheitsform fügt sich natürlich in den deutschen temporalen Nebensatz ein.
- source_word: ἀπεδέξατο
  choice: hieß … willkommen
  rationale: ἀποδέχομαι bezeichnet in diesem Zusammenhang eine positive Aufnahme. „Willkommen heißen“ bringt diesen Sinn in modernem Deutsch klar zum Ausdruck, ohne eine ausdrücklich genannte Freude hinzuzufügen.
- source_word: ὁ ὄχλος
  choice: die Menschenmenge
  rationale: ὄχλος bezeichnet die versammelte Menge. „Menschenmenge“ ist eindeutig und in modernem Standarddeutsch gut verständlich.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: denn alle warteten auf ihn
  rationale: γάρ nennt den Grund für den Empfang. Die Umschreibung „warteten“ bewahrt den andauernden Charakter von ἦσαν … προσδοκῶντες; πάντες wird ausdrücklich mit „alle“ wiedergegeben.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der schwache griechische Erzählanschluss δέ bleibt unmarkiert, weil „aber“ im Deutschen einen nicht ausdrücklich vorhandenen Gegensatz nahelegen könnte. Das Semikolon vor „denn“ gliedert Begebenheit und Begründung klar.
