id: LUK.8.44
reference: Luke 8:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: de
  text: Sie trat von hinten an ihn heran und berührte den Saum[a] seines Gewandes. Sofort hörte ihre Blutung auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Rand oder die Quaste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Sie trat von hinten an ihn heran
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende bzw. sie begleitende Annäherung; ὄπισθεν gibt die Richtung oder Position hinter Jesus an. Die Formulierung ist natürlich und wahrt beides.
- source_word: ἥψατο
  choice: berührte
  rationale: ἅπτομαι bedeutet in dieser Konstruktion gewöhnlich „berühren“, ohne zwingend ein festes Ergreifen auszudrücken.
- source_word: τοῦ κρασπέδου
  choice: den Saum
  rationale: κράσπεδον kann den Rand oder Saum eines Kleidungsstücks, möglicherweise auch eine dort angebrachte Quaste, bezeichnen. „Saum“ ist im Deutschen idiomatisch und vermeidet im Haupttext eine zu enge Festlegung.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: seines Gewandes
  rationale: ἱμάτιον bezeichnet allgemein ein Kleidungsstück, häufig ein Obergewand. „Gewand“ bleibt breit genug und klingt in diesem Erzählzusammenhang würdig und natürlich.
- source_word: παραχρῆμα
  choice: Sofort
  rationale: Das Adverb hebt den unmittelbaren Eintritt der Wirkung hervor.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: hörte ihre Blutung auf
  rationale: Die idiomatische deutsche Wendung gibt direkt wieder, dass der anhaltende Blutfluss zum Stillstand kam.
theological_decisions:
- issue: Möglicher Bezug von κράσπεδον auf die Quasten jüdischer Kleidung
  choice: Im Haupttext „Saum“
  alternative: „Rand“ oder „Quaste“
  rationale: Der Ausdruck kann allgemein den Kleidungsrand oder spezifischer eine Quaste daran meinen. Der Vers allein erzwingt keinen ausdrücklichen Bezug auf die Tora-Bestimmungen zu Kleidungsquasten; die echte lexikalische Offenheit bleibt daher in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Haupttext ist idiomatisch, während die Fußnote die sachlich relevante Mehrdeutigkeit von κράσπεδον bewahrt.
