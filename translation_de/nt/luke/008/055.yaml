id: LUK.8.55
reference: Luke 8:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: de
  text: Ihr Geist kehrte zurück[a], und sofort stand sie auf. Er ordnete an, ihr etwas zu essen zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Lebensatem kehrte zurück.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrte zurück
  rationale: Die Wendung gibt die konkrete Bedeutung des Aorists natürlich wieder und bezeichnet hier die Wiederherstellung des Lebens, ohne den Vorgang weiter auszudeuten.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: ihr Geist
  rationale: πνεῦμα kann Geist, Atem oder Lebenshauch bezeichnen. „Ihr Geist“ wahrt in diesem Auferweckungskontext die größere Bedeutungsweite; die mögliche Wiedergabe mit „Lebensatem“ wird in einer Fußnote genannt.
- source_word: ἀνέστη
  choice: stand sie auf
  rationale: „Aufstehen“ ist die natürliche moderne Entsprechung von ἀνίστημι und beschreibt hier die unmittelbar sichtbare körperliche Handlung.
- source_word: παραχρῆμα
  choice: sofort
  rationale: „Sofort“ gibt die betonte Unmittelbarkeit knapp und idiomatisch wieder.
- source_word: διέταξεν
  choice: ordnete an
  rationale: διατάσσω bezeichnet eine verbindliche Anweisung. „Ordnete an“ bewahrt deren Autorität, ohne unnötig schroff zu klingen.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: ihr etwas zu essen zu geben
  rationale: Diese idiomatische deutsche Formulierung bildet sowohl das passive δοθῆναι als auch das ausdrücklich genannte φαγεῖν sinngenau ab.
theological_decisions:
- issue: Bedeutung von πνεῦμα bei der Auferweckung des Mädchens
  choice: ihr Geist kehrte zurück
  alternative: ihr Lebensatem kehrte zurück
  rationale: „Geist“ bewahrt die personale und theologische Bedeutungsweite des griechischen Wortes, ohne festzulegen, wie Geist und Leben zueinander stehen. „Lebensatem“ bleibt aufgrund des lexikalischen Spektrums möglich und wird daher als Alternative ausgewiesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die Satzstellung hebt wie das griechische παραχρῆμα die Unmittelbarkeit ihres Aufstehens hervor.
