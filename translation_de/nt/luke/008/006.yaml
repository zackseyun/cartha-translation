  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: de
  text: Und anderes fiel auf den Felsen[a]. Als es aufgegangen war, verdorrte es, weil es keine Feuchtigkeit hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Fels“. Der griechische Text verwendet den Singular und bewahrt damit das Bild von Saat, die auf eine Felsfläche fällt, statt allgemeiner von „felsigem Boden“ zu sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: anderes
  rationale: Das substantivierte Neutrum Singular bezeichnet im Zusammenhang anderes Saatgut beziehungsweise einen weiteren Teil der Saat; „anderes“ bewahrt Form und Abfolge knapp.
- source_word: κατέπεσεν
  choice: fiel
  rationale: Der Aorist von καταπίπτω beschreibt schlicht das Niederfallen; im Deutschen genügt das natürliche „fiel“.
- source_word: ἐπὶ τὴν πέτραν
  choice: auf den Felsen
  rationale: πέτρα steht im Singular und bezeichnet konkret Fels; „auf den Felsen“ erhält dieses Bild, statt es zu „felsigem Boden“ zu verallgemeinern.
- source_word: φυὲν
  choice: als es aufgegangen war
  rationale: Das Aoristpartizip von φύω bezeichnet beim Saatgut das Aufgehen und liegt zeitlich vor dem Verdorren; die temporale Wiedergabe macht diese Abfolge natürlich deutlich.
- source_word: ἐξηράνθη
  choice: verdorrte es
  rationale: Im Zusammenhang mit einer Pflanze ist „verdorren“ die idiomatische deutsche Entsprechung für das Austrocknen.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: weil es keine … hatte
  rationale: διά mit substantiviertem Infinitiv drückt hier die Ursache aus; ein weil-Satz gibt diese Beziehung klar wieder.
- source_word: ἰκμάδα
  choice: Feuchtigkeit
  rationale: ἰκμάς bezeichnet die für das Wachstum nötige Feuchtigkeit; die deutsche Entsprechung ist verständlich und sachlich präzise.
