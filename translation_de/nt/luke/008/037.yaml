id: LUK.8.37
reference: Luke 8:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: de
  text: Und die ganze Menschenmenge aus dem umliegenden Gebiet der Gerasener bat ihn, von ihnen wegzugehen, denn sie waren von großer Furcht ergriffen. Er aber stieg in ein Boot und kehrte zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησεν
  choice: bat
  rationale: ἐρωτάω bezeichnet hier eine nachdrückliche Bitte. „bat“ ist im Deutschen natürlich und gibt mehr als eine bloße Frage wieder, ohne die Intensität unnötig bis zu „flehte an“ zu steigern.
- source_word: ἅπαν τὸ πλῆθος
  choice: die ganze Menschenmenge
  rationale: Die Formulierung bewahrt sowohl den kollektiven Sinn von πλῆθος als auch die umfassende Kraft von ἅπαν.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: aus dem Umland der Gerasener
  rationale: περίχωρος bezeichnet das umliegende Gebiet; „Umland“ ist präzises, gegenwärtiges Deutsch. „Gerasener“ gibt die Personen- beziehungsweise Gebietsbezeichnung der vorliegenden griechischen Lesart wieder.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: von ihnen wegzugehen
  rationale: Die Formulierung erhält die räumliche Richtung von ἀπό und gibt den Inhalt der Bitte klar wieder.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: sie waren von großer Furcht ergriffen
  rationale: „ergriffen“ gibt die passive, festhaltende Wirkung von συνέχω idiomatisch wieder; „große Furcht“ entspricht φόβῳ μεγάλῳ, ohne die Art dieser Furcht näher auszudeuten.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: stieg in ein Boot
  rationale: Die Wendung gibt das Einsteigen knapp und natürlich wieder. Da πλοῖον ohne Artikel steht, ist „ein Boot“ angemessen.
- source_word: ὑπέστρεψεν
  choice: kehrte zurück
  rationale: „kehrte zurück“ entspricht der üblichen Bedeutung von ὑποστρέφω und bewahrt den knappen Erzählstil.
theological_decisions:
- issue: Wesen und Beweggrund der Furcht der Gerasener
  choice: Die Furcht wird ohne nähere Deutung als Ursache ihrer Bitte genannt.
  alternative: Die Furcht ausdrücklich als ehrfürchtiges Erschrecken vor göttlicher Macht oder als feindselige Reaktion auf wirtschaftlichen beziehungsweise gesellschaftlichen Verlust bestimmen.
  rationale: Der griechische Text bezeichnet die Furcht als groß, erklärt aber weder ihre genaue Art noch ihre Beweggründe. Die Übersetzung lässt diese theologische und erzählerische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. „Er aber“ wahrt den Kontrast von αὐτὸς δέ; es wird keine im Ausgangstext nicht gegebene Erklärung ergänzt.
