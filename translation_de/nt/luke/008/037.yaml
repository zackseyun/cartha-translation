- from: Da bat ihn die ganze Menschenmenge aus dem Umland der Gerasener, von ihnen wegzugehen, denn sie waren von großer Furcht ergriffen. Er aber stieg in ein Boot und kehrte zurück.
  to: Und die ganze Menschenmenge aus dem umliegenden Gebiet der Gerasener bat ihn, von ihnen wegzugehen, denn sie waren von großer Furcht ergriffen. Er aber stieg in ein Boot und kehrte zurück.
  rationale: Die Revision präzisiert allein die geografisch-personale Genitivverbindung und neutralisiert den Satzanschluss. Sie erhält die kollektive Aussage, die nicht weiter erklärte große Furcht sowie den knappen erzählerischen Kontrast bei „Er aber“ unverändert.
