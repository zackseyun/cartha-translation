  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: de
  text: 'Doch er antwortete ihnen: »Meine Mutter und meine Brüder[a] – das sind die, die das Wort Gottes hören und danach handeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder dem Sinn nach: »meine Geschwister«. Im Griechischen steht »Brüder«; die Aussage kann jedoch auch Frauen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: Doch er antwortete ihnen
  rationale: „Doch“ gibt den fortführend-kontrastierenden Charakter von δέ wieder. Die im Griechischen geläufige Verbindung „antwortete und sagte“ wird im natürlichen Deutschen zu „antwortete“ zusammengezogen; „ihnen“ entspricht πρὸς αὐτούς.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: Meine Mutter und meine Brüder
  rationale: Direkte Wiedergabe der Verwandtschaftsbezeichnungen. „Brüder“ wahrt die maskuline Form und den Bezug auf Jesu zuvor erwähnte leibliche Brüder; eine mögliche weiter gefasste Anwendung wird in der Fußnote genannt.
- source_word: οὗτοί εἰσιν οἱ
  choice: das sind die, die
  rationale: Die Konstruktion bewahrt die hervorhebende, identifizierende Kraft des Demonstrativpronomens οὗτοι und klingt zugleich in modernem Deutsch natürlich.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Die traditionelle und sachlich genaue Wendung erhält sowohl die Bedeutung als göttliche Botschaft als auch die theologische Resonanz von λόγος.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: hören und danach handeln
  rationale: Die substantivierten Präsenspartizipien kennzeichnen die betreffenden Menschen fortdauernd. „Danach handeln“ gibt idiomatisch wieder, dass das Gehörte ausgeführt wird, ohne das stärker deutende „gehorchen“ einzutragen.
theological_decisions:
- issue: Umfang der von Jesus neu bestimmten Familie
  choice: Jesus bezeichnet diejenigen als seine Familie, die Gottes Wort hören und danach handeln.
  alternative: Jesus weist seine leibliche Familie zurück oder spricht ausschließlich von männlichen Jüngern.
  rationale: Der Vers erweitert die Vorstellung von Zugehörigkeit aufgrund der Reaktion auf Gottes Wort, erklärt aber nicht ausdrücklich eine Zurückweisung seiner leiblichen Familie. Die maskuline Quellenform bleibt im Haupttext sichtbar, während die mögliche umfassendere Anwendung nicht ausgeschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die identifizierende Aussage hervor und vermeidet eine schwerfällige wörtliche Konstruktion. Die Formulierung „danach handeln“ ist gegenwärtig und verständlich, bleibt aber eng am Handlungssinn von ποιέω.
