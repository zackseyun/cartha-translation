id: LUK.8.30
reference: Luke 8:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: de
  text: 'Da fragte Jesus ihn: „Wie heißt du?“ Er antwortete: „Legion“[a], denn viele Dämonen waren in ihn gefahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Legion“ ist ein lateinisches Lehnwort und bezeichnet eine große römische Militäreinheit; hier weist der Name darauf hin, dass viele Dämonen in den Mann gefahren waren.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Da fragte Jesus ihn
  rationale: ἐπηρώτησεν bezeichnet hier eine direkte Frage; „fragte“ ist die natürliche deutsche Wiedergabe. δέ führt die Erzählung weiter und wird knapp mit „Da“ wiedergegeben.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Wie heißt du?
  rationale: Die idiomatische deutsche Frage gibt den Sinn der griechischen Formulierung natürlich und vollständig wieder.
- source_word: Λεγιών
  choice: Legion
  rationale: Das griechische Lehnwort wird in seiner im Deutschen etablierten Form beibehalten und trägt zugleich die Anspielung auf eine große römische Truppeneinheit.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier die Bezeichnung „Legion“. „Denn“ verbindet Antwort und Begründung im Deutschen flüssig, ohne die Kausalbeziehung abzuschwächen.
- source_word: εἰσῆλθεν δαιμόνια πολλὰ εἰς αὐτόν
  choice: viele Dämonen waren in ihn hineingefahren
  rationale: „Dämonen“ gibt δαιμόνια unmittelbar wieder. Das Plusquamperfekt verdeutlicht, dass ihr Eindringen der Namensangabe vorausging; „in ihn hineingefahren“ bewahrt die durch εἰς ausgedrückte Bewegung nach innen.
theological_decisions:
- issue: Wiedergabe von δαιμόνια im Zusammenhang dämonischer Besessenheit
  choice: Dämonen
  alternative: böse Geister
  rationale: „Dämonen“ ist die direkte lexikalische Entsprechung und bewahrt die Aussage des Textes über personale böse Geistwesen, ohne sie abzuschwächen oder näher zu deuten.
- issue: Zeitliches Verhältnis von εἰσῆλθεν zur Antwort „Legion“
  choice: waren … hineingefahren
  alternative: fuhren … hinein / sind … hineingefahren
  rationale: 'Das deutsche Plusquamperfekt macht den aus dem Erzählzusammenhang hervorgehenden Vorzeitigkeitssinn deutlich: Das Eindringen erklärt die bereits gegebene Bezeichnung „Legion“.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Wie heißt du?“ ist bewusst idiomatisch; „hineingefahren“ bewahrt sowohl die Bewegungsrichtung des griechischen Ausdrucks als auch den biblischen Zusammenhang, ohne zusätzliche Deutung.
