  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: de
  text: 'Alle weinten und trauerten um sie. Er aber sagte: »Weint nicht! Denn sie ist nicht gestorben, sondern sie schläft.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist eingeschlafen«. Jesu Formulierung verwendet Schlaf im Zusammenhang mit ihrer unmittelbar bevorstehenden Wiederherstellung bildhaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: weinten
  rationale: Das Imperfekt bezeichnet das andauernde Weinen; im Deutschen ergibt sich diese Fortdauer natürlich aus der erzählten Szene.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt den ausdrücklich umfassenden Bezug auf die Anwesenden.
- source_word: ἐκόπτοντο αὐτήν
  choice: trauerten um sie
  rationale: Im Trauerkontext bezeichnet κόπτομαι Klagen, gegebenenfalls mit körperlichen Trauergesten; die Wiedergabe vermittelt den Sinn, ohne eine konkrete Geste festzulegen.
- source_word: Μὴ κλαίετε
  choice: Weint nicht!
  rationale: Die Verneinung mit Präsensimperativ kann das Aufhören einer bereits laufenden Handlung verlangen; die knappe deutsche Aufforderung bleibt natürlich und wahrt diese Möglichkeit.
- source_word: οὐ γὰρ
  choice: Denn ... nicht
  rationale: Denn gibt die begründende Funktion von γάρ prägnant wieder.
- source_word: ἀπέθανεν
  choice: ist nicht gestorben
  rationale: Das Perfekt ist im Deutschen idiomatisch und stellt den eingetretenen Tod dem gegenwärtigen Schlafen gegenüber.
- source_word: καθεύδει
  choice: sie schläft
  rationale: Das Präsens wird unmittelbar wiedergegeben und bewahrt Jesu Bildsprache, ohne sie erklärend aufzulösen.
theological_decisions:
- issue: Jesu Aussage, das Mädchen sei nicht gestorben, sondern schlafe
  choice: Die wörtliche Gegenüberstellung »nicht gestorben, sondern sie schläft« bleibt im Haupttext erhalten.
  alternative: »Sie ist nicht endgültig tot« oder »sie ist nur eingeschlafen«
  rationale: Der Wortlaut kann Schlaf als Bild für den Tod angesichts der unmittelbar bevorstehenden Wiederherstellung verwenden, ohne dass der Übersetzer das Verhältnis von Tod und Schlaf dogmatisch oder medizinisch festlegt. Die Spannung der Erzählung bleibt bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die adversative Struktur ὁ δὲ wird mit »Er aber« bewahrt; die beiden fortlaufenden Trauerhandlungen werden knapp und natürlich koordiniert.
