  source_fidelity: 'Der Haupttext gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: πάντες ist mit „Alle“ erfasst, die beiden Imperfekte werden angemessen als andauernde Trauerhandlungen wiedergegeben, und γάρ wird durch „Denn“ begründend wiedergegeben. „trauerten um sie“ ist für ἐκόπτοντο αὐτήν eine natürliche, nicht übermäßig spezifizierende Wiedergabe. Die Gegenüberstellung „ist nicht gestorben, sondern sie schläft“ bewahrt Jesu Formulierung und die Spannung des Kontextes.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch mit angemessen schlichtem erzählerischem Register. „Er aber sagte“ bildet den griechischen Übergang natürlich ab; „Weint nicht!“ ist idiomatisch.
  terminology: Die Begriffe „gestorben“ und „schläft“ sind treffend. Die vorhandene Fußnote legt jedoch durch „ihren Tod“ fest, dass Jesu Aussage hier eindeutig als Bezeichnung eines bereits eingetretenen Todes zu verstehen sei. Das geht über die bewusst spannungsvoll formulierte Aussage im Haupttext hinaus. Die Fußnote soll stattdessen nur die metaphorische Ausdrucksweise und die lexikalische Alternative erläutern.
