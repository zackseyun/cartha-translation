source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: de
  text: 'An einem dieser Tage geschah es, dass er mit seinen Jüngern in ein Boot stieg und zu ihnen sagte: »Lasst uns ans andere Ufer des Sees hinüberfahren.« Dann legten sie ab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dann fuhren sie hinaus.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: An einem dieser Tage
  rationale: Die lukanische Eröffnungsformel leitet ein neues Ereignis ein. Im Deutschen wird ihre narrative Funktion zusammen mit der folgenden Zeitangabe natürlich ausgedrückt; ein separates „Und es geschah“ wäre möglich, klänge hier jedoch unnötig schwer.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: an einem dieser Tage
  rationale: Die Formulierung bewahrt den unbestimmten Zeitpunkt innerhalb eines bereits bekannten Zeitraums und klingt im modernen Deutschen natürlich.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: stieg er mit seinen Jüngern in ein Boot
  rationale: Die koordinierte griechische Konstruktion besagt, dass Jesus und seine Jünger einstiegen. „Mit seinen Jüngern“ gibt dies knapp und idiomatisch wieder, ohne αὐτός unnötig mit „selbst“ zu betonen.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sagte zu ihnen
  rationale: Direkte, formnahe und natürliche Wiedergabe von λέγω mit πρός.
- source_word: Διέλθωμεν
  choice: Lasst uns … hinüberfahren
  rationale: Der hortative Konjunktiv wird als gemeinsamer Vorschlag wiedergegeben. Im Zusammenhang mit dem Boot macht „hinüberfahren“ die Bewegung idiomatisch deutlich.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: ans andere Ufer des Sees
  rationale: τὸ πέραν bezeichnet die gegenüberliegende Seite. Bei einem See ist „das andere Ufer“ eine natürliche und präzise deutsche Entsprechung; λίμνη wird als „See“ wiedergegeben.
- source_word: ἀνήχθησαν
  choice: legten sie ab
  rationale: 'Das Verb hat hier nautischen Sinn: vom Ufer aufbrechen bzw. hinausfahren. „Ablegen“ ist im Deutschen knapp, klar und kontextgerecht.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lukanische Erzählweise bleibt knapp; nautische Ausdrücke werden verständlich und ohne unnötigen Fachton wiedergegeben.
