  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: de
  text: Diejenigen, die es gesehen hatten, berichteten ihnen, wie der von Dämonen besessene Mann gerettet wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie der von Dämonen besessene Mann geheilt wurde« oder »befreit wurde«. Das griechische Verb kann je nach Zusammenhang retten, heilen oder befreien bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet das Mitteilen oder Berichten eines Geschehens. »Berichteten« passt zum Zeugnis derer, die den Vorgang gesehen hatten, und wahrt den erzählerischen Ton.
- source_word: δὲ
  choice: unübersetzt
  rationale: Die Partikel führt die Erzählung mit einem schwachen Anschluss weiter. Im Deutschen bleibt der Zusammenhang auch ohne ein ausdrückliches »aber« oder »und« natürlich und klar.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Empfänger des Berichts und wird unmittelbar mit »ihnen« wiedergegeben.
- source_word: οἱ ἰδόντες
  choice: Die es gesehen hatten
  rationale: Das substantivierte Aoristpartizip bezeichnet diejenigen, die das vorausgehende Geschehen mit angesehen hatten. Die Formulierung gibt sowohl den Personenbezug als auch die zeitliche Vorordnung natürlich wieder.
- source_word: πῶς
  choice: wie
  rationale: »Wie« kann sowohl die Art und Weise als auch den Inhalt des Berichts einleiten und bewahrt damit die Offenheit des griechischen Ausdrucks.
- source_word: ἐσώθη
  choice: gerettet worden war
  rationale: Das Passiv von σῴζω kann je nach Zusammenhang retten, heilen oder befreien bedeuten. »Gerettet« erhält die umfassende Bedeutung und die sprachliche Verbindung zu anderen Vorkommen des Verbs; kontextnahe Alternativen werden in der Fußnote genannt.
- source_word: ὁ δαιμονισθείς
  choice: der von Dämonen besessene Mann
  rationale: Das substantivierte maskuline Partizip bezeichnet den Mann, der unter dämonischer Macht gestanden hatte. Die Wiedergabe ist klar, gegenwärtig verständlich und macht den im Griechischen vorausgesetzten männlichen Personenbezug deutlich.
theological_decisions:
- issue: Bedeutung von ἐσώθη im Zusammenhang einer Dämonenaustreibung
  choice: gerettet worden war
  alternative: geheilt oder befreit worden war
  rationale: σῴζω umfasst Rettung, Heilung und Befreiung. »Gerettet« bewahrt die mögliche weitere theologische Resonanz, ohne sie auf rein geistliches Heil festzulegen; die Fußnote nennt die im unmittelbaren Zusammenhang naheliegenden Bedeutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativanschluss »Die es gesehen hatten« ist alltagssprachlich verständlich, ohne den Zeugenbegriff stärker auszudeuten als das griechische Partizip. Die Formulierung »von Dämonen besessen« bleibt sachlich und quellengetreu.
