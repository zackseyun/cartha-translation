  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: de
  text: Was aber auf den guten Boden gefallen ist, das sind die, die das Wort mit einem guten und edlen Herzen gehört haben, daran festhalten und mit Ausdauer Frucht bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: Was aber auf dem guten Boden liegt
  rationale: Die substantivierte Präpositionalfügung ist im Zusammenhang des Gleichnisses elliptisch. Die neutrale Formulierung bewahrt den Rückbezug auf das Gesäte, ohne im Deutschen unnötig ausdrücklich „der Same“ einzufügen.
- source_word: καλῇ γῇ
  choice: guten Boden
  rationale: γῆ bezeichnet hier den für die Saat geeigneten Erdboden; „Boden“ ist im Deutschen für dieses Gleichnis natürlich und erhält den landwirtschaftlichen Bildbereich.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: das sind die, die
  rationale: Die Wendung kennzeichnet die Personengruppe, für die der gute Boden steht. Die deutsche Fassung ist klar und gegenwärtig.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: mit einem aufrichtigen und guten Herzen
  rationale: καλός kann bei einer moralischen Charakterisierung „aufrichtig“ beziehungsweise „edel“ bezeichnen, während ἀγαθός mit „gut“ wiedergegeben wird. So bleibt die zweifache Charakterisierung erhalten, ohne die beiden annähernden Synonyme künstlich gleich zu übersetzen.
- source_word: ἀκούσαντες τὸν λόγον
  choice: das Wort ... hören
  rationale: Das deutsche Präsens fügt sich idiomatisch in die allgemeine Identifizierung dieser Menschen ein. Die sachliche Abfolge – hören, festhalten, Frucht bringen – bleibt erhalten.
- source_word: κατέχουσιν
  choice: daran festhalten
  rationale: κατέχω bezeichnet hier das beharrliche Bewahren des gehörten Wortes; „daran festhalten“ gibt sowohl den Bezug als auch die Festigkeit natürlich wieder.
- source_word: καρποφοροῦσιν
  choice: Frucht bringen
  rationale: Die geläufige deutsche Wendung wahrt das landwirtschaftliche und übertragene Bild.
- source_word: ἐν ὑπομονῇ
  choice: mit Ausdauer
  rationale: ὑπομονή bezeichnet standhaftes Ausharren. „Mit Ausdauer“ gibt die Art und Weise des Fruchtbringens verständlich wieder, ohne den Ausdruck auf bloßes geduldiges Warten zu verengen.
theological_decisions:
- issue: Moralische Beschreibung des aufnahmebereiten Herzens
  choice: mit einem aufrichtigen und guten Herzen
  alternative: mit einem edlen und guten Herzen
  rationale: Die Übersetzung erhält die positive doppelte Charakterisierung der inneren Haltung, legt aber nicht fest, wie ein solches Herz entsteht. Damit werden weder Verdienst noch eine bestimmte Heilsordnung in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Struktur und die Bildsprache des Gleichnisses bleiben erhalten; „aufrichtig und gut“ ist für heutige Leser verständlicher als eine wörtlich redundante Wiedergabe der beiden nah verwandten Adjektive.
