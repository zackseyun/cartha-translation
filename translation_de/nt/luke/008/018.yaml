id: LUK.8.18
reference: Luke 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: de
  text: Achtet also darauf, wie ihr zuhört! Denn wer hat, dem wird gegeben werden; und wer nicht hat, dem wird auch das genommen werden, was er zu haben meint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was er zu haben scheint“.'
    reason: Lexikalische Alternative zu δοκεῖ, das sowohl „meinen“ als auch „scheinen“ ausdrücken kann.
lexical_decisions:
- source_word: βλέπετε
  choice: Achtet darauf
  rationale: Der Imperativ fordert hier zu sorgfältiger Aufmerksamkeit auf, nicht zum buchstäblichen Sehen. „Achtet darauf“ gibt den warnenden Sinn im heutigen Deutsch natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Das Wort kennzeichnet eine Folgerung aus dem vorausgehenden Bild vom Licht und aus der Aufforderung zum rechten Hören. „Also“ wahrt diesen Zusammenhang knapp und idiomatisch.
- source_word: πῶς ἀκούετε
  choice: wie ihr zuhört
  rationale: πῶς bezeichnet die Art und Weise des Hörens. „Zuhört“ unterstreicht die aufmerksame, aufnehmende Haltung, ohne bereits eine bestimmte Reaktion in den Text hineinzulesen.
- source_word: ὃς ἂν ... ἔχῃ
  choice: wer hat
  rationale: Relativsatz mit ἄν und Konjunktiv als unbestimmte allgemeine Bedingung; „wer hat“ bewahrt den sprichwortartigen Charakter.
- source_word: δοθήσεται αὐτῷ
  choice: dem wird gegeben werden
  rationale: Im Griechischen steht kein ausdrückliches Objekt. Die Wiedergabe lässt deshalb offen, was beziehungsweise wie viel gegeben wird, und erhält die knappe Formulierung des Ausgangstextes.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: wer nicht hat
  rationale: Die Formulierung entspricht der ersten allgemeinen Bedingung und bewahrt den zugespitzten Gegensatz.
- source_word: ὃ δοκεῖ ἔχειν
  choice: was er zu haben meint
  rationale: δοκέω kann subjektiv „meinen“ oder eher objektiv „scheinen“ bedeuten. „Zu haben meint“ ist im Deutschen klar und gibt die Vorstellung eines nur vermeintlichen Besitzes wieder; die andere mögliche Nuance wird in einer Fußnote erhalten.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: wird ihm genommen werden
  rationale: Das Passiv von αἴρω bezeichnet hier Entzug oder Wegnahme. Die deutsche Passivform wahrt auch, dass der Handelnde nicht genannt wird.
theological_decisions:
- issue: Deutung des paradoxen Satzes über Haben und Nichthaben
  choice: Der Spruch bleibt in seinem unmittelbaren Zusammenhang mit der Art des Hörens offen formuliert.
  alternative: Ausdrückliche Deutung als Lehre über Vorherbestimmung, Verdienst, materiellen Wohlstand oder eine allgemeine Regel der Verwaltung anvertrauter Güter.
  rationale: Der Vers formuliert ein zugespitztes Prinzip im Kontext der Aufnahme von Jesu Wort, legt hier aber keine dieser weitergehenden theologischen Deutungen ausdrücklich fest.
- issue: Nicht genanntes Objekt bei δοθήσεται
  choice: „dem wird gegeben werden“ ohne Ergänzung „mehr“
  alternative: „dem wird mehr gegeben werden“
  rationale: „Mehr“ ist sinngemäß möglich und in deutscher Wiedergabe verständlich, steht jedoch nicht ausdrücklich im griechischen Text. Die objektlose Form bleibt im Deutschen verständlich und bewahrt die Offenheit des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede steht entsprechend dem griechischen Plural in der vertrauten Form „ihr“. Der generische Singular „wer … er“ erhält die individuelle, sprichwortartige Zuspitzung. Das Ausrufezeichen nach der Aufforderung macht deren warnenden Nachdruck deutlich, ohne den Sinn zu erweitern.
