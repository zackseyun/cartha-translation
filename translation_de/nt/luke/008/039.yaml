review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die Imperative Ὑπόστρεφε und διηγοῦ treffend mit „Kehre … zurück“ und „erzähle“ wieder. „in dein Haus“ entspricht der räumlichen Richtung von εἰς τὸν οἶκόν σου. „was Gott für dich getan hat“ bildet ὅσα σοι ἐποίησεν ὁ θεός ohne die im Griechischen nicht ausgedrückte Ergänzung „Großes“ ab. Die zweite Satzhälfte bewahrt sowohl die öffentliche Nuance von κηρύσσων als auch die Parallelführung Gott/Jésus. „in der ganzen Stadt“ ist eine natürliche, ausreichende Wiedergabe von καθ’ ὅλην τὴν πόλιν.
  naturalness: Modernes, idiomatisches und würdiges Standarddeutsch. Die direkte Rede ist klar und knapp; „ging er fort und verkündete“ führt die Erzählung flüssig weiter. Das Plusquamperfekt „getan hatte“ ist im deutschen Erzählzusammenhang natürlich und stellt keine sachliche zusätzliche Behauptung gegenüber dem griechischen Aorist dar.
  terminology: „Gott“, „Jesus“ und „verkündete“ sind angemessen. Insbesondere wird die absichtliche textliche Gegenüberstellung dessen, was Gott getan hat, und dessen, was Jesus getan hatte, ohne harmonisierende oder dogmatische Erläuterung bewahrt.
