id: LUK.8.39
reference: Luke 8:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: de
  text: „Kehre in dein Haus zurück und erzähle, was Gott für dich getan hat.“ Da ging er fort und verkündete in der ganzen Stadt, was Jesus für ihn getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Kehre … zurück
  rationale: Der Imperativ bezeichnet die Rückkehr an einen früheren Ort; die deutsche Wendung ist präzise und natürlich.
- source_word: εἰς τὸν οἶκόν σου
  choice: in dein Haus
  rationale: Mit εἰς ist zunächst die räumliche Bedeutung von οἶκος gemeint. „Haus“ wahrt diese, ohne den möglichen Beiklang des Zuhauses auszuschließen.
- source_word: διηγοῦ
  choice: erzähle
  rationale: διηγέομαι bedeutet ausführlich berichten oder erzählen. „Erzähle“ ist im heutigen Deutsch verständlich und lässt mehr als eine bloße kurze Mitteilung erkennen.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: was Gott für dich getan hat
  rationale: ὅσα wird ohne ergänzendes Adjektiv wiedergegeben. So bleibt die Formulierung quellennah; der Umfang und die Größe des Geschehenen ergeben sich aus dem Kontext.
- source_word: ἀπῆλθεν
  choice: ging er fort
  rationale: Die Wendung gibt das Weggehen vom Schauplatz wieder und passt zum erzählenden Aorist.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: in der ganzen Stadt
  rationale: 'Die Formulierung bringt den distributiven Sinn zum Ausdruck: Seine Verkündigung erstreckte sich über die gesamte Stadt.'
- source_word: κηρύσσων
  choice: verkündete
  rationale: κηρύσσω bezeichnet öffentliches Bekanntmachen oder Ausrufen. „Verkündete“ erhält diese stärkere öffentliche Nuance.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: was Jesus für ihn getan hatte
  rationale: Die Formulierung spiegelt den vorausgehenden Satz über Gott. Das Plusquamperfekt ordnet Jesu Handeln natürlich vor dem anschließenden Weggehen und Verkünden ein.
theological_decisions:
- issue: Parallele zwischen „Gott“ im Auftrag Jesu und „Jesus“ in der Verkündigung des Mannes
  choice: 'Die unterschiedliche Benennung wird unverändert bewahrt: Gott hat für dich getan / Jesus hatte für ihn getan.'
  alternative: Beide Aussagen auf „Gott“ oder beide auf „Jesus“ angleichen beziehungsweise die Beziehung ausdrücklich erklären.
  rationale: Der griechische Text stellt Gottes und Jesu Handeln in eine bewusste narrative Parallele, ohne sie redaktionell zu erläutern. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; „verkündete“ trägt den öffentlichen Charakter des anschließenden Handelns. Keine Fußnote ist nötig, da die quellennähere Wiedergabe von ὅσα im Haupttext natürlich verständlich ist.
