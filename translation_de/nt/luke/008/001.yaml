id: LUK.8.1
reference: Luke 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: de
  text: Und danach zog er von Stadt zu Stadt und von Dorf zu Dorf[a], verkündete das Reich Gottes[b] und brachte die gute Nachricht davon. Die Zwölf waren bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Stadt um Stadt und Dorf um Dorf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Königsherrschaft Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: und danach
  rationale: Die lukanische Übergangsformel markiert die zeitliche Fortsetzung. Im Deutschen gibt „und danach“ die Abfolge natürlich wieder; ein wörtliches „und es geschah danach“ wäre hier unnötig schwerfällig.
- source_word: αὐτὸς διώδευεν
  choice: zog er
  rationale: Das Imperfekt beschreibt ein fortgesetztes beziehungsweise wiederholtes Umherziehen. „zog“ ist im Erzählstil natürlich und erfasst die Bewegung durch mehrere Orte.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: von Stadt zu Stadt und von Dorf zu Dorf
  rationale: Die distributive Konstruktion mit κατά und Singular bezeichnet das wiederholte Aufsuchen verschiedener Städte und Dörfer.
- source_word: κηρύσσων
  choice: verkündete
  rationale: „verkündete“ wahrt den Sinn einer öffentlichen Bekanntmachung, ohne die Tätigkeit auf eine Predigt im engeren Sinn zu beschränken.
- source_word: εὐαγγελιζόμενος
  choice: brachte die gute Nachricht
  rationale: Die eigene Wiedergabe unterscheidet dieses Partizip von κηρύσσων und erhält zugleich seinen Inhalt als Freudenbotschaft.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: die Königsherrschaft Gottes
  rationale: „Königsherrschaft“ macht den dynamischen Aspekt von βασιλεία im modernen Deutsch deutlich, ohne ihn auf ein räumliches Reich zu beschränken; die traditionelle Alternative wird in einer Fußnote bewahrt.
- source_word: οἱ δώδεκα
  choice: die Zwölf
  rationale: Die feste Gruppenbezeichnung wird knapp wiedergegeben, ohne „Jünger“ oder „Apostel“ ergänzend in den Text einzutragen.
- source_word: σὺν αὐτῷ
  choice: waren bei ihm
  rationale: Die Ergänzung des finiten Verbs ist im Deutschen erforderlich und gibt die Begleitung natürlich wieder.
theological_decisions:
- issue: Wiedergabe von βασιλεία τοῦ θεοῦ
  choice: die Königsherrschaft Gottes
  alternative: das Reich Gottes
  rationale: βασιλεία kann sowohl Gottes königliches Herrschen als auch sein Reich bezeichnen. „Königsherrschaft“ bringt den Handlungssinn klar zum Ausdruck; die geläufige, weiter gefasste Alternative „Reich Gottes“ steht in der Fußnote, damit die Bedeutungsbreite sichtbar bleibt.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die beiden griechischen Partizipien werden als koordinierte deutsche Verben wiedergegeben und lexikalisch unterschieden. Um einen missverständlichen doppelten Objektbezug zu vermeiden, nimmt „von ihr“ die Königsherrschaft als Inhalt der guten Nachricht auf.
