revisions:
- from: Und danach zog er von Stadt zu Stadt und von Dorf zu Dorf[a], verkündete die Königsherrschaft Gottes[b] und brachte die gute Nachricht von ihr. Die Zwölf waren bei ihm.
  to: Und danach zog er von Stadt zu Stadt und von Dorf zu Dorf[a], verkündete das Reich Gottes[b] und brachte die gute Nachricht davon. Die Zwölf waren bei ihm.
  rationale: Die Revision verwendet mit „Reich Gottes“ eine breite und etablierte Wiedergabe von βασιλεία τοῦ θεοῦ und bewahrt „Königsherrschaft Gottes“ als legitime lexikalische Alternative. Sie stellt zudem den Inhalt der guten Nachricht unmittelbar heraus, ohne die beiden griechischen Verkündigungsbegriffe gleichzusetzen. Die zeitliche Abfolge, die wiederholte Reisebewegung und die Bezeichnung „die Zwölf“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
