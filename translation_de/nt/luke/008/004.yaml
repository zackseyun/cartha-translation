source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: de
  text: 'Als nun eine große Menschenmenge zusammenkam und Menschen aus Stadt um Stadt zu ihm kamen, sprach er in einem Gleichnis[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ein Gleichnis“. Der griechische Ausdruck kann das Mittel oder die Art und Weise des Redens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: zusammenkam
  rationale: Das Genitivus-absolute-Gefüge beschreibt das sich vollziehende Zusammenkommen der Menge. „Zusammenkam“ gibt den Vorgang natürlich und in Verbindung mit „als“ idiomatisch wieder.
- source_word: δὲ
  choice: nun
  rationale: δέ führt die Erzählung ohne starken Gegensatz weiter. „Nun“ markiert diesen narrativen Übergang im Deutschen unaufdringlich.
- source_word: ὄχλου πολλοῦ
  choice: eine große Menschenmenge
  rationale: πολύς bezeichnet hier die Größe beziehungsweise Zahl der Menge. „Große Menschenmenge“ ist klar, gegenwärtig und würdevoll.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: aus einer Stadt nach der anderen Menschen zu ihm kamen
  rationale: κατὰ πόλιν ist distributiv zu verstehen. Die Formulierung macht deutlich, dass Menschen aus verschiedenen, nacheinander genannten oder gedachten Städten kamen, ohne eine organisierte Prozession zu unterstellen.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf Jesus zu; „zu ihm“ ist die natürliche deutsche Entsprechung.
- source_word: εἶπεν
  choice: sprach er
  rationale: „Sprach“ passt im Deutschen gut zur folgenden Angabe der Redeform und bewahrt den gehobenen, aber verständlichen Erzählton.
- source_word: διὰ παραβολῆς
  choice: durch ein Gleichnis
  rationale: διά mit Genitiv kann Mittel oder Art und Weise bezeichnen. „Durch ein Gleichnis“ bildet die Mittelbedeutung relativ direkt ab; die ebenfalls mögliche modale Auffassung wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem biblischem Erzählton. Die Wiederholung von „Menschen“ vermeidet eine mögliche Fehlbeziehung und gibt die zwei koordinierten Gruppen beziehungsweise Vorgänge des griechischen Satzes transparent wieder.
