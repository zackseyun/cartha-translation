review_pass:
  verdict: revise
  source_fidelity: 'Die zwei im Genitivus absolutus verbundenen fortlaufenden Vorgänge werden sachgerecht wiedergegeben: eine große Menge kommt zusammen, und Menschen kommen aus verschiedenen Städten zu Jesus. Die distributive Nuance von κατὰ πόλιν sollte jedoch idiomatischer als „aus einer Stadt nach der anderen“ ausgedrückt werden. Für διὰ παραβολῆς ist im Deutschen „in einem Gleichnis“ die natürliche, semantisch mögliche Wiedergabe; die instrumentale Nuance bleibt als Alternative in der Fußnote erhalten.'
  naturalness: „Aus einer Stadt nach der anderen Menschen“ ist im modernen Standarddeutsch syntaktisch schwerfällig. „Menschen aus Stadt um Stadt“ ist knapper, idiomatischer und bewahrt die distributive Aussage. „Durch ein Gleichnis sprechen“ klingt zudem weniger natürlich als „in einem Gleichnis sprechen“.
  terminology: „Menschenmenge“, „Gleichnis“ und „sprach er“ sind passend für einen verständlichen biblischen Erzählton. Es sind keine theologischen Fachbegriffe problematisch.
  issues:
  - severity: medium
    issue: Unnatürliche Wortstellung und Formulierung bei κατὰ πόλιν
    rationale: „aus einer Stadt nach der anderen Menschen“ ist im Deutschen schwer lesbar. „Menschen aus Stadt um Stadt“ gibt die Verteilung über verschiedene Städte hinweg natürlich wieder.
  - severity: low
    issue: „durch ein Gleichnis“ ist als Haupttext weniger idiomatisch
    rationale: Die instrumentale Deutung von διὰ παραβολῆς ist möglich, aber im Deutschen bezeichnet „in einem Gleichnis“ die Redeform natürlicher. Die Alternative „durch ein Gleichnis“ kann in der Fußnote stehen.
  revised_text: 'Als nun eine große Menschenmenge zusammenkam und Menschen aus Stadt um Stadt zu ihm kamen, sprach er in einem Gleichnis[a]:'
