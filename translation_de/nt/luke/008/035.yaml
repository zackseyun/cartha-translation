id: LUK.8.35
reference: Luke 8:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: de
  text: Da gingen die Leute hinaus, um zu sehen, was geschehen war. Sie kamen zu Jesus und fanden den Mann, aus dem die Dämonen ausgefahren waren[a]. Er saß bekleidet und bei klarem Verstand[b] zu Jesu Füßen. Da fürchteten sie sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier ein Verb im Plural („die Dämonen waren ausgefahren“). Im gedruckten griechischen Text steht bei dem pluralischen Subjekt „die Dämonen“ ein Verb im Singular; der Sinn bleibt gleich.
    reason: textual_variant
  - marker: b
    text: 'Oder: „besonnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: gingen die Leute hinaus
  rationale: Das Verb bezeichnet die Bewegung der aus dem Zusammenhang bekannten Menschen aus dem Ort hinaus. Das im Griechischen nur enthaltene Subjekt wird im Deutschen zur Klarheit als „die Leute“ ausgedrückt.
- source_word: τὸ γεγονός
  choice: was geschehen war
  rationale: Das substantivierte Perfektpartizip bezeichnet das bereits eingetretene Geschehen; das deutsche Plusquamperfekt bildet die zeitliche Abfolge natürlich ab.
- source_word: τὸν ἄνθρωπον
  choice: den Mann
  rationale: Der bestimmte männliche Mensch aus dem vorausgehenden Zusammenhang ist gemeint.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: aus dem die Dämonen ausgefahren waren
  rationale: „Ausfahren“ gibt den Vorgang der Dämonenaustreibung in natürlichem biblischem Deutsch wieder; das Plusquamperfekt ordnet ihn vor dem Auffinden des Mannes ein.
- source_word: ἱματισμένον
  choice: bekleidet
  rationale: Das Partizip beschreibt seinen wiederhergestellten Zustand und bewahrt den Gegensatz zu seiner vorherigen Nacktheit.
- source_word: σωφρονοῦντα
  choice: bei klarem Verstand
  rationale: Die Wendung bezeichnet vernünftiges, besonnenes Denken und Selbstbeherrschung, ohne eine moderne klinische Diagnose einzutragen.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: zu Jesu Füßen
  rationale: Die geläufige deutsche Wendung gibt die räumliche Lage wieder und lässt einen möglichen Anklang an Jüngerschaft oder Unterordnung unausgedeutet.
- source_word: ἐφοβήθησαν
  choice: fürchteten sie sich
  rationale: Die Form bezeichnet ihre Furcht als Reaktion auf den Anblick; die traditionelle, weiterhin natürliche Wendung ist semantisch genau.
theological_decisions:
- issue: Wiedergabe von δαιμόνια im Zusammenhang einer Austreibung
  choice: Dämonen
  alternative: böse Geister
  rationale: „Dämonen“ ist die direkte Entsprechung und bewahrt die personale, übernatürliche Darstellung des Textes, ohne sie psychologisch umzudeuten.
- issue: Bedeutungsumfang von σωφρονοῦντα nach der Austreibung
  choice: bei klarem Verstand
  alternative: besonnen; geistig gesund
  rationale: Die Formulierung bringt die wiederhergestellte Vernunft und Selbstbeherrschung zum Ausdruck, ohne den Begriff auf eine moderne psychiatrische Kategorie festzulegen.
- issue: Singularisches Verb bei pluralischem Subjekt in ἐξῆλθεν
  choice: grammatisch regulärer deutscher Plural „die Dämonen … ausgefahren waren“
  alternative: wörtliche Nachbildung der Numerusabweichung
  rationale: Die auffällige griechische Kongruenz wird in einer Fußnote dokumentiert; eine ungrammatische deutsche Nachbildung würde den Sinn verdunkeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode ist zur besseren Verständlichkeit in drei Sätze gegliedert. „Zu Jesu Füßen“ bewahrt die vertraute, natürliche Ausdrucksweise; „bei klarem Verstand“ ist allgemeinverständlich und vermeidet klinische Festlegungen.
