base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: de
  text: 'Doch Jesus hörte das und antwortete ihm: „Hab keine Angst; glaube nur[a], und sie wird gerettet werden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrau nur.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie wird geheilt werden“ oder „sie wird wieder gesund werden“. Das griechische Verb kann retten, heil machen oder heilen bedeuten und bezeichnet hier ihre Wiederherstellung angesichts des Todes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: hörte es
  rationale: Das Aoristpartizip bezeichnet eine vorausgehende Wahrnehmung. Das Pronomen „es“ gibt den im Zusammenhang vorausgesetzten Inhalt natürlich wieder.
- source_word: ἀπεκρίθη αὐτῷ
  choice: antwortete ihm
  rationale: Direkte und idiomatische Wiedergabe von ἀποκρίνομαι mit dem Dativobjekt.
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Natürliches modernes Deutsch für das Verbot; es bewahrt den Ernst des Zuspruchs, ohne unnötig altertümlich zu klingen.
- source_word: μόνον
  choice: nur
  rationale: „Nur“ erhält die einschränkende und ausschließende Funktion des Adverbs.
- source_word: πίστευσον
  choice: glaube
  rationale: Direkte Wiedergabe des Aoristimperativs von πιστεύω. Eine Fußnote bewahrt die relationale Nuance des Vertrauens.
- source_word: σωθήσεται
  choice: sie wird gerettet werden
  rationale: Die Formulierung bewahrt die Bedeutungsbreite von σῴζω und beschränkt sie nicht stillschweigend auf körperliche Heilung; das feminine Subjekt ergibt sich aus dem Kontext.
theological_decisions:
- issue: Wiedergabe von πιστεύω im Befehl Jesu
  choice: glaube nur
  alternative: vertrau nur
  rationale: „Glaube“ entspricht dem griechischen Verb unmittelbar und bewahrt die sprachliche Verbindung zum Glaubenswortfeld. „Vertrau“ verdeutlicht die personale Dimension und wird deshalb als echte Alternative in der Fußnote genannt.
- issue: Wiedergabe von σωθήσεται im Zusammenhang mit Krankheit und Tod
  choice: sie wird gerettet werden
  alternative: sie wird geheilt werden / sie wird wieder gesund werden
  rationale: „Gerettet werden“ erhält die weitere Bedeutungsspanne des Verbs zwischen Rettung, Heilung und Wiederherstellung. Die kontextuell naheliegenden engeren Wiedergaben werden in der Fußnote bewahrt, ohne die Spannung des Ausdrucks aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Hab keine Angst“ ist natürlicher als das heute gehoben oder altertümlich wirkende „Fürchte dich nicht“. Die Satzstellung mit „Doch Jesus“ bewahrt den kontrastierenden Erzählanschluss von δέ.
