  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: de
  text: Seine Jünger fragten ihn, was dieses Gleichnis bedeute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »was dieses Gleichnis sei«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: fragten
  rationale: Der Imperfekt bezeichnet eine vergangene, möglicherweise andauernde oder wiederholte Nachfrage; im natürlichen Deutschen gibt das Präteritum »fragten« dies im Kontext angemessen wieder.
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ ist hier ein schwaches, fortführendes Bindewort. Ein zusätzliches »Da«, »Dann« oder »Aber« wäre im modernen deutschen Erzählfluss nicht nötig und könnte zeitliche Folge oder Gegensatz überbetonen.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Dies ist die idiomatische und im Evangelienkontext etablierte Wiedergabe der possessiven Wortgruppe.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: was dieses Gleichnis bedeute
  rationale: Die indirekte Frage zielt im Kontext auf die Bedeutung des Gleichnisses. Der deutsche Konjunktiv »bedeute« gibt zugleich die Abhängigkeit vom Verb des Fragens natürlich wieder.
- source_word: παραβολή
  choice: Gleichnis
  rationale: »Gleichnis« ist die übliche und kontextuell passende deutsche Bezeichnung für παραβολή.
- source_word: εἴη
  choice: bedeute
  rationale: Der Optativ steht in einer indirekten Frage nach einem Vergangenheitstempus. Der deutsche Konjunktiv I bildet die berichtete Frage idiomatisch ab; »bedeute« verdeutlicht dabei die im Kontext erfragte Aussage des Gleichnisses.
