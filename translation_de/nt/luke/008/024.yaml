revisions:
- from: 'Da traten sie zu ihm und weckten ihn mit den Worten: »Meister, Meister, wir kommen um!« Er aber wachte auf, wies den Wind und das Wogen des Wassers[a] zurecht; da legten sie sich, und es trat Stille ein.'
  to: 'Da traten sie zu ihm und weckten ihn mit den Worten: »Meister, Meister, wir kommen um!« Er aber wachte auf, wies den Wind und das Wogen des Wassers[a] zurecht; Wind und Wogen legten sich, und es trat Ruhe ein.'
  rationale: Die Revision beschränkt sich auf die Schlussfolge. »Ruhe« gibt γαλήνη im Sturmstillungszusammenhang genauer wieder als »Stille«. Die ausdrückliche Nennung von »Wind und Wogen« erhält und verdeutlicht den griechischen Plural von ἐπαύσαντο. Fußnotenanker und lexikalische Alternative bleiben unverändert erhalten.
