id: LUK.8.24
reference: Luke 8:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: de
  text: 'Da traten sie zu ihm und weckten ihn mit den Worten: »Meister, Meister, wir kommen um!« Er aber wachte auf, wies den Wind und das Wogen des Wassers[a] zurecht; Wind und Wogen legten sich, und es trat Ruhe ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die aufgewühlten Wellen«.'
    reason: Lexikalische Alternative für κλύδων τοῦ ὕδατος; der Ausdruck kann das Wogen beziehungsweise die brandenden Wellen des Wassers bezeichnen.
lexical_decisions:
- source_word: προσελθόντες
  choice: Da traten sie zu ihm
  rationale: Gibt die auf Jesus gerichtete Bewegung des Aoristpartizips natürlich wieder und verbindet sie als vorausgehende Begleithandlung mit dem Wecken.
- source_word: διήγειραν
  choice: weckten ihn
  rationale: Das transitive Verb bezeichnet hier, dass die Jünger Jesus aus dem Schlaf wecken.
- source_word: Ἐπιστάτα
  choice: Meister
  rationale: Bewahrt die für Lukas charakteristische respektvolle Anrede, die Jesu Autorität anerkennt, ohne sie auf seine Lehrtätigkeit zu beschränken.
- source_word: ἀπολλύμεθα
  choice: wir kommen um
  rationale: Die idiomatische deutsche Wendung erhält den präsentischen Verlauf und die unmittelbare Todesgefahr.
- source_word: διεγερθεὶς
  choice: wachte auf
  rationale: Gibt das Aoristpartizip in natürlichem Deutsch wieder, ohne näher festzulegen, ob der Schwerpunkt auf eigenem Erwachen oder dem Gewecktwerden liegt.
- source_word: ἐπετίμησεν
  choice: wies ... zurecht
  rationale: Bewahrt den starken, autoritativen Charakter des Verbs und lässt die ungewöhnliche Anwendung auf Naturgewalten stehen.
- source_word: ἀνέμῳ
  choice: den Wind
  rationale: Entspricht dem schlichten lexikalischen Sinn, ohne den Wind ausdrücklich als Sturmwind auszudeuten.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: das Wogen des Wassers
  rationale: Gibt κλύδων als heftige Bewegung beziehungsweise Wellengang wieder und bewahrt mit „des Wassers“ die Genitivverbindung.
- source_word: ἐπαύσαντο
  choice: da legten sie sich
  rationale: Der Plural bezieht sich natürlich auf Wind und Wogen; „sich legen“ ist im Deutschen für beide Erscheinungen idiomatisch.
- source_word: ἐγένετο γαλήνη
  choice: es trat Stille ein
  rationale: Gibt den resultativen Übergang zu völliger Ruhe in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Anrede Jesu mit Ἐπιστάτα
  choice: Meister
  alternative: Lehrer; Gebieter
  rationale: „Meister“ vermittelt respektvolle Anerkennung von Autorität, ohne die Anrede auf Unterweisung zu verengen oder durch „Gebieter“ unnötig zu verstärken.
- issue: Jesu Handeln gegenüber Wind und Wasser mit ἐπετίμησεν
  choice: wies ... zurecht
  alternative: befahl; bedrohte
  rationale: Die Formulierung bewahrt die direkte und autoritative Einwirkung auf die Naturgewalten, ohne das im Text liegende theologische Gewicht erklärend aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „Meister, Meister“ sowie der Plural nach Wind und Wogen bleiben erhalten. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, ohne die Abfolge der Handlungen oder die theologische Spannung zu verändern.
