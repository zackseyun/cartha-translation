  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: de
  text: Und siehe, ein Mann namens Jairus kam; er war Vorsteher der Synagoge. Er fiel Jesus zu Füßen und bat ihn inständig, in sein Haus zu kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, erzählerischen Ausruf des griechischen Textes in knapper, würdiger Form.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: Vorsteher der Synagoge
  rationale: Bezeichnet natürlich und sachgerecht einen Leiter beziehungsweise Amtsträger der örtlichen Synagoge, ohne seine genaue Funktion über den Ausgangstext hinaus festzulegen.
- source_word: παρεκάλει
  choice: bat ihn inständig
  rationale: Das Imperfekt und das Verb drücken hier ein nachdrückliches Bitten aus; „inständig“ gibt diese Intensität idiomatisch wieder.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: in sein Haus zu kommen
  rationale: Eine natürliche deutsche Wiedergabe der Bitte, die Bewegungsrichtung und das Ziel erhält.
theological_decisions: []
translation_notes:
