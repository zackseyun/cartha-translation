source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: de
  text: Da kamen seine Mutter und seine Brüder[b] zu ihm, konnten aber wegen der Menschenmenge nicht zu ihm gelangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht mit ihm zusammentreffen“ oder „nicht an ihn herankommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Brüder“. Das genaue verwandtschaftliche Verhältnis wird im griechischen Text nicht näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Da kamen ... zu ihm
  rationale: Die Formulierung gibt den erzählerischen Übergang und die Bewegung auf Jesus zu in natürlichem, modernem Deutsch wieder. Der griechische Singular des Verbs steht bei dem nachgestellten zusammengesetzten Subjekt; im Deutschen ist der Plural erforderlich.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Mutter und seine Brüder
  rationale: Die Verwandtschaftsbezeichnungen werden direkt wiedergegeben. ἀδελφοί ist maskuliner Plural und bezeichnet im Wortlaut Brüder; das genaue verwandtschaftliche Verhältnis wird nicht näher bestimmt.
- source_word: οὐκ ἠδύναντο συντυχεῖν αὐτῷ
  choice: konnten ... nicht zu ihm gelangen
  rationale: Im Zusammenhang mit der hindernden Menschenmenge bezeichnet die Wendung, dass sie nicht bis zu Jesus vordringen beziehungsweise mit ihm zusammentreffen konnten. „Zu ihm gelangen“ bewahrt diesen praktischen Sinn.
- source_word: διὰ τὸν ὄχλον
  choice: wegen der Menschenmenge
  rationale: διά mit Akkusativ nennt hier den Grund. „Menschenmenge“ macht deutlicher als das mögliche „Menge“, dass eine große Zahl von Menschen den Zugang versperrte.
theological_decisions:
- issue: Verwandtschaftsverhältnis der ἀδελφοί Jesu
  choice: „seine Brüder“
  alternative: „seine Verwandten“ oder „seine Angehörigen“
  rationale: Der griechische Text sagt ἀδελφοί. Die Übersetzung entscheidet nicht, ob damit leibliche Brüder, Stiefbrüder oder anders verwandte Männer gemeint sind, und trägt keine spätere Lehrposition in den Vers ein.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Da kamen“ sorgt für einen flüssigen erzählerischen Anschluss; „Menschenmenge“ und „zu ihm gelangen“ sind idiomatisch und bilden die konkrete Situation klar ab.
