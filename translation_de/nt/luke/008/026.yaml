source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: de
  text: Und sie fuhren mit dem Boot in das Gebiet der Gerasener[a], das Galiläa gegenüberliegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und die parallelen Evangelienabschnitte haben hier „Gadarener“ oder „Gergesener“.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: fuhren mit dem Boot
  rationale: Das Verb bezeichnet die Fahrt auf dem Wasser zu einem Ziel beziehungsweise die Ankunft auf dem Wasserweg. „Fuhren mit dem Boot“ gibt dies im modernen Deutschen natürlich wieder; eine eigene Richtungsangabe für κατά ist im Zusammenhang nicht erforderlich.
- source_word: χώραν
  choice: Gebiet
  rationale: χώρα bezeichnet hier eine Gegend oder ein Territorium, nicht einen modernen Staat. „Gebiet“ ist präzise und idiomatisch.
- source_word: Γερασηνῶν
  choice: Gerasener
  rationale: Die ethnische beziehungsweise örtliche Bezeichnung wird in der im Deutschen üblichen Form als „Gerasener“ wiedergegeben.
- source_word: ἥτις
  choice: das
  rationale: Das Relativpronomen bezieht sich auf „Gebiet“. Die leicht beschreibende Nuance von ἥτις wird durch einen natürlichen deutschen Relativsatz ausreichend ausgedrückt.
- source_word: ἀντιπέρα
  choice: gegenüberliegt
  rationale: Das Wort bezeichnet die Lage gegenüber beziehungsweise jenseits auf der anderen Seite. „Galiläa gegenüberliegt“ ist knapp, räumlich klar und natürlich.
- source_word: Γαλιλαίας
  choice: Galiläa
  rationale: Dies ist die gebräuchliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Textliche und geografische Varianten des Ortsnamens in der synoptischen Überlieferung
  choice: Gerasener
  alternative: Gadarener oder Gergesener
  rationale: Der Haupttext folgt der Lesart Γερασηνῶν des SBLGNT. Andere handschriftliche Lesarten und die Parallelüberlieferung werden in einer Fußnote transparent bewahrt, ohne die Texte zu harmonisieren.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Formulierung vermeidet das im Deutschen missverständliche wörtliche „hinabsegeln“ und macht den Wasserweg ausdrücklich, ohne eine Landung in den Text hineinzulesen.
