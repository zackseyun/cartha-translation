  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: de
  text: 'Denn Johannes der Täufer ist gekommen und isst weder Brot noch trinkt er Wein, und ihr sagt: »Er hat einen Dämon.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: ist gekommen
  rationale: Das deutsche Perfekt bewahrt den vollendeten Eintritt mit Gegenwartsbezug und klingt im modernen Deutsch natürlich.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet wie im Griechischen eine Begründung beziehungsweise Erläuterung des vorangehenden Gedankens ein.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Johannes der Täufer
  rationale: Die etablierte deutsche Bezeichnung ist verständlich und gibt die tätigkeitsbezogene Bedeutung von βαπτιστής angemessen wieder.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: ohne Brot zu essen oder Wein zu trinken
  rationale: Die Formulierung bildet die begleitenden Partizipien natürlich ab und bewahrt ἄρτον konkret als »Brot«, ohne es zu »Nahrung« zu verallgemeinern.
- source_word: λέγετε
  choice: ihr sagt
  rationale: Das Präsens bezeichnet die charakteristische Reaktion der Angeredeten und wird im Deutschen idiomatisch mit dem einfachen Präsens wiedergegeben.
- source_word: Δαιμόνιον ἔχει
  choice: Er hat einen Dämon
  rationale: Die direkte Wiedergabe bewahrt Wortlaut und rhetorische Schärfe der Anschuldigung, ohne sie interpretierend zu »Er ist besessen« umzuformen.
theological_decisions:
- issue: Wiedergabe von δαιμόνιον in der Anschuldigung gegen Johannes
  choice: Dämon
  alternative: unreiner Geist
  rationale: δαιμόνιον bezeichnet hier einen Dämon; »unreiner Geist« wäre eine verwandte, aber im griechischen Text nicht verwendete Bezeichnung und würde die Terminologie harmonisieren.
- issue: Art der behaupteten dämonischen Beeinflussung
  choice: Er hat einen Dämon
  alternative: Er ist von einem Dämon besessen
  rationale: Der Text formuliert wörtlich einen Besitz- beziehungsweise Zuordnungsausdruck. Die Übersetzung lässt dessen genaue Tragweite offen und legt nicht ausdrücklich den stärker deutenden Begriff »besessen« fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der griechischen Begründungsstruktur, ist aber flüssig. Die konkrete asketische Beschreibung und die direkte Anschuldigung werden ohne konfessionelle oder zusätzliche interpretierende Begriffe bewahrt.
