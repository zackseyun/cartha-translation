    issue: Die Formulierung »ist gekommen, ohne Brot zu essen oder Wein zu trinken« bindet das Nichtessen und Nichttrinken potenziell an den Vorgang des Kommens.
    rationale: Die griechischen Partizipien ἐσθίων und πίνων stehen im Präsens und beschreiben Johannes’ kennzeichnende Praxis. Eine finite Wiedergabe bewahrt diese Funktion im Deutschen eindeutiger.
