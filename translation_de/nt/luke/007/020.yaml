source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: de
  text: 'Als die Männer zu ihm kamen, sagten sie: „Johannes der Täufer hat uns zu dir geschickt und lässt dich fragen: ‚Bist du der Kommende[a], oder sollen wir einen anderen erwarten?‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der, der kommen soll“.'
    reason: Die griechische Wendung kann sowohl titelartig als auch beschreibend wiedergegeben werden.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Als die Männer zu ihm kamen
  rationale: Das aoristische Partizip bezeichnet den begleitenden zeitlichen Umstand ihres Eintreffens; ein deutscher Temporalsatz gibt die Erzählfolge natürlich wieder.
- source_word: οἱ ἄνδρες
  choice: die Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich die männlichen Boten; die knappe Wiedergabe vermeidet eine nicht im Text stehende Erweiterung.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Johannes der Täufer
  rationale: Dies ist die geläufige und sachlich zutreffende deutsche Bezeichnung.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: hat uns zu dir geschickt und lässt fragen
  rationale: Der Aorist wird wegen der fortwirkenden Relevanz des Auftrags idiomatisch mit dem Perfekt wiedergegeben. λέγων führt hier den als Frage formulierten Auftrag ein; „lässt fragen“ ist im Deutschen natürlicher als das formale „indem er sagte“.
- source_word: ὁ ἐρχόμενος
  choice: der Kommende
  rationale: Die substantivierte Partizipialform wird knapp und formal nah wiedergegeben. Sie bewahrt den möglichen Charakter einer erwarteten heilsgeschichtlichen Gestalt, ohne diese ausdrücklich zu identifizieren.
- source_word: ἄλλον προσδοκῶμεν
  choice: sollen wir einen anderen erwarten
  rationale: „Erwarten“ deckt den Sinn von προσδοκάω in diesem Kontext gut ab; der Konjunktiv in der Entscheidungsfrage wird natürlich mit „sollen wir“ wiedergegeben.
theological_decisions:
- issue: Messianische beziehungsweise eschatologische Tragweite von ὁ ἐρχόμενος
  choice: der Kommende
  alternative: der, der kommen soll
  rationale: „Der Kommende“ erhält die mögliche Titelfunktion und den Anklang an eine erwartete Gestalt, ohne das Gemeinte durch die ausdrückliche Bezeichnung „Messias“ festzulegen. Die alternative Formulierung ist idiomatischer, schwächt jedoch den titelartigen Charakter etwas ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die indirekte Auftragsformel „lässt fragen“ ist idiomatisch; die eigentliche Frage bleibt als direktes Zitat erhalten. „Der Kommende“ wird großgeschrieben, da die substantivierte Form im Deutschen ein Nomen ist, nicht um eine weitergehende dogmatische Identifikation vorzugeben.
