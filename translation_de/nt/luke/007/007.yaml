  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: de
  text: Darum hielt ich mich nicht einmal für würdig, zu dir zu kommen. Doch sprich nur ein Wort, dann soll mein Diener[a] geheilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Junge« oder »mein Kind«. Das griechische Wort kann je nach Zusammenhang ein Kind, einen jungen Menschen oder einen Diener bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Aussage und stellt den logischen Zusammenhang in natürlichem Deutsch her.
- source_word: οὐδὲ
  choice: auch nicht
  rationale: 'Verstärkt zusammen mit dem Verb die Verneinung: Der Hauptmann hielt sich nicht einmal selbst für würdig, zu Jesus zu kommen.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: hielt ich mich ... für würdig
  rationale: Gibt ἀξιόω und das reflexive Objekt präzise und idiomatisch wieder.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: zu dir zu kommen
  rationale: Natürliche Wiedergabe des persönlichen Kommens zu Jesus.
- source_word: ἀλλὰ
  choice: Doch
  rationale: Leitet den kontrastierenden Wunsch des Hauptmanns klar und würdevoll ein.
- source_word: εἰπὲ λόγῳ
  choice: sprich nur ein Wort
  rationale: Gibt den instrumentalen beziehungsweise modalen Dativ idiomatisch wieder und betont, dass Jesu autoritatives Sprechen genügt. Das ergänzte „nur“ macht diesen Sinn im Deutschen natürlich deutlich, ohne den Aussagegehalt zu verändern.
- source_word: ἰαθήτω
  choice: dann soll ... geheilt werden
  rationale: Bewahrt den passiven Imperativ der dritten Person und vermeidet die Umdeutung in eine bloße Zukunftsaussage.
- source_word: ὁ παῖς μου
  choice: mein Diener
  rationale: παῖς kann Kind, Junge oder Diener bezeichnen. Im Zusammenhang eines Hauptmanns und seines Hausstandes passt „Diener“ am besten; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von παῖς in der Erzählung vom Hauptmann
  choice: mein Diener
  alternative: mein Junge; mein Kind
  rationale: Der soziale Zusammenhang und Lukas 7,2 sprechen für einen Diener. Da παῖς zugleich Alter, Zuneigung oder ein familiäres Verhältnis ausdrücken kann, werden die Alternativen nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Aussageweise von ἰαθήτω
  choice: dann soll ... geheilt werden
  alternative: dann wird ... geheilt werden
  rationale: Die griechische Form ist ein passiver Imperativ, keine Zukunftsform. Die Übersetzung erhält diese grammatische Spannung, statt sie als sichere Vorhersage zu glätten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung bleibt natürlich; „sprich nur ein Wort“ bringt die knappe Zuversicht in die Vollmacht Jesu idiomatisch zum Ausdruck. Die Anredepronomen werden gemäß moderner deutscher Schreibweise kleingeschrieben.
