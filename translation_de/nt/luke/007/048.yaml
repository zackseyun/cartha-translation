  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: de
  text: 'Dann sagte er zu ihr: »Deine Sünden sind dir vergeben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, unter stärkerer Wiedergabe des vollzogenen Vorgangs: »Deine Sünden sind dir vergeben worden.« Das griechische Perfekt Passiv kann die abgeschlossene Handlung mit ihrem fortdauernden Ergebnis betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sagte
  rationale: Der Aorist von λέγω wird in diesem direkten Ausspruch natürlich mit »sagte« wiedergegeben.
- source_word: δὲ
  choice: Dann
  rationale: δέ ist hier ein schwaches Bindewort, das die Erzählung fortführt; »Dann« gibt den zeitlich-narrativen Übergang natürlich wieder, ohne einen Gegensatz zu behaupten.
- source_word: αὐτῇ
  choice: zu ihr
  rationale: Der Dativ bezeichnet die Adressatin und wird nach »sagte« idiomatisch mit »zu ihr« ausgedrückt.
- source_word: Ἀφέωνταί
  choice: sind dir vergeben
  rationale: Das Perfekt Passiv von ἀφίημι bezeichnet eine vollzogene Vergebung mit fortdauerndem Ergebnis. Die deutsche Wendung »sind dir vergeben« ist eine natürliche, gewichtige Zusage und lässt sowohl den vollzogenen Akt als auch den gegenwärtigen Zustand erkennen.
- source_word: σου
  choice: dir
  rationale: Obwohl σου formal ein Genitiv ist, verlangt die idiomatische deutsche Verbindung »jemandem die Sünden vergeben« den Dativ »dir«; der Personenbezug bleibt vollständig erhalten.
- source_word: αἱ ἁμαρτίαι
  choice: Deine Sünden
  rationale: ἁμαρτίαι bezeichnet hier moralische Verfehlungen vor Gott. Im Deutschen macht »deine« die durch σου ausgedrückte Zugehörigkeit natürlich deutlich; der griechische Artikel wird dabei nicht eigens wiedergegeben.
theological_decisions:
- issue: Aussagekraft des Perfekt Passiv Ἀφέωνταί in der Vergebungszusage
  choice: »Deine Sünden sind dir vergeben.«
  alternative: »Deine Sünden sind dir vergeben worden.«
  rationale: Das griechische Perfekt kann den abgeschlossenen Vorgang und dessen bleibendes Ergebnis hervorheben. »Sind dir vergeben« ist im Deutschen eine idiomatische Zustandsaussage, die den vorausliegenden Vollzug einschließt, ohne den Zeitpunkt oder den Handelnden ausdrücklich festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die traditionelle, aber weiterhin natürliche Formulierung »Sünden sind dir vergeben« bewahrt die Prägnanz und theologische Spannung der direkten Zusage.
