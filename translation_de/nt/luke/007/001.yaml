source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: de
  text: Nachdem er alle seine Worte vor dem Volk zu Ende gesprochen hatte, ging er nach Kafarnaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Nachdem
  rationale: Die Konjunktion leitet hier einen temporalen Nebensatz ein; „nachdem“ bildet die zeitliche Abfolge zum folgenden Aorist natürlich und genau ab.
- source_word: ἐπλήρωσεν
  choice: beendet hatte
  rationale: πληρόω bezeichnet in Verbindung mit den Worten beziehungsweise der Rede das Vollenden des Sprechens. Das Plusquamperfekt macht im Deutschen die Vorzeitigkeit deutlich.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: seine ganze Rede
  rationale: Wörtlich steht „alle seine Worte“. „Seine ganze Rede“ gibt den zusammenhängenden Rückbezug auf Jesu vorhergehende Unterweisung in natürlichem Deutsch wieder, ohne „diese“ aus dem Kontext einzufügen.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: vor den Ohren des Volkes
  rationale: Die bewusst körperhafte Wendung bewahrt das Bild des griechischen Ausdrucks und betont, dass das Volk die Rede hörte.
- source_word: λαοῦ
  choice: des Volkes
  rationale: „Volk“ entspricht dem kollektiven λαός und vermeidet die engere Festlegung auf eine bloße Menschenmenge.
- source_word: εἰσῆλθεν εἰς
  choice: ging … hinein
  rationale: Die Formulierung gibt sowohl die Bewegung als auch das Eintreten in den Ort idiomatisch wieder.
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Dies ist die im modernen deutschen Bibelgebrauch übliche Form des Ortsnamens.
