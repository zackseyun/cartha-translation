revisions:
- from: Nachdem Jesus seine ganze Rede vor den Ohren des Volkes beendet hatte,[a] ging er nach Kafarnaum hinein.
  to: Nachdem er alle seine Worte vor dem Volk zu Ende gesprochen hatte, ging er nach Kafarnaum.
  rationale: Die Fassung bewahrt die zeitliche Vorordnung von ἐπειδή und ἐπλήρωσεν, die Pluralität von „alle seine Worte“ sowie den öffentlichen Hörkontext von εἰς τὰς ἀκοὰς τοῦ λαοῦ in natürlichem modernem Deutsch. Die unnötige Fußnote wird entfernt; der Vers enthält keine hier zu dokumentierende Mehrdeutigkeit.
