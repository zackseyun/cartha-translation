  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: de
  text: Du hast mir keinen Kuss gegeben[a]; sie aber hat, seit ich hereingekommen bin, nicht aufgehört, meine Füße zu küssen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Begrüßungskuss“. Ein Kuss war ein üblicher Ausdruck der Begrüßung und Gastfreundschaft.'
    reason: cultural_note
  - marker: b
    text: 'Das griechische Verb kann ein inniges oder wiederholtes Küssen bezeichnen: „meine Füße immer wieder zu küssen“ oder „meine Füße mit Küssen zu bedecken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: Kuss
  rationale: Das Substantiv bezeichnet hier einen Kuss, im Zusammenhang wahrscheinlich den üblichen Begrüßungskuss. Die schlichte Wiedergabe bewahrt den Wortlaut; die kulturelle Bedeutung wird in einer Fußnote erläutert.
- source_word: μοι
  choice: mir
  rationale: Der Dativ bezeichnet den Empfänger. „Du hast mir keinen Kuss gegeben“ ist im Deutschen natürlich und entspricht der griechischen Konstruktion.
- source_word: ἔδωκας
  choice: gegeben
  rationale: δίδωμι bedeutet grundsätzlich „geben“. Auch die deutsche Verbindung „einen Kuss geben“ ist idiomatisch und muss nicht umschrieben werden.
- source_word: αὕτη δὲ
  choice: sie aber
  rationale: Die Formulierung stellt die Frau betont dem angesprochenen Gastgeber gegenüber. „Sie aber“ erhält diesen Kontrast knapp und würdig.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: seit ich hereingekommen bin
  rationale: Die Wendung ist zeitlich zu verstehen, wohl mit einer ausgelassenen Zeitangabe wie „Stunde/Zeit“. Das Perfekt ist im modernen Deutsch für ein vergangenes Eintreten mit Bezug zur gegenwärtigen Situation natürlich.
- source_word: οὐ διέλιπεν
  choice: hat nicht aufgehört
  rationale: διαλείπω bezeichnet das Aufhören oder Ablassen von einer Tätigkeit. Das deutsche Perfekt bringt zum Ausdruck, dass die Handlung seit dem Eintritt bis zum Sprechzeitpunkt andauert.
- source_word: καταφιλοῦσά
  choice: zu küssen
  rationale: καταφιλέω kann ein inniges oder wiederholtes Küssen bezeichnen. Im Haupttext bleibt „küssen“ natürlich; die verstärkende Nuance wird in einer Fußnote genannt.
- source_word: μου τοὺς πόδας
  choice: meine Füße
  rationale: Die ausdrücklich pluralische Form des griechischen Textes wird direkt und natürlich wiedergegeben.
theological_decisions:
- issue: Kulturelle Bedeutung des Kusses als Gastfreundschaft
  choice: Die Handlung im Haupttext schlicht als „Kuss“ wiedergeben.
  alternative: „Begrüßungskuss“ oder „Kuss zur Begrüßung“ in den Haupttext aufnehmen.
  rationale: Der Kontrast betrifft Simons unterlassene Gastfreundschaft und die Hingabe der Frau. Da der griechische Text die kulturelle Erklärung nicht ausdrücklich formuliert, bleibt sie in der Fußnote, ohne die Übersetzung interpretierend zu erweitern.
- issue: Intensität von καταφιλέω
  choice: Im Haupttext „küssen“, mit Hinweis auf inniges oder wiederholtes Küssen in der Fußnote.
  alternative: „meine Füße immer wieder zu küssen“ oder „meine Füße mit Küssen zu bedecken“.
  rationale: Das Verb kann eine verstärkte oder wiederholte Handlung ausdrücken, legt aber nicht zwingend nur eine einzige deutsche Entfaltung fest. Die knappe Übersetzung bewahrt diese Offenheit; die Fußnote macht die mögliche Nuance sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Satzbau erhält den deutlichen Gegensatz zwischen dem Gastgeber und der Frau, ohne unnötig altertümliche Wendungen wie „hörte nicht auf“ oder interpretierende Zusätze im Haupttext.
