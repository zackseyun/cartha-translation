id: LUK.7.43
reference: Luke 7:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: de
  text: 'Simon antwortete: »Ich nehme an[a], der, dem er mehr erlassen hat[b].« Da sagte er zu ihm: »Du hast richtig geurteilt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Ich vermute«; das griechische Wort drückt hier eine vorsichtige Schlussfolgerung aus.
    reason: lexical_alternative
  - marker: b
    text: Oder »dem er die größere Schuld erlassen hat«; das griechische Verb kann einen aus Gnade gewährten Schuldenerlass beziehungsweise Vergebung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: antwortete
  rationale: Die griechische Verbindung aus Partizip und finitem Verb leitet idiomatisch eine Antwort ein; das einfache deutsche »antwortete« gibt sie natürlich und vollständig wieder.
- source_word: Ὑπολαμβάνω
  choice: Ich nehme an
  rationale: Die Formulierung bezeichnet hier eine vorsichtige Schlussfolgerung und bewahrt Simons zurückhaltenden Ton.
- source_word: ᾧ τὸ πλεῖον
  choice: der, dem er mehr
  rationale: Die indirekte Beziehung des Dativs ᾧ bleibt durch »dem« erhalten; τὸ πλεῖον wird im Deutschen idiomatisch als »mehr« wiedergegeben.
- source_word: ἐχαρίσατο
  choice: erlassen hat
  rationale: Im unmittelbaren Zusammenhang mit der Schuldnererzählung bezeichnet χαρίζομαι den unentgeltlichen Erlass einer Schuld. »Erlassen« ist im Deutschen dafür natürlich und lässt zugleich den gnädigen Charakter der Handlung erkennen, ohne ihn auszudeuten.
- source_word: Ὀρθῶς
  choice: richtig
  rationale: ὀρθῶς bestätigt die Richtigkeit von Simons Einschätzung; »richtig« verbindet sich im modernen Deutsch natürlich mit »urteilen«.
- source_word: ἔκρινας
  choice: du hast … geurteilt
  rationale: Das Perfekt bezeichnet idiomatisch Simons soeben abgeschlossenes und weiterhin relevantes Urteil und bewahrt die Bedeutung von κρίνω.
theological_decisions:
- issue: Bedeutung des Schuldenerlasses im Gleichnis
  choice: ἐχαρίσατο mit »erlassen« wiedergeben
  alternative: »vergeben« oder »gnädig geschenkt«
  rationale: Der unmittelbare Kontext handelt von Geldschulden, weshalb »erlassen« das Bild präzise wiedergibt. Zugleich bleibt die Verbindung zum Thema der Sündenvergebung im weiteren Abschnitt erkennbar, ohne Schuld und Sünde im Wortlaut dieses Verses ausdrücklich gleichzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. »Ich nehme an« bewahrt Simons zögernde Antwort; »erlassen« ist im Schuldzusammenhang klarer und natürlicher als das hier missverständliche »mehr vergeben«.
