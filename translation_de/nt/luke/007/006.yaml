  source_fidelity: 'Der Entwurf gibt den griechischen Text vollständig und sachgerecht wieder: Jesu Begleitung, die zeitliche Situierung nahe dem Haus, das Senden von Freunden durch den Hauptmann sowie die übermittelte direkte Anrede bleiben erhalten. »unter mein Dach kommst« bewahrt das konkrete Bild von ὑπὸ τὴν στέγην μου. Die Umschreibung »ließ ihm sagen« macht die durch Boten vermittelte Rede im Deutschen klar, ohne zusätzlichen Inhalt einzutragen.'
