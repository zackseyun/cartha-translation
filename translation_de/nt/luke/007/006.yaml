id: LUK.7.6
reference: Luke 7:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: de
  text: 'Jesus ging mit ihnen. Als er schon nicht mehr weit vom Haus entfernt war, schickte der Hauptmann Freunde zu ihm und ließ ihm sagen: »Herr[a], mach dir keine Mühe! Denn ich bin es nicht wert[b], dass du unter mein Dach kommst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Herr«. Das griechische Wort κύριε kann als respektvolle Anrede dienen und zugleich eine Anerkennung der Autorität Jesu anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort kann auch »geeignet«, »fähig« oder »hinreichend« bedeuten; hier drückt es die demütige Selbsteinschätzung des Hauptmanns aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: ging
  rationale: Das Imperfekt beschreibt Jesu Bewegung im Fortgang der Erzählung; »ging« ist im Deutschen natürlich und präzise.
- source_word: σὺν αὐτοῖς
  choice: mit ihnen
  rationale: Direkte und idiomatische Wiedergabe des Begleitverhältnisses.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: als er schon nicht mehr weit vom Haus entfernt war
  rationale: Gibt den temporalen Genitivus absolutus und die Negation »nicht weit« natürlich wieder, ohne sie lediglich zu »nahe« zu glätten.
- source_word: ἔπεμψεν φίλους ὁ ἑκατοντάρχης λέγων αὐτῷ
  choice: schickte der Hauptmann Freunde zu ihm und ließ ihm sagen
  rationale: Bewahrt, dass der Hauptmann Freunde entsendet, und macht im Deutschen klar, dass sie seine Botschaft überbringen.
- source_word: ὁ ἑκατοντάρχης
  choice: der Hauptmann
  rationale: Geläufige deutsche Bezeichnung für den römischen Zenturio im neutestamentlichen Kontext.
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt sowohl die respektvolle Anrede als auch die mögliche weitergehende Anerkennung der Autorität Jesu.
- source_word: μὴ σκύλλου
  choice: mach dir keine Mühe
  rationale: Natürliche moderne deutsche Wiedergabe der höflichen Aufforderung, sich nicht weiter zu bemühen oder Umstände zu machen.
- source_word: οὐ γὰρ ἱκανός εἰμι
  choice: denn ich bin es nicht wert
  rationale: Bringt in diesem Zusammenhang die demütige Selbsteinschätzung des Hauptmanns idiomatisch zum Ausdruck; die Grundbedeutung von Eignung oder Hinlänglichkeit bleibt in einer Fußnote sichtbar.
- source_word: ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς
  choice: dass du unter mein Dach kommst
  rationale: Erhält sowohl die Funktion des ἵνα-Satzes als auch das konkrete Bild vom Dach des Hauses.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Jesu
  choice: Herr
  alternative: mein Herr / Herr im Sinn von »mein Herr« oder »mein Gebieter«
  rationale: »Herr« lässt offen, ob die Anrede vor allem höflichen Respekt oder eine tiefere Anerkennung von Jesu Autorität ausdrückt, und zwingt dem Vers keine voll entwickelte christologische Aussage auf.
- issue: Bedeutung von ἱκανός in der Selbsteinschätzung des Hauptmanns
  choice: ich bin es nicht wert
  alternative: ich bin nicht geeignet / nicht hinreichend
  rationale: Der Kontext legt eine demütige Aussage über die eigene Unwürdigkeit nahe; die weitere Bedeutungsbreite des griechischen Adjektivs wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählverlauf, wird aber durch »ließ ihm sagen« idiomatisch geglättet. Die Bildsprache »unter mein Dach« bleibt erhalten.
