  terminology: »Hauptmann« ist im neutestamentlichen deutschen Sprachgebrauch eine etablierte Wiedergabe von ἑκατοντάρχης. »Herr« für κύριε erhält die mögliche Spannweite zwischen respektvoller Anrede und weitergehender Anerkennung. »Ich bin es nicht wert« trifft die kontextuelle Aussage von ἱκανός εἰμι; die Fußnote weist angemessen auf die lexikalische Breite hin.
