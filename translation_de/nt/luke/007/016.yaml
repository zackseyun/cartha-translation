source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: de
  text: 'Da wurden sie alle von Furcht ergriffen, und sie priesen Gott und sagten: „Ein großer Prophet ist unter uns aufgetreten[a], und Gott hat sein Volk besucht[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist unter uns erweckt worden“; die Formulierung kann hervorheben, dass Gott einen Propheten auftreten ließ.'
    reason: lexical_alternative
  - marker: b
    text: „Besucht“ ist hier biblische Sprache dafür, dass Gott sich seinem Volk fürsorglich und rettend zuwendet.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν δὲ φόβος πάντας
  choice: Da wurden sie alle von Furcht ergriffen
  rationale: Die Formulierung gibt die plötzlich überwältigende Wirkung der Furcht natürlich wieder. „Furcht“ bewahrt gegenüber „Ehrfurcht“ die stärkere Bedeutung und damit die Spannung des griechischen φόβος; „da“ verbindet den Satz flüssig mit dem erzählten Geschehen.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: sie priesen Gott
  rationale: Im Deutschen ist „Gott preisen“ die natürliche und würdige Wiedergabe der fortdauernden Reaktion. Das Imperfekt wird im Zusammenhang als anhaltender Vorgang verstanden, ohne eine schwerfällige Verlaufsform zu erzwingen.
- source_word: λέγοντες
  choice: und sagten
  rationale: Die finite Koordination ist im modernen Deutschen natürlicher als eine wörtliche Partizipialkonstruktion und führt den Inhalt ihres Gotteslobs klar ein.
- source_word: Προφήτης μέγας
  choice: Ein großer Prophet
  rationale: Direkte und idiomatische Wiedergabe der wertenden Wortgruppe.
- source_word: ἠγέρθη ἐν ἡμῖν
  choice: ist unter uns aufgetreten
  rationale: „Aufgetreten“ bezeichnet idiomatisch das Erscheinen eines Propheten in der Gemeinschaft. Die mögliche passive Nuance, dass Gott ihn hat erstehen lassen, bleibt in einer Fußnote erhalten.
- source_word: Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ
  choice: Gott hat sein Volk besucht
  rationale: „Besucht“ bewahrt die biblische Redeweise für Gottes fürsorgliches und rettendes Zuwenden, ohne sie im Haupttext auf eine einzelne Auslegung wie „geholfen“ festzulegen.
theological_decisions:
- issue: Bedeutung von φόβος als Reaktion auf das Wunder
  choice: Furcht
  alternative: Ehrfurcht
  rationale: „Furcht“ entspricht dem stärkeren Grundsinn und lässt offen, in welchem Maß Schrecken und ehrfürchtiges Staunen zusammenwirken.
- issue: Bedeutung von ἠγέρθη beim Auftreten eines Propheten
  choice: ist aufgetreten
  alternative: ist unter uns erweckt worden
  rationale: Der Haupttext verwendet eine natürliche deutsche prophetische Ausdrucksweise; die passive Form kann zugleich Gottes verborgenes Handeln andeuten und wird deshalb als Alternative dokumentiert.
- issue: Bedeutung von ἐπισκέπτομαι bei Gottes Handeln
  choice: hat sein Volk besucht
  alternative: ist seinem Volk zu Hilfe gekommen
  rationale: Die Besuchsformulierung bewahrt die heilsgeschichtliche und fürsorgliche Bedeutungsfülle, statt sie ausdrücklich auf Hilfe zu verengen.
- issue: Verhältnis der beiden ὅτι-Sätze
  choice: eine zusammenhängende Äußerung innerhalb eines Zitats
  alternative: zwei gesonderte zitierte Ausrufe
  rationale: Beide parallelen Inhaltssätze hängen von λέγοντες ab und lassen sich im Deutschen am natürlichsten als eine fortlaufende Aussage wiedergeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die finite Form „sie priesen … und sagten“ vermeidet eine unnatürliche Partizipialkonstruktion. Die Formulierungen „Furcht“ und „besucht“ erhalten die biblisch-theologische Spannung, ohne sie im Haupttext erklärend aufzulösen.
