  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: de
  text: 'Und er trat heran und berührte die Bahre[a]. Da blieben die Träger stehen, und er sagte: „Junger Mann, ich sage dir: Steh auf!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Totenbahre“ beziehungsweise „Trage“. Das griechische Wort bezeichnet hier die Bahre oder das Tragegestell eines Begräbniszuges, nicht notwendigerweise einen geschlossenen Sarg.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: trat heran
  rationale: Das Aoristpartizip von προσέρχομαι bezeichnet Jesu Herantreten vor der Haupthandlung. Die finite Wiedergabe mit „und“ ist im Deutschen natürlich und bewahrt die Abfolge.
- source_word: ἥψατο
  choice: berührte
  rationale: ἅπτομαι kann hier „berühren“ oder „anfassen“ bedeuten. „Berührte“ gibt die Handlung präzise wieder, ohne ein längeres Festhalten anzudeuten.
- source_word: σοροῦ
  choice: Bahre
  rationale: σορός bezeichnet in diesem Zusammenhang die bei einem Begräbniszug getragene Totenbahre beziehungsweise Trage und nicht zwingend einen geschlossenen Sarg. „Bahre“ ist historisch und sachlich treffend.
- source_word: οἱ δὲ βαστάζοντες
  choice: Da blieben die Träger stehen
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die die Bahre tragen. „Die Träger“ ist knapp, verständlich und nimmt den Gegenstand aus dem vorherigen Satz auf; δέ wird hier als Fortgang beziehungsweise Reaktion mit „Da“ wiedergegeben.
- source_word: ἔστησαν
  choice: blieben ... stehen
  rationale: Der Aorist von ἵστημι bezeichnet hier das Anhalten und Stehenbleiben. Die deutsche Formulierung bewahrt beide Aspekte der Szene.
- source_word: Νεανίσκε
  choice: Junger Mann
  rationale: Der Vokativ von νεανίσκος ist eine direkte Anrede an einen männlichen Jugendlichen oder jungen Erwachsenen. „Junger Mann“ ist im heutigen Standarddeutsch natürlich und genau.
- source_word: σοὶ λέγω
  choice: ich sage dir
  rationale: Das ausdrücklich gesetzte σοὶ unterstreicht die direkte persönliche Anrede. „Ich sage dir“ erhält diese Betonung und den feierlichen Ton.
- source_word: ἐγέρθητι
  choice: Steh auf!
  rationale: Der Imperativ von ἐγείρω fordert den Toten unmittelbar zum Aufstehen auf. „Steh auf!“ ist modernes, würdevolles Deutsch und lässt die in der Form mögliche Spannung zwischen aktivem Aufstehen und passivischem Auferwecktwerden im erzählten Wunderzusammenhang bestehen, ohne sie erklärend auszubauen.
theological_decisions:
- issue: Ton und grammatische Spannung des Befehls an den Toten
  choice: „Steh auf!“
  alternative: „Werde auferweckt!“ oder „Erhebe dich!“
  rationale: „Steh auf!“ gibt den unmittelbaren Befehl idiomatisch und mit angemessenem Gewicht wieder. „Werde auferweckt!“ wäre als direkte Rede im Deutschen unnatürlich und würde die passive Lesart stärker festlegen; „Erhebe dich!“ klänge unnötig altertümlich. Die Übersetzung fügt keine Erklärung über die Bedeutung des Wunders hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klare Erzählstruktur; Jesu direkte Rede bleibt feierlich, ohne altertümliche Wendungen. Der Fußnotenmarker steht beim sachlich zugehörigen Wort „Bahre“.
