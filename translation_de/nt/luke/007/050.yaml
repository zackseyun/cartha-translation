base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: de
  text: 'Da sagte er zu der Frau: »Dein Glaube[a] hat dich gerettet[b]. Geh in Frieden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Vertrauen hat dich gerettet«; weniger wahrscheinlich: »Deine Treue hat dich gerettet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hat dich gesund gemacht«. Das griechische Verb kann „retten“, „befreien“ oder „heil machen“ bedeuten; hier legt der Zusammenhang mit der Vergebung „gerettet“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Dann sagte er
  rationale: Das Aoristverb wird natürlich mit »sagte« wiedergegeben; δέ führt die Erzählung hier schlicht weiter und wird im Deutschen idiomatisch durch »Dann« ausgedrückt.
- source_word: πρὸς τὴν γυναῖκα
  choice: zu der Frau
  rationale: γυνή bezeichnet hier eindeutig die Frau in der erzählten Szene, nicht eine Ehefrau.
- source_word: Ἡ πίστις σου
  choice: Dein Glaube
  rationale: πίστις bezeichnet in diesem Zusammenhang ihre vertrauende Hinwendung zu Jesus. »Glaube« ist die natürliche, theologisch offene Wiedergabe; »Vertrauen« wäre ebenfalls möglich.
- source_word: σέσωκέν σε
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω bezeichnet eine vollzogene Handlung mit fortbestehender Wirkung. Im Kontext von Vergebung ist »gerettet« treffender als eine ausschließlich körperliche Heilung.
- source_word: πορεύου εἰς εἰρήνην
  choice: Geh in Frieden
  rationale: Die griechische Wendung wird im Deutschen idiomatisch und würdevoll mit »Geh in Frieden« wiedergegeben.
theological_decisions:
- issue: Bedeutung von σῴζω im Zusammenhang mit Vergebung
  choice: hat dich gerettet
  alternative: hat dich geheilt / hat dich gesund gemacht
  rationale: Der unmittelbare Zusammenhang handelt von Sündenvergebung und der vertrauenden Reaktion der Frau. »Gerettet« bewahrt dieses Gewicht, ohne genauer festzulegen, auf welche Weise der Glaube rettet.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: 'Vertrauen; weniger wahrscheinlich: Treue'
  rationale: Hier ist am ehesten das Vertrauen der Frau auf Jesus gemeint. »Glaube« bewahrt zugleich die übliche und breitere Bedeutung des griechischen Ausdrucks.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die traditionelle und weiterhin natürliche Wendung »Geh in Frieden« bewahrt den idiomatischen Charakter des griechischen Ausdrucks.
