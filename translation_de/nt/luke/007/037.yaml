  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: de
  text: Und siehe, eine Frau, die in der Stadt lebte und eine Sünderin war, erfuhr, dass er im Haus des Pharisäers zu Tisch lag[b]. Da brachte sie ein Alabastergefäß mit duftendem Salböl[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Bei Mahlzeiten lag man damals gewöhnlich auf Polstern zu Tisch.
    reason: cultural_note
  - marker: c
    text: 'Oder: „ein Alabasterfläschchen mit wohlriechender Salbe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und überraschenden Erzählakzent, ohne das im heutigen Deutsch altertümliche „siehe“ zu verwenden.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: die in der Stadt lebte
  rationale: Gibt die örtliche Zugehörigkeit in natürlichem Deutsch wieder, ohne darüber hinaus eine Herkunft oder besondere Bekanntheit ausdrücklich zu behaupten.
- source_word: ἁμαρτωλός
  choice: als Sünderin galt
  rationale: Bewahrt die moralisch-soziale Bezeichnung, ohne eine bestimmte Sünde zu benennen; die Formulierung lässt offen, ob hier ihre tatsächliche Lebensführung oder ihr öffentlicher Ruf im Vordergrund steht.
- source_word: ἐπιγνοῦσα
  choice: erfuhr
  rationale: Drückt idiomatisch aus, dass sie vor ihrem Kommen Kenntnis von Jesu Anwesenheit erhielt.
- source_word: κατάκειται
  choice: zu Tisch lag
  rationale: Gibt die damalige Körperhaltung bei einer Mahlzeit konkret wieder und vermeidet das sachlich ungenaue „saß“.
- source_word: κομίσασα
  choice: Da brachte sie
  rationale: Macht das griechische Partizip als natürliche deutsche Satzfolge verständlich und wahrt die zeitliche Verbindung.
- source_word: ἀλάβαστρον μύρου
  choice: ein Alabastergefäß mit duftendem Salböl
  rationale: Bezeichnet sowohl das Gefäß als auch seinen wohlriechenden, zur Salbung verwendeten Inhalt verständlich und sachnah.
theological_decisions:
- issue: Moralische Charakterisierung der Frau
  choice: als Sünderin galt
  alternative: eine Sünderin war
  rationale: Das Griechische nennt sie ἁμαρτωλός, ohne die Sünde zu bestimmen. Die Übersetzung vermeidet daher die traditionelle, aber im Vers unbelegte Festlegung auf Prostitution und erhält zugleich die mögliche Perspektive ihres öffentlichen Rufes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze lösen die griechische Partizipialkonstruktion natürlich auf. „Sieh“ erhält den narrativen Hinweischarakter von ἰδοὺ; „zu Tisch lag“ wird durch eine Kulturfußnote erklärt.
