id: LUK.7.32
reference: Luke 7:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: de
  text: 'Sie sind wie Kinder, die auf dem Marktplatz sitzen und einander zurufen: »Wir haben für euch Flöte gespielt, aber ihr habt nicht getanzt; wir haben ein Klagelied gesungen[a], aber ihr habt nicht geweint.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wir haben geklagt«. Das griechische Verb kann das Singen eines Klage- oder Totenliedes ebenso bezeichnen wie das Klagen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Sie sind wie
  rationale: Die natürliche deutsche Vergleichsformel gibt den einleitenden Ausdruck knapp und genau wieder.
- source_word: παιδίοις
  choice: Kinder
  rationale: Der Ausdruck bezeichnet Kinder allgemein; eine nähere Bestimmung von Alter oder Geschlecht wäre unbegründet.
- source_word: ἐν ἀγορᾷ
  choice: auf dem Marktplatz
  rationale: ἀγορά bezeichnet den öffentlichen Markt- oder Versammlungsplatz; im Deutschen ist die örtliche Wendung »auf dem Marktplatz« idiomatisch.
- source_word: καθημένοις
  choice: die … sitzen
  rationale: Die finite Relativsatzkonstruktion ist im Deutschen natürlicher als eine eng am griechischen Partizip orientierte Form.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: einander zurufen
  rationale: »Zurufen« bewahrt sowohl den hörbaren Ruf als auch den wechselseitigen Bezug von ἀλλήλοις.
- source_word: ἃ λέγει
  choice: —
  rationale: Die textkritisch und syntaktisch auffällige Wendung wird nicht eigens verdoppelt, da »einander zurufen« die folgende direkte Rede bereits natürlich einführt. So bleibt der Sinn erhalten, ohne im Deutschen eine schwerfällige Formel wie »die sagen« anzufügen.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Wir haben für euch Flöte gespielt
  rationale: αὐλέω bezeichnet ausdrücklich das Spielen einer Flöte beziehungsweise Pfeife; die Formulierung ist gegenwärtig und verständlich.
- source_word: οὐκ ὠρχήσασθε
  choice: ihr habt nicht getanzt
  rationale: Die schlichte Vergangenheitsform bildet die konkrete Reaktion ab, ohne zusätzliche Aspektnuancen einzutragen.
- source_word: ἐθρηνήσαμεν
  choice: wir haben ein Klagelied gesungen
  rationale: θρηνέω kann das Anstimmen eines Klage- oder Totenliedes bezeichnen. Diese Wiedergabe erhält den aufführungsartigen Gegensatz zum Flötenspiel.
- source_word: οὐκ ἐκλαύσατε
  choice: ihr habt nicht geweint
  rationale: »Weinen« ist die direkte, natürliche Wiedergabe von κλαίω und bewahrt das konkrete Bild.
theological_decisions:
- issue: Die gegensätzlichen Handlungen der Kinder als Bildwort wiedergeben, ohne Jesu Anwendung vorwegzunehmen
  choice: 'Konkrete Tätigkeiten beibehalten: Flöte spielen, tanzen, ein Klagelied singen und weinen'
  alternative: Deutend mit »feiern« und »trauern« wiedergeben
  rationale: Der Vers stellt zunächst das Bild selbst dar. Die konkrete Sprache wahrt seine parabolische Offenheit und vermeidet eine vorzeitige theologische Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar rhythmisiert; »Marktplatz«, »Flöte gespielt« und »Klagelied« halten das antike Bild verständlich fest. Auf eine Fußnote zu »Flöte spielen« wird verzichtet, da die gewählte deutsche Form den spezifischen Instrumentalbezug bereits ausdrücklich wiedergibt.
