id: LUK.7.9
reference: Luke 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: de
  text: 'Als Jesus das hörte, staunte er über ihn. Er wandte sich der Menge zu, die ihm folgte, und sagte: „Ich sage euch: Nicht einmal in Israel habe ich einen solchen Glauben[a][b] gefunden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen so großen Glauben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein solches Vertrauen“; das griechische Wort wird häufig mit „Glaube“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Als Jesus das hörte
  rationale: Der Aoristpartizipialsatz bezeichnet den vorausgehenden Umstand. Das pluralische ταῦτα kann im Deutschen idiomatisch mit dem zusammenfassenden Singular „das“ wiedergegeben werden; δέ dient lediglich als leichter Erzählübergang.
- source_word: ἐθαύμασεν αὐτόν
  choice: staunte er über ihn
  rationale: „Über jemanden staunen“ gibt die echte Verwunderung bzw. Bewunderung von θαυμάζω natürlich und würdevoll wieder, ohne sie erklärend abzuschwächen.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: Er wandte sich der Menge zu, die ihm folgte
  rationale: Der griechische Partizipialbau wird für flüssiges modernes Deutsch in einen Hauptsatz und einen Relativsatz aufgelöst. Das Präsenspartizip ἀκολουθοῦντι bezeichnet das fortdauernde Folgen.
- source_word: Λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die geläufige Redeformel wird direkt und mit ihrem feierlichen Nachdruck wiedergegeben.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: Nicht einmal in Israel
  rationale: Die Formulierung bewahrt sowohl die verstärkende Negation οὐδέ als auch die räumlich beziehungsweise gemeinschaftlich deutbare Wendung „in Israel“.
- source_word: τοσαύτην πίστιν
  choice: einen solchen Glauben
  rationale: τοσαύτην kann Art und Ausmaß hervorheben. „Einen solchen Glauben“ erhält diese Offenheit; die stärker graduelle Wiedergabe wird in einer Fußnote genannt.
- source_word: εὗρον
  choice: habe ich … gefunden
  rationale: Das deutsche Perfekt gibt in dieser direkten Aussage idiomatisch die bis zum gegenwärtigen Zeitpunkt reichende Erfahrung wieder.
theological_decisions:
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Vertrauen
  rationale: Im Zusammenhang ist das gläubige Vertrauen des Hauptmanns in Jesu Vollmacht gemeint. „Glauben“ bewahrt zugleich die übliche neutestamentliche Terminologie; „Vertrauen“ bleibt als sachlich mögliche Akzentuierung in der Fußnote erhalten.
- issue: Grad oder Art in τοσαύτην
  choice: einen solchen Glauben
  alternative: einen so großen Glauben
  rationale: Das Demonstrativadjektiv kann sowohl die Beschaffenheit als auch das außergewöhnliche Maß bezeichnen. Der Haupttext lässt diese Spannung bestehen, während die Fußnote die ausdrücklich graduelle Lesart nennt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die Partizipialkonstruktionen wurden natürlich aufgelöst, ohne den Ablauf zu verändern. Die Fußnotenmarker stehen unmittelbar bei der jeweils betroffenen Wendung.
