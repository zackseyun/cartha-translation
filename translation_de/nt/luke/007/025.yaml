source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: de
  text: 'Aber was seid ihr hinausgegangen, um zu sehen? Einen Mann, der in weiche Gewänder gekleidet ist?[a] Seht: Die in prächtiger Kleidung und im Luxus leben, sind in Königspalästen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feine Kleidung“. Gemeint sind weiche, kostbare Gewänder, wie sie mit Luxus verbunden waren, nicht moralische Schwäche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an Königshöfen“. Das griechische Wort kann königliche Residenzen oder das höfische Umfeld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Leitet als adversative Konjunktion die nächste rhetorische Frage ein und knüpft natürlich an den vorherigen Kontrast an.
- source_word: ἐξήλθατε ἰδεῖν
  choice: seid ihr hinausgegangen zu sehen
  rationale: Bewahrt die Bewegung nach draußen und gibt den finalen Infinitiv als Zweckangabe eng am griechischen Satzbau wieder.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: Bezeichnet hier im konkreten Bezug auf Johannes eine männliche Einzelperson.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: der in weiche Gewänder gekleidet ist
  rationale: Gibt den Zustand des Bekleidetseins und die wörtliche Vorstellung weicher, feiner Kleidung wieder, ohne eine moralische Wertung einzutragen.
- source_word: ἰδοὺ
  choice: Seht
  rationale: Der Aufmerksamkeitsruf wird in würdigem, verständlichem Deutsch als Aufforderung wiedergegeben.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: in prächtiger Kleidung
  rationale: ἐνδόξῳ bezeichnet hier gesellschaftlich eindrucksvolle, kostbare Kleidung; „prächtig“ ist im Deutschen natürlich und treffend.
- source_word: τρυφῇ ὑπάρχοντες
  choice: im Luxus leben
  rationale: Die idiomatische Formulierung bringt einen fortdauernden Zustand luxuriöser Lebensführung zum Ausdruck.
- source_word: ἐν τοῖς βασιλείοις
  choice: in Königspalästen
  rationale: Das substantivierte Neutrum bezeichnet königliche Wohnsitze beziehungsweise höfische Residenzen; der Plural bleibt erhalten.
theological_decisions:
- issue: Bedeutung von μαλακοῖς im Kontext
  choice: wörtliche Bezeichnung weicher beziehungsweise feiner Kleidung
  alternative: verweichlichte oder weibische Kleidung
  rationale: Der unmittelbare Gegensatz zwischen Wüste und höfischem Luxus spricht für eine soziale und materielle Beschreibung, nicht für ein moralisches Urteil.
- issue: Bedeutungsumfang von βασιλείοις
  choice: Königspaläste
  alternative: Königshöfe
  rationale: Das griechische Wort kann königliche Residenzen oder das höfische Umfeld bezeichnen. „Königspaläste“ gibt den konkreten Ort wieder; die Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt eng am griechischen Aufbau; „Seht“ bewahrt den markanten Aufmerksamkeitsruf. Die Wortwahl vermeidet sowohl altertümliches Pathos als auch eine unbegründete moralische Deutung von μαλακοῖς.
