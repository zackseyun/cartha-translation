id: LUK.7.22
reference: Luke 7:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: de
  text: 'Darauf antwortete er ihnen: »Geht und berichtet Johannes, was ihr gesehen und gehört habt: Blinde sehen[a], Lahme gehen, Aussätzige werden rein, Taube hören, Tote werden auferweckt, und den Armen wird die gute Nachricht verkündet.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Blinde sehen wieder.« Das griechische Verb kann hier bedeuten, dass jemand das Augenlicht erhält oder wiedererlangt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Den Armen wird das Evangelium verkündet.« Das griechische Verb steht im Passiv und bedeutet, dass ihnen gute Nachricht verkündet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Darauf antwortete er ihnen
  rationale: Die im Deutschen natürliche Zusammenziehung gibt sowohl den Anschluss durch καί als auch den responsiven Sinn des Partizips wieder, ohne die schwerfällige Doppelung »antwortend sagte er«.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Geht und berichtet
  rationale: Das vorangestellte Partizip verbindet sich idiomatisch mit dem Imperativ. »Berichtet« trifft das Übermitteln beobachteter Tatsachen an Johannes.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: was ihr gesehen und gehört habt
  rationale: Das deutsche Perfekt bezeichnet natürlich die bereits gemachten Beobachtungen, die nun weitergegeben werden sollen.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: Blinde sehen
  rationale: Die knappe Form wahrt die parallele Satzreihe und lässt offen, ob zuvor Sehende ihr Augenlicht zurückerhalten oder Blinde erstmals sehen; die mögliche Bedeutung »wieder sehen« wird in der Fußnote genannt.
- source_word: χωλοὶ περιπατοῦσιν
  choice: Lahme gehen
  rationale: Die Formulierung ist unmittelbar, verständlich und entspricht der parallelen Struktur des Griechischen.
- source_word: λεπροὶ καθαρίζονται
  choice: Aussätzige werden rein
  rationale: »Werden rein« bewahrt neben der körperlichen Heilung auch die im Verb καθαρίζω enthaltene Dimension kultischer Reinheit.
- source_word: κωφοὶ ἀκούουσιν
  choice: Taube hören
  rationale: In Verbindung mit »hören« bezeichnet κωφοί hier eindeutig gehörlose Menschen.
- source_word: νεκροὶ ἐγείρονται
  choice: Tote werden auferweckt
  rationale: Das Passiv bleibt erhalten und nennt den Handelnden nicht ausdrücklich, wie auch der griechische Text.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: den Armen wird die gute Nachricht verkündet
  rationale: Die unpersönliche Passivkonstruktion gibt den Empfängerbezug des griechischen Passivs wieder und vermeidet kirchlichen Fachjargon.
theological_decisions:
- issue: Die Wunderreihe als Hinweis auf Jesu Identität und Sendung
  choice: Die Wiederherstellungen werden ohne ausdrücklich hinzugefügte messianische Deutung als beobachtbare Geschehnisse wiedergegeben.
  alternative: Die Anspielungen auf Jesaja durch ergänzte Erfüllungssprache ausdrücklich als messianische Prophetie kennzeichnen.
  rationale: Der Vers selbst lässt Jesu Taten als Antwort an Johannes berichten. Anklänge an Jesaja bleiben durch die Wortwahl erkennbar, werden aber nicht im Haupttext ausgedeutet.
- issue: Nicht genannter Handelnder bei den Passivformen
  choice: Die Passivformen »werden rein«, »werden auferweckt« und »wird … verkündet« bleiben erhalten.
  alternative: Gott oder Jesus ausdrücklich als handelndes Subjekt einsetzen.
  rationale: Der griechische Text nennt den Handelnden in diesen Formulierungen nicht. Die Übersetzung wahrt diese theologische Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, parallelen Aussagen. »Aussätzige« ist im historischen Kontext prägnant; »werden rein« erhält bewusst mehr als nur eine medizinische Aussage. Die direkte Rede verwendet deutsche Anführungszeichen.
