  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: de
  text: Denn er liebt unser Volk, und er selbst hat die Synagoge für uns gebaut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat die Synagoge für uns bauen lassen“. Im Griechischen steht schlicht „gebaut“; dies kann sowohl eigene Ausführung als auch die Veranlassung oder Finanzierung des Baus bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: Die direkte und natürliche Wiedergabe bewahrt die Stärke der Empfehlung.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung für die Bitte der Ältesten im vorhergehenden Vers ein.
- source_word: τὸ ἔθνος ἡμῶν
  choice: unser Volk
  rationale: Im Deutschen bezeichnet „Volk“ hier natürlich die eigene jüdische Gemeinschaft; „unsere Nation“ klänge in diesem Zusammenhang moderner und staatsbezogener.
- source_word: τὴν συναγωγήν
  choice: die Synagoge
  rationale: Bewahrt die bestimmte, institutionelle Bedeutung des griechischen Ausdrucks, ohne einen im Text nicht ausdrücklich vorhandenen Possessivartikel einzufügen.
- source_word: αὐτός
  choice: selbst
  rationale: Gibt die ausdrückliche Hervorhebung des Handelnden knapp und idiomatisch wieder.
- source_word: ᾠκοδόμησεν
  choice: hat … gebaut
  rationale: Gibt den Aorist als abgeschlossene vergangene Handlung wieder, ohne festzulegen, ob er eigenhändig baute oder den Bau als Förderer veranlasste.
- source_word: ἡμῖν
  choice: für uns
  rationale: Versteht den Dativ natürlich als Dativ des Vorteils zugunsten der örtlichen Gemeinschaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unser Volk“ ist im Kontext idiomatischer als „unsere Nation“. Die Stellung von „selbst“ erhält die Betonung von αὐτός; die Fußnote wahrt die sachliche Mehrdeutigkeit des Bauverbs.
