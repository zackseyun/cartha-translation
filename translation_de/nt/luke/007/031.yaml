id: LUK.7.31
reference: Luke 7:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: de
  text: Mit wem soll ich nun die Menschen dieser Generation vergleichen? Wem sind sie ähnlich?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier die Menschen bzw. Angehörigen der betreffenden Generation allgemein; das inklusive „Menschen“ ist im modernen Deutschen präziser als „Männer“.
- source_word: τῆς γενεᾶς ταύτης
  choice: dieser Generation
  rationale: Gibt die Genitivverbindung direkt und idiomatisch wieder, ohne den möglichen wertenden Ton über den Kontext hinaus zu verstärken.
- source_word: ὁμοιώσω ... ὅμοιοι
  choice: vergleichen ... ähnlich
  rationale: Bewahrt das griechische Wortspiel zwischen dem Verb ὁμοιόω und dem Adjektiv ὅμοιος mit natürlichen deutschen Entsprechungen.
- source_word: οὖν
  choice: nun
  rationale: Markiert den folgernden Übergang aus dem vorangehenden Zusammenhang.
theological_decisions:
- issue: Reichweite von ἄνθρωποι
  choice: die Menschen
  alternative: die Männer
  rationale: Der griechische Plural ist generisch und beschränkt die Aussage nicht ausdrücklich auf männliche Personen; daher wird keine geschlechtliche Eingrenzung importiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte griechische Doppelfrage wird als zwei kurze deutsche Fragen wiedergegeben; dadurch bleiben Parallelismus und rhetorische Wirkung klar erhalten.
