  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: de
  text: 'Jesus antwortete ihm: „Simon, ich habe dir etwas zu sagen.“ Simon sagte: „Lehrer, sprich!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Jesus erwiderte ihm
  rationale: Die Verbindung aus Partizip und Redeverb ist eine griechische Erzählformel. „Erwiderte ihm“ gibt ihre Funktion natürlich und knapp wieder, ohne das im Deutschen schwerfällige „antwortete und sagte zu ihm“.
- source_word: Σίμων
  choice: Simon
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: ich habe dir etwas zu sagen
  rationale: Die deutsche Wendung entspricht dem griechischen Ausdruck eng und gibt σοί ausdrücklich mit „dir“ wieder.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: „Lehrer“ ist die unmittelbare Bedeutung von διδάσκαλος und vermeidet die stärkere, hier nicht zwingende Autoritätsnuance von „Meister“.
- source_word: εἰπέ
  choice: sprich
  rationale: Der Imperativ fordert Jesus auf, das angekündigte Wort auszusprechen. „Sprich!“ ist im Deutschen natürlich, knapp und würdevoll.
- source_word: φησίν
  choice: Er sagte
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben.
theological_decisions: []
