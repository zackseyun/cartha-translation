  - severity: low
    issue: »Da« für καί
    rationale: »Da« ist als erzählerische Verbindung möglich, lässt die einfache Anschlussfunktion von καί aber weniger unmittelbar erkennen. »Und« ist bei dieser knappen Reaktionsnotiz angemessen und genauer.
  - severity: low
    issue: Fußnotenalternative »bei sich selbst«
    rationale: Als deutsche Alternative zu ἐν ἑαυτοῖς ist »zu sich selbst« idiomatischer. Die Anmerkung sollte weiterhin offenlassen, ob inneres Erwägen oder ein Gespräch innerhalb der Gruppe gemeint ist.
