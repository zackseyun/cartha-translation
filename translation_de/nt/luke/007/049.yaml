  source_fidelity: 'Die Wiedergabe von ἤρξαντο, der steigernden Partikel καί und ἁμαρτίας ἀφίησιν ist zutreffend. »die anderen Tischgäste« ist jedoch weniger präzise: Das Präfix συν- in συνανακείμενοι bezeichnet die Mahlgemeinschaft und nicht lediglich eine Gruppe von »anderen« Gästen. Außerdem gibt »Und« das einleitende καί unmittelbarer wieder als »Da«.'
  naturalness: Die vorgeschlagene Fassung ist grundsätzlich flüssiges modernes Standarddeutsch. »Die mit ihm zu Tisch lagen« ist in diesem erzählerischen Kontext idiomatisch, würdig und vermittelt die antike Mahlgemeinschaft ohne unnötig technische Erklärung.
  terminology: »Sünden vergibt« ist die etablierte und sachgerechte Wiedergabe von ἁμαρτίας ἀφίησιν. Die knappe Frage »Wer ist dieser?« bewahrt die Spannung des griechischen Textes, ohne sie christologisch aufzulösen.
