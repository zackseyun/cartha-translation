  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: de
  text: 'Und die mit ihm zu Tisch lagen, begannen, untereinander[a] zu sagen: »Wer ist dieser, der sogar Sünden vergibt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu sich selbst«. Die griechische Wendung kann sowohl ein Gespräch unter den Gästen als auch inneres Nachdenken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: begannen
  rationale: Die Verbindung mit dem Infinitiv bezeichnet den Beginn des Sprechens; »begannen« gibt diesen Aspekt natürlich und genau wieder.
- source_word: οἱ συνανακείμενοι
  choice: die anderen Tischgäste
  rationale: Das Partizip bezeichnet diejenigen, die gemeinsam mit Jesus beim Mahl lagen. »Tischgäste« vermittelt die Mahlgemeinschaft idiomatisch; »anderen« macht deutlich, dass sie zur anwesenden Gruppe gehörten, ohne die antike Liegehaltung unnötig in den Vordergrund zu rücken.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: untereinander zu sagen
  rationale: Die Wendung kann sowohl ein Gespräch innerhalb der Gruppe als auch ein Sprechen bei sich selbst bezeichnen. Im Haupttext passt »untereinander« zum pluralischen Subjekt und zur gemeinsamen Reaktion; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: Τίς οὗτός ἐστιν
  choice: Wer ist dieser
  rationale: Die knappe Form bewahrt die Abruptheit der griechischen Frage und ergänzt kein im Ausgangstext fehlendes Wort wie »Mann«.
- source_word: καὶ
  choice: sogar
  rationale: καί hat hier steigernde Bedeutung und bringt das Erstaunen über den Anspruch zum Ausdruck.
- source_word: ἁμαρτίας ἀφίησιν
  choice: Sünden vergibt
  rationale: ἀφίημι ist in diesem Zusammenhang die übliche Bezeichnung für das Vergeben von Sünden; »vergibt« ist im Deutschen klar und sachlich angemessen.
theological_decisions:
- issue: Jesu Vollmacht, Sünden zu vergeben
  choice: 'Die erstaunte Frage bleibt ohne erklärenden Zusatz stehen: »Wer ist dieser, der sogar Sünden vergibt?«'
  alternative: Die Frage durch eine ausdrückliche Aussage über Jesu Identität oder göttliche Vollmacht erläutern.
  rationale: Der Vers wirft eine christologische Frage auf, beantwortet sie an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Tischgäste« gibt die antike Mahlsituation natürlich wieder; die direkte Rede bleibt knapp und pointiert.
