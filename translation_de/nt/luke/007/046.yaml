  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: de
  text: Du hast meinen Kopf nicht mit Öl gesalbt; sie aber hat meine Füße mit Duftöl[a] gesalbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Parfüm“ oder „mit wohlriechender Salbe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: mit Öl
  rationale: Der Dativ bezeichnet das Mittel. „Öl“ ist im Deutschen die natürliche und hinreichend genaue Wiedergabe; „Olivenöl“ wäre ohne kontextuelle Notwendigkeit spezifischer.
- source_word: ἤλειψας / ἤλειψεν
  choice: hast … gesalbt / hat … gesalbt
  rationale: ἀλείφω bezeichnet das Auftragen von Öl oder Salböl. „Salben“ bewahrt den Bezug zur damaligen Gastfreundschaft und funktioniert in beiden parallelen Satzteilen, ohne eine förmliche Weihehandlung festzulegen.
- source_word: τὴν κεφαλήν μου
  choice: mein Haupt
  rationale: Direkte Wiedergabe des Akkusativobjekts mit Possessivpronomen. „Haupt“ erhält einen würdigen biblischen Ton und passt idiomatisch zu „salben“.
- source_word: αὕτη δὲ
  choice: sie aber
  rationale: Die Formulierung wahrt die betonte Gegenüberstellung zur angeredeten Person. Im unmittelbaren Kontext ist der Bezug eindeutig, sodass „diese Frau“ nicht ergänzt werden muss.
- source_word: μύρῳ
  choice: mit duftendem Öl
  rationale: μύρον bezeichnet wohlriechendes Salböl beziehungsweise eine parfümierte Salbe. „Duftendes Öl“ hält den stofflichen Bezug zum gewöhnlichen Öl des ersten Satzteils fest und bringt zugleich den besonderen, kostbaren Charakter zum Ausdruck.
- source_word: τοὺς πόδας μου
  choice: meine Füße
  rationale: Wörtliche und natürliche Wiedergabe des Akkusativobjekts mit Possessivpronomen.
theological_decisions:
- issue: Kontrast der erwiesenen Ehre im Rahmen der Gastfreundschaft
  choice: Den Gegensatz zwischen unterlassener Salbung des Hauptes und der Salbung der Füße schlicht wiedergeben.
  alternative: Durch kultisch oder sakramental stärker aufgeladene Begriffe eine förmliche Weihehandlung nahelegen.
  rationale: Der unmittelbare Zusammenhang hebt den Gegensatz zwischen der versäumten Ehrerweisung des Gastgebers und der außergewöhnlichen Hingabe der Frau hervor. Die Übersetzung lässt mögliche weitergehende theologische Bezüge offen, trägt sie aber nicht ausdrücklich in den Wortlaut ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und das betonte „sie aber“ bleiben erhalten. „Haupt“ ist leicht gehoben, jedoch allgemein verständlich und in Verbindung mit „salben“ idiomatisch.
