  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: de
  text: 'Ich sage euch[a]: Unter denen, die von Frauen geboren wurden[b], ist niemand größer als Johannes. Doch der Geringste[c] im Reich Gottes ist größer als er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „Ich sage zu euch.“'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „von Frauen geboren“ bezeichnet Menschen allgemein.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „der Geringere“. Der griechische Komparativ wird hier idiomatisch im Sinn von „derjenige, der am geringsten ist“ verwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die direkte Redeformel wird natürlich und zugleich nah am griechischen Präsens wiedergegeben.
- source_word: μείζων
  choice: größer
  rationale: Die Wiedergabe wahrt den Vergleich, ohne festzulegen, ob Rang, Bedeutung, Vorrecht oder eine andere Art von Größe gemeint ist.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: unter denen, die von Frauen geboren wurden
  rationale: Die idiomatische Wendung bezeichnet Menschen allgemein; die relativische Form ist in modernem Deutsch verständlich und bewahrt zugleich das biblische Sprachbild.
- source_word: Ἰωάννου
  choice: Johannes
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: οὐδείς ἐστιν
  choice: ist niemand
  rationale: Natürliche deutsche Formulierung der verneinten vergleichenden Aussage.
- source_word: ὁ δὲ μικρότερος
  choice: Doch der Geringste
  rationale: Der substantivierte Komparativ bezeichnet im Zusammenhang denjenigen mit dem geringsten Rang; „der Geringste“ ist idiomatisches Deutsch. „Doch“ bringt den leicht adversativen Sinn von δέ zum Ausdruck.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Entspricht der etablierten deutschen Wiedergabe und erhält den durch ἐν ausgedrückten Bereich.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ist größer als er
  rationale: Gibt den Bezug auf Johannes eindeutig und in natürlichem Deutsch wieder, ohne die Grundlage des Vergleichs zu erläutern.
theological_decisions:
- issue: Grundlage des Vergleichs zwischen Johannes und dem Geringsten im Reich Gottes
  choice: Der paradoxe Vergleich bleibt ohne nähere Deutung stehen.
  alternative: „Größer“ ausdrücklich auf heilsgeschichtliches Vorrecht, geistlichen Rang, moralische Qualität oder gesellschaftliche Ehre beziehen.
  rationale: Der griechische Text nennt die Grundlage der Größe nicht. Die Übersetzung vermeidet daher eine konfessionelle oder anderweitig festgelegte Auslegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt knapp und bewahrt den scharfen Gegensatz des griechischen Textes.
