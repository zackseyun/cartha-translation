  source_fidelity: Der deutsche Text gibt die Aussage, den Vergleich und die im griechischen Text nicht näher bestimmte Grundlage von »größer« zuverlässig wieder. »Der Geringste« ist als idiomatische Wiedergabe des substantivierten Komparativs ὁ μικρότερος vertretbar; die erläuternde Fußnote sollte jedoch dessen Form und Sinn präziser darstellen.
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch und bewahrt den knappen, kontrastierenden Duktus. Die Stellung der Fußnotenmarker wird bei [c] an das erläuterte Wort angepasst.
  terminology: »Johannes«, »Reich Gottes« und »größer« sind etablierte und treffende deutsche Wiedergaben. Die bisherige Alternative zu λέγω ὑμῖν (»Ich spreche zu euch«) ist keine angemessene wörtliche Erläuterung; bei μικρότερος ist »der Geringere« als freistehende deutsche Alternative missverständlich.
