  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: de
  text: 'Er sandte sie zum Herrn und ließ ihm sagen: »Bist du der Kommende[a], oder sollen wir einen anderen erwarten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der, der kommt«. Der griechische Ausdruck kann rein beschreibend verstanden werden, dient hier aber wahrscheinlich als messianische Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Er schickte sie
  rationale: Der Aorist bezeichnet eine abgeschlossene Erzählhandlung. Das im Griechischen aus dem unmittelbaren Kontext erschließbare Objekt wird im Deutschen mit »sie« aufgenommen, damit der Satz natürlich und verständlich ist.
- source_word: πρὸς τὸν κύριον
  choice: zum Herrn
  rationale: πρός mit Akkusativ bezeichnet die Richtung zu einer Person. »Herr« bewahrt sowohl die erzählerische Anrede als auch das christologische Gewicht von κύριος.
- source_word: λέγων
  choice: und ließ ihn fragen
  rationale: Das Partizip leitet den Inhalt der durch Boten übermittelten Frage ein. Die deutsche Formulierung macht deutlich, dass die zuvor genannten Abgesandten die Frage überbringen, ohne Johannes selbst als unmittelbar Sprechenden darzustellen.
- source_word: Σὺ εἶ
  choice: Bist du
  rationale: Die formal aussageartige griechische Wortfolge ist im Zusammenhang eindeutig als direkte Frage zu verstehen und wird im Deutschen idiomatisch mit Fragewortstellung wiedergegeben.
- source_word: ὁ ἐρχόμενος
  choice: der Kommende
  rationale: Das substantivierte Präsenspartizip wird möglichst formnah wiedergegeben. »Der Kommende« lässt sowohl den wörtlichen Bezug auf den, der kommt, als auch die im Kontext naheliegende messianische Titelfunktion erkennen.
- source_word: ἄλλον
  choice: einen anderen
  rationale: Die knappe Wiedergabe entspricht dem substantivisch gebrauchten Adjektiv und legt nicht ausdrücklich fest, in welchem Verhältnis dieser Andere zum Erwarteten stünde.
- source_word: προσδοκῶμεν
  choice: sollen wir … erwarten
  rationale: Die deliberative Frage wird mit »sollen wir« natürlich wiedergegeben; »erwarten« bewahrt den Sinn fortdauernder Erwartung genauer als eine ausschließlich zeitlich verstandene Wiedergabe mit »warten«.
theological_decisions:
- issue: κύριος als Bezeichnung für Jesus
  choice: Herr
  alternative: Meister
  rationale: »Herr« entspricht dem üblichen lukanischen Gebrauch und bewahrt die mögliche christologische Tragweite; »Meister« würde den Titel hier unnötig verengen.
- issue: Titelfunktion von ὁ ἐρχόμενος
  choice: der Kommende
  alternative: der, der kommt
  rationale: Die substantivierte Form kann beschreibend gelesen werden, fungiert hier aber wahrscheinlich als bekannte messianisch-eschatologische Bezeichnung. »Der Kommende« bewahrt beide Ebenen, ohne den Titel durch eine erklärende Benennung zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Botenvermittlung wird idiomatisch ausgedrückt; die zentrale Bezeichnung »der Kommende« bleibt bewusst knapp und theologisch offen.
