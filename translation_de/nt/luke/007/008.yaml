id: LUK.7.8
reference: Luke 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: de
  text: 'Denn auch ich bin ein Mensch, der einer Befehlsgewalt unterstellt ist, und habe Soldaten unter mir. Sage ich zu diesem: »Geh!«, dann geht er, und zu einem anderen: »Komm!«, dann kommt er; und zu meinem Sklaven[a]: »Tu das!«, dann tut er es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener«. Das griechische Wort doulos bezeichnet einen Menschen in gebundener und untergeordneter Stellung, häufig einen Sklaven; je nach Zusammenhang kann es auch allgemeiner mit »Diener« wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ; „auch“ gibt καί und den Vergleich des Hauptmanns mit Jesus wieder.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: der einer Befehlsgewalt unterstellt ist
  rationale: Die Formulierung erhält den passiven Sinn von τασσόμενος und macht im militärischen Zusammenhang die hierarchische Befehlsstruktur deutlich, ohne die Aussage auf bloßen Gehorsam zu verkürzen.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: und habe Soldaten unter mir
  rationale: Die natürliche deutsche Wendung bewahrt die räumlich-hierarchische Bildsprache des griechischen Ausdrucks und zeigt die dem Hauptmann übertragene Autorität.
- source_word: λέγω τούτῳ
  choice: Sage ich zu diesem
  rationale: „Diesem“ erhält die demonstrative Kraft von τούτῳ; die Voranstellung des Verbs bildet im Deutschen einen natürlichen konditionalen Zusammenhang mit der jeweiligen Reaktion.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: Geh! / Komm! / Tu das!
  rationale: Die knappen Imperative entsprechen dem direkten militärischen und häuslichen Befehlston des Ausgangstextes.
- source_word: τῷ δούλῳ μου
  choice: zu meinem Sklaven
  rationale: δοῦλος bezeichnet grundsätzlich einen Menschen in rechtlich und sozial gebundener beziehungsweise besessener Stellung. Da gerade das Unterordnungsverhältnis für das Beispiel wesentlich ist, wird „Sklave“ im Haupttext verwendet; „Diener“ bleibt als kontextuell mögliche Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Vergleich des Hauptmanns
  choice: Sklave
  alternative: Diener
  rationale: Die Stelle lehrt nicht über Sklaverei, nutzt aber ein reales Autoritätsverhältnis als Vergleich. „Sklave“ bewahrt diesen sozialgeschichtlichen Gehalt; die Fußnote lässt die im Deutschen je nach Kontext mögliche allgemeinere Wiedergabe „Diener“ sichtbar.
- issue: Art der Autorität des Hauptmanns
  choice: einer Befehlsgewalt unterstellt
  alternative: unter Autorität gestellt
  rationale: ἐξουσία kann allgemein „Autorität/Vollmacht“ bedeuten. Im unmittelbaren militärischen Kontext bezeichnet die Formulierung jedoch eine Befehlshierarchie. „Befehlsgewalt“ macht diesen Kontext verständlich, ohne die vom Hauptmann gezogene Analogie zu Jesu Vollmacht ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die knappe Folge von Befehl und unmittelbarer Ausführung wird durch parallele Satzformen und direkte Rede erhalten. „Dann“ verdeutlicht im Deutschen idiomatisch die jeweilige Reaktion, ohne eine zusätzliche zeitliche Aussage einzuführen.
