base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: de
  text: Und der Tote setzte sich auf und fing an zu sprechen. Und er gab ihn seiner Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er gab ihn seiner Mutter zurück.“ Das Griechische sagt wörtlich nur „er gab ihn seiner Mutter“; dass es sich um eine Rückgabe handelt, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: setzte sich auf
  rationale: Das Verb bezeichnet hier die Bewegung aus einer liegenden in eine sitzende Haltung. „Setzte sich auf“ ist im modernen Deutschen natürlich und gibt den Vorgang genau wieder.
- source_word: ὁ νεκρός
  choice: der Tote
  rationale: Die substantivierte Bezeichnung ist im Deutschen idiomatisch und bewahrt die knappe Form des Griechischen, ohne mit „Leichnam“ unnötig zu versachlichen.
- source_word: ἤρξατο λαλεῖν
  choice: fing an zu sprechen
  rationale: Die Verbindung von ἄρχομαι mit dem Infinitiv bezeichnet den Beginn des Sprechens. Die gewählte Formulierung ist klar, natürlich und erzählerisch angemessen.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: er gab ihn seiner Mutter
  rationale: Das Griechische verwendet schlicht δίδωμι („geben“), ohne ein ausdrückliches Wort für „zurück“. Die Übersetzung erhält diese sprachliche Zurückhaltung.
theological_decisions:
- issue: Ob die Wiederherstellung der Beziehung zur Mutter durch „zurückgeben“ ausdrücklich gemacht werden soll
  choice: „er gab ihn seiner Mutter“
  alternative: „er gab ihn seiner Mutter zurück“ / „er führte ihn seiner Mutter wieder zu“
  rationale: Der Zusammenhang lässt erkennen, dass der Sohn seiner Mutter wiedergegeben wird; im griechischen Wortlaut steht jedoch nur „gab“. Die Hauptübersetzung macht die kontextuelle Folgerung daher nicht ausdrücklich zum Bestandteil des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper narrativer Satzführung. Die Wiederholung von „Und“ bildet die parataktische Struktur des griechischen Textes ab.
