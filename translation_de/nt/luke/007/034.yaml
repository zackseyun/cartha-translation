  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: de
  text: 'Der Menschensohn ist gekommen; er isst und trinkt, und ihr sagt: »Seht, ein Mensch: ein Fresser und Säufer[a], ein Freund von Zolleinnehmern und Sündern!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, näher am Wortlaut: »ein Fresser und Weintrinker«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: ist gekommen
  rationale: Das deutsche Perfekt gibt den griechischen Perfektstamm natürlich wieder und lässt die vollzogene Ankunft mit gegenwärtiger Relevanz erkennen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Charakter der Selbstbezeichnung und ihre möglichen Anklänge an Daniel.
- source_word: ἐσθίων καὶ πίνων
  choice: isst und trinkt
  rationale: Die beigeordneten finiten Verben sind im Deutschen natürlicher als eine partizipiale Konstruktion und geben die begleitende Art seines Kommens wieder.
- source_word: λέγετε
  choice: ihr sagt
  rationale: Das Präsens und die direkte Anrede werden formal und idiomatisch bewahrt.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Die moderne Aufforderungsform erhält die hinweisende und ausrufende Kraft ohne altertümliches Gepräge.
- source_word: ἄνθρωπος
  choice: dieser Mensch ist
  rationale: Die ausdrückliche Wiedergabe bewahrt das im Griechischen vorhandene Substantiv; »dieser« macht die hinweisende Konstruktion im Deutschen idiomatisch.
- source_word: φάγος
  choice: Fresser
  rationale: Das scharfe, abwertende Substantiv entspricht dem Charakter der feindseligen Anschuldigung.
- source_word: οἰνοπότης
  choice: Säufer
  rationale: Diese idiomatische pejorative Bezeichnung gibt die Anklage deutlicher wieder als das neutralere »Weintrinker«.
- source_word: φίλος
  choice: ein Freund
  rationale: Die prädikative Bezeichnung wird in der deutschen Aufzählung natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: τελωνῶν
  choice: Zolleinnehmern
  rationale: Die Bezeichnung trifft die antike Funktion präziser als das moderne Berufsbild eines allgemeinen Steuereinnehmers und bleibt gut verständlich.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Die direkte, konventionelle Wiedergabe erhält die sozial-religiöse Etikettierung durch Jesu Gegner.
theological_decisions:
- issue: Wiedergabe der Selbstbezeichnung ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: »Menschensohn« bewahrt die etablierte titularische Form, ihre christologische Spannung und mögliche intertextuelle Bezüge, ohne sie deutend aufzulösen.
- issue: Schärfe der Anschuldigungen φάγος und οἰνοπότης
  choice: Fresser und Säufer
  alternative: Vielfraß und Weintrinker
  rationale: Der Text berichtet polemische Verleumdungen. Die gewählte Form wahrt deren abwertende Schärfe, ohne sie als Urteil des Erzählers auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst scharfer Sprache innerhalb des zitierten Vorwurfs. Die direkte Rede ist klar markiert; »Zolleinnehmer« vermeidet eine anachronistische Gleichsetzung mit heutigen Finanzbeamten.
