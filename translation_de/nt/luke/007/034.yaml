    issue: Unbelegte Ergänzung »dieser«
    rationale: Ἰδοὺ ἄνθρωπος bedeutet wörtlich »Siehe/Seht, ein Mensch/Mann«; ein demonstratives »dieser« ist im Ausgangstext nicht vorhanden und verengt dessen Formulierung unnötig.
  - severity: low
    issue: Syntaktische Anbindung von »isst und trinkt«
    rationale: Die Kommareihung nach »ist gekommen« bildet die griechischen Partizipien nur holprig ab. Eine getrennte, weiterhin präsentische Aussage ist im Deutschen klarer, ohne den Sinn zu verändern.
  - severity: low
    issue: Fußnote ist unpräzise formuliert
    rationale: 'Die Alternative betrifft insbesondere οἰνοπότης: »Weintrinker« ist expliziter bzw. näher am Wortlaut, aber im Deutschen weniger deutlich pejorativ als »Säufer«.'
