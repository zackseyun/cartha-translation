- from: 'Der Menschensohn ist gekommen, isst und trinkt, und ihr sagt: »Seht, dieser Mensch ist ein Fresser und Säufer, ein Freund von Zolleinnehmern und Sündern!«[a]'
  to: 'Der Menschensohn ist gekommen; er isst und trinkt, und ihr sagt: »Seht, ein Mensch: ein Fresser und Säufer[a], ein Freund von Zolleinnehmern und Sündern!«'
  rationale: Die Revision entfernt die nicht im Griechischen ausgedrückte Ergänzung »dieser«, glättet die deutsche Syntax bei der Wiedergabe der Partizipien und präzisiert die lexikalische Alternative in der Fußnote. Die Schärfe der als gegnerische Rede berichteten Vorwürfe bleibt erhalten.
