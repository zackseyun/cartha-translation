  source_fidelity: Die Wiedergabe von ὀπίσω παρὰ τοὺς πόδας αὐτοῦ als „von hinten an seine Füße“ macht aus der beschriebenen Position eine Bewegung auf die Füße zu. στᾶσα bezeichnet hier das Stehen bzw. die eingenommene Stellung. Auch ἐξέμασσεν ist neutraler als „abtrocknen“ mit „abwischen“ wiederzugeben; ein vollständiges Trocknen wird nicht ausdrücklich ausgesagt. Das wiederholte Küssen und das Salben mit μύρον werden sachgerecht bewahrt.
  naturalness: Die Revision bleibt modernes, würdiges Standarddeutsch und bildet die Abfolge der Handlungen flüssig ab. „Hinter ihm bei seinen Füßen“ ist idiomatisch und wahrt die räumliche Angabe ohne zusätzliche historische Erklärung.
  terminology: „Benetzen“, „abwischen“, „salben“ und „Duftöl“ sind für βρέχειν, ἐκμάσσω, ἀλείφω und μύρον angemessen. Die Fußnote zu καταφιλέω erläutert Intensivierung und Imperfekt, ohne die Hauptübersetzung überdehnend zu interpretieren.
