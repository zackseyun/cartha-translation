revisions:
- from: Und sie trat weinend von hinten an seine Füße. Da begann sie, seine Füße mit ihren Tränen zu benetzen, und trocknete sie mit ihrem Haar ab. Immer wieder küsste sie seine Füße[a] und salbte sie mit dem Duftöl[b].
  to: Und sie stand weinend hinter ihm bei seinen Füßen und begann, seine Füße mit ihren Tränen zu benetzen. Mit ihrem Haar wischte sie sie ab, küsste immer wieder seine Füße[a] und salbte sie mit Duftöl[b].
  rationale: Die räumliche Szene wird als Stellung statt als Hinzutreten wiedergegeben. „Abwischen“ bewahrt die offene Bedeutung von ἐξέμασσεν. Die wiederholte Handlung von κατεφίλει bleibt im Haupttext sichtbar; die Fußnote vermeidet eine überstarke Alternative. Die Marker stehen unmittelbar bei „küsste“ und „Duftöl“.
