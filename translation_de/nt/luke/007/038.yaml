source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: de
  text: Und sie stand weinend hinter ihm bei seinen Füßen und begann, seine Füße mit ihren Tränen zu benetzen. Mit ihrem Haar wischte sie sie ab, küsste immer wieder seine Füße[a] und salbte sie mit Duftöl[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie küsste wiederholt seine Füße.“ Das griechische Verb ist verstärkt, und die Zeitform kann eine fortgesetzte oder wiederholte Handlung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Salböl“ beziehungsweise „mit wohlriechendem Öl“. Das griechische Wort bezeichnet parfümiertes Öl oder eine wohlriechende Salbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: sie trat von hinten an seine Füße
  rationale: Das aoristische Partizip eröffnet die Szene; „trat … an“ gibt den Eintritt in die Stellung natürlicher wieder als das steife „stand“. ὀπίσω und παρά mit Akkusativ bezeichnen ihre Position hinter Jesus bei seinen Füßen, passend zur damaligen Liegehaltung beim Essen.
- source_word: κλαίουσα
  choice: weinend
  rationale: Das Partizip bezeichnet anhaltendes Weinen und lässt sich knapp und anschaulich wiedergeben.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: begann sie, … mit ihren Tränen zu benetzen
  rationale: „begann“ bewahrt den einsetzenden Aspekt von ἤρξατο; „benetzen“ gibt βρέχειν präzise wieder, ohne die Menge der Tränen durch „durchnässen“ zu übertreiben.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν
  choice: trocknete sie mit ihrem Haar ab
  rationale: ἐκμάσσω kann „abwischen“ beziehungsweise „abtrocknen“ bedeuten. Im Zusammenhang ist „trocknete … ab“ natürlich; „mit ihrem Haar“ gibt den im Deutschen redundanten Zusatz „ihres Kopfes“ idiomatisch wieder.
- source_word: κατεφίλει
  choice: Immer wieder küsste sie
  rationale: Das imperfektische, intensivierte καταφιλέω legt fortgesetztes beziehungsweise wiederholtes Küssen nahe. Die Formulierung macht diesen Aspekt sichtbar, ohne eine zusätzliche innere Haltung wie „innig“ einzutragen.
- source_word: ἤλειφεν τῷ μύρῳ
  choice: salbte sie mit dem Duftöl
  rationale: „salbte“ wahrt die konkrete kulturelle Handlung; μύρον bezeichnet wohlriechendes Öl oder Salböl. „Duftöl“ ist modern und vermeidet die mögliche Fehlvorstellung eines alkoholischen Parfüms.
theological_decisions:
- issue: Darstellung der Handlungen der Frau an Jesu Füßen
  choice: Die körperlichen und emotional intensiven Handlungen werden konkret und ohne Abschwächung wiedergegeben.
  alternative: Eine deutende Wiedergabe wie „sie erwies ihm ihre Hingabe“ oder eine zurückhaltendere Formulierung ohne den wiederholten Kuss.
  rationale: Der griechische Text schildert die Handlungen selbst, deutet aber an dieser Stelle weder ausdrücklich ihr Motiv noch ihre theologische Bedeutung. Die Übersetzung bewahrt daher die Eindringlichkeit, ohne eine konfessionelle oder psychologische Auslegung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, anschaulichen Sätzen. Die ungewöhnliche Stellung der Frau wird verständlich beschrieben, ohne die damalige Liegehaltung erklärend in den Haupttext einzufügen. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
