  source_fidelity: 'Der griechische Satz wird präzise wiedergegeben: καί ist mit dem im Kontext passenden „Doch“ leicht adversativ gefasst; ἐδικαιώθη bleibt passiv und wird idiomatisch als „wurde ... als richtig erwiesen“ wiedergegeben; ἀπὸ πάντων τῶν τέκνων αὐτῆς ist zutreffend „von allen ihren Kindern“. Die Metapher τέκνων wird im Haupttext weder zu „Werken“ noch zu „Anhängern“ aufgelöst.'
  naturalness: „Doch die Weisheit wurde von allen ihren Kindern als richtig erwiesen“ ist natürliches modernes Standarddeutsch und bewahrt einen angemessen würdigen, knappen Bibelstil. Die Stellung von „von allen ihren Kindern“ ist klar und lässt die Kinder als bestätigende Instanz erkennen.
  terminology: „Weisheit“, „Kinder“ und das feminine Possessivpronomen „ihren“ bewahren die Personifizierung des griechischen Textes. „Als richtig erwiesen“ trifft den hiesigen öffentlichen Bestätigungs- bzw. Erweischarakter von δικαιόω besser als ein unkommentiertes „gerechtfertigt“. Die Fußnoten bieten die lexikalische Alternative, erläutern die Metapher ohne sie dogmatisch festzulegen und geben die sachlich zutreffende Parallele in Matthäus 11,19 an.
