  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: de
  text: Doch die Weisheit wurde von allen ihren Kindern als richtig erwiesen[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde gerechtfertigt“ oder „wurde als recht erwiesen“.'
    reason: lexical_alternative
  - marker: b
    text: „Kinder“ ist ein Bild für diejenigen, die durch ihre Reaktion oder Lebensweise zeigen, dass die Weisheit recht hat.
    reason: lexical_alternative
  - marker: c
    text: 'In Matthäus 11,19 heißt es: „Die Weisheit wurde durch ihre Werke als richtig erwiesen.“'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: καί verbindet den Satz mit dem Vorhergehenden, hat hier im Zusammenhang aber eine leicht gegensätzliche Nuance. „Doch“ bringt diesen Kontrast natürlich zum Ausdruck, ohne ihn übermäßig zu verstärken.
- source_word: ἐδικαιώθη
  choice: wurde … als richtig erwiesen
  rationale: Der Aorist Passiv von δικαιόω bezeichnet hier, dass die Weisheit öffentlich als richtig bestätigt oder anerkannt wird. Die Wiedergabe vermeidet eine vorschnelle Einengung auf den paulinisch-forensischen Gebrauch von „rechtfertigen“ und bewahrt zugleich die Passivform.
- source_word: ἡ σοφία
  choice: die Weisheit
  rationale: Dies ist die übliche und direkte Wiedergabe von σοφία. Durch die Kinder-Metapher bleibt die Personifizierung der Weisheit erhalten.
- source_word: ἀπὸ πάντων
  choice: von allen
  rationale: ἀπό kann bei einem Passiv die handelnde oder bestätigende Instanz bezeichnen. „Von allen“ gibt diese Beziehung im Deutschen unmittelbar wieder.
- source_word: τῶν τέκνων αὐτῆς
  choice: ihren Kindern
  rationale: τέκνα bedeutet wörtlich „Kinder“. Die Übersetzung bewahrt das Bild und deutet es im Haupttext weder als „Werke“ noch ausdrücklich als „Anhänger“ oder „Ergebnisse“ aus. Das Possessivpronomen erhält die Personifizierung der grammatisch femininen Weisheit.
theological_decisions:
- issue: Bedeutung der „Kinder“ der Weisheit
  choice: Das Bild wird im Haupttext wörtlich als „ihre Kinder“ wiedergegeben.
  alternative: Gemeint sein könnten die Menschen, die Gottes Weisheit annehmen und verkörpern, oder die Früchte und Ergebnisse dieser Weisheit; eine Angleichung an „Werke“ in Matthäus 11,19 wäre ebenfalls denkbar.
  rationale: Der griechische Text des Lukas bietet τέκνων („Kinder“). Die wörtliche Bildsprache bewahrt die echte Deutungsoffenheit und die theologische Spannung, während eine Fußnote die metaphorische Funktion erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. „Als richtig erwiesen“ ist idiomatischer als eine rein formale Wiedergabe mit „gerechtfertigt“, während „Kinder“ die markante Personifizierung und Metapher des griechischen Textes unverändert bewahrt.
