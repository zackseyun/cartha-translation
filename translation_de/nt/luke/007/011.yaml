id: LUK.7.11
reference: Luke 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: de
  text: Und es geschah am folgenden Tag, dass er in eine Stadt namens Nain[a] ging. Seine Jünger und eine große Menschenmenge zogen mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier sinngemäß „bald danach“ statt „am folgenden Tag“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Bewahrt die für Lukas typische erzählerische Einleitungsformel in würdigem, gut verständlichem Deutsch.
- source_word: ἐν τῷ ἑξῆς
  choice: am folgenden Tag
  rationale: Die substantivierte Wendung bezeichnet im vorliegenden SBLGNT-Text am natürlichsten den folgenden Tag; die abweichende Lesart wird in der Fußnote ausgewiesen.
- source_word: ἐπορεύθη
  choice: ging
  rationale: Gibt das Aoristverb πορεύομαι schlicht und idiomatisch wieder.
- source_word: εἰς πόλιν
  choice: in eine Stadt
  rationale: πόλις wird formal als „Stadt“ wiedergegeben; die Richtungsangabe εἰς bleibt durch „in eine“ erhalten.
- source_word: καλουμένην Ναΐν
  choice: namens Nain
  rationale: Natürliche deutsche Wiedergabe des Partizips καλουμένην bei einem Ortsnamen.
- source_word: συνεπορεύοντο αὐτῷ
  choice: zogen mit ihm
  rationale: Das Imperfekt bezeichnet eine fortdauernde begleitende Bewegung; „zogen mit ihm“ bewahrt sowohl Bewegung als auch Begleitung.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Eingebürgerte und idiomatische Wiedergabe der Nominalgruppe.
- source_word: ὄχλος πολύς
  choice: eine große Menschenmenge
  rationale: Gibt sowohl ὄχλος als auch die Größenangabe πολύς klar und in modernem Deutsch wieder.
