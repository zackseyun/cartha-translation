  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: de
  text: Der Sklave[a] eines gewissen Zenturios war schwer krank und lag im Sterben. Der Zenturio schätzte ihn sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Diener“. Das griechische Wort doulos bezeichnet einen Menschen in einem gebundenen Abhängigkeitsverhältnis und kann je nach Zusammenhang mit „Sklave“ oder „Diener“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: eines Hauptmanns
  rationale: Der Genitiv bezeichnet die Zugehörigkeit; τινος führt den Mann unbestimmt ein. „Hauptmann“ ist die geläufige, verständliche Wiedergabe des römischen Zenturios.
- source_word: δέ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier nur einen leichten erzählerischen Übergang. Im Deutschen ergibt sich der Anschluss natürlich aus der Satzfolge; ein vorangestelltes „Nun“ wäre unnötig markiert.
- source_word: δοῦλος
  choice: Sklave
  rationale: δοῦλος bezeichnet in diesem Haushaltkontext einen rechtlich und sozial gebundenen Menschen. „Sklave“ bewahrt dieses Verhältnis deutlicher als „Diener“.
- source_word: κακῶς ἔχων
  choice: war schwer krank
  rationale: Die Wendung bedeutet wörtlich, dass es ihm schlecht ging. Zusammen mit dem unmittelbar drohenden Tod bezeichnet sie hier eine schwere Erkrankung.
- source_word: ἤμελλεν τελευτᾶν
  choice: lag im Sterben
  rationale: μέλλω mit dem Infinitiv drückt den unmittelbar bevorstehenden Tod aus. „Lag im Sterben“ gibt dies natürlich und prägnant wieder.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: Der Hauptmann schätzte ihn sehr
  rationale: ἔντιμος bezeichnet hier hohe Wertschätzung. Die aktive deutsche Form vermeidet einen schwerfälligen Relativsatz und macht den Rückbezug von αὐτῷ eindeutig, ohne zusätzliche Gefühle in den Text hineinzulesen.
theological_decisions:
- issue: Wiedergabe von δοῦλος im Kontext antiker Haussklaverei
  choice: Sklave
  alternative: Diener
  rationale: Der griechische Ausdruck schließt hier ein Abhängigkeits- und Besitzverhältnis ein. „Diener“ kann dieses Verhältnis im heutigen Deutsch zu stark abschwächen; die Alternative wird dennoch in einer Fußnote genannt, weil das Wort je nach Kontext auch funktional als „Diener“ wiedergegeben werden kann.
- issue: Art der Beziehung zwischen Hauptmann und Sklave
  choice: schätzte ihn sehr
  alternative: er war ihm lieb und teuer
  rationale: ἔντιμος drückt hohen Wert oder hohes Ansehen aus, bestimmt aber nicht eindeutig, ob vor allem persönliche Zuneigung, wirtschaftlicher Wert oder ehrenvolle Achtung gemeint ist. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Hauptsätze sorgen für einen natürlichen Erzählfluss und vermeiden eine verschachtelte Übernahme der griechischen Satzstruktur. „Hauptmann“ ist allgemein verständlich; „Zenturio“ wäre historisch spezifischer, aber weniger alltagssprachlich.
