  source_fidelity: Die Wiedergabe von δοῦλος als „Sklave“, von κακῶς ἔχων als schwerer Krankheit, von ἤμελλεν τελευτᾶν als unmittelbar drohendem Sterben und von ἔντιμος als hoher Wertschätzung ist sachgerecht. Allerdings bleibt τινος („ein gewisser“) in „eines Hauptmanns“ zu wenig kenntlich. Die unbestimmte deutsche Form allein gibt die gezielte, wenn auch unidentifizierte Einführung einer Person nicht zuverlässig wieder.
