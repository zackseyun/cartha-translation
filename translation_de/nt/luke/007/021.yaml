  to: In jener Stunde[a] heilte er viele von Krankheiten, Plagen[b] und bösen Geistern; vielen Blinden schenkte er das Augenlicht.[c]
  rationale: Die Revision entfernt die nicht notwendige Verstärkung in „schweren Leiden“ und verwendet mit „Plagen“ eine im Deutschen natürliche, semantisch offene Wiedergabe von μάστιγες. Die Fußnoten bleiben an den jeweils erläuterten Ausdrücken verankert und sind näher am griechischen Wortlaut formuliert. Das Weglassen von „und“ nach dem Semikolon verbessert den deutschen Satzfluss, ohne die Koordination des griechischen Satzes inhaltlich zu verändern.
