source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: de
  text: In jener Stunde[a] heilte er viele von Krankheiten, Plagen[b] und bösen Geistern; vielen Blinden schenkte er das Augenlicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Genau in jener Stunde.“ Der griechische Ausdruck kann die Unmittelbarkeit des Geschehens hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Geißelhiebe“; auch: „Plagen“. Das griechische Wort kann Peitschenhiebe und übertragen körperliches Leiden bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „gewährte er vielen Blinden zu sehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: In jener Stunde
  rationale: Die Wiedergabe bewahrt Lukas’ konkrete Zeitangabe und klingt im modernen Deutschen natürlich. Eine mögliche Hervorhebung der Unmittelbarkeit wird in Fußnote [a] genannt.
- source_word: ἐθεράπευσεν
  choice: heilte er
  rationale: θεραπεύω bezeichnet hier das Heilen und ist im Zusammenhang der Wundertaten Jesu mit „heilen“ direkt und idiomatisch wiedergegeben.
- source_word: πολλοὺς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet viele Menschen, ohne deren Geschlecht oder eine nähere Gruppe festzulegen.
- source_word: ἀπὸ νόσων
  choice: von Krankheiten
  rationale: ἀπό bezeichnet die Befreiung von den Krankheiten; „von Krankheiten heilen“ gibt diese Trennung im Deutschen sachgerecht wieder.
- source_word: μαστίγων
  choice: schweren Leiden
  rationale: μάστιξ bedeutet wörtlich „Geißel“, kann aber übertragen schwere körperliche Plagen oder Leiden bezeichnen. „Schwere Leiden“ vermittelt diesen Sinn verständlich, ohne das Bild völlig zu verschweigen; die wörtlicheren Möglichkeiten stehen in Fußnote [b].
- source_word: πνευμάτων πονηρῶν
  choice: bösen Geistern
  rationale: πονηρός bedeutet „böse“; die direkte Wiedergabe vermeidet eine Umdeutung der Geister zu bloßen Krankheitsbildern.
- source_word: τυφλοῖς πολλοῖς
  choice: vielen Blinden
  rationale: Der Dativ bezeichnet die Empfänger. Die substantivierte Form ist im Deutschen knapp, natürlich und geschlechtsübergreifend.
- source_word: ἐχαρίσατο
  choice: schenkte er
  rationale: χαρίζομαι bezeichnet ein freies beziehungsweise gnädiges Gewähren. „Schenken“ bewahrt diesen Charakter besser als das neutralere „geben“.
- source_word: βλέπειν
  choice: das Augenlicht
  rationale: Wörtlich steht der Infinitiv „sehen“. Die deutsche Wendung „jemandem das Augenlicht schenken“ gibt den Vorgang idiomatisch wieder; die formale Entsprechung wird in Fußnote [c] angegeben.
theological_decisions:
- issue: Art des Wirkens Jesu gegenüber Menschen mit πνεύματα πονηρά
  choice: Die bösen Geister werden als reale Ursache genannt, von der Jesus Menschen befreit beziehungsweise heilt.
  alternative: Die Wendung ausschließlich als vormoderne Bezeichnung körperlicher oder psychischer Krankheiten verstehen.
  rationale: Der griechische Ausdruck bezeichnet unmittelbar „böse Geister“. Die Übersetzung wahrt diese Aussage, ohne über Wesen oder Wirken der Geister zusätzliche Lehraussagen einzutragen.
- issue: Nuance von ἐχαρίσατο
  choice: „schenkte“ bewahrt den Charakter einer frei gewährten Gabe.
  alternative: „gab“ oder „ließ … sehen“ ohne ausdrückliche Gabe-Nuance.
  rationale: Die Wortwahl erhält die im Verb angelegte gnädige beziehungsweise großzügige Zuwendung, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt der griechischen Abfolge nahe, während „das Augenlicht schenken“ die zweite Satzhälfte idiomatisch gestaltet. Das Semikolon macht die koordinierte, aber eigenständige zweite Handlung gut lesbar.
