revisions:
- from: Als er von Jesus hörte, sandte er Älteste der Juden zu ihm und bat ihn, zu kommen und seinen Sklaven[a] zu retten.
  to: Als er von Jesus hörte, sandte er Älteste der Juden zu ihm mit der Bitte, er möge kommen und den Sklaven des Hauptmanns[a] retten.
  rationale: Die Revision macht deutlich, dass die Ältesten die Bitte an Jesus überbringen, und klärt zugleich den Bezug von „sein Sklave“ auf den im vorherigen Kontext genannten Hauptmann. Sie verändert weder den Handlungsablauf noch die Bedeutungsweite der griechischen Ausdrücke.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:23:12Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den zeitlichen Aoristpartizipialsatz, das Senden jüdischer Ältester, die an Jesus gerichtete Bitte sowie die offene Bedeutung von διασώσῃ („retten“) zutreffend wieder. Die Koordination „sandte … und bat“ kann jedoch nahelegen, der Hauptmann selbst habe Jesus unmittelbar gebeten, während der griechische Text die Ältesten als die Bittenden beim Gesandtschaftsgang darstellt.
  naturalness: Das Deutsch ist grundsätzlich modern und idiomatisch. Eine Formulierung mit „mit der Bitte“ bildet die Funktion des Partizips ἐρωτῶν klarer ab. „Seinen Sklaven“ innerhalb der Infinitivgruppe kann zudem unnötig unsicher wirken, weil „ihn“ dort Jesus bezeichnet; „den Sklaven des Hauptmanns“ stellt den griechisch gemeinten Bezug eindeutig her.
  terminology: „Älteste der Juden“ ist als Wiedergabe von πρεσβυτέρους τῶν Ἰουδαίων angemessen. „Sklave“ gibt δοῦλος im antiken Haushaltskontext sachgerecht wieder; die Fußnote wahrt die mögliche Wiedergabe „Diener“. „Retten“ bewahrt gegenüber dem kontextuell möglichen „heilen“ die semantische Offenheit von διασώσῃ.
  issues:
  - severity: medium
    issue: Die Bitte wird syntaktisch dem Hauptmann statt den gesandten Ältesten zugeschrieben.
    rationale: ἐρωτῶν bezieht sich auf die gesandten πρεσβυτέρους. „Sandte … und bat“ ist zwar als delegierte Bitte verständlich, nivelliert aber die im griechischen Satz ausgedrückte Vermittlung durch die Ältesten.
  - severity: low
    issue: Der Besitzer des Sklaven kann im Deutschen innerhalb der Infinitivgruppe missverständlich sein.
    rationale: Nach „bat ihn, zu kommen“ kann „seinen Sklaven“ kurzfristig auf Jesus bezogen werden. Der Kontext und αὐτοῦ beziehen sich auf den Hauptmann.
  revised_text: Als er von Jesus hörte, sandte er Älteste der Juden zu ihm mit der Bitte, er möge kommen und den Sklaven des Hauptmanns[a] retten.
  revised_footnotes:
  - marker: a
    text: 'Oder: »Diener«. Das griechische Wort doulos kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen; hier hebt »Sklave« den unfreien Status hervor.'
    reason: alternative_reading
  revision_rationale: Die Revision macht deutlich, dass die Ältesten die Bitte an Jesus überbringen, und klärt zugleich den Bezug von „sein Sklave“ auf den im vorherigen Kontext genannten Hauptmann. Sie verändert weder den Handlungsablauf noch die Bedeutungsweite der griechischen Ausdrücke.
