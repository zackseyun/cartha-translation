  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: de
  text: Als er von Jesus hörte, sandte er Älteste der Juden zu ihm mit der Bitte, er möge kommen und den Sklaven des Hauptmanns[a] retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener«. Das griechische Wort doulos kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen; hier hebt »Sklave« den unfreien Status hervor.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Als er … hörte
  rationale: Das Aoristpartizip bezeichnet den der Haupthandlung vorausgehenden Umstand; die temporale Wiedergabe ist im Deutschen natürlich und präzise.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches Bindewort; der Zusammenhang wird im Deutschen bereits durch den Satzfluss deutlich.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: von Jesus
  rationale: περί mit Genitiv bedeutet hier »über/von«. In Verbindung mit »hören« ist »von Jesus hören« idiomatisches modernes Deutsch.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: sandte … zu ihm
  rationale: Die Formulierung bildet das Senden der anschließend genannten Ältesten zu Jesus unmittelbar ab, ohne sie zusätzlich als »Boten« zu bezeichnen.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: Älteste der Juden
  rationale: πρεσβύτεροι bezeichnet hier anerkannte Vertreter beziehungsweise führende Männer der jüdischen Gemeinschaft, nicht lediglich ältere Männer. Die Genitivverbindung bleibt erhalten.
- source_word: ἐρωτῶν αὐτὸν
  choice: bat ihn
  rationale: ἐρωτάω bezeichnet in diesem Zusammenhang eine höfliche oder dringliche Bitte. Das Partizip ist dem Subjekt des Hauptverbs zugeordnet.
- source_word: ὅπως ἐλθὼν
  choice: zu kommen
  rationale: Die mit ὅπως eingeleitete Bitte und das Partizip ἐλθών werden in natürlichem Deutsch als Infinitivgruppe wiedergegeben.
- source_word: διασώσῃ
  choice: zu retten
  rationale: διασῴζω kann retten, bewahren oder im Krankheitskontext auch heilen bedeuten. »Retten« wahrt hier die größere Bedeutungsbreite des griechischen Verbs.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: seinen Sklaven
  rationale: δοῦλος bezeichnet in diesem Haushaltsszenario einen rechtlich und sozial gebundenen Menschen unter der Autorität des Hauptmanns. »Sklave« macht diesen Status deutlicher als »Diener«.
theological_decisions:
- issue: Wiedergabe von δοῦλος im antiken Haushaltskontext
  choice: Sklave
  alternative: Diener
  rationale: »Sklave« bewahrt den im Begriff angelegten unfreien Status, ohne die Person lediglich über ihre Tätigkeit zu definieren. Da im Kontext auch der Dienstaspekt hervortreten kann und »Diener« traditionell verbreitet ist, wird diese Möglichkeit in einer Fußnote genannt.
- issue: Bedeutungsumfang von διασώζω im Krankheitskontext
  choice: retten
  alternative: heilen
  rationale: Die Krankheit bildet den unmittelbaren Kontext, doch das Verb selbst ist weiter als ein ausschließlich medizinischer Ausdruck. »Retten« erhält diese Offenheit, während »heilen« den Sinn auf körperliche Genesung festlegen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Handlungsablauf, vermeidet jedoch unnatürliche Partizipialkonstruktionen. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
