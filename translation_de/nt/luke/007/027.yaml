id: LUK.7.27
reference: Luke 7:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: de
  text: 'Dieser ist es, von dem geschrieben steht: »Siehe, ich sende meinen Boten[a] vor dir her[b]; er wird deinen Weg vor dir bereiten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Engel« bedeuten; hier bezeichnet es Johannes als menschlichen Gesandten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vor deinem Angesicht«.'
    reason: literal_rendering
lexical_decisions:
- source_word: οὗτός
  choice: Dieser ist es
  rationale: Bewahrt die hervorgehobene, auf Johannes zurückweisende Kraft des Demonstrativpronomens und klingt zugleich idiomatisch.
- source_word: περὶ οὗ γέγραπται
  choice: von dem geschrieben steht
  rationale: Gängige deutsche Wiedergabe der Schriftformel; das griechische Perfekt wird durch die bleibende Geltung von „geschrieben steht“ angemessen ausgedrückt.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, prophetischen Signalruf des Zitats, ohne im Deutschen unverständlich zu wirken.
- source_word: ἀποστέλλω
  choice: ich sende
  rationale: Gibt das griechische Präsens unmittelbar wieder und passt zum gehobenen Stil des Schriftzitats.
- source_word: ἄγγελόν
  choice: Boten
  rationale: Das Wort kann einen Engel oder allgemein einen Gesandten bezeichnen; im Zusammenhang ist Johannes als menschlicher Bote gemeint.
- source_word: πρὸ προσώπου σου
  choice: vor dir her
  rationale: Natürliches modernes Deutsch für die räumliche Wendung; eine Fußnote bewahrt den konkreten Wortlaut „vor deinem Angesicht“.
- source_word: κατασκευάσει
  choice: wird … bereiten
  rationale: Drückt die zukünftige Handlung des Herrichtens oder Bereitmachens klar aus.
- source_word: τὴν ὁδόν σου
  choice: deinen Weg
  rationale: „Weg“ bewahrt sowohl das konkrete Bild als auch seine prophetisch-metaphorische Bedeutung.
- source_word: ἔμπροσθέν σου
  choice: vor dir
  rationale: Direkte und natürliche Wiedergabe der abschließenden Ortsangabe; die Wiederholung gegenüber „vor dir her“ bleibt erkennbar.
theological_decisions:
- issue: Anwendung des prophetischen Schriftworts auf Johannes und Jesus
  choice: 'Die Pronomen der zweiten Person bleiben unverändert: „dir“, „deinen“, „dir“.'
  alternative: Ausdeutende Ergänzung, Johannes bereite ausdrücklich den Weg des Herrn oder des Messias.
  rationale: Der griechische Text identifiziert den Angeredeten nicht durch eine erklärende Einfügung. Die unveränderten Pronomen bewahren die theologische Aussagekraft und Spannung der Anwendung durch Jesus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schriftformel und „Siehe“ erhalten den feierlichen Zitatcharakter; „vor dir her“ vermeidet unnötig altertümliche Sprache, während die Fußnote das konkrete griechische Bild dokumentiert.
