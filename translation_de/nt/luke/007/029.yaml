source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: de
  text: Und alle aus dem Volk, die dies hörten, auch die Zolleinnehmer, gaben Gott recht[a]; sie waren mit der Taufe des Johannes getauft worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie erklärten Gott für gerecht.“ Gemeint ist, dass sie anerkannten, dass Gott im Recht war.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Partizip kann die vorausgehende Taufe als begleitenden Umstand oder auch kausal verstehen lassen: „weil sie mit der Taufe des Johannes getauft worden waren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: alle aus dem Volk
  rationale: Die Formulierung gibt den umfassenden Sinn des griechischen Kollektivausdrucks in natürlichem Deutsch wieder und ermöglicht zugleich eine klare Verbindung mit den ausdrücklich genannten Zolleinnehmern.
- source_word: ἀκούσας
  choice: die dies hörten
  rationale: Das adverbiale Aoristpartizip wird als Relativsatz wiedergegeben. „Dies“ nimmt den im Kontext vorausgesetzten Inhalt des Hörens auf.
- source_word: οἱ τελῶναι
  choice: die Zolleinnehmer
  rationale: „Zolleinnehmer“ ist die geläufige moderne Bezeichnung für Personen, die im damaligen Abgabensystem Zölle oder Steuern einzogen.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: gaben Gott recht
  rationale: Die Wendung bedeutet hier, dass die Menschen Gottes Recht und Gerechtigkeit anerkannten, nicht dass sie Gott erst gerecht machten. „Gott recht geben“ ist verständlich und bewahrt den urteilenden Charakter des Verbs.
- source_word: βαπτισθέντες
  choice: nachdem sie … empfangen hatten
  rationale: Das vorzeitige passive Aoristpartizip wird temporal wiedergegeben. Eine mögliche kausale Nuance wird nicht in den Haupttext aufgenommen, sondern in der Fußnote ausgewiesen.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: die Taufe des Johannes
  rationale: Die knappe Genitivverbindung bleibt erhalten und bezeichnet die von Johannes vollzogene beziehungsweise verkündete Taufe.
theological_decisions:
- issue: Bedeutung von ἐδικαίωσαν τὸν θεόν
  choice: Die Menschen „gaben Gott recht“, erkannten ihn also als gerecht und im Recht an.
  alternative: 'Formaler: „Sie erklärten Gott für gerecht“ oder „sie rechtfertigten Gott“.'
  rationale: Das Verb beschreibt die zustimmende Reaktion der Menschen auf Gottes Handeln und Botschaft; es besagt nicht, dass Menschen Gottes Gerechtigkeit bewirken.
- issue: Sinnbeziehung des Partizips βαπτισθέντες
  choice: Das Partizip wird im Haupttext temporal als „nachdem“ wiedergegeben.
  alternative: 'Es kann auch kausal verstanden werden: „weil sie die Taufe des Johannes empfangen hatten“.'
  rationale: Die griechische Partizipialkonstruktion bezeichnet sicher einen vorausliegenden Umstand, legt aber dessen genaue logische Beziehung zum Hauptverb nicht eindeutig fest. Die mögliche kausale Lesart wird deshalb offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Gott recht geben“ vermeidet das im heutigen Deutsch missverständliche „Gott rechtfertigen“. Die taxonomische Hervorhebung der Zolleinnehmer wird mit „auch“ ohne zusätzliches wertendes Gewicht wiedergegeben.
