  to: 'Nachdem die Boten des Johannes weggegangen waren, begann Jesus zu den Menschenmengen über Johannes zu sprechen: »Was seid ihr in die Wüste hinausgegangen, um zu sehen? Ein Schilfrohr, das vom Wind bewegt wird?«'
