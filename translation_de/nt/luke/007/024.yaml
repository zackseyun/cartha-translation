source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: de
  text: 'Nachdem die Boten des Johannes weggegangen waren, begann Jesus zu den Menschenmengen über Johannes zu sprechen: »Was seid ihr in die Wüste hinausgegangen, um zu sehen? Ein Schilfrohr, das vom Wind bewegt wird?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Nachdem ... weggegangen waren
  rationale: Der Aoristpartizip im Genitivus absolutus wird als vorzeitiger temporaler Nebensatz wiedergegeben.
- source_word: ἀγγέλων
  choice: Boten
  rationale: Im Zusammenhang sind menschliche Abgesandte des Johannes gemeint, nicht himmlische Engel.
- source_word: Ἰωάννου
  choice: des Johannes / Johannes
  rationale: Der Genitiv bezeichnet zuerst die Zugehörigkeit der Boten und später den Gegenstand der Rede.
- source_word: ἤρξατο λέγειν
  choice: begann Jesus ... zu sprechen
  rationale: Die inchoative Konstruktion bezeichnet den Beginn einer Rede. Das im Griechischen unausgesprochene Subjekt wird zur Klarheit als Jesus benannt.
- source_word: πρὸς τοὺς ὄχλους
  choice: zu den Menschenmengen
  rationale: Die Pluralform ὄχλους wird bewahrt; »Menschenmengen« ist verständliches modernes Deutsch.
- source_word: περὶ Ἰωάννου
  choice: über Johannes
  rationale: Dies gibt περί mit Genitiv im Redekontext natürlich wieder.
- source_word: Τί ἐξήλθατε
  choice: Was seid ihr ... hinausgegangen
  rationale: τί fragt nach dem Gegenstand des Sehens, nicht in erster Linie nach dem Beweggrund.
- source_word: εἰς τὴν ἔρημον
  choice: in die Wüste
  rationale: »Wüste« bezeichnet hier die unbewohnte bzw. dünn besiedelte Gegend von Johannes' Wirken und ist im Deutschen die geläufige biblische Wiedergabe.
- source_word: θεάσασθαι
  choice: um es anzusehen
  rationale: Das Verb bezeichnet bewusstes oder aufmerksames Anschauen. Das Pronomen »es« macht die deutsche Frage grammatisch natürlich, ohne das folgende Bild auszulegen.
- source_word: κάλαμον
  choice: ein Schilfrohr
  rationale: Das konkrete Pflanzenbild und damit seine metaphorische Offenheit bleiben erhalten.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: das vom Wind hin und her bewegt wird
  rationale: Die Formulierung bewahrt die passive Bewegung und vermittelt anschaulich die mögliche Vorstellung von Unbeständigkeit, ohne sie ausdrücklich auszulegen.
theological_decisions:
- issue: Metaphorische Aussage der rhetorischen Frage über Johannes
  choice: Das wörtliche Bild eines vom Wind bewegten Schilfrohrs bleibt stehen.
  alternative: Ein schwacher oder wankelmütiger Mensch?
  rationale: Der Ausgangstext deutet das Bild nicht ausdrücklich aus. Die Übersetzung bewahrt daher die rhetorische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Mehrzahl »Menschenmengen« folgt dem griechischen Plural. Der Name »Jesus« wird als eindeutiges Subjekt aus dem Kontext ergänzt. Die rhetorische Bildsprache bleibt ohne interpretierende Auflösung erhalten.
