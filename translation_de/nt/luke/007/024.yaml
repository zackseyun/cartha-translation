review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Genitivus absolutus als vorzeitigen temporalen Satz, die menschlichen »Boten«, den Beginn der Rede, die Pluralform von τοὺς ὄχλους und das offene Bild des vom Wind bewegten Rohres zuverlässig wieder. Die Ergänzung »Jesus« ist aus dem unmittelbaren Kontext eindeutig und verändert den Sinn nicht. Das objektlose »um zu sehen« entspricht der griechischen Konstruktion besser als ein vorwegnehmendes Pronomen.
  naturalness: '»Was seid ihr in die Wüste hinausgegangen, um es anzusehen?« ist im Deutschen wegen des anaphorischen »es« unnatürlich: Es hat vor der anschließenden Antwort kein eindeutiges Bezugswort und lässt die Frage unnötig sperrig wirken. Ohne Pronomen ist die rhetorische Frage idiomatisch und lässt, wie im Griechischen, die folgende Antwort das Erblickte benennen.'
  terminology: »Boten«, »Menschenmengen«, »Wüste«, »Johannes« und »Schilfrohr« sind angemessenes modernes Standarddeutsch. »vom Wind bewegt« gibt ὑπὸ ἀνέμου σαλευόμενον treffend wieder; das zusätzliche »hin und her« ist nicht erforderlich.
  issues:
