    issue: Das Pronomen »es« in »um es anzusehen« hat keinen vorangehenden eindeutigen Bezug.
    rationale: θεάσασθαι hat hier das in der Frage erfragte und in »ein Schilfrohr« nachgereichte Objekt. Die deutsche Fassung sollte diese offene Satzführung bewahren, statt ein künstliches Pronomen einzuführen.
  revised_text: 'Nachdem die Boten des Johannes weggegangen waren, begann Jesus zu den Menschenmengen über Johannes zu sprechen: »Was seid ihr in die Wüste hinausgegangen, um zu sehen? Ein Schilfrohr, das vom Wind bewegt wird?«'
