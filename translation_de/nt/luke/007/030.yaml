source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: de
  text: Die Pharisäer aber und die Gesetzeslehrer verwarfen Gottes Absicht für sich selbst[a], ohne sich von ihm[b] taufen lassen zu haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes Ratschluss gegen sich selbst“ oder „Gottes Plan in Bezug auf sich selbst“.'
    reason: alternative_reading
  - marker: b
    text: Gemeint ist Johannes der Täufer.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: Gesetzeslehrer
  rationale: Der Ausdruck bezeichnet hier Fachkundige im mosaischen Gesetz. „Gesetzeslehrer“ ist im modernen Deutsch klar und vermeidet die sachlich ungenaue Gleichsetzung mit Schriftgelehrten oder heutigen Juristen.
- source_word: βουλὴν
  choice: Absicht
  rationale: βουλή kann Absicht, Plan oder Ratschluss bedeuten. „Absicht“ gibt den auf die Betroffenen gerichteten Willen Gottes natürlich wieder, ohne die Aussage dogmatisch als unveränderlichen Beschluss festzulegen.
- source_word: ἠθέτησαν
  choice: verwarfen
  rationale: ἀθετέω bezeichnet ein Zurückweisen oder Verwerfen. „Verwarfen“ bringt ihre bewusste Ablehnung prägnant zum Ausdruck.
- source_word: εἰς ἑαυτούς
  choice: für sich selbst
  rationale: Die Wendung kann das auf sie persönlich bezogene Ziel der göttlichen Absicht bezeichnen. „Für sich selbst“ wahrt diese Deutung; alternative Auffassungen werden in der Fußnote genannt.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: indem sie sich nicht von ihm taufen ließen
  rationale: Die Formulierung gibt das verneinte passive Aoristpartizip als begleitenden Umstand beziehungsweise als Weise ihrer Verwerfung wieder, ohne ausdrücklich eine rein kausale Beziehung festzulegen.
- source_word: αὐτοῦ
  choice: ihm
  rationale: Das Pronomen verweist im Zusammenhang auf Johannes den Täufer. Der Haupttext bewahrt die pronominale Form des Griechischen; die Fußnote klärt den Bezug.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet den Gegensatz zur positiven Reaktion der zuvor genannten Menschen und wird idiomatisch mit „aber“ wiedergegeben.
theological_decisions:
- issue: Sinn von Gottes βουλή in Bezug auf die Pharisäer und Gesetzeslehrer
  choice: Gottes Absicht für sich selbst
  alternative: Gottes Ratschluss gegen sich selbst; Gottes Plan in Bezug auf sich selbst
  rationale: Die Übersetzung bringt zum Ausdruck, dass Gottes Absicht sie persönlich betraf, ohne vorab zu entscheiden, wie diese Aussage systematisch zum göttlichen Willen oder Ratschluss zu verstehen ist. Die semantische und theologische Spannung bleibt durch die Fußnote sichtbar.
- issue: Funktion des verneinten Partizips μὴ βαπτισθέντες
  choice: indem sie sich nicht von ihm taufen ließen
  alternative: weil sie sich nicht von ihm taufen ließen; nachdem sie sich nicht von ihm hatten taufen lassen
  rationale: „Indem“ verbindet die verweigerte Taufe eng mit dem Verwerfen von Gottes Absicht, ohne den griechischen Umstandssinn ausschließlich kausal oder temporal festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesetzeslehrer“ ist allgemein verständlich und historisch passend. Die reflexive Form „sich taufen ließen“ ist im Deutschen natürlicher als ein wörtliches Passiv und bewahrt die bewusste Verweigerung. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
