id: LUK.7.47
reference: Luke 7:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: de
  text: 'Darum sage ich dir: Ihre vielen Sünden sind vergeben, denn sie hat viel geliebt.[a] Wem aber wenig vergeben wird, der liebt wenig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Daher hat sie viel geliebt.« Das griechische Bindewort kann im Zusammenhang so verstanden werden, dass ihre große Liebe ihre bereits empfangene Vergebung erkennen lässt, statt deren Ursache zu sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Darum
  rationale: Die Wendung bezeichnet einen begründenden oder folgernden Anschluss. »Darum« ist im Deutschen knapp, natürlich und bewahrt diese Anschlussfunktion.
- source_word: ἀφέωνται
  choice: sind vergeben
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Vergebung mit fortbestehendem Ergebnis. »Sind vergeben« gibt den gegenwärtigen Zustand idiomatisch wieder.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ihre vielen Sünden
  rationale: Die natürliche deutsche Wortstellung bewahrt sowohl das Possessivverhältnis als auch die Hervorhebung der großen Zahl ihrer Sünden.
- source_word: ὅτι
  choice: denn
  rationale: »Denn« wahrt die begründende Formulierung des Griechischen, klingt im Deutschen jedoch weniger leicht wie eine Aussage über verdienstliche Kausalität als ein unkommentiertes »weil«.
- source_word: ἠγάπησεν πολύ
  choice: sie hat viel geliebt
  rationale: Das Perfekt ist im modernen Deutschen die natürliche Erzählform für den griechischen Aorist und bezieht sich hier passend auf ihr zuvor geschildertes Handeln.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: Wem aber wenig vergeben wird
  rationale: Die unbestimmte Relativkonstruktion wird geschlechtsneutral und idiomatisch wiedergegeben; »wenig« bewahrt die quantitative Parallele.
- source_word: ὀλίγον ἀγαπᾷ
  choice: der liebt wenig
  rationale: Die knappe Formulierung erhält den sprichwortartigen Parallelismus zwischen wenig Vergebung und wenig Liebe.
theological_decisions:
- issue: Ob ὅτι die Liebe der Frau als Ursache oder als erkennbares Zeichen ihrer Vergebung darstellt
  choice: Die begründende Form wird mit »denn« im Haupttext bewahrt; eine Fußnote erläutert die im Zusammenhang mögliche evidenzielle Deutung.
  alternative: 'Sinngemäß folgernd übersetzen: »Daher hat sie viel geliebt.«'
  rationale: Der griechische Wortlaut formuliert einen Begründungszusammenhang, während das Gleichnis unmittelbar zuvor und Vers 50 nahelegen, dass empfangene Vergebung Liebe hervorbringt. Die Übersetzung wahrt diese Spannung, ohne die Liebe als Verdienst festzulegen oder die Kausalform stillschweigend aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem und knappem Satzbau. Der abschließende Parallelismus wurde bewusst erhalten.
