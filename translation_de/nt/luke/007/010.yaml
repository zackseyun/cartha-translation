source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: de
  text: Als die Abgesandten in das Haus zurückkehrten, fanden sie den Sklaven[a] gesund vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort doulos kann je nach Zusammenhang „Sklave“ oder „Diener“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: als ... zurückkehrten
  rationale: Der Aoristpartizip bezeichnet hier einen zeitlich vorgeordneten Begleitumstand; die Wiedergabe mit einem temporalen Nebensatz ist im Deutschen natürlich und wahrt die Abfolge.
- source_word: εἰς τὸν οἶκον
  choice: in das Haus
  rationale: εἰς mit Akkusativ bezeichnet die Bewegung hinein beziehungsweise auf das Ziel zu. „In das Haus“ ist im Deutschen idiomatisch und lässt offen, ob das Gebäude zugleich ihr Zuhause war.
- source_word: οἱ πεμφθέντες
  choice: die Abgesandten
  rationale: Das substantivierte Passivpartizip bezeichnet diejenigen, die gesandt worden waren. „Die Abgesandten“ gibt dies knapp und natürlich wieder, ohne ihre Aufgabe näher auszudeuten.
- source_word: εὗρον
  choice: fanden ... vor
  rationale: „Vorfinden“ entspricht in diesem Zusammenhang dem Wahrnehmen eines angetroffenen Zustands und bildet zusammen mit dem prädikativen Partizip eine natürliche deutsche Formulierung.
- source_word: τὸν δοῦλον
  choice: den Sklaven
  rationale: δοῦλος bezeichnet im damaligen sozialen Kontext einen unfreien, einem Herrn unterstellten Menschen. „Sklave“ bewahrt diesen Status deutlicher als das weitere und potenziell verharmlosende „Diener“.
- source_word: ὑγιαίνοντα
  choice: gesund
  rationale: Das präsentische Partizip von ὑγιαίνω beschreibt den angetroffenen Zustand als gesund beziehungsweise wohlauf; „gesund“ vermeidet die interpretativ stärkere Wiedergabe „geheilt“.
theological_decisions:
- issue: Wiedergabe von δοῦλος in der Heilungserzählung
  choice: Sklave
  alternative: Diener
  rationale: Der griechische Ausdruck bezeichnet hier nicht bloß eine Tätigkeit, sondern wahrscheinlich einen rechtlich und sozial unfreien Status. Die Hauptübersetzung wahrt diese historische Härte; die traditionelle, weitere Wiedergabe wird in der Fußnote genannt.
- issue: Zustand oder ausdrücklich vollzogene Heilung bei ὑγιαίνοντα
  choice: gesund
  alternative: geheilt
  rationale: Der Vers beschreibt unmittelbar den gesunden Zustand beim Eintreffen. Dass eine Heilung geschehen ist, ergibt sich aus dem Erzählzusammenhang, wird durch das Wort selbst jedoch nicht ausdrücklich als Vorgang bezeichnet.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. „Abgesandte“ ist knapp und gehoben, aber allgemein verständlich; „fanden ... gesund vor“ bildet die griechische Zustandsbeschreibung idiomatisch ab.
