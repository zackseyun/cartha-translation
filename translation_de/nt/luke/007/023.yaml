source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: de
  text: Und glücklich zu preisen ist, wer nicht an mir Anstoß nimmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer sich nicht an mir ärgert“; oder: „wer nicht meinetwegen zu Fall kommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: glücklich zu preisen
  rationale: Die Wendung bewahrt den religiösen Segenscharakter der Makarismen und klingt im modernen Deutschen natürlicher und gewichtiger als bloß „glücklich“.
- source_word: ὃς ἐὰν μή
  choice: wer nicht
  rationale: Die substantivische Relativkonstruktion mit allgemeiner Bedingung wird im Deutschen idiomatisch und geschlechtsübergreifend mit „wer nicht“ wiedergegeben.
- source_word: σκανδαλισθῇ
  choice: Anstoß nimmt
  rationale: „Anstoß nehmen“ bewahrt die Bild- und Bedeutungsnähe zum Stolpern beziehungsweise Sich-Ärgern, ohne die Aussage vorschnell auf gekränkte Gefühle oder endgültigen Abfall festzulegen. Obwohl die griechische Form passiv ist, wird das Idiom im Deutschen natürlicherweise aktiv formuliert.
- source_word: ἐν ἐμοί
  choice: an mir
  rationale: In Verbindung mit „Anstoß nehmen“ ist „an mir“ die natürliche deutsche Entsprechung und bezeichnet Jesus als Anlass des Anstoßes.
theological_decisions:
- issue: Bedeutungsumfang des Anstoßnehmens an Jesus
  choice: Das Anstoßbild bleibt in der Hauptübersetzung erhalten.
  alternative: „wer sich nicht an mir ärgert“ oder „wer nicht meinetwegen zu Fall kommt“
  rationale: Die Formulierung lässt die Spannung zwischen Ablehnung, Glaubenshindernis und möglichem Abfall bestehen, statt sie auf emotionale Verärgerung oder endgültigen Glaubensabfall einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich zu preisen“ entspricht dem Ton einer Seligpreisung; „Anstoß nehmen“ ist verständlich und erhält zugleich die traditionelle Stolpermetaphorik.
