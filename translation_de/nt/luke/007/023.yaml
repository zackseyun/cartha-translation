  source_fidelity: Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder. „Wer nicht an mir Anstoß nimmt“ bildet σκανδαλισθῇ ἐν ἐμοί idiomatisch ab und bewahrt das Bild des Anstoßes/Stolperns, ohne es auf bloße Verärgerung oder auf einen endgültigen Abfall festzulegen. Die allgemeine, repräsentative Aussage von ὃς ἐὰν μή ist mit „wer nicht“ angemessen wiedergegeben.
  naturalness: „Und glücklich zu preisen ist, wer nicht an mir Anstoß nimmt“ ist würdiges, verständliches modernes Standarddeutsch mit angemessen biblischem Register. Die leicht gehobene Wendung „glücklich zu preisen“ passt zur Makarismusform und ist nicht archaisch.
