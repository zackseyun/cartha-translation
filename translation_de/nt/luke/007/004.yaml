id: LUK.7.4
reference: Luke 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: de
  text: 'Als sie zu Jesus kamen, baten sie ihn eindringlich: „Er ist es wert, dass du ihm dies gewährst.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er verdient es, dass du dies für ihn tust.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: kamen
  rationale: Das Partizip bezeichnet das Eintreffen bei Jesus; im Deutschen gibt ein temporaler Nebensatz den Zusammenhang natürlich wieder.
- source_word: παρεκάλουν
  choice: baten
  rationale: παρακαλέω bezeichnet hier eine respektvolle, nachdrückliche Bitte. „Baten“ ist idiomatisch und wird durch „eindringlich“ in seiner Intensität näher bestimmt.
- source_word: σπουδαίως
  choice: eindringlich
  rationale: Das Adverb drückt Ernst und Nachdruck aus; „eindringlich“ passt im Deutschen natürlich zu „bitten“, ohne die Bitte als verzweifeltes Flehen zu überzeichnen.
- source_word: Ἄξιός
  choice: ist es wert
  rationale: Die Wendung bewahrt die wertende Aussage von ἄξιος in natürlichem modernem Deutsch; „ist würdig“ wäre hier weniger idiomatisch.
- source_word: ᾧ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich auf den Hauptmann und lässt sich bei „gewähren“ direkt als „ihm“ wiedergeben.
- source_word: παρέξῃ
  choice: gewährst
  rationale: παρέχω bedeutet hier, das Erbetene zu gewähren beziehungsweise zu tun. „Gewährst“ erhält den respektvollen Ton der Fürsprache.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen verweist knapp auf die zuvor erbetene Heilung und wird ohne erklärende Ergänzung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; „eindringlich baten“ gibt die respektvolle Dringlichkeit wieder. Der Fußnotenmarker steht unmittelbar nach der gesamten betreffenden Aussage.
