source:
  edition: SBLGNT
  text: Καὶ ἀπήγγειλαν Ἰωάννῃ οἱ μαθηταὶ αὐτοῦ περὶ πάντων τούτων. καὶ προσκαλεσάμενος δύο τινὰς τῶν μαθητῶν αὐτοῦ ὁ Ἰωάννης
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: de
  text: Und seine Jünger berichteten Johannes von all dem. Und Johannes rief zwei von seinen Jüngern zu sich[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz wird im nächsten Vers fortgesetzt; das Komma bewahrt hier den unabgeschlossenen Satzbau.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet das Überbringen oder Weitermelden einer Nachricht; „berichteten“ passt zum erzählenden Zusammenhang, ohne unnötige Förmlichkeit.
- source_word: Ἰωάννῃ
  choice: Johannes
  rationale: Der Dativ kennzeichnet den Empfänger der Mitteilung; im Deutschen kann „jemandem berichten“ ohne Präposition stehen.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist im Evangelienkontext die geläufige und sachgerechte Wiedergabe von μαθηταί und bewahrt das Lehrer-Schüler- sowie Nachfolgeverhältnis.
- source_word: περὶ πάντων τούτων
  choice: von all dem
  rationale: Die Wendung gibt den Gegenstand des Berichts und die umfassende Bedeutung von πάντων wieder; „von all dem“ ist natürliches modernes Deutsch.
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Das mediale Partizip bezeichnet, dass Johannes die Betreffenden zu sich rief; die finite Form ist im Deutschen natürlicher und wahrt die zeitliche bzw. begleitende Verknüpfung.
- source_word: δύο τινὰς
  choice: zwei
  rationale: τινάς hat hier bei der Zahl eine unbestimmte, auswählende Nuance. Diese wird im Deutschen durch „zwei von seinen Jüngern“ hinreichend ausgedrückt; „zwei gewisse“ wäre unnatürlich.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: von seinen Jüngern
  rationale: Die partitive Bedeutung wird mit „zwei von seinen Jüngern“ klar und idiomatisch wiedergegeben.
- source_word: ὁ Ἰωάννης
  choice: Johannes
  rationale: Das ausdrücklich wiederholte Subjekt wird beibehalten, um den Wechsel von den berichtenden Jüngern zu Johannes klar zu markieren.
theological_decisions: []
