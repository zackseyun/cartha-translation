revisions:
- from: 'Als er sich dem Stadttor näherte, sieh: Da wurde ein Toter hinausgetragen, der einzige Sohn seiner Mutter[a]; und sie war Witwe. Eine beträchtliche Menschenmenge aus der Stadt begleitete sie.'
  to: Als er sich dem Stadttor näherte, wurde da gerade ein Toter hinausgetragen, der einzige Sohn seiner Mutter; sie war Witwe, und eine beträchtliche Menschenmenge aus der Stadt war bei ihr.
  rationale: 'Die Revision ersetzt die doppelte, stilistisch auffällige Wendung „sieh: Da“ durch ein natürliches erzählerisches „Da“ und berücksichtigt mit „gerade“ den laufenden Vorgang des Imperfekts. „War bei ihr“ bleibt näher an σύν als „begleitete sie“. Die Fußnote wird entfernt, weil ihre Alternative die Aussage über den einzigen Sohn zu einer nicht ausdrücklich gesicherten Aussage über ein einziges Kind ausweitet.'
