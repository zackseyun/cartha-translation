  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Annäherung an das Stadttor, das Hinaustragen eines Verstorbenen, seine Stellung als einziger Sohn seiner Mutter, ihr Witwenstand und die begleitende Menge. Die Formulierung „begleitete sie“ ist kontextuell plausibel, aber gegenüber ἦν σὺν αὐτῇ („war mit ihr“) etwas stärker interpretierend.'
  naturalness: '„sieh: Da“ wirkt im modernen Standarddeutsch doppelt markiert und unnatürlich. „Da wurde gerade … hinausgetragen“ gibt den erzählerischen Aufmerksamkeitsimpuls sowie den laufenden Vorgang idiomatisch wieder.'
  terminology: '„ein Toter“, „der einzige Sohn seiner Mutter“ und „Witwe“ sind angemessen und sachlich. Die Fußnote zu „einziges Kind“ geht über die konkrete Aussage „einziger Sohn“ hinaus: Die Formulierung schließt im Kontext nicht eindeutig weitere Kinder, etwa Töchter, aus.'
