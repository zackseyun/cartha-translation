  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: de
  text: Als er sich dem Stadttor näherte, wurde da gerade ein Toter hinausgetragen, der einzige Sohn seiner Mutter; sie war Witwe, und eine beträchtliche Menschenmenge aus der Stadt war bei ihr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Als er sich … näherte
  rationale: Die temporale Verbindung und der Aorist werden in natürlichem Deutsch als einsetzende Begleithandlung wiedergegeben; das leicht fortführende δέ braucht keine eigene, schwerfällige Entsprechung.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: dem Stadttor
  rationale: Die deutsche Zusammensetzung ist idiomatisch und gibt die griechische Genitivverbindung vollständig wieder.
- source_word: καὶ ἰδού
  choice: 'sieh: Da'
  rationale: „Sieh“ erhält die aufmerksamkeitslenkende Funktion von ἰδού; „Da“ führt die plötzlich sichtbar werdende Szene natürlich ein und nimmt zugleich das verbindende καί auf.
- source_word: ἐξεκομίζετο
  choice: wurde … hinausgetragen
  rationale: Das Präteritum im Passiv gibt den im Verlauf befindlichen Vorgang des imperfektischen Verbs passend wieder; der Bestattungskontext bleibt implizit.
- source_word: τεθνηκώς
  choice: ein Toter
  rationale: Das Perfektpartizip bezeichnet einen Menschen im Zustand des Todes. „Ein Toter“ ist knapp, würdig und kontextgerecht.
- source_word: μονογενὴς υἱός
  choice: der einzige Sohn
  rationale: Im familiären Kontext bezeichnet μονογενής das einzige Kind beziehungsweise den einzigen Sohn der Mutter; „der einzige Sohn“ ist die klare, unaufgeladene Wiedergabe.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: seiner Mutter
  rationale: Der relationale Dativ gibt an, wessen einziger Sohn der Verstorbene war; Deutsch drückt dies idiomatisch mit dem Genitiv aus.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: und sie war Witwe
  rationale: Die eigenständige Nennung des Pronomens bleibt erhalten und hebt die besonders schutzlose Lage der Mutter hervor.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: eine beträchtliche Menschenmenge aus der Stadt
  rationale: ἱκανός bezeichnet hier eine beachtliche Zahl. „Beträchtlich“ wahrt die Abstufung, ohne zwingend die stärkere Aussage „groß“ einzutragen.
- source_word: ἦν σὺν αὐτῇ
  choice: begleitete sie
  rationale: Die wörtliche Aussage „war mit ihr“ bezeichnet im Kontext die Teilnahme am Trauerzug; „begleitete sie“ ist im Deutschen natürlicher und bewahrt diesen Sinn.
theological_decisions:
- issue: Bedeutung von μονογενής außerhalb eines christologischen Zusammenhangs
  choice: der einzige Sohn
  alternative: ihr einziger, einziggeborener Sohn
  rationale: Hier beschreibt μονογενής die familiäre Beziehung zur Witwe und bedeutet kontextuell, dass sie keinen weiteren Sohn beziehungsweise kein weiteres Kind hatte. Die Übersetzung vermeidet, aus anderen neutestamentlichen Kontexten eine besondere dogmatische Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der aufmerksamkeitslenkende Erzählimpuls von ἰδού bleibt mit „sieh“ erhalten; Satzteilung und Semikolon vermeiden eine schwerfällige Reihung, ohne die enge Verbindung der Angaben aufzulösen.
