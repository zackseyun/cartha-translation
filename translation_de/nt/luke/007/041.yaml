  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: de
  text: Ein Geldverleiher hatte zwei Schuldner. Der eine schuldete ihm fünfhundert Denare[a], der andere fünfzig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine verbreitete römische Silbermünze und entsprach ungefähr dem üblichen Tageslohn eines Arbeiters.
    reason: cultural_note
lexical_decisions:
- source_word: δύο χρεοφειλέται
  choice: zwei Schuldner
  rationale: Die Wendung bezeichnet zwei Personen, die eine Geldschuld haben; „Schuldner“ ist im Deutschen direkt, natürlich und im erzählerischen Zusammenhang eindeutig.
- source_word: δανιστῇ τινι
  choice: ein Geldverleiher
  rationale: δανιστής bezeichnet jemanden, der Geld verleiht. Das indefinite τινι wird idiomatisch durch den unbestimmten Artikel wiedergegeben.
- source_word: ἦσαν ... ὤφειλεν
  choice: hatte ... Schuldner / schuldete
  rationale: Die deutsche Konstruktion „Ein Geldverleiher hatte zwei Schuldner“ gibt die bestehende Gläubiger-Schuldner-Beziehung natürlich wieder; das Imperfekt ὤφειλεν wird passend mit „schuldete“ übersetzt.
- source_word: δηνάρια
  choice: Denare
  rationale: Der historische Münz- und Rechnungsbegriff bleibt erhalten; eine Fußnote erklärt seinen ungefähren wirtschaftlichen Wert.
- source_word: ὁ εἷς ... ὁ δὲ ἕτερος
  choice: der eine ... der andere
  rationale: Diese geläufige deutsche Paarformel bildet den griechischen Kontrast präzise und idiomatisch ab.
- source_word: πεντακόσια ... πεντήκοντα
  choice: fünfhundert ... fünfzig
  rationale: Die Zahlen werden direkt wiedergegeben; bei „fünfzig“ ist „Denare“ aus dem ersten Satzteil ohne Missverständnis mitzudenken.
