id: LUK.7.26
reference: Luke 7:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: de
  text: 'Doch was seid ihr hinausgegangen zu sehen? Einen Propheten? Ja, ich sage euch: sogar mehr als einen Propheten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „etwas Größeres als einen Propheten“.'
    reason: Der substantivisch gebrauchte neutrale Komparativ περισσότερον lässt diese formalere Wiedergabe zu; „mehr als einen Propheten“ ist im Deutschen idiomatischer und bewahrt die offene Aussage.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Die adversative Partikel setzt die Reihe der rhetorischen Fragen kontrastierend fort; „Doch“ ist im Deutschen knapp und natürlich.
- source_word: τί
  choice: was
  rationale: Das interrogative Pronomen ist Objekt zu „sehen“ und fragt danach, wen oder was die Menschen sehen wollten, nicht nach dem Grund ihres Hinausgehens.
- source_word: ἐξήλθατε
  choice: seid ihr hinausgegangen
  rationale: Der Aorist bezeichnet das vergangene Hinausgehen; das deutsche Perfekt klingt in direkter Rede natürlich und bewahrt den Bezug auf die vollzogene Handlung.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: Der Infinitiv drückt den Zweck des Hinausgehens aus und wird direkt und idiomatisch wiedergegeben.
- source_word: προφήτην
  choice: Einen Propheten
  rationale: Der Akkusativ steht elliptisch als Antwortmöglichkeit in der rhetorischen Frage; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: ναί
  choice: Ja
  rationale: Die starke Bejahung wird unmittelbar und ohne abschwächenden Zusatz wiedergegeben.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die geläufige Redeformel wird formal nah und zugleich in natürlichem modernem Deutsch wiedergegeben.
- source_word: καὶ
  choice: sogar
  rationale: Im Zusammenhang steigert καί die Aussage über den Prophetenstatus; „sogar“ bringt die klimaktische Kraft im Deutschen natürlich zum Ausdruck.
- source_word: περισσότερον προφήτου
  choice: mehr als einen Propheten
  rationale: Der substantivisch gebrauchte neutrale Komparativ mit Genitiv bezeichnet ein über die Kategorie „Prophet“ hinausgehendes Maß oder eine höhere Stellung, ohne deren genaue Art festzulegen.
theological_decisions:
- issue: Identität und Rang Johannes des Täufers
  choice: Jesus bestätigt, dass Johannes ein Prophet ist, und bezeichnet ihn darüber hinaus als mehr als einen Propheten, ohne hier die genaue Art dieser Überlegenheit auszuführen.
  alternative: Die Formulierung ausdrücklich als „etwas Größeres als einen Propheten“ wiederzugeben oder sie bereits als Aussage über den endzeitlichen Boten zu erklären.
  rationale: Der knappe Vergleich des griechischen Textes bleibt bestehen. Seine theologische Bedeutung wird nicht vorwegnehmend aus dem folgenden Kontext ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Fragefolge und die steigernde Antwort bleiben knapp. Das Perfekt entspricht natürlicher deutscher Rede; der Doppelpunkt markiert den Übergang von der Redeformel zur hervorgehobenen Aussage.
