source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: de
  text: Da sie nichts hatten, womit sie zurückzahlen konnten, erließ er ihnen beiden aus freien Stücken die Schulden.[a] Wer von ihnen wird ihn nun mehr lieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vergab er beiden großzügig“. Das griechische Verb kann bedeuten, etwas aus freien Stücken zu gewähren oder Schulden zu erlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Da sie nichts hatten, womit sie zurückzahlen konnten
  rationale: Der Genitivus absolutus beschreibt den Umstand beziehungsweise Grund ihrer Zahlungsunfähigkeit. Die Formulierung gibt das fehlende Vermögen zur Rückzahlung natürlich wieder, ohne eine zeitliche Lesart festzulegen.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: erließ er beiden aus freien Stücken die Schuld
  rationale: Im Zusammenhang mit den beiden Schuldnern bezeichnet χαρίζομαι den unentgeltlichen Erlass des Geschuldeten. „Aus freien Stücken“ bewahrt den Aspekt der freien, gnädigen Zuwendung; der Singular „die Schuld“ ist distributiv auf beide bezogen.
- source_word: τίς οὖν αὐτῶν
  choice: Wer von ihnen ... nun
  rationale: „Nun“ gibt die folgernde Funktion von οὖν in idiomatischem Deutsch wieder.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: wird ihn ... mehr lieben
  rationale: Die Übersetzung bewahrt den Futur und den direkten Vergleich des Maßes der Liebe.
theological_decisions:
- issue: Wiedergabe von χαρίζομαι im Gleichnis von Schulderlass und Liebe
  choice: erließ er beiden aus freien Stücken die Schuld
  alternative: vergab er beiden großzügig
  rationale: Der unmittelbare Bildbereich ist eine finanzielle Schuld. „Die Schuld erlassen“ macht diesen Sinn klar, während „aus freien Stücken“ die im Verb enthaltene freie Zuwendung ausdrückt. Die Fußnote hält die mögliche Wiedergabe mit „vergeben“ offen, ohne die Verbindung zwischen Schulderlass und Vergebung dogmatisch einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Frage folgt der griechischen Wortstellung in natürlicher deutscher Form; „lieben“ bewahrt die zentrale Wortverbindung zum folgenden Kontext.
