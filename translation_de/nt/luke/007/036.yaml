revisions:
- from: Einer der Pharisäer bat ihn, mit ihm zu essen. Jesus ging in das Haus des Pharisäers und legte sich zum Essen nieder.[a]
  to: Einer der Pharisäer bat ihn, mit ihm zu essen, und nachdem er das Haus des Pharisäers betreten hatte, legte er sich zu Tisch.[a]
  rationale: Die Revision verbindet die Handlungen wieder in der griechisch vorgegebenen Erzählfolge und gibt das vorzeitige Partizip εἰσελθών durch „nachdem … betreten hatte“ präzise wieder. „Sich zu Tisch legen“ bewahrt die Bedeutung von κατεκλίθη. Die Fußnote wurde auf die vom Text gedeckte allgemeine kulturelle Information beschränkt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:23:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Inhalte sind richtig wiedergegeben: ein Pharisäer lädt Jesus zum Essen ein, Jesus betritt dessen Haus und nimmt die für ein Mahl übliche liegende Tischposition ein. Die Aufteilung in zwei Hauptsätze schwächt jedoch die enge Verknüpfung von Eintritt und anschließendem Niederlegen ab. Außerdem ist „festlichen“ in der Fußnote durch den griechischen Text nicht gedeckt.'
  naturalness: „Sich zu Tisch legen“ ist idiomatisches, modernes Standarddeutsch und bezeichnet im Kontext klar die Einnahme eines Platzes zum Mahl. Die vorgeschlagene Satzfügung ist flüssig und bewahrt zugleich die zeitliche Abfolge des Partizips.
  terminology: „Pharisäer“ ist die etablierte deutsche Gruppenbezeichnung. „Sich zu Tisch legen“ gibt κατεκλίθη sachgerecht wieder, ohne die Handlung auf bloßes Hinsetzen zu reduzieren. Die kulturelle Erläuterung sollte allgemein von Mahlzeiten sprechen, nicht von festlichen Mahlzeiten.
  issues:
  - severity: low
    issue: Die Satztrennung löst die mit καί verknüpfte Erzählfolge in zwei stärker eigenständige Sätze auf.
    rationale: Eine einheitliche Satzstruktur kann die Abfolge „nachdem er eingetreten war, legte er sich zu Tisch“ näher am griechischen Zusammenhang ausdrücken.
  - severity: medium
    issue: Die Fußnote bezeichnet die Mahlzeiten als „festlich“.
    rationale: Der Vers nennt lediglich ein Essen; ein festlicher Charakter wird nicht angegeben und sollte nicht ergänzt werden.
  revised_text: Einer der Pharisäer bat ihn, mit ihm zu essen, und nachdem er das Haus des Pharisäers betreten hatte, legte er sich zu Tisch.[a]
  revised_footnotes:
  - marker: a
    text: Bei Mahlzeiten lag man damals gewöhnlich auf Polstern an einem niedrigen Tisch, statt aufrecht auf Stühlen zu sitzen.
    reason: cultural_note
  revision_rationale: Die Revision verbindet die Handlungen wieder in der griechisch vorgegebenen Erzählfolge und gibt das vorzeitige Partizip εἰσελθών durch „nachdem … betreten hatte“ präzise wieder. „Sich zu Tisch legen“ bewahrt die Bedeutung von κατεκλίθη. Die Fußnote wurde auf die vom Text gedeckte allgemeine kulturelle Information beschränkt.
