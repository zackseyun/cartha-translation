source:
  edition: SBLGNT
  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: de
  text: Einer der Pharisäer bat ihn, mit ihm zu essen, und nachdem er das Haus des Pharisäers betreten hatte, legte er sich zu Tisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei Mahlzeiten lag man damals gewöhnlich auf Polstern an einem niedrigen Tisch, statt aufrecht auf Stühlen zu sitzen.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: bat
  rationale: Das Imperfekt bezeichnet hier eine in der Vergangenheit erfolgende Bitte; im natürlichen Deutschen gibt das Präteritum „bat“ den Einladungsvorgang angemessen wieder, ohne eine wiederholte Bitte vorauszusetzen.
- source_word: δέ
  choice: unmarkiert
  rationale: Die schwache fortführende Konjunktion wird im Deutschen durch den Erzählfluss ausreichend ausgedrückt; ein einleitendes „nun“ würde einen stärkeren zeitlichen oder gliedernden Akzent nahelegen.
- source_word: τις … τῶν Φαρισαίων
  choice: Einer der Pharisäer
  rationale: Dies bildet die partitive Konstruktion idiomatisch und genau ab.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: mit ihm zu essen
  rationale: Der deutsche Infinitiv mit „zu“ gibt den Inhalt beziehungsweise Zweck der Bitte natürlich wieder.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: Jesus ging in das Haus des Pharisäers
  rationale: Der vorzeitige Aoristpartizip wird als natürlicher deutscher Hauptsatz wiedergegeben. Der implizite Bezug von αὐτόν wird zur Klarheit mit „Jesus“ ausgedrückt.
- source_word: κατεκλίθη
  choice: legte sich zum Essen nieder
  rationale: Die Form bezeichnet das Einnehmen der damals üblichen liegenden Haltung bei einer Mahlzeit. Diese Wiedergabe bewahrt das konkrete Bild und macht den Mahlzeitsinn deutlich.
