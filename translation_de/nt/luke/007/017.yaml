source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: de
  text: Und diese Nachricht über ihn verbreitete sich in ganz Judäa und im gesamten Umland.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Bericht über ihn“ oder „dieses Wort über ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: verbreitete sich
  rationale: Bei einer Nachricht bezeichnet ἐξέρχομαι idiomatisch deren Ausbreitung. „Verbreitete sich“ gibt diesen Sinn im modernen Deutschen natürlicher wieder als das formal nähere „ging hinaus“.
- source_word: ὁ λόγος οὗτος
  choice: diese Nachricht
  rationale: λόγος meint hier den umlaufenden Bericht über Jesu Tat. „Nachricht“ ist im Kontext natürlich und bewahrt durch die Fußnote die mögliche Wiedergabe als „Bericht“ oder „Wort“.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: in ganz Judäa
  rationale: Die Formulierung gibt die umfassende räumliche Verbreitung klar und idiomatisch wieder.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: περί mit Genitiv bedeutet hier „über“ beziehungsweise „von“ einer Person; „über ihn“ ist die direkteste natürliche Wiedergabe.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: im gesamten Umland
  rationale: Die substantivierte περίχωρος bezeichnet das umliegende Gebiet. „Umland“ ist knapp, modern und vermeidet eine unnötig administrative Färbung.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die Koordination der beiden geografischen Bereiche wird durch das einfache „und“ natürlich wiedergegeben; das erste καί verbindet den Vers zugleich mit dem vorausgehenden Geschehen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „verbreitete sich“ wird gegenüber dem wörtlicheren „ging hinaus“ bevorzugt; die Bedeutungsbreite von λόγος bleibt in der Fußnote sichtbar.
