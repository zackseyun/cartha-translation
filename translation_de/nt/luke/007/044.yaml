source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: de
  text: 'Und er wandte sich der Frau zu und sagte zu Simon: »Siehst du diese Frau? Ich kam in dein Haus; du hast mir kein Wasser für die Füße gegeben[a]. Sie aber hat meine Füße mit ihren Tränen benetzt und sie mit ihren Haaren abgewischt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Du hast mir kein Wasser auf die Füße gegeben.« Gemeint ist die übliche Bereitstellung von Wasser zum Waschen der Füße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: wandte er sich der Frau zu
  rationale: Gibt das vorzeitige Sichzuwenden des Aoristpartizips in natürlichem deutschem Erzählstil wieder und bewahrt die körperliche Ausrichtung auf die Frau.
- source_word: τῷ Σίμωνι ἔφη
  choice: sagte zu Simon
  rationale: "Idiomat\uFEFFische Wiedergabe der Erzählaussage; der Adressat Simon bleibt ausdrücklich genannt."
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Siehst du diese Frau?
  rationale: Bewahrt die direkte rhetorische Frage und die hervorhebende Funktion des Demonstrativpronomens ταύτην.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Ich kam in dein Haus
  rationale: Natürliche und quellennahe Wiedergabe des Aorists; οἰκία wird konkret mit „Haus“ übersetzt.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: du hast mir kein Wasser für die Füße gegeben
  rationale: Bewahrt die ausdrückliche Gabe von Wasser, ohne den Waschvorgang in den Haupttext hineinzulesen; „für die Füße“ vermittelt den gemeinten Zweck idiomatisch.
- source_word: αὕτη δὲ
  choice: Sie aber
  rationale: Stellt den ausdrücklichen Kontrast zwischen Simon und der Frau knapp und deutlich heraus.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: hat meine Füße mit ihren Tränen benetzt
  rationale: „Benetzt“ gibt βρέχω präzise und würdig wieder; die instrumentale Funktion des Dativs erscheint als „mit ihren Tränen“.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: mit ihren Haaren abgetrocknet
  rationale: Gibt ἐκμάσσω als Abwischen beziehungsweise Trocknen wieder; das ausgelassene Objekt ist im Deutschen eindeutig auf die Füße bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Anrede „du“ entspricht der singularischen Anrede an Simon. Der Kontrast wird durch „Sie aber“ bewahrt; weder das Fußwaschen selbst noch weitere kulturelle oder theologische Deutungen werden in den Haupttext eingefügt.
