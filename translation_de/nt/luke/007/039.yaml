source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: de
  text: 'Als der Pharisäer, der ihn eingeladen hatte, das sah, sagte er sich: „Wenn dieser Mann ein Prophet wäre, wüsste er, wer diese Frau ist, die ihn berührt, und was für eine Frau sie ist – denn sie ist eine Sünderin.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und was für eine Frau sie ist, dass sie eine Sünderin ist.“ Das Griechische hebt sowohl ihre Identität als auch ihre Art beziehungsweise ihren Ruf hervor. Der letzte Satz kann entweder angeben, was Jesus über sie wissen müsste, oder die Einschätzung der Frau begründen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Als … das sah
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der Haupthandlung. „Das“ nimmt natürlich auf das unmittelbar zuvor geschilderte Geschehen Bezug; δέ wird durch den flüssigen Erzählanschluss mitgetragen.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: der Pharisäer, der ihn eingeladen hatte
  rationale: καλέω bedeutet im Zusammenhang des Gastmahls „einladen“. Das Plusquamperfekt verdeutlicht, dass die Einladung dem hier geschilderten Geschehen vorausging.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: sagte er sich
  rationale: Die Wendung bezeichnet inneres Reden. Die deutsche Formulierung gibt den Sinn wieder, ohne εἶπεν und λέγων unnötig doppelt abzubilden.
- source_word: Οὗτος
  choice: dieser Mann
  rationale: Das Demonstrativpronomen bezeichnet Jesus mit einer distanzierenden, möglicherweise geringschätzigen Färbung, die „dieser Mann“ im Deutschen erkennen lässt.
- source_word: εἰ ἦν προφήτης … ἐγίνωσκεν ἂν
  choice: Wenn dieser Mann ein Prophet wäre, wüsste er
  rationale: Die Konstruktion mit Imperfekt und ἄν drückt die skeptische, als irreal vorgestellte Bedingung des Pharisäers aus. Der deutsche Konjunktiv II bildet dies natürlich ab.
- source_word: τίς καὶ ποταπή
  choice: wer und was für eine Frau
  rationale: Die beiden Fragewörter heben sowohl die Identität als auch die Art, den Charakter oder den Ruf der Frau hervor.
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: die ihn gerade berührt
  rationale: Das Präsens beschreibt den in der Szene andauernden Kontakt. „Gerade“ macht diesen Verlaufsaspekt im Deutschen deutlich.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: denn sie ist eine Sünderin
  rationale: 'ὅτι kann hier begründend verstanden werden: Ihr Ruf als Sünderin erklärt das Urteil des Pharisäers. Die alternative inhaltliche Zuordnung bleibt in der Fußnote erhalten.'
theological_decisions:
- issue: Aussage des Pharisäers über Jesu prophetische Identität
  choice: 'Irreal-skeptisch: „Wenn dieser Mann ein Prophet wäre, wüsste er …“'
  alternative: 'Neutraler: „Wenn dieser Mann ein Prophet ist, müsste er wissen …“'
  rationale: Die griechische Bedingungskonstruktion gibt die skeptische Annahme des Pharisäers wieder. Die Übersetzung bewahrt die erzählerische Spannung, ohne sein Urteil zu bestätigen.
- issue: Bezug von ὅτι ἁμαρτωλός ἐστιν
  choice: 'Begründung des Urteils: „denn sie ist eine Sünderin“'
  alternative: 'Inhalt dessen, was Jesus wissen müsste: „dass sie eine Sünderin ist“'
  rationale: Beide syntaktischen Bezüge sind möglich. Die Hauptfassung liest die Aussage begründend; die Fußnote hält die andere Deutung ausdrücklich offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Sagte er sich“ bewahrt den Gedanken innerer Rede; „dieser Mann“ erhält die distanzierende Färbung des griechischen Demonstrativpronomens.
