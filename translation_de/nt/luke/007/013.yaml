id: LUK.7.13
reference: Luke 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: de
  text: 'Und als der Herr sie sah, empfand er tiefes Mitgefühl für sie und sagte zu ihr: »Weine nicht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hör auf zu weinen.« Der griechische Ausdruck kann entweder als allgemeines Verbot oder als Aufforderung verstanden werden, mit dem gegenwärtigen Weinen aufzuhören.'
    reason: Lexikalisch-aspektuelle Alternative beim verneinten Präsensimperativ Μὴ κλαῖε.
lexical_decisions:
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das Aoristpartizip von ὁράω bezeichnet hier eine der Haupthandlung vorausgehende Wahrnehmung. Ein temporaler Nebensatz ist im Deutschen natürlich und gibt den zeitlichen Bezug klar wieder.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: κύριος fungiert in Lukas’ Erzählung hier als hervorgehobene Bezeichnung für Jesus. »Der Herr« bewahrt diesen christologischen Titel, ohne ihn weiter auszudeuten.
- source_word: ἐσπλαγχνίσθη
  choice: empfand … tiefes Mitgefühl
  rationale: σπλαγχνίζομαι bezeichnet ein starkes, innerlich bewegendes Erbarmen. »Tiefes Mitgefühl empfinden« ist gegenwärtiges, würdiges Deutsch und erhält die emotionale Intensität.
- source_word: ἐπ’ αὐτῇ
  choice: für sie
  rationale: ἐπί mit Dativ bezeichnet bei σπλαγχνίζομαι die Person, der das Mitgefühl gilt. »Für sie« ist dafür eine natürliche deutsche Formulierung.
- source_word: εἶπεν αὐτῇ
  choice: sagte zu ihr
  rationale: Die Formulierung entspricht dem gewöhnlichen Sinn von λέγω und vermeidet die stärkere, stärker direktive Nuance von »forderte sie auf«.
- source_word: Μὴ κλαῖε
  choice: Weine nicht
  rationale: Der verneinte Präsensimperativ kann entweder allgemein verbieten zu weinen oder zum Aufhören des bereits stattfindenden Weinens auffordern. »Weine nicht« bewahrt diese Offenheit besser als »Hör auf zu weinen«.
theological_decisions:
- issue: κύριος als Bezeichnung für Jesus
  choice: der Herr
  alternative: der Meister
  rationale: Der erzählerische Gebrauch bei Lukas trägt hier eine christologisch hervorgehobene Bedeutung. »Der Herr« erhält diese, während »der Meister« den Titel unnötig abschwächen oder anders bestimmen würde.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, ohne im Deutschen schwerfällig zu wirken; die direkte Rede wahrt die Kürze des Originals.
