  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: de
  text: Und er lehrte in ihren Synagogen und wurde von allen gepriesen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde von allen geehrt“; wörtlicher auch: „wurde von allen verherrlicht“. Das griechische Wort kann öffentliches Lob oder Ehre bezeichnen und gehört zugleich zum Wortfeld der Herrlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der schlichte Anschluss verbindet den Vers mit dem vorausgehenden Bericht, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: αὐτὸς
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen bezieht sich auf Jesus. Eine Wiedergabe mit „er selbst“ würde die im Deutschen nicht notwendigerweise hörbare Betonung zu stark hervorheben.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Präteritum ist in einem deutschen Erzähltext natürlich; im Zusammenhang bezeichnet der Imperfekt eine fortdauernde beziehungsweise wiederholte Lehrtätigkeit.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: in ihren Synagogen
  rationale: Die Wendung gibt den Ort und das Genitivpronomen unmittelbar wieder; gemeint sind im Kontext die Synagogen der galiläischen Bevölkerung.
- source_word: δοξαζόμενος
  choice: wurde … gepriesen
  rationale: In diesem Zusammenhang bezeichnet δοξάζω die öffentliche Anerkennung und das Lob, das Jesus erfuhr. „Gepriesen“ ist natürlich und würdig, während „verherrlicht“ im heutigen Deutsch leicht eine stärkere kultische oder göttliche Bedeutung nahelegt.
- source_word: ὑπὸ πάντων
  choice: von allen
  rationale: ὑπό mit dem Genitiv kennzeichnet die Handelnden. „Von allen“ bewahrt die knappe, umfassende Aussage des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von δοξαζόμενος in Bezug auf Jesus
  choice: wurde von allen gepriesen
  alternative: wurde von allen verherrlicht / geehrt
  rationale: Das Passivpartizip kann „verherrlicht“, „geehrt“ oder „gepriesen“ bedeuten. Der unmittelbare Zusammenhang beschreibt die breite positive Aufnahme von Jesu Lehre; „gepriesen“ wahrt die starke Sprache öffentlicher Anerkennung, ohne eine über den Kontext hinausgehende kultische Aussage festzulegen. Die Alternativen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzkoordination folgt dem schlichten Erzählstil des Griechischen. Das Partizip wurde als koordinierter finiter Satz wiedergegeben, da dies im Deutschen natürlicher ist; der fortlaufende beziehungsweise wiederholte Charakter des Lehrens ergibt sich aus dem Kontext.
