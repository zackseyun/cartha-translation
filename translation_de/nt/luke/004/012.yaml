id: LUK.4.12
reference: Luke 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: de
  text: 'Und Jesus antwortete ihm: „Es heißt[a]: Du sollst den Herrn, deinen Gott, nicht auf die Probe stellen.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird hier oft „Es steht geschrieben“ übersetzt. Im Griechischen heißt es wörtlich „Es ist gesagt“.
    reason: alternative_reading
  - marker: b
    text: Zitat aus 5. Mose 6,16. Im hebräischen Text steht dort der Gottesname JHWH, der häufig mit „der HERR“ wiedergegeben wird.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: antwortete
  rationale: Die Verbindung aus Partizip und finitem Verb ist eine semitisch geprägte griechische Antwortformel. „Antwortete“ gibt sie in natürlichem modernem Deutsch vollständig wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Dativpronomen bezieht sich im Kontext auf den Versucher und wird regulär mit „ihm“ wiedergegeben.
- source_word: ὅτι
  choice: —
  rationale: Nach „antwortete ihm“ kann der Inhalt im Deutschen unmittelbar als direkte Rede folgen; ein ausdrückliches „dass“ wäre hier unidiomatisch.
- source_word: Εἴρηται
  choice: Es heißt
  rationale: Das Perfekt Passiv von λέγω bedeutet in dieser Zitierformel sinngemäß „es ist gesagt“ beziehungsweise „es steht als Aussage fest“. „Es heißt“ ist im Deutschen eine natürliche, würdevolle Formel für ein maßgebliches Zitat und bleibt näher am Verb des Sagens als das traditionelle „Es steht geschrieben“.
- source_word: Οὐκ ἐκπειράσεις
  choice: Du sollst … nicht auf die Probe stellen
  rationale: ἐκπειράζω bezeichnet ein Erproben oder Herausfordern. „Auf die Probe stellen“ ist verständlich und vermeidet die mögliche Fehlbedeutung, Gott zur Sünde verführen zu wollen.
- source_word: κύριον
  choice: den Herrn
  rationale: κύριος wird als „Herr“ wiedergegeben; der Akkusativ mit Artikel verlangt hier „den Herrn“.
- source_word: τὸν θεόν σου
  choice: deinen Gott
  rationale: Die Apposition wird idiomatisch als „den Herrn, deinen Gott“ wiedergegeben und bewahrt die Bundesformulierung des Zitats.
theological_decisions:
- issue: Schriftzitat-Formel Εἴρηται
  choice: Es heißt
  alternative: Es steht geschrieben; Es ist gesagt
  rationale: Der griechische Text verwendet das Verb λέγω („sagen“), nicht γράφω („schreiben“). Die Hauptfassung wahrt diesen Befund in natürlichem Deutsch; die traditionelle Formel wird in einer Fußnote genannt.
- issue: κύριος im Zitat aus 5. Mose 6,16
  choice: den Herrn
  alternative: JHWH; den HERRN
  rationale: Die unmittelbare griechische Vorlage hat κύριος. Dass in der hebräischen Ausgangsstelle der Gottesname JHWH steht, wird als wichtiger quellenbezogener Hinweis in der Fußnote bewahrt, ohne die griechische Form im Haupttext zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Es heißt“ vermeidet Archaismus und hält zugleich die autoritative Zitierformel fest. Die Zeichensetzung bei „den Herrn, deinen Gott“ macht die Apposition klar.
