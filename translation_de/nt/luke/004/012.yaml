review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt καὶ ἀποκριθεὶς εἶπεν αὐτῷ idiomatisch mit „Und Jesus antwortete ihm“ wieder. „Es heißt“ ist eine sachgerechte, natürliche Wiedergabe von Εἴρηται und wahrt den Unterschied zu „Es steht geschrieben“. „Du sollst den Herrn, deinen Gott, nicht auf die Probe stellen“ entspricht dem Verbot Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου vollständig; die Apposition ist korrekt markiert.
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die direkte Rede und Zeichensetzung sind idiomatisch.
  terminology: „Herr“ folgt dem griechischen κύριος, während die Fußnote den hebräischen Gottesnamen der deuteronomischen Vorlage sachlich dokumentiert. „Auf die Probe stellen“ trifft ἐκπειράζω klar und vermeidet das im Deutschen missverständliche „versuchen“. Die Fußnotenanker stehen jeweils an den sachlich passenden Stellen und entsprechen dem englischen Audit Trail.
