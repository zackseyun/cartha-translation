  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: de
  text: Er trat zu ihr und stellte sich über sie. Er wies das Fieber zurecht, und es verließ sie. Sofort stand sie auf und begann, ihnen zu dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: Er trat zu ihr und beugte sich über sie
  rationale: Die Wendung beschreibt Jesu unmittelbare Annäherung und seine Stellung über der liegenden Frau. Die deutsche Formulierung gibt die konkrete Szene natürlich wieder, ohne ein Bett oder eine andere im Text nicht genannte Einzelheit hinzuzufügen.
- source_word: ἐπετίμησεν
  choice: wies … scharf zurecht
  rationale: Die Formulierung bewahrt den nachdrücklichen, autoritativen Sinn von ἐπιτιμάω und bleibt im modernen Deutsch auch mit „Fieber“ als Objekt verständlich.
- source_word: τῷ πυρετῷ
  choice: das Fieber
  rationale: Das Fieber selbst ist ausdrücklich das Objekt des Zurechtweisens. Dadurch bleibt Lukas’ auffällige Darstellung erhalten, ohne eine dämonische Ursache zu behaupten.
- source_word: ἀφῆκεν αὐτήν
  choice: es verließ sie
  rationale: Das unausgesprochene Subjekt ist das Fieber. Die knappe Formulierung wahrt diese grammatische Verknüpfung und die unmittelbare Wirkung.
- source_word: παραχρῆμα
  choice: Sofort
  rationale: „Sofort“ bringt die von Lukas betonte Unmittelbarkeit in klarem, heutigem Deutsch zum Ausdruck.
- source_word: ἀναστᾶσα
  choice: stand sie auf
  rationale: Die natürliche deutsche Verbform gibt ihre unverzügliche körperliche Reaktion wieder.
- source_word: διηκόνει αὐτοῖς
  choice: begann, sie zu bedienen
  rationale: „Begann“ gibt den möglichen inchoativen Aspekt des Imperfekts wieder; „bedienen“ bezeichnet hier verständlich ihren praktischen Dienst an den Anwesenden, ohne kirchliche Nebenbedeutungen einzutragen.
theological_decisions:
- issue: Ob Jesu Zurechtweisung des Fiebers eine Personifizierung oder dämonische Verursachung voraussetzt
  choice: Die direkte Aussage „wies … das Fieber scharf zurecht“ wird beibehalten.
  alternative: Er gebot, dass das Fieber weichen sollte.
  rationale: Der griechische Text nennt das Fieber selbst als Gegenstand der Zurechtweisung. Die Übersetzung bewahrt diese Spannung und Jesu Autorität, ohne die Krankheit ausdrücklich zu personalisieren oder dämonologisch zu erklären.
translation_notes:
  register: Modernes, würdevolles und allgemein verständliches Standarddeutsch. Die ungewöhnliche Verbindung von „zurechtweisen“ und „Fieber“ bleibt bewusst erhalten, weil sie für die Darstellung des Ausgangstextes wesentlich ist.
