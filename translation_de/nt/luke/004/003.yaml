  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: de
  text: 'Da sagte der Teufel zu ihm: „Wenn du der Sohn Gottes bist[a], dann sag diesem Stein, er soll zu Brot werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da du der Sohn Gottes bist.“ Die griechische Bedingung kann so verstanden werden, dass die Voraussetzung für die Herausforderung als gegeben angenommen wird; der Haupttext bewahrt jedoch die Bedingungsform.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Da
  rationale: δὲ ist hier ein leichter erzählerischer Anschluss. „Da“ gibt die zeitliche Fortführung im modernen Deutschen natürlich wieder, ohne die Verbindung zu stark zu markieren.
- source_word: διάβολος
  choice: der Teufel
  rationale: διάβολος dient in diesem Zusammenhang als geläufige persönliche Bezeichnung; „der Teufel“ ist die klare und übliche deutsche Wiedergabe.
- source_word: Εἰ
  choice: Wenn
  rationale: εἰ leitet formal eine Bedingung ein. „Wenn“ bewahrt die Herausforderung und lässt offen, ob der Sprecher die Voraussetzung rhetorisch als gegeben annimmt.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Das artikellose Prädikatsnomen ist in diesem christologischen Kontext qualitativ beziehungsweise bestimmt zu verstehen; „der Sohn Gottes“ gibt den erkennbaren Titel angemessen wieder.
- source_word: εἰπὲ
  choice: sag
  rationale: Der Imperativ von λέγω bezeichnet hier eine sprachliche Aufforderung an den Stein. „Sag diesem Stein“ bleibt näher am Grundverb als das stärker deutende „befiehl“.
- source_word: τῷ λίθῳ τούτῳ
  choice: diesem Stein
  rationale: λίθος bezeichnet gewöhnlich einen Stein; der Demonstrativbezug τούτῳ wird ausdrücklich beibehalten.
- source_word: ἵνα γένηται
  choice: er soll zu … werden
  rationale: Nach einem Verb des Sagens kann ἵνα mit Konjunktiv den Inhalt der Äußerung bezeichnen. Die deutsche Konstruktion „sag …, er soll … werden“ ist natürlich und wahrt den sprachlichen Befehlscharakter.
- source_word: ἄρτος
  choice: Brot
  rationale: ἄρτος bedeutet hier schlicht „Brot“. „Brotlaib“ wäre spezifischer und „Nahrung“ allgemeiner als der griechische Ausdruck.
theological_decisions:
- issue: Aussagekraft der Bedingung εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Wenn du der Sohn Gottes bist
  alternative: Da du der Sohn Gottes bist
  rationale: Die Hauptübersetzung bewahrt die grammatische Bedingungsform und damit die Spannung der Versuchung, ohne Jesu Sohnschaft zu bestreiten oder die rhetorische Nuance festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist idiomatisch formuliert; „sag …, er soll“ vermeidet sowohl eine hölzerne Konstruktion als auch die interpretative Verstärkung durch „befiehl“.
