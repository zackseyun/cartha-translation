id: LUK.4.41
reference: Luke 4:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: de
  text: 'Auch aus vielen Menschen fuhren Dämonen aus. Sie schrien und sagten: „Du bist der Sohn Gottes!“ Doch er wies sie zurecht und ließ sie nicht reden, weil sie wussten, dass er der Messias[a] war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Das griechische Wort Χριστός bedeutet „Messias“ beziehungsweise „Gesalbter“.'
    reason: Alternative Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: δαιμόνια
  choice: Dämonen
  rationale: Das Substantiv bezeichnet unmittelbar Dämonen; „unreine Geister“ wäre eine andere griechische Wendung.
- source_word: ἐξήρχετο
  choice: fuhren … aus
  rationale: Das Imperfekt beschreibt einen fortlaufenden oder wiederholten Vorgang. Die im Deutschen übliche Wendung „aus jemandem ausfahren“ gibt den Vorgang klar wieder.
- source_word: ἀπὸ πολλῶν
  choice: aus vielen Menschen
  rationale: Im Griechischen bleibt die Bezugsgröße unausgesprochen; der Kontext verlangt Menschen. Die Ergänzung ist im Deutschen für eine natürliche und eindeutige Formulierung nötig.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: Sie schrien und sagten
  rationale: Die beiden Partizipien werden als koordinierte Verben wiedergegeben. So bleiben sowohl die Lautstärke des Ausrufs als auch die Einleitung der wörtlichen Rede erhalten.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: der Sohn Gottes
  rationale: Die feste Titelform bewahrt das christologische Gewicht und entspricht natürlichem, allgemein verständlichem Deutsch.
- source_word: ἐπιτιμῶν
  choice: wies sie zurecht
  rationale: Die Form bezeichnet ein autoritatives, scharfes Zurechtweisen; die gewählte Formulierung ist gegenwärtiges, würdiges Deutsch.
- source_word: οὐκ εἴα
  choice: ließ sie nicht
  rationale: Das Imperfekt kann eine fortgesetzte oder wiederholte Verweigerung ausdrücken. Im Zusammenhang gibt die deutsche Präteritumsform dies natürlich wieder, ohne die Aspektbedeutung zu überzeichnen.
- source_word: ᾔδεισαν
  choice: sie wussten
  rationale: Die stative Vergangenheitsbedeutung von οἶδα wird im Deutschen idiomatisch mit dem Präteritum ausgedrückt.
- source_word: τὸν χριστόν
  choice: der Messias
  rationale: Χριστός ist hier ein Titel und bezeichnet den Gesalbten; „Messias“ macht diese Titelfunktion im Deutschen deutlich.
- source_word: αὐτὸν εἶναι
  choice: dass er … war
  rationale: Der Akkusativ mit Infinitiv nach dem Verb des Wissens wird im Deutschen natürlich als dass-Satz wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Χριστός in der Identifizierung Jesu
  choice: Messias
  alternative: Christus
  rationale: Der Ausdruck fungiert hier als Titel, nicht bloß als nameähnliche Bezeichnung. Die geläufige Alternative „Christus“ wird in einer Fußnote bewahrt.
- issue: Verhältnis der Titel „Sohn Gottes“ und „Messias“
  choice: Beide Titel bleiben als unterschiedliche Aussagen erhalten
  alternative: Die beiden Titel zu einer erklärenden Bezeichnung zusammenziehen
  rationale: Die Dämonen nennen Jesus „Sohn Gottes“, während der Erzähler ihr Wissen so beschreibt, dass er der Messias ist. Die Übersetzung wahrt diese verwandten, aber nicht identischen Formulierungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „schrien und sagten“ spiegelt die beiden griechischen Partizipien, ohne den Ausruf abzuschwächen. Der implizite menschliche Bezug von ἀπὸ πολλῶν wird aus Gründen der deutschen Verständlichkeit ausdrücklich genannt.
