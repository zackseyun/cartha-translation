  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: die vielen Aussätzigen in Israel, die Zeitangabe zu Elisa dem Propheten, die ausnahmslose Verneinung und Naaman als einzigen syrischen Ausnahmefall. „Wurde rein“ bewahrt die Reinigungssprache von ἐκαθαρίσθη, ohne sie auf bloße medizinische Heilung zu reduzieren.'
  naturalness: Der Satz ist flüssiges, würdiges modernes Standarddeutsch. Das Semikolon und „doch“ machen den im Deutschen naheliegenden Kontrast deutlich, ohne dem Text zusätzliche Aussagen einzutragen. Der Dativ nach „außer“ in „Naaman, dem Syrer“ ist grammatisch möglich und die Apposition ist korrekt gesetzt.
  terminology: „Aussätzige“ und „wurde rein“ sind im gegenwärtigen bibelsprachlichen Register verständlich und erhalten die sachliche Verbindung von Aussatz und Reinigung. „Elisa“, „Naaman“ und „der Syrer“ sind korrekt und konsistent wiedergegeben.
