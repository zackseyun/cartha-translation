id: LUK.4.27
reference: Luke 4:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: de
  text: Und viele Aussätzige lebten zur Zeit des Propheten Elisa in Israel; doch keiner von ihnen wurde rein, außer Naaman, dem Syrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: Aussätzige
  rationale: Die substantivische Bezeichnung entspricht knapp dem biblischen Sprachgebrauch für Menschen mit einer als Aussatz bezeichneten Hautkrankheit. Sie bewahrt zudem den Zusammenhang mit dem anschließenden Reinwerden.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: in Israel
  rationale: Die Wendung bezeichnet am natürlichsten den räumlichen beziehungsweise gesellschaftlichen Bereich, ohne ausdrücklich zwischen Land und Volk zu entscheiden.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: zur Zeit des Propheten Elisa
  rationale: ἐπί mit Genitiv hat hier zeitliche Bedeutung. Die gewählte Formulierung ist im modernen Deutsch natürlich und gibt zugleich Titel und Namen klar wieder.
- source_word: ἐκαθαρίσθη
  choice: wurde rein
  rationale: Die Wiedergabe erhält sowohl die körperliche als auch die kultische Dimension des Verbs καθαρίζω und vermeidet die Verengung auf bloße Heilung.
- source_word: εἰ μὴ
  choice: außer
  rationale: Die Verbindung führt hier eindeutig die einzige Ausnahme zu der vorausgehenden Verneinung ein.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Naaman, dem Syrer
  rationale: Der Dativ ist durch die deutsche Konstruktion nach „außer“ bedingt. Die ethnische Bezeichnung bleibt als identifizierende Apposition erhalten und betont, dass Naaman ein Syrer war.
theological_decisions:
- issue: Bedeutung der Reinigungssprache beim Aussatz
  choice: ἐκαθαρίσθη wird mit „wurde rein“ wiedergegeben.
  alternative: wurde geheilt; wurde gereinigt
  rationale: „Wurde rein“ bewahrt die im biblischen Kontext zugleich körperliche und kultische Bedeutung, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Gewicht von Naamans ethnischer Bezeichnung
  choice: Die Bezeichnung „dem Syrer“ bleibt ausdrücklich im Haupttext.
  alternative: einem Syrer
  rationale: Der griechische Artikel kennzeichnet Naaman identifizierend. Die Formulierung erhält die rhetorische Spannung, dass gerade der bekannte Ausländer und nicht einer der vielen Aussätzigen in Israel rein wurde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aussätzige“ und „wurde rein“ halten bewusst den biblischen Sach- und Sprachzusammenhang zusammen. Das Semikolon strukturiert den Gegensatz natürlich; „doch“ gibt die adversative Wirkung des zweiten καί im Deutschen idiomatisch wieder.
