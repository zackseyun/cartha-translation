id: LUK.4.26
reference: Luke 4:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: de
  text: Und zu keiner von ihnen wurde Elia gesandt, sondern nur nach Sarepta im Gebiet von Sidon zu einer Witwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sarepta wird im Alten Testament Zarefat genannt (1. Könige 17,9).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: wurde gesandt
  rationale: Das Passiv bewahrt den im Griechischen nicht ausdrücklich genannten, im Zusammenhang jedoch vorausgesetzten Handelnden.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: zu keiner von ihnen
  rationale: Gibt die auf Personen gerichtete Präposition und die betonte Verneinung idiomatisch und genau wieder.
- source_word: Ἠλίας
  choice: Elia
  rationale: Eingebürgerte deutsche Namensform.
- source_word: εἰ μὴ
  choice: sondern nur
  rationale: Drückt die ausschließende Ausnahme im Deutschen natürlich aus; ein konditionales „wenn nicht“ wäre hier missverständlich.
- source_word: Σάρεπτα τῆς Σιδωνίας
  choice: Sarepta im Gebiet von Sidon
  rationale: „Sarepta“ folgt der griechischen Ortsnamensform; die Gebietsangabe gibt den zuordnenden Genitiv verständlich wieder, ohne die Stadt mit Sidon selbst gleichzusetzen.
- source_word: πρὸς γυναῖκα χήραν
  choice: zu einer Witwe
  rationale: Natürliche deutsche Wiedergabe der appositionellen Wendung „zu einer Frau, einer Witwe“.
theological_decisions:
- issue: Nicht genannter Sender Elias im Passiv
  choice: „Elia wurde gesandt“; der Handelnde bleibt unausgesprochen
  alternative: „Gott sandte Elia“
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der griechische Text nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sondern nur“ macht den Ausnahmecharakter klar. Der Ortsname bleibt nahe am griechischen Text; die Fußnote stellt die Verbindung zur geläufigen alttestamentlichen Namensform her.
