  source_fidelity: 'Der Text gibt die Satzstruktur und die wesentlichen Beziehungen des Griechischen zuverlässig wieder: Das ungenannte Passiv in „wurde Elia gesandt“ bleibt erhalten; „zu keiner von ihnen“ entspricht πρὸς οὐδεμίαν αὐτῶν; die Ausnahme εἰ μὴ wird idiomatisch durch „sondern nur“ ausgedrückt. „Sarepta im Gebiet von Sidon“ gibt den zuordnenden Genitiv τῆς Σιδωνίας verständlich wieder, ohne Sarepta mit der Stadt Sidon gleichzusetzen. „Zu einer Witwe“ ist eine natürliche und ausreichende Wiedergabe von πρὸς γυναῖκα χήραν.'
