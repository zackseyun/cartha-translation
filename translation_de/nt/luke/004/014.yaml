  naturalness: Die Übersetzung ist insgesamt modernes, würdiges Standarddeutsch. „Und“ ist hier ebenso natürlich wie „Da“ und zugleich quellentreuer. „In der ganzen umliegenden Gegend“ ist idiomatisch und verdeutlicht den geographischen Bezug.
