reference: Luke 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: de
  text: Und Jesus kehrte in der Kraft des Geistes nach Galiläa zurück. Und die Nachricht über ihn verbreitete sich in der ganzen umliegenden Gegend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Nachricht“ auch: „Kunde“, „Ruf“ oder „Gerücht“. Das griechische Wort bezeichnet etwas, das weithin über jemanden bekannt wird, ohne eindeutig zu sagen, ob es positiv oder negativ ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: kehrte … zurück
  rationale: Das Verb bezeichnet in der erzählenden Bewegung die Rückkehr. Die deutsche Verbklammer ist natürlich und bewahrt die Richtungsbedeutung.
- source_word: ἐν τῇ δυνάμει
  choice: in der Kraft
  rationale: Die formal nahe Wiedergabe lässt offen, ob vor allem Sphäre, Begleitung oder Befähigung gemeint ist, und vermeidet eine einseitig instrumentale Deutung.
- source_word: τοῦ πνεύματος
  choice: des Geistes
  rationale: Der unmittelbare Kontext weist auf Gottes Heiligen Geist; da ἁγίου hier nicht steht, wird „heilig“ im Haupttext nicht ergänzt.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: „Nach“ ist bei der Bewegung zu einer geografischen Region idiomatisches Standarddeutsch.
- source_word: φήμη
  choice: die Nachricht
  rationale: φήμη bezeichnet eine sich verbreitende Kunde oder Nachricht, ohne von sich aus eindeutig positive oder negative Wertung. Der bestimmte Artikel ergibt sich im Deutschen natürlich aus der näheren Bestimmung „über ihn“.
- source_word: ἐξῆλθεν
  choice: verbreitete sich
  rationale: Die griechische Bewegungsmetapher „ging hinaus“ bezeichnet idiomatisch das Bekanntwerden in einer Region. „Verbreitete sich“ ist im Deutschen klarer und natürlich, ohne den Sinn auszuweiten.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: in der ganzen Umgebung
  rationale: Die Formulierung gibt die flächendeckende Ausbreitung in dem umliegenden Gebiet in natürlichem Deutsch wieder.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: Dies ist die übliche moderne Wiedergabe von περί mit Genitiv in diesem Zusammenhang.
theological_decisions:
- issue: Bezug von πνεύματος
  choice: „des Geistes“ bezieht sich im Kontext auf den Heiligen Geist
  alternative: ein nicht näher bestimmter Geist oder Jesu eigener Geist
  rationale: Die vorausgehenden Verse von Lukas 4 nennen ausdrücklich den Heiligen Geist und beschreiben dessen Wirken an Jesus. Die Übersetzung wahrt dennoch die nicht erweiterte Form des griechischen Ausdrucks und fügt „Heiligen“ nicht hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bleibt nah an der griechischen Formulierung; im zweiten Satz wird die griechische Bewegungsmetapher idiomatisch als „verbreitete sich“ wiedergegeben. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen Schlüsselbegriff er sich bezieht.
