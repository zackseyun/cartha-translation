id: LUK.4.4
reference: Luke 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: de
  text: 'Und Jesus antwortete ihm: „Es steht geschrieben: ‚Der Mensch wird nicht vom Brot allein leben.‘“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus zitiert 5. Mose 8,3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: antwortete ihm
  rationale: Die Verbindung von ἀποκρίνομαι mit πρός und Akkusativ wird im Deutschen natürlich mit „jemandem antworten“ wiedergegeben.
- source_word: Γέγραπται
  choice: Es steht geschrieben
  rationale: Die im Deutschen geläufige Schriftzitationsformel bewahrt den perfektischen Sinn eines geschriebenen und weiterhin gültigen Wortes.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet hier den Wortlaut des Zitats ein; ein Doppelpunkt ist im modernen Deutschen natürlicher als ein ausdrückliches „dass“.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: vom Brot allein
  rationale: Bei ζήσεται bezeichnet ἐπί die Lebensgrundlage. „Vom Brot allein leben“ ist idiomatisch und entspricht zugleich dem vertrauten Wortlaut des Schriftzitats.
- source_word: ζήσεται
  choice: lebt
  rationale: Das deutsche Präsens gibt in einem allgemeinen Grundsatz die zeitübergreifende Aussage des griechischen Futurs natürlich wieder; „wird leben“ wäre formnäher, klingt hier aber weniger idiomatisch.
- source_word: ὁ ἄνθρωπος
  choice: der Mensch
  rationale: „Der Mensch“ bewahrt den generischen Singular und bezeichnet im Deutschen eindeutig den Menschen allgemein, ohne auf männliche Personen beschränkt zu sein.
theological_decisions:
- issue: Generischer Singular ὁ ἄνθρωπος im Zitat aus Deuteronomium 8,3
  choice: der Mensch
  alternative: ein Mensch / der Mensch wird nicht vom Brot allein leben
  rationale: Die Formulierung wahrt den repräsentativen Singular und den Bezug auf die Menschheit allgemein, ohne eine konfessionelle Deutung einzutragen.
- issue: Umfang des alttestamentlichen Zitats
  choice: Nur der im SBLGNT überlieferte Wortlaut wird als direkte Rede zitiert
  alternative: Ergänzung der Fortsetzung aus Deuteronomium 8,3
  rationale: Lukas 4,4 enthält in dieser Textausgabe nur den ersten Satzteil; die bekannte Fortsetzung wird daher nicht aus Deuteronomium in den Haupttext importiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Wendung „Der Mensch lebt nicht vom Brot allein“ ist natürlich verständlich und bewahrt den allgemeinen Sinn des Schriftzitats. Verschachtelte Anführungszeichen kennzeichnen das Zitat innerhalb der Rede Jesu.
