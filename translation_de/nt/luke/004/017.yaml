id: LUK.4.17
reference: Luke 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: de
  text: 'Und die Schriftrolle des Propheten Jesaja wurde ihm gereicht.[a] Er rollte die Schriftrolle auf und fand die Stelle, an der geschrieben stand:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Buch“. Das griechische Wort βιβλίον kann allgemein ein Schriftstück oder Buch bezeichnen; in diesem Synagogenzusammenhang ist jedoch sehr wahrscheinlich eine Schriftrolle gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: wurde ihm gereicht
  rationale: Das Passiv bezeichnet das Übergeben eines Gegenstands. „Wurde ihm gereicht“ passt natürlich zur Lesung in der Synagoge, ohne eine stärkere Bedeutung wie „ausgeliefert“ einzutragen.
- source_word: βιβλίον
  choice: Schriftrolle
  rationale: βιβλίον kann allgemein ein Schriftstück oder Buch bezeichnen; im Synagogengottesdienst des ersten Jahrhunderts ist hier sehr wahrscheinlich eine Schriftrolle gemeint.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: des Propheten Jesaja
  rationale: Die Genitivverbindung bezeichnet den Inhalt beziehungsweise die Zuordnung der Schriftrolle und bewahrt zugleich Jesajas Bezeichnung als Prophet.
- source_word: ἀναπτύξας
  choice: Er rollte ... auf
  rationale: Das Aoristpartizip beschreibt eine Handlung, die dem Finden vorausgeht. Die finite Satzfolge ist im modernen Deutschen natürlich und gibt den zeitlichen Ablauf klar wieder.
- source_word: εὗρεν
  choice: fand
  rationale: Die schlichte Wiedergabe vermeidet die unbelegte Andeutung einer mühsamen Suche.
- source_word: τὸν τόπον
  choice: die Stelle
  rationale: Im Zusammenhang eines Schrifttextes bezeichnet τόπος die betreffende Textstelle. „Stelle“ ist im Deutschen konkreter und idiomatischer als „Ort“.
- source_word: οὗ ἦν γεγραμμένον
  choice: an der geschrieben stand
  rationale: Die Formulierung gibt die periphrastische Perfektkonstruktion natürlich wieder und leitet die folgende Schriftlesung ein.
theological_decisions: []
