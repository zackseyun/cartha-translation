  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: de
  text: Und er ging hinab nach Kafarnaum, einer Stadt in Galiläa. Und er lehrte sie an den Sabbaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische steht im Plural: »an den Sabbaten«; dies kann auf wiederholte Sabbate hinweisen. Idiomatischer kann auch »am Sabbat« übersetzt werden.'
    reason: Der im Deutschen ungewohnte Plural bewahrt die grammatische Form und die mögliche iterative Bedeutung des griechischen Textes.
lexical_decisions:
- source_word: κατῆλθεν
  choice: ging … hinab
  rationale: Bewahrt die im Verb κατέρχομαι enthaltene Richtungsangabe und gibt den Aorist als erzählendes Präteritum wieder.
- source_word: Καφαρναοὺμ
  choice: Kafarnaum
  rationale: Verwendet die im modernen Deutschen etablierte biblische Namensform.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: einer Stadt in Galiläa
  rationale: Die Apposition steht indefinit; »in Galiläa« gibt den hier lokativ zu verstehenden Genitiv natürlich und genau wieder.
- source_word: ἦν διδάσκων
  choice: lehrte
  rationale: Die periphrastische Imperfektform bezeichnet fortdauerndes beziehungsweise wiederholtes Lehren. Im Deutschen trägt der Zusammenhang mit dem pluralischen »an den Sabbaten« diese iterative Bedeutung natürlicher als die schwerfällige Form »war dabei, sie zu lehren«.
- source_word: αὐτοὺς
  choice: sie
  rationale: Bewahrt das Pronomen ohne einen im Vers nicht ausdrücklich genannten Bezug wie »die Menschen« oder »die Einwohner« einzufügen.
- source_word: ἐν τοῖς σάββασιν
  choice: an den Sabbaten
  rationale: Bewahrt den griechischen Plural und damit den wahrscheinlichen Hinweis auf wiederholte Lehrtätigkeit an mehreren Sabbaten.
theological_decisions:
- issue: Ob der Plural σάββασιν idiomatisch zum Singular geglättet werden soll
  choice: an den Sabbaten
  alternative: am Sabbat
  rationale: Der Plural kann eine wiederholte Praxis bezeichnen. Seine Beibehaltung verhindert, dass die Aussage ungewollt auf einen einzigen Sabbat eingeengt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Dann« verbindet den Vers natürlich mit dem vorangehenden Geschehen. »Dort« löst die griechische Satzreihung idiomatisch auf, ohne neue inhaltliche Angaben einzuführen. Der Plural »Sabbaten« bleibt bewusst erhalten und wird in der Fußnote erläutert.
