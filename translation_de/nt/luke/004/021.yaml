  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: de
  text: 'Da begann er, zu ihnen zu sprechen: »Heute hat sich dieses Schriftwort vor euren Ohren erfüllt.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in euren Ohren«; gemeint ist: während ihr es hört.'
    reason: Der Haupttext gibt die anschauliche griechische Wendung nahezu wörtlich wieder; die Fußnote erläutert ihre idiomatische Bedeutung.
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: Da begann er, zu ihnen zu sagen
  rationale: Die Wendung gibt den Beginn der Rede und die narrative Weiterführung durch δέ eng am Griechischen wieder; „Da“ wirkt im modernen Deutschen natürlicher als ein adversatives „aber“.
- source_word: Σήμερον
  choice: Heute
  rationale: Die vorangestellte Zeitangabe bleibt betont und bewahrt die Unmittelbarkeit der Aussage.
- source_word: πεπλήρωται
  choice: hat sich … erfüllt
  rationale: Das deutsche Perfekt gibt den vollendeten Vorgang mit fortbestehendem Ergebnis wieder; die reflexive Form ist bei der Erfüllung eines Schriftwortes idiomatisch, ohne den nicht genannten Handelnden zu ergänzen.
- source_word: ἡ γραφὴ αὕτη
  choice: dieses Schriftwort
  rationale: Gemeint ist die soeben vorgelesene Schriftstelle. „Schriftwort“ ist präzise und natürlich, ohne den Text ausdrücklich als „Prophezeiung“ auszudeuten.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: vor euren Ohren
  rationale: Die Formulierung bewahrt das konkrete Bild des griechischen Ausdrucks und ist im Deutschen verständlich, wenn auch markiert.
theological_decisions:
- issue: Art und Vermittlung der Erfüllung
  choice: Die Erfüllung des Schriftwortes wird als gegenwärtig vollzogen erklärt, ohne ausdrücklich „durch mich“ oder „in mir“ hinzuzufügen.
  alternative: „Heute hat sich diese Prophezeiung durch mich erfüllt, während ihr sie hört.“
  rationale: Der Zusammenhang legt einen Bezug auf Jesus nahe, doch der griechische Vers nennt weder „Prophezeiung“ noch Jesus ausdrücklich als Mittel oder Handelnden. Die Übersetzung lässt diese theologische Aussagekraft und Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeformel bleibt bewusst etwas feierlich und quellennah. Das Bild der Ohren wird erhalten und in der Fußnote erläutert.
