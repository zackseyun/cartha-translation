id: LUK.4.16
reference: Luke 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: de
  text: Und er kam nach Nazara[a], wo er aufgewachsen war. Wie es seine Gewohnheit war, ging er am Sabbat in die Synagoge und stand auf, um vorzulesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nazaret“. Im Griechischen steht hier Nazara.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Die Wiedergabe folgt unmittelbar der im SBLGNT an dieser Stelle belegten griechischen Namensform Ναζαρά, statt sie stillschweigend an die vertrautere Form „Nazaret“ anzugleichen.
- source_word: τεθραμμένος
  choice: aufgewachsen war
  rationale: Das Perfektpassiv von τρέφω bezeichnet hier die erfolgte Erziehung beziehungsweise das Aufwachsen an diesem Ort. „Aufgewachsen war“ ist im modernen Deutsch natürlich und wahrt den resultativen Sinn.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: Wie es seine Gewohnheit war
  rationale: Die Wendung bezeichnet eine gewohnheitsmäßige Praxis. Die gewählte Form ist klar, würdig und dem griechischen Ausdruck eng verbunden.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: am Sabbat
  rationale: Der griechische Plural σαββάτων steht in einer idiomatischen Zeitangabe mit singularischem Sinn. „Am Sabbat“ gibt diesen im Deutschen natürlich wieder.
- source_word: συναγωγήν
  choice: Synagoge
  rationale: Im jüdischen Kontext ist die örtlich-institutionelle Bedeutung „Synagoge“ eindeutig und im Deutschen etabliert.
- source_word: ἀνέστη ἀναγνῶναι
  choice: stand auf, um vorzulesen
  rationale: Der Aorist mit Zweckinfinitiv besagt, dass Jesus aufstand, um die öffentliche Lesung vorzunehmen. „Vorzulesen“ verdeutlicht den gemeindlichen Kontext, ohne zusätzliche Inhalte einzutragen.
theological_decisions:
- issue: Wiedergabe des Ortsnamens Ναζαρά
  choice: Nazara
  alternative: Nazaret
  rationale: Die Hauptlesart folgt der tatsächlich überlieferten griechischen Form dieses Verses und harmonisiert sie nicht mit den andernorts gebräuchlicheren Namensformen. Die vertraute deutsche Form wird als Alternative in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung dient der natürlichen deutschen Lesbarkeit; die Abfolge der Handlungen und alle inhaltlichen Beziehungen des griechischen Textes bleiben erhalten.
