  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: de
  text: Als aber die Sonne unterging[a], brachten alle, die Kranke mit verschiedenen Krankheiten hatten, sie zu ihm. Er aber legte jedem Einzelnen von ihnen die Hände auf und heilte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Während die Sonne unterging.“ Die griechische Konstruktion bezeichnet die Zeit, in der das folgende Geschehen stattfand, und stellt den Sonnenuntergang als andauernden Vorgang dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Als aber die Sonne unterging
  rationale: Der Genitivus absolutus mit dem Präsenspartizip bezeichnet den Zeitraum des Geschehens und lässt den Vorgang des Sonnenuntergangs erkennen. „Als … unterging“ ist im Deutschen natürlich; „aber“ gibt die weiterführende Kraft von δέ wieder, ohne ein nicht ausdrücklich vorhandenes Zeitadverb einzuführen.
- source_word: ἅπαντες ὅσοι
  choice: alle, die
  rationale: Die Verbindung unterstreicht die Vollständigkeit der bezeichneten Gruppe. „Alle, die“ bewahrt diese umfassende Aussage knapp und idiomatisch.
- source_word: εἶχον ἀσθενοῦντας
  choice: Kranke … hatten
  rationale: ἔχω mit dem substantivisch gebrauchten Partizip bezeichnet hier Menschen, die Kranke in ihrem Haushalt oder ihrer Obhut hatten. Die knappe Formulierung lässt diese Beziehung offen, statt sie näher festzulegen.
- source_word: νόσοις ποικίλαις
  choice: mit verschiedensten Krankheiten
  rationale: Die Dativfügung beschreibt die vielfältigen Erkrankungen der Kranken. „Verschiedensten“ bringt die breite Vielfalt von ποικίλαις in natürlichem Deutsch zum Ausdruck, ohne eine bestimmte Zahl oder Schwere zu behaupten.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: brachten … sie zu ihm
  rationale: ἄγω kann „führen“ oder „bringen“ bedeuten. Im Zusammenhang mit Kranken, die zu Jesus gebracht werden, ist „bringen“ die idiomatische deutsche Entsprechung.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: jedem Einzelnen von ihnen
  rationale: Die doppelt distributive Formulierung hebt Jesu Zuwendung zu jeder einzelnen Person hervor. Die deutsche Wiedergabe erhält diesen Nachdruck.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: legte … die Hände auf
  rationale: Dies ist die direkte und geläufige deutsche Wiedergabe der konkreten Handlung des Handauflegens. Der Plural „die Hände“ folgt dem griechischen Text.
- source_word: ἐθεράπευεν
  choice: heilte
  rationale: Das Imperfekt beschreibt ein fortgesetztes beziehungsweise wiederholtes Handeln. Im Deutschen ist das Präteritum zusammen mit „jedem Einzelnen“ natürlich; der verteilende Zusammenhang vermittelt den wiederholten Vollzug.
theological_decisions:
- issue: Bedeutung des Handauflegens
  choice: legte jedem Einzelnen von ihnen die Hände auf
  alternative: legte ihnen der Reihe nach die Hände auf
  rationale: Die Übersetzung bewahrt die konkrete, persönliche Heilungshandlung und die im Griechischen betonte individuelle Zuwendung. Sie deutet die Handlung weder sakramental noch als späteres kirchliches Ritual.
- issue: Verhältnis von Handauflegen und Heilung
  choice: und heilte sie
  alternative: während er sie heilte
  rationale: Die koordinierte Formulierung wahrt die enge Verbindung beider Handlungen, legt aber keinen über den Text hinausgehenden Mechanismus fest, durch den die Heilung erfolgt sein müsse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text, wird aber durch zwei Hauptsätze lesbar gehalten. „Kranke … hatten“ bewahrt bewusst die im Ausgangstext nicht näher bestimmte Beziehung zwischen den Bringenden und den Kranken.
