  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: de
  text: vierzig Tage lang vom Teufel versucht.[a] In jenen Tagen aß er nichts; und als sie vorüber waren, bekam er Hunger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geprüft“. Das griechische Verb kann sowohl „versuchen“ als auch „prüfen“ bedeuten; weil hier der Teufel als Handelnder genannt wird, passt „versucht“ im Zusammenhang am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: vierzig Tage lang
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer; „vierzig Tage lang“ gibt dies im Deutschen klar und idiomatisch wieder.
- source_word: πειραζόμενος
  choice: versucht
  rationale: πειράζω kann „versuchen“ oder „prüfen“ bedeuten. Da der Teufel als Handelnder genannt wird, passt hier die feindliche Bedeutung „versuchen“ am besten; die mögliche Alternative wird in der Fußnote bewahrt.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: vom Teufel
  rationale: διάβολος ist hier die geläufige personale Bezeichnung; „der Teufel“ benennt den Bezug klar, während eine etymologische Wiedergabe wie „Verleumder“ ihn verdunkeln würde.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: aß er nichts
  rationale: Die Formulierung gibt die nachdrückliche Verneinung knapp und natürlich wieder.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: In jenen Tagen
  rationale: Die Wendung verweist auf den soeben genannten Zeitraum und bleibt zugleich nah an der griechischen Ausdrucksweise.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: als sie vorüber waren
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. Das Pronomen nimmt die Tage auf; „vorüber waren“ drückt deren Abschluss idiomatisch aus.
- source_word: ἐπείνασεν
  choice: hatte er Hunger
  rationale: Die Wendung ist modernes, natürliches Deutsch und bezeichnet den am Ende des Zeitraums festgestellten Hunger, ohne den Aspekt unnötig zu überpräzisieren.
theological_decisions:
- issue: Bedeutung von πειραζόμενος bei Jesu Aufenthalt in der Wüste
  choice: vom Teufel versucht
  alternative: vom Teufel geprüft
  rationale: „Versucht“ entspricht wegen des ausdrücklich genannten Handelnden, des Teufels, am besten dem feindlichen Sinn im Kontext. Die ebenfalls mögliche Bedeutung „geprüft“ bleibt in der Fußnote sichtbar, ohne die theologische Spannung über Jesu Versuchung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den vorausgehenden Satz fort; deshalb beginnt der Text passend mit der kleingeschriebenen Zeitangabe. Das Semikolon verbindet die eng zusammengehörenden Aussagen, ohne die griechische Abfolge zu verwischen.
