  text: καὶ ⸀ὅτι Ἐπὶ χειρῶν ἀροῦσίν σε μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: de
  text: 'und: »Auf ihren Händen werden sie dich tragen, damit du deinen Fuß nicht an einen Stein stößt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅτι
  choice: 'und:'
  rationale: καί setzt das Schriftzitat aus dem vorigen Vers fort; ὅτι führt hier dessen weiteren Inhalt ein und wird im Deutschen natürlich durch den Doppelpunkt wiedergegeben.
- source_word: Ἐπὶ χειρῶν
  choice: Auf Händen
  rationale: Die knappe Formulierung bewahrt das Bild des Getragenwerdens auf den Händen. Der Bezug auf die Engel ergibt sich aus dem vorangehenden Satz; ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen ist im Deutschen nicht nötig.
- source_word: ἀροῦσίν σε
  choice: werden sie dich tragen
  rationale: αἴρω bezeichnet hier das Aufheben beziehungsweise Tragen. „Tragen“ ist gegenwärtiges, verständliches Deutsch und erhält das Schutzmotiv.
- source_word: μήποτε
  choice: damit ... nicht
  rationale: Die Wendung gibt den verneinten Zweck beziehungsweise die verhütete Folge idiomatisch wieder, ohne sich unnötig auf nur eine dieser eng verbundenen Nuancen festzulegen.
- source_word: προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: du deinen Fuß nicht an einen Stein stößt
  rationale: Die konkrete Vorstellung des Anstoßens des Fußes an einen Stein wird bewahrt; der Singular „Fuß“ entspricht dem griechischen Text.
theological_decisions:
- issue: Wiedergabe des angeführten Psalmwortes und seines Schutzmotivs
  choice: „Auf Händen werden sie dich tragen“
  alternative: „Auf Händen werden sie dich aufheben“
  rationale: „Tragen“ vermittelt die zugesagte Bewahrung in natürlichem modernem Deutsch. Die Alternative bildet den Aspekt des Aufhebens stärker ab, ist hier aber weniger idiomatisch; daraus ergibt sich kein theologischer Unterschied.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Bildsprache des Schriftzitats bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
