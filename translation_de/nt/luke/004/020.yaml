id: LUK.4.20
reference: Luke 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: de
  text: Dann rollte er die Schriftrolle zusammen, gab sie dem Synagogendiener[a] zurück und setzte sich[b]. Die Augen aller in der Synagoge waren fest auf ihn gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Synagogendiener war unter anderem für den Umgang mit den Schriftrollen zuständig.
    reason: cultural_note
  - marker: b
    text: Lehrer trugen ihre Auslegung gewöhnlich im Sitzen vor.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: rollte ... zusammen
  rationale: Das Verb bezeichnet hier das Zusammenrollen einer Schriftrolle; die Wiedergabe bildet die konkrete Handlung historisch passend ab.
- source_word: βιβλίον
  choice: Schriftrolle
  rationale: Das Wort kann allgemein ein Schriftstück oder Buch bezeichnen, meint im Zusammenhang der synagogalen Jesajalesung aber eine Schriftrolle.
- source_word: ἀποδοὺς
  choice: gab ... zurück
  rationale: Die Zusammensetzung drückt aus, dass der benutzte Gegenstand seinem zuständigen Hüter zurückgegeben wird.
- source_word: ὑπηρέτῃ
  choice: Synagogendiener
  rationale: Im Kontext ist der mit praktischen Aufgaben, insbesondere dem Umgang mit den Schriftrollen, betraute Diener der Synagoge gemeint; die kontextuelle Präzisierung verhindert das Missverständnis eines beliebigen Dieners.
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Dies ist eine natürliche deutsche Wiedergabe der abgeschlossenen Handlung und lässt die damalige Lehrhaltung unausgedeutet.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: Die Augen aller
  rationale: Die Formulierung bewahrt das anschauliche Bild und den umfassenden Bezug des Genitivs.
- source_word: ἀτενίζοντες αὐτῷ
  choice: waren fest auf ihn gerichtet
  rationale: Die Wiedergabe bringt den anhaltenden, gespannten Blick zum Ausdruck, ohne eine feindselige Haltung zu unterstellen.
- source_word: συναγωγῇ
  choice: Synagoge
  rationale: Der Erzählzusammenhang verlangt die konkrete jüdische Versammlungsstätte.
theological_decisions:
- issue: Historische Gestalt des βιβλίον beim Synagogengottesdienst
  choice: Schriftrolle
  alternative: Buch; Schriftstück
  rationale: Die historisch konkrete Wiedergabe entspricht dem Gegenstand der Lesung, ohne den Bedeutungsumfang des griechischen Wortes grundsätzlich darauf zu beschränken.
- issue: Bedeutung des Sichsetzens
  choice: Im Haupttext nur die Handlung wiedergegeben
  alternative: Das Sitzen ausdrücklich als damalige Lehrhaltung erklären
  rationale: Der Vers nennt die Handlung, deutet sie aber nicht ausdrücklich. Eine kulturelle Erläuterung steht daher in der Fußnote, ohne dem Text eine weitergehende Aussage aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Schriftrolle“ wahrt den historischen Sachbezug; „Die Augen aller … waren fest auf ihn gerichtet“ erhält das eindringliche Bild des griechischen Textes. Beide Fußnotenmarker erscheinen unmittelbar an den jeweils erläuterten Ausdrücken.
