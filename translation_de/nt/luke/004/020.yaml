  source_fidelity: 'Der Text gibt die Abfolge von πτύξας, ἀποδοὺς und ἐκάθισεν sachgerecht wieder: Jesus rollt die Schriftrolle zusammen, gibt sie dem zuständigen Synagogendiener zurück und setzt sich. „Die Augen aller in der Synagoge waren fest auf ihn gerichtet“ bewahrt sowohl den umfassenden Bezug von πάντων als auch die anhaltend-gespannte Blickrichtung von ἀτενίζοντες αὐτῷ.'
