  source_fidelity: Der Bedingungssatz gibt ἐὰν mit Konjunktiv angemessen wieder. „dich vor mir niederwirfst“ bildet προσκυνήσῃς ἐνώπιον ἐμοῦ konkret und ohne unzulässige Einengung ab. „wird das alles dir gehören“ gibt ἔσται σοῦ πᾶσα idiomatisch wieder und erhält den elliptischen Rückbezug auf das zuvor Genannte. „nun“ kann οὖν als folgernde Weiterführung wiedergeben.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und bewahrt einen dem Kontext angemessenen würdigen Ton. Die Stellung von „nun“ ist natürlich; „das alles“ ist als deutscher anaphorischer Bezug klar.
  terminology: Die Haupttextwahl wahrt die lexikalische Spannweite von προσκυνέω zwischen Niederwerfen/Huldigung und Anbetung. Die Fußnote nennt mit „mich anbetest“ die kontextuell gewichtige religiöse Lesart, ohne sie dem Haupttext aufzuzwingen. Die Formulierung über die Gott gebührende Verehrung entspricht dem Kontext, insbesondere dem folgenden Vers.
