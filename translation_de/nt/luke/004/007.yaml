id: LUK.4.7
reference: Luke 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: de
  text: Wenn du dich nun vor mir niederwirfst[a], wird das alles dir gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich anbetest“. Das griechische Verb kann das Niederwerfen als Huldigung oder religiöse Anbetung bezeichnen; hier verlangt der Teufel die Verehrung, die Gott gebührt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt im Griechischen eine leichte Hervorhebung. Im Deutschen wird es natürlich mit „du“ wiedergegeben, ohne ein verstärkendes „du selbst“ einzufügen.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet hier die folgernde Weiterführung des Angebots natürlich und würdig; „also“ wäre ebenfalls möglich, klänge jedoch stärker argumentativ.
- source_word: ἐὰν
  choice: wenn
  rationale: Die Bedingung mit Konjunktiv wird im Deutschen idiomatisch durch einen Wenn-Satz wiedergegeben.
- source_word: προσκυνήσῃς
  choice: dich niederwirfst
  rationale: προσκυνέω bezeichnet das Niederfallen beziehungsweise die Huldigung und kann im religiösen Zusammenhang „anbeten“ bedeuten. „Dich niederwirfst“ bewahrt die konkrete Geste und lässt deren im Kontext eindeutigen religiösen Anspruch stehen, ohne die lexikalische Mehrdeutigkeit im Haupttext völlig aufzulösen.
- source_word: ἐνώπιον ἐμοῦ
  choice: vor mir
  rationale: Die räumlich-relationale Wendung wird knapp und idiomatisch mit „vor mir“ wiedergegeben.
- source_word: ἔσται σοῦ
  choice: wird … dir gehören
  rationale: Der prädikative Genitiv bezeichnet Besitz. „Dir gehören“ ist im modernen Deutsch natürlicher als „dein sein“.
- source_word: πᾶσα
  choice: das alles
  rationale: Das feminine Singularwort greift elliptisch die zuvor genannte Herrschaft beziehungsweise Gesamtheit auf. „Das alles“ stellt den notwendigen deutschen Rückbezug her, ohne ein im Vers nicht wiederholtes Substantiv einzusetzen.
theological_decisions:
- issue: Ob προσκυνέω als körperliche Geste oder ausdrücklich als religiöse Anbetung wiederzugeben ist
  choice: dich vor mir niederwirfst
  alternative: mich anbetest
  rationale: Die konkrete Bedeutung des Verbs bleibt im Haupttext sichtbar, während der Kontext und Jesu Antwort im folgenden Vers zeigen, dass die geforderte Huldigung religiösen Charakter hat. Eine Fußnote nennt deshalb die theologisch treffende Übersetzungsalternative „mich anbetest“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau bleibt knapp und folgt der griechischen Bedingungsstruktur; die echte Bedeutungsbreite von προσκυνέω wird durch Haupttext und Fußnote gemeinsam bewahrt.
