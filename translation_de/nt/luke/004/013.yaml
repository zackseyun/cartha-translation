  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: de
  text: Nachdem der Teufel jede Versuchung[a] beendet hatte, ließ er bis zu einem günstigen Zeitpunkt von ihm ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Prüfung“. Das griechische Wort kann sowohl „Versuchung“ als auch „Prüfung“ bedeuten. Weil hier der Teufel handelt, ist „Versuchung“ die naheliegendere Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Nachdem … zu Ende gebracht hatte
  rationale: Das vorzeitige aoristische Partizip bezieht sich auf den Teufel und bezeichnet eine Handlung, die vor dem Hauptverb abgeschlossen wurde. Die finite deutsche Konstruktion gibt diesen zeitlichen Zusammenhang natürlich und klar wieder.
- source_word: πάντα πειρασμόν
  choice: jede Versuchung
  rationale: πᾶς mit dem singularischen πειρασμόν kann distributiv oder umfassend verstanden werden. „Jede Versuchung“ drückt hier aus, dass die in der Erzählung dargestellten Versuchungen vollständig durchlaufen waren; wegen der Rolle des Teufels ist „Versuchung“ im Haupttext naheliegender als „Prüfung“.
- source_word: ὁ διάβολος
  choice: der Teufel
  rationale: Im Erzählzusammenhang bezeichnet das Wort den persönlichen übernatürlichen Widersacher. „Der Teufel“ ist dafür die geläufige und genaue deutsche Wiedergabe.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ließ … von ihm ab
  rationale: ἀφίστημι bezeichnet hier das Sichentfernen beziehungsweise zeitweilige Zurückweichen von einer Person. „Von ihm ablassen“ ist idiomatisches, würdiges Deutsch und wahrt den Bezug auf Jesus.
- source_word: ἄχρι καιροῦ
  choice: bis zu einer gelegenen Zeit
  rationale: καιρός kann einen geeigneten oder günstigen Zeitpunkt bezeichnen. Die Wiedergabe lässt offen, welcher spätere Zeitpunkt gemeint ist, und bringt zugleich den vorläufigen Charakter des Rückzugs zum Ausdruck.
theological_decisions:
- issue: Bedeutung von πειρασμός für Jesu Erfahrung
  choice: Versuchung
  alternative: Prüfung
  rationale: Das Wort kann sowohl „Versuchung“ als auch „Prüfung“ bedeuten. Da der Teufel handelt und Jesus zum Abweichen vom treuen Gehorsam bewegen will, steht „Versuchung“ im Haupttext; die ebenfalls sachlich vorhandene Dimension der Prüfung wird in der Fußnote bewahrt.
- issue: Nuance von ἄχρι καιροῦ
  choice: bis zu einer gelegenen Zeit
  alternative: bis zu einem bestimmten Zeitpunkt / für eine Zeit
  rationale: Der Text nennt den späteren Zeitpunkt nicht ausdrücklich. Die Übersetzung bewahrt die strategische Nuance von καιρός, ohne einen konkreten späteren Vorgang festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist gegenüber dem Griechischen natürlich gestaltet, erhält aber Vorzeitigkeit, handelndes Subjekt und die zeitliche Begrenzung des Rückzugs.
