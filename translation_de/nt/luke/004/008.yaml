base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: de
  text: 'Und Jesus antwortete ihm: „Es steht geschrieben: ›Du sollst den Herrn, deinen Gott, anbeten[a] und ihm allein dienen.‹“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Du sollst dich vor dem Herrn, deinem Gott, niederwerfen.“'
    reason: lexical_alternative
  - marker: b
    text: Das Zitat greift 5. Mose 6,13 auf.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Und Jesus antwortete ihm
  rationale: Die im griechischen Erzählstil übliche Verbindung aus Partizip und finitem Verb wird in natürliches modernes Deutsch überführt; Antwortcharakter, Subjekt und Bezug auf den Versucher bleiben erhalten.
- source_word: Γέγραπται
  choice: Es steht geschrieben
  rationale: Die Perfekt-Passiv-Form dient als feste Einleitungsformel für ein Schriftzitat. Die etablierte deutsche Wendung wahrt zugleich den Gedanken bleibender Geltung.
- source_word: Κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: Die Apposition wird durch ein Komma verdeutlicht. „Herr“ gibt κύριος im neutestamentlichen griechischen Text wieder, ohne die hebräische Gottesnamenschreibung in den Haupttext einzutragen.
- source_word: προσκυνήσεις
  choice: sollst … anbeten
  rationale: Im Zusammenhang ausschließlicher Gottesverehrung gibt „anbeten“ die religiöse Bedeutung natürlich und klar wieder; die körperlich-konkrete Nuance des Niederwerfens wird in einer Fußnote bewahrt.
- source_word: λατρεύσεις
  choice: sollst … dienen
  rationale: „Dienen“ ist eine knappe, idiomatische Wiedergabe; der Zusammenhang macht deutlich, dass es sich um Gott erwiesenen religiösen Dienst handelt.
- source_word: αὐτῷ μόνῳ
  choice: ihm allein
  rationale: 'Die Wortstellung wahrt die Ausschließlichkeit: Der Dienst gilt einzig Gott.'
theological_decisions:
- issue: Wiedergabe von κύριος in einem auf Gott bezogenen Schriftzitat
  choice: Herr
  alternative: HERR
  rationale: Übersetzt wird der vorliegende griechische Text κύριον. „Herr“ bewahrt dessen Form und Bedeutung, während „HERR“ die hebräische Gottesnamenskonvention aus dem alttestamentlichen Ausgangstext in den neutestamentlichen Haupttext eintragen würde.
- issue: Bedeutungsumfang von προσκυνέω
  choice: anbeten
  alternative: sich vor … niederwerfen
  rationale: „Anbeten“ trifft in diesem Kontext die religiöse Stoßrichtung, ohne die konkretere Grundbedeutung zu leugnen; diese bleibt als lexikalische Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Schriftzitat-Formel „Es steht geschrieben“ bleibt erhalten; die direkte Rede ist klar und ohne unnötige Altertümlichkeit formuliert.
