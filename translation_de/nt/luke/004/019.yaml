lexical_decisions:
- source_word: κηρύξαι
  choice: auszurufen
  rationale: Der Aoristinfinitiv setzt die Zweckreihe des vorausgehenden Satzes fort. „Ausrufen“ bewahrt den öffentlichen, heroldhaften Sinn von κηρύσσω und verengt ihn nicht auf eine Predigt.
- source_word: ἐνιαυτὸν
  choice: Jahr
  rationale: ἐνιαυτός bezeichnet gewöhnlich ein Jahr. Die konkrete Zeitangabe bleibt erhalten, statt sie zu „Zeit“ oder „Heilszeit“ zu verallgemeinern.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal und idiomatisch mit „des Herrn“ wiedergegeben. „Herr“ entspricht κύριος und lässt im Jesaja-Zitat die Verbindung zur Gottesbezeichnung bestehen, ohne im Haupttext „HERR“ einzusetzen.
- source_word: δεκτόν
  choice: Gnaden- (in „Gnadenjahr“)
  rationale: δεκτός bezeichnet hier ein willkommenes, angenommenes beziehungsweise von göttlicher Gunst geprägtes Jahr. Das im Deutschen geläufige „Gnadenjahr“ gibt den Sinn im Kontext von Jesaja 61 knapp und verständlich wieder; die wörtlichere Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Anspielung auf Jesaja 61,2 und möglicher Erlassjahr-Hintergrund
  choice: „Jahr“ und die jesajanisch geprägte Wendung „Gnadenjahr des Herrn“ beibehalten, ohne ausdrücklich „Erlassjahr“ einzufügen.
  alternative: „Erlassjahr des Herrn“
  rationale: Der griechische Text spielt auf Jesaja 61,2 an und kann Vorstellungen des Erlassjahres wecken, nennt dieses aber nicht ausdrücklich. Eine explizite Einfügung würde die Anspielung interpretierend festlegen.
- issue: Deutung von δεκτόν
  choice: „Gnadenjahr“
  alternative: „dem Herrn willkommenes Jahr“ / „wohlgefälliges Jahr des Herrn“
  rationale: Die Formulierung vermittelt im Deutschen die göttliche Gunst, ohne „annehmbar“ missverständlich als bloße Mindestbewertung erscheinen zu lassen. Die mögliche stärker relationale Lesart bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von κύριος
  choice: „Herr“
  alternative: „HERR“
  rationale: „Herr“ gibt κύριος unmittelbar wieder und vermeidet es, die alttestamentliche Konvention für den Gottesnamen im Haupttext zusätzlich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gnadenjahr“ ist eine vertraute biblische Wendung, bleibt aber auch für heutige Leser verständlich. Das trennbare Verb „ausrufen“ entspricht dem öffentlichen Verkündigungscharakter; „um“ macht die vom vorigen Vers fortgesetzte Zweckkonstruktion im Deutschen deutlich.
