  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „um ein Jahr der Gunst des Herrn auszurufen“; möglich ist auch: „um ein dem Herrn wohlgefälliges Jahr auszurufen“.'
