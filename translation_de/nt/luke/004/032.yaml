  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: de
  text: Und sie staunten über seine Lehre, denn sein Wort hatte Vollmacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Botschaft war vollmächtig“; wörtlicher: „Sein Wort war in Vollmacht“.'
    reason: Die griechische Wendung ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ lässt sich sowohl auf die Geltung des gesprochenen Wortes als auch auf die Art seines Redens beziehen.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: sie staunten
  rationale: Das Imperfekt beschreibt ihre anhaltende Reaktion. „Sie staunten“ gibt die starke Verwunderung in natürlichem, modernem Deutsch wieder, ohne eine zusätzliche emotionale Deutung einzutragen.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: über seine Lehre
  rationale: ἐπί mit Dativ bezeichnet hier den Gegenstand beziehungsweise Anlass des Staunens. „Lehre“ kann sowohl den Vorgang des Lehrens als auch dessen Inhalt bezeichnen.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι leitet hier die Begründung für das Staunen ein. „Denn“ verbindet die beiden Aussagen in würdigem, idiomatischem Deutsch.
- source_word: ἐν ἐξουσίᾳ
  choice: hatte Vollmacht
  rationale: Die deutsche Wendung gibt die autoritative Kraft und Geltung der Rede wieder. „Vollmacht“ ist in diesem Zusammenhang prägnanter als das möglicherweise bloß amtlich klingende „Autorität“.
- source_word: ὁ λόγος αὐτοῦ
  choice: sein Wort
  rationale: λόγος bezeichnet hier Jesu gesprochene Rede. „Sein Wort“ bewahrt die knappe Ausdrucksweise des Griechischen und lässt offen, ob besonders die einzelne Äußerung, seine Redeweise oder seine Botschaft gemeint ist.
theological_decisions:
- issue: Art und Ursprung der Vollmacht Jesu
  choice: „sein Wort hatte Vollmacht“ als beschreibende Aussage
  alternative: „er sprach mit göttlicher Vollmacht“
  rationale: Der Vers bezeugt die Vollmacht von Jesu Wort, erklärt an dieser Stelle aber weder ausdrücklich ihren Ursprung noch entfaltet er ihre christologische Bedeutung. Die Übersetzung fügt daher keine solche Erklärung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; „Vollmacht“ wahrt die religiöse und narrative Tragweite, ohne sie dogmatisch auszudeuten.
