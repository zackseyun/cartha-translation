  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des griechischen Textes zuverlässig wieder: Das Imperfekt ἐξεπλήσσοντο wird mit „sie staunten“ als fortdauernde Reaktion erfasst; ἐπὶ τῇ διδαχῇ αὐτοῦ ist treffend „über seine Lehre“; denn ist eine natürliche kausale Wiedergabe von ὅτι. „Sein Wort hatte Vollmacht“ vermittelt ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ ohne den Ursprung oder die Art dieser Vollmacht über den Text hinaus zu bestimmen.'
  naturalness: „Und sie staunten über seine Lehre, denn sein Wort hatte Vollmacht“ ist idiomatisches modernes Standarddeutsch mit einem angemessen knappen biblisch-narrativen Register. „Vollmacht“ ist hier natürlicher und semantisch genauer als ein rein administrativ klingendes „Autorität“.
