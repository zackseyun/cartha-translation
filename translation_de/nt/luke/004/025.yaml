- from: 'Doch ich sage euch in Wahrheit: In den Tagen Elias gab es viele Witwen in Israel, als der Himmel für drei Jahre und sechs Monate verschlossen wurde und eine große Hungersnot über das ganze Land kam.'
  to: 'Doch ich sage euch in Wahrheit: Zur Zeit des Elia gab es viele Witwen in Israel, als der Himmel für drei Jahre und sechs Monate verschlossen wurde, sodass eine große Hungersnot über das ganze Land kam.'
  rationale: Die Revision modernisiert die Namensform und stellt den im griechischen Satz angelegten Zusammenhang zwischen dem Verschließen des Himmels und dem Eintreten der Hungersnot mit „sodass“ deutlicher dar. Umfang und Ambiguität von γῆ sowie das nicht näher bestimmte Passiv bleiben erhalten.
