    issue: Der resultative Anschluss von ὡς ἐγένετο ist nur als „und“ wiedergegeben.
    rationale: Die griechische Formulierung verbindet die Schließung des Himmels mit dem Eintreten der Hungersnot. „Sodass“ macht diesen Zusammenhang im Deutschen besser sichtbar, ohne eine über den Text hinausgehende Ursache zu benennen.
  - severity: low
    issue: Namensform „Elias“ ist weniger modern als „Elia“.
    rationale: „Elia“ ist im modernen Standarddeutsch und in gegenwärtigen Bibelübersetzungen geläufiger.
