  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: de
  text: 'Doch ich sage euch in Wahrheit: Zur Zeit des Elia gab es viele Witwen in Israel, als der Himmel für drei Jahre und sechs Monate verschlossen wurde, sodass eine große Hungersnot über das ganze Land kam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: in Wahrheit
  rationale: Gibt die nachdrückliche Wahrheitsbekräftigung idiomatisch und würdevoll wieder, ohne sie zu einer bloßen Beschreibung des Sprechens abzuschwächen.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: der Himmel ... verschlossen wurde
  rationale: Bewahrt das Passiv und das biblische Bild eines verschlossenen Himmels; im Kontext bezeichnet es das Ausbleiben des Regens.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: über das ganze Land
  rationale: γῆ kann Erde oder Land bedeuten. Der Bezug auf Israel und die Elija-Erzählung legt hier 'Land' nahe, ohne den räumlichen Umfang weiter einzuengen.
theological_decisions:
- issue: Unausgesprochener Handelnder beim Verschließen des Himmels
  choice: 'Passiv beibehalten: ''verschlossen wurde'''
  alternative: Gott verschloss den Himmel
  rationale: Der griechische Text nennt den Handelnden nicht ausdrücklich; die Übersetzung soll diese Zurückhaltung bewahren.
- issue: Zeitangabe von drei Jahren und sechs Monaten
  choice: wörtlich beibehalten
  alternative: dreieinhalb Jahre
  rationale: Die ausdrückliche Formulierung des griechischen Textes wird erhalten und nicht rechnerisch zusammengezogen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe am griechischen Gedankengang, klingt aber im Deutschen natürlich.
