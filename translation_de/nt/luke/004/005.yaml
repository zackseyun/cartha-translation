  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die griechische Satzfolge und Aussage zuverlässig wieder: ἀναγαγών wird als vorangehendes Hinaufführen ausgedrückt, ἔδειξεν mit „zeigte“, πάσας τὰς βασιλείας mit „alle Reiche“, τῆς οἰκουμένης mit „der bewohnten Welt“ und ἐν στιγμῇ χρόνου mit „in einem Augenblick“. Er ergänzt weder einen Berg noch eine bestimmte Art der Schau.'
  naturalness: „Nachdem er ihn hinaufgeführt hatte, zeigte er ihm alle Reiche der bewohnten Welt in einem Augenblick“ ist idiomatisches, modernes und zugleich angemessen würdiges Standarddeutsch. Die Vorvergangenheit macht die vom Partizip ausgedrückte zeitliche Vorordnung klar, ohne den griechischen Text unnötig auszubauen.
  terminology: „Reiche“ trifft βασιλείας im konkreten pluralischen Sinn gut. „Bewohnte Welt“ bewahrt die spezifischere Bedeutung von οἰκουμένη gegenüber dem allgemeineren „Welt“. Die Fußnoten bieten die sinnvollen lexikalischen Alternativen, ohne die Referenz auf ein bestimmtes Reich dogmatisch oder historisch festzulegen.
