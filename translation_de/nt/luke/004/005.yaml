id: LUK.4.5
reference: Luke 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: de
  text: Nachdem er ihn hinaufgeführt hatte, zeigte er ihm alle Reiche der bewohnten Welt[a] in einem Augenblick.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Welt“. Das griechische Wort bezeichnet häufig die bewohnte Welt und kann in manchen Zusammenhängen insbesondere die zivilisierte oder imperiale Welt meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einem Moment“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: Nachdem er ihn hinaufgeführt hatte
  rationale: Die Formulierung bewahrt die zeitliche Abfolge des Aoristpartizips und die Aufwärtsbewegung, ohne aus der matthäischen Parallelstelle einen Berg als Ort einzutragen.
- source_word: ἔδειξεν
  choice: zeigte er ihm
  rationale: „Zeigen“ gibt die gewöhnliche erzählerische Bedeutung von δείκνυμι natürlich und unmittelbar wieder.
- source_word: πάσας τὰς βασιλείας
  choice: alle Reiche
  rationale: Im Plural bezeichnet βασιλεία hier konkrete Herrschaftsgebiete oder Reiche, nicht das abstrakte Königtum.
- source_word: τῆς οἰκουμένης
  choice: der bewohnten Welt
  rationale: οἰκουμένη bezeichnet häufig die bewohnte Welt und kann je nach Zusammenhang auch die zivilisierte oder imperiale Welt meinen. Die gewählte Wiedergabe bewahrt diese lexikalische Besonderheit, ohne den Ausdruck auf das Römische Reich zu verengen.
- source_word: ἐν στιγμῇ χρόνου
  choice: in einem Augenblick
  rationale: στιγμή bezeichnet einen äußerst kurzen Zeitpunkt. „In einem Augenblick“ ist im modernen Deutsch natürlich und gibt die zeitliche Kürze prägnant wieder.
theological_decisions:
- issue: Art und Weise, wie der Teufel die Reiche zeigt
  choice: Das Geschehen wird nur beschreibend wiedergegeben; sein Mechanismus bleibt offen.
  alternative: Eine visionäre Schau oder ein buchstäblicher Ausblick von einem hoch gelegenen Ort.
  rationale: Der griechische Text sagt lediglich, dass er Jesus die Reiche zeigte. Er legt nicht fest, ob dies visionär, übernatürlich oder von einem geografischen Aussichtspunkt aus geschah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt die erzählerische Abfolge des Griechischen, bleibt aber gut verständlich. Es wird kein in Lukas ungenannter Berg ergänzt.
