id: LUK.4.34
reference: Luke 4:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: de
  text: '„Ah! Was haben wir mit dir zu schaffen, Jesus von Nazareth?[a] Bist du gekommen, um uns zu vernichten?[b] Ich weiß, wer du bist: der Heilige Gottes.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus, du Nazarener.“ Die Wendung τί ἡμῖν καὶ σοί bedeutet wörtlich etwa: „Was [ist] uns und dir?“ Sie drückt Abgrenzung oder feindseligen Protest aus. Der einleitende Ruf Ἔα kann auch mit „Ha!“ wiedergegeben oder sinngemäß als „Lass uns in Ruhe!“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Wen der Dämon mit „uns“ meint, wird im griechischen Text nicht näher bestimmt.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Gottes Heiliger“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ah!
  rationale: Die Interjektion ist ein abrupter Ruf des Erschreckens oder Protests. „Ah!“ bewahrt den Ausrufcharakter, ohne die sinngemäße Erweiterung „Lass uns in Ruhe!“ in den Text aufzunehmen.
- source_word: τί ἡμῖν καὶ σοί
  choice: Was haben wir mit dir zu schaffen
  rationale: Die wörtlich ungewöhnliche Wendung „Was [ist] uns und dir?“ ist ein semitisch geprägter Ausdruck der Abgrenzung oder feindseligen Zurückweisung. Die gewählte Formulierung ist im Deutschen verständlich und wahrt die konfrontative Distanz.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus von Nazareth
  rationale: Der Vokativ bezeichnet Jesus nach seiner Herkunft beziehungsweise als Nazarener. „Jesus von Nazareth“ ist die natürliche und geläufige deutsche Wiedergabe.
- source_word: ἦλθες ἀπολέσαι
  choice: Bist du gekommen, um … zu vernichten?
  rationale: Der Aorist fragt nach dem Zweck seines gegenwärtig wirksamen Kommens. „Vernichten“ gibt die starke Bedeutung von ἀπόλλυμι in dieser Konfrontation klar wieder.
- source_word: ἡμᾶς
  choice: uns
  rationale: Der Plural bleibt ohne nähere Bestimmung erhalten, da der griechische Text offenlässt, auf wen er sich genau bezieht.
- source_word: οἶδά σε τίς εἶ
  choice: Ich weiß, wer du bist
  rationale: Eine direkte, natürliche Wiedergabe der Erkenntnisaussage ohne zusätzliche Deutung.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: der Heilige Gottes
  rationale: Die Formulierung bildet den gewichtigen christologischen Titel eng und idiomatisch ab, ohne ihn dogmatisch zu erweitern.
theological_decisions:
- issue: Plural ἡμᾶς in der Rede des Dämons
  choice: Der Plural wird schlicht als „uns“ beibehalten.
  alternative: Der Dämon könnte stellvertretend für die dämonische Welt oder für sich und den besessenen Menschen sprechen.
  rationale: Der Vers bestimmt den Bezugsbereich des Plurals nicht. Eine Festlegung würde eine im Ausgangstext vorhandene Spannung auflösen.
- issue: Christologischer Titel ὁ ἅγιος τοῦ θεοῦ
  choice: „der Heilige Gottes“ ohne erläuternden Zusatz
  alternative: „Gottes Heiliger“; eine ausdrückliche Deutung als messianischer oder auf göttliche Sendung bezogener Titel
  rationale: Der Titel ist christologisch bedeutsam, doch der Vers entfaltet seine Bedeutung nicht weiter. Daher bleibt die Übersetzung bei der Aussage des Textes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die idiomatische Wendung „mit jemandem zu schaffen haben“ bewahrt die abweisende Schärfe des Ausgangstextes; die Pluralreferenz und der christologische Titel bleiben bewusst unausgedeutet.
