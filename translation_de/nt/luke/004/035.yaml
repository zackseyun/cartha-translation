source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: de
  text: 'Und Jesus wies den Dämon streng zurecht und sagte: „Verstumme[a] und fahr aus ihm aus!“ Da warf der Dämon den Mann in die Mitte und fuhr aus ihm aus, ohne ihn im Geringsten zu verletzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Verb bedeutet ursprünglich: „mit einem Maulkorb versehen“; im Redekontext ist es ein scharfer Befehl zu schweigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: wies den Dämon streng zurecht
  rationale: ἐπιτιμάω bezeichnet hier ein scharfes, autoritatives Zurechtweisen. Das Bezugswort „Dämon“ wird zur Klarheit wiederholt, da ein bloßes „ihn“ im Deutschen fälschlich auf den Mann bezogen werden könnte.
- source_word: Φιμώθητι
  choice: Verstumme
  rationale: Der Befehl verlangt unmittelbar Schweigen und bewahrt in knapper, scharfer Form die Kraft des griechischen Imperativs. Das zugrunde liegende Bild des Maulkorbs wird in der Fußnote erhalten.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: fahr aus ihm aus
  rationale: „Ausfahren“ ist im Deutschen die klare und weiterhin verständliche Wendung für das Verlassen eines Menschen durch einen Dämon; sie gibt Imperativ und ἀπό-Konstruktion direkt wieder.
- source_word: ῥίψαν αὐτὸν
  choice: warf der Dämon den Mann
  rationale: Das aoristische Partizip beschreibt eine der Haupthandlung vorausgehende beziehungsweise sie begleitende Handlung. „Den Mann“ klärt das Bezugswort von αὐτόν ohne sachlichen Zusatz.
- source_word: εἰς τὸ μέσον
  choice: in die Mitte
  rationale: Die knappe Form entspricht dem nicht weiter bestimmten griechischen Ausdruck und vermeidet den Zusatz „unter sie“, obwohl die anwesende Menge aus dem Zusammenhang erschlossen werden kann.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: „Dämon“ ist die direkte moderne Entsprechung und bewahrt die personale Darstellung des Textes.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: ohne ihn im Geringsten zu verletzen
  rationale: Die Formulierung gibt die verneinte Partizipialkonstruktion natürlich wieder und betont, dass der Mann trotz des heftigen Vorgangs keinerlei Verletzung erlitt.
theological_decisions:
- issue: Darstellung des δαιμόνιον im Exorzismusbericht
  choice: „Dämon“ als personales böses Geistwesen, das Jesus anspricht und das den Mann verlässt
  alternative: eine unpersönliche böse Kraft oder ausschließlich eine psychische Erkrankung
  rationale: Direkte Anrede, Handlungsfähigkeit und Ausfahrenssprache gehören zur Darstellung des griechischen Textes. Die Übersetzung sollte diese weder abschwächen noch über den Wortlaut hinaus dogmatisch ausbauen.
- issue: Bezug der männlichen Pronomen im Deutschen
  choice: Dämon und Mann an mehrdeutigen Stellen ausdrücklich benennen
  alternative: die griechischen Pronomen jeweils formal mit „ihn“ wiedergeben
  rationale: Da sowohl „Dämon“ als auch „Mann“ im Deutschen maskulin sind, würde eine rein formale Wiedergabe unnötige Mehrdeutigkeit schaffen, die im griechischen Zusammenhang durch Syntax und Referenz weniger stark ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, kraftvoller direkter Rede. „Fahr aus ihm aus“ behält den im biblischen Exorzismuskontext geläufigen Ausdruck bei, ohne altertümliche Satzbildung zu verwenden.
