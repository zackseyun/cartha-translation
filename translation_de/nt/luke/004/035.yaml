  source_fidelity: 'Der Vers ist insgesamt quellentreu: Jesu autoritatives Zurechtweisen, die beiden Imperative, das Werfen des Mannes in die Mitte, das Ausfahren des Dämons und die ausdrückliche Unversehrtheit des Mannes sind angemessen wiedergegeben. „Fahr aus ihm aus“ gibt ἔξελθε ἀπ’ αὐτοῦ treffend wieder. Die zeitliche Abfolge des Partizips ῥίψαν wird durch „Da warf … und fuhr aus“ ausreichend klar.'
  naturalness: Der Haupttext ist modernes, gut verständliches Standarddeutsch und hat einen passenden würdigen, knappen Erzählton. „Verstumme“ ist möglich, wirkt jedoch leicht gehoben; dies ist keine zwingende Änderung. Die Fußnotenformulierung „Lass dir das Maul verschließen“ ist dagegen im Deutschen unidiomatisch und legt eine nicht im griechischen Imperativ enthaltene freiwillige Zulassung nahe.
