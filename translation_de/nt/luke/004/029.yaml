  terminology: „Stadt“ für πόλις, „führten“ für ἤγαγον und „Rand des Berges“ für ὀφρύς τοῦ ὄρους sind sachgerecht. Die Fußnote zu [a] bewahrt die bildliche lexikalische Grundbedeutung „Braue“ und erklärt sie ohne Überinterpretation. Die Fußnote zu [b] bietet eine legitime Alternative zu κατακρημνίσαι.
