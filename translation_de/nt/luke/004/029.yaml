id: LUK.4.29
reference: Luke 4:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: de
  text: Da standen sie auf, trieben ihn aus der Stadt hinaus und führten ihn bis an den Rand des Berges[a], auf dem ihre Stadt gebaut war, um ihn hinabzustürzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „bis an die Braue des Berges“; gemeint ist der Rand oder die Kante der Höhe.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „um ihn hinabzuwerfen“; das griechische Verb bezeichnet das Herabstürzen von einer Höhe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: Da standen sie auf
  rationale: Das Aoristpartizip bezeichnet den einsetzenden körperlichen Aufbruch der Menge; die deutsche Hauptsatzverbindung gibt den raschen Fortgang natürlich wieder.
- source_word: ἐξέβαλον
  choice: trieben ihn ... hinaus
  rationale: ἐκβάλλω bezeichnet hier gewaltsames Vertreiben. „Hinaustreiben“ wahrt die feindselige Dynamik, ohne eine zusätzliche Art körperlicher Gewalt zu behaupten.
- source_word: πόλεως
  choice: Stadt
  rationale: „Stadt“ ist die übliche und sachlich offene Wiedergabe von πόλις im Deutschen; die moderne deutsche Bezeichnung hängt nicht zwingend von heutiger Größe oder Stadtrecht ab.
- source_word: ἤγαγον
  choice: führten ihn
  rationale: ἄγω bedeutet grundsätzlich „führen, bringen“. „Schleiften“ würde eine nicht ausdrücklich bezeichnete Form der Gewalt hinzufügen.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: bis an den Rand des Berges
  rationale: ὀφρύς bezeichnet wörtlich die Braue und übertragen den vorspringenden Rand beziehungsweise die Kante einer Höhe. „Rand des Berges“ ist im heutigen Deutsch klar und topografisch zurückhaltend.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: auf dem ihre Stadt gebaut war
  rationale: Die passive Plusquamperfektform beschreibt den Berg als Standort der Stadt. Das possessive αὐτῶν bleibt mit „ihre Stadt“ ausdrücklich erhalten.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: um ihn hinabzustürzen
  rationale: ὥστε mit Infinitiv bezeichnet hier im Zusammenhang die beabsichtigte Folge. κατακρημνίζω meint das Hinabwerfen oder Hinabstürzen von einer Höhe; „hinabstürzen“ ist knapp und enthält keinen im Text ausdrücklich genannten „Felsen“ oder „Abgrund“.
theological_decisions:
- issue: Gewaltgrad und Tötungsabsicht der Menge
  choice: Die feindselige Absicht wird durch „trieben“, die Bewegung zum Bergrand und „um ihn hinabzustürzen“ deutlich gemacht.
  alternative: Ausdrücklich von einem Mordversuch sprechen oder die Menge Jesus „schleifen“ lassen.
  rationale: Der griechische Text schildert eine auf tödliche Gewalt zielende Handlung, benennt sie aber nicht abstrakt als Mordversuch und spezifiziert auch nicht, dass Jesus geschleift wurde. Die Übersetzung lässt die Absicht aus der erzählten Handlung hervorgehen.
- issue: Funktion von ὥστε mit dem Infinitiv
  choice: final mit „um ... zu“
  alternative: konsekutiv mit „sodass sie ihn hinabstürzen konnten“
  rationale: In diesem feindseligen Handlungsablauf liegt die Zweckbedeutung nahe. Die grammatische Nähe von beabsichtigter Folge und Zweck wird jedoch nicht durch zusätzliche Aussagen über Erfolg oder tatsächliche Ausführung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. „Da standen sie auf“ vermeidet den gehobenen, heute schwerfälligen Partizipialstil. „Stadt“ folgt dem griechischen πόλις; „Rand des Berges“ ist verständlicher als das wörtliche „Braue des Berges“. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
