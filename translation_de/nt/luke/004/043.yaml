id: LUK.4.43
reference: Luke 4:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: »Auch den anderen Städten muss ich die gute Botschaft vom Reich Gottes verkünden, denn dazu bin ich gesandt worden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Er aber sagte zu ihnen
  rationale: δέ setzt Jesu Antwort in einen milden Gegensatz zum Wunsch der Menschen, ihn zurückzuhalten. Die Formulierung bleibt nah am griechischen Satzbau und klingt zugleich natürlich.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: Auch den anderen Städten
  rationale: καί bezeichnet die Ausweitung seines Auftrags; ἕτεραι πόλεις meint weitere beziehungsweise andere Städte als den gegenwärtigen Ort.
- source_word: εὐαγγελίσασθαί
  choice: die gute Botschaft … verkünden
  rationale: εὐαγγελίζομαι bezeichnet das öffentliche Überbringen einer guten Nachricht. »Verkünden« bewahrt den Aussagecharakter, ohne unnötig kirchliche Fachsprache einzuführen.
- source_word: με δεῖ
  choice: muss ich
  rationale: δεῖ drückt eine starke, im lukanischen Zusammenhang häufig göttlich bestimmte Notwendigkeit aus. »Muss ich« ist knapp und idiomatisch.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vom Reich Gottes
  rationale: Der Genitiv beim Verb des Verkündens wird im Deutschen natürlich mit »vom« wiedergegeben. »Reich Gottes« bewahrt die zentrale lukanische Wendung, ohne zwischen Herrschaft und Herrschaftsbereich einseitig zu entscheiden.
- source_word: ἐπὶ τοῦτο
  choice: dazu
  rationale: Die Wendung bezeichnet hier Zweck oder Ziel. »Dazu« ist prägnant und entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ἀπεστάλην
  choice: bin ich gesandt worden
  rationale: Die Passivform bewahrt die Sendungssprache und lässt wie der griechische Text den Handelnden unausgesprochen; der Kontext kann Gott als Sender nahelegen, ohne dass dies ergänzt wird.
theological_decisions:
- issue: Notwendigkeit von Jesu Auftrag
  choice: »muss ich« bewahrt die starke Notwendigkeit seiner Verkündigungsmission
  alternative: »es ist für mich notwendig«
  rationale: Die idiomatische Form gibt δεῖ deutlich wieder, ohne die im Text nicht ausdrücklich benannte Quelle der Notwendigkeit erläuternd hinzuzufügen.
- issue: Wer Jesus gesandt hat
  choice: Das Passiv »bin ich gesandt worden« nennt keinen Sender
  alternative: »Gott hat mich dazu gesandt«
  rationale: Obwohl der Zusammenhang Gott als Sender nahelegt, wahrt die Übersetzung das göttliche Passiv beziehungsweise die Unbestimmtheit des griechischen Wortlauts.
- issue: Bedeutungsbreite von βασιλεία τοῦ θεοῦ
  choice: »Reich Gottes«
  alternative: »Gottesherrschaft«
  rationale: »Reich Gottes« ist verständlich und traditionsfähig und legt den Ausdruck nicht ausschließlich auf Gottes regierendes Handeln oder ausschließlich auf einen Herrschaftsbereich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng am griechischen Wortlaut, verwendet aber idiomatische deutsche Wortstellung. Keine Fußnoten sind erforderlich, da die relevanten Bedeutungsnuancen im Haupttext angemessen erhalten bleiben.
