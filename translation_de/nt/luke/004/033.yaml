id: LUK.4.33
reference: Luke 4:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: de
  text: 'Und in der Synagoge war ein Mann, der den Geist eines unreinen Dämons[a] hatte. Er schrie mit lauter Stimme auf:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung enthält sowohl „Geist“ als auch „Dämon“; auch möglich: „einen unreinen Dämonengeist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: Synagoge
  rationale: Bezeichnet hier den jüdischen Versammlungs- und Gottesdienstort; „Synagoge“ ist im Deutschen der übliche und genaue Ausdruck.
- source_word: ἄνθρωπος
  choice: Mann
  rationale: Im erzählten Einzelfall ist eine männliche Person gemeint; „Mann“ gibt dies präzise wieder.
- source_word: ἔχων
  choice: hatte
  rationale: Gibt das Partizip eng am Wortlaut wieder und vermeidet die stärker deutende Formulierung „besessen war“.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: den Geist eines unreinen Dämons
  rationale: Bewahrt sowohl „Geist“ als auch „Dämon“. Die Genitivform ἀκαθάρτου stimmt grammatisch mit δαιμονίου überein, weshalb „eines unreinen Dämons“ die Struktur unmittelbar abbildet.
- source_word: ἀνέκραξεν
  choice: schrie … auf
  rationale: „Aufschreien“ gibt den kräftigen, plötzlichen Ruf natürlich wieder, ohne zusätzliche emotionale Einzelheiten einzutragen.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Entspricht der konkreten griechischen Wendung und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe der dämonischen Begrifflichkeit
  choice: den Geist eines unreinen Dämons
  alternative: einen unreinen Dämonengeist; einen unreinen Geist
  rationale: Die Übersetzung erhält die beiden ausdrücklich genannten Begriffe „Geist“ und „Dämon“ und folgt zugleich ihrer grammatischen Verbindung. Sie schwächt den übernatürlichen Bezug nicht ab, legt aber mit „besessen“ auch keinen weitergehenden Deutungsbegriff in den Text hinein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit erzählerisch-würdigem Ton. Der lange griechische Satz wird vor dem Ausruf geteilt; der Doppelpunkt leitet die in den folgenden Versen wiedergegebene Rede ein.
