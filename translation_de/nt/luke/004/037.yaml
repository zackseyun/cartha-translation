  text: καὶ ἐξεπορεύετο ἦχος περὶ αὐτοῦ εἰς πάντα τόπον τῆς περιχώρου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: de
  text: Und die Nachricht über ihn verbreitete sich bis in alle Orte der Umgebung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ein Bericht über ihn drang bis in alle Orte der Umgebung.«'
    reason: Bewahrt als Alternative die formal nähere Ausbreitungsbewegung von ἐξεπορεύετο sowie die Bedeutung von ἦχος als »Bericht«.
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: verbreitete sich
  rationale: Der Imperfekt bezeichnet einen fortdauernden Vorgang in der Vergangenheit. Mit ἦχος als Subjekt gibt »verbreitete sich« die idiomatische Bedeutung natürlicher wieder als das formal nähere »ging hinaus«.
- source_word: ἦχος
  choice: Kunde
  rationale: Das Wort kann wörtlich »Schall« oder »Geräusch« bedeuten, bezeichnet hier aber aufgrund von περὶ αὐτοῦ den umlaufenden Bericht über Jesus. »Kunde« ist knapp, verständlich und lässt den Sinn eines sich ausbreitenden Berichts erkennen.
- source_word: περὶ αὐτοῦ
  choice: von ihm
  rationale: Die Formulierung bezeichnet den Inhalt der Kunde. Im Deutschen ist »Kunde von ihm« natürlicher als »Kunde über ihn«.
- source_word: εἰς πάντα τόπον
  choice: an jedem Ort
  rationale: Die Wiedergabe bewahrt die distributive Aussage von πάντα τόπον, ohne die im Deutschen unnatürliche Bewegungsformulierung »in jeden Ort« zu erzwingen.
- source_word: τῆς περιχώρου
  choice: im Umland
  rationale: περίχωρος bezeichnet das umliegende Gebiet. »Umland« ist eine natürliche, geografisch passende Wiedergabe.
- source_word: καὶ
  choice: Und
  rationale: Die einfache erzählerische Verknüpfung mit dem vorausgehenden Geschehen bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Kunde« ist leicht gehoben, aber allgemein verständlich und passt zum erzählerischen Ton; die Satzstruktur bleibt knapp und nah am Griechischen.
