  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: de
  text: Er aber ging durch ihre Mitte hindurch[a] und ging weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mitten durch sie hindurch“. Der griechische Text beschreibt, dass Jesus durch ihre Mitte ging, ohne zu sagen, wie dies geschah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen trägt eine leichte Hervorhebung. Im Deutschen gibt „er“ diese im Kontrast zum Handeln der Menge ausreichend wieder; „er selbst“ wäre stärker markiert als nötig.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier den milden Gegensatz zwischen der feindlichen Absicht der Menge im vorhergehenden Vers und Jesu ungehindertem Fortgehen.
- source_word: διελθὼν
  choice: ging … hindurch
  rationale: Das Aoristpartizip von διέρχομαι bezeichnet die Bewegung durch einen Raum beziehungsweise eine Gruppe. Die deutsche finite Konstruktion ist natürlich und bleibt eng am Bewegungsbild.
- source_word: διὰ μέσου αὐτῶν
  choice: mitten durch sie hindurch
  rationale: Die Wendung beschreibt räumlich eine Bewegung durch die Mitte der Gruppe. Diese Formulierung ist im modernen Deutsch klarer und natürlicher als „durch ihre Mitte“.
- source_word: ἐπορεύετο
  choice: setzte seinen Weg fort
  rationale: Das Imperfekt stellt die Bewegung als fortdauernd dar. „Setzte seinen Weg fort“ gibt diesen Verlauf idiomatisch wieder, ohne mehr über Ziel oder Art des Fortgehens auszusagen.
theological_decisions:
- issue: Ob der Vers ausdrücklich eine übernatürliche Flucht bezeichnet
  choice: 'Deskriptiv neutrale Formulierung: „ging mitten durch sie hindurch und setzte seinen Weg fort“'
  alternative: Eine ausdrückliche Deutung wie „entkam ihnen auf wunderbare Weise“
  rationale: Der griechische Text schildert Jesu Bewegung durch die Menge, erklärt jedoch nicht, wie dies möglich war. Die Übersetzung bewahrt diese Offenheit und legt den Vorgang nicht ausdrücklich als Wunder fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist leicht geglättet, bewahrt aber Gegensatz, räumliches Bild und Verlaufsaspekt des griechischen Textes.
