base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: de
  text: Und er predigte in den Synagogen Judäas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften haben hier „Galiläa“ statt „Judäa“. Der Haupttext folgt der Lesart „Judäa“ im hier zugrunde gelegten griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: predigte weiterhin
  rationale: Die periphrastische Imperfektform bezeichnet eine fortdauernde oder wiederholte Tätigkeit in der Vergangenheit. „Predigte weiterhin“ gibt diesen Aspekt im Deutschen natürlicher und deutlicher wieder als ein schlichtes „predigte“.
- source_word: κηρύσσων
  choice: predigte
  rationale: κηρύσσω bezeichnet öffentliches Verkündigen. Im Zusammenhang des Wirkens in Synagogen ist „predigen“ eine geläufige, würdevolle Wiedergabe.
- source_word: εἰς τὰς συναγωγάς
  choice: in den Synagogen
  rationale: Obwohl εἰς häufig eine Bewegung in etwas hinein ausdrückt, bezeichnet es hier idiomatisch den Ort beziehungsweise Wirkungsbereich des Predigens; im Deutschen ist daher „in den Synagogen“ angemessen.
- source_word: συναγωγάς
  choice: Synagogen
  rationale: συναγωγή bezeichnet hier jüdische Versammlungen beziehungsweise deren Versammlungsorte. „Synagogen“ ist die übliche und klare Wiedergabe.
- source_word: Ἰουδαίας
  choice: Judäas
  rationale: Der zugrunde gelegte griechische Text liest Ἰουδαίας („Judäa“). Die mögliche Spannung zum galiläischen Erzählzusammenhang wird nicht harmonisiert, sondern durch eine Fußnote kenntlich gemacht.
theological_decisions:
- issue: Geografische Angabe τῆς Ἰουδαίας im galiläischen Erzählzusammenhang
  choice: Judäas
  alternative: Galiläas; oder „Judäa“ im weiteren Sinn als jüdisches Gebiet
  rationale: Die Übersetzung folgt der Lesart des SBLGNT und bewahrt die geografische beziehungsweise textkritische Spannung. Sie ersetzt „Judäa“ nicht aufgrund des unmittelbaren Zusammenhangs durch „Galiläa“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Weiterhin“ macht den fortdauernden beziehungsweise wiederholten Aspekt der griechischen Verbform sichtbar, ohne das öffentliche Verkündigen näher auszudeuten.
