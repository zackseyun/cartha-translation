  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: de
  text: Als sie das hörten, wurden alle in der Synagoge von Zorn erfüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Wut erfüllt“. Das griechische Wort θυμός kann heftigen Zorn oder Wut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: wurden … erfüllt
  rationale: Die Aorist-Passivform von πίμπλημι wird formal und zugleich idiomatisch wiedergegeben; sie beschreibt, dass Zorn die Anwesenden ganz erfasste.
- source_word: πάντες
  choice: alle
  rationale: Das Wort bezeichnet kollektiv sämtliche in der Synagoge Anwesenden und behält die knappe, umfassende Aussage des Griechischen bei.
- source_word: θυμοῦ
  choice: von Zorn
  rationale: θυμός bezeichnet hier heftigen Ärger beziehungsweise Zorn. „Zorn“ ist im Deutschen würdevoll und intensiv, ohne zwingend die äußerste Steigerung „Wut“ festzulegen.
- source_word: ἐν τῇ συναγωγῇ
  choice: in der Synagoge
  rationale: Die Präpositionalphrase bezeichnet den Ort und wird direkt und natürlich wiedergegeben.
- source_word: ἀκούοντες
  choice: Als sie … hörten
  rationale: Das präsentische Partizip bezeichnet einen zum Hauptgeschehen gleichzeitigen Umstand beziehungsweise Anlass. Der temporale Nebensatz ist im modernen Deutsch natürlicher als eine partizipiale Konstruktion.
- source_word: ταῦτα
  choice: das
  rationale: Obwohl ταῦτα grammatisch Plural ist, verweist das idiomatische deutsche „das“ umfassend auf Jesu unmittelbar vorausgehende Aussagen, ohne sie enger als „diese Worte“ zu bestimmen.
