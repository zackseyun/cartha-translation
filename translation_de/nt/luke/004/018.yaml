id: LUK.4.18
reference: Luke 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: de
  text: Der Geist des Herrn ist auf mir, weil er mich gesalbt hat, den Armen gute Nachricht zu verkünden. Er hat mich gesandt, den Gefangenen Befreiung[a] und den Blinden die Wiedererlangung des Augenlichts zu verkünden, die Zerschlagenen[b] in Freiheit zu entlassen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Vergebung“ bedeuten; bei Gefangenen und Zerschlagenen legt der Zusammenhang hier „Befreiung“ nahe.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Zerbrochenen“; im Zusammenhang kann damit auch „die Unterdrückten“ gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: der Geist des Herrn
  rationale: Der Genitiv bezeichnet hier am natürlichsten Zugehörigkeit beziehungsweise Herkunft. Die Formulierung bewahrt zudem den Bezug zum Jesajazitat.
- source_word: ἐπ’ ἐμέ
  choice: ist auf mir
  rationale: Im Griechischen fehlt eine ausdrückliche Kopula; im Deutschen wird sie ergänzt. „Auf mir“ bildet die Präposition eng ab und bewahrt den feierlichen Schriftklang.
- source_word: οὗ εἵνεκεν
  choice: weil
  rationale: Die Wendung ist kausal. „Weil“ gibt diesen Zusammenhang in natürlichem, heutigem Deutsch wieder.
- source_word: ἔχρισέν με
  choice: er mich gesalbt hat
  rationale: „Salben“ bewahrt die messianische Resonanz von χρίω; das Perfekt stellt die vollzogene Salbung mit ihrer fortdauernden Bedeutung dar.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: den Armen gute Nachricht zu verkünden
  rationale: Die Wendung bezeichnet das Verkünden einer guten Botschaft. „Den Armen“ lässt offen, ob vor allem wirtschaftliche Armut oder auch soziale Niedrigkeit im Blick steht.
- source_word: ἀπέσταλκέν με
  choice: Er hat mich gesandt
  rationale: Das deutsche Perfekt gibt die vollzogene Sendung und ihre fortdauernde Geltung angemessen wieder.
- source_word: κηρύξαι
  choice: zu verkünden
  rationale: κηρύσσω meint öffentliches Ausrufen. „Verkünden“ ist präzise und vermeidet eine unnötige Einengung auf kirchliches Predigen.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: den Gefangenen Befreiung
  rationale: ἄφεσις kann Freilassung, Befreiung oder Vergebung bezeichnen. In Verbindung mit Gefangenen liegt hier die Befreiungsbedeutung nahe.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: den Blinden die Wiedererlangung des Augenlichts
  rationale: ἀνάβλεψις bezeichnet das Erlangen beziehungsweise Wiedererlangen des Sehvermögens; die gewählte Formulierung erhält diese spezifische Bedeutung.
- source_word: ἀποστεῖλαι
  choice: zu entlassen
  rationale: Im Zusammenhang mit ἐν ἀφέσει bezeichnet das Verb das Aussenden beziehungsweise Entlassen in Freiheit. „Entlassen“ wahrt den Sendungsaspekt, ohne die Wendung unnatürlich wörtlich wiederzugeben.
- source_word: τεθραυσμένους
  choice: die Zerschlagenen
  rationale: Das Partizip bezeichnet wörtlich Menschen, die zerbrochen oder zerschlagen worden sind. „Die Zerschlagenen“ erhält dieses kräftige Bild und lässt körperliche, soziale und innere Bedrängnis offen.
- source_word: ἐν ἀφέσει
  choice: in Freiheit
  rationale: Die Formulierung gibt den Zustand der Freilassung idiomatisch wieder. Zugleich bleibt durch „Befreiung“ im vorigen Satzteil die Wiederholung desselben griechischen Begriffs erkennbar.
theological_decisions:
- issue: Bedeutung von ἄφεσις im Jesajazitat
  choice: Befreiung/Freiheit
  alternative: Vergebung
  rationale: Die unmittelbaren Bezüge auf Gefangene und Zerschlagene sowie der Befreiungshorizont des Jesajazitats sprechen hier vorrangig für Freilassung. Da Lukas ἄφεσις andernorts auch für Sündenvergebung gebraucht, wird diese echte Bedeutungsalternative in einer Fußnote bewahrt.
- issue: Deutung von τεθραυσμένους
  choice: die Zerschlagenen
  alternative: die Unterdrückten
  rationale: Die wörtlichere Bildsprache vermeidet eine vorschnelle Beschränkung auf politische oder soziale Unterdrückung, während die Fußnote den im Kontext gut möglichen idiomatischen Sinn nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftklang. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für natürliche deutsche Lesbarkeit maßvoll geglättet. Die abschließende Interpunktion bleibt als Komma stehen, da der Vers syntaktisch in Lukas 4,19 weitergeführt wird.
