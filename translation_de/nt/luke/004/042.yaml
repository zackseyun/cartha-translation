id: LUK.4.42
reference: Luke 4:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: de
  text: Als es Tag wurde, ging er hinaus und begab sich an einen einsamen Ort.[a] Und die Menschenmengen suchten nach ihm, kamen zu ihm und versuchten, ihn davon abzuhalten,[b] von ihnen wegzugehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen abgelegenen Ort“ oder „an einen unbewohnten Ort“. Das griechische Wort bezeichnet einen isolierten oder nicht bewohnten Ort, nicht zwingend eine Wüste.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hielten ihn zurück“. Der Ausdruck kann ein nachdrückliches oder auch körperliches Zurückhalten bezeichnen; im Zusammenhang geht es darum, seine Abreise zu verhindern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Als es Tag wurde
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den Vorgangscharakter.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ging er hinaus und begab sich
  rationale: Beide Bewegungsverben bleiben erkennbar, ohne die im Deutschen schwerfällige Wiederholung „ging hinaus und ging“ zu erzeugen.
- source_word: εἰς ἔρημον τόπον
  choice: an einen einsamen Ort
  rationale: ἔρημος bezeichnet hier einen abgelegenen beziehungsweise unbewohnten Ort; „einsam“ ist kontextgemäß und legt keine eigentliche Wüstenlandschaft fest.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der Plural des griechischen Ausdrucks wird bewahrt und bezeichnet größere Gruppen von Menschen.
- source_word: ἐπεζήτουν αὐτόν
  choice: suchten nach ihm
  rationale: Das Imperfekt beschreibt eine andauernde Suche; „suchten nach ihm“ gibt dies idiomatisch wieder.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: kamen zu ihm
  rationale: Die Wendung bezeichnet, dass die Menschen seinen Aufenthaltsort erreichten; die deutsche Fassung ist knapp und natürlich.
- source_word: κατεῖχον αὐτὸν
  choice: versuchten, ihn davon abzuhalten
  rationale: κατέχω kann Festhalten, Zurückhalten oder am Weggehen Hindern bedeuten. Die gewählte Formulierung gibt die kontextuelle Absicht wieder, ohne zwingend körperlichen Zwang anzunehmen.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: von ihnen wegzugehen
  rationale: 'Der negierte artikulierte Infinitiv ergänzt das Zurückhalten: Sie wollten verhindern, dass Jesus von ihnen fortging.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung mit „Und“ spiegelt die griechische Erzählweise, während „begab sich“ die Wiederholung zweier Bewegungsverben lesbar gestaltet. Die Imperfektformen werden als fortdauernde beziehungsweise versuchte Handlungen wiedergegeben.
