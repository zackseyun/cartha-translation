  source_fidelity: Die Übersetzung gibt den zeitlichen Übergang, die beiden Bewegungsakte, den abgelegenen Charakter des Ortes, die fortdauernde Suche der Menschenmengen sowie deren Versuch, Jesu Weggehen zu verhindern, sachgerecht wieder. „Versuchten, ihn davon abzuhalten“ gibt die kontextuelle Kraft von κατεῖχον angemessen wieder, ohne körperliches Festhalten festzulegen.
  naturalness: Modernes, gut lesbares Standarddeutsch. Die Formulierung „ging er hinaus und begab sich“ vermeidet eine im Deutschen unnötig harte Verbwiederholung und erhält dennoch die Abfolge der griechischen Handlungen. Auch die Satzverknüpfung mit „Und“ ist in diesem erzählerischen Register tragfähig.
