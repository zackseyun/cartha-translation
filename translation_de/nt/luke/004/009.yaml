  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: de
  text: 'Dann führte er ihn nach Jerusalem, stellte ihn auf die Zinne des Tempels[a] und sagte zu ihm: „Wenn du der Sohn Gottes bist[b], wirf dich von hier hinunter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Flügel des Tempels“. Das griechische Wort bezeichnet einen vorspringenden äußersten Teil oder einen hohen Punkt der Tempelanlage. Mit „Tempel“ ist hier die gesamte Anlage gemeint, nicht nur das innere Heiligtum.'
    reason: Lexikalische Alternative und kulturgeschichtliche Präzisierung.
  - marker: b
    text: 'Oder: „Da du der Sohn Gottes bist“. Die griechische Bedingungsform kann so verstanden werden; „wenn“ bewahrt hier den herausfordernden Ton des Versuchers.'
    reason: Alternative Lesart der Bedingung.
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: Dann führte er
  rationale: δέ kennzeichnet hier den Fortgang der Erzählung; „dann“ gibt die Abfolge natürlich wieder. ἄγω bezeichnet das Führen oder Bringen, wobei „führte“ die aktive Leitung bewahrt.
- source_word: ἔστησεν
  choice: stellte ihn
  rationale: Die kausative Bedeutung von ἵστημι ist hier „jemanden hinstellen“. Die Formulierung bleibt anschaulich und legt die genaue Art des Geschehens nicht weiter fest.
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: auf die Zinne des Tempels
  rationale: πτερύγιον bezeichnet wörtlich ein „Flügelchen“, in diesem baulichen Zusammenhang aber einen vorspringenden Rand oder erhöhten äußersten Punkt. „Zinne“ ist im Deutschen knapp, verständlich und traditionsnah. ἱερόν meint dabei die gesamte Tempelanlage, nicht nur das innere Heiligtum.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Wenn du der Sohn Gottes bist
  rationale: εἰ mit Indikativ kann je nach Zusammenhang auch argumentativ im Sinn von „da/weil“ verstanden werden. „Wenn“ bewahrt hier jedoch den herausfordernden Charakter der Versuchung und lässt die rhetorische Spannung bestehen.
- source_word: βάλε σεαυτὸν ἐντεῦθεν κάτω
  choice: stürz dich von hier hinunter
  rationale: βάλλω fordert hier eine heftige Abwärtsbewegung. „Stürz dich“ ist im modernen Deutsch natürlicher als das wörtlichere „wirf dich“; „von hier hinunter“ gibt ἐντεῦθεν κάτω vollständig wieder.
theological_decisions:
- issue: Die Herausforderung an Jesu Identität als Sohn Gottes
  choice: Wenn du der Sohn Gottes bist
  alternative: Da du der Sohn Gottes bist / Weil du der Sohn Gottes bist
  rationale: Die griechische Bedingung kann unter Umständen eine als gegeben vorausgesetzte Tatsache aufnehmen. Im Versuchungskontext hält „wenn“ sowohl die Provokation des Versuchers als auch die vom Erzähler nicht infrage gestellte Identität Jesu in Spannung, ohne die Aussage vorschnell als Zweifel oder als Begründung festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Zinne“ ist leicht gehoben, im baulichen Zusammenhang jedoch geläufig; die Fußnote erklärt die mögliche Bedeutung. Direkte Rede und Ausrufezeichen geben den befehlenden Charakter des Imperativs wieder.
