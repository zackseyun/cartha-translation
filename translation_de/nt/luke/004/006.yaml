  rationale: Eine geringfügige stilistische Revision ersetzt „all diese Vollmacht“ durch das im modernen Standarddeutsch natürlichere „diese ganze Vollmacht“. Bedeutung, Betonung, Bezug der Pronomen und die theologische Zurückhaltung des Entwurfs bleiben unverändert.
