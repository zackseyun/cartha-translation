  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: de
  text: 'Und der Teufel sagte zu ihm: »Dir werde ich diese ganze Vollmacht und ihre Herrlichkeit[a] geben; denn sie ist mir übergeben worden, und ich gebe sie, wem ich will.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren Glanz« oder »ihre Pracht«.'
    reason: Lexikalische Alternative für δόξα im Zusammenhang mit den zuvor gezeigten Reichen.
lexical_decisions:
- source_word: διάβολος
  choice: der Teufel
  rationale: Im lukanischen Versuchungsbericht ist dies die geläufige Bezeichnung der persönlichen Gestalt; die etymologische Wiedergabe »Verleumder« wäre hier weniger natürlich.
- source_word: Σοὶ δώσω
  choice: Dir werde ich … geben
  rationale: Die Voranstellung von Σοί wird durch das betonte »Dir« bewahrt, ohne die deutsche Wortstellung unnatürlich zu machen.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Das Wort bezeichnet hier Herrschaftsbefugnis beziehungsweise Verfügungsgewalt, nicht bloß Kraft. »Vollmacht« bewahrt diesen Sinn prägnant.
- source_word: ταύτην ἅπασαν
  choice: all diese
  rationale: Die Verbindung aus Demonstrativpronomen und ἅπασαν betont die Gesamtheit der zuvor gezeigten Herrschaftsbereiche.
- source_word: δόξαν αὐτῶν
  choice: ihre Herrlichkeit
  rationale: »Herrlichkeit« erhält die biblische Bedeutungsbreite von δόξα; im Kontext ist besonders der Glanz beziehungsweise die Pracht der Reiche gemeint.
- source_word: παραδέδοται
  choice: ist mir übergeben worden
  rationale: Das Perfekt Passiv bezeichnet eine erfolgte Übergabe mit fortbestehendem Ergebnis. Die Formulierung wahrt zugleich, dass dies die Behauptung des Teufels ist.
- source_word: ᾧ ἂν θέλω
  choice: wem ich will
  rationale: Die knappe deutsche Wendung gibt die unbestimmte Bezugsperson und den behaupteten freien Willensentscheid natürlich wieder.
- source_word: δίδωμι αὐτήν
  choice: ich gebe sie
  rationale: Der Präsens drückt eine allgemeine beziehungsweise wiederholbare Verfügung aus; das Pronomen bezieht sich grammatisch auf die Vollmacht.
theological_decisions:
- issue: Ob die Übersetzung die Behauptung des Teufels über seine Verfügungsmacht bestätigen oder abschwächen soll
  choice: Die direkte Aussage wird ohne redaktionellen Zusatz wiedergegeben.
  alternative: Distanzierende Zusätze wie »angeblich« oder »wie er behauptete« einfügen.
  rationale: Der griechische Text präsentiert die Worte als Behauptung des Teufels. Die Übersetzung soll sie weder als objektive Tatsache bestätigen noch durch nicht vorhandene Zusätze abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vollmacht« ist im biblischen Sprachgebrauch verständlich und trifft die politische beziehungsweise herrschaftliche Nuance genauer als das mehrdeutige »Macht«. Die direkte Rede bewahrt durch »Dir« die Hervorhebung des griechischen Satzanfangs.
