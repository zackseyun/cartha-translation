  verdict: revise
  source_fidelity: Der Entwurf trifft Ort, Personenbeziehung und Krankheitsangabe im Wesentlichen. „Sie baten ihn ihretwegen“ legt jedoch den Bittecharakter stärker als der zurückhaltende griechische Ausdruck ἠρώτησαν αὐτὸν περὶ αὐτῆς ausdrücklich sagt. Die Hauptübersetzung sollte die offenere Formulierung bewahren; die kontextuell naheliegende Bitte gehört in die Anmerkung.
  naturalness: „Er stand auf, verließ die Synagoge“ ist verständlich, wirkt aber gegenüber dem partizipialen Aufbruch etwas unnötig zerlegt. „Er brach von der Synagoge auf“ ist flüssig und gibt ἀναστάς ἀπό idiomatisch wieder. „Sie fragten ihn wegen ihr“ ist modernes, klares Standarddeutsch.
  terminology: „Simons Schwiegermutter“ und „hohes Fieber“ sind korrekt und natürlich. „Von hohem Fieber befallen“ kann beibehalten werden und vermittelt angemessen das von συνέχω ausgedrückte Ergriffensein.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ἠρώτησαν αὐτὸν περὶ αὐτῆς als „sie baten ihn ihretwegen“ ist zu bestimmt.
    rationale: ἐρωτάω kann in diesem Kontext eine Bitte einschließen, doch die Konstruktion mit περί nennt keine konkrete Bitte oder Hilfeleistung. Die englische Prüfvorgabe bewahrt deshalb im Haupttext ausdrücklich die offenere Lesart und vermerkt die Bitte als Kontextnuance.
  - severity: low
    issue: Die Fußnote bezeichnet „sie fragten ihn wegen ihr“ nur als mögliche wörtliche Wiedergabe, obwohl der Haupttext eine stärker interpretierende Bitte bietet.
    rationale: Nach der Korrektur des Haupttexts soll die Fußnote allein die kontextuelle Möglichkeit einer Bitte um Hilfe erläutern, ohne den griechischen Wortlaut als bloße Alternative zu behandeln.
