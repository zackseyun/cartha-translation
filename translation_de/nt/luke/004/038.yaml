source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: de
  text: Er brach von der Synagoge auf und ging in Simons Haus. Simons Schwiegermutter war von hohem Fieber befallen, und sie fragten ihn wegen ihr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck lautet wörtlich „sie fragten ihn betreffs/wegen ihr“ und kann im Zusammenhang eine Bitte um Hilfe einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Er stand auf, verließ die Synagoge
  rationale: Das aoristische Partizip bezeichnet eine der Haupthandlung vorausgehende Bewegung. In Verbindung mit ἀπό wird der Aufbruch aus der Synagoge im Deutschen natürlich durch „stand auf, verließ“ wiedergegeben.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ging in Simons Haus
  rationale: εἰσέρχομαι mit εἰς bezeichnet das Hineingehen in einen Ort. „Ging in Simons Haus“ ist idiomatisch und bewahrt die Bewegungsrichtung.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: Simons Schwiegermutter
  rationale: πενθερά bezeichnet eindeutig die Schwiegermutter; die deutsche Genitivkonstruktion gibt die Beziehung knapp und direkt wieder.
- source_word: ἦν συνεχομένη
  choice: war … befallen
  rationale: Die periphrastische Passivkonstruktion beschreibt, dass die Frau von der Krankheit festgehalten beziehungsweise schwer betroffen war. „War … befallen“ wahrt diesen passiven Krankheitsbezug in natürlichem Deutsch.
- source_word: πυρετῷ μεγάλῳ
  choice: von hohem Fieber
  rationale: μέγας verstärkt hier die Schwere des Fiebers. „Hohes Fieber“ ist die übliche moderne deutsche Bezeichnung.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: sie baten ihn ihretwegen
  rationale: ἐρωτάω kann sowohl „fragen“ als auch „bitten“ bedeuten. Der Zusammenhang legt eine Fürbitte beziehungsweise Bitte um Hilfe nahe; „ihretwegen“ bewahrt zugleich die weniger ausdrückliche Formulierung περὶ αὐτῆς.
theological_decisions:
- issue: Folgerung aus der Bezeichnung πενθερά über Simons Ehestand
  choice: Die Verwandtschaftsbezeichnung wird unmittelbar mit „Schwiegermutter“ wiedergegeben, ohne weitere Folgerungen in den Text aufzunehmen.
  alternative: Eine erklärende Erweiterung, dass Simon verheiratet war.
  rationale: Der Verwandtschaftsbegriff hat diese Implikation, doch der Vers selbst formuliert keine zusätzliche historische oder lehrmäßige Aussage darüber.
- issue: Bedeutungsumfang der an Jesus gerichteten Äußerung
  choice: „sie baten ihn ihretwegen“
  alternative: „sie fragten ihn wegen ihr“ oder ausdrücklich „sie baten ihn, ihr zu helfen“
  rationale: 'Der Heilungszusammenhang spricht für eine Bitte, doch der griechische Wortlaut nennt die erbetene Handlung nicht ausdrücklich. Die gewählte Form wahrt beides: den Bittecharakter und die textliche Zurückhaltung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung ist flüssig und allgemein verständlich; „war … befallen“ bewahrt den nachdrücklichen Krankheitszustand, ohne altertümlich zu wirken.
