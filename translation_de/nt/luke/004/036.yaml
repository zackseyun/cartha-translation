  source_fidelity: Der Entwurf gibt θάμβος, die gegenseitige Gesprächssituation, Vollmacht und Kraft sowie die Bezeichnung „unreine Geister“ zuverlässig wieder. Die Gegenwartsformen von ἐπιτάσσει und ἐξέρχονται werden jedoch mit „ausfahren“ weniger klar und weniger modern wiedergegeben.
  naturalness: „Da kam Staunen über alle“ und besonders die dass-Konstruktion nach „Was ist das für ein Wort“ wirken im heutigen Standarddeutsch schwerfällig. „Ausfahren“ ist in diesem Zusammenhang traditionell-biblisch, aber nicht die natürlichste moderne Formulierung.
  terminology: „Vollmacht und Kraft“ unterscheidet ἐξουσία und δύναμις angemessen. „Unreine Geister“ ist die etablierte, quellennahe Wiedergabe von ἀκάθαρτα πνεύματα. Die Fußnote bewahrt die lexikalische Offenheit von λόγος.
