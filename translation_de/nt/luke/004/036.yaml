revisions:
- from: 'Da kam Staunen über alle, und sie redeten miteinander und sagten: „Was ist das für ein Wort,[a] dass er den unreinen Geistern mit Vollmacht und Kraft befiehlt und sie ausfahren?“'
  to: 'Alle wurden von Staunen erfasst, und sie redeten miteinander und sagten: „Was ist das für ein Wort?[a] Mit Vollmacht und Kraft gebietet er den unreinen Geistern, und sie kommen heraus!“'
  rationale: 'Die Revision glättet die deutsche Syntax und ersetzt die veraltete Formulierung „ausfahren“ durch modernes „herauskommen“. Die semantische Spannung der Reaktion bleibt erhalten: Das „Wort“ bzw. die „Botschaft“ zeigt sich darin, dass Jesus mit Vollmacht und Kraft den unreinen Geistern gebietet und sie herauskommen. Die Fußnotenmarkierung bleibt direkt bei „Wort“ verankert.'
