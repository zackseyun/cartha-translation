source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: de
  text: 'Alle wurden von Staunen erfasst, und sie redeten miteinander und sagten: „Was ist das für ein Wort?[a] Mit Vollmacht und Kraft gebietet er den unreinen Geistern, und sie kommen heraus!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ist das für eine Botschaft?“ Das griechische Wort logos kann „Wort“, „Botschaft“ oder „Sache“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: Staunen
  rationale: Bezeichnet starkes Erstaunen; „Staunen“ ist natürlich, gegenwärtig und gibt die Reaktion angemessen wieder.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: Da kam ... über alle
  rationale: Bewahrt das Bild, dass das Staunen alle ergreift, und folgt zugleich einem natürlichen deutschen Satzbau.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: sie redeten miteinander
  rationale: Gibt den imperfektischen, fortdauernden Austausch und die wechselseitige Gesprächssituation wieder, ohne eine förmliche Diskussion zu unterstellen.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Was ist das für ein Wort
  rationale: Die Wendung bewahrt λόγος als „Wort“ und gibt zugleich den qualitativen Sinn der erstaunten Frage im Deutschen idiomatisch wieder.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: mit Vollmacht und Kraft
  rationale: „Vollmacht“ bezeichnet hier wirksame, legitime Befehlsgewalt; „Kraft“ gibt δύναμις wieder und hält beide griechischen Begriffe unterscheidbar.
- source_word: ἐπιτάσσει
  choice: er ... befiehlt
  rationale: Das Präsens und die Bedeutung eines verbindlichen Befehls werden direkt bewahrt.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: den unreinen Geistern
  rationale: Entspricht der wörtlichen und im Evangelienkontext etablierten Bezeichnung und bewahrt den jüdischen Reinheitshintergrund.
- source_word: ἐξέρχονται
  choice: sie ausfahren
  rationale: „Ausfahren“ ist im deutschen biblischen Exorzismuskontext eine klare, kompakte Bezeichnung dafür, dass die Geister einen Menschen verlassen.
theological_decisions:
- issue: Bezeichnung der dämonischen Wesen im Exorzismusbericht
  choice: unreine Geister
  alternative: böse Geister; unreine Mächte
  rationale: Die Übersetzung bewahrt die konkrete Redeweise des griechischen Textes und dessen übernatürlichen Erzählrahmen, ohne psychologisierend oder metaphorisch umzudeuten.
- issue: Verhältnis von ἐξουσία und δύναμις
  choice: Vollmacht und Kraft
  alternative: Autorität und Macht
  rationale: 'Beide Begriffe bleiben als zusammengehörige, aber nicht identische Aspekte stehen: Befehlsgewalt beziehungsweise Berechtigung und wirksame Kraft.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „Was ist das für ein Wort“ ist idiomatisch, bewahrt aber die Mehrdeutigkeit von λόγος; „ausfahren“ hält den biblischen Kontext knapp und eindeutig fest.
