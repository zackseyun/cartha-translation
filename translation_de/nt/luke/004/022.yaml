source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: de
  text: 'Und alle sprachen anerkennend über ihn[a] und staunten über die Worte der Gnade[b], die aus seinem Mund kamen. Sie sagten: »Ist das nicht Josefs Sohn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »legten Zeugnis für ihn ab«. Die griechische Wendung kann sowohl anerkennendes Reden als auch Zeugnisgeben bezeichnen; im Zusammenhang mit ihrem Staunen liegt hier eine anerkennende Reaktion nahe.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck kann Worte bezeichnen, die von Gnade, Wohlwollen oder besonderer Anmut geprägt sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: äußerten sich anerkennend über ihn
  rationale: Die Wendung kann ein Zeugnisgeben bezeichnen, meint hier im Zusammenhang mit dem Staunen aber wahrscheinlich eine anerkennende Reaktion. Die Formulierung ist natürliches modernes Deutsch, ohne die mögliche Zeugnissprache ganz zu verschweigen; diese steht in der Fußnote.
- source_word: ἐθαύμαζον
  choice: staunten
  rationale: Das Imperfekt beschreibt ihre fortdauernde Reaktion. »Staunten« gibt die Verwunderung klar und idiomatisch wieder, ohne zwingend anhaltende Zustimmung zu unterstellen.
- source_word: ἐπὶ τοῖς λόγοις
  choice: über die Worte
  rationale: ἐπί mit Dativ bezeichnet hier Anlass oder Grundlage des Staunens. »über« ist die natürliche deutsche Verbindung mit »staunen«.
- source_word: τῆς χάριτος
  choice: voller Gnade
  rationale: 'Der Genitiv kann qualitativ verstanden werden: Worte, die von Gnade, Wohlwollen oder Anmut geprägt sind. »voller Gnade« bewahrt die theologisch und lexikalisch offene Gnaden-Sprache besser als das möglicherweise auf bloße Freundlichkeit verengte »gnädige Worte«.'
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: die aus seinem Mund kamen
  rationale: Die Formulierung erhält das konkrete Bild und gibt das Partizip in flüssigem, modernem Deutsch wieder.
- source_word: Οὐχὶ
  choice: Ist das nicht
  rationale: Die Fragepartikel erwartet grundsätzlich Zustimmung. Die deutsche rhetorische Frage bildet diese Erwartung natürlich ab.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Josefs Sohn
  rationale: Der Genitiv wird idiomatisch possessiv wiedergegeben. Die Aussage wird als Wahrnehmung der Menge ohne erklärenden Zusatz übersetzt.
theological_decisions:
- issue: Bezeichnung Jesu als Josefs Sohn angesichts der jungfräulichen Empfängnis
  choice: Die Aussage der Menge wird uneingeschränkt als »Josefs Sohn« wiedergegeben.
  alternative: Durch einen Zusatz oder eine distanzierende Formulierung ausdrücklich klarstellen, dass Josef nicht Jesu leiblicher Vater sei.
  rationale: Der Vers berichtet die Sicht der Menge und korrigiert sie an dieser Stelle nicht ausdrücklich. Ein erklärender Zusatz würde die vom Text erzeugte Spannung vorzeitig auflösen.
- issue: Bedeutung von λόγοις τῆς χάριτος
  choice: »Worte voller Gnade«
  alternative: »wohlgefällige/gewinnende Worte« oder »Worte der Gnade«
  rationale: Die gewählte Fassung bewahrt sowohl den qualitativen Sinn anmutiger, wohlwollender Rede als auch die mögliche heilsgeschichtliche Bedeutung von »Gnade«, ohne sich ausschließlich auf eine davon festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte griechische Verknüpfung mit καί wird in zwei Sätze gegliedert, um einen natürlichen deutschen Lesefluss zu schaffen. Die Fußnotenmarker stehen jeweils unmittelbar bei der mehrdeutigen Wendung.
