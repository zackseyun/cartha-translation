id: LUK.4.23
reference: Luke 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Gewiss werdet ihr mir dieses Sprichwort sagen: ›Arzt, heile dich selbst!‹ Alles, wovon wir gehört haben, dass es in Kafarnaum[a] geschehen ist, tu auch hier in deiner Heimat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlicher steht im Griechischen eine Präposition mit der Bedeutung »nach/zu Kafarnaum«. In Verbindung mit »geschehen« kann sie hier im Kontext örtlich verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Gewiss
  rationale: Gibt die nachdrückliche Erwartung wieder, mit der Jesus die bevorstehende Reaktion ankündigt, und bleibt zugleich in einem würdigen, natürlichen Register.
- source_word: ἐρεῖτέ μοι
  choice: werdet ihr mir … sagen
  rationale: Bewahrt den Futur als sichere Vorhersage und gibt λέγω mit Dativ direkt wieder.
- source_word: παραβολὴν
  choice: Sprichwort
  rationale: Bezeichnet hier keinen ausgeführten Gleichnisbericht, sondern die kurze sprichwörtliche Aufforderung »Arzt, heile dich selbst«.
- source_word: Ἰατρέ
  choice: Arzt
  rationale: Die direkte Anrede ist im Deutschen knapp, verständlich und für die sprichwörtliche Form angemessen.
- source_word: θεράπευσον σεαυτόν
  choice: heile dich selbst
  rationale: Bewahrt den direkten Imperativ und die traditionelle, im Deutschen verständliche Gestalt des Sprichworts.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Alles, wovon wir gehört haben, dass es … geschehen ist
  rationale: Gibt sowohl den Umfang von ὅσα als auch den nur berichteten Kenntnisstand und das Geschehen von γίνομαι natürlich wieder, ohne ausdrücklich Taten oder Wunder einzutragen.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: in Kafarnaum
  rationale: Bei einem Verb des Geschehens hat εἰς hier idiomatisch lokalen Sinn; die ungewöhnlichere wörtliche Präposition wird in einer Fußnote dokumentiert.
- source_word: ποίησον καὶ ὧδε
  choice: tu auch hier
  rationale: Bewahrt den breiten Sinn des Aoristimperativs ποίησον und die ergänzende Kraft von καί in natürlicher deutscher Wortstellung.
- source_word: ἐν τῇ πατρίδι σου
  choice: in deiner Heimat
  rationale: Bewahrt die mögliche Spannweite von πατρίς zwischen Heimatort und Heimatgebiet, statt den Ausdruck unnötig auf eine Stadt festzulegen.
theological_decisions:
- issue: Bedeutung von παραβολή in diesem Zusammenhang
  choice: Sprichwort
  alternative: Gleichnis; Ausspruch
  rationale: »Arzt, heile dich selbst« ist hier eine knappe sprichwörtliche Maxime und kein erzählendes Gleichnis.
- issue: Art der in Kafarnaum berichteten Ereignisse
  choice: neutral als »geschehen« wiedergegeben
  alternative: »getan« oder ausdrücklich »Wunder getan«
  rationale: γενόμενα bezeichnet zunächst Geschehenes. Die Übersetzung vermeidet es, die im Kontext naheliegenden Machttaten ausdrücklich in den Wortlaut einzutragen, und erhält so die lexikalische Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Gewiss« und die sprichwörtliche Formulierung vermeiden Umgangssprache; »Heimat« erhält die räumliche Offenheit des griechischen Ausdrucks.
