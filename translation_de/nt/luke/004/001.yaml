source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: de
  text: Jesus aber kehrte, erfüllt vom Heiligen Geist, vom Jordan zurück und wurde vom Geist[a] in der Wüste geführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Geist“. Die griechische Wendung kann wörtlicher so wiedergegeben werden; im Zusammenhang ist wahrscheinlich gemeint, dass der Geist Jesus führte.'
    reason: lexikalische Alternative und Bewahrung der möglichen Mehrdeutigkeit von ἐν τῷ πνεύματι
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: erfüllt vom Heiligen Geist
  rationale: πλήρης mit dem Genitiv bezeichnet, dass jemand von etwas erfüllt beziehungsweise voll davon ist. Die Formulierung ist im modernen Deutsch natürlich und beschreibt Jesu Zustand, ohne ausdrücklich ein punktuelles Ereignis des Erfülltwerdens zu behaupten.
- source_word: ὑπέστρεψεν
  choice: kehrte … zurück
  rationale: Der Aorist von ὑποστρέφω bezeichnet hier die Rückkehr. „Kehrte zurück“ ist präzise, idiomatisch und entspricht der Erzählbewegung.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: vom Jordan
  rationale: Der griechische Text nennt den Jordan ohne einen Zusatz wie „Fluss“. Auch im Deutschen ist „vom Jordan“ eindeutig und natürlich.
- source_word: ἤγετο
  choice: wurde … geführt
  rationale: Das Imperfekt Passiv stellt das Führen als andauernden Vorgang in der Vergangenheit dar. Das deutsche Passiv bewahrt sowohl die Perspektive auf Jesus als den Geführten als auch die Offenheit der griechischen Verlaufsform, soweit dies idiomatisch möglich ist.
- source_word: ἐν τῷ πνεύματι
  choice: vom Geist
  rationale: Bei dem passiven Verb ἄγω kann ἐν den Handelnden beziehungsweise das Mittel bezeichnen. Im unmittelbaren Zusammenhang ist der zuvor genannte Heilige Geist der natürliche Bezug; die mögliche wörtlichere Wiedergabe „im Geist“ bleibt in einer Fußnote erhalten.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: ἔρημος bezeichnet eine unbewohnte, öde Gegend. „Wüste“ ist im Deutschen die geläufige biblische Bezeichnung, ohne zwingend eine reine Sandwüste vorauszusetzen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert einen leichten Übergang oder eine Fortführung mit Kontrastnuance. Das nachgestellte „aber“ ist im deutschen Erzählstil knapp und angemessen.
theological_decisions:
- issue: Bezug von πνεῦμα in ἐν τῷ πνεύματι
  choice: der Heilige Geist als derjenige, der Jesus führt
  alternative: Jesu eigener Geist beziehungsweise „im Geist“ als Beschreibung seiner geistlichen Sphäre oder Verfassung
  rationale: Unmittelbar zuvor wird Jesus als vom Heiligen Geist erfüllt beschrieben. Daher liegt es im lukanischen Zusammenhang am nächsten, denselben Geist als den Führenden zu verstehen. Die Übersetzung legt darüber hinaus keine spätere dogmatische Ausarbeitung in den Vers hinein; die sprachlich mögliche Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den erzählerischen Übergang und die enge Verbindung zwischen Jesu Erfülltsein vom Heiligen Geist und seinem Geführtwerden. Auf altertümliche Formulierungen wie „voll Heiligen Geistes“ wurde zugunsten gegenwärtiger Verständlichkeit verzichtet.
