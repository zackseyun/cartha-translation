  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur und den Sinn zuverlässig wieder: πλήρης πνεύματος ἁγίου als andauernder Zustand („erfüllt vom Heiligen Geist“), ὑπέστρεψεν als Rückkehr vom Jordan sowie das imperfektische Passiv ἤγετο als Geführtwerden. „In der Wüste“ entspricht ἐν τῇ ἐρήμῳ ohne eine spezifische Landschaftsform zu behaupten.'
