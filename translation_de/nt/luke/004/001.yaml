  terminology: „Heiliger Geist“, „Jordan“ und „Wüste“ sind etablierte und sachgerechte Bezeichnungen. Die Wiedergabe von ἐν τῷ πνεύματι mit „vom Geist“ folgt dem unmittelbaren Kontext und dem englischen Audit Trail, ohne die sprachliche Alternative zu verschweigen. Die Fußnote wahrt die mögliche wörtlichere Lesart „im Geist“ angemessen.
