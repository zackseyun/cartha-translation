  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: de
  text: 'Denn es steht geschrieben: »Er wird seinen Engeln befehlen, dich zu beschützen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »Er wird seinen Engeln in Bezug auf dich befehlen, dich zu bewahren.«'
    reason: Macht den Bezug von περὶ σοῦ („in Bezug auf dich“) und die bewahrende Nuance von διαφυλάξαι ausdrücklich sichtbar.
lexical_decisions:
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: 'Die geläufige deutsche Formel für ein Schriftzitat gibt den resultativen Sinn des griechischen Perfekts natürlich wieder: Das Geschriebene besitzt fortdauernde Geltung.'
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt die begründende Verbindung zur vorausgehenden Aussage.
- source_word: ὅτι
  choice: ':'
  rationale: Nach der deutschen Einleitungsformel wird der Inhalt des Zitats idiomatisch durch einen Doppelpunkt statt durch ein ausdrückliches „dass“ eingeführt.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: seinen Engeln
  rationale: Natürliche Wiedergabe der Dativkonstruktion mit dem Possessivpronomen.
- source_word: ἐντελεῖται
  choice: wird er … befehlen
  rationale: Das Futur von ἐντέλλομαι bezeichnet das Erteilen eines Befehls oder Auftrags; die deutsche Wortstellung bleibt trotz des eingeschobenen Dativobjekts klar.
- source_word: περὶ σοῦ
  choice: deinetwegen
  rationale: περί mit Genitiv kann „dich betreffend“ beziehungsweise „deinetwegen“ bedeuten. Im Zusammenhang eines zu erteilenden Schutzauftrags ist „deinetwegen“ natürlich und lässt den Bezug auf die angesprochene Person bestehen.
- source_word: τοῦ διαφυλάξαι σε
  choice: dich zu beschützen
  rationale: Der artikulierte Infinitiv erläutert Ziel beziehungsweise Inhalt des Befehls. „Beschützen“ gibt die bewahrende Schutzfunktion von διαφυλάσσω in heutigem Deutsch natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Psalmzitats in der Rede des Versuchers
  choice: Nur den von Lukas überlieferten Wortlaut wiedergeben
  alternative: Den vollständigeren Wortlaut von Psalm 91,11 ergänzen oder an dessen traditionelle Form angleichen
  rationale: Lukas zitiert hier nur einen Teil der Psalmstelle. Eine Ergänzung würde nicht im griechischen Text dieses Verses enthaltene Worte eintragen.
- issue: Bezug von περὶ σοῦ und τοῦ διαφυλάξαι σε
  choice: Der Schutz wird als Ziel beziehungsweise Inhalt des Befehls wiedergegeben
  alternative: Die Infinitivgruppe lediglich lose an „deinetwegen“ anschließen
  rationale: Die griechische Konstruktion lässt eine enge erklärende Beziehung erkennen, ohne eine weitergehende theologische Deutung des versprochenen Schutzes festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste Schriftzitat-Formel „es steht geschrieben“ bleibt erhalten; „deinetwegen“ und „beschützen“ vermeiden unnötig hölzerne Formulierungen. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Zitat.
