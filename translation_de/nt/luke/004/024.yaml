id: LUK.4.24
reference: Luke 4:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: de
  text: 'Dann sagte er: »Amen, ich sage euch: Kein Prophet ist in seiner Heimat[a] willkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »an seinem Heimatort« beziehungsweise »in seinem Heimatland«. Das griechische Wort πατρίς kann den Heimatort, die Heimatgegend oder das Heimatland bezeichnen; hier weist der Zusammenhang auf Nazaret.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Dann sagte er
  rationale: δέ ist hier ein leichter erzählerischer Anschluss. »Dann« gibt den Fortgang natürlich wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: Ἀμὴν
  choice: Amen
  rationale: Das vorangestellte »Amen« ist eine charakteristische feierliche Bekräftigungsformel Jesu. Die im Deutschen geläufige Transliteration bewahrt Form und Nachdruck des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte und feierliche Anrede wird formal klar bewahrt und ist im modernen Deutsch verständlich.
- source_word: οὐδεὶς προφήτης
  choice: Kein Prophet
  rationale: Dies ist die knappe und idiomatische deutsche Wiedergabe der verneinten Subjektkonstruktion.
- source_word: δεκτός
  choice: willkommen
  rationale: Das Prädikatsadjektiv bezeichnet hier günstige Aufnahme beziehungsweise Anerkennung. »Willkommen« passt zur persönlichen Aufnahme eines Propheten und bleibt natürlich.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: in seiner Heimat
  rationale: πατρίς kann den Heimatort, die Heimatgegend oder das Heimatland bezeichnen. »Heimat« bewahrt diese Bedeutungsbreite besser als das engere »Heimatstadt«, während der Zusammenhang auf Nazaret weist.
theological_decisions:
- issue: Umfang der Aussage über die Ablehnung eines Propheten
  choice: Die allgemeine, sprichwortartige Form »Kein Prophet …« bleibt uneingeschränkt stehen.
  alternative: Die Aussage ausdrücklich auf Jesus oder nur auf Nazaret zu begrenzen.
  rationale: Der griechische Text formuliert allgemein. Der erzählerische Zusammenhang legt die Anwendung auf Jesus nahe, ohne sie in diesem Satz ausdrücklich auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, im Deutschen verständliche Formel »Amen, ich sage euch« bewahrt den feierlichen Ton; »willkommen« formuliert die soziale Aufnahme natürlich. Die Fußnote erhält die Bedeutungsbreite von πατρίς.
