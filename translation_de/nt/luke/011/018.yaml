id: LUK.11.18
reference: Luke 11:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: de
  text: Wenn aber auch Satan mit sich selbst entzweit ist, wie wird sein Reich bestehen? Denn ihr sagt, ich treibe die Dämonen durch Beelzebul[a] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Beelzebul; in manchen Übersetzungstraditionen steht Beelzebub.
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Die im Deutschen übliche Wiedergabe des griechischen Namens bzw. Titels.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: mit sich selbst entzweit ist
  rationale: Gibt die innere Spaltung und Gegnerschaft idiomatisch wieder; das deutsche Präsens bezeichnet passend den daraus entstandenen Zustand im Bedingungssatz.
- source_word: πῶς σταθήσεται
  choice: wie wird … bestehen?
  rationale: Bewahrt Zukunftsbezug und Bildkraft; „bestehen“ bezeichnet hier Fortbestand und Stabilität.
- source_word: βασιλεία
  choice: Reich
  rationale: Die geläufige und kontextgerechte Bezeichnung für Satans Herrschaftsbereich.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung ein, die Jesu rhetorische Frage auf die Anschuldigung seiner Gegner zurückführt.
- source_word: ἐν Βεελζεβοὺλ
  choice: durch Beelzebul
  rationale: ἐν bezeichnet hier idiomatisch Mittel oder Wirkursache; „durch“ ist natürlich und vermeidet eine unnötige Ausdeutung als ausdrücklich genannte Macht.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Folgt unmittelbar der Namensform des griechischen Ausgangstextes.
- source_word: ἐκβάλλειν
  choice: austreiben
  rationale: Im Deutschen die etablierte und präzise Wiedergabe im Zusammenhang mit Dämonenaustreibungen.
- source_word: δαιμόνια
  choice: Dämonen
  rationale: Direkte, konventionelle Wiedergabe ohne interpretierende Umschreibung.
theological_decisions:
- issue: Art der Anschuldigung gegen Jesus
  choice: Jesus treibe die Dämonen „durch Beelzebul“ aus.
  alternative: Jesus treibe die Dämonen „durch die Macht Beelzebuls“ oder „in Verbindung mit Beelzebul“ aus.
  rationale: Die Übersetzung gibt die instrumentale bzw. agentive Aussage von ἐν idiomatisch wieder, ohne die Art der behaupteten Einwirkung genauer festzulegen, als es der griechische Text tut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Mit sich selbst entzweit“ bewahrt die rhetorische Spannung und klingt natürlicher als eine wörtliche passive Formulierung.
