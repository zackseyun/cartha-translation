  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: de
  text: Und vergib uns unsere Sünden; denn auch wir selbst vergeben jedem, der uns etwas schuldet.[a] Und bring uns nicht in Versuchung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedem, der uns etwas schuldig ist“; das Griechische verwendet hier Schuldensprache, obwohl im ersten Satzteil von „Sünden“ die Rede ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in eine Prüfung“ beziehungsweise „in eine Erprobung“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: vergib
  rationale: Der Aoristimperativ von ἀφίημι bedeutet im Gebetskontext natürlich „vergib“; „erlasse“ wäre hier zu stark auf Schulden eingeengt.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: unsere Sünden
  rationale: ἁμαρτίας bezeichnet ausdrücklich Sünden und nicht Schulden; die vertraute und lexikalisch direkte Wiedergabe ist „unsere Sünden“.
- source_word: καὶ γὰρ αὐτοὶ
  choice: denn auch wir selbst
  rationale: „Denn“ gibt die begründende Funktion von γάρ wieder, „auch“ berücksichtigt καί, und „wir selbst“ bewahrt die Betonung durch αὐτοί.
- source_word: ἀφίομεν
  choice: vergeben
  rationale: „Vergeben“ erhält die verbale Verbindung zu ἄφες und passt zum zwischenmenschlichen Zusammenhang, ohne die Schuldmetaphorik vollständig zu verflachen.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: jedem, der uns etwas schuldet
  rationale: Die Formulierung bewahrt die Schuldensprache von ὀφείλω und klingt zugleich in modernem Deutsch natürlich. Das unbestimmte „etwas“ vermeidet eine Beschränkung auf Geldschulden.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: bring uns nicht in Versuchung
  rationale: εἰσφέρω bedeutet wörtlich „hineinbringen“; die gewählte Form ist idiomatisch und näher am griechischen Verb als das traditionelle „führe“. „Versuchung“ ist eine plausible Hauptbedeutung von πειρασμός.
theological_decisions:
- issue: Bedeutung und theologische Spannung der Bitte mit πειρασμός
  choice: „bring uns nicht in Versuchung“ ohne erklärende Abschwächung
  alternative: „bring uns nicht in eine Prüfung“ oder traditionell „führe uns nicht in Versuchung“
  rationale: Der Wortlaut der Bitte wird bewahrt, ohne die Spannung hinsichtlich Gottes Verhältnis zur Versuchung dogmatisch aufzulösen. Die Bedeutungsbreite von πειρασμός wird in einer Fußnote sichtbar gemacht.
- issue: Verhältnis von Sünde und Schuldensprache
  choice: Im ersten Satzteil „Sünden“, im zweiten „schuldet“
  alternative: Beide Satzteile einheitlich mit Vergebungs- oder Schuldensprache wiedergeben
  rationale: Lukas verwendet zunächst ἁμαρτίας, danach aber ὀφείλοντι. Die Übersetzung erhält diesen bewussten lexikalischen Wechsel, ohne ihn auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Gebetssprache. Das Semikolon verbindet Bitte und Begründung klar; die abschließende Bitte bleibt als eigener Satz stehen. Die traditionelle Formulierung „führe uns nicht“ wurde zugunsten des quellennäheren und dennoch natürlichen „bring uns nicht“ vermieden.
