  naturalness: Der Satz ist klares, modernes Standarddeutsch und bewahrt einen angemessen würdigen biblischen Registerton. Die Formulierungen „für die Niniviten“ und „für diese Generation“ sind idiomatische Wiedergaben des jeweiligen Dativs der Beziehung.
  terminology: „Jona“, „Niniviten“, „Zeichen“, „Menschensohn“ und „Generation“ sind sachgerecht und konsistent. Besonders „Menschensohn“ erhält den titelartigen und auslegungsfähigen Charakter von ὁ υἱὸς τοῦ ἀνθρώπου, ohne ihn interpretierend aufzulösen.
