id: LUK.11.30
reference: Luke 11:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: de
  text: Denn wie Jona für die Niniviten zu einem Zeichen wurde, so wird auch der Menschensohn für diese Generation ein Zeichen sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „So wird auch der Menschensohn für diese Generation sein.“ Die Worte „ein Zeichen“ sind aus dem Vergleich mit Jona sinngemäß ergänzt.'
    reason: Das griechische σημεῖον („Zeichen“) steht ausdrücklich nur im ersten Satzteil und ist im zweiten mitzudenken.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Denn wie
  rationale: „Denn“ gibt die erklärende Funktion von γάρ wieder, während „wie“ den mit οὕτως fortgeführten Vergleich einleitet.
- source_word: ἐγένετο
  choice: zu einem Zeichen wurde
  rationale: '„Wurde“ bewahrt den ingressiv-resultativen Sinn von γίνομαι: Jona kam dazu, für die Niniviten als Zeichen zu dienen.'
- source_word: Ἰωνᾶς
  choice: Jona
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: τοῖς Νινευίταις
  choice: für die Niniviten
  rationale: Die Wiedergabe mit „für“ drückt die Beziehung des Zeichens zu seinen Empfängern in natürlichem Deutsch aus.
- source_word: σημεῖον
  choice: ein Zeichen
  rationale: „Zeichen“ bewahrt die offenbarende Bedeutung von σημεῖον im lukanischen Zusammenhang, ohne sie als bloßen Beweis oder als Omen einzuengen.
- source_word: οὕτως … καὶ
  choice: so … auch
  rationale: Die korrelative Formulierung gibt sowohl die Entsprechung zu καθώς als auch die additive Kraft von καί wieder.
- source_word: ἔσται
  choice: wird … sein
  rationale: Die Zukunftsform von εἰμί wird direkt wiedergegeben; das Prädikatsnomen „ein Zeichen“ wird aus dem parallelen ersten Satzteil ergänzt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe erhält den titelartigen Charakter sowie die messianischen und apokalyptischen Anklänge.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: für diese Generation
  rationale: „Für“ gibt den Dativ der Beziehung idiomatisch wieder; „Generation“ bewahrt die zeitliche und prophetische Spannung von γενεά.
theological_decisions:
- issue: Unausgesagtes Prädikat im zweiten Satzteil
  choice: '„ein Zeichen“ wird aus dem ersten Satzteil ergänzt: „der Menschensohn … ein Zeichen sein“'
  alternative: „der Menschensohn wird für diese Generation sein“
  rationale: Im Griechischen wird σημεῖον nicht wiederholt, doch der parallele Satzbau legt es eindeutig als mitgedachtes Prädikat nahe. Die Ergänzung macht den Sinn auf Deutsch verständlich, ohne eine zusätzliche theologische Aussage einzuführen; die Fußnote weist die Ellipse aus.
- issue: Bedeutung von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: Die traditionelle, wörtlich titelartige Form erhält die intertextuelle und theologische Mehrdeutigkeit, statt sie durch eine erklärende Paraphrase festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die klare Vergleichsstruktur des griechischen Textes; „zu einem Zeichen wurde“ und „ein Zeichen sein“ bilden den Wechsel von γίνομαι zu εἰμί ab.
