reference: Luke 11:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: de
  text: Wenn aber ein Stärkerer ihn angreift und besiegt[a], nimmt er ihm die gesamte Waffenrüstung[b], auf die er sich verlassen hatte, und verteilt seine Beute[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »überwältigt« oder »bezwungen hat«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet die vollständige Waffen- und Rüstungsausstattung.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seine Kriegsbeute« beziehungsweise »seine Beutestücke«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Wenn aber
  rationale: Gibt die zeitlich-konditionale Bedeutung von ἐπάν und den Gegensatz, den δέ zum vorangehenden Bild markiert, knapp und natürlich wieder.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: ein Stärkerer
  rationale: Der substantivisch gebrauchte Komparativ wird ohne Hinzufügung von »Mann« wiedergegeben; der Vergleich mit dem zuvor genannten Starken bleibt aus dem Zusammenhang verständlich.
- source_word: ἐπελθὼν
  choice: ihn angreift
  rationale: Im Zusammenhang der gewaltsamen Überwindung und Entwaffnung bezeichnet das Verb ein feindliches Herankommen. »Angreift« bringt diese kontextuelle Bedeutung in natürlichem Deutsch zum Ausdruck.
- source_word: νικήσῃ αὐτόν
  choice: ihn besiegt
  rationale: νικάω bezeichnet das Erringen des Sieges über jemanden. »Besiegt« ist präzise und lässt neben dem konkreten Überwältigen auch den weiteren Siegesgedanken bestehen.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: die gesamte Waffenrüstung
  rationale: πανοπλία bezeichnet die vollständige Ausrüstung mit Waffen beziehungsweise Rüstung. »Gesamte Waffenrüstung« bewahrt diesen Vollständigkeitsaspekt.
- source_word: αἴρει
  choice: nimmt er ihm
  rationale: Zusammen mit dem Gegenstand und dem Besitzer gibt die deutsche Konstruktion idiomatisch wieder, dass der Sieger dem Besiegten die Rüstung wegnimmt.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: auf die er sich verlassen hatte
  rationale: Die Form beschreibt sein zuvor bestehendes Vertrauen auf die Waffenrüstung. Das Plusquamperfekt stellt dieses Vertrauen passend vor die nun geschilderte Wegnahme.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: seine Beute
  rationale: σκῦλα bezeichnet die einem Besiegten abgenommene Kriegsbeute. Das kollektive deutsche »Beute« ist hier natürlich und präzise.
- source_word: διαδίδωσιν
  choice: verteilt
  rationale: Das Verb bezeichnet das Austeilen oder Aufteilen unter mehrere Empfänger; »verteilt« bewahrt diese Bedeutung ohne zusätzliche Deutung.
theological_decisions:
- issue: Ob die stärkere Gestalt ausdrücklich als »stärkerer Mann« bezeichnet werden soll
  choice: »ein Stärkerer« ohne ergänzendes Substantiv
  alternative: »ein stärkerer Mann«
  rationale: Im griechischen Satz steht nur der substantivierte Komparativ. Die gewählte Fassung vermeidet eine nicht ausdrücklich vorhandene Ergänzung und lässt den Zusammenhang mit dem starken Mann des vorigen Verses dennoch erkennen.
- issue: Wie stark νικάω im Konfliktbild wiederzugeben ist
  choice: »besiegt«
  alternative: »überwältigt« oder »bezwungen hat«
  rationale: »Besiegt« gibt den Sieg mit seinen konkreten Folgen wieder, ohne die Bildrede ausdrücklich auf bestimmte geistliche Akteure festzulegen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die militärische Bildsprache bleibt erhalten; die stärkere Gestalt wird nicht über den Wortlaut hinaus ausdrücklich identifiziert.
