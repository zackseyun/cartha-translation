id: LUK.11.10
reference: Luke 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: de
  text: Denn jeder, der bittet, empfängt; wer sucht, findet; und wer anklopft, dem wird geöffnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dem Zusammenhang nach kann auch ausdrücklich übersetzt werden: „Wer anklopft, dem wird die Tür geöffnet.“ Im Griechischen bleibt unausgesprochen, was geöffnet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: jeder
  rationale: Das Wort wird hier distributiv gebraucht und bewahrt den uneingeschränkten allgemeinen Geltungsanspruch der Aussage.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende Verbindung zur vorausgehenden Aufforderung natürlich und präzise wieder.
- source_word: ὁ αἰτῶν
  choice: jeder, der bittet
  rationale: Die substantivierte Präsenspartizipialkonstruktion bezeichnet allgemein den Bittenden; „bittet“ passt im Zusammenhang des Gebets besser als das mehrdeutige „fragt“.
- source_word: λαμβάνει
  choice: empfängt
  rationale: „Empfängt“ bildet die Antwort auf das Bitten würdig und idiomatisch ab, ohne den Inhalt des Empfangenen näher zu bestimmen.
- source_word: ὁ ζητῶν
  choice: wer sucht
  rationale: Die generische Formulierung gibt das substantivierte Präsenspartizip knapp und natürlich wieder.
- source_word: εὑρίσκει
  choice: findet
  rationale: Dies ist die direkte, idiomatische Entsprechung innerhalb der dreigliedrigen Aussage.
- source_word: τῷ κρούοντι
  choice: wer anklopft, dem
  rationale: Die deutsche Korrelativkonstruktion bewahrt den Dativbezug des griechischen Ausdrucks und klingt zugleich natürlich.
- source_word: ἀνοιγήσεται
  choice: wird geöffnet
  rationale: Das subjektlose deutsche Passiv bewahrt, dass der griechische Text weder den Handelnden noch ausdrücklich das Geöffnete nennt.
theological_decisions:
- issue: Reichweite und Geltung der allgemeinen Zusage
  choice: Die Aussage wird ohne ergänzende Bedingungen als allgemeine Zusage wiedergegeben.
  alternative: Deutende Einschränkungen wie „wer in rechter Weise bittet“ einfügen oder die Aussage ausdrücklich als Übertreibung kennzeichnen.
  rationale: Der griechische Wortlaut formuliert im Zusammenhang der Gebetsunterweisung eine uneingeschränkte allgemeine Aussage. Die Übersetzung soll die daraus entstehende theologische Spannung bewahren und keine im Vers unausgesprochenen Bedingungen hinzufügen.
- issue: Unausgesprochenes Objekt bei ἀνοιγήσεται
  choice: „dem wird geöffnet“ ohne ausdrückliches Objekt
  alternative: „dem wird die Tür geöffnet“
  rationale: Eine Tür ist durch das Anklopfen im Zusammenhang klar nahegelegt, wird im griechischen Wortlaut jedoch nicht genannt. Daher bleibt sie im Haupttext unausgesprochen und wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchcharakter. Die semikolongetrennte Dreierstruktur erhält den rhetorischen Parallelismus; „anklopft“ macht den Türbezug deutlich, ohne das im Griechischen fehlende Objekt in den Haupttext einzutragen.
