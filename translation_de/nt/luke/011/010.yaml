  verdict: approve
  source_fidelity: Der Entwurf gibt die erklärende Partikel γάρ mit „Denn“ angemessen wieder und erhält die universale, spruchhafte Dreierstruktur. „jeder, der bittet, empfängt; wer sucht, findet; und wer anklopft, dem wird geöffnet“ entspricht den drei substantivierten Partizipien sowie dem Dativ τῷ κρούοντι. Das ungenannte, bei ἀνοιγήσεται nur implizierte Bezugsobjekt wird im Haupttext nicht ergänzt.
  naturalness: Modernes, klares Standarddeutsch. Die Korrelativform „wer anklopft, dem wird geöffnet“ ist idiomatisch und bewahrt zugleich die knappe, parallele Form des griechischen Satzes. Die Semikola unterstützen den rhetorischen Dreiklang.
  terminology: „bitten“, „empfängt“, „sucht“, „findet“ und „anklopft“ sind treffend und registergerecht. Es werden keine theologisch ausdeutenden Einschränkungen oder Ergänzungen eingeführt. Die Fußnote kennzeichnet die mögliche Ergänzung „die Tür“ ausdrücklich als kontextuelle Explizierung, nicht als Bestandteil des griechischen Wortlauts.
