  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: de
  text: Und wenn er kommt, findet er es ausgefegt und in Ordnung gebracht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgefegt und geschmückt“.'
    reason: Das Verb κοσμέω kann sowohl das Ordnen und Herrichten als auch das Schmücken bezeichnen.
lexical_decisions:
- source_word: ἐλθὸν
  choice: wenn er kommt
  rationale: Das aoristische Partizip wird als temporaler Nebensatz wiedergegeben. Das Subjekt ist der unreine Geist aus dem vorhergehenden Vers; wegen des grammatischen Geschlechts von „Geist“ steht im Deutschen „er“.
- source_word: εὑρίσκει
  choice: findet er
  rationale: Das Präsens bewahrt die lebendige Erzählweise des griechischen Textes.
- source_word: σεσαρωμένον
  choice: ausgefegt
  rationale: Das Perfektpartizip bezeichnet das Haus als gefegt und weiterhin in diesem Zustand. „Ausgefegt“ ist im Deutschen eine natürliche Beschreibung eines Hauses und fügt das im Griechischen nicht ausdrücklich vorhandene „sauber“ nicht hinzu.
- source_word: κεκοσμημένον
  choice: in Ordnung gebracht
  rationale: Das Perfektpartizip von κοσμέω kann ordnen, herrichten oder schmücken bedeuten. Im Zusammenhang mit einem Haus gibt „in Ordnung gebracht“ den resultierenden geordneten Zustand natürlich wieder; die mögliche Bedeutung „geschmückt“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bezug des unausgesprochenen Objekts
  choice: findet er es
  alternative: findet er das Haus
  rationale: Im Griechischen ist das Objekt nicht ausdrücklich wiederholt; aus dem Zusammenhang ist das Haus gemeint. Das Pronomen „es“ bewahrt die knappe Ausdrucksweise, ohne den Bezug festzuschreiben oder unnötig zu erläutern.
- issue: Pronomen für den unreinen Geist
  choice: er
  alternative: es
  rationale: Während πνεῦμα im Griechischen sächlich ist, ist „Geist“ im Deutschen grammatisch männlich. „Er“ folgt natürlichem deutschem Sprachgebrauch und ist keine Aussage über ein biologisches Geschlecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählbewegung und die resultative Bedeutung der beiden griechischen Perfektpartizipien werden gewahrt; eine ausdrücklichere Deutung des Zustands des Hauses wird vermieden.
