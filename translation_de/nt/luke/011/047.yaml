  source_fidelity: 'Der deutsche Text gibt die griechische Syntax und Aussage zuverlässig wieder: οὐαὶ ὑμῖν als direkter Weheruf, ὅτι kausal mit „Denn“, οἰκοδομεῖτε im Präsens, τὰ μνημεῖα als funeräre „Grabmäler“ sowie die durch δέ kontrastiv verbundenen Aussagen über die Adressaten und ihre Vorfahren. Das Pronomen „sie“ bezieht sich eindeutig auf die Propheten. Die koordinierte Wiedergabe bewahrt die Spannung des Verses, ohne die Folgerung aus V. 48 vorwegzunehmen.'
