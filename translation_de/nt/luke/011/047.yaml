  terminology: „Grabmäler“ ist eine tragfähige Hauptwiedergabe von μνημεῖα und wird durch die Fußnote sachgerecht abgesichert. „Propheten“ und „getötet“ sind präzise. „Vorfahren“ gibt den hier kollektiv-ancestralen Gebrauch von πατέρες natürlich wieder; die Fußnote erhält „Väter“ als wörtliche Alternative.
