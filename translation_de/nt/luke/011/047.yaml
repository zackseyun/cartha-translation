id: LUK.11.47
reference: Luke 11:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: de
  text: Weh euch! Denn ihr baut die Grabmäler[a] der Propheten, eure Vorfahren[b] aber haben sie getötet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gräber“ beziehungsweise „Grabdenkmäler“. Das griechische Wort kann eine Grabstätte oder ein Erinnerungsmal am Grab bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Väter“; gemeint sind hier die Vorfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Weh euch!
  rationale: Die feste prophetische Weheruf-Formel bewahrt sowohl die direkte Anrede als auch den Ernst der Gerichtsankündigung.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet den Grund für den Weheruf ein und lässt im Deutschen die beiden folgenden Hauptsätze klar und natürlich nebeneinanderstehen.
- source_word: οἰκοδομεῖτε
  choice: ihr baut
  rationale: Gibt das griechische Präsens ohne unnötige Festlegung auf einen gerade ablaufenden Vorgang wieder.
- source_word: τὰ μνημεῖα
  choice: die Grabmäler
  rationale: Bezeichnet hier Grabstätten beziehungsweise Grabdenkmäler; „Grabmäler“ wahrt sowohl den funerären Bezug als auch den monumentalen Charakter.
- source_word: τῶν προφητῶν
  choice: der Propheten
  rationale: Gibt den Genitiv direkt und eindeutig wieder.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: eure Vorfahren aber
  rationale: „Vorfahren“ vermittelt in heutigem Deutsch den hier gemeinten Bezug auf frühere Generationen; das nachgestellte „aber“ bewahrt die kontrastierende Kraft von δέ, ohne sie zu übersteigern.
- source_word: ἀπέκτειναν αὐτούς
  choice: haben sie getötet
  rationale: Gibt die Tötung direkt wieder; „ermordet“ würde eine stärkere rechtliche Wertung ausdrücklich machen, als das Verb allein verlangt.
theological_decisions:
- issue: Verhältnis zwischen dem Bau der Grabmäler und der Tötung der Propheten durch die Vorfahren
  choice: 'Die beiden Aussagen werden kontrastierend nebeneinandergestellt: „ihr baut …, eure Vorfahren aber haben sie getötet“.'
  alternative: 'Die Aussagen durch einen Relativsatz verbinden: „der Propheten, die eure Vorfahren getötet haben“.'
  rationale: Das eigenständige Subjekt οἱ … πατέρες ὑμῶν und δέ stützen eine koordinierte, kontrastierende Aussage. Die darin liegende Anklage bleibt angedeutet und wird nicht durch eine zusätzliche Erklärung vorweggenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Weheruf bleibt erhalten; „Grabmäler“ und „Vorfahren“ sind verständlich und zugleich quellennah. Die Satzstellung mit nachgestelltem „aber“ bildet den griechischen Kontrast natürlich ab.
