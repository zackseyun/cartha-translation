id: LUK.11.43
reference: Luke 11:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: de
  text: Wehe euch Pharisäern! Denn ihr liebt die Ehrenplätze[a] in den Synagogen und die ehrerbietigen Begrüßungen[b] auf den Marktplätzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ersten Sitze“ beziehungsweise „die angesehensten Plätze“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind öffentliche Begrüßungen, durch die gesellschaftliche Ehre und Anerkennung ausgedrückt wurden.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν τοῖς Φαρισαίοις
  choice: Wehe euch Pharisäern!
  rationale: Bewahrt die Kraft des prophetischen Wehrufs und gibt die direkte Anrede im Deutschen natürlich wieder.
- source_word: ὅτι
  choice: Denn
  rationale: Leitet idiomatisch den Grund für den Wehruf ein; „weil“ wäre ebenfalls möglich, ergäbe nach dem Ausruf jedoch einen weniger selbstständigen Satz.
- source_word: ἀγαπᾶτε
  choice: ihr liebt
  rationale: Gibt die starke Vorliebe für öffentliche Ehre direkt wieder, ohne die Aussage abzuschwächen.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: die Ehrenplätze
  rationale: Bezeichnet die ranghöchsten beziehungsweise ehrenvollsten Sitze; der deutsche Plural entspricht dem gemeinten allgemeinen Verhalten und klingt natürlich.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: in den Synagogen
  rationale: Entspricht der konkreten religiösen und gemeinschaftlichen Umgebung des Ausgangstextes.
- source_word: τοὺς ἀσπασμοὺς
  choice: die ehrerbietigen Begrüßungen
  rationale: Macht die im Kontext entscheidende öffentliche Anerkennung und Ehrerweisung sichtbar; das bloße „Begrüßungen“ könnte im heutigen Deutsch zu neutral wirken.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: auf den Marktplätzen
  rationale: Gibt die öffentlichen Markt- und Versammlungsräume der antiken Stadt idiomatisch wieder.
theological_decisions:
- issue: Art von Jesu Wehruf
  choice: Prophetischer Wehruf gegen die Liebe zu öffentlichem Ansehen
  alternative: Bloße Kritik an gesellschaftlichen Umgangsformen
  rationale: οὐαί und die Begründung kennzeichnen eine moralisch-geistliche Anklage. Die Übersetzung bewahrt diese Schärfe, ohne zusätzliche Lehrinhalte einzutragen.
- issue: Bedeutung der Begrüßungen
  choice: Ehrerbietige öffentliche Begrüßungen als Ausdruck sozialer Anerkennung
  alternative: Gewöhnliche, inhaltlich neutrale Begrüßungen
  rationale: Im Zusammenhang mit den Ehrenplätzen zielt ἀσπασμοί auf öffentlich sichtbare Anerkennung; „ehrerbietig“ bringt diesen kontextuellen Sinn knapp zum Ausdruck.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Wehruf bleibt prägnant; kulturell erklärungsbedürftige Statusbegriffe werden im Text verständlich und in den Fußnoten genauer wiedergegeben.
