reference: Luke 11:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: de
  text: 'Als die Menschenmengen zusammenströmten, begann er zu sagen: »Diese Generation ist eine böse[a] Generation. Sie sucht nach einem Zeichen, doch es wird ihr kein Zeichen gegeben werden außer dem Zeichen des Jona[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlechte« beziehungsweise »verdorbene« Generation.'
    reason: lexical_alternative
  - marker: b
    text: Das »Zeichen des Jona« kann sich auf Jona selbst als Zeichen durch seinen prophetischen Auftrag beziehen; im Licht der Evangelienparallelen kann die Wendung zugleich typologische Bezüge zu Jesu Tod und Auferstehung anklingen lassen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: zusammenströmten
  rationale: Das Präsenspartizip im Genitivus absolutus bezeichnet einen gleichzeitig fortschreitenden Vorgang. »Zusammenströmten« gibt das Sich-Sammeln der Menschenmengen natürlich und anschaulich wieder, ohne ausdrücklich eine zahlenmäßige Zunahme zu behaupten.
- source_word: ἤρξατο λέγειν
  choice: begann er zu sagen
  rationale: Die inchoative Konstruktion wird direkt wiedergegeben und ihre aspektuelle Bedeutung bewahrt.
- source_word: γενεά
  choice: Generation
  rationale: »Generation« ist die naheliegende deutsche Entsprechung und lässt sowohl den zeitlichen als auch den korporativ-moralischen Bezug offen.
- source_word: πονηρά
  choice: böse
  rationale: »Böse« gibt das klare moralische Urteil direkt und in gegenwärtigem Standarddeutsch wieder.
- source_word: σημεῖον
  choice: Zeichen
  rationale: »Zeichen« bewahrt die Bedeutung eines beglaubigenden Geschehens, ohne »Wunder« ausdrücklich in den Text einzutragen.
- source_word: ζητεῖ
  choice: sucht nach
  rationale: Die Formulierung bleibt nahe an der Grundbedeutung des Verbs. Die tadelnde Haltung ergibt sich aus dem Zusammenhang, ohne dass sie durch »fordert« verstärkt wird.
- source_word: δοθήσεται
  choice: wird gegeben werden
  rationale: Die Zukunftsform im Passiv wird sachlich und eindeutig wiedergegeben.
- source_word: εἰ μὴ
  choice: außer
  rationale: Nach der verneinten Aussage drückt »außer« die im Griechischen vorliegende Ausnahme idiomatisch aus.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: das Zeichen des Jona
  rationale: Der Genitiv wird bewusst offen wiedergegeben, damit nicht vorweggenommen wird, in welchem Sinn Jona beziehungsweise sein Wirken als Zeichen verstanden wird.
theological_decisions:
- issue: Reichweite der Verurteilung »dieser Generation«
  choice: Das korporative moralische Urteil über Jesu Zeitgenossen wird durch die wiederholte Wendung »Generation ... Generation« ohne Abschwächung wiedergegeben.
  alternative: Eine auf bestimmte anwesende Gegner begrenzte Anklage.
  rationale: Der griechische Wortlaut formuliert ein breites Urteil und schränkt den Bezug nicht ausdrücklich auf einzelne Gegner ein.
- issue: Bedeutung des »Zeichens des Jona«
  choice: Die offene Genitivverbindung bleibt im Haupttext erhalten.
  alternative: Ausdrückliche Deutung als Jonas prophetisches Auftreten beziehungsweise als Vorausbild von Jesu Tod und Auferstehung.
  rationale: Der unmittelbare lukanische Zusammenhang erläutert die Wendung, während Evangelienparallelen weitere typologische Bezüge nahelegen. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von »Generation« bleibt erhalten, weil sie das Urteil rhetorisch verstärkt. »Menschenmengen« gibt den Plural ὄχλοι wieder; »zusammenströmten« ist idiomatisch und wahrt den fortlaufenden Charakter der Szene.
