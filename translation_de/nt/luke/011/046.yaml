id: LUK.11.46
reference: Luke 11:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: de
  text: 'Er aber sagte: »Wehe auch euch Gesetzesgelehrten[a]! Denn ihr ladet den Menschen Lasten auf, die schwer zu tragen sind, doch ihr selbst rührt die Lasten nicht mit einem eurer Finger an.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Fachleute für das jüdische Gesetz.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann hervorheben, dass sie selbst nichts zur Erleichterung oder zum Tragen der auferlegten Lasten beitragen.
    reason: ambiguity
lexical_decisions:
- source_word: νομικοῖς
  choice: Gesetzesgelehrten
  rationale: Der Ausdruck bezeichnet hier kundige Ausleger des jüdischen Gesetzes, nicht moderne Juristen. »Gesetzesgelehrte« ist im Deutschen präzise und verständlich.
- source_word: οὐαί
  choice: Wehe
  rationale: »Wehe« bewahrt den prophetischen Ton der Anklage und Gerichtswarnung.
- source_word: φορτίζετε
  choice: ihr ladet … auf
  rationale: Die konkrete Metapher des Beladens bleibt erhalten und verbindet sich natürlich mit »Lasten«.
- source_word: τοὺς ἀνθρώπους
  choice: den Menschen
  rationale: ἄνθρωποι ist hier allgemein und nicht auf Männer beschränkt.
- source_word: φορτία δυσβάστακτα
  choice: Lasten, die schwer zu tragen sind
  rationale: Die Wiedergabe erhält das Bild des Tragens, ohne δυσβάστακτα zu dem stärkeren »untragbar« zu verschärfen.
- source_word: αὐτοὶ
  choice: ihr selbst
  rationale: Die betonte Gegenüberstellung zwischen den belasteten Menschen und den Gesetzesgelehrten wird sichtbar gemacht.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: mit einem eurer Finger
  rationale: Die partitive Formulierung und das Bild minimalster eigener Beteiligung bleiben gewahrt.
- source_word: οὐ προσψαύετε
  choice: rührt … nicht an
  rationale: Die konkrete Bedeutung des Berührens wird erhalten; die mögliche Folgerung, dass keinerlei Hilfe geleistet wird, wird nicht in den Haupttext hineingedeutet.
- source_word: Καὶ ὑμῖν
  choice: auch euch
  rationale: καί erweitert den zuvor ausgesprochenen Wehruf ausdrücklich auf diese weitere Gruppe.
theological_decisions:
- issue: Identität der νομικοί
  choice: Als »Gesetzesgelehrte« wiedergegeben, also als Fachleute für das jüdische Gesetz.
  alternative: Juristen; Schriftgelehrte
  rationale: »Juristen« würde moderne Rechtsberufe nahelegen; »Schriftgelehrte« ist zwar kontextuell verwandt, aber nicht in jedem Fall deckungsgleich mit νομικοί.
- issue: Sinn der Schlussaussage
  choice: 'Das konkrete Bild bleibt stehen: Sie rühren die Lasten nicht einmal mit einem Finger an.'
  alternative: Sie helfen den Menschen überhaupt nicht beim Tragen; sie machen selbst keinerlei Anstrengung.
  rationale: 'Der griechische Text lässt die genaue Stoßrichtung des Bildes teilweise offen: Es kann mangelnde Hilfe, fehlende eigene Beteiligung oder beides anklagen. Die Übersetzung löst diese Spannung nicht stillschweigend auf.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Lastenmetapher und der betonte Gegensatz »ihr selbst« wurden bewahrt. »Rührt … an« klingt natürlich, ohne die Aussage vorschnell als bloßes »Helfen« auszulegen.
