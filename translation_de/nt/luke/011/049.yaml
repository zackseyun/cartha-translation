  verdict: revise
  source_fidelity: 'Die Aussage wird im Wesentlichen treffend wiedergegeben: διὰ τοῦτο καὶ, »die Weisheit Gottes«, die Sendung von Propheten und Aposteln sowie die partitive Gruppe der Betroffenen bleiben erhalten. Allerdings kehrt die vorliegende deutsche Satzstellung bei »einige von ihnen werden sie töten und verfolgen« sehr wahrscheinlich die Rollen um: Deutsch liest »einige von ihnen« als Subjekt und »sie« als Objekt, während im Griechischen »sie« (diejenigen, zu denen gesandt wird) Subjekt ist und »einige von ihnen« Objekt.'
  naturalness: Die vorgeschlagene Korrektur ist modernes, klares Standarddeutsch. Sie beseitigt die Kasus- und Rollenmehrdeutigkeit ohne erklärende Zusätze.
  terminology: »Weisheit Gottes«, »Propheten« und »Apostel« sind angemessen und bewahren sowohl die lukanische Terminologie als auch die interpretative Offenheit von ἡ σοφία τοῦ θεοῦ. Die Fußnote ist sachlich und nicht doktrinär festlegend.
  issues:
  - severity: high
    issue: Vertauschte beziehungsweise stark missverständliche grammatische Rollen im zweiten Teilsatz
    rationale: In »einige von ihnen werden sie töten und verfolgen« ist »einige von ihnen« nach der normalen deutschen Satzanalyse das Subjekt. Der griechische Text meint jedoch, dass die Adressaten einige der gesandten Propheten und Apostel töten und verfolgen werden (ἐξ αὐτῶν als Objekt zu den Verben).
  revised_text: 'Darum hat auch die Weisheit Gottes gesagt[a]: »Ich werde Propheten und Apostel zu ihnen senden; sie werden einige von ihnen töten und verfolgen.«'
