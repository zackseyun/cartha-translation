id: LUK.11.49
reference: Luke 11:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: de
  text: 'Darum hat auch die Weisheit Gottes gesagt[a]: »Ich werde Propheten und Apostel zu ihnen senden; sie werden einige von ihnen töten und verfolgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gottes Weisheit«. Die Wendung kann als Personifikation der göttlichen Weisheit, als Gottes weiser Ratschluss oder als ein impliziter Selbstbezug Jesu verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den kausal-inferentiellen Anschluss knapp, idiomatisch und natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: Bewahrt die additive beziehungsweise leicht verstärkende Funktion in der Verbindung »Darum hat auch …«.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: die Weisheit Gottes
  rationale: Bewahrt die Genitivkonstruktion und lässt offen, ob eine Personifikation, Gottes weiser Ratschluss oder ein impliziter Selbstbezug Jesu gemeint ist.
- source_word: εἶπεν
  choice: hat … gesagt
  rationale: Das deutsche Perfekt ist in gegenwärtiger Standardsprache eine natürliche Wiedergabe der vergangenen Äußerung.
- source_word: Ἀποστελῶ
  choice: Ich werde … senden
  rationale: Gibt das aktive Futur direkt und ohne unnötige Zusatzbedeutung wieder.
- source_word: εἰς αὐτούς
  choice: zu ihnen
  rationale: Bei einem Verb des Sendens ist dies die naheliegende Richtungsangabe.
- source_word: προφήτας
  choice: Propheten
  rationale: Entspricht der etablierten und kontextuell passenden deutschen Bezeichnung.
- source_word: ἀποστόλους
  choice: Apostel
  rationale: Bewahrt den im lukanischen Zusammenhang wahrscheinlichen geprägten Titel statt ihn zum allgemeinen »Boten« abzuschwächen.
- source_word: ἐξ αὐτῶν
  choice: einige von ihnen
  rationale: Gibt den partitiven Sinn idiomatisch wieder, ohne zu behaupten, beide Handlungen beträfen jeweils dieselben Gesandten.
- source_word: ἀποκτενοῦσιν
  choice: werden sie töten
  rationale: Direkte und natürliche Wiedergabe des Futurs.
- source_word: διώξουσιν
  choice: verfolgen
  rationale: Im feindseligen Kontext bezeichnet das Verb Verfolgung; die deutsche Formulierung bleibt zugleich knapp.
theological_decisions:
- issue: Bedeutung von »die Weisheit Gottes«
  choice: Die Wendung bleibt als »die Weisheit Gottes« unaufgelöst stehen.
  alternative: Personifikation der göttlichen Weisheit; Gottes weiser Ratschluss; impliziter Selbstbezug Jesu
  rationale: Der griechische Ausdruck lässt mehrere Deutungen zu. Die Übersetzung identifiziert die Weisheit daher weder ausdrücklich mit Jesus noch mit einer Schriftstelle oder einer eigenständigen hypostatischen Gestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Darum« vermeidet eine schwerfällige Einleitung; »Propheten und Apostel« bewahrt die vertraute biblische Terminologie. Das Semikolon gliedert Ausspruch und angekündigte Reaktion klar.
