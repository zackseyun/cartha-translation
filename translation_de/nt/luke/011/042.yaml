  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: de
  text: Doch wehe euch, ihr Pharisäer! Ihr gebt den Zehnten von Minze, Raute und jedem Kraut, geht aber an der Gerechtigkeit und der Liebe Gottes vorbei. Dies hättet ihr tun und jenes nicht unterlassen sollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: wehe euch
  rationale: Bewahrt die traditionelle, eindringliche Weheruf-Formel und ihren prophetischen Ernst.
- source_word: ἀποδεκατοῦτε
  choice: ihr gebt den Zehnten von
  rationale: Gibt die konkrete religiöse Abgabe verständlich und sachgerecht wieder.
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: Minze, Raute und jedem Gartengewächs
  rationale: Die beiden Pflanzen werden spezifisch benannt; λάχανον bezeichnet hier allgemein kultivierte Küchen- bzw. Gartengewächse.
- source_word: παρέρχεσθε
  choice: geht ... vorbei
  rationale: Bewahrt das Bild des Vorübergehens aus dem griechischen Text, statt es lediglich als 'vernachlässigen' aufzulösen.
- source_word: τὴν κρίσιν
  choice: die Gerechtigkeit
  rationale: κρίσις kann Gericht, Rechtsprechung oder gerechtes Handeln bezeichnen; im ethischen Zusammenhang ist 'Gerechtigkeit' natürlich und hält die rechtliche Dimension offen.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: die Liebe Gottes
  rationale: 'Bewahrt die genitivische Mehrdeutigkeit: Gottes Liebe zu Menschen und die Liebe der Menschen zu Gott werden nicht einseitig festgelegt.'
- source_word: ταῦτα ... κἀκεῖνα
  choice: das eine ... das andere
  rationale: Die deutschen Korrelate beziehen sich natürlich auf die zuvor genannten Pflichten, ohne die Zuordnung unnötig auszudeuten.
- source_word: μὴ παρεῖναι
  choice: nicht unterlassen
  rationale: Gibt den Sinn des Nicht-Vernachlässigens bzw. Nicht-Auslassens idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Gerechtigkeit und Liebe Gottes zu der Zehntabgabe
  choice: Das eine hättet ihr tun und das andere nicht unterlassen sollen.
  alternative: Nur Gerechtigkeit und Liebe seien verpflichtend, die Zehntabgabe werde verworfen.
  rationale: Jesus gewichtet Gerechtigkeit und Liebe Gottes als das Versäumte, hebt die genannten Zehntpraktiken aber grammatisch nicht auf; beide Seiten bleiben bestehen.
- issue: Bedeutung des Genitivs in ἀγάπην τοῦ θεοῦ
  choice: die Liebe Gottes
  alternative: die Liebe zu Gott / Gottes Liebe zu euch
  rationale: Die knappe Formulierung erhält die echte grammatische und theologische Offenheit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Weheruf bleibt markant; die Pflanzenliste klingt konkret, und das Bild 'an ... vorbeigehen' wird bewusst erhalten. Keine Fußnoten erforderlich.
