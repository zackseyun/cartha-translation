id: LUK.11.8
reference: Luke 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: de
  text: 'Ich sage euch: Auch wenn er nicht aufstehen und ihm etwas geben wird, weil er sein Freund ist, so wird er doch wegen seiner Unverschämtheit[a] aufstehen und ihm geben, was immer er braucht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Schamlosigkeit“, „Dreistigkeit“ oder im Zusammenhang „unverschämte Beharrlichkeit“ bedeuten. Das entsprechende Fürwort kann sich grammatisch auf den bittenden Freund oder auf den Mann im Haus beziehen.
    reason: Lexikalische und referenzielle Mehrdeutigkeit von ἀναίδεια αὐτοῦ.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ich sage euch
  rationale: Die geläufige und direkte deutsche Wiedergabe der einleitenden Redeformel bewahrt die ausdrückliche Anrede.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: Auch wenn er nicht aufstehen und ihm etwas geben wird
  rationale: „Auch wenn“ erhält den konditional-konzessiven Charakter von εἰ καί. „Etwas“ ergänzt im Deutschen das aus dem Zusammenhang erschlossene Objekt von „geben“.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: weil er sein Freund ist
  rationale: Die kausale Konstruktion und die persönliche Beziehung werden unmittelbar wiedergegeben, ohne sie zum abstrakten Begriff „Freundschaft“ umzudeuten.
- source_word: διά γε
  choice: so ... doch wegen
  rationale: Die deutsche Korrelativkonstruktion markiert den nachdrücklichen Gegensatz zwischen dem unzureichenden Freundschaftsmotiv und dem tatsächlich wirksamen Beweggrund.
- source_word: ἀναίδειαν
  choice: Unverschämtheit
  rationale: Das Wort bezeichnet wörtlich Schamlosigkeit beziehungsweise fehlende Scheu. „Unverschämtheit“ wahrt diese anstößige soziale Färbung, ohne die im Griechischen nicht ausdrücklich enthaltene „Beharrlichkeit“ in den Haupttext einzutragen.
- source_word: ἐγερθεὶς
  choice: aufstehen
  rationale: Im häuslichen Zusammenhang geht es darum, sich vom Lager zu erheben. Die Wiederholung von „aufstehen“ ist im Deutschen klar und bildet die inhaltliche Entsprechung zu ἀναστὰς ab.
- source_word: ὅσων χρῄζει
  choice: was immer er braucht
  rationale: 'Die Formulierung gibt den umfassenden Sinn des pluralischen Relativausdrucks natürlich wieder: alles beziehungsweise so viel, wie benötigt wird.'
theological_decisions:
- issue: Bezug und Sinn von ἀναίδεια
  choice: „dessen Unverschämtheit“ lässt den Bezug des Pronomens im Deutschen wie im Griechischen formal offen und bewahrt die negative Grundfärbung des Substantivs.
  alternative: „wegen seiner unverschämten Beharrlichkeit“ mit eindeutigem Bezug auf den bittenden Freund; ferner „wegen seiner Kühnheit“ oder ein Bezug auf den im Haus befindlichen Mann und dessen Ehrgefühl.
  rationale: Das seltene Wort kann kontextuell als schamloses Drängen beziehungsweise dreiste Beharrlichkeit verstanden werden; zugleich sind der genaue Bezug von αὐτοῦ und eine Deutung im Sinn von Kühnheit oder Schamvermeidung diskutiert. Der Haupttext soll diese Spannung nicht stillschweigend entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Argumentationsbewegung, bleibt aber für heutige Leser verständlich. Die auffällige Härte von ἀναίδεια wird im Haupttext bewahrt und in der Fußnote erläutert.
