  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: de
  text: Wenn ich aber die Dämonen durch den Finger Gottes[a] austreibe, dann ist das Reich Gottes zu euch gekommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „mit dem Finger Gottes“. Die Wendung bezeichnet Gottes unmittelbare Macht und erinnert an 2. Mose 8,15.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „hat euch erreicht“ oder „ist über euch gekommen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: durch den Finger Gottes
  rationale: „Durch“ gibt die instrumentale bzw. vermittelnde Bedeutung von ἐν natürlich wieder und bewahrt zugleich das anschauliche biblische Bild sowie den Anklang an 2. Mose 8,15.
- source_word: ἐκβάλλω
  choice: austreibe
  rationale: „Austreiben“ ist im Deutschen die übliche und präzise Bezeichnung für Jesu Handeln an Dämonen und entspricht der kausativen, nach außen gerichteten Bedeutung des Verbs.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: Dies ist die direkte lexikalische Entsprechung; „unreine Geister“ würde einen anderen griechischen Ausdruck wiedergeben.
- source_word: ἄρα
  choice: dann
  rationale: „Dann“ kennzeichnet klar und idiomatisch die Schlussfolgerung aus dem vorausgehenden Bedingungssatz.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: ist … zu euch gekommen
  rationale: Die Formulierung drückt aus, dass Gottes Reich die Angeredeten bereits entscheidend erreicht hat. Das deutsche Perfekt gibt diese eingetretene Gegenwart natürlich wieder, ohne den möglicherweise bedrohlichen Nebenton von „über euch gekommen“ festzuschreiben.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die geläufige deutsche Wiedergabe bewahrt sowohl den Gedanken von Gottes Herrschaft als auch die Reich-Metaphorik, ohne im Haupttext interpretierend auf „Königsherrschaft“ einzuengen.
theological_decisions:
- issue: Bedeutung von „Finger Gottes“
  choice: Das Bild für Gottes unmittelbare Macht bzw. sein unmittelbares Wirken bleibt unaufgelöst stehen.
  alternative: Ausdrückliche Wiedergabe als „durch den Heiligen Geist“ im Anschluss an Matthäus 12,28.
  rationale: Lukas verwendet bewusst die Wendung „Finger Gottes“. Die Übersetzung bewahrt sein Bild und dessen alttestamentlichen Widerhall, statt den Wortlaut an die matthäische Parallelstelle anzugleichen.
- issue: Zeitliche Aussage über das Reich Gottes
  choice: Gottes Reich hat die Angeredeten in Jesu Wirken bereits erreicht.
  alternative: Das Reich ausschließlich als zukünftige Wirklichkeit oder die Wendung ausschließlich als Gerichtsaussage zu verstehen.
  rationale: Der Aorist ἔφθασεν bezeichnet hier ein entscheidendes Eintreffen. Die Übersetzung hält die gegenwärtige Ankunft fest, ohne daraus ein vollständiges eschatologisches System abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das markante Bild „Finger Gottes“ und die Spannung der Ankunftsformulierung bleiben erhalten; unnötige Fachsprache und konfessionelle Deutungen werden vermieden.
