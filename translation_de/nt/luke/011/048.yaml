review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Aussage insgesamt zutreffend wieder, ergänzt jedoch sowohl „die Propheten“ als auch „deren Grabmäler“ im Haupttext, obwohl der griechische Text in diesem Vers die Bezugsobjekte nur kontextuell voraussetzt. Besonders die Ergänzung des Objekts zu οἰκοδομεῖτε widerspricht der dokumentierten optimal-äquivalenten Entscheidung, die Ellipse im Haupttext zu bewahren. Das adversative μέν–δέ-Gefüge sollte zudem mit „ihr aber“ erkennbar bleiben.
  naturalness: Die vorgeschlagene Fassung ist flüssiges modernes Standarddeutsch. „stimmt den Taten eurer Väter zu“ ist idiomatisch; die doppelte pronominale Bezugnahme in „sie haben sie getötet“ ist knapp, aber im Kontext und durch die Fußnote nachvollziehbar.
  terminology: „Väter“ bewahrt die rhetorische und familiäre Bezeichnung τῶν πατέρων genauer als das allgemeinere „Vorfahren“. „Taten“ und „zustimmen“ treffen τοῖς ἔργοις beziehungsweise συνευδοκεῖτε angemessen.
  issues:
  - severity: medium
    issue: Kontextuell implizite Objekte werden im Haupttext explizit ergänzt.
    rationale: „die Propheten“ und „deren Grabmäler“ stehen nicht im griechischen Wortlaut dieses Verses. Die Propheten und besonders das Objekt von „baut“ sind aus V. 47 zu erschließen; dies sollte in einer Fußnote erläutert werden, nicht durch Erweiterung des Haupttextes.
  - severity: low
    issue: Der Gegensatz im μέν–δέ-Gefüge ist mit „und ihr“ abgeschwächt.
    rationale: „ihr aber“ bildet den Kontrast zwischen dem Töten durch die Väter und dem Bauen durch die angesprochene Generation klarer ab, ohne die im Kontext behauptete Mitschuld aufzuheben.
  - severity: low
    issue: „Vorfahren“ ist weniger formnah als „Väter“.
    rationale: Die moderne deutsche Wendung „eure Väter“ ist verständlich und erhält die im griechischen Ausdruck enthaltene rhetorische Anrede.
