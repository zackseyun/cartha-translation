source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: de
  text: Damit seid ihr Zeugen und stimmt den Taten eurer Väter zu; denn sie haben sie getötet, ihr aber baut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Objekt zu „baut“ ist im Griechischen nicht ausdrücklich genannt; gemeint sind die Grabmäler der Propheten (vgl. V. 47).
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Damit
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Vorwurf in natürlichem, gegenwärtigem Deutsch.
- source_word: μάρτυρές ἐστε
  choice: seid ihr Zeugen
  rationale: Bewahrt die substantivische Aussage des Griechischen; ihr Handeln macht sie zu Zeugen gegen sich selbst.
- source_word: συνευδοκεῖτε
  choice: stimmt … zu
  rationale: Drückt die aktive Billigung beziehungsweise das Einverständnis mit den Taten der Vorfahren aus.
- source_word: τοῖς ἔργοις
  choice: den Taten
  rationale: Bezeichnet hier konkrete, moralisch bewertete Handlungen und klingt im Deutschen natürlicher als „Werke“.
- source_word: τῶν πατέρων ὑμῶν
  choice: eurer Vorfahren
  rationale: Gibt die generationenübergreifende Beziehung im heutigen Deutsch klar wieder; „Väter“ wäre formnäher, könnte aber enger verstanden werden.
- source_word: ὅτι
  choice: denn
  rationale: Leitet die Begründung des Vorwurfs ein und bewahrt den argumentativen Zusammenhang.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτούς
  choice: sie haben die Propheten getötet
  rationale: Der Bezug von αὐτούς auf die Propheten ist aus Vers 47 eindeutig; die Wiederaufnahme des Substantivs verhindert im Deutschen eine schwer verständliche Folge mehrerer Pronomen.
- source_word: ὑμεῖς δὲ
  choice: und ihr
  rationale: Das griechische μέν–δέ stellt die Handlungen zweier Generationen einander zuordnend gegenüber. „Und“ bewahrt hier die belastende Gemeinsamkeit besser als ein ausschließlich gegensätzliches „aber“.
- source_word: οἰκοδομεῖτε
  choice: baut deren Grabmäler
  rationale: Das im Vers nicht wiederholte Objekt wird aus dem unmittelbar vorausgehenden Vers ergänzt, damit der deutsche Satz vollständig und verständlich ist.
theological_decisions:
- issue: Ergänzung des im Griechischen ausgelassenen Objekts zu οἰκοδομεῖτε
  choice: „baut deren Grabmäler“ im Haupttext
  alternative: „baut“ ohne genanntes Objekt
  rationale: Vers 47 nennt ausdrücklich die Grabmäler der Propheten. Die Ergänzung macht die im Griechischen kontextuell eindeutige Ellipse auf Deutsch verständlich, ohne eine neue Deutung einzuführen.
- issue: Art der Verbindung zwischen dem Töten durch die Vorfahren und dem Bauen durch die Angesprochenen
  choice: „und ihr“
  alternative: „aber ihr“
  rationale: Das μέν–δέ-Gefüge enthält einen Kontrast der handelnden Generationen, dient im Zusammenhang aber zugleich als Beweis ihrer Übereinstimmung. Das additive „und“ erhält diese theologische Spannung, statt die Handlungen als moralische Gegensätze erscheinen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorfahren“ ist allgemein verständlich und vermeidet die mögliche Verengung von „Väter“ auf unmittelbare männliche Eltern. Das Semikolon gliedert Folgerung und Begründung klar.
