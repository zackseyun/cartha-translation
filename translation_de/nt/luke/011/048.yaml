revisions:
- from: Damit seid ihr Zeugen und stimmt den Taten eurer Vorfahren zu; denn sie haben die Propheten getötet, und ihr baut deren Grabmäler.[a]
  to: Damit seid ihr Zeugen und stimmt den Taten eurer Väter zu; denn sie haben sie getötet, ihr aber baut.[a]
  rationale: Die Revision bewahrt die im griechischen Vers vorhandene Ellipse bei οἰκοδομεῖτε und verlegt die aus dem vorigen Vers erschließbare Ergänzung in die Fußnote. Sie stellt außerdem den Kontrast von μέν und δέ mit „ihr aber“ heraus und gibt τῶν πατέρων mit „eurer Väter“ formnäher wieder.
