id: LUK.11.44
reference: Luke 11:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: de
  text: Wehe euch! Denn ihr seid wie die unkenntlichen Gräber, und die Menschen, die darüber gehen, wissen es nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Wehe euch!
  rationale: Die feste deutsche Weheruf-Formel gibt Warnung und Gerichtston des griechischen Ausdrucks knapp und würdig wieder.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: die nicht gekennzeichneten Gräber
  rationale: ἄδηλος bezeichnet hier etwas, das nicht sichtbar bzw. nicht als solches erkennbar ist. „Nicht gekennzeichnet“ macht verständlich, dass Vorübergehende die Gräber nicht erkennen, ohne die Aussage weiter auszudeuten.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: Die Menschen gehen darüber
  rationale: ἄνθρωποι ist geschlechtsübergreifend als „Menschen“ wiedergegeben; περιπατοῦντες ἐπάνω bezeichnet das Gehen über die Gräber.
- source_word: οὐκ οἴδασιν
  choice: ohne es zu wissen
  rationale: 'Die idiomatische deutsche Form bewahrt den Sinn: Die Menschen wissen nicht, dass sie über Gräber gehen.'
theological_decisions:
- issue: Anspielung auf kultische Verunreinigung durch den Kontakt mit Gräbern
  choice: Die Anspielung bleibt im Bild der nicht gekennzeichneten Gräber implizit.
  alternative: Die Verunreinigung ausdrücklich in den Vers aufnehmen.
  rationale: Der griechische Text nennt die kultische Folge nicht ausdrücklich. Eine Erklärung im Haupttext würde die angedeutete Pointe interpretierend ergänzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dem traditionellen und würdigen Weheruf. Der Doppelpunkt bildet die erläuternde zweite Satzhälfte natürlich ab.
