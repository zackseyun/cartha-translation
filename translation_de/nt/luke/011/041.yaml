id: LUK.11.41
reference: Luke 11:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: de
  text: 'Doch gebt das, was innen ist[a], als Almosen, und seht: Alles ist rein für euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebt von dem, was ihr habt, Almosen.“ Die griechische Wendung kann sich entweder auf das beziehen, was innen ist, oder auf das, was jemand zur Verfügung hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Leitet einen korrigierenden Gegensatz zur zuvor kritisierten äußerlichen Reinigung ein; „Doch“ ist knapp, natürlich und bewahrt die adversative Kraft.
- source_word: τὰ ἐνόντα
  choice: das, was innen ist
  rationale: Die Formulierung bezeichnet wörtlich das innen Befindliche und greift im unmittelbaren Zusammenhang den Gegensatz zwischen Außen- und Innenseite auf. Die mögliche Deutung auf vorhandenen Besitz wird in der Fußnote bewahrt.
- source_word: δότε
  choice: gebt
  rationale: Gibt den Aoristimperativ als klare Handlungsaufforderung wieder, ohne dessen Aspekt übermäßig auszudeuten.
- source_word: ἐλεημοσύνην
  choice: als Almosen
  rationale: Bezeichnet eine barmherzige Gabe, insbesondere Almosengeben. Die Fügung „als Almosen geben“ bildet die griechische Konstruktion verständlich nach, ohne einen im Text nicht ausdrücklich genannten Empfänger einzufügen.
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden und nachdrücklichen Charakter in geläufigem modernem Deutsch.
- source_word: πάντα
  choice: Alles
  rationale: Gibt das umfassend gebrauchte Neutrum Plural natürlich wieder.
- source_word: καθαρὰ
  choice: rein
  rationale: Bewahrt den Bezug zur Reinheit und zur vorausgehenden Diskussion über das Reinigen von Gefäßen.
- source_word: ὑμῖν
  choice: für euch
  rationale: Gibt den Dativ der Beziehung beziehungsweise des Vorteils idiomatisch wieder.
theological_decisions:
- issue: Deutung von τὰ ἐνόντα im Verhältnis zu Reinheit und Almosengeben
  choice: „das, was innen ist“ im Sinn des Inneren
  alternative: „was ihr habt“ im Sinn des verfügbaren Besitzes
  rationale: Der unmittelbare Kontext stellt die Außen- und Innenseite von Becher und Schüssel einander gegenüber (Lukas 11,39). Die Hauptfassung wahrt daher diesen inneren, moralischen Bezug. Da die griechische Wendung auch auf vorhandenen Besitz bezogen werden kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Almosen“ ist ein etablierter biblischer Begriff und hier präziser als das allgemeinere „Spende“. „Seht“ ist gegenwärtiger als „siehe“, bewahrt aber den rhetorischen Nachdruck.
