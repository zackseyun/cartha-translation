id: LUK.11.34
reference: Luke 11:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: de
  text: Die Leuchte des Körpers ist dein Auge. Wenn dein Auge gesund[a] ist, ist auch dein ganzer Körper hell; wenn es aber schlecht[b] ist, ist auch dein Körper dunkel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »ungeteilt«, »klar« oder »lauter«. Das griechische Wort kann etwas Ungeteiltes, Aufrichtiges oder Unversehrtes bezeichnen; in bestimmten Zusammenhängen kann es auch Freigebigkeit anklingen lassen.
    reason: lexical_alternative
  - marker: b
    text: Oder »böse«. Das griechische Wort kann sowohl einen mangelhaften Zustand als auch moralische Bosheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: Leuchte
  rationale: Das Wort bezeichnet eine konkrete Lampe beziehungsweise Lichtquelle. »Leuchte« bewahrt das Bild und klingt im modernen Deutschen natürlich und würdevoll.
- source_word: σῶμα
  choice: Körper
  rationale: Gemeint ist zunächst der menschliche Körper, der innerhalb des Bildworts zugleich auf den gesamten Zustand des Menschen verweist.
- source_word: ὀφθαλμός
  choice: Auge
  rationale: Die wörtliche Bedeutung wird beibehalten; vom körperlichen Auge aus entfaltet der Satz sein Bild für Wahrnehmung und innere Ausrichtung.
- source_word: ἁπλοῦς
  choice: gesund
  rationale: Im Gegensatz zu einem »schlechten« Auge bezeichnet das Adjektiv hier am ehesten ein unversehrtes, richtig ausgerichtetes Auge. »Gesund« ist verständlich, ohne die möglichen Bedeutungsnuancen im Haupttext übermäßig festzulegen.
- source_word: φωτεινός
  choice: hell
  rationale: Das Adjektiv bedeutet »licht, hell, voller Licht«. »Hell« bildet im Deutschen einen klaren und knappen Gegensatz zu »dunkel«.
- source_word: πονηρός
  choice: schlecht
  rationale: Das Wort kann sowohl »schlecht« als auch »böse« bedeuten. »Schlecht« lässt im Bild vom Auge eine körperliche Fehlfunktion ebenso anklingen wie eine moralisch verkehrte Wahrnehmung.
- source_word: σκοτεινός
  choice: dunkel
  rationale: Die direkte Wiedergabe wahrt den Gegensatz zu φωτεινός (»hell«).
theological_decisions:
- issue: Bedeutung von ἁπλοῦς als Beschreibung des Auges
  choice: Im Haupttext »gesund«
  alternative: »ungeteilt«, »klar«, »lauter« oder »freigebig«
  rationale: Das unmittelbare Bild stellt ein richtig funktionierendes Auge einem schlechten Auge gegenüber und verbindet dies mit Helligkeit beziehungsweise Dunkelheit des ganzen Körpers. »Gesund« vermittelt diesen Zusammenhang verständlich. Die Fußnote hält zugleich die mögliche ethisch-geistliche Bedeutung einer ungeteilten, lauteren oder freigebigen Ausrichtung offen.
- issue: Moralische oder körperliche Bedeutung von πονηρός
  choice: Im Haupttext »schlecht«
  alternative: »böse«
  rationale: Der griechische Ausdruck kann einen mangelhaften Zustand und moralische Bosheit bezeichnen. Die offenere Wiedergabe »schlecht« bewahrt diese Spannung, während die Fußnote ausdrücklich auf »böse« hinweist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallele Satzstruktur und der Gegensatz »hell – dunkel« bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
