id: LUK.11.32
reference: Luke 11:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: de
  text: 'Die Männer von Ninive werden im Gericht zusammen mit dieser Generation auferstehen und sie verurteilen; denn sie kehrten auf Jonas Verkündigung hin um. Und seht: Hier ist Größeres als Jona.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Hier ist einer, der größer ist als Jona“ oder „Hier ist mehr als Jona“. Im Griechischen steht „größer/mehr“ in einer sächlichen Form. Damit kann umfassend die in Jesus und seinem Wirken gegenwärtige größere Wirklichkeit gemeint sein, nicht nur der Vergleich zweier Personen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Die Männer von Ninive
  rationale: ἄνδρες ist ausdrücklich maskulin und wird daher mit „Männer“ wiedergegeben; „von Ninive“ ist im Deutschen natürlicher als „ninivitische Männer“.
- source_word: ἀναστήσονται
  choice: werden … auferstehen
  rationale: Im Zusammenhang des endzeitlichen Gerichts bezeichnet das Verb das Auferstehen. Die Wiedergabe macht den gerichtlichen Kontext deutlich, ohne den Vorgang weiter auszudeuten.
- source_word: ἐν τῇ κρίσει
  choice: im Gericht
  rationale: Die Formulierung bewahrt die Präposition und bezeichnet das endzeitliche Gerichtsgeschehen knapp und idiomatisch.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: zusammen mit dieser Generation
  rationale: „Zusammen mit“ gibt die mit μετά bezeichnete Begleitung ausdrücklich wieder; „diese Generation“ bewahrt die synoptische Wendung.
- source_word: κατακρινοῦσιν αὐτήν
  choice: werden … sie verurteilen
  rationale: κατακρίνω bedeutet hier nicht nur urteilen, sondern verurteilen. Das Pronomen bezieht sich auf „diese Generation“.
- source_word: μετενόησαν
  choice: sie kehrten … um
  rationale: „Umkehren“ gibt im prophetischen Zusammenhang die moralisch-geistliche Neuausrichtung natürlich wieder und vermeidet die im heutigen Deutsch teils eng kirchlich klingende Formulierung „Buße tun“.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: auf die Verkündigung Jonas hin
  rationale: Die Wendung bringt die durch Jonas Botschaft ausgelöste Reaktion zum Ausdruck und wahrt zugleich die Bildrichtung von εἰς.
- source_word: ἰδοὺ
  choice: Und seht
  rationale: „Seht“ ist ein gegenwärtiger, würdevoller Aufmerksamkeitsruf; „und“ gibt die verbindende Funktion von καί wieder.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: Hier ist Größeres als Jona
  rationale: Das substantivierte neutrale „Größeres“ bewahrt das Neutrum πλεῖον und lässt offen, ob der Akzent auf Jesus selbst oder umfassender auf der in ihm gegenwärtigen größeren Wirklichkeit liegt.
theological_decisions:
- issue: Bezug und Tragweite von πλεῖον Ἰωνᾶ
  choice: Hier ist Größeres als Jona
  alternative: Hier ist einer, der größer ist als Jona; hier ist mehr als Jona
  rationale: Das griechische πλεῖον steht im Neutrum. „Größeres“ bewahrt diese Form und damit die Spannung zwischen einem persönlichen Vergleich mit Jesus und einem umfassenderen Hinweis auf seine Person, sein Wirken und die in ihm gegenwärtige Wirklichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am griechischen Aufbau; „zusammen mit“ und „auf … hin“ sorgen zugleich für natürliche Verständlichkeit. Das Neutrum in „Größeres“ wird bewusst bewahrt.
