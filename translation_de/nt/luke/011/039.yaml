id: LUK.11.39
reference: Luke 11:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: de
  text: 'Doch der Herr sagte zu ihm: „Nun, ihr Pharisäer, ihr reinigt die Außenseite des Bechers und der Schüssel; doch euer Inneres ist voll Habgier[a] und Bosheit.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Raubgier, Raub, Plünderung oder Erpressung.'
    reason: Das griechische ἁρπαγή kann sowohl räuberische Gier als auch konkretes gewaltsames oder ausbeuterisches Ansichreißen bezeichnen.
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Der etablierte neutestamentliche Titel wird beibehalten; hier ist nicht bloß eine höfliche Anrede gemeint.
- source_word: Νῦν
  choice: Nun
  rationale: „Nun“ bewahrt die Funktion als Einleitung des pointierten Tadels und klingt im Deutschen natürlich.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: ihr Pharisäer
  rationale: Die ausdrückliche Anrede gibt die Hervorhebung durch Pronomen und Substantiv knapp und idiomatisch wieder.
- source_word: τὸ ἔξωθεν
  choice: die Außenseite
  rationale: Die substantivierte Ortsangabe bezeichnet konkret das Äußere der Gefäße.
- source_word: ποτηρίου
  choice: Becher
  rationale: „Becher“ ist die übliche, konkrete Wiedergabe von ποτήριον in diesem Zusammenhang.
- source_word: πίνακος
  choice: Schüssel
  rationale: πίναξ kann eine Platte oder Schüssel für Speisen bezeichnen; „Schüssel“ ist allgemein verständlich und passt zum Haushaltsbild.
- source_word: καθαρίζετε
  choice: reinigt
  rationale: Das Präsens bezeichnet die charakteristische Handlung; „reinigt“ wahrt zugleich den konkreten und den Reinheitskontext.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: euer Inneres
  rationale: Die Formulierung erhält den unmittelbaren Gegensatz zwischen äußerer Reinigung und innerer Verderbtheit, ohne interpretierend „Herz“ einzusetzen.
- source_word: γέμει
  choice: ist voll
  rationale: Dies ist die natürliche deutsche Entsprechung der Zustandsbeschreibung mit Genitivergänzungen.
- source_word: ἁρπαγῆς
  choice: Habgier
  rationale: Das Wort kann Raub, gewaltsames Ansichreißen oder räuberische Gier bezeichnen. „Habgier“ benennt im Haupttext verständlich das innere Laster; die konkreteren Bedeutungen werden in der Fußnote bewahrt.
- source_word: πονηρίας
  choice: Bosheit
  rationale: „Bosheit“ gibt den breiten moralischen Sinn ernst und idiomatisch wieder und verbindet sich natürlich mit „Habgier“.
theological_decisions:
- issue: Bezug des metaphorischen „Inneren“
  choice: „euer Inneres“ als offene Metapher beibehalten
  alternative: „euer Herz“ oder „in eurem Inneren seid ihr“
  rationale: Der griechische Text stellt das Äußere der Gefäße dem Inneren der Angesprochenen gegenüber. „Herz“ würde eine bestimmte anthropologische Deutung eintragen, die der Wortlaut nicht ausdrücklich festlegt.
- issue: Moralischer Sinn von ἁρπαγή
  choice: „Habgier“ im Haupttext mit lexikalischer Fußnote
  alternative: „Raub“, „Plünderung“, „Erpressung“ oder „Raubgier“
  rationale: Der Kontext beschreibt innere moralische Verderbtheit, doch das griechische Wort trägt zugleich den konkreten Gedanken räuberischen Ansichreißens. Haupttext und Fußnote halten beide Aspekte zusammen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz „Außenseite“/„Inneres“ bleibt sichtbar; der Satz vermeidet sowohl altertümliche Ausdrucksweise als auch eine psychologisierende Ausdeutung.
