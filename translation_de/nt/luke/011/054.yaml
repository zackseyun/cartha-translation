lexical_decisions:
- source_word: ἐνεδρεύοντες αὐτόν
  choice: sie lauerten ihm auf
  rationale: Die deutsche Wendung „jemandem auflauern“ gibt das feindselige Warten mit der Absicht, ihn zu überführen oder zu fangen, knapp und natürlich wieder. Das Pronomen bleibt erhalten, ohne den Bezug ausdrücklich durch „Jesus“ zu ersetzen.
- source_word: θηρεῦσαί
  choice: zu erhaschen
  rationale: Das Verb stammt aus dem Bereich von Jagd und Fang. „Erhaschen“ bewahrt dieses Bild und passt zugleich zu dem Versuch, eine belastende Äußerung aufzugreifen.
- source_word: τι
  choice: etwas
  rationale: Das unbestimmte Pronomen bezeichnet irgendeine Äußerung, die sich gegen Jesus verwenden ließe.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund
  rationale: Die konkrete Bildsprache des Griechischen bleibt erhalten; gemeint ist etwas, das er sagt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dabei“ macht den anschließenden Charakter des griechischen Partizips verständlich; „auflauern“ und „erhaschen“ erhalten das Jagd- und Fangmotiv, ohne die Aussage unnötig auszudeuten.
