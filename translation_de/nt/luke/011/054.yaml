review_pass:
  verdict: revise
  source_fidelity: „Sie lauerten ihm auf“ trifft ἐνεδρεύοντες αὐτόν präzise. „Erhaschen“ kann zwar das Fangbild aufnehmen, ist mit „etwas aus seinem Mund“ im heutigen Deutsch jedoch missverständlich und klingt, als gehe es um einen körperlichen Gegenstand. „Aufgreifen“ gibt im Kontext das gezielte Ergreifen einer Äußerung wieder, ohne einen im griechischen Wortlaut nicht ausdrücklich genannten weiteren Zweck hinzuzufügen.
  naturalness: Die revidierte Formulierung ist modernes, flüssiges Standarddeutsch. „Etwas aus seinem Mund aufgreifen“ ist im Kontext gesprochener Worte verständlicher als „erhaschen“.
  terminology: Es sind keine theologischen Fachbegriffe betroffen. Die erklärende Fußnote sollte die idiomatische Bedeutung benennen, aber nicht ergänzen, dass sie ihn damit in eine Falle locken oder gegen ihn vorgehen wollten; dies liegt zwar im weiteren Kontext nahe, wird in diesem Textsegment aber nicht gesagt.
  issues:
  - severity: medium
    issue: „etwas aus seinem Mund zu erhaschen“ ist im Deutschen semantisch und stilistisch unklar.
    rationale: Die Verbindung kann ein physisches Erhaschen nahelegen. Das griechische θηρεῦσαι bezeichnet hier das Aufspüren bzw. Ergreifen einer verwertbaren Äußerung.
  - severity: medium
    issue: Die Fußnote ergänzt einen nicht im überlieferten Satz ausgedrückten Zweck.
    rationale: „mit der sie ihn in eine Falle locken oder gegen ihn vorgehen konnten“ deutet über θηρεῦσαί τι ἐκ τοῦ στόματος αὐτοῦ hinaus. Eine Erklärung sollte bei der Bedeutung „etwas, was er sagte“ bleiben.
  revised_text: Dabei lauerten sie ihm auf, um etwas aus seinem Mund aufzugreifen.[a]
