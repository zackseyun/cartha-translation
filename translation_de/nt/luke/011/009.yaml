id: LUK.11.9
reference: Luke 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: de
  text: 'Und ich sage euch: Bittet, dann wird euch gegeben; sucht, dann werdet ihr finden; klopft an, dann wird euch geöffnet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Präsensformen können auch fortgesetztes oder wiederholtes Handeln ausdrücken: „Bittet immer weiter … sucht immer weiter … klopft immer weiter an.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: Und ich sage euch
  rationale: Die Formulierung bewahrt den Anschluss durch καί, die Hervorhebung des Sprechers und die feierliche, im Deutschen natürliche Einleitung.
- source_word: αἰτεῖτε
  choice: Bittet
  rationale: Das schlichte Präsensimperativ gibt die Aufforderung prägnant wieder, ohne eine fortdauernde oder wiederholte Handlung zwingend festzulegen.
- source_word: δοθήσεται ὑμῖν
  choice: dann wird euch gegeben
  rationale: Das Passiv und der persönliche Dativ bleiben erhalten; „dann“ macht die im Griechischen durch καί ausgedrückte Folge im Deutschen natürlich verständlich.
- source_word: ζητεῖτε, καὶ εὑρήσετε
  choice: sucht, dann werdet ihr finden
  rationale: „Suchen“ wahrt die konkrete wie übertragene Bedeutungsbreite; das Futur und die parallele Zusage werden direkt wiedergegeben.
- source_word: κρούετε
  choice: klopft an
  rationale: Im Deutschen bezeichnet „anklopfen“ idiomatisch das Klopfen an einer Tür und macht das im Kontext vorausgesetzte Bild verständlich.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: dann wird euch geöffnet
  rationale: Die unpersönliche Passivform bewahrt, dass der Handelnde und das zu Öffnende im griechischen Wortlaut nicht ausdrücklich genannt werden.
theological_decisions:
- issue: Aspekt der Präsensimperative αἰτεῖτε, ζητεῖτε und κρούετε
  choice: Schlichte Imperative im Haupttext
  alternative: „Bittet immer weiter … sucht immer weiter … klopft immer weiter an“
  rationale: Die Präsensformen können fortgesetztes oder wiederholtes Handeln nahelegen, legen es jedoch nicht so eindeutig fest, dass diese Deutung in den Haupttext aufgenommen werden sollte. Eine Fußnote weist auf die mögliche Nuance hin.
- issue: Unausgesprochener Handelnder in den Passivformen δοθήσεται und ἀνοιγήσεται
  choice: Passiv ohne ausdrückliche Nennung Gottes
  alternative: „Gott wird euch geben“ beziehungsweise „Gott wird euch öffnen“
  rationale: Der Zusammenhang kann Gott als Handelnden erkennen lassen, doch der griechische Text nennt ihn in diesem Vers nicht ausdrücklich. Das Passiv bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Parallelstruktur wurde bewahrt; „dann“ gibt die Folgerelation des jeweiligen καί idiomatisch wieder. Das wiederholte ὑμῖν erscheint gemäß dem griechischen Text in der ersten und dritten Zusage, während die mittlere Zusage mit „ihr“ formuliert ist.
