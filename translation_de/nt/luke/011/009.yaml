  source_fidelity: Der Entwurf gibt die dreigliedrige Struktur, die Imperative αἰτεῖτε/ζητεῖτε/κρούετε, die futurischen Zusagen und die nicht ausdrücklich benannten Handelnden der Passivformen zuverlässig wieder. „Klopft an“ erschließt das bei κρούετε naheliegende Türbild idiomatisch, ohne den griechischen Wortlaut unzulässig auszuweiten. Die Wiederaufnahme von „euch“ in den ersten und dritten Zusagen sowie „ihr“ in der mittleren Zusage entspricht der jeweiligen griechischen Konstruktion.
  naturalness: '„Und ich sage euch: Bittet, dann wird euch gegeben; sucht, dann werdet ihr finden; klopft an, dann wird euch geöffnet“ ist modernes, verständliches Standarddeutsch und bewahrt den würdevollen Spruchcharakter. Das elliptische Passiv „wird euch geöffnet“ ist im Kontext von „anklopfen“ idiomatisch verständlich.'
