id: LUK.11.2
reference: Luke 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: de
  text: 'Da sagte er zu ihnen: »Wenn ihr betet, dann sagt: ›Vater,[a] dein Name werde geheiligt.[b] Dein Reich komme.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier nur »Vater«, nicht »unser Vater« wie in Matthäus 6,9.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »dein Name werde als heilig geachtet«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Wenn ihr betet
  rationale: Die allgemeine zeitliche Bedingung wird im modernen Deutschen natürlich mit »wenn« und Präsens wiedergegeben; der wiederholte oder gewohnheitsmäßige Sinn bleibt im Kontext erhalten.
- source_word: λέγετε
  choice: dann sagt
  rationale: Der Präsensimperativ bezeichnet die Anweisung für das Gebet. »Dann sagt« ist idiomatisch und vermeidet eine unbegründete Verstärkung wie »sagt immer wieder«.
- source_word: Πάτερ
  choice: Vater
  rationale: Der griechische Vokativ lautet im SBLGNT schlicht »Vater«; »unser Vater« würde den Wortlaut an Matthäus 6,9 angleichen.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: dein Name werde geheiligt
  rationale: Der passive Imperativ wird knapp und traditionsverständlich bewahrt. Die Formulierung lässt offen, durch wen beziehungsweise auf welche Weise Gottes Name als heilig anerkannt und behandelt wird.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Dein Reich komme
  rationale: Die deutsche Wunschform mit Konjunktiv I gibt den petitionären Imperativ prägnant wieder. »Reich« bewahrt die etablierte Evangelienterminologie und lässt sowohl Gottes Herrschaft als auch ihre eschatologische Verwirklichung anklingen.
theological_decisions:
- issue: Anrede Gottes ohne Possessivpronomen
  choice: Vater
  alternative: Unser Vater
  rationale: Die Übersetzung folgt Πάτερ im vorliegenden griechischen Text und harmonisiert Lukas nicht mit der parallelen Gebetsfassung in Matthäus 6,9.
- issue: Bedeutung von ἁγιασθήτω beim Namen Gottes
  choice: dein Name werde geheiligt
  alternative: dein Name werde als heilig geachtet
  rationale: Die passive und bewusst offene Form des Ausgangstextes bleibt erhalten. Eine erklärende Umschreibung würde den Sinn stärker auf menschliche Ehrung festlegen, obwohl auch Gottes eigenes Handeln mitgehört werden kann.
- issue: Bedeutungsbreite von βασιλεία
  choice: Reich
  alternative: Herrschaft
  rationale: »Reich« ist im Kontext des Gebets natürlich und bewahrt die Spannung zwischen Gottes königlichem Walten und dessen kommender Vollendung; »Herrschaft« würde den dynamischen Aspekt deutlicher, aber den etablierten Ausdruck verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter Gebetssprache. Die Konjunktivformen »werde« und »komme« spiegeln die Bitten knapp wider, ohne altertümlich zu wirken. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
