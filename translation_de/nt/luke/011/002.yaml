review_pass:
  verdict: approve
  source_fidelity: 'Der Text gibt den griechischen Wortlaut des SBLGNT zuverlässig wieder: Πάτερ erscheint korrekt als »Vater« ohne Ergänzung von »unser«; die allgemeine Bedingung Ὅταν προσεύχησθε und der Imperativ λέγετε sind angemessen als »Wenn ihr betet, dann sagt« wiedergegeben. Die beiden bittenden Imperative werden mit den deutschen Konjunktivformen »werde« und »komme« treffend ausgedrückt. »Reich« wahrt die semantische Offenheit von βασιλεία.'
  naturalness: Die Formulierung ist klares, modernes Standarddeutsch in einem würdigen, für ein Gebet passenden Register. »Dein Name werde geheiligt. Dein Reich komme« ist traditionsverständlich, dabei nicht unnatürlich oder übermäßig altertümlich. Das eingefügte »dann« macht die Anweisung idiomatisch und verändert den Sinn nicht.
  terminology: »Vater«, »Name«, »geheiligt« und »Reich« sind sachgerecht und konsistent. Besonders »geheiligt« bewahrt die passive, petitionäre Offenheit von ἁγιασθήτω, ohne den Bezug voreilig auf bloß menschliches Achten zu reduzieren.
