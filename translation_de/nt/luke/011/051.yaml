id: LUK.11.51
reference: Luke 11:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: de
  text: 'vom Blut Abels bis zum Blut Sacharjas[b], der zwischen dem Altar und dem Haus[a] umkam. Ja, ich sage euch: Es wird von dieser Generation eingefordert werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwischen dem Altar und dem Tempel«. Wörtlich steht im Griechischen: »zwischen dem Altar und dem Haus«.'
    reason: lexical_alternative
  - marker: b
    text: Welcher Sacharja gemeint ist, ist umstritten. In Betracht kommen unter anderem Sacharja, der Sohn Jojadas (2. Chronik 24,20–22), und Sacharja, der Sohn Berechjas.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: vom Blut Abels bis zum Blut Sacharjas
  rationale: Bewahrt die rhetorische Spannweite der griechischen Konstruktion mit ἀπό und ἕως sowie das biblische Bild vom vergossenen Blut.
- source_word: τοῦ ἀπολομένου
  choice: der … umkam
  rationale: Gibt das mediale Partizip von ἀπόλλυμι natürlich wieder, ohne die im Verb nicht ausdrücklich genannte Täterschaft zu ergänzen; der Zusammenhang lässt einen gewaltsamen Tod erkennen.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: zwischen dem Altar und dem Haus
  rationale: Folgt dem wörtlichen Sinn von οἶκος und erhält die biblische Bezeichnung des Tempels als Haus; die kontextuell eindeutigere Wiedergabe wird in der Fußnote genannt.
- source_word: ναί, λέγω ὑμῖν
  choice: Ja, ich sage euch
  rationale: Erhält sowohl die nachdrückliche Bestätigung als auch die feierliche, im Deutschen geläufige Redeformel.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: Es wird von dieser Generation eingefordert werden
  rationale: Bewahrt das unpersönliche Passiv, den gerichtlichen Sinn von ἐκζητέω und die Präposition ἀπό, ohne Gott als ausdrücklich handelndes Subjekt in den Text einzufügen.
theological_decisions:
- issue: Identität Sacharjas und Tragweite der Anklage
  choice: Sacharja wird im Haupttext nicht näher identifiziert; „diese Generation“ bleibt auf die von Jesus angesprochene Generation bezogen, ohne zusätzliche systematische Deutung.
  alternative: Sacharja, der Sohn Jojadas; Sacharja, der Sohn Berechjas; oder eine repräsentative prophetische Märtyrergestalt.
  rationale: Der griechische Vers nennt weder den Vater Sacharjas noch eine andere eindeutige Identifikation. Die historische Frage und die theologische Spannung der gerichtlichen Verantwortlichkeit sollen daher nicht im Haupttext entschieden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng an der griechischen Syntax, klingt jedoch natürlich. „Haus“ erhält das biblische Tempelbild; „umkam“ vermeidet eine nicht ausdrücklich markierte Passivagentur; das unpersönliche „Es“ bewahrt die Offenheit des griechischen Gerichtspassivs.
