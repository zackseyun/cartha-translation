  to: Wehe euch, Gesetzesgelehrte![a] Denn ihr habt den Schlüssel der Erkenntnis weggenommen. Ihr selbst seid nicht hineingegangen, und diejenigen, die hineingingen, habt ihr gehindert.[b]
