id: LUK.11.52
reference: Luke 11:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: de
  text: Wehe euch, Gesetzesgelehrte![a] Denn ihr habt den Schlüssel der Erkenntnis weggenommen. Ihr selbst seid nicht hineingegangen, und diejenigen, die hineingingen, habt ihr gehindert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Fachkundige im jüdischen Gesetz, nicht Rechtsanwälte im heutigen Sinn.
    reason: lexical_clarification
  - marker: b
    text: 'Wörtlicher: „und die Hineingehenden habt ihr gehindert“. Das Ziel des Hineingehens wird im griechischen Text nicht ausdrücklich genannt.'
    reason: ambiguity_preservation
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: Bewahrt den Nachdruck des prophetischen Wehrufs und ist im Deutschen zugleich würdevoll und verständlich.
- source_word: νομικοῖς
  choice: Gesetzesgelehrten
  rationale: Bezeichnet Fachkundige im jüdischen Gesetz und vermeidet die moderne Assoziation von Rechtsanwälten.
- source_word: ἤρατε
  choice: weggenommen
  rationale: Gibt hier den Sinn des Entfernens beziehungsweise Entziehens wieder und passt zum Bild eines vorenthaltenen Zugangsschlüssels.
- source_word: κλεῖδα τῆς γνώσεως
  choice: den Schlüssel der Erkenntnis
  rationale: Bildet die griechische Genitivverbindung eng ab und erhält die offene Metapher.
- source_word: αὐτοὶ
  choice: ihr selbst
  rationale: Bewahrt die emphatische Gegenüberstellung zwischen den Angesprochenen und den anderen.
- source_word: οὐκ εἰσήλθατε
  choice: seid nicht hineingegangen
  rationale: Erhält das Bild des Eintretens, ohne dessen nicht ausdrücklich genanntes Ziel festzulegen.
- source_word: τοὺς εἰσερχομένους
  choice: die, die hineingehen wollten
  rationale: Gibt die auf das Eintreten gerichtete Handlung idiomatisch wieder; die Formulierung macht im Zusammenhang verständlich, dass diese Menschen durch das Hindern gehindert wurden, ohne den Zielort zu ergänzen.
- source_word: ἐκωλύσατε
  choice: habt ihr daran gehindert
  rationale: Drückt Behinderung aus, ohne zwingend zu behaupten, dass der Eintritt endgültig unmöglich gemacht wurde.
theological_decisions:
- issue: Bezug von „hineingehen“ und „Schlüssel der Erkenntnis“
  choice: Die Zugangs- und Eintrittsmetapher bleibt ohne ausdrückliche Nennung ihres Zieles stehen.
  alternative: Das Eintreten ausdrücklich als Eintritt in das Reich Gottes oder als Zugang zur wahren Gotteserkenntnis deuten.
  rationale: Der griechische Text nennt kein Objekt des Eintretens. Die offene Formulierung bewahrt deshalb die mögliche heilsgeschichtliche und erkenntnisbezogene Spannung, ohne sie konfessionell oder dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesetzesgelehrte“ ist sachlich präzise und allgemein verständlich; die Eintrittsmetapher bleibt bewusst offen.
