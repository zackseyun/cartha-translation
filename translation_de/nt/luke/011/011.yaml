source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: de
  text: Welcher Vater unter euch wird, wenn sein Sohn ihn um einen Fisch bittet, ihm statt eines Fisches eine Schlange geben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Welcher Vater unter euch
  rationale: Die Formulierung gibt die rhetorische Frage natürlich und nah am griechischen Ausdruck wieder; δέ bleibt unübersetzt, da ein „aber“ hier im Deutschen den Anschluss unnötig schwer machen würde.
- source_word: αἰτήσει
  choice: wenn er ihn … bittet
  rationale: Der griechische Futur steht in einer hypothetischen rhetorischen Frage. Im modernen Deutschen ist ein wenn-Satz idiomatisch; „jemanden um etwas bitten“ gibt die Konstruktion mit dem erbetenen Gegenstand präzise wieder.
- source_word: ὁ υἱός
  choice: seinem Sohn
  rationale: Der bestimmte Artikel bezeichnet hier generisch den zum Vater gehörenden Sohn. Das Possessivpronomen macht diese Beziehung im Deutschen natürlich deutlich.
- source_word: ἰχθύν / ἰχθύος
  choice: einen Fisch / des Fisches
  rationale: Der konkrete Singular des griechischen Textes wird an beiden Stellen bewahrt; nach „statt“ ist der Genitiv idiomatisch und formal korrekt.
- source_word: ἀντί
  choice: statt
  rationale: „Statt“ drückt die im Griechischen bezeichnete Ersetzung knapp und natürlich aus.
- source_word: ὄφιν
  choice: eine Schlange
  rationale: „Schlange“ ist die gewöhnliche moderne deutsche Entsprechung und vermeidet zusätzliche symbolische Konnotationen.
- source_word: αὐτῷ ἐπιδώσει
  choice: wird seinem Sohn … geben
  rationale: ἐπιδίδωμι bedeutet hier „geben, reichen“. „Geben“ ist im Kontext natürlich; der Dativbezug wird mit „seinem Sohn“ ausdrücklich und unmissverständlich wiedergegeben.
