  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: de
  text: Der Pharisäer aber war erstaunt, als er das sah, dass Jesus sich vor dem Essen nicht zuerst gewaschen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass Jesus sich vor dem Essen nicht zuerst einer rituellen Waschung unterzogen hatte“. Das griechische Verb wird häufig mit „taufen“ wiedergegeben, bezeichnet hier aber im Zusammenhang pharisäischer Reinheitspraxis eine rituelle Waschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: jedoch
  rationale: Kennzeichnet eine leichte narrative Gegenüberstellung; im Deutschen steht „jedoch“ natürlich nach dem einleitenden Temporalsatz.
- source_word: Φαρισαῖος
  choice: der Pharisäer
  rationale: Übliche und sachlich genaue Wiedergabe der Gruppenbezeichnung mit bestimmtem Artikel.
- source_word: ἰδὼν
  choice: als ... das sah
  rationale: Das Aoristpartizip bezeichnet eine der Hauptreaktion vorausgehende Wahrnehmung. „Das“ nimmt idiomatisch Jesu Verhalten aus dem Kontext auf.
- source_word: ἐθαύμασεν
  choice: wunderte er sich
  rationale: Gibt die überraschte Reaktion natürlich wieder, ohne eine stärkere emotionale Nuance als im griechischen Verb festzulegen.
- source_word: οὐ πρῶτον
  choice: nicht zuerst
  rationale: Bewahrt die Erwartung, die Waschung müsse vor dem Essen stattfinden.
- source_word: ἐβαπτίσθη
  choice: sich ... gewaschen hatte
  rationale: Im Zusammenhang pharisäischer Reinheitspraxis bezeichnet das Verb eine rituelle Waschung, nicht die christliche Taufe. Das Plusquamperfekt macht die zeitliche Abfolge im Deutschen klar.
- source_word: πρὸ τοῦ ἀρίστου
  choice: vor dem Essen
  rationale: ἄριστον bezeichnet hier eine Mahlzeit, möglicherweise am Vormittag oder Mittag; „Essen“ vermeidet eine nicht erforderliche zeitliche Präzisierung.
theological_decisions:
- issue: Bedeutung von ἐβαπτίσθη im Zusammenhang einer pharisäischen Mahlzeit
  choice: rituelle Waschung vor dem Essen, im Text mit „sich gewaschen hatte“ wiedergegeben
  alternative: „sich hatte taufen lassen“ oder „untergetaucht war“
  rationale: Der unmittelbare Kontext betrifft pharisäische Reinheitsbräuche vor einer Mahlzeit, nicht die christliche Taufe. Die Fußnote hält den rituellen Charakter und den Zusammenhang mit dem sonst für „taufen“ verwendeten griechischen Verb sichtbar.
- issue: Unausgesprochenes Subjekt von ἐβαπτίσθη
  choice: „Jesus“ ausdrücklich genannt
  alternative: „er“
  rationale: Im Griechischen ergibt sich der Bezug auf Jesus aus dem Kontext. Im deutschen Satz könnte „er“ unmittelbar nach „der Pharisäer“ fälschlich auf diesen bezogen werden; die ausdrückliche Nennung beseitigt nur eine grammatische Unklarheit, ohne den Sinn auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Wortstellung vermeidet einen unklaren Pronomenbezug; die Fußnote bewahrt die auffällige lexikalische Nähe zum Taufwort, ohne den Mahlzeitkontext zu verfälschen.
