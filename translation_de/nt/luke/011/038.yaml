  rationale: Die Revision ist stilistisch und semantisch eng begrenzt. Sie erhält die zeitliche Folge, die implizite Bezugnahme auf Jesus, die nicht näher bestimmte Mahlzeit und den rituellen Sinn der Waschung; zugleich wird die deutsche Reaktion präzisiert und die Fußnote idiomatischer sowie näher an der passivischen Form des griechischen Verbs gefasst.
