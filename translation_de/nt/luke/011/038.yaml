  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Satzes zutreffend wieder: Der Pharisäer reagiert auf Jesu unterlassene Waschung vor der Mahlzeit. Die explizite Nennung Jesu beseitigt im Deutschen sinnvoll einen sonst naheliegenden falschen Pronomenbezug. Die Wiedergabe von ἐβαπτίσθη als Waschung ist im Kontext sachgerecht.'
  naturalness: Die vorgeschlagene Umstellung stellt die griechische Satzführung und die leichte adversative Weiterführung mit „aber“ idiomatischer dar. „War erstaunt“ ist für ἐθαύμασεν im modernen Standarddeutsch etwas präziser als „wunderte sich“, das auch bloßes Sich-Wundern bzw. Nachfragen nahelegen kann.
  terminology: „Pharisäer“, „Essen“ und „rituelle Waschung“ sind angemessen. Die Fußnote sollte die alternative Umschreibung als ein Sich-Unterziehen einer Waschung formulieren, nicht als deren „Vollzug“, da das griechische Passiv nicht den Vollzug eines Ritus durch Jesus hervorhebt.
