id: LUK.11.36
reference: Luke 11:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: de
  text: Wenn nun dein ganzer Körper hell ist und keinen dunklen Teil hat, dann wird er ganz hell sein, wie wenn die Lampe dich mit ihrem Lichtschein[a] erleuchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit ihrem Aufleuchten«; das griechische Wort kann einen Blitz, ein Aufleuchten oder hellen Schein bezeichnen. Hier ist wahrscheinlich das Leuchten der Lampe gemeint, nicht ein buchstäblicher Blitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: Körper
  rationale: Die konkrete Bedeutung wird beibehalten und damit auch das Bild vom Auge als Leuchte des Körpers im Kontext; eine Deutung als »Inneres« oder »ganzer Mensch« wird nicht in den Text eingetragen.
- source_word: ὅλον / ὅλον
  choice: ganzer / ganz
  rationale: Die zweimalige Totalitätsaussage wird natürlich wiedergegeben, ohne die Wiederholung unnötig zu glätten.
- source_word: φωτεινόν
  choice: hell
  rationale: »Hell« ist im Deutschen idiomatisch, steht klar im Gegensatz zu »dunkel« und gibt das prädikative Adjektiv direkt wieder.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: und keinen dunklen Teil hat
  rationale: Die partizipiale Wendung wird als natürlicher deutscher Nebenaussagesatz formuliert; das konkrete Bild eines dunklen Teils bleibt erhalten.
- source_word: ἔσται φωτεινὸν ὅλον
  choice: dann wird er ganz hell sein
  rationale: Das Futur und die erneute Gesamtaussage werden bewahrt; das Pronomen bezieht sich grammatisch auf »Körper«.
- source_word: ὡς ὅταν
  choice: wie wenn
  rationale: Die vergleichend-temporale Konstruktion wird knapp und idiomatisch wiedergegeben.
- source_word: λύχνος
  choice: Lampe
  rationale: Gemeint ist eine konkrete tragbare Lampe, nicht das abstrakte Licht oder ein Lampenständer.
- source_word: τῇ ἀστραπῇ
  choice: mit ihrem Lichtschein
  rationale: ἀστραπή kann Blitz, Aufleuchten oder hellen Schein bezeichnen. Bei einer Lampe ist »Lichtschein« im Haupttext kontextgerecht, während die stärkere Bildvariante in der Fußnote erhalten bleibt.
- source_word: φωτίζῃ σε
  choice: dich … erleuchtet
  rationale: Das persönliche Objekt σε bleibt ausdrücklich erhalten; »erleuchten« gibt das Lichtspenden würdig und natürlich wieder.
theological_decisions:
- issue: Metaphorische Bedeutung von Körper, Helligkeit und Dunkelheit
  choice: Die körperliche Lichtmetaphorik bleibt ohne erklärende Auflösung stehen.
  alternative: »Körper« als »ganzer Mensch«, »Inneres« oder »geistlicher Zustand« paraphrasieren.
  rationale: Der Vers knüpft an das vorausgehende Bild vom Auge als Leuchte des Körpers an. Eine explizite Deutung würde die bildhafte und theologisch offene Aussage stärker festlegen als der griechische Text.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wurde für natürliches Deutsch leicht gegliedert; Bildsprache, Wiederholung und Bedingungs-Folge-Struktur bleiben erhalten.
