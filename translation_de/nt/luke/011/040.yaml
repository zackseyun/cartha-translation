  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: de
  text: Ihr Unverständigen! Hat nicht der, der das Äußere gemacht hat, auch das Innere gemacht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Außenseite … die Innenseite“. Die Formulierung kann sich im unmittelbaren Zusammenhang sowohl auf die Außen- und Innenseite des Gefäßes als auch im übertragenen Sinn auf das äußere und innere Leben des Menschen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Ihr Unverständigen!
  rationale: Der substantivisch gebrauchte Vokativ Plural ist eine direkte, scharfe Zurechtweisung. „Ihr Unverständigen“ ist in modernem Deutsch natürlich und würdevoll, ohne die Aussage unnötig abzuschwächen.
- source_word: οὐχ ... ἐποίησεν;
  choice: Hat nicht ... gemacht?
  rationale: Die verneinte Frage erwartet Zustimmung. Das deutsche Perfekt gibt die rhetorische Frage idiomatisch und verständlich wieder.
- source_word: ὁ ποιήσας
  choice: der, der ... gemacht hat
  rationale: Das substantivierte Partizip bezeichnet den Handelnden, ohne ihn ausdrücklich als Gott zu benennen. So bleibt die Formulierung des Griechischen erhalten.
- source_word: τὸ ἔξωθεν
  choice: das Äußere
  rationale: Die substantivierte Richtungsangabe bezeichnet die Außenseite beziehungsweise den äußeren Bereich und bleibt sowohl auf das Gefäßbild als auch auf das äußere menschliche Leben beziehbar.
- source_word: τὸ ἔσωθεν
  choice: das Innere
  rationale: Die parallele Formulierung wahrt den Gegensatz zum Äußeren und lässt sowohl die Innenseite des Gefäßes als auch die innere Wirklichkeit des Menschen anklingen.
- source_word: καὶ
  choice: auch
  rationale: '„Auch“ bringt in der rhetorischen Frage die Folgerung klar zum Ausdruck: Wer das Äußere gemacht hat, hat ebenso das Innere gemacht.'
theological_decisions:
- issue: Bezug von ὁ ποιήσας („der, der ... gemacht hat“)
  choice: Der implizite Bezug auf Gott als Schöpfer bleibt erhalten, ohne „Gott“ ausdrücklich einzufügen.
  alternative: Ausschließlicher Bezug auf den Hersteller des Gefäßes
  rationale: Die Aussage greift unmittelbar das Bild von Becher und Schüssel auf, weist aber zugleich auf den Schöpfer des äußeren und inneren Menschen. Die allgemeine Formulierung bewahrt beide Ebenen und löst die Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die scharfe Anrede und die knappe rhetorische Struktur des griechischen Satzes bleiben gewahrt.
