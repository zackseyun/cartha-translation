  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: de
  text: Wenn aber ich die Dämonen durch Beelzebul austreibe, durch wen[a] treiben eure Söhne[b] sie aus? Deshalb werden sie selbst eure Richter sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wodurch; oder: durch welche Macht.'
    reason: lexical_alternative
  - marker: b
    text: Mit „euren Söhnen“ können hier Menschen aus dem Umfeld der Angeredeten gemeint sein; der griechische Ausdruck legt ihre genauere Beziehung zu ihnen nicht fest.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: εἰ δὲ ἐγώ
  choice: Wenn aber ich
  rationale: „Aber“ wahrt den argumentativen Gegensatz. Das ausdrücklich gesetzte ἐγώ wird durch die markierte Stellung von „ich“ wiedergegeben und hebt Jesus im Vergleich zu den „Söhnen“ seiner Gegner hervor.
- source_word: ἐν Βεελζεβούλ
  choice: durch Beelzebul
  rationale: ἐν bezeichnet hier am ehesten Mittel oder Urheber. „Durch“ ist im Deutschen natürlich und vermeidet den über den Wortlaut hinausgehenden Zusatz „durch die Macht“.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: die Dämonen austreibe
  rationale: „Austreiben“ ist die geläufige und sachlich genaue deutsche Wiedergabe für ἐκβάλλω in einem Exorzismuskontext; τὰ δαιμόνια bezeichnet die Dämonen.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: eure Söhne
  rationale: Die wörtliche Wendung bleibt erhalten, da der griechische Text ihre genauere Beziehung zu den Angeredeten nicht ausdrücklich festlegt.
- source_word: ἐν τίνι
  choice: durch wen
  rationale: Die Frage nimmt die persönliche Bezeichnung Beelzebul auf und fragt rhetorisch nach dem Urheber oder Mittel. Die sachlich mögliche unpersönliche Deutung bleibt in einer Fußnote erhalten.
- source_word: διὰ τοῦτο
  choice: Deshalb
  rationale: Die knappe Folgerungsformel gibt den inferentiellen Zusammenhang natürlich wieder.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: sie selbst eure Richter sein
  rationale: „Sie selbst“ bewahrt die Betonung des ausdrücklich gesetzten αὐτοί; die Prädikatskonstruktion wird idiomatisch als „eure Richter sein“ wiedergegeben.
theological_decisions:
- issue: Identität der „Söhne“
  choice: Die wörtliche Bezeichnung „eure Söhne“ bleibt im Haupttext stehen.
  alternative: eure Anhänger; eure Schüler; eure Leute
  rationale: Der Vers setzt Exorzisten aus dem Umfeld der Gegner Jesu voraus, bestimmt ihre genaue Identität jedoch nicht. Eine konkretisierende Wiedergabe würde die im Text verbleibende Deutungsspannung einseitig auflösen.
- issue: Urheber oder Mittel des Austreibens
  choice: „durch wen“
  alternative: wodurch; durch welche Macht
  rationale: Der unmittelbare Vergleich mit Beelzebul begünstigt eine personale Frage, doch ἐν τίνι kann auch nach Mittel oder Macht fragen; diese Möglichkeit wird nicht dogmatisch ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Austreiben“ bewahrt die etablierte Sprache für Exorzismen, ohne altertümlich zu wirken. Die markierte Wortstellung „Wenn aber ich“ und „sie selbst“ gibt die griechischen Hervorhebungen hörbar wieder.
