  to: 'Die Königin des Südens wird sich beim Gericht zusammen mit den Männern dieser Generation erheben und sie verurteilen.[a] Denn sie kam von den Enden der Erde, um die Weisheit Salomos zu hören. Und siehe: Hier ist etwas Größeres als Salomo.[b]'
