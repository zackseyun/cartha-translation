reference: Luke 11:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: de
  text: 'Die Königin des Südens wird sich beim Gericht zusammen mit den Männern dieser Generation erheben und sie verurteilen.[a] Denn sie kam von den Enden der Erde, um die Weisheit Salomos zu hören. Und siehe: Hier ist etwas Größeres als Salomo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Frau, die gewöhnlich mit der Königin von Saba gleichgesetzt wird; siehe 1. Könige 10,1–13 und 2. Chronik 9,1–12.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Hier ist einer, der größer ist als Salomo.“ Im Griechischen steht eine sächliche Form, wörtlich „etwas Größeres als Salomo“; sie kann mehr als einen unmittelbaren Vergleich zwischen zwei Personen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: die Königin des Südens
  rationale: Die Genitivverbindung wird eng am Griechischen wiedergegeben; die wahrscheinliche Identifikation mit der Königin von Saba wird nicht in den Haupttext eingetragen.
- source_word: ἐγερθήσεται
  choice: wird … auferstehen
  rationale: Im eschatologischen Gerichtskontext bezeichnet das Verb ihr Sich-Erheben beziehungsweise Auferstehen. Die deutsche Form gibt die Zukunft wieder, ohne ausdrücklich festzulegen, ob ein Passiv oder Medium gemeint ist.
- source_word: ἐν τῇ κρίσει
  choice: beim Gericht
  rationale: Die Formulierung bezeichnet das bestimmte eschatologische Gericht und klingt im modernen Deutschen natürlicher als „in dem Gericht“.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: zusammen mit den Männern
  rationale: ἀνήρ ist hier ausdrücklich maskulin; „Männer“ bewahrt diese Bedeutung.
- source_word: τῆς γενεᾶς ταύτης
  choice: dieser Generation
  rationale: γενεά bezeichnet im Zusammenhang die zeitgenössische Generation; „Generation“ ist präzise und geläufig.
- source_word: κατακρινεῖ αὐτούς
  choice: wird sie verurteilen
  rationale: κατακρίνω meint nicht nur urteilen, sondern verurteilen.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: von den Enden der Erde
  rationale: Die bildhafte Wendung für äußerste Ferne bleibt erhalten.
- source_word: ἀκοῦσαι
  choice: um … zu hören
  rationale: Der Aoristinfinitiv drückt hier den Zweck ihres Kommens aus.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: die Weisheit Salomos
  rationale: Die Formulierung folgt der griechischen Struktur und hält die Weisheit als Ziel ihres Kommens im Vordergrund.
- source_word: ἰδοὺ
  choice: siehe
  rationale: „Siehe“ bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter des Diskursmarkers.
- source_word: πλεῖον Σολομῶνος
  choice: etwas, das größer ist als Salomo
  rationale: Das substantivierte Adjektiv steht im Neutrum. „Etwas“ bewahrt diese Form und löst die Aussage nicht vorschnell zu einer rein persönlichen Gegenüberstellung auf.
- source_word: ὧδε
  choice: hier ist
  rationale: Die knappe Ortsangabe wird natürlich und unmittelbar wiedergegeben.
theological_decisions:
- issue: Identität der Königin
  choice: Im Haupttext steht „die Königin des Südens“.
  alternative: „die Königin von Saba“
  rationale: Obwohl die Anspielung auf 1 Könige 10 und 2 Chronik 9 deutlich ist, nennt der griechische Text sie „Königin des Südens“. Die Identifikation wird daher nur in der Fußnote erläutert.
- issue: Bezug von πλεῖον Σολομῶνος
  choice: „etwas, das größer ist als Salomo“
  alternative: „einer, der größer ist als Salomo“
  rationale: Das griechische Neutrum kann über einen unmittelbaren Personenvergleich hinausweisen. Die Übersetzung erhält diese theologische Spannung.
- issue: Bedeutung von ἐγερθήσεται
  choice: „wird … auferstehen“
  alternative: „wird sich erheben“
  rationale: Im endzeitlichen Gerichtskontext ist die Auferstehungsbedeutung naheliegend, während zugleich das Auftreten als Zeugin im Gericht mitschwingt. „Auferstehen“ wahrt den eschatologischen Ernst des Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für gute Lesbarkeit leicht gegliedert; „siehe“ erhält den feierlichen Nachdruck. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar nach der betreffenden Aussage.
