id: LUK.11.1
reference: Luke 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: de
  text: 'Einmal betete er an einem Ort. Nachdem er zu beten aufgehört hatte, sagte einer seiner Jünger zu ihm: »Herr, lehre uns beten, wie auch Johannes seine Jünger gelehrt hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Einmal
  rationale: Die lukanische Einleitungsformel eröffnet ein neues Ereignis. »Einmal« gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne das altertümliche »Und es geschah« nachzuahmen.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: betete er
  rationale: Die Konstruktion bezeichnet eine gleichzeitig andauernde Handlung. Im Deutschen lässt sie sich in Verbindung mit »Einmal« knapp und idiomatisch als erzählerischer Hintergrund ausdrücken.
- source_word: ἐν τόπῳ τινὶ
  choice: an einem bestimmten Ort
  rationale: Die Formulierung bewahrt die beabsichtigte Unbestimmtheit von τις, ohne den Ort näher festzulegen.
- source_word: ὡς ἐπαύσατο
  choice: Als er aufgehört hatte
  rationale: παύομαι bedeutet hier »aufhören« beziehungsweise »innehalten«. Die Übersetzung bleibt näher am Wortlaut als das stärker deutende »als er sein Gebet beendet hatte«; aus dem Kontext ist klar, worauf sich das Aufhören bezieht.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: einer seiner Jünger
  rationale: Die partitive Wendung wird so im Deutschen natürlich und präzise wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: »Herr« wahrt sowohl die respektvolle Anrede als auch die weiterreichende neutestamentliche Bedeutungsbreite des Titels.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: lehre uns beten
  rationale: Die Infinitivkonstruktion wird unmittelbar und ohne den erklärenden Zusatz »wie man« wiedergegeben.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: wie auch Johannes seine Jünger gelehrt hat
  rationale: »wie auch« erhält sowohl den Vergleich durch καθώς als auch die einschließende beziehungsweise ergänzende Kraft von καί.
theological_decisions:
- issue: Wiedergabe von κύριος als Anrede Jesu
  choice: Herr
  alternative: Meister
  rationale: »Herr« bewahrt die im Lukasevangelium mögliche Spannweite zwischen respektvoller Anrede und christologischem Titel, ohne die Stelle auf eine rein pädagogische Anrede festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lukanische Ereignisformel wird idiomatisch verdichtet; die unbestimmte Ortsangabe und die theologische Offenheit der Anrede »Herr« bleiben erhalten.
