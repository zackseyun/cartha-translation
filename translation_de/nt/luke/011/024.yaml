  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: de
  text: 'Wenn der unreine Geist einen Menschen verlassen hat, zieht er durch wasserlose Gegenden[a] und sucht Ruhe. Findet er keine, sagt er: »Ich werde in mein Haus zurückkehren, das ich verlassen habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »trockene Gegenden«. Wörtlich ist von wasserlosen Orten die Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Wenn
  rationale: Leitet mit dem Konjunktiv einen allgemein geltenden zeitlichen Fall ein. »Wenn« ist im Deutschen natürlich und lässt den wiederholbaren Charakter der Aussage offen.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: der unreine Geist
  rationale: Bewahrt die im Neuen Testament geläufige Bezeichnung für einen bösen Geist und den Bedeutungsaspekt kultischer beziehungsweise moralischer Unreinheit.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: aus dem Menschen ausgefahren ist
  rationale: Das Perfekt in der deutschen Wenn-Konstruktion gibt den vollzogenen Austritt vor der folgenden Handlung wieder. »Ausfahren« ist eine verständliche, im biblischen Zusammenhang etablierte Bezeichnung für das Verlassen eines Menschen durch einen Geist.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: zieht er durch wasserlose Gegenden
  rationale: »Zieht durch« gibt die fortgesetzte Bewegung idiomatisch wieder; »wasserlos« bildet ἄνυδρος genauer ab als das allgemeinere »trocken«.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: und sucht Ruhe
  rationale: Gibt das Partizip als beigeordnete Handlung natürlich und knapp wieder, ohne seinen Zweckcharakter festzulegen.
- source_word: καὶ μὴ εὑρίσκον
  choice: Findet er keine
  rationale: »Keine« nimmt die zuvor genannte Ruhe auf. Der eigenständige Satz bewahrt den Ablauf und klingt in modernem Deutsch natürlich.
- source_word: λέγει
  choice: sagt er
  rationale: Bewahrt das anschauliche Präsens des griechischen Textes.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Ich werde in mein Haus zurückkehren
  rationale: »Zurückkehren« gibt den Zukunftsausdruck und die Rückbewegung wieder; »Haus« erhält das konkrete Bild, das im folgenden Vers weitergeführt wird.
- source_word: ὅθεν ἐξῆλθον
  choice: aus dem ich ausgezogen bin
  rationale: Die Formulierung wahrt den Rückbezug auf das Haus und wiederholt das Motiv des Herausgehens in idiomatischem Deutsch.
theological_decisions:
- issue: Wesen des unreinen Geistes
  choice: Als persönlich handelnder »unreiner Geist« wiedergegeben
  alternative: Metapher für moralischen Rückfall oder unpersönliche Kraft
  rationale: Der Text stellt den Geist als handelndes und sprechendes Wesen dar. Die Übersetzung bewahrt diese Darstellung, ohne die Aussage zu allegorisieren oder zu entmythologisieren.
- issue: Wiedergabe von ἀνθρώπου
  choice: dem Menschen
  alternative: einem Mann; einer Person
  rationale: ἄνθρωπος bezeichnet hier einen repräsentativen Menschen. Das deutsche »Mensch« wahrt den Personenbezug und die bestimmte Form, ohne das griechische Wort unnötig auf einen erwachsenen Mann einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt klar markiert; das konkrete Hausbild und die personhafte Darstellung des Geistes werden beibehalten.
