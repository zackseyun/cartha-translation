revisions:
- from: 'Wenn der unreine Geist aus dem Menschen ausgefahren ist, zieht er durch wasserlose Gegenden[a] und sucht Ruhe. Findet er keine, sagt er: »Ich werde in mein Haus zurückkehren, aus dem ich ausgezogen bin.«'
  to: 'Wenn der unreine Geist einen Menschen verlassen hat, zieht er durch wasserlose Gegenden[a] und sucht Ruhe. Findet er keine, sagt er: »Ich werde in mein Haus zurückkehren, das ich verlassen habe.«'
  rationale: Die Revision beseitigt die im Deutschen irreführende Wohnungswechsel-Bedeutung von »ausgezogen« und glättet die traditionelle, aber weniger moderne Wendung »ausgefahren ist«. Die Folge von Verlassen, Umherziehen und Rückkehr sowie die personhafte Darstellung des unreinen Geistes bleiben erhalten. Die Fußnotenmarkierung bleibt unmittelbar an der Wiedergabe von ἀνύδρων τόπων verankert.
