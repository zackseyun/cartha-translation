  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: de
  text: 'Er aber sagte: „Vielmehr glücklich zu preisen sind die, die Gottes Wort hören und bewahren.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja, glücklich zu preisen sind …“ oder: „Ja, vielmehr glücklich zu preisen sind …“ Die griechische Partikel kann bestätigen und zugleich den Akzent neu ausrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Ja, vielmehr
  rationale: Die Partikel bestätigt das Vorherige zumindest teilweise und lenkt zugleich den Akzent neu. „Ja, vielmehr“ bewahrt diese Verbindung von Zustimmung und Korrektur besser als ein rein adversatives „Im Gegenteil“.
- source_word: μακάριοι
  choice: glücklich zu preisen
  rationale: Die Wendung bezeichnet den von Gott her gegebenen, objektiven Zustand des Glücks und vermeidet die rein gefühlsbezogene Bedeutung von „glücklich“ allein.
- source_word: οἱ ἀκούοντες
  choice: die, die … hören
  rationale: Das substantivierte Präsenspartizip bezeichnet Menschen, die durch fortgesetztes beziehungsweise charakteristisches Hören gekennzeichnet sind; die deutsche Formulierung ist natürlich und genau.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: Gottes Wort
  rationale: Die Formulierung wahrt die breite Bedeutung von λόγος als göttliche Rede, Botschaft oder Offenbarung und klingt im modernen Deutsch natürlich und würdig.
- source_word: φυλάσσοντες
  choice: bewahren
  rationale: „Bewahren“ umfasst sowohl das Festhalten als auch das gehorsame Befolgen von Gottes Wort, ohne den Ausdruck auf bloße Regelbefolgung zu verengen.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Er aber sagte
  rationale: „Aber“ gibt den milden Kontrast zum vorangehenden Ausruf wieder; das hervorgehobene αὐτός wird mit „Er“ aufgenommen, ohne im Deutschen eine künstliche Verstärkung einzuführen.
theological_decisions:
- issue: Kraft der Antwort Jesu auf die Seligpreisung der Frau
  choice: 'Jesus bestätigt und korrigiert beziehungsweise steigert zugleich: Entscheidend ist, Gottes Wort zu hören und zu bewahren.'
  alternative: Jesus weist die Aussage der Frau entweder vollständig zurück oder fügt ohne jede Korrektur lediglich eine weitere Seligpreisung hinzu.
  rationale: Μενοῦν kann Zustimmung mit einer Neuausrichtung des Akzents verbinden. „Ja, vielmehr“ lässt offen, in welchem Maß die vorausgehende Aussage bestätigt wird, und vermeidet sowohl eine schroffe Verneinung als auch eine bloße Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich zu preisen“ ist verständlich und bewahrt den gewichtigen Charakter einer Seligpreisung; „bewahren“ lässt sowohl Festhalten als auch gelebten Gehorsam anklingen.
