  variant: modern standard German
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: de
  text: Oder wenn er um ein Ei bittet, wird er ihm etwa einen Skorpion geben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Oder wenn
  rationale: Leitet das nächste parallele Beispiel in der rhetorischen Folge ein. Das καί braucht im Deutschen nicht eigens wiedergegeben zu werden; „Oder wenn“ klingt natürlich und bewahrt den Gedankengang.
- source_word: αἰτήσει
  choice: er um … bittet
  rationale: Das Futur steht in einer konditional gefärbten rhetorischen Frage. Die deutsche Präsensform ist hier idiomatisch; „um ein Ei bitten“ gibt die Bitte präzise wieder.
- source_word: ᾠόν
  choice: ein Ei
  rationale: Direkte und allgemein verständliche Wiedergabe des Akkusativobjekts.
- source_word: ἐπιδώσει
  choice: wird … geben
  rationale: Das Verb bezeichnet hier das Geben als Reaktion auf eine Bitte. „Geben“ ist im Deutschen die natürliche Entsprechung.
- source_word: αὐτῷ
  choice: ihm
  rationale: Gibt das Dativobjekt direkt und idiomatisch wieder.
- source_word: σκορπίον
  choice: einen Skorpion
  rationale: Die übliche konkrete Bedeutung bewahrt den anschaulichen, absurden Gegensatz zum Ei.
theological_decisions:
- issue: Rhetorische Kraft des Vater-Kind-Vergleichs
  choice: Als unmittelbare rhetorische Frage wiedergeben; „etwa“ macht die erwartete Verneinung im Deutschen natürlich erkennbar.
  alternative: Den Gegensatz durch ein zusätzliches „stattdessen“ ausdrücklich machen.
  rationale: Der griechische Text lässt den absurden Gegensatz unausgesprochen. „Etwa“ wahrt die rhetorische Wirkung, ohne den theologischen Schluss über die Güte des Vaters erklärend auszubauen.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Sprachregister. Der Satz ist knapp und mündlich verständlich; die Wortstellung hält die Gegenüberstellung von Ei und Skorpion deutlich.
