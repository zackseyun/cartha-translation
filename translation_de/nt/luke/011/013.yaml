source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: de
  text: Wenn ihr nun, obwohl ihr böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird der Vater vom Himmel her denen den Heiligen Geist geben, die den Vater bitten!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες
  choice: Wenn nun ihr, obwohl ihr böse seid
  rationale: Die konditionale Einleitung und das folgernde οὖν bleiben erhalten. Der Partizipialausdruck wird konzessiv wiedergegeben; das entspricht seinem Sinn im Zusammenhang und klingt im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: οἴδατε ... διδόναι
  choice: zu geben wisst
  rationale: Die Verbindung aus οἴδατε und Infinitiv bezeichnet praktisches Wissen beziehungsweise die Fähigkeit zu geben. „Zu geben wisst“ bildet diese Struktur knapp und idiomatisch ab.
- source_word: δόματα ἀγαθὰ
  choice: gute Gaben
  rationale: δόματα bezeichnet ausdrücklich Gaben oder Geschenke und nicht bloß allgemein „Gutes“. „Gute Gaben“ wahrt den konkreten Sinn und den Kontrast zur größeren Gabe des Vaters.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: euren Kindern
  rationale: „Kinder“ ist in diesem familiären Zusammenhang die natürliche und genaue Wiedergabe von τέκνα.
- source_word: πόσῳ μᾶλλον
  choice: wie viel mehr
  rationale: Dies ist die geläufige deutsche Formulierung für den Schluss vom Kleineren auf das Größere.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: der Vater vom Himmel her
  rationale: Die Wiedergabe bewahrt das lukanische ἐξ οὐρανοῦ und ergänzt weder „euer“ noch harmonisiert sie zu „himmlischer Vater“. „Vom Himmel her“ ist im modernen Deutschen verständlich und lässt die Herkunfts- beziehungsweise Bezugsnuance von ἐξ stehen.
- source_word: πνεῦμα ἅγιον
  choice: den Heiligen Geist
  rationale: Im lukanischen Zusammenhang bezeichnet die Wendung Gottes Geist als die Gabe des Vaters. Artikel und Großschreibung entsprechen dem natürlichen deutschen Sprachgebrauch für diesen bestimmten göttlichen Referenten.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: denen, die ihn bitten
  rationale: Das substantivierte Präsenspartizip wird als fortgeltende Personenbezeichnung wiedergegeben. Das Pronomen „ihn“ bildet das ausdrücklich gesetzte αὐτόν ab und bezieht sich auf den Vater.
theological_decisions:
- issue: Referent von πνεῦμα ἅγιον
  choice: „der Heilige Geist“ als Gottes Geist
  alternative: „ein heiliger Geist“ oder unpersönlich „heiliger Geist“
  rationale: Obwohl die griechische Wortgruppe keinen Artikel trägt, bezeichnet sie in diesem Kontext die besondere Gabe, die der Vater gibt. Die bestimmte deutsche Form gibt den naheliegenden lukanischen Sinn wieder, ohne weitere dogmatische Einzelheiten einzutragen.
- issue: Verhältnis zur Parallele in Matthäus 7,11
  choice: Lukas’ eigene Formulierungen „der Vater vom Himmel her“ und „der Heilige Geist“ bleiben erhalten
  alternative: Harmonisierende Wiedergaben wie „euer himmlischer Vater“ oder „Gutes“
  rationale: Der griechische Lukastext enthält weder ὑμῶν bei „Vater“ noch das allgemeinere „Gutes“ der matthäischen Parallele. Die Übersetzung bewahrt daher die eigenständige Aussage jedes Evangeliums.
- issue: Moralische Charakterisierung der angesprochenen Menschen
  choice: „obwohl ihr böse seid“
  alternative: „da ihr böse seid“ oder eine Abschwächung wie „obwohl ihr unvollkommen seid“
  rationale: 'πονηροί wird nicht abgeschwächt. Die konzessive Fassung wahrt zugleich die argumentative Spannung: Selbst moralisch böse Menschen können ihren Kindern gute Gaben geben.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Vergleichsargument, vermeidet jedoch schwerfällige Partizipien. „Vom Himmel her“ ist bewusst etwas markanter als „himmlisch“, damit Lukas’ besondere Formulierung sichtbar bleibt.
