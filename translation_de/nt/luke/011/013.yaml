revisions:
- from: Wenn nun ihr, obwohl ihr böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird der Vater vom Himmel her[a] denen den Heiligen Geist[b] geben, die ihn bitten!
  to: Wenn ihr nun, obwohl ihr böse seid, euren Kindern gute Gaben zu geben wisst, wie viel mehr wird der Vater vom Himmel her denen den Heiligen Geist geben, die den Vater bitten!
  rationale: Die Revision glättet die einleitende Wortstellung und ersetzt das im Deutschen mehrdeutige Pronomen durch „den Vater“. Dadurch wird der im griechischen Genus eindeutig festgelegte Bezug von αὐτόν erhalten. Die übrige Übersetzung und beide Fußnoten bleiben inhaltlich bestehen; lediglich die Zeichensetzung in Fußnote a wurde für einen vollständigen Vergleichssatz geglättet.
