  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: de
  text: 'Da erwiderte ihm einer der Gesetzesgelehrten[a]: „Lehrer, mit diesen Worten beleidigst du auch uns[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer der Rechtsgelehrten“. Gemeint sind Fachleute für das jüdische Gesetz, nicht Rechtsanwälte im heutigen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „behandelst du auch uns verächtlich“. Das griechische Verb kann neben dem Beleidigen auch ein demütigendes oder verächtliches Behandeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Da erwiderte
  rationale: Die Wendung führt eine Reaktion auf das zuvor Gesagte ein. „Da erwiderte“ gibt sowohl die narrative Weiterführung durch δέ als auch die Antwortfunktion des Partizips natürlich wieder.
- source_word: τις τῶν νομικῶν
  choice: einer der Gesetzeslehrer
  rationale: νομικός bezeichnet hier einen Fachkundigen im jüdischen Gesetz, nicht einen Rechtsanwalt im heutigen beruflichen Sinn. „Gesetzeslehrer“ ist im Deutschen verständlich und kontextgerecht.
- source_word: λέγει αὐτῷ
  choice: erwiderte
  rationale: Das historische Präsens λέγει wird dem natürlichen deutschen Erzählstil entsprechend in der Vergangenheit wiedergegeben; das Dativobjekt ist in „erwiderte“ idiomatisch mitgedacht.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die Anrede bezeichnet Jesus als Lehrenden. „Lehrer“ ist gegenwärtig, klar und weniger missverständlich als „Meister“.
- source_word: ταῦτα λέγων
  choice: wenn du das sagst
  rationale: Die temporale Begleitumstandsangabe wird in natürliches Deutsch übertragen und bezieht sich auf Jesu unmittelbar vorausgehende Worte.
- source_word: καὶ ἡμᾶς
  choice: auch uns
  rationale: 'καί hat additive Bedeutung: Der Sprecher zählt die Gesetzeslehrer zu den ebenfalls Betroffenen.'
- source_word: ὑβρίζεις
  choice: beleidigst
  rationale: Das Verb bezeichnet hier ein ehrverletzendes, verächtliches Behandeln durch Worte. „Beleidigen“ trifft im Deutschen den unmittelbaren Redezusammenhang, ohne die Aussage zum bloßen Anstoßnehmen abzuschwächen.
