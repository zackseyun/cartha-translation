id: LUK.11.23
reference: Luke 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: de
  text: Wer nicht mit mir ist, ist gegen mich, und wer nicht mit mir sammelt, zerstreut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: wer nicht … ist
  rationale: Der substantivierte Ausdruck bezeichnet allgemein jede Person, die nicht mit Jesus verbunden beziehungsweise auf seiner Seite ist. Die deutsche Konstruktion mit „wer“ gibt diesen generischen Sinn natürlich und ohne altertümlichen Klang wieder.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: μετά mit Genitiv bezeichnet hier Zugehörigkeit oder gemeinsames Handeln. „Mit mir“ bewahrt sowohl die schlichte Form als auch die Aussage über die Ausrichtung auf Jesus.
- source_word: κατ’ ἐμοῦ
  choice: gegen mich
  rationale: κατά mit Genitiv drückt Gegensatz oder Gegnerschaft aus. „Gegen mich“ bildet den klaren, im Griechischen angelegten Kontrast zu „mit mir“.
- source_word: συνάγων
  choice: sammelt
  rationale: Das Verb bezeichnet das Zusammenbringen oder Sammeln. „Sammelt“ ist knapp, anschaulich und erhält den metaphorischen Gegensatz zu „zerstreut“.
- source_word: σκορπίζει
  choice: zerstreut
  rationale: σκορπίζω bedeutet auseinanderstreuen oder zerstreuen. „Zerstreut“ wahrt die bildhafte Antithese zu „sammelt“.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Aussagen schlicht miteinander; „und“ erhält diese Koordination.
theological_decisions:
- issue: Ausschluss einer neutralen Haltung gegenüber Jesus
  choice: 'Die Aussage bleibt in ihrer absoluten, zugespitzten Form stehen: Wer nicht mit Jesus ist, ist gegen ihn.'
  alternative: Die Aussage als bloßes Fehlen aktiver Unterstützung abschwächen oder ausschließlich auf die unmittelbar vorausgehende Auseinandersetzung über Dämonenaustreibung begrenzen.
  rationale: Der griechische Wortlaut formuliert einen scharfen Gegensatz. Die Übersetzung bewahrt diese Spannung, ohne daraus zusätzliche dogmatische Folgerungen abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und prägnantem Ton. Der Parallelismus sowie die Gegensätze „mit mir/gegen mich“ und „sammelt/zerstreut“ bleiben erhalten.
