source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: de
  text: Dann geht er hin und nimmt sieben andere Geister mit, die böser sind als er selbst[a]. Nachdem sie hineingegangen sind, wohnen sie dort[b]. Danach geht es diesem Menschen schlimmer als zuvor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die schlimmer sind als er selbst“. Das griechische Wort kann moralische Bosheit oder allgemein Schlechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „Geister“, nicht ausdrücklich „Dämonen“ oder „unreine Geister“. Auf das pluralische „nachdem sie hineingegangen sind“ folgt jedoch ein Verb im Singular („wohnt“); gemeint sein kann der zurückkehrende Geist oder die Gruppe als Einheit.
    reason: textual_grammar
  - marker: c
    text: 'Wörtlicher: „Und der spätere Zustand jenes Menschen wird schlimmer als der frühere.“'
    reason: literal_rendering
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Der zeitliche Anschluss markiert die nächste Handlung in der Erzählfolge; „Dann“ ist im Deutschen knapp und natürlich.
- source_word: πορεύεται
  choice: geht er hin
  rationale: Das Verb bezeichnet hier eine Ortsbewegung. Das grammatische Maskulinum richtet sich im Deutschen nach „der Geist“ aus dem Zusammenhang.
- source_word: παραλαμβάνει
  choice: nimmt … mit
  rationale: 'Die Wendung gibt den begleitenden Sinn des Verbs wieder: Der Geist nimmt weitere Geister mit sich.'
- source_word: ἕτερα πνεύματα
  choice: andere Geister
  rationale: „Andere“ ist die naheliegende Wiedergabe; „Geister“ übersetzt das Substantiv ohne die im Vers nicht ausdrücklich wiederholte Bezeichnung „Dämonen“ oder „unreine Geister“ einzufügen.
- source_word: πονηρότερα ἑαυτοῦ
  choice: die böser sind als er selbst
  rationale: „Böser“ bewahrt den moralisch-feindlichen Sinn des Komparativs. Das deutsche Pronomen folgt dem grammatischen Geschlecht von „Geist“; verglichen werden die sieben Geister mit dem zurückkehrenden Geist.
- source_word: ἑπτά
  choice: sieben
  rationale: Die Kardinalzahl wird direkt wiedergegeben.
- source_word: εἰσελθόντα
  choice: Nachdem sie eingezogen sind
  rationale: Die vorzeitige Formulierung bildet das Aoristpartizip ab und bezieht dessen Neutrum Plural auf die Geister.
- source_word: κατοικεῖ ἐκεῖ
  choice: wohnen sie dort
  rationale: „Wohnen“ gibt den dauerhaften Aufenthalt wieder. Der deutsche Plural folgt dem inhaltlichen Bezug auf die eingezogenen Geister; die auffällige Singularform des griechischen Verbs wird in einer Fußnote ausgewiesen.
- source_word: γίνεται τὰ ἔσχατα … χείρονα τῶν πρώτων
  choice: am Ende geht es … schlimmer als am Anfang
  rationale: Die idiomatische deutsche Formulierung vermittelt den Gegensatz zwischen dem späteren und dem früheren Zustand, ohne ein unnatürliches „die letzten Dinge“ zu erzeugen.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: diesem Menschen
  rationale: „Mensch“ bezeichnet die konkrete Person in Jesu Vergleich und entspricht dem griechischen Ausdruck natürlich, ohne unnötig männlich zu spezifizieren.
theological_decisions:
- issue: Bezeichnung der feindlichen Geister
  choice: Geister
  alternative: Dämonen / unreine Geister
  rationale: Der Zusammenhang spricht von einem unreinen Geist, doch dieser Vers selbst hat nur πνεύματα. Die Übersetzung fügt daher keine ausdrücklich fehlende Bezeichnung ein; „böser“ macht den feindlichen Charakter deutlich.
- issue: Numerus bei κατοικεῖ
  choice: wohnen sie
  alternative: wohnt er / wohnt es
  rationale: Das unmittelbar vorausgehende Partizip εἰσελθόντα steht im Plural und bezieht sich auf die Geister. Die singularische Verbform bleibt textlich auffällig und kann kollektiv oder auf den zurückkehrenden Geist bezogen verstanden werden; diese Spannung wird durch eine Fußnote offengelegt.
- issue: Wiedergabe des abschließenden Zustandsvergleichs
  choice: am Ende geht es diesem Menschen schlimmer als am Anfang
  alternative: Der spätere Zustand dieses Menschen wird schlimmer als der frühere
  rationale: Die idiomatische Fassung wahrt den Vergleich der Zustände und vermeidet eine schwerfällige Substantivierung. Sie legt nicht fest, worin der schlimmere Zustand genau besteht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Sätze verdeutlichen die Handlungsfolge. „Geist“ wird nach deutscher Grammatik maskulin aufgenommen; daraus folgt keine Aussage über ein biologisches Geschlecht. Die abschließende idiomatische Wendung bewahrt den Zustandsvergleich, ohne die Aussage theologisch auszudeuten.
