  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: de
  text: Während er noch redete, bat ihn ein Pharisäer, bei ihm zu essen. Da ging er hinein und legte sich zu Tisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei Mahlzeiten nahm man damals gewöhnlich liegend oder zurückgelehnt Platz.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Während er noch redete
  rationale: Die Konstruktion ἐν + substantivierter Infinitiv bezeichnet Gleichzeitigkeit. „Während er noch redete“ gibt den fortdauernden zeitlichen Zusammenhang natürlich wieder; „noch“ ist im Deutschen idiomatisch, ohne einen neuen Sachinhalt einzuführen.
- source_word: ἐρωτᾷ
  choice: bat
  rationale: Das Verb bedeutet hier „bitten/ersuchen“. Das erzählende Präsens kann im natürlichen deutschen Erzählstil als Präteritum wiedergegeben werden; der Inhalt der Bitte ergibt sich aus dem folgenden Finalsatz.
- source_word: Φαρισαῖος
  choice: ein Pharisäer
  rationale: Übliche deutsche Bezeichnung der religiösen Gruppierung; der artikellose Singular wird natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: ὅπως ἀριστήσῃ
  choice: zu essen
  rationale: ἀριστάω kann eine frühere Tagesmahlzeit, insbesondere Frühstück oder Mittagsmahl, bezeichnen. „zu essen“ vermeidet eine im Kontext nicht gesicherte Festlegung auf die Tageszeit.
- source_word: παρ’ αὐτῷ
  choice: bei ihm
  rationale: Die Wendung bedeutet hier „bei/mit ihm“ und lässt den genauen Ort implizit. „Bei ihm“ bewahrt diese Zurückhaltung besser als die ausdrückliche Ergänzung „in seinem Haus“.
- source_word: εἰσελθὼν δὲ
  choice: Da ging er hinein
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Ein selbstständiger deutscher Satz gibt die Abfolge klar und idiomatisch wieder.
- source_word: ἀνέπεσεν
  choice: legte sich zu Tisch
  rationale: ἀναπίπτω bezeichnet im antiken Mahlkontext das Niederlegen beziehungsweise Zurücklehnen zum Essen. Die deutsche Wendung bewahrt die historische Körperhaltung, ohne bloßes Sitzen zu suggerieren.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens des Griechischen wird entsprechend üblicher deutscher Narration im Präteritum wiedergegeben. Die Mahlzeit wird zeitlich nicht genauer bestimmt, und der nur implizierte Aufenthaltsort wird nicht zu „Haus“ konkretisiert.
