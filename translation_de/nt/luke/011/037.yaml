  verdict: revise
  source_fidelity: Der deutsche Text gibt die zeitliche Einleitung, die Bitte des Pharisäers, die nicht näher bestimmte Wendung „bei ihm“ sowie die Abfolge von Eintreten und Niederlegen zum Mahl sachgerecht wieder. Das Präteritum für das griechische historische Präsens ist im deutschen Erzählstil vertretbar. „Legte sich zu Tisch“ trifft ἀνέπεσεν im Mahlkontext besser als ein bloßes „setzte sich“.
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch. „Während er noch redete“ und „Da ging er hinein“ sind flüssig; der leicht gehobene Ausdruck „legte sich zu Tisch“ wird durch die Anmerkung verständlich gemacht.
  terminology: „Pharisäer“ ist die übliche Bezeichnung. „Bei ihm“ wahrt die im Griechischen nicht ausdrücklich genannte Ortsangabe. Die Fußnote sollte jedoch nicht von einem „förmlichen Essen“ sprechen, weil die Versquelle das Mahl nicht als formell qualifiziert.
