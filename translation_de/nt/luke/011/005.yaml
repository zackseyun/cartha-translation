  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Wer von euch, der einen Freund hat, wird um Mitternacht zu ihm gehen und zu ihm sagen: ‚Freund, leih mir drei Brote[a],‘“'
