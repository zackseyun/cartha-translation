    text: 'Oder: „Wer von euch hat einen Freund und geht um Mitternacht zu ihm und sagt zu ihm: ‚Freund, leih mir drei Brote‘,“ Im Griechischen stehen in der rhetorischen Frage Zukunftsformen, die im Deutschen auch idiomatisch im Präsens wiedergegeben werden können.'
