lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Wer von euch
  rationale: Die natürliche deutsche Einleitung einer direkt an die Zuhörer gerichteten rhetorischen Frage.
- source_word: ἕξει
  choice: wird einen Freund haben
  rationale: Bewahrt den griechischen Futur Indikativ und die etwas zugespitzte Form der rhetorischen Frage.
- source_word: φίλον / Φίλε
  choice: Freund
  rationale: Gibt sowohl das Substantiv als auch die Anrede gleich wieder und erhält so die Wiederholung des griechischen Ausdrucks.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: zu ihm gehen
  rationale: Schlichte und natürliche Wiedergabe der Bewegung auf den Freund zu.
- source_word: μεσονυκτίου
  choice: um Mitternacht
  rationale: Der adverbial gebrauchte Genitiv bezeichnet den Zeitpunkt; „um Mitternacht“ ist im Deutschen direkt und idiomatisch.
- source_word: εἴπῃ αὐτῷ
  choice: zu ihm sagen
  rationale: Entspricht λέγω eng und fügt sich natürlich in die deutsche Satzfolge ein.
- source_word: χρῆσόν μοι
  choice: leih mir
  rationale: Der Imperativ bittet im Kontext um eine vorübergehende Überlassung; „leih mir“ ist die natürliche deutsche Entsprechung.
- source_word: τρεῖς ἄρτους
  choice: drei Brote
  rationale: ἄρτοι bezeichnet zählbare Brotlaibe; im Deutschen ist „drei Brote“ die natürliche, knappe Wiedergabe.
