  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: de
  text: Als er von dort weggegangen war, begannen die Schriftgelehrten und die Pharisäer, ihn heftig zu bedrängen und ihn über vieles auszufragen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihm Äußerungen zu vielen Themen zu entlocken« beziehungsweise »ihn zu spontanen Antworten zu drängen«. Das seltene griechische Verb deutet darauf hin, dass sie ihn aggressiv zu Antworten drängten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Als er von dort weggegangen war
  rationale: Die zeitlich-räumliche Angabe und der Genitivus absolutus werden in natürlichem Deutsch als vorzeitiger Nebensatz wiedergegeben.
- source_word: ἤρξαντο
  choice: begannen
  rationale: Gibt den ingressiven Sinn von ἄρχομαι mit den folgenden Infinitiven direkt wieder.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Etablierte und sachlich passende deutsche Bezeichnung für die mit der Auslegung religiöser Schriften und des Gesetzes befasste Gruppe.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche deutsche Wiedergabe des Gruppennamens.
- source_word: δεινῶς ἐνέχειν
  choice: ihn heftig zu bedrängen
  rationale: Die Verbindung bezeichnet ein starkes, feindseliges Zusetzen; die Formulierung bewahrt Intensität und zwischenmenschlichen Druck.
- source_word: ἀποστοματίζειν αὐτὸν
  choice: ihn auszufragen
  rationale: Das seltene Verb bezeichnet hier wohl ein aggressives Herauslocken spontaner Antworten. „Ausfragen“ ist natürlich und wahrt, zusammen mit dem Kontext, den konfrontativen Zug.
- source_word: περὶ πλειόνων
  choice: über vieles
  rationale: Das substantivierte Komparativ-/Pluralgefüge bezieht sich idiomatisch auf zahlreiche Themen oder Angelegenheiten, nicht zwingend auf einen ausdrücklichen Vergleich.
