id: LUK.11.21
reference: Luke 11:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: de
  text: Wenn der Starke, voll bewaffnet, seinen eigenen Hof[a] bewacht, ist sein Besitz in Sicherheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein eigenes Anwesen“ beziehungsweise „seinen eigenen Palast“. Das griechische Wort kann einen Hof oder auch den dazugehörigen Wohn- und Anwesenbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ist sein Besitz in Frieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Wenn
  rationale: Leitet ein allgemein gültiges zeitlich-bedingtes Szenario ein; „wenn“ ist im Deutschen natürlich und prägnant.
- source_word: ὁ ἰσχυρός
  choice: der Starke
  rationale: Das substantivierte maskuline Adjektiv bezeichnet einen starken Mann; „der Starke“ bewahrt die knappe Bildsprache, ohne die Person im Vers ausdrücklich zu deuten.
- source_word: καθωπλισμένος
  choice: voll bewaffnet
  rationale: Das Perfektpartizip beschreibt den fortdauernden Zustand vollständiger Ausrüstung.
- source_word: φυλάσσῃ
  choice: bewacht
  rationale: Gibt die andauernde Tätigkeit des Wachens und Sicherns im ὅταν-Satz unmittelbar wieder.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: seinen eigenen Hof
  rationale: αὐλή kann einen Hof sowie den dazugehörigen Wohn- oder Anwesenbereich bezeichnen; „Hof“ ist direkt und lässt die genaue Ausdehnung offen. „eigenen“ bildet die Betonung durch ἑαυτοῦ ab.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: ist in Sicherheit
  rationale: Die wörtliche Wendung „ist in Frieden“ bezeichnet hier den ungestörten, sicheren Zustand des Besitzes; die idiomatische Wiedergabe ist im Deutschen verständlich.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: sein Besitz
  rationale: Die substantivierte Form bezeichnet das, was ihm gehört; der kollektive Singular „Besitz“ ist natürlich und umfassend.
theological_decisions:
- issue: Metaphorische Bedeutung des Starken im Kontext
  choice: Das Bild wird ohne ausdrückliche Identifizierung wiedergegeben.
  alternative: „der Satan“ oder eine andere Deutung direkt in den Vers einsetzen
  rationale: Der Vers selbst entfaltet zunächst das Bild; der Zusammenhang liefert dessen Deutung. Eine ausdrückliche Identifizierung im Haupttext würde die metaphorische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Bildwort, während „in Sicherheit“ die idiomatische Bedeutung von ἐν εἰρήνῃ natürlich ausdrückt.
