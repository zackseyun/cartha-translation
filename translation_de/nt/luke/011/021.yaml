  source_fidelity: 'Der deutsche Text gibt die syntaktische und bildhafte Aussage des Griechischen zuverlässig wieder: ὅταν als allgemeines „Wenn“, ὁ ἰσχυρός als „der Starke“, das resultative Perfektpartizip καθωπλισμένος als „voll bewaffnet“, φυλάσσῃ als „bewacht“ und τὰ ὑπάρχοντα als „Besitz“. „In Sicherheit“ trifft den idiomatischen Sinn von ἐν εἰρήνῃ in diesem Zusammenhang, ohne eine weitergehende Deutung einzutragen.'
  naturalness: „Wenn der Starke, voll bewaffnet, seinen eigenen Hof bewacht, ist sein Besitz in Sicherheit“ ist flüssiges, modernes Standarddeutsch mit angemessen würdigem Register. Die knappe Bezeichnung „der Starke“ bewahrt die Bildsprache und ist im Kontext verständlich.
  terminology: „Hof“ ist als direkte, bewusst offene Wiedergabe von αὐλή vertretbar; die Fußnote nennt sachgerecht die möglichen Bedeutungsbereiche Anwesen und Palast. „Besitz“ gibt die kollektive Bedeutung von τὰ ὑπάρχοντα natürlich wieder. Die metaphorische Figur wird nicht konfessionell oder interpretativ festgelegt.
