  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: de
  text: 'und er antwortet von drinnen: »Mach mir keine Umstände.[a] Die Tür ist schon geschlossen,[b] und meine Kinder liegen bei mir im Bett.[c] Ich kann nicht aufstehen und dir etwas geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Belästige mich nicht weiter« oder »Mach mir keinen Ärger«. Die griechische Wendung spricht wörtlich davon, jemandem Mühen zu bereiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Die Tür wurde schon geschlossen.« Das griechische Perfekt kann sowohl die abgeschlossene Handlung als auch den daraus entstandenen Zustand hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der gemeinsame Schlafplatz der Familie; die Formulierung hat hier keinen sexuellen Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: und er von drinnen antwortet
  rationale: Die Wendung führt die Erzählung fort und bezeichnet den drinnen befindlichen Freund. Das idiomatische deutsche »antwortet« gibt die griechische Doppelformel ἀποκριθεὶς εἴπῃ natürlich wieder, ohne ihren Sinn zu verändern.
- source_word: Μή μοι κόπους πάρεχε
  choice: Mach mir keine Mühe
  rationale: Die griechische idiomatische Wendung bedeutet, jemandem Mühe, Beschwerde oder Umstände zu bereiten. Die gewählte Formulierung ist knapp, gegenwärtig und wahrt das Bild von κόπους.
- source_word: ἡ θύρα κέκλεισται
  choice: Die Tür ist schon geschlossen
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis. Im Deutschen bringt die Zustandsform »ist geschlossen« dieses gegenwärtige Ergebnis natürlich zum Ausdruck, ohne ein Abschließen mit Schlüssel zu behaupten.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: meine Kinder liegen bei mir im Bett
  rationale: κοίτη bezeichnet hier den gemeinsamen Schlafplatz. »liegen« ist im Deutschen die natürliche Ergänzung für den im Griechischen mit εἰσίν ausgedrückten Zustand.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Ich kann nicht aufstehen und dir etwas geben
  rationale: Das Partizip ἀναστὰς bezeichnet das zum Geben erforderliche Aufstehen. »etwas« macht das im Deutschen kontextuell erforderliche, im Griechischen unausgesprochene Objekt verständlich und verweist auf die zuvor erbetenen Brote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem parabolischem Erzählfluss. Der Wechsel ins Präsens entspricht dem griechischen εἴπῃ innerhalb des hypothetischen Beispiels. Direkte Rede ist klar und alltagsnah, ohne umgangssprachlich zu werden.
