  source_fidelity: 'Der Sinn des griechischen Textes wird insgesamt treffend wiedergegeben: die Antwort kommt von innen, die Tür befindet sich bereits im geschlossenen Zustand, die Kinder teilen den Schlafplatz, und das Aufstehen ist die Voraussetzung für das Geben. Das ergänzte »etwas« ist im Deutschen wegen des im Kontext vorausgesetzten Gegenstands vertretbar. Die bisherige Wiedergabe von Μή μοι κόπους πάρεχε ist jedoch im Deutschen missverständlich: »Mach mir keine Mühe« bedeutet gewöhnlich, dass jemand sich nicht für den Sprecher anstrengen solle, statt ihn nicht zu belästigen.'
