  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: de
  text: denn ein Freund von mir ist von einer Reise[a] zu mir gekommen, und ich habe nichts, was ich ihm vorsetzen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom Weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: denn
  rationale: Die Konjunktion begründet innerhalb der wörtlichen Rede die Bitte; „denn“ klingt im modernen Deutschen natürlich und wahrt den kausalen Zusammenhang.
- source_word: φίλος μου
  choice: ein Freund von mir
  rationale: Die Wiedergabe erhält die indefinite Ausdrucksweise des artikellosen φίλος und ist im Deutschen idiomatisch.
- source_word: παρεγένετο
  choice: ist … gekommen
  rationale: Der Aorist von παραγίνομαι bezeichnet hier das Eintreffen; das deutsche Perfekt bringt natürlich zum Ausdruck, dass der Freund angekommen und noch anwesend ist.
- source_word: ἐξ ὁδοῦ
  choice: von einer Reise
  rationale: Wörtlich steht „vom Weg“; im Kontext bezeichnet die Wendung das Unterwegssein beziehungsweise eine Reise. Die idiomatische Wiedergabe vermeidet im Haupttext eine missverständliche räumliche Lesart.
- source_word: πρός με
  choice: zu mir
  rationale: Dies bildet die Bewegung auf den Sprecher zu genau ab, ohne „Haus“ oder „Besuch“ ausdrücklich hinzuzufügen.
- source_word: οὐκ ἔχω
  choice: ich habe nichts
  rationale: Die knappe deutsche Form entspricht der verneinten Besitzangabe.
- source_word: ὃ παραθήσω αὐτῷ
  choice: was ich ihm vorsetzen kann
  rationale: παρατίθημι bezeichnet im Zusammenhang der Gastfreundschaft das Vorsetzen von Speise. „Vorsetzen“ bewahrt dieses Bild; „kann“ gibt den im griechischen deliberativen Konjunktiv liegenden praktischen Sinn natürlich wieder.
