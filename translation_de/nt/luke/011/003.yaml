  language: de
  text: Gib uns jeden Tag unser tägliches Brot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unser Brot für den kommenden Tag“ oder „unser zum Leben nötiges Brot“; weniger wahrscheinlich ist hier „unser überwesentliches Brot“. Das griechische Adjektiv ist äußerst selten und in seiner Bedeutung umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: Brot
  rationale: Das Substantiv bezeichnet wörtlich „Brot“ und kann zugleich für den grundlegenden Lebensunterhalt stehen. „Brot“ bewahrt das konkrete Bild und die traditionelle Gebetssprache.
- source_word: ἡμῶν
  choice: das wir brauchen
  rationale: Das Besitzverhältnis von „unser“ wird zusammen mit ἐπιούσιον idiomatisch als Relativsatz wiedergegeben; dadurch wird im Deutschen eine schwerfällige Häufung von „unser“ und „uns“ vermieden.
- source_word: ἐπιούσιον
  choice: das wir brauchen
  rationale: Das äußerst seltene und umstrittene Adjektiv kann das für den Lebensunterhalt nötige Brot bezeichnen. Diese natürliche deutsche Formulierung vermeidet außerdem die tautologische Wiedergabe „jeden Tag unser tägliches Brot“, ohne die anderen möglichen Bedeutungen zu verschweigen.
- source_word: δίδου
  choice: Gib
  rationale: Der Präsensimperativ kann fortgesetztes oder wiederholtes Geben ausdrücken. „Gib“ ist im Deutschen idiomatisch; der wiederholte Aspekt erscheint ausdrücklich in „jeden Tag“.
- source_word: ἡμῖν
  choice: uns
  rationale: Direkte und natürliche Wiedergabe des indirekten Objekts.
- source_word: τὸ καθ’ ἡμέραν
  choice: jeden Tag
  rationale: Die Wendung bezeichnet die wiederholte Versorgung Tag für Tag. „Jeden Tag“ ist klar und gegenwartssprachlich.
theological_decisions:
- issue: Bedeutung von ἐπιούσιον im Vaterunser
  choice: das wir brauchen
  alternative: täglich; für den kommenden Tag; zum Leben nötig; überwesentlich
  rationale: Das Adjektiv ist lexikalisch umstritten. Lukas’ Zusatz τὸ καθ’ ἡμέραν betont die tägliche, wiederholte Versorgung, legt die genaue Bedeutung des Adjektivs aber nicht abschließend fest. Der Haupttext wählt eine verständliche Lesart; die Fußnote bewahrt die echte Mehrdeutigkeit und vermeidet eine unmarkierte sakramentale oder metaphysische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der Relativsatz klingt natürlicher als „jeden Tag unser tägliches Brot“ und macht die gewählte Deutung transparent; die Fußnote dokumentiert die nicht auflösbare lexikalische Unsicherheit.
