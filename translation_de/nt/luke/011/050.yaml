id: LUK.11.50
reference: Luke 11:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: de
  text: damit das Blut aller Propheten, das seit Grundlegung der Welt vergossen worden ist, von dieser Generation gefordert wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Diese Generation wird für das vergossene Blut zur Rechenschaft gezogen.'
    reason: Die Fußnote erläutert den gerichtlichen Sinn von ἐκζητηθῇ, ohne die bildhafte Formulierung im Haupttext aufzulösen.
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet im Zusammenhang einen Zweck- bzw. Folgesatz ein und gibt die finale Kraft natürlich wieder.
- source_word: ἐκζητηθῇ
  choice: gefordert wird
  rationale: Das passive Verb hat hier im Zusammenhang mit vergossenem Blut den gerichtlichen Sinn, jemanden dafür zur Rechenschaft zu ziehen. Die Formulierung bewahrt zugleich das biblische Bild, dass das Blut eingefordert wird.
- source_word: τὸ αἷμα πάντων τῶν προφητῶν
  choice: das Blut aller Propheten
  rationale: Die wörtliche und im Deutschen verständliche Wiedergabe bewahrt die metonymische Rede vom Blut der getöteten Propheten sowie den umfassenden Sinn von πάντων.
- source_word: τὸ ἐκκεχυμένον
  choice: das … vergossen worden ist
  rationale: Das Perfektpartizip bezeichnet Blut, das infolge gewaltsamer Tötung vergossen worden ist; die finite Relativkonstruktion klingt im Deutschen natürlich und wahrt den resultativen Aspekt.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: seit Grundlegung der Welt
  rationale: Die etablierte biblische Wendung gibt den zeitlichen Ausgangspunkt präzise und würdig wieder.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: von dieser Generation
  rationale: Das wiederholte ἀπό bezeichnet hier die Instanz, von der Rechenschaft gefordert wird. „Von“ erhält die Konstruktion und vermeidet eine überdeutende Ergänzung.
theological_decisions:
- issue: Gerichtliche Bedeutung des Einforderns prophetischen Blutes
  choice: Das Blut wird von dieser Generation gefordert.
  alternative: Diese Generation wird für das Blut zur Rechenschaft gezogen.
  rationale: Die gewählte Fassung erhält das konkrete Bild und den gerichtlichen Nachdruck des griechischen Textes, ohne die genaue Art kollektiver Verantwortlichkeit dogmatisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Grundlegung der Welt“ bewahrt die biblische Ausdrucksweise; „Generation“ ist im heutigen Deutsch klarer und semantisch näher als das teils missverständliche „Geschlecht“.
