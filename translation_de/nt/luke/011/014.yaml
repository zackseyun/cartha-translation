  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: de
  text: Er trieb einen stummen Dämon aus.[a] Als der Dämon ausgefahren war, sprach der Mann, der stumm war, und die Menschenmengen staunten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen tauben Dämon“. Das griechische Wort kann „taub“ oder „stumm“ bedeuten; weil der Mann nach dem Ausfahren des Dämons spricht, ist hier wahrscheinlich „stumm“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: er trieb gerade … aus
  rationale: Die periphrastische Imperfektform bezeichnet eine im Verlauf befindliche Handlung in der Vergangenheit; „gerade“ macht diesen Aspekt im Deutschen natürlich deutlich.
- source_word: δαιμόνιον
  choice: Dämon
  rationale: δαιμόνιον bezeichnet hier unmittelbar einen Dämon; „unreiner Geist“ würde eine in diesem Vers nicht vorhandene Formulierung eintragen.
- source_word: κωφόν
  choice: der stumm machte
  rationale: κωφός kann „taub“ oder „stumm“ bedeuten. Da der Betroffene nach dem Ausfahren des Dämons spricht, steht hier die Stummheit im Vordergrund. Die attributive Wendung bezieht das Adjektiv natürlich auf die Wirkung des Dämons.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Als der Dämon ausgefahren war
  rationale: Die deutsche temporale Konstruktion gibt die abgeschlossene, der Haupthandlung vorausgehende Handlung des Genitivus absolutus wieder; das formelhafte ἐγένετο δέ muss nicht eigens mit „es geschah aber“ abgebildet werden.
- source_word: ἐλάλησεν
  choice: sprach
  rationale: Die schlichte Wiedergabe entspricht λαλέω; „begann zu sprechen“ wäre eine unnötige Ausdeutung.
- source_word: ὁ κωφός
  choice: der Mann, der stumm gewesen war
  rationale: Das substantivierte Adjektiv bezeichnet den betroffenen Menschen. Die Formulierung vermeidet die potenziell etikettierende Bezeichnung „der Stumme“ und zeigt zugleich, dass die Stummheit nun behoben ist.
- source_word: ἐθαύμασαν
  choice: staunten
  rationale: „Staunten“ gibt die von θαυμάζω bezeichnete verwunderte Bewunderung natürlich und würdig wieder.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Die Pluralform bleibt erhalten; „Menschenmengen“ ist im modernen Deutsch verständlicher als „Volksscharen“ und genauer als der Singular „die Menge“.
theological_decisions:
- issue: Art des Leidens und Sprache der Dämonenaustreibung
  choice: Der Vers wird als Bericht von einem wirklichen Dämon wiedergegeben, dessen Ausfahren zur Wiederherstellung der Sprache führt.
  alternative: Eine rein phänomenologische Wiedergabe oder die Vermeidung der ausdrücklich übernatürlichen Aussage.
  rationale: Der griechische Text nennt ausdrücklich ein δαιμόνιον und verbindet dessen Ausfahren erzählerisch mit dem anschließenden Sprechen des zuvor stummen Menschen. Diese Aussage ist ohne Abschwächung oder zusätzliche Erklärung zu bewahren.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. „Ausfahren“ bewahrt die vertraute biblische Ausdrucksweise für das Verlassen eines Menschen durch einen Dämon, ohne altertümlich unverständlich zu sein. Die Wiederholung von „Dämon“ und die abschließende Satzverbindung mit „Und“ spiegeln die schlichte narrative Struktur des Griechischen.
