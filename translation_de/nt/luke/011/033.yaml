  to: Niemand zündet eine Lampe an und stellt sie dann weder in ein Versteck[a] noch unter ein Messgefäß[b], sondern auf den Lampenständer, damit die, die hereinkommen, das Licht sehen.
  rationale: Die Revision ersetzt die missverständliche Koordination mit „oder“ durch die dem griechischen οὐδέ entsprechende Doppelnegation „weder ... noch“ und glättet die Bezeichnung der eintretenden Personen. Außerdem wird die Präposition in Fußnote a an die Bewegungsrichtung von εἰς angepasst. Bedeutung, Bildsprache und lexikalische Offenheit des Ausgangstextes bleiben erhalten.
