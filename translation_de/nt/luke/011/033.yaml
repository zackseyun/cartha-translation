id: LUK.11.33
reference: Luke 11:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: de
  text: Niemand zündet eine Lampe an und stellt sie dann weder in ein Versteck[a] noch unter ein Messgefäß[b], sondern auf den Lampenständer, damit die, die hereinkommen, das Licht sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in einen Kellerraum“ oder „in einen verborgenen Ort“. Das griechische Wort κρύπτη kann einen versteckten Ort bezeichnen, auch einen unterirdischen Vorratsraum.
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch μόδιος: ein Hohlmaß beziehungsweise das dazu verwendete Messgefäß; traditionell „Scheffel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Niemand
  rationale: Die natürliche deutsche Entsprechung bewahrt die uneingeschränkte Verneinung.
- source_word: λύχνον
  choice: eine Lampe
  rationale: Gemeint ist eine tragbare Öllampe, nicht eine Kerze.
- source_word: ἅψας
  choice: zündet … an und … dann
  rationale: Die vorzeitige Handlung des Aoristpartizips wird in natürlichem Deutsch als zeitliche Abfolge wiedergegeben.
- source_word: εἰς κρύπτην
  choice: in ein Versteck
  rationale: κρύπτη bezeichnet einen verborgenen Ort und kann auch einen Keller- oder Vorratsraum meinen; „Versteck“ hält den Schwerpunkt auf dem Verbergen.
- source_word: ὑπὸ τὸν μόδιον
  choice: unter ein Messgefäß
  rationale: μόδιος ist ein Hohlmaß und zugleich das entsprechende Messgefäß. „Messgefäß“ gibt Funktion und Gegenstand verständlich wieder, ohne ein nichtgriechisches Maß einzutragen.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: auf den Lampenständer
  rationale: λυχνία bezeichnet ausdrücklich einen Ständer für Lampen; der bestimmte Artikel des griechischen Textes bleibt erhalten.
- source_word: οἱ εἰσπορευόμενοι
  choice: die Hereinkommenden
  rationale: Das substantivierte Präsenspartizip bezeichnet die Personen, die hereinkommen.
- source_word: τὸ φέγγος
  choice: das Licht
  rationale: Im konkreten Bild einer Lampe ist „Licht“ die natürliche Wiedergabe von φέγγος.
- source_word: βλέπωσιν
  choice: sehen
  rationale: Im mit ἵνα eingeleiteten Zwecksatz drückt der deutsche Indikativ idiomatisch den beabsichtigten Zweck aus.
theological_decisions:
- issue: Bedeutung von κρύπτη
  choice: allgemein „Versteck“
  alternative: „Keller“, „Vorratsraum“ oder „verborgener Ort“
  rationale: Der Aussage geht es um das widersinnige Verbergen des Lichts; die Übersetzung soll den Ort nicht unnötig architektonisch festlegen.
- issue: Wiedergabe von μόδιος
  choice: „Messgefäß“ im Haupttext
  alternative: „Hohlmaß“, „Scheffel“ oder „Korb“
  rationale: „Messgefäß“ bewahrt den Bezug zu einem Gefäß mit Maßfunktion. „Scheffel“ wäre traditionell, könnte aber den antiken Gegenstand mit einem späteren deutschen Maß gleichsetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die partizipiale Konstruktion wird idiomatisch aufgelöst; die Bildsprache und die möglichen Bedeutungsbreiten der Sachbegriffe bleiben durch Fußnoten nachvollziehbar.
