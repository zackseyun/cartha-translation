id: LUK.11.15
reference: Luke 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: de
  text: 'Doch einige von ihnen sagten: „Durch Beelzebul[a], den Herrscher der Dämonen, treibt er die Dämonen aus.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Name auch als „Beelzebub“ wiedergegeben; der griechische Text hat hier „Beelzebul“.
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Doch einige von ihnen
  rationale: Die Wendung bezeichnet eine unbestimmte Teilgruppe der Anwesenden; „doch“ gibt den Kontrast zum vorausgehenden Zusammenhang natürlich wieder.
- source_word: εἶπον
  choice: sagten
  rationale: Der Aorist berichtet die Äußerung als punktuelles Ereignis.
- source_word: Ἐν
  choice: Durch
  rationale: ἐν bezeichnet hier bei einer Person die vermittelte Macht oder Wirksamkeit; „durch“ gibt den instrumentalen Sinn im Deutschen klar wieder.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Die Namensform folgt unmittelbar der griechischen Textform Βεελζεβούλ.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: den Herrscher der Dämonen
  rationale: ἄρχων bezeichnet eine Autorität oder einen Herrscher; die Apposition erklärt Beelzebuls behauptete Stellung über die Dämonen.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: treibt er die Dämonen aus
  rationale: „austreiben“ ist im Deutschen die natürliche und präzise Bezeichnung für ἐκβάλλω im Zusammenhang mit Dämonen.
theological_decisions:
- issue: Wiedergabe des Namens Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Der Haupttext bewahrt die griechische Namensform, während die im Deutschen traditionell vertraute Form in einer Fußnote genannt wird.
- issue: Wiedergabe von ἄρχων
  choice: Herrscher der Dämonen
  alternative: Fürst der Dämonen
  rationale: „Herrscher“ bezeichnet die behauptete Autoritätsstellung klar und modern, ohne eine weitergehende Dämonologie in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung in der direkten Rede hebt das angebliche Mittel der Austreibung hervor und bewahrt damit den Akzent des griechischen Satzes.
