id: LUK.11.35
reference: Luke 11:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: de
  text: Achte also darauf, dass das Licht in dir nicht Finsternis ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieh also zu, dass das Licht in dir nicht Finsternis ist.“'
    reason: Lexikalische Alternative für σκόπει; „Sieh zu“ ist näher am Bild des Sehens, während „Achte darauf“ im heutigen Deutsch natürlicher klingt.
lexical_decisions:
- source_word: σκόπει
  choice: Achte darauf
  rationale: Der präsentische Imperativ fordert zu anhaltender Wachsamkeit auf. „Achte darauf“ ist im modernen Deutschen natürlich und bewahrt den warnenden Charakter.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp und idiomatisch die Folgerung aus der vorausgehenden Aussage über Auge, Licht und inneren Zustand.
- source_word: μὴ
  choice: dass … nicht
  rationale: Nach der Aufforderung gibt μή den zu vermeidenden Sachverhalt an. Die deutsche Konstruktion „Achte darauf, dass … nicht“ gibt dies natürlich wieder.
- source_word: τὸ φῶς
  choice: das Licht
  rationale: Die wörtliche Wiedergabe erhält das Bild und legt dessen geistliche, moralische oder wahrnehmungsbezogene Bedeutung nicht vorschnell fest.
- source_word: τὸ ἐν σοὶ
  choice: in dir
  rationale: Die knappe Formulierung entspricht dem Griechischen und lässt die genaue Bedeutung des inneren Bezugs offen.
- source_word: σκότος
  choice: Finsternis
  rationale: „Finsternis“ bewahrt den pointierten Gegensatz zu „Licht“ und entspricht dem würdevollen biblischen Bildregister, ohne es auszudeuten.
- source_word: ἐστίν
  choice: ist
  rationale: Die einfache Kopula wird ohne unnötige Erweiterung wiedergegeben.
theological_decisions:
- issue: Bildhafte Bedeutung von „Licht“ und „Finsternis“
  choice: Das Bild bleibt im Haupttext unaufgelöst.
  alternative: Das Licht als Verstand, Gewissen oder geistlichen Zustand ausdrücklich bestimmen.
  rationale: Der griechische Text lässt die Metapher bewusst weit und verbindet Wahrnehmung mit dem inneren Zustand. Eine ausdrückliche Deutung würde die theologische Spannung unzulässig verengen.
- issue: Warnung oder bloße Feststellung
  choice: Die Formulierung wird als eindringliche Aufforderung mit einem zu vermeidenden Sachverhalt wiedergegeben.
  alternative: „Sieh nach, ob das Licht in dir Finsternis ist.“
  rationale: σκόπει mit μή hat hier warnenden Charakter; die Übersetzung soll nicht den Eindruck einer neutralen Prüfung erwecken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Finsternis“ wird statt des neutraleren „Dunkelheit“ gewählt, um den scharfen metaphorischen Gegensatz zu „Licht“ zu erhalten. Der Fußnotenmarker steht unmittelbar nach dem Verssatz.
