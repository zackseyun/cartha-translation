id: LUK.11.16
reference: Luke 11:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: de
  text: Andere aber wollten ihn auf die Probe stellen und verlangten von ihm ein Zeichen vom Himmel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι
  choice: Andere
  rationale: Bezeichnet im Kontrast zur zuvor genannten Gruppe weitere Personen; „Andere“ ist im Deutschen natürlich und präzise.
- source_word: δὲ
  choice: aber
  rationale: Markiert hier einen leichten Gegensatz beziehungsweise den Übergang zu einer anders reagierenden Gruppe.
- source_word: πειράζοντες
  choice: wollten ihn auf die Probe stellen
  rationale: Gibt die feindselige prüfende Absicht idiomatisch wieder, ohne die engere moderne Bedeutung von „versuchen“ im Sinn moralischer Verführung nahezulegen.
- source_word: σημεῖον
  choice: ein Zeichen
  rationale: Bewahrt den Grundbegriff, ohne den Wundercharakter ausdrücklich hinzuzufügen; dieser ergibt sich aus dem Zusammenhang.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Bezeichnet die verlangte himmlische Herkunft oder Beglaubigung des Zeichens.
- source_word: ἐζήτουν
  choice: verlangten
  rationale: Im Kontext bedeutet das Verb, dass sie das Zeichen forderten; das Imperfekt wird zusammen mit der fortdauernden Prüfungsabsicht natürlich wiedergegeben.
- source_word: παρ’ αὐτοῦ
  choice: von ihm
  rationale: παρά mit dem Genitiv bezeichnet hier Jesus als die Person, von der das Zeichen verlangt wurde.
theological_decisions:
- issue: Art des verlangten Zeichens
  choice: ein Zeichen vom Himmel
  alternative: ein himmlisches Zeichen
  rationale: Die Formulierung bewahrt die mögliche Bedeutung einer himmlischen Herkunft oder Beglaubigung, ohne die Aussage genauer festzulegen, als es der griechische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die finite Formulierung „wollten ihn auf die Probe stellen“ gibt das adverbiale Partizip natürlich wieder; „verlangten“ bringt die herausfordernde Forderung in diesem feindseligen Kontext knapp zum Ausdruck.
