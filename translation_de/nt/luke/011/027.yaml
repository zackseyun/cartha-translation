  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: de
  text: 'Es geschah aber, während er dies sagte, dass eine Frau aus der Menge ihre Stimme erhob[a] und zu ihm sagte: »Selig ist der Mutterleib, der dich getragen hat[b], und die Brüste, an denen du getrunken hast!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »laut rief«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der dich ausgetragen hat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Da geschah es
  rationale: Bewahrt die lukanische Erzählformel und ihren ereignismarkierenden Charakter, ohne die altertümliche Wendung »es begab sich« zu verwenden.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: während er dies sagte
  rationale: Der substantivierte Infinitiv mit ἐν bezeichnet eine gleichzeitig andauernde Handlung; »während« gibt dies im Deutschen natürlich wieder.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: Eine Frau … erhob ihre Stimme
  rationale: Gibt die griechische Redewendung sinngenau und in würdigem, verständlichem Deutsch wieder; τις wird als unbestimmter Artikel ausgedrückt.
- source_word: ἐκ τοῦ ὄχλου
  choice: aus der Menge
  rationale: Natürliche Wiedergabe der Herkunft beziehungsweise Position der Frau.
- source_word: Μακαρία
  choice: Glücklich zu preisen ist
  rationale: Drückt den objektiven Zuspruch von μακάριος deutlicher aus als bloßes subjektives Glück und wahrt den feierlichen Klang, ohne zusätzliche mariologische Aussagen einzutragen.
- source_word: ἡ κοιλία
  choice: der Mutterleib
  rationale: Im mütterlichen Kontext bezeichnet κοιλία den Schoß beziehungsweise Mutterleib; »Mutterleib« ist präzise und allgemein verständlich.
- source_word: ἡ βαστάσασά σε
  choice: der dich getragen hat
  rationale: Bewahrt das Bild des Tragens während der Schwangerschaft und lässt die mögliche Bedeutungsnähe zu »austragen« erkennen.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: die Brüste, an denen du getrunken hast
  rationale: Behält das konkrete mütterliche Bild bei und gibt die aktive Form des griechischen Verbs natürlich wieder, ohne das umständliche oder altertümliche »die du gesogen hast«.
theological_decisions:
- issue: Wiedergabe von μακαρία in der ehrenden Aussage über Jesu Mutter
  choice: Glücklich zu preisen ist der Mutterleib …
  alternative: Selig ist der Mutterleib … / Glücklich ist der Mutterleib …
  rationale: Die Formulierung wahrt die ehrende, glückpreisende Kraft des griechischen Wortes, ohne die Aussage abzuschwächen oder über den Wortlaut hinaus mariologisch zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lukanische Erzählformel bleibt erkennbar; anatomische und mütterliche Bilder werden ohne Euphemismus beibehalten. Die Zeichensetzung nach der Einleitungsformel sorgt für einen natürlichen deutschen Satzfluss.
