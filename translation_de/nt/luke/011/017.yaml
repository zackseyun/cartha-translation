source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: de
  text: 'Er aber kannte ihre Gedanken und sagte zu ihnen: »Jedes Reich, das gegen sich selbst gespalten ist, wird verwüstet, und ein Haus fällt auf ein anderes.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hausgemeinschaft« oder »Familie«. Das griechische Wort οἶκος kann sowohl ein Gebäude als auch eine Hausgemeinschaft oder Familie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: kannte
  rationale: Das Partizip bezeichnet hier das Wissen um die inneren Überlegungen der Angesprochenen. Die finite Verbindung „kannte … und sagte“ ist im Deutschen natürlich und gibt das Verhältnis zur Haupthandlung klar wieder.
- source_word: διανοήματα
  choice: Gedanken
  rationale: Das Wort bezeichnet innere Gedanken oder Überlegungen, ohne zwingend Absichten oder feindselige Motive näher festzulegen.
- source_word: Πᾶσα βασιλεία
  choice: Jedes Reich
  rationale: Die distributive Aussage formuliert eine allgemeine Regel; „jedes“ bewahrt diese Kraft.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: das gegen sich selbst gespalten ist
  rationale: Die Wendung beschreibt innere Entzweiung und Gegnerschaft. „Gegen sich selbst gespalten“ bewahrt sowohl das Teilungsmotiv als auch die konflikthafte Ausrichtung.
- source_word: ἐρημοῦται
  choice: wird verwüstet
  rationale: Das Passiv bezeichnet Verheerung und Verödung, nicht lediglich einen Zusammenbruch. „Wird verwüstet“ erhält Schwere und Passivform.
- source_word: οἶκος ἐπὶ οἶκον
  choice: ein Haus … auf das andere
  rationale: Die verdichtete griechische Formulierung lässt zunächst das konkrete Bild zweier Häuser stehen. Die deutsche Wiedergabe bleibt bildhaft und wahrt zugleich die mögliche soziale Bedeutung von οἶκος in der Fußnote.
- source_word: πίπτει
  choice: fällt
  rationale: Das schlichte Präsens erhält den sprichwörtlichen Charakter und deutet die Art des Zusammenbruchs nicht weiter aus.
theological_decisions:
- issue: Bedeutung von οἶκος im zweiten Teil des Spruchs
  choice: Im Haupttext steht das konkrete „Haus“.
  alternative: „Hausgemeinschaft“, „Familie“ oder sinngemäß „eine Hausgemeinschaft fällt über die andere her“.
  rationale: οἶκος kann sowohl ein Gebäude als auch eine Hausgemeinschaft oder Familie bezeichnen. Der knappe griechische Wortlaut entscheidet die Bedeutung nicht eindeutig; deshalb bleibt das konkrete Bild im Haupttext erhalten und die soziale Lesart wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist klar und sprichwörtlich; „Reich“, „verwüstet“ und das konkrete Hausbild bewahren den ernsten Ton und die Bildsprache des griechischen Textes.
