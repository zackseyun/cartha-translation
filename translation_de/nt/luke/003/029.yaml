  text: des Jeschua, des Elieser, des Jorim, des Mattat, des Levi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: Jeschua
  rationale: Die griechische Namensform wird hier mit der im Deutschen unterscheidbaren hebräisch-aramäischen Form wiedergegeben; so wird der Vorfahr nicht unnötig mit Jesus selbst gleichnamig dargestellt.
- source_word: Ἐλιέζερ
  choice: Eliëser
  rationale: Traditionelle deutsche Namensform; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: Ἰωρίμ
  choice: Jorim
  rationale: Nahe Umschrift der griechischen Namensform in geläufiger deutscher Schreibweise.
- source_word: Μαθθάτ
  choice: Mattat
  rationale: Die Verdoppelung des griechischen Theta wird in einer lesbaren deutschen Namensform als tt wiedergegeben.
- source_word: Λευί
  choice: Levi
  rationale: Eingebürgerte deutsche Form des biblischen Namens.
theological_decisions:
- issue: Elliptische Abstammungsformel mit wiederholtem τοῦ
  choice: Genitivreihe mit wiederholtem „des“
  alternative: Bei jedem Namen „Sohn des“ ergänzen
  rationale: Im griechischen Stammbaum steht eine elliptische Genitivkette. Die knappe deutsche Genitivreihe bewahrt Form und Anschluss an die vorangehenden Verse, ohne Geschlechtsbezeichnungen einzuführen, die in diesem einzelnen Vers nicht ausdrücklich wiederholt werden.
translation_notes:
  register: Knappe, würdevolle Stammbaumformel in modernem Standarddeutsch. Die Zeichensetzung signalisiert, dass der Satz über die Versgrenze hinaus weiterläuft.
