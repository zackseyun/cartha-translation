- from: Und er zog durch die ganze Gegend am Jordan[a] und verkündete eine Taufe der Umkehr zur Vergebung der Sünden.[b]
  to: Und er zog durch die ganze Gegend um den Jordan[a] und verkündete eine Taufe der Umkehr zur Vergebung der Sünden.[b]
  rationale: Die Ortsangabe wird von dem potenziell engeren „am Jordan“ zu „um den Jordan“ geändert, um περίχωρος als umliegende Region abzubilden. Die Fußnote a wird entsprechend als echte lexikalisch-syntaktische Alternative formuliert. Die knappe Struktur zu Taufe, Umkehr und Vergebung sowie die zugehörige Ambiguitätsanmerkung bleiben unverändert.
