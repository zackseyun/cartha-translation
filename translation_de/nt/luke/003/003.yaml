  source_fidelity: „Die ganze Gegend am Jordan“ kann den Umfang von περίχωρος zu stark auf das unmittelbare Jordanufer einengen. περίχωρος bezeichnet das umliegende Gebiet; „um den Jordan“ trifft dies genauer. „Zog durch“ ist als idiomatische Wiedergabe der Bewegung durch das gesamte Gebiet vertretbar, auch wenn ἦλθεν formal „kam“ lautet.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und bewahrt einen angemessen würdevollen Erzählton. Mit „um den Jordan“ wird die Ortsangabe zugleich natürlicher und genauer.
  terminology: „Verkündete“, „Taufe“, „Umkehr“ und „Vergebung der Sünden“ sind treffende, etablierte Wiedergaben. Die Formulierung „Taufe der Umkehr zur Vergebung der Sünden“ erhält die grammatische und theologische Offenheit des Griechischen.
