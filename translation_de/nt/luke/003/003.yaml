  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: de
  text: Und er zog durch die ganze Gegend um den Jordan[a] und verkündete eine Taufe der Umkehr zur Vergebung der Sünden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er kam in die ganze Gegend um den Jordan.“'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Formulierung bestimmt nicht näher, wie Taufe, Umkehr und Vergebung zueinander stehen.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: zog durch die ganze Gegend am Jordan
  rationale: Die Wiedergabe drückt idiomatisch aus, dass Johannes sich in dem gesamten Gebiet am Jordan bewegte. Sie bewahrt πᾶσαν („die ganze“) und gibt περίχωρος natürlich mit „Gegend“ wieder; eine streng formale Wiedergabe von ἦλθεν εἰς wäre im Deutschen missverständlich.
- source_word: κηρύσσων
  choice: verkündete
  rationale: „Verkündete“ gibt den öffentlichen Heroldsruf von κηρύσσω wieder, ohne das Wort auf eine förmliche Predigt einzuengen.
- source_word: βάπτισμα
  choice: Taufe
  rationale: „Taufe“ ist die etablierte und im Kontext klare deutsche Entsprechung für βάπτισμα.
- source_word: μετανοίας
  choice: der Umkehr
  rationale: „Umkehr“ bezeichnet eine grundlegende Sinnes- und Lebensänderung und gibt den Genitiv wieder, ohne dessen genaue Beziehung zur Taufe ausdeutend festzulegen.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: zur Vergebung der Sünden
  rationale: „Zur Vergebung der Sünden“ bildet die Ziel- beziehungsweise Bezugsangabe mit εἰς transparent ab. ἄφεσις wird in diesem Zusammenhang natürlich mit „Vergebung“ wiedergegeben.
theological_decisions:
- issue: Verhältnis von Taufe, Umkehr und Sündenvergebung
  choice: eine Taufe der Umkehr zur Vergebung der Sünden
  alternative: eine Taufe als Zeichen der Umkehr, die zur Vergebung führt
  rationale: Die knappe griechische Konstruktion wird beibehalten, ohne festzulegen, ob die Taufe hinsichtlich der Vergebung als Mittel, Zeichen, Bekenntnis oder Bestätigung zu verstehen ist.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Zog durch“ vermeidet die unnatürliche Formulierung „kam in die ganze Gegend“, während „Taufe der Umkehr zur Vergebung der Sünden“ die dichte und theologisch offene Struktur des griechischen Textes bewahrt.
