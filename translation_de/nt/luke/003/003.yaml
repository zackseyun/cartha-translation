    rationale: Eine solche Formulierung ist im Deutschen weder die nächstliegende noch eine besonders klare Annäherung an die genitivische Ortsbestimmung. Eine als Alternative ausgewiesene Formulierung mit „um den Jordan“ ist präziser.
