  - severity: low
    issue: Die genealogische Partizipialkonstruktion wird als eigenständiger Satz wiedergegeben.
    rationale: „Er galt als Sohn Josefs“ ist nicht falsch, aber die Verbindung von ὢν mit der Alters-/Beginnangabe wird klarer bewahrt, wenn die Aussage im selben Satz fortgeführt wird.
