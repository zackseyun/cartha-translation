revisions:
- from: Und Jesus selbst war, als er sein Wirken begann,[a] etwa dreißig Jahre alt. Er galt als Sohn Josefs,[b] des Eli.
  to: Und Jesus selbst war, als er begann,[a] etwa dreißig Jahre alt und galt, wie man meinte, als Sohn Josefs, des Eli.[b]
  rationale: Die Revision entfernt die im Griechischen nicht ausdrücklich vorhandene Ergänzung „sein Wirken“ aus dem Haupttext, bewahrt sie aber vorsichtig als kontextuelle Erklärung in der Fußnote. Zugleich wird die Aussage über die allgemein angenommene Sohnschaft Josefs im Satzfluss an die genealogische Konstruktion angebunden. Die knappe Folge „Josefs, des Eli“ lässt die elliptische griechische Genitivfolge offen.
