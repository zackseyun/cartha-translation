  source_fidelity: Die Altersangabe und die genealogische Anknüpfung sind grundsätzlich zutreffend. Die Ergänzung „sein Wirken“ im Haupttext fügt jedoch ein im Griechischen nicht genanntes Objekt hinzu. Die Wiedergabe „Er galt als Sohn Josefs“ gibt zwar den Vorbehalt wieder, löst aber die partizipiale Anbindung an die vorausgehende Aussage unnötig in einen neuen Satz auf.
  naturalness: Die vorliegende Fassung ist verständlich und würdig, doch die zwei kurzen Sätze unterbrechen den Fluss des griechischen Satzes. „Galt, wie man meinte, als Sohn“ ist modernes, natürliches Deutsch und verbindet die genealogische Angabe besser mit dem Hauptsatz.
  terminology: „Jesus“, „Josef“ und „Eli“ entsprechen dem üblichen deutschen Namengebrauch. Die Formulierung „wie man meinte“ gibt ὡς ἐνομίζετο angemessen als öffentliche Annahme wieder, ohne eine biologische oder rechtliche Deutung festzulegen.
  issues:
  - severity: medium
    issue: „sein Wirken“ steht im Haupttext, obwohl ἀρχόμενος kein ausdrückliches Objekt nennt.
