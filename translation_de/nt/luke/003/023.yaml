  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: de
  text: Und Jesus selbst war, als er begann,[a] etwa dreißig Jahre alt und galt, wie man meinte, als Sohn Josefs, des Eli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als er begann“; im Zusammenhang ist wohl der Beginn seines öffentlichen Wirkens gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Jesus wurde allgemein für Josefs Sohn gehalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den erzählerischen Anschluss an die vorangehende Taufszene.
- source_word: αὐτὸς
  choice: selbst
  rationale: Gibt die Hervorhebung des Pronomens wieder.
- source_word: ἦν … ἀρχόμενος
  choice: war, als er sein Wirken begann
  rationale: Gibt die umschreibende Konstruktion in natürlichem Deutsch wieder. „sein Wirken“ erschließt das im Kontext gemeinte Beginnen, wird aber wegen der fehlenden ausdrücklichen Entsprechung im Griechischen mit einer Fußnote gekennzeichnet.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: etwa dreißig Jahre alt
  rationale: Natürliche deutsche Altersangabe, die den Näherungswert von ὡσεὶ bewahrt.
- source_word: ὢν υἱός, ὡς ἐνομίζετο, Ἰωσήφ
  choice: Er galt als Sohn Josefs
  rationale: Drückt idiomatisch aus, dass Jesus nach allgemeiner Auffassung Josefs Sohn war, ohne biologische Vaterschaft zu behaupten.
- source_word: τοῦ Ἠλί
  choice: des Eli
  rationale: Bewahrt die knappe genitivische Form der einsetzenden Geschlechtsfolge, ohne „Sohn“ erneut ausdrücklich zu ergänzen.
theological_decisions:
- issue: Bezug von ὡς ἐνομίζετο auf Jesu Verhältnis zu Josef
  choice: „Er galt als Sohn Josefs“ kennzeichnet Josefs Vaterschaft als öffentliche Annahme.
  alternative: „Er war, wie man meinte, ein Sohn Josefs“
  rationale: Die Fassung bewahrt die Spannung zum Bericht von der jungfräulichen Empfängnis, ohne die genaue rechtliche oder biologische Beziehung über den Vers hinaus festzulegen.
- issue: Unausgesprochenes Objekt von ἀρχόμενος
  choice: „sein Wirken begann“ im Haupttext mit transparenter Fußnote
  alternative: „als er begann“
  rationale: Der Zusammenhang verweist auf den Beginn des öffentlichen Wirkens. Die Ergänzung ergibt natürliches, verständliches Deutsch; die Fußnote macht kenntlich, dass „Wirken“ nicht ausdrücklich im griechischen Text steht.
- issue: Verhältnis Josefs zu Eli
  choice: Die elliptische Genitivfolge wird als „Josefs, des Eli“ bewahrt.
  alternative: „Josefs, des Sohnes Elis“
  rationale: Der griechische Text nennt die genaue Art der Zuordnung nicht erneut ausdrücklich. Die knappe Wiedergabe vermeidet, eine genealogische Deutung stärker festzulegen als die Syntax.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz ist flüssig und allgemeinverständlich; der zweite leitet bewusst knapp in die genealogische Reihe über.
