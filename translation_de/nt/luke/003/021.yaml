  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: de
  text: Es geschah aber, als das ganze Volk getauft worden war und auch Jesus getauft worden war, während er betete, dass sich der Himmel[a] öffnete,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sichtbare Himmel“. Das griechische Wort kann sowohl den sichtbaren Himmel als auch den himmlischen Bereich bezeichnen; hier legt das Offenbarungsgeschehen „Himmel“ nahe.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Es geschah aber
  rationale: Die lukanische Erzählformel wird ausdrücklich wiedergegeben; „aber“ markiert hier den Fortgang der Erzählung, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: als das ganze Volk getauft worden war
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv ist temporal. Das deutsche Plusquamperfekt stellt die Taufe des Volkes als zeitlichen Hintergrund des Hauptereignisses dar.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: und auch Jesus getauft worden war
  rationale: Das Genitivus-abs.-Partizip wird passiv wiedergegeben; „auch“ bewahrt die additive Kraft von καί und verbindet Jesus mit der zuvor erwähnten Taufe des Volkes.
- source_word: καὶ προσευχομένου
  choice: und betete
  rationale: Das zweite Partizip beschreibt Jesu andauerndes Beten zur Zeit der Öffnung des Himmels. Die koordinierte deutsche Form ist klar und natürlich.
- source_word: ἀνεῳχθῆναι
  choice: dass sich … öffnete
  rationale: Der Infinitiv hängt von Ἐγένετο ab. Die im Deutschen idiomatische reflexive Form bewahrt das Geschehen, ohne das stärkere Bild eines Aufreißens einzutragen.
- source_word: τὸν οὐρανὸν
  choice: der Himmel
  rationale: οὐρανός kann Himmel oder sichtbaren Luftraum bezeichnen; im Offenbarungsgeschehen der folgenden Verse ist „Himmel“ die naheliegende Wiedergabe.
theological_decisions:
- issue: Bedeutung von οὐρανός in der Taufszene
  choice: Himmel
  alternative: Himmelsgewölbe / sichtbarer Himmel
  rationale: Der unmittelbar folgende Geistempfang und die göttliche Stimme sprechen für den Offenbarungssinn „Himmel“. Die Fußnote hält die lexikalische Alternative offen.
- issue: Zeitliches Verhältnis von Jesu Taufe und Gebet
  choice: Jesus war getauft worden und betete, als sich der Himmel öffnete
  alternative: Während Jesus getauft wurde und betete, öffnete sich der Himmel
  rationale: Das Aoristpartizip βαπτισθέντος legt die Taufe als dem fortdauernden Beten und der Himmelsöffnung vorausgehend nahe, ohne einen größeren zeitlichen Abstand zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Erzählformel „Es geschah aber“ bewahrt den lukanischen Satzbau und die Ereignisperspektive; die Wiederholung von „getauft worden war“ wurde beibehalten, um die passive Form und die ausdrückliche Einbeziehung Jesu nicht abzuschwächen.
