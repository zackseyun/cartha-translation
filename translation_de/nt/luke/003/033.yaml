base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: de
  text: Sohn des Amminadab[a], Sohn des Admin, Sohn des Arni, Sohn des Hezron, Sohn des Perez, Sohn des Juda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen hier „Sohn des Amminadab, Sohn des Admin, Sohn des Aram“; andere lassen „Admin“ aus und lesen „Sohn des Amminadab, Sohn des Aram“.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: Sohn des
  rationale: Der wiederholte Genitivartikel setzt in der lukanischen Abstammungsliste die genealogische Formel elliptisch fort. „Sohn des“ macht die Beziehung im Deutschen natürlich und eindeutig sichtbar.
- source_word: Ἀμιναδάβ
  choice: Amminadab
  rationale: Gebräuchliche deutschsprachige Namensform, die zugleich dem griechischen Namen nahesteht.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Direkte Wiedergabe des im SBLGNT-Haupttext gebotenen griechischen Eigennamens.
- source_word: Ἀρνί
  choice: Arni
  rationale: Direkte Wiedergabe der Lesart des SBLGNT; die abweichende Überlieferung „Aram“ wird in der Fußnote dokumentiert.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Im Deutschen vertraute, am Alten Testament orientierte Namensform statt der stärker griechisch geprägten Form Esrom.
- source_word: Φαρές
  choice: Perez
  rationale: Die im deutschen Alten Testament geläufige Namensform fördert die Wiedererkennbarkeit innerhalb der biblischen Abstammungslinie.
- source_word: Ἰούδα
  choice: Juda
  rationale: Im genealogischen Zusammenhang ist „Juda“ die etablierte deutsche Form für den Stammvater und vermeidet eine Verwechslung mit Personen namens Judas.
theological_decisions: []
translation_notes:
