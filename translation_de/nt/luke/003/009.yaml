id: LUK.3.9
reference: Luke 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: de
  text: Die Axt liegt schon an der Wurzel der Bäume. Darum wird jeder Baum, der keine gute Frucht bringt, gefällt und ins Feuer geworfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: schon
  rationale: „Schon“ gibt die zeitliche Dringlichkeit von ἤδη natürlich wieder; δὲ καὶ verstärkt im Zusammenhang den fortschreitenden Warnruf, ohne dass im Deutschen eine schwerfällige wörtliche Wiedergabe nötig ist.
- source_word: ἡ ἀξίνη
  choice: die Axt
  rationale: Bezeichnet das Fällwerkzeug im Bild des unmittelbar bevorstehenden Gerichts.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: liegt an der Wurzel der Bäume
  rationale: „Liegt“ entspricht κεῖται unmittelbar und bewahrt das Bild einer bereits zum Einsatz bereiten Axt; „an der Wurzel“ ist natürliches Deutsch für ihre Lage.
- source_word: πᾶν οὖν δένδρον
  choice: Darum wird jeder Baum
  rationale: „Darum“ gibt den folgernden Sinn von οὖν klar und idiomatisch wieder.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: der keine gute Frucht bringt
  rationale: Bei Bäumen ist „Frucht bringen“ die natürliche deutsche Entsprechung zu ποιεῖν καρπόν und erhält zugleich die ethisch-geistliche Bildsprache.
- source_word: ἐκκόπτεται
  choice: wird gefällt
  rationale: Im Zusammenhang mit einem Baum bezeichnet „fällen“ präzise und anschaulich das Abhauen.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: und ins Feuer geworfen
  rationale: Gibt die passive Gegenwartsform und die Schärfe des Gerichtsbildes in heutigem Deutsch wieder.
theological_decisions:
- issue: Bildsprache des Gerichts
  choice: Das landwirtschaftliche Bild von der Axt an der Wurzel und dem ins Feuer geworfenen Baum bleibt ohne nähere Deutung stehen.
  alternative: Das Feuer ausdrücklich als Hölle oder ausschließlich als geschichtliches Gericht über Israel bestimmen.
  rationale: Der Vers kündigt ein nahes und schweres Gericht an, legt aber hier nicht ausdrücklich fest, ob das Feuer ein zeitliches, endzeitliches oder beide umfassendes Gericht bezeichnet.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzform erhält die Dringlichkeit des griechischen Warnworts; traditionelle, aber unnötig steife Formulierungen wie „die Axt ist an die Wurzel gelegt“ werden vermieden.
