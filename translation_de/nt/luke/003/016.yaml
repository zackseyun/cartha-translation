id: LUK.3.16
reference: Luke 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: de
  text: 'Johannes antwortete allen und sagte: „Ich taufe euch zwar mit Wasser[a]; aber es kommt einer, der stärker ist als ich[b]. Ich bin nicht würdig, den Riemen seiner Sandalen zu lösen. Er wird euch mit Heiligem Geist[c] und Feuer[d] taufen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in Wasser“. Der griechische Dativ kann hier das Mittel oder das Element bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „der mächtiger ist als ich“ oder „der Mächtigere“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „in Heiligem Geist und Feuer“. Die griechische Präposition kann hier unter anderem das Mittel, den Bereich oder das Element bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: „Feuer“ kann als Läuterung, als Gericht oder als Teil des einheitlichen Bildes einer Taufe mit Geist und Feuer verstanden werden; die Übersetzung legt sich nicht auf eine dieser Deutungen fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Johannes antwortete allen und sagte
  rationale: Die Formulierung gibt die übliche griechische Erzählformel und πᾶσιν vollständig wieder, bleibt dabei aber in modernem Deutsch natürlich.
- source_word: Ἐγὼ μὲν ... δὲ
  choice: Ich ... zwar ...; aber
  rationale: Die Korrelate „zwar … aber“ bilden den vorbereitenden Kontrast zwischen Johannes und dem Kommenden idiomatisch ab.
- source_word: ὕδατι
  choice: mit Wasser
  rationale: Der Dativ kann Mittel oder Element bezeichnen. „Mit Wasser taufen“ ist im Deutschen natürlich, ohne die mögliche Nuance „in Wasser“ auszuschließen.
- source_word: βαπτίζω / βαπτίσει
  choice: taufe / wird ... taufen
  rationale: „Taufen“ ist die etablierte, kontextgerechte Wiedergabe und vermeidet eine konfessionell verengende Festlegung auf „untertauchen“.
- source_word: ὁ ἰσχυρότερός μου
  choice: einer, der stärker ist als ich
  rationale: Die explizite Vergleichsform gibt ἰσχυρότερος klar und verständlich wieder; „mächtiger“ bleibt als mögliche Nuance erhalten.
- source_word: ἔρχεται
  choice: es kommt
  rationale: Das Präsens bezeichnet hier das bevorstehende Kommen. Die deutsche Wendung ist unmittelbar und natürlich.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Ich bin nicht würdig
  rationale: ἱκανός kann Eignung, Zulänglichkeit oder Würdigkeit ausdrücken. In dieser Demutsformel trifft „würdig“ den idiomatischen Sinn.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: den Riemen seiner Sandalen zu lösen
  rationale: Die Formulierung bezeichnet die niedrige Aufgabe, das Schuhwerk zu lösen, und bleibt in heutigem Deutsch anschaulich.
- source_word: αὐτὸς
  choice: Er
  rationale: Das betonte Pronomen stellt den Kommenden Johannes gegenüber. Der vorausgehende Kontrast macht diese Betonung im Deutschen ausreichend deutlich.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: mit Heiligem Geist und Feuer
  rationale: Die natürliche deutsche Formulierung lässt den Gedanken von Mittel oder Element zu. Eine Fußnote weist darauf hin, dass ἐν auch räumlich beziehungsweise sphärisch als „in“ verstanden werden kann.
theological_decisions:
- issue: Bedeutung der Taufe mit Heiligem Geist und Feuer
  choice: Die knappe Verbindung „mit Heiligem Geist und Feuer“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Feuer als Läuterung deuten oder Geist und Feuer als unterschiedliche Taufen für verschiedene Menschengruppen verstehen.
  rationale: Der Wortlaut entscheidet nicht ausdrücklich zwischen Läuterung, Gericht und einer zusammengehörigen Geist-und-Feuer-Taufe. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich verständlich; etablierte biblische Begriffe wie „taufen“ und „Heiliger Geist“ werden beibehalten. Konfessionelle Präzisierungen und eine einseitige Deutung des Feuers werden vermieden.
