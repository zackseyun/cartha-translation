  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: de
  text: Sohn des Melchi[a], Sohn des Addi, Sohn des Kosam, Sohn des Elmadam, Sohn des Er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht vor jedem Namen nur der Genitivartikel; „Sohn“ ist jeweils aus dem Zusammenhang des Stammbaums ergänzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: Sohn des
  rationale: Der wiederholte Genitivartikel setzt in diesem Stammbaum elliptisch die aus dem Kontext erschlossene Beziehung „Sohn des“ fort. Die Ergänzung macht das Verhältnis im Deutschen natürlich und eindeutig verständlich.
- source_word: Μελχὶ
  choice: Melchi
  rationale: Der Personenname wird entsprechend der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: Ἀδδὶ
  choice: Addi
  rationale: Der Personenname wird unmittelbar und in geläufiger deutscher Schreibweise transkribiert.
- source_word: Κωσὰμ
  choice: Kosam
  rationale: Die Schreibung mit K entspricht sowohl dem griechischen Kappa als auch moderner deutscher Transkriptionspraxis.
- source_word: Ἐλμαδὰμ
  choice: Elmadam
  rationale: Der Personenname wird unmittelbar aus dem Griechischen transkribiert.
- source_word: Ἢρ
  choice: Er
  rationale: Der Personenname wird ohne einen im Griechischen nicht vorhandenen H-Anlaut als „Er“ wiedergegeben.
