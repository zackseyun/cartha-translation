id: LUK.3.22
reference: Luke 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: de
  text: 'und der Heilige Geist kam in leiblicher Gestalt wie eine Taube auf ihn herab. Und eine Stimme kam aus dem Himmel: „Du bist mein geliebter Sohn; an dir habe ich Freude[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: „An dir fand ich Gefallen.“'
    reason: Die griechische Verbform εὐδόκησα ist Aorist und kann formaler vergangenheitsbezogen wiedergegeben werden.
lexical_decisions:
- source_word: καταβῆναι
  choice: herabkam
  rationale: Der Aoristinfinitiv steht in der erzählerischen Folge zu γενέσθαι. „Herabkam“ gibt die Abwärtsbewegung natürlich und präzise wieder.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Die übliche und klare moderne deutsche Wiedergabe der bestimmten griechischen Wortgruppe.
- source_word: σωματικῷ εἴδει
  choice: in leiblicher Gestalt
  rationale: Die Formulierung bewahrt den Gedanken einer sichtbaren, körperhaft wahrnehmbaren Erscheinungsweise, ohne unnötig zu erklären.
- source_word: ὡς περιστερὰν
  choice: wie eine Taube
  rationale: ὡς bezeichnet hier einen Vergleich. „Wie eine Taube“ lässt offen, worauf genau sich die Ähnlichkeit bezieht, und behauptet nicht, der Geist sei buchstäblich zu einer Taube geworden.
- source_word: ἐπ’ αὐτόν
  choice: auf ihn
  rationale: Gibt die auf Jesus gerichtete Bewegung knapp und idiomatisch wieder.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: eine Stimme kam aus dem Himmel
  rationale: γενέσθαι mit φωνή bezeichnet idiomatisch das Auftreten einer Stimme. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt die Herkunftsangabe.
- source_word: Σὺ εἶ
  choice: Du bist
  rationale: Die direkte Anrede wird klar wiedergegeben; das ausdrücklich gesetzte Pronomen entspricht dem natürlichen deutschen Satzbau.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mein geliebter Sohn
  rationale: „Geliebter Sohn“ ist eine genaue, würdige und allgemein verständliche Wiedergabe des attributiven ἀγαπητός.
- source_word: ἐν σοὶ
  choice: an dir
  rationale: Im Deutschen lautet die idiomatische Verbindung „an jemandem Gefallen finden“. Sie gibt den Sinn von ἐν σοὶ in diesem Zusammenhang natürlicher wieder als das missverständliche „in dir“.
- source_word: εὐδόκησα
  choice: habe ich Gefallen gefunden
  rationale: Das Perfekt bildet den griechischen Aorist in einer gegenwärtig ausgesprochenen Erklärung natürlich ab und wahrt stärker als ein reines Präsens die vollendete verbale Aussage.
theological_decisions:
- issue: Art der Erscheinung des Heiligen Geistes
  choice: Der Heilige Geist kommt in leiblicher Gestalt herab, die mit einer Taube verglichen wird.
  alternative: Der Heilige Geist nahm buchstäblich die Gestalt einer Taube an.
  rationale: σωματικῷ εἴδει ὡς περιστερὰν verbindet eine sichtbar-körperhafte Erscheinung mit einem Vergleich. Die Übersetzung wahrt diese Aussage, ohne den Vergleich in eine ontologische Gleichsetzung umzudeuten.
- issue: Zeitliche Aussage von εὐδόκησα
  choice: „habe ich Gefallen gefunden“
  alternative: „habe ich Gefallen“ oder „fand ich Gefallen“
  rationale: Der Aorist bezeichnet die göttliche Zustimmung als festgestellte Handlung, ohne für sich allein deren zeitliche Reichweite abschließend zu bestimmen. Das deutsche Perfekt bleibt idiomatisch und vermeidet eine unnötige Festlegung auf bloß vergangenes oder ausschließlich gegenwärtiges Gefallen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die zwei koordinierten Ereignisse des griechischen Textes, wird jedoch für gute deutsche Lesbarkeit in zwei Sätze gegliedert. Keine konfessionell geprägte Sonderterminologie.
