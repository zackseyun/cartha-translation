  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „An dir habe ich Freude“ ist in dieser direkten Anrede natürlicher als „an dir habe ich Gefallen gefunden“ und gibt die Zustimmung bzw. das Wohlgefallen klar wieder.
  terminology: „Der Heilige Geist“, „leibliche Gestalt“, „geliebter Sohn“ und „Himmel“ sind sachgerecht. Die Vergleichsformulierung „wie eine Taube“ wahrt, dass der griechische Text einen Vergleich ausdrückt, nicht eine Gleichsetzung.
