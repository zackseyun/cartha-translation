lexical_decisions:
- source_word: τοῦ
  choice: des
  rationale: Der wiederholte Genitivartikel führt die Abstammungsreihe aus dem vorausgehenden Kontext elliptisch fort. Im Deutschen ist die knappe genealogische Formulierung „des …“ verständlich und bewahrt die Struktur des Griechischen, ohne bei jedem Namen „Sohn“ zu ergänzen.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Simeon ist die im Deutschen geläufige Form des Personennamens.
- source_word: Ἰούδα
  choice: Juda
  rationale: Die griechische Namensform kann je nach Person als „Juda“ oder „Judas“ wiedergegeben werden. In dieser genealogischen Reihe entspricht „Juda“ der geläufigen Form des jüdischen Namens, ohne eine bestimmte Identifizierung zu unterstellen.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Josef ist die moderne deutsche Standardschreibung des biblischen Personennamens.
- source_word: Ἰωνὰμ
  choice: Jonam
  rationale: Jonam gibt die im SBLGNT stehende Form Ἰωνάμ unmittelbar wieder.
- source_word: Ἐλιακὶμ
  choice: Eljakim
  rationale: Eljakim ist eine geläufige moderne deutsche Wiedergabe des semitischen Personennamens.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Genealogieform in modernem Standarddeutsch. Die wiederholte Genitivkonstruktion entspricht dem griechischen Satzbau und ist im Zusammenhang mit dem Beginn der Ahnenreihe eindeutig. Bei „Juda“ ist keine Fußnote nötig, da dies keine Variante des griechischen Ausgangstextes, sondern eine Frage der deutschen Namensform ist.
