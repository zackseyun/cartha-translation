  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: de
  text: zur Zeit des Hohenpriesters Hannas und Kajafas[a] erging das Wort Gottes an Johannes, den Sohn des Zacharias, in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „während des Hohenpriestertums von Hannas und Kajafas“. Lukas nennt beide Männer, obwohl „Hoherpriester“ im Griechischen im Singular steht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: zur Zeit des Hohenpriesters Hannas und Kajafas
  rationale: ἐπί mit Genitiv bezeichnet hier den zeitlichen Rahmen. Die Formulierung bleibt nahe am singulären ἀρχιερέως und bewahrt zugleich die auffällige Nennung beider Männer, ohne sie durch einen Plural zu glätten.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: erging das Wort Gottes
  rationale: Die Wendung ist eine prophetische Offenbarungsformel. „Erging das Wort Gottes“ gibt ihren ereignishaften Charakter in würdigem, verständlichem Deutsch wieder.
- source_word: ἐπὶ Ἰωάννην
  choice: an Johannes
  rationale: Bei der Offenbarungsformel bezeichnet ἐπί mit Akkusativ den Empfänger. „An Johannes“ ist im Deutschen idiomatisch.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: den Sohn des Zacharias
  rationale: Die Apposition identifiziert Johannes und entspricht in dieser Form dem erzählerischen Register des Lukas.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: ἔρημος bezeichnet hier das unbewohnte beziehungsweise dünn besiedelte Gebiet. „Wüste“ ist die etablierte deutsche Wiedergabe und muss keine Sandwüste meinen.
theological_decisions:
- issue: Die Zuordnung von Hannas und Kajafas zum singulären ἀρχιερέως
  choice: Den Singular in „zur Zeit des Hohenpriesters Hannas und Kajafas“ bewahren
  alternative: „als Hannas und Kajafas Hohepriester waren“
  rationale: Der griechische Text verwendet den Singular und nennt dennoch zwei Personen. Die Übersetzung bewahrt diese historische und sprachliche Spannung, statt sie durch einen Plural oder eine harmonisierende Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „erging das Wort Gottes“ ist bewusst bibelsprachlich, aber weiterhin allgemein verständlich; Satzanfang kleingeschrieben, da der Vers syntaktisch die in Vers 1 begonnene Zeitangabe fortsetzt.
