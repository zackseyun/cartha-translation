  naturalness: „Ihr Schlangenbrut!“ ist eine natürliche, scharfe Anrede in würdigem modernem Standarddeutsch. „Da sagte er“ ist als erzählerischer Anschluss idiomatischer als das stärker kausal wirkende „Darum sagte er“. Die revidierte Frage ist klar und flüssig.
  terminology: „Schlangenbrut“, „taufen lassen“ und „kommender Zorn“ sind treffend und registergerecht. Die Fußnote zu „Nachkommen von Giftschlangen“ erläutert die wörtlichere Bildsprache angemessen. „Warnte“ erfasst ὑποδείκνυμι hier, ohne die Art oder den Urheber der Warnung näher zu bestimmen.
