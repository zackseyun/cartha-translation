  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: de
  text: 'Da sagte er zu den Menschenmengen, die hinausgingen, um sich von ihm taufen zu lassen: „Ihr Schlangenbrut![a] Wer hat euch gewarnt, vor dem kommenden Zorn zu fliehen?[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nachkommen von Giftschlangen!“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wer hat euch gezeigt, vor dem kommenden Zorn zu fliehen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: sagte er
  rationale: Das griechische Imperfekt zeichnet Johannes’ wiederholtes bzw. fortdauerndes Reden; im natürlichen deutschen Erzählstil kann dies durch das Präteritum ausgedrückt werden, ohne ausdrücklich eine Häufigkeit festzulegen.
- source_word: οὖν
  choice: Darum
  rationale: Die Partikel knüpft folgernd an den vorherigen Vers an; „Darum“ bewahrt diesen Zusammenhang.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: zu den Menschenmengen, die hinausgingen
  rationale: Die partizipiale Wendung bezeichnet die Menschenmengen, die aus ihren Orten hinaus zu Johannes gingen; „Menschenmengen“ gibt den Plural wieder.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: um sich von ihm taufen zu lassen
  rationale: Die deutsche Konstruktion gibt die Zweckangabe und den passiven Sinn idiomatisch wieder; das Pronomen bleibt wie im Griechischen erhalten.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ihr Schlangenbrut!
  rationale: „Schlangenbrut“ ist im Deutschen eine natürliche, scharfe Anrede und bewahrt das Bild von der Nachkommenschaft giftiger Schlangen.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Wer hat euch gezeigt
  rationale: „Gezeigt“ wahrt den weiteren Bedeutungsumfang von ὑποδείκνυμι und vermeidet, die Aussage ausschließlich als Warnung festzulegen.
- source_word: φυγεῖν ἀπὸ
  choice: wie ihr ... entfliehen könnt
  rationale: Im Deutschen verlangt „zeigen“ hier eine idiomatische Ergänzung. „Entfliehen“ erhält das Bild der Flucht vor einer Gefahr, während „könnt“ die im Infinitiv liegende Möglichkeit sprachlich ausdrückt.
- source_word: τῆς μελλούσης ὀργῆς
  choice: dem kommenden Zorn
  rationale: „Kommend“ gibt μέλλουσα wieder; „Zorn“ bewahrt die offene, theologisch gewichtige Bezeichnung der bevorstehenden göttlichen Gerichtsreaktion.
theological_decisions:
- issue: Bedeutung des kommenden Zorns
  choice: Die Übersetzung spricht offen vom „kommenden Zorn“ und lässt ihn als bevorstehendes göttliches Gericht stehen.
  alternative: Ausdrückliche Festlegung auf das endzeitliche Gericht oder auf ein bestimmtes geschichtliches Strafgericht.
  rationale: Der Kontext verbindet Umkehr mit Gottes bevorstehendem Gericht, legt dessen zeitliche und systematisch-theologische Ausgestaltung in diesem Vers jedoch nicht enger fest.
- issue: Kraft von ὑπέδειξεν
  choice: „gezeigt“
  alternative: „gewarnt“
  rationale: Beides ist kontextuell möglich. „Gezeigt“ hält die lexikalische Breite und die rhetorische Frage offen; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt scharf und bildkräftig; „Menschenmengen“ vermeidet eine unnötige Vereinheitlichung des griechischen Plurals. Beide Fußnotenmarker stehen unmittelbar im Haupttext.
