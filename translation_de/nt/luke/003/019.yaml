id: LUK.3.19
reference: Luke 3:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: de
  text: Herodes aber, der Tetrarch, der von ihm wegen Herodias, der Frau seines Bruders, und wegen all des Bösen, das Herodes getan hatte, zurechtgewiesen[a] wurde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „getadelt“, „überführt“ oder „bloßgestellt“. Das griechische Wort kann sowohl eine moralische Zurechtweisung als auch das Aufdecken von Unrecht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: Tetrarch
  rationale: Der spezifische historisch-politische Amtstitel bleibt erhalten; eine Wiedergabe als bloß „Herrscher“ wäre weniger genau.
- source_word: ἐλεγχόμενος
  choice: zurechtgewiesen wurde
  rationale: Die passive Form bewahrt Johannes als Handelnden im Hintergrund und gibt die moralische Beanstandung wieder, ohne den Ausdruck unnötig forensisch zu deuten.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: Wie der griechische Text verwendet die Übersetzung ein Pronomen; aus dem Zusammenhang ist Johannes als Bezugsperson erkennbar.
- source_word: περὶ Ἡρῳδιάδος
  choice: wegen Herodias
  rationale: „Wegen“ gibt in diesem Zusammenhang den Gegenstand der Zurechtweisung natürlich wieder und lässt sich parallel mit dem zweiten περὶ verbinden.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: der Frau seines Bruders
  rationale: Die Apposition bildet die Genitivverbindung knapp und verständlich ab und bewahrt den für den Vorwurf entscheidenden Verwandtschaftsbezug.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: und wegen all des Bösen, das Herodes getan hatte
  rationale: Die Formulierung bewahrt die umfassende Aussage und den breiten moralischen Sinn des substantivierten πονηρῶν. Das Plusquamperfekt entspricht im deutschen Erzählzusammenhang den vorausliegenden Taten.
- source_word: δὲ
  choice: aber
  rationale: „Aber“ markiert den erzählerischen Kontrast zum vorhergehenden Abschnitt.
theological_decisions:
- issue: Moralische Tragweite der Kritik des Johannes an Herodes
  choice: „zurechtgewiesen“ als Ausdruck prophetischer moralischer Beanstandung
  alternative: „überführt“ oder „bloßgestellt“
  rationale: Die Wiedergabe erhält die ethische Schärfe des Verbs, legt aber weder eine förmliche Verurteilung noch eine öffentliche Entlarvung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Relativsatzkonstruktion bewahrt den Anschlusscharakter des griechischen Verses, dessen Hauptaussage erst im folgenden Vers fortgeführt wird. Der Fußnotenmarker steht unmittelbar bei dem Wort, auf das sich die lexikalische Anmerkung bezieht.
