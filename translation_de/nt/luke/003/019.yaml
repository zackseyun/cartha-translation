  verdict: approve
  source_fidelity: Der Entwurf gibt die Satzstruktur mit dem fortführenden, noch unvollständigen Anschluss korrekt wieder. „Tetrarch“, das passive „von ihm ... zurechtgewiesen wurde“, die beiden durch περὶ verbundenen Gegenstände sowie die umfassende Bezugnahme auf Herodes’ böse Taten sind sachgerecht wiedergegeben. Das Pronomen „ihm“ bewahrt die Form des griechischen Textes.
  naturalness: Modernes Standarddeutsch und trotz der bewusst satzanschließenden Relativsatzkonstruktion gut verständlich. Die Apposition „der Frau seines Bruders“ ist klar Herodias zugeordnet. „All des Bösen“ ist idiomatisch und deckt die kollektive plurale Aussage im Griechischen angemessen ab.
  terminology: „Tetrarch“ bewahrt den historischen Amtstitel. „Zurechtgewiesen“ trifft die moralisch tadelnde Kraft von ἐλεγχόμενος ohne eine spezifisch forensische oder konfessionelle Deutung festzulegen. Die Fußnote bietet mögliche Nuancen, ohne sie dem Haupttext aufzuzwingen.
