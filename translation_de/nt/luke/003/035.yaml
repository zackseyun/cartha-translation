  text: τοῦ Σεροὺχ τοῦ Ῥαγαὺ τοῦ Φάλεκ τοῦ Ἔβερ τοῦ Σαλὰ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/035.yaml
  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: de
  text: Sohn des Serug, Sohn des Regu, Sohn des Peleg, Sohn des Eber, Sohn des Schelach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen eine Reihe von Genitiven: »des Seruch, des Ragau, des Phalek, des Eber, des Sala«. Die Namen erscheinen im Text in ihren gebräuchlichen deutschen alttestamentlichen Formen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: Sohn des
  rationale: Die wiederholten Genitive setzen in diesem Stammbaum die aus dem Kontext erschließbare Abstammungsformel fort. »Sohn des« gibt die elliptische Konstruktion im Deutschen klar und natürlich wieder.
- source_word: Σερούχ
  choice: Serug
  rationale: Die im deutschen Alten Testament gebräuchliche Namensform verbindet den lukanischen Stammbaum erkennbar mit 1. Mose 11.
- source_word: Ῥαγαύ
  choice: Regu
  rationale: »Regu« ist die übliche deutsche Form des alttestamentlichen Namens; sie wird gegenüber einer unmittelbaren Umschrift wie »Ragau« bevorzugt.
- source_word: Φάλεκ
  choice: Peleg
  rationale: Die gebräuchliche alttestamentliche Namensform fördert die Wiedererkennbarkeit der betreffenden Person.
- source_word: Ἔβερ
  choice: Eber
  rationale: Diese Form entspricht dem im deutschen Alten Testament geläufigen Namen des Stammvaters.
- source_word: Σαλά
  choice: Schelach
  rationale: Die geläufige deutsche Form des Namens aus 1. Mose 10–11 stellt den kanonischen Zusammenhang her; die griechische Form lautet Sala.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger Stammbaumstil. Das wiederholte »Sohn des« macht die im Griechischen elliptische Beziehung verständlich; ein Artikel wird nicht ergänzt, da deutsche Genealogien mit Eigennamen ihn nicht verlangen.
