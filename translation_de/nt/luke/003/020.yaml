  variant: modern standard German
source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: de
  text: 'Zu all dem fügte er auch noch dies hinzu: er sperrte Johannes ins Gefängnis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Er fügte auch dies zu allem hinzu.“ Gemeint ist, dass Herodes diese Tat all seinen anderen bösen Taten hinzufügte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: fügte … hinzu
  rationale: Das Verb bezeichnet hier, dass Herodes seinen bisherigen Taten eine weitere hinzufügte. „Hinzufügen“ bewahrt den kumulativen Sinn und ist im Deutschen natürlich.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen weist voraus auf die unmittelbar folgende Tat, die Gefangensetzung des Johannes.
- source_word: ἐπὶ πᾶσιν
  choice: zu all dem
  rationale: Die Wendung bedeutet im Zusammenhang „zusätzlich zu allem zuvor Genannten“ und bezieht sich auf die bösen Taten des Herodes in Vers 19.
- source_word: κατέκλεισεν
  choice: sperrte … ins Gefängnis
  rationale: Das Verb bedeutet, jemanden einzuschließen oder gefangen zu setzen. Die gewählte Formulierung gibt den konkreten Vorgang knapp und in natürlichem modernem Deutsch wieder.
- source_word: Ἰωάννην
  choice: Johannes
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: ἐν φυλακῇ
  choice: ins Gefängnis
  rationale: φυλακή bezeichnet hier den Ort der Haft. Im Deutschen verlangt die idiomatische Verbindung mit „sperren“ die Richtungsangabe „ins Gefängnis“.
theological_decisions:
- issue: Bezug und Aussagekraft von ἐπὶ πᾶσιν
  choice: Herodes fügte diese Tat allen zuvor genannten bösen Taten hinzu.
  alternative: 'Wörtlicher und weniger eindeutig: „Und zu allem fügte er auch dies hinzu.“'
  rationale: Der unmittelbare Zusammenhang zählt die bösen Taten des Herodes auf. Die Formulierung „zu all dem“ erhält den kumulativen Sinn, ohne zusätzliche theologische Wertung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „fügte … hinzu“ bildet die griechische Aussage klar ab; „auch noch“ unterstreicht ihre kumulative Kraft, ohne den Sinn zu erweitern.
