id: LUK.3.6
reference: Luke 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: de
  text: und alles Fleisch wird das Heil Gottes sehen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Menschen“. Wörtlich steht im Griechischen „alles Fleisch“, in Anlehnung an Jesaja 40,5; gemeint sind hier alle Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das von Gott kommende Heil“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: wird … sehen
  rationale: Die Futurform von ὁράω hat hier einfachen Zukunftssinn. „Wird sehen“ ist natürliches modernes Deutsch und bewahrt die konkrete Bildsprache.
- source_word: πᾶσα σὰρξ
  choice: alles Fleisch
  rationale: Die wörtliche Wiedergabe erhält die prophetische, semitisch geprägte Wendung und den Anklang an Jesaja 40,5. Gemeint sind in diesem Zusammenhang alle Menschen; dies wird in der Fußnote erläutert.
- source_word: τὸ σωτήριον
  choice: das Heil
  rationale: Das substantivisch gebrauchte σωτήριον bezeichnet Gottes Rettung beziehungsweise rettendes Handeln. „Das Heil“ ist im Deutschen knapp, etabliert und bewahrt die theologische wie intertextuelle Weite.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird formal wiedergegeben und lässt offen, ob vor allem Zugehörigkeit oder Herkunft betont ist. „Das von Gott kommende Heil“ ist als auslegende Alternative in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung der Wendung πᾶσα σὰρξ
  choice: Die universale menschliche Reichweite wird durch „alles Fleisch“ ausgedrückt und in der Fußnote als „alle Menschen“ erklärt.
  alternative: Direkt „alle Menschen“ im Haupttext.
  rationale: Der Zusammenhang des Jesajazitats spricht für die gesamte Menschheit. Die wörtliche Wendung im Haupttext wahrt zugleich den Schriftanklang und vermeidet eine unnötige Einebnung.
- issue: Bedeutung des Genitivs τοῦ θεοῦ
  choice: „Gottes“
  alternative: „das von Gott kommende Heil“
  rationale: Der griechische Genitiv kann Zugehörigkeit beziehungsweise Ursprung ausdrücken. Die formale Fassung bewahrt diese Offenheit, während die Fußnote die Herkunftsdeutung sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem griechischen Aussageschwerpunkt, während „das Heil Gottes“ eine natürliche und traditionsbewusste deutsche Formulierung bietet.
