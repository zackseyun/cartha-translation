  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes präzise wieder: καί als anschließendes „und“, das Futur ὄψεται als „wird … sehen“, πᾶσα σάρξ bewusst wörtlich als „alles Fleisch“, τὸ σωτήριον als „das Heil“ und den Genitiv τοῦ θεοῦ als „Gottes“. Die prophetische idiomatische Bedeutung von πᾶσα σάρξ wird zutreffend in der Fußnote erläutert, ohne den Haupttext zu nivellieren.'
  naturalness: „Und alles Fleisch wird das Heil Gottes sehen“ ist verständliches, würdiges modernes Standarddeutsch. Die wörtliche Wendung „alles Fleisch“ ist im laufenden Deutsch markiert, aber als bewusst beibehaltenes Jesaja-Zitat angemessen und durch die Fußnote ausreichend erschlossen.
  terminology: „Heil Gottes“ ist für σωτήριον τοῦ θεοῦ etabliert und bewahrt die weite Bedeutung von Gottes Heil bzw. Rettungshandeln. Die Alternative „das von Gott kommende Heil“ erklärt eine mögliche Herkunftsnuance des Genitivs, ohne sie dem griechischen Text als alleinige Deutung aufzuzwingen.
