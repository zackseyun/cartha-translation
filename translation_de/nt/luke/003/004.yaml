id: LUK.3.4
reference: Luke 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: de
  text: 'wie im Buch der Worte des Propheten Jesaja geschrieben steht: „Eine Stimme ruft in der Wüste[a]: ›Bereitet den Weg des Herrn[b], macht seine Pfade gerade.‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In der Wüste“ kann sich wie hier auf das Rufen beziehen oder auf den folgenden Befehl: „Eine Stimme ruft: ›Bereitet in der Wüste den Weg des Herrn.‹“'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „des HERRN“. Das Zitat greift Jesaja 40,3 auf; dort steht im Hebräischen der Gottesname JHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: wie … geschrieben steht
  rationale: Die feste deutsche Schriftformel gibt das griechische Perfekt idiomatisch wieder und bewahrt den Gedanken fortdauernder Geltung.
- source_word: ἐν βίβλῳ λόγων
  choice: im Buch mit den Worten
  rationale: Diese Formulierung bildet beide griechischen Substantive ab, ohne das im Deutschen missverständliche „Buch der Worte“ zu erzwingen. „Buch“ ist als heutige Bezeichnung des Schriftträgers verständlich; historisch handelte es sich um eine Schriftrolle.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: des Propheten Jesaja
  rationale: Natürliche deutsche Wiedergabe der Genitivverbindung mit der näheren Bezeichnung „Prophet“.
- source_word: Φωνὴ βοῶντος
  choice: Eine Stimme ruft
  rationale: Die natürliche deutsche Formulierung bewahrt das Bild einer hörbaren Stimme und den Vorgang des lauten Rufens. Das im Griechischen substantivierte Partizip wird dabei idiomatisch als Verb ausgedrückt.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige, kontextgerechte Wiedergabe und lässt den prophetischen Hintergrund sowie den Aufenthaltsort des Johannes anklingen.
- source_word: Ἑτοιμάσατε
  choice: Bereitet
  rationale: Der Imperativ wird unmittelbar, würdig und in der Mehrzahl wiedergegeben.
- source_word: τὴν ὁδὸν κυρίου
  choice: den Weg des Herrn
  rationale: Bewahrt die biblische Wegmetapher und gibt den Genitiv natürlich wieder.
- source_word: κυρίου
  choice: Herrn
  rationale: Folgt dem griechischen κύριος. Dass die hebräische Vorlage von Jesaja 40,3 den Gottesnamen JHWH enthält, wird in einer Fußnote transparent gemacht.
- source_word: εὐθείας ποιεῖτε
  choice: macht … gerade
  rationale: Gibt die prädikative Konstruktion und ihren imperativischen Sinn direkt wieder.
- source_word: τὰς τρίβους αὐτοῦ
  choice: seine Pfade
  rationale: „Pfade“ ist eine natürliche, bildhafte Entsprechung zu τρίβοι und wahrt den Parallelismus mit „Weg“.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Jesaja-Zitat, dessen hebräische Vorlage JHWH hat
  choice: Herr
  alternative: der HERR
  rationale: Der Haupttext folgt dem griechischen Wortlaut des Lukas und gibt κύριος mit „Herr“ wieder. Die Fußnote bewahrt zugleich den alttestamentlichen Bezug auf den Gottesnamen, ohne die christologische Spannung des lukanischen Kontexts vorab aufzulösen.
- issue: Zuordnung von „in der Wüste“
  choice: zur rufenden Stimme
  alternative: 'zum anschließenden Befehl: „In der Wüste bereitet den Weg des Herrn“'
  rationale: Wortstellung und unmittelbarer lukanischer Kontext sprechen für die Zuordnung zum Rufen; die syntaktisch und durch Jesaja 40,3 begründbare Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Schriftzitat. Die verschachtelte Zitierung wird durch deutsche Anführungszeichen klar gegliedert; echte syntaktische und theologische Mehrdeutigkeiten werden in Fußnoten offengehalten.
