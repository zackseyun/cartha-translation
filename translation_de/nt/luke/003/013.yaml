  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Treibt nicht mehr ein, als euch vorgeschrieben ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Er
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort; im natürlichen modernen Deutsch muss es nicht eigens wiedergegeben werden.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sagte zu ihnen
  rationale: Die Wendung λέγω + πρός wird direkt und idiomatisch mit »zu jemandem sagen« wiedergegeben.
- source_word: Μηδὲν πλέον
  choice: nicht mehr
  rationale: Die Formulierung untersagt jeden über das festgesetzte Maß hinausgehenden Betrag.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: als euch vorgeschrieben ist
  rationale: Das Perfekt Passiv von διατάσσω bezeichnet eine verbindliche amtliche Festsetzung; »vorgeschrieben ist« bewahrt sowohl den passiven als auch den regulatorischen Sinn.
- source_word: πράσσετε
  choice: Treibt … ein
  rationale: πράσσω kann allgemein »tun« bedeuten, bezeichnet im unmittelbaren Kontext der Zolleinnehmer jedoch das Einziehen von Abgaben. »eintreiben« macht die kontextuell vorausgesetzte Tätigkeit im Deutschen klar, ohne zusätzliche Sachinformation einzuführen.
theological_decisions:
- issue: Kontextuelle Präzisierung der in πράσσετε vorausgesetzten Tätigkeit
  choice: »Treibt nicht mehr ein«
  alternative: »Tut nichts über das hinaus«
  rationale: Der Wortlaut des Verbs ist allgemein, doch die Angesprochenen sind nach Vers 12 Zolleinnehmer. Die konkrete Wiedergabe ist im Deutschen natürlich und hält den Bezug auf ihre Einziehungstätigkeit fest, ohne eine theologische Streitfrage zu entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Vorgeschrieben« vermittelt den amtlich-rechtlichen Ton; »eintreiben« ist im Zusammenhang mit Abgaben idiomatisch.
