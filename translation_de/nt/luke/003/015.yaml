id: LUK.3.15
reference: Luke 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: de
  text: Während das Volk voller Erwartung war und alle in ihren Herzen überlegten, ob Johannes vielleicht selbst der Messias[a] sei,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“. Griechisch: ho christos.'
    reason: Alternative, stärker formale Wiedergabe des messianischen Titels.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: voller Erwartung war
  rationale: Der Genitivus absolutus setzt den zeitlichen Hintergrund; die Formulierung gibt den anhaltenden Zustand gespannter Erwartung natürlich wieder.
- source_word: δὲ
  choice: unmarkiert im Satzanschluss
  rationale: δέ ist hier ein schwacher narrativer Anschluss. Im Deutschen trägt „Während“ den Übergang ausreichend, sodass ein zusätzliches „nun“ unnötig wäre.
- source_word: τοῦ λαοῦ
  choice: das Volk
  rationale: λαός bezeichnet die Menschen als Kollektiv und kann bei Lukas zugleich den biblisch-israelitischen Resonanzraum bewahren.
- source_word: διαλογιζομένων πάντων
  choice: alle … überlegten
  rationale: διαλογίζομαι bezeichnet hier inneres Erwägen; „überlegten“ ist modern und wahrt zusammen mit der Herz-Formulierung den reflektierenden Sinn.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: in ihren Herzen
  rationale: Die wörtliche Wendung ist im Deutschen verständlich und bewahrt die biblische Vorstellung des Herzens als Ort inneren Denkens und Erwägens.
- source_word: περὶ τοῦ Ἰωάννου
  choice: über Johannes
  rationale: περί mit Genitiv bezeichnet den Gegenstand ihres Nachdenkens.
- source_word: μήποτε … εἴη
  choice: ob … vielleicht … sei
  rationale: „ob vielleicht“ wahrt die Unsicherheit von μήποτε; der Konjunktiv „sei“ gibt die indirekte Erwägung und den Möglichkeitscharakter des Optativs angemessen wieder.
- source_word: αὐτὸς
  choice: Johannes
  rationale: Das betonte Pronomen bezieht sich auf Johannes. Die Wiederholung seines Namens ist im Deutschen klarer als „er selbst“ und vermeidet einen missverständlichen Fokus.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: χριστός ist hier eindeutig ein erwarteter Titel. „Messias“ bewahrt den jüdischen Erwartungshorizont; die wörtlichere Titelwiedergabe steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von ὁ χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Die Menge erwägt, ob Johannes der erwartete Gesalbte sei. „Messias“ macht die Titelfunktion im heutigen Deutsch unmittelbar verständlich, ohne die Identitätsfrage theologisch vorzuentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im griechischen Text syntaktisch offen und führt mit einem Komma in den folgenden Vers weiter. Die innere Erwägung wird bildhaft als Geschehen „in ihren Herzen“ bewahrt.
