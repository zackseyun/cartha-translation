  text: Καὶ ἐπηρώτων αὐτὸν οἱ ὄχλοι λέγοντες· Τί οὖν ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: de
  text: 'Und die Menschenmengen fragten ihn immer wieder: „Was sollen wir also tun?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: fragten … immer wieder
  rationale: Der Imperfekt bezeichnet hier ein fortdauerndes oder wiederholtes Fragen; „immer wieder“ macht diesen Aspekt in natürlichem Deutsch deutlich.
- source_word: οἱ ὄχλοι
  choice: die Menschenmengen
  rationale: Der Plural wird bewahrt und bezeichnet die versammelten Gruppen von Menschen; „Menschenmengen“ ist verständlicher und genauer als ein singularisches „das Volk“.
- source_word: λέγοντες
  choice: durch direkte Rede ohne eigenes „sagten“ wiedergegeben
  rationale: Im Deutschen kann die direkte Rede den Inhalt des partizipial angeschlossenen Sagens natürlich einführen; ein zusätzliches „und sagten“ wäre schwerfälliger.
- source_word: Τί οὖν
  choice: Was … also
  rationale: „Also“ bewahrt die folgernde Funktion von οὖν und verbindet die Frage mit der vorangehenden Aufforderung des Johannes.
- source_word: ποιήσωμεν
  choice: sollen wir tun
  rationale: Der deliberative Aorist Konjunktiv wird idiomatisch als Frage nach dem angemessenen Handeln wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Fragens wird ausdrücklich markiert; die direkte Rede bleibt knapp und natürlich.
