lexical_decisions:
- source_word: τοῦ
  choice: des
  rationale: Der wiederholte Genitivartikel führt elliptisch die Abstammungsreihe aus dem Kontext fort. Das deutsche „des“ bewahrt diese knappe Form und ist innerhalb der fortlaufenden Genealogie verständlich.
- source_word: Μάαθ
  choice: Maath
  rationale: Der Personenname wird entsprechend der griechischen Form transliteriert.
- source_word: Ματταθίου
  choice: Mattathias
  rationale: Die Genitivform geht auf Ματταθίας zurück; „Mattathias“ ist die im Deutschen erkennbare und griechischnahe Namensform.
- source_word: Σεμεῒν
  choice: Semeïn
  rationale: Die Schreibung folgt der griechischen Namensform; das Trema zeigt an, dass e und i getrennt gesprochen werden.
- source_word: Ἰωσὴχ
  choice: Josech
  rationale: „Josech“ bildet die griechische Form einschließlich des abschließenden Chi unmittelbar ab.
- source_word: Ἰωδὰ
  choice: Joda
  rationale: „Joda“ ist eine direkte Transliteration der im SBLGNT gebotenen griechischen Namensform.
theological_decisions: []
translation_notes:
  register: Knappe, würdige genealogische Reihung. Die elliptische Wiederholung von τοῦ wird mit „des“ erhalten, statt bei jedem Namen „Sohn des“ einzufügen; der Zusammenhang der Ahnenreihe macht die Beziehung deutlich.
