  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: de
  text: Mit vielen weiteren Ermahnungen[a] verkündete er also dem Volk die gute Nachricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Während er sie zu vielem anderen ermahnte«. Im Griechischen bleibt unausgesprochen, worauf sich »vieles weitere« bezieht.'
    reason: lexikalische Alternative und Bewahrung einer grammatischen Mehrdeutigkeit
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: mit vielen weiteren Ermahnungen
  rationale: Das substantivisch gebrauchte Neutrum Plural lässt den Gegenstand unausgesprochen. Die Wiedergabe verbindet es natürlich mit dem folgenden Partizip, ohne die Bedeutung auf bloße »Worte« einzuengen.
- source_word: μὲν οὖν
  choice: also
  rationale: »Also« kennzeichnet knapp die fortführende und folgernde Übergangsfunktion der Partikelverbindung.
- source_word: παρακαλῶν
  choice: mit ... Ermahnungen
  rationale: Im Zusammenhang der prophetischen Verkündigung des Johannes bezeichnet παρακαλέω eindringliches Ermahnen und Aufrufen; die nominale Form ergibt zusammen mit Πολλὰ ... ἕτερα natürliches Deutsch.
- source_word: εὐηγγελίζετο
  choice: verkündete ... die gute Nachricht
  rationale: Die Form bezeichnet eine in der Vergangenheit fortlaufende Tätigkeit. »Die gute Nachricht verkünden« bewahrt ausdrücklich den Evangeliumscharakter, den Lukas der Botschaft des Johannes zuschreibt.
- source_word: τὸν λαόν
  choice: dem Volk
  rationale: »Volk« entspricht λαός und bewahrt mögliche gemeinschaftliche beziehungsweise bundesgeschichtliche Anklänge, ohne den Bezug ausdrücklich auf Israel einzuengen.
theological_decisions:
- issue: Charakter der Verkündigung des Johannes in εὐηγγελίζετο
  choice: verkündete ... die gute Nachricht
  alternative: predigte / verkündete
  rationale: Der griechische Text bezeichnet selbst die ermahnende Botschaft des Johannes als gute Nachricht. Diese Spannung wird nicht zu einer bloß allgemeinen Predigttätigkeit abgeschwächt.
- issue: Unausgesprochenes Bezugswort von Πολλὰ ... καὶ ἕτερα
  choice: Ermahnungen
  alternative: Dinge / Worte
  rationale: Der Zusammenhang mit παρακαλῶν stützt »Ermahnungen«, doch da das Griechische das Bezugswort nicht ausdrücklich nennt, wird die offenere Alternative in einer Fußnote festgehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist gut verständlich und hält zugleich den Zusammenhang zwischen den zahlreichen Ermahnungen und der Verkündigung der guten Nachricht fest.
