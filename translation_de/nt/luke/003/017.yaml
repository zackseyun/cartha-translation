id: LUK.3.17
reference: Luke 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: de
  text: Er hat die Worfschaufel in der Hand, um seine Tenne gründlich zu reinigen und den Weizen in seine Scheune einzusammeln; die Spreu aber wird er mit unauslöschlichem Feuer verbrennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Feuer, das sich nicht löschen lässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: Worfschaufel
  rationale: Bezeichnet das Gerät, mit dem das gedroschene Getreide zum Worfeln in die Luft geworfen wurde. „Worfschaufel“ ist im Deutschen sachlich genauer als das traditionelle, heute missverständliche „Wurfschaufel“ oder „Worfel“.
- source_word: διακαθᾶραι
  choice: gründlich zu reinigen
  rationale: Das zusammengesetzte Verb bezeichnet ein vollständiges beziehungsweise gründliches Säubern und passt natürlich zum Bild der Tenne.
- source_word: ἅλωνα
  choice: Tenne
  rationale: Der übliche präzise Ausdruck für den Platz, an dem Getreide gedroschen und geworfelt wurde.
- source_word: συναγαγεῖν
  choice: zu sammeln
  rationale: Gibt das Zusammenbringen des ausgesonderten Getreides schlicht und treffend wieder.
- source_word: σῖτον
  choice: den Weizen
  rationale: Im Gegensatz zur Spreu bezeichnet der Ausdruck hier das nutzbare Getreide; „Weizen“ entspricht der naheliegenden konkreten Bedeutung im Bild.
- source_word: ἀποθήκην
  choice: Scheune
  rationale: Bezeichnet einen Vorrats- oder Lagerraum. „Scheune“ ist in diesem landwirtschaftlichen Zusammenhang natürlich und verständlich, ohne eine weitergehende Deutung einzutragen.
- source_word: ἄχυρον
  choice: die Spreu
  rationale: Im Zusammenhang des Worfelns ist „Spreu“ der sachgerechte Ausdruck für die vom Getreide getrennten wertlosen Bestandteile.
- source_word: κατακαύσει
  choice: wird er … verbrennen
  rationale: Das Verb bezeichnet intensives beziehungsweise vollständiges Verbrennen. Im Deutschen trägt „verbrennen“ im Zusammenhang bereits den Sinn des Vernichtens durch Feuer.
- source_word: πυρὶ ἀσβέστῳ
  choice: in unauslöschlichem Feuer
  rationale: Bewahrt die Aussage, dass das Feuer nicht gelöscht werden kann, und erhält die scharfe Gerichtssprache des Ausgangstextes.
- source_word: οὗ
  choice: Er hat
  rationale: Das griechische Relativpronomen knüpft an den zuvor genannten Kommenden an. Die selbstständige deutsche Formulierung ist natürlich und bewahrt den Bezug, ohne ein schwerfälliges „dessen“.
theological_decisions:
- issue: Gerichtsbild der Trennung von Weizen und Spreu
  choice: Das Bild von Sammlung und Verbrennung wird ohne Abschwächung wiedergegeben, aber nicht über die Aussage des Verses hinaus dogmatisch ausgedeutet.
  alternative: Das Bild ausdrücklich entweder nur auf ein zeitliches Gericht über Israel oder vollständig auf eine systematisierte Lehre vom Endgericht und der Hölle festzulegen.
  rationale: Der Text selbst stellt rettende Sammlung und vernichtendes Gericht nebeneinander. Die Übersetzung bewahrt diese Spannung und lässt Reichweite und genaue Ausgestaltung des Gerichts offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die landwirtschaftlichen Fachwörter „Worfschaufel“, „Tenne“ und „Spreu“ sind für die Bildwelt präzise; der Satzbau bleibt zugleich klar und allgemein verständlich.
