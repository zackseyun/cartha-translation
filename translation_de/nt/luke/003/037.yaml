  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: de
  text: des Methusalah, des Henoch, des Jared, des Mahalalel, des Kenan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: des
  rationale: Der wiederholte Genitivartikel setzt im Zusammenhang die genealogische Reihe elliptisch fort. Das knappe deutsche „des“ bewahrt die Form einer fortlaufenden Abstammungsliste; die Ergänzung „Sohn“ ergibt sich aus dem vorangehenden Kontext.
- source_word: Μαθουσαλὰ
  choice: Methusala
  rationale: Verwendet die im modernen deutschen Bibelgebrauch vertraute Namensform der entsprechenden Gestalt aus Genesis.
- source_word: Ἑνὼχ
  choice: Henoch
  rationale: Die etablierte deutsche biblische Namensform erleichtert die Wiedererkennung.
- source_word: Ἰάρετ
  choice: Jered
  rationale: Die vertraute deutsche Form entspricht der Namenskonvention in den alttestamentlichen Geschlechtsregistern.
- source_word: Μαλελεὴλ
  choice: Mahalalel
  rationale: Die gebräuchliche deutsche Form des Namens aus Genesis wird gegenüber einer bloßen Umschrift des griechischen Μαλελεήλ bevorzugt.
- source_word: Καϊνὰμ
  choice: Kenan
  rationale: Die vertraute deutsche biblische Namensform gibt Καϊνάμ wieder. Der Name bleibt entsprechend dem griechischen Text ausdrücklich in der Reihe stehen.
theological_decisions:
- issue: Genealogische Ellipse durch wiederholte Genitive
  choice: Die Reihe mit wiederholtem „des“ fortführen
  alternative: Bei jedem Namen „Sohn des“ ergänzen
  rationale: Im Zusammenhang ist das Abstammungsverhältnis eindeutig. Die knappe Genitivreihe entspricht der griechischen Struktur und klingt innerhalb des fortlaufenden deutschen Satzes natürlich.
- issue: Wiedergabe von Καϊνάμ
  choice: Den Namen als „Kenan“ in den Haupttext aufnehmen
  alternative: Kainan oder Kainan mit harmonisierender Deutung
  rationale: SBLGNT enthält Καϊνάμ; deshalb darf der Name nicht aufgrund alttestamentlicher Vergleichsstellen ausgelassen oder stillschweigend harmonisiert werden. „Kenan“ ist die geläufige deutsche Namensform.
translation_notes:
  register: Knapper, würdevoller Registerstil eines Geschlechtsregisters. Die vertrauten deutschen Bibelnamen fördern Lesbarkeit und Wiedererkennung; die wiederholten Genitive bewahren zugleich die Struktur des griechischen Ausgangstextes.
