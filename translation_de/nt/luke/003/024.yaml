  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: de
  text: Sohn von Mattat[a], Sohn von Levi, Sohn von Melchi, Sohn von Jannai, Sohn von Josef,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „des Mattat, des Levi, des Melchi, des Jannai, des Josef“. Im Griechischen wird die Geschlechtsfolge mit wiederholten Genitiven fortgesetzt; „Sohn“ ist aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: Sohn des
  rationale: Der wiederholte Genitivartikel setzt in diesem Stammbaum elliptisch das aus dem Zusammenhang erschlossene Abstammungsverhältnis fort. „Sohn des“ macht diese Beziehung im Deutschen verständlich.
- source_word: Μαθθὰτ
  choice: Mattat
  rationale: Zeitgemäße deutsche Transliteration des Personennamens; die Schreibung „Mattat“ ist im Deutschen geläufig und gibt die griechische Form angemessen wieder.
- source_word: Λευὶ
  choice: Levi
  rationale: Geläufige deutsche Form des Personennamens Λευί.
- source_word: Μελχὶ
  choice: Melchi
  rationale: Nahe Transliteration des griechischen Personennamens Μελχί und im Deutschen gut lesbar.
- source_word: Ἰανναὶ
  choice: Jannai
  rationale: Die Transliteration „Jannai“ bewahrt die griechische Namensform Ἰανναί genauer als die vereinfachte Form „Janna“.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Geläufige moderne deutsche Form des Personennamens Ἰωσήφ.
theological_decisions:
- issue: Ellipse in der Geschlechtsfolge
  choice: Vor jedem Namen wird sinngemäß „Sohn des“ ergänzt.
  alternative: 'Die bloße Genitivfolge formal wiedergeben: „des Mattat, des Levi, des Melchi, des Jannai, des Josef“.'
  rationale: Der griechische Vers führt die Geschlechtsfolge mit wiederholten Genitiven fort und setzt die Sohn-Beziehung aus dem Kontext voraus. Ihre ausdrückliche Wiedergabe schafft im Deutschen Klarheit, ohne zusätzliche Abstammungsangaben einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihung und das abschließende Komma zeigen, dass die Geschlechtsfolge weitergeht.
