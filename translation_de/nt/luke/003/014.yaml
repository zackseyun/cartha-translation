id: LUK.3.14
reference: Luke 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: de
  text: 'Auch Soldaten fragten ihn: »Und wir, was sollen wir tun?« Er sagte zu ihnen: »Erpresst niemanden und beschuldigt niemanden zu Unrecht. Begnügt euch mit eurem Sold[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Sold« kann hier auch die den Soldaten zustehende Bezahlung oder Versorgung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: Soldaten
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Militärdienst leisten; »Soldaten« ist im Deutschen natürlich und kontextgenau.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Und wir, was sollen wir tun?
  rationale: Die deliberative Frage wird mit »sollen« wiedergegeben. Das vorangestellte »Und wir« bewahrt die ausdrückliche Betonung von καὶ ἡμεῖς und klingt zugleich natürlich.
- source_word: διασείσητε
  choice: Erpresst niemanden
  rationale: Das Verb kann wörtlich gewaltsames Schütteln oder Einschüchtern bezeichnen und meint hier die missbräuchliche Ausübung von Zwang zum eigenen Vorteil. »Erpressen« bringt diesen Sinn knapp und verständlich zum Ausdruck.
- source_word: συκοφαντήσητε
  choice: beschuldigt niemanden zu Unrecht
  rationale: Das Verb bezeichnet hier eine falsche oder unrechtmäßige Anschuldigung; die Formulierung wahrt diesen Sinn, ohne die engere Bedeutung »erpressen« oder »verleumden« festzulegen.
- source_word: ἀρκεῖσθε
  choice: Begnügt euch
  rationale: Der Imperativ fordert eine anhaltende Haltung der Genügsamkeit; »sich begnügen« gibt dies prägnant und idiomatisch wieder.
- source_word: ὀψωνίοις
  choice: Sold
  rationale: ὀψώνιον bezeichnete besonders die Bezahlung oder Versorgung von Soldaten. »Sold« ist im militärischen Zusammenhang die präziseste deutsche Entsprechung; der weitere Bedeutungsumfang wird in der Fußnote genannt.
theological_decisions:
- issue: Ethische Weisung an Soldaten
  choice: Johannes spricht die Soldaten in ihrer bestehenden Tätigkeit an und verbietet Machtmissbrauch, falsche Beschuldigungen und Habgier.
  alternative: Der Vers fordere ausdrücklich, den Militärdienst aufzugeben, oder billige militärische Gewalt grundsätzlich.
  rationale: Der griechische Text enthält weder einen Befehl, den Militärdienst zu verlassen, noch eine umfassende Bewertung des Soldatenberufs. Die Übersetzung beschränkt sich daher auf die ausdrücklich genannten ethischen Weisungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und verständlicher Rede. Die ausdrückliche Hervorhebung von καὶ ἡμεῖς bleibt durch »Und wir« erhalten. »Sold« bewahrt den militärischen Kontext; eine Fußnote nennt den weiteren Bedeutungsumfang.
