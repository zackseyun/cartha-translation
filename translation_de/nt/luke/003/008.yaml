  variant: modern standard German
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: de
  text: 'Bringt also Früchte hervor, die der Umkehr entsprechen[a], und fangt nicht an, untereinander zu sagen[b]: »Wir haben Abraham zum Vater.« Denn ich sage euch: Gott kann Abraham aus diesen Steinen Kinder hervorbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Früchte, die der Umkehr würdig sind«; auch: »Früchte, die zur Umkehr passen«. Im Griechischen steht »Früchte« im Plural und bezeichnet ein Verhalten, das echter Umkehr entspricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »bei euch selbst« oder »in euch selbst«. Die griechische Wendung kann sowohl inneres Selbstgespräch als auch das Reden innerhalb der eigenen Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: Bringt … hervor
  rationale: Der Aoristimperativ fordert zu entschiedenem Handeln auf. In Verbindung mit »Früchte« gibt »hervorbringen« das griechische ποιεῖν im heutigen Deutsch natürlich wieder.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Warnung und entspricht dem natürlichen deutschen Satzanschluss.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: Früchte, die der Umkehr entsprechen
  rationale: Bewahrt den griechischen Plural und drückt aus, dass das Verhalten mit echter Umkehr übereinstimmen soll. »Umkehr« erfasst hier die Neuausrichtung des Denkens und Lebens; »entsprechen« vermeidet die mögliche Fehlvorstellung, die Früchte würden Vergebung verdienen.
- source_word: μὴ ἄρξησθε λέγειν
  choice: fangt nicht an … zu sagen
  rationale: Gibt die Konstruktion aus ἄρχομαι und Infinitiv direkt wieder und erhält die Warnung, diese selbstrechtfertigende Behauptung gar nicht erst vorzubringen.
- source_word: ἐν ἑαυτοῖς
  choice: untereinander
  rationale: Passt zum reflexiven Plural und bezeichnet wahrscheinlich das Reden innerhalb der Gruppe, ohne die ebenfalls mögliche Bedeutung innerer Selbstrede auszuschließen; diese wird in der Fußnote genannt.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Wir haben Abraham zum Vater
  rationale: Bewahrt die betonte Berufung auf die Abstammung von Abraham in knapper, idiomatischer Form.
- source_word: λέγω γὰρ ὑμῖν
  choice: Denn ich sage euch
  rationale: Erhält die feierliche Aussageformel sowie die begründende Funktion von γάρ.
- source_word: δύναται ὁ θεὸς
  choice: Gott kann
  rationale: Gibt die Aussage über Gottes Fähigkeit klar und ohne Bedeutungsverlust in modernem Deutsch wieder.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: Abraham aus diesen Steinen Kinder erwecken
  rationale: »Erwecken« bewahrt das Bild von ἐγείρω und lässt Gottes Macht anklingen, Kinder für Abraham entstehen zu lassen. Die Wortstellung macht die Zuordnung zu Abraham deutlich.
theological_decisions:
- issue: Bedeutung der Früchte, die der Umkehr entsprechen
  choice: Die Früchte sind sichtbare Handlungen, die mit echter Umkehr übereinstimmen und sie erkennen lassen.
  alternative: Wörtlicher wäre »Früchte, die der Umkehr würdig sind«; idiomatisch ist auch »Früchte, wie sie der Umkehr entsprechen« möglich.
  rationale: ἀξίους bezeichnet hier Angemessenheit oder Entsprechung. Die Formulierung erhält den Zusammenhang von innerer Umkehr und äußerem Verhalten, ohne zu behaupten, dass diese Handlungen Vergebung verdienen.
- issue: Bedeutung der Abstammung von Abraham
  choice: Johannes weist das Vertrauen zurück, körperliche Abstammung von Abraham sichere für sich genommen die Stellung vor Gott.
  alternative: Der Satz könnte enger nur als Warnung vor einer bestimmten selbstgefälligen Aussage verstanden werden.
  rationale: Die Gegenüberstellung mit Gottes Fähigkeit, Abraham sogar aus Steinen Kinder zu erwecken, unterstreicht Gottes Freiheit gegenüber menschlichen Abstammungsansprüchen, ohne spätere Lehrformulierungen in den Text einzutragen.
- issue: Bedeutung von ἐν ἑαυτοῖς
  choice: Im Haupttext wird das Reden innerhalb der eigenen Gruppe ausgedrückt.
  alternative: 'Die Wendung kann auch inneres Reden bedeuten: »bei euch selbst« oder »in euch selbst«.'
  rationale: Der griechische Ausdruck lässt beide Möglichkeiten zu. Die Übersetzung wählt die im Gruppenkontext natürliche Lesart und hält die andere durch eine Fußnote offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderung bleibt unmittelbar und eindringlich; traditionelle biblische Begriffe werden nur dort verwendet, wo sie verständlich und sachlich treffend sind. »Umkehr« ist im heutigen Deutsch klarer und umfassender als das stärker kirchlich geprägte »Buße«.
