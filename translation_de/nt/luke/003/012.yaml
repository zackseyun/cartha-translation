source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: de
  text: 'Auch Zolleinnehmer kamen, um sich taufen zu lassen, und sagten zu ihm: »Lehrer, was sollen wir tun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: kamen
  rationale: Der Aorist von ἔρχομαι wird hier natürlich als einfaches vergangenes Geschehen wiedergegeben.
- source_word: δὲ καὶ τελῶναι
  choice: Auch Zolleinnehmer
  rationale: δέ führt die Erzählung fort, während καί die Zolleinnehmer ausdrücklich in den Kreis der Kommenden einschließt. »Auch« bewahrt diese additive, im Kontext auffällige Betonung, ohne eine stärkere Wertung einzutragen.
- source_word: βαπτισθῆναι
  choice: um sich taufen zu lassen
  rationale: Der passive Aoristinfinitiv nach ἦλθον bezeichnet den Zweck ihres Kommens. Die deutsche Wendung gibt sowohl den Zweck als auch den passiven Sinn idiomatisch wieder.
- source_word: εἶπαν πρὸς αὐτόν
  choice: sagten zu ihm
  rationale: Die Formulierung bleibt nahe bei λέγω mit πρός; dass es sich um eine Frage handelt, ergibt sich aus dem folgenden Satz.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die direkte Anrede übersetzt διδάσκαλος klar und ohne zusätzliche Amts- oder Autoritätskonnotationen.
- source_word: τί ποιήσωμεν
  choice: was sollen wir tun?
  rationale: Der deliberative Aoristkonjunktiv fragt nach dem gebotenen praktischen Handeln; »sollen« gibt dies in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Einbeziehung einer gesellschaftlich und moralisch belasteten Berufsgruppe in den Ruf zur Umkehr
  choice: »Auch Zolleinnehmer« bewahrt die ausdrückliche Einbeziehung der Gruppe.
  alternative: »Sogar Zolleinnehmer« würde die überraschende Wirkung stärker hervorheben.
  rationale: Das griechische καί trägt eine additive und möglicherweise emphatische Nuance. »Auch« erhält die sichere Bedeutung, ohne die soziale Wertung durch »sogar« stärker festzulegen, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zolleinnehmer« ist historisch passender als das modern-behördliche »Steuereintreiber«. Die reflexive Umschreibung »sich taufen zu lassen« ist im Deutschen die natürliche Wiedergabe des griechischen Passivs.
