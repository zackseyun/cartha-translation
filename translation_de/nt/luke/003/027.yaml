lexical_decisions:
- source_word: τοῦ
  choice: des
  rationale: Der wiederholte Genitivartikel setzt die in Lukas 3,23 eingeführte Abstammungsformel elliptisch fort. Die knappe Genitivreihe ist im Deutschen verständlich und bewahrt die Form des griechischen Textes, ohne in jedem Glied „Sohn“ zu ergänzen.
- source_word: Ἰωανὰν
  choice: Johanan
  rationale: Die im Deutschen etablierte biblische Namensform gibt den griechischen Eigennamen wieder und bleibt zugleich anschlussfähig an die hebräische Namenstradition.
- source_word: Ῥησὰ
  choice: Resa
  rationale: Eine natürliche deutsche Umschrift des griechischen Eigennamens; das anlautende griechische Rho erfordert im Deutschen kein „Rh“.
- source_word: Ζοροβαβὲλ
  choice: Serubbabel
  rationale: Die etablierte deutsche biblische Namensform erleichtert die Wiedererkennung der aus dem Alten Testament bekannten Person.
- source_word: Σαλαθιὴλ
  choice: Schealtiël
  rationale: Die etablierte deutsche Form des alttestamentlichen Namens stellt den kanonischen Zusammenhang her; der griechischen Form entspricht bei direkter Umschrift „Salathiel“.
- source_word: Νηρὶ
  choice: Neri
  rationale: Schlichte und im Deutschen natürliche Umschrift des griechischen Eigennamens.
theological_decisions:
- issue: Elliptische Abstammungsformel
  choice: Die Namen als fortlaufende Genitivreihe mit „des“ wiedergeben.
  alternative: Bei jedem Namen ausdrücklich „Sohn des“ ergänzen.
  rationale: Der griechische Text wiederholt lediglich τοῦ; das genealogische Verhältnis ergibt sich aus der in Vers 23 eröffneten Konstruktion. Die deutsche Genitivreihe bewahrt diese Ellipse und bleibt im Zusammenhang verständlich.
- issue: Identifizierung von Σαλαθιὴλ
  choice: Die traditionelle deutsche Form „Schealtiël“ im Haupttext verwenden und die griechische Lautform in einer Fußnote nennen.
  alternative: Den Namen unmittelbar als „Salathiel“ transliterieren.
  rationale: Damit bleibt die Verbindung zur alttestamentlichen Namenstradition erkennbar, ohne die abweichende griechische Namensform zu verschweigen.
translation_notes:
  register: Knappe, würdevolle genealogische Formulierung in modernem Standarddeutsch. Die etablierten deutschen Bibelnamen werden bevorzugt; genuine Unterschiede zwischen griechischer Lautform und alttestamentlicher Namenstradition werden transparent gemacht.
