  text: des Joanan[a], des Resa, des Serubbabel, des Schealtiël[b], des Neri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht vor jedem Namen lediglich „des“; das Abstammungsverhältnis ergibt sich aus der in Vers 23 begonnenen Geschlechtsfolge.
