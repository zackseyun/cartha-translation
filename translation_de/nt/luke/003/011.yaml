source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: de
  text: 'Er antwortete ihnen: »Wer zwei Untergewänder[a] hat, soll mit dem teilen, der keines hat; und wer zu essen hat, soll ebenso teilen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein χιτών war ein grundlegendes Kleidungsstück, das direkt am Körper getragen wurde; je nach Zusammenhang kann man auch mit »Leibrock« oder »Gewand« übersetzen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Er antwortete ihnen
  rationale: Die Partizipialkonstruktion mit dem Imperfekt leitet Johannes’ Erwiderung ein. Im Deutschen gibt die finite Form den Sinn natürlich und knapp wieder; δέ ist hier ein schwacher Erzählanschluss und muss nicht eigens übersetzt werden.
- source_word: Ὁ ἔχων
  choice: Wer ... hat
  rationale: Das substantivierte Partizip ist allgemein und repräsentativ gebraucht. „Wer“ gibt diese generische Aussage im modernen Deutschen natürlich und ohne unnötige Geschlechtsmarkierung wieder.
- source_word: δύο χιτῶνας
  choice: zwei Untergewänder
  rationale: χιτών bezeichnet ein am Körper getragenes Grund- bzw. Untergewand, nicht einen modernen Mantel. „Untergewänder“ ist sachlich verständlich; die Fußnote erläutert den historischen Gegenstand.
- source_word: μεταδότω
  choice: soll mit ... teilen
  rationale: Der Imperativ der dritten Person fordert zum Abgeben bzw. Anteilgeben auf. „Soll ... teilen“ bewahrt die Aufforderungskraft und klingt im Deutschen natürlicher als „der teile“.
- source_word: τῷ μὴ ἔχοντι
  choice: mit dem ..., der keines hat
  rationale: Das fehlende Objekt ist aus χιτῶνας zu ergänzen. „Keines“ stellt den Bezug auf ein Untergewand eindeutig her.
- source_word: βρώματα
  choice: zu essen
  rationale: Der Plural bezeichnet Lebensmittel bzw. Nahrung. Die idiomatische Wendung „wer zu essen hat“ ist im Deutschen klar und schließt verschiedene Arten von Nahrung ein.
- source_word: ὁμοίως ποιείτω
  choice: soll es ebenso machen
  rationale: Die Formulierung überträgt dieselbe Aufforderung auf Nahrung und bewahrt die Parallelität des griechischen Satzes.
theological_decisions:
- issue: Generischer maskuliner Singular
  choice: Wer ... hat
  alternative: Derjenige, der ... hat / Wer auch immer ... hat
  rationale: Die griechischen maskulinen Singularformen bezeichnen allgemein jede betroffene Person. Das deutsche „wer“ bewahrt den generischen Umfang, ohne das Gebot auf Männer einzugrenzen.
- issue: Stärke der Aufforderung
  choice: soll ... teilen / soll es ebenso machen
  alternative: muss ... teilen / der teile
  rationale: Die Imperative sind verbindliche ethische Aufforderungen. „Soll“ bringt dies in modernem, würdigem Deutsch zum Ausdruck, ohne eine zusätzliche Nuance äußerer Zwangsläufigkeit einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Mahnton. Die direkte Rede behält die parallele Struktur der beiden Aufforderungen bei.
