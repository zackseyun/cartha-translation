review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Aufforderung, ein zweites χιτών mit einer Person ohne ein solches Kleidungsstück zu teilen, sowie die entsprechende Aufforderung hinsichtlich βρώματα sachgerecht wieder. »Untergewänder« ist als kontextuell erläuterte Wiedergabe von χιτῶνας vertretbar. Die Formulierung »soll es ebenso machen« ist jedoch im Deutschen nicht eindeutig genug: Das Pronomen »es« kann sich oberflächlich auf das Essen beziehen, während ὁμοίως ποιείτω die zuvor genannte Handlung des Teilens auf Nahrung überträgt.'
  naturalness: Der Satz ist insgesamt modernes Standarddeutsch und im passenden knappen, mahnenden Register gehalten. »soll ebenso teilen« ist idiomatischer und stellt die beabsichtigte Parallele ohne missverständliches Pronomen her.
  terminology: »Untergewänder« mit kulturgeschichtlicher Fußnote bewahrt die konkrete Bedeutung von χιτών besser als ein anachronistisches »Shirt« oder ein zu allgemeines »Kleidung«. »Wer« gibt den generischen Singular angemessen wieder. Die Aufforderungsstärke von »soll« ist für die Imperative im deutschen Bibelstil angemessen.
  issues:
