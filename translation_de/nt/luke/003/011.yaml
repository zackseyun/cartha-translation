  rationale: Die einzige Änderung ersetzt die potenziell missverständliche Wendung »soll es ebenso machen« durch »soll ebenso teilen«. Dadurch wird die im Griechischen durch ὁμοίως ausgedrückte Wiederaufnahme der Handlung μεταδίδωμι klar und natürlich wiedergegeben, ohne zusätzliche Deutung einzutragen.
