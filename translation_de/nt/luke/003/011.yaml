    issue: Unklare Rückverweisung in »soll es ebenso machen«
    rationale: ὁμοίως ποιείτω bedeutet, dass die Person mit Nahrung in entsprechender Weise handeln, also Nahrung teilen soll. »Es« kann im Deutschen fälschlich als Bezug auf »zu essen« verstanden werden; »soll ebenso teilen« macht die Ellipse eindeutig und bewahrt die Parallelität.
  revised_text: 'Er antwortete ihnen: »Wer zwei Untergewänder[a] hat, soll mit dem teilen, der keines hat; und wer zu essen hat, soll ebenso teilen.«'
