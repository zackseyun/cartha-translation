  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: de
  text: Jede Schlucht wird aufgefüllt werden[a], und jeder Berg und Hügel wird abgetragen werden. Was krumm ist, wird gerade werden, und die rauen Wege werden zu ebenen Straßen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jedes Tal wird aufgefüllt werden“. Das griechische Wort kann ein Tal, eine Schlucht oder einen Hohlweg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Diese Worte greifen Jesaja 40,4 auf und beschreiben mit dem Bild des Straßenbaus, wie der Weg des Herrn vorbereitet wird.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Jede Schlucht
  rationale: φάραγξ bezeichnet ein Tal, eine Schlucht oder einen Hohlweg. „Schlucht“ bildet den Gegensatz zu Berg und Hügel anschaulich ab und wahrt das konkrete Landschaftsbild.
- source_word: πληρωθήσεται
  choice: wird aufgefüllt werden
  rationale: Das Futur Passiv von πληρόω beschreibt hier das Auffüllen einer Vertiefung. „Aufgefüllt“ ist im modernen Deutschen für Erd- und Straßenarbeiten präziser als das bloße „gefüllt“.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: jeder Berg und Hügel
  rationale: Die beiden ähnlichen, aber unterscheidbaren Geländeformen bleiben erhalten; ὄρος bezeichnet den Berg, βουνός die kleinere Erhebung beziehungsweise den Hügel.
- source_word: ταπεινωθήσεται
  choice: wird abgetragen werden
  rationale: Im topografischen Zusammenhang bedeutet das Passiv von ταπεινόω, erhöhtes Gelände niedrig zu machen. „Abgetragen“ gibt das Bild der Wegbereitung natürlich wieder, ohne es moralisch als „erniedrigt“ auszudeuten.
- source_word: τὰ σκολιά εἰς εὐθείαν
  choice: Was krumm ist, wird gerade werden
  rationale: Das substantivierte Neutrum Plural τὰ σκολιά bleibt hinsichtlich der konkret gemeinten Dinge offen. Die deutsche Formulierung wahrt diese Offenheit und gibt die resultative Konstruktion idiomatisch wieder.
- source_word: αἱ τραχεῖαι
  choice: die rauen Wege
  rationale: Das substantivierte Femininum Plural ist wahrscheinlich auf Wege oder Straßen zu beziehen. „Rau“ erhält die Beschaffenheit des Geländes, während „Wege“ die im Kontext erkennbare Ellipse verständlich ergänzt.
- source_word: εἰς ὁδοὺς λείας
  choice: werden zu ebenen Straßen
  rationale: ὁδοὺς bezeichnet ausdrücklich Straßen oder Wege; λείας kann „glatt“ oder „eben“ bedeuten. „Ebene Straßen“ passt zur Beseitigung von Unebenheiten und zur antiken Wegbereitung.
theological_decisions:
- issue: Prophetisches Landschafts- und Straßenbaubild aus Jesaja 40,4
  choice: Das konkrete Bild vom Auffüllen, Abtragen, Begradigen und Einebnen bleibt im Haupttext erhalten.
  alternative: Eine rein moralische oder geistliche Deutung, etwa dass Demütige erhöht und Stolze erniedrigt würden.
  rationale: Lukas zitiert konkrete Landschaftssprache. Ihre mögliche theologische Bedeutung soll nicht durch eine deutende Paraphrase an die Stelle des Bildes gesetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passivischen Zukunftsformen und der poetische Parallelismus bleiben gewahrt; konkrete Straßenbauverben machen das Bild für heutige Leser verständlich, ohne seine prophetische Bedeutung auszudeuten.
