  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: de
  text: Sohn Jakobs[a], Sohn Isaaks, Sohn Abrahams, Sohn Terachs[b], Sohn Nahors[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht vor jedem Namen lediglich der wiederholte Genitivartikel; „Sohn“ ist aus dem Muster des Stammbaums ergänzt.
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Thara“; hier steht die aus dem Alten Testament vertraute Namensform „Terach“.
    reason: lexical_alternative
  - marker: c
    text: Griechisch „Nachor“; hier steht die aus dem Alten Testament vertraute Namensform „Nahor“.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: Sohn … / Sohn des …
  rationale: Der wiederholte Genitivartikel setzt die elliptische Form der Genealogie fort. Im Deutschen wird die aus dem Zusammenhang erschlossene Abstammungsbeziehung mit „Sohn“ ausdrücklich wiedergegeben; bei den Namen stehen idiomatisch Genitivformen.
- source_word: Ἰακώβ
  choice: Jakob
  rationale: Die im Deutschen etablierte biblische Namensform des Patriarchen.
- source_word: Ἰσαάκ
  choice: Isaak
  rationale: Die im Deutschen etablierte biblische Namensform des Patriarchen.
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Die im Deutschen etablierte biblische Namensform des Patriarchen.
- source_word: Θάρα
  choice: Terach
  rationale: Die vertraute deutsche Namensform aus dem Alten Testament kennzeichnet dieselbe Person; „Thara“ wäre eine engere Wiedergabe der griechischen Form.
- source_word: Ναχώρ
  choice: Nahor
  rationale: Die vertraute deutsche Namensform aus dem Alten Testament kennzeichnet dieselbe Person; „Nachor“ würde die griechische Schreibung unmittelbarer abbilden.
theological_decisions:
- issue: Ergänzung der im elliptischen Stammbaum vorausgesetzten Sohn-Beziehung
  choice: Jedes Genitivglied ausdrücklich mit „Sohn“ wiedergeben
  alternative: Nur eine Folge von Genitivnamen bieten
  rationale: Das Griechische setzt aufgrund des genealogischen Musters die Abstammungsbeziehung voraus. Ihre ausdrückliche Wiedergabe macht den Sinn im Deutschen verständlich, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Knappe, würdige genealogische Reihung in modernem Standarddeutsch. Die Genitivformen ohne Artikel („Jakobs“, „Isaaks“ usw.) sind natürlich und bewahren den rhythmischen Aufbau des griechischen Textes.
