lexical_decisions:
- source_word: τοῦ
  choice: Sohn des
  rationale: Der wiederholte Genitivartikel steht in der durch den Kontext vorgegebenen Abstammungsreihe elliptisch. „Sohn des“ macht die genealogische Beziehung im Deutschen klar und erhält zugleich die regelmäßige Satzstruktur.
- source_word: Καϊνὰμ
  choice: Kenan
  rationale: „Kenan“ ist eine geläufige deutsche Form des Eigennamens; die näher am Griechischen liegende Form „Kainan“ wird in einer Fußnote genannt.
- source_word: Ἀρφαξὰδ
  choice: Arphaxad
  rationale: „Arphaxad“ gibt die griechische Namensform in Lukas wieder. Die im deutschen Alten Testament häufige Form „Arpachschad“ beruht stärker auf der hebräischen Namensform und wird vergleichend in einer Fußnote genannt.
- source_word: Σὴμ
  choice: Sem
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: Νῶε
  choice: Noah
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform statt einer unmittelbaren Umschrift der griechischen Form.
- source_word: Λάμεχ
  choice: Lamech
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
theological_decisions:
- issue: Kenan in der Abstammungsreihe zwischen Arphaxad und Sem
  choice: Kenan bleibt entsprechend dem SBLGNT im Haupttext erhalten.
  alternative: Einige Überlieferungen lassen Kenan aus, um die Abstammungsreihe bestimmten alttestamentlichen Formen anzugleichen.
  rationale: Der zugrunde gelegte griechische Text enthält Καϊνάμ. Die Übersetzung folgt daher Lukas, ohne die Abstammungsreihe stillschweigend mit anderen genealogischen Formen zu harmonisieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Wendung „Sohn des“ verdeutlicht die im griechischen Genitiv nur elliptisch ausgedrückte genealogische Beziehung. Die etablierten deutschen Namensformen werden verwendet, während relevante griechische beziehungsweise alttestamentliche Alternativen transparent in Fußnoten erscheinen.
