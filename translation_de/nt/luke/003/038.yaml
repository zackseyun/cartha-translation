  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: de
  text: Sohn des Enosch[a], Sohn des Set, Sohn Adams, Sohn Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wird lediglich die Genitivfolge „des Enosch, des Set, Adams, Gottes“ wiederholt; „Sohn“ ist aus der durchgehenden Form des Stammbaums ergänzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: Sohn des Enos
  rationale: Die wiederholte Genitivkonstruktion setzt die genealogische Formel fort; das im Griechischen ausgelassene Beziehungswort wird im Deutschen als „Sohn“ ergänzt. „Enos“ ist die im Deutschen gebräuchliche biblische Namensform.
- source_word: τοῦ Σὴθ
  choice: Sohn des Set
  rationale: Der Genitiv bezeichnet im Zusammenhang der Ahnenreihe die Abstammung. „Set“ ist die gebräuchliche deutsche biblische Namensform.
- source_word: τοῦ Ἀδὰμ
  choice: Sohn Adams
  rationale: Auch hier wird die gleiche genealogische Beziehung vorausgesetzt. „Adam“ bleibt als Eigenname stehen und wird nicht mit „Mensch“ übersetzt.
- source_word: τοῦ θεοῦ
  choice: Sohn Gottes
  rationale: Die Schlusswendung folgt derselben Genitivreihe. Die Ergänzung „Sohn“ bewahrt deren literarischen Gleichklang und lässt die Aussage über Adams unmittelbare Herkunft von Gott stehen.
theological_decisions:
- issue: Wiedergabe von τοῦ θεοῦ am Ende des Stammbaums
  choice: Sohn Gottes
  alternative: von Gott / Gottes
  rationale: Im Griechischen steht lediglich der Genitiv „Gottes“; im Kontext trägt jedoch die durchgehende genealogische Formel das ausgelassene „Sohn“. „Sohn Gottes“ erhält die zugespitzte Schlussaussage, ohne sie mit späteren christologischen Aussagen gleichzusetzen.
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die artikellose Reihung mit wiederholtem „Sohn“ entspricht dem fragmentarischen Charakter dieses Versabschnitts und macht die im griechischen Genitiv nur mitgedachte Abstammungsbeziehung verständlich.
