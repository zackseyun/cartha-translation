  text: des Melea, des Menna, des Mattata, des Nathan, des David.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: Sohn von
  rationale: Der wiederholte Genitiv steht in der Stammbaumformel elliptisch für die Abstammungsbeziehung. „Sohn von“ macht die im Kontext eindeutig vorausgesetzte Beziehung im Deutschen natürlich verständlich.
- source_word: Μελεὰ
  choice: Melea
  rationale: Der Personenname wird entsprechend der griechischen Form direkt als „Melea“ wiedergegeben.
- source_word: Μεννὰ
  choice: Menna
  rationale: „Menna“ entspricht unmittelbar der im SBLGNT gebotenen Namensform Μεννά; abweichende Formen werden nicht in den Text übernommen.
- source_word: Ματταθὰ
  choice: Mattata
  rationale: „Mattata“ ist eine gut lesbare deutsche Umschrift von Ματταθά und bewahrt die Konsonantenstruktur des griechischen Namens.
- source_word: Ναθὰμ
  choice: Nathan
  rationale: „Nathan“ ist die im Deutschen etablierte Form dieses biblischen Namens und bezeichnet hier Davids Sohn.
- source_word: Δαυὶδ
  choice: David
  rationale: „David“ ist die etablierte deutsche Form des biblischen Namens Δαυίδ.
theological_decisions:
- issue: Elliptische Stammbaumformel
  choice: Bei jedem Namen „Sohn von“ ergänzen.
  alternative: Die Genitivkette wörtlich mit „des Melea, des Menna …“ wiedergeben.
  rationale: Das Griechische setzt die Abstammungsbeziehung aufgrund der übergeordneten Stammbaumformel voraus. Die Ergänzung macht keine zusätzliche theologische Aussage, sondern gibt die syntaktisch ausgelassene Beziehung verständlich wieder.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die knappe Reihung bewahrt die Struktur des griechischen Stammbaums; die Namen folgen soweit möglich etablierten deutschen Formen beziehungsweise einer direkten Umschrift.
