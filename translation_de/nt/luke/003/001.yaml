id: LUK.3.1
reference: Luke 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: de
  text: Im fünfzehnten Jahr der Herrschaft des Kaisers Tiberius[a], als Pontius Pilatus Judäa regierte, Herodes Tetrarch von Galiläa war, sein Bruder Philippus Tetrarch des Gebiets von Ituräa und Trachonitis war und Lysanias Tetrarch von Abilene war[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Während des fünfzehnten Jahres der Herrschaft des Kaisers Tiberius“.'
    reason: lexical_alternative
  - marker: b
    text: Ein Tetrarch war ein regionaler Herrscher unter römischer Oberhoheit.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: Im fünfzehnten Jahr
  rationale: Die Zeitangabe wird im Deutschen idiomatisch wiedergegeben; δέ markiert hier einen Erzählübergang und benötigt kein eigenes einleitendes Wort.
- source_word: ἡγεμονίας Τιβερίου Καίσαρος
  choice: der Herrschaft des Kaisers Tiberius
  rationale: ἡγεμονία bezeichnet hier die kaiserliche Herrschaft. Die deutsche Namens- und Titelfolge lautet natürlich „Kaiser Tiberius“.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: als Pontius Pilatus Judäa regierte
  rationale: Das Genitivus-absolute-Gefüge wird als zeitlicher Nebensatz wiedergegeben; die verbale Form bleibt erhalten, ohne sie in eine ausdrückliche Amtsbezeichnung umzudeuten.
- source_word: τετρααρχοῦντος
  choice: Tetrarch ... war
  rationale: Die historisch konkrete Amtsbezeichnung bleibt erhalten und wird nicht zum allgemeinen „Herrscher“ verflacht.
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: sein Bruder Philippus
  rationale: Die Apposition und der Rückbezug von αὐτοῦ auf Herodes werden in natürlicher deutscher Wortstellung bewahrt.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: des Gebiets von Ituräa und Trachonitis
  rationale: χώρα wird mit „Gebiet“ ausdrücklich berücksichtigt; die Formulierung vermeidet die moderne Vorstellung eines souveränen Landes.
- source_word: τῆς Ἀβιληνῆς
  choice: von Abilene
  rationale: Der territoriale Genitiv wird nach der Amtsbezeichnung idiomatisch mit „von“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des politischen Titels τετρααρχοῦντος
  choice: Tetrarch ... war
  alternative: über ... herrschte / Herrscher von ... war
  rationale: Die spezifische historische Amtsbezeichnung wird bewahrt, ohne zusätzliche politische oder theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange chronologische Satzstruktur des griechischen Textes bleibt erkennbar, wird aber durch klare deutsche Nebensatzführung lesbar gehalten. Der Vers endet mit einem Komma, da der Satz in Lukas 3,2 weitergeht.
