id: LUK.16.10
reference: Luke 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: de
  text: Wer im Geringsten treu ist, ist auch in vielem treu; und wer im Geringsten ungerecht ist, ist auch in vielem ungerecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unredlich“. Das griechische Wort bezeichnet allgemein, wer Unrecht tut; im Zusammenhang kann es besonders Unehrlichkeit im Umgang mit Anvertrautem meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: treu
  rationale: Das Adjektiv bezeichnet hier Zuverlässigkeit im Umgang mit Anvertrautem. „Treu“ ist im Deutschen natürlich, würdevoll und bewahrt die prägnante Gegenüberstellung zu „ungerecht“.
- source_word: ἐν ἐλαχίστῳ
  choice: im Geringsten
  rationale: Die Wendung bezeichnet den Bereich dessen, was sehr klein oder unbedeutend ist. „Im Geringsten“ erhält die substantivierte Einzahl und den direkten Gegensatz zu „in vielem“.
- source_word: πολλῷ
  choice: vielem
  rationale: Der substantivierte neutrale Singular bezeichnet eine große Menge oder einen großen Umfang. „In vielem“ bildet idiomatisch und knapp den Gegensatz zu „im Geringsten“ ab.
- source_word: ἄδικος
  choice: ungerecht
  rationale: Das Wort bezeichnet moralisches Unrecht allgemein und kann im Zusammenhang auch Unehrlichkeit einschließen. „Ungerecht“ vermeidet eine Verengung auf finanzielle Unredlichkeit.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: wer ... treu ist / wer ... ungerecht ist
  rationale: Die substantivierten Adjektive haben allgemeinen, repräsentativen Sinn. Die deutsche „wer“-Konstruktion gibt diesen geschlechtsübergreifend und natürlich wieder.
- source_word: καί
  choice: auch; und
  rationale: Innerhalb beider Aussagen wird καί additiv mit „auch“ wiedergegeben; zwischen den parallelen Satzhälften verbindet „und“ die beiden Grundsätze.
theological_decisions:
- issue: Bedeutungsumfang von ἄδικος im Kontext der Haushalterschaft
  choice: ungerecht
  alternative: unehrlich; unredlich
  rationale: Jesu Aussage formuliert einen allgemeinen moralischen Grundsatz, auch wenn der nähere Kontext den Umgang mit Besitz und Geld betrifft. „Ungerecht“ bewahrt die Breite des griechischen Begriffs; eine Fußnote weist auf die kontextuell mögliche Nuance hin.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit sprichwortartiger Knappheit. Der Parallelismus und der quantitative Gegensatz des griechischen Textes bleiben erhalten.
