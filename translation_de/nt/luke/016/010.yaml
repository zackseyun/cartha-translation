  source_fidelity: Der deutsche Text gibt die zweifache, streng parallele Aussage des griechischen Textes vollständig wieder. „Im Geringsten“ und „in vielem“ bewahren den Gegensatz von ἐν ἐλαχίστῳ und ἐν πολλῷ; „treu“ trifft πιστός im Sinn bewährter Zuverlässigkeit. „Ungerecht“ hält den breiten moralischen Bedeutungsumfang von ἄδικος fest, ohne ihn auf finanzielle Unehrlichkeit einzuengen.
  naturalness: Die Formulierung ist klares, modernes Standarddeutsch mit angemessen knapper, sprichwortartiger Satzstruktur. Die Wiederholung von „treu“ und „ungerecht“ bildet den griechischen Parallelismus natürlich ab. „Im Geringsten“ ist hier verständlich und stilistisch passend.
  terminology: „Treu“ ist für πιστός im Kontext anvertrauter Dinge tragfähig. „Ungerecht“ ist als weiter Oberbegriff für ἄδικος angemessen; die Fußnote nennt mit „unredlich“ eine kontextuell mögliche, aber nicht exklusiv gemeinte Alternative. Der Fußnotenanker steht sinnvoll bei der zweiten moralischen Gegenüberstellung und deckt die wiederholte Verwendung des Begriffs ab.
