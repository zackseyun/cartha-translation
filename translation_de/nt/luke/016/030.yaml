source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: de
  text: 'Er aber sagte: »Nein, Vater Abraham, aber wenn jemand von den Toten zu ihnen geht, werden sie umkehren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: Nein
  rationale: Die verstärkte Verneinung widerspricht Abrahams vorheriger Aussage entschieden; »Nein« ist in direkter Rede natürlich, während das Ausrufezeichen die Nachdrücklichkeit erkennen lässt.
- source_word: πάτερ Ἀβραάμ
  choice: Vater Abraham
  rationale: Der Vokativ bewahrt die Anrede Abrahams als Stammvater und den appellierenden Ton des reichen Mannes.
- source_word: ἀλλ’ ἐάν
  choice: Wenn jedoch
  rationale: Die Formulierung gibt sowohl den korrigierenden Gegensatz von ἀλλά als auch die Bedingung mit ἐάν idiomatisch wieder, ohne einen unvollständigen deutschen Satz mit »sondern« zu erzeugen.
- source_word: τις
  choice: einer
  rationale: Das Indefinitpronomen bezeichnet eine unbestimmte einzelne Person; »einer« klingt im gegebenen Zusammenhang natürlich.
- source_word: ἀπὸ νεκρῶν
  choice: von den Toten
  rationale: Die knappe deutsche Wendung bewahrt die Mehrdeutigkeit zwischen dem Bereich beziehungsweise Kreis der Toten und einer Auferstehung, ohne »aus dem Reich der Toten« erklärend hinzuzufügen.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: zu ihnen geht
  rationale: »Geht« wahrt die Bewegungsrichtung des griechischen πορεύομαι mit πρός und die Perspektive des Sprechers.
- source_word: μετανοήσουσιν
  choice: werden sie umkehren
  rationale: »Umkehren« bezeichnet hier eine moralisch-geistliche Neuausrichtung und vermeidet die Verengung auf eine bloße Änderung des Denkens; zugleich ist es in modernem Deutsch verständlich.
theological_decisions:
- issue: Bedeutung von μετανοέω
  choice: umkehren
  alternative: Buße tun; ihr Denken ändern
  rationale: Im lukanischen Kontext ist mehr als ein intellektueller Meinungswechsel gemeint. »Umkehren« erhält die ethische und geistliche Tragweite, ohne eine konfessionell geprägte Bußterminologie aufzudrängen.
- issue: Deutung von ἀπὸ νεκρῶν
  choice: von den Toten
  alternative: aus der Mitte der Toten; aus dem Totenreich
  rationale: 'Die knappe Form wahrt die genuine Offenheit der griechischen Wendung: Gemeint sein kann jemand aus dem Kreis beziehungsweise Bereich der Toten, wobei im Fortgang auch die Vorstellung der Auferstehung anklingt.'
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt eindringlich, aber nicht altertümlich. Der Kontrast wird mit »jedoch« natürlich markiert; keine Fußnote ist nötig, da »von den Toten« die griechische Offenheit bereits angemessen bewahrt.
