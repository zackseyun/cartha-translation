base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: de
  text: Und im Hades[a] hob er, von Qualen gepeinigt, seine Augen auf und sah Abraham von Weitem und Lazarus in Abrahams Schoß[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Totenreich“. „Hades“ bezeichnet den Bereich der Toten; es ist nicht dasselbe griechische Wort wie „Gehenna“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in seinen Schoßfalten“; traditionell: „in Abrahams Schoß“. Die Wendung bezeichnet die unmittelbare Nähe zu Abraham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: im Hades
  rationale: Die Transliteration bewahrt den griechischen Begriff und unterscheidet ihn von der Gehenna beziehungsweise dem endgültigen Gericht; „Totenreich“ wäre verständlicher, aber bereits stärker deutend.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: hob er seine Augen auf
  rationale: Die Wendung erhält das anschauliche Bild des griechischen Partizips und klingt in würdigem modernem Deutsch natürlich.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: unter Qualen
  rationale: Die knappe deutsche Zustandsangabe gibt den Umstand des Sehens idiomatisch wieder; der griechische Plural βασάνοις wird mit dem im Deutschen natürlichen Plural „Qualen“ bewahrt.
- source_word: ὁρᾷ
  choice: sah er
  rationale: Das deutsche Erzählpräteritum ist im Kontext natürlicher. Der griechische historische Präsens erzeugt narrative Unmittelbarkeit, die hier nicht mechanisch nachgebildet werden muss.
- source_word: ἀπὸ μακρόθεν
  choice: von Weitem
  rationale: Die Formulierung gibt die betonte räumliche Entfernung knapp und idiomatisch wieder.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: an dessen Brust
  rationale: „Brust“ bewahrt das Körperbild von κόλπος und vermittelt Nähe und Geborgenheit. „Dessen“ macht den Bezug auf Abraham eindeutig, ohne den Namen unnötig zu wiederholen.
theological_decisions:
- issue: ᾅδης als Bezeichnung des Aufenthaltsbereichs der Toten
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: „Hades“ erhält die lexikalische Unterscheidung von Gehenna und vermeidet es, die Szene ohne textliche Grundlage unmittelbar mit dem endgültigen Strafort gleichzusetzen.
- issue: Bild von Lazarus in Abrahams κόλποις
  choice: an dessen Brust
  alternative: in Abrahams Schoß; in seinen Armen; an seiner Seite
  rationale: Die gewählte Formulierung bewahrt das körperlich-räumliche Bild enger Gemeinschaft, ohne die traditionsreiche Wendung „Abrahams Schoß“ als feststehenden theologischen Ortsnamen in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert. Das Erzählpräteritum entspricht natürlichem deutschen Erzählstil; die Bildsprache und die für die Auslegung wichtige Unterscheidung bei „Hades“ bleiben erhalten.
