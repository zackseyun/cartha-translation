id: LUK.16.13
reference: Luke 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: de
  text: Kein Hausdiener kann zwei Herren dienen. Denn entweder wird er den einen hassen und den anderen lieben, oder er wird sich an den einen halten und den anderen verachten. Ihr könnt nicht Gott und dem Mammon[a] dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mammon“ bezeichnet Geld oder Reichtum; hier erscheint er bildhaft als ein Herr, der mit Gott um den Dienst eines Menschen konkurriert.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: Haussklave
  rationale: Das Wort bezeichnet einen Menschen in dienender, unfreier Stellung innerhalb eines Haushalts. „Haussklave“ bewahrt sowohl den häuslichen Bezug als auch das im Verhältnis zu den Herren vorausgesetzte Abhängigkeitsverhältnis.
- source_word: κυρίοις
  choice: Herren
  rationale: Im sozialen Bild bezeichnet κύριος die Herren eines Sklaven beziehungsweise Hausdieners. „Herren“ passt zum historischen Kontext und lässt zugleich die Gegenüberstellung von Gott und Mammon als rivalisierenden Herren erkennen.
- source_word: δουλεύειν
  choice: dienen
  rationale: Das Verb bezeichnet Sklavendienst beziehungsweise untergeordnete Dienstbarkeit. „Dienen“ ist im Deutschen natürlich und trägt die wiederholte Formulierung bis zur abschließenden Aussage über Gott und Mammon.
- source_word: μισήσει
  choice: hassen
  rationale: Die direkte Bedeutung und der scharfe Gegensatz zu ἀγαπήσει werden bewahrt, ohne die mögliche sprichwörtliche Zuspitzung zu „weniger lieben“ abzuschwächen.
- source_word: ἀγαπήσει
  choice: lieben
  rationale: „Lieben“ gibt den bewussten Gegensatz zu „hassen“ klar und unmittelbar wieder.
- source_word: ἀνθέξεται
  choice: sich an … halten
  rationale: Die Wendung vermittelt das feste Halten an einer Person und damit Bindung und Loyalität. Sie bleibt näher am bildhaften griechischen Ausdruck als eine rein abstrakte Wiedergabe wie „treu ergeben sein“.
- source_word: καταφρονήσει
  choice: verachten
  rationale: Das Verb bezeichnet geringschätzige Missachtung. „Verachten“ ist prägnant und erhält die Stärke des Gegensatzes.
- source_word: θεῷ
  choice: Gott
  rationale: Die Dativform ist das Objekt zu „dienen“ und wird im Deutschen natürlich mit „Gott“ wiedergegeben.
- source_word: μαμωνᾷ
  choice: dem Mammon
  rationale: Die Beibehaltung des semitischen Lehnworts wahrt die rhetorische Personifizierung des Reichtums als rivalisierenden Herrn. Der deutsche Dativartikel entspricht der syntaktischen Funktion und dem etablierten Sprachgebrauch.
theological_decisions:
- issue: Wiedergabe von μαμωνᾷ im Gegensatz zu θεῷ
  choice: Mammon
  alternative: Geld oder Reichtum
  rationale: „Mammon“ erhält die im Kontext wirksame Darstellung des Reichtums als rivalisierenden Herrn. Damit wird weder behauptet, Mammon sei buchstäblich eine Gottheit, noch wird die theologische Spannung durch eine rein sachliche Wiedergabe eingeebnet.
- issue: Generischer Singular in den verbalen Gegenüberstellungen
  choice: „er wird …“
  alternative: Wiederholung von „der Haussklave“ oder pluralische Umformulierung
  rationale: Die griechischen Verbformen stehen im generischen Singular. Das deutsche Pronomen „er“ knüpft grammatisch eindeutig an „Haussklave“ an und bewahrt Numerus und Struktur des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kräftigen Gegensätzen („hassen/lieben“, „halten/verachten“). „Haussklave“ macht den historischen Status deutlicher als das heute oft freiwillige Dienstverhältnisse bezeichnende „Hausdiener“. Die Fußnotenmarke steht unmittelbar nach dem Satz, auf den die Erklärung zu „Mammon“ bezogen ist.
