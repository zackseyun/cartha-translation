id: LUK.16.3
reference: Luke 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: de
  text: 'Da sagte der Verwalter zu sich selbst: »Was soll ich tun, da mein Herr mir die Verwaltung entzieht? Zum Graben fehlt mir die Kraft, und zu betteln schäme ich mich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: Verwalter / Verwaltung
  rationale: Die verwandten deutschen Begriffe bewahren die Wortverwandtschaft des Griechischen und bezeichnen verständlich sowohl die beauftragte Person als auch ihren Verantwortungsbereich.
- source_word: ἐν ἑαυτῷ
  choice: zu sich selbst
  rationale: Die Wendung bezeichnet ein inneres Selbstgespräch und wird im Deutschen natürlich so wiedergegeben.
- source_word: Τί ποιήσω
  choice: Was soll ich tun?
  rationale: Das deliberative Fragen nach dem künftigen Vorgehen wird im modernen Deutschen idiomatisch mit »soll« ausgedrückt.
- source_word: κύριός μου
  choice: mein Herr
  rationale: Im Gleichnis bezeichnet κύριος den menschlichen Vorgesetzten des Verwalters. »Mein Herr« bewahrt das Autoritätsverhältnis, ohne hier einen göttlichen Titel vorauszusetzen.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: mir ... entzieht
  rationale: »Entziehen« gibt das Wegnehmen eines anvertrauten Amtes beziehungsweise Verantwortungsbereichs prägnant wieder; das deutsche Dativpronomen entspricht funktional ἀπ’ ἐμοῦ.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Zum Graben fehlt mir die Kraft
  rationale: ἰσχύω hebt im Zusammenhang körperlicher Arbeit die Kraft hervor. Die Formulierung ist natürlich und vermeidet die unbestimmtere Wiedergabe »ich kann nicht«.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: zu betteln schäme ich mich
  rationale: ἐπαιτεῖν bezeichnet das Betteln, während αἰσχύνομαι die dabei empfundene Scham ausdrückt; die knappe deutsche Form wahrt die Parallelität zum vorhergehenden Satzteil.
theological_decisions:
- issue: Wiedergabe von κύριος in einem nichtgöttlichen Gleichniskontext
  choice: mein Herr
  alternative: mein Dienstherr / mein Besitzer
  rationale: Der Bezug gilt dem reichen Mann des Gleichnisses. »Herr« ist im Deutschen auch als gewöhnliche soziale Bezeichnung verständlich und bewahrt die Autoritätsbeziehung; »Besitzer« wäre enger und würde den Schwerpunkt auf Eigentum verlagern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Infinitivgruppen »Zum Graben ...« und »zu betteln ...« erhalten die knappe, selbstabwägende Redeweise. Da »Verwalter/Verwaltung« die griechische Wortverwandtschaft bereits sichtbar macht, ist keine Fußnote erforderlich.
