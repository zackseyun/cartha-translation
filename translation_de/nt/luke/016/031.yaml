id: LUK.16.31
reference: Luke 16:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: de
  text: 'Doch er sagte zu ihm: »Wenn sie nicht auf Mose und die Propheten hören, werden sie sich auch nicht überzeugen lassen, wenn jemand von den Toten aufersteht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Doch er sagte zu ihm
  rationale: δέ markiert hier eine leichte Gegensetzung zur vorangehenden Bitte; „doch“ bewahrt diese Wendung, ohne sie zu stark zu machen.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Mose und die Propheten
  rationale: Die geläufige jüdische Ausdrucksweise verweist auf das bereits gegebene schriftgemäße Zeugnis, ohne dass die Übersetzung sie erklärend zu „die Schriften“ erweitert.
- source_word: οὐκ ἀκούουσιν
  choice: nicht auf … hören
  rationale: Die deutsche Wendung kann sowohl das Hören als auch die aufmerksame, entsprechende Annahme ausdrücken und bildet damit die Bedeutungsbreite von ἀκούω natürlich ab.
- source_word: οὐδ’ ἐάν
  choice: auch nicht … wenn
  rationale: Die Formulierung führt die Verneinung verstärkend in den zweiten Bedingungssatz weiter und klingt im heutigen Deutsch natürlich.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: von den Toten aufersteht
  rationale: Dies ist die geläufige und präzise deutsche Wiedergabe der neutestamentlichen Auferstehungssprache; der bedingende Konjunktiv wird nach „wenn“ idiomatisch mit Präsens ausgedrückt.
- source_word: πεισθήσονται
  choice: werden sie sich überzeugen lassen
  rationale: Die Formulierung wahrt den passiven Sinn von πείθω und vermeidet die theologisch engere Festlegung auf „glauben“ oder „umkehren“.
theological_decisions:
- issue: Bedeutung von „Mose und die Propheten“
  choice: Die überlieferte Wendung bleibt als Hinweis auf das maßgebliche schriftgemäße Zeugnis Israels erhalten.
  alternative: Erklärende Wiedergabe als „die Schriften“ oder enge Deutung als bloßer Verweis auf zwei Personengruppen.
  rationale: Der Kontext legt eine metonymische Bezeichnung des Schriftzeugnisses nahe; die ursprüngliche Ausdrucksweise soll jedoch nicht durch eine auslegende Paraphrase ersetzt werden.
- issue: Aussagekraft von πεισθήσονται
  choice: Allgemeines Überzeugtwerden
  alternative: „Sie werden glauben“ oder „sie werden umkehren“
  rationale: Das griechische Verb bezeichnet hier Überzeugung beziehungsweise Überredung, ohne ausdrücklich eine engere soteriologische Reaktion festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ gibt den milden Kontrast wieder; „auf Mose und die Propheten hören“ ist idiomatisch und bewahrt die semantische Spannung zwischen Hören und Befolgen. Keine Fußnote ist nötig, da die deutsche Formulierung die wesentlichen Bedeutungsnuancen unmittelbar trägt.
