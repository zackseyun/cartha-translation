id: LUK.16.7
reference: Luke 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: de
  text: 'Dann sagte er zu einem anderen: »Und du, wie viel schuldest du?« Der antwortete: »Hundert Kor Weizen.«[a] Er sagt zu ihm: »Nimm deinen Schuldschein[b] und schreib achtzig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Kor war ein großes antikes Hohlmaß für Getreide.
    reason: cultural_note
  - marker: b
    text: Oder »deine Schuldurkunde« oder »deine Dokumente«; wörtlich »deine Schriftstücke« (τὰ γράμματα). Gemeint ist hier die schriftliche Schuldaufzeichnung des Schuldners.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Dann
  rationale: Das Adverb führt den nächsten Schritt der Handlung ein; »Dann« gibt die zeitliche Abfolge natürlich und präzise wieder.
- source_word: ἑτέρῳ
  choice: zu einem anderen
  rationale: Der Dativ bezeichnet einen weiteren, vom zuvor genannten Schuldner verschiedenen Menschen, ohne dessen Geschlecht über den Kontext hinaus eigens hervorzuheben.
- source_word: Σὺ δὲ
  choice: Und du
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck, während δέ einen leichten Übergang beziehungsweise Kontrast markiert. »Und du« ist im Deutschen eine natürliche direkte Anrede.
- source_word: πόσον ὀφείλεις
  choice: wie viel schuldest du
  rationale: ὀφείλω bezeichnet hier eine konkrete Schuldverpflichtung; die Formulierung ist klar und idiomatisch.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Hundert Kor Weizen
  rationale: κόρος ist ein bestimmtes antikes Hohlmaß für trockene Güter. Die Transliteration »Kor« bewahrt die historische Maßeinheit; eine Fußnote erläutert sie.
- source_word: λέγει αὐτῷ
  choice: Er sagt zu ihm
  rationale: Das Präsens bewahrt den Wechsel ins historische Präsens und damit die Lebendigkeit der griechischen Erzählung.
- source_word: Δέξαι
  choice: Nimm
  rationale: Der Imperativ fordert den Schuldner auf, das Schriftstück an sich zu nehmen; »Nimm« ist in diesem Zusammenhang die natürliche deutsche Wiedergabe.
- source_word: σου τὰ γράμματα
  choice: deinen Schuldschein
  rationale: γράμματα bedeutet wörtlich »Schriftstücke« beziehungsweise »Dokumente«, bezeichnet hier aber funktional die schriftliche Schuldurkunde. Der Singular »Schuldschein« ist im Deutschen idiomatisch; die wörtlicheren Möglichkeiten werden in einer Fußnote genannt.
- source_word: γράψον ὀγδοήκοντα
  choice: schreib achtzig
  rationale: Die knappe Formulierung folgt dem griechischen Befehl und lässt aus dem Zusammenhang erkennen, dass der eingetragene Betrag geändert werden soll.
