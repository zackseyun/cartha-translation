id: LUK.16.26
reference: Luke 16:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: de
  text: Und zu alledem[a] ist zwischen uns und euch eine große Kluft festgelegt, sodass die, die von hier zu euch hinübergehen wollen, es nicht können; ebenso wenig kann jemand von dort zu uns herübergelangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und in all diesem“. Die griechische Wendung kann idiomatisch einen zusätzlichen Gesichtspunkt einführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: zu alledem
  rationale: Die idiomatische deutsche Wendung führt wie das Griechische einen weiteren, entscheidenden Gesichtspunkt ein. Die formalere Wiedergabe wird in der Fußnote genannt.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: zwischen uns und euch
  rationale: Gibt die räumlich-relationale Aussage direkt wieder und macht den Plural von ὑμῶν im Deutschen sichtbar.
- source_word: χάσμα μέγα
  choice: eine große Kluft
  rationale: „Kluft“ entspricht dem Bild eines tiefen, trennenden Zwischenraums und ist in modernem Deutsch klar.
- source_word: ἐστήρικται
  choice: ist … fest verankert
  rationale: Das Perfekt Passiv bezeichnet einen herbeigeführten, fortbestehenden Zustand. Die deutsche Formulierung betont die dauerhafte Festigkeit, ohne den Urheber zu ergänzen.
- source_word: ὅπως
  choice: sodass
  rationale: Bewahrt die im Kontext nicht scharf aufzulösende Zweck-/Folgebeziehung und klingt im Deutschen natürlich.
- source_word: οἱ θέλοντες
  choice: die, die … wollen
  rationale: Gibt das substantivierte Partizip als allgemeine Personengruppe in verständlichem Deutsch wieder.
- source_word: διαβῆναι ἔνθεν πρὸς ὑμᾶς
  choice: von hier zu euch hinübergehen
  rationale: Erhält Ausgangspunkt, Ziel und die räumliche Bewegung von einer Seite zur anderen.
- source_word: μὴ δύνωνται
  choice: es nicht können
  rationale: Drückt Unfähigkeit und nicht lediglich ein Verbot aus.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: ebenso wenig kann jemand von dort zu uns herübergelangen
  rationale: Erhält die parallele Unmöglichkeit in der Gegenrichtung. „Herüber-“ gibt die Perspektive des Sprechers wieder; „jemand“ macht das im Griechischen elliptische Subjekt im Deutschen natürlich verständlich.
theological_decisions:
- issue: Art der Trennung zwischen den beiden Bereichen im Gleichnis
  choice: Die Kluft wird als dauerhaft fest und nicht überquerbar dargestellt.
  alternative: Die Kluft ausdrücklich als wörtliche Topografie des Jenseits oder als rein bildhafte Trennung ohne bleibende Bedeutung deuten.
  rationale: Der Vers betont den feststehenden Zustand und die beidseitige Unmöglichkeit des Überschreitens. Die Übersetzung bewahrt diese Aussage, ohne sie zu einer weitergehenden Lehre über das Jenseits auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu alledem“ ist idiomatisch; „fest verankert“ bewahrt die Beständigkeit des griechischen Perfekts, ohne altertümlich zu wirken. Die Richtungsangaben „hinüber-“ und „herüber-“ machen den räumlichen Perspektivwechsel klar.
