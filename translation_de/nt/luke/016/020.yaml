  text: πτωχὸς δέ ⸀τις ὀνόματι ⸀Λάζαρος ἐβέβλητο πρὸς τὸν πυλῶνα αὐτοῦ εἱλκωμένος
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/020.yaml
  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: de
  text: Ein armer Mann namens Lazarus aber war vor sein Tor gelegt worden[a]; er war von Geschwüren bedeckt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor sein Tor hingeworfen worden“. Das griechische Verb kann ein Werfen oder gewaltsames Ablegen bezeichnen und damit die Hilflosigkeit und Vernachlässigung des Lazarus hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „voller Geschwüre“. Das griechische Partizip beschreibt Lazarus als von geschwürartigen Wunden befallen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: ein armer Mann
  rationale: Das Adjektiv bezeichnet einen armen oder mittellosen Menschen. „Armer Mann“ ist im Deutschen natürlich und legt nicht ohne zwingenden Grund die speziellere Rolle eines Bettlers fest.
- source_word: τις
  choice: ein ... Mann
  rationale: Das indefinite Pronomen führt eine neue Person ein. Im modernen Deutschen wird seine Funktion idiomatisch durch den unbestimmten Artikel wiedergegeben; „ein gewisser“ wäre unnötig markiert.
- source_word: ὀνόματι Λάζαρος
  choice: namens Lazarus
  rationale: Die Dativkonstruktion bezeichnet idiomatisch den Namen der Person. „Namens Lazarus“ ist knapp und natürlich.
- source_word: ἐβέβλητο
  choice: war ... gelegt worden
  rationale: Der passive Plusquamperfekt wahrt sowohl die Vorzeitigkeit als auch den Hinweis darauf, dass andere Lazarus dort hingebracht hatten. Die mögliche härtere Bedeutung „hingeworfen“ bleibt in einer Fußnote erhalten.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: vor sein Tor
  rationale: πρός mit Akkusativ bezeichnet hier die Lage am Zugang des reichen Mannes. „Vor sein Tor“ ist im Deutschen szenisch klar und gibt die Bewegung mit dem passiven Verb natürlich wieder; πυλών meint Tor beziehungsweise Toreingang.
- source_word: εἱλκωμένος
  choice: von Geschwüren bedeckt
  rationale: Das Partizip bezeichnet einen von Geschwüren beziehungsweise offenen Wunden befallenen Zustand. Die Formulierung ist verständlich, anschaulich und wahrt den resultativen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das vorangestellte „aber“ markiert den Kontrast zum reichen Mann aus dem vorhergehenden Vers. Das passive Plusquamperfekt und beide im Text gesetzten Fußnotenmarker bewahren die zeitliche Perspektive sowie die lexikalische Spannung des griechischen Textes.
