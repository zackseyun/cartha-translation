id: LUK.16.22
reference: Luke 16:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: de
  text: Es geschah aber, dass der Arme starb und von den Engeln in Abrahams Schoß[a] getragen wurde. Auch der Reiche starb und wurde begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an Abrahams Seite“. Der griechische Ausdruck lautet wörtlich „in den Schoß Abrahams“ und ist ein Bild für Nähe, Ehre und Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Es geschah aber, dass
  rationale: Die lukanische Erzählformel mit Infinitiv wird in verständlichem Deutsch als Nebensatz wiedergegeben. „aber“ bewahrt den milden fortführenden beziehungsweise absetzenden Wert von δέ, ohne eine nicht ausdrücklich bezeichnete Zeitangabe einzuführen.
- source_word: τὸν πτωχὸν
  choice: der Arme
  rationale: πτωχός bezeichnet hier einen armen beziehungsweise mittellosen Menschen. „Der Arme“ ist knapp und direkt; „der Bettler“ würde eine über dieses Satzglied hinausgehende Präzisierung eintragen.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: von den Engeln … getragen wurde
  rationale: Die passive Form und die ausdrücklich genannte handelnde Größe bleiben erhalten. „getragen“ gibt ἀποφέρω hier natürlich wieder.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: in Abrahams Schoß
  rationale: „Schoß“ bewahrt das konkrete und traditionelle Bild von κόλπος und lässt dessen Bedeutungsgehalt von Nähe, Ehre und Gemeinschaft offen. Die leichter verständliche Wiedergabe „an Abrahams Seite“ steht in der Fußnote.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Auch der Reiche starb
  rationale: „Auch“ gibt καί wieder und hebt die Parallele zum Tod des Armen hervor. Das zweite δέ wird im Deutschen durch den neuen Satz und dessen Fortgang ausreichend getragen, sodass kein schwerfälliges zusätzliches „aber“ nötig ist.
- source_word: ἐτάφη
  choice: wurde begraben
  rationale: Die knappe passive Aussage von θάπτω wird unmittelbar und ohne Ergänzung wiedergegeben.
theological_decisions:
- issue: Wiedergabe von εἰς τὸν κόλπον Ἀβραάμ
  choice: in Abrahams Schoß
  alternative: an Abrahams Seite
  rationale: Die bildhafte, kulturell und theologisch gewichtige Formulierung wird nicht zu einer allgemeinen Aussage über das Jenseits aufgelöst. Die Hauptfassung erhält das Bild; die Fußnote erklärt seine mögliche idiomatische Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „Abrahams Schoß“ wird wegen ihrer Bildkraft beibehalten und durch eine verständliche Fußnote erschlossen.
