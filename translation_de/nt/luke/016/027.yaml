  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: de
  text: 'Da sagte er: »Ich bitte dich nun, Vater, dass du ihn in das Haus meines Vaters schickst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Da sagte er
  rationale: δέ ist hier ein leichter erzählerischer Anschluss. „Da“ führt die Handlung in natürlichem Deutsch weiter, ohne einen starken Gegensatz auszudrücken.
- source_word: Ἐρωτῶ
  choice: bitte ich
  rationale: ἐρωτάω bezeichnet eine Bitte oder ein Ersuchen. Im Deutschen gibt „bitte ich dich“ sowohl den grundlegenden Sinn als auch den ernsten Ton der Bitte idiomatisch wieder.
- source_word: σε οὖν
  choice: Dann bitte ich dich
  rationale: οὖν knüpft folgernd an die vorherige Ablehnung an. „Dann“ bewahrt diese Anschluss- beziehungsweise Folgerungsfunktion, ohne sie zu überzeichnen.
- source_word: πάτερ
  choice: Vater
  rationale: Die Anrede gilt Abraham als Stammvater. „Vater“ gibt den Vokativ direkt wieder; die Großschreibung am Anredebeginn folgt der deutschen Orthografie und ist keine Kennzeichnung als Gottestitel.
- source_word: ἵνα πέμψῃς
  choice: Schick
  rationale: Nach einem Verb des Bittens bezeichnet ἵνα mit Konjunktiv den Inhalt der Bitte. Ein deutscher Aufforderungssatz ist hier natürlicher als die schwerfällige Konstruktion „dass du ihn schickst“ und erhält den abhängigen Bittcharakter durch den vorausgehenden Doppelpunkt.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen verweist im vorangehenden Zusammenhang auf Lazarus.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: in das Haus meines Vaters
  rationale: εἰς bezeichnet das Ziel; οἶκος kann Haus oder Haushalt meinen. „In das Haus meines Vaters“ bleibt nah an der Ausdrucksweise des griechischen Textes und ist im Deutschen verständlich.
theological_decisions:
- issue: Anrede πάτερ innerhalb des Gleichnisses
  choice: Vater
  alternative: Vater als ausdrücklicher Gottestitel
  rationale: Der Sprecher redet Abraham als seinen Stammvater an. Die Übersetzung lässt diese innergleichnishafte Beziehung stehen und legt keine direkte Anrede Gottes nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und natürlich; „bitte ich dich“ vermeidet sowohl das zu schwache „frage ich dich“ als auch das stärker emotionalisierte „flehe ich dich an“.
