review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Sprecherfolge, die Anrede und das Ziel der Sendung zutreffend wieder. Der mit Doppelpunkt angeschlossene Imperativ „Schick ihn“ macht die von ἵνα πέμψῃς abhängige Bitte jedoch zu einer eigenständigen direkten Aufforderung. Eine dass-Konstruktion bildet den Inhalt der Bitte genauer ab.
  naturalness: „Da sagte er“ ist natürlich. Die Abfolge „Da ... Dann“ wirkt jedoch leicht redundant. „Nun“ ist für οὖν in dieser förmlichen direkten Rede idiomatisch; „dass du ihn ... schickst“ ist modernes, klares Standarddeutsch.
  terminology: „Vater“ ist als Anrede Abrahams angemessen und aufgrund der deutschen Substantivgroßschreibung nicht als Gottestitel markiert. „Haus meines Vaters“ bewahrt die wörtliche und kontextuell passende Formulierung. „bitte“ gibt ἐρωτῶ treffend wieder, ohne die Bitte zu „flehen“ zu verstärken.
  issues:
  - severity: low
    issue: Der Doppelpunkt mit Imperativ löst den Inhalt der Bitte syntaktisch von „bitte ich dich“.
    rationale: ἵνα mit Konjunktiv bezeichnet nach ἐρωτῶ den Inhalt der Bitte. „dass du ihn ... schickst“ erhält diese Abhängigkeit explizit und ohne Bedeutungsänderung.
  - severity: low
    issue: „Da“ und „Dann“ stehen in enger Folge.
    rationale: Beide können den erzählerischen bzw. folgernden Anschluss ausdrücken; ihre Kombination ist nicht falsch, aber stilistisch weniger glatt. „Nun“ gibt οὖν passend wieder, ohne die Erzählfortführung durch „Da“ zu verdoppeln.
  revised_text: 'Da sagte er: »Ich bitte dich nun, Vater, dass du ihn in das Haus meines Vaters schickst.«'
