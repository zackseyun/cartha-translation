  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: de
  text: Es gab einen reichen Mann, der gewöhnlich Purpur und feines Leinen trug und sich Tag für Tag prächtig vergnügte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und feierte Tag für Tag in Saus und Braus.“ Das griechische Partizip kann festlichen Genuss oder Feiern, einschließlich üppiger Mahlzeiten, bezeichnen; das Adverb hebt die prachtvolle, luxuriöse Weise hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις ἦν πλούσιος
  choice: Es war einmal ein reicher Mann
  rationale: Die Wendung führt eine unbestimmte Person in die Erzählung ein. „Es war einmal“ ist im Deutschen eine natürliche narrative Einführung; δέ wird dabei nicht mit einem unnötigen zeitlichen „nun“ überladen.
- source_word: ἐνεδιδύσκετο
  choice: kleidete sich gewöhnlich
  rationale: Der Imperfekt bezeichnet hier ein gewohnheitsmäßiges Verhalten; „gewöhnlich“ macht diesen Aspekt im Deutschen deutlich.
- source_word: πορφύραν καὶ βύσσον
  choice: in Purpur und feines Leinen
  rationale: „Purpur“ bezeichnet metonymisch purpurgefärbte Kleidung, βύσσος hochwertiges feines Leinen; beide Ausdrücke markieren sichtbar den Luxus.
- source_word: εὐφραινόμενος
  choice: genoss … ein Leben
  rationale: Das Partizip beschreibt frohen, festlichen Genuss und kann in diesem Zusammenhang üppiges Feiern oder Speisen einschließen, ohne darauf beschränkt zu sein.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die idiomatische Wendung bringt die tägliche, fortgesetzte Lebensweise natürlich zum Ausdruck.
- source_word: λαμπρῶς
  choice: glanzvolles
  rationale: Das Adverb bezeichnet eine prächtige, luxuriöse Weise; „glanzvoll“ bewahrt das Bild des Glanzes und passt zum Lebensstil des Mannes.
