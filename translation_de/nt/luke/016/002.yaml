    issue: „Verwalter sein“ glättet das Verb οἰκονομεῖν zu stark.
    rationale: οἰκονομεῖν bezeichnet hier die Ausübung der Verwaltung. „Die Verwaltung ... führen“ gibt die verbale und sachliche Aussage präziser wieder.
