  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: de
  text: 'Er rief ihn und sagte zu ihm: »Was höre ich da über dich? Lege Rechenschaft über deine Verwaltung ab, denn du kannst die Verwaltung nicht länger führen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: Er ließ ihn rufen
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Handlung. Im Zusammenhang gibt die kausative deutsche Wendung natürlich wieder, dass der reiche Mann den Verwalter zu sich bestellte.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Was ist das, was ich über dich höre?
  rationale: Die Formulierung bewahrt die rhetorische Frage und gibt περὶ σοῦ mit dem natürlichen deutschen „über dich“ wieder, ohne „Bericht“ ausdrücklich in den Text einzutragen.
- source_word: ἀπόδος τὸν λόγον
  choice: Lege Rechenschaft … ab
  rationale: Im Verwaltungskontext verlangt ἀπόδος τὸν λόγον eine Abrechnung beziehungsweise verantwortliche Rechenschaft. „Rechenschaft ablegen“ ist im Deutschen idiomatisch und wahrt den fordernden Imperativ.
- source_word: τῆς οἰκονομίας σου
  choice: über deine Verwaltung
  rationale: οἰκονομία bezeichnet hier die anvertraute Verwaltung eines Haushalts oder Vermögens. „Verwaltung“ ist modern, verständlich und sachlich, ohne den Begriff auf eine geistliche Bedeutung zu verengen.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: denn du kannst nicht länger Verwalter sein
  rationale: δύνῃ mit Infinitiv bezeichnet fehlende Möglichkeit oder Befugnis, ἔτι mit Verneinung „nicht länger“. Die rollenbezogene Wiedergabe verbindet das Verb οἰκονομεῖν klar mit der im Kontext genannten Stellung.
theological_decisions:
- issue: Bedeutung von οὐ … δύνῃ im Zusammenhang der Entlassung
  choice: du kannst nicht länger Verwalter sein
  alternative: du kannst die Verwaltung nicht länger führen
  rationale: Die Form kann praktische Unfähigkeit oder den Entzug der Befugnis bezeichnen. Die gewählte Formulierung lässt den kontextuell naheliegenden Amtsverlust erkennen, ohne einen besonderen theologischen Sinn einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Rollenbezeichnung „Verwalter“ hält den Haushalts- und Vermögenskontext klar; die direkte Rede bleibt knapp und bestimmt.
