  terminology: „Rechenschaft über deine Verwaltung ablegen“ trifft den administrativen Sinn von λόγος und οἰκονομία gut. Die Wiederaufnahme mit „die Verwaltung führen“ wahrt die begriffliche Verbindung, ohne „Verwalter“ als bloße Stellenbezeichnung an die Stelle des Verbs zu setzen.
