  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: φωνήσας bezeichnet das Herbeirufen, τὸν λόγον τῆς οἰκονομίας die Rechnungslegung über die anvertraute Verwaltung, und die Schlussbegründung kündigt das Ende seiner Verwaltungstätigkeit an. „Er ließ ihn rufen“ schwächt jedoch die einfache aktive Handlung des griechischen Partizips unnötig zu einem Veranlassen durch Dritte ab. „Verwalter sein“ ist kontextuell möglich, gibt οἰκονομεῖν als Verb aber weniger genau wieder als eine Formulierung über das Verwalten selbst.'
