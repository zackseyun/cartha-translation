- from: 'Er sagte auch zu den Jüngern: »Ein reicher Mann hatte einen Verwalter[a]. Dieser wurde bei ihm beschuldigt[b], seinen Besitz zu verschwenden.«'
  to: 'Er sagte auch zu den Jüngern: »Ein reicher Mann hatte einen Verwalter[a]. Dieser wurde beim reichen Mann beschuldigt[b], dessen Besitz zu verschwenden.«'
  rationale: Die Revision ersetzt eine im Deutschen unnatürliche Konstruktion und klärt, dass der verschwenderisch behandelte Besitz dem reichen Mann gehört. Sie bewahrt die passive, vorwurfsweise Aussage von διεβλήθη und damit die Offenheit, ob die Beschuldigung zutrifft.
