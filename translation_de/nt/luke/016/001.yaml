source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: de
  text: 'Er sagte auch zu den Jüngern: »Ein reicher Mann hatte einen Verwalter[a]. Dieser wurde beim reichen Mann beschuldigt[b], dessen Besitz zu verschwenden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Haushalter«; gemeint ist jemand, dem die Verwaltung eines Haushalts oder Besitzes anvertraut war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wurde beim reichen Mann angezeigt« oder: »es wurde dem reichen Mann berichtet, dass er dessen Besitz verschwende«. Das Verb kann eine belastende Beschuldigung oder Meldung bezeichnen, nicht zwingend einen erwiesenen Vorwurf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Er sagte
  rationale: Der Imperfekt eröffnet und rahmt die Rede. Im natürlichen deutschen Erzählstil gibt das Präteritum diese Funktion angemessen wieder; »er sagte gerade« würde einen unnötig engen Verlaufsaspekt nahelegen.
- source_word: δὲ καὶ
  choice: auch
  rationale: καί wird als »auch« wiedergegeben. Das schwach überleitende δέ braucht im Deutschen an dieser Stelle kein eigenes Wort.
- source_word: πρὸς τοὺς μαθητάς
  choice: zu den Jüngern
  rationale: Die Formulierung bewahrt den bestimmten Artikel des Griechischen und fügt kein im Ausgangstext fehlendes Possessivpronomen hinzu.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Ein reicher Mann hatte
  rationale: Die idiomatische deutsche Parabeleinleitung wahrt die unbestimmte Einführung der Figur. Die Verbindung mit dem folgenden Relativsatz wird natürlich zu »hatte« gefügt, ohne den Gehalt zu verändern.
- source_word: οἰκονόμον
  choice: Verwalter
  rationale: »Verwalter« ist eine geläufige moderne Bezeichnung für jemanden, dem die Leitung eines Haushalts oder Besitzes anvertraut ist; die traditionelle Alternative »Haushalter« wird in einer Fußnote genannt.
- source_word: οὗτος
  choice: Dieser
  rationale: Das Demonstrativpronomen greift den Verwalter mit der im Griechischen vorhandenen Hervorhebung wieder auf.
- source_word: διεβλήθη αὐτῷ
  choice: wurde bei ihm beschuldigt
  rationale: Die Wendung gibt sowohl den passiven Vorwurf als auch den reichen Mann als Adressaten der Beschuldigung wieder. Sie lässt offen, ob der Vorwurf zutraf.
- source_word: ὡς διασκορπίζων
  choice: seinen Besitz zu verschwenden
  rationale: Im finanziellen Zusammenhang bezeichnet διασκορπίζω das Vergeuden oder Verschleudern. Der deutsche Infinitiv bezeichnet idiomatisch den Inhalt der Beschuldigung.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: seinen Besitz
  rationale: Die substantivierte Wendung meint das, was dem reichen Mann gehört. »Besitz« ist umfassend und im Deutschen natürlich.
theological_decisions:
- issue: Wahrheitsgehalt der gegen den Verwalter erhobenen Beschuldigung
  choice: Die Formulierung »wurde ... beschuldigt« stellt den Vorwurf dar, ohne ihn als erwiesen zu bezeichnen.
  alternative: »Es wurde ihm berichtet, dass ...« könnte neutraler klingen; »wurde angezeigt« könnte einen förmlichen Vorgang suggerieren.
  rationale: διαβάλλω kann eine belastende Meldung, Denunziation oder Beschuldigung bezeichnen. Der Text entscheidet an dieser Stelle nicht ausdrücklich, ob der Vorwurf wahr oder bewiesen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, während der bestimmte Adressatenkreis, die demonstrative Hervorhebung des Verwalters und die Ungewissheit über den Wahrheitsgehalt der Beschuldigung erhalten bleiben.
