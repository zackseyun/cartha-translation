id: LUK.16.18
reference: Luke 16:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: de
  text: Jeder, der sich von seiner Frau scheiden lässt und eine andere heiratet, begeht Ehebruch; und wer eine Frau heiratet, die von ihrem Mann geschieden ist, begeht Ehebruch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Jeder, der
  rationale: Die Verbindung verallgemeinert und bezeichnet ausnahmslos jeden, auf den die folgende Handlung zutrifft.
- source_word: ἀπολύων
  choice: sich scheiden lässt
  rationale: Im ehelichen Zusammenhang bezeichnet ἀπολύω die Scheidung. Die deutsche Wendung ist natürlich und lässt offen, auf welche Weise die Scheidung rechtlich vollzogen wird.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: von seiner Frau
  rationale: γυνή bedeutet hier wegen des Ehe- und Scheidungskontexts eindeutig „Ehefrau“.
- source_word: γαμῶν ἑτέραν
  choice: eine andere heiratet
  rationale: ἑτέραν bezeichnet eine andere Frau; im Deutschen ist das Bezugswort nach „heiratet“ klar und muss nicht wiederholt werden.
- source_word: μοιχεύει
  choice: begeht Ehebruch
  rationale: Die feste deutsche Wendung gibt das Verb klar, würdig und idiomatisch wieder.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: eine Frau …, die von ihrem Mann geschieden ist
  rationale: Das Perfekt Passiv bezeichnet eine Frau im fortbestehenden Zustand nach ihrer Scheidung. ἀνήρ bedeutet im Zusammenhang „Ehemann“; „von ihrem Mann“ ist natürliches Deutsch und bewahrt die griechische Konstruktion mit ἀπό.
theological_decisions:
- issue: Geltungsumfang und Aussagekraft des Scheidungswortes
  choice: Die Aussage wird als allgemeiner moralischer Satz ohne hinzugefügte Ausnahme wiedergegeben.
  alternative: Eine aus anderen Evangelienstellen erschlossene Ausnahme ausdrücklich ergänzen oder die Aussage auf besondere rechtliche Fälle beschränken.
  rationale: Lukas formuliert hier keine Ausnahme. Die Übersetzung bewahrt deshalb den universalen Wortlaut und die bestehende theologische Spannung, ohne andere Stellen harmonisierend einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, knappem Lehrsatzstil. Die parallele Wiederholung von „begeht Ehebruch“ bildet die Struktur des griechischen Satzes ab.
