review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung bildet beide allgemein formulierten Partizipialkonstruktionen treffend ab. „sich von seiner Frau scheiden lässt“ gibt ἀπολύων im ehelichen Kontext idiomatisch wieder; „eine andere heiratet“ wahrt den durch ἑτέραν vorausgesetzten weiblichen Bezug. Der zweite Satzteil gibt das perfekte Passiv ἀπολελυμένην als gegenwärtigen Zustand nach erfolgter Scheidung angemessen wieder. „von ihrem Mann“ ist im deutschen Kontext eine natürliche, sachlich gleichwertige Entfaltung von ἀπὸ ἀνδρός und behauptet keine zusätzliche Scheidungsmodalität.
  naturalness: Modernes Standarddeutsch, klar und würdig. Die parallele Wiederholung von „begeht Ehebruch“ ist natürlich und entspricht der rhetorischen Struktur des griechischen Lehrsatzes. Das Semikolon setzt die beiden eng verbundenen Aussagen lesbar voneinander ab.
  terminology: „Frau“, „heiratet“, „geschieden“ und „Ehebruch“ sind im Kontext präzise, idiomatisch und registergerecht. Es werden keine Ausnahmebestimmungen oder harmonisierenden Deutungen aus anderen Evangelien eingeführt.
