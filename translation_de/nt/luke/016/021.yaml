  rationale: Die geringe Überarbeitung bewahrt die gewählte Aussage und den Anschluss an den vorigen Vers, macht aber die vom Tisch wegführende Fallbewegung und die fortlaufende Bildszene deutlicher. Die direkte Objektkonstruktion bei „leckten seine Geschwüre“ ist idiomatisch und näher am griechischen Wortlaut. Die Alternative „Reste“ bleibt ausdrücklich in der Fußnote, da sie kontextuell erschlossen und nicht ausdrücklich im griechischen Text genannt ist.
