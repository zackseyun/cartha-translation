base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: de
  text: und er sehnte sich danach, von dem satt zu werden, was vom Tisch des Reichen herunterfiel.[a] Doch sogar die Hunde kamen und leckten seine Geschwüre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Resten, die vom Tisch des Reichen herunterfielen“. Wörtlich steht im Griechischen: „von dem, was herabfiel“; dass Essensreste gemeint sind, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: er sehnte sich danach
  rationale: Das Präsenspartizip bezeichnet ein anhaltendes, starkes Verlangen; die finite Wiedergabe ist im Deutschen natürlich und schließt syntaktisch an den vorigen Vers an.
- source_word: χορτασθῆναι
  choice: satt zu werden
  rationale: Im unmittelbaren Zusammenhang mit Nahrung bezeichnet das passive Verb das Erlangen von Sättigung. Die Formulierung bewahrt den resultativen Sinn natürlicher als „gefüttert zu werden“.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: von dem, was … fiel
  rationale: Das substantivierte Partizip wird transparent wiedergegeben, ohne das im Griechischen nicht ausdrücklich genannte Wort „Reste“ in den Haupttext einzufügen.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: vom Tisch des Reichen
  rationale: „Tisch“ ist die übliche Bedeutung; das substantivierte Adjektiv verweist auf den reichen Mann der Erzählung.
- source_word: ἀλλὰ καὶ
  choice: Doch sogar
  rationale: Die Wendung verbindet einen Gegensatz mit einer überraschenden Steigerung.
- source_word: οἱ κύνες
  choice: die Hunde
  rationale: Direkte und kontextgemäße Wiedergabe des Plurals ohne beschönigende Präzisierung.
- source_word: ἐρχόμενοι
  choice: kamen
  rationale: Das begleitende Partizip wird im Deutschen idiomatisch als koordiniertes finites Verb wiedergegeben.
- source_word: ἐπέλειχον
  choice: leckten an
  rationale: Der Imperfekt kann wiederholtes oder andauerndes Lecken ausdrücken. „An seinen Geschwüren lecken“ ist im Deutschen idiomatisch; das Präteritum lässt den Verlauf im Erzählzusammenhang offen.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: seine Geschwüre
  rationale: ἕλκη bezeichnet offene, geschwürartige Hautschäden. „Geschwüre“ ist präziser als das breitere „Wunden“ und in modernem Deutsch verständlich.
theological_decisions:
- issue: Bedeutung des Hundeleckens
  choice: Keine wertende Deutung in den Text aufgenommen
  alternative: Das Lecken ausdrücklich als zusätzliche Erniedrigung oder als lindernde Handlung darstellen
  rationale: Der griechische Text berichtet die Handlung, legt ihre Wirkung oder symbolische Bedeutung aber nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang mit „und“ bewahrt den Anschluss an Vers 20. Die Bildsprache bleibt nüchtern und ungeschönt; eine nicht ausdrücklich genannte theologische oder emotionale Bewertung der Hunde wird vermieden.
