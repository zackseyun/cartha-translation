source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Ihr seid es, die sich vor den Menschen selbst für gerecht erklären; doch Gott kennt eure Herzen. Denn was bei den Menschen hoch angesehen ist,[a] ist vor Gott ein Gräuel.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »was unter den Menschen erhaben ist«; gemeint sein kann auch: »was bei den Menschen hoch geschätzt wird«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ist vor Gott verabscheuungswürdig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: sich selbst für gerecht erklären
  rationale: Die Formulierung gibt das reflexive δικαιόω verständlich wieder und bewahrt den Gedanken, dass die Angesprochenen sich vor anderen als gerecht darstellen, ohne zu behaupten, sie machten sich tatsächlich gerecht.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: vor den Menschen
  rationale: „Vor“ bewahrt die räumlich-bildhafte und wertende Bedeutung von ἐνώπιον; „Menschen“ gibt das generische ἀνθρώπων im heutigen Deutschen natürlich und inklusiv wieder.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: kennt eure Herzen
  rationale: Die direkte Wiedergabe bewahrt „Herzen“ als biblischen Ausdruck für das innere Wesen, die Gedanken und Beweggründe.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: was bei den Menschen hoch angesehen ist
  rationale: Die Formulierung bringt die kontextuelle Bedeutung gesellschaftlicher Hochschätzung natürlich zum Ausdruck und lässt durch „hoch“ zugleich das Höhenbild des griechischen Ausdrucks anklingen.
- source_word: βδέλυγμα
  choice: ein Gräuel
  rationale: „Gräuel“ ist ein starker, würdiger und im biblischen Sprachgebrauch etablierter Ausdruck für etwas, das vor Gott verabscheuungswürdig ist.
- source_word: Ὑμεῖς ἐστε οἱ …
  choice: Ihr seid es, die …
  rationale: Diese Konstruktion bildet die emphatische Anrede des griechischen Pronomens mit substantiviertem Partizip im Deutschen deutlich ab.
theological_decisions:
- issue: Bedeutung von δικαιοῦντες ἑαυτούς
  choice: sich selbst für gerecht erklären
  alternative: sich rechtfertigen
  rationale: Die gewählte Fassung erhält den Bezug zu Gerechtigkeit und macht zugleich klar, dass es um die Selbstdarstellung vor Menschen geht; sie entscheidet nicht über die umfassendere theologische Bedeutung von „rechtfertigen“.
- issue: Semantische Kraft von τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: was bei den Menschen hoch angesehen ist
  alternative: was unter den Menschen erhaben ist
  rationale: Der Ausdruck kann gesellschaftliches Ansehen, Hochschätzung oder Erhöhung bezeichnen. Die Hauptfassung ist im Deutschen idiomatisch; die formalere, stärker bildhafte Möglichkeit wird in einer Fußnote bewahrt.
- issue: Stärke von βδέλυγμα
  choice: ein Gräuel
  alternative: verabscheuungswürdig
  rationale: Das Substantiv bezeichnet nicht nur allgemeine Missbilligung, sondern etwas vor Gott Abscheuliches. „Gräuel“ bewahrt diese starke religiös-moralische Wertung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die emphatische Anklage wird durch „Ihr seid es“ bewahrt. „Menschen“ gibt den generischen Plural natürlich wieder; „Herzen“ bleibt als zentraler biblischer Begriff unaufgelöst.
