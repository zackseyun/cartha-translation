  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: de
  text: Denn ich habe fünf Brüder. Er soll sie eindringlich warnen[a], damit nicht auch sie an diesen Ort der Qual kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen feierlich Zeugnis ablegen“ beziehungsweise „sie nachdrücklich ermahnen“. Das griechische Verb kann ein ernstes Bezeugen, Ermahnen oder Warnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: Denn ich habe
  rationale: γάρ begründet die vorausgehende Bitte; „denn“ erhält diesen erklärenden Zusammenhang. ἔχω bedeutet hier schlicht „haben“.
- source_word: πέντε ἀδελφούς
  choice: fünf Brüder
  rationale: Der maskuline Plural bezeichnet in diesem Zusammenhang männliche Geschwister.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: Er soll sie eindringlich warnen
  rationale: ὅπως bezeichnet den Zweck der vorausgehenden Bitte. διαμαρτύρομαι kann feierlich bezeugen, nachdrücklich zureden oder eindringlich warnen bedeuten; angesichts der folgenden Vermeidungsklausel steht hier die Warnung im Vordergrund. Die Aufteilung in einen neuen deutschen Satz ist natürlich und wahrt die Zweckrichtung.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: damit nicht auch sie … kommen
  rationale: ἵνα μή drückt einen verneinten Zweck aus; καὶ αὐτοί hebt hervor, dass auch die Brüder dasselbe Ziel erreichen könnten.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: an diesen Ort der Qual
  rationale: εἰς bezeichnet die Bewegung zu einem Ziel. βάσανος bezeichnet schwere Qual oder Pein; „Qual“ bewahrt die Intensität, ohne die Aussage dogmatisch auszuweiten.
theological_decisions:
- issue: Beschreibung des jenseitigen Ortes in der Rede des reichen Mannes
  choice: diesen Ort der Qual
  alternative: diesen Ort der Pein / des Leidens
  rationale: Die Übersetzung gibt die durch βάσανος bezeichnete leidvolle Erfahrung wieder, ohne über die Aussage dieses Verses hinaus eine umfassendere Lehre über den Ort zu formulieren.
- issue: Bedeutungsbreite von διαμαρτύρομαι
  choice: eindringlich warnen
  alternative: ihnen feierlich Zeugnis geben / sie nachdrücklich ermahnen
  rationale: Der anschließende Zweck, ihr Kommen an den Ort der Qual zu verhindern, legt die Warnkomponente nahe; die Fußnote bewahrt zugleich die echte lexikalische Breite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Verschachtelung; „eindringlich“ vermittelt den feierlich-ernsten Nachdruck des griechischen Verbs.
