id: LUK.16.11
reference: Luke 16:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: de
  text: Wenn ihr nun im Umgang mit dem ungerechten Reichtum[a] nicht treu gewesen seid, wer wird euch dann den wahren Reichtum[b] anvertrauen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem ungerechten Mammon“; auch: „dem unredlichen Reichtum“. Gemeint ist Reichtum beziehungsweise Besitz, nicht nur Bargeld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Wahre“. „Reichtum“ ist aus dem Gegensatz zum vorausgehenden Reichtum ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: im Umgang mit dem ungerechten Reichtum
  rationale: ἐν bezeichnet hier den Bereich, in dem sich Treue erweist. „Im Umgang mit“ ist im Deutschen natürlich und macht den Gedanken der Verwaltung deutlich, ohne ihn auf bloßen Besitz zu verengen. ἄδικος behält mit „ungerecht“ seine moralische Färbung; μαμωνᾶς wird allgemeinverständlich als „Reichtum“ wiedergegeben.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: nicht treu gewesen seid
  rationale: Das prädikative πιστός bezeichnet zuverlässige Treue, besonders im Zusammenhang anvertrauter Güter. γίνομαι wird hier idiomatisch mit „gewesen seid“ statt wörtlich mit „geworden seid“ wiedergegeben.
- source_word: τὸ ἀληθινὸν
  choice: den wahren Reichtum
  rationale: Das substantivierte Adjektiv bedeutet wörtlich „das Wahre“. Der unmittelbare Gegensatz zum ungerechten Reichtum legt nahe, im Deutschen „Reichtum“ zu ergänzen; die Fußnote bewahrt die grammatische Offenheit des Griechischen.
- source_word: πιστεύσει
  choice: wird … anvertrauen
  rationale: πιστεύω mit einer Sache als Akkusativobjekt und einer Person im Dativ bedeutet hier „jemandem etwas anvertrauen“, nicht „jemandem glauben“.
theological_decisions:
- issue: Deutung von τὸ ἀληθινὸν im Gegensatz zum ungerechten Reichtum
  choice: „den wahren Reichtum“ im Haupttext
  alternative: „das Wahre“ oder „das wahre Gut“
  rationale: Der Bezug auf μαμωνᾶς macht einen Gegensatz zwischen gegenwärtigem Reichtum und dem wahrhaft Wertvollen wahrscheinlich. Da der griechische Ausdruck das Bezugswort jedoch unausgesprochen lässt, wird diese Ergänzung in einer Fußnote kenntlich gemacht und nicht weiter dogmatisch bestimmt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Im Umgang mit“ vermeidet eine hölzerne Wiedergabe von ἐν; „Mammon“ bleibt als wörtliche Alternative in der Fußnote erhalten.
