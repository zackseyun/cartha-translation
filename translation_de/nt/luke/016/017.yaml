id: LUK.16.17
reference: Luke 16:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: de
  text: Doch eher vergehen Himmel und Erde, als dass auch nur ein einziges Strichlein des Gesetzes wegfällt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein einziges Häkchen“ – gemeint ist ein winziger Strich an einem Schriftzeichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: eher
  rationale: Der Komparativ bezeichnet hier, was leichter beziehungsweise eher eintreten würde. Im Deutschen bildet „eher … als dass“ den griechischen Vergleich natürlich und prägnant ab.
- source_word: δέ
  choice: Doch
  rationale: „Doch“ gibt den milden Gegensatz zum vorausgehenden Zusammenhang wieder, ohne einen übermäßig scharfen Bruch zu erzeugen.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Himmel und Erde
  rationale: Die feste biblische Wortverbindung bezeichnet umfassend die geschaffene Welt und bewahrt die Bildsprache des Ausgangstextes.
- source_word: παρελθεῖν
  choice: vergehen
  rationale: In Verbindung mit Himmel und Erde bedeutet das Verb hier nicht bloß räumliches Vorübergehen, sondern ihr Vergehen.
- source_word: τοῦ νόμου
  choice: des Gesetzes
  rationale: Der bestimmte Ausdruck verweist im jüdisch-schriftbezogenen Kontext auf das offenbarte Gesetz; die Formulierung bleibt dabei eng am griechischen Text.
- source_word: μίαν κεραίαν
  choice: ein einziges Strichlein
  rationale: κεραία bezeichnet einen sehr kleinen Strich oder Vorsprung an einem Schriftzeichen. „Strichlein“ vermittelt die Winzigkeit natürlich und lässt die nähere Bedeutung in einer Fußnote erläutern.
- source_word: πεσεῖν
  choice: wegfällt
  rationale: Das griechische „fallen“ meint im Kontext, dass selbst das kleinste Schriftdetail seine Geltung verliert oder verschwindet. „Wegfällt“ erhält das Bild des Fallens und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bezug von νόμος
  choice: das Gesetz im schriftbezogenen Sinn
  alternative: Gesetz oder Recht im allgemeinen Sinn
  rationale: Der bestimmte Ausdruck und die Erwähnung eines winzigen Schriftstrichs weisen auf das schriftlich überlieferte Gesetz. Die Übersetzung vermeidet eine weitergehende Festlegung darauf, welche Aspekte seiner Geltung hier gemeint sind.
- issue: Aussage über das Fallen der κεραία
  choice: „wegfällt“ als Verlust oder Ungültigwerden des kleinsten Details
  alternative: wörtlich „fällt“
  rationale: „Wegfällt“ ist im Deutschen verständlich, bewahrt die metaphorische Spannung und legt nicht genauer fest, auf welche Weise ein Detail des Gesetzes fallen könnte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform „eher … als dass“ bildet den zugespitzten Vergleich natürlich ab; „Strichlein“ ist allgemein verständlich und wird durch die Fußnote präzisiert.
