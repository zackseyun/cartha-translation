id: LUK.16.4
reference: Luke 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: de
  text: Ich weiß, was ich tun werde, damit sie mich in ihre Häuser aufnehmen, wenn ich von der Verwaltung abgesetzt werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Ich weiß
  rationale: Der Aorist bezeichnet hier idiomatisch die gewonnene Einsicht bzw. den gefassten Entschluss. Das deutsche Präsens gibt den plötzlichen Erkenntnismoment im Monolog natürlich wieder.
- source_word: τί ποιήσω
  choice: was ich tun werde
  rationale: Der deliberative Konjunktiv bezeichnet die erwogene und nun entschiedene Handlung. Diese Formulierung ist im Deutschen natürlich und bewahrt den Zukunftsbezug.
- source_word: ἵνα ὅταν
  choice: damit … wenn
  rationale: 'Die Verbindung vereint Zweckangabe und zukünftige Bedingung: Sein Plan soll bei der bevorstehenden Absetzung zu einem bestimmten Ergebnis führen.'
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: ich von der Verwaltung abgesetzt werde
  rationale: μεθίστημι bezeichnet hier das Entfernen aus einem Amt; οἰκονομία meint die übertragene Haus- bzw. Vermögensverwaltung. „Von der Verwaltung abgesetzt“ gibt den Amtsverlust klar und ohne theologisierende Färbung wieder.
- source_word: δέξωνταί με
  choice: sie mich … aufnehmen
  rationale: δέχομαι bezeichnet hier die gastliche Aufnahme. „Aufnehmen“ passt im Deutschen besonders natürlich zur folgenden Ortsangabe.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: in ihre Häuser
  rationale: οἶκος bezeichnet hier den konkreten häuslichen Lebensbereich. Das reflexive ἑαυτῶν wird durch „ihre“ ausreichend wiedergegeben; „eigenen“ wäre möglich, aber nicht nötig.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede klingt wie ein entschlossener innerer Monolog. „Verwaltung“ hält den Bezug zur Tätigkeit des Verwalters im Kontext aufrecht; „Häuser“ bewahrt das konkrete Bild der erwarteten materiellen Aufnahme.
