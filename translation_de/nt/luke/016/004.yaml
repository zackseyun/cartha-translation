review_pass:
  verdict: approve
  source_fidelity: Der Entschlussausdruck „Ich weiß, was ich tun werde“ gibt ἔγνων τί ποιήσω idiomatisch und kontextgerecht wieder. Die Zweck-Folge von ἵνα sowie die zukünftige zeitliche Einordnung durch ὅταν bleiben in „damit …, wenn …“ erhalten. „Von der Verwaltung abgesetzt“ trifft μετασταθῶ ἐκ τῆς οἰκονομίας als Entfernung aus der Verwalterfunktion; „in ihre Häuser aufnehmen“ gibt δέξωνταί με εἰς τοὺς οἴκους ἑαυτῶν angemessen wieder.
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch und wahrt einen würdevollen Erzählton. Die Stellung des wenn-Satzes am Ende ist grammatisch klar und natürlich.
  terminology: „Verwaltung“ hält die Verbindung zur Funktion des Verwalters im Gleichniskontext aufrecht, ohne den Begriff theologisch zu überladen. „Abgesetzt“ bezeichnet plausibel den Verlust eines Amtes. „Häuser“ bewahrt das konkrete Bild des griechischen οἶκοι.
