source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: de
  text: 'Abraham aber sagte: »Sie haben Mose und die Propheten; auf sie sollen sie hören.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Mose und die Propheten« bezeichnet hier das in den Schriften des Mose und der Propheten überlieferte Zeugnis.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει δὲ Ἀβραάμ
  choice: Abraham aber sagte
  rationale: Das historische Präsens λέγει wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben. Das nachgestellte »aber« bewahrt die leicht kontrastive Funktion von δέ.
- source_word: Ἔχουσι
  choice: Sie haben
  rationale: Die schlichte Präsensform gibt den gegenwärtigen Zugang zu dem bereits vorhandenen Zeugnis direkt wieder.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Mose und die Propheten
  rationale: Die knappe, im Judentum geläufige Wendung bleibt erhalten; »Mose« steht metonymisch für die mit ihm verbundenen Schriften, ohne dass diese Auslegung in den Haupttext eingefügt wird.
- source_word: ἀκουσάτωσαν αὐτῶν
  choice: auf sie sollen sie hören
  rationale: Die deutsche Wendung »auf jemanden hören« gibt sowohl den Imperativ der dritten Person als auch den Sinn des befolgenden Hörens wieder. Das Pronomen bleibt wie im Griechischen auf »Mose und die Propheten« bezogen.
theological_decisions:
- issue: Bezug von »Mose und die Propheten«
  choice: Die wörtliche Kurzform bleibt im Haupttext stehen und bezeichnet im Kontext das maßgebliche schriftgemäße Zeugnis.
  alternative: Ausdeutende Wiedergabe als »das Gesetz des Mose und die Schriften der Propheten« oder enger Bezug nur auf die historischen Personen.
  rationale: Die lukanische Wendung verweist gewöhnlich auf die Schriften, doch die Übersetzung soll die bildhafte Originalform bewahren und ihre Bedeutung nur in einer Fußnote erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Auf sie hören« ist idiomatisch, bewahrt den Aufforderungscharakter und trägt stärker als bloßes »sie hören« den Gedanken des Beachtens mit. Nur eine Fußnote ist nötig; die Marker der englischen Konsultationsfassung waren offenbar gegenüber ihren Inhalten vertauscht.
