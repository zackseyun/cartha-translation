id: LUK.16.5
reference: Luke 16:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: de
  text: 'Nachdem er jeden einzelnen Schuldner seines Herrn[a] zu sich gerufen hatte, sagte er zum ersten: »Wie viel schuldest du meinem Herrn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Herr« ist hier der menschliche Herr beziehungsweise Dienstherr des Verwalters gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Nachdem er … zu sich gerufen hatte
  rationale: Die Formulierung gibt das vorzeitige aoristische Partizip natürlich wieder und bewahrt zugleich den medialen Sinn des Herbeirufens zu sich.
- source_word: ἕνα ἕκαστον
  choice: jeden einzelnen
  rationale: Die Verbindung hat verteilende und verstärkende Kraft; »jeden einzelnen« bildet beides präzise und idiomatisch ab.
- source_word: χρεοφειλετῶν
  choice: Schuldner
  rationale: Das Substantiv bezeichnet Personen, die jemandem etwas schulden; »Schuldner« ist im wirtschaftlichen Zusammenhang die direkte deutsche Entsprechung.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: seines Herrn
  rationale: κύριος bezeichnet hier den menschlichen Vorgesetzten beziehungsweise Dienstherrn des Verwalters; ἑαυτοῦ bezieht sich auf den Verwalter zurück.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt zeichnet die laufende beziehungsweise wiederholte Befragung der Schuldner. Im Deutschen ist im erzählenden Zusammenhang »sagte« natürlicher; die Verteilung auf die einzelnen Schuldner ist bereits durch »jeden einzelnen« erkennbar.
- source_word: τῷ πρώτῳ
  choice: zum ersten
  rationale: Die knappe Wendung gibt den Dativ mit der Ordnungszahl natürlich wieder.
- source_word: Πόσον ὀφείλεις
  choice: Wie viel schuldest du
  rationale: Im Zusammenhang einer Schuld bezeichnet πόσον den geschuldeten Umfang oder Betrag; die deutsche Frage ist direkt und idiomatisch.
- source_word: τῷ κυρίῳ μου
  choice: meinem Herrn
  rationale: Der Sprecher bezeichnet damit seinen menschlichen Herrn. »Herr« wahrt die Beziehung und entspricht dem Sprachgebrauch der Erzählung.
theological_decisions:
- issue: Wiedergabe von κύριος in einem wirtschaftlichen Gleichniskontext
  choice: Herr
  alternative: Dienstherr; Gebieter
  rationale: Gemeint ist hier nicht ausdrücklich Gott oder Christus, sondern der menschliche Herr des Verwalters. Das deutsche »Herr« passt zur sozialen Beziehung und bewahrt zugleich die lexikalische Verbindung zu κύριος, ohne die mögliche weiterführende Wirkung des Gleichnisses im Wortlaut festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die vorzeitige Handlung wird durch einen Nachdem-Satz ausgedrückt; die direkte Rede bleibt knapp und natürlich.
