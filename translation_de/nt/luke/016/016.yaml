id: LUK.16.16
reference: Luke 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: de
  text: Das Gesetz und die Propheten reichen bis zu Johannes. Seitdem wird die gute Nachricht vom Reich Gottes verkündet, und jeder drängt mit Macht hinein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und jeder drängt sich hinein“. Das griechische Verb bezeichnet ein kraftvolles, energisches Vorgehen; wie stark dabei der Gedanke von Gewalt mitschwingt, ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen den letzten Satzteil negativer, auch im Blick auf die ähnliche Aussage in Matthäus 11,12. Hier ist im Griechischen jedoch „jeder“ das Subjekt, nicht „das Reich Gottes“.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: Das Gesetz und die Propheten
  rationale: Bewahrt die geläufige jüdische Bezeichnung für die beiden Schriftbereiche; die Großschreibung von „Gesetz“ kennzeichnet hier die Tora.
- source_word: μέχρι Ἰωάννου
  choice: reichen bis zu Johannes
  rationale: Gibt die zeitliche Grenzmarkierung knapp und in natürlichem Deutsch wieder; aus dem Kontext ist Johannes der Täufer gemeint.
- source_word: ἀπὸ τότε
  choice: Seitdem
  rationale: Markiert idiomatisch den zeitlichen Übergang und lässt den fortdauernden Zusammenhang erkennen.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die traditionelle und zugleich semantisch offene deutsche Wiedergabe bewahrt sowohl räumlich-konkrete als auch herrschaftliche Aspekte von βασιλεία.
- source_word: εὐαγγελίζεται
  choice: wird die gute Nachricht vom … verkündet
  rationale: Die passive Form und der Gegenwartsbezug bleiben erhalten; „gute Nachricht“ macht den Evangeliumscharakter des Verbs ausdrücklich.
- source_word: πᾶς
  choice: jeder
  rationale: Entspricht dem distributiven Singular und klingt im Deutschen natürlicher als eine pluralische Umschreibung.
- source_word: εἰς αὐτὴν βιάζεται
  choice: drängt mit Macht hinein
  rationale: Gibt Bewegung in das Reich und die kraftvolle, schwer eindeutig festzulegende Nuance von βιάζεται wieder, ohne eigenmächtige oder verdienstliche Erlangung zu behaupten.
theological_decisions:
- issue: Bedeutung von βιάζεται in Beziehung zum Reich Gottes
  choice: Menschen drängen kraftvoll in das Reich hinein.
  alternative: Die Schlussaussage kann negativer als gewaltsames Eindringen verstanden werden; im verwandten Wortlaut von Matthäus 11,12 steht das Reich selbst als von Gewalt betroffen im Vordergrund.
  rationale: In Lukas 16,16 ist πᾶς („jeder“) das grammatische Subjekt, während εἰς αὐτήν eine Bewegung „hinein“ bezeichnet. „Drängt mit Macht hinein“ folgt dieser Syntax, bewahrt aber die spannungsreiche Kraftnuance des Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Reichen bis zu“ ergänzt kein ausdrückliches Verb, sondern bildet die knappe griechische Nominalkonstruktion natürlich ab. „Mit Macht“ wahrt die Intensität von βιάζεται, während die Fußnoten die echte lexikalische und theologische Mehrdeutigkeit offenhalten.
