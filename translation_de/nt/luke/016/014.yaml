id: LUK.16.14
reference: Luke 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: de
  text: Die Pharisäer, die das Geld liebten, hörten das alles und verhöhnten[a] ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »spotteten verächtlich über ihn«. Das Verb kann offenen Hohn oder geringschätziges Spotten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: hörten
  rationale: Das Imperfekt bezeichnet die gleichzeitig fortlaufende Wahrnehmung. Im natürlichen deutschen Erzählstil wird dies gewöhnlich mit dem Präteritum wiedergegeben, ohne den Verlauf künstlich auszuschreiben.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier nur einen leichten Übergang beziehungsweise Anschluss. Die natürliche deutsche Satzfolge trägt diese Funktion bereits; ein ausdrückliches »aber« würde einen stärkeren Gegensatz nahelegen.
- source_word: ταῦτα πάντα
  choice: das alles
  rationale: Die idiomatische deutsche Wendung verweist vollständig auf Jesu unmittelbar vorausgehende Aussagen.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche deutsche Bezeichnung der im Evangelium genannten jüdischen Gruppe.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: die das Geld liebten
  rationale: Die Relativkonstruktion gibt die bleibende Charakterisierung verständlich und nah am ausdrücklichen Sinn »geldliebend« wieder, ohne sie zum umfassenderen Urteil »habgierig« auszuweiten.
- source_word: ἐξεμυκτήριζον
  choice: verhöhnten
  rationale: Das Verb bezeichnet verächtlichen Spott. »Verhöhnten« ist im Deutschen natürlich, kräftig und lässt sowohl offenes Verspotten als auch höhnische Geringschätzung erkennen; das Imperfekt wird erzählerisch durch das Präteritum wiedergegeben.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Jesus.
theological_decisions:
- issue: Charakterisierung der Pharisäer durch φιλάργυροι
  choice: die das Geld liebten
  alternative: die habgierig waren
  rationale: Der griechische Ausdruck benennt ausdrücklich die Liebe zum Geld. Die gewählte Form bewahrt diesen Bezug zur vorausgehenden Lehre über Besitz und Geld, ohne den Begriff durch eine allgemeinere moralische Deutung zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die beiden griechischen Imperfektformen werden idiomatisch im deutschen Präteritum wiedergegeben; ihr fortlaufender Charakter ergibt sich aus dem Zusammenhang. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Anmerkung erläutert.
