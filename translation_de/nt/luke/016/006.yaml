id: LUK.16.6
reference: Luke 16:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: de
  text: 'Er antwortete: »Hundert Bat[a] Olivenöl.« Da sagte er zu ihm: »Nimm deinen Schuldschein[b], setz dich schnell hin und schreib fünfzig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein Bat war ein antikes Flüssigkeitsmaß. Im Griechischen steht: »hundert Bat Olivenöl«.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »deine Schuldurkunde« oder »deine Unterlagen«; wörtlich: »deine Schriftstücke«. Gemeint ist hier die schriftliche Aufzeichnung der Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: Bat
  rationale: Das griechische Wort bezeichnet ein bestimmtes antikes Flüssigkeitsmaß. Die Beibehaltung der Maßeinheit bewahrt die konkrete wirtschaftliche Angabe; eine Fußnote erklärt sie.
- source_word: ἐλαίου
  choice: Olivenöl
  rationale: ἔλαιον bezeichnet in diesem Zusammenhang Olivenöl; die präzisere deutsche Bezeichnung ist für heutige Leser eindeutig.
- source_word: Δέξαι
  choice: Nimm
  rationale: Der Aoristimperativ fordert den Schuldner auf, das Schriftstück an sich zu nehmen. »Nimm« ist natürlich und handlungsnah.
- source_word: τὰ γράμματα
  choice: deinen Schuldschein
  rationale: Wörtlich steht im Griechischen der Plural »deine Schriftstücke/Unterlagen«. Im Zusammenhang ist die schriftliche Schuldurkunde gemeint; »Schuldschein« gibt diese Funktion idiomatisch wieder, während die Fußnote die weitere Bedeutung offenhält.
- source_word: καθίσας
  choice: setz dich hin
  rationale: Das Partizip begleitet den folgenden Imperativ und wird im Deutschen natürlich als koordinierte Aufforderung wiedergegeben.
- source_word: ταχέως
  choice: schnell
  rationale: Das Adverb bezeichnet die zügige Ausführung und wird direkt mit »schnell« wiedergegeben.
- source_word: γράψον
  choice: schreib
  rationale: Der Imperativ fordert dazu auf, den geänderten Betrag einzutragen. »Schreib« bleibt nahe am Wortlaut, ohne das nicht ausdrücklich genannte Objekt zu ergänzen.
- source_word: πεντήκοντα
  choice: fünfzig
  rationale: Die Zahl wird ohne interpretierende Ergänzung direkt wiedergegeben.
