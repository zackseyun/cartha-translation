source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: de
  text: Und sein Herr lobte den ungerechten Verwalter, weil er klug gehandelt hatte.[a] Denn die Söhne dieses Zeitalters sind im Umgang mit ihresgleichen klüger als die Söhne des Lichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang der Herr des Verwalters, also der reiche Mann im Gleichnis. Das griechische Wort kann je nach Kontext auch als Hoheitstitel „der Herr“ verwendet werden.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „den Söhnen des Lichts gegenüber im Blick auf ihre eigene Generation“. Die griechische Wendung ist schwierig; „im Umgang mit ihresgleichen“ gibt eine naheliegende Deutung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Im unmittelbaren Gleichniskontext bezeichnet κύριος am ehesten den reichen Herrn des Verwalters. Das deutsche „Herr“ wahrt jedoch die echte lexikalische Mehrdeutigkeit gegenüber einer direkten Beziehung auf Jesus; die Fußnote erläutert den naheliegenden Bezug.
- source_word: οἰκονόμον τῆς ἀδικίας
  choice: den ungerechten Verwalter
  rationale: „Verwalter“ ist eine geläufige moderne Bezeichnung für einen mit der Vermögensverwaltung Beauftragten. Der attributive Genitiv wird idiomatisch als „ungerecht“ wiedergegeben, ohne die genaue Form seines Unrechts enger als der griechische Text zu bestimmen.
- source_word: φρονίμως / φρονιμώτεροι
  choice: klug / klüger
  rationale: „Klug“ bezeichnet hier praktische Umsicht und geschicktes Vorgehen. Der Kontext und die ausdrückliche Bezeichnung als ungerecht verhindern, dass daraus automatisch moralische Billigung wird; die Wiederholung desselben Wortstamms wahrt den Zusammenhang beider Formen.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: die Söhne dieses Zeitalters
  rationale: Die semitisch geprägte Zugehörigkeitsmetapher und die Parallele zu „Söhne des Lichts“ bleiben erhalten. „Zeitalter“ entspricht αἰών genauer als „Welt“.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: die Söhne des Lichts
  rationale: Die biblische Bildsprache und der formale Gegensatz zu den „Söhnen dieses Zeitalters“ werden bewahrt.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: im Umgang mit ihresgleichen
  rationale: Die griechische Wendung ist syntaktisch schwierig. Diese Wiedergabe versteht γενεά relational als die eigene Gruppe beziehungsweise Art und macht den wahrscheinlich gemeinten Vergleich in natürlichem Deutsch verständlich; eine formnähere Alternative steht in der Fußnote.
theological_decisions:
- issue: Identität von ὁ κύριος
  choice: „der Herr“, im Kontext wahrscheinlich der Herr des Verwalters
  alternative: „der Herr“ als direkte Bezeichnung für Jesus oder Gott; eindeutiger „sein Herr“ beziehungsweise „der Dienstherr“
  rationale: Der unmittelbare Erzählzusammenhang legt den reichen Herrn innerhalb des Gleichnisses nahe. Weil der griechische Ausdruck selbst nicht ausdrücklich „sein“ sagt und zugleich die übliche Bezeichnung „der Herr“ sein kann, wird die Ambiguität im Haupttext bewahrt und in der Fußnote eingeordnet.
- issue: Moralische Bewertung des Handelns
  choice: Lob der praktischen Klugheit bei fortbestehender Kennzeichnung des Verwalters als ungerecht
  alternative: Billigung seines Unrechts oder moralisch uneingeschränktes Lob seiner Weisheit
  rationale: 'Der Text hält beides nebeneinander: Der Verwalter ist „ungerecht“, hat aber „klug“ gehandelt. Die Übersetzung bewahrt diese Spannung und erklärt das Lob nicht als Zustimmung zu seinem Unrecht.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Zugehörigkeitsmetapher „Söhne dieses Zeitalters / Söhne des Lichts“ bleibt bewusst erhalten. „Klug“ und „klüger“ bilden den griechischen Wortzusammenhang natürlich ab; die moralische Spannung wird nicht geglättet.
