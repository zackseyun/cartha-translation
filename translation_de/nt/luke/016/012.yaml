  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: de
  text: Und wenn ihr in dem, was einem anderen gehört, nicht treu gewesen seid,[a] wer wird euch geben, was euch gehört?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in dem Fremden«; auch: »mit fremdem Gut« oder »mit dem, was einem anderen gehört«.'
    reason: lexical_alternative
  - marker: b
    text: Der Gegensatz kann den treuen Umgang mit irdischem Besitz jetzt und den Empfang wahrer oder bleibender Güter später meinen; der Vers selbst benennt die Bezugspunkte nicht ausdrücklich.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ
  choice: Und wenn
  rationale: Bewahrt die Verknüpfung mit dem vorausgehenden Ausspruch und leitet die Bedingung natürlich ein.
- source_word: ἐν τῷ ἀλλοτρίῳ
  choice: mit dem, was einem anderen gehört
  rationale: Das substantivierte Neutrum bezeichnet fremdes beziehungsweise einem anderen gehörendes Gut; „mit“ gibt den Bereich verantwortlichen Umgangs im Deutschen idiomatisch wieder.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: nicht treu gewesen seid
  rationale: πιστός bezeichnet hier Treue und Verlässlichkeit im Umgang mit anvertrautem Gut, nicht Glauben im engeren Sinn.
- source_word: τὸ ὑμέτερον
  choice: was euch selbst gehört
  rationale: Gibt das substantivierte Possessivpronomen wieder und erhält den pointierten Gegensatz zu dem, was einem anderen gehört.
- source_word: τίς δώσει ὑμῖν
  choice: wer wird euch dann geben
  rationale: Bleibt bei der Grundbedeutung von δίδωμι und gibt die rhetorische Frage klar wieder; „dann“ verdeutlicht lediglich den im Bedingungssatz vorhandenen Folgerungszusammenhang.
theological_decisions:
- issue: Bezug des Gegensatzes zwischen fremdem und eigenem Gut
  choice: Die Bezugspunkte bleiben im Haupttext unbestimmt.
  alternative: Irdischer Reichtum im Gegensatz zu wahrem beziehungsweise künftigem Reichtum; alternativ fremdes Verwaltungsgut im Gegensatz zu eigenem Besitz oder Erbe.
  rationale: Der Vers formuliert den Gegensatz, benennt dessen konkrete Größen aber nicht. Die Übersetzung wahrt diese Offenheit und legt keine einzelne heilsgeschichtliche oder ethische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Formulierungen „was einem anderen gehört“ und „was euch selbst gehört“ bilden den Gegensatz des griechischen Textes transparent ab; die konkreten Bezugspunkte werden nicht interpretierend ergänzt.
