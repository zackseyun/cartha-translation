  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: de
  text: 'Und ich sage euch: Macht euch Freunde mithilfe des ungerechten Reichtums[a], damit sie euch, wenn er zu Ende geht[b], in die ewigen Wohnungen aufnehmen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Mammon der Ungerechtigkeit“. „Mammon“ ist die traditionelle Wiedergabe des griechischen Wortes für Reichtum oder Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wenn er nicht mehr ausreicht“ oder „wenn er ausgeht“. Das griechische Verb nennt sein Subjekt hier nicht ausdrücklich; meist wird es auf den Reichtum bezogen. Manche verstehen die Wendung im Sinn des Todes eines Menschen.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „in die ewigen Zelte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: Macht euch Freunde
  rationale: Gibt den reflexiven Dativ und den Imperativ eng, zugleich aber in natürlichem modernem Deutsch wieder.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: mithilfe des ungerechten Reichtums
  rationale: „Mithilfe“ bringt die im Zusammenhang naheliegende instrumentale Bedeutung von ἐκ zum Ausdruck. „Ungerechter Reichtum“ wahrt die breite moralische Spannung von τῆς ἀδικίας, ohne den Ausdruck auf betrügerisch erworbenes Vermögen zu verengen.
- source_word: μαμωνᾶ
  choice: Reichtum
  rationale: „Reichtum“ ist heute unmittelbar verständlich und vermeidet eine stärkere Personifizierung, als der Satz selbst verlangt; die traditionelle Wiedergabe „Mammon“ bleibt in der Fußnote erhalten.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: damit … wenn er zu Ende geht
  rationale: Das intransitive Verb bezeichnet ein Versagen oder Zu-Ende-Gehen. Der nächstliegende Bezug ist der Reichtum; die grammatisch beziehungsweise auslegungsgeschichtlich mögliche Beziehung auf die Angesprochenen wird in der Fußnote bewahrt.
- source_word: δέξωνται ὑμᾶς
  choice: sie euch … aufnehmen
  rationale: „Aufnehmen“ passt zur Aufnahme in Wohnungen und lässt wie der griechische Text offen, wer mit dem unausgesprochenen Subjekt „sie“ gemeint ist.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: in die ewigen Wohnungen
  rationale: „Wohnungen“ vermittelt die gemeinte Stätte des Wohnens in natürlichem Deutsch; das konkrete Bild der Zelte wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung des „ungerechten Reichtums“
  choice: Reichtum, der zur von Ungerechtigkeit geprägten gegenwärtigen Welt gehört, ohne Festlegung darauf, dass er stets betrügerisch erworben wurde
  alternative: unehrlich oder unrechtmäßig erworbener Reichtum; personifizierter Mammon als rivalisierender Herr
  rationale: Die Formulierung bewahrt die moralische Spannung des Genitivs, verengt sie aber weder auf die Herkunft des Vermögens noch erzwingt sie hier eine Personifizierung.
- issue: Subjekt von ἐκλίπῃ
  choice: Der Reichtum geht zu Ende
  alternative: Ihr versagt beziehungsweise sterbt; die verfügbaren irdischen Mittel gehen allgemein zu Ende
  rationale: μαμωνᾶς ist der nächstliegende Bezug. Da das Subjekt im Griechischen nicht ausdrücklich genannt wird und auch eine Beziehung auf den Tod der Angesprochenen vertreten wird, nennt die Fußnote diese Möglichkeit.
- issue: Identität des unausgesprochenen Subjekts von δέξωνται
  choice: nicht näher bestimmt („sie“)
  alternative: die durch den Gebrauch des Reichtums gewonnenen Freunde; die Armen beziehungsweise Gottes Volk; himmlische Wesen
  rationale: Der griechische Text bestimmt die Aufnehmenden nicht ausdrücklich. Eine Präzisierung würde die vorhandene theologische Offenheit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt gut sprechbar und wahrt zugleich die Bildsprache sowie die grammatischen und theologischen Mehrdeutigkeiten des griechischen Textes.
