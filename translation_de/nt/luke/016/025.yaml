source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: de
  text: 'Abraham aber sagte: »Kind, denk daran: Du hast in deinem Leben deine guten Dinge empfangen[a] und Lazarus ebenso die schlimmen Dinge. Jetzt aber wird er hier getröstet, du aber leidest Qualen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine guten Dinge vollständig empfangen hast« beziehungsweise »die dir zugedachten guten Dinge empfangen hast«. Das griechische Verb kann den vollständigen Empfang oder den Empfang des Zugewiesenen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gequält wirst« oder »Schmerzen leidest«. Das griechische Wort bezeichnet starken Schmerz oder tiefe Bedrängnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Kind
  rationale: Die Anrede wahrt den familiären, möglicherweise mitfühlenden Ton und das Gefälle zwischen Abraham und dem Angesprochenen, ohne eine leibliche Sohnschaft zu behaupten.
- source_word: μνήσθητι
  choice: erinnere dich daran
  rationale: Gibt den Aoristimperativ direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἀπέλαβες
  choice: empfangen hast
  rationale: Bewahrt die Grundbedeutung; die mögliche Nuance des vollständigen Empfangens oder des Empfangens des Zugewiesenen wird in der Fußnote offengehalten.
- source_word: τὰ ἀγαθά σου
  choice: dein Gutes
  rationale: Das substantivierte Neutrum Plural bezeichnet zusammenfassend die guten Dinge, die dem Mann im Leben zuteilwurden. Die Formulierung bleibt nahe am Griechischen und vermeidet die theologisch stärker geprägte Wiedergabe „Segnungen“.
- source_word: ἐν τῇ ζωῇ σου
  choice: in deinem Leben
  rationale: Eine natürliche zeitliche Angabe für die irdische Lebenszeit.
- source_word: ὁμοίως
  choice: ebenso
  rationale: Markiert knapp die parallele, zugleich gegensätzliche Zuordnung zu Lazarus.
- source_word: τὰ κακά
  choice: das Schlechte
  rationale: Bezeichnet hier schlimme Erfahrungen und nicht von Lazarus begangenes moralisches Böses; die breite Formulierung legt die Art seines Leidens nicht unnötig fest.
- source_word: παρακαλεῖται
  choice: wird getröstet
  rationale: Das Passiv bezeichnet in diesem Zusammenhang den Empfang von Trost und gibt den Gegensatz zu seinem früheren Leiden klar wieder.
- source_word: ὧδε
  choice: hier
  rationale: Entspricht dem deiktischen Ortsadverb ohne zusätzliche Auslegung.
- source_word: ὀδυνᾶσαι
  choice: Qualen leidest
  rationale: Bringt den starken körperlichen oder seelischen Schmerz idiomatisch zum Ausdruck, ohne dessen genaue Art dogmatisch festzulegen.
theological_decisions:
- issue: Sprache für das Leiden nach dem Tod
  choice: während du Qualen leidest
  alternative: und du gequält wirst / und du leidest Schmerzen
  rationale: Die Wiedergabe hält an der im Text dargestellten bewussten schweren Not fest, deutet aber weder ihre Ursache noch ihre genaue Beschaffenheit über das griechische Verb hinaus aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kind“ erhält den persönlichen Ton der Anrede. „Dein Gutes“ und „das Schlechte“ bewahren die knappe Gegenüberstellung des griechischen Textes; „während“ macht den kontrastierenden Satzanschluss im Deutschen flüssig.
