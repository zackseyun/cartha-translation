id: LUK.16.24
reference: Luke 16:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: de
  text: 'Da rief er: »Vater Abraham, erbarme dich meiner und schick Lazarus, damit er seine Fingerspitze ins Wasser taucht und meine Zunge kühlt; denn ich leide Qualen[a] in dieser Flamme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich werde in dieser Flamme gequält«. Das griechische Verb kann schweres Leiden oder Gequältwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας εἶπεν
  choice: Da rief er
  rationale: Die Verbindung aus Partizip und finitem Verb bezeichnet hier ein lautes, dringliches Rufen. Die natürliche deutsche Wiedergabe vermeidet das schwerfällige »rufend sagte er«.
- source_word: Πάτερ Ἀβραάμ
  choice: Vater Abraham
  rationale: Die direkte Anrede und der Bezug auf Abraham als Stammvater bleiben erhalten.
- source_word: ἐλέησόν με
  choice: erbarme dich meiner
  rationale: Die geläufige, würdevolle Bitte gibt den Ruf nach Erbarmen präzise wieder.
- source_word: πέμψον Λάζαρον
  choice: schick Lazarus
  rationale: »Schick« ist im heutigen Deutsch die natürliche Form einer direkten Bitte und entspricht dem einfachen Imperativ.
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: seine Fingerspitze ins Wasser taucht
  rationale: βάπτω bezeichnet ein kurzes Eintauchen; »Fingerspitze« gibt die äußerste Spitze des Fingers knapp und anschaulich wieder.
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: meine Zunge kühlt
  rationale: Die konkrete körperliche Bildsprache des griechischen Textes wird direkt bewahrt.
- source_word: ὀδυνῶμαι
  choice: ich leide Qualen
  rationale: Das Verb bezeichnet starkes schmerzliches Leiden. Die Formulierung wahrt diese Intensität, ohne ausdrücklich einen äußeren Peiniger vorauszusetzen.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: in dieser Flamme
  rationale: φλόξ bezeichnet spezifisch eine Flamme; der Singular und das lebhafte Bild bleiben erhalten.
theological_decisions:
- issue: Art des Leidens des reichen Mannes
  choice: ich leide Qualen in dieser Flamme
  alternative: ich werde in dieser Flamme gequält
  rationale: Der Text beschreibt heftiges Leiden, lässt aber offen, ob der Ausdruck aktiv als Quälen durch einen Handelnden verstanden werden soll. »Ich leide Qualen« bewahrt die Stärke des Verbs, ohne diese Frage festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller direkter Rede. »Erbarme dich meiner« ist bewusst etwas gehobener, aber weiterhin geläufig; die übrige Syntax ist klar und natürlich.
