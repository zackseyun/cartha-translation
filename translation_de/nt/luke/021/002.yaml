base_translation:
  language: en
  yaml_path: translation/nt/luke/021/002.yaml
  text: And he saw a poor widow putting in two small copper coins there,[a]
translation:
  language: de
  text: Er sah aber eine arme Witwe, die dort zwei kleine Kupfermünzen einwarf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „zwei Lepta“, also zwei sehr kleine Kupfermünzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: er sah
  rationale: Der Aorist von ὁράω wird schlicht und dem Erzählfluss entsprechend mit „sah“ wiedergegeben.
- source_word: δέ
  choice: aber
  rationale: δέ ist ein leichter weiterführender Konnektor. „Aber“ markiert hier den Wechsel von den Reichen zur Witwe, ohne einen scharfen Gegensatz zu behaupten.
- source_word: τινα
  choice: eine
  rationale: Das indefinite Pronomen bezeichnet eine nicht näher bestimmte Person; im natürlichen Deutschen genügt der unbestimmte Artikel.
- source_word: χήραν πενιχρὰν
  choice: eine arme Witwe
  rationale: χήρα bedeutet „Witwe“, πενιχρός bezeichnet geringe Mittel oder Armut. „Arm“ ist natürlich und überzeichnet den Grad ihrer Not nicht.
- source_word: βάλλουσαν
  choice: die … einwarf
  rationale: Im Zusammenhang mit Geldgaben ist „einwerfen“ idiomatischer als das wörtlichere „werfen“ und bewahrt die konkrete Handlung.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das Ortsadverb verweist auf den im vorherigen Kontext genannten Opferkasten.
- source_word: λεπτὰ δύο
  choice: zwei kleine Kupfermünzen
  rationale: λεπτά waren äußerst geringwertige Kupfermünzen. Die verständliche Sachübersetzung vermittelt Art und geringen Wert; die antike Bezeichnung wird in der Fußnote genannt.
