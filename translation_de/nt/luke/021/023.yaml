id: LUK.21.23
reference: Luke 21:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: de
  text: Wehe den Schwangeren und den Stillenden in jenen Tagen! Denn große Not wird über das Land kommen[a] und Zorn über dieses Volk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Erde“. Das griechische Wort γῆ kann „Land“ oder „Erde“ bedeuten; wegen des Zusammenhangs mit Jerusalem und Judäa steht hier „Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zorn für dieses Volk“ oder „Zorn gegen dieses Volk“.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Wehe
  rationale: Bewahrt den prophetischen Ausruf, der Klage und Gericht anklingen lässt, und entspricht dem gewichtigen Ton des griechischen Ausdrucks.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: den Schwangeren
  rationale: Gibt die wörtliche Wendung „denen, die im Mutterleib haben“ knapp, natürlich und ohne altertümliche Sprache wieder.
- source_word: ταῖς θηλαζούσαις
  choice: den Stillenden
  rationale: Ist im modernen Deutschen eine natürliche und präzise Bezeichnung für Frauen, die ein Kind stillen; das im griechischen Verb vorausgesetzte Objekt muss nicht eigens ergänzt werden.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Folgt der griechischen Zeitangabe eng und entspricht zugleich geläufiger biblischer Standardsprache.
- source_word: ἀνάγκη μεγάλη
  choice: große Not
  rationale: Im Zusammenhang von Belagerung und Katastrophe bezeichnet ἀνάγκη bedrängende Not und nicht lediglich abstrakte Notwendigkeit.
- source_word: ἐπὶ τῆς γῆς
  choice: über das Land
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Der unmittelbare Zusammenhang mit Jerusalem und Judäa spricht hier vorrangig für „Land“; „über“ bildet die Konstruktion mit ἐπί angemessen ab.
- source_word: ὀργή
  choice: Zorn
  rationale: Bewahrt die Stärke und Offenheit des Ausdrucks, ohne durch „Gericht“ dessen Wirkung zu interpretieren oder „Gottes“ als im Text nicht genannten Urheber hinzuzufügen.
- source_word: τῷ λαῷ τούτῳ
  choice: über dieses Volk
  rationale: Der Dativ bezeichnet hier das vom Zorn betroffene Volk. „Über“ ist im Deutschen idiomatisch und hält die Formulierung offen; „dieses Volk“ bewahrt die demonstrative Bestimmtheit.
theological_decisions:
- issue: Referenz und Reichweite von γῆ und „dieses Volk“
  choice: „das Land“ bezeichnet im unmittelbaren Zusammenhang vorrangig das Land Judäa/Israel; „dieses Volk“ das dort vom angekündigten Unheil betroffene Volk.
  alternative: „die Erde“ mit universalem Bezug auf die gesamte Menschheit.
  rationale: Der Kontext handelt von Jerusalem, seiner Belagerung und Judäa. Die lokale Wiedergabe ist daher wahrscheinlicher, während eine Fußnote die echte lexikalische Möglichkeit eines weiteren Bezugs bewahrt.
- issue: Urheber und Art des ὀργή
  choice: „Zorn“ ohne ausdrückliche Ergänzung „Gottes“.
  alternative: „Gottes Zorn“ oder interpretierend „Gericht“.
  rationale: Der Zusammenhang kann göttlichen Zorn nahelegen, doch der griechische Vers nennt dessen Urheber nicht. Die Übersetzung lässt diese theologische Spannung bestehen.
- issue: Beziehung des Zorns zu τῷ λαῷ τούτῳ
  choice: „Zorn über dieses Volk“.
  alternative: „Zorn für dieses Volk“ oder „Zorn gegen dieses Volk“.
  rationale: Der griechische Dativ kennzeichnet das betroffene Volk, legt die deutsche Präposition jedoch nicht eindeutig fest. „Über“ ist natürlich und wahrt stärker als „gegen“ die formale Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Eindringlichkeit. „Wehe“, „in jenen Tagen“ und „Zorn“ erhalten den biblischen Ton, ohne unnötig altertümlich zu wirken. Die Satzfolge und das Ausrufezeichen bilden die Dringlichkeit des griechischen Textes ab.
