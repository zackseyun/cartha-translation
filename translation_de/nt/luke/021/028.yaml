  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: de
  text: Doch wenn dies alles zu geschehen beginnt, richtet euch auf[a] und hebt eure Köpfe, denn eure Erlösung[b] naht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blickt auf“. Das griechische Verb kann das Aufrichten aus gebeugter Haltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Befreiung“. Im endzeitlichen Zusammenhang bezeichnet der Ausdruck die nahende endgültige Befreiung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: Doch wenn das alles zu geschehen beginnt
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet den zeitlichen Umstand. „Wenn … beginnt“ bewahrt den Beginn des Geschehens; „das alles“ nimmt τούτων im natürlichen modernen Deutsch auf. „Doch“ gibt den leichten Kontrast zur vorausgehenden Bedrängnis wieder.
- source_word: ἀνακύψατε
  choice: richtet euch auf
  rationale: Das Verb bezeichnet das körperliche Aufrichten aus gebeugter Haltung und vermittelt im Zusammenhang zugleich neuen Mut und Zuversicht, ohne diese Deutung ausdrücklich in den Text einzutragen.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: hebt eure Köpfe
  rationale: Die Formulierung bewahrt das konkrete Bild und die Mehrzahl des griechischen Textes in verständlichem Deutsch.
- source_word: διότι
  choice: denn
  rationale: „Denn“ gibt die begründende Funktion knapp und würdig wieder.
- source_word: ἐγγίζει
  choice: naht
  rationale: „Naht“ drückt die gegenwärtige Annäherung prägnant aus und passt zum gehobenen, aber weiterhin verständlichen Register.
- source_word: ἀπολύτρωσις
  choice: Erlösung
  rationale: „Erlösung“ bewahrt sowohl den Gedanken der Befreiung als auch das theologische Gewicht des Begriffs; „Befreiung“ bleibt eine mögliche Wiedergabe.
theological_decisions:
- issue: Bedeutung von ἡ ἀπολύτρωσις ὑμῶν im endzeitlichen Zusammenhang
  choice: „eure Erlösung“, ohne den Vorgang näher festzulegen
  alternative: „eure Befreiung“ im Sinn einer ausschließlich unmittelbaren historischen Rettung
  rationale: Der zukünftige, endzeitlich geprägte Zusammenhang weist auf die nahende endgültige Befreiung und Rechtfertigung der Jünger Jesu. Die Übersetzung bewahrt jedoch die Weite des Begriffs und legt weder Mechanismus noch genaue zeitgeschichtliche Zuordnung in den Wortlaut hinein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Naht“ ist leicht gehoben, aber geläufig; „Köpfe“ vermeidet das altertümliche „Häupter“.
