source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: de
  text: Dann sollen diejenigen, die in Judäa sind, in die Berge fliehen; diejenigen, die in ihrer Mitte[a] sind, sollen fortgehen, und diejenigen, die auf dem Land sind, sollen nicht in sie hineingehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die femininen Fürwörter „ihrer“ und „sie“ beziehen sich im Zusammenhang wahrscheinlich auf Jerusalem. Im griechischen Text stehen sie im Femininum; der Ortsname wird in diesem Vers nicht wiederholt.
    reason: Klärt den wahrscheinlichen Bezug und die grammatische Form, ohne den im Vers anaphorisch bleibenden Bezug im Haupttext aufzulösen.
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Kennzeichnet knapp und natürlich die zeitliche Folge zu den zuvor genannten Zeichen.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: die, die in Judäa sind
  rationale: Gibt die substantivierte Präpositionalfügung genau und in verständlichem modernem Deutsch wieder.
- source_word: φευγέτωσαν
  choice: sollen … fliehen
  rationale: Das deutsche „sollen“ gibt hier den auffordernden dritten Personen des griechischen Imperativs natürlich wieder, ohne die Aussage zu einem bloßen Ratschlag abzuschwächen.
- source_word: εἰς τὰ ὄρη
  choice: in die Berge
  rationale: Bewahrt das Ziel der Flucht und entspricht der gewöhnlichen Bedeutung von ὄρη.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: die in ihrer Mitte sind
  rationale: Bewahrt den femininen Rückverweis αὐτῆς und wiederholt das im Vers nicht ausdrücklich genannte Jerusalem nicht.
- source_word: ἐκχωρείτωσαν
  choice: sollen fortgehen
  rationale: Gibt die Aufforderung zum Verlassen beziehungsweise Sichentfernen wieder, ohne ein ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: οἱ ἐν ταῖς χώραις
  choice: die auf dem Land sind
  rationale: χῶραι bezeichnet hier die ländlichen Gebiete außerhalb der Stadt; „auf dem Land“ ist im heutigen Deutsch natürlich und nicht auf Äcker beschränkt.
- source_word: μὴ εἰσερχέσθωσαν
  choice: sollen nicht … hineingehen
  rationale: Bewahrt den verneinten Imperativ und die gerichtete Bewegung des Verbs.
- source_word: εἰς αὐτήν
  choice: in sie
  rationale: Erhält den femininen Rückverweis des Griechischen, dessen Bezug aus dem vorangehenden Kontext erschlossen wird.
theological_decisions:
- issue: Bezug und Genus von αὐτῆς und αὐτήν
  choice: Die femininen Pronomen werden als „ihrer“ und „sie“ beibehalten und in einer Fußnote auf Jerusalem bezogen.
  alternative: Im Haupttext ausdrücklich „Jerusalem“ beziehungsweise „die Stadt“ einsetzen.
  rationale: Der unmittelbare weitere Kontext nennt Jerusalem, doch der vorliegende Vers wiederholt den Namen nicht; zudem ist auch Ἰουδαία grammatisch feminin. Die gewählte Fassung bewahrt den femininen Rückverweis und die mögliche Spannung der Anapher, während die Fußnote den wahrscheinlich gemeinten Bezug erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Aufforderungsstruktur wird durch paralleles „sollen“ bewahrt; das Semikolon gliedert die eng verbundenen Fluchtanweisungen.
