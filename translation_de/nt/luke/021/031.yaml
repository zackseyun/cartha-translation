  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: de
  text: 'So auch ihr: Wenn ihr seht, dass diese Dinge geschehen, dann erkennt[a], dass das Reich Gottes[b] nahe ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Feststellung: „dann wisst ihr“.'
    reason: grammatical_alternative
  - marker: b
    text: 'Oder: „die Herrschaft Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So auch ihr
  rationale: Die vorangestellte Wendung überträgt den zuvor genannten Vergleich auf die Jünger und bewahrt durch das ausdrückliche „ihr“ die Betonung des griechischen Pronomens.
- source_word: ὅταν ἴδητε
  choice: Wenn ihr seht
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier einen zukünftigen Fall; „wenn“ ist im Deutschen natürlich und passt zum vorausweisenden Zusammenhang.
- source_word: ταῦτα γινόμενα
  choice: dass dies geschieht
  rationale: Die Konstruktion mit Partizip bezeichnet die beobachteten Ereignisse. Ein deutscher dass-Satz gibt sie klar und idiomatisch wieder, ohne den Bezug auf die zuvor genannten Zeichen zu erweitern.
- source_word: γινώσκετε
  choice: erkennt
  rationale: Im Kontext fordert das Verb dazu auf, aus den sichtbaren Ereignissen deren Bedeutung zu erschließen. „Erkennt“ gibt diesen Sinn präziser wieder als das statischere „wisst“.
- source_word: ἐγγύς ἐστιν
  choice: nahe ist
  rationale: Die Formulierung bewahrt die zeitlich-räumliche Metapher des griechischen Ausdrucks, ohne eine bestimmte eschatologische Abfolge einzutragen.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die geläufige biblische Wendung lässt sowohl Gottes Herrschaft als auch deren Bereich und endzeitliche Offenbarung anklingen, ohne den Ausdruck auf nur einen Aspekt zu verengen.
theological_decisions:
- issue: Bedeutung von „Reich Gottes“ im eschatologischen Zusammenhang
  choice: Reich Gottes
  alternative: Herrschaft Gottes
  rationale: Der Vers verbindet die Nähe des Reiches mit den beschriebenen Zeichen, legt aber nicht fest, ob vor allem seine Offenbarung, Vollendung oder Durchsetzung gemeint ist. Die traditionelle und sachlich offene Formulierung bewahrt diese Spannung.
- issue: Aussageweise von γινώσκετε
  choice: 'Aufforderung: „erkennt“'
  alternative: 'Feststellung: „dann wisst ihr“'
  rationale: Die Form kann formal als Imperativ oder Indikativ verstanden werden. Der Zusammenhang mit der entsprechenden Aufforderung im Feigenbaumvergleich spricht für den Imperativ; die grammatische Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die vorangestellte Anwendung des Vergleichs natürlich ab; „dann“ verdeutlicht die deutsche Satzstruktur, ohne dem Gedankengang einen neuen Inhalt hinzuzufügen.
