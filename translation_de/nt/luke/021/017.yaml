  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: de
  text: Und ihr werdet von allen gehasst werden wegen meines Namens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen mir“. Die Wendung „mein Name“ kann für Jesu Person und Autorität sowie für das Bekenntnis zu ihm stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: ihr werdet … gehasst werden
  rationale: Die Verbindung aus dem Futur von εἰμί und dem passiven Partizip wird im natürlichen modernen Deutsch als Futur Passiv wiedergegeben. So bleibt sowohl der Zukunftsbezug als auch die passive Rolle der Angeredeten erhalten.
- source_word: ὑπὸ πάντων
  choice: von allen
  rationale: ὑπό mit Genitiv bezeichnet hier die handelnden Personen. „Von allen“ bewahrt die knappe und umfassende Formulierung des Griechischen, ohne das nicht ausdrücklich vorhandene Wort „Menschen“ hinzuzufügen.
- source_word: διὰ τὸ ὄνομά μου
  choice: wegen meines Namens
  rationale: διά mit Akkusativ bezeichnet den Grund. „Wegen meines Namens“ ist idiomatisches Deutsch und erhält die ausdrückliche Rede vom Namen Jesu mit ihren möglichen Bezügen auf seine Identität, Autorität und das Bekenntnis zu ihm.
theological_decisions:
- issue: Bedeutung von „meines Namens“ im Zusammenhang der Verfolgung
  choice: Die wörtliche Wendung „wegen meines Namens“ bleibt im Haupttext erhalten.
  alternative: „wegen mir“ oder „weil ihr euch zu mir bekennt“
  rationale: Der griechische Text nennt ausdrücklich Jesu „Namen“. Eine erklärende Auflösung würde die mögliche Bedeutungsbreite auf nur einen Aspekt verengen; die Fußnote macht die naheliegenden Sinngehalte transparent.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die kompakte Satzstruktur und die umfassende Aussage „von allen“ werden beibehalten.
