  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: de
  text: wie eine Falle. Denn er wird über alle kommen, die auf der ganzen Erde wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die auf dem Angesicht der ganzen Erde sitzen“. Das griechische Wort für „Erde“ kann auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς παγίς
  choice: wie eine Falle
  rationale: παγίς bezeichnet eine Falle oder Schlinge. „Falle“ ist im heutigen Deutsch unmittelbar verständlich und bewahrt das Bild des plötzlichen, unausweichlichen Zugriffs.
- source_word: ἐπεισελεύσεται
  choice: er wird über … kommen
  rationale: Das Futur von ἐπεισέρχομαι bezeichnet hier ein Herankommen, das Menschen trifft. Das maskuline Pronomen nimmt im Deutschen natürlich „jener Tag“ aus dem vorhergehenden Vers auf, ohne den Bezug im Vers selbst ausdrücklich zu ergänzen.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Warnung; „Denn“ gibt diese Verknüpfung in würdigem, natürlichem Deutsch wieder.
- source_word: ἐπὶ πάντας
  choice: über alle
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung auf die Betroffenen zu; zusammen mit „kommen“ ist „über alle kommen“ idiomatisch und bewahrt den bedrohlichen Sinn.
- source_word: τοὺς καθημένους
  choice: die … wohnen
  rationale: κάθημαι bedeutet wörtlich „sitzen“, bezeichnet in dieser räumlichen Wendung aber die Menschen, die auf der Erde ansässig sind oder leben. „wohnen“ gibt den idiomatischen Sinn natürlich wieder.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: auf der ganzen Erde
  rationale: Die wörtliche Wendung „auf dem Angesicht der ganzen Erde“ ist semitisch geprägt und meint deren gesamte Oberfläche. Die natürliche deutsche Fassung erhält die universale räumliche Aussage.
theological_decisions:
- issue: Reichweite von γῆ in der endzeitlichen Warnung
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. In Verbindung mit „alle, die … wohnen“ und πάσης liegt hier der umfassende Sinn „ganze Erde“ näher; die alternative lexikalische Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Unausgesprochenes Subjekt von ἐπεισελεύσεται
  choice: „er“ als Rückverweis auf „jener Tag“ in Vers 34
  alternative: unpersönliches „es“ oder ausdrückliches „jener Tag“
  rationale: Im griechischen Vers ist das Subjekt aus dem vorhergehenden Zusammenhang zu erschließen. Das deutsche „er“ hält den Rückverweis erkennbar, ohne eine im vorliegenden Satz nicht wiederholte Nominalgruppe einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Warncharakter. Die semitisch geprägte Oberflächenformel wird zugunsten natürlichen Deutschen idiomatisch wiedergegeben; ihre wörtliche Gestalt und die Mehrdeutigkeit von γῆ werden in der Fußnote bewahrt.
