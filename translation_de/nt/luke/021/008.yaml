  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: de
  text: 'Er aber sagte: „Seht zu, dass ihr nicht in die Irre geführt werdet. Denn viele werden in meinem Namen kommen und sagen: ‚Ich bin es‘[a] und: ‚Die Zeit ist nahe.‘ Folgt ihnen nicht!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder schlicht: „Ich bin“; gemeint ist der Anspruch eines Verführers, der sich als der Erwartete ausgibt, möglicherweise als der Messias.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Seht zu, dass ihr nicht in die Irre geführt werdet
  rationale: Die Wiedergabe bewahrt den Wachsamkeitsimperativ und die passive Form des griechischen Ausdrucks; „in die Irre geführt“ erhält zudem das Bild des Abirrens.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: werden unter meinem Namen kommen
  rationale: „Unter meinem Namen“ bezeichnet ein Auftreten mit Berufung auf Jesu Namen oder in beanspruchter Verbindung mit seiner Identität, ohne die genaue Art des Anspruchs stärker festzulegen.
- source_word: λέγοντες
  choice: und sagen
  rationale: Die schlichte Wiedergabe bleibt formal nah am Partizip und überlässt es dem Inhalt der Aussagen, ihren täuschenden Anspruch erkennen zu lassen.
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Die im Deutschen natürliche elliptische Selbstidentifikation gibt den erwarteten, aber im Griechischen unausgesprochenen Bezug wieder, ohne ausdrücklich „der Messias“ einzusetzen.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Die Zeit ist nahe gekommen
  rationale: „Zeit“ lässt die kontextuell entscheidende oder festgesetzte Zeit erkennen; „ist nahe gekommen“ bildet das Perfekt mit gegenwärtigem Ergebnis ab.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Lauft ihnen nicht nach
  rationale: Die Formulierung bewahrt die Richtungsmetaphorik von ὀπίσω und bezeichnet zugleich das Verbot, solchen Anspruchstellern zu folgen.
theological_decisions:
- issue: Wiedergabe von Ἐγώ εἰμι bei falschen Anspruchstellern
  choice: Ich bin es
  alternative: Ich bin; Ich bin der Messias
  rationale: „Ich bin es“ macht die elliptische Selbstidentifikation verständlich, legt aber nicht ausdrücklich fest, dass das ausgelassene Prädikat „der Messias“ lautet. Die knappere Form „Ich bin“ bleibt als echte sprachliche Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die warnenden Imperative sind unmittelbar formuliert; „Lauft ihnen nicht nach“ ist allgemein verständlich und erhält das Bewegungsbild des Ausgangstextes.
