  verdict: revise
  source_fidelity: '„Denn dies sind Tage der Vergeltung“ gibt ὅτι, ἡμέραι ἐκδικήσεως und αὗταί εἰσιν angemessen wieder. Die Fassung „an denen … erfüllt werden soll“ ist jedoch keine angemessene Entsprechung von τοῦ πλησθῆναι: Sie macht aus der Final-/Resultatkonstruktion einen temporalen Relativsatz und fügt mit „soll“ eine Modalität hinzu, die im Griechischen nicht ausgedrückt ist.'
  naturalness: Die vorgeschlagene Hauptfassung ist modernes, würdiges Standarddeutsch. Die Stellung „alles erfüllt wird, was geschrieben steht“ ist klar und idiomatisch.
  terminology: „Vergeltung“ trifft den gerichtlichen Charakter von ἐκδίκησις ohne die im gegenwärtigen Deutsch oft persönlich-vindiktive Nebenbedeutung von „Rache“. „Erfüllt wird“ ist für πλησθῆναι im Bezug auf das Geschriebene die etablierte und semantisch passende Wiedergabe. „Was geschrieben steht“ wahrt die offene, substantivische Bedeutung von τὰ γεγραμμένα.
  issues:
