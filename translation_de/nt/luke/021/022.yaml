    issue: „an denen … erfüllt werden soll“ für τοῦ πλησθῆναι
    rationale: „An denen“ verschiebt die Beziehung zu einer bloßen zeitlichen Einordnung; „soll“ fügt einen nicht expliziten Gedanken der Verpflichtung bzw. Bestimmung hinzu. Die griechische Konstruktion bezeichnet hier vielmehr den auf Erfüllung bezogenen Zweck bzw. das Ergebnis.
