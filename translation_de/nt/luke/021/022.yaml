  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: de
  text: Denn dies sind Tage der Vergeltung, damit alles erfüllt wird, was geschrieben steht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass alles erfüllt wird, was geschrieben steht“. Die Konstruktion mit τοῦ und dem Infinitiv kann Zweck oder Ergebnis ausdrücken.'
    reason: Die griechische Infinitivkonstruktion kann final oder resultativ verstanden werden; die Anmerkung bewahrt diese Auslegungsweite, ohne eine zusätzliche Modalität einzutragen.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt die erklärend-kausale Funktion natürlich im Deutschen.
- source_word: ἡμέραι ἐκδικήσεως
  choice: Tage der Vergeltung
  rationale: Bewahrt die gerichtliche und strafende Bedeutung von ἐκδίκησις, ohne den im heutigen Deutsch leicht nach persönlicher Rachsucht klingenden Ausdruck „Rache“ in den Vordergrund zu stellen.
- source_word: αὗταί εἰσιν
  choice: dies sind
  rationale: Gibt die demonstrative Hervorhebung direkt und in natürlicher deutscher Wortstellung wieder.
- source_word: τοῦ πλησθῆναι
  choice: an denen … erfüllt werden soll
  rationale: Gibt die Ziel- beziehungsweise Ergebnisnuance des artikulierten Infinitivs verständlich wieder, ohne sie eindeutig auf nur eine dieser Kategorien festzulegen.
- source_word: πάντα τὰ γεγραμμένα
  choice: alles, was geschrieben steht
  rationale: Gibt das substantivierte perfekte Passivpartizip idiomatisch wieder, bewahrt seinen fortdauernden Geltungsaspekt und legt den Bezug nicht ausdrücklich auf einen enger bestimmten Schriftkorpus fest.
theological_decisions:
- issue: Charakter der ἐκδίκησις
  choice: Vergeltung
  alternative: Rache; Strafgericht; Rechtsschaffung
  rationale: „Vergeltung“ erhält den Gedanken richterlicher Ahndung und die Schärfe des Satzes, vermeidet aber, Gott ausdrücklich menschliche Rachsucht zuzuschreiben. „Strafgericht“ wäre stärker auslegend, „Rechtsschaffung“ zu schwach.
- issue: Funktion von τοῦ mit dem Infinitiv
  choice: an denen … erfüllt werden soll
  alternative: damit … erfüllt wird; sodass … erfüllt wird
  rationale: Die griechische Konstruktion kann Ziel und Ergebnis miteinander verbinden. Die gewählte Formulierung wahrt diese Spannung und vermeidet eine eindeutige Festlegung auf reine Absicht oder reine Folge.
- issue: Bezug von τὰ γεγραμμένα
  choice: alles, was geschrieben steht
  alternative: alles, was in der Schrift geschrieben steht
  rationale: Der Wortlaut deutet auf schriftlich Festgehaltenes, im Kontext insbesondere prophetische Schriftworte, nennt jedoch nicht ausdrücklich „die Schrift“. Deshalb bleibt der Haupttext formal offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vergeltung“ trägt den gerichtlichen Ernst des Ausgangstextes, ohne unnötig archaisch zu wirken. Die Formulierung „was geschrieben steht“ wahrt den biblischen Ton und die Offenheit des griechischen Ausdrucks.
