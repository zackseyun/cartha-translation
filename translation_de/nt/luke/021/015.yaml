id: LUK.21.15
reference: Luke 21:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: de
  text: Denn ich werde euch Worte und Weisheit geben, der alle eure Gegner weder widerstehen noch widersprechen können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: Worte
  rationale: Wörtlich »Mund«; im Deutschen bezeichnet »Worte geben« hier natürlich und verständlich die von Jesus verliehene Fähigkeit zu reden, ohne das Bild unnötig fremd wirken zu lassen.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Entspricht dem üblichen Bedeutungsgehalt und bewahrt, dass Jesus nicht nur Ausdrucksfähigkeit, sondern auch Einsicht für die Antwort verheißt.
- source_word: ἀντιστῆναι ἢ ἀντειπεῖν
  choice: weder widerstehen noch widersprechen
  rationale: 'Gibt die zwei unterschiedlichen Verben knapp wieder: erfolgreicher Widerstand gegen die vorgebrachte Rede und verbaler Widerspruch.'
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: eure Gegner
  rationale: Eine natürliche deutsche Wiedergabe für diejenigen, die den Jüngern feindlich gegenüberstehen.
theological_decisions:
- issue: Bezug des Relativpronomens ᾗ
  choice: Pluralischer Bezug auf »Worte und Weisheit« durch »denen«
  alternative: 'Singularischer Bezug allein auf »Weisheit«: »der ... nicht widerstehen ... können«'
  rationale: Das griechische feminine Singularpronomen stimmt formal mit »Weisheit« überein, kann aber sinngemäß die zugesagte Rede samt Weisheit aufnehmen. Die deutsche Formulierung bezieht beides ein und bewahrt den Gesamtgedanken des Verses.
- issue: Umfang der Verheißung
  choice: »können« als Unvermögen der Gegner, der gegebenen Rede erfolgreich standzuhalten oder sie zu widerlegen
  alternative: Als Zusage verstehen, dass Gegner überhaupt keinen Widerspruch äußern werden
  rationale: οὐ δυνήσονται bezeichnet fehlende Fähigkeit beziehungsweise fehlenden Erfolg, nicht notwendig das Ausbleiben jedes tatsächlich geäußerten Widerspruchs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und hält die Betonung auf Jesu persönlicher Zusage (»ich werde euch ... geben«).
