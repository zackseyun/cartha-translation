  source_fidelity: Der Entwurf gibt Subjekt, Ziel, Zweck und den umfassenden Kollektivsinn zutreffend wieder. Allerdings ist ἐν τῷ ἱερῷ eine Ortsangabe („im Tempel[gelände]“), nicht die mit dem Kommen verbundene Zielrichtung. „in den Tempel“ verschiebt daher die syntaktische Zuordnung und kann den Tempel als Bewegungsziel statt Jesus erscheinen lassen.
  naturalness: „Das ganze Volk“ und „früh am Morgen“ sind modernes, idiomatisches Standarddeutsch. Mit „im Tempel zu ihm“ wird auch die Ortsangabe natürlich und eindeutig angeschlossen.
  terminology: „Tempel“ ist als Grundtext angemessen; die Fußnote erläutert sachgerecht, dass ἱερόν das Tempelgelände einschließlich der Vorhöfe bezeichnet. „Volk“ und „ihn hören“ sind passend und theologisch neutral.
