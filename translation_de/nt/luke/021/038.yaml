- from: Und das ganze Volk kam früh am Morgen zu ihm in den Tempel, um ihn zu hören.[a]
  to: Und das ganze Volk kam früh am Morgen im Tempel zu ihm, um ihn zu hören.[a]
  rationale: Die Präposition wird von „in den Tempel“ zu „im Tempel“ korrigiert, damit die deutsche Fassung die griechische Ortsangabe ἐν τῷ ἱερῷ bewahrt. Im Übrigen bleibt die knappe, moderne und dem Quelltext entsprechende Formulierung erhalten.
