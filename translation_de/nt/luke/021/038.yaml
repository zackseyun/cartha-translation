  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: de
  text: Und das ganze Volk kam früh am Morgen im Tempel zu ihm, um ihn zu hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet hier das gesamte Tempelgelände mit seinen Vorhöfen, nicht nur das innere Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: das ganze Volk
  rationale: Die Wendung bezeichnet kollektiv die breite Bevölkerung. „Das ganze Volk“ bewahrt den umfassenden Sinn, ohne zwingend jeden Einzelnen ausnahmslos zu meinen.
- source_word: ὤρθριζεν
  choice: kam früh am Morgen
  rationale: Das Imperfekt beschreibt im Zusammenhang eine wiederholte bzw. gewohnheitsmäßige Handlung; ὀρθρίζω bezeichnet frühes Aufstehen oder Kommen am frühen Morgen. Im Deutschen ergibt sich der iterative Sinn aus dem Kontext des zusammenfassenden Abschnitts.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf eine Person zu. Das Pronomen hält den Rückbezug auf Jesus natürlich und knapp.
- source_word: ἐν τῷ ἱερῷ
  choice: in den Tempel
  rationale: In Verbindung mit dem Bewegungsverb wird im Deutschen idiomatisch „in den Tempel“ gesagt. ἱερόν meint dabei das gesamte Tempelgelände einschließlich der Vorhöfe, nicht nur das innere Heiligtum.
- source_word: ἀκούειν αὐτοῦ
  choice: um ihn zu hören
  rationale: Der Infinitiv bezeichnet den Zweck des frühen Kommens. „Ihn zu hören“ gibt die Genitivkonstruktion bei ἀκούω knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem biblischem Ton. Die zusammenfassende Erzählweise lässt den wiederholten Charakter des griechischen Imperfekts erkennen; eine schwerfällige Umschreibung mit „pflegte“ wurde vermieden.
