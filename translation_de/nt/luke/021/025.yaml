id: LUK.21.25
reference: Luke 21:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: de
  text: Und es werden Zeichen an Sonne, Mond und Sternen zu sehen sein[a], und auf der Erde werden die Völker in Bedrängnis sein und nicht mehr weiterwissen angesichts des Tosens des Meeres und der Brandung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeichen in Sonne, Mond und Sternen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „angesichts des Schalls des Meeres und der Brandung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ ist die breite, übliche Wiedergabe und legt nicht fest, ob die Erscheinungen wörtlich, symbolisch oder in beiderlei Sinn zu verstehen sind.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: an Sonne, Mond und Sternen
  rationale: Das deutsche „an“ bezeichnet natürlich den Bereich, an dem die Zeichen erscheinen; die artikellose Reihung wahrt den gehobenen apokalyptischen Ton.
- source_word: συνοχὴ ἐθνῶν
  choice: die Völker in Bedrängnis
  rationale: συνοχή bezeichnet bedrängende Not oder Beklemmung; ἔθνη meint hier allgemein die Völker. Die verbale deutsche Fassung ist natürlicher als „Bedrängnis der Völker“.
- source_word: ἐν ἀπορίᾳ
  choice: und nicht mehr weiterwissen
  rationale: ἀπορία bezeichnet Ratlosigkeit beziehungsweise das Fehlen eines Auswegs. Die idiomatische Wendung gibt diese hilflose Ratlosigkeit verständlich wieder.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: angesichts des Tosens des Meeres und der Brandung
  rationale: ἦχος ist Schall oder Geräusch und kann hier als „Tosen“ wiedergegeben werden; σάλος bezeichnet die bewegte, aufgewühlte See. „Brandung“ vermittelt das Bild knapp und natürlich, ohne ausdrücklich „Wellen“ in den Haupttext einzutragen.
theological_decisions:
- issue: Art der kosmischen Zeichen
  choice: Die Aussage bleibt als apokalyptische Ankündigung stehen, ohne die Zeichen als ausschließlich wörtliche astronomische Ereignisse oder ausschließlich symbolische Bilder zu bestimmen.
  alternative: Ausdrückliche Festlegung auf buchstäbliche kosmische Störungen oder auf symbolisch-politische Bildsprache.
  rationale: Der griechische Text selbst entscheidet diese Deutungsfrage nicht; die Übersetzung bewahrt daher die Spannung.
- issue: Beziehung der Ratlosigkeit zum Meereslärm
  choice: „angesichts“ lässt sowohl Anlass als auch unmittelbare Konfrontation anklingen.
  alternative: „wegen“ würde die Konstruktion eindeutig kausal festlegen; „bei“ wäre formaler, aber weniger klar.
  rationale: Die Genitivverbindung nach ἀπορίᾳ ist gedrängt und lässt sich als Ratlosigkeit angesichts beziehungsweise wegen des tosenden Meeres verstehen. Die gewählte Fassung vermeidet unnötige Überbestimmung.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem apokalyptischem Ton. Die Satzbewegung bleibt nahe am Griechischen, wird jedoch durch eine natürliche verbale Fassung („werden … in Bedrängnis sein“) geglättet. „Tosens“ ist im Veröffentlichungstext normal zu setzen; die Großschreibung ist nicht beabsichtigt.
