source:
  edition: SBLGNT
  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: de
  text: Wenn sie schon austreiben, erkennt ihr selbst daran, dass der Sommer schon nahe ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet einen zeitlich bedingten Nebensatz ein; „wenn“ gibt den Zusammenhang natürlich wieder, ohne eine regelmäßige Wiederholung überzubetonen.
- source_word: προβάλωσιν
  choice: austreiben
  rationale: Im botanischen Zusammenhang bezeichnet das Verb das Hervorbringen neuen Wachstums. „Austreiben“ ist idiomatisch und vermeidet es, die im Griechischen nicht ausdrücklich genannten Blätter einzufügen.
- source_word: ἤδη
  choice: schon
  rationale: „Schon“ bewahrt an beiden Stellen die zeitliche Nuance und klingt im modernen Deutsch natürlich.
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: erkennt ihr von selbst
  rationale: Die Beobachtung ist im Deutschen natürlich in die Wendung „von selbst erkennen“ einbezogen; sie besagt, dass die Angesprochenen aufgrund eigener Wahrnehmung zu dieser Erkenntnis gelangen.
- source_word: γινώσκετε
  choice: erkennt ihr
  rationale: „Erkennen“ hebt passend hervor, dass das Wissen aus dem beobachteten Zeichen gewonnen wird.
- source_word: ἐγγὺς
  choice: nahe
  rationale: Gibt die zeitliche Nähe schlicht und unmittelbar wieder.
- source_word: θέρος
  choice: Sommer
  rationale: Die übliche und eindeutige Bezeichnung der Jahreszeit.
theological_decisions: []
