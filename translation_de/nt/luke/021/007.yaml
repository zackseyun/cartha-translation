- from: 'Da fragten sie ihn: „Lehrer, wann wird das also sein, und was wird das Zeichen dafür sein, dass dies geschehen soll?“[a]'
  to: 'Da fragten sie ihn: „Lehrer, wann wird das also sein, und was wird das Zeichen sein, wenn dies im Begriff ist zu geschehen?“[a]'
  rationale: Die Revision stellt die mit ὅταν eingeleitete Zeitfrage ausdrücklich wieder her und gibt μέλλῃ γίνεσθαι mit „im Begriff ist zu geschehen“ als anstehendes Geschehen wieder. Die Fußnote hält die weniger ausgeprägte, allgemein zukunftsbezogene Lesemöglichkeit offen. Dadurch wird weder eine bestimmte zeitliche Reichweite noch ein eschatologisches Deutungsmodell vorgegeben.
