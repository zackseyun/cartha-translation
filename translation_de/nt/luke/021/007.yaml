review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Grundstruktur und den Sinn der Frage überwiegend treffend wieder. Die Wiedergabe „dass dies geschehen soll“ verschiebt jedoch die temporale Frage mit ὅταν („wenn“) zu einer Inhaltsergänzung („dass“) und kann im Deutschen eine Sollens- bzw. Absichtsnuance nahelegen. Für μέλλῃ ist eine Formulierung mit „im Begriff“ eine sichere, nicht doktrinär festlegende Entsprechung der anstehenden Ereignisse.
  naturalness: „Da fragten sie ihn“ und die Anrede „Lehrer“ sind natürliches modernes Standarddeutsch. „wenn dies im Begriff ist zu geschehen“ ist etwas formeller, aber idiomatisch und im Kontext einer sorgfältigen Bibelübersetzung klar. Die direkte temporale Anbindung an „Zeichen“ verbessert den Satzfluss und die Präzision.
  terminology: „Lehrer“ für Διδάσκαλε und „Zeichen“ für σημεῖον sind angemessen. Die zusammenfassenden Singularformen „das/dies“ sind im Deutschen für ταῦτα möglich und bewahren die Offenheit des griechischen Ausdrucks.
  issues:
  - severity: medium
    issue: Die temporale Konstruktion ὅταν wird im Haupttext nicht direkt wiedergegeben.
    rationale: „was wird das Zeichen dafür sein, dass …“ macht aus „was wird das Zeichen sein, wenn …“ eine andere syntaktische Beziehung. Das Zeichen wird im Griechischen nach dem Zeitpunkt bzw. dem bevorstehenden Eintreten der Ereignisse erfragt.
  - severity: medium
    issue: „geschehen soll“ ist für μέλλῃ missverständlich.
    rationale: „soll“ kann im heutigen Deutsch eine Verpflichtung, Absicht oder Planung ausdrücken. μέλλω bezeichnet hier das bevorstehende bzw. erwartete Geschehen, nicht ein Sollen.
  - severity: low
    issue: Die Fußnote überzeichnet die Imminenz mit „unmittelbar“ und ist gegenüber dem Haupttext nicht optimal abgestimmt.
    rationale: μέλλω kann anstehendes Geschehen markieren, verlangt aber nicht zwingend „unmittelbar“. Die Fußnote sollte die allgemeinere Zukunftswiedergabe als Alternative nennen, ohne die Nuance zu verschärfen.
