  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: de
  text: 'Da fragten sie ihn: „Lehrer, wann wird das also sein, und was wird das Zeichen sein, wenn dies im Begriff ist zu geschehen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn dies geschehen wird“. Das griechische Verb kann ein bevorstehendes Geschehen ausdrücken, aber auch allgemeiner zukünftiges Geschehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Da fragten sie ihn
  rationale: Der Aorist berichtet eine einmalige Handlung in der Vergangenheit. „fragten“ ist die natürliche deutsche Entsprechung; „Da“ nimmt δέ als milden erzählerischen Anschluss auf.
- source_word: λέγοντες
  choice: —
  rationale: Das einleitende Partizip wird im Deutschen idiomatisch durch den Doppelpunkt vor der direkten Rede wiedergegeben; ein zusätzliches „und sagten“ wäre unnötig schwerfällig.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: „Lehrer“ gibt die Grundbedeutung von διδάσκαλος klar wieder, ohne die stärkere Autoritätsnuance von „Meister“ einzutragen.
- source_word: πότε οὖν
  choice: wann wird das also sein
  rationale: „wann“ bewahrt die Zeitfrage, „also“ den folgernden Charakter von οὖν. Das singularische „das“ entspricht natürlichem Deutsch für das zusammenfassende neutrale ταῦτα.
- source_word: ταῦτα ἔσται
  choice: wird das sein
  rationale: Die Formulierung bleibt nahe am griechischen εἰμί, klingt aber im Deutschen mit dem zusammenfassenden Singular natürlicher als „werden diese Dinge sein“.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ ist die klare und übliche Entsprechung für ein wahrnehmbares Indiz von besonderer Bedeutung.
- source_word: ὅταν μέλλῃ ταῦτα γίνεσθαι
  choice: dafür sein, dass dies geschehen soll
  rationale: Die Konstruktion gibt den Bezug des Zeichens auf das bevorstehende Eintreten der Ereignisse idiomatisch wieder. „soll“ kann hier eine erwartete beziehungsweise bevorstehende Entwicklung bezeichnen, ohne den Zeitpunkt festzulegen.
theological_decisions:
- issue: Eschatologische Zeitnuance von μέλλῃ
  choice: „dass dies geschehen soll“ mit Fußnote zur möglichen stärkeren Imminenz
  alternative: „wenn dies unmittelbar bevorsteht“ oder allgemeiner „wenn dies geschehen wird“
  rationale: μέλλω kann je nach Zusammenhang bevorstehendes oder erwartetes Geschehen ausdrücken. Der Haupttext vermeidet eine Festlegung auf unmittelbare zeitliche Nähe; die Fußnote hält die stärkere Imminenznuance ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert; das griechische Partizip λέγοντες wird durch deutsche Zeichensetzung statt durch eine schwerfällige Doppelung wiedergegeben.
