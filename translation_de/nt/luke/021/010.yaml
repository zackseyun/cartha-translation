  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: de
  text: 'Dann sagte er zu ihnen: »Ein Volk wird sich gegen ein anderes Volk erheben und ein Königreich gegen ein anderes Königreich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Bewahrt die zeitliche und erzählerische Verknüpfung mit dem vorhergehenden Zusammenhang in natürlichem Deutsch.
- source_word: ἔλεγεν
  choice: sagte er
  rationale: Das Imperfekt leitet hier direkte Rede ein; das deutsche Präteritum ist idiomatisch, ohne einen fortdauernden oder wiederholten Vorgang überzubetonen.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Gibt den Dativ als indirektes Objekt natürlich wieder.
- source_word: Ἐγερθήσεται
  choice: wird sich erheben
  rationale: Die mediale/passive Zukunftsform bezeichnet in dieser Konfliktformel das Auftreten zum Kampf; die reflexive Wendung ist im Deutschen natürlich und lässt keinen ausdrücklich genannten äußeren Verursacher einfließen.
- source_word: ἔθνος
  choice: Volk
  rationale: Bezeichnet hier ein Volk als kollektive, geopolitische Größe. »Volk« gibt die ethnisch-kollektive Bedeutung wieder und passt zur Parallelität mit »Königreich«.
- source_word: ἐπ’ ἔθνος
  choice: gegen das andere
  rationale: ἐπί mit Akkusativ drückt in der Formel feindliche Gegenüberstellung aus. Die deutsche elliptische Wendung vermeidet die unnatürliche Wiederholung »Volk gegen Volk«, ohne den Sinn zu verändern.
- source_word: βασιλεία
  choice: Königreich
  rationale: Bezeichnet hier ein konkretes politisches Herrschaftsgebiet, nicht abstrakte Königsherrschaft.
- source_word: ἐπὶ βασιλείαν
  choice: gegen das andere
  rationale: Wie im ersten Satzglied ist die Beziehung feindlich; die parallele deutsche Formulierung bewahrt die rhetorische Struktur.
theological_decisions:
- issue: Apokalyptische Konfliktformel
  choice: Als schlichte Ankündigung von Konflikten zwischen Völkern und Königreichen wiedergeben
  alternative: Die Aussage ausschließlich auf den Fall Jerusalems beziehen oder als detaillierten endzeitlichen Zeitplan formulieren
  rationale: Der Vers selbst nennt politische und gesellschaftliche Konflikte, legt aber deren genaue eschatologische Einordnung nicht fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die symmetrische Formulierung erhält den feierlichen Charakter der prophetischen Aussage.
