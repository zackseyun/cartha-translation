source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: de
  text: 'Amen, ich sage euch: Diese Generation[a] wird ganz gewiss nicht vergehen, bis alles geschehen ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dieses Volk“ beziehungsweise „dieses Zeitalter“; das griechische Wort kann unterschiedlich verstanden werden, doch „Generation“ ist die unmittelbarste Wiedergabe.
    reason: alternative_reading
  - marker: b
    text: Auch „eintritt“ oder „sich ereignet“. Manche Übersetzungen geben „dies alles“ wieder; im Griechischen steht hier jedoch nur „alles“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige „Amen“ bewahrt die feierliche, autoritative Bekräftigung und entspricht der markanten Redeeinleitung Jesu.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung gibt die griechische Formel eng und zugleich natürlich wieder.
- source_word: οὐ μὴ παρέλθῃ
  choice: wird ganz gewiss nicht vergehen
  rationale: „Ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή klar zum Ausdruck; „vergehen“ entspricht παρέρχομαι in diesem Zusammenhang.
- source_word: ἡ γενεὰ αὕτη
  choice: diese Generation
  rationale: „Generation“ ist die unmittelbarste Wiedergabe von γενεά und lässt die umstrittene zeitliche beziehungsweise kollektive Referenz offen.
- source_word: ἕως ἂν
  choice: bis
  rationale: „Bis“ ist die natürliche deutsche Zeitkonjunktion für die hier bezeichnete Grenze.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bedeutet wörtlich „alles“ beziehungsweise „alle Dinge“; der Ausgangstext enthält kein ausdrückliches „dies“.
- source_word: γένηται
  choice: geschieht
  rationale: „Geschieht“ gibt das Eintreten der Ereignisse natürlich wieder, ohne die stärkere Deutung „erfüllt wird“ einzutragen.
theological_decisions:
- issue: Bedeutung von „diese Generation“ in der endzeitlichen Aussage
  choice: Die Wendung wird lexikalisch als „diese Generation“ wiedergegeben, ohne ihren Bezug im Haupttext festzulegen.
  alternative: „dieses Volk“, „dieses Zeitalter“ oder deutend „die Generation, die dies erlebt“
  rationale: Der Wortlaut ist knapp, sein genauer Bezug jedoch umstritten. Die Übersetzung bewahrt diese Spannung und entscheidet nicht zwischen Jesu Zeitgenossen, einer späteren Generation oder einem Kollektiv.
- issue: Bezugsumfang von πάντα
  choice: „alles“ ohne ergänzendes Demonstrativpronomen
  alternative: „dies alles“
  rationale: Der Zusammenhang kann auf die zuvor genannten Ereignisse weisen, doch im griechischen Vers steht lediglich πάντα. Daher wird „dies“ nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Amen, ich sage euch“ erhält die feierliche und für Jesu Rede charakteristische Formel; „ganz gewiss nicht“ vermittelt die starke griechische Verneinung verständlich.
