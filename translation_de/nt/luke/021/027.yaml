id: LUK.21.27
reference: Luke 21:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: de
  text: Und dann werden sie den Menschensohn in einer Wolke kommen sehen, mit Macht und großer Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einer Wolke“. Im Griechischen steht im Singular „in einer Wolke“; zugleich erinnert das Bild an Daniel 7 und verwandte Stellen, in denen der Menschensohn mit den Wolken kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: werden sie … sehen
  rationale: Das Futur von ὁράω bezeichnet hier zukünftige visuelle Wahrnehmung. „Werden sie … sehen“ ist natürliches modernes Deutsch und gibt den schlichten Sinn ohne zusätzliche Erhöhung wieder.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe des Titels und bewahrt seine Verbindung zu Daniel 7 sowie seinen christologischen Gebrauch.
- source_word: ἐρχόμενον
  choice: kommen
  rationale: Der präsentische Partizipialausdruck bezeichnet die Handlung, in der der Menschensohn gesehen wird. Die Infinitivkonstruktion „kommen sehen“ ist im Deutschen idiomatisch und bewahrt den Vorgangscharakter.
- source_word: ἐν νεφέλῃ
  choice: in einer Wolke
  rationale: Der griechische Ausdruck steht im Singular und verwendet ἐν mit dem Dativ. „In einer Wolke“ folgt dieser Form genau, ohne an andere Parallelstellen anzugleichen.
- source_word: μετὰ δυνάμεως
  choice: mit Macht
  rationale: μετά mit dem Genitiv bezeichnet Begleitung; „mit Macht“ ist hier eine klare, würdige und im biblisch-apokalyptischen Kontext natürliche Wiedergabe.
- source_word: δόξης πολλῆς
  choice: großer Herrlichkeit
  rationale: πολλῆς verstärkt δόξης. „Große Herrlichkeit“ ist im Deutschen idiomatisch und erhält den gehobenen Ton.
theological_decisions:
- issue: Wiedergabe des christologischen Titels τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  alternative: den Menschlichen / den Sohn des Menschen
  rationale: Die etablierte Titelform bewahrt die literarische und theologische Resonanz mit Daniel 7, ohne den Ausdruck erklärend aufzulösen.
- issue: Wolkenbild und Danielische beziehungsweise theophanische Resonanz
  choice: in einer Wolke
  alternative: auf einer Wolke / mit den Wolken
  rationale: Die Übersetzung folgt Lukas’ Singular νεφέλῃ und der Präposition ἐν, statt den Wortlaut an Daniel 7 oder Parallelstellen anzugleichen. Die mögliche räumliche Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „den Menschensohn … kommen sehen“ ist natürlich und hält Wahrnehmung und Kommen eng zusammen. „Herrlichkeit“ wahrt den theologischen und apokalyptischen Bedeutungsumfang von δόξα.
