  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Satzes sachgerecht wieder: καὶ τότε als „Und dann“, ὄψονται als „werden sie … sehen“, den Titel τὸν υἱὸν τοῦ ἀνθρώπου als „den Menschensohn“, das partizipiale ἐρχόμενον idiomatisch als „kommen sehen“, ἐν νεφέλῃ im Singular als „in einer Wolke“ sowie μετὰ δυνάμεως καὶ δόξης πολλῆς als „mit Macht und großer Herrlichkeit“.'
  naturalness: „Und dann werden sie den Menschensohn in einer Wolke kommen sehen“ ist natürliches, modernes Standarddeutsch und zugleich dem würdevoll-apokalyptischen Register angemessen. Die Infinitivkonstruktion bildet die griechische Verbindung von Sehen und Kommen klar ab.
  terminology: „Menschensohn“ ist die im Deutschen etablierte titelartige Wiedergabe und erhält die intertextuelle Resonanz. „Macht“ und „Herrlichkeit“ sind für δύναμις und δόξα präzise und registergerecht. Die Fußnote wahrt die Singularform des Griechischen und kennzeichnet „auf“ zutreffend als mögliche alternative räumliche Wiedergabe.
