  text: καὶ θρὶξ ἐκ τῆς κεφαλῆς ὑμῶν οὐ μὴ ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/018.yaml
  text: And not a hair from your head will perish[a].
translation:
  language: de
  text: Und kein Haar von euren Köpfen wird verloren gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet eine besonders nachdrückliche Verneinung: „Kein Haar von euren Köpfen wird keinesfalls verloren gehen.“'
    reason: Macht die Emphase von οὐ μή sichtbar, ohne sie im Haupttext künstlich oder ausdeutend wiederzugeben.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche verbindende Konjunktion erhält den Zusammenhang mit dem vorhergehenden Vers, ohne einen im Griechischen nicht ausdrücklich markierten Gegensatz einzuführen.
- source_word: θρὶξ
  choice: kein Haar
  rationale: Der Singular wird im Deutschen idiomatisch mit der Negation als „kein Haar“ wiedergegeben und bewahrt den sprichwörtlichen Sinn umfassender Bewahrung.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: von eurem Kopf
  rationale: „Von“ gibt die partitive Wendung natürlich wieder. Der kollektive Singular „eurem Kopf“ ist im Deutschen bei der Anrede mehrerer Personen möglich und entspricht der Form des griechischen Ausdrucks.
- source_word: οὐ μὴ
  choice: wird … nicht / kein … wird
  rationale: Die emphatische Verneinung mit Aorist Konjunktiv wird in natürlichem Deutsch als bestimmte Zukunftsaussage formuliert; eine Fußnote weist auf ihre besondere Stärke hin.
- source_word: ἀπόληται
  choice: verloren gehen
  rationale: ἀπόλλυμι kann „zugrunde gehen“ oder „verloren gehen“ bedeuten. Bei einem Haar ist „verloren gehen“ natürlich und lässt die Aussage in ihrer sprichwörtlichen sowie kontextuell spannungsvollen Form stehen.
theological_decisions:
- issue: Spannung zu der unmittelbar zuvor angekündigten Verfolgung und Tötung einiger Jünger
  choice: Die Aussage bleibt als emphatische, sprichwörtliche Zusicherung stehen, ohne ihre Art der Bewahrung im Haupttext zu erklären.
  alternative: Die Aussage ausdrücklich als Zusage rein geistlicher oder endgültiger Bewahrung auslegen beziehungsweise als Verneinung jeder körperlichen Schädigung formulieren.
  rationale: Der Kontext nennt sowohl den Tod einiger Jünger als auch diese umfassende Zusicherung. Die Übersetzung soll diese Spannung bewahren und keine bestimmte theologische Auflösung in den Vers eintragen.
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. „Verloren gehen“ ist im Bild eines Haares natürlicher als „zugrunde gehen“; die Fußnote bewahrt zugleich die emphatische Form des griechischen Satzes.
