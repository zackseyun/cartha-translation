lexical_decisions:
- source_word: θέτε οὖν ἐν ταῖς καρδίαις ὑμῶν
  choice: Nehmt euch also fest vor
  rationale: Die wörtliche Wendung »setzt also in eure Herzen« bezeichnet einen inneren, entschiedenen Vorsatz. Die gewählte Formulierung gibt das Idiom in natürlichem modernem Deutsch wieder, während »also« die Folgerung aus dem vorhergehenden Zusammenhang markiert.
- source_word: μὴ προμελετᾶν
  choice: euch nicht im Voraus zurechtzulegen
  rationale: Das Verb bezeichnet das vorherige Durchdenken oder Einüben. »Sich im Voraus zurechtlegen« ist im Zusammenhang einer bevorstehenden Verteidigungsrede idiomatisch und schließt sowohl Vorbereitung als auch gedankliches Einstudieren ein.
- source_word: ἀπολογηθῆναι
  choice: wie ihr euch verteidigen sollt
  rationale: Das Verb bezeichnet hier eine Verteidigung oder verantwortende Rede, besonders vor einer gerichtlichen oder amtlichen Instanz. Der abhängige Fragesatz ergibt zusammen mit προμελετᾶν natürliches Deutsch.
