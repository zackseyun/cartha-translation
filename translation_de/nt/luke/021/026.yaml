  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: de
  text: Die Menschen werden vor Angst und in Erwartung dessen, was über die bewohnte Welt[a] kommt, in Ohnmacht fallen; denn die Mächte der Himmel[b] werden erschüttert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Welt“ oder „die Erde“; wörtlich: „die bewohnte Welt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die himmlischen Mächte“ oder „die Mächte des Himmels“. Die Wendung kann allgemein kosmische oder himmlische Mächte bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: in Ohnmacht fallen
  rationale: Das Partizip beschreibt, wie Menschen unter der Wirkung des Schreckens ihre Kraft oder ihr Bewusstsein verlieren. „In Ohnmacht fallen“ gibt die körperlich-seelische Wirkung im heutigen Deutsch natürlich wieder, ohne die Wendung auf bloße Mutlosigkeit oder auf Sterben festzulegen.
- source_word: ἀνθρώπων
  choice: die Menschen
  rationale: Der maskuline Plural bezeichnet hier Menschen allgemein und nicht ausschließlich Männer.
- source_word: ἀπὸ φόβου
  choice: vor Angst
  rationale: ἀπό mit Genitiv bezeichnet hier Ursache oder Ausgangspunkt. Die idiomatische deutsche Wendung „vor Angst“ drückt diesen Zusammenhang knapp aus.
- source_word: προσδοκίας
  choice: in Erwartung
  rationale: Das Substantiv bezeichnet Erwartung beziehungsweise gespanntes Warten. Der bedrohliche Charakter ergibt sich aus dem Kontext; daher wird er nicht zusätzlich durch „bange Vorahnung“ festgeschrieben.
- source_word: τῶν ἐπερχομένων
  choice: dessen, was … kommt
  rationale: Das substantivierte Partizip bezeichnet die herannahenden Ereignisse. Die deutsche Formulierung ist natürlich und bewahrt den offenen Umfang des Gemeinten.
- source_word: τῇ οἰκουμένῃ
  choice: über die bewohnte Welt
  rationale: οἰκουμένη bezeichnet die von Menschen bewohnte Welt beziehungsweise den Bereich menschlicher Gesellschaft und ist nicht zwingend nur die physische Erde.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: die Mächte der Himmel
  rationale: Die nahe am Griechischen bleibende Formulierung bewahrt die mögliche Bezugnahme auf kosmische Strukturen, Himmelskörper oder überirdische Mächte, ohne sich auf eine Deutung festzulegen.
- source_word: σαλευθήσονται
  choice: werden erschüttert werden
  rationale: Das Futur Passiv bezeichnet ein Erschüttert- oder Ins-Wanken-Gebrachtwerden und erhält die kosmisch-apokalyptische Bildsprache.
theological_decisions:
- issue: Bedeutung der „Mächte der Himmel“ im apokalyptischen Zusammenhang
  choice: Die mehrdeutige kosmische Wendung „die Mächte der Himmel“ wird beibehalten.
  alternative: „die Himmelskörper“ oder „die himmlischen Mächte“
  rationale: Die griechische Wendung kann kosmische Ordnungen, Gestirne oder himmlische Mächte anklingen lassen. Eine engere Wiedergabe würde die theologische und bildhafte Offenheit des Textes unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang nah, wird aber idiomatisch gestaltet. Die doppelte Form „werden … werden“ ist grammatisch korrekt, klingt jedoch schwer; sie wurde hier zugunsten der eindeutigen Wiedergabe des Futur Passiv beibehalten.
