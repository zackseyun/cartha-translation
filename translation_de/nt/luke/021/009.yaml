id: LUK.21.9
reference: Luke 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: de
  text: Wenn ihr aber von Kriegen und Unruhen[a] hört, lasst euch nicht in Schrecken versetzen. Denn dies muss zuerst geschehen; aber das Ende kommt nicht sofort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aufständen“, „Wirren“ oder „Unordnungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aber nicht sofort das Ende“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ ἀκούσητε
  choice: Wenn ihr aber ... hört
  rationale: ὅταν mit dem Aorist Konjunktiv bezeichnet einen unbestimmten zukünftigen Zeitpunkt; δέ wird als milder weiterführender Gegensatz mit „aber“ wiedergegeben. Bei Berichten über Ereignisse ist „von ... hören“ im Deutschen idiomatisch.
- source_word: πολέμους
  choice: Kriegen
  rationale: Direkte und natürliche Wiedergabe des Plurals von πόλεμος.
- source_word: ἀκαταστασίας
  choice: Unruhen
  rationale: ἀκαταστασία bezeichnet Unordnung, Aufruhr oder instabile Zustände. „Unruhen“ ist im modernen Deutschen breit genug und legt sich nicht unnötig auf konkrete Aufstände fest.
- source_word: μὴ πτοηθῆτε
  choice: lasst euch nicht in Schrecken versetzen
  rationale: Die Form bezeichnet ein Erschreckt- oder Verängstigtwerden. Diese Wiedergabe bewahrt die passive Färbung und die stärkere emotionale Kraft des Verbs.
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: Denn dies muss zuerst geschehen
  rationale: δεῖ drückt Notwendigkeit aus, γάρ begründet die vorangehende Aufforderung, und πρῶτον markiert die zeitliche Reihenfolge.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: aber das Ende kommt nicht sofort
  rationale: Der griechische Ausdruck ist verblos. Im Deutschen ergänzt „kommt“ natürlich den zeitlichen Sinn, ohne festzulegen, worin „das Ende“ im Einzelnen besteht.
theological_decisions:
- issue: Zeitliche Aussage über das Ende
  choice: Die Kriege und Unruhen müssen zuerst geschehen, doch das Ende folgt nicht sofort.
  alternative: Diese Ereignisse gehören zur Zeit vor dem Ende, sind aber nicht selbst das Ende.
  rationale: Der Text warnt davor, aus Berichten über politische und gesellschaftliche Erschütterungen auf das unmittelbare Eintreten des Endes zu schließen. Eine bestimmte endzeitliche Systematik wird nicht eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lasst euch nicht in Schrecken versetzen“ bewahrt gegenüber dem schlichteren „Erschreckt nicht“ die passive Färbung und starke Aussage des griechischen Verbs. Die ergänzte Verbform „kommt“ macht den verblosen Schlusssatz auf Deutsch verständlich; die Fußnote dokumentiert die knappe griechische Form.
