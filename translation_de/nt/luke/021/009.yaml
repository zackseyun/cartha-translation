  source_fidelity: 'Die Übersetzung gibt alle zentralen Elemente des griechischen Textes zutreffend wieder: den unbestimmten Zukunftsfall („Wenn“), die Berichte über Kriege und ἀκαταστασίαι („von Kriegen und Unruhen hört“), das Verbot des Erschreckens, die durch δεῖ ausgedrückte Notwendigkeit und die zeitliche Einschränkung hinsichtlich des Endes. „Das Ende kommt nicht sofort“ ist eine natürliche deutsche Entfaltung des im Griechischen verblosen Schlusssatzes und legt keine bestimmte eschatologische Deutung fest.'
  naturalness: Modernes Standarddeutsch, klar und würdig. „Lasst euch nicht in Schrecken versetzen“ ist etwas stärker und formeller als „Erschreckt nicht“, aber idiomatisch und dem Nachdruck von πτοηθῆτε angemessen. Die Satzverknüpfungen mit „Denn“ und „aber“ bilden γάρ und ἀλλά nachvollziehbar ab.
  terminology: „Kriege“, „Unruhen“ und „das Ende“ sind treffende, etablierte Begriffe. „Unruhen“ bewahrt die Breite von ἀκαταστασίαι besser als eine einengende Wiedergabe wie „Aufstände“. Die Fußnote zu [a] dokumentiert angemessene lexikalische Möglichkeiten; [b] markiert sinnvoll die knappe griechische Form.
