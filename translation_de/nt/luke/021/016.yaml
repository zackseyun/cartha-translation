id: LUK.21.16
reference: Luke 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: de
  text: Doch sogar Eltern, Brüder, Verwandte und Freunde werden euch ausliefern[a], und sie werden einige von euch töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht „Brüder“; der griechische maskuline Plural kann hier auch Geschwister, also Brüder und Schwestern, einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: werden euch ausliefern
  rationale: Das Futur Passiv von παραδίδωμι bezeichnet hier das Übergeben an feindliche Personen oder Instanzen. Die aktive deutsche Form mit den ausdrücklich genannten Handelnden ist natürlich und bewahrt diesen Grundsinn; die Vorstellung des Verrats ergibt sich aus dem familiären und freundschaftlichen Umfeld.
- source_word: δὲ
  choice: Doch
  rationale: δέ führt den Gedanken mit einem leichten Gegensatz zur vorausgehenden Zusage fort. „Doch“ gibt diese Wendung würdig und ohne übermäßige Zuspitzung wieder.
- source_word: καὶ
  choice: sogar
  rationale: 'Das erste καί nach δέ hat hier steigernde Kraft: Nicht nur Außenstehende, sondern selbst engste Bezugspersonen werden die Jünger ausliefern.'
- source_word: γονέων
  choice: Eltern
  rationale: γονεῖς bezeichnet Vater und Mutter gemeinsam; „Eltern“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: ἀδελφῶν
  choice: Brüder
  rationale: Der maskuline Plural wird im Haupttext formal als „Brüder“ wiedergegeben. Dass er in einer Verwandtschaftsaufzählung auch Geschwister beiderlei Geschlechts umfassen kann, wird in der Fußnote kenntlich gemacht.
- source_word: συγγενῶν
  choice: Verwandte
  rationale: συγγενεῖς bezeichnet Angehörige derselben Familie oder Sippe. „Verwandte“ ist modern, verständlich und hinreichend weit.
- source_word: φίλων
  choice: Freunde
  rationale: Direkte und natürliche Wiedergabe des pluralischen φίλοι.
- source_word: θανατώσουσιν
  choice: sie werden ... töten
  rationale: θανατόω bedeutet, den Tod eines Menschen herbeizuführen. „Töten“ ist im modernen Deutsch klar und bewahrt die Aussage, ohne eine bestimmte Hinrichtungsart vorauszusetzen.
- source_word: ἐξ ὑμῶν
  choice: einige von euch
  rationale: Die partitive Wendung ἐξ ὑμῶν bezeichnet einen Teil der angesprochenen Gruppe; „einige von euch“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Umfang von ἀδελφῶν in der Verwandtschaftsaufzählung
  choice: Brüder im Haupttext, mit Fußnote zur möglichen umfassenderen Bedeutung
  alternative: Geschwister oder Brüder und Schwestern
  rationale: Die grammatisch maskuline Form bleibt im Haupttext sichtbar, während die echte lexikalische Möglichkeit einer gemischtgeschlechtlichen Geschwistergruppe nicht verschwiegen, sondern in der Fußnote bewahrt wird.
- issue: Bedeutungsnuance von παραδίδωμι bei nahestehenden Handelnden
  choice: ausliefern
  alternative: verraten
  rationale: Das Verb bezeichnet grundsätzlich das Übergeben oder Ausliefern. Der Verratscharakter ist im Kontext deutlich, weil Eltern, Brüder, Verwandte und Freunde handeln, sollte aber nicht als ausschließliche lexikalische Bedeutung in das Verb hineingelesen werden.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die aktive Satzgestaltung vermeidet eine schwerfällige Passivkonstruktion und entspricht der im Griechischen ausdrücklich genannten Urheberschaft. „Sogar“ trägt die Steigerung, und „ausliefern“ bewahrt den gerichtlichen beziehungsweise feindlichen Übergabekontext.
