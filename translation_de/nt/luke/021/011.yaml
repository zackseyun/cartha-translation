id: LUK.21.11
reference: Luke 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: de
  text: Es wird schwere Erdbeben geben und hier und da Hungersnöte und Seuchen. Auch Schreckensereignisse und große Zeichen vom Himmel[a] wird es geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl den Himmel als auch den sichtbaren Himmelsraum bezeichnen; gemeint sein können daher auch sichtbare Himmelserscheinungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί ... μεγάλοι
  choice: schwere Erdbeben
  rationale: „Erdbeben“ gibt σεισμοί unmittelbar wieder; μεγάλοι bezeichnet hier natürlich die Stärke beziehungsweise das Ausmaß. „Schwere“ klingt im modernen Deutschen idiomatischer als „große“.
- source_word: κατὰ τόπους
  choice: hier und da
  rationale: Die Wendung bezeichnet eine räumliche Verteilung an verschiedenen Orten. „Hier und da“ ist knapp, geläufig und lässt den Umfang offen.
- source_word: λιμοὶ
  choice: Hungersnöte
  rationale: Das Wort bezeichnet Hungersnöte, nicht lediglich geringfügige Lebensmittelknappheit.
- source_word: λοιμοὶ
  choice: Seuchen
  rationale: λοιμός bezeichnet eine Seuche oder epidemische Krankheit. „Seuchen“ ist die direkte, verständliche moderne Wiedergabe.
- source_word: φόβητρα
  choice: Schreckensereignisse
  rationale: Das seltene Substantiv bezeichnet Dinge oder Geschehnisse, die Schrecken hervorrufen. „Schreckensereignisse“ macht diesen gegenständlichen Sinn deutlicher als das abstraktere „Schrecken“.
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ bewahrt die breite neutestamentliche Bedeutung und legt nicht stärker als der griechische Text die Deutung als Vorzeichen fest.
- source_word: ἀπ’ οὐρανοῦ
  choice: vom Himmel
  rationale: οὐρανός kann sowohl den Himmel im theologischen Sinn als auch den sichtbaren Himmel bezeichnen. Die deutsche Formulierung „vom Himmel“ bewahrt diese mögliche Doppelbedeutung.
- source_word: ἔσονται / ἔσται
  choice: es wird ... geben / wird es geben
  rationale: Die Existenzkonstruktion gibt die Futurformen in dieser Aufzählung natürlich und präzise wieder.
theological_decisions:
- issue: Bedeutung von οὐρανός im apokalyptischen Zusammenhang
  choice: vom Himmel
  alternative: vom Himmelsraum / am Himmel
  rationale: „Vom Himmel“ erhält sowohl eine mögliche theologische Herkunftsbedeutung als auch den Bezug auf sichtbare Himmelserscheinungen, ohne eine davon festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Zukunftskonstruktion bildet die zwei griechischen Satzteile ab; „Auch“ gibt die kumulative Verknüpfung durch τε ... καί natürlich wieder.
