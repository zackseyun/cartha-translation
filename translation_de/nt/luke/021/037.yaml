id: LUK.21.37
reference: Luke 21:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: de
  text: Tagsüber lehrte er im Tempelbezirk[a], nachts aber ging er hinaus und übernachtete[b] auf dem Berg, der Ölberg genannt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der gesamte Tempelkomplex mit seinen Höfen, nicht nur das innere Heiligtum.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bedeutet „die Nacht verbringen“ und kann auch ein Übernachten im Freien bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: lehrte er
  rationale: Die periphrastische Imperfektkonstruktion bezeichnet eine fortdauernde beziehungsweise gewohnheitsmäßige Tätigkeit; zusammen mit „tagsüber“ gibt das deutsche Imperfekt den wiederholten Ablauf natürlich wieder.
- source_word: τὰς ἡμέρας
  choice: tagsüber
  rationale: Der Akkusativ der Zeiterstreckung steht im wiederholten Gegensatz zu „nachts“; „tagsüber“ ist im modernen Deutsch präzise und idiomatisch.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbezirk
  rationale: ἱερόν bezeichnet hier den gesamten Tempelkomplex beziehungsweise seine Höfe, nicht speziell das innere Heiligtum. „Tempelbezirk“ macht diesen Unterschied im Haupttext verständlich.
- source_word: τὰς δὲ νύκτας
  choice: nachts aber
  rationale: Die Formulierung wahrt den Tag-Nacht-Gegensatz und gibt δέ als kontrastives „aber“ wieder.
- source_word: ἐξερχόμενος
  choice: ging er hinaus
  rationale: Das Partizip beschreibt die wiederholte, mit dem Übernachten verbundene Bewegung aus der Stadt beziehungsweise dem Tempelbereich hinaus.
- source_word: ηὐλίζετο
  choice: übernachtete
  rationale: αὐλίζομαι bedeutet, die Nacht an einem Ort zu verbringen; „übernachtete“ ist natürlich und lässt offen, ob dies in einem Gebäude oder im Freien geschah.
- source_word: εἰς τὸ ὄρος
  choice: auf dem Berg
  rationale: εἰς kennzeichnet das Ziel der Bewegung, während das deutsche Verb „übernachten“ die daraus resultierende Ortsangabe mit „auf“ verlangt.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: der Ölberg genannt wird
  rationale: Die Wendung wird als erklärender Ortsname wiedergegeben. „Ölberg“ ist die eingebürgerte deutsche Bezeichnung und entspricht dem Genitiv „der Olivenbäume“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur „tagsüber … nachts aber“ stellt den regelmäßigen Tagesablauf klar heraus; die Übersetzung vermeidet zugleich die unnötige Festlegung, Jesus habe im Freien geschlafen.
