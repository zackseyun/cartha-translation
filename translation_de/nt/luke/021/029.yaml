  text: Καὶ εἶπεν παραβολὴν αὐτοῖς· Ἴδετε τὴν συκῆν καὶ πάντα τὰ δένδρα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: de
  text: 'Und er erzählte ihnen ein Gleichnis: »Seht euch den Feigenbaum und alle Bäume an.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Betrachtet den Feigenbaum und alle Bäume.«'
    reason: Lexikalische Alternative für Ἴδετε.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Die Konjunktion führt die Erzählung schlicht weiter, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: er erzählte ihnen ein Gleichnis
  rationale: Wörtlich steht »er sagte ihnen ein Gleichnis«; im heutigen Deutschen ist »ein Gleichnis erzählen« die natürliche, inhaltlich genaue Verbindung.
- source_word: παραβολὴν
  choice: Gleichnis
  rationale: »Gleichnis« ist die etablierte und kontextgerechte Bezeichnung für παραβολή in den synoptischen Evangelien.
- source_word: Ἴδετε
  choice: Seht euch … an
  rationale: Der Imperativ fordert zu gezielter Aufmerksamkeit auf. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den visuellen Bezug.
- source_word: τὴν συκῆν
  choice: den Feigenbaum
  rationale: Das Substantiv bezeichnet hier den Baum, nicht lediglich die Frucht.
- source_word: πάντα τὰ δένδρα
  choice: all die Bäume
  rationale: Die Formulierung gibt die Gesamtheit der Bäume idiomatisch wieder, ohne das im Griechischen nicht ausdrücklich vorhandene »anderen« einzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seht euch … an« spricht gewöhnliche Leser unmittelbar an; die Fußnote dokumentiert die etwas formalere Alternative. Das eröffnende Anführungszeichen bleibt absichtlich ohne Schließzeichen, da die direkte Rede im folgenden Vers weitergeht.
