  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: narrative Fortführung (Καὶ), das Erzählen eines Gleichnisses, die Anrede an die Zuhörer sowie die Aufforderung, den Feigenbaum und sämtliche Bäume anzusehen. „all die Bäume“ kann im Deutschen jedoch eine zusätzliche deiktische bzw. hervorhebende Nuance („all jene“) nahelegen, die im Griechischen nicht markiert ist. „alle Bäume“ ist genauer und ebenso natürlich.'
  naturalness: '„Und er erzählte ihnen ein Gleichnis: »Seht euch den Feigenbaum und alle Bäume an.“ ist modernes, flüssiges Standarddeutsch. Das offene Anführungszeichen ist wegen der im Folgevers fortgesetzten direkten Rede sachgerecht.'
