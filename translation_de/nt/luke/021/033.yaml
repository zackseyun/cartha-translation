id: LUK.21.33
reference: Luke 21:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: de
  text: Himmel und Erde werden vergehen, aber meine Worte werden ganz gewiss nicht vergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Himmel und Erde
  rationale: Die feste Wortverbindung bezeichnet hier die geschaffene Welt in ihrer Gesamtheit; „Himmel“ ist im eschatologischen Zusammenhang angemessener als das engere „Himmelsgewölbe“ oder „der Himmel“ im Sinn des sichtbaren Luftraums.
- source_word: παρελεύσονται
  choice: werden vergehen
  rationale: παρέρχομαι bedeutet hier „vergehen“ bzw. „zu Ende gehen“. Die gleiche Wiedergabe in beiden Satzhälften bewahrt die pointierte Wiederholung und den Kontrast.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet den deutlichen Gegensatz zwischen der Vergänglichkeit von Himmel und Erde und der bleibenden Gültigkeit der Worte Jesu.
- source_word: οἱ λόγοι μου
  choice: meine Worte
  rationale: λόγοι meint hier Jesu Äußerungen bzw. Worte. Die direkte Wiedergabe ist natürlich, würdevoll und lässt offen, ob einzelne Aussagen oder seine Verkündigung insgesamt im Blick sind.
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: οὐ μή mit dem Futur ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ macht diese Verstärkung in modernem Deutsch ausdrücklich hörbar.
theological_decisions:
- issue: Stärke der Aussage über die Unvergänglichkeit der Worte Jesu
  choice: „ganz gewiss nicht vergehen“
  alternative: „niemals vergehen“
  rationale: Die emphatische griechische Verneinung οὐ μή wird deutlich bewahrt, ohne die Aussage abzuschwächen. „Ganz gewiss nicht“ erhält zudem die Wiederholung desselben Verbs in beiden Satzhälften und fügt keine weitergehende dogmatische Deutung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlicher Knappheit. Die syntaktische Parallelität und die Wiederholung von „vergehen“ wurden bewusst erhalten.
