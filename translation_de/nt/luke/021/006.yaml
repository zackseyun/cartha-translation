  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: de
  text: Was ihr betrachtet:[a] Es werden Tage kommen, an denen kein Stein auf dem anderen bleiben wird, der nicht niedergerissen wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ihr seht“. Das Verb kann allgemein „sehen“ oder genauer „betrachten, beobachten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kein Stein auf einem Stein wird zurückgelassen werden, der nicht niedergerissen werden wird.“ Die Wendung bezeichnet vollständige Zerstörung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Was das betrifft, was ihr hier betrachtet
  rationale: Die Voranstellung von Ταῦτα hat thematische und hervorhebende Funktion. „betrachtet“ gibt θεωρεῖτε als bewusstes Anschauen wieder; „hier“ macht den situativen Bezug im Deutschen natürlich, ohne einen neuen Gegenstand einzuführen.
- source_word: ἐλεύσονται ἡμέραι
  choice: Es werden Tage kommen
  rationale: Die deutsche Wendung bildet das griechische Zukunftsidiom klar und würdig ab, ohne durch einen bestimmten Artikel eine nicht ausdrücklich markierte Bestimmtheit einzutragen.
- source_word: ἐν αἷς
  choice: an denen
  rationale: Die zeitliche Relativkonstruktion wird im Deutschen idiomatisch mit „an denen“ wiedergegeben.
- source_word: οὐκ ἀφεθήσεται
  choice: wird ... bleiben
  rationale: Im Zusammenhang des Abbruchs bedeutet das Passiv von ἀφίημι, dass nichts in seiner bisherigen Lage zurück- beziehungsweise stehen bleibt.
- source_word: λίθος ἐπὶ λίθῳ
  choice: kein Stein auf dem anderen
  rationale: Dies ist die geläufige deutsche Form der bildhaften Aussage und vermittelt die vollständige Zerstörung natürlich.
- source_word: ὃς οὐ καταλυθήσεται
  choice: alles wird niedergerissen werden
  rationale: Die explizierende Fortführung bewahrt die umfassende Aussage des griechischen Relativsatzes. „niedergerissen“ passt zu Bauwerken und gibt καταλύω anschaulich wieder.
theological_decisions:
- issue: Reichweite und Aussagekraft der Ankündigung über die Tempelbauten
  choice: Die Aussage wird als konkrete Ankündigung vollständiger baulicher Zerstörung wiedergegeben, ohne ein bestimmtes endzeitliches Deutungssystem einzutragen.
  alternative: Die Worte könnten vorwiegend symbolisch oder innerhalb eines bestimmten späteren theologischen Schemas gedeutet werden.
  rationale: Der griechische Wortlaut spricht unmittelbar von betrachteten Bauwerken und davon, dass Stein auf Stein niedergerissen wird. Über Zeitpunkt und weitergehende dogmatische Einordnung entscheidet dieser Vers für sich allein nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die direkte Anrede steht im Plural („ihr“). Der Semikolon-Satz macht die totale Zerstörung idiomatisch deutlich; die Fußnote dokumentiert die engere griechische Form.
