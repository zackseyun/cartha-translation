  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: de
  text: Das wird für euch zu einem Zeugnis werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das wird euch Gelegenheit geben, Zeugnis abzulegen.“'
    reason: 'Lexikalische und syntaktische Alternative: εἰς μαρτύριον kann das Ergebnis oder die Gelegenheit zum Zeugnisgeben bezeichnen.'
lexical_decisions:
- source_word: ἀποβήσεται
  choice: wird … werden
  rationale: Das Futur von ἀποβαίνω bezeichnet hier das Ergebnis der zuvor angekündigten Ereignisse; die deutsche Wendung mit „werden“ gibt diesen Ausgang natürlich wieder.
- source_word: ὑμῖν
  choice: für euch
  rationale: Der Dativ bezeichnet, was sich für die Jünger als Ergebnis ergeben wird.
- source_word: εἰς
  choice: zu einem
  rationale: εἰς markiert hier Ergebnis oder Zweck; „zu einem Zeugnis werden“ bildet diese Offenheit idiomatisch ab.
- source_word: μαρτύριον
  choice: Zeugnis
  rationale: „Zeugnis“ bewahrt sowohl den öffentlichen beziehungsweise gerichtlichen Klang als auch die Möglichkeit des Zeugnisgebens, ohne den Sinn auf eine bestimmte Wirkung festzulegen.
theological_decisions:
- issue: Bedeutung des Leidens der Jünger vor den Machthabern
  choice: Die angekündigten Ereignisse werden für die Jünger zu einem Zeugnis beziehungsweise zu einer Gelegenheit zum Zeugnisgeben.
  alternative: Die Ereignisse werden als Beweismittel gegen ihre Gegner dienen.
  rationale: Im Zusammenhang mit Festnahme und Verhör liegt das Zeugnis der Jünger über Jesus nahe. Der Haupttext lässt jedoch offen, ob μαρτύριον stärker das abgelegte Zeugnis, die Gelegenheit dazu oder dessen Beweisfunktion bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform des griechischen Textes bleibt erhalten; „Zeugnis“ wahrt die rechtliche und öffentliche Konnotation.
