  to: Doch bleibt allezeit wach und betet, dass ihr die Kraft habt, all diesen Dingen zu entkommen, die geschehen werden,[a] und vor dem Menschensohn zu stehen.[b]
  rationale: Die Revision ergänzt „diesen“ als Wiedergabe von ταῦτα und stimmt die Variantenfußnote darauf ab. Die zweite Fußnote wird sprachlich geglättet und markiert die möglichen Deutungen weiterhin ausdrücklich als unausgesprochene Implikation, nicht als Bestandteil des griechischen Wortlauts.
