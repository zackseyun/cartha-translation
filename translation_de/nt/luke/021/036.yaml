reference: Luke 21:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: de
  text: Doch bleibt allezeit wach und betet, dass ihr die Kraft habt, all diesen Dingen zu entkommen, die geschehen werden,[a] und vor dem Menschensohn zu stehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „dass ihr für würdig erachtet werdet, all diesen Dingen zu entkommen, die geschehen werden“.'
    reason: textual_variant
  - marker: b
    text: Das Stehen vor dem Menschensohn kann andeuten, dass man vor ihm angenommen oder gerechtfertigt dasteht; im Griechischen bleibt dies unausgesprochen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: bleibt … wach
  rationale: Bewahrt das Bild des Wachseins und gibt den fortdauernden Aufruf in natürlichem modernem Deutsch wieder.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den leichten Gegensatz beziehungsweise Übergang von den vorausgehenden Warnungen zur gebotenen Wachsamkeit.
- source_word: ἐν παντὶ καιρῷ
  choice: allezeit
  rationale: Gibt die umfassende zeitliche Bedeutung knapp, würdevoll und idiomatisch wieder.
- source_word: δεόμενοι
  choice: betet
  rationale: Das Partizip bezeichnet hier bittendes Gebet; die koordinierte Wiedergabe ist im Deutschen natürlicher und erhält den imperativischen Zusammenhang.
- source_word: ἵνα κατισχύσητε
  choice: dass ihr die Kraft habt
  rationale: κατισχύω bezeichnet Stärke oder das Vermögen, etwas zu bewältigen. Die Formulierung entspricht dem SBLGNT und vermeidet die abweichende Lesart „für würdig erachtet werden“.
- source_word: ἐκφυγεῖν
  choice: zu entkommen
  rationale: Gibt das erfolgreiche Entrinnen aus den kommenden Ereignissen klar wieder.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: all dem …, was geschehen wird
  rationale: Natürliches Deutsch, das den Zukunftsbezug von μέλλω mit Infinitiv wahrt, ohne eine stärkere Unmittelbarkeit festzulegen, als der Ausdruck zwingend verlangt.
- source_word: σταθῆναι
  choice: zu stehen
  rationale: Erhält das griechische Bild und lässt offen, ob dabei Annahme, Bewährung oder gerichtliches Bestehen mitgemeint ist.
- source_word: ἔμπροσθεν
  choice: vor
  rationale: Schlichte und genaue Wiedergabe der räumlich-relationalen Präposition.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: dem Menschensohn
  rationale: Die im Deutschen etablierte Wiedergabe des titularen Ausdrucks bewahrt seinen biblischen und christologischen Hintergrund.
theological_decisions:
- issue: Bedeutung von κατισχύσητε im Blick auf das endzeitliche Entrinnen
  choice: „dass ihr die Kraft habt“
  alternative: „dass ihr für würdig erachtet werdet“
  rationale: Der zugrunde gelegte SBLGNT-Text liest κατισχύσητε und spricht damit von Kraft beziehungsweise Vermögen. Die Würdigkeitsformulierung beruht auf einer wichtigen Textvariante und wird deshalb in einer Fußnote dokumentiert, nicht in den Haupttext aufgenommen.
- issue: Sinn von σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: „vor dem Menschensohn zu stehen“
  alternative: „angenommen vor dem Menschensohn zu stehen“ oder „vor dem Menschensohn zu bestehen“
  rationale: Der Zusammenhang kann Annahme, Bewährung oder Rechtfertigung nahelegen, doch das Griechische spricht dies nicht ausdrücklich aus. Die bildhafte, offene Formulierung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Allezeit“ ist leicht gehoben, aber geläufig. Die Satzstruktur wurde gegenüber dem griechischen Partizip idiomatisch koordiniert; Mehrdeutigkeiten bei μέλλω und σταθῆναι bleiben erhalten.
