  naturalness: „Doch bleibt allezeit wach und betet“ ist idiomatisches modernes Standarddeutsch mit angemessen würdigem Register. Die Formulierung „dass ihr die Kraft habt“ ist verständlich und kann als gegenwärtig verfügbare, erbetene Befähigung stehen. Die Fußnotenformulierung „angenommen oder bestätigt dasteht“ klingt dagegen uneinheitlich und „bestätigt“ ist für den gemeinten möglichen Sinn nicht idiomatisch.
  terminology: „Menschensohn“ ist die etablierte und sachgerechte Wiedergabe. Die Textvariante wird korrekt als Variante zur SBLGNT-Lesart mit κατισχύσητε kenntlich gemacht. Die Erläuterung zu „stehen“ sollte weder Annahme noch Rechtfertigung als expliziten Sinn behaupten.
