id: LUK.21.1
reference: Luke 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: de
  text: Als er aufblickte, sah er Reiche, die ihre Gaben in den Opferkasten[a] einlegten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann den Schatzbereich des Tempels oder die dort aufgestellten Behälter für Opfergaben bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: Als er aufblickte
  rationale: Das aoristische Partizip bezeichnet hier das Heben des Blicks. Die temporale Wiedergabe mit „als“ verbindet die Handlung natürlich mit dem folgenden finiten Verb.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches narratives Bindewort. Der deutsche Satzanschluss ist auch ohne ein ausdrückliches „und“ oder „dann“ klar und natürlich.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Wahrnehmungsbedeutung von ὁράω wird ohne zusätzliche Deutung wiedergegeben.
- source_word: τοὺς βάλλοντας
  choice: die … einlegten
  rationale: Das substantivierte Partizip wird durch einen Relativsatz wiedergegeben. Obwohl βάλλω wörtlich „werfen“ heißen kann, bezeichnet „einlegen“ den Vorgang bei einer Opfergabe im Deutschen natürlich.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: in den Opferkasten
  rationale: γαζοφυλάκιον kann den Tempelschatzbereich oder die dortigen Sammelbehälter bezeichnen. Im unmittelbaren Vorgang des Einlegens ist „Opferkasten“ anschaulich und idiomatisch; die sachliche Bedeutungsbreite bleibt in der Fußnote erhalten.
- source_word: τὰ δῶρα αὐτῶν
  choice: ihre Gaben
  rationale: „Gaben“ bewahrt die Grundbedeutung von δῶρα und passt zugleich zum kultischen Zusammenhang, ohne schon enger „Geldopfer“ festzulegen.
- source_word: πλουσίους
  choice: Reiche
  rationale: Das substantivisch gebrauchte Adjektiv wird knapp und natürlich als „Reiche“ wiedergegeben; das nachgestellte griechische Attribut wird im deutschen Relativsatz vorangestellt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. „Gaben“ hält die kultische Bedeutung offen; „Opferkasten“ ist im Satz konkret verständlich, während die Fußnote die lexikalische Mehrdeutigkeit von γαζοφυλάκιον dokumentiert.
