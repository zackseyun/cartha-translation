id: LUK.21.12
reference: Luke 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: de
  text: Doch vor all dem werden sie Hand an euch legen[a] und euch verfolgen. Sie werden euch Synagogen und Gefängnissen übergeben, und ihr werdet vor Könige und Statthalter geführt werden – um meines Namens willen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie werden euch ergreifen“. Wörtlich steht im Griechischen: „sie werden ihre Hände an euch legen“; gemeint ist hier feindliches Ergreifen, Festnehmen oder Misshandeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wegen meines Namens“; sinngemäß: „meinetwegen“. Der Haupttext bewahrt die biblische Ausdrucksweise, die Jesu Namen mit seiner Person und Autorität verbindet.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Doch vor all dem
  rationale: πρό mit dem Genitiv bezeichnet zeitlichen Vorrang; πάντων wird in der natürlichen deutschen Wendung „vor all dem“ mit erfasst. δέ markiert hier einen Gegensatz beziehungsweise Übergang und wird mit „Doch“ wiedergegeben.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: sie werden Hand an euch legen
  rationale: 'Die deutsche Wendung bewahrt das konkrete Bild des griechischen Ausdrucks und vermittelt zugleich dessen feindlichen Sinn: gewaltsames Ergreifen, Festnehmen oder Misshandeln.'
- source_word: διώξουσιν
  choice: euch verfolgen
  rationale: Im Zusammenhang mit feindlichen Maßnahmen gegen Jesu Jünger bezeichnet διώκω Verfolgung und nicht lediglich ein Hinterherlaufen.
- source_word: παραδιδόντες εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: Sie werden euch Synagogen und Gefängnissen übergeben
  rationale: „Übergeben“ wahrt die feindliche und rechtliche Färbung von παραδίδωμι. Die institutionellen Begriffe bleiben stehen, ohne „Synagogen“ interpretierend durch deren Amtsträger oder Gerichte zu ersetzen.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: ihr werdet vor Könige und Statthalter geführt werden
  rationale: Das passive Partizip bezieht sich auf die Angesprochenen; die eigenständige deutsche Passivkonstruktion gibt dies klar wieder. „Vor“ bringt den gerichtlichen Kontext von ἐπί zum Ausdruck.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: um meines Namens willen
  rationale: Die Wendung bewahrt das biblisch gewichtige „mein Name“ und gibt ἕνεκεν in einer würdigen, verständlichen deutschen Form wieder, ohne den Ausdruck auf „meinetwegen“ zu reduzieren.
theological_decisions:
- issue: Bedeutung von „meines Namens“ im Zusammenhang der Verfolgung
  choice: Die biblische Wendung „um meines Namens willen“ bleibt erhalten.
  alternative: „wegen mir“ oder „weil ihr zu mir gehört“
  rationale: „Name“ verweist auf Jesu Person, Autorität und das Bekenntnis zu ihm. Eine interpretierende Auflösung würde den Bedeutungsreichtum der Formulierung unnötig einschränken.
- issue: Funktion der Synagogen
  choice: „Synagogen“ wird als institutioneller Ausdruck unverändert beibehalten.
  alternative: „Synagogengerichten“ oder „den Verantwortlichen der Synagogen“
  rationale: Der Kontext kann Verfahren vor örtlichen jüdischen Instanzen einschließen, doch der griechische Text nennt ausdrücklich die Synagogen. Die Übersetzung soll diese mögliche Metonymie nicht im Haupttext festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialfolge des Griechischen wird zur besseren Verständlichkeit in finite Sätze aufgelöst, während Passivstruktur, institutionelle Begriffe und die theologisch gewichtige Wendung „mein Name“ erhalten bleiben.
