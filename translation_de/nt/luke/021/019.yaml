translation:
  language: de
  text: Durch eure Standhaftigkeit gewinnt ihr euer Leben[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach anderer Lesart: „Durch eure Standhaftigkeit werdet ihr euer Leben gewinnen.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „eure Seelen“; das griechische Wort kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: durch
  rationale: Die Präposition mit Dativ bezeichnet hier das Mittel; „durch“ ist im Deutschen natürlich und gibt diesen instrumentalen Sinn klar wieder.
- source_word: ὑπομονῇ
  choice: Standhaftigkeit
  rationale: ὑπομονή bezeichnet beharrliches Ausharren unter Bedrängnis. „Standhaftigkeit“ passt zum Verfolgungskontext und ist prägnanter als „Geduld“.
- source_word: κτήσασθε
  choice: gewinnt
  rationale: Die im SBLGNT gedruckte Form ist ein Aorist-Medium-Imperativ. „Gewinnt“ bewahrt die Aufforderungsform und gibt den Sinn von Erlangen bzw. Gewinnen idiomatisch wieder.
- source_word: ψυχὰς
  choice: euer Leben
  rationale: ψυχή kann Leben, Selbst oder Seele bezeichnen. Im Kontext von Verfolgung, Tod und endgültiger Bewahrung gibt „Leben“ den ganzheitlichen Sinn wieder; der griechische Plural wird im Deutschen mit dem distributiv verständlichen Singular natürlich ausgedrückt.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang endzeitlicher Verfolgung
  choice: ganzheitlich „Leben“
  alternative: „Seelen“ oder „euch selbst“
  rationale: „Leben“ vermeidet eine vorschnelle Beschränkung auf einen immateriellen Teil des Menschen und bewahrt die Spannung zwischen leiblicher Todesgefahr und endgültiger Bewahrung.
- issue: Imperativ oder Zukunftsaussage bei κτήσασθε
  choice: 'Imperativ: „gewinnt“'
  alternative: 'Nach abweichender Lesart bzw. Deutung: „werdet ihr … gewinnen“'
  rationale: Der SBLGNT-Haupttext bietet den Imperativ κτήσασθε; deshalb bleibt die Aufforderung im Haupttext erhalten. Die verbreitete futurische Lesart wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform bewahrt den auffordernden Charakter des griechischen Haupttextes; „Standhaftigkeit“ ist im Verfolgungskontext verständlich und vermeidet das zu schwache „Geduld“.
