id: LUK.21.5
reference: Luke 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: de
  text: 'Als einige über den Tempel[a] sprachen und sagten, er sei mit schönen Steinen und Weihegaben[b] geschmückt, sagte er:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die gesamte Tempelanlage mit ihren Vorhöfen, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Gaben, die Gott geweiht waren“. Gemeint sind gestiftete Gaben, die am Tempel angebracht oder ausgestellt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: als einige … sprachen und sagten
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. Das ergänzende „sagten“ leitet den Inhalt des griechischen ὅτι klar ein und bewahrt den fortlaufenden Charakter des Sprechens.
- source_word: τοῦ ἱεροῦ
  choice: über den Tempel
  rationale: ἱερόν bezeichnet hier den Tempel einschließlich seiner Anlagen und Vorhöfe, nicht ausschließlich das innere Heiligtum. „Tempel“ ist die geläufige und gut verständliche deutsche Wiedergabe.
- source_word: λίθοις καλοῖς
  choice: mit schönen Steinen
  rationale: καλοῖς hebt die ansprechende und eindrucksvolle Beschaffenheit der Steine hervor; „schön“ gibt diese Wertung schlicht und unmittelbar wieder.
- source_word: ἀναθήμασιν
  choice: Weihegaben
  rationale: Gemeint sind Gott geweihte und am Tempel angebrachte oder ausgestellte Gaben. „Weihegaben“ ist im Deutschen präzise und knapper als eine erklärende Umschreibung.
- source_word: κεκόσμηται
  choice: sei … geschmückt
  rationale: 'Der Perfektpassiv bezeichnet einen vollendeten Vorgang mit fortbestehendem Ergebnis: Der Tempel stand geschmückt da. Der Konjunktiv I entspricht im Deutschen der indirekten Rede.'
- source_word: εἶπεν
  choice: sagte er
  rationale: Das griechische Verb enthält nur das aus dem Zusammenhang erschließbare Subjekt. Die Wiedergabe vermeidet es, den Namen Jesus ausdrücklich hinzuzufügen.
