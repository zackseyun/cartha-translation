  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes wieder: die emphatische Einleitung (Ἀληθῶς), die direkte Anrede, die demonstrativ hervorgehobene arme Witwe sowie den quantitativen Vergleich πλεῖον πάντων. „Alle anderen“ verdeutlicht den im Kontext gemeinten Kreis der übrigen Gebenden, ohne die Begründung des Folgeverses vorwegzunehmen.'
  naturalness: '„Und er sagte: ‚Wahrhaftig, ich sage euch: Diese arme Witwe hat mehr eingelegt als alle anderen.‘“ ist verständliches, würdiges modernes Standarddeutsch. „Eingelegt“ passt im Kontext einer Einlage in den Opferkasten und vermeidet die stärker interpretierende Formulierung „gespendet“.'
  terminology: „Witwe“, „arm“, „Wahrhaftig“ und „mehr eingelegt“ sind terminologisch tragfähig. Die feierliche Redeweise ist angemessen, ohne unmodern oder konfessionell geprägt zu wirken.
