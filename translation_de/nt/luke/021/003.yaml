source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: de
  text: 'Und er sagte: „Wahrhaftig, ich sage euch: Diese arme Witwe hat mehr eingelegt als alle anderen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Wahrhaftig
  rationale: Leitet eine feierliche, nachdrückliche Aussage ein. „Wahrhaftig“ bewahrt dieses Gewicht und ist im Deutschen verständlich, ohne die Wendung als bloße Bestätigung abzuschwächen.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Gibt die direkte Anrede und den autoritativen Charakter der Aussage eng und zugleich natürlich wieder.
- source_word: χήρα
  choice: Witwe
  rationale: Die übliche und genaue deutsche Bezeichnung für eine Frau, deren Ehemann gestorben ist.
- source_word: πτωχή
  choice: arme
  rationale: Bezeichnet ihre Armut, ohne deren Grad mit „mittellos“ oder „bettelarm“ über den unmittelbaren Wortlaut hinaus festzulegen.
- source_word: αὕτη
  choice: Diese
  rationale: Bewahrt die hinweisende Kraft des Demonstrativpronomens und kennzeichnet die konkret beobachtete Witwe.
- source_word: πλεῖον
  choice: mehr
  rationale: Gibt den komparativen, mengenbezogenen Sinn knapp und idiomatisch wieder.
- source_word: πάντων
  choice: als alle anderen
  rationale: Der Genitiv bezeichnet nach πλεῖον den Vergleich. „Alle anderen“ macht im Deutschen klar, dass die übrigen Einzahlenden gemeint sind, ohne die Begründung aus dem folgenden Vers vorwegzunehmen.
- source_word: ἔβαλεν
  choice: hat eingelegt
  rationale: Im Zusammenhang mit dem Tempelschatz bezeichnet das Verb das Hineingeben einer Gabe. „Eingelegt“ ist natürlich und bewahrt mehr von der konkreten Handlung als eine interpretierende Wiedergabe wie „gespendet“.
theological_decisions:
- issue: Vergleich der Gabe der Witwe
  choice: „hat mehr eingelegt als alle anderen“
  alternative: „hat mehr eingelegt als sie alle“ oder „hat mehr eingelegt als jeder von ihnen“
  rationale: Die Formulierung bewahrt Jesu uneingeschränkte vergleichende Aussage. Sie erklärt noch nicht, in welchem Sinn die Witwe mehr gegeben hat, da diese Begründung erst im folgenden Vers folgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Einleitung bleibt erhalten; die Aussage wird weder durch eine proportionale Deutung ergänzt noch durch „gespendet“ stärker interpretiert.
