  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Aussagen des griechischen Textes genau wieder: gewaltsames Fallen, Gefangenschaft und Wegführung zu/unter alle Völker, das fortdauernde Zertreten Jerusalems durch Völker sowie die zeitliche Begrenzung bis zur Erfüllung der Zeiten der Völker. Die einheitliche Wiedergabe von ἔθνη als „Völker“ wahrt die dreifache Wortverbindung und lässt die im Kontext mögliche Bedeutung „Heiden“ offen.'
  naturalness: „Durch die Schärfe des Schwertes fallen“, „als Gefangene unter alle Völker weggeführt“ und „von den Völkern zertreten“ sind verständliches, würdiges modernes Standarddeutsch. Die Formulierungen sind leicht gehoben, aber für den biblischen Register angemessen und nicht künstlich.
  terminology: „Völker“ für ἔθνη und „Zeiten der Völker“ für καιροὶ ἐθνῶν sind transparent und konsistent. Die Fußnoten vermerken die plausible kontextuelle Alternative „Heiden“, ohne diese als alleinige Deutung festzulegen. „Erfüllt sind“ bildet das Passiv von πληρωθῶσιν angemessen ab.
