id: LUK.21.24
reference: Luke 21:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: de
  text: Und sie werden durch die Schärfe des Schwertes fallen und als Gefangene unter alle Völker weggeführt werden.[a] Jerusalem wird von den Völkern zertreten werden,[b] bis die Zeiten der Völker erfüllt sind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter alle Heiden“ beziehungsweise „unter alle nichtjüdischen Völker“; das griechische Wort ἔθνη kann je nach Zusammenhang „Völker“ oder „Heiden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jerusalem wird von den Heiden zertreten werden.“'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „bis die Zeiten der Heiden erfüllt sind.“'
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: sie werden fallen
  rationale: Das Futur von πίπτω bezeichnet im Kriegskontext das Fallen beziehungsweise Sterben durch Gewalt. „Fallen“ bewahrt die Bildsprache, ohne die Aussage unnötig auszudeuten.
- source_word: στόματι μαχαίρης
  choice: durch die Schärfe des Schwertes
  rationale: Die Wendung lautet wörtlich „durch den Mund des Schwertes“. „Durch die Schärfe des Schwertes“ gibt das konkrete Bild in natürlichem Deutsch wieder.
- source_word: αἰχμαλωτισθήσονται εἰς τὰ ἔθνη πάντα
  choice: als Gefangene unter alle Völker weggeführt werden
  rationale: Das Passiv bezeichnet Gefangennahme und Wegführung. „Unter alle Völker“ gibt die durch εἰς ausgedrückte Bewegung wieder und klingt im Deutschen natürlicher als „in alle Völker“.
- source_word: πατουμένη ὑπὸ ἐθνῶν
  choice: von den Völkern zertreten werden
  rationale: Die Umschreibung aus ἔσται und dem passiven Partizip weist auf einen andauernden zukünftigen Zustand hin. „Zertreten“ bewahrt das Bild von Unterwerfung und Verwüstung.
- source_word: ἄχρι οὗ
  choice: bis
  rationale: Die knappe temporale Konjunktion ist die natürliche deutsche Entsprechung.
- source_word: πληρωθῶσιν
  choice: erfüllt sind
  rationale: Das passive Verb lässt sowohl die Vollendung als auch die Erfüllung eines festgesetzten Zeitraums anklingen, ohne den Handelnden ausdrücklich zu nennen.
- source_word: καιροὶ ἐθνῶν
  choice: die Zeiten der Völker
  rationale: καιροί bezeichnet besondere oder festgesetzte Zeiten. Die transparente Wiedergabe bewahrt zugleich die Mehrdeutigkeit des Genitivs und vermeidet ein bestimmtes endzeitliches Deutungssystem.
theological_decisions:
- issue: Wiedergabe von ἔθνη im gesamten Vers
  choice: Völker
  alternative: Heiden beziehungsweise nichtjüdische Völker
  rationale: Dasselbe griechische Wort steht dreimal im Vers. Die einheitliche Wiedergabe mit „Völker“ erhält den lexikalischen Zusammenhang und lässt offen, ob vor allem politische Nationen oder nichtjüdische Völker gemeint sind.
- issue: Bedeutung von καιροὶ ἐθνῶν
  choice: die Zeiten der Völker erfüllt sind
  alternative: die Zeiten der Heiden vollendet sind; die festgesetzten Zeiten der Völker abgelaufen sind
  rationale: Die Formulierung lässt einen begrenzten, möglicherweise von Gott bestimmten Zeitraum erkennen, legt aber kein bestimmtes endzeitliches Schema fest. „Erfüllt“ bewahrt zudem das Passiv und das theologische Gewicht des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als Gefangene … weggeführt“ macht Deportation verständlich, ohne den Sinn zu erweitern. Die dreifache Wiedergabe von ἔθνη mit „Völker“ erhält die Wortverbindung; traditionelle Alternativen mit „Heiden“ stehen in den Fußnoten.
