id: LUK.21.20
reference: Luke 21:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: de
  text: Wenn ihr aber seht, dass Jerusalem von Heeren[a] umzingelt ist, dann erkennt, dass seine Verwüstung[b] nahe gerückt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Heereslagern«. Das griechische Wort kann Feldlager beziehungsweise dort lagernde Heere bezeichnen; hier sind die Jerusalem belagernden Streitkräfte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: »Verwüstung« greift die Sprache prophetischer Gerichtsankündigungen auf; vergleiche die verwandte Ausdrucksweise in Matthäus 24,15 und Markus 13,14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Wenn … aber
  rationale: Gibt die zukünftige Bedingung und den leichten Übergang beziehungsweise Kontrast natürlich wieder.
- source_word: ἴδητε
  choice: ihr seht
  rationale: Entspricht dem Aorist Konjunktiv nach ὅταν in einem zukünftigen Bedingungssatz.
- source_word: κυκλουμένην
  choice: umzingelt ist
  rationale: Bewahrt den durativen Zustand des passiven Präsenspartizips und macht den militärischen Zusammenhang deutlich.
- source_word: ὑπὸ στρατοπέδων
  choice: von Heeren
  rationale: στρατόπεδον kann Feldlager, Heerlager oder die dort lagernden Streitkräfte bezeichnen; im Belagerungskontext bezeichnet es die Jerusalem umgebenden Heere.
- source_word: τότε γνῶτε
  choice: dann erkennt
  rationale: Der Imperativ fordert dazu auf, die Bedeutung des sichtbaren Zeichens zu erfassen; „erkennt“ ist im Deutschen hier natürlicher und präziser als „wisst“.
- source_word: ἤγγικεν
  choice: nahe gekommen ist
  rationale: Gibt das griechische Perfekt als eingetretene Annäherung mit fortbestehendem Ergebnis wieder.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: seine Verwüstung
  rationale: „Verwüstung“ bewahrt die prophetische Gerichtssprache. Das Pronomen „sein“ bezieht sich grammatisch korrekt auf das im Deutschen sächliche „Jerusalem“.
theological_decisions:
- issue: Deutung des kommenden Gerichts über Jerusalem
  choice: „Verwüstung“ ohne nähere Festlegung eines heilsgeschichtlichen oder eschatologischen Schemas
  alternative: „Zerstörung“ oder eine ausdrückliche Verbindung zum „Gräuel der Verwüstung“ im Haupttext
  rationale: Der Vers selbst kündigt Jerusalems nahende Verwüstung an. Die gewählte Formulierung erhält den prophetischen Klang, ohne eine weitergehende Auslegung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umzingelt“ vermittelt die militärische Lage idiomatisch; „Verwüstung“ erhält den biblisch-prophetischen Klang. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
