id: LUK.21.34
reference: Luke 21:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: de
  text: Gebt aber acht auf euch selbst, dass nicht eure Herzen durch Ausschweifung[a], Trunkenheit und die Sorgen des Lebens schwer werden und jener Tag plötzlich über euch hereinbricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann ausschweifendes Zechen oder dessen Folgen, etwa Übelkeit oder einen schweren Kopf, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Gebt aber auf euch selbst acht
  rationale: Die Wendung gibt den Imperativ zur persönlichen Wachsamkeit natürlich und mit seinem warnenden Nachdruck wieder.
- source_word: μήποτε
  choice: damit nicht
  rationale: Leitet die befürchteten Folgen ein und bewahrt den vorbeugenden Charakter der Warnung.
- source_word: βαρηθῶσιν … αἱ καρδίαι
  choice: eure Herzen … schwer werden
  rationale: Bewahrt das griechische Bild der schwer werdenden Herzen; »Herzen« bezeichnet hier das innere Wahrnehmungs- und Reaktionsvermögen des Menschen.
- source_word: κραιπάλῃ
  choice: Ausschweifung
  rationale: Der Ausdruck kann ausschweifendes Zechen ebenso wie dessen unangenehme Folgen bezeichnen. »Ausschweifung« lässt diese Bedeutungsbreite eher offen als eine engere Wiedergabe.
- source_word: μέθῃ
  choice: Trunkenheit
  rationale: Direkte, verständliche Wiedergabe des Substantivs für den Zustand des Betrunkenseins.
- source_word: μερίμναις βιωτικαῖς
  choice: die Sorgen des Lebens
  rationale: Bezeichnet Sorgen und Belastungen des gewöhnlichen irdischen Lebens, ohne sie durch einen Zusatz unnötig moralisch abzuwerten.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: plötzlich über euch hereinbricht
  rationale: Gibt sowohl das unvermittelte Eintreten als auch den bedrohlichen Charakter des Kommens in natürlichem Deutsch wieder.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: jener Tag
  rationale: Bewahrt die knappe eschatologische Bezeichnung des Ausgangstextes, ohne »Gericht« ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Eschatologischer Bezug von »jener Tag«
  choice: jener Tag
  alternative: jener Tag des Gerichts
  rationale: Der Zusammenhang weist auf den entscheidenden kommenden Tag, doch der Ausgangstext nennt ihn lediglich »jener Tag«. Die Übersetzung vermeidet eine erklärende dogmatische Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Mahnung bleibt direkt; das Bild der schwer werdenden Herzen und die knappe Bezeichnung »jener Tag« werden erhalten.
