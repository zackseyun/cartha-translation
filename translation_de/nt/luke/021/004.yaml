  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: de
  text: Denn alle diese haben aus ihrem Überfluss zu den Opfergaben beigetragen; sie aber hat aus ihrem Mangel alles eingelegt, was sie zum Leben hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ihren ganzen Lebensunterhalt, den sie hatte“. Gemeint ist alles, wovon sie leben konnte, nicht ihr gesamtes Leben im Sinne ihrer Existenz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Denn alle diese
  rationale: „Denn“ bewahrt den begründenden Anschluss an den vorhergehenden Vers; „alle diese“ gibt πάντες οὗτοι knapp und deutlich wieder.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: aus ihrem Überfluss
  rationale: Die Formulierung bezeichnet das, was ihnen über den eigenen Bedarf hinaus zur Verfügung stand, und bildet den sprachlichen Gegenpol zu „aus ihrem Mangel“.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: haben … etwas als Gabe eingelegt
  rationale: „Eingelegt“ bewahrt das konkrete Bild des Einwerfens bzw. Einlegens. „Als Gabe“ gibt den Tempelkontext natürlich wieder, ohne ausdrücklich einen Opferkasten oder die Schatzkammer in den Text einzutragen.
- source_word: αὕτη δὲ
  choice: sie aber
  rationale: Das Pronomen verweist natürlich auf die zuvor genannte Witwe; „aber“ erhält den deutlichen Gegensatz.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: aus ihrem Mangel
  rationale: „Mangel“ wahrt die direkte lexikalische Spannung zu „Überfluss“ und lässt offen, ob besonders Armut, Bedürftigkeit oder Entbehrung betont ist.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: alles …, was sie zum Leben hatte
  rationale: βίος meint hier den materiellen Lebensunterhalt bzw. die Mittel zum Leben, nicht ihr gesamtes Leben im existenziellen Sinn. Die deutsche Formulierung ist klar und gegenwärtig.
- source_word: ἔβαλεν
  choice: hat … eingelegt
  rationale: Das Verb hält die konkrete Handlung fest und entspricht zugleich der Wiedergabe des vorherigen ἔβαλον.
theological_decisions:
- issue: Bedeutung von βίος bei der Gabe der Witwe
  choice: als sämtliche Mittel zum Lebensunterhalt wiedergegeben
  alternative: „ihr ganzes Leben“
  rationale: Der Zusammenhang handelt von Geldgaben; βίος bezeichnet hier das, wovon sie lebte. „Ihr ganzes Leben“ könnte fälschlich als Aussage über ihre gesamte Existenz verstanden werden.
- issue: Bezug von τὰ δῶρα
  choice: „als Gabe“ im Tempelkontext
  alternative: „zu den Opfergaben“ oder „in den Opferkasten“
  rationale: Die Wiedergabe benennt die Zuwendung als Gabe, ohne einen bestimmten Behälter einzuführen, den dieser Vers selbst nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz „aus ihrem Überfluss“ / „aus ihrem Mangel“ wird bewahrt. Die Wiederholung von „eingelegt“ bildet die Wiederholung des griechischen Verbs ab und stellt die unterschiedlichen wirtschaftlichen Voraussetzungen der Gebenden heraus.
