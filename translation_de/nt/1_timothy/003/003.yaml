lexical_decisions:
- source_word: πάροινον
  choice: dem Wein ergeben
  rationale: Die Formulierung bezeichnet eine anhaltende Neigung zum Wein beziehungsweise zur Trunkenheit, ohne jeden Weingenuss pauschal zu verurteilen.
- source_word: πλήκτην
  choice: gewalttätig
  rationale: Das Wort bezeichnet wörtlich einen Schläger; „gewalttätig“ gibt die dahinterstehende aggressive Wesensart in heutigem Deutsch knapp wieder.
- source_word: ἐπιεικῆ
  choice: nachsichtig
  rationale: Der Ausdruck umfasst Milde, Entgegenkommen und vernünftige Nachsicht; „nachsichtig“ bildet den Gegensatz zur vorausgehenden Gewalttätigkeit angemessen ab.
- source_word: ἄμαχον
  choice: friedfertig
  rationale: Das Wort verneint Streit- und Kampfsucht. „Friedfertig“ formuliert diese Charaktereigenschaft natürlich und positiv.
- source_word: ἀφιλάργυρον
  choice: nicht geldliebend
  rationale: Das Kompositum verneint ausdrücklich die Liebe zum Geld. Die direkte Wiedergabe bewahrt den Akzent auf der inneren Haltung.
