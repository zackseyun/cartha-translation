  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: de
  text: Sie sollen am Geheimnis des Glaubens mit reinem Gewissen festhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollen das Geheimnis des Glaubens in einem reinen Gewissen bewahren.“'
    reason: Die Alternative bildet ἔχοντας („haben, bewahren“) und ἐν („in“) formaler ab; der Sinn kann sowohl das Festhalten als auch das Bewahren des Glaubensgeheimnisses in einem moralisch reinen Gewissen betonen.
lexical_decisions:
- source_word: ἔχοντας
  choice: festhalten
  rationale: Das präsentische Partizip bezieht sich auf die im vorherigen Vers genannten Diakone und bezeichnet ein fortdauerndes Bewahren und Bekennen. Im Deutschen gibt die finite Form „Sie sollen … festhalten“ den Zusammenhang natürlich wieder.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: „Geheimnis“ ist die etablierte Wiedergabe des paulinischen Begriffs und lässt offen, dass es sich um eine vormals verborgene, von Gott offenbarte Wahrheit handelt, ohne diese Erklärung in den Text einzutragen.
- source_word: τῆς πίστεως
  choice: des Glaubens
  rationale: Der Artikel legt hier nahe, dass „Glaube“ den Inhalt des christlichen Glaubens bezeichnet. Die deutsche Formulierung bewahrt zugleich die sprachliche Offenheit des Genitivs.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: mit reinem Gewissen
  rationale: „Mit … Gewissen“ ist im Deutschen idiomatisch für ἐν mit diesem Ausdruck; „rein“ bildet καθαρᾷ genauer ab als das ebenfalls mögliche „gut“ oder „unbelastet“.
theological_decisions:
- issue: Bedeutung von τῆς πίστεως
  choice: der christliche Glaube als geglaubter Inhalt
  alternative: persönliches Glauben beziehungsweise Vertrauen
  rationale: 'Im Kontext der Anforderungen an Diakone ist der objektive Sinn wahrscheinlich: Sie bewahren die offenbarte christliche Wahrheit. Die knappe Wendung „des Glaubens“ vermeidet jedoch eine dogmatisch engere Ausformulierung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die finite Soll-Formulierung ergänzt aufgrund des deutschen Satzbaus das im griechischen Partizip nur aus dem Kontext erkennbare Subjekt und führt die Anforderung aus Vers 8 fort.
