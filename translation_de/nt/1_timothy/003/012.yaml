id: 1TI.3.12
reference: 1 Timothy 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: de
  text: Diakone sollen Männer einer Frau sein[a] und ihren Kindern und ihrem eigenen Haushalt gut vorstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer einer Frau«. Die Wendung kann eheliche Treue betonen; manche verstehen sie genauer als Ausschluss von Polygamie oder Wiederheirat.'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: Diakone
  rationale: Im Zusammenhang der Gemeindeordnung bezeichnet das Wort ein anerkanntes Amt und nicht allgemein Dienende.
- source_word: ἔστωσαν
  choice: sollen … sein
  rationale: Der Imperativ formuliert eine verbindliche Anforderung; „sollen“ gibt dies in einer deutschen Qualifikationsliste natürlich wieder.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: Männer einer Frau
  rationale: Die knappe, formal nahe Wiedergabe erhält die männliche Form und die Mehrdeutigkeit der griechischen Wendung, ohne sie auf Treue, Monogamie oder nur eine einzige Eheschließung festzulegen.
- source_word: τέκνων
  choice: ihren Kindern
  rationale: Das Possessivpronomen ergibt sich sinngemäß aus der Konstruktion und der Parallele zum eigenen Haushalt.
- source_word: καλῶς
  choice: gut
  rationale: Die schlichte adverbiale Wiedergabe entspricht der Bedeutung und klingt natürlich.
- source_word: προϊστάμενοι
  choice: vorstehen
  rationale: Das Verb bezeichnet verantwortliche Leitung und Fürsorge; „vorstehen“ bewahrt diesen Sinn im familiären Zusammenhang.
- source_word: τῶν ἰδίων οἴκων
  choice: ihrem eigenen Haushalt
  rationale: οἶκος meint hier die soziale und familiäre Hausgemeinschaft, nicht bloß ein Gebäude.
theological_decisions:
- issue: Deutung von μιᾶς γυναικὸς ἄνδρες als Voraussetzung für das Gemeindeamt
  choice: Formal als „Männer einer Frau“ wiedergegeben, ohne die genaue Reichweite festzulegen.
  alternative: „ihren Frauen treu“, „Männer mit nur einer Frau“ oder „nur einmal verheiratete Männer“
  rationale: Die idiomatische griechische Wendung kann eheliche Treue betonen und wird außerdem im Blick auf Polygamie oder Wiederheirat unterschiedlich verstanden. Die Übersetzung bewahrt diese Spannung, statt eine konfessionelle Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Diakone“ ist als Amtsbezeichnung verständlich; „vorstehen“ ist leicht gehoben, aber im Kontext verantwortlicher Leitung präzise. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
