    issue: „geachtet“ für κόσμιον
    rationale: κόσμιος beschreibt respektables, anständiges bzw. geordnetes Verhalten/Auftreten. „Geachtet“ verschiebt den Akzent auf Anerkennung durch andere und kann einen bereits etablierten Status nahelegen.
  - severity: medium
    issue: 'Fußnote: „Wörtlich auch: ‚Ein-Mann-einer-Frau‘“'
    rationale: Diese Wortfolge ist weder verständliches Deutsch noch eine angemessene Erklärung der griechischen idiomatischen Genitivkonstruktion. Sie hilft nicht, die alternative Deutung als eheliche Treue klar zu vermitteln.
