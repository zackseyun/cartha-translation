  rationale: „Anständig“ gibt κόσμιος im Kontext eines Tugendkatalogs präziser wieder als „geachtet“. Die Fußnote ersetzt eine unidiomatische Pseudo-Wörtlichkeit durch eine klare alternative Deutung, ohne die umstrittene griechische Wendung im Haupttext einseitig festzulegen.
