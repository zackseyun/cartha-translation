id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: de
  text: Darum muss ein Aufseher untadelig sein, Mann einer einzigen Frau[a], nüchtern, besonnen, anständig, gastfreundlich und fähig zu lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mann, der einer Frau treu ist“. Die Wendung kann besonders eheliche Treue betonen und nicht nur den Familienstand bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Gibt in der Aufzählung der Voraussetzungen die Notwendigkeit und nicht nur eine Empfehlung wieder.
- source_word: οὖν
  choice: darum
  rationale: Bewahrt den folgernden Anschluss an den vorausgehenden Gedankengang in natürlichem modernem Deutsch.
- source_word: ἐπίσκοπον
  choice: Aufseher
  rationale: Übersetzt die Funktionsbezeichnung ihrem Sinn nach und vermeidet die Eintragung späterer kirchlicher Amtsterminologie.
- source_word: ἀνεπίλημπτον
  choice: untadelig
  rationale: Bezeichnet jemanden, gegen den kein berechtigter Vorwurf erhoben werden kann, ohne Sündlosigkeit zu behaupten.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: Mann einer einzigen Frau
  rationale: Gibt die männlich formulierte Wendung eng am Griechischen wieder und lässt offen, ob vor allem Einehe, eheliche Treue oder eine weitergehende Einschränkung gemeint ist.
- source_word: νηφάλιον
  choice: nüchtern
  rationale: Bewahrt sowohl den Grundsinn als auch die übertragene Bedeutung geistiger Klarheit und Zurückhaltung.
- source_word: σώφρονα
  choice: besonnen
  rationale: Drückt vernünftige Selbstbeherrschung und ausgewogenes Urteilsvermögen aus und unterscheidet sich hinreichend von νηφάλιον.
- source_word: κόσμιον
  choice: geachtet
  rationale: Gibt die soziale und ethische Anständigkeit verständlich wieder; der Ausdruck bezeichnet ein ordentliches, respektables Auftreten.
- source_word: φιλόξενον
  choice: gastfreundlich
  rationale: Ist die knappe und geläufige deutsche Bezeichnung für die Bereitschaft, Gäste und Fremde aufzunehmen.
- source_word: διδακτικόν
  choice: fähig zu lehren
  rationale: Bezeichnet verständlich die Eignung und Befähigung zum Lehren, nicht lediglich die Bereitschaft dazu.
theological_decisions:
- issue: Deutung von μιᾶς γυναικὸς ἄνδρα als Voraussetzung für das Aufseheramt
  choice: Im Haupttext formal als „Mann einer einzigen Frau“ wiedergegeben
  alternative: „ein Mann, der seiner Frau treu ist“; möglich sind auch Deutungen als Verbot von Polygamie oder als Einschränkung bei Wiederheirat
  rationale: Die griechische Wendung ist umstritten. Eine eng am Wortlaut orientierte Wiedergabe bewahrt ihre kirchliche und theologische Spannung, statt sie zugunsten nur einer Auslegung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung des griechischen Qualifikationskatalogs bleibt erhalten; die Begriffe sind allgemein verständlich und vermeiden konfessionell geprägte Amtsbezeichnungen.
