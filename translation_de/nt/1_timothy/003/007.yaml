source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: de
  text: Außerdem muss er bei den Außenstehenden einen guten Ruf haben,[a] damit er nicht in Schande gerät[b] und in die Falle des Teufels.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein gutes Zeugnis von den Außenstehenden haben“. Gemeint ist die günstige Beurteilung durch Menschen außerhalb der christlichen Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Schmähung ausgesetzt wird“. Das griechische Wort kann Schmach, Beschimpfung oder öffentliche Schande bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in die Falle des Verleumders“, wenn διάβολος hier im allgemeineren Sinn verstanden wird; im Haupttext wird es als Bezeichnung für den Teufel aufgefasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: muss
  rationale: Gibt die für den Gemeindeleiter geltende Notwendigkeit beziehungsweise Verpflichtung klar und natürlich wieder.
- source_word: δὲ καὶ
  choice: Außerdem
  rationale: Verknüpft die Aussage mit den vorherigen Anforderungen und bringt den hinzukommenden Gesichtspunkt in flüssigem modernem Deutsch zum Ausdruck.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: einen guten Ruf haben
  rationale: Im Zusammenhang bezeichnet μαρτυρία die günstige Beurteilung durch Menschen außerhalb der Gemeinde. „Einen guten Ruf haben“ ist im Deutschen idiomatischer als „ein gutes Zeugnis haben“.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: bei den Außenstehenden
  rationale: Bezeichnet Menschen außerhalb der christlichen Gemeinschaft, ohne „Gemeinde“ ausdrücklich in den Haupttext einzutragen.
- source_word: ἵνα μὴ
  choice: damit er nicht
  rationale: Bewahrt die mögliche Zweck- beziehungsweise Folgebeziehung in natürlicher deutscher Form.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: in Schande gerät
  rationale: Erfasst die öffentliche Beschämung und den Verlust des Ansehens; „gerät“ gibt die Wendung mit ἐμπίπτω idiomatisch wieder.
- source_word: παγίδα
  choice: Falle
  rationale: Bewahrt das Bild einer gefährlichen Fangvorrichtung in allgemein verständlichem modernem Deutsch.
- source_word: τοῦ διαβόλου
  choice: des Teufels
  rationale: Der artikulierte Ausdruck bezeichnet hier nach dem üblichen neutestamentlichen Sprachgebrauch am wahrscheinlichsten den Teufel als persönlichen Widersacher; die Genitivkonstruktion bleibt formal erhalten.
theological_decisions:
- issue: Bedeutung von τοῦ διαβόλου
  choice: „des Teufels“, mit Bezug auf den persönlichen bösen Widersacher
  alternative: „des Verleumders“ beziehungsweise „die Falle der Verleumdung“
  rationale: διάβολος kann lexikalisch „Verleumder“ bedeuten, wird im Neuen Testament jedoch häufig als Bezeichnung des Teufels gebraucht. Kontext und Sprachgebrauch sprechen hier eher für diesen persönlichen Referenten; die mögliche allgemeinere Bedeutung wird in einer Fußnote bewahrt.
- issue: Beziehung zwischen Schande und Falle
  choice: 'zwei koordinierte Gefahren: in Schande geraten und in die Falle des Teufels geraten'
  alternative: die Schande selbst als Falle des Teufels verstehen
  rationale: Das wiederholte gedankliche Ziel von ἐμπέσῃ lässt sich bei beiden mit καί verbundenen Gliedern ergänzen. Der Text lässt den genaueren Zusammenhang beider Gefahren offen, weshalb keine weitergehende Erklärung in die Übersetzung aufgenommen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Außenstehende“ ist als geläufige Bezeichnung für Menschen außerhalb einer Gemeinschaft verständlich. „Guter Ruf“ vermeidet das im Deutschen missverständliche „gutes Zeugnis“, während die wörtlichere Form in der Fußnote erhalten bleibt. Die Satzstruktur bleibt knapp und entspricht dem Charakter einer Anforderungsliste.
