base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: de
  text: Wenn aber jemand nicht weiß, wie er seinem eigenen Haushalt vorstehen soll,[a] wie wird er dann für Gottes Gemeinde sorgen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen eigenen Haushalt leiten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für die Kirche Gottes sorgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Wenn aber
  rationale: Bewahrt sowohl die Bedingung als auch den milden Gegensatz zum vorausgehenden Vers in natürlichem Deutsch.
- source_word: τις
  choice: jemand
  rationale: Gibt das indefinite Pronomen ohne unnötige Festlegung wieder; das anschließende maskuline Pronomen entspricht Grammatik und unmittelbarem Kontext.
- source_word: τοῦ ἰδίου οἴκου
  choice: seinem eigenen Haushalt
  rationale: „Haushalt“ bezeichnet hier nicht nur das Gebäude oder die Kernfamilie, sondern die gesamte häusliche Gemeinschaft unter seiner Verantwortung.
- source_word: προστῆναι
  choice: vorstehen
  rationale: Bezeichnet verantwortliche Leitung und Aufsicht. „Vorstehen“ ist würdig und weniger auf bloße Verwaltung oder autoritäres Herrschen verengt.
- source_word: οὐκ οἶδεν
  choice: nicht weiß, wie … soll
  rationale: Gibt die idiomatische Verbindung von οἶδα mit Infinitiv als fehlendes Wissen darüber wieder, wie die Aufgabe auszuführen ist.
- source_word: πῶς
  choice: wie wird er dann
  rationale: Erhält die rhetorische, zukunftsbezogene Folgerung; „dann“ macht den Zusammenhang im Deutschen natürlich deutlich, ohne den Sinn zu verändern.
- source_word: ἐκκλησίας θεοῦ
  choice: Gottes Gemeinde
  rationale: „Gemeinde“ ist im modernen deutschen Bibel- und Kirchensprachgebrauch eine natürliche Wiedergabe der örtlich bzw. gemeinschaftlich verstandenen ἐκκλησία; die Genitivverbindung wird possessiv wiedergegeben.
- source_word: ἐπιμελήσεται
  choice: für … sorgen
  rationale: Drückt fürsorgliche Aufmerksamkeit und verantwortliche Betreuung aus und wahrt den Unterschied zum Verb für das Vorstehen im ersten Satzteil.
theological_decisions:
- issue: Verhältnis zwischen Haushaltsleitung und Aufsicht über die Gemeinde
  choice: „seinem eigenen Haushalt vorstehen“ gegenüber „für Gottes Gemeinde sorgen“
  alternative: Beide Tätigkeiten mit „leiten“ wiedergeben oder die erste mit „regieren“ übersetzen.
  rationale: Der griechische Text verwendet zwei verschiedene Verben. Die Übersetzung erhält den Unterschied zwischen verantwortlicher Leitung im Haushalt und fürsorglicher Verantwortung in der Gemeinde, ohne ein bestimmtes Amts- oder Leitungsmodell einzutragen.
- issue: Geschlecht des indefiniten Subjekts
  choice: „jemand“ mit anschließendem „er/seinem“
  alternative: Vollständig geschlechtsneutral formulieren oder ausdrücklich „ein Mann“ schreiben.
  rationale: τις ist indefinit, während Syntax und unmittelbarer Zusammenhang maskulin sind. Die Mischform wahrt beides, ohne das indefinite Pronomen zu überbestimmen.
- issue: Wiedergabe von ἐκκλησία
  choice: „Gemeinde“ im Haupttext
  alternative: „Kirche“
  rationale: Beide Wiedergaben sind möglich. „Gemeinde“ betont hier die Gemeinschaft, für die der Aufseher Sorge trägt; die Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der Unterschied der beiden Leitungsverben bleiben erhalten. „Vorstehen“ ist leicht gehoben, im Zusammenhang einer Amtsqualifikation jedoch verständlich und sachgerecht.
