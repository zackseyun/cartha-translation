revisions:
- from: 'Zuverlässig ist dieses Wort: Wenn jemand einen Aufsichtsdienst anstrebt[a], verlangt er nach einer guten Arbeit[b].'
  to: 'Dieses Wort ist zuverlässig: Wenn jemand nach einem Aufsichtsdienst strebt[a], begehrt er eine gute Aufgabe[b].'
  rationale: Die Revision verbessert die natürliche moderne deutsche Ausdrucksweise und vermeidet bei „gute Arbeit“ die mögliche Assoziation mit einer Arbeitsstelle. Sie hält die Bedeutung von ἐπισκοπή weiterhin offen, gibt das positive Begehren von ἐπιθυμεῖ klar wieder und bewahrt beide vorhandenen Fußnotenanker mit passenden Alternativen.
