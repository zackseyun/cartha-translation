base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: de
  text: 'Dieses Wort ist zuverlässig: Wenn jemand nach einem Aufsichtsdienst strebt[a], begehrt er eine gute Aufgabe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aufseheramt“; traditionell: „Bischofsamt“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „eine ehrenvolle Aufgabe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Zuverlässig ist dieses Wort
  rationale: Die formelhafte Wendung bezeichnet eine Aussage als glaubwürdig und verlässlich. Die vorangestellte Formulierung bewahrt den feierlichen Nachdruck des Griechischen, ohne λόγος auf ein bloßes Einzelwort zu verengen.
- source_word: εἴ τις
  choice: wenn jemand
  rationale: τις ist ein unbestimmtes Pronomen und für sich genommen geschlechtsunspezifisch. „Jemand“ gibt dies wieder, ohne aus dieser Wendung allein eine geschlechtsspezifische Folgerung zu ziehen.
- source_word: ἐπισκοπῆς
  choice: einen Aufsichtsdienst
  rationale: ἐπισκοπή bezeichnet Aufsicht beziehungsweise die damit verbundene Aufgabe. „Aufsichtsdienst“ ist im Deutschen natürlicher als „Aufsicht“ allein, betont die Tätigkeit und vermeidet es, spätere kirchenrechtliche Amtsstrukturen in den Ausdruck hineinzulesen.
- source_word: ὀρέγεται
  choice: anstrebt
  rationale: ὀρέγομαι bezeichnet das Sich-Ausstrecken nach einem Ziel und idiomatisch das Streben danach. „Anstrebt“ gibt diesen zielgerichteten Sinn in heutigem Deutsch knapp wieder.
- source_word: καλοῦ ἔργου
  choice: nach einer guten Arbeit
  rationale: Die Wiedergabe bleibt nahe bei καλός und ἔργον und betont, dass es um eine gute Arbeit und nicht bloß um Rang oder Ansehen geht. „Gute Aufgabe“ ist ebenfalls möglich und wird in der Fußnote genannt.
- source_word: ἐπιθυμεῖ
  choice: verlangt er nach
  rationale: ἐπιθυμέω bezeichnet ein deutliches Begehren oder Verlangen. Die Formulierung wahrt die begriffliche Parallelität zu ὀρέγεται, ohne beide Verben gleich wiederzugeben.
theological_decisions:
- issue: Ob ἐπισκοπῆς mit einer später festgelegten kirchlichen Amtsbezeichnung wiederzugeben ist
  choice: Aufsichtsdienst
  alternative: 'Aufseheramt; traditionell: Bischofsamt'
  rationale: Der Ausdruck kann eine Aufsichtsfunktion oder den entsprechenden Dienst bezeichnen, legt aber nicht von sich aus eine spätere episkopale Kirchenordnung fest. „Aufsichtsdienst“ hält Tätigkeit und Verantwortung im Vordergrund.
- issue: Ob τις im Bedingungssatz ausdrücklich männlich wiederzugeben ist
  choice: wenn jemand
  alternative: wenn ein Mann
  rationale: Das unbestimmte Pronomen ist in diesem Satz für sich genommen generisch. Die Übersetzung soll eine geschlechtsspezifische Einschränkung weder aus dieser Formulierung ableiten noch die Fragen vorwegnehmen, die sich aus dem folgenden Kontext ergeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung der Eingangsformel bewahrt ihren feierlichen Charakter. „Aufsichtsdienst“ vermeidet sowohl sperrige Neubildungen als auch konfessionell geprägte spätere Amtsbegriffe; die Alternativen werden transparent in der Fußnote geboten.
