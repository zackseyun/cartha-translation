review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur und die zentralen Begriffe insgesamt zutreffend wieder. „Aufsichtsdienst“ hält ἐπισκοπή angemessen offen und vermeidet die unangebrachte Festlegung auf spätere Kirchenämter. Bei ἐπιθυμεῖ ist „verlangt ... nach“ jedoch im Deutschen semantisch weniger passend, da es leicht ein Einfordern statt eines begehrenden Strebens ausdrückt. Die Konstruktion „eine gute Arbeit“ kann zudem wie eine gewünschte Arbeitsstelle klingen, während ἔργον hier die Aufgabe bzw. Tätigkeit bezeichnet.
  naturalness: Die vorangestellte Eingangsformel ist verständlich, aber „Zuverlässig ist dieses Wort“ wirkt im heutigen Standarddeutsch deutlich markiert. „Dieses Wort ist zuverlässig“ ist ebenso quellennah und flüssiger. „Nach einer guten Arbeit verlangen“ ist idiomatisch und inhaltlich schwächer als eine Formulierung mit „begehren“ und „Aufgabe“.
  terminology: „Aufsichtsdienst“ ist als nichtkonfessionelle Wiedergabe von ἐπισκοπή vertretbar. Die Fußnote soll die Alternativen als Substantive ausweisen, wenn der Anker direkt bei diesem Substantiv steht. „Aufseheramt“ und das traditionelle „Bischofsamt“ bleiben als mögliche, aber enger festgelegte Lesarten transparent.
  issues:
  - severity: medium
    issue: „verlangt er nach“ für ἐπιθυμεῖ
    rationale: „Verlangen nach“ kann im Deutschen ein forderndes Beanspruchen oder den Wunsch nach einer Sache bezeichnen. In Verbindung mit „guter Arbeit“ wirkt es hier unnatürlich und verschiebt den positiven begehrenden Sinn. „Begehrt“ bewahrt den lexikalischen Sinn und die Parallele zu „strebt“ besser.
  - severity: medium
    issue: „einer guten Arbeit“ für καλοῦ ἔργου
    rationale: Die Formulierung kann modernsprachlich eine gute Anstellung meinen. „Eine gute Aufgabe“ bezeichnet hier klarer die angestrebte verantwortliche Tätigkeit, ohne daraus bloßen Rang zu machen.
  - severity: low
    issue: Stellung der Eingangsformel
    rationale: Die Inversion ist möglich, aber unnötig feierlich und weniger natürlich. Eine reguläre Wortstellung wahrt die Aussage der formelhaften Wendung.
  revised_text: 'Dieses Wort ist zuverlässig: Wenn jemand nach einem Aufsichtsdienst strebt[a], begehrt er eine gute Aufgabe[b].'
