id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: de
  text: Denn diejenigen, die gut gedient haben, erwerben sich eine gute Stellung und große Freimütigkeit[a] im Glauben an Jesus, den Messias.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „große Zuversicht“; das griechische Wort kann Freimütigkeit, Zuversicht oder Offenheit bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „in der Treue zu Jesus, dem Messias“. Das griechische πίστις kann „Glaube“, „Vertrauen“ oder „Treue“ bedeuten.
    reason: alternative_reading
  - marker: c
    text: Griechisch „Christus“; hier mit „Messias“ wiedergegeben, weil das Wort als Titel gebraucht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: gedient haben
  rationale: Das Verb bezeichnet hier das Dienen. Der Zusammenhang betrifft zwar die zuvor beschriebenen Gemeindediener, doch die Übersetzung vermeidet es, eine Amtsbezeichnung unmittelbar in das Verb hineinzulesen.
- source_word: καλῶς
  choice: gut
  rationale: Das Adverb bestimmt das Dienen näher; „gut“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: βαθμὸν ... καλὸν
  choice: eine gute Stellung
  rationale: βαθμός kann wörtlich eine Stufe und übertragen einen Rang oder eine Stellung bezeichnen. „Eine gute Stellung“ bewahrt den Statusgedanken, ohne einen bestimmten kirchlichen Rang festzulegen.
- source_word: περιποιοῦνται
  choice: erwerben sich
  rationale: Die mediale Form hat reflexive Bedeutung. „Erwerben sich“ gibt sowohl den Gewinn als auch den Bezug auf die Dienenden selbst knapp und idiomatisch wieder.
- source_word: παρρησίαν
  choice: Freimütigkeit
  rationale: Das Wort kann offene, mutige Rede ebenso wie Zuversicht bezeichnen. „Freimütigkeit“ bewahrt diese Bedeutungsbreite und die Stärke des Ausdrucks.
- source_word: πίστει
  choice: Glauben
  rationale: πίστις bezeichnet hier am natürlichsten den Glauben; die ebenfalls mögliche Bedeutung „Treue“ bleibt in einer Fußnote erhalten.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: der im Messias Jesus ist
  rationale: Die Wiedergabe lässt die attributive Beziehung der griechischen Wortgruppe zu „Glauben“ sichtbar und vermeidet, sie eindeutig als „Glaube an“ auszulegen.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός hat hier Titelfunktion; „Messias“ gibt den Sinn des Titels wieder, statt ihn lediglich als Namensbestandteil erscheinen zu lassen.
theological_decisions:
- issue: Bedeutung von πίστις in ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: Glauben
  alternative: Treue
  rationale: Der Zusammenhang lässt „Glauben“ als wahrscheinlichste Wiedergabe erscheinen, schließt die lexikalisch mögliche Nuance „Treue“ jedoch nicht völlig aus. Diese Spannung wird in der Fußnote bewahrt.
- issue: Bezug der Wendung τῇ ἐν Χριστῷ Ἰησοῦ
  choice: der im Messias Jesus ist
  alternative: Glauben an den Messias Jesus
  rationale: Die Hauptfassung erhält die griechische attributive Struktur und ihre theologische Offenheit. Die idiomatischere deutsche Deutung als auf Jesus gerichteter Glaube würde das Verhältnis stärker festlegen, als der Wortlaut es ausdrücklich tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Freimütigkeit“ ist gegenüber „Zuversicht“ etwas gehobener, bewahrt aber die Aussagekraft und Bedeutungsbreite von παρρησία. Die bewusst nahe am Griechischen gehaltene Wendung „der im Messias Jesus ist“ erhält die syntaktische und theologische Spannung des Ausgangstextes.
