revisions:
- from: Denn die, die gut gedient haben, erwerben sich eine gute Stellung und große Freimütigkeit[a] in dem Glauben[b], der im Messias Jesus ist.[c]
  to: Denn diejenigen, die gut gedient haben, erwerben sich eine gute Stellung und große Freimütigkeit[a] im Glauben an Jesus, den Messias.[b][c]
  rationale: Die Revision ersetzt allein die im Deutschen missverständliche wörtliche Nachbildung „der im Messias Jesus ist“ durch eine idiomatische, kontextgemäße Fassung. Die mögliche Nuance von πίστις als „Treue“ bleibt ausdrücklich in der Fußnote kenntlich. Die Apposition „Jesus, den Messias“ wahrt sowohl den Titelcharakter von Χριστός als auch die natürliche deutsche Wortstellung.
