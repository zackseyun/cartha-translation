id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: de
  text: Er darf kein Neubekehrter sein, damit er nicht von Hochmut aufgebläht wird und in das Gericht des Teufels[a] gerät.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »derselben Verurteilung verfällt wie der Teufel«; alternativ: »in ein mit dem Teufel verbundenes Gericht gerät«.'
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: Neubekehrter
  rationale: Das Wort bedeutet wörtlich »neu gepflanzt« und bezeichnet hier bildlich jemanden, der erst seit Kurzem zum Glauben gehört. »Neubekehrter« gibt diesen gemeindlichen Sinn knapp und verständlich wieder.
- source_word: τυφωθεὶς
  choice: von Hochmut aufgebläht wird
  rationale: Die Form bezeichnet ein Aufgeblähtwerden durch Dünkel. Die Wiedergabe bewahrt sowohl das Bild als auch den passiven Charakter und benennt zugleich die gemeinte innere Haltung.
- source_word: κρίμα
  choice: Gericht
  rationale: »Gericht« ist weiter als »Verurteilung« und lässt offen, ob der Urteilsspruch, die Verurteilung oder das Gerichtsgeschehen gemeint ist.
- source_word: τοῦ διαβόλου
  choice: des Teufels
  rationale: 'Der deutsche Genitiv bewahrt wie der griechische Ausdruck die Mehrdeutigkeit: Gemeint sein kann das Gericht, das den Teufel trifft, oder ein mit ihm verbundenes beziehungsweise von ihm bewirktes Gericht.'
- source_word: ἐμπέσῃ
  choice: in … gerät
  rationale: Die Wendung gibt das Hineingeraten in einen gefährlichen Zustand oder Ausgang natürlich wieder, ohne die Beziehung des Genitivs näher festzulegen.
- source_word: ἵνα μὴ
  choice: damit er nicht
  rationale: Diese Formulierung gibt den Zweck beziehungsweise die befürchtete Folge in klarem, modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: Mehrdeutig wiedergegeben als »in das Gericht des Teufels gerät«
  alternative: »derselben Verurteilung wie der Teufel verfällt« oder »in ein vom Teufel bewirktes Gericht gerät«
  rationale: Der Genitiv τοῦ διαβόλου lässt mehrere syntaktisch und theologisch plausible Beziehungen zu. Der Haupttext legt nicht fest, ob es um das über den Teufel ergangene Gericht oder um ein mit ihm verbundenes beziehungsweise von ihm bewirktes Gericht geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Neubekehrter« ist im christlichen Kontext geläufig; die bildhafte Formulierung »von Hochmut aufgebläht« bewahrt die Ausdruckskraft des griechischen Verbs. Der Fußnotenmarker steht bei der tatsächlich erläuterten mehrdeutigen Wendung.
