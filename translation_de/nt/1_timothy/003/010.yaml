base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: de
  text: Auch diese sollen zuerst geprüft werden; dann sollen sie dienen[a], wenn sie untadelig sind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Diakone dienen“. Das griechische Verb bedeutet „dienen“; im Zusammenhang mit den Anforderungen an Diakone kann es hier den Dienst als Diakone bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Gegen sie kann kein berechtigter Vorwurf erhoben werden; vollkommene Sündlosigkeit ist damit nicht gemeint.'
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ οὗτοι δὲ
  choice: Auch diese
  rationale: Gibt den rückverweisenden Demonstrativausdruck und den hinzufügenden Sinn von καί natürlich wieder. Das schwach fortführende δέ verlangt im Deutschen hier kein eigenes „aber“.
- source_word: δοκιμαζέσθωσαν
  choice: sollen geprüft werden
  rationale: Das Verb bezeichnet eine Prüfung, durch die Eignung oder Bewährung festgestellt wird. „Sollen“ gibt den Imperativ in diesem Anweisungskontext idiomatisch wieder.
- source_word: πρῶτον
  choice: zuerst
  rationale: 'Bewahrt die ausdrücklich angegebene zeitliche Reihenfolge: Die Prüfung geht dem Dienst voraus.'
- source_word: εἶτα
  choice: danach
  rationale: Kennzeichnet den folgenden Schritt klar und in natürlichem Deutsch.
- source_word: διακονείτωσαν
  choice: sollen sie dienen
  rationale: Übersetzt die Grundbedeutung des Verbs direkt und wahrt zugleich die durch den Zusammenhang mögliche amtsspezifische Bedeutung, ohne sie im Haupttext ausdrücklich festzulegen.
- source_word: ἀνέγκλητοι
  choice: untadelig
  rationale: Bezeichnet hier Menschen, gegen die kein berechtigter Vorwurf erhoben werden kann. Das gängige deutsche Wort passt zum Kontext einer Eignungsanforderung.
- source_word: ὄντες
  choice: sofern sie … sind
  rationale: Gibt das Partizip als begleitende Voraussetzung für den Dienst in natürlichem Deutsch wieder, ohne Sündlosigkeit zu behaupten.
theological_decisions:
- issue: Ob διακονείτωσαν allgemein oder amtsspezifisch wiederzugeben ist
  choice: dienen
  alternative: als Diakone dienen
  rationale: Das Verb selbst bedeutet „dienen“; der unmittelbare Zusammenhang legt einen diakonischen beziehungsweise amtlichen Dienst nahe. Der Haupttext bewahrt die lexikalische Offenheit, während die Fußnote die kontextuelle Zuspitzung nennt.
- issue: Ob ἀνέγκλητοι sündlose Vollkommenheit bezeichnet
  choice: untadelig
  alternative: ohne berechtigten Vorwurf
  rationale: Gemeint ist, dass kein begründeter Anklagepunkt gegen sie vorliegt, nicht dass sie ohne jede Sünde sind. Die Fußnote begrenzt ein mögliches Missverständnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und anweisend. „Auch diese“ stellt den Rückbezug her; „sofern“ macht die im Partizip liegende Voraussetzung verständlich, ohne die Aussage unnötig auszudeuten.
