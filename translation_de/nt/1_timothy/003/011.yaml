id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: de
  text: Ebenso sollen die Frauen[a] würdig sein, nicht verleumderisch, besonnen und in allem treu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ebenso sollen die Ehefrauen würdig sein …« Das griechische Wort kann hier sowohl »Frauen« als auch »Ehefrauen« bedeuten; »ihre Ehefrauen« steht nicht ausdrücklich im Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: die Frauen
  rationale: γυνή kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten. Da weder ein Artikel noch ein ausdrückliches Possessivpronomen wie »ihre« steht, vermeidet »die Frauen« einen nicht ausdrücklich genannten Bezug; die ebenso mögliche Bedeutung »Ehefrauen« wird in der Fußnote bewahrt.
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Das Wort stellt eine klare Parallele zu den vorausgehenden Anforderungen her und wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: σεμνάς
  choice: würdig
  rationale: σεμνός bezeichnet eine ehrbare, ernst zu nehmende und Achtung verdienende Haltung. »Würdig« gibt diese moralische Ernsthaftigkeit prägnant wieder.
- source_word: μὴ διαβόλους
  choice: nicht verleumderisch
  rationale: διάβολος bezeichnet hier verleumderisches oder böswillig anklagendes Verhalten, nicht den Eigennamen »Teufel«. Die adjektivische Wiedergabe entspricht der griechischen Charakterbeschreibung.
- source_word: νηφαλίους
  choice: besonnen
  rationale: νηφάλιος umfasst Nüchternheit sowie geistige und sittliche Selbstbeherrschung. »Besonnen« ist in modernem Deutsch natürlich und wahrt diese Bedeutungsbreite besser als eine rein auf Alkohol bezogene Formulierung.
- source_word: πιστὰς
  choice: treu
  rationale: πιστός kann Treue, Zuverlässigkeit und Vertrauenswürdigkeit bezeichnen. »Treu« bewahrt die Verbindung zum πιστ-Wortfeld und passt zur umfassenden Charakteranforderung.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die Formulierung gibt den umfassenden Geltungsbereich der griechischen Wendung knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezugsgruppe von γυναῖκας in der Liste der Anforderungen
  choice: die Frauen
  alternative: die Ehefrauen
  rationale: Der griechische Ausdruck kann Frauen allgemein beziehungsweise Frauen in einem Dienst oder die Ehefrauen der zuvor genannten Diakone meinen. Weil kein Possessivpronomen »ihre« vorhanden ist und ὡσαύτως eine parallele Gruppe einführen kann, bleibt der Haupttext weit gefasst. Die alternative Deutung wird in der Fußnote ausdrücklich erhalten, ohne die strittige Frage konfessionell zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bleibt knapp und entspricht dem Charakter einer Anforderungsliste. »Besonnen« vermeidet sowohl eine unnötige Verengung auf Alkoholabstinenz als auch eine überdeutende psychologische Formulierung.
