id: 1TI.3.8
reference: 1 Timothy 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: de
  text: Ebenso müssen die Diakone würdevoll sein, nicht doppelzüngig[a], nicht vielem Wein ergeben[b] und nicht auf schändlichen Gewinn aus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht dem einen dies und dem anderen das sagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht vielem Wein verfallen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht nach unehrenhaftem Gewinn streben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: die Diakone
  rationale: Im Zusammenhang folgt auf die Anforderungen an die Aufseher eine parallele Liste für einen weiteren anerkannten Gemeindedienst. „Diakone“ wahrt diese kontextuelle Amtsbezeichnung, ohne spätere konfessionelle Strukturen einzutragen.
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Kennzeichnet knapp und natürlich die Entsprechung zu den zuvor genannten Anforderungen an Aufseher.
- source_word: σεμνούς
  choice: würdevoll
  rationale: Bezeichnet eine ehrbare, Achtung verdienende Haltung, ohne bloße Ernsthaftigkeit oder Strenge zu unterstellen.
- source_word: μὴ διλόγους
  choice: nicht doppelzüngig
  rationale: Bewahrt das anschauliche griechische Bild und bezeichnet widersprüchliches oder unaufrichtiges Reden gegenüber verschiedenen Menschen.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: nicht vielem Wein ergeben
  rationale: Gibt die anhaltende Hinwendung oder Bindung in προσέχω wieder und bewahrt die Mengenangabe πολλῷ, ohne eine moderne klinische Kategorie einzuführen.
- source_word: μὴ αἰσχροκερδεῖς
  choice: nicht auf schändlichen Gewinn aus
  rationale: Drückt das eigennützige Streben nach moralisch verwerflichem Gewinn idiomatisch und verständlich aus.
theological_decisions:
- issue: Gemeindliche Amtsbezeichnung für διάκονος
  choice: „Diakone“ als Bezeichnung eines anerkannten Gemeindedienstes
  alternative: „Diener“ oder „Dienstbeauftragte“
  rationale: Die parallele Stellung zu den Aufsehern und die anschließende Anforderungsliste sprechen hier für eine erkennbare Gemeindefunktion. „Diakone“ wahrt diesen Bezug, ohne Einzelheiten späterer Amtsordnungen vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung bleibt knapp und nah an der griechischen Struktur; die idiomatische Formulierung „auf … aus sein“ macht αἰσχροκερδής natürlich verständlich.
