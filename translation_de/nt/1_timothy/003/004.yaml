lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: seinem eigenen Haushalt
  rationale: οἶκος bezeichnet hier den häuslichen Lebens- und Verantwortungsbereich, also Haushalt beziehungsweise Familie. „Haushalt“ bewahrt diesen Umfang besser als das rein räumlich wirkende „Haus“; ἰδίου wird mit „eigenen“ ausdrücklich wiedergegeben.
- source_word: καλῶς
  choice: gut
  rationale: Das Adverb bezeichnet die angemessene und bewährte Art der Leitung. „Gut“ ist knapp, natürlich und semantisch offen genug.
- source_word: προϊστάμενον
  choice: vorsteht
  rationale: προΐστημι bezeichnet verantwortliches Leiten und Wahrnehmen einer Aufsichtsfunktion. „Vorstehen“ gibt echte Leitungsverantwortung wieder, ohne die Härte von „beherrschen“ oder die vorwiegend administrative Färbung von „verwalten“.
- source_word: τέκνα ἔχοντα ἐν ὑποταγῇ
  choice: seine Kinder in Unterordnung hält
  rationale: Die Formulierung bildet die Konstruktion mit ἔχω und dem Substantiv ὑποταγή relativ eng ab. „Unterordnung“ wahrt den Gedanken einer geordneten Autoritätsbeziehung und verengt ihn nicht auf einzelnen Gehorsam; „hält“ darf dabei nicht als Zwangsmaßnahme missverstanden werden.
- source_word: μετὰ πάσης σεμνότητος
  choice: mit aller Würde
  rationale: σεμνότης umfasst Würde, ehrbaren Ernst und achtbares Verhalten. „Mit aller Würde“ ist im modernen Deutschen verständlich und lässt wie der griechische Wortlaut offen, ob die Wendung besonders die Unterordnung der Kinder oder die gesamte Art der Haushaltsleitung kennzeichnet.
theological_decisions:
- issue: Reichweite der Leitungssprache für den Haushalt
  choice: Der Vers beschreibt die verantwortliche Leitung des eigenen Haushalts als Voraussetzung für einen Aufseher.
  alternative: Entweder eine umfassende Lehre patriarchaler Herrschaft daraus abzuleiten oder die ausgesagte Autorität auf bloße Fürsorge abzuschwächen.
  rationale: προΐστημι und ὑποταγή setzen wirkliche Leitung und eine geordnete häusliche Beziehung voraus. Der Vers formuliert jedoch eine konkrete Eignungsvoraussetzung und keine vollständige Lehre über sämtliche Autoritätsverhältnisse.
- issue: Bezug von μετὰ πάσης σεμνότητος
  choice: Der Bezug wird im Haupttext nicht abschließend festgelegt.
  alternative: Die Würde ausschließlich den Kindern und ihrer Unterordnung oder ausschließlich dem Mann und seiner Haushaltsleitung zuzuordnen.
  rationale: Die Stellung der griechischen Wendung erlaubt einen engeren Bezug auf die vorausgehende Unterordnung der Kinder, aber auch einen weiteren Bezug auf die würdige Ordnung beziehungsweise Leitung des Haushalts. Gedankenstrich und Fußnote erhalten diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorstehen“ ist leicht gehoben, im kirchlichen Qualifikationskontext jedoch geläufig und präzise. Der Gedankenstrich vor „mit aller Würde“ macht die syntaktische Offenheit sichtbar, ohne den Satz unnatürlich werden zu lassen.
