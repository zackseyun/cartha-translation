  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: de
  text: Dies schreibe ich dir in der Hoffnung, bald zu dir zu kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτά
  choice: Dies
  rationale: Das substantivisch gebrauchte neutrale Demonstrativpronomen verweist zusammenfassend auf die vorausgehenden beziehungsweise laufenden Anweisungen. Im Deutschen gibt „Dies“ diesen Rückbezug natürlicher wieder als „Diese Dinge“.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bei γράφω bezeichnet in diesem brieflichen Zusammenhang den Empfänger; „dir“ ist die natürliche deutsche Wiedergabe.
- source_word: γράφω
  choice: schreibe ich
  rationale: Das Präsens bezeichnet den gegenwärtigen Schreibakt. Die deutsche Präsensform ist idiomatisch und bewahrt den brieflichen Charakter.
- source_word: ἐλπίζων
  choice: in der Hoffnung
  rationale: Das präsentische Partizip begleitet das Hauptverb und bezeichnet die Hoffnung des Schreibers. Die nominale Wendung klingt im Deutschen natürlich, ohne den Grad der Erwartung zu verstärken.
- source_word: ἐλθεῖν
  choice: zu kommen
  rationale: Der Aoristinfinitiv von ἔρχομαι bezeichnet mit πρὸς σέ die Bewegung zum Empfänger hin; „zu kommen“ ist im Deutschen idiomatisch.
- source_word: πρὸς σὲ
  choice: zu dir
  rationale: πρός mit Akkusativ bezeichnet nach einem Bewegungsverb die Richtung auf eine Person hin.
- source_word: ἐν τάχει
  choice: bald
  rationale: Die feste Wendung kann zeitliche Nähe („bald“) oder rasche Ausführung („schnell“) ausdrücken. Im Zusammenhang einer erhofften Reise ist „bald“ die natürlichste Lesart.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich und knapp; „Dies“ fasst die erteilten Anweisungen zusammen. Für ἐν τάχει steht im Haupttext „bald“; die mögliche Nuance „schnell“ muss in diesem Kontext nicht eigens markiert werden.
