source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: de
  text: Falls ich mich aber verspäte, schreibe ich dir dies, damit du weißt, wie man sich im Haus Gottes verhalten muss – in der Gemeinde des lebendigen Gottes, die Säule und Stütze der Wahrheit ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Stütze« ist auch die Wiedergabe »Fundament«, »fester Halt« oder »Bollwerk« möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: mich verspäte
  rationale: Das intransitive Verb bezeichnet hier eine Verzögerung bei der erwarteten Ankunft. „Mich verspäte“ ist natürliches modernes Deutsch und lässt offen, wodurch die Verzögerung entsteht.
- source_word: ἵνα εἰδῇς
  choice: sollst du wissen
  rationale: Die Formulierung gibt den Zweck des Schreibens in einem natürlichen deutschen Satz wieder, ohne den griechischen Finalsatz unnötig wörtlich abzubilden.
- source_word: δεῖ … ἀναστρέφεσθαι
  choice: wie man sich … verhalten muss
  rationale: Das unpersönliche „man“ entspricht dem nicht ausdrücklich genannten Subjekt des Infinitivs; „muss“ bewahrt die normative Notwendigkeit von δεῖ, und „sich verhalten“ bezeichnet die geforderte Lebens- und Verhaltensweise.
- source_word: ἐν οἴκῳ θεοῦ
  choice: im Haus Gottes
  rationale: „Haus Gottes“ bewahrt die Mehrdeutigkeit von οἶκος zwischen Haus und Hausgemeinschaft. Der folgende Relativsatz macht deutlich, dass die Gemeinde als Gemeinschaft gemeint ist, ohne die Metapher vorzeitig auf „Haushalt“ festzulegen.
- source_word: ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος
  choice: das die Gemeinde des lebendigen Gottes ist
  rationale: „Gemeinde“ bezeichnet im heutigen Deutsch verständlich die versammelte Gemeinschaft und vermeidet die mögliche Verengung von „Kirche“ auf Gebäude oder Institution. Das Relativpronomen bezieht sich grammatisch auf „Haus Gottes“ und erklärt dessen Identität.
- source_word: στῦλος
  choice: Säule
  rationale: „Säule“ ist die direkte und geläufige deutsche Entsprechung der architektonischen Metapher.
- source_word: ἑδραίωμα
  choice: Stütze
  rationale: Das seltene Wort bezeichnet etwas, das Festigkeit oder Halt gibt. „Stütze“ ist verständlich und bewahrt die Funktion, ohne eindeutig „Fundament“ festzulegen; mögliche Alternativen stehen in der Fußnote.
- source_word: τῆς ἀληθείας
  choice: der Wahrheit
  rationale: Der bestimmte Ausdruck wird im Deutschen natürlich mit Artikel wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἐκκλησία im Zusammenhang mit dem Haus Gottes
  choice: Gemeinde
  alternative: Kirche; Versammlung
  rationale: „Gemeinde“ stellt die Gemeinschaft der Menschen in den Vordergrund und ist zugleich im modernen deutschsprachigen christlichen Sprachgebrauch geläufig. Die Übersetzung importiert weder eine bestimmte institutionelle Kirchenordnung noch reduziert sie den Ausdruck auf eine einzelne Zusammenkunft.
- issue: Bezug von „Säule und Stütze der Wahrheit“
  choice: Die Wortgruppe steht als Apposition zur Gemeinde des lebendigen Gottes.
  alternative: Eine Zuordnung zum folgenden Satz oder eine Wiedergabe von ἑδραίωμα als „Fundament“
  rationale: Die übliche Interpunktion und der unmittelbare Satzbau beziehen beide Nomina auf die Gemeinde. „Stütze“ erhält die hohe Aussage über ihre tragende Funktion, ohne zu behaupten, sie sei der Ursprung der Wahrheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der argumentativen Struktur des Griechischen, wird aber idiomatisch formuliert. „Haus Gottes“ bewahrt die Metapher und ihre soziale Bedeutung; „Gemeinde“ ist für ἐκκλησία verständlich und vermeidet eine bloß bauliche Lesart. Der Fußnotenmarker steht unmittelbar nach der betroffenen Gesamtaussage.
