review_pass:
  verdict: revise
  source_fidelity: 'Der griechische Bekenntnistext wird insgesamt treffend und mit seinen parallelen Passivformulierungen wiedergegeben. Die Formulierung „in der Welt im Glauben angenommen“ ist für ἐπιστεύθη jedoch zu unscharf: Sie kann bloße Akzeptanz meinen, während πιστεύω hier den auf Christus gerichteten Glauben bezeichnet. „In der Welt wurde an ihn geglaubt“ gibt diesen Sinn eindeutig wieder.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die Reihung ist gut lesbar. „In der Welt wurde an ihn geglaubt“ ist idiomatischer und semantisch genauer als „im Glauben angenommen“.
  terminology: „Geheimnis der Gottesfurcht“, „im Fleisch“, „im Geist“, „als gerecht erwiesen“, „Engel“, „Völker“ und „Herrlichkeit“ sind angemessen. Die Kleinschreibung von „Geist“ bewahrt die Mehrdeutigkeit von ἐν πνεύματι. Die textkritische Fußnote soll die Lesart ὃς präzise als „der“ bezeichnen und kann die weitere Lesart „was“ knapp transparent machen.
  issues:
  - severity: medium
    issue: „in der Welt im Glauben angenommen“ für ἐπιστεύθη ἐν κόσμῳ
    rationale: „Im Glauben angenommen“ kann eine allgemeine Annahme oder Akzeptanz ausdrücken. Die passive Verwendung von πιστεύω meint hier, dass an den im Hymnus genannten Christus geglaubt wurde. Die revidierte Fassung macht die Glaubensrelation deutlich.
  - severity: low
    issue: Textkritische Fußnote zu ὃς sprachlich und inhaltlich präzisieren
    rationale: Die kritisch edierte Form ist das Relativpronomen ὃς („der“), nicht eigentlich eine Auswahl zwischen den deutschen Formen „der/welcher“. Die historisch überlieferte Neutrumlesart kann neben der Lesart „Gott“ knapp genannt werden.
