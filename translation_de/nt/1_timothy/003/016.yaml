id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: de
  text: 'Und unbestreitbar groß ist das Geheimnis der Gottesfurcht:


    Er[a] wurde im Fleisch offenbart,


    im Geist als gerecht erwiesen[b],


    von Engeln gesehen,


    unter den Völkern verkündet[c],


    in der Welt wurde an ihn geglaubt,


    in Herrlichkeit aufgenommen[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Gott wurde im Fleisch offenbart.“ Andere lesen: „was im Fleisch offenbart wurde“. Der kritische griechische Text hat hier „der“ und bezieht sich im Zusammenhang auf Christus.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „durch den Geist als gerecht erwiesen“. Die knappe griechische Wendung kann auf das Wirken des Heiligen Geistes oder auf den Bereich geistlichen Lebens bezogen werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „unter den Heiden verkündet“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „in die Herrlichkeit aufgenommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: unbestreitbar
  rationale: Das Adverb bezeichnet etwas, das allgemein anerkannt bzw. offen eingestanden wird. „Unbestreitbar“ ist gegenwärtiges, klares Deutsch und bewahrt den nachdrücklichen Charakter.
- source_word: μέγα ἐστὶν
  choice: groß ist
  rationale: Die vorangestellte Prädikatsbestimmung des Griechischen wird zur Hervorhebung in würdiger, noch natürlicher deutscher Wortstellung beibehalten.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: das Geheimnis der Gottesfurcht
  rationale: „Geheimnis“ wahrt den paulinischen Sinn einer zuvor verborgenen und nun offenbarten göttlichen Wahrheit. „Gottesfurcht“ bezeichnet hier die auf Gott ausgerichtete Frömmigkeit und Lebensführung, ohne εὐσέβεια auf Religion als Institution zu verengen.
- source_word: Ὃς
  choice: Er
  rationale: Der kritische Text bietet das maskuline Relativpronomen „der/welcher“. Da der folgende Bekenntnistext persönlich und christologisch spricht, ist „Er“ im Deutschen die natürliche Fortführung, ohne die abweichende Lesart θεός in den Haupttext einzutragen.
- source_word: ἐφανερώθη
  choice: wurde offenbart
  rationale: Die Passivform bezeichnet ein Sichtbar- oder Offenbarwerden. „Wurde offenbart“ ist verständlich und wahrt Form und Offenbarungscharakter.
- source_word: ἐν σαρκί
  choice: im Fleisch
  rationale: Die Wendung bezeichnet leiblich-menschliche Existenz. „Im Fleisch“ ist im Deutschen idiomatischer als „in Fleisch“ und bewahrt zugleich die knappe Gegenüberstellung mit „im Geist“.
- source_word: ἐδικαιώθη
  choice: als gerecht erwiesen
  rationale: Hier geht es nicht darum, dass der Betreffende gerecht gemacht wurde, sondern dass sich sein Recht bzw. seine Gerechtigkeit erwies. Die Formulierung vermeidet missverständliche soteriologische Nebenbedeutungen von „gerechtfertigt“.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: 'Die artikellose griechische Wendung bleibt mehrdeutig: Sie kann den Geist als Bereich bzw. Daseinsweise oder den Heiligen Geist betreffen. „Im Geist“ bewahrt diese Kürze besser als eine ausdrücklich instrumentale Übersetzung.'
- source_word: ὤφθη ἀγγέλοις
  choice: von Engeln gesehen
  rationale: Nach dem Passivverb lässt sich der Dativ natürlich mit „von“ wiedergeben. Im christologischen Zusammenhang sind himmlische Engel wahrscheinlicher als menschliche Boten.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: unter den Völkern verkündet
  rationale: κηρύσσω bezeichnet öffentliche Verkündigung. ἔθνη kann „Heiden“ oder „Völker“ bedeuten; „Völker“ ist umfassend, transparent und vermeidet eine unnötig abwertend klingende moderne Konnotation.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: in der Welt im Glauben angenommen
  rationale: Die ungewöhnliche Passivform von πιστεύω hat Christus als Gegenstand des Glaubens. „Im Glauben angenommen“ gibt diesen personalen Sinn in natürlichem Deutsch deutlicher wieder als das missverständliche „wurde geglaubt“.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: in Herrlichkeit aufgenommen
  rationale: ἀναλαμβάνω bezeichnet das Aufgenommenwerden; ἐν δόξῃ kann die begleitende Weise bzw. Sphäre „in Herrlichkeit“ oder zielgerichtet „in die Herrlichkeit“ verstanden werden. Der Haupttext folgt der formal näheren Fassung.
theological_decisions:
- issue: 'Textvariante zu Beginn des Bekenntnisses: Ὃς gegenüber θεός bzw. ὅ'
  choice: Die kritisch bezeugte Lesart Ὃς wird als persönliche Fortführung mit „Er“ übersetzt.
  alternative: „Gott wurde im Fleisch offenbart“; außerdem ist „was/welches im Fleisch offenbart wurde“ überliefert.
  rationale: Der SBLGNT liest Ὃς („der/welcher“), während die Lesart θεός („Gott“) geschichtlich bedeutsam ist. Der Haupttext folgt der vorgegebenen kritischen Edition; die Variante wird aus textgeschichtlicher Transparenz in einer Fußnote genannt, ohne sie stillschweigend in den Text einzutragen.
- issue: Bezug und Funktion von ἐν πνεύματι
  choice: Im Haupttext steht die knappe Formulierung „im Geist“.
  alternative: „durch den Geist“ mit dem Heiligen Geist als Handelndem; oder „im Geist“ als Bereich geistlicher bzw. auferstandener Existenz.
  rationale: Grammatik und Kontext erlauben mehr als eine Deutung. Die Übersetzung entscheidet nicht konfessionell oder dogmatisch zwischen der Wirksamkeit des Heiligen Geistes und einer Gegenüberstellung von Fleisch und Geist.
- issue: Bedeutung von ἐν δόξῃ
  choice: „in Herrlichkeit aufgenommen“
  alternative: „in die Herrlichkeit aufgenommen“
  rationale: Die Präposition ἐν bezeichnet gewöhnlich „in“, doch im Zusammenhang des Aufgenommenwerdens kann im Deutschen auch ein Zielverständnis naheliegen. Die Hauptfassung wahrt die formale Mehrdeutigkeit; die idiomatische Zieldeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bekenntnishaftem Rhythmus. Die sechs parallelen Passivzeilen des griechischen Textes bleiben erhalten. Fachsprachlich oder altertümlich wirkende Lösungen wie „Gottseligkeit“, „manifestiert“ und „gerechtfertigt“ wurden zugunsten verständlicher, theologisch nicht verengender Formulierungen vermieden.
