id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: de
  text: Dazu[a] wurde ich als Verkündiger und Apostel eingesetzt – ich sage die Wahrheit, ich lüge nicht – als Lehrer der Nichtjuden[b] in Glauben[c] und Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dafür“; auch: „Zu diesem Zweck“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Völker“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in Treue und Wahrheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dazu
  rationale: Die Verbindung verweist auf die zuvor genannte Botschaft beziehungsweise den damit verbundenen Auftrag zurück. „Dazu“ ist im Deutschen knapp und natürlich und lässt sowohl Rückbezug als auch Zweckbezug erkennen.
- source_word: ἐτέθην
  choice: wurde ich … eingesetzt
  rationale: Das Passiv von τίθημι bezeichnet hier die Einsetzung oder Beauftragung für einen Dienst, nicht ein räumliches Hingestelltwerden.
- source_word: κῆρυξ
  choice: Verkündiger
  rationale: κῆρυξ bezeichnet einen öffentlich Beauftragten, der eine Botschaft ausruft. „Verkündiger“ gibt diese Funktion in verständlichem modernem Deutsch wieder; „Herold“ wäre formaler, wirkt aber heute altertümlicher.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: In der paulinischen Selbstbezeichnung ist dies der etablierte und sachlich genaue Titel.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: ich sage die Wahrheit, ich lüge nicht
  rationale: Die direkte Wiedergabe bewahrt die nachdrückliche doppelte Bekräftigung und klingt zugleich natürlich.
- source_word: διδάσκαλος ἐθνῶν
  choice: Lehrer der Nichtjuden
  rationale: ἔθνη bezeichnet im paulinischen Zusammenhang häufig die nichtjüdischen Menschen beziehungsweise Völker. „Nichtjuden“ macht diesen Bezug für heutige Leser unmittelbar verständlich.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: in Glauben und Wahrheit
  rationale: Die Formulierung erhält die offene Beziehung der Präpositionalphrase zum Lehrdienst und gibt πίστις mit seiner üblichen Grundentsprechung „Glaube“ wieder, ohne die mögliche Bedeutung „Treue“ zu verdecken.
theological_decisions:
- issue: Bedeutung von ἐθνῶν in Paulus’ Auftrag
  choice: Nichtjuden
  alternative: Völker
  rationale: Der paulinische Sprachgebrauch spricht hier wahrscheinlich von Menschen außerhalb Israels. Die Alternative „Völker“ bewahrt jedoch die allgemeinere lexikalische Bedeutung.
- issue: Bedeutung von πίστις in ἐν πίστει καὶ ἀληθείᾳ
  choice: Glauben
  alternative: Treue
  rationale: „Glaube“ ist hier als Bereich, Inhalt oder Art des Dienstes gut möglich; πίστις kann jedoch ebenso „Treue“ beziehungsweise „Zuverlässigkeit“ bezeichnen. Diese Spannung wird nicht im Haupttext aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche erhalten den eingeschobenen, nachdrücklichen Wahrheitsanspruch. „Verkündiger“ vermeidet das heute altertümlich wirkende „Herold“, während „Apostel“ als etablierter Titel beibehalten wird.
