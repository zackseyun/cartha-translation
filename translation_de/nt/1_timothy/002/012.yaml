source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: de
  text: Doch ich gestatte einer Frau nicht, zu lehren oder über einen Mann Autorität auszuüben[a][b]; vielmehr soll sie sich ruhig verhalten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer Ehefrau … über einen Ehemann“. Die griechischen Wörter können sowohl allgemein „Frau/Mann“ als auch im ehelichen Sinn „Ehefrau/Ehemann“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Autorität zu haben“; möglicherweise auch: „zu beherrschen“ oder „zu dominieren“. Das griechische Verb ist selten, und seine genaue Bedeutungsnuance ist umstritten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „in Ruhe“; auch „in Stille“. Der griechische Ausdruck kann je nach Zusammenhang Ruhe oder Stille bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: zu lehren
  rationale: Der Infinitiv hängt als Ergänzung von ἐπιτρέπω ab. „Zu lehren“ gibt die schlichte Bedeutung direkt und in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: doch
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise eine Weiterführung gegenüber der vorangehenden Anweisung. „Doch“ wahrt diesen Übergang ohne ihn zu überbetonen.
- source_word: γυναικί
  choice: einer Frau
  rationale: γυνή kann „Frau“ allgemein oder „Ehefrau“ bedeuten. Der weitere Zusammenhang von 2,9–15 spricht eher allgemein von Frauen; die eheliche Lesart bleibt in einer Fußnote erhalten.
- source_word: οὐκ ἐπιτρέπω
  choice: ich gestatte ... nicht
  rationale: Das Präsens wird idiomatisch als allgemeine Aussage wiedergegeben. „Gestatten“ entspricht dem gehobenen, aber verständlichen Ton des griechischen Ausdrucks.
- source_word: οὐδὲ
  choice: oder
  rationale: οὐδέ verbindet unter der vorausgehenden Verneinung den zweiten Infinitiv mit dem ersten. Im Deutschen ist „nicht, zu lehren oder ...“ die natürliche negative Koordination.
- source_word: αὐθεντεῖν
  choice: Autorität auszuüben
  rationale: Das seltene Verb ist in seiner Nuance umstritten. Diese Wiedergabe lässt zunächst einen neutralen Autoritätssinn erkennen, ohne von vornherein die stärker negative Bedeutung „beherrschen“ oder „dominieren“ festzulegen.
- source_word: ἀνδρός
  choice: über einen Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. Der allgemeinere Sinn steht im Haupttext; die mögliche eheliche Bedeutung wird in der Fußnote genannt.
- source_word: ἀλλ’
  choice: vielmehr
  rationale: ἀλλά führt nach der Verneinung die positive Gegenüberstellung ein. „Vielmehr“ macht diesen Kontrast in gegenwärtigem Deutsch klar.
- source_word: εἶναι
  choice: soll sie sich ... verhalten
  rationale: Die ausdrücklich formulierte Soll-Konstruktion gibt den kontrastierenden Infinitiv im Deutschen idiomatisch wieder, ohne „bleiben“ in den Text einzutragen.
- source_word: ἐν ἡσυχίᾳ
  choice: sich ruhig verhalten
  rationale: ἡσυχία kann Ruhe, Zurückhaltung oder je nach Kontext Stille bezeichnen. „Sich ruhig verhalten“ vermeidet die möglicherweise zu absolute Aussage völligen Schweigens; „in Stille“ bleibt als Alternative vermerkt.
theological_decisions:
- issue: Bedeutung von αὐθεντεῖν in einem umstrittenen gemeindlichen Zusammenhang
  choice: Autorität auszuüben
  alternative: Autorität zu haben; zu beherrschen oder zu dominieren
  rationale: Da αὐθεντέω selten ist und seine genaue Färbung diskutiert wird, legt der Haupttext weder zwingend einen missbräuchlichen Herrschaftssinn noch eine besondere kirchenrechtliche Definition fest. Die Fußnote bewahrt die wesentlichen lexikalischen Möglichkeiten.
- issue: Ob γυνή und ἀνήρ Frau/Mann oder Ehefrau/Ehemann bezeichnen
  choice: einer Frau ... über einen Mann
  alternative: einer Ehefrau ... über ihren Ehemann
  rationale: Beide griechischen Substantive können allgemein oder ehelich verstanden werden. Der Kontext spricht eher für die allgemeinen Bezeichnungen, doch die grammatisch mögliche eheliche Lesart wird nicht ausgeschlossen und deshalb in einer Fußnote bewahrt.
- issue: Reichweite von ἡσυχία
  choice: sich ruhig verhalten
  alternative: in Stille sein; schweigen
  rationale: Der Ausdruck kann ruhiges, zurückhaltendes Verhalten bezeichnen und verlangt nicht eindeutig völlige Lautlosigkeit. Die Übersetzung wahrt diese Offenheit, während die stärkere Alternative in der Fußnote erscheint.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt eng am griechischen Gegensatz zwischen Verbot und positiver Erwartung, wird aber idiomatisch formuliert. Umstrittene lexikalische und theologische Fragen werden im Haupttext nicht einseitig entschieden, sondern durch Fußnoten offengehalten.
