  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: de
  text: der sich selbst als Lösegeld für alle[a] gab – das Zeugnis zu den bestimmten Zeiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten aller“. Die Formulierung lässt offen, ob „alle“ jeden einzelnen Menschen oder Menschen aller Gruppen bezeichnet.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Wendung ist stark verkürzt. Sie kann die Selbsthingabe Christi als „das Zeugnis“ bezeichnen oder darauf zielen, dass davon zu den bestimmten Zeiten Zeugnis abgelegt wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: gab
  rationale: Das Aoristpartizip bezieht sich auf den in Vers 5 genannten Menschen Christus Jesus. Ein deutscher Relativsatz mit „gab“ gibt diese Verbindung natürlich wieder.
- source_word: ἑαυτὸν
  choice: sich selbst
  rationale: Das Reflexivpronomen hebt hervor, dass Christus sich in eigener Person hingab.
- source_word: ἀντίλυτρον
  choice: als Lösegeld
  rationale: „Lösegeld“ gibt den Gedanken eines Preises zur Befreiung verständlich wieder. Die durch ἀντί- verstärkte Austausch- beziehungsweise Stellvertretungsnuance wird nicht durch eine erklärende Erweiterung in den Haupttext hineingetragen.
- source_word: ὑπὲρ πάντων
  choice: für alle
  rationale: „Für alle“ ist knapp, natürlich und bewahrt sowohl die Weite von πάντων als auch die mögliche Bedeutung „zugunsten aller“, ohne den Umfang dogmatisch einzuengen.
- source_word: τὸ μαρτύριον
  choice: das Zeugnis
  rationale: Der bestimmte Artikel wird bewahrt. Die knappe nominale Wendung kann appositionell auf die Selbsthingabe Christi zurückweisen; „das Zeugnis“ erhält diese Verdichtung und Mehrdeutigkeit.
- source_word: καιροῖς ἰδίοις
  choice: zu den dafür bestimmten Zeiten
  rationale: Die Formulierung gibt den idiomatischen Sinn geeigneter beziehungsweise festgesetzter Zeitpunkte wieder und wahrt den Plural καιροῖς.
theological_decisions:
- issue: Umfang von πάντων beim Lösegeld Christi
  choice: „für alle“ ohne nähere Eingrenzung
  alternative: „für alle Menschen ohne Ausnahme“ oder „für Menschen aller Gruppen“
  rationale: Der griechische Wortlaut ist universal formuliert, entscheidet aber spätere Lehrdebatten über den Umfang des Erlösungswerks nicht ausdrücklich.
- issue: Stellvertretende Nuance von ἀντίλυτρον
  choice: „Lösegeld“
  alternative: „Lösegeld anstelle aller“ oder „stellvertretendes Lösegeld“
  rationale: Das Wort trägt eine Austausch- und Stellvertretungsnuance, doch ihre ausdrückliche Entfaltung im Haupttext wäre erklärender als das griechische Substantiv selbst.
- issue: Bezug von τὸ μαρτύριον καιροῖς ἰδίοις
  choice: 'Als knappe Apposition belassen: „das Zeugnis zu den dafür bestimmten Zeiten“'
  alternative: „wovon zu den festgesetzten Zeiten Zeugnis abgelegt wurde“
  rationale: Der griechische Ausdruck ist syntaktisch verdichtet. Die Übersetzung macht kein im Wortlaut fehlendes Verb ausdrücklich und lässt offen, ob besonders die Selbsthingabe selbst als Zeugnis oder ihre zeitgerechte Bezeugung im Blick ist.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Der Gedankenstrich kennzeichnet die knappe Apposition, ohne ein im Griechischen nicht ausdrücklich vorhandenes Verb einzufügen. „Dafür bestimmt“ klingt natürlicher als das wörtliche „eigene“ und deutet die Zeitpunkte als festgesetzt, ohne ihren Urheber eigens zu benennen.
