base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: de
  text: 'sondern mit dem, was für Frauen angemessen[a] ist, die sich zu Ehrfurcht vor Gott[b] bekennen: durch gute Werke[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „passend“ oder „geziemend“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gottesfurcht“ oder „Hingabe an Gott“.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „durch gute Werke“; dem Zusammenhang nach sind die guten Werke der angemessene Schmuck.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: sondern
  rationale: Die Konjunktion setzt den positiven Gegensatz zum zuvor abgelehnten äußeren Schmuck fort; nach der deutschen Konstruktion „nicht …, sondern …“ ist „sondern“ die natürliche Entsprechung.
- source_word: ὃ πρέπει
  choice: was … angemessen ist
  rationale: Die idiomatische Verbindung bezeichnet das, was sich gehört oder passend ist. „Angemessen“ ist gegenwärtiges, klares Deutsch und bewahrt den Gedanken sittlicher Schicklichkeit.
- source_word: γυναιξὶν
  choice: für Frauen
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; der Kontext spricht allgemein von Frauen und gibt keinen hinreichenden Grund für die Einschränkung auf Ehefrauen.
- source_word: ἐπαγγελλομέναις
  choice: die sich … bekennen
  rationale: Das Partizip bezeichnet hier ein öffentliches Erklären oder Beanspruchen. „Sich zu … bekennen“ gibt dies würdig und ohne den stärkeren Gedanken eines Gelübdes wieder.
- source_word: θεοσέβειαν
  choice: Gottesverehrung
  rationale: Das Wort bezeichnet ehrfürchtige Hingabe an Gott. „Gottesverehrung“ hält den ausdrücklichen Gottesbezug fest und ist weniger missverständlich als eine bloß allgemeine „Frömmigkeit“.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: durch gute Werke
  rationale: διά mit dem Genitiv bezeichnet hier Mittel oder Art und Weise. Die formnahe Wiedergabe wahrt zugleich die Verbindung zum im Kontext vorausgesetzten angemessenen Schmuck.
theological_decisions:
- issue: Verhältnis der guten Werke zum Bekenntnis der Gottesverehrung
  choice: Die guten Werke erscheinen als die angemessene sichtbare Ausdrucksform für Frauen, die sich zur Gottesverehrung bekennen.
  alternative: Die guten Werke als verdienstliche Grundlage der Annahme bei Gott zu verstehen.
  rationale: Syntax und Zusammenhang stellen äußeren Schmuck und ein durch gute Werke gekennzeichnetes Verhalten einander gegenüber. Der Vers trifft hier keine ausdrückliche Aussage über die Grundlage des Heils; die Übersetzung fügt eine solche Aussage weder hinzu noch schließt sie sie durch eine dogmatische Paraphrase aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur hält den Anschluss an den Gegensatz in Vers 9 offen; der Doppelpunkt macht verständlich, dass die guten Werke erläutern, worin das Angemessene besteht. „Sich zur Gottesverehrung bekennen“ ist bewusst etwas gehoben, aber für heutige Leser verständlich.
