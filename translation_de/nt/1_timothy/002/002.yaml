source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: de
  text: für Könige und alle, die in hoher Stellung stehen[a], damit wir ein ruhiges und stilles Leben führen können in aller Gottesfurcht und Würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die Autorität innehaben“. Wörtlich: „alle, die sich in einer herausgehobenen Stellung befinden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: für
  rationale: Im Zusammenhang mit den zuvor genannten Gebeten und Fürbitten bezeichnet ὑπέρ die Personen, für die gebetet wird; „für“ ist im Deutschen natürlich und präzise.
- source_word: βασιλέων
  choice: Könige
  rationale: Das Substantiv bezeichnet ausdrücklich Könige beziehungsweise souveräne Herrscher; die konkrete lexikalische Form bleibt erhalten.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: alle, die hohe Stellungen einnehmen
  rationale: Die Wendung bezeichnet wörtlich Menschen, die sich in einer hervorgehobenen Stellung befinden, und ist weiter als ausschließlich formale Amtsgewalt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Ergebnisbeziehung idiomatisch wieder.
- source_word: ἤρεμον
  choice: ruhiges
  rationale: Das Adjektiv bezeichnet Ruhe und Freiheit von Störung; „ruhig“ unterscheidet sich hinreichend vom folgenden „still“.
- source_word: ἡσύχιον
  choice: stilles
  rationale: Das Wort betont Stillsein, Ungestörtheit und ein zurückgezogen-friedliches Leben; „still“ bewahrt die Paarung mit ἤρεμον.
- source_word: βίον
  choice: Leben
  rationale: βίος meint hier das geführte irdische Leben beziehungsweise die Lebensweise; „Leben“ passt natürlich zur deutschen Wendung.
- source_word: διάγωμεν
  choice: wir … führen können
  rationale: Das Verb bedeutet, ein Leben zu verbringen oder zu führen. Die modale Form gibt den griechischen Konjunktiv im Finalsatz natürlich wieder.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: in aller Gottesfurcht
  rationale: εὐσέβεια bezeichnet ehrfürchtige, im Leben sichtbare Hingabe an Gott. „Gottesfurcht“ ist verständlich und vermeidet das im heutigen Deutsch oft ungebräuchliche „Gottseligkeit“.
- source_word: σεμνότητι
  choice: Würde
  rationale: Das Substantiv bezeichnet achtungsgebietenden Ernst und ehrenhaftes Verhalten; „Würde“ gibt dieses moralisch-soziale Gewicht knapp wieder.
theological_decisions:
- issue: Umfang und Zweck des Gebets für politische Herrscher
  choice: Der Vers nennt Herrscher und hochgestellte Personen als Gegenstand des Gebets und ein ruhiges, gottesfürchtiges Leben als dessen beabsichtigten Zweck, ohne diese Personen vorbehaltlos zu billigen.
  alternative: Die Wendung könnte enger als Gebet ausschließlich für rechtmäßig eingesetzte Amtsträger oder stärker im Sinn politischer Unterordnung verstanden werden.
  rationale: Der griechische Text fordert an dieser Stelle Gebet für diese Personen und nennt die erhofften Lebensbedingungen. Eine weitergehende Aussage über Legitimität oder uneingeschränkte Unterordnung wird nicht ausdrücklich gemacht.
- issue: Bedeutung von εὐσέβεια
  choice: „Gottesfurcht“ bezeichnet ehrfürchtige Hingabe an Gott, die sich in der Lebensführung zeigt.
  alternative: „Frömmigkeit“ oder „Gottseligkeit“
  rationale: „Frömmigkeit“ kann im heutigen Sprachgebrauch enger oder abwertend wirken, während „Gottseligkeit“ veraltet ist. „Gottesfurcht“ wahrt den Gottesbezug, ohne eine konfessionelle Sonderlehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Adjektive ἤρεμον und ἡσύχιον werden mit „ruhig“ und „still“ unterschieden. „Hohe Stellungen einnehmen“ bewahrt die Breite der griechischen Wendung; die mögliche engere Deutung als Autorität wird in der Fußnote genannt.
