  naturalness: „Das ist gut und angenehm vor Gott, unserem Retter,“ ist modernes, idiomatisches Standarddeutsch und bewahrt den würdigen Registerton. Es vermeidet die im Kontext unpassend schwache Konnotation von „annehmbar“.
