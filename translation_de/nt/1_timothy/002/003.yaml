  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: de
  text: Das ist gut und angenehm vor Gott, unserem Retter,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Das
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist auf die vorausgehende Aufforderung zum Gebet zurück. „Das“ gibt diesen Rückbezug im Deutschen natürlich wieder, ohne ihn unnötig auszudeuten.
- source_word: καλὸν
  choice: gut
  rationale: Im ethischen Zusammenhang bezeichnet καλός das Gute und Angemessene, nicht in erster Linie ästhetische Schönheit. „Gut“ bewahrt die Bedeutungsbreite.
- source_word: ἀπόδεκτον
  choice: annehmbar
  rationale: Das Adjektiv bezeichnet etwas, das willkommen ist oder wohlwollend angenommen wird. „Annehmbar“ bleibt nahe an dieser Aussage und deutet weniger stark als „wohlgefällig“.
- source_word: ἐνώπιον
  choice: vor
  rationale: Hier bezeichnet ἐνώπιον die Beurteilung aus Gottes Sicht. „Vor Gott“ ist knapp, würdig und im Deutschen idiomatisch.
- source_word: σωτῆρος
  choice: Retter
  rationale: „Retter“ ist die direkte, gegenwärtig verständliche Wiedergabe des Titels σωτήρ und bewahrt dessen Aussage über Gottes rettendes Handeln.
- source_word: ἡμῶν
  choice: unserem
  rationale: Das Genitivpronomen gehört zu σωτῆρος und wird entsprechend der deutschen Apposition als „unserem Retter“ wiedergegeben.
- source_word: θεοῦ
  choice: Gott
  rationale: θεοῦ steht in Apposition zu „unserem Retter“ und identifiziert Gott als diesen Retter. Die deutsche Wortfolge „Gott, unserem Retter“ bildet das Verhältnis klar und natürlich ab.
theological_decisions:
- issue: Apposition in τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: „Gott, unserem Retter“
  alternative: „unserem Retter-Gott“ oder „unserem rettenden Gott“
  rationale: 'Die Genitive sind am natürlichsten appositionell zu verstehen: Gott wird als unser Retter bezeichnet. Die gewählte Form wahrt diese Identifikation, ohne zusätzliche dogmatische Aussagen einzutragen.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Satzstruktur bleibt eng am Griechischen; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
