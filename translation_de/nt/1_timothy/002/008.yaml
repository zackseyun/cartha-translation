source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: de
  text: Darum will ich, dass die Männer an jedem Ort beten und dabei heilige Hände erheben, ohne Zorn und Streit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ohne Zorn und Zweifel«. Das griechische Wort kann inneres Nachdenken oder Zweifel bezeichnen; hier ist wahrscheinlich Streit in der Gemeinde gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: ich will
  rationale: Gibt den Willen bzw. Wunsch des Verfassers natürlich und mit dem richtungsweisenden Nachdruck des Griechischen wieder.
- source_word: οὖν
  choice: darum
  rationale: Markiert den Folgerungs- und Fortsetzungszusammenhang mit dem Vorhergehenden in natürlichem Deutsch.
- source_word: προσεύχεσθαι
  choice: beten
  rationale: Die übliche und klare deutsche Wiedergabe von προσεύχομαι; der Infinitiv wird idiomatisch durch einen dass-Satz ausgedrückt.
- source_word: τοὺς ἄνδρας
  choice: die Männer
  rationale: ἀνήρ bezeichnet hier angesichts der geschlechtsspezifischen Anweisungen im Kontext Männer, nicht allgemein Menschen; für »Ehemänner« fehlen eindeutige Kontextsignale.
- source_word: ἐν παντὶ τόπῳ
  choice: an jedem Ort
  rationale: Bewahrt den distributiven Sinn der griechischen Wendung und klingt im Deutschen natürlich.
- source_word: ἐπαίροντας
  choice: und dabei … erheben
  rationale: Das Partizip beschreibt die das Gebet begleitende Handlung; »dabei« macht diesen Bezug im Deutschen klar.
- source_word: ὁσίους χεῖρας
  choice: heilige Hände
  rationale: Bewahrt die etablierte Bildsprache und den Sinn von Gott angemessener Heiligkeit bzw. Frömmigkeit, ohne ὅσιος mit einem anderen Reinheitsbegriff gleichzusetzen.
- source_word: χωρὶς
  choice: ohne
  rationale: Gibt die Abwesenheit der genannten Haltungen direkt wieder.
- source_word: ὀργῆς
  choice: Zorn
  rationale: Eine würdige und geläufige Wiedergabe, die hier menschlichen Zorn im zwischenmenschlichen Zusammenhang bezeichnet.
- source_word: διαλογισμοῦ
  choice: Streit
  rationale: διαλογισμός kann Überlegung, Zweifel oder Auseinandersetzung bezeichnen. Zusammen mit »Zorn« und im Kontext gemeinsamen Gebets liegt streitendes Auseinandersetzen nahe; »Streit« ist dafür knapp und natürlich.
theological_decisions:
- issue: Geschlechtsspezifischer Bezug von τοὺς ἄνδρας
  choice: die Männer
  alternative: die Menschen; alle; die Ehemänner
  rationale: Der maskuline Ausdruck wird spezifisch wiedergegeben, da der unmittelbare Zusammenhang Männer und Frauen mit unterschiedlichen Anweisungen anspricht. Eine generische Übersetzung würde diese Textgestalt einebnen; für »Ehemänner« fehlen klare Hinweise.
- issue: Bedeutung von διαλογισμοῦ beim Gebet
  choice: Streit
  alternative: Zweifel; strittiges Überlegen
  rationale: Die Verbindung mit »Zorn« spricht wahrscheinlich für eine gemeinschaftliche, konfliktbezogene Bedeutung. Da eine innere Bedeutung wie »Zweifel« lexikalisch möglich bleibt, wird sie in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dass-Satz nach »ich will« ist idiomatischer als eine substantivische oder infinitivische Konstruktion. »Heilige Hände« bewahrt bewusst die konkrete Gebetsgeste und ihre ethische Bildsprache.
