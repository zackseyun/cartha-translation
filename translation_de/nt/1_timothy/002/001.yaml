id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: de
  text: Darum fordere ich vor allem dazu auf, dass Bitten, Gebete, Fürbitten und Danksagungen für alle Menschen[a] dargebracht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche verstehen »alle Menschen« hier im Sinn von »Menschen jeder Art« oder »alle Gruppen von Menschen«; im Griechischen steht schlicht »alle Menschen«. Das griechische Wort bezeichnet Menschen allgemein, nicht nur Männer.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ich fordere ... dazu auf
  rationale: Gibt die nachdrückliche, aber nicht schroffe apostolische Aufforderung in natürlichem modernem Deutsch wieder.
- source_word: οὖν
  choice: Darum
  rationale: Markiert knapp und verständlich die folgernde Verbindung zum vorausgehenden Gedankengang.
- source_word: πρῶτον πάντων
  choice: vor allem
  rationale: Drückt den Vorrang oder die besondere Bedeutung aus, ohne zwingend eine nummerierte Reihenfolge anzunehmen.
- source_word: ποιεῖσθαι
  choice: darzubringen
  rationale: Passt idiomatisch zu allen vier Gebetsbegriffen und bewahrt einen würdigen Ton, ohne eine bestimmte liturgische Form festzulegen.
- source_word: δεήσεις
  choice: Bitten
  rationale: Bezeichnet aus einer Not oder einem Bedürfnis hervorgehende Anliegen und ist allgemein verständlich.
- source_word: προσευχάς
  choice: Gebete
  rationale: Entspricht dem allgemeinen griechischen Begriff für Gebet.
- source_word: ἐντεύξεις
  choice: Fürbitten
  rationale: Gibt im Kontext Gebete zugunsten anderer wieder; die genaue Abgrenzung zu den übrigen Gebetsbegriffen bleibt bewusst offen.
- source_word: εὐχαριστίας
  choice: Danksagungen
  rationale: Bewahrt den pluralischen Listencharakter und unterscheidet den Dank von den anderen Gebetsformen.
- source_word: ὑπὲρ
  choice: für
  rationale: Gibt den Gedanken zugunsten beziehungsweise im Interesse anderer in natürlichem Deutsch wieder.
- source_word: πάντων ἀνθρώπων
  choice: alle Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen allgemein und nicht nur Männer; die Formulierung bewahrt zudem den uneingeschränkten Wortlaut des Griechischen.
theological_decisions:
- issue: Reichweite von πάντων ἀνθρώπων
  choice: alle Menschen
  alternative: Menschen jeder Art / alle Gruppen von Menschen
  rationale: Der griechische Wortlaut lautet schlicht „alle Menschen“. Ob dies im weiteren theologischen Zusammenhang auf jeden Einzelnen oder auf Menschen aus sämtlichen Gruppen bezogen wird, soll die Übersetzung nicht vorentscheiden; die Fußnote weist auf die Deutungsmöglichkeit hin.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die vier Gebetsbegriffe bleiben als unterscheidbare Reihung erhalten. „Vor allem“ vermittelt Priorität natürlicher als das potenziell rein chronologische „zuerst“. Nur eine Fußnote ist gesetzt, da die englischen Fußnoten offenbar fehlerhaft zugeordnet sind: Die angegebene Alternative „im Namen/für alle Menschen“ betrifft ὑπέρ und ist im Deutschen durch „für“ ausreichend abgedeckt; die sachlich relevanten Hinweise zu πάντων ἀνθρώπων werden gebündelt.'
