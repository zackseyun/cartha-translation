  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: de
  text: der will, dass alle Menschen gerettet werden und zur Erkenntnis der Wahrheit gelangen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der wünscht, dass alle Menschen gerettet werden“. Das griechische Verb kann „wollen“ oder „wünschen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur vollen Erkenntnis der Wahrheit gelangen“. Das griechische Substantiv kann die Nuance einer genaueren oder umfassenderen Erkenntnis tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen bezieht sich auf Gott im vorhergehenden Vers. „der“ bewahrt im Deutschen den syntaktischen Anschluss.
- source_word: πάντας ἀνθρώπους
  choice: alle Menschen
  rationale: Die Wortgruppe bezeichnet hier Menschen allgemein und nicht nur Männer. „alle Menschen“ gibt den natürlichen universalen Wortlaut klar wieder.
- source_word: θέλει
  choice: will
  rationale: θέλω kann „wollen“, „wünschen“ oder „begehren“ bedeuten. Das natürliche deutsche „will“ bewahrt die Aussagekraft des Verbs, ohne πάντας ἀνθρώπους einzuschränken; die mögliche Nuance „wünscht“ wird in einer Fußnote kenntlich gemacht.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Der passive Infinitiv von σῴζω hat hier den in paulinischem Zusammenhang üblichen heilsgeschichtlichen Sinn. „gerettet werden“ ist die klare und etablierte deutsche Wiedergabe.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: zur Erkenntnis der Wahrheit
  rationale: Die Wendung bezeichnet das Gelangen zu Erkenntnis beziehungsweise genauer oder voller Erkenntnis der Wahrheit. „zur Erkenntnis der Wahrheit“ ist idiomatisch und überbetont die mögliche Intensivnuance von ἐπίγνωσις nicht.
- source_word: ἐλθεῖν
  choice: gelangen
  rationale: ἔρχομαι mit εἰς beschreibt hier das Eintreten in einen Zustand. „gelangen“ ist im Deutschen natürlicher als das wörtliche „kommen“ und erhält die Bewegungsmetapher.
theological_decisions:
- issue: Reichweite von πάντας ἀνθρώπους und Gottes Heilswillen
  choice: „alle Menschen“ und „will“ ohne einschränkenden Zusatz
  alternative: „alle Arten von Menschen“; „wünscht“; ein technisch-dogmatisches Verständnis von „will“
  rationale: Der griechische Wortlaut ist seinem natürlichen Sinn nach universal formuliert. Die Übersetzung schränkt „alle Menschen“ nicht auf Menschengruppen ein und entscheidet zugleich nicht, in welchem systematisch-theologischen Sinn Gottes Wollen zu verstehen ist. Die Fußnote nennt die lexikalische Alternative „wünscht“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der relative Anschluss an den vorhergehenden Vers bleibt durch „der“ erhalten. Die Formulierung bewahrt sowohl den universalen Wortlaut als auch die theologische Spannung.
