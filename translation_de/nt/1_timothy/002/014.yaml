  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: de
  text: Und Adam wurde nicht getäuscht, die Frau aber, nachdem sie getäuscht worden war[a], ist in Übertretung geraten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem sie gründlich getäuscht worden war“. Das hier verwendete griechische Verb kann gegenüber dem zuvor für Adam gebrauchten Verb eine verstärkende Nuance haben und eine gründliche oder vollständige Täuschung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ist in Übertretung gekommen“ oder „befand sich damit in Übertretung“. Die griechische Perfektform kann den daraus entstandenen Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Der Eigenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: ἠπατήθη
  choice: wurde nicht getäuscht
  rationale: Die passive Aoristform von ἀπατάω wird direkt und in angemessenem Register wiedergegeben.
- source_word: ἡ γυνή
  choice: die Frau
  rationale: Im Rückbezug auf die Schöpfungserzählung bezeichnet γυνή hier die Frau im Gegensatz zu Adam. „Ehefrau“ wäre möglich, würde den Ausdruck jedoch stärker festlegen.
- source_word: ἐξαπατηθεῖσα
  choice: wurde getäuscht
  rationale: Die partizipiale Vorzeitigkeit lässt sich im Deutschen in dieser Satzverbindung natürlich mit einem koordinierten finiten Verb ausdrücken. Eine mögliche verstärkende Bedeutung des Kompositums wird in der Fußnote bewahrt.
- source_word: ἐν παραβάσει
  choice: in Übertretung
  rationale: Die abstrakte Formulierung des Griechischen bleibt erhalten; sie wird nicht in die personenbezogene Bezeichnung „Übertreterin“ umgeformt.
- source_word: γέγονεν
  choice: ist … geraten
  rationale: Das deutsche Perfekt mit „geraten“ vermittelt sowohl das Eintreten als auch den daraus hervorgegangenen Zustand, ohne γέγονεν auf eine bloße Kopula zu reduzieren.
- source_word: δὲ
  choice: aber
  rationale: Die Konjunktion kennzeichnet hier den Gegensatz zwischen Adam und der Frau.
- source_word: καὶ
  choice: Und
  rationale: „Und“ verbindet den Vers schlicht mit dem vorausgehenden Gedankengang, ohne eine zusätzliche Folgerungsnuance einzutragen.
theological_decisions:
- issue: Paulus’ Aussage über die Frau und die Übertretung, ohne daraus weitergehende Aussagen über weibliche Schuld oder das Wesen der Frau abzuleiten
  choice: die Frau aber wurde getäuscht und ist in Übertretung geraten
  alternative: die Frau aber wurde getäuscht und wurde zur Übertreterin
  rationale: Die gewählte Fassung bleibt bei der geschichtlichen Aussage und der abstrakten Wendung des griechischen Textes. Sie macht aus παράβασις keine persönliche Wesens- oder Rollenbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, während der Gegensatz, die abstrakte Wendung „in Übertretung“ und die mögliche Ergebnisbedeutung des Perfekts erhalten bleiben.
