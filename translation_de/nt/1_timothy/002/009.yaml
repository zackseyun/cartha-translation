source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: de
  text: Ebenso sollen sich auch die Frauen in angemessener Kleidung mit Zurückhaltung[a] und Besonnenheit schmücken, nicht mit Haarflechten und Gold oder Perlen oder kostbarer Kleidung[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Schamgefühl“, „mit Sittsamkeit“ oder „mit ehrbarer Zurückhaltung“.'
    reason: lexical_alternative
  - marker: b
    text: Die Verbindung von Haarflechten, Gold, Perlen und kostbarer Kleidung zielt wahrscheinlich auf prunkvolle Selbstdarstellung; die Aufzählung bleibt im Haupttext wörtlich erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Ebenso sollen sich auch
  rationale: „Ebenso“ wahrt die Verbindung zur vorangehenden Ermahnung; „auch“ gibt das additive καί wieder. „Sollen“ macht die im Infinitiv liegende Aufforderung im Deutschen verständlich.
- source_word: γυναῖκας
  choice: die Frauen
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten; ohne ausdrückliche eheliche Kennzeichnung ist hier die allgemeine Bedeutung „Frauen“ vorzuziehen.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: in angemessener Kleidung
  rationale: καταστολή bezeichnet hier Kleidung bzw. Aufmachung, κόσμιος das Geordnete, Schickliche und Angemessene. Die Formulierung ist natürlich und bewahrt den sozialen wie sittlichen Bedeutungsanteil.
- source_word: μετὰ αἰδοῦς
  choice: mit Schamgefühl
  rationale: αἰδώς bezeichnet ein ehrbares Empfinden von Scheu und Zurückhaltung, das vor Ungebührlichem bewahrt. „Schamgefühl“ bildet dies genauer ab als ein rein äußerlich verstandenes „Sittsamkeit“; eine Fußnote nennt natürliche Alternativen.
- source_word: σωφροσύνης
  choice: Besonnenheit
  rationale: σωφροσύνη verbindet vernünftiges Urteilsvermögen mit Selbstbeherrschung. „Besonnenheit“ wahrt diese Breite und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: κοσμεῖν ἑαυτάς
  choice: sich … schmücken
  rationale: κοσμέω bedeutet „ordnen, schmücken“. „Sich schmücken“ erhält die Wortwahl und den Gegensatz zwischen angemessener und prunkvoller äußerer Gestaltung.
- source_word: μὴ ἐν πλέγμασιν
  choice: nicht mit aufwendigen Haarflechten
  rationale: πλέγματα bezeichnet Geflochtenes, im Zusammenhang wahrscheinlich kunstvolle Flechtfrisuren. „Aufwendig“ verdeutlicht den kulturellen Bezug auf zur Schau gestellte Aufmachung, ohne gewöhnliche Zöpfe unnötig zum Gegenstand zu machen.
- source_word: χρυσίῳ
  choice: Gold
  rationale: Die allgemeine Bezeichnung entspricht dem Griechischen und legt nicht fest, welche Art von Goldschmuck gemeint ist.
- source_word: μαργαρίταις
  choice: Perlen
  rationale: Dies ist die direkte und kontextuell eindeutige Entsprechung.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: kostbarer Kleidung
  rationale: ἱματισμός bezeichnet Kleidung, πολυτελής etwas Kostspieliges oder Luxuriöses. „Kostbar“ ist idiomatisch und lässt sowohl hohen Preis als auch prunkvolle Wirkung anklingen.
theological_decisions:
- issue: Ob allgemein Frauen oder speziell Ehefrauen angesprochen sind
  choice: Frauen allgemein
  alternative: Ehefrauen
  rationale: Der pluralische Ausdruck γυναῖκας steht in einer allgemeinen Ermahnung und enthält keine sprachliche Markierung, die ihn auf verheiratete Frauen beschränkt.
- issue: Ob die Aufzählung ein ausnahmsloses Verbot oder eine Kritik an prunkvoller Selbstdarstellung formuliert
  choice: Der Wortlaut der Aufzählung bleibt erhalten; eine Fußnote erläutert den wahrscheinlichen Bezug auf prunkvolle Selbstdarstellung.
  alternative: Ein absolutes Verbot jeder Flechtfrisur sowie jedes Tragens von Gold, Perlen oder kostspieliger Kleidung
  rationale: Die Gegenüberstellung von angemessener Kleidung, Schamgefühl und Besonnenheit einerseits und luxuriösen Statuszeichen andererseits weist auf ostentative Aufmachung. Da der griechische Wortlaut die Gegenstände dennoch ausdrücklich verneint, bleibt diese Spannung im Haupttext bestehen und wird nicht durch eine freie Umschreibung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung des größeren Satzgefüges mit Komma abgeschlossen. „Schamgefühl“ wird durch eine Fußnote gegen mögliche moderne Missverständnisse abgesichert; „Besonnenheit“ umfasst sowohl vernünftiges Urteil als auch Selbstbeherrschung.
