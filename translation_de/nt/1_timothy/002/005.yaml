base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: de
  text: 'Denn es gibt nur einen Gott und nur einen Mittler zwischen Gott und den Menschen: einen Menschen – Messias Jesus[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός bedeutet „Messias“ und wird hier als Titel verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς … εἷς
  choice: nur einen … nur einen
  rationale: Die Wiederholung wahrt die betonte Parallelität. „Nur“ macht im Deutschen deutlich, dass εἷς hier jeweils ausschließende Einzigkeit bezeichnet, statt wie ein bloßer unbestimmter Artikel zu klingen.
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet den Vers als Begründung des vorausgehenden Gedankens.
- source_word: μεσίτης
  choice: Mittler
  rationale: „Mittler“ ist die präzise und geläufige Bezeichnung für jemanden, der zwischen zwei Seiten vermittelt.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: zwischen Gott und den Menschen
  rationale: Die griechischen Genitive bezeichnen die beiden Seiten, zwischen denen der Mittler steht; diese Beziehung wird im Deutschen idiomatisch mit „zwischen“ ausgedrückt. Der Plural ἀνθρώπων meint die Menschheit allgemein.
- source_word: ἄνθρωπος
  choice: den Menschen
  rationale: Die Apposition benennt ausdrücklich das Menschsein des Mittlers. Der Akkusativ folgt der Konstruktion mit „es gibt“ und bewahrt zugleich die Wortverbindung mit „den Menschen“ im vorigen Satzglied.
- source_word: Χριστὸς Ἰησοῦς
  choice: den Messias Jesus
  rationale: Χριστός hat hier Titelfunktion und wird daher mit „Messias“ übersetzt; Ἰησοῦς bleibt der Personenname. Die griechische Reihenfolge Titel–Name wird gewahrt.
theological_decisions:
- issue: Verhältnis von ἀνθρώπων und ἄνθρωπος
  choice: „den Menschen … den Menschen“
  alternative: „den Menschen … einen Menschen“
  rationale: Die gleiche deutsche Wortwahl macht die absichtliche Verbindung zwischen der Menschheit und dem menschlichen Mittler sichtbar. Die Formulierung bekräftigt Jesu wirkliches Menschsein, ohne eine Aussage gegen seine Gottheit hinzuzufügen.
- issue: Wiedergabe von Χριστός
  choice: „Messias“
  alternative: „Christus“
  rationale: Der griechische Ausdruck bezeichnet Jesus mit dem messianischen Titel. Die traditionelle Transliteration „Christus“ bleibt als Fußnotenalternative genannt.
- issue: Exklusivität der beiden εἷς-Aussagen
  choice: „nur einen Gott und nur einen Mittler“
  alternative: „einen Gott und einen Mittler“
  rationale: Das wiederholte εἷς steht in einer betonten Parallelkonstruktion. „Nur“ verhindert, dass deutsches „ein“ lediglich als unbestimmter Artikel verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die Apposition transparent. Die bewusst markante Wendung „den Menschen, den Messias Jesus“ erhält die griechische Reihenfolge und die Spannung zwischen Jesu Menschsein und seinem messianischen Titel.
