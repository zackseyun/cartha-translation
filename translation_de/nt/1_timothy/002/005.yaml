- from: 'Denn es gibt nur einen Gott und nur einen Mittler zwischen Gott und den Menschen: den Menschen, den Messias Jesus.[a]'
  to: 'Denn es gibt nur einen Gott und nur einen Mittler zwischen Gott und den Menschen: einen Menschen – Messias Jesus[a].'
  rationale: Die Revision ersetzt die missverständliche doppelte Form „den Menschen“ durch „einen Menschen“. Damit wird der anarthrische, appositionelle Charakter von ἄνθρωπος klar und idiomatisch wiedergegeben, während die Verbindung zur Menschheit im vorangehenden „den Menschen“ erhalten bleibt. Der Gedankenstrich markiert die Identifizierung des menschlichen Mittlers als Messias Jesus. Der Fußnotenanker wurde an die erläuterte Wortgruppe gesetzt.
