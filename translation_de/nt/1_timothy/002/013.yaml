  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: de
  text: Denn Adam wurde zuerst geformt[a], dann Eva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gestaltet«. Das Verb erinnert an die Formulierung des Schöpfungsberichts in Genesis.'
