lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt die erklärende Funktion knapp und natürlich.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: πρῶτος
  choice: zuerst
  rationale: Bezeichnet hier die zeitliche Reihenfolge gegenüber der Formung Evas.
- source_word: ἐπλάσθη
  choice: wurde geformt
  rationale: Das Passiv von πλάσσω bezeichnet das Formen oder Gestalten und lässt den sprachlichen Anklang an den Schöpfungsbericht erkennen; „geschaffen“ wäre weiter gefasst.
- source_word: εἶτα
  choice: danach
  rationale: Kennzeichnet schlicht den folgenden Zeitpunkt beziehungsweise die zeitliche Abfolge.
- source_word: Εὕα
  choice: Eva
  rationale: Die im Deutschen übliche Form des Eigennamens.
theological_decisions:
- issue: Bezug auf die Schöpfungsreihenfolge in einem kontrovers diskutierten gemeindlichen Zusammenhang
  choice: 'Der Vers wird als schlichte zeitliche Aussage wiedergegeben: Adam wurde zuerst geformt, danach Eva.'
  alternative: Eine stärker deutende Wiedergabe, die Aussagen über Autorität oder unterschiedliche Rollen ausdrücklich in den Vers einträgt.
  rationale: Der griechische Wortlaut nennt hier nur die Reihenfolge der Formung. Die daraus gezogene Folgerung wird nicht in diesen Vers hineinformuliert; so bleiben die theologische Spannung und der Argumentationsgang gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn“ erhält den begründenden Anschluss; „geformt“ bewahrt den konkreten Anklang an den Schöpfungsbericht, ohne zusätzliche theologische Folgerungen einzutragen.
