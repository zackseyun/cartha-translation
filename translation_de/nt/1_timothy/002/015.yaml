reference: 1 Timothy 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: de
  text: Doch sie wird durch das Gebären von Kindern gerettet werden[a][c], wenn sie im Glauben[b], in der Liebe und in der Heiligkeit mit Besonnenheit bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Geburt des Kindes“. Manche verstehen den bestimmten Artikel als Hinweis auf eine besondere Geburt, möglicherweise die des Messias; die Wendung kann jedoch auch allgemein das Gebären von Kindern bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: „Glaube“ kann hier auch im Sinn von „Treue“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Text wechselt vom Singular („sie wird gerettet werden“) zum Plural („wenn sie … bleiben“).
    reason: grammatical_note
lexical_decisions:
- source_word: σωθήσεται
  choice: wird … gerettet werden
  rationale: Das Futur Passiv von σῴζω bedeutet im paulinischen Sprachgebrauch gewöhnlich „retten“. Formulierungen wie „wird bewahrt werden“ würden die Aussage unnötig auf körperlichen Schutz verengen.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier einen milden Gegensatz beziehungsweise eine Weiterführung gegenüber dem vorherigen Gedanken. „Doch“ gibt diese Nuance knapp und natürlich wieder.
- source_word: διὰ τῆς τεκνογονίας
  choice: durch das Gebären von Kindern
  rationale: τεκνογονία bezeichnet das Gebären beziehungsweise Zur-Welt-Bringen von Kindern. Die Formulierung bewahrt den ungewöhnlichen instrumentalen Ausdruck und lässt offen, in welchem Sinn dadurch Rettung geschieht.
- source_word: ἐὰν
  choice: wenn
  rationale: ἐάν leitet eine Bedingung ein. „Wenn“ ist dafür die direkte und idiomatische deutsche Entsprechung.
- source_word: μείνωσιν
  choice: bleiben
  rationale: μένω bezeichnet das Bleiben oder Verharren in einem Zustand. „Bleiben“ wahrt die Bildlichkeit und passt natürlich zur folgenden Aufzählung.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: πίστις wird grundsätzlich mit „Glaube“ wiedergegeben. Die im Zusammenhang ebenfalls mögliche Bedeutung „Treue“ wird in einer Fußnote genannt.
- source_word: ἀγάπῃ
  choice: in der Liebe
  rationale: „Liebe“ ist die klare und übliche Wiedergabe von ἀγάπη.
- source_word: ἁγιασμῷ
  choice: in der Heiligkeit
  rationale: ἁγιασμός kann „Heiligung“ oder „Heiligkeit“ bezeichnen. In dieser Reihe geistlich-ethischer Eigenschaften ist „Heiligkeit“ natürlich und allgemein verständlich.
- source_word: μετὰ σωφροσύνης
  choice: mit Besonnenheit
  rationale: σωφροσύνη umfasst Selbstbeherrschung, vernünftiges Urteilsvermögen und maßvolles Verhalten. „Besonnenheit“ bewahrt diese Bedeutungsbreite besser als eine enger gefasste Alternative.
theological_decisions:
- issue: Wechsel vom Singular „sie wird gerettet werden“ zum Plural „wenn sie … bleiben“
  choice: Der grammatische Wechsel wird im Deutschen beibehalten.
  alternative: Beide Satzteile könnten vereinheitlichend auf Frauen im Allgemeinen bezogen werden; auch eine Deutung des Singulars auf Eva und des Plurals auf Frauen allgemein ist möglich.
  rationale: Der griechische Text wechselt ausdrücklich vom Singular zum Plural. Eine Angleichung würde eine exegetisch bedeutsame Spannung verdecken.
- issue: Bedeutung von „durch das Gebären von Kindern gerettet“
  choice: Die mehrdeutige Formulierung bleibt ohne nähere Bestimmung der Art der Rettung oder der vermittelnden Beziehung stehen.
  alternative: Mögliche Deutungen sind Bewahrung beim Gebären, Rettung im Zusammenhang mit der mütterlichen Aufgabe oder Rettung durch eine bestimmte Geburt, insbesondere die des Messias.
  rationale: Der griechische Wortlaut legt keine dieser Deutungen eindeutig fest. Die Übersetzung soll weder körperliche Bewahrung noch eine bestimmte heilsgeschichtliche oder soziale Erklärung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer deutbare Wendung wird weder geglättet noch konfessionell festgelegt. „Besonnenheit“ wahrt die Bedeutungsbreite von σωφροσύνη, während die Verbform „bleiben“ den auffälligen Numeruswechsel erkennen lässt.
