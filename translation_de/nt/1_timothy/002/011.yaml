  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: de
  text: Eine Frau[b] soll in Ruhe[a] und in völliger Unterordnung lernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Stille“. Das griechische Wort kann Ruhe, Stille oder eine ruhige Haltung bezeichnen und muss nicht völliges Schweigen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Eine Ehefrau“; das griechische Wort kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: γυνὴ
  choice: Eine Frau
  rationale: γυνή kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. Der artikellose Singular ist hier am ehesten allgemein zu verstehen; „eine Frau“ wahrt die Form, ohne einen Ehestand vorauszusetzen.
- source_word: ἐν ἡσυχίᾳ
  choice: in Ruhe
  rationale: ἡσυχία bezeichnet Ruhe, Stille oder eine ruhige Haltung und verlangt nicht zwingend völlige Sprachlosigkeit. „In Ruhe“ gibt die Präpositionalfügung natürlich wieder, ohne den Sinn unnötig zu verengen.
- source_word: μανθανέτω
  choice: soll ... lernen
  rationale: Der Imperativ der dritten Person erteilt eine positive Anweisung zum Lernen. „Soll ... lernen“ gibt diesen Aufforderungscharakter in modernem Deutsch klar und würdig wieder.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: in völliger Unterordnung
  rationale: ὑποταγή bezeichnet Unterordnung; πάσῃ verstärkt sie als vollständig oder umfassend. Die Formulierung benennt keinen Gegenstand der Unterordnung, da auch der griechische Text keinen ausdrücklich nennt.
theological_decisions:
- issue: Ob ἡσυχία völliges Schweigen oder eine ruhige Haltung bezeichnet
  choice: in Ruhe
  alternative: in Stille
  rationale: Der Begriff kann Stille einschließen, bezeichnet aber auch Ruhe und friedliches, nicht störendes Verhalten. „In Ruhe“ vermeidet es, ein absolutes Redeverbot in das Wort hineinzulesen.
- issue: Ob γυνή als „Frau“ oder „Ehefrau“ zu verstehen ist
  choice: Frau
  alternative: Ehefrau
  rationale: Der unmittelbare Wortlaut kennzeichnet keinen ehelichen Zusammenhang eindeutig. „Frau“ hält den Bezug offen; die mögliche Bedeutung „Ehefrau“ wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung stellt die positive Aufforderung zum Lernen heraus. Die Fußnotenmarker folgen unmittelbar auf die jeweils erklärungsbedürftige Wendung beziehungsweise den Satzbezug.
