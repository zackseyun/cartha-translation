base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: de
  text: Sie verbieten zu heiraten und verlangen, auf Speisen zu verzichten, die Gott geschaffen hat, damit sie von denen, die glauben und die Wahrheit erkannt haben, mit Dank zu sich genommen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden griechischen Infinitive lauten wörtlich „zu heiraten“ und „sich von Speisen zu enthalten“. Der Zusammenhang zeigt, dass die beschriebenen Irrlehrer den Verzicht auf Speisen fordern; dies wird im Haupttext ausdrücklich gemacht.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: Sie verbieten
  rationale: Das Präsenspartizip setzt die Beschreibung aus dem vorigen Vers fort. „Verbieten“ gibt die untersagende Bedeutung im Deutschen klar und natürlich wieder.
- source_word: γαμεῖν
  choice: zu heiraten
  rationale: Der Infinitiv wird direkt und idiomatisch wiedergegeben, ohne den konkreten Vorgang durch das abstraktere „Ehe“ zu ersetzen.
- source_word: ἀπέχεσθαι
  choice: verlangen, auf … zu verzichten
  rationale: Der griechische Infinitiv bedeutet wörtlich „sich enthalten“. Im Satz ist sinngemäß eine weitere Forderung der Irrlehrer gemeint; „verlangen“ macht diese syntaktisch vorausgesetzte Kraft im Deutschen verständlich.
- source_word: βρωμάτων
  choice: Speisen
  rationale: Der Plural bezeichnet Nahrungsmittel beziehungsweise Speisen. „Speisen“ passt zum würdigen, modernen Register.
- source_word: ἃ
  choice: die
  rationale: Das Relativpronomen bezieht sich auf „Speisen“.
- source_word: ἔκτισεν
  choice: geschaffen hat
  rationale: „Schaffen“ bewahrt die ausdrückliche Schöpfungssprache von κτίζω.
- source_word: εἰς μετάλημψιν
  choice: damit sie … zu sich genommen werden
  rationale: Die Wendung bezeichnet den Zweck, zu dem Gott die Speisen schuf. „Zu sich nehmen“ ist im Zusammenhang mit Nahrung natürlicher als das allgemeinere „empfangen“.
- source_word: μετὰ εὐχαριστίας
  choice: mit Dank
  rationale: Die Formulierung bewahrt den Gedanken des dankbaren Annehmens von Gottes Gabe und klingt im Deutschen natürlich.
- source_word: τοῖς πιστοῖς
  choice: von denen, die glauben
  rationale: Hier bezeichnet πιστοῖς am ehesten Glaubende. Die verbale Wiedergabe vermeidet die mögliche Nebenbedeutung „die Treuen“.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: die Wahrheit erkannt haben
  rationale: Das Perfektpartizip bezeichnet einen Erkenntnisvorgang mit fortbestehendem Ergebnis. Das deutsche Perfekt gibt dies angemessen wieder.
theological_decisions:
- issue: Bezeichnen τοῖς πιστοῖς und ἐπεγνωκόσι τὴν ἀλήθειαν eine oder zwei Gruppen?
  choice: 'Eine Gruppe mit zwei Kennzeichen: Menschen, die glauben und die Wahrheit erkannt haben.'
  alternative: 'Zwei Gruppen: die Glaubenden und diejenigen, die die Wahrheit erkannt haben.'
  rationale: Der gemeinsame Artikel und die koordinierten Beschreibungen sprechen am natürlichsten für dieselbe Personengruppe, ohne zwei Klassen von Empfängern anzunehmen.
- issue: Wie ist der elliptische Anschluss von ἀπέχεσθαι zu verstehen?
  choice: 'Als zweite von den Irrlehrern auferlegte Forderung: Sie verlangen den Verzicht auf Speisen.'
  alternative: 'Wörtlich-formal: „Sie verbieten zu heiraten und sich von Speisen zu enthalten“, was missverständlich so klingen kann, als würden sie auch die Enthaltung verbieten.'
  rationale: Der Zusammenhang macht deutlich, dass asketischer Speiseverzicht gefordert wird. Die Hauptfassung verdeutlicht diese syntaktisch vorausgesetzte Beziehung; die formale Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am Griechischen, während die elliptische Forderung nach Speiseverzicht zur Vermeidung eines falschen Verständnisses ausdrücklich gemacht wird.
