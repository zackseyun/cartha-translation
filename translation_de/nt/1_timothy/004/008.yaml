id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: de
  text: Denn körperliches Training[a] ist für kurze Zeit[b] nützlich; ein Leben in Ehrfurcht vor Gott dagegen ist in jeder Hinsicht nützlich, denn es hat die Verheißung des jetzigen und des künftigen Lebens.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „körperliche Übung“.
    reason: lexical_alternative
  - marker: b
    text: Oder „in begrenztem Maß“; der griechische Ausdruck kann eine begrenzte Dauer oder einen begrenzten Umfang bezeichnen.
    reason: lexical_ambiguity
  - marker: c
    text: 'Wörtlicher: „die eine Verheißung des jetzigen und des künftigen Lebens hat“.'
    reason: literal_rendering
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: körperliches Training
  rationale: Die Wiedergabe bewahrt sowohl den körperlichen Bezug von σωματική als auch den Gedanken eingeübter Disziplin in γυμνασία und klingt im heutigen Deutsch natürlich.
- source_word: πρὸς ὀλίγον
  choice: für kurze Zeit
  rationale: Die Formulierung gibt die wahrscheinlich zeitliche Begrenzung wieder, ohne den Nutzen körperlicher Übung zu verneinen. Die ebenfalls mögliche Bedeutung einer Begrenzung dem Umfang nach wird in einer Fußnote erhalten.
- source_word: ὠφέλιμος
  choice: nützlich
  rationale: „Nützlich“ ist klar, gegenwärtig und lässt sich in beiden Satzhälften einheitlich verwenden, ohne einen wirtschaftlichen Beiklang einzutragen.
- source_word: εὐσέβεια
  choice: ein Leben in Ehrfurcht vor Gott
  rationale: Die Wendung erfasst die auf Gott ausgerichtete Haltung und Lebensführung des Begriffs. Sie vermeidet das altertümliche „Gottseligkeit“ und die mögliche Verengung von „Frömmigkeit“ auf religiöse Formen.
- source_word: πρὸς πάντα
  choice: in jeder Hinsicht
  rationale: Diese natürliche deutsche Formulierung bewahrt den umfassenden Gegensatz zum begrenzten Nutzen körperlichen Trainings.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: denn es hat die Verheißung
  rationale: Der begründende Sinn des Partizips wird deutlich gemacht, während das Bild des Habens einer Verheißung eng am griechischen Ausdruck bleibt.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: des jetzigen und des künftigen Lebens
  rationale: Die Genitivkonstruktion und der Gegensatz zwischen gegenwärtigem und künftigem Leben bleiben erhalten; das im zweiten Glied ausgelassene ζωή wird im Deutschen sinngemäß mitverstanden.
theological_decisions:
- issue: Umfang des Nutzens körperlichen Trainings
  choice: Körperliches Training ist zeitlich begrenzt nützlich, im Gegensatz zum umfassenden Nutzen eines Lebens in Ehrfurcht vor Gott.
  alternative: Körperliches Training ist nur in begrenztem Maß nützlich.
  rationale: πρὸς ὀλίγον kann eine begrenzte Dauer oder einen begrenzten Umfang bezeichnen. Der Haupttext folgt der im Zusammenhang wahrscheinlichen zeitlichen Deutung, während die Fußnote die andere Möglichkeit offenhält. Der Satz spricht körperlichem Training seinen Wert nicht völlig ab.
- issue: Bedeutung von εὐσέβεια
  choice: Eine ehrfürchtige, auf Gott ausgerichtete Lebensführung.
  alternative: Frömmigkeit oder Gottesfurcht als knappe substantivische Wiedergabe.
  rationale: Die Übersetzung verbindet innere Ehrfurcht und sichtbare Lebensführung, ohne den Begriff auf bloßes Gefühl, religiöse Formen oder eine konfessionell geprägte Vorstellung festzulegen.
- issue: Verheißung des gegenwärtigen und künftigen Lebens
  choice: Die Genitivbeziehung wird formal offen als „Verheißung des ... Lebens“ wiedergegeben.
  alternative: Verheißung für das jetzige und künftige Leben.
  rationale: So wird weder genauer festgelegt, ob Leben selbst der Inhalt der Verheißung ist, noch auf welche Weise die Verheißung in beiden Zeithorizonten wirksam wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem griechischen Gegensatz eng verbunden, wird aber durch eine natürliche deutsche Nominalgruppe für εὐσέβεια verständlich gemacht. Archaische oder konfessionell stark besetzte Ausdrücke werden vermieden.
