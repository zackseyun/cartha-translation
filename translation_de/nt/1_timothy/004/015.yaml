  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: de
  text: Übe dich in diesen Dingen; widme dich ihnen ganz[a], damit dein Fortschritt für alle sichtbar wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sei in diesen Dingen.“ Die griechische Wendung drückt aus, dass Timotheus ganz in ihnen aufgehen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα μελέτα
  choice: Übe dich in diesen Dingen
  rationale: μελετάω kann sorgfältige Beschäftigung und eingeübte Praxis bezeichnen. Im Zusammenhang der vorangehenden Anweisungen gibt „übe dich“ die fortgesetzte, tätige Befassung wieder, ohne den Sinn auf bloßes Nachdenken zu verengen.
- source_word: ἐν τούτοις ἴσθι
  choice: widme dich ihnen ganz
  rationale: Die Wendung lautet wörtlich „sei in diesen Dingen“ und bezeichnet ein umfassendes persönliches Aufgehen in den genannten Aufgaben. Die idiomatische deutsche Wiedergabe bewahrt die Intensität; die wörtliche Form wird in der Fußnote genannt.
- source_word: ἵνα
  choice: damit
  rationale: Gibt den Zweck beziehungsweise die beabsichtigte Folge der Aufforderung natürlich wieder.
- source_word: προκοπή
  choice: Fortschritt
  rationale: Der Ausdruck bezeichnet ein Vorankommen oder eine Entwicklung. „Fortschritt“ lässt offen, ob besonders geistliche Reife, Lebensführung oder Dienst und Lehre im Blick stehen.
- source_word: φανερὰ ᾖ πᾶσιν
  choice: für alle sichtbar wird
  rationale: φανερός bezeichnet etwas, das offen erkennbar ist. „Sichtbar wird“ ist im modernen Deutsch klar und bringt den öffentlichen Charakter des Fortschritts zum Ausdruck.
theological_decisions:
- issue: Umfang von Timotheus’ erkennbarem Fortschritt
  choice: Der Fortschritt bleibt umfassend und schließt die zuvor genannten Aufgaben, Lebensführung und Lehre ein.
  alternative: Den Fortschritt ausschließlich als geistliches Wachstum oder ausschließlich als zunehmende Wirksamkeit im Dienst zu verstehen.
  rationale: Der griechische Ausdruck προκοπή legt keine solche Verengung fest, und der Zusammenhang umfasst sowohl persönliche als auch dienstliche Aspekte.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die beiden Imperative bleiben deutlich unterschieden: fortgesetztes Einüben und uneingeschränkte Hingabe. Die Formulierung vermeidet konfessionelle Zusätze und bewahrt die inhaltliche Weite von „Fortschritt“.'
