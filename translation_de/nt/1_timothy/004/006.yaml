id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: de
  text: Wenn du den Brüdern[a] diese Dinge vor Augen stellst, wirst du ein guter Diener des Messias Jesus[b] sein, genährt durch die Worte des Glaubens[c] und der guten Lehre, der du gefolgt bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier je nach Zusammenhang die Glaubenden insgesamt, einschließlich der Frauen, bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Christus Jesus“. Das griechische Χριστός bezeichnet den „Messias“.'
    reason: lexical_alternative
  - marker: c
    text: Der Ausdruck meint wahrscheinlich die anerkannten Inhalte des christlichen Glaubens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ὑποτιθέμενος
  choice: Wenn du … diese Dinge vor Augen stellst
  rationale: Das Partizip ὑποτιθέμενος bezeichnet hier, etwas vor andere hinzustellen beziehungsweise ihnen darzulegen. Die deutsche Wendung bewahrt das anschauliche Bild und gibt zugleich den konditionalen Zusammenhang mit dem Futur wieder.
- source_word: τοῖς ἀδελφοῖς
  choice: den Brüdern
  rationale: Die grammatisch maskuline Pluralform wird im Haupttext formal genau wiedergegeben; im frühchristlichen Sprachgebrauch kann sie die Glaubensgemeinschaft einschließlich Frauen bezeichnen, was die Fußnote erläutert.
- source_word: καλὸς … διάκονος
  choice: ein guter Diener
  rationale: καλός bewertet den Dienst positiv, während διάκονος hier eher eine dienende Funktion als eindeutig das kirchliche Amt eines Diakons bezeichnet.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός wird als bedeutungstragender Titel mit „Messias“ wiedergegeben; die im Deutschen traditionellere Form „Christus Jesus“ bleibt als Alternative in der Fußnote erhalten.
- source_word: ἐντρεφόμενος
  choice: genährt
  rationale: Das Partizip beschreibt Timotheus als jemanden, der fortlaufend durch die genannten Worte geprägt und ernährt wird. „Genährt“ erhält das Bild, ohne es auf bloße Schulung zu verengen.
- source_word: τοῖς λόγοις
  choice: durch die Worte
  rationale: Der Dativ kann das Mittel der Ernährung bezeichnen. „Worte“ wahrt die konkrete Ausdrucksweise von λόγοις, statt sie vorschnell mit „Lehren“ zu paraphrasieren.
- source_word: τῆς πίστεως
  choice: des Glaubens
  rationale: Durch Artikel und Zusammenhang kann πίστις hier den anerkannten Inhalt des christlichen Glaubens bezeichnen; die deutsche Form lässt zugleich einen weniger stark objektivierten Sinn zu.
- source_word: τῆς καλῆς διδασκαλίας
  choice: der guten Lehre
  rationale: „Gute Lehre“ gibt sowohl das wertende καλῆς als auch διδασκαλία knapp und würdig wieder, ohne das nicht ausdrücklich verwendete Konzept „gesund“ einzutragen.
- source_word: ᾗ παρηκολούθηκας
  choice: der du gefolgt bist
  rationale: Das feminine relative Pronomen bezieht sich grammatisch am unmittelbarsten auf „die gute Lehre“. Das Verb kann aufmerksames Verfolgen und treues Festhalten umfassen; „gefolgt bist“ bewahrt diese Weite.
theological_decisions:
- issue: Bedeutung und Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Wiedergabe „Messias“ macht den Titelgehalt von Χριστός sichtbar. Da „Christus Jesus“ im Deutschen etabliert ist und die Verbindung auch namensähnlich verstanden werden kann, wird diese Form als Alternative genannt.
- issue: Reichweite von τοῖς ἀδελφοῖς
  choice: den Brüdern
  alternative: den Geschwistern / den Brüdern und Schwestern
  rationale: Der Haupttext wahrt die maskuline Form des Griechischen. Zugleich kann die Anrede im Kontext alle Angehörigen der Gemeinde einschließen; diese mögliche inklusive Reichweite wird nicht stillschweigend entschieden, sondern angemerkt.
- issue: Sinn von πίστις
  choice: des Glaubens
  alternative: Worte des Glaubens ohne feste Bezugnahme auf einen anerkannten Glaubensinhalt
  rationale: Die Artikelform und die Verbindung mit der guten Lehre sprechen dafür, dass der überlieferte Glaubensinhalt gemeint ist. Die deutsche Genitivform bleibt jedoch offen genug, auch den allgemeineren Bezug zum Glauben mitzuhören.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch einen natürlichen deutschen Konditionalsatz erschlossen. Das Ernährungsbild und der eindeutige feminine Rückbezug auf „Lehre“ bleiben erhalten.
