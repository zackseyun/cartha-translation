id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: de
  text: Der Geist aber sagt ausdrücklich, dass in späteren Zeiten[a] einige vom Glauben abfallen[b], indem sie auf verführerische Geister[c] und Lehren von Dämonen[d] hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den letzten Zeiten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich vom Glauben abwenden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „irreführende“ oder „betrügerische Geister“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „dämonische Lehren“.'
    reason: genitive_ambiguity
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: der Geist
  rationale: Der Artikel und der paulinische Zusammenhang weisen am ehesten auf den Heiligen Geist. Die Großschreibung macht diesen Bezug im Deutschen sichtbar, ohne die Aussage im Vers auszubauen.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Übergang oder Kontrast. Das nachgestellte „aber“ bewahrt diese Funktion, ohne einen zeitlichen Sinn wie „nun“ einzutragen.
- source_word: ῥητῶς
  choice: ausdrücklich
  rationale: Das Adverb bezeichnet eine ausdrückliche, unmissverständliche Aussage; „ausdrücklich“ ist im modernen Deutsch präzise und geläufig.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens wird unmittelbar als „sagt“ wiedergegeben.
- source_word: ἐν ὑστέροις καιροῖς
  choice: in späteren Zeiten
  rationale: Die Wendung bezeichnet spätere Zeitabschnitte gegenüber der Gegenwart des Verfassers und muss nicht ausschließlich die allerletzte Endzeit meinen.
- source_word: ἀποστήσονταί
  choice: werden ... abfallen
  rationale: Das Verb bezeichnet Abwendung oder Abfall. „Vom Glauben abfallen“ bewahrt die kräftige Bildsprache, ohne eine weitergehende Lehrentscheidung über Art oder Endgültigkeit dieses Vorgangs zu treffen.
- source_word: τινες
  choice: einige
  rationale: Das unbestimmte Pluralpronomen wird idiomatisch und genau mit „einige“ wiedergegeben.
- source_word: τῆς πίστεως
  choice: vom Glauben
  rationale: Mit Artikel und in diesem Lehrzusammenhang bezeichnet πίστις am ehesten den christlichen Glauben beziehungsweise dessen Inhalt; die deutsche Formulierung lässt zugleich den Bezug auf persönliches Glauben mitschwingen.
- source_word: προσέχοντες
  choice: indem sie auf ... hören
  rationale: Das Partizip beschreibt, wodurch beziehungsweise auf welche Weise der Abfall geschieht. „Auf ... hören“ drückt hier nicht bloßes akustisches Hören, sondern Beachtung und Folgeleistung aus.
- source_word: πνεύμασι πλάνοις
  choice: verführerische Geister
  rationale: πλάνος bezeichnet hier Geister, die irreführen oder täuschen. „Verführerisch“ gibt ihre aktive, vom rechten Weg wegführende Wirkung natürlich wieder.
- source_word: διδασκαλίαις δαιμονίων
  choice: Lehren von Dämonen
  rationale: Die Formulierung bildet den griechischen Genitiv transparent nach und lässt offen, ob besonders Ursprung, Zugehörigkeit oder Charakterisierung der Lehren betont ist.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: der Heilige Geist
  alternative: ein prophetischer Geist oder der menschliche Geist
  rationale: Der bestimmte Ausdruck und die prophetische Sprechform im paulinischen Zusammenhang sprechen am stärksten für den Heiligen Geist. Der Text legt nicht fest, auf welche konkrete Weise diese Aussage mitgeteilt wurde.
- issue: Bedeutung von „dem Glauben“
  choice: der christliche Glaube als geglaubter Inhalt
  alternative: persönliches Vertrauen oder Glaubenstreue
  rationale: Artikelgebrauch und Kontext der falschen Lehren begünstigen den objektiven Sinn. Die Übersetzung vermeidet dennoch Aussagen darüber, wie dieser Abfall in ein bestimmtes theologisches System einzuordnen ist.
- issue: Verhältnis des Partizips προσέχοντες zum Hauptverb
  choice: 'begleitende Weise beziehungsweise Ursache: „indem sie ... hören“'
  alternative: 'rein zeitliche Begleithandlung: „während sie ... hören“'
  rationale: Das Partizip erklärt plausibel, wie es zum Abfall kommt, ohne eine strengere Kausalität zu behaupten, als der griechische Satz ausdrücklich markiert.
- issue: Genitiv in διδασκαλίαις δαιμονίων
  choice: „Lehren von Dämonen“, mit vorwiegendem Sinn des Ursprungs oder der Zuordnung
  alternative: „Lehren über Dämonen“
  rationale: Der Kontext mit verführerischen Geistern legt nahe, dass Dämonen Quelle oder Träger der Lehren sind; ein bloßer Inhaltsgenitiv ist weniger wahrscheinlich. Die knappe deutsche Wendung wahrt jedoch die grammatische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auf ... hören“ ist bewusst alltagssprachlich verständlich, trägt hier aber den ernsten Sinn von Beachtung und Gefolgschaft. Die Satzstellung mit „aber“ nach dem Subjekt bewahrt den milden Übergang des griechischen δέ.
