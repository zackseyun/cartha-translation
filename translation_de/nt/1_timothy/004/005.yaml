  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: de
  text: Denn es wird durch Gottes Wort und Gebet[a] geheiligt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürbitte“ oder „Bitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: wird geheiligt
  rationale: Das Präsens Passiv wird unmittelbar wiedergegeben. „Geheiligt“ bewahrt die biblische Heiligungssprache; der Zusammenhang zeigt, dass es um die zuvor erwähnte Speise geht, ohne die Aussage auf eine bestimmte theologische Deutung zu verengen.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die Aussage des vorherigen Verses; „denn“ gibt diese erklärende Funktion knapp und natürlich wieder.
- source_word: διὰ
  choice: durch
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „durch“ entspricht dieser instrumentalen Bedeutung.
- source_word: λόγου θεοῦ
  choice: Gottes Wort
  rationale: Die Genitivverbindung wird idiomatisch und zugleich eng am Griechischen wiedergegeben. Die Formulierung lässt offen, worauf „Gottes Wort“ hier im Einzelnen verweist.
- source_word: ἐντεύξεως
  choice: Gebet
  rationale: „Gebet“ ist im Zusammenhang des dankbaren Empfangs von Speise die natürliche Oberbezeichnung. Mögliche engere Bedeutungen wie „Fürbitte“ oder „Bitte“ werden in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang der Heiligung im Zusammenhang
  choice: Die Heiligungssprache wird mit „wird geheiligt“ bewahrt; der unmittelbare Zusammenhang bezieht sie auf die Speise.
  alternative: Expliziter als „wird für den Gebrauch ausgesondert“ oder allgemeiner als „wird heilig gemacht“ wiedergeben.
  rationale: Der griechische Text verwendet echte Heiligungssprache, erklärt aber nicht näher, wie sie dogmatisch einzuordnen ist. Eine direkte Wiedergabe erhält diese Spannung und vermeidet sowohl sakramentale als auch soteriologische Zusätze.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und folgt der begründenden Struktur des griechischen Textes.
