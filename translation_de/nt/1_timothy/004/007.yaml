id: 1TI.4.7
reference: 1 Timothy 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: de
  text: Unheilige und altweiberhafte Mythen[a] aber weise zurück. Trainiere dich vielmehr in der Gottesfurcht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mythen, wie sie für alte Frauen charakteristisch sind“. Die griechische Wendung ist abwertend; sinngemäß auch: „Altweibergeschichten“.'
    reason: Die Fußnote erklärt das kulturell geprägte Bild und nennt eine idiomatische deutsche Alternative, ohne die pejorative Kraft des Ausgangstextes zu verschweigen.
lexical_decisions:
- source_word: βεβήλους
  choice: unheilige
  rationale: Das Wort bezeichnet hier, im Gegensatz zum Heiligen, etwas Profanes oder religiös Unwürdiges. „Unheilig“ bewahrt diesen Gegensatz in verständlichem Deutsch.
- source_word: γραώδεις
  choice: altweiberhafte
  rationale: Das Adjektiv bedeutet wörtlich „für alte Frauen charakteristisch“ und ist deutlich abwertend. „Altweiberhaft“ erhält sowohl das konkrete Bild als auch dessen pejorative Schärfe, ohne es zu der allgemeineren Bedeutung „albern“ abzuschwächen.
- source_word: μύθους
  choice: Mythen
  rationale: Gemeint sind erfundene oder spekulative Erzählungen. „Mythen“ entspricht dem griechischen Ausdruck unmittelbar; „Fabeln“ könnte zu stark an eine bestimmte literarische Gattung denken lassen.
- source_word: παραιτοῦ
  choice: weise zurück
  rationale: Der Imperativ fordert Timotheus auf, solche Mythen abzulehnen und sich nicht auf sie einzulassen. „Weise zurück“ gibt diese entschiedene Aufforderung knapp wieder.
- source_word: γύμναζε
  choice: Trainiere
  rationale: Das Verb ruft das Bild körperlichen beziehungsweise athletischen Trainings hervor. „Trainiere“ macht diese Metapher im modernen Deutschen unmittelbar erkennbar.
- source_word: σεαυτόν
  choice: dich
  rationale: Das Reflexivpronomen bezeichnet Timotheus selbst als denjenigen, der trainiert werden soll.
- source_word: πρὸς εὐσέβειαν
  choice: in der Gottesfurcht
  rationale: εὐσέβεια bezeichnet in den Pastoralbriefen eine ehrfürchtige, auf Gott ausgerichtete Lebenshaltung. „Gottesfurcht“ gibt diese Ausrichtung wieder; die Verbindung mit „trainieren“ bezeichnet das angestrebte Einüben dieser Haltung.
- source_word: δὲ … δὲ
  choice: aber … vielmehr
  rationale: Das erste δέ setzt die Aufforderung vom vorherigen Zusammenhang ab. Das zweite stellt der Ablehnung der Mythen die positive Aufgabe gegenüber; „vielmehr“ macht diesen Gegensatz natürlich deutlich.
theological_decisions:
- issue: Wiedergabe der abwertenden Wendung γραώδεις μύθους
  choice: „altweiberhafte Mythen“ im Haupttext mit erläuternder Fußnote
  alternative: „Altweibergeschichten“ oder „alberne Mythen“
  rationale: Die griechische Formulierung ist kulturell geprägt und ausdrücklich pejorativ. „Alberne Mythen“ würde das konkrete Bild einebnen; „Altweibergeschichten“ wäre idiomatischer, verschiebt aber die Formulierung stärker. Der Haupttext bewahrt deshalb die Bildlichkeit und Schärfe, während die Fußnote beides transparent erklärt.
- issue: Bedeutungsumfang von εὐσέβεια
  choice: „Gottesfurcht“
  alternative: „Frömmigkeit“ oder „gottesfürchtiges Leben“
  rationale: „Gottesfurcht“ bezeichnet eine ehrfürchtige, an Gott orientierte Haltung und vermeidet, εὐσέβεια auf äußere religiöse Übungen zu verengen. Zugleich bleibt offen, dass diese Haltung das gesamte Leben prägt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Trainiere“ bewahrt bewusst die athletische Metapher. Das ungebräuchliche und abwertende „altweiberhaft“ ist quelltextbedingt und wird deshalb durch eine Fußnote erläutert.
