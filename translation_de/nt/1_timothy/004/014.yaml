id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: de
  text: Vernachlässige nicht die Gabe, die in dir ist und die dir durch Prophetie[a] unter Handauflegung durch die Ältestenschaft[b] gegeben wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch einen prophetischen Ausspruch“. Der Ausdruck kann bedeuten, dass prophetisches Reden die Gabe begleitete oder bei ihrer Verleihung vermittelnd wirkte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Ältestenrat“ beziehungsweise „das Kollegium der Ältesten“. Gemeint ist die Gesamtheit einer Gruppe von Ältesten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Vernachlässige nicht
  rationale: Die Verbindung aus μή und Präsensimperativ formuliert eine fortdauernd geltende Aufforderung. „Vernachlässige nicht“ ist natürlich und gibt das mangelnde Beachten oder Nutzen einer anvertrauten Gabe präzise wieder.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: die Gabe, die in dir ist
  rationale: Die ausdrückliche Lokalisierung mit ἐν σοὶ bleibt erhalten; „Gabe“ gibt χάρισμα wieder, ohne das im Griechischen nicht ausgedrückte Adjektiv „geistlich“ hinzuzufügen.
- source_word: ἐδόθη σοι
  choice: dir … gegeben wurde
  rationale: Die Passivform wird direkt wiedergegeben, ohne den im Satz nicht genannten Geber ausdrücklich zu bestimmen.
- source_word: διὰ προφητείας
  choice: durch Prophetie
  rationale: διά mit Genitiv bezeichnet hier wahrscheinlich Vermittlung oder Mittel. „Durch Prophetie“ bewahrt zugleich die mögliche Bedeutung eines prophetischen Ausspruchs.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: unter Handauflegung
  rationale: „Handauflegung“ ist die natürliche deutsche Bezeichnung für den beschriebenen Vorgang und gibt den griechischen Ausdruck prägnant wieder.
- source_word: τοῦ πρεσβυτερίου
  choice: durch die Ältestenschaft
  rationale: πρεσβυτέριον bezeichnet hier das Kollegium beziehungsweise die Gesamtheit der Ältesten. „Ältestenschaft“ wahrt den kollektiven Sinn, ohne eine spätere konfessionelle Leitungsordnung vorauszusetzen. Das wiederholte „durch“ macht im Deutschen deutlich, wessen Hände aufgelegt wurden.
theological_decisions:
- issue: Ob χάρισμα ausdrücklich als geistliche oder amtliche Gabe bezeichnet werden soll
  choice: Gabe
  alternative: geistliche Gabe; Gnadengabe
  rationale: Der Zusammenhang legt eine zum Dienst befähigende Gnadengabe nahe, doch der griechische Wortlaut enthält keine entsprechende nähere Bestimmung. Die schlichte Wiedergabe lässt diese Offenheit bestehen.
- issue: Verhältnis von Prophetie und Verleihung der Gabe
  choice: durch Prophetie
  alternative: unter prophetischer Zusage; durch einen prophetischen Ausspruch
  rationale: Die Präposition kann eine vermittelnde Funktion ausdrücken; der Satz lässt jedoch offen, wie genau Prophetie und Gabe zusammenhängen. Die Übersetzung legt nicht fest, ob die Prophetie die Gabe vermittelte, ankündigte oder ihre Verleihung begleitete.
- issue: Kirchenordnende Bedeutung von πρεσβυτέριον
  choice: Ältestenschaft
  alternative: Ältestenrat; Kollegium der Ältesten; Presbyterium
  rationale: Gemeint ist eine Gruppe von Ältesten. „Ältestenschaft“ bewahrt diesen kollektiven Sinn, ohne eine bestimmte spätere Konfessions- oder Verfassungsform in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch die Relativsatzverknüpfung und die idiomatische Wendung „unter Handauflegung“ natürlich lesbar. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
