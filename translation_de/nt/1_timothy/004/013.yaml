  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: de
  text: Bis ich komme, widme dich dem Vorlesen[a], dem Ermahnen und dem Lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet schlicht „Lesen“ oder „Vorlesen“. Im Zusammenhang ist wahrscheinlich das öffentliche Vorlesen der Heiligen Schrift in der Gemeinde gemeint; „öffentlich“ und „Heilige Schrift“ stehen jedoch nicht ausdrücklich im griechischen Text.
    reason: lexikalische Alternative und kontextuelle Präzisierung
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Bis ich komme
  rationale: Die Wendung bezeichnet den Zeitraum bis zur erwarteten Ankunft des Paulus. Das griechische Präsens hat hier zukunftsbezogenen Sinn.
- source_word: πρόσεχε
  choice: widme dich
  rationale: Der Imperativ fordert anhaltende Aufmerksamkeit und Hingabe, nicht nur ein gelegentliches Beachten.
- source_word: τῇ ἀναγνώσει
  choice: dem öffentlichen Vorlesen
  rationale: ἀνάγνωσις bedeutet wörtlich Lesen oder Vorlesen. Im gemeindlichen Zusammenhang ist sehr wahrscheinlich das öffentliche Vorlesen in der Versammlung gemeint; der Gegenstand des Vorlesens wird im Griechischen jedoch nicht ausdrücklich genannt.
- source_word: τῇ παρακλήσει
  choice: dem Ermahnen
  rationale: παράκλησις kann Ermahnung, Zuspruch oder Ermutigung bezeichnen. In der Reihe von Aufgaben des Gemeindedienstes gibt „Ermahnen“ den auffordernden seelsorgerlichen Sinn gut wieder, ohne die mögliche ermutigende Nuance auszuschließen.
- source_word: τῇ διδασκαλίᾳ
  choice: dem Lehren
  rationale: διδασκαλία bezeichnet hier das Lehren beziehungsweise die Unterweisung. Die Tätigkeitsbezeichnung „Lehren“ passt zur parallelen Formulierung und vermeidet eine Verengung auf ein festes Lehrsystem.
theological_decisions:
- issue: Ob ἀνάγνωσις im Haupttext ausdrücklich als Schriftlesung bezeichnet werden soll
  choice: dem öffentlichen Vorlesen
  alternative: dem Vorlesen der Schrift; dem Vorlesen
  rationale: Der Zusammenhang legt das öffentliche Vorlesen der Heiligen Schrift in der Gemeinde nahe. Da der griechische Text weder „öffentlich“ noch „Schrift“ ausdrücklich nennt, macht der Haupttext nur den wahrscheinlich gemeindlichen Rahmen deutlich; die wörtlichere und die ausdrücklich schriftbezogene Wiedergabe bleiben in der Fußnote sichtbar.
- issue: Bedeutung von παράκλησις
  choice: dem Ermahnen
  alternative: dem Ermutigen; dem Zusprechen
  rationale: Das Wort umfasst sowohl auffordernde Ermahnung als auch stärkenden Zuspruch. „Ermahnen“ passt in diesem Dienstauftrag am besten, soll aber die weitere Bedeutungsbreite nicht dogmatisch ausschließen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallelen substantivierten Verben „Vorlesen“, „Ermahnen“ und „Lehren“ spiegeln die drei gleichgeordneten griechischen Dative und bezeichnen fortlaufende Tätigkeiten.
