id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: de
  text: Niemand soll dich wegen deiner Jugend geringschätzen. Sei vielmehr den Gläubigen ein Vorbild im Reden, im Verhalten, in der Liebe, im Glauben[a] und in der Reinheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Treue“. Das griechische Wort kann in diesem Zusammenhang sowohl Glauben als auch Treue bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς … καταφρονείτω
  choice: Niemand soll … geringschätzen
  rationale: Die Konstruktion mit dem Imperativ der dritten Person wird im modernen Deutschen natürlich als Aufforderung mit „soll“ wiedergegeben. „Geringschätzen“ erfasst das verächtliche Herabsehen, ohne unnötig scharf zu formulieren.
- source_word: σου τῆς νεότητος
  choice: dich wegen deiner Jugend
  rationale: Der Genitiv bezeichnet den Grund, aus dem Timotheus geringgeschätzt werden könnte. Die deutsche Konstruktion mit „wegen“ macht diesen Bezug klar und idiomatisch.
- source_word: ἀλλὰ
  choice: vielmehr
  rationale: „Vielmehr“ bringt den nachdrücklichen Gegensatz zwischen fremder Geringschätzung und dem geforderten vorbildlichen Leben prägnant zum Ausdruck.
- source_word: τύπος γίνου
  choice: Sei … ein Vorbild
  rationale: τύπος bezeichnet hier ein nachahmenswertes Beispiel. Der Imperativ „Sei“ ist im Deutschen natürlicher als „Werde“, ohne den Aufforderungscharakter abzuschwächen.
- source_word: τῶν πιστῶν
  choice: den Gläubigen
  rationale: Der Genitiv bezeichnet hier am wahrscheinlichsten die Menschen, denen Timotheus als Vorbild dienen soll. Der deutsche Dativ nach „Vorbild sein“ gibt diese Beziehung natürlich wieder.
- source_word: ἐν λόγῳ
  choice: im Reden
  rationale: λόγος bezeichnet in dieser Aufzählung die Art und Weise des Sprechens. „Im Reden“ ist verständlich und fügt sich parallel in die Reihe ein.
- source_word: ἐν ἀναστροφῇ
  choice: im Verhalten
  rationale: ἀναστροφή bezeichnet die Lebensführung oder das Verhalten. „Verhalten“ ist eine klare, moderne und nicht unnötig eingeengte Wiedergabe.
- source_word: ἐν ἀγάπῃ
  choice: in der Liebe
  rationale: Die direkte Wiedergabe bewahrt den umfassenden ethischen und theologischen Gehalt von ἀγάπη.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: πίστις kann hier sowohl Glauben als auch Treue bezeichnen. „Glauben“ wahrt die geläufige Grundbedeutung; die echte kontextuelle Alternative wird in einer Fußnote erhalten.
- source_word: ἐν ἁγνείᾳ
  choice: in der Reinheit
  rationale: ἁγνεία bezeichnet moralische, möglicherweise auch sexuelle Reinheit. Die breite Wiedergabe „Reinheit“ vermeidet eine nicht ausdrücklich festgelegte Verengung.
theological_decisions:
- issue: Bedeutung von πίστις innerhalb der Tugendaufzählung
  choice: Glauben
  alternative: Treue
  rationale: Der Zusammenhang lässt sowohl das Vertrauen beziehungsweise den Glauben als auch verlässliche Treue zu. Der Haupttext verwendet die grundlegende Wiedergabe „Glauben“, während die Fußnote die alternative Deutung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fünf mit ἐν eingeleiteten Bereiche werden durch parallele Präpositionalgruppen wiedergegeben; vor dem letzten Glied steht der natürlichen deutschen Reihung entsprechend „und“. Der Fußnotenmarker steht unmittelbar bei „Glauben“, auf das die Anmerkung sachlich Bezug nimmt.
