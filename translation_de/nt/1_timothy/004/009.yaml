lexical_decisions:
- source_word: πιστὸς
  choice: zuverlässig
  rationale: Im prädikativen Ausdruck πιστὸς ὁ λόγος bezeichnet das Adjektiv die Aussage als verlässlich und glaubwürdig. „Zuverlässig“ ist im modernen Deutsch natürlich und bewahrt diesen Sinn.
- source_word: ὁ λόγος
  choice: dieses Wort
  rationale: λόγος bezeichnet hier eine bestimmte Aussage. „Dieses Wort“ erhält die im Deutschen geläufige biblische Formel, ohne den Ausdruck auf ein einzelnes Vokabelwort zu verengen; die sachlich mögliche Wiedergabe „diese Aussage“ wird in der Fußnote genannt.
- source_word: πάσης
  choice: volle
  rationale: In πάσης ἀποδοχῆς drückt πάσης die Vollständigkeit der Zustimmung aus. „Volle“ gibt diese Totalität idiomatisch wieder.
- source_word: ἀποδοχῆς
  choice: Zustimmung
  rationale: ἀποδοχή meint Annahme beziehungsweise willkommen heißende Zustimmung. „Zustimmung“ ist in dieser deutschen Verbindung klar und natürlich; „Annahme“ bleibt als lexikalische Alternative möglich.
- source_word: ἄξιος
  choice: verdient
  rationale: ἄξιος mit dem Genitiv bezeichnet, dass etwas einer Sache würdig ist. Die verbale Wiedergabe „verdient volle Zustimmung“ klingt im heutigen Deutsch natürlicher als „ist voller Zustimmung würdig“ und bewahrt den Sinn.
