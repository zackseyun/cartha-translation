  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: de
  text: Ordne dies an und lehre es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weise dazu an und lehre es.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: Ordne … an
  rationale: Das Präsens Aktiv Imperativ, 2. Person Singular, fordert zu fortgesetztem autoritativem Anweisen auf. „Anordnen“ wahrt die direktive Kraft, ohne zusätzliche kirchenamtliche Vorstellungen einzutragen.
- source_word: ταῦτα
  choice: dies
  rationale: Das substantivisch gebrauchte neutrale Pluraldemonstrativ verweist auf die zuvor genannten Lehren und Anweisungen. Im natürlichen Deutschen fasst „dies“ den betreffenden Sachkomplex idiomatisch zusammen; die Alternative „diese Dinge“ bildet die griechische Mehrzahl formaler ab.
- source_word: καὶ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden Imperative unmittelbar.
- source_word: δίδασκε
  choice: lehre es
  rationale: Der Präsensimperativ bezeichnet fortgesetztes Lehren. Das Pronomen nimmt den mit ταῦτα bezeichneten Inhalt auf und ergibt im Deutschen einen natürlichen Satz.
theological_decisions:
- issue: Die in παραγγέλλω ausgedrückte Autorität
  choice: Mit der direktiven Formulierung „Ordne dies an“ wiedergeben.
  alternative: „Weise dazu an“ oder schwächer „Unterweise darin“.
  rationale: Das Verb bezeichnet hier nicht bloß einen Rat, sondern eine verbindliche Anweisung. Die Übersetzung erhält diese Kraft, ohne daraus weitergehende Aussagen über ein kirchliches Amt abzuleiten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Parallelstruktur der beiden griechischen Präsensimperative bleibt erhalten; deren fortdauernder Aspekt wird im Deutschen kontextuell vermittelt.
