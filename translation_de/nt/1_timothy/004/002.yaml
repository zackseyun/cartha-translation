  terminology: „Heuchelei“, „Lügner“ und „eigenes Gewissen“ sind treffend. Als Haupttext ist „gebrandmarkt“ eine etablierte deutsche Wiedergabe des Brennbilds; die Fußnote muss die mögliche Deutung als Kauterisierung bzw. moralische Unempfindlichkeit bieten, ohne diese zur alleinigen Aussage zu machen.
