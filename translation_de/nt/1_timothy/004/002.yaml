translation:
  language: de
  text: durch die Heuchelei von Lügnern, die in ihrem eigenen Gewissen gebrandmarkt sind,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren eigenes Gewissen wie durch Kauterisieren unempfindlich geworden ist“. Das griechische Bild kann sowohl ein Brandmal als auch eine durch Ausbrennen bewirkte Unempfindlichkeit des Gewissens andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: durch
  rationale: Die Präposition bezeichnet hier im Zusammenhang mit dem vorausgehenden Satz am ehesten das Mittel bzw. die vermittelnde Ursache. „Durch“ ist im Deutschen natürlich und wahrt diesen instrumentalen Sinn.
- source_word: ὑποκρίσει
  choice: Heuchelei
  rationale: Das Wort bezeichnet ein heuchlerisches Auftreten oder Vortäuschen. „Heuchelei“ ist die direkte, geläufige und dem moralischen Zusammenhang angemessene Wiedergabe.
- source_word: ψευδολόγων
  choice: von Lügnern
  rationale: Der Genitiv gehört am natürlichsten zu „Heuchelei“. „Lügner“ gibt knapp wieder, dass diese Menschen durch falsches Reden gekennzeichnet sind.
- source_word: κεκαυστηριασμένων
  choice: versengt ist
  rationale: Das Perfektpartizip beschreibt einen durch Brennen herbeigeführten, fortbestehenden Zustand. „Versengt“ bewahrt das Bild, ohne zwischen Brandmarkung und Kauterisierung endgültig zu entscheiden; als Relativsatz klingt es im Deutschen natürlich.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: deren eigenes Gewissen
  rationale: Der griechische Singular wird beibehalten und distributiv auf die genannten Lügner bezogen. „Eigenes“ erhält die ausdrückliche rückbezügliche Betonung.
theological_decisions:
- issue: Bildgehalt von κεκαυστηριασμένων
  choice: „versengt“ als bewusst offenes Brennbild
  alternative: „in ihrem eigenen Gewissen gebrandmarkt“ oder „in ihrem eigenen Gewissen ausgebrannt/unempfindlich gemacht“
  rationale: Das griechische Bild kann an Brandmarkung oder Kauterisierung und damit möglicherweise an Kennzeichnung oder Gefühllosigkeit denken lassen. Die Übersetzung soll weder unumkehrbare Verwerfung behaupten noch eine einzige Bilddeutung festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt als Satzteil eng an den vorausgehenden Verszusammenhang anschließbar; das drastische griechische Brennbild und seine Mehrdeutigkeit werden erhalten.
