base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: de
  text: Denn alles, was Gott geschaffen hat, ist gut[a], und nichts ist zurückzuweisen, wenn es mit Dank angenommen wird[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jedes Geschöpf Gottes ist gut.“ Das griechische Wort kann ein Geschöpf oder allgemeiner etwas Geschaffenes bezeichnen.'
