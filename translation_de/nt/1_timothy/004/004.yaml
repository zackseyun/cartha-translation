    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorhergehende Aussage; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: πᾶν κτίσμα θεοῦ
  choice: alles, was Gott geschaffen hat
  rationale: Die Formulierung gibt das distributive πᾶν mit dem Singular κτίσμα idiomatisch und umfassend wieder. Sie bezeichnet alles von Gott Geschaffene, ohne den Ausdruck auf Tiere oder unmittelbar auf Speisen zu verengen.
- source_word: καλόν
  choice: gut
  rationale: „Gut“ entspricht dem üblichen Sinn und bewahrt den Anklang an die biblische Schöpfungssprache.
- source_word: οὐδὲν ἀπόβλητον
  choice: nichts ist zurückzuweisen
  rationale: Das prädikative Adjektiv ἀπόβλητον bezeichnet etwas, das verworfen oder abgelehnt werden kann beziehungsweise soll. „Zurückzuweisen“ ist im Zusammenhang mit dem Annehmen von Speisen natürlich und erhält die normative Aussage.
- source_word: μετὰ εὐχαριστίας
  choice: mit Dank
  rationale: Die knappe Wendung bezeichnet dankbares Annehmen und bewahrt den ausdrücklichen Gedanken des Dankes.
- source_word: λαμβανόμενον
  choice: wenn es … angenommen wird
  rationale: Das passive Partizip wird als konditionale beziehungsweise umstandsbezeichnende Nebensatzkonstruktion wiedergegeben. Der Bezug auf das Geschaffene bleibt erhalten.
theological_decisions:
- issue: Reichweite von κτίσμα im Zusammenhang mit Speiseverboten
  choice: alles, was Gott geschaffen hat
  alternative: jedes Geschöpf Gottes; alle von Gott geschaffenen Speisen
  rationale: Der unmittelbare Zusammenhang betrifft Speisen, doch κτίσμα ist sprachlich weiter. Die Übersetzung erhält das umfassende Schöpfungsargument und engt es nicht durch eine erklärende Paraphrase ein.
- issue: Bedeutung des Partizips λαμβανόμενον
  choice: wenn es mit Dank angenommen wird
  alternative: sofern es mit Dank angenommen wird; indem es mit Dank angenommen wird
  rationale: „Wenn“ macht den sachlichen Zusammenhang zwischen Nicht-Zurückweisung und dankbarem Empfang verständlich, ohne eine stärkere dogmatische Bedingung zu formulieren, als die Partizipialkonstruktion trägt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die breite Aussage über Gottes Schöpfung bleibt erhalten; zugleich passt „zurückzuweisen“ natürlich zum unmittelbaren Zusammenhang des Empfangens. Das abschließende Komma wahrt den syntaktischen Anschluss an Vers 5.
