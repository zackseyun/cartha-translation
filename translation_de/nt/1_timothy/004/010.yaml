reference: 1 Timothy 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: de
  text: Denn dafür mühen wir uns ab und werden beschimpft[a], weil wir unsere Hoffnung auf den lebendigen Gott gesetzt haben[b], der der Retter aller Menschen ist, besonders der Gläubigen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mühen wir uns ab und werden geschmäht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil wir auf den lebendigen Gott gehofft haben“.'
    reason: lexical_alternative
  - marker: c
    text: Die Formulierung „Retter aller Menschen, besonders der Gläubigen“ ist entsprechend dem Wortlaut wiedergegeben. Umstritten ist, ob „Retter“ hier Gottes bewahrende Fürsorge für alle, sein Rettungsangebot für alle oder die besonders an den Gläubigen wirksame Rettung betont.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dafür
  rationale: Die Wendung verweist auf das zuvor genannte Ziel. „Dafür“ gibt diesen Zweckbezug im modernen Deutschen knapp und natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: γάρ begründet oder erläutert die vorherige Aussage; „denn“ bewahrt diese Verknüpfung.
- source_word: κοπιῶμεν
  choice: wir mühen uns ab
  rationale: κοπιάω bezeichnet anstrengende, ermüdende Arbeit. „Sich abmühen“ bringt diese Intensität deutlicher zum Ausdruck als das allgemeinere „arbeiten“.
- source_word: ὀνειδιζόμεθα
  choice: wir werden beschimpft
  rationale: Das Passiv bezeichnet erlittene Schmähung oder verbale Herabsetzung. „Beschimpft“ ist verständlich und gibt den öffentlichen Tadel beziehungsweise Spott angemessen wieder.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: wir haben unsere Hoffnung auf … gesetzt
  rationale: Das Perfekt beschreibt eine vollzogene Ausrichtung mit fortdauerndem Ergebnis. Die deutsche Formulierung vermittelt sowohl den gesetzten Entschluss als auch die bleibende Hoffnung.
- source_word: θεῷ ζῶντι
  choice: den lebendigen Gott
  rationale: Die geläufige biblische Wendung gibt das attributive Partizip prägnant und würdig wieder.
- source_word: σωτὴρ
  choice: Retter
  rationale: σωτήρ kann einen Retter, Befreier oder Bewahrer bezeichnen. „Retter“ bewahrt die theologische Tragweite, ohne die Art des Rettens an dieser Stelle näher festzulegen.
- source_word: πάντων ἀνθρώπων
  choice: aller Menschen
  rationale: ἄνθρωποι bezeichnet hier die Menschen insgesamt. „Aller Menschen“ ist inklusiv, präzise und natürlich.
- source_word: μάλιστα
  choice: besonders
  rationale: „Besonders“ gibt die gewöhnliche steigernde Bedeutung wieder und bewahrt die Spannung zwischen „allen Menschen“ und „den Gläubigen“, ohne sie auszulegen.
- source_word: πιστῶν
  choice: der Gläubigen
  rationale: Im Kontext bezeichnet πιστῶν Menschen, die glauben. „Der Gläubigen“ ist die klare und im Deutschen etablierte Wiedergabe.
theological_decisions:
- issue: Bedeutung von „Retter aller Menschen, besonders der Gläubigen“
  choice: Die umfassende Aussage und die besondere Zuordnung zu den Gläubigen werden beide unverändert beibehalten.
  alternative: „Retter“ als Bewahrer aller Menschen und als Erlöser der Gläubigen zu differenzieren; eine universale Endrettung auszusagen; oder „alle Menschen“ als „Menschen aller Art“ einzuengen.
  rationale: Der griechische Text verbindet ausdrücklich die universale Formulierung πάντων ἀνθρώπων mit der Hervorhebung μάλιστα πιστῶν. Die Übersetzung bewahrt diese theologische Spannung und entscheidet nicht zwischen den verschiedenen Deutungen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Sich abmühen“ wahrt die Intensität des griechischen Verbs; „beschimpft“ vermeidet unnötig altertümliche Sprache. Die Syntax bleibt eng am griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken.
