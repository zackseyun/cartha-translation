source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: de
  text: Achte sorgfältig auf dich selbst und auf die Lehre. Bleibe beharrlich bei beidem.[a] Denn wenn du das tust, wirst du sowohl dich selbst retten als auch die, die dir zuhören.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Bleibe in ihnen“; gemeint ist das beharrliche Festhalten an den zuvor genannten Anliegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bewahren“. Das griechische Wort kann je nach Zusammenhang Rettung, Bewahrung oder ein sicheres Hindurchbringen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Achte sorgfältig auf
  rationale: Der Imperativ fordert anhaltende, wachsame Aufmerksamkeit. „Achte sorgfältig auf“ ist modernes, natürliches Deutsch und gibt mehr als einen flüchtigen Blick wieder.
- source_word: σεαυτῷ
  choice: dich selbst
  rationale: Das reflexive Dativobjekt bezeichnet hier den Gegenstand der Aufmerksamkeit; nach „achten auf“ verlangt das Deutsche den Akkusativ.
- source_word: τῇ διδασκαλίᾳ
  choice: die Lehre
  rationale: διδασκαλία kann den Vorgang oder den Inhalt des Lehrens bezeichnen. Im Zusammenhang steht der vermittelte Lehrinhalt im Vordergrund; „Lehre“ ist prägnant, verständlich und weniger fachsprachlich als „Doktrin“.
- source_word: ἐπίμενε αὐτοῖς
  choice: Bleibe beharrlich bei beidem
  rationale: ἐπίμενε bezeichnet standhaftes, fortgesetztes Verweilen. Das plurale αὐτοῖς greift die zuvor genannten Anliegen auf; „bei beidem“ macht diesen Rückbezug im Deutschen verständlich, ohne ihn auf nur eines davon einzuengen.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Denn wenn du das tust
  rationale: Das Partizip bezeichnet das fortgesetzte Tun als begleitende Bedingung beziehungsweise Mittel. Die deutsche Konditionalkonstruktion ist natürlich und erhält den argumentativen Anschluss durch „Denn“.
- source_word: σώσεις
  choice: wirst du … retten
  rationale: σῴζω bedeutet grundsätzlich „retten“. Die theologische Aussagekraft wird nicht zu bloßem Bewahren abgeschwächt; zugleich legt die Übersetzung nicht fest, in welchem umfassenden Sinn die Rettung hier gemeint ist.
- source_word: τοὺς ἀκούοντάς σου
  choice: die, die dir zuhören
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die Timotheus fortlaufend hören. „Dir zuhören“ gibt den Hörvorgang wieder, ohne bereits Gehorsam als Bedeutung festzuschreiben.
theological_decisions:
- issue: Bedeutung von σώσεις in der pastoralen Ermahnung
  choice: „retten“ im Haupttext beibehalten
  alternative: „bewahren“ oder „sicher hindurchbringen“
  rationale: Der Wortlaut verbindet das beharrliche Achten auf Lebensführung und Lehre mit der Rettung des Lehrenden und der Hörenden. „Retten“ bewahrt das theologische Gewicht, ohne die Aussage entweder auf zeitliches Bewahren oder ausschließlich auf endzeitliche Rettung zu verengen. Der Text erklärt hier auch nicht, Timotheus bewirke Rettung aus eigener Kraft; diese Spannung bleibt erhalten.
- issue: Bezug des pluralen αὐτοῖς
  choice: Rückbezug auf die beiden zuvor genannten Anliegen durch „bei beidem“
  alternative: „darin“, „dabei“ oder wörtlicher „in ihnen“
  rationale: Das Neutrum Plural fasst am ehesten die Selbstaufmerksamkeit und die Lehre als gemeinsam zu verfolgende Anliegen zusammen. Die Formulierung vermeidet einen künstlich wörtlichen Ausdruck und lässt dennoch erkennen, dass beide Aspekte gemeint sind.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Kurze Hauptsätze bewahren den eindringlichen Charakter der Ermahnung. „Lehre“ und „retten“ erhalten die sachliche und theologische Dichte des griechischen Textes, während die Fußnoten echte lexikalische Spielräume offenlegen.
