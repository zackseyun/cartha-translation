base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: de
  text: Einige, die sich zu ihr bekannten, haben im Blick auf den Glauben das Ziel verfehlt.[a] Die Gnade sei mit euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Einige, die den Anspruch darauf erhoben, sind hinsichtlich des Glaubens vom Weg abgekommen.“ Das griechische Verb kann sowohl „das Ziel verfehlen“ als auch „abweichen“ oder „irren“ bedeuten. Mit „dem Glauben“ ist hier wahrscheinlich der christliche Glaube als Glaubensinhalt gemeint; auch ein allgemeinerer Bezug auf persönlichen Glauben ist möglich.'
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: Das griechische „euch“ steht im Plural.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἥν
  choice: ihr
  rationale: Das feminine Relativpronomen verweist auf die unmittelbar zuvor genannte, fälschlich so bezeichnete Erkenntnis. Die deutsche Formulierung mit dem rückbezüglichen Pronomen „ihr“ erhält diesen Bezug natürlich.
- source_word: ἐπαγγελλόμενοι
  choice: sich zu ihr bekannten
  rationale: Das Medium bezeichnet hier, dass einige beanspruchten oder bekannten, diese sogenannte Erkenntnis zu besitzen; „sich zu ihr bekannten“ gibt diesen Anspruch im Kontext verständlich wieder.
- source_word: περὶ τὴν πίστιν
  choice: im Blick auf den Glauben
  rationale: περί mit Akkusativ bezeichnet hier den Bezugsbereich. Die Formulierung bleibt idiomatisch und wahrt, dass es um ihr Verhältnis zum Glauben geht.
- source_word: πίστιν
  choice: Glauben
  rationale: „Glauben“ entspricht dem üblichen Bedeutungsbereich von πίστις. Der Kontext legt den christlichen Glauben als Glaubensinhalt nahe, ohne die mögliche persönliche Dimension im Haupttext auszuschließen.
- source_word: ἠστόχησαν
  choice: haben … das Ziel verfehlt
  rationale: Die Wendung bewahrt das Zielbild von ἀστοχέω und klingt zugleich in modernem Deutsch natürlich.
- source_word: Ἡ χάρις
  choice: Die Gnade
  rationale: Die paulinische Schlussformel wird würdig und nah an der griechischen Form mit Artikel wiedergegeben.
- source_word: μεθ’ ὑμῶν
  choice: sei mit euch
  rationale: Das im Griechischen ausgelassene Verb wird für einen vollständigen deutschen Segenswunsch ergänzt; „euch“ bewahrt ausdrücklich den Plural.
theological_decisions:
- issue: Bedeutung von „der Glaube“
  choice: Vorrangig der christliche Glaube als Glaubenswirklichkeit und -inhalt
  alternative: Persönliches Vertrauen beziehungsweise individueller Glaube
  rationale: Der unmittelbare Zusammenhang mit der fälschlich so genannten Erkenntnis und der Sprachgebrauch der Pastoralbriefe sprechen für einen objektiveren Bezug. Die Übersetzung „der Glaube“ lässt die weiter gefasste Bedeutung dennoch offen.
- issue: Adressaten des Schlusssegens
  choice: Plural „euch“ beibehalten
  alternative: Singular „dir“ als ausschließlicher Bezug auf Timotheus
  rationale: Der griechische Text hat ὑμῶν im Plural. Dies kann den Segen über Timotheus hinaus auf die mit ihm verbundene Gemeinde ausweiten und darf nicht stillschweigend singularisiert werden.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Zielmetapher des griechischen Verbs bleibt erhalten; der Schlusssegen folgt bewusst dem griechischen Plural.
