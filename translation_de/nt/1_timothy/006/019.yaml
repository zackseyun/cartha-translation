id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: de
  text: und sich so selbst einen guten Grundstock für die Zukunft ansammeln, damit sie das Leben ergreifen, das wirklich Leben ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: sich … schaffen
  rationale: Das Partizip führt die Ermahnung des vorigen Verses fort. In Verbindung mit „Grundlage“ ergibt „sich eine Grundlage schaffen“ im Deutschen ein natürliches Bild, ohne den Gedanken des Ansammelns aufzugeben.
- source_word: ἑαυτοῖς
  choice: sich selbst
  rationale: Das reflexive Dativpronomen bezeichnet den Nutzen für die Handelnden; „sich selbst“ gibt dies klar wieder.
- source_word: θεμέλιον καλὸν
  choice: eine gute Grundlage
  rationale: „Grundlage“ bewahrt das Bild von θεμέλιον und klingt im modernen Deutschen natürlicher als „Fundament“ in Verbindung mit dem vorausgehenden Schatzbild. καλόν wird schlicht und angemessen mit „gut“ wiedergegeben.
- source_word: εἰς τὸ μέλλον
  choice: für die Zukunft
  rationale: Die Formulierung bewahrt den offenen Vorwärtsbezug des Griechischen und lässt den eschatologischen Klang bestehen, ohne ausdrücklich „kommendes Zeitalter“ einzutragen.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Zielgedanken idiomatisch wieder.
- source_word: ἐπιλάβωνται
  choice: sie … ergreifen
  rationale: „Ergreifen“ bewahrt das anschauliche Moment des festen Erfassens und passt zum gehobenen, aber allgemein verständlichen Register.
- source_word: τῆς ὄντως ζωῆς
  choice: das Leben, das wirklich Leben ist
  rationale: Diese Wiedergabe erhält das ausdrückliche Substantiv ζωή und den qualitativen Nachdruck von ὄντως. Sie macht den Gegensatz deutlich, ohne ihn näher auszudeuten.
theological_decisions:
- issue: Ob εἰς τὸ μέλλον ausdrücklich eschatologisch wiederzugeben ist
  choice: für die Zukunft
  alternative: für das kommende Zeitalter
  rationale: Der Zusammenhang hat einen eschatologischen Horizont, doch die griechische Wendung nennt kein „Zeitalter“. Die offenere Formulierung vermeidet eine unnötige Festlegung.
- issue: Wie der qualitative Nachdruck in τῆς ὄντως ζωῆς auszudrücken ist
  choice: das Leben, das wirklich Leben ist
  alternative: das wahre Leben
  rationale: Die gewählte Form erhält sowohl ζωή als auch die nachdrückliche Aussage von ὄντως und bewahrt die theologische Spannung zwischen vermeintlichem und wirklichem Leben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist als syntaktische Fortsetzung von Vers 18 formuliert; daher beginnt er mit „und“. Keine Fußnote ist erforderlich, da die offenen Bedeutungsnuancen im Haupttext hinreichend erhalten bleiben.
