id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: de
  text: Alle, die als Sklaven[a] unter einem Joch stehen, sollen ihre eigenen Herren aller Ehre für würdig halten, damit der Name Gottes und die Lehre[b] nicht verlästert werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Diener« oder »Knechte«; griechisch δοῦλοι. »Sklaven« steht hier, weil »unter einem Joch« den Zustand der Unfreiheit ausdrücklich macht.
    reason: alternative_reading
  - marker: b
    text: Oder »die Unterweisung«.
    reason: lexical_alternative
  - marker: c
    text: Oder »gelästert« beziehungsweise »in Verruf gebracht«.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Die Verbindung mit »unter einem Joch« macht den Stand der Unfreiheit ausdrücklich; »Sklaven« gibt diese soziale Wirklichkeit klar wieder.
- source_word: ὑπὸ ζυγὸν
  choice: unter einem Joch
  rationale: Die bildhafte Rede von Unterwerfung und Unfreiheit wird in natürlichem Deutsch bewahrt.
- source_word: ἰδίους δεσπότας
  choice: ihre eigenen Herren
  rationale: »Ihre eigenen« bildet ἰδίους ausdrücklich ab; »Herren« bezeichnet hier die konkreten Herren der Sklaven, ohne δεσπότης vorschnell auf bloßes Eigentum zu verengen.
- source_word: πάσης τιμῆς ἀξίους
  choice: aller Ehre für würdig
  rationale: Die Formulierung bewahrt den umfassenden Sinn von πάσης τιμῆς und den wertenden Ausdruck ἀξίους ἡγείσθωσαν.
- source_word: ἡγείσθωσαν
  choice: sollen … für würdig halten
  rationale: Der Imperativ bezeichnet eine fortdauernde Einschätzung oder Haltung; die deutsche Konstruktion gibt dies klar und würdig wieder.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: der Name Gottes
  rationale: Die geläufige und genaue Wiedergabe bewahrt den biblischen Gedanken von Gottes offenbartem Namen und Ansehen.
- source_word: ἡ διδασκαλία
  choice: die Lehre
  rationale: »Lehre« ist im Deutschen eine natürliche, sachlich präzise Wiedergabe von διδασκαλία und lässt offen, ob der Schwerpunkt auf Lehrinhalt oder Unterweisung liegt.
- source_word: βλασφημῆται
  choice: verlästert werden
  rationale: »Verlästern« kann sowohl auf Gottes Namen als auch auf die Lehre bezogen werden und bewahrt die starke Bedeutung des griechischen Verbs.
- source_word: Ὅσοι εἰσὶν
  choice: Alle, die … stehen
  rationale: Diese idiomatische Formulierung gibt den umfassenden Bezug von ὅσοι in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von δοῦλοι in einem moralisch und sozial sensiblen Zusammenhang
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Der Text setzt eine historische Unfreiheit voraus, die durch »unter einem Joch« noch ausdrücklich hervorgehoben wird. Die Übersetzung bildet diese Realität ab, ohne sie dadurch gutzuheißen.
- issue: Wiedergabe von διδασκαλία
  choice: die Lehre
  alternative: die Unterweisung
  rationale: »Die Lehre« bezeichnet hier ohne zusätzliche konfessionelle Festlegung die christliche Botschaft beziehungsweise Unterweisung, deren öffentliches Ansehen betroffen ist.
- issue: Wiedergabe von βλασφημῆται bei zwei koordinierten Bezugsgrößen
  choice: verlästert werden
  alternative: gelästert werden; in Verruf gebracht werden
  rationale: Die gewählte Form erhält die starke religiös-moralische Aussage und funktioniert zugleich für »der Name Gottes« und »die Lehre«, ohne die Spannung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken. Der historisch belastete Ausdruck »Sklaven« wird aus Gründen der Genauigkeit verwendet; die Fußnote erläutert mögliche Alternativen. Die Fußnotenmarker stehen gesammelt am Satzende, da sie sich jeweils auf klar erkennbare Ausdrücke im kurzen Vers beziehen.
