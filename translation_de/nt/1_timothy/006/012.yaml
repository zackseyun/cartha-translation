source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: de
  text: Kämpfe den guten Kampf des Glaubens[a]. Ergreife das ewige Leben, zu dem du berufen wurdest und vor vielen Zeugen das gute Bekenntnis abgelegt hast[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kämpfe den guten Kampf im Glauben“ beziehungsweise „für den Glauben“. Der griechische Ausdruck kann einen vom Glauben geprägten Kampf oder den Einsatz für den christlichen Glauben bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Das Griechische verbindet die Berufung zum ewigen Leben und das Ablegen des Bekenntnisses mit „und“, ohne den Inhalt des Bekenntnisses ausdrücklich zu nennen. Die Aussagen können sachlich eng zusammenhängen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Kämpfe den guten Kampf
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv wird im Deutschen als bewusst eindringliche Wiederholung bewahrt. Der Präsensimperativ fordert zu anhaltendem Einsatz auf; „gut“ gibt καλός schlicht und würdig wieder.
- source_word: τῆς πίστεως
  choice: des Glaubens
  rationale: 'Der Genitiv bleibt formal offen: Gemeint sein kann sowohl ein von Glauben geprägter Kampf als auch der Kampf für den christlichen Glauben. Anders als das Englische kann Deutsch diese Offenheit mit „des Glaubens“ gut bewahren.'
- source_word: ἐπιλαβοῦ
  choice: Ergreife
  rationale: Der Aoristimperativ bezeichnet hier einen entschiedenen Zugriff. „Ergreife“ erhält das Bild des festen Zupackens und ist in modernem, würdigem Deutsch natürlich.
- source_word: τῆς αἰωνίου ζωῆς
  choice: das ewige Leben
  rationale: Die feste deutsche Wendung bezeichnet das bestimmte, verheißene Leben; der griechische Artikel wird entsprechend wiedergegeben.
- source_word: εἰς ἣν ἐκλήθης
  choice: zu dem du berufen wurdest
  rationale: εἰς bezeichnet Ziel oder Bestimmung. „Zu dem“ bewahrt diese Zielrichtung, ohne die Art der Berufung näher zu bestimmen.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: du hast das gute Bekenntnis abgelegt
  rationale: Die idiomatische Verbindung „ein Bekenntnis ablegen“ gibt Verb und stammverwandtes Substantiv natürlich wieder. „Gut“ erhält die wertende Parallele zum „guten Kampf“.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: vor vielen Zeugen
  rationale: Die knappe Formulierung entspricht dem griechischen Ausdruck und bezeichnet Menschen, die das öffentliche Bekenntnis bezeugen, nicht „Märtyrer“ im späteren Sinn.
theological_decisions:
- issue: Bedeutung von πίστεως
  choice: „des Glaubens“ mit offener Zuordnung
  alternative: „im Glauben“ oder „für den Glauben“
  rationale: Der griechische Genitiv kann den Kampf als vom persönlichen Glauben geprägt oder als Einsatz für den christlichen Glauben bezeichnen. Die deutsche Genitivform bewahrt diese sachlich bedeutsame Mehrdeutigkeit.
- issue: Beziehung des guten Bekenntnisses zum ewigen Leben und zur Berufung
  choice: Das Bekenntnis wird als koordinierte Aussage wiedergegeben
  alternative: „über das du ... das gute Bekenntnis abgelegt hast“
  rationale: Das Griechische nennt den Inhalt des Bekenntnisses nicht ausdrücklich. Die enge Folge kann eine sachliche Beziehung zur Berufung und zum ewigen Leben nahelegen, doch eine explizite Inhaltsangabe würde diese Beziehung stärker festlegen als der Ausgangstext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, eindringlichem Imperativ. Die zweimalige Wendung mit „gut“ und die Kampfmetaphorik bleiben erhalten. Das Semikolon macht die enge Verbindung der Aussagen sichtbar, ohne den Inhalt des Bekenntnisses über den griechischen Wortlaut hinaus festzulegen.
