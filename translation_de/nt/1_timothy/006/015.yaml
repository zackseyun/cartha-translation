  verdict: revise
  source_fidelity: Der Bezug von „die“ auf ἐπιφάνειαν ist korrekt, ebenso die Zukunft von δείξει und die Beibehaltung des Plurals in καιροῖς. „Von ihm bestimmten“ legt jedoch stärker fest, als ἰδίοις („eigenen“) für sich genommen sagt. Das hinzugefügte „alle“ in beiden Hoheitstiteln ist nicht erforderlich. Die Überarbeitung gibt die beiden Partizipien differenziert wieder.
  naturalness: Der Satz bleibt angemessen als Anschluss an V. 14 fragmentarisch. „Machthaber“ kann im heutigen Deutsch einen abwertend-politischen Beiklang haben; „Herrscher“ ist hier der natürlichere würdige Hoheitstitel. „Glückselig“ ist gehoben, aber als Gottesprädikat präziser und weniger mehrdeutig als „selig“, das heute häufig mit Verstorbenen assoziiert wird.
  terminology: „Herrscher“ gibt δυνάστης sachgerecht wieder. „König derer, die als Könige herrschen“ und „Herr derer, die Herrschaft ausüben“ erhalten die verbale, nicht substantivische Form der griechischen Partizipien und unterscheiden βασιλεύειν von κυριεύειν. Die traditionelle Formel bleibt in der Anmerkung dokumentiert.
  issues:
  - severity: medium
    issue: „zu den von ihm bestimmten Zeiten“ interpretiert ἰδίοις stärker als der Grundtext.
    rationale: ἴδιος bedeutet „eigen“ bzw. „zugehörig“. Dass die Zeiten von ihm festgesetzt sind, ist als kontextuelle Erläuterung möglich, sollte aber nicht den Übersetzungstext ersetzen.
  - severity: low
    issue: „Machthaber“ ist registermäßig ungünstig.
    rationale: Das Wort wird im modernen Deutsch oft für autoritäre politische Machtausübung verwendet. „Herrscher“ bezeichnet δυνάστης neutraler und würdiger.
  - severity: low
    issue: „alle“ ergänzt eine im griechischen Wortlaut nicht ausdrücklich ausgedrückte Verallgemeinerung.
    rationale: Die generischen Partizipien können ohne diese Ergänzung präzise und natürlich wiedergegeben werden.
