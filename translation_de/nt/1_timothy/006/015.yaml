  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: de
  text: die der glückselige und einzige Herrscher zu seinen eigenen Zeiten[a] sichtbar machen wird, der König derer, die als Könige herrschen, und Herr derer, die Herrschaft ausüben[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu seinen eigenen Zeiten“. Die Wendung bezeichnet Zeiten, die ihm zugehören; sie kann im Zusammenhang auch die von ihm festgesetzten Zeiten meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der König der Könige und der Herr der Herren“. Im Griechischen stehen Partizipien, wörtlich: „der König derer, die als Könige herrschen, und Herr derer, die Herrschaft ausüben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: die
  rationale: Das feminine Relativpronomen verweist auf ἐπιφάνειαν („Erscheinung“) in Vers 14; „die“ wahrt diesen Rückbezug, ohne einen persönlichen Bezug anzudeuten.
- source_word: καιροῖς ἰδίοις
  choice: zu den von ihm bestimmten Zeiten
  rationale: καιροί bezeichnet passende beziehungsweise festgesetzte Zeitpunkte oder Zeitabschnitte. Die Formulierung bewahrt den Plural und bringt idiomatisch zum Ausdruck, dass diese Zeiten dem handelnden Subjekt zugeordnet sind.
- source_word: δείξει
  choice: sichtbar machen wird
  rationale: Die Zukunftsform von δείκνυμι bezeichnet das offene Zeigen oder Sichtbarwerdenlassen. Im Zusammenhang mit der Erscheinung ist diese Wiedergabe natürlicher als „zeigen“, ohne den Vorgang bloß als Mitteilung zu verstehen.
- source_word: ὁ μακάριος
  choice: der selige
  rationale: Das substantivierte Adjektiv dient als erhabener Gottes-Titel. „Selig“ ist würdevoll und semantisch näher als das im Deutschen zu alltägliche „glücklich“.
- source_word: μόνος δυνάστης
  choice: einzige Machthaber
  rationale: δυνάστης bezeichnet jemanden, der Herrschaftsgewalt besitzt. „Machthaber“ gibt dies verständlich und gewichtig wieder; „einzige“ entspricht μόνος, ohne bereits eine weitergehende dogmatische Auslegung einzutragen.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: der König über alle, die regieren
  rationale: Das Partizip βασιλευόντων wird verbal wiedergegeben. „Über“ verdeutlicht im Deutschen die übergeordnete Königsherrschaft und vermeidet die missverständliche Formulierung „König der Regierenden“.
- source_word: κύριος τῶν κυριευόντων
  choice: der Herr über alle, die herrschen
  rationale: κύριος wird als Herrschaftstitel mit „Herr“ wiedergegeben; das Partizip κυριευόντων behält durch „die herrschen“ seine verbale Kraft.
theological_decisions:
- issue: Identität dessen, der die Erscheinung sichtbar machen wird
  choice: Das handelnde Subjekt wird nur durch die im griechischen Text folgenden Hoheitstitel bezeichnet.
  alternative: Aus dem Zusammenhang könnte ausdrücklich „Gott“ oder genauer „der Vater“ ergänzt werden.
  rationale: Der Vers nennt hier keinen Eigennamen. Die Übersetzung bewahrt diese Darstellungsweise und lässt die genauere Identifizierung dem Zusammenhang, statt sie ausdrücklich in den Wortlaut einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt als Anschluss an Vers 14 bewusst ein Fragment. Die parallelen Herrschaftstitel werden gehoben, aber ohne altertümliche Wörter wie „Gewaltiger“ oder „Potentat“ formuliert; die griechischen Partizipien bleiben erkennbar.
