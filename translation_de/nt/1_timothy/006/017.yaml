source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: de
  text: Weise die Reichen im gegenwärtigen Zeitalter[a] an, nicht überheblich zu sein und ihre Hoffnung nicht auf unsicheren Reichtum[b] zu setzen, sondern auf Gott, der uns alles reichlich zum Genießen gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der gegenwärtigen Welt“. Das griechische Wort kann „Zeitalter“ und, davon abgeleitet, die gegenwärtige Weltordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „auf die Ungewissheit des Reichtums“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: die Reichen
  rationale: Der substantivierte Dativ Plural bezeichnet die wohlhabenden Menschen, an die sich die Anweisung richtet. „Die Reichen“ ist knapp, natürlich und wertet sie nicht über die Aussage des Textes hinaus.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: in der gegenwärtigen Weltzeit
  rationale: αἰών bezeichnet hier die gegenwärtige Zeit- und Weltordnung. „Weltzeit“ bewahrt sowohl den zeitlichen als auch den eschatologischen Klang besser als das rein räumlich verstandene „Welt“.
- source_word: παράγγελλε
  choice: Weise ... an
  rationale: Der Imperativ verlangt eine verbindliche Weisung. „Anweisen“ gibt diese Autorität in modernem Deutsch wieder, ohne unnötig hart oder amtlich zu klingen.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: nicht überheblich zu sein
  rationale: Das Verb bezeichnet hochmütiges Denken. „Überheblich“ ist gegenwärtiges, klares Deutsch und erfasst die innere Haltung ebenso wie ihr Auftreten.
- source_word: μηδὲ ἠλπικέναι
  choice: und ihre Hoffnung nicht ... zu setzen
  rationale: Der perfekte Infinitiv beschreibt eine fest gesetzte beziehungsweise bestehende Hoffnung. Die deutsche Wendung „seine Hoffnung auf etwas setzen“ gibt dies idiomatisch wieder.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: auf unsicheren Reichtum
  rationale: ἀδηλότης hebt die Ungewissheit und Unbeständigkeit des Reichtums hervor. Die attributive Wiedergabe ist im Deutschen natürlicher als „auf die Ungewissheit des Reichtums“ und bewahrt die Aussage, dass Reichtum keine verlässliche Hoffnungsgrundlage ist.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: sondern auf Gott
  rationale: Das wiederholte ἐπί stellt Gott dem unsicheren Reichtum als Ziel der Hoffnung gegenüber. „Auf Gott“ führt die deutsche Konstruktion „Hoffnung setzen auf“ präzise fort.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: der uns ... gibt
  rationale: Das attributive Partizip beschreibt Gott als den Gebenden. „Gibt“ ist schlicht, unmittelbar und deckt hier den Sinn des Bereitstellens ab.
- source_word: πάντα
  choice: alles
  rationale: Das Neutrum Plural hat umfassenden Sinn. „Alles“ bewahrt diesen Umfang, ohne ihn auf das Lebensnotwendige einzuschränken.
- source_word: πλουσίως
  choice: reichlich
  rationale: „Reichlich“ gibt das Adverb genau wieder und erhält zugleich den sprachlichen Bezug zum Thema Reichtum.
- source_word: εἰς ἀπόλαυσιν
  choice: zum Genießen
  rationale: Die Präpositionalphrase bezeichnet Zweck beziehungsweise Bestimmung. „Zum Genießen“ ist natürlich und bringt den positiven Gedanken erlaubter Freude an Gottes Gaben zum Ausdruck.
theological_decisions:
- issue: Bedeutung von αἰών im ethisch-eschatologischen Zusammenhang
  choice: Weltzeit
  alternative: Welt; Zeitalter
  rationale: „Weltzeit“ bewahrt die zeitliche Spannung zwischen der gegenwärtigen Ordnung und der kommenden, ohne αἰών auf die materielle Welt zu verengen. Die geläufigere Alternative wird in einer Fußnote genannt.
- issue: Bezug von ἀδηλότης auf Reichtum
  choice: unsicherer Reichtum
  alternative: die Ungewissheit des Reichtums
  rationale: Die Übersetzung lässt Reichtum als unzuverlässige Grundlage der Hoffnung erscheinen, ohne Wohlstand an sich mit einer zusätzlichen moralischen Bewertung zu versehen.
- issue: Umfang der göttlichen Gabe in πάντα
  choice: alles
  alternative: alles Nötige; alle Dinge
  rationale: Der griechische Text formuliert umfassend. Die Übersetzung schränkt die Aussage weder auf das Notwendige ein noch deutet sie als Zusage individuellen Wohlstands aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Weise ... an“ wahrt den verbindlichen Ton des Imperativs; „Weltzeit“ erhält die paulinische zeitlich-eschatologische Nuance, während die Fußnote eine geläufigere Alternative zugänglich macht.
