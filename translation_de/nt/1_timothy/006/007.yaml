  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: de
  text: Denn wir haben nichts in die Welt mitgebracht,[a] und wir können auch nichts aus ihr mitnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Denn wir haben nichts in die Welt hineingebracht, weil wir auch nichts hinausbringen können.« Das griechische Bindewort kann kausal (»weil«) verstanden werden oder die entsprechende zweite Aussage einleiten.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: nichts
  rationale: Das substantivisch gebrauchte Negativpronomen ist Objekt zu εἰσηνέγκαμεν; »nichts« gibt die uneingeschränkte Verneinung natürlich wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; »denn« bewahrt diese rückbezügliche Funktion.
- source_word: εἰσηνέγκαμεν
  choice: haben … mitgebracht
  rationale: Der Aorist von εἰσφέρω bezeichnet das Hineinbringen. Im Deutschen ist »in die Welt mitbringen« idiomatisch und bewahrt das Bild des Eintritts ins Leben.
- source_word: εἰς τὸν κόσμον
  choice: in die Welt
  rationale: κόσμος bezeichnet hier die menschliche Welt, in die ein Mensch geboren wird; »Welt« ist die natürliche Entsprechung.
- source_word: ὅτι
  choice: und
  rationale: Die Konjunktion lässt sich hier kausal verstehen, kann aber im sprichwortartig parallelen Satz auch die entsprechende zweite Aussage einführen. »Und« ergibt einen natürlichen deutschen Satz; die mögliche kausale Lesart wird in der Fußnote festgehalten.
- source_word: οὐδὲ
  choice: auch nichts
  rationale: In Verbindung mit τι und der verneinten Möglichkeit bezeichnet οὐδὲ die entsprechende negative Aussage der zweiten Satzhälfte; »auch nichts« bildet die Parallelität idiomatisch ab.
- source_word: ἐξενεγκεῖν
  choice: aus ihr mitnehmen
  rationale: Der Infinitiv von ἐκφέρω bedeutet »hinaustragen/hinausbringen«. »Aus der Welt mitnehmen« ist im Deutschen natürlich und bewahrt das Bild des Fortgangs beim Tod; das Pronomen »ihr« nimmt »Welt« auf.
- source_word: τι
  choice: nichts
  rationale: Das indefinite Pronomen steht im Bereich der Verneinung und wird daher im Deutschen idiomatisch mit »nichts« wiedergegeben.
- source_word: δυνάμεθα
  choice: wir können
  rationale: Das Präsens von δύναμαι bezeichnet Fähigkeit oder Möglichkeit. Zusammen mit der Negation ergibt sich natürlich »wir können … nichts«.
theological_decisions:
- issue: Verknüpfung der zweiten Satzhälfte durch ὅτι
  choice: 'Koordinierte Fortsetzung: Wir brachten nichts hinein und können auch nichts hinausnehmen.'
  alternative: 'Kausale Verknüpfung: »Denn wir haben nichts in die Welt mitgebracht, weil wir auch nichts aus ihr mitnehmen können.«'
  rationale: ὅτι kann kausal verstanden werden, doch der Kontext trägt auch eine sprichwortartige Balance zweier entsprechender Aussagen. Der Haupttext bewahrt diese Parallelität in natürlichem Deutsch; die echte syntaktische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Mitgebracht/mitnehmen« bildet im Deutschen ein klares, einprägsames Gegensatzpaar; die Fußnote dokumentiert sowohl die wörtlichere Bewegungsrichtung als auch die Mehrdeutigkeit von ὅτι.
