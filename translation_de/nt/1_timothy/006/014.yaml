  source_fidelity: Der abhängige dass-Satz gibt den von dem vorausgehenden Auftrag abhängigen griechischen Infinitiv angemessen wieder. „das Gebot“ entspricht τὴν ἐντολήν; „unbefleckt und untadelig“ bewahrt die beiden parallel gesetzten Adjektive und ihre kompakte, nicht weiter explizierte Beziehung zum Bewahren bzw. zum Gebot. „bis zum Erscheinen“ trifft μέχρι τῆς ἐπιφανείας, ohne ein nicht ausdrücklich vorhandenes „Wieder-“ einzutragen. Die Genitivverbindung und der christologische Titel sind sachgerecht wiedergegeben.
