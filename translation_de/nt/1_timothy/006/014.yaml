id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: de
  text: dass du das Gebot unbefleckt und untadelig bewahrst bis zum Erscheinen unseres Herrn Jesus, des Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseres Herrn Jesus Christus“. Das griechische Χριστός kann als Titel „Messias“ oder in der traditionellen, stärker namenähnlichen Form „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: Die Wörter „unbefleckt“ und „untadelig“ können das Gebot selbst oder die Art bezeichnen, wie Timotheus es bewahren soll; die griechische Formulierung ist knapp.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: bewahrst
  rationale: Das Verb bezeichnet hier im Anschluss an den vorausgehenden Auftrag treues Einhalten. „Bewahren“ erhält sowohl den Gedanken des Befolgens als auch den des unversehrten Festhaltens.
- source_word: σε
  choice: du
  rationale: Das Akkusativsubjekt des Infinitivs wird im Deutschen in einem dass-Satz idiomatisch als Subjekt wiedergegeben.
- source_word: τὴν ἐντολήν
  choice: das Gebot
  rationale: Der bestimmte Singular bezeichnet den verbindlichen Auftrag; „Gebot“ ist gewichtig, verständlich und entspricht der üblichen Bedeutung von ἐντολή.
- source_word: ἄσπιλον
  choice: unbefleckt
  rationale: Das Adjektiv bedeutet frei von Flecken oder Makel. Die knappe Stellung beim Objekt lässt wie im Griechischen offen, ob primär das Gebot oder dessen Befolgung charakterisiert wird.
- source_word: ἀνεπίλημπτον
  choice: untadelig
  rationale: Das Wort bezeichnet etwas, das keinen berechtigten Anlass zur Beanstandung bietet. „Untadelig“ ist prägnant und in diesem feierlichen Zusammenhang natürlich.
- source_word: μέχρι
  choice: bis zu
  rationale: Die Präposition bezeichnet die zeitliche Erstreckung bis zu dem genannten künftigen Ereignis; mit dem substantivierten Infinitiv wird sie idiomatisch als „bis zum“ wiedergegeben.
- source_word: τῆς ἐπιφανείας
  choice: zum Erscheinen
  rationale: ἐπιφάνεια bezeichnet hier das künftige sichtbare Hervortreten Jesu. „Erscheinen“ gibt dies wieder, ohne das im Wort nicht ausdrücklich enthaltene „Wieder-“ hinzuzufügen.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „Herr“ bleibt als christologischer Titel erhalten.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  rationale: Χριστός trägt den Titelsinn „Messias“. Die Apposition mit Artikel ist im Deutschen idiomatisch und macht den Titel verständlich, ohne ihn zu einem bloßen Namensbestandteil zu verflachen.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: des Messias
  alternative: Christus
  rationale: Der griechische Ausdruck kann titelhaft oder zunehmend namenähnlich gebraucht werden. In der feierlichen eschatologischen Verbindung bleibt der messianische Titel gut hörbar; die traditionelle Wiedergabe „Christus“ wird deshalb als Alternative vermerkt.
- issue: Bezug von ἄσπιλον und ἀνεπίλημπτον
  choice: Kompakte Zuordnung zu „das Gebot“ bei erhaltener Bedeutungsambiguität
  alternative: Expliziter Bezug auf Timotheus oder auf die Art seines Bewahrens
  rationale: Kasus und Stellung beziehen die Adjektive grammatisch auf ἐντολήν, doch die knappe Formulierung kann sachlich auch das Bewahren des Gebots charakterisieren. Die Übersetzung löst diese Spannung nicht durch einen erklärenden Zusatz auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt als abhängiger dass-Satz formuliert, weil der griechische Infinitiv den Auftrag aus dem vorherigen Vers fortsetzt. „Unbefleckt“ wahrt die Bildlichkeit von ἄσπιλος; „untadelig“ vermeidet das schwerfällige „unanfechtbar“.
