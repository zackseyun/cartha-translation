  terminology: „Herr“, „Gebot“, „Erscheinen“ und „Messias“ sind konsistent und angemessen. Die Alternativanmerkung zu „Christus“ dokumentiert die mögliche stärker namenähnliche Wiedergabe von Χριστός, ohne die Hauptfassung theologisch zu überdeuten. Die Anmerkung zum Bezug der Adjektive ist vorsichtig formuliert und die Marker sind korrekt verankert.
