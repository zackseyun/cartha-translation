  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: de
  text: der ist von Hochmut aufgebläht[a] und versteht nichts, sondern hat ein krankhaftes Verlangen nach Streitfragen und Wortgefechten[b]. Daraus entstehen Neid, Streit, Verleumdungen[c] und böser Argwohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist hochmütig geworden“. Das griechische Wort vermittelt bildlich den Gedanken, vor Hochmut aufgebläht zu sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wortstreitigkeiten“ beziehungsweise „Streit über Worte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Lästerungen“. Das griechische Wort kann Lästerung gegen Gott oder verleumderische, beleidigende Rede gegen Menschen bezeichnen; hier legt der Zusammenhang Letzteres nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: ist von Hochmut aufgebläht
  rationale: Das Perfekt bezeichnet einen fortbestehenden Zustand. Die Formulierung bewahrt das griechische Bild des Aufgeblähtseins und macht zugleich deutlich, dass Hochmut gemeint ist.
- source_word: μηδὲν ἐπιστάμενος
  choice: versteht nichts
  rationale: Die Wendung bezeichnet fehlende Einsicht; „versteht nichts“ ist im Deutschen natürlich und gibt den pointierten Vorwurf knapp wieder.
- source_word: νοσῶν
  choice: hat ein krankhaftes Verlangen
  rationale: Die Wiedergabe erhält die Krankheitsmetaphorik und verbindet sie idiomatisch mit den durch περί bezeichneten Gegenständen der Fixierung.
- source_word: περὶ ζητήσεις
  choice: nach Streitfragen
  rationale: ζητήσεις bezeichnet hier kontroverse, zum Streit führende Erörterungen; „Streitfragen“ ist knapp und im Zusammenhang verständlich.
- source_word: λογομαχίας
  choice: Wortgefechten
  rationale: Das deutsche Kompositum bewahrt sowohl den Bezug auf Worte als auch die kämpferische Bildkraft von μάχη.
- source_word: ἐξ ὧν γίνεται
  choice: Daraus entstehen
  rationale: Die Formulierung gibt die genannten Streitigkeiten als Ursprung der folgenden Laster wieder, ohne den Numerusbezug im Deutschen unnötig schwerfällig auszudrücken.
- source_word: φθόνος
  choice: Neid
  rationale: „Neid“ entspricht der üblichen Bedeutung von φθόνος als missgünstiger Haltung.
- source_word: ἔρις
  choice: Streit
  rationale: „Streit“ ist eine natürliche, prägnante Wiedergabe für Zwietracht oder Auseinandersetzung.
- source_word: βλασφημίαι
  choice: Verleumdungen
  rationale: Im zwischenmenschlichen Lasterkatalog bezeichnet das Wort wahrscheinlich ehrverletzende oder verleumderische Rede; die mögliche Bedeutung „Lästerungen“ bleibt in einer Fußnote sichtbar.
- source_word: ὑπόνοιαι πονηραί
  choice: böse Verdächtigungen
  rationale: Die Verbindung gibt sowohl den argwöhnischen Charakter der ὑπόνοιαι als auch ihre moralische Qualifizierung durch πονηραί direkt wieder.
theological_decisions:
- issue: Bezug von βλασφημίαι
  choice: Verleumdungen gegen Menschen
  alternative: Lästerungen, möglicherweise auch gegen Gott
  rationale: Die unmittelbare Umgebung beschreibt die sozialen Folgen von Streitigkeiten. Daher liegt schädigende Rede über Menschen näher; die weitere Bedeutungsbreite des griechischen Wortes wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Krankheits- und Aufblähungsmetaphorik des griechischen Textes bleibt erhalten; ungewöhnlichere Begriffe werden durch Fußnoten erläutert.
