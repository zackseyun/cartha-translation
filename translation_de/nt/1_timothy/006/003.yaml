id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: de
  text: Wenn jemand eine andere Lehre vertritt und sich nicht an die heilsamen Worte hält, an die Worte unseres Herrn Jesus, des Messias, und an die Lehre, die der Gottesfurcht entspricht,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: eine andere Lehre vertritt
  rationale: Das Verb bezeichnet das Lehren einer abweichenden Lehre. „Eine andere Lehre vertritt“ ist natürliches modernes Deutsch und vermeidet den im Verb nicht ausdrücklich enthaltenen Zusatz „falsch“.
- source_word: προσέρχεται
  choice: sich … an … hält
  rationale: Das Verb bedeutet wörtlich „herantreten“, bezeichnet hier aber das Annehmen beziehungsweise Festhalten an einer Lehre. Die gewählte Wendung gibt diesen kontextuellen Sinn idiomatisch wieder.
- source_word: ὑγιαίνουσι λόγοις
  choice: die gesunden Worte
  rationale: Die Übersetzung bewahrt sowohl das Gesundheitsbild von ὑγιαίνω als auch die konkrete Bedeutung „Worte“ von λόγοις.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nämlich die unseres Herrn Jesus, des Messias
  rationale: Das wiederaufnehmende „die“ bezieht sich auf die gesunden Worte; „nämlich“ macht die Apposition im Deutschen verständlich. Χριστός wird als messianischer Titel wiedergegeben.
- source_word: κατ’ εὐσέβειαν
  choice: die der Gottesfurcht entspricht
  rationale: κατά bezeichnet hier Übereinstimmung oder Entsprechung. Die Formulierung lässt offen, ob zusätzlich eine lebensgestaltende Wirkung gemeint ist.
- source_word: διδασκαλίᾳ
  choice: die Lehre
  rationale: Der Ausdruck bezeichnet hier den Inhalt der Unterweisung und bildet einen klaren Gegensatz zur „anderen Lehre“.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Im Kontext der Pastoralbriefe meint εὐσέβεια eine ehrfürchtige, auf Gott ausgerichtete Lebenshaltung. „Gottesfurcht“ ist würdevoll und im heutigen biblischen Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ in Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Χριστός ist hier in der vollständigen Bezeichnung weiterhin als Titel erkennbar. Die appositionelle Form „Jesus, des Messias“ bewahrt diesen Titelsinn in idiomatischem Deutsch, ohne ihn zu einem bloßen Namensbestandteil zu machen.
- issue: Beziehung zwischen Lehre und εὐσέβεια
  choice: die der Gottesfurcht entspricht
  alternative: die zur Gottesfurcht führt
  rationale: Der κατά-Ausdruck bezeichnet sicher die Übereinstimmung mit Gottesfurcht; eine ausdrücklich kausale oder zielgerichtete Aussage („führt zu“) wäre möglich, aber stärker als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Gesundheitsbild der „gesunden Worte“ bleibt erhalten. Der Satz endet entsprechend dem griechischen Vers mit einem Komma, da die Bedingung im folgenden Vers fortgeführt wird.
