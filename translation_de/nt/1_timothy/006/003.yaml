- from: Wenn jemand eine andere Lehre vertritt und sich nicht an die gesunden Worte hält, nämlich die unseres Herrn Jesus, des Messias, und an die Lehre, die der Gottesfurcht entspricht,
  to: Wenn jemand eine andere Lehre vertritt und sich nicht an die heilsamen Worte hält, an die Worte unseres Herrn Jesus, des Messias, und an die Lehre, die der Gottesfurcht entspricht,
  rationale: Die Revision glättet lediglich zwei deutsche Formulierungen. Sie erhält die offene Fortsetzung des Konditionalsatzes durch das Schlusskomma, die appositionelle Zuordnung der heilsamen Worte zu Jesus dem Messias sowie die nicht-kausale Beziehung der Lehre zur Gottesfurcht.
