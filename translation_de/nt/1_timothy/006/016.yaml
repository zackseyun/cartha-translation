reference: 1 Timothy 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: de
  text: der allein Unsterblichkeit besitzt und in unzugänglichem Licht wohnt, den kein Mensch gesehen hat noch sehen kann.[a] Ihm sei Ehre und ewige Macht.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den niemand unter den Menschen gesehen hat noch sehen kann“.'
    reason: lexical_alternative
  - marker: b
    text: Manche beziehen diese Beschreibung und den Lobpreis im weiteren Zusammenhang unmittelbarer auf den Herrn Jesus Christus; die Aussage über den Unsichtbaren weist jedoch am ehesten auf Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: allein
  rationale: Bewahrt die Exklusivität der Aussage in natürlichem Deutsch.
- source_word: ἔχων ἀθανασίαν
  choice: Unsterblichkeit besitzt
  rationale: „Besitzt“ gibt das Partizip ἔχων klar wieder und unterstreicht, dass Unsterblichkeit ihm eigen ist.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: in unzugänglichem Licht wohnt
  rationale: Die Wortgruppe wird als „wohnt in unzugänglichem Licht“ verstanden; „unzugänglich“ wahrt den starken Sinn von ἀπρόσιτος.
- source_word: οὐδεὶς ἀνθρώπων
  choice: kein Mensch
  rationale: 'Gibt die partitive Wendung idiomatisch und sachlich genau wieder: Niemand aus der Menschheit hat ihn gesehen.'
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: noch sehen kann
  rationale: Bewahrt sowohl die Verneinung als auch die durch δύναται ausgedrückte Unfähigkeit, ohne im Deutschen schwerfällig zu wirken.
- source_word: τιμὴ
  choice: Ehre
  rationale: Die übliche und passende Wiedergabe in einer Doxologie.
- source_word: κράτος αἰώνιον
  choice: ewige Herrschaft
  rationale: κράτος bezeichnet hier wirksame Macht beziehungsweise Herrschaft; „ewige Herrschaft“ passt zur doxologischen Formel.
- source_word: ἀμήν
  choice: Amen
  rationale: Die im Deutschen etablierte liturgische Form bleibt erhalten.
theological_decisions:
- issue: Bezug der Relativsätze und der Doxologie
  choice: Der Vers beschreibt weiterhin Gott, und die Doxologie gilt ihm.
  alternative: Die Beschreibung und Doxologie können im weiteren Satzgefüge unmittelbarer auf den Herrn Jesus Christus bezogen werden.
  rationale: Der Zusammenhang von Vers 15–16 und besonders die Aussage, dass kein Mensch ihn gesehen hat oder sehen kann, weisen am natürlichsten auf Gott. Die alternative syntaktisch-theologische Zuordnung wird jedoch nicht verschwiegen.
- issue: Wiedergabe von ἀνθρώπων
  choice: kein Mensch
  alternative: niemand unter den Menschen
  rationale: „Kein Mensch“ ist im modernen Deutschen inklusiv, präzise und weniger schwerfällig als eine formnahe partitive Wendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen wurden flüssig verbunden; der elliptische Lobpreis erhielt mit „gebühren“ ein im Deutschen notwendiges Verb. Die Fußnotenmarker [a] und [b] stehen jeweils an der sachlich zugehörigen Stelle.
