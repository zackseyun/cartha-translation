  to: der allein Unsterblichkeit besitzt und in unzugänglichem Licht wohnt, den kein Mensch gesehen hat noch sehen kann.[a] Ihm sei Ehre und ewige Macht.[b] Amen.
  rationale: Die Revision beschränkt sich auf die Doxologie. „Ihm sei Ehre und ewige Macht“ bildet die griechische, verblose Lobpreisformel direkt und idiomatisch ab und gibt κράτος ohne unnötliche Einengung als „Herrschaft“ wieder. Die vorhandene Fußnote zur möglichen Referenz im weiteren Kontext bleibt erhalten und wahrt die Auslegungsambiguität.
