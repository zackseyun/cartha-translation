review_pass:
  verdict: revise
  source_fidelity: 'Der Relativsatz ist insgesamt quellentreu wiedergegeben: μόνος, ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον sowie die doppelte Aussage, dass kein Mensch ihn gesehen hat und ihn nicht sehen kann, sind sachgerecht erfasst. „Ewige Herrschaft“ ist für κράτος möglich, doch die Doxologie wird mit „gebühren“ leicht in eine Aussage darüber verschoben, was Gott zusteht, statt die griechische Wunsch-/Zuschreibungsformel wiederzugeben.'
  naturalness: Das Deutsch ist flüssig, modern und würdig. „Ihm sei Ehre und ewige Macht“ ist als deutsche doxologische Formel natürlicher und näher an der elliptischen griechischen Konstruktion als „Ihm gebühren Ehre und ewige Herrschaft“.
  terminology: „Unsterblichkeit“, „unzugänglichem Licht“, „Ehre“ und „Amen“ sind treffend. Für κράτος ist „Macht“ im Deutschen die unmittelbarere und in Doxologien etablierte Entsprechung; sie behauptet nicht spezifischer als der griechische Ausdruck eine ausgeübte Herrschaft.
  issues:
  - severity: low
    issue: Die Doxologie „Ihm gebühren Ehre und ewige Herrschaft“ gibt die griechische Zuschreibungsformel nur indirekt wieder.
    rationale: ᾧ τιμὴ καὶ κράτος αἰώνιον ist eine verblose Doxologie, die im Deutschen angemessen mit „Ihm sei ...“ ergänzt wird. „Gebühren“ kann insbesondere bei „Herrschaft“ den Sinn von geschuldetem Anspruch statt ewiger Machtfülle nahelegen.
  revised_text: der allein Unsterblichkeit besitzt und in unzugänglichem Licht wohnt, den kein Mensch gesehen hat noch sehen kann.[a] Ihm sei Ehre und ewige Macht.[b] Amen.
