  text: But godliness with contentment is great gain[a][b].
translation:
  language: de
  text: Doch Gottesfurcht mit Genügsamkeit[b] ist ein großer Gewinn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein großer Ertrag« oder »ein bedeutendes Mittel zum Gewinn«. Das griechische Wort bezeichnet Gewinn, Ertrag oder ein Mittel zum Erwerb und greift den Gedanken aus dem vorherigen Vers auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Zufriedenheit« bzw. »Auskommen«. Das griechische Wort kann auch »Selbstgenügsamkeit« bedeuten; hier geht es wahrscheinlich um das zufriedene Auskommen mit dem Vorhandenen, nicht um Unabhängigkeit von Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Markiert den milden Gegensatz zu der in Vers 5 genannten Vorstellung, Gottesfurcht sei ein Mittel zum Gewinn.
- source_word: πορισμὸς
  choice: Gewinn
  rationale: Bewahrt die Verbindung und den Wortanklang zum vorherigen Vers, ohne den Gewinn auf materiellen Reichtum einzuengen.
- source_word: μέγας
  choice: großer
  rationale: Gibt die starke positive Wertung des griechischen Adjektivs natürlich wieder.
- source_word: εὐσέβεια
  choice: Gottesfurcht
  rationale: Bezeichnet hier eine ehrfürchtige, auf Gott ausgerichtete Lebenshaltung; der Ausdruck ist im Deutschen würdig und allgemein verständlich.
- source_word: μετὰ
  choice: wenn sie mit … verbunden ist
  rationale: Gibt die begleitende Beziehung idiomatisch wieder und macht den Bezug der Genügsamkeit zur Gottesfurcht deutlich.
- source_word: αὐταρκείας
  choice: Genügsamkeit
  rationale: Passt zum unmittelbaren Kontext der Verse 7–8, in dem es um das Zufriedensein mit dem Lebensnotwendigen geht, und vermeidet den Eindruck einer von Gott unabhängigen Selbstgenügsamkeit.
theological_decisions:
- issue: Bedeutung von αὐτάρκεια im christlichen Zusammenhang
  choice: Genügsamkeit
  alternative: Selbstgenügsamkeit; Zufriedenheit; Auskommen
  rationale: Der folgende Kontext beschreibt Zufriedenheit mit Nahrung und Kleidung, nicht philosophische Autonomie oder Unabhängigkeit von Gott.
- issue: Verhältnis von Gottesfurcht und Gewinn
  choice: Gottesfurcht, die mit Genügsamkeit verbunden ist, ist selbst ein großer Gewinn
  alternative: Gottesfurcht ist zusammen mit Genügsamkeit ein bedeutendes Mittel zum Gewinn
  rationale: Die prädikative Konstruktion erlaubt eine Nuance von Gewinn oder Erwerbsmittel. Die gewählte Fassung erhält den Kontrast zu Vers 5, ohne Frömmigkeit als zweckorientiertes Mittel darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gottesfurcht« bezeichnet keine bloße Angst, sondern ehrfürchtige, auf Gott ausgerichtete Lebensführung. Die etwas ausführlichere Konstruktion mit »verbunden ist« vermeidet eine holprige Reihung und erhält zugleich die inhaltliche Spannung des griechischen Satzes.
