  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: de
  text: Diejenigen aber, die gläubige Herren haben, sollen sie nicht verachten, weil sie Brüder[a] sind. Vielmehr sollen sie ihnen umso mehr dienen, weil diejenigen, denen die Wohltat zugutekommt, gläubig und geliebt sind[b]. Lehre dies und ermahne dazu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brüder und Schwestern“; wörtlich steht im Griechischen „Brüder“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „denen die Wohltat zugutekommt“ ist im Griechischen schwer zu deuten. Wahrscheinlich sind die gläubigen Herren gemeint, denen der Dienst der versklavten Menschen zugutekommt.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: gläubige
  rationale: Im Zusammenhang bezeichnet das Adjektiv Herren, die an Christus glauben, nicht lediglich zuverlässige oder treue Herren.
- source_word: δεσπότας
  choice: Herren
  rationale: Das Wort bezeichnet hier Personen mit Verfügungsgewalt über versklavte Menschen. „Herren“ ist im Deutschen die natürliche Entsprechung im damaligen Haushalts- und Sklavereikontext.
- source_word: καταφρονείτωσαν
  choice: sollen sie nicht verachten
  rationale: „Verachten“ gibt die Vorstellung von Geringschätzung und Missachtung knapp und mit der nötigen Stärke wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Pluralform wird gewahrt; zugleich bezeichnet sie hier die gemeinsame Zugehörigkeit zur christlichen Glaubensfamilie.
- source_word: μᾶλλον δουλευέτωσαν
  choice: sollen sie ihnen umso mehr dienen
  rationale: „Dienen“ gibt die Tätigkeit innerhalb des bereits deutlich erkennbaren Sklavereiverhältnisses idiomatisch wieder; „umso mehr“ wahrt die Steigerung durch μᾶλλον.
- source_word: πιστοί
  choice: gläubig
  rationale: Gemeint sind Menschen, die an Christus glauben. Die prädikative Wiedergabe fügt sich natürlich in den deutschen Satz.
- source_word: ἀγαπητοὶ
  choice: geliebt
  rationale: „Geliebt“ bewahrt den Beziehungs- und Zuneigungsgehalt des griechischen Wortes, ohne eine zusätzliche Deutung einzutragen.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: diejenigen, denen die Wohltat zugutekommt
  rationale: Die Wendung ist syntaktisch schwierig. Diese Formulierung gibt den wahrscheinlich gemeinten Empfang beziehungsweise Nutzen wieder, ohne die Wohltat im Haupttext ausdrücklich mit dem geleisteten Dienst gleichzusetzen.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Lehre dies und ermahne dazu
  rationale: Die beiden Präsensimperative an Timotheus werden unmittelbar und in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί im christlichen Gemeinschaftskontext
  choice: Brüder
  alternative: Brüder und Schwestern; Geschwister
  rationale: Die maskuline Form des Ausgangstextes bleibt erhalten. Eine Fußnote weist darauf hin, dass das Wort im frühchristlichen Sprachgebrauch je nach Zusammenhang Glaubensgeschwister beider Geschlechter einschließen kann.
- issue: Bezeichnung der sozialen Stellung im Sklavereikontext
  choice: Herren … dienen
  alternative: Gebieter … Sklavendienst leisten; Besitzer … dienen
  rationale: Der Vers setzt ein Sklavereiverhältnis voraus, verwendet hier jedoch nicht das Substantiv δοῦλος. „Herren“ und „dienen“ geben die vorhandenen Wörter natürlich wieder, ohne die historische Zwangsordnung zu verschleiern oder zusätzliche Terminologie einzutragen.
- issue: Bezug von οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: Die gläubigen Herren sind die Empfänger beziehungsweise Nutznießer der Wohltat
  alternative: Die glaubenden Dienenden widmen sich der Wohltat; beide Seiten haben am Nutzen teil
  rationale: Der nähere Zusammenhang legt am ehesten nahe, dass die Herren vom vermehrten Dienst profitieren. Da die griechische Konstruktion knapp und umstritten ist, bleibt die deutsche Formulierung zurückhaltend und die Schwierigkeit wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber zur besseren Lesbarkeit in zwei Hauptsätze gegliedert. Historische Herrschaftssprache wird weder beschönigt noch durch im Vers nicht ausdrücklich vorkommende Substantive erweitert.
