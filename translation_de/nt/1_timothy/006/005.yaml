  source_fidelity: 'Die wesentlichen lexikalischen Entscheidungen sind zutreffend: „ständige Reibereien“ gibt διαπαρατριβαί idiomatisch wieder, „deren Denken verdorben ist“ und „der Wahrheit beraubt“ geben die beiden perfektischen Passivpartizipien angemessen als fortdauernde Zustände wieder, und „Gottesfurcht ... ein Mittel zum Gewinn“ trifft εὐσέβεια und πορισμός. Die kausale Einordnung von νομιζόντων durch „weil“ ist jedoch im Griechischen nicht ausdrücklich markiert und sollte nicht im Haupttext festgelegt werden.'
  naturalness: Der Satz ist gut verständliches modernes Standarddeutsch. Ohne „weil“ wird der Anschluss der letzten Partizipialbestimmung zugleich natürlicher und enger an der griechischen Struktur. Die Fußnotenanker sollten bei den jeweils erläuterten Ausdrücken stehen.
  terminology: „Gottesfurcht“ ist hier als positive, auf Gott ausgerichtete Haltung ein tragfähiges Äquivalent für εὐσέβεια. „Verdorben“ wahrt die scharfe, aber nicht übersteigerte Aussage von διεφθαρμένων. „Gewinn“ ist für πορισμός prägnant; „Mittel zum Gewinn“ macht die instrumentelle Nuance korrekt sichtbar.
