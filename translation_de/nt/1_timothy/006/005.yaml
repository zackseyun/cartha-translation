  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: de
  text: ständige Reibereien[a] unter Menschen, deren Denken verdorben ist und die der Wahrheit beraubt sind und meinen, Gottesfurcht sei ein Mittel zum Gewinn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „andauernde Streitigkeiten“ oder „fortwährendes Gezänk“. Das griechische Wort beschreibt fortgesetzte Reibung und bildlich anhaltenden Streit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gottesfurcht sei Gewinn“ oder „eine Quelle des Gewinns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: ständige Reibereien
  rationale: Das seltene Substantiv bezeichnet fortwährendes Aneinanderreiben und bildlich anhaltende Streitigkeiten. „Ständige Reibereien“ bewahrt sowohl das Bild als auch den wiederholten Charakter.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: deren Denken verdorben ist
  rationale: Das Perfektpartizip beschreibt einen eingetretenen, fortbestehenden Zustand. „Denken“ gibt νοῦς im Deutschen natürlich wieder und wahrt seine kognitiv-moralische Bedeutung.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: die der Wahrheit beraubt sind
  rationale: „Beraubt“ gibt die kräftige Bedeutung des passiven Partizips und den daraus bestehenden Zustand wieder, ohne festzulegen, durch wen oder auf welche Weise der Verlust geschah.
- source_word: νομιζόντων
  choice: weil sie meinen
  rationale: Das Partizip bezeichnet ihre irrige Auffassung. Die kausale Wiedergabe mit „weil“ macht den Zusammenhang im Deutschen verständlich, ohne den Inhalt der Aussage zu verstärken.
- source_word: πορισμὸν
  choice: ein Mittel zum Gewinn
  rationale: Das Substantiv kann Gewinn beziehungsweise ein Mittel zur Gewinnerzielung bezeichnen. Diese Formulierung gibt den instrumentellen Umgang mit der Gottesfurcht klar wieder.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Im Kontext der Pastoralbriefe bezeichnet εὐσέβεια eine ehrfürchtige, auf Gott ausgerichtete Lebensführung. „Gottesfurcht“ ist verständlich, würdevoll und weniger leicht auf bloß äußerliche Religionsausübung zu verengen.
theological_decisions:
- issue: Ob εὐσέβεια wahre Hingabe oder nur äußerliche Religiosität bezeichnet
  choice: Gottesfurcht
  alternative: Frömmigkeit; Religion
  rationale: Der griechische Ausdruck ist an sich positiv. Kritisiert wird nicht die Gottesfurcht selbst, sondern dass diese Menschen sie als Mittel zum Gewinn behandeln.
- issue: Wie stark der moralische Zustand von διεφθαρμένων auszudrücken ist
  choice: deren Denken verdorben ist
  alternative: die in ihrem Denken völlig verkommen sind
  rationale: „Verdorben“ erhält das scharfe moralische Urteil des Textes, ohne es durch „völlig verkommen“ über den griechischen Wortlaut hinaus zu steigern.
- issue: Wie die Beziehung des Partizips νομιζόντων zum vorhergehenden Satz wiederzugeben ist
  choice: 'kausal: „weil sie meinen“'
  alternative: 'modal oder lediglich weiterführend: „wobei sie meinen“ / „und meinen“'
  rationale: Ihre Auffassung, Gottesfurcht diene dem Gewinn, erklärt plausibel die beschriebenen Reibereien. Da das griechische Partizip die Beziehung nicht ausdrücklich markiert, wird die alternative Anschlussmöglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Reibereien“ bewahrt das griechische Bild, „Gottesfurcht“ den positiven, auf Gott gerichteten Gehalt von εὐσέβεια. Die parallelen Perfektpartizipien werden als bestehende Zustände wiedergegeben.
