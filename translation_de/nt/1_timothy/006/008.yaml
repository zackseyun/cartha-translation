  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: de
  text: Wenn wir aber Nahrung und Bedeckung[a] haben, werden wir uns damit begnügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kleidung“. Das griechische Wort kann allgemeiner das bezeichnen, was einen Menschen bedeckt, möglicherweise einschließlich einer Unterkunft.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: wenn wir … haben
  rationale: Das adverbiale Partizip bezeichnet hier den Umstand, der sich im Deutschen natürlich als allgemein bedingender Nebensatz ausdrücken lässt. „Da wir haben“ würde den Sinn zu stark als feststehende Begründung bestimmen.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel führt gegenüber dem vorher Gesagten einen milden Gegensatz beziehungsweise eine Weiterführung ein; „aber“ gibt dies knapp und natürlich wieder.
- source_word: διατροφὰς
  choice: Nahrung
  rationale: Das Wort bezeichnet das zum Lebensunterhalt Nötige, besonders Nahrung. „Nahrung“ ist im Deutschen würdevoll und etwas umfassender als „Essen“.
- source_word: σκεπάσματα
  choice: Bedeckung
  rationale: Der griechische Ausdruck bezeichnet etwas, das bedeckt, und kann Kleidung, möglicherweise auch Unterkunft, einschließen. „Bedeckung“ bewahrt diese Bedeutungsbreite, auch wenn es weniger alltäglich klingt.
- source_word: τούτοις
  choice: damit
  rationale: Das Dativpronomen verweist auf die eben genannten Grundbedürfnisse zurück. „Damit“ ist im Deutschen idiomatisch und erhält diesen Rückbezug.
- source_word: ἀρκεσθησόμεθα
  choice: werden wir uns begnügen
  rationale: Die Form ist ein Futur und bezeichnet, dass das Genannte genügen soll beziehungsweise man damit zufrieden sein wird. Die Wiedergabe wahrt den Indikativ und macht daraus keine ausdrückliche Aufforderung.
theological_decisions:
- issue: Bedeutungsumfang von σκεπάσματα
  choice: Der Oberbegriff „Bedeckung“, der Kleidung und möglicherweise Unterkunft einschließt
  alternative: Nur „Kleidung“ oder nur „Unterkunft“
  rationale: Der Vers spricht vom Genügen an den grundlegenden Lebensbedürfnissen. Da der griechische Begriff nicht sicher auf Kleidung allein oder Unterkunft allein beschränkt ist, bleibt die Übersetzung bewusst offen.
- issue: Aussageweise von ἀρκεσθησόμεθα
  choice: 'Futurischer Indikativ: „werden wir uns begnügen“'
  alternative: 'Aufforderung: „Lasst uns damit zufrieden sein“'
  rationale: Die griechische Form ist formal ein Futur Indikativ. Eine hortative Wiedergabe wäre möglich als Deutung der pragmatischen Kraft, würde aber die grammatische Aussageform stärker verändern.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Bedeckung“ ist bewusst etwas ungewohnt, um die Breite des griechischen Ausdrucks nicht vorschnell auf Kleidung oder Unterkunft einzuengen.
