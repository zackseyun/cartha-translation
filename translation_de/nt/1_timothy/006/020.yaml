source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: de
  text: Timotheus, bewahre das dir anvertraute Gut. Wende dich ab von unheiligen, leeren Reden und unheiligen Gegensätzen[a] der fälschlich so genannten Erkenntnis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einwänden«, »Gegenbehauptungen« oder »Widersprüchen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der sogenannten Erkenntnis«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: O Timotheus
  rationale: Das deutsche „O“ bewahrt den feierlichen und eindringlichen Ton der direkten Anrede, ohne altertümlich unverständlich zu sein.
- source_word: παραθήκην
  choice: das dir anvertraute Gut
  rationale: παραθήκη bezeichnet etwas, das jemandem zur sicheren Verwahrung anvertraut wurde. „Anvertrautes Gut“ erhält diesen Gedanken, ohne den Inhalt näher festzulegen, als es der griechische Text tut.
- source_word: φύλαξον
  choice: bewahre
  rationale: „Bewahre“ drückt die aufmerksame, treue Erhaltung eines anvertrauten Gutes aus und passt im Deutschen idiomatisch zum Objekt.
- source_word: ἐκτρεπόμενος
  choice: Wende dich ab von
  rationale: Die eigenständige Aufforderung gibt die begleitende Handlungsanweisung des Partizips natürlich wieder und bewahrt das Bild des Sich-Abwendens.
- source_word: βεβήλους κενοφωνίας
  choice: das unheilige, leere Gerede
  rationale: „Unheilig“ gibt den Gegensatz von βέβηλος zum Heiligen verständlich wieder; „leeres Gerede“ erfasst den hohlen, gehaltlosen Charakter von κενοφωνία.
- source_word: ἀντιθέσεις
  choice: Gegenbehauptungen
  rationale: Der Ausdruck kann Gegensätze, Einwände oder entgegenstehende Behauptungen bezeichnen. „Gegenbehauptungen“ passt zum Zusammenhang sprachlicher Auseinandersetzung, ohne zwingend logische Widersprüche zu unterstellen.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: dessen, was fälschlich »Erkenntnis« genannt wird
  rationale: Die Formulierung macht deutlich, dass die Bezeichnung „Erkenntnis“ nach Aussage des Textes zu Unrecht getragen wird, und lässt den Bezug des Genitivs auf Gerede und Gegenbehauptungen bestehen.
theological_decisions:
- issue: Inhalt der παραθήκη
  choice: Allgemein als „das dir anvertraute Gut“ wiedergegeben
  alternative: das Evangelium; die apostolische Lehre; der Timotheus erteilte Auftrag
  rationale: Der Kontext legt eine anvertraute apostolische Botschaft oder einen entsprechenden Auftrag nahe, doch der Vers benennt den Inhalt nicht ausdrücklich. Die Übersetzung wahrt daher die Metapher und legt sich nicht auf eine engere Deutung fest.
- issue: Charakter der ψευδώνυμος γνώσις
  choice: Als etwas wiedergegeben, das fälschlich „Erkenntnis“ genannt wird
  alternative: sogenannte Erkenntnis
  rationale: Die gewählte Form bringt die im Adjektiv enthaltene negative Beurteilung ausdrücklich zum Ausdruck, ohne die konkrete historische oder theologische Identität dieser „Erkenntnis“ zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Anrede „O Timotheus“ bewahrt die Eindringlichkeit des griechischen Vokativs. Kurze Hauptsätze sorgen für Klarheit; die Anführungszeichen um „Erkenntnis“ verdeutlichen die bestrittene Bezeichnung.
