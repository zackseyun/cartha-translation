revisions:
- from: O Timotheus, bewahre das dir anvertraute Gut. Wende dich ab von dem unheiligen, leeren Gerede und den Gegenbehauptungen[a] dessen, was fälschlich »Erkenntnis« genannt wird.[b]
  to: Timotheus, bewahre das dir anvertraute Gut. Wende dich ab von unheiligen, leeren Reden und unheiligen Gegensätzen[a] der fälschlich so genannten Erkenntnis.[b]
  rationale: Die Revision macht sichtbar, dass „unheilig“ beide im Griechischen pluralischen Bezugswörter qualifiziert, und ersetzt die schwerfällige Formulierung „dessen, was …“ durch eine klare, quellentreue Genitivverbindung. Die direkte Anrede wird in modernes Standarddeutsch überführt. Der Inhalt des anvertrauten Gutes und die konkrete historische Identität der „Erkenntnis“ bleiben ausdrücklich offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:43:28Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutungen sind weitgehend getroffen. Allerdings steht βεβήλους im Griechischen im Plural und bezieht sich auf beide folgenden Substantive; die vorliegende deutsche Form lässt „unheilig“ grammatisch nur das singuläre „Gerede“ bestimmen. Außerdem ist „Gegenbehauptungen dessen, was …“ im Deutschen eine unnötig schwere und semantisch weniger klare Anbindung des Genitivs.
  naturalness: „O Timotheus“ wirkt im modernen Standarddeutsch unnötig altertümlich. Die direkte Anrede ohne Partikel ist natürlich und wahrt den Nachdruck im Kontext. Die revidierte Fassung liest flüssiger, ohne den knappen, mahnenden Charakter zu verlieren.
  terminology: „das anvertraute Gut“ und „bewahre“ geben παραθήκη und φύλαξον angemessen wieder. „fälschlich so genannte Erkenntnis“ gibt ψευδώνυμος präzise wieder, ohne die historische Identität der bezeichneten Erkenntnis festzulegen. „Gegensätze“ bewahrt die lexikalische Offenheit von ἀντιθέσεις besser als die stärker festlegende Wiedergabe „Gegenbehauptungen“.
  issues:
  - severity: medium
    issue: Der Begriff „unheilig“ ist in der deutschen Satzstruktur nicht eindeutig auf beide griechischen Bezugswörter bezogen.
    rationale: βεβήλους steht im Plural und qualifiziert sowohl κενοφωνίας als auch ἀντιθέσεις. Eine deutsche Fassung sollte diesen gemeinsamen Bezug erkennbar machen.
  - severity: low
    issue: „O Timotheus“ ist für modernes Standarddeutsch zu stark stilisiert.
    rationale: Die vokativische Anrede kann im Deutschen ohne „O“ idiomatisch und eindringlich wiedergegeben werden; kein Bedeutungsverlust entsteht.
  - severity: medium
    issue: „Gegenbehauptungen dessen, was fälschlich ‚Erkenntnis‘ genannt wird“ ist syntaktisch schwerfällig und verdeckt die genitivische Zuordnung.
    rationale: Der griechische Genitiv lässt sich klarer als „der fälschlich so genannten Erkenntnis“ anschließen. „Gegensätze“ bleibt dabei als Übersetzung von ἀντιθέσεις offen genug.
  revised_text: Timotheus, bewahre das dir anvertraute Gut. Wende dich ab von unheiligen, leeren Reden und unheiligen Gegensätzen[a] der fälschlich so genannten Erkenntnis.[b]
  revised_footnotes:
