  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: de
  text: Du aber, Mann Gottes, fliehe vor diesen Dingen! Strebe vielmehr nach Gerechtigkeit[a], Gottesfurcht, Glauben[b], Liebe, standhaftem Ausharren und Sanftmut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Rechtschaffenheit oder gerechtes Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Treue oder Vertrauen.'
    reason: lexical_alternative
  - marker: c
    text: Das seltene griechische Wort kann auch mit „Milde“, „Nachsicht“ oder „geduldige Sanftmut“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Du aber
  rationale: Bewahrt das betonte Personalpronomen und den deutlichen Gegensatz zum Vorhergehenden.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: Mann Gottes
  rationale: Gibt die direkte Anrede an Timotheus sowie die in der Bibel geläufige Bezeichnung wieder; das im Deutschen unnatürlich feierliche „o“ wird nicht eigens ausgedrückt.
- source_word: ταῦτα φεῦγε
  choice: fliehe vor diesen Dingen
  rationale: Der kräftige Imperativ bezeichnet nicht bloßes Meiden, sondern entschiedenes und fortgesetztes Abstandnehmen von den zuvor genannten Verfehlungen.
- source_word: δίωκε δὲ
  choice: Strebe vielmehr nach
  rationale: Drückt die aktive, beharrliche Ausrichtung auf die folgenden Tugenden aus und wahrt den Gegensatz zu „fliehe“.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Deckt im Deutschen sowohl rechtschaffenes Verhalten als auch gerechtes Handeln ab und lässt die genaue Akzentsetzung des griechischen Begriffs offen.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Bezeichnet in den Pastoralbriefen eine ehrfürchtige, auf Gott ausgerichtete Lebenshaltung; „Gottesfurcht“ ist verständlich und weniger missverständlich als bloße äußere „Frömmigkeit“.
- source_word: πίστιν
  choice: Glauben
  rationale: Ist die übliche Wiedergabe von πίστις; da in einer Tugendlehre auch Treue oder Vertrauen gemeint sein kann, werden diese Möglichkeiten in einer Fußnote genannt.
- source_word: ἀγάπην
  choice: Liebe
  rationale: Natürliche und sachlich passende Standardwiedergabe in der Tugendreihe.
- source_word: ὑπομονήν
  choice: standhaftes Ausharren
  rationale: Erfasst beharrliche Beständigkeit unter Belastung deutlicher als das möglicherweise passive oder zeitlich begrenzte „Geduld“.
- source_word: πραϋπαθίαν
  choice: Sanftmut
  rationale: Die seltene Wortbildung bezeichnet eine milde, geduldig beherrschte Haltung; „Sanftmut“ ist knapp und für eine Tugendreihe geeignet, während weitere Nuancen in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Geschlechtsspezifische Anrede ὦ ἄνθρωπε θεοῦ
  choice: Mann Gottes
  alternative: Mensch Gottes
  rationale: Die Anrede gilt dem männlichen Adressaten Timotheus und entspricht einer geläufigen biblischen Bezeichnung. Die Alternative „Mensch Gottes“ wäre lexikalisch möglich, würde hier aber den persönlichen und traditionellen Titel weniger klar wiedergeben.
- issue: Bedeutungsbreite von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Im Tugendkatalog kann der Ausdruck sowohl die persönliche Rechtschaffenheit als auch gerechtes Handeln bezeichnen. Der Haupttext wahrt diese Breite, die Fußnote nennt die stärker ethische Akzentuierung.
- issue: Bedeutungsbreite von πίστις
  choice: Glauben
  alternative: Treue oder Vertrauen
  rationale: Der Kontext legt nicht eindeutig fest, ob vor allem Glaube, Vertrauen oder verlässliche Treue gemeint ist. Deshalb bleibt die übliche Wiedergabe im Haupttext, ohne die anderen Möglichkeiten auszuschließen.
- issue: Bedeutung des seltenen Ausdrucks πραϋπαθία
  choice: Sanftmut
  alternative: Milde, Nachsicht oder geduldige Sanftmut
  rationale: Da das seltene Wort Milde mit geduldiger Selbstbeherrschung verbinden kann, wird seine Bedeutung nicht auf eine einzige Nuance verengt; die Alternativen werden ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftigen Imperativen. Die Satzstruktur macht den Gegensatz zwischen dem entschiedenen Fliehen und dem aktiven Streben deutlich. Die Tugendreihe bleibt knapp; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten bewahrt.
