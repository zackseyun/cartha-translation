  terminology: „Gerechtigkeit“, „Gottesfurcht“, „Glauben“, „Liebe“, „standhaftes Ausharren“ und „Sanftmut“ sind im Kontext sachgerecht. Die Fußnoten erhalten bei δικαιοσύνη, πίστις und dem seltenen πραϋπαθία relevante Bedeutungsnuancen, ohne den Haupttext konfessionell oder interpretativ einzuengen. Die Anker stehen jeweils bei dem betreffenden Ausdruck.
