  text: Gutes zu tun, reich zu sein an guten Werken, freigebig und bereit zum Teilen zu sein,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: Gutes zu tun
  rationale: Die substantivierte Form „Gutes“ gibt die verbale Aufforderung knapp und natürlich wieder, ohne sie auf einzelne Wohltaten zu verengen.
- source_word: πλουτεῖν
  choice: reich zu sein
  rationale: Die Formulierung bewahrt das Bild des Reichtums und damit den bewussten Gegensatz zum materiellen Reichtum im Zusammenhang.
- source_word: ἐν ἔργοις καλοῖς
  choice: an guten Werken
  rationale: „An guten Werken reich sein“ ist im Deutschen idiomatisch und gibt den Bereich an, in dem der Reichtum bestehen soll.
- source_word: εὐμεταδότους
  choice: freigebig
  rationale: Das Adjektiv bezeichnet die Bereitschaft, von den eigenen Mitteln abzugeben; „freigebig“ ist prägnant, modern und bewahrt diesen Akzent.
- source_word: κοινωνικούς
  choice: bereit zum Teilen
  rationale: Die Wendung bringt die auf Gemeinschaft und Teilhabe gerichtete Bereitschaft zum Ausdruck und vermeidet missverständliche moderne Bedeutungen von „gemeinschaftlich“.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: freigebig und bereit zum Teilen zu sein
  rationale: 'Die beiden verwandten, aber nicht identischen Gedanken bleiben erhalten: großzügiges Geben und eine grundsätzliche Bereitschaft, mit anderen zu teilen.'
