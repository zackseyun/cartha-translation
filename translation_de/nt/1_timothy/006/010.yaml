  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: de
  text: Denn die Liebe zum Geld ist eine Wurzel für alle Arten von Übeln.[a] Aus Verlangen nach Geld sind einige vom Glauben abgeirrt[b] und haben sich selbst mit vielen Qualen durchbohrt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Denn die Liebe zum Geld ist die Wurzel allen Übels.“ Der griechische Wortlaut lässt sich natürlicher als „eine Wurzel für alle Arten von Übeln“ verstehen und besagt dann nicht, dass jedes Übel nur eine einzige Ursache hat.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „sind vom Glauben abgekommen“. Gemeint ist hier wahrscheinlich der christliche Glaube als Glaubensüberzeugung; zugleich kann die persönliche Glaubensbeziehung mitgemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: „Qualen“ kann hier schwere Schmerzen, Kummer oder seelische Leiden bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: eine Wurzel
  rationale: Das artikellose Prädikatsnomen vor dem Verb lässt sich hier am natürlichsten unbestimmt wiedergeben. Damit wird die Geldliebe als eine Ursache vieler Übel bezeichnet, nicht zwingend als einzige Ursache jedes Übels.
- source_word: πάντων τῶν κακῶν
  choice: aller möglichen Übel
  rationale: Die Formulierung gibt den weiten, nach Arten gegliederten Sinn des griechischen Plurals idiomatisch wieder, ohne eine ausnahmslose Aussage über jedes einzelne Übel zu erzwingen.
- source_word: φιλαργυρία
  choice: die Liebe zum Geld
  rationale: Die Wendung bewahrt die konkrete Bedeutung des griechischen Ausdrucks, der wörtlich die Liebe zu Geld beziehungsweise Silber bezeichnet. „Geldgier“ wäre knapper, aber stärker wertend und allgemeiner.
- source_word: ἧς … ὀρεγόμενοι
  choice: Im Verlangen danach
  rationale: Das Relativpronomen bezieht sich auf die Geldliebe; das Partizip bezeichnet ein starkes Ausstrecken oder Verlangen. Die deutsche Fassung ist natürlich und erhält den ursächlichen beziehungsweise begleitenden Zusammenhang.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: sind … vom Glauben abgeirrt
  rationale: „Abirren“ bewahrt das Bild des Abkommens von einem Weg. „Vom Glauben“ kann im Deutschen den christlichen Glauben als Glaubensinhalt bezeichnen, ohne die mögliche persönliche Dimension völlig auszuschließen.
- source_word: περιέπειραν
  choice: haben sich selbst … durchbohrt
  rationale: Das starke Bild des Durchbohrens oder Durchstechens wird beibehalten und nicht zu einem bloßen „sich zufügen“ abgeschwächt.
- source_word: ὀδύναις πολλαῖς
  choice: mit vielen Qualen
  rationale: „Qualen“ umfasst schwere körperliche oder seelische Schmerzen und passt zugleich zum drastischen Bild des Durchbohrens.
theological_decisions:
- issue: Reichweite der Aussage über Geldliebe und das Böse
  choice: Die Liebe zum Geld ist eine Wurzel aller möglichen Übel.
  alternative: Die Liebe zum Geld ist die Wurzel allen Übels.
  rationale: Das artikellose ῥίζα und der Plural πάντων τῶν κακῶν sprechen dafür, die Aussage nicht so zu formulieren, als sei Geldliebe ausnahmslos die einzige Ursache jedes Bösen. Die traditionelle absolute Wiedergabe wird in der Fußnote genannt.
- issue: Bedeutung von τῆς πίστεως
  choice: „vom Glauben“ bezeichnet im Zusammenhang wahrscheinlich den christlichen Glauben, lässt im Deutschen aber eine persönliche Glaubensdimension mitschwingen.
  alternative: „von ihrem Glauben“ als ausschließlich subjektives Vertrauen
  rationale: Der Artikel und der Sprachgebrauch der Pastoralbriefe stützen den objektiven Sinn als christlicher Glaube beziehungsweise Glaubensüberzeugung. Die deutsche Formulierung vermeidet dennoch eine unnötig starre Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das kräftige Bild des Durchbohrens bleibt erhalten. „Liebe zum Geld“ ist transparent und näher am griechischen Ausdruck als das breitere „Geldgier“.
