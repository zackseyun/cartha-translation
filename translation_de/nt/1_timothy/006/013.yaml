id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: de
  text: 'Ich gebiete dir vor Gott, der allem Leben gibt[a], und vor Christus Jesus[b], der vor Pontius Pilatus das gute Bekenntnis bezeugt hat[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der alles am Leben erhält“ oder „der alles lebendig macht“. Das griechische Wort kann sowohl das Geben als auch das Erhalten von Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Christus“ bedeutet „Messias“, also „der Gesalbte“.
    reason: title_clarification
  - marker: c
    text: 'Die griechische Wendung kann auch zeitlich verstanden werden: „der unter Pontius Pilatus“ beziehungsweise „zur Zeit des Pontius Pilatus das gute Bekenntnis bezeugt hat“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Ich gebiete dir
  rationale: Das Verb bezeichnet hier eine feierliche, verbindliche Weisung. „Ich gebiete dir“ bewahrt Gewicht und Direktheit der Formulierung.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt knapp und natürlich den Gedanken wieder, dass der Auftrag in der Gegenwart Gottes und Christi erteilt wird.
- source_word: τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα
  choice: Gott, der allem Leben gibt
  rationale: ζῳογονέω kann Leben geben, lebendig machen oder am Leben erhalten bedeuten. Die Hauptfassung bleibt weit genug, um Gottes umfassendes lebenspendendes Wirken auszudrücken.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Christus Jesus
  rationale: Im modernen deutschen Bibelregister ist „Christus“ als verständlicher messianischer Titel etabliert und klingt in dieser festen Verbindung natürlich und würdig.
- source_word: τοῦ μαρτυρήσαντος
  choice: der … bezeugt hat
  rationale: Das Verb bezeichnet ein öffentliches Zeugnis; „bezeugt hat“ verbindet sich im Deutschen natürlich mit „Bekenntnis“ und bewahrt den feierlich-rechtlichen Klang.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: vor Pontius Pilatus
  rationale: Im Zusammenhang des Zeugnisses bezeichnet die Wendung am wahrscheinlichsten das Auftreten in der Gegenwart des Pilatus; zeitliche Deutungen wie „unter Pontius Pilatus“ bleiben grammatisch möglich.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: das gute Bekenntnis
  rationale: Die wörtlich-nahe Formulierung erhält die Verbindung zum Bekenntnis Timotheus im Kontext und gibt καλός ohne unnötige Ausdeutung wieder.
theological_decisions:
- issue: Bedeutung von ζῳογονοῦντος
  choice: der allem Leben gibt
  alternative: der alles am Leben erhält; der alles lebendig macht
  rationale: Der griechische Ausdruck kann sowohl das Schenken beziehungsweise Hervorbringen als auch das Erhalten des Lebens hervorheben. Die Hauptfassung legt sich nicht unnötig auf nur einen Aspekt fest; die Alternativen werden in der Fußnote bewahrt.
- issue: Wiedergabe von Χριστός
  choice: Christus Jesus
  alternative: Messias Jesus
  rationale: „Christus“ ist im Deutschen als Titel eingebürgert und in der Verbindung „Christus Jesus“ idiomatisch. Die Fußnote macht die Bedeutung des griechischen Titels ausdrücklich sichtbar.
- issue: Bezug von ἐπὶ Ποντίου Πιλάτου
  choice: vor Pontius Pilatus
  alternative: unter Pontius Pilatus; zur Zeit des Pontius Pilatus
  rationale: Der Gerichts- und Zeugniszusammenhang spricht für die persönliche Gegenwart des Pilatus, doch die Präposition kann auch eine zeitliche Einordnung ausdrücken; diese Mehrdeutigkeit wird kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem feierlichen „Ich gebiete dir“. Der Doppelbezug von ἐνώπιον wird im Deutschen durch die Wiederholung von „vor“ verdeutlicht. Der abschließende Doppelpunkt zeigt, dass der Satz in Vers 14 weitergeführt wird.
