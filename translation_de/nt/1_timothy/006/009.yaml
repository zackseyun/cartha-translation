  source_fidelity: 'Die Übersetzung gibt die griechische Struktur und Aussage zuverlässig wieder: Das auf Reichtum gerichtete Wollen, das Hineingeraten in Versuchung, Falle und schädliche Begierden sowie deren versenkende Wirkung auf Menschen bleiben erhalten. „Verderben und Untergang“ wahrt die zweigliedrige, intensivierende Schlussformulierung, ohne deren Reichweite dogmatisch zu verengen.'
