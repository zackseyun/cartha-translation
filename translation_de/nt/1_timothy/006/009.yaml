  terminology: „Reich werden will“, „Versuchung“, „Falle“, „Begierden“, „Verderben“ und „Untergang“ sind kontextgerecht und im würdigen modernen Register angemessen. Insbesondere vermeidet die Schlussformulierung eine nicht vom Vers selbst geforderte Festlegung auf ewige Verdammnis.
