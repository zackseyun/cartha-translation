id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: de
  text: Wer aber reich werden will, gerät in Versuchung, in eine Falle und in viele unvernünftige und schädliche Begierden. Diese lassen die Menschen in Verderben und Untergang versinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: Wer aber reich werden will
  rationale: βουλόμενοι bezeichnet hier ein auf Reichtum gerichtetes Wollen; πλουτεῖν kann den angestrebten Übergang zum Reichsein einschließen. „Reich werden will“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: ἐμπίπτουσιν εἰς πειρασμόν
  choice: gerät in Versuchung
  rationale: ἐμπίπτω beschreibt das Hineingeraten in eine nachteilige Lage; im Kontext ist πειρασμός als Verlockung zum Bösen zu verstehen.
- source_word: παγίδα
  choice: eine Falle
  rationale: „Falle“ bewahrt das Bild einer verborgenen Gefahr und ist im heutigen Deutsch natürlicher als „Schlinge“.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: viele unvernünftige und schädliche Begierden
  rationale: ἐπιθυμίαι meint starke Wünsche oder Begierden. „Unvernünftig“ gibt ἀνοήτους präzise wieder, „schädlich“ die verletzende Wirkung von βλαβεράς.
- source_word: αἵτινες βυθίζουσι
  choice: Diese lassen … versinken
  rationale: Das Relativpronomen bezieht sich grammatisch auf die Begierden. βυθίζω bezeichnet anschaulich das Versenken oder Untertauchenlassen.
- source_word: τοὺς ἀνθρώπους
  choice: die Menschen
  rationale: ἄνθρωποι ist hier generisch und bezeichnet Menschen unabhängig vom Geschlecht.
- source_word: εἰς ὄλεθρον καὶ ἀπώλειαν
  choice: in Verderben und Untergang
  rationale: Die beiden nahe verwandten Begriffe werden mit zwei unterschiedlichen deutschen Wörtern wiedergegeben, damit die eindringliche Häufung erhalten bleibt, ohne beide völlig gleichzusetzen.
theological_decisions:
- issue: Ob ὄλεθρον καὶ ἀπώλειαν ausdrücklich ewige Verdammnis bezeichnet
  choice: „Verderben und Untergang“ ohne ausdrückliche Festlegung auf ewige Verdammnis
  alternative: „Verderben und Verdammnis“ als ausdrücklicher Hinweis auf das endgültige Gericht
  rationale: Die Formulierung warnt vor schwerwiegenden zerstörerischen Folgen, legt in diesem Vers deren zeitliche oder eschatologische Reichweite aber nicht ausdrücklich fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular „Wer … will, gerät“ bildet die griechische substantivierte Pluralpartizipialkonstruktion idiomatisch-generisch ab. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; der Bezug von αἵτινες auf die Begierden bleibt durch „Diese“ eindeutig.
