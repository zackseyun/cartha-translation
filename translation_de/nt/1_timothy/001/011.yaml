  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: de
  text: nach dem Evangelium der Herrlichkeit des seligen Gottes[a], das mir anvertraut wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „nach dem herrlichen Evangelium des seligen Gottes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: nach
  rationale: Mit dem Akkusativ bezeichnet κατά hier den Maßstab beziehungsweise die Übereinstimmung; „nach“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: Der im paulinischen Zusammenhang etablierte und allgemein verständliche Begriff bewahrt das theologische Gewicht des griechischen Wortes.
- source_word: τῆς δόξης
  choice: von der Herrlichkeit
  rationale: Die Genitivfügung wird möglichst formal bewahrt, damit sie nicht vorschnell zu einem bloßen Adjektiv („herrlich“) aufgelöst wird.
- source_word: μακαρίου
  choice: seligen
  rationale: „Selig“ ist bei Gott eine würdige und theologisch angemessene Wiedergabe; „glücklich“ wäre hier zu alltäglich und „vom Glück begünstigt“ sachlich unpassend.
- source_word: θεοῦ
  choice: Gottes
  rationale: Direkte Wiedergabe des Genitivs von θεός.
- source_word: ὃ
  choice: das
  rationale: Das Relativpronomen bezieht sich auf „Evangelium“; das deutsche Neutrum entspricht diesem Bezugswort.
- source_word: ἐπιστεύθην
  choice: mir anvertraut worden ist
  rationale: Der Aorist Passiv von πιστεύω hat hier die Bedeutung „anvertrauen“. Die unpersönliche deutsche Passivkonstruktion gibt den Bezug des Relativpronomens natürlich wieder.
- source_word: ἐγώ
  choice: mir
  rationale: Das ausdrückliche griechische Pronomen hebt Paulus als den Empfänger des anvertrauten Evangeliums hervor. Im Deutschen wird der Bezug durch „mir“ klar ausgedrückt, ohne künstliche Hervorhebung.
theological_decisions:
- issue: Genitivverhältnis in τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: das Evangelium von der Herrlichkeit des seligen Gottes
  alternative: das herrliche Evangelium des seligen Gottes
  rationale: Die Hauptfassung erhält die Genitivstruktur und lässt offen, ob „Herrlichkeit“ als Inhalt, Kennzeichen oder Zugehörigkeit des Evangeliums verstanden wird. Die idiomatischere adjektivische Deutung steht in der Fußnote.
- issue: Bedeutung von ἐπιστεύθην
  choice: mir anvertraut worden ist
  alternative: ich geglaubt habe
  rationale: Im Passiv und mit dem Evangelium als anvertrauter Sache bedeutet πιστεύω hier „anvertrauen“, nicht „glauben“; dies entspricht auch dem paulinischen Motiv eines übertragenen Auftrags.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivfügung bleibt bewusst erhalten, während die Fußnote eine geläufigere adjektivische Wiedergabe nennt.
