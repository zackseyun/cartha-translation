  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: de
  text: Zu ihnen gehören Hymenäus und Alexander. Ich habe sie dem Satan ausgeliefert,[a] damit sie erzogen werden, nicht zu lästern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „übergeben“. Die Wendung bezeichnet offenbar eine schwere Maßnahme mit korrigierendem Ziel; der genaue Vorgang wird hier nicht erklärt.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann „erzogen“, „unterwiesen“, „geschult“, „zurechtgewiesen“ oder „gezüchtigt werden“ bedeuten. Es bezeichnet eine auf Korrektur und Veränderung zielende Formung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Zu ihnen gehören
  rationale: Die Wendung gibt den partitiven Bezug auf die zuvor genannte Gruppe idiomatisch und präzise wieder.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Hymenäus und Alexander
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Namensformen.
- source_word: οὓς παρέδωκα
  choice: Ich habe sie … ausgeliefert
  rationale: Das Perfekt stellt die vollzogene Handlung mit ihrer fortdauernden Bedeutung natürlich dar; „ausgeliefert“ bewahrt die starke Aussage von παραδίδωμι.
- source_word: τῷ Σατανᾷ
  choice: dem Satan
  rationale: „Satan“ ist im Deutschen die etablierte Wiedergabe der hier als Bezeichnung gebrauchten Form.
- source_word: ἵνα παιδευθῶσι
  choice: damit sie durch Zurechtweisung lernen
  rationale: Die Formulierung bewahrt sowohl den lehrenden als auch den korrigierend-disziplinierenden Sinn von παιδεύω und passt zum erzieherischen Zweck der Aussage.
- source_word: μὴ βλασφημεῖν
  choice: nicht mehr zu lästern
  rationale: „lästern“ gibt die religiöse Schwere von βλασφημέω in verständlichem Deutsch wieder; „nicht mehr“ bezeichnet hier das Abgewöhnen der bereits ausgeübten Handlung.
theological_decisions:
- issue: Bedeutung von „dem Satan ausgeliefert“
  choice: Die bildstarke Wendung bleibt im Haupttext unaufgelöst; der Zweck wird als korrigierend und erzieherisch wiedergegeben.
  alternative: Eine konkrete Form des Gemeindeausschlusses, eine wundersame körperliche Strafe oder eine endgültige Verdammung ausdrücklich festzulegen.
  rationale: Der Zwecksatz weist auf Korrektur hin, erklärt aber weder den genauen Vorgang noch schließt er alle möglichen Begleitfolgen ausdrücklich aus. Daher darf die Übersetzung keinen bestimmten kirchlichen Mechanismus oder eine endgültige Verurteilung hineinlesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den logischen Zusammenhang zu verändern. Die starke Wendung „dem Satan ausgeliefert“ und ihre theologische Spannung bleiben erhalten; der erzieherische Aspekt von παιδεύω wird ohne konfessionelle Festlegung ausgedrückt.
