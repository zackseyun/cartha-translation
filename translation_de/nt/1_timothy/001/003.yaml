id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: de
  text: Wie ich dich bat, in Ephesus zu bleiben, als ich nach Mazedonien reiste, damit du einige anweist, keine andere Lehre zu lehren,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einigen gebietest, keine andere Lehre zu lehren“.'
    reason: „Gebieten“ gibt die mögliche stärkere, autoritative Nuance von παραγγέλλω wieder.
lexical_decisions:
- source_word: Καθὼς
  choice: Wie
  rationale: Bewahrt den anknüpfenden und vergleichenden Charakter des griechischen Satzanfangs. Da der Gedanke über Vers 3 hinaus weitergeführt wird, bleibt auch im Deutschen die offene Satzfügung erhalten.
- source_word: παρεκάλεσά
  choice: bat
  rationale: παρακαλέω bezeichnet hier eine nachdrückliche Bitte oder Aufforderung. „bat“ gibt den persönlichen Ernst wieder, ohne daraus bereits einen ausdrücklichen Befehl zu machen.
- source_word: προσμεῖναι
  choice: zu bleiben
  rationale: Das Verb bezeichnet das weitere Verweilen an einem Ort; „zu bleiben“ ist im modernen Deutschen klar und natürlich.
- source_word: ἐν Ἐφέσῳ
  choice: in Ephesus
  rationale: Übliche deutsche Wiedergabe des Ortsnamens und der Präpositionalfügung.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: als ich nach Mazedonien weiterreiste
  rationale: Das Partizip beschreibt die Reise des Sprechers als zeitlichen Begleitumstand. „weiterreiste“ passt zum Zusammenhang, ohne eine genauere Reiseroute vorauszusetzen.
- source_word: ἵνα
  choice: damit
  rationale: Kennzeichnet den Zweck der Aufforderung, in Ephesus zu bleiben.
- source_word: παραγγείλῃς
  choice: du einige anweist
  rationale: παραγγέλλω meint eine verbindliche, autoritative Weisung. „anweisen“ ist gegenwärtiges, verständliches Deutsch und stärker als ein bloßer Rat, ohne unnötig schroff zu wirken.
- source_word: τισὶν
  choice: einige
  rationale: Bezeichnet bestimmte, aber nicht namentlich genannte Personen. Der knappe deutsche Ausdruck wahrt diese Unbestimmtheit.
- source_word: ἑτεροδιδασκαλεῖν
  choice: keine abweichende Lehre zu verbreiten
  rationale: Das zusammengesetzte Verb bezeichnet das Lehren einer andersartigen, von der maßgeblichen Lehre abweichenden Lehre. „abweichende Lehre“ bewahrt diese Wertung, ohne das interpretativ stärkere Wort „Irrlehre“ einzusetzen; „verbreiten“ vermeidet die schwerfällige Wendung „eine Lehre lehren“.
theological_decisions:
- issue: Stärke der Weisung in παραγγείλῃς
  choice: „anweist“ als verbindliche Beauftragung
  alternative: „befiehlst“
  rationale: Der Zusammenhang setzt echte Autorität voraus, doch das Verb muss im Deutschen nicht zwingend mit dem schärfsten möglichen Ausdruck wiedergegeben werden. „anweisen“ wahrt den verbindlichen Charakter.
- issue: Bewertung der mit ἑτεροδιδασκαλεῖν bezeichneten Lehre
  choice: „abweichende Lehre“
  alternative: „Irrlehre“ oder „etwas anderes“
  rationale: „Irrlehre“ würde die Bewertung stärker ausformulieren, als es das Wort allein verlangt; „etwas anderes“ wäre dagegen zu unbestimmt. „Abweichende Lehre“ hält den Bezug auf eine maßgebliche apostolische Lehre fest, ohne die Aussage konfessionell näher zu bestimmen.
- issue: Offene Syntax am Versanfang
  choice: Den mit Καθὼς eröffneten, noch nicht abgeschlossenen Satzbau bewahren
  alternative: Den Vers zu einem selbstständigen deutschen Hauptsatz umformen
  rationale: Der griechische Text führt den Gedankengang über die Versgrenze hinaus. Die offene Konstruktion verhindert, dass der Einzelvers künstlich als abgeschlossener Satz erscheint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt allgemein verständlich, wahrt aber die autoritative Situation und den über die Versgrenze hinaus offenen Satzbau. Das Komma am Ende zeigt, dass der Satz im folgenden Vers weitergeht.
