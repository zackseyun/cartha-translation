    rationale: Der Ausdruck bezeichnet Gesetzeslehrer; eine beanspruchte maßgebliche Autorität ist als Kontextdeutung möglich, aber nicht Bestandteil der Wortbedeutung und muss in der Anmerkung nicht hinzugefügt werden.
