  source_fidelity: Der Haupttext gibt θέλοντες εἶναι, νομοδιδάσκαλοι, die doppelte Verneinung und διαβεβαιοῦνται sachgerecht wieder. „Gesetzeslehrer“ wahrt die im Griechischen nicht ausdrücklich spezifizierte Bezeichnung des Gesetzes. Die Fußnote b lässt jedoch im zweiten Glied den durch περὶ ausgedrückten Bezug auf die Sachverhalte aus und sollte dies bewahren.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „so selbstsicher Behauptungen aufstellen“ ist etwas schwerfällig; „mit Nachdruck Behauptungen aufstellen“ ist idiomatischer und gibt die kräftige Behauptung von διαβεβαιοῦνται präzise wieder.
  terminology: „Gesetzeslehrer“ ist als knappe Wiedergabe von νομοδιδάσκαλοι passend. Die kulturelle Erläuterung darf den wahrscheinlichen Torabezug nennen, sollte aber nicht stärker als der Haupttext festlegen, dass die Betreffenden eine maßgebliche Lehrbefugnis beanspruchten.
