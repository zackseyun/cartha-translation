  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: de
  text: Sie wollen Gesetzeslehrer[a] sein, verstehen aber weder, was sie sagen, noch, worüber sie mit Nachdruck Behauptungen aufstellen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Gesetzeslehrer“ sind wahrscheinlich Menschen gemeint, die die jüdische Tora zu lehren beanspruchten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „verstehen aber weder, was sie sagen, noch, worüber sie mit Nachdruck Behauptungen aufstellen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: Sie wollen … sein
  rationale: Die Verbindung aus Partizip und Infinitiv bezeichnet ihr fortdauerndes Bestreben; die finite deutsche Form schließt natürlich an den vorigen Vers an.
- source_word: νομοδιδάσκαλοι
  choice: Gesetzeslehrer
  rationale: Das deutsche Kompositum gibt das griechische Kompositum knapp wieder und lässt im Haupttext offen, ob das Gesetz näher als Tora beziehungsweise mosaisches Gesetz bezeichnet werden soll.
- source_word: μὴ νοοῦντες
  choice: verstehen aber … nicht
  rationale: Das adversative „aber“ bringt den im Kontext angelegten Gegensatz zwischen ihrem Anspruch und ihrem mangelnden Verständnis idiomatisch zum Ausdruck.
- source_word: μήτε … μήτε
  choice: weder … noch
  rationale: Entspricht der korrelativen Verneinung des Griechischen.
- source_word: ἃ λέγουσιν
  choice: was sie sagen
  rationale: Gibt den Inhalt ihrer Rede natürlich und ohne unnötige Tempusüberzeichnung wieder.
- source_word: περὶ τίνων
  choice: worüber
  rationale: Bewahrt den Bezug auf die Gegenstände, über die sie sprechen beziehungsweise Behauptungen äußern.
- source_word: διαβεβαιοῦνται
  choice: so selbstsicher Behauptungen aufstellen
  rationale: Gibt die nachdrückliche, überzeugte Behauptung wieder und erhält zugleich die kritische Spannung zum fehlenden Verständnis.
theological_decisions:
- issue: Bezug von νομοδιδάσκαλοι auf das Gesetz
  choice: Im Haupttext steht allgemein „Gesetzeslehrer“; eine Fußnote nennt den wahrscheinlichen Bezug auf die jüdische Tora.
  alternative: „Lehrer des mosaischen Gesetzes“ oder „Toralehrer“
  rationale: Der Kontext legt die Tora nahe, doch das Kompositum selbst spezifiziert das Gesetz nicht ausdrücklich. So bleibt der Wortlaut offen, während die historische Einordnung zugänglich ist.
- issue: Bedeutung von διαβεβαιοῦνται
  choice: „so selbstsicher Behauptungen aufstellen“
  alternative: „mit Nachdruck versichern“ oder „fest behaupten“
  rationale: Die Formulierung wahrt die Kritik an nachdrücklichem Reden ohne Verständnis, ohne festzulegen, ob der Akzent stärker auf Gewissheit oder Beharrlichkeit liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gesetzeslehrer“ ist knapp und sachlich; „selbstsicher Behauptungen aufstellen“ vermittelt die polemische Schärfe des Satzes, ohne umgangssprachlich zu wirken.
