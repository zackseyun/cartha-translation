  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: de
  text: Das Ziel[a] der Weisung[b] ist Liebe aus reinem Herzen, gutem Gewissen und aufrichtigem Glauben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zweck“ oder „Ergebnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auftrag“, „Gebot“ oder „Anweisung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nicht geheucheltem Glauben“. Das griechische Wort für „Glaube“ kann je nach Zusammenhang auch „Treue“ oder „Vertrauen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: Ziel
  rationale: Im Zusammenhang bezeichnet das Wort den beabsichtigten Zweck der Weisung, nicht ihr zeitliches Ende.
- source_word: παραγγελία
  choice: Weisung
  rationale: Das Substantiv kann einen Auftrag, ein Gebot oder eine Anweisung bezeichnen. „Weisung“ passt zum pastoralen Lehrkontext und bewahrt zugleich den verbindlichen Charakter.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die übliche und kontextgemäße Wiedergabe des ethischen Zentralbegriffs.
- source_word: ἐκ
  choice: aus
  rationale: Die Präposition bezeichnet hier Ursprung oder Quelle der Liebe.
- source_word: καθαρᾶς καρδίας
  choice: reinem Herzen
  rationale: Bewahrt die innere und moralische Bedeutung der Wendung in natürlichem Deutsch.
- source_word: συνειδήσεως ἀγαθῆς
  choice: gutem Gewissen
  rationale: Gibt das Adjektiv ἀγαθός direkt wieder und vermeidet die stärker deutende Formulierung „reines Gewissen“.
- source_word: πίστεως
  choice: Glauben
  rationale: „Glaube“ ist hier die naheliegende Wiedergabe; „Treue“ oder „Vertrauen“ bleiben aufgrund des Bedeutungsspektrums mögliche Nuancen.
- source_word: ἀνυποκρίτου
  choice: ungeheucheltem
  rationale: Die Wiedergabe bildet den griechischen Gedanken des Nicht-Heuchlerischen präzise und idiomatisch ab.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier einen leichten Übergang. Ein ausdrückliches „nun“ oder „aber“ wäre im isolierten deutschen Vers unnötig oder könnte einen stärkeren zeitlichen beziehungsweise adversativen Sinn nahelegen.
theological_decisions:
- issue: Bedeutung von πίστις in πίστεως ἀνυποκρίτου
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: Der Zusammenhang lässt echten, ungeheuchelten Glauben als Quelle der Liebe erkennen, zwingt aber nicht dazu, die möglichen Nuancen „Treue“ und „Vertrauen“ auszuschließen; sie werden daher in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei mit ἐκ verbundenen Quellen der Liebe werden als knappe, gleichgeordnete Reihe wiedergegeben. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
