id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: de
  text: Dem König der Zeitalter aber, dem unvergänglichen, unsichtbaren, einzigen Gott[a], gebühren Ehre und Herrlichkeit für immer und ewig. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „dem allein weisen Gott“.'
    reason: textual_variant
lexical_decisions:
- source_word: τῷ δὲ βασιλεῖ τῶν αἰώνων
  choice: Dem König der Zeitalter aber
  rationale: „König der Zeitalter“ bildet die Genitivkonstruktion transparent ab und bewahrt die Mehrdeutigkeit von αἰώνων, statt sie auf „ewig“ oder „Universum“ festzulegen. Das nachgestellte „aber“ gibt δέ als überleitendes Satzglied natürlich wieder.
- source_word: ἀφθάρτῳ
  choice: dem unvergänglichen
  rationale: „Unvergänglich“ bezeichnet Gottes Freiheit von Verfall und Tod genauer als das enger auf Sterblichkeit bezogene „unsterblich“ und passt zum gehobenen Lobpreis.
- source_word: ἀοράτῳ
  choice: unsichtbaren
  rationale: Die geläufige und genaue deutsche Entsprechung für ἀόρατος in Bezug auf Gott.
- source_word: μόνῳ θεῷ
  choice: einzigen Gott
  rationale: Gibt den SBLGNT-Text ohne den nur in einer Variante bezeugten Zusatz σοφῷ direkt wieder und wahrt seine monotheistische Aussage.
- source_word: τιμὴ καὶ δόξα
  choice: Ehre und Herrlichkeit
  rationale: Die etablierte, semantisch genaue Wiedergabe des doxologischen Wortpaars.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Eine natürliche deutsche Wiedergabe der idiomatischen Formel für unbegrenzte Dauer.
- source_word: ἀμήν
  choice: Amen
  rationale: Die im Deutschen und im christlichen Gottesdienst etablierte Transliteration.
theological_decisions:
- issue: Monotheistische Aussage von μόνῳ θεῷ
  choice: dem einzigen Gott
  alternative: Gott allein
  rationale: Die gewählte Form gibt die ausdrückliche Aussage direkt wieder, ohne zusätzliche trinitarische oder konfessionelle Erläuterungen in den Text einzutragen.
- issue: Textvariante mit σοφῷ („weise“)
  choice: „weise“ im Haupttext auslassen
  alternative: dem allein weisen Gott
  rationale: Der zugrunde gelegte SBLGNT-Text enthält σοφῷ nicht. Die bekannte längere Lesart wird deshalb nur in der Fußnote dokumentiert.
- issue: Elliptische Form der Doxologie ohne ausdrückliches Verb
  choice: gebühren
  alternative: sei
  rationale: Das ergänzte Verb macht den deutschen Satz natürlich und lässt die doxologische Aussage als Zuschreibung von Ehre und Herrlichkeit erkennen, ohne ihren Inhalt zu erweitern.
translation_notes:
  register: Moderne, würdige Standardsprache mit doxologischem Klang. Die wiederholten Dativformen machen die Appositionen klar; „Zeitalter“ bewahrt bewusst die Bild- und Bedeutungswelt von αἰών.
