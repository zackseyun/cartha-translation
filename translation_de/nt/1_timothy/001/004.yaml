source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: de
  text: und sich weder mit Mythen noch mit endlosen Geschlechtsregistern zu befassen[a]. Solche Dinge führen eher zu Spekulationen[b] als zu Gottes Ordnung im Glauben[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen Beachtung zu schenken“ oder „sich ihnen zu widmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Streitfragen“, „Nachforschungen“ oder „Grübeleien“. Das griechische Wort bezeichnet hier offenbar unproduktive Untersuchungen oder Auseinandersetzungen.'
    reason: lexical_alternative
  - marker: c
    text: „Gottes Ordnung“ kann auch „Gottes Verwaltung“, „Gottes Plan“ oder „die von Gott anvertraute Haushalterschaft“ bedeuten. Die Wendung „im Glauben“ kann auch mit „durch Glauben“ wiedergegeben werden; „Glaube“ kann hier zudem die Nuance von Vertrauen oder Treue haben.
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: προσέχειν
  choice: sich mit … befassen
  rationale: Gibt das bewusste Beachten und Sichzuwenden in natürlichem modernem Deutsch wieder; der Infinitiv setzt die Aufforderung aus Vers 3 fort.
- source_word: μύθοις
  choice: Mythen
  rationale: Direkte, gegenwärtige Entsprechung, ohne den veralteten oder märchenhaften Beiklang von „Fabeln“ aufzudrängen.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: endlosen Geschlechtsregistern
  rationale: „Endlos“ bewahrt die abwertende Vorstellung des Unbegrenzten; „Geschlechtsregister“ bezeichnet genealogische Aufzeichnungen verständlich und würdevoll.
- source_word: αἵτινες
  choice: Solche Dinge
  rationale: Bringt die qualitative, erklärende Nuance des Relativpronomens deutlicher zum Ausdruck als ein bloßes „die“.
- source_word: ἐκζητήσεις
  choice: Spekulationen
  rationale: Passt zum negativen Kontext unproduktiver Nachforschungen; mögliche Bedeutungen wie Streitfragen oder Untersuchungen werden in einer Fußnote offengehalten.
- source_word: παρέχουσι
  choice: führen zu
  rationale: Natürliche deutsche Wiedergabe des Verursachens oder Hervorbringens.
- source_word: μᾶλλον ἢ
  choice: eher … als
  rationale: Bewahrt die vergleichende Kontrastierung des griechischen Ausdrucks.
- source_word: οἰκονομίαν θεοῦ
  choice: die Ordnung Gottes
  rationale: „Ordnung“ erfasst hier die geordnete Verwaltung beziehungsweise Heilsordnung, ohne die mehrdeutige Genitivverbindung auf Besitz oder Herkunft festzulegen; Alternativen werden in der Fußnote genannt.
- source_word: τὴν ἐν πίστει
  choice: die im Glauben besteht
  rationale: Bewahrt ἐν als Bereichsangabe und verbindet die Wendung grammatisch mit οἰκονομία, ohne sie unnötig instrumental festzulegen.
- source_word: πίστει
  choice: Glauben
  rationale: Die reguläre paulinische Wiedergabe bleibt im Haupttext erhalten; „Vertrauen“ und „Treue“ werden als mögliche Nuancen vermerkt.
theological_decisions:
- issue: Bedeutung von οἰκονομίαν θεοῦ
  choice: die Ordnung Gottes
  alternative: Gottes Verwaltung; Gottes Plan; die von Gott anvertraute Haushalterschaft
  rationale: οἰκονομία kann Verwaltung, Haushalterschaft oder eine geordnete Planung bezeichnen. „Ordnung Gottes“ hält den Bezug auf Gottes geordnetes Wirken offen, ohne ihn auf ein bestimmtes theologisches System oder ausschließlich auf ein menschliches Amt zu verengen.
- issue: Bedeutung von πίστει in τὴν ἐν πίστει
  choice: im Glauben
  alternative: im Vertrauen; in Treue; durch Glauben
  rationale: „Glaube“ ist hier die naheliegende und theologisch offene Hauptwiedergabe. Die Formulierung „im Glauben“ wahrt zudem die räumlich-sphärische Grundnuance von ἐν, während andere Nuancen möglich bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Fortsetzung von Vers 3 offen und endet entsprechend dem griechischen Gedankenstrich. Mehrdeutige Schlüsselbegriffe werden im Haupttext nicht konfessionell verengt; die wichtigsten Alternativen stehen in den Fußnoten.
