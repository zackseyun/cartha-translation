  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: de
  text: Einige sind davon abgeirrt[a] und haben sich leerem Gerede[b] zugewandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dies verfehlt“. Das Verb kann sowohl das Verfehlen eines Ziels als auch das Abweichen davon bezeichnen.'
