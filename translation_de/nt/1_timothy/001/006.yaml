lexical_decisions:
- source_word: ὧν
  choice: davon
  rationale: Das Genitivplural-Relativpronomen verweist auf die unmittelbar zuvor genannten geistlichen und ethischen Ziele beziehungsweise Eigenschaften. „Davon“ bildet diesen Rückverweis im Deutschen knapp und natürlich ab, ohne den Bezug enger festzulegen.
- source_word: τινες
  choice: einige
  rationale: Das Indefinitpronomen bezeichnet eine nicht näher bestimmte Teilgruppe; „einige“ bewahrt diese Unbestimmtheit.
- source_word: ἀστοχήσαντες
  choice: sind … abgeirrt
  rationale: Das Verb bezeichnet das Verfehlen eines Ziels oder das Abweichen davon. „Abirren“ bewahrt hier das Bild des Abweichens und verbindet sich idiomatisch mit „davon“.
- source_word: ἐξετράπησαν
  choice: haben sich … zugewandt
  rationale: Die Form beschreibt eine Abwendung vom richtigen Weg mit Hinwendung zu etwas anderem. Im Zusammenhang mit εἰς gibt „sich zuwenden“ die resultierende Richtung natürlich wieder.
- source_word: εἰς
  choice: zu
  rationale: Die Präposition bezeichnet die Richtung beziehungsweise das Ergebnis der Abwendung und wird mit „sich zuwenden“ idiomatisch durch „zu“ wiedergegeben.
- source_word: ματαιολογίαν
  choice: leerem Gerede
  rationale: Das Substantiv bezeichnet inhaltsloses, nutzloses oder nichtiges Reden. „Leeres Gerede“ ist verständlich, prägnant und entspricht dem polemischen Ton, ohne altertümlich zu wirken.
theological_decisions:
- issue: Bezugswort von ὧν
  choice: Ein allgemeiner Rückverweis auf die zuvor genannten geistlichen und ethischen Ziele, ausgedrückt durch „davon“.
  alternative: 'Engerer Bezug nur auf „reines Herz, gutes Gewissen und ungeheuchelten Glauben“ oder stärker zielbezogen: „Einige haben diese Ziele verfehlt“.'
  rationale: Der griechische Satz verweist syntaktisch zurück, legt aber innerhalb der unmittelbar vorausgehenden Aufzählung keine engere Abgrenzung ausdrücklich fest. „Davon“ erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Bewegungsbilder des griechischen Satzes werden verständlich wiedergegeben, ohne die unbestimmte Personengruppe oder den Rückbezug übermäßig zu präzisieren.
