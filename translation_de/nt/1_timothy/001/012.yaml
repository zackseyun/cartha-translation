id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: de
  text: Ich danke Jesus, dem Messias[a], unserem Herrn, der mich gestärkt hat, weil er mich für treu hielt und in den Dienst einsetzte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Christus Jesus“. Der griechische Titel Χριστός kann seiner Bedeutung nach mit „Messias“ oder in der traditionellen Form mit „Christus“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zum Dienst bestimmte“. Das griechische διακονία kann allgemein einen Dienst oder einen besonderen Dienstauftrag bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Ich danke
  rationale: Die griechische Wendung bezeichnet das Ausdrücken von Dank. „Ich danke“ ist im heutigen Deutsch natürlich und gibt den verbalen Sinn knapp wieder.
- source_word: ἐνδυναμώσαντί
  choice: der mich gestärkt hat
  rationale: Die Form bezeichnet Jesus Christus als den, der Paulus Kraft bzw. Befähigung gab. „Gestärkt“ bleibt nahe am griechischen Ausdruck, ohne die Art dieser Befähigung unnötig festzulegen.
- source_word: Χριστῷ Ἰησοῦ
  choice: dem Messias Jesus
  rationale: Χριστός wird als bedeutungsvoller Titel mit „Messias“ übersetzt; die ungewöhnliche, aber verständliche Wortfolge bewahrt zugleich die Reihenfolge des griechischen Textes.
- source_word: κυρίῳ
  choice: Herrn
  rationale: „Herr“ bewahrt den christologischen Titel und dessen Aussage von Autorität.
- source_word: πιστόν
  choice: für treu
  rationale: „Treu“ kann sowohl Zuverlässigkeit als auch Bewährung in einem anvertrauten Auftrag ausdrücken und lässt die paulinische Bedeutungsbreite bestehen.
- source_word: ἡγήσατο
  choice: hielt
  rationale: Die Verbindung „für treu hielt“ gibt das griechische „als treu erachtete“ in natürlichem modernem Deutsch wieder.
- source_word: θέμενος
  choice: einsetzte
  rationale: Das Partizip bedeutet wörtlich „setzend/stellend“, bezeichnet hier aber die Zuweisung zu einem Dienst. „Einsetzte“ vermittelt diesen funktionalen Sinn, ohne ein bestimmtes kirchliches Amt vorauszusetzen.
- source_word: εἰς διακονίαν
  choice: in den Dienst
  rationale: διακονία bezeichnet Dienst bzw. Dienstauftrag. „In den Dienst“ bewahrt die breite Bedeutung und vermeidet eine Verengung auf ein später definiertes geistliches Amt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: „Messias“ übersetzt den Titel, statt ihn lediglich in seiner traditionellen Form zu übernehmen. Da „Christus Jesus“ im Deutschen geläufiger ist, wird diese Möglichkeit in einer Fußnote genannt.
- issue: Art von Paulus’ Beauftragung
  choice: in den Dienst einsetzte
  alternative: zum Dienst bestimmte
  rationale: Die Formulierung gibt Christi Zuweisung des Paulus zur διακονία wieder, ohne spätere kirchliche Amtsstrukturen in den Text hineinzulesen.
- issue: Verhältnis von göttlicher Stärkung und anvertrautem Dienst
  choice: der mich gestärkt hat, weil er mich für treu hielt und in den Dienst einsetzte
  alternative: der mir Kraft gab; er hielt mich für treu und setzte mich in den Dienst ein
  rationale: Die gewählte Fassung folgt der griechischen Satzverknüpfung und bewahrt die Spannung, dass Christus Paulus sowohl stärkt als auch für treu erachtet und einsetzt, ohne daraus eine allgemeine Lehre über Verdienst oder Vorbedingung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng an der griechischen Struktur, wird aber durch idiomatische Wendungen wie „Ich danke“ und „für treu hielt“ natürlich lesbar. „Messias Jesus“ ist bewusst titelbetont; die geläufigere traditionelle Form steht in der Fußnote.
