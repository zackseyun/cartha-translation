source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: de
  text: Menschen, die sexuell unmoralisch handeln, Männer, die mit Männern Geschlechtsverkehr haben,[a] Sklavenhändler, Lügner, Meineidige und alles andere, was der gesunden Lehre entgegensteht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Männer, die homosexuelle Handlungen ausüben.« Das griechische Wort ἀρσενοκοῖται ist selten, und sein genauer Bedeutungsumfang ist umstritten; es verweist auf sexuelle Handlungen von Männern mit Männern.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: Menschen, die sexuell unmoralisch handeln
  rationale: Der Ausdruck bezeichnet allgemein Personen, die sexuelle Unmoral begehen. Die handlungsbezogene Wiedergabe ist in modernem Deutsch verständlich und verengt die Bedeutung nicht auf vorehelichen Geschlechtsverkehr.
- source_word: ἀρσενοκοίταις
  choice: Männer, die mit Männern Geschlechtsverkehr haben
  rationale: Das seltene, aus den Bestandteilen für »männlich« und »Bett/Beischlaf« gebildete Wort bezeichnet männlich-männliche sexuelle Betätigung, ohne eine moderne sexuelle Identitätskategorie vorauszusetzen. Der genaue Bedeutungsumfang bleibt umstritten und wird deshalb in der Fußnote kenntlich gemacht.
- source_word: ἀνδραποδισταῖς
  choice: Menschenhändler
  rationale: Das Wort bezeichnet Menschen, die andere versklaven oder mit ihnen als Sklaven handeln. »Menschenhändler« ist eine natürliche deutsche Wiedergabe, wobei die Fußnote den historischen Bezug auf Versklavung ausdrücklich festhält.
- source_word: ψεύσταις
  choice: Lügner
  rationale: Direkte und idiomatische Wiedergabe der pluralischen Personenbezeichnung.
- source_word: ἐπιόρκοις
  choice: Meineidige
  rationale: Bezeichnet Menschen, die falsch schwören oder einen Eid verletzen; »Meineidige« ist knapp und im Kontext der Aufzählung treffend.
- source_word: καὶ εἴ τι ἕτερον
  choice: und alles andere
  rationale: Die idiomatische Wendung öffnet die Aufzählung für weitere vergleichbare Fälle.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: der gesunden Lehre
  rationale: Bewahrt das griechische Gesundheitsbild und ist zugleich eine geläufige, verständliche deutsche Formulierung.
- source_word: ἀντίκειται
  choice: entgegensteht
  rationale: Gibt die Bedeutung des Widerstreitens oder In-Opposition-Stehens natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe von ἀρσενοκοίταις in einem lexikalisch und theologisch umstrittenen Zusammenhang
  choice: Männer, die mit Männern Geschlechtsverkehr haben
  alternative: Männer, die homosexuelle Handlungen vollziehen
  rationale: Die Hauptfassung gibt den männlichen und sexuellen Bezug verhaltensorientiert wieder, ohne eine moderne Identitätskategorie in den Text einzutragen. Da der genaue Umfang des seltenen griechischen Begriffs umstritten ist, nennt die Fußnote eine mögliche alternative Wiedergabe.
- issue: Bedeutungsumfang von ἀνδραποδισταῖς
  choice: Menschenhändler mit erläuternder Fußnote zum Sklavenhandel
  alternative: Sklavenhändler / Menschenräuber
  rationale: Der griechische Ausdruck kann das Entführen, Versklaven und Verkaufen von Menschen umfassen. Die gewählte Fassung ist in heutigem Deutsch natürlich; die Fußnote verhindert, dass der historische Bezug auf Sklaverei abgeschwächt wird.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt knapp, wird bei πόρνοις jedoch zur Vermeidung eines missverständlichen oder veralteten Etiketts handlungsbezogen formuliert. Im Haupttext muss bei »Menschenhändler« der Marker [b] ergänzt werden, damit sämtliche eingereichten Fußnoten markiert sind: »Menschenhändler,[b]«.'
