id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: de
  text: Doch die Gnade unseres Herrn strömte über, mit Glauben und Liebe, die im Messias Jesus[a] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Christus Jesus.'
    reason: Alternative Wiedergabe des Titels Χριστός.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: wurde überströmend reich
  rationale: Das verstärkte Verb bezeichnet ein außerordentliches Übermaß. Die Formulierung bewahrt das Bild überfließender Fülle und klingt zugleich in modernem Deutsch verständlich.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel setzt die überreiche Gnade in einen deutlichen Gegensatz zur zuvor beschriebenen Unwissenheit und Ungläubigkeit.
- source_word: χάρις
  choice: Gnade
  rationale: „Gnade“ ist die sachlich und theologisch angemessene deutsche Wiedergabe für Gottes unverdiente Zuwendung.
- source_word: κυρίου
  choice: Herrn
  rationale: „Herr“ gibt den neutestamentlichen Titel κύριος natürlich und mit seinem vollen Gewicht wieder.
- source_word: μετὰ
  choice: zusammen mit
  rationale: Die Wendung macht deutlich, dass Glaube und Liebe das Übermaß der Gnade begleiten, ohne ausdrücklich eine weitergehende Kausalbeziehung festzulegen.
- source_word: πίστεως
  choice: Glauben
  rationale: In diesem Zusammenhang bezeichnet πίστις am naheliegendsten den Glauben beziehungsweise das Vertrauen, nicht primär Treue.
- source_word: ἀγάπης
  choice: Liebe
  rationale: „Liebe“ ist die klare und geläufige Wiedergabe von ἀγάπη.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: die in Messias Jesus sind
  rationale: Der Relativsatz bezieht die Orts- beziehungsweise Beziehungsaussage verständlich auf Glauben und Liebe. „In“ wahrt die prägnante paulinische Formulierung, ohne sie auszudeuten.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός wird als bedeutungsvoller Titel mit „Messias“ wiedergegeben; die traditionelle Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Verhältnis von Gnade zu Glauben und Liebe
  choice: Die Gnade wird als überreich beschrieben und erscheint zusammen mit Glauben und Liebe.
  alternative: Glaube und Liebe ausdrücklich als von der Gnade hervorgebrachte Wirkungen zu bezeichnen.
  rationale: Die Syntax verbindet μετὰ πίστεως καὶ ἀγάπης mit dem überreichen Wirken der Gnade, sagt aber nicht ausdrücklich, ob damit Begleitung, Folge oder Hervorbringung gemeint ist. Die Übersetzung legt diese Frage nicht unnötig fest.
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: „Messias“ macht den Titelgehalt des griechischen Wortes sichtbar; „Christus“ bleibt als vertraute Übersetzungsmöglichkeit in der Fußnote erhalten.
- issue: Bezug von „in Messias Jesus“
  choice: Der deutsche Relativsatz bezieht die Wendung auf Glauben und Liebe gemeinsam.
  alternative: Die Wendung aufgrund der formal singularischen Artikelform nur auf die Liebe zu beziehen.
  rationale: Obwohl τῆς formal näher bei ἀγάπης steht, bilden Glaube und Liebe eine koordinierte Einheit, und inhaltlich liegt der gemeinsame Bezug nahe. Die Übersetzung folgt dieser natürlichen Lesart, ohne die Art des „In-Seins“ näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Überströmend reich“ erhält die starke Intensivierung des griechischen Verbs; „zusammen mit“ vermeidet eine künstlich enge oder kausale Auslegung. Der Ausdruck „in Messias Jesus“ bewahrt bewusst die prägnante paulinische Beziehungssprache.
