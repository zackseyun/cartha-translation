    issue: Unidiomatische und semantisch unpräzise Wiedergabe von ὑπερεπλεόνασεν
    rationale: „wurde überströmend reich“ beschreibt ein Reichwerden der Gnade, während das griechische Verb ihr überreiches Überströmen bzw. Übermaß ausdrückt.
  - severity: low
    issue: Nichtstandardmäßige Kasusverbindung „in Messias Jesus“
    rationale: Nach „in“ im lokalen bzw. übertragen-lokativen Sinn steht im Deutschen der Dativ; „im Messias Jesus“ ist die grammatisch reguläre Form.
