source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: de
  text: 'Dabei muss man wissen: Für einen Gerechten ist das Gesetz nicht bestimmt, sondern für Gesetzlose und Aufsässige, für Gottlose und Sünder, für Unheilige und solche, die das Heilige missachten, für Menschen, die ihre Väter töten, und für Menschen, die ihre Mütter töten[a], für Mörder,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die ihre Väter schlagen“ und „die ihre Mütter schlagen“. Die griechischen Wörter können einen gewaltsamen Angriff auf die Eltern bezeichnen; in diesem Zusammenhang ist „töten“ wahrscheinlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: Dabei muss man wissen
  rationale: Die partizipiale Wendung führt einen maßgeblichen Gesichtspunkt für die vorausgehende Aussage ein. Die unpersönliche deutsche Form ist natürlich und bewahrt den kognitiven Sinn.
- source_word: δικαίῳ
  choice: für einen Gerechten
  rationale: Der substantivierte Ausdruck gibt den singularischen, repräsentativen Charakter des griechischen maskulinen Adjektivs knapp und würdig wieder.
- source_word: νόμος οὐ κεῖται
  choice: ist das Gesetz nicht bestimmt
  rationale: κεῖται bezeichnet hier, wofür das Gesetz festgesetzt beziehungsweise erlassen ist. „Nicht bestimmt“ bewahrt diesen rechtlichen Sinn, ohne die Aussage zum bloßen Nichtgelten umzudeuten.
- source_word: ἀνόμοις
  choice: für Gesetzlose
  rationale: Die Wiedergabe erhält den unmittelbaren Bezug auf das Gesetz und ist im Deutschen verständlich.
- source_word: ἀνυποτάκτοις
  choice: Aufsässige
  rationale: Das Wort bezeichnet Menschen, die sich einer Ordnung nicht unterstellen; „aufsässig“ ist prägnant und gegenwärtig verständlich.
- source_word: ἀσεβέσι
  choice: Gottlose
  rationale: Die Wahl bringt die fehlende Ehrfurcht gegenüber Gott klar zum Ausdruck.
- source_word: ἁμαρτωλοῖς
  choice: Sünder
  rationale: Das substantivierte deutsche Wort entspricht der personenbezogenen Aufzählung und gibt den üblichen Sinn direkt wieder.
- source_word: ἀνοσίοις
  choice: Unheilige
  rationale: Die Wiedergabe bezeichnet Menschen, deren Haltung oder Verhalten dem Heiligen widerspricht.
- source_word: βεβήλοις
  choice: solche, die das Heilige missachten
  rationale: Die Umschreibung unterscheidet den Ausdruck von „Gottlose“ und „Unheilige“ und vermittelt verständlich das Profanieren beziehungsweise Geringschätzen heiliger Dinge.
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: Menschen, die ihren Vater oder ihre Mutter töten
  rationale: Die seltenen Wörter können gewaltsames Schlagen oder Töten der Eltern bezeichnen. Im Zusammenhang der Lasterliste ist „töten“ wahrscheinlich; die alternative Bedeutung wird in der Fußnote erhalten.
- source_word: ἀνδροφόνοις
  choice: Mörder
  rationale: „Mörder“ gibt die schuldhafte Tötung idiomatisch und prägnant wieder.
theological_decisions:
- issue: Repräsentatives Maskulinum in δικαίῳ
  choice: für einen Gerechten
  alternative: für einen gerechten Menschen; für Gerechte
  rationale: Der griechische Ausdruck steht im maskulinen Singular, ist hier jedoch allgemein gebraucht. „Ein Gerechter“ bewahrt sowohl Singular als auch grammatische Form, ohne die Aussage ausdrücklich auf Männer zu beschränken.
- issue: Bedeutung von πατρολῴαις und μητρολῴαις
  choice: Menschen, die ihren Vater oder ihre Mutter töten
  alternative: Menschen, die ihren Vater oder ihre Mutter schlagen
  rationale: Beide seltenen Begriffe lassen sowohl schwere Misshandlung als auch Tötung zu. Die Nähe zu ἀνδροφόνοις stützt im Kontext die stärkere Wiedergabe, doch die echte lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarweise gegliederte Lasterliste und ihre Steigerung bleiben erkennbar; schwer verständliche Fachwörter wie „Vatermörder“ und „Muttermörder“ werden vermieden.
