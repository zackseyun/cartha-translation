  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: de
  text: indem du am Glauben und an einem guten Gewissen festhältst[a]. Dieses haben einige von sich gestoßen und im Glauben Schiffbruch erlitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Glauben und ein gutes Gewissen habend«. »Dieses« bezieht sich grammatisch am ehesten auf das gute Gewissen; möglich ist auch ein zusammenfassender Bezug auf Glauben und gutes Gewissen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχων
  choice: indem du … festhältst
  rationale: Das Präsenspartizip bezieht sich auf das in Vers 18 angeredete »du« und bezeichnet ein fortdauerndes Festhalten; die deutsche Nebensatzform ist natürlich und wahrt den Anschluss.
- source_word: πίστιν
  choice: Glauben
  rationale: Im ersten Vorkommen bezeichnet πίστις am ehesten den christlichen Glauben beziehungsweise das gläubige Vertrauen; »Glauben« lässt diese Bedeutungsweite offen.
- source_word: ἀγαθὴν συνείδησιν
  choice: ein gutes Gewissen
  rationale: Die Wendung gibt beide Wörter unmittelbar und idiomatisch wieder, ohne ἀγαθή interpretierend auf ein bloß subjektiv »reines« oder »ruhiges« Gewissen zu verengen.
- source_word: ἥν
  choice: Dieses
  rationale: Das feminine Singularpronomen bezieht sich grammatisch am natürlichsten auf συνείδησιν. Das neutrale deutsche Pronomen nimmt daher ausdrücklich »Gewissen« auf, während die Fußnote die mögliche weitere Bezugnahme nennt.
- source_word: ἀπωσάμενοι
  choice: von sich gestoßen
  rationale: Die bildhafte, willentliche Zurückweisung wird kräftiger und quellennäher ausgedrückt als mit dem allgemeineren »abgelehnt«.
- source_word: περὶ τὴν πίστιν
  choice: im Glauben
  rationale: περί mit Akkusativ bezeichnet hier den Bereich beziehungsweise die Hinsicht des Schiffbruchs. »Im Glauben Schiffbruch erleiden« ist im Deutschen idiomatisch und bewahrt zugleich das Bild.
- source_word: ἐναυάγησαν
  choice: Schiffbruch erlitten
  rationale: Die Metapher des griechischen Verbs wird in einer geläufigen modernen deutschen Wendung erhalten.
theological_decisions:
- issue: Bezugswort von ἥν
  choice: Das Relativpronomen bezieht sich vor allem auf »ein gutes Gewissen«.
  alternative: Es kann zusammenfassend »Glauben und ein gutes Gewissen« aufnehmen.
  rationale: ἥν ist feminin Singular und stimmt daher am unmittelbarsten mit συνείδησιν überein. Da ein weiterer Bezug sachlich vertreten wird, wird er in der Fußnote offengehalten.
- issue: Bedeutung des zweiten πίστις mit Artikel
  choice: »im Glauben« als Bereich ihres Schiffbruchs
  alternative: »hinsichtlich des Glaubens« beziehungsweise »in Bezug auf den Glauben«
  rationale: Der Artikel kann hier stärker auf den christlichen Glauben als anerkannte Glaubenswirklichkeit weisen. Die deutsche Fassung soll jedoch nicht unnötig zwischen persönlichem Vertrauen und Glaubensinhalt entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als Fortsetzung der persönlichen Aufforderung aus Vers 18 formuliert. Die nautische Metapher bleibt erhalten; die grammatische Spannung beim Bezug von ἥν wird im Haupttext nachvollziehbar wiedergegeben und in der Fußnote offengehalten.
