id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: de
  text: 'An Timotheus, mein echtes Kind im Glauben[a]: Gnade, Erbarmen und Frieden von Gott, dem Vater, und dem Messias Jesus, unserem Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mein wahres Kind im Glauben“; „im Glauben“ kann ebenso den gemeinsamen Glauben als Bereich dieser geistlichen Beziehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mein wahres Kind
  rationale: Die Wendung bezeichnet die Echtheit der geistlichen Eltern-Kind-Beziehung, nicht biologische Abstammung. Das im Griechischen nicht eigens ausgedrückte Possessivpronomen wird im Deutschen zum natürlichen Verständnis ergänzt.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: Die Formulierung bewahrt die mögliche Bedeutung des Glaubens als gemeinsamer Lebens- und Beziehungsbereich, ohne den Ausdruck unnötig zu einem festen Fachbegriff zu machen.
- source_word: χάρις
  choice: Gnade
  rationale: Entspricht dem etablierten paulinischen Grußbegriff und gibt dessen theologischen Gehalt angemessen wieder.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Gibt den Gedanken barmherziger Zuwendung idiomatisch und würdig wieder und bewahrt das besondere dreigliedrige Grußwort.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Direkte und im biblischen Sprachgebrauch natürliche Entsprechung.
- source_word: θεοῦ πατρὸς
  choice: Gott, dem Vater
  rationale: Die Apposition entspricht natürlichem Deutsch und bewahrt die Beziehung zwischen Gott und der Vaterbezeichnung.
- source_word: Χριστοῦ Ἰησοῦ
  choice: dem Messias Jesus
  rationale: Χριστός wird als Titel mit „Messias“ übersetzt; die ungewöhnliche, aber verständliche Reihenfolge des griechischen Ausdrucks bleibt erhalten.
- source_word: κυρίου
  choice: Herrn
  rationale: Die übliche und christologisch angemessene Wiedergabe von κύριος.
theological_decisions:
- issue: Bedeutung von ἐν πίστει
  choice: im Glauben
  alternative: durch Glauben / in der Glaubensgemeinschaft
  rationale: „Im Glauben“ lässt offen, ob vor allem der gemeinsame christliche Glaube, der Bereich des Glaubens oder die glaubensbezogene geistliche Beziehung gemeint ist.
- issue: Wiedergabe von Χριστοῦ Ἰησοῦ
  choice: dem Messias Jesus
  alternative: Christus Jesus
  rationale: Die Übersetzung macht den Titelgehalt von Χριστός sichtbar, statt ihn lediglich in der traditionellen Form „Christus“ wiederzugeben.
- issue: Ergänzung des Possessivpronomens bei τέκνῳ
  choice: mein wahres Kind
  alternative: ein wahres Kind
  rationale: Die persönliche Beziehung ist aus Anrede und Kontext eindeutig; „mein“ macht die griechische Beziehungswendung im Deutschen natürlich, ohne biologische Abstammung zu behaupten.
translation_notes:
  register: Moderner, würdiger Briefstil. „Wahres Kind“ erhält die geistliche Verwandtschaftsmetapher; „Messias Jesus“ ist bewusst titelbetont und daher weniger konventionell als „Christus Jesus“.
