id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: de
  text: Wir wissen aber, dass das Gesetz gut ist, wenn jemand es gesetzgemäß gebraucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn jemand richtig damit umgeht« bzw. »wenn jemand es ordnungsgemäß anwendet«.'
    reason: Lexikalische Alternativen zu νομίμως χρῆται; νομίμως kann sowohl »gesetzgemäß« als auch allgemeiner »richtig, ordnungsgemäß« bedeuten.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Wir wissen
  rationale: Die Perfektform οἶδα hat hier präsentische Bedeutung und bezeichnet feststehendes Wissen. »Wir wissen« ist die natürliche und genaue deutsche Wiedergabe.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen milden Gegensatz beziehungsweise eine Weiterführung im Gedankengang. Das unbetonte »aber« gibt diese Funktion wieder, ohne einen scharfen Kontrast zu erzeugen.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was gewusst wird.
- source_word: καλὸς
  choice: gut
  rationale: καλός bezeichnet hier die positive Qualität des Gesetzes. »Gut« bewahrt die breite Aussage, ohne sie auf »edel« oder »vortrefflich« zu verengen.
- source_word: ὁ νόμος
  choice: das Gesetz
  rationale: Die bestimmte Form des griechischen Ausdrucks wird direkt wiedergegeben. Der genaue Umfang des Gemeinten bleibt dem Zusammenhang überlassen.
- source_word: ἐάν τις
  choice: wenn jemand
  rationale: Die Wendung formuliert eine allgemeine Bedingung im Singular. »Wenn jemand« ist im modernen Deutschen natürlicher als »wenn man« und bewahrt den Bezug auf eine beliebige Einzelperson.
- source_word: αὐτῷ
  choice: es
  rationale: Das Pronomen verweist auf »das Gesetz«. Beim deutschen Verb »gebrauchen« steht das Bezugswort idiomatisch im Akkusativ.
- source_word: νομίμως
  choice: gesetzgemäß
  rationale: Das Adverb bedeutet dem Gesetz beziehungsweise der maßgeblichen Norm entsprechend. »Gesetzgemäß« bewahrt zudem die im Griechischen hörbare Wortverbindung zwischen νόμος und νομίμως.
- source_word: χρῆται
  choice: gebraucht
  rationale: χράομαι bedeutet »gebrauchen« oder »Gebrauch machen von«. »Gebraucht« ist knapp, würdig und lässt Art und Zweck dieses Gebrauchs offen.
theological_decisions:
- issue: Bedeutungsumfang von »das Gesetz«
  choice: Die Übersetzung bleibt bei »das Gesetz«.
  alternative: »das mosaische Gesetz« oder »Gesetz im Allgemeinen«
  rationale: Der Zusammenhang legt besonders das mosaische Gesetz nahe, doch der griechische Text präzisiert dies nicht ausdrücklich. Die offene Formulierung vermeidet eine unnötige dogmatische Festlegung.
- issue: Bedeutung von νομίμως im Verhältnis zum Gesetz
  choice: »gesetzgemäß gebraucht«
  alternative: »richtig gebraucht« oder »ordnungsgemäß anwendet«
  rationale: Die gewählte Fassung bewahrt das Wortspiel und die mögliche Aussage, dass auch der Gebrauch des Gesetzes einer Norm entsprechen muss. Die Alternativen zeigen die ebenfalls mögliche allgemeinere Bedeutung »sachgemäß/richtig«.
translation_notes:
  register: Modernes Standarddeutsch in einer klaren, würdigen Satzform. »Gesetzgemäß gebraucht« klingt bewusst etwas markant, weil es das griechische Wortspiel zwischen νόμος und νομίμως erhält; die Fußnote bietet flüssigere Deutungsalternativen.
