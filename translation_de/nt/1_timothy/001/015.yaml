source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: de
  text: 'Das Wort ist zuverlässig und verdient volle Annahme: Messias[a] Jesus kam in die Welt, um Sünder zu retten; unter ihnen stehe ich an erster Stelle.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ: „Christus Jesus“. „Messias“ gibt die Bedeutung des griechischen Titels Χριστός wieder.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „unter denen ich der Erste bin“; auch: „der Vorderste“. „Der Schlimmste“ ist eine stärker ausdeutende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Dieses Wort ist zuverlässig
  rationale: Die feste Wendung in den Pastoralbriefen führt eine verlässliche Kernaussage ein. „Dieses Wort“ bewahrt λόγος, während „zuverlässig“ die auf die Aussage bezogene Bedeutung von πιστός natürlich wiedergibt.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: verdient uneingeschränkte Annahme
  rationale: ἀποδοχή bezeichnet Annahme oder Aufnahme; πάσης verstärkt sie. Die Formulierung gibt den Anspruch vollständiger, vorbehaltloser Annahme wieder, ohne ihn bloß als intellektuelle Zustimmung zu verengen.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι leitet hier den Inhalt des zuverlässigen Wortes ein. Im Deutschen kennzeichnet ein Doppelpunkt diese direkte inhaltliche Entfaltung natürlicher als ein schwerfälliges „dass“ nach der vorangehenden Formulierung.
- source_word: Χριστὸς Ἰησοῦς
  choice: Christus Jesus
  rationale: „Christus Jesus“ ist im Deutschen die natürliche und herkömmliche Wiedergabe dieser paulinischen Namens- und Titelfolge. Eine Fußnote macht die Titelbedeutung „Messias“ ausdrücklich sichtbar.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: kam in die Welt
  rationale: Die Wendung entspricht der Bewegungsaussage des Griechischen und bewahrt zugleich ihre theologische Resonanz, ohne sie erklärend auszuweiten.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: um Sünder zu retten
  rationale: Der substantivierte Ausdruck ἁμαρτωλούς bezeichnet Sünder; σῶσαι hat hier seine soteriologische Grundbedeutung „retten“. Der deutsche Finalsatz gibt den Infinitiv des Zwecks klar wieder.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: Unter ihnen stehe ich an erster Stelle
  rationale: πρῶτος kann Vorrang oder den ersten Rang bezeichnen. „An erster Stelle“ bewahrt dieses Rangbild und lässt offen, ob Paulus sich als den vordersten beziehungsweise schlimmsten Sünder bezeichnet; die Fußnote nennt die möglichen Wiedergaben.
theological_decisions:
- issue: Titelbedeutung von Χριστός
  choice: Christus Jesus, mit Fußnote zur Bedeutung „Messias“
  alternative: Jesus, der Messias / Messias Jesus
  rationale: Die Hauptfassung folgt dem natürlichen deutschen Sprachgebrauch für die feste paulinische Folge, ohne die Titelbedeutung zu verdecken; diese wird in der Fußnote offengelegt.
- issue: Sinn von πρῶτος unter den Sündern
  choice: an erster Stelle
  alternative: der Schlimmste / der Erste / der Bedeutendste
  rationale: Der Kontext legt einen negativen Vorrang nahe, doch πρῶτος sagt nicht ausdrücklich „der Schlimmste“. Die Hauptfassung erhält die Spannung, während die Fußnote das Bedeutungsspektrum erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und gut vorlesbar; traditionelle theologische Begriffe bleiben erhalten, werden aber dort erläutert, wo ihre ursprüngliche Titel- oder Bedeutungsbreite sonst verdeckt wäre.
