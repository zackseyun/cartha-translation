  terminology: „Sünder“ und „retten“ sind sachgemäße, etablierte Wiedergaben. „Messias“ übersetzt den Titel Χριστός, statt seine Bedeutung lediglich in eine Fußnote auszulagern. „An erster Stelle“ erhält das Rangbild von πρῶτος und legt sich nicht auf die stärker interpretierende Wiedergabe „der Schlimmste“ fest.
