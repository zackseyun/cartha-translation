lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: der ich früher … war
  rationale: Die Relativkonstruktion nimmt die Person aus dem vorherigen Vers auf, bewahrt den Rückbezug des Partizips und klingt im Deutschen natürlich.
- source_word: βλάσφημον
  choice: ein Lästerer
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier Paulus als jemanden, der lästerte. „Lästerer“ ist direkt und lässt den näheren Bezug der Lästerung offen.
- source_word: διώκτην
  choice: ein Verfolger
  rationale: Die übliche und sachlich genaue Wiedergabe des Nomens bezeichnet Paulus nach seinem früheren Verhalten.
- source_word: ὑβριστήν
  choice: ein gewalttätiger Mensch
  rationale: Der Ausdruck bezeichnet beleidigend-übergriffige, empörend gewaltsame Handlungsweise und nicht bloß Hochmut. Die deutsche Formulierung ist verständlich, ohne den Begriff auf körperliche Gewalt einzuengen.
- source_word: ἠλεήθην
  choice: mir wurde Erbarmen erwiesen
  rationale: Die passive Form bleibt erhalten und deutet den Handelnden nicht ausdrücklich aus.
- source_word: ὅτι
  choice: weil
  rationale: „Weil“ gibt den natürlichen kausalen beziehungsweise begründenden Sinn wieder, ohne zu behaupten, die Unwissenheit habe Erbarmen verdient.
- source_word: ἀγνοῶν ἐποίησα
  choice: ich unwissend … gehandelt hatte
  rationale: Die Wiedergabe verbindet das begleitende Partizip mit dem Handeln und gibt ποιέω ohne ein im Griechischen nicht genanntes Objekt idiomatisch wieder.
- source_word: ἐν ἀπιστίᾳ
  choice: im Unglauben
  rationale: Im Zusammenhang bezeichnet ἀπιστία am ehesten fehlenden Glauben; „Unglaube“ bewahrt zugleich die paulinische Begrifflichkeit.
theological_decisions:
- issue: Sinn der mit ὅτι eingeleiteten Aussage
  choice: Das Erbarmen wird mit „weil“ an Paulus’ unwissendes Handeln im Unglauben angeschlossen.
  alternative: Die Wendung lediglich als begleitenden Umstand statt als Begründung wiederzugeben.
  rationale: Der kausale Sinn von ὅτι ist hier naheliegend. Die Formulierung bewahrt die Spannung des Textes, ohne Unwissenheit als Verdienst oder eigenständigen Heilsgrund zu deuten.
- issue: Bedeutung von ἀπιστία
  choice: Unglaube
  alternative: Treulosigkeit
  rationale: Der unmittelbare Zusammenhang legt fehlenden Glauben näher als Bundesuntreue; die alternative Bedeutungsnuance wird dennoch nicht als grundsätzlich unmöglich dargestellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform knüpft als Versfragment an den vorherigen Vers an. Die dreigliedrige Selbstbeschreibung und der passive Hinweis auf das Erbarmen bleiben erhalten; die Fußnoten markieren echte lexikalische Alternativen.
