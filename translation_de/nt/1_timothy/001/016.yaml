reference: 1 Timothy 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: de
  text: Doch gerade deshalb wurde mir Barmherzigkeit erwiesen, damit Christus Jesus gerade an mir als Erstem[a] seine ganze Langmut[b] erweisen konnte – als Vorbild für die, die künftig zum ewigen Leben an ihn glauben würden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „als Erstem“. Der Ausdruck nimmt wahrscheinlich auf Vers 15 Bezug („der Erste unter den Sündern“) und hebt zugleich Paulus als vorrangigen Beispielfall hervor.
    reason: lexical_ambiguity
  - marker: b
    text: Oder „seine ganze Geduld“ beziehungsweise „seine volle Nachsicht“.
    reason: lexical_alternative
  - marker: c
    text: Oder „die im Begriff waren, an ihn zu glauben“. Das Griechische bezeichnet Menschen, deren Glaube aus der damaligen Perspektive noch zukünftig war.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: wurde mir Barmherzigkeit erwiesen
  rationale: Die passive Form bleibt erhalten und lässt den Handelnden, wie im Griechischen, unausgesprochen.
- source_word: πρώτῳ
  choice: dem Ersten
  rationale: Die Wiedergabe bewahrt den Rückbezug auf Vers 15 und zugleich die knappe, in ihrer genauen Nuance offene Formulierung des Griechischen.
- source_word: ἐνδείξηται
  choice: sichtbar machte
  rationale: Das Verb bezeichnet ein deutliches Aufzeigen oder Erweisen; die deutsche Formulierung ist natürlich und bringt die öffentliche Beispielwirkung zum Ausdruck.
- source_word: Χριστὸς Ἰησοῦς
  choice: Christus Jesus
  rationale: Χριστός ist der griechische Titel für den Messias; „Christus Jesus“ ist im Deutschen die geläufige und würdevolle Titelform.
- source_word: ἅπασαν μακροθυμίαν
  choice: seine ganze Langmut
  rationale: „Ganze“ gibt die verstärkende Totalität von ἅπασαν wieder; „Langmut“ bezeichnet geduldiges, zurückhaltendes Ertragen genauer als das allgemeinere „Geduld“.
- source_word: ὑποτύπωσιν
  choice: als Vorbild
  rationale: Das Wort bezeichnet ein Muster oder Modell, an dem sich spätere Fälle erkennen beziehungsweise ausrichten lassen.
- source_word: τῶν μελλόντων πιστεύειν
  choice: die künftig … glauben würden
  rationale: Diese Formulierung gibt die vom damaligen Zeitpunkt aus zukünftigen Glaubenden idiomatisch wieder, ohne die zeitliche Perspektive von μέλλω aufzugeben.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: an ihn glauben
  rationale: Die im Neuen Testament übliche deutsche Wendung gibt πιστεύω mit ἐπί und Dativ sachgerecht wieder.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: „Zum“ bewahrt die Zielrichtung von εἰς und lässt offen, ob stärker Ziel oder Ergebnis betont ist.
theological_decisions:
- issue: Bedeutung von πρώτῳ
  choice: dem Ersten
  alternative: dem schlimmsten Sünder / dem bedeutendsten Beispiel
  rationale: Die Übersetzung greift nicht stärker als der griechische Wortlaut fest, ob vor allem Rang unter den Sündern oder exemplarische Vorrangstellung gemeint ist; der Zusammenhang mit Vers 15 bleibt erkennbar.
- issue: Wiedergabe von Χριστός
  choice: Christus Jesus
  alternative: Messias Jesus
  rationale: Der messianische Titel bleibt in der etablierten deutschen Form „Christus“ erhalten; eine Fußnote erläutert seine Bedeutung, ohne ihn zu einem bloßen Eigennamen zu machen.
- issue: Handelnder bei der Barmherzigkeit
  choice: Passiv ohne ausdrücklich genannten Handelnden
  alternative: Gott beziehungsweise Christus erwies mir Barmherzigkeit
  rationale: Der griechische Passivsatz nennt den Handelnden nicht, während der Zwecksatz ausdrücklich Christus Jesus als denjenigen bezeichnet, der seine Langmut an Paulus sichtbar macht. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Barmherzigkeit erwiesen“ und „Langmut“ halten den biblisch-theologischen Ton, bleiben aber verständlich. Der Gedankenstrich gliedert den langen Satz, ohne seine syntaktische Einheit aufzulösen.
