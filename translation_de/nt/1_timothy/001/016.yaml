  rationale: Die Revision behebt die deutsche finalsyntaktische Unstimmigkeit und glättet die Apposition zu πρώτῳ. Inhalt, Ambiguität und Register des Entwurfs bleiben erhalten; insbesondere wird weder der ungenannte Handelnde der Barmherzigkeit bestimmt noch die Bedeutung von πρώτῳ konfessionell oder einseitig festgelegt.
