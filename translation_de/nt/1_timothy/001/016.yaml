  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Satzes zuverlässig wieder: das ungenannte Passiv bei ἠλεήθην, die vollständige Langmut, die exemplarische Funktion und die auf die Zukunft bezogenen Glaubenden. Die Formulierung „damit … sichtbar machte“ ist jedoch im Deutschen syntaktisch nicht tragfähig: Nach „damit“ ist hier eine finite Konjunktiv-/Modalform erforderlich. „Erweisen konnte“ gibt den Zweck des ἵνα-Satzes idiomatisch wieder, ohne einen zusätzlichen Handelnden für das Passiv zu benennen.'
  naturalness: „Christus Jesus an mir, dem Ersten, seine ganze Langmut sichtbar machte“ wirkt sowohl wegen der Verbform als auch wegen der Stellung von „dem Ersten“ schwer lesbar. „Gerade an mir als Erstem … erweisen konnte“ ist modernes, würdiges Standarddeutsch und hält die knappe Ausdrucksweise des Ausgangstextes aufrecht.
  terminology: „Barmherzigkeit erwiesen“, „Christus Jesus“, „Langmut“, „Vorbild“ und „ewiges Leben“ sind angemessen. „Christus Jesus“ ist im deutschen neutestamentlichen Register die natürliche Wiedergabe des titulären Namens; eine Umstellung zu „Messias Jesus“ wäre unnötig unidiomatisch. Die Fußnote zu πρώτῳ sollte den wahrscheinlichen Bezug auf V. 15 benennen, ohne „schlimmsten“ als alleinige Bedeutung festzulegen.
