    issue: Unpassende Verbform im damit-Satz
    rationale: „Damit Christus Jesus … sichtbar machte“ verwendet einen Indikativ Präteritum nach einer finalen Konjunktion und ist in dieser Funktion nicht korrekt. Der griechische ἵνα-Satz verlangt eine deutsche finale Konstruktion wie „damit … erweisen konnte“.
  - severity: low
