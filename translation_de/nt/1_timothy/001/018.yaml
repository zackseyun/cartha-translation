  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: de
  text: Diesen Auftrag vertraue ich dir an, mein Kind Timotheus, im Einklang mit den früheren Prophezeiungen über dich[a], damit du durch sie[b] den guten Kampf kämpfst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich betreffend«; möglicherweise auch im Sinn von Prophezeiungen, die über Timotheus ausgesprochen wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in ihnen« oder »durch sie«. Das Griechische kann sowohl das Mittel als auch den Bereich bezeichnen, in dem Timotheus den Kampf führt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher bewahrt das militärische Bild: »den guten Kriegsdienst leisten« oder »den guten Feldzug führen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: Auftrag
  rationale: Das Wort bezeichnet eine verbindliche Weisung. »Auftrag« bewahrt sowohl den autoritativen als auch den anvertrauten Charakter und fügt sich natürlich zu παρατίθεμαί.
- source_word: παρατίθεμαί
  choice: vertraue ich dir an
  rationale: Die mediale Form bezeichnet hier das Übergeben in die Verantwortung eines anderen. »Anvertrauen« gibt diesen persönlichen Verpflichtungscharakter treffend wieder.
- source_word: τέκνον Τιμόθεε
  choice: Timotheus, mein Kind
  rationale: τέκνον bedeutet wörtlich »Kind« und dient als herzliche geistliche Anrede. Das im Deutschen idiomatische »mein« macht die Beziehung der Anrede deutlich, ohne das geschlechtsspezifischere »Sohn« einzuführen.
- source_word: κατὰ τὰς … προφητείας
  choice: Er entspricht den prophetischen Worten
  rationale: κατά mit Akkusativ bezeichnet hier Übereinstimmung oder Entsprechung. »Prophetische Worte« gibt den Inhalt einzelner προφητεῖαι verständlich wieder, ohne ihre prophetische Natur abzuschwächen.
- source_word: προαγούσας
  choice: die zuvor … gesprochen wurden
  rationale: 'Das Partizip hat hier zeitlichen Sinn: Die prophetischen Worte waren dem gegenwärtigen Auftrag vorausgegangen.'
- source_word: ἐπὶ σὲ
  choice: über dich
  rationale: ἐπί mit Akkusativ kann hier die Ausrichtung oder den Bezug der prophetischen Worte auf Timotheus bezeichnen. »Über dich« wahrt die mögliche Vorstellung von an oder über ihm ausgesprochenen Worten; die Alternative »dich betreffend« steht in der Fußnote.
- source_word: ἐν αὐταῖς
  choice: Durch sie
  rationale: 'ἐν kann instrumental verstanden werden: Die prophetischen Worte dienen Timotheus als Mittel oder Hilfe. Da auch ein sphärischer Sinn möglich ist, wird diese Mehrdeutigkeit in einer Fußnote bewahrt.'
- source_word: στρατεύῃ … τὴν καλὴν στρατείαν
  choice: sollst du den guten Kampf führen
  rationale: Die geläufige deutsche Wendung ist natürlich und bewahrt das militärische Bild im Kern. Die etymologisch engere Vorstellung von Kriegsdienst oder Feldzug wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Verhältnis der früheren prophetischen Worte zu Timotheus’ Auftrag
  choice: Die prophetischen Worte stehen in sachlicher Übereinstimmung mit dem Auftrag und helfen Timotheus bei dessen Ausführung.
  alternative: Die prophetischen Worte vollzogen förmlich Timotheus’ Ordination oder waren lediglich private Ermutigungen.
  rationale: Der griechische Text verbindet den Auftrag mit früheren prophetischen Worten über Timotheus, legt aber weder eine ausgearbeitete Ordinationslehre noch einen rein privaten Anlass fest.
- issue: Funktion von ἐν αὐταῖς
  choice: Im Haupttext instrumental als »durch sie« wiedergegeben.
  alternative: 'Sphärisch: »in ihnen« beziehungsweise »im Rahmen dieser Worte«.'
  rationale: Beide Nuancen sind grammatisch möglich. Der Haupttext wählt die im Deutschen verständlichere instrumentale Lesart, während die Fußnote die Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den langen griechischen Satz lesefreundlich, ohne seine logische Verbindung aufzulösen. Militärische und prophetische Bildsprache bleibt erkennbar; ungeklärte grammatische und theologische Fragen werden nicht konfessionell festgelegt.
