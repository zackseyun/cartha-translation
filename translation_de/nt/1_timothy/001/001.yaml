  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: de
  text: Paulus, Apostel des Messias Jesus[a] auf Befehl Gottes, unseres Retters, und des Messias Jesus, unserer Hoffnung,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder an beiden Stellen: »Christus Jesus«. Der griechische Titel Χριστός kann als »Messias« übersetzt werden, in manchen Zusammenhängen aber auch namensähnlicher als »Christus« wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulus
  rationale: Die im Deutschen übliche Form des Eigennamens.
- source_word: ἀπόστολος
  choice: Apostel
  rationale: Der etablierte frühchristliche Amts- und Sendungstitel gibt die besondere Beauftragung genauer wieder als das allgemeinere »Bote« oder »Gesandter«.
- source_word: Χριστοῦ Ἰησοῦ
  choice: des Messias Jesus
  rationale: Χριστός bezeichnet den gesalbten König und trägt hier noch erkennbar Titelfunktion. »Messias« macht diesen Gehalt sichtbar; die alternative traditionelle Wiedergabe »Christus Jesus« wird in einer Fußnote genannt.
- source_word: κατ’ ἐπιταγήν
  choice: auf Befehl
  rationale: Die Wendung bezeichnet eine maßgebliche Anordnung als Grundlage der apostolischen Sendung. »Auf Befehl« ist knapp, verständlich und wahrt ihre Autorität.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Gottes, unseres Retters
  rationale: Die Apposition weist Gott den Titel »unser Retter« zu; die Kommas entsprechen der natürlichen deutschen Syntax.
- source_word: καὶ Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: und des Messias Jesus, unserer Hoffnung
  rationale: Das zweite Genitivglied ist parallel zu »Gottes« von »Befehl« abhängig. »Unserer Hoffnung« steht appositionell zu Messias Jesus und bewahrt die kompakte Identifikation des griechischen Textes.
- source_word: ἐλπίδος
  choice: Hoffnung
  rationale: »Hoffnung« wahrt die Bedeutung einer zuversichtlichen, auf Gottes Heil gegründeten Erwartung und die paulinische Begriffstradition.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: 'In dieser brieflichen Selbstvorstellung bleibt der Titelgehalt erkennbar: Paulus ist Apostel des verheißenen Gesalbten, Jesus. Da »Christus Jesus« im Deutschen ebenfalls fest etabliert und der Ausdruck teilweise namensähnlich ist, bleibt diese Möglichkeit in der Fußnote erhalten.'
- issue: Bezug von »unserer Hoffnung«
  choice: 'Apposition zu Messias Jesus: »des Messias Jesus, unserer Hoffnung«'
  alternative: 'Relativsatz: »des Messias Jesus, der unsere Hoffnung ist«'
  rationale: Der griechische Genitiv stellt »unsere Hoffnung« unmittelbar als appositionelle Bezeichnung neben Messias Jesus. Die knappe deutsche Fassung erhält diese theologische Identifikation, ohne sie erklärend auszuweiten.
- issue: Zuordnung des Befehls
  choice: Der Befehl wird Gott und dem Messias Jesus gemeinsam zugeordnet
  alternative: Eine weniger klare Lesung könnte das zweite Genitivglied nur lose anfügen
  rationale: Die koordinierten Genitive θεοῦ … καὶ Χριστοῦ Ἰησοῦ hängen beide von ἐπιταγήν ab. Die Wiederaufnahme von »des« macht diese Parallelität im Deutschen deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Briefformel. Die Appositionen werden durch Kommas kenntlich gemacht; die Satzperiode bleibt wie im Ausgangstext offen, da der Vers in die folgende Adressangabe übergeht.
