    text: 'Das seltene griechische Verb bezeichnet ein Sich-treiben-Lassen von sinnlichen Begierden. Die Verbindung mit „dem Messias“ ist schwer zu deuten; nahe am Wortlaut: „wenn sie gegen den Messias sinnlich werden“. Sie kann auch den Gedanken ausdrücken: „wenn ihre Begierden sie vom Messias wegziehen“. Traditionell steht oft „Christus“.'
    reason: lexical_and_alternative_reading
  revision_rationale: Die Revision verbindet die Begierden und ihre problematische Beziehung zum Messias im deutschen Satz enger und natürlicher. Sie vermeidet zugleich die Behauptung, die genitivische Konstruktion sei in ihrer genauen Bedeutung eindeutig, und führt keine Aussage über die konkrete frühere Verpflichtung der Witwen in den Haupttext ein.
