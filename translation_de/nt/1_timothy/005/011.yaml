review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist getroffen: παραιτοῦ bezieht sich im Kontext auf die Aufnahme jüngerer Witwen in die Liste, und καταστρηνιάω bezeichnet ein von Begierden bestimmtes Verhalten in einer schwierigen, oppositionell markierten Beziehung zu Christus/Messias. Die Formulierung „ihren sinnlichen Begierden folgen“ ist jedoch gegenüber dem Verb etwas umschreibend; zudem trennt die Einschubstellung „dem Messias entgegen“ die in der griechischen Wendung eng verbundenen Elemente unnötig.'
  naturalness: „Jüngere Witwen dagegen weise ab“ ist verständlich, doch „aber“ und ein Semikolon bilden den Kontrast und die Begründung in modernem, würdigem Deutsch flüssiger ab. „Sich gegen den Messias von sinnlichen Begierden leiten lassen“ ist idiomatischer als der getrennte Einschub und wahrt die Spannung der griechischen Konstruktion.
  terminology: „Messias“ ist für Χριστός als Titel angemessen. Die Fußnote soll klarstellen, dass „gegen den Messias“ eine nahe, aber nicht unstrittige Wiedergabe der schwierigen Genitivverbindung ist, statt sie als völlig eindeutliche Wort-für-Wort-Entsprechung auszugeben.
  issues:
  - severity: medium
    issue: Unnatürliche und syntaktisch locker angebundene Wiedergabe der schwierigen Genitivverbindung
    rationale: In „wenn sie, dem Messias entgegen, ihren sinnlichen Begierden folgen“ steht „dem Messias entgegen“ als abgetrennter Einschub und die Umschreibung „Begierden folgen“ ersetzt das Verb stärker als nötig. Eine engere Verknüpfung verbessert Verständlichkeit und Quellennähe, ohne die Deutung festzulegen.
  - severity: low
    issue: Fußnote b bezeichnet „gegen den Messias“ zu stark als wörtliche Wiedergabe
    rationale: Das griechische τοῦ Χριστοῦ ist ein Genitiv nach einem seltenen Verb; die genaue Beziehung ist umstritten. Die Fußnote sollte die Nähe der Wiedergabe kennzeichnen, aber die grammatische und semantische Schwierigkeit ausdrücklich bewahren.
  revised_text: Jüngere Witwen aber weise ab; denn wenn sie sich gegen den Messias von sinnlichen Begierden leiten lassen, wollen sie heiraten.
  revised_footnotes:
  - marker: a
    text: 'Gemeint ist im Zusammenhang offenbar: Nimm sie nicht in die zuvor erwähnte Liste der Witwen auf.'
    reason: contextual_clarification
