  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: de
  text: Jüngere Witwen aber weise ab; denn wenn sie sich gegen den Messias von sinnlichen Begierden leiten lassen, wollen sie heiraten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Jüngere Witwen dagegen
  rationale: „Jüngere Witwen“ bewahrt den vergleichenden Sinn von νεωτέρας und stellt sie den zuvor behandelten älteren Witwen gegenüber; „dagegen“ gibt den milden Kontrast von δέ natürlich wieder.
- source_word: παραιτοῦ
  choice: weise ab
  rationale: Der Imperativ fordert Timotheus auf, jüngere Witwen im gegebenen Zusammenhang nicht anzunehmen. Die knappe Wiedergabe wahrt den Wortlaut; der Bezug auf die zuvor erwähnte Liste wird in einer Fußnote erläutert.
- source_word: ὅταν γὰρ
  choice: Denn wenn
  rationale: Die Formulierung erhält sowohl die begründende Kraft von γάρ als auch den allgemeinen zeitlichen Sinn von ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: ihren sinnlichen Begierden folgen
  rationale: Das seltene Verb bezeichnet ein Sich-treiben-Lassen von starken, sinnlich gefärbten Begierden. Die deutsche Formulierung ist verständlich und vermeidet das heute missverständliche oder veraltete „üppig werden“.
- source_word: τοῦ Χριστοῦ
  choice: dem Messias entgegen
  rationale: Die schwierige Genitivverbindung bezeichnet hier einen Konflikt mit der Bindung an den Messias. „Entgegen“ bewahrt den oppositionellen Sinn, ohne die genaue Art dieses Konflikts vollständig festzulegen.
- source_word: γαμεῖν θέλουσιν
  choice: wollen sie heiraten
  rationale: Die Infinitivverbindung mit θέλω drückt Wunsch oder Absicht aus. „Wollen heiraten“ ist im modernen Deutsch natürlich und semantisch direkt.
theological_decisions:
- issue: Wiedergabe von Χριστοῦ
  choice: dem Messias
  alternative: Christus
  rationale: Χριστός ist hier als Titel verständlich und wird deshalb mit „Messias“ wiedergegeben. Die traditionelle deutsche Wiedergabe „Christus“ bleibt als mögliche Alternative in der Fußnote sichtbar.
- issue: Sinn von καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: wenn sie, dem Messias entgegen, ihren sinnlichen Begierden folgen
  alternative: 'wenn ihre Begierden sie vom Messias wegziehen; wörtlicher: wenn sie gegen den Messias sinnlich ausschweifend werden'
  rationale: Die Formulierung lässt die Spannung zwischen sinnlichem Verlangen und einer vorausgesetzten Bindung an den Messias bestehen. Sie stellt das Heiraten nicht an sich als Verfehlung dar und legt die Art der früheren Verpflichtung nicht über den Kontext hinaus fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die seltene und schwierige Wendung wird im Haupttext verständlich, aber nicht übermäßig ausgedeutet wiedergegeben; die engere und die traditionelle Fassung stehen in der Fußnote.
