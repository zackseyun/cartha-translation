revisions:
- from: Jüngere Witwen dagegen weise ab[a]. Denn wenn sie, dem Messias entgegen, ihren sinnlichen Begierden folgen[b], wollen sie heiraten.
  to: Jüngere Witwen aber weise ab; denn wenn sie sich gegen den Messias von sinnlichen Begierden leiten lassen, wollen sie heiraten.
  rationale: Die Revision verbindet die Begierden und ihre problematische Beziehung zum Messias im deutschen Satz enger und natürlicher. Sie vermeidet zugleich die Behauptung, die genitivische Konstruktion sei in ihrer genauen Bedeutung eindeutig, und führt keine Aussage über die konkrete frühere Verpflichtung der Witwen in den Haupttext ein.
