  source_fidelity: Der weibliche Singular im Eingangssatz wird zutreffend wiedergegeben. Die Ergänzung „in ihrer Familie“ steht jedoch nicht im griechischen Text und grenzt die Beziehung unnötig auf Familie ein. Die Schlussformulierung deutet die im Kontext relevante Lage der Witwen nachvollziehbar, erweitert ὄντως („wirklich/tatsächlich“) aber zu stark um „auf sich allein gestellt“; diese Information sollte nicht in den Vers selbst aufgenommen werden.
