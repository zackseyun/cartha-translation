  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: de
  text: Wenn eine gläubige Frau Witwen zu versorgen hat[a], soll sie für sie sorgen. Die Gemeinde soll nicht belastet werden, damit sie für die wirklich verwitweten Frauen sorgen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: „Wenn ein gläubiger Mann oder eine gläubige Frau Witwen zu versorgen hat“ oder: „Wenn ein Gläubiger Witwen zu versorgen hat.“ Damit wird die Anweisung über eine ausdrücklich weibliche Person hinaus erweitert.'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: eine gläubige Frau
  rationale: πιστή ist in der vorliegenden Textform feminin Singular und bezeichnet daher ausdrücklich eine Frau; im Kontext meint „gläubig“ ihre Zugehörigkeit zur christlichen Gemeinschaft.
- source_word: ἔχει χήρας
  choice: Witwen in ihrer Familie hat
  rationale: Wörtlich steht „Witwen hat“. Die deutsche Ergänzung „in ihrer Familie“ macht die im Kontext vorausgesetzte persönliche Fürsorgebeziehung verständlich, ohne einen bestimmten Verwandtschaftsgrad festzulegen.
- source_word: ἐπαρκείτω αὐταῖς
  choice: soll sie für sie sorgen
  rationale: ἐπαρκέω bezeichnet hier ausreichende praktische beziehungsweise materielle Unterstützung. „Für sie sorgen“ ist natürliches Deutsch und passt zum Zusammenhang.
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: Die Gemeinde soll nicht belastet werden
  rationale: Die passive Imperativform beschreibt eine Belastung durch die Versorgungspflicht. „Gemeinde“ bezeichnet hier klar die örtliche christliche Gemeinschaft.
- source_word: ταῖς ὄντως χήραις
  choice: die Witwen, die wirklich auf sich allein gestellt sind
  rationale: ὄντως greift die in 1 Tim 5,3–5 entwickelte Kategorie der tatsächlich hilfsbedürftigen, alleinstehenden Witwen auf. Die Formulierung gibt den kontextuellen Sinn verständlich wieder, statt den missverständlichen Ausdruck „wirklich Witwen“ wörtlich nachzubilden.
- source_word: ἐπαρκέσῃ
  choice: für ... sorgen kann
  rationale: Die Wiederholung von ἐπαρκέω wird mit derselben deutschen Wendung wiedergegeben; der Konjunktiv nach ἵνα bezeichnet den Zweck beziehungsweise das dadurch ermöglichte Handeln.
theological_decisions:
- issue: Geschlecht des Subjekts im Eingangssatz
  choice: eine gläubige Frau
  alternative: ein gläubiger Mann oder eine gläubige Frau; ein gläubiger Mensch
  rationale: Der vorgelegte SBLGNT-Text liest τις πιστή, grammatisch feminin Singular. Diese spezifisch weibliche Bezugnahme bleibt im Haupttext erhalten; breitere Lesarten werden in der Fußnote dokumentiert.
- issue: Bedeutung von „wirklich Witwen“
  choice: Witwen, die wirklich auf sich allein gestellt sind
  alternative: wirkliche Witwen; Witwen im eigentlichen Sinn
  rationale: Der Ausdruck bezeichnet im Kapitel nicht den rechtlichen Familienstand als solchen, sondern Witwen ohne anderweitige familiäre Versorgung. Die Übersetzung macht diese kontextuelle Unterscheidung deutlich, ohne daraus eine konfessionelle Versorgungskategorie abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze erhöhen die Verständlichkeit. „Gemeinde“ ist im deutschen kirchlichen Sprachgebrauch für die konkrete christliche Gemeinschaft natürlicher als „Kirche“. Die kontextuelle Ergänzung „in ihrer Familie“ verdeutlicht die vorausgesetzte Fürsorgebeziehung.
