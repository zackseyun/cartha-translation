  terminology: „gläubige Frau“, „Witwen“, „Gemeinde“ und „für sie sorgen“ sind sachgerecht. Die wiederholte Wiedergabe von ἐπαρκέω durch „für ... sorgen“ erhält die terminologische Verbindung der beiden Satzhälften.
