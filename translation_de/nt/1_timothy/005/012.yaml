  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: de
  text: Damit ziehen sie sich ein Urteil zu, weil sie ihren früheren Glauben verworfen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre erste Zusage« oder »ihre frühere Verpflichtung«. Das griechische Wort kann »Glaube« bedeuten; in diesem Zusammenhang verstehen es manche jedoch als eine frühere Zusage, wahrscheinlich im Zusammenhang mit der Aufnahme in ein Witwenverzeichnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: ziehen sie sich … zu
  rationale: Das Partizip bedeutet wörtlich »habend«; zusammen mit κρίμα bezeichnet es idiomatisch, dass sie unter ein Urteil geraten bzw. es sich zuziehen.
- source_word: κρίμα
  choice: Urteil
  rationale: »Urteil« bewahrt die rechtliche und ernste Bedeutung, ohne die im Vers nicht ausdrücklich genannte ewige Verdammnis festzulegen.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι leitet hier den Grund für das Urteil ein.
- source_word: τὴν πρώτην πίστιν
  choice: ihren früheren Glauben
  rationale: πρώτην ist hier zeitlich als »früheren« wiedergegeben; πίστιν bleibt im Haupttext »Glauben«, während die kontextuell mögliche Bedeutung »Zusage/Verpflichtung« in der Fußnote erhalten wird.
- source_word: ἠθέτησαν
  choice: verworfen haben
  rationale: ἀθετέω kann »verwerfen«, »beiseitesetzen« oder »für ungültig erklären« bedeuten. »Verworfen haben« gibt die bewusste Abkehr klar und natürlich wieder, ohne die mögliche Bezugsgröße vorab festzulegen.
theological_decisions:
- issue: Bedeutung von τὴν πρώτην πίστιν im Zusammenhang
  choice: ihren früheren Glauben
  alternative: ihre erste Zusage / ihre frühere Verpflichtung
  rationale: πίστις bezeichnet gewöhnlich Glauben oder Treue, kann hier aber nach verbreitetem Verständnis auf eine frühere Zusage im Zusammenhang mit der Aufnahme in den Witwenstand zielen. Der Haupttext bewahrt die Grundbedeutung »Glaube«; die echte kontextuelle Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »sich ein Urteil zuziehen« ist idiomatisch und hält offen, welcher Art dieses Urteil ist. Die Satzverknüpfung »Damit« stellt den Bezug zum vorhergehenden Kontext her.
