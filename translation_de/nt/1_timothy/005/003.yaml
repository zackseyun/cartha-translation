  text: Ehre die Witwen, die wirklich Witwen sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unterstütze die Witwen, die wirklich Witwen sind.“ Im Zusammenhang schließt „ehren“ wahrscheinlich materielle Fürsorge ein.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Χήρας
  choice: die Witwen
  rationale: χήρα bezeichnet hier Witwen; der Akkusativ Plural ist das Objekt des Imperativs.
- source_word: τίμα
  choice: Ehre
  rationale: τιμάω bedeutet grundsätzlich „ehren, achten, wertschätzen“. Im Zusammenhang schließt dies wahrscheinlich praktische und materielle Fürsorge ein, ist aber nicht darauf beschränkt.
- source_word: τὰς ὄντως χήρας
  choice: die wirklich Witwen sind
  rationale: Die Wiederholung von χήρας zusammen mit ὄντως kennzeichnet diejenigen, die im im Folgenden erläuterten Sinn tatsächlich als Witwen gelten und der Fürsorge bedürfen.
- source_word: ὄντως
  choice: wirklich
  rationale: „Wirklich“ gibt die qualifizierende Unterscheidung des Adverbs in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutungsumfang von τιμάω im Kontext
  choice: „Ehre“ bewahrt den umfassenden Sinn von Achtung und schließt im Kontext wahrscheinlich materielle Unterstützung ein.
  alternative: „Unterstütze“ würde die praktische Fürsorge ausdrücklich machen.
  rationale: Der folgende Zusammenhang behandelt die Versorgung von Witwen, doch das griechische Verb ist weiter gefasst als finanzielle Hilfe. Die Hauptübersetzung wahrt diesen Bedeutungsumfang; die Fußnote nennt die kontextuelle Alternative.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die prägnante Imperativform und die im Griechischen beabsichtigte Wiederholung von „Witwen“ bleiben erhalten.
