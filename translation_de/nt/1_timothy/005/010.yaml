  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: de
  text: 'die für gute Werke ein gutes Zeugnis hat: wenn sie Kinder aufgezogen hat[a], wenn sie Fremde gastlich aufgenommen hat, wenn sie den Heiligen[b] die Füße gewaschen hat, wenn sie Bedrängten geholfen hat und wenn sie jedem guten Werk nachgestrebt hat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck sagt nicht ausdrücklich, ob es sich um ihre eigenen oder um andere ihr anvertraute Kinder handelt.
    reason: lexical_scope
  - marker: b
    text: Mit den »Heiligen« sind hier Gottes heiliges Volk, also die anderen Glaubenden, gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »jedem guten Werk gefolgt ist«. Der Ausdruck betont aktives und anhaltendes Streben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: durch gute Werke Anerkennung gefunden hat
  rationale: Die Formulierung gibt das passive Bezeugtwerden und dessen Grundlage idiomatisch wieder, ohne lediglich eine innere Haltung zu bezeichnen.
- source_word: ἐτεκνοτρόφησεν
  choice: Kinder aufgezogen hat
  rationale: Das Verb bezeichnet das Versorgen und Erziehen von Kindern; der griechische Text legt nicht fest, ob es die eigenen Kinder waren.
- source_word: ἐξενοδόχησεν
  choice: Fremde gastlich aufgenommen hat
  rationale: Dies bewahrt sowohl den konkreten Bezug auf die Aufnahme Fremder oder Gäste als auch den Gedanken der Gastfreundschaft.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: den Heiligen die Füße gewaschen hat
  rationale: Die konkrete Handlung demütigen Dienstes wird wörtlich bewahrt; »die Heiligen« bezeichnet im paulinischen Sprachgebrauch Gottes geheiligtes Volk.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: Bedrängten geholfen hat
  rationale: »Bedrängte« lässt die Art der Not offen, während »geholfen« die praktische Unterstützung klar und natürlich ausdrückt.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: jedem guten Werk nachgestrebt hat
  rationale: »Nachgestrebt« bringt das aktive Folgen und engagierte Verfolgen guter Werke zum Ausdruck, ohne es auf einzelne Taten zu verengen.
theological_decisions:
- issue: Bedeutung von ἅγιοι
  choice: die Heiligen
  alternative: die Gläubigen / Gottes heiliges Volk
  rationale: Die traditionelle, lexikalisch enge Wiedergabe bleibt im Haupttext erhalten; eine Fußnote erläutert, dass damit hier die anderen Glaubenden gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wenn-Struktur der Kriterien bleibt erhalten; konkrete Diensthandlungen werden anschaulich wiedergegeben. Der Text ist als Fortsetzung des Satzes aus dem vorhergehenden Vers formuliert.
