  to: Zugleich lernen sie auch, untätig von Haus zu Haus zu gehen. Und sie sind nicht nur untätig, sondern auch geschwätzig[a] und mischen sich in fremde Angelegenheiten ein[b], indem sie reden, was sich nicht gehört.
  rationale: Die Änderung von περίεργοι vermeidet eine Bedeutungsverengung auf Neugier und gibt den zentralen Sinn des ungebührlichen Einmischens wieder. Der Schlusssatz bleibt mit „reden, was sich nicht gehört“ näher am griechischen τὰ μὴ δέοντα. Die Stellung von „untätig“ bei „von Haus zu Haus zu gehen“ bildet die Verbindung von ἀργαί und περιερχόμεναι idiomatisch ab, ohne eine zusätzliche Kausalrelation einzutragen.
