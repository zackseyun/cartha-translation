id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: de
  text: Zugleich lernen sie auch, untätig von Haus zu Haus zu gehen. Und sie sind nicht nur untätig, sondern auch geschwätzig[a] und mischen sich in fremde Angelegenheiten ein[b], indem sie reden, was sich nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Klatsch verbreitend“. Das griechische Wort kann allgemein leeres oder törichtes Reden bezeichnen, schließt hier aber wahrscheinlich Klatsch ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufdringlich neugierig“ oder „geschäftig“. Gemeint ist ein unangemessenes Befassen mit Angelegenheiten anderer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Zugleich
  rationale: Gibt sowohl den gleichzeitigen als auch den ergänzenden Anschluss an den vorherigen Gedanken knapp und natürlich wieder.
- source_word: ἀργαὶ
  choice: untätig
  rationale: Bezeichnet fehlende Beschäftigung, ohne vorschnell eine innere moralische Eigenschaft wie Faulheit zu unterstellen; die Wiederholung des griechischen Wortes bleibt erhalten.
- source_word: μανθάνουσιν
  choice: gewöhnen sie sich daran
  rationale: Im Zusammenhang geht es um ein erlerntes beziehungsweise angenommenes Verhaltensmuster. Die deutsche Wendung drückt diesen habituellen Sinn idiomatisch aus.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: von Haus zu Haus zu gehen
  rationale: Gibt die Bewegung zwischen verschiedenen Haushalten in natürlichem Deutsch wieder.
- source_word: φλύαροι
  choice: geschwätzig
  rationale: Das Wort bezeichnet leeres, törichtes oder unbedachtes Reden und muss nicht ausschließlich Klatsch meinen; die Übersetzung bewahrt diese Bedeutungsbreite.
- source_word: περίεργοι
  choice: aufdringlich neugierig
  rationale: Bezeichnet ein unangebrachtes Sich-Einmischen in fremde Angelegenheiten. Die Formulierung ist im modernen Deutsch verständlich und vermeidet das heute weniger gebräuchliche Substantiv „Wichtigtuerinnen“.
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: sie reden über Dinge, über die sie nicht reden sollten
  rationale: Verbindet das Redeverb klar mit dem, was sich nicht gehört; „über Dinge reden“ passt zudem zum möglichen Einmischen in fremde Angelegenheiten.
theological_decisions:
- issue: Geschlechtsbezug der femininen Pluralformen
  choice: sie
  alternative: diese Frauen
  rationale: Die griechischen Formen beziehen sich im Kontext ausdrücklich auf die jüngeren Witwen. Das Pronomen bewahrt diesen Bezug über den vorausgehenden Kontext, ohne die Bezeichnung unnötig zu wiederholen.
- issue: Art des unangemessenen Redens
  choice: allgemein unangemessenes Reden über Dinge
  alternative: Klatsch verbreiten
  rationale: φλύαροι kann Klatsch einschließen, bezeichnet aber breiter leeres oder törichtes Reden. Deshalb wird die Aussage nicht auf Verleumdung oder Klatsch verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Referenz ergibt sich aus dem Kontext der jüngeren Witwen. Die griechische Wiederholung von ἀργαὶ wird durch die zweimalige Verwendung von „untätig“ bewahrt; die etwas schwierige Verbindung von μανθάνουσιν mit dem Partizip wird als sich entwickelnde Gewohnheit verständlich gemacht.
