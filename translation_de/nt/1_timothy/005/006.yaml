    issue: „ausschweifend lebt“ für σπαταλῶσα
    rationale: „Ausschweifend“ kann im modernen Deutsch primär Zügellosigkeit, besonders im sexuellen Bereich, bezeichnen. σπαταλάω meint allgemeiner ein selbstgenussorientiertes, luxuriöses oder dem Vergnügen hingegebenes Leben. Eine neutralere Formulierung wahrt den Bedeutungsumfang besser.
  - severity: low
    issue: „schon“ in „schon zu Lebzeiten tot“
    rationale: Das griechische ζῶσα markiert das Leben zugleich mit dem Totsein; ein ausdrückliches „schon“ ist nicht nötig und kann eine zusätzliche zeitliche Nuance nahelegen. Die Gegenüberstellung lässt sich unmittelbarer mit „obwohl sie lebt“ wiedergeben.
