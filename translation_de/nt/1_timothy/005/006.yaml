  verdict: revise
  source_fidelity: Der Kontrast δέ sowie die feminine substantivierte Partizipialform sind getroffen. „Ist tot, obwohl sie lebt“ gibt die paradoxe Verbindung von ζῶσα und dem perfektischen τέθνηκεν klar wieder, ohne die Metapher dogmatisch zu bestimmen. „Ausschweifend“ ist jedoch als Wiedergabe von σπαταλῶσα zu eng bzw. missverständlich, da es im heutigen Deutsch oft vor allem sexuelle oder zügellose Exzesse nahelegt, während das griechische Wort selbstgenussorientiertes bzw. luxuriöses Leben bezeichnet.
  naturalness: Die Satzform ist verständlich und würdig. „Für ihr Vergnügen lebt“ ist im modernen Standarddeutsch idiomatisch und bewahrt den Charakter einer fortgesetzten, am eigenen Genuss ausgerichteten Lebensführung. „Obwohl sie lebt“ macht die beabsichtigte Spannung unmittelbar sichtbar.
  terminology: „Für ihr Vergnügen lebt“ entspricht der englischen auditierbaren Entscheidung „lives for pleasure“ und bleibt gegenüber den möglichen Nuancen Luxus, Selbstverwöhnung und Genussorientierung offen. Die Fußnote bietet mit „ein selbstgenussorientiertes Leben führt“ eine sachliche lexikalische Alternative, ohne eine engere moralische oder sexuelle Konnotation einzutragen.
