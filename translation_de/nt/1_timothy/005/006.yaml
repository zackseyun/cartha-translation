  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: de
  text: Doch die, die für ihr Vergnügen lebt, ist tot, obwohl sie lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ein selbstgenussorientiertes Leben führt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: ausschweifend lebt
  rationale: Das Partizip bezeichnet eine fortdauernde, selbstgefällige und genussorientierte Lebensweise. „Ausschweifend lebt“ ist im modernen Deutsch verständlich und lässt offen, ob Luxus, Genuss oder Selbstverwöhnung im Vordergrund steht.
- source_word: ζῶσα
  choice: zu Lebzeiten
  rationale: Die Form steht temporal beziehungsweise konzessiv zum folgenden Perfekt. „Schon zu Lebzeiten“ gibt das Paradox natürlich wieder, ohne die Aussage auszudeuten.
- source_word: τέθνηκεν
  choice: ist … tot
  rationale: Das Perfekt betont den gegenwärtigen Zustand als Ergebnis des Gestorbenseins. „Ist tot“ bewahrt die zugespitzte Metapher.
- source_word: ἡ … σπαταλῶσα
  choice: die, die ausschweifend lebt
  rationale: Artikel und feminines Partizip sind substantiviert. Die Formulierung wahrt den weiblichen Bezug des Zusammenhangs, ohne „Witwe“ ausdrücklich in den Vers einzufügen.
- source_word: δὲ
  choice: Doch
  rationale: δέ setzt diese Frau in Kontrast zu der zuvor beschriebenen wirklichen Witwe. „Doch“ markiert diesen Gegensatz knapp und würdevoll.
theological_decisions:
- issue: Art des Totseins im Kontext
  choice: Die Metapher „ist … tot“ bleibt ohne nähere dogmatische Bestimmung stehen.
  alternative: „ist geistlich tot“ oder „ist moralisch tot“
  rationale: Der Gegensatz zum körperlichen Leben zeigt ein nicht körperliches Totsein an, doch der Text legt dessen genaue theologische Kategorie nicht ausdrücklich fest. Die Übersetzung bewahrt daher die Spannung.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die pointierte Gegenüberstellung von Leben und Tod sowie die feminine Bezugnahme bleiben erhalten.
