source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: de
  text: Eine wirkliche Witwe aber, die ganz allein dasteht[a], hat ihre Hoffnung auf Gott gesetzt[b] und verharrt Nacht und Tag in Bitten und Gebeten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die allein zurückgeblieben ist“. Das griechische Wort hebt ihren fortdauernden Zustand ohne unterstützende Angehörige hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hat auf Gott gehofft“. Das griechische Perfekt kann eine gefestigte Hoffnung mit fortdauernder Wirkung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Beide Begriffe werden beibehalten: „Bitten“ hebt konkrete Anliegen hervor, „Gebete“ das Beten allgemeiner.'
    reason: lexical_distinction
lexical_decisions:
- source_word: ὄντως χήρα
  choice: wirklich Witwe
  rationale: ὄντως kennzeichnet sie im Zusammenhang als Witwe im eigentlichen, hier maßgeblichen Sinn; die Formulierung bleibt verständlich, ohne kirchenrechtliche Einzelheiten in den Text hineinzulesen.
- source_word: μεμονωμένη
  choice: ganz allein dasteht
  rationale: Das Perfektpartizip bezeichnet den fortdauernden Zustand einer Frau, die ohne menschlichen beziehungsweise familiären Rückhalt geblieben ist. „Ganz allein dasteht“ gibt diesen Zustand im heutigen Deutsch natürlich wieder.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: hat ihre Hoffnung auf Gott gesetzt
  rationale: Das griechische Perfekt kann eine vollzogene und weiterhin wirksame Ausrichtung ausdrücken. Die deutsche Formulierung bewahrt diesen Gedanken.
- source_word: προσμένει
  choice: verharrt
  rationale: Das Präsens und das Verb bezeichnen anhaltendes Bleiben beziehungsweise beharrliches Fortfahren; „verharrt“ ist würdig und prägnant.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: in Bitten und Gebeten
  rationale: 'Die beiden griechischen Begriffe werden unterschieden wiedergegeben: δεήσεις hebt konkrete Bitten hervor, προσευχαί bezeichnet Gebete allgemeiner.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Nacht und Tag
  rationale: Die feste Wendung bezeichnet beständige Praxis; die griechische Reihenfolge bleibt erhalten.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert im Zusammenhang einen Gegensatz beziehungsweise eine Weiterführung. „Aber“ gibt diese Funktion knapp wieder, ohne ein nicht vorhandenes Zeitadverb einzuführen.
theological_decisions:
- issue: Kennzeichnung der „wirklichen Witwe“
  choice: 'Der Vers beschreibt eine Witwe im für diesen Zusammenhang maßgeblichen Sinn: ohne menschlichen Rückhalt, auf Gott hoffend und im Gebet beharrlich.'
  alternative: Der Vers könnte lediglich Witwen allgemein beschreiben, ohne eine im Kontext unterschiedene Gruppe zu kennzeichnen.
  rationale: ὄντως und der unmittelbare Zusammenhang von 1. Timotheus 5 sprechen für eine besondere Kennzeichnung. Die Übersetzung wahrt dies, ohne eine bestimmte konfessionelle Ordnung vorauszusetzen.
- issue: Zeitwert von ἤλπικεν
  choice: „hat ihre Hoffnung auf Gott gesetzt“ bringt eine gefestigte Hoffnung mit fortdauernder Wirkung zum Ausdruck.
  alternative: „hofft auf Gott“ würde vor allem den gegenwärtigen Zustand ausdrücken; „hat auf Gott gehofft“ könnte rein vergangen verstanden werden.
  rationale: Das griechische Perfekt verbindet die vollzogene Ausrichtung mit ihrem anhaltenden Ergebnis; die Fußnote lässt die formnähere Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ganz allein dasteht“ ist gegenwärtig und gut verständlich; „verharrt“ erhält den feierlichen Ton und die Vorstellung beständiger Praxis. Die Satzstellung bewahrt den Kontrast von δέ, ohne ein unbelegtes „nun“ einzufügen.
