id: 1TI.5.20
reference: 1 Timothy 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: de
  text: Diejenigen, die sündigen, weise vor allen zurecht,[a][b] damit auch die Übrigen Furcht haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in der Sünde verharren“. Das Präsenspartizip kann fortdauerndes sündiges Verhalten nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im unmittelbaren Zusammenhang sind möglicherweise besonders Älteste gemeint, die sündigen; der Vers selbst sagt jedoch nur: „diejenigen, die sündigen“.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: diejenigen, die sündigen
  rationale: Das substantivierte Präsenspartizip bezeichnet die Sündigenden. Die Form kann fortdauerndes Verhalten nahelegen, doch „in der Sünde verharren“ wäre im Haupttext stärker deutend.
- source_word: ἐνώπιον πάντων
  choice: vor allen
  rationale: Die Wendung gibt die öffentliche Gegenwart aller knapp und nah am griechischen Wortlaut wieder.
- source_word: ἔλεγχε
  choice: weise ... zurecht
  rationale: ἐλέγχω kann aufdecken, überführen oder zurechtweisen bedeuten. Im Zusammenhang einer disziplinarischen Anweisung ist „zurechtweisen“ natürlich und betont die korrigierende Handlung, ohne sie auf bloße öffentliche Bloßstellung zu verengen.
- source_word: οἱ λοιποὶ
  choice: die Übrigen
  rationale: Die Formulierung bezeichnet die anderen beziehungsweise verbleibenden Personen und bewahrt den knappen Ausdruck des Griechischen.
- source_word: φόβον ἔχωσιν
  choice: Furcht haben
  rationale: Die nahezu wörtliche Wiedergabe erhält offen, ob eine heilsame Scheu, ernste Besorgnis oder Angst gemeint ist.
theological_decisions:
- issue: Bezugsgruppe der Sündigenden im Kontext
  choice: Der Haupttext nennt allgemein diejenigen, die sündigen, ohne ausdrücklich „Älteste“ einzufügen.
  alternative: Wegen des unmittelbaren Zusammenhangs mit Vers 19 kann sich die Aussage insbesondere auf sündigende Älteste beziehen.
  rationale: Der griechische Vers selbst wiederholt das Wort „Älteste“ nicht. Daher bleibt der Haupttext formal offen, während eine Fußnote den wahrscheinlichen Kontextbezug nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem, knappem Anweisungsstil. Die Wortstellung hält „vor allen“ eng bei der Aufforderung und vermeidet das missverständliche „öffentlich sündigen“.
