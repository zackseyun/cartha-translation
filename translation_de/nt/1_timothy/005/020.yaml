  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes sachgerecht wieder: τοὺς ἁμαρτάνοντας als offen gehaltene Gruppe der Sündigenden, ἐνώπιον πάντων als öffentliche Zurechtweisung „vor allen“, ἔλεγχε als korrigierendes „weise … zurecht“, οἱ λοιποί als „die Übrigen“ und φόβον ἔχωσιν als bewusst nicht näher bestimmte „Furcht haben“. Der mögliche fortdauernde Aspekt des Präsenspartizips wird zutreffend nur in der Fußnote markiert.'
  naturalness: „Diejenigen, die sündigen, weise vor allen zurecht, damit auch die Übrigen Furcht haben“ ist grammatisch korrekt, klar und in modernem Standarddeutsch angemessen. Die leicht gehobene, knappe Form passt zum paränetischen Register des Briefes.
  terminology: „Zurechtweisen“ trifft ἐλέγχω im disziplinarischen Kontext gut, ohne den Sinn auf Bloßstellung oder bloßes Verurteilen zu verengen. „Furcht“ bewahrt die im Griechischen bestehende Offenheit zwischen ernster Scheu und Angst. Die Kontextfußnote wahrt die mögliche Bezugnahme auf Älteste, ohne sie unzulässig in den Haupttext einzutragen.
