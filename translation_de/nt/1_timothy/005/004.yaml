source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: de
  text: Wenn aber eine Witwe Kinder oder Enkel[a] hat, sollen diese zuerst lernen, sich im eigenen Haushalt gottesfürchtig zu verhalten[b] und ihren Vorfahren eine Gegenleistung zu erbringen[c]; denn das ist vor Gott annehmbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder oder Nachkommen“. Das griechische Wort für „Enkel“ kann allgemeiner Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am eigenen Haushalt Frömmigkeit zu üben“. Die familiäre Fürsorge wird hier als Ausdruck der Gottesfurcht dargestellt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ihren Vorfahren Gegenleistungen zu erstatten“. Im Zusammenhang sind wahrscheinlich ältere lebende Familienangehörige, besonders Eltern oder Großeltern, gemeint; die Formulierung kann die Erwiderung früherer Fürsorge einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: Witwe
  rationale: Die übliche Bedeutung bezeichnet eine Frau, deren Ehemann gestorben ist; der Zusammenhang handelt ausdrücklich von Witwen.
- source_word: τέκνα ἢ ἔκγονα
  choice: Kinder oder Enkel
  rationale: τέκνα bezeichnet Kinder; ἔκγονα kann allgemein Nachkommen meinen, bezeichnet in diesem Zusammenhang aber am ehesten Enkel als die nächste nachfolgende Familiengeneration.
- source_word: μανθανέτωσαν
  choice: sollen diese zuerst lernen
  rationale: Der Imperativ der dritten Person Plural richtet sich am natürlichsten auf die unmittelbar zuvor genannten Kinder oder Enkel. „Sollen … lernen“ gibt die Aufforderung in natürlichem Deutsch wieder.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das Wort kennzeichnet den Vorrang der Verantwortung gegenüber der eigenen Familie.
- source_word: τὸν ἴδιον οἶκον
  choice: gegenüber ihrer eigenen Familie
  rationale: οἶκος meint hier den Familien- bzw. Haushaltsverband, nicht nur ein Gebäude. Die Präposition „gegenüber“ macht die im Griechischen ungewöhnlich direkte Verbindung mit εὐσεβεῖν verständlich.
- source_word: εὐσεβεῖν
  choice: Gottesfurcht zu zeigen
  rationale: Das Verb bezeichnet frommes, auf Gott ausgerichtetes Handeln. Die Formulierung bewahrt den religiösen Gehalt und lässt zugleich erkennen, dass er sich in konkreter familiärer Fürsorge zeigt.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: zurückzugeben, was sie von ihnen empfangen haben
  rationale: Die Wortverbindung bezeichnet eine erwidernde Gegenleistung. Die deutsche Formulierung bringt natürlich zum Ausdruck, dass frühere familiäre Fürsorge nun vergolten wird, ohne eine rein finanzielle Schuld anzunehmen.
- source_word: τοῖς προγόνοις
  choice: ihren Eltern und Großeltern
  rationale: πρόγονοι bedeutet wörtlich Vorfahren. Im unmittelbaren Zusammenhang sind die älteren, noch zu versorgenden Generationen gemeint; „Eltern und Großeltern“ vermeidet die im Deutschen häufige Verbindung von „Vorfahren“ mit längst Verstorbenen.
- source_word: ἀπόδεκτον
  choice: wohlgefällig
  rationale: Das Adjektiv bezeichnet etwas, das günstig aufgenommen bzw. anerkannt wird. „Wohlgefällig“ ist in der Aussage über Gottes Bewertung präzise und würdevoll.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die feste Wendung bezeichnet Gottes Gegenwart und Beurteilung; „vor Gott“ ist knapp und idiomatisch.
theological_decisions:
- issue: Bezug des pluralischen Imperativs μανθανέτωσαν
  choice: Die Aufforderung gilt den Kindern oder Enkeln der Witwe.
  alternative: Die Aufforderung gilt den Witwen, wobei ein Numeruswechsel oder ein unausgesprochenes Subjekt angenommen wird.
  rationale: Die nächstliegenden pluralischen Bezugswörter sind τέκνα und ἔκγονα. Auch das Zurückgeben an die vorangegangenen Generationen passt sachlich zu den Kindern und Enkeln.
- issue: Religiöser Gehalt von εὐσεβεῖν
  choice: Die Fürsorge für die eigene Familie wird als Ausdruck der Gottesfurcht dargestellt.
  alternative: Das Verb bezeichnet hier lediglich die Erfüllung einer familiären Pflicht ohne ausgeprägten religiösen Gehalt.
  rationale: εὐσεβεῖν trägt ausdrücklich die Bedeutung frommen bzw. gottesfürchtigen Handelns. Der Schlusssatz, dass dieses Verhalten vor Gott wohlgefällig ist, bestätigt diesen theologischen Bezug.
- issue: Umfang von τοῖς προγόνοις
  choice: Gemeint sind im Kontext die vorangehenden, zu versorgenden Familiengenerationen, insbesondere Eltern und Großeltern.
  alternative: Der Ausdruck wird unbestimmt als „Vorfahren“ wiedergegeben und kann auch entferntere Generationen umfassen.
  rationale: Die Grundbedeutung bleibt breit, doch die konkrete Aufforderung zur familiären Fürsorge setzt lebende Angehörige der älteren Generation voraus. Eine Fußnote bewahrt die formale Breite des griechischen Ausdrucks.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Gottesfurcht“ und „wohlgefällig“ bewahren den ausdrücklichen Gottesbezug; die übrige Syntax bleibt natürlich und vermeidet unnötige Archaismen.
