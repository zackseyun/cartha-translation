  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: de
  text: Bei manchen Menschen sind die Sünden offenkundig[a] und gehen ihnen zum Gericht voraus[b]; bei anderen folgen sie hinterher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deutlich erkennbar“.'
    reason: lexical_alternative
  - marker: b
    text: „Gericht“ kann im Zusammenhang die gegenwärtige Beurteilung meinen; die Formulierung kann jedoch auch den weiteren Sinn eines göttlichen Gerichts haben.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων
  choice: bei manchen Menschen
  rationale: Die Genitivverbindung bezeichnet die Menschen, denen die Sünden zugehören. Im Deutschen ermöglicht „bei manchen Menschen“ zusammen mit dem possessiven Dativ im Folgesatz eine natürliche und geschlechtsübergreifende Wiedergabe.
- source_word: αἱ ἁμαρτίαι
  choice: die Sünden
  rationale: Der bestimmte Artikel und das konkrete Subjekt werden unmittelbar wiedergegeben.
- source_word: πρόδηλοί
  choice: offenkundig
  rationale: „Offenkundig“ bezeichnet klar erkennbare, offen zutage liegende Sünden und bewahrt den gehobenen, aber gegenwärtigen Ton.
- source_word: προάγουσαι
  choice: gehen ihnen … voraus
  rationale: Das Partizip stimmt mit „Sünden“ überein. Die Formulierung erhält das personifizierende Bild, dass die Sünden den betreffenden Menschen vorausgehen; „ihnen“ macht den im Griechischen impliziten Bezug im Deutschen verständlich.
- source_word: εἰς κρίσιν
  choice: ins Gericht
  rationale: Die Wendung bewahrt die Richtungsangabe von εἰς und lässt κρίσις bewusst offen zwischen gegenwärtiger Beurteilung und weiter gefasstem göttlichem Gericht.
- source_word: τισὶν δὲ καὶ
  choice: bei anderen
  rationale: Der Dativ des Bezugs wird idiomatisch wiedergegeben und setzt die zweite Gruppe deutlich von der ersten ab. Das καί ist in der kontrastierenden deutschen Formulierung mitgetragen.
- source_word: ἐπακολουθοῦσιν
  choice: folgen sie hinterher
  rationale: Das Verb setzt die Personifikation der Sünden fort. „Hinterherfolgen“ lässt wie das Griechische offen, wann und in welchem Rahmen sie sichtbar werden.
theological_decisions:
- issue: Bedeutungsumfang von κρίσις
  choice: „Gericht“ ohne nähere Bestimmung
  alternative: „Beurteilung“ im Sinn der gegenwärtigen Prüfung von Personen oder ausdrücklich „Gottes Gericht“
  rationale: Der unmittelbare Zusammenhang legt eine gegenwärtige Prüfung nahe, doch die Formulierung kann auch einen umfassenderen göttlichen Gerichtssinn tragen. Die Übersetzung entscheidet diese Spannung nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bewegung „vorausgehen – hinterherfolgen“ erhält das Bild des griechischen Textes; die Auslegung von „Gericht“ bleibt bewusst offen.
