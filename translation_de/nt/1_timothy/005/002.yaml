  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: de
  text: ältere Frauen wie Mütter, jüngere wie Schwestern – in aller Reinheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit aller Reinheit“. Das Wort kann hier besonders Keuschheit beziehungsweise sexuelle Lauterkeit einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: ältere Frauen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier im Gegensatz zu νεωτέρας Frauen höheren Alters, nicht Amtsträgerinnen.
- source_word: ὡς μητέρας
  choice: wie Mütter
  rationale: ὡς leitet einen Vergleich ein; die knappe Form bewahrt das familiäre Bild, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: νεωτέρας ὡς ἀδελφὰς
  choice: jüngere wie Schwestern
  rationale: Das elliptische „jüngere“ ist im Deutschen durch „Frauen“ im ersten Satzglied eindeutig und bildet die parallele Struktur des Griechischen natürlich ab.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: in aller Reinheit
  rationale: Die Wendung gibt die umfassende Bedeutung von πάσῃ wieder und lässt bei ἁγνεία sowohl moralische Reinheit allgemein als auch die im Zusammenhang stark mitschwingende sexuelle Lauterkeit zu.
theological_decisions:
- issue: Bedeutungsumfang von ἁγνεία bei der Anweisung zum Umgang mit jüngeren Frauen
  choice: in aller Reinheit
  alternative: in völliger Keuschheit; mit vollkommen sexueller Lauterkeit
  rationale: „Reinheit“ bewahrt den weiteren Bedeutungsumfang, ohne den im Kontext deutlichen Aspekt sexueller Integrität auszuschließen oder den griechischen Ausdruck darauf zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihung setzt den in 5,1 begonnenen Aufforderungssatz fort; der Gedankenstrich bindet die abschließende Bestimmung besonders an den Umgang mit jüngeren Frauen, ohne ihre mögliche weitere Reichweite dogmatisch auszuschließen.
