  verdict: approve
  source_fidelity: Der Entwurf gibt die elliptische, von 5,1 abhängige Reihung des Griechischen treffend wieder. „Ältere Frauen“ und „jüngere“ bewahren den Alterskontrast und vermeiden zu Recht eine Deutung von πρεσβυτέρας als Gemeindeamt. „Wie Mütter … wie Schwestern“ entspricht ὡς, und „in aller Reinheit“ bildet ἐν πάσῃ ἁγνείᾳ angemessen ab, ohne dessen ethisch-sexuelle Konnotation unzulässig zu verengen.
  naturalness: Das Deutsch ist knapp, idiomatisch und im würdevollen modernen Standardregister natürlich. Die Auslassung von „Frauen“ im zweiten Glied ist durch die parallele Struktur klar. Der Gedankenstrich stellt die abschließende Modalbestimmung verständlich heraus, ohne den griechischen Text zu überdeuten.
  terminology: „Reinheit“ ist für ἁγνεία die passende breite Wiedergabe. Die Fußnote erläutert sachgerecht die mögliche Lesart „mit aller Reinheit“ sowie die im Kontext naheliegende Keuschheits- bzw. sexuelle Integritätsdimension. Die Familienbegriffe sind korrekt und nicht konfessionell aufgeladen.
