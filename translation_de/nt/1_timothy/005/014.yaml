  variant: modern standard German
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: de
  text: Darum will ich, dass die jüngeren Witwen heiraten[a], Kinder bekommen, ihren Haushalt führen und dem Gegner[b] keinen Anlass zu Schmähungen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heiraten“; weil von Witwen die Rede ist, ist eine Wiederheirat gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Widersacher“; möglicherweise ist Satan gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: ich will
  rationale: Gibt den persönlichen Willen beziehungsweise die entschiedene Absicht des Verfassers direkt und in natürlichem Deutsch wieder.
- source_word: οὖν
  choice: darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gedankengang; „darum“ ist klar und weniger steif als „daher“.
- source_word: νεωτέρας
  choice: die jüngeren Witwen
  rationale: Das Adjektiv bedeutet für sich genommen „die jüngeren [Frauen]“; aus dem unmittelbaren Zusammenhang ist jedoch eindeutig „Witwen“ zu ergänzen.
- source_word: γαμεῖν
  choice: heiraten
  rationale: Das Verb bedeutet schlicht „heiraten“. Da von Witwen die Rede ist, ist sachlich eine Wiederheirat gemeint, ohne dass das griechische Verb „wieder“ ausdrücklich enthält.
- source_word: τεκνογονεῖν
  choice: Kinder bekommen
  rationale: Bezeichnet das Gebären beziehungsweise Hervorbringen von Kindern. „Kinder bekommen“ ist im modernen Deutsch natürlich und verständlich.
- source_word: οἰκοδεσποτεῖν
  choice: ihren Haushalt führen
  rationale: Das Verb bezeichnet verantwortliche Leitung und Verwaltung des Haushalts. „Den Haushalt führen“ wahrt diesen aktiven Sinn, ohne unnötig den Beiklang von Herrschaft einzutragen.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: keinen Anlass geben
  rationale: Die Wendung bezeichnet, jemandem keine Gelegenheit oder Angriffsfläche zu bieten; „keinen Anlass geben“ ist die idiomatische deutsche Entsprechung.
- source_word: τῷ ἀντικειμένῳ
  choice: dem Gegner
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der sich entgegenstellt. „Gegner“ bewahrt die Offenheit, ob ein menschlicher Widersacher oder Satan gemeint ist.
- source_word: λοιδορίας χάριν
  choice: zur Verleumdung
  rationale: Die Wendung bezeichnet den Zweck beziehungsweise Anlass zu schmähender, herabsetzender Rede. „Zur Verleumdung“ gibt den feindseligen und rufschädigenden Sinn knapp wieder.
theological_decisions:
- issue: Identität des mit τῷ ἀντικειμένῳ bezeichneten Gegners
  choice: Die Hauptübersetzung lässt den Bezug offen und sagt „dem Gegner“.
  alternative: „dem Widersacher“, möglicherweise mit Bezug auf Satan
  rationale: Der griechische Ausdruck nennt den Teufel nicht ausdrücklich und kann auch einen menschlichen Gegner oder eine feindlich gesinnte Partei bezeichnen. Die Übersetzung soll diese sachlich bedeutsame Mehrdeutigkeit nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivreihe des Griechischen wird nach „ich will, dass“ als koordinierte Verbfolge wiedergegeben. Fachsprachliche oder konfessionell geprägte Formulierungen werden vermieden.
