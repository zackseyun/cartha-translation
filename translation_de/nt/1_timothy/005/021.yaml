id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: de
  text: 'Ich beschwöre dich vor Gott, vor dem Messias Jesus und vor den auserwählten Engeln: Befolge dies ohne Vorurteil[a] und tue nichts aus Parteilichkeit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Vorverurteilung“ beziehungsweise „ohne vorgefasstes Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus Begünstigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Ich beschwöre dich
  rationale: Das Verb leitet hier eine feierliche, nachdrückliche Verpflichtung unter Anrufung von Zeugen ein; „beschwören“ bewahrt dieses Gewicht im Deutschen.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ bezeichnet idiomatisch die Gegenwart der als Zeugen angerufenen göttlichen und himmlischen Wesen und erhält den feierlichen Ton.
- source_word: Χριστοῦ Ἰησοῦ
  choice: dem Messias Jesus
  rationale: Χριστός behält hier in der feierlichen Anrufung seinen Titelgehalt; „Messias“ gibt die Bedeutung wieder, statt sie nur zu transliterieren.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: den auserwählten Engeln
  rationale: „Auserwählt“ gibt ἐκλεκτός präzise und in würdigem, verständlichem Deutsch wieder, ohne näher zu bestimmen, worin ihre Erwählung besteht.
- source_word: ταῦτα
  choice: dies
  rationale: Das Demonstrativum verweist zusammenfassend auf die vorausgehenden Weisungen; „dies“ ist im Deutschen natürlicher als „diese Dinge“, ohne den Bezug unnötig einzuengen.
- source_word: φυλάξῃς
  choice: Befolge
  rationale: φυλάσσω bedeutet hier, Weisungen gewissenhaft einzuhalten. „Befolge“ macht diesen kontextuellen Sinn klar und natürlich.
- source_word: χωρὶς προκρίματος
  choice: ohne Vorurteil
  rationale: πρόκριμα kann ein vorweggenommenes Urteil beziehungsweise eine Voreingenommenheit bezeichnen. „Ohne Vorurteil“ bewahrt diese Bedeutungsbreite; „ohne Vorverurteilung“ wird als Alternative vermerkt.
- source_word: μηδὲν ποιῶν
  choice: und tue nichts
  rationale: Das Partizip begleitet die Hauptaufforderung. Eine koordinierte deutsche Wendung ist natürlicher und wahrt den umfassenden negativen Sinn.
- source_word: κατὰ πρόσκλισιν
  choice: aus Parteilichkeit
  rationale: πρόσκλισις bezeichnet eine Neigung zugunsten einer Seite beziehungsweise parteiisches Verhalten. „Aus Parteilichkeit“ ist klar, idiomatisch und unterscheidet sich sinnvoll vom vorangehenden πρόκριμα.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias Jesus
  alternative: Christus Jesus
  rationale: Die Wiedergabe „Messias“ macht den Titelgehalt von Χριστός transparent. „Christus Jesus“ ist die traditionelle deutsche Form, würde die lexikalische Bedeutung jedoch weniger unmittelbar erkennen lassen.
- issue: Identität der ἐκλεκτῶν ἀγγέλων
  choice: auserwählte Engel
  alternative: heilige Engel
  rationale: Der griechische Text sagt ausdrücklich „auserwählt“, nicht „heilig“. Die Übersetzung lässt offen, worauf sich ihre Erwählung bezieht, und importiert keine zusätzliche Engellehre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „vor“ macht die feierliche Zeugenformel klar. Der Doppelpunkt bildet den Inhalt der Beschwörung natürlich ab. „Vorurteil“ und „Parteilichkeit“ halten die beiden verwandten, aber nicht identischen griechischen Begriffe auseinander.
