id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: de
  text: Trink nicht länger nur Wasser[a], sondern nimm wegen deines Magens und deiner häufigen Beschwerden ein wenig Wein zu dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sei nicht länger ein Wassertrinker.“ Gemeint ist hier, dass Timotheus nicht weiterhin ausschließlich Wasser trinken soll.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: μηκέτι
  choice: nicht länger
  rationale: Das Adverb fordert dazu auf, eine bisherige Praxis nicht fortzusetzen; „nicht länger“ gibt dies im Deutschen klar und natürlich wieder.
- source_word: ὑδροπότει
  choice: trink … nur Wasser
  rationale: Das Verb bedeutet wörtlich „Wasser trinken“ beziehungsweise „Wassertrinker sein“. Der Gegensatz zum Gebrauch von Wein zeigt, dass nicht Wasser an sich untersagt wird, sondern das ausschließliche Wassertrinken gemeint ist.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten Aufforderung leitet „sondern“ im Deutschen den treffenden Gegensatz ein.
- source_word: οἴνῳ ὀλίγῳ
  choice: ein wenig Wein
  rationale: Der Dativ bezeichnet bei χράομαι das verwendete Mittel; ὀλίγῳ begrenzt ausdrücklich die Menge und wird mit „ein wenig“ bewahrt.
- source_word: χρῶ
  choice: nimm … zu dir
  rationale: χράομαι bedeutet „gebrauchen, verwenden“. Im Zusammenhang mit einem Getränk gibt „zu sich nehmen“ den gemeinten Gebrauch in natürlichem Deutsch wieder, ohne einen über den Text hinausgehenden medizinischen Fachsinn einzutragen.
- source_word: διὰ
  choice: wegen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Anlass.
- source_word: στόμαχον
  choice: Magen
  rationale: Der gewöhnliche anatomische Ausdruck wird direkt wiedergegeben.
- source_word: πυκνάς
  choice: häufigen
  rationale: Das Adjektiv bezeichnet wiederholtes beziehungsweise häufiges Auftreten.
- source_word: ἀσθενείας
  choice: Beschwerden
  rationale: ἀσθένεια kann Schwäche, Gebrechen oder Krankheit bezeichnen. „Beschwerden“ passt zum körperlichen Zusammenhang und lässt die Art und Schwere der wiederkehrenden Leiden offen.
theological_decisions:
- issue: Ob Timotheus das Wassertrinken überhaupt oder nur das ausschließliche Wassertrinken aufgeben soll
  choice: Trink nicht länger nur Wasser
  alternative: Trink nicht länger Wasser
  rationale: Der Gegensatz „sondern … ein wenig Wein“ legt nahe, dass Timotheus weiterhin Wasser trinken darf, aber nicht ausschließlich. „Nur“ verhindert das Missverständnis eines vollständigen Wasserverbots.
- issue: Ob οἶνος wörtlich oder als ausdrücklich medizinisches Getränk wiederzugeben ist
  choice: Wein
  alternative: Heilwein
  rationale: Der griechische Text nennt ausdrücklich Wein, ohne ihn lexikalisch als besondere Arzneiform zu kennzeichnen. Der Anlass ist gesundheitlich, doch eine Spezifizierung als „Heilwein“ würde mehr sagen als der Ausgangstext.
- issue: Wie bestimmt ἀσθενείας medizinisch zu verstehen ist
  choice: Beschwerden
  alternative: Krankheiten
  rationale: Das Wort kann sowohl Schwächen als auch Erkrankungen bezeichnen. „Beschwerden“ wahrt diese Bedeutungsbreite und den körperlichen Kontext, ohne eine konkrete Diagnose oder einen bestimmten Schweregrad festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Ton. Die Formulierung „nimm … zu dir“ klingt im gesundheitlichen Zusammenhang natürlich; „ein wenig“ bewahrt die ausdrückliche Mengenbegrenzung. Die Fußnote erläutert die ungewöhnliche griechische Verbalform und die im Kontext vorausgesetzte Ausschließlichkeit.
