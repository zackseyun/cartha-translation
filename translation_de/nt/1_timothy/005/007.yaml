  verdict: revise
  source_fidelity: Die Zweckkonstruktion und das unausgesprochene pluralische Subjekt werden zutreffend erfasst. „Schärfe ihnen dies ein“ fügt jedoch ein im griechischen Satz nicht ausgedrücktes indirektes Objekt („ihnen“) hinzu. Außerdem gibt „keinen Anlass zur Kritik geben“ den prädikativen Zustand ἀνεπίλημπτοι ὦσιν nur umschreibend und etwas enger wieder.
  naturalness: „Und ordne dies an“ ist modernes Standarddeutsch, wahrt den autoritativen Imperativ und benötigt kein ergänztes indirektes Objekt. „Damit sie untadelig sind“ ist knapp, idiomatisch und entspricht dem prädikativen griechischen Adjektiv.
  terminology: „Untadelig“ trifft ἀνεπίλημπτοι als „nicht berechtigt zu beanstanden / nicht angreifbar“ angemessen, ohne die absolute Unschuld zu behaupten. Die offene Referenz von „sie“ bleibt erhalten.
