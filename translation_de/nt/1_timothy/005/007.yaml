    issue: Zusatz eines indirekten Objekts in „schärfe ihnen dies ein“
    rationale: Das griechische παράγγελλε hat hier kein ausgedrücktes „ihnen“. Zwar ist ein Adressatenkreis im Kontext vorauszusetzen, doch die Übersetzung sollte ihn nicht im Haupttext ergänzen, da auch der Bezug des folgenden Plurals offen bleibt.
  - severity: low
    issue: Umschreibende Wiedergabe von ἀνεπίλημπτοι ὦσιν
    rationale: „Keinen Anlass zur Kritik geben“ verschiebt den prädikativen Zustandsausdruck zu einem Verhaltensausdruck und kann auch unberechtigte Kritik einschließen. „Untadelig sind“ ist näher am Wortlaut und im heutigen Standarddeutsch verständlich.
