  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: de
  text: Und dies ordne an[a], damit sie untadelig sind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weise dies an“, „gebiete dies“ oder „trage dies auf“; das Verb bezeichnet eine autoritative, nachdrückliche Anweisung.'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt von „sie … sind“ wird im Griechischen nicht ausdrücklich genannt. Im Zusammenhang sind wahrscheinlich die zuvor Angesprochenen gemeint, besonders die Witwen und ihre Angehörigen.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der schlichte Anschluss führt die vorhergehenden Anweisungen weiter, ohne einen im Griechischen nicht ausdrücklich vorhandenen Nachdruck hinzuzufügen.
- source_word: ταῦτα
  choice: dies
  rationale: Das Demonstrativpronomen verweist zusammenfassend auf die vorausgehenden und umliegenden Anweisungen. „Dies“ ist im Deutschen natürlicher als das wörtlichere „diese Dinge“.
- source_word: παράγγελλε
  choice: schärfe ihnen … ein
  rationale: Der Präsensimperativ bezeichnet fortgesetzte, nachdrückliche und autoritative Unterweisung. Die Wendung ist würdig und im heutigen Deutsch verständlich; mögliche Alternativen werden in der Fußnote genannt.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck- beziehungsweise Folgesatz knapp und idiomatisch wieder.
- source_word: ἀνεπίλημπτοι
  choice: keinen Anlass zur Kritik geben
  rationale: Das Adjektiv bezeichnet Personen, die keinen berechtigten Angriffspunkt bieten. Die Formulierung vermeidet den möglicherweise absolut klingenden Ausdruck „schuldlos“.
- source_word: ὦσιν
  choice: sie … geben
  rationale: Die finite deutsche Form gibt den griechischen Präsenskonjunktiv im mit „damit“ eingeleiteten Satz natürlich wieder; das grammatisch nicht ausgesprochene Subjekt muss im Deutschen als „sie“ ergänzt werden.
theological_decisions:
- issue: Bezug des unausgesprochenen pluralischen Subjekts von ἀνεπίλημπτοι ὦσιν
  choice: Im Haupttext steht nur das mehrdeutige Pronomen „sie“; die gemeinte Gruppe wird nicht festgelegt.
  alternative: Gemeint sein könnten besonders die zuvor angesprochenen Witwen und ihre Angehörigen; möglich ist auch ein weiterer Bezug auf die Gemeinde.
  rationale: Im Griechischen bleibt das Subjekt unausgesprochen. Der unmittelbare Zusammenhang legt die zuvor Angesprochenen, besonders Witwen und ihre Familien, nahe, bestimmt den Bezug aber nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung wahrt den autoritativen Ton des Imperativs und lässt den im Griechischen offenen Bezug des pluralischen Subjekts bestehen.
