  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: de
  text: Lege niemandem vorschnell die Hände auf[a] und beteilige dich nicht an den Sünden anderer. Halte dich selbst rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang kann damit insbesondere gemeint sein: „Setze niemanden vorschnell ein“ oder „Ordiniere niemanden zu schnell.“ Wörtlich steht im Griechischen „die Hände auflegen“, eine Handlung, die häufig mit der Beauftragung oder Anerkennung für einen Dienst verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: die Hände auflegen
  rationale: Die konkrete griechische Wendung wird bewahrt. Im Zusammenhang kann sie die Beauftragung oder Anerkennung für einen Dienst bezeichnen, ohne dass der Haupttext sie auf ein bestimmtes Ordinationsverständnis verengt.
- source_word: ταχέως
  choice: vorschnell
  rationale: Das Adverb warnt hier nicht bloß vor schneller, sondern vor übereilter, unzureichend geprüfter Handlung.
- source_word: μηδενὶ
  choice: niemandem
  rationale: Der deutsche Dativ entspricht der Person, der die Hände aufgelegt werden, und bewahrt den uneingeschränkten Geltungsbereich.
- source_word: μηδὲ κοινώνει
  choice: und mach dich nicht mitschuldig an
  rationale: κοινωνέω bezeichnet hier Teilhabe beziehungsweise Beteiligung. Im Zusammenhang mit Sünden gibt „sich mitschuldig machen“ die gemeinte Komplizenschaft natürlich wieder, ohne die genaue Verbindung zum vorherigen Verbot festzulegen.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: an den Sünden anderer
  rationale: ἀλλότριος bezeichnet das, was anderen gehört beziehungsweise von anderen begangen wird. Die Formulierung ist im Deutschen klar und idiomatisch.
- source_word: σεαυτὸν
  choice: dich selbst
  rationale: Das betonte Reflexivpronomen wird ausdrücklich wiedergegeben.
- source_word: ἁγνὸν
  choice: rein
  rationale: ἁγνός bezeichnet hier umfassende moralische Reinheit; „rein“ vermeidet die Verengung auf sexuelle Keuschheit.
- source_word: τήρει
  choice: Halte
  rationale: Der Imperativ fordert dazu auf, den Zustand der Reinheit fortdauernd zu bewahren. „Halte dich selbst rein“ ist natürlich und bildet diesen Sinn ab.
theological_decisions:
- issue: Bedeutung des Händeauflegens im Zusammenhang
  choice: Die Wendung „die Hände auflegen“ bleibt im Haupttext erhalten.
  alternative: „Setze niemanden vorschnell ein“ beziehungsweise „Ordiniere niemanden zu schnell“.
  rationale: Der Zusammenhang mit den Ältesten legt eine Einsetzung, Beauftragung oder öffentliche Anerkennung nahe. Der griechische Text nennt jedoch ausdrücklich das Händeauflegen und kein eindeutiges Verb für Ernennung oder Ordination; deshalb wird die mögliche Amtsbedeutung in der Fußnote erläutert, aber nicht in den Haupttext eingetragen.
- issue: Verhältnis der beiden Verbote
  choice: Die zweite Aufforderung warnt allgemein vor Mitverantwortung für die Sünden anderer, wobei ein Zusammenhang mit vorschneller Anerkennung offenbleibt.
  alternative: Die Aussage ausschließlich als Schuldteilhabe durch eine übereilte Ordination verstehen oder als völlig unabhängige allgemeine Mahnung lesen.
  rationale: Die unmittelbare Nachbarschaft der Sätze deutet einen Zusammenhang an, doch der griechische Text erklärt ihn nicht ausdrücklich. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorschnell“ verdeutlicht die unangemessene Eile; die traditionelle und zugleich anschauliche Wendung „die Hände auflegen“ bewahrt die Offenheit des Ausgangstextes.
