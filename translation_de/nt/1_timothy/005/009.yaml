  naturalness: „In die Liste aufgenommen werden“ und die Altersformulierung sind modernes, verständliches Standarddeutsch. „Die Frau eines Mannes gewesen ist“ ist bewusst leicht formell, aber verständlich und für die Wahrung der idiomatischen Mehrdeutigkeit angemessen.
  terminology: „Witwe“ und „in die Liste aufgenommen“ treffen den gemeindlich-administrativen Kontext. Die Fußnote sollte statt des wenig natürlichen Kalks „Ein-Mann-Frau“ die wörtliche griechische Struktur mit „Frau eines Mannes“ angeben.
