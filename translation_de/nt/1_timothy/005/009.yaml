  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: de
  text: Eine Witwe soll nur dann in die Liste aufgenommen werden, wenn sie mindestens sechzig Jahre alt ist und die Frau eines Mannes gewesen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Frau eines Mannes“. Der Ausdruck kann eheliche Treue beziehungsweise einen entsprechenden Ruf bezeichnen; manche verstehen ihn jedoch im Sinn von „nur einmal verheiratet gewesen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: Eine Witwe
  rationale: Die übliche Bedeutung ist eine Frau, deren Ehemann gestorben ist; im Zusammenhang geht es um ihre offizielle Aufnahme in eine Liste.
- source_word: καταλεγέσθω
  choice: soll … in die Liste aufgenommen werden
  rationale: Die Wendung gibt den administrativen Sinn einer offiziellen Erfassung natürlich und verständlich wieder.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: nur dann …, wenn sie mindestens sechzig Jahre alt ist
  rationale: Die griechische Altersangabe bezeichnet ein erreichtes Mindestalter; die deutsche Formulierung bewahrt die einschränkende Kraft und klingt natürlich.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: die Frau eines einzigen Mannes gewesen ist
  rationale: Die relativ formale Wiedergabe bewahrt die Mehrdeutigkeit des griechischen Ausdrucks, statt ihn eindeutig als nur einmal verheiratet oder als ehelich treu auszulegen.
theological_decisions:
- issue: Bedeutung von ἑνὸς ἀνδρὸς γυνή
  choice: Die idiomnahe Formulierung „die Frau eines einzigen Mannes gewesen“ bleibt im Haupttext erhalten.
  alternative: „nur einmal verheiratet gewesen“ oder „ihrem Mann treu gewesen“
  rationale: Der griechische Ausdruck kann den ehelichen Lebenswandel beziehungsweise Ruf bezeichnen, wird aber auch als Beschränkung auf eine einzige Eheschließung verstanden. Der Haupttext entscheidet diese Streitfrage nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In die Liste aufgenommen“ verdeutlicht den amtlich-gemeindlichen Vorgang. Die etwas formale Schlusswendung dient der Wahrung der echten Auslegungsmehrdeutigkeit.
