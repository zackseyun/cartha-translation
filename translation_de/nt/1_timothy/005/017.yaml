source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: de
  text: Die Ältesten, die gut leiten, sollen doppelter Ehre würdig erachtet werden[a], besonders[b] diejenigen, die sich in Wort und Lehre abmühen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollen zweifacher Ehre würdig erachtet werden“. Die Wendung kann sowohl Achtung und Anerkennung als auch materielle Unterstützung einschließen, besonders im Blick auf den folgenden Vers.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen „besonders“ hier im Sinn von „nämlich“. Dann würden die genannten Ältesten näher als diejenigen bestimmt, die sich in Wort und Lehre abmühen.
    reason: alternative_reading
  - marker: c
    text: „Wort und Lehre“ bezieht sich wahrscheinlich auf den mündlichen Dienst, etwa Verkündigung und Unterweisung.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: Ältesten
  rationale: Im Kontext der Pastoralbriefe bezeichnet das Wort anerkannte Leiter der Gemeinde, nicht lediglich ältere Männer. „Älteste“ ist die geläufige, kirchenübergreifend verständliche Entsprechung, ohne eine spätere Amtsstruktur festzulegen.
- source_word: καλῶς προεστῶτες
  choice: die gut leiten
  rationale: προΐστημι bezeichnet hier die Ausübung von Leitung oder Aufsicht. „Gut leiten“ ist natürliches modernes Deutsch und bewahrt den Gedanken tatsächlicher Leitungsverantwortung, ohne die härteren Nebenbedeutungen von „herrschen“ einzutragen.
- source_word: διπλῆς τιμῆς
  choice: doppelter Ehre
  rationale: Die relativ formale Wiedergabe erhält die Mehrdeutigkeit von τιμή, das sowohl Achtung und Anerkennung als auch materielle Unterstützung einschließen kann.
- source_word: ἀξιούσθωσαν
  choice: sollen … würdig gelten
  rationale: Die passive Imperativform fordert die Gemeinde auf, die betreffenden Ältesten entsprechend anzuerkennen. „Würdig gelten“ gibt diesen bewertenden passiven Sinn knapp und idiomatisch wieder.
- source_word: μάλιστα
  choice: besonders
  rationale: μάλιστα hebt am natürlichsten eine Gruppe innerhalb der zuvor Genannten hervor. „Besonders“ wahrt diese Akzentuierung, ohne die alternative appositionelle Deutung „nämlich“ auszuschließen.
- source_word: κοπιῶντες
  choice: die sich … abmühen
  rationale: κοπιάω bezeichnet anstrengende, aufopferungsvolle Arbeit. „Sich abmühen“ bringt den Einsatz deutlicher zum Ausdruck als das allgemeinere „arbeiten“.
- source_word: ἐν λόγῳ
  choice: in Wort
  rationale: λόγος meint hier wahrscheinlich den mündlichen Dienst der Verkündigung oder Unterweisung. „Wort“ erhält jedoch die Breite der griechischen Formulierung und vermeidet eine unnötige Festlegung allein auf die Predigt.
- source_word: διδασκαλίᾳ
  choice: Lehre
  rationale: „Lehre“ ist eine knappe und im kirchlichen Zusammenhang verständliche Wiedergabe für die Tätigkeit des Lehrens beziehungsweise Unterweisens.
theological_decisions:
- issue: Bedeutung der „doppelten Ehre“ für Gemeindeleiter
  choice: Die weitere Formulierung „doppelter Ehre“ bleibt im Haupttext erhalten.
  alternative: doppelte Achtung; doppelte Vergütung; besondere Ehre einschließlich materieller Unterstützung
  rationale: Der folgende Vers weist auf materielle Unterstützung hin, doch τιμή kann zugleich Wertschätzung und Anerkennung bezeichnen. Die offene Formulierung bewahrt den Bedeutungsumfang und legt weder ein bestimmtes Vergütungsmodell noch eine konfessionelle Ämterordnung fest.
- issue: Bedeutung von μάλιστα
  choice: „besonders“
  alternative: „nämlich“
  rationale: „Besonders“ gibt die wahrscheinliche Hervorhebung einer Teilgruppe wieder, ohne abschließend zu entscheiden, ob alle Ältesten lehrten oder ob einige diesem Dienst in besonderer Weise nachgingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gemeindesprache. Die Formulierung bleibt nahe an der griechischen Struktur, vermeidet aber unnötige Amtssprache. Echte Auslegungsfragen bei „doppelter Ehre“, μάλιστα und λόγος werden nicht im Haupttext aufgelöst, sondern in den Fußnoten transparent gemacht.
