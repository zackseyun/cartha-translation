  terminology: „Ältester“ ist im unmittelbaren Kontext von 1 Timotheus 5 die naheliegende Wiedergabe von πρεσβύτερος. Die Fußnote erhält die mögliche Lesart „älterer Mann“ sachgerecht. „Anklage“ und „Zeugen“ treffen den juristischen Charakter des Ausgangstextes. Die Verweisfußnote zu 5. Mose 19,15 ist passend.
