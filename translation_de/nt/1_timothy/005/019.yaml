  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: κατὰ πρεσβυτέρου als „gegen einen Ältesten“, κατηγορία als „Anklage“, μὴ παραδέχου als Verbot, eine solche Anklage anzunehmen, sowie ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων als Ausnahme auf Grundlage von zwei oder drei Zeugen. „Aufgrund der Aussage von“ macht die Beweisfunktion verständlich, ohne den Sinn unzulässig zu verengen.'
