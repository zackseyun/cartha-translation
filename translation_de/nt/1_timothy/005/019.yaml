id: 1TI.5.19
reference: 1 Timothy 5:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: de
  text: Nimm keine Anklage gegen einen Ältesten[a] an, außer aufgrund der Aussage von zwei oder drei Zeugen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen älteren Mann“, falls πρεσβυτέρου hier altersbezogen und nicht als Bezeichnung für einen Ältesten der Gemeinde gemeint ist.'
    reason: alternative_reading
  - marker: b
    text: Diese Formulierung greift den alttestamentlichen Rechtsgrundsatz auf, nach dem eine Sache durch zwei oder drei Zeugen bestätigt wird (vgl. 5. Mose 19,15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: gegen einen Ältesten
  rationale: πρεσβύτερος kann einen älteren Mann oder einen Ältesten als Gemeindeleiter bezeichnen. Im unmittelbaren Zusammenhang mit den Ältesten in 1 Timotheus 5 ist die funktionsbezogene Bedeutung am wahrscheinlichsten; die altersbezogene Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: κατηγορίαν
  choice: Anklage
  rationale: Das Substantiv bezeichnet eine förmliche Beschuldigung. „Anklage“ bewahrt den rechtlichen und verfahrensbezogenen Klang.
- source_word: μὴ παραδέχου
  choice: Nimm ... nicht an
  rationale: Der Imperativ untersagt, eine Anklage anzunehmen beziehungsweise als Verfahren zuzulassen. Die Formulierung ist klar und bildet die griechische Wendung eng ab, ohne bereits über ihre Wahrheit zu urteilen.
- source_word: ἐκτὸς εἰ μὴ
  choice: außer
  rationale: Die idiomatische Verbindung führt eine Ausnahme ein; „außer“ ist im Deutschen knapp und natürlich.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: aufgrund der Aussage von zwei oder drei Zeugen
  rationale: ἐπί bezeichnet hier die Beweisgrundlage. Die Ergänzung „der Aussage“ macht den gemeinten Zeugnischarakter im Deutschen deutlich und bewahrt den juristischen Sinn sowie den Bezug auf das alttestamentliche Rechtsprinzip.
theological_decisions:
- issue: Bedeutung von πρεσβυτέρου im Gemeindezusammenhang
  choice: Ältester als Gemeindeleiter beziehungsweise Amtsträger
  alternative: älterer Mann
  rationale: Der unmittelbare Kontext behandelt die Ältesten der Gemeinde und spricht daher eher für die funktionsbezogene Bedeutung. Da das Wort auch altersbezogen verstanden werden kann, wird diese echte lexikalische Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem rechtlichem Ton. „Ältester“ ist im kirchlichen Kontext verständlich, während die mögliche altersbezogene Bedeutung ausdrücklich offengehalten wird.
