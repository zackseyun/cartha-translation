  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: de
  text: Ebenso sind auch die guten Werke offenkundig; und die, bei denen es anders ist,[a] können nicht verborgen bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die anders beschaffen sind« oder »bei denen es nicht so ist«. Manche verstehen darunter in Anlehnung an den vorherigen Vers ausdrücklich böse Werke.'
    reason: Bewahrt die Bedeutungsbreite der knappen griechischen Wendung und nennt die mögliche engere Deutung.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Ebenso sind auch
  rationale: Gibt sowohl die enge Parallele zum vorherigen Vers als auch das verstärkende καί wieder, ohne die Formulierung unnötig zu beschweren.
- source_word: ἔργα τὰ καλά
  choice: die guten Werke
  rationale: Bewahrt den ethischen Sinn und entspricht zugleich einem geläufigen Ausdruck des paulinischen Sprachgebrauchs.
- source_word: πρόδηλα
  choice: offenkundig
  rationale: Bezeichnet etwas, das deutlich zutage liegt, und bildet einen klaren Gegensatz zu dem, was verborgen ist.
- source_word: τὰ ἄλλως ἔχοντα
  choice: die, mit denen es sich anders verhält
  rationale: 'Die Wendung erhält die Unbestimmtheit des Griechischen: Gemeint sind Werke, die nicht in derselben Weise offenkundig sind; sie werden nicht ausdrücklich als böse bezeichnet.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: können nicht verborgen bleiben
  rationale: Bringt neben der Unmöglichkeit auch den kontextuellen Gedanken zum Ausdruck, dass solche Werke letztlich ans Licht kommen.
theological_decisions:
- issue: Bezeichnet τὰ ἄλλως ἔχοντα ausdrücklich böse Werke oder allgemeiner Werke, mit denen es sich anders verhält?
  choice: 'Allgemeiner: Werke, die nicht in gleicher Weise offenkundig sind'
  alternative: Speziell böse Werke
  rationale: Das Griechische nennt diese Werke nicht ausdrücklich böse. Die offenere Formulierung bewahrt die mögliche moralische Anspielung aus dem Zusammenhang, ohne sie in den Text hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon verdeutlicht die Parallelität der beiden Aussagen; die bewusst etwas offene Wendung wahrt die Mehrdeutigkeit des Ausgangstextes.
