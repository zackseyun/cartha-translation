  terminology: Die terminologische Differenzierung zwischen „die Seinen“ und „Angehörige des eigenen Haushalts“ ist sachgerecht. „Den Glauben verleugnet“ wahrt die Schärfe der Aussage, ohne den Sinn konfessionell zu überbestimmen. Der Fußnotenanker b steht korrekt bei „verleugnet“ und erläutert genau diese Formulierung.
