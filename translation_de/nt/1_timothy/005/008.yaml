  source_fidelity: 'Der deutsche Text bildet die griechische Struktur und Bedeutung zuverlässig ab: τῶν ἰδίων ist mit „die Seinen“ bewusst weiter gefasst, während οἰκείων als besonders hervorgehobene Angehörige des eigenen Haushalts erscheint. „für … sorgen“ gibt προνοεῖ im Kontext praktischer Fürsorge angemessen wieder. Das Perfekt ἤρνηται ist idiomatisch als „hat … verleugnet“ wiedergegeben; „den Glauben“ und „ein Ungläubiger“ treffen den wahrscheinlichen Sinn von πίστις bzw. ἄπιστος.'
