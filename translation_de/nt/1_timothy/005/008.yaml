id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: de
  text: Wenn aber jemand nicht für die Seinen[a] sorgt, besonders für die Angehörigen des eigenen Haushalts, hat er den Glauben verleugnet[b] und ist schlimmer als ein Ungläubiger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die eigenen Angehörigen“; der Ausdruck ist weiter als nur die Menschen, die unter demselben Dach leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat dem Glauben abgeschworen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: jemand
  rationale: Das Indefinitpronomen hat allgemeinen Sinn. „Jemand“ gibt diesen natürlich wieder, ohne die Aussage auf Männer zu beschränken.
- source_word: τῶν ἰδίων
  choice: die Seinen
  rationale: Die Wendung bezeichnet die eigenen Angehörigen oder nahestehenden Personen und ist weiter gefasst als die folgende Bezeichnung der Hausgemeinschaft.
- source_word: μάλιστα
  choice: besonders
  rationale: Das Wort hebt innerhalb der größeren Gruppe eine Teilgruppe hervor, für die eine gesteigerte Verpflichtung besteht.
- source_word: οἰκείων
  choice: die Angehörigen des eigenen Haushalts
  rationale: Gemeint sind diejenigen, die zum eigenen Haushalt gehören. Die Formulierung ist im heutigen Deutsch klarer als „Hausgenossen“ und enger als das allgemeinere „Familie“.
- source_word: προνοεῖ
  choice: sorgt für
  rationale: Im Zusammenhang bezeichnet das Verb vorausschauende, praktisch wirksame Fürsorge, einschließlich materieller Versorgung.
- source_word: τὴν πίστιν
  choice: den Glauben
  rationale: Der bestimmte Ausdruck bezeichnet hier am ehesten den bekannten und bekannten christlichen Glauben, den das Verhalten praktisch verleugnet.
- source_word: ἤρνηται
  choice: hat verleugnet
  rationale: Das Perfekt beschreibt eine vollzogene Verleugnung mit fortdauernder Geltung. „Verleugnet“ bewahrt die Schärfe des griechischen Ausdrucks.
- source_word: ἀπίστου
  choice: ein Ungläubiger
  rationale: Im Gegensatz zu dem bekannt christlichen Glauben bezeichnet das Wort hier am ehesten einen Menschen, der nicht glaubt.
- source_word: χείρων
  choice: schlimmer
  rationale: Der Komparativ drückt eine zugespitzte moralische Bewertung aus; „schlimmer“ ist direkt und allgemein verständlich.
theological_decisions:
- issue: Reichweite von τῶν ἰδίων und οἰκείων
  choice: „die Seinen“ als weitere Gruppe, „die Angehörigen des eigenen Haushalts“ als besonders hervorgehobene Teilgruppe
  alternative: Beide Ausdrücke unterschiedslos auf die unmittelbare Familie beziehen
  rationale: καὶ μάλιστα hebt die zum Haushalt Gehörenden innerhalb eines weiteren Kreises besonders hervor. Die Übersetzung erhält diese Abstufung.
- issue: Bedeutung von πίστις in τὴν πίστιν ἤρνηται
  choice: „den Glauben“ im Sinn des bekannten christlichen Glaubens
  alternative: „Treue“ oder ausschließlich persönliches Vertrauen
  rationale: Der Artikel und der Zusammenhang mit dem Verb „verleugnen“ sprechen für den bekannten Glauben, zu dem sich die Person bekennt. Die Formulierung lässt zugleich die Spannung bestehen, dass dieser Glaube durch unterlassene Fürsorge praktisch verleugnet wird.
- issue: Generische Personenbezeichnung
  choice: „jemand“ ohne Beschränkung auf ein Geschlecht
  alternative: „ein Mann“
  rationale: Die griechische Aussage ist allgemein formuliert. Das deutsche „jemand“ gibt ihren umfassenden Geltungsbereich natürlich wieder.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Die Seinen“ ist eine geläufige, knappe Bezeichnung für den weiteren Kreis eigener Angehöriger; die folgende Wendung präzisiert die besonders verpflichtende Hausgemeinschaft. Die Satzstruktur bleibt nah am griechischen Gedankengang, ohne unnatürlich zu wirken.
