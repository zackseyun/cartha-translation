id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: de
  text: Weise einen älteren Mann[a] nicht scharf zurecht, sondern rede ihm zu wie einem Vater, jüngeren Männern wie Brüdern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Ältesten«. Das griechische Wort kann sowohl einen älteren Mann als auch einen Gemeindeältesten bezeichnen; der Gegensatz zu den jüngeren Männern und die Fortsetzung in Vers 2 sprechen hier für die Altersangabe.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: einen älteren Mann
  rationale: Der substantivierte Komparativ steht im Gegensatz zu νεωτέρους und gehört zu der nach Alter und Geschlecht gegliederten Reihe in Vers 1–2. Daher ist hier die Altersbezeichnung wahrscheinlicher als das Gemeindeamt „Ältester“.
- source_word: μὴ ἐπιπλήξῃς
  choice: weise ... nicht scharf zurecht
  rationale: ἐπιπλήσσω bezeichnet ein tadelndes, hartes Anfahren. „Scharf zurechtweisen“ gibt diese Intensität idiomatisch wieder und lässt zugleich den Gegensatz zum respektvollen Zureden erkennen.
- source_word: ἀλλὰ παρακάλει
  choice: sondern rede ihm zu
  rationale: παρακαλέω kann auffordern, ermahnen, ermutigen oder eindringlich bitten bedeuten. „Zureden“ bewahrt hier die respektvolle und persönliche Färbung, ohne den Sinn unnötig festzulegen.
- source_word: ὡς πατέρα
  choice: wie einem Vater
  rationale: ὡς kennzeichnet den Vergleich; der deutsche Dativ entspricht der durch παρακάλει bestimmten Beziehung zum Angeredeten.
- source_word: νεωτέρους
  choice: jüngeren Männern
  rationale: Der substantivierte maskuline Plural bezeichnet im Zusammenhang jüngere Männer; Vers 2 behandelt Frauen gesondert. Der Dativ ist im Deutschen als Ergänzung zu „zureden“ erforderlich.
- source_word: ὡς ἀδελφούς
  choice: wie Brüdern
  rationale: Die maskuline Bezeichnung ist in der nach Geschlecht gegliederten Reihe spezifisch und daher nicht inklusiv zu erweitern.
theological_decisions:
- issue: Bezeichnet Πρεσβυτέρῳ einen Amtsträger oder einen älteren Mann?
  choice: 'altersbezogen: „älteren Mann“'
  alternative: „Ältesten“
  rationale: Die parallele Folge älterer Mann/Vater, jüngere Männer/Brüder sowie anschließend ältere Frauen/Mütter und jüngere Frauen/Schwestern spricht deutlich für Alters- und Geschlechtsgruppen. Die Amtsbedeutung bleibt sprachlich möglich und wird deshalb in der Fußnote genannt.
- issue: Ist ἀδελφούς inklusiv wiederzugeben?
  choice: „Brüdern“
  alternative: „Geschwistern“
  rationale: Hier ist der maskuline Plural Teil einer ausdrücklich nach Geschlecht unterschiedenen Reihe; eine inklusive Wiedergabe würde diese Struktur verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rede ihm zu“ vermeidet einen amtlich-harten Ton und bildet den respektvollen familiären Vergleich natürlich ab. Das abschließende Komma bleibt erhalten, da der Satz in Vers 2 weitergeführt wird.
