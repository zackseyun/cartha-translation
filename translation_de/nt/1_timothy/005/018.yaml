base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: de
  text: 'Denn die Schrift sagt: »Du sollst einem Ochsen beim Dreschen[a] nicht das Maul verbinden«, und: »Der Arbeiter ist seines Lohnes[b] wert.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einem Ochsen, der drischt«. Das griechische Partizip bezeichnet einen Ochsen während der Drescharbeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Der Arbeiter hat seinen Lohn verdient.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Denn die Schrift sagt
  rationale: γάρ stellt den begründenden Zusammenhang zum vorherigen Vers her; ἡ γραφή bezeichnet hier autoritative heilige Schrift, und das Präsens λέγει wird als fortdauerndes »sagt« wiedergegeben.
- source_word: Βοῦν ἀλοῶντα
  choice: einem Ochsen, der drischt
  rationale: βοῦς bezeichnet hier einen als Arbeitstier eingesetzten Ochsen; das Partizip ἀλοῶντα beschreibt ihn während des Dreschens. Der Relativsatz ist im Deutschen natürlich und bewahrt den zeitgleichen Vorgang.
- source_word: οὐ φιμώσεις
  choice: Du sollst … nicht das Maul verbinden
  rationale: Der griechische Futur Indikativ hat im Zitat prohibitive Kraft. »Du sollst nicht« erhält den rechtlich-schriftsprachlichen Ton; »das Maul verbinden« gibt das Verhindern des Fressens beim Dreschen idiomatisch wieder.
- source_word: καί
  choice: und
  rationale: καί verbindet die beiden angeführten Aussagen schlicht miteinander.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Der Arbeiter ist … wert
  rationale: ἐργάτης bezeichnet allgemein jemanden, der arbeitet. »Arbeiter« ist verständlich, wahrt die maskuline Singularform und passt zur sprichwortartigen Aussage.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: seines Lohnes
  rationale: μισθός bezeichnet hier die für Arbeit geschuldete Vergütung, nicht einen abstrakten Lohn im Sinn einer Belohnung. Der Genitiv wird in der festen deutschen Wendung »seines Lohnes wert« bewahrt.
theological_decisions:
- issue: Reichweite von ἡ γραφή bei den beiden Zitaten
  choice: Beide Aussagen werden ohne einschränkende Erläuterung unter »die Schrift sagt« wiedergegeben.
  alternative: Nur das erste Zitat ausdrücklich als Schriftwort verstehen und das zweite als Sprichwort oder Herrenwort absetzen.
  rationale: Die Satzgestalt stellt beide Zitate nach der einleitenden Formel nebeneinander. Die Übersetzung bewahrt diese Offenheit, ohne daraus eine weitergehende Kanontheorie abzuleiten.
- issue: Geschlecht und Numerus von αὐτοῦ
  choice: »seines Lohnes« im maskulinen Singular
  alternative: Eine geschlechtsneutrale Pluralform wie »ihres Lohnes« bei »die Arbeitenden«
  rationale: Die griechische Aussage steht im maskulinen Singular und ist zugleich allgemein formulierbar. Die deutsche Fassung erhält die Quellform, ohne den allgemeinen Geltungsanspruch einzuschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht schriftsprachlichem Ton. Die Zitatform »Du sollst … nicht« wahrt den Charakter eines Schriftgebots; die feste Wendung »seines Lohnes wert« erhält die knappe, sprichwortartige Form.
