source:
  edition: SBLGNT
  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: de
  text: Denn einige sind bereits vom Weg abgekommen und Satan gefolgt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sind hinter Satan her abgewichen«; die Formulierung kann auch bedeuten: »sind Satan nachgefolgt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: bereits
  rationale: Bewahrt die zeitliche Aussage, dass diese Abkehr schon eingetreten ist, in natürlichem modernem Deutsch.
- source_word: γάρ
  choice: Denn
  rationale: Kennzeichnet den Satz als Begründung für die vorausgehende Anweisung.
- source_word: τινες
  choice: einige
  rationale: Gibt die unbestimmte Teilmenge knapp und idiomatisch wieder.
- source_word: ἐξετράπησαν
  choice: sind … vom Weg abgekommen
  rationale: Bewahrt das Bild des Abweichens von einem richtigen Weg, ohne eine fremde Verursachung auszudrücken.
- source_word: ὀπίσω
  choice: folgen
  rationale: Gibt die Verbindung mit einer Person verständlich als Nachfolge wieder; die wörtlichere räumliche Ausdrucksweise wird in der Fußnote bewahrt.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Entspricht der üblichen deutschen Wiedergabe des neutestamentlichen Namens beziehungsweise Titels.
theological_decisions:
- issue: Ob ὀπίσω τοῦ Σατανᾶ räumlich-wörtlich oder idiomatisch als Nachfolge wiederzugeben ist.
  choice: folgen Satan
  alternative: sind hinter Satan her vom Weg abgekommen / haben sich Satan zugewandt
  rationale: Die Hauptfassung macht die persönliche Ausrichtung beziehungsweise Nachfolge deutlich, ohne die ernste Aussage abzuschwächen. Die ungewöhnliche Wortfolge und räumliche Bildlichkeit des Griechischen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wegmetapher von ἐκτρέπομαι wird ausdrücklich erhalten; zugleich wird ὀπίσω mit dem idiomatischen deutschen Verb »folgen« erschlossen.
