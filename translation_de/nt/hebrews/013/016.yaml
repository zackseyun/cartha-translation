id: HEB.13.16
reference: Hebrews 13:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: de
  text: Und vergesst nicht, Gutes zu tun und mit anderen zu teilen[a]; denn an solchen Opfern hat Gott Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Gemeinschaft«, »Anteilnahme«, »Beitrag« oder »Freigebigkeit« bedeuten. Hier ist wahrscheinlich das praktische Teilen mit anderen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: Gutes zu tun
  rationale: Das Substantiv bezeichnet tätiges Wohltun. Die verbale Wendung ist im heutigen Deutsch natürlich und bewahrt den Handlungscharakter.
- source_word: κοινωνίας
  choice: mit anderen zu teilen
  rationale: Im Zusammenhang mit dem Wohltun und den anschließend genannten Opfern liegt praktisches Teilen, wahrscheinlich auch von materiellen Mitteln, nahe. Die Formulierung legt den Umfang jedoch nicht unnötig eng fest.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: vergesst nicht
  rationale: Dies gibt die Grundbedeutung des griechischen Verbs unmittelbar wieder und ist als Mahnung auch im Deutschen idiomatisch; gemeint ist, diese Taten nicht außer Acht zu lassen.
- source_word: τοιαύταις ... θυσίαις
  choice: an solchen Opfern
  rationale: Die Wendung bewahrt ausdrücklich das kultische Bild, mit dem Wohltun und Teilen als Opfer bezeichnet werden.
- source_word: εὐαρεστεῖται
  choice: hat ... Freude
  rationale: Die griechische Passivform bedeutet, dass Gott an diesen Opfern Wohlgefallen hat. Die gewählte Wendung ist klar, würdig und natürlich.
- source_word: δὲ
  choice: Und
  rationale: Die Partikel verbindet die Mahnung locker mit dem vorhergehenden Gedankengang und drückt hier keinen starken Gegensatz aus.
- source_word: ὁ θεός
  choice: Gott
  rationale: Standardwiedergabe des ausdrücklich genannten Subjekts.
theological_decisions:
- issue: Charakter der »Opfer«
  choice: Wohltun und Teilen werden metaphorisch als Opfer bezeichnet, an denen Gott Freude hat.
  alternative: Die Aussage ausschließlich auf Almosen zu verengen oder die Opfersprache als bloße allgemeine Moralrede abzuschwächen.
  rationale: θυσίαις hält die kultische Bildsprache ausdrücklich fest, während εὐποιΐας und κοινωνίας deren praktische Gestalt benennen. Die Übersetzung bewahrt beides, ohne den Sinn konfessionell einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede im Plural entspricht dem griechischen Imperativ. »Opfer« bleibt als theologisch bedeutsames Bild erhalten.
