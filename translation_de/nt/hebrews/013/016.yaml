  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes zutreffend wieder: die fortlaufende Mahnung (δέ), das Nicht-Vergessen als Aufforderung zu praktischem Handeln, Wohltun (εὐποιΐα), Teilen/Gemeinschaft (κοινωνία) sowie die Bildsprache der Gott wohlgefälligen Opfer. »Mit anderen zu teilen« bringt den im Kontext naheliegenden praktischen Gehalt von κοινωνία idiomatisch zum Ausdruck, ohne ihn auf Almosen zu beschränken.'
  naturalness: »Und vergesst nicht, Gutes zu tun und mit anderen zu teilen; denn an solchen Opfern hat Gott Freude« ist flüssiges, modernes Standarddeutsch und bewahrt einen angemessen würdigen biblischen Ton. Die direkte Pluralanrede entspricht dem griechischen Imperativ.
  terminology: »Gutes zu tun« ist eine treffende moderne Wiedergabe von εὐποιΐα. »Opfern« erhält die ausdrückliche kultische Metapher von θυσίαις. »Hat Gott Freude« gibt εὐαρεστεῖται natürlich und sachgerecht als Gottes Wohlgefallen wieder. Die Fußnote benennt die relevante Bedeutungsbreite von κοινωνία und ordnet den Kontext behutsam ein.
