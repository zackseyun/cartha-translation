base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: de
  text: Ihr sollt wissen, dass unser Bruder Timotheus freigelassen worden ist.[a] Wenn er bald kommt, werde ich euch zusammen mit ihm sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fortgeschickt worden ist« beziehungsweise »entlassen worden ist«. Wahrscheinlich ist eine Freilassung aus der Haft gemeint, doch das Verb legt den Grund der Entlassung nicht ausdrücklich fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Ihr sollt wissen
  rationale: Der präsentische Imperativ informiert die Adressaten und behält zugleich seine auffordernde Kraft; die deutsche Formulierung klingt natürlich.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: unser Bruder
  rationale: Bewahrt die im frühchristlichen Kontext übliche familiäre Bezeichnung und bezieht sie eindeutig auf Timotheus.
- source_word: Τιμόθεον
  choice: Timotheus
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
- source_word: ἀπολελυμένον
  choice: freigelassen worden ist
  rationale: Das Perfektpassiv bezeichnet eine abgeschlossene Handlung mit fortdauernder Relevanz. Eine Freilassung aus Haft oder Gewahrsam ist im Kontext wahrscheinlich, ohne dass der griechische Ausdruck dies ausdrücklich nennt.
- source_word: μεθ’ οὗ
  choice: zusammen mit ihm
  rationale: Gibt die Begleitung durch Timotheus im Deutschen klar und idiomatisch wieder.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Wenn er bald kommt
  rationale: Bewahrt die Bedingung; τάχιον ist formal komparativ, hat hier aber idiomatisch den Sinn „bald/rechtzeitig“.
- source_word: ὄψομαι ὑμᾶς
  choice: werde ich euch sehen
  rationale: Entspricht unmittelbar dem Futur von ὁράω; „besuchen“ wäre eine plausible, aber stärker deutende Wiedergabe.
