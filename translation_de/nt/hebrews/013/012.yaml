id: HEB.13.12
reference: Hebrews 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: de
  text: Darum hat auch Jesus außerhalb des Tores[a] gelitten, um das Volk durch sein eigenes Blut zu heiligen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Außerhalb des Tores“ bezeichnet wahrscheinlich den Ort außerhalb Jerusalems, an dem Jesus litt, und greift zugleich das im vorherigen Zusammenhang erwähnte Beseitigen der Opferreste außerhalb des Lagers auf.
    reason: cross_reference
  - marker: b
    text: 'Oder: „heilig zu machen“ beziehungsweise „zu weihen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Die Folgerungspartikel knüpft den Satz unmittelbar an das zuvor beschriebene Opfergeschehen an; „Darum“ ist klar und idiomatisch.
- source_word: καὶ
  choice: auch
  rationale: „Auch“ stellt Jesus in Entsprechung zu dem zuvor genannten Opfermuster, ohne die Aussage unnötig zu verstärken.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Die im Deutschen übliche Namensform.
- source_word: ἵνα ἁγιάσῃ
  choice: um … zu heiligen
  rationale: Die Infinitivkonstruktion gibt den Zweck der ἵνα-Konstruktion natürlich wieder. „Heiligen“ bewahrt den kultischen und theologischen Gehalt von ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: durch sein eigenes Blut
  rationale: „Durch“ bezeichnet hier das Mittel; „eigenes“ erhält die Hervorhebung durch ἰδίου und die Opferbildsprache.
- source_word: τὸν λαόν
  choice: das Volk
  rationale: Die bestimmte, aber nicht näher ausgeführte Bezeichnung bleibt erhalten, ohne „Gottes“ ergänzend einzutragen.
- source_word: ἔξω τῆς πύλης
  choice: außerhalb des Tores
  rationale: Die Einzahl des griechischen Textes bleibt gewahrt. Ein Stadttor Jerusalems ist im Zusammenhang vorausgesetzt, wird aber nicht ausdrücklich ergänzt.
- source_word: ἔπαθεν
  choice: hat … gelitten
  rationale: Das deutsche Perfekt gibt das punktuell dargestellte vergangene Leiden natürlich und prägnant wieder.
theological_decisions:
- issue: Wiedergabe von ἁγιάζω im Opferzusammenhang
  choice: heiligen
  alternative: heilig machen; weihen
  rationale: „Heiligen“ bewahrt die kultische und bundestheologische Spannung des Hebräerbriefs, ohne den Ausdruck auf moralische Veränderung oder eine bestimmte konfessionelle Lehre zu verengen.
- issue: Umfang von τὸν λαόν
  choice: das Volk
  alternative: das Volk Gottes
  rationale: Der Zusammenhang legt Gottes Bundesvolk nahe, doch der griechische Wortlaut enthält die Ergänzung „Gottes“ nicht. Die Übersetzung lässt diese kontextuelle Bestimmung unausgesprochen.
- issue: Bezug von „außerhalb des Tores“
  choice: wörtliche Formulierung im Haupttext
  alternative: außerhalb des Stadttores; außerhalb Jerusalems
  rationale: Die Formulierung verweist wahrscheinlich auf Jesu Leiden außerhalb Jerusalems und greift zugleich das vorherige Bild vom Verbrennen der Opferreste außerhalb des Lagers auf. Diese Bezüge werden nicht in den Haupttext hineingeschrieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch, bewahrt aber die Folgerung, das Leiden außerhalb des Tores, den Zweck der Heiligung und das eigene Blut als Mittel. „Volk“ und „Tor“ werden nicht interpretierend erweitert.
