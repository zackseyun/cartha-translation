  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Satzes präzise wieder: διὸ καὶ mit „Darum hat auch“, den Zweck von ἵνα ἁγιάσῃ mit „um ... zu heiligen“, das Mittel διὰ τοῦ ἰδίου αἵματος mit „durch sein eigenes Blut“, τὸν λαόν mit „das Volk“ sowie ἔξω τῆς πύλης ἔπαθεν mit „außerhalb des Tores ... gelitten“. Die Einzahl von πύλης bleibt erhalten; keine interpretierende Ergänzung wie „Stadttor“ oder „Jerusalem“ steht im Haupttext.'
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch und hat einen würdigen, dem Hebräerbrief angemessenen Registerton. Die deutsche Umstellung, den Zweck nach dem Prädikat auszudrücken, ist flüssig und beeinträchtigt weder Nachdruck noch Sinn.
  terminology: „Heiligen“ ist für ἁγιάζω im kultisch-soteriologischen Zusammenhang fachlich und sprachlich angemessen. „Das Volk“ bewahrt die bestimmte, jedoch nicht ausdrücklich erweiterte Bezeichnung τὸν λαόν. „Eigenes Blut“ gibt die Betonung von ἰδίου sachgerecht wieder. Die Fußnoten sind korrekt verankert und entsprechen in Inhalt und Zurückhaltung dem englischen Audit-Trail.
