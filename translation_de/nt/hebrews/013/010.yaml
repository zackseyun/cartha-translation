  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: de
  text: Wir haben einen Altar[b], von dem diejenigen, die am Heiligtumszelt Dienst tun[a], kein Recht haben zu essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Genauer kann die Wendung auch wiedergegeben werden: »die im Zelt beziehungsweise Heiligtumszelt kultischen Dienst tun«. Gemeint sind Menschen, die im Heiligtumsdienst des alten Bundes stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der »Altar« wird unterschiedlich gedeutet: als Christus selbst, als das Kreuz, als der himmlische Altar oder als die Segenswirkungen des Opfers Christi. Der griechische Text lässt das Bild hier ohne nähere Bestimmung stehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Die übliche Bedeutung ist »Altar«. Der Begriff trägt hier wahrscheinlich typologisches und theologisches Gewicht, soll im Haupttext aber nicht deutend durch »Opfer« oder »Kreuz« ersetzt werden.
- source_word: ἐξ οὗ
  choice: von dem
  rationale: ἐκ mit dem Relativpronomen bezeichnet hier die Quelle, von der gegessen wird, und bewahrt so das Bild des Essens vom Altar.
- source_word: φαγεῖν
  choice: essen
  rationale: Der Aoristinfinitiv von ἐσθίω wird schlicht mit »essen« wiedergegeben.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: nicht essen dürfen
  rationale: ἐξουσία kann Vollmacht, Recht oder Befugnis bedeuten. Die gewählte natürliche deutsche Formulierung drückt aus, dass keine berechtigte bzw. erlaubte Teilnahme am Essen besteht.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: die am Heiligtumszelt Dienst tun
  rationale: λατρεύω bezeichnet hier kultischen Dienst. σκηνή meint im Zusammenhang des Hebräerbriefs das Zelt als Heiligtum; »Heiligtumszelt« ist verständlich und hält den Zeltcharakter fest.
- source_word: ἔχομεν
  choice: Wir haben
  rationale: Das Präsens und die Einbeziehung von Verfasser und Adressaten bleiben unmittelbar erhalten.
theological_decisions:
- issue: Bezug des »Altars« in Hebräer 13,10
  choice: Das konkrete Bild »Altar« bleibt im Haupttext ohne nähere Bestimmung stehen.
  alternative: Als Bezug werden Christus selbst, das Kreuz, der himmlische Altar oder die Segenswirkungen seines Opfers vorgeschlagen.
  rationale: Der griechische Text legt den genauen Bezug hier nicht ausdrücklich fest. Die offene Bildsprache bewahrt die theologische Spannung und vermeidet eine konfessionell oder dogmatisch verengende Auslegung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. »Heiligtumszelt« vermeidet das heute wenig geläufige »Stiftshütte«, während die kultische Zeltvorstellung erhalten bleibt. Die Fußnotenmarker stehen vollständig im Haupttext.
