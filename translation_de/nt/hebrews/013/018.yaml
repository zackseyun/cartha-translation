id: HEB.13.18
reference: Hebrews 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: de
  text: Betet für uns; denn wir sind überzeugt, dass wir ein gutes Gewissen haben, da wir uns in allem gut verhalten wollen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn wir sind überzeugt, dass wir ein gutes Gewissen haben, und wollen uns in allem ehrenhaft verhalten.“'
    reason: Die Partizipialkonstruktion kann weniger ausdrücklich kausal verstanden werden; außerdem kann καλῶς hier mit „ehrenhaft“ wiedergegeben werden.
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Betet
  rationale: Der deutsche Imperativ gibt die Aufforderung natürlich wieder. Der Präsensaspekt kann fortdauerndes Beten nahelegen, muss aber nicht ausdrücklich markiert werden.
- source_word: περὶ ἡμῶν
  choice: für uns
  rationale: Bei einem Verb des Betens entspricht περί mit Genitiv idiomatisch dem deutschen „für“.
- source_word: πειθόμεθα
  choice: wir sind überzeugt
  rationale: Die Wendung bewahrt die kognitive Bedeutung von πείθω und klingt im modernen Deutsch natürlicher als „wir sind überredet“.
- source_word: καλὴν συνείδησιν
  choice: ein gutes Gewissen
  rationale: Die direkte und geläufige Wiedergabe bewahrt die Weite von καλός; „reines Gewissen“ wäre stärker deutend.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Die adverbiale umfassende Bedeutung wird knapp und idiomatisch wiedergegeben.
- source_word: καλῶς
  choice: gut
  rationale: Die breite Bedeutung des Adverbs bleibt erhalten; „ehrenhaft“ wäre kontextuell möglich, aber spezifischer.
- source_word: θέλοντες
  choice: da wir … wollen
  rationale: Die kausal-erklärende Fassung macht den möglichen Bezug des Partizips verständlich, ohne ihn stärker als nötig festzulegen; die Fußnote nennt die formal offenere Alternative.
- source_word: ἀναστρέφεσθαι
  choice: uns … verhalten
  rationale: Das Verb bezeichnet hier die ethische Lebensführung. „Sich verhalten“ ist natürliches modernes Deutsch und passt zur reflexiven griechischen Form.
theological_decisions:
- issue: Beziehung des abschließenden Partizipialsatzes zur Aussage über das gute Gewissen
  choice: „da wir uns in allem gut verhalten wollen“ als erklärend-kausale Wiedergabe
  alternative: „wobei wir uns in allem gut verhalten wollen“ oder formal näher „in dem Wunsch, uns in allem gut zu verhalten“
  rationale: θέλοντες kann syntaktisch lockerer an die Hauptaussage angeschlossen sein. Die Hauptfassung macht einen naheliegenden erklärenden Bezug deutlich, während die Fußnote die offenere participiale Verbindung bewahrt. Daraus wird keine Behauptung moralischer Vollkommenheit gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon hält Aufforderung und Begründung klar zusammen. „Gutes Gewissen“ bewahrt die schlichte Ausdrucksweise des Griechischen; die Fußnote erhält die echte syntaktische und lexikalische Offenheit des Schlusssatzes.
