lexical_decisions:
- source_word: ἡ χάρις
  choice: Die Gnade
  rationale: Der bestimmte Artikel wird im Deutschen in dieser Segensformel natürlich wiedergegeben. „Gnade“ bewahrt den etablierten und sachlich angemessenen theologischen Gehalt von χάρις.
- source_word: μετὰ
  choice: sei mit
  rationale: μετά mit dem Genitiv bedeutet „mit“. Da der griechische Satz kein ausdrückliches Verb enthält, gibt „sei“ den in der abschließenden Segensformel mitgedachten Wunsch im Deutschen idiomatisch wieder.
- source_word: πάντων ὑμῶν
  choice: euch allen
  rationale: 'Die Formulierung bewahrt ausdrücklich die umfassende Bedeutung: Der Segenswunsch gilt der gesamten angesprochenen Gemeinschaft.'
