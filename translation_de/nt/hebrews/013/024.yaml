id: HEB.13.24
reference: Hebrews 13:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: de
  text: Grüßt alle, die euch leiten, und alle Heiligen. Es grüßen euch die aus Italien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es grüßen euch die in Italien.« Die griechische Wendung kann Menschen bezeichnen, die aus Italien stammen, oder Menschen, die sich dort befinden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Grüßt
  rationale: Der Aorist-Imperativ von ἀσπάζομαι fordert hier dazu auf, Grüße auszurichten. »Grüßt« ist direkt, natürlich und bewahrt die Aufforderung.
- source_word: πάντας
  choice: alle
  rationale: Die Form bezeichnet jeweils die Gesamtheit der genannten Gruppe; »alle« ist die unmittelbare und idiomatische Wiedergabe.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: die euch leiten
  rationale: Die substantivierte Partizipialform bezeichnet die Leitenden der Gemeinschaft. Die verbale Wiedergabe bleibt nahe am Griechischen und vermeidet politische Assoziationen von »Herrscher«.
- source_word: τοὺς ἁγίους
  choice: die Heiligen
  rationale: »Die Heiligen« bewahrt die etablierte neutestamentliche Bezeichnung für die zu Gott gehörenden Gläubigen und ihre theologische Aussage.
- source_word: ἀσπάζονται
  choice: Es grüßen euch
  rationale: Das Präsens bezeichnet den von der genannten Gruppe ausgerichteten Gruß. Die deutsche Satzstellung ist natürlich und gibt die griechische Aussage knapp wieder.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: die aus Italien
  rationale: ἀπό mit Genitiv bezeichnet am unmittelbarsten Herkunft oder Ausgangspunkt. Die Formulierung lässt die Personen näher unbestimmt; die mögliche örtliche Deutung wird in der Fußnote erhalten.
theological_decisions:
- issue: Bezug von οἱ ἀπὸ τῆς Ἰταλίας
  choice: die aus Italien
  alternative: die in Italien
  rationale: ἀπό mit Genitiv legt primär Herkunft nahe. Da die Wendung jedoch auch als Bezeichnung von Personen verstanden werden kann, die sich in Italien befinden, wird diese für den historischen Ort des Briefes relevante Mehrdeutigkeit nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Die euch leiten« ist verständlich und quellennah; »die Heiligen« bewahrt den vertrauten neutestamentlichen Sprachgebrauch. Der Fußnotenmarker steht unmittelbar nach dem mehrdeutigen Satz.
