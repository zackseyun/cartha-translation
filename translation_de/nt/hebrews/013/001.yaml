  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: de
  text: Die Liebe unter Glaubensgeschwistern soll fortbestehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Die Bruderliebe soll bleiben.“ Gemeint ist die familiäre Liebe unter den Glaubenden, Frauen wie Männern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: Liebe unter Glaubensgeschwistern
  rationale: Das Wort bezeichnet familiäre Zuneigung unter Geschwistern und im frühchristlichen Sprachgebrauch besonders die Liebe innerhalb der Glaubensgemeinschaft. Die Formulierung bewahrt das Familienbild und macht zugleich deutlich, dass Frauen wie Männer gemeint sind.
- source_word: μενέτω
  choice: soll fortbestehen
  rationale: Der Imperativ Präsens von μένω fordert dazu auf, einen bereits bestehenden Zustand dauerhaft aufrechtzuerhalten. „Soll fortbestehen“ gibt sowohl die Aufforderung als auch den fortdauernden Aspekt natürlich wieder.
- source_word: Ἡ
  choice: Die
  rationale: Der Artikel kennzeichnet die gemeinte Liebe als bekannte, bestimmte Haltung; im Deutschen lässt er sich in dieser Formulierung ausdrücklich wiedergeben.
theological_decisions:
- issue: Umfang von φιλαδελφία und geschlechtlich geprägte Familiensprache
  choice: Liebe unter Glaubensgeschwistern
  alternative: Bruderliebe; geschwisterliche Liebe; gegenseitige Liebe
  rationale: Die Übersetzung erhält die familiäre Metaphorik des griechischen Ausdrucks, ohne den Bezug für heutige Leser fälschlich auf Männer einzuengen. „Gegenseitige Liebe“ wäre weiter und würde das Familienbild abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glaubensgeschwister“ ist allgemein verständlich, schließt beide Geschlechter ein und bewahrt die familiäre Bildsprache; „fortbestehen“ bringt den durativen Sinn der Aufforderung zum Ausdruck.
