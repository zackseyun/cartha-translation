id: HEB.13.21
reference: Hebrews 13:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Er rüste euch mit allem Guten aus, damit ihr seinen Willen tut, und wirke in uns, was in seinen Augen wohlgefällig ist, durch Jesus, den Messias, dem[a] die Herrlichkeit gebührt in alle Ewigkeit. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dem“ kann sich unmittelbar auf Jesus, den Messias, beziehen; manche verstehen es stattdessen als Rückbezug auf Gott, das Subjekt dieses Segenswunsches.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: rüste … aus
  rationale: Der Optativ formuliert einen Segenswunsch. „Ausrüsten“ gibt hier treffend wieder, dass Gott die Glaubenden zu gehorsamem Handeln befähigt und ihnen das Nötige dazu gibt.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: mit allem Guten
  rationale: Obwohl ἐν formal oft „in“ entspricht, verlangt „ausrüsten“ im natürlichen Deutschen die Verbindung mit „mit“. Die Formulierung bewahrt den umfassenden Sinn von παντί, ohne ein im Deutschen missverständliches „in allem Guten ausrüsten“ zu verwenden.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: damit ihr seinen Willen tut
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. Der Nebensatz macht diese Zielrichtung im Deutschen klar und natürlich.
- source_word: ποιῶν ἐν ἡμῖν
  choice: und wirke in uns
  rationale: Das Partizip beschreibt das Handeln desselben göttlichen Subjekts. Die koordinierte Wunschform ist im Deutschen flüssig und erhält die Aussage, dass Gott in den Glaubenden wirkt.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: was in seinen Augen wohlgefällig ist
  rationale: Die Formulierung gibt sowohl das substantivierte εὐάρεστον als auch die bewertende Perspektive von ἐνώπιον αὐτοῦ wieder und wahrt einen würdigen biblischen Ton.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: durch Jesus, den Messias
  rationale: διά mit Genitiv bezeichnet hier die Vermittlung. Χριστός wird als Titel mit „Messias“ wiedergegeben; die Apposition ist idiomatisches Deutsch.
- source_word: ᾧ ἡ δόξα
  choice: dem die Herrlichkeit gebührt
  rationale: Der Relativanschluss bleibt erhalten, sodass der mögliche Bezug auf Jesus, den Messias, oder auf Gott nicht ausdrücklich entschieden wird. „Gebührt“ ergänzt die im Griechischen elliptische doxologische Aussage natürlich.
- source_word: εἰς τοὺς αἰῶνας
  choice: in alle Ewigkeit
  rationale: Die feste deutsche Wendung gibt die unbegrenzte Dauer der griechischen Zeitformel prägnant und würdig wieder.
theological_decisions:
- issue: Bezugswort des doxologischen Relativpronomens ᾧ
  choice: Der Relativanschluss „dem“ bleibt im Haupttext ohne ausdrückliche Festlegung des Bezugsworts stehen.
  alternative: Die Herrlichkeit wird entweder ausdrücklich Jesus, dem Messias, oder ausdrücklich Gott, dem Subjekt des Gebets, zugeschrieben.
  rationale: Das maskuline Singularpronomen ᾧ kann sich aufgrund der unmittelbaren Nähe auf Jesus, den Messias, beziehen; zugleich kann die Doxologie zum göttlichen Subjekt des Segenswunsches zurückkehren. Die Übersetzung entscheidet diese echte syntaktisch-theologische Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Segens- und Doxologieregister. Die Verbformen „rüste“ und „wirke“ geben den griechischen Gebetswunsch wieder; „wohlgefällig“ und „in alle Ewigkeit“ bewahren den feierlichen Ton, ohne altertümliche Syntax zu verwenden.
