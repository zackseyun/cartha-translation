  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: γάμος als „Ehe“, τίμιος im ermahnenden Sinn als „in Ehren stehen“, κοίτη als „Ehebett“, ἀμίαντος als „unbefleckt“ sowie die künftige göttliche Beurteilung von πόρνοι und μοιχοί. „Richten“ wahrt die Offenheit von κρινεῖ und verschärft es nicht zu „verurteilen“.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit angemessen würdigem Register. „Die Ehe soll bei allen in Ehren stehen“ und „das Ehebett soll unbefleckt bleiben“ sind idiomatisch und bilden die paränetische Reihung des Kontextes gut ab. Die Umschreibung „Menschen, die sexuell unmoralisch leben“ ist verständlich und vermeidet unnötig archaische Terminologie.
  terminology: „Ehe“, „Ehebett“, „unbefleckt“, „Ehebrecher“ und „richten“ sind terminologisch tragfähig. Die Wiedergabe von πόρνους bleibt bewusst weiter als der anschließende spezifische Begriff μοιχούς. Die Fußnoten bewahren sowohl die indikativische Lesemöglichkeit des ersten Satzteils als auch die mögliche Nuance von ἐν πᾶσιν als „von allen“.
