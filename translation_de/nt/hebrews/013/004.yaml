id: HEB.13.4
reference: Hebrews 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: de
  text: Die Ehe soll bei allen[a][b] in Ehren stehen, und das Ehebett soll unbefleckt bleiben; denn Gott wird Menschen, die sexuell unmoralisch leben, und Ehebrecher richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Aussage: „Die Ehe steht bei allen in Ehren.“ Im Griechischen fehlt hier ein ausdrückliches Verb; daher kann der Satz sowohl als Aufforderung als auch als Aussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „von allen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: in Ehren stehen
  rationale: Die Wendung gibt den Gedanken von Wertschätzung und öffentlicher Achtung natürlich und würdevoll wieder. Im ermahnenden Zusammenhang wird das fehlende Verb mit „soll … stehen“ ergänzt.
- source_word: γάμος
  choice: die Ehe
  rationale: Gemeint ist hier die Ehe als Stand und verbindliche Lebensgemeinschaft, nicht die Hochzeitsfeier.
- source_word: ἐν πᾶσιν
  choice: bei allen
  rationale: Die Formulierung bewahrt den weit gefassten Personenbezug und lässt offen, ob vor allem die allgemeine Geltung oder das Verhalten jedes Einzelnen betont wird. „Von allen“ bleibt als mögliche Wiedergabe in einer Fußnote erhalten.
- source_word: κοίτη
  choice: das Ehebett
  rationale: Das wörtliche „Bett“ steht hier im Zusammenhang mit der Ehe metonymisch für die eheliche Sexualgemeinschaft. „Ehebett“ ist im Deutschen klar und zugleich zurückhaltend.
- source_word: ἀμίαντος
  choice: unbefleckt
  rationale: „Unbefleckt“ bewahrt sowohl die moralische als auch die Reinheitsmetaphorik des griechischen Ausdrucks und passt zum feierlichen Ton des Hebräerbriefs.
- source_word: πόρνους
  choice: Menschen, die sexuell unmoralisch leben
  rationale: Der Ausdruck bezeichnet breit Menschen, die sexuelle Unmoral praktizieren. Die Umschreibung ist gegenwärtig verständlich und vermeidet das altertümliche oder enger verstandene „Unzüchtige“.
- source_word: μοιχούς
  choice: Ehebrecher
  rationale: Das Wort bezeichnet spezifisch Personen, die Ehebruch begehen, und bleibt damit vom umfassenderen vorhergehenden Begriff unterschieden.
- source_word: κρινεῖ
  choice: wird … richten
  rationale: Der Futur verweist auf Gottes künftiges Gericht. „Richten“ legt dessen Ausgang nicht stärker fest, als es das griechische Verb selbst tut.
- source_word: γάρ
  choice: denn
  rationale: „Denn“ gibt die begründende Funktion der Partikel im Deutschen klar und idiomatisch wieder.
theological_decisions:
- issue: Aussage oder Aufforderung im ersten Satzteil
  choice: 'Aufforderung: „Die Ehe soll … in Ehren stehen“'
  alternative: 'Aussage: „Die Ehe steht bei allen in Ehren“'
  rationale: Im Griechischen fehlt ein ausdrückliches Verb, sodass sowohl eine Aussage als auch eine Aufforderung möglich ist. Die Reihe ethischer Ermahnungen in Hebräer 13 spricht für die auffordernde Lesart; die echte grammatische Mehrdeutigkeit wird jedoch in der Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die parallelen Soll-Formulierungen machen den ermahnenden Zusammenhang deutlich, ohne die im Griechischen fehlende Verbform zu verschleiern; die alternative Aussagelesart steht in der Fußnote.
