  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: de
  text: Umso eindringlicher bitte ich euch, dies zu tun, damit ich umso eher zu euch zurückkehren kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ich euch umso eher wieder zurückgegeben werde“. Das Griechische bezeichnet allgemein die Wiederherstellung der Verbindung des Verfassers mit den Empfängern, ohne die genauen Umstände zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: umso eindringlicher
  rationale: Das komparative Adverb verstärkt die Bitte. Die Formulierung ist im Deutschen natürlich und gibt hier sowohl die Intensität als auch den vergleichenden Zug wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ verbindet den Satz nur leicht mit dem Vorhergehenden. Im Deutschen ist diese Verbindung durch den unmittelbaren Anschluss ausreichend erkennbar; „aber“ würde einen zu starken Gegensatz nahelegen.
- source_word: παρακαλῶ
  choice: bitte ich euch
  rationale: Das Verb bezeichnet hier eine nachdrückliche Bitte. Zusammen mit „umso eindringlicher“ wird seine Stärke natürlich wiedergegeben.
- source_word: τοῦτο ποιῆσαι
  choice: dies zu tun
  rationale: Die Wendung verweist auf die unmittelbar zuvor erbetene Fürbitte und bewahrt den rückverweisenden Charakter des griechischen τοῦτο.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt den Zweck der erbetenen Handlung knapp und idiomatisch wieder.
- source_word: τάχιον
  choice: umso eher
  rationale: Das komparative Adverb bedeutet „schneller“ oder „eher“. In Verbindung mit der erhofften Rückkehr ist „umso eher“ natürlich und wahrt den Vergleichsgrad.
- source_word: ἀποκατασταθῶ
  choice: zurückgegeben werde
  rationale: Der passive Aorist Konjunktiv kann ein Wiederherstellen oder Zurückbringen bezeichnen. „Zurückgegeben werde“ bewahrt das Passiv und den Bezug auf die Empfänger, ohne den nicht genannten Hinderungsgrund festzulegen.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet diejenigen, denen der Verfasser wieder zurückgegeben werden möchte; „euch“ gibt dies im Deutschen knapp wieder.
theological_decisions:
- issue: Art der erhofften Wiederherstellung des Verfassers
  choice: Allgemein formulierte Rückgabe beziehungsweise Rückkehr zu den Empfängern
  alternative: Freilassung aus Gefangenschaft, Genesung oder Rückkehr von einer Reise
  rationale: ἀποκατασταθῶ ὑμῖν nennt weder Gefangenschaft noch Krankheit noch Reiseumstände. Die Übersetzung lässt den historischen Anlass daher offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte umso-Konstruktion bildet die beiden griechischen Komparative ab; die Fußnote erläutert die im Deutschen etwas ungewohnte passive Formulierung und nennt die idiomatische Alternative.
