  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: de
  text: 'Lasst uns also durch ihn Gott allezeit ein Opfer des Lobes darbringen, das heißt: die Frucht der Lippen, die seinen Namen bekennen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die seinen Namen anerkennen“. Das griechische Verb kann ein offenes Bekennen oder Anerkennen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: durch ihn
  rationale: διά mit Genitiv bezeichnet hier Mittel bzw. Vermittlung. „Durch ihn“ bewahrt den Bezug auf Christus aus dem unmittelbaren Zusammenhang, ohne das Pronomen erklärend zu ersetzen.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet eine Folgerung aus dem Vorangegangenen. „Also“ ist im heutigen Deutsch klar und natürlich.
- source_word: ἀναφέρωμεν
  choice: Lasst uns … darbringen
  rationale: Der präsentische Konjunktiv der ersten Person Plural ist eine Aufforderung. „Darbringen“ erhält zugleich den kultisch-opferbezogenen Klang des Verbs.
- source_word: θυσίαν αἰνέσεως
  choice: ein Opfer des Lobes
  rationale: Die Genitivverbindung wird verständlich wiedergegeben, während das bewusst verwendete Opferbild und sein alttestamentlicher Hintergrund erhalten bleiben.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die Wendung bedeutet fortwährend bzw. zu jeder Zeit. „Allezeit“ ist knapp, würdig und im modernen Standarddeutsch verständlich.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger der Darbringung. Im Deutschen ist bei „Gott etwas darbringen“ kein zusätzliches „zu“ erforderlich.
- source_word: τοῦτ’ ἔστιν
  choice: das heißt
  rationale: Die Wendung leitet eine Erläuterung dazu ein, worin das Opfer des Lobes besteht.
- source_word: καρπὸν χειλέων
  choice: die Frucht von Lippen
  rationale: Diese Form bewahrt das konkrete Bild und ergänzt kein im Griechischen unausgesprochenes „unserer“. „Von Lippen“ klingt im Deutschen etwas natürlicher als „der Lippen“ und bleibt semantisch offen.
- source_word: ὁμολογούντων
  choice: die sich … bekennen
  rationale: Das Partizip stimmt grammatisch mit „Lippen“ überein und bezeichnet ein offenes Bekennen oder Anerkennen. Die Personifikation der Lippen bleibt erhalten.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: zu seinem Namen
  rationale: Die Verbindung „sich zu seinem Namen bekennen“ bildet den griechischen Dativ idiomatisch ab und bringt die öffentliche Anerkennung dessen zum Ausdruck, wofür Gottes Name steht.
theological_decisions:
- issue: Bezug von „ihn“ in δι’ αὐτοῦ
  choice: Das Pronomen bleibt stehen und bezieht sich im Zusammenhang auf Jesus Christus; das Lob wird durch ihn Gott dargebracht.
  alternative: Den Namen „Jesus“ oder „Christus“ ausdrücklich in den Vers einsetzen.
  rationale: Der unmittelbare Kontext macht den Bezug hinreichend deutlich. Die Wiedergabe als Pronomen wahrt die Textgestalt und erhält zugleich den Gedanken der Vermittlung durch Christus.
- issue: Opfersprache
  choice: Die Ausdrücke „darbringen“ und „Opfer des Lobes“ werden beibehalten.
  alternative: Die Bildsprache zu „Gott loben“ vereinfachen.
  rationale: Der Vers deutet Lob bewusst in Opfersprache. Eine Verflachung würde die Verbindung zwischen Opfermotiv und christlichem Gotteslob abschwächen.
- issue: Bedeutung von ὁμολογούντων
  choice: „sich zu seinem Namen bekennen“
  alternative: „seinen Namen anerkennen“ oder kontextuell „seinen Namen preisen“
  rationale: Das Verb kann öffentliches Bekennen wie auch Anerkennen bezeichnen. Die Hauptfassung wahrt den Bekenntnischarakter; die Fußnote hält die lexikalische Spannweite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Opfermetaphorik. Der Satz folgt der griechischen Gedankenführung, ohne unnötig wörtlich zu wirken. Das nicht ausdrücklich vorhandene Possessivpronomen „unserer“ wurde nicht ergänzt.
