- from: 'Lasst uns also durch ihn Gott allezeit ein Opfer des Lobes darbringen, das heißt: die Frucht von Lippen, die sich zu seinem Namen bekennen.[a]'
  to: 'Lasst uns also durch ihn Gott allezeit ein Opfer des Lobes darbringen, das heißt: die Frucht der Lippen, die seinen Namen bekennen.[a]'
  rationale: Die Revision beschränkt sich auf eine idiomatische und semantisch genauere Wiedergabe der Schlussphrase. Sie bewahrt den griechischen Dativ als deutsches Objekt bei „seinen Namen bekennen“, erhält die personifizierten „Lippen“ und ergänzt kein possessives „unserer“. Die vorhandene Fußnote bleibt als sachgerechte lexikalische Alternative verankert.
