source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: de
  text: 'Euer Lebenswandel sei frei von Geldliebe. Begnügt euch mit dem, was ihr habt. Denn er selbst hat gesagt: »Ich werde dich niemals verlassen und dich niemals im Stich lassen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zusage erinnert an alttestamentliche Verheißungen, besonders an 5. Mose 31,6 und 8 sowie Josua 1,5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: frei von Geldliebe
  rationale: Das Adjektiv bezeichnet das Freisein von Liebe zum Geld. »Geldliebe« bewahrt den spezifischen Bezug auf Habgier nach Geld, ohne den Sinn zur allgemeinen Gier auszuweiten.
- source_word: ὁ τρόπος
  choice: euer Lebenswandel
  rationale: τρόπος bezeichnet hier die Art der Lebensführung beziehungsweise das Verhalten. »Lebenswandel« ist prägnant, würdig und im Deutschen gut verständlich.
- source_word: ἀρκούμενοι
  choice: Begnügt euch
  rationale: Das Partizip hat im Zusammenhang auffordernden Sinn. Ein eigener Imperativ gibt diesen Sinn im natürlichen modernen Deutsch klar wieder.
- source_word: τοῖς παροῦσιν
  choice: mit dem, was ihr habt
  rationale: Wörtlich geht es um das Vorhandene oder Gegenwärtige. Im Kontext materieller Genügsamkeit bringt »was ihr habt« den Sinn natürlich zum Ausdruck, ohne ihn unnötig auszuweiten.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: Denn er selbst hat gesagt
  rationale: Das Perfekt bezeichnet eine gesprochene Zusage mit fortdauernder Geltung. »Er selbst« erhält die Betonung von αὐτός, ohne den im Griechischen nicht ausdrücklich genannten Gottesnamen einzufügen.
- source_word: Οὐ μή σε ἀνῶ
  choice: Ich werde dich niemals verlassen
  rationale: οὐ μή bildet eine nachdrückliche Verneinung. »Niemals verlassen« ist idiomatisch und bewahrt die starke Zusicherung.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: und dich niemals im Stich lassen
  rationale: ἐγκαταλείπω bedeutet zurücklassen oder preisgeben. »Im Stich lassen« ist gegenwärtiges, natürliches Deutsch; das wiederholte »niemals« gibt die erneute emphatische Verneinung wieder.
theological_decisions:
- issue: Identität des Sprechers im Zitat
  choice: Das griechische Pronomen wird als »er selbst« beibehalten.
  alternative: »Denn Gott selbst hat gesagt«
  rationale: Der Zusammenhang versteht Gott als Sprecher, doch im griechischen Text steht αὐτός und nicht θεός. Die Übersetzung vermeidet daher eine ausdrückliche Ergänzung.
- issue: Nachdruck der mehrfachen Verneinung
  choice: Beide Zusagen enthalten »niemals«.
  alternative: »Ich werde dich gewiss nicht verlassen oder aufgeben.«
  rationale: Die wiederholten οὐ μή-Konstruktionen verstärken die Zusicherung. Das zweimalige »niemals« bildet diesen Nachdruck auf natürliche deutsche Weise ab.
- issue: Verhältnis der beiden Verben im Zitat
  choice: »verlassen« und »im Stich lassen« werden als zwei eng verwandte Zusagen wiedergegeben.
  alternative: »loslassen« und »preisgeben«
  rationale: Die semantische Nähe der Verben bleibt sichtbar, ohne sie völlig gleichzusetzen. Zugleich wird der feierliche Charakter der Bundeszusage gewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der knappe griechische Nominalsatz wird als Aufforderung formuliert; das anschließende Partizip erscheint zur besseren Lesbarkeit als eigener Imperativ. Die Anrede wechselt entsprechend dem Ausgangstext von der Gemeinde im Plural zur einzelnen angesprochenen Person im Schriftzitat.
