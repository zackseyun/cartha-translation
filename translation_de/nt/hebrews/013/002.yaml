  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: de
  text: Vergesst die Gastfreundschaft nicht; denn durch sie haben einige, ohne es zu wissen, Engel[a] beherbergt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Boten“. Das griechische Wort kann sowohl „Engel“ als auch „Boten“ bedeuten; wegen der wahrscheinlichen Anspielung auf alttestamentliche Berichte passt hier „Engel“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: Gastfreundschaft
  rationale: Das Substantiv bezeichnet wörtlich die freundliche Aufnahme Fremder. „Gastfreundschaft“ ist im Deutschen die natürliche und etablierte Entsprechung und schließt diesen Bezug auf Fremde ein.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Vergesst ... nicht
  rationale: Die Formulierung gibt die Grundbedeutung des Verbs direkt und im Deutschen idiomatisch wieder; als Aufforderung meint sie zugleich, die Gastfreundschaft nicht außer Acht zu lassen.
- source_word: διὰ ταύτης
  choice: durch sie
  rationale: Das feminine Pronomen verweist auf die Gastfreundschaft zurück; „durch sie“ bewahrt knapp den instrumentalen Sinn von διά.
- source_word: ἔλαθόν ... ξενίσαντες
  choice: haben ..., ohne es zu wissen, ... beherbergt
  rationale: Die Verbindung von λανθάνω mit dem Partizip bezeichnet ein Handeln, dessen Bedeutung den Handelnden verborgen blieb. Die deutsche Formulierung macht dieses fehlende Wissen natürlich und ausdrücklich.
- source_word: τινες
  choice: einige
  rationale: Das indefinite Pluralpronomen wird im Deutschen präzise und natürlich mit „einige“ wiedergegeben.
- source_word: ξενίσαντες
  choice: beherbergt
  rationale: Das Verb bezeichnet hier die Aufnahme von Gästen. „Beherbergt“ ist eindeutig und vermeidet die im heutigen Deutschen mögliche Bedeutung von „bewirtet“ als bloße Verköstigung.
- source_word: ἀγγέλους
  choice: Engel
  rationale: ἄγγελος kann „Bote“ oder „Engel“ bedeuten. Die wahrscheinliche Anspielung auf alttestamentliche Berichte über himmlische Besucher spricht hier für „Engel“; die lexikalische Alternative bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ἀγγέλους
  choice: Engel im übernatürlichen Sinn
  alternative: menschliche Boten
  rationale: Die wahrscheinliche Anspielung auf die Aufnahme himmlischer Besucher, besonders in Genesis 18–19, begünstigt „Engel“. Da das griechische Wort jedoch auch „Boten“ bezeichnen kann, wird diese echte lexikalische Möglichkeit nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Pluralanrede „Vergesst“ entspricht dem griechischen Imperativ und ist allgemein verständlich. Der Satz bleibt knapp und bewahrt die inhaltliche Pointe, dass die Gastgeber die Identität ihrer Gäste nicht erkannten.
