  terminology: „Gastfreundschaft“, „Engel“ und „beherbergt“ sind semantisch passend. Die Fußnote wahrt die lexikalische Möglichkeit von ἄγγελος als „Bote“, ohne die im Kontext naheliegende Wiedergabe „Engel“ zu relativieren oder eine konfessionelle Deutung einzutragen. Der Fußnotenanker steht unmittelbar bei „Engel“ und ist korrekt zugeordnet.
