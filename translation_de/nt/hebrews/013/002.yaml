  source_fidelity: 'Die Übersetzung gibt φιλοξενία treffend mit „Gastfreundschaft“ wieder und bewahrt den exhortativen Imperativ in „Vergesst ... nicht“. „Durch sie“ entspricht dem instrumentalen διὰ ταύτης. Die Konstruktion ἔλαθόν ... ξενίσαντες wird mit „haben einige, ohne es zu wissen, Engel beherbergt“ idiomatisch und sachlich zutreffend wiedergegeben: Das Beherbergen geschah, ohne dass die Betroffenen die Identität ihrer Gäste erkannten.'
