  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Begriffe des griechischen Textes insgesamt zuverlässig wieder: fortdauerndes Erinnern an die Leiter, ihre Vermittlung von Gottes Wort, die Betrachtung des Ausgangs ihrer Lebensführung und die Nachahmung ihrer πίστις. Die offenen Deutungsmöglichkeiten von ἔκβασις und πίστις werden angemessen in Fußnoten bewahrt.'
  naturalness: „Die euch das Wort Gottes gesagt haben“ ist im modernen Standarddeutsch keine natürliche Verbindung; man sagt nicht idiomatisch, jemand habe jemandem „das Wort Gottes gesagt“. „Die euch Gottes Wort verkündigt haben“ ist idiomatisch, würdig und im Kontext nicht unangemessen interpretierend.
