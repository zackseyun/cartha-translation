  rationale: Die Revision ersetzt allein die unidiomatische Formulierung „das Wort Gottes gesagt haben“ durch die im modernen Deutschen natürliche und kontextuell passende Wendung „Gottes Wort verkündigt haben“. Außerdem macht „Erinnert euch an“ den auf fortgesetztes Erinnern zielenden Präsensimperativ idiomatischer sichtbar. Die übrige Übersetzung einschließlich der Fußnoten kann bestehen bleiben.
