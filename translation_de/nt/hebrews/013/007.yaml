source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: de
  text: Erinnert euch an eure Leiter, die euch Gottes Wort verkündigt haben. Betrachtet den Ausgang ihres Lebenswandels[a] und ahmt ihren Glauben[b] nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ausgang“ kann auch mit „Ergebnis“ oder „Ende“ wiedergegeben werden; nach manchen Deutungen ist besonders die Art ihres Todes gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Treue“. Das griechische Wort kann sowohl Glauben als auch Treue beziehungsweise Glaubenstreue bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Denkt an
  rationale: Der Präsensimperativ fordert zu fortdauerndem Erinnern auf. „Denkt an“ ist im modernen Deutschen natürlich und kann diesen anhaltenden Sinn im Kontext tragen.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: eure Leiter
  rationale: Die Wendung bezeichnet anerkannte Verantwortungsträger der Gemeinde. „Leiter“ bewahrt ihre tatsächliche Autorität, ohne den politischen oder obrigkeitlichen Klang von „Herrscher“ einzutragen.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: die euch das Wort Gottes gesagt haben
  rationale: Die Formulierung gibt λαλέω schlicht als Sprechen wieder und bewahrt den geläufigen biblischen Ausdruck „das Wort Gottes“, ohne das Verb interpretierend zu „verkündigen“ zu verstärken.
- source_word: ἀναθεωροῦντες
  choice: Betrachtet
  rationale: Das Partizip bezeichnet aufmerksames Beobachten und Erwägen. Der deutsche Imperativ schließt sich natürlich an die Aufforderung des Verses an und wahrt den reflektierenden Sinn.
- source_word: τὴν ἔκβασιν
  choice: den Ausgang
  rationale: ἔκβασις kann Ausgang, Ergebnis oder Ende bezeichnen. „Ausgang“ bleibt bewusst offen und legt weder ausschließlich den Lebensertrag noch ausdrücklich die Todesart fest.
- source_word: τῆς ἀναστροφῆς
  choice: ihres Lebenswandels
  rationale: ἀναστροφή bezeichnet Verhalten beziehungsweise Lebensführung. „Lebenswandel“ ist ein verständlicher, würdiger Ausdruck, der das gelebte Verhalten umfasst.
- source_word: μιμεῖσθε
  choice: ahmt … nach
  rationale: Der direkte Imperativ wird mit der natürlichen deutschen Entsprechung „nachahmen“ wiedergegeben.
- source_word: τὴν πίστιν
  choice: ihren Glauben
  rationale: πίστις kann hier Glaube oder Treue bezeichnen. Der Haupttext verwendet „Glauben“, während die echte Bedeutungsalternative in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Bedeutung von πίστις als nachahmenswerte Eigenschaft von Menschen
  choice: Glauben
  alternative: Treue beziehungsweise Glaubenstreue
  rationale: Sowohl das Vertrauen der Leiter als auch ihre beständige Treue passt zum Zusammenhang. „Glauben“ steht im Haupttext; die Fußnote bewahrt die mögliche Bedeutung „Treue“, ohne die Spannung aufzulösen.
- issue: Ob ἔκβασις ausdrücklich den Tod oder das Martyrium der Leiter bezeichnet
  choice: Ausgang
  alternative: Ende; möglicherweise die Art ihres Todes
  rationale: Der Ausdruck kann auf das Lebensende und nach manchen Deutungen besonders auf die Todesart zielen, sagt dies jedoch nicht ausdrücklich. „Ausgang“ erhält die lexikalische Weite und vermeidet eine nicht gesicherte historische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen. „Leiter“ bezeichnet gemeindliche Verantwortungsträger ohne unnötig obrigkeitlichen Beiklang. Die etwas biblisch geprägten Ausdrücke „Wort Gottes“ und „Lebenswandel“ bleiben für gewöhnliche heutige Leser verständlich.
