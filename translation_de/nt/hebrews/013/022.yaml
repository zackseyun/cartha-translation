source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: de
  text: Ich bitte euch aber, Brüder[a], nehmt dieses Wort der Ermahnung[b] geduldig an; denn ich habe euch nur kurz geschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brüder“; die griechische Anrede kann die ganze Gemeinde einschließlich der Frauen meinen.
    reason: lexical_alternative
  - marker: b
    text: „Wort der Ermahnung“ kann auch mit „Botschaft der Ermutigung“ oder „Wort des Zuspruchs“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ich bitte
  rationale: Das Verb bezeichnet hier eine eindringliche persönliche Bitte. „Ich bitte“ klingt im heutigen Deutsch natürlich und wahrt den appellativen Ton.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert einen milden Übergang beziehungsweise eine leichte Gegenüberstellung. Das unbetonte „aber“ bildet diese Funktion natürlich ab.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Der maskuline Plural kann in der Anrede die gesamte, vermutlich gemischte Gemeinde einschließen. Die inklusive Wiedergabe macht den wahrscheinlichen Referenzumfang im heutigen Deutsch verständlich; die wörtliche Form wird in der Fußnote genannt.
- source_word: ἀνέχεσθε
  choice: Nehmt … geduldig an
  rationale: ἀνέχομαι fordert hier dazu auf, die folgende beziehungsweise vorliegende Ermahnung geduldig gelten zu lassen. Die Formulierung ist natürlicher als „ertragt“ und vermeidet dessen unnötig negativen Beiklang.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: dieses Wort der Ermahnung
  rationale: λόγος bezeichnet die mitgeteilte Botschaft, παράκλησις kann sowohl Ermahnung als auch Ermutigung bedeuten. „Wort der Ermahnung“ bewahrt die traditionelle, quellennahe Wendung; „dieses“ stellt im Deutschen den Bezug auf das vorliegende Schreiben her.
- source_word: καὶ γὰρ
  choice: ja
  rationale: Die Partikelverbindung begründet die Bitte. In diesem Satz vermittelt „ja“ die erklärende beziehungsweise bekräftigende Funktion idiomatisch.
- source_word: διὰ βραχέων
  choice: nur kurz
  rationale: 'Die feste Wendung bedeutet „kurz“ beziehungsweise „mit wenigen Worten“. „Nur“ verdeutlicht die argumentative Pointe: Die Leser sollen die Ermahnung hinnehmen, weil der Verfasser sich kurzgefasst hat.'
- source_word: ἐπέστειλα ὑμῖν
  choice: ich habe euch … geschrieben
  rationale: Das Verb kann das schriftliche Mitteilen oder Verfassen eines Briefes bezeichnen. Das deutsche Perfekt passt zur Perspektive auf das nun vorliegende Schreiben.
theological_decisions:
- issue: Umfang der Anrede ἀδελφοί
  choice: Brüder und Schwestern
  alternative: Brüder
  rationale: Die grammatisch maskuline Anrede kann kontextuell die ganze Gemeinde bezeichnen. Die Hauptfassung gibt diesen wahrscheinlichen inklusiven Sinn wieder, ohne die griechische Form zu verschweigen; diese bleibt in der Fußnote sichtbar.
- issue: Bedeutung von παράκλησις
  choice: Ermahnung
  alternative: Ermutigung / Zuspruch
  rationale: Das Wort umfasst Aufforderung, Ermahnung, Ermutigung und Zuspruch. Im Kontext der abschließenden Bitte ist „Ermahnung“ passend, doch die semantische Offenheit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als persönliche Schlussbitte erkennbar. Die Satzstellung wurde für natürliche Lesbarkeit leicht gegliedert; der Doppelpunkt macht die folgende Aufforderung transparent. Die Mehrdeutigkeit von παράκλησις wird nicht dogmatisch festgelegt, sondern durch eine Fußnote offengehalten.
