id: HEB.13.20
reference: Hebrews 13:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: de
  text: Der Gott des Friedens aber, der unseren Herrn Jesus, den großen Hirten der Schafe, durch das Blut eines ewigen Bundes von den Toten heraufgeführt hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung lässt den genauen Bezug von „durch das Blut eines ewigen Bundes“ offen. Sie kann Gottes Heraufführen Jesu von den Toten näher bestimmen oder enger mit seiner Bezeichnung als dem großen Hirten der Schafe verbunden sein. Auch eine Wiedergabe wie „im Blut eines ewigen Bundes“ kommt je nach Deutung von ἐν in Betracht.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Der … aber
  rationale: δέ kennzeichnet den Übergang von den Ermahnungen zum abschließenden Segensgebet. Das nachgestellte „aber“ gibt diesen leichten Übergangs- beziehungsweise Kontrastton wieder, ohne ein zeitliches „nun“ einzuführen.
- source_word: θεὸς τῆς εἰρήνης
  choice: der Gott des Friedens
  rationale: Die Genitivverbindung bezeichnet Gott als den, der durch Frieden gekennzeichnet ist und Frieden schenkt. Die geläufige deutsche Wendung bleibt nah am Griechischen.
- source_word: ὁ ἀναγαγὼν
  choice: der … heraufgeführt hat
  rationale: ἀνάγω bedeutet grundsätzlich „hinauf-/heraufführen“. Im Auferstehungszusammenhang ist „heraufgeführt“ verständlich und bewahrt das besondere Bild des Verbs, statt es mit dem üblichen „auferweckt“ einzuebnen.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die natürliche deutsche Entsprechung der griechischen Auferstehungsformel.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: den großen Hirten der Schafe
  rationale: Die Formulierung bewahrt sowohl das Hirtenbild als auch den ausdrücklichen Bezug auf die Schafe; „groß“ gibt μέγαν direkt wieder.
- source_word: ἐν αἵματι
  choice: durch das Blut
  rationale: ἐν kann hier Mittel, Grundlage oder begleitenden Zusammenhang bezeichnen. „Durch“ ist im Deutschen natürlich, ohne die genaue theologische Wirkweise weiter auszudeuten.
- source_word: διαθήκης αἰωνίου
  choice: eines ewigen Bundes
  rationale: διαθήκη ist im Argument des Hebräerbriefs „Bund“. Da die griechische Wortgruppe keinen Artikel trägt, wahrt „eines ewigen Bundes“ diese Form, ohne auszuschließen, dass der bekannte neue Bund gemeint ist.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: unseren Herrn Jesus
  rationale: Die Wendung bezeichnet den von den Toten Heraufgeführten als Jesus, unseren Herrn, und wird im Deutschen idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug von ἐν αἵματι διαθήκης αἰωνίου
  choice: Im Haupttext wird die Wendung mit „durch“ wiedergegeben und syntaktisch am ehesten auf Gottes Heraufführen Jesu bezogen.
  alternative: Die Wendung kann enger zu „dem großen Hirten der Schafe“ gehören oder allgemeiner den gesamten Gedanken bestimmen; außerdem ist „in dem Blut“ möglich.
  rationale: Die griechische Stellung lässt den genauen Bezug offen. Der Haupttext bietet eine natürliche Lesart, während die Fußnote die echte syntaktische und semantische Mehrdeutigkeit ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Satzanfang offen, weil der griechische Hauptsatz erst in Vers 21 fortgeführt wird. „Heraufgeführt“ ist bewusst etwas bildhafter als das geläufige „auferweckt“ und folgt dem besonderen Ausgangsverb ἀνάγω.
