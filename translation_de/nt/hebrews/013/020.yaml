  source_fidelity: 'Der Haupttext gibt die maßgeblichen Elemente des Griechischen zuverlässig wieder: „Gott des Friedens“, Gottes Heraufführen Jesu „von den Toten“, die Apposition „unseren Herrn Jesus, den großen Hirten der Schafe“ sowie „durch das Blut eines ewigen Bundes“. Die Stellung von ἐν αἵματι διαθήκης αἰωνίου bleibt durch die Fußnote zutreffend als nicht völlig eindeutig kenntlich.'
  naturalness: Der Satzanfang ist als Fortsetzung des in Vers 21 folgenden Segenswunsches korrekt offen gehalten. „Der Gott des Friedens aber“ und „heraufgeführt hat“ sind würdevoll und im modernen Standarddeutsch verständlich, wenn auch bewusst nah an der Bildlichkeit des griechischen Verbs.
  terminology: '„Bund“ ist für διαθήκη im Hebräerbrief sachgerecht; „Herr“, „großer Hirte“ und „Schafe“ sind treffend und registergerecht. Die Fußnote sollte jedoch nicht „in dem Blut“ als wörtlichere Fassung bezeichnen: ἐν ist zwar formal „in“, seine Funktion ist hier gerade umstritten, und im Deutschen wäre bei dieser Lesart „im Blut eines ewigen Bundes“ idiomatisch.'
