  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: de
  text: Jesus, der Messias, ist gestern und heute derselbe und in Ewigkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jesus Christus ist gestern und heute derselbe und in Ewigkeit.“ Der griechische Titel Χριστός kann mit „Christus“ wiedergegeben oder als „Messias“ übersetzt werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: Χριστὸς
  choice: der Messias
  rationale: Der griechische Titel wird seinem Sinn nach wiedergegeben; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch bei dieser Titelverbindung.
- source_word: ἐχθὲς
  choice: gestern
  rationale: Direkte Wiedergabe des zeitlichen Adverbs und erster Teil der dreigliedrigen Zeitaussage.
- source_word: σήμερον
  choice: heute
  rationale: Direkte Wiedergabe des zeitlichen Adverbs innerhalb der betonten zeitlichen Abfolge.
- source_word: ὁ αὐτός
  choice: ist derselbe
  rationale: Die prädikative Wendung bedeutet „derselbe“; die im Griechischen unausgesprochene Kopula wird im Deutschen ergänzt.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Natürliche, würdevolle deutsche Wiedergabe der idiomatischen Aussage unbegrenzter Fortdauer.
- source_word: καὶ ... καὶ ... καὶ
  choice: und ... und ... und
  rationale: Die wiederholten Verknüpfungen bleiben erhalten, um Rhythmus und Nachdruck der griechischen Zeitaussage zu bewahren.
theological_decisions:
- issue: Christologische Tragweite der Aussage über die Beständigkeit Jesu
  choice: Die Aussage wird unmittelbar als unveränderte Identität Jesu, des Messias, über alle Zeiten hinweg übersetzt.
  alternative: Die Formulierung könnte durch eine ausdrückliche Aussage über Unveränderlichkeit oder Gottheit erweitert werden.
  rationale: Solche theologischen Folgerungen mögen aus dem Vers gezogen werden, doch die Übersetzung fügt keine Lehrformel hinzu, die über den griechischen Wortlaut hinausgeht.
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: Christus
  rationale: Χριστός bezeichnet den Gesalbten und wird hier transparent als Titel wiedergegeben; die geläufige Form „Christus“ bleibt als Übersetzungsalternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die traditionelle Wendung „in Ewigkeit“ bewahrt den feierlichen Rhythmus, ohne altertümlich oder konfessionell verengt zu wirken.
