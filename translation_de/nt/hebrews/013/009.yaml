source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: de
  text: Lasst euch nicht von verschiedenartigen und fremden Lehren fortreißen. Denn es ist gut, dass das Herz durch Gnade gefestigt wird und nicht durch Speisen,[a] von denen diejenigen keinen Nutzen hatten, die sich nach ihnen richteten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Speisen“ sind wahrscheinlich Speisevorschriften oder andere speisebezogene religiöse Praktiken gemeint; der griechische Text sagt lediglich „Speisen“.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „die in ihnen wandelten“; gemeint sein kann auch: „die nach ihnen lebten“ oder „die sich mit ihnen befassten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: verschiedenartigen und fremden Lehren
  rationale: „Verschiedenartig“ gibt ποικίλαις als Vielfalt wieder; „fremd“ bewahrt bei ξέναις die Aussage, dass diese Lehren der maßgeblichen Botschaft nicht zugehören, ohne ihre ethnische Herkunft festzulegen.
- source_word: μὴ παραφέρεσθε
  choice: Lasst euch nicht … fortreißen
  rationale: Die passive Form und das Bild des Vom-Kurs-Abgebrachtwerdens bleiben erhalten; die präsentische Aufforderung warnt vor einem fortdauernden Einfluss.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: dass das Herz durch Gnade gefestigt wird
  rationale: „Durch“ fasst den Dativ instrumental auf. „Gefestigt“ gibt βεβαιοῦσθαι natürlich wieder und bewahrt den Gedanken innerer Beständigkeit; „Herz“ bleibt als biblischer Ausdruck stehen.
- source_word: οὐ βρώμασιν
  choice: nicht durch Speisen
  rationale: βρώμασιν wird wörtlich wiedergegeben. So wird nicht vorschnell entschieden, ob speziell Speisevorschriften, kultische Mahlzeiten oder andere speisebezogene Praktiken gemeint sind.
- source_word: ἐν οἷς … οἱ περιπατοῦντες
  choice: von denen … die sich nach ihnen richteten
  rationale: Das wörtliche „in denen wandelten“ wäre im Deutschen mit „Speisen“ unverständlich. „Sich nach ihnen richten“ bewahrt den metaphorischen Sinn von περιπατέω als Lebensführung, ohne bloße Beschäftigung zu unterstellen.
- source_word: οὐκ ὠφελήθησαν
  choice: keinen Nutzen hatten
  rationale: Die idiomatische deutsche Form gibt die Aussage des passiven Aorists klar wieder, ohne den evaluativen Gehalt abzuschwächen.
theological_decisions:
- issue: Bezug der „Speisen“ und Gegensatz zur Gnade
  choice: Im Haupttext bleibt „Speisen“ stehen; der mögliche Bezug auf Speisevorschriften oder speisebezogene religiöse Praktiken wird nur in der Fußnote erläutert.
  alternative: „Speisevorschriften“, „kultische Mahlzeiten“ oder „jüdische Speisegesetze“ direkt in den Haupttext aufzunehmen.
  rationale: Der griechische Text nennt lediglich βρώμασιν. Der Zusammenhang legt religiöse Speisepraktiken nahe, bestimmt ihren Umfang aber nicht eindeutig.
- issue: Bedeutung von καρδία
  choice: „Herz“
  alternative: „Inneres“, „Sinn“ oder „innerer Mensch“
  rationale: „Herz“ bewahrt die biblische Anthropologie und lässt offen, welche Aspekte des inneren Menschen hier besonders gemeint sind.
- issue: Bedeutung von βεβαιοῦσθαι
  choice: „gefestigt wird“
  alternative: „gestärkt wird“ oder „fest gegründet wird“
  rationale: „Gefestigt“ umfasst sowohl Stärkung als auch Beständigkeit, ohne die mögliche Bedeutungsbreite unnötig einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural entspricht dem Gemeindebezug. „Fortreißen“, „gefestigt“ und „sich nach ihnen richten“ sind verständlich, bewahren jedoch Bildkraft und theologischen Ernst des Ausgangstextes.
