source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: de
  text: Lasst euch von euren Leitern überzeugen und fügt euch ihnen[a]; denn sie wachen über eure Seelen als solche, die Rechenschaft ablegen werden. So sollen sie dies mit Freude tun und nicht seufzend, denn das wäre für euch nicht von Nutzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gehorcht euren Leitern und fügt euch ihnen.« Das griechische Wort für »lasst euch überzeugen« kann auch »gehorcht« bedeuten; das zweite Verb bedeutet nachgeben oder sich fügen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Lasst euch … überzeugen
  rationale: Der medial-passive Imperativ kann »gehorchen« bedeuten, bewahrt aber wörtlicher den Gedanken, sich überzeugen oder gewinnen zu lassen. Die Formulierung erhält diese relationale Nuance; die geläufige Alternative steht in der Fußnote.
- source_word: ἡγουμένοις
  choice: euren Leitern
  rationale: Das substantivierte Partizip bezeichnet die anerkannten Leiter der Gemeinschaft. »Leiter« ist im heutigen Deutsch verständlich und verstärkt den Herrschaftsaspekt nicht unnötig.
- source_word: ὑπείκετε
  choice: gebt ihnen nach
  rationale: Das Verb bedeutet nachgeben, weichen oder sich fügen. »Gebt ihnen nach« unterscheidet diese Aufforderung von Πείθεσθε, ohne beide Verben zu einer einzigen Gehorsamsformel zu verschmelzen.
- source_word: ἀγρυπνοῦσιν
  choice: sie wachen
  rationale: Das Verb erinnert wörtlich an schlaflose Wachsamkeit. »Sie wachen« erhält das Bild und passt zur fürsorglichen Verantwortung der Leiter.
- source_word: ψυχῶν
  choice: Seelen
  rationale: ψυχή kann Seele, Leben oder Person bezeichnen. »Seelen« bewahrt hier das geistliche Gewicht, ohne den ganzheitlichen Bezug auf die Menschen auszuschließen.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: als solche, die Rechenschaft ablegen werden
  rationale: Die Formulierung gibt die vergleichende Partizipialkonstruktion und den zukünftigen Rechenschaftsaspekt wieder, ohne ausdrücklich hinzuzufügen, wem Rechenschaft gegeben wird.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Die direkte und natürliche Wiedergabe erhält die griechische Präpositionalstruktur.
- source_word: στενάζοντες
  choice: seufzend
  rationale: στενάζω bezeichnet Seufzen oder Stöhnen. »Seufzend« ist konkret, idiomatisch und steht knapp im Gegensatz zu »mit Freude«.
- source_word: ἀλυσιτελὲς
  choice: nicht von Nutzen
  rationale: Das Adjektiv bedeutet unvorteilhaft oder nicht nützlich. Die Wendung ist modernes, klares Deutsch und vermeidet die mögliche wirtschaftliche Engführung von »unprofitabel« sowie die Überzeichnung »schädlich«.
theological_decisions:
- issue: Art der Aufforderung gegenüber den Leitern der Gemeinde
  choice: Die Gemeinde soll sich von ihren anerkannten Leitern überzeugen lassen und ihnen nachgeben; deren Autorität ist mit wachsamer Fürsorge und künftiger Rechenschaft verbunden.
  alternative: »Gehorcht euren Leitern und ordnet euch ihnen unter« als stärkere, geläufige Wiedergabe.
  rationale: Πείθεσθε kann kontextuell Gehorsam einschließen, bezeichnet aber nicht zwingend bloße Befehlsbefolgung; ὑπείκετε fügt den Gedanken des Nachgebens hinzu. Die Übersetzung erhält beide Nuancen und macht daraus weder absolute Autorität noch bloß unverbindlichen Rat.
- issue: Bezug von τοῦτο in der Schlussaussage
  choice: »das« bezieht sich am natürlichsten darauf, dass die Leiter ihre Aufgabe seufzend erfüllen.
  alternative: Der weitere belastete Zustand zwischen Gemeinde und Leitern insgesamt ist für die Adressaten nicht von Nutzen.
  rationale: Der unmittelbare Kontext legt den Bezug auf das seufzende Ausüben des Wächterdienstes nahe, doch das Demonstrativpronomen bleibt grammatisch knapp; die deutsche Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit in zwei Sätze gegliedert. »Leiter«, »Seelen« und »Rechenschaft ablegen« bewahren den gemeindlichen und geistlichen Ton; »nicht von Nutzen« gibt den Schluss idiomatisch wieder.
