  verdict: revise
  source_fidelity: Der Satz gibt die Opferhandlung, die priesterliche Vermittlung und den Ort außerhalb des Lagers zutreffend wieder. Die Aktivierung von διὰ τοῦ ἀρχιερέως ist grundsätzlich möglich, doch die passive Form entspricht dem griechischen Satzbau unmittelbarer. »Für die Sünde« ist im Deutschen zudem semantisch und idiomatisch weniger klar als »wegen der Sünde«; Letzteres wahrt die im Griechischen nicht näher festgelegte kultische Beziehung, ohne »Sündopfer« festzulegen.
  naturalness: »In die heiligen Bereiche« ist als deutsche Hauptfassung ungewohnt und klingt administrativ-räumlich. »In das Heiligtum« ist im modernen Standarddeutsch die natürliche kultische Wiedergabe von τὰ ἅγια; der griechische Plural und die mögliche wörtliche Alternative können in der Fußnote erläutert werden. Die überarbeitete passive Konstruktion ist trotz ihrer Länge klar und sachsprachlich angemessen.
  terminology: »Heiligtum«, »Hoher Priester« und »Lager« sind etablierte und verständliche kultische Begriffe. »Wegen der Sünde« vermeidet sowohl die missverständliche deutsche Fügung »für die Sünde« als auch die enger interpretierende Benennung »als Sündopfer«.
  issues:
