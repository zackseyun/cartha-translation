    issue: Unnatürliche Hauptwiedergabe von εἰς τὰ ἅγια
    rationale: »In die heiligen Bereiche« ist zwar formal pluralisch, aber kein idiomatischer deutscher Ausdruck für den Heiligtumsbereich. »In das Heiligtum« gibt die kultische Referenz natürlich wieder, ohne sie auf das Allerheiligste einzugrenzen.
  - severity: medium
    issue: »für die Sünde« ist im Deutschen missverständlich
    rationale: Die Wendung kann so wirken, als sei die Sünde der Begünstigte. »Wegen der Sünde« gibt περὶ ἁμαρτίας breit und verständlich wieder und vermeidet eine übermäßig spezifische Deutung als feststehende Opferbezeichnung.
  - severity: low
