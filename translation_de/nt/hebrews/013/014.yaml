id: HEB.13.14
reference: Hebrews 13:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: de
  text: Denn wir haben hier keine bleibende Stadt, sondern wir suchen die kommende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stadt, die kommen wird“; auch: „die zukünftige Stadt“.'
    reason: Die substantivierte Wendung τὴν μέλλουσαν kann sowohl knapp als „die kommende“ als auch ausdrücklicher zukunftsbezogen wiedergegeben werden.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn … keine
  rationale: γάρ begründet beziehungsweise erläutert die vorausgehende Aussage; οὐ verneint zusammen mit dem unbestimmten Objekt im Deutschen natürlich durch „keine“.
- source_word: ἔχομεν
  choice: wir haben
  rationale: Das Präsens wird schlicht und idiomatisch wiedergegeben.
- source_word: ὧδε
  choice: hier
  rationale: Bewahrt die deiktische Bedeutung, ohne sie vorschnell als „auf der Erde“ auszulegen.
- source_word: μένουσαν
  choice: bleibende
  rationale: Das Partizip beschreibt eine Stadt, die Bestand hat oder fortdauert; „bleibend“ ist präzise und im Kontext natürlich.
- source_word: πόλιν
  choice: Stadt
  rationale: Bewahrt das konkrete Bild des griechischen Textes, statt es als „Heimat“ oder „Himmel“ auszudeuten.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten ersten Satzhälfte drückt „sondern“ den starken Gegensatz im Deutschen am natürlichsten aus.
- source_word: τὴν μέλλουσαν
  choice: die kommende
  rationale: Das substantivierte feminine Partizip greift „Stadt“ auf und bezeichnet die noch bevorstehende Stadt; die knappe deutsche Form bewahrt diese Struktur.
- source_word: ἐπιζητοῦμεν
  choice: wir suchen
  rationale: Gibt das zielgerichtete Suchen verständlich und ohne unbegründete Verstärkung wieder.
theological_decisions:
- issue: Bedeutung des Stadtbildes
  choice: Das Wort „Stadt“ und der Zukunftsbezug bleiben ohne nähere Bestimmung erhalten.
  alternative: „Himmel“, „himmlische Stadt“ oder „himmlisches Jerusalem“
  rationale: Der Vers nennt die künftige Wirklichkeit selbst nur eine kommende Stadt. Eine genauere Identifizierung wäre zwar aus dem weiteren Hebräerbrief erklärbar, würde hier aber zusätzliche Auslegung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist knapp und folgt dem begründenden sowie kontrastiven Aufbau des griechischen Textes. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
