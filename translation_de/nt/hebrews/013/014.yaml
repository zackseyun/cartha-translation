  source_fidelity: 'Der Satz gibt den griechischen Text vollständig und in seiner Struktur zutreffend wieder: γάρ als begründendes „Denn“, die Negation mit „keine“, ὧδε als „hier“, μένουσαν als „bleibende“, den Kontrast ἀλλά als „sondern“ sowie die elliptische Rückverweisung von τὴν μέλλουσαν auf „Stadt“. „Wir suchen“ ist für ἐπιζητοῦμεν angemessen, ohne eine nicht ausdrücklich markierte Intensivierung einzutragen.'
  naturalness: „Denn wir haben hier keine bleibende Stadt, sondern wir suchen die kommende“ ist klares, würdevolles modernes Standarddeutsch. Die substantivierte Form „die kommende“ ist im Kontext eindeutig auf „Stadt“ bezogen und bewahrt die griechische Knappheit.
  terminology: „Stadt“ erhält das Bild von πόλις, ohne es zu „Himmel“ oder „Jerusalem“ auszudeuten. „Bleibende“ und „kommende“ bilden den beabsichtigten zeitlichen Kontrast treffend ab. Die Fußnote bietet zulässige, klar als Alternativen ausgewiesene Entfaltungen.
