base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: de
  text: Denkt an die Gefangenen[a], als wärt ihr mit ihnen gefesselt, und an die, die misshandelt werden, weil auch ihr selbst im Leib seid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wärt ihr mit ihnen gefangen“. Die griechische Formulierung ruft wörtlich das Bild auf, gemeinsam mit den Gefangenen gebunden zu sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „weil auch ihr selbst im Leib seid“. Wahrscheinlich ist die gemeinsame menschliche, leibliche Verletzlichkeit gemeint; möglich ist auch eine Anspielung auf die Zugehörigkeit zum Leib Christi.'
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Denkt an
  rationale: Der präsentische Imperativ fordert zu fortdauernder, tätiger Anteilnahme auf. „Denkt an“ ist im heutigen Deutsch natürlich und umfasst im Kontext mehr als bloße gedankliche Erinnerung.
- source_word: τῶν δεσμίων
  choice: die Gefangenen
  rationale: δέσμιος bezeichnet einen Gebundenen beziehungsweise Gefangenen. „Die Gefangenen“ ist klar und idiomatisch; das Bild des Gefesseltseins wird im folgenden Ausdruck und in der Fußnote bewahrt.
- source_word: ὡς συνδεδεμένοι
  choice: als wärt ihr mit ihnen gefangen
  rationale: Das Partizip bezeichnet wörtlich ein Mitgefesseltsein. Die gewählte Formulierung gibt die geforderte solidarische Identifikation natürlich wieder, ohne eine tatsächliche gemeinsame Haft zu behaupten.
- source_word: τῶν κακουχουμένων
  choice: die Misshandelten
  rationale: κακουχέομαι bezeichnet schlechte Behandlung oder von anderen zugefügtes Leiden. „Die Misshandelten“ ist prägnant, verständlich und wahrt den passiven Charakter.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: weil ihr selbst auch in einem Körper lebt
  rationale: Die Wendung begründet die Anteilnahme wahrscheinlich mit der gemeinsamen leiblichen Verletzlichkeit. „In einem Körper lebt“ ist natürliches modernes Deutsch; die Fußnote nennt die wörtlichere Form und hält die mögliche ekklesiale Nebenbedeutung offen.
theological_decisions:
- issue: Bedeutung von ἐν σώματι („im Körper/Leib“)
  choice: gemeinsame leibliche Existenz und Verletzlichkeit
  alternative: Zugehörigkeit zum Leib Christi
  rationale: Im unmittelbaren Zusammenhang motiviert die gemeinsame menschliche Anfälligkeit für Leid am ehesten die Solidarität mit Gefangenen und Misshandelten. Die mögliche Anspielung auf den Leib Christi wird jedoch nicht ausgeschlossen, sondern in der Fußnote ausdrücklich offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Mahnton. Der parallele Aufbau der beiden Aufforderungen bleibt erhalten; die ungewöhnliche Wendung „im Körper“ wird zugunsten natürlichen Deutschen im Haupttext leicht entfaltet und in der Fußnote wörtlich dokumentiert.
