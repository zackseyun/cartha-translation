    rationale: »Vor« bezeichnet im heutigen Deutsch häufig eine Lage an der Vorderseite eines Ortes und kann daher die ausdrückliche Außenseite des Lagers abschwächen oder verunklären. »Außerhalb des Lagers« entspricht dem griechischen ἔξω direkt und erhält das kultische Bild.
