    rationale: Wenn der Haupttext »außerhalb des Lagers« lautet, ist die bisherige Fußnote mit »Wörtlich auch« nicht mehr passend. Der intertextuelle Hinweis kann als Hintergrundinformation ohne irreführende Alternativkennzeichnung erhalten bleiben.
