  source_fidelity: 'Die Wiedergabe von τοίνυν, dem hortativen ἐξερχώμεθα, πρὸς αὐτόν und φέροντες ist insgesamt treffend. »Vor das Lager« ist jedoch für ἔξω τῆς παρεμβολῆς nicht präzise genug: Es kann im Deutschen eine Position an der Vorderseite des Lagers bezeichnen, während das Griechische eindeutig »außerhalb des Lagers« sagt.'
  naturalness: »Lasst uns ... hinausgehen, außerhalb des Lagers« ist modernes, würdiges und gut verständliches Standarddeutsch. Die Satzfügung bewahrt die Bildlichkeit des Ausgangstextes.
  terminology: »Lager« bildet παρεμβολή im kultisch-wüstenzeitlichen Bildzusammenhang angemessen ab. »Seine Schmach tragen« ist eine natürliche und ausreichend offene Entsprechung für τὸν ὀνειδισμὸν αὐτοῦ φέροντες; sie legt die genitivische Beziehung nicht unzulässig fest.
