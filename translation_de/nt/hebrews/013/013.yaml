  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: de
  text: Darum lasst uns zu ihm hinausgehen, außerhalb des Lagers, und seine Schmach tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: Darum
  rationale: Die folgernde Partikel zieht die Konsequenz aus der Begründung in Hebräer 13,11–12. »Darum« gibt diesen Zusammenhang in natürlichem Deutsch klar wieder.
- source_word: ἐξερχώμεθα
  choice: lasst uns … hinausgehen
  rationale: Der Hortativ im Präsens formuliert eine gemeinsame Aufforderung. »Lasst uns hinausgehen« bewahrt diese Kraft ohne altertümliche Sprache.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf eine Person zu. Das Pronomen bleibt wie im Griechischen erhalten; aus dem unmittelbaren Zusammenhang ist Jesus der Bezug.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: vor das Lager
  rationale: παρεμβολή bezeichnet ein Lager oder Heerlager. Die idiomatische Wendung »vor das Lager« bewahrt das räumliche und kultische Bild; die Fußnote nennt die formnähere Alternative.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: seine Schmach
  rationale: ὀνειδισμός umfasst Schmähung, Schande und entehrende Zurückweisung. »Seine Schmach« erhält sowohl die soziale Dimension als auch die Mehrdeutigkeit, ob es um die von ihm erlittene beziehungsweise mit ihm verbundene Schmach geht.
- source_word: φέροντες
  choice: und seine Schmach tragen
  rationale: Das Partizip bezeichnet eine begleitende, fortdauernde Haltung. Die koordinierte deutsche Form ist natürlich und bewahrt das biblisch verständliche Bild des Tragens, ohne es zu »erdulden« auszudeuten.
theological_decisions:
- issue: Bezug von »ihm«
  choice: Das Pronomen bleibt stehen und bezieht sich im Kontext auf Jesus.
  alternative: Den Namen »Jesus« ausdrücklich einsetzen.
  rationale: Vers 12 nennt Jesus als denjenigen, der außerhalb des Tores litt. Da der griechische Text in Vers 13 dennoch ein Pronomen verwendet, sollte die Übersetzung den Bezug nicht expliziter machen als die Vorlage.
- issue: Bedeutung von »vor das Lager«
  choice: Das räumlich-kultische Bild wird beibehalten.
  alternative: Paraphrasen wie »außerhalb der religiösen Gemeinschaft« oder »außerhalb der etablierten Ordnung«.
  rationale: Das Bild knüpft an die Opferpraxis und an Jesu Zurückweisung außerhalb der Stadt an. Eine abstrakte Paraphrase würde den alttestamentlichen Bezug verengen und eine bestimmte Auslegung festschreiben.
- issue: Bedeutung von »seine Schmach«
  choice: Die knappe Genitivverbindung bleibt erhalten.
  alternative: »die Schmähung um seinetwillen« oder »dieselbe Schmach wie er«.
  rationale: Der griechische Genitiv kann die Schmach als die von Jesus getragene oder als die mit seiner Person verbundene Schmach kennzeichnen. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt bildhaft und nah an der kultischen Sprache des Zusammenhangs, ist aber ohne altertümliche Wendungen verständlich.
