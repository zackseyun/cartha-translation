  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: de
  text: 'Darum können wir voller Zuversicht sagen: »Der Herr ist mein Helfer; ich werde mich nicht fürchten. Was kann ein Mensch mir antun?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was wird ein Mensch mir antun?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Darum
  rationale: Leitet die Folge beziehungsweise Schlussfolgerung aus der vorausgehenden Zusage ein und verbindet den Vers im Deutschen natürlich mit dem Kontext.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: können wir voller Zuversicht sagen
  rationale: Die partizipiale Wendung bezeichnet mutiges, zuversichtliches Reden; die deutsche Formulierung gibt den idiomatischen Sinn wieder, ohne daraus eine Aufforderung zu machen.
- source_word: Κύριος
  choice: der Herr
  rationale: Die etablierte und kontextuell angemessene Wiedergabe des Gottestitels in dem Schriftzitat.
- source_word: ἐμοὶ βοηθός
  choice: mein Helfer
  rationale: Der Dativ bezeichnet Hilfe zugunsten des Sprechenden; die possessive deutsche Wendung ist natürlich und bewahrt den persönlichen Charakter von βοηθός.
- source_word: οὐ φοβηθήσομαι
  choice: ich werde mich nicht fürchten
  rationale: Gibt die Futurform unmittelbar wieder und wahrt den entschlossenen, würdevollen Ton des Zitats.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Was kann ein Mensch mir antun?
  rationale: Das rhetorische Futur bestreitet die letztliche Macht menschlicher Bedrohung. „Kann“ vermittelt diese Kraft im Deutschen idiomatisch; „antun“ bringt die im Kontext gemeinte feindliche Handlung natürlich zum Ausdruck.
theological_decisions:
- issue: Generischer Sinn von ἄνθρωπος
  choice: ein Mensch
  alternative: der Mensch; jemand
  rationale: ἄνθρωπος bezeichnet hier generisch einen einzelnen Menschen als möglichen Gegner, nicht ausschließlich einen Mann. „Ein Mensch“ bewahrt den repräsentativen Singular ohne geschlechtliche Verengung.
- issue: Rhetorische Kraft des Futurs ποιήσει
  choice: Was kann ein Mensch mir antun?
  alternative: Was wird ein Mensch mir antun?
  rationale: Die Frage zielt nicht auf eine Vorhersage, sondern auf die Begrenztheit menschlicher Macht. Das deutsche Modalverb gibt diese rhetorische Aussage natürlich wieder; die formnähere Zukunftsform wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, zuversichtlichem Ton. Die Anspielung auf Psalm 118,6 bleibt in ihrer knappen Bekenntnisform erkennbar.
