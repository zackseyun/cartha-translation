  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: de
  text: 'Dessen Stimme erschütterte damals die Erde; jetzt aber hat er verheißen[a]: »Noch einmal werde ich nicht nur die Erde, sondern auch den Himmel erschüttern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat aus Haggai 2,6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Seine Stimme
  rationale: Das Genitiv-Relativpronomen bezieht sich im Zusammenhang auf Gott. Die eigenständige Formulierung »Seine Stimme« stellt den Bezug im Deutschen natürlich her und bewahrt den persönlichen Charakter von φωνή.
- source_word: ἐσάλευσεν
  choice: erschütterte
  rationale: Das Verb bezeichnet hier ein heftiges Erschüttern im Zusammenhang mit dem Sinai und entspricht zugleich dem kosmischen Bild des Verses.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: Der Gegensatz zum Himmel zeigt, dass die Erde als kosmischer Bereich gemeint ist, nicht lediglich ein Land oder der Erdboden.
- source_word: τότε … νῦν δὲ
  choice: damals … Jetzt aber
  rationale: Die Formulierung gibt den deutlichen zeitlichen Kontrast zwischen dem damaligen Geschehen und der jetzt geltenden Verheißung natürlich wieder.
- source_word: ἐπήγγελται
  choice: hat er verheißen
  rationale: Das Perfekt bezeichnet eine gegebene Verheißung mit fortdauernder Geltung. »Verheißen« passt zum feierlichen biblischen Register.
- source_word: Ἔτι ἅπαξ
  choice: Noch einmal
  rationale: Die idiomatische deutsche Wendung bewahrt die zeitliche und einmalige Zuspitzung der prophetischen Aussage, ohne ein unnatürliches zusätzliches »noch« einzufügen.
- source_word: σείσω
  choice: werde ich … erschüttern
  rationale: Das Futur und das Bild einer umfassenden Erschütterung werden klar und würdevoll wiedergegeben.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: nicht nur … sondern auch
  rationale: Dies ist die natürliche deutsche Entsprechung der griechischen korrelativen Konstruktion.
- source_word: τὸν οὐρανόν
  choice: den Himmel
  rationale: Der griechische Singular bezeichnet im Gegenüber zur Erde den himmlischen beziehungsweise kosmischen Bereich. Der bestimmte Artikel ist im Deutschen mit »den« gewahrt.
theological_decisions:
- issue: Bezug des Relativpronomens und Subjekt der Verheißung
  choice: Gott ist derjenige, dessen Stimme damals die Erde erschütterte und der jetzt die künftige Erschütterung verheißen hat.
  alternative: Eine unpersönlichere Formulierung, die den göttlichen Sprecher undeutlich lässt.
  rationale: Der unmittelbare Zusammenhang und das Zitat aus Haggai weisen auf Gott als Sprecher. Die Übersetzung macht diesen grammatisch vorausgesetzten Bezug verständlich, ohne zusätzliche Lehraussagen einzutragen.
- issue: Reichweite der kosmischen Sprache
  choice: »Erde« und »Himmel« werden als umfassendes Begriffspaar wiedergegeben.
  alternative: »Land« und »Himmel« beziehungsweise »Erdboden« und »Firmament«.
  rationale: Der Kontrast bezeichnet die geschaffene Ordnung in umfassender Weise. Die Übersetzung wahrt diese eschatologische Weite, ohne die Art des angekündigten Geschehens näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird nach »Erde« geteilt, damit der Rückbezug verständlich bleibt. »Verheißen« trägt den feierlichen Charakter des göttlichen Versprechens; »erschüttern« verbindet die damalige und die angekündigte kosmische Bewegung. Die Anführungszeichen folgen deutscher Typografie.
