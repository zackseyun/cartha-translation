  source_fidelity: 'Der Entwurf gibt die Struktur und den Sinn des griechischen Textes genau wieder: Der Imperativ διώκετε wird mit der nachdrücklichen, idiomatischen Wendung „Jagt … nach“ wiedergegeben; „dem Frieden mit allen“ entspricht εἰρήνην μετὰ πάντων. „der Heiligung, ohne die niemand den Herrn sehen wird“ bewahrt sowohl die Verknüpfung von ἁγιασμός und οὗ χωρὶς als auch die uneingeengte Bezeichnung „den Herrn“ (τὸν κύριον).'
  naturalness: „Jagt dem Frieden mit allen nach und der Heiligung“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die gemeinsame Konstruktion mit „nachjagen“ ist klar und erhält die parallele Ausrichtung beider Akkusativobjekte im Griechischen.
  terminology: „Heiligung“ ist für ἁγιασμός eine tragfähige Wiedergabe, die Prozess und gelebte bzw. erreichte Heiligkeit nicht unnötig auf eine dogmatische Lesart festlegt. Die Fußnote nennt mit „Heiligkeit“ die wesentliche lexikalische Alternative und erläutert die Spannweite sachgerecht. „Herr“ bleibt als Übersetzung von κύριος bewusst offen.
