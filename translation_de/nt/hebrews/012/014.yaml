id: HEB.12.14
reference: Hebrews 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: de
  text: Jagt dem Frieden mit allen nach und der Heiligung, ohne die niemand den Herrn sehen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Heiligkeit«. Das griechische Wort kann sowohl das Geheiligtwerden als auch den Zustand beziehungsweise die Lebenswirklichkeit des Heiligseins bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: Frieden
  rationale: Im Zusammenhang mit »mit allen« bezeichnet εἰρήνη vor allem ein friedliches Verhältnis zu anderen, nicht nur innere Ruhe.
- source_word: διώκετε
  choice: Jagt … nach
  rationale: Die Wendung bewahrt den nachdrücklichen, zielstrebigen Sinn des Verbs und ist im Deutschen als Aufforderung idiomatisch.
- source_word: μετὰ πάντων
  choice: mit allen
  rationale: Die knappe Formulierung gibt den umfassenden Personenbezug des Griechischen natürlich wieder.
- source_word: τὸν ἁγιασμόν
  choice: der Heiligung
  rationale: »Heiligung« kann sowohl das Geheiligtwerden als auch die daraus hervorgehende geheiligte Lebenswirklichkeit bezeichnen und wahrt damit die Spannweite von ἁγιασμός.
- source_word: οὗ χωρὶς
  choice: ohne die
  rationale: Das Relativpronomen bezieht sich grammatisch am natürlichsten auf die unmittelbar vorausgehende »Heiligung«.
- source_word: οὐδεὶς ὄψεται
  choice: niemand … sehen wird
  rationale: Dies ist eine klare, direkte Wiedergabe der absoluten Verneinung und des Futurs.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Der Titel bleibt entsprechend dem griechischen Text stehen, ohne den Bezug ausdrücklich auf Gott den Vater oder Jesus Christus festzulegen.
theological_decisions:
- issue: Bedeutung von ἁγιασμός
  choice: Heiligung
  alternative: Heiligkeit
  rationale: »Heiligung« wahrt im Deutschen besser die mögliche Bedeutung eines Vorgangs oder Zustands des Geheiligtseins; die Fußnote nennt die ebenfalls mögliche Wiedergabe »Heiligkeit«.
- issue: Bezug von »der Herr«
  choice: Nicht näher bestimmt
  alternative: Gott oder Jesus Christus ausdrücklich nennen
  rationale: Der griechische Text nennt nur »den Herrn«; die Übersetzung löst diese mögliche Bezugsoffenheit nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufforderung »Jagt … nach« umfasst sowohl den Frieden als auch die Heiligung; die aktive Dringlichkeit des griechischen Verbs bleibt erhalten.
