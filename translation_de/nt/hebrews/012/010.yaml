source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: de
  text: Denn jene erzogen uns nur wenige Tage lang[a], wie es ihnen richtig erschien[b]; er aber tut es zu unserem Besten, damit wir an seiner Heiligkeit Anteil haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für kurze Zeit“. Die griechische Wendung betont die begrenzte Dauer der Erziehung durch irdische Väter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „nach dem, was ihnen richtig erschien“. Gemeint ist ihr eigenes Urteil darüber, was angemessen war.'
    reason: lexical_nuance
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: nur wenige Tage lang
  rationale: Die Wendung bezeichnet die begrenzte Dauer der Erziehung durch irdische Väter. „Nur“ macht den im griechischen Gegensatz angelegten zeitlichen Kontrast natürlich sichtbar.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: wie es ihnen richtig erschien
  rationale: Die Formulierung gibt das subjektive Urteil der irdischen Väter wieder, ohne zu behaupten, ihre Einschätzung sei tatsächlich immer richtig gewesen.
- source_word: ἐπαίδευον
  choice: erzogen
  rationale: Im Zusammenhang umfasst παιδεύω väterliche Erziehung, Schulung und Zurechtweisung, nicht lediglich Bestrafung. „Erzogen“ ist im Deutschen breit genug und passt zum Eltern-Kind-Vergleich.
- source_word: ὁ δὲ
  choice: er aber tut es
  rationale: Das im Griechischen ausgelassene Verb wird für natürliches Deutsch ergänzt; das Pronomen bewahrt die implizite Bezeichnung Gottes aus dem Kontext.
- source_word: ἐπὶ τὸ συμφέρον
  choice: zu unserem Besten
  rationale: Die Wendung bezeichnet das auf unseren Nutzen gerichtete Ziel des göttlichen Handelns. Das im Griechischen kontextuell vorausgesetzte „unser“ wird idiomatisch ausgedrückt.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: damit wir … Anteil bekommen
  rationale: Die Konstruktion drückt Ziel beziehungsweise beabsichtigtes Ergebnis aus; „Anteil bekommen“ gibt μεταλαμβάνω verständlich wieder.
- source_word: ἁγιότητος αὐτοῦ
  choice: seiner Heiligkeit
  rationale: Die Formulierung bewahrt sowohl den Bezug auf Gott als auch die Aussage, dass die Glaubenden an der ihm eigenen Heiligkeit Anteil erhalten.
theological_decisions:
- issue: Bezug des kontrastierenden Singulars ὁ δὲ
  choice: Gott wird entsprechend dem griechischen Text pronominal mit „er“ bezeichnet.
  alternative: Zur Verdeutlichung ausdrücklich „Gott aber“ schreiben.
  rationale: Hebräer 12,5–11 macht den Gegensatz zwischen irdischen Vätern und Gott als Vater deutlich. Das Pronomen erhält die Implizitheit des Ausgangstextes, ohne den Bezug im Zusammenhang zu verdunkeln.
- issue: Bedeutung der Teilhabe an „seiner Heiligkeit“
  choice: Die Aussage bleibt als Teilhabe an Gottes Heiligkeit stehen, ohne deren heilsgeschichtliche oder dogmatische Ausgestaltung näher festzulegen.
  alternative: Die Formulierung ausschließlich auf zugerechnete Heiligkeit oder ausschließlich auf fortschreitende Heiligung beziehen.
  rationale: Der Vers nennt die Teilhabe an Gottes Heiligkeit als Ziel seiner Erziehung, definiert hier aber nicht genauer, wie diese Teilhabe dogmatisch einzuordnen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erzogen“ bewahrt die Breite elterlicher παιδεία; die Satzstruktur hält den Gegensatz zwischen den irdischen Vätern und Gott klar. Die Fußnotenmarker sind den jeweils tatsächlich erläuterten Wendungen zugeordnet.
