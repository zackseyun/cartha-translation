  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: de
  text: und zum Klang einer Posaune und zu einer Stimme, die Worte sprach, und deren Hörer darum baten, dass kein weiteres Wort an sie gerichtet werde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und zu einer Stimme, von der die, die sie hörten, baten, dass kein weiteres Wort an sie gerichtet werde.« Das Relativpronomen kann auch weiter gefasst auf die gesamte Erscheinung am Sinai bezogen werden, nicht nur auf die Stimme.'
    reason: alternative_reading
  - marker: b
    text: Siehe 2. Mose 20,18–19 und 5. Mose 5,23–27 zur Bitte der Israeliten, Gottes Stimme nicht länger unmittelbar hören zu müssen.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: zum Klang einer Posaune
  rationale: Die Dativfügung bezeichnet das am Sinai vernommene Schallereignis. »Klang einer Posaune« gibt ἦχος konkret und würdig wieder, ohne die Lautstärke über den Wortlaut hinaus festzulegen.
- source_word: φωνῇ ῥημάτων
  choice: zu einer Stimme, die Worte sprach
  rationale: Die ungewöhnliche Genitivfügung bezeichnet eine artikulierte Stimme. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt den Unterschied zwischen bloßem Schall und verständlicher Rede.
- source_word: ἧς οἱ ἀκούσαντες
  choice: deren Hörer
  rationale: Das feminine Relativpronomen bezieht sich grammatisch am ehesten auf die unmittelbar vorausgehende »Stimme«. »Deren Hörer« bildet diese Beziehung knapp ab; die mögliche weitere Rückbeziehung auf die gesamte Sinai-Erscheinung wird in einer Fußnote bewahrt.
- source_word: παρῃτήσαντο
  choice: baten darum
  rationale: Das Medium bezeichnet hier die dringende Bitte, von weiterer unmittelbarer Anrede verschont zu bleiben. »Baten darum« ist klar und vermeidet die zu harte Wiedergabe »weigerten sich«.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: dass kein weiteres Wort an sie gerichtet werde
  rationale: Die Konstruktion gibt den Inhalt der Bitte wieder. »Kein weiteres Wort« erfasst den Gedanken des Hinzufügens, während »an sie gerichtet werde« die passive Form und den Bezug auf göttliche Rede wahrt.
theological_decisions:
- issue: Bezugswort des Relativpronomens ἧς
  choice: Der Relativsatz wird zunächst auf die unmittelbar vorausgehende Stimme bezogen.
  alternative: Das Relativpronomen kann sinngemäß auf die gesamte vorausgehende Sinai-Erscheinung, einschließlich des Posaunenklangs, bezogen werden.
  rationale: Genus und unmittelbare Wortstellung sprechen für φωνή als Bezugswort; der größere Zusammenhang beschreibt jedoch das Erschrecken vor der gesamten Offenbarung am Sinai. Die Hauptübersetzung folgt der naheliegenden Grammatik, während die Fußnote die weitere Deutung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »und zu« wahrt den Anschluss an die Aufzählung des griechischen Satzes. »Posaune« entspricht dem etablierten biblischen Sprachgebrauch für σάλπιγξ; »Stimme, die Worte sprach« macht die ungewöhnliche Wendung verständlich, ohne sie zu bloßem Geräusch abzuschwächen.
