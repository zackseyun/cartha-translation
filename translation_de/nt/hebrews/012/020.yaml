  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: de
  text: 'Denn sie konnten die Anordnung nicht ertragen: »Selbst wenn ein Tier den Berg berührt, soll es gesteinigt werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: »oder mit einem Pfeil erschossen werden«; vgl. 2. Mose 19,12–13.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: sie konnten … nicht ertragen
  rationale: Die verneinte Form von φέρω bezeichnet hier, dass sie die auferlegte Anordnung nicht ertragen konnten; die deutsche Wendung ist natürlich und bewahrt den Gedanken des Unvermögens.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Aussage; »Denn« gibt diese Verknüpfung knapp und angemessen wieder.
- source_word: τὸ διαστελλόμενον
  choice: die Anordnung
  rationale: Das substantivierte Passivpartizip bezeichnet das, was mit Nachdruck angeordnet wurde. »Anordnung« wahrt den autoritativen Charakter, ohne den Inhalt über den griechischen Text hinaus festzulegen.
- source_word: Κἂν
  choice: Selbst wenn
  rationale: 'κἄν (καὶ ἐάν) leitet hier eine Bedingung mit hervorhebender Bedeutung ein: Sogar für den Fall, dass ein Tier den Berg berührt, gilt die Sanktion.'
- source_word: θηρίον
  choice: ein Tier
  rationale: θηρίον kann »Tier« oder »wildes Tier« bedeuten. Hier ist die allgemeine Wiedergabe »Tier« sachlich passend und vermeidet eine unnötige Einschränkung.
- source_word: θίγῃ
  choice: berührt
  rationale: Der Aorist Konjunktiv in der Bedingung wird im modernen Deutsch idiomatisch mit dem Präsens wiedergegeben.
- source_word: τοῦ ὄρους
  choice: den Berg
  rationale: Der Kontext bezeichnet den Sinai, doch der griechische Vers selbst sagt lediglich »den Berg«; diese Referenz bleibt unverändert.
- source_word: λιθοβοληθήσεται
  choice: soll es gesteinigt werden
  rationale: Das Futur Passiv steht innerhalb einer zitierten verbindlichen Anordnung. Das deutsche »soll … werden« gibt sowohl den passiven als auch den normativen Sinn natürlich wieder.
theological_decisions:
- issue: Verhältnis zum Sinaigebot und Umfang des Zitats
  choice: Das Sinaigebot wird nur in dem Umfang übersetzt, den der SBLGNT-Text bietet.
  alternative: Erweiterung um »oder mit einem Pfeil erschossen werden« nach anderen Handschriften und in Anlehnung an 2. Mose 19,12–13.
  rationale: Die Vorlage endet mit λιθοβοληθήσεται. Die abweichende Überlieferung wird nicht in den Haupttext aufgenommen, sondern in einer textkritischen Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. »Anordnung« ist prägnant und autoritativ; »soll … gesteinigt werden« entspricht im Zitat natürlichem deutschem Gebotsstil. Der Fußnotenmarker steht unmittelbar nach dem Zitat.
