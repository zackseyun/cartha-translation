base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: de
  text: Ihr habt im Kampf gegen die Sünde noch nicht bis aufs Blut Widerstand geleistet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihr habt noch nicht bis zum Blut widerstanden.“ Gemeint ist Widerstand bis hin zum Blutvergießen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: noch nicht
  rationale: Das temporale Adverb zeigt an, dass die genannte Grenze bisher nicht erreicht wurde; „noch nicht“ ist die natürliche deutsche Entsprechung.
- source_word: μέχρις αἵματος
  choice: bis aufs Blut
  rationale: Die prägnante deutsche Wendung bewahrt das Bild und bezeichnet Widerstand bis hin zu Blutvergießen beziehungsweise schwerer körperlicher Gewalt, ohne festzulegen, ob tatsächlich der Tod gemeint ist.
- source_word: ἀντικατέστητε
  choice: Widerstand geleistet
  rationale: Der Aorist Indikativ in der zweiten Person Plural bezeichnet das Entgegentreten; die Formulierung verbindet sich im Deutschen natürlich mit „bis aufs Blut“.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: gegen die Sünde
  rationale: πρός mit Akkusativ bezeichnet hier die Ausrichtung des Widerstands. Der Artikel kann im Deutschen natürlich wiedergegeben werden, ohne den möglichen Bezug der Sünde enger festzulegen.
- source_word: ἀνταγωνιζόμενοι
  choice: im Kampf
  rationale: Das präsentische Partizip trägt ein Wettkampf- oder Kampfesbild und beschreibt den fortdauernden Zusammenhang, in dem Widerstand geleistet wird.
theological_decisions:
- issue: Bezug von „Sünde“ im Kontext
  choice: Allgemein als „die Sünde“ wiedergeben
  alternative: Die sündige Feindschaft der Gegner oder speziell die Versuchung zum Glaubensabfall benennen
  rationale: Der Kontext verbindet das Ertragen von Feindschaft mit dem Kampf gegen die Sünde, legt deren Referenz in diesem Vers aber nicht eindeutig fest. Die allgemeine Wiedergabe bewahrt diese Spannung.
- issue: Bedeutungsumfang von „bis aufs Blut“
  choice: Die bildhafte Grenzangabe beibehalten
  alternative: Ausdrücklich „bis zum Vergießen eures Blutes“ oder „bis zum Märtyrertod“ schreiben
  rationale: Der griechische Ausdruck nennt Blut als äußerste Grenze des Widerstands, bestimmt aber weder ausdrücklich den Tod noch wessen Blut vergossen wird. Die deutsche Wendung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den fortdauernden Kampf gegen die Sünde voran und hält zugleich die markante Grenzangabe „bis aufs Blut“ nahe beim Hauptverb.
