  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: de
  text: Denn auch unser Gott ist ein verzehrendes Feuer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Anklang an 5. Mose 4,24, wo Gott als „verzehrendes Feuer“ bezeichnet wird.
    reason: cross_reference
  - marker: b
    text: 'Oder: „ein Feuer, das verzehrt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: γάρ begründet die vorausgehende Mahnung; καί verstärkt die Aussage. „Denn auch“ gibt beide Elemente in natürlichem Deutsch wieder.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Die idiomatische deutsche Possessivkonstruktion bewahrt den gemeinschaftlichen und bundesbezogenen Klang.
- source_word: πῦρ
  choice: Feuer
  rationale: Die wörtliche Wiedergabe erhält das ungemilderte Bild und den Anklang an 5. Mose 4,24.
- source_word: καταναλίσκον
  choice: verzehrendes
  rationale: Das substantivbezogene Partizip bezeichnet ein Feuer, das vollständig aufzehrt. „Verzehrend“ ist prägnant, würdevoll und bewahrt die traditionelle intertextuelle Formulierung.
theological_decisions:
- issue: Metaphorische Bezeichnung Gottes als Feuer
  choice: Die direkte Metapher „unser Gott ist ein verzehrendes Feuer“ bleibt erhalten.
  alternative: „Unser Gott ist wie ein verzehrendes Feuer“ oder „unser Gott ist ein Feuer, das verzehrt“.
  rationale: Im Griechischen steht eine Gleichsetzung ohne Vergleichspartikel. Die direkte Metapher bewahrt die Schärfe der Warnung und den Bezug auf 5. Mose 4,24, ohne sie zu einem bloßen Vergleich abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform und das biblische Feuerbild bleiben erhalten; „Denn auch“ macht den begründenden Anschluss an den vorherigen Vers sichtbar.
