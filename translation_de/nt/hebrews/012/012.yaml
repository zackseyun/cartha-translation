  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: de
  text: Darum richtet die erschlafften Hände und die geschwächten Knie auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung greift Jesaja 35,3 in der griechischen Überlieferung auf. Das Körperbild ruft zu neuem Mut und neuer Ausdauer auf.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Darum
  rationale: Die Folgerungspartikel leitet aus der vorangehenden Erörterung über Zurechtweisung und Ausdauer die folgende Aufforderung ab. „Darum“ ist knapp, natürlich und erhält den logischen Zusammenhang.
- source_word: παρειμένας χεῖρας
  choice: die kraftlos herabhängenden Hände
  rationale: Das Partizip bezeichnet Hände, die schlaff geworden sind oder herabhängen. „Kraftlos herabhängend“ bewahrt sowohl das anschauliche Körperbild als auch dessen Zusammenhang mit Mutlosigkeit und Erschöpfung.
- source_word: παραλελυμένα γόνατα
  choice: die geschwächten Knie
  rationale: Das Perfektpartizip beschreibt Knie, die geschwächt beziehungsweise kraftlos geworden sind. „Geschwächt“ vermeidet die im Deutschen irreführend klinische Bedeutung von „gelähmt“ und wahrt den Zustand anhaltender Schwäche.
- source_word: ἀνορθώσατε
  choice: richtet … wieder auf
  rationale: Das Verb bedeutet aufrichten, wieder gerade machen oder wiederherstellen. Die Wiedergabe erhält die körperliche Bildsprache und lässt zugleich die übertragene Aufforderung zu neuem Mut und neuer Ausdauer erkennen.
theological_decisions:
- issue: Körperliche Bildsprache als Aufforderung zu neuer Ausdauer
  choice: Die Körperteile und das Aufrichten werden bildhaft und quellennah wiedergegeben.
  alternative: 'Sinndeutend übersetzen: „Stärkt eure müden Hände und geschwächten Knie.“'
  rationale: Der Zusammenhang zielt auf erneuerte Ausdauer, doch die Formulierung greift Jesaja 35,3 in der griechischen Überlieferung auf. Die bildhafte Wiedergabe bewahrt diesen Bezug und legt die Metapher nicht unnötig auf nur eine Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Verbindung „Hände aufrichten“ wurde bewusst beibehalten, um das Körperbild und den Bezug auf Jesaja 35,3 zu bewahren; „wieder“ gibt den wiederherstellenden Sinn von ἀνορθόω wieder.
