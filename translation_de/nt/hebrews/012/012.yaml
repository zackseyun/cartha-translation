  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Διὸ als Folgerung, die beiden durch Partizipien bestimmten Körperteile und der auffordernde Plural von ἀνορθώσατε. „wieder“ ist jedoch im griechischen Wortlaut nicht ausdrücklich vorhanden und sollte nicht ergänzt werden; ἀνορθόω bedeutet hier „aufrichten/hochheben“ und kann zwar kontextuell Wiederherstellung nahelegen, diese Nuance muss aber nicht im Text festgelegt werden.'
