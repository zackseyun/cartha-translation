  terminology: „Geschwächten Knie“ ist eine angemessene, nicht klinisch überzeichnende Wiedergabe von παραλελυμένα γόνατα. „Aufrichten“ gibt ἀνορθώσατε bildhafter und enger wieder als eine rein deutende Wiedergabe mit „stärken“. Der Jesaja-Bezug in der Fußnote ist sachgerecht.
