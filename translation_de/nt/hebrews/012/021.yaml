id: HEB.12.21
reference: Hebrews 12:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: de
  text: 'Und so furchterregend war der Anblick[a], dass Mose sagte[b]: »Ich bin voller Angst und zittere.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das, was zu sehen war« oder »die Erscheinung«. Der griechische Ausdruck bezeichnet die sichtbare Erscheinung am Sinai.'
    reason: lexical_alternative
  - marker: b
    text: Der Wortlaut ist kein wörtliches Zitat aus dem Alten Testament, greift aber die mit dem Sinai-Ereignis verbundene Furcht des Mose auf; vergleiche 5. Mose 9,19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: Und
  rationale: Setzt die vorangehende Beschreibung des Sinai schlicht und natürlich fort.
- source_word: οὕτω φοβερὸν
  choice: so furchterregend
  rationale: οὕτω gibt den Grad an; »so furchterregend« bewahrt die starke emotionale Wirkung und klingt im modernen Deutsch natürlich.
- source_word: τὸ φανταζόμενον
  choice: der Anblick
  rationale: Die substantivierte Partizipialform bezeichnet hier die sichtbare Erscheinung beziehungsweise das, was sich am Sinai zeigte; »der Anblick« gibt den Erfahrungsbezug idiomatisch wieder, ohne andere mögliche Nuancen auszuschließen.
- source_word: Μωϋσῆς εἶπεν
  choice: Mose sagte
  rationale: Direkte und geläufige Wiedergabe von Name und einfachem Redeverb.
- source_word: Ἔκφοβός εἰμι
  choice: Ich bin voller Angst
  rationale: ἔκφοβος bezeichnet starke Furcht oder Erschrockenheit. Die Formulierung bleibt nahe an der prädikativen Aussage und unterscheidet sie vom folgenden Zittern.
- source_word: καὶ ἔντρομος
  choice: und zittere
  rationale: ἔντρομος beschreibt das Erzittern infolge der Furcht. Die verbale deutsche Form ist natürlich und bewahrt neben der Angst auch deren körperlichen Ausdruck.
theological_decisions:
- issue: Verhältnis der Aussage zur Sinai-Erzählung
  choice: Die Aussage wird im Haupttext ohne Harmonisierung als Reaktion des Mose auf die furchterregende Erscheinung wiedergegeben.
  alternative: Die Worte könnten ausdrücklich als freie Zusammenfassung der mit dem Sinai verbundenen Furcht des Mose bezeichnet werden.
  rationale: Der griechische Text stellt die Aussage unmittelbar als Worte des Mose dar, bietet aber kein wörtliches alttestamentliches Zitat. Diese Spannung bleibt im Haupttext bestehen und wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung »so furchterregend war der Anblick« bewahrt die Hervorhebung des griechischen Satzes. Die zwei Ausdrücke für Angst und Zittern werden im Deutschen getrennt wiedergegeben.
