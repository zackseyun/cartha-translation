reference: Hebrews 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: de
  text: und dabei den Blick fest auf Jesus richten, den Wegbereiter und Vollender des Glaubens[a]. Um der Freude willen, die vor ihm lag, ertrug er das Kreuz und achtete die Schande gering[b]; und er hat sich zur Rechten des Thrones Gottes gesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Wegbereiter und Vollender der Treue“; oder: „den Wegbereiter und Vollender unseres Glaubens“. Die griechische Wendung ist knapp; πίστις kann auch „Treue“ bedeuten oder sich hier besonders auf den Glauben der Glaubenden beziehen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ließ sich von der Schande nicht bestimmen“. Gemeint ist, dass er die Schande der Kreuzigung nicht als entscheidend gelten ließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες εἰς
  choice: den Blick fest auf … richten
  rationale: Die Wendung bezeichnet die konzentrierte Ausrichtung auf ein Ziel, unter Abwendung von Ablenkungen. Die deutsche Formulierung ist natürlich und bewahrt die fortdauernde, fokussierte Bedeutung.
- source_word: ἀρχηγὸν
  choice: Wegbereiter
  rationale: Das Wort kann den bezeichnen, der etwas beginnt und anderen vorangeht. „Wegbereiter“ verbindet Initiative und Vorangehen und passt zum Bild des vor den Glaubenden liegenden Laufes.
- source_word: τελειωτὴν
  choice: Vollender
  rationale: Gemeint ist derjenige, der etwas zum vorgesehenen Ziel und Abschluss bringt. „Vollender“ gibt diese Zielgerichtetheit prägnant wieder.
- source_word: τῆς πίστεως
  choice: des Glaubens
  rationale: Der knappe Genitiv wird nicht durch ein im Griechischen unausgedrücktes „unseres“ erweitert. Die mögliche Bedeutung „Treue“ wird in der Fußnote offengehalten.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Für die Freude, die vor ihm lag
  rationale: ἀντί wird hier im Sinn des Handelns im Blick auf die bevorstehende Freude verstanden. Die Formulierung bewahrt zugleich das Bild eines vor ihm liegenden Ziels.
- source_word: ὑπέμεινεν
  choice: ertrug
  rationale: Das Verb bezeichnet standhaftes Ausharren unter Leiden. „Ertrug“ ist knapp, verständlich und fügt sich in den Zusammenhang der Ausdauer ein.
- source_word: σταυρὸν
  choice: das Kreuz
  rationale: Obwohl im Griechischen ohne Artikel, ist Jesu Kreuzigung im Kontext eindeutig bestimmt; im Deutschen ist daher der bestimmte Artikel sachgemäß.
- source_word: αἰσχύνης καταφρονήσας
  choice: achtete die Schande gering
  rationale: Das Partizip besagt, dass Jesus die mit der Kreuzigung verbundene Schande nicht als maßgeblich gelten ließ. Diese Wiedergabe vermeidet die mögliche moderne Fehlbedeutung von „verachten“ als bloß emotionalem Hass.
- source_word: ἐν δεξιᾷ … τοῦ θρόνου τοῦ θεοῦ
  choice: zur Rechten des Thrones Gottes
  rationale: Die etablierte deutsche Wendung bewahrt das Bild des Ehren- und Herrschaftsplatzes sowie die griechische Genitivstruktur.
- source_word: κεκάθικεν
  choice: hat er sich … gesetzt
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung mit fortdauerndem Ergebnis. Das deutsche Perfekt bewahrt diesen Akzent, während das reflexive „sich gesetzt“ idiomatisch ist.
theological_decisions:
- issue: Bedeutung von τῆς πίστεως bei ἀρχηγὸν καὶ τελειωτὴν
  choice: Jesus wird als „Wegbereiter und Vollender des Glaubens“ bezeichnet.
  alternative: „Wegbereiter und Vollender der Treue“ oder „Wegbereiter und Vollender unseres Glaubens“
  rationale: Die kompakte Genitivverbindung lässt offen, ob πίστις den Glauben der Glaubenden, gläubige Treue oder die von Jesus verkörperte Glaubenstreue bezeichnet. Der Haupttext bleibt formal nahe am Griechischen; die Alternativen stehen in der Fußnote.
- issue: Bedeutung von ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Jesus ertrug das Kreuz im Blick auf die vor ihm liegende Freude.
  alternative: Jesus ertrug das Kreuz, anstatt die vor ihm liegende Freude zu wählen.
  rationale: ἀντί kann „anstatt“ bedeuten; der Zusammenhang von Ausdauer und vor Augen liegendem Ziel spricht hier jedoch stärker für die Freude als motivierende Aussicht. Die alternative Lesart ist lexikalisch möglich, aber kontextuell weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur schließt mit „und dabei“ an Hebräer 12,1 an. „Wegbereiter und Vollender“ ist verständlich und bewahrt die inhaltliche Paarung der beiden griechischen Titel. Beide Fußnotenmarker erscheinen unmittelbar bei den betreffenden Wendungen im Haupttext.
