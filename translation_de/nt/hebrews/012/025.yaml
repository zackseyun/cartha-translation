  variant: modern standard German
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: de
  text: Gebt acht, dass ihr den, der spricht, nicht abweist. Denn wenn jene nicht entkamen, als sie den abwiesen, der auf der Erde eine göttliche Weisung gab[a], dann werden wir erst recht nicht entkommen, wenn wir uns von dem abwenden, der vom Himmel her spricht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sie auf der Erde warnte“. Das griechische Verb kann eine göttlich autorisierte Weisung oder Warnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um wie viel mehr wir, die wir uns von dem abwenden, der vom Himmel her [spricht]“. Das Verb „entkommen“ ist aus dem vorhergehenden Satzteil ergänzt; auch „spricht“ wird aus dem Zusammenhang aufgenommen.'
    reason: ellipsis_and_lexical_clarity
lexical_decisions:
- source_word: Βλέπετε
  choice: Gebt acht
  rationale: Der Imperativ Plural ist eine eindringliche Aufforderung beziehungsweise Warnung. „Gebt acht“ ist natürliches, gegenwärtiges Deutsch und bewahrt diesen Nachdruck.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: nicht abweist / abwiesen
  rationale: „Abweisen“ gibt das Zurückweisen einer sprechenden beziehungsweise mahnenden Person treffend wieder und bewahrt die Wiederholung desselben griechischen Verbs.
- source_word: τὸν λαλοῦντα
  choice: den, der spricht
  rationale: Das substantivierte Präsenspartizip bezeichnet den gegenwärtig Sprechenden. Die Formulierung erhält die Unmittelbarkeit, ohne die Person ausdrücklich als Gott oder Christus zu identifizieren.
- source_word: ἐξέφυγον
  choice: nicht entkamen
  rationale: Das Verb bezeichnet hier das Entkommen vor den Folgen beziehungsweise dem Gericht; „entkamen“ ist knapp und idiomatisch.
- source_word: ἐπὶ γῆς
  choice: auf der Erde
  rationale: Die Wendung bildet den räumlichen Kontrast zu „vom Himmel her“ ab, ohne den Bezug im Haupttext ausdrücklich auf den Sinai einzuengen.
- source_word: χρηματίζοντα
  choice: der ... göttliche Weisung gab
  rationale: χρηματίζω kann autorisierte göttliche Mitteilung, Weisung oder Warnung bezeichnen. „Göttliche Weisung gab“ bewahrt diesen besonderen Charakter, ohne die Bedeutung allein auf eine Warnung festzulegen.
- source_word: πολὺ μᾶλλον
  choice: dann werden erst recht wir nicht entkommen
  rationale: Im negativen Schluss vom Geringeren auf das Größere gibt „erst recht ... nicht“ die Logik im Deutschen klar und natürlich wieder.
- source_word: ἀποστρεφόμενοι
  choice: wenn wir uns ... abwenden
  rationale: Das Partizip beschreibt diejenigen, die sich abwenden. Die konditionale Wiedergabe macht den elliptischen Gedankengang im Deutschen verständlich, ohne die Warnung sachlich zu erweitern.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: der vom Himmel her spricht
  rationale: Im Griechischen steht verkürzt „den vom Himmel her“. Das aus dem ersten Satzteil aufgenommene „spricht“ macht den Bezug verständlich und wahrt die Gegenüberstellung mit der irdischen Mitteilung.
theological_decisions:
- issue: Identität des Sprechenden beziehungsweise Weisung Gebenden
  choice: Die Personen werden beschreibend als „der, der spricht“, „der ... göttliche Weisung gab“ und „der vom Himmel her spricht“ wiedergegeben.
  alternative: Im Haupttext ausdrücklich „Gott“ oder „Christus“ einsetzen.
  rationale: Der Zusammenhang handelt von göttlichem Reden, doch der Vers selbst nennt weder Gott noch Christus ausdrücklich. Die beschreibende Wiedergabe bewahrt die vom Text offen gelassene genaue Zuordnung.
- issue: Elliptischer Nachsatz
  choice: „dann werden erst recht wir nicht entkommen“ ergänzt das aus dem vorigen Teilsatz erschlossene Verb.
  alternative: 'Wörtlicher und elliptisch: „wie viel mehr wir, die wir uns ... abwenden“.'
  rationale: Das Griechische lässt „entkommen“ im zweiten Teil unausgesprochen. Die Ergänzung ist für klares modernes Deutsch nötig und gibt die unzweideutige Satzlogik wieder.
- issue: Bedeutung von χρηματίζω
  choice: „göttliche Weisung gab“ im Haupttext, mit „warnte“ als Fußnotenalternative.
  alternative: Nur „warnte“ oder „ein Orakel erteilte“.
  rationale: Die Formulierung erhält sowohl den göttlich autorisierten Charakter der Rede als auch die im Kontext mögliche warnende Funktion, ohne die lexikalische Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem Warncharakter. Die Wiederholung von „abweisen“ bildet die griechische Wortwiederholung ab. „Göttliche Weisung“ ist verständlich, markiert aber den besonderen Charakter von χρηματίζω; die geläufigere kontextuelle Alternative „warnte“ steht in der Fußnote.
