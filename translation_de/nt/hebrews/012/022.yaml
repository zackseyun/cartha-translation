  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: de
  text: Doch ihr seid zum Berg Zion gekommen, zur Stadt des lebendigen Gottes, dem himmlischen Jerusalem, und zu Myriaden[a] von Engeln in festlicher Versammlung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Myriaden“ kann wörtlich „Zehntausende“ oder allgemeiner eine unzählbare Menge bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und zu Myriaden von Engeln, zu einer Festversammlung“. Die griechische Satzfügung lässt zu, „Festversammlung“ entweder mit den Engeln zu verbinden oder als eigenen Punkt der Aufzählung zu verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert natürlich und deutlich den starken Gegensatz zum Sinai-Abschnitt unmittelbar davor.
- source_word: προσεληλύθατε
  choice: ihr seid … gekommen
  rationale: Das deutsche Perfekt gibt die vollzogene Annäherung mit ihrer fortdauernden Bedeutung angemessen wieder.
- source_word: Σιὼν ὄρει
  choice: zum Berg Zion
  rationale: Gibt den Dativ nach προσέρχομαι idiomatisch wieder und bewahrt das Bergmotiv sowie den Eigennamen.
- source_word: πόλει θεοῦ ζῶντος
  choice: zur Stadt des lebendigen Gottes
  rationale: Bewahrt die genitivische Zuordnung und die theologisch gewichtige Bezeichnung Gottes als lebendig.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: zum himmlischen Jerusalem
  rationale: Gibt die Apposition zur Stadt des lebendigen Gottes direkt und in natürlichem Deutsch wieder.
- source_word: μυριάσιν ἀγγέλων
  choice: zu Myriaden … Engel
  rationale: „Myriaden“ bewahrt sowohl den gehobenen Ton als auch die Offenheit zwischen Zehntausenden und einer unzählbaren Menge.
- source_word: πανηγύρει
  choice: festlich versammelter
  rationale: Gibt die Fest- und Versammlungsbedeutung von πανήγυρις natürlich wieder und bezieht sie in der Hauptfassung auf die Engel.
theological_decisions:
- issue: Syntaktische Beziehung von πανηγύρει
  choice: 'πανηγύρει wird auf die unmittelbar vorausgehenden Myriaden von Engeln bezogen: „festlich versammelter Engel“.'
  alternative: 'πανηγύρει kann als eigener Punkt der Aufzählung verstanden werden: „zu Myriaden von Engeln, zu einer Festversammlung“.'
  rationale: Beide Zuordnungen sind aufgrund der griechischen Dativreihe möglich. Die Hauptfassung folgt der naheliegenden Verbindung mit den Engeln; die echte syntaktische und damit auslegungsgeschichtliche Offenheit bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Myriaden“ erhält den gehobenen Klang des Kontextes; die umgebende Syntax bleibt zugleich gut verständlich. Die wiederholten Präpositionen verdeutlichen die appositionale und aufzählende Struktur.
