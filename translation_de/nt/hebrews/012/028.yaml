source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: de
  text: Darum, weil wir ein unerschütterliches Reich empfangen, lasst uns Gnade haben[a], durch die wir Gott in einer ihm wohlgefälligen Weise dienen können, mit Ehrfurcht und Scheu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns dankbar sein.“ Die griechische Wendung ἔχωμεν χάριν kann „lasst uns Gnade haben“ bedeuten oder idiomatisch „lasst uns dankbar sein“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet den Schluss aus der vorausgehenden Aussage über das Erschüttern und das Bleibende; „Darum“ gibt diesen Folgerungszusammenhang knapp und natürlich wieder.
- source_word: βασιλείαν ἀσάλευτον
  choice: ein unerschütterliches Reich
  rationale: „Reich“ entspricht βασιλεία, und „unerschütterlich“ bewahrt den bewussten Gegensatz zu allem, was erschüttert werden kann.
- source_word: παραλαμβάνοντες
  choice: weil wir … empfangen
  rationale: Das präsentische Partizip bezeichnet den Umstand beziehungsweise Grund der folgenden Aufforderung. Die Formulierung lässt den gegenwärtigen Vorgang erkennen, ohne ihn auf einen einmaligen vergangenen Empfang festzulegen.
- source_word: ἔχωμεν χάριν
  choice: lasst uns an der Gnade festhalten
  rationale: Ein wörtliches „lasst uns Gnade haben“ wäre im heutigen Deutsch missverständlich und könnte bedeuten, anderen gegenüber gnädig zu sein. „An der Gnade festhalten“ gibt χάρις als Gnade wieder und stellt einen natürlichen Bezug zum folgenden „durch die“ her; die plausible idiomatische Deutung als Dankbarkeit wird in der Fußnote bewahrt.
- source_word: δι’ ἧς
  choice: durch die
  rationale: Das feminine Relativpronomen bezieht sich natürlich auf „Gnade“ und διά mit Genitiv bezeichnet hier das Mittel.
- source_word: λατρεύωμεν
  choice: wir Gott … dienen können
  rationale: λατρεύω bezeichnet den Gott erwiesenen religiösen Dienst. „Dienen“ wahrt den umfassenden Handlungscharakter besser als eine Verengung auf einen Gottesdienst oder eine innere Anbetung.
- source_word: εὐαρέστως
  choice: auf wohlgefällige Weise
  rationale: Die Wendung drückt aus, dass der Dienst Gottes Wohlgefallen findet. Sie vermeidet das im Deutschen mögliche Missverständnis von „Gott wohlgefällig dienen“, als wäre Gott selbst das Adverbiale.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: mit Ehrfurcht und Scheu
  rationale: „Ehrfurcht“ gibt die achtungsvolle, gewissenhafte Haltung von εὐλάβεια wieder; „Scheu“ bewahrt bei δέος den Aspekt heiliger Furcht, ohne ihn zu bloßem Staunen abzuschwächen oder als panischen Schrecken wiederzugeben.
theological_decisions:
- issue: Bedeutung von χάριν in ἔχωμεν χάριν
  choice: Gnade
  alternative: Dankbarkeit; „lasst uns dankbar sein“
  rationale: Der anschließende feminine Relativsatz „durch die“ lässt sich unmittelbar auf die Gnade als Mittel eines Gott wohlgefälligen Dienstes beziehen. Zugleich ist ἔχειν χάριν idiomatisch im Sinn von „dankbar sein“ gut möglich. Diese echte Auslegungsfrage wird daher nicht verschwiegen, sondern in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unerschütterlich“, „wohlgefällig“, „Ehrfurcht“ und „Scheu“ bewahren den feierlichen Ton, bleiben aber verständlich. Der Gedankenstrich hebt die abschließende Angabe der Haltung hervor.
