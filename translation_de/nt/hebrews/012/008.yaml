- from: Wenn ihr aber ohne Erziehung bleibt, an der alle Anteil bekommen haben, dann seid ihr uneheliche Kinder und keine Söhne.
  to: Wenn ihr aber ohne Erziehung seid, die alle erfahren haben, dann seid ihr uneheliche Kinder und keine Söhne.
  rationale: Die minimale Änderung ersetzt den hinzugefügten Verlaufsaspekt durch die direkte Wiedergabe von ἐστε. Die Aussage über die allgemeine Teilhabe an der Erziehung bleibt unkommentiert, wie es der nicht näher bestimmte Bezug von πάντες erfordert.
