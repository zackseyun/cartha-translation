id: HEB.12.8
reference: Hebrews 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: de
  text: Wenn ihr aber ohne Erziehung seid, die alle erfahren haben, dann seid ihr uneheliche Kinder und keine Söhne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: Erziehung
  rationale: Der Kontext meint die formende, auch zurechtweisende Erziehung durch einen Vater. „Erziehung“ wahrt diese familiäre Dimension besser als das enger strafende „Züchtigung“.
- source_word: μέτοχοι γεγόνασι
  choice: Anteil bekommen haben
  rationale: Gibt die eingetretene Teilhabe natürlich wieder und bewahrt den perfektischen Aspekt von γεγόνασι.
- source_word: νόθοι
  choice: uneheliche Kinder
  rationale: Bezeichnet Kinder ohne den anerkannten Status legitimer Söhne. Die Formulierung ist verständlich und hält den Gegensatz zu υἱοί fest.
- source_word: υἱοί
  choice: Söhne
  rationale: Die geschlechtsspezifische Bezeichnung ist für das antike Rechts- und Erbbild bedeutsam und wird daher nicht zu „Kinder“ verallgemeinert.
theological_decisions:
- issue: Reichweite von πάντες
  choice: „alle“ ohne ergänzende Einschränkung
  alternative: „alle Kinder Gottes“ oder „alle Söhne“
  rationale: Der griechische Text lässt die Bezugsgruppe aus dem Kontext erschließen. Eine ausdrückliche Ergänzung würde die Aussage stärker festlegen als die Vorlage.
- issue: Statusbezeichnung νόθοι
  choice: familiär-rechtlichen Gegensatz direkt wiedergeben
  alternative: „nicht wirklich seine Kinder“
  rationale: Die Paraphrase würde die theologische Folgerung erklären, aber die scharfe historische Metapher und den ausdrücklichen Gegensatz zu „Söhne“ abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Konditionalsatz, klingt jedoch natürlich. Die Härte der familiär-rechtlichen Metapher wird nicht geglättet.
