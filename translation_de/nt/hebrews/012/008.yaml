    issue: „bleibt“ statt „seid“
    rationale: Das griechische εἰ ... ἐστε beschreibt den Zustand, ohne ausdrücklich ein Fortbestehen oder Verbleiben zu behaupten. „Bleibt“ ist daher eine nicht erforderliche Bedeutungsnuance.
  revised_text: Wenn ihr aber ohne Erziehung seid, die alle erfahren haben, dann seid ihr uneheliche Kinder und keine Söhne.
