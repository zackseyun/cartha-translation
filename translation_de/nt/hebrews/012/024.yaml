id: HEB.12.24
reference: Hebrews 12:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: de
  text: und zu Jesus, dem Mittler eines neuen Bundes, und zu dem Blut der Besprengung[b], das besser spricht als Abel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Abels Blut“. Im Griechischen steht lediglich „als Abel“; wahrscheinlich wird auf Abels Blut angespielt, das vom Erdboden schreit (1. Mose 4,10).'
    reason: alternative_reading
  - marker: b
    text: Das „Blut der Besprengung“ bezeichnet Opferblut, das durch Besprengen aufgetragen wurde, und erinnert an die Bestätigung eines Bundes und an kultische Reinigung.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: eines neuen Bundes
  rationale: „Bund“ gibt den biblisch-bundestheologischen Sinn von διαθήκη wieder. Der artikellose griechische Ausdruck wird natürlich mit „eines neuen Bundes“ übersetzt.
- source_word: μεσίτῃ
  choice: Mittler
  rationale: „Mittler“ ist im Deutschen die etablierte und präzise Bezeichnung für denjenigen, der zwischen den Bundesparteien vermittelt.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird nach üblicher deutscher Konvention wiedergegeben.
- source_word: αἵματι ῥαντισμοῦ
  choice: dem Blut der Besprengung
  rationale: Die Genitivverbindung bezeichnet Blut, das zur rituellen Besprengung gehört. Die relativ formale Wiedergabe bewahrt das kultische Bild und vermeidet die mögliche Verengung, als werde nur der Zustand des Blutes beschrieben.
- source_word: κρεῖττον
  choice: besser
  rationale: „Besser“ entspricht dem wiederkehrenden κρείττων-Sprachgebrauch des Hebräerbriefs und klingt zugleich natürlich.
- source_word: λαλοῦντι
  choice: das besser redet
  rationale: Der Relativsatz gibt das auf „Blut“ bezogene Partizip flüssig wieder und erhält dessen personifizierende Aussage.
- source_word: παρὰ τὸν Ἅβελ
  choice: als Abel
  rationale: Der griechische Text nennt ausdrücklich Abel, nicht „Abels Blut“. Die knappe, elliptische Form bleibt deshalb im Haupttext erhalten.
theological_decisions:
- issue: Bezug des Vergleichs mit Abel
  choice: „das besser redet als Abel“
  alternative: „das besser redet als Abels Blut“
  rationale: Der Zusammenhang spielt wahrscheinlich auf Abels Blut an, das vom Erdboden schreit (1. Mose 4,10), doch der griechische Wortlaut nennt nur Abel. Die Hauptfassung bewahrt diese Kürze und damit die Auslegungsspannung.
- issue: Bestimmtheit des neuen Bundes
  choice: „eines neuen Bundes“
  alternative: „des neuen Bundes“
  rationale: Wegen des fehlenden Artikels ist die unbestimmte Wiedergabe sprachlich naheliegend. Der bekannte verheißene neue Bund bleibt dabei sachlich im Blick, ohne die Grammatik stärker zu bestimmen als nötig.
translation_notes:
  register: Moderne, würdige Standardsprache. „Blut der Besprengung“ ist bewusst etwas formal, um das kultische Bild des griechischen Ausdrucks präzise zu erhalten; die Fußnote erläutert es. Alle Fußnotenmarker stehen unmittelbar bei ihrem jeweiligen Bezug.
