id: HEB.12.1
reference: Hebrews 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: de
  text: Darum lasst auch uns, die wir von einer so großen Wolke von Zeugen umgeben sind, jede Last und die Sünde, die uns so leicht verstrickt[a], ablegen und mit Ausdauer den vor uns liegenden Wettlauf laufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die uns eng anhaftet“ oder „die uns leicht umgarnt“. Das seltene griechische Adjektiv kann das Verstricken, Umgarnen oder enge Anhaften betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Darum
  rationale: Die Folgerungspartikel zieht aus dem vorangehenden Gedankengang, besonders aus Kapitel 11, die praktische Konsequenz. „Darum“ ist klar, natürlich und bewahrt die argumentative Kraft.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: eine so große Wolke von Zeugen
  rationale: Die bildhafte Rede von einer sehr großen Menge bleibt erhalten; „Wolke von Zeugen“ ist im Deutschen verständlich und gibt die Intensivierung durch τοσοῦτον wieder.
- source_word: περικείμενον ἡμῖν
  choice: von ... umgeben sind
  rationale: Die Formulierung gibt idiomatisch wieder, dass die Zeugen rings um „uns“ liegen beziehungsweise stehen, ohne das Bild unnötig auszudeuten.
- source_word: μαρτύρων
  choice: Zeugen
  rationale: „Zeugen“ wahrt die mögliche Bedeutung von Menschen, die durch ihr Leben und ihren Glauben Zeugnis geben. Die Übersetzung legt nicht fest, dass sie vor allem Zuschauer des Wettlaufs seien.
- source_word: ὄγκον ... πάντα
  choice: jede Last
  rationale: ὄγκος bezeichnet Gewicht, Masse oder hindernde Belastung. „Jede Last“ bewahrt das Bild dessen, was einen Läufer beschwert, und bleibt zugleich offen für die übertragene Anwendung.
- source_word: ἀποθέμενοι
  choice: ablegen
  rationale: Das Partizip bezeichnet ein entschlossenes Beseitigen, das den Lauf ermöglicht oder begleitet. Die deutsche Infinitivkonstruktion nach „wollen wir“ gibt die Aufforderung flüssig wieder.
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: die Sünde, die uns so leicht verstrickt
  rationale: Das seltene Adjektiv εὐπερίστατος ist in seiner genauen Bedeutung umstritten. „So leicht verstrickt“ passt zum Laufbild und benennt die hindernde Wirkung; andere mögliche Nuancen werden in der Fußnote bewahrt.
- source_word: δι’ ὑπομονῆς
  choice: mit Ausdauer
  rationale: ὑπομονή bezeichnet standhaftes Ausharren unter Belastung. „Mit Ausdauer“ ist im Bild eines Wettlaufs natürlich und prägnant.
- source_word: τρέχωμεν
  choice: wollen ... laufen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als gemeinsame Aufforderung wiedergegeben. „Wollen auch wir ... laufen“ klingt im Deutschen würdig und natürlich.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: den vor uns liegenden Wettlauf
  rationale: ἀγών kann Wettkampf, Kampf oder Ringen bedeuten; zusammen mit τρέχωμεν ist „Wettlauf“ kontextuell naheliegend. „Vor uns liegend“ bewahrt die Vorstellung einer vorgegebenen Strecke oder Aufgabe.
theological_decisions:
- issue: Bedeutung der „Zeugen“ im Verhältnis zu Hebräer 11
  choice: Menschen, die durch ihr Leben für den Glauben Zeugnis ablegen; das Bild des Umgebenseins unterstützt die Ermahnung
  alternative: Vor allem himmlische Zuschauer, die den Lauf der Glaubenden beobachten
  rationale: Der unmittelbare Zusammenhang verweist auf die Glaubenszeugen aus Kapitel 11. „Zeugen“ lässt sowohl ihre zeugnishafte Bedeutung als auch das räumliche Bild bestehen, ohne ausdrücklich zu behaupten, sie beobachteten die Glaubenden als Zuschauer.
- issue: Bezug von „die Sünde“
  choice: Sünde als konkret betrachtete, hindernde Macht beziehungsweise Wirklichkeit, ohne eine einzelne Sünde zu benennen
  alternative: Eine bestimmte, im Zusammenhang vorausgesetzte Einzelsünde, etwa Unglaube
  rationale: Der griechische Artikel wird mit „die Sünde“ gewahrt, doch der Vers benennt keine konkrete Einzelsünde. Die Übersetzung vermeidet daher eine konfessionelle oder dogmatische Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bewahrt die gemeinsame Ermahnung und das durchgehende Bild eines Wettlaufs. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
