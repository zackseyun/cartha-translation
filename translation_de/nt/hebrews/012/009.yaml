reference: Hebrews 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: de
  text: Außerdem hatten wir unsere leiblichen Väter als Erzieher[a] und achteten sie. Sollten wir uns da nicht noch viel mehr dem Vater der Geister[b] unterordnen und leben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die uns in Zucht nahmen“.'
    reason: lexical_alternative
  - marker: b
    text: „Der Vater der Geister“ kann hier besonders den Vater unserer Geister meinen, im Gegensatz zu unseren leiblichen Vätern; die griechische Formulierung ist jedoch weiter gefasst.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Außerdem
  rationale: Das Wort führt hier im Rahmen des Erst-recht-Schlusses einen weiteren Gesichtspunkt ein; „Außerdem“ gibt diesen argumentativen Anschluss natürlich wieder.
- source_word: τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας
  choice: unsere leiblichen Väter
  rationale: Die Formulierung bezeichnet die Väter unserer körperlichen Herkunft und hält den Gegensatz zum „Vater der Geister“ fest, ohne σάρξ als sündige Natur zu deuten.
- source_word: παιδευτὰς
  choice: als Erzieher
  rationale: „Erzieher“ umfasst hier Zucht, Unterweisung und korrigierende Erziehung und wahrt den Wortfeldbezug zur παιδεία im Kontext.
- source_word: ἐνετρεπόμεθα
  choice: achteten sie
  rationale: Das Verb bezeichnet hier respektvolle Scheu beziehungsweise Achtung gegenüber den erziehenden Vätern; „achteten sie“ ist klar und idiomatisch.
- source_word: οὐ πολὺ μᾶλλον
  choice: Sollten wir uns da nicht noch viel mehr
  rationale: Diese Wiedergabe erhält die rhetorische Frage und die verstärkende Erst-recht-Argumentation.
- source_word: ὑποταγησόμεθα
  choice: uns unterordnen
  rationale: Die mediale beziehungsweise passivische Zukunftsform bezeichnet im Zusammenhang das Sich-Unterstellen; die deutsche Formulierung ist natürlich und bewahrt den Gedanken der Unterordnung.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: dem Vater der Geister
  rationale: Die Genitivverbindung wird eng am Griechischen wiedergegeben und weder auf „unsere Geister“ noch allgemein auf Geistwesen eingeengt.
- source_word: ζήσομεν
  choice: und leben
  rationale: Die knappe Form wahrt den Zukunfts- beziehungsweise Folgesinn innerhalb der rhetorischen Frage.
theological_decisions:
- issue: Bedeutung von „Vater der Geister“
  choice: Die breite Genitivform „Vater der Geister“ bleibt im Haupttext stehen.
  alternative: „Vater unseres Geistes“ beziehungsweise „Vater der Geistwesen“
  rationale: Der unmittelbare Zusammenhang stellt menschliche Väter Gott gegenüber, legt aber nicht ausdrücklich fest, ob ausschließlich die menschlichen Geister oder Geistwesen im weiteren Sinn gemeint sind. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leibliche Väter“ bildet den Herkunftsaspekt von σάρξ verständlich ab; „Erzieher“ ist natürlicher als ein substantiviertes „Züchtiger“ und fügt sich in das Erziehungswortfeld des Abschnitts ein.
