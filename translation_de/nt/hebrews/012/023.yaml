id: HEB.12.23
reference: Hebrews 12:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: de
  text: und zur Versammlung der Erstgeborenen, die in den Himmeln[a] eingetragen sind, und zu Gott, dem Richter aller, und zu den Geistern vollendeter Gerechter
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Himmel“. Im Griechischen steht der Plural „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: Versammlung
  rationale: Bewahrt den Grundsinn einer versammelten Gemeinschaft und vermeidet es, in diesem Zusammenhang vorschnell institutionelle Vorstellungen mit „Kirche“ einzutragen.
- source_word: πρωτοτόκων
  choice: der Erstgeborenen
  rationale: Gibt den substantivisch gebrauchten Genitiv Plural wieder und lässt den Gedanken von Rang und Erbberechtigung bestehen, ohne „Söhne“ hinzuzufügen.
- source_word: ἀπογεγραμμένων
  choice: die … eingetragen sind
  rationale: 'Die Relativkonstruktion gibt das Perfekt Passiv natürlich wieder: Die Eintragung ist erfolgt und gilt fort. Zugleich bleibt das Bild eines Verzeichnisses erhalten.'
- source_word: ἐν οὐρανοῖς
  choice: in den Himmeln
  rationale: Bewahrt bewusst den griechischen Plural. Das idiomatischere „im Himmel“ wird in einer Fußnote genannt.
- source_word: κριτῇ θεῷ πάντων
  choice: Gott, dem Richter aller
  rationale: Stellt θεῷ und κριτῇ in natürlicher deutscher Apposition dar und führt die vom Kontext abhängige Zielangabe mit „zu“ weiter.
- source_word: πνεύμασι
  choice: Geistern
  rationale: Entspricht dem unmittelbaren Wortsinn, ohne durch eine erklärende Erweiterung eine detaillierte Lehre über ihren Zustand einzutragen.
- source_word: δικαίων
  choice: Gerechter
  rationale: Der substantivische Genitiv Plural wird knapp und geschlechtsübergreifend wiedergegeben.
- source_word: τετελειωμένων
  choice: vollendeter
  rationale: Bewahrt als attributives Partizip die in Hebräer wichtige Bedeutung von τελειόω als zum Ziel beziehungsweise zur Vollendung bringen; „vollendet“ klingt hier natürlicher als „vollkommen gemacht“.
theological_decisions:
- issue: Identität der „Erstgeborenen“
  choice: Kollektive Bezeichnung der zur Versammlung Gehörenden mit Erstgeburtsrang
  alternative: Christus als der Erstgeborene, dem die Versammlung gehört
  rationale: Der griechische Genitiv Plural πρωτοτόκων spricht deutlich für eine kollektive Bezeichnung. Die Übersetzung fügt dennoch keine Auslegung über Art oder Umfang dieses Ranges hinzu.
- issue: Bezug von „Geistern vollendeter Gerechter“
  choice: Geister gerechter Menschen, die vollendet worden sind
  alternative: Alle Gerechten unabhängig von ihrem leiblichen Zustand
  rationale: Die Formulierung wird eng am Griechischen belassen. Sie legt menschliche Gerechte nahe, vermeidet jedoch weitergehende Aussagen über den Zwischenzustand oder den genauen Zeitpunkt ihrer Vollendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder bleiben als Teil der fortlaufenden Aufzählung mit „und zu“ verbunden. Der griechische Plural „Himmel“ wird im Haupttext erhalten; die geläufigere deutsche Singularform steht in der Fußnote.
