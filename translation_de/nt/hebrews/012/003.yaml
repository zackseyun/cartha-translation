  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: de
  text: Denkt nämlich an den, der solchen Widerspruch von Sündern gegen sich erduldet hat[a], damit ihr nicht müde werdet und innerlich den Mut verliert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das SBLGNT liest im Griechischen die Mehrzahl: „gegen sie selbst“. Andere Handschriften lesen die Einzahl: „gegen ihn selbst“. Im Zusammenhang ist der gegen Jesus gerichtete Widerstand gemeint.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „damit ihr nicht müde werdet, indem ihr in euren Seelen erschlafft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: Denkt … an
  rationale: Der Aorist-Imperativ fordert zu bewusstem, gründlichem Bedenken auf. „Denkt an“ ist gegenwärtiges, natürliches Deutsch und bewahrt den auffordernden Charakter.
- source_word: γὰρ
  choice: nämlich
  rationale: Die Partikel begründet beziehungsweise erläutert die vorausgehende Aufforderung. „Nämlich“ gibt diesen Zusammenhang im Deutschen knapp wieder.
- source_word: τὸν τοιαύτην ὑπομεμενηκότα
  choice: den, der solchen … erduldet hat
  rationale: Die substantivierte Partizipialkonstruktion verweist im unmittelbaren Zusammenhang auf Jesus. Das Perfekt bezeichnet sein vollbrachtes Ertragen mit fortdauernder Bedeutung; „erduldet hat“ gibt dies würdig und natürlich wieder.
- source_word: ἀντιλογίαν
  choice: Widerspruch
  rationale: Das Wort kann Widerspruch, Widerstand oder Anfeindung bezeichnen. „Widerspruch“ bleibt nahe am griechischen Ausdruck und umfasst hier den feindseligen Widerstand gegen Jesus.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Das substantivierte Adjektiv bezeichnet Menschen als Sünder und bewahrt den moralischen Kontrast des Textes.
- source_word: κάμητε
  choice: müde werdet
  rationale: Das Verb bezeichnet Ermüden oder Ermatten. Die Wendung ist verständlich und passt zur Mahnung zum Ausharren.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: innerlich den Mut verliert
  rationale: Die griechische Wendung beschreibt ein Erschlaffen im inneren Menschen. Die deutsche Formulierung vermittelt den Sinn idiomatisch, während die wörtlichere Bildsprache in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezug von „den“
  choice: Das substantivierte „den“ bleibt stehen und verweist durch den Zusammenhang auf Jesus.
  alternative: Den Namen „Jesus“ im Vers ausdrücklich wiederholen.
  rationale: Hebräer 12,2 nennt Jesus unmittelbar zuvor. Die Übersetzung bewahrt die Ausdrucksweise des griechischen Textes, ohne den Bezug unnötig zu verdeutlichen.
- issue: Bezug des Reflexivpronomens in εἰς ἑαυτούς
  choice: Die Hauptübersetzung verwendet das mehrdeutige „gegen sich“ und erläutert die Textfrage in einer Fußnote.
  alternative: „gegen sie selbst“ entsprechend der Pluralform des SBLGNT oder „gegen ihn selbst“ entsprechend einer bedeutenden Lesart und dem Zusammenhang.
  rationale: Das SBLGNT liest die Pluralform „gegen sich selbst/gegen sie selbst“, während zahlreiche Handschriften den Singular „gegen sich selbst/gegen ihn selbst“ bieten. Der Zusammenhang spricht von gegen Jesus gerichtetem Widerstand. Die deutsche Formulierung bewahrt diese Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denkt … an“ ist zugänglich und eindringlich; „erduldet“ wahrt den feierlichen Ton. Die Hauptübersetzung bleibt flüssig, während die Fußnoten die textkritische Unsicherheit und die anthropologische Bildsprache von ψυχή offenlegen.
