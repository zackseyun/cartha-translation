review_pass:
  verdict: revise
  source_fidelity: Die Hauptübersetzung löst das im SBLGNT stehende εἰς ἑαυτούς durch „gegen sich“ faktisch zugunsten der Lesart „gegen ihn selbst“ auf. Da die vorgegebene Ausgangsausgabe die Pluralform hat, muss die Hauptübersetzung diese zunächst als „gegen sie selbst“ wiedergeben; die singuläre, kontextuell glattere Lesart gehört in die Fußnote.
  naturalness: Der Satz ist insgesamt würdig und verständlich. Allerdings ist „ihr ... den Mut verliert“ ein Kongruenzfehler. Eine Formulierung mit „in eurem Inneren erlahmt“ gibt den Schluss idiomatisch wieder und wahrt die Bildsprache von ψυχαῖς.
  terminology: „Widerspruch“, „Sünder“ und „erduldet hat“ sind im Register angemessen. „Widerspruch“ kann den feindseligen Sinn von ἀντιλογίαν tragen. Die textkritische Fußnote muss die Hauptlesart und die abweichende Singularlesart sauber voneinander unterscheiden.
  issues:
  - severity: high
    issue: Die Hauptübersetzung gibt den SBLGNT-Plural ἑαυτούς nicht erkennbar wieder.
    rationale: „Gegen sich“ wird im deutschen Relativsatz regulär auf „den“ bezogen und vermittelt damit „gegen ihn selbst“. Das folgt einer abweichenden Singularlesart statt dem angegebenen SBLGNT-Text. Die schwierige Plurallesart darf nicht stillschweigend geglättet werden.
  - severity: medium
    issue: Kongruenzfehler in „damit ihr nicht müde werdet und innerlich den Mut verliert“.
    rationale: Zu „ihr“ gehört „verliert“ nicht; außerdem verbindet die neue Formulierung das innere Ermatten enger mit ταῖς ψυχαῖς ὑμῶν.
  - severity: low
    issue: „Denkt an“ ist etwas schwächer als ἀναλογίζομαι.
    rationale: „Denkt gründlich über ... nach“ vermittelt die geforderte bedachte Erwägung präziser und bleibt modernes Standarddeutsch.
  revised_text: Denkt nämlich gründlich über den nach, der solchen Widerspruch von Sündern gegen sie selbst erduldet hat[a], damit ihr nicht ermüdet und in eurem Inneren erlahmt.[b]
  revised_footnotes:
  - marker: a
    text: 'Das SBLGNT liest im Griechischen die Mehrzahl: „gegen sie selbst“. Andere Handschriften lesen die Einzahl: „gegen ihn selbst“. Die Plurallesart ist im Zusammenhang schwierig; die Singularlesart versteht den Widerstand als gegen Jesus gerichtet.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „damit ihr nicht müde werdet, indem ihr in euren Seelen erschlafft“.'
    reason: lexical_alternative
  revision_rationale: Die Revision folgt in der Hauptübersetzung konsequent der ausdrücklich vorgegebenen SBLGNT-Lesart ἑαυτούς, ohne die textkritisch umstrittene und kontextuell naheliegendere Singularlesart in den Text einzutragen. Die Fußnote dokumentiert die Alternative und ihre Auswirkung auf den Sinn. Zugleich werden der Kongruenzfehler korrigiert und die Aufforderung von Ἀναλογίσασθε genauer wiedergegeben.
