source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: de
  text: Denn ihr wisst ja, dass er auch später, als er den Segen erben wollte, abgewiesen wurde; denn er fand keinen Raum zur Umkehr[a], obwohl er unter Tränen danach suchte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „keinen Ort für Umkehr“. Gemeint sein kann, dass er keine Möglichkeit fand, das Ergebnis rückgängig zu machen, oder dass er bei Isaak keine Sinnesänderung erwirken konnte.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Pronomen kann sich auf „den Segen“ oder, weniger wahrscheinlich, auf „Umkehr“ beziehen; der Bezug bleibt im Griechischen mehrdeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: ihr wisst
  rationale: Das Perfekt οἶδα hat präsentische Bedeutung; die Formulierung spricht die vorhandene Kenntnis der Adressaten unmittelbar an.
- source_word: μετέπειτα
  choice: später
  rationale: Das Zeitadverb bezeichnet einen nachfolgenden Zeitpunkt; „später“ ist knapp und natürlich.
- source_word: θέλων
  choice: als er … wollte
  rationale: Das Partizip wird als temporaler Nebensatz wiedergegeben und bewahrt den Aspekt des Wollens.
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: den Segen erben
  rationale: Die Formulierung erhält sowohl das Erbmotiv von κληρονομέω als auch den bestimmten, aus der Esau-Erzählung bekannten Segen.
- source_word: ἀπεδοκιμάσθη
  choice: wurde er abgewiesen
  rationale: Die passive Form bezeichnet Ablehnung beziehungsweise Zurückweisung, ohne einen technischen heilsgeschichtlichen Sinn einzutragen.
- source_word: μετανοίας … τόπον
  choice: Raum zur Umkehr
  rationale: 'Die relativ formnahe deutsche Wendung bewahrt die Deutungsoffenheit: Gemeint sein kann fehlender Spielraum zur Umkehr oder zur Änderung des bereits eingetretenen Ergebnisses.'
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας
  choice: obwohl er unter Tränen danach suchte
  rationale: „Obwohl“ gibt die konzessive Beziehung wieder; „unter Tränen“ drückt die eindringliche Suche aus.
- source_word: αὐτήν
  choice: danach
  rationale: Da „Segen“ im Deutschen männlich und „Umkehr“ weiblich ist, würde ein Personalpronomen die im Griechischen mögliche Mehrdeutigkeit unbeabsichtigt auflösen. Das pronominale Adverb „danach“ lässt den Bezug offen.
theological_decisions:
- issue: Bedeutung von μετανοίας τόπον
  choice: „keinen Raum zur Umkehr“ bleibt im Haupttext deutungsoffen.
  alternative: „keine Gelegenheit zur Reue“ oder „keine Möglichkeit, Isaaks Sinn zu ändern“
  rationale: Die Wendung kann sich auf Esaus eigene Umkehr, auf eine nicht mehr mögliche Änderung des Ergebnisses oder auf eine Sinnesänderung Isaaks beziehen. Der Haupttext legt keine dieser theologischen Deutungen fest.
- issue: Bezugswort von αὐτήν
  choice: „danach“ bewahrt einen offenen Rückbezug.
  alternative: Bezug ausschließlich auf den Segen oder ausschließlich auf die Umkehr beziehungsweise den dafür nötigen Raum
  rationale: Im Griechischen kommen aufgrund des femininen Genus sowohl εὐλογία („Segen“) als auch μετάνοια („Umkehr“) als Bezug infrage. Wegen der abweichenden deutschen Genera wird die Mehrdeutigkeit durch ein neutrales Pronominaladverb erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Raum zur Umkehr“ ist bewusst etwas formnäher als „Gelegenheit zur Reue“, damit die sachliche und theologische Mehrdeutigkeit des griechischen Ausdrucks erhalten bleibt. Der Doppelpunkt nach „ihr wisst“ macht den langen Satz gut zugänglich.
