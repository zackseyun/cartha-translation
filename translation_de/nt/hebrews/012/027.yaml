id: HEB.12.27
reference: Hebrews 12:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: de
  text: Die Worte »Noch einmal« zeigen an, dass das, was erschüttert wird, als etwas Geschaffenes beseitigt wird,[a] damit das bleibt, was nicht erschüttert wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »als etwas, das gemacht worden ist«; auch: »weil es geschaffen ist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »das, was nicht erschüttert werden kann« oder »das Unerschütterliche«.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Die Worte »Noch einmal«
  rationale: Der substantivierende Artikel macht den angeführten Ausdruck selbst zum Gegenstand der Erklärung. »Die Worte« ist im Deutschen natürlich und kennzeichnet das Zitat klar; δέ hat hier nur eine schwache weiterführende Funktion und muss nicht eigens wiedergegeben werden.
- source_word: δηλοῖ
  choice: zeigen an
  rationale: Die Wendung gibt die erklärende Schlussfolgerung des Verfassers klar und in gegenwärtigem Standarddeutsch wieder.
- source_word: τῶν σαλευομένων
  choice: das, was erschüttert wird
  rationale: Die substantivierte passive Präsenspartizipialform wird als gegenwärtiger beziehungsweise charakteristischer Vorgang wiedergegeben und bleibt parallel zur Schlusswendung.
- source_word: μετάθεσιν
  choice: beseitigt werden soll
  rationale: Im Zusammenhang bezeichnet μετάθεσις nicht bloß eine Veränderung, sondern die Entfernung des Erschütterbaren. Die verbale Form ergibt einen natürlichen deutschen Satz.
- source_word: ὡς πεποιημένων
  choice: weil es zum Geschaffenen gehört
  rationale: 'Die Formulierung bringt den begründenden beziehungsweise einordnenden Sinn von ὡς mit dem Perfektpassiv von ποιέω idiomatisch zum Ausdruck: Das Erschütterte gehört zur Ordnung dessen, was gemacht worden ist. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.'
- source_word: ἵνα μείνῃ
  choice: damit ... bleibt
  rationale: »Damit« gibt Ziel beziehungsweise Ergebnis der Beseitigung wieder; deutsches Präsens ist nach dieser Konjunktion natürlich.
- source_word: τὰ μὴ σαλευόμενα
  choice: das, was nicht erschüttert wird
  rationale: Die negierte Partizipialform wird formal bewahrt, ohne sie vorschnell als ausdrückliche Unmöglichkeit des Erschüttertwerdens auszulegen.
theological_decisions:
- issue: Ob τὰ μὴ σαλευόμενα als Unerschütterlichkeit oder formal als Nicht-Erschüttertwerden wiederzugeben ist
  choice: das, was nicht erschüttert wird
  alternative: das, was nicht erschüttert werden kann / das Unerschütterliche
  rationale: Der griechische Text stellt die Partizipien »erschüttert werdend« und »nicht erschüttert werdend« einander gegenüber. Die gewählte Fassung erhält diese Spannung und greift der ausdrücklichen Rede vom unerschütterlichen Reich im folgenden Vers nicht vor.
- issue: Wie ὡς πεποιημένων mit der Beseitigung des Erschütterten zu verbinden ist
  choice: weil es zum Geschaffenen gehört
  alternative: als etwas, das gemacht worden ist
  rationale: Die Hauptfassung macht die in ὡς liegende Einordnung beziehungsweise Begründung verständlich, ohne festzulegen, dass alles Geschaffene unterschiedslos beseitigt werde. Die formalere Wiedergabe steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivischen Singularformen »das, was ...« bilden die griechischen Neutra im Deutschen natürlicher ab als schwerfällige Pluralformulierungen. Die Fußnotenmarker [a] und [b] stehen unmittelbar bei den jeweils erläuterten Wendungen.
