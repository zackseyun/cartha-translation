  rationale: Die Revision entfernt das nicht im Ausgangstext enthaltene »soll« und gibt ὡς πεποιημένων mit einer natürlichen, nicht übermäßig kausal festgelegten deutschen Einordnung wieder. Die vorhandenen Fußnotenanker bleiben unmittelbar an den erläuterten Wendungen; Fußnote a wurde an die revidierte Hauptfassung angepasst.
