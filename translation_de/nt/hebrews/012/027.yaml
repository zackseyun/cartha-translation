review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Kontrast zwischen dem Erschütterten und dem nicht Erschütterten sind zutreffend wiedergegeben. »werden soll« fügt jedoch gegenüber μετάθεσιν eine deontische bzw. zweckhafte Nuance hinzu, die der griechische Text nicht ausdrückt. Die Einordnung durch ὡς πεποιημένων sollte zudem ohne die stärker kausale Zuspitzung »weil« formuliert werden.
  naturalness: Die Fassung ist insgesamt modernes, würdiges Standarddeutsch. »als etwas Geschaffenes« ist hier sowohl idiomatischer als auch näher an der griechischen prädikativen Einordnung als »weil es zum Geschaffenen gehört«.
  terminology: »erschüttert wird« und »nicht erschüttert wird« bewahren angemessen die parallelen passiven Präsenspartizipien. »Geschaffenes« gibt πεποιημένων sachgerecht wieder, ohne zu behaupten, alles Geschaffene werde unterschiedslos beseitigt.
  issues:
  - severity: medium
    issue: »beseitigt werden soll«
    rationale: Das Modalverb »soll« ist im griechischen Text nicht vorhanden. μετάθεσιν bezeichnet die Beseitigung/Entfernung selbst; der ἵνα-Satz gibt deren Ziel bzw. Ergebnis an.
  - severity: low
    issue: »weil es zum Geschaffenen gehört«
    rationale: Diese Formulierung macht ὡς ausdrücklich kausal und ist zugleich weiter vom Wortlaut entfernt. »als etwas Geschaffenes« erhält die einordnende Funktion von ὡς und die Bezugnahme auf das Gemachtsein.
