id: HEB.12.13
reference: Hebrews 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: de
  text: und schafft gerade Wege für eure Füße,[a] damit das Lahme nicht vom Weg abkommt,[b] sondern vielmehr geheilt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung erinnert an Sprüche 4,26 und führt das Bild eines geordneten, zielgerichteten Gehens weiter.
    reason: cross_reference
  - marker: b
    text: 'Oder: »damit das Lahme nicht ausgerenkt wird«. Das griechische Verb kann im Rahmen des Körperbildes auch eine medizinische Bedeutung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: Wege
  rationale: Das Wort bezeichnet eine Spur oder Bahn. »Wege« klingt im modernen Deutschen natürlich und bewahrt zugleich das Bild vom Lebensweg.
- source_word: ὀρθὰς
  choice: gerade
  rationale: Das Adjektiv beschreibt hier einen geraden, richtig ausgerichteten Weg und nimmt wahrscheinlich die Bildsprache aus Sprüche 4,26 auf.
- source_word: ποιεῖτε
  choice: schafft
  rationale: Der Präsensimperativ fordert zu fortdauerndem Handeln auf. »Schafft« gibt ποιεῖτε direkt wieder und passt idiomatisch zu Wegen, die für die Füße bereitet werden.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: für eure Füße
  rationale: 'Der Dativ bezeichnet am ehesten Bezug oder Nutzen: Die Wege sollen für die eigenen Füße geschaffen werden.'
- source_word: τὸ χωλὸν
  choice: das Lahme
  rationale: Das substantivierte Neutrum bleibt bewusst offen und kann körperliche Schwäche, einen schwachen Teil oder gefährdete Menschen im übertragenen Sinn bezeichnen.
- source_word: ἐκτραπῇ
  choice: vom Weg abkommt
  rationale: Die Form kann ein Abwenden oder Abkommen bezeichnen; im körperlichen Zusammenhang ist auch die medizinische Bedeutung »ausgerenkt werden« möglich. Die Hauptfassung bewahrt das Wegbild, die Alternative steht in der Fußnote.
- source_word: ἰαθῇ
  choice: geheilt wird
  rationale: ἰάομαι bedeutet gewöhnlich »heilen«. Die Wiedergabe erhält das körperliche Bild und das Ziel der Wiederherstellung.
- source_word: μᾶλλον
  choice: vielmehr
  rationale: 'Das Adverb stellt dem negativen möglichen Ausgang den erwünschten Ausgang gegenüber: nicht abkommen, sondern vielmehr geheilt werden.'
theological_decisions:
- issue: Körperliche oder übertragene Bedeutung der Bildsprache
  choice: Die körperliche Bildsprache bleibt im Haupttext stehen, ohne festzulegen, ob »das Lahme« wörtlich körperliche Schwäche, geistliche Schwäche oder allgemein gefährdete Menschen bezeichnet.
  alternative: »Das Lahme« ausdrücklich als geistlich schwache Gläubige oder als verletztes Körperglied deuten.
  rationale: Der griechische Text verbindet Mahnung und Körperbild, ohne den Bezug eindeutig aufzulösen. Die offene Formulierung bewahrt diese Spannung und vermeidet eine konfessionelle oder pastorale Überdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Das Lahme« bewahrt das substantivierte Neutrum und dessen inhaltliche Offenheit; »vom Weg abkommt« führt das Wegbild natürlich fort, während die medizinische Bedeutungsnuance in der Fußnote erhalten bleibt.
