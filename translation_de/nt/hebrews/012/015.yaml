source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: de
  text: Achtet sorgfältig darauf, dass niemand die Gnade Gottes verfehlt[a], dass keine Wurzel der Bitterkeit aufsprießt, Unruhe stiftet und dadurch viele verunreinigt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinter der Gnade Gottes zurückbleibt“ beziehungsweise „die Gnade Gottes nicht erlangt“. Der griechische Ausdruck kann sowohl bezeichnen, dass jemand etwas Angebotetes nicht erreicht, als auch, dass er dahinter zurückbleibt.'
    reason: lexical_alternative
  - marker: b
    text: Die „Wurzel der Bitterkeit“ spielt wahrscheinlich auf 5. Mose 29,17 an (in manchen Zählungen 29,18). Dort steht eine giftige Wurzel für Untreue gegenüber dem Bund, die sich in der Gemeinschaft ausbreitet.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Achtet sorgfältig darauf
  rationale: Das präsentische Partizip bezeichnet wachsame, gemeinschaftliche Fürsorge. Die deutsche Formulierung gibt den fortdauernden Auftrag natürlich wieder, ohne einen institutionellen Aufseherbegriff einzutragen.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: dass niemand die Gnade Gottes verfehlt
  rationale: ὑστερέω mit ἀπό kann ausdrücken, dass jemand etwas nicht erreicht oder dahinter zurückbleibt. „verfehlt“ ist im Deutschen verständlich, wahrt den ernsten Warncharakter und legt keine bestimmte Lehre über Abfall oder Heilssicherheit fest.
- source_word: χάριτος
  choice: Gnade
  rationale: „Gnade“ ist hier sowohl lexikalisch angemessen als auch im biblisch-theologischen Sprachgebrauch verankert; „Gunst“ wäre möglich, würde aber die Resonanz des Ausdrucks abschwächen.
- source_word: ῥίζα πικρίας
  choice: Wurzel der Bitterkeit
  rationale: Die nahe Wiedergabe der Genitivverbindung bewahrt das Bild und den wahrscheinlichen Anklang an 5. Mose 29,18.
- source_word: ἄνω φύουσα
  choice: aufwächst
  rationale: Die Wendung schildert bildhaft eine Wurzel, die nach oben treibt und sichtbar wirksam wird. „aufwächst“ ist knapp und natürlich.
- source_word: ἐνοχλῇ
  choice: Unheil anrichtet
  rationale: Das Verb bezeichnet Stören, Beunruhigen oder Verursachen von Schwierigkeiten. „Unheil anrichtet“ bringt die ernste gemeinschaftsschädigende Wirkung in idiomatischem Deutsch zum Ausdruck.
- source_word: δι’ αὐτῆς
  choice: durch sie
  rationale: Das feminine Pronomen verweist am natürlichsten auf die Wurzel; διά mit Genitiv bezeichnet hier das Mittel beziehungsweise die Ursache.
- source_word: μιανθῶσιν πολλοί
  choice: viele verunreinigt werden
  rationale: μιαίνω trägt eine starke moralische oder kultische Bedeutung. „verunreinigt“ bewahrt diesen biblischen Ernst besser als eine bloß soziale Umschreibung.
theological_decisions:
- issue: Ob die Warnung den Verlust bereits empfangener Gnade, das Nichterlangen der Gnade oder den Ausschluss aus der Gemeinschaft bezeichnet
  choice: die Gnade Gottes verfehlt
  alternative: hinter der Gnade Gottes zurückbleibt; die Gnade Gottes nicht erlangt
  rationale: Der griechische Ausdruck lässt mehr als eine Nuance zu. Die gewählte Formulierung bewahrt die Warnung, ohne spätere konfessionelle Fragen zu Abfall, Beharren oder Heilssicherheit zu entscheiden.
- issue: Ob μιαίνω lediglich als soziale Störung abgeschwächt werden sollte
  choice: verunreinigt werden
  alternative: verdorben werden; angesteckt werden
  rationale: Das Verb besitzt eine stärkere moralische beziehungsweise kultische Färbung als eine bloße Beeinträchtigung. Die Übersetzung erhält diese theologische und gemeinschaftliche Schwere.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur hält die beiden parallelen Warnungen zusammen; traditionelle Begriffe wie „Gnade“ und „verunreinigt“ bleiben erhalten, während unnötig altertümliche Formen vermieden werden.
