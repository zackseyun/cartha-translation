reference: Hebrews 12:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: de
  text: Niemand soll sexuell unmoralisch oder gottlos[a] wie Esau sein, der für eine einzige Mahlzeit sein Erstgeburtsrecht verkaufte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „gottlos“ übersetzte griechische Wort kann auch „unheilig“, „profan“ oder „jemand, der Heiliges missachtet“ bedeuten.
    reason: βέβηλος bezeichnet nicht notwendig Gottesleugnung, sondern kann besonders die Missachtung dessen meinen, was heilig ist.
lexical_decisions:
- source_word: πόρνος
  choice: sexuell unmoralisch
  rationale: Bezeichnet hier eine Person, die sich sexueller Unmoral schuldig macht; die adjektivische Wiedergabe ist im Deutschen natürlich und wahrt den ethischen Gehalt.
- source_word: βέβηλος
  choice: gottlos
  rationale: Das Wort bezeichnet jemanden, der Heiliges missachtet bzw. weltlich-profan eingestellt ist. „Gottlos“ ist verständlich und nimmt die durch Esaus Geringschätzung des Erstgeburtsrechts veranschaulichte religiöse Missachtung auf, ohne sie weiter zu spezifizieren.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: für eine einzige Mahlzeit
  rationale: Gibt den Tauschwert und die betonte Einmaligkeit idiomatisch wieder; βρῶσις kann Essen bzw. Mahlzeit bezeichnen.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: sein Erstgeburtsrecht
  rationale: Der griechische Plural bezeichnet als feste Größe die mit dem Erstgeborenenstatus verbundenen Rechte; der deutsche Singular ist die übliche sachgemäße Entsprechung.
- source_word: ἀπέδετο
  choice: verkaufte
  rationale: Der Aorist von ἀποδίδομαι bezeichnet hier das Veräußern bzw. Verkaufen und entspricht dem Vorgang in Genesis 25.
theological_decisions:
- issue: Bezug von „wie Esau“
  choice: Die deutsche Satzstellung lässt Esau unmittelbar als Beispiel für „gottlos“ erscheinen, schließt aber einen Bezug auf die gesamte Warnung nicht ausdrücklich aus.
  alternative: „Niemand soll sexuell unmoralisch sein; auch soll niemand Heiliges missachten wie Esau …“
  rationale: Der griechische Text setzt πόρνος und βέβηλος parallel unter μή τις und fügt ὡς Ἠσαῦ ohne explizite syntaktische Auflösung an. Die kompakte Wiedergabe bewahrt diese Spannung besser als eine erklärende Aufteilung.
- issue: Charakterisierung Esaus durch βέβηλος
  choice: gottlos
  alternative: unheilig; profan; einer, der Heiliges missachtet
  rationale: „Gottlos“ folgt der geprüften Konsultationsschicht und ist allgemein verständlich. Da βέβηλος nicht zwingend theoretischen Atheismus meint, erläutert die Fußnote die konkrete Nuance der Missachtung des Heiligen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die negative Aufforderung μή τις wird als eigenständiger deutscher Warnsatz formuliert. „Sexuell unmoralisch“ ist klarer und gegenwärtiger als substantivische oder altertümliche Alternativen; „Erstgeburtsrecht“ ist der etablierte biblische Sachbegriff.
