id: HEB.12.11
reference: Hebrews 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: de
  text: Jede Erziehung aber scheint für den Augenblick keine Freude, sondern Kummer zu sein; später jedoch bringt sie denen, die durch sie trainiert worden sind, eine friedvolle Frucht der Gerechtigkeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl persönliche Rechtschaffenheit und rechtes Handeln als auch Gerechtigkeit im rechtlichen Sinn bezeichnen; hier steht wahrscheinlich die durch Gottes Erziehung hervorgebrachte aufrichtige Lebensführung im Vordergrund.
    reason: lexikalische Bedeutungsbreite
lexical_decisions:
- source_word: παιδεία
  choice: Erziehung
  rationale: Das Wort umfasst im Zusammenhang die väterliche, formende Erziehung Gottes einschließlich Unterweisung und Zurechtweisung. „Erziehung“ bewahrt diese Breite besser als das heute oft strafend oder altertümlich klingende „Züchtigung“.
- source_word: πρὸς μὲν τὸ παρόν
  choice: für den Augenblick
  rationale: Die Wendung bezeichnet die gegenwärtige, vorübergehende Erfahrung im Gegensatz zum späteren Ergebnis.
- source_word: οὐ δοκεῖ
  choice: scheint
  rationale: Die Formulierung gibt die menschliche Wahrnehmung wieder und stellt keine uneingeschränkte Wesensaussage auf.
- source_word: χαρᾶς … ἀλλὰ λύπης
  choice: keine Freude, sondern Kummer
  rationale: Die Substantive des griechischen Textes bleiben erhalten. „Kummer“ gibt λύπη wieder, ohne den Sinn auf körperlichen Schmerz zu verengen.
- source_word: καρπὸν εἰρηνικόν
  choice: eine friedvolle Frucht
  rationale: Das Adjektiv beschreibt die Frucht als von Frieden geprägt; „friedvoll“ bewahrt diese direkte Zuordnung.
- source_word: γεγυμνασμένοις
  choice: die … trainiert worden sind
  rationale: 'Die Wiedergabe nimmt das Bild wiederholten Trainings auf und wahrt das Perfekt Passiv: Die Betroffenen sind durch diese Erziehung nachhaltig geformt worden.'
- source_word: ἀποδίδωσιν
  choice: bringt … eine Frucht
  rationale: Die deutsche Verbindung „Frucht bringen“ entspricht dem Ergebnisgedanken und klingt natürlich.
- source_word: δικαιοσύνης
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die unmittelbare deutsche Entsprechung und kann hier die durch Gottes Erziehung hervorgebrachte Rechtschaffenheit beziehungsweise das rechte Handeln bezeichnen.
theological_decisions:
- issue: Bedeutung von παιδεία im Handeln Gottes an den Glaubenden
  choice: formende Erziehung einschließlich Zurechtweisung
  alternative: bloße Bestrafung oder reine Unterweisung
  rationale: Hebräer 12,5–10 stellt Gottes Handeln als väterliche Erziehung dar, die auf Heiligkeit und Reife zielt. Die Übersetzung legt es weder auf Vergeltungsstrafe noch auf bloße Wissensvermittlung fest.
- issue: Bedeutungsumfang von δικαιοσύνης
  choice: Gerechtigkeit im Sinn einer von der Erziehung hervorgebrachten rechten Haltung und Lebensführung
  alternative: Gerechtigkeit vorwiegend im rechtlichen oder gesellschaftlichen Sinn
  rationale: Der Zusammenhang legt eine sittliche Frucht nahe, doch der weitere Bedeutungsumfang des griechischen Wortes wird nicht ausgeschlossen und in der Fußnote kenntlich gemacht.
- issue: Beziehung zwischen „Frucht“ und „Gerechtigkeit“
  choice: „Frucht der Gerechtigkeit“ als bewusst knappe Genitivverbindung
  alternative: „Frucht, die in Gerechtigkeit besteht“ oder „Frucht, die Gerechtigkeit hervorbringt“
  rationale: Der griechische Genitiv lässt die genaue Beziehung offen. Die Übersetzung bewahrt diese Spannung, statt sie als Gleichsetzung oder Wirkung eindeutig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erziehung“ vermeidet das altertümlich und stark strafend klingende „Züchtigung“. Die substantivische Gegenüberstellung „Freude … Kummer“ und die Genitivformel „Frucht der Gerechtigkeit“ halten sich eng an den griechischen Ausdruck; „trainiert“ macht das im Verb enthaltene Übungsbild für heutige Leser sichtbar.
