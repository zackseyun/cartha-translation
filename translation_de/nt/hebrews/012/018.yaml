id: HEB.12.18
reference: Hebrews 12:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: de
  text: Denn ihr seid nicht zu etwas gekommen, das man berühren kann,[a] und zu einem lodernden Feuer und zu Dunkelheit und Finsternis und Sturm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Berg, den man berühren kann«. Aus dem Zusammenhang ist der Sinai gemeint; das Wort »Berg« steht jedoch im griechischen Text dieses Verses nicht ausdrücklich.'
    reason: alternative_reading
  - marker: b
    text: Die Verneinung am Satzanfang gilt für die gesamte mit »und« verbundene Aufzählung.
    reason: clarification
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Denn ... nicht
  rationale: γάρ verbindet den Satz begründend mit dem vorausgehenden Gedankengang; οὐ verneint das Verb.
- source_word: προσεληλύθατε
  choice: ihr seid ... gekommen
  rationale: Das Perfekt bezeichnet ein erfolgtes Herantreten mit fortbestehendem Ergebnis. Die natürliche deutsche Wendung bewahrt zugleich das Motiv des Zugangs.
- source_word: ψηλαφωμένῳ
  choice: zu etwas, das man berühren kann
  rationale: Das substantivisch verstandene Partizip bezeichnet etwas Berührbares oder Greifbares. Da im griechischen Vers kein Substantiv wie »Berg« steht, bleibt der Bezug im Haupttext offen.
- source_word: κεκαυμένῳ πυρί
  choice: zu einem lodernden Feuer
  rationale: Das Partizip beschreibt das Feuer als entzündet und brennend; »lodernd« gibt diesen anhaltenden, eindrücklichen Zustand idiomatisch wieder.
- source_word: γνόφῳ
  choice: Dunkelheit
  rationale: γνόφος bezeichnet dichte Dunkelheit. Die Wiedergabe wird von ζόφος unterschieden, ohne die semantische Nähe aufzuheben.
- source_word: ζόφῳ
  choice: Finsternis
  rationale: ζόφος bezeichnet düstere, tiefe Dunkelheit. »Finsternis« bewahrt den bedrohlichen Ton und die rhetorische Häufung.
- source_word: θυέλλῃ
  choice: Sturm
  rationale: θύελλα bezeichnet einen heftigen Sturm; »Sturm« ist klar, gegenwärtig und würdevoll.
theological_decisions:
- issue: Ob »Berg« als Gegenstand des Herantretens ergänzt werden soll
  choice: Im Haupttext kein »Berg« ergänzen, sondern den griechisch nicht näher bezeichneten berührbaren Gegenstand bewahren.
  alternative: Denn ihr seid nicht zu einem Berg gekommen, den man berühren kann ...
  rationale: Der Zusammenhang weist auf den Sinai, doch ὄρος (»Berg«) steht in diesem Vers nicht. Die offene Formulierung folgt dem griechischen Wortlaut; die kontextuelle Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die wiederholten »und« bilden die griechische καί-Reihe ab; die im Deutschen fortwirkende Verneinung wird durch Fußnote [b] verdeutlicht.
