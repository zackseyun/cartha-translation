source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: de
  text: 'Und ihr habt die Ermahnung vergessen, die euch als Söhne[a] anspricht: »Mein Sohn, achte die Erziehung des Herrn nicht gering[b][c] und verliere nicht den Mut, wenn du von ihm zurechtgewiesen wirst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »als Söhnen«. Die Sohn-Sprache greift die Formulierung aus dem Buch der Sprüche und den Gedankengang dieses Abschnitts auf; hier ist die gesamte angesprochene Gemeinschaft einbezogen.
    reason: lexical_alternative
  - marker: b
    text: »Erziehung« kann hier auch formende Unterweisung, Einübung oder korrigierende Zucht bezeichnen, nicht nur Bestrafung.
    reason: lexical_alternative
  - marker: c
    text: Zitat aus Sprüche 3,11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: ihr habt … vergessen
  rationale: Das Perfekt bezeichnet einen aus dem Vergessen hervorgegangenen gegenwärtigen Zustand; die deutsche Perfektform gibt zugleich den vorwurfsvollen Ton natürlich wieder.
- source_word: παρακλήσεως
  choice: die Ermahnung
  rationale: παράκλησις kann Ermutigung, Zuspruch oder Ermahnung bedeuten. Da hier eine warnende Weisung aus den Sprüchen folgt, trifft »Ermahnung« den unmittelbaren Sinn, ohne den ermutigenden Zweck auszuschließen.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: die zu euch als Söhnen spricht
  rationale: Die Formulierung bewahrt das direkte Reden der Schrift zu den Angesprochenen und gibt das ausdrücklich männliche Sohn-Motiv des griechischen Textes wieder.
- source_word: ὀλιγώρει
  choice: achte … nicht gering
  rationale: Das Verb bezeichnet das Geringschätzen oder Nicht-ernst-Nehmen. Die Wendung ist im Deutschen klar und vermeidet die stärkere Bedeutung von »verachten«.
- source_word: παιδείας
  choice: Erziehung
  rationale: παιδεία umfasst formende Unterweisung, Einübung und korrigierende Zucht. »Erziehung« hält dieses Bedeutungsspektrum offen und passt zum anschließenden Vater-Sohn-Vergleich.
- source_word: ἐκλύου
  choice: verliere nicht den Mut
  rationale: Gemeint ist ein inneres Ermatten oder Aufgeben unter der Zurechtweisung; die gewählte Wendung ist gegenwärtig und idiomatisch.
- source_word: ἐλεγχόμενος
  choice: wenn du … zurechtgewiesen wirst
  rationale: ἐλέγχω kann aufdecken, tadeln oder zurechtweisen bedeuten. »Zurechtweisen« passt zum erzieherischen Zusammenhang, ohne die Aussage unnötig zu verschärfen.
theological_decisions:
- issue: Geschlechtsspezifische Kindschaftssprache
  choice: »als Söhnen« im Haupttext
  alternative: »als Kindern«
  rationale: Der griechische Text verwendet ausdrücklich υἱοί und nimmt mit dem Zitat die Sohn-Sprache aus Sprüche 3 auf. Die Form bleibt erhalten; die Fußnote erläutert, dass die gesamte angesprochene Gemeinschaft einbezogen ist.
- issue: Bedeutung von παιδεία im Verhältnis Gottes zu seinem Volk
  choice: »Erziehung«
  alternative: »Züchtigung«, »Unterweisung« oder »Disziplin«
  rationale: Der Begriff umfasst sowohl formende Anleitung als auch schmerzhafte Korrektur. »Erziehung« bewahrt diese Spannung, statt ihn auf Strafe oder bloße Belehrung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der argumentativen Form des griechischen Textes, während »spricht«, »achte … nicht gering« und »verliere nicht den Mut« natürlich und allgemein verständlich formuliert sind.
