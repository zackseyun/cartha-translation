  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: de
  text: Denn wen der Herr liebt, den erzieht er, und er geißelt[a] jeden Sohn[b], den er annimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlägt mit der Geißel“. Das griechische Verb ist sehr kräftig und beschreibt eine harte Form der Züchtigung.'
    reason: lexical_alternative
  - marker: b
    text: „Jeden Sohn“ entspricht dem griechischen Wortlaut. Im Zusammenhang ist die Formulierung repräsentativ gemeint und bezieht sich auf alle, die Gott als seine Kinder anerkennt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: wen … den
  rationale: Die korrelative deutsche Formulierung gibt den verallgemeinernden Relativsatz idiomatisch wieder und bewahrt den persönlichen Singular.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Ermahnung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: „Liebt“ ist die klare und unmittelbare Entsprechung von ἀγαπάω.
- source_word: κύριος
  choice: der Herr
  rationale: Der Titel wird in natürlichem Deutsch mit bestimmtem Artikel wiedergegeben.
- source_word: παιδεύει
  choice: erzieht
  rationale: παιδεύω bezeichnet hier eine formende, zurechtweisende Erziehung. „Erzieht“ hält diese pädagogische Dimension fest, ohne den Vorgang auf bloße Bestrafung zu verengen.
- source_word: μαστιγοῖ
  choice: geißelt
  rationale: Das starke Verb bezeichnet wörtlich das Schlagen mit einer Geißel. „Geißelt“ bewahrt die Härte des Bildes und seine würdige, traditionelle Ausdruckskraft.
- source_word: δὲ
  choice: und
  rationale: δέ führt hier den zweiten parallelen Satzteil weiter, ohne einen ausgeprägten Gegensatz zu markieren.
- source_word: πάντα υἱὸν
  choice: jeden Sohn
  rationale: Die Übersetzung bewahrt den ausdrücklich männlichen Singular und das für den Kontext zentrale Sohnschaftsbild; die repräsentative Reichweite wird in einer Fußnote erläutert.
- source_word: παραδέχεται
  choice: annimmt
  rationale: „Annimmt“ gibt das Aufnehmen beziehungsweise Anerkennen einer Person in einer natürlichen relationalen Form wieder.
theological_decisions:
- issue: Wiedergabe von υἱός im Zusammenhang mit Gottes Erziehung und der Sohnschaft
  choice: jeden Sohn
  alternative: jedes Kind
  rationale: Der griechische Text verwendet υἱός, und der Zusammenhang entfaltet ausdrücklich das Bild der Sohnschaft. Die Formulierung bleibt daher im Haupttext erhalten, während eine Fußnote ihre repräsentative Geltung für Gottes Kinder erläutert.
- issue: Stärke des Verbs μαστιγοῖ bei Gottes Erziehung
  choice: geißelt
  alternative: züchtigt; schlägt
  rationale: Das drastische Bild des Ausgangstextes wird nicht abgeschwächt. So bleibt die Spannung zwischen Gottes Liebe und schmerzhafter Erziehung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist knapp und sprichwortartig. „Erzieht“ wahrt die formende Bedeutung von παιδεύω, während „geißelt“ die bewusst drastische Metapher des griechischen Textes erhält.
