  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: de
  text: Haltet um der Erziehung willen stand.[a] Gott behandelt euch als Söhne.[b] Denn welcher Sohn wird nicht von einem Vater erzogen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Haltet das als Erziehung aus.« Das Griechische kann entweder als Aufforderung verstanden werden, um der Erziehung willen standzuhalten, oder das Erlittene als Erziehung anzusehen.'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: »Söhne«. Der Ausdruck gehört zum Vater-Sohn-Vergleich des Gedankengangs; die Anwendung ist nicht auf Männer beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: zur Erziehung
  rationale: 'Die Wendung wird zunächst ziel- bzw. zweckbezogen wiedergegeben: Das Durchhalten steht im Dienst der erziehenden Formung. Die ebenfalls mögliche Deutung »als Erziehung« wird in der Fußnote bewahrt.'
- source_word: ὑπομένετε
  choice: Haltet ... durch
  rationale: Die Form kann formal Indikativ oder Imperativ sein; im Zusammenhang liegt die auffordernde Lesart nahe. Die deutsche Wiedergabe ergänzt kein bestimmtes Objekt.
- source_word: ὡς υἱοῖς ... προσφέρεται ὁ θεός
  choice: Gott behandelt euch wie Söhne
  rationale: »Behandelt« gibt den idiomatischen Sinn von προσφέρεται natürlich wieder; »wie Söhne« erhält den ausdrücklich männlichen Vergleich und die Vater-Sohn-Argumentation.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: Denn wo ist ein Sohn, den sein Vater nicht erzieht?
  rationale: Die rhetorische Frage wird in natürlichem Deutsch wiedergegeben. »Sein Vater« macht die im Zusammenhang selbstverständliche Beziehung idiomatisch deutlich, obwohl das Possessivpronomen im Griechischen nicht ausdrücklich steht.
theological_decisions:
- issue: Geschlechtsspezifische Familiensprache im Vater-Sohn-Vergleich
  choice: »Söhne« im Haupttext beibehalten
  alternative: »Kinder«
  rationale: Das Argument verwendet ausdrücklich das Bild von Vater und Sohn. Die männliche Bildsprache bleibt deshalb erhalten; eine Fußnote stellt klar, dass die Aussage nicht auf Männer beschränkt ist.
- issue: Deutung von εἰς παιδείαν ὑπομένετε
  choice: Aufforderung, zur Erziehung durchzuhalten
  alternative: Das Erlittene als Erziehung ansehen und ertragen
  rationale: Die griechische Kurzform erlaubt beide Bezüge. Der Haupttext folgt der zweckbezogenen Deutung, während die echte syntaktische Mehrdeutigkeit in einer Fußnote offengelegt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erziehung« bewahrt den Zusammenhang zwischen παιδεία und παιδεύει und umfasst hier formende wie korrigierende Unterweisung. Die knappe rhetorische Struktur des Ausgangstextes bleibt erhalten.
