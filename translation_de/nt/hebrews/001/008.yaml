  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: de
  text: 'Über den Sohn aber sagt er[a]: »Dein Thron, o Gott, bleibt für immer und ewig, und das Zepter der Aufrichtigkeit[b] ist das Zepter deines Reiches.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »Gott ist dein Thron für immer und ewig.« Die griechische Syntax ist umstritten; die Anrede »Dein Thron, o Gott« passt jedoch am besten zum Zusammenhang und zur Aussagekraft des Zitats.'
    reason: syntaktische Alternative
  - marker: b
    text: 'Oder: »der Gerechtigkeit«. Das griechische Wort kann Aufrichtigkeit, Rechtschaffenheit oder Geradheit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Über den Sohn aber sagt er
  rationale: πρός mit Akkusativ kann nach einem ergänzten Verb des Sagens den Bezug bezeichnen. Die Wiedergabe macht den im Griechischen ausgelassenen Sprechakt natürlich verständlich und erhält den Kontrast des Abschnitts.
- source_word: υἱόν
  choice: den Sohn
  rationale: Der Artikel kennzeichnet die bestimmte, titelartige Bezeichnung und bewahrt den Gegensatz zu den Engeln.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Dein Thron, o Gott
  rationale: ὁ θεός wird hier am wahrscheinlichsten als Anrede verstanden. Das entspricht dem Zusammenhang der Schriftzitate in Hebräer 1; die grammatisch mögliche prädikative Deutung wird in der Fußnote bewahrt.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: für immer und ewig
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. Die deutsche Formulierung gibt ihren verstärkenden Charakter natürlich und würdig wieder.
- source_word: ῥάβδος
  choice: Zepter
  rationale: Im königlichen Zusammenhang bezeichnet ῥάβδος den Herrscherstab als Zeichen königlicher Vollmacht.
- source_word: τῆς εὐθύτητος
  choice: der Aufrichtigkeit
  rationale: εὐθύτης bezeichnet Geradheit, Aufrichtigkeit oder Rechtschaffenheit. »Aufrichtigkeit« bildet den unmittelbaren Wortsinn ab; »Gerechtigkeit« bleibt als kontextuell mögliche Alternative in der Fußnote erhalten.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: das Zepter deines Reiches
  rationale: βασιλεία kann Reich, Königsherrschaft oder Herrschaft bedeuten. »Reich« erhält das königliche Bild und entspricht einer natürlichen deutschen Ausdrucksweise.
theological_decisions:
- issue: Ob ὁ θεός den Sohn unmittelbar als Gott anredet oder prädikativ als »Gott ist dein Thron« zu verstehen ist.
  choice: 'Unmittelbare Anrede: »Dein Thron, o Gott«'
  alternative: »Gott ist dein Thron für immer und ewig«
  rationale: Die Anrede passt am besten zur Syntax des Zitats und zur Argumentation von Hebräer 1 über die einzigartige Stellung des Sohnes. Weil die andere Konstruktion grammatisch möglich und in der Auslegung diskutiert ist, wird sie nicht verschwiegen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelstil. Die direkte Gottes-Anrede bleibt im Haupttext erhalten; echte syntaktische und lexikalische Alternativen werden knapp in Fußnoten ausgewiesen.
