  variant: modern standard German
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: de
  text: 'Doch zu welchem der Engel hat er jemals gesagt: »Setz dich zu meiner Rechten, bis ich deine Feinde zum Schemel für deine Füße mache[a]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis ich deine Feinde unter deine Füße lege.«'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Doch zu welchem der Engel
  rationale: πρός mit τίνα nach einem Verb des Sagens bedeutet hier »zu wem«. δέ führt einen deutlichen Kontrast zum zuvor über die Engel Gesagten ein; »Doch« gibt diesen Übergang in natürlichem Deutsch wieder.
- source_word: εἴρηκέν ποτε
  choice: hat er jemals gesagt
  rationale: Das Perfekt εἴρηκεν wird mit dem deutschen Perfekt wiedergegeben und lässt die fortdauernde Geltung des Ausspruchs erkennen; ποτέ bedeutet hier »jemals«.
- source_word: Κάθου
  choice: Setz dich
  rationale: Der Imperativ wird in modernem Standarddeutsch natürlich mit »Setz dich« wiedergegeben. Das weniger idiomatische »Sitze« und das förmlichere »Nimm Platz« wurden vermieden.
- source_word: ἐκ δεξιῶν μου
  choice: zu meiner Rechten
  rationale: Die feste Wendung bezeichnet den Ehrenplatz an Gottes rechter Seite. »Zu meiner Rechten« bewahrt die biblische Thronbesteigungsformel und ist zugleich klares, heutiges Deutsch.
- source_word: ἕως ἂν θῶ
  choice: bis ich … mache
  rationale: ἕως ἂν mit Aorist Konjunktiv weist auf ein zukünftiges Geschehen. In Verbindung mit dem Prädikatsnomen ὑποπόδιον ist »zum … mache« im Deutschen idiomatisch.
- source_word: τοὺς ἐχθρούς σου
  choice: deine Feinde
  rationale: Direkte und unzweideutige Wiedergabe des griechischen Akkusativobjekts.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: zum Schemel für deine Füße
  rationale: Die Formulierung erhält das anschauliche Schriftbild der vollständigen Unterwerfung. »Schemel« ist verständlich und würdevoll; »für deine Füße« gibt den Genitiv natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Zitats aus Psalm 110,1 und seiner christologischen Funktion
  choice: 'Das direkte Thronbesteigungswort und das Bild vom Schemel bleiben erhalten: »Setz dich zu meiner Rechten, bis ich deine Feinde zum Schemel für deine Füße mache.«'
  alternative: 'Erklärende Paraphrase wie: »bis ich deine Feinde vollständig besiegt habe«'
  rationale: Die Argumentation des Hebräerbriefs beruht auf dem genauen Wortlaut des Schriftzitats und darauf, dass dieses Wort keinem Engel, sondern dem Sohn gilt. Eine Paraphrase würde das königliche Bild und seine argumentative Kraft abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die bildhafte Sprache des Psalmzitats bleiben erhalten; unnötig altertümliche oder erklärend-konfessionelle Formulierungen werden vermieden.
