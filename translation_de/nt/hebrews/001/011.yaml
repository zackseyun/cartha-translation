base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: de
  text: Sie werden vergehen, du aber bleibst; und sie alle werden wie ein Gewand verschleißen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild greift Psalm 102,26–28 auf und stellt die Vergänglichkeit der geschaffenen Ordnung dem fortdauernden Bleiben des Angesprochenen gegenüber. Oder: „werden wie ein Gewand alt werden“.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: sie
  rationale: Das Pronomen verweist auf Himmel und Erde im vorhergehenden Vers. Im Deutschen wird die Betonung vor allem durch den Kontrast mit „du“ deutlich.
- source_word: ἀπολοῦνται
  choice: werden vergehen
  rationale: Die Form bezeichnet hier das künftige Zugrundegehen beziehungsweise Aufhören des geschaffenen Kosmos. „Vergehen“ bewahrt die Stärke der Aussage, ohne einen ausdrücklich handelnden Zerstörer einzuführen.
- source_word: σὺ δὲ
  choice: du aber
  rationale: Das ausdrücklich gesetzte „du“ und „aber“ geben den scharfen Gegensatz zwischen der vergänglichen Schöpfung und dem Angesprochenen natürlich wieder.
- source_word: διαμένεις
  choice: bleibst
  rationale: διαμένω bezeichnet fortdauerndes Bleiben. Die knappe Wiedergabe entspricht dem Gegensatz zum Vergehen der Schöpfung.
- source_word: πάντες
  choice: sie alle
  rationale: Die Form fasst die zuvor genannten geschaffenen Größen gemeinsam zusammen und behält die umfassende Aussage bei.
- source_word: ὡς ἱμάτιον
  choice: wie ein Gewand
  rationale: ἱμάτιον bezeichnet allgemein ein Kleidungsstück oder Gewand. „Gewand“ ist würdig und bewahrt das Bild, ohne es auf eine bestimmte Art Kleidung einzuengen.
- source_word: παλαιωθήσονται
  choice: werden verschleißen
  rationale: Das Passiv von παλαιόω kann das Alt- oder Abgenutztwerden bezeichnen. „Verschleißen“ macht im Deutschen das Bild eines alternden Gewandes klar, ohne die Aussage zu überdeuten.
theological_decisions:
- issue: Angesprochene Person und christologische Aussage
  choice: Die direkte Anrede wird mit „du aber bleibst“ bewahrt.
  alternative: Eine erläuternde Benennung wie „der Sohn aber bleibt“ wäre im Vers selbst möglich, stünde jedoch nicht ausdrücklich im zitierten Wortlaut.
  rationale: Im Zusammenhang von Hebräer 1 wird das Psalmwort auf den Sohn bezogen. Die Übersetzung erhält diese direkte Anrede und ihre Aussagekraft, ohne zusätzliche Lehrbegriffe in den Text einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der markanten Gegenüberstellung des Griechischen; „verschleißen“ vermittelt die Gewandmetapher natürlich.
