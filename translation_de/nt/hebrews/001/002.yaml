  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: de
  text: In diesen letzten Tagen hat er durch einen Sohn[a] zu uns gesprochen, den er zum Erben von allem eingesetzt hat und durch den er auch die Zeitalter erschaffen hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: „in einem Sohn“. Im Griechischen steht vor „Sohn“ kein Artikel; die Formulierung betont die Weise und den Höhepunkt von Gottes Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Universum“ beziehungsweise „die Welten“. Das griechische Wort bedeutet wörtlich „die Zeitalter“, kann aber auch die gesamte geschaffene Weltordnung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: am Ende dieser Tage
  rationale: Die Formulierung gibt die zeitliche Wendung eng am Griechischen wieder und bewahrt ihren endzeitlichen Nachdruck. „In diesen letzten Tagen“ wäre idiomatischer, würde aber die Konstruktion mit ἐπ’ ἐσχάτου weniger deutlich abbilden.
- source_word: ἐλάλησεν ἡμῖν
  choice: hat er zu uns … gesprochen
  rationale: Das deutsche Perfekt bezeichnet die abgeschlossene, für die Gegenwart maßgebliche Rede Gottes natürlich und hält den Bezug zu Vers 1 offen.
- source_word: ἐν υἱῷ
  choice: in einem Sohn
  rationale: Die ungewöhnliche Wendung bewahrt sowohl die Präposition ἐν als auch das Fehlen des Artikels vor υἱῷ. Sie hebt die besondere Weise von Gottes abschließendem Reden hervor, ohne stillschweigend „durch seinen Sohn“ einzusetzen.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: Ihn hat er zum Erben aller Dinge eingesetzt
  rationale: „Einsetzen“ gibt τίθημι in der Bedeutung der Bestimmung zu einer Stellung idiomatisch wieder; „aller Dinge“ wahrt den umfassenden Sinn von πάντων.
- source_word: δι’ οὗ
  choice: durch ihn
  rationale: διά mit dem Genitiv bezeichnet hier vermittelnde Mitwirkung. Die Auflösung des Relativsatzes ergibt im Deutschen einen klaren, würdigen Satzfluss.
- source_word: ἐποίησεν
  choice: geschaffen
  rationale: Im kosmologischen Zusammenhang ist „geschaffen“ im Deutschen natürlicher und eindeutiger als „gemacht“. Es konkretisiert ποιέω kontextgemäß, ohne die Aussage über das Mittel der Schöpfung zu verändern.
- source_word: τοὺς αἰῶνας
  choice: die Zeitalter
  rationale: Die Wiedergabe hält die zeitliche Grundbedeutung des Plurals sichtbar und lässt zugleich den im Kontext möglichen Bezug auf die gesamte geschaffene Weltordnung offen.
theological_decisions:
- issue: Christologische Aussage von ἐν υἱῷ
  choice: „in einem Sohn“ unter Wahrung der artikellosen griechischen Form
  alternative: „durch einen Sohn“, „im Sohn“ oder „durch seinen Sohn“
  rationale: Die ungewöhnliche Ausdrucksweise soll nicht zu einer bloßen Angabe des handelnden Mittlers verengt oder durch einen im Griechischen nicht ausgedrückten Possessivartikel präzisiert werden. Der Zusammenhang identifiziert diesen Sohn eindeutig, während die Formulierung die Art und den Höhepunkt von Gottes Reden betont.
- issue: Umfang von τοὺς αἰῶνας
  choice: „die Zeitalter“ im Haupttext mit Erläuterung der kosmischen Bedeutung
  alternative: „das Universum“, „die Welten“ oder „die Welt“
  rationale: Der griechische Ausdruck kann sowohl die Zeiten als auch, davon ausgehend, die gesamte geschaffene Weltordnung bezeichnen. Die Übersetzung bewahrt diese zeitlich-kosmische Spannung, statt sie einseitig auf Raum oder Zeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewohnte Wendung „in einem Sohn“ und das Wort „Zeitalter“ sind bewusst beibehalten, damit genuine Mehrdeutigkeit und rhetorisches Gewicht des griechischen Textes nicht eingeebnet werden. Die Satzteilung nach „gesprochen“ verbessert die deutsche Lesbarkeit, ohne die logischen Beziehungen zu verändern.
