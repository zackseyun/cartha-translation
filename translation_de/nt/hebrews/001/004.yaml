  terminology: „Überlegen“ trifft den hier gemeinten Vorrang gegenüber Engeln gut. „Ausgezeichneter“ ist für διαφορώτερον idiomatischer als „vorzüglicher“ und bewahrt den vergleichenden Charakter. Die alternative Fußnote mit „besser geworden“ ist im Deutschen missverständlich, weil diese Verbindung gewöhnlich eine Besserung eines Zustands bezeichnet, nicht einen Vorrang im Rang.
