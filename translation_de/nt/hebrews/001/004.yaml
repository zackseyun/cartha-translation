source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: de
  text: Er ist den Engeln in dem Maß überlegen geworden, wie der Name, den er geerbt hat, ausgezeichneter ist als ihr Name.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κρείττων kann auch mit „besser“ wiedergegeben werden; im vorliegenden Rangvergleich ist „überlegen“ eindeutiger.
    reason: lexical_alternative
  - marker: b
    text: Der folgende Zusammenhang verdeutlicht, dass mit dem „Namen“ die Bezeichnung und Stellung des Sohnes gemeint ist.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: um so viel ... wie
  rationale: Die korrelative Konstruktion bezeichnet ein proportionales Verhältnis und wird im Deutschen natürlich mit „um so viel … wie“ wiedergegeben.
- source_word: κρείττων
  choice: überlegen
  rationale: Im Vergleich mit den Engeln geht es hier vor allem um Rang und Stellung; „überlegen“ vermeidet den möglichen moralischen Beiklang von „besser“.
- source_word: γενόμενος
  choice: ist ... geworden
  rationale: Die Wiedergabe bewahrt den Aussagewert des Aoristpartizips, ohne durch „gemacht worden“ eine Erschaffung des Sohnes nahezulegen.
- source_word: τῶν ἀγγέλων
  choice: den Engeln
  rationale: Der Genitiv nach dem Komparativ wird im Deutschen idiomatisch durch den Dativ bei „überlegen“ ausgedrückt.
- source_word: διαφορώτερον
  choice: vorzüglicher
  rationale: Das Wort bezeichnet hier eine größere Auszeichnung oder Vortrefflichkeit und setzt den wertenden Vergleich fort.
- source_word: παρ’ αὐτοὺς
  choice: als der ihre
  rationale: Der Vergleich bezieht sich sinngemäß auf den Namen der Engel; das Possessivpronomen macht diesen Bezug knapp und grammatisch deutlich.
- source_word: κεκληρονόμηκεν
  choice: den er geerbt hat
  rationale: Das Perfekt beschreibt einen vollzogenen Erwerb mit fortbestehendem Ergebnis; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: ὄνομα
  choice: der Name
  rationale: Der bestimmte Artikel ist im Deutschen kontextgemäß; die folgenden Verse erläutern, welcher Name beziehungsweise welche Sohnesstellung gemeint ist.
theological_decisions:
- issue: Christologische Bedeutung von γενόμενος
  choice: „ist … geworden“ wird unverändert beibehalten und auf die im Kontext beschriebene erhöhte Stellung bezogen.
  alternative: „ist gemacht worden“ oder eine Paraphrase, die eine Erschaffung beziehungsweise erst spätere Göttlichkeit behauptet.
  rationale: Die Formulierung wahrt den griechischen Wortlaut und das Erhöhungsmotiv, ohne eine ontologische Deutung einzutragen, die der Vers nicht ausdrücklich formuliert.
- issue: Bedeutung von ὄνομα
  choice: Wörtlich „der Name“, wobei der folgende Kontext ihn als Sohnesbezeichnung und damit verbundene Stellung erkennen lässt.
  alternative: Explizit „der Titel Sohn“ oder allgemeiner „Rang/Ehre“.
  rationale: „Name“ bewahrt den literarischen Fortgang und lässt die nachfolgenden Zitate selbst die Bedeutung entfalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die proportionale Satzstruktur des Griechischen bleibt erhalten; „überlegen“ und „vorzüglicher“ geben den Rangvergleich verständlich und würdevoll wieder.
