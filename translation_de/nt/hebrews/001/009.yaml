id: HEB.1.9
reference: Hebrews 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: de
  text: Du hast Gerechtigkeit[a] geliebt und Gesetzlosigkeit gehasst; darum hat dich Gott, dein Gott, mit dem Öl der Freude gesalbt, mehr als deine Gefährten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Recht«. Das griechische Wort kann sowohl Gerechtigkeit als auch gerechtes Recht beziehungsweise gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: hast … geliebt
  rationale: Das Perfekt gibt im Deutschen die vollzogene Handlung mit ihrer fortdauernden Bedeutung natürlich wieder und bildet einen klaren Parallelismus mit »gehasst«.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« bewahrt den moralischen und theologischen Bedeutungsumfang von δικαιοσύνη; die kontextuell mögliche Nuance »Recht« wird in einer Fußnote genannt.
- source_word: ἐμίσησας
  choice: gehasst
  rationale: Das starke Verb erhält den scharfen moralischen Gegensatz zu »geliebt«.
- source_word: ἀνομίαν
  choice: Gesetzlosigkeit
  rationale: Die Wiedergabe bildet die Bedeutung eines Handelns gegen Gesetz und Ordnung direkt ab und bewahrt den Gegensatz zu »Gerechtigkeit«.
- source_word: διὰ τοῦτο
  choice: darum
  rationale: »Darum« stellt den kausalen beziehungsweise folgernden Zusammenhang knapp und idiomatisch her.
- source_word: ἔχρισέν σε
  choice: hat dich … gesalbt
  rationale: »Salben« erhält die königliche und messianische Bildsprache; das deutsche Perfekt klingt gegenwärtig und würdevoll.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Gott, dein Gott
  rationale: Die Wiederholung und die relationale Aussage des griechischen Textes bleiben ohne erklärenden Zusatz erhalten.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: mit dem Öl der Freude
  rationale: Die biblische Salbungsmetapher und der festliche Sinn von ἀγαλλίασις werden in verständlichem, gehobenem Deutsch bewahrt.
- source_word: παρὰ τοὺς μετόχους σου
  choice: mehr als deine Gefährten
  rationale: παρά mit Akkusativ drückt hier einen Vergleich aus; »mehr als« macht die überragende Salbung deutlich, ohne den Vergleich unnötig auszudeuten.
- source_word: μετόχους
  choice: Gefährten
  rationale: »Gefährten« gibt die personale Verbundenheit wieder und vermeidet die geschäftliche Färbung von »Partner«.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« bewahrt die moralische und theologische Weite des Begriffs. Da im königlichen Kontext auch gerechtes Rechtshandeln anklingen kann, wird »Recht« als mögliche Wiedergabe in der Fußnote erhalten.
- issue: Christologische Spannung in »Gott, dein Gott«
  choice: Wortlaut ohne dogmatische Erweiterung beibehalten
  alternative: Eine erklärende Umschreibung der Beziehung zwischen dem Sohn und Gott
  rationale: Der Text verbindet die erhabene Anrede des Sohnes mit der Aussage »dein Gott«. Diese Spannung wird weder abgeschwächt noch durch eine konfessionelle Erklärung im Bibeltext aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus »geliebt … gehasst« und die bildhafte Sprache der Salbung bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
