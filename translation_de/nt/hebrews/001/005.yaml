  variant: modern standard German
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: de
  text: 'Denn zu welchem der Engel hat er jemals gesagt: »Du bist mein Sohn; heute habe ich dich gezeugt«[a] und wiederum: »Ich werde ihm Vater sein, und er wird mir Sohn sein«?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste Zitat stammt aus Psalm 2,7. »Heute habe ich dich gezeugt« wird unter anderem auf königliche Inthronisation, Auferstehung oder das ewige Verhältnis des Sohnes zum Vater bezogen. Die Übersetzung entscheidet nicht zwischen diesen Deutungen.
    reason: cross_reference
  - marker: b
    text: 'Das zweite Zitat stammt aus 2. Samuel 7,14. Idiomatischer: »Ich werde sein Vater sein, und er wird mein Sohn sein.«'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ ... τῶν ἀγγέλων
  choice: Denn zu welchem der Engel
  rationale: Die Frageform mit dem partitiven Genitiv wird im Deutschen natürlich und genau wiedergegeben; »denn« bewahrt den begründenden Anschluss an den vorherigen Gedankengang.
- source_word: εἶπέν ποτε
  choice: hat er jemals gesagt
  rationale: Das deutsche Perfekt mit »jemals« gibt in der rhetorischen Frage die Suche nach irgendeinem denkbaren Fall idiomatisch wieder.
- source_word: ἀγγέλων
  choice: Engel
  rationale: Im Zusammenhang von Hebräer 1 sind himmlische Engel, nicht menschliche Boten, gemeint.
- source_word: Υἱός μου εἶ σύ
  choice: Du bist mein Sohn
  rationale: Natürliche deutsche Wortstellung, die die direkte Anrede und die Sohn-Bezeichnung klar bewahrt.
- source_word: σήμερον γεγέννηκά σε
  choice: heute habe ich dich gezeugt
  rationale: »Gezeugt« bildet γεννάω präzise ab und bewahrt die königliche und theologisch vielschichtige Sprache des Zitats, ohne sie auslegend aufzulösen.
- source_word: καὶ πάλιν
  choice: Und weiter
  rationale: Die Wendung führt ein weiteres Schriftzitat ein. »Und weiter« vermeidet im Deutschen den möglichen Eindruck, dieselbe Aussage werde lediglich wiederholt.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Ich werde ihm Vater sein
  rationale: Die knappe Form bewahrt die εἰς-Konstruktion und ihren feierlichen, bundestheologischen Klang, bleibt aber verständliches Deutsch.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: und er wird mir Sohn sein
  rationale: Die parallele Form entspricht der ersten Satzhälfte und erhält die formelle Struktur des Zitats.
theological_decisions:
- issue: Bedeutung von »heute habe ich dich gezeugt«
  choice: Die Zeugungssprache bleibt im Bibeltext unaufgelöst stehen.
  alternative: Sie ausdrücklich als Inthronisation, Auferstehung oder ewiges Verhältnis des Sohnes zum Vater deuten.
  rationale: Das Zitat aus Psalm 2,7 trägt mehrere traditionsreiche Deutungsbezüge. Der griechische Wortlaut legt an dieser Stelle keine einzelne davon ausdrücklich fest.
- issue: Sohn-Bezeichnung in beiden Zitaten
  choice: In beiden Zitaten steht »Sohn« als auf Christus bezogene Bezeichnung, ohne zusätzliche dogmatische Präzisierung.
  alternative: Das zweite Vorkommen durch eine Umschreibung abschwächen oder beide Vorkommen ausdrücklich dogmatisch erläutern.
  rationale: Hebräer wendet beide Schriftworte auf den Sohn an; zugleich bleibt der besondere Bundeswortlaut aus 2. Samuel 7,14 erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schriftzitate behalten bewusst einen leicht feierlichen, formnahen Klang. Die rhetorische Frage bleibt klar und flüssig; genuine theologische Mehrdeutigkeit wird nicht aufgelöst.
