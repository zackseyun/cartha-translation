  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: de
  text: Und wie einen Mantel wirst du sie zusammenrollen; wie ein Gewand werden sie verändert werden. Du aber bist derselbe, und deine Jahre werden kein Ende haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »Deine Jahre werden nicht aufhören« / »nicht vergehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: wie einen Mantel
  rationale: Die Wendung führt einen Vergleich ein; »Mantel« gibt ein um den Körper gelegtes äußeres Kleidungsstück natürlich und in würdigem Register wieder.
- source_word: ἑλίξεις
  choice: wirst du sie zusammenrollen
  rationale: Das Futur von ἑλίσσω bezeichnet hier das Einrollen oder Zusammenrollen und bewahrt das anschauliche Bild, dass die Schöpfung wie ein Kleid behandelt wird.
- source_word: αὐτούς
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist im Zusammenhang auf die zuvor genannten Himmel; »sie« wahrt diesen Rückbezug.
- source_word: ὡς ἱμάτιον
  choice: wie ein Gewand
  rationale: Die zweite Kleidungsmetapher bleibt im Singular erhalten; »Gewand« ist verständlich und zugleich poetisch gehoben.
- source_word: ἀλλαγήσονται
  choice: werden sie verändert werden
  rationale: Die passive Form wird bewahrt und bezeichnet eine Veränderung, die der geschaffenen Ordnung widerfährt.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Du aber bleibst derselbe
  rationale: »Du aber« bildet den starken Gegensatz zur veränderlichen Schöpfung. Das idiomatische »bleibst derselbe« drückt die fortdauernde Selbigkeit aus, ohne zusätzliche dogmatische Fachsprache einzuführen.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: deine Jahre werden kein Ende haben
  rationale: Die Zeitmetapher »deine Jahre« bleibt erhalten; »kein Ende haben« gibt ἐκλείπω hier natürlich als Nicht-Aufhören wieder.
theological_decisions:
- issue: Aussage über die Beständigkeit des angesprochenen Sohnes im christologischen Zitat
  choice: Du aber bleibst derselbe
  alternative: Du aber bist derselbe
  rationale: Der Text stellt die Veränderlichkeit der Schöpfung der bleibenden Identität des Angesprochenen gegenüber. »Bleibst derselbe« macht diesen zeitlichen Kontrast im Deutschen deutlich, ohne die Aussage durch spätere technische Begriffe wie »unveränderlich« auszuweiten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Klang. Der Parallelismus der Kleidungsbilder und der Gegensatz zwischen veränderlicher Schöpfung und bleibender Identität werden erhalten.
