  naturalness: Die Fassung ist insgesamt modernes, verständliches Standarddeutsch mit angemessen poetisch-erhabenem Register. »Sie werden verändert werden« bewahrt das Passiv und ist trotz der doppelten Verbform in diesem poetischen Kontext gut verständlich.
