source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: de
  text: Er ist der Abglanz seiner Herrlichkeit und das genaue Abbild seines Wesens[a] und trägt alles durch das Wort seiner Macht. Nachdem er durch sich selbst[b] die Reinigung von den Sünden bewirkt hatte, setzte er sich zur Rechten der Majestät in der Höhe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der genaue Abdruck seiner Wirklichkeit/Substanz“. Das griechische Wort χαρακτήρ bezeichnet ursprünglich den eingeprägten Abdruck, ὑπόστασις die zugrunde liegende Wirklichkeit.'
    reason: lexical_alternative
  - marker: b
    text: Einige Handschriften lassen „durch sich selbst“ aus. Die Übersetzung folgt hier der Lesart des SBLGNT.
    reason: textual_variant
  - marker: c
    text: 'Wörtlich: „in den Höhen“; sinngemäß auch: „droben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: Abglanz
  rationale: „Abglanz“ bewahrt das Bild des von der Herrlichkeit ausgehenden Glanzes und vermeidet die Abschwächung zu einer bloßen Spiegelung.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Die etablierte und gewichtige deutsche Wiedergabe für Gottes göttlichen Glanz und seine Majestät.
- source_word: χαρακτήρ
  choice: genaues Abbild
  rationale: Die Formulierung vermittelt die präzise Entsprechung, die im Bild eines eingeprägten Abdrucks liegt, in natürlichem modernem Deutsch.
- source_word: ὑπόστασις
  choice: Wesen
  rationale: „Wesen“ bezeichnet hier die zugrunde liegende Wirklichkeit, ohne den Satz unnötig mit späterer metaphysischer Fachsprache zu belasten.
- source_word: φέρων
  choice: trägt
  rationale: „Trägt“ erhält das konkrete Bild und bezeichnet zugleich das fortwährende Erhalten und Lenken von allem.
- source_word: τὰ πάντα
  choice: alles
  rationale: Die umfassende Formulierung bleibt ebenso weit wie das Griechische und beschränkt die Aussage nicht auf das materielle Universum.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: durch das Wort seiner Macht
  rationale: Die bewusst verdichtete genitivische Wendung des Griechischen bleibt erhalten; gemeint ist sein machtvolles Wort, ohne dass diese Deutung in den Haupttext eingetragen wird.
- source_word: δι’ αὑτοῦ
  choice: durch sich selbst
  rationale: Dies gibt die im SBLGNT gedruckte Lesart und die gewöhnliche instrumentale beziehungsweise vermittelnde Kraft der Präposition wieder.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: die Reinigung von den Sünden
  rationale: „Reinigung“ bewahrt den kultisch-sühnebezogenen Klang; „von den Sünden“ ist idiomatisch und lässt offen, wie der Genitiv im Einzelnen zu bestimmen ist.
- source_word: ποιησάμενος
  choice: nachdem er … bewirkt hatte
  rationale: Die Vorzeitigkeit des Aoristpartizips gegenüber dem Sichsetzen wird klar und natürlich ausgedrückt.
- source_word: ἐν δεξιᾷ
  choice: zur Rechten
  rationale: Die feste deutsche Wendung bezeichnet den Ehren- und Herrschaftsplatz, ohne den Bildcharakter aufzulösen.
- source_word: ἐν ὑψηλοῖς
  choice: in der Höhe
  rationale: Die idiomatische deutsche Wendung bewahrt den räumlich-erhabenen Sinn des substantivierten griechischen Plurals.
theological_decisions:
- issue: Ontologische Tragweite von ὑπόστασις
  choice: Wesen
  alternative: Substanz; Wirklichkeit; Natur
  rationale: „Wesen“ wahrt die starke Aussage über Gottes eigene Wirklichkeit, ohne den Wortlaut unmittelbar in die technische Terminologie späterer Bekenntnisse zu überführen.
- issue: Christologische Kraft von ἀπαύγασμα und χαρακτήρ
  choice: Abglanz und genaues Abbild
  alternative: Widerschein und Darstellung
  rationale: Die gewählten Wörter erhalten die enge Teilhabe an Gottes Herrlichkeit und die genaue Entsprechung zu seinem Wesen; schwächere Repräsentationsbegriffe würden die Aussage unnötig verdünnen.
- issue: Textvariante bei δι’ αὑτοῦ
  choice: „durch sich selbst“ im Haupttext
  alternative: Auslassung der Wendung
  rationale: Die Wendung steht im vorgegebenen SBLGNT-Text und wird deshalb übersetzt; ihre Auslassung in einem Teil der Überlieferung wird transparent in einer Fußnote genannt.
- issue: Bezug der Majestät
  choice: Majestät als ehrfürchtige Umschreibung Gottes beibehalten
  alternative: Gott
  rationale: Die metonymische und ehrfürchtige Ausdrucksweise des griechischen Textes soll nicht erklärend aufgelöst werden.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit biblischer Würde. Die lange griechische Satzbewegung bleibt erkennbar, wird jedoch durch klare deutsche Partizipial- und Nebensatzstrukturen lesbar gemacht. Traditionsreiche Begriffe wie „Herrlichkeit“, „Wesen“, „Majestät“ und „zur Rechten“ bleiben erhalten, während unnötig archaische Formen vermieden werden.
