  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: de
  text: Sind sie nicht alle dienende Geister, ausgesandt zum Dienst für die, die das Heil erben werden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die im Begriff sind, das Heil zu erben“. Der griechische Ausdruck bezeichnet eine zukünftige Erwartung und kann je nach Zusammenhang auch ein bevorstehendes Geschehen nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πάντες
  choice: Sind sie nicht alle
  rationale: Die rhetorische Frage erwartet Zustimmung; die deutsche Form bewahrt sowohl diese Funktion als auch den umfassenden Sinn von πάντες.
- source_word: λειτουργικὰ πνεύματα
  choice: dienende Geister
  rationale: λειτουργικός bezeichnet einen zum Dienst bestimmten, teils auch sakral geprägten Dienst. „Dienende Geister“ ist verständlich und würdevoll, ohne ein kirchliches Amt nahezulegen.
- source_word: εἰς διακονίαν
  choice: zum Dienst
  rationale: Die Präpositionalphrase bezeichnet den Zweck; die Substantivform bleibt erhalten und klingt im Deutschen natürlich.
- source_word: ἀποστελλόμενα
  choice: ausgesandt
  rationale: Das passive Partizip beschreibt die Geister als von einem anderen ausgesandt. Die knappe deutsche Partizipialform vermeidet eine unnötig schwerfällige Verlaufsform.
- source_word: διὰ τοὺς
  choice: für die
  rationale: διά mit Akkusativ bezeichnet hier den Bezug zugunsten der betreffenden Menschen; „für“ gibt den benefaktiven Sinn natürlich wieder.
- source_word: τοὺς μέλλοντας κληρονομεῖν
  choice: die … erben werden
  rationale: μέλλω mit Infinitiv ist hier zukunftsbezogen. Das Futur ist im Deutschen idiomatischer als „im Begriff sind“ und vermeidet, eine unmittelbar bevorstehende Erfüllung stärker zu behaupten, als der Kontext verlangt.
- source_word: σωτηρίαν
  choice: das Heil
  rationale: „Das Heil“ ist eine geläufige, würdige Wiedergabe von σωτηρία und bewahrt hier dessen umfassenden sowie eschatologischen Sinn.
theological_decisions:
- issue: Zukunftsbezug von μέλλοντας κληρονομεῖν σωτηρίαν
  choice: die das Heil erben werden
  alternative: die im Begriff sind, das Heil zu erben
  rationale: Die Übersetzung erhält Zukunftsbezug und Erbmotiv, legt jedoch weder eine besondere Lehre von Vorherbestimmung noch den genauen zeitlichen Abstand des Erbens fest.
- issue: Identität der λειτουργικὰ πνεύματα
  choice: Geister, ohne erläuternden Zusatz „Engel“
  alternative: dienende Engelwesen
  rationale: Der Zusammenhang bezieht sich auf Engel, doch der griechische Wortlaut sagt hier ausdrücklich „Geister“. Die Übersetzung bewahrt diese Ausdrucksweise und überlässt die Identifikation dem Kontext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage, die Dienstsprache und das Erbmotiv bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
